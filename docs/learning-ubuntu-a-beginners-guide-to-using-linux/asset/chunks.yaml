    Important Note: WordPress updates constantly so your version may be different.


    ![](images/00018.jpeg)


    If you have this, then you can log into your VPS.  We can now install a package
    to unzip the WordPress files if one is not already included.


    ## Unzipping .Zip Files


    | Install the Unzip Package |


    | Command | sudo apt-get install unzip |


    | Result | System will install the unzip package |


    The DigitalOcean VPS does not come with this, so we will need to install unzip. 
    The installation process should begin to look familiar.  Again, we use sudo to
    give milo extra access to install packages and make system changes.


    Once the installation is complete, change to the /var/www directory.


    | Changing to /var/www Directory |


    | Command | cd /var/www/ |


    | Result | System will move to the www child directory under var. |


    By now a lot of this should be getting easy with navigating and installing software.


    Once we are in the /var/www directory, use the ls command.  By using this we can
    see our WordPress zip file.  Now let’s use unzip to extract those files.


    | Unzipping a Zip File |


    | Command | unzip wordpress-4.4.2.zip |


    | Result | System will unzip the file wordpress-4.4.2.zip |


    Important Note Recap: WordPress updates constantly so your version may be different.
    Your .zip file name may vary.


    Run ls again and you will notice that we now have a WordPress folder.


    In the next several pages, by changing the Apache configuration file and continue
    the discussion on permissions for this practical use.


    ## Modifying Apache2 Site Configuration


    Since WordPress’s zip file creates a new directory in the www directory, we need
    to tell Apache to point to the new directory.  You can host a variety of sites
    on your server by creating configuration files in the sites-available directory,
    which is located at /etc/apache2/sites-available.


    Let’s change to this directory using cd and see what is in there using the ls
    command.


    | Moving to Site-Available and Listing Files |


    | Command | cd /etc/apache2/sites-available; ls |


    | Result | System will move milo to sites-available and list the site configuration
    files. |


    | CLI Display | milo@ubuntu:~$ cd /etc/apache2/sites-available; ls000-default.conf
    default-ssl.conf |


    If you host multiple sites, you will need multiple configuration files.  This
    book will explain how to enable and disable these configurations, but to understand
    them more in-depth, I would recommend finding a detailed guide on Apache configurations. 
    That’s a book in itself, but I will try to cover the basics.


    For what we are doing, we will want to modify the               000-default.conf
    file. Just as a point of reference, this is the default Apache site configuration
    file.  Remember that to use nano to edit this file milo will need super user access
    by using sudo.


    | Using nano to Modify 000-default.conf |


    | Command | sudo nano 000-default.conf |


    | Result | System will launch nano to edit the 000-default.conf file. |


    Below are the contents of the 000-default.conf file.


    | 000-default.conf |


    | <VirtualHost *:80>        # The ServerName directive sets the request scheme,
    hostname and port t$        # the server uses to identify itself. This is used
    when creating        # redirection URLs. In the context of virtual hosts, the
         ServerName        # specifies what hostname must appear in the request''s
    Host: header to        # match this virtual host. For the default virtual host
    (this file) this        # value is not decisive as it is used as a last resort
    host regardless.        # However, you must set it for any further virtual host
    explicitly.        #ServerName www.example.com        ServerAdmin webmaster@localhost       
    DocumentRoot /var/www/html       # Available loglevels: trace8, ..., trace1, debug,
    info, notice,        # error, crit, alert, emerg.        # It is also possible
    to configure the loglevel for particular        # modules, e.g. LogLevel info
    ssl:warn        ErrorLog ${APACHE_LOG_DIR}/error.log        CustomLog ${APACHE_LOG_DIR}/access.log
    combined  # For most configuration files from conf-available/, which are  # enabled
    or disabled at a global level, it is possible to  # include a line for only one
    particular virtual host. For example  # the following line enables the CGI configuration
    for this host   # only after it has been globally disabled with "a2disconf".   
    #Include conf-available/serve-cgi-bin.conf</VirtualHost> |


    As we look at this file it may appear overwhelming.  What is important to know
    is that lines that start with the pound/hash sign (#) are comments used to help
    users understand how to use it.


    If we omit the comments in this file, it is much easier to digest.  Leave the
    comments in your file, you may need them for reference, but below you can see
    the substance of this configuration file without them.


    | 000-default.conf |


    | <VirtualHost *:80>        #ServerName www.example.com        ServerAdmin webmaster@localhost       
    DocumentRoot /var/www/html        ErrorLog ${APACHE_LOG_DIR}/error.log       
    CustomLog ${APACHE_LOG_DIR}/access.log combined</VirtualHost> |


    This is the basic framework in the configuration that outlines: domain name, server
    admin, document root location, and the location for error logs.


    I left the one comment “#ServerName www.example.com”.  We will get back to this
    in a later chapter.  It is commented out because we do not have a domain name
    pointing to this server yet.


    What we need to update is the DocumentRoot line and the ServerAdmin line.  You
    may enter your email address in the ServerAdmin line. 


    Change the DocumentRoot to the following: /var/www/wordpress


    When you are done, the configuration (excluding comments) should look like the
    one on the next page.


    | 000-default.conf (Updated) |


    | <VirtualHost *:80>        #ServerName www.example.com       ServerAdmin info@nathanneil.com 
          DocumentRoot /var/www/wordpress        ErrorLog ${APACHE_LOG_DIR}/error.log       
    CustomLog ${APACHE_LOG_DIR}/access.log combined</VirtualHost> |


    Once the changes have been made, use control and x to exit.  Hit Y and Enter to
    save the changes. 


    Before we move back into talking about changing permissions, we should consider
    how to enable and disable site configurations.


    | Disable a Site Configuration |


    | Command | sudo a2dissite 000-default.conf |


    | Result | System will disable the site configuration for 000-default. |


    | CLI Display | milo@ubuntu:/var/apache2/sites-available$ sudo a2dissite 000-default.confSite
    000-default disabledTo activate the new configuration, you will need to run service
    apache2 reload.milo@ubuntu:/var/apache2/sites-available$ |'
