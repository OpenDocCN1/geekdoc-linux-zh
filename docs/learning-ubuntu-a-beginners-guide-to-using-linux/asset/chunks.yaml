- fmt: "\n`sudo` before a command, will allow our user, `milo`, to be able to elevate\
    \ it to higher security privileges to install software and make changes. `sudo`\
    \ runs the command as a super user, even though the user `milo` would normally\
    \ only have more limited access. This will come together soon, when we dive into\
    \ using it, but first we need to create `milo`’s account.\n\n| Add a New User\
    \ |\n| Command | `adduser milo` |\n| Result | System sets up user `milo` |\n|\
    \ CLI Display | `root@ubuntu:/# adduser miloAdding user ‘milo’ …` |\n\nOnce you\
    \ run that command, the system will then have you setup the account. You will\
    \ be prompted for a password first. Then it will prompt you for user information,\
    \ such as Full Name that you can skip by pressing `ENTER` for default settings.\
    \ If this was a production system, adding the name, room number, work phone, home\
    \ phone, and other information could be useful, but for right now there is no\
    \ reason not to skip through it. Once you have reached the end, you will need\
    \ to enter `Y` and then press enter.\n\nYou can see a screenshot of my process\
    \ adding `milo` below, if you need some added help.\n\n![](images/00008.jpeg)\n\
    \nEarlier, we learned how to change our password. If you are `root` or a `sudo`\
    \ user you can change a user’s password as well by following the steps below.\
    \ Since we just set `milo`’s password you may not want to change it, but these\
    \ are the steps you would take.\n\n| Change a User’s Password |\n| Command | `passwd\
    \ milo` |\n| Result | System will prompt for you to set a new password for user\
    \ milo. |\n| CLI Display | `root@ubuntu:/# passwd miloEnter new UNIX password:Retype\
    \ new UNIX password:passwd: password updated successfully` |\n\nOk, so now that\
    \ we have `milo` setup, we still need to grant him access to `sudo`. We would\
    \ only do this for users, who may need to increase their security privileges.\n\
    \nFirst we need to open the sudoer’s configuration file to modify it. We can do\
    \ this by using the `visudo` command.\n\n| Giving a User Sudo Privileges |\n|\
    \ Command | `visudo` |\n| Result | System will open the sudoer’s file. |\n| CLI\
    \ Display | `root@ubuntu:/# visudo# This file MUST be edited with the 'visudo'\
    \ command as root.## Please consider adding local content in /etc/sudoers.d/ instead\
    \ of# Directly modifying this file.## See the man page for details on how to write\
    \ a sudoers file.#Defaults      env_resetDefaults      mail_badpassDefaults  \
    \    secure_path=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
    # Host alias specification# User alias specification# Cmnd alias specification#\
    \ User privilege specificationroot    ALL=(ALL:ALL) ALL…` |\n\n### Configuring\
    \ Sudo Privileges\n\nThere is a lot of text in this file, but do not be intimidated.\
    \ In the table above I highlighted: `root ALL=(ALL:ALL) ALL`.\n\nBelow that selection\
    \ we need to add the following:\n\n`milo    ALL=(ALL:ALL) ALL`\n\nPress the down\
    \ key until you are in the blank space under `root` in User privilege specification.\
    \ Once there type `milo`, press `tab`, type `ALL=(ALL:ALL)`, then press space,\
    \ and type `ALL`. Now press the control key and `X`. The system will ask you if\
    \ you wish to save modified buffer. Press `Y` and press enter.\n\nNow you can\
    \ breathe. I know we dived in deep a little fast, but it is important that we\
    \ start using a user id other than `root`. It is also important that at the same\
    \ time we can install software and learn more, so this was needed.\n\nBefore we\
    \ move on, we can learn two quick commands. Right now there is probably a lot\
    \ of text on your CLI. If you want to clean that up, we can use the `clear` command.\n\
    \n| Clearing the Screen |\n| Command | `clear` |\n| Result | System will clear\
    \ the screen |\n| CLI Display | `root@ubuntu:/# clear` |\n\nNow that we have a\
    \ clear screen we can close out of PuTTY, before continuing on our new user id,\
    \ `milo`.\n\n| Logging Out |\n| Command | `exit` |\n| Result | System will close\
    \ SSH session and exit PuTTY |\n| CLI Display | `root@ubuntu:/# exit` |\n\n##\
    \ Quick Recap\n\n1. We should avoid using the `root` user as a good usage practice.\n\
    2. `sudo` before a command, allows a user to have super user privileges.\n3. We\
    \ can add a user by using the command `adduser`, with the username afterwards.\n\
    \   - Example: `adduser nathan`\n4. We can change a user’s password by using the\
    \ `passwd` command before their name.\n   - Example: `passwd nathan`\n5. To have\
    \ access to use `sudo`, a user must first be added to the configuration file,\
    \ which can be edited by using the `visudo` command.\n6. If our CLI gets too cluttered,\
    \ we can clear it by using the `clear` command.\n7. To end our session and sign\
    \ out of PuTTY we can use `exit`.\n\n# Chapter 5\n\n## System Status at a Glance\n\
    \nLog into your server, with the new user that we created in the last chapter.\n\
    \n## Navigating, Making Directories, and Files\n\nSome of this is recap the previous\
    \ chapters. Now that we logged in, use the `pwd` command to see your location.\n\
    \n| Find Current Directory Location |\n| Command | `pwd` |\n| Result | System\
    \ will output the directory you are in. |\n| CLI Display | `milo@ubuntu:~$ pwd/home/milo`\
    \ |\n\nNotice that our directory this time is different than when we logged in.\
    \ Last time we were at `/root`, which was the home directory for `root`. This\
    \ time we are at `/home/milo`, which is the home directory for `milo`.\n\nTip:\
    \ If you ever need to get back home use `cd`.\n\nNow that we are in home folder,\
    \ let’s make a new directory called `documents`.\n\n| Making a New Directory |\n\
    | Command | `mkdir documents` |\n| Result | System will create child directory\
    \ `documents` |\n| CLI Display | `milo@ubuntu:~$ mkdir documentsmilo@ubuntu:~$`\
    \ |\n\nUse the `ls` command to list the contents of our home directory and see\
    \ if the directory `documents` is there.\n\n| List Files |\n| Command | `ls` |\n\
    | Result | Lists the files in the current directory |\n| CLI Display | `milo@ubuntu:~$\
    \ lsdocuments` |\n\nFrom using `ls`, we now see that our directory is empty outside\
    \ of `documents`.\n\nLet’s use what we have learned from the previous chapters\
    \ to practice our navigation skills and go into the documents directory.\n\nTry\
    \ using the command: `cd Documents`\n\nYou may notice that it returns, `cd: Documents:\
    \ No such file or directory.` Linux is case sensitive, which means that `Documents`\
    \ and `documents` are two separate things. You will want to keep that in mind\
    \ as you use Ubuntu, since using the correct case matters.\n\nNow let’s do it\
    \ the right way.\n\n| Change to Child Directory |\n| Command | `cd documents`\
    \ |\n| Result | Changes to the documents directory |\n| CLI Display | `milo@ubuntu:~$\
    \ cd documentsmilo@ubuntu:~/documents$` |\n\nUse the `ls` command to list the\
    \ files in the directory, you’ll notice that it is empty.\n\nNow let’s go back\
    \ home by using `cd`.\n\n| Change to User Home Directory |\n| Command | `cd` |\n\
    | Result | Changes to user’s home directory |\n| CLI Display | `milo@ubuntu:~/documents$\
    \ cdmilo@ubuntu:~$` |\n"
