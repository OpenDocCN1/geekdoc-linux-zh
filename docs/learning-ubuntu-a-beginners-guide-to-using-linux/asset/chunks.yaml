    # Chapter 6


    ## Updating The Server


    In the last few chapters, we got a foundation in navigation and managing files.
    Another thing that is vital to a strong foundation is knowing how to update your
    server.


    As we install updates and packages, we will be using a utility called `apt-get`.
    `apt-get` is a powerful package management program. `APT` stands for advanced
    packaging tool and is how we will update, add, and remove packages.


    For us to update the server, we will need to give `milo` super user privileges.
    In the first `apt-get` command below, we will update the list of packages and
    get information on the newest versions.


    | Update Package Information |

    | :--- | :--- |

    | Command | `sudo apt-get update` |

    | Result | System will increase the user’s rights, search for an updated list
    of packages, and look for newer versions. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get update[sudo] password for milo:`
    |


    After you run that, your CLI will list a long list of web addresses as it checks
    the various package lists for updates. When it is done it will state, “Reading
    package lists… Done.”


    With the new information of updates that are available, we can now upgrade our
    server to have the latest versions of the current packages. Using the command
    below will fetch the new versions and install them onto the server.


    | Upgrade Server Packages |

    | :--- | :--- |

    | Command | `sudo apt-get upgrade` |

    | Result | System will increase the user’s rights, search for an updated list
    of packages, and look for newer versions. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get upgrade[sudo] password for milo:Do
    you want to continue? [Y/n] ymilo@ubuntu:~$` |


    After entering, Y to continue, the server will setup and install all of the newest
    versions of packages to our server.


    Keeping your server with the latest updates installed is a vital foundation to
    a core level of security. There is much more you will need to learn to secure
    your system, but this is a basic step to get started.


    # Chapter 7


    ## Setting Up a Web Server


    ### Apache2


    A common configuration for Linux servers is to set them up to be web servers.
    80% of servers that host websites are running Linux. To establish a good foundation,
    learning how to install these features are important.


    To get started in setting this server up as a web server, we need to install `Apache2`.
    `Apache2` is the most commonly used web server on Linux systems. Web servers are
    used to serve up web pages requested by client computers. To run website software
    like WordPress we will need more packages than this, but installing `Apache2`
    is the best starting place.


    | Installing Apache2 |

    | :--- | :--- |

    | Command | `sudo apt-get install apache2` |

    | Result | System will install `apache2` and dependent packages to the server.
    |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get install apache2[sudo] password for
    milo:Do you want to continue? [Y/n] ymilo@ubuntu:~$` |


    Now if we open our web browser and type in our IP address, we will see the `Apache2`
    landing page.


    ![](images/00010.jpeg)


    ### Stopping and Restarting Apache2


    There may be an instance when you want to stop or restart the `Apache2` webserver.


    You can do so by using the following commands:


    Stop Apache2: `sudo service apache2 stop`


    Start Apache2: `sudo service apache2 start`


    Restart Apache2: `sudo service apache2 restart`


    ### The Web Folder


    You may be wondering, where are my website files located? On most Ubuntu installs
    you can get to the web directory by changing directory to `/var/www/html`.


    | Go To The HTML Directory |

    | :--- | :--- |

    | Command | `cd /var/www/html; ls` |

    | Result | System will change to the html directory and list the files. |

    | CLI Display | `milo@ubuntu:~$ cd /var/www/htmlindex.html` |


    If you want to, you can open the default `index.html` file in `nano`.


    | Open index.html in nano |

    | :--- | :--- |

    | Command | `nano index.html` |

    | Result | System will load `index.html` into `nano`. |


    Note: To save and make changes, you may need to open the file using `sudo`.


    Now let’s change back to our home directory by using `cd`.


    ### Installing PHP5


    `PHP` is a popular web server-side scripting language. It is very popular and
    used by most content management systems, such as WordPress.


    | Installing PHP5 |

    | :--- | :--- |

    | Command | `sudo apt-get install php5` |

    | Result | System will install `php5` and dependencies. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get install php5[sudo] password for milo:Do
    you want to continue? [Y/n] ymilo@ubuntu:~$` |


    ### Installing MySQL


    Along with `Apache2` and `PHP`, your server will need `MySQL` for many web applications
    that need to store data. This includes the widely popular WordPress CMS.


    | Installing MySQL Server |

    | :--- | :--- |

    | Command | `sudo apt-get install mysql-server` |

    | Result | System will install `MySQL` Server. |


    Once you run this command, you will need to enter your password in addition to
    agreeing to continue as we did before. After that is done the install will prompt
    you for a password for the `root` user. It is highly recommended you use a different
    password for `MySQL`.


    Enter your password, then tab to ok and press enter. After that you will need
    to reenter the password again.


    Now, we need to install another package to allow `PHP` to talk with `MySQL`.


    | Installing PHP5 MySQL Dependency |

    | :--- | :--- |

    | Command | `sudo apt-get install php5-mysql` |

    | Result | System will install `php5` dependency for `MySQL`. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get install php5-mysql[sudo] password
    for milo:Do you want to continue? [Y/n] ymilo@ubuntu:~$` |


    Next we need to install a package to allow `apache2` to talk and authenticate
    to `MySQL`.


    To do so, use the following command:


    `sudo apt-get install libapache2-mod-auth-mysql`


    In some circumstances you may use contact forms on your site for people to reach
    you. In order to send mail from the server we need to install another package:
    `postfix`.


    ### Installing Postfix


    `Postfix` is a mail server that started out of IBM research labs as an alternative
    to `Sendmail`. `Postfix` aims to be fast, easy to use (great for beginners), and
    secure. This is my recommendation if you want to be able to have mail services
    running on your server. The installation is easy.


    | Installing Postfix |

    | :--- | :--- |

    | Command | `sudo apt-get install postfix` |

    | Result | System will install `phpmyadmin`. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get install phpmyadmin[sudo] password
    for milo:Do you want to continue? [Y/n] y` |


    After you approve the install, you will see the window below:


    ![](images/00011.jpeg)


    Tap to hit enter on the OK button and then select `Internet Site` in the next
    prompt. Once that is done press tab to ok and then enter. The next step asks for
    your fully qualified domain (FQDN). If you do not have one yet just tab to ok
    and use the default.


    Now it is installed! We won’t cover the other various configuration settings in
    this book, but you can find various helpful resources online.


    ### Installing PHPMYADMIN


    A great way to test to see if we configured all of this properly, is by installing
    `phpmyadmin`. `Phpmyadmin` is a great tool to provide a web interface for managing
    your `MySQL` server, its tables and databases.


    | Installing phpmyadmin |

    | :--- | :--- |

    | Command | `sudo apt-get install phpmyadmin` |

    | Result | System will install `phpmyadmin`. |

    | CLI Display | `milo@ubuntu:~$ sudo apt-get install phpmyadmin[sudo] password
    for milo:Do you want to continue? [Y/n] y` |


    ![](images/00012.jpeg)During the `phpmyadmin` installation, it will prompt you
    to select which web server you would like to configure. Next to `apache2`, press
    the spacebar, then tab to ok, and press enter. Shortly after, the installation
    will ask you if you want to configure database for `phpmyadmin` with `dbconfig-common`.
    Make sure that yes is selected and press enter. Afterwards you will be prompted
    to enter the password for the administrative user. Complete the prompts and continue.

