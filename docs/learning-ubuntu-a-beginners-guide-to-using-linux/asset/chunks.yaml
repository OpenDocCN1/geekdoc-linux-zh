  trans: "\n\n[`www.ubuntu.com/server`](http://www.ubuntu.com/server)\n\n一旦下载了 iso\
    \ 文件，你需要将它刻录到光盘。有多种 iso 刻录工具。过去，我曾使用过 [Ashampoo Burning Studio Free](https://www.ashampoo.com/en/usd/pin/7110/burning-software/burning-studio-free)，并且非常成功。\n\
    \n## 方法 1：在闲置电脑上安装 Ubuntu\n\n如果你有一台可以运行 Ubuntu 的闲置电脑，那可能是学习如何安装和设置它的最佳方式。由于这是一台闲置的电脑，即使在安装过程中出现错误，风险也很低。你需要的是这台闲置电脑，以及我们刻录了\
    \ Ubuntu 镜像的光盘。\n\n确保电脑已设置为从光驱驱动器启动，然后你就可以启动到安装光盘并安装 Ubuntu。安装过程非常简单，但始终可能遇到问题。我发现\
    \ Ubuntu 论坛和 YouTube 在解决常见问题方面提供了很棒的资源。\n\n安装完成后，取出光盘，系统将启动进入 Ubuntu。\n\n## 方法\
    \ 2：使用虚拟化软件安装 Ubuntu\n\n如果你没有闲置电脑，但电脑上有相当多的内存，你可以使用虚拟化软件进行安装。此类软件的示例包括 Oracle\
    \ 提供的免费软件 VirtualBox 和付费版的 VMWare。\n\n这种方法适合初学者，因为它降低了因操作错误而可能意外清空电脑数据的风险。\n\n\
    我使用过 VirtualBox，它是 Oracle 提供的且免费的，但它偶尔会出现小故障。这是一种选择，但不是我推荐给这本书读者的首选。\n\n若要继续操作并使用这些免费工具，你需要下载并安装\
    \ VirtualBox，可以在以下链接找到它：\n\n[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)\n\
    \n你也可以配置虚拟机从 Ubuntu 的 iso 文件启动，而不是将其刻录到光盘。\n\n## 方法 3：为你的电脑设置双启动\n\n老实说，我不想将此列为一个选项。对于那些熟练并知道如何正确设置机器运行多个操作系统的用户来说，这是一个流行的选择，但如果你不熟悉，我不建议你尝试这个选项。\n\
    \n这种方法风险最高，因为如果你不小心，可能会意外破坏机器的引导循环或覆盖你现有的操作系统。\n\n*本书的首选方案*\n\n## 方法 4：使用低成本 VPS\n\
    \n考虑到本书的性质以及旨在教育初学者的目标，我建议使用 VPS。如果你没有闲置电脑，使用 VPS 比买一台电脑更便宜，比使用虚拟化软件更稳定，而且没有像双启动那样损坏主电脑的风险。我最喜欢使用\
    \ VPS 的一点是由于它是托管在云端的，你可以从任何地方访问它。\n\n另一个优势是 VPS 商会为你安装操作系统。我们仍然需要安装包并学习如何使用它，但通过这种方式你可以快速地设置并部署\
    \ Ubuntu 服务器。\n\n为了制作书中的教程，我将使用 DigitalOcean。他们有一个每月 5 美元的入门套餐，包括：1TB 流量、512 内存、1\
    \ 个 CPU 和 20 GB 存储。使用 DigitalOcean，最快 55 秒内即可开始。\n\n另一个我推荐的选项是 Linode。Linode 的入门计划资源翻倍，但价格也是每月\
    \ 10 美元。由于我们只是在学习而并没有部署任何东西，DigitalOcean 的入门套餐对我们的目的来说最实用。\n\n市场上还有很多其他 VPS 服务商，你可以自己进行研究，但我发现这两者的支持和价格是最好的。\n\
    \n使用此选项，我们不需要下载或刻录 Ubuntu iso，也不需要对我们的电脑进行任何特殊操作。设置过程快速且相对简单。你只需要一张信用卡，并且可以随时取消。\n\
    \n如果你决定使用方法一、二或三，你的培训将从下一章开始。下一章是一个简短的章节，将带你了解如何在 DigitalOcean 上设置 VPS。\n\n##\
    \ 快速回顾\n\n1.  操作系统是计算机中的主程序，控制计算机的工作方式，使得其他程序的运行成为可能。\n    -   Microsoft Windows、Mac\
    \ OSX 和 Linux 都是操作系统的示例。\n2.  开源意味着该软件提供了原始源代码，并免费提供供重新分发和修改。\n3.  发发行版（distro\
    \ 或 distribution）是使用 Linux 内核作为基础的 Linux 版本。\n4.  虚拟专用服务器（VPS）是一种作为托管服务出售的机器，通常比购买服务器及其所需的带宽更便宜。\n\
    5.  建议你尝试 Ubuntu 的方法是设置 VPS。\n    -   本书的指令重点是使用 DigitalOcean 作为你的主机，但你也可以选择其他提供商。\n\
    \n# 第 2 章\n\n## 在 DigitalOcean 上设置 VPS\n\n如果你决定支付 VPS 每月的小额费用，我认为你做出了正确的决定。我喜欢使用\
    \ VPS 的点是它不占用我的硬件，我可以从任何地方处理它。\n\n首先，访问 `www.digitalocean.com/` 并点击 `Sign Up`（注册）。从那里，输入你想使用的电子邮件地址和密码。然后点击\
    \ `Sign Up`。\n\n现在我们的邮箱已确认，我们需要选择一种支付方式。DigitalOcean 提供了使用信用卡或 PayPal 的选项。对于我，我使用\
    \ PayPal。\n\n如果你使用 PayPal，你需要预付 5 美元，这会存入你的账户。\n\n添加支付方式后，我们就可以创建 VPS，DigitalOcean\
    \ 称为 `Droplet`。在右上角点击 `Create Droplet`。\n\n接下来，它会要求你选择发行版。我们要选择 `Ubuntu14.04`。\n\
    \n一旦选择了 `Ubuntu`，向下滚动选择你想部署的服务器大小。他们默认选择了每月 20 美元的方案。点击每月 5 美元的方案（如果这是你需要的尺寸），然后向下滚动选择数据中心区域。\n\
    \n我建议根据你的位置选择区域。由于我在美国东部，纽约是我的选择。\n\n在附加选项下，取决于你是否想要备份。如果我们是在进行开发或其他培训之外的操作，我会建议选择备份选项，但由于我们现在只需要基础功能，我将不勾选这些选项。\n\
    \n从那里向下滚动到底点击大绿色 `Create`（创建）按钮。\n\n然后在几秒钟内，你的系统就设置好并就绪了。DigitalOcean 然后会向你发送服务器的\
    \ IP 地址、用户名和密码。\n\n# 第 3 章\n\n## 进入 CLI\n\nCLI 代表命令行界面，你通过输入文本行与系统交互。这是我们与服务器交互的方式。\n\
    \n如果你决定不使用推荐的在 DigitalOcean 或提供商处设置 VPS 的方法，那么你可以在电脑屏幕上看到 CLI。当你启动电脑时，它会带你进入 CLI，然后你就可以登录。\n\
    \n"
- fmt: "\nIf you are using a VPS, then you will need a way to connect and view the\
    \ CLI. We can connect to the VPS by using a protocol called `SSH`. `SSH` stands\
    \ for Secure Shell, which is an encrypted way that we can remote login to our\
    \ server.\n\nWhen we signed up for DigitalOcean, they sent us an email with our\
    \ IP address, username, and password. If you used a similar service, it would\
    \ also provide you with this information or allow you to set it manually. While\
    \ you are likely familiar with user names and passwords, you may not be familiar\
    \ with IP addresses. An IP Address, is a string of numbers that identifies a computer\
    \ on a network. For our VPS, our IP Address is a public one, which can be accessed\
    \ from anywhere with an internet connection.\n\nThe program I recommend to SSH\
    \ into your server is called `PuTTY`. `PuTTY` is a free SSH client that is open\
    \ source and supported on Windows. You can download it from the following link:\n\
    \n[http://putty.org](http://putty.org)\n\nThe file you download is an executable\
    \ (`.exe`) that does not require an install. Once you download it, you can drag\
    \ it onto your desktop for quick access.\n\nConnecting to your VPS with this tool\
    \ is very easy. Under Host Name or IP address, put the IP address that was provided.\
    \ Select `SSH` as the connection type and then click open. See figure 1 as an\
    \ example of what it should look like.\n\nNote: Your IP Address will be different\
    \ than the one in the figure.\n\nFigure 1: Putty Configuration\n\n![](images/00006.jpeg)\n\
    \nWhen you hit connect, you may get a message like the one in Figure 2. Click\
    \ Yes.\n\nFigure 2: PuTTY Security Alert\n\n![C:\\Users\\Nathan\\AppData\\Local\\\
    Microsoft\\Windows\\INetCache\\Content.Word\\2016-02-08_19h51_40.png](images/00007.jpeg)\n\
    \n## Logging In for the First Time\n\nNow you will be prompted in for the first\
    \ time. Enter the username `root`, then the password that was provided.\n\nIf\
    \ you used DigitalOcean, their system requires a password reset the first time\
    \ you log in. You will need to reenter the provided password and then the new\
    \ one you wish to set twice. Make sure you follow secure password guidelines and\
    \ set a secure password for the root user. \n\nNote: Throughout this book, I use\
    \ tables to explain the different commands that we are going to learn. The first\
    \ row is the task that we want to do, the second is the command we need to use,\
    \ and the third is an example of what your CLI will look like. I think this is\
    \ the best way to depict and explain the commands we are going to learn.\n\nIf\
    \ you were not prompted to change your password, but want to, you can enter the\
    \ command `passwd`. See the table on the next page for more details.\n\n| Change\
    \ My Password |\n| :--- | :--- |\n| Command | `passwd` |\n| Result | System will\
    \ prompt for new password |\n| CLI Display | `root@ubuntu:~# passwdEnter new UNIX\
    \ password:Retype new UNIX password:passwd: password updated successfully` |\n\
    \n## Navigation\n\nDo not be intimidated by the white text and black background\
    \ on the CLI. I know that there is no mouse or graphics, but after a short while,\
    \ you will be comfortable navigating through the directories on your server. Directory\
    \ is like a folder that you may have used on a Windows or Mac device. As a person\
    \ who has used this for a long time, I actually prefer this to having a graphical\
    \ user interface. Before we do anything else, let’s learn to explore the server.\
    \ By using the `pwd` command, we can see the location of the directory that we\
    \ are currently viewing.\n\n| Find Your Current Directory Location |\n| :--- |\
    \ :--- |\n| Command | `pwd` |\n| Result | System will output the directory that\
    \ you are in. |\n| CLI Display | `root@ubuntu:~# pwd/root` |\n\nRight now we are\
    \ in a directory named `root`, which is essentially the home directory of the\
    \ user `root`. There is big difference between this root home directory and the\
    \ actual root of the system. \n\nThe path `/` is the root of the system, but right\
    \ now we are in a subdirectory that is named root (`/root`).\n\nThe root of the\
    \ server is the top directory. Everything is a subdirectory inside of it. From\
    \ our current location, there are two ways we can go there. Let’s start with the\
    \ easiest command that will always get us to root.\n\n| Go To The Root Directory\
    \ (/) |\n| :--- | :--- |\n| Command | `cd /` |\n| Result | We change to the main\
    \ root directory |\n| CLI Display | `root@ubuntu:~# cd /root@ubuntu:/#` |\n\n\
    Now let’s use, `pwd` again to see where we are at.\n\n| Find Your Current Directory\
    \ Location |\n| :--- | :--- |\n| Command | `pwd` |\n| Result | System will output\
    \ the directory that you are in. |\n| CLI Display | `root@ubuntu:~# pwd/` |\n\n\
    If you want to see what is in the folder, we can use the `ls` command.\n\n| List\
    \ Files |\n| :--- | :--- |\n| Command | `ls` |\n| Result | Lists the files in\
    \ the current directory |\n| CLI Display | `root@ubuntu:/# lsbin  home  lib64\
