    When you make changes to Apache2 configuration files, you will almost always need
    to restart apache. You can do so by using the following command: `sudo service
    apache2 restart`


    When that is complete the new settings will take hold. Now since we want to use
    the `000-default.conf` site configuration, we need to re-enable it. Follow the
    table below.


    | Enable a Site Configuration |

    | :--- | :--- |

    | Command | `sudo a2ensite 000-default.conf` |

    | Result | System will enable the site configuration for `000-default`. |

    | CLI Display | `milo@ubuntu:/var/apache2/sites-available$ sudo a2ensite 000-default.confEnabling
    site 000-default.To activate the new configuration, you will need to run `service
    apache2 reload.milo@ubuntu:/var/apache2/sites-available$` |


    Once again, we need to restart apache with the following command: `sudo service
    apache2 restart`


    Now if we load our IP address into the browser, we will see the WordPress installation
    landing page. Do not click “Let’s Go!” yet as we still have some permissions to
    update.


    ![](images/00019.jpeg)


    ## Recap on Changing Ownership and Permissions


    Now before we can continue, we need to make some ownership and permissions changes.
    This is a great way to pull the whole chapter together.


    Once you are logged into the server, we must first change the owner of the folder
    to a non-privileged user, who is already built into the Apache2 install. This
    user is `www-data`.


    | Changing the Owner of a Directory |

    | :--- | :--- |

    | Command | `sudo chown www-data -R /var/www` |

    | Result | System will make `milo` the owner of the directory, along with all
    subdirectories. |

    | CLI Display | `milo@ubuntu:~$ sudo chown www-data -R /var/www[sudo] password
    for milo:milo@ubuntu:~$` |


    Now we need to set the permissions for the directories.


    WordPress recommends using `755` as the permission binary.


    This means that the user (`www-data`) has read, write, and execute permission.
    The group and all users can only read and execute. This allows `www-data` to make
    changes to the files in the directories, but other users can only read and execute.
    These permissions are needed for a user to load the website.


    | Changing Permissions of a Directory |

    | :--- | :--- |

    | Command | `sudo chmod 755 -R /var/www/wordpress` |

    | Result | System will make change permissions for `/var/www` and all subdirectories.
    |

    | CLI Display | `milo@ubuntu:~$ sudo chown www-data -R /var/www/wordpress[sudo]
    password for milo:milo@ubuntu:~$` |


    Remember using the `–R` flag makes the settings apply to all subdirectories as
    well. If we do not use this, we will not be giving the permissions to other subdirectories
    in the wordpress parent.


    Now that the permissions are set, we can move forward in creating a database in
    MySQL.


    # Chapter 8


    ## Creating a Database in MySQL


    There are a multitude of books on MySQL. This chapter is going to be very short,
    but will cover how to make a database for installing almost any popular content
    management system or other web software that needs a database to use.


    I typically use the CLI for managing MySQL, but since this is geared towards beginners,
    it may be easier for us to use `phpMyAdmin` to create the database.


    From the web browser, enter your IP address`/phpmyadmin` (Example: `http://162.243.92.xxx/phpmyadmin`).
    Replace `162.243.92.xxx` with your IP address. Then login to `phpMyAdmin`.


    You should see a home dashboard like the one below: ![](images/00020.jpeg)


    What we are going to do is create a special user for WordPress to use and a database
    that it is limited to. This is a good security practice.


    In the top left, click on Users.


    ![](images/00021.jpeg) ![](images/00022.jpeg)Now click on Add User.


    From the new window enter a user name for the new user. I am going to use: `website`.
    Leave host listed as any host. After that skip down and click the “Generate” button
    to create a secure password. Be sure to note this password as we will need it
    for the WordPress installation.


    Under the generate button is a field to “Create database with same name and grant
    all permissions.” Check that box. Leave “Global Permissions” all unchecked, since
    we only want WordPress to access this one database.


    Scroll down and in the bottom right click the “Go” button. You will have a popup
    that the user has been added and on the right side of your screen you will see
    that the new database for the user has been added.


    Again, this is just the basics, but it is an easy and secure way for beginners
    to add a database.


    If you wish to learn more about MySQL and how it works from the CLI, there are
    a multitude of books out there to serve that need as you grow.


    # Chapter 9


    ## Bonus Chapter


    ### Setup WordPress


    There is still a lot that you need to learn to establish the fundamentals of using
    Ubuntu, but I think this book is good in the sense that it covers some basics,
    along with a practical use. With the proper permissions in place and a database
    setup, we can proceed to setup WordPress.


    In your web browser enter the IP address of your server. You should then see the
    “Welcome to WordPress” starting page. At the bottom of the page click on the “Let’s
    Go!” button!


    ![2016-02-23_08h28_54](images/00023.jpeg)


    Now it is going to ask you for the following information. If you followed my example
    earlier, it should look similar to this:


    Database Name: `website`

    User Name: `website`

    Password: [Your randomly generated password]

    Database Host: `localhost`

    Table Prefix: `wp_`


    Once that information is entered you will be prompted to run the install.


    ![](images/00024.jpeg)


    Go ahead and click “Run the install.”


    You will then be prompted for the information you want to use for your WordPress
    Site.


    ![](images/00025.jpeg)


    Provide the requested information and click “Install WordPress.”


    Congratulations! In just under 70 pages we have established some Ubuntu basics
    and used that information to build a basic webserver.


    There much more to learn of course, but this is just the beginning. This guide
    should have you comfortable with navigating and installing packages on Ubuntu.


    If you have any questions for further learning, do not hesitate to email me at
    `info@nathanneil.com`.


    Thank you and good luck as you continue learning!

    '
