    # 第 1 章


    ## 什么是 Linux & Ubuntu？

    你可能熟悉微软 Windows 和苹果的 MacOSX。这些都是操作系统的示例。


    韦氏词典（Merriam-Webster）将操作系统定义为计算机中控制计算机工作方式并使其他程序运行的主要程序。


    基本上，操作系统是让你与计算机交互，并让计算机理解你想做的程序。它的含义比此更深，但我想保持在话题范围内。


    Linux 是一个开源操作系统。开源是 Linux 与其他流行操作系统之间的主要区别。开源意味着软件提供了原始源代码，并免费供重新分发和修改。这正是 Linux
    的独特性之处。它有一个强大的社区在修改代码、参与论坛并以比替代品快的速度修复漏洞。


    如果你想为你的个人简历增加一项新技能，学习如何使用 Linux 会非常有用。根据 ZDNet 2014 年的数据，87% 的企业业务至少增加了一台 Linux
    服务器，82% 的企业计划在 2015 年增加更多。Linux 及其发行版在数据库、Web 和其他类型的服务器中非常受欢迎。


    发行版（distro or distribution）是以 Linux 内核为基础的 Linux 版本。有数百 Linux 发行版，大部分都是免费的。Ubuntu
    是 Linux 的发行版，由一家名为 Canonical 的公司发布。他们免费提供操作系统，但对产品的商业支持收费。运行 Linux 的服务器中近四分之一使用的是
    Ubuntu。这使其成为首次 Linux 体验的绝佳选择。


    ## 开始之前需要什么？

    你所需的工具取决于你想选择的路线。你有四种方法可以尝试书中的课程。与其他两种选项相比，我更倾向于其中一种，特别是如果你对这个过程还很陌生。让我们快速浏览前三种，重点关注第四种，这是我为阅读这本书的你们推荐的首选方法。


    用于尝试书中课程的前三种方法将要求你手动进行设置。在讨论这些开始方法之前，让我们先看一眼我们将使用的 Ubuntu 版本。虽然这本书可以适用于其他版本，但最适用于
    Ubuntu 14.04 LTS。LTS 代表“长期支持”（Long Term Support）。这意味着它将获得 Canonical 为期五年的更新支持。很多人没有意识到操作系统的支持会过期。一旦支持过期，可能无法获得安全补丁和其他升级。在我的书籍《企业数据安全：建立数据安全的核心》（http://www.amazon.com/gp/product/B016PMLIW0）中，我们深入地讨论了操作系统。如果你从事技术或管理业务，我强烈建议阅读它。


    Ubuntu 15.10 现在也可以，但它不是 LTS 版本。我倾向于使用具有长期支持的版本。


    Ubuntu 14.04 LTS 通过了 AWS、Microsoft Azure、Joyent、IBM 和 HP Cloud 的认证。它也被几乎所有的 VPS
    商支持。VPS 代表虚拟专用服务器。虚拟服务器是一种作为托管服务出售的机器，通常比购买服务器及其所需的带宽更廉。。随着云服务的普及，许多企业现在运行更多的虚拟服务器以节省成本并更快地扩展。对于
    VPS，你为你需要使用的资源付费，并随着时间的推移增加更多资源，如果你需要更多的处理能力或内存。


    我喜欢 Ubuntu 14.04 LTS 的一点是它对热门软件包进行了更新，我们将在书中介绍其中很多。Ubuntu 14.04 LTS 也可以安装在大多数设备上，支持：x86、x86-64、ARM
    v7、ARM64 和 Power。如果你不确定这些东西意味着什么，没关系，但你可以确信 Ubuntu 支持大多数设备，这是一个巨大的优势。


    对于设置 Ubuntu 的前三种方法，你需要下载 iso 文件。iso 是用于刻录 CD 或 DVD（取决于大小）的文件扩展名。本质上，它是安装 Ubuntu
    所需的光盘镜像。


    你可以通过以下地址下载 Ubuntu 服务器：


