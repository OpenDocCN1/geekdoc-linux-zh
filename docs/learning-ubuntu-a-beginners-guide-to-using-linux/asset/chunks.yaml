    \    #ServerName www.example.com\n    ServerAdmin webmaster@localhost\n    DocumentRoot\
    \ /var/www/html\n    # 可用的日志级别: trace..., debug, notice, error, alert, emerg.\
    \ 也可以为特定模块配置日志级别，例如 LogLevel info ssl:warn\n    ErrorLog ${APACHE_LOG_DIR}/error.log\n\
    \    CustomLog ${APACHE_LOG_DIR}/access.log combined 对于大多数来自 conf-available/ 的配置文件（这些文件在全局范围内启用或禁用），可以仅为某一个特定的虚拟主机包含一行。例如，接下来的行在通过\
