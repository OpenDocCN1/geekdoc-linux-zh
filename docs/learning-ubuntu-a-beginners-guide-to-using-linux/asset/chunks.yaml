- fmt: "\n[http://www.ubuntu.com/server](http://www.ubuntu.com/server)\n\nOnce you\
    \ download the iso file, you will need to burn it to a disc. There are a variety\
    \ of iso burning tools. In the past, I have used [Ashampoo Burning Studio Free](https://www.ashampoo.com/en/usd/pin/7110/burning-software/burning-studio-free),\
    \ with success.\n\n## Method 1: Install Ubuntu on a Spare Machine\n\nIf you have\
    \ a spare computer that you can use to run Ubuntu, that could be the best way\
    \ to learn how to install and set it up. Since it’s a spare machine, there is\
    \ low risk if you make an error in the installation. What you will need is the\
    \ spare computer, along with the disc that we burned the Ubuntu image to.\n\n\
    Make sure that the computer is setup to boot from the disc drive and from there\
    \ you can boot to the installation disc and install Ubuntu. The install is pretty\
    \ easy, but there is always the possibility of running into a snag. I have found\
    \ that the Ubuntu forums and YouTube has great resources for troubleshooting common\
    \ problems.\n\nOnce the installation is complete, remove the disc, and the system\
    \ will boot into Ubuntu.\n\n## Method 2: Install Ubuntu using Virtualization Software\n\
    \nIf you do not have a spare machine, but have a fair amount of memory on your\
    \ computer, you can install it using virtualization software. A few examples of\
    \ this software include the free VirtualBox by Oracle, and the paid version of\
    \ VMWare.\n\nThis method is good for a beginner as it lowers the risk of making\
    \ an error that may accidentally wipe your machine.\n\nI have used VirtualBox,\
    \ which is from Oracle and free, but it can be glitchy from time to time. This\
    \ is an option, but not my preferred choice for beginners reading this book.\n\
    \nTo move forward with this and use the free tools, you will need to download\
    \ and install VirtualBox, which can be found at the following link:\n\n[https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)\n\
    \nYou also can configure the virtual machine to boot from the iso file for Ubuntu,\
    \ rather than burning it to a disc.\n\n## Method 3: Dual Boot your Computer\n\n\
    To be honest, I did not want to list this as an option. It is a popular one amoung\
    \ those who are skilled and know how to properly set up a machine to run multiple\
    \ operating systems, but if you are not familiar with this, I would not explore\
    \ this option.\n\nThis one is the most risky, as you could accidentally break\
    \ the boot cycle of the machine or overwrite your existing operating system if\
    \ you are not careful.\n\n*Preferred Choice for this Book*\n\n## Method 4: Use\
    \ a Low Cost VPS\n\nFor this book and the nature of it, targeting to educate beginners,\
    \ I recommend using a VPS. It is more affordable than buying a spare computer\
    \ if you do not have one, more stable than using virtualization software, and\
    \ no risk to breaking your primary computer as there is with a dual boot. The\
    \ main thing that I love about using a VPS is that you can access it from anywhere,\
    \ since it is hosted in the cloud.\n\nAnother advantage is that the VPS provider\
    \ will install the operating system for you. We will still need to install packages\
    \ and learn how to use it, but you can setup and deploy an Ubuntu Server very\
    \ quickly this way.\n\nFor creating the tutorials in this book, I will be using\
    \ DigitalOcean. They have a starter package for $5 a month, including: 1TB transfer,\
    \ 512 memory, 1 CPU, and 20 GB of storage. With DigitalOcean, you can get started\
    \ as quick as 55 seconds.\n\nAnother option that I would recommend is Linode.\
    \ Linode’s starter plan has double the resources, but it is also $10 per month.\
    \ Since we are just learning and not deploying anything, the starter package from\
    \ DigitalOcean seems the most practical for our purposes.\n\nThere are a lot of\
    \ other VPS providers out there so feel free to do your research, but I have found\
    \ these two have the best support and pricing.\n\nWith using this option, we do\
    \ not have to download or burn the Ubuntu iso and we also do not need to do anything\
    \ special to our computer. Setup is quick and relatively easy. All you need is\
    \ a credit card and you can cancel at anytime.\n\nIf you decide to use methods\
    \ one, two, or three, your training will start after the next chapter. The next\
    \ chapter, which is a short one, will walk you through setting up a VPS on DigitalOcean.\n\
    \n## Quick Recap\n\n1. An operating system is the main program in a computer,\
    \ which controls the way the computer works, making it possible for other programs\
    \ to function.\n    - Microsoft Windows, Mac OSX, and Linux are examples of operating\
    \ systems.\n2. Open-source means that the software is provided with the original\
    \ source code and is made freely available to be redistributed and modified.\n\
    3. A distro or distribution is a version of Linux that uses the Linux kernel as\
    \ its foundation.\n4. A Virtual Private Server is a machine sold as a hosting\
    \ service and is often more affordable than purchasing a server and the bandwidth\
    \ that it requires.\n5. The recommend method for you to experiment with Ubuntu,\
    \ is by setting up a VPS.\n    - This books instructions focus on using DigitalOcean\
    \ as your host, but you can choose other providers as well.\n\n# Chapter 2\n\n\
    ## Setting Up a VPS on DigitalOcean\n\nIf you have decided to pay the small monthly\
    \ fee for a VPS, I think you made the right decision. What I like about using\
    \ a VPS is that it doesn’t use my hardware I can work on it from anywhere.\n\n\
    First, go to `www.digitalocean.com/` and click `Sign Up`. From there, enter email\
    \ address and password that you want to use. Then click `Sign Up`.\n\nNow that\
    \ our email is confirmed, we need to select a payment method. DigitalOcean gives\
    \ you the option of using a credit card or PayPal. For me, I use PayPal.\n\nIf\
    \ you use PayPal, you have to prepay $5, which is credited to your account. This\
    \ will cover our first month!\n\nOnce you have added your payment method, we can\
    \ create our VPS, what DigitalOcean calls a `Droplet`. In the top right, click\
    \ `Create Droplet`.\n\nNext, it will ask you to select a distribution. We want\
    \ to select `Ubuntu14.04`.\n\nOnce you have selected `Ubuntu`, scroll down to\
    \ select the size of server you want to deploy. They have the $20 per month plan\
    \ selected as the default. Just click on the $5 per month plan, if that is the\
    \ size you want, and then scroll down to select a datacenter region.\n\nI recommend\
    \ selecting a region based on your location. Since I am in the USA on the east\
    \ coast, New York is my pick.\n\nUnder the additional options, it is up to you\
    \ if you like a backup. If we were doing development or anything outside of training\
    \ and testing, I would recommend selecting the backup option, but since we just\
    \ want the basics for now, I am going to leave these options unchecked.\n\nFrom\
    \ there, scroll down to the bottom and click the big green `Create` button.\n\n\
    Then in a matter of a few seconds, your system is setup and ready. DigitalOcean\
    \ will then email you the IP address, username, and password for your server.\n\
    \n# Chapter 3\n\n## Getting to the CLI\n\nCLI stands for command line interface,\
    \ where you can interact with the system by entering lines of text. This is how\
    \ we interact with our server.\n\nIf you decided not to use the recommended method\
    \ of setting up a VPS on DigitalOcean or another provider, then you can see the\
    \ CLI on your computers display. When you boot your computer, it will bring you\
    \ to the CLI, where you can then login.\n"
  raw: '[http://www.ubuntu.com/server](http://www.ubuntu.com/server)


    Once you download the iso file, you will need to burn it to a disc.  There are
    a variety of iso burning tools.  In the past, I have used [Ashampoo Burning Studio
    Free](https://www.ashampoo.com/en/usd/pin/7110/burning-software/burning-studio-free),
    with success.


    Method 1: Install Ubuntu on a Spare Machine


    If you have a spare computer that you can use to run Ubuntu, that could be the
    best way to learn how to install and set it up.  Since it’s a spare machine, there
    is low risk if you make an error in the installation.  What you will need is the
    spare computer, along with the disc that we burned the Ubuntu image to. 


    Make sure that the computer is setup to boot from the disc drive and from there
    you can boot to the installation disc and install Ubuntu.  The install is pretty
    easy, but there is always the possibility of running into a snag.  I have found
    that the Ubuntu forums and YouTube has great resources for troubleshooting common
    problems. 


    Once the installation is complete, remove the disc, and the system will boot into
    Ubuntu.


    Method 2: Install Ubuntu using Virtualization Software


    If you do not have a spare machine, but have a fair amount of memory on your computer,
    you can install it using virtualization software.  A few examples of this software
    include the free VirtualBox by Oracle, and the paid version of VMWare.


    This method is good for a beginner as it lowers the risk of making an error that
    may accidentally wipe your machine. 


    I have used VirtualBox, which is from Oracle and free, but it can be glitchy from
    time to time.  This is an option, but not my preferred choice for beginners reading
    this book.


    To move forward with this and use the free tools, you will need to download and
    install VirtualBox, which can be found at the following link:


    [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)


    You also can configure the virtual machine to boot from the iso file for Ubuntu,
    rather than burning it to a disc.


    Method 3: Dual Boot your Computer


    To be honest, I did not want to list this as an option.  It is a popular one amoung
    those who are skilled and know how to properly set up a machine to run multiple
    operating systems, but if you are not familiar with this, I would not explore
    this option.


    This one is the most risky, as you could accidentally break the boot cycle of
    the machine or overwrite your existing operating system if you are not careful.


    *Preferred Choice for this Book*


    Method 4: Use a Low Cost VPS


    For this book and the nature of it, targeting to educate beginners, I recommend
    using a VPS.  It is more affordable than buying a spare computer if you do not
    have one, more stable than using virtualization software, and no risk to breaking
    your primary computer as there is with a dual boot. The main thing that I love
    about using a VPS is that you can access it from anywhere, since it is hosted
    in the cloud.


    Another advantage is that the VPS provider will install the operating system for
    you.  We will still need to install packages and learn how to use it, but you
    can setup and deploy an Ubuntu Server very quickly this way.


    For creating the tutorials in this book, I will be using DigitalOcean.  They have
    a starter package for $5 a month, including: 1TB transfer, 512 memory, 1 CPU,
    and 20 GB of storage.  With DigitalOcean, you can get started as quick as 55 seconds.


    Another option that I would recommend is Linode.  Linode’s starter plan has double
    the resources, but it is also $10 per month.  Since we are just learning and not
    deploying anything, the starter package from DigitalOcean seems the most practical
    for our purposes.


    There are a lot of other VPS providers out there so feel free to do your research,
    but I have found these two have the best support and pricing.


    With using this option, we do not have to download or burn the Ubuntu iso and
    we also do not need to do anything special to our computer.  Setup is quick and
    relatively easy.  All you need is a credit card and you can cancel at anytime.


    If you decide to use methods one, two, or three, your training will start after
    the next chapter.  The next chapter, which is a short one, will walk you through
    setting up a VPS on DigitalOcean.


    ## Quick Recap


    1) An operating system is the main program in a computer, which controls the way
    the computer works, making it possible for other programs to function.


    1.  1.  Microsoft Windows, Mac OSX, and Linux are examples of operating systems.


    2) Open-source means that the software is provided with the original source code
    and is made freely available to be redistributed and modified.


    3) A distro or distribution is a version of Linux that uses the Linux kernel as
    its foundation.


    4) A Virtual Private Server is a machine sold as a hosting service and is often
    more affordable than purchasing a server and the bandwidth that it requires


    5) The recommend method for you to experiment with Ubuntu, is by setting up a
    VPS.


    1.  1.  This books instructions focus on using DigitalOcean as your host, but
    you can choose other providers as well.


    # Chapter 2


    ## Setting Up a VPS on DigitalOcean


    If you have decided to pay the small monthly fee for a VPS, I think you made the
    right decision.  What I like about using a VPS is that it doesn’t use my machines
    hardware and I can work on it from anywhere that I have an internet connection.


    Let’s go ahead and get our server setup in a few seconds.


    First, go to [https://www.digitalocean.com/](https://www.digitalocean.com/) and
    click on ‘Sign Up’ in the top right. From there, enter an email address and password
    that you want to use for your account.  Then click ‘Sign Up’.


    ![](images/00001.jpeg)


    Now we need to confirm our email address.  Open your email and find the email
    from DigitalOcean.  It will be titled “DigitalOcean – Please confirm your email
    address.” Open the email and proceed to click on the verification link.


    Great, now that our email is confirmed, we need to select a payment option.  DigitalOcean
    gives you the option of using a credit card or PayPal. For me, I use PayPal for
    convenience.


    If you use PayPal, you have to prepay $5, which is credited to your account. 
    This will cover our first month!


    Once you have added your payment method, we can create our VPS, what DigitalOcean
    calls a Droplet.  In the top right, click on the green ‘Create Droplet’ button.


    ![](images/00002.jpeg)


    Next, it will ask you to select a distribution.  We want to select Ubuntu 14.04,
    which is the default.


    ![](images/00003.jpeg)


    Once you have selected Ubuntu, scroll down to select the size of server you want
    to deploy.  They have the $20 per month plan selected as the default.  Just click
    on the $5 per month plan, if that is the size you want, and then scroll down to
    select a datacenter region.


    I recommend selecting a region based on your location.  Since I am in the USA
    on the east coast, New York is my pick.


    Under the additional options, it is up to you if you would like a backup.  If
    we were doing development or anything outside of training and testing, I would
    recommend selecting the backup option, but since we just want the basics for now
    to learn, I am going to leave these options unchecked.


    ![](images/00004.jpeg)


    From there, scroll down to the bottom and click the big green ‘Create’ button.


    ![](images/00005.jpeg)


    Then in a matter of a few seconds, your system is setup and ready.  DigitalOcean
    will then email you the IP address, username, and password for your server.


    # Chapter 3


    ## Getting to the CLI


    CLI stands for command line interface, where you can interact with the system
    by entering lines of text.  This is how we interact with our server.


    If you decided not to use the recommended method of setting up a VPS on DigitalOcean
    or another provider, then you can see the CLI on your computers display.  When
    you boot your computer, it will bring you to the CLI, where you can then login. '
