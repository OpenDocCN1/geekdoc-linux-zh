    If we use `pwd` we will find that we are back at, `/home/milo`.


    Now, use `cd` with the full path to the documents directory. Remember, that Linux
    is case sensitive.


    ### Change Directory Using a Full Path


    | Item | Description |

    | :--- | :--- |

    | Command | `cd /home/milo/documents` |

    | Result | Changes to specified directory |

    | CLI | `milo@ubuntu:~ $ cd /home/milo/documentsmilo@ubuntu:~/ documents$` |


    If we wanted to get the parent directory of this folder we can also use: `cd ..`


    ### Move Up A Directory Level


    | Item | Description |

    | :--- | :--- |

    | Command | `cd ..` |

    | Result | System moves us to the parent folder |

    | CLI Display | `milo@ubuntu:~/ documents$ cd ..milo@ubuntu:~$` |


    You should be getting the hang of it now! Experiment some more and in the next
    section we will create some files using the built in text editor, `nano`.


    ### Creating and Editing Files With Nano


    `nano` is a useful text editor for the command line interface (CLI) in Linux systems.
    Since we are using the CLI, `nano` is keyboard oriented with control keys, rather
    than using a mouse. By learning some of the control keys, you will be able to
    quickly edit files from the `nano` editor. Once you pick this up and learn more
    about using Linux by the command line you can then move onto more advanced editors
    like `vi` and, which are great, but often have a steeper learning curve.


    `nano` is easy to use and great for beginners. It is often installed by default
    in Ubuntu and other distros and works very well with `sudo` from the command line.
    It’s a WYSIWYG editor; “what you see is what you get.”


    If you built your Ubuntu server with DigitalOcean or another VPS provider it is
    already installed. In some circumstances if you installed Ubuntu manually, if
    may not be installed. We will talk about installing packages to Ubuntu more in
    a later chapter, but in case you do not have `nano`, you can install it by using
    the command: `sudo apt-get install nano`


    Again we will discuss installing packages in more detail later, but that command,
    if you don’t already have `nano`, will install it to your server. Let’s go ahead
    and create a file using `nano`.


    ### Creating a file in nano


    | Item | Description |

    | :--- | :--- |

    | Command | `nano notes.txt` |

    | Result | System launches `nano` for new file `notes.txt` |

    | CLI Display | `milo@ubuntu:~$ nano notes.txt` |


    Now, you will notice that we are in a simple text editor. Since we do not have
    a mouse we can get a list of the control keys by pressing control and `G` at the
    same time. See a complete list of `nano` command keys in the table below:


    | Nano command keys |

    | :--- | :--- |

    | `^` represents the control `Ctrl` key |

    | `^G` (F1) | Display this help text |

    | `^X` (F2) | Exit from `nano` |

    | `^O` (F3) | Write the current file to disk |

    | `^J` (F4) | Justify the current paragraph |

    | `^R` (F5) | Insert another file into the current one |

    | `^W` (F6) | Search for a string or a regular expression |

    | `^Y` (F7) | Go to previous screen |

    | `^V` (F8) | Go to next screen |

    | `^K` (F9) | Cut the current line and store it in the cutbuffer |

    | `^U` (F10) | Uncut from into the current line |

    | `^C` (F11) | Display the position of the cursor |

    | `^T` (F12) | Invoke the spell checker, if available |

    | `M-\` (M-\|) | Go to the first line of the file |

    | `M-/` (M-?) | Go to the last line of the file |

    | `^Y` | Prev Page |

    | `^P` | Prev Line |

    | `^X` | Exit |

    | `^V` | Next Page |

    | `^N` | Next Line |


    In the `nano` editor, enter the following text:


    ```

    Nano notes: Nano is a useful text editor for the command line interface (CLI)
    in Linux systems. Since we are using the CLI, nano is keyboard oriented with control
    keys, rather than using a mouse.

    ```


    ![](images/00009.jpeg)


    Once you have the text entered, use the exit command keys:


    `Control + X`


    You then will be prompted if you want to “Save modified buffer?” Press `Y` then
    `Enter` to save the file.


    Now let’s see what is in our folder by using the `ls` command.


    ### List Files


    | Item | Description |

    | :--- | :--- |

    | Command | `ls` |

    | Result | Lists the files in the current directory |

    | CLI Display | `milo@ubuntu:~$ lsdocuments notes.txt` |


