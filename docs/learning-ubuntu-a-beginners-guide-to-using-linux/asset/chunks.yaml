  trans: "\n\n在命令之前加上 `sudo`，允许我们的用户 `milo` 能够将其提升到更高的安全权限，以便安装软件和进行更改。`sudo` 会以超级用户的身份运行该命令，尽管用户\
    \ `milo` 通常只具有有限的访问权限。这一点稍后在我们深入使用它时会详细介绍，但首先我们需要创建 `milo` 的账户。\n\n| 添加新用户 |\n\
    | 命令 | `adduser milo` |\n| 结果 | 系统设置了用户 `milo` |\n| CLI 显示 | `root@ubuntu:/# adduser\
    \ miloAdding user ‘milo’ …` |\n\n一旦你运行了该命令，系统将会要求你设置账户。系统会首先提示你输入密码。然后它会提示你输入用户信息，例如全名（Full\
    \ Name），你可以通过按 `ENTER` 使用默认设置来跳过这些信息。如果这是一个生产系统，添加姓名、房间号、工作电话、家庭电话和其他信息可能会很有用，但目前没有理由不跳过它们。一旦到达末尾，你需要输入\
    \ `Y` 然后按回车键。\n\n你可以在下方看到我添加 `milo` 过程的截图，如果你需要额外帮助。\n\n![](img/00008.jpeg)\n\n\
    早些时候，我们学习了如何更改密码。如果你是 `root` 或 `sudo` 用户，也可以按照下面的步骤更改用户的密码。由于我们刚刚设置了 `milo` 的密码，你可能不想更改它，但这些是你将会会采取的步骤。\n\
    \n| 修改用户密码 |\n| 命令 | `passwd milo` |\n| 结果 | 系统将提示你为用户 milo 设置新密码。 |\n| CLI 显示\
    \ | `root@ubuntu:/# passwd miloEnter new UNIX password:Retype new UNIX password:passwd:\
    \ password updated successfully` |\n\n好了，现在我们已经设置好了 `milo`，但仍然需要授予他使用 `sudo` 的权限。我们只对可能需要增加安全权限的用户执行此操作。\n\
    \n首先，我们需要打开 sudoer 配置文件进行修改。我们可以通过使用 `visudo` 命令来实现。\n\n| 授予用户 Sudo 权限 |\n| 命令\
    \ | `visudo` |\n| 结果 | 系统将打开 sudoers 文件。 |\n| CLI 显示 | `root@ubuntu:/# visudo#\
    \ This file MUST be edited with the 'visudo' command as root.## Please consider\
    \ adding local content in /etc/sudoers.d/ instead of# Directly modifying this\
    \ file.## See the man page for details on how to write a sudoers file.#Defaults\
    \      env_resetDefaults      mail_badpassDefaults      secure_path=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
    # Host alias specification# User alias specification# Cmnd alias specification#\
    \ User privilege specificationroot    ALL=(ALL:ALL) ALL…` |\n\n### 配置 Sudo 权限\n\
    \n此文件中有很多文本，但不要被它吓到。在上面的表格中我强调了：`root ALL=(ALL:ALL) ALL`。\n\n在该选择下方，我们需要添加以下内容：\n\
    \n`milo    ALL=(ALL:ALL) ALL`\n\n按下方向键，直到进入 User privilege specification（用户权限规范）下\
    \ `root` 下方的空白处。在那里输入 `milo`，按 `tab` 键，输入 `ALL=(ALL:ALL)`，然后按空格，输入 `ALL`。现在按控制键和\
    \ `X`。系统会询问你是否想要保存修改后的缓冲区。按 `Y` 并按回车。\n\n现在你可以松口气了。我知道我们进展得有点快，但开始使用除 `root` 以外的用户\
    \ ID 是重要的。同时，我们能够安装软件并学习更多知识也很重要，因此这是必要的。\n\n在继续之前之前，我们可以学习两个快速命令。现在你的 CLI 上可能有很多文本。如果你想清理它们，可以使用\
    \ `clear` 命令。\n\n| 清除屏幕 |\n| 命令 | `clear` |\n| 结果 | 系统将清屏 |\n| CLI 显示 | `root@ubuntu:/#\
    \ clear` |\n\n现在我们已经有了清洁的屏幕，在继续使用新用户 ID `milo` 之前，我们可以关闭 PuTTY。\n\n| 退出 |\n| 命令\
    \ | `exit` |\n| 结果 | 系统将关闭 SSH 会话并退出 PuTTY |\n| CLI 显示 | `root@ubuntu:/# exit`\
    \ |\n\n## 快速回顾\n\n1. 作为一种良好的使用习惯，我们应该避免使用 `root` 用户。\n2. 在命令前使用 `sudo` 允许用户拥有超级用户权限。\n\
    3. 我们可以使用命令 `adduser` 加用户名来添加用户。\n   - 示例：`adduser nathan`\n4. 我们可以通过在用户名之前使用\
    \ `passwd` 命令来更改用户的密码。\n   - 示例：`passwd nathan`\n5. 要获得使用 `sudo` 的权限，用户必须先添加到配置文件中，可以通过\
    \ `visudo` 命令进行编辑。\n6. 如果我们的 CLI 变得太混乱，可以使用 `clear` 命令将其清理。\n7. 要结束会话并注销 PuTTY，我们可以使用\
    \ `exit`。\n\n# 第 5 章\n\n## 系统状态概览\n\n使用我们在上一章中创建的新用户登录你的服务器。\n\n## 导航、创建目录和文件\n\
    \n部分内容是对前章节的复习。现在我们已经登录了，使用 `pwd` 命令查看你的位置。\n\n| 查找当前目录位置 |\n| 命令 | `pwd` |\n\
    | 结果 | 系统将输出你所在的目录。 |\n| CLI 显示 | `milo@ubuntu:~$ pwd/home/milo` |\n\n注意，我们这次的目录与登录时不同。上次我们在\
    \ `/root`，那是 `root` 的家目录。这次我们在 `/home/milo`，这是 `milo` 的家目录。\n\n提示：如果你需要回到家目录，请使用\
    \ `cd`。\n\n现在我们已经在家目录了，让我们创建一个名为 `documents` 的新目录。\n\n| 创建新目录 |\n| 命令 | `mkdir\
    \ documents` |\n| 结果 | 系统将创建子目录 `documents` |\n| CLI 显示 | `milo@ubuntu:~$ mkdir\
    \ documentsmilo@ubuntu:~$` |\n\n使用 `ls` 命令列出家目录的内容，查看 `documents` 目录是否存在。\n\n\
    | 列出文件 |\n| 命令 | `ls` |\n| 结果 | 列出当前目录下的文件 |\n| CLI 显示 | `milo@ubuntu:~$ lsdocuments`\
    \ |\n\n通过使用 `ls`，我们现在看到除了 `documents` 之外，目录是空的。\n\n让我们利用之前章节中学的知识练习导航技能，进入 `documents`\
    \ 目录。\n\n尝试使用命令：`cd Documents`\n\n你可能会发现它返回 `cd: Documents: No such file or directory.`。Linux\
    \ 是大小敏感的，这意味着 `Documents` 和 `documents` 是两个不同的东西。在使用 Ubuntu 时要记住这一点，因为正确的大小写非常重要。\n\
    \n现在让我们用正确的方法来。\n\n| 切换到子目录 |\n| 命令 | `cd documents` |\n| 结果 | 切换到 documents 目录\
    \ |\n| CLI 显示 | `milo@ubuntu:~$ cd documentsmilo@ubuntu:~/documents$` |\n\n使用\
    \ `ls` 命令列出目录中的文件，你会发现它是空的。\n\n现在让我们使用 `cd` 回家目录。\n\n| 切换到用户家目录 |\n| 命令 | `cd`\
    \ |\n| 结果 | 切换到用户的家目录 |\n| CLI 显示 | `milo@ubuntu:~/documents$ cdmilo@ubuntu:~$`\
    \ |\n\n"
