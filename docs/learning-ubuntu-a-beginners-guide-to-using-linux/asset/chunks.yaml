    Now that `phpmyadmin` is installed, we can see if it works by going to `http://myipaddress/phpmyadmin`
    and entering our credentials.


    If your installation was successful, you should see a screen like the one below:


    ![](images/00013.jpeg)


    We will get back to more of this later, but there are a few more things that we
    should learn first.


    By now we know some of the basics of installing, updating, navigating, and setting
    up a VPS.


    Next we will take a look at understanding, Linux file and directory permissions.


    # Chapter 8


    ## Understanding Permissions


    To understand how to allocate permissions to users and groups, we must first understand
    how the Linux permissions work. It is much easier than determining Window’s Server
    permissions, once you establish an understanding for it.


    On a Window’s Server there are a variety of permission types to allocate. See
    the figure below:


    ![](images/00014.jpeg)


    Ubuntu and other Linux systems have three basic permission groups and three basic
    permission types.


    ### Permission Groups


    - Owner – The owner permissions apply only to the owner of the file or directory.


    - Group – The group permissions apply only to the group that has been assigned
    to the file or directory.


    - All Users – The all user’s permissions apply to all users on the system. This
    is the permission group you will want to be the most careful of.


    ### Permission Types


    - Read – The read permission refers to a user’s capability to read the contents
    of the file, but does not allow them to write or save changes.


    - Write – The write permissions refer to a user’s capability to write or modify
    a file or directory.


    - Execute – The execute permission affects a user’s capability to execute a file
    or view the contents of a directory.


    We can view the existing permissions and check them by using the CLI and our familiar
    `ls` command, with the `-l` flag.


    | List Files with Details |

    | :--- | :--- |

    | Command | `ls -l` |

    | Result | Lists the files in the current directory with details |

    | CLI Display | `milo@ubuntu:~$ ls –l-rw-rw-r-- 1 milo milo 196 Feb 13 20:48 notes.txt`
    |


    Dissecting the output:


    `-rw-rw-r-- 1 milo milo 196 Feb 13 20:48 notes.txt`


    The first section that is displayed, `-rw-rw-r--`, shows the permissions for the
    file.


    When we are viewing the permissions by using the `ls –l` command, we can understand
    them by using the following key.


    | Understanding File Permissions |

    | :--- | :--- |

    | Read | `r` |

    | Write | `w` |

    | Execute | `x` |


    As we view the permission for our `notes.txt` file, we can make a few observations
    based on the output: `-rw-rw-r--`.


    The first three characters `rw-`, tells us that the user `milo` has read and write
    permissions for the file `notes.txt`. The second set of characters shows us that
    the group `milo`, also has read and write permissions. The last, shows us the
    all users permissions. From looking at the output, all users can read the file,
    but not write to it.


    ### Using Binary References to Set Permissions


    Noe what we understand the basics of permission groups and permission types, setting
    permissions using binary references, should be fairly simple. It is important
    to understand that when you set file permissions this way, it is done by three
    integers. An integer is a whole number (Example: 1, 2, and 4).


    To set permissions, we must determine the binary representation of the `rwx` string.
    `RWX` String is the binary representation that allows us to set read, write, and
    execute permissions.


    We must use the table below to calculate the permissions we want for a file or
    directory.


    | File Permissions: Binary Representation |

    | :--- | :--- |

    | Read | 4 |

    | Write | 2 |

    | Execute | 1 |


    We get the permission number by adding the integers together. We must do this
    for each of the three permission groups.


    For example:


    Read Access = 4


    Read and Write Access = 6


    Read, Write, and Execute Permission = 7


    Each permission group needs a number. The number we make for setting permissions
    will be 3 digits. Remember, the order is user, group, and all users.


    **Exercise 1: What does a permission of 777 mean?**


    This means that the user, group, and all users have read, write, and execute access.
    Using `777` as a permission setting is not good for establishing strong security.


    **Exercise 2: What does a permission of 655 mean?**


    This means that the user has permission to read and write. The group has permission
    to read and execute. All users can also read and execute.


    **Exercise 3: What does a permission of 444 mean?**


    This means that both the user, group, and all users have only read access to a
    file.


    **Exercise 4: What does a permission of 755 mean?**


    This means that the user has read, write, and execute permission. The group and
    all users can only read and execute. This is often the permission setting recommended
    for the web directory for those using WordPress.


    Before we go over the steps of applying permissions we should first learn how
    to transfer files. That process will open the door for applications in which we
    will learn to set permissions.


    ## FTP Transfer


    Assuming that you want to install WordPress, an easy way to do that is by using
    FTP. FTP stands for file transfer protocol and is used to transfer files between
    a client and server.


    To connect and send files to our server we will use a program called `FileZilla`.
    `FileZilla` offers both a FTP client and server. For us to upload files, we need
    the client. You can download `FileZilla` from: [https://filezilla-project.org/](https://filezilla-project.org/)


    Our DigitalOcean VPS already has FTP capability preloaded for `SFTP`, which is
    what we will be using. `SFTP`, uses `SSH` to transfer files using secure shell.
    There are other options available that you could install to your server for FTP,
    if you decide not to use the one that I recommend.


    One that I have used and would recommend is `VSFTPD`, but we are not going to
    walk through the setup of that in this beginner’s book.


    Let’s make a file on our computer to transfer. Open notepad and create a file
    named `ftptest.txt`. You can type whatever you like within the file, but we will
    use this to test file transfer.


    Once you have that file created and have the `FileZilla` Client installed we can
    continue by launching the `FileZilla` Client.


    To connect some information will need to be entered in the top of `FileZilla`:
    Host, Username, Password, and Port.


    In the host field we will need to enter our IP address. In the username field
    and password field we will enter the user `milo` and his password. The port number
    for `SFTP` is `22`. Once that is entered we can click Quickconnect.


    ![](images/00015.jpeg)


    Once you connect, you will see the home directory for `milo` on the right of `FileZilla`.
    On the left you will see your local computers file structure. Navigate to the
    folder on your PC that you made the `ftptest.txt` file and drag it over to `milo’s
    home directory. In a few seconds you will see that the transfer was successful.
    Now if we log into our server with `PuTTY` and use the `ls` command, we will see
    the file.


    If you wish to use your VPS for a web server, we will need to put files into the
    `/var/www/html` directory. In `FileZilla`, change the remote site directory to:
    `/var/www/html`. See below for reference:


    ![](images/00016.jpeg)


    Now let’s try to upload our `ftptest.txt` file to this directory.


    Your upload will fail as seen in the image below.


    ![](images/00017.jpeg)


    Why is that? Well, we do not have the permissions for `milo` to upload to that
    directory.


    ### Overview: Ownership of Files and Directories


    In the next few pages in this book we will allow `milo` to upload the files for
    WordPress and also learn more about changing file or directory ownership. We will
    do this by changing permissions and then modifying them to the recommended permission
    settings for WordPress.


    Log into your VPS and when you are ready, run the command in the table below.


    | Changing the Owner of a Directory |

    | :--- | :--- |

    | Command | `sudo chown milo -R /var/www` |

    | Result | System will make `milo` the owner of the directory, along with all
    subdirectories. |

