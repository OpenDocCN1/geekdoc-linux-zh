    You then will be prompted if you want to “Save modified buffer?”  Press Y then
    Enter to save the file.


    Now let’s see what is in our folder by using the ls command.


    | List Files |


    | Command | ls |


    | Result | Lists the files in the current directory |


    | CLI Display | milo@ubuntu:~$ lsdocuments    notes.txt |


    ## Editing, Deleting, Moving, and Copying


    With our notes.txt file created, we can now learn how to move, edit, delete, and
    copy files.


    To get started, let’s copy the notes.txt file to a new file called test.txt. 
    To do this we will use the cp command, which will allow us to copy one file to
    another.  To use cp, we need to also provide the file we want to copy, and also
    the file we want to copy into.  See the table below:


    | Copy to New File |


    | Command | cp  notes.txt  test.txt |


    | Result | System copies notes.txt and creates a new file, test.txt with the contents.
    |


    | CLI Display | milo@ubuntu:~$ cp  notes.txt  test.txtmilo@ubuntu:~$ |


    By using the ls command, we can check to see if the file was copied.


    | List Files |


    | Command | ls |


    | Result | Lists the files in the current directory |


    | CLI Display | milo@ubuntu:~$ lsdocuments   notes.txt   test.txt |


    Now that we have two files, we should open test.txt in nano and make a few changes.


    | Open a File in Nano |


    | Command | nano test.txt |


    | Result | System will open test.txt in nano. |


    | CLI Display | milo@ubuntu:~$ nano test.txt |


    When you open the file, you will notice that it has the same text as our notes.txt
    file.  To the beginning of this document, let’s add a line: This document is a
    test for learning Linux.


    Once that is added.  Save the file as we did earlier.


    With the cp command, the file is copied.  When we move a file, it is like using
    cut in Windows as the original is deleted.


    We will now move test.txt into the documents directory.  By using the mv command
    we can move files.  After mv, we put the name of the file we want to move and
    then the location we want to move it to. 


    | Move a File |


    | Command | mv test.txt documents/test.txt |


    | Result | System will open test.txt in nano. |


    | CLI Display | milo@ubuntu:~$ mv test.txt documents/test.txtmilo@ubuntu:~$ |


    If you change your directory to documents and use ls you will find the test.txt
    file is now located there.


    | Change Directory to Documents and List Files |


    | Command | cd documents; ls |


    | Result | System will change to documents and list files. |


    | CLI Display | milo@ubuntu:~$ cd documents; lsmilo@ubuntu:~/documents$test.txt
    |


    You may notice above that I used a semi-colon after cd documents.  This allows
    us to combine two commands.  In this example the semi-colon allowed us to change
    directory and then list the files in the new directory.


    Now we can also use mv to rename a file. Using the command below, we can rename
    the file and list the files in the directory.


    | Using mv to Change File Name |


    | Command | mv test.txt newtest.txt; ls |


    | Result | System will change the file name to newtest.txt and list the files
    in the directory. |


    | CLI Display | milo@ubuntu:~/documents$mv test.txt newtest.txt; lsnewtest.txt
    |


    Hopefully you are not too attached to this file as in the next table, we will
    learn how to delete a file, using rm.


    | Using rm to Delete a File |


    | Command | rm newtest.txt |


    | Result | System will delete newtest.txt |


    | CLI Display | milo@ubuntu:~/documents$rm newtest.txtmilo@ubuntu:~/documents$
    |


    If want you can use ls, but you will find that the directory is empty. 


    Now let’s go back to our parent directory.


    | Move to Parent Directory |


    | Command | cd .. |


    | Result | System will move up to parent directory |


    | CLI Display | milo@ubuntu:~/documents$ cd ..milo@ubuntu:~ $ |


    When deleting files or directories, be very careful as one misstep could delete
    the entire system. Avoiding using the root user helps with this. 


    Sometimes you may want to delete a directory, but to delete a directory we must
    add a flag.


    If we use rm documents, we will get an error that it is a directory.


    To delete a directory, we must use the command in the table below.


    | Delete a Directory |


    | Command | rm –r documents |


    | Result | System will delete the directory named documents. |'
