  trans: '

    如果你正在使用 VPS，那么你需要一种连接并查看 CLI（命令行界面）的方法。我们可以使用名为 `SSH` 的协议连接到 VPS。`SSH` 代表 Secure
    Shell（安全外壳），这是我们远程登录服务器的加密方式。


    当我们注册 DigitalOcean 时，他们会向我们发送一封包含我们的 IP 地址、用户名和密码的邮件。如果你使用了类似的服务，它也会为你提供这些信息或允许你手动设置。虽然你可能熟悉用户名和密码熟悉，但你可能不熟悉
    IP 地址。IP 地址是一段标识网络上计算机的数字字符串。对于我们的 VPS，IP 地址是公网 IP，可以从任何连接互联网的地方访问。


    我推荐用于 SSH 连接到服务器的程序叫做 `PuTTY`。`PuTTY` 是一个免费、开源的 SSH 客户端，支持 Windows 系统。你可以从以下链接下载它：


    [`putty.org`](http://putty.org)


    你下载的文件是一个可执行文件（`.exe`），不需要安装。下载后，你可以将其拖到桌面以便快速访问。


    使用此工具连接到你的 VPS 非常简单。在 Host Name（主机名）或 IP address 下，输入提供的 IP 地址。选择 `SSH` 作为连接类型，然后点击
    open。参见图 1 以示例其外观。


    注意：你的 IP 地址将与图中不同。


    图 1：Putty 配置


    ![](img/00006.jpeg)


    当你点击 connect 时，可能会收到类似图 2 所示的消息。点击 Yes。


    图 2：PuTTY 安全警报


    ![C:\Users\Nathan\AppData\Local\Microsoft\Windows\INetCache\Content.Word\2016-02-08_19h51_40.png](img/00007.jpeg)


    ## 首次登录


    现在你将被提示登录。输入用户名 `root`，然后输入提供的密码。


    如果你使用的是 DigitalOcean，系统会在你第一次登录时要求重置密码。你需要重新输入提供的密码，然后输入两次你想设置的新密码。确保你遵循安全密码指南，并为
    root 用户设置安全的密码。


    注意：在整本书中，我使用表格来解释我们将要学习的不同命令。第一行是我们想要执行的任务，第二行是我们需要使用的命令，第三行是你的 CLI 对应的示例。我认为这是描绘和解释我们将学习的命令的最佳方式。


    如果你没有被提示更改密码，但想更改，可以输入命令 `passwd`。更多细节请参见下页的表格。


    | 修改我的密码 |

    | :--- | :--- |

    | 命令 | `passwd` |

    | 结果 | 系统提示新密码 |

    | CLI 显示 | `root@ubuntu:~# passwdEnter new UNIX password:Retype new UNIX password:passwd:
    password updated successfully` |


    ## 导航


    不要被 CLI 上的白字和黑背景吓到。我知道这里没有鼠标或图形，但过了一会儿，你就会习惯在服务器的目录之间导航。目录（Directory）就像你在 Windows
    或 Mac 设备上使用的文件夹。作为一个长期使用这种工具的人，我实际上更喜欢而不是图形用户界面。在进行任何其他操作之前，让我们学会探索服务器。通过使用 `pwd`
    命令，我们可以看到当前查看的目录位置。


    | 查找你的当前目录位置 |

    | :--- | :--- |

    | 命令 | `pwd` |

    | 结果 | 系统将输出你所在的目录 |

    | CLI 显示 | `root@ubuntu:~# pwd/root` |


    现在我们处于一个名为 `root` 的目录中，它本质上是 root 用户的家目录。这个 root 目录和系统的根目录之间有很大区别。


    路径 `/` 是系统的根目录，但现在我们处于一个名为 `root` 的子目录中（`/root`）。


    服务器的根目录是顶级目录。它包含子目录。从我们当前的位置，有两种方法到达那里。让我们从最简单的命令开始进入根目录。


    | 进入根目录 (/) |

    | :--- | :--- |

    | 命令 | `cd /` |

    | 结果 | 我们切换到根目录 |

    | CLI 显示 | `root@ubuntu:~# root@ubuntu:/#` |


    现在让我们再次使用 `pwd` 查看我们所在地。


    | 查找你的当前目录位置 |

    | :--- | :--- |

    | 命令 | `pwd` |

    | 结果 | 系统将输出你所在的目录 |

    | CLI 显示 | `root@ubuntu:~# pwd/ |


    如果你想查看文件夹里有什么，我们可以使用 `ls` 命令。


    | 列出文件 |

    | :--- | :--- |

    | 命令 | `ls` |

    | 结果 | 列出当前目录下的文件 |

    | CLI 显示 | `root@ubuntu:/# lsbin  home  lib64  opt  sbin  usrboot initrd.img lost+found  proc  srv  vardev  media  root  sys  vmlinuzetc  lib  mnt  run  tmp`
    |

