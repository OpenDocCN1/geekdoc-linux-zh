    \ Directory (/) |\n\n| Command | cd / |\n\n| Result | We change to the main root\
    \ directory |\n\n| CLI Display | root@ubuntu:~# cd /root@ubuntu:/# |\n\nNow let’s\
    \ use, pwd again to see where we are at.\n\n| Find Your Current Directory Location\
    \ |\n\n| Command | pwd |\n\n| Result | System will output the directory that you\
    \ are in. |\n\n| CLI Display | root@ubuntu:~# pwd/ |\n\nIf you want to see what\
    \ is in the folder, we can use the ls command.\n\n| List Files |\n\n| Command\
    \ | ls |\n\n| Result | Lists the files in the current directory |\n\n| CLI Display\
    \ | root@ubuntu:/# lsbin   home  lib64  opt  sbin  usrboot initrd.img lost+found  \
    \ proc  srv   vardev   media   root   sys   vmlinuzetc   lib  mnt   run  tmp |\n\
    \nWe can also go into more detail by adding a flag after ls. \n\nA flag is typed\
    \ at the prompt as part of our command and adds additional parameters to tell\
    \ the system what we want.\n\nTry running this command: ls –la\n\nIn that example,\
    \ –la is the flag.  The l tells the system that we want to see more details and\
    \ a lists all the files in the directory, even the hidden ones.\n\nNow, let’s\
    \ change to the directory named home.\n\n| Change Directory |\n\n| Command | cd\
    \ home |\n\n| Result | System moves us to child folder home |\n\n| CLI Display\
    \ | root@ubuntu:/# cd homeroot@ubuntu:/home# |\n\nNote: It is important to understand\
    \ the difference between parent and child directories.  If we have a directory\
    \ called documents and another inside of it called pictures.  Pictures would be\
    \ a child directory of documents.  In this instance we were in the parent directory\
    \ / and changed it to the child directory /home.  If you were not in the parent\
    \ folder, you could still navigate to home, but after cd, you would have to list\
    \ the full path (example: cd /home) instead.  If you get an error such as, “No\
    \ such file or directory”, you may need to enter the full path, since you may\
    \ not be in the right parent directory.\n\nIf we want to go back to the root directory\
    \ we can use another change directory command, which makes going up a directory\
    \ very easy.\n\n| Move Up A Directory Level |\n\n| Command | cd .. |\n\n| Result\
    \ | System moves us to the parent folder |\n\n| CLI Display | root@ubuntu:/home#\
    \ cd ..root@ubuntu:/# |\n\nUsing cd  along with the directory names and .. can\
    \ allow us to quickly move throughout our server.\n\n## Quick Recap\n\n1) CLI\
    \ stands for command line interface, where you can interact with the system by\
    \ entering lines of text.\n\n2) SSH stands for Secure Shell, which is an encrypted\
    \ way that we can remote login to our server.\n\n3) An IP Address, is a string\
    \ of numbers that identifies a computer on a network.\n\n4) PuTTY is a free SSH\
    \ client that is open source and supported on Windows.\n\n5) The passwd command,\
    \ allows us to change the current users password.\n\n6) Entering pwd, will provide\
    \ us with our current location in the server’s directories.\n\n7) Using ls, will\
    \ list the files and directories in our current directory.\n\n8) Adding a flag,\
    \ such as –la, after ls, provides us with more details and shows hidden files.\n\
    \n9) We can use cd, to change directories quickly\n\n1.  1.  We can move up a\
    \ folder with cd  ..\n\n    2.  Putting a child directory after cd, will put us\
    \ in the directory.\n\n        1.  Example: cd home\n\n    3.  We can always find\
    \ root by using cd /\n\n10) The path / is the root of the system, but /root is\
    \ a child or sub directory named root.\n\n# Chapter 4\n\n## Creating a New User\n\
    \nThe user ‘root’ has full access to the system.  While we used it to learn some\
    \ basic navigation, we should not use it as our main username for the system. \
    \ It defeats the security model that is great and makes Linux systems so secure. \
    \ By not using root, it also prevents accidental typo errors that could result\
    \ in disasters.  It’s just good practice.  What we will do in our next command\
    \ is create a new user, named milo, and then we will provide him with sudo access."
