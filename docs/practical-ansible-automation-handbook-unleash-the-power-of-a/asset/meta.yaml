  - 结论由于作为基础设施自动化工具的本质，Ansible 有一些独特的特性：存储敏感信息（Ansible vault）、仅在真正需要时执行任务（handler）、应用文本处理（filters）以及配置管理（template）。最好的部分是
    Ansible 引擎可以使用某些 Ansible 插件完全扩展。在组织中采用时，我们可以从公共的 Ansible Galaxy 存档中受益，复用代码标准包（role
    和 collection）。在接下来的章节中，我们将使用这些知识简化 Linux 和 Windows 管理。下一章中，我们将学习如何为 Ansible 配置。
