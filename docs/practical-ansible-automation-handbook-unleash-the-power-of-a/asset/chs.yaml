  \ 6.6 所示。\n\n# Visual Studio code\n\nVisual Studio Code (VSCode) 是由微软开发的免费开源代码编辑器（IDE）。它支持广泛的编程语言，并为代码编辑、调试和版本控制提供了丰富的功能。我们可以从\
  \ [`code.visualstudio.com/`](https://code.visualstudio.com/) 下载适用于常见操作系统的编辑器：通用二进制文件的\
  \ macOS、Windows x64，以及作为 RPM 和 DEP 包格式的 Linux x64。\n\nVSCode 是 Ansible 代码开发的首选工具，因为它极大地提高了开发者的生产力。不过，可以使用任何文本编辑器。\n\
  \nAnsible 与 VSCode 的集成允许开发者利用这两个工具的强大功能。这种集成允许开发者在 VSCode 环境中编写、测试和部署 Ansible playbooks。它为创建和编辑\
  \ playbooks 提供了一个直观的界面，以及一系列调试和测试功能。\n\nAnsible VSCode 集成的一些主要优势包括：\n\n1. **代码补全和语法高亮：**\
  \ VSCode 为 Ansible 模块提供自动补全，为 Ansible YAML 文件提供语法高亮，使开发者更容易编写和调试 Ansible 代码。\n2.\
  \ **IntelliSense 和 检查：** VSCode Ansible 扩展为 Ansible 模块和 playbooks 提供 IntelliSense\
  \ 和检查。这确保了代码没有错误并符合最佳实践。\n3. **调试：** VSCode 允许开发者使用断点、变量检查和逐步执行来调试 Ansible 代码。这有助于识别和修复复杂\
  \ playbooks 中的问题。\n4. **Ansible Galaxy 集成：** VSCode 与 Ansible Galaxy（Ansible roles\
  \ 和 collections 的仓库）集成。这让能够轻松发现、下载和使用预构建的 Ansible 内容。\n5. **持续集成/持续部署 (CI/CD) 支持：**\
  \ VSCode Ansible 扩展支持与 Jenkins、Travis CI 和 GitLab CI 等流行的 CI/CD 工具集成。这允许对 Ansible\
  \ playbooks 进行自动化测试和部署。\n\nAnsible VSCode 集成为开发和部署 Ansible playbooks 提供了强大且直观的界面。它提高了效率，确保了代码质量，并简化了复杂系统的管理。为了获得最佳体验，请确保安装了\
  \ Red Hat 的 Ansible 扩展，如图 6.7](#c06.xhtml_fig6_7)所示：\n\n![](img/Figure-6.7.jpg)\n\
  \n**图 6.7:** Ansible VSCode 扩展\n\n在底层，Ansible 扩展使用相同的 `ansible-lint` 规则来突出最佳实践并在编程期间提供辅助。每一行带有建议的代码都有红色下划线，当我们将鼠标光标悬停其上方时，就会如图\
  \ 6.8 所示的第 7 行代码提示：\n\n![](img/Figure-6.8.jpg)\n\n**图 6.8:** Ansible VSCode 集成建议\n\
  \n# Ansible 自插件\n\n当项目中添加额外的 Ansible 插件和模块时，它们是用 Python 语言编写的。使用像 `pylint` 这样的 Python\
  \ Linter 来验证 Python 文件可能会有用。\n\n可以使用 pip 或最常用的发行包管理器安装 `pylint` 工具。使用 PIP，可以通过以下命令在本地机器上安装所有所需的依赖：\n\
  \n```bash\npip install pylint\n```\n\n执行输出如下图 6.9 所示：\n\n![](img/Figure-6.9.jpg)\n\
  \n**图 6.9:** PyLint 安装\n\n# CI/CD 流水线\n\n我们将所有的 Ansible 语法检查、YAML linter、Ansible\
  \ linter 和 Python linter 工具组合到 CI 流水线中，以便在仓库的每次提交中尽快发现错误，或者确保每次发布都不会包含可能在生产环境中产生故障或意外行为的错误。在\
  \ CI 流水线中集成所有工具允许我们创建一个工作流，在任何执行之前批准更改。我们可以使用多种工具构建 CI 流水线；最流行的是 Jenkins、GitLab、GitHub\
  \ Actions 等。\n\n# Ansible 连接\n\n常见的 Ansible 连接错误与 SSH 认证有关。以下是关于此错误的细节：\n\n1. **SSH\
  \ 认证错误：** 当 Ansible 无法通过 SSH 远程服务器进行身份验证时发生此错误。这可能是由于登录凭据错误或缺少 SSH 密钥。\n2. **主机密钥验证错误：**\
  \ 当 Ansible 不识别远程服务器的主机密钥时发生此错误。这可能发生在首次访问远程服务器或主机密钥发生更改。\n3. **网络连通性错误：** 当 Ansible\
  \ 由于网络连接问题（如防火墙拦截或网络拥塞）无法连接到远程服务器时发生此错误。\n4. **SSH 超时错误：** 当连接在完成身份验证之前超时时发生此错误。这可能是由于网络连接缓慢或其他网络问题导致的。\n\
  5. **拒绝连接错误：** 当远程服务器不接受 SSH 连接时发生此错误。这可能是由于 SSH 守护进程未运行或在不同的端口上监听。\n\n要解决最常见的 Ansible\
  \ 连接错误，用户应首先确保登录凭据正确且 SSH 密钥存在并有效。他们还应该验证主机密钥，如果它不在那里则将其添加到 `known_hosts` 文件中。用户还应该检查\
  \ Ansible 控制节点与远程服务器之间的网络连通性，并确保防火墙没有阻止 SSH 连接。此外，他们应该检查 SSH 守护进程是否在正确的端口上运行。\n\n\
  # 错误\n\n连接失败（Connection failed）错误是是最常见的 Ansible 问题之一，非常令人困扰。这类问题的根本原因可能是网络连接、防火墙、某些\
  \ SSH 配置参数，甚至是我们的 Ansible 清单中写错了 Ansible 主机名。\n\n结果是致命的连接失败错误，我们经常在执行日志中看到操作超时（operation\
  \ timed out）的消息。\n\n当我们处理虚拟机时，请验证虚拟网卡的连接，并确保防火墙中已启用 SSH 服务。手动到目标主机进行 SSH 连接测试对连接可能有帮助。\n\
  \n# 示例\n\n\n\n\n\n现在让我们以错误的主机名作为目标机器来模拟并解决问题。正确的主机名是 `server01.example.com`，但假设我们多输入了一个\
  \ `e`，导致最终的主机名变成了 `serveer01.example.com`。请注意主机名额外的字母 e。这是一个低级且常见的错误。\n\n以下 Ansible\
  \ 清单文件 `inventory_error.ini` 中 `serveer01.example.com` 的目标主机名拼写错误，应该是 `server01.example.com`：\n\
  \n```\nserveer01.example.com\n```\n\n我们可以使用每个 Ansible 安装自带的 `ansible-inventory`\
  \ 命令来验证 Ansible 清单 `inventory_error`。列表视图完整命令如下：\n\n```\nansible-inventory -i inventory_error.ini\
  \ --list\n```\n\n上一个命令产生以下输出：\n\n```json\n{\n  \"all\": {\n    \"children\": [\n\
  \      \"ungrouped\"\n    ]\n  },\n  \"ungrouped\": {\n    \"hosts\": [\n      \"\
  serveer01.example.com\"\n    ]\n  }\n}\n```\n\n一旦输入了正确的主机名（`server01.example.com`），我们就可以看到执行成功。\n\
  \n```\nserver01.example.com\n```\n\n我们可以使用 `ansible-inventory` 命令验证 Ansible 清单文件：\n\
  \n```\nansible-inventory -i inventory --list\n```\n\n```json\n{\n  \"all\": {\n\
  \    \"children\": [\n      \"ungrouped\"\n    ]\n  },\n  \"ungrouped\": {\n   \
  \ \"hosts\": [\n      \"server01.example.com\"\n    ]\n  }\n}\n```\n\n有了正确的 Ansible\
  \ 清单文件，我们获得了正确的主机列表。\n\n# 密码认证\n\n当尝试使用密码认证连接到主机时，我们可能会遇到以下错误消息：\n\n```\nto use\
  \ the 'ssh' connection type with passwords, you must install the sshpass program\n\
  ```\n\n我们需要在 Ansible 控制器上安装 `sshpass` 软件。对于类“Red Hat”操作系统：\n\n```\ndnf install sshpass\n\
  ```\n\n对于类 Debian 发行版：\n\n```\napt install sshpass\n```\n\n关于 `sshpass` 命令行的更多信息，请参阅\
  \ Ansible for Linux 部分。\n\n# Ansible Vault\n\nAnsible Vault 是 Ansible 的一项功能，允许用户加密敏感数据，如密码、API\
  \ 和其他密钥。以下是用户可能会遇到的一些 Ansible Vault 错误及其解决方法：\n\n1. **密码错误：** 如果用户在解密 Ansible Vault\
  \ 文件时输入错误的密码，Ansible 将无法解密该文件并可能报错。用户应确保在解密 Ansible Vault 文件时输入正确的密码。\n2. **缺失或位置错误的\
  \ Vault 标签：** Ansible Vault 使用特殊标签来指示哪些变量或文件应该被加密。如果这些标签缺失或位置错误，Ansible 将无法正确加密或解密数据并可能报错。用户应确保使用正确的\
  \ Vault 标签语法和放置位置。\n3. **加密错误：** 如果加密过程遇到错误，Ansible 可能无法正确加密数据并可能报错。用户应确保正在使用支持的加密算法，并且正在加密的数据没有超过允许的最大长度。\n\
  4. **文件权限错误：** 如果文件权限不正确，Ansible 可能无法读取或写入 Ansible Vault 文件并可能报错。用户应确保文件权限设置正确，并且他们拥有访问文件的必要权限。\n\
  5. **加密方法冲突：** 如果用户在 playbook 中使用了多种加密方法，可能会遇到冲突，导致 Ansible Vault 无法正常工作。用户应确保在\
  \ playbook 中仅使用一种加密方法。\n6. **密钥轮换：** 如果加密密钥被更改或轮换，用户可能无法解密 Ansible Vault 文件并遇到错误。用户应确保有一套安全的流程来轮换加密密钥，并相应更新他们的\
  \ playbook。\n\n总来说，为了避免 Ansible Vault 错误，用户应确保使用强且唯一的密码、正确放置 Vault 标签、使用支持的加密算法、设置正确的文件权限，并遵循密钥管理的最佳实践。此外，用户在在生产环境中运行之前，应充分测试使用\
  \ Ansible Vault 的 playbook。\n\n## 创建\n\n在使用 `ansible-vault create` 命令时可能会发生以下两个错误。\n\
  \n当两个密码不匹配时，通过 `ansible-vault` 命令我们在屏幕上获得以下错误：\n\n```\nNew Vault password:\nConfirm\
  \ New Vault password:\n[WARNING]: Error in vault password prompt (default): Passwords\
  \ do not match\nERROR! Passwords do not match\n```\n\n如果我们通过 `ansible-vault` 命令指定了一个已存在的文件，将获得以下错误消息：\n\
  \n```\nNew Vault password:\nConfirm New Vault password:\nERROR! secret.yml exists,\
  \ please use 'edit' instead\n```\n\n## 加密\n\n当 `vault-password.txt` 文件不存在时，我们将获得以下“未找到密码文件”错误消息：\n\
  \n```\n[WARNING]: Error getting vault password file (default): The vault password\
  \ file not found\n```\n\n（此处省略重复的警告信息）\n\n```\n[WARNING]: Error getting vault password\
  \ file (default): The vault password file not found\n```\n...\n```\n[WARNING]: Error\
  \ getting vault password file (default): The vault password file not found\n```\n\
  \n```\nansible-vault` 命令\n`secret.yml` 已存在。\n\n## 查看\n\n当密码错误时，我们将获得以下输出：\n\n```\n\
  Vault password:\nERROR! Decryption failed\n```\n\n解决方案是对 `ansible-inventory` 命令使用正确的密码。\n\
  \n## Playbook\n\n当我们忘记指定任何密码时，发生了一个致命错误。我们可以模拟以下 `ansible-playbook` 命令，产生如下输出：\n\
  \n```\nTASK [include_vars] *************************************************\nfatal:\
  \ [server01.example.com] => => {\n  \"ansible_facts\": {},\n  \"ansible_included_files\"\
  : [],\n  \"changed\": false,\n  \"message\": \"Attempting to decrypt\"\n}\n```\n\
  \n## 内联 Vault\n\n当我们复制并粘贴 `ansible-vault` `encrypt_string` 命令的输出时，请注意移除输出末尾的字符。如果未移除结束字符，执行可能会在两种场景之一结束：加密变量：\n\
  \n```\nok: [server01.example.com] => {\n  \"password\": \"$ANSIBLE_VAULT;1.1;AES256;323438663430343838353432366533353432223232646334343061393439656537336262363764313764313535383463323232653932626137666432353735316162666638386639623161626635373535616436303232326662376164393166373235303434653935333403360a63646139613964633532646334366669306266643038%\"\
  \n}\n```\n\n执行 `vault_inline.yml` 文件的输出显示了 `Vault format` `unhexlify error` ：\n\n\
  ```\n[WARNING]:\nThere was a vault format error: Vault format unhexlify error: Odd-length\
  \ string\nThe error appears to be in 'vault_inline.yml': line 5, column 15, but\
  \ may be elsewhere in the file depending on the exact syntax problem.\nThe offending\
  \ line appears to be:\nvars:\n  password: !vault |\n  ^ here\n```\n\n\n\n\n\n```bash\n\
  fatal: [localhost]: FAILED! => {\"msg\": \"Vault format unhexlify error: Odd-length\
  \ string\\n\\nThe error appears to be in 'vault_inline.yml': line 5, column 15,\
  \ but may\\nbe elsewhere in the file depending on the exact syntax problem.\\n\\\
  nThe offending line appears to be:\\n\\n  vars:\\n    password: !vault |\\n         ^^\
  \ here\\n\"}\n```\n\n一旦在 `vault_inline.yml` 文件中修正了错误行，执行将继续，并可以在第 3 章：Ansible 语言扩展\
  \ 的 *Ansible Vault 输出* 部分看到所示的结果。\n\n# Ansible 模块\n\nAnsible 模块是执行特定功能的预构建任务。以下是一些常见的\
  \ Ansible 模块错误及其解决方法：\n\n1. **未找到模块（Module not found）：** 当 Ansible 无法找到 playbook\
  \ 中调用的模块时，会发生此错误。用户应确保该模块已安装在 Ansible 控制节点上，并在 playbook 中指定了正确的路径。\n2. **无效模块参数（Invalid\
  \ module parameter）：** 当 Ansible 无法识别模块参数时，会发生此错误。用户应确保使用了模块的正确语法，并指定了所有必需参数。\n\
  3. **权限错误（Permissions error）：** 当 Ansible 没有权限执行模块指定的任务时，会发生此错误。用户应确保他们拥有执行该任务所需的权限，并在必要时以特权用户运行\
  \ Ansible。\n4. **数据类型错误（Incorrect data type）：** 当 Ansible 期望某种类型的数据但接收到不同类型的数据时，会发生此错误。用户应确保以正确的格式传递数据，并使用正确的数据类型。\n\
  5. **连接错误（Connection errors）：** 当 Ansible 无法使用连接插件到远程服务器时，会发生此错误。用户应确保拥有正确的登录凭据、远程服务器可访问，并且已启用\
  \ SSH 访问。\n6. **模块版本不正确（Incorrect module version）：** 当 Ansible 使用过时或不兼容的模块版本时，会发生此错误。用户应确保使用与其\
  \ Ansible 版本兼容的模块版本。\n\n要解决这些 Ansible 模块错误，用户应该确保他们对所使用的模块的语法和要求有清晰的理解。他们还需要确保设置了正确的权限、安装了必要的模块，并使用了正确的数据类型。此外，用户应该彻底测试他们的\
  \ playbook，并验证 playbook 中指定的任务是否按预期执行。\n\n# 缺失模块参数（Missing module parameter）\n\n\
  当 Ansible playbook 中的模块缺少必需参数时，会发生 `Missing Module Parameter` 错误。此错误通常发生在模块有特定的必需参数，且这些参数必须被定义才能成功执行任务时。\n\
  \n例如，`copy` 模块（属于 `ansible.builtin` 集合）要求定义 `src` 和 `dest` 参数。如果缺少这些参数中的任何一个，Ansible\
  \ 将报告“Missing Module Parameter”错误。\n\n要解决此错误，用户应该查阅模块文档，以确定成功执行模块所需的必需参数。然后他们应该将缺失的参数添加到\
  \ playbook 中，或确保它们在清单文件（inventory file）中已定义。\n\n确保使用正确的语法和数据类型正确定义参数同样重要。用户可以使用\
  \ Ansible 的 `debug` 模块打印变量值，以验证它们是否设置正确。\n\n总的来说，`Missing Module Parameter` 错误是一个常见错误，通过查阅模块文档并确保在\
  \ playbook 或清单文件中正确定义了必需参数，可以轻松解决。\n\n## Ansible 服务（Ansible service）\n\n当 Ansible\
  \ 无法确定目标主机上服务的当前状态时，会发生 `Service is in the unknown state` 错误。当使用 Ansible 的 `service`\
  \ 模块启动、停止或重启服务时，可能会发生此错误。\n\n例如，以下错误消息显示目标机器上的 nginx Web 服务处于“unknown state（未知状态）”\n\
  \n```text\nTASK [reload nginx] ****************************************************************************\n\
  fatal: [server01.example.com]: FAILED! => {\"changed\": false, \"msg\": \"Service\
  \ is in unknown state\", \"status\": {}}\n```\n\n以下是排查和解决 `Service is in the unknown\
  \ state` 错误的步骤：\n\n1. **检查服务名称：** 验证 playbook 中的服务名称与目标主机上的服务名称匹配。如果服务名称拼写错误或不，Ansible\
  \ 将无法确定服务的状态。\n2. **验证服务状态：** 使用系统的服务管理命令检查目标主机上的服务状态。这将有助于判断服务是运行、停止还是启动失败。\n3.\
  \ **检查系统日志：** 检查目标主机上的系统日志，查看任何与服务相关的错误。这可以为为什么服务处于未知状态提供见解。\n4. **验证权限提升：** 验证\
  \ Ansible 运行是否具有足够的权限来管理目标主机上的服务。这可能需要以高权限运行 playbook，或为 Ansible 用户配置 sudo 权限。\n\
  5. **确保服务模块已安装：** 验证控制节点上已安装 Ansible 服务模块。如果缺少该模块，Ansible 将无法管理服务。\n6. **尝试不同的模块：**\
  \ 如果 `service` 模块无法工作，尝试使用另一个模块来管理服务。例如，可以使用 `command` 模块直接在目标主机上执行服务管理命令。\n\n总的来说，“Service\
  \ is in the unknown state”错误可以通过验证服务名称、检查服务状态、审阅系统日志、确保模板权限提升、验证服务模块已安装以及尝试不同的模块来解决。\n\
  \n## Ansible 模板（Ansible template）\n\n当 Ansible 控制器或 Ansible 目标节点出现以下五种情况时，Ansible\
  \ 模板可能会运行时产生致命错误。\n\n1. 当目标路径 `/home/devops/` 不存在时，Ansible 返回以下致命错误：\n\n```text\n\
  fatal: [server01.example.com]: FAILED! => {\"changed\": false, \"checksum\": \"\
  96d448ee43c8498088c12c8b1b44e9a022443257\", \"msg\": \"Destination directory /home/devops\
  \ does not exist\"}\n```\n\n参考，请参见第 2 章：Ansible 语言核心 中的 *Ansible Template* 部分以及\
  \ playbook `template_helloworld.yml` 代码。解决方案是验证目标路径 `/home/devops/` true。\n\n2.\
  \ 当控制器上的 Ansible 模板文件丢失或拼写错误时，失败的执行会针对 `templates/helloworld.txt.j2` 文件返回类似的致命错误消息：\n\
  \n我们可以通过将 `helloworld.txt.j2` 文件重命名为 `helloworld2.txt.j2` 来重现。\n\n完整的致命错误消息如下：\n\
  \n任务执行期间发生异常。要查看完整的追溯信息，请使用 -vvv。错误是：如果你正在使用模块并期望文件在远程存在，请查看 remote_src 选项\n\n```text\n\
  fatal: [server01.example.com]: FAILED! => {\"changed\": false, \"msg\": \"Could\
  \ not find or access 'templates/helloworld.txt.j2'\\nSearched in: REDACTED.\\nIf\
  \ you are using a module and expect the file to exist on the remote, see the remote_src\
  \ option\"}.\n```\n\n\n\n\n\n供参考，请参阅*[第 2 章：Ansible 语言核心][*Ansible template]* 部分，playbook\
  \ `template_helloworld.yml` 代码。解决方案是在执行 Ansible playbook 之前验证模板文件 `templates/helloworld.txt.j2`\
  \ 是否存在。\n\n3. 当 Ansible 模板文件使用未定义或拼写错误的变量时，执行失败会返回 `AnsibleUndefinedVariable` 致命错误消息，对于\
  \ `type` 变量，类似于下所示：\n\n```yaml\n{% for server in servers.items() if type == 'large'\
  \ %}\n```\n\n完整的致命错误消息如下：\n\n任务执行过程中发生异常。要查看完整的回溯跟踪，请使用 -vvv。错误为：`ansible.errors.AnsibleUndefinedVariable:\
  \ 'type' is undefined. 'type' is undefined`\n\n```\nfatal: [server01.example.com]:\
  \ FAILED! => {\"changed\": false, \"msg\": \"AnsibleUndefinedVariable: 'type' is\
  \ undefined. 'type' is undefined\"}\n```\n\n供参考，请参阅*[第 2 章：Ansible 语言核心][*Ansible\
  \ Template]* 部分，playbook `template_type.yml` 代码。解决方案是在执行 Ansible playbook 之前验证模板文件中使用的\
  \ `type` 变量的拼写。\n\n4. 当 Ansible 模板文件使用未定义或拼写错误的变量时，执行失败会返回 `AnsibleUndefinedVariable`\
  \ 致命错误消息，对于 `server.type` 变量，类似于：‘tuple object’没有属性 `type`：\n\n```yaml\n{% for server\
  \ in servers.items() if server.type == 'large' %}\n```\n\n完整的致命错误消息如下：\n\n任务执行过程中发生异常。要查看完整的回溯跟踪，请使用\
  \ -vvv。错误为：`ansible.errors.AnsibleUndefinedVariable: ‘tuple object’ has no attribute\
  \ ‘type’. ‘tuple object’ has no attribute ‘type’`\n\n```\nfatal: [server01.example.com]:\
  \ FAILED! => {\"changed\": false, \"msg\": \"AnsibleUndefinedVariable: 'tuple object'\
  \ has no attribute 'type'. 'tuple object' has no attribute 'type'\"}\n```\n\n供参考，请参阅*[第\
  \ 2 章：Ansible 语言核心, section Ansible template]*，playbook `template_type.yml` 代码。解决方案是在执行\
  \ Ansible playbook 之前验证模板文件中使用的 `server.type` 变量的拼写。\n\n5. 当 Ansible 模板文件对两个不同的数据类型进行比较时，执行失败会返回\
  \ `AnsibleError: template error while templating string` 致命错误消息。我们可以通过 `type.txt.j2`\
  \ 文件中的以下行来重现问题：\n\n```yaml\n{% for key, value in servers.items() if value.type is\
  \ 'large' %}\n```\n\n完整的致命错误消息如下：\n\n任务执行过程中发生异常。要查看完整的回溯跟踪，请使用 -vvv。错误为：expected\
  \ token ‘name’，got ‘string’\n\n```\nfatal: [server01.example.com]: FAILED! => {\"\
  changed\": false, \"msg\": \"AnsibleError: template error while templating string:\
  \ expected token 'name', got 'string'. String: {% for key, value in servers.items()\
  \ if value.type is 'large' %}\\n{{ key }} is large\\n{% else %}\\n{{ key }} is {{\
  \ value.type }}.\\n{% endfor %}\\n. expected token 'name', got 'string'\"}\n```\n\
  \n供参考，请参阅*[第 2 章：Ansible 语言核心][*Ansible Template]* 部分，playbook `template_type.yml`\
  \ 代码。解决方案是在执行 Ansible playbook 之前验证切换变量之间的操作。\n\n# Ansible 命令 (#toc.xhtml_s256a)\n\
  \n当我们在 `command` 和 `shell` 模块之间使用了错误的模块时，会获得一个致命错误。Ansible 初学者会发现这很难进行排错。\n\n如果我们尝试使用\
  \ `command` 模块访问 shell 功能，将获得一个致命错误。有时，分析错误代码可能是具有挑战性的，因为没有明确的指示表明使用了了错误的 Ansible\
  \ 模块。具体的消息如下：\n\n```json\n\"stderr\": \"ls: cannot access '*': No such file or directory\"\
  , \"stderr_lines\": [\"ls: cannot access '*': No such file or directory\"], \"stdout\"\
  : \"\", \"stdout_lines\": []}\n```\n\n当使用 `command` 模块而不是 `shell` Ansible 模块时，我们会得到该错误。致命错误代码由以下\
  \ `command_wrong.yml` Ansible playbook 生成。正如我们所看到的，该代码与 `shell.yml` 文件相似，只是使用了 command\
  \ 模块。整个 `command_wrong.yml` 文件如下：\n\n```yaml\n---\n- name: wrong module demo\n \
  \ hosts: all\n  tasks:\n    - name: list file(s) and folder(s)\n      ansible.builtin.command:\
  \ 'ls -l *'\n      register: command_output\n    - name: command output\n      ansible.builtin.debug:\n\
  \        var: command_output.stdout_lines\n```\n\n我们可以使用 `ansible-playbook` 命令行来执行我们的代码：\n\
  \n```bash\nansible-playbook -i inventory command_wrong.yml\n```\n\n`command_wrong.yml`\
  \ Ansible playbook 产生：\n\n```\nTASK [list file(s) and folder(s)] *************************************************\n\
  fatal: [server01.example.com]: FAILED! => {\"changed\": false, \"msg\": \"ls: cannot\
  \ access '*': No such file or directory\"}\n\nPLAY RECAP *****************************************************\n\
  server01.example.com: ok=0  changed=0  unreachable=0  failed=1  skipped=0  ignored=0\n\
  ```\n\n`command` 模块的致命错误是标准，因为它的功能有限。\n\n# Ansible Role (#toc.xhtml_s257)\n\n当角色执行出现问题时，会出现\
  \ Ansible Role 错误。以下是排查该错误的步骤：\n\n1. **检查角色目录结构**：验证角色结构是否符合推荐结构。典型的 Ansible 角色包含\
  \ tasks 目录下的 `main.yml`、用于依赖的 `meta/main.yml` 文件以及 handlers、templates 和 files 等目录。\n\
  2. **验证角色语法**：使用 `ansible-playbook --syntax-check` 命令检查角色 YAML 文件的错误。如果有语法错误，请在运行\
  \ playbook 之前修复它们。\n3. **验证角色执行**：检查角色是否执行正确。确保角色包含在 playbook 中，并且角色名称和路径正确。\n4.\
  \ **检查缺失的依赖**：如果角色有依赖，请确保它们已安装。使用 `ansible-galaxy install` 命令从 Ansible Galaxy 安装。\n\
  5. **检查缺失的变量**：确保所有变量都已定义并正确设置。检查角色目录中的变量文件和模板。\n6. **验证文件权限**：验证角色尝试访问的所有文件的权限设置正确。错误的文件权限会阻止角色正常执行。\n\
  7. **调试执行**：使用 Ansible debug 模块打印变量值并排查角色执行。\n\n总来说，Ansible Role 错误可以通过检查角色目录结构、验证角色语法、确保角色执行正确、检查缺失的依赖和变量、验证文件权限以及使用\
  \ debug 模块进行调试来解决。\n\n\n\n\n\n所示错误非常常见，它仅仅向我们说明在 Ansible 列出的目录之后未找到 `role1`。解决方案是验证执行时是否处于正确的目录，或者在\
  \ `ansible.cfg` 文件中自定义角色路径。可以在 *第 8 章：Ansible 高级* 中的 *Ansible 配置设置* 部分了解有关 `ansible-galaxy`\
  \ 命令或 `ansible.cfg` 文件中 `roles_path` 参数的使用。\n\n## Molecule\n\nMolecule 工具提供了一种简单一致的方法来测试\
  \ Ansible 角色（roles）和集合（collections），确保在部署到生产环境之前正常工作。它在 Ansible 社区中广泛使用，并推荐任何开发和测试\
  \ Ansible 角色的人员使用。Ansible Role Molecule 是一个用于测试 Ansible 角色的工具。它通过模拟不同场景并在各种环境中测试角色，提供验证\
  \ Ansible 角色功能的方法。Molecule 结合 Docker 或 Vagrant 创建虚拟机，使用 Ansible 对虚拟机进行配置，并使用 Testinfra\
  \ 或 InSpec 等测试框架对虚拟机运行测试。通过 Molecule，开发者可以在不同的环境中测试他们的角色，并确保角色在每个环境中都能按预期工作。Molecule\
  \ 自动化了整个测试过程，从创建虚拟机到运行测试并生成测试报告。\n\nMolecule 测试过程分为几个阶段，包括：\n\n* `create:` 此阶段创建虚拟机，安装必要的软件，并根据正在测试的角色对其进行配置。\n\
  * `converge:` 此阶段将 Ansible 角色应用到虚拟机上并对其进行配置。\n* `verify:` 此阶段对虚拟机运行测试，以确保角色按预期工作。\n\
  * `destroy:` 此阶段移除虚拟机。\n\nMolecule 提供了一种简单且一致的方法来测试 Ansible 角色，确保它们在部署到生产环境之前正常工作。它在\
  \ Ansible 社区中广泛使用，并推荐任何开发和测试 Ansible 角色的人员使用。\n\n## Ansible Collection\n\nAnsible\
  \ Collections 是一种将 playbooks、角色、模块以及其他相关内容作为一个单元进行打包和分发的方法。我们可以使用 molecule 工具来测试\
  \ Ansible 集合。以下是我们可以采取的一些步骤来解决 Ansible 集合相关问题：\n\n检查 Ansible 版本：确保我们使用的 Ansible\
  \ 版本支持我们正在使用的集合。不同的集合需要不同最小版本的 Ansible。\n\n* **检查集合路径：** 验证集合已安装并位于正确的路径。我们可以通过运行以下命令检查集合路径：\n\
  \  ```\n  ansible-config dump | grep COLLECTIONS_PATHS\n  ```\n* **检查集合名称：** 验证在我们正在运行的\
  \ playbook 或命令中指定的集合名称正确。集合名称对大小写敏感，应以格式 `namespace.collection_name` 指定。\n* **检查集合依赖项：**\
  \ 如果我们使用的集合具有依赖项，请确保它们已安装。我们可以使用 `ansible-galaxy collection install` 命令安装依赖项。\n\
  * **检查模块路径：** 如果我们正在使用集合中的模块，请确保 Ansible 配置文件中正确了模块路径。我们可以通过在 `ansible.cfg` 文件中添加以下行来设置模块路径：\n\
  \  ```\n  module_utils = /path/to/collection/plugins/modules\n  ```\n* **检查文档：**\
  \ 查阅正在使用的集合的文档，查看是否有任何已知问题或针对该集合的故障排除步骤。\n* **调试 playbook：** 使用 `-vvv` 选项以详细模式运行\
  \ playbook 或命令，这可以帮助我们识别问题发生在何处。\n\n通过遵循这些步骤，我们可以排查并解决 Ansible 集合的问题。\n\n## 缺少集合\
  \ (Missing collection)\n\n当我们的 Ansible Controller 未安装 Ansible 集合时，我们会得到以下错误。请注意\
  \ `could't resolve module/action community.general.iso_create` 部分。这仅表示 Ansible 不知道如何处理我们的请求。缺少集合的错误如下：\n\
  \n```\nERROR! couldn't resolve module/action 'community.general.iso_create'.\n这通常表示拼写错误、缺少集合或模块路径不。\n\
  错误出现在 '/home/devops/collections/collection.yml': 第 5 行第 7 列，但可能根据具体的语法问题出现在文件的其他位置。\n\
  涉及的行似乎是：\ntasks:\n- name: Create an ISO file\n^ here \n```\n\n解决方案是使用 `ansible-galaxy`\
  \ 命令安装缺失的集合：\n\n```\nansible-galaxy install community.general\n```\n\n## 缺少 Python\
  \ 库 (Missing Python library)\n\n在运行 Ansible 时，如果未安装某个所需的 Python 库，我们可能会遇到 `missing\
  \ python library` 错误。Ansible 依赖许多 Python 库才能正常运行，如果其中一个库缺失或过时，我们可能会遇到错误。以下是我们在排查\
  \ Ansible 中 `missing python library` 错误可以采取的步骤：\n\n1. **识别缺失的库：** 错误消息应该指示哪个库缺失。在错误消息中查找库名称。\n\
  2. **安装缺失的库：** 使用我们系统的包管理器或 pip（Python 包管理器）安装缺失的库。包名可能根据我们的操作系统而异。例如，在 Ubuntu 上，我们可以通过运行\
  \ `apt install python3-<package_name>` 使用 apt 包管理器安装 Python 包，而在 CentOS 或 Red Hat\
  \ Enterprise Linux 上，我们可以使用 `yum install python3-<package_name>`。对于 PIP，我们可以使用 `pip\
  \ install <package_name>` 安装缺失的库。\n3. **检查库的版本：** 确保安装的库版本与我们正在使用的 Ansible 版本兼容。不同版本的\
  \ Ansible 需要不同版本的 Python 库，因此请查看 Ansible 文档支持哪些版本。\n4. **验证库的位置：** 检查库是否安装在正确的位置以及\
  \ Ansible 是否可以找到。我们可以使用 `pip show <package_name>` 命令验证已安装库的位置。\n5. **检查库的依赖项：**\
  \ 确保缺失的库没有同样缺失的依赖项。如果有依赖项，我们需要安装它们。\n\n通过遵循这些步骤，我们应该能够安装缺失的 Python 库并解决 Ansible\
  \ 中的 `missing python library` 错误。\n\n以下 Ansible playbook 使用需要 `pycdlib` Python 库的\
  \ `iso_create` 模块：\n\n```\nTASK [Create an ISO file] ******************************************************\n\
  执行任务期间发生了一个异常。使用 -vvv 查看完整的回溯。\n错误为：ModuleNotFoundError: No module named 'pycdlib'\n\
  fatal: [server01.example.com]: FAILED! => {\"changed\": false,\n\"msg\": \"Failed\
  \ to import the required Python library (pycdlib) on Python /usr/bin/python3\\.\
  \ 请阅读模块文档并将其安装在适当的位置。\n如果所需的库已安装但 Ansible 使用了错误的 Python 解释器，请查阅有关 ansible_python_interpreter\
  \ 的文档\"}\n```\n\n\n\n\n\n例如，`iso_create` 模块需要 `pycdlib` Python 库。该要求在 Ansible Galaxy\
  \ 网站上的集合文档中有说明。我们可以使用系统中的 Python 包管理器 `PIP` 进行安装。\n\n首先，让我们使用以下命令将 `PIP` 工具升级到最新版本：\n\
  \n```bash\npip install --upgrade pip\n```\n\n升级 `PIP` 后，我们可以使用以下命令安装 `pycdlib` Python\
  \ 库：\n\n```bash\npip install pycdlib\n```\n\n`PIP` 工具会产生以下输出：\n\n```\nCollecting\
  \ pycdlib\nUsing cached pycdlib-1.13.0-py2.py3-none-any.whl (211 kB)\nInstalling\
  \ collected packages: pycdlib\nSuccessfully installed pycdlib-1.13.0\n```\n\n当 Python\
  \ 库已经安装时，我们将获得以下消息：\n\n```\nRequirement already satisfied:\npycdlib in /usr/local/lib/python3.8/dist-packages\
  \ (1.13.0)\n```\n\n# Linux 上的 Ansible\n\n`sshpass` 是一个实用工具，允许我们在非交互式执行执行 `ssh` 命令时传递密码。它被用于自动化\
  \ SSH 连接中的密码身份验证。`sshpass` 可以通过标准输入 (stdin) 流将密码传递给 `ssh` 命令。\n\n当我们在 Ansible 中使用\
  \ SSH 连接类型时，可能需要为 SSH 连接提供密码。Ansible 提供了几种传递密码的方法，例如使用 SSH 密钥或在清单文件中指定密码。然而，如果我们想直接将密码传递给\
  \ `ssh` 命令，我们需要使用 `sshpass`。此外，`sshpass` 还可以用于自动化其他需要密码的身份验证机制，例如 `pkcs11_provider`。\n\
  \n![](img/Figure-6.10.jpg)\n\n**图 6.10：** 密码 SSH 连接错误\n\n在使用带有 Linux SSH 密码认证的 Ansible\
  \ 清单时，如果遇到 `to use the 'ssh' connection type with passwords or pkcs11_provider,\
  \ you must install the sshpass program` 错误，可以像图 6.10 所示进行故障排除。\n\n如果在在使用 Ansible\
  \ 时遇到 `to use the ssh connection type with passwords or pkcs11_provider, we must\
  \ install the sshpass program` 错误，这里是我们可以遵循的故障排除步骤：\n\n**步骤 1：检查远程系统上是否安装了 `sshpass`。**\n\
  \n第一步是检查远程系统上是否安装了 `sshpass`。我们可以通过登录到远程主机并运行以下命令来实现：\n\n```bash\nsshpass -V\n```\n\
  \n如果未找到命令，说明没有安装 `sshpass`。在这种情况下，我们需要安装它。\n\n**步骤 2：在远程系统上安装 `sshpass`。**\n\n下一步是在远程系统上安装\
  \ `sshpass`。根据我们的操作系统，可以使用适当的包管理器进行安装。例如，如果我们正在使用 Ubuntu 或 Debian，可以通过运行以下命令进行安装：\n\
  \n```bash\napt-get install sshpass\n```\n\n如果我们正在使用不同的 Linux 发行版，可以使用相应的包管理器来安装\
  \ `sshpass`。\n\n**步骤 3：在 Ansible 中指定 `sshpass` 的路径。**\n\n一旦安装了 `sshpass`，我们需要在 Ansible\
  \ 清单文件或配置文件中指定 `sshpass` 可执行文件的路径。例如，在我们的清单文件中，我们可以指定 `ansible_ssh_pass` 变量来为 SSH\
  \ 连接提供密码。如果我们把 ‘sshpass’ 安装在非标准位置，可以使用 `ansible_ssh_executable` 变量指定可执行文件的路径：\n\n\
  ```ini\n[servers]\ndemo.example.com ansible_ssh_user=myuser ansible_ssh_pass=mypassword\
  \ ansible_ssh_executable=/usr/local/bin/sshpass\n```\n\n# Windows 上的 Ansible\n\n\
  为 Windows 配置 Ansible 可能会有点复杂，用户在过程中可能会遇到错误。在本节，我们将讨论用户在排查 Windows 版 Ansible 时可能面临的一些常见问题，并提供如何解决它们的提示。\n\
  \n## 问题：无法在 Windows 上安装 Ansible\n\n用户在 Windows 上安装 Ansible 时遇到的最常见问题之一是安装错误。错误信息可能会提示缺少包或模块。\n\
  \n## 解决方案：安装所需的模块\n\n要解决此问题，用户应该检查 Windows 上 Ansible 的要求。Ansible 要求在 Windows 主机上安装\
  \ Python、Git 和 PowerShell。用户应在尝试安装 Ansible 之前，确保系统上已安装了这些包和模块。\n\n## 问题：无法连接到 Windows\
  \ 主机\n\n用户在 Windows 上使用 Ansible 时可能会遇到的另一个问题是无法连接到 Windows 主机。此错误可能由多个因素引起，包括网络连接性、配置问题和身份验证问题。\n\
  \n## 解决方案：检查配置和身份验证设置\n\n要解决此问题，用户应该检查他们的 Ansible 配置设置，并确保 Windows 主机配置为接受传入连接。用户还应该检查身份验证设置，确保使用正确的用户名和密码对\
  \ Windows 主机进行身份验证。\n\n## 问题：PowerShell 执行策略阻止执行\n\n用户在 Windows 上运行 Ansible 时可能会遇到的另一个问题是\
  \ PowerShell 执行策略阻止了 Ansible 脚本的执行。\n\n## 解决方案：更改执行策略\n\n要解决此问题，用户需要更改 PowerShell\
  \ 执行策略以允许执行 Ansible 脚本。用户可以通过在 PowerShell 中运行以下命令来更改执行策略：\n\n```powershell\nSet-ExecutionPolicy\
  \ Unrestricted\n```\n\n## 问题：Windows 主机未启用 SSH\n\n如果用户尝试在 Ansible 中使用 SSH 连接类型，可能会遇到指示\
  \ Windows 主机上未启用 SSH 的错误。\n\n## 解决方案：在 Windows 主机上启用 SSH\n\n要解决此问题，用户应该在 Windows\
  \ 主机上启用 SSH。这可以通过在 Windows 主机上安装 OpenSSH Server 功能来实现。用户可以在 PowerShell 中运行以下命令来安装\
  \ OpenSSH Server 功能：\n\n```powershell\nAdd-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0\n\
  ```\n\n为 Windows 配置 Ansible 可能有点复杂，但通过一些故障排除，用户可以解决大多数问题。解决问题的关键在于检查配置和身份验证设置，确保安装了所需的包和模块，并在必要时更改\
  \ PowerShell 执行策略。有了这些提示，用户应该能够成功在 Windows 上使用 Ansible。\n\n# Ansible facts\n\n在\
  \ Windows 上使用 Ansible 时，我们可能会遇到收集 Windows 主机事实（facts）方面的问题。以下是我们在 Windows 中排查 Ansible\
  \ facts 的步骤：\n\n1. **检查 Ansible 版本：** 确保我们使用的是支持 Windows 主机事实收集的 Ansible 版本。Ansible\
  \ 2.8 或更高版本支持对 Windows 主机的事实收集。\n2. **检查 WinRM 配置：** 确保目标 Windows 主机上的 Windows 管理\
  \ (WinRM) 服务正在运行，并且它配置为允许来自 Ansible 控制节点的连接。我们可能需要添加防火墙异常或配置 WinRM 使用 HTTPS 代替 HTTP。\n\
  3. **检查 Ansible 配置：** 验证目标 Windows 主机的 Ansible 配置文件中是否正确设置了 `ansible_user` 和 `ansible_password`\
  \ 变量。这些变量应该指定 Ansible 用于对 Windows 主机进行身份验证的凭据。\n4. **检查 Python 版本：** 验证目标 Windows\
  \ 主机上已安装 Python 并且是一个受支持的版本。为了让事实收集工作，Ansible 需要目标 Windows 主机上安装 Python 2.7 或更高版本。\n\
  \n\n\n\n\n5. **检查事实缓存：** 如果我们在 Ansible 中使用了事实缓存，请确保缓存没有过时或损坏。尝试禁用事实缓存以查看是否能解决该问题。更多细节请参阅\
  \ 第 8 章：Ansible 高级 中的 Ansible 配置设置章节。\n\n6. **检查事实收集模块：** Ansible 使用模块来收集有关 Windows\
  \ 主机的事实（facts）。验证目标 Windows 主机上已安装 `setup` 模块，并且该模块没有被任何组变量或主机变量禁用。\n\n7. **验证事实收集过程：**\
  \ 运行 `ansible -m setup <hostname>` 命令来为特定的 Windows 主机手动运行事实收集过程。该命令应该输出一个 JSON 文档，包含\
  \ Ansible 针对目标 Windows 主机收集的所有事实。\n\n通过遵循这些步骤，我们可以通过收集 Ansible 中 Windows 主机的事实来排查并解决问题。有时，当在\
  \ Windows 目标主机上的执行在“收集事实（Gathering Facts）”任务上终止时，我们可能仍然遇到获取 Ansible 事实的问题。我们可能需要禁用事实收集，因为它们在\
  \ Windows 目标主机上不支持 `(gather_facts: false)`。\n\n# 模块失败](#toc.xhtml_s265a)\n\n当我们在\
  \ Windows Ansible 中遇到模块失败（Module Failure）错误时，可能会令人沮丧。以下是一些帮助我们排查和解决问题的步骤：\n\n1.\
  \ **验证模块：** 确保我们尝试使用的模块支持 Windows。某些在 Linux 上工作的模块可能在 Windows 上不支持，或者可能需要额外的配置。\n\
  \n2. **检查模块版本：** 验证我们使用的是正确的模块版本。Ansible 模块更新频繁，使用过时的模块版本会导致错误。\n\n3. **检查模块路径：**\
  \ 确保模块路径设置正确。模块路径可以在 Ansible 配置文件中设置，如果设置不正确，Ansible 可能无法找到模块。\n\n4. **检查远程机器配置：**\
  \ 验证远程机器配置是否正确。Windows 需要额外的配置来通过 Ansible 启用远程管理，例如启用 PowerShell 远程登录和配置 WinRM。\n\
  \n5. **检查模块参数：** 验证模块参数设置是否正确。错误或缺失参数可能导致模块失败。\n\n6. **检查依赖项：** 某些模块要求在远程机器上安装额外的软件或依赖项。确保已安装所有所需的依赖项。\n\
  \n7. **检查错误消息：** 错误消息可能提供有关失败原因有用信息。仔细阅读错误消息并尝试理解导致失败的原因。\n\n8. **调试模块：** 使用 Ansible\
  \ debug 模块来排查模块失败。在 playbook 中添加 debug 模块并使用它来打印变量值和调试信息。\n\n总来说，排查 Windows Ansible\
  \ 中的模块失败需要对模块、其依赖项和远程机器配置进行仔细检查。通过遵循上述步骤并使用 debug 模块对模块进行调试，我们应该识别并解决问题。\n\n# Windows\
  \ 版 Linux 子系统](#toc.xhtml_s266a\n\n当通过 Windows 版 Linux 子系统 (WSL) 在 Windows 上运行 Ansible\
  \ 时，可能会遇到错误 0x80370102。当 Windows 版 Linux 子系统未安装、未启用或目标不支持嵌套虚拟化时，就会发生此错误。虚拟化技术能够加速\
  \ Linux 操作系统的虚拟化，特别是当使用 Windows 版 Linux 子系统版本 2 时。\n\n要排除此错误，请遵循以下步骤：\n\n1. **确保已安装\
  \ WSL：** 验证我们的 Windows 机器上已安装 WSL。如果尚未安装，我们可以从 Windows 功能控制面板进行安装。\n\n2. **启用 WSL：**\
  \ 验证我们的 Windows 机器上已启用 WSL。要启用 WSL，请以管理员身份打开 PowerShell 并运行以下命令：\n\n```\ndism.exe\
  \ /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart\n\
  ```\n\n执行完成后，我们的 Windows 目标机器上安装了以下功能：Windows 版 Linux 子系统、Hyper-V 平台和 Hyper-V 虚拟机。如果最新版本的\
  \ Windows 版 Linux 子系统无法工作，我们可以始终使用以下命令降级到版本 1：\n\n```\nwsl --set-default-version\
  \ 1\n```\n\nWindows 版 Linux 子系统速度慢一点，因为它没有使用嵌套虚拟化功能，但在大多数环境中都可以运行。\n\n**安装 Linux\
  \ 发行版：** 启用 WSL 后，我们需要安装 Linux 发行版。我们可以从 Microsoft Store 安装 发行版，或通过下载发行包并在机器上运行。\n\
  \n3. **设置默认 WSL 发行版：** 如果我们安装了多个 Linux 发行版，我们需要设置默认发行版。默认是 Ubuntu Linux 发行版。要执行此操作，打开\
  \ PowerShell 并运行以下命令：\n\n```\nwslconfig /setdefault <distribution name>\n```\n\n\
  **验证 Ansible 配置：** 确保我们的 Ansible 配置已设置好使用 WSL。检查 `ansible.cfg` 文件并确保 `ansible_connection`\
  \ 变量被设置为 wsl。请参阅 第 8 章：Ansible 高级 中的 Ansible 配置设置章节了解更多关于 `ansible_connection` 参数的用法。\n\
  \n4. **测试 Ansible 配置：** 通过对目标 Windows 主机运行简单的 playbook 来测试我们的 Ansible 配置。如果 playbook\
  \ 成功运行，说明我们已经解决了 WSL 错误。\n\n通过遵循这些步骤，我们可以在 Windows 上运行 Ansible ，排查并解决 WSL 错误。\n\n\
  # Ansible Windows 命令](#toc.xhtml_s267a\n\n可能会出现我们使用了 `win_command` Ansible 模块而不是\
  \ `win_shell` Ansible 模块的情况。这两个模块都允许我们在 Ansible 目标上执行命令，但它们并不像 第 5 章：Ansible For\
  \ Windows 中“执行命令”章节中学到的那样相似。\n\n`win_command` Ansible 模块不执行多行 PowerShell 代码。以下示例使用\
  \ `hostname` 和 `Get-Date` PowerShell 命令在屏幕上打印主机名和当前日期。以下 `win_date_command.yml`\
  \ playbook：\n\n```yaml\n---\n- name: Execute command\n  hosts: all\n  tasks:\n \
  \   - name: Check getdate\n      ansible.windows.win_command: |\n        hostname\n\
  \        Get-Date\n      register: command_output\n    - name: Command output\n\
  \      ansible.builtin.debug:\n        var: command_output.stdout_lines\n```\n\n\
  我们可以使用以下 `ansible-playbook` 命令执行 `win_date_command.yml`：\n\n```\nansible-playbook\
  \ win_date_command.yml\n```\n\n执行没有返回错误，但实际上只执行了命令的一部分：\n\n```\nPLAY [win_command\
  \ module demo] ********************************************************************\n\
  TASK [Gathering Facts] ***********************************************************************ok:\
  \ [WindowsServer]\nTASK [check getdate] ***********************************************************************\n\
  changed: [WindowsServer]\nTASK [command output] ***********************************************************************ok:\
  \ [WindowsServer] => {\n  \"command_output.stdout_lines\": [\n    \"demo\"\n  ]\n\
  }\nPLAY RECAP ***********************************************************************\n\
  WindowsServer               : ok=3    changed=1    unreachable=0    failed=0   \
  \ skipped=0    rescued=0   ignored=0\n```\n\n要在多行中执行所有命令，我们需要从 \"win_command\" 切换到\
  \ \"win_shell\" Ansible 模块。\n\n# 结论](#toc.xhtml_s268a)\n\n\n\n\n\n正如我们在本章中学到的，通过在代码编写过程中更加小心，并使用某些程序来简化语法检查和测试，我们可以避免大多数错误。通过使用准确的测试策略，我们可以避免生产环境中的问题，并实现基础设施即代码（IaC）。在下一章中，我们将学习\
  \ Ansible 自动化平台、Morpheus、配置管理的使用、图形用户界面以及基于角色的访问控制（RBAC）。\n\n# 记忆要点\n\n* 我们可以执行语法检查、`yamlint`\
  \ 和 `ansible-lint` 来静态验证项目中代码的正确性。\n* 我们可以使用 `ansible-playbook` 命令的 `check` 和 `verbosity`\
  \ 选项来执行干运行，或在执行期间增加屏幕上显示的信息量。\n* 我们可以使用 `molecule` 工具在向组织内外共享代码之前测试 Ansible 角色的执行情况。\n\
  * 拥有健壮的测试环境和策略可以节省在生产环境中排错边界情况和意外场景的时间。\n\n# 单选题\n\n1. 详细输出模式（Verbose mode）的最大限制是多少？\n\
  \    1. `-v`\n    2. `-vv`\n    3. `-vvv`\n    4. `-vvvv`\n2. 我们如何执行干运行（dry run）执行？\n\
  \    1. 使用 `-v` 参数\n    2. 使用 `--dry-run` 参数\n    3. 使用 `--check` 参数\n    4. 不可能\n\
  3. 我们可以使用哪些工具来验证我们的 Ansible playbooks？\n    1. `ansible playbook --syntax-check`,\
  \ `yamlint` 和 `ansible-lint`\n    2. `molecule`\n    3. `yamlint` 和 `ansible-lint`\n\
  \    4. CI/CD 流水线\n4. molecule 测试的核心组件有哪些？\n    1. `create` 阶段创建虚拟机，安装必要的软件，并根据正在测试的角色进行配置。\n\
  \    2. `converge` playbook 应用于该角色，而 `verify` playbook 检查行为是否正确。\n    3. `destroy`\
  \ 阶段销毁测试期间使用的虚拟机。\n    4. 以上答案均不是。\n\n# 答案\n\n1. D\n2. C\n3. A\n4. B\n\n# 思考\n\n\
  1. 测试 Ansible Playbook 的最佳策略是什么？\n2. 如何测试 Ansible Playbook 的幂等性属性？\n3. 如何正确测试和排错\
  \ Ansible Role？\n4. 哪些软件可以帮助我们创建 Ansible 代码？\n\n# 关键术语\n\n* `syntax-check: ansible-playbook\
  \ --syntax-check` 是一个用于在不运行的情况下检查 Ansible playbooks 语法的命令。\n* `Yamlint:`: `Yamlint`\
  \ 是一个命令行工具，用于分析 YAML 文件并检查语法错误、风格一致性和其他问题。\n* `ansible-lint:`: `ansible-lint` 是一个用于分析\
  \ Ansible 代码以检测并报告潜在问题和错误的工具。\n* `molecule:`: `molecule` 是一个帮助在多个环境中开发和测试 Ansible\
  \ 角色和集合的工具。\n* `VSCode` (Visual Studio Code) 是微软的一款免费源代码编辑器，高度可定制，并支持各种编程语言和框架。\n\
  \n# 第 7 章：Ansible 企业\n\n## 引言\n\n在本章中，我们将学习更多关于 Ansible 的企业级和图形用户界面。这包括学习如何在组织内部使用\
  \ Ansible、将其与其他工具集成、使用 LDAP 和 Active Directory 认证服务，以及实施安全最佳实践。企业级 Ansible 设计用于更复杂的架构和环境，例如分布式系统和微服务。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n* Ansible 用例\n* GitOps\n* Ansible 自动化平台\n* Morpheus\n\
  * 配置管理 (CM)\n* 图形用户界面\n\n## Ansible 用例\n\n高级和企业用户需要负责维护组织任务关键的系统。在 IT 中，Day 0、Day\
  \ 1 和 Day 2 术语指的是软件生命周期中的不同阶段，如图 7.1 所示。\n\n我们使用该模型处理任何软件应用程序的生命周期。Ansible 对 Day\
  \ 1 和 Day 2 操作非常有益：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1：** Day 0、Day 1、Day 2 模型\n\
  \n在当今快速演变的软件格局中，Day 0、Day 1 和 Day 2 术语作为软件开发生命周期的阶段而变得重要。这些阶段在有效的软件开发和维护的背景下具有巨大意义。让我们深入研究以下阶段，以理解每一天的含义，并探索云计算如何改变传统的软件开发和维护流程。\n\
  \n### Day 0：设计阶段\n\nDay 0 代表软件开发生命周期的设计阶段。它类似于培训的第一天，新兵进入了军事的形成阶段。在软件开发中，Day 0 包含了规划和设计过程，其中指定了项目需求并确定了解决方案架构。这一阶段涉及对系统基础设施、资源分配和里程碑设置的仔细规划。测试和质量保证也是\
  \ Day 0 的不可或组成部分，为后续阶段奠定坚实的基础。\n\n### Day 1：开发与部署\n\nDay 1 表示软件生命周期的开发和部署阶段。它使最初的设计变为现实，涉及创建本身以及必要的设施、网络和外部服务。在云时代，Day\
  \ 1 的特点是采用敏捷软件开发方法，设计和开发阶段无缝集成。持续集成/持续交付 (CI/CD) 实践对于确保 Day 1 的顺畅高效至关重要。重点在于采用最佳实践（例如云原生应用方法），并利用云原生工具和如\
  \ Kubernetes 等容器编排系统。Ansible 可以简化部署过程并与部署流水线集成。\n\n### Day 2：维护与优化\n\nDay 2 标志着维护和优化阶段，从软件上线和客户开始使用时开始。这一阶段涉及监控系统、收集反馈并根据客户需求实施必要的改进。目标是建立一个反馈循环，持续分析系统行为，识别改进领域并实施更改以增强性能和用户体验。自动化和监控工具在\
  \ Day 2 期间至关重要，确保高效维护和及时解决问题。应用程序性能监控 (APM) 解决方案、客户支持的工单系统以及如 Ansible 或 Kubernetes\
  \ 等自动化工具有助于在整个生命周期内管理和优化软件。Ansible 甚至可以使用事件驱动架构处理实时事件（参见*事件驱动 Ansible 章节*）。\n\n\
  云计算对软件生命周期的影响\n\n\n\n\n\n云计算的出现彻底改变了软件开发生命周期。传统的 Day 0、Day 1 和 Day 2 阶段之间的分离已让位于更加集成、更敏捷的方法。基于云的开发和部署已成为组织的首要任务，使其能够利用扩展性、灵活性和成本效益的优势。云计算允许对变化的需求做出动态响应，通过\
  \ CI/CD 实践进行持续改进，并消除开发团队与运维团队之间的交接。DevOps 中的“左移”（shift-left）方法将传统上留到最后阶段的任务提前执行，重塑了\
  \ Day 1 和 Day 2 的边界，导致了阶段的重叠和持续优化。\n\nDay 0、Day 1 和 Day 2 的概念为理解软件开发生命周期的各个阶段提供了框架。这些阶段在得到有效管理时，有助于软件项目的成功。云计算在转型传统的软件开发和维护过程中发挥了关键作用，实现了无缝集成、持续改进和高效的自动化。拥抱\
  \ Day 0、Day 1 和 Day 2 的原则以及云原生实践，使组织能够在不断演变的数字格局中交付高质量的软件产品和服务，同时对客户需求保持敏锐。Ansible\
  \ 在这些每个阶段都变得更加重要，因为它简化了自动化旅程并创建了标准。\n\n# GitOps\n\n在仓库中组织我们的源代码非常方便，通常基于流行的 `Git`\
  \ 版本控制系统。仓库成为所有团队操作的唯一事实来源源。GitOps 源于站点可靠性工程（SRE）、DevOps 文化、基础设施即代码（IaC）和配置即代码（CaC）模式，这些模式使我们能够将基础设施配置存储在仓库中，通常由\
  \ `Git` 技术管理。下[表 7.1] 展示了基于 `Ansible` 最佳实践的目录布局：\n\n| 文件 | 描述 |\n| :--- | :--- |\n\
  | `site.yml` | 主 playbook |\n| `webservers.yml` | 用于 Web 服务器清单组的 playbook |\n| `production`\
  \ | 生产环境的清单文件 |\n| `staging` | 测试环境的清单文件 |\n| `group_vars/` | 组变量（参见[第 2 章：Ansible\
  \ 清单]） |\n| `host_vars/` | 主机变量（参见[第 2 章：Ansible 清单]） |\n| `library/` | （可选）自定义库和模块\
  \ |\n| `module_utils/` | （可选）支持模块的自定义 module_utils |\n| `filter_plugins/` | （可选）自定义过滤器\
  \ |\n| `roles/` | （可选）自定义角色 |\n\n**表 7.1：** GitOps 目录布局\n\n在 `Git` 仓库中组织源代码和基础设施配置时，遵循最佳实践至关重要。`Ansible`\
  \ 为构建我们的目录布局提供了指南。虽然具体的布局可能会根据项目需求而异，但以下目录结构是 `Ansible` 最佳实践常用的推荐结构：\n\n```\n├──\
  \ group_vars\n│   ├── all.yml\n│   └── group1.yml\n├── host_vars\n│   └── hostname.yml\n\
  ├── inventory\n├── site.yml\n└── roles\n├── role1\n│   ├── tasks\n│   ├── handlers\n\
  │   ├── templates\n│   ├── files\n│   ├── vars\n│   └── defaults\n└── role2\n├──\
  \ tasks\n├── handlers\n├── templates\n├── files\n├── vars\n└── defaults\n```\n在此目录布局中，`group_vars`\
  \ 目录包含特定于不同组的变量，而 `host_vars` 目录存储特定于单个主机的变量。清单文件代表主机或组的清单。`site.yml` 文件作为执行 `Ansible`\
  \ 任务的入口。它是第一个执行的 `Ansible` playbook。\n\n`roles` 目录包含可重用的 `Ansible` 角色，封装了任务、处理器、模板、文件、变量和默认值。每个角色都组织成对应这些不同组件的子目录。遵循这种目录结构有助于维护整洁的代码库，使更容易理解和管理我们的\
  \ Ansible playbook 和角色。利用 `Git` 管理源代码和基础设施配置非常有益。GitOps 进一步扩展了这一实践，将 `Git` 仓库视为基础设施配置的单一事实来源。在使用\
  \ `Ansible` 时，遵循目录布局的最佳实践可确保我们自动化工作流的一性和可维护性。\n\n# Ansible Automation Platform\n\
  \n企业需要的不仅仅是自动化，还需要大规模的协调和编排。如果在企业中工作，我们需要不同的业务线通过不同的技能组合共同工作，并拥有一个直观的接口来协调可用资源。Red\
  \ Hat 创建了协作性的 `Ansible Automation Platform` 作为解决方案，专注于安全性、可移植性和可靠性：\n\n![](img/Figure-7.2.jpg)\n\
  \n**图 7.2：** Ansible Automation Controller 的登录界面\n\n它结合了 `Ansible` 开源的最佳价值：简单、强大且无代理，独特的认证技术，并带有良好的\
  \ Web 用户界面和强大的 RESTful API 接口。缩短了基于自动化的解决方案交付时间。根据国际 IT 分析师的说法，`Ansible` 是基础设施自动化的领导者。它能够解决第一天问题（准备和部署软件）和第二天自动化问题（配置、滚动更新、维护、监控和优化系统）。\n\
  \n`Ansible Automation Platform` (AAP) 是 Red Hat（IBM IBM）针对 `Ansible` 企业用户的高级产品。\n\
  \n以下是在我们的组织中采用 `Ansible Automation Platform` 的显著优势：\n\n*   **简化复杂任务：** 使用 `Ansible\
  \ Automation Platform` 的主要优势之一是简化复杂任务的能力。通过该平台，我们可以通过单一接口跨多个系统自动化任务。这意味着我们可以轻松地自动化复杂任务，例如配置网络设备或部署应用程序。这减少了手动执行这些任务所需的时间和精力，释放了团队的时间专注于更具战略性的倡措。\n\
  *   **可扩展性：** 使用 `Ansible Automation Platform` 的另一个显著优势是其可扩展性。该平台可以管理和自动化数千台机器上的任务，是大型\
  \ IT 基础设施的理想选择。随着我们基础设施的增长，`Ansible Automation Platform` 可以随之增长，确保我们的自动化工作流保持高效有效。\n\
  *   **效率：** 自动的核心在于提高效率，`Ansible Automation Platform` 正是为此设计的。通过简化工作流和减少人工干预，该平台可以帮助我们在\
  \ IT 运营中实现更高的效率。我们可以自动化常规任务，例如软件更新或系统配置，释放团队时间来处理更有价值的任务。\n*   **安全性：** `Ansible\
  \ Automation Platform` 在设计时考虑了安全性。它提供了一种安全的方法来跨不同系统和环境执行自动化任务，确保符合安全策略和最佳实践。通过 `Ansible\
  \ Automation Platform`，我们可以在自动化任务的同时维护 IT 系统的完整性和机密性。\n\n\n\n\n\n- **集成：** 该平台与广泛的工具和技术集成，使其能够轻松实现跨整个基础设施的任务自动化。这意味着我们可以使用\
  \ `Ansible Automation Platform` 来管理和自动化整个 IT 生态系统中的任务，包括云平台、虚拟化平台和容器平台。\n- **定制化：**\
  \ `Ansible Automation Platform` 的巨大优势之一是其灵活性。该平台高度可定制，允许我们创建适应特定需求的自定义工作流、模块和剧本（playbooks）。我们可以对平台进行定制以满足\
  \ IT 基础设施的独特需求，确保我们的自动化工作流能够发挥最大效益。\n- **协作：** `Ansible Automation Platform` 支持团队之间的协作，允许多个用户同时处理相同的任务和工作流。这意味着我们可以在团队内部共享知识和专业经验，提高自动化工作流的质量和效率。\n\
  - **可视化：** `Ansible Automation Platform` 提供了自动化任务的可视性，使能够跟踪进度、监控性能并实时排除故障。这种可见性让我们对自动化工作流有完整的了解，允许我们对如何改进\
  \ IT 运营做出明智决策：\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：** Ansible Automation Controller\
  \ 的仪表盘\n\n`Ansible Automation Platform` 是一个可以转变我们 IT 基础设施的强大工具。该平台通过简化复杂任务、提高扩展性和增加效率，帮助我们在\
  \ IT 运营中实现更大的敏性和响应能力。凭借其安全特性、集成能力、定制选项、协作支持和可见性，`Ansible Automation Platform` 是任何寻求简化和自动化其\
  \ IT 工作流组织的完美工具。`Ansible Automation Platform` 需要 `Red Hat` 的订阅。`Ansible Automation\
  \ Platform` 利用 `GitOps` 项目组织来满足我们团队的自动化需求。\n\n`Ansible Automation Platform` 的典型用例包括混合云自动化、边缘自动化、网络自动化、安全自动化、基础设施自动化、置备、配置管理、应用程序部署、持续交付和编排。\n\
  \n`Red Hat Ansible Automation Platform` 的最新版本包含项目签名功能，允许用户签名并验证基于项目内容的安全性，确保依赖 `ansible-sign`\
  \ 命令行工具和 `GnuPG` 非对称密钥（私钥和公钥）的自动化工作流、剧本和清单的完整性和真实性。\n\n`Ansible Automation Platform`\
  \ 由许多软件组成。`Ansible Automation Platform` 的最新版本包含以下产品：\n\n- `Automation controller`\
  \ (曾称为 `Ansible Tower`)\n- `Automation hub` 私有和托管服务\n- `Automation services catalog`\n\
  - 作为托管服务的 `Insights for Ansible Automation Platform`\n\n### 节点要求\n\n任何 `Ansible\
  \ Automation Platform` 节点（控制器、数据库、执行节点和跳板节点）的系统要求如下：\n\n- 16 GB+ 内存\n- 4+ CPU\n\
  - 数据库节点需要 150 GB+ 磁盘空间，非数据库节点需要 40 GB+ 磁盘空间\n- `DHCP` 预留使用无限租期以静态 IP 地址部署集群\n- 所有节点的\
  \ `DNS` 记录\n- 操作系统 `Red Hat Enterprise Linux 8` 或更高版本的 64 位 (x86)，并安装 `Python 3.8+`\n\
  - 所有节点均配置 `NTP` 服务 `Chrony`\n\n# Ansible Automation Hub\n\n`Ansible Automation Hub`\
  \ 是由 `Red Hat` 提供的平台，为 `Ansible Content Collections` 提供精选且可靠的存储库。它通过提供来自 `Red Hat`\
  \ 和经过认证的 `Red Hat` 合作伙伴的预构建认证模块、插件、角色和文档，简化了发现和下载 `Ansible` 内容的过程。它是 `Ansible Galaxy`\
  \ 最强大的版本。我们可以选择从 `Automation Hub` 获取内容，或将其与 `Ansible Galaxy` 混合使用。以下是使用 `Ansible\
  \ Automation Hub` 的优势：\n\n- **Red Hat 认证内容：** `Ansible Automation Hub` 直接访问来自 `Red\
  \ Hat` 和认证 `Red Hat` 合作伙伴的可靠 `Content Collections`。这些集合涵盖了广泛的主题和合作伙伴，确保内容经过 `Red\
  \ Hat` 的审核和认证。\n- **复用代码并快速上手：** `Automation Hub` 中的 `Ansible` 集合为特定领域和 IT 平台提供了捆绑模块和角色。这允许我们通过预构建内容快速运行。\n\
  - **Ansible 私有自动化枢：** 如果我们创建了自己的 `Ansible` 内容，它允许我们在组织内部（防火墙后或离线系统）进行发布和协作。这提供了一个中心化的事实来源，并允许轻松管理和控制\
  \ `Ansible` 内容的生命周期。\n- **高级支持：** `Ansible Automation Hub` 由 `Red Hat` 创建和管理，并提供标准和高级支持选项。如果我们在使用官方\
  \ `Red Hat Ansible` 集合或合作伙伴集合时遇到任何问题，`Red Hat` 的支持团队将直接协助我们。对于 `Ansible Automation\
  \ Hub` 中的其他项目，`Red Hat` 将引导我们获取的支持。\n- **包含在 Red Hat 订阅中：** `Ansible Automation\
  \ Hub` 是 `Red Hat` 订阅的一部分。如果我们是 `Red Hat` 订阅用户，就可以免费无限制地访问 `Automation Hub` 中提供的任何内容。\n\
  \n通过利用 `Ans Automation Hub`，用户可以从认证内容、通过代码复用的快速开发、私有枢纽能力、高级支持选项以及 `Red Hat` 订阅包含的\
  \ `Automation Hub` 中获益。自 2022 年以来，`Ansible Automation Hub` 已支持数字签名集合，建立了从 `Red Hat\
  \ Ansible` 和 `Certified Partners` 的创建者到执行节点的整个信任链。\n\n# Ansible 执行环境\n\n`Ansible\
  \ execution environments` (`EE`) 是容器化环境，旨在为执行 `Ansible` 自动化任务提供一致且可移植的运行时。它们封装了运行\
  \ `Ansible` 剧本所需的所有组件、依赖和配置。\n\n执行环境通常包含以下组件：\n\n- **基础容器镜像：** 基础容器镜像构成了执行环境的基础。它包含了运行\
  \ `Ansible` 的操作系统和其他基本组件。\n- **Ansible Core：** `Ansible Core` 是执行环境的核心组件。它提供了 `Ansible`\
  \ 引擎，用于解释并执行 `Ansible` 剧本。\n- **Ansible Runner：** `Ansible Runner` 是 `Ansible` 用于以更有结构化的方式执行剧本的工具。它有助于作业控制、并行执行和结果跟踪等功能。\n\
  - **Python：** `Ansible` 用 `Python` 编写，因此执行环境包含了必要的 `Python` 运行时环境。它确保 `Ansible`\
  \ 可以利用 `Python` 模块和库。\n- **Ansible Collections：** `Ansible Collections` 是预包的 Ansible\
  \ 内容单元，提供了额外的模块、插件和角色。执行环境可能包含自动化任务所需的特定集合。\n- **所需的 Python 库：** 执行环境可能包含执行剧本或模块所需的特定\
  \ `Python` 库。这些库可以作为执行环境的一部分进行安装，以确保在剧本执行期间可用。\n\n\n\n\n\nAnsible 执行环境（execution\
  \ environments）的目的是为 Ansible 自动化提供一个一致且隔离的运行环境。通过将所有必要的组件封装到容器镜像中，执行环境确保了自动化任务可以在不同的系统和环境中可靠地执行。它们有助于保持一致的行为并消除潜在的兼容性问题。\n\
  \n执行环境还实现了可移植性，因为容器化的格式允许执行环境在不同的系统和基础设施之间于共享、复制和部署。这在需要在离线或物理隔离（air-gapped）环境中执行自动化的场景特别有用，在这些环境中，互联网访问或外部依赖可能受到限制。总体来说，Ansible\
  \ 执行环境通过提供定义且一致的运行环境，简化了 Ansible 自动化的部署和执行，确保自动化任务可以在不同的系统和环境中可靠且一致地执行。\n\n使用 `ansible-builder`\
  \ 命令行工具可以在我们的系统中创建自定义的执行环境。我们还可以使用可选的步骤 5 为未连接或物理隔离的创建创建执行环境镜像。我们可以通过以下步骤创建自定义的\
  \ Ansible 执行环境：\n\n### 1. 安装 ansible-builder 工具：\n\n首先，我们可以从 Red Hat RPM 存储库安装 `ansible-builder`\
  \ 工具：\n\n```bash\ndnf install ansible-builder\n```\n\n或者，从上游 Python 存储库安装 `ansible-builder`\
  \ 工具：\n\n```bash\npip install ansible-builder\n```\n\n### 2. 创建 execution-environment.yml\
  \ 文件：\n\n创建一个名为 `execution-environment.yml` 的 YAML 定义文件，用于指定基础容器镜像、Ansible 配置、依赖和额外的构建步骤。\n\
  \n这是一个示例：\n\n```yaml\n---\nversion: 1\nbuild_arg_defaults:\n  EE_BASE_IMAGE: 'automationhub.example.com/ee-minimal-rhel8:latest'\n\
  ansible_config: 'ansible.cfg'\ndependencies:\n  galaxy: requirements.yml\n  python:\
  \ requirements.txt\n  system: bindep.txt\nadditional_build_steps:\n  prepend: |\n\
  \    RUN pip3 install --upgrade pip setuptools\n  append:\n  - RUN ls -al /\n```\n\
  \n请确保使用适当的容器仓库源自定义 `EE_BASE_IMAGE`。`requirements.yml` 文件按照 第 3 章：Ansible 语言扩展 中\
  \ `Ansible collection.` 节中所学的格式指定 Ansible 集合依赖。`requirements.txt` 文件按照 第 6 章：Ansible\
  \ 故障排除 中 `Ansible collection.` 节中所学的指定 Python 依赖。`bindep.txt` 文件指定使用 RPM 和 `DPKG`\
  \ 命令行工具为 RPM 和 DEB 格式安装的操作系统包。对于 git 工具的安装，我们将使用以下 `bindep.txt` 文件：\n\n```text\n\
  git [platform:rpm]\ngit [platform:dpkg]\n```\n\n### 3. 构建容器镜像：\n\n使用 `ansible-builder\
  \ build` 命令根据 `execution-environment.yml` 文件构建容器镜像。为镜像指定标签（tag）。例如：\n\n```bash\n\
  ansible-builder build --tag my_custom_ee\n```\n\n这将创建一个构建上下文并生成一个 Containerfile。\n\
  \n### 4. 创建容器镜像：\n\n使用容器引擎（例如 Podman 或 Docker）从构建上下文创建容器镜像。例如：\n\n```bash\npodman\
  \ build -f context/Containerfile -t my_custom_ee context\n```\n\n### 5. 传输容器镜像（可选）：\n\
  \n如果我们处于离线环境，我们需要将容器镜像传输到目标系统。我们可以创建容器镜像的归档并使用安全方法进行传输，或者使用传输的依赖直接在目标系统上构建镜像。\n\n\
  ### 6. 加载并使用容器镜像：\n\n一旦容器镜像在离线系统中可用，即可使用容器引擎加载它。例如：\n\n```bash\npodman load -i my_custom_ee-1.0.tar\n\
  ```\n\n然后我们就可以使用自定义的执行环境镜像在离线环境中执行 Ansible playbooks 和自动化任务了。\n\n如果我们想将容器镜像存储在私有自动化中心或其他支持的容器仓库中，请遵循适当的标记和推送流程。\n\
  \n请注意，此处提供的示例命令可能会根据我们的特定环境和配置而变化。请参阅 Ansible Automation Platform 和 `ansible-builder`\
  \ 的官方文档获取更详细的说明和选项。\n\n# Ansible 自动化网格 (Automation Mesh)\n\n自动化网格是 Ansible Automation\
  \ Platform 2.1 版本引入的一个新功能。它旨在简化并改进跨平台和位置（包括本地环境、混合云和边缘设备）的自动化可扩展性。自动化网格提供了一种灵活的设计，可以部署在单站点安装或跨多个全球位置，满足各种自动化需求。自动化网格解决了跨不同环境扩展自动化、集中管理平台以及对连接受限的远程地区进行自动化的挑战。通过在靠近所需设备的地方交付和运行自动化，可以最大限度地减少执行中的中断和不一致性，从而提高\
  \ IT 服务的可靠性并减少停机时间。\n\n在过去，使用 Ansible Tower 和隔离节点架构在多个区域和复杂网络中扩展自动化是挑战性的。Ansible\
  \ Tower 的执行与控制能力紧耦合使得可扩展性变得困难，且单体设计将执行能力限制在单个集群，对网络延迟和中断敏感。隔离节点提供了本地执行，但在通信方面存在局限性，并且需要\
  \ SSH 代理和跳板机等额外工具。\n\n自动化网格配合自动化控制器（automation controller）克服了这些限制。它简化了跨多个站点的自动化分发并减少了操作开销。自动化网格通过本地化消除了对跳板机和\
  \ SSH 代理等辅助工具的依赖。它提供了设计活性，允许从单站点到全球的部署。自动化网格利用多方向、多跳的覆盖网络跨受限网络和远程端点交付自动化。它能够独立地扩展控制和执行能力，提供容错性、冗余性以及对网络中断和延迟的增强弹性。\n\
  \n安全性是自动化网格的一个关键方面，它包含了诸如 `访问控制列表 (ACL)`、`传输层安全 (TLS)` 认证和加密等功能。通过自动化控制器进行集中管理可以利用\
  \ `RBAC (基于角色的访问控制)` 和身份验证等功能来保护自动化网格。\n\n自动化网格的主要优势包括简化操作、设计灵活性、可扩展性、可靠性和增强的安全性。通过利用自动化网格，组织可以在范围内扩展自动化，提高可靠性并安全地管理其整个企业\
  \ IT 资产。所有节点上 Ansible 网格网络使用的默认防火墙端口是 TCP 27199。\n\n# 基于角色的访问控制 (RBAC)\n\n基于角色的访问控制\
  \ (RBAC) 是一种安全模型，根据分配给用户或组的角色提供访问控制。Ansible Automation Platform 支持 RBAC，提供安全且细粒度的访问控制机制来管理自动化工作流和资源：\n\
  \n![](img/Figure-7.4.jpg)\n\n\n\n\n\n## 图 7.4: Ansible Automation Controller 的 Azure\
  \ AD 集成\n\nRBAC（基于角色的访问控制）是 Ansible Automation Platform 的核心组件，它允许组织根据角色限制用户对特定功能、资源或操作的访问。平台提供了预定义的角色，例如\
  \ `Administrator`、`Operator` 和 `Viewer`，可以将它们分配给用户或组：\n\n* `Administrator` 角色具有对\
  \ Ansible 自动化平台所有功能和资源的完全访问权限，包括创建、修改和删除用户、组和角的能力。\n* `Operator` 角色具有有限访问权限，只能执行特定操作，例如运行作业或管理清单。\n\
  * `Viewer` 角色对 Ansible 自动化平台具有只读访问权限，允许用户查看资源状态，但不能对其进行修改。\n\nRBAC 还允许组织创建自定义角色并将其分配给用户或组。\n\
  \n自定义角色可以根据组织的特定需求定义。例如，组织可以为开发人员创建一个自定义角色，允许他们运行 playbooks，但限制他们管理清单或创建新用户。Ansible\
  \ 自动化平台的 RBAC 还提供了控制特定资源访问水平的权限级别。例如，具有 `read` 权限级别的用户可以查看资源但无法修改，而具有 `write` 权限级别的用户可以修改资源。\n\
  \n基于角色的访问控制是 Ansible 自动化平台的一项重要安全功能，允许组织根据分配给用户或组的角色控制对资源的访问。它提供了一种细粒度的访问控制机制，帮助组织安全地管理自动化工作流和资源：\n\
  \n![](img/Figure-7.5.jpg)\n\n## 图 7.5: Ansible Automation Controller 的 LDAP 集成\n\
  \n在 Ansible Automation Platform 中，RBAC 允许我们根据分配给用户或组的角色，控制对清单、playbooks 和作业等 Ansible\
  \ 资源的访问。要在 Ansible Automation Platform 中实现 RBAC，我们可以将其与企业目录系统集成，例如 Microsoft Active\
  \ Directory（参见 `图 7.4]`）或 LDAP（参见 `图 7.5]`）。这种集成允许我们根据企业目录系统中分配给用户或组的角色来管理 Ansible\
  \ 资源的访问。\n\n集成过程涉及以下步骤：\n\n1. **设置企业目录系统**：为了将 Ansible Automation Platform 与企业目录系统集成，我们首先需要设置目录系统并确保其配置正确。\n\
  2. **配置 Ansible Automation Platform**：我们需要配置 Ansible Automation Platform 使用企业目录系统进行身份验证和授权。这涉及配置平台使用\
  \ `LDAP` 或 `Active Directory` 协议与目录系统通信。参见 `图 7.4]` 中的 Azure AD 集成和 `图 7.5]` 中的\
  \ LDAP 集成。\n3. **定义角色和权限**：集成完成后，我们可以根据企业目录系统中分配给用户或组的角色，在 Ansible Automation Platform\
  \ 中定义角色和权限。我们可以创建 `Admin`、`Developer` 或 `Operator` 等角色，并根据它们负责的任务和工作流为每个角色分配权限。\n\
  4. **将角色分配给用户或组**：最后，我们可以为企业目录系统中的用户或组分配角色，这将自动在 Ansible Automation Platform 中授予相应的权限。\n\
  \n通过 RBAC 集成，我们可以确保只有授权的用户才能访问 Ansible 资源，并且他们只能执行其职责范围内的任务。RBAC 帮助帮助我们管理和维护清晰的审计轨迹，记录谁在何时访问了哪些资源，从而提高安全合规性。将\
  \ Ansible Automation Platform 与企业目录系统集成用于 RBAC，允许我们根据角色和权限管理资源访问，确保只有授权用户才能访问执行其任务所需的资源。\n\
  \n# Morpheus\n\nAnsible Morpheus 是 Ansible 与 Morpheus 云管理平台之间的集成。Morpheus 是一个云应用管理平台，帮助\
  \ IT 团队管理和自动化跨多个云、数据中心和 DevOps 工具的基础设施。\n\n通过 Ansible 集成，Morpheus 允许用户利用 Ansible\
  \ 强大的自动化能力来管理和配置各种平台的基础设施资源。该集成允许通过使用 Ansible playbooks 创建动态基础设施，实现自动化的配置、扩展和管理。\n\
  \nMorpheus 提供了一个统一平台来管理 IT 资源，支持云原生和传统工作负载，与 Ansible 的集成为平台增加了更多的灵活性和力量。该集成允许 IT\
  \ 团队自动化其基础设施和云管理任务，实现应用程序和服务的快速、可靠的部署。\n\nMorpheus 与 Ansible 之间的集成为 IT 团队带来了许多益处，包括：\n\
  \n* **提高效率**：集成允许 IT 团队自动化基础设施管理任务，减少了手动工作量并提高了效率。\n* **简化管理**：集成提供了一个用于管理 IT 资源的统一平台，支持云原生和传统工作负载。\n\
  * **增强灵活性**：与 Ansible 的集成为 Morpheus 平台增加了更多的灵活性和力量，允许 IT 团队更高效地自动化基础设施和云管理任务。\n\
  * **提高可扩展性**：Ansible 以可扩展性著称，集成允许 IT 团队根据需要快速扩展其基础设施管理任务。\n* **更好的可靠性**：Ansible\
  \ 提供的自动化能力有助于确保基础设施管理任务的一致性和可靠性，减少错误和停机的风险。\n\n## 使用 Morpheus 和 Ansible 集成\n\n要使用最新的\
  \ Morpheus 和 Ansible 集成，用户必须在 Morpheus 中配置 Ansible 端点。这涉及提供必要的凭据并配置端点设置。\n\n一旦完成完成后，用户就可以创建\
  \ Ansible playbook 并使用它们来自动化 Morpheus 内部的基础设施管理任务。例如，用户可以创建一个 playbook 来配置和配置虚拟机，或在云平台上部署和管理应用程序。\n\
  \n用户还可以利用 Morpheus 的自动化功能（例如工作流以及与其他 DevOps 工具的集成）来进一步增强平台的功能。\n\n# 配置管理 (CM)\n\n\
  Ansible 是一个强大的配置管理工具，允许我们自动化管理 IT 基础设施。它允许我们通过编写 Ansible playbook 来定义并强制系统及应用程序的期望状态，这些\
  \ playbook 本质上是自动化系统配置的脚本。\n\n使用 Ansible 进行配置管理涉及以下步骤：\n\n1. **定义期望状态**：使用 Ansible\
  \ 进行配置管理的第一步是定义 IT 基础设施的期望状态。这涉及定义我们希望系统和应用程序遵循的配置设置。这可能包括包版本、网络配置、用户帐户和防火墙规则等内容。\n\
  \n\n\n\n编写 Ansible playbooks：一旦我们定义了期望状态，就可以编写 Ansible playbooks 来自动化系统和应用程序的配置。Playbooks\
  \ 以 YAML 格式编写，包含一组描述如何配置我们系统的任务（tasks）。Playbooks 可以针对单个系统或系统组运行，这使得管理大规模 IT 基础设施变得轻而易举。\n\
  \n运行 Ansible playbooks：编写好 playbooks 后，我们可以使用 Ansible 命令行工具来运行它们。Ansible 将连接到我们的系统并执行\
  \ playbook 中定义的任务，确保我们的系统配置符合期望状态。\n\n验证和监控配置：一旦执行了 playbooks，我们就可以验证系统配置是否正确。Ansible\
  \ 提供了用于验证系统配置和监控其状态的工具，以确保它们保持符合期望状态。\n\nAnsible 还提供了许多让配置管理更易于访问且更高效的特性。例如，Ansible\
  \ 允许我们创建可重用的角色（roles）和模板（templates），这些内容可以在多个 playbook 和系统之间使用。这使得维护一致性并避免重复劳动变得非常简单。\n\
  \nAnsible 配置管理允许我们自动化管理 IT 基础设施，确保我们的系统配置符合期望状态。通过定义期望状态、编写 Ansible playbooks 并在系统上运行它们，我们可以简化\
  \ IT 运营并提高效率。\n\n# 图形用户界面\n\n当服务器数量增加时，拥有执行过程每个步骤的可视化分解以及工作流过程的完整分析是有益的。Ansible\
  \ 没有内置的图形用户界面（GUI），因为它的主要界面是基于命令行的。但是，有一些第三方工具和平台在 Ansible 之上提供了 GUI，以增强用户体验并简化\
  \ Ansible 自动化管理。这些 GUI 工具通常提供 Ansible playbooks、清单（inventories）和作业执行的可视化表示，使得偏好图形界面的用户更容易与\
  \ Ansible 交互。以下是 Ansible GUI 工具的示例：\n\n- **Ansible Automation Controller**：是 Ansible\
  \ Automation Platform 订阅的一部分，是一套全面的 IT 自动化解决方案，包含基于 Web 的 GUI。它提供了一个集中接口，用于管理 Ansible\
  \ playbooks、清单、凭据和作业调度。GUI 允许用户创建和管理自动化工作流、监控作业状态并查看详细的日志和报告。\n- **AWX**：AWX 是 Ansible\
  \ Tower 的开源版本，提供了类似的 GUI 体验。它提供了一个基于 Web 的接口来管理 Ansible 自动化，包括定义清单、创建作业模板和调度作业的能力。AWX\
  \ 是一个社区驱动的项目，可以部署在本地或云端。\n- **Semaphore**：是一个提供基于 Web 的 GUI 以管理 Ansible playbooks\
  \ 和自动化任务的开源项目。它支持多种数据库，如 `MySQL`、`PostgreSQL` 和 `BoltDB`。通过 Semaphore，我们可以使用 Ansible\
  \ 构建、部署和回滚应用程序或配置。它允许我们将 playbooks 分组为项目并管理环境、清单、仓库和访问密钥。响应式 UI 允许从浏览器执行 playbook，即使在移动设备上也是如此。Semaphore\
  \ 提供了计划的 playbook 运行、详细日志、通知和用户委托等功能。它用 `Go` 编写，适用于 Windows、macOS 和 Linux 平台。\n\
  - **Rundeck**：Rundeck 是一个开源自动化平台，可以与 Ansible 集成并提供管理和执行 Ansible playbooks 的 GUI。它提供了一个基于\
  \ Web 的接口，用户可以在其中定义作业工作流、执行 playbooks 并监控作业执行。\n- **Foreman**：Foreman 是一个物理和虚拟服务器的生命周期管理工具。它与\
  \ Ansible 集成，并提供了管理和编排 Ansible playbooks 的 GUI。Foreman GUI 允许用户定义主机、分配 Ansible 角色并针对目标主机执行\
  \ playbooks。\n\n这些 GUI 工具旨在通过提供与 Ansible 组件交互的可视化界面，简化 Ansible 自动化的管理和执行。它们提供了清单管理、作业调度、日志和报告等功能，使得跟踪和管理自动化任务变得更容易。然而，重要的是，虽然这些\
  \ GUI 工具增强了用户体验，但底层功能和能力仍然基于 Ansible 的命令行界面。\n\n# Ansible Semaphore\n\nAnsible Semaphore\
  \ 是 Ansible 的现代 UI。它是一个专门为 Ansible 项目设计的基于 Web 的工具。它提供了一个图形界面，允许用户定义和管理他们的 playbook\
  \ 执行。Semaphore 与 `Git` 等版本控制系统集成，并提供 Ansible playbooks 的执行自动化。它为项目、任务模板、任务、密钥存储库、清单、环境和仓库提供了一个易于使用的界面。我们可以在\
  \ CI/CD 过程中使用 Semaphore，因为它支持构建和部署任务。它允许用户为 Ansible playbooks 和基础设施代码定义并管理 CI/CD\
  \ 流水线。\n\nSemaphore 支持 `MySQL`、`PostgreSQL` 和 `BoltDB`（嵌入式键值）数据库。我们可以通过四种不同的方式安装\
  \ Semaphore：snap、发行包管理器、`Docker` 和二进制文件。\n\n最快的方法是使用 snap 包，它会在我们的系统中设置所需的所有内容：\n\
  \n```bash\nsnap install semaphore\n```\n\n在程序成功安装后，我们可以使用命令配置数据库和其他参数：\n\n```bash\n\
  semaphore setup\n```\n\n安装成功后，Semaphore 仪表板如图 7.6 所示：\n\n![](img/Figure-7.6.jpg)\n\
  \n**图 7.6：** Semaphore 仪表板\n\n我们可以查看每次执行的状态，如图 7.7 所示：\n\n![](img/Figure-7.7.jpg)\n\
  \n**图 7.7：** Semaphore 执行详情\n\n非常有用的功能是电子邮件或电报提醒功能，用于通知执行状态。\n\nAnsible Semaphore\
  \ 通过提供直观的 Web 界面和启用 CI/CD 工作流，简化并优化了 Ansible 项目的自动化。它增强了协作，减少了手动工作，并提高了管理 Ansible\
  \ 配置和部署的整体效率。\n\n# ARA records\n\nARA Records (Ansible Records Ansible) 是一个提供了记录和分析\
  \ Ansible playbooks 及其执行数据框架的项目。它旨在捕 Ansible 运行的细节，例如执行的任务、涉及的主机以及每个任务的结果。ARA Records\
  \ 将这些信息存储在数据库中，允许您查看和分析 Ansible 运行的历史数据。这对于故障排除、审计、性能分析以及理解通过 Ansible 所做更改的影响非常有用。\n\
  \n# 安装\n\nARA records 需要任何安装了 `Python` 的现代 Linux 发行版或 macOS。默认情况下，它使用本地 `SQLite`\
  \ 服务器来存储性能数据。然而，当运行多个 Ansible 控制器时，我们可以使用 API 服务器来存储执行数据。该架构要求 API 服务器作为服务运行，并配置\
  \ ARA Ansible 回调插件使用带有 API 服务器端点的 HTTP API 客户端。可以在第 8 章：Ansible 高级”中的“回调插件”部分了解更多关于\
  \ Ansible 回调插件的信息。这是无需 API 服务器的 ARA Records 简单安装方法：\n\n1. 通过 PIP 安装 ARA server：\n\
  \n\n\n\n```bash\npython3 -m pip install \"ara[server]\"\n```\n\n2. 配置 ARA 回调插件：\n\
  \n将 Ansible 回调插件设置为使用 ARA。最简单的方法是通过 `ANSIBLE_CALLBACK_PLUGINS` 环境变量来实现：\n\n```bash\n\
  export ANSIBLE_CALLBACK_PLUGINS=\"$(python3 -m ara.setup.callback_plugins)\"\n```\n\
  \n3. 运行 Ansible Playbook：\n\n每次执行 `ansible-playbook` 命令都会将数据发送到 ARA 服务：\n\n```bash\n\
  ansible-playbook playbook.yml\n```\n\n4. 与 ARA 工具交互：\n\n我们可以使用 `ara` 命令来列出并分析使用\
  \ ARA 的执行结果：\n\n```bash\nara playbook list\n```\n\n5. 启动内置开发服务器：\n\nARA 提供了一个内置的开发服务器，用于浏览记录的结果并分析执行情况：\n\
  \n```bash\nara-manage runserver\n```\n\n执行结果显示在 Web 用户界面的仪表板中，如图 7.8 所示：\n\n![](img/Figure-7.8.jpg)\n\
  \n**图 7.8：** ARA 记录仪表板\n\n对于每个作业，我们可以逐步分析 playbook 的执行情况，如图 7.9 中显示的示例所示：\n\n![](img/Figure-7.9.jpg)\n\
  \n**图 7.9：** ARA 记录执行详情\n\n# 自定义\n\n我们可以通过设置环境变量或使用 `ansible.cfg` 配置文件中的 `[ara]`\
  \ 部分来自定义 ARA 工具的行为。\n\n例如，以下两个环境变量会将数据发送到名为 `ara.example.com` 的 ARA HTTP API 服务器，该服务器接收来自多个节点的数据：\n\
  \n```bash\nexport ARA_API_CLIENT=\"http\"\n```\n\n```bash\nexport ARA_API_SERVER=\"\
  http://ara.example.com:8000\"\n```\n\n我们可以使用 DockerHub 上发布的镜像，通过 podman 或 Docker\
  \ 命令来运行 ARA 服务器：\n\n1. 创建一个本地目录来存储设置和 SQLite 数据库：\n\n```bash\nmkdir -p ~/.ara/server\n\
  ```\n\n2. 使用本地目录通过 docker 启动 API 服务器：\n\n```bash\ndocker run --name api-server --detach\
  \ --tty --volume ~/.ara/server:/opt/ara:z -p 8000:8000 docker.io/recordsansible/ara-api:latest\n\
  ```\n\n对于 podman 容器引擎，只需将 docker 命令替换为 podman 即可。\n\nARA Records API 服务器是一个基于 Python\
  \ 语言编写的 Django Web 应用程序，我们可以使用任何 WSGI 应用服务器运行，例如流行的 Web 服务器软件 `gunicorn`、`uwsgi`\
  \ 或 `mod_wsgi`。\n\nARA Records 对生产环境和开发环境都有益。通过利用 ARA Records，用户可以跟踪 Ansible playbook\
  \ 的进度，识别执行过程中遇到的任何问题或错误，并对 Ansible 操作进行全面记录。这有助于维护准确且集中的 Ansible 运行历史，便于在管理基础设施和部署时进行分析、协作和决策。\n\
  \n# Steampunk Spotter\n\nSteampunk Spotter 是一款企业级 Ansible Playbook 扫描工具，用于分析并为 playbook\
  \ 提供建议。这是通过 XLAB Steampunk 公司销售的付费产品。它使用 CLI 或 VSCode 扩展获取代码，并直接在终端或良好的 Web 用户界面上呈现信息。\n\
  \nSteampunk Spotter 和 Ansible Lint（见第 6 章：Ansible 故障排除，故障排除部分）是互补工具，共同提高 Ansible\
  \ Playbooks 的质量和可靠性。Ansible Lint 专注于捕捉编程错误、bug 和样式错误并强制最佳实践，而 Steampunk Spotter\
  \ 超出了语法检查。Spotter 会分析 Ansible 内容本身（包括模块、角色和集合），识别难以发现的问题，提供特定模块的建议并自动修复某些问题。\n\n\
  以下是配合 Ansible Lint 使用 Steampunk Spotter 的益处：\n\n**发现隐性错误：** Steampunk Spotter 可以识别\
  \ Ansible Lint 可能无法捕捉的隐藏障碍和耗时错误。它可以帮助你发现超出基础语法和样式检查的问题。\n\n**特定模块的建议：** Spotter\
  \ 提供了针对特定模块、用户环境设置和其他因素的建议。这允许更具定制化的建议和改进。\n\n**便利功能：** Steampunk Spotter 提供了许多便利功能，例如生成\
  \ `requirements.yml` 文件并引导指向特定模块版本的文档。这些功能可以节省你的时间并让你的自动化过程更高效。\n\n**协作和仓库扫描：**\
  \ Spotter 自带一个应用程序，允许你扫描公共 Git 仓库、与团队协作，并跟踪扫描历史、playbook 执行频率、常见错误以及随时间变化的进度。此外，Spotter\
  \ 提供报告，以便对所使用的集合和模块有深入深入见解。\n\n**简化 Ansible 升级：** Spotter 可以帮助简化升级 Ansible 的过程。它会检查现有的\
  \ playbook 是否兼容特定的 Ansible 版本，识别升级期间需要解决的问题，并允许你确定 Ansible 的目标版本和源版本。这使得升级过程更快更高效。\n\
  \n综之，虽然 Ansible Lint 是捕捉错误和实施最佳实践的强大工具，但 Steampunk Spotter 通过提供特定模块建议、识别难以发现的错误以及提供改进\
  \ playbook 和增强自动化便利功能扩展了它的能力。共同使用这两个工具可以帮助确保自动化的可靠性并提高 Ansible Playbooks 的整体质量。\n\
  \n![](img/Figure-7.10.jpg)\n\n**图 7.10：** Steampunk Spotter 登录界面\n\n我们可以使用通过 PIP\
  \ 包管理器安装的命令行工具：\n\n```bash\npip install steampunk-spotter\n```\n\n安装后，我们可以开始使用命令行界面进行登录并获取\
  \ API 令牌：\n\n```bash\nspotter login\n```\n\n`Username: AnsiblePilot`\n\n`Password:`\n\
  \n`Login successful!`\n\n从现在起，我们可以继续对 playbook 进行任何进一步扫描。例如，以下命令扫描了 `fix.yml` Ansible\
  \ playbook：\n\n```bash\nspotter scan fix.yml\n```\n\n它产生以下输出：\n\n```\nfix.yml:10:7:\
  \ HINT: [H500] Use of module debug is discouraged in production.\nfix.yml:20:7:\
  \ HINT: [H500] Use of module debug is discouraged in production.\n------------------------------------------------------------------------\n\
  Spotter took 0.430 s to scan your input.\nIt resulted in 0 error(s), 0 warning(s)\
  \ and 2 hint(s).\nOverall status: HINT\n```\n\n执行结果显示在命令行界面，如图 7.11 所示：\n\n![](img/Figure-7.11.jpg)\n\
  \n**图 7.11：** Steampunk Spotter CLI\n\n图形用户界面中的执行结果如图 7.12 所示：\n\n![](img/Figure-7.12.jpg)\n\
  \n**图 7.12：** Steampunk Spotter 仪表板\n\n# 结论\n\n\n\n\nAnsible 是一个企业级的自动化平台，通过将任务、配置和应用部署自动化来简化并加速\
  \ IT 运营。它能够实现一致的基础设施管理，减少人工操作，促进协作，并提高企业环境内的效率和可扩展性。许多开源项目和公司创建了各种产品，这些产品以 Ansible\
  \ 为基础，整合并简化现代混合基础设施的管理。在本章中，我们学习了如何利用 Ansible 自动化平台及其替代方案与实现基于色的访问控制（RBAC）的集中认证系统进行交互。在下一章中，我们将探索如何与云计算提供商集成（特别是亚马逊云服务\
  \ AWS），并使用 Kubernetes 技术来提升我们的云原生应用部署。\n\n# 重点回顾\n\n- GitOps 项目设计通过标准化项目的文件和目录结构，实现了基础设施即代码\
  \ (IaC) 和配置即代码 (CasC)。\n- 企业级用户应考虑采用 Ansible 自动化平台，以集中和优化 Ansible 代码的执行。\n- Ansible\
  \ 是一个命令行工具。不过，也有许多图形化用户界面替代方案。\n\n# 单选题\n\n1. 哪个项不是 Ansible 自动化平台的组件？\n    1. 自动化控制器\
  \ (Automation controller)\n    2. 自动化中心 (Automation hub)\n    3. Ansible 自动化网格 (Ansible\
  \ automation mesh)\n    4. 自动化核心 (Automation core)\n2. 哪个不是 Ansible 的图形化用户界面？\n\
  \    1. 自动化控制器 (Automation controller)\n    2. Semaphore\n    3. ARA Records\n \
  \   4. Foreman\n3. 哪个不是 GitOps 基础的特性？\n    1. 它实现了基础设施即代码 (IaC)\n    2. 它基于流行的 Git\
  \ 版本控制系统\n    3. 它具有有固定的目录结构\n    4. 以上都不是\n4. Ansible 自动化网格是否是 Ansible 自动化平台的一部分？\n\
  \    1. 是\n    2. 否\n\n# 答案\n\n1. D\n2. C\n3. D\n4. A\n\n# 思考题\n\n1. 在系统中启用 Ansible\
  \ 管道化 (Pipelining) 有什么影响？\n2. GitOps 的目录布局是什么？\n3. Ansible 自动化平台的主要组件有哪些？\n4. Ansible\
  \ 的图形化用户界面有哪些？\n\n# 核心术语\n\n- **GitOps**: Ansible GitOps 允许实现基础设施即代码 (IaC) 和配置即代码\
  \ (CaC) 模式，主要使用 Git 技术将信息存储在仓库中。\n- **Ansible Automation Platform**: Ansible 自动化平台是一个全面的解决方案，通过集中平台实现\
  \ IT 任务自动化和规模化管理基础设施。\n- RBAC (基于角色的访问控制) 是一种安全模型，根据预定义的角色限制系统访问，确保用户在组织资源内获得适当的权限和权利。\n\
  \n# 第 8 章\n\n## Ansible 进阶\n\n## 引言\n\n在本章中，我们将学习 Ansible 中使用的更高级的特性和技术，例如自定义模块、动态清单脚本、复杂的\
  \ Playbook 以及高级配置管理实践。这包括更深层次的主题，如扩展和性能调优、在云平台上使用 Ansible、与其他工具集成以及实施安全最佳实践。高级 Ansible\
  \ 用户可能还会处理更复杂的架构和环境，例如分布式系统和微服务。\n\n### 章节结构\n\n在本章中，我们将涵盖以下主题：\n\n- 第三方集成、脆弱性与灵活性\n\
  - Ansible 编排 (Orchestration)\n- 事件驱动 Ansible (Event-driven Ansible)\n- Ansible 配置设置\n\
  - 最新趋势\n\n### 第三方集成、脆弱性与灵活性\n\n在当今快速演变的技术领域，组织不断优化其 IT 基础设施以实现效率、可靠性和灵活性。Ansible\
  \ 作为一个强大的开源自动化平台，已成为解决这些需求的领先解决方案。虽然 Ansible 提供了一套健的内置功能，但它与第三方工具和平台无缝集成的能力使其性能提升到了新的高度。让我们探索\
  \ Ansible 第三方集成在增强基础设施灵活性应对脆弱性方面的重要性，使组织能够规模化地采用自动化。\n\n#### 第三方集成的力量\n\nAnsible\
  \ 的第三方集成使组织能够将其自动化能力扩展到核心功能之外。通过支持的庞大集成生态系统，Ansible 能够与许多系统、应用程序和服务进行无缝交互。这种以集成为中心的方法确保组织可以自动化复杂的工作流，并充分利用其现有基础设施投资的潜力。\n\
  \n#### 脆弱性：简化复杂环境\n\n复杂的 IT 环境天生可能具有脆弱性，容易出现人为错误和配置不一致的问题。Ansible 的第三方集成通过提供标准的自动化框架帮助缓解这些挑战。通过与监控系统、配置管理数据库\
  \ (CMDBs) 和事件管理平台等工具集成，Ansible 能够实现主动监控、高效的变更管理和自动化事件响应。这减少了基础设施的脆弱性，减少了停机时间，并确保了整个生态系统的一致性能。\n\
  \n#### 灵活性：实现快速适应\n\n在当今快速节奏的商业环境中，灵活性至关重要。Ansible 的第三方集成通过让组织能够快速响应不断变化的需求，在培养灵活性方面发挥着关键作用。与亚马逊云服务\
  \ (AWS)、Microsoft Azure 或 Google Cloud (GCP) 等云平台的集成允许资源的动态配置、自动伸缩和无缝的应用部署。Ansible\
  \ 还与 `Git` 等源码控制系统集成，便于版本控制并让团队能够快速发布更新。通过自动化这些过程，Ansible 加快了开发周期，增强了协作并驱动了持续集成和部署\
  \ (CI/CD) 实践。\n\n#### 多元的集成生态系统\n\nAnsible 的集成生态系统涵盖广泛的技术和工具。它与 `Puppet` 和 `Chef`\
  \ 等配置管理系统无缝连接，使组织能够利用现有投资的同时从 Ansible 的编排能力。它与网络设备集成实现了网络配置的自动化和网络服务的供应。此外，Ansible\
  \ 还与虚拟化平台、容器化技术、数据库、消息系统以及许多对现代基础设施至关重要的组件集成。\n\n\n\nAnsible 的第三方集成在基础设施自动化方面是游戏规则的改变者。通过与各种工具、平台和服务无缝连接，Ansible\
  \ 赋予组织增强健壮性、减少错误并在规模上实现敏捷性的能力。凭借不断增长的生态系统和活跃的社区，Ansible 持续演进，成为寻求释放组织内自动化全潜力的 IT\
  \ 专业人员的信赖之。拥抱 Ansible 的第三方集成是一项战略决策，可以推动组织迈向更高效、可靠和敏捷的未来。\n\n# 回调插件 (Callback plugin)\n\
  \n在 Ansible 中，回调插件是一种机制，允许我们在执行剧本（playbook）期间在响应事件时，扩展 Ansible 的行为和功能。这些插件允许我们自定义并控制在运行\
  \ Ansible 命令行程序时看到的输出。\n\n默认情况下，回调插件负责管理 Ansible 命令执行期间显示的大部分输出。它们控制命令行上信息的格式化和呈现方式。然而，回调插件也可以用于添加额外输出、将\
  \ Ansible 与其他工具或系统集成，以及在后端存储系统中存储或处理事件。\n\n回调插件对于多种用途都非常有帮助，例如：\n\n*   **自定义输出：**\
  \ 我们可以使用回调插件来修改或增强 Ansible 的默认输出，根据我们的特定需求进行定制。这允许我们以符合我们需求的格式呈现信息。\n*   **与外部工具集成：**\
  \ 回调插件提供了将 Ansible 与其他外部工具（如监控系统或日志框架）集成的方法。这使我们能够将 Ansible 事件和信息整合到现有的工具生态系统中。\n\
  *   **事件存储：** 回调插件可用于捕获并将 Ansible 事件存储到存储后端中。这允许我们维护剧本执行的历史记录，分析数据，并对 Ansible 执行的操作获得洞解。\n\
  \n如果现有的回调插件不能满足我们的需求，我们具有创建自定义回调插件的灵活性。这允许我们针对特定用例实现特定的行为和响应。通过利用自定义回调插件，我们可以扩展\
  \ Ansible 的功能，并将其更有效地集成到我们的基础设施和工作流中。\n\n# 动态清单 (Dynamic inventories)\n\nAnsible\
  \ 动态清单为以灵活动态的方式管理基础设施提供了强大的能力。与需要手动更新的静态清单不同，动态清单会自动从云提供商、虚拟化平台或自定义脚本等外部源收集有关主机及其属性的信息。通过\
  \ Ansible 动态清单，我们可以轻松地适应基础设施的变化，包括扩展或缩小规模、配置新资源或弃用现有资源。这种灵活性使我们能够在动态环境中高效地自动化任务和配置，而无需进行不断的人工干预。\n\
  \n动态清单允许我们根据标签、元数据或网络属性等特定标准定义主机组并分配变量。这种动态分组简化了基础设施的组织和管理，更容易针对特定的主机或组进行配置管理、部署或编排任务。通过利用\
  \ Ansible 动态清单，我们获得了跨越化且不断变化的环境自动化复杂操作的能力。它使我们在基础设施管理中实现一致性、扩展性和敏捷性，最终在确保资源准确供应和配置的同时节省时间和精力。我们可以使用\
  \ Python、Java、Perl、Bash、Ruby 和 Go 等语言使用或编写自定义动态清单插件，并向 Ansible 返回 JSON 对象。此功能使我们能够列出虚拟机、云提供商或容器编排平台等快速环境中的资源。\n\
  \n# VMware\n\n要为 VMware 配置 Ansible 动态清单并列出 VMware 基础设施内的所有虚拟机，请遵循以下步骤：\n\n1. 安装所需的依赖：\n\
  \   确保我们已安装必要的依赖项，包括 Python `pyVmomi` 库、Python requests 库和 vSphere Automation SDK（用于标签功能）：\n\
  \n   ```\n   pip install PyVmomi\n   ```\n\n   ```\n   ansible-galaxy install community.vmware\n\
  \   ```\n\n2. 安装 VMware 动态清单插件：\n   使用 `community.vmware.vmware_vm_inventory` 插件，该插件与\
  \ VMware API 交互以获取虚拟机作为清单主机的信息。\n\n3. 创建清单配置文件：\n   创建一个以 `vmware.yml`、`vmware.yaml`、`vmware_vm_inventory.yml`\
  \ 或 `vmware_vm_inventory.yaml` 结尾的 YAML 清单配置文件。\n\n4. 配置清单文件：\n   指定插件为 `vmware_vm_inventory`\
  \ 并提供必要的参数，例如 VMware 环境的主机名、用户名、密码以及证书验证和标签支持等可选设置。\n\n5. 测试清单：\n   运行命令 `ansible-inventory\
  \ -i inventory.vmware.yml --list` 列出所有虚拟机作为清单主机，以及它们关联元数据。\n\n6. 可视化清单：\n   可选地，我们可以使用命令\
  \ `ansible-inventory -i inventory.vmware.yml --graph` 生成清单结构的图形化表示。\n\n   预期的输出如下：\n\
  \n   ```\n   @all:\n   |--@VMs:\n   |  |--example_92274719-810c-03ac-105b-14c372b4a210\n\
  \   |--@centos64Guest:\n   |  |--example_92274719-810c-03ac-105b-14c372b4a210\n\
  \   |--@poweredOff:\n   |  |--example_92274719-810c-03ac-105b-14c372b4a210\n   ```\n\
  \n7. 在剧本中使用动态清单：\n   ```\n   ansible-playbook -i inventory.vmware.yml playbook.yml\n\
  \   ```\n\n通过遵循这些步骤，我们可以成功地为 VMware 配置 Ansible 动态清单，允许我们在整个 VMware 基础设施中利用 Ansible\
  \ 自动化的力量。\n\n# Citrix\n\nAnsible 通过 Citrix collection 提供的 Ansible 模块与 Citrix 应用交付控制器\
  \ (ADC) 和 Citrix 应用交付管理 (ADM) 交互。\n\nCitrix ADC 是一种网络产品，为部署在数据中心或云环境中的应用程序提供负载均衡、应用加速安全和其他功能。而\
  \ Ansible 是一个开源自动化平台，允许您自动化 IT 任务，包括网络配置和管理。Ansible 与 Citrix ADC 的集成允许用户使用 Ansible\
  \ Play 本自动化 Citrix ADC 实例的供应、配置和管理。Ansible 提供了一系列专门用于与 Citrix ADC 交互的模块，使用户能够自动化各种任务，如创建虚拟服务器、配置负载均衡策略、管理\
  \ SSL 证书等。\n\n\n\n\n通过利用 Ansible 的声明式语言和自动化能力，用户可以在 Ansible playbooks 中定义 Citrix\
  \ ADC 基础设施的所需状态，并执行它们，以确保在多个 Citrix ADC 实例上实现一致且可的配置。这种集成简化了 Citrix ADC 部署的管理，减少了手动工作，并提高了运营效率。此外，Ansible\
  \ 与 Citrix ADC 的集成允许与其他基础设施组件（如网络交换机、路由器和虚拟化平台）无缝集成，实现对整个网络基础设施的全面自动化和编排。\n\nCitrix\
  \ 应用交付管理 (ADM) 是由 Citrix 提供的一个集中管理和分析平台。它设计用于简化包括 Citrix ADC 实例在内的应用交付基础设施的管理、监控和故障排除。ADM\
  \ 提供了一系列全面的功能，帮助管理员获得对其应用交付基础设施的可视性、优化性能、确保安全并简化操作。它提供了实时监控和分析能力，允许管理员监控应用程序流量、识别性能瓶颈并主动解决问题。现在，关于\
  \ Citrix ADM 与 Ansible 的集成，它允许管理员使用 Ansible playbooks 和模块自动化 Citrix ADC 实例的配置和管理。这种集成允许在广泛的\
  \ IT 基础设施中对 Citrix ADC 部署进行无缝编排和自动化。\n\n总的来说，Ansible 与 Citrix ADC 以及 ADM 的集成使网络管理员和\
  \ DevOps 团队能够自动化其 Citrix ADC 部署的配置和管理，简化操作并实现应用交付服务的有效管理。\n\n# Amazon Web Services\n\
  \nAmazon Web Services (AWS) 是一个全面的云计算平台，提供广泛的可扩展和灵活的服务，帮助企业构建和部署应用程序、存储和分析数据以及管理其\
  \ IT 基础设施。\n\n在 AWS 使用 Ansible 的优势在于它提供了一个强大的自动化工具集，可以简化和优化 AWS 资源的管理和部署，实现基础设施即代码实践，提高运营效率，并促进一致且可重复的配置。\n\
  \n# 动态清单\n\n使用 Ansible 为云提供商（如 AWS 资源）生成动态清单具有多个优势。首先，它通过消除对清单文件的手动更新并允许对 AWS 资源进行自动化管理和配置，实现了自动化。动态清单适应资源规模的变化，确保在任何级别都能进行无缝管理。它通过根据各种标准对资源进行分组和标记提供了灵活性，能够对资源管理任务进行针对性的控制。来自\
  \ AWS API 的实时更新确保了 Ansible 任务准确且最新的信息。通过简化清单管理，动态清单减少了管理开销，特别是在动态 AWS 环境中。它与其它 Ansible\
  \ 工作流无缝集成，增强了跨 AWS 资源的自动化能力。总的来说，在 Ansible 中使用动态清单增强了 AWS 环境内管理和自动化任务的灵活性、可扩展性和效率：\n\
  \n![](img/Figure-8.1.jpg)\n\n**图 8.1:** Amazon Web Services (AWS) 标志\n\n要使用 Ansible\
  \ 为我们的 Amazon Web Services (AWS) 基础设施生成资源动态清单，请按照以下步骤操作：\n\n1. 安装所需的依赖：\n   确保我们已经安装了必要的依赖。可以使用命令安装\
  \ `botocore` 和 `boto3` Python 库：\n   ```\n   pip install botocore boto3\n   ```\n\
  \n2. 安装 `amazon.aws` collection：\n   使用命令 `ansible-galaxy` 安装 `amazon.aws` collection。使用以下命令验证安装是否成功：\n\
  \   ```bash\n   ansible-galaxy collection list amazon.aws\n   ```\n\n3. 创建 AWS EC2\
  \ 清单配置文件：\n   创建一个名为 `inventory.aws_ec2.yml` 的清单配置文件，包含必要的插件配置。设置要查询的区域，根据标签定义过滤器，并指定键值组以根据主机变量创建动态组。\n\
  \n4. 启用 `aws_ec2` 清单插件：\n   在我们的 `ansible.cfg` 文件的 `[inventory]` 章节下添加以下配置行以启用动态清单插件：\n\
  \   ```ini\n   enable_plugins = amazon.aws.aws_ec2\n   ```\n\n5. 设置 AWS 环境变量：\n\
  \   确保使用我们的 AWS 凭据定义 `AWS_ACCESS_KEY_ID` 和 `AWS_SECRET_ACCESS_KEY` 环境变量。\n\n6. 与动态清单交互：\n\
  \   使用 `ansible-inventory` 或 `ansible-playbook` 命令配合 `-i inventory.aws_ec2.yml`\
  \ 选项与动态清单交互。`ansible-inventory` 命令生成图形风格输出，而 `ansible-playbook` 则允许我们使用动态清单执行 playbooks。\n\
  \n通过遵循这些步骤，我们可以为 Amazon Web Services 基础设施生成 Ansible 动态清单，允许我们使用 Ansible 管理和自动化跨\
  \ AWS 资源的任务。\n\n# 等幂性\n\n在涉及云部署和基础设施管理时，等幂性是一个关键概念。等幂性意味着多次运行任务或 playbook 不会在初始执行之外产生任何额外影响。在使用\
  \ Ansible 进行云部署的范围内，等幂性确保自动化过程不会破坏现有基础设施或创建重复资源。\n\n每个 Ansible 模块（包括用于云部署的模块）都有其识别和管理现有资源的方法。正确配置模块至关重要，使其能够识别并跟踪其创建的资源。这确保了自动化过程的后续运行将识别现有资源而不重新创建它们。\n\
  \n从相关资源组的角度思考可以大大简化整个环境的管理。通过将资源组织成逻辑组（例如按应用程序或环境类型），将更容易管理和协调它们的部署、配置和扩展。\n\n需要注意的是，为特定云平台（如\
  \ AWS - Amazon Web Services）设计的 Ansible 模块可能具有独特的安装和配置要求。这些模块专门为与云提供商提供的 API 和服务交互而定制。\n\
  \n遵循模块提供的文档和指南至关重要，以确保云特定功能的正确正确安装和配置。在使用云部署模块时，由于处理云资源的特殊性，其方法和用法可能与其他模块略有不同。\n\
  \n云模块通常涉及与基础设施即代码交互、管理虚拟机、网络、存储以及其他云特定资源。熟悉处理云部署模块的特定文档和最佳实践，对于确保云基础设施的高效高效管理至关重要。\n\
  \n\n\n\n总而言之，幂等性在云部署中至关重要，它可以防止中断和资源重复。正确配置模块并将资源组织到逻辑组中可以简化管理。云部署模块（例如用于 AWS 的模块）与其他模块相比，可能有独特的要求且使用方式也不同。理解这些概念和实践对于使用\
  \ Ansible 实现成功的云部署至关重要。\n\n在 AWS 环境中，Ansible 提供了几个专门设计用于与 AWS 服务交互的模块。许多这些 AWS 模块都有一个额外的\
  \ `info` 模块变体，用于收集数据而不执行任何操作或对资源进行更改。以下是关于这些 AWS info 模块的的一些关键点：\n\n*   **收集数据：**\
  \ info 模块用于收集有关特定 AWS 资源的信息。它们在检索数据时，不会对这些资源进行任何修改或执行任何操作。这允许您在做出任何决策或修改之前，检查 AWS\
  \ 资源的当前状态。\n*   **搜索功能：** info 模块通常支持搜索术语或过滤器，使您能够检索有关特定资源的信息或符合某些标准的资源列表的信息。此搜索功能可以帮助您缩小范围并收集所需的确切信息。\n\
  *   **AWS 网络：** 例如，让我们考虑与 AWS VPC（虚拟私有云）相关的模块。`ec2_vpc_net` 模块可创建或更新 VPC。另一方面，`ec2_vpc_net_info`\
  \ 模块专门用于收集现有 VPC 的信息。两个模块都返回关于 VPC 的相似数据，但它们之间的选择取决于您是希望您的自动化创建一个新的 VPC 还是与现有的 VPC\
  \ 工作。\n*   **关键 info 模块：** 下面的表 8.1 总结了用于 AWS 信息收集最重要的 Ansible 模块。\n\n| 模块 | AWS\
  \ 资源 |\n| :--- | :--- |\n| `amazon.aws.ec2_ami_info` | 机器镜像 (AMIs) |\n| `amazon.aws.ec2_group_info`\
  \ | 安全组 |\n| `amazon.aws.ec2_instance_info` | 实例（虚拟机） |\n| `amazon.aws.ec2_vpc_net_info`\
  \ | VPC 内部的网络和子网 |\n| `community.aws.ec2_asg_info` | 自动伸缩组 |\n| `community.aws.iam_user_info`\
  \ | 身份和角色 AWS IAM (身份和访问管理) |\n\n**表 8.1：** AWS 信息收集模块\n\n通过利用这些 info 模块，您可以收集有关环境中各种\
  \ AWS 资源的全面信息。这些数据可以用于决策、审计或输入后续的自动化任务。\n\n# Amazon EC2\n\n我们可以轻松地实现亚马逊弹性计算云 (Amazon\
  \ EC2) 上实例的部署。以下 `aws_ec2.yml` Ansible 剧本在我们的云计算环境中部署了一个亚马逊镜像 (AMI)：\n\n```yaml\n\
  ---\n- name: Deploy an EC2 instance\n  hosts: all\n  vars:\n    ec2_name: \"server-ec2\"\
  \n    ec2_ssh: \"my-ssh-key\"\n    ec2_vpc: \"subnet-pub1234\"\n    ec2_type: \"\
  c5.large\"\n    ec2_sg: \"default\"\n    ec2_ami: \"ami-123456\"\n    ec2_tag: \"\
  Development\"\n    ec2_ip_public: true\n  tasks:\n    - name: Create an EC2 instance\n\
  \      amazon.aws.ec2_instance:\n        name: \"{{ ec2_name }}\"\n        key_name:\
  \ \"{{ ec2_ssh }}\"\n        vpc_subnet_id: \"{{ ec2_vpc }}\"\n        instance_type:\
  \ \"{{ ec2_type }}\"\n        security_group: \"{{ ec2_sg }}\"\n        network:\n\
  \          assign_public_ip: \"{{ ec2_ip_public }}\"\n          image_id: \"{{ ec2_ami\
  \ }}\"\n        tags:\n          Environment: \"{{ ec2_tag }}\"\n```\n\n该剧本定义了一组在\
  \ Amazon Web Services (AWS) 上部署 EC2 实例的任务。让我们拆解一下该剧本：\n\n第一行 `---` 是 YAML 文档分隔符，用于在单个文件中分隔多个\
  \ YAML 文档。在此语境中它并非必须。\n\n剧本从一个名为 `Deploy an EC2 instance` 的 play 开始，该任务将在清单中指定的所有主机上执行。该\
  \ 包含了变量（在 `vars` 关键字下），定义了要创建的 EC2 实例的各种属性。\n\n以下是剧本中定义的变量：\n\n*   `ec2_name:`：指定\
  \ EC2 实例的名称，设置为 `server-ec2`。\n*   `ec2_ssh:`：指定用于访问实例的 SSH 密钥对，设置为 `y-ssh-key`。\n\
  *   `ec2_vpc:`：指定启动 EC2 实例的 VPC 子网 ID，设置为 `subnet-pub1234`。\n*   `ec2_type:`：指定实例类型，设置为\
  \ `c5.large`。\n*   `ec2_sg:`：指定 EC2 实例的安全组，设置为 `default`。\n*   `ec2_ami:`：指定用于实例的亚马逊机器镜像\
  \ (AMI) ID，设置为 `ami-123456`。我们可以通过搜索 Ubuntu  Amazon EC2 AMI 定位器 (`https://cloud-images.ubuntu.com/locator/ec2`)\
  \ 来获取此值。\n*   `ec2_tag:`：指定 EC2 实例的标签，设置为 `Development`。\n*   `ec2_ip_public:`：是否为实例分配公网\
  \ IP，设置为 `true`。\n\n在变量之后，是在 `tasks` 关键字下定义的一个任务。该任务名为 `Create an EC2 instance`，并使用\
  \ Ansible AWS EC2 模块 (`amazon.aws.ec2_instance`) 在 AWS 上启动 EC2 实例。该模块接受多个参数以根据提供的变量配置实例。\n\
  \n任务中使用的参数：\n\n*   `name:`：使用 `ec2_name` 变量的值指定 EC2 实例的名称。\n*   `key_name:`：使用 `ec2_ssh`\
  \ 变量的值指定用于访问实例的 SSH 密钥对名。\n*   `vpc_subnet_id:`：使用 `ec2_vpc` 变量的值指定 VPC 子网 ID。\n\
  *   `instance_type:`：使用 `ec2_type` 变量的值指定实例类型。\n*   `security_group:`：使用 `ec2_sg`\
  \ 变量的值指定安全组。\n*   `network:`：指定网络相关配置，包括使用 `ec2_ip_public` 变量的值决定为实例分配公网 IP。\n*\
  \   `image_id:`：使用 `ec2_ami` 变量的值指定用于实例的 AMI ID。\n*   `tags:`：指定分配给 EC2 实例的标签，并将\
  \ `Environment` 标签设置为 `ec2_tag` 变量的值。\n\n总体而言，此剧本旨在使用 Ansible AWS EC2 模块根据指定的配置和标签在\
  \ AWS 上启动 EC2 实例。\n\n# Google Cloud Platform and Azure](#toc.xhtml_s308a)\n\n谷歌云\
  \ (GCP) 和微软 Azure 是两个流行的云计算平台，为构建、部署和管理云应用程序及基础设施提供了广泛的服务和服务。Ansible 作为通用自动化工具，可以与\
  \ GCP 和 Azure 集成，以自动化这些云环境中的各种任务和配置。\n\n通过 Ansible 与 GCP 的集成，用户可以利用专门为 GCP 设计的 Ansible\
  \ 模块来实现 GCP 资源的配置和管理。Ansible 提供了针对计算实例、网络、存储、负载均衡器等 GCP 服务的模块。这种集成允许用户在 Ansible\
  \ 剧本中定义 GCP 基础设施的预期状态，并执行它们以在 GCP 中创建、修改或删除资源。他们可以自动化诸如启动虚拟机、配置网络设置、管理存储、设置负载均衡器，甚至管理\
  \ GCP 项目和权限等任务。\n\n\n\n同样，Ansible 可以与 Azure 集成，实现 Azure 资源的自动化配置和管理。Ansible 为 Azure\
  \ 服务提供了模块，例如虚拟机、存储账户、虚拟网络、安全组等。用户可以在 Ansible playbooks 中定义 Azure 资源配置并执行它们，以实现 Azure\
  \ 基础设施自动化部署和管理。这种集成允许使用 Ansible 自动化创建虚拟机、配置网络、管理存储和实施安全策略等任务。\n\n两种情况下，Ansible 的声明式语言和自动化能力使用使用户定义基础设施的期望状态，并确保多个云资源之间的配置一致性。它有助于简化操作、减少手动工作并提高效率。此外，Ansible\
  \ 与 GCP 和 Azure 的集成可以与其他 Ansible 模块和功能相结合，实现跨整个 IT 基础设施的自动化和编排，包括本地系统、其他云平台和网络组件。\n\
  \n总而言，Ansible 与 Google Cloud Platform 和 Azure 的集成为用户提供了强大的自动化能力来管理和配置云资源，允许在这些云环境中实现高效且一致的基础设施管理。\n\
  \n# API 集成](#toc.xhtml_s309a)\n\n在组织工作流中集成 Ansible 通常需要与某些 RESTful API 服务交互，并使用该调用的数据来决定下一步做什么。我们已经知道如何在\
  \ playbook 中使用注册变量（第 2 章: Ansible 语言核心*，*Registered variables* 节）或 `set_fact`（第\
  \ 2 章: Ansible 语言核心*，*Temporary facts* 节）创建自定义的临时临时变量，以及如何使用 Ansible 过滤器（第 3 章:\
  \ Ansible 语言扩展*，*Ansible filter* 节）处理数据。我们可以使用 Ansible 的 `uri` 模块与任何 API 服务交互。它是\
  \ `ansible.builtin` 集合的一部分。使用此模块，我们可以执行 HTTP 请求和验证。\n\n`uri` 模块支持所有的 HTTP 方法 `GET`、`POST`、`PUT`、`DELETE`\
  \ 和 `HEAD`，用于与 HTTP 和 HTTPS 端交互。典型用例涵盖广泛，包括向 Web 服务器发送数据、与 Web 服务进行身份验证以及从 Web 服务检索数据。\n\
  \n这些是该模块最重要的参数：\n\n* `url:`: 指定要访问的 URL。该参数是强制性的，必须提供给模块。\n* `method:`: 指定要使用的 HTTP\
  \ 方法。该参数是可选的，默认为 `GET`。\n* `body:`: 指定 HTTP 请求的体。该参数是可选的，可向 Web 服务器发送数据。\n* `headers:`:\
  \ 指定 HTTP 请求中应包含的任何额外标头。该参数是可选的，可用于身份验证或传递自定义标头。\n* `timeout:`: 指定超时前等待响应的时间。该参数是可选的，默认值为\
  \ 30 秒。\n* `status_code:`: 指定预期的 HTTP 状态码。该参数是可选的，可验证 Web 服务器的响应是否符合预期。\n\n`uri`\
  \ 模块非常强大且灵活，适用于多种场景。它可以检查 Web 服务器的健康状况、从 API 检索数据或将文件上传到云存储服务。通过使用此模块，Ansible 自动化专家可以自动化涉及\
  \ Web 服务和 API 交互的任务。\n\n![](img/306.jpg)\n\n# GET 方法](#toc.xhtml_s310a)\n\nAnsible\
  \ 与 API 端交互以检索数据通常使用 `GET` HTTP 方法。我们的 浏览器也使用 `GET` HTTP 方法从网站检索 HTML 页面。以下 `api_get.yml`\
  \ Ansible 任务使用 `GET` 方法从 API 端点检索数据。\n\n```yaml\n- name: Get data from API\n  ansible.builtin.uri:\n\
  \    url: https://api.example.com/data\n    method: GET\n    register: api_response\n\
  ```\n\n我们使用 `url` 参数指定 API 端点 URL（`https://api.example.com/data`），`method` 参数指定要使用的\
  \ HTTP 方法（在此例下为 `GET`）。最后，`register` 参数允许我们将 API 响应存储在 `api_response` 变量中，供以后使用或通过过滤器处理。与\
  \ API 接口交互意味着通常需要处理 JSON 或 YAML 文件。\n\n用于检索 Reqres API 第二页用户的完整 `reqres_get.yml`\
  \ Ansible 代码如下：\n\n```yaml\n---\n- name: API GET method\n  hosts: all\n  vars:\n\
  \    server: \"https://reqres.in\"\n    endpoint: \"/api/users?page=2\"\n  tasks:\n\
  \    - name: Reqres list users\n      ansible.builtin.uri:\n        url: \"{{ server\
  \ }}{{ endpoint }}\"\n        method: GET\n        status_code: 200\n        timeout:\
  \ 30\n      register: result\n    - name: Reqres print\n      ansible.builtin.debug:\n\
  \        var: result.json.data\n```\n\n我们可以使用 `ansible-playbook` 命令执行代码：\n\n```bash\n\
  ansible-playbook reqres_get.yml\n```\n\n该代码产生了如下输出：\n\n```json\nTASK [Reqres print]\
  \ *****************************************************************************ok:\
  \ [server01.example.com] => {\n  \"result.json.data\": [\n    {\n      \"avatar\"\
  : \"https://reqres.in/img/faces/7-image.jpg\",\n      \"email\": \"michael.lawson@reqres.in\"\
  ,\n      \"first_name\": \"Michael\",\n      \"id\": 7,\n      \"last_name\": \"\
  Lawson\"\n    },\n    {\n      \"avatar\": \"https://reqres.in/img/faces/8-image.jpg\"\
  ,\n      \"email\": \"lindsay.ferguson@reqres.in\",\n      \"first_name\": \"Lindsay\"\
  ,\n      \"id\": 8,\n      \"last_name\": \"Ferguson\"\n    },\n    {\n      \"\
  avatar\": \"https://reqres.in/img/faces/9-image.jpg\",\n      \"email\": \"tobias.funke@reqres.in\"\
  ,\n      \"first_name\": \"Tobias\",\n      \"id\": 9,\n      \"last_name\": \"\
  Funke\"\n    },\n    {\n      \"avatar\": \"https://reqres.in/img/faces/10-image.jpg\"\
  ,\n      \"email\": \"byron.fields@reqres.in\",\n      \"first_name\": \"Byron\"\
  ,\n      \"id\": 10,\n      \"last_name\": \"Fields\"\n    },\n    {\n      \"avatar\"\
  : \"https://reqres.in/img/faces/11-image.jpg\",\n      \"email\": \"george.edwards@reqres.in\"\
  ,\n      \"first_name\": \"George\",\n      \"id\": 11,\n      \"last_name\": \"\
  Edwards\"\n    },\n    {\n      \"avatar\": \"https://reqres.in/img/faces/12-image.jpg\"\
  ,\n      \"email\": \"rachel.howell@reqres.in\",\n      \"first_name\": \"Rachel\"\
  ,\n      \"id\": 12,\n      \"last_name\": \"Howell\"\n    }\n  ]\n}\n```\n\n# JSON\
  \ 和 YAML](#toc.xhtml_s311a)\n\nAnsible 集成了 Ansible 过滤器，基于 Python 语言的 PyYAML 框架来处理这些文件格式。在使用标准的\
  \ Ansible 字符串解析 `starts_with` 和 `contains` Ansible 过滤器时，使用特定的 Ansible 过滤器来正确解析数据结构更有益。最常见的总结在下表\
  \ 8.2 中：\n\n| Ansible 过滤器 | 行为 |\n| :--- | :--- |\n| `to_json` | 将输入转换为 JSON 文：<br>*\
  \ `indent=3` 指定缩进<br>* `width=120` 支持长行<br>* `ensure_ascii=False` 保留 Unicode 格式\
  \ |\n| `to_yaml` | 将输入转换为 YAML 文档：<br>* `indent=3` 指定缩进<br>* `width=120` 支持长行 |\n\
  | `from_json` | 解析输入为 JSON 文档 |\n| `from_yaml` | 解析输入为 YAML 文档 |\n| `to_nice_json`\
  \ | 格式化 JSON 文档使其更易人类阅读 |\n| `to_nice_yaml` | 格式化 YAML 文档使其更易人类阅读 |\n| `from_yaml_all`\
  \ | 读取输入并解析多文档 YAML 字符串 |\n| `json_query` | 从复杂数据结构中选择单个元素或数据子集。它是 `community.general`\
  \ 集合的一部分。 |\n\n**表 8.2:** JSON 或 YAML Ansible 过滤器\n\n\n\n\n有时我们需要一个身份验证令牌（token）来访问某些网络服务。假设我们已经从\
  \ `access_token` 变量中保存了一个有效的 Bearer 令牌，并且我们想要与 API 交互。OAuth 2.0 规范使用 bearer token\
  \ 作为一种身份验证机制。以下 `api_get_bearer.yml` Ansible 任务使用 GET 方法和 bearer token 身份验证从 API\
  \ 端点格取数据：\n\n```yaml\n- name: Get data from API using Bearer Token\nansible.builtin.uri:\n\
  \  url: https://api.example.com/data\n  method: GET\n  headers:\n    Authorization:\
  \ \"Bearer {{ access_token }}\"\n  register: api_response\n```\n\n这段代码与 `api_get.yml`\
  \ Ansible 任务相似，但多了一个 `headers` 参数，用于指定我们在 HTTP 请求中所需的任何额外标头。在此例中，我们使用了身份验证令牌。\n\n\
  # POST 和 PUT 方法\n\n当我们需要向 API 服务发送数据时，我们使用 POST 或 PUT 方法。通常，我们使用这些方法向 API 录数据。POST\
  \ 和 PUT 的区别在于 PUT 请求是等等的。在设计良好的 API 中，多次调用同一个 PUT 请求会产生相同的结果。然而，反复调用 POST 请求会产生多次创建相同资源的副作用。通常，POST\
  \ 和 PUT 请求受 Bearer Token 的保护。\n\n以下 Ansible 任务使用 `resource_data` 作为输入并通过 POST 方法在\
  \ API 中创建一个新资源：\n\n```yaml\n- name: Create new resource in API\nansible.builtin.uri:\n\
  \  url: https://api.example.com/resource\n  method: POST\n  headers:\n    Authorization:\
  \ \"Bearer {{ access_token }}\"\n  body: \"{{ resource_data }}\"\n  register: api_response\n\
  ```\n\n请注意，我们必须指定 `method: POST` 参数以设置正确的方法与 API 交互。我们在 `body` 参数中指定了要通过 HTTP 请求发送的数据（`resource_data`\
  \ 变量的值）。\n\n以下 `reqres_token.yml` 与 Reqres API 交互，发送凭据并获取身份验证令牌。\n\n```yaml\n---\n\
  - name: API Bearer Token\n  hosts: all\n  vars:\n    server: \"https://reqres.in\"\
  \n    endpoint: \"/api/login\"\n  tasks:\n    - name: Reqres login\n      ansible.builtin.uri:\n\
  \        url: \"{{ server }}{{ endpoint }}\"\n        method: POST\n        body_format:\
  \ json\n        body: '{\n          \"email\": \"eve.holt@reqres.in\",\n       \
  \   \"password\": \"cityslicka\"\n        }'\n        status_code: 200\n       \
  \ timeout: 30\n      register: result\n    - name: Reqres token\n      ansible.builtin.debug:\n\
  \        var: result.json.token\n```\n\n我们可以使用 `ansible-playbook` 命令执行代码：\n\n```bash\n\
  ansible-playbook reqres_token.yml\n```\n\n该代码产生以下输出：\n\n```text\nTASK [ Reqres token]\
  \ *****************************************************************************ok:\
  \ [server01.example.com] => {\n  \"result.json.token\": \"QpwL5tke4Pnpja7X4\"\n\
  }\n```\n\n# PATCH 和 DELETE 方法\n\n我们可以使用 PATCH 方法更改网络服务或 API 上的数据。同样，我们可以使用 DELETE\
  \ 方法删除网络服务或 API 上的记录。我们可以通过设置相对参数使用 Ansible 的 “uri” 模块来实现自动化。代码与之前提供的示例相似。\n\n总之，“uri”\
  \ Ansible 模块是与 API 交互的强大工具。通过使用该模块，Ansible 自动化专家可以轻松实现涉及与 API 交互的任务，例如检索数据、创建或更新资源或触发事件。\n\
  \n# Zuul\n\nZuul 是项目闸系统（Project Gating System）。它类似于 CI 或 CD 系统，但重点在于测试代码仓库的未来状态。它包含了\
  \ Ansible 模块和插件，用于控制 Ansible 作业内容的执行。Zuul 为用户提供实时构建日志流，使用户可以查看正在进行的长时间作业。\n\nZuul\
  \ 是 OpenStack 社区开发的开源持续集成和交付（CI/CD）平台。它提供了一个灵活且可扩展的系统，用于软件项目的自动化测试、构建和部署。Zuul 设计用于处理跨多个仓库的复杂\
  \ CI/CD 工作流并支持与各种版本控制系统的集成。\n\nZuul 使用流水线（pipelines）系统来定义软件开发过程中的步骤，包括代码审查、测试和部署。它与\
  \ Jenkins、Gerrit 和 GitHub 等工具集成，促进协作并自动化软件交付过程。\n\nZuul 与 Ansible 之间的集成通过应启用的 Ansible\
  \ 回调插件（callback plugin）完成。所有作业都使用 `zuul.ansible.base.callback.zuul_stream` 回调插件运行，该插件将构建日志写入文件，以便\
  \ `zuul.lib.log_streamer.LogStreamer` 通过 finger 协议按需提供数据。\n\n# 编排 (Orchestration)\n\
  \nAnsible 编排是指使用 Ansible 系统化自动化的方式协调和管理多个任务及资源。它允许用户定义并执行复杂的工作流（即 playbook），这些流涉及多个系统、配置和依赖关系。\n\
  \n通过 Ansible 编排，用户可以定义基础设施和应用程序的状态，并让 Ansible 处理任务的自动化和编排来实现该状态。这包括配置服务器、配置网络设备、部署应用程序、管理服务等任务。\n\
  \nAnsible 编排的主要优势之一是其简单性。Playbooks 使用声明式语言 YAML 编写，使其易于理解、修改和维护。Playbooks 描述了所需的状态以及达到该状态所需的任务，实现了一致且重复的自动化。\n\
  \nAnsible 的编排能力还支持并行执行，允许多个任务在不同系统上同时运行。这提高了效率，并缩短了大规模部署或配置所需的时间。\n\n此外，Ansible\
  \ 提供了大量的模块和插件，可以在编排工作流中利用。这些模块使得与各种系统、服务和云提供者的交互成为可能，从而能够在不同的基础设施环境中编排任务。\n\n总的来说，Ansible\
  \ 编排使组织能够自动化复杂流程、简化操作、确保一致性并提高生产力。它简化了基础设施和应用程序的管理，加速了部署，并增强了 IT 环境的可扩展性和活性。\n\n\
  # Fork 与 serial\n\nAnsible 的 `fork` 和 `serial` 是管理基础设施的重要工具。取决于 Ansible Playbooks\
  \ 的用途。`fork` 有助于在多个主机上并行运行任务（默认值为 5）。而 `serial` 有助于在单个主机上顺序运行任务。在 Ansible 中，`fork`\
  \ 和 `serial` 的概念用于控制跨多个主机任务的并行执行。让我们理解每个概念：\n\n## Fork\n\nFork 决定了 Ansible 同时管理主机时将使用的并行进程或连接数。它指定了\
  \ Ansible 同时可以操作多少台主机。默认情况下，fork 值设置为 5，这意味着 Ansible 可以同时管理最多 5 个主机。我们可以在 Ansible\
  \ 配置文件（`ansible.cfg`）中调整 fork 值，或者使用 `--forks` 命令行选项进行调整。\n\n\n\n例如，如果我们有 10 台主机并将\
  \ `fork` 值设置为 5，Ansible 将同时在 5 台主机上并发执行任务。一旦这些任务完成，它将移动到下 5 台主机，依此类推。在处理大型主机清单或执行可以并行化的任务时，`fork`\
  \ 值 特别有用。\n\n# Serial（串行执行）\n\n`serial` 定义了 Ansible 在一组主机中并行管理的主机数量。它允许我们控制执行任务时的并行化程度。默认情况下，`serial`\
  \ 的值设置为 `all`，这意味着 Ansible 将并行管理所有主机。\n\n然而，在某些场景下，我们可能希望限制 Ansible 同时管理的主机数量。这对于需要更受控执行的任务（例如软件更新或敏感操作）非常有用。我们可以通过为\
  \ `serial` 参数指定一个数值，或使用模式匹配来选择特定的主机或组，来控制并发性。例如，如果我们有一个包含 10 台主机的组，并将 `serial` 值设置为\
  \ 2，Ansible 每次只对两台主机执行 playbook 中的任务。它将先在前两台主机上执行任务，然后移动到接两个，以此类推，直到所有主机都被处理。\n\n\
  通过结合使用 `fork` 和 `serial` 参数，我们可以细调 Ansible 在整个清单中执行任务的方式，根据我们的需求平衡并行性和控制力。\n\n#\
  \ Kubernetes\n\n在当今容器化应用快速发展且动态的世界中，高效地管理基础设施至关重要。Kubernetes 已经成为领先的容器编排平台，为应用程序的部署和扩展提供了强大的功能：\n\
  \n![](img/Figure-8.2.jpg)\n\n**图 8.2：** Kubernetes 图标\n\nKubernetes 是一个开源容器编排平台，用于自动化容器化应用的部署、扩展和管理。Kubernetes\
  \ 是一项强大的技术，但也可能很复杂。涉及到 Kubernetes 时，可以使用 Ansible 来自动化 Kubernetes 集群及其运行的应用程序的管理和部署。\n\
  \n以下是 Ansible 用于 Kubernetes 自动化的高级概述：\n\n*   **清单 (Inventory)：** 在 Kubernetes 的情况下，清单文件通常包含\
  \ localhost，我们可以使用环境变量定义 Kubernetes 集群的 API 访问（IP 地址或主机名）。验证通常通过 `kubectl` 命令行工具在本地处理。\n\
  *   **Playbooks：** 它是 Kubernetes 自动化的核心组件，包含了在 Kubernetes 集群上要执行的任务。\n*   **Kubernetes\
  \ 模块：** Ansible 提供了一组专门为与 Kubernetes 交互设计的模块。这些模块允许你对 Kubernetes 资源执行各种操作，例如创建和管理命名空间、部署、服务、pod\
  \ 等。它们抽象了底层的 API 调用，使得通过 Ansible 管理 Kubernetes 资源变得更容易。\n*   **任务执行：** Ansible 使用\
  \ SSH 或其他传输机制连接到目标系统，并执行 playbook 中定义的任务。对于 Kubernetes 自动化，Ansible 通常运行在控制机上，并使用\
  \ Kubernetes 模块与 Kubernetes 集群交互。\n*   **幂等操作 (Idempotent operations)：** Ansible\
  \ 确保操作是幂等的，这意味着如果任务已经执行且系统已处于所需状态，Ansible 将识别这一点并在后续运行中跳过该任务。这确保了多次运行 playbook 不会导致意外的更改或中断。\n\
  *   **与现有工具集成：** Ansible 可以与 CI/CD 流水线或基础设施管理工作流中的其他工具和过程集成。例如，你可以将 Docker 等容器构建工具或\
  \ Jenkins 等持续集成工具，结合 Ansible playbooks 使用。\n\n通过利用 Ansible 的自动化能力和 Kubernetes 模块，你可以简化部署和管理\
  \ Kubernetes 资源的过程。Ansible 允许你以声明的方式定义所需状态，并处理与 Kubernetes API 交互的复杂性，让你更容易管理你的\
  \ Kubernetes 基础设施和应用程序。OpenShift 是 Red Hat 创建的容器平台，它扩展了 Kubernetes，提供了用于企业级应用开发、部署和管理的附加功能。\n\
  \n所有的 Kubernetes 模块包含在 `kubernetes.core` Ansible collection 中，而 OpenShift 特定模块由\
  \ `redhat.openshift` collection 处理（可在 Automation Hub,*第 7 章：Ansible Enterprise*\
  \ 中的 Ansible automation platform 部分）。最重要的模块是 `kubernetes.core.k8s` Ansible 模块，它与控制平面交互以执行我们的自动化任务。\n\
  \n配置系统与 Kubernetes 交互的第一步是安装 `kubernetes.core` Ansible collection。对于自动化方法，请参考*第\
  \ 3 章：Ansible 语言扩展* 中的 Ansible collection 部分。我们可以使用 `ansible-galaxy` 命令手动安装：\n\n\
  ```bash\nansible-galaxy collection install kubernetes.core\n```\n\n可以使用以下命令验证安装成功：\n\
  \n```bash\nansible-galaxy collection list kubernetes.core\n```\n\n输出显示了 Ansible\
  \ collection 的当前版本：\n\n```\nCollection       Version\n--------------- -------\n\
  kubernetes.core 2.3.2\n```\n\n# Namespace（命名空间）\n\n创建和管理 Kubernetes 命名空间可能是一个繁琐且容易出错的任务。可以使用\
  \ Ansible 使用 `kubernetes.core` 模块自动化创建 Kubernetes 命名空间。Kubernetes 的基本构造之一是命名空间。命名空间为集群内的资源提供了逻辑隔离和隔离。通过\
  \ Ansible 的 `kubernetes.core.k8s` 模块，我们可以轻松地自动化创建 Kubernetes 对象，例如，命名空间。\n\n```yaml\n\
  ---\n- name: Kubernetes namespace present\n  hosts: all\n  tasks:\n    - name: Kubernetes\
  \ namespace present\n      kubernetes.core.k8s:\n        api_version: v1\n     \
  \   kind: Namespace\n        name: \"AutomateEverythingAnsible\"\n        state:\
  \ present\n```\n\nPlaybook 中 Kubernetes 任务的说明：\n\n*   任务中的 `name` 字段为任务本身提供描述性名称。\n\
  *   `kubernetes.core.k8s` 模块用于与 API 服务器交互。\n*   `api_version` 参数指定我们要管理的 Kubernetes\
  \ 资源的 API 版本，在本例中为 v1。\n*   `kind` 参数指定 Kubernetes 资源类型，为 `Namespace`。\n*   `name`\
  \ 参数指定要创建的命名空间名称，为 `AutomateEverythingAnsible`。\n*   `state` 字段指定命名空间的预期状态，在本例中为\
  \ `present`，以确保命名空间存在。而 `absent` 状态则删除该命名空间。\n\n通过运行此 playbook，Ansible 将连接到目标主机并与\
  \ Kubernetes API 服务器交互，如果指定的命名空间不存在，则创建它。\n\n我们可以使用 `kubectl` 命令行工具列出 Kubernetes\
  \ 集群中的所有命名空间来轻松验证执行成功：\n\n```bash\nkubectl get namespace | grep AutomateEverythingAnsible\n\
  ```\n\n此输出确认了命名空间的成功创建：\n\n```\nAutomateEverythingAnsible Active 4m\n```\n\n与 Kubernetes\
  \ 命名空间一样，我们可以自动化管理任何 Kubernetes 对象。自动化管理 Kubernetes 对象置的好处是：\n\n*   **一致性：** 自动化确保\
  \ Kubernetes 对象的创建在不同环境和集群之间遵循一致且标准的方法。\n\n\n\n\n\n*   **节省时间：** 手动创建命名空间非常耗时，特别在大规模部署中。自动化消除了手动干预的需求，允许团队专注于更关键的任务。\n\
  *   **减少错误：** 在执行重复任务时，人为错误很常见。自动化通过一致地应用 playbook 中定义的所需配置，最大限度地减少错误概率。\n*   **可扩展性：**\
  \ 自动化允许大规模创建命名空间，使其轻松管理多个环境或集群。\n\n# Pod\n\n以下 `k8s_pod.yml` Ansible playbook 侧重于部署\
  \ Kubernetes pod。Kubernetes pod 是 Kubernetes 对象模型中最小且最简单的单元，代表集群中运行进程的单个实例：\n\n\
  ```yaml\n---\n- name: Kubernetes pod deployment\nhosts: all\nvars:\n  my_namespace:\
  \ \"AutomateEverythingWithAnsible\"\ntasks:\n  - name: K8s namespace present\n \
  \   kubernetes.core.k8s:\n      api_version: v1\n      kind: Namespace\n      name:\
  \ \"{{ my_namespace }}\"\n      state: present\n  - name: K8s pod present\n    kubernetes.core.k8s:\n\
  \      namespace: \"{{ my_namespace }}\"\n      state: present\n      definition:\n\
  \        apiVersion: v1\n        kind: Pod\n        metadata:\n          name: nginx\n\
  \        spec:\n          containers:\n            - name: nginx\n             \
  \ image: nginx:latest\n              ports:\n                - containerPort: 80\n\
  ```\n\n该 playbook 从一个名为 `Kubernetes pod deployment` 的 play 开始，将在清单文件中指定的所有主机上执行。它包含一个变量部分（`vars`\
  \ 关键字下），其中定义了一个变量。\n\n playbook 中定义的变量：\n*   `my_namespace:`：指定部署 Kubernetes pod\
  \ 的命名空间。设置为 `AutomateEverythingWithAnsible`。\n\n在变量部分之后，`tasks` 关键字下定义了两个任务。每个任务使用\
  \ Ansible Kubernetes 模块 `kubernetes.core.k8s` 与 Kubernetes 资源交互。\n\n### 任务 1\n*\
  \   `name:`：指定任务名为 `K8s namespace present`。\n*   `kubernetes.core.k8s:`：使用 Kubernetes\
  \ 模块管理 Kubernetes 资源。\n*   `api_version:`：指定资源的 API 版本，在此情况下为 v1。\n*   `kind:`：指定要管理的资源类型，为\
  \ `Namespace`。\n*   `name:`：使用 `my_namespace` 变量的值指定命名空间的名称。\n*   `state:`：指定命名空间的期望状态，为\
  \ `present`（确保其存在）。\n\n### 任务 2\n*   `name:`：指定任务名为 `K8s pod present`。\n*   `kubernetes.core.k8s:`：使用\
  \ Kubernetes 模块管理 Kubernetes 资源。\n*   `namespace:`：使用 `my_namespace` 变量的值指定部署 pod\
  \ 的命名空间。\n*   `state:`：指定 pod 的期望状态，为 `present`（确保其存在）。\n*   `definition:`：以 YAML\
  \ 对象的形式提供 pod 的定义。\n*   `apiVersion:`：指定 pod 的 API 版本为 v1。\n*   `kind:`：指定资源类型，为\
  \ Pod。\n*   `metadata:`：指定 pod 的元数据，包括它的名称。\n*   `spec:`：指定 pod 的规格，包括它应该运行的容器。\n\
  *   `containers:`：指定 `pod` 内部的容器列表。\n*   `name:`：指定容器名称为 `nginx`。\n*   `image:`：使用\
  \ `nginx:latest` 镜像指定容器镜像。\n*   `ports:`：指定容器中暴露的端口。\n*   `containerPort:`：指定端口号\
  \ 80。\n\n总体而言，此 playbook 确保具有指定名称的 Kubernetes 命名空间存在，并在命名空间内部署 pod。该 pod 使用最新的 nginx\
  \ 镜像运行 nginx 容器并暴露 80 端口。\n\n# Ansible 配置设置\n\nAnsible 许多许多影响软件行为的配置设置。我们可以通过编辑当前项目中的\
  \ `ansible.cfg` 或 Ansible 控制器中的默认路径 `/etc/ansible/ansible.cfg` 来自定义许多 Ansible 行为。另一个选项是定义带有自定义值的终端环境变量。\n\
  \n以下命令将在屏幕上打印通过配置文件或环境变量设置的当前设置：\n\n```\nansible-config dump\n```\n\n表 8.3 汇总了最常用的\
  \ Ansible 配置设置：\n\n| |  (Section) | 键 (Key) | 环境变量 (Environment) |\n| :--- | :---\
  \ | :--- | :--- |\n| `role path` | `[defaults]` | `roles_path` | `ANSIBLE_ROLES_PATH`\
  \ |\n| `collection path` | `[defaults]` | `collections_paths` | `ANSIBLE_COLLECTIONS_PATHS`\
  \ |\n| `pipelining` | `[connection]` | `pipelining` | `ANSIBLE_PIPELINING` |\n|\
  \ `dynamic inventory` | `[inventory]` | `enable_plugins` | `ANSIBLE_INVENTORY_PLUGINS`\
  \ |\n| `keep remote files` | `[defaults]` | `keep_remote_files` | `ANSIBLE_KEEP_REMOTE_FILES`\
  \ |\n| `timeout` | `[defaults]` | `Timeout` | `ANSIBLE_TIMEOUT` |\n| `verbosity`\
  \ | `[defaults]` | `Verbosity` | `ANSIBLE_VERBOSITY` |\n| `interpreter python` |\
  \ `[defaults]` | `interpreter_python` | `ANSIBLE_PYTHON_INTERPRETER` |\n| `remote\
  \ temp` | `[defaults]` | `remote_tmp` | `ANSIBLE_REMOTE_TEMP` |\n| `paramiko/ssh`\
  \ | `[defaults]` | `Transport` | `DEFAULT_TRANSPORT` |\n| `host key check` | `[defaults]`\
  \ | `host_key_checking` | `HOST_KEY_CHECKING` |\n| `fact caching` | `[defaults]`\
  \ | `fact_caching` | `ANSIBLE_CACHE_PLUGIN` |\n| `fork` | `[defaults]` | `Forks`\
  \ | `ANSIBLE_FORKS` |\n| `ansible_managed` | `[defaults]` | `ansible_managed` |\
  \ `ANSIBLE_MANAGED` |\n\n**表 8.3：** Ansible 配置设置\n\n我们可以通过自定义配置设置来更改连接到目标主机时的 Ansible\
  \ 行为。有些人希望自定义角色或集合路径或更多与连接相关的行为。Ansible 连接到任何目标主机的默认行为是执行验证阶段并为 playbook 的每个任务生成一个文件。Ansible\
  \ 连接到远程服务器并使用相同的用户名执行代码。以下用例解释了如何自定义生成文件的默认临时目录，启用 Ansible 管道化以及在 SSH 或 Paramiko\
  \ 之间切换连接。\n\n# 自定义详细信息\n\n正如我们在第 2 章：Ansible 语言核心中的 Ansible playbook 章节以及第 4 章：Ansible\
  \ For Linux 中的执行期间打印文本中所学到的，我们默认以详细信息级别 0（零）执行 Ansible playbook。我们可以使用 `ansible-playbook`\
  \ 命令的 `-v` 参数或 `ansible.cfg` 文件自定义设置，以便每次执行时显示更详细的内容。例如，让我们将每次执行的详细信息值设置为级别 2（二）：\n\
  \n```ini\n[defaults]\nverbosity = 2\n```\n\n# 自定义角色路径\n\n我们可以自定义角色路径安装目录。默认搜索路径是\
  \ `~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles`。这意味着第一个搜索位置在当前用户主目录下的\
  \ `~/.ansible/roles`，其次是 `/usr/share/ansible/roles`，最后是 `/etc/ansible/roles`。对于大多数人来说，此设置使他们按照想要的方式使用\
  \ Ansible 角色。如果我们想自定义搜索路径，可以在 `ansible-galaxy` 命令行工具或 `ansible.cfg` 文件中指定 `collections_paths`\
  \ 参数（注：此处原文可能有误，通常角色路径为 roles_path）：\n\n```ini\n[defaults]\nroles_path = \"~/.ansible/roles\"\
  \n```\n\n# 自定义集合路径\n\n\n\n\n同样，我们可以自定义集合路径的安装目录。默认搜索路径为 `~/.ansible/collections:/usr/share/ansible/collections`。这意味着第一个搜索位置在当前用户主目录下的\
  \ `~/.ansible/collections`，其次是 `/usr/share/ansible/collections`。此设置为大多数人提供了了足够的灵活性。如果我们想自定义搜索路径，可以在\
  \ `ansible-galaxy` 命令行工具或 `ansible.cfg` 文件中指定 `roles_path` 参数：\n\n```\n[defaults]\n\
  collections_paths = \"~/.ansible/collections/ansible_collections\"\n```\n\n# 自定义用户名\n\
  \n我们可以在清单（inventory）、playbook 或 `ansible.cfg` 文件中使用变量 `ansible_user` 来指定连接账户的用户名。我们可以通过在清单、playbook\
  \ 中，或在全局的 `ansible.cfg` 文件中指定 `remote_user` 变量来更改运行用户。以下示例将任何连接的用户名设置为 `ansible`：\n\
  \n```\n[defaults]\nansible_user = ansible\n```\n\n# 自定义临时目录\n\nAnsible 的默认行为是：在成功连接后，Ansible\
  \ 会在连接用户的主目录下创建一个临时目录（如果其不存在），并将任务文件复制其中。如果 Ansible 无法创建该目录，或者该用户没有主目录，或者其主目录权限不允许其写入，我们可以通过\
  \ `ansible.cfg` 文件自定义临时目录的路径。例如，我们可以在 `/tmp` 目录下使用以下路径：\n\n```\n[defaults]\nremote_tmp\
  \ = /tmp/.ansible-${USER}/tmp\n```\n\n# 启用 Ansible 管道化 (Pipelining)\n\nAnsible 管道化直接在目标上执行\
  \ Ansible 模块，而无需预先传输文件，从而减少了网络操作。另一个令人的副作用是启用后性能的提升。默认情况下，Ansible 管道化是禁用的。我们可以使用环境变量\
  \ `ANSIBLE_PIPELINING=True` 或在 `ansible.cfg` 文件的 [connection] 或 [defaults] 部分设置\
  \ `pipelining=true` 键来启用它：\n\n```\n[defaults]\npipelining = true\n```\n\n# SSH 和\
  \ Paramiko\n\nParamiko 是一个实现 SSH 协议的 Python 原生库。由于它是原生 Python，因此不需要在系统 OpenSSH 之间进行上下文切换。缺点是\
  \ Paramiko 库并不适用于所有目标操作系统，且 ssh 选项有限。默认情况下，Ansible 采用 `smart` 选项，根据控制器的操作系统和 OpenSSH\
  \ 版本在 `ssh` 和 `paramiko` 之间切换。我们可以通过在 `ansible.cfg` 文件的 `[defaults]` 部分按如下设置传输键的值，强制仅使用\
  \ paramiko 库：\n\n```\n[defaults]\ntransport = paramiko\n```\n\n# 主机密钥检查\n\nSSH 主机密钥是一种防止主机被篡改的安全机制。主机密钥通常在首次安装或启动\
  \ OpenSSH 时生成。正如我们在 [第 4 章：适用于 Linux 的 Ansible] 的 *The OpenSSH configuration* 节中学到的，在主机名变化快且\
  \ IP 重用的快速基础设施中，我们可以通过在 `ansible.cfg` 配置中设置相应的参数来禁用主机密钥检查：\n\n```\n[defaults]\n\
  host_key_checking = false\n```\n\n# 事实缓存 (Fact caching)\n\n事实缓存可能有助于减少事实收集执行的时间。默认情况下，值\
  \ `memory` 意味着使用内存插件缓存当前执行的数据。常用的还有 `jsonfile` 和 `redis`，它们分别使用 JSON 文件或 Redis 服务器作为缓存机制。我们也可以定义缓存哪些值。正如我们在\
  \ [第 2 章：Ansible 语言核心] 的 *Ansible facts* 节中学到的。以下配置通常与本地 Redis 服务器配合用于事实缓存，通过在 `ansible.cfg`\
  \ 配置中设置相应的参数：\n\n```\n[defaults]\nfact_caching=redis\nfact_caching_timeout = 7200\n\
  fact_caching_connection = localhost:6379:0:password\nfact_caching = namespace.collection_name.cache_plugin_name\n\
  ```\n\n当与 Redis 服务器配合时，`fact_caching_connection` 参数按以下格式表示连接参数：`host:port:db:password`。\n\
  \n# Fork (进程)\n\n在 Ansible 中，fork 指 Ansible 用于同时管理主机的主使用的并行进程或连接数。它决定了 Ansible 同时能操作多少台主机。fork\
  \ 设置的默认值为 5。在 `ansible.cfg` 文件中修改 fork 的值后，Ansible 在管理主机时将使用指定的并行进程数。请重启任何运行中的 Ansible\
  \ 进程或 playbook 以使新的 fork 值生效。通过调整 fork 值，我们可以控制 Ansible 主机管理操作的并行级别，允许我们根据可用资源和执行任务的性质优化性能，从而影响系统资源（CPU、内存等）。我们可以通过在\
  \ `ansible.cfg` 文件的 `[defaults]` 部分按如下设置 forks 键的值来使用 10 个 forks：\n\n```\n[defaults]\n\
  forks = 10\n```\n\n# Ansible 管理 (Ansible managed)\n\n`ansible_managed` 变量是 Ansible\
  \ 中一个特殊变量，用于指示特定文件或模板由 Ansible 管理。该变量通常被设置为被托管文件内的一个注释。当 Ansible 执行文件复制或模板渲染（`ansible.builtin.template`\
  \ 和 `ansible.windows.win_template` 模块）等任务时，它会在目标系统上创建或修改文件。`ansible_managed` 变量充当标记，指示\
  \ Ansible 负责管理该文件。它有助于识别由 Ansible 创建或修改的文件，将其与系统上的其他文件区分开来。该变量通常设置在被托管文件开头的注释，可以有不同的值，但最常见的值是如\
  \ \"# Ansible managed\" 的字符串。该变量的具体值和格式没有标准，你可以根据需求或组织标准对其进行自定义。`ansible_managed`\
  \ 变量的存在允许系统管理员和其他用户快速识别由 Ansible 管理的文件。它对于排查故障、审计或在意识到 Ansible 影响的情况下对文件进行手动修改非常有用。它还有助于防止对由\
  \ Ansible 管理的文件进行意外修改，因为用户可以根据变量的存在轻松地识别它们。\n\n我们可以使用 `DEFAULT_MANAGED_STR` 环境变量或使用\
  \ `ansible.cfg` 文件 [defaults] 部分的 `ansible_managed` 键，如下所示将自定义文本设置为 `This file is\
  \ managed by Ansible, all changes will be lost. `：\n\n```\n[defaults]\nansible_managed\
  \ = This file is managed by Ansible, all changes will be lost.\n```\n\n# 最新趋势\n\n\
  在 IT 自动化领域，出现了两项突破性的进展，它们具有转变组织管理和简化其运营方式的潜力。Ansible Lightspeed 和 Event-Driven Ansible\
  \ 是先驱解决方案，它们引入了创新的自动化方法，彻底改变了任务的执行和编排方式。这些卓越的演进是在 Red Hat Summit 2023 的 Ansible\
  \ 自有分场中发布的。\n\n\n\n\n\nAnsible Lightspeed 由 IBM Watson Code Assistant 驱动，代表了一种专注于且定制的生成式\
  \ AI 服务。与市场上涌入的大量 AI 工具不同，Ansible Lightspeed 的目的并非帮助编写日常文档或邮件。它的首要目标是简化 Ansible\
  \ 内容（特别是 Ansible Playbooks）的创建，这些是 IT 自动化的基石。Ansible Lightspeed 专注于为开发者和自动化架构师提供卓越的体验，使他们能够更高效、更快速、更高质量且更少精力地编写\
  \ Ansible 内容。通过利用尖端的 AI 能力，这一变革性的解决方案旨在为组织节省宝的时间的时间资源，让领域专家能够专注于使用现有的自动化最佳实践来解决关键业务挑战。\n\
  \n与 Ansible Lightspeed 相辅成的是事件驱动 Ansible（Event-Driven Ansible）概念，这种方法旨在缩小传统自动化与实时事件驱动架构之间的差距。传统的，自动化是根据预定义的计划或触发器执行的，以确定的方式运行。然而，动态和快速变化的环境的兴起使得向事件驱动方法进行转变，即自动化对事件和触发器做出实时响应。事件驱动\
  \ Ansible 通过允许响应事件（如系统警报、基础设施更改或用户交互）来编排自动化任务，实现了范式转变。这种方法使组织能够在自动化工作流中获得更大的灵活性、响应能力和适应性，确保操作在需要时精确触发，从而提高备运效率并减少人工干预。\n\
  \n我们将探索 Ansible Lightspeed 和事件驱动 Ansible 的卓越能力，深入研究它们的独特特性、优势以及它们重塑 IT 自动化格局的方式。我们将深入探讨\
  \ Ansible Lightspeed 如何简化 Ansible 内容的创建，通过 AI 生成的自动化代码建议赋能开发者。此外，我们将揭示事件驱动 Ansible\
  \ 的原理和优势，展示其对实时事件做出动态响应并触发自动化任务的能力。这些进步共同承诺将自动化实践推向新的高度，为组织提供前所未有的效率、灵活性和适应性。\n\n\
  # 事件驱动 Ansible\n\n事件驱动 Ansible 是一种创新的自动化方法，允许在监控环境中更快地解决问题并实现更大的自动化。它利用规则簿（rulebooks），规则簿以\
  \ YAML 格式定义事件源、条件和操作。`ansible-rulebook` 是用于运行规则簿的 CLI 组件。事件驱动 Ansible 通过自动化过程和尽可能地减少人工操作步骤，简化了故障排除和信息收集。它提供了更快的平均解决时间（Mean-Time-To-Resolution），并为环境的自动化观测提供了可能。`ansible-rulebook`\
  \ 易于学习和使用，还有一个名为 `EDA server` 的图形用户界面可进一步简化操作。\n\n要开始使用驱动 Ansible，请遵循以下步骤：\n\n1a.\
  \ 使用 Ansible Galaxy 集合安装 `ansible-rulebook`。\n\n对于 macOS 和 Fedora，运行以下命令：\n\n```bash\n\
  pip install ansible-rulebook\nansible-galaxy collection install ansible.eda\n```\n\
  \n![](img/326.jpg)\n\n1. 或者，我们可以用 pip 安装 `ansible-rulebook`，然后安装 `ansible.eda` 集合。此方法需要带有\
  \ `openjdk` 的 Java 11+。\n\n   如果我们想通过 GitHub 仓库为 `ansible-rulebook` 贡献代码，请设置开发环境并构建测试容器。\n\
  \n2. 构建一个定义事件源、条件和操作的规则簿。\n\n   规则簿以 YAML 格式创建，类似于传统的 Ansible Playbooks。以下 `eda.yml`\
  \ 规则簿监听 Webhook 上的事件，并在满足特定条件时触发操作：\n\n```yaml\n---\n- name: Receive webhook events\n\
  \  hosts: all\n  sources:\n  - ansible.eda.webhook:\n      host: 0.0.0.0\n     \
  \ port: 8000\n  rules:\n    - name: Event\n      condition: event.payload.message\
  \ == \"Automate Everything with Ansible \"\n      action:\n        run_playbook:\n\
  \          name: playbook.yml\n```\n\n在此示例中，规则簿使用了 `ansible.eda` 集合中的 webhook 源插件，并查找来自\
  \ webhook 的包含字符串 `Automate Everything with Ansible` 的消息负载。如果满足了此条件，将触发定义的操作（运行名为\
  \ `playbook.yml` 的 playbook）。\n\n一旦构建了规则簿，我们就可以使用 `ansible-rulebook` 运行它并等待事件的发生。使用以下命令：\n\
  \n```bash\nansible-rulebook -r eda.yml -i inventory --verbose\n```\n\n该命令指定了要使用的规则簿\
  \ (`eda.yml`) 和清单文件 (`inventory.yml`)。`--verbose` 选项提供了详细输出。\n\n当 `ansible-rulebook`\
  \ 运行时，它将等待事件并与规则簿中定义的条件进行匹配。如果触发了 webhook 事件，但负载不匹配条件，它将继续等待下一个事件。一旦负载匹配条件，将触发指定的操作。\n\
  \n为了模拟一个具有正确负载的 webhook 事件，我们可以使用以下命令：\n\n```bash\ncurl -H 'Content-Type: application/json'\
  \ -d \"{\\\"message\\\": \\\"Automate Everything with Ansible\\\"}\" 127.0.0.1:8000/endpoint\n\
  ```\n\n当负载匹配条件时，`ansible-rulebook` 将执行该操作（例如，运行 playbook），然后继续等待新事件，如图 8.3 所示：\n\
  \n![](img/Figure-8.3.jpg)\n\n**图 8.3：** Ansible 事件驱动运行\n\n事件驱动 Ansible 提供了在监控环境中更快解决问题和更大自动化的潜力。它通过提供一种易于学习和使用的解决方案简化了工程师的生活。此外，图形用户界面\
  \ EDA server 进一步简化了这一过程。\n\n# Ansible Lightspeed\n\n生成式 AI 在当今的技术领域已无处不在，提供了许多令人兴奋的工具和应用。然而，集成了\
  \ IBM Watson Code Assistant 的 Ansible Lightspeed 以其独特的方法而脱颖而出。虽然有许多用于写论文或邮件任务的 AI\
  \ 工具，但 Ansible Lightspeed 是为 IT 自动化专门定制的，专注于提供定制的生成式 AI 体验，为组织节省时间和金钱。\n\n与通用模型不同，Ansible\
  \ Lightspeed 的超能力在于其对 Ansible 内容开发的坚定关注。其最终目标是简化 Ansible Playbooks 的创建，赋能自动化架构师和开发者生产更快、更好、质量更高的内容。通过减少在编写\
  \ playbook 和领域主题上花费的时间，专家们可以专注于使用现有的自动化最佳实践来应对他们最重大的业务挑战。\n\n用户与 Ansible Lightspeed\
  \ 技术之间的交互通过 Ansible VSCode 插件完成，这是 Visual Studio Code 的一个扩展，将 Ansible 功能集成到这一流行的代码编辑器中，提供语法高亮、代码补全和调试支持等功能，以增强使用\
  \ Ansible 的开发体验。Ansible Lightspeed 会根据代码上下文和任务名称为用户提供预测，如图 8.4 所示。\n\n\n\n\n结合 IBM\
  \ Watson Code Assistant 的 Ansible Lightspeed 标志着 IT 自动化的范式转变。通过将生成式 AI 的力量与定制方法相结合，Ansible\
  \ Lightspeed 赋能组织加速自动化计划、优化资源利用并实现更高的运营效率。随着自动化格局的不断演进，Ansible Lightspeed 与事件驱动\
  \ Ansible（Event-Driven Ansible）的集成为未来带来了无缝且变革性的自动化体验承诺。\n\n![](img/Figure-8.4.jpg)\n\
  \n**图 8.4:** Ansible Lightspeed 代码助手\n\n# 结论\n\nAnsible 是一个极佳且强大的自动化平台，它通过自动化任务、配置和应用程序部署来简化并加速\
  \ IT 运行。许多开源项目和公司创建了以 Ansible 为基础的产品，整合并简化了对现代混合基础设施的管理。我们探索了云计算的集成，特别是亚马逊云服务（Amazon\
  \ Web Services），并使用 Kubernetes 技术来提升我们的云原生应用部署。拥抱自动化的团队在许多指标上始终优于自动化程度较低的对手。天空没有极限，关键术汇是创新、加速和自动化！\n\
  \n# 记忆点\n\n*   Ansible 可以集成许多产品和技术，以实现 DevOps 工具链、云提供商和编排技术。\n*   Ansible 事件驱动和\
  \ Ansible Lightspeed 是最新的技术。\n*   我们可以使用配置设置和 `ansible.cfg` 文件扩展并自定义许多 Ansible 行为。\n\
  \n# 单选题\n\n1. 使用 Ansible 动态清单的最佳位置是哪里？\n    1. 静态虚拟机\n    2. 静态本地机器\n    3. 静态清单场景\n\
  \    4. 云计算和容器\n2. 默认的 fork（分叉）值是多少？\n    1. 1\n    2. 5\n    3. 10\n    4. 100\n\
  3. 将 Ansible 与 Web 服务集成最佳方式是什么？\n    1. 亚马逊云服务 (Amazon Web Services)\n    2. API\
  \ 集成\n    3. Kubernetes\n    4. VMware\n4. 我们如何启用 paramiko 连接库？\n    1. 在 `ansible.cfg`\
  \ 文件中设置 `transport` 值\n    2. 用 paramiko 替换 ssh 服务\n    3. 执行 `paramiko.yml` Ansible\
  \ playbook\n    4. 在 Ansible 清单中将 `ansible_connection` 设置为 `paramiko`\n\n# 答案\n\n\
  1. **D**\n2. **B**\n3. **B**\n4. **A**\n\n# 问题\n\n1. 什么是 Ansible 回调插件（callback plugin）？\n\
  2. 在系统中启用 Ansible Pipeline（Pipelining）有什么影响？\n3. fork 和 serial 语句之间有什么区别？\n4. 如何将\
  \ Ansible 与 Kubernetes 集成？\n5. `ansible.cfg` 文件最重要的参数有哪些？\n6. 使用事件驱动 Ansible（Event-driven\
  \ Ansible）的主要优势是什么？\n\n# 关键术语\n\n*   **回调插件 (Callback plugins):** 允许在 playbook 执行期间对输出进行自定义处理和格式化。\n\
  *   **Web 服务 (Web service):** 允许通过互联网在不同应用程序之间进行通信和数据交换的软件系统。\n*   **动态清单 (Dynamic\
  \ inventory):** 允许根据云提供商或自定义脚本等外部源自动生成 Ansible 清单。\n*   AWS（Amazon Services）是一个云计算平台，为构建、部署和管理应用程序及基础设施提供广泛的按需服务和资源。\n\
  *   Kubernetes 是一个强大的容器编排平台，可以使用 Ansible 进行无缝管理和自动化，实现容器化应用程序的高效部署、扩展和管理。\n\n# 索引\n\
