  \ `ansible_winrm_transport` 变量的作用是什么？\n3. Ansible `win_copy` 模块的两个不同用途是什么？\n4. 我们如何检查\
  \ Windows 目标主机上是否存在文件或目录？\n5. Chocolatey 开源网络存档的目的是什么？\n6. 什么时候必须使用 Ansible 的“command”和“shell”模块？\n\
  \n# 关键术语\n\n* **WinRM**: WinRM 代表 Windows Remote Management（Windows 远程管理），是一种允许远程管理\
  \ Windows 机器的协议。它实现了 Windows 机器之间的网络通信，并提供了远程执行命令、访问文件和执行其他管理任务的安全方法。\n* **PowerShell**:\
  \ PowerShell 是一种命令行壳和脚本语言，设计用于自动化 Windows 操作系统上的管理任务。\n* **Chocolatey**: Chocolatey\
  \ 是一个 Windows 的包管理器，可自动化软件包的安装和管理。更多信息请参阅 [`chocolatey.org`](https://chocolatey.org)。\n\
  * **WSUS**: WSUS（Windows Server 内部更新服务）是 Windows Server 中的一种服务器角色，允许在网络内集中管理和发布\
  \ Windows 更新和补丁。\n* **Windows Registry**: Windows 注册表是一个层次结构数据库，存储了 Windows 操作系统及其安装应用程序的配置设置和选项。\n\
  \n________________\n\n[1] [`chocolatey.org`](https://chocolatey.org)\n[2] [`github.com/ansible-collections/community.windows/issues/89`](https://github.com/ansible-collections/community.windows/issues/89)\n\
  \n# 第 6 章\n\n# Ansible 故障排除\n\n## 引言\n\n本章概述了最常见的 Ansible 问题。在本章结束时，我们将学习故障排除的步骤、最常见错误的根源以及一些解决方案的实际示例。我们将熟练检查\
  \ playbook 语法、使用详细（verbose）和调试（debug）模式、检查拼写错误、验证版本兼容性、检查依赖项以及使用 Ansible 调试模块。通过遵循这些步骤，我们可以解决\
  \ Ansible 的常见问题，并确保 IT 基础设施管理任务的高效自动化。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n* Ansible 故障排除\n\
  * Ansible 调试\n* Ansible 语法\n* 故障排除工具\n* Ansible 连接\n* Ansible vault\n* Ansible 模块\n\
  * Ansible 角色 (role)\n* Ansible 集合 (collection)\n* Windows Ansible\n\n# Ansible 故障排除\n\
  \n在 Ansible 中，与其他计算机编程语言和软件工具一样，可能会出现问题。在本章中，我们将学习最常用的 Ansible 故障排除步骤和技术，用这些技术解决可能出现的任何问题。\n\
  \n**第一步：检查 Ansible 文档**\n\nAnsible 文档提供了详尽的故障排除提示和技巧。首先查阅文档始终是一个好主意，查看是否存在可能导致我们问题的已知问题或限制。如果我们无法在文档中找到解决方案，请进入下一步。\n\
  \n**第二步：验证清单 (inventory)**\n\n清单文件是 Ansible 基础设施的关键组成部分。确保清单文件定义正确且所有主机都是可达的。如果在特定主机上遇到问题，请确保该主机正在运行且\
  \ SSH 密钥认证已正确设置。\n\n**第三步：检查连通性**\n\n验证我们是否可以从 Ansible 控制节点连接到目标主机。常见的连接问题包括防火墙规则、网络问题或\
  \ SSH 密钥认证问题。使用 `ping` 命令验证与主机的连通性。如果仍然有问题，请尝试使用不同的 SSH 端口或建立 SSH 隧道。\n\n**第四步：验证\
  \ playbook 语法**\n\n通过在检查模式（check mode）下运行 playbook 来确保语法正确。此模式不会对系统进行任何更改，只检查语法。使用带有\
  \ `--check` 标志的 `ansible-playbook` 命令。\n\n**第五步：使用详细模式 (verbose)**\n\n在执行 Ansible\
  \ playbook 时，使用详细标志（`-v`）来获取更详细的输出。这有助于识别错误发生的位置。通过在 `ansible-playbook` 命令中添加更多的\
  \ `-v` 参数来增加详细程度。例如，使用 `-vvv` 进行三级详细输出。完整的级别总结在表 6.1 中。请第 2 章 Ansible Language Core\
  \ 中的 Ansible Playbook 章节获取完整的 Ansible 详细级别：\n\n| 级别 | 描述 | ansible-playbook 参数 |\n\
  | :--- | :--- | :--- |\n| 0 | 普通 | 无参数 |\n| 1 | 详细 | `-v` |\n| 2 | 更详细 | `-vv` |\n\
  | 3 | 调试 | `-vvv` |\n| 4 | 连接调试 | `-vvvv` |\n\n表 6.1：Ansible 详细级别\n\n**第六步：调试模式\
  \ (debug)**\n\n调试模式是三级详细（`-vvv`），提供了更多的输出。使用此模式获取 playbook 执行期间的更多信息。我们可以使用 `-vvv`\
  \ 标志开启调试详细模式。\n\n**第七步：检查拼写错误**\n\n有时，错误是由 playbook、清单文件或其他配置文件中的简单拼写错误引起的。仔细检查文件以查找任何拼写错误或语法错误。使用带有语法高亮的文本编辑器可以更容易发现错误。\n\
  \n**第八步：检查版本兼容性**\n\n确保 Ansible 版本与我们管理的操作系统或软件版本兼容。某些模块可能不支持旧版本的软件或操作系统。使用 `ansible\
  \ --version` 命令检查我们正在运行的 Ansible 版本。\n\n**第九步：检查依赖项**\n\n\n\n\n确保目标主机上已安装任何必要的依赖项或先决条件。如果缺少所需的软件包或库，Ansible\
  \ 将无法执行任务。请检查正在使用的特定模块的文档，查看是否需要任何依赖项。有关 Python 库依赖的更多信息，请参阅 `Ansible Collection`\
  \ 部分。\n\n## 步骤 10：使用 Ansible debug 模块\n\nAnsible 的“debug”模块可用于在 playbook 执行期间输出变量或其他信息。使用此模块可以排查变量、模板或其他动态内容的问题。我们可以通过将该模块添加到\
  \ playbook 中来使用调试模块。\n\n我们探索了一些常用的 Ansible 故障排除步骤和技术，可以使用这些技术来解决可能出现的任何问题。记住始终始终从检查文档开始，验证清单和连接性，使用详细模式（verbose）和调试模式，检查拼写错误以及验证版本兼容性。\n\
  \n# Ansible 调试\n\nAnsible 具有“check”模式（检查模式），允许用户运行 playbook 而不会实际对目标系统进行任何更改。请参阅\
  \ `[第 2 章：Ansible 语言核心]` 中的 `Check and Debugging` 章节，了解如何执行干运行或增加调试信息的详细程度。\n\n\
  在检查模式下运行时，Ansible 将遍历 playbook 并照常执行所有任务，但它不会执行任何以某种方式修改系统的任务。相反，Ansible 将向用户报告如果正常运行\
  \ playbook，将会发生哪些更改。当用户想在运行 playbook 之前验证会对目标系统进行哪些更改时，使用检查模式将非常有帮助。这允许用户在对系统进行任何更改之前捕获潜在的问题或错误。此外，检查模式可以通过在实际执行之前提供\
  \ playbook 的干运行，帮助用户避免对目标系统产生意外的更改。要在检查模式下运行 playbook，用户可以在其 Ansible 命令中添加 `--check`\
  \ 参数：\n\n```\nansible-playbook --check playbook.yml\n```\n\n这将以检查模式运行 playbook，并报告如果正常运行运行\
  \ playbook 将会发生的任何更改。用户随后可以查看输出，以确保在正常运行 playbook 之前这些更改是预期且理想的。\n\n需要注意的是，检查模式并不保证\
  \ playbook 在正常运行时会成功执行。可能会有某些条件或依赖项仅在实际执行期间出现，因此用户在生产环境中运行之前，仍应彻底测试他们的 playbook。\n\
  \n以下 `changeip.yml` Ansible playbook 用于设置 Linux 目标机器的 IP 地址和子网掩码：\n\n```yaml\n---\n\
  - name: Change IP Address of Remote Host\nhosts: all\nbecome: true\nvars:\n  new_ip_address:\
  \ 192.168.1.100\n  netmask: 255.255.255.0\ntasks:\n  - name: Update Network Configuration\
  \ File\n    ansible.builtin.lineinfile:\n      path: /etc/network/interfaces\n \
  \     regexp: '^address'\n      line: 'address {{ new_ip_address }}'\n    notify:\n\
  \      - Restart Network Service\n  - name: Update Netmask Configuration File\n\
  \    ansible.builtin.lineinfile:\n      path: /etc/network/interfaces\n      regexp:\
  \ '^netmask'\n      line: 'netmask {{ netmask }}'\n    notify:\n      - Restart\
  \ Network Service\nhandlers:\n  - name: Restart Network Service\n    ansible.builtin.service:\n\
  \      name: networking\n      state: restarted\n```\n\n我们通过向 `ansible-playbook`\
  \ 命令添加 `--check` 参数来使用检查模式。我们可以使用 `ansible-playbook` 命令并添加 `--check` 参数来执行 `changeip.yml`\
  \ Ansible Playbook。\n\n完整命令如下：\n\n```\nansible-playbook --check changeip.yml\n```\n\
  \n执行 Ansible playbook `shell.yml` 的输出如下所示：\n\n```\nPLAY [Change IP Address of Remote\
  \ Host] ***********************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************ok:\
  \ [demo.example.com]\nTASK [Update Network Configuration File] **********************************************************************\n\
  changed: [demo.example.com]\nTASK [Update Netmask Configuration File] **********************************************************************\n\
  changed: [demo.example.com]\nRUNNING HANDLER [Restart Network Service] *********************************************************************\n\
  changed: [demo.example.com]\nPLAY RECAP *****************************************************************************demo.example.com\
  \           ok=4    changed=3   unreachable=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n我们可以看到，执行的输出看起来是正常执行，但目标主机上没有执行任何更改。使用检查模式，我们可以在不对目标节点执行任何操作的情况下解析\
  \ Ansible playbook。\n\n# Ansible 语法\n\nAnsible 语法设计为便于人类阅读、简单且易理解。Ansible 语法的基础构建单元是\
  \ YAML 文件，其中包含了要在目标系统上执行的任务列表。总的来说，Ansible 语法旨在易于阅读、编写和理解，即使是非技术用户也是如此。YAML 文件、模块、变量、条件、循环和角使用使用管理复杂的\
  \ IT 基础设施和自动化重复任务提供了一个灵活且强大的框架。\n\n以下是用户可能会遇到的一些常见 Ansible 语法错误及其解决方法：\n\n1. **YAML\
  \ 语法错误：** Ansible 使用 YAML 语法定义 playbook 和任务。用户可能会遇到语法错误，如缺少或额外的逗号、缩进错误或括号不匹配。要修复这些错误，用户应仔细检查\
  \ YAML 语法，并确保所有的括号、逗号和缩进都是正确的。\n2. **未定义的变量：** 如果变量未定义或拼写错误，Ansible 将无法找到它并可能报错。用户应确保所有变量都定义正确，并且变量名拼写正确。\n\
  3. **缺少模块：** Ansible 模块是在远程系统上执行各种任务的预写脚本。如果模块未安装或拼写错误，Ansible 将无法找到它并可能报错。用户应确保所有所需的模块都已安装，并且模块名拼写正确。\n\
  4. **缩进错误：** Ansible 使用缩进来定义任务和块的层级。如果缩进错误，Ansible 将无法正确解析 playbook 并可能报错。用户应确保所有任务和块都正确地缩进。\n\
  5. **缺少引号：** 如果字符串未包含在引号中，Ansible 可能会将其解释为变量或命令并报错。用户应确保所有字符串都正确地包含在引号中。\n6. **缺少或额外的括号：**\
  \ 如果缺少或额外的括号，Ansible 可能无法正确解析 playbook 并可能报错。用户应确保所有括号都正确匹配且平衡。\n7. **条件语句中的无效语法：**\
  \ Ansible 使用简单的 if/then/else 语法来定义条件。如果语法错误，Ansible 可能无法正确解析条件并可能报错。用户应确保所有条件的语法都是正确的。\n\
  \n通常，为了避免 Ansible 中的语法错误，用户应该仔细检查其 playbook 的语法，并确保所有变量、模块、任务和块都经过了正确的定义和缩进。此外，用户在生产环境中运行\
  \ playbook 之前，仍应彻底测试。\n\n## 故障排除工具\n\n\n\n\nAnsible 拥有许多调查工具，可以帮助我们加速工作流，避免常见的陷阱并遵循最佳实践。\n\
  \nAnsible 语法检查、YAML linter 和 Ansible linter 的组合创建了一支强大的军队，用于排查 Ansible Playbook\
  \ 的问题。\n\n## 错误的 playbook\n\n我们将通过一些代码，探索使用 Ansible 语法检查、YAML linter 和 Ansible linter\
  \ 工具进行的所有排查过程以及我们可以获取的信息。\n\n以下 Ansible `errors.yml` Playbook 包含了一些需要进一步调查的常见错误：\n\
  \n```yaml\n---\n- name: Troubleshooting example\nhosts: all\nvars:\n  servers:\n\
  \    host01:\n      ip: 192.168.1.11\n      type: large\ntasks:\n  - name: print\
  \ a fact\n    ansible.builtin.debug:\n      var: ansible_facts['architecture']\n\
  \  - name: Latest apache2 package\n    ansible.builtin.apt:\n      name: apache2\n\
  \      state: latest\n      update_cache: true\n  - name: Only large machines\n\
  \    ansible.builtin.debug:\n      msg: \"{{ servers.values() | selectattr('type',\
  \ 'eq', 'large') | map(attribute='ip') | join(',') }}\"\n```\n\n正如我们可能观察到的，第一个任务“print\
  \ a fact”在 YAML 文档中没有正确对齐。第二个任务在同一层级有两个“name”语句，具有两种不同的含义。第三个任务的文本长度超过了标准的 80 个字符。\n\
  \n我们将使用三个命令行工具来识别并修正每个错误。\n\n## 语法检查\n\n我们使用自动工具的调查从简单的语法检查开始。我们可以使用 `ansible-playbook`\
  \ 命令的 `--syntax-check` 参数在不执行 playbook 的情况下对其进行语法检查：\n\n```bash\nansible-playbook\
  \ --syntax-check errors.yml\n```\n\n执行结果在屏幕上返回以下错误，以及返回码 4（四）：\n\n```\nERROR! We\
  \ were unable to read either as JSON or YAML, these are the errors we got from each:\n\
  JSON: Expecting value: line 1 column 1 (char 0)\nSyntax Error while loading YAML.\n\
  did not find expected key\n```\n\n错误似乎出现在 `errors.yml` 的第 15 行第 5 列，但可能根据具体的语法问题出现在文件的其他位置。\n\
  \n引起故障的行似乎是：\n\n```yaml\n- name: Latest apache2 package\n^ here\n```\n\n![](img/Figure-6.1.jpg)\n\
  \n**图 6.1:** 语法检查输出\n\n`ansible-playbook` 命令的彩色输出也显示在 图 6.1 中。错误信息为排查和调试源代码第 15\
  \ 行指明了正确的方向，但我们还需要进一步的调查和修正。\n\n当我们拥有训练有过的眼光时，很容易发现并修正其中的一些常见错误。为了获得更好的体验，可以使用一些命令行实用来辅助我们的开发之旅。\n\
  \n命令行工具 `yamllint` 和 `ansible-lint` 对于识别代码错误和在自动化之旅中节省时间非常有帮助。\n\n## YAML linter\n\
  \n`yamllint` 是一个用于所有 YAML 文件的命令行静态代码分析工具。该软件的目的是“YAML 文件的 linter”，根据 MIT 和开源 GPL-3.0\
  \ 许可证发布。在编写此本书时，最新版本是稳定的 1.30.0 版本。依赖要求是较新版本的 Python 3 和 `pyyaml` Python 库。更多信息请参考官方网站：[`github.com/adrienverge/yamllint`](https://github.com/adrienverge/yamllint)。安装过程非常简单，因为我们只需要在最新的系统中安装额外的\
  \ `yamllint`。当系统中未安装该工具时，会获得以下错误消息：\n\n```\ncommand not found: yamllint\n```\n\n\
  例如，我们可以在任何“Red Hat”类 Linux 发行版中使用 yum 或 DNF 软件包管理器安装 `yamllint` 包：\n\n```bash\n\
  dnf install yamllint\n```\n\n而在任何“Debian”类 Linux 发行版中，我们需要使用 APT 软件包管理器：\n\n```bash\n\
  apt install yamllint\n```\n\n我们可以在当前项目目录下使用命令执行 `yamllint`：\n\n```bash\nyamllint\
  \ .\n```\n\n输出显示了根据 Ansible 最佳实践的行错误，以及返回码 1（一）：\n\n```\n./errors.yml\n11:3    \
  \  error     wrong indentation: expected 4 but found 2  (indentation)\n15:5    \
  \  error     syntax error: expected <block end>, but found '-' (syntax)\n23:81 \
  \  error    line too long (107 > 80 characters)  (line-length)\n```\n\n![](img/Figure-6.2.jpg)\n\
  \n**图 6.2:** 的 yamlint 输出\n\n`yamllint` 命令的彩色输出也显示在 图 6.2 中：\n\n## Ansible linter\n\
  \n`ansible-lint` 是一个针对 Ansible 语言的命令行静态代码分析工具。该软件的目的是“检查 ansible playbooks 的实践和行为”，根据开源\
  \ GPL-3.0 许可证发布。在编写此本书时，最新版本是稳定的 6.14.3 版本。依赖要求是较新版本的 Python 3 以及 Python 库 `pyyaml`、`pygments`\
  \ 以及工具 `yamllint` 和 `ansible`。更多信息请参考官方网站：[`ansible-lint.readthedocs.io/`](https://ansible-lint.readthedocs.io/)。安装过程非常简单，因为我们只需要在最新的系统中安装额外的\
  \ `ansible-lint`。当系统中未安装该工具时，会获得以下错误消息：\n\n```\ncommand not found: ansible-lint\n\
  ```\n\n例如，我们可以在任何“Red Hat”类 Linux 发行版中使用 yum 或 DNF 软件包管理器安装 `ansible-lint` 包：\n\n\
  ```bash\ndnf install ansible-lint\n```\n\n而在任何“Debian”类 Linux 发行版中，我们需要使用“APT”软件包管理器。\n\
  \n```bash\napt install ansible-lint\n```\n\n我们可以在当前项目目录下使用命令执行 `ansible-lint`：\n\
  \n```bash\nansible-lint errors.yml\n```\n\n输出显示了根据 Ansible 最佳实践的行错误，以及返回码 2（二）：\n\
  \n```\nload-failure: Failed to load YAML file\nerrors.yml:1 while parsing a block\
  \ mapping\nin \"<unicode string>\", line 11, column 5\ndid not find expected key\n\
  in \"<unicode string>\", line 15, column 5\nRule Violation Summary\ncount tag  \
  \         profile rule associated tags\n1 load-failure min      core, unskippable\n\
  Failed after : 1 failure(s), 0 warning(s) on 1 files.\n```\n\n![](img/Figure-6.3.jpg)\n\
  \n**图 6.3:** 的 ansible-lint 输出\n\n`ansible-lint` 命令的彩色输出也显示在 图 6.3 中：\n\n```\nansible-lint\
  \ fix.yml\nWARNING  Listing 2 violation(s) that are fatal\nname[casing]: All names\
  \ should start with an uppercase letter.\nfix.yml:10 Task/Handler: print a fact\n\
  package-latest: Package installs should not use latest.\nfix.yml:14 Task/Handler:\
  \ Latest apache2 package\nRead documentation for instructions on how to ignore specific\
  \ rule violations.\nRule Violation Summary\ncount tag           profile  rule associated\
  \ tags\n1 name[casing]   moderate idiom\n1 package-latest safety  idempotency\n\
  Failed after basic profile, 1/5 star rating: 2 failure(s), 0 warning(s) on 1 files.\n\
  ```\n\n![](img/Figure-6.4.jpg)\n\n**图 6.4:** 的 ansible-lint 输出\n\n# 修复后的 playbook\n\
  \n修正所有错误后，我们得到了以下 `fix.yml` Ansible Playbook：\n\n```yaml\n---\n- name: Troubleshooting\
  \ example\nhosts: all\nvars:\n  servers:\n    host01:\n      ip: 192.168.1.11\n\
  \      type: large\ntasks:\n  - name: Print a fact\n    ansible.builtin.debug:\n\
  \      var: ansible_facts['architecture']\n  - name: Latest apache2 package\n  \
  \  ansible.builtin.apt:\n      name: apache2\n      state: present\n      update_cache:\
  \ true\n  - name: Only large machines\n    ansible.builtin.debug:\n      msg: \"\
  {{ servers.values() | selectattr('type', 'eq', 'large') | map(attribute='ip') |\
  \ join(',') }}\"\n```\n\n\n\n\n\n## 语法检查\n\n`fix.yml` Ansible playbook 成功通过了 `ansible-playbook`\
  \ 命令的语法检查：\n\n```\nansible-playbook --syntax-check fix.yml\n```\n\n```\nplaybook:\
  \ fix.yml\n```\n\n![](img/Figure-6.5.jpg)\n\n**图 6.5:** 语法检查输出\n\n上一个命令返回 0（零）状态码。语法检查命令的行为也如图\
  \ 6.5 所示：\n\n## YAML linter\n\n在项目层级执行 `yamllint`：\n\n```bash\nyamllint .\n```\n\
  \n`yamllint` 命令的行为也如图 6.5 所示。当我们执行 `yamllint` 命令行实用程序时，我们获得了成功的空输出和 0（零）状态码。\n\n\
  ## Ansible linter\n\n我们将使用 `ansible-lint` 命令行工具对 playbook 进行分析：\n\n```bash\nansible-lint\
  \ fix.yml\n```\n\n输出显示根据 Ansible 最佳实践执行成功，并返回 0（零）状态码：\n\n```\nansible-lint fix.yml\n\
  ```\n\n`Passed with production profile: 0 failure(s), 0 warning(s) on 1 file.`\n\
