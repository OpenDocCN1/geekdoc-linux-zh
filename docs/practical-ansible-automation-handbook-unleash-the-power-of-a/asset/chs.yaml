  \n\n\n[www.orangeava.com](http://www.orangeava.com)\n\n# 献给\n我的儿子 Filippo - 我生命的骄傲\n\
  \n# 关于作者\n**Luca Berton** 是一位 Ansible 自动化专家，曾在摩根大通 Chase 银行（JP Morgan Chase & Co.）工作。他之前曾在红帽\
  \ Ansible 工程师团队工作过三年。他是畅销书籍《Ansible for VMware by Examples》和《Ansible for Kubernetes\
  \ by Examples》的作者。Luca 还是 `Ansible Pilot` 项目的创建者。\n\n超过 15 多年的系统管理员经验，他在基础设施加固和自动化方面拥有丰富的专业知识。他是开源社区的热心支持者，并在各种公共活动中分享自己的知识。天生是一个极客，Luca\
  \ 倾向于 Linux，特别是 Fedora。\n\n# 技术审核员\n**Yogesh Raheja** 是 Thinknyx Technologies 的创始人兼首席执行官。他是一位拥有十年\
  \ IT 经验的认证 DevOps、云和容器专家。他在公有云/私有云、容器、自动化工具、持续集成/部署/交付工具、监控与日志工具等技术方面拥有专长。他喜欢在各种论坛、会议、网络研讨会、博客和\
  \ LinkedIn 上向全球观众分享他的技术知识。他写过多本书——如《Effective DevOps with AWS》、《Automation with\
  \ Puppet 5》和《Automation with Ansible》，并在多个平台发布了他的在线课程。他还为 Packt 审核了多本书，包括《Implementing\
  \ Splunk 7, 第三版》和《Splunk Operational Intelligence Cookbook, 第三版》等。\n\n**Linkedin:**\
  \ [www.linkedin.com/in/yogesh-raheja](http://www.linkedin.com/in/yogesh-raheja)\n\
  \n# 前言\n欢迎阅读《实战 Ansible 自动化手册》，这是一本全面的指南，将带你进入使用 Ansible 的自动化世界。在当今快速发展、效率和扩展性至关重要的数字格局中，Ansible\
  \ 已成为一种领先的自动化工具，赋能组织简化运营并取得显著成果。\n\n本书旨在为初学者和开发者提供充分的知识和技能，以充分利用 Ansible 的潜力。无论你是系统管理员、网络工程师、开发者还是经理，本书都将为你提供必要的工具和技术来自动化常规任务、增强配置管理并协调复杂的部署。\n\
  \n作为一名拥有多年经验的 Ansible 自动化专家，我精心编写了这本书，为你提供一种实用的、循序渐进的方法来掌握 Ansible。每一章都充满了丰富的案例和实践练习，涵盖了从\
  \ Ansible 架构和安装的基础知识到利用 `Ansible Automation Platform` 和 `Morpheus` 等高级主题的所有内容。\n\
  \n在整书中，你将发现 Ansible 如何改变你的基础设施运营，让你实现基础设施即代码（Infrastructure as Code）并解锁多云环境的优势。你将学习如何开发\
  \ playbook、管理变量、处理条件语句并有效利用 Ansible 模块。\n\n此外，本书的内容不仅限于 Ansible 本身，还深入了 `Morpheus`\
  \ 的集成。它探索了配置管理、图形用户界面（GUI）、基于角色的访问控制（RBAC）等主题。你不仅将获得解决常见问题的见，还将获得优化 Ansible 工作流的实践经验。\n\
  \n读完本书后，你将对 Ansible 有坚实的理解，并有信心实现任务自动化、加速部署并提高 IT 运营的整体效率。无论是寻求全面介绍的初学者，还是希望扩展知识的经验用户，本书都是你掌握\
  \ Ansible 自动化的终极指南。\n\n我邀请你与我共同开启这段激动的旅程，探索 Ansible 世界，并发现它是如何彻底改变你的自动化实践。让我们自动化一切，释放\
  \ Ansible 的真正力量。\n\n自动化愉快！\n\n## [第 1 章]:入门\n在本章中，我们将通过介绍 Ansible 并引导你在 Linux、macOS\
  \ 和 Windows 上进行安装来奠基础。你将理解 Ansible 的架构，并学习如何执行基本的即时命令来有效管理远程主机。\n\n## [第 2 章]:Ansible\
  \ 语言核心\n在本章中，我们将深入研究 Ansible 的核心语言。你将学习如何处理 Ansible 清单（inventory）、创建强大的 playbook、使用变量、利用事实（facts），并利用条件语句和循环的灵活性。\n\
  \n## [第 3 章]:Ansible 语言进阶\n在核心语言的基础上，本章探索了高级概念，例如用于安全存储敏感数据的 `Ansible Vault`、利用处理器（handlers）触发操作、利用角色（roles）和集合（collections）的力量实现代码复用，以及使用过滤器、模板和插件来增强你的自动化能力。\n\
  \n## [第 4 章]:Linux 版 Ansible\n本章将重点关注配置 Linux 目标主机和执行日常系统管理任务。你将学习如何确保主机可用性、编辑文件、创建文本文件以及执行滚动更新等其他重要的\
  \ Linux 特有自动化任务。\n\n## [第 5 章]:Windows 版 Ansible\n在本章中，我们将重点转向 Windows 目标主机。你将发现如何配置\
  \ Windows 主机、测试其可用性、操作文件、创建文本文件并执行滚动更新，从而在 Windows 环境实现无缝自动化。\n\n## [第 6 章]:Ansible\
  \ 故障排除\n故障排除是任何自动化之旅中不可或缺的一部分。在本章中，我们将提供诊断和解决你在在使用 Ansible 时可能遇到的常见问题的知识。从连接失败、语法错误到缺失模块参数，你将学习有效的故障排除技术。\n\
  \n## [第 7 章]:企业级 Ansible\n本章探索了企业级 Ansible 功能及其与 Ansible Automation Platforms 和\
  \ Morpheus 的集成。它涵盖了广泛的主，包括 GitOps、配置管理 (CM)、图形用户界面 (GUI) 和基于角色的访问控制 (RBAC)。\n\n\n\
  \n\n\n# 第 8 章\n\nAnsible 进阶。在最后一章中，我们将探索 Ansible 的高级功能以及其在云提供商和 Kubernetes 中的第三方集成。我们将展示真实的\
