  \n# 第 1 章\n\n## 快速上手\n\n## 简介\n\nAnsible 是标准化和统一化不同工具链的关键技术，使我们组织在交付能力和客户满意度方面获得卓越成果。学习语言简单，标准的代码块让我们在旅程中的学习过程变得顺畅。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   现代数据中心\n*   Ansible 简介\n*   Ansible 架构\n*   Ansible\
  \ 安装\n*   Ansible 临时命令\n\n## 现代数据中心\n\n如今每家公司都依赖高效现代的信息技术部门。保持最高质量以满足业务需求并在全球市场上具有竞争力至关重要。\n\
  \n现代数据中心是一个存放和管理组织 基础设施的集中位置。这包括服务器、存储系统、网络设备以及支持组织计算需求的其他硬件和软件组件。\n\n现代数据中心的核心特征之一是其设计是可扩展、灵活且高可用的。这意味着随着组织计算需求的变化，它可以轻松地扩展或适应，并且在一个或多个组件故障时能够继续运行。\n\
  \n现代数据中心可能被设计为节能型，使用先进的冷却和电源管理系统来减少能耗。它可能包含冗余电源和网络基础设施等功能，以确保高水平的可用性和可靠性。\n\n除了传统的硬件软件组件外，现代数据中心可能包含云服务，例如\
  \ `基础设施即服务 (IaaS)` 和 `平台即服务 (PaaS)`。这些服务允许组织按需访问计算资源，而无需购买和维护自己的硬件。\n\n在我们的 IT 基础设施中，我们尽可能运行尽可能应用程序来满足业务利益相关者的需求。\n\
  \n应用程序部署是指将软件应用程序交付并安装到生产环境的过程，终端用户可以在那里进行访问和使用。此过程通常涉及构建应用程序、测试其以确保功能运行正常，然后将其发布到实时环境，用户可以通过互联网或本地网络访问它。\n\
  \n部署应用程序有许多方法，取决于应用程序的类型和目标环境。常见方法包括：\n\n*   **手动部署：** 涉及通过执行手动步骤在每个设备或服务器上安装应用程序。这可能耗时且容易出错，但通常用于小型应用程序或预期用户量较少的应用程序。\n\
  *   **脚本部署：** 涉及使用脚本或自动化工具同时在多个设备或服务器上安装应用程序。这比手动部署更快、更可靠，但需要更多的前期工作来设置脚本和自动化工具。这种使用基于脚本的方法进行自动的技术被称为“命令式方法\
  \ (Imperative Approach)”。\n*   **基于容器的部署：** 将将应用程序及其依赖项封装到容器中，然后将其部署到任何能够运行容器的设备或服务器上。容器允许应用程序快速、一致地部署，从而更容易根据需要扩展或收缩。\n\
  *   **云部署：** 涉及将应用程序托管在 Amazon Web Services (AWS) 或 Microsoft Azure 等云平台上。云平台提供了各种工具和服务，以便在实时环境中轻松部署、扩展和管理应用程序。\n\
  \n总体而言，应用程序部署的目标是让应用程序在生产环境中轻松启动运行，以便终端用户根据需要访问和使用它。我们还可以在部署工具链中使用 Ansible 自动化部署过程，例如与\
  \ Jenkins 结合。在 第 6 章：Ansible 故障排除 的故障排除工具部分了解更多关于 CI/CD 流水线的信息。\n\n\n\n\n\n容器是一种轻量级、独立且可执行的包，它包含了应用程序运行所需的所有内容，包括应用程序代码、库、依赖项和运行环境。容器允许应用程序轻松地打包并部署在任何平台上，包括本地服务器、云基础架构和混合环境。\n\
  \n容器的主要优势之一是它们允许应用程序与其环境相隔离，并能够在不同的环境中保持一致的运行。这使得开发、测试和部署应用程序变得更加容易，并有助于确保应用程序在生产环境中正确运行。\n\
  \n容器通常运行在容器运行时之上，例如 `Docker`、`Podman` 和 `Cri-O`（也被 `Kubernetes` 使用），它们负责管理和调度容器。容器运行时为与容器交互提供了一个一致的接口，无论底层的操作系统或基础设施如何。\n\
  \n近年来，容器作为一种以云原生方式部署和管理应用程序的方法变得越来越流行，并广泛应用于 DevOps 和微服务架构中。\n\n现代 IT 基础设施提供了自愈能力、智能调度、服务发现、水平扩展、自动发布和回滚、负载均衡、`Secrets`、`Config\
  \ Maps` 以及使用配置管理实现的自动化。当机器数量过多时，我们需要一个可靠的补丁管理系统来保持系统更新，并更快地应用补丁和安全更新。\n\n# Ansible\
  \ 简介\n\nAnsible 是一个用于自动化和管理 IT 基础设施的开源软件平台，包括部署应用程序和配置系统。它允许我们编写 `playbooks`，这是使用\
  \ `YAML`（一种人类可读的语言）编写的任务集，描述了如何在一个或多个远程服务器上执行自动化步骤（任务）。\n\n![](img/Figure-1.1.jpg)\n\
  \n**图 1.1:** Ansible 标志\n\nAnsible 使用客户端-服务器架构，包含一个中央控制服务器（`Ansible Control Node`）和受管节点（我们想要在上面执行自动化任务的服务器）。控制机通过\
  \ `SSH`（一种安全网络协议）连接到受管节点并在上面运行 playbooks。\n\n![](img/4.jpg)\n\nAnsible 的主要优势之一是它使用了简单、易学的语法，并且不需要任何特殊的编程技能。这对于需要自动化各种常规重复性工作任务但可能没有多少编程经验的\
  \ IT 专业人士来说，是一个非常有吸引选择。Ansible 是一种声明式语言，而脚本通常是过程化编写的。其优势在于它关注的是系统的最终状态，而不是实现该状态的步骤。\n\
  \nAnsible 可用于自动化广泛的任务，包括应用程序部署、系统配置、云基础架构供应以及安全和合规管理。它通常用于 DevOps（一种强调开发和运维团队之间协作的软件开发方法），以自动化应用程序的构建、测试和部署。\n\
  \nAnsible 使用以下协议连接到目标机器：\n\n* `OpenSSH` 用于 Unix 类操作系统：Linux、macOS 等。\n* `WinRM`\
  \ 用于 Windows 操作系统。\n\n下面的图表示了 Ansible 架构：\n\n![](img/Figure-1.2.jpg)\n\n**图 1.2:**\
  \ Ansible 架构\n\n图中的 Ansible 是`中央控制节点`，图中的 Linux、Windows 和 macOS 是执行自动化的`受管节点`。\n\
  \n# Linux 和 macOS 目标\n\nAnsible 使用 `OpenSSH` 协议连接受管主机中的任何 POSIX、Unix 类操作系统。这个长列表包括任何\
  \ Linux 发行版、Unix、macOS 以及任何版本的 BSD 等。`OpenSSH` 是 Secure Shell (`SSH`) 协议的免费开源实现。它是一种在计算机之间提供安全通信的网络协议，允许我们远程登录到另一台计算机、执行命令并通过网络安全地传输文件。\n\
  \n`SSH` 协议使用加密来保护客户端（我们的计算机）和服务器（远程计算机）之间的连接。它使用公钥密码法验证客户端和服务器的身份，并建立一个可以在其中传输数据的安全通道。\n\
  \n`OpenSSH` 广泛用于访问服务器和系统，是大多数 Linux 和基于 Unix 的系统的默认 `SSH` 实现。它作为第三方软件可用于 Windows\
  \ 和 macOS 等其他操作系统。\n\n`OpenSSH` 提供了管理 SSH 连接的各种工具和实用程序，例如用于建立 `SSH` 连接的 `ssh`、用于在计算机间安全传输文件的\
  \ `SCP` 以及用于通过 `SSH` 连接传输文件的 `SFTP`。它还包含一个用于在计算机间传输文件的安全拷贝 (`SCP`) 工具和一个用于通过 `SSH`\
  \ 连接传输文件的安全文件传输协议 (`SFTP`)。\n\n# Windows 目标\n\nAnsible 使用 `Windows Remote Management\
  \ (WinRM)` 连接到 Windows 管理主机。这项微软技术允许我们在 Windows 机器上远程执行命令。这是基于 `WS-Management` 协议的，它是远程管理设备和系统的标准协议。在写本书时，Ansible\
  \ 支持最常用的 Windows 客户端和服务器：Windows Server 2008、Windows Server 2008 R2、Windows Server\
  \ 2012、Windows Server 2012 R2、Windows Server 2016、Windows Server 2019、Windows Server\
  \ 2022、Windows 7、Windows 8.1、Windows 10 和 Windows 11。\n\n`WinRM` 允许我们远程运行脚本、执行系统管理任务并远程管理\
  \ Windows 服务器。它可以远程管理网络中的单台或一组机器。\n\n要使用 `WinRM`，我们需要在远程机器上启用它，然后使用如 `Windows PowerShell`\
  \ 或 `Ansible` 等第三方工具连接到远程机器并执行命令。\n\n总的来说，`WinRM` 是 Windows 机器上远程管理和自动化任务的有用工具。它允许我们从单个位置管理多台机器，从而节省时间和精力。它在可能有成百或数千台服务器需要管理的大型组织特别有用。\n\
  \nAnsible 现在扩展了连接能力，涵盖存储和网络设备、容器技术、虚拟化 (`VMware`)、编排技术 (`Kubernetes`) 以及云提供商。\n\n\
  ![](img/6.jpg)\n\n# Ansible 社区\n\nAnsible 社区（参考 `图 1.3`）指的是使用、开发和贡献 Ansible 自动化工具的个人和组织。Ansible\
  \ 是一个开源自动化工具，通过自动化配置管理、应用程序部署和编排任务，帮助用户管理其 IT 基础设施和应用程序部署。\n\n![](img/Figure-1.3.jpg)\n\
  \n**图 1.3:** Ansible 社区通道\n\nAnsible 社区由用户、贡献者开发者组成，他们通过各种渠道分享知识、经验和代码。这些渠道包括在线论坛、邮件列表、社交媒体小组和聚会。社区还提供文档、教程和培训材料，帮助用户学习并上手\
  \ Ansible。\n\nAnsible 社区的核心特征之一是其协作性质。用户和开发者通过贡献代码、报告漏洞和提供反馈共同工作改进工具。社区还创建并维护了数千个\
  \ Ansible 模块、playbooks、角色（roles）和集合（collections），用户可以使用它们来自动化各种任务。\n\n\n\n\n\nAnsible\
  \ 社区由 Ansible 的背后公司 Red Hat 以及其他致力于开源软件和自动化的组织和个人支持。该社区不断成长和演变，每天都有新的贡献者和用户加入。\n\
  \n在编写本书时，请了解一下目前 Ansible 社区的规模：\n\n*   每月有近五十万访问访问文档网站（参考：`docs.ansible.com`）\n\
  *   `reddit.com/r/ansible` 每有 800 多条评论\n*   StackOverflow 上每月有 300 多个标记为 ansible\
  \ 的问题\n*   `ansible-project` 邮件列表每月有 200 多条帖子\n*   800 多个活跃的 GitHub 贡献者\n*   400\
  \ 多个对 Ansible collections 的活跃 Ansible 贡献者\n*   IRC 和 Matrix 通信系统每日活跃活跃\n\n# Ansible\
  \ 架构\n\nAnsible 是一种配置管理和自动化工具，允许我们以自动化和标准化的方式管理和控制大量系统。它可以用于配置操作系统、部署应用程序并在远程服务器上执行其他任务。\n\
  \nAnsible 的架构由几个关键组件组成：\n\n*   **控制机 (Control machine)：** 这是我们运行 Ansible 命令和 Playbook\
  \ 的机器。它可以是任何安装了 Ansible 的机器，例如我们的本地桌面或笔记本电脑。这台机器是 Ansible 生态系统的核心。\n*   **托管节点 (Managed\
  \ nodes)：** 这些是由 Ansible 控制机管理以执行自动化的机器。\n*   **清单 (Inventory)：** 清单 Ansible 将管理的系统列表。它可以是一个静态文件，也可以是运行时生成的动态清单。\n\
  *   **模块 (Modules)：** 模块是 Ansible 的构建块。它们是执行特定任务的小型程序，例如安装软件包或启动服务。\n*   **剧本 (Playbooks)：**\
  \ 剧本用 YAML 编写，包含一系列要执行的任务。它们可用于自动化复杂过程，是 Ansible 自动化能力的关键组件。\n*   **插件 (Plugins)：**\
  \ 插件是扩展 Ansible 核心功能的小型程序。它们可以修改 Ansible 模块的行为或添加新功能。\n\n总的来说，Ansible 连接到我们清单中的系统并运行剧本中指定的任务。它使用简单、易于人类阅读的语法，并可以通过自定义模块和插件轻松扩展。\n\
  \n让我们逐一拆解这些组件。Ansible 控制器本质就是任何安装了 Ansible 的计算机。\n\n关于安装信息，请参考下方的 *Ansible Installation*\
  \ 章节。成功安装 Ansible 后，我们可以使用以下命令检查运行版本：\n\n```\n$ansible --version\n```\n\n请注意，Ansible\
  \ 平台包含了 Ansible 引擎、命令行实用（例如：`ansible`、`ansible-playbook`、`ansible-galaxy`、`ansible-inventory`\
  \ 等）以及 Ansible Collections (`ansible.builtin`)。\n\n目标主机列表存储在 Inventory 文本文件中。该文件的默认位置是\
  \ `/etc/ansible/hosts`，但我们可以在每次执行时通过在每个 Ansible 命令中指定 `-i` 参数来覆盖它。Ansible Inventory\
  \ 支持 INI、JSON 和 YAML 格式。我们还可以拥有多个文件并在执行时将它们合并。一个非常强大的功能是动态清单，即执行脚本返回清单的能力。这在快速变化的环境非常有有用，例如虚拟机或云计算提供商，在这些环境中，运行服务的枚举至关重要且变化迅速。\n\
  \nAnsible 模块执行托管主机上的每个 Ansible 动作。有许多 Ansible 模块可以轻松执行任何操作，而无需重复发明轮子。\n\n当我们想要连接多个任务、将数据保存在数据结构中或执行循环或条件时，我们需要\
  \ Ansible Playbook。它是一个 YAML 格式文档，定义了何时以及何时执行我们的自动化步骤。它非常强大，特别是与封装成 Role 或 Collection\
  \ 的复用代码相结合时。我们可以编写自己的复用代码，或从供应商或第三方库中使用它。\n\nAnsible 具有很好的插件结构，允许我们扩展核心功能。为许多任务创建插件都是可能的。根据我们想要实现的集成类型有不同类型的插件。\n\
  \n我们可以将代码和插件分发到 IT 部门或互联网。在 Ansible Galaxy 网站 `https://galaxy.ansible.com` 上有丰富的\
  \ Roles 和 Collections 选择。\n\n# Ansible 安装\n\n要在我们的本地机器上安装 Ansible（假设我们正在运行 Linux\
  \ 或 macOS 等类 Unix 操作系统），我们需要已经安装了 Python 3.6 或更高版本。安装了 Ansible 的机器被称为 Ansible Controller。\n\
  \n首先，我们可以使用以下命令检查是否已安装了 Ansible：\n\n```\n$ansible --version\n```\n\n它会验证 Ansible\
  \ 是否已成功安装，并应该显示系统中的 Ansible 版本：\n\n```\nansible [core 2.15.0]\n```\n\n例如，在我的系统中，最新安装的版本是\
  \ Ansible core 2.15.0。其中 2 称为主版本，15 是小版本，0 是补丁版本。\n\n当结果为：\n\n```\ncommand not found:\
  \ ansible\n```\n\n输出 `command not found` 意味着系统中尚未安装。\n\n安装 Ansible 是执行我们自动化的第一步。有几种方法可以实现结果。它支持所有现代操作系统，因此我们通常只需要在操作系统中输入\
  \ `install ansible`。在接下来的章节中，我们可以看到最流行的操作系统中的逐步安装步骤。\n\n# Ansible Core vs. Ansible\
  \ Community Packages\n\n从 2021 年开始，Ansible 项目从 2.10 版本起分发了两种不同的 Ansible 软件包。Ansible\
  \ Core 包和 Ansible Community 包并行。Ansible Core 是一个命令行工具，主要用于那些只想安装所需最少内容的开发者和用户。它包含极少数的模块和插件，并允许安装其他\
  \ Collections。类似于 Ansible 2.9，尽管不再包含任何此后移动到 Collection 中的内容。Ansible Core 以 `ansible-core`\
  \ 包的形式分发，它是 Ansible 的主要构建块和架构，并包含：\n\n*   CLI 工具，如 `ansible-playbook` 和 `ansible-doc`\
  \ 以及其他用于驱动和与自动化交互的工具。\n*   Ansible 语言使用 YAML 为开发 Ansible Playbooks 创建一套规则，并包含条件、块、包含、循环等\
  \ Ansible 指令函数。\n*   一个允许通过 Ansible collections 进行扩展的架构框架。`ansible-core` 团队大约每年发布两个主版本。\n\
  \n安装 Ansible 的另一种方法是使用 Ansible Community 包。Ansible 社区包的每个主版本都会接受包含的每个 Collection\
  \ 的最新版本以及 `ansible-core` 的最新版本。Ansible 社区包的主版本可能包含包含的模块和其他插件以及/或核心功能中的破坏性更改。\n\n\
  `ansible` 包依赖于 `ansible-core` 包。Ansible 3.0.0 及后续版本得益于更广泛的 Ansible 社区根据社区清单审核 Collections，包含了更多的\
  \ Collections。Ansible 社区团队通常在灵活的发布周期内每年发布两个社区包主版本，该周期滞后于 `ansible-core` 的发布。\n\n\
  \n\n\n\n某些操作系统包管理器倾向于仅分发 `ansible-core` 包，而有些则分发两个包（ansible-core 和 ansible）。请检查我们喜爱的发行版中提供了哪些内容。\n\
  \n在本书编写时，`ansible-core` 包的最新版本是 2023 年 2 月 27 日发布的 2.14.3，而 ansible 包版本为 7.3.0，于\
  \ 2023 年 2 月 28 日发布。\n\n# Linux\n\nLinux 是 Ansible 的首选操作系统。所有发行版的仓库中都包含 Ansible\
  \ 包。每当我们想要安装最新版本的 Ansible 时，可以使用 `PIP` 命令行工具（请参见相关章节）。\n\n在大多数 Linux 发行版中，配置 Ansible\
  \ 控制器的用户体验是打开终端并通过发行版包管理器安装软件包。\n\n一个好的建议是始终更新包管理器的软件包列表。\n\n我们可以在 Debian 或兼容 Ubuntu\
  \ 的操作系统中使用 `apt` 包管理器通过 DEB 包系统安装 Ansible。（参考图 1.4）。\n\n我们可以执行以下步骤：\n\n1. 通过运行以下命令更新包缓存：\n\
  ```bash\n$ sudo apt update\n```\n\n2. 通过运行以下命令安装必要的依赖：\n```bash\n$ sudo apt install\
  \ ansible\n```\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4:** 在 Ubuntu 22.10 上执行 Ansible\
  \ 安装的结果\n\n同样地，我们可以像如下所示安装额外的命令行 `ansible-lint` Ansible 工具。\n\n![](img/Figure-1.5.jpg)\n\
  \n**图 1.5:** 在 Ubuntu 22.10 上执行 ansible-lint 安装的结果\n\n我们可以在 Fedora、Red Hat Enterprise\
  \ Linux、Oracle Linux、Rocky Linux、Alma Linux、Amazon Linux 以及 CentOS 等使用 RPM 包系统的发行版中使用\
  \ YUM/DNF 包管理器安装 Ansible。\n\n请注意，CentOS 7 和 8 是 CentOS Linux 的最终发布版本。CentOS 7 的生命周期结束（EOL）日期为\
  \ 2024 年 6 月 30 日，8 为 2021 年 12 月 31 日。\n\n我们可以执行以下步骤：\n\n1. 通过运行以下命令更新 DNF 包缓存：\n\
  ```bash\n$ sudo dnf update\n```\n\n2. 通过运行以下命令安装必要的依赖：\n```bash\n$ sudo dnf install\
  \ ansible\n```\n\n![](img/Figure-1.6.jpg)\n\n**图 1.6:** 在 Fedora 37 上执行 Ansible\
  \ 安装的结果\n\n# PIP\n\nAnsible 是用 Python 语言编写的，可以使用 Python 原生工具和仓库进行安装。如果我们想使用最新发布的\
  \ Ansible 版本，这也是一个选项。有时 Linux 发行版需要根据发行版的发布周期一些时间来整合最新的 Ansible 版本。\n\n通过运行以下命令使用\
  \ `PIP` 工具和 Python 包管理器安装 Ansible。它与 `Python Package Index (PyPI)` 互联网存档交互（引自：[`pypi.org/`](https://pypi.org/)））。\n\
  \n在 Debian 或 Ubuntu 操作系统中，我们可以执行以下步骤：\n\n1. 通过运行以下命令更新包缓存：\n```bash\n$ sudo apt\
  \ update\n```\n\n2. 通过运行以下命令安装必要的依赖：\n```bash\n$ sudo apt install python3-pip\n\
  ```\n\n3. 安装 Ansible 包：\n```bash\n$ pip3 install ansible\n```\n\n4. 通过运行以下命令验证 Ansible\
  \ 是否已成功安装：\n```bash\n$ ansible –version\n```\n\n上一个命令显示了我们安装的 Ansible 版本（参考图 1.7）。\n\
  \n请注意，在某些发行版中，可以通过输入 `pip3` 命令使用 `pip` 命令，这意味着 `PIP` 工具专门用于 Python 版本 3。在某些情况下，我们也可以更具体，例如用于使用\
  \ Python 3.9 的 `pip3.9`。这种用例在 `Red Hat Enterprise Linux (RHEL)` 发行版非常典型：\n\n![](img/Figure-1.7.jpg)\n\
  \n**图 1.7:** 通过 PIP 执行 Ansible 安装的结果\n\n安装 Ansible 后，我们可以使用它来管理我们的基础设施并在多个服务器或设备上自动化任务。我们需要创建一个\
  \ Ansible 清单文件，指定我们想要管理的服务器或设备，并编写 Ansible playbooks（playbooks 使用 YAML 语言编写并定义我们想要自动化的任务）。\n\
  \n# macOS\n\nmacOS 操作系统符合 UNIX System-V 标准，因此完全兼容 Ansible。\n\n为了在 macOS（无论是 Intel\
  \ 还是 Apple Silicon 处理器）上安装，使用 Homebrew 包管理器非常方便（参考图 1.8）。Homebrew 是在 macOS 上安装和维护最新软件的一种非常方便的方式。\n\
  \nHomebrew 是一个基于 Ruby 的软件，我们可以在 macOS 终端中使用一个简单的命令安装它（更多信息请参阅 [`brew.sh/`](https://brew.sh/)）：\n\
  \n```bash\n$ /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
  \n```\n\n打开终端并运行以下命令更新包管理器的软件包列表：\n```bash\n$ brew install ansible\n```\n\n![](img/Figure-1.8.jpg)\n\
  \n**图 1.8:** 在 macOS 上通过 Homebrew 执行 Ansible 安装的结果\n\n同样地，我们可以如下所示安装额外的命令行 `ansible-lint`\
  \ Ansible 工具：\n\n![](img/Figure-1.9.jpg)\n\n**图 1.9:** 在 macOS 上通过 Homebrew 执行 ansible-lint\
  \ 安装的结果\n\n# Windows\n\nWindows 操作系统未被 Ansible 工程师团队官方支持作为 Ansible 控制节点。但 Windows\
  \ 操作系统被官方支持作为目标节点。主要问题是 Windows 不是一个符合 POSIX 标准的操作系统，而许多 Ansible 模块是以这种方式深度编码的。\n\
  \n有两种可能的变通方法，但都没有官方支持。\n\n* Cygwin\n* Windows Subsystem for Linux (WSL)\n\nCygwin\
  \ 是一种为 Microsoft Windows 添加类 Unix 环境和命令行界面的额外软件。即使听起来很不错，但有时执行会直接报错。\n\nWindows\
  \ Subsystem for Linux 是 Windows 的现代功能，用于在独立的沙箱环境中运行 Linux 环境。它的效果更好，因为它在我们的 Windows\
  \ 系统内部运行原生 Linux 操作系统。支持的 Linux 发行版包括 Ubuntu、OpenSUSE、Kali、Debian、Arch Linux 等。它需要\
  \ Windows 10 版本 2004 及更高（内部 19041 及更高）或 Windows 11。我们可以在 PowerShell 中以“管理员身份运行”选项使用以下命令安装\
  \ WSL：\n\n```bash\nwsl --install\n```\n\n在成功安装 WSL 后，我们可以进行标准的 Linux 安装。结果如图 1.10\
  \ 所示：\n\n![](img/Figure-1.10.jpg)\n\n**图 1.10:** Windows 11 WSL 上的 Ansible 安装\n\n\
  # Ansible 即时命令\n\nAnsible 即时命令（ad-hoc command）是在组主机上执行一次性任务的快速、简单的方法。它允许我们使用 `ansible`\
  \ 命令行工具在一个或多个主机上执行单条命令或短脚本。\n\n即时命令对于执行快速任务非常，例如检查服务器的运行时间、安装软件包或重启服务。它们对于测试或排查主机或主机组上的特定配置或设置也有帮助。\n\
  \nAnsible 即时命令的语法如下：\n\n```bash\nansible <hosts> -i <inventory-file> -m <module>\
  \ -a <arguments>\n```\n\n其中：\n\n*   `<hosts>`：我们要在上面运行命令的目标主机。我们可以使用模式指定单个主机或一组主机。\n\
  *   `<inventory-file>`：包含主机列表的清单文件位置。\n\n\n\n\n\n*   `<module>`：在主机上运行的 Ansible\
  \ 模块。模块是预编写的脚本，用于执行特定任务，例如管理包、复制文件或运行 shell 命令。\n*   `<arguments>`：传递给模块以执行所需任务的参数。\n\
  \n我们可能会遇到的第一个 Ansible 模块之一是 `ping` 模块。`ping` 模块属于 `ansible.builtin` Ansible 集合。\n\
  \n`ping` 模块的目的是检查主机是否可以执行任何自动化操作。它与网络 `ping` 命令完全不同。在 Ansible `ping` 模块中，我们将验证与目标主机的连接（通常通过\
  \ OpenSSH 连接），并执行一些简单的 Python 代码以返回 `ping: pong` 消息。我们可以自定义返回消息，但这并不重要。核心部分是能够检查目标主机上执行代码的可用性。对于\
  \ Windows 目标，我们应该使用 `win_ping` 模块。\n\n另一个实 Ansible 模块是 `command` 模块。同样，`command`\
  \ 模块属于 `ansible.builtin` Ansible 集合。我们可以将“command”模块与任何 Linux 命令结合使用。唯一的限制是 `command`\
  \ 模块不允许使用 shell 扩展，例如 `* (星号)`、`| (管道)`、`> (重定向)` 运算符。如果我们需要任何这些 Unix 重定向功能，则应使用\
  \ `shell` 模块，但这也更危险。\n\n例如，要检查一组主机的 `uptime` Linux 命令，我们可以运行以下即时命令：\n\n```\n$ ansible\
  \ webservers -i inventory.ini -m command -a \"uptime\"\n```\n\n该命令将在 `inventory.ini`\
  \ 文件中定义的 `webservers` 组中的所有主机上运行 `uptime` 命令。当我们想为自动化设置多个目标时，主机组非常有帮助。我们只需定义一个主机组并在自动化中使用它。\n\
  \nAnsible 的默认安装中包含了许多 Ansible 模块。列表非常长，而且每天都在变长。在下一章中，我们将探索最实用的部分。\n\n```\n$ ansible\
  \ webservers -i inventory.ini -m ping\n```\n\nAnsible ping 模块是最广名的模块之一，因为它测试目标主机的可用性。它与网络\
  \ `ping` 命令无关。它通过清单文件中指定的用户名和密码（或使用 SSH 密钥认证）通过 SSH 连接到目标主机，并使用原生 Python 解释器执行一些命令。这就是为什么目标主机只需要现代操作系统并安装\
  \ Python 的原因。\n\n当我们想要执行多个步骤时，Ansible 自动化中还有另一个关键组件：Ansible Playbook（见下一章）。\n\n\
  Ansible 用于通过名为 Ansible Playbook 的人类可读 YAML 文件将 DevOps 原则应用于全球组织中。\n\n我们将在接下来的章节中深入探索\
  \ Ansible 编程语言。Ansible Playbook 允许我们使用数据结构和典型的编程语言结构，仅在需要时执行代码。\n\n# 结论\n\nAnsible\
  \ 是一种现代的基础设施自动化工具，使能够标准化脚本并减少人为错误。它只需要与目标主机建立连接，无需安装任何代理。如今，自动化日常任务对每个 IT 部门都有益处。\n\
  \nAnsible 可以与许多不同的操作系统、服务、应用程序和云提供商进行交互。它是随时带在口袋里的瑞士军刀。在下一章中，我们将学习更多关于 Ansible 语言的知识。我们已经深入了\
  \ Ansible 架构并执行了一些简单的即时命令。在下一章中，我们将扩展如何逐顺序执行多个任务，并充分利用 Ansible 语言和数据结构。\n\n# 记忆点\n\
  \n*   Ansible 控制机（Control machine）对目标主机执行自动化操作。\n*   Ansible 使用模块对目标主机执行通用操作。\n\
  *   Ansible 自动化处理 Unix 类操作系统（Linux、macOS 等）和 Windows。\n*   Ansible 即时命令（Ad Hoc）针对目标主机（或）执行一个模块或命令。\n\
  \n# 单选题\n\n1. 哪项不是现代数据中心的特征？\n    1. 可扩展性\n    2. 以上均不是\n    3. 灵活性\n    4. 高可用性\n\
  \n2. Ansible 使用什么协议与 Linux 目标主机进行通信？\n    1. 用于类 Unix 操作系统（Linux、macOS 等）的 OpenSSH\n\
  \    2. 用于 Windows 操作系统的 WinRM\n    3. 针对本地主机可以使用 “ansible_connection=local”\n \
  \   4. 以上均不是\n\n3. 是否可以使用 Windows 作为 Ansible 控制器？\n    1. 正确\n    2. 错误\n\n4. “ping”即时命令的预期输出是什么？\n\
  \    1. “ping: ping”\n    2. “no route to host”\n    3. “ping: 1”\n    4. “ping:\
  \ pong”\n\n# 答案\n\n1. **B**\n2. **A**\n3. **B**\n4. **D**\n\n# 问题\n\n1. 什么是 Ansible\
  \ Inventory？\n2. 如何连接到 Ansible 社区？\n3. 解释即时命令的作用。\n\n# 核心术语\n\n*   **Control machine\
  \ (控制机)**：这是我们运行 Ansible 命令和 Playbook 的机器。可以是任何安装了 Ansible 的机器，例如我们的本地桌面或笔记本电脑。\n\
  *   **Inventory (清单)**：清单是 Ansible 将管理的系统列表。它可以是静态文件或运行时生成的动态清单。\n*   **Modules\
  \ (模块)**：模块是 Ansible 的构建块。是执行特定任务的小程序，例如安装包或启动服务。\n*   **Playbooks** 使用 YAML 编写，包含一组要执行的任务。它们可用于自动化复杂过程，是\
  \ Ansible 自动化能力的关键组件。\n*   **Plugins (插件)**：插件是扩展 Ansible 核心功能的小程序。可用于修改 Ansible\
  \ 模块的行为或添加新功能。\n\n# 第 2 章\n\n# Ansible 语言核心\n\n## 引言\n\nAnsible 语言学习曲线简单，有助于我们简化针对目标主机的多项任务。我们可以在所谓的\
  \ Ansible Playbook 中编写 Ansible 语言。该文件还可以包含数据结构、循环和条件，以便仅在某些条件存在时执行任务。在本章中，我们将学习\
  \ Ansible 语言的基本原理以及如何编写我们的第一个成功的 Ansible Playbook。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   Ansible inventory (清单)\n*   Ansible playbook (剧本)\n*   Ansible variables (变量)\n\
  *   Ansible facts (事实变量)\n*   Ansible magic variables (魔法变量)\n*   Ansible conditional\
  \ (条件判断)\n*   Ansible loop (循环)\n\n## Ansible Inventory\n\nAnsible 本身仅运行在控制机上，因此我们不需要在目标机器上安装\
  \ Ansible。Ansible 通过根据我们指定的模块在 POSIX 目标主机上放置临时 Python 脚本来工作。其中某些模块有前提条件，因此我们可能需要在\
  \ POSIX 目标主机上安装特定的 Python 包。对于 Windows 目标，连接是使用 WinRM 协议进行的，并使用类似于 POSIX 目标主机的 Python\
  \ 脚本的 PowerShell 脚本。\n\n\n\n\n\nAnsible 清单（inventory）是用于自动化目标的主机列表。由 Ansible 管理的主机列表被称为清单。从根本上说，它是我们基础设施中的节点或主机列表，通常称为\
  \ Inventory。我们可以通过组或模式来组织清单，以选择我们想要执行 Ansible 自动化的主机或组。我们也可以使用组名来指定执行目标。\n\n## INI\
  \ 清单\n\nINI 清单是最简单的清单类型。我们可以列出所有的主机或 IP 地址。默认位置是 `/etc/ansible/hosts`，但我们可以使用 `-i`\
  \ 参数使用自定义的路径。最直接的 Ansible 清单格式是 INI。INI 格式在 IT 行业已存在多年，广泛用于配置文件。它简单来说就是一个包含一些 `name=value`\
  \ 字段的文本文件。`name` 是属性名，`value` 是属性值。此外，可以在内部定义部分，在括号中指定部分名称：`[section]`。\n\n让我们通过以下\
  \ `simple_inventory.ini` 文件来看一个简单的示例：\n\n```\nserver01.example.com\n\n[web]\n\n\
  server02.example.com\n\nserver03.example.com\n```\n\n如图 2.1 所示，Ansible 清单列出了 `example.com`\
  \ 域名下的三个主机。\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1：** simple_inventory 场景\n\n具体来说，`server01.example.com`\
  \ 主机未分组。`server02.example.com` 和 `server03.example.com` 主机被组为 web。\n\n## YAML 清单\n\
  \nYAML 格式是一种简单且易读的格式，通常用于 Ansible 清单。请非常注意代码的缩进。可以使用 YAML 格式代替 INI 格式来编写 Ansible\
  \ 清单。完整的主机或 IP 地址列表必须位于 `all`节点下。每个主机必须位于 `hosts` 字段下。我们可以像 INI 格式一样，在 YAML 格式的\
  \ `children` 关键字下指定组。上一节简单的 INI 清单可以用以下代码表示：\n\n```yaml\n---\nall:\n  hosts:\n \
  \   server01.example.com:\n      children:\n        web:\n          hosts:\n   \
  \         server02.example.com:\n            server03.example.com\n```\n\n如图 2.1\
  \ 所示，`server01.example.com` 未分组，但 `server02.example.com` 和 `server03.example.com`\
  \ 主机被组为 web。\n\n## Ansible-inventory 工具\n\n`ansible-inventory` 命令行工具包含在每个 Ansible\
  \ 安装中，用于显示当前的 Ansible 清单信息。验证我们 Ansible 清单的当前状态非常有帮助。它接受 INI、YAML 和 JSON 格式的 Ansible\
  \ 清单文件。可以使用 `--help` 显示完整的参数列表。最常用的选项是 `--list` 参数，它显示主机列表，以及 `--graph` 参数，它以树状视图显示相同的主机列表。\n\
  \n## “all”关键字\n\n特殊关键字 `all` 包含了清单中任何组中的所有主机。唯一的例外是 `localhost`，我们需要显式指定它。`all`\
  \ 关键字非常重要，在 Ansible 使用 中是必须的。如果我们没有指定任何特定的自动化目标主机，Ansible 将针对 `all` 执行自动化。\n\n##\
  \ 列表视图\n\n`ansible-inventory` 命令的列表视图用于在屏幕上显示 Ansible 使用的当前清单的 JSON 格式。清单越复杂，列表越长。假设我们有一个简单的\
  \ `inventory.ini` INI 清单文件，包含一个主机 `server.example.com`，如图 2.2 所示：\n\n![](img/Figure-2.2.jpg)\n\
  \n**图 2.2：** 清单场景\n\n```\nserver.example.com\n```\n\n我们可以通过指定以下命令获取列表输出：\n\n```\n\
  ansible-inventory -i inventory.ini --list\n```\n\n其中：\n\n* `ansible-inventory` 是处理\
  \ Ansible 清单的命令\n* `-i inventory` 参数指定当前目录下的源清单文件\n* `--list` 参数请求以列表视图格式输出\n\n\
  执行 `ansible-inventory --list` 命令的结果如下如下：\n\n```\n{\n  \"_meta\": {\n    \"hostvars\"\
  : {}\n  },\n  \"all\": {\n    \"children\": [\n      \"ungrouped\"\n    ]\n  },\n\
  \  \"ungrouped\": {\n    \"hosts\": [\n      \"server.example.com\"\n    ]\n  }\n\
  }\n```\n\n## 图形列表视图\n\n`ansible-inventory` 命令的图形视图用于在屏幕上显示 Ansible 使用的当前清单的树状视图。\n\
  \n假设我们有一个简单的 INI 清单文件（更多细节见下文简单的 INI 清单章节），如图 2.2 所示：\n\n```\nserver.example.com\n\
  ```\n\n我们可以通过指定以下命令获取图形视图输出：\n\n```\nansible-inventory -i inventory.ini --graph\n\
  ```\n\n其中：\n\n* `ansible-inventory` 是处理 Ansible 清单的命令\n* `-i inventory` 参数指定当前目录下的源清单文件\n\
  * `--graph` 参数请求以图形视图格式输出\n\n执行 `ansible-inventory --graph` 命令的结果如下：\n\n```\n@all:\n\
  \  |--@ungrouped:\n  | |--server.example.com\n```\n\n## 主机范围\n\n组成员也可以使用数字或字母范围来定义。在数字字段中，我们可以指定步长（stride）作为数字序列之间的增量。`range_inventory.ini`\
  \ 文件看起来如下：\n\n```ini\n[web]\nserver[01:10].example.com\n```\n\n在 INI 示例 `range_inventory.ini`\
  \ 中，web 组包含了从 `server01.example.com` 到 `server10.example.com` 的所有主机。我们可以根据需要扩展范围，指定服务器的起始和结束元素。\n\
  \n我们可以使用 `ansible-inventory` 命令的列表参数测试 Ansible 清单：\n\n```\nansible-inventory -i\
  \ range_inventory.ini --list\n```\n\n该命令产生以下输出：\n\n```\n{\n  \"_meta\": {\n    \"\
  hostvars\": {}\n  },\n  \"all\": {\n    \"children\": [\n      \"ungrouped\",\n\
  \      \"web\"\n    ]\n  },\n  \"web\": {\n    \"hosts\": [\n      \"server01.example.com\"\
  ,\n      \"server02.example.com\",\n      \"server03.example.com\",\n      \"server04.example.com\"\
  ,\n      \"server05.example.com\",\n      \"server06.example.com\",\n      \"server07.example.com\"\
  ,\n      \"server08.example.com\",\n      \"server09.example.com\",\n      \"server10.example.com\"\
  \n    ]\n  }\n}\n```\n\n## 多个组中的主机\n\n主机可以存在于清单中的多个组中。这一功能在生产环境中非常有用，我们可以从不同角度对系统进行分类。\n\
  \n```ini\nserver01.example.com\n[web]\nserver02.example.com\nserver03.example.com\n\
  [prod]\nserver02.example.com\n[dev]\nserver03.example.com\n```\n\n在这个 INI 示例中，主机\
  \ `server02.example.com` 和 `server03.example.com` 位于 web 组。`server02.example.com`\
  \ 存在于 web 组和 prod 组中。`server03.example.com` 存在于 web 组和 dev 组中。\n\n我们可以使用以下命令通过列表视图验证：\n\
  \n```\nansible-inventory -i groupsmultiple_inventory.ini --list\n```\n\n`groupsmultiple_inventory.ini`\
  \ 清单命令的输出如下：\n\n```\n{\n  \"_meta\": {\n    \"hostvars\": {}\n  },\n  \"all\": {\n\
  \    \"children\": [\n      \"ungrouped\",\n      \"web\",\n      \"prod\",\n  \
  \    \"dev\"\n    ]\n  },\n  \"dev\": {\n    \"hosts\": [\n      \"server03.example.com\"\
  \n    ]\n  },\n  \"prod\": {\n    \"hosts\": [\n      \"server02.example.com\"\n\
  \    ]\n  },\n  \"ungrouped\": {\n    \"hosts\": [\n      \"server01.example.com\"\
  \n    ]\n  },\n  \"web\": {\n    \"hosts\": [\n      \"server02.example.com\",\n\
  \      \"server03.example.com\"\n    ]\n  }\n}\n```\n\n我们可以看到，对于每个组名，都有其内部的主机列表。\n\
  \n\n\n\n\n我们将在下面的 Ansible 变量章节中探索一些主机变量（host variables）和组变量（group variables）的示例。请参考第\
  \ 4 章：Ansible For Linux 关于 Linux 目标主机 Ansible 清单中主机和组变量的使用，以及第 5 章：Ansible For Windows\
  \ 关于 Windows 目标主机的使用。\n\n# 本地清单 (#toc.xhtml_s35a)\n\n针对 `localhost` 进行自动化对于 Ansible\
  \ 来说比较特殊，因为我们需要一些特殊的参数。请记住，`localhost` 通常被排除在 `all` 关键字之外。\n\n清单中的一个特殊情况是 localhost。我们需要将连接类型指定为\
  \ `local`。否则，Ansible 将假定使用默认的 SSH 连接。\n\n这是一个经典的 INI 格式 Ansible `localhost_inventory.ini`\
  \ 文件示例：\n\n```\nlocalhost ansible_connection=\"local\"\n```\n\n我们可以通过以下命令获取此清单的列表视图：\n\
  \n```\nansible-inventory -i localhost_inventory.ini --list\n```\n\n这会产生以下输出：\n\n\
  ```json\n{\n  \"_meta\": {\n    \"hostvars\": {\n      \"localhost\": {\n      \
  \  \"ansible_connection\": \"local\"\n      }\n    }\n  },\n  \"all\": {\n    \"\
  children\": [\n      \"ungrouped\"\n    ]\n  },\n  \"ungrouped\": {\n    \"hosts\"\
  : [\n      \"localhost\"\n    ]\n  }\n}\n```\n\n# 多多个清单 (#toc.xhtml_s36a)\n\n在每次执行时使用多个清单文件是可能的。让我们在此范围内复用我们之前定义的一些\
  \ Ansible 清单。\n\n例如，我们可以通过设置两次 `-i` 参数来指定 `simple_inventory.ini` 和 `localhost_inventory.ini`\
  \ 清单：\n\n```bash\nansible-inventory -i localhost_inventory.ini -i simple_inventory.ini\
  \ --list\n```\n\n结果是两个 Ansible 清单 `localhost_inventory.ini` 和 `simple_inventory.ini`\
  \ 的合并输出：\n\n```json\n{\n  \"_meta\": {\n    \"hostvars\": {\n      \"localhost\"\
  : {\n        \"ansible_connection\": \"local\"\n      }\n    }\n  },\n  \"all\"\
  : {\n    \"children\": [\n      \"ungrouped\",\n      \"web\"\n    ]\n  },\n  \"\
  ungrouped\": {\n    \"hosts\": [\n      \"localhost\",\n      \"server01.example.com\"\
  \n    ]\n  },\n  \"web\": {\n    \"hosts\": [\n      \"server02.example.com\",\n\
  \      \"server03.example.com\"\n    ]\n  }\n}\n```\n\n# 动态清单 (#toc.xhtml_s37a)\n\
  \n当我们的目标主机变化非常快时，我们可能会发现动态生成 Ansible 清单是有用的。典型的用例包括虚拟机管理程序、容器编排器、公共云提供商等。Ansible\
  \ 动态清单是运行某些代码来动态生成 Ansible 清单的方法。生成的 Ansible 清单以 JSON 格式编码，生成代码通常是 Python。动态清单代码通常需要一个包含凭据的配置文件，以便连接到我们的基础设施或云提供商。我们将在第\
  \ 8 章：Ansible Advanced 第三方集成、脆弱性与敏捷性章节分享一些 Ansible 动态清单的示例。\n\n# Windows 清单 (#toc.xhtml_s38a)\n\
  \nWindows 目标主机需要特殊的配置，我们将在第 5 章：Ansible For Windows 中看到。\n\n![](img/33.jpg)\n\n\
  # Ansible Playbook (#toc.xhtml_s39a)\n\nAnsible playbook 是一组针对清单执行的剧（plays）。每个剧由任务（tasks）组成。我们将从一个简单的\
  \ Ansible playbook 开始学习，掌握基础语法，并增加更多技能。大多数 Ansible playbook 和 Ansible 模块都是幂等的。Ansible\
  \ 的**幂等**意味着可以根据需要多次运行相同的自动化任务，并获得相同的结果。\n\n# YAML 语法 (#toc.xhtml_s40a)\n\nAnsible\
  \ playbook 使用 YAML 格式编码。YAML 格式是一种易于人类阅读的编程语言，学习曲线平缓。请看以下示例：\n\n```yaml\n---\n-\
  \ name: Hello World\n  hosts: all\n  tasks:\n    - name: Print message\n      ansible.builtin.debug:\n\
  \        msg: \"Hello World!\"\n```\n\n\n\n\n\n当命令成功时，结果将以绿色显示。橙色是警告消息的指示，红色表示错误。我们可以使用\
  \ `ansible.cfg` 文件来自定义颜色，更多细节请参阅*第 3 章，Ansible 语言扩展* 中的 *Ansible 配置设置* 章节。\n\n让我们逐行查看。\n\
  \n*   开始时，Play 的名称带有 `PLAY` 文本前缀。这仅意味着接下来的任务与“Hello World sample”Play 相关，以便调试代码。输出中的下一行是第一个名为“Gathering\
  \ Facts”的 TASK，它意味着从远程主机获取某些系统信息（Ansible 术语中称为 facts）。\n*   操作结果为“ok”状态，其后跟的是目标节点名称，在本例中为\
  \ `server01.example.com`。绿色确认了操作成功。\n*   第二个 TASK 是我们在代码中定义的，用于在屏幕上显示“Hello World!”消息。我们通常会看到“ok”状态和\
  \ `localhost` 目标节点。\n*   最后一行是 PLAY RECAP 表格，它总结了目标主机和任务报告的状态。在本例中，只有 `server01.example.com`\
  \ 两个“ok”状态。请注意，可能还有状态。\n\n![](img/36.jpg)\n\n## 检查\n\n`check` 选项允许我们在目标主机上执行只读操作。并不是所有模块都支持\
  \ check 。\n\n使用 `--check` 选项允许我们对目标节点执行只读操作。\n\n`ansible-playbook --check helloworld.yml`\n\
  \n使用 `helloworld.yml` Ansible Playbook，我们获得了相同的结果。然而，对于会更改目标节点状态的模块，结果是以只读方式使用的。按照习惯，我们可以如下在终端小部件中执行命令：\n\
  \n```yaml\n---\n- name: Hello World sample\nhosts: all\ntasks:\n- name: Hello message\n\
  \  ansible.builtin.debug:\n  msg: \"Hello World!\"\n…\n```\n\n`--check` 是 `ansible-playbook`\
  \ 命令的一个非常有优势的选项。该选项用于对 playbook 执行进行干运行（dry run）。如果执行 playbook，Ansible 将报告将会发生的更改，但不会对被托管主机进行任何实际更改。\n\
  \n## 调试\n\nAnsible debug 模块允许我们在执行期间在屏幕上打印文本。这种做法在开发阶段非常有用，但在生产环境中很烦人。一些开发者习惯在迁移到生产环境之前删除所有调试消息，但这失去了未来深入研究代码的机会。更好的方法是保留所有的特定调试消息，并指定“verbosity”（详细程度）参数，仅在以详细模式执行执行时显示。我们可以相应地设置四个详细级别，从零到三，如*表\
  \ 2.1*所示：\n\n| 级别 | ansible-playbook 参数 |\n| :--- | :--- |\n| 0 | 无参数 |\n| 1 | -v\
  \ |\n| 2 | -vv |\n| 3 | -vvv |\n| 4 | -vvvv |\n\n**表 2.1：** Ansible 详细级别\n\n例如，让我们在下面的\
  \ playbook 中将详细程度设置为二。\n\n```yaml\n---\n- name: Hello World sample\nhosts: all\n\
  tasks:\n- name: Hello message\n  ansible.builtin.debug:\n  msg: \"Hello World!\"\
  \n  verbosity: 2\n…\n```\n\n让我们逐行分析 Ansible 代码。\n\n1. YAML 文档的开始 (`---`)\n2. Play\
  \ 的名称\n3. 执行的目标宿主机\n4. 任务列表\n5. 其中一个任务名为“Hello message.”\n6. `ansible.builtin` 集合中的\
  \ Ansible 模块 `debug`\n7. `debug` 模块的参数 `msg`\n8. 参数 `verbosity` 为 2。\n\n通过指定详细程度参数，我们可以在\
  \ playbook 中保留调试代码，仅在需要时启用执行。\n\n当我们执行 ansible playbook 而不指定任何详细级别时，将假设详细级别为零：\n\
  \n`ansible-playbook helloworld_debug.yml`\n\n使用零详细级别的预期执行结果是，详细程度高于此的调试处于跳过（skipping）状态。这是本次执行的预期输出：\n\
  \n```\nPLAY [Hello World sample] *****************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************\n\
  ok: [server01.example.com]\nTASK [Hello message] *****************************************************************************\n\
  skipping: [server01.example.com]\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=1 changed=0 unreachable=0 failed=0 skipped=1 rescued=0\
  \ ignored=0\n```\n\n`helloworld_debug.yml` 的输出报告在详细级别为零时，“Hello message”的执行被跳过了，这意味着不在调试模式。我们可以尝试使用以下\
  \ Playbook 代码执行：\n\n```yaml\n---\n- name: Hello World sample\nhosts: all\ntasks:\n\
  - name: Hello message\n  ansible.builtin.debug:\n  msg: \"Hello World!\"\n  verbosity:\
  \ 2\n…\n```\n\n显示调试消息的唯一方法是指定更高的详细级别执行代码（在此场景下为级别二）。我们可以通过在通常的 `ansible-playbook`\
  \ 命令中添加 `-vv` 参数来执行 playbook。请注意启用详细级别二执行的两个 `v`：\n\n`ansible-playbook -vv helloworld_debug.yml`\n\
  \n用详细级别二模式执行时，`helloworld_debug.yml` 的输出现在屏幕上显示了“Hello message”以及关于执行的更多信息：\n\n\
  ```\n[…]\nPLAYBOOK: helloworld_debug.yml *****************************************************************************\n\
  1 plays in helloworld_debug.yml\nPLAY [Hello World sample] *****************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************\n\
  task path: /test/helloworld_debug.yml:2\nok: [server01.example.com]\nMETA: ran handlers\n\
  TASK [Hello message] *****************************************************************************\n\
  task path: /test/helloworld_debug.yml:5\nok: [server01.example.com] => {\n  \"msg\"\
  : \"Hello World!\"\n}\nMETA: ran handlers\nMETA: ran handlers\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0\
  \ ignored=0\n```\n\n## 多个 play\n\n让我们考虑一种场景：前端机器运行 Nginx，后端机器运行 PostgreSQL，如*图 2.4*所示：\n\
  \n![](img/Figure-2.4.jpg)\n\n**图 2.4：** Ansible Playbook 和 Play 架构\n\n更改前端机器上的服务名称以及后端的数据库类型。Ansible\
  \ Playbook 需要处理以下步骤：\n\n*   在前端机器上安装 Nginx Web 服务器\n*   在后端机器上安装 PostgreSQL 数据库\n\
  \n我们可以为每个任务列表（Ansible Play）仅指定一个目标节点。我们有两个选择：编写两个不同的 Playbook（一个用于前端目标主机，另一个用于后端目标主机）或编写一个包含两个\
  \ Play 的 Playbook。让我强调一下，我们可以在一个 Ansible Playbook 中指定多个 Ansible Play。\n\n```yaml\n\
  ---\n- name: webserver\nhosts: web\nbecome: true\ntasks:\n- name: Nginx installed\n\
  \  ansible.builtin.apt:\n  name: nginx\n  state: present\n- name: db\n  hosts: db\n\
  \  become: true\ntasks:\n- name: PostgreSQL installed\n  ansible.builtin.apt:\n\
  \  name: postgresql\n  state: present\n```\n\n正如我们所看到的，在同一个 Ansible Playbook 中使用多个\
  \ Ansible Play 的另一个用途是为了测试。让我们想象以下场景：\n\n*   在前端机器上安装 Web 服务器\n*   从本地机器测试 Web 服务器\n\
  \n\n\n\n\n我们可以通过单个 Playbook 中的两个 Ansible Play 来实现这一场景。例如，我们可以在目标机器上安装 Web 服务器后测试该页面：\n\
  \n```yaml\n---\n- name: webserver\n  hosts: web\n  become: true\n  tasks:\n    -\
  \ name: Nginx installed\n      ansible.builtin.apt:\n        name: nginx\n     \
  \   state: present\n    - name: test page\n    hosts: web1.example.com\n    tasks:\n\
  \      - name: Test page\n        ansible.builtin.uri:\n          url: http://server01.example.com\n\
  ```\n\n# 包含 (Includes)\n\n通过利用团队内部或其他创建者的代码复用，可以加速代码开发。我们可以在团队内部使用单个任务、处理器（handlers）和\
  \ playbook 的 `include` 或 `import` 来执行，或者通过 Ansible `roles` 和 Ansible `collections`\
  \ 使用第三方代码。更多信息请参阅 **[代码复用]* 章节中的 **[第 3 章：Ansible 语言扩展]**。\n\n# Ansible 变量\n\n在变量中存储和检索数据是每种计算机编程语言中的一项关键任务。它使我们能够修改数据或访问某些内容。在\
  \ Ansible 中，这项任务非常重要，因为数据包含了我们的数据中心信息。我们可以在所有的 Python 数据结构中存储数据：字符串、整数、布尔、列表、字典等。\n\
  \n所有这些数据类型都提供了极大的灵活性，并能够在瞬间执行复杂数据操作的能力。\n\n在变量内部，我们可以存储系统的用户账户列表、操作系统信息、机器资源使用情况等内容。\n\
  \nAnsible 变量为给定环境存储动态值。\n\n在我们的 Playbook 中，使用变量来存储我们需要的所有动态值是一个良好的实践。通过编辑变量，我们将来可以根据业务需求相应参数化来复用代码。\n\
  \n## 不允许的变量名\n\n变量名是允许的，但请记住，良好的习惯是始终使用有意义的名称。\n\n下面的 *[表 2.2]*总结了 Ansible 变量的无效变量名。\n\
  \n| 不允许 | 示例 |\n| :--- | :--- |\n| 名称间不能有空格 | `variable name` |\n| 名称间不能有点 | `variable.name`\
  \ |\n| 不能以数字开头 | `3rdvariable` |\n| 不得包含特殊字符 | `variable$1` |\n\n**表 2.2:** 不允许的变量名\n\
  \nAnsible 允许变量名中使用字母和数字的所有组合。如果我们计划使用数字，注意像其他编程语言一样，我们不能将其放在开头。变量名的四个主要限制是：不允许有空格、不允许有点、不能以数字开头以及不能包含特殊字符。因此，在右侧我们看到了一些无效变量名的示例。\n\
  \n在接下来的章节中，我们将探索：\n\n* 用户定义变量\n* 额外变量 (Extra variables)\n* 主机和组变量\n* 数组变量\n* 注册变量\
  \ (Registered variables)\n\n## 用户定义变量\n\n用户定义变量是最流行的，与许多编程语言中的变量相似。变量的数据类型可以在 **[表\
  \ 2.3]* 中总结。声明使用 `vars` 语句执行，后紧跟每个变量及其值的列表。核心变量类型是 Python 允许的类型，因此：如字符串、数字、布尔、列表、字典等。我们可以在\
  \ ansible playbook 的任何部分通过在双大括号之间指定名称来轻松地获取变量值，例如：`{{ name }}`。\n\n| 类型 | 示例 |\n\
  | :--- | :--- |\n| `string` | `message: \"Hi!\"`, `memory: 2Gb` |\n| `numeric integer`\
  \ | `cpus: 2` |\n| `numeric float` | `bandwidth: 123.45` |\n| `boolean (true/false\
  \ or yes/no)` | `verify_ssl: true`, `connected: no` |\n\n**表 2.3:** 标量数据类型\n\n以下示例声明了一个变量\
  \ `operatingsystem`，赋值为 `Linux`，并使用 Ansible debug 模块打印到屏幕：\n\n```yaml\n---\n- name:\
  \ Variable print sample\n  hosts: all\n  vars:\n    operatingsystem: \"Linux\"\n\
  \  tasks:\n    - name: Print variable\n      ansible.builtin.debug:\n        msg:\
  \ \"Print the value of variable {{ operatingsystem }}\"\n```\n\n`variableprint.yml`\
  \ 文件：\n\n1. YAML 开始符号 `---`\n2. play 的名称\n3. 目标主机 (`all`)\n4. 用户定义变量列表 `vars`\n\
  5. `operatingsystem` 是变量名\n6. 任务列表\n7. 一个任务名为 `Print variable`\n8. `ansible.builtin`\
  \ 集合中的 Ansible 模块 `debug`\n9. `debug` 模块的参数 `msg` 用于打印 `operatingsystem` 的值\n\n\
  `variableprint.yml` playbook 与 `helloworld.yml` playbook 类似。除了存在变量 `operatingsystem`\
  \ 之外，其语法和元素结构非常相似。变量存储字符串、数字和更复杂的数据结构（如列表、字典等）。在这种情况下，变量的名为 `operatingsystem`，值为\
  \ `Linux`。在这种情况下，debug 模块将文本 `Print the value of the variable` 与变量 `operatingsystem`\
  \ 的值拼接。请注意双大括号，它表示变量的重要性。最佳实践是始终在代码的双双引号内包含双大括号。\n\n之前的代码会在屏幕上产生以下消息：\n\n`msg: \"\
  Print the value of the variable Linux.\"`\n\n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook`\
  \ 命令执行该 Ansible playbook。完整命令如下：\n\n`ansible-playbook variableprint.yml`\n\n命令的输出如下：\n\
  \n```\nPLAY [Variable print sample] *******************************************************************\n\
  TASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [Print variable] **************************************************************************\n\
  ok: [server01.example.com] => {\n\"msg\": \"Print the value of variable Linux\"\n\
  }\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0\
  \ ignored=0\n```\n\n`variableprint.yml` 执行的输出与 `helloworld.yml` 文件非常相似。请注意通过结合字符串与变量值获得的消息\
  \ `Print the value of variable Linux`。此外，该执行运行良好，如 play 总结区域和绿色颜色所示。总执行量等同于两个任务。\n\
  \n## 多行 (Multiline)\n\n许多场景要求我们将字符串跨行折叠：为了提高代码可读性并符合列数、多行字符串等要求。\n\n在 Ansible 中跨行折叠字符串，可以使用以下运算符：\n\
  \n**字面量块操作符 (|)：** 该运算符告诉 Ansible 将字符串视为字面量块操作符。这意味着 Ansible 将保留字符串中的换行符。例如，以下代码将创建一个名为\
  \ `my_variable` 的变量，其内容如下：\n\n```yaml\nmy_variable = |\nThis is a\nmultiline string\n\
  ```\n\n**折叠块操作符 (>)：** 该运算符告诉 Ansible 将字符串视为折叠块操作符。这意味着 Ansible 将将字符串中的所有换行符合并为空格。例如，以下代码将创建一个名为\
  \ `my_variable` 的变量，其内容如下：\n\n```yaml\nmy_variable = >\nThis is a\nmultiline string\n\
  ```\n\n\n\n\n字面块标量（literal block scalar）和折叠块标量（folded block scalar）运算符之间的区别在于，字面块标量运算符会保留字符串中的换行符，而折叠块标量运算符会将字符串中的所有换行符合并为空格。\n\
  \n这两个运算符都支持添加“-”号，用于移除字符串末尾的任何换行符。带有换行移除功能的运算符变为：\n\n- `|-`: 不带换行的字面块标量。\n- `>-`:\
  \ 不带换行的折叠块标量。\n\n## 额外变量\n\n额外变量（extra variable）是从命令行传递值的一种方式。当我们尝试将 Ansible 集成到当前的工具链中，或者只是从命令行对\
  \ playbook 进行参数化时，这种方法非常有优势。让我们执行与之前示例相同的代码，但我们要在不更改代码的情况下将变量 `operatingsystem`\
  \ 的值从 Linux 改为 Windows。我们只需要在命令行 `ansible-playbook` 中指定 `-e` 参数，后跟变量名和值。在这种情况下，`-e\
  \ operatingsystem=Windows` 允许我们从命令行指定变量的值。\n\n完整命令如下：\n\n```\nansible-playbook -e\
  \ \"operatingsystem=Windows\" variableprint.yml\n```\n\n命令的输出如下：\n\n```\nPLAY [Variable\
  \ print sample] ***************************************************\nTASK [Gathering\
  \ Facts] *********************************************************\nok: [host1.example.com]\n\
  TASK [Print variable] **********************************************************\n\
  ok: [host1.example.com] => {\n\"msg\": \"Print the value of variable Windows\"\n\
  }\nPLAY RECAP *********************************************************************\n\
  host1.example.com : ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n\
  ```\n\n我们可以通过覆盖 playbook 变量从命令行指定值。在命令行上设置的变量称为额外变量。`variableprint.yml` 的执行输出与之前的非常相似。请注意通过组合字符串与变量值而得到的\
  \ `Print the value of variable Windows` 消息。从命令行传递的值会覆盖 playbook 中的任何值。\n\n## 主机和组变量\n\
  \n我们还可以在清单文件（inventory file）中定义变量。在主机级别定义的变量称为主机变量（host variables）。同样，在组级别定义的变量称为组变量（group\
  \ variables）。\n\n我们将看到以下内容的示例：\n- INI 清单中的主机变量\n- INI 清单中的组变量\n- 文件系统中的主机变量\n- 文件系统中的组变量\n\
  \n## INI 清单中的主机变量\n\n在主机变量中指定 `ansible_user` 值后跟用户名以指定用于登录服务器的帐号是有效的。\n\n这是一个为服务器\
  \ `host1.example.com` 指定登录用户 `devops` 的清单示例。通过这种方式，我们可以为每个目标主机指定不同的用户。\n\n## 主机变量\n\
  \n主机变量为 Ansible 清单中的单个主机设置值。让我们为单个主机将变量 `ansible_user` 定义为 `devops`：\n\n```\n[servers]\n\
  host1.example.com ansible_user=devops\n```\n\n## 文件系统中的主机变量\n\n我们可以通过将清单文件与变量文件分离来获得相同的\
  \ Ansible 清单。\n\n我们需要创建一个类似于所示文件的清单文件：\n\n```\n[servers]\nhost1.example.com\n```\n\
  \n然后，在 `host_vars` 目录下创建一个与主机名完全相同的主机变量文件。`host_vars/host1.example.com` 文件包含了主机\
  \ `host1.example.com` 的变量。\n\n```\nansible_user=devops\n```\n\n## 组变量\n\n组变量为 Ansible\
  \ 清单中的一组主机设置值。我们可以指定一个组变量，将 `servers` 组中所有目标主机的 `ansible_user` 变量设置为 `foo`：\n\n\
  ```\n[servers]\nhost1.example.com\nhost2.example.com\n[servers:vars]\nansible_user=foo\n\
  ```\n\n该组变量应用于 `host1.example.com` 和 `host2.example.com`，并具有相同的 `foo` 值。\n\n## 文件系统中的组变量\n\
  \n同样，我们可以通过文件系统将组变量应用于清单组。假设我们有一个包含 `servers` 组的清单，如下：\n\n```\n[servers]\nhost1.example.com\n\
  host2.example.com\n```\n\n与组名完全相同的组变量文件位于 `group_vars` 目录。`group_vars/servers` 文件包含组\
  \ `servers` 的变量：\n\n```\nansible_user=foo\n```\n\n我们可以使用目录来填充主机和组变量来实现相同的结果。正如我们所看到的，结果与之前的主机和组清单相同，但使用了更多的文件。\n\
  \n## 数组变量\n\n当我们需要指定适用于对象的某些属性时，数组变量是至关重要的。假设我们有一个包含 `foo` 和 `bar` 的用户。它们每一个都有自己的\
  \ `username` 和 `homedir` 变量。\n\nAnsible Playbook 的开头如下代码所示。请注意 `vars` 语句下的数组变量结构：\n\
  \n```yaml\n---\n- name: Array sample\n  hosts: all\n  vars:\n    users:\n      foo:\n\
  \        username: foo\n        homedir: /users/foo\n      bar:\n        username:\
  \ bar\n        homedir: /users/bar\n  tasks:\n    - name: print foo's username\n\
  \      ansible.builtin.debug:\n        var: users.foo.username\n```\n\n类似于 Python\
  \ 编程语言，我们可以使用点号 (.) 或括号符号 ([]) 访问每个属性。\n\n点表示法\n代码 `users.foo.username` 打印 `foo`\
  \ 的值。\n\n括号表示法\n代码 `users['foo']['username']` 打印 `foo` 的值。\n\n我们可以按照分级数据结构组织信息。一种很有用的数据结构是数组。例如，用户列表可以被\
  \ `foo` 和 `bar` 轻松读取。每个列表元素都有两个属性：名字和主主目录。我们可以使用点表示法或方括号访问数据。在两种情况下，由于我们的逻辑一致，都会获得相同的结果。\n\
  \n执行 `array.yml` 文件的完整命令如下：\n\n```\nansible-playbook array.yml\n```\n\n命令的输出如下：\n\
  \n```\nPLAY [Array sample] ****************************************************************************\n\
  TASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [print foo's username] *****************************************************************\n\
  ok: [server01.example.com] => {\n\"users.foo.username\": \"foo\"\n}\nPLAY RECAP\
  \ *****************************************************************************\n\
  server01.example.com: ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0\
  \ ignored=0\n```\n\n`array.yml` 的执行输出与之前的非常相似。Ansible 访问了变量数组值并按预期在输出消息中显示。我们可以注意到产生了\
  \ `Print foo's first name: foo`。\n\n## 注册变量\n\n另一种功能性数据结构是注册变量（registered variables）。我们可以将任何命令的输出保存到注册变量。在本示例中，在屏幕上打印结果。\n\
  \n```yaml\n---\n- name: Install a package and prints the result\n  hosts: all\n\
  \  become: true\n  tasks:\n    - name: Install the package\n      ansible.builtin.yum:\n\
  \        name: wget\n        state: installed\n      register: install_result\n\
  \    - name: debug\n      ansible.builtin.debug:\n        var: install_result\n\
  ```\n\n\n\n\n首先，`yum` 模块会检查软件包是否存在；如果缺失，则继续安装。设置过程的输出将存储在一个注册的变量中，并打印在屏幕上。`registeredvariables.yml`\
  \ 的执行结果显示了执行的一些任务。\n\n完整命令如下：\n\n```\nansible-playbook registeredvariables.yml\n\
  ```\n\n该命令的输出如下：\n\n```\nPLAY [Installs a package and prints the result] ************************************************\n\
  TASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [Install the package] *********************************************************************\n\
  ok: [server01.example.com]\nTASK [debug] *****************************************************************************\n\
  ok: [server01.example.com] => {\n  \"install_result\": {\n    \"cache_update_time\"\
  : 1660746334,\n    \"cache_updated\": false,\n    \"changed\": false,\n    \"failed\"\
  : false\n  }\n}\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=3 changed=0 unreachable=0 failed=0 skipped=0 rescued=0\
  \ ignored=0\n```\n\n请参考 Ansible Facts 中的后续章节 *Temporary Facts*（临时事实*），以创建一个新变量来处理命令的输出。\n\
  \n## 将变量写入文件\n\n在 Ansible 中，将变量写入文件有两种主要方法：\n\n* 使用 Ansible copy 模块\n* 使用 Ansible\
  \ template 模块\n\nAnsible copy 模块是将变量写入文件的简单方法。要使用它，我们需要指定变量名、目标文件路径以及文件内容。例如：\n\n\
  ```yaml\n- name: Write variable to a file\n  ansible.builtin.copy:\n    path: ./myfile.txt\n\
  \    content: \"{{ operatingsystem }}\"\n    state: present\n```\n\n这将创建一个名为 `myfile.txt`\
  \ 的文件，其内容包含 `operatingsystem` 变量的值。\n\nAnsible template 模块是将变量写入文件的一种更灵活的方法。它允许我们使用\
  \ Jinja2 模板来生成文件内容。\n\n例如：\n\n```yaml\n---\n- name: Array sample\n  hosts: all\n\
  \  vars:\n    operatingsystem: Linux\n  tasks:\n    - name: Write variable to a\
  \ file\n      Ansible.builtin.template:\n        src: mytemplate.j2\n        dest:\
  \ myfile.txt\n```\n\n`mytemplate.j2` 文件内容如下：\n\n```\n{{ operatingsystem }}\n```\n\
  \n这将创建一个名为 `myfile.txt` 的文件，其包含以下文本：\n\n```\nLinux\n```\n\n使用 Ansible template 模块的主要优势是，它允许我们使用\
  \ Jinja2 模板来生成文件内容。当我们需要创建包含复杂或动态内容的文件时，这将非常有用。\n\n使用 Ansible template 模块的主要缺点是它可能比\
  \ Ansible copy 模块更难使用。如果我们不熟悉 Jinja2 模板，可能会发现编写产生所需输出的模板非常困难。\n\n总的来说，如果我们需要创建一个包含静态值的简单文件，Ansible\
  \ copy 模块是一个很好的选择。如果我们需要创建一个包含复杂或动态内容的文件，Ansible template 模块是一个很好的选择。\n\n# Ansible\
  \ Facts\n\nAnsible facts 是与远程主机相关的变量。远程系统相关的变量被称为 facts（事实）。它们非常强大，因为我们可以获取当前主机、操作系统、所使用的发行版、IP\
  \ 地址、网络配置、存储配置等方面的全面视图。通过 facts，我们可以将一个系统的行为或状态作为其他系统的配置。\n\n# Ansible ad-hoc\n\n\
  理解 Ansible facts 的最佳方法是使用这个简单的 Ansible ad-hoc 命令自行列出它们：\n\n```\nansible -m setup\
  \ host1.example.com\n```\n\n将命令调整到目标主机；显然，`host1.example.com` 仅用于我的实验室。\n\nFacts\
  \ 非常有用，因为它们包含了关于硬件和软件的以下信息以及由操作系统指定的某些目标主机信息。\n\n最常用当前硬件配置：架构、处理器、RAM、可用内存、存储配置、操作系统、所使用的\
  \ Linux 发行版、IP 地址、网络配置、存储配置等。\n\n这只是使用上述命令获取的长列表的开始。ansible 命令产生如下输出：\n\n```\n[...]\n\
  \"ansible_architecture\": \"arm64\",\n\"ansible_date_time\": {\n  \"date\": \"2023-04-05\"\
  ,\n  \"day\": \"05\",\n  \"epoch\": \"1680726722\",\n  \"epoch_int\": \"1680726722\"\
  ,\n  \"hour\": \"22\",\n  \"iso8601\": \"2023-04-05T20:32:02Z\",\n  \"iso8601_basic\"\
  : \"20230405T223202059078\",\n  \"iso8601_basic_short\": \"20230405T223202\",\n\
  \  \"iso8601_micro\": \"2023-04-05T20:32:02.059078Z\",\n  \"minute\": \"32\",\n\
  \  \"month\": \"04\",\n  \"second\": \"02\",\n  \"time\": \"22:32:02\",\n  \"tz\"\
  : \"CEST\",\n  \"tz_dst\": \"CEST\",\n  \"tz_offset\": \"+0200\",\n  \"weekday\"\
  : \"Wednesday\",\n  \"weekday_number\": \"3\",\n  \"weeknumber\": \"14\",\n  \"\
  year\": \"2023\"\n},\n\"ansible_default_ipv4\": {\n  \"address\": \"192.168.58.46\"\
  ,\n  \"broadcast\": \"192.168.58.255\",\n  \"device\": \"en0\",\n[...]\n```\n\n\
  只需记录下我们感兴趣的 Ansible Fact 名称即可，因为我们将在 Ansible Playbook 中使用它。\n\n## Playbook 中的 facts\n\
  \n我们可以从 Ansible playbook 中获取相同数量的数据。在这个简单的示例中，我们将列出所有清单主机的所有 ansible facts。预期结果将与之前的\
  \ ad-hoc 执行结果相同。\n\n请注意，这需要启用 `gather_facts`。`gather_facts` 语句对于从目标机器获取 ansible\
  \ facts 并在 Playbook 中使用它们是必要的。\n\n提示：在不需要时禁用 `gather_facts` 以加速 Ansible 执行：\n\n\
  ```yaml\n---\n- name: facts_printall\n  hosts: all\n  gather_facts: true\n  tasks:\n\
  \    - name: Print all facts\n      ansible.builtin.debug:\n        var: ansible_facts\n\
  ```\n\n执行结果将在屏幕上打印 `ansible_facts` 变量列表及其值。例如，一小部分显示了变量 `architecture` 的值为 `x864`：\n\
  \n```\n\"ansible_facts\": {\n  \"architecture\": \"x864\",\n[...]\n```\n\n`facts_printall.yml`\
  \ 的执行输出显示了目标节点的内容。结果非常长，包含了 Ansible 在 Gathering Facts 任务中获取的所有事实。# 单 fact\n\n我们可以通过指定具体的\
  \ fact 名称来轻松与其交互。根据需要自定义代码。在示例中，我们正在列出管理节点的架构。`facts_printone.yml` 文件如下：\n\n```yaml\n\
  ---\n- name: facts_printone\n  hosts: all\n  gather_facts: true\n  tasks:\n    -\
  \ name: Print a fact\n      ansible.builtin.debug:\n        msg: \"architecture:\
  \ {{ ansible_facts['architecture'] }}\"\n```\n\n可以使用每个 Ansible 安装中包含的 `ansible-playbook`\
  \ 命令执行 `facts_printone.yml` Playbook 文件。带有清单的完整命令如下：\n\n```\nansible-playbook facts_printone.yml\n\
  ```\n\n上述命令的执行结果如下：\n\n```\nTASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [Print a fact] *************************************************多数\n\
  ok: [server01.example.com] => {\n  \"msg\": \"architecture: x8664\"\n}\nPLAY RECAP\
  \ *****************************************************************************\n\
  server01.example.com: ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0\
  \ ignored=0\n```\n\n## 临时事实\n\n我们可以使用 `ansible.builtin.set_fact` 模块定义一些临时事实。\n\n\
  \n\n\n`ansible.builtin` 中的 `set_fact` 模块用于添加新的 Ansible facts。它主要用于将来自注册输出和现有 facts\
  \ 的数据转换为新的结构。创建的 facts 可供后续的所有任务使用。\n\n以下 `facts_temporary.yml` Ansible 剧本在 `ansible_distribution`\
  \ fact 值为 Red Hat Enterprise Linux 时创建一个临时 fact。基本上，当该条件被核实时，我们使用值 `rhel` 来重写 `ansible_distribution`\
  \ fact：\n\n```yaml\n---\n- name: Temporary Facts\n  hosts: all\n  tasks:\n    -\
  \ name: Set mydistribution\n      ansible.builtin.set_fact:\n        mydistribution:\
  \ >-\n          \"{{ 'rhel' if (ansible_distribution == 'Red Hat Enterprise Linux')\
  \ else ansible_distribution }}\"\n    - name: Print mydistribution\n      ansible.builtin.debug:\n\
  \        var: mydistribution\n```\n\n我们可以在 Ansible 的条件（Conditional）部分了解更多关于 if 语句的知识。折叠块标量操作符（`>-`）的使用是在\
  \ Ansible 变量（Variables）段落的多行（Multiline）部分中引入的。\n\n如往常，我们可以使用 `ansible-playbook`\
  \ 命令通过完整命令执行 `facts_temporary.yml` 剧本文件：\n\n```bash\nansible-playbook facts_temporary.yml\n\
  ```\n\n在 macOS 操作系统上执行产生以下输出：\n\n```text\nTASK [Print mydistribution] *****************************************************************************\n\
  ok: [server01.example.com] => {\n  \"mydistribution\": \"\\\"MacOSX\\\"\"\n}\n```\n\
  \n而在 Red Hat Enterprise Linux 操作系统上执行产生：\n\n```text\nTASK [Print mydistribution]\
  \ *****************************************************************************\n\
  ok: [server01.example.com] => {\n  \"mydistribution\": \"\\\"rhel\\\"\"\n}\n```\n\
  \n## 自定义 facts\n\n除了 setup 模块（`ansible.builtin`）创建的默认 facts 和 set_fact 模块创建的临时 facts\
  \ 外，Ansible 还支持创建自定义 facts。\n\n我们可以在目标机器的 `/etc/ansible/facts.d` 目录下定义自定义 facts。所有\
  \ fact 文件都具有 `.fact` 扩展名。如果 fact 文件是可执行的，Ansible 将运行它。否则，Ansible 将尝试将其视为 INI 或 JSON\
  \ 格式。自定义 facts 由“setup”模块（`ansible.builtin`）加载。\n\n自定义 facts 放置在一个名为 `ansible_local`\
  \ 的独立字典中，并自定义 fact 的文件名组织：`ansible_local['fact file name']`。\n\n自定义 facts 在安装后不会自动加载，因此我们需要等待下一次执行（play）或手动重新运行“setup”。\n\
  \n`/etc/ansible/facts.d/infrastructure.fact` 文件如下：\n\n```ini\n[system]\ntype=dr\n\
  ```\n\n我们可以通过以下任务在剧本中访问所有 Ansible 自定义 facts：\n\n```yaml\n- name: display ansible_local\n\
  \  ansible.builtin.debug:\n    var: ansible_local\n```\n\n或者使用自定义 fact 中的任何属性来访问任何特定属性：\n\
  \n```yaml\n- name: print system type\n  ansible.builtin.debug:\n    msg: \"The system\
  \ type is {{ ansible_local.infrastructure.system.type }}\"\n```\n\n代码的输出在屏幕上显示 `dr`\
  \ 系统类型。\n\n# Ansible 魔法变量 (Magic Variables)\n\nAnsible 魔法变量包含一些关于目标主机的信息。魔法变量是 Ansible\
  \ 的内部变量，有时大有用用场。\n\n有时初学者用户会将 Ansible facts 与魔法变量混淆。\n\n主要的区别在于，魔法变量不需要在 Ansible\
  \ 剧本的开始时启用 `gather_facts`，而 Ansible Facts 却需要。\n\n## 常用魔法变量\n\n这些是最常用的五个魔法变量：\n\n\
  *   `hostvars`: 通过 `hostvars`（主机变量）魔法变量，我们可以访问 play 中为任何主机定义的变量。当我们想从一个主机访问另一个主机的属性时，这种方法非常有优势。可以将主机变量与\
  \ ansible facts 结合访问另一个主机的属性。\n*   `groups`: `groups` 魔法变量列出清单（inventory）中的所有组。结合使用\
  \ `groups` 和主机变量魔法变量可以列出组内所有主机的 IP 地址。\n*   `group_names`: 当前主机所属组列表。\n*   `inventory_hostname`:\
  \ `inventory_hostname` 魔法变量包含清单中配置的主机名称。\n*   `ansible_version`: `ansible_version`\
  \ 魔法变量包含关于 Ansible 的版本信息。\n\n## Ansible 版本\n\n以下示例在屏幕上打印当前使用的 Ansible 版本。其底层依赖于\
  \ `ansible_version` 魔法变量。`ansible_version.yml` 文件如下：\n\n```yaml\n---\n- name: ansible_version\
  \ print\n  hosts: all\n  tasks:\n    - name: ansible_version display\n      ansible.builtin.debug:\n\
  \        var: ansible_version\n```\n\n执行输出如下。如我们所见，结果显示了完整版本 2.13.3、主版本 2、次版本 13\
  \ 以及修订版本 3，以及整个字符串 2.13.3。\n\n我们可以使用每个 Ansible 安装包含的 `ansible-playbook` 命令执行代码。完整命令如下：\n\
  \n```bash\nansible-playbook ansible_version.yml\n```\n\n命令的输出如下：\n\n```text\nTASK\
  \ [ansible_version display] *****************************************************************\n\
  ok: [server01.example.com] => {\n  \"ansible_version\": {\n    \"full\": \"2.13.3\"\
  ,\n    \"major\": 2,\n    \"minor\": 13,\n    \"revision\": 3,\n    \"string\":\
  \ \"2.13.3\"\n  }\n}\n```\n\nAnsible 魔法变量在我们的 Ansible 剧本非常重要，特别是当我们需要执行某些影响清单中所有主机的操作时。我们可以应用在后续课程中探索的循环（loop）或其他语句。例如，为列表中涉及的所有主机生成自定义的\
  \ `/etc/hosts` 文件。\n\n# Ansible 条件 (Conditional)\n\n条件语句检查条件并据此改变程序的行为。在每种计算机编程语言中，我们几乎都需要检查条件并相应改变程序行为的能力。条件语句赋予了我们这种能力。Ansible\
  \ 的形式是 `when` 语句。Ansible 在条件中使用 Jinja2 测试和过滤器。Ansible 支持所有标准测试和过滤器，并添加了一些独特的。\n\n\
  ## 使用“when”的基础条件\n\n`when` 语句定义了任务是否将被执行。我们可以在每个 Ansible 剧本任务或块中使用 `when` 语句。只需添加带有条件的\
  \ `when` 语句即可。\n\n在现实世界中，我们可以使用：\n\n*   使用括号 `()` 的复杂表达式\n*   比较运算符 `==`, `>=`,\
  \ `<=`, `!=`\n*   使用 Ansible Facts (`ansible_facts['os_family'] == \"Debian\"`)\n\
  \n在以下示例中，一个简单的布尔变量控制执行。显然，我们需要一个真状态来执行任务。`conditional_basic_false.yml` 文件如下：\n\n\
  ```yaml\n---\n- name: conditional basic\n  hosts: all\n  vars:\n    configure_nginx:\
  \ false\n  tasks:\n    - name: reload nginx\n      ansible.builtin.service:\n  \
  \      name: nginx\n        state: reloaded\n      when: configure_nginx\n```\n\n\
  当 `configure_nginx` 布尔变量为 `true` 时，会执行 reload nginx 任务。\n\n在这个示例中，变量始终为 `false`，因此我们预计该任务在执行输出期间跳过。\n\
  \n我们可以使用所有 Ansible 安装包含的 `ansible-playbook` 命令行工具执行 Ansible 剧本。\n\n命令如下：\n\n```bash\n\
  ansible-playbook conditional_basic_false.yml\n```\n\n我们可以使用参数 `-i` 通过本地文件清单指定 Ansible\
  \ 清单。简单的是本地 Ansible 清单。`conditional_basic_false.yml` 是我们 Ansible 剧本的文件名。\n\n\n\n\
  \n我们期望看到任务输出一个跳过（skipped）状态，即在执行期间该语句的结果为假。\n\n在下面的输出中，我们看到 `reload nginx` 任务处于跳过状态，并在最后的\
  \ Play 摘要（Play Recap）中显示 `skipped=1`：\n\n```\nPLAY [conditional basic] ***********************************************************************\n\
  TASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [reload nginx] ****************************************************************************\n\
  skipping: [server01.example.com]\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=1 changed=0 unreachable=0 failed=0 skipped=1 rescued=0\
  \ ignored=0\n```\n\n本次执行针对 `server01.example.com` 节点运行 play，输出以绿色和蓝色高亮。正如我们所看到的，由于我们的条件语句，`reload\
  \ nginx` 任务显示为跳过状态。\n\n接下来的示例将 `configure_nginx` 变量设置为布尔值 `true`。我们期望这次执行将运行 `reload\
  \ nginx` 任务。`conditional_basic_true.yml` 文件内容如下：\n\n```yaml\n---\n- name: conditional\
  \ basic\n  hosts: all\n  vars:\n    configure_nginx: true\n  tasks:\n    - name:\
  \ reload nginx\n      ansible.builtin.service:\n        name: nginx\n        state:\
  \ reloaded\n      when: configure_nginx\n```\n\n这是我们在 Ansible playbook 中使用 `when`\
  \ 语句的另一个基本用法示例，但我们将变量值从 `false` 改为了 `true`。`reload nginx` 任务执行了，因为 `configure_nginx`\
  \ 布尔变量被设置为 `true`。我们可以使用 `ansible-playbook` 命令来执行 playbook：\n\n`ansible-playbook\
  \ conditional_basic_true.yml`\n\n参数 `conditional_basic_true.yml` 是 Ansible Playbook\
  \ 的文件名。执行上一个的 `ansible-playbook` 命令产生了以下输出：\n\n```\nTASK [reload nginx] ****************************************************************************\n\
  changed: [server01.example.com]\n```\n\n正如我们看到的，`reload nginx` 任务被 Ansible 读取并在我们的条件语句下成功执行，状态已改变。在本次执行中，play\
  \ 针对 `server01.example.com` 节点运行，每一行 ok 状态的输出都以绿色高亮。\n\n## 基于 Ansible facts 的条件\n\
  \n将条件（conditionals）与事实（facts）相结合非常方便。因此我们可以根据单个主机的条件、IP 地址、操作系统、文件系统状态等来调整代码的执行。\n\
  \n在这个示例中，我们将按照 `conditional_facts.yml` 文件所示，执行类 RedHat 主机的关闭：\n\n```yaml\n---\n\
  - name: conditional_facts\n  hosts: all\n  tasks:\n    - name: Shut down RedHat-like\
  \ systems\n      ansible.builtin.command: /sbin/shutdown -t now\n      when: ansible_facts['os_family']\
  \ == \"RedHat\"\n```\n\n我们可以使用 `ansible-playbook` 命令来执行 playbook：\n\n`ansible-playbook\
  \ conditional_facts.yml`\n\n参数 `conditional_facts.yml` 是 Ansible Playbook 的文件名。以下是上一个命令的输出：\n\
  \n```\nTASK [Shut down RedHat-like systems] ***********************************************************\n\
  skipping: [server01.example.com]\n```\n\n在本次执行中，play 针对 server01.example.com 节点执行。目标主机不是类\
  \ RedHat 系统，因为我们可以注意到名为“Shut down RedHat-like systems”的任务处于被跳过的状态。\n\n作为参考，存储在变量\
  \ `ansible_facts['os_family']` 中的 Ansible Fact 完整值列表有：AIX, Alpine, Altlinux, Archlinux,\
  \ Darwin, Debian, FreeBSD, Gentoo, HP-UX, Mandrake, RedHat, SGML, Slackware, Solaris,\
  \ Suse 和 Windows。\n\n条件语句至关重要，因为它们允许我们创建响应某些事件、条件或 Ansible Facts 的 Ansible Playbooks。这种语句是智能\
  \ Ansible Playbook 的基础。\n\n# Ansible Loop\n\n与每种编程语言一样，循环是重复执行任务最重要的部分。Ansible 根据我们想要实现的交互提供了几种语句。\n\
  \n## Loop 语句\n\nLoop 语句自动化了我们 Ansible Playbook 中的重复性任务。计算机比人类更擅长无错误地重复相同或相似的任务。一组语句的重复执行被称为迭代。\n\
  \nAnsible 有几种用于迭代的语句：\n\n* `loop`\n* `with_items`\n* `with_file`\n* `with_sequence`\n\
  * `with_fileglob`\n\n我们将重点关注其中两种语句：\n\n* `loop` 语句\n* `with_items` 语句\n\n`with_items`\
  \ 语句更加通用，并且可以依赖外部插件。\n\n## loop 语句\n\n简单的循环对一个项列表中的任务进行迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为值。`loop_simple.yml`\
  \ 文件如下：\n\n```yaml\n---\n- name: Check services\n  hosts: all\n  tasks:\n    - name:\
  \ httpd and sshd are running\n      ansible.builtin.service:\n        name: \"{{\
  \ item }}\"\n        state: started\n      loop:\n        - apache2\n        - sshd\n\
  ```\n\n在我们的模块内部，我们可以使用 loop 变量，Ansible 将其替换为当前值。可以使用所有安装中包含的 `ansible-playbook`\
  \ 命令工具执行 Playbook。完整命令如下：\n\n`ansible-playbook loop_simple.yml`\n\n参数 `loop_simple.yml`\
  \ 指定了我们的 Playbook 文件名。该命令的执行产生了以下输出：\n\n```\nTASK [print values of data] ****************************************************\n\
  ok: [server01.example.com] => (item=apache2) => {\n  \"msg\": \"apache2\"\n}\nok:\
  \ [server01.example.com] => (item=sshd) => {\n  \"msg\": \"sshd\"\n}\n```\n\nloop\
  \ 列表不应该是简单值的列表。在下面的示例中，列表中的每个项都是哈希（hash）或字典（dictionary）。\n\n示例中的每个哈希或字典有两个键：name\
  \ 和 groups，每个键的值可以分别通过 `item.name` 和 `item.group` 变量获取。`loop_hash_or_dict.yml` 文件如下：\n\
  \n```yaml\n---\n- name: Users exist in the correct group\n  hosts: all\n  tasks:\n\
  \    - name: Users exist in the correct group\n      ansible.builtin.user:\n   \
  \     name: \"{{ item.name }}\"\n        state: present\n        groups: \"{{ item.group\
  \ }}\"\n      loop:\n        - name: foo\n          group: wheel\n        - name:\
  \ bar\n          group: root\n```\n\n一如既常，我们可以使用 `ansible-playbook` 命令执行 playbook：\n\
  \n`ansible-playbook loop_hash_or_dict.yml`\n\n使用 `loop_hash_or_dict.yml` 作为 Ansible\
  \ Playbook 文件名。该命令产生了以下输出：\n\n```\nTASK [Users exist in the correct group] ***********************************************\n\
  changed: [server01.example.com] => (item={'name': 'foo', 'group': 'wheel'})\nchanged:\
  \ [server01.example.com] => (item={'name': 'bar', 'group': 'root'})\nPLAY RECAP\
  \ *************************************************************\nserver01.example.com:\
  \ ok=2 changed=1 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n```\n\n##\
  \ with_items 语句的兄弟语句\n\n`with_items` 不是 Ansible 语言中唯一的可用语句。所有以 `with_` 开头的 loop\
  \ 语句都是：\n\n* `with_items statement`：与简单列表、字符串列表或哈希/字典列表交互。如果提供了列表列表，则会扁平化为列表。\n\
  * `with_file statement`：此关键字需要控制节点文件名列表。loop 变量 item 包含文件内容。\n\n\n\n\n- `with_sequence\
  \ statement`: 该关键字需要参数根据数值序列生成值列表。\n- `with_fileglob statement`: 此语句列出匹配模式的文件。例如，我们可以指定\
  \ `*.txt` 参数来列出目标节点上所有带有 txt 扩展名的文件。\n\n在接的示例中，我们将使用 `with_items` 遍历一个名为 `data`\
  \ 的列表，该列表包含系统中的用户列表。以下示例在包含两个项目（`foo` 和 `bar`）的 data 列表类型之间循环。`loop_with_items.yml`\
  \ 文件如下：\n\n```yaml\n---\n- name: Example with_items\n  hosts: all\n  vars:\n   \
  \ data:\n    - foo\n    - bar\n  tasks:\n    - name: Print values of data\n    \
  \  ansible.builtin.debug:\n        msg: \"{{ item }}\"\n      with_items: \"{{ data\
  \ }}\"\n```\n\n我们可以使用 `ansible-playbook` 命令执行 playbook：\n\n```bash\nansible-playbook\
  \ loop_with_items.yml\n```\n\n参数 `loop_with_items.yml` 指定了 Ansible Playbook 的文件名。它产生以下输出：\n\
  \n```text\nTASK [Print values of data] ********************************************************************\n\
  ok: [server01.example.com] => (item=foo) => {\n  \"msg\": \"foo\"\n}\nok: [server01.example.com]\
  \ => (item=bar) => {\n  \"msg\": \"bar\"\n}\n```\n\n在 `loop_with_items.yml` playbook\
  \ 中，变量 `data` 是一个字符串列表。任务 `Print values of data` 使用 `with_items` 逐项迭代并打印到屏幕上。\n\n\
  循环语句对于自动化重复任务非常有用。循环是构建成功的 Ansible Playbook 的基石。\n\n# 结论\n\nAnsible 语言包含了数据结构和任务，以实现共同目标。我们学习了如何使用变量、循环和条件语句在我们的数据中心执行任何操作。Ansible\
  \ 清单（inventory）是我们自动化的核心，在其中我们定义目标主机以及一些相关的主机或组变量。一些工具如 Ansible facts（事实）、魔法变量（magic\
  \ variables）以及在单个 Playbook 中包含多个 Plays，使得我们能够实现最成功的自动化。在下一章中，我们将学习 Ansible 语言的扩展、如何存储敏感数据、如何使用扩展插件，以及如何通过\
  \ role 和 collection 实现代码复用。\n\n# 注意事项\n\n- Ansible 清单（Inventories）采用 INI、YAML 或\
  \ JSON 格式，包含目标主机的列表。\n- Ansible Playbook 将针对目标主机的 Ansible Play 与任务列表结合。\n- Ansible\
  \ 变量允许我们在不同的上下文中对 Playbook 进行参数化和复用。\n- Ansible Facts 包含目标主机的系统信息，Ansible Magic\
  \ Variables 用于访问某些内部变量。\n\n# 单选题\n\n1. Ansible 清单的格式有哪些？\n   1. YAML, Python, 和\
  \ Java\n   2. INI, YAML, 和 JSON\n   3. INI 和 YAML\n   4. HTML 和 Python\n2. Ansible\
  \ 允许哪些变量命名规范？\n   1. 不以数字开头\n   2. 名字之间可以使用点\n   3. 使用有意义的名字\n   4. 包含特殊字符\n3. 我们如何定义\
  \ `ansible_version` 变量？\n   1. 用户定义变量\n   2. 主机变量\n   3. Ansible fact 变量\n   4.\
  \ Ansible 魔法变量\n4. Ansible 的条件判断语句是什么？\n   1. when\n   2. with_items\n   3. with_file\n\
  \   4. loop\n\n# 答案\n\n1. B\n2. C\n3. D\n4. A\n\n# question\n\n1. 使用 `ansible-inventory`\
  \ 命令行工具显示 Ansible 清单的两种方法是什么？\n2. 我们需要在文件系统中创建哪些文件来存储主机和组变量？\n3. `ansible-playbook`\
  \ 命令行工具常用的参数有哪些？\n4. 我们如何手动列出所有的 Ansible facts？\n\n# 核心术语\n\n- **Inventory（清单）**:\
  \ 清单通常以 INI、YAML 或 JSON 格式编写，包含执行目标的主机列表。我们还可以添加主机或组变量进行参数化。我们可以打印图形视图列表以获得更具图形化的概览。\n\
  - **Playbooks**: Playbooks 用 YAML 编写，包含一系列要执行的任务。它们可用于自动化复杂过程，是 Ansible 自动化能力的关键组件。\n\
  - **Facts（事实）**: Facts 是与远程主机相关的变量，包含系统信息。它们由 Ansible 在 Gather Facts 任务中自动填充。\n\
  - **Magic variables（魔法变量）**: 魔法变量是 Ansible 内部变量，我们可以用它们检查当前执行状态或访问当前清单中其他主机的数据。\n\
  \n# 第 3 章：Ansible 语言扩展\n\n## 引言\n\n在迈出 Ansible 语言的第一步后，我们将学习 Ansible 语言的扩展、如何存储敏感数据、使用扩展插件，以及通过\
  \ role 和 collection 实现代码复用。当我们希望在组织 IT 部门内部共享代码时，这些工具都极其有用。\n\n## 结构\n\n在本章中我们将涵盖以下主题：\n\
  - Ansible vault\n- Ansible handler\n- 代码复用\n- Ansible role\n- Ansible collection\n\
  - Ansible filters\n- Ansible template\n- Ansible plugin\n\n# Ansible Vault\n\nAnsible\
  \ vault 加密变量和文件以保护敏感内容，并允许我们在 Ansible 中使用它们。Ansible vault 以加密存储变量和文件，并在 playbook\
  \ 或 role 中使用。在最新版本的 Ansible 中，AES 256 密使用强加密保护文件。我们可以使用所有 Ansible 安装中自带的终端 `ansible-vault`\
  \ 命令来管理 Ansible vault。\n\n## 创建加密文件\n\n要创建一个新的加密文件，请使用 `ansible-vault` 命令的 `create`\
  \ 参数。该命令会提示新的 vault 密码并使用默认编辑器打开一个空文件。创建 Ansible vault 的命令为：\n\n```bash\nansible-vault\
  \ create secret.yml\n```\n\n前面的命令将创建 `secret.yml` 文件。在终端输入密码时，命令不会显示任何输出（即使是符号）。\n\
  \n我们需要手动在终端中输入两次密码：\n\n```text\nNew Vault password:\nConfirm New Vault password:\n\
  ```\n\n`ansible-vault` 命令会在终端中打开默认文本编辑器，最常用的是 VIM 编辑器，如图 3.1 所示。\n\n![](img/Figure-3.1.jpg)\n\
  \n**图 3.1:** 在 VI 编辑器中创建 secret.yml vault\n\nAnsible vault 是 YAML 文档，因此它始终以 `---`\
  \ 开始。假设我们想在加密文件中插入一个变量 `password`，值为 `mypassword`，如图 3.2 所示 `secret.yml` 文件所示：\n\
  \n```yaml\n---\npassword: mypassword\n```\n\n![](img/Figure-3.2.jpg)\n\n**图 3.2:**\
  \ VI 编辑器中 secret.yml 文件的内容\n\n让我们想象想使用 Ansible vault 以安全的方式存储密码变量。这样一来，没有 Ansible\
  \ vault 密码的人无法访问该资源。我们可以将这种思维方式扩展到所有敏感信息，例如：密钥、OAuth、访问密钥等：\n\n![](img/Figure-3.3.jpg)\n\
  \n**图 3.3:** 密码存储在 Ansible vault 中\n\n我们可以在 Ansible playbook 中使用该密码变量，它现在被安全地存储了。只有\
  \ Ansible vault 密码才能打开该归档。\n\nVIM 编辑器始终以只读模式打开。我们需要按下键盘上的 `i` 键切换到插入模式。屏幕上的 `---\
  \ INSERT —` 确认插入模式已启用。\n\n\n\n\n\n最后一步是通过按下 `ESC` 键后输入组合 `:wq` 来保存文件并退出 VIM 编辑器。\n\
  \n文件保存后，Ansible 将继续对文件进行加密，并仅在磁盘上保存其加密版本。\n\n## 使用密码文件加密\n\n我们还可以通过密码文件为 Ansible\
  \ vault 指定密码。在文件中以明文形式存储密码并不是一个优解决方案。如果有人获得了密码文件的访问权限怎么办？我们安全的 Ansible vault 密码就会面临危险。\n\
  \n假设我们有一个名为 `vault-password.txt` 的密码文件，内容为简单的文本 `example`，如图 3.4 所示：\n\n![](img/Figure-3.4.jpg)\n\
  \n**图 3.4:** VI 编辑器中 `vault-password.txt` 文件的内容\n\n我们可以通过在文本文件中写入密码并保存为 `vault-password.txt`\
  \ 来创建 `vault-password.txt` 文件。现在，`ansible-vault` 命令将使用 `create` 参数结合 `--vault-password-file`\
  \ 参数（后面跟随密码文件的名称），如图 3.5 所示：\n\n```bash\nansible-vault create --vault-password-file=vault-password.txt\
  \ secret.yml\n```\n\n![](img/Figure-3.5.jpg)\n\n**图 3.5:** VI 编辑器中 `secret.yml`\
  \ 文件的内容\n\n## 查看加密文件\n\n我们使用 `ansible-vault` 命令的 `view` 参数来查看 Ansible vault 加密文件，无需打开进行编辑。\n\
  \n```bash\nansible-vault view secret.yml\n```\n\n`secret.yml` 文件的内容如下，如图 3.5 所示：\n\
  \n```yaml\n---\npassword: mypassword\n```\n\n命令输出提示我们输入 Vault 密码。我们可以看到用户输入的密码是隐藏的（不显示\
  \ `*` 字符）。如果密码正确，我们可以在屏幕上看到图 3.6 所示的输出：\n\n```text\nVault password:\n---\npassword:\
  \ mypassword\n```\n\n![](img/Figure-3.6.jpg)\n\n**图 3.6:** `secret.yml` 文件的内容\n\n\
  ## 编辑加密文件\n\n我们使用 `ansible-vault` 命令的 `edit` 参数来编辑现有的加密 Ansible vault 文件。该命令将文件解密到临时文件并允许我们进行编辑。保存时，它会将内容复制到原始文件并删除临时文件。\n\
  \n```bash\nansible-vault edit secret.yml\n```\n\n命令的输出显示在图 3.7 中：\n\n```text\nVault\
  \ password:\n```\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7:** `ansible-vault edit` 命令的输出\n\
  \n`secret.yml` 加密文件的密码是上一节定义的单词 `example`，如图 3.8 所示：\n\n![](img/Figure-3.8.jpg)\n\
  \n**图 3.8:** `ansible-vault edit` 命令的输出\n\n## 加密文件\n\n我们使用 `ansible-vault` 命令的 `encrypt`\
  \ 参数来对已创建的 Ansible 资源进行加密。`--output` 使用新文件名保存加密文件。如果我们忽略此选项，将用加密文件覆盖原始文件。让我们创建一个\
  \ Ansible playbook `cleartext1.yml` 文件并对其加密。\n\n```yaml\n---\npassword: mypassword\n\
  ```\n\n接下来的命令将加密 `vault1.yml` 文件中的 Ansible playbook `cleartext1.yml`。执行后，`cleartext1.yml`\
  \ 仍然包含明文文件，而 `vault1.yml` 是一个包含相同信息的加密 Ansible vault：\n\n```bash\nansible-vault\
  \ encrypt cleartext1.yml --output=vault1.yml\n```\n\n这是 `ansible-vault encrypt`\
  \ 命令的输出，如图 3.9 所示：\n\n```text\nNew Vault password: password\nConfirm New Vault password:\
  \ password\nEncryption successful\n```\n\n![](img/Figure-3.9.jpg)\n\n**图 3.9:**\
  \ `ansible-vault encrypt` 命令的输出\n\n## 解密文件\n\n我们可以使用 `ansible-vault decrypt filename`\
  \ 命令永久地解密已加密的文件。在解密单个文件时，我们可以使用 `--output` 参数将解密后的文件保存为不同的名称。\n\n```bash\nansible-vault\
  \ decrypt secret.yml --output=decrypted.yml\n```\n\n以下是 `ansible-vault decrypt`\
  \ 命令的输出，如图 3.10 所示：\n\n```text\nVault password: password\nDecryption successful\n\
  ```\n\n![](img/Figure-3.10.jpg)\n\n**图 3.10:** `ansible-vault decrypt` 命令的输出\n\n\
  ## 修改密码\n\n我们使用 `ansible-vault` 命令的 `rekey` 参数来更改加密文件的密码。该命令可以同时更改多个数据文件的密码。它会提示原始密码和新密码。\n\
  \n例如，假设我们想使用以下命令更改已加密的 `secret.yml`文件的密码：\n\n```bash\nansible-vault rekey secret.yml\n\
  ```\n\n`ansible-vault rekey` 命令请求当前的 Ansible vault 密码和两次新密码，如图 3.11 所示：\n\n```text\n\
  Vault password:\nNew Vault password:\nConfirm New Vault password:\nRekey successful\n\
  ```\n\n![](img/Figure-3.11.jpg)\n\n**图 11:** `ansible-vault rekey` 命令的输出\n\n实施密码轮换对于许多\
  \ IT 部门来说是重要任务，并提高了我们的安全性。\n\n## 在 playbook 中包含 vault\n\n要运行访问 vault 加密文件的 playbook，我们必须为\
  \ playbook 提供密码，如果不提供密码，playbook 将返回错误。要交互式提供 vault 密码，请使用 `id` 选项。\n\nAnsible playbook\
  \ `playbook.yml` 包含简单的代码，用于包含我们的 vault `secret.yml` 并在屏幕上显示密码变量：\n\n```yaml\n---\n\
  - name: Vault print\n  hosts: all\n  tasks:\n    - name: Include vars\n      ansible.builtin.include_vars:\n\
  \        file: secret.yml\n    - name: Print variable\n      ansible.builtin.debug:\n\
  \        var: password\n```\n\n接下来的命令执行 Ansible playbook `playbook.yml` 并要求用户输入\
  \ Ansible vault 密码：\n\n```bash\nansible-playbook --vault-id @prompt playbook.yml\n\
  ```\n\n我们通过命令通过密码文件指定密码：\n\n```bash\nansible-playbook --vault-password-file=vault-password.txt\
  \ playbook.yml\n```\n\n在本模块中，我们探索了 Ansible vault 安全存储，用于在 Ansible 内部保存秘密和机密。这些工具非常强大，并完全集成到\
  \ Ansible 技术中。\n\n![](img/81.jpg)\n\n## Playbook 中的内联 vault\n\n在 Ansible playbook\
  \ 中存储加密敏感数据的另一种替代方案是使用 Ansible vault 内联功能。例如，假设我们想在 Ansible playbook 中加密名为 `password`\
  \ 值为 `mypassword` 的变量。\n\n我们可以使用以下 `ansible-vault` 命令生成代码：\n\n```bash\nansible-vault\
  \ encrypt_string\n```\n\n首先，命令要求交互式输入两次密码以加密我们的敏感数据（在我的案例中使用了密码“password”）：\n\n\
  ```text\nNew Vault password:\nConfirm New Vault password:\n```\n\n在成功输入密码后，屏幕上的信息提示插入文本并使用\
  \ Ctrl + d 键序列结束：\n\n```text\nReading plaintext input from stdin. (ctrl-d to end\
  \ input, twice if your content does not already have a newline)\n```\n\n例如，让我们插入以下明文并在文本结束结束（Ctrl\
  \ + d 键）：\n\n```text\nmypassword\n```\n\n\n\n\n\n该命令处理我们的输入、密码和明文，并在屏幕上显示如图 3.12\
  \ 所示的文本：\n\n`Encryption successful`\n\n`!vault |``\n\n`$ANSIBLE_VAULT;1.1;AES256`\n\
  \n`33323438663430343838353432366533356432623234626463343464306139343965653733626236`\n\
  \n`3764313764313635353834633232626539626561376664320a356638343763376266655465313563`\n\
  \n`31616265616f38363866623962316166623537356164363032323266623761643931663732353034`\n\
  \n`3465393533343063360a636461396139646335326463343666393062666430386334383235666662`\n\
  \n`6632`\n\n![](img/Figure-3.12.jpg)\n\n**图 3.12:** ansible-vault encrypt_string\
  \ 命令的输出\n\n我们现在可以像下面的 `vault_inline.yml` 文件一样将内联 vault 集成到 playbook 中：\n\n```yaml\n\
  ---\n- name: inline vault\nhosts: all\nvars:\n  password: $ANSIBLE_VAULT;1.1;AES256\n\
  \  33323438663430343838353432366533356432623234626463343464306139343965653733626236\n\
  \  3764313764313635353834633232626539626561376664320a356638343763376266655465313563\n\
  \  31616265616f38363866623962316166623537356164363032323266623761643931663732353034\n\
  \  3465393533343063360a636461396139646335326463343666393062666430386334383235666662\n\
  \  6632\ntasks:\n  - name: Print variable\n    ansible.builtin.debug:\n      var:\
  \ password\n```\n\n我们可以使用以下命令执行 `vault_inline.yml` 文件：\n\n`ansible-playbook --vault-id\
  \ @prompt vault_inline.yml`\n\n执行的输出如下：\n\n```text\nTASK [Print variable] *****************************************************************************************************************************\n\
  ok: [localhost] => {\n  \"password\": \"mypassword\\n\"\n}\n```\n\n# 故障排除 (#toc.xhtml_s93a)\n\
  \n在第 6 章：Ansible 故障排除 中的 Ansible vault 中了解更多关于常见错误、故障排除和解决的信息。\n\n# Ansible Handler\
  \ (#toc.xhtml_s94a)\n\nAnsible handler 仅在第一个任务报告状态更改时执行操作。在处理 handler 语句时，Ansible\
  \ 的幂等性属性非常重要。handler 允许仅在需要时执行某些步骤，并在不需要执行时节省计算周期。handler 仅在上一个任务报告状态已更改时执行。如果上一个任务的报告状态为\
  \ ok，则完全不执行 handler。handler 在实现 Ansible 幂等性方面非常有用。下面的 `apache_update.yml` Ansible\
  \ playbook 仅在包更新时执行 Apache Web 服务器的更新并重启 `apache2` 服务（在类 Debian 发行版中）：\n\n```yaml\n\
  ---\n- name: Rolling update\nhosts: all\nbecome: true\ntasks:\n  - name: Latest\
  \ apache2 package\n    ansible.builtin.apt:\n      name: apache2\n      state: latest\n\
  \      update_cache: true\n    notify: Apache restart\nhandlers:\n  - name: Apache\
  \ restart\n    ansible.builtin.service:\n      name: apache2\n      state: restarted\n\
  ```\n\n我们可以使用所有 Ansible 安装中包含的 `ansible-playbook` 命令行工具执行 Ansible playbook。\n\n\
  完整的命令如下：\n\n`ansible-playbook apache_update.yml`\n\n`apache_update.yml` 是我们的 Ansible\
  \ playbook 文件名。当更新 apache2 包并执行 handler 时，它会产生以下输出：\n\n```text\nTASK [Latest apache2\
  \ package] **************************************************\nchanged: [server01.example.com]\n\
  RUNNING HANDLER [Apache restart] ****************************************************************\n\
  changed: [server01.example.com]\n```\n\n当没有包更新导致 Latest apache2 package 任务的状态为“ok”时，没有更新操作，就不会触发\
  \ handler：\n\n```text\nTASK [Latest apache2 package] ******************************************************************\n\
  ok: [server01.example.com]\n```\n\n`apache_update.yml` 文件由一个任务和一个 handler 组成。handler\
  \ 代码仅在需要时执行。请注意 `notify` 语句提到了要运行的 handler 名称。此 playbook 检查所有主机上 Apache HTTP Web\
  \ 服务器的版本；如果有可用更新，`apt` 模块将提供升级过程并在屏幕上显示消息。如果不需要升级，则不执行 handler 代码。\n\n# 多个 handler\
  \ (#toc.xhtml_s95a)\n\n在现实世界中，一个 Ansible playbook 有时会触发多个 handler，我们可以通过名称引用它们。下面的两个\
  \ playbook 显示了我们如何通过单个 Ansible 任务触发两个消息，正如 `two-1.yml` playbook 文件所示：\n\n```yaml\n\
  ---\n- name: handler demo\nhosts: all\ntasks:\n  - name: Uptime\n    ansible.builtin.command:\
  \ \"uptime\"\n    notify: message\nhandlers:\n  - name: message 1\n    ansible.builtin.debug:\n\
  \      msg: message 1\n      listen: message\n  - name: message 2\n    ansible.builtin.debug:\n\
  \      msg: message 2\n      listen: message\n```\n\n我们可以使用 `ansible-playbook` 命令执行代码：\n\
  \n`ansible-playbook two-1.yml`\n\n执行 `two-1.yml` playbook 文件会产生以下输出：\n\n```text\n\
  TASK [Uptime] *********************************************************************************\n\
  changed: [server01.example.com]\nRUNNING HANDLER [message 1] *****************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"message 1\"\n}\nRUNNING HANDLER [message\
  \ 2] *************************************************                \nok: [server01.example.com]\
  \ => {\n  \"msg\": \"message 2\"\n}\n```\n\n另一种，我们可以在 `notify` 语句以列表的形式指定多个 Ansible\
  \ handler，如下面的 `two-2.yml` playbook ：\n\n```yaml\n---\n- name: handler demo\nhosts:\
  \ all\ntasks:\n  - name: Uptime\n    ansible.builtin.command: \"uptime\"\n    notify:\n\
  \      - message 1\n      - message 2\nhandlers:\n  - name: message 1\n    ansible.builtin.debug:\n\
  \      msg: message 1\n  - name: message 2\n    ansible.builtin.debug:\n      msg:\
  \ message 2\n```\n\nhandler 仅在 playbook 状态更改时执行任务。`two-2.yml` playbook 的执行产生：\n\n\
  ```text\nTASK [Uptime] *********************************************************************************\n\
  changed: [server01.example.com]\nRUNNING HANDLER [message 1] *************************************************\
  \                \nok: [server01.example.com] => {\n  \"msg\": \"message 1\"\n}\n\
  RUNNING HANDLER [message 2] *************************************************  \
  \              \nok: [server01.example.com] => {\n  \"msg\": \"message 2\"\n}\n\
  ```\n\n# 代码复用 (#toc.xhtml_s96a)\n\n通过尽可能利用代码复用，可以加速代码开发。它们包含一个导入语句，允许我们将部分任务或 playbook\
  \ 纳入新的 playbook 中。当任务数量大于几个时，可以将代码封装为 Ansible 角色或集合并发布给其他创建者。Ansible Galaxy 是一个简化代码协作和发布的公共网络存档。\n\
  \n# 包含和导入 (#toc.xhtml_s97a)\n\n我们可以从其他文件中包含自动化脚本。我们可以导入单个任务、handler 或整个 playbook\
  \ 文件，如表 3.1](#c03.xhtml_tab3_1) 所示。所有模块都属于 `ansible.builtin` 集合。\n\n| 静态导入 | 动态包含\
  \ |\n| :--- | :--- |\n| `import` `import_playbook` `import_role` `import_tasks`\
  \ | `include` `include_vars` `include_playbook` `include_role` `include_tasks` |\n\
  \n\n\n\n\n随着复杂性的增加，Ansible 团队设计了两种语句用于在当前执行中包含额外文件。\n\n在**导入（import）**状态下，任何导入语句（`import_playbook`、`import_tasks`\
  \ 等）都会在解析剧本（playbooks）时进行预处理。对于静态导入，父任务选项将复制到导入中包含的所有子任务。而**动态包含（dynamic includes）**则是在剧本执行过程中，遇到时才处理的任何包含语句（`include_tasks`、`include_role`\
  \ 等）。父任务选项仅适用于评估评估的动态任务，而不会复制到子任务中。\n\n以下代码解释了将任务的导入或包含与循环语句（loop statement）结合时的不同行为：\n\
  \n```yaml\n- import_tasks: example.yml\nwith_items: [1,2]\n```\n\n该导入语句会导入一次 `example.yml`\
  \ 文件，每个导入的任务都会对序列 `[1,2]` 中的元素执行查找循环，即针对 1 和 2。\n\n```yaml\n- include_tasks: example.yml\n\
  with_items: [1,2]\n```\n\n该包含语句会导入 `example.yml` 文件两次，并将 ‘item’ 迭代变量分别设置为序列 `[1,2]`\
  \ 中的 1 和 2。\n\n# 角色 (Role) 与集合 (Collection)\n\nAnsible role 和 collection 是两种在组织内外打包和共享\
  \ Ansible 资源的标准化格式，它们强调了代码重用原则。\n\n## Ansible Role\n\nAnsible role 实现了 Ansible 中的代码可重用。Ansible\
  \ role 类似于传统编程世界中的函数。我们可以使用 Ansible role 更快速地开发剧本并重用 Ansible 代码。所有与角色相关的文件必须位于我们项目的\
  \ `roles` 目录下。首先，我们将创建一个 Ansible role，然后在 Ansible 剧本中使用它。\n\n## 目录树\n\nAnsible role\
  \ 拥有标准的目录树。某些目录是强制性的，但大多数不是。首先，让我们使用每个 Ansible 安装自带的 `ansible-galaxy` 命令创建一个名为 `role1`\
  \ 的 Ansible role：\n\n```bash\nansible-galaxy role init role1\n```\n\n`ansible-galaxy`\
  \ 命令需要以下参数：\n\n* `role`，命令与 Ansible role 交互\n* `init`，命令初始化一个新的角色\n* `role1`，新角色的名称\n\
  \n成功执行上一条命令会在 `roles` 目录下创建 `role1`，并产生以下输出：\n\n```text\n- Role role1 was created\
  \ successfully\n```\n\n执行[图 3.13]所示的命令创建了如下文件系统树结构：\n\n![](img/Figure-3.13.jpg)\n\
  \n**图 3.13：** Ansible 标准角色目录树\n\n目录结构的描述如下：\n\n* **defaults 目录：**该目录下的 `main.yml`\
  \ 文件包含角色变量的默认值，这些值在使用角色时可以被覆盖。这些变量的优先级较低，旨在在剧本（plays）中进行更改和自定义。\n* **files 目录：**该目录存储用于配置的静态文件。我们通过角色任务引用此目录。\n\
  * **handlers 目录：**该目录下的 `main.yml` 文件包含角色的处理程序（handler）定义。\n* **meta 目录：**该目录下的\
  \ `main.yml` 文件包含关于角色的人类可读信息，包括作者、许可、平台和可选的角色依赖关系。\n* **tasks 目录：**这是最重要的目录。该目录下的\
  \ `main.yml` 文件包含了执行角色任务的主代码。\n* **templates 目录：**该目录包含在任何角色任务需要使用的 Jinja2 模板。\n\
  * **tests 目录：**该目录可以包含用于测试角色的清单（inventory）和 `test.yml` 剧本。\n* **vars 目录：**该目录下的\
  \ `main.yml` 定义了角色的变量值。这些变量通常用于角色内部。这些变量的优先级较高，在剧本中使用时不打算更改。\n\n唯一要求的目录是 `tasks`\
  \ 目录。只有某些角色会拥有所有这些目录。最重要的文件是 `tasks` 目录下的 `main.yml`。该文件的内容是某个 Ansible 剧本的任务内容。\n\
  \n`role1` 角色中 `tasks` 目录下 `main.yml` 文件的内容：\n\n```yaml\n---\nname: role1 demo\n\
  ansible.builtin.debug:\n  msg: \"role1\"\n```\n\n我们可以在 Ansible role 内部添加一些变量，并在\
  \ `defaults/main.yml` 文件下指定它们的名称。例如，让我们定义值为 `foo` 的 `foo`：\n\n```yaml\n---\nfoo:\
  \ foo\n```\n\n一旦定义了 `foo` 变量，我们就可以在 `tasks/main.yml` 中使用它：\n\n```yaml\n---\n- name:\
  \ role1 demo\n  ansible.builtin.debug:\n    msg: \"role1\"\n- name: role1 foo\n\
  \  ansible.builtin.debug:\n    var: foo\n```\n\n## 在剧本中的用法\n\n我们可以在 Ansible 剧本的\
  \ `roles` 语句下包含角色。以下示例展示了如何在 Ansible 剧本中包含 `role1` Ansible 角色：\n\n```yaml\n---\n\
  - name: role example\n  hosts: all\n  roles:\n    - role1\n```\n\n当 Ansible 无法找到\
  \ role1 时，我们会获得以下错误：\n\n```text\nERROR! the role 'role1' was not found in /home/devops/roles/roles:/root/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:/home/devops/roles\n\
  ```\n\n正如[第 6 章：Ansible 故障排除]所示，这只是告诉我们在列出的目录未找到 `role1`。解决方案是验证执行所在的正确的目录，或者在 `ansible.cfg`\
  \ 文件中自定义角色路径。在[第 8 章：Ansible 高级]中了解更多关于 `ansible.cfg` 文件。\n\n执行输出如下。我们可以看到结果显示了\
  \ `role1` 角色中定义的两个任务：\n\n```text\nPLAY [role example] ******************************************************\n\
  TASK [Gathering Facts] ******************************************************\n\
  ok: [server01.example.com]\nTASK [role1 : role1 demo] ******************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"role1\"\n}\nTASK [role1 : role1 foo]\
  \ ******************************************************\nok: [server01.example.com]\
  \ => {\n  \"foo\": \"foo\"\n}\nPLAY RECAP ******************************************************\n\
  server01.example.com: ok=3     changed=0   unreachable=0   failed=0   skipped=0\
  \   rescued=0   ignored=0\n```\n\n执行 `role_simple.yml` 剧本。\n\n以下示例应用 `role1` Ansible\
  \ 角色并将 `foo` 设置为 `value`：\n\n```yaml\n---\n- name: role example\n  hosts: all\n\
  \  roles:\n    - role: role1\n      foo: value\n```\n\n执行输出与之前的类似，但在 `role_simple.yml`\
  \ 剧本中显示了 `foo` 变量的值（而不是 foo）：\n\n```text\nPLAY [role example] ******************************************************\n\
  TASK [Gathering Facts] ******************************************************\n\
  ok: [server01.example.com]\nTASK [role1 : role1 demo] ******************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"role1\"\n}\nTASK [role1 : role1 foo]\
  \ ******************************************************\nok: [server01.example.com]\
  \ => {\n  \"foo\": \"value\"\n}\n```\n\n\n\n\n\n`server01.example.com: ok=3    changed=0\
  \    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0`\n\n## 执行顺序\n\
  \n对于 playbook 中的每个 play，任务按照任务列表中的顺序执行。在所有任务执行完毕，任何被通知的处理器（handlers）都会执行。Ansible\
  \ 按照图 3.13 所示的执行顺序执行 playbook。请注意，role 可以在相对目录下自包含某些任务和处理器。我们可以像传统的 Ansible play\
  \ 一样，在 role 中指定某些 Ansible 处理器。\n\n当一个 role 添加 play 时，role 任务会被添加到任务列表的开头。如果 play\
  \ 中包含了第二个 role，它的任务列表将添加到第一个 role 之后。\n\n![](img/Figure-3.14.jpg)\n\n**图 3.14:**\
  \ Ansible playbook 的执行顺序\n\n在特定场景下，可能必要在执行 role 之前先执行某些 play 任务。为了支持此类场景，Ansible\
  \ play 可以指定一个 `pre_tasks` 部分。\n\n此部分列出的任何任务都会在任何 role 执行之前执行。如果这些任务中的任何一个通知了处理器，则这些处理器任务将在\
  \ role 或常规任务之前执行。\n\nPlays 还支持 `post_tasks` 关键字，它会在常规 play 任务之后但在任何处理器部分之前执行某些任务。\n\
  \n下面的示例展示了指定所有可能语句的 Ansible playbook 执行顺序：`pre_tasks`、`role`、`task`、`post_tasks`、`handlers`:\n\
  \n```yaml\n---\n- name: Order of execution\nhosts: all\npre_tasks:\n- debug:\n \
  \   msg: 'pre-task'\n  notify: my handler\nroles:\n- role1\ntasks:\n- debug:\n \
  \   msg: 'first task'\n  notify: my handler\npost_tasks:\n- debug:\n    msg: 'post-task'\n\
  \  notify: my handler\nhandlers:\n- name: my handler\n  debug:\n    msg: Running\
  \ my handler\n```\n\n执行输出验证了 Ansible `role_order.yml` playbook 预期的执行顺序：\n\n```\n\
  PLAY [Order of execution] **************************************************************\n\
  TASK [Gathering Facts] **********************************************************************\n\
  ok: [server01.example.com]\nTASK [debug] *****************************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"pre-task\"\n}\nTASK [role1 : role1\
  \ demo] **********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"role1\"\n}\nTASK [role1 : role1 foo]\
  \ **********************************************************************\nok: [server01.example.com]\
  \ => {\n  \"foo\": \"foo\"\n}\nTASK [debug] **********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"first task\"\n}\nTASK [debug] **********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"post-task\"\n}\n```\n\n## 用于 roles\
  \ 的 Ansible galaxy\n\nAnsible galaxy 既用于在 Ansible 控制器中管理 roles 的命令行工具，也是用于查找任何可用\
  \ Ansible 资源的公共网站目录。在网站上，有一个搜索引擎可以快速找到合适的 Ansible role 或集合（collection）。每个资源都会显示作者以及下载次数、支持的操作系统以及关于用法或内部变量的大量信息。\n\
  \n## 手动安装\n\n我们可以通过浏览器或通过每个 Ansible 安装自带的 `ansible-galaxy` 命令行工具与 Ansible galaxy\
  \ 网站进行交互。它简化了与 Ansible galaxy 的交互，并允许通过命令行安装 roles 和集合。例如，假设我们安装由 `geerlingguy author\
  \ (geerlingguy.redis)` 创建的 `redis` role。整个 `ansible-galaxy` 命令为：\n\n```bash\nansible-galaxy\
  \ install geerlingguy.redis -p roles/\n```\n\n该命令的参数为：\n\n*   `install` 参数：从文件安装\
  \ role\n*   `geerlingguy.redis`：指定 galaxy role 的名称\n*   `-p` 或 `--roles-path`：可选，我们可以指定保存\
  \ roles 文件的目录路径\n\n或者，除了 `-p` 或 `--roles-path` 选项，我们还可以通过 `ansible.cfg` 配置文件指定 roles\
  \ 的目录。更多详情请参见第 8 章，Ansible 高级 Ansible 配置设置部分。\n\n*命令的输出如下所示：*\n\n```\n- downloading\
  \ role 'redis', owned by geerlingguy\n- downloading role from https://github.com/geerlingguy/ansible-role-redis/archive/1.8.0.tar.gz\n\
  - extracting geerlingguy.redis to /home/devops/roles/geerlingguy.redis\n- geerlingguy.redis\
  \ (1.8.0) was installed successfully\n```\n\n## 自动安装\n\n当我们需要安装多个 Ansible role 或我们想要自动执行它时，我们更倾向于使用\
  \ `requirements.yml` 文件。\n\n该语法易于理解，因为它在 `src` 名称下列出了所有 roles；可选地，我们可以指定特定版本。如果省略了版本，Ansible\
  \ 将安装最新可用。\n\n一个简单的 `requirements.yml` 文件看起来如下：\n\n```yaml\n---\nroles:\n- src:\
  \ geerlingguy.redis\n  version: \"1.8.0\"\n```\n\n我们可以使用 `ansible-galaxy` 命令执行我们的\
  \ `requirements.yml` role 文件：\n\n```bash\nansible-galaxy install -r roles/requirements.yml\
  \ -p roles\n```\n\n该命令的参数为：\n\n*   `install` 参数：从文件安装 role\n*   `-r` 参数：指定使用 `requirements.yml`\
  \ 文件\n*   `-p` 参数：保存 roles 文件的目录路径\n\n`ansible-galaxy install -r` 命令的输出如下所示：\n\n\
  ```\nStarting galaxy role install process\n- downloading role 'redis', owned by\
  \ geerlingguy\n- downloading role from https://github.com/geerlingguy/ansible-role-redis/archive/1.8.0.tar.gz\n\
  - extracting geerlingguy.redis to /home/devops/roles/geerlingguy.redis\n- geerlingguy.redis\
  \ (1.8.0) was installed successfully\n```\n\n命令的预期结果应该是从 Ansible galaxy 网站下载内容并将其保存到指定的\
  \ roles 目录。Ansible roles 对于代码复用非常有帮助，可以节省大量时间和减少人为错误。在编写自己的 role 之前，始终先在 Ansible\
  \ galaxy 中搜索。\n\n## 配置\n\n我们可以通过指定配置文件来自定义 `ansible-galaxy` 命令行工具的行为，例如，从公共 Ansible\
  \ galaxy 网站以及我们组织内部的私有存档或 Ansible 自动化枢（Ansible 自动化平台的一部分）。对于每台服务器，我们可以指定身份凭据或身份令牌。\n\
  \n## Ansible Collection\n\nAnsible collection 是在多个平台之间发布 Ansible 代码的最现代、最完整的方式。它允许我们以标准方式发布\
  \ Ansible roles、模块和插件。集合通常发布在公共 Ansible galaxy 网站存档中。Ansible collection 是 Ansible\
  \ 内容的发布格式。\n\n它解决了一个问题并包含了所有相关包，分发 playbooks、roles、模块和插件。对于用户来说，Ansible collection\
  \ 易于通过 Ansible galaxy 下载和共享，无需实际上了解底层发生了什么。它只需执行预期的任务。对于开发者来说，Ansible collection\
  \ 易于通过 Ansible galaxy 上传和共享。所有与集合相关的文件必须位于我们项目的 collections 目录下。\n\n## 用于 collections\
  \ 的 Ansible galaxy\n\n\n\n\nAnsible Galaxy 是一个存储 Ansible 角色（roles）和集合（collections）的网站。其搜索引擎、标签和平台使得能够轻松找到其中的任何内容。在系统中使用这些内容之前，我们必须仔细评估其质量。质量指标通常包括代码质量保证、支持的操作系统和平台、文档、发布版本号、是否存在变更日志（Changelog）、下载次数以及作者或创建者。请注意，该网站除了\
  \ Ansible 集合外还包含 Ansible 角色。\n\n## community.general 集合\n\n最全面的集合存档是 `community.general`，它包含许多大量的\
  \ Ansible 资源。该存档采用社区许可分发。这意味着 Ansible 社区正在尽力支持该产品，但对于错误修复或新功能的实现没有特定的时间表。\n\n假设我们想在系统中使用\
  \ Ansible Galaxy 集合 `community.general` 中的 `iso_create` Ansible 模块。`iso_create`\
  \ 模块可以根据系统中的文件列表创建 ISO 镜像。它对于备份目的非常有用。为了使用 `iso_create` 模块，我们需要在任务中指定整个 Ansible\
  \ 命名空间：`community.general.iso_create`。\n\n例如，以下 `collection.yml` Ansible 剧本根据文件列表创建\
  \ `test.iso` 文件：\n\n```yaml\n---\n- name: iso_create module demo\nhosts: all\ntasks:\n\
  \  - name: Create an ISO file\n    community.general.iso_create:\n      src_files:\n\
  \        - /home/devops/helloworld.yml\n      dest_iso: /home/devops/devops.iso\n\
  \      interchange_level: 3\n```\n\n我们可以使用在每个 Ansible 安装中的 `ansible-playbook` 命令行工具在终端中执行代码。参数仅为文件名。在我们的情况下，它是\
  \ `collection.yml` 文件的路径，即 `collections/collection.yml`。\n\n完整命令为：\n\n```bash\n\
  ansible-playbook collections/collection.yml\n```\n\n当集合安装后，`collection.yml` 文件的预期执行状态为\
  \ ok 且 changed 状态：\n\n```\nTASK [Create an ISO file] *********************************************************************\n\
  changed: [server01.example.com]\n\nPLAY RECAP *********************************************************************\n\
  server01.example.com: ok=2    changed=1   unreachable=0   failed=0   skipped=0 \
  \  rescued=0   ignored=0\n```\n\n执行输出是 `/home/devops` 目录下的 `devops.iso` ISO 文件，其中包含上一节看到的\
  \ `helloworld.yml` 文件。请根据需要使用真实文件和目录随时调整 Ansible 剧本。\n\n以下 Ansible 致命错误意味着集合尚未安装在\
  \ Ansible 控制器中：\n\n```\nERROR! couldn't resolve module/action 'community.general.iso_create'.\n\
  ```\n\n我们可以在 *第 6 章：Ansible 故障* 的 *Ansible collection* 章节中阅读完整的错误。我们可以使用 `ansible-galaxy`\
  \ 命令行工具轻松安装或更新 Ansible 集合。\n\n## 安装 Ansible 集合\n\n使用 `ansible-galaxy` 命令行工具安装 Ansible\
  \ 集合有两种不同方法：\n\n* 手动安装\n* 自动安装\n\n如果没有通过 `ansible.cfg` 文件进行自定义，我们使用 `ansible-galaxy`\
  \ 命令行工具下载的任何集合或角色都将安装在主目录下的 `.ansible` 目录中。可以在 *第 8 章：Ansible 高进* 的 *Ansible configuration\
  \ settings* 章节了解更多关于 `ansible.cfg` 文件的信息。\n\n## 手动安装\n\n我们可以使用 `ansible-galaxy`\
  \ 命令行工具手动安装所需的集合。该工具包含在每个 Ansible 安装中，允许我们简化 Ansible 角色和集合的管理。\n\n命令为：\n\n```bash\n\
  ansible-galaxy collection install community.general\n```\n\n安装集合的命令需要两个参数：\n\n*\
  \ `collection install`：指定集合安装活动\n* `community.general`：集合的名称\n\n当集合已安装在我们的系统中时，我们会收到以下消息：\n\
  \n```\nStarting galaxy collection install process\nNothing to do. All requested\
  \ collections are already installed. If you want to reinstall them, consider using\
  \ '--force'.\n```\n\n如输出所示，我们可以通过添加 `--force` 参数重新下载集合。\n\n![](img/99.jpg)\n\n##\
  \ 自动安装\n\n我们可以使用 `ansible-galaxy` 命令行工具和 `requirements.yml` 文件执行自动化的 Ansible 集合安装。\n\
  \n以下 `requirements.yml` 文件从 Ansible Galaxy 存档中下载 `community.general` 集合：\n\n```yaml\n\
  ---\ncollections:\n  - name: community.general\n    source: https://galaxy.ansible.com\n\
  ```\n\n我们可以使用命令行 `ansible-galaxy` 命令执行 `requirement.yml` 文件：\n\n```bash\nansible-galaxy\
  \ install -r collections/requirements.yml\n```\n\n前述命令具有以下参数：\n\n* `install` 参数指定安装操作\n\
  * `-r` 指定我们想要使用 `requirement.yml` 文件\n\n这输出了以下内容：\n\n```\nStarting galaxy collection\
  \ install process\nProcess install dependency map\nStarting collection install process\n\
  Downloading https://galaxy.ansible.com/download/community-general-6.1.0.tar.gz to\
  \ /home/devops/.ansible/tmp/ansible-local-257gjb377e/tmp3h2ee5fy/community-general-6.1.0-po7d9tp6\n\
  Installing 'community.general:6.1.0' to '/home/devops/.ansible/collections/ansible_collections/community/general'\n\
  community.general:6.1.0 was installed successfully\n```\n\n正如我们所见，ansible-galaxy\
  \ 工具连接到 Ansible Galaxy 网站，找到集合并在我们的目标系统中下载最新的发布版本（写本书时为 6.1.0）。它还向用户确认本地文件系统上可用文件的路径。高级用户还可以为文件中列出的每个集合指定“signatures”（签名）参数，以验证分发服务器与我们系统之间软件的正版性。在写本书时，只有有限的分发服务器支持此功能。\n\
  \n## Python 依赖项\n\n请注意，某些 Ansible 模块需要更多的 Python 库依赖才能运行。要求在手册中指定并必须在执行 Ansible\
  \ 前安装。\n\n以下 Ansible 致命错误意味着 `community.general.iso_create` Ansible 模块需要 `pycdlib`\
  \ Python 库，且未安装在 Ansible 控制器的 Python 系统或当前的 Python 虚拟环境中：\n\n```\nThe error was:\
  \ ModuleNotFoundError: No module named 'pycdlib'.\n```\n\n我们可以在 *第 6 章：Ansible 故障*\
  \ 的 *Ansible collection* 章节中阅读完整的错误。\n\n## 列出集合\n\n可以使用相同的 `ansible-galaxy` 工具列出已安装的集合。\n\
  \n```bash\nansible-galaxy collection list community.general\n```\n\n该命令的参数为：\n\n\
  * `collection:`：指定我们想要与集合交互\n* `list`-：指定我们想要列出已安装的集合\n* `community.general:`：集合的名称\n\
  \n输出显示本地 Ansible 集合的目录路径、名称和安装版本。\n\n在这种情况下，输出如下：\n\n```\n## /usr/local/lib/python3.8/dist-packages/ansible_collections\n\
  Collection       Version\n----------------- -------\ncommunity.general 5.4.0\n```\n\
  \n\n\n\n## /home/devops/.ansible/collections/ansible_collections\n\n| Collection\
  \ | Version |\n| :--- | --- |\n| community.general | 6.1.0 |\n\n一旦在系统中成功安装了 Ansible\
  \ collection `community.general`，我们就可以执行我们的 Ansible playbook 代码 `collection.yml`。\n\
  \nAnsible collections 对于代码复用非常有帮助，可以节省大量时间并减少人为错误。\n\n## Configuration\n\n我们可以通过指定配置文件来定制\
  \ `ansible-galaxy` 命令行工具的行为，例如，从公共 Ansible galaxy 网站、组织内部的私有存档或 Ansible Automation\
  \ Hub（Ansible Automation Platform 的）获取集合内容。对于每台服务器，我们可以指定身份凭据或认证令牌。\n\n## Ansible\
  \ Filter\n\n我们可以利用 Ansible 对 Jinja2 过滤器的原生支持，对变量或配置文件进行某些更改。它们是扩展 Ansible 控制节点功能的部分。Ansible\
  \ 过滤器在变量级别上操作数据。\n\n以下三个过滤器最常用：\n\n- `default`: 如果变量未定义，则为变量提供默认值。\n- `join`: 将列表转换为单个字符串。\n\
  - `map`: 对列表或字典中的每个项应用过滤器。\n- `selectattr`, `filter`, 和 `rejectattr`: 过滤字典并选择匹配项。\n\
  \n当我们想要为可能被用户覆盖（使用交互式输入或额外变量）的变量提供默认值时，Ansible 默认过滤器非常有用。我们可以使用依赖于 Python `join()`\
  \ 内置函数的 Ansible join 过滤器将列表中的元素连接成字符串。此外，Ansible map 过滤器依赖于 Python 的 `map()` 内置函数，该函数可以在不使用显式循环的情况下处理并转换迭代器中的所有项，这种技术通常被称为映射（mapping）。`map()`\
  \ 对每个项应用转换函数并将其转换为新的可迭代对象。Ansible `selectattr` 过滤器继承自 Jinja，它通过对序列中的所有对象（通常是字典）应用测试，从输入序列中返回匹配的对象。`selectattr`\
  \ 过滤器的参数取决于我们想要在对象中执行的测试类型：`equalto`、`match` 和 `search`。我们可以使用 Jinja2 比较运算符 `==`、`!=`、`>`、`<`\
  \ 以及 Jinja2 测试 `eq`、`ne`、`ge`、`gt`、`in`、`not`。如果没有指定测试，则属性值将被评估为布尔值。`selectattr`\
  \ 过滤器也会将测试应用于嵌套对象，而 select Ansible 过滤器仅通过对每个对象应用测试来过滤对象序列。`selectattr` Ansible 过滤器的相反是\
  \ `rejectattr` Ansible 过滤器。`rejectattr` 过滤器会从指定的迭代器删除任何不符合提供测试的项。\n\nAnsible 过滤器的某些常见用例总结在\
  \ [表 3.2] 中，将过滤器应用于用户定义的变量 `myvariable`：\n\n| Filter | Expression | Result |\n|\
  \ :--- | --- | --- |\n| 分配默认强制值 | `{{ myvariable | default(10) }}` | `10` |\n| 使变量可选\
  \ | `{{ myvariable | default(omit) }}` | `(NDR: nothing)` |\n| 分配三元值 | `{{ status\
  \ | ternary('start', 'restart') }}` | `start or restart` |\n| 管理数据类型 | `{{ myvariable\
  \ | items2dict }}` | `Dictionary data structure` |\n| 将数据格式化为 JSON 和 YAML | `{{\
  \ myvariable | to_json }}` 或 `{{ myvariable | to_nice_yaml }}` | `JSON` `YAML` |\n\
  | 使用正则表达式 | `{{ \"ansible\" | regex_replace('^.', 'A') }}` | `Ansible` |\n\n**表\
  \ 3.2:** 最常用的 Ansible 过滤器\n\n![](img/103.jpg)\n\n接下来的 `filter_map.yml` Ansible playbook\
  \ 演示了如何在简单的服务器列表中 `map`、`join` 和 `selectattr` 过滤器的用法：\n\n```yaml\n---\n- hosts:\
  \ all\nvars:\n  servers:\n    host01:\n      ip: 192.168.1.11\n      type: large\n\
  \    host02:\n      ip: 192.168.1.12\n      type: small\ntasks:\n  - name: Map IP\
  \ addresses\n    ansible.builtin.debug:\n      msg: \"{{ servers.values() | map(attribute='ip')\
  \ }}\"\n  - name: List IP addresses\n    ansible.builtin.debug:\n      msg: \"{{\
  \ servers.values() | map(attribute='ip') | join(',') }}\"\n  - name: Only large\
  \ machines\n    ansible.builtin.debug:\n      msg: \"{{ servers.values() | selectattr('type',\
  \ 'eq', 'large') | map(attribute='ip') | join(',') }}\"\n```\n\n完整命令如下：\n\n`ansible-playbook\
  \ filter_map.yml`\n\n命令的输出如下：\n\n```text\nTASK [Map IP addresses] *********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": [\n    \"192.168.1.11\",\n    \"192.168.1.12\"\
  \n  ]\n}\nTASK [List IP addresses] *********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"192.168.1.11,192.168.1.12\"\n}\nTASK\
  \ [Only large machines] *********************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"192.168.1.11\"\n}\n```\n\n还有更多适用于字符串修改的\
  \ Ansible 过滤器。让我们对 Ansible 字符串 `Automate Everything with Ansible` 应用 `upper` 过滤器。`upper`\
  \ 过滤器将变量大写并显示在屏幕上。修改的预期输出是从 `Automate Everything with Ansible` 变为 `AUTOMATE EVERYTHING\
  \ WITH ANSIBLE`。我们通过 `filter_upper.yml` playbook 文件中的 `debug` 模块来演示这种行为：\n\n```yaml\n\
  ---\n- name: Upper filter\n  hosts: all\n  tasks:\n    - name: Apply a filter\n\
  \      ansible.builtin.debug:\n        msg: '{{ \"Automate Everything with Ansible\"\
  \ | upper }}'\n```\n\n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook` 命令来执行 Ansible playbook，并将文件名指定参数。\n\
  \n完整命令如下：\n\n`ansible-playbook filter_upper.yml`\n\n执行 `filter_upper.yml` playbook\
  \ 的输出如下：\n\n```text\nTASK [apply a filter] **************************************************************************\n\
  ok: [server01.example.com] => {\n  \"msg\": \"AUTOMATE EVERYTHING WITH ANSIBLE\"\
  \n}\n```\n\n如我们所见，输出是 `AUTOMATE EVERYTHING WITH ANSIBLE`，这是使用 `upper` Ansible 过滤器将输入文本\
  \ `Automate Everything with Ansible` 大写的结果。Ansible 过滤器用于为了屏幕目的执行变量更改，或将一个任务的输出复用于另一个任务。\n\
  \n![](img/105.jpg)\n\n为了操作 JSON 格式的文件或变量，`json_query` 过滤器有助于从数据结构中提取字段并展平复杂结构。\n\
  \n请参阅 Ansible facts 中的后续章节 Temporary Facts（临时事实），以便将操作结果保保存到 Ansible fact 中。\n\n\
  ![](img/105a.jpg)\n\n## Ansible Template\n\nAnsible template 使用静态内容、变量数据和控制逻辑的混合动态生成整个文件。`ansible.builtin.template`\
  \ 模块是生成配置内容的灵活且强大的方法。模板是嵌入了控制和变量引用的普通文件。\n\n\n\n\n模板使用 Jinja2 模板语言。Jinja2 是一种用 Python\
  \ 编写的全功能模板引擎语言，由 Armin Ronacher 于 2008 年创建，并采用 BSD 许可。Jinja2 模板语言因与 Python 编写的 Flask\
  \ Web 框架结合而流行。Jinja2 支持简单的替换、条件、循环和其他控制结构。我们在 Ansible 项目和角色的 `templates` 目录下存储 Jinja2\
  \ 模板文件。我们可以在模板中使用 `{{ variable }}` 语法添加变量引用，使内容动态化。文件存储在 Ansible 控制节点上。Ansible 模板对于配置文件非常有用。Ansible\
  \ 模板有助于将某些变量值应用到配置文件。Ansible 模板的工作原理是利用 Jinja2 编程语言和 Ansible 内置模板模块。\n\n以下示例探索了如何在\
  \ Ansible playbook 中通过定义的变量来创建和使用模板。在接下来的示例中，使用 Ansible 模板应用应用 Jinja 模板并使用模板为变量填充某些文本。\n\
  \nAnsible playbook `template_helloworld.yml` 应用了模板模块，用自定义文本替换目标模板的部分内容：\n\n```\n\
  ---\n- name: template module\nhosts: all\nvars:\n  file_content: |\n    Automate\
  \ Everything with Ansible example.\n    Multiline.\ntasks:\n  - name: Apply template\n\
  \    ansible.builtin.template:\n      src: templates/helloworld.txt.j2\n      dest:\
  \ /home/devops/helloworld.txt\n```\n\n`templates/helloworld.txt.j2` 模板文件是一个简单的 Jinja2\
  \ 文档，其中我们可以使用双括号来指定 Ansible 变量 `file_content` 的值：\n\n```\n{{ file_content }}\nThis\
  \ line will not change.\n```\n\n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook` 命令行工具通过以下命令执行\
  \ Ansible playbook：\n\n```\nansible-playbook template_helloworld.yml\n```\n\n该命令产生以下输出：\n\
  \n```\nTASK [Apply page template] *********************************************************************\n\
  changed: [server01.example.com]\n```\n\n成功执行后，输出 `/home/devops/helloworld.txt` 的内容包含三行，如下。例如，我们可以使用\
  \ VI 命令行文本编辑器 vi `/home/devops/helloworld.txt` 进行查看：\n\n```\nAutomate Everything\
  \ with Ansible example.\nMultiline.\nThis line will not change.\n```\n\n正如我们所见，变量\
  \ `file_content` 在目标文件中替换为变量的值。在这种情况下，变量 `file_content` 是一个跨越多行的长多行文本。我们可以应用 Ansible\
  \ 模板来修改系统中任何服务的任何配置文件。\n\nAnsible 模板是我们在 IT 基础设施集群中执行配置管理和实现“配置即代码”（CaC）的基础工具。\n\
  \n# 控制语句\n\nAnsible 模板中的控制语句使用了与 Ansible 语法不同的语法，即 `{% statement %}`。Jinja2 支持以\
  \ `{% if … %}` 开始并以 `{% endif %}` 结束的条件语句。支持大多数常用的 Python 测试：数学表达式如 `==`、`!=`、`<=`\
  \ 以及用于检查列表成员身份的 `in`。我们可以使用 `{% elif … %}` 和 `{% else %}` 进行分支。\n\n当我们使用控制语句时，`{%\
  \ … %}` 括号之间的所有内容都会排除在输出之外。然而，我们在这些括号周围包含的任何空白默认都会包含在内。\n\n我们可以使用减号来告诉 Jinja 2 吸收空白：\n\
  \n- `{%-` 吸收控制语句之前的空白\n- `-%}` 吸收控制语句之后的空白\n\nAnsible playbook `template_group1.yml`\
  \ 应用了模板模块，在目标节点上创建一个带有自定义文本的 `group1.txt` 文件：\n\n```\n---\n- name: template module\n\
  hosts: all\ntasks:\n  - name: Apply template\n    ansible.builtin.template:\n  \
  \    src: templates/group1.txt.j2\n      dest: group1.txt\n```\n\n`templates` 目录下的\
  \ `group1.txt.j2` 文件正在测试服务器是否在清单的 `group1` 组中：\n\n```\n{% if 'group1' in group_names\
  \ %}\nThis server is in group1\n{%- else %}\nThis server is NOT in group1\n{% endif\
  \ -%}\n```\n\n假设我们有以下 `inventory_group.ini` YAML 清单文件，其中 `server01.example.com`\
  \ 位于 `group1` 组，`server02.example.com` 位于 `group2` 组：\n\n```yaml\n---\n[group1]\n\
  server01.example.com\n[group2]\nserver02.example.com\n```\n\n我们使用以下命令配合 `inventory_group.ini`\
  \ 文件执行 `template_group1.yml` playbook 文件：\n\n```\nansible-playbook -i inventory_group.ini\
  \ template_group1.yml\n```\n\n该命令产生以下输出：\n\n```\nTASK [Apply template] **********************************************************************\n\
  changed: [server01.example.com]\nchanged: [server02.example.com]\n```\n\n在每个目标节点上，playbook\
  \ 创建了文本文件 `group1.txt`：\n\n`server01.example.com` 中的 `group1.txt` 文件内容：\n\n```\n\
  This server is in group1\n```\n\n`server02.example.com` 中的 `group1.txt` 文件内容：\n\n\
  ```\nThis server is NOT in group1\n```\n\n正如我们看到的，控制操作完全是在模板级别使用 Jinja2 语言执行的，而不是在\
  \ Ansible playbook 中执行。\n\n## 循环语句\n\nJinja2 只有一种循环：`for` 循环。`for` 循环以 `{% for …\
  \ %}` 开始并以 `{% endfor %}` 结束。`for` 循环始终遍历某些 Python 序列：`{% for x in sequence %}`。为了运行循环特定次数，我们可以使用如\
  \ `range(10)` 的范围语句来创建一个十次迭代的序列。\n\n如果我们需要访问字典中的值，最好的循环方式是使用 `.items()` 方法并返回一组键值对。\n\
  \n## 嵌套控制语句\n\n我们还可以在 Jinja2 中嵌套控制语句，因此我们可以在 `{% for … %}` 内部使用 `{% if … %}`。一种更高级的方法是像下面的表达式一样组合循环和条件：\n\
  \n```\n{% for x in myvariable if x > 2 %}\n```\n\n该语句将在循环之前对用户定义的变量 `myvariable`\
  \ 进行过滤。我们也可以配合 `for` 使用 `else`，在 `myvariable` 为空时提供单独的内容。\n\nAnsible playbook `template_type.yml`\
  \ 应用了模板模块，在目标节点上创建一个带有自定义文本的 `type.txt` 文件：\n\n```\n---\n- name: template module\n\
  hosts: all\ntasks:\n  - name: Apply template\n    ansible.builtin.template:\n  \
  \    src: templates/type.txt.j2\n      dest: type.txt\n```\n\n`templates` 目录下的 `type.txt.j2`\
  \ 文件正在测试服务器是否在清单的 `group1` 组中：\n\n```\n{% for key, value in servers.items() if value.type\
  \ == 'large' %}\n{{ key }} is large\n{% else %}\n{{ key }} is {{ value.type }}.\n\
  {% endfor %}\n```\n\n我们使用以下命令配合 `inventory.ini` 文件执行 `template_type.yml` playbook\
  \ 文件：\n\n```\nansible-playbook template_type.yml\n```\n\n该命令产生以下输出：\n\n```\nTASK\
  \ [Apply template] **********************************************************************\n\
  changed: [server01.example.com]\n```\n\n`template_type.yml` playbook 的执行在目标主机上创建了一个如下内容的\
  \ `type.txt` 文件：\n\n```\nhost01 is large\n```\n\n\n\nAnsible 模板过滤器用于我们需要对数据结构进行某些数据转换的情况。通常，当数据结构比仅从列表或字典中提取值更复杂时，我们需要模板过滤器。与\
  \ playbook 中的 Ansible 过滤器一样，我们也可以在模板中使用 Jinja2 过滤器来应用过滤器。更多更多信息，请参阅 `Ansible Filter`\
  \ 章节。\n\n## 模板扩展\n\n当我们需要使用模板跨多个文件生成相似的内容时，模板扩展非常有用。这样，我们可以避免模板中的重复内容。Jinja2 支持两种扩展模板的方法：\n\
  \n- `include`\n- `inheritance`\n\n`include` 语句从另一个模板文件读取内容并将其渲染。Ansible 在包含的路径中搜索被包含的模板。被包含的模板具有与其相同的可用事实（facts）和变量，以及任何循环变量。\n\
  \n而 `inheritance` 语句更为复杂且强大，它在模板之间创建父/子关系。`parent` 模板可以被不同的 `child` 模板以不同的渲染。\n\n\
  `parent` 模板是一个普通的模板文件，包含一个或多个 `{% block … %}` 控制语句。`child` 模板使用 `{% extends … %}`\
  \ 控制语句从父模板继承。`child` 模板只需要覆盖任何需要唯一内容的块即可。\n\n# Ansible 插件\n\nAnsible 插件是一些额外的 Python\
  \ 脚本，可以帮助扩展 Ansible。Ansible 插件允许创建代码片段来扩展 Ansible 的基础功能并实现更有趣的应用。Ansible 插件根据其功能进行分类。插件类型的完整列表在[表\
  \ 3.3]中：\n\n| 插件类型 | 插件描述 |\n| :--- | :--- |\n| action | 它执行 playbook 任务所需的动作 |\n\
  | cache | 它存储收集的事实或清单源数据 |\n| callback | 在响应事件时为 Ansible 增加新行为 |\n| connection |\
  \ 它连接到目标主机，以便在上面执行任务 |\n| filter | 它提取特定值，转换数据类型和格式，并实现更多功能 |\n| inventory | 它指向额外的清单数据源\
  \ |\n| lookup | 它从外部源（文件、数据库、键/值存储器、API 和其他服务）访问数据 |\n| test | 它评估模板表达式并返回 True\
  \ 或 False |\n| vars | 它向 Ansible 运行中注入并非来自清单源的额外变量数据。 |\n\n**表 3.3：** Ansible 插件类型\n\
  \n## 查找插件\n\n最常用的 Ansible 插件是查找插件（lookup plugins），允许我们扩展 Jinja2 以在 playbook 中访问外部源的数据。它们在\
  \ Ansible 控制节点上执行并评估。重要的 Ansible 查找插件用例总结在[表 3.4]中：\n\n| 插件名称 | 描述 |\n| :--- | :---\
  \ |\n| file | 它读取文件内容 |\n| ini | 它从 Windows INI 风格的文件读取 |\n| csvfile | 它从 CSV 文件读取\
  \ |\n| fileglob | 它监听匹配 shell 表达式的文件 |\n| lines | 它从 stdout 读取行 |\n| password |\
  \ 它生成随机密码 |\n| pipe | 它从 Unix 管道读取 |\n| url | 它通过 HTTP 或 HTTPS 返回 URL 内容 |\n\n**表\
  \ 3.4：** 流行的 Ansible 查找插件\n\n#拷贝多个文件到远程主机\n\n通常我们需要匹配模式的文件列表从本地复制到远程。假设我们想复制 examples\
  \ 目录下所有 `.txt` 扩展的文件。我们需要使用 Ansible 查找插件 `fileglob`。Ansible 查找插件将像一个 Ansible 循环语句一样，允许我们逐个循环找到的文件。我们可以在\
  \ Ansible 模块中使用 `{{ item }}` 变量来引用每一个文件名，就像在循环语句中一样。完整的 Ansible playbook 如下 `plugin_fileglob.yml`\
  \ 文件：\n\n```yaml\n---\n- name: Copy multiple files to remote hosts\nhosts: all\n\
  become: false\ntasks:\n- name: copy multiple file(s)\n  ansible.builtin.copy:\n\
  \    src: \"{{ item }}\"\n    dest: \"/home/devops/\"\n    mode: '0644'\n  with_fileglob:\n\
  \    - \"examples/*.txt\"\n```\n\n我们可以使用每个 Ansible 安装自带的 `ansible-playbook` 命令行工具来执行我们的\
  \ Ansible playbook：\n\n`ansible-playbook plugin_fileglob.yml`\n\n上一个 `ansible-playbook`\
  \ 命令的输出如下：\n\n```\nTASK [Copy multiple file(s)] *******************************************************************\n\
  changed: [server01.example.com] => (item=/home/devops/examples/example.txt)\n```\n\
  \n如预期的那样，每个每个文件的 Ansible 代码循环在 examples 目录中找到。在这种情况下，只找到了一个符合标准的文件（`examples/example.txt`）。完整路径显示在屏幕上。对于每个找到的文件，Ansible\
  \ 执行 `ansible.builtin.copy` 模块将文件从 Ansible 控制器复制到目标主机。预期结果当 Ansible playbook 在 server01.example.com\
  \ 上运行时，将文件从 `/home/devops/examples/example.txt` 复制到 `/home/devops/example.txt`。\n\
  \nAnsible 插件扩展了每个 Ansible 功能，并在我们的 Ansible 环境中实现了极佳的定制水平。\n\n在[第 8 章：Ansible Advanced]的\
  \ `Callback plugin` 部分了解更多关于 Ansible 回调插件的信息。\n\n# 结论由于作为基础设施自动化工具的本质，Ansible 有一些独特的特性：存储敏感信息（Ansible\
  \ vault）、仅在真正需要时执行任务（handler）、应用文本处理（filters）以及配置管理（template）。最好的部分是 Ansible 引擎可以使用某些\
  \ Ansible 插件完全扩展。在组织中采用时，我们可以从公共的 Ansible Galaxy 存档中受益，复用代码标准包（role 和 collection）。在接下来的章节中，我们将使用这些知识简化一些\
  \ Linux 和 Windows 管理任务。在下一章中，我们将学习如何为 Ansible 配置 Linux 目标并自动化配置管理、文件系统、安装包、滚动更新和用户管理。\n\
  \n# 注意事项\n\n- 我们可以使用 Ansible 插件扩展所有 Ansible 函数。\n- 敏感信息可以保存在 Ansible vault 中并使用\
  \ `ansible-vault` 命令实用程序进行管理。\n- 我们可以使用 handlers 在发生状态变化时连接任务。\n- 我们可以使用 template\
  \ 模块自动化配置管理。\n- Ansible galaxy 是以 roles 和 collections 形式封装的最大的 Ansible 资源。\n\n#\
  \ 单选题\n\n1. 修改 Ansible vault 密码的命令是什么？\n   a. `ansible-vault create`\n   b. `ansible-vault\
  \ edit`\n   c. `ansible-vault encrypt`\n   d. `ansible-vault rekey`\n\n2. 如何在 Ansible\
  \ playbook 中触发 Ansible handler？\n   a. `notify` 语句\n   b. `listen` 语句\n   c. `loop`\
  \ 语句\n   d. `when` 语句\n\n3. 使用什么实用程序安装 Ansible roles？\n   a. `ansible-playbook`\
  \ 命令\n   b. `ansible-galaxy` 命令\n   c. `ansible-inventory` 命令\n   d. `ansible` 命令\n\
  \n4. 如何在 Ansible 模板中指定控制语句？\n   a. `% statement %`\n   b. `{{ statement }}`\n  \
  \ c. `{% statement %}`\n   d. `statement`\n\n# 答案\n\n1. **D**\n2. **A**\n3. **B**\n\
  4. **C**\n\n# 思考\n\n1. 什么时候将代码打包为 role 有用？\n2. 为什么我们需要 `community.general` collection？\n\
  \n\n\n\n\n### 3. 如何使用 `selectattr` 过滤器操纵数据？\n\n### 4. 为什么我们需要嵌套控制语句？\n\n# 核心术语\n\
  \n- `Vault`: 一种密码保护的加密格式，用于存储敏感数据。\n- `Handler`: Ansible playbook 中的一种特殊任务，仅在状态发生变化时执行。\n\
  - `Role`: 一种标准的 Ansible 格式，用于在组织内部外部共享 Ansible playbook 代码。\n- `Collection`: 一种标准的\
  \ Ansible 格式，用于在组织内部外部共享模块、插件和额外的 Ansible 资源。\n\n# 第 4 章\n\n# Ansible 用于 Linux\n\
  \n## 引言\n\n使用 Ansible 原生模块自动执行 Linux 任务非常简单且有用。我们将从主机配置开始，然后移动到自动化部分。Ansible 提供了文件系统、用户管理以及许多日常系统管理任务的许多原生模块。充分利用\
  \ Ansible 技术可以节省时间并减少人为失误。在本章中，我们将学习如何配置 Linux 目标系统，以及如何在最常见的 Linux 发行版上执行文件和目录操作并更新软件。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 配置 Linux 目标主机\n- 测试主机可用性\n- 在执行期间打印文本\n- 配置管理\n\
  - 文件系统\n- 安装软件包和滚动更新\n- Linux 系统角色\n- 用户管理\n- 执行命令\n\n## 配置 Linux 目标主机\n\nLinux\
  \ 是 Ansible 自动化的一等公民。好消息是，对于大多数现代操作系统，我们几乎不需要进行任何配置。唯一的要求是目标系统上运行着 OpenSSH 服务，并成功安装了\
  \ Python 解释器，如 图 4.1 所示，这现在已经是大多数常见现代发行版 Linux 基础安装的一部分。连接到目标主机的 SSH 配置在任何 Linux\
  \ 发行版中都是相同的。\n\n首先，让我们为目标主机执行 Ansible SSH 配置，可以是：\n\n- 密码认证\n- SSH 密钥认证\n\n密码认证更简单，但我们更倾向于使用\
  \ SSH 密钥认证，因为它是最强大的机制。SSH 密钥认证依赖于通常使用椭圆曲线和复杂技术生成的公私钥对。\n\n请注意，初始 SSH 连接会将目标系统的指纹保存在\
  \ `~/.ssh/known_hosts` 文件中，以确保安全性并验证目标主机未被篡改或更改。\n\n## OpenSSH 配置\n\n`sshd` 服务的通用\
  \ OpenSSH 配置是在 `/etc/ssh/sshd_config` 文件中执行的。然而，对于每个验证用户，我们可以通过创建或修改简单的文本配置文件来更改服务的行为。\n\
  \n`.ssh` 目录是用户家目录下每个本地账户的隐藏配置文件夹。它决定了当前用户 SSH 连接的行为。以下是标准 Linux 系统中 `devops` 用户典型的\
  \ `~/.ssh` 目录内容：\n\n```/home/devops/.ssh\n├── authorized_keys\n├── id_rsa\n├── id_rsa.pub\n\
  └── known_hosts\n1 个目录, 4 个文件\n```\n\n`~/.ssh/authorized_keys` 认证文件决定了哪些密钥允许在系统中进行身份验证。\n\
  \n要实现 SSH 密钥认证，首先，我们需要一对通过 `ssh-keygen` 终端工具生成的公私和密钥。默认情况下，公钥存储在 `~/.ssh/id_rsa.pub`\
  \ 文件中，而私钥存储在 `~/.ssh/id_rsa` 文件中。某些系统管理员会根据偏好自定义此路径，导致系统中产生更多文件。\n\n我们需要验证目标主机上是否存在该用户名账户，并在清单文件中指定\
  \ SSH 密钥文件。我们可以使用 `ssh-copy-id` 命令行工具将公钥（假设存储在 `~/.ssh/id_rsa.pub` 文件中）拷贝到目标主机。\n\
  \n```bash\nssh-copy-id -i ~/.ssh/id_rsa.pub devops@server01.example.com\n```\n\n\
  在底层，上述命令连接到目标系统，并将公钥创建或追加到连接用户下的 `~/.ssh/authorized_keys` 认证文件以及当前系统的 `~/.ssh/known_hosts`\
  \ 文件中。\n\n会显示如下的主机密钥检查的初始消息：\n\n```\nssh devops@server01.example.com\n主主机 'server01.example.com\
  \ (192.168.0.20)' 的真实性无法确认。RSA 密钥指纹为 SHA256:42JErOjO9fKNNBapEEyhpfTNn+rt8SPNob00uRlmqRs。此密钥不属于任何其他名称。你确定要继续连接吗\
  \ (yes/no/[fingerprint])?\n```\n\n主机密钥通常在首次安装 OpenSSH 或计算机首次启动时自动生成。在验证并接受后，SSH\
  \ 指纹会被添加到 `~/.ssh/known_hosts` 文件中。这种主机验证被称为主机密钥检查机制。在第一个主机名和 IP 重用的快速迭代基础设施中，我们可以禁用主机密钥检查，通过在\
  \ `ansible.cfg` 配置文件中设置适当参数来实现，如 第 8 章：Ansible 高级 中的 Ansible 配置设置所示。\n\n## 主机变量\n\
  \n在清单中，可以存储与特定主机或组相关的变量值。主机变量最常见的用法是指定目标节点的认证凭据。例如，在不同主机之间定义不同的连接凭据或方法是很常见的。假设我们对\
  \ `server01.example.com` 使用本地连接（local），对所有其他主机使用默认连接类型 `ssh`。我们可以像下面的 `hostinventory.ini`\
  \ 文件那样，为 `server01.example.com` 自定义登录用户 `devops`，为 `server02.example.com` 定义 `ansible`：\n\
  \n```ini\n[web]\nserver01.example.com ansible_connection=local\nserver01.example.com\
  \ ansible_connection=ssh ansible_user=devops\nserver02.example.com ansible_connection=ssh\
  \ ansible_user=ansible\n```\n\n我们可以使用以下 Ansible 命令验证列表视图：\n\n```bash\nansible-inventory\
  \ -i hostinventory.ini --list\n```\n\n该命令对 `hostinventory.ini` 清单产生如下输出：\n\n```json\n\
  {\n  \"server01.example.com\": {\n    \"ansible_connection\": \"local\"\n  },\n\
  \  \"server01.example.com\": {\n    \"ansible_connection\": \"ssh\",\n    \"ansible_user\"\
  : \"devops\"\n  },\n  \"server02.example.com\": {\n    \"ansible_connection\": \"\
  ssh\",\n    \"ansible_user\": \"ansible\"\n  },\n  \"all\": {\n    \"children\"\
  : [\n      \"ungrouped\",\n      \"web\"\n    ]\n  },\n  \"web\": {\n    \"hosts\"\
  : [\n      \"server01.example.com\",\n      \"server01.example.com\",\n      \"\
  server02.example.com\"\n    ]\n  }\n}\n```\n\n## 组变量\n\n与单个主机一样，也可以定义组变量。在示例的两个清单文件（INI\
  \ 和 YAML 格式）中，变量 `ntp_server` 为所有组内主机分配了值 `europe.pool.ntp.org`。\n\n在下面的清单中，我们为\
  \ `web` 组内的所有主机设置了组变量 `ntp_server`，指向共享的 NTP 服务器，如 `groupsvariables_inventory.ini`\
  \ 文件所示：\n\n```ini\n[web]\nserver01.example.com\nserver02.example.com\n\n[web:vars]\n\
  ntp_server=europe.pool.ntp.org\n```\n\n我们可以使用 `ansible-inventory` 命令获取列表视图结果：\n\n\
  ```bash\nansible-inventory -i groupsvariables_inventory.ini --list\n```\n\n\n\n\n\
  该命令为 `groupsvariables_inventory.ini` 清单产生以下输出：\n\n```json\n{\n  \"_meta\": {\n \
  \   \"hostvar\": {\n      \"server01.example.com\": {\n        \"ntp_server\": \"\
  europe.pool.ntp.org\"\n      },\n      \"server02.example.com\": {\n        \"ntp_server\"\
  : \"europe.pool.ntp.org\"\n      }\n    }\n  },\n  \"all\": {\n    \"children\"\
  : [\n      \"ungrouped\",\n      \"web\"\n    ]\n  },\n  \"web\": {\n    \"hosts\"\
  : [\n      \"server01.example.com\",\n      \"server02.example.com\"\n    ]\n  }\n\
  }\n```\n\n正如我们在上一节中所学习的，我们可以使用 YAML 清单获得相同的结果。这与 `groupsvariables_inventory.yml`\
  \ 文件中之前的示例相同的 YAML 格式相同：\n\n```yaml\n---\nweb:\n  hosts:\n    server01.example.com:\n\
  \    server02.example.com:\n  vars:\n    ntp_server: europe.pool.ntp.org\n```\n\n\
  我们可以通过使用以下 `ansible-inventory` 命令获取列表视图：\n\n`ansible-inventory -i groupsvariables_inventory.yml\
  \ --list`\n\n这是 `groupsvariables_inventory.yml` 清单的列表视图输出：\n\n```json\n{\n  \"_meta\"\
  : {\n    \"hostvars\": {\n      \"server01.example.com\": {\n        \"ntp_server\"\
  : \"europe.pool.ntp.org\"\n      },\n      \"server02.example.com\": {\n       \
  \ \"ntp_server\": \"europe.pool.ntp.org\"\n      }\n    }\n  },\n  \"all\": {\n\
  \    \"children\": [\n      \"ungrouped\",\n      \"web\"\n    ]\n  },\n  \"web\"\
  : {\n    \"hosts\": [\n      \"server01.example.com\",\n      \"server02.example.com\"\
  \n    ]\n  }\n}\n```\n\n关于如何配置 NTP 服务器的完整代码，请参阅 *Linux System Roles* 章节。\n\n# 继承变量值\n\
  \n主机和组变量可以结合。在示例中，`web` 组有两个成员，`asia` 和 `europe`。这两个变量分别在单主机 `server01.example.com`\
  \ 和 `server02.example.com` 中定义，但也可以包含更多主机。`ntp_server` 变量在 `web` 级级定义。因此，最后 `ntp_server`\
  \ 变量对 `web`、`asia` 和 `europe` 组可用。`ntp_server` 变量也对 `server01.example.com` 和 `server02.example.com`\
  \ 主机可用。\n\n此 `variableinheriting_inventory.ini` 文件是包含继承变量的最终清单：\n\n```ini\n[web]\n\
  [asia]\nserver01.example.com\n[europe]\nserver02.example.com\n[web:children]\nasia\n\
  europe\n[web:vars]\nntp_server=europe.pool.ntp.org\n```\n\n我们可以使用 `ansible-inventory`\
  \ 命令获取清单的列表视图：\n\n`ansible-inventory -i variableinheriting_inventory.ini --list`\n\
  \n该命令为 `variableinheriting_inventory.ini` 清单产生输出：\n\n```json\n{\n  \"_meta\": {\n\
  \    \"hostvars\": {\n      \"server01.example.com\": {\n        \"ntp_server\"\
  : \"europe.pool.ntp.org\"\n      },\n      \"server02.example.com\": {\n       \
  \ \"ntp_server\": \"europe.pool.ntp.org\"\n      }\n    }\n  },\n  \"all\": {\n\
  \    \"children\": [\n      \"ungrouped\",\n      \"web\"\n    ]\n  },\n  \"asia\"\
  : {\n    \"hosts\": [\n      \"server01.example.com\"\n    ]\n  },\n  \"europe\"\
  : {\n    \"hosts\": [\n      \"server02.example.com\"\n    ]\n  }\n  [...]\n}\n\
  ```\n\n我们可以使用 `variableinheriting_inventory.yml` 文件使用 YAML 格式获得与 INI 格式相同的 Ansible\
  \ 清单结果：\n\n```yaml\n---\nchildren:\n  hosts:\n    web:\n      asia:\n        hosts:\n\
  \          host1.example.com:\n      europe:\n        hosts:\n          host2.example.com:\n\
  \      vars:\n        ntp_server: europe.pool.ntp.org\n```\n\n我们可以使用 `ansible-inventory`\
  \ 命令检查列表视图结果：\n\n`ansible-inventory -i variableinheriting_inventory.yml --list`\n\
  \n输出很长，但并不像看起来那么复杂。它按照预期为 `variableinheriting_inventory.yml` 文件报告了配置：\n\n```json\n\
  {\n  \"_meta\": {\n    \"hostvars\": {\n      \"web\": {\n        \"asia\": {\n\
  \          \"hosts\": {\n          \"host1.example.com\": null\n        }\n    \
  \    },\n        \"europe\": {\n          \"hosts\": {\n            \"host2.example.com\"\
  : null\n          }\n        },\n        \"vars\": {\n          \"ntp_server\":\
  \ \"europe.pool.ntp.org\"\n        }\n      }\n    }\n  }\n}\n```\n\n# 密码认证\n\n\
  为了实现 SSH 密码认证，我们需要验证目标主机上是否存在用户名账户，并在我们的清单文件中指定凭据（用户名和密码）。或者，我们可以将这些敏感数据存储在 Ansible\
  \ vault 中（参见 *[Chapter 3: Ansible Language Extended]* 章节中的 *Ansible Vault* 部分）。我们可以通过指定主机或组变量，将配置应用于\
  \ Ansible 清单中的单个主机或组。请注意，在启动配置之前，必须在目标 Linux 系统上启用密码认证。\n\n该配置通常需要在 SSH 服务配置文件 `/etc/ssh/sshd_config`\
  \ 中添加以下行并重启 `sshd` 服务：\n\n```ssh\nPasswordAuthentication yes\n```\n\n也可以自动执行对配置文件的编辑，正如本章的“编辑单行文本”部分中通过\
  \ playbook 所示所示，请参见“编辑 OpenSSH 配置代码”。\n\n以下 `ssh_password_inventory.ini` 文件使用密码认证连接到\
  \ `server01.example.com`：\n\n`server01.example.com ansible_connection=ssh ansible_user=devops\
  \ ansible_password=mypassword ansible_host=192.168.0.20`\n\n其中：\n\n*   `ansible_connection`，连接协议\
  \ - 在此情况下为 `ssh`\n*   `ansible_user`，初始认证的用户名 - 在此情况下为 `devops`\n*   `ansible_password`，认证密码\
  \ - 在此情况下为 `mypassword`\n*   `ansible_host`，主机的自定义 IP 地址 - 在此情况下为 `192.168.0.20`\n\
  \n出于安全考虑，在生产环境中强烈建议不要密码认证。然而，它对于实验室或开发目的可能有用。有时当 Ansible 控制器上没有安装 `sshpass` 程序时，可能会遇到问题（参见\
  \ *Chapter 6: Ansible Troubleshooting* 章节中的 *Ansible connection* 部分）。\n\n## SSH\
  \ 密钥认证\n\n我们可以在清单中使用主机变量或组变量指定连接凭据。最简单的方法是每个主机指定 SSH 密钥。\n\n以下 `ssh_password_inventory.ini`\
  \ 文件使用基于密钥的认证连接到 `server01.example.com`：\n\n`server01.example.com ansible_connection=ssh\
  \ ansible_user=devops ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_host=192.168.0.20`\n\
  \n其中：\n\n*   `ansible_connection`，连接协议 - 在此情况下为 `ssh`\n*   `ansible_user`，初始认证的用户名\
  \ - 在此情况下为 `devops`\n*   `ansible_ssh_private_key_file`，用于认证的私 SSH 私钥 - 在此情况下为 `~/.ssh/id_rsa`\n\
  *   `ansible_host`，主机的自定义 IP 地址 - 在此情况下为 `192.168.0.20`\n\n每次我们在执行时指定 Ansible 清单，都会使用文件中指定的\
  \ `ssh` 密钥与目标节点建立连接。如果连接凭据发生变化，只需编辑文件，否则连接将因凭据错误终止。\n\n# 测试主机可用性\n\n成功测试目标主机是否可用是对目标主机执行任何进一步自动化的基础。在自动化之旅中继续前进并验证目标主机是否能够执行我们的\
  \ Ansible 代码是有用的。\n\n# Ansible ping 模块\n\n\n\n\n\n我们可以使用 Ansible 模块 `ping`（全称为 `ansible.builtin.ping`）来测试主机可用性。它用于测试目标主机的可用性。该模块是\
  \ `builtin` 模块集合的一部分，并随 Ansible 一起发布。这是一个非常成熟的模块，已经发布多年。它验证了 Ansible 登录受管主机的能力，以及\
  \ Python 解释器能够执行我们的代码。因此，它与网络上下文中的 ping 完全不同，不要混淆！当我们的目标系统是 Windows 时，我们需要使用 `win_ping`\
  \ 模块，如第 5 章：适用于 Windows\n\n以下 `ping.yml` playbook 示例了如何使用默认 ping 参数使用 Ansible ping\
  \ 模块：\n\n```yaml\n---\n- name: Ping Test\n  hosts: all\n  tasks:\n    - name: Test\
  \ Connection\n      ansible.builtin.ping:\n```\n\n我们可以使用 `ansible-playbook` 命令执行代码。执行\
  \ `ping.yml` playbook 的完整命令为：\n\n`ansible-playbook ping.yml`\n\n执行 `ping.yml` Ansible\
  \ playbook 产生产生以下输出：\n\n```\nPLAY [Ping Test] ************************************************************************\n\
  TASK [Gathering Facts] *************************************************************************\n\
  ok: [server01.example.com]\nTASK [Test Connection] *************************************************************************\n\
  ok: [server01.example.com]\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=2    changed=0   unreachable=0   failed=0   skipped=0 \
  \  rescued=0   ignored=0\n```\n\n之前的执行显示了主机 server01.example.com 的 `ok` 状态。\n\n\
  通过在 `ansible-playbook` 命令中添加一级详细程度的详细执行参数 `-v`，我们可以看到 `ping`: `pong` 消息：\n\n`ansible-playbook\
  \ -v ping.yml`\n\n详细执行的输出向我们在屏幕上显示了 `ping`: `pong` 消息：\n\n```\nPLAY [Ping Test]\
  \ *********************************************************************\nTASK [Gathering\
  \ Facts] **********************************************************************\n\
  ok: [server01.example.com]\nTASK [Test Connection] **********************************************************************\n\
  ok: [server01.example.com] => {\"changed\": false, \"ping\": \"pong\"}\nPLAY RECAP\
  \ *****************************************************************************\n\
  server01.example.com                ok=2    changed=0   unreachable=0   failed=0\
  \   skipped=0   rescued=0   ignored=0\n```\n\n通过详细执行，我们在 `Test Connection` 任务的屏幕上显示了\
  \ `ping`: `pong` 消息。\n\n## Data 参数自定义\n\n我们可以通过向 Ansible ping 的 `data` 参数传递值来自定义\
  \ `pong` 的输出。假设我们希望在输出消息“ping”：“pong”消息中获得“ready for connections”而不是 pong 结果。通过自定义\
  \ `data` 值，我们可以获得输出“ping”：“ready for connections”。我们只需要将 `data` 参数的值改为 `ready for\
  \ connections` 即可。完整的 Ansible playbook `ping2.yml` 如下：\n\n```yaml\n---\n- name:\
  \ Ping Test\n  hosts: all\n  tasks:\n    - name: Test Connection\n      ansible.builtin.ping:\n\
  \        data: \"ready for connections\"\n```\n\n在带有 `ansible-playbook` 命令的一级详细程度的详细执行参数\
  \ `-v` 执行之前的 playbook 时，我们可以看到 `\"ping\": \"ready for connections\"` 消息：\n\n`ansible-playbook\
  \ -v ping2.yml`\n\n详细执行的输出向我们显示了 `\"ping\": \"ready for connections\"` 消息：\n\n```\n\
  PLAY [Ping Test] *********************************************************************\n\
  TASK [Gathering Facts] **********************************************************************\n\
  ok: [server01.example.com]\nTASK [Test Connection] **********************************************************************\n\
  ok: [server01.example.com] => {\"changed\": false, \"ping\": \"ready for connections\"\
  }\nPLAY RECAP *****************************************************************************\n\
  server01.example.com                ok=2    changed=0   unreachable=0   failed=0\
  \   skipped=0   rescued=0   ignored=0\n```\n\n如预期所示，`data` 参数的 `ready for connections`\
  \ 值显示了输出 `\"ping\": \"ready for connections\"` 消息。\n\n## Data 参数 crash\n\n我们可以测试\
  \ `data` 参数的 `crash` 值的使用。以下 `ping3.yml` Ansible playbook 与之前的 `ping2.yml` 类似，但在结尾带有\
  \ `crash` 值的 `data` 参数：\n\n`data: crash`\n\n整个 `ping3.yml` playbook 如下：\n\n```yaml\n\
  ---\n- name: Ping Test\n  hosts: all\n  tasks:\n    - name: Test Connection\n  \
  \    ansible.builtin.ping:\n        data: crash\n```\n\n我们可以使用完整命令执行代码 `ping3.yml`：\n\
  \n`ansible-playbook ping3.yml`\n\n`ansible-playbook` 命令产生以下输出：\n\n```\nPLAY [Ping\
  \ Test] *********************************************************************\n\
  TASK [Gathering Facts] **********************************************************************\n\
  ok: [server01.example.com]\nTASK [Test Connection] **********************************************************************\n\
  An exception occurred during task execution. To see the full traceback, use -vvv.\
  \ The error was: Exception: boom\n```\n\n\n\n\n\n```json\nfatal: [server01.example.com]:\
  \ FAILED! => {\"changed\": false, \"module_stderr\": \"Traceback (most recent call\
  \ last):\\n  File \\\"/home/devops/.ansible/tmp/ansible-tmp-1675972209.0283306-517-3057200066775/AnsiballZ_ping.py\\\
  \", line 107, in <module>\\n        __ansiballz_main()\\n  File \\\"/home/devops/.ansible/tmp/ansible-tmp-1675972209.0283306-517-3057200066775/AnsiballZ_ping.py\\\
  \", line 99, in _ansiballz_main\\n        _invoke_module(zipped_mod, temp_path,\
  \ ANSIBALLZ_PARAMS)\\n  File \\\"/home/devops/.ansible/tmp/ansible-tmp-1675972209.0283306-517-3057200066775/AnsiballZ_ping.py\\\
  \", line 47, in invoke_module\\n      _runpy.run_module(mod_name='ansible.modules.ping',\
  \ init_globals=dict(_module_fqn='ansible.modules.ping', _modlib_path=modlib_path),\\\
  n  File \\\"/usr/lib/python3.8/runpy.py\\\", line 207, in run_module\\n      _run_module_code(code,\
  \ init_globals, run_name, mod_spec)\\n  File \\\"/usr/lib/python3.8/runpy.py\\\"\
  , line 97, in _run_module_code\\n      _run_code(code, mod_globals, init_globals,\\\
  n  File \\\"/usr/lib/python3.8/runpy.py\\\", line 87, in _run_code\\n      _exec(code,\
  \ run_globals)\\n  File \\\"/tmp/ansible_ansible.builtin.ping_payload_hqari_b8/ansible_ansible.builtin.ping_payload.zip/ansible/modules/ping.py\\\
  \", line 89, in <module>\\n  File \\\"/tmp/ansible_ansible.builtin.ping_payload_hqari_b8/ansible_ansible.builtin.ping_payload.zip/ansible/modules/ping.py\\\
  \", line 79, in main\\nException: boom\\n\", \"module_stdout\": \"\", \"msg\": \"\
  MODULE FAILURE\\nSee stdout/stderr for the exact error\", \"rc\": 1}\n```\n\n`PLAY\
  \ RECAP *****************************************************************************`\n\
  \n`server01.example.com                 : ok=1   changed=0   unreachable=0   failed=1   skipped=0   rescued=0   ignored=0`\n\
  [/content] (continued)\n\n正如所预期的，`data` 参数的 `crash` 值为运行时异常，正如我们通过失败状态和消息 `An exception\
  \ occurred during task execution`（任务执行期间发生异常）所示。正如我们在本节中学习的，Ansible ping 模块是测试目标主机可用性的一种方便方法。\n\
  \n## 在执行期间打印文本\n\n我们经常需要在 Ansible 中打印消息或变量的值。这些语句可以是文本、Ansible 变量、魔法变量、事实（facts）等，或者是这些元素的组合。\n\
  \n## Ansible debug 模块\n\n我们使用 `ansible.builtin` 集合中包含的 Ansible 模块 `debug` 在屏幕上显示文本或变量。`ansible.builtin`\
  \ 模块随任何 Ansible 安装一起发布。我们使用 `ansible.builtin` 集合中的 `debug` 模块来执行此任务。我们已经介绍过该模块用于打印调试信息，如*第\
  \ 2 章：Ansible 语言核心*中的 *Ansible Playbook* 节所示。\n\n`debug` 模块有三个参数：\n\n1. `msg` 参数\n\
  2. `var` 参数\n3. `verbosity` 参数\n\n当我们不带任何参数执行该模块时，将使用默认文本 `Hello world!`（带有感叹号）。我们可以使用\
  \ `msg` 参数自定义文本。它可以是静态字符串、变量、事实、魔法变量或它们的组合。`var` 参数用于打印变量。\n\n请注意，每当我们想在 `msg` 参数中使用变量值而不是变量名时，要使用双括号，而在\
  \ `var` 参数中仅使用变量名。例如，`{{ ansible_version }}` 是内部变量，它包含了控制器当前的 Ansible 版本。\n\n# verbosity（详细程度）参数\n\
  \n正如在*第 2 章：Ansible 语言核心*、*Ansible Playbook* 中预期的，“verbosity”参数用于我们希望在正常执行时隐藏调试代码，但在需要时将其保留在\
  \ playbook 中的情况。`verbosity` 参数的值可以是从零到四的数字。通过指定 `verbosity` 参数，文本只有在代码以相同详细程度级别或更高级别执行时才会打印在屏幕上。Ansible\
  \ 有五个详细程度级别。我们可以使用 `ansible-playbook` 命令的 `-v` 参数指定运行的详细程度级别，如下表 4.1 所示：\n\n| Levels\
  \ | ansible-playbook parameter |\n| :--- | :--- |\n| 0 (zero) | no parameter |\n\
  | 1 (one) | -v |\n| 2 (two) | -vv |\n| 3 (three) | -vvv |\n| 4 (four) | -vvvv |\n\
  \n**表 4.1：** Ansible 详细程度级别\n\n我们可以使用 `-v` 参数指定详细程度级别 1，使用 `-vv` 参数指定级别 2，依此类推。字符\
  \ `v` 字符的数量决定了详细程度。具有特定详细程度的消息仅在相同的详细程度下显示。如果不在相同的详细程度，我们将在任务上获得一个跳过状态。以下代码在运行详细程度级别\
  \ 1 执行 `ansible-playbook` 命令时，打印 `ansible_version` 魔法变量的值。\n\n有关如何自定义 `ansible-playbook`\
  \ 命令的默认详细程度级别，请参阅*第 8 章：Ansible 高级*、*Ansible configuration*。\n\n# 显示 Ansible 版本\n\
  \n下面的 `debug.yml` Ansible Playbook 仅在运行详细程度级别 1 运行时在屏幕上显示消息：\n\n```yaml\n---\n-\
  \ name: Ansible version\n  hosts: all\n  tasks:\n    - name: Display version\n \
  \     ansible.builtin.debug:\n        msg: \"{{ ansible_version }}\"\n      verbosity:\
  \ 1\n```\n\n执行详细程度 0（zero）：当不在指定任何详细程度级别的情况下执行 Ansible Playbook 时。假设在使用不带额外参数的 `ansible-playbook`\
  \ 命令时使用详细程度 0：`ansible-playbook debug.yml`。该消息仅在详细程度至少为 1 时可见。因为当前详细程度为 0，我们没有达到级别\
  \ 1，我们在任务 `Display version` 上获得了一个跳过状态：\n\n```text\nTASK [Display version] *********************************************\n\
  skipping: [server01.example.com]\nPLAY RECAP *************************************************************\n\
  server01.example.com                  ok=1   changed=0   unreachable=0   failed=0\
  \   skipped=1   rescued=0   ignored=0\n```\n\n执行详细程度 1（one）：当以详细程度 1 执行 Ansible\
  \ Playbook 时，注意与之前的执行相比，使用了 `-v` 参数，我们得到了不同的结果：`ansible-playbook -v debug.yml`。\n\
  \n完整输出如下。请注意，与详细程度 1 的正常执行相比，Ansible Playbook 的输出会更详细：\n\n```text\nTASK [Display\
  \ version] ****************************************\nok: [server01.example.com]\
  \ => {\n  \"ansible_version\": {\n    \"full\": \"2.14.4\",\n    \"major\": 2,\n\
  \    \"minor\": 14,\n    \"revision\": 4,\n    \"string\": \"2.14.4\"\n  }\n}\n\
  PLAY RECAP *************************************************************\nserver01.example.com\
  \                  ok=2   changed=0   unreachable=0   failed=0   skipped=0   rescued=0\
  \   ignored=0\n```\n\n正如所预期的，以详细程度 1 执行 playbook 时，我们能够看到带有 `ansible_version` 变量完整值的调试消息。\n\
  \n`debug` 模块是一种用于内部使用或测试代码打印消息的方便方法。通过指定详细程度，我们可以轻松地在正常执行时隐藏它们。\n\n## 配置管理\n\n\n\
  \n\nAnsible 在编辑文本文件方面非常强大。这种能力在处理 Linux 服务的配置文件时非常有用。我们将学习 Ansible 的 `lineinfile`\
  \ 模块以及 Ansible `copy` 模块的一个特殊用例。我们可以通过文本配置文件来控制 Linux 系统的行为。因为“一切皆文件”的概念是 Unix 操作系统的基础。编辑文本配置文件是每一位系统管理员、IT\
  \ 运维工程师和 SRE 的日常工作。它可能是一个服务配置文件、启用选项或 Unix 参数。配置管理（CM）也是一种确保系统随时间推移运行符合预期的方法。由于\
  \ Ansible 是一种声明式编程语言，我们很容易地使用 `check` 选项在系统中实现配置管理审计。更多详细信息，请参阅 *第 2 章：Ansible 语言核心*\
  \ 中的 *Ansible Playbook* 章节。所有这些用例都需要编辑文本文件。安全自动化、基础设施、备和应用部署用例通常依赖于这种能力。请记住，与许多脚本语言（Perl、Bash、Python\
  \ 等）的顺序执行方法相比，Ansible 使用声明式模型，因此以下模块侧重于结果而非实现结果的步骤。\n\n# 单行编辑 (#toc.xhtml_s151a)\n\
  \n在文件中编辑单行文本通常需要手动操作来连接到目标机器并避免任何拼写错误。当需要管理的服务器数量增加时，我们需要一种自动化方法在我们的服务器集群上执行此类更改。\n\
  \n# Ansible lineinfile 模块 (#toc.xhtml_s152a)\n\n我们可以使用 Ansible 模块 `lineinfile` 编辑任何文本文件。该模块的完整名称是\
  \ `ansible.builtin.lineinfile`。该模块是任何 Ansible 安装自带的 `builtin` 模块集合的一部分。此模块支持许多类\
  \ Unix 操作系统。我们可以使用此模块在文件中插入、更新和删除单行文本。\n\n`lineinfile` Ansible 模块有许多参数，但唯一的强制性参数是\
  \ `path`，它指定要编辑的文件的文件系统路径。下表*表 4.2* 总结了 `lineinfile` Ansible 模块最重要的六个可选参数：\n\n|\
  \ 参数 |  |\n| :--- | :--- |\n| `line` | 文本行 |\n| `insertafter` 和 `insertbefore` |\
  \ 指定文本位置 |\n| `regex` | 指定用于匹配的正则表达式 |\n| `create` | 如果文件不存在则创建它 |\n| `state` |\
  \ 行是“存在”（present）还是“不存在”（absent）？ |\n\n**表 4.2：** lineinfile 模块可选参数\n\n正如预期，参数 `line`\
  \ 指定了我们想要插入文件的文本行。默认情况下，文本将插入到文件末尾，但我们可以通过 `insertafter` 或 `insertbefore` 参数在特定位置进行个性化设置。更好的方法是使用正则表达式在文件中搜索特定模式。我们可以在\
  \ `regex` 参数中指定正则表达式。\n\n如果有任何工具可以验证文件，我们可以在 `validate` 参数中指定命令行，这对于配置文件非常有用。在这种情况下，我们可以使用特殊的\
  \ `%s` 作为临时文件路径以进行验证。如果文件不存在，我们可以使用 `create` 参数创建它。还可以通过指定参数 `state` 的值为 `absent`\
  \ 来删除一行文本。`state` 参数的默认值为 `present`，意味着在文本文件中添加或验证该行的存在性。下表*表 4.3* 总结的可选参数指定了 `lineinfile`\
  \ Ansible 模块的文件系统权限：\n\n| 参数 | | |\n| :--- | :--- |\n| `owner` | 指定文件系统用户名 |\n|\
  \ `group` | 指定文件系统组 |\n| `mode` | 以八进制模式 (0644) 或符号模式 (u=rw,g=r,o=r) 指定文件系统权限 |\n\
  \n**表 4.3：** 文件系统权限\n\n# 编辑 OpenSSH 配置 (#toc.xhtml_s153a)\n\n假设我们想在 OpenSSH 服务中启用密码认证。我们需要手动编辑\
  \ SSH 配置 `/etc/ssh/sshd_config` 文件，并更改 `PasswordAuthentication yes` 行，或者在不存在时添加它。我们可以利用正则表达式匹配所有以\
  \ `PasswordAuthentication` 开头的行，并将其替换为 `PasswordAuthentication yes`。我们还添加了 `validate`\
  \ 参数来测试结果配置文件是否存在语法错误。在这种情况下，SSH 服务像许多 Linux 服务一样，拥有固有的配置文件检查，我们可以通过 `sshd -t -f\
  \ %s` 命令执行它。请参阅 SSH 手页以深入了解该命令。`%s` 部分将在运行时由 Ansible 替换为编辑后的临时文件路径。有趣的一点是，如果验证测试失败，playbook\
  \ 将失败。我们利用 Ansible handler 仅在对配置文件发生任何更改时才重启服务。如果没有更改，则不会发生重启。整个 Ansible Playbook\
  \ 如下：\n\n```yaml\n---\n- name: Edit OpenSSH Configuration\nhosts: all\nbecome: true\n\
  tasks:\n- name: Allow Password Authentication\n    ansible.builtin.lineinfile:\n\
  \      state: present\n      dest: /etc/ssh/sshd_config\n      regexp: \"^PasswordAuthentication\"\
  \n      line: \"PasswordAuthentication yes\"\n      validate: 'sshd -t -f %s'\n\
  \      notify: Restart service\nhandlers:\n- name: Restart service\n  ansible.builtin.service:\n\
  \    name: sshd\n    state: restarted\n```\n\n我们可以使用 `ansible-playbook` 命令执行 Ansible\
  \ Playbook。完整命令如下：\n\n```bash\nansible-playbook lineinfile.yml\n```\n\n我们针对目标节点\
  \ `localhost` 执行了代码，并使用了之前的*第 2 章：Ansible 语言核心* 所示的 `localhost_inventory.ini` 本地清单。`ansible-playbook`\
  \ 命令的输出如下：\n\n```\nTASK [Allow Password Authentication] ***********************************************************\n\
  changed: [localhost]\n\nPLAY RECAP *****************************************************************************\n\
  localhost: ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n我们可以看到，允许密码认证的任务处于更改状态，这意味着在目标主机上执行了一些修改。\n\nAnsible 模块 `lineinfile`\
  \ 允许我们修改文件系统上的任何文本文件。该模块非常强大，特别是结合正则表达式使用时，例所示。\n\n当处理文件中的更多行时，可以使用 Ansible 模块 `blockinfile`，具有与\
  \ `lineinfile` 模块类似的参数和选项。然而，在编辑 Linux 配置文件时，优先使用 Ansible template 模块。更多信息请参阅*第\
  \ 3 章：Ansible 语言扩展* 中的 *Ansible Template* 章节。\n\n# 创建文本文件 (#toc.xhtml_s154a)\n\n\
  创建配置文件是每一位系统管理员、IT 运维工程师和 SRE 的日常工作，因为在 Linux 中，一切都是文件。它可能是一个服务配置文件、启用选项或 Unix 参数。所有这些用例都需要创建一个文本文件。\n\
  \n\n\n\n\nAnsible `copy` 模块通常用于将文件复制到远程位置，正如我们在*将本地文件复制到远程主机*章节中所学到的。复制操作是从 Ansible\
  \ 控制器执行到目标节点的。然而，`copy` 模块也可以从零开始创建简单的文本文件。Ansible `copy` 模块的全称为 `ansible.builtin.copy`\
  \ `，这意味着它是 Ansible 核心安装模块集合的一部分。其目的是将文件复制到远程位置，但也可以创建一些简单的文本文件。\n\n如果我们需要更复杂的配置，建议使用\
  \ Ansible 的 `template` 模块（参见*第 3 章：Ansible 语言扩展*，章节 *Ansible template* ）。\n\nAnsible\
  \ `copy` 模块有许多参数，但唯一的强制性参数是 `dest`。`dest` 参数指定远程绝对路径目标。以下四个可选参数可以在 *表 4.4* 中找到总结，非常实用：\n\
  \n| **参数** | **描述** |\n| :--- | :--- |\n| `content` | 文件内容 |\n| `owner` | 指定文件系统用户名\
  \ |\n| `group` | 指定文件系统组 |\n| `mode` | 以八进制模式 (0644) 或符号模式 (u=rw,g=r,o=r) 指定文件系统权限\
  \ |\n\n**表 4.4：** copy 模块可选参数\n\n`content` 参数直接将文件内容设为指定的值。它仅在 `dest` 为文件时起作用。请注意，在\
  \ `content` 参数中使用变量将导致不可预测的输出。对于高级格式化或内容包含变量的情况，请使用 `ansible.builtin.template` 模块（参见*第\
  \ 3 章：Ansible 语言扩展*，章节 *Ansible template* ）。让我强调一下，我们可以指定文件系统权限（模式、所有者和组组）。\n\n\
  ## 创建 example.txt 文件\n\n以下 Ansible Playbook 创建了一个包含三行文本的文件 `report.txt`：\n\n`1 Automate`\n\
  `2 Everything`\n`3 with Ansible`\n\n整个 Ansible Playbook 如下：\n\n```yaml\n---\n- name:\
  \ Create example.txt file\n  hosts: all\n  vars:\n    myfile: \"report.txt\"\n \
  \ tasks:\n    - name: Create a text file\n      ansible.builtin.copy:\n        dest:\
  \ \"{{ myfile }}\"\n        content: |\n          1 Automate\n          2 Everything\n\
  \          3 with Ansible\n```\n\n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook` 命令来执行代码。完整命令如下：\n\
  \n`ansible-playbook copy.yml`\n\n执行 `copy.yml` Ansible Playbook 的输出如下：\n\n```text\n\
  TASK [create a text file] **********************************************************************\n\
  changed: [server01.example.com]\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=2     changed=1    unreachable=0   failed=0    skipped=0\
  \   rescued=0   ignored=0\n```\n\n如预期所示，文件 `example.txt` 已被创建。我们可以使用 `cat` 命令打印文件内容：\n\
  \n`cat report.txt`\n\n`cat` 命令的输出是以下 `report.txt` 文件：\n\n`1 Automate`\n`2 Everything`\n\
  `3 with Ansible`\n\nAnsible `copy` 模块通常用于在 Ansible 控制器和目标节点之间复制文件。但我们发现了如何使用它来创建文本文件。当我们想在生成文件中使用\
  \ Ansible 变量、事实或魔法变量时，请使用 Ansible `template` 模块以避免某些的致命错误或意外行为。参见*第 3 章：Ansible\
  \ 语言扩展*，章节 *Ansible template* 。\n\n## 文件系统\n\nAnsible 自动化了许多文件系统操作，处理文件和目录。这些能力在处理基础设施配置和应用程序部署用例时非常有用。我们现在将探索\
  \ Ansible 的 `stat` 和 `file` 模块。\n\n![](img/139.jpg)\n\n# 检查文件是否存在\n\nAnsible `stat`\
  \ 模块属于 `ansible.builtin` 用于检索文件条目或文件系统状态。对于 Windows 目标，请使用 `ansible.windows.win_stat`\
  \ 模块，如*第 5 章：Ansible For Windows*，章节 *File system* 中所述。\n\nAnsible `stat` 模块的参数：\n\
  \n`path string`\n\n唯一的强制参数是 `path` 参数，它是要检查的对象在文件系统上的完整路径。该模块返回一个复杂对象。我们感兴趣的属性是\
  \ `exists`。当此属性为 `true` 时，意味着对象存在。该模块具有以下可选参数来定义某些文件或目录属性，如 *表 4.5* 所示：\n\n| 参数\
  \ | 描述 |\n| :--- | :--- |\n| Owner | 指定文件系统用户名 |\n| Group | 指定文件系统组 |\n| Mode |\
  \ 以八进制模式 (0644) 或符号模式 (u=rw,g=r,o=r) 指定文件系统权限 |\n\n**表 4.5：** 文件系统模块可选参数\n\n此外，我们可以使用\
  \ `selevel`、`serole`、`setype` 和 `seuser` 参数定义 SELinux 文件系统对象上下文。\n\n以下 `check_file.yml`\
  \ Ansible Playbook 如果 `/home/devops/example.txt` 路径是否存在将显示消息：\n\n```yaml\n---\n\
  - name: Check file exists\n  hosts: all\n  vars:\n    myfile: /home/devops/example.txt\n\
  \  tasks:\n    - name: Check if a file exists\n      ansible.builtin.stat:\n   \
  \     path: \"{{ myfile }}\"\n      register: path_data\n    - name: Report file\
  \ exists\n      ansible.builtin.debug:\n        msg: \"The file {{ myfile }} exist\"\
  \n      when: path_data.stat.exists\n    - name: Report file not exists\n      ansible.builtin.debug:\n\
  \        msg: \"The file {{ myfile }} doesn't exist\"\n      when: not path_data.stat.exists\n\
  ```\n\n同样，我们可以通过检查 `isdir` 属性测试目标路径是否为目录。以下代码显示了如何将条件应用于之前代码中注册的 `path_data` 变量：\n\
  \n`path_data.stat.isdir is defined and path_data.stat.isdir`\n\n## 创建空文件\n\nAnsible\
  \ `file` 模块属于 `ansible.builtin` 集合，管理文件和文件属性。对于 Windows 目标，请使用 `ansible.windows.win_file`\
  \ 模块。\n\nAnsible `file` 模块的主要参数：\n\n*   `path` string\n*   `state` string: (`file/absent/directory/hard/link/touch`)\n\
  \n唯一的必需参数是 `path`，用于指定文件或目录的文件系统路径。`state` 定义我们要修改的对象类型。默认是 `file`，但对于我们的用例，我们需要\
  \ `touch` 选项。\n\n该模块具有以下可选参数来定义某些文件或目录属性，如 *表 4.6* 所示：\n\n| 参数 | 描述 |\n| :--- |\
  \ :--- |\n| `owner` | 指定文件系统用户名 |\n| `group` | 指定文件系统组 |\n| `mode` | 以八进制模式 (0644)\
  \ 或符号模式 (u=rw,g=r,o=r) 指定文件系统权限 |\n\n**表 4.6：** 文件系统模块可选参数\n\n此外，我们可以使用 `selevel`、`serole`、`setype`\
  \ 和 `seuser` 参数定义 SELinux 文件系统对象上下文。\n\n以下 `file.yml` Ansible Playbook 在当前用户主目录下创建了\
  \ `example.txt` 文件：\n\n```yaml\n---\n- name: File module\n  hosts: all\n  vars:\n\
  \    myfile: \"~/example.txt\"\n  tasks:\n    - name: Creating an empty file\n \
  \     ansible.builtin.file:\n        path: \"{{ myfile }}\"\n        state: touch\n\
  ```\n\n我们可以使用以下 `ansible-playbook` 命令执行：\n\n`ansible-playbook file.yml`\n\n执行结束后，我们将在当前用户主目录下看到\
  \ `example.txt` 文件。\n\n## 创建目录\n\n\n\n\n\n与创建文件一样，我们可以使用 Ansible `file` 模块的 `directory`\
  \ 参数来创建目录。以下 `directory.yml` Ansible playbook 会在当前家目录下创建一个名为 `example` 的目录：\n\n\
  ```yaml\n---\n- name: Create directory\nhosts: all\nvars:\n  mydir: \"~/example\"\
  \ntasks:\n  - name: Creating a directory\n    ansible.builtin.file:\n      path:\
  \ \"{{ mydir }}\"\n      state: directory\n      owner: devops\n      group: users\n\
  \      mode: '0644'\n```\n\n我们可以使用以下 `ansible-playbook` 命令进行执行：\n\n```bash\nansible-playbook\
  \ directory.yml\n```\n\n执行完成后，我们将在当前用户的家目录下看到 `example` 目录。\n\n```bash\n[devops@server01.example.com\
  \ ~]$ ls -al\ndrw-r--r--. 2 devops users    6 Apr 15 13:45 example\n```\n\n## 软链接与硬链接\n\
  \nAnsible `file` 模块允许我们为文件或目录创建软链接（符号链接或 symlink）和硬链接。我们只需要在 `state` 参数中指定 `link`\
  \ 作为软链接，指定 `hard` 作为硬链接，并使用参数定义文件系统路径：\n\n*   `src` 字符串 - 链接路径\n*   `dest` 字符串 -\
  \ 目标文件路径\n\n以下 `link.yml` Ansible playbook 创建了一个名为 `link` 的符号链接，指向 `/proc/cpuinfo`\
  \ 文件：\n\n```yaml\n---\n- name: File module\nhosts: all\nvars:\n  mylink: \"~/link\"\
  \n  mysrc: \"/proc/cpuinfo\"\ntasks:\n  - name: Creating a symlink\n    ansible.builtin.file:\n\
  \      src: \"{{ mysrc }}\"\n      dest: \"{{ mylink }}\"\n      state: link\n```\n\
  \n我们可以使用以下 `ansible-playbook` 命令进行执行：\n\n```bash\nansible-playbook link.yml\n```\n\
  \n执行完成后，我们将在当前用户的家目录下看到 `link` 符号链接：\n\n```bash\n[devops@server01.example.com ~]$\
  \ ls -al\nlrwxrwxrwx. 1 devops wheel   13 Nov 14 14:29 link -> /proc/cpuinfo\n```\n\
  \n## 删除文件\n\n我们可以使用 Ansible `file` 模块删除文件或目录。我们需要指定 `state` 参数的值为 `absent`。\n\n\
  以下 `delete.yml` Ansible playbook 会删除 `devops` 用户家目录下的 `deleteme` 文件或目录：\n\n```yaml\n\
  ---\n- name: File module\nhosts: all\nvars:\n  mypath: \"/home/devops/deleteme\"\
  \n  become: false\ntasks:\n  - name: \"{{ mypath }}\" not present\n    ansible.builtin.file:\n\
  \      path: \"{{ mypath }}\"\n      state: \"absent\"\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令进行执行：\n\n```bash\nansible-playbook delete.yml\n```\n\n执行完成后，`devops` 用户家目录下的预期的\
  \ `deleteme` 文件或目录已被删除。\n\n# 将本地文件复制到远程主机\n\nAnsible `copy` 模块是 `ansible.builtin`\
  \ 集合的一部分，用于将文件复制到远程位置。请注意，相反的操作由 Ansible `fetch` 模块完成。Ansible `copy` 模块的主要参数有：\n\
  \n*   `dest` 路径\n*   `src` 字符串\n*   `backup` 布尔值\n*   `validate` 字符串\n*   `checksum`\
  \ 字符串\n*   `owner/group/mode` 字符串 - 权限\n*   `setype/seuser/selevel` - SELinux\n\n\
  必需参数 `dest` 指定远程绝对路径目标。`src` 指定控制主机上的源文件，可以是相对路径或绝对路径。`backup` 布尔参数允许在工具覆盖任何文件时创建备份。我们可以使用\
  \ `validate` 参数指定如何验证在将更新的文件复制到最终目的地之前运行的验证命令。\n\n以下 `copy.yml` Ansible playbook\
  \ 将 `devops` 用户目录下的本地文件 `report.txt` 复制到远程主机：\n\n```yaml\n---\n- name: Copy file\n\
  hosts: all\ntasks:\n  - name: Copy report.txt\n    ansible.builtin.copy:\n     \
  \ src: report.txt\n      dest: /home/devops/report.txt\n      owner: devops\n  \
  \    mode: '0644'\n```\n\n我们可以使用以下 `ansible-playbook` 命令进行执行：\n\n```bash\nansible-playbook\
  \ copy.yml\n```\n\n执行完成后，`report.txt` 文件被复制到远程路径 `/home/devops/report.txt`，所有者为\
  \ `devops` 用户。\n\n## 将远程文件复制到本地\n\n我们可以使用 `fetch` 模块将文件从远程主机复制到本地。它是 `ansible.builtin`\
  \ 集合的一部分。该模块的作用是从远程位置复制文件。请注意，相反的操作由 Ansible `copy` 模块完成。\n\nAnsible `fetch` 模块的主要参数有：\n\
  \n*   `dest` 路径\n*   `src` 字符串\n*   `fail_on_missing` 布尔值\n*   `validate_checksum`\
  \ 布尔值\n*   `flat` 布尔值\n\n唯一的必需参数是 `dest`，它指定保存文件的目录，`src` 指定远程主机上的源文件。它必须是一个文件而不是目录。`fail_on_missing`\
  \ 布尔值设置为 `true`，因此如果文件不存在，任务将失败。文件将在源端和目的地通过校验和进行传输和验证。如果我们不需要这种行为，可以在 `validate_checksum`\
  \ 选项中使用值 `false` 进行覆盖（默认值为 `true`）。`flat` 选项允许我们覆盖默认行为，即不在目标路径中追加 `hostname/path/to/file`\
  \ 目录结构。一个典型的用例是从远程服务器获取日志文件。\n\n以下 `fetch.yml` Ansible playbook 将远程文件 `/var/log/messages`\
  \ 复制到本地 Ansible 控制器：\n\n```yaml\n---\n- name: Fetch log\nhosts: all\nbecome: true\n\
  vars:\n  log_file: \"/var/log/messages\"\n  save_dir: \"logs\"\ntasks:\n  - name:\
  \ Fetch log\n    ansible.builtin.fetch:\n      src: \"{{ log_file }}\"\n      dest:\
  \ \"{{ save_dir }}\"\n```\n\n我们可以使用以下命令执行 `fetch.yml` playbook：\n\n```bash\nansible-playbook\
  \ fetch.yml\n```\n\n执行完成后，`/var/log/messages` 文件已从远程服务器复制到 Ansible 控制器的本地 `logs`\
  \ 目录。\n\n## 下载文件\n\n我们可以使用 Ansible `get_url` 模块从远程服务器下载文件，该模块是 `ansible.builtin`\
  \ 集合的一部分。对于 Windows 目标，请使用 `ansible.windows.win_get_url` 模块。\n\nAnsible `get` 模块的主要参数有：\n\
  \n*   `url` 字符串 - URL\n*   `dest` 字符串 - 路径\n*   `force` 字符串 - no/yes\n*   `checksum`\
  \ 字符串 - `<algorithm>:<checksum|url>`\n*   `force_basic_auth/url_username/url_password/use_gssapi`\
  \ 认证\n*   `headers` 字典 - 自定义 HTTP 头\n*   `http_agent` 字符串\n*   `owner/group/mode`\
  \ 字符串 - 权限\n*   `setype/seuser/selevel` - SELinux\n\n两个必需参数是 `url` 和 `dest`。`url`\
  \ 参数指定要下载的 URL。`dest` 参数指定目标节点上保存资源的文件系统路径。当目的地（`dest` 参数）是一个文件时，Ansible 将都会下载该文件。当目的地（`dest`\
  \ 参数）是一个目录时，默认行为是不替换文件，直到我们启用 `force` 参数。`checksum` 参数对于验证下载文件的一致性非常有用。你可以指定算法（通常使用\
  \ sha1 或 sha256 哈希库），并直接提供校验和或用于校验和的 URL。我们可能需要在系统中作为包安装第三方 `hashlib` 库，以便访问额外的算法。另一个有趣的参数是\
  \ `headers`，它允许你指定一些自定义的 HTTP 头。\n\n\n\n\n\nAnsible 在 Web 服务器日志中显示为 `ansible-httpget`，但你可以通过\
  \ `http_agent` 参数对其进行自定义。还有一些用于身份验证的额外参数，例如处理用户名和密码的 HTTP 基础认证，或者使用额外的 `httplib2`\
  \ Python 处理更复杂的 GSSAPI-Kerberos 场景。我还要强调一下，我们可以使用相同的表 4.5 参数指定文件系统权限，并使用 `selevel`、`serole`、`setype`\
  \ 和 `seuser` 参数指定 SELinux 文件对象上下文。\n\n以下 `download.yml` Ansible Playbook 从 HTTPS\
  \ 网站下载文件、验证 SHA 校验和，并将其保存到 `devops` 用户的家目录下：\n\n```yaml\n---\n- name: File download\n\
  hosts: all\nvars:\n  myurl: \"https://releases.ansible.com/ansible/ansible-2.9.27.tar.gz\"\
  \n  mycrc: \"sha256:https://releases.ansible.com/ansible/ansible-2.9.27.tar.sha\"\
  \n  mydest: \"/home/devops\"\ntasks:\n  - name: File Download\n    ansible.builtin.get_url:\n\
  \      url: \"{{ myurl }}\"\n      dest: \"{{ mydest }}\"\n      checksum: \"{{\
  \ mycrc }}\"\n      mode: '0644'\n      owner: devops\n      group: users\n```\n\
  \n![](img/147.jpg)\n\n我们可以使用以下 `ansible-playbook` 命令执行 `download.yml` Playbook：\n\
  \n```bash\nansible-playbook download.yml\n```\n\n执行结束后，`ansible-2.9.27.tar.gz` 文件被下载、验证了校验和，并保存到由\
  \ `devops` 用户拥路径 `ansible-2.9.27.tar.gz` 上。我们可以像第 8 章：Ansible 高进中*第三方集成、脆弱性与敏捷性*节所示，使用\
  \ `ansible.builtin.uri` 模块与 API 服务交互。\n\n## 使用 rsync 备份\n\n使用 Ansible 通过 rsync 进行备份时，可以使用\
  \ `synchronize` Ansible 模块，它允许你在两个目录之间同步文件。`synchronize` Ansible 模块是 `ansible.builtin`\
  \ 集合的一部分。\n\n以下是步骤：\n\n1. 在 Playbook 中定义源目录和目标目录。\n2. 使用 `synchronize` 模块同步目录。你可以将\
  \ `mode` 参数 `backup`，以便在拷贝任何文件之前为目标目录创建备份。\n3. 运行 Playbook 同步目录。\n\n这是一个使用 rsync\
  \ 将文件从远程服务器备份到本地备份目录的示例 Playbook：\n\n```yaml\n---\n- name: Backup\nhosts: all\n\
  vars:\n  source_dir: /var/www\n  dest_dir: /backups\ntasks:\n  - name: Backup files\
  \ with rsync\n    ansible.builtin.synchronize:\n      src: \"{{ source_dir }}\"\n\
  \      dest: \"{{ dest_dir }}\"\n      mode: backup\n```\n\n这将在拷贝任何文件之前，创建一个格式为\
  \ `dest_dir.TIMESTAMP` 的目标目录备份。\n\n# 检出 GIT 仓库\n\n当我们需要部署一个应用时，通常需要下载并检出（checkout）一个\
  \ Git 仓库。这对于使用 Ansible 部署应用或单个文件非常有用。我们可以使用 Ansible `git` 模块，它是 `ansible.builtin`\
  \ 集合的一部分。简单的方法是使用 HTTPS 方法检出仓库。\n\nAnsible `git` 模块的主要参数：\n\n* `repo` 路径\n* `dest`\
  \ 字符串\n* `update` 布尔值\n* `key_file` 路径 - SSH 私钥\n\n唯一必需参数是 `repo` 和 `dest`。正如名称所预期的那样，`repo`\
  \ 参数指定源仓库 URL。`dest` 参数指定目标路径。`update` 从已同步的源仓库获取新版本。当使用 SSH 协议而非 HTTPS 协议时，`key_file`\
  \ 参数指定在文件系统中存储 SSH 私钥的路径。请注意，SSH 私钥是目标主机上的路径。另请注意，SSH 公钥需要已经共享在你的 Git 服务器中。在返回值中，`after`\
  \ 值包含更新过程后的最后一个提交。\n\n以下 `git.yml` Ansible Playbook 首先验证目标主机上是否存在 `git` 软件包，然后通过\
  \ HTTPS 协议检出指定的仓库。\n\n```yaml\n---\n- name: Deploy Application\nhosts: all\ntasks:\n\
  \  - name: Git installed\n    ansible.builtin.package:\n      become: true\n   \
  \   name: git\n      state: present\n  - name: Checkout git repo\n    ansible.builtin.git:\n\
  \      repo: https://github.com/ansible/ansible.git\n      dest: /home/devops/automate-everything-with-ansible\n\
  ```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `git.yml` Playbook：\n\n```bash\nansible-playbook\
  \ git.yml\n```\n\n执行结束后，git 仓库的内容被保存到目标主机路径 `/home/devops/automate-everything-with-ansible`\
  \ 下，由 `devops` 用户所有。\n\n# 安装软件包与滚动更新\n\n将软件作为软件包安装以及滚动更新是我们机群中软件包和补丁管理的极佳 Ansible\
  \ 用例。当我们需要修改目标机器上的软件时，需要根据使用的软件包格式对 Linux 发行版进行分类。从现在起使用这种简单的分类：\n\n* “Red Hat”类\n\
  * “Debian”类\n* “Suse”类\n* 其他类型\n\n“类 Red Hat”操作系统基于 RPM 软件包格式，使用 yum 或 DNF 软件包管理器。Linux\
  \ 发行版列表包括 Red Hat Enterprise Linux (RHEL)、CentOS、CentOS Stream、AlmaLinux、Rocky Linux、Fedora、ClearOS、Oracle\
  \ Linux、Amazon Linux、EuroLinux、Fermi Linux、EulerOS、ROSA Linux、Springdale Linux 和\
  \ Asianux。Red Hat Enterprise Linux (RHEL) 版本 8 采用了 DNF 软件包管理器（代表 Dandified YUM），它是\
  \ YUM 软件包管理器的改进版本。“类 Debian”操作系统基于 DEB 软件包格式，使用 APT 软件包管理器。Linux 发行版列表包括 Debian、Ubuntu、Linux\
  \ Mint、MX Linux、Deepin、AntiX、PureOS、Kali Linux、Parrot OS、Devuan、Knoppix 和 AV Linux。“类\
  \ Suse”操作系统基于 RPM 软件包格式，使用 Zypper 软件包管理器。Linux 发行版限于 SUSE Linux Enterprise Server\
  \ 和 openSUSE。软件包格式和管理器仅在我们需要修改目标系统上的软件以确定适用于目标系统的相关 Ansible 模块时才有意义：\n\n![](img/Figure-4.1.jpg)\n\
  \n**图 4.1:** Ansible Linux 目标架构\n\n操作系统软件包管理器和 Ansible 模块的完整列表汇总表 4.7 中：\n\n| 发行版\
  \ | 软件包管理器 | Ansible 模块 |\n| :--- | :--- | :--- |\n| “Red Hat”-like | YUM | `ansible.builtin.yum`\
  \ |\n| DNF | `ansible.builtin.dnf` | |\n| AIX | installp | `community.general.installp`\
  \ |\n| Alpine Linux | Alpine Package Keeper | `community.general.apk` |\n| Local\
  \ Backup Utility | `community.general.lbu` | |\n| Arch Linux | pacman | `community.general.pacman`\
  \ |\n| ClearLinux | swupd | `community.general.swupd` |\n| Debian-like | APT | `ansible.builtin.apt`\
  \ |\n| FreeBSD | pkgng | `community.general.pkgng` |\n| Gentoo Linux | Portage |\
  \ `community.general.portage` |\n| Layman | `community.general.layman` | |\n| HP-UX\
  \ | swdepot | `community.general.swdepot` |\n| macOS | MacPorts | `community.general.macports`\
  \ |\n| Homebrew | `community.general.homebrew` | |\n| OpenBSD | pkg | `community.general.openbsd_pkg`\
  \ |\n| Openembedded/Yocto | opkg | `community.general.opkg` |\n| Slackware | slackpkg\
  \ | `community.general.slackpkg` |\n| SmartOS, NetBSD | pkgsrc | `community.general.pkgin`\
  \ |\n| Solaris 11 | Image Packaging System | `community.general.pkg5` |\n| Solaris\
  \ SVR4 | svr4pkg | `community.general.svr4pkg` |\n| Source Mage | Sorcery | `community.general.sorcery`\
  \ |\n\n\n\n\n\n| SUSE 和 openSUSE | Zypper | `community.general.zypper` |\n| :---\
  \ | :--- | :--- |\n\n**表 4.7:** 用于操作系统软件包管理器的 Ansible 模块\n\n滚动更新和补丁管理是 Ansible 的典型用例。我们可以在服务器基础设施集群的置备或维护中使用它。Ansible\
  \ 安装的模块通过自动化现有的包管理工具来工作。在类 Red Hat 的 Linux 发行版目标中，我们将使用 `Yum` 或 `DNF` 软件包管理；而在类\
  \ Debian 的 Linux 发行版目标中，我们将使用 `APT` 包管理器。要实现完整的滚动更新过程，请在我们的 playbook 中配合 `fork`\
  \ 和 `serial` 语句。请参考*第 8 章：Ansible 进阶* 中的 *Ansible 编排* 节节。\n\n## Ansible 软件包模块\n\n\
  有一个 `package` 模块（它是 `ansible.builtin` 集合的一部分），可以使用不同的工具安装软件包。它可以自动检测每台目标机器应该使用哪种包管理工具。以下是\
  \ `package` Ansible 模块的局限性：\n\n*   软件包名称通常不同。\n*   软件包版本通常不同。\n*   不同的包工具支持不同的选项。\n\
  \n要映射不同发行版之间所有的包名称差异几乎是不可能的。以下是*表 4.8* 中一些简单的软件包名称示例：\n\n| 类 Red Hat | 类 Debian\
  \ |\n| :--- | :--- |\n| `httpd` | `apache2` |\n| `sqlite` | `sqlite3` |\n| `bzip2-devel`\
  \ | `libbz2-dev` |\n| `xorg-x11-server` | `xorg` |\n\n**表 4.8:** 常见的软件包名称差异\n\n\
  ## Ansible yum 模块\n\n我们可以使用 `yum` Ansible 模块或 `dnf` Ansible 模块来更新类“Red Hat”的 Linux\
  \ 发行版，两者都是 `ansible.builtin` 集合的一部分。从 Ansible Core 2.15 开始，引入了最新的 `dnf5` Ansible\
  \ 模块，用于处理 Fedora 39 版本中包含的 DNF 5 版本包管理器。Ansible `yum`、`dnf` 和 `dnf5` 模块在目标主机上执行任何操作都需要\
  \ `root` 权限。参数列表非常广泛，以下四个选项与我们的用例相关：\n\nAnsible `yum`、`dnf` 和 `dnf5` 模块的主要参数：\n\n\
  *   `name` 字符串\n*   `state` 字符串\n*   `update_cache` 布尔\n*   `bugfix` 布尔\n*   `security`\
  \ 布尔\n\n`name` 参数指定单个软件包，或使用星号 `*` 指定系统中的所有软件包。在这种情况下，状态需要设置为 `latest`，以便我们的目标是每个软件包的最新版本。`update_cache`\
  \ 用于在安装前强制更新仓库元数据，默认为 `no`。其他非常有用的选项是 `bugfix` 和 `security`，它们允许我们仅更新标记为错误修复或安全相关的更新软件包。\n\
  \n以下 `yum.yml` playbook 更新了所有的 Red Hat Enterprise Linux 发行版及其衍生版：\n\n```yaml\n---\n\
  - name: Rolling update\n  hosts: all\n  become: true\n  tasks:\n    - name: System\
  \ update\n      ansible.builtin.yum:\n        name: \"*\"\n        state: latest\n\
  \        update_cache: true\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `yum.yml` playbook：\n\
  \n```bash\nansible-playbook yum.yml\n```\n\n## Ansible apt 模块\n\n我们可以使用 `apt` Ansible\
  \ 模块更新类 Debian 的 Linux 发行版，该模块是 `ansible.builtin` 集合的一部分。`apt` 模块执行目标主机上的任何操作需要\
  \ `root` 权限。\n\nAnsible `apt` 模块的主要参数：\n\n*   `name` 字符串\n*   `state` 字符串\n*   `update_cache`\
  \ 布尔\n*   `upgrade` no/safe/full/dist\n\n`name` 参数指定单个软件包，我们也可以使用星号 `*` 选择系统的所有软件包。在这种情况下，状态需要设置为\
  \ `latest`，以便我们的目标是每个软件包的最新版本。`update_cache` 用于在安装前强制更新仓库元数据。\n\n另一个实用的选项是 `upgrade`，在执行发行版升级时有四种可选方案：\n\
  \n*   默认值为 `no`（禁用）\n*   `safe`：执行 aptitude `safe-upgrade`\n*   `full`：执行 aptitude\
  \ `full-upgrade`\n*   `dist`：执行 `apt-get dist-upgrade`\n\n以下 `apt.yml` Ansible playbook\
  \ 用于在更新仓库缓存之前将当前系统中所有软件包更新到最新版本，因此我们将下载每个软件包的最新版本。\n\n```yaml\n---\n- name: Rolling\
  \ update\n  hosts: all\n  become: true\n  tasks:\n    - name: System update\n  \
  \    ansible.builtin.apt:\n        name: \"*\"\n        state: latest\n        update_cache:\
  \ true\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `apt.yml` playbook：\n\n```bash\n\
  ansible-playbook apt.yml\n```\n\n# Ansible zypper 模块\n\n我们可以使用 `zypper` Ansible\
  \ 模块更新类 SUSE 的 Linux 发行版，该模块是 `community.general` 集合的一部分。在执行以下 `suse.yml` playbook\
  \ 之前，请确保 Ansible 控制器已安装了 `community.general` 集合。参数列表与之前的模块类似。更多信息请参见*第 3 章：Ansible\
  \ 语言进阶*中的 *Ansible collection* 节。`suse.yml` Ansible playbook 如下：\n\n```yaml\n---\n\
  - name: Rolling update\n  hosts: all\n  become: true\n  tasks:\n    - name: System\
  \ update\n      community.general.zypper:\n        name: \"*\"\n        state: latest\n\
  \        update_cache: true\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `suse.yml`\
  \ playbook：\n\n```bash\nansible-playbook suse.yml\n```\n\n`yum.yml`、`apt.yml` 和\
  \ `suse.yml` 的执行时间取决于连接速度、需要更新的软件包数量以及目标机器的性能。结果是系统更新到了发行版提供的最新软件包。\n\n## Linux\
  \ System Roles\n\nLinux System Roles 是一组 Ansible Roles（角色）和 Collections（集合），用于管理和配置常见的\
  \ GNU/Linux 系统组件。在我们日常的 Linux 工作中，对于大多数命令行任务不要重复造轮子。支持的目标操作系统有 Fedora、Red Hat Enterprise\
  \ Linux (RHEL6+) 以及 CentOS 6+ 等衍生版。在编写本书时，支持以下子系统：\n\n*   email (postfix)\n*   kdump\
  \ (内核转储)\n*   network\n*   selinux\n*   timesync\n*   storage\n*   tlog (终端日志，会话记录)\n\
  *   logging\n*   metrics\n*   nbde_server\n*   nbde_client\n*   certificate\n* \
  \  kernel_settings (sysctl, sysfs, 等)\n*   SSH server (用于集合 ansible-sshd)\n*   SSH\
  \ client\n*   VPN (IPSec - libreswan)\n*   Crypto policies\n*   Cluster HA (pacemaker/corosync)\n\
  *   Cockpit\n*   firewall\n*   Systemd journald\n*   Active Directory join\n*  \
  \ podman\n*   Red Hat Subscription Management and Insights\n\n第一步是安装选定的 Linux System\
  \ Roles。假设我们想在集群中设置 NTP 服务，以便通过互联网与原子钟保持同步。我们可以使用 `ansible-galaxy` 命令从 Ansible Galaxy\
  \ 存档手动下载最新 role：\n\n```bash\nansible-galaxy install linux-system-roles.timesync\n\
  ```\n\n如既往一样，我们可以创建一个 `requirements.yml` 文件来自动化从 Ansible Galaxy 存档安装该 role。请参考*第\
  \ 3 章：Ansible 语言进阶* 中的 *Ansible role* 节。在 Red Hat Enterprise Linux 9 和 8.6 及更高版本中，可以通过\
  \ Application Streams 仓库安装 RHEL System Roles（`rhel-system-roles` 软件包）：\n\n```bash\n\
  dnf install rhel-system-roles ansible-core\n```\n\n\n\n以下 `ntp.yml` Ansible Playbook\
  \ 设立了 NTP 客户端服务（通常是 chrony 服务）：\n\n```yaml\n---\n- hosts: all\nvars:\n  timesync_ntp_servers:\n\
  \    - hostname: europe.pool.ntp.org\n      iburst: true\nroles:\n  - linux-system-roles.timesync\n\
  ```\n\n`ntp.yml` Ansible Playbook 配置了配置文件以使用 `europe.pool.ntp.org` 服务器，并与目标服务器执行初始同步（`iburst:\
  \ true`），在必要时立即调整时间。通过 `ansible-playbook` 命令执行的输出非常冗长且详细，执行结束后，我们在目标服务器上获得了一个配置好的\
  \ NTP 服务。\n\n同样地，我们可以使用其他 Ansible Roles 和集合（collections）在我们的工作流中安装和配置其他服务。\n\n##\
  \ 用户管理\n\n使用 Ansible 的 `user` 模块，我们可以管理目标节点中的用户，该模块属于 `ansible.builtin` 集合。这是一个非常稳定且已发布多年的模块。它用于管理用户账户，支持多种\
  \ Linux 发行版、SunOS、macOS 以及 FreeBSD。\n\n该模块使用 Linux 发行版的 `useradd` 工具创建用户。在 FreeBSD\
  \ 上，它使用 `pw useradd`，在 macOS 上，该模块使用 `dscl create`。对于 Windows，请使用 第 5 章：Ansible\
  \ For Windows 用户管理章节中的 `ansible.windows.win_user` 模块。Ansible `user` 模块的主要参数有：\n\n\
  * `name` string - `username`\n* `state` string - `present`/`absent`\n* `password`\
  \ string\n* `uid` string\n* `comment` string\n* `shell` string\n* `expires` string\n\
  * `password_expire_min` string\n* `password_expire_max` string\n* `group/groups`\
  \ string - 主组/成员组(s)\n* `create_home` boolean - `yes`/`no`\n* `generate_ssh_key`\
  \ string\n* `ssh_key_bits` string\n* `ssh_key_file` string\n* `ssh_key_type` string\n\
  * `ssh_key_passphrase` string\n\n该模块唯一要求的参数是 `name`，即本地用户用户名。`state` 参数允许我们创建或删除用户。在我们的用例中，默认已设置为\
  \ `present` 以创建用户。我们需要结合 `password` 参数和 `password_hash` 过滤器来生成 SHA512 密码哈希。请注意，你还可以指定加密算法以及盐值以使你的密码更健壮。我们可以指定所有的\
  \ Unix 属性，如 `uid`、`comment`、`shell`、`expires`、`password_expire_min` 和 `password_expire_max`。其他重要参数是\
  \ `group` 和 `groups`。第一个（不带 `s` 后缀）表示用户的主组，第二个（带 `s` 后缀）设置其他组成员。因此请务必小心 `s` 后缀，它会导致完全不同的设置。通常，我们希望创建用户家目录，因此\
  \ `create_home` 参数默认为 `yes`，但如果不需要家目录，也可以覆盖它。让我也强调一下，我们还可以通过许多选项生成 SSH 密钥。指纹和公钥可以在返回的长列表中找到。完整的\
  \ `user.yml` Ansible Playbook 在目标系统中创建了一个具有以下特征的用户 `example`：\n\n```yaml\n---\n\
  - name: Create a user account\n  hosts: all\n  become: true\n  tasks:\n    - name:\
  \ User example exist\n      ansible.builtin.user:\n        name: example\n     \
  \   password: \"{{ 'password' | password_hash('sha512', 'mysecretsalt') }}\"\n \
  \       groups:\n          - wheel\n          - adm\n        state: \"present\"\n\
  \        shell: \"/bin/bash\"\n        system: false\n        create_home: true\n\
  \        home: \"/home/example\"\n        comment: \"Automate Everything with Ansible\"\
  \n        generate_ssh_key: true\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `user.yml`\
  \ Playbook：\n\n```\nansible-playbook user.yml\n```\n\n执行结束后，将按照 Ansible Playbook\
  \ 中指定的选项创建本地用户 `example`。\n\n# Linux 密码过期策略\n\nAnsible 的另一个常见用例是配置本地用户的 Linux 密码过期。我们使用\
  \ Ansible `user` 模块的 `password_expire_min` 和 `password_expire_max` 参数。请注意，这些参数仅限\
  \ Linux：\n\n![](img/path_to_image)\n\nAnsible `user` 模块的 `password_expire_min` 和\
  \ `password_expire_max` 参数用于配置 Linux 密码过期。以下 `expiration.yml` Ansible Playbook 为用户设置了密码过期：\n\
  \n```yaml\n---\n- name: Password expiration\n  hosts: all\n  become: true\n  tasks:\n\
  \    - name: Set expiration\n      ansible.builtin.user:\n        name: \"{{ myuser\
  \ }}\"\n        password_expire_min: 7\n        password_expire_max: 90\n```\n\n\
  我们可以使用以下 `ansible-playbook` 命令执行 `expiration.yml` Playbook：\n\n```\nansible-playbook\
  \ expiration.yml\n```\n\n我们可以使用 `chage` 命令检查这些参数：\n\n```\nchage -l example\n```\n\
  \n## 组管理\n\n与 `user` 模块类似，`group` 模块管理目标系统中的本地组。Ansible `group` 模块的主要参数有：\n\n* `name`\
  \ string - 组名\n* `state` string - `present`/`absent`\n* `system` boolean - `yes`/no`\n\
  * `gid` integer - 为组设置的 GID\n* `local` string - `local` 命令的替代方案\n\n唯一要求的是 `name`，即组名。`state`\
  \ 参数允许我们创建或删除组。在我们的用例中，默认已设置为 `present` 以创建组。`system` 参数允许创建系统组，默认情况下不是。你可以通过 `gid`\
  \ 参数指定组标识符 GID。如果你有中央认证系统，`local` 参数允许在实现了该命令的平台上使用 `local` 命令的替代方案。以下 `group.yml`\
  \ Ansible Playbook 在目标系统中创建了一个本地组 `accounting`：\n\n```yaml\n---\n- name: Group management\n\
  \  hosts: all\n  become: true\n  vars:\n    mygroup: 'accounting'\n  tasks:\n  \
  \  - name: Create group\n      ansible.builtin.group:\n        name: \"{{ mygroup\
  \ }}\"\n        state: present\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `group.yml`\
  \ Playbook：\n\n```\nansible-playbook group.yml\n```\n\n\n\n\n通常情况下，应优先选择为任务使用专门的模块。当没有相应的\
  \ Ansible 模块时，我们仍然可以使用 `command` 和 `shell` Ansible 模块在目标节点上直接执行终端命令。从顶层视角来看，它们看起来相似，但在底层行为有所不同。使用\
  \ Ansible 模块执行任务始终是一个好习惯，但有时我们的用例确实没有对应的 Ansible 模块。在这种情况下，我们可以使用 `command` 和 `shell`\
  \ Ansible 模块在目标节点上执行命令。\n\n在这些情况下，我们可以使用 `command` 和 `shell` Ansible 模块在目标节点上执行命令。这并不是一种优解决方案，因为我们实际上是通过\
  \ `command` 和 `shell` Ansible 模块执行了终端命令。\n\n让我们明确 `command` 与 `shell` Ansible 模块之间的区别。它们都允许我们在\
  \ Linux 目标主机上执行命令。大多数人会混淆这两个 Ansible 模块，但它们从根本上说是不同的。这两个模块都允许我们在目标主机上执行命令，但执行方式略有不同。我们应该尽可能避免使用\
  \ `command` 或 `shell` Ansible 模块，而是使用使用 Ansible 定的模块。这两个模块在执行时都会返回“已更改”（changed）状态，因为\
  \ Ansible 无法分析这些模块的执行情况，无法检测它们是否更改了目标系统。\n\n# Ansible command 模块\n\nAnsible `command`\
  \ 模块在目标 Unix 类主机上执行命令时，会跳过目标节点的 shell。它总是返回已更改状态。`command` 模块在不使用任何目标 shell 的情况下在目标机器上执行命令；它只是执行命令。`command`\
  \ 模块是 Ansible 临时模式（Ad-hoc mode）中的默认模块。命令模块只能执行远程主机上的二进制文件。本地 shell 变量不会影响 command\
  \ 模块，因为它跳过了 shell。同时，它可能无法运行“shell”内置功能和重定向。从安全角度来看，command 模块更健壮，结果更具预测性，因为它跳过了\
  \ shell。\n\n## Ansible shell 模块\n\nAnsible `shell` 模块使用目标节点的 shell 进行重定向和内置功能，在目标\
  \ Unix 类主机上执行 shell 命令。它总是返回已更改状态。目标 shell 例如，著名的 `bash`、`zsh` 或 `sh`。作为副作用，用户环境、变量扩展、输出重定向、将两个命令组合以及其他\
  \ shell 特性是不可用的。另一方面，使用 shell 模块执行的每个命令都拥有所有 shell 特性，可以在运行时进行扩展。`shell` Ansible\
  \ 模块比 command 模块潜在危险，只有在我们需要 shell 功能时才应该使用。因此，如果我们不需要将两个命令组合（使用管道甚至仅使用 `&&` 或 `;`\
  \ 运算符），就需要 shell 模块。同样，全局扩展 shell 变量或文件需要 shell 模块。仅在严格需要时才使用 Ansible shell 模块。\n\
  \n## Uptime playbook\n\n让我通过 Ansible Playbook 演示 `command` 和 `shell` Ansible 模块之间的区别：\n\
  \n`uptime`\n\n`13:10:16 up 45 min,  0 users, load average: 0.12, 0.08, 0.07`\n\n\
  假设我们想检查服务器的 `uptime` 时间。这是一个不需要完整 shell 能力的总体操作。完整的 `command.yml` 文件：\n\n```yaml\n\
  ---\n- name: Check uptime\n  hosts: all\n  tasks:\n    - name: Check uptime\n  \
  \    ansible.builtin.command: uptime\n      register: command_output\n    - name:\
  \ Command output\n      ansible.builtin.debug:\n        var: command_output.stdout_lines\n\
  ```\n\n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook` 命令执行我们的代码：\n\n`ansible-playbook\
  \ command.yml`\n\n执行 `ansible-playbook` 命令的输出如下：\n\n```\nTASK [Check uptime] ****************************************************************************\n\
  changed: [server01.example.com]\nTASK [Command output] **************************************************************************\n\
  ok: [server01.example.com] => {\n  \"command_output.stdout_lines\": [\n    \"13:10:16\
  \ up 45 min,  0 users, load average: 0.12, 0.08, 0.07\"\n  ]\n}\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=3    changed=1    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n# 列出文件\n\n列出文件是一个需要完整 `shell` 能力的典型操作，在下面的 `shell.yml`\
  \ playbook 文件中显示：\n\n```yaml\n---\n- name: Listing files\n  hosts: all\n  tasks:\n\
  \    - name: List file(s) and folder(s)\n      ansible.builtin.shell: 'ls -l *'\n\
  \      register: command_output\n    - name: Command output\n      ansible.builtin.debug:\n\
  \        var: command_output.stdout_lines\n```\n\n我们可以使用每个 Ansible 安装中的 `ansible-playbook`\
  \ 命令执行 `shell.yml` Ansible Playbook。完整命令如下：\n\n`ansible-playbook shell.yml`\n\n\
  执行 Ansible playbook `shell.yml` 的输出如下：\n\n```\nTASK [List file(s) and folder(s)]\
  \ **************************************************************\nchanged: [server01.example.com]\n\
  TASK [Command output] **************************************************************************\n\
  ok: [server01.example.com] => {\n  \"command_output.stdout_lines\": [\n    \"-rwxrwxrwx\
  \ 1  devops users  245 Apr 14 11:04 command.yml\",\n    \"-rwxrwxrwx 1  devops users\
  \  258 Apr 14 11:04 shell.yml\"\n  ]\n}\nPLAY RECAP *****************************************************************************\n\
  server01.example.com: ok=3    changed=1    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n# 错误模块\n\n我们在 `command` 和 `shell` 模块之间使用错误的模块时，会获得致命错误。请参阅*第\
  \ 6 章：Ansible 故障排除*中的*Ansible modules*部分进行进一步的排除。例如，当我们使用 `command` 模块而不是 `shell`\
  \ 模块执行之前 `shell.yml` playbook 的文件列表时：\n\n```\n{\"stderr\": \"ls: cannot access '*':\
  \ No such file or directory\", \"stderr_lines\": [\"ls: cannot access '*': No such\
  \ file or directory\"], \"stdout\": \"\", \"stdout_lines\": []}\n```\n\n当没有特定的 Ansible\
  \ 模块用于我们的任务时，`command` 和 `shell` 模块是很好的工具。请明智地使用它们！command 限制较多，而 shell 更强大且具有潜在危害。\n\
  \n# 结论\n\n我们学习了如何通过自动化 Linux 基础设施中的某些任务来节省时间。正如我们所学的，自动化是简单的，我们可以轻松将其扩展到日常用例中。在下一章中，我们将学习如何以类似于\
  \ Linux 基础设施的方式自动化 Windows 目标系统。\n\n# 注意事项\n\n*   大多数现代 Linux 发行版已经准备好使用 Ansible。只需设置\
  \ SSH 密码或密钥认证并使用 Python 解释器即可。\n*   最简单的 Ansible 模块是 `ping`，它测试 Linux 目标主机上 Python\
  \ 代码的认证和执行。\n*   可以使用 Ansible `lineinfile` 模块、Ansible `blockinfile` 模块和 Ansible\
  \ `template` 模块执行配置管理。\n\n\n\n\n\n*   许多模块简化了文件系统管理：使用 Ansible `stat` 模块检查文件和目录的存在，使用\
  \ Ansible `file` 模块创建文件、目录、软链接和硬链接，使用 Ansible `get_url` 模块下载内容，使用 Ansible `git`\
  \ 模块检出 Git 仓库。\n*   Ansible `user` 和 `group` 模块简化了本地用户和组的管理。\n*   我们可以通过包格式对 Linux\
  \ 发行版进行分类，并使用 Ansible 模块自动化包管理器之间的交互。它对许多操作系统和工具都有广泛支持。\n\n# 单选题\n\n1. 配置 Linux\
  \ 目标机器需要满足什么要求？\n    1. OpenSSH 服务正在运行和 Python 解释器\n    2. WinRM 服务正在运行和 Python\
  \ 解释器\n    3. WinRM 服务正在运行和 PowerShell 解释器\n    4. OpenSSH 服务正在运行和 PowerShell 解释器\n\
  \n2. 在红帽企业 Linux 中安装 NTP 客户端的最佳方法是什么？\n    1. Ansible apt 模块\n    2. Linux 系统角色\
  \ (Linux System Roles)\n    3. Ansible package 模块\n    4. Ansible file 模块\n\n3.\
  \ 我们如何在 Linux 目标上执行命令“cat /proc/cpuinfo | grep ‘model’”？\n    1. Ansible command\
  \ 模块\n    2. Ansible shell 模块\n    3. Ansible cpuinfo 模块\n    4. 不可行\n\n4. 在不同的\
  \ Linux 发行版中安装“git”包的最简单方法是什么？\n    1. 使用 `when` 语句配合多个 Ansible 模块\n    2. Ansible\
  \ apt 模块\n    3. Ansible package 模块\n    4. Ansible yum 模块\n\n# 答案\n\n1. A\n2. B\n\
  3. B\n4. C\n\n# question\n\n1. 为什么优先使用 SSH 密钥认证而不是 SSH 密码认证？\n2. 使用 Ansible `debug`\
  \ 模块的“verbosity”参数的作用是什么？\n3. 除了将文件复制到目标节点外，copy` 模块还有什么用途？\n4. 我们如何检查目标节点上是否存在文件或目录？\n\
  5. 为什么不建议使用 Ansible `package` 模块？\n6. 什么时候必须使用 Ansible `command` 和 `shell` 模块？\n\
  \n# 核心术语\n\n*   **Verbosity (详细程度)**：我们可以指定 0 到 4 的详细级别来执行 Ansible Playbook，从而增加调试信息的打印。\n\
  *   **配置管理 (CM)**：指维护计算机软件处于所需状态的过程。配置管理也是一种确保系统随时间推移持续符合预期的方法。\n*   **文件系统 (File\
  \ system)**：指操作系统用于从存储器存储和检索数据的方法和数据结构（文件和目录）。\n*   **用户管理 (User Management)**：指在系统中创建、更新、删除和维护本地用户及组的活动。\n\
  *   **滚动更新 (Rolling update)**：指一种以零停机时间原地更新系统的策略。\n\n# 第 5 章\n\n# 用于 Windows 的 Ansible\n\
  \n## 引言\n\n使用 Ansible 自动化 Windows 非常方便，特别是对于大型集群。我们将从主机配置开始，然后移动到自动化部分。我们将在 Windows\
  \ 环境中探索与 Linux 操作系统相同的用例，使用不同的 Ansible 模块来处理文件系统、用户管理以及许多日常系统管理任务。我们将利用现在学到的关于 Ansible\
  \ 技术的所有课程。在本章中，我们将学习如何配置 Windows 目标系统，以及如何在 Windows 和 Windows Server 上执行文件和目录操作并进行软件更新。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   配置 Windows 目标\n*   测试主机可用性\n*   配置管理\n*   文件系统\n\
  *   安装包和滚动更新\n*   用户管理\n*   Windows 注册表\n*   执行命令\n\n## 配置 Windows 目标\n\n使用 Ansible\
  \ 节省的时间令人惊叹，特别是在混合云环境的配置管理管理和补丁管理中。我们可以管理桌面操作系统（包括 Windows 10 和 11）以及服务器操作系统（包括\
  \ Windows Server 2012、2012 R2、2016、Version 1803、Version 1809、2019 和 2022）。第一步是配置我们的\
  \ Windows 目标机器以使用 Ansible。尽管从 Ansible 2.8 版本开始已支持 SSH 连接，但它可能会导致不可预的情况。连接 Windows\
  \ 和 Windows Server 系统的稳定且推荐的方法是使用 Windows 远程管理 (WinRM) 原生库。WinRM 是微软为 Windows 操作系统中的\
  \ WS-Management 创建的。WinRM 允许我们通过网络访问系统并共享管理信息。\n\n成功启动 Windows 目标主机的步骤：\n\n1.  创建\
  \ Ansible 用户\n2.  验证 PowerShell & .NET\n3.  设置 WinRM\n4.  Windows 集合 (Collections)\n\
  5.  创建清单 (Inventory) 和 Playbook\n\n在 Ansible 控制器上，这些很容易满足。我们只需要清单，并可以使用许多 Ansible\
  \ 模块来自动化 `ansible.windows` 和 `community.windows` Ansible 集合内部的任务。区别在于，第一个集合由 Ansible\
  \ 工程团队直接维护，而第二个则由 Ansible 社区管理。\n\n## 创建 Ansible 用户\n\nAnsible 需要目标主机上有一个用户来执行我们的自动化。最简单的方法是使用“计算机管理”工具创建本地用户。我们也可以使用\
  \ Active Directory 用户，但这需要更多配置。请根据您的需要自定义用户名。\n\n以下步骤使我们能够在 Windows 系统上创建 `ansible`\
  \ 本地用户：\n\n1.  打开`计算机管理`。\n    我们可以通过开始菜单或通过右键点击`此 PC` > `管理`来打开`计算机管理`工具。\n   \
  \ 界面所示[图 5.1]：\n    ![](img/Figure-5.1.jpg)\n    **图 5.1：** 计算机管理主界面\n\n2.  创建新的\
  \ ansible 用户。通过右键点击`用户` > `新建用户` 创建新用户。使用以下详细填写弹出的表单（界面所示[图 5.2]）：\n    *   用户名：`ansible`\n\
  \    *   全名：`ansible`\n    *   描述：`ansible user`\n    *   密码和确认密码：（为我们的 ansible\
  \ 用户指定密码）。例如，假设使用 `MyPassword123@` 作为密码。此值应与我们的清单匹配。\n    启用“密码永不过期”选项并禁用“用户下次登录时更改密码”选项是非常关重要的。\n\
  \    ![](img/Figure-5.2.jpg)\n    **图 5.2：** 新的“ansible”用户界面\n\n3.  将 ansible 用户作为管理员组的成员。\n\
  \    在成功创建“ansible”用户后，我们需要将该用户添加到“管理员”组中。通过这样，我们就能对 Windows 目标执行任何类型的命令。如果我们没有执行这一步，某些代码可能会因为权限问题而失败：\n\
  \    ![](img/Figure-5.3.jpg)\n    **图 5.3：** 将“ansible”用户添加到“管理员”组\n\n## 验证 PowerShell,\
  \ .NET 并设置 WinRM\n\n\n\n\n\n一旦在我们的 Windows 系统中成功创建了本地用户，我们就可以在安装 WinRM 组件之前验证 PowerShell\
  \ 和 .NET 库是否为最新。Ansible 对 Windows 主机要求 `PowerShell` 3.0 或更高版本以及 `.NET` 4.0 或更高版本。在现代操作系统中，这些要求已经满足了。如果没有，我们只需要在继续安装\
  \ WinRM 组件之前使用 Windows Update 即可。让我们验证一下系统中当前 PowerShell 和 .NET 的版本：\n\n## PowerShell\n\
  \n我们可以在 PowerShell 中输入以下命令来验证 PowerShell 的当前版本：\n\n```bash\nGet-Host | Select-Object\
  \ Version\n```\n\n输出结果如下：\n\n`Version`\n`-------`\n`7.3.0.0`\n\n在这种情况下，PowerShell\
  \ 7.3 的版本高于要求的 `PowerShell` 3.0，因此我们可以继续我们的自动化操作。\n\n## .NET\n\n我们可以在 PowerShell\
  \ 中输入以下命令来验证 .NET 的当前版本：\n\n```bash\nGet-ChildItem 'HKLM:\\SOFTWARE\\Microsoft\\\
  NET Framework Setup\\NDP' -Recurse | Get-ItemProperty -Name version -EA 0 | Where\
  \ { $_.PSChildName -Match '^(?!S)\\p{L}'} | Select PSChildName, version\n```\n\n\
  输出结果如下：\n\n`PSChildName Version`\n`----------- -------`\n`Client      4.8.04161`\n\
  `Full        4.8.04161`\n`Client      4.0.0.0`\n\n在这种情况下，安装了 .NET 4.8，它高于要求的 `.NET`\
  \ 4.0，因此我们可以继续我们的自动化操作。\n\n## 安装 WinRM\n\n第一步是实际验证目标机器是否已经启用了 WinRM 服务。我们可以通过以下\
  \ PowerShell 命令验证系统是否启用了 WinRM：\n\n```powershell\nwinrm get winrm/config/Service\n\
  winrm get winrm/config/Winrs\nwinrm enumerate winrm/config/Listener\n```\n\n不要担心。在刚安装的机器上，我们预计对每个命令都会收到类似下面的错误信息：\n\
  \n`WSManFault`\n`Message = The client cannot connect to the destination specified\
  \ in the request. […]`\n`Error number:  -2144108526 0x80338012`\n\n对于初学者来说，WinRM\
  \ 服务的初始配置可能会困难。好消息是，Ansible 团队发布了一个 `ConfigureRemotingForAnsible.ps1` PowerShell\
  \ 脚本，以便方便地配置我们的目标主机。以下命令直接从 Ansible 的 GitHub 仓库下载并执行最新版本的 PowerShell 配置脚本：\n\n```powershell\n\
  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n\
  >> $url = \"https://raw.githubusercontent.com/ansible/ansible/devel/examples/scripts/ConfigureRemotingForAnsible.ps1\"\
  \n>> $file = \"$env:temp\\ConfigureRemotingForAnsible.ps1\"\n>> (New-Object -TypeName\
  \ System.Net.WebClient).DownloadFile($url, $file)\n>> powershell.exe -ExecutionPolicy\
  \ ByPass -File $file\n```\n\n执行将需要一段时间，并在屏幕上向我们显示更多消息。\n\n我们可以通过以下 PowerShell 命令验证系统是否启用了\
  \ WinRM：\n\n```powershell\nwinrm get winrm/config/Service\nwinrm get winrm/config/Winrs\n\
  winrm enumerate winrm/config/Listener\n```\n\n输出消息将向我们显示关于网络服务的更多细节、最大连接用户数以及更多技术细节：\n\
  \n`Service`\n`RootSDDL = O:NSG:BAD:P(A;;GA;;;BA)(A;;GR;;;IU)S:P(AU;FA;GA;;;WD)(AU;SA;GXGW;;;WD)`\n\
  `MaxConcurrentOperations = 4294967295`\n`MaxConcurrentOperationsPerUser = 1500`\n\
  `EnumerationTimeoutms = 240000`\n`MaxConnections = 300`\n`MaxPacketRetrievalTimeSeconds\
  \ = 120`\n`AllowUnencrypted = true`\n`Auth`\n`Basic = true`\n`Kerberos = true`\n\
  `Negotiate = true`\n`Certificate = false`\n`CredSSP = false`\n`CbtHardeningLevel\
  \ = Relaxed`\n`DefaultPorts`\n`HTTP = 5985`\n`HTTPS = 5986`\n`IPv4Filter = *`\n\
  `IPv6Filter = *`\n`EnableCompatibilityHttpListener = false`\n`EnableCompatibilityHttpsListener\
  \ = false`\n`CertificateThumbprint`\n`AllowRemoteAccess = true`\n\n重要的部分是 WinRM\
  \ 现在已激活，并接受通过 HTTP 端口 5985 和 HTTPS 端口 5986 的连接。许多组织选择在某些“模板镜像”、“基础镜像”或“黄金镜像”中启用\
  \ WinRM 服务，以加速基础设施的部署。\n\n从现在起，我们只需要配置 Ansible Controller 连接到 Windows 目标。\n\n##\
  \ Windows collections\n\n首先，我们需要确保 Ansible Controller 中安装了 Ansible collections。正如我们在第\
  \ 3 章中学到的，可以使用 `ansible-galaxy` 命令行工具在系统中安装或验证已安装的 collections 版本。让我们使用以下命令验证 Ansible\
  \ collection 是否已成功安装到系统中：\n\n`ansible.windows` Ansible collection：\n\n```bash\n\
  ansible-galaxy collection list ansible.windows\n```\n\n当 `ansible.windows` collection\
  \ 成功安装时，会显示以下输出：\n\n`# /usr/share/ansible/collections/ansible_collections`\n`Collection\
  \      Version`\n`--------------- -------`\n`ansible.windows 1.13.0`\n\n输出显示了安装的版本“1.13.0”以及安装路径\
  \ `/usr/share/ansible/collections/ansible_collections`。\n\n`community.windows` Ansible\
  \ collection：\n\n```bash\nansible-galaxy collection list community.windows\n```\n\
  \n当 `community.windows` collection 成功安装时，会显示以下输出：\n\n`# /usr/share/ansible/collections/ansible_collections`\n\
  `Collection      Version`\n`--------------- -------`\n`community.windows 1.12.0`\n\
  \n输出显示了安装的版本“1.12.0”以及安装路径 `/usr/share/ansible/collections/ansible_collections`。\n\
  \n## 手动\n\n当系统中没有安装 collections 时，我们可以手动或通过自动化方式安装它们。\n\n## 手动\n\n我们可以通过 `ansible-galaxy`\
  \ 命令行工具指定名称来手动安装 Windows collections。该工具将连接到 Ansible Galaxy 分发服务器，下载并安装到当前系统中。重复两次命令以安装两个\
  \ Ansible collections：\n\n```bash\nansible-galaxy collection install ansible.windows\n\
  ansible-galaxy collection install community.windows\n```\n\n命令显示的输出如下：\n\n`Starting\
  \ galaxy collection install process`\n`Process install dependency map`\n`Starting\
  \ collection install process`\n`Downloading https://galaxy.ansible.com/download/ansible-windows-1.13.0.tar.gz\
  \ to /home/devops/.ansible/tmp/ansible-local-26442bn4cixq/tmp8hxd6zu/ansible-windows-1.13.0-r6p9u1uq`\n\
  `Installing 'ansible.windows:1.13.0' to '/home/devops/.ansible/collections/ansible_collections/ansible/windows'`\n\
  `ansible.windows:1.13.0 was installed successfully`\n\n### 自动化\n\n为了自动化安装 Windows\
  \ Ansible collections，我们需要创建一个包含所需 collections 的 `requirements.yml` 文件。\n\n当我们不指定任何分发服务器时，将使用\
  \ Ansible Galaxy。完整的 `requirements.yml` 文件如下：\n\n```yaml\n---\ncollections:\n- name:\
  \ ansible.windows\n- name: community.windows\n```\n\n我们可以使用以下命令执行代码的自动化安装：\n\n```bash\n\
  ansible-galaxy collection install -r requirements.yml\n```\n\n\n\n\n`ansible-galaxy\
  \ install -r requirements.yml`\n\n该命令的输出类似于：\n\n```\n`Starting galaxy collection\
  \ install process`\n`Process install dependency map`\n`Starting collection install\
  \ process`\n`Downloading https://galaxy.ansible.com/download/community-windows-1.12.0.tar.gz\
  \ to /home/devops/.ansible/tmp/ansible-local-26397ml0anda6/tmpl5a7igpa/community-windows-1.12.0-nrnbikbk`\n\
  `Installing 'community.windows:1.12.0' to '/home/devops/.ansible/collections/ansible_collections/community/windows'`\n\
  `Downloading https://galaxy.ansible.com/download/ansible-windows-1.13.0.tar.gz to\
  \ /home/devops/.ansible/tmp/ansible-local-26397ml0anda6/tmpl5a7igpa/ansible-windows-1.13.0-r4kpb230`\n\
  `community.windows:1.12.0 was installed successfully`\n`Installing 'ansible.windows:1.13.0'\
  \ to '/home/devops/.ansible/collections/ansible_collections/ansible/windows'`\n\
  `ansible.windows:1.13.0 was installed successfully`\n```\n\n执行完成后，两个 Ansible Windows\
  \ 集合已成功安装在我们的系统中。\n\n# 清清单 (Inventory)\n\n当我们需要指定某些 Windows 目标时，需要一个带有 WinRM 参数的特定\
  \ Ansible 清单。我们将使用 WinRM 作为基本身份认证连接目标的方法。从 Ansible 2.8 版本开始，对于 Windows 管理的节点（Windows\
  \ 10+ 和 Windows Server 2019+），也可以使用实验性的 SSH 连接。\n\n表 5.1 总结了可能的身份验证方法：Basic、Certificate、NTLM、Kerberos\
  \ 和 CredSSP，适用于本地用户账户、Active Directory 账户、凭据委托和 HTTP 加密：\n\n| 身份验证 | 本地账户 | Active\
  \ Directory 账户 | 凭据委托 | HTTP 加密 |\n| :--- | :--- | :--- | :--- | :--- |\n| Basic\
  \ | 是 | 否 | 否 | 否 |\n| Certificate | 是 | 否 | 否 | 否 |\n| Kerberos | 否 | 是 | 是 | 是\
  \ |\n| NTLM | 是 | 是 | 否 | 是 |\n| CredSSP | 是 | 是 | 是 | 是 |\n\n**表 5.1：** WinRM 身份验证方法\n\
  \n请注意，基本身份验证（Basic authentication）是最简单的选项，但不安全的，因为它使用 base64 编码传输密码。\n\n以下示例显示了\
  \ Ansible 清单中基本身份验证的 WinRM 主机变量。以下 `winrm_basic.ini` 文件展示了 WinRM 证书身份验证的使用：\n\n\
  ```\n`ansible_connection: winrm`\n`ansible_winrm_transport: basic`\n`ansible_user:\
  \ LocalUsername`\n`ansible_password: Password`\n```\n\n正如我们看到的，我们使用 WinRM 主机变量在\
  \ Ansible 清单中指定身份验证参数。WinRM 证书身份验证使用一对 PEM 格式编码的公钥和私钥。这些证书通常由系统管理员提供。以下 `winrm_certificate.ini`\
  \ 文件展示了 WinRM 证书身份验证的使用：\n\n```\n`ansible_connection: winrm`\n`ansible_winrm_transport:\
  \ certificate`\n`ansible_winrm_cert_pem: /path/to/certificate/public/key.pem`\n\
  `ansible_winrm_cert_key_pem: /path/to/certificate/private/key.pem`\n```\n\n有关所有其他安装场景和全面的\
  \ WinRM 配置细节，请参考 Ansible 官方网站上的文档。\n\n以下 `win10.ini` Ansible 清单是 Windows 10 目标系统的完整清单。请注意，密码应与\
  \ Windows 本地账户指定的密码匹配：\n\n```\n`[windows]`\n`WindowsServer ansible_host=192.168.0.129`\n\
  `[windows:vars]`\n`ansible_user=ansible`\n`ansible_password=MyPassword123@`\n`ansible_port=5986`\n\
  `ansible_connection=winrm`\n`ansible_winrm_transport=basic`\n`ansible_winrm_server_cert_validation=ignore`\n\
  ```\n\n`win10.ini` Ansible 清单指定了 IP 为 `192.168.0.129`、名为 `WindowsServer` 的 Windows\
  \ 主机，使用用户名 `ansible` 和密码 `MyPassword123@` 进行基本身份认证。连接将在 HTTPS 端口 `5986` 上执行并忽略自签名证书。\n\
  \n此 Ansible 清单满足 Ansible 控制器视角的所有配置。\n\n# 测试主机可用性\n\n如上一章所示，测试目标主机是成功自动化之旅的第一步。正如在\
  \ Linux 中我们有 Ansible “ping”模块一样，在 Windows 中，我们有 Ansible `win_ping` 模块。它验证 Ansible\
  \ 登录到被管理主机的能力，以及是否存在一个能够执行我们代码的 shell（通常是 PowerShell）。也可以配置 `CMD.EXE` shell。正如我们在第\
  \ 4 章 Ansible For Linux 的测试主机可用性节中所学到的，Ansible `win_ping` 模块与网络 ping 完全不同。默认行为是连接到目标主机并执行一个简单的脚本，成功时返回文本\
  \ `ping: pong`。\n\n该模块有一个可选参数 `data` 字符串，用于自定义测试消息。可以指定参数值 `crash` 以在每次执行时生成异常。\n\
  \n![](img/182.jpg)\n\n以下 `win_ping.yml` Ansible Playbook 测试了 Windows 目标主机的连接：\n\n\
  ```\n---\n`- name: Testing the host availability`\n`hosts: all`\n`tasks:`\n`- name:\
  \ Test connection`\n`ansible.windows.win_ping:`\n```\n\n请注意我们需要禁用事实收集（Facts Gathering），因为\
  \ Windows 目标不支持它（`gather_facts: false`）。\n\n我们可以使用 `ansible-playbook` 命令执行我们的 `win_ping.yml`\
  \ Ansible Playbook：\n\n```\n`ansible-playbook win_ping.yml`\n```\n\n执行的输出如下：\n\n\
  ```\n`PLAY [Testing the host availability] ***********************************************************************`\n\
  `TASK [Test connection] ****************************************************************************`\n\
  `ok: [WindowsServer]`\n`PLAY RECAP *****************************************************************************`\n\
  `WindowsServer: ok=1     changed=0     unreachable=0     failed=0     skipped=0\
  \     rescued=0     ignored=0`\n```\n\n我们可以看到，当连接到目标主机成功时，结果为“ok”状态。我们可以继续我们的自动化之旅了。\n\
  \n## 配置管理\n\n我们可以使用 Ansible 自动化 Windows 系统的配置。有时我们需要编辑单行文本，特别是对于类 Unix 服务，例如 HTTPD\
  \ Web 服务器。\n\n# 编辑单行测试\n\n我们可以使用 `community.windows` 集合中的 `win_lineinfile` 模块来编辑配置文件中的单行。以下\
  \ `win_lineinfile.yml` Playbook 文件编辑了 Apache Web 服务器配置文件中的一行：\n\n```\n`- community.windows.win_lineinfile:`\n\
  `path: C:\\apache\\httpd.conf`\n`regex: '^Listen '`\n`insertafter: '^#Listen '`\n\
  `line: Listen 8080`\n```\n\n我们可以使用 `ansible-playbook` 命令执行我们的 `win_lineinfile.yml`\
  \ Ansible Playbook：\n\n```\n`ansible-playbook win_lineinfile.yml`\n```\n\n在编写本书时，还没有任何\
  \ Ansible 模块可以为 Windows 目标主机编辑文本中的整个块配置（类似于 Linux 的 `blockinfile` 模块）。我们可以像第 3 章\
  \ Ansible 语言扩展中的 Ansible template 节中所学的那样，使用 Ansible `template` 模块来获取更多信息。\n\n##\
  \ 创建文本文件\n\n\n\n\n创建一个文本文件对于自动化配置即代码（CaC）非常有用。我们可以使用 Ansible 的 `win_copy` 模块创建带有内容的文本文件。要创建一个空文件，请参阅下一节“文件系统”中的“创建空文件”用例。正如我们从“将本地文件复制到远程主机”章节中所学的，Ansible\
  \ 模块 `win_copy` 通常用于将文件复制到远程位置。复制操作从 Ansible 控制器执行到目标主机。然而，`win_copy` 模块也可以创建带有内容的简单文本文件。Ansible\
  \ `win_copy` 模块的完整名称是 `ansible.windows.win_copy`，这意味着它是 Ansible 团队维护的用于 Windows\
  \ 自动化的模块集合的一部分。如果我们需要更复杂的配置或包含某些变量的值，建议使用 Ansible 的 `template` 模块（参见 *第 3 章：Ansible\
  \ 语言进阶*，章节 *Ansible template*）。\n\nAnsible 的 `win_copy` 模块有许多参数，但唯一一个强制性参数是 `path`\
  \ 的别名 `dest`。`dest` 参数指定远程绝对路径目标。\n\n`content` 参数直接将文件内容设置为指定的值。它仅在 `dest` 为文件时起起作用。请注意，在\
  \ `content` 参数中使用变量将导致不可预测的输出。对于高级格式化或内容包含变量的情况，请使用 `ansible.builtin.template` 模块（参见\
  \ *第 3 章：Ansible 语言进阶*，章节 *Ansible template*）。创建的文件将具有与创建用户相同的权限，在这种情况下，即我们的 `ansible`\
  \ 用户。以下 Ansible Playbook 在 `ansible` 用户的桌面上创建一个包含三行文本的 `report.txt` 文件：\n\n* Automate\n\
  * Everything\n* with Ansible\n\n整个 `win_file_create.yml` Ansible Playbook 如下：\n\n\
  ```yaml\n---\n- name: Create a text file\n  hosts: all\n  vars:\n    myfile: 'C:\\\
  Users\\ansible\\Desktop\\example.txt'\n  tasks:\n    - name: Create a text file\n\
  \      ansible.windows.win_copy:\n        dest: \"{{ myfile }}\"\n        content:\
  \ |\n          1 Automate\n          2 Everything\n          3 with Ansible\n```\n\
  \n我们可以使用每个 Ansible 安装中包含的 `ansible-playbook` 命令执行代码。完整命令如下：\n\n```bash\nansible-playbook\
  \ win_file_create.yml\n```\n\n执行 `win_file_create.yml` Ansible Playbook 的输出如下：\n\
  \n```text\nTASK [Create a text file] **********************************************************************\n\
  changed: [WindowsServer]\n```\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4：** ansible 用户桌面上的文件\
  \ example.txt\n\n如预期，`example.txt` 文件已创建在“ansible”用户的桌面上，如 *图 5.4*所示。我们可以用记事本程序打开文本文件查看内容：\n\
  \n```\nAutomate\nEverything\nwith Ansible\n```\n\nAnsible 模块 `win_copy` 通常用于将文件从\
  \ Ansible 控制器复制到 Windows 目标主机。但我们发现了如何使用它来创建文本文件。当我们想在生成的文件使用 Ansible 变量、事实（facts）或魔法变量时，请使用\
  \ Ansible `template` 模块以避免某些奇怪的致命错误或意外行为。参见 *第 3 章：Ansible 语言进阶*，章节 *Ansible template*。\n\
  \n# 检出 GIT 仓库\n\n我们可以使用与 Linux 目标主机相同的 `git` Ansible 模块来下载“检出”（checkout）Git 仓库。参见\
  \ *第 4 章：Ansible For Linux*。\n\n\n\n\nAnsible 能够使用 `win_file` 模块在 Windows 上创建空文件。它包含在\
  \ `ansible.windows` 集中。该模块允许我们触碰、创建或删除文件或目录。对于 Linux 目标，请使用 `ansible.builtin.file`\
  \ 模块。如需创建包含内容的文件，请参考*创建文本文件章节*。\n\n参数列表与 Linux 的 `file` 模块相似：\n\n* `path`\n* `state`\
  \ 字符串（touch, file, absent 和 directory）\n\n`path` 参数是强制性的，用于指定文件系统中的路径。`state` 参数定义了我们指定的路径的期望状态。对于创建空文件的这一用例，我们需要使用\
  \ `touch` 选项，以便在文件不存在时创建一个新文件。仅供参考，`state` 的默认值为 `file`，用于验证文件是否存在。接下来的 Ansible\
  \ playook 就会在本地 `ansible` 用户的桌面上创建一个文件。完整的 `win_file.yml` playbook 如下：\n\n```yaml\n\
  ---\n- name: Creating an empty file\n  hosts: all\n  vars:\n    myfile: 'C:\\Users\\\
  ansible\\Desktop\\example.txt'\n  tasks:\n    - name: Creating an empty file\n \
  \     ansible.windows.win_file:\n        path: \"{{ myfile }}\"\n        state:\
  \ touch\n```\n\n我们可以使用 `ansible-playbook` 命令执行我们的 `win_file.yml` Ansible playbook：\n\
  \n```bash\nansible-playbook win_file.yml\n```\n\n`win_file.yml` Ansible playbook\
  \ 命令的输出如下：\n\n```\nTASK [Creating an empty file] *********************************************************************\n\
  changed: [WindowsServer]\n```\n\n空文件 `example.txt` 已经在我们的 Windows 目标主机上创建。\n\n##\
  \ 创建目录\n\nAnsible 的 `win_file` 模块也可以在目标 Windows 主机上创建目录。它是 `ansible.windows` 集合的一部分。该模块具有执行不同任务的参数。唯一的强制参数是\
  \ `path`，你可以在其中指定要编辑的文件系统路径。`state` 参数定义了我们要修改的对象类型。`state` 参数的默认值为 `file`，但在这种用例中，我们需要设置\
  \ `directory` 选项。接下来的 `win_dir_create.yml` playbook 会在用户 `ansible` 的桌面上创建 `example`\
  \ 目录：\n\n```yaml\n---\n- name: Create a directory\n  hosts: all\n  vars:\n    mydir:\
  \ 'C:\\Users\\ansible\\Desktop\\example'\n  tasks:\n    - name: Create a directory\n\
  \      ansible.windows.win_file:\n        path: \"{{ mydir }}\"\n        state:\
  \ directory\n```\n\n我们可以使用 `ansible-playbook` 命令执行我们的 `win_dir_create.yml` Ansible\
  \ playbook：\n\n```bash\nansible-playbook win_dir_create.yml\n```\n\n执行 `win_dir_create.yml`\
  \ Ansible playbook 命令的输出如下：\n\n```\nTASK [Create a directory] *************************************************************************\n\
  changed: [WindowsServer]\n```\n\n空目录 `example` 已经在我们 Windows 目标主机的 `ansible` 用户的桌面上创建。我们可以在*图\
  \ 5.6* 中看到执行前的主机，此时面上还没有 `example` 目录：\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：**\
  \ 执行前 ansible 用户的空桌面\n\n执行结果显示在*图 5.7*中，桌面上有了 `example` 目录：\n\n![](img/Figure-5.7.jpg)\n\
  \n**图 5.7：** 执行后 ansible 用户桌面上的 example 文件夹\n\n## 删除文件\n\n我们可以使用 Ansible 的 `win_file`\
  \ 模块为 Windows 目标删除文件或目录。我们需要将 `state` 参数的值指定 `absent`。接下来的 `win_delete_dir.yml`\
  \ Ansible playbook 会删除 `ansible` 用户桌面上的 `example` 文件或目录：\n\n```yaml\n---\n- name:\
  \ Delete a directory\n  hosts: all\n  vars:\n    mydir: 'C:\\Users\\ansible\\Desktop\\\
  example'\n  tasks:\n    - name: Delete a directory\n      ansible.windows.win_file:\n\
  \        path: \"{{ mydir }}\"\n        state: absent\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令执行 `win_delete_dir.yml`：\n\n```bash\nansible-playbook win_delete_dir.yml\n```\n\
  \n执行结束后，预期的文件或目录 `example` 已在 `ansible` 用户的桌面文件夹中删除。\n\n# 将本地文件复制到远程主机\n\n与用于 Linux\
  \ 的 `copy` Ansible 模块类似，可以使用 `win_copy` 模块。`win_copy` 模块包含在 `ansible.windows` 集中。它允许我们将文件从本地控制器复制到远程目标。对于从远程主机检索文件，我们使用\
  \ `fetch` 模块。对于传输大文件，请考虑 `get_url` 模块。\n\n以下是 `win_copy` 模块常用的参数：\n\n* `dest` 路径\n\
  * `src` 字符串\n* `remote_src` 布尔\n* `force` 字符串\n\n唯一的强制参数是 `dest`。`dest` 参数指定文件系统上的远程路径。当我们指定\
  \ `src` 时，它可以是本地路径或远程路径。如果 `remote_src` 设置为 `true`，则源位于远程主机。`backup` 参数允许我们在覆盖时创建一个带有时间戳的文件副本。\n\
  \n接下来的 `win_copy.yml` Ansible playbook 将源文件 `report.txt` 复制到目标的桌面：\n\n```yaml\n\
  ---\n- name: Copy report.txt\n  hosts: all\n  vars:\n    source: \"report.txt\"\n\
  \    destination: \"Desktop/report.txt\"\n  tasks:\n    - name: Copy report.txt\n\
  \      ansible.windows.win_copy:\n        src: \"{{ source }}\"\n        dest: \"\
  {{ destination }}\"\n```\n\n注意，如果 `force` 设置为 `false`，Ansible 将仅传输目标上不存在或存在差异的文件。如果\
  \ `force` 为 `true`，则无论如何都会覆盖现有文件。\n\n## 将远程文件复制到本地\n\n我们可以使用相同的 `fetch` Ansible\
  \ 模块将远程文件和目录复制到本地 Ansible 控制器。`fetch` 模块是 `ansible.builtin` 集合的一部分。关于 `fetch` 模块的详细概述，请参考*第\
  \ 4 章：Linux 用于 Ansible*中的*文件系统*章节。接下来的 `win_copy_from.yml` Ansible playbook 检索 `example.txt`\
  \ 的副本：\n\n```yaml\n---\n- name: Fetch module\n  hosts: all\n  vars:\n```\n\n\n\n\
  \n\n`myfile: 'C:\\Users\\ansible\\Desktop\\example.txt'`\n\n`save_dir: \"logs\"\
  `\n\n`tasks:`\n- name: Fetch file\n  `ansible.builtin.fetch:`\n  `src: \"{{ myfile\
  \ }}\"`\n  `dest: \"{{ save_dir }}\"`\n\n我们可以使用以下 `ansible-playbook` 命令执行 `win_copy_from.yml`\
  \ 剧本：\n\n```\nansible-playbook win_copy_from.yml\n```\n\n执行结束后，来自 `ansible` 用户桌面的\
  \ `example.txt` 文件将从远程服务器复制到 Ansible 控制器的本地 `logs` 目录中。您可以在“创建文本文件”章节中了解更多关于 Ansible\
  \ `win_copy` 模块的其他用法。\n\n若要检索多个项，请使用带有文件或目录列表的 `loop` 语句。\n\n# 下载文件](#toc.xhtml_s211a)\n\
  \n我们可以使用 Ansible 的 `win_get_url` 模块从远程服务器下载文件，该模块是 `ansible.windows` 集合的一部分。它可以将文件从\
  \ HTTP、HTTPS 或 FTP 下载到节点。对于 Linux 目标，请使用 `ansible.builtin.get_url` 模块。该模块与 Ansible\
  \ `get_url` 模块具有相同的参数。请参阅*第 4 章：Ansible For Linux* 中的*文件系统*章节获取更多信息。请注意，还有针对 X509\
  \ 身份验证客户端证书（`.pfx`）的额外参数。企业用户还可以指定 `proxy` 参数来设置代理服务器。Ansible 剧本 `win_get_url.yml`\
  \ 用于检索文件、验证校验和并将其保存到指定用户的桌面上：\n\n```\n---\n- name: Downloading a file\n  hosts:\
  \ all\n  vars:\n    myurl: \"https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz\"\
  \n    mycrc: \"https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz.sha\"\n\
  \    mycrc_algorithm: \"sha256\"\n    mydest: 'C:\\Users\\ansible\\Desktop\\ansible-2.9.25.tar.gz'\n\
  \  tasks:\n    - name: Download file\n      ansible.windows.win_get_url:\n     \
  \   url: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        checksum_algorithm:\
  \ \"{{ mycrc_algorithm }}\"\n        checksum_url: \"{{ mycrc }}\"\n```\n\n我们可以使用以下\
  \ `ansible-playbook` 命令执行 `win_get_url.yml`：\n\n```\nansible-playbook win_get_url.yml\n\
  ```\n\n执行结束后，预期的文件 `ansible-2.9.25.tar.gz` 已下载，使用 `sha256` 算法验证了校验和，并保存到 `ansible`\
  \ 用户的桌面上，如*图 5.8*所示：\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8:** 下载并保存到桌面的文件\n\n# 使用\
  \ robocopy 备份](#toc.xhtml_s212a)\n\n使用 Ansible 的 `win_robocopy` 模块进行 robocopy 备份，该模块专门为\
  \ Windows 主机上的 robocopy 设计。该模块是 `community.windows` Ansible 集合的一部分。我们可以遵循以下步骤：\n\
  \n1. 在您的剧本中定义源目录目标目录。\n2. 使用 `win_robocopy` 模块复制目录。您可以将 `recurse` 参数设置为 `yes` 以包含所有子目录。我们还可以通过\
  \ `flags` 参数向 robocopy 命令指定额外的参数。\n3. 运行剧本以复制目录。\n\n这是一个示例剧本，它使用 `win_robocopy`\
  \ 将远程 Windows 服务器的 `Desktop` 文件夹或当前用户的文件备份到本地备份目录：\n\n```\n---\n- name: Backup\n\
  \  hosts: all\n  become: false\n  vars:\n    source: \"Desktop\"\n    destination:\
  \ 'C:\\Backups'\n  tasks:\n    - name: Backup files with robocopy\n      community.windows.win_robocopy:\n\
  \        src: '{{ source }}'\n        dest: '{{ destination }}'\n```\n\n在此示例中，使用\
  \ `win_robocopy` 模块将文件从源目录复制到 `destination` 目录。\n\n# 安装软件包](#toc.xhtml_s213a)\n\n\
  Chocolatey¹ 是 Windows 的包管理器。当我们需要管理大量的机器时，手动维护是不可持续的。它拥有最大的 Windows 软件包在线注册表，并以开源许可发布。在编写本书时，它包含了近\
  \ 9600 个社区维护的软件包。流行的软件包包括 Adobe Acrobat、Google Chrome、Mozilla Firefox 等。其主要优势是完全支持软件自动化，并能够跟踪已安装的软件包以简化任何升级过程。它还销售\
  \ Chocolatey for Business (C4B)，为组织提供高级功能：\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9:**\
  \ Chocolatey 徽标\n\n![](img/196.jpg)\n\n额外的 `chocolatey.chocolatey` Ansible 集合包含了五个\
  \ Chocolatey 模块。我们可以使用*第 3 章：Ansible 语言扩展*中*Ansible collection*章节引入的 `ansible-galaxy`\
  \ 命令行工具安装该集合。`chocolatey.chocolatey` Ansible 集合包含以下五个模块：\n\n* `win_chocolatey`:\
  \ 使用 chocolatey 管理软件包\n* `win_chocolatey_config`: 管理 Chocolatey 配置设置\n* `win_chocolatey_facts`:\
  \ 从 Chocolatey 收集事实\n* `win_chocolatey_feature`: 管理 Chocolatey 特性\n* `win_chocolatey_source`:\
  \ 管理 Chocolatey 来源\n\nAnsible `win_chocolatey` 模块自动化安装 Chocolatey 软件和任何软件包。它使用 Chocolatey\
  \ 在 Windows 中管理软件包。以下是最常用的参数：\n\n* `name`: 字符串\n* `state`: 字符串 (present, latest,\
  \ absent, downgrade, reinstalled)\n* `version`: 字符串\n* `pinned`: 布尔值\n* `source`:\
  \ 字符串\n* `proxy_url`: 字符串`,`proxy_username`: 字符串`,`proxy_password`: 字符串\n\n在 `name`\
  \ 参数中，您将指定软件包名称或软件包列表。如果您想安装特定版本，可以在 `version` 参数中指定。`state` 指定我们想要执行的操作。要验证软件包是否成功安装，请选择\
  \ `present` 选项。而要验证软件包是否为最新，请使用 `latest` 值。我想提到一些可能对您有用的额外参数。`pinned` 参数允许锁定 Chocolatey\
  \ 软件包或锁定。锁定软件包以阻止升级。在下次对所有软件包升级时，Chocolatey 将自动跳过锁定的软件包。`source` 允许在可用时为软件包指定本地仓库。企业用户受益于通过\
  \ `proxy_url`、`proxy_username` 和 `proxy_password` 参数提供的代理和身份验证机制。\n\n以下 `win_chocolatey.yml`\
  \ Ansible 剧本在 Windows 目标上安装了 `git` 和 `notepadplusplus` 软件包：\n\n```\n---\n- name:\
  \ Installing packages\n  hosts: all\n  vars:\n    packages:\n      - git\n     \
  \ - notepadplusplus\n  tasks:\n    - name: Install packages\n      chocolatey.chocolatey.win_chocolatey:\n\
  \        name: \"{{ packages }}\"\n        state: present\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令执行 `win_chocolatey.yml`：\n\n```\nansible-playbook win_chocolatey.yml\n```\n\n\
  执行结束后，软件 `git` 和 `notepad++` 已成功安装在 Windows 目标主机上，如*图 5.10*所示：\n\n![](img/Figure-5.10.jpg)\n\
  \n**图 5.10:** Ansible 安装的 git 和 notepad++ 软件\n\n# 滚动更新](#toc.xhtml_s214a)\n\n滚动更新是集群管理中的重要步骤。当服务器数量增加时，手动跟踪更新过程变得困难。Ansible\
  \ 为我们提供了一种简单高效的方法来执行集群的滚动更新和报告。\n\n\n\n\n我们将使用 Ansible 的 `win_updates` 模块。它包含在 `ansible.windows`\
  \ 集中。该模块适用于 Windows 和 Windows Server 。此模块用于下载和安装 Windows 更新。要在 Linux 目标上安装包，请针对\
  \ RedHat 类系统使用 `yum` 或 `dnf` 模块，针对 Debian 类系统使用 `apt` 模块，针对 Suse 类系统使用 `zypper`\
  \ 模块，如*第 4 节：适用于 Linux 的 Ansible* 中*安装软件包和滚动更新*章节所示。要实现完整的滚动更新过程，请在我们的 playbook\
  \ 中配合 `fork` 和 `serial` 语句。更多信息请参阅第 7 节：Ansible Enterprise 中的 Ansible 编排章节。\n\n\
  以下是 Ansible `win_updates` 模块的七个参数：\n\n*   `category_names` 字符串 (`CriticalUpdates`,\
  \ `DefinitionUpdates`, `DeveloperKits`, `FeaturePacks`, `SecurityUpdates`, `ServicePacks`,\
  \ `UpdateRollups`)\n*   `state` 字符串 - (searched, downloaded, installed)\n*   `reboot`\
  \ 布尔值\n*   `reboot_timeout` 整数\n*   `log_path` 路径\n*   `accept_list` / `reject_list`\
  \ 列表（用于白名单或黑名单的标题或 KB）\n*   `server_selection` 字符串\n\n最重要的 `category_names`，它定义了系统中安装的更新类型。默认启用的类别是“CriticalUpdates`,\
  \ `SecurityUpdates` 和 `UpdateRollups`。我们可以通过 `CriticalUpdates`, `DefinitionUpdates`,\
  \ `DeveloperKits`, `FeaturePacks`, `SecurityUpdates`, `ServicePacks` 和 `UpdateRollups`\
  \ 的完整列表来添加或删除不同的类别。我们可以使用“state”参数定义 Ansible 关于更新的行为。它指定每个显示的包是仅为“searched”（已搜索，即仅在日志文件中列出）、“downloaded”（已下载，即仅下载）还是“installed”（已安装，即在\
  \ Windows 目标系统中成功下载并安装）。如果您只想下载代码并在第二次执行实际更新，则需要选择 `downloaded` 选项。当启用 `reboot`\
  \ 参数时，Ansible 可以在需要时自动重启远程主机并在重启后继续安装更新。重启后等待主机的默认超时值为 1200 秒。我们可以通过 `reboot_timeout`\
  \ 选项增加该值。我们可以将状态保存在 `log_path` 选项定义的日志文件中，以便在磁盘上保存日志文件。\n\n我们可以使用 `accept_list`\
  \ 参数指定更新标题或 KB 列表，说明要搜索或安装哪些更新，并使用 `reject_list` 参数指定排除列表。我们还可以从企业环境的 Microsoft\
  \ Windows Server Update Services (WSUS) 获取内容。在处理 WSUS 时，我们将 `server_selection` 参数设置为\
  \ `managed_server` 值以使用 WSUS 目录；而将其设置为 `windows_update` 值以使用 Microsoft Windows 更新目录。以下\
  \ `win_rolling.yml` Ansible playbook 仅对 Windows 目标执行关键更新和安全更新的滚动更新。它还会在需要时重启机器并将日志保存到\
  \ `C:\\ansible.txt` 文件。完整的 Ansible playbook 如下：\n\n```yaml\n---\n- name: Windows\
  \ rolling update\n  hosts: all\n  tasks:\n    - name: Install all critical and security\
  \ updates\n      ansible.windows.win_updates:\n        category_names:\n       \
  \   - CriticalUpdates\n          - SecurityUpdates\n        state: installed\n \
  \       reboot: true\n        log_path: C:\\ansible.txt\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令执行 `win_rolling.yml`：\n\n```bash\nansible-playbook win_rolling.yml\n```\n\n\
  执行结束，Windows 软件更新成功安装在我们的系统中，并创建了 `ansible.txt` 日志文件，如*图 5.12*所示。*图 5.11* 显示了 Ansible\
  \ 触发 Windows 更新过程之前的情况：\n\n![](img/Figure-5.11.jpg)\n\n**图 5.11：** 执行滚动更新 Playbook\
  \ 之前的 Windows 目标\n\n*图 5.12* 显示了目标系统执行 Windows 更新后的 `ansible.txt` 日志文件：\n\n![](img/Figure-5.12.jpg)\n\
  \n**图 5.12：** 执行滚动更新 Playbook 之后的 Windows 目标\n\n# 用户管理](#toc.xhtml_s215a)\n\n我们使用\
  \ Ansible 模块 `win_user` 管理本地用户，并使用 `win_group` 创建本地组。这两个模块都是 `ansible.windows` 集合的一部分。`win_user`\
  \ 模块管理本地 Windows 用户账户，而 `win_group` 模块添加和删除本地组。对于 Linux 目标，请用 `ansible.builtin`\
  \ 集中的 `user` 和 `group` 模块。更多信息请参阅*第 4 节：适用于 Linux 的 Ansible* 中的用户管理章节。\n\n`ansible.windows.win_user`\
  \ 模块管理本地 Windows 用户账户。其参数为：\n\n*   `name` 字符串\n*   `state` 字符串\n*   `password` 字符串\n\
  *   `description` 字符串\n*   `groups` 列表\n*   `update_password` 字符串 (always 或 on_create)\n\
  *   `password_never_expires` 布尔值\n*   `password_expired` 字符串\n*   `account_locked`\
  \ 布尔值\n*   `account_disabled` 布尔值\n\n唯一必需参数是 `name`，它是账户的用户名。`state` 参数允许我们定义操作以验证用户是否存在于目标\
  \ Windows 系统中。在我们的用例中，默认已设置为 `present` 以创建用户。`password` 以明文形式设置密码。因此可以轻松地指定为用户分配什么密码。不需要哈希函数。我们可以直接指定密码。`description`\
  \ 参数允许您指定用户的描述。这不是强制性的，但有时很有用。`groups` 参数允许您从此组列表中添加或删除用户。`update_password` 参数指定模块在何何时更新用户密码。`always`\
  \ 选项在密码不同时更新密码，而 `on_create` 仅在新创建用户时设置密码。让我也特别强调一些关于密码过期的参数：`password_never_expires`\
  \ 可设置密码永不过期，或 `password_expired` 强制用户在下次登录时更改密码。您还可以使用 `account_locked` 和 `account_disabled`\
  \ 参数锁定或禁用账户。\n\n以下 `win_user.yml` Ansible playbook 在 Windows 目标系统的 `Users` 组中创建一个名为\
  \ `example` 的用户，并在用户首次访问时更改密码。完整的 `win_user.yml` Ansible playbook 如下：\n\n```yaml\n\
  ---\n- name: Create a user account\n  hosts: all\n  vars:\n    usr_name: 'example'\n\
  \    usr_password: 'password'\n    usr_groups: \"Users\"\n  tasks:\n    - name:\
  \ User example exist\n      ansible.windows.win_user:\n        name: \"{{ usr_name\
  \ }}\"\n        password: \"{{ usr_password }}\"\n        groups: \"{{ usr_groups\
  \ }}\"\n        update_password: on_create\n        password_expired: true\n```\n\
  \n我们可以使用以下 `ansible-playbook` 命令执行 `win_user.yml` playbook：\n\n```bash\nansible-playbook\
  \ win_user.yml\n```\n\n执行结束，根据 Ansible playbook 中指定的选项了本地用户 `example`。\n\n# 组管理](#toc.xhtml_s216a)\n\
  \n`win_group` 模块管理目标 Windows 系统中的本地组。Ansible `win_group` 模块的主要参数为：\n\n*   `name`\
  \ 字符串 - 组名\n*   `state` 字符串 - present/absent\n*   `system` 布尔值 - yes/no\n*   `gid`\
  \ 整数 - 为组设置的 GID\n\n\n\n\n*   `local` 字符串 - `local` 命令的替代方案\n\n所需的参数是 `name`。此参数指定组名称。`state`\
  \ 参数允许我们验证 Windows 目标系统中是否存在某个组。在我们的用例中，默认值已设置为 `present`，用于验证该组是否存在，或者如果不存在则创建它。`system`\
  \ 参数允许我们创建一个系统组。默认情况下它不是的。你可以通过使用 `gid` 参数指定 `GID`（组标识符）。`local` 参数允许我们在实现该功能的平台上使用\
  \ `local` 命令的替代方案。这通常在使用中央认证系统时执行。以下 `win_group.yml` Ansible 剧本在 Windows 目标系统中创建一个本地组\
  \ `accounting`：\n\n```yaml\n---\n- name: Group add\n  hosts: all\n  vars:\n    mygroup:\
  \ 'accounting'\n    mydescription: 'accounting group'\n  tasks:\n    - name: Create\
  \ a new group\n      ansible.windows.win_group:\n        name: \"{{ mygroup }}\"\
  \n        description: \"{{ mydescription }}\"\n        state: present\n```\n\n\
  我们可以使用以下 `ansible-playbook` 命令执行 `win_group.yml` 剧本：\n\n```bash\nansible-playbook\
  \ win_group.yml\n```\n\n执行结束后，目标 Windows 系统中创建了本地组 `accounting`。\n\n## Windows 注册表\n\
  \n使用 Ansible 自动化 Windows 注册表交互非常有用，因为我们可以获得精确的结果并在规模上运行剧本。我们可以使用 `win_reg_stat`\
  \ 模块检查特定键的值，并使用 `win_regedit` 模块添加或删除键。\n\n## 检查注册表\n\n我们可以使用 Ansible 的 `win_reg_stat`\
  \ 模块获取 Windows 注册表的信息。该模块包含在 `ansible.windows` 集中。其目的是从 Windows 注册表项检索信息。\n\n模块的主要参数有：\n\
  \n*   `path` 字符串\n*   `name` 字符串\n*   `type` 字符串 (string, none, binary, dword, expandstring,\
  \ multistring, qword)\n*   `data` 字符串\n*   `state` 字符串 (present, absent)\n\n唯一的必需参数是\
  \ `path`。此参数指定空注册表项路径，包括要搜索的配置单元（hive）。`name` 指定注册表项的名称。`type` 参数指定数据类型：`string`,\
  \ `dword`, `qword`, `binary`, `multistring` 等。请注意，某些值被指定为十进制数字、十六进制值或指定为 Ansible\
  \ 列表的多字符串。我们可以通过填充 `data` 参数来指定注册表项的值。我们可以使用 `state` 参数的两个选项来验证键是否存在：`present` 表示存在，`absent`\
  \ 表示不存在。\n\n以下 `reg_check.yml` Ansible 剧本用于在访问 Windows 注册表的类 Windows 系统上检查 .NET\
  \ Framework 版本。具体而言，它检查位于 `HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\NET Framework\
  \ Setup\\NDP\\v4\\Full` 的 Windows 注册表键 `Version`。\n\n完整的完整的 `reg_check.yml` Ansible\
  \ 剧本所示：\n\n```yaml\n---\n- name: Check .NET version\n  hosts: all\n  tasks:\n  \
  \  - name: Retrieve .NET version\n      ansible.windows.win_reg_stat:\n        path:\
  \ 'HKLM:\\SOFTWARE\\Microsoft\\NET Framework Setup\\NDP\\v4\\Full'\n        name:\
  \ \"Version\"\n      register: reg_val\n    - name: Print .NET version\n      ansible.builtin.debug:\n\
  \        msg: \"{{ reg_val }}\"\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行 `reg_check.yml`\
  \ 剧本：\n\n```bash\nansible-playbook reg_check.yml\n```\n\n执行结束后，目标 Windows 系统的当前\
  \ .NET 4.8 版本将打印在屏幕上。输出如下：\n\n```text\nTASK [Print .NET version] *******************************************************************\n\
  ok: [WindowsServer] => {\n  \"msg\": {\n    \"changed\": false,\n    \"exists\"\
  : true,\n    \"failed\": false,\n    \"raw_value\": \"4.8.04161\",\n    \"type\"\
  : \"REG_SZ\",\n    \"value\": \"4.8.04161\"\n  }\n}\n```\n\n## 添加 Windows 注册表\n\n\
  如所述，在运行 Ansible `win_regedit` 模块验证键是否已存在之前，我们可以结合参数 `path`、`name`、`type` 和 `data`，如果需要，使用\
  \ Ansible `win_regedit` 模块创建它。\n\n以下 `reg_create.yml` Ansible 剧本在 `HKEY_LOCAL_MACHINE`\
  \ 下的 `Software` 文件夹下创建一个 `Test` 配置单元项。在该项下，我们创建一个名为 `hello` 的键，其值为字符串 `world`。完整的\
  \ Ansible 剧本所示：\n\n```yaml\n---\n- name: Windows registry add\n  hosts: all\n  vars:\n\
  \    mypath: 'HKLM:\\Software\\Test'\n    mykey: 'hello'\n    mytype: string\n \
  \   myvalue: 'world'\n  tasks:\n    - name: Add key-value to registry\n      ansible.windows.win_regedit:\n\
  \        path: \"{{ mypath }}\"\n        name: \"{{ mykey }}\"\n        type: \"\
  {{ mytype }}\"\n        data: \"{{ myvalue }}\"\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令执行 `reg_create.yml` 剧本：\n\n```bash\nansible-playbook reg_create.yml\n```\n\n\
  在执行阶段结束后，目标 Windows 系统上存在键 `HKLM:\\Software\\Test`，如[图 5.13]所示：\n\n![](img/Figure-5.13.jpg)\n\
  \n**图 5.13:** 执行 reg_create.yml 剧本后的 Windows 注册表\n\n## 删除 Windows 注册表\n\n同样，正如我们在上一节中添加\
  \ Windows 注册表键一样，我们可以使用 Ansible `win_regedit` 模块并将 `path` 参数设置为 `absent` 来删除路径或配置单元。\n\
  \n以下 `reg_remove.yml` Ansible 剧本用于在 `HKEY_LOCAL_MACHINE` 下的 `Software` 文件夹下创建一个\
  \ `Test` 配置单元项（注：此处原文描述可能有误，逻辑上应为删除，但按原文意思翻译）。完整的 Ansible 剧本所示：\n\n```yaml\n---\n\
  - name: Windows registry remove\n  hosts: all\n  vars:\n    mypath: 'HKLM:\\Software\\\
  Test'\n  tasks:\n    - name: Registry remove path\n      ansible.windows.win_regedit:\n\
  \        path: \"{{ mypath }}\"\n        state: absent\n```\n\n我们可以使用以下 `ansible-playbook`\
  \ 命令执行 `reg_remove.yml` 剧本：\n\n```bash\nansible-playbook reg_remove.yml\n```\n\n\
  在执行阶段结束后，目标 Windows 系统上的键 `HKLM:\\Software\\Test` 被删除，如[图 5.14]所示：\n\n![](img/Figure-5.14.jpg)\n\
  \n**图 5.14:** 执行 reg_create.yml 剧本后的 Windows 注册表（注：原文此处可能有误，应为 remove）\n\n## 执行命令\n\
  \n`win_command` 和 `win_shell` 都是在 Windows 上执行命令的 Ansible 模块，但它们在执行环境和语法上有所不同。\n\n\
  Ansible `win_command` 模块在 Windows 命令行中运行，而 `win_shell` 模块在 PowerShell Shell 中运行。选择哪个模块取决于你需要运行的命令类型。\n\
  \n如果你需要运行简单的命令或批处理，可以使用 `win_command` 模块。例如，创建一个目录：\n\n```yaml\n- name: Create directory\n\
  \  win_command: mkdir C:\\example\n```\n\n我们可以使用 `win_shell` 模块执行任何 PowerShell 脚本。以下脚本创建一个新用户：\n\
  \n```yaml\n- name: Create new user\n  win_shell: New-LocalUser -Name \"exampleuser\"\
  \ -Password (ConvertTo-SecureString \"P@ssword1\" -AsPlainText -Force)\n```\n\n\
  `win_command` Ansible 模块可以用于不需要 shell 功能的简单命令。`win_shell` Ansible 模块或 `win_command`\
  \ Ansible 模块均可在 Windows 目标主机上执行 Windows PowerShell 或 cmd.exe，但方式略有不同。在可能的情况下，始终优先使用特定的\
  \ Ansible 模块。\n\n\n\n\n\n`win_shell` Ansible 模块执行 PowerShell 或 `cmd.exe` 解释器，并具有完整的\
  \ shell 功能，例如如 `$env:HOME` 等变量以及 `<`、 `>`, `|` 和 `;` 等操作。`win_command` Ansible 模块在不具备任何\
  \ shell 功能的情况下执行代码，它有时更安全，因为不会暴露环境变量。从本质上来说，`win_command` 模块比 `win_shell` 模块更安全。\n\
  \n从安全角度来看，`win_command` 模块更加健壮，结果更具预测性，因为它绕过了 shell。两个模块都总是返回 `changed` 状态，因为 Ansible\
  \ 无法预测执行是否更改了目标系统。对于 Linux 目标，请按照第 4 章 Ansible For Linux 中“Executing commands”章节的描述，使用\
  \ `ansible.builtin.command` 和 `ansible.builtin.shell` 模块。\n\nAnsible `win_command`\
  \ 模块在远程 Windows 节点上执行命令。`win_command` 模块不受本地 `win_shell` 变量的影响，因为它绕过了 `win_shell`。同时，它可能无法运行\
  \ `win_shell` 的内置功能和重定向。\n\nAnsible `win_shell` 模块在目标主机上带有完整的 shell 上文执行 shell 命令。以下示例演示了\
  \ Ansible `win_command` 模块和 `win_shell` 模块的功能。\n\n# Netstat playbook(#toc.xhtml_s222a)\n\
  \n这是一个 Ansible playbook 示例，它使用 `win_command` 模块在所有主机上运行 `netstat -e` 命令，并将输出注册到\
  \ `command_output` 变量中。随后使用 `ansible.builtin.debug` 模块显示 `command_output.stdout_lines`\
  \ 变量的输出。\n\n在 Windows 中，`netstat` 是命令行工具，用于显示活动 TCP 连接、监听连接主机上的端口、以太网统计数据、IP 路由表等。`-e`\
  \ 选项用于显示以太网统计数据。\n\n`win_command` 模块用于在 Windows 主机上运行命令。它允许执行从命令提示符运行的任何命令，包括 PowerShell\
  \ 命令。\n\n`register` 关键字用于将 `netstat` 命令的输出捕获到 `command_output` 变量中。该变量稍后可以在 playbook\
  \ 中用于进一步处理或分析。\n\n`ansible.builtin.debug` 模块用于显示 `command_output.stdout_lines` 变量的输出，该变量包含字符串列表形式的\
  \ `netstat` 命令标准输出。此任务的输出将打印到控制台，提供有关每个 Windows 主机以太网统计数据的信息。完整的 Ansible `netstat.yml`\
  \ playbook 如下：\n\n```yaml\n---\n- name: Netstat playbook\n  hosts: all\n  tasks:\n\
  \    - name: Check netstat\n      ansible.windows.win_command: \"netstat -e\"\n\
  \      register: command_output\n    - name: Command output\n      ansible.builtin.debug:\n\
  \        var: command_output.stdout_lines\n```\n\n我们可以使用以下 `ansible-playbook` 命令执行\
  \ `netstat.yml` playbook：\n\n```bash\nansible-playbook netstat.yml\n```\n\n执行输出与如下所示：\n\
  \n```text\nTASK [Command output] ***********************************************************************\n\
  ok: [WindowsServer] => {\n  \"command_output.stdout_lines\": [\n    \"Interface\
  \ Statistics\",\n    \"                                  �                                                                        Received\
  \                Sent\n\n    \"Bytes            13617365         10237530\",\n \
  \   \"Unicast packets       53129     15035\",\n    \"Non-unicast packets            \
  \ 293          274\",\n    \"Discards                     0�������������������������\
  \ 0\",\n    \"Errors                               0\",\n    \"Unknown protocols    \
  \ 206\"\n  \"\n  ]\n}\n```\n\n# Get-Date playbook(#toc.xhtml_s223a)\n\n这是一个 Ansible\
  \ playbook 示例，它使用 `win_shell` 模块在所有主机上运行多个 PowerShell 命令，并将输出注册到 `command_output`\
  \ 变量中。与上一个示例相同，随后使用 `ansible.builtin.debug` 模块显示 `command_output.stdout_lines` 变量的输出。\n\
  \n在此示例中，每个 Windows 主机运行两个 PowerShell 命令。第一个命令是 `hostname`，显示计算机的主机名。第二个命令是 `Get-Date`，显示当前日期和时间。\n\
  \nAnsible `win_shell` 模块用于在 Windows 主机上运行 PowerShell 命令。它允许使用多行字符串执行多个 PowerShell\
  \ 命令。\n\n`register` 关键字将两个 PowerShell 命令的输出捕获到 `command_output` 变量中。该变量稍后可以在 playbook\
  \ 中用于进一步处理或分析。\n\n`ansible.builtin.debug` 模块用于显示 `command_output.stdout_lines` 变量的输出，该变量包含字符串列表形式的两个\
  \ PowerShell 命令的标准输出。此任务的输出将打印到控制台，提供有关每个 Windows 主机主机名以及当前日期时间的信息。完整的 Ansible `powershell.yml`\
  \ playbook 如下：\n\n```yaml\n---\n- name: Powershell playbook\n  hosts: all\n  tasks:\n\
  \    - name: Check getdate\n      ansible.windows.win_shell: |\n        hostname\n\
  \        Get-Date\n      register: command_output\n    - name: Command output\n\
  \      ansible.builtin.debug:\n        var: command_output.stdout_lines\n```\n\n\
  我们可以使用以下 `ansible-playbook` 命令执行 `powershell.yml` playbook：\n\n```bash\nansible-playbook\
  \ powershell.yml\n```\n\n执行输出与如下所示：\n\n```text\nTASK [Command output] ***********************************************************************\n\
  ok: [WindowsServer] => {\n  \"command_output.stdout_lines\": [\n    \"demo\",\n\
  \    \"\",\n    \"Friday, April 8, 2022 18:19:36 AM\",\n    \"\",\n    \"\"\n  ]\n\
  }\n```\n\n# Wrong module(#toc.xhtml_s224a)\n\n当我们在 `win_command` 和 `win_shell` 模块之间使用错误的模块时，会导致致命错误。请参考第\
  \ 6 章 Ansible Troubleshooting 中的“Ansible modules”章节进行进一步排错。\n\n# Conclusion(#toc.xhtml_s25a)\n\
  \n使用 Ansible 自动化 Windows 目标系统的任务可以提高我们的效率并为我们的集群创造更多价值。可用性测试、配置管理、文件系统和用户管理、软件包安装、滚动更新以及\
  \ Windows 注册表等重复操作可以更好地执行，并获得更准确的结果。\n\n在下一章节中，我们将学习 Ansible 的最佳实践，即如何排错、识别问题原因并修复它。\n\
  \n# Points to Remember(#toc.xhtml_s26a)\n\n*   我们可以使用 Ansible 在大多数现代 Windows 和 Windows\
  \ Server 上执行脚本。通过 WinRM 连接并使用 PowerShell 终端执行命令。\n\n*   最简单的 Ansible 模块是 `win_ping`，它测试\
  \ Windows 目标主机上 PowerShell 代码的身份验证和执行\n\n*   可以使用 Ansible `win_lineinfile` 模块和 Ansible\
  \ `template` 模块进行配置管理。\n\n*   许多模块简化了文件系统管理：使用 Ansible `win_stat` 模块检查文件和目录是否存在；使用\
  \ Ansible `win_file` 模块创建文件和目录；使用 Ansible `win_get_url` 模块下载内容；使用 Ansible `git`\
  \ 模块检出 Git 仓库。\n\n*   可以使用 Chocolatey 软件包管理器配置或安装额外软件，并保持我们的集群统一。\n\n\n\n\n\n* \
  \  我们使用 Ansible 的 `win_updates` 模块进行滚动更新以保持机群最新，并在企业环境中使用 Microsoft Windows Server\
  \ Update Services (WSUS)。\n*   Ansible 的 `win_user` 和 `win_group` 模块简化了本地用户和组的管理。\n\
  *   可以使用 Ansible 的 `win_reg_stat` 和 `win_regedit` 模块从 Windows 注册表中检查、创建和删除键、项和值。\n\
  \n# 多选择题\n\n1. 配置 Windows 目标主机需要什么要求？\n    1. OpenSSH 服务运行并有 Python 解释器\n    2.\
  \ WinRM 服务运行并有 Python 解释器\n    3. WinRM 服务运行并有 PowerShell 解释器\n    4. OpenSSH 服务运行并有\
  \ PowerShell 解释器\n\n2. 检查 Windows 目标上是否存在文件的最佳方法是什么？\n    1. Ansible stat 模块\n \
