  md: '# 13

    Security


    This chapter describes some commonly used security mechanisms. Many more are available.
    For more information on system security, consult the references listed in Appendix
    C,"Web Resources."


    # Root Password Protection


    The sudo command allows one user to temporarily become another user. If it''s
    necessary for the user to become the superuser, the user must know the password
    for root. The sudo command is provided as an alternative to giving ordinary users
    the root password.


    The sudo command allows non-privileged users to perform a limited number of privileged
    functions. It eliminates the need to give the root password to anyone the system
    administrator. This section describes how to limit the tasks that can be performed
    by users of sudo.


    # /etc/sudoers


    The /etc/sudoers file controls which users can run which programs as root using
    sudo. It''s composed of an optional host alias section, an optional command alias
    section, and the user specification section. The format of this file is defined
    by a powerful command language. For a complete definition, see the sudo(5) manual
    page.


    Following is a simple example in which a user needs capability to run /usr/bin/build
    and all the commands in /usr/bin that begin with dpkg:


    ```

    # Alias specification

    Cnd_Alias DPGKG=/usr/bin/dpkg

    Cnd_Alias BUILD=/usr/bin/build

    # User privilege specification

    epetron ALL=DPKG

    epetron ALL=BUILD

    ```


    In this example, the user epetron is allowed to execute /usr/bin/build (defined
    by the BUILD alias) and any files starting with dpkg in the /usr/bin directory
    (defined by the DPKG alias). The keyword ALL means that epetron can execute these
    files from any host.'
  merge: -1
  pgno: 292
- img_proc: true
  md: "# Restricting Batch Access\n\nRestricting the running of scheduled and/or non-interactive\
    \ jobs.\n\n# /etc/at.access and /etc/at.deny\n\n /etc/at.access and /etc/at.deny\
    \ files determine which users can submit batch jobs via /at or batch. Each file\
    \ contains a list of usernames, one per line. Whitespace is not permitted. If\
    \ the file /etc/at.allow exists, only users mentioned in it are allowed to use\
    \ /at. If /etc/at.allow does not exist, /etc/at.deny is checked. If neither exists,\
    \ only root has access to the /at command. If /etc/at.deny is empty, all users\
    \ have access to the /at command.\n\n# Restricting Login Privileges\n\nRestricting\
    \ logins, trusted access (no passwords required), and the designation of login\
    \ shells.\n\n# /etc/login.access\n\n/etc/login.access is an access control table\
    \ that determines which users are allowed to log in from which origins. Origins\
    \ can be specified as serial line (TTY) devices and/or network hosts.\n\nEach\
    \ line of the file has the following format:\n\nPERMISSION:USERS:ORIGINS\n\nPERMISSION\
    \ is + (access granted) or – (access denied). USERS is a list of login names,\
    \ group names, or ALL (always matches). ORIGINS is a list of one or more TTY names,\
    \ hostnames, domain names (beginning with a period), host addresses (ending with\
    \ a period), ALL (always matches) or LOCAL (matches any string that doesn't contain\
    \ a period). The EXCEPT operator can be used to exclude sets of users and login\
    \ origins. Lines beginning with # are treated as comments.\n\nThe group file is\
    \ searched only when a name does not match that of the logged-in user. Only groups\
    \ are matched in which users are explicitly listed. A user’s primary group ID\
    \ value is not considered.\n\nExamples:\n\n```\n# Disallow console logins to all\
