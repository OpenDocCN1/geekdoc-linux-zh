    >>continued


    | Suffix | Processing |

    | --- | --- |

    | .i | Compiles and assembles a C source that has previously been preprocessed.
    |

    | .ii | Compiles and assembles a C++ source that has previously been preprocessed.
    |

    | .s | Assembles an assembly language source that has already been preprocessed.
    |

    | .S | Preprocesses and assembles an assembly language source. |

    | .o | Links a relocatable object. |

    | .a | Links an archive containing relocatable objects. |


    # Command-Line Options


    gcc and g++ accept any command-line options. Some of these options are architecture-specific.
    The following sections describe the command-line options that are useful for all
    Linux versions of gcc and g++.


    # General Options


    | Option | Description |

    | --- | --- |

    | -C | Compiles and assembles but doesn''t link. |

    | -E | Stops after preprocessing. The output is processed source code''s sent
    to standard output. |

    | -g | Includes debugging symbols for use by gdb. |

    | -o FILE | Places the output in FILE |

    | -pipe | Uses pipes instead of temporary files to pass data between stages. |

    | -S | Compiles but doesn''t assemble. This leaves a compiled source file with
    the .s suffix. The -o option can be used to specify another name. |

    | -V | Verbose. Processing stages on standard error. |

    | -x LANGUAGE | Specifies the input LANGUAGE rather than assuming it is based
    on the filename suffix. Valid values for LANGUAGE are c, objective-c, c-header,
    c++, cpp-output, assembler, and assembler-cpp. |

    | -x none | Turns off any language specification by -x LANGUAGE. |


    # Language Options


    | Option | Description |

    | --- | --- |

    | -ansi | Assumes ANSI C input. |

    | -fall-virtual | Treats all possible member functions as virtual, implicitly.
    All member functions (except for constructor functions and new delete member operators)
    are treated as virtual functions of the class where they appear. |

    | -fcond-mismatch | Allows conditional expressions with mismatched arguments in
    the second and third arguments. The value of such an expression is void. |'
