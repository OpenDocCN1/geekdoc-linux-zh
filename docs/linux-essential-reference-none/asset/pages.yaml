  md: '# 5 Network Clients


    This chapter describes programs that provide access to network services. These
    services enable users to see who is logged onto hosts and to network file and
    data transfer, and remote command execution.


    # Information Utilities


    This section describes commands that provide network information services. These
    services enable users to see who is logged onto remote hosts and to query the
    status of those hosts.


    # finger


    finger [ OPTION ... ] [ USER ... ] finger displays information about remote or
    local users. USER can refer to users local to the system or users on a remote
    system through use of the form USER@HOST. If no users are specified, finger shows
    information about every user logged onto the local system. If no options are specified,
    the -l format is used.


    | Option | Description |

    | --- | --- |

    | -s | Displays the user''s login name, real name, terminal name and write status,
    idle time, login time, office location, and office number. |

    | -1 | Displays all the information from the -s option plus the user''s home directory,
    phone number, login shell, mail status, and the contents of .plan, .project, and
    .forward files in the user''s home directory. |

    | -p | Prevents the -1 option from displaying the .plan and .project files. |

    | -m | Prevents matching of usernames. If -m is not specified, matching is done
    on the users'' real names as well as usernames.'
