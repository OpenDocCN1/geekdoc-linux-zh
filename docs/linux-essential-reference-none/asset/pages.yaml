  md: '# # 11

    Network Administration


    This chapter deals with administration of network transport and services. Commands,
    daemons, and configuration files are divided into several functional groups.


    For more information regarding installation and setup of networks involving Linux
    servers and workstations, see the resources listed in Appendix C, "Web Resources."


    # ## Hardware/IP Address Mapping


    Network hosts map addresses to IP addresses and vice versa using the Address Resolution
    Protocol (ARP) and Reverse Address Resolution Protocol (RARP). The commands and
    configuration files in this section are used to set up ARP and RARP.


    arp


    ```

    arp [-vn] [-H TYPE] [-i IF] -a [HOSTNAME]

    arp [-v] [-i IF] -d HOSTNAME [pub]

    arp [-v] [-H TYPE] [-i IF] -s HOSTNAME HW_ADDR [temp]

    arp [-v] [-H TYPE] [-i IF] -s HOSTNAME HW_ADDR [netmask NM] pub

    arp [-v] [-H TYPE] [-i IF] -ds HOSTNAME IFA [netmask NM] pub

    arp [-vn] [-H TYPE] [-i IF] -f FILENAME

    ```


    arp is used to manipulate the kernel''s ARP cache. It is mainly used for clearing
    address entries and manually setting new ones. It can also produce formatted dumps
    of the ARP cache for diagnostic purposes. The following table describes the options
    ARP accepts. HOSTNAMES can be either symbolic names or IP addresses in dotted
    decimal notation.


    | Option | Description |

    | :--- | :--- |

    | -a [HOSTNAME] or | Shows entries for HOSTNAME.All entries will be displayed
    if HOSTNAME is omitted. |

    | --display [HOSTNAME] | |

    | -D or --device | Used with the -s option. Uses the interface IFA''s hardware
    address. |


    continues >>'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 206 Network Administration: arp


    >>continued


    | Option | Description |

    | --- | --- |

    | -d HOSTNAME or | Removes the entry for host HOSTNAME.

    | --delete HOSTNAME | |

    | -f FILENAME or | Like the -s option except that address information is read
    from the file FILENAME. The file /etc/ethers or another file of the same format
    can be used for this. See /etc/ethers for more information.

    | -H TYPE or --hw-type TYPE | Restrictions on entries of hardware type TYPE. The
    default for TYPE is either (IEEE 802.3 10Mbps Ethernet). Other possible values
    include arcnet (ARC), ax2s (AX 25), and netrom (NET/ROM).

    | -i IF or --device IF | Selects interface only, entries matching interface ARP
    cache. Setting a permanent or temporary ARP entry will use the specified device.
    If no device is given, the kernels guess the device from the routing table. For
    pub entries, the specified interface is the interface on which ARP requests will
    be answered.

    | -n or -numeric | Shows numbers instead of trying to determine symbolic host,
    port, or usernames.

    | -s HOSTNAME HW_ADDR or --set HOSTNAME HW_ADDR | Manually creates an ARP address-mapping
    entry for host HOSTNAME with hardware address set to the HW_ADDR class. When adding
    proxy ARP entries (those with the publish flag set), a netmask can be specified
    for proxy ARP entries which will be permanently stored in the ARP cache.

    | -v | Verbose operation.|


    # arp


    ```

    arp [-V] [--version] [-h] [--help]

    arp -a

    arp [-v] -d HOSTNAME ...

    arp [-v] [-t TYPE] -s HOSTNAME HW_ADDR

    ```


    arp is used to manage the kernel''s RARP table. It''s mainly used for setting
    and clearing address-mapping entries. For diagnostic purposes, it can also be
    used to produce a formatted dump of the RARP table.


    The RARP protocol is typically used by diskless workstations that know their hardware
    addresses but don''t know their IP addresses upon startup. In order to use RARP,
    the RARP request to find out their own IP addresses, "Reverse ARP" networking
    option must be enabled in the kernel.'
