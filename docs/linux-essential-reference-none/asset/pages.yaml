  md: '# User Management: chfn


    chfn [ -f FULL_NAME ] [ -r ROOM_NO ] [ -w WORK_PHONE ] [ -h HOME_PHONE ] -> [
    -o OTHER ] [ USER ]


    chfn changes the user''s full name, office number, office extension, and home
    phone number information for a user''s account. This information is typically
    printed by finger and similar programs. A normal user can change the fields for
    his or her own account, but the superuser can change the fields for any account.
    Also, only the superuser can use the -o option.


    The only restriction placed on the contents of the fields is that no control characters
    can be present, nor any commas (,), colons (:), or equal signs (=). The OTHER
    field doesn''t have this restriction, and is used to store accounting information
    used by other applications.


    Without options, chfn operates interactively on the current user''s account.


    # chsh


    chsh

    chsh [ -s LOGIN_SHELL ] [ USER ]


    chsh changes the login shell for USER to LOGIN_SHELL. A normal user can only change
    the login shell for his or her own account. The superuser can change any account.
    If specified using the -s option, chsh prompts for the value of LOGIN_SHELL. The
    only restriction placed on LOGIN_SHELL is that the command name must be listed
    in /etc/shells unless the invoker is the superuser, in which case any value can
    be added. An account with a restricted login shell can''t change his login shell.


    # groupadd


    groupadd [ -g GID [ -o ] ] GROUP


    groupadd command creates a new group account using the values specified on the
    command line and the default values from the system. The new group will be entered
    into the system files as needed. The numerical value of the group''s ID is specified
    by -g GID.This value must be unique unless the -o option is used, and must be
    non-negative. The default is to use the smallest ID value greater than 99 and
    greater than every other group. Values between 0 and 99 are typically reserved
    for system accounts.


    # groupdel


    groupdel GROUP


    groupdel command modifies the system account files, deleting all entries that
    refer to GROUP. The named group must exist. The primary group of an existing user
    can''t be removed without removing the user.'
  merge: -1
