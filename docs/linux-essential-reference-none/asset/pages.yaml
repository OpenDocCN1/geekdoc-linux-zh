    # Network Routing


    Setup and configuration of network interface devices and kernel routing tables.


    # ifconfig


    ifconfig [INTERFACE] ifconfig INTERFACE [AFTYPE] OPTION ... ADDRESS ...


    ifconfig is used to configure the kernel-resident network interfaces. It''s used
    primarily at boot time to enable network transport. After that, it''s usually
    needed when debugging or tuning the system.


    If no arguments are given, ifconfig displays the status of the currently active
    interfaces. If a single name of an argument is given, it displays the status of
    the given interface only. With only the -a flag, it displays the status of all
    interfaces, even those that are down. Otherwise, it configures an interface.


    The AFTYPE argument, if supplied, refers to a supported address family used for
    decoding and displaying all protocol addresses. Currently valid values for AFTYPE
    include (TCP/IP), ax25 (AMPR Radio), ddp (Appletalk Phase 2), ipx (Novell IP),
    and netrom (AMPR. NET/ROM).


    INTERFACE is the name of a network interface. This is a driver named by a unit
    number such as eth0 for the first Ethernet interface.


    Valid arguments for OPTION are described in the following table:


    | Option | Description |

    | - | - |

    | -a | Displays the status of all interfaces, even those that are down. |

    | ADDRESS | The IP address to be assigned to INTERFACE. |

