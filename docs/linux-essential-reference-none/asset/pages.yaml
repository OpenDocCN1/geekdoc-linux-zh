  md: '# Working Context


    The commands in this section display or alter aspects of the current context such
    as terminal settings, current directory, and environment variables.


    # printenv


    printenv [ VARIABLE ... ]


    printenv prints environment variable values. If no VARIABLES are specified, printenv
    prints the value of each environment variable. Otherwise, it prints the value
    of each VARIABLE that''s set, and nothing for those that aren''t. It exits with
    a status of 0 if all variables specified were found, 1 if at least one variable
    was not found, and 2 if a write error occurred.


    # pwdd


    pwdd


    pwd prints the fully resolved name of the current directory.That is, all components
    of the printed name will be actual directory names—none will be symbolic links.


    # stty


    stty [ SETTING ... ]


    stty [ OPTION ]


    stty prints or sets characteristics of the controlling terminal.Valid OPTIONS
    are as follows:


    | Option | Description |

    | -a or --save or -all | Prints all current settings in human-readable form. |

    | -g or --save | Prints all current settings in a form that can be passed to another
    stty command to restore them. |


    The possible SETTINGS are described in the following sections. Many of the values
    for SETTING can be negated (as described in the section tables) by preceding them
    with a hyphen (-).


    # Control Settings


    | Setting | Description |

    | parenb | Generates the parity bit in output and expects the parity bit in input.
    Can be negated. |

    | parodd | Sets odd parity (even if negated). |

    | cs5, cs6, cs7, cs8 | Sets character size to 5, 6, 7, or 8 bits. |

    | hup or ihopcl | Sends a hang signal when the last process closes the TTY. Can
    be negated. |

    | cstopb | Uses two bits per character (one if negated). |

    | creat | Allows input to be received. Can be negated. |

    | clocal | Disables modem control signals. Can be negated. |

    | crtscts | Enables RTS/CTS flow control. Can be negated. |'
