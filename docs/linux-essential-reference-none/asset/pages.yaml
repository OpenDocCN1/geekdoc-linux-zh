- img_proc: true
  md: '# IP Firewall Administration


    IP firewall and accounting facilities in the kernel provide mechanisms for IP
    accounting, for building firewalls based on packet-level filtering, for building
    firewalls using transparent proxy servers (by redirecting packets to local sockets),
    and for masquerading forwarded packets. The administration of these functions
    is maintained in the kernel as four separate lists, each containing zero or more
    rules. Each rule contains specific information about source and destination addresses,
    protocols, port numbers, and some other characteristics. A packet matches with
    a rule when the characteristics of the rule match those of the IP packet. These
    are the four categories of rules:


    +   Accounting. The accounting rules are used for all IP packets that are sent
    or received via one of the local network interfaces. Every packet is compared
    with all rules in this list, and every match causes an increment of the packet
    and byte counters associated with that rule.


    +   Input firewall. These rules regulate the acceptance of incoming IP packets.
    All packets coming in through one of the local network interfaces are checked
    against the output firewall rules. The first rule that matches with a packet determines
    the policy to use and also causes the rule''s packet and byte counters to be incremented.
    When no matching rule is found, the default policy for the output firewall is
    used.


    +   Output firewall. These rules define the permissions for sending IP packets.
    All packets that are ready to be sent through one of the local network interfaces
    are checked against the output firewall rules. The first rule that matches determines
    the policy to use and also causes the rule''s packet and byte counters to be incremented.
    When no matching rule is found, the default policy for the output firewall is
    used.


    +   Forwarding firewall. These rules define the permissions for forwarding IP
    packets. All packets sent by a remote host having another remote host as destination
    are checked against the forwarding firewall rules. The first rule that matches
    with a packet determines the policy to use and also causes the rule''s packet
    and byte counters to be incremented. When no matching rule is found, the default
    policy for the forwarding firewall is used.


    Each of the firewall rules contains a policy specifying what action is to be taken
    when a packet matches with the rule. Three policies are possible:


    +   accept lets the packet pass the firewall.


    +   reject refuses the packet and sends an ICMP host unreachable message back
    to the sender as notification.


    +   deny ignores the packet without sending any notification.


    For all three types of firewalls there also exists a default policy, which applies
    to all packets for none of the rules match.


    Version 2.0 and higher kernels provide ipfadm firewall support. Version 2.2 provides
    an update to ipfadm called ipchains.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# ipchains-restore


    ipchains-restore [ -f ] [ -v ]


    ipchains-restore restores firewall chains from standard output.


    | Option | Description |

    | --- | --- |

    | -f | Clear chains without asking. |

    | -v | Print the rules. |


    # ipchains-save


    ipchains-save [CHAIN] [ -v ]


    ipchains-save prints firewall chains to standard output. If CHAIN is given, only
    the named chain will print.. -v causes all rules to print.


    # ipchains


    +   - ipchains [-ADC] CHAIN RULE_SPECIFICATION [OPTION ...]

    - ipchains [-RI] CHAIN RULENUM_RULE_SPECIFICATION [OPTION ...]

    - ipchains -D CHAIN RULENUM [OPTION ...]

    - ipchains [-LFZNZ] [CHAIN] [OPTION ...]

    - ipchains -P CHAIN TARGET [OPTION ...]

    - ipchains -M [-L | -S] [OPTION ...]


    ipchains is used to set up, maintain, and inspect the IP firewall rules in the
    Linux kernel. If a packet doesn''t match the criteria, the next rule in the chain
    is examined. If it does match, the next rule is specified by the value of the
    target, which can be the name of a user-defined chain or one of the special values
    ACCEPT, DENY, REJECT, MASQ, REDIR, or RETURN. ACCEPT allows the packet through.
    DENY means to drop the packet on the floor. REJECT means the same as drop, but
    is more polite and easier to debug, since an ICMP message is sent to the sender
    indicating that the packet was dropped. DENY and ACCEPT are the same for ICMP
    packets.


    MASQ is only legal for the forwarding and user-defined chains and can be used
    only when the kernel is compiled with CONFIG_IP_MASQUERADE defined. With this
    option, packets will be masqueraded as if they originated from the local host.
    Furthermore, reverse packets will be recognized as such and demasqueraded automatically,
    bypassing the firewall.


    REDIR is only legal for the input and user-defined chains and can be used only
    when the Linux kernel is compiled with CONFIG_IP_TRANSPARE_PROXY defined. With
    this option, packets will be redirected to a local socket, even if they were sent
    to a remote host. If the specified redirection port is 0, which is the default
    value, the destination port of a packet will be the redirection port. When this
    is used, an extra argument (the port number) can be supplied.


    If an end of a user-defined chain is reached or a rule with the RETURN matches,
    the next rule in the preceding (calling) chain is examined. If the end of a built-in
    chain is reached, or a rule in a built-in chain with target RETURN matches, the
    target specified by the chain policy determines the fate of the packet.'
  merge: -1
