    library will automatically trim the given domain name from the end of any hostname
    resolved via DNS. This is intended for use with local hosts and domains. |


    # /etc/networks


    The /etc/networks file is used to map IP network addresses to network names and
    vice versa. Each line contains a network name and a network address. The fields
    are separated by spaces or tabs. Comments start with # and blank lines are ignored.


    Example entries:


    ```

    # local network

    localnet 127.0.0.0

    myhost.mydomain.net 191.72.2.0

    ```


    # Diskless Client Support


    The Internet Bootstrap Protocol (BOOTP) enables diskless workstations to boot
    themselves with the help of central servers.


    # bootparamd and rpc.bootparamd


    ```

    rpc.bootparamd [-d] [-s] [-r ROUTER] [-f FILE]

    ```


    bootparamd is a server that provides boot-related information to diskless clients.
    It gets the information it needs from /etc/bootparams by default.


    | Option | Description |

    | --- | --- |

    | -d | Displays debugging information. |

    | -f FILE | Uses FILE instead of /etc/bootparams as the boot parameter file. |

    | -r ROUTER | ROUTER is the hostname or IP address of the default router. The
    default is the machine running the server. |

    | -s | Logs the debugging information to syslog. |'
