- img_proc: true
  md: '# Network Administration: pppp 25


    | Option | Description |

    | asyncmap MAP | Sets the async character map to MAP. This map describes which
    control characters can''t be received successfully over the serial line. pppp
    will ask the peer to send these characters as a two-byte escape sequence. The
    argument is a 32-bit hex number with each bit representing a character to escape.
    Bit 0 (00000001) represents the character 0x00; bit 1 (00000010) represents the
    character 0x1f or _. If multiple asyncmap options are given, the values are combined
    with OR. If no asyncmap option is given, no async character map will be negotiated
    for the receive direction. The peer should escape all control characters. |

    | auth | Requires the peer to authenticate itself before allowing network packets
    to be sent or received. |

    | call NAME | Reads options from the file /etc/ppp/peers/NAME. The string name
    can''t begin with / or include .. as a pathname component. |

    | connect SCRIPT | Uses the executable or shell command specified by SCRIPT to
    set up the serial line. This script would typically use the chat program to dial
    the modem and start the PPP session. |

    | crtscts | Uses hardware flow control to control the flow of data on the serial
    port. |

    | defaultroute | Adds a default route to the kernel routing table, using the peer
    as the gateway, when IPCP negotiation is successfully completed. This entry is
    removed when the PPP connection is broken. |

    | disconnect SCRIPT | Runs the executable or shell command specified by SCRIPT
    after pppp has terminated the link. |

    | escape CHARS | Specifies that certain characters should be escaped on transmission,
    regardless of whether the peer requests them to be escaped with its async control
    character map. CHARS is a list of hex numbers separated by commas. |

    | file NAME | Reads options from the file NAME. |

    | lock | Specifies that pppp should create a UUCP-style lock for the serial device
    to ensure exclusive access to the device. |

    | mru N | Sets the Maximum Receive Unit (MRU) value to N. pppp will ask the peer
    to send packets of no more than N bytes. The minimum MRU value is 128. |

