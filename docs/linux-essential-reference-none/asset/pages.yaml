  md: '# 4

    Programming


    This chapter describes tools used in developing and debugging binary files containing

    executable programs as well as relocatable and executable libraries.


    # Processing Source Files


    This section describes the use of the C and C++ compilers.


    # gcc and g++


    ```

    cc [ OPTION ; FILENAME ] ...

    gcc [ OPTION ; FILENAME ] ...

    g++ [ OPTION ; FILENAME ] ...

    ```


    gcc and g++ are, respectively, the C and C++ compilers. On Linux systems, gcc

    c (the "compiler controller") are synonyms.They process the files given using
    the

    FILENAME arguments through one or more of stages:


    +   - Preprocessing. Takes care of other files #included in FILENAME and expands

    any macros referenced in FILENAME.


    +   - Compilation. Conversion of preprocessed C or C++ source to assembly

    language code.


    +   - Assembly. Conversion of assembly code to relocatable binary object code.


    +   - Linking. Relocatable binaries are combined to form executable programs or

    shared libraries.


    # Source-File Suffixes


    The source-file suffixes indicate which type of processing should be done:


    | Suffix | Processing |

    | --- | --- |

    | .c or .C | Preprocesses, compiles, and assembles a C source. |

    | .cc or .cxx | Preprocesses, compiles, and assembles a C++ source. |

    | .m | Preprocesses, compiles, and assembles an Objective C source. |


    continues >>'
  merge: -1
  pgno: 100
