  md: '# slattach


    slattach [-dehlMcnqv] [-c COMMAND] [-p PROTO] [-s SPEED] [TTY]

    slattach will attach a device (typically modems) to a network interface. This
    enables the device to drive a point-to-point link to another computer.


    | Option | Description |

    | -c COMMAND | Executes COMMAND when the line is hung up. This can be used to
    run scripts or reestablish connections when a link goes down. |

    | -d | Enables debugging output. Useful when determining why a given setup doesn''t
    work. |

    | -e | Exits right after initializing the device, instead of waiting for the line
    to hang up. |

    | -h | Exits when the carrier is lost. This works on both /dev/tty and /dev/cua
    devices by monitoring the carrier status every 15 seconds. |

    | -L | Enables three-wire operation. The terminal is moved to CLOCAL mode, when
    carrier is disabled. |

    | -l | Creates a UUCP-style lockfile for the device in /var/lock |

    | -m | Don''t initialize the line into 8-bit raw mode. |

    | -n | Disables access to the device. Equivalent to mesgn. |

    | -p PROTO | Uses protocol on the line. Other possible values are slip (normal
    SLIP), adaptive (adaptive CLIP/SLIP), ppp (Point-to-Point Protocol) and kiss (a
    protocol used for communicating with AX.25 packet-radio terminal-node controllers).
    |

    | -q | Quiet mode. No messages at all. |

    | -s SPEED | Sets line mode to SPEED. |

    | TTY | Attaches TTY. If not supplied, the current terminal line is used. |

    | -v | Enables verbose mode. |


    # Remote Procedure Calls


    When managing the Remote Procedure Call (RPC) facility, it may be useful to note
    that some of the services (such as NFS) are based on RPC. Most of the filenames
    for the daemons provide RPC-based services begin with rpc.


    # pmap_dump


    pmap_dump

    pmap_dump prints a list of all registered RPC programs that are running on the
    local host. The output can be used as input to pmap_set to restart the portmapper.


    # pmap_set


    pmap_set

    pmap_set is used to restart the RPC portmapper and restore its registry. It reads
    registry information from standard input in the format produced by pmap_dump.'
