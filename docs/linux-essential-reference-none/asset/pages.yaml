    # File Information


    This section describes commands that list information about files.


    # dir


    ```

    dir [ ARG ... ]

    ```


    dir lists information about each file named on the command line. When invoked
    without arguments, dir is equivalent to ls -C. By default, files are listed in
    vertically sorted columns. For a complete description of the valid options for
    dir, see the description of the 1s command.


    # dircolors


    ```

    dircolors [ OPTION ... ] [ FILE ]

    ```


    dircolors outputs a sequence of shell commands that can be used to set up the
    terminal so the output from ls and the other directory-listing commands is color-coded.
    If FILE is specified, dircolors reads it to determine which colors to use for
    file types and extensions. Otherwise, a precompiled database is used. The output
    is a command to set the LS_COLORS environment variable. The best way to use dircolors
    is to directly evaluate its output in the bash command:


    ```

    dircolors

    ```


    A suggested addition to /etc/profile would be:


    ```

    eval dircolors

    ```


    ```

    alias ls=ls --color=auto

    ```


    This would allow ls to display color-coded directory listings.'
