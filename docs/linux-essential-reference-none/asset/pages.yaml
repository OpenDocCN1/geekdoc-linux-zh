    # Backup Options


    Some of the programs described in this section optionally make backup copies of
    files before writing new versions. The following table describes the options that
    control the implementation of these backups.


    | Option | Description |

    | --- | --- |

    | -b or --backup | Makes backups of files that are about to be overwritten or
    removed. Without this option, the original versions are destroyed. |

    | -S SUFFIX or --suffix=SUFFIX | Appends SUFFIX to each backup file made with
    -b. If this option is not specified, the value of the SIMPLE_BACKUP_SUFFIX environment
