  md: '# Filesystems: mount 245


    | Option | Description |

    | --- | --- |

    | -o OFFSET | --Use DES encryption, DES encryption is available only if the optional
    DES encryption package has been added to the kernel. DES encryption uses an additional
    start value that''s used to protect passwords against dictionary attacks.<br>The
    data start is moved OFFSET bytes into the specified file or device. |


    # mount


    ```

    mount [ -HV ]

    mount a [ -Ffnrvw ] [ -t VFTYPE ]

    mount [ -fnrvw ] [ -o OPTIONS { DEVICE; DIR }]

    mount [ -fnrvw ] [ -t VFTYPE ] [ -o OPTIONS ] DEVICE DIR

    ```


    All files accessible in a UNIX system are arranged in a tree rooted at /. These
    files can be spread over several devices. The mount command serves to attach the
    filesystem found on some device to the file tree. Most devices are indicated by
    a filename of a block device such as /dev/sda1, but there are other possibilities.
    For example, in the case of an NFS mount, the device may look like ftp.digital.com:/archive.


    The file /etc/fstab may contain lines describing which devices are usually mounted
    using which options. The mount command is used in three ways:


    +   - The command mount -a [ -t TYPE ] (usually given in a boot script) causes
    all filesystems mentioned in fstab (of the proper type) as indicated, except for
    those containing the noauto keyword. Adding the -F option makes mount fork, so
    that the filesystems are mounted simultaneously.


    +   - When mounting a filesystem mentioned in fstab, giving only the device or
    the mount point is sufficient.


    +   - Normally, only the superuser can mount filesystems. However, when fstab
    contains the user option on a line, anybody can mount the corresponding system.


    The programs mount and umount maintain a list of currently mounted filesystems
    in the file /etc/mtab. If no arguments are given to mount, this list is printed.


    The full set of options for any invocation of mount is determined by first extracting
    the options for the filesystem from the fstab table, applying any options specified
    by the -o argument, and finally applying the -r or -w option, when present.


    | Option | Description |

    | --- | --- |

    | -a | Mounts all filesystems of the given types mentioned in fstab. |

    | -F | Forks off a new invocation of mount for each device. This will do the mounts
    on different devices or different NFS servers in parallel. |


    continues >>'
