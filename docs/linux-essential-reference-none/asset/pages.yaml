  md: '# yes


    yes [ STRING ]


    yes prints the command-line arguments, separated by spaces and followed by a newline,
    running forever until it''s killed. If no arguments are given, yes prints followed
    by a newline forever until killed. The STRING arguments can consist of any arbitrary
    character string.


    # Conditions


    The commands in this section perform simple arithmetic operations and execute
    conditional tests. They''re used mainly to control the flow of execution in shell
    scripts.


    # expr


    expr ARG ...


    expr considers its arguments to be operators and operands. It evaluates the set
    of command-line arguments as an expression and writes the result to standard output.
    Expressions and subexpressions can be integers or strings. Type conversions are
    made as necessary for compatibility with the operators to be applied. Type conversions
    that are necessary but impossible result in errors. expr will exit with a status
    of 0 for nonzero or non-null result, 1 for a zero and 2 for an invalid expression.


    The following table shows the operators (in order of increasing precedence):


    | Symbol | Description |

    | --- | --- |

    | ! | Relational OR. |

    | & | Relational AND. |

    | <, >, ==, <=, >=, != | Comparison operations. = and == are equivalent. |

    | +, - | Addition and subtraction. |

    | *, /, % | Multiplication, division, modulus. |

    | : | Pattern matching. The first argument is matched against the regular expression
    in the second argument. |


    The following functions can be used:


    | Syntax | Description |

    | --- | --- |

    | match STRING REGEXP | expr match STRING REGEXP is equivalent to expr STRING
    : REGEXP, where STRING is matched against the pattern specified by the regular
    expression REGEXP. For more information on regular expressions, see Appendix A
    "Regular Expressions." |

    | substr STRING POSITION LENGTH | Returns the substring of STRING beginning at
    POSITION with length at most LENGTH. |


    continues >>'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Shell Utilities: expr


    >>continued


    | Syntax | Description |

    | index STRING CHARACTER-CLASS | Returns the first position of STRING where the
    first character in CHARACTER-CLASS is found. Returns 0 if not found. |

    | length STRING | Returns the length of STRING. |


    For example, this command:

    expr 5 ''*'' 3 + 2


    prints the result 17 on standard output. Note that all components of the expression
    (including parentheses) must be separated. Quotes are needed for some shells (such
    as bash) to make sure that the multiplication operator * isn''t expanded into
    a list of filenames.


    Parentheses can be used to override the standard operator precedence, as in the
    following command:

    expr 5 ''* ''('' 3 + 2 )''


    In addition to the * symbol, quotes may be necessary around the parentheses as
    well (bash, for example, will attempt to execute a subshell otherwise).

    Boolean expressions yield either ⌈ for false or 1 for true. For example, both
    of the following will print 1:


    ```

    expr 1 |= 2

    expr 1 ''<='' 2

    ```


    = needs to be in quotes for any shells that use < for input redirection (similarly
    for >).


    Pattern matching also outputs Boolean ⌈ or 1 results:


    ```

    expr a : [a-z]

    ```


    prints 1 and

    expr 1 : [a-z]

    prints ⌈.


    For information on regular expressions, see Appendix A.


    # false


    false


    false does nothing except an exit status of 1, meaning failure.


    # test


    ```

    test { EXPRESSION }

    ```


    test returns an exit status of ⌈ (true) or 1 (false), depending on the evaluation
    of the expression formed from its arguments. Each part of the expression must
    be a separate argument.'
  merge: -1
