  md: '# System Context


    These commands print or change system-wide information.


    # date


    date [ OPTION ... ] [FORMAT]

    date [ -u | --utc | --universal ] [ MMDDHMM [ CC] YY ] [ .SS ]

    date can be used to print the current time and date according to FORMAT or to
    set the system clock. The following sections describe the available options and
    formats.


    # Options


    | Option | Description |

    | --- | --- |

    | -d DATESTR or --date=DATESTR | Displays the time and date in DATESTR instead
    of the current time date. |

    | -f DATEFILE or --file=DATEFILE | Formats each line in DATEFILE and displays
    it as the -d option. |

    | --rfc-822 | Displays the time and date using the RFC 822-specified format, %a,
    %d %b %Y%H:%M:%S If --utc is also used, uses GMT (Greenwich Mean Time) in place
    of %z. |

    | -r FILE or --reference=FILE | Displays the last modification time and date of
    FILE. |

    | -s DATESTR or --set=DATESTR | Sets the time and date to DATESTR. |

    | -u or --utc or --universal | Prints or sets the time and date in Universal Coordinated
    Time. |


