  md: '# Network Administration: mount and rpc.mount


    | Option | Description |

    | -d or --debug | Logs each transaction verbously to standard error. By default,
    log output is sent to syslog unless mount runs in the foreground. |

    | -F or --foreground | mount runs from the terminal when given this option. If
    debugging is requested, output will be sent to standard error. |

    | -f FILE or --exports-file FILE | Uses FILE for /etc/exports. |

    | -h or --help | Provides a help summary. |

    | -n or --allow-non-root | Allows incoming mount requests to be honored even if
    they do not originate from root IP ports. |

    | -P PORTNUM or --port PORTNUM | Listens on port PORTNUM. By default, mount will
    listen on the mount/udp port in /etc/services. If undefined, it will use some
    random port 1024. |

    | -p or --promiscuous | Serves any host on the network. |

    | -r or --re-export | Allows imported NFS or SMB filesystems to be exported. |

    | -v or --version | Reports the current version number. |


    # nfsd and rpc.nfsd


    rpc.nfsd OPTION ... [ NUMPIES ]


    nfsd is an NFS service daemon that handles client filesystem requests. Unlike
    some other systems, nfsd operates as a normal user-level process. The server also
    differs from other NFS server implementations in that it mounts an entire file
    hierarchy not limited by the boundaries of physical filesystems. The implementation
    allows the clients read-only or read-write access to the file hierarchy of the
    server machine.


    nfsd is usually started at boot time. It can also be invoked by inetd. This can
    be enabled by adding the following two lines to /etc/inetd.conf:

    nfs/2 dgram rpc/udp wait root /usr/sbin/rpc.nfsd rpc.nfsd

    nfs/2 stream rpc/tcp wait root /usr/sbin/rpc.nfsd rpc.nfsd


    NUMPIES enables running of multiple instances of nfsd in parallel. If NUMPIES
    is greater than 1, nfsd will fork to NUMPIES - 1 times. Because the servers don''t
    share a common file-handle cache, nfsd will disallow all operations when invoked
    with this option.


    nfsd also supports the WebNFS protocol. WebNFS is an extension to NFS that enables
    file retrieval by Web browsers. To support this, the -R or --public-root sets
    are relative. The public root directory must also be named in /etc/exports.'
  merge: -1
