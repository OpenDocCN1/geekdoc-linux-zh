    # Process Handling


    This section describes commands used by bash processes when interacting with other
    processes.


    # kill


    ```

    kill [-s SIGSPEC] [-n SIGNUM] [-SIGSPEC] [PID [| JOB]] ...

    kill -1 [SIGSPEC ... ]

    ```


    kill sends the processes named by PID (or JOB) the signal SIGSPEC or SIGNUM. SIGSPEC
    is a symbolic name; SIGNUM is a number. The -n or -s switch can be used to indicate
    to kill which form is being used. If SIGSPEC is not present, SIGTERM is assumed.
    An argument of -1 lists the signal names. Arguments following -1 are assumed to
    be signal numbers for which names should be listed. kill is a shell built-in for
    two reasons: It allows job IDs to be used instead of process IDs, and if the limit
    on processes that can be created has been reached, a new process doesn''t have
    to be started to kill another one. For more information on signals, see the section
    “Signals” in Chapter 7.


