  md: '# Network Administration: bootparamd and rpc.bootparamd 209


    | Keyword | Description |

    | --- | Specifies the order in which host lookups are done. It should be followed
    by, comma-separated list of lookup methods.Valid methods are bind, hosts, and
    nis. |

    | reorder | Valid values are on and off. If set to on, the resolver will attempt
