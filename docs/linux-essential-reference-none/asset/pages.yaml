    # Makefiles


    The activities of make are directed by a makefile that''s typically named makefile
    or

    Makefile, although other names can be specified using the -f or --file command

    option. The makefile can contain statements of several types:


    +   - Explicit rules. An explicit rule lists the target file to be built, the
    files on which

    target depends, and the commands to build the target.


    +   - Implicit rules. An implicit rule states when and how to remake a class of
    files

    base on their names.


    +   - Variable definitions. A variable definition specifies a variable name and
    a text

    string to substitute for it when the name is referenced.


    +   - Directives. Directives are special instructions for make. These include
    conditional

    statements, inclusions from other makefiles, and defining multiple-line values
    for

    variables.


    +   - Comments. A # in a line starts a comment; and the text that follows it are

    ignored.


    # Sample Makefile Statements


    This explicit rule compiles source.c into object.o if either source.c or defs.h
    is

    newer than object.o:


    ```

    object.o : source.c defs.h

    → -cc source.c -o object.o

    ```


    The following example illustrates the use of an implicit rule:

    prog : object1.o object2.o

    → -cc prog object1.o object2.o


    If no other rules exist how to build object1.o and object2.o, these would

    typically be built from object.c and object2.c using the C compiler if they exist
    or

    can be built.


    The preceding example could be rewritten using a variable definition:

    OBJS = object1.o object2.o

    prog : $(OBJS)

    → -cc prog $(OBJS)


    A complete description of makefiles is beyond the scope of this book. For more

    information, consult the sources of information listed in Appendix C, "Web

    Resources."


