    # ping


    ping OPTION ... HOST


    ping uses the ICMP protocol''s mandatory ECHO_REQUEST datagram to elicit an ICMP
    ECHO_RESPONSE from a host or gateway designated by HOST.

    If ping doesn''t receive any packets at all, it will exit with code 1. On error,
    it exits with code 2. Otherwise, it exits with code 0. This makes it possible
    to use the exit code to see whether a host is alive.


    | Option | Description |

    | --- | --- |

    | -c COUNT | Stops after sending and (receiving) COUNT ECHO_RESPONSE packets.
    |

    | -d | Sets the SO_DEBUG option on the socket being used. |

    | -f | Floods ping. Outputs packets as fast as they come back or 100 times per
    second, whichever is greater. For every ECHO_REQUEST sent a period (.) is printed,
    while ECHO_REPLY received a backspace is printed. This provides a clear indication
    of how many packets are being dropped. This option should be used with caution,
    since it can cause a great deal of stress on a network. |

    | - WAIT | Waits seconds between sending packets. The default is to wait for one
    second between packets. This option is incompatible with the -f option. |

    | PRELOAD | Sends PRELOAD packets as fast as possible before falling into normal
    mode of operation. Only the superuser can use this option. |'
