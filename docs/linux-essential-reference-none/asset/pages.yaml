    # The /proc filesystem


    The /proc filesystem is a virtual filesystem that makes internal data maintained
    by the kernel available to user processes. The files under the /proc directory
    appear as files to user programs but function as portals into kernel data structures.
    Most of these files export data in ASCII format and, as a result, can be used
    by shell programs.

    For example, if a user wants to know the characteristics of the machine''s CPU,
    the following command can be issued:


    cat /proc/cpuinfo


    ```

    processor : 0

    cpu : 686

    model : 3

    vendor_id : GenuineIntel

    stepping : 4

    fdiv_bug : no

    hlt_bug : no

    f0f_bug : no

    fpu : yes

    fpu_exception : yes

    cpuid : yes

    wp : yes

    flags : fpu vme de pse tsc mr pae cx8 11 mtrr pse mca ov mmx

    bogomips : 264.60

    ```'
