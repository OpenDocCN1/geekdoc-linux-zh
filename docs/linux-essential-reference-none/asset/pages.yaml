  md: '# General Process Control


    This describes commands that send signals to processes, change scheduling priorities,
    and display the system''s load status.


    # kill


    ```

    kill [ -SIGNAL ] PID ...

    kill [ -1 ]

    ```


    kill sends a signal to processes specified by the PID arguments. SIGNAL can be
    either a symbolic name or a signal number. A list of valid signal names and numbers
    can be obtained using the -1 flag. If no signal is specified, kill will send SIGTERM
    (software termination).


    The kill command is often used to terminate processes that are out of control
    and don''t exit themselves. Although SIGTERM is the default, SIGKILL can be used
    when SIGTERM does not work. Because SIGKILL cannot be caught or ignored, it will
    always terminate the process. However, for the same reason, it cause processes
    to exit without performing cleanup operations such as removing temporary work
    files or saving in progress. Therefore, SIGKILL should be used only if the process
    doesn''t respond to SIGTERM.


    Another common use for the kill command is to tell daemons to reinitialize themselves.
    Daemons often use SIGHUP by convention to indicate that their configurations should
    be reloaded.


    See the earlier section "Signals" for more information on signals and their meanings.


    # renice


    ```

    renice PRIORITY [ PROCESS ... ]

    ```


    renice alters the scheduling priority of one or more running processes. PROCESS
    is one of the following:


    ```

    ID ... Interpret as a process ID.

    -g ID ... Interpret as a group ID.

    -p ID ... Interpret as a process ID.

    -u ID ... Interpret as a user ID.

    ```


    ID and -p ID are the same. If the flag isn''t given, the ID is interpreted as
    a process ID.'
  merge: -1
  pgno: 180
