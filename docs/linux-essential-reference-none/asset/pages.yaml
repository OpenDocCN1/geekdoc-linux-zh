- img_proc: true
  md: 'SCRIPT defines the communications. It consists of one or more "expect-send"
    pairs of strings, separated by spaces, with an optional "subpect-subsend" string
    pair, separated by a hyphen, in the following example:


    ```

    ogin: BREAK-ogin: ppp ssword: mypassword

    ```


    This line indicates that chat will expect the string login:: If it fails to receive
    a login prompt within the time interval, it will send a break sequence to the
    remote and then expect the string login::. If the first login: is received, the
    break sequence is not generated.


    After it receives the login prompt, chat will send the string ppp and then expect
    the prompt for ssword:: When it receives the prompt for, it will send the password
    mypassword.


    For chat to work, TCP/IP networking must be enabled in the kernel, along with
    PPP network device support.


    | Option | Description |

    |---|---|

    | -e | Starts with the echo option turned on.When echoing is enabled, all output
    from the mode is echoed to standard error. |

    | -f CHAT_FILE | Reads the chat script from CHAT_FILE. |

    | -r REPORT_FILE | Sets the file for output of the report strings. The REPORT
    keyword is used in the script, the resulting strings are written to this file.
    If this option isn''t used and REPORT keywords are used, the standard error file
    is used for the report strings. |

    | -S | Don''t use syslog. (By default, error messages are sent to syslog.) |

    | -s | Sends all log messages and error messages from -v to standard error. |

    | -T PHONE_NUMBER | Substitutes PHONE_NUMBER for the \T metacharacter in a send
    string. This is usually a phone number. |

    | -t TIMEOUT | Sets the timeout interval for expected strings to be received.
    |

    | -U PHONE_NUMBER | Substitutes PHONE_NUMBER for the \U metacharacter in a string.
    This is useful when dialing an IDS terminal requires two numbers. |

    | -v | Executes the script in verbose mode. Logs the execution state of the chat
    script. The default logging method is through syslog, although it can be altered
    with the -S and -s flags. |

    | -V | Standard error verbose mode. Logs the execution state of the chat script
    through standard error. |


