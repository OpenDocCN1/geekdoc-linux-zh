  md: '# Network Administration: /etc/services


    Each entry is of this form:


    ```

    SERVICE_NAME PORT/PROTOCOL { ALIAS ... }

    ```


    SERVICE_NAME is the name by which the service is known and looked up. PORT is
    the type decimal number of the port that will use the service. PROTOCOL is the
    type of protocol used. This value should match one of those found in /etc/protocols.
    Typical values include tcp and udp. The ALIASes are other names for the same service.


    Sample entries:


    ```

    ftp     21/tcp

    smtp 25/tcp mail

    ```


    # Diagnostic and Monitoring Tools


    This section describes tools that can be used to investigate network problems
    and measure network performance.


    # fping


    ```

    fping [ OPTION ... ] [ SYSTEM ... ]

    ```


    fping uses Internet Control Message Protocol (ICMP) echo requests to determine
    whether one or more hosts is reachable. The target hosts are named on the command
    line or read from a file (standard input). Unlike ping, the output of fping is
    suitable for automated processing by shell scripts. Exit status is 0 if all the
    hosts are reachable, 1 if some hosts were unreachable, 2 if any IP addresses are
    found, 3 for invalid command-line arguments, and 4 for a system call failure.


    | Option | Description |

    | --- | --- |

    | -A | Displays targets by IP address rather than DNS name. |

    | -a | Shows times that are alive. |

    | -b N | In the default mode, fping sends requests to a target before giving up,
    waiting for a reply on each successive request. The parameter is the value by
    which the time is multiplied on successive request. It must be entered as a floating-point
    number. The default is 1.5. |

    | -b N | Number of bytes in each packet to be sent. The minimum size (normally
    12) allows for the data that fping needs to do its work (sequence number, timestamp).
    The received data size includes the IP header (20 bytes) and ICMP header (8 bytes),
    so the minimum total size is 40 bytes. The default is 56, as in ping. |

    | -C N | Similar to -c except that the statistics are displayed in a format designed
    for response time analysis. |

    | -c N | Number of requests to send to each target. With this option, a line is
    displayed for each received response (this can be suppressed with -q or -Q). Statistics
    about responses for each target are displayed when all requests have been sent.
    |

    | -d | Uses DNS to find hostnames for IP addresses. This allows you to use fping
    a list of IP addresses as input and print hostnames in the output. |

    | -e | Shows elapsed round-trip time for packets. |'
  merge: -1
