    # Reporting Space Usage


    This section describes commands that control disk space usage and availability.


    # df


    df [ OPTION ... ] [ FILE ... ]

    def reports the amount of used and available disk space on filesystems. With no
    arguments, df reports used and available space on all currently mounted filesystems.
    Otherwise, df reports on the filesystems associated with each FILE.

    If a system is mounted to FILE, df shows space usage for that filesystem. Otherwise,
    df shows space usage for the filesystem containing that file.

    Disk space is shown in 1024-byte blocks by default, unless the environment variable
    POSIX_CORRECT is set, in which 512-byte blocks are used (unless the -k option
    is given).


    | Option | Description |

