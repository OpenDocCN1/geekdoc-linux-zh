    # Position Descriptions


    A has a form f.c where f is the number of the field to use and c is the number
    of the first character from the beginning of the field (+POS) or from the end
    of the previous field (-POS). The .c part can be omitted, in which case it''s
    taken to be the first character in the field. If the -b option has been given,
    the .c part is counted from the first nonblank character of the field (+POS) or
    from the first nonblank character following the previous field (-POS).


    A +POS or -POS argument can also have any of the global ordering letters M, b,
    d, f, i, or r appended. In these cases, the global ordering options are overridden
    for that specific field. Keys can span multiple fields.


