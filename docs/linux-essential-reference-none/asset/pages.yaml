    \ idle an hour or more aren't counted unless the -a flag is given. |\n -l | Sorts\
    \ by load average. |\n -r | Reverses the sort order. |\n -t | Sorts by uptime.\
    \ |\n -u | Sorts by the number of users. |\n\n# rusers\n\nrusers [ OPTIONS ...\
