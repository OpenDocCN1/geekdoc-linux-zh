    the environment variable POSIX_CORRECT. |

    | -m or --megabytes | Reports sizes in megabytes (1024-byte blocks). |

    | --no-sync | Don''t invoke the sync system call before getting any usage data.
    This is the default. |

    | -P or --portability | Use the POSIX output format. This will generate one line
