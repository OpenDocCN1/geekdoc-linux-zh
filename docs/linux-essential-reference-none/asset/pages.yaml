  md: '# Filesystems: mkfs


    # # mkfs


    mkfs [ -V ] [ - FSTYPE ] [ FS_OPTIONS ] FILESYS [ BLOCKS ]


    mkfs is used to build a Linux filesystem on a device—usually a hard disk partition.
    FILESYS is either the device name (for example, /dev/hda1 or /dev/sdb2) or the
    mount point (for example, /,usr, /home) for the filesystem. BLOCKS is the number
    of blocks to be used for the filesystem.


    mkfs returns exit code 0 on success and 1 on failure.


    mkfs is actually a front end for the various filesystem builders (mkfs.FTYPE).
    The filesystem-specific builder is searched for in /sbin/fs first, then in /sbin,
    and finally in the directories listed in the PATH environment.


    | Option | Description |

    | -v | Produces verbose output, including all filesystem-specific commands that
    are executed. Specifying this option may inhibit execution of any filesystem-specific
    commands. |

    | -t FTYPE | Specifies the type of filesystem to be built. If not specified, the
    type is deduced by searching for FILESYS in /etc/fstab and using the corresponding
    entry. If the TYPE can''t be deduced, the default filesystem type (currently minimax)
    is used. |

    | FS_OPTIONS | Filesystem-specific options to be passed to the real filesystem
    builder. Although not guaranteed, the following options are supported by most
    builders: |


    +   - c checks the device for bad blocks before building the filesystem.

    -1 FILENAME reads the bad blocks from FILENAME.

    -v produces verbose output.


    # # Accessing Filesystems


    This section describes commands used to enable and disable access to filesystems.


    # # losetup


    ```

    losetup [ -e ENCRYPTION ] [ -o OFFSET ] LOOP_DEVICE FILE

    losetup [ -d ] LOOP_DEVICE

    ```


    losetup is used to associate loop devices with regular files, to detach loop devices,
    and to query the status of a loop device. If only the LOOP_DEVICE argument is
    given, the status of the corresponding loop device is shown.


    | Option | Description |

    | -d | Detaches the file or device associated with the specified loop device |

    | -e ENCRYPTION | Enables data encryption. The following keywords are recognized:
    |


    NONE—Use no encryption (the default).

    XOR—Use simple XOR encryption.'
