    | --- | --- |

    | h | Leave out headings. |

    | r | Running processes only. |

    | n | Numeric output for USER and WCHAN. |

    | XX | Show processes with controlling TTY XX. For XX you can use either the name
    of a device file under /dev or that name with either tty or cu sliced. |

    | OKEYLIST | Order process listing according to the multilevel sort specified
    by KEYLIST. KEYLIST is a concatenated, separated list of keys. Each key can be
    preceded by + or -. The + makes no difference; - reverses the direction of the
    sort. Valid key values can be obtained using the -help option. |

    | --sortKEYLIST | Equivalent to OKEYLIST. |

    | --version | Display the ps version number. |


    # top


    top [ OPTION ... ]

    top provides a periodically updating display of the most CPU-intensive processes
    on the system. top also provides an interactive interface for manipulating processes.
    For a description of the information provided by top, see the earlier section
    "Field"

    Descriptions for ps Output


    # Command-Line Options for top


    The following table describes command-line options for top.


    | Option | Description |

    | --- | --- |

    | d | Specifies the delay between screen updates (in seconds). |

    | q | Causes top to refresh without any delay. |

    | s | Specifies cumulative mode, where each process is listed with the CPU time
    spent by the process as well as its dead children. |

    | s | Runs in secure mode. This disables the potentially dangerous use of interactive
    commands. |

    | i | Ignores any idle or zombie processes. |

    | c | Displays the command line instead of the command name only. |


    # Interactive Commands for top


    The following table describes interactive commands for use within top.


    | Command | Description |

    | --- | --- |

    | space | Pressing the spacebar immediately updates the display. |

    | Ctrl+L | Erases and redraws the screen. |

    | h ? | Displays a help screen giving a brief summary of commands and the status
    of secure and cumulative modes. |

    | k | Kills a process. Prompts for a PID and a signal to send. |


    continues >>'
