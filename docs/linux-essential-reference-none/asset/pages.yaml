    # tar


    tar OPTION ... [ NAME ] tar is used to store files in an archive, to extract them
    from an archive, and to accomplish other types of archive manipulations. The primary
    argument to tar, the "operation," specifies which action to take. The other arguments
    to tar are either "options," which change the way tar performs an operation, or
    filenames or members on which tar is to act. Arguments can be given in any order,
    although the main operation is usually first. Each NAME is interpreted as an archive
    member name when the main command is --compare (--diff,d), --delete, --extract
    (-get,-x), --list (-t), or --update (-u). When naming archive members, the name
    of the archive member must be given, as is printed by --list (-t). For --append
    (-r) and --create (-c), the name arguments specify the names of files or directory
    hierarchies to place in the archive. These must already exist in the filesystem
    prior to the execution of tar interprets relative filenames as relative to the
    working directory. tar makes all filenames relative (by removing leading slashes
    when archiving or restoring files), unless otherwise specified by using the --absolute-names
    (-P) option. If a directory is given as either filename or member name, tar acts
    recursively on all the files and directories beneath that. For example, the name
    identifies all the files and directories to tar.


