    # vipw and vigr


    ```

    vipw [ -s ]nvigr [ -s ]

    ```


    vipw and vigr enable manual editing of the password and group files, respectively:
    The -s option causes the corresponding shadow files to be edited. The programs
    invoke the selected text editor and set appropriate locks to prevent file corruption.
    When looking for an editor, the programs first try the environment variable VISUAL,
    then the environment variable EDITOR, and finally the default editor vi.


