  md: '# Day of Week


    Naming a day of the week will forward the date if necessary to reach that day
    of week in the future. The day of the week can be spelled out in full or abbreviated
    using the first three letters, optionally followed by a period. The special abbreviations
    tues for tuesday, wednes fornesday, and thor for thursday are also allowed.


    A number can precede a day of week item to move forward supplementary weeks. It''s
    best used in expressions as third Monday. In this context, last DAY or next DAY
    is also acceptable, moving one week before or after the day that DAY by itself
    represent.


    A comma following a day of week item is ignored.


    # Relative Items


    Relative items such as 2 days or 1 year ago adjust a date forward or backward.
    If more than one relative item is given, the values accumulate.


    The unit of time displacement can be selected by the string year or month for
    moving by years or months. These are fuzzy units, as years and months are not
    all of equal duration. More precise units are fortnight (which is 14 days), week
    (7 days), day (worth 24 hours), hour (worth 60 minutes), minute or min (60 seconds),
    and second or sec (which one second). The s suffix on units is accepted and ignored.


    The unit of time can be preceded by a multiplier, given as an optionally signed
    number. Unsigned numbers are taken as positively signed. No number at all implies
    1 for multiplier. Following a relative item with the string ago is equivalent
    to preceding the unit by a multiplier with value -1.


    The strings now and today are relative items corresponding to zero-valued time
    displacement. These strings come from the fact that a zero-valued time displacement
    represents the current time when not otherwise changed by previous items. The
    string also has the meaning of a zero-valued time displacement, but is preferred
    in date strings like this thursday.


    When a relative item makes the resulting date cross the boundary between DST and
    non-DST (or vice versa), the hour is adjusted according to the local time.


    # Pure Numbers


    The exact interpretation of pure decimal numbers is dependent on the context within
    the date string:


    +   - If the decimal number is of the form YYYYMMDD and no other calendar date
    item appears before it in the date string, YYYY is read as the year, MM as the
    month number, and DD as the day of the month for the specified calendar date.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '+   If the decimal number is of the form HHMM and no other time of day item
    appears before it in the date string, HH is read as the hour of the day and MM
    as the minute of the hour for the specified time of day. MM can also be omitted.


    +   If both a calendar date and a time of day appear to the left of a number in
    the date string, but no relative item, the number overrides the year.'
  merge: -1
