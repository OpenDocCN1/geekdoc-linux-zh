  md: '# 12

    Filesystems


    The term *filesystems* refers to collections of files stored on disk volumes.
    This chapter describes the management of filesystems. The volume format most often
    used on Linux systems is the *Second Extended File System*, otherwise known as
    *ext2fs*. For more information on ext2fs, see the references in Appendix C,“Web
    Resources.”


    # The Linux Filesystem Hierarchy Standard


    The Linux Filesystem Hierarchy Standard is based on the *Filesystem Hierarchy
    Standard (FHS)*. The FHS consists of a set of requirements and guidelines for
    file and directory placement under UNIX-like operating systems. It should be noted
    that the FHS is a guideline only, and the level of conformance may vary from one
    distribution to another. For more information, consult Appendix C.


    # The Root Filesystem


    | Directory | Description |

    | --- | --- |

    | /bin | Essential user command binaries by all users. |

    | /boot | Static files for the boot loader. |

    | /dev | Device files. |

    | /etc | Host-specific system configuration. |

    | /etc/X11 | Configuration for the X Window system. |

    | /etc/opt | Configuration files for /opt. |

    | /home | User home directories (optional). |

    | /lib | Essential shared libraries and kernel modules. |

    | /mnt | Mount point for temporarily mounted filesystems. |

    | /opt | Add-on application software packages. |

    | /proc | Kernel and process information virtual filesystem. |

    | /root | Home directory for root user (optional). |

    | /sbin | System binaries. |

    | /tmp | Temporary files. |'
