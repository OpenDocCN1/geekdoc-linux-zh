  md: '# Shell Utilities: logname 15


    # tty [ OPTION ... ]


    tty prints the filename of the terminal connected to its standard input. It prints
    not a tty if the standard input is not a terminal. It returns an exit status of
    0 if the standard input is a terminal, 1 if the standard input is not a terminal,
    2 if given incorrect arguments, or 3 if a write error occurs.


    tty has a single option available:


    | Option | Description |

    | -s or --silent or --quiet | Prints nothing; only returns an exit status. |


    # User Information


    This section describes commands that print user-related data items such as groups
    and logins.


    # groups


    +   - [ USERNAME ... ]

    groups prints the names of the primary and any supplementary groups for each given
    USERNAME, or the current process if no names are given. If names are given, the
    name of each user is printed before the list of that user''s groups. The group
    lists are equivalent to the output of the command id -Gn.


    # id


    +   - [ OPTION ... ] [ USERNAME ]

    id prints information about the given USERNAME or the process running if USERNAME
    isn''t specified.


    | Option | Description |

    | -g or --group | Prints only the group ID. |

    | -G or --groups | Prints only the supplementary groups. |

    | -n or --name | Prints the user or group name instead of the ID number. Requires
    -u, -g, or -G. |

    | -r or --real | Prints the real (rather than effective) user or group ID. Requires
    -u, -g, or -G. |

    | -u or --user | Prints only the user ID. |


    # logname


    logname


    logname prints the calling user''s name as found in the file /etc/utm, and exits
    with a status of 0. If no /etc/utm entry exists for the calling process, logname
    prints an error message and exits with a status of 1.'
