    reduces load time and keeps the map smaller. Using compact is especially recommended
    when booting from a floppy disk. |

    | default=NAME | Use NAME as default image. If default is omitted, the image appearing
    first in the configuration file is used. |

    | delay=TSECS | Wait TSECS tenths of a second before booting the first image.
    This is useful on systems that immediately boot from the hard disk after enabling
    the keyboard. The boot loader doesn''t wait if delay is omitted or set to zero.
    |


