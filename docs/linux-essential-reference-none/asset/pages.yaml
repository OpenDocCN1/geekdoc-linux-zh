  md: '# # 6 bash


    bash is one of several shells (command interpreters) available for use with Linux
    distributions. Typical distributions include several shells, bash is generally
    designated as the default. The name is an acronym for “Bourne–Again SHell,” a
    pun on the name of Steve Bourne. Steve Bourne was the author of the shell sh,
    which was the standard UNIX shell.


    bash is fully compatible with sh and also offers many extensions, including useful
    features from the Korn shell ksh and the C shell csh. It''s ultimately intended
    to be a conformant implementation of the IEEE POSIX Shell and Tools specification
    (IEEE Working Group 1003.2).


    # ## Invoking bash


    ```

    bash [LONG_OPT] [-ir] [-abefkhmnptuvxdbdCDHP] [-o OPTION] [ARGUMENT ...]

    bash [LONG_OPT] -s [-abefkhmnptuvxdbdCDHP] [-o OPTION] -c STRING [ARGUMENT ...]

    bash [LONG_OPT] [-o OPTION] [ARGUMENT]

    ```


    The single letter options (-a, -b, and so on) are the same as the options enabled
    using the set built-in command. The following table describes the other command-line
    options for bash.


    | Option | Description |

    | --- | --- |

    | -c STRING | Reads and executes commands from STRING after processing the options,
    and then exits. Any remaining arguments are assigned to the positional parameters,
    starting with $0. |

    | -D | A list of double-quoted strings preceded by $ is printed on the standard
    output. This implies the -n option. No commands are executed. |

    | --dump-strings | Equivalent to -D. |

    | --help | Displays a usage message on standard output and exits successfully.
    |

    | -1 | Forces the shell to run interactively. |


    continues >>'
