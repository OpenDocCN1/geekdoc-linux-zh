  md: '# File Utilities: chmod


    | Option | Description |

    | --- | --- |

    | -c or --changes | Verbously describe the action for each FILE whose group was
    changed. |

    | -f or --silent or --quiet | Don''t print error messages about files whose group
    can''t be changed. |

    | -h or --no-dereference | Act on symbolic links instead of what they point to.
    |

    | -v or --verbose | Verbosely describe the action or non-action taken for each
    FILE. |

    | -R or --recursive | Recursively change the group ownership of directories and
    their contents. |


    chmod [ OPTION ... ] MODE FILE


    chmod changes the access permissions of the named FILES. For FILES that are symbolic
    links, chmod changes the permissions of the referenced files. MODE specifies the
    new permissions.


    The MODE argument can be given in either a symbolic form or an octal numeric format.
    The format of symbolic mode is one or multiple instances of the following, separated
    by commas:


    [USERS|+,;=]|[PERMISSIONS]


    WHERE USERS is any combination of the letters u, g, o, or a PERMISSIONS is any
    combination of the letters r, w, x, s, t, u, g, or o.


    The + operator causes the selected permissions to be added. The - causes them
    to be removed. = causes them to be the only permissions the file has.


    USERS controls the selection of users whose access to the file will be changed:


    +   - u The user who owns the file.

    - g Other users in the file''s group.

    - o Other users not in the file''s group.

    - a All users.


    If USERS is not given, a is assumed but the bits that are set in the umask (bash,
    umask -S will show this) are unaffected.


    PERMISSIONS selects the new permissions for the affected users:


    +   - r Read.

    - w Write.

    - x Execute for files, access for directories.

    - X Execute only if the file is a directory or already has permission for some
    user.

    - s Set user or group ID on execution.

    - t Save program text on the swap device.

    - u The permissions that the user owns the file currently has for it.

    - g The permissions that other users in the file''s group have for it.

    - o The permissions that other users not in the file''s group have for it.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'The numeric MODE is from one to four digits (0–7), derived by adding up the
    bits with values 4, 2, and 1. Any omitted digits are assumed to be leading zeros.
    The first digit selects the user ID (4) and group ID (2) and save text (1) attributes.
    The second digit selects permissions for the owner of the file: read (4), write
    (2), and execute (1). The third selects permissions for other users in the file''s
    group, with the same values. The fourth selects permissions for other users not
    in the file''s group, with the same values.


    For example, the following adds execute capability to file for the file''s owner:


    ```

    chmod u+x file

    ```


    The equivalent using a numeric MODE argument would be the following:


    ```

    chmod 100 file

    ```


    The following adds execute and read access to the owner of the file, copies the
    owner''s access rights to the file''s group, and sets access for other users to
    execute:


    ```

    chmod u+xr,g=r,o=x file

    ```


