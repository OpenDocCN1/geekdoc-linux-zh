    # Scheduling and Managing Batch Jobs


    This section describes commands used in the execution of batch jobs.


    # at


    at [ OPTION ... ] TIME -c JOB ...nat jobs to be run at TIME. The commands to be
    executed are read from standard input or a disk file.

    at allows fairly complex TIME specifications, extending the POSIX.2 standard.
    It accepts times of the form HH:MM to run a job at a specific time of day. (If
    time is already past, the next day is assumed.) You can also specify midnight,
    noon, or teatime (4 p.m.) and a time of day suffixed with AM or PM for running
    in the morning or evening. Specify which day the job will be run by giving a date
    in the form MONTH-DAY. DAY with an optional YEAR, or giving a date of the form
    MMDDYY or MM/DD.YY. The specification of date must follow the specification of
    time of day. Times are stated in the form now + COUNT TIME-UNITS, where COUNT
    is a number and TIME-UNITS is minutes, hours, days, or weeks. You also tell at
    to run the job today by suffixing the time with today or run the job tomorrow
    by suffixing the time with tomorrow.


    The job inherits the working directory, the environment (for TERM, DISPLAY, and
    _) and the unmask from the process that invoked at.'
