  md: '# #1 Shell Utilities


    The commands in this section are most useful as components of shell scripts. They
    perform such tasks as printing messages, performing simple arithmetic operations
    and conditional tests, input/output redirection, file and pathname manipulation,
    and other functions that are of interest to shell script writers.


    # ## Common Options


    In addition to the options described in the following sections, each Linux utility
    command can be invoked with the following options:


    | Option | Description |

    |---|---|

    | --help | Prints a usage message listing all available options and exits successfully.
    |

    | --version | Prints the version number and exits successfully. |


    # ## Text Printing


    These commands print text based on the values of variable and literal arguments
    passed to the commands.


    ```

    echo

    ```


    ```

    echo [ OPTION ... ] [ STRING ... ]

    ```


    echo writes each STRING to standard output, with a space between each string and
    a newline after the last one.


    | Option | Description |

    |---|---|

    | -n | Don''t print the trailing newline. |

    | -e | Enables the interpretation of backslash-escaped characters in each STRING:

    \a Bell.

    \b Backspace.

    \c Suppress the trailing newline. |


    continues >>'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 4 Shell Utilities: echo


    >>continued


    | Option | Description |

    | --- | --- |

    | \f | Formfeed. |

    | \n | Newline. |

    | \r | Carriage return. |

    | \t | Horizontal tab. |

    | \v | Vertical tab. |

    | \\ Backslash. |

    | \NNN | Character whose ASCII code is octal NNN. If NNN is not a valid octal
    number, it''s printed literally. |


    # printf


    printf FORMAT [ ARGUMENT ... ]


    printf prints the specified ARGUMENTS according to the FORMAT string. The FORMAT
    argument is specified as it is with C printf.

    The FORMAT is reused as necessary to convert all the given ARGUMENTS. The FORMAT
    argument for the printf command is functionally identical to that of the C printf
    library routine (see the printf(3) manual page for a complete description) except
    for the following:


    +   - The printf shell command has one additional directive, %b, which prints
    its string with \ escapes interpreted in the same way as in the FORMAT string.

    - The printf shell command interprets \000 in FORMAT as an octal number (if 000
    is zero to three octal digits) specifying a character to print, and xHHHH (if
    HHH is from one to three digits) specifying a character to print.

    - An additional escape, \c, causes printf to produce no further output.


    For example,

    printf ''%f'' 10

    converts 10 to floating point, app a newline character, and prints the following:

    10.000000


    The same can be accomplished with this:

    printf ''%fb'' 10 ''\012''

    The following command,

    printf ''%.3f'' * 3.1416 20.123 30.5


    converts all three of the argument values to floating-point format and prints
    them with three digits of precision, like this:

    3.142 20.123 30.500'
