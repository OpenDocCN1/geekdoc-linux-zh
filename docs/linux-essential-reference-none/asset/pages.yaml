    # Archival and Backup


    This section describes commands used for backing up and archiving data.


    # dump


    ```

    dump [ OPTION ... ] FILESYSTEM

    dump [ OPTION ... ] DIRECTORY

    dump [ -W ; -w w ]

    ```


    dump examines files in a filesystem or directory and determines which one need
    to be backed up. These files are copied to the given disk, tape, or other storage
    medium for archival storage. A dump that''s larger than the output medium is broken
    into multiple volumes. On most media, the size is determined by writing until
    an end-of-media indication is returned. On media that can''t reliably return an
    end-of-media indication (such as some cartridge tape drives), each volume is of
    a fixed size; the actual size is determined by the tape size and density and/or
    block count options (described shortly). By default, the same output filename
    is used for each volume after prompting the operator to change media.

    dump


    dump requires operator intervention over these conditions: end of tape, end of
    dump, tape write error, tape open error, or disk read error (if there are more
    than a threshold of 32). In addition to alerting operators implied by the -n key,
    dump interacts with the operator on dump''s control terminal at times dump can
    no longer proceed, or if something is grossly wrong. All questions dump poses
    must be answered by yes or no as appropriate.


    dump exits with Ø status on success. Startup errors are indicated with an exit
    code of 1; abnormal termination is indicated with an exit code of 3.'
