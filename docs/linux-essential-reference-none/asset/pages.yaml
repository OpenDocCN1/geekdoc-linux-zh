  md: '# identd and inetd


    identd [-i|-w|-b] OPTION ... { KERNELFILE { KMEMFILE } ]


    identd is a server that implements the TCP/IP proposed standard USER identification
    protocol as specified in the RFC 1413 document. It operates by looking up specific
    TCP/IP connections and returning the username of the process owning the connection.


    - -i flag, which is the default mode, should be used when starting the daemon
    from inetd with the nowait option in /etc/inetd.conf. Use of this mode will make
    inetd start identd daemon for each connection request.


    - -w flag can be used when starting the daemon from inetd with the wait option
    in /etc/inetd.conf. This is the preferred mode of operation since will start a
    copy of identd at the first connection request, and identd will handle subsequent
    requests without having to de-list the nlist lookup in the KERNEL file for every
    request as in the -i mode described. The identd daemon will run forever until
    a bug makes it crash, or until a timeout occurs as specified by the -t flag.


    - -b flag can be used to make the daemon run in standalone mode without assistance
    from inetd. is the least preferred mode since a bug or any other fatal condition
    in the server will terminate it and will have to be restarted manually. Other
    than that, it has the same advantage as the -w mode in that parses the nlist only.


    KERNELFILE defaults to the currently running kernel file. KMEMFILE defaults to
    the memory space of the currently running kernel.


    | Option | Description |

    | - | - |

    | -ADDRESS | Binds the socket to ADDRESS when using the -b option. ADDRESS must
    be an IP address and not a domain name. The default is INADDR_ANY, which normally
    means all addresses. |

    | -cCHARSET | According to the IDENT protocol, adds the optional character set
    designated to the reply generated. CHARSET should be a valid character set as
    described in the MIME RFC, in uppercase characters. |

    | -d | Enables debugging code. This normally shouldn''t be used, since it breaks
    the protocol and may reveal information that shouldn''t be available to outsiders.
    |'
  merge: -1
