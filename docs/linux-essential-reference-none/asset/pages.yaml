  md: '# Modified Command Invocation


    This section describes commands that run other commands (generally specified as
    COMMAND [ ARG ... ] ) in a context that differs from the current one (for example,
    in a modified environment or as a different user).


    # chroot


    chroot NEWROOT [ COMMAND [ ARG ... ] ]


    chroot runs COMMAND with the specified ARGs, with the root directory changed to
    NEWROOT. If COMMAND isn''t specified, chroot uses the shell specified by the environment
    variable SHELL. If SHELL is not set, /bin/sh -i is executed. Only the superuser
    can change the root directory.


    # env


    env [ OPTION ... ] [ NAME=VALUE ... ] [ COMMAND [ ARG ... ]


    env runs COMMAND with an environment modified by the NAME and VALUE pairs. If
    COMMAND isn''t specified, the values of the new environment are printed as in
    printenv. The following OPTIONS apply:


    | Option | Description |

    |---|--|

    | -u NAME or --unset=NAME | Removes the variable NAME from the environment. |

    | -or or -i or --ignore-environment | Starts with an empty environment, ignoring
    the inherited environment. |


    # nice


    nice [ OPTION ... ] [ COMMAND [ ARG ... ]


    nice executes COMMAND with the given ARGs at a modified scheduling priority. If
    no arguments are given, nice prints the current scheduling priority. If no adjustment
    is specified, 10 is added to the current priority.


    nice takes a single OPTION, as described in the following table.


    | Option | Description |

    |---|--|

    | -n ADJUSTMENT or -ADJUSTMENT | Adds ADJUSTMENT to the scheduling priority. |

    | or --adjustment=ADJUSTMENT | |


    # nohup


    nohup COMMAND [ ARG ... ]


    nohup executes COMMAND and its ARGs with hangup signals ignored. The scheduling
    priority of COMMAND is increased by 5. If standard output is a terminal, and standard
    error are redirected to be appended to the file nohup.out. If nohup.out can''t
    be written to, they''re appended to the file $HOME/nohup.out. If that file can''t
    be written to, the command is not run.'
  merge: -1
