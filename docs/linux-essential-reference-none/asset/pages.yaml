  md: '# 7 Process Control


    This chapter describes commands and utilities for managing user processes and
    for examining their status.


    # ## Signals


    Signals are frequently used for interprocess communication and process management.
    Logically, a signal is an integer value transmitted from a sender to a receiver
    process. A signal can also be sent to a process by the kernel when certain internal
    conditions are encountered. For example, the system administrator can use a signal
    to indicate to a daemon that it should reset its configuration, or a process can
    receive a signal from the kernel when it tries to execute an illegal instruction.


    On receiving the signal, the receiving process can either ignore the signal or
    execute a subroutine called a signal handler. The signal handler is specified
    for the given signal value using the signal system call, which takes the signal
    value and the signal handler''s address as arguments. If no handler is specified
    for a signal value, the receiving process will execute the default action for
    that signal. If a signal is to be ignored, the constant SIG_IGN is passed to signal
    as the signal handler. The signal(2) manual page for more information on the signal
    system call.


    Signals are sent by either the kill system call or the kill command. When sending
    signals using the kill command, the integer value can be given or the signal''s
    name can be used. and the default actions to be taken when received. Some of the
    signals have more than one value. In these cases, the first is for Alpha and Spar
    systems, the second for Intel and PowerPC, and the third for Mips. A minus (-)
    indicates that the signal isn''t defined for the corresponding architecture.


    | Name | Value(s) | Default Action | Description |

    |---|---|---||

    | SIGHUP | 1 | Terminate process. | Hangup detected on controlling terminal. |

    | SIGINT | 2 | Terminate process. | Interrupt from keyboard. |

    | SIGQUIT | 3 | Terminate process. | Quit from keyboard. |

    | SIGILL | 4 | Terminate process. | Illegal instruction. |


    continues >>'
