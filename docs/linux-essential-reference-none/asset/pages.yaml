  md: '# User Management


    This chapter describes the commands used to maintain user and group accounts.


    # Password Maintenance


    This section describes the commands used to delete and change passwords for users
    and groups.


    # chpasswdwd


    chpasswd [ † -e ]


    chpasswd provides batch update of user passwords. It reads a file of username
    and password pairs from standard input and uses the data to update the corresponding
    user passwords. Without the -e switch the passwords are assumed to be clear text;
    with the -e switch the passwords are expected to be encrypted. Each line is of
    the form USER:PASSWORD. The specified USER must exist. PASSWORD will be encrypted
    if necessary.


    # dpasswdwd


    dpasswd [ -a † -d ] SHELL


    dpasswd adds, deletes, or updates dial-up passwords for login shells. The dial-up
    password is prompted after a user''s password has been authenticated, whenever
    the user logs in over a dial-up line. dpasswd prompts for the new password twice
    to make sure it was entered correctly. SHELL is the complete pathname of the login
    program (/bin/login). Using -a or neither option causes dpasswd to update the
    password if it exists or add the password if it doesn''t exist. The -d option
    causes dpasswd to delete the password.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# gpassword


    gpassword GROUP

    gpassword { -a -d } USER GROUP

    gpassword { -R -r } GROUP

    gpassword { -A USER_LIST } -M USER_LIST } GROUP


    gpassword is used to maintain group membership and password data. The -A and -M
    options are used by the system administrator to define group administrators and
    group members. Each USER_LIST is a comma-separated list of usernames. The Option
    command-line switches are defined according to the following table:


    | Option | Description |

    | --- | --- |

    | -a USER GROUP | Adds USER to GROUP. |

    | -d USER GROUP | Deletes USER from GROUP. |

    | -R GROUP | Disables access to GROUP. |

    | -r GROUP | Removes the password for GROUP. |


    # password


    password [ -f ; -s ] [ NAME ]

    password [ -g ] [ -r ] GROUP ]

    password [ -x MAX ] [ -n MIN ] [ -w WARN ] [ -i INACT ] NAME

    password { -l ;-u ; -d ;-S } NAME


    password changes passwords for user and group accounts. A normal user can only
    change the password for his or her own account. Superusers can change passwords
    for any account. Group administrators can change the passwords for their groups.
    password also changes account information, such as the full name of the user,
    or his log shell, or password expiration dates and intervals.


    | Option | Description |

    | --- | --- |

    | -f | Changes the account information for NAME or for invoking the user NAME
    is not specified. |

    | -g | Changes the password for the group GROUP. |

    | -i INACT | Disables the account for NAME after the password has been expired
    for INACT days. |

    | -1 | Disables the account for NAME by changing the password to a value that
    matches no encrypted value. |

    | -n MIN | Changes the minimum number of days before the password of user NAME
    can be changed. |

    | -R | Used with the -g option to restrict the group GROUP for all users. |

    | -r | Used with the -g option to remove the password for the group GROUP. This
    allows access to all members. |

    | -S | Gives an account status for NAME. The status information consists of six
    parts. The first part indicates whether the user is locked (L), has no password
    (NP), or has a usable password (P). The second part gives the date of the last
    password change. The next four parts are the minimum age, maximum age, warning
    period, and inactivity period for the password. |'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# User Management: cage 167


    | Option | Description |

    | --- | --- |

    | -s | Changes the login shell for NAME or invoking the user if NAME isn''t specified.
    |

    | -u | Re-enables the account of NAME by changing the password back to its previous
    value. |

    | -w WARN | Sets the number of days warning that the user NAME will receive before
    his or her password will expire. |

    | -x MAX | Sets the maximum number of days that the password for the user NAME
    remains valid. |


    # User and Group Maintenance


    This section describes commands that create, delete, and modify user and group
    accounts.


    # chage


    chage [ -m MINDAYS ] [ -M MAXDAYS ] [ -d LASTDAY ] [ -I INACTIVE ] [ -E EXPIRED
    ] [ -w WARNDAYS ] USER

    chage -1 USER


    chage changes the number of days between password changes and the date of the
    last password change. The chage command is restricted to the root user except
    for the -1 option, which can be used by an unprivileged user to determine if his
    or her password or account is due to expire. The other options are defined in
    the following table:


    | Option | Description |

    | --- | --- |

    | -d LASTDAY | The value of LASTDAY is the number of days since January 1, 1970
    when the password was last changed. The date can also be expressed in the format
    MM/DD/YY or MM/DD/YYYY. |

    | -E EXPIRED | Sets the date on which the user''s account will no longer be accessible.
    EXPIRED is the number of days since January 1, 1970 on which the account is locked.
    The date can also be expressed in the format MM/DD/YY or MM/DD/YYYY. |

    | -I INACTIVE | Sets the number of days of inactivity after a password has expired
    before the account is locked. INACTIVE is the number of days of inactivity. A
    value of 0 disables this feature. |

    | -M MAXDAYS | The value of MAXDAYS is the maximum number of days during which
    a password is valid. When MAXDAYS plus LASTDAY is less than the current day, the
    user will be required to change the password before being able to use the account.
    |

    | -m MINDAYS | The value of MINDAYS is the minimum number of days between password
    changes. A value of 0 for this field indicates that the user can change the password
    at any time. |

    | -W WARNDAYS | WARNDAYS is the number of days of warning before a password change
    is required. |'
  merge: -1
