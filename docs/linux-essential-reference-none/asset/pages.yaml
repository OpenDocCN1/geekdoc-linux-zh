  md: '# Programming: gcc and g++ 85


    | Option | Description |

    |---|---|

    | -fmemoize-lookups, -fsave-memoized | Uses heuristics to compile fast (C++ only).
    |


    These heuristics are not enabled by default, since they''re only effective for
    certain input files and may cause other input files to compile more slowly.


    The first time the compiler must build a call to a member function or reference
    to a data member, it must first determine whether the class implements functions
    of the corresponding name. Then it must resolve which member function to call,
    which involves figuring out what sorts of type conversions need to be made. Finally,
    it must check the visibility of the member function to the caller. All of this
    adds up to slower compilation; the second member call or reference forces the
    compiler to go through the same process again. By using a software cache, a "hit"
    significantly reduces this cost. Unfortunately, using it introduces another layer
    of mechanisms that must be implemented, and so incurs its overhead. -fmemoize-lookups
    enables the software cache.


    Because access privileges (visibility) with members and member functions differ
    from one function context to the next, C++ may need to flush the cache. With the
    -fmemoize-lookups flag, the cache is flushed after every function that''s compiled.
    The -fsave-memoized enables the same software cache, but when the compiler determines
    that the context of the last function compiled would yield the same access privileges
    of the next function to compile, it preserves the cache. This is most helpful
    when defining many functions for the same class. With the exception of member
    functions that are friends of other classes, each function has exactly the same
    access privileges as every other, and the cache doesn''t need to be flushed.


    continues >>'
