    # restore


    restore [ OPTION ... ] [ FILE ... ]

    restore performs the inverse function of dump. A full backup of a filesystem can
    be restored and subsequent incremental backups layered on top of it. Single files
    and directory subtrees can be restored from full or partial backups.


    Exactly one of the following flags is required:


    | Mode | Description |

    | -C | Allows comparison of files from a dump. restore reads the backup and compares
    its contents with files present on the disk. It first changes its working directory
    to the root of the filesystem that was dumped and then compares the tape with
    the files in its current directory. |

    | -h | Suppresses hierarchical directory traversals |

    | -i | Allows interactive restoration of files from a dump. After reading the
    directory information from the dump, restore provides a shell-like interface that
    allows the user to move around the directory tree, selecting files to be extracted.
    The available commands are as follows (for commands that require an argument,
    the default is the current directory):

    [ARG] The current directory or specified argument is added to the list of files
    to be extracted. If a directory is specified, then all of its descendants are
    added to the extraction list.

    cd ARG Changes the working directory to ARG.

    delete [ARG] Deletes ARG from the list of files to be extracted.

    help Prints a summary of available commands.

    ls [ARG] Lists files in the current directory or ARG.

    wpd Prints the pathname of the current working directory.

    quit Exits restore immediately.

    modes All the directories that have been added to the extraction list have their
    owner, modes, and times set. Nothing is extracted from the dump |

    | -R | Requests a tape of a multi-volume set on which to restart a full restore
    (see the -r flag). |

    | -r | Rebuilds a filesystem |

    | -t | The names of the specified files are listed if they occur on the backup.
    If NO FILE argument is given, the root directory is listed, which results in the
    entire contents of the backup being listed, unless the -h flag has been specified
    |

    -v | Verbose operation |

    -X | The named files are read from the given media. If a named file matches a
    directory whose contents are on the backup and the -h flag is not specified, the
    directory is extracted recursively. The owner, modification time, and mode are
    restored (if possible). If NO FILE argument is given, the root directory is extracted,
    which results in the entire contents of the backup being extracted, unless the
    -h flag has been specified.'
