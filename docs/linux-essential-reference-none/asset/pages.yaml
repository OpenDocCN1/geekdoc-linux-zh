    | -w DIRECTORY | Sets the working directory of the server. |


    # /etc/hosts


    The /etc/hosts file is used to map IP addresses to hostnames and vice versa. Each
    line contains an IP address, a hostname, and optional aliases for the hostnames.
    The fields are separated by spaces or tabs. Any characters # are ignored and can
    be used as comments.


    Example entries:


    ```

    #it is customary to use *localhost* to refer to local machine

    127.0.0.1       localhost

    #

    191.72.1.1      myhost myhost.mydomain.net

    ```


    # /etc/host.conf


    The file /etc/host.conf contains configuration information used by the resolver
    library. Each line is a keyword followed by arguments if applicable.Valid keywords
    are shown in the following table.


    | Keyword | Description |

    |---|---|

    | alert | If this option is set to on and the nospoof option is also set, the
    resolver will log a warning of the error via the syslog file.The default is to
    off. |

    | multi | Values are on and off. If set to, the resolver will return all valid
    addresses for a host that appears in the /etc/hosts file, instead of the first
    address. This is off by default, as it may cause a substantial performance loss
    at sites with large host files. |

    | spoofof | Values are on and off. If set to, the resolver will attempt to prevent
    hostname spoofing to enhance the security of login and rsh. This is accomplished
    by validating each address lookup with a hostname lookup for the address that
    was found. If the two hostnames do not match, the query will fail. |'
