  md: '# Startup and Shutdown 189


    On standalone workstations, getty is used to enable virtual console sessions.
    It can also be used to accept logins on terminals attached to serial ports. Terminals
    can be dumb terminals or other machines running terminal-emulation software (perhaps
    pre-i386 Intel-based or older PCs that are incapable of running Linux themselves).
    This could be an excellent way to save money by putting older (cheap) hardware
    to work.


    For example, in the file /etc/inittab, this line:


    ```

    S12:respawn:/sbin/getty -L 19200 tty1 vt102

    ```


    enables a terminal or PC connected to tty1 (COM2 in MS-DOS) to run a session at
    19200 baud. vt102 is the terminal type. getty will set the TERM environment variable
    to this value. In this example, getty will run when entering levels 2 and 3 and
    will be automatically restarted every time it is killed.


    For more information on using getty with character terminals, see the references
    listed in Appendix C.


    # telinit


    telinit -t SECONDS ARGUMENT


    telinit is linked to init. It takes a single character ARGUMENT and signals init
    to perform the appropriate action. The following arguments serve as directives
    for telinit:


    | Argument | Description |

    | --- | --- |

    | Ø through 6 | Switch to the specified runlevel. |

    | a, b, or c | Process only those /etc/inittab entries with the corresponding
    runlevel. |

    | Q or q | Reexamine the /etc/inittab file. |

    | S or s | Switch to single-user mode. |

    | U or u | Tells init to rerun itself but with the state preserved. The /etc/inittab
    file isn''t reexamined. The current runlevel should be S, s, 1, 2, 3, 4, or 5;
    otherwise, the request will be silently ignored. |


    The - SECONDS will cause telinit to tell init to wait seconds between sending
    processes the SIGTERM and SIGKILL signals.


    # Shutdown


    The commands in this section are used to shut down the system in a manner that
    ensures logical and physical data integrity. Rather than simply halting the processor,
    these commands send signals to processes to notify them that cleanup processing
    is to be accomplished if needed. They also send warning messages to terminal users
    and resynchronize disk caches with their associated disk blocks.'
  merge: -1
