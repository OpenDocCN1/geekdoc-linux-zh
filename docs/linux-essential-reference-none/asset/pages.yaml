  md: 'If you''re looking for an accurate, comprehensive guide to Linux, this book
    will show you how to:


    # Linux®


    Use shell utilities such as echo, printf, yet and date


    # ESSENTIAL REFERENCE


    Work with advanced text-processing utilities (grep, sed)


    Essential Reference is a resource for system administrators and other professional
    Linux users. Clear, concise instructions for such administrative and managerial
    tasks as implementing frequently used commands, dealing with shell scripting,
    and utilizing effective security measures are presented in a carefully structured
    format, making this book an efficient source of answers to questions about working
    with Linux.


    Perform programming tasks


    Aware of the need in time-sensitive environments for quick access to accurate
    information, author Ed Petron has organized the contents of this book to make
    it and easy-to-use. And he has filled it with information not available in any
    single volume—from programming to network configuration, user management to file
    management, text-processing utilities to kernel modules. Essential Reference is
    the professional''s guide to Linux expertise.


    Master informational and diagnostic utilities (finger, netstat), file and data
    transfers (ftp,scp), and remote sessions (telnet, rsh)


    Build the kernel and use kernel modules


    Configure a network, including daemons, file sharing, and mail administration


    Manage files, including disk usage, archival, and backups


    Ed Petron is an independent computer consultant with more than a decade''s experience
    as a programmer and system administrator working with mainframe and UNIX systems.
    He began using and studying Linux in 1995 with version 2.0.1 of the Debian distribution
    He now uses and contributes to the distribution and has written several articles
    for the Linux Journal. Ed holds a bachelor of Music in keyboard performance (piano,
    harpsichord, and organ) from Indiana University and a Bachelor of Science in Computer
    Science from Science in Engineering with a concentration in computer science at
    California National University.


