    # fmt


    fmt { OPTION ... } [ FILE ...]

    fmt reads from the specified FILE arguments (or standard input if no FILES are
    given) and writes to standard output.


    By default, blank lines, spaces between words, indentation are preserved in the
    output; successive lines with different indentation are not joined; tabs are expanded
    on input and introduced on output.


