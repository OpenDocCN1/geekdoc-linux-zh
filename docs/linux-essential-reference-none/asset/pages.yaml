    \ files (including standard input if no files are specified), edits the data according\
    \ to one or more editing scripts, and writes the results to standard output.\n\
    \n| Option | Description |\n|---|---|\n -e SCRIPT or --expression=SCRIPT | Append\
    \ one more commands specified in SCRIPT to the list of editing commands. If there\
    \ is just one -e option or -f option, the flag can be omitted. |\n -f SCRIPT-FILE\
