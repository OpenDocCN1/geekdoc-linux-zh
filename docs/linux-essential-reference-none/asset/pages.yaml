  md: '# Security: ipchains 275


    The options recognized by ipchains are divided into three types: commands that
    indicate specific actions to perform, parameters that make up rule specifications,
    and additional options.


    The following table describes the command options accepted by ipchains.


    | Option | Description |

    | --- | --- |

    | -A | Appends one or more rules to the end of the selected chain. When the source/destination
    names resolve to more than one address, a rule will be added for each possible
    address combination. |

    | -C | Checks the given packet against the selected chain. The same arguments
    used to construct the packet to be tested. In particular, the -s (source), -p
    (protocol), and -i (interface) flags are compulsory. |

    | -D | Deletes one or more rules from the selected chain. There are two versions
    of this command:The rule can be specified as a number in the chain (starting at
    1 for the first rule) or a rule to match. |

    | -F | Flushes the selected chain. This is equivalent to deleting all rules at
    a time. |

    | -h | Help. A brief description of command syntax. |

    | -I | Inserts one or more rules in the selected chain as the given number. If
    the rule number is 1, the rule(s) are inserted at the head of the chain. |

    | -L | Lists all rules in the selected chain. If no chain is selected, all chains
    are listed. It''s legal to specify -Z (zero) option as well, in which case no
    chain may be specified. The exact output is affected by the other arguments given
    |

    | -M | Allows viewing of the currently masqueraded connections (in conjunction
    with the -L option) or to set the kernel masquerading parameters (with the -S
    option) |

    | -N NAME | Creates a new user-defined chain with the name NAME. A chain with
    this name must not already exist. |

    | -P | Sets the policy for the chain to the given target. Only non-user-defined
    chains can have policies, and neither built-in user-defined chains can be policy
    targets |

    | -R | Replaces a rule in the selected chain. If the source/destination names
    resolve to multiple addresses, the command will fail. Rules are numbered starting
    at 1. |

    | -S TCP UDP | Changes the timeout values used for masquerading. This command
    always takes three parameters, representing the timeout values (in seconds) for
    TCP sessions, TCP sessions after receiving a FIN packet, and UDP packets, respectively.
    A timeout value of 0 means the current timeout value of the corresponding entry
    is preserved. This option is only allowed in combination with the -M flag. |

    | -X | Deletes the specified user-defined chain. There must be no references to
    the chain. If references exist, the referring rules must be deleted before the
    chain can be deleted. If no argument is given, this option attempts to delete
    every non-built-in chain. |


    continues >>'
