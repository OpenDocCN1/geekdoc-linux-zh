    # Using ar Scripts


    When ar is invoked with the single option -M, its operation can be controlled
    with a rudimentary command language. This form of ar operates interactively with
    standard input coming directly from a terminal. During interactive use, ar prompts
    for input (the prompt is ar ), and continues executing even after errors. If you
    redirect standard input to a script file, no prompts are issued, and ar abandons
    execution (with a nonzero exit code) on any error.


    The following rules apply to ar commands:


    +   - Commands are not case sensitive. LIST is the same as list.

    - A single command appears on each line. The command is the first word on the
    line.

    - Multiple-line commands are continued with +.

    - Empty lines are allowed and have no effect.

    - Arguments to commands are separated with either commas or blanks.


    The following table describes commands that can be used in ar scripts.


    | Command | Description |

    | --- | --- |

    | addlib ARCHIVE [ ( MODULE ... ) ] | Adds the entire ARCHIVE or specified MODULE(s)
    from ARCHIVE to the current archive. Requires a prior open or create. |

    | addmod MEMBER ... | Adds each named MEMBER as a module in the current archive.
    Requires a prior open or create. |

    | clear | Discards the contents of the current archive. |


