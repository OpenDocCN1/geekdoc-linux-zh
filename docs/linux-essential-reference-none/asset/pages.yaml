    # getty


    getty OPTION ... PORT BAUD_RATES [ TERM ]

    getty OPTION ... BAUD_RATES PORT [ TERM ]

    getty enables initiation of user sessions by prompting for login on a specified
    TTY port and invoking the /bin/login command. It''s normally invoked by init.


    BAUD_RATES is a comma-separated list of one or more baud rates. Each time getty
    receives a BREAK character it advances through the line, which is treated as if
    it were circular. Baud rates should be specified in descending order, so that
    the null character can also be used for baud-rate switching.


    PORT is a pathname relative to the /dev device. If a hyphen (-) is specified,
    getty assumes that its standard input is already connected to a TTY port and that
    a''connection to a remote user has already been established.


    TERM is the value to be used for the TERM environment variable. This overrides
    whatever init may have set, and is inherited by login and the shell.


    The following table describes command-line options for getty.


