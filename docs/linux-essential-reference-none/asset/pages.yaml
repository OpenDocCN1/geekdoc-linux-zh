  md: '# # Startup and Shutdown


    This chapter describes startup and shutdown processing.

    Startup processing can be broken down into two separate subprocesses:


    +   - The bootup process involves loading the kernel image into RAM. The newly
    loaded kernel performs various hardware initializations before invoking the init
    process.

    - The init process then enables terminal logins and starts daemon processes that
    provide additional services to both local and remote users.


    System shutdown involves the termination of system activity in a manner that ensures
    the following:


    +   - Physical data integrity. Linux, like other UNIX variants, caches disk blocks
    in RAM as a means of enhancing performance. If memory-resident data blocks have
    been modified (these are often referred to as “dirty”) and therefore no longer
    match the disk blocks that they represent, they need to be written out to the
    disk. This is accomplished by the sync system call.

    - Logical data integrity. This is more difficult to achieve than physical data
    integrity. The best that can be done is to notify users and processes that shutdown
    is in progress and any necessary cleanup processes needs to be done. This is accomplished
    by sending messages to logged-in users and by sending signals to processes.


    # Boot Management


    Bootup involves the actual loading of the kernel image into RAM. This can be accomplished
    in many ways. For example, many systems have more than one operating system installed
    or allow the user to select different kernel images (production versus test kernels).
    Boot management deals with the exercise of these options.

    This section focuses on the Linux loader (LILO), which is the boot loader commonly
    used on Intel-based systems. For information pertaining to boot management on
    other architectures and using Linux with other operating systems, see Appendix
    C, “Web Resources.”'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Startup and Shutdown: lilo


    # lilo


    lilo OPTION ...


    Most Linux systems use the Linux Loader (LILO) for boot management. lilo installs
    the boot loader that will be activated the next time the system is booted.


    | Option | Description |

    | - | - |

    | -C CONFIG_FILE | Read the configuration from CONFIG_FILE instead of /etc/lilo.conf.
    |

    | -c | Enable map compaction. This will merge read requests from adjacent sectors
    and speed up booting. |

    | -D LABEL | Use the kernel with label LABEL as the kernel, instead of the first
    one in the list. |

    | -d DELAY | If several kernels are specified and the Shift key is pressed at
    boot time, the boot loader will allow the selection of the kernel with to boot.
    After a timeout period of DELAYS, the first kernel in the list is booted. |

    | -f DISK_TAB | Specifies the disk geometry parameter DISK_TAB. The default is
    /etc/disktab. |

    | -I LABEL | Print the pathname for the kernel labeled with LABEL. The label of
    the currently running kernel can be found in /proc/cmdline, listed as BOOT_IMAGE-LABEL.
    |

    | -i BOOT_SECTOR | Specifies the file BOOT_SECTOR to be used as the new boot sector
    instead of /boot/boot.b. |

    | -1 | Generate linear sector addresses instead of head/cylinder addresses. |

    | -m MAP_FILE | Use MAP_FILE instead of /boot/map for the map file. |

    | -P { fix | ignore } | Fix (or ignore) partition tables with linear and head/cylinder
    addresses that do not correspond. |

    | -q | List the currently mapped kernel files. lilo maintains a file (/boot/map
    by default) containing the name and location of the kernel(s) to boot. |

    | -R COMMAND_LINE | Sets the default command for the boot loader the next time
    it executes. The boot loader will then erase this line; this is a once-only command.
    It is typically used in reboot scripts, just before calling shutdown - |

    | -r ROOT_DIRECTORY | chroot to ROOT_DIRECTORY before doing anything else. This
    is used for repairing a setup from a boot floppy. |

    | -S SAVE_FILE | Allow the save file SAVE_FILE to be overridden.|'
