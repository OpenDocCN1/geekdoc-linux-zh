    | nmap [ INPATTERN OUTPATTERN ] | Sets or uses the filename mapping mechanism.
    If no arguments are specified, the filename mapping mechanism is unset. The mapping
    follows the pattern by INPATTERN and OUTPATTERN. INPATTERN is a template for incoming
    filenames. Variable templating is accomplished by including the sequences $1,
    $2, ..., $9 in INPATTERN. Use \$ to prevent special treatment of the $ character.
    All other characters are treated literally, and are used to determine the nmap
    INPATTERN variable. OUTPATTERN determines the resulting filename. The sequences
    $1, $2, ..., $9 are replaced by any value resulting from the INPATTERN template.
    The sequence $0 is replaced by the original filename. Also, the sequence [SEQ1,
    SEQ2] is replaced by SEQ1 if not a null string; otherwise, it''s replaced by SEQ2.
    For example, the command nmap \$1.\2.$3 [$1,$2] yields the output filename myfile.data
    for input filename myfile.data and myfile.data.out, the output myfile.file for
    the input filename, and the output filename myfile.file for the input filename
    .myfile. Spaces can be included in OUTPATTERN using the \ character to prevent
