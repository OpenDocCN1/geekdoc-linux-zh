  md: '# Programming: gdb


    gdb is a symbolic debugger, used to provide source-level isolation of problems
    with C and C++ programs. Partial support is available for Modula-2, Chill, Pascal,
    and Fortran. For programs written in unsupported languages or for which no source
    is available, gdb can be used to provide assembly-language-level support.


    gdb can be used in four ways:


    +   - Starting and debugging a new process.

    - "Post mortem" debugging of a process that has failed and has left a core dump
    file.

    - Debugging a process that''s already running.

    - As a back end for debugging facilities such as xxgdb the emacs debugger.


    PROGRAM is an executable binary linked with symbolic data included. Some programs
    use a CORE file behind (typically named core) when errors such as segmentation
    faults are encountered. The purpose of this file is to support debugging of the
    failed process. The CORE file contains data describing the process state at time
    of failure.


    Supplying PID enables debugging of a process that is already running.


    # Command-Line Options for gdb


    The following command-line options can be used:


    | Option | Description |

    | --- | --- |

    | -b BPS | Sets the line file (baud rate or bits per second) of any serial interface
    used by gdb for remote debugging. |

    | -batch | Runs in batch. Exits with status after all the commands specified with
    -x. |

    | -cd DIRECTORY | Runs gdb using DIRECTORY as its working directory, instead of
    the current directory. |

    | -command FILE | Executes commands from the file FILE. |

    | -core FILE or -c FILE | Uses the file as a core dump to. |

    | -c NUMBER | Connects to the process ID NUMBER. If a file name exists in core
    dump format, uses NUMBER as a core file. |

    | -directory DIRECTORY or -d DIRECTORY | Adds DIRECTORY to the path to search
    for source files. |

    | -exec FILE or -e FILE | Uses the file as the executable file to execute when
    appropriate and examining data in conjunction with a core dump file. |

    | -fullname or -f | Outputs the full filename and line number in a standard, recognizable
    fashion each time a frame is displayed (which includes each time a program stops).
    |

    | -nx or -n | Don''t execute commands from any initialization file (normally called
    .gdbinit). |

    | -quiet or -q | Don''t print the introductory and copyright messages. |

    | -r or -readnow | each symbol file''s entire symbol table immediately. |'
