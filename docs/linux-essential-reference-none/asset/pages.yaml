  md: '# Suspending Execution


    This describes the means to delay or suspend the execution of shell scripts for
    a specified period of time.


    # sleep


    ```

    sleep NUMBER[UNIT]

    ```


    sleep pauses for an interval of time specified by NUMBER. UNIT is one of the following:


    | Option | Description |

    | s | Seconds (default). |

    | m | Minutes. |

    | h | Hours. |

    | d | Days. |


    # Numeric Operations


    These commands perform numerically related operations.


    # factor


    ```

    factor [ NUMBER ... ]

    ```


    factor prints factors for each NUMBER. If no NUMBERS are specified on the command
    line, factor reads them from standard input, delimited by newlines, tabs, or spaces.


    # seq


    ```

    seq [ OPTION ... ] [ FIRST [ STEP ] LAST

    ```


    seq prints a sequence of numbers from FIRST to LAST by STEP to standard output.
    By default, FIRST and STEP are both 1, and each number is printed on its own line.
    All numbers can be real, not just integers.


    | Option | Description |

    | -f FORMAT | Prints all numbers using FORMAT. The default is %g. |

    | --format=FORMAT | FORMAT must contain exactly one of the standard float output
    formats %e, %f, or %g. |'
