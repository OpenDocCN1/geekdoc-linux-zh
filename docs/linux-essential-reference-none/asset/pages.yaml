  md: '# Text Utilities: gawk


    The following gawk script assumes that the input file is in Apache log file format,
    where each line of text represents one HTTP transfer and the seventh space-delimited
    field contains the name of the transferred file. The script counts the number
    of GIF (.gif) and the number of JPEG (extension .jpg) files transferred. It also
    gives the total number of records at the end.


    ```

    #!/usr/bin/gawk -f

    #Initialize counters to zero and print report header. We also want to make

    #pattern matching insensitive to upper or lower case.

    BEGIN {gifs = 0; jpegs = 0;

    IGNORECASE=1;

    print "GIFs\tJPEGs\n";}


    #Increment GIF counter if field 7 ends in ".gif".

    match($7,/\.gif$/) {gifs++}


    #Increment JPEG counter if field 7 ends in ".jpg".

    match($7,/\.jpg$/) {jpegs++}


    #Print report trailer.

    END {

    printf "%d\t%d\t%d\n", gifs, jpegs;

    printf "Total Records: %d\n", NR;

    }

    ```


    The following bash script uses gawk to print a count of the lines, words, and
    characters in the files given as arguments. The format is similar to that of the
    output from we.


    ```

    #!/bin/bash

    for i in "@"; do

    #Initialize counters

    gawk ''BEGIN {chars = 0; words = 0};

    #Number of characters is line length

    #plus one for the newline character.

    chars += length($0)+1;

    #Number of words in the line is the number of fields.

    words += NF;

    #Print summary for current file.

    END {printf "%d\t%d\t%d\t%s\n", NR, words, chars, FILENAME};'' "$i"

    done

    ```


