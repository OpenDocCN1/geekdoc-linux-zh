  md: '# Managing Swap Space


    This section describes commands used to format, enable, and disable swap space.


    # mkswap


    ```

    mkswap [ - c ] SPECIALFILE [ SIZE_IN_BLOCKS ]

    ```


    mkswap sets up a Linux swap area on a device or in a file. The SPECIALFILE is
    usually one of these forms:


    +   - /dev/hda[N]

    - /dev/hdb[N]

    - /dev/sda[N]

    - /dev/sdb[N]


    where N is a number from 1 to 8. SPECIALFILE can also be a regular disk file.
    The SIZE-IN-BLOCKS parameter is the desired size of the filesystem, in blocks.
    This information is determined automatically by mkswap if it''s omitted. Block
    counts are rounded down so that the total size is an integer multiple of the machine''s
    page size. Only block counts in the range MINCOUNT, .MAXCOUNT are allowed. If
    the block count exceeds the MAXCOUNT, it''s truncated to that value and a warning
    message is issued.


    The MINCOUNT and MAXCOUNT values for a swap area are as follows:

    MINCOUNT = 10 * PAGE_SIZE / 1024

    MAXCOUNT = (PAGE_SIZE) * 8 * PAGE_SIZE / 1024


    To set up a regular file for swapping, create that file before running mkswap.
    A sequence of commands similar to the following is reasonable for this purpose:

    dd if=/dev/zero of=swapfile bs=1024 count=8192

    mkswap swapfile

    sync

    The -c option is used to check the device for bad blocks before creating the filesystem.
    If any are found, the count is printed. This option is meant to be used for swap
    partitions only, and shouldn''t be used for regular files. To make sure that regular
    files don''t contain bad blocks, the partition that contains the regular file
    should have been created with mkfs -c.


    # swapoff and swapon


    ```

    swapoff [ -h -V ]

    apon [ -a -v ]

    apon [ -v ] -p PRIORITY ] SPECIALFILE ...

    swapoff [ -h -V ]

    swapoff -a

    swapoff SPECIALFILE ...

    ```


    swapon enables devices for files and paging for swapping, swapoff disables them.'
  merge: -1
  pgno: 281
