  md: '# The Kernel and Its Interfaces: syslogd 200


    # Kernel Message Logs


    This section describes the facilities used for system and kernel logging and the
    trapping of kernel messages.


    # dmesg


    ```

    dmesg [ -c ] [ -n LEVEL ]

    ```


    dmesg is used to examine and control the kernel ring buffer. dmesg is used mainly
    to print boot-up messages.


    | Option | Description |

    | -c | Clears the ring buffer contents after printing. |

    | -n LEVEL | Sets the LEVEL at which logging of messages is done to the console.
    -n1 prevents all messages (except panic messages) from appearing on the console.
    All levels of messages are still written to /proc/kmsg, so syslog can still be
    used to control exactly where kernel messages appear. When the -n option is used,
    dmesg will not print or clear the kernel ring buffer. |


    # syslogd


    ```

    syslogd [ -d ] [ -f CONFIG_FILE ] [ -h ] [ -l HOSTLIST ] [ -m INTERVAL ] [ -n
    ] [ -p SOCKET ] [ -r ] [ -s DOMAINLIST ] [ -v ]

    ```


    Two system utilities provide support for system logging and kernel message trapping.
    Support of both Internet and UNIX local domain sockets enables this utility package
    to support both local and remote logging.


    The main configuration file /etc/syslogd.conf (or an alternative -f option) is
    read at startup. Lines that begin with the hash mark (#) and empty lines are ignored.
    If an error occurs during parsing, the whole line is ignored.


    | Option | Description |

    | -d | Turns on debug mode, which causes syslogd to remain in the foreground and
    log debug information to the terminal. |

    | -f CONFIG_FILE | Specifies an alternative configuration file. |

    | -h | Forwards any message it receives to forwarding hosts that have been defined.
    |

    | -l HOSTLIST | Specifies a hostname that should be logged only with its simple
    hostname and not the fully qualified domain name. Multiple hosts can be specified
    using the colon (:) separator. |

    | -m INTERVAL | syslogd a mark timestamp regularly. The default interval between
    marks is20 lines. This setting can be changed with the -m option. |

    | -n | Avoid auto-backgrounding. This is needed especially if syslogd is started
    and controlled by init. |

    | -p SOCKET | Use SOCKET instead of /dev/log. |


    continues >>'
  merge: -1
  pgno: 228
- img_proc: true
  md: '>>continued


    | Option | Description |

    | --- | --- |

    | -r | Enables the facility to receive messages from the network using an Internet
    domain socket with the syslog service. The default is not to receive any messages
    from the network. |

    | -s DOMAINLIST | Specifies a domain name that should be stripped off before logging.
    Multiple domains can be specified using the colon (:) separator. If multiple domains
    are specified, the first match is the one used. |

    | -v | Print version and exit. |'
