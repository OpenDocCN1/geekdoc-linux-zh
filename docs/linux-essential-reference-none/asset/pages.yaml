    # Processing Binary Files


    Relocatable binary files are the direct result of source code compilation. The
    relocatable binaries are then combined to produce executable programs and libraries.
    This section describes the commands used to manipulate relocatable and executable
    binaries. These commands are often invoked from make scripts in the process of
    building software from source code.


    # ar


    ```

    ar [-]P [REPOS] ARCHIVE [ MEMBER ...]

    ar -M

    ```


    ar creates, modifies, and extracts from archives. An archive is a single file
    holding a collection of other files in a structure that makes it possible to retrieve
    the original individual files (called members of the archive). The attributes
