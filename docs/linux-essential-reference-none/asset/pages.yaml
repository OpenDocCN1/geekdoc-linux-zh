  md: '# Text Utilities: gawk 45


    For each line of input, gawk executes ACTIONS if the line matches PATTERN. For
    statements that don''t include PATTERN, gawk executes ACTIONS for each line of
    input. For statements that don''t include ACTIONS, gawk prints each input line
    that matches PATTERN. function statements are used to create a user-defined function
    consisting of ACTIONS to be applied to values specified in PARAMETERS.


    # Patterns


    Patterns used by gawk fall into several classes:


    +   - /REGEX/—These patterns match when input-line text matches the regular expression
    REGEX.


    +   - EXPRESSION—These patterns match when EXPRESSION is nonzero (if numeric)
    or non-null (if a string).


    +   - PATTERN1—A pair of patterns is used to select ranges of consecutive input
    records. PATTERN1 matches the first record in each range and PATTERN2 matches
    the second record in each range.


    +   - BEGIN and END—These are used to specify startup and cleanup actions. The
    associated actions for BEGIN are executed prior to any input records being read.
    The actions for END are executed after all input records have been read and processed.


    # Variables, Records, and Fields


    Variables and fields may be floating-point numbers, strings, or both. They''re
    typed dynamically based on their context.


    Records are normally separated by the character or regular expression contained
    in the RS variable. If RS is set to the null string, the records are separated
    by blank lines.


    Fields are separated by the character or regular expression contained in the FS
    variable. If FS is the null string, each character is a separate field. The FIELDWIDTHS
    variable can be used to define fixed-width fields. In this case, the FS is ignored.
    Assigning a new value to FS overrides the use of FIELDWIDTHS.


    Each field can be referenced by its position in the input record. The first field
    is $1 and the last field is $NF, since the variable NF indicates the number of
    fields in the current input record. The $0 refers to the entire input record.
    References to fields beyond NF are null strings but are assignable.


    Assignments to fields beyond NF increase the value of NF, assign the value to
    $NF, and assign null values to any intervening fields. The new intervening fields
    will be separated by the value of OFS.


