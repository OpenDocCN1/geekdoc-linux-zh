    \ to the list of commands. |\n -h | Print usage summary (same as --help). |\n\
    \ -n or --quiet or --silent | Suppress default output. |\n -V | Print the version\
    \ number (same as --version). |\n\n# Operations\n\nsed operates on each line of\
    \ input as follows:\n\n+   - The line, not including the newline character, is\
    \ copied into a temporary buffer known as a pattern space.\n- All editing commands\
    \ which addresses match the pattern space are sequentially applied to the pattern\
    \ space.\n- When reaching the end of the command list, the pattern space is written\
    \ to the standard output (except when the -n option is in effect) with an appended\
    \ newline.\n- The pattern space is cleared and the process is repeated with the\
    \ next line of input.\n\nsed leaves original files unchanged. In addition to the\
    \ pattern space, some commands use a hold space for temporary storage of partial\
    \ results.\n\n# Addresses\n\nsed uses addresses to determine whether certain commands\
    \ should be applied to an input line. Addresses take the following forms:\n\n\
    +   - A line number represented in decimal. Line numbers are cumulative across\
    \ the entire set of input files and not reset.\n- A regular expression.\n- The\
    \ $ that addresses the last line of input.\n- N-M, which matches any line where\
    \ the line number M is N. If M is Q missing, 1 is used in its place."
