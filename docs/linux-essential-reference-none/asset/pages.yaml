  md: '# 10 The Kernel and Its Interfaces


    The kernel is responsible for managing hardware resources, which includes the
    CPU (or CPUs in a multiprocessor system), memory, and I/O devices. Kernels are
    contained in files that are loaded into memory when the system is booted and remain
    resident in memory until the system is rebooted.


    Kernel modules are components of the kernel that can be loaded and unloaded as
    required. Modules are usually used to provide hardware or system-support services
    that are often not needed. They''re loaded when these services are required and
    can be unloaded when the services are no longer needed.


    This chapter describes the configuration, building, and installation of kernels
    and kernel modules. It also describes commands and special files that can be used
    to query a kernel''s internal state.


    # Installing New Kernels


    This section describes the configuration, building, and installation of kernels
    and kernel modules.


    # Configuring the Kernel


    ```

    make config

    make menuconfig

    make xconfig

    ```


    These commands, when issued from the root of the kernel source tree (typically
    but not necessarily /usr/src/linux), are used to configure the kernel. This step
    should be followed by a make dep, which sets up the file dependencies. These file
    dependencies are used by make to control the building of the kernel. For more
    information on make, see Chapter 4, "Programming."


    When configuring the kernel, you should take several precautions:


    +   - Make sure that the right processor type is specified. For example, a kernel
    compiled for a Pentium can''t run on a 486 and will fail to boot.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Building the Kernel


    Building a new kernel starts of one or more of the following steps:


    +   * make zImage—Creates a compressed kernel image.

    * make zdisk—Makes a boot disk if a disk is in drive A.

    * make zlilo—If the Linux loader (lilo) is set up, makes a new kernel, copies
    it to its boot location (commonly /mlinuz), and runs the LILO installer to update
    the load map.

    * make bzImage—Use this for kernels that are too large for make zImage.


    # Installing a New Kernel


    If zilo was used to build the new kernel, the installation is already complete.
    Otherwise, the new kernel image should be copied from where it was built (usually
    /usr/src/linux/arch/i386/boot/zImage) to either a boot floppy or its location
    on the hard disk.


    Installation on a bootable floppy is already complete if make zdisk was. Otherwise,
    this command will make /usr/src/linux/arch/i386/boot/zImage /dev/fdb0


    If installation on hard disk is required, the new kernel needs to be copied to
    its boot location; you can find this by looking at /etc/lilo.conf. Then /bin/lilo
    must run to update the loading map; otherwise, the system won''t boot.


    It''s advisable to keep a backup copy of the old kernel in case there are problems
    with the new one. Also, /etc/lilo.conf should be edited so that the system will
    boot from the old one if new one fails to boot.


    # Building and Installing Modules


    If the m (module) switch was selected for any of the configuration options, the
    make modules command should be issued from the root of the kernel source after
    the kernel is built.


    Next, issue the command make modules_install to copy the new modules into subdirectories
    under /lib/modules/KERNEL_RELEASE, where KERNEL_RELEASE is the version number
    of the current kernel.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# The Kernel and Its Interfaces: genksym 195


    # Using Modules


    This section describes the commands and utilities that use and manage modules.


    # depmod


    ```

    depmod -a [VERSION]

    depmod MODULE_NAME ...

    ```


    depmod creates a dependency file that describes the dependencies between modules
    using makefile syntax. The dependency file later be used by modprobe for loading
    the relevant modules automatically. The -a option creates a dependency file for
    all modules in /lib/VERSION, where VERSION is the kernel version. The second form
    creates a dependency for the files named on the command line. The behavior of
    both depmod and modprobe is controlled by the configuration file /etc/conf.modules.


    # genksym


    ```

    genksym [ -wq ] [ -dD ] [ -V VERSION [ p STRING ] [ OUTPUT_DIRECTORY ]

    ```


    genksym reads preprocessed C source (the output from gcc -E) on standard input
    and generates a file containing version information. On the output format indicated
    by the -k option, the output is written to a .ver file in the named OUTPUT_DIRECTORY
    or to the standard output.


    genksym normally looks for explicit symbol-table definitions in the source file.
    All definitions and declarations of typedef, struct, union, and enum are saved
    for later expansion. Every global symbol is also saved, with pointers that will
    enable a full expansion later on.


    When a symbol is found in the source, the symbol is expanded to its full definition,
    where all structs, unions, and typedefs are expanded down to their basic parts,
    recursively. This final string is used as input to a CRC algorithm that will give
    an integer that changes as soon as the symbol''s structure changes.


    The version information in the kernel normally looks like this:


    ```

    symbol1-12345678

    ```


    12345678 is the hexadecimal representation of the CRC.


    | Option | Description |

    | --- | --- |

    | -D | Dumps expanded symbol definitions to stderr. |

    | -d | Outputs debugging information. Repeating... Level 1 generates moderate
    information about the actions being taken. Level 2 enables parser-recognition
    output. Level 3 enables lexical-analysis output. |

    | -k | Specifies the version of the kernel to generate output. Omitting this option
    assumes a version below 2.1.0. Versions below 2.1.18 use checksum version 1 and
    produce their output in the directory given on the command line.Versions 2.1.18
    and above use checksum version 2 and produce their output on standard output.
    |


    continues >>'
  merge: -1
