  md: '# Shell Utilities: sudo 21


    # su


    su [ OPTION ... ] [ USER ARG ... ]


    su enables the invoking user to temporarily become USER. A shell is invoked with
    the specified ARGS. If no USER is given, USER defaults to root, the superuser.
    If USER has a password, it prompts for the password, unless the invoking user
    has an effective ID of zero (the superuser). The shell to use is taken from USER''s
    passwd entry, or /bin/sh if none is specified.


    The following OPTIONS apply:


    | Option | Description |

    | --- | --- |

    | -c COMMAND or --command=COMMAND | Passes COMMAND (a single command line to run)
    to the shell with a -c option, instead of starting an interactive shell. |

    | -f or --fast | Passes the -f option to the shell. |

    | -l or --login | Makes the shell a login shell. |

    | -m or -p --preserve-environment | Don''t change the environment variables HOME,
    USER, LOGNAME, or SHELL. |

    | -s SHELL or --shell=SHELL | Runs SHELL instead of the shell from USER''s password
    entry. |


    # sudo


    sudo [ OPTION ... ] COMMAND


    sudo allows a permitted user to execute COMMAND as the superuser or as the user
    specified the -u option. sudo determines who is an authorized user by consulting
    the file /etc/sudoers. A timestamp file with the same name as the user''s name
    and contained in /var/run/sudo is used to determine whether password prompting
    is necessary. If the timestamp is older than N minutes (where N was defined when
    sudo was compiled), the user will be prompted for the necessary password.


    The following table describes the options accepted by sudo.


    | Option | Description |

    | --- | --- |

    | - | Stops processing command-line arguments. |

    | -b | Runs the given command in the background. Shell job control cannot be used
    if the -b option is used. |

    | -H | Sets the HOME environment variable to the home directory of the target
    user as specified in /etc/passwd. |

    | -h | Prints the version and usage message and exits. |

    | -k | Removes the user''s timestamp file, thus requiring a password the next
    time sudo runs. |

    | -l | Lists the allowed commands for the user on the current host. |

    | -p PROMPT | Uses PROMPT as the default password prompt. If the password contains
    the %u escape, %u will be replaced by the user''s login name. Similarly, %% will
    be replaced by the local hostname. |

    | -s | Runs the shell specified by the SHELL environment variable (if set) or
    the shell as specified in /etc/passwd. |


    continues >>'
  merge: -1
