  md: '# Output File Subsets


    The commands in this section output selected parts of their inputs, such as the
    first few or last few lines.


    # csplit


    ```

    csplit [ OPTION ... ] INPUT PATTERN ...

    ```


    csplit splits INPUT (standard input if INPUT is -) into sections. Each section
    is output to a separate file. The section boundaries are determined by the PATTERN
    arguments described in the following table. An error occurs if a PATTERN refers
    to a nonexistent line of the input file. After all PATTERNS are matched, the remaining
    input is copied into one last output file. csplit prints the number of bytes written
    to each output file after it has been created.


    | Pattern | Description |

    |---|---|

    | N | Creates an output file containing the input to but not including N. If followed
    by a repeat count, also creates an output file containing the next N lines of
    the input file once for repeat. |

    | /REGEXP[OFFSET] | Creates an output file containing the current line up to (but
    not including) the next line of the input file that contains a match for REGEXP.
    The optional OFFSET is + or - followed by a positive integer. If it''s given,
    OFFSET is put into the matching line or minus the output file, and the following
    line begins the next section. |

    | %REGEXP[OFFSET] | Same as the previous type except that no output file is created
    for the corresponding section. The type is to used to suppress the generation
    of a section delimited by REGEXP. |

    | {REPEAT-COUNT} | Repeats the pattern REPEAT-COUNT additional times. REPEAT-COUNT
    can be either a positive integer or an asterisk (*). The asterisk means that the
    repetition continues until the input is exhausted. |


    The output file names consist of a prefix (xx by default) followed by a suffix.
    By default, the suffix is an ascending sequence of two-digit numbers from 00 to
    99. In any case, concatenating the output files in sorted order by filename produces
    the original input file.


    By default, if csplit encounters an error or receives a hangup, interrupt, quit,
    or terminal signal, it removes any output files that it has created so before
    it exits.'
  merge: -1
