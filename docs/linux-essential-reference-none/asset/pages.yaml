- img_proc: true
  md: '# bootpd and bootpgw


    ```

    bootpd [ -v ] [ -i -s -t TIMEOUT -d LEVEL -c CHDIR_PATH]

    -w bootptab DUMPFILE ]

    ```


    ```

    bootpgw [ -v ] [ -i -s -t TIMEOUT -d LEVEL ] SERVER

    ```


    bootpd implements an Internet Bootstrap Protocol (BOOTTP) server as defined in
    RFC951, RFC1532, and RFC1532, and RFC1533. It''s usually invoked by inetd but
    can be run in a standalone mode from a shell. Standalone mode is particularly
    useful when bootpd is used with a large configuration database, where the startup
    delay might otherwise prevent timely response to client requests. The configuration
    database is BOPTAB. If bootpd is not installed, /etc/bootptab is used. DUMPFILE
    is the file into which bootpd will dump its internal database when it receives
    a SIGUSR1 signal. This option is recognized only if it was compiled with -DDEBUG
    flag.


    bootpgw implements a simple BOOTTP gateway that can be used to forward requests
    and responses from clients on one subnet and a BOOTTP server (which is bootpd)
    on another subnet. bootpgw can also run in standalone mode, but this is not very
    useful since it has very little startup delay because it doesn''t read a configuration
    file. SERVER is the name of the BOOTTP server to which bootpgw will forward BOOTREQUEST
    packets.


    While either bootpd or bootpgw will forward BOOTREPLY packets, only bootpgw will
    forward BOOTREQUEST packets.


    | Option | Description |

    | -c CHDIR_PATH | Sets the current directory by bootpd while checking the existence
    and size of client files |

    | -d DEBUG_LEVEL | Sets the DEBUG_LEVEL variable that controls the number of debugging
    messages generated. For example, -d4 or -d 4 will set the debugging level to 4.
    For compatibility with older versions of bootpd, omitting the numeric parameter
    will simply increment the debug level by one |

    | -i | Forces inetd mode. This option is obsolete, but remains for compatibility
    with older versions of bootpd |

    | -s | Forces standalone mode. This option is obsolete, but remains for compatibility
    with older versions of bootpd |

    | -t TIMEOUT | Specifies the timeout value (in minutes) that a bootpd process
    will wait for a BOOTTP packet before exiting. If no packets are received for TIMEOUT,
    the program will exit A TIMEOUT value of 0 (zero) means "run forever". In standalone
    mode, this option is forced to zero |

    | -v | Prints the version and exits |


    # bootpef


    bootpef OPTION ... [ CLIENT_NAME ... ]


    bootpef builds the Extension Path files described by RFC 1497 (tag 18). If any
    CLIENT_NAME arguments are specified, bootpef compiles the extension files for
    those clients.'
  merge: -1
