    be a device such as /dev/null) instead of /boot/boot.NNNN, where NNNN is the device
    number of the boot device. |

    | boot=BOOT_DEVICE | Sets the name of the device (usually a hard disk partition)
    that contains the boot sector. If this isn''t specified, the currently mounted
    root device will be used. |

