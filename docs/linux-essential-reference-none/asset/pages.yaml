  md: '# quotacheck


    quotacheck [ -g ] [ -u ] [ -v ] -a

    quotacheck [ -g ] [ -u ] [ -v ] FILESYSTEM ...


    quotacheck performs a filesystem scan for usage of files and directories used
    by either user or group. The output is the quota file for the corresponding filesystem.
    By default, the names for these files are as follows:


    +   - User scan: quota.user.

    - Group scan: quota.group.


    The resulting file contains a struct dbqlk for each possible ID up to the highest
    user ID or group ID contains the values for the disk file, block usage, and possibly
    excess time for these values (definitions of struct dbqlk, see <linux/quota.h>).


    quotacheck should be run each time the system boots and mounts non-valid filesystems.
    This is most likely to happen after a system crash.


    # quotaon and quotaoff


    quotaon [ -vug ] FILESYSTEM ...nquotaon [ -avug ] ...nquotaoff [ -vug ] FILESYSTEM
    ...nquotaoff [ -avug ] ...


    quotaon announces to the system that disk quotas should be enabled on one or more
    filesystems. The filesystem quota files must be present in the root directory
    of the specified filesystem and be named userquota or quota.group for groupquota.


    quotaoff announces to the system that the filesystem(s) specified should have
    any disk quotas turned off.


    # Options for quotaon


    | Option | Description |

    | -a | All filesystems in /etc/fstab marked read-write with quotas will have their
    quotas turned on. This is normally used at boot time to enable quotas. |

    | -g | Manipulates group quotas. |

    | -u | Manipulates user quotas. This is the default. |

    | -v | Displays a message for each filesystem where quotas are turned on. |


    # Options for quotaoff


    | Option | Description |

    | -a | Forces all filesystems in /etc/fstab to have their quotas disabled. |

    | -g | Manipulates group quotas. |

    | -u | Manipulates user quotas. This is the default. |

    | -v | Displays a message for each filesystem affected. |'
