  md: '# Filename Manipulation


    The commands in this section operate on filenames and pathnames.


    # basename


    ```

    basename NAME [ SUFFIX ]

    ```


    basename removes any leading directory components from NAME. If SUFFIX is specified
    and is identical to the end of NAME, it''s removed from NAME as well.

    bename prints the result on standard output. For example, the command


    ```

    basename /usr/bin/script.pl

    ```


    prints


    ```

    script.pl

    ```


    If the .pl extension is also given, the command


    ```

    basename /usr/bin/script.pl .pl

    ```


    prints


    ```

    script

    ```


    # dirname


    ```

    dirname NAME

    ```


    dirname prints all the final slash-delimited component of a string (presumably
    a filename). If NAME is a single component, dirname simply prints a period (.),
    if any of these conditions is true:


    # pathchk


    ```

    pathchk [ OPTION ... ] NAME ...

    ```


    pathchk checks the portability of filenames. For each NAME, pathchk prints a message
    if any of these conditions is true:


    +   - One of the existing directories in NAME doesn''t search (execute) permission.

    - The length of NAME is larger than its filesystem''s maximum length.

    - The length of one component of NAME, corresponding to an existing directory
    name, is larger than its filesystem''s maximum length for a filename component.


    pathchk has a single option, described in the following table:


    | Option | Description |

    | --- | --- |

    | -p or --portability | Instead of a length check, pathchk checks the filename
    and its components against the POSIX.1 minimum length and character set specification.
    |'
