  md: '# The Kernel and Its Interfaces: Device Files (MAKEDEV) 19


    # modprobe


    modprobe MODULE_FILE [symbol=VALUE ...]

    modprobe -t TAG PATTERN

    modprobe -a -t TAG PATTERN

    modprobe -l [ -t TAG ] PATTERN

    modprobe -r MODULE probe -c


    modprobe can be used to load or unload one or more modules based on supplied module
    names, filename patterns, and dependency information supplied by depmod. It can
    also be used to list information related to module loading and configuration.
    The behavior of both depmod and modprobe is controlled by the configuration file
    /etc/conf.modules.


    | Option | Description |

    | -a PATTERN | Adds the modules with the names matching PATTERN, along with modules
    on which they depend. |

    | -c | Prints all configuration information. |

    | -l PATTERN | Lists all modules with a name matching PATTERN. |

    | -r MODULE | Removes the MODULE and all modules on which it depends. |

    | -t TAG | Selects the modules in the subdirectory TAG. |


    # rmmod


    rmmod [ -as ] MODULE ...

    rmmod unloads loadable modules from the running kernel.


    | Option | Description |

    | -a | Removes all unused modules. |

    | -s | Outputs everything to syslog instead of the terminal. |


    # Device Files (MAKEDEV)


    MAKEDEV [ -vcdnhIV ] NAME ...


    MAKEDEV maintains the device file entries in the /dev directory. MAKEDEV uses
    names and device numbers contained in one or more of the following:


    +   - /etc/devinfo—Device information.

    - /usr/local/etc/devinfo.local—Local device information.

    - /etc/devinfo.local—Alternate location for local device information.

    - /etc/makedev.cfg—File containing user and group ownerships and permissions for
    devices.

    - /proc/devices—Virtual file containing the names and major device numbers of
    devices supported under the current configuration.'
