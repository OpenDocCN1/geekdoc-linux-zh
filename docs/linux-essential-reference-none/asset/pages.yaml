    # kdstat


    kdstat kdstat [debug;nodebug] kdstat [keep;nokeep] kdstat flush kdstat delay=TIME


    kdstat is used to view or change the state of the currently running kerneld. It
    is also used to debug the kernel.


    | Option | Description |

    | --- | --- |

    | debug | Turns debugging mode. When debugging mode is on, kerneld displays what
    it''s doing on the console. |

    | delay=TIME | Changes the time (in seconds) that kerneld waits before removing
    an unused module from the kernel. |

    | flush | Flushes the IPC message queue used to communicate with kerneld. |

    | keep | Turns on the keeping of modules. When keeping is off (the default), modules
    are unloaded when they haven''t been used for a while. |

    | nodebug | Turns off debugging mode. |

    | noke | Turns off the keeping of modules. |


    # kerneld


    ```

    kerneld [ debug ] [ keep ] [ delay=SECONDS ] [ type=MESSAGE_NUMBER ]

    ```


    In addition to removing modules that aren''t in use, kerneld performs kernel actions
    from user space in response to the requests from the kernel via a dedicated IPC
    queue.


    | Option | Description |

    | --- | --- |

    | debug | Enables debugging mode. This can also be turned by kdstat. |

    | delay=SECONDS | Changes the time for removal of unused modules. |

    | keep | Ignore all requests for unloading modules. |

    | type=MESSAGE_NUMBER | If MESSAGE_NUMBER is positive, only listen to messages
    with that type. The default is -255, which means kerneld will listen for all the
    messages where the type is less than or equal to 255. |'
