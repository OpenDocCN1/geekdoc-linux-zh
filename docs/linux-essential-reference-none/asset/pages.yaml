    # pppd


    ```

    pppd [ TTY_NAME ] [ SPEED ] [ OPTIONS ]

    ```


    pppd is the Point-to-Point Protocol (PPP) daemon. It''s the preferred method for

    transmitting datagrams over serial point-to-point links. PPP is composed of three

    parts: a method for encapsulating datagrams over serial links, an extensible Link

    Control Protocol (LCP), and a family of Network Control Protocols (NCP) for

    establishing and configuring different network-layer protocols.


    The encapsulation scheme is authenticated by driver code in the kernel provides

    the basic LCP, authentication support, and an NCP for establishing and configuring

    t Internet Protocol (IP)—called the IP Control Protocol, or IPCP.


    pppd accepts a large number of command-line options. The most frequently used

    options are listed in the following table:


    | Option | Description |

    |---|---|

    | SPEED | Sets the baud rate to SPEED (in decimal). |

    | TTY_NAME | Name of the serial device over which communication

    take place. The /dev prefix will be added, if

    necessary. If no device name is given, or if the name of

    the terminal connected to the standard input is given,

    pppd will use that terminal, and will not fork to put\itself in the background.
    |'
