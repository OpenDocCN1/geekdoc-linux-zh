  md: '# User Management: quota


    | Option | Description |

    |---|---|

    | -u | Edits the quota for the user NAME. This is the default. |

    | -g | Edits the quota for the group NAME. |

    | -p | Duplicates the quotas of the specified prototypical user for each specified
    user. This is the normal mechanism to initialize quotas for groups of users. |

    | -t | Edits the time limit for each filesystem. If the time limits are zero,
    the default time limits in <linux/quota.h> are used. Time units of sec(nds), min(utes),
    hour(s), day(s), week(s), and month(s) are understood. Time limits are printed
    in the greatest possible time unit that the value is greater than or to 1. |


    # quota


    ```

    quota [ -guv | -q ]nquota [ -uv | -q ] USER

    quota [ -gv | -q ] GROUP

    ```


    quota displays users'' disk usage and limits. By default only the quotas are printed.
    Specifying both -g and -u displays both the quotas and the group quotas (for the
    user).


    Only the superuser can use the -u flag and the optional USER argument to view
    the limits of other users. Normal users can use the -g flag and optional GROUP
    argument to view only the limits of groups of which they''re members.


    The -q flag takes precedence over the -v flag.


    quota reports the quotas of all the filesystems listed in /etc/fstab. For filesystems
    that are NFS-mounted, a call to the rpc-quotaad on the server machine is performed
    to get the information. If quota exits with a nonzero status, one or more filesystems
    are over quota.


    | Option | Description |

    |---|---|

    | -g | Prints group quotas for the group of which the user is a member. |

    | -u | This option is equivalent to the default. |

    | -v | Displays quotas on filesystems where no storage is allocated. |

    | -q | Prints a message containing only information on filesystems where usage
    is over quota. |'
