    tcpdmatch predicts how the TCP wrapper will handle a specific request for service.


    | Option | Description |

    | --- | --- |

    | CLIENT | CLIENT is a hostname, network address, or one of the unknown or wildcard
    patterns. |

    | DAEMON | DAEMON is the process name. This is typically the last component of
