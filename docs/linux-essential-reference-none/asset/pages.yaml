    # Network File System (NFS)


    Sharing files with remote hosts using the Network File System (NFS) protocol.


    # mountd and rpc.mountd


    mountd OPTION ...

    mount handles the mounting of local filesystems to remote directories through
    NFS. When receiving a mount request from an NFS client, it checks the request
    against the list of exported filesystems in /etc/exports. If the client is permitted
    to mount the filesystem, mount creates a file handle for the requested directory
    and adds an entry to /etc/rmtab. On receipt of a mount request, it removes the
    client''s entry from rtab. mountd can also be started by inetd rather than boot
    time. This can be enabled by adding the following lines to the configuration file
    for inetd:


    ```

    mount/1-2 dgram rpc/udp wait route /usr/sbin/rpc.mountd mountd

    mount/1-2 stream rpc/tcp wait route /usr/sbin/rpc.mountd mountd

    ```'
