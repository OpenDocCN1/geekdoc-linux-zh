  md: '# rwho


    rwho [ -a ]

    rwho produces output similar to that produced by who but for all machines on the
    local network. Users with more than an hour of idle time are omitted from the
    listing unless the -a flag is used.


    # File and Data Transfers


    This section describes commands that provide network file and data transfers.


    # fromport


    fromport [ -v ] PORT

    fromport is a simple client that reads from the selected TCP/IP PORT. Typically
    the data will be generated by the companion client toport. The -v option selects
    verbose mode, which is intended for debugging.


    # ftp


    ftp [ OPTION ... ] [ HOST ]

    ftp is an interactive client that uses the ARPANET standard File Transfer Protocol
    (FTP) to transfer files between the local host and a remote host specified by
    HOST.


    # Options for ftp


    ftp accepts the following command-line OPTIONS:


    | Option | Description |

    | --- | --- |

    | -d | Enables debugging. |

    | -g | Disables filename globbing. |

    | -i | Turns off interactive prompting during multiple file transfers. |

    | -n | Disables "auto-login" on initial connection to the host. |

    | -v | Verbose mode. This forces ftp to show all responses from the remote server
    as well as report data-transfer statistics. |


    # ftp Commands


    In addition to command-line OPTIONS, the following commands can be executed from
    within ftp:


    | Command | Description |

    | --- | --- |

    | ![COMMAND [ARG ... ]] | Executes COMMAND locally with the argument(s) (ARG).
    If COMMAND isn''t given, invokes an interactive shell on the local machine. |

    | $MACRO_NAME [ ARG ... ] | Executes the macro MACRO_NAME that was previously
    defined using the macdef command. |


    continues >>


    +   *'
