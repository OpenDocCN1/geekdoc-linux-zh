    MAGIC_NUMBER. |


    # Serial Line IP Networking


    Serial Line IP (SLIP) and Point-to-Point Protocol (PPP) setup and configuration.

    To use these protocols, TCP/IP networking must be enabled in the kernel, along
    with support for the PPP and/or SLIP network devices. Although serial line IP
    is typically used over modem, these protocols can be used over any serial point-to-point
    connection.


    # chat


    chat [ OPTION ... ] [ SCRIPT ]

    chat executes the dialogue between computer and modem that''s required to establish
    the connection between the local Point-to-Point Protocol daemon (pppd) and pppd
    on the remote host.'
  merge: -1
