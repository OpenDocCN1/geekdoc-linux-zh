  md: '# .hosts


    The `$HOME/.hosts` file grants or denies trusted access (no passwords required)
    via the r-commands (`login, rsh, rcp, and so on`). Entries take the following
    form:


    HOSTNAME [USERNAME]


    The entry grants trusted r-command access for the user with login name USERNAME
    from remote host HOSTNAME. If USERNAME is not specified, the user must have the
    same login name on the remote host as the local host. It is advisable to always
    use the fully-qualified domain name and not the shortest hostname for HOSTNAME.


    Netgroups can be specified by preceding the netgroup with the (@) sign.


    The .hosts file must have permissions 600 (readable and writable only by the owner).


    # /etc/hosts.equiv


    /etc/hosts.equiv grants or denies trusted (no passwords required) access via r-commands
    (`login, rsh, rcp, and so on`). Each entry is in this format:


    [ + | ] [HOSTNAME] [USERNAME]


    HOSTNAME is the name of a host that''s logically equivalent to the local host.
    Users logged into that host are allowed to access like-named user accounts on
    the local host without supplying a password. HOSTNAME can be optionally preceded
    by the plus (+) sign. If the plus sign is used alone, it allows any host to access
    the system. Access can be denied by using the minus (-) sign. Users from that
    host must always supply a password. It is advisable to always use the fully-qualified
    domain name for HOSTNAME.


    USERNAME grants a specific user access to all user accounts except root without
    supplying a password. The user is not restricted to like-named accounts. USERNAME
    can be optionally preceded by the + sign. This can be explicitly denied to a specific
    user by preceding the username with the - sign. This says that the user is not
    trusted, no matter what other entries exist for that host.


    Netgroups can be specified by preceding the netgroup with the @ sign.


    # /etc/netgroup


    /etc/netgroup defines network-wide groups. Each line of the netgroup file defines
    a group and has this form:


    GROUPNAME MEMBER ...


    where GROUPNAME is the name of the group and MEMBER takes the following form:
    (HOSTNAME, USERNAME, DOMAINNAME)


    Any of the three fields can be empty. An empty field signifies a “wildcard”—for
    example, the group universal (,,) to which everyone belongs.


    The groups defined in netgroup are referenced in various network-access control
    schemes.'
  merge: -1
