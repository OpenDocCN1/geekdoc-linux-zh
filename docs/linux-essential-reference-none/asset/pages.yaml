  md: '# Creating Filesystems


    This section describes commands used to create filesystems.


    # mke2fs


    mke2fs [ OPTION ... ] DEVICE [ BLOCKS_COUNT ]


    mke2fs is used to create a Linux second extended filesystem on the device specified
    by the block special device DEVICE (usually a disk partition). BLOCKS_COUNT is
    the number of blocks on the device. If BLOCKS_COUNT is omitted, mke2fs automatically
    determines the filesystem size.


    | Option | Description |

    |---|---|

    |-c | Check the device for bad blocks before creating the filesystem |

    |-f FRAGMENT_SIZE | Specifies the size of fragments in bytes |

    |-i BYTES_PER_INODE | mke2fs creates an inode for every BYTES_PER_INODE bytes
    of disk space. This value defaults to 4096. BYTES_PER_INODE must be at least 1024.
    |

    |-l FILENAME | Read the bad blocks list from FILENAME. |

    |-m RESERVED_BLOCKS_PERCENTAGE | Specifies the percentage of blocks reserved for
    the superuser. The default value is 5%. |

    |-o CREATOR_OS | Manually overrides the default value of the "creator OS" field
    of the filesystem. Normally the creator is set by default to the native operating
    system of the mke2fs executable. |

    |-q | Quiet execution. |

    |-v | Verbose execution. |

    |-F | Forces mke2fs to run even if the specified device isn''t a block special
    device. |

    |-L VOLUME_LABEL | Sets the volume label for the filesystem. |

    |-M LAST_MOUNTED_DIRECTORY | Sets the last mounted directory for the filesystem.
    This might be useful for the sake of utilities that keep off the last mounted
    directory to determine where the filesystem should be mounted. |

    |-r REVISION | Sets the filesystem revision for the new filesystem |

    |-R RAID_OPTIONS | Sets RAID-related options for the filesystem. RAID options
    are comma-separated, and can take an argument using the equal (=) sign. |

    |-s | Write superblock and group descriptors only. This is useful if all the superblocks
    and backup superblocks are corrupted and a last-ditch recovery method is needed.
    It causes mke2fs to reinitialize the superblock and group descriptors, while not
    touching the inode table and the block and inode bitmaps. The efsck program should
    be run immediately after this option is used, and there''s no guarantee that any
    data will be salvageable. |'
  merge: -1
  pgno: 268
