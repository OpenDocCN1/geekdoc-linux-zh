  md: '# Regular Expressions


    A regular expression is a pattern that describes a set of strings. Like arithmetic

    expressions, regular expressions can consist of multiple subexpressions and operators.

    This appendix describes the syntax and semantics of regular expressions.


    Most characters, including all letters and digits, are regular expressions in
    and of

    them. There are some characters that have special meanings. These special

    characters are known as metacharacters. Metacharacters can also match themselves
    if

    they are preceded by the backslash (\) character.


    A list of characters enclosed by brackets ([]) matches any character in the list.

    If the first character of the list is a caret (^), it matches any character not
    in the list.

    A range of ASCII characters can be specified by an expression of the form


    FIRST_CHAR_LAST_CHAR. For example, [a-z] will match any lowercase character

    [0-9] will match any digit. The following symbolic class names can be used:


    | [:alnum:] | :print: |

    | [:alpha:] | :punct: |

    | [:ctrl:] | :space: |

    | [:digit:] | :upper: |

    | [:graph:] | :xdigit: |


    The brackets in class names must appear in addition to the brackets delimiting
    the

    list. For example, [[:alnum:]] is equivalent to [0-9a-z]. Most of the metacharacters

    lose their meaning within the brackets. A closing bracket ()) can be an element
    of

    list if it appears. A caret (^) can be part of a list if it''s not. A hyphen (-)
    can be

    part of the list if it''s last.


    Two regular expressions can be concatenated. The resulting regular expression

    matches any string formed by concatenating two substrings that respectively match

    catenated subexpressions.


    Two regular expressions can be joined by the infix operator (|). The resulting
    regular

    expression matches the subexpression on either side of the vertical bar.


    Repetition takes precedence over concatenation, which in turn takes precedence

    alternation. A subexpression can be enclosed in parentheses to override these

    precedence rules.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 284 Regular Expressions


    The following table describes the meanings of some character sequences when used
    in regular expressions:


    | Expression | Meaning |

    |---|---|

    | . | Matches any single character. |

    | \w | Equivalent to [[:alnum:]]. |

    | \W | Equivalent to [^[:alnum:]]. |

    | ^ | Matches the empty string at the beginning of a line. |

    | $ | Matches the empty string at the end of a line. |

    | \< | Matches the empty string at the beginning of a word. |

    | \> | Matches the empty string at the end of a word. |

    | \b | Matches the empty string at the edge of a word. |

    | \B | Matches the empty string if it''s not at the edge of a word. |

    | ? | Matches the preceding item at most once. |

    | * | Matches the preceding item or more times. |

    | + | Matches the preceding item at least once. |

    | {N} | Matches the preceding item N times. |

    | {N,} | Matches the preceding item at least N times. |

    | {N,M} | Matches the preceding item at least N times but not more than M times.
    |

    | \N | If N is a single digit, the substring previously matched by the Nth parenthesized
    subexpression.|


    # Example


    The following shell command can be used to list information on files beginning
    with an alphabetical character and ending with .zip or .gz:


    ```

    ls -1 | grep ''\<[alpha:].].*\.(gz|zip)\>''

    ```


    The ls -1 command is used to generate a file listing containing one line for each
    file with dates, permissions, and so on. The output is piped into grep. The -E
    option enables full regular expression processing within grep. \<[alpha:] subexpression
    makes that the filename begins with a letter. .* allows any other characters to
    be included between the initial letter character and the extension. The literal
    period in the extension is given in the regular expression by the \ subexpression.
    The (gz|zip)\> subexpression says that the filename must end with either gz or
    zip. \> makes sure that gz or zip occurs at the end of the filename and prevents
    files with names like a.zipa or b.gz from being matched.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# B Date Input Formats


    Many commands accepts dates as command–line options. This appendix describes the
    formats accepted by these commands.


    The general format for dates is a string with multiple components separated by
    whitespace. In cases where no ambiguity is introduced, the whitespace can be eliminated.
    The items included in date strings consist of the following:


    +   - Calendar date.

    - Time of day.

    - Day of week.

    - Relative items.

    - Pure numbers.


    # Calendar Dates


    For numeric months, the ISO 8601 format YEAR-MONTH-DAY is allowed, where YEAR
    is any positive number, MONTH is a number from 01 to 12, and DAY is a number from
    01 to 31. A leading zero must be present if a number is less than 10. If YEAR
    is less than 100, then 1900 is added to it to force a date in that century. YEAR
    can also be given as a full four-digit date to specify years beyond 1999. The
    construct MONTH/DAY/YEAR, popular in the United States, is accepted, as is MONTH/DAY,
    omitting the year.


    Literal months can be spelled out in full: January, February, and so on. They
    can also be abbreviated to the first three letters, possibly followed by an abbreviating
    period or dot (.). It''s also possible to write Sept instead of September.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Date Input Formats: Calendar Dates


    When months are written literally, the calendar date may be given as any of the
    following:


    +   - DAY MONTH YEAR

    - DAY MONTH

    - MONTH DAY YEAR

    - DAY-MONTH-YEAR

    - MONTH DAY


    # Time of Day


    The time of day can be given as HOUR:MINUTE:SECOND, where HOUR is a number from
    0 to 23, MINUTE is a number from 0 to 59, and SECOND is a number from 0 to 59.
    SECOND can be omitted, in case it defaults to 0.


    The time can be followed by am, a.m., pm, or p.m. When these are used, the HOUR
    is restricted to values from 1 to 12.


    The time can be followed by a time zone correction expressed as SHMM, where S
    is +(plus) or - (minus), HH is the number of zone hours, and MM is the number
    of zone minutes. When a time zone correction is given this, forces interpretation
    of the time in UTC, overriding any previous specification for the time zone or
    the local time zone. The MINUTE part of the date cannot be edited when a time
    zone correction is used. This is the only way to specify a time zone correction
    by fractional parts of an hour.


    Either am/pm or a time zone correction can be used, but not both.


    # Time Zone


    The time zone part of a date string is the standard abbreviation for an international
    time zone. Included periods are ignored. Military designations use single letters.


    The following table lists the non-DST (Daylight Savings Time) time zones, indexed
    by their hour values.


    | Zone Hour | Abbreviation(s) |

    | +000 | GMT for Greenwich Mean Time, UT or UTC for Universal Coordinated Time,
    MET for Western European, and Z for militaries. |

    | +100 | WAT for West Africa, A for militaries. |

    | +200 | Mid Atlantic, AT for Azores, B for militaries. |

    | +300 | Greenland, C for militaries. |

    | +400 | AST for Atlantic Standard, D for militaries. |

    | +500 | EST for Eastern Standard, E for militaries. |

    | +600 | CST for Central Standard, F for militaries. |

    | +700 | MST for Mountain Standard, G for militaries. |

    | +800 | PST for Pacific Standard, H for militaries. |'
  merge: -1
