    # Initialization and Runlevels


    Initialization is handled by init init is the first process to run after the kernel
    is loaded and is the ultimate ancestor of all user processes. Its primary role
    is to create processes based on data stored in the file /etc/initab. Typical entries
    create processes that prompt for login on serial ports with attached terminals.
    It is also responsible for the management of autonomous processes such as network
    service daemons.'
