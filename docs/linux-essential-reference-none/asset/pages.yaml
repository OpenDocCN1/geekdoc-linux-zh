  md: '# Checking and Tuning Filesystems


    This section describes commands used for tuning filesystems and diagnosing filesystem
    problems.


    # badblocks


    ```

    badblocks [ OPTION ... ] DEVICE_BLOCKS_COUNT [ START_BLOCK ]

    ```


    badblocks is used to search for bad blocks on a device (usually a disk partition).
    DEVICE is the special file corresponding to the device. BLOCKS_COUNT is the number
    of blocks on the device.


    | Option | Description |

    | --- | --- |

    | - BLOCK_SIZE | Specifies the size of blocks in bytes. |

    | - OUTPUT_FILE | Writes the list of bad blocks to the specified file. Without
    this option, badblocks displays the list on its standard output. |

    | -v | Verbose mode. |

    | -w | Use write-mode test. With this option, badblocks scans for bad blocks by
    writing some patterns on every block of the device, reading every block, and comparing
    the contents. This option shouldn''t be used on a device containing an existing
    filesystem because it erases data. |


    # debugfs


    ```

    debugfs [ OPTION ... ] [ DEVICE ]

    ```


    debugfs is a filesystem debugger. It can be used to examine and change the state
    of an ext2 filesystem DEVICE is the special file corresponding to the device containing
    the ext2 filesystem. The following table describes the command-line options.


    | Option | Description |

    | --- | --- |

    | -f CMD_FILE | Read commands from CMD_FILE and execute them. When finished executing
    the commands, exit. |

    | -R REQUEST | Execute the single command REQUEST and then exit. |

    | -w | Opens the filesystem in read-write mode. Read-only mode is the default.
    |


    debugfs is an interactive debugger. It understands a number of commands:


    | Command | Description |

    | --- | --- |

    | cat FILESPEC | Dumps the contents of the inode FILESPEC to standard output.
    |

    | cd FILESPEC | Changes the current working directory to FILESPEC. |

    | chroot FILESPEC | Changes the root directory to be the directory FILESPEC. |

    | close | Closes the currently open filesystem. |

    | clri FILE | Clears the contents of the inode FILE. |'
