  md: '# /etc/rpc


    /etc/rpc file is used to map RPC-based service names to their program numbers
    and vice versa. Each line contains the primary name for the service followed by
    the program number and any alias names that the service may have. Fields are separated
    by spaces and tabs. Comments begin with #.


    Sample entry:


    ```

    rstat 100001 rstat rstat_svc rup perfmter

    ```


    # General Network Services


    Enabling, disabling, and managing network services.


    # inetd


    ```

    inetd [-] d] [-q QUEUELENGTH] [CONFIG_FILE]

    ```


    inetd normally runs at boot time. It listens for connections on certain Internet
    sockets. When a connection is found on one of its sockets, it decides what service
    socket corresponds to, and invokes a program to service the request. The basic
    function of inetd is to enable one daemon to invoke several others and reduce
    the load on the system. If, inetd will read its configuration information from
    CONFIG_FILE. Otherwise it will use /etc/inetd.conf. See the next section for more
    information.


    | Option | Description |

    | -d | Turns on debugging. |

    | -q QUEUELENGTH | Sets the size of the socket listen queue to the specified value.
    The default is 128. |


    # /etc/inetd.conf


    The inetd daemon reads its configuration information from /etc/inetd.conf by default.
    Each line defines a service managed by inetd. The fields are separated by tabs
    or spaces. Comments begin with # and blank lines are ignored. Each field must
    contain a value. The record format is as follows:


    ```

    SERVICE_NAME SOCKET_TYPE PROTOCOL { wait ; nowait[.MAX] } USER[.GROUP]

    SERVER_PROGRAM SERVER_ARGS

    ```


    To specify a Sun RPC-based service, the entry should contain these fields:


    ```

    SERVICE_NAME/VERSION.SOCKET_TYPE RPC/PROTOCOL { wait ; nowait[.MAX] }

    USER[.GROUP] SERVER_PROGRAM SERVER_ARGS

    ```


    SERVICE_NAME is the name of a valid service in the file /etc/services. When used
    to specify a Sun RPC-based service, this field is a valid RPC service name in
    the file /etc/rpc. The part to the right of the first slash (/) is the RPC version
    number. A range is a single numeric argument or a range of versions. A range is
    bounded by the low version to the high version (for example, rusers/1-3).'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Network Administration: /etc/services 22


    SOCKET_TYPE should be stream, dgram, raw, rdm, or seqpacket, depending on whether
    the socket is a stream, datagram, reliably delivered message, or sequenced packet
    socket.


    PROTOCOL must be a valid protocol as given in /etc/protocols. Examples might include
    tcp or udp. RPC-based services are specified with the rpc/tcp or rpc/udp service
    type.


    wait is used for single-threaded servers that process all incoming datagrams on
    a socket and time out. nowait is for multithreaded servers that free the socket
    so that further messages can be received on it. MAX specifies the maximum number
    of server instances that can be spawned by inetd within an interval of 60 seconds.
    When omitted, MAX defaults to 40.


    USER should contain the username of the user under whom the server should run.
    This allows servers to be given less permission than root. An optional group name
    can be specified by appending a dot to the username followed by the group name.This
    allows for servers to run with a different primary group ID than specified in
    the password file.


    SERVER_PROGRAM should contain the pathname of the program to be executed by inetd
    when a request is found on its socket. If inetd provides this service internally,
    this field should be internal.


    SERVER_ARGS are the arguments supplied to SERVER_PROGRAM. If the service is provided
    internally, the word internal should be entered in this field.


    # /etc/protocols


    The /etc/protocols file describes the available DAR.PA Internet protocols that
    are available from the TCP/IP subsystem.These numbers will occur in the protocol
    field of any IP header. This file should be used for reference only and shouldn''t
    be modified, since changes would result in incorrect IP packets. Comments start
    with # and blank lines are ignored. Each entry uses the following format:


    ```

    PROTOCOL NUMBER [ ALIAS ... ]

    ```


    PROTOCOL is the name (ip, tcp, udp, etc.) for the protocol. NUMBER is the official
    number for the protocol as it would appear in IP headers. The ALIASes are optional
    aliases names for the protocol.


    Sample entry:


    ```

    tcp 6 # transmission control protocol

    ```


    # /etc/services


    /etc/services provides mapping between text names of Internet services and their
    port numbers and protocol types. Fields are separated by spaces or tabs. Comments
    begin with # and blank lines are ignored.'
  merge: -1
