    | -Q N | Like -q, but shows summary results every N seconds. |

    | -q | Quiet. Set exit status only and don''t show per-target results. |

    | -r N | Retry limit. This is the number of times an attempt at pinging a target
    will be made, including the first try. The default is 3. |

    | -s | Prints cumulative statistics on exit. |

    | -t N | Initial target time in milliseconds. In the default mode, this is the
    amount of time that fping waits for a response to its first request. Successive
    timeouts are multiplied by the backoff factor. The default is 500. |

    | -u | Shows targets that are unreachable. |

