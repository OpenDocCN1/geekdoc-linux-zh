  md: '# Startup Shutdown: Initialization and Runlevels


    A runlevel is a system state that allows only a selected group of processes to
    exist. The processes spawned by init for each runlevel are defined in the /etc/initabb
    file. Valid runlevels are the numbers 0 through 6, S, and s. Runlevels S and s
    are identical. The runlevel can be changed by having a privileged user run init,
    which sends appropriate signals to init, telling it which runlevel to use.


    Runlevels 0, 1, and 6 are reserved. Runlevel 0 halts the system, runlevel 6 reboots
    the system, and runlevel 1 gets the system down into single-user mode. Runlevel
    S is not meant to be used directly. It''s normally used in the transition between
    bootup and multiuser mode. It is also used when transitioning from multiuser mode
    into single-user maintenance mode.


    The initabb file describes which processes are started immediately after booting
    and during normal operation. Each entry has the following format:


    ```

    RUNLEVEL:ACTION:PROCESS

    ```


    Lines beginning with # are treated as comments and ignored by init.


    ID is a unique sequence of one to four characters that identifies an entry in
    initabb. RUNLEVELS lists the runlevels for which the entry applies. ACTION describes
    what action(s) should be taken. PROCESS specifies the process(es) to be executed.
    The PROCESS field starts with a plus (+) character, init won''t do utmp and wtmp
    accounting for that process. This is needed for versions of getty that insist
    on doing their own utmp/wtmp maintenance.


    The RUNLEVELS can contain multiple characters, so that actions and processes for
    multiple runlevels can be specified.


    The runlevels for ondemand can contain A, B, or C. The RUNLEVELS fields of sysinit,
    boot, and bootwait are ignored.


    When the system runlevel is changed, any running processes that aren''t specified
    for the new runlevel are killed, first with SIGTERM, and then with SIGKILL.


    For more information on SIGTERM, SIGKILL, and signals in general, see the "Signals"
    section in Chapter 7, "Process Control."


    The following table describes the valid values for the ACTION field:


    | Action | Description |

    |---|---|n| boot | The process will be executed during system boot. The RUNLEVELS
    field is ignored. |

    | bootwait | Same as boot except init will wait for the process to terminate.
    |

    | ctrlaltdel | The process will be executed when init receives the SIGINT signal.
    This means that someone on the system console has pressed the Ctrl+Alt+Del combination.
    |

    | initdefault | Specifies the runlevel that should be entered after system boot.
    If none exists, init will ask for a runlevel on the console. The PROCESS field
    is ignored. |

    | krequest | The process will be executed when init receives a signal from the
    keyboard handler that a special key combination was pressed on the console keyboard.
    |

    | off | This does nothing. |'
  merge: -1
  pgno: 211
