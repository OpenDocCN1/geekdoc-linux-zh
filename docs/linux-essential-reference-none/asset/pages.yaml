    # The TCP Wrapping Facility


    Controlling access to network services based on the username and/or the host requesting
    the service.


    # tcpd


    tcpd FILENAME [ ARG ... ]


    tcpd is an access-control facility for Internet services such as telnet, ftp,
    finger, and others that have a one-to-one mapping to executable files. It''s invoked
    by inetd when a service is requested by a remote client. Instead of the server
    being directly by inetd, tcpd is run instead. The fully-qualified pathname for
    the server and the server''s arguments are passed to tcpd as arguments. For example,
    the following is a typical entry that might appear in inetd.conf:


    telnet stream tcp nowait /usr/sbin/tcpd /usr/sbin/in.telnet

    tcpd will allow or deny the requesting''s access, depending on directives listed
    in /etc/hosts.allow and/or /etc/hosts.deny.


    # tcppdchk


    tcppdchk [-a] [-d] [-i INETD_CONF] [-v]

    tcppdchk examines the system''s TCP wrapper configuration and reports all potential
    and real problems it can find. It examines the /etc/hosts.allow, /etc/hosts.deny,
    and /etc/inetd.conf files and reports problems such as nonexistent pathnames,
    invalid service designations, that shouldn''t be wrapped, and so on. Where possible,
    it suggests fixes for problems.


    | Option | Description |

    |---|---|

    |- a | Report access control rules that permit access without an explicit ALLOW
    keyword. |

    | -d | Examine hosts.allow and hosts.deny files in the current directory instead
    of the default. |

    |- i INETD_CONF | Check the inetd configuration in INETD_CONF instead of the one
    in /etc/inetd.conf. |

    | -v | Display the contents of each access-control rule. |


    # tcppdmatch


    tcppdmatch [-d] [-i INETD_CONF] DAEMON CLIENT


    tcppdmatch [-d] [-i INETD_CONF] DAEMON[@SERVER] [USER]@CLIENT'
