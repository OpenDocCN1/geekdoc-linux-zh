  md: '# User Management: /etc/group


    # groupmod


    ```

    groupmod [ -g GID [ -o ] ] [ -n GROUP_NAME ]

    ```


    The groupmod command modifies the system account files to reflect the changes
    that are specified on the command line.


    | Option | Description |

    |---|---|n| -g GID | GID is the numerical value of the group''s ID. This value
    must be unique unless the -o option is used, and must be nonnegative. Values between
    0 and 99 are typically reserved for system groups. Any files in which the old
    group ID is the group ID must have the file group changed manually. |

    | -n GROUP_NAME | Changes the name of the group from GROUP to GROUP_NAME. |


    # newusers


    ```

    newusers [ NEW_USERS ]

    ```


    newusers reads a file of username and cleartext password pairs and uses this information
    to update a group of existing users or to create new users. Each line is in the
    same format as the standard password file passwd, with the following exceptions:


    +   - The password field will be encrypted and used as the new value of the encrypted
    password.

    - The password age field will be ignored for shadow passwords if the user already
    exists.

    - The group ID can be the name of an existing group, in which case the named user
    will be added as a member. If a nonexistent numerical group is given, a new group
    will be created with this number.

    - The directory field will be checked for existence as a directory and a new directory
    with the same name will be created if it doesn''t already exist. The ownership
    of the directory will be set to that of the user being created or updated.


    # Authentication Data Maintenance


    Authentication prior to login is based on two files: /etc/group and /etc/passwd.
    This section describes these files and the commands used to maintain them.


    # /etc/group


    The /etc/group file contains one line for each group account. Each line contains
    the following fields separated by colon (:) characters:


    +   - Group name.

    - Optional encrypted password.

    - Numerical group ID.

    - Comma-separated list of the names of all users who are members of the group.'
