    | SERVER | A hostname, network address, or one of the unknown or wildcard patterns.
    The default server is unknown. |

    | USER | A client user identifier. Typically, a login name or a numeric user ID.
    The default username is unknown. |


    # /hosts.allow and /etc/hosts.deny


    /etc/hosts.allow and /etc/hosts.deny are access-control files. They contain statements
    written in a simple access-control language that''s based on client (hostname/address,
    username), and server (process name, hostname/address) patterns. Access is granted
    when a server/client pair matches an entry in the /etc/hosts.allow file. Otherwise,
    access will be denied when a server/client pair matches an entry in the /etc/hosts.deny
    file. If neither of these conditions is true, access will be granted. If either
    file does not exist, it''s treated as an empty file. Access control can be turned
    off by eliminating the files.


    Long lines can be continued with the backslash (\ character. Blank lines and lines
    with # are ignored. Statements use this form:


    ```

    DAEMON_LIST : CLIENT_LIST : SHELL_COMMAND ]

    ```


    DAEMON_LIST is a list of one or more process names. Wildcards can also be used.
    CLIENT_LIST is a list of one or more hosts, host addresses, and wildcard patterns
    that will be matched against the client''s hostname or address. SHELL_COMMAND,
    if included, is a command to be run using /bin/sh with standard input, output,
    and error connected to /dev/null.


    Following are examples:


    +   - ALL: LOCAL @some_netgroup

    - ALL: ..foobar.edu EXCEPT terminalserver.foobar.edu


    If /etc/hosts.allow contained these lines, to all services would be granted from
    all hosts in the local domain (no #hostname), members of the some_netgroup group,
    and from all in .foobar.except terminalserver.foobar.


    The complete descriptions of wildcard patterns, argument passing for SHELL_COMMAND,
    and other parts of the access-control language are described in the hosts_access(5)
    manual page. Extensions to the access-control language are described in the hosts_options(5)
    manual page. The extensions are available if the access-control library was compiled
    with -PROCESS_OPTIONS.'
  merge: -1
