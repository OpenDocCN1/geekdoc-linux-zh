    # Quotas


    Quotas are limits placed on the usage of disk space by user and group accounts.
    The commands described in this section are used to maintain quotas.


    # edquota


    ```

    edquota [ -p PROTO_USER ] [ -ug ] NAME ...

    edquota [ -u ; -g ] -t

    ```


    edquota is a quota editor. One or more users or groups can be specified on the
    command line. A temporary file is created for each user or group with an ASCII
    representation of the current disk quotas for that user or group, and an editor
    is then invoked on the file. The quotas can then be modified, new quotas added,
    and so on. On leaving the editor, edquota reads the temporary file and modifies
    the binary quota files to reflect the changes made.'
