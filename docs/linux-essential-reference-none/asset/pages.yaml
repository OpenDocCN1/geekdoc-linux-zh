  md: "# Network Administration: dip, diplogen, and diplogini 21\n\ndip handles dial-up\
    \ IP connections used by SLIP and PPP. It can handle both incoming and outgoing\
    \ connections and use password authentication for incoming connections.\n\ndiplogen\
    \ is equivalent to dip -i. diplogini is equivalent to dip -i -a. These are mainly\
    \ used with versions of login that do not pass command-line parameters to the\
    \ shell program.\n\nSCRIPTFILE is a file containing commands used by dip to establish\
    \ a connection. Appendix C for sources of information on dip interactive mode\
    \ commands and scripts.\n\n| Option | Description |\n|---|---|n| -a | Prompts\
    \ for username and password. |\n| -i | Acts as a dial-in server. |\n| -k | Kills\
    \ the process that has locked the device specified by -1 or the most recent invocation\
    \ of dip. |\n| -1 TTY_LINE | Indicates the line to be killed using the -k option.\
    \ |\n| -m MTU | Sets the Maximum Transfer Unit (MTU). The default is 296. |\n\
    | -p PROTO | Sets the line protocol. PROTO must be SLIP, SLIPS, CSLIP, PPP, or\
    \ TERM. |\n| -t | Runs in interactive test mode. |n| -v | Enables verbose mode.\
    \ |\n\nThe following is a sample script:\n\n```\nmain:\nget smtu 1006\ndefault\n\
    port /dev/modem\nspeed 57600\nreset\nif $errlvl != 0 goto error\ndial 5551212\n\
    if $errlvl != 1 goto error\n\nlogin:\n#Wait for login prompt from remote host.\n\
    wait login:\nif $errlvl != 0 goto error\n#Send user ID with carriage return and\
    \ wait for password prompt.\nsend user\r\nwait ord:\nif $errlvl != 0 goto error\n\
    #Send password with carriage return\nsend password\r\n\n#Remote and local IP addresses\
    \ are supplied by remote host.\nget $rtmip remote\nif $errlvl != 0 goto error\n\
    sleep 1\nget $locip remote\nif $errlvl != 0 goto error\n```\n\ncontinues >>"
  merge: -1
