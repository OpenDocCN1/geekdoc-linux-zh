  md: '# Text Utilities: sed 53


    The following rules apply to commands containing addresses:


    +   - Commands with no addresses are applied to each input line.


    +   - Commands with one address are applied to each line that matches the address.


    +   - Commands with two addresses separated by commas selects the lines starting
    with the first line matching the first address and ending with the first line
    matching the second address. If the second address starts before or is the same
    line as the first address, only the first line is selected.


    +   - An address followed by \! selects all lines that do not match the address.


    The following characters have special meaning only when used in replacement patterns:


    +   \ Escapes the following character.


    +   \n Matches the %n pattern previously saved by \n and \), where N is a number
    from 0 to 9. Previously saved patterns are counted from the leftmost position
    on the line.


    +   & Prints the entire search pattern when used in a replacement string.


    # Commands


    The following table summarizes sed commands. Typically there''s only one command
    per line, but commands can also be concatenated on a single line with semicolons.
    Commands beginning with ADDRESS can be preceded by one address. Commands beginning
    with ADDRESS can be preceded by one address or by two addresses separated by a
    comma (,). Multiple commands can be nested by using braces {}. When nesting, the
    opening brace {} must end a line and the closing brace } must be on a line by
    itself. The TEXT variable must begin on its own line and multiple lines in TEXT
    are separated by \ characters. For example, the following script uses the command
    to append three lines of text to the end of a file:


    ```

    $$

    This is the first line to be appended to the end of a file.\

    This is the second line to be appended.\

    This is the last line to be appended.

    ```


    READ-FILENAME and WRITE-FILENAME arguments terminate the command line and must
    be preceded by exactly one space.


    | Command | Description |

    |---|---|

    | # COMMENT | Comment line. |

    | #n | Suppress output for the rest of the script. |

    | :LABEL | Assign a label for use control b control transfer commands. For example,
    the command $ last branches to the statement following :last when processing the
    last line of input. |

    | [ADDRESS]= | Print the current line number to standard output. |


    continues >>'
