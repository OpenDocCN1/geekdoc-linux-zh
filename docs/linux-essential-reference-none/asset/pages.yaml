    all multicast packets on the network will be received by INTERFACE. |

    | arp or -arp | Enables or disables the ARP protocol on INTERFACE. |

    | [-]broadcast [ADDRESS] | If the ADDRESS argument is given, it sets the broadcast
    address for this interface. Otherwise, sets or clears the IFF_BROADCAST flag for
