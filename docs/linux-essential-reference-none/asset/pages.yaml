  md: '# 228 Network Administration: ripquery


    # ripquery


    ripquery [-n] HOST

    ripquery can request the listing of the kernel routing table from remote HOST.
    The remote host must be running a RIP server in order to honor the request. The
    -n option can be used to suppress IP address-to-name resolution.


    # route


    ```

    route [-CFvnee]

    route [-v] [-A FAMILY] add OPTION ...

    route [-v] [-A FAMILY] del OPTION ...

    route [-version] [-h] [--help]

    ```


    route is used to manage the kernel routing table. It''s primarily used to set
    static routes to specific hosts or networks an interface after they''ve been set
    up ifconfig. Routes can be added with the add form and deleted with del.


    | Option | Description |

    | --- | --- |

    | -A FAMILY | FAMILY is the address family of the specified route.Valid values
    for FAMILY are inet, inet6, ddp, ipx, netrom, and ax25. |

    | -C | Displays the kernel''s cache |

    | [dev] IF | Forces the route to be associated with device IF. The kernel will
    otherwise try to determine the device on its (by checking already existing routes
    and device specifications, where the route is added to). In most normal networks,
    you won''t need this. If this is the last option on the command line, dev may
    be omitted. |

    | -e | Usesstat format for displaying the routing table. -ee will generate a very
    long line with all parameters from the routing table. |

    | -F | Displays the FIB routing table. The layout can be changed with -e and -ee.
    |

    | -h | Displays the usage message. |

    | -host TARGET | The other end of the link is a host with address TARGET. |

    | irtt I | Sets the initial round-trip time for TCP connections over this route
    to I milliseconds (1-12000). |

    | gw GW | IP packets for the target network or host will be routed through gateway
    GW. The specified gateway must be reachable first. Usually there must already
    a static route to the gateway. |

    | metric M | Sets the metric field in the routing table (used by routing daemons)
    to M. This option is currently not implemented. |

    | mss M | Sets Maximum Segment Size to M bytes. The default is 536. |

    | -n | Disables address-to-hostname resolution. Prints the numeric address. |

    | -net TARGET | The other end of the link is a network with address TARGET. |

    | netmask NM | NM is the mask of the route to be added. |

    | reject | Installs a blocking route, which will force a route lookup to fail.
    This can be used to mask out networks before using the default route. |'
