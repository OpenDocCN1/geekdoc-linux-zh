  md: '# About the Author


    Ed Petron is an independent computer consultant with more than a decade''s experience
    as a programmer and system administrator working with mainframe UNIX systems.
    He began using and studying Linux in 1995 with version 20.1 of the Slack distribution.
    He now uses and contributes to the Debian distribution and has written several
    articles for Linux Journal. Ed holds a Bachelor of Music in keyboard performance
    (piano, harpsichord, and organ) from Indiana University and a Bachelor of Science
    in Computer Science from Chapman University. He is currently working on a Master
    of Science in Engineering with a concentration in computer science at California
    National University.


    # About the Technical Reviewers


    Debbie Daily is currently a network system administrator for the Math department
    for six years before returning to school to study computer science, with an emphasis
    on network security. Debbie began her UNIX career as a system administrator student
    intern while attending classes full time. She recently received her Bachelor of
    Science in Computer Science from Purdue University.


    Herman Bolton holds a Bachelor of Science degree in computer science from the
    University of Pretoria, South Africa. He has been doing technical programming
    in C and C++ for the last 10 years on UNIX,VMS, and the last few years on Windows
    NT operating systems.'
