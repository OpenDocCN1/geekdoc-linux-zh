  md: '# /etc/securetty


    /etc/securetty contains the device names of TTY lines (one per line without a
    leading /dev/) on which root is allowed to log in.


    # /etc/shells


    The chsh (change shell) command allows users to change their login shell.

    /etc/shells contains the full pathnames (one per line) of valid login shells.
    It''s used by the chsh command to validate a user''s choice of login shell.


    # Restricting NFS File Sharing


    Controlling the sharing of filesystems and subdirectories.


    # /etc/exports


    /etc/exports is the access control list for filesystems that can be exported to
    NFS clients. It is used by both the NFS daemon and the NFS file server nfsd.


    Each line contains a mount point and a list of machine or netgroup names allowed
    to mount the filesystem at point. An optional list of mount parameters can follow
    each machine name. Blank lines are ignored and comments start with the # character.
    Long entries can be continued across multiple lines using the backslash (\)


    For example:


    ```

    #

    #Allow read/write access to "usr" to all hosts in

    #local.domain and read/write access to everybody in the netgroup

    #"trusted"

    /usr *.local.domain(ro) @trusted

    ```


    For a complete description of hostname formats, access options, and user ID mapping,
    see the exports (5) manual page.


    # Restricting Network File Transfers


    Restricting access to files through network file transfers.


    # /etc/ftpchroot


    This file contains a list of usernames, one per line. If a user''s name is in
    this file, the session''s root will be changed to the user''s login directory
    by chroot as for an anonymous or ftp account. This is intended as a compromise
    between a fully anonymous account and a fully privileged account.'
