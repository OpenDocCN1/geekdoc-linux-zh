    # /etc/ethers


    The /etc/ethers file is used to map 48–bit Ethernet station addresses to IP addresses
    and versa. Each line uses this form:


    ETHERNET_ADDRESS IP_ADDRESS


    where the separator is any number of spaces and/or tabs. Comments begin with #.
    The ETHERNET_ADDRESS is a list of six hexadecimal numbers ranging from 0 to ff
    and separated by colons (:). The IP_ADDRESS is either a decimal IP address or
    a hostname that can be resolved by DNS. For example:


    ```

    #Dotted decimal entry:

    08:00:20:20:60:CB 205.146.27.34

    ```


    ```

    #DNS resolvable entry:

    08:00:21:20:AD:42 wilbur.leba.net

    ```


    # Domain Name to IP Address Mapping


    Network software uses numeric IP addresses to route data, symbolic hostnames are
    more convenient for users. Internet Domain Name Service (DNS) and resolver routines
    accomplish the mapping of symbolic domain names to IP addresses and versa.


    # named


    named OPTION ... [ CONFIG_FILE ]


    named is the Internet domain name server. Without any arguments, named will read
    the default configuration file /etc/named.conf, read any initial data, and listen
    for queries. A CONFIG_FILE argument given at the end of the line will override
    any CONFIG_FILE specified by using the -b or -c flags (see the following table).


    The operation of named is controlled mainly by its configuration file. For more
    information on configuring named, see the bind documentation and other sources
    of information listed in Appendix C.'
  merge: -1
