    | -y | Matches only TCP packets with the SYN bit set and the ACK bit cleared.|


    # ipfwadm-wrapper


    ```

    ipfwadm-wrapper { -A | -I | -O | -F } COMMAND_PARAMETERS [OPTION ...]

    ipfwadm-wrapper -M [ -1 | -s ] [OPTION ... ]

    ```


    ipfwadm-wrapper emulates ipfwadm. It''s used with iptchains to maintain rules
    created under ipfwadm. The command options are identical to those of ipfwadm.'
  merge: -1
