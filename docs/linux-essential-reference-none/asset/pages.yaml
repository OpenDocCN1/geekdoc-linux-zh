  md: '# crontab


    crontab [ -u USER ] FILE

    crontab [ -u USER ] { -l | -r | -e


    crontab is used to maintain periodic job schedules. Each line in the periodic
    schedule is either an environment variable setting of the form NAME=ENVIRONMENT
    or a cron command. cron commands are of the following form:


    DATE_AND_TIME COMMAND


    DATE_AND_TIME, a set of five space-separated fields, sets the schedule for the
    execution of COMMAND:


    MINUTE HOUR DAY_OF_MONTH DAY_OF_WEEK


    The following table describes the allowable values for these fields.


    | Field | Valid Values |

    | MINUTE | 0 to 59 |

    | HOUR | 0 to 23 |

    | DAY_OF_MONTH | 1 to 31 |

    | MONTH | 1 to 12 |

    | DAY_OF_WEEK | 0 to 6 (Sunday is 0) |


    The following are also allowed:


    +   * indicates "all" or "any".

    * Comma-separated lists as 5, 10, 15.

    * Hyphen-separated ranges such as 1-10.

    * First three letters of the month or day (case doesn''t matter, and ranges aren''t
    allowed with names).

    * Lines that begin with # are ignored and can be used as comments.


    For example:

    # run somejob at 10 pm on weekdays

    0 22 * * 1-5 /home/epatron/somejob.sh


    The following is equivalent to the preceding example:

    0 22 * * 1,2,3,4,5 /home/epetron/somejob.sh


    # Command-Line Options for crontab


    | Option | Description |

    | -e | Edit the current schedule using the editor specified by the VISUAL EDITOR
    environment variable. The schedule is installed automatically after exiting the
    editor. |

    | FILE | Update the schedule from FILE. |

    | -1 | List the current schedule to standard output. |

    | -r | Remove the schedule. |

    | -u USER | Alter the schedule for user USER. Only the superuser can use the -u
    option. Without -u, the schedule of the invoking user is altered. |'
  merge: -1
