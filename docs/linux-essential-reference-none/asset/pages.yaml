  md: '# User Management:/etc/group


    For added security, some systems shadow password files that are accessible only
    to the superuser and are used to store the passwords.


    # /etc/passwd


    The /etc/passwd file contains one line for each user account. Each line contains
    the following fields separated by colon (:) characters:


    +   - Login name.

    - Optional encrypted password.

    - Numerical user ID.

    - Numerical group ID.

    - Username or comment field.

    - User home directory.

    - User command interpreter.


    # /etc/shadow


    The /etc/shadow file stores the user passwords on systems where password shadowing
    is used. It contains one line for each user account. Each line contains the following
    fields separated by colon (:) characters:


    +   - Login name.

    - Encrypted password.

    - Days since January 1, 1970 that the password was last changed.

    - Days before the password can be changed.

    - Days after which the password must be changed.

    - Days before the password is to expire that the user is warned.

    - Days after the password expires that the account is disabled.

    - Days since January 1, 1970 that the account is disabled.

    - A reserved field.


    # grpck


    ```

    grpck [ -r ] [ GROUP SHADOW ]

    ```


    grpck checks the integrity of group password files. All entries in /etc/group
    and /etc/gshadow are checked to see that the entry has the proper format and valid
    data in each field. The user is prompted to delete entries that are improperly
    formatted or that have other unable errors. The checks for number of fields and
    unique group name are fatal. If the entry has the wrong number of fields, the
    user will be prompted to delete the entire line. If the user doesn''t answer affirmatively,
    further checks are bypassed. An entry with a duplicate group name is prompted
    for deletion, but the remaining checks will still be made. All other errors are
    warnings and the user is encouraged to run the grpmod command to correct the error.
    The user'
  merge: -1
