  md: '# 252 Filesystems: fsck


    The exit code returned by fsck is the sum of the following conditions:


    +   - No errors.

    - Filesystem errors are corrected.

    - The system should be rebooted.

    - Filesystem error left uncorrected.

    - Operational error.

    - Usage or syntax error.

    - Shared library error.


    fsck is actually a front end for the various filesystem checkers (fsck.FTYPE)
    available under Linux. The filesystem-specific checker is searched in /bin first,
    then in /etc/fs and /etc, and finally in the directories listed in the PATH environment
    variable.


    | Option | Description |

    | -A | Walk through the /etc/fstab file and try to check all filesystems in one
    run. |

    | -R | When checking all filesystems with the -A flag, skip the root filesystem.
    |

    | -T | Don''t show the title on startup. |

    | -N | Don''t execute. |

    | -P | When the -A flag is set, check the root filesystem in parallel with the
    other filesystems. |

    | -S | Serialize fsck operations. |

    | -V | Produce verbose output, including all filesystem-specific commands that
    are executed. |

    | -t FTYPE | Specifies the type of filesystem to be checked. When the -A flag
    is specified, only filesystems that match FTYPE are checked. If FTYPE is prefixed
    with no, only filesystems that aren''t of type FTYPE are checked. |


    # Filesystem-Specific Options


    Any options that are not understood by fsck or that follow the -- option are treated
    as filesystem-specific options to be passed to the filesystem-specific checker.

    Currently, standardized filesystem-specific options are somewhat in flux. Although
    the following options are supported by most filesystems:


    | Option | Description |

    | -a | Automatically repair the filesystem without any questions. |

    | -r | Interactively repair the filesystem (ask for confirmations). |


    # mklost+found


    mklost+found

    mklost+found is used to create a lost+found directory in the current working directory
    on a Linux second extended filesystem. It preallocates disk blocks to the directory
    to make it usable by e2fsck.'
