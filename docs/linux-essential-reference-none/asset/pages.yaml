  md: '# Process Status


    This section describes commands that can be used to view the status of processes.


    # ps


    ps [ OPTION ... ] [ PID ... ]

    ps gives a snapshot of the status of processes running. If repetitive display
    is needed, use top. If PID(s) are specified, only the status information for the
    specified processes will be shown.


    # Field Descriptions for ps Output


    The following table describes the status values shown by ps.


    | Field | Description |

    | PRI | The counter in the kernel task structure for the process. The time in
    HZ of the process''s possible time slice |

    | NI | Standard UNIX nice value. A positive value means less CPU time. |

    | SIZE | Virtual image size: text+data+stack. |

    | RSS | Resident set size. Number of kilobytes in the program memory. |

    | WCHAN | Name of the kernel function where the process is sleeping, with sys_stripped
    from the function name. A hexadecimal address if /etc/psdatabase doesn''t exist.
    |

    | STAT | Three characters describing the process state: R for ready, S for sleeping,
    D for uninterruptible, T for stopped or traced, Z for zombie. The second character
    W if the process has no resident pages. The third character N if the process has
    a positive nice value (NI field). |

    | TT | The controlling TTY for the process. |

    | PAGEIN | Number of major page faults (page faults that cause pages to be read
    from disk, including pages read from the buffer cache). |

    | TRS | Text resident size. |

    | SHARE | Kilobytes (or pages if the p option is used) on the swap device. |


    # Sort Keys


    The output from ps can be sorted on a number of different fields.The following
    provides the long and short key names and their descriptions.


    | Short | Long | Description |

    | c | cmd | Name of executable. |

    | C | cmdline | Full command name. |

    | f | flags | Flags as in the long format F field. |

    | g | pgrp | Process group ID. |

    | G | tpgid | Controlling TTY of the process group. |

    | j | cutime | Cumulative user time. |'
