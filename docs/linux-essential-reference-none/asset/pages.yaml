    append="spbcd=0x63,LaserMate"

    boot=/dev/vda

    prom

    vga=normal # force sane state

    randmask=0 # paranoia setting

    # End LILO global section

    # Linux bootable partition config begins

    image = /vmlinuz

    root = /dev/hda2

    label = Linux

    read-only

