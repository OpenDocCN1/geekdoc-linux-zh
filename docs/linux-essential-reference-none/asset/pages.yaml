    | -q QUEUE | Uses the specified QUEUE. A queue designation consists of a single
    letter. Valid queue designations range from a to z and A to Z. The queue is the
    default for at and the b queue for batch. Queues with higher letters run with
    increased niceness. The special queue = is reserved for jobs that are currently
    running. |

    | -V | Prints the version number. |


    # atq


    atq [ -V ] -q QUEUE

    atq prints the job numbers, execution times, and queues for queue QUEUE. It lists
    the user''s pending jobs (or all if user is root). If no queue is specified, atq
    shows all jobs scheduled. The -V flag shows the at version number. atq is a symbolic
    link to at.


    # atm


    atm [ -V ] JOB...

    atm removes the specified JOB(s) from the schedule. The -V flag shows the at version
    number. atm is a symbolic link to at.


    # batch


    batch [ OPTION ... ]

    batch executes commands when the system load average drops below 0.8 or the value
    specified in the invocation of atrun or atd. The -V flag also shows the at version
    number.


