  md: '# portmap


    portmap [-d] [-v]

    portmap provides the mapping of TCP/IP and UDP/IP port numbers to RPC program
    numbers for use by RPC-based services. When clients of RPC programs request service,
    they first contact portmap to obtain the port number through which the service
    will communicate. portmap must be started before any RPC servers can invoked.


    | Option | Description |

    | --- | --- |

    | -d | Debug mode: This prevents portmap from running as a daemon. Errors and
    debugging information are printed to standard error. |

    | -v | Runs portmap in verbose mode. |


    # rpcinfo


    rpcinfo -p [HOST]

    rpcinfo [-n PORTNUM] -u HOST PROGRAM [VERSION]

    rpcinfo [-n PORTNUM] -t HOST PROGRAM [VERSION]

    rpcinfo -b PROGRAM VERSION

    rpcinfo -d PROGRAM VERSION


    rpcinfo reports the status of the RPC server running on HOST. PROGRAM can be either
    a name (if included in /etc/rpc) or a number.


    If VERSION is specified, rpcinfo attempts to call that of the specified PROGRAM.
    Otherwise, rpcinfo attempts to find all the registered version numbers for the
    specified program by calling version 0 and attempting to call all registered version.
    Note: The version number is required for -b and -d options.


    | Option | Description |

    | --- | --- |

    | -b PROGRAM VERSION | Makes an RPC broadcast to procedure 0 of PROGRAM and VERSION
    using UDP, and reports all hosts that respond. |

    | -d PROGRAM VERSION | Deletes registration for the version VERSION of PROGRAM.
    |

    | -n PORTNUM | Uses PORTNUM as the port number for the -t and -u options, instead
    of the port number given by the portmapper. |

    | -p [HOST] | Probes the portmapper on HOST and provides a list of all RPC programs.
    If HOST isn''t provided, the local host is probed. |

    | -t HOST PROGRAM | Makes an RPC call to version 0 of PROGRAM on the specified
    HOST using TCP, and reports whether a response was received. |

    | -u HOST PROGRAM | Makes an RPC call to version 0 of PROGRAM on the specified
    HOST using UDP, and reports whether a response was received. |'
