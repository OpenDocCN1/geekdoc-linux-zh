    | -c | Prints the jobs listed on the command line to standard output. |

    | -d JOB | Deletes JOB from the schedule. JOB is a number assigned at the time
    the job was scheduled. |

    | -f FILE | Reads the job from FILE rather than standard input. |

    | -1 | Lists the scheduled jobs. -1 is an alias for atq. |

    | -m | Sends mail to the user when the job has completed, even if there was no
