  md: '# Command Options for Creating New Users


    | Option | Description |

    | --- | --- |

    | -c COMMENT | Places COMMENT in the comment field of the new user''s record in
    the password file. |

    | -d HOME_DIR | The new user will be created using HOME_DIR as the value for the
    user''s login directory. The default is to append the LOGIN name to DEFAULT_HOME
    and use that as the login directory. |

    | -e EXPIRE_DATE | Date on which the user account will be disabled, specified
    in the format MM/DD/YY or MM/DD/YYYY. |

    | -f INACTIVE_DAYS | Number of days after a password expires until the account
    is permanently disabled. A value of 0 disables the account as soon as the password
    has expired, and a value of -1 disables the feature. |

    | -g INITIAL_GROUP | Group name or number of the user''s initial login group.
    The group name must exist. A group number must refer to an existing group. The
    default group number is 1. |

    | -G GROUP_LIST | The new user is a member of GROUP_LIST, where GROUP_LIST is
    a comma-separated list of groups. The groups are subject to the same restrictions
    as the group given with the -g option. The default is for the user to belong only
    to the initial group. |

    | -m | The user''s home directory will be created if it doesn''t exist. The files
    in SKELETON_DIR are copied to the home directory if the -k option is used; otherwise
    the files contained in /etc/skel or /etc/skel directories are also created in
    SKELETON_DIR or the home directory. The -k option is valid only in conjunction
    with the -m option. The default is not to create the directory and not copy any
    files. |

    | -s SHELL |ates SHELL as the user''s login shell. The default is to leave this
    field blank, which causes the system to select the default login shell. |

    | -u UID | The numerical value of the user''s ID. This value must be unique unless
    the -o option is used and must be non-negative. The default is to use the smallest
    ID value greater than 99 and greater than every other user.Values between 0 and
    99 are typically reserved for system accounts.


