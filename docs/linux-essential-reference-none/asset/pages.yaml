  md: '# users


    users [ FILE ]


    users prints a single line containing a blank-separated list of usernames, for
    each session. If a user is logged on more than once, the name appears more than
    once. By default, users reads from /etc/utmp but will get its information from
    FILE if it''s specified.


    # who


    who [ OPTION ] [ FILE ] [ am i ]


    who prints detailed information about each session. If invoked with no arguments,
    it prints the login name, terminal line, login time, and remote hostname or X
    display for each logged-on user.


    If FILE is given, who uses instead of /var/run/utmp as the name of the file containing
    the record of users who are logged on. /var/log/utmp is commonly given as an argument
    to who to look at who has previously logged on.


    | Option | Description |

    | --- | --- |

    | -m | Same as whoami. |

    | -q or --count | Prints only the login names and the number of users logged on.
    Overrides all other options. |

    | -s | Ignored. Provided for compatibility with other versions of who. |

    | -i or -u or --idle | Includes idle time for each session. |

    | -H or --heading | Provides headings for columns. |

    | -w, -T, --mesg, --message, or --writable | Includes information about each user''s
    status: <br>+ Allowing write messages. <br>- Disallowing write messages. <br>?
    Cannot find terminal device. |


    # whoami


    whoami


    whoami prints the username associated with the current effective user ID. It''s
    equivalent to the command id -un.'
