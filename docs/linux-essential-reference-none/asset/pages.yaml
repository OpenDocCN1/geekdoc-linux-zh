- img_proc: true
  md: '# The Kernel and Its Interfaces: /proc Filesystem


    The /proc filesystem provides both global and process-specific data. Process-specific
    data is provided by files under the directory /proc/PID, where PID is the ID of
    the process in question. The file /proc/self is a link that points to the directory
    for the current process.


    Some files under /proc and its subdirectories are symbolic links pointing to filenames
    of the form [DEV]:INODE, where DEV is the device number and INODE is the inode
    number.


    The structure of the /proc filesystem depends on the kernel version and the system''s
    configuration. The following table describes the files available under a typical
    system.


    | File | Description |

    | --- | --- |

    | /proc/cmdline | Parameters passed to the kernel when it was booted. |

    | /proc/cpuinfo | Description of the CPU, including the vendor name, whether it
    has a floating-point unit, and so on. |

    | /proc/devices | Major devices and their names. |

    | /proc/dma | Direct Memory Access (DMA) channels and their device names. |

    | /proc/filesystems | Filesystem types supported by the current configuration.
    |

    | /proc/interrupts | For each request (IRQ) number, the number of interrupts that
    have been served and the name of the device. |

    | /proc/ports | I/O port addresses and the names of the associated devices. |

    | /proc/kcore | Kernel memory image. |

    | /proc/kmsg | Names and addresses of kernel routine names and variables. Module
    names are included for those symbols defined by loadable modules. |

    | /proc/loadavg | Load averages, number of running processes, total number processes
    on the system, and the PID of the last created. |

    | /proc/locks | Information on file locks currently held. |

    | /proc/meminfo | Memory-usage statistics for RAM and swap space. |

    | /proc/misc | Minor device statistics and names for miscellaneous devices (major
    number 10). |

    | /proc/modules | For each loaded module, the number of pages of memory module
    uses, the number of processes using the module, and the modules that depend on
    it. |

    | /proc/mounts | The volume mount point. |

    | /proc/net/arp | Address Resolution Protocol (ARP) information. For each device
    using ARP, the IP address, hardware type, the hardware device, and so on. |

    | /proc/net/dev | Performance statistics for each network interface device. The
    number of packets sent and received, number of errors, and so on. |

    | /proc/net/raw | Description of each raw socket in use. Lists remote and local
    addresses, queue lengths, and so on. |

    | /proc/net/route | Routing table. lists destination and addresses, maximum transfer
    unit, and so on. |

    | /proc/net/rt_cache | Routing cache in the same format as /proc/net/route. |


    continues >>'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 202 The Kernel and Its Interfaces: The /proc Filesystem


    >>continued


    | File | Description |

    | --- | --- |

    | /proc/net/snmp | Simple Network Management Protocol (SNMP) data. |

    | /proc/net/sockstat | Socket descriptor usage. For each type of socket (TCP,
    UDP, and so on), shows the number in use and the number available. |

    | /proc/net/tcp | Same as /proc/net/raw for TCP sockets. |

    | /proc/net/udp | Same as /proc/net/tcp for UDP sockets. |

    | /proc/unix | Description of each UNIX local domain socket. Lists the filename,
    the inode where it resides, and so on. |

    | /proc/pci | Descriptions of all currently installed PCI devices. |

    | /proc/scsi/scsi | Descriptions of all currently installed SCSI devices. |

    | /proc/stat | Kernel and system statistics: CPU time, reads and writes, swaps,
    interrupts, context switches, and boot time. |

    | /proc/uptime | Uptime and idle time in hundredths of a second. |

    | /proc/version | Kernel version, the user who compiled it, the gcc version which
    it was compiled, and the date and time it was compiled. |


    For each process on the system, a directory /proc contains files describing the
    process in question. In addition, a file /proc/self exists that is a link pointing
    to the currently running process. The following table describes the files under
    /proc/PID.


    | File | Description |

    | --- | --- |

    | cwd | The link to the current working directory. The link target is of the form
    [DEV]:inode, where DEV is the device on which the current working directory resides
    and INODE is the inode of the directory. |

    | fd | A directory containing the open descriptor for the given process. They’re
    named according their positions in the descriptor table (0 is for standard input,
    1 is for standard output, and so on). Each link target is in the same format as
    cwd. |

    | root | A link pointing to the root directory for the given process. The link
    target is in the same format as cwd. |

    | cmdline | Command name and arguments, separated by null characters. This holds
    the complete line for the process which has been swapped out or is a zombie process.
    |

    | environ | Environment variable name/value pairs, separated by null characters.
    Each name/value pair is of the form NAME=VALUE. |

