    | Directive | Description |

    | --- | --- |

    | %H | Hour (00–23). |

    | %I | Hour (01–12). |

    | %k | Hour (0–23). |

    | %l | Hour (1–12). |

    | %M | Minute (00–59). |

    | %p | Locale''s AM or PM. |

    | %r | 12-hour time (hh:mm:ss AM or PM). |

    | %s | Seconds since the epoch. |

    | %S | Second (00–61). |

    | %T | 24-hour time (hh:mm:ss). |

    | %X | Locale''s time representation (%H:%M:%S). |


