  md: '# Introduction


    This book is designed as a reference for Linux users who know what they want to
    do but need to know how to do it. It assumes that the reader has already installed
    Linux and has a basic knowledge of UNIX concepts. Although not a tutorial, it
    may still be of value to the beginning Linux user if in conjunction with one or
    more of the many tutorial books available.


    Emphasis has been placed on the use of free software packages that are included
    with typical Linux distributions, with no specific distribution favored over others.
    The book focuses on the use of the command-line interface and has purposely left
    out coverage of the X Window system. Unlike X applications, command-line commands
    often accept many different permutations and combinations of options that are
    not self-explanatory. Also, practically every Linux user uses commands, regardless
    of whether he or she X.


    # Notational Conventions


    Most of the book contains formal descriptions of command syntax. The following
    rules apply when interpreting these descriptions:


    +   - Command and any other text that to be typed literally is printed in a monospaced
    font: `command option`

    - Variables that hold places for substitution are replaced in an italic monospaced
    font: `cat FILENAME`

    - Optional items are placed within brackets ([]).

    - The ellipsis (...) is used to indicate zero or more occurrences of the preceding
    item.

    - The vertical bar or pipe symbol (|) between parameters indicates that either
    parameter can be given.

    - Required parts of a command may be placed within braces ({}). This is most often
    used in conjunction with the vertical bar (|).


    The following example illustrates the use of these conventions:


    ```

    command -a { -b } { OPTION ... } FILENAME ...

    ```


    In this example, command is typed literally, along with either -a or -b as a required
    parameter. These are followed by zero or more OPTIONS and one or more FILENAMES.


    In the text, each syntax description is accompanied by an explanation of the possible
    values for the parameters.

    Many commands use flags prefixed with a hyphen (-) to distinguish the flag from
    other types of parameters such as filenames. For example:


    ```

    command -ij FILENAME ...

    ```


    In these cases, it''s usually possible to combine flags in one argument or give
    them separately. For example,

    command -ij fileb

    will usually be equivalent to

    command -i j fileb

    The option descriptions generally point out these situations when they exist.'
  merge: -1
