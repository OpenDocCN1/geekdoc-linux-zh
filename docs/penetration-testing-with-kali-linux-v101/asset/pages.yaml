  md: '# OFFENSIVE Security


    Penetration Testing with Kali Linux


    # 9.2.2.1 - Swapping out Shellcode


    Most commonly, public exploits will have shellcode that will not suit our purposes.


    From shellcodes that pop up a calculator, to bind shells that might not suit our
    exploitation environment, reverse shells with hardcoded IPs.


    If the program is easily debuggable, such as SLMail, or if the vulnerability is
    not sensitive to varying buffers, then swapping out the shellcode for the exploit
    is a relatively simple task. However, for more complex exploits, as those that
    bypass DEP and ASLR, swapping out your shellcode might have negative effects on
    the exploit, due to changes in shellcode size, and resulting misalignment of various
    instructions in the exploit.


    # 9.2.2.2 - exploitdb - 643.c


    The first exploit we look at has the following C directives:


    ```

    root@kali:~/slmail # head 643.c

    #include <fcntl.h>

    #include <stdio.h>

    #include <stdlib.h>

    #include <sys/socket.h>

    #include <sys/types.h>

    #include <sys/wait.h>

    #include <errno.h>

    #include <netinet/in.h>

    #include <netdb.h>

    #include <string.h>

    ```


    These suggest that this exploit should be compiled in a Unix like environment,
    with a compiler such as gcc.'
