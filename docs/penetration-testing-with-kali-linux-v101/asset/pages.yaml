  md: '# 13.3 - File Inclusion Vulnerabilities


    Local (LFI) and remote (RFI)⁷ file inclusion vulnerabilities are commonly found
    in poorly written PHP code. The exploitation of these vulnerabilities also depends
    on PHP versions and web server configurations, specifically php.ini values such
    as register_globals and allow_url wrappers. LFI/RFI vulnerabilities allow an attacker
    to include a remote or local file into the webserver''s running PHP code.


    LFI vulnerabilities are a subclass of RFIs. The difference between the two is
    the web application''s capability to include either local or remote files. RFI
    attacks allow the attacker to introduce his own code to the webserver, resulting
    in a quick compromise, while LFI attacks limit the attacker to including files
    already existing on the web server, thus making compromise more challenging.


    # 13.3.1 - Local File Inclusion


    To understand the mechanisms behind this attack, let''s return to the guestbook
    application. Notice that the guestbook allows you to choose a language as input,
    and depending on which one you choose, the thank you message is appropriately
    displayed in that language:


    > ⁷ https://en.wikipedia.org/wiki/File_inclusion_vulnerability'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Merci d''avoir envoyer votre message !


    ![](img/ea60ac7a8762deadd3823235c817f96d_222_0.png)


    The code responsible for this feature looks like:


    ```

    if(isset($_GET[''LANG'']) ) { $lang = $_GET[''LANG'']; }

    else { $lang = ''en''; }

    include( $lang . ''.php'' );

    ```


    The code above checks the GET parameter LANG is set. If LANG is set, it is assigned
    to the variable $lang. If the LANG parameter is not set, the default value of
    “en” (English) is assigned. The code then uses the PHP include function and includes
    the required text from a local file, either en.php or fr.php.


    The developer of this application was not expecting any other values than the
    two options he specified—English and French. However, because the LANG parameter
    is not sanitized, you can try to include a different PHP file into this page.'
  merge: -1
