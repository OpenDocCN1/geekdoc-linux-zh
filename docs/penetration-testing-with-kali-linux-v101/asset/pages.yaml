  md: '# 15.5 - Traffic Encapsulation


    Penetration Testing with Kali Linux


    So far, we have traversed firewall rules based on port filters and stateful inspection.
    What happens if there''s a deep packet content inspection device on the network
    that does not blindly allow any protocol out of the specified ports? In this case,
    the previous outbound SSH connections to our home or gateway machines would be
    blocked, as the content inspection filters would notice that a protocol other
    than HTTP was trying to get by. Let''s go back to our client side attack scenario,
    where we tunneled RDP from a victim''s machine to our attacking box, and to try
    to deal with this hardened environment.


    In this case, we can use an HTTP or SSL encapsulating tool such as http_tunnel
    or stunnel, respectively. These tools usually work in a client/server model, allowing
    us to encapsulate any protocol within HTTP or SSL, fooling the deep packet inspection
    device into allowing the outbound traffic.


    ![](img/ea60ac7a8762deadd3823235c817f96d_284_0.png)'
