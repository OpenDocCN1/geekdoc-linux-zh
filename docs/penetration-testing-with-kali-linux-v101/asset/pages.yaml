    In the example above, we have tried to include the Windows `hosts` file, usually
    located at `C:\windows\system32\drivers\etc\hosts`. However, according to the
    error output, we see that a `.php` extension has been added to our request. This
    can be explained by how this code includes the file:


    ```

    Include($ lang . ''.php'' );

    ```


    In versions of PHP below 5.3, we would be able to terminate our request with a
    null byte (`%00`) that would cause the PHP engine to ignore everything after that
    byte. Using this trick, in our example, seems to work. The `.php` extension is
    removed from our request, the PHP engine includes the specified file.'
