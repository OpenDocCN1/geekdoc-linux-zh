  md: '# 15.4 - HTTP Tunneling


    HTTP Tunneling is a technique whereby a payload protocol is encapsulated within
    the HTTP protocol², usually as the body of an HTTP GET or POST request. When behind
    an HTTP proxy server, a variation of HTTP tunneling is to use the CONNECT HTTP
    method, where a client uses the CONNECT method to ask the proxy server to forward
    a TCP connection to a specific destination. The proxy then proceeds to make the
    connection on behalf of the client. Once the connection is established, the proxy
    continues to proxy the TCP stream to and from the client.


    ```

    root@kali:~# nc -vnv 192.168.1.130 8888

    (UNKNOWN) [192.168.1.130] 8888 (?) open

    CONNECT 192.168.11.203:00 HTTP/1.0


    HTTP/1.0 200 Connection established

    Proxy-agent: tinypoxy/1.8.3


    HEAD

    HTTP/1.1 200 OK

    Server: Microsoft-IIS/5.1

    Content-location: http://192.168.11.203/index.html

    Date: Wed, 19 Jun 2013 11:21:34 GMT

    Content-Type: text/html

    Accept-Ranges: bytes

    Last-Modified: Wed, 19 Jun 2013 07:43:47 GMT

    ETag: "fa3a2bbc06cce1:ac2"\

    Content-Length: 9

    sent 53, rcvd 344

    ```


    > ² http://www.w3.org/Protocols/rfc2616/rfc2616.html'
