    # 14.2.1.5 - Account Lockouts and Log Alerts


    By their nature, online password brute-force attacks are noisy. Multiple failed
    login attempts will usually generate logs and warnings on the target systems.
    In some cases, the target system may be set to lock out accounts with a pre-defined
    number of failed login attempts. This could be a disastrous outcome during a penetration
    test, as valid users may be unable to access the service with their credentials
    until an administrator re-enables their account. Keep this in mind before blindly
    running online brute-force attacks.'
