  md: '# 11.2 - Configuration Issues


    Penetration Testing with Kali Linux


    On penetration testing engagements, we often find that the process of privilege
    escalation is more often achieved by finding various misconfigurations on the
    victim machine, rather than actively exploiting a vulnerable service with higher
    privileges. This is especially true in corporate environments, where patches and
    updates are installed on a regular basis, leaving a relatively small known vulnerability
    attack surface.


    # 11.2.1 - Incorrect File and Service Permissions


    Software is prone to errors; we''ve seen that already in our buffer overflow module.
    However, input validation is not the only issue software developers need to worry
    about. Imagine the following scenario:


    A software developer creates a program that runs as a Windows service. During
    the installation of the program, the developer does not take care to verify the
    access permissions of the file used by their service, and the file is left in
    such a state that the **Everyone** Windows group has full **read** and **write**
    access to the file. This would allow a lower privileged user to replace the affected
    file used with a malicious one. The next time the service is restarted, or the
    machine is rebooted, the malicious file will be executed with SYSTEM privileges.'
  merge: -1
