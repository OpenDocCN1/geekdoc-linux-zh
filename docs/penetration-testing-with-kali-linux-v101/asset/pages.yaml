    #  14.1.6 - Password Profiling


    One way to customize our dictionary file and make it more potent against a specific
    target is by using password profiling techniques. This involves using words and
    phrases taken from the specific organization you are targeting and including them
    in your wordlists with the aim of improving your chances of finding a valid password.
    For example, consider megacorp.com, a company that deals with Nano-Technology.
    An administrator in this network used the password “nanobots93” to secure one
    of his services. “nanobots” happens to be a product by the company, which is listed
    on their main website.


    Using a tool like cewl, we can scrape the megacorp.com webservers to generate
    a password list from words found on the web.


    ```

    root@kali:~# cewl www.megacorp.com -m 6 -w megacorp-cewl.txt

    root@kali:~# cat megacorp-cewl.txt | wc -1

    331

    root@kali:~# head megacorp-cewl.txt

    MegaCorp

    important

    ...

    Systems

    Megacorpone

    nanotechnology

    anobots

    ...

    ```


    Cewl has retrieved the string “nanobots” from the megacorp.com website and that
    password is now present in a custom dictionary file, specific to megacorp.com.'
