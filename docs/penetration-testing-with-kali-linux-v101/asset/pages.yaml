  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    # 16. - The Metasploit Framework


    As you may have noticed, working with public exploits is not a simple job. They
    often don''t work or need modification and their shellcode may not always suit
    your needs. In addition, there is no standardization in the exploit command line
    usage. Some exploits are written in Perl, others in C, and we''ve even seen exploit
    payloads written to text file and sent using Netcat.


    Over the past few years, several frameworks have been developed, such as Metasploit,
    Core Impact, and Immunity Canvas. An exploit framework is a system that contains
    development tools geared toward development and usage. The frameworks standardize
    the exploit usage syntax and provide dynamic shellcode capabilities. This means
    that for each exploit in the framework, you can choose various shellcode payloads
    such as a bind shell, a reverse shell, download and execute shellcode, and so
    forth.


    As described by its authors, the Metasploit Framework⁸³ owned by Rapid7, is an
    advanced open-source platform for developing, testing, and using exploit code
    written in Ruby. This project initially started as a portable network game and
    has evolved into a powerful tool for penetration testing, exploit development,
    and vulnerability research. The Framework has slowly surely become the number
    exploit collection and development framework of every security auditor. It is
    frequently updated with new exploits and it is constantly being improved and further
    developed by Rapid7 and the security community.


    > ⁸³ http://www.metasploit.com/'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# OFFENSIVE security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    Kali Linux contains two Metasploit packages by default: metasploit-framework,
    which contains the open source elements of the project, and the metasploit package,
    which contains the commercial tool Metasploit Pro.


    Newcomers to the Metasploit Framework (MSF) are often overwhelmed by the multitude
    of features and different use cases for the tool. The Metasploit Framework can
    come handy in almost every phase of a penetration test, from passive and active
    information gathering, to vulnerability research and development, and all the
    way to client side attacks and post exploitation techniques.


    With all this different functionality available in the MSF, it’s easy to see how
    one can get lost within the tool. Fortunately for us, the MSF provides a unified
    and sensible interface using all of its features.


    # 16.1 - Metasploit User Interfaces


    There are several user interfaces that we can use to operate the MSF. The following
    is list of the most commonly used interfaces:


    +   * msfconsole – This is an interactive console interface which is most commonly
    used to run regular tasks.


    +   * msfcli - a deprecated command line interface to the MSF which is useful
    only in certain situations.


    +   * armitage - a third party add-on to the MSF providing a graphical user interface
    to the MSF.'
