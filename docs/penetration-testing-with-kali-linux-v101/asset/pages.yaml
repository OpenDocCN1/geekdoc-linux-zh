- img_proc: true
  md: '# 4.2.3 - Common Port Scanning Pitfalls


    +   - UDP port scanning is often unreliable, as firewalls and routers may drop
    ICMP packets. This can lead to false positives in your scan, and you will regularly
    see UDP port scans showing all UDP ports open on a scanned machine.


    +   - Most port scanners do not scan all available ports, and usually have a preset
    list of “interesting ports” that are scanned.


    +   - People often forget to scan for UDP services, and stick only to TCP scanning,
    thereby seeing only half of the equation.'
