    #  10.2.2.2 - Uploading Files with FTP


    Windows operating systems contain a default FTP client that can also be used for
    file transfers. As we''ve previously seen, the ftp.exe client is an interactive
    program that requires input to complete. We will need to solve this problem before
    attempting to use FTP as a file transfer protocol. The ftp help option (-h) has
    some clauses that come to our aid:


    ![](img/ea60ac7a8762deadd3823235c817f96d_184_0.png)


    We can turn the FTP file transfer to a non-interactive process, by providing ftp.exe
    client with a text file containing the commands to be executed. On the attacking
    side, we will need to set up an FTP server, to which the victim machine will connect,
    and download the requested file.


    We can quickly install the FTPTPd⁴ server in Kali as follows:


    ```

    root@kali:~# apt-get update && apt-get install-ftpd

    ```'
