    4.1.5 - DNS Zone Transfers


    A zone transfer is similar to a database replication act between related DNS servers.

    This process includes the copying of the file from a master DNS to a slave server.
    The zone file contains a list of all the DNS names configured for that zone. Zone
    transfers should usually be limited to authorized slave DNS servers. Unfortunately,
    many administrators misconfigure their DNS servers, and as a result, anyone asking
    for a copy of the DNS server will receive one.


    This is equivalent to handing a hacker the corporate network layout on a silver
    platter. All the names, addresses, and functionality of the servers can be exposed
    to prying eyes. I have seen organizations whose DNS servers were misconfigured
    so badly that they did not separate their internal DNS namespace and external
    DNS namespace into separate, unrelated zones. This resulted in a complete map
    of the internal and external network structure.


    A successful zone transfer does not directly result in a network breach. However,
    it does facilitate the process. The host command syntax for preforming a zone
    transfer as follows.


    ```

    host -l <domain name> <dns server address>

    ```


    From our previous command, we noticed that two DNS servers serve the megacorpne.com
    domain: ns1 and ns2. Let''s try a zone transfer on each of them.


    ```

    root@kali:~ # host -l megacorpne.com ns1.megacorpne.com

    ; Transfer failed.

    Using domain server:

    Name: ns1.megacorpne.com

    Address: 50.7.67.186#53

    Aliases:

    ```'
