    Penetration Testing with Kali Linux


    # ## 15.2.2 Remote Port Forwarding


    The remote port-forwarding feature in SSH is an extremely useful technique that
    is often perplexing to newcomers. SSH remote port forwarding allows us to tunnel
    a remote port to a local server. The effects of this technique are best demonstrated
    through the following scenario.


    We have just “popped a shell” on an internal, non-routable corporate machine during
    an assessment by using a client side attack. We have dumped and cracked some user
    passwords and have discovered that the local machine you have penetrated is running
    the Windows RDP service on port 3389.


    From the penetrated internal machine, you create a reverse SSH tunnel with your
    attacking machine, through which you expose the victim’s RDP port on your attacking
    machine on port 3390. We can create this tunnel with SSH, using syntax similar
    to the following:


    ```

    ssh <gateway> -R <remote port to bind>:<local host>:<local port>

    ```'
