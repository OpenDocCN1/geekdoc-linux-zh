    # 7.4 - Checking for Bad Characters


    Depending on the application, vulnerability type, and protocols in use, there
    may be certain characters that are considered “bad” and should not be used in
    your buffer, return address, or shellcode. One example of a common bad character
    (especially in buffer overflows by unchecked string copy operations) is the null
    byte (0x00).


    This character is considered bad because a null byte is also used to terminate
    a string copy operation, which would effectively truncate our buffer to wherever
    the first null byte appears.


    Another example of a bad character, specific to the POP3 PASS command, is the
    carriage return (0x0D), which signifies to the application that the end of the
    payload has been reached.


    An experienced writer knows to check for bad characters,to prevent future problems.
    An easy way to do this is to send all possible characters, from 0x00 to 0xff,
    as part of our buffer, and see how these characters are dealt with by the application,
    after the crash occurs.


