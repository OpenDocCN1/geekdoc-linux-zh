    Penetration Testing with Kali Linux


    # 2.3 - Wireshark


    As a security professional, learning how to use a network packet sniffer is vital
    for day-to-day operations. Whether you are trying to understand a protocol, debug
    a network client, or analyze traffic, you''ll always end up needing a network
    sniffer.


    # 2.3.1 - Wireshark Basics


    Wireshark⁸ uses Libpcap⁹ (on Linux) and Winpcap⁰ (on Windows) libraries in order
    to capture packets from the network. If the user applies any capture filters¹¹
    for the Wireshark session, the filtered packets get dropped and only relevant
    data is passed on the capture engine. The capture engine dissects the incoming
    packets, analyzes them, and then applies any additional display filters¹² before
    showing the output to the user. The secret to using network sniffers such as wireshark
    is using capture and display filters to remove all information that you are not
    interested in.


    +   ⁸ https://www.wireshark.org/

    ⁹ http://www.tcpdump.org/

    ⁰ http://www.winpcap.org/

    ¹¹ http://wiki.wireshark.org/CaptureFilters

    ¹² http://wiki.wireshark.org/DisplayFilters'
