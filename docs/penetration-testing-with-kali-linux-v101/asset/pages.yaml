  md: "# Penetration Testing with Kali Linux\n\n# 12.3 - Java Signed Applet Attack\n\
    \nThe previous client side exploit relied on an existing vulnerability in our\
    \ victim’s browser, because of our information gathering efforts, we had the opportunity\
    \ to know of this vulnerability ahead of time. However, this is not always possible,\
    \ nor is it always the best approach to take during client side attacks. A good\
    \ example of a client side exploit based on a human vulnerability, as opposed\
    \ to a software vulnerability, is the Java Applet client side attack.\n\nThis\
    \ attack affects targets with Java installed and enabled in their browsers – a\
    \ required feature for many administrators and power users. As Java-enabled browsers\
