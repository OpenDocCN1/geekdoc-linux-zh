    Penetration Testing with Kali Linux


    # 0.3 - Legal


    The following document contains the lab exercises for the course and should be
    attempted ONLY INSIDE THE OFFENSIVE SECURITY SECLUDED LAB. Please note that most
    of the attacks described in the lab guide would be ILLEGAL if attempted on machines
    that you do not have explicit permission to test and attack. Since the lab environment
    is secluded from the Internet, it is safe to perform the attacks inside the lab.
    Offensive Security assumes no responsibility for any actions performed outside
    the secluded lab.


    # 0.4 - The megacorpone.com Domain


    The megacorpone.com domain represents a fictitious company created by Offensive
    security. The megacorpone.com domain has a seemingly vulnerable external network
    presence, which aids us during the length of our course.


    # 0.5 - Offensive Security Labs


    # 0.5.1 - VPN Labs Overview


    The following graphic is a simplified diagram of the PWK labs. You will initially
    connect via VPN into the Student Network and how your way into additional networks
    as the course progresses. Once you have completed the course videos, you will
    have the basic skills required to penetrate most of the vulnerable computers in
    our lab. Certain machines will require additional research and a great deal of
    determination in order to compromise them.'
  merge: -1
  pgno: 14
