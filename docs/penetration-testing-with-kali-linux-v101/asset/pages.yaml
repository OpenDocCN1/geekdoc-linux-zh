    # 14.3 - Password Hash Attacks


    # 14.3.1 - Password Hashes


    A cryptographic hash function is a one-way function implementing an algorithm,
    given an arbitrary block of data, returns a fixed-size bit string called a hash
    value or message digest. One of the most uses of cryptographic hash functions
    is their application in password verification. Most systems that use a password
    authentication mechanism need to store these passwords locally on the machine.
    Rather than storing passwords in clear-text, modern authentication mechanisms
    usually store them as hashes to improve security. This is true for operating systems,
    network hardware, etc. This means that during the authentication process, the
    password presented by the user is hashed and compared with the previously stored
    message digest.


    # 14.3.2 - Password Cracking


    In cryptanalysis, password cracking is the process of recovering the clear text
    passphrase, given its stored hash. Once the hash type is known, a common approach
    to password cracking is to simulate the authentication process by repeatedly trying
    guesses for the password and comparing the newly-generated digest with a stolen
    or dumped hash.


    Identifying the exact type of hash without having further information about the
    program or mechanism that generated it can be very challenging and sometimes even
    impossible. A list of common hashes that you can use for reference when trying
    to identify a password hash can be found on the Openwall website²⁴. There are
    three hash properties you should pay attention to:'
