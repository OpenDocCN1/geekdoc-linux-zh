  md: "# 13.4 - MySQL SQL Injection\n\nSQL Injection¹⁸ is a common web vulnerability\
    \ found in dynamic sites that is caused by unsanitized user input, which is then\
    \ passed on a database. This user input can then be manipulated to “break out”\
    \ of the original query made by the developers, to include more malicious actions.\n\
    \nThese types of vulnerabilities can lead to database information leakage, and\
    \ depending on the environment, could also lead to complete server compromise.\n\
    \nIn the following module, we will examine SQL injection attacks under a PHP/MySQL\
    \ environment. While the concepts are the same for other environments, the syntax\
    \ used during the attack may accommodate different database engines or scripting\
    \ languages.\n\n# 13.4.1 - Authentication Bypass\n\nThe authentication bypass\
    \ is a classic SQL injection example that effectively demonstrates the dangers\
    \ of evil users playing with your database. Let’s examine the admin page again\
    \ and take a look at its underlying source code:\n\n```\nmysql_select_db('webappdb');\n\
    $User = $_POST['user']; // unsanitized\n$pass = $_POST['pass']; // unsanitized\n\
    $query = 'select * from users where name = '$user' and password = '$pass';\n$queryN\
    \ = mysql_query($query) or die(mysql_error($query));\nif ($mysql_num_rows($queryN)\
    \ == 1) {\n  $resultN = mysql_fetch_assoc($queryN);\n  $_SESSION['user'] = $_POST['user'];\n\
    \  header(\"location:admin.php\");\n```"
  merge: -1
