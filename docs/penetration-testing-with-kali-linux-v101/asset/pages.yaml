- img_proc: true
  md: '# 1.2.2 - SSH Service


    The Secure Shell (SSH) service is most commonly used to remotely access a computer,
    using a secure, encrypted protocol. However, as we will see later in the course,
    the SSH protocol has some surprising and useful features, beyond providing terminal
    access. The SSH service is TCP-based and listens by default on port 22. To start
    the SSH service in Kali, type the following command into a Kali terminal.


    ```

    root@kali:~# service ssh start

    Starting OpenBSD Secure Shell server: sshd.

    ```


    We can verify that the SSH service is running and listening on TCP port 22 by
    using the netstat command and piping the output into the grep command to search
    the output for sshd.


    ```

    root@kali:~# netstat -antp|grep sshd

    tcp 0 0.0.0.0:22 0.0.0.0:* LISTEN 25035/sshd

    tcp6 0 0 :::22 :::* LISTEN 25035/sshd

    ```


    If, like many users, you want to have the SSH service start automatically at boot
    time, you need to enable and disable it using the update-rc.d script as follows.
    The update-rc.d script is used to manage most services within Kali Linux.


    ```

    root@kali:~# update-rc.d ssh enable

    update-rc.d: using dependency based boot sequencing

    root@kali:~#

    ```


    # 1.2.3 - HTTP Service


    The HTTP service can come in handy during a penetration test, either for hosting
    a site, or providing a platform for downloading files to a victim machine. The
    HTTP service is'
  merge: -1
