  md: '# Penetration Testing with Kali Linux


    # 2.1.4.1 - Remote Administration with Netcat


    One of the most useful features of netcat is its ability to do command redirection.
    Netcat can take an executable file and redirect the input, output, and error messages
    to a TCP/UDP port rather than the default console.


    To further explain this, consider the cmd.exe executable. By redirecting the stdin,
    stdout, and stderr to the network, you can bind cmd.exe to a local port. Anyone
    connecting to this port will be presented with a command prompt belonging to this
    computer. To further drive this home, consider the following scenarios, involving
    Bob and Alice.


    # 2.1.4.1 - Netcat Bind Shell Scenario


    In our first scenario, Bob (running Windows) has requested Alice''s assistance
    (running Linux) and has asked her to connect to his computer and issue some commands
    remotely. Alice, however, is behind a NAT''d connection, and has an internal IP
    address. To complete the scenario, Bob needs to bind cmd.exe to a TCP port on
    his public IP address, and ask Alice to connect to this particular IP and port.
    Bob will proceed to issue the following command with netcat.


    ```

    C:\Users\offsec>nc -nlvp 4444 -e cmd.exe

    listening on [any] 4444 ...

    ```'
