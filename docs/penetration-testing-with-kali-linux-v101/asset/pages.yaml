  md: '# 15. - Port Redirection and Tunneling


    This next module is going to be a brain teaser. We will deal with various forms
    of port redirection, tunneling, and traffic encapsulation. Understanding and mastering
    these techniques provide us with the surgical tools needed to manipulate the direction
    flow of the targeted traffic, which can often be useful in restricted network
    environments.


    Tunneling⁷⁹ a protocol involves encapsulating it within a different payload protocol
    than the original. By using tunneling techniques, it''s possible to carry a given
    protocol over an incompatible delivery-network, or to provide a secure path through
    an untrusted network.


    Port redirection and tunneling concepts may be hard to digest at first, so we
    have created several hypothetical scenarios that will provide a better understanding
    of the process. Take time to understand the following scenarios before proceeding
    with each technique.


    # 15.1 - Port Forwarding/Redirection


    Port forwarding/redirection is the simplest traffic manipulation technique we
    examine. It involves accepting traffic on a given IP address and port and then
    simply redirecting it to a different IP address and port. A simple port-forwarding
    tool such as rinetd⁸⁰ is convenient and easy to configure.


    ```

    root@kali:~# apt-get install rinetd

    root@kali:~# cat /etc/rinetd.conf

    ```'
