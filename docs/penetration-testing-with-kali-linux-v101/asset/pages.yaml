    # 3.3.2 - Whois Enumeration


    Whois²¹ is a name for a TCP service, a tool, and a type of database. Whois databases
    contain name server, registrar, and, in some cases, full contact information about
    a domain name. Each registrar must maintain a Whois database containing all contact
    information for the domains they host. A central registry Whois database is maintained
    by the InterNIC²². These databases are usually published by a Whois server over
    TCP port 43 and are accessible using the whois client program.


    ```

    root@kali:~# whois megacorporne.com


    Whois Server Version 2.0


    Domain names in the .com and .net domains can now be registered with many different
    competing registrars. Go to: http://www.internic.net for detailed information.


    Domain Name: MEGACPORONE.COM

    Registrar: GANDI SAS

    Whois Server: whois.gandi.net

    Referral URL: http://www.gandi.net

    Name Server: NS1.MEGACPORONE.COM

    Name Server: NS2.MEGACPORONE.COM

    Name Server: NS3.MEGACPORONE.COM

    Status: clientTransferProhibited

    Updated Date: 12-apr-2013

    Creation Date: 22-jan-2013

    Expiration Date: 22-jan-2016


    >>> Last update of whois database: Tue, 11 Jun 2013 18:02:59 UTC <<<

    ```


    ²¹ https://en.wikipedia.org/wiki/Whois

    ²² http://www.internic.net/'
