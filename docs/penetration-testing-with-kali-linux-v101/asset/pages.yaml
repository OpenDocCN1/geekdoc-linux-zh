    # 4.2.2 - UDP Scanning


    Since UDP is stateless, and does not involve a three-way handshake, the mechanism
    behind UDP port scanning is different. Using wireshark while UDP scanning a lab
    machine with netcat to understand how the UDP port works. The screenshot below
    shows the wireshark capture of a UDP netcat scan on ports 160-162:


    ```

    root@kali:~# nc -nv -u -z -w 1 10.0.0.19 160-162

    (UNKNOWN) [10.0.0.19] 161 (snmp) open

    ```


    ![](img/ea60ac7a8762deadd3823235c817f96d_94_0.png)


    Figure 26 - Wireshark Capture of a UDP Netcat Port Scan


    From the wireshark capture, you will notice that UDP packet is sent to a specific
    port. If the UDP port is open, no reply is sent back from the target machine.
    If the UDP port is closed, an ICMP unreachable port should be sent back from the
    target machine.'
  merge: -1
