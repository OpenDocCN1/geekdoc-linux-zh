    # 13.4.3 - Column Enumeration


    Depending on the verbosity of the web application, an attacker could try to use
    the "order by" output query to gather information about the database structure.
    For example, note the effect the following query on the vulnerable page:


    ```

    http://192.168.11.35/comment.php?id=738 order by 1

    ```


    This query instructs the database to order the output, using the first column
    in the select query as reference. The page renders with no errors. If we try to
    increase the column count, we will eventually get an error message similar to
    the following:


    ![](img/ea60ac7a8762deadd3823235c817f96d_236_0.png)


    Figure 66 - We Eventually Receive an Error Message


    This error provides us with important information. The current table in use by
    the vulnerable page has six columns.


    We will now try to use "union select" statements to expose data from the database.
    The "union all select" statement is useful to inject as it allows us to add our
    own select statement to the original query and often have the output shown on
    the page. The only issue with "union all select" is that our queries must have
    the same number of'
