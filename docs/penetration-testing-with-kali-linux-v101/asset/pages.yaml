  md: '# 5 - Vulnerability Scanning


    Penetration Testing with Kali Linux


    Vulnerability scanning is the process of using automated tools to discover, identify,
    vulnerabilities in a network. Vulnerability scanners come in many different forms,
    from simple scripts that identify a single vulnerability, to complex commercial
    software engines that scan for thousands of them.


    Vulnerability scans can generate a great deal of traffic and, in some cases, can
    even result in denial of service conditions on many network devices, so caution
    must be exercised before making use of mass vulnerability scanners on a penetration
    test.


    # 5.1 - Vulnerability Scanning with Nmap


    In the port-scanning module, we briefly touched on Nmap NSE scripts. The Nmap
    NSE scripts can be used, not only for enumeration, but also to conduct vulnerability
    scanning. All NSE scripts are located in the /usr/share/nmap/scripts folder.


    ```

    root@kali:~# cd /usr/share/nmap/scripts/

