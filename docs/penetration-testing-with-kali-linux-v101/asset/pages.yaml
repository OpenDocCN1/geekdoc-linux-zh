  md: "# OFFENSIVE SECURITY\n\nPenetration Testing with Kali Linux\n\nThere are a\
    \ couple of interesting things to notice in the command above:\n\n+   1) The immense\
    \ size of the output file: 160 GB, with over 19 billion entries.\n   Depending\
    \ on what you are trying to brute-force, such as a large dictionary file might\
