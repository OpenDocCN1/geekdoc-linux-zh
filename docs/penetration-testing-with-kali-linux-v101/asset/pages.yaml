  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    # 9.2 - Customizing and Fixing Exploits


    Due to varying development environments, vulnerable software versions, and different
    software patches, it is understandable that many (if not most) of the public exploits
    found on the Internet will not work, straight out of the box. We''ll find everything
    from wrong offsets, return addresses intended for different operating systems
    or patch levels, and bad code.


    Adding to this messy, many exploits might be one shots, meaning that if the exploit
    is unsuccessful, the service will crash, and will not be available for further
    exploitation attempts until it is restarted, or until the machine is rebooted.


    # 9.2.1 - Setting Up a Development Environment


    For the reasons above, we will never run an exploit without examining its code,
    and understanding its inner workings. Once we have done that, we will set up a
    small development environment that matches the operating system version and vulnerable
    software version, in order to test and improve existing exploits. Once we are
    fairly certain that our fixed exploit will work on the target machine, we can
    then proceed to launch it against our victim.


    # 9.2.2 - Dealing with Various Exploit Code Languages


    Exploit code can come in all forms. From Python, Perl and Ruby scripts, to C or
    C++. To further complicate things, languages such as C and C++ have different
    flavors between Linux/Unix and Windows, and this code is not cross-compatible.


    For example, in our previous search for additional SLMail exploits, in the exploitdb
    archive, we found several results. Let''s take a closer look at two of them: 643.c
    and 646.c.'
