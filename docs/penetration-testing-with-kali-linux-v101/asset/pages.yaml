    # 12.1.3 - Social Engineering and Client Side Attacks


    As most client side attacks require some form of interaction with the target,
    (requiring the target to click on a link, open an email, run an attachment, open
    a document, etc), supporting this operation with social engineering efforts can
    greatly increase your chances of success. Imagine the following scenario.


    You are on an engagement, trying to execute a client side attack against the Human
    Resources department. You see an open job posting and send in a resume in a malformed
    PDF that fails to open. The next day, you get a mail back regarding the human
    resources manager’s inability to open your resume. You respond back, asking what
    version of Acrobat they use, as you might have them an incompatible version. On
    the way, you sneak in the question “..and what Windows version are you running?”
    The answer you receive confirms that your target is using a vulnerable version
    of Acrobat Reader.


    Armed with this information, you craft a second PDF file that targets their specific
    Acrobat and Windows versions, and send it over. Of course, this is a simplified
    success story – your social engineering pretexts may have to be more intricate.'
