  md: '# 0. - Penetration Testing: What You Should Know


    # 0.1 - About Kali Linux


    Kali Linux is a free security auditing operating system and toolkit that incorporates
    more than 300 penetration testing and security auditing, delivering an all-in-one
    solution that enables IT Administrators and security professionals to test the
    effectiveness of risk mitigation strategies.


    Kali Linux offers a smoother, easier penetration testing experience, making it
    more accessible to IT generalists as well as security specialists and its adherence
    to Debian Development standards provide a more familiar environment for IT Administrators.
    The result is a more robust solution that can be updated more easily. Users can
    also customize the operating system to tailor it to their needs and preferences.


    All the programs packaged with the operating system have been evaluated for suitability
    and effectiveness. They include Metasploit for network penetration testing, Nmap
    for port and vulnerability scanning, Wireshark for monitoring network traffic,
    and Aircrack-Ng for testing the security of wireless networks.


    Kali Linux can run on a wide variety of hardware, is compatible with numerous
    wireless and USB devices, and also has support for ARM devices.


    # 0.2 - About Penetration Testing


    A penetration test (pen test) is an ongoing cycle of research and attack against
    a target boundary. The attack should be structured and calculated, and when possible,
    verified in a lab before being implemented on a live target. This is how we visualize
    the process of a pen test:'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# # Penetration Testing with Kali Linux


    ![](img/ea60ac7a8762deadd3823235c817f96d_13_0.png)


    Figure 1 - A Diagram of a Penetration Testing Methodology


    As the model suggests, the more information we gather, the higher the probability
    of a successful penetration. Once we penetrate the initial target boundary, we
    usually start the cycle again—for example, gathering information about the internal
    network in order to penetrate deeper.


    Eventually, each security professional develops his or her methodology, usually
    based on specific technical strengths. The methodologies suggested in this course
    are only suggestions. We encourage you to check pages such as Wikipedia¹ for additional
    methodologies, including the Open Source Security Testing Methodology Manual (OSSTMM²,
    in order to broaden your point of view.


    ¹ http://en.wikipedia.org/wiki/Penetration_test

    ² http://www.isecom.org/


    PWK Copyright © 2014 Offensive Security Ltd. All rights reserved. Page 14 of 361'
  merge: -1
  pgno: 13
