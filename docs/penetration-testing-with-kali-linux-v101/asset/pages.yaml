    The simplest TCP port scanning technique, usually called CONNECT scanning, relies
    on the three-way TCP handshake²⁶ mechanism. This mechanism is designed so that
    two hosts attempting to communicate can negotiate the parameters of the network
    TCP socket connection before transmitting data. Connect port scanning involves
    attempting


