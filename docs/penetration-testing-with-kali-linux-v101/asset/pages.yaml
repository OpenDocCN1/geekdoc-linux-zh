    # 10.2.2.4 - Using debug.exe to Transfer Files


    Another common file transfer method employed against 32 bit Windows operating
    systems is the debug.exe program acts as an assembler, disassembler, and a hex
    dumping tool.


    The concept behind the use of debug.exe for file transfers is similar to the use
    of scripting languages. We use non-interactive echo commands, to write out the
    binary file in its hex value equivalents, and use debug.exe to assemble the written
    text file into a binary file. There is a 64k byte size limit to the files that
    can be created by debug.exe.


    For example, let''s try to use debug.exe to transfer Netcat for Windows from our
    Kali Linux machine, to the Windows 7 Lab machine, over a remote shell. We''ll
    start by locating and inspecting the nc.exe file on Kali Linux. We notice the
    file size is 59k – just under our 64k limit. Let''s see if we can further decrease
