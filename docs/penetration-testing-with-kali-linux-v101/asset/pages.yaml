  md: '# 14.2 - Online Password Attacks


    Penetration Testing with Kali Linux


    Online password attacks involve password-guessing attempts for networked services
    that use a username and password authentication scheme. This includes services
    such as HTTP, SSH, VNC, FTP, SNMP, POP3, etc. In order to be automate a password
    attack against a given network service, we must be able to generate authentication
    requests for the specific protocol in use. For Fortunately for us, tools such
    as Hydra⁷¹, Medusa⁷², Ncrack⁷³, and even Metasploit have built in handling of
    many network protocol authentication schemes.


    # 14.2.1 - Hydra, Medusa, and Ncrack


    These three tools are probably the most popular for performing password security
    audits. They each have their strengths and weaknesses and can handle various protocols
    effectively. Each of these tools operates in a manner similar to one another,
    but be sure to take the time to learn the idiosyncrasies of each one.


    # 14.2.1.1 - HTTP Brute Force


    According to its authors, Medusa is intended to be a speedy, massively parallel,
    modular, login brute-forcer. The following is an example of a brute-force attack
    using Medusa, initiated against an htpasswd protected web directory:


    ```

    root@kali:~ medusa -h 192.168.11.219 -u admin -P password-file.txt -M http -m

