    # 7.5 - Redirecting the Execution Flow


    Now comes the interesting bit. We''ve placed our shellcode in a memory space that
    is easily accessible through the ESP register, and we control the EIP register.
    We also figured out which characters are allowed to be in our buffer, and which
    are not. Our next task is finding a way to redirect the execution flow to the
    shellcode located at the memory address that the ESP register is pointing to,
    at crash time.


    The most intuitive thing to do would be to try replacing the B''s overwrite EIP
    with the address that pops up in the ESP register, at the time of the crash. However,
    as you should have noticed from the past debugger restarts, the value of ESP changes,
    from crash to crash. Therefore, hardcoding a stack address value would not provide
    a reliable way of getting to our buffer. This is because stack addresses change
    often, especially in threaded applications such as SLMail, as each thread has
    its reserved stack memory region allocated by the operating system.


    # 7.5.1 - Finding a Return Address


    If we can''t jump directly to our buffer, what other options do we have? We need
    a more generic way to get to the address ESP points to, at the time of the crash.
    If we can find an accessible, reliable address in memory that contains an instruction
    as JMP ESP, we could jump to it, and in end up at the address pointed to, by the
    ESP register, at the time of the jump. This would provide a reliable, indirect
    way to reach the memory indicated by the ESP register, regardless of its absolute
    value. But how do we find such an address? To aid comes the Immunity Debugger
    script, mona.py. This script will help us identify modules in memory that we can
    search for such “return address”, which in our case is a JMP ESP command. We will
    need to make sure to choose a module with the following criteria:'
