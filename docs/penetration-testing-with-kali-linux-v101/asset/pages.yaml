    # 3. - Passive Information Gathering


    Passive Information Gathering is the process of collecting information about your
    target using publicly available information. This could include services like
    search engine results, whose information, background check services, public company
    information, in other words, any act of gathering information about your target
    without communicating with them directly can be considered “passive”.


    As with anything in life, preparation leads to success. Specifically for us, this
    means the more information we manage to gather about our target, prior to our
    attack, the more likely we are to succeed.


    # A Note From the Author


    A good example of passive information gathering occurred during a penetration
    test on a small company, several years ago. This company had virtually no Internet
    presence, and very few extremely exposed services, which all proved to be secure.
    After scouring Google for hours, I finally found a forum post made by one of the
    target’s employees, in a stamp-collecting forum:


    > Hi!

    I''m looking for rare stamps from the 1950''s - for sale or trade.

    Please contact me at david@company-address.com

    Cell: 999-9999999


    This was all the information I needed to launch a semi-sophisticated client-side
    attack. I quickly registered a domain such as rare-stamps-trade.com and designed
    a landing page which displayed various rare stamps from the 1950''s, which I found
    using Google Images. The domain name and design of the site both led to increasing
    the perceived reliability of the stamp website.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    I proceeded to embed some nasty HTML in the site''s code, containing exploit code
    for the latest Internet Explorer security hole (MS05-001 at the time), and called
    David on his cellular phone. I told him my grandfather had given me a huge rare
    stamp collection from which I would be willing to trade several stamps.


    I made sure to place this call on a workday, to increase my chances of reaching
    him at the office. David was overjoyed to receive my call, and without hesitation,
    he visited my malicious website to see the “stamps” I had to offer. While browsing
    my site, the exploit code on the website downloaded and executed a “Netcat like
    payload” on his local machine, sending me back a reverse shell.


    This is a good example of how innocuous information, such as an employee tying
    up his personal life with his corporate email, can lead to a successful penetration.


    Information-gathering in a penetration test is the most important phase. Knowing
    your target before attacking it is a proven recipe for success. Even mundane forum
    posts can provide you with useful information.'
