    # 4.2 - Port Scanning


    Port scanning is the process of checking for open TCP or UDP ports on a remote
    machine. Please note that port scanning is illegal in many countries and should
    not be performed outside the labs. That said, we have now moved from the passive
    phase to the active phase, which involves more direct interaction with the target
    servers. It is vital that we understand the implications of port scanning, as
    well as the impact that certain port scans can have on a network. To further emphasize
    this, consider the following embarrassing story.


    # A Note From the Author


    I was once running an Nmap scan during an internal penetration test. Unfortunately,
    I did not notice the unusual subnet mask employed on the local network, and ended
    up running the Nmap scan through a remote uplink that was offsite. The routers
    separating these two networks were overwhelmed by the intense scan, with terrible
    results. Never run port scans blind. Always think of the traffic implications
    of your scans, and their possible effect on the target machines.


    # 4.2.1 - TCP CONNECT / SYN Scanning


