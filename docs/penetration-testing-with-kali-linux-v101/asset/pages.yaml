    [*] URL: http://www.arin.net/rest/poc;domain=cisco.com

    [*] URL: http://www.arin.net/rest/poc/GAB42-ARIN

    [*] Gary Abbott (gabbott@cisco.com) - Whoos contact (Concord, TN - United States)

    ..

    ```'
