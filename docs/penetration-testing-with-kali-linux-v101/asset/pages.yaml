    # 11. - Privilege Escalation


    Privilege escalation is the process of increasing the level of access to a machine,
    or network. In most operating systems, and networked environments, the process
    of privilege escalation is inherently prevented, in order to adhere to the user
    privilege separation model. Therefore, by definition, the process of privilege
    escalation involves breaking this security model.


    # 11.1 - Privilege Escalation Exploits


    The expression privilege escalation exploits is a tricky one. By definition, most
    exploits fall under this category. If they work, they will elevate their privileges
    in some way on the target machine, by successfully exploiting an existing vulnerability.
    However, the term privilege escalation exploit is usually reserved for exploits
    that run locally, on a victim machine, most commonly exploiting a process or service
    with higher privileges. If the exploitation is successful, their exploit payload
    will be executed with those higher privileges.


    # 11.1.1 - Local Privilege Escalation Exploit in Linux Example


    Consider the following scenario: You have discovered SSH credentials for a user
    on an Ubuntu machine. You SSH in, and discover that you have normal user privileges.
    You discover that the machine is running Ubuntu 11.10, 32 bit, which has never
    been patched. You decide to use a known Linux kernel root exploit, which affects
    CVE-2012-0056. You download the exploit to the victim machine, compile, and run
    it:


    ```

    offsec@ubuntu:~$ id

    uid=1000(offsec) gid=1000(offsec)

    offsec@ubuntu:~$ cat /etc/shadow|grep root

    ```'
