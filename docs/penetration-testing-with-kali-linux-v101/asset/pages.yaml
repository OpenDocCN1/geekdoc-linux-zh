    # 14.1 - Windows Credential Editor (WCE)


    Windows Credentials Editor (WCE) is a security tool that allows one to perform
    several attacks to obtain clear text passwords and hashes from a compromised Windows
    host. Among others, WCE can steal NTLM credentials from memory and dump cleartext
    passwords stored by Windows authentication packages installed on the target system
    such as msv1_0.dll, kerberos.dll, and digest.dll. It is quite interesting to note
    that WCE is able to steal credentials by using DLL injection or by directly reading
    the LSASS process memory. The second method is more secure in terms of operating
    system stability, as code is not being injected into a highly privileged process.


