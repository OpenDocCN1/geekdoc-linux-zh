    # 1.2 - Managing Kali Linux Services


    Kali Linux is a specialized Linux distribution aimed at security professionals.
    As such, it contains several non-standard features. The default Kali installation
    ships with several services preinstalled, such as SSH, HTTP, MySQL, etc. If left
    untouched, these services would load at boot time, which would result in Kali
    Linux exposing open ports by default - something we want to avoid, for security
    reasons. Kali deals with this issue by updating our settings to prevent network
    services from starting at boot time. Kali also contains a mechanism to both whitelist
    and blacklist various services. The following module will discuss some of these
    services, as well as how to operate and manage them.


    # 1.2.1 - Default root Password


    If you installed Kali from an image file, the installation process should have
    prompted you for a root password. If you are using the Kali Linux VMware image,
    as recommended, the default root password is toor. Make sure to change any default
    or weak passwords to something long, complex, and secure before starting any services
    such as SSH. The password can be changed with the passwd command below.


    ```

    root@kali:~# passwd

    Enter new UNIX password:

    Retype new UNIX password:

    password: password updated successfully

    root@kali:~#

    ```'
  merge: -1
