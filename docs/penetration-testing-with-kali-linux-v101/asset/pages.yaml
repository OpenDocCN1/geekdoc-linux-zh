    # 1.1.3 - Find, Locate, and Which


    There are a number of Linux utilities that can be used to locate files in a Linux
    installation with three of the most common being **find, locate, and which**.
    All of these utilities all have similar functions, but work and return data in
    different ways.


    Prior to using the **locate** utility, we must first use the **updatedb** command
    to build a local database of all files on the filesystem. Once the database has
    been built, **locate** can be used to easily query this database when looking
    for local files. Before running, you should always update the local database using
    the **updatedb** command.


    ```

    root@kali:~# updatedb

    root@kali:~# locate sbd.exe

    /usr/share/windows-binaries/backdoors/sbd.exe

    ```


    The **which** command searches the directories that are defined in the $PATH environment
    variable for a given filename. If a match is found, **which** returns the full
    path to the file as shown below.


    ```

    root@kali:~# which sbd

    /usr/bin/sbd

    ```'
