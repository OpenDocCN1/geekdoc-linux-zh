    # 15.2 - SSH Tunneling


    The SSH protocol has many hidden secrets. One of its abilities is to create encrypted
    tunnels within the SSH protocol⁸¹, which supports bi-directional communication
    channels. This obscure feature of the SSH protocol has far-reaching implications
    for both penetration testers and security administrators, as the following examples
    will demonstrate.


    # 15.2.1 - Local Port Forwarding


    SSH local port forwarding allows us to tunnel a local port to a remote server,
    using SSH as the transport protocol. The effects of this technique are similar
    to the port forwarding effects, with a few twists. Consider the same scenario
    we encountered in the port-forwarding example. We can use the SSH local port forwarding
    feature to bypass the existing egress restriction using syntax similar to the
    following:


    ```

    ssh <gateway> -L <local port to listen>:<remote host>:<remote port>

    ```'
  merge: -1
