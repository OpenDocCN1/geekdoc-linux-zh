    # 16.4 - Auxiliary Modules


    # 16.4.1 - Getting Familiar with MSF Syntax


    The Metploit Framework includes hundreds of auxiliary modules that provide functionality
    such as protocol enumeration, port scanning, fuzzing, sniffing, etc. The modules
    all follow common syntax usage, which makes them easy to explore and use. Let''s
    look at a few common MSF auxiliary modules to get a feel for the syntax needed
    to operate the MSF.


    ```

    msf > show auxiliary

    ```


    The show auxiliary command will display a long list of all the different auxiliary
    modules in MSF which can be used for various tasks, such as information gathering
    (under the gather/ hierarchy), scanning and enumeration of various services (under
    the scanner/ hierarchy) and so on. Let''s try to use some of these auxiliary modules
    to create some of our enumeration procedures performed earlier in this course.
    To use any auxiliary module, exploit or plugin, issue the command with the module
    name appended to it. You can then use the info command to get more information
    about the specific module. Take some time to explore the various auxiliary modules
    present in the MSF. It''s always wise to be aware of the abilities and limitations
    of your toolkit. We start by invoking a simple SNMP enumeration module and check
    its info output.


    ```

    msf> use auxiliary/scanner/snmp/snmp_enum

    msf auxiliary(snmp_enum) > info


    Name: SNMP Enumeration Module

    Module: auxiliary/scanner/snmp/snmp_enum

    Version: 0

    License: Metasploit Framework License (BSD)

    ```'
