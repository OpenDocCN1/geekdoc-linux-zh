    # 14.2.2 - Choosing the Right Protocol: Speed vs. Reward


    Depending on the protocol and password-cracking tool, one common option to speed
    up a brute-force attack is to increase the number of login threads. However, in
    some cases (such as RDP and SMB), increasing the number of threads may not be
    possible due to protocol restrictions, making the password guessing process relatively
    slow. On top of this, protocol authentication negotiations of a protocol such
    as RDP are more time consuming than, say, HTTP, which slows down the attacks on
    these protocols even more. However, while brute-forcing the RDP protocol may be
    a slower process than HTTP, a successful attack on RDP would often provide a bigger
    reward. The hidden art behind online brute-force attacks is choosing your targets,
    user lists, and password carefully and intelligently before initiating the attack.


    # 14.2.3 - Exercises


    +   1. Conduct targeted password attacks on systems within your target network
    range.

    2. Identify the protocols that run well. Which do not?

    3. Ensure that you don''t lock out any accounts.'
