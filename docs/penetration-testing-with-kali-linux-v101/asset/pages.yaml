  md: '# 4.5 - SNMP Enumeration


    Penetration Testing with Kali Linux


    Over the years, we have often found that Simple Network Management Protocol (SNMP)
    is a poorly understood protocol by many network administrators. This often results
    in SNMP misconfigurations, which can result in a dramatic information leakage.
    SNMP is based on UDP, a simple, stateless protocol, and is therefore susceptible
    to IP spoofing and replay attacks. In addition, the commonly used SNMP protocols
    1, 2, and 2c offer no traffic encryption, meaning SNMP information and credentials
    can be easily intercepted over a local network. Traditional SNMP protocols also
    have weak authentication schemes, and are commonly left configured with default
    public and private community strings.


    Now, consider that all of the above applies to a protocol, which by definition
    is meant to “Manage the Network”. For all these reasons, SNMP is another of our
    favorite enumeration protocols.


    # A Note From the Author


    Several years back, I performed an internal penetration test on a company that
    provided network integration services to a large number of corporate clients,
    banks, and other similar organizations. After several years of scoping the system,
    a large B network was discovered with thousands of Cisco routers attached to it.
    It was explained to us that each of these routers was a gateway to one of their
    clients, for management and configuration purposes.


    A quick scan for default cisco / cisco telnet credentials discovered a single
    low end Cisco ADSL router. Dig a bit further revealed a set of complex SNMP public
    and private community strings in the router configuration file. As it turned out,
    these'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# OFFENSIVE SECURITY

    www.offensive-security.com


    Penetration Testing with Kali Linux


    public and private community strings were used on every single networking device,
    for the whole class B range, and beyond – simple management, right?


    An interesting thing about enterprise routing hardware is that these devices often
    support configuration file read and write through private SNMP community string
    access. Since the private community strings for all the gateway routers were now
    known to us, by writing a simple script to copy all the router configurations
    on that network using SNMP and TFTP protocols, we not only compromised the infrastructure
    of the network integration company, but their clients, well.


    # 4.5.1 - MIB Tree


    The SNMP Management Information Base (MIB) is a database containing information
    usually related to network management. The database is organized like a tree,
    where branches represent different organizations or network functions. The leaves
    of the tree (final endpoints) correspond to specific variable values that can
    be accessed, and probed, by an external user. To read more about the MIB tree,
    refer to the following URL:


    +   http://publib.boulder.ibm.com/infocenter/pseries/v5r3/index.jsp?topic=/com.ibm.aix.progcomm/doc/progcomc/mib.htm'
