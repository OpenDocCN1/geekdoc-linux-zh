    #  18.6.7 - Domain Privilege Escalation


    Once we have a shell on a high value server, one of most useful tools to run is
    Windows Credential Editors (wce.exe). This tool will dump hashes, Kerberos tickets,
    and cleartext passwords belonging to Windows login sessions on the server. In
    most situations, the administrative users visit these high value servers, potentially
    leaving behind previous session information. However, the wce.exe tool requires
    administrative privileges to run. As we are already aware of the Symantec AV software
    present on the Citrix server, we protect the wce.exe file with a commercial software
    protector to avoid it flagged as malicious.


