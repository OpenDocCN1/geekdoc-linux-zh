    # 16.6.7 - Revisiting Client Side Attacks


    Client side exploits are a natural extension of the MSF and, as such, have some
    special features that are worth investigating. A common problem with client side
    attacks is the fact that the client application often crashes or freezes up as
    exploitation takes place, at which stage the victim would most likely forcefully
    close the exploited application. As our shellcode usually runs in the context
    of the exploited application, closing the application would also terminate our
    shellcode. To avoid this specifically, the Meterpreter payload is able to migrate
    from one process to another as long as it migrates into a similar or lower authority
    process. This allows us to migrate to more stable processes, which will continue
    running even after the client application is closed.


