    # 13.2 - Cross Site Scripting (XSS)


    We will begin with the least appreciated and understood vulnerabilities: Cross
    Site Scripting (XSS)⁵⁸ XSS vulnerabilities are caused due to unsanitized user
    input that is displayed on a web page in HTML format. These vulnerabilities allow
    malicious attackers to inject client side scripts, such as JavaScript, into web
    pages viewed by other users.


    Although XSS attacks don''t directly compromise a machine, these attacks can still
    have significant impacts, such as cookie stealing and authentication bypass, redirecting
    the victim''s browser to a malicious HTML page. Let''s examine a vulnerable web
    application present on our Windows 7 lab machine: a basic guestbook application.


    The application allows users to post their name and a comment, and will then display
    the output unfiltered, allowing us to include our own JavaScript code into the
    output page.


    > ⁵⁸ https://www.owasp.org/index.php/Cross-site_Scripting_(XSS)'
