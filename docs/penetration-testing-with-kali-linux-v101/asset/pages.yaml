    # 17. - Bypassing Antivirus Software


    As briefly explained earlier, antivirus systems are mostly considered a “blacklist
    technology”, wherein signatures of malware are searched for on the file system
    and quarantined if found. Therefore, bypassing antivirus software is a relatively
    easy task with the correct tools. The process involves changing or encrypting
    the contents of a known malicious file so as to change its binary structure. By
    doing so, the known signature for the malicious file is no longer relevant and
    the new file structure may fool the antivirus software into ignoring this file.
    Depending on the type and quality of the antivirus software being tested, sometimes
    an antivirus bypass can be achieved by simply changing a couple of harmless strings
    inside the binary file from uppercase to lowercase. As different antivirus software
    vendors use different signatures and technologies to detect malware and keep updating
    their databases on an hourly basis, it''s usually hard to come with an ultimate
    solution for antivirus avoidance and quite often the process is based on trial
    and error in a test environment.


    For this reason, the presence, type, and version of any antivirus software or
    similar software should be identified before uploading files to the target machine.
    If antivirus software is found, it would be wise to gather as much information
    as possible about it and test any files you wish to upload to the target machine
    in a lab environment. The process of avoiding antivirus signatures by manually
    editing the binary file requires a deeper understanding of the PE file structure
    and assembly programming – and therefore is beyond the scope of this module. However,
    we have several tools available to us in Kali Linux that can help us get by antivirus
    software. Let''s explore these tools and test their effectiveness against a variety
    of antivirus software vendors.'
  merge: -1
  pgno: 318
