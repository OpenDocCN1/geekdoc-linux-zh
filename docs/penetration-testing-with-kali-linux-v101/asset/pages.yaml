  md: '# 8. - Linux Buffer Overflow Exploitation


    The concepts behind exploiting buffer overflows in Linux are similar to those
    on the Windows platform. This section explores the process of exploiting a Linux
    application, the online multiplayer RPG game, Crossfire.


    Crossfire 1.9.0 suffered from a buffer overflow while accepting input from a socket
    connection. You''ll use the Evans debugger (EDB) to debug this program, as it
    will provide you with a familiar debugging environment, which should ease you
    into exploiting buffer overflows in Linux environments.


    # 8.1 - Setting Up the Environment


    We will use our Kali Linux machine, to run the vulnerable software, and debug
    the application. However, before you run this vulnerable software on our machine,
    you should implement an iptables rule that will only allow traffic from the loopback
    interface, so that your machine is not vulnerable to external attacks. For this
    same reason, we will be using the loopback interface (127.0.0.1) as our target
    IP and TCP port 4444 as our bind shell port.


    This rule will deny any traffic to the vulnerable port, and prevent others from
    exploiting your Kali Linux machine during this exercise:


    ```

    iptables -A INPUT -p tcp --destination-port 13327 \! -d 127.0.0.1 -j DROP

    iptables -A INPUT -p tcp --destination-port 4444 \! -d 127.0.0.1 -j DROP

    ```


    Now that we''ve secured our machine, we can proceed to download and install the
    vulnerable version of crossfire in Kali Linux:


    ```

    root@kali:~# cd /usr/games/

    root@kali://usr/games# wget www.offensive-security.com/crossfire.tar.gz

    root@kali://usr/games# tar zpxf crossfire.tar.gz

    ```'
