    # ## 2.3.3 - Capture and Display Filters


    Capture dumps are rarely as clear as the example shown above, as there is usually
    a lot of background traffic on a network. Various broadcasts, miscellaneous network
    services, and other running applications make life harder when it comes to traffic
    analysis. This is where capture filters come to our aid, as they can filter out
    noninteresting traffic from the dump. These filters greatly help pinpoint the
    traffic you want, and reduce noise to a point where you can again make sense of
    what you see.


    ![](img/ea60ac7a8762deadd3823235c817f96d_53_0.png)


