    ![](img/ea60ac7a8762deadd3823235c817f96d_276_0.png)


    Figure 76 - SSH Local Port Forwarding


    Once the tunnel is created, we browse to local port 8080, which redirects our
    traffic through the outbound SSH tunnel on tcp port 53 on our home machine, then
    to the web server. Take note that the traffic flowing between our local machine
    and home is tunneled though SSH, thus encrypting our traffic between these two
    systems.'
