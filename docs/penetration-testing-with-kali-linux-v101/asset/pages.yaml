    \ grasp its password generation capabilities. For more information about Crunch,\
    \ invoke its man-page using the man command.\n\n# 14.1.3 - Pwdump and Fgdump\n\
    \nMicrosoft Windows operating systems store hashed user passwords in the Security\
    \ Accounts Manager (SAM)⁶ To detect SAM database offline password attacks, Microsoft\
    \ introduced the SYSKEY feature (Windows NT 4.0 SP3), which partially encrypts\
    \ the SAM file.\n\nWindows NT-based operating systems, up to and including Windows\
    \ 2003, store two different password hashes: LAN Manager (LM)⁷, based on DES,\
    \ and NT LAN Manager (NTLM)⁸, based on MD4 hashing, LM is known to be very weak\
    \ for multiple reasons:\n\n+   * Passwords longer than seven characters are split\
    \ into two strings and each piece is hashed separately.\n* The password is converted\
    \ to upper case before being hashed.\n* The LM hashing system does not include\
    \ salts, making rainbow table attacks feasible.\n\n> ⁶ https://en.wikipedia.org/wiki/Security_Accounts_Manager\n\
    ⁷ https://en.wikipedia.org/wiki/LM_hash\n⁸ https://en.wikipedia.org/wiki/NTLM"
