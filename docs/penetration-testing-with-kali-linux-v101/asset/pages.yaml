    # 13.4.2 - Enumerating the Database


    SQL injection attacks can be used to disclose database information using various
    injected queries. Most of these techniques rely on abusing SQL query statements
    and gathering information about the database structure from the errors. Trying
    to enumerate the number of columns in the table can serve as a quick example of
    this principle. Knowing this value is critical for in-depth enumeration of the
    database.

    Let''s examine the page comment.php, which contains a SQL injection vulnerability:


    ```

    <?php

    $id = $_GET[''id'']; // ID parameter not sanitized.

    ...

    $q = "SELECT FROM tbl_name where id ".$id; // ...and then used in a query

    ```


    We can test this vulnerability by simply adding a quote (or a double quote) after
    the ID parameter. As the ID parameter is not validated or sanitized, it will break
    the original SQL query and produce an error. In situations where this error is
    verbose, the looks similar to the following:


    ![](img/ea60ac7a8762deadd3823235c817f96d_235_0.png)


    Figure 65 - A Verbose SQL Error Message'
