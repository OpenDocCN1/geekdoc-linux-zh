- img_proc: true
  md: '# OFFENSIVE Security

    Penetration Testing with Kali Linux


    TCP-based and listens by default on port 80. To start the HTTP service in Kali,
    type the following command into a terminal.


    ```

    root@kali:~# service apache2 start

    Starting apache web server: apache2

    root@kali:~#

    ```


    As we did with the SSH service, we can verify that the HTTP service is running
    and listening on TCP port 80 by using the netstat and grep commands again.


    ```

    root@kali:~# netstat -antp | grep apache

    tcp6 0 0 ::80 ::*  LISTEN  6691/apache

    root@kali:~#

    ```


    To have the HTTP service start at boot time, much like with the SSH service, you
    need to explicitly enable it with update-rc.d.


    ```

    root@kali:~# update-rc.d apache2 enable

    update-rc.d: using dependency based boot sequencing

    root@kali:~#

    ```


    Most services in Kali Linux are operated in the same way as the SSH and HTTP daemons
    are managed, through their service or init scripts.


    To get more granular control of these services, you can use tools such as rconf
    or sysv-rc-conf, designed to help simplify and manage the boot persistence of
    these services.'
