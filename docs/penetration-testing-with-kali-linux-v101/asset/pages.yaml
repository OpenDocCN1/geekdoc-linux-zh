    #  14.3.5 - Passing the Hash in Windows


    Cracking password hashes can be very time-consuming and it is often not feasible.
    a different approach of making of dumped hashes without cracking them has been
    around since 1997. The technique, known as Pass-The-Hash (PTH)8, allows an attacker
    to authenticate to a remote target by using a valid combination of username and
    NTLM/LM hash rather than a cleartext password. This is possible because NTLM/LM
    password hashes are not salted and remain static between sessions and computers
    whose combination of username and password is the same. Consider the following
    scenario:


    An organization uses disk-imaging technologies within its network, or otherwise
    has a local administrative user enabled on multiple computers. A vulnerability
    one of these computers has provided us with SYSTEM privileges, through which we
    dumped local LM and NTLM hashes. We copy the local administrator NTLM hash and
    use this discovered hash instead of a password with a patched version of pth-winex
    to gain a shell on a different machine, which has the same local administrator
    / combination.


    We begin by first setting an environment variable called SMBHASH, containing the
    password we would like to use for authentication.


    ```

    root@kali:~# export

    SMBHASH=aad3b435b51404eaa3b435b51404ee:6F403D3166024568403A94C3A6561896

    ```'
