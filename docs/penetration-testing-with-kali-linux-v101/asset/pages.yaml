  md: '# 13. - Web Application Attacks


    Web applications are increasing in popularity as the Internet continues to grow.
    A recent security study debunked the myth that most attacks come from within an
    organization and most of the successful remote attacks on organizations were done
    by attacking their web applications. This makes sense because a dynamic web application
    will usually provide a larger attack surface as the web server often runs side
    code. Depending on the quality of this code and the configuration of the web server,
    the integrity of the site may be compromised by a malicious visitor. Web applications
    can be written in a variety of languages, each with its specific vulnerability
    classes, although the main attack vectors are similar in concept.


    This module introduces several web application attack vectors in Windows and Linux
    environments. Please note that the topic of web application attacks is vast and
    complex. This module will discuss basic attack vectors and use simple examples.


    # 13.1 - Essential Iceweasel Add-ons


    In order to complete the exercises in this module, you will need to install the
    following Iceweasel extensions:


    +   - Cookies Manager+53

    - Tamper Data+54


    > 53 https://addons.mozilla.org/en-US/firefox/addon/cookies-manager-plus/

    54 https://addons.mozilla.org/en-US/firefox/addon/tamper-data/'
  merge: -1
