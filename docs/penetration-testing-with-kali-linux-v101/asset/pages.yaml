    # 9.1 - Searching for Exploits


    There are several reliable sources for public exploit code, such as the Exploit-Database
    and SecurityFocus vulnerability archives. The exploits on these sites usually
    undergo close examination, and are not published if deemed fake.


    # 9.1.1 - Finding Exploits in Kali Linux


    The Exploit Database is maintained by Offensive Security, and provides an offline
    copy of all the archived exploits it contains. This archive is present in Kali
