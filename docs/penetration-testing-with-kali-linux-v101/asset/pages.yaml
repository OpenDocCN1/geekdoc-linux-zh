  md: '# OFFENSIVE security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    As was previously mentioned, the Microsoft Windows SMB service has a long history
    of serious vulnerabilities, and servers are often found to be vulnerable in penetration
    tests. SMB can often disclose a great deal of information to unauthorized users,
    which can then be used for future attacks. For instance, we can check the security
    level of an SMB server with the smb-security-mode NSE script, as follows.


    ```

