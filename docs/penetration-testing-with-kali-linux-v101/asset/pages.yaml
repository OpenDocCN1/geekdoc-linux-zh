  md: '# OFFENSIVE security


    Penetration Testing with Kali Linux


    # 4.2.5 - OS Fingerprinting


    Nmap has a built-in feature called OS fingerprinting (-O parameter). This feature
    attempts to guess the underlying operating system, by inspecting the packets received
    from the target. Operating systems have slightly different implementations of
    the TCP/IP stack, such as default TTL values, and TCP window size. These slight
    differences create a fingerprint which can often be identified by Nmap. The Nmap
    scanner will inspect the traffic sent and received from the target machine, and
    attempt to match the fingerprint to a known list. For example, running the following
    nmap scan on a local machine suggests the underlying operating system is Windows
    7 or Windows 2008:


    ```

    root@kali:~# nmap -O 10.0.0.19

    ...

    Device type: general purpose

    Running: Microsoft Windows 7|2008

    OS CPE: cpe:/o:microsoft:windows_7

    OS details: Microsoft Windows 7 SP0 - SP1, Windows Server 2008 SP1, or Windows
    8

    Network Distance: 1 hop

    ...

    root@kali:~#

    ```'
  merge: -1
