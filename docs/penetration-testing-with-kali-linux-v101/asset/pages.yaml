  md: '# Penetration Testing with Kali Linux


    # 15.2.3 - Dynamic Port Forwarding


    Now comes the fun part - SSH dynamic port forwarding allows us to set a local
    listening port and have tunnel incoming traffic to any remote destination through
    a proxy. Consider the following scenario:


    You have compromised a DMZ server using a web attack and have escalated your privileges
    to root. This server has both port 80 and port 22 exposed to the Internet. We
    create a local SOCKS4 proxy on our local attacking box on port 8080, which will
    tunnel all incoming traffic to any host in the DMZ network, through the compromised
    web server, as depicted in the diagram. We can create this proxy with SSH using
    syntax similar to the following:


    ```

    ssh -D <local proxy port> <target>

    ```


    ![](img/ea60ac7a8762deadd3823235c817f96d_279_0.png)


    Figure 78 - SSH Dynamic Port Forwarding'
