  md: '# Penetration Testing with Kali Linux


    # ## 3.2 - Email Harvesting


    Email harvesting is an effective way of finding emails, and possibly usernames,
    belonging to an organization. These emails are useful in many ways, such as providing
    us a potential list for client side attacks, revealing the naming convention used
    in the organization, mapping out users in the organization. One of the tools in
    Kali Linux that can preform this task is theharvester¹¹. This tool can search
    Google, Bing, and other sites for email addresses using the syntax shown below.


    ```

    root@kali:~# theharvester -d cisco -b google >google.txt

    root@kali:~# theharvester -d cisco -l 10 -b bing >bing.txt

    ```


    # ### 3.2.1 - Exercise


    +   1. Use theharvester to enumerate email addresses belonging to the organization
    you chose in the previous exercises

    2. Experiment with different data sources (-b). Which work best for you?


    > ¹¹ https://google.google.com/p/theharvester/'
