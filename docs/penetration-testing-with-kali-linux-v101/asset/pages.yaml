    # 14.3.3 - John the Ripper


    Once you have retrieved hashes from a target system, you will want to try cracking
    them so you can use any of the clear text values in further attacks. One of the
    most popular tools for cracking passwords is John the Ripper®. John supports dozens
    of password formats and is under constant development.


    Running john in brute-force mode is as simple as passing the filename containing
    your password hashes as command


    ```

    root@kali:-# john 127.0.0.1.pwdump

    Warning: detected hash type "nt", but the string is also recognized as "nt2"

    Use the "-format=nt2" option to force loading these as type instead

    Loaded 7 hashes with no different salts (NT MD4 [128/128 SSE2 +

    32/32])

    ```


    As we can see in the above output, john recognizes the hash type correctly and
    sets out to crack it. A brute-force attack such as this take a long time. As an
    alternative, we can pass the --wordlist parameter to john instead.


    ```

    root@kali:-# john wordlist=/usr/share/wordlists/rockyou.txt 127.0.0.1.pwdump

    ```


    If any passwords remain to be cracked, we can next try to apply john’s mangling
    rules with the --wordlist parameter


    ```

    root@kali:-# john --rules --wordlist=/usr/share/wordlists/rockyou.txt

    127.0.0.1.pwdump

    ```


    In order to create Linux hashes with john, you will need to first use the unshadow
    utility to combine the passwd and shadow files from the compromised system.


