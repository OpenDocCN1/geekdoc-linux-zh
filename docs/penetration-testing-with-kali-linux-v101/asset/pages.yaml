    # 4.2.1.2 - Stealth / SYN Scanning


    SYN, stealth scanning, is a TCP port scanning method that involves sending SYN
    packets to various ports on a machine without completing a TCP handshake. If a
    TCP port is open, a SYN-ACK will be sent back from the target machine, informing
    us that the port is open, without the need to send a final ACK back to the target
    machine. With early and primitive firewalls, this method would often bypass firewall
    logging, as this logging was limited to completed TCP sessions. It is no longer
    true with modern firewalls, and the stealth claim is misleading. Users might believe
    their scans will not be detected, but in fact, they will be.'
