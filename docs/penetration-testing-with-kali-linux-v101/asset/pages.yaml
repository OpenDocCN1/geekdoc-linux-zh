  md: '# 16.2 - Setting up Metasploit Framework on Kali


    As mentioned earlier, both the Metasploit Framework as well as its commercial
    counterpart, Metasploit Pro, are preinstalled in Kali Linux; however, services
    that Metasploit depends on are not active or enabled by time. To start the required
    postgresql and metasploit service dependencies, start them as you would any other
    common service:


    ```

    root@kali:~# /etc/init.d/postgresql start

    root@kali:~# /etc/init.d/metasploit start

    ```


    To have these services at start boot time, enable them using the update-rc.d script:


    ```

    root@kali:~# update-rc.d postgresql enable

    root@kali:~# update-rc.d metasploit enable

    ```


    # 16.3 - Exploring the Metasploit Framework


    Now that everything is set up, we can start exploring the various exploits, auxiliary
    modules, payloads, and plugins that the MSF has to offer us using the msfconsole


    ```

    root@kali:~# msfconsole

    = metasploit v4.5.3-2013040301 [core:4.5 api:1.0]

    + -- --=[ 1084 exploits - 675 auxiliary - 181 post

    + -- --=[ 277 payloads - 29 encoders - 8 nops

    msf > show -h

    [*] Valid parameters for the "show" command: all, encoders, nops, exploits, payloads,
    auxiliary, plugins, options

    ```'
