    # 17.2 - Crypting Known Malware with Software Protectors


    Software protection tools are most commonly used to obfuscate and license binaries
    by software vendors in an attempt to prevent reverse engineering attempts by software
    pirates. These same tools are effective at obfuscating malware and can often help
    avoid antivirus detection. One such source crypter, called Hyperion8, is present
    in Kali. Let’s see what effect this crypter has on our total AV detection rate.


    We’ll compile and use Hyperion to encrypt our best-preforming payload up to this
    point: shell_reverse_msf_encoded_embedded.exe.


    ```

    rootkali:~# cp shell_reverse_msf_encoded_embedded.exe backdoor

    rootkali:~# cp /usr/share/windows-binaries/Hyperion-1.0.zip

    rootkali:~# unzip Hyperion-1.0.zip

    ```


