    # 4.3.2 - Null Session Enumeration.


    A null session refers to an unauthenticated NetBIOS session between two computers.
    This feature exists to allow unauthenticated machines to obtain browse lists from
    other Microsoft servers. A null session also allows unauthenticated hackers to
    obtain large amounts of information about the machine, such as password policies,
    usernames, group names, machine names, user and host SIDs. This Microsoft feature
    existed in SMB1 by default and was later restricted in subsequent versions of
    SMB.'
