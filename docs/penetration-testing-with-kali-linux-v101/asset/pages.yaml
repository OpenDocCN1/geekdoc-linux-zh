  md: '# 4. - Active Information Gathering


    Once you have gathered enough information about your target, using open web resources,
    and other passive information gathering techniques, you can further gather relevant
    information from other, more specific services. This module will demonstrate several
    of the options available to you. Please keep in mind that the services presented
    in this module are just an introductory list.


    # 4.1 - DNS Enumeration


    DNS is often a lucrative source for active information gathering, DNS offers a
    variety of information about public (and sometimes private!) organization servers,
    such as IP addresses, server names, and server functionality.


    # 4.1.1 - Interacting with a DNS Server


    A DNS server will usually divulge DNS and mail server information for the domain
    it has authority over. This is a necessity, for public requests for mail and DNS
    server addresses make up the basic Internet experience. For example, let’s examine
    the megacorpome.com, a fake Internet presence we constructed for this exercise.
    We’ll use the host command, together with the -t (type) parameter to discover
    both the DNS and mail servers for the megacorpome.com domain.


    ```

    root@kali:~# host -t ns megacorpome.com

    megacorp.com name server ns2.megacorpome.com

    megacorpome.com name server ns1.megacorpome.com

    megacorpome.com name server ns3.megacorpome.com

    root@kali:~# host -t mx megacorpome.com

    megacorpome.com mail is handled by 60 mail.megacorpome.com.

    megacorpome.com mail is handled by 50 mail2.megacorpome.com.

    ```'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# OFFENSIVE Security


    Penetration Testing with Kali Linux


    By default, every configured domain should provide at least the DNS and mail servers
    responsible for the domain.


    # 4.1.2 - Automating Lookups


    Now that we have some initial data from the megacorpone.com domain, we can continue
    to use additional DNS queries to discover more hostnames and IP addresses belonging
    to megacorpone.com. For example, we can assume that the megacorpone.com has a
    server, probably with the hostname www. We can test this theory using the **host**
    command once again:


    ```

    root@kali:~# host www.megacorpone.com

    www.megacorpone.com has address 50.7.67.162

    ```


    Now, let''s check if megacorpone.com also has a server with the hostname idontextist.
    Notice the difference between the query outputs.


    ```

    root@kali:~# host idontextist.megacorpone.com

    Host idontextist.megacorpone.com not found: 3(NXDOMAIN)

    ```


    # 4.1.3 - Forward Lookup Brute Force


    Taking the previous concept a step further, we can automate the Forward DNS Lookup
    of common host names using the **host** command and a Bash script. The idea behind
    this technique is to guess valid names of servers by attempting to resolve a given
    name. If the name you have guessed does, the results might indicate the presence
    and even functionality of the server. We can create a short (or long) list of
    possible hostnames and loop the **host** command to try each one.


    ```

    root@kali:~# echo www > list.txt

    root@kali:~# echo ftp >> list.txt

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Penetration Testing with Kali Linux


    ```

    root@kali:-# echo mail >> list.txt

    root@kali:-# echo owa >> list.txt

    root@kali:-# echo proxy >> list.txt

    root@kali:-# echo router >> list.txt

    root@kali:-# for ip in $(cat list.txt);do host $ip.megacorpone.com:done

    www.megacorpone.com has address 50.7.67.162

    Host ftp.megacorpone.com not found: 3(NXDOMAIN)

    mail.megacorpone.com has address 50.7.67.155

    Host owa.megacorpone.com not found: 3(NXDOMAIN)

    Host proxy.megacorpone.com not found: 3(NXDOMAIN)

    router.megacorpone.com has address 50.7.67.190

    root@kali:-#

    ```


    In this simplified example, we notice that the hostnames www, router, and mail
    have been discovered through this brute-force attack. The hostnames owa, ftp and
    proxy, however, were not found.


    # 4.1.4 - Reverse Lookup Brute Force


    Our DNS forward brute-enumeration revealed a set of scattered IP addresses. If
    the DNS administrator of megacorpone configured PTR records for the domain, we
    might find some more domain names that were missed during the forward lookup brute-force,
    by probing the range of these addresses in a loop.


    ```

    root@kali:-# for ip in $(seq 155 190);do host 50.7.67.$ip;| grep -v "not.

    found"

    155.67.7.50-in-addr.arpa domain name pointer mail.megacorpone.com.

