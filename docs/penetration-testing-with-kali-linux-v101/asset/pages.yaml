- img_proc: true
  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    From Windows Vista on, the Windows operating system disables LM by default and
    uses NTLM, which, among other things, is case sensitive, supports all Unicode
    characters, and does not limit stored passwords to two 7-character parts. However,
    NTLM hashes stored in the SAM database are still not salted.


    The SAM database cannot be copied while the operating system is running, as the
    Windows kernel keeps an exclusive file system lock on the file. However, in-memory
    attacks to dump the SAM hashes can be mounted using various techniques.


    Pwdump and fgdump are good examples of tools that are able to perform in-memory
