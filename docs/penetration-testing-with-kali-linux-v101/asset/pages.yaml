  md: '# 6. - Buffer Overflows


    Buffer overflows are one of our favorite topics in this course. We always find
    fascinating to think about the very precise procedures that occur, when an exploit
    is used to execute code remotely, on a victim machine. This module will walk you
    through a live example of a buffer overflow, and then proceed through the various
    stages of the exploit development''s life cycle.


    When discussing buffer overflows, some of the questions that arise are “How are
    these bugs found?” and “How did you know that X bytes in the Y command would crash
    the application and result in a buffer overflow?”


    Generally speaking, there are three main ways of identifying flaws in applications.
    If the source code of the application is available, then source code review is
    probably the easiest way to identify bugs. If the application is closed source,
    you can use reverse engineering techniques, or fuzzing, to find bugs.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    # 6.1 - Fuzzing


    Fuzzing involves sending malformed data into application input and watching for
    unexpected crashes. An unexpected crash indicates that the application might not
    filter certain input correctly. This could lead to discovering an exploitable
    vulnerability.


    # 6.1.1 - Vulnerability History


    The following example will demonstrate simplified fuzzing in order to find a buffer
    overflow vulnerability in the SLMail 5.5.0 Mail Server software.


    The buffer overflow was found in 2005 and activated the POP3 PASS command, which
    is provided during user login. This makes the vulnerability a pre-authentication
    buffer overflow, as an attacker would not need to know any credentials, in order
    to trigger this vulnerability.


    The SLMail software was not compiled with Data Execution Prevention (DEP)⁴³ and
    Address Space Layout Randomization (ASLR)⁴⁴ support, which makes the exploitation
    process simpler, as we will not have to bypass this internal security mechanisms.


    # 6.1.2 - A Word About DEP and ASLR


    Since we will be exploiting a vulnerability on Windows 7, we need to be aware
    of a few memory protections introduced by Microsoft, specifically Data Execution
    Prevention (DEP) and Address Space Layout Randomization (ASLR).


    +   - DEP is a set of hardware, and software, technologies that perform additional
    checks on memory, to help prevent malicious code from running on a system. The
    primary benefit of DEP is to help prevent code execution from data pages, by raising
    an exception, when execution occurs.


    > ⁴³ http://en.wikipedia.org/wiki/Data_Execution_Prevention


    > ⁴⁴ http://en.wikipedia.org/wiki/ASLR'
