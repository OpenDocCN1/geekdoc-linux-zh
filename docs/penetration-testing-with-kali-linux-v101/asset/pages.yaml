    # ## 14.3.4 - Rainbow Tables


    Because it tries all possible plain texts by one, a traditional brute-force cracker
    is usually too time-consuming to break complex passwords. The idea behind time-memory
    tradeoff is to perform all cracking computation in advance and store the results
    in a binary database, or Rainbow Table⁷ file.


    It takes a long time to pre-compute these tables, but once pre-computation is
    finished, a time-memory tradeoff cracker can be hundreds of times faster than
    a traditional brute-force cracker. To increase the difficulty in password cracking,
    passwords are often concatenated with a random value before being hashed. This
    value is known as a salt, and its value, which should be unique for each password,
    is stored together with the hash in a database or a file to be used in the authentication
    process. The primary intent of salting is to increase the infeasibility of Rainbow
    Table attacks that could otherwise be used to greatly improve the efficiency of
    cracking the hashed password database.


    > ⁷ https://en.wikipedia.org/wiki/Rainbow_table'
  merge: -1
