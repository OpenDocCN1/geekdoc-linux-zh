    # 3.4 - Recon-ng


    As described by its authors, "Recon-ng ²³ is a full-featured web reconnaissance
    framework written in Python. Complete with independent modules, database interaction,
    built in convenience functions, interactive help, and command completion, Recon-ng
    provides a powerful environment in which open source-based reconnaissance can
    be conducted quickly and thoroughly. Recon-ng has a look and feel similar to the
    Metasploit Framework, reducing the learning curve for leveraging the framework.


    Let’s use recon-ng to quickly compile a list of interesting data. We’ll start
    by using the whos_poc method to come up with employee names and email addresses
    at Cisco.


    ```

