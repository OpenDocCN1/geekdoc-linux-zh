    # 4.3 - SMB Enumeration


    The Server Message Block (SMB)³⁰ protocol''s security track record has been poor
    over a decade, due to its complex implementation, and open nature. From unauthenticated
    SMB null sessions in Windows 2000 and XP, to a plethora of SMB bugs and vulnerabilities
    over the years, SMB has seen its fair share of action³¹.


    That said, the SMB protocol has also been updated and improved in parallel with
    Windows Operating Systems Releases. Here is a quick list to clarify SMB version
    numbers, and their related Windows Operating system versions:


    +   - SMB1 – Windows 2000, XP and Windows 2003.

    - SMB2 – Windows Vista SP1 and Windows 2008

    - SMB2.1 – Windows 7 and Windows 2008 R2

    - SMB3 – Windows 8 and Windows 2012.


    # 4.3.1 - Scanning for the NetBIOS Service


    The NetBIOS³² service listens on TCP ports 139 and 445, as well as several UDP
    ports. These can be scanned with tools, such as nmap, using syntax similar to
    the following:


    ```

    root@kali:~# nmap -v -p 139,445 -oG smb.txt 192.168.11.200-254

    ```


    > ³⁰ https://en.wikipedia.org/wiki/Server_Message_Block

    ³¹ http://markgamache.blogspot.com/2013/01/ntlm-challenge-response-is-100-broken.html

    ³² https://en.wikipedia.org/wiki/NetBIOS'
