  md: '# 14. - Password Attacks


    # 14.1 - Preparing for Brute Force


    The theory behind password attacks is simple to comprehend. If a service of some
    sort requires valid credentials to access it, we can simply attempt to guess,
    or brute-force, these credentials until they are identified. Depending on the
    nature of the service (for example, a network service vs. a local service), the
    techniques and tools for these attacks may vary.


    Generally speaking, the passwords used in our guessing attempts can come from
    two sources: dictionary files or key-space brute-force.


    # 14.1.1 - Dictionary files


    Password “dictionary files” are usually text files that contain a large number
    of common passwords in them. These passwords are often used in conjunction with
    password cracking tools, which can accept these password files, then attempt to
    authenticate to a given service with the passwords contained in the password files.
    Kali includes a number of these dictionary files in the following directory:


    ```

    /usr/share/wordlists/

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# OFFENSIVE Security


    Penetration Testing with Kali Linux


    # 14.1.2 - Key-space Brute Force


    Password-key-brute-force is a technique of generating all possible combinations
    of characters and using them for password cracking. A powerful tool for creating
    such lists, called crunch, can be found in Kali. Crunch is able to generate custom
    wordlists with defined character-sets and password formats. For example, to create
    a wordlist containing the characters 0-9 and A-F, we would enter a command similar
    to the following:


    ```

    root@kali:~# crunch 6 6 0123456789ABCDEF -o crunch1.txt

    Crunch will now generate the following amount of data: 117440512

    112 MB

    0 GB

    0 TB

    0 PB

    Crunch will now generate the following number of lines: 16777216

    100%

    root@kali:~# wc -l crunch1.txt

    16777216 crunch1.txt

    ```


    Alternatively, we could choose to generate a wordlist using a pre-defined character-set.

    root@kali:~# crunch 4 4 -f /usr/share/crunch/charset.1 mixalpha


    Crunch can also be used to generate more customized password lists. consider the
    following scenario. We are mid-engagement and have cracked a few user passwords
    from a specific device.


    ```

    root@kali:~# cat dumped.pass.txt

    david: Ab$123

    mike: Jud()666

    ```'
