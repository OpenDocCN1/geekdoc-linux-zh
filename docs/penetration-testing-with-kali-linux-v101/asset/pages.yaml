    # 16.6 - Metasploit Payloads


    So far, we have limited our payload use in MSF exploits to simple, stand-alone
    reverse shell payloads, also known as windows/shell_reverse_tcp. As you''ve probably
    seen by now, the MSF contains many payloads that remain to be examined.


    # 16.6.1 - Staged vs. Non-Staged Payloads


    One of the first distinctions that are important to make in Metasploit payloads
    are between staged and non-staged shellcode. A good example of this is evident
    when comparing the two payloads:


    ```

    windows/shell_reverse_tcp - Connect back to attacker and spawn a command shell

    windows/shell_reverse_tcp - Connect back to attacker, Spawn cmd shell (staged)

    ```


    A non-staged payload is a payload that is sent in its entirety in one go – as
    we''ve been doing up to now. A staged payload is usually sent in two parts. The
    first part is a small primary payload, which causes the victim machine to connect
    back to the victim, a longer secondary payload containing the rest of the shellcode,
    and then execute it. There are several situations where we would prefer to use
    staged shellcode over nonaged:'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'The vulnerability we are exploiting does not have enough buffer space to hold
    a full payload. As the first part of a staged payload is typically smaller than
    a full payload, these smaller payloads can often save us in tight situations.


    Antivirus software is detecting embedded shellcode in an exploit. By replacing
    the embedded shellcode with a staged payload, we will be removing most of the
    malicious part of the shellcode and injecting it directly into the victim machine
    memory.


    # 16.6.2 - Meterpreter Payloads


    As described on the Metasploit site, the Meterpreter is a staged, multi-function
    payload that can be dynamically extended at run-time. In practice, this means
    that the Meterpreter provides more features and functionality than a regular command
    shell by inbuilt functionality, such as file upload and downloads, keyloggers,
    and many more built-in routines to interact with the victim machine. These are
    useful in a post-exploitation phase. This additional functionality makes Meterpreter
    the favorite and most commonly used payload in the MSF. Let''s explore the Meterpreter
    payload by using it on the SLServer over our Windows 7 lab machine.


    ```

    root@kali# msconsole

    msf > use exploit/windows/seattlelab_pass

    msf exploit(seattlelab_pass) > set RHOST 192.168.11.35

    msf exploit(seattlelab_pass) > exploit

