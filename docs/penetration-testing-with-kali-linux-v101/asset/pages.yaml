    # ## 18.4 - Phase 3 – Research and Development


    Looking around the web some more, we notice the name and version of the database
    manager: SQLiteManager v1.2.4.


    ![](img/ea60ac7a8762deadd3823235c817f96d_331_0.png)


    Figure 88 - Identifying the Version of SQLite Manager


    A quick search for existing SQLiteManager vulnerabilities finds an exact match
    for an existing "remote injection" vulnerability. This exploit would be an ideal
    candidate to use against our target, but it requires several modifications before
    we can even hope for a shell.


    The vulnerable software is protected with an HTTP authentication mechanism, while
    the exploit we found does not deal with authentication at all. If we have any
    hopes of getting this exploit to work, we need to add HTTP authentication features
    to the exploit. Once that''s fixed, we also need to change the SQLite version
    from 2 to 3 in order for it to match our environment.


    We complete the changes and verify that our exploit works in a development environment
    before trying it out on the megacorpone.com machines.'
