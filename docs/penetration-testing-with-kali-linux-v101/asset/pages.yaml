    # 14.1.7 - Password Mutating


    Users most commonly tend to mutate their passwords in various ways. This could
    include adding a few numbers at the end of the password, swapping out lowercase
    for capital letters, changing certain letters to numbers, etc. We can now take
    our minimalistic password list generated by cowl and add common mutation sequences
    to these passwords. A good tool for doing this is the Ripper⁷⁰. John comes with
    an extensive configuration file where password mutations can be defined. In the
    following example, we apply a simplistic rule to add two numbers to each password.


    ```

    root@kali:~# nano /etc/john/john.conf

    ...

    # Wordlist mode rules

    [List.Rules:Wordlist]

    # Try words as they are

    :

    # Lowercase every pure alphanumeric word

    -c >3 !X 1 Q

    # Capitalize every pure alphanumeric word

    -c (??) >2 !X c Q

    # Lowercase and pluralize pure alphabetic words

    -

    Try the second half of split passwords

    -s c x** M 1 Q

    # Add two numbers to the end of each password

    $[0-9]$[0-9]

    ...

    ```'
