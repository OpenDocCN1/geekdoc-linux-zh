    # 10. - File Transfers


    The term post exploitation refers to the actions performed by an attacker, once
    some

    of control has been gained on his target. This may include uploading files and
    tools to

    the machine, elevating privileges, expanding control into additional machines,

    installing backdoors, cleaning up evidence of the attack, etc. However, one of
    the first

    steps we''ll take is to upload files that will aid us in the post exploitation
    processes. This

    could include compiled binaries, command line port scanners, backdoors, and

    password dumpers.


    # 10.1 - A Word About Anti Virus Software


    The post exploitation stage is where most penetration testers will meet one of
    their

    biggest adversaries - Anti Virus. In most corporate environments, antivirus software

    will be installed diligently on all computers. The main purpose of this software
    is to

    identify files on the file system which pose a threat to the machine, or network.
    The

    antivirus companies create databases of signatures for known malicious files.
    Once a

    file with a known signature is found, it is usually quarantined by the antivirus
    software,

    and rendered useless. Even worse, the incident containing information about the

    affected file may alert diligent administrators to our presence. Imagine the frustration

    of getting so far into an engagement where you have a remote shell on an internal

    machine...and its lost due to an antivirus application picking up one of your
    uploads.

    One of our favorite ways to avoid antivirus is to use legitimate administrative

    tools during the post exploitation phase. We will address the issue of antivirus
    bypass,

    later in the course, once we have been introduced to the right tools.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# OFFENSIVE Security

    www.offensive-security.com


    Penetration Testing with Kali Linux


    # 10.2 - File Transfer Methods


    Invitably, one of the first steps to take after gaining a remote shell is to upload
    additional tools to the remote machine. This will aid in establishing, and expanding,
    our control of the machine, and network. The initial limitation we face, when
    trying to upload files on a freshly compromised machine, is that we are limited
    to only using tools that are available on the target. In Unix environments, we
    will often find tools such as netcat, curl or wget preinstalled with the operating
    system, which make downloading files from a remote machine simple. However, on
    Windows machines, the process is usually not as straight forward.


    # 10.2.1 - The Non-Interactive Shell


    Most netcat-like connections provide a non interactive shell. Let''s look at the
    example, below.


    Type the command dir into a command prompt on a Windows machine. This command
    is non-interactive, because once it is executed, it does not require more input
    from the user in order to complete. Now try the following experiment. Connect
    to a FTP server from the Windows command line, and attempt to log in.


    ```

    C:\Users\offsec>ftp ftp.microsoft.com

    Connected to ftp.microsoft.adns.net.

    220 Microsoft FTP Service

    User (ftp.microsoft.adns.net:(none)): test

    331 Password required for test.

    Password: test

    530 User cannot log in.

    Login failed.

    ftp> bye

    221 Thank you for using Microsoft products.

    C:\Users\offsec>

    ```'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Penetration Testing with Kali Linux


    Despite the fact that the login failed, notice that the ftp.exe client process
    exited only once we interacted with it, and gave the bye command. This is an interactive
    program that requires user intervention to complete.


    The standard output from an interactive program is not redirected correctly to
    the shell, and you will often get timed out, or disconnected from the shell, if
    you try. Experiment for yourself. Try logging in to an FTP server, from a remote
    shell, and see what happens.


    # 10.2.2 - Uploading Files


    Depending on the underlying operating system you are working with, there may be
    several tools already present on the compromised machine that can help you upload
    your files.


    # 10.2.2.1 - Uploading Files With TFTP


    TFTP is a UDP based file transfer protocol and is often restricted by corporate
    egress firewall rules. Windows operating systems up to Windows XP and 2003 contain
    a TFTP client, by default. In Windows 7, 2008, and above, this tool needs to be
    explicitly added, during installation. For these reasons, TFTP is not the ideal
    file transfer protocol in most situations. On the other hand, the big advantage
    of TFTP file transfer is that the tftp client can work interactively, making the
    file transfer easy, if the correct conditions exist. We need to set up the TFTP
    server in Kali.


    ```

    root@kali:~# mkdir /tftp

    root@kali:~# atftp --daemon --port 69 /tftp

    root@kali:~# cp /usr/share/windows-binaries/nc.exe /tftp/

    ```'
