  md: "# 4.4 - SMTP Enumeration\n\nPenetration Testing with Kali Linux\n\nIn vulnerable\
    \ configurations, mail servers can also be used to gather information about a\
    \ host or network. SMTP⁷ supports several important commands, such as VRFY and\
    \ EXPN. A VRFY request asks the server to verify an email address, while EXPN\
    \ asks the server for the membership of a mailing list. These can often be abused\
    \ to verify existing users on a mail server, which can later aid the attacker.\
    \ Consider this example:\n\n```\nroot@kali:~# nc -nv 192.168.11.215 25\n(UNKNOWN)\
    \ [192.168.11.215] 25 (smtp) open\n220 redhat.acme.com ESMTP 8.12.8/8.12.8; Wed,\
    \ 12 Jun 2013 07:47:14\n+0300\nVRFY root\n250 2.1.5 root <root@redhat.acme.com>\n\
    VRFY idontextist\n550 5.1.1 idontextist... User unknown\n^C\nroot@kali:~#\n```\n\
    \nNotice the difference in the message received when a user is present on the\
    \ system. The SMTP server happily verifies that the user exists. This procedure\
    \ can be used to help guess usernames. Examine the following Python script that\
    \ opens a TCP socket, connects to the SMTP server, and issues a VRFY command for\
    \ a given username.\n\n```\n#!/usr/bin/python\nimport socket\nimport sys\nif len(sys.argv)\
    \ != 2:\n    print(\"Usage: verify.py <username>\")\n    sys.exit(0)\n```\n\n\
    > ⁷ https://en.wikipedia.org/wiki/Simple_Mail_Protocol"
