    # 0.5.2 - Lab Control Panel


    Once logged into the VPN lab, you can access your lab control panel. Through this
    control panel you can manage, revert, and reset machines and passwords. You can
    access the panel using the address sent to you in welcome email. If you encounter
    an SSL certificate warning, accept it.


    # 0.5.2.1 - Unlocking Additional Networks


    Initially, the control panel will allow you to revert machines on the Student
    Network as well as your own dedicated Windows 7 lab machine. Certain vulnerable
    servers in the lab will contain a network-secret.txt file with an MD5 hash in
    it. These hashes will unlock additional networks in your control panel.'
