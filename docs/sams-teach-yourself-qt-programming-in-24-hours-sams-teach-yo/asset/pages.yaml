  md: '![](img/ed4f2be9f0799d95b6f041531c9a1f14_372_0.png)


    # HOUR 22


    # Portability


    If a program or library, created on one platform, can easily be converted to another
    platform, it''s considered *portable*. Just as you reach out to a wider range
    of people by translating your program into multiple languages, you also reach
    out to more people by making your program available on multiple platforms. Therefore,
    portability should, after functionality, be a top priority in the development
    of your applications.


    One of Qt''s biggest strengths is its portability. At the time of this writing,
    Qt could easily be compiled on 16 different UNIX versions and clones with various
    compilers. Of course, with the commercial version of Qt, your program can also
    be compiled on Microsoft Windows as well—and that''s not bad at all! In fact,
    this means you can make your programs available for a great majority of all computers
    on this planet.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'However, a few precautions need to be taken to make your Qt programs portable.
    This is the topic of this hour. It will help you write good, portable applications
    that you can make widely available. If you''re working on a commercial project,
    this hour might even help you earn more money.


    Although portability is desirable in most cases, some situations there''s no need
    to strive for portability. For example, if you''re creating a GUI configuration
    tool for compiling the Linux kernel, portability is not important at all, because
    the program will likely never be used on platforms other than Linux. If you''re
    developing a GUI installation tool for your new device driver on Windows NT, portability
    will never be something you need to think of. However, portability is very important
    in most cases and therefore you''ll likely find this hour very interesting.


    # Writing Portable Qt Applications


    As stated earlier, Qt''s portability is excellent, but keeping a Qt program portable
    takes a little effort from you, as the programmer, as well. In this section, you
    will get some general information on what you should to keep your Qt programs
    portable.


    # Using Qt Classes


    Using Qt classes and functions when writing a Qt application might sound pretty
    obvious to you. In cases where GUI-specific functions aren''t needed, you might
    have to use some other library to get a fully functional program. By implementing
    another library into your program, you also make it much harder (although not
    impossible) to achieve portability. The worst-case scenario would be that this
    library exists only on your development platform, thus making your program impossible
    to use on other than your primary one. You should always keep in mind that Qt
    not consists of GUI widgets but that also functions for many other programming
    tasks, such as accessing the file system.


    # Using Qt Streaming Functions


    As you learned in Hour 12, "Working with Files and Directories," Qt provides extensive
    support for text streaming. These streaming functions, in most cases, are more
    than enough to fulfill your needs. Qt''s streaming functions are actually important
    to if you want to keep your program portable.


    Although C++''s standard classes for streaming, defined in iostream.h, exist in
    all C++ implementations and therefore should be okay to use and still remain portable,
    there are always a few small differences that make the various implementations
    or less'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'incompatible with each other. These small differences are actually differences
    in size between the implementations of the built-in types, such as int, long,
    and double. For example, int can be two bytes on one system and four bytes on
    another. Because these types are used by the standard streaming classes, the small
    differences can actually cause big problems in a program that uses standard streaming,
    and they can make a program that''s valid on one platform invalid on another.
    Therefore, it is highly recommended that you stick with Qt''s streaming classes;
    they can help you avoid lots of problems.


    If you want to create a special file type for your program, the QData class is
    the perfect class to use. Although you use C++s standard classes for this well,
    QData stays exactly on all platforms that are supported by Qt, keeping your program
    portable. For example, if you are writing a word-processing program, you could
    easily create a special file format for storing documents with the QDataStream
    class. Then, if you save a document on one platform, the same file can be opened
    with no problems on any of the other supported platforms (maybe even all platforms
    supported by Qt).


    # Using Qt''s Classes for Dealing with Files and Directories


    The classes QFile and QDir are Qt''s for dealing with files and directories. They
    are discussed in Hour 12. If you''ve worked with the standard C or C++, you are
    well aware that structures for this already exist. However, these structures have
    the same problem as the standard streaming classes, so you are encouraged to use
    QFile and QDir to keep your programs portable. The fact that QFile and QDir are
    much easier to use than C and C++s standard structures is probably reason enough
    to use them anyway.


    # Using QPrinter for Painting


    Hour 19, "Learning to Use Qt OpenGL Classes," contains a short discussion about
    thinking twice before implementing OpenGL functions in your Qt programs. This
    is a reminder of discussion. Using Painter instead of a new painting library makes
    things easier for your users and makes sure the painting functions in your programs
    work on all platforms supported by Qt.


    # Using QPrinter for Printing


    Using Qt QPrinter is by the far easiest way of implementing a printing function
    in a program. If you, against all odds, happen to be of implementing a printing
    function without using this class, you should get rid of that as quickly as you
    can! QPrinter is not just easy to use, it also makes sure your programs'' printing
    functions work on all platforms (if a printer is installed and set up correctly,
    that is).'
