  md: '# HOUR 17


    # Writing KDE Applications: Lesson One


    If you''re a UNIX user (any clone or version), you''ve probably heard about the
    KDE desktop. This is a set of programs and libraries that gives UNIX users a more
    user-friendly desktop, quite similar the one provided in Microsoft Windows 98.
    KDE is a full-featured graphical working environment with all the components you''ll
    ever need. Like Windows, KDE has its own file manager that also can be used as
    a Web browser. It includes text editors, graphics software, various network utilities
    (both for the Internet and your local network), games, and many other useful items.
    A special Office-like program suite is also under development.


    As you probably know, KDE is built with Qt. However, the KDE has its own programming
    API, consisting of classes built on Qt classes. By using these


