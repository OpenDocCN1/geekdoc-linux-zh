  md: '# HOUR 9


    # Creating Simple GUI Graphics


    When you start your new and shiny GUI program for the first time, you might not
    realize that the program is in fact made up of a large amount of low-level graphics
    code. Fortunately, this code is generated by the GUI library (Qt, in this case);
    therefore, you never need to worry about it.


    You might be wondering what low-level graphics code is. This is the code that
    draws your program onscreen by Qt using your system''s simplest functions (functions
    that only draw lines, rectangles, and such).


    As mentioned, Qt handles the low-level code, which creates the predefined Qt widgets.
    However, sometimes you might need to create graphical objects that Qt cannot create
    for you. In this case, you need some kind of low-level graphics generator that
    you can use to create custom graphics. Qt provides the QPainter class for this
    purpose.


    In this lesson, you''ll learn how to get started working with QPainter. You''ll
    also learn how to implement printing capabilities in your program.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_164_0.png)'
