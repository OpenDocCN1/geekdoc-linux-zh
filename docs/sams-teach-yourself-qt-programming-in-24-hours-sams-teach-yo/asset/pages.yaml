  md: '# Working with Animation


    Qt provides you with a class called QMovie for showing animation (movies) in your
    programs. Currently, QMovie can only handle the GIF image/animation format. However,
    it''s expected that other formats (such as AVI) will be added in the future. For
    now, you have to live with this limitation.


    Creating a QMovie object, assigning it an animation, and then showing it onscreen
    is simple, as shown in Listing 15.1.


