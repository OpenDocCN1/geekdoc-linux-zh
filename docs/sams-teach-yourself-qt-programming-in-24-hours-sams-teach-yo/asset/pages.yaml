    # HOUR 7


    # Getting to Know the Qt Widgets: Lesson Two


    In this hour, you''ll continue your Qt widget walkthrough. You''ll look at widgets
    used for making selections, widgets used to arrange other widgets, and widgets
    used to let the user select a numerical value.


    This hour does not present anything revolutionary for GUI development, but it
    does cover some very useful aspects of Qt that any programmer should understand
    thoroughly.


    # Using Selection Widgets


    Selection widgets let the user make a selection from a predefined menu of items.
    This includes list boxes and combo boxes. An example of a selection widget is
    the font selector in Microsoft Word (a combo box). In Qt, the QListBox class is
    used for list boxes and QComboBox for combo boxes.'
