  md: '# HOUR 11


    # Using Layout Managers


    Until now, you''ve placed your Qt objects by giving the absolute coordinates to
    the QWidget::resize and QWidget::setGeometry functions. The problem with this
    method is that if you resize the parent window, it will either be too small or
    too big for its child widgets to fit in. Your program will simply not look good
    anymore. This is where layout managers come in.


    Layout managers are a set of Qt classes that control how and when the main window
    is resized. By registering your widgets with a layout manager and not giving the
    widgets absolute positions, the layout manager will resize or move the child widgets
    as needed when you (the user) resize the parent window. This makes your application
    easier to use and gives it a much better look.


    Layout managers are also a great help when you need to place many widgets. This
    process is often very time consuming. With layout managers, you can do it much
    faster.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_202_0.png)'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Understanding Layout Managers


    To give you a better understanding of the layout manager concept (also known as
    geometry management or layout management), we''ll now go through a real-life example
    (although a very basic one) when layout managers can be useful.


    Figure 11.1 shows a window with two QPushButton widgets on it.


    FIGURE 11.1

    A window with two QPushButton widgets on it. It''s not connected to any layout
    manager, so what will happen if it''s resized?


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_203_0.png)


    Let''s say you want to make this window bigger; the result will then be something
    like what is shown in Figure 11.2.


    FIGURE 11.2

    What happens if you resize an image that doesn''t use layout managers. In most
    cases, you want the widgets (buttons, in this case) to be resized and/or moved
    to suit the main window.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_203_1.png)


    On the other hand, if you use a layout manager in the example shown in Figure
    11.1, the result of resizing the window would look like what''s shown in Figure
    11.3.


    FIGURE 11.3

    A layout manager is used to control the position of the buttons. When you resize
    the window, the buttons'' positions are changed to suit the new window size.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_203_2.png)'
