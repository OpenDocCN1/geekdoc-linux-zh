  md: '# Creating Netscape Plug-Ins


    To test your plug-in, you first need to create an HTML document. Here''s an example:

    <HTML>

    <HEAD>

    <TITLE>A Very Basic Qt-Based Plugin Called With the EMBED Tag</TITLE>

    </HEAD>

    <BODY BGCOLOR="#ffffff">

    <CENTER>

    <EMBED TYPE=basic/very WIDTH=300 HEIGHT=100>

    </EMBED>

    </CENTER>

    </body>

    </HTML>


    Now if you open this document in Netscape, your plug will paint a rectangle that''s
    300 by 100 pixels (defined by the <EMBED> tag) with the text "Your first Qt-based
    plugin! in it. This is shown in Figure 20.2.


    # 20.2

    Your plug-in embedded in an HTML document using the <EMBED> tag.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_348_0.png)


    This example is not useful; it just draws a rectangle that contains some text.
    However, suppose you''ve created a plug-in for showing AVI movies. You could easily
    embed an AVI movie in an HTML document, like this:

    <EMBED SRC="movie.avi" WIDTH=320 HEIGHT=200 AUTOSTART=true LOOP=true


    For more detailed information about the <EMBED> tag, you might want to look into
    one of the many free HTML courses on the Internet.


