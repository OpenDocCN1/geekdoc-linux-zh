    # Creating Keyboard Shortcuts with KAccel Class


    The KAccel class can be used to easily define so-called keyboard accelerators.
    A keyboard is a function that lets the user access certain functions with his
    keyboard. Keyboard accelerators are usually accessed by holding down the Ctrl
    and then some other key. Listing 18.1 shows a simple example.


    +   LISTING 18.1 Adding an Accelerator with KAccel


    ```

    1: #include <kapp.h>

    2: #include <ktmainwindow.h>

    3: #include <kaccel.h>

    4:

    5: int main(int argc, char **argv)

    6: {

    7:   KApplication a(argc, argv);

    8:   KTMainWindow w;

    9:   w.resize(100, 100);

    10:  a.setMainWindow(&w);

    11:

    12:  KAccel acc(&w);

    13:  acc.insertItem("Quit", "Quit", "CTRL+Q");

    14:  acc.connectItem("Quit", &a, SLOT(quit()));

    15:

    16:

    17:  w.show();

    18:  return a.exec();

    19: }

    ```'
