  md: '# HOUR 23


    # Debugging Techniques


    When developing computer software, you must always consider that there will be
    more or less serious errors (knows as bugs among programmers) in your software.
    These bugs can present themselves in many different ways. If you''re using Linux,
    you''ve most likely experienced a program exiting with a segmentation fault, which
    is usually caused by bad memory management. However, the definition of a bug extends
    beyond just memory problems. Actually, anything unwanted in a program can be called
    a bug. A bug in a computer program has the same meaning that corrosion has in
    chemistry; you can use these terms whenever something unwanted happens (an unwanted
    program function or an unwanted chemical reaction).


    One thing that often causes bugs is a lack of understanding of a library or function
    that the programmer is trying to use. For example, you most likely'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Hour 23


    had many more problems getting your Qt programs to work correctly in the beginning
    of your learning curve that you have now, Now that you have a broader understanding
    of how the Qt library works, you find it much easier to avoid problems because
    they appear obvious to you. Therefore, the best way to avoid bugs is to sure of
    what you''re doing.


    Here, no matter how experienced you are, there are always bugs that can''t be
    fixed, or even found, right away. Fortunately, Qt offers a few functions and macros
    that can be of help in this situation. They won''t fix the actual bug, but they
    will help you find it. After all, the biggest problem with bugs is simply finding
    them!


    In this hour, you''ll learn how to use Qt''s facilities for finding bugs. You''ll
    also learn how to use a debugger to go through a Qt program, step by step. You
    could, in the last section of this hour, you''ll find a discussion about the command-line
    options that could be useful when running a Qt program through a debugger.


    # Using Qt''s Debugging Functions


    Qt comes with a few functions that can be used to make a program easier to debug.
    By making a call to one of these functions in a particular part of your program,
    you can easily determine when that point is executed. You could, for example,
    use one of functions to determine at which point an if statement is true or how
    many times the code inside a while loop is executed. By doing this, you get a
    better overview of your program and can more easily avoid bugs.


    This section discusses three Qt functions: qDebug(), q(), and qFatal(). They''re
    all global, there''s no need to include any extra header file to use them.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_391_0.png)


    All three debugging functions are limited to 512 bytes of output, including the
    zero byte (the byte that marks the string as finished).


    # Using the qDebug() Function


    The first and probably most used of the three functions is qDebug(). It prints
    out a message to stdout (the screen), which you can use to get information about
    what the program is doing.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_391_1.png)


    On Windows, qDebug() prints the message to the debugger, not to stdout.'
  merge: -1
