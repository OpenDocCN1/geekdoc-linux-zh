    # Understanding Qt''s Debugging Macros


    Although qglobal.h includes definitions for many debugging macros, only the two
    most

    important ones, ASSERT() and CHECK_PTR(), are covered in this section. These two

    macros (as well as all the others in qglobal.h) use the qDebug(), qWarning(),
    and

    qFatal() functions to create debugging information for certain events. By using
    these

    macros instead of the debugging functions directly, you can save yourself some.


    # Using the ASSERT() Macro


    The ASSERT() macro takes a Boolean value as an argument. If the value is FALSE,
    it

    prints out a line with debugging information that follows a certain standard.
    Here''s an

    example:


    ```

    ASSERT( x != 0 ); //This is line 48

    ```


    Here, if x is 0 (remember. ASSERT() outputs information about the statement FALSE,

    the will be printed if the program file is test.cpp and the line number is 48:


    ```

    ASSERT: "x == 0" in test.cpp (48)

    ```


    # Using the CHECK_PTR() Macro


    The CHECK_PTR() macro can be used to check whether a program has run out of memory.

    It takes a pointer as an argument, and if this pointer is NULL, CHECK_PTR() calls

    qFatal() function to inform you that the program has run out of memory and exits

    the program. Consider the following example:


    ```

    char *string = new char[100];

    CHECK_PTR( string );

    ```


    Here, CHECK_PTR() will call qFatal() if the string variable is not created.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_394_0.png)


    > Create an object inside the CHECK_PTR() macro, as follows:

    CHECK_PTR( char *ch = new char[10] );


    The problem is quite tricky to understand. However, if you feel need to

    know why this doesn''t work, the Qt Reference Documentation. Just be

    sure not to do this in your programs.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_394_1.png)'
