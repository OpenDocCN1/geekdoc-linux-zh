    saved with the .pic file name extension to verify that the Qt''s image format
    is used).


    5. Why should you use Qt''s own image format?


    Because it''s a platform-independent format that''s supported on all Qt platforms.


    6. Is it possible to use JPG images with Qt?


    Yes, if you have the JPG library installed on your system. You should not use
    JPG images if you''re not absolutely sure that all users of your program have
    the JPG library.


