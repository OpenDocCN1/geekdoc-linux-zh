  md: '# Getting to Know the Qt Widgets: Lesson One


    TABLE 6.1 Definitions for Alignment Settings

    | Function | Description |

    |---|-|

    | AlignTop | Text will be added to the top of the QLabel object. |

    | AlignBottom | Text will be added to the bottom of the QLabel object. |

    | AlignLeft | Text will be added along the left side of the QLabel object. |

    | AlignRight | Text will be added along the right side of the QLabel object. |

    | AlignCenter | Text will be added at the horizontal center of the QLabel object.
    |

    | AlignVCenter | Text will be added at the vertical center of the QLabel object.
    |

    | AlignCenter | This is the same as setting both AlignHCenter and AlignVCenter.
    |

    | WordBreak | If this function is set, automatic word breaking is used. |

    | ExpandTabs | This function makes QLabel expand the tabulators.


    Notice how the arguments to QLabel::setAlignment() are separated by the "or" (|)
    operator. This method is also used when you want to add more arguments; just separate
    them with | operators.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_120_0.png)


    > You can use QLabel to show pixmaps and animation. This is done with the QLabel::setPixmap()
    and QLabel::setMovie() functions.


