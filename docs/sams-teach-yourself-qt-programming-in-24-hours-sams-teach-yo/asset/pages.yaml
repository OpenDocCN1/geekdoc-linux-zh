  md: 'However, you won''t get much out of a slider without a method that tells you
    the current value of the slider. Luckily, Qt provides a few functions that make
    this an easy task. See Table 7.1 for descriptions of these functions.


    # TABLE 7.1 Useful Slider Member Functions


    | Function | Description |

    |---|---|

    | value() | Returns the current value of the slider. |

    | sliderMoved( int ) | This is a signal that is emitted whenever the slider is
    moved enough that the value is changed. |

    | valueChanged( int ) | This signal is emitted when the user has finished moving
    the knob (that is, the user has selected a new value). The parameter contains
    this new value. |

    | sliderPressed() | This signal is emitted whenever the user clicks the knob.
    |

    | sliderReleased() | This signal is emitted when the user releases the knob after
    he she has clicked or dragged it. |

    | setValue( int ) | Sets the value of the slider. |


    Sliders can be used for many tasks. With just a little bit of imagination, you''ll
    be sure to come up with some interesting ideas. You have probably seen many programs
    where sliders are more suited to set various numerical values. You should use
    sliders whenever you find them more suitable than spin boxes, for example, when
    there is a large range of values to choose from.


