    # HOUR 12


    # Working with Files and Directories


    Have you ever thought about the importance that files and directories actually
    have in a computer? Without these two elements, you wouldn''t be able to store
    anything on your computer, and it wouldn''t be half as useful as it is today.
    Maybe this sounds silly, but there actually was a time when computers didn''t
    have seemingly unlimited storage space (as many of today''s computers do). At
    that time, storing information when the computer was turned off was always a problem,
    which people tried hard to overcome.


    Luckily, this isn''t where technology stands today. Therefore, it''s probably
    safe to assume that you have at least a few bytes free to play with on your hard
    drive.'
