    # Q&A


    Both the Clipboard and the drag-and-drop feature have become standard on most
    GUI applications. Because they make many operations so easier, you should consider
    both to be good features to have in an application. As a developer, you strive
    to create good applications that are as easy to use as possible, the extra hours
    these features to implement are in most cases (although not all cases) worth the
    effort.


    The Clipboard feature is, by nature, very straightforward. Unless you want to
    create Clipboard functions for custom types of data, it doesn''t take more than
    a few lines to implement.


    On the other hand, drag and drop is by no means considered "straightforward."
    If you just make sure you have a good understanding of the mouse event functions,
    defined in QWidget(and therefore inherited by other Qt classes), a great way of
    finding out when a function is actually called is to use the debug() function
    (discussed in Hour 23,"Debugging Techniques”). By calling debug(), with a suitable
    string as an argument, if you''re unsure about that, the string will be output
    to stdout (or standard output—your monitor) when the function is called, and you
    can easily see exactly when this happens. You should also read the "Drag and Drop"
    section in the Reference Documentation; it includes some interesting information.


    +   Is there any way I can define my key combinations for the Clipboard?


    +   Yes, the function Widget::keyEvent() takes care of keypress events. There
    you can define what happens when a certain key is pressed. See the Reference Documentation
    for more information.'
