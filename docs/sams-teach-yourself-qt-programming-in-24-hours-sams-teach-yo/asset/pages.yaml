  md: '# Using the gdb Debugger for Debugging Qt Programs


    A debugger is a piece of software that can be used to step through a program and
    discover any possible bugs. gdb, the GNU debugger, comes with most free UNIX systems,
    including Linux, gdb is a classic among the GNU programs. It doesn''t provide
    any GUI interface, but it is, however, an invaluable tool for debugging a program.


    When you''re using gdb on a program, it''s important that the program is compiled
    with debugging symbols turned on. With gdb, you do this with the -g option.


    # Getting and Installing gdb


    gdb most likely comes with your UNIX/Linux distribution, and you can easily install
    it with the standard package utilities on your system (for example, the rpm utility
    on Red Hat Linux).


    However, if gdb is not included in your distribution, you need to download it
    from ftp://ftp.gnu.org/pub/gnu/gdb/. The installation procedure is the same as
    for most GNU software. Run ./configure, run make, and then run make install.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_395_0.png)


    > At the time of this writing, the latest gdb source distribution (4.18) is over
    11MB in size. Therefore, if you''re on a slow dial-up connection, the downloadload
    time can be an hour or more.


    Whether you install a binary version of gdb from your distribution or compile
    the source yourself, you must make sure the gdb is correctly installed to be able
    to follow the example in this section.


    # Getting Started with gdb


    When you want to use gdb to step through a program, you must first tell gdb what
    file should be executed. The easiest way of doing this is to enter the filename
    as the command-line argument to gdb, as follows:


    ```

    $ gdb <filename>

    ```


    So, if you want to use gdb with your Qt program MyQtProgram, the command would
    be this:


    ```

    $ gdb MyQtProgram

    ```'
  merge: -1
