    5. Why should you use QPainter to show text?


    Yes, why should? If your goal is to just show text, it''s better to use QLabel.


    6. What is RGB?


    RGB stands for Red/Green/Blue. It is a method for defining colors.


    7. What is a palette?


    A palette contains three color groups and makes a complete set of colors for your
    application—one for each state (active application, disabled application, and
    normal application).


    8. What would you do to print a circle on a piece of paper?


    Just draw the circle, as usual, to a QPrinter object.


    # Quiz Answers for Hour 10


    +   1. What is a dialog?


    +   A dialog is a widget that interacts with the user in some way (for example,
    the user whether he or she wants to proceed).


    +   2. Does Qt provide any dialog for choosing a file?


    +   Yes, you can create a file dialog using the QFileDialog class.


    +   3. Is it possible to select multiple files?


    +   Yes, use the QFileDialog::getOpenFiles() function (note the ending).


    +   4. Why would you want to let the user select a color?


    +   If you''re creating a drawing program, the user might need to select which
    color to use.


    +   5. What class should be used to create a font dialog?


    +   TheQFontDialog class.


    +   6. Which dialog should you use if you want to ask the user a simple question?


    +   The easiest way of doing this is to use the QMessageBox dialog. You could,
    however, also create a custom dialog for this.'
