  md: '# Quiz Answers


    +   3. What is the setGeometry() function used for?

    setGeometry() function is used to set the size and position of the widget. If
    the widget is a window, it can be moved and resized later.


    +   4. What can you do if you include the qfont.h header file in your source file?

    You can use the QFont class to format text.


    +   5. What does the line MyMainWindow w; do?

    It creates a MyMainWindow object and executes the class''s constructor.


    +   6. Why don''t you need to call the show() function for each object?

    When you call show() for a parent widget, its children widgets are automatically
    shown.


    +   7. What do you do when you enter the pointer as a parent widget?

    The pointer represents the uncreated object of the current class. Therefore, if
    you''re setting the pointer as the parent widget, the parent will be the object
    you then create in the main() function.


    +   8. What is qApp?

    qApp was created in the same spirit as this pointer. It''s a pointer to the uncreated
    Application object (which is created in main()).


    +   9. Why do you need to make a call to a.exec() in main()?

    On this line, the program control is passed onto the Qt library. From here, Qt
    takes care of user interaction as well as other operations that make the program
    work.


    # Quiz Answers for Hour 4


    +   1. What is a slot?

    A slot is a special type of member function that can be connected to a signal.
    When the signal is emitted, the slot (function) will be executed.


    +   2. What is a signal?

    A signal is a special type of function that can be connected with a slot. The
    signal notifies the slot when a certain event occurs, and the slot is executed.


    +   3. How do you connect a signal to a slot?

    By using the Qobject::connect() function.


    +   4. Can you connect multiple slots to one signal?

    Yes, this is possible. Just make a call to the connect () function for each connection.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_426_0.png)'
