  md: '# HOUR 24


    # Use the Qt Builders


    As Qt has become more and more popular, the need for some kind of GUI builder
    has become more obvious. A GUI builder is a program that graphically enables you
    to create a GUI interface, often without writing one single line of code! However,
    these programs are limited to just creating GUI interfaces; they can''t create
    the actual program functions for you.


    In this hour, you''ll get a good introduction to three of these builders: QtEz,
    QtArchitect and Ebuilder. These three programs can all be used to build Qt interfaces
    easily. Which one you choose is often just a matter of taste.


    Note that only the Qt-specific GUI builders are covered in this hour. A few are
    available for KDE building as well, but those are not covered here (after all,
    this is a Qt book).


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_402_0.png)'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Getting Started with QtEz


    QtEz is considered by many to be the best GUI builder. In this section, you''ll
    learn how to get, compile, and install QtEz as well as how to create a simple
    GUI with it. You''ll be amazed how simple it can be to create a professional Qt
    project!


    # Getting and Installing QtEz


    The first thing you need to do is to get the latest QtEz distribution, which can
    easily be downloaded from the QtEz Web site (http://www.iol.sk/qtez/). At the
    time of writing, the latest version of QtEz is 0.85.2. You''ll find binary and
    source distributions of QtEz.


    If a binary distribution is available for your system, you should choose that
    one. However, if that''s not the case, you need to download the .tar.gz source
    distribution.


    If you''ve downloaded the source distribution, the first thing you need to do
    is to unpack the archive, as follows:


    ```

    # tar xvzf qtez-0.85-2.tar.gz

    ```


    This will create a directory called qtez-0.85-2, where the whole source distribution
    will reside. Then, you need to prepare the source to be compiled on your system.
    There are a few things you need to do. First, run the autogen.sh script included
    in the base directory of the QtEz distribution:


    ```

    # ./autogen.sh

    ```


    You''ll now see the following output slowly scrolling up your screen:


    ```

    Creating Makefile.in in all subdirectories...

    Creating modifications for MOC files...

    Creating script ./configure

    Creating include links...

    complete, please run ./configure or ./configure --help

    ```


    As the last line instructs, you should now run the configure script:


    ```

    # ./configure

    ```


    The configure script will examine your system and create makefiles according to
    the information it finds. This can take a while. However, when it''s finished,
    you need to run a Perl script called automoc, which also resides in the top-level
    directory of the QtEz distribution:


    ```

    # perl automoc

    ```'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'This will make sure that the MOC files are handled correctly. Finally, you''re
    ready to start the compilation. As usual, you do this by simply running make:


    # make


    Now, the compilation will start. This might take some time, depending on the speed
    and load of your system. After the compilation finishes, you''re ready to install
    the binaries into your system. This is done with the following command:


    # make install


    All necessary files will now be copied to their correct places on your file system.
    After this is finished, you need to set the QTEZ environment variable. This should
    be set to the directory holding the QtEz template files. These are not installed
    automatically, so you need to do that by:


    ```

    # cd qtez-0.85.2/templates

    # mkdir /usr/local/share/qtez

    # cp -r * /usr/local/share/qtez

    ```


    Then, set QTEZ to the directory you created. If you''re using bash, use this command:


    ```

    # export QTEZ=/usr/local/share/qtez

    ```


    If you''re using C shell, here''s the correct command:


    ```

    # setenv QTEZ=/usr/local/share/qtez

    ```


    If you''re planning to use QtEz more than once, you''ll probably want to add a
    line to your startup files that sets the QtEz variable.


    # Creating a Simple GUI with QtEz


    In this section, you''ll learn the QtEz basics. Find step-by-step instructions
    on how created a simple GUI. This information is intended to get you started with
    QtEz.


    First, you need to start QtEz:


    # qtez


    QtEz should now start, and two large windows will appear on your screen. Windows
    are shown in Figure 24.1.


    The top window is the main QtEz window, from which you control the entire program.
    The bottom window is for setting environment options. As you can see in the main
    QtEz window (one at the top), this is a large program with many options and features.
    However, despite all these features, QtEz is very straightforward and easy to
    use.


