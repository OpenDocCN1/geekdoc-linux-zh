    # Using the Tab Dialog


    The other Qt class you can use to create custom dialogs is QtDialog. With this,
    you can create so-called tab dialogs. A tab dialog is a widget that consists of
    several pages. You''ve probably seen this type of dialog in many applications.
    A tab dialog is good to use when you have a lot of widgets and feel it would be
    confusing to have all on one page. By using a tab dialog, you can split them up
    into categories, creating a page in the tab dialog for each category. This makes
    your application look much neater and easier to follow.


    Listing 10.7 demonstrates how a tab dialog looks in its original state (when no
    tabs have been added to it).


    # Listing 10.7 A QtDialog Object in Its Original Form


