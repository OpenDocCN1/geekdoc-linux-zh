    # Compiling and Running the Example


    To compile the program in Listing 19.1, you need to split the code into different
    .cpp and .h files (the name as listed in the listing). Then, you should have five
    files to work with glbox.cpp, glbox.h, glwindow.cpp, glwindow.h, and main.cpp.


    Now, you start by using the Meta Object Compiler on glbox.h. Because GLBox is
    the only class that includes custom slots, this is the only one you need to use
    MOC on, as follows:


    ```

    # moc glbox.h -o glbox.moc

    ```


    Note that if you choose to call the output anything other than glbox.moc, you
    need to change the following line in glbox.cpp:


    ```

    #include "glbox.moc"

    ```


    Therefore, it''s best to name it glbox.moc. Then, you should create object files
    of each .cpp file:


    ```

    # g++ -c glbox.cpp -o glbox.o

    # g++ -c glwindow.cpp -o glwindow.o

    # g++ -c main.cpp -o main.o

    ```


    > Actually, when creating object files, you don''t have to tell g++ (or gcc) what
    you want to call the output. If you just enter the command


    g++ -c main.cpp


    g++ will assume you want to call the object file main.o.


