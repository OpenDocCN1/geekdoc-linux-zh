    # HOUR 19


    # Learning to Use Qt’s OpenGL Classes


    OpenGL is a standard API for rendering 3D graphics. It’s platform indepen-

    dent and is therefore used on many different systems. Both Windows NT

    and some commercial UNIX systems come with OpenGL libraries by

    default. However, on other systems, you need to install them by hand.

    Fortunately, there’s a free OpenGL clone available, called MESA, for

    UNIX/Linux. This is the OpenGL implementation you will work with in this

    hour. Although MESA usually doesn’t include the latest features of

    OpenGL, it works well, and it’s free! It’s also possible to use some other

    implementation, such as SGI OpenGL.


    Qt includes a few classes that make the integration of OpenGL functions in a Qt
    program easy. By doing this, you gain a lot because you can use Qt for

    creating the GUI for your OpenGL programs and don’t need to reinvent but-

    tons, menus, toolbars, and so on for yourself.'
