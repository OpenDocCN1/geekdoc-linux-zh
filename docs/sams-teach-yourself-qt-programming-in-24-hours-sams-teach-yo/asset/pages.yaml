  md: '# Summary


    In this hour, you learned how to write a simple OOP program using Qt. You added
    a button and a label to the main window and then implemented a quit function for
    the program. This was done using a single line of code, which shows one of Qt''s
    advantages over other GUI libraries. To create a library that can implement such
    an advanced feature (which it really is) with such a tiny amount of code is not
    just impressive—it''s quite revolutionary.


    So, you''re now familiar with OOP, and you can write simple Qt programs with OOP.
    In the next hour, we''ll take an in-depth look at slots and signals.


    # Q&A


    +   When I resize my main window, the objects in it are misplaced and my no longer
    looks good. What''s wrong?


    +   You need to use a special method to make the widgets change as you resize
    their parent window. We''ll discuss this in Hour 11, “Using Layout Managers.”


    +   I don''t understand. What do the arguments to setGeometry really stand for?


    +   This can be a bit confusing at first. You, pixel (0,0) on a monitor represents
    the upper-left corner, not the bottom-left corner, as you may be used. Therefore,
    if you''re using setGeometry on the main window, the first argument to setGeometry
    defines how many pixels appear between the left side of the screen and the window''s
    upper-left corner. The second argument defines how many pixels appear between
    the top of the screen and the window''s upper-left corner. The two arguments define
    the window''s width and height in pixels. It''s not really hard once you get used
    to it.


    +   My compiler whines about the line that connects the button''s signal clicked()
    to qapp''s slot quit(). What''s wrong?


    +   Make sure the objects you''re giving as arguments to the connect() function
    are pointers (addresses). If they''re not, you must use the address operator &
    (add it before an object''s name) to get the memory address of the object.


