    +   8. What does the QApplication::installTranslator() function do?


    The QApplication::installTranslator() function tells the QApplication object that
    there''s a translator available and that it should be used.


    +   9. Why is it required that you use the Q_OBJECT macro and the Meta Object
    Compiler on a class that uses translations?


    Because the translation functions are implemented by moc.


