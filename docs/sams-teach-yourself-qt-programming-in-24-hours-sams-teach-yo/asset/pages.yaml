  md: '# Learning to Use Container Classes


    designed to handle container traversing, they are capable of fixing most problems
    that might occur when you''re stepping through a container (for example, when
    an element is added to the container during the traverse). A simple for or while
    loop would get confused about this and the program would most likely exit. So,
    you are encouraged to use iterators whenever you can avoid bugs and other problems.


    # Summary


    Using containers can be tough in the beginning. However, the Qt container classes
    make this whole concept easier. To be more precise, Qt container classes make
    the concept look easier, since the internal functions are still the same. If you''ve
    ever tried to create any of the functions provided by Qt''s container classes
    by hand, such as a linked list, you understand. This is rather complicated stuff,
    so take the time to learn how to use the container classes.


    # Q&A


    +   - I''m trying to use the ++ operator with iterators, but I get a warning that
    this operator doesn''t exist and another one will be instead. What''s wrong?

    - Make sure you''ve added the ++ operator before the iterator object, not after.

    - Can I have elements with different costs in the same cache?

    - Yes. Just define the cost you want the elements to have when you insert them
    with insert().

    - Can I store a class I''ve created myself in a container class?

    - Yes, you can. Just make sure you enter the name of your class with the angle
    brackets (<) when you define the container (the line that starts with typedef).


