    +   1. What is user-space text?

    User-space text is all text that''s visible to the user.


    +   2. Why should you use QString for all user-space text?

    Because QString Unicode encoding, that guarantees your text is presented in the
    correct way. Using QString can also improve performance in some cases.


    +   3. When do you need to use the tr() function?

    The tr() function must be used whenever there''s a string that you want to translate.


