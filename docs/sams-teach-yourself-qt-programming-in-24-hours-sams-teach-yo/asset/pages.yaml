    task. You just use the QPixmap::save() function. This function takes two arguments:
    the first is a string representing the filename you want to save, and the second
    is a string representing the image format you want to save. However, it''s easiest
    to use the QPixmap::imageFormat() function for the second argument. This function
    returns the image format of the image that this QPixmap object represents. So,
    if you wanted to save an image to a file /home/user/image.bmp using the file used
    by the image represented by the QPixmap object pixmap, you should make the following
    function call:


    pixmap->save("/home/user/image.bmp", pixmap->imageFormat());


    Support for the JPG format is not included in the Qt library. However, it''s possible
    to use this format anyway. To do this, you will need to include the qimage.h header
    file, make a call to the Qjpeg() function, and link your program with a JPG library.
    On Linux/UNIX systems, you link with the JPG library by adding the -lj argument
    to your compiler (of course, you must have the JPG library installed to this).
    See the section of the Qt Reference Documentation for more information about this.


