    > In the screenshots shown in this hour and the next, the KDE Window Manager is
    used instead of the Motif Window Manager used in the other hours. You''re advised
    to develop in a KDE environment to get access to all the features provided by
    the KDE library.


    # Installing KDE


    Of course, the first thing you need to do before you can start developing KDE
    applications is to install KDE and its development libraries.


    If you''re using any of the larger Linux or UNIX distributions, KDE is most likely
    included on your distribution CD, and you can install all KDE packages just like
    you install programs with your distribution. However, make sure you install the
    development libraries as well; these packages usually have the word devel in their
    filenames.


    If KDE is not included in your Linux distribution or if you''re using any UNIX
    variant that doesn''t ship with KDE, you can easily download the necessary files
    from www.kde.org, where you also find information on how to install (compile,
    if necessary) the packages on your system.


    # Writing Your First KDE Program


    You''ll start by looking at a very simple KDE program that''s similar to your
    first Qt program, discussed in Hour 1, “Introduction to Qt.\ Take a peek at Listing
    17.1 and see whether you can find any differences.


    Listing 17.1 A Very Simple KDE Program


    ```

    1: #include <kapp.h>

    2: #include <ktmainwindow.h>

