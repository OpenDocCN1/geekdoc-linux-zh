    +   1. What can the QScroll class be used for?


    +   The Qscroll class can be used to create a window with scrollbars.


    +   2. Which member function is used to add objects to the QScrollView class?


    +   The QScrollView::addChild() function is used to add objects to the QScrollView
    class.


    +   3. What does scroll-demand mean?


    +   Scroll-demand means that the scrollbars are shown only when they''re needed
    (that is, they''re not when all the widgets are fully visible).


    +   4. What are QMenuBar and QPopupMenu?


    +   QMenuBar and QPopupMenu are the Qt classes that should be used to create dropdown
    menus. The QMenuBar represents the entire menu bar, and QPopupMenu represents
    a single menu.


    +   5. When do you need to call the QMenuBar::insertItem() function?


    +   You need to call the QMenuBar::insertItem() function when you want to add
    a menu to the menu bar.'
