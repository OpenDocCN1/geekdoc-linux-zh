    OpenGL rendering context." So, what does this mean? Well, an OpenGL context is
    basically an object that you use to output graphics. This is usually a part of
    a window, but you can also set it to a pixmap or something similar.


    The QGLContext class automatically creates a rendering context for you (a QGLContext
    object), so if you don''t need to change the context, you don''t have to worry
    about it. However, suppose you want to output an OpenGL graphic to a pixmap. You
    could create a Qpixmap object and then create a OpenGLContext for it. Here''s
    an example:


    ```

    Qpixmap pixmap;

    QGLContext *ctx = new QGLContext(dataFormat(), &pixmap);

    ```


    As you can see, the QGLContext constructor takes two arguments. The first one
    is a QGLFormat (see the next section for information about the QGLFormat class),
    and the second one is QPaintDevice object. Therefore, you can render an OpenGL
    graphic to any Qt class that inherits from QPaintDevice. Then, by changing the
    rendering context for your QGLWidget and calling QGLWidget::updateGL(), the OpenGL
    graphic will be rendered to the pixmap. Here''s an example:


    ```

    MyQGLWidget->setContext(ctx);

    MyQGLWidget->updateGL();

    ```


    That''s it! If you leave out two of the arguments to the QGLWidget::setContext()
    function because they have default values. See the Reference Documentation for
    more information about this function and its arguments.


