    # Working with Tables


    The QTableView is provided for creating tables in Qt. It’s a useful class, but
    it’s also quite abstract in its definitions. Therefore, you need to derive a new
    class based on QTableView to make something out of it.


    # Creating a Simple Grid


    When creating a class based on QTableView, you need to implement the function
    paintCell(). This function is not defined in the class; instead, it’s used by
    the class to draw the cells. Therefore, you need to implement a function by this
    name and let it handle the cell drawing. This might sound hard to you, but that’s
    not the case at all. See Listing 6.6 for a simple example of how to create a grid
    with QTableView.


    > When you implement the paintCell() function, you have to use some painting functions
    from the QPainter class. This class and its methods are covered in detail in Hour
    9, “Creating Simple Graphics,” and Hour 15, “Learning About Graphics,”


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_122_0.png)'
