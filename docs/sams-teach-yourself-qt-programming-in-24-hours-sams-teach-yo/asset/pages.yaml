    Just as radio buttons, you check whether a QCheckBox object is pressed through
    the checked() signal (QCheckBox::checked()). As stated previously, check buttons
    let the user select more than one. Therefore, you wouldn’t use check buttons in
    the spell checker scenario described for the radio buttons in the previous section.
    If you did, the user would be able to select one language at a time, like English,
    French, and German at the same time, and your spell checker would get very confused!


    A realistic example of when check buttons can be useful is when you want the user
    to select style of text in a word editor. In this case, it’s fully possible to
    have the bold, italic, and underline attributes selected. However if you used
    radio buttons in this case, users would only be able to use one formatting method
    at a time, and that’s not desirable.


    Using buttons is straightforward, and you’ve now learned about the three types
    of buttons Qt provides. Remember to check the Qt Reference Documentation if you
    need more information.


    # Creating Labels


    Every now and then, you need to add text to your application in the form of a
    label. Labels are usually used to present brief information or instructions about
    the widgets in a program. For example, you could use a label to define what should
    be entered in a text box. In Qt, you implement labels using the QLabel class and,
    occasionally, the LCDNumber class.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_118_1.png)


    # QLabel


    The QLabel class is used for displaying simple text. It’s a very basic yet very
    useful widget. Listing 6.4 shows a simple example.'
