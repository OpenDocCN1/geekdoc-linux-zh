  md: "# Understanding the getMIMEDcription() Function\n\nQNPlugin::getMIMEDcription()\
    \ is called by the browser when it needs to know what\nMIME type and which filename\
    \ extensions the plugin-in can handle.\n\nMIME types are used by Internet browsers\
    \ to determine what kind of data they’re dealing\n. It’s to the Web server to\
    \ tell the browser MIME type or a stream of\ndata belongs to. The browser checks\
    \ its configuration to see whether there’s a han-\ndler (either a program or a\
    \ plug-in) defined for this MIME type. If a handler exists, the\nbrowser uses\
    \ it to work with.\n\nA MIME type consists of a major and a minor type, separated\
    \ by a slash (/). For example,\nt MIME type text/plain represents text of the\
    \ type plain, and the MIME type\nimage/gif represents an image of the GIF.\n\n\
    However, to define a new MIME type, you need to have access to the Web server’s\n\
    figuration, and that’s not something you usually have. Fortunately, file types\
    \ can also\be determined by looking at the filename extension. For example, text\
    \ files usually end\nwith .txt, and GIF images with .gif.\n\nHere’s a simple implementation\
    \ of QNPlugin::getMIMEDcription():\n\n```\nconst char *getMIMEDcription()\n{\n\
    \    return \"image/gif:gif:GIF Image\";\n}\n```\n\nAs you can see, this string\
    \ is divided into three parts, separated by colons (:). The first\npart represents\
    \ the MIME type, the second part represents the filename extension, and the\n\
    last part represents a description of the type. Note that the filename extension\
    \ can\ninclude more than one extension. If you want to register more than one\
    \ filename extension\ns for a type, you should separate each instance with a comma\
    \ (,).\n\n# Understanding the getPluginNameString() Function\n\nQNPlugin::getPluginNameString()\
    \ returns the name of the plug-in as a string. This\nstring appears in the Description\
    \ column on About Plug-Ins page in Netscape\nNavigator. The About Plug-Ins page\
    \ can be accessed from the Help menu (located on the\nright of the browser window).\
    \ You can also access it by typing about:plugins in the\nURL field. A sample implementation\
    \ of QNPlugin::getPluginNameString() follows:\n\n```\nconst char *getPluginNameString()\n\
    {\n    return \"This is the full name of my plugin\";\n}\n```"
  merge: -1
  pgno: 341
- img_proc: true
  md: "# Understanding the getPluginDescriptionString() Function\n\nQNPlugin::getPluginDescriptionString()\
    \ also returns a string that's shown on the About Plugin-Ins page. However, this\
    \ function returns a short description of the plug-in instead of the name of the\
    \ plug-in. A sample implementation of QPlugin::getPluginDescriptionString() follows:\n\
    \n```\nconst char *getPluginDescriptionString() const\n{\n    return \"Here is\
    \ a short description of my plugin\";\n}\n```\n\n# Understanding the newInstance()\
    \ Function\n\nQNPlugin::newInstance() is used by the browser to get a new object\
    \ of the QNPInstance class (that is, a subclass of the QNPInstance class that\
    \ you have created). For example, it is called MyPluginInstance, QNPlugin::newInstance()\
    \ would look like this:\n\n```\nQNPInstance *newInstance()\n{\n    return new\
    \ MyPluginInstance;\\n}\n```\n\n# QNPInstance: The Link Between the Browser and\
    \ the Plugin-In\n\nAs stated previously, there's never more than one QNPlugin\
    \ object. Instead, QNPInstance objects are created by calling the QNPlugin::newInstance()\
    \ function. After a QNPlugin object is created and QNPlugin::newInstance() is\
    \ called, QNPInstance takes care of the communication between the plug-in and\
    \ the browser. This is done through a few static functions, which will you go\
    \ through.\n\n# Understanding the newWindow() Function\n\nQNPlugin::newWindow()\
    \ returns a pointer to an object of a subclass of the QNPWidget class. This function\
    \ is called once by the browser when the plug-in should be shown onscreen. A sample\
    \ implementation of this function follows:\n\n```\nQNPWidget *newWindow()\n{\n\
    \    return new MyPluginWidget;\n}\n```\n\nIn this case, the subclass of QNPWidget\
    \ is called MyPluginWidget.\n\n![](img/ed4f2be9f0799d95b6f041531c9a1f14_342_0.png)"
  merge: -1
