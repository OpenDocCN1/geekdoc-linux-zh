    # Drawing a Rounded Rectangle


    To draw a rectangle with rounded corners, you use the QPainter::drawRoundRect
    function. See the following code snippet and Figure 9.7 for an example:


    ```

    paint->setPen( QPen(red, 4, QPen::SolidLine ));

    paint->drawRoundRect( 20, 20, 210, 160, 50, 50 );

    ```


    The last two arguments determine the level of roundness of the corners. This can
    be value between 0 and 99 (99 represents maximum roundness).


