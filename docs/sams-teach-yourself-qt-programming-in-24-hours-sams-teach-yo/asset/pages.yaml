  md: '# Creating Netscape Plug-Ins


    As you can see, this is a very simple example. Because the functions are so short,
    the function definitions are placed inside the class definitions (lines 8 through
    23 and lines 29 through 69: this is known as inline programming). This makes the
    code easier to follow. Most of the parts of this program were discussed in the
    section "Getting to Know Qt''s Netscape Plug-In Classes." Also, the paintEvent()
    function (lines 14 through 21) doesn''t present anything, there''s not much to
    say about it. However, note that the MIME type basic/very and the extension .bas
    (for basic) are used (line 56).


    Actually, the fact that you don''t need any further explanation of Listing 20.1
    is the reason why you should use Qt to develop Netscape plug-ins. If, on the other
    hand, you choose to use the standard API provided by the Netscape Plugin SDK,
    you have to learn and understand all the functions in that API. Now, the only
    thing you need to learn is how the communication between your plug-in and the
    browser works. For the actual plug-implementation, you can use the Qt classes,
    which you should already be familiar with at this point.


    # Compiling and Installing the Plug-In


    As stated earlier, a plug-in is a shared object (UNIX) or a DLL file (Windows).
    To make it shared object, you need to compile it in a way that''s different from
    how you''ve compiled over other Qt programs.


    First, you need to make an object file from the source code:


    ```

    # g++ -c 21st01.cpp -o 21st01.so

    ```


    This creates an object file and a shared object out of it. Then, you need to link
    this object file with the following command:


    ```

    # g++ -L/usr/local/qt/lib -L/usr/X11/lib 21st01.o -lqt -lext -lX11 -nlm -L/usr/local/qt/lib
    -lnqp -lXt -shared -o 21st01.so

    ```


    Note the -lnqp options, which tell your linker (possibly 1d) to link with the
    libqnp library created earlier in the "Preparing Your System for Plug-in Development"
    section. Also, note the -shared option. This option makes the output of the command
    a shared object.


    However, this will result in a file named 21st01.so. You should copy this file
    to the plugins directory of your Netscape installation, which is probably something
    like /usr/lib/netscape/plugins. /usr/local/netscape/plugin. or /opt/netscape/plugins.
    To copy the file, use the following command:


    ```

    # cp 21st01.so /usr/lib/netscape/plugins

    ```


