    # Compiling and Running a QtEz Project


    You can compile and run a QtEz program in one of ways: directly from QtEz or manually
    from the command prompt.


    To compile and run a QtEz project from the command prompt, you just follow the
    standard used by UNIX/Linux source distribution—that is, run configure, run make,
    and then run make install. Of course, you should do this in the base directory
    of your project. However, not performing a make in this test project; instead,
    you probably want to run it directly from the src directory. To compile and run
    the project manually, use cd to go to the project''s base directory and issue
    the following command:


    ```

    # /configure

    # make

    # cd src

    # ./YourProject

    ```


    Of course, you need to change YourProject to the real name of your project.


    Compiling and running the project within QtEz is even easier: It''s a matter of
    clicking a button. So, locate the green item on the toolbar (the eighth from the
    left) and click it. You''ll probably want to have the Compile window visible now
    so that you can


