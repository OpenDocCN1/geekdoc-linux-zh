  md: '# Workshop


    You''re encouraged to work through the following questions and exercises to help
    you retain what you''ve learned in this hour about what Qt has to offer when it
    comes to debugging. By answering these questions, you also make sure you understand
    the basics of the gdb debugger.


    # Quiz


    +   1. When should the qDebug() function be used?

    2. When should the qWarning() function be used?

    3. When should you use the qFatal() function?

    4. What does the ASSERT() macro do?

    5. What does the CHECK_PTR() macro do?

    6. What is a debugger?

    7. How do you tell gdb which file you want to work with?

    8. With what gdb command do you set a breakpoint?

    9. What does the command run in gdb?

    10. If you were to guess, which command do you think quits the gdb debugger?


    # Exercises


