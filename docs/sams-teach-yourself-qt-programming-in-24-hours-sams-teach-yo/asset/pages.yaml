  md: '# # Compiling on MS Windows Using Visual C++


    The first thing you need to do is be able to compile Qt programs on MS Windows
    systems is to install the Qt library. You do just like any other piece of Windows
    software, so no further description is really needed. However, the actual compilation
    of programs can be a little more complicated, because you need to change some
    settings in your IDE (Integrated Development Environment)—for example, Visual
    C++ from (Microsoft).


