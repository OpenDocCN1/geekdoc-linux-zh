  md: "# 64\n\n# Hour 4\n\nvalue is passed to setValue(). In many cases, this is just\
    \ unnecessary work, but it demonstrates the use of signals. The implementation\
    \ of setValue() could look some-\nthing like the following:\n\n```\nvoid MyMainWindow::setValue(int\
    \ value)\n{\n    if (value != oldValue)\n    {\n        oldValue = value;\n  \
    \      emit onChanged(value);\n    }\n}\n```\n\nYou see, the onChanged() signal\
    \ will only be emitted if the new value is not\nt old one. If that is true, oldValue\
    \ will be changed to value, and the\nChanged() will be emitted. Note that a signal\
    \ is not a usual function that is\ndefined as a slot. On the contrary, it is only\
    \ emitted with the emit keyword. The\nimplementation of setValue(int value) could\
    \ look something like the following:\n\n```\nvoid MyMainWindow::setValue(int value)\n\
    {\n    FunctionForChangingValue(value);\n}\n```\n\nIn this code, the function\
    \ FunctionForChangingValue() is called to actually change\nt value. The last thing\
    \ you need to do is connect the signal and the slot together:\nconnect(this, SIGNAL(ValueChanged(int)),\
    \ this, SLOT(ValueChanged(int)) );\n\nThe result of this little example is when\
    \ the setValue() function is called, it checks\nof the new value is equal to the\
    \ old. If that is not the case, the onChanged() sig-\nals is emitted. Because\
    \ the onChanged() signal is connected to the\nChanged() slot, the onChanged()\
    \ slot will be executed whenever the\nChanged() signal is emitted. The onChanged()\
    \ slot then uses the\nFunctionForChangingValue() for actually changing the value.\n\
