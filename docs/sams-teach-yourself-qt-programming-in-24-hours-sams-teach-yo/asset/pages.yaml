    # Summary


    Dialogs play an important role in every serious application. Don''t be surprised
    if you need to create 30 or more dialogs for a medium-sized application, and maybe
    over hun-d for a large project.


    Often you''ll find that the predefined dialogs will be all you need. However,
    when they aren''t, Qt''s classes for building custom dialogs can be used. What''s
    more, they do much of the work for you.


    In this lesson, you have learnt to work with Qt''s predefined dialogs as well
    as creating custom ones. With the knowledge, you should be able to use Qt to create
    any kind of dia-log for your program, no matter if it''s a commonly used dialog
    or a personal creation.


    # Q&A


    +   - The widgets at the bottom of my tab dialog are only partially visible. What''s
    wrong?

    - As you can see, the tab dialog doesn''t take up the entire window. There is
    free space all around it. If you expected the page to be the same size as the
    window, some of your widgets might not be visible or partly visible.

    - I can''t see the label or cancel button on my progress dialog. What''s wrong?

    - You need to make your dialog modal. This is done by passing the boolean TRUE
    as the sixth argument to the QProgressBar constructor.

    - Do I have to have three buttons in my message box? I just want one or two!

    - No, you don''t have to have three buttons. Just give the QMessageBox constructor
    the value 0 at the place where you would normally define the third button.'
