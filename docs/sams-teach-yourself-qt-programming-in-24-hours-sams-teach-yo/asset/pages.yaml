    # Understanding QCache and QStringCache


    The classes QCache and QStringCache can be used to create hash tables with a size
    limit. This means that you set a maximum size that the container can become, and
    if this size is reached, the least recently used element will be deleted. This
    could be useful if you want to pick up an exact amount of information, or if you
    want to control how many elements a hash table can hold to reduce memory consumption.
    Listing 14.4 provides an example.


    # Listing 14.4 Creating a Size-Limited Hash Table with QCache


    ```

