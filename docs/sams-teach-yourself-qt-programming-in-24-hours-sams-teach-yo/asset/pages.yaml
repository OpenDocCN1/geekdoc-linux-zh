  md: '# Working with List Boxes


    The QListBox list box widget is generally used to let the user select one or more
    items from a list. This is usually a text item but can also be a pixmap. You’ll
    find an example in List 7.1.


    INPUT LISTING 7.1 A QListBox Example


    ```

