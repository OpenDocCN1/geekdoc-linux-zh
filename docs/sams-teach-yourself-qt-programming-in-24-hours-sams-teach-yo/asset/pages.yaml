  md: '# Using Text-Entry Fields


    Text-entry fields are widgets in which you can enter text. For example, in a text
    editor, the white area where you can write and read text is a text-entry field.
    Qt provides two classes for creating text-entry fields: QLineEdit and QMultiLineEdit.
    Both are covered in this section.


    # QLineEdit


    QLineEdit creates a single-line text-entry field. It can be (and should be) retrieve
    short strings from the user, such as a username and password. Listing 8.1 shows
    a QLineEdit object.


    Listing 8.1 A QLineEdit Example


    ```

    1: #include <qapplication.h>

    2: #include <QtWidgets.h>

    3: #include <qlineedit.h>

    4:

    5: class MyMainWindow : public QWidget

    6: {

    7:     public:

    8:     MainWindow();

    9:     private:

    10:    QLineEdit *edit;

    11: };

    12:

    13: MyMainWindow::MyMainWindow()

    14: {

    15:     setGeometry(100, 100, 200, 50);

    16:

    17:     edit = new QLineEdit(this);

    18:     edit->setGeometry(10, 10, 180, 30);

    19: }

    20:

    21: void main(int argc, char **argv)

    22: {

    23:     QApplication a(argc, argv);

    24:     MainWindow w;

    25:     w.setWidget(edit);

    26:     w.show();

    27:     return a.exec();

    28: }

    ```


    Listing 8.1 doesn''t present anything really new. It just creates and presents
    the widget as usual. However, it presents the use of the new widget QLineEdit.


    Figure 8.1 shows this program.'
