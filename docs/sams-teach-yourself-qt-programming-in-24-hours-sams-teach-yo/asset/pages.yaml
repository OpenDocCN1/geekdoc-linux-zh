    # Writing, Compiling, and Running a Qt-Based OpenGL Program


    In this section, you''ll look at an example of how you can integrate Qt with OpenGL.
    The example creates a window with an OpenGL drawing area and three sliders, created
    with Qt''s QSlider class. By using Qt''s simple slot and signal function, you
    can make the OpenGL drawing change as the sliders are dragged.


    You''ll start by taking a look at the code. Although the code example is well
    commented, you''ll need some basic understanding of OpenGL programming to follow
    it. After this, you''ll learn how to compile and run the example, which libraries
    you need to link to and so on.


