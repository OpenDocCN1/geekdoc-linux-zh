    # Quiz Answers for Hour 11


    +   1. What is a layout manager?

    A layout manager is a class that can be used to lay widgets.


    +   2. How can layout managers help you in your work?

    By using a layout manager, you don''t have to define the widget''s location-coordinates
    by hand and by this save of lot.


    +   3. How does QVBoxLayout organize its child widgets?

    QVBoxLayout organizes its child widgets in a column.


    +   4. How does QHBoxLayout organize its child widgets?

    QHBoxLayout organizes its child widgets in a row.


    +   5. How does QGridLayout organize its child widgets?

    QGridLayout organizes its child widgets in a grid.


    +   6. Which two numbers represent the upper-left widget in a QGridLayout manager?

    0 and 0.


    +   7. When do you need to use nested layout managers?

    to achieve a more original, and many times more complex, layout.


