  md: '# Using Qt for Working with Sockets


    Qt''s socket classes can be used to deal with various input sources, as network
    connections. Qt''s socket support consists of three classes: QSocket, QSocketAddress,
    and QSocketNotifier. By using these three classes, you can create a platform-independent
    communication system using sockets. At the time of this writing, Qt''s socket
    support wasn''t fully implemented yet. However, it''s expected to be in the near
    future. Imagine your own platform-independent Internet browser!


    Also at the time of this writing, Qt''s socket library was not part of the standard
    Qt library. However, it will still be the case when you read this book is hard
    to say. However, it will be obvious when you try to compile a program that uses
    one of Qt''s socket classes. If your compiler whines about undefined symbols regarding
    one of the three socket classes, the library is not part of the standard Qt library.
    However, it''s very simple to fix this. Here''s how:


    ```

    # cd QTDIR/extensions/network/src

    # make

    ```


    By running make, you install and compile the library in $QTDIR/lib as libnetwork.a
    (a static library). You then need to link against this library when you want to
    use one of the socket classes.


    # Following the POSIX Standard


    POSIX, an acronym for IEEE Portable Operating System Interface for Computing,
    is an operating system standard. POSIX.1, one specific part of the POSIX standard,
    defines the functions that should be available for accessing system-specific features.
    If you use non-Qt classes and functions you can still keep your programs portable.


    All-known UNIX systems, as well as Windows NT, follow the POSIX standard. If you
    need a function that Qt can''t offer, you''re forced to use an outside function
    or class. However, if your non-Qt functions or classes follow the POSIX standard,
    you can still be sure that your program will be portable.


    If you want to learn more about POSIX, as well as which functions are a part of
    the POSIX standard, call IEEE at 732-981-1393 and order the POSIX standards and
    drafts (inside the U.S., you can also call toll-free at 1-800-678-IEEE).


    # Isolating Platform-Specific Calls


    Sometimes, the only solution to a problem is to use platform-specific functions
    that do not even follow the POSIX standard. In these cases, you''re forced to
    write two or more versions of certain parts of your program to make it available
    on multiple platforms.'
