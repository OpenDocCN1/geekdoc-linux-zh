  md: 'The second difference you''ll notice is that QWidget::setGeometry() isn''t
    used to change the size and position of the buttons. Instead, QWidget::setMinimumSize()
    is used to set the smallest size the buttons can have (200 times 100 pixels, in
    which cases). The buttons will appear with this size when you first launch the
    program, but this size is not absolute.


    Finally, a whole new object is added to the program. It''s an object of the QVBoxLayout
    class, called vbox. To make vbox know about the buttons (b1 and b2) and tell it
    to take care of the layout, the buttons have to be registered with the layout
    manager. This is done on line 26 and 27 with the QVBoxLayout::addWidget() function.
    When you''re using layout managers, all widgets have to be registered like this.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_207_0.png)


    It''s not only QPushButton widgets that can be registered and controlled by a
    layout manager. You, in fact, use a layout manager to control the layout of any
    widget.


    That wasn''t hard, was it? If you want to arrange your widgets in a row instead,
    simply use QHBoxLayout instead of QVBoxLayout.


    # Using QGridLayout


    If you want to lay out your widgets in a grid, you should use the QGridLayout
    class (you could use QHBoxLayout and QVBoxLayout to create each row and column,
    but it''s easier to use QGridLayout). Let''s look at a simple example that uses
    QGridLayout to place six QPushButton objects in three rows and two columns. The
    source code for the example is shown in Listing 11.3.


