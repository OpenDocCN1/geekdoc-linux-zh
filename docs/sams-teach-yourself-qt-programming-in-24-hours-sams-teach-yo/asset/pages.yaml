  md: '# # Building a Portable Project with the tmake Utility


    You''ve probably noticed that there''s almost one or more files called Makefile
    in a source distribution of a program. These files hold information about how
    the program should be compiled. This includes information about what compiler
    to use, libraries to link with, in which the order source files should be compiled,
    and so on. Then, when you run the make utility in the directory containing the
    makefile, it makes manfiles and ensures that the program is compiled as defined
    in the makefile. This, anyone who wants to compile the source just has to enter
    make and press Enter.


    Makefiles can be generated in many different ways. However, although you can certainly
    write all makefiles manually, it''s more convenient to use tmake for this. If
    you''ve ever compiled an application on UNIX, you''re probably familiar with the
    configure script, which is often used to get various types of information about
    the system and create one or more makefiles based on that.


    However, this only applies on UNIX platforms. When working with a cross-platform
    library as Qt, you need some tool that can be used on both UNIX and Windows and
    also generate makefiles for both platforms. Fortunately, this tool has already
    been created by Troll Tech; it''s called tmake. This tool creates makefiles for
    either UNIX or Windows, depending on platform it''s currently running on. In fact,
    this is an extraordinary tool that can save you hours of boring work (as writing
    makefiles for multiple platforms manually). Here is how Troll Tech describes it:


    tmake automate and streamlines the process of managing makefiles and lets you
    spend your valuable time on writing code, not makefiles.


    # Getting and Installing tmake


    tmake is free software and can be downloaded from Troll Tech''s FTP archive (ftp://ftp.troll.no/freebies/tmake/).
    Here, you''ll find two versions of the—one for Windows and one for UNIX. The Windows
    version ends with .zip (it''s a zipped archive), and the UNIX version ends with
    .tar.gz (it''s a tarred zipped archive). At the time of this writing, the latest
    version of tmake is 1.3.


    When you''ve downloaded one of the tmake distributions, you need to unzip or untar
    the file. On Windows, this can easily be done with WinZip (www.winzip.com) or
    pkzip if you''re on UNIX, issue the following command in the directory containing
    the file you just downloaded:


    ```

    $ tar xvfz tmake-1.3.tar.gz

    ```'
