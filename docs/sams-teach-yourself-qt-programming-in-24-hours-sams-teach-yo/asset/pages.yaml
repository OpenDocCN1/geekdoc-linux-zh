    # Q&A


    +   - My compiler can''t compile my OOP code. It whines about missing .h files.
    What is wrong?


    +   - You need an OOP compiler, such as egcs, to compile an OOP program. You also
    need to have the C++ library and header files installed. These are things that
    come with your compiler or distribution.


    +   - Why do I get an error message about the return type of the constructor when
    I try to compile an object-oriented program?


    +   - You''ve probably forgot to add a semicolon (;) after the last bracket (})
    of your class declaration.


    +   - When I try to compile a Qt program, I get a lot of errors about missing
    references. What''s wrong?


    +   - You probably forgot to add the -lqt flag when you tried to compile the program.


    +   - I get the error message base operand of ''->'' has non-pointer type ''car''.
    What''s wrong?


    +   - If the object is a pointer, you use the -> operand to access its members.
    Otherwise, you use the . operand.'
