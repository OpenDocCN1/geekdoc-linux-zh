    | Function | Description |

    | --- | --- |

    | QMovie::restart() | Rewinds the animation, and if it has not been paused, starts
    the animation over again. |

    | QMovie::setSpeed() | With this function, you can set the speed of the animation.
    Just give the speed (as a percentage) as an argument to the function. The default
