  md: '# Adding Widgets to the Project


    Once a new project is created, you can start adding widgets to it. This involves
    two steps: choosing a widget from the QtEz main window and drawing it on your
    empty window (the project).


    Start choosing a Qt widget from the QtEz main window. The widgets are shown at
    the bottom of the window, separated into a few categories on a tab bar. The tabs
    are labeled Qt, Misc, Network, Dynamics, and Untested. For now, stick with the
    widgets in the tab labeled Qt. From the set of widgets included in the Qt tab,
    click the icon representing a pushbutton (if you are unsure which one it is, hold
    the mouse pointer over one of the icons, and a description text will soon appear).


    Now, move your mouse to the empty project window, hold the left mouse button down,
    drag the mouse down to the left, and release it. Now you''ve created a pushbutton
    on your widget; it''s as simple as that! You can now resize the button by dragging
    one of its corner, and you can move the button by dragging somewhere in the middle
    of it. An example of this button will look like is shown in Figure 24.4.


    FIGURE 24.4

    A project window with a simplepushbutton in.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_407_0.png)


    To change the settings for the button, such as the text label, click with your
    left mouse button on the button, and choose Attributes from the menu that appears.
    Now, the Attributes window for the button will appear (all widgets have an Attributes
    window from which you can easily change their attributes). This window is shown
    in Figure 24.5.


    In this window, scroll down to the row labeled Text and click on the right cell
    of this row. This cell will become editable, and you can enter your own label
    for the button here. When you have entered a new label, press Enter to activate
    the change and close the Attributes window. Now, the label of your pushbutton
    is changed.


    The concept used here to add and customize a pushbutton is the same for all widgets.
    Therefore, if you''ve followed and understood everything in this section, you''ll
    have no problem adding other widgets as well.'
