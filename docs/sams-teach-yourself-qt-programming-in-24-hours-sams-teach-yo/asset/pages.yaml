    # Adding a Quit Button


    One of the things that make Qt so different from other, similar libraries is how
    it interacts with users—that is, how things happen when you, for example, click
    a button or drag a slider. Most other GUI libraries use so-called callback functions,
    Qt uses signals and slots. Simply speaking, signals and slots are functions that
    are connected to each other. The signal (which actually is a function) is executed,
    and the slot (which is also a function) that is connected to this signal also
    gets executed. You''ll find an example in this section.


    We''ll discuss this topic in depth later in hours. For now, you''ll learn how
