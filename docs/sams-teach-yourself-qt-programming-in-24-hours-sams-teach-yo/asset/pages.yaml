  md: '# Learning to Use Container Classes


    These classes make a complete set of containers for storing any kind of data,
    from single bits to complete class objects. The most trivial container class,
    QBitArray, can store only bits (1s and 0s), in contrast to, for example, QList,
    which provides a double-linked list of any Qt class object.


    By learning to use these classes, you will be able to create any kind of list
    with any kind of elements. The use of these classes will be discussed in more
    detail in the following sections.


    # Using Stacks and Queues


    A stack is a well-known structure among programmers. It is used when you want
    to insert elements (of any kind) into a list and retrieve them in the opposite
    order (last in, first out).


    A queue is the opposite of a stack. With this kind of list, you retrieve the elements
    in the same order as they were inserted (first in, first out).


    In Qt, stacks and queues are created with the classes QStack and QQueue. Working
    with these differences differs a bit from the other container classes. Therefore,
    they will be discussed separately in the following sections. The first section
    starts by looking at how QStack can be used.


    # Creating a Stack with the QStack Class


    As stated, a stack should be used when you need to create a list of objects and
    retrieve them in reverse order. This can be useful in many programming situations.
    Imagine, for example, that you are creating a QWidget that the user can add icons
    to. However, you don''t want the widget to hold more than ten icons at a time.
    If an icon is added when the widget is already full, the last inserted one should
    be removed to make room for the new one. By using a stack, this would be very
    easy to achieve.


    Listing 14.1 provides an example of how QStack can be used. Here, a stack that
    can store strings (char*) is created. Three elements are inserted into the stack.
    Finally, the elements are retrieved (at the same time) and shown in a QMultiLineEdit
    object.


    # Listing 14.1 Creating a Stack with QStack


    ```

    1: #include <application.h>

    2: #include <application.h>

    3: #include <widget.h>

    ```


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_250_0.png)


    continues'
