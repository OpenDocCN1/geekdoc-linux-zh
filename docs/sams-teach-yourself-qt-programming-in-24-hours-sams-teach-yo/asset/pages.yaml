  md: 'This new way of connecting user events to program events is much easier to
    use than callback functions. Slots and signals are two strong reasons why you
    should choose Qt over other toolkits.


    In this hour, you''ll learn the basics of signals and slots, and you''ll look
    at some of the predefined signals and slots that come with Qt. At the end of this
    hour, you will learn how to define your own slots and signals. For this, you''ll
    need to use a utility called the Meta Object Compiler (MOC) which will be covered
    well.


    # # Understanding Signals and Slots


    First, you need to make sure you understand slots and signals. As stated, this
    technology differs a bit from the more traditional callback functions. All the
    signals technology was developed independently by Troll Tech—it''s not a C++ feature.
    To fully understand discussions about slots and signals throughout this hour,
    there are a few terms you need to understand. These terms are detailed in Table
    4.1


    # ## 4.1 Slots and Signals Terms


    | Term | Explanation |

    |---|---|

    | User event | Refers to something of the program does. For example, the user
    can click a button or drag a scrollbar.

    | Program event | Refers to something the program does. An example of a program
    event is when the program exits after the user clicks the Exit button.

    | Emitting a signal | Basically means "sending" a signal. For example, when you
    click a button, the signal clicked is emitted. To emit a signal, the keyword is
    used.

    | Internal state | When talking about signals, you might hear the expression "internal
    state has changed." This simply means that some data in an object has changed
    and therefore the object emits a signal.

    | MOC | The Meta Object Compiler (MOC) is used to build your own slots and slots.
    It takes care of the Qt-specific keywords (such as emit) and makes valid C++ code
    of them. You''ll learn more about MOC in the "Getting to Know the Meta Object
    Compiler" section in this hour.|


    # ## Understanding Slots


    Slots are actual member functions (functions that are members of a class). However,
    they have some special features added to them that make it possible to connect'
  merge: -1
