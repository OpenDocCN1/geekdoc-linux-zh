    and/or QMultiEdit objects with the key combinations Ctrl+C for copy, Ctrl+X for
    cut or, and Ctrl+V for paste. These key combinations are standard for many GUI
    applications on both UNIX and Windows, so you''re probably already familiar with
    them.


