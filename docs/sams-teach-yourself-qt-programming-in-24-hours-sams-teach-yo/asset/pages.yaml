  md: '# Quiz Answers for Hour 8


    +   1. What’s the difference between QLineEdit and QMultiLineEdit?

    QLineEdit is for retrieving short text strings, such as a password, from the user.

    MultiLineEdit is for showing large amounts of text to the user or for letting
    the user type in large amounts of text.

    2. Which class should you use to show a text file to the user?

    Most likely the QMultiLineEdit class.

