  md: '# Quiz Answers for Hour 12


    +   1. Which class represents a file in Qt?

    The class QFile.


    +   2. What does the QTextStream class used for?

    It''s used to create a stream between the file and the program. This stream can
    then be used to transfer information from the file to the program.


    +   3. What does the QDir class do?

    It reads a directory and creates a vector with one element for each directory
    item (Remember, in a vector, each element can be accessed with the [] operator).


    +   4. How would you get the name of the fifth item in a directory?

    By calling myObject[4]. Remember, the 4 represents the fifth argument because
    the numbering starts at 0.


    +   5. When would you need to use the QFileInfo class?

    When you need information about a file (such as its size, for example).


    # Quiz Answers for Hour 13


    +   1. Why do you think QValidator is such an abstract class?

    Simply because it''s impossible to predict all the different ways you, the program-mer,
    want to use a validator.


    +   2. Are there any predefined validator classes at all?

    Yes, QDoubleValidator and QIntValidator.


    +   3. If you answer Yes in the previous question, can you tell us what this validator
    (or these validators) can be used for?

    For validating floating-point numbers and integers.


    +   4. Which Qt classes can use a validator?

    QLineEdit, QSpinBox, and QComboBox.


    +   5. Which function do you need to call to tell an object to use a validator?

    ThesetValidator() function.


    +   6. When creating your own validator classes, which virtual function do you
    insert the actual validation code in?

    The validate() function.'
