    # tmake for Creating Makefiles


    When tmake is correctly set up on your system, you''re ready to start using it.
    In this sec-tion, the most common uses of tmake are covered. For a complete description,
    see the HTML documents tmake.html (user''s guide) and tmake-ref.html (reference
    documenten-ation) are located in the doc subdirectory of tmake.


    When tmake creates a Makefile for you, it does so based on the project files it
    finds in the directory entered in the TIMEPATH variable from a project file (which
    ends with .pro) that you need to create. Creating a project file is really simple,
    and it usually doesn''t take long. Here''s an example:


    ```

    CONFIG  = qt release

    HEADERS = MyWidget.h

    SOURCES = MyWidget.cpp main.cpp

    TARGET = MyWidget

    ```


    In the first line, the CONFIG variable is set. This variable can have a few predefined
    values that determine what kind of this project it is. In this case, the options
    qt and release are set. This tells tmake that this project is a Qt project and
    that should be considered a release version and not a debug version. However,
    both options are set by default (if no CONFIG variable is set). They are just
    included here as an example. The list of options you can enter in the CONFIG variable,
    see Table 22.2.


    # TABLE 22.2 Qt Functions That Aren''t Portable


    | Option | Explanation |

    |---|---|

    | qt | This option tells tmake that the project is a Qt project. When it is set,
    any needed M files will be generated and included. This is the default |

    | release | This option tells tmake that the project should be considered a release-version.
    This means that no debugging symbols will be included and that the binary will
    be compiled for full optimization. This is also the default |

    | debug | This option tells tmake that the project should be considered a debugging
    version and therefore include debugging symbols. This should only be set if you
    want to compile a binary used for debugging |'
