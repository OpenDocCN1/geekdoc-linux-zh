  md: '# # Getting to Know the Qt Widgets: Lesson Three


    Table 8.1 Useful QListView Member Functions


    | Function | Description |

    | --- | --- |

    | setColumnCountMode() | This method determines how the column''s width should
    be set. It takes two arguments: the first is an integer representing the column
    in question, and the second is an enum value that can be set to Maximum or Manual.
    If set to Maximum, the column gets the size of the widest item in the column.
    If set to Manual, the width is set by setColumnWidth(). |

    | setMultiSelection() | Determines whether the user can select multiple items
    at the same time. The function takes a bool value as an argument (TRUE allows
    multiselect and FALSE selects single). |

    | setAllColumnsFocus() | This function can take the argument TRUE or FALSE. If
    this function is set to TRUE, the focus will be shown in all columns. Test it
    and you''ll see! |

    | setTreeSize() | The integer given to this function determines how many pixels
    an item is offset relative to its parent. Don''t get it? Try it and see! |

    | setSorting() | This function determines how the sorting should occur. It takes
    two arguments: an integer representing the question and a bool value (TRUE or
    FALSE). If this function is set to TRUE, the sorting will be descending if the
    function is set to FALSE. |

    | itemAt() | This function takes a pointer to a QObject as argument. It returns
    a pointer to the QListView item on that position. |

    | firstChild() | Returns the first item in the list view. |

    | itemBelow() | Returns the item immediately below this item. |

    | itemAbove() | This function determines whether an item is selected. It takes
    two arguments: the first is a pointer to a QListView item, and the second is a
    bool value (TRUE or FALSE). TRUE makes it selected. |

    | setCurrentItem() | Sets keyboard focus to the item you pointer gives as an argument.
    |

    | currentItem() | Returns a pointer to the currently selected item. |

    | selectionChanged() | This function is a signal that''s emitted when the selection
    changes (that is, if you select another item or deselect the current item). It
    also sends a pointer to the newly selected item. |

    | currentChanged() | This signal is emitted when the current item changes. It
    also sends a pointer to the new item. |


