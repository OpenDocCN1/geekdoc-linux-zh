  md: '# Portability


    It’s important that you don’t spread the platform-specific code all over your
    source code. This will make the porting process much harder and time consuming.
    If you do it all over your source code, you''ll have to search it all through
    to find platform-specific calls and make small changes here and there. On the
    other hand, if you isolate the part of your source code that has to be platform
    specific into one or more classes or files, the porting will be much easier because
    you know exactly which part of the code needs to be changed.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_376_0.png)


    For example, you could isolate the platform-specific code into the class PlatformSpecificClass
    and make just one version of this class for each platform you want to support.
    You could then have one global header file, PlatformSpecificClass.h, that would
    hold the class declaration for PlatformSpecificClass, and one CPP file for each
    platform that holds the platform-specific class definitions. If your program supports
    Linux and Windows NT, you could simply make two files—PlatformSpecificClass.cpp
    and PlatformSpecific-NT.cpp—and copy one of them to PlatformSpecificClass.cpp,
    depending on whether you’re compiling on Linux or Windows NT.


    By following these simple isolation rules, porting a program that uses platform-specific
    code can still be quite easy (although not as easy as if Qt classes were used).


    > Another way of doing this is to make two classes with the same name, place the
    class declaration for them in separate files and then the preprocess decide which
    header file to include. Consider the following example:

    ```cpp

    #ifdef LINUX

    #include "platform-linux.h"

    #else

    #include "platform-nt.h"

    #endif

    ```


    By making sure that LINUX is defined only if the program is compiled on Linux,
    and then add this code to the beginning of the cpp file, you’ll make sure that
    the correct header file will be included.


    # Nonportable Qt Functions


    Although the Qt developers strive to keep Qt as platform independent as possible,
    it is, in some cases, impossible to fully do so. Therefore, the functionality
    of a few Qt methods differs between UNIX and Windows. These differences are not
    big, but they can still cause problems in some cases. However, if you’re aware
    of these differences, you can'
  merge: -1
