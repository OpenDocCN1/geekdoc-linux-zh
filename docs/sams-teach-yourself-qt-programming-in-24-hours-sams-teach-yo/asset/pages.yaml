  md: "# Portability\n\nWhat progen does is to search through a given set of source\
    \ files and then generate a project file based on the information it finds in\
    \ these files. However, it's impossible for progen to know exactly what options\
    \ you want to use (like what libraries you want to link with), so that you need\
    \ to edit by hand.\n\nHere's an example using the files from the previous section\
    \ (MyWidget.cpp, MyWidget.h, and main.cpp). Place these files in a directory of\
    \ your own (without subdirectories) and issue the following command:\n\n```\n\
    # progen -n -o MyWidget.pro\n```\n\nNow, progen will search the current directory\
    \ and all subdirectories for files that end with .cpp or .h. A project files are\
    \ then created (what's included in the project file depends on which files progen\
    \ finds). The -n option is used to define the name of this project (that is, what\
    \ value the TARGET variable will have on the project file). With the -o option,\
    \ you define the name of the project file. In this case, progen will create the\
    \ following project file:\n\n```\nTEMPLATE = app\nCONFIG = qt warn_on release\n\
    HEADERS = MyWidget.h\nSOURCES = MyWidget.cpp \\\n    main.cpp\nTARGET = MyWidget\n\
    ```\n\nAs you can see, progen found all three files and placed them correctly\
    \ in the HEADERS and SOURCES variables. However, in this example, progen wasn't\
    \ of much help because the project only contains three of files. However, image\
    \ how useful this tool is when your projects include few hundred files!\n\n![](img/ed4f2be9f0799d95b6f041531c9a1f14_386_0.png)\n\
    \n> On the first line of the progen-generated project file, there's a new variable\
    \ you haven't seen before, called TEMPLATE. This variable defines the name of\
    \ the template file to use. In this case, /usr/local/qt/tmake/lib/linux-gapp.t\
    \ file will be used. This is the default, though so you don't need to define the\
    \ TEMPLATE variable if you're developing an application. However, there are a\
    \ few other files (other than app.t) in each subdirectory of /usr/local/qt/tmake/lib\
    \ that should be used if your project is not an application. The lib.t file should\
    \ be used if your project is a library.\n\nThe progen utility is covered in the\
    \ tmake user's guide, so you're encouraged to take a look there for complete coverage\
    \ of this tool."
