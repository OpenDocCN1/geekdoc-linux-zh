    # Adding a Status Bar


    The status bar is the little bar you usually see at the bottom of many applications.
    It shows different messages to the user, depending on what the user is currently
    doing the application. Adding a status bar to the program in Listing 5.5 is a
    really simple task. Just add the following line to the class constructor:


    ```

    statusBar();

    ```'
