  md: '# LISTING 1.3 Hello World with Qt


    ```

    1: #include <application.h>

    2: #include <qwidget.h>

    3: #include <qpbutton.h>

    4:

    5: int main(int argc, char **argv)

    6: {

    7:   Application a(argc, argv);

    8:   QMainWindow mainwindow;

    9:   mainwindow.setMinimumSize(200, 100);

    10:  mainwindow.setMaximum(200, 100);

    11:

    12:  QPushButton helloworld("Hello World!", &mainwindow);

    13:  helloworld.setGeometry(20, 20, 160, 60);

    14:

    15:  a.setWidget(&mainwindow);

    16:  mainwindow.show();

    17:  return a.exec();

    18:

    ```


    Much of the code speaks for itself. However, let''s look at the program line by
    line to make sure everything is clear.


    Lines 1 to 3 include three so-called header files. These files include various
    declarations and, by including these declarations, you can use parts of the library
    in your program. In this case, the definitions for the QApplication, QWidget,
    and QPushButton classes are included. The use of header files is not Qt specific,
    though you are probably familiar with it.


    Line 5 tells you that the definition of the main() function starts here. All C/C++
    programs must include exactly one main() function. The main() function is always
    executed first. Two arguments for main()int argc and char **argv—are also declared.
    These two arguments are built-in functions in C++ that make working with command-line
    arguments easy.


    Line 7 shows on the class QApplication is created. Just as all C/C++ programs
    need exactly one main() function, Qt programs need to contain exactly one QApplication
    object. Also, argc and argv are given as arguments to the constructor of the QApplication
    object. This is done to let Qt process command-line arguments, such as -geometry.


    Line 9 creates a new QWidget object, called mainwindow. You can think of a QWidget
    as a window on which you can place other objects, such as buttons. Lines 10 and
    11 set the minimum and maximum sizes of mainwindow to 200 pixels wide by 100'
