  md: '# Portability 365


    I''m developing a GUI installation program for my new Linux device driver. Is
    portability really important for me?


    No, obviously it''s not. Device drivers are always platform specific, and the
    chance that anyone would ever want to install your device driver on any other
    platform is very small. However, if you ever want to write a simple program for
    Windows, it may be a good idea to make this installation GUI portable anyway,
    so it can be easily adapted to Windows. This way, you can save yourself some work.


    Is it possible to create makefiles for platforms other than my own with tmake?


    Of course it is. Change the TMAKEPATH variable. For example, to create a makefile
    for Borland C++ on Windows, set TMAKEPATH as follows:


    ```

    export TMAKEPATH=/usr/local/qt/tmake/lib/win32-borland

    ```


    To create amakefile, just use tmake as usual:


    ```

    tmake MyWidget.proto -o Makefile

    ```


    It''s as simple as that!


    # Workshop


    You''re encouraged to work through the following questions and exercises to help
    you retain what you''ve learned in this hour.


    # Quiz


    +   - Is it possible to write network applications with Qt?

    - What is POSIX?

    - What is POSIX.1?

    - Are there any functions in Qt that are not fully compatible between UNIX and
    Windows?

    - What is tmake?

    - What is a project file?

    - What is progen?


    # Exercises


    +   - Try setting the TMAKEPATH variable to a few different subdirectories of
    /usr/local/qt/tmake/lib. Create a makefile for each time you change TMAKEPATH
    and then investigate the makefiles to see the differences that exist.'
