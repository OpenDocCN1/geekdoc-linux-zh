    object. Another way of setting a custom QGLFormat object for a context is to give
    it as the first argument to the QContext constructor.


    After you''ve created a QGLFormat object, you can use the functions described
    in Table 19.1 to set the various options. All functions take a bool value as an
    argument.


    # TABLE 19.1 QGLFormat Member Functions


    | Function | Description |

    | --- | --- |

    | QGLFormat::setDoubleBuffer() | Give this function argument TRUE to turn on double
    buffering, single buffering is used. If you give the argument FALSE, Double buffering
    is a technique that makes the rendering to an off-screen buffer first; then, when
    the rendering is finished, the buffer is copied to the screen. This avoids flicker
    and helps performance. |\| QGLFormat::setDepth() | Use this to enable or disable
    the depth buffer. The depth buffer is also called z-buffering. This technique
    assigns pixels a z-value that represents the distance between the pixel and the
    viewer. The higher the z-value has, the closer it is to the viewer. Pixels with
    the highest z-values are drawn first. |

    | QGLFormat::setRGBA() | This function runs on RGBA color mode if it gets the
    argument TRUE, and it turns on color index mode if it gets the argument FALSE.
    RGBA is an extended version of RGB. It adds a fourth value to the color—the alpha
    quadruplet. |

    | QGLFormat::setAlpha() | If this functions is called with the TRUE argument,
    it enables the alpha channel for the framebuffer. If this is enabled, the alpha
    quadruplet in RGBA represents the transparency of a pixel. |

    | QGLFormat::setAccum() | This function enables the accumulation buffer if you
    give the argument TRUE. This feature is used to create blur effects and multiple
    exposures. |

    | QGLFormat::setStencil() | This function turns stencil buffering if it is TRUE.
    The stencil buffer can be used to mask away drawing from certain parts of the
    screen. |

    | QGLFormat::setStereo() | By calling this function with the TRUE argument, you
    can turn on stereo buffering. The stereo buffer technique is used to provide extra
    color buffers to generate left-eye and right-eye images. |'
