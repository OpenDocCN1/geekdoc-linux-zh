    # Summary


    The GUI builders covered in this hour can (and will) be a great help to you when
    creat-ing GUI interfaces. Although you will still have to write the code that
    will give your program actual functions (a GUI builder can''t write the HTML parser
    in a WWW browser), the GUI builders take care of the GUI interface. This includes
    tasks such as placing out and setting the size of widgets and creating dialogues.
    If your program uses a complicated lay-out and many dialogues, this can be quite
    consuming to do by hand. Therefore, GUI builders can save you lots of work.'
