    (code your compiler understands). In this section, you will learn how to work
    with the MOC


    # Locating the Meta Object Compiler


    The Meta Object Compiler binary, moc, is always located in QTDIR/bin directory.
    If the base directory of your Qt installation is /usr/local, then all Qt binaries
    are located in /usr/local/bin, including moc. This binary was compiled automatically
    when you compiled Qt Library.


    If you added the QTDIR bin directory to your PATH variable, as described in Hour
    1, "Introduction to Qt": you can execute moc from anywhere on your file system
    by entering moc at the prompt.


    # Using the Meta Object Compiler


    After you have defined a slot or a signal in a class declaration (as described
    later in this hour), you need to let moc read the file and extract valid C++ code
    from it. Fortunately, moc is very simple The syntax is as follows:


    ```

    moc infile.h -o output.moc

    ```


    This command will read the infile.h, which should hold the declaration for your
    Qt class and declare a few signals and/or slots, moc will create valid C++ source
    code from this and place it in the output.moc file. It is as simple as that!


    To compile your new class, you can either include the moc-file (the file created
    by moc) or make object-files out of the moc-file and the cpp-file and link them
    together, as shown in the following:


    ```

    $ g++ cfile.cpp -o output.o

    $ g++ infile.cpp -o infile.o

    $ g++ -lat output.o infile.o -o MyProgram

    ```


    Both methods (including the moc-file or linking it) work equally well; chose the
    method that suits you best. In this book, you will use the former method.


    # Creating Custom Slots


    Whenever you want a custom event to occur when the user does something with your
    program (like clicking a button), you must create a custom slot that can be connected
    to the appropriate signal (the clicked()). If you are working with buttons, For
    this, you need to know two things: how to use moc and how to define a slot in
    a class'
