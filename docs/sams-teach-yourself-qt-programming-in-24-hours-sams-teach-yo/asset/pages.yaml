    Line 99 creates the QMultiLineEdit edit, and line 100 sets this object to the
    central widget. The central widget, in a QMainWindow-based program, is the widget
    that all menus, toolbars, and status bars will be added around. The widget you
    define your central widget should be the most essential part of your program (as
    the text area in a text editor). If you were creating a painting program, the
    central widget would be the area where the user is doing the drawing. Or, in a
    Tetris game, the central widget would be the widget where the playing is done
    (in that case, a widget you''ve created yourself). This example uses a QMultiLineEdit
    as the central widget, and the program will thereafter look just like a text editor.
