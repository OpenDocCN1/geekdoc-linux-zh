  md: 'As you can see, the QColor::isValid() function is used to determine whether
    myColor is valid. The first if-statement checks if the selected color is valid.
    If that is true, the program can go on and use this color. The second if-statement
    (which could simply be an else-statement, but an if-statement is used for clarity)
    checks if the selected color is invalid. If that is the case, the program must
    abort the operation. This is a simple way of avoiding problems. If an invalid
    color is selected, the program will not be able to use it, and in the worst case,
    the program will crash.


