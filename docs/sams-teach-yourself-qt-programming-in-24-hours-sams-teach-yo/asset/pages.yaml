  md: '# Understanding the Importance of QString


    In this lesson, you''ll take a look at the functions and utilities that can help
    you create international Qt applications.


    To begin with, you''re encouraged to use the QString class for any user-visible
    text (that is, in any way will be visible to the user).


    QString uses, in contrast to char, Unicode encoding internally. This makes QString
    able to process any of the world''s languages without problems. If you use char,
    it''s very possible that some systems won''t be able to process the text in the
    way it intended. By using QString for text that''s visible for the user, you might
    make this problem not occur.


    Another good reason to use QString is speed. All functions that present some kind
    of text to use a QString as an argument. Although it''s possible to use char with
    these functions as well, do so will force a char-to-QString conversion, and this
    takes a certain amount of CPU time. However, you won''t recognize any change in
    speed by just changing a few characters to QString. The speed change will only
    be obvious if your program is forced to do a large amount of char-to-QString conversions.


    For strings that the user never sees (also known as programmer space text), it''s
    safe to use char.


    # Creating Translation Files


    When creating translation files in Qt, you need to perform a number of tasks.
    These include changes to the source code as well as using Qt''s utilities to create
    the special translation files for you, which are used to find a translation for
    specific words or terms. In this section, you''ll learn everything you need to
    know to create your own translation files.


    # Using the tr() Function


    The QObject::tr() function must be used everywhere in your program where you want
    to have a string translated. It''s a simple function to use; you just pass the
    string you want to translate as an argument. Because it''s a subclass of QObject,
    it''s included in all classes that inherit from QObject.'
