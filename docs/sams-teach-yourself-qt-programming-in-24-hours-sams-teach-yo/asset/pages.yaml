  md: '# Using Layout Managers


    As mentioned earlier, you can also use layout managers when you need to place
    many widgets. For example, if you want place ten QPushButton Widgets, it would
    be very time consuming to enter the absolute position for every single button.
    Instead, you can create the buttons, not enter any absolute positions for them,
    and then register each one with a layout manager.


    # Using Layout Managers


    Now you know what layout managers are and how they can be used. Therefore, let''s
    go through what you should do to implement them in your program


    First of all, you need to know what layout managers are included in Qt and what
    you have to choose from. Table 11.1 lists the layout managers included in Qt 2.0
    and describes what they do.


    # TABLE 11.1 Qt Layout Managers


    | Layout Manager | Description |

    |---|---|

    | QLayout | This is the layout manager base class. All the other layout managers
    inherit this class. If you want to create a custom layout manager, it should be
    based on QLayout. |

    | QGridLayout | This layout manager should be used when you want to arrange your
    widgets in a grid. |

    | QBoxLayout | This is the base class for QHBoxLayout and QVBoxLayout. It should
    only be used for simple cases where you can''t decide whether the widgets should
    be placed in rows or columns |

    | QHBoxLayout | This is used when you want to arrange widgets in a row |

    | QVBoxLayout | This is used when you want to arrange widgets in a column |


    The first class listed in the above table is the base class for the other four.
    You will rarely need to use this class, since you can solve most (not to say all)
    layout problems by mixing QGridLayout, QBoxLayout, QHBoxLayout and QVBoxLayout
    an example of how these layout managers can be mixed to achieve more complex layouts
    can be found in Listing 11.5.


    # Arranging Widgets in Rows and Columns


    In the examples "Understanding Layout Managers" section, the two QPushButton widgets
    were arranged in a column. In the first example, the buttons were placed by hand.
    In the second example, the QVBoxLayout layout manager was used. The source code
    for Figure 11.1 is shown in Listing 11.6.'
