  md: 'KDE classes, you follow the various KDE standards and make your applications
    fit in the KDE software family. To get a better view of what KDE actually is and
    what you can expect from the KDE standard, see Figure 17.1, which shows a basic
    KDE desktop.


    **Figure 17.1**

    A standard KDE

    desktop.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_293_0.png)


    In Figure 17.1, you see the KDE panel at the bottom of the screen, from which
    you can start all the KDE programs and change which virtual desktop you want to
    work with. At the top of the screen is the taskbar, similar to the one in Windows
    95 and 98. In the center of the screen, the KDE file manager is running.


    This hour and the next will give you a good introduction to KDE programming. These
    hours discuss the differences between pure Qt programming and KDE programming,
    and they provide a few KDE programming examples.


    # Learning the KDE Programming Basics


    The first thing you need to do is to learn the basics of KDE programming. In this
    section, you''ll create a very simple KDE program. This section discusses the
    KDE classes you''ll build this program on and compares the program to a regular
    Qt application.'
