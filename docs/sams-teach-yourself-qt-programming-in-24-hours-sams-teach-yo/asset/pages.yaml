    # Drawing a Slice of a Circle


    To draw just a piece of a circle, you should use the QPainter::drawPie() function.
    Here''s an example:


    ```

    paint->setPen( QPen(green, 4, QPen::SolidLine ) );npaint->drawPie( 20, 20, 210,
    160, 0, 500 );

    ```


    The first four arguments define the circle (just as with drawEllipse()). The last
    two arguments define the style of the circle. The circle 0 is the starting angle
    (actually one-sixteenth of a degree) and 500 (also one-sixteenth of a degree)
    is the arc length of the pie slice. If you''re not familiar with trigonometry,
    you might find this hard to understand. If so, you should test a few different
    values. Before long, you''ll understand how it works. Figure 9.8 shows this program.'
