    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_265_0.png)


    If you don''t understand the difference between stepping and running a movie,
    here''s an explanation: When you run a movie, the frames are changing all the
    time, and the objects are moving smoothly. On the other hand, if you call the
    QMovie::step() function, the movie will only change one frame and then stop (as
    if it were a picture). You could say running a movie is the same thing as calling
    QMovie::step() an unlimited number of times.


    QMovie also includes a few functions for determining the current state of an animation.
    These functions are described in Table 15.2.


    # TABLE 15.2 Functions for Determining the State of an Animation


    | Function | Description |

    | --- | --- |

    | QMovie::steps() | After you''ve called step() to advance the animation a given
    number of steps, you can use this function to get the number of remaining steps.
    ø is true if the animation is paused. |

    | QMovie::paused() | This function returns TRUE if the animation is currently
    paused. |

    | QMovie::finished() | This function returns TRUE if the animation is stopped
    and finished (that is, all loops of frames are complete). |

    | QMovie::running() | Returns TRUE if the animation is running. Note that if an
    animation is single-stepping, it''s not "running.\ |

    | QMovie::speed() | Returns the current speed as a percentage. |


    By using the functions described in Table 15.1 and Table 15.2, you have full control
    over any GIF animation from within your Qt program. One two animations can make
    any boring program look much more exciting. A good example of this is the little
    Netscape movie running at the upper-right corner of all Netscape windows.'
