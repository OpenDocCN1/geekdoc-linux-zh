- img_proc: true
  md: '# Making Things Happen: Slots and Signals


    signals to them. Every time a signal connected to a particular slot is emitted,
    the slot (function) is executed. Therefore, when you create your own slots in
    Hour 8, "Getting to Know the Qt Widgets: Lesson Three" you’ll actually use member
    functions.


    Many classes already include a few predefined slots you can use in your programs.
    A good example of this is the clicked() function included in the QPushButton class.


    So, slots are actually normal functions. Therefore, they can be called just like
    other functions.


    # Understanding Signals


    Signals are also member functions. However, they’re implemented in a slightly
    different way (that is described in "Getting to Know the Meta Object Compiler"
    later in this hour).


    When something happens inside an object (that is, its internal state changes),
    it can send a signal (although it doesn’t have to). If this signal is connected
    to a slot, that slot (function) is executed. You can connect multiple slots to
    the same signals; the slots are executed one by one, in an arbitrary order.


    So, slots are a special type of function. They’re defined to be emitted when certain
    events occur. Then, any connected slots are executed.


    # Using the Predefined Signals and Slots


    In the last hour, "Learning the Qt Basics," you used signals and slots when you
    implemented a Qt button in your program. You connected the button’s signal clicked()
    to the slot quit() on qApp. By doing this, you made the program execute the slot
    (function) quit() whenever the signal clicked() is emitted.


    Of course, there are many other signals and slots included with Qt, and there
    are an infinite number of ways you can use them. This section will give you a
    good introduction to the predefined slots and signals. It will also show you some
    ways in which they can be used.


    # Example 1: QSlider and LCDNumber


    Slots and signals can be used to create more exciting items than Exit buttons.
    Although the next example is not fancy, it’s definitely more interesting than
    the Quit button from the last hour. Listing 4.1 will give you some idea of how
    slots and signals are used.


