  md: '# Q&A


    +   Q I’m working with one of the widgets described in this hour. It’s not visible
    or partly visible. What’s wrong?


    +   A This is a common problem among beginning Qt programmers. However, the solution
    is as simple as the problem itself. You see, all widgets are a rectangular form,
    although they do not always appear to be rectangular. Therefore, a widget often
    takes more space than it appears to. When one or more of your widgets doesn''t
    appear on screen or if of them are hidden, the problem is most likely that some
    widgets are covered by other widgets (widgets) that look like they’re taking up
    space than they actually do.


    +   Q I a lot of error messages from my compiler when I’m trying to compile Listing
    7.5. What’s wrong?


    +   A You have to split this code into one .cpp file and one h-file (header file).
    You also have to use the Meta Object Compiler. You need to do this to make your
    custom slots work. See Hour 4, “Making Things Happen: Slots and Signals,” for
    a more detailed slot description.


    +   Q When would I need to use the QSpinBox::setSpecialValue() function? Can you
    give me an example?


    +   A If you’re implementing a function in your new word processor that lets the
    user change the size of the font, the QSpinBox::setSpecialValue() can be very
    useful. As you know, the size of the font cannot be 0. However, it’s possible
    that the user won’t think about this and try to set the size to the smallest value.
    At point, if you didn’t use the setSpecialValue() function, the user would have
    set the font size to 0, which would cause some very strange problems. On the other
    hand, if you use the setSpecialValue() function and set the text to something
    like Must be 1 or more, the problem would most likely not occur.


