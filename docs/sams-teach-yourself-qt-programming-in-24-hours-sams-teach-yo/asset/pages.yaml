    +   1. When should the qDebug() function be used?

    qDebug() function informs you about a certain program event (that is, when a certain
    event occurs).


    +   2. When should the qWarning() function be used?

    TheWarning() function informs you that something unexpected has occurred in the
    program.


    +   3. When should you use the qFatal() function?

    qFatal() function is used when a rather serious error occurs in the program and
    it therefore needs to exit.


    +   4. What does the ASSERT() macro do?

    TheERT() macro can be used to inform you when a Boolean value is not what it should
