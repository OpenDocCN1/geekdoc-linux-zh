  md: '# Creating Netscape Plug-Ins


    ```

    # cp npwin.cpp $QTDIR/extensions/nsplugin/src

    # cd ../include

    # cp * $QTDIR/extensions/nsplugin/src

    ```


    After this is done, you can delete the PluginSDK30b5 directory—you won''t need
    any-more.


    # Compiling the Qt Netscape Plug-In Extension


    By default, the plug-extension of Qt is not compiled—you need to do that manually.
    However, you can''t compile it the files you copied in the last section. This
    is not hard to do. Use cd to change the current directory to $QTDIR/extensions/nsplugin/
    and run make from there, as follows:


    ```

    # make

    ```


    You''ll see the following output:


    ```

    g++ -c I-/usr/local/qt/include -I/usr/X11R6/include -pipe -O2 -fPIC

    -o qnp.o qnp.cpp

    /usr/local/qt/bin ../../../include/qnp.h -o moc_qnp.cpp

    g++ -c I-/usr/local/qt/include -I/usr/X11R6/include -pipe -O2 -fPIC

    -o moc_qnp.o moc_qnp.o

    rm -f ../../../lib/libqnp.a ; ar qs ../../../lib/libqnp.a qnp.o moc.o

    ```


    This will create a static library called libqnp.a. Copy this file to $QTDIR/lib
    so that you don''t need to specify in which directory this library is located
    each time you compile your plug-in software.


    # Getting to Know Qt''s Netscape Plug-In Classes


    You need to get an understanding of how the Qt plug-in classes work. This section
    goes through each of them, discussing how and when they are used. Note that only
    the most critical member functions of each class are covered. You should take
    a look in the Qt Reference Documentation for information about the functions not
    mentioned here.


    # QNPPlugin: The Heart of the Plug-In


    QNPPlugin is the heart of the plug-in. There is never more than one object of
    this plug-in. For each of your plug-ins created with Qt, you need to create a
    subclass of QNPPlugin and reimplement a function that the browser calls to get
    various information about particular plug-in.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_340_0.png)'
