  md: '# HOUR 1


    # # Introduction to Qt


    This initial hour is an introduction to the Qt library. We''ll discuss the benefits
    of Qt—that is, what makes Gtk a better choice compared to other GUI design libraries
    such as Motif, Gtk+, wxWindows, and Xforms.


    You''ll also be taught how to use the Qt Reference Documentation. This is a very
    important information resource when working with Qt. Although this book tells
    you most of what you need to know about Qt, it doesn''t cover every single aspect
    of the library. Therefore, you''ll need to check with the Qt Reference Documentation
    every now and then.


    Finally, you''ll learn how to create, compile, and run a very simple Qt program.
    This is to give you an introduction to the actual programming development, which
    we''ll focus on after this first hour.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Choosing the Qt Library


    A GUI toolkit (or GUI library) is a set of buttons, scrollbars, menus, and many
    other objects that you can use to build graphical user interfaces (programs).
    On UNIX systems, there are many such GUI libraries available. One of these is
    the Qt library—a GUI toolkit based on the C++ programming language. Because Qt
    is on C++ (instead of C), it is fast, easy to use, and has good portability support,
    it''s the best choice when you want to create GUI programs for UNIX/ or MS Windows.


    # Portability


    Qt isn''t available for UNIX systems; it''s also available for MS Windows. If
    you''re a professional programmer (since you''re reading this book, I assume you''re
    not, but let''s pretend you create programs for a living, your goal must be to
    reach out to as many people so that they have a chance to buy/use your product).
    If your platform is MS Windows, you could probably use the standard library, the
    Microsoft Foundation Classes (MFC), quite happily. However, then you would miss
    millions of UNIX users around the world. On the other hand, if your main platform
    is UNIX, you could use any other toolkit, such as Gtk+ or Xforms. But then you
    would miss millions (if billions) of MS Windows users. Therefore, the best choice
    would be a GUI toolkit that''s for both MS Windows and UNIX, right? The answer
    is, course.


    # Ease of Use


    As stated earlier, Qt is a C++ toolkit. It consists of C++ classes, ready for
    you to implement in your programs. Because C++ is an object-oriented programming
    (OOP) language, and Qt is built on C++, Qt also has the advantages of OOP. You''ll
    learn more about OOP in Hour 2, "Object-Oriented Programming," of this book.


    If you''re not convinced that Qt is the best choice. Give the other toolkits a
    chance as well. Then you can decide which toolkit suits you best.


    # Speed of Operation


    Qt is very easy to use, but it''s also very fast. These two facts usually don''t
    mesh. When talking about other GUI toolkits, easy often means slow, and hard often
    means fast (or, from the other side, slow means easy, and fast means in hand).
    The credit for this goes to the hard-working Qt developers; they''ve spent a lot
    of time optimizing their product.


    Another thing that Qt faster than other GUI toolkits is how it is implemented.
    Qt is a GUI emulation toolkit. This means it doesn''t use any native-toolkit calls
    at. Qt emulates both MS Windows and Motif (the standard GUI library for commercial
    UNIX) look and feel by using the low-level drawing functions on the respective'
  merge: -1
  pgno: 29
- img_proc: true
  md: "# Introduction to Qt\n\nplatforms. This, of course, increases the speed of\
    \ the program. Other toolkits, such as wxWindows, that are also available on multiple\
    \ platforms use either API layering or API emulation. These methods use the native\
    \ toolkit in one way or the other and often make your program slower.\n\n# Installing\
    \ the Qt Library\n\nInstalling Qt is an easy process. This section describes how\
    \ to install Qt on UNIX/Linux systems. To install Qt on MS Windows, you must either\
    \ purchase a license from Troll Tech or use an evaluation version. More information\
    \ on how to do this can be found at www.troll.no.\n\n# Compiling and Installing\
    \ the Qt Source Distribution\n\nThe best course of action is to simply download\
    \ the latest version of Qt Free Edition (2.0.2 at the time of writing) from www.troll.no\
    \ and compile it yourself. By doing this, you make sure the library is correctly\
    \ installed and that version of Qt includes the latest features and improvements\
    \ from Troll Tech.\n\nYou'll find the distribution file at ftp.troll.no in the\
    \ /qt subdirectory. At this time of writing, the latest version is found at ftp.troll.no/source/qt-2.0.2.tar.gz\
    \ in size (about 4MB). When you download the distribution, make sure you get the\
    \ latest version (the one with the largest version number). Figure 1.1 shows a\
    \ Netscape window pointed at the ftp.troll.no file archive.\n\nFIGURE 1.1\n Netscape,\
    \ enter the address, as shown in the address field and hit Enter. Click the latest\
    \ distribution and select Save As...\n\n![](img/ed4f2be9f0799d95b6f041531c9a1f14_30_0.png)"
  merge: -1
  pgno: 30
- img_proc: true
  md: 'The download now starts. When the download window disappears from the screen,
    the download is complete, and you''re ready to install.


    Start by moving your newly downloaded file to /usr/local. Now, from /usr/local,
    execute the following command:


    ```

    # tar xvfz qt-2.0.2.tar.gz

    ```


    Be aware that when you read this, a newer version of Qt has most likely been released.
    This means that the filename probably doesn''t exactly match qt-2.0.2.tar.gz;
    it has probably changed to something such as qt-2.1.0.tar.gz or qt-2.1.1.tar.gz.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_31_0.png)


    This command will unpack the file into a subdirectory. The name of this directory
    depends on which version you''re installing. In this case, it''s /usr/local/qt-2.0.2.
    When all files have been unpacked, you can delete or move the distribution file:


    ```

    # cd /usr/local

    # rm qt-2.0.2.tar.gz

    ```


    In the next step, you have two options to choose from. You can move your /usr/local/qt-2.0.2
    directory to /usr/local/qt or create a symbolic link from /usr/local/qt, which
    points to /usr/local/qt-2.0.2. It really doesn''t matter which you choose to do.
    (I personally prefer a symbolic link so that I can easily see which version of
    Qt is installed.) Here''s how to create a symbolic link:


    ```

    # ln -s /usr/local/qt-2.0.2 /usr/local/qt

    ```


    To rename (move), launch the following command:

    # mv /usr/local/qt-2.0.2 /usr/local/qt


    Next, you need to define a few shell variables. The name depends on which shell
    you''re using. If you''re using bash, ksh, zsh, or sh you can do this globally
    (which will affect all users) from /etc/profile or individually (which will only
    affect yourself) from $HOME/.profile or $HOME/.bash_profile, depending on your
    Linux/Unix distribution ($HOME represent your home directory). After you''ve decided
    whether you want these variables to become global (a good choice if you want all
    users on the system to be able to use Qt) or individually, use the code found
    in Listing 1.1 to the corresponding file.'
