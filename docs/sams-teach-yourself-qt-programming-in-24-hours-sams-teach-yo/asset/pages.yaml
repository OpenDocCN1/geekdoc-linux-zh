  md: '# HOUR 2


    # Object-Oriented Programming


    Unless you''re totally new to programming, you''ve probably heard of object-oriented
    programming OOP. This is a programming method that makes many aspects of programming
    much easier. OOP presents many new programming ideas and is actually a whole new
    way of looking at programming. Although it''s based on the same "low-level" programming
    features (such as if, for, do, and while statements), OOP is a new way of programming.


    OOP uses classes to describe certain data forms. Classes are quite similar to
    C''s structures. However, classes can also hold functions and more specify how
    the class members (such as functions or variables) can be accessed. More about
    this later in this hour.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_46_0.png)'
