    This is where you define which class the new class will inherit (in this case,
    car). You use what is known among C++ programmers as public inheritance, which
    basically means what''s defined as public in the base class will also be in the
    new class, and what''s defined as private in the base class will be private in
    the new class. If you changed the public keyword to private, private inheritance
    would be used instead. Private inheritance makes all functions private in the
    new class, including the public functions. However, public inheritance is by far
    the most used inheritance method, including when you''re working with Qt.


