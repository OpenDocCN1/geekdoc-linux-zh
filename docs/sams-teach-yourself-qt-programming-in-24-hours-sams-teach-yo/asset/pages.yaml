  md: '# Summary


    Layout managers are a very important part of the Qt library. In many cases, using
    layout managers instead of manual layout can save you hours of work. You may think
    it''s easier to stick with your usual (and more time-consuming) methods of placing
    widgets, but you should give the layout managers a fair chance.


    Of course, this lesson hasn''t covered every single single aspect of layout managers.
    However, the Qt Reference Documentation does, and you should take a look, too,
    for additional information. You''ll find many helping functions that are not mentioned
    in this lesson.


    # Q&A


    +   Is there any difference in using a layout manager with Qt 2.x as opposed to
    Qt 1.4x?


    +   In fact there is. In the old 1.4 version of Qt, you had to make a call to
    QLayout::activate() to activate the layout manager.


    +   I''m making a very special layout. The layout managers simply can''t do what
    I want them to. What should I do?


    +   You have two options: You can create your own layout manager by creating a
    new class based on the QLayout class or you can reimplement the Widget::resizeEvent()
    function. Both these tasks are described in the Qt Reference Documentation.


    +   Which widgets can be controlled by layout managers?


    +   All Qt widgets can be controlled by layout managers. QPushButton widgets have
    mainly been used in this lesson for clarity reasons. Remember to use the right
    function when you insert the widget in the layout manager.


    # Workshop


    You''re encouraged to work through the following questions and exercises to help
    you retain what you''ve learned in this lesson. Completing these questions will
    help you sure you understand how layout managers work.


    # Quiz


    +   1. What is a layout manager?


    +   2. How can layout managers help you in your work?'
