  md: '# Creating a Queue with the QQueue Class


    In contrast to a stack, a queue inserts its elements on one side and retrieves
    them on the other. This way, you can retrieve the elements from the queue in the
    same order as you inserted them.


    So, if you decide to change the icon-widget example from the last section so that
    it removes the first item instead of the last when it needs to make room for a
    new one, you just need to change it to use QQueue instead of QStack. This would
    make the list work as a real queue: first in also gets first.


    Listing 14.2 is very similar to Listing 14.1, it uses QQueue instead of QStack.
    The result of this is that the elements will be presented in the right order (as
    they were inserted)


    # Listing 14.2 Creating a Queue with QQueue


    ```

    1: #include <application.h>

    2: #include <widget.h>

    3: #include <multilineedit.h>

    4: #include <qqueue.h>

    5:

    6: void main(int argc, char **argv)

    7: {

    8:   QApplication a(argc, argv);

    9:   QWidget w;

    10:  w.resize(150, 150);

    11:  a.setMainWindow(&w);

    12:

    13:  QMultilineEdit edit(&w);

    14:  edit.setGeometry(10, 10, 130, 130);

    15:

    16:  typedef QQueue<char*> StringQueue;

    17:  StringQueue stringqueue;

    18:  stringqueue.enqueue("Element 1 ");

    19:  stringqueue.enqueue("Element 2 ");

    20:  stringqueue.enqueue("Element 3 ");

    21:

    22:  while(stringqueue.current())

    23:  {

    24:    edit.insertLine(stringqueue.dequeue());

    25:  }

    26:

    27:  w.show();

    28:  a.exec();

    29: }

    ```'
