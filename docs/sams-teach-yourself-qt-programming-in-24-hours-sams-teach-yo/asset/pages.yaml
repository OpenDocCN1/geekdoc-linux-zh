  md: '# # The Sams Teach Yourself in 24 Hours Series


    The Sams Teach Yourself in 24 Hours provides quick and easy answers in a proven
    step-by-step approach that works for you. In 24 lessons of one hour or less, you
    will tackle every task you need to get the results you want. Let our experienced
    authors provide the most accurate information to get reliable answers—fast!


    # ## Useful Qt Classes


    Qt consists of a large set of classes. To fully master the library, you should
    be aware of which classes come with Qt and what Qt has to offer. The following
    table presents the most frequently used Qt classes and describes what they do.
    Use this as a reference whenever you''re looking for a class that can perform
    a particular task for you.


    | Class | Description |

    | --- | --- |

    | QAction | Handles shortcuts. |

    | QLayout | Layout manager that lays out widgets horizontally or vertically. |

    | QPushButton | For organizing buttons. |

    | QStyle | For creating widgets with CDE style. |

    | QChar | Stores unique characters. |

    | QCheckBox | For creating a check box with a label. |

    | QClipboard | Provides access to the system clipboard. |

    | QColor | Represents an RGB color. |

    | QColorDialog | Provides a dialog for selecting colors. |

    | QComboBox | Provides a combo-box. |

    | QString | Provides a string of the classic C character array* |

    | QCursor | Provides a mouse pointer with a custom shape. |

    | QDate | For working with dates. |

    | QDateTime | For working with combined date and time values. |

    | QDialog | The base class for creating custom dialogs. |

    | QDir | For traversing or working with a directory. |

    | QDoubleValidator | A validator for validating floating point numbers |

    | QDragEnterEvent | Event sent when an object is dragged over. |

    | QDragLeaveEvent | The event sent when a drag-and-drop object leaves it. |

    | QDragEvent | The event sent during a drag-and-drop. |

    | QDragObject | Represents the object dragged in a drag-and-drop event. |

    | QDropEvent | Event sent when the drag-and-drop object is dropped on a widget.
    |

    | QFile | For working with a file. |

    | QFileDialog | Provides a dialog for selecting a file. |

    | QFont | Represents a font that can be used for drawing. |

    | QFontDialog | Provides a dialog for selecting a font. |

    | QFileInfo | Provides general information about a font. |

    | QGLContext | Encapsulates an OpenGL rendering context. |

    | QGLFormat | Specifies the display format of an OpenGL display context |

    | QGridLayout | For laying out widgets in a grid. |

    | QGroupBox | Provides a group box with a title. |

    | QHBoxLayout | Lays out widgets horizontally. |

    | QPushButton | Organizes buttons. |

    | QHeader | Provides a table header. |

    | QImage | Represents an image that operations can be performed on. |

    | QDrag | Provides a drag-and-drop object for images. |

    | QImage | Provides functions for loading and saving images. |

    | QKeyEvent | Represents a key event. |

    | QLabel | For displaying a static text |

    | QLineNumber | Presents numbers in LCD-like digits. |

    | QLineEdit | A single-line text-entry field |


