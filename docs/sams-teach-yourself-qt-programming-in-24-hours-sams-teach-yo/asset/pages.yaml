  md: '# 8 HOUR

    Getting to Know the Qt Widgets: Lesson Three


    This is the last lesson of this section. In this hour, you''ll learn a few new
    types of widgets. As usual, this hour will by no means cover all aspects of the
    classes and functions mentioned. That''s why the Qt Reference Documentation is
    very important when you''re learning Qt (as a reference, that is).


    There are three new widgets you''ll learn to use in this hour: text-entry fields,
    list views, and progress bars. Text-entry fields are widgets that can handle text
    input from users. A list view is a very interesting widget that you can use to
    present data effectively. Progress bars are widgets that inform a user of the
    state of a task that''s performed by the program. These widgets are considered
    basic widgets, so you''ll most likely need them (sooner or later) in your programs.


