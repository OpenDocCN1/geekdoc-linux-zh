  md: '# 4 HOUR


    # Making Things Happen:

    Slots and Signals


    The way Qt makes the widgets interact with the user differentiates Qt from other
    GUI toolkits. This user interaction is what GUI applications are all about. By
    connecting certain user events (for example, a button click) to certain program
    events (for example, when the program exits), users can control the program graphically
    and often by using only the mouse.


    In other toolkits, callback functions creates the user interaction. However, callback
    functions can become quite complicated, confusing, and hard to understand (at
    least most Qt people think so). Therefore, the Qt developers have worked out an
    alternate method for performing such tasks. This method depends on two Qt-specific
    functions: signals and slots. With this new method, you can connect a user event
    with a program event with one single line of code.'
