  md: '![](img/ed4f2be9f0799d95b6f041531c9a1f14_354_0.png)


    # HOUR 21


    # # Internationalizing Your Qt Programs


    One of the things you can do to make your Qt programs easier to use for a wider
    range of people is to make them available in other languages. Although many people
    speak English as a second language, they’ll usually find it easier to fully understand
    your programs in their native languages. If English isn’t your native language,
    you know how frustrating it can be to find one or two words in a program that
    you do not understand.


    Fortunately, Qt comes with an extensive collection of tools and functions for
    making the internationalization of your programs easier. This not only includes
    language translation but also character encoding, input techniques, and presentation
    conventions.'
