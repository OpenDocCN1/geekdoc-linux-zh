  md: '# TABLE 21.2 Useful QtMember Functions


    | Function | Description |

    | --- | --- |

    | QTime::hour() | Returns an integer representing the current hour (1–23). |

    | QTime::minute() | Returns an integer representing the current minute (0–59).
    |

    | QTime::second() | Returns an integer representing the current second (0–59).
    |

    | QTime::msec() | Returns an integer representing milliseconds (0–999). This is
    not useful when you just want to display the current time. A possible use would
    be if you need to measure an amount of time very precisely. |

    | QTime::addSecs() | Takes an integer as an argument and adds this to seconds
    of the time. The new time is then returned. |

    | QTime::secTo() | Takes a QTime object as an argument and returns QTime object
    representing the time between the argument''s and the time of this object. |

    | QTime::addMSec() | Takes an integer as an argument that represents the number
    of milliseconds you to add to the time. The new time is returned as a QTime object.
    |

    | QTime::msecTo() | Takes a QTime object as an argument and returns QTime object
    representing the time between the argument''s and the time of this object. |

    | QTime::start() | If you want to use a QTime object as a timer, you start the
    timer by calling QTime::elapsed(function) and then restart the timer with the
    QTime::restart(function). |


    QTime is a very useful class. Actually, it''s used a lot in non-Qt programs because
    of its simplicity. It is recommended that you use it, whether you want to show
    the current time or measure how long a certain task takes.


