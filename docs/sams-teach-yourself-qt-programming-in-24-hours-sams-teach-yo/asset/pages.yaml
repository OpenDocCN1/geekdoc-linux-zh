    \ simply test various functions to see what happens. Keep in mind, though, empirical\
    \ learning is the best way of learning, and testing can be really fun!\n\n# Q&A\n\
    \n+   - Recompiling Qt is really time consuming! Isn't there any way I can speed\
    \ up this process?\n\n+   - You can't speed up the actual compilation. If you're\
    \ on short space, you can leave the .o files on your hard drive after you've compiled\
    \ Qt the first time. Then, if you need to recompile Qt to add GIF support, for\
    \ example), this process will be much faster. .o files are deleted when you run\
    \ make clean. So, if you have enough space, just skip this.\n\n+   - I'm trying\
    \ to run a GIF animation that changes size during the animation. How can I make\
    \ the QLabel object resize as the animation resizes?\n\n+   - This is easy. First,\
    \ create a slot that resizes the label:\n```cpp\nvoid MainWindow::resizeLabel(const\
    \ QSize &size)\n{\n    label->resize(size);\n}\n```\n\n+   - Then, tell the animation\
    \ about this slot with the following function call:\nmovie->connectResize(this,\
    \ SLOT( resizeLabel(const QSize& ) ) );\n\n+   - Now, the label will resize whenever\
    \ the animation resizes."
