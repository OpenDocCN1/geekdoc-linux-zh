    # Using the QValidator Class


    The other predefined validator comes with Qt is the QValidator class. As mentioned
    previously, this class should be used to validate integers, in contrast to QDoubleValidator,
    which is used for validating floating-point numbers. You use QValidator almost
    exactly like QDoubleValidator. The only difference is that you leave the constructor
    representing the maximum number of decimal places. After all, QValidator only
    works with integers.


    You can change Listing 13 to use a QValidator object instead of changing all QDoubleValidator
    instances to QValidator. Then, simply delete the second argument to the QValidator
    constructor and change first and second arguments from double values to int values.
    Doing this will transform Listing 13.1 into a validator instead of floating-point
    numbers.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_240_1.png)


    # Creating a Custom Validator


    While the predefined validator classes are great for validating floating-point
    numbers and integers, you will most likely need to validate other things (such
    as characters or mixtures of numbers). For example, for validating an email address.
    This is what you''ll learn in this section.'
