    # Using the Clipboard


    You can easily implement Clipboard functionality in your Qt application. Actually,
    some Qt classes with predefined Clipboard functions that are ready to use.


    # Using the Clipboard for Text


    In most cases, the Clipboard is used to move or copy text. Fortunately, the QLineEdit
    and QMultiEdit classes include this functionality by default; it is activated
