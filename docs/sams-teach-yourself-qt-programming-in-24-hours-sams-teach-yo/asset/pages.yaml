    # Getting to Know the QPainter Drawing Functions


    QPainter provides many more functions for drawing text and rectangles. In this
    section, some other interesting drawing functions are covered (although not all
    of them). See the QPainter section of the Qt Reference Documentation for complete
    coverage of QPainter''s member functions.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_170_4.png)


    > Remember that the code examples in the following sections will always be inserted
    between the function calls to begin() and end() in the paintEvent() function.


    # Drawing Circles and Ellipses


    For drawing circles and ellipses with QPainter, you should use the drawEllipse()
    function. It takes four integers. The first and second arguments represent the
    number of pixels between the circle/ellipse and the left and upper sides of the
    window. The third and fourth arguments represent the width and height of the circle/ellipse.
    Take a look at the following example:


    ```

    paint->setPen(QPainter::blue, 4, QPainter::SolidLine );

    paint->drawEllipse( 20, 20, 210, 160 );

    ```


    The result of this code is shown in Figure 9.6.'
