    You''ve completed your first tmake-generated file. As stated in the beginning
    of this section, the two HTML documents tmake.html and tmake-ref.htm in the doc-directory
    of your tmake installation hold a complete user''s guide and some reference documentation,
    respectively. You should check them out for further information about tmake.


    # Using progen for Generating Project Files


    If you''re on a large Qt project with many files, it can be cumbersome to list
    all the files manually in a project file. Unfortunately, Troll Tech has a tool
    that solves this; it''s called progen (Project Generator). progen, like is a Perl
    script, and it''s included in the tmake distribution. If you''re on UNIX and didn''t
    add the /usr/local/qt/tmake/bin directory to your PATH variable, you''ll probably
    want to make a symbolic link to progen in /usr/bin/bin, just as you did with tmake.
    Here''s how:


    ```

    # ln -s /usr/local/qt/tmake/bin/progen /usr/bin/progen

    ```


    This way, you can execute progen from anywhere on your file system without entering
    the full path to it.'
