    4: int main(int argc, char **argv)

    5: {

    6:   KApplication a(argc, argv);

    7:

    8:   KMainWindow *w = new KMainWindow();

    9:   w->resize(200, 100);

    10:  a.setWidget(w);

    11:  w->show();

    12:

    13:  return a.exec();

    14: }

    ```'
