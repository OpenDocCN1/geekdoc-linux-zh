  md: 'the appropriate arguments. For example, to execute the command is -als /, you
    should implement the following code:


    ```

    KProcess p;

    p << "ls" << "-als" << "";np.start(DontCare, KProcess::Stdout);

    ```


    Here, you tell the KProcess object p to execute the command with the arguments
    -als and /. Then, the execution is started with the KProcess::start() function.
    This function takes zero to two arguments (both have default values).


    The first argument is an enum value that represents what relation your program
    will have to this subprocess. In this case, it is defined as DontCare, which makes
    the program not care about when the subprocess is finished. The others are NotifyOnExit
    and Block. NotifyOnExit is the default. If this is used, the signal KProcess::processExited()
    will be emitted when the subprocess is finished. If you select Block, your program
    will get blocked until the subprocess is finished. In most cases, this is not
    what you want.


    The second argument is also an enum value. This represents what kind of communication
    you want between your program and the subprocess. In example, the choice is to
    only communicate with stdout of the subprocess. You have six choices here: NoCommunication,
    Stdin, Stdout, Stderr, Allout, and All. The default is NoCommunication.


    If you select some kind of communication, you can get information from stdout
    and stderr by connecting to the signals KProcess::receivedStderr() and KProcess::receivedStdin().
    You can also write data to the subprocess''s stdin with KProcess::writeStdin().
    See the library reference or the kprocess.h file for more information.


    You should also take a look at the KShellProcess class, which is related to KProcess.
    KShellProcess is used to execute child processes through a UNIX/Linux shell.


