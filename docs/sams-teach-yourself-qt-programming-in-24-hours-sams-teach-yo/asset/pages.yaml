    # Summary


    Both text-entry fields and progress bars are quite straightforward widgets, and
    it''s clear what you should use them for. On the other hand, this is not the case
    at all with list views. The QListView class is so powerful and complex. You''ll
    need to study it in depth to have full control over it—and with control, you''ll
    discover totally new ways of using a list view. QListView is an exciting class
    (if you a C++ class can be exciting). Even if you find it hard to understand at
    first, just give it a try!


    You''ve now learned about the Qt widgets. You have learned to use all of Qt''s
    widgets. By studying this section, you have also gotten an understanding of how
    the widgets work and what they can be used for. The Qt widgets make a complete
    set of graphical objects that will be enough to build any kind of GUI.


    # Q&A


    +   Listing 8.3, why do I need to show() for the QMessageBox object? This isn''t
    done for any of the other objects.


    +   This is because the QMessageBox object (box) is not a child of the MyMainWindow
    class. Therefore, the call to MyMainWindow::show() in main does not affect box.


    +   I get a lot of error messages from my compiler when I''m trying to compile
    Listing 8.3. What''s wrong?


    +   You have split your code into one .cpp file and one .h file (header file).
    You also have to use the Meta Object Compiler (MOC) on the .h file and include
    the output from MOC in the .cpp file. You need to do this to make your custom
    slots work. See Hour 4, “Making Things Happen: Slots and Signals,” for a more
    detailed description.


    # Workshop


    As usual, you''re encouraged to work through the following questions and quiz.
    By doing this you make sure you''ve understood everything described in this hour.
    What''s more, you might learn something that you previously thought was unclear.'
