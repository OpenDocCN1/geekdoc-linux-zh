  md: '# About the Author


    DANIEL SOLIN is the president of Solin Linux Consulting (www.solin.org), a consulting
    firm specializing in Linux business solutions, web solutions, and graphical interfaces.
    Whenever he has some spare time, he also works as a C/C++ teacher, trying hard
    to convince his local youngsters the advantages of Object-Oriented programming.
    However, since he has been working for Macmillan USA, almost half a year, Daniel
    has forced his other projects to step aside (happily, that is).


    He has also been involved in a few other Macmillan USA projects: Slackware Linux
    Unleashed, Calder OpenLinux Unleashed, and Debian Linux Unleashed. However, he
    has always been a dedicated Slackware fan, so he was most involved in the Slackware
    title.


    Daniel first got in touch with Linux in 1994. At that time, he was running on
    an ancient version of the UNIX clone Minix on his home PC, and felt directly in
    love with this Finnish product called Linux. After a few years of happily running
    on Linux, Daniel heard about the GUI library, Qt. He downloaded, compiled, installed,
    and fell in love once again. One of his first Q projects was Tarman, a graphical
    interface for managing Slackware''s tgz packages. A simple but useful little program.
    So, to see a GUI program from the old days (the 20th century), point your browser
    to www.solin.org/tarman.


    Oh, I almost forgot. Daniel actually fell in love a third time (this time, it
    was for real). That was when he met his lovely Linda, who lives with in Ludvika,
    Sweden. Daniel can be reached at daniel@solin.org.'
