    # Managing Images with the KPixmap Class


    This class is, of course, very similar to QPixmap class: However, it adds two
    functional features to the standard QPixmap: WebColor and LowColor. These two
    color modes are most useful on 256-color displays.


    In WebColor mode, all images are (yes, always) ded to the Netscape palette. In
    other words, applications can use the Netscape palette, fewer colors will be allocated,
    and there will be more free cells. WebColor is the default color mode for KPixmap.


    In LowColor mode, images are checked against the KDE icon palette to see whether
    they match their color table. If they don''t match, the image will be diminished
    to a 3x3x3 color cell. By using the LowColor mode for background images, desktop
    icons, and so, you make sure that the objects always visible on the desktop do
    not use more than 40 colors.


    To load a KPixmap object with image, you should use the KPixmap::load() function.
    However, use the kpixmap.h file or the library reference for more information.


