    days you want to add to the QDateTime object. The new QDateTime object is returned
    |

    | QDateTime::addSecs() | Takes an integer argument representing the number of
    seconds you want to add to the QDateTime object. The new QDateTime object is returned
    |

    | QDateTime::daysTo() | Takes a QDate object as an argument and returns an integer
    representing the number of days between the argument and the QDateTime object.
    |

    | QDateTime::secsTo() | Same as the previous function, but this works instead
    of days. |


    You should have enough information to cover all your needs regarding date and
    time values. However, you should note that all three classes covered in this section
    have constructors that can be used to set the date and/or the time of the objects
    in addition to the member functions. QTime''s constructor can take two to four
    integer arguments, hour, minute, second, and millisecond. However, the last two
    arguments have default values, so they can be skipped. QDateTime''s constructor
    takes three integer arguments, representing the year, the month, and the day.
    QDateTime has two overloaded constructors. One of them takes a QDate object as
    an argument and the other one takes a QTime object as arguments, Which you choose
    depends on whether you want to set just the date or both the date and the time.


