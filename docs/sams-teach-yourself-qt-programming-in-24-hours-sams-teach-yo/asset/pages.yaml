    # Working with Colors


    To make your applications look good, you need to know how to manage the colors
    you want to use. Because of all the different types of hardware, managing colors
    can be tricky. However, Qt makes this task a bit easier for you.


    # Managing Colors


    When choosing colors for your applications, keep in mind that there will be many
    users of your applications who can''t access more than 256 colors at a time (8-bit'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Creating Simple Graphics


    color depth). Therefore, you should try not to allocate too many custom colors
    and also try to use colors already allocated by other applications. By doing this,
    you leave color cells free (each color takes one color cell).


    Of course, it''s impossible for you to know which colors are already in use and
    which are not. However, you should make it practice to use the Qt predefined colors—black,
    white, red, green, blue, cyan, yellow, magenta, gray, darkGray, lightGray, darkRed,
    darkGreen, darkBlue, darkCyan, darkMagenta, darkYellow, color0 and color1. These
    colors are most likely alike in use.


    > color0 and color1 are special colors for drawing in two-color bitmaps; they''re
    guaranteed to contrast well.


    One thing you can avoid by taking up too many colors is to use a color pattern
    (a given set of colors). You can set a color pattern with QApplication::setColorSpec()
    . Here are a few standard arguments you can pass to this:


    +   * QApplication::Normal. This is the default. You should use this if your application
    mainly uses standard colors.

    * QApplication::ManyColors. This should be used if your application will use a
    lot of colors. A special method (which makes your application more color friendly
    for other applications) is used to determine which color will actually be allocated.
    This option only applies to UNIX systems.

    * QApplication::CustomColors. This applies only to Microsoft Windows systems.
    It''s a function that gives more colors to the active application and fewer colors
    to the applications in the background. If you''ve ever used Windows set 256 colors,
    you''ve probably seen how applications tend to get strange colors when they''re
    inactive. That''s caused by this method.


    > You must call the QApplication::setColorSpec() function before you create the
    QApplication object!


    # Specifying Colors


    You have three ways of specifying a color in Qt: using the RGB (Red/Green/Blue)
    model, the HSV (Hue/Saturation/Value) model, or named colors.'
