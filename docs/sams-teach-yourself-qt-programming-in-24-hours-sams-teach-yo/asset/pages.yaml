  md: '# Quiz Answers


    +   3. What is a MIME type?

    MIME provides a way of giving a file or stream of data a special type so that
    the browser knows how to deal with it.


    +   4. Suppose you''ve created a plug-in for showing BMP images. You open a document
    with many BMP images in it. How many QNPPlugin objects are created?

    Just one. Always only one.


    +   5. In the scenario of question 3. how many QNPInstance objects are created?

    One for each BMP image.


