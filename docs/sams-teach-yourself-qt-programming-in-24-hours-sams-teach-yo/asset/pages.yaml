  md: '# Summary


    Regardless of whether you''re developing Qt programs professionally or just for
    fun, you''ll probably want as many people as possible to use and take advantage
    of your soft-ware. If you''re selling your programs for money, the reason to strive
    for portability is quite obvious (more users means more money). Also, as a free-source
    programmer, it feels good to know that many people can use the software you''ve
    worked so long and create


    Qt is, by nature, very portable, so you don''t need to do anything special in
    order to keep it that way. However, you should be aware of those special cases
    in which there are some dif-fences between the Windows and UNIX implementations.
    Many of these differences you''ll most likely never experience. However, if a
    problem does occur, it''s good to understand the problem so that you can easily
    create a workaround. This rarely takes more than one or two lines of code.


    Many Qt programmers claim they can''t live without make, and chances are that
    once you get it, you''ll feel the same way. To fully understand the greatness
    of make, you need to start a large project that consists of at least 200 source
    and header files. Then, you need to make the software available on at least five
    UNIX platforms as for Microsoft Windows. Also, during the development you should
    write all your makefiles by hand, for each subdirectory of your source tree and
    one version for each platform. Well, you get the picture—creating all the makefiles
    would take almost as long as writing the code! On the other hand, you could start
    using make and progen right away.


    # Q&A


    +   When trying to execute make or progen. I get a message stating that perl can''t
    be found. What''s wrong?


    +   You probably don''t have perl installed. Install it from your distribution
    or down-load it from www.perl.com.


    +   The make utility doesn''t work for me. It just says that it can''t find a
    file called make.conf!


    +   This happens if the TMPATH variable is not set correctly. Make sure you''ve
    added it to one of your startup files and then log out and log again. Alternatively,
    you can use the source utility. If you''re using bash, remember that you have
    to export the variable with the export keyword. If you''re using any of the C
    shells, remember to use the setenv keyword.'
