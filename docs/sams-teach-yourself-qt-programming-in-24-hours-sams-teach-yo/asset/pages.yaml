  md: '# FIGURE 11.4

    QGridLayout is used to place out six buttons in a grid.


    | Listing 11.3 | |

    | Button 1 | Button 4 |

    |---|---|

    | Button 2 | Button 5 |

    | Button 3 | Button 6 |


    Now, the QGridLayout class is used to control the buttons. The syntax for creating
    and using this class is slightly different from QHBoxLayout and QVBoxLayout. To
    begin with, three arguments are given to the QGridLayout constructor instead of
    one. This is done on this line:


    ```

    QGridLayout *grid = new QGridLayout(this, 3, 2 );

    ```


    The first argument, is as a pointer to the uncreated MyWidget object. However,
    the second and third arguments are new to you. The second argument, indicates
    how many rows the grid should have. The third argument, how many columns the grid
    should have. In this case, there should be three rows and two columns.


    Just as with QVBoxLayout and QHBoxLayout, the QLayout::addWidget() function is
    used to add the widgets (buttons, in this case) as you can see, two arguments
    are also added here. In addition to the pointer being given as the first argument,
    QLayout::addWidget() is told in which row and column to insert the button. Take
    a look at the following line:


    ```

    grid->addWidget(bi, 0, 0 );

    ```


    Here, an object (bi) is inserted into the first column of the grid. This represents
    the upper-left button in Figure 11.4. Therefore, the example from Listing 11.3
    gives you (0, 1) represents button 4, (2, 1) represents button 6, and so on. Figure
    11.5 gives you a better view of this.


    Now you know how to create grids of widgets with QGridLayout. For more information
    about this, see the Qt Reference Documentation, in the section earlier in this
    hour.

    “Understanding Layout Managers.”'
