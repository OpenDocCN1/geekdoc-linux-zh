    # Summary


    In this hour, you''ve learned how to work with buttons, including push buttons,
    radio buttons, and check buttons. A button is likely to be the widget you use
    often in your programs; therefore, the section on buttons is an important one.
    When you think about, a GUI program would not be much if it didn''t have any buttons.


    Next, you learned how to implement text and numerical labels. You also learned
    that, by far, the most used class for labels is QLabel. However, you also looked
    at QNumber class, which you can use to present numerical information. Labels,
    like buttons, are basic to all GUI libraries.


    Finally, you learned how to work with tables. You should make it point to expand
    upon what you learned in this hour to see how you implement tables with Qt. This
    hour has presented the basics. Remember, QTableView requires you to do a lot of
    the work yourself. As stated, it''s quite an abstract class and therefore needs
    some work to make it useful. However, this is good because it lets you decide
    exactly what should be done and which features should be included.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_130_1.png)


    # Q&A


    +   - The label I add to my radio or check button is not visible or only partially
    visible. What''s wrong?

    - Make sure there''s enough room for the label. Maybe the text is behind some
    other label.'
