  md: '# # Introduction


    How people use computers has changed dramatically through the years. What began
    with cryptic commands on a black screen has in the last 10 years developed into
    a more or less completely graphic-based environment, where the keyboard plays
    a less important role. Not many people even consider using a text-based program
    these days. Therefore, graphical user interfaces are required to create successful
    programs for today''s users.


    This book will teach you how to create easy-to-use graphical programs in a step-by-step
    manner, from the most basic features, to the more advanced ones. The 24 lessons
    in this book are filled with logical explanations, examples, and instructions
    that make learning Qt programming easy.


    There are a few so-called toolkits you can use to create graphical programs in
    Linux. However, the one you will learn to use in this book, Qt, is one of the
    more popular ones. Because of Qt''s Object-Oriented hierarchy, its good structure,
    its well-developed widgets, and the fact that it includes many other functions
    than just for creating graphical interfaces, makes it a good choice for beginners
    as well as experts. Qt is also the toolkit used by the well-known desktop environment,
    KDE, and is therefore, along with the Gtk+ toolkit, forming a standard for graphical
    programs in Linux. Qt''s advantage over Gtk+ is, however, the fact that it''s
    not just available for UNIX/Linux, but also for Microsoft Windows. This means
    that a Qt program written in Linux is actually a valid Microsoft Windows program
    as well!


    By reading this book, you''ll be amazed how easy it can be develop graphical programs
    for both Microsoft Windows and Linux/UNIX at the same time!'
