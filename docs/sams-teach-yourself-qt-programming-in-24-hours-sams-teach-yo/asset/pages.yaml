    # # Implementing Drag-and-Drop Features


    As stated earlier, the drag-and-drop feature is considered to be more user friendly
    than the Clipboard. However, drag and drop also has a downside: it''s complicated
    to implement. Fortunately, implementing drag and drop is not hard at that with
    Qt.


    In fact, the QLineEdit comes with drag-and-drop features by default. You can test
    this with this Listing 16.1. Enter some text in one of the fields, highlight the
    text with your mouse button, and then click and hold the left mouse button while
    drag over to the right field. Release the left mouse button and the text will
    be copied from the left to the right field. It''s as simple as that!


    However, unless you''re satisfied with the drag-and-drop features provided, you
    need to learn how to implement custom drag-and-drop functions. Therefore, pretend
    that the drag-and-drop features provided with the QLineEdit class don''t exist
    (as was the case in Qt 1.4x) and you need to implement these functions yourself.
    Listing 16.3 shows you how to implement this functionality. When you fully understand
    Listing 16.3, you will have no problems implementing another (more complex) drag-and-drop
    features.


