  md: '# Internationalizing Your Qt Programs


    Like findtr, the msg2qm utility can be found in the $QTDIR/bin directory. It takes
    two command-line arguments: the PO file you want to work with, and the name of
    the file you want to store the output in (that is, the binary database file).
    So, to create a binary database file of the 21st01_se.po file you created in the
    previous section, you would issue the following command:


    ```

    # msg2qm 21st01_se.po 21st01_se.qm

    ```


    This creates the file 21st01_se.qm, which you can then use in your program to
    retrieve translations from.


    # Merging Changes with the mergetr


    As you develop a program, it is very possible that its text will change. It''s
    easy to update the original PO file with findtr, you also need to edit the changed
    entries in all your other language-specific PO files. If you''ve made translations
    for a lot of languages, this can be a time-consuming task to do by hand.


    Fortunately, the mergetr utility is a great help for this. Simply searches the
    original (and updated) PO file for changes and then edits the other PO file accordingly.
    For example, it''s very possible that the line numbers change as your program
    gets larger. Because of this, the line numbers in the PO files won''t be correct
    anymore. mergetr fixes this for you.


    To use mergetr for updating your PO files, you will need to update the original
    PO file, like this:


    ```

    # findtr *.cpp *.h MyClass.po

    ```


    MyClass.po will now contain the updated information. Then, you can use mergetr
    to update all your language-specific PO files as well. Here is an example:


    ```

    # mergetr MyClass_fr.po MyClass.po

    ```


    This updates the MyClass_fr.po file. If any line numbers were changed, they would
    be updated. If any translations were deleted, they would be commented out (using
    # signs) in MyClass_se.po. If any entries were added, they would be added to MyClass_se.po
    as well.


    Keep in mind, that if you change a translation (for example, you decide to remove
    the colon in Password:); findtr will interpret this as a new entry, it''s an old,
    changed entry. This also applies to mergetr: if it finds an entry in the original
    PO file that doesn''t exactly match one of the old entries, it will interpret
    this as a new entry (and new entries have empty translation strings, so you need
    to insert them again). Because mergetr won''t find a match for the old entry,
    it will be commented out (in the language-specific PO file).


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_360_0.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Implementing a Translation Function in Your Program


    So, mergtr updates the line numbers automatically, it deletes (or comments out)
    any entries that are not used anymore, and if there are any new entries in the
    original PO file, they will be automatically added to the language-specific PO
    file as well. However, it interprets changed translation entries as new entries.


    After the binary translation files are created and ready to use, it''s time to
    tell your program to use them; this is not done automatically. However, the QTranslator
    class makes this process really simple. Here are the steps you need to take:


    +   1. Create a QTranslator object.

    2. Tell the QTranslator object which binary translation file to use (which you''ve
    created with the msgqt utility).

    3. Tell the Q_OBJECT object about your new translator.

    4. Implement a call to the Q_OBJECT macro in the class declaration and use moc
    header file.


    Start creating a QTranslator object. Then tell it which binary translation file
    to use and tell the QApplication object that a translator is available. You also
    need to include the file qtranslator.h to get access to the QTranslator class,
    as follows:

    #include <qtranslator.h>


    ```

    QTranslator translator(this);

    transl.load("21st01_se.qm", "*");

    App->installTranslator(&translator);

    ```


    The first line creates a QTranslator object (translator) and sets its parent to
    the this pointer (a pointer to an unnamed object of the currently defined class).
    On the second line, the Qt::load() function is called to tell the QTranslator
    object which binary translation file to use. The first argument given to this
    function is the name of the binary translation file, and the second argument defines
    which directory the program should search for. In this case, the current directory
    (.) will be searched. On the third line, the QApplication::installTranslator()
    function is called to tell the QApplication object about this translator. The
    memory address to translator is passed as an argument.


    Because the translation function.tr() is implemented by moc, you also need to
    make a call to the Q_OBJECT macro and create a MOC file of the class declaration
    (and, always, include the MOC file in the CPP file).'
