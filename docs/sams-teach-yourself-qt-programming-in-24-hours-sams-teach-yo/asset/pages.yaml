- img_proc: true
  md: '# Appendix A


    5. When can you call the connect() function without specifying in which class''s
    defined?


    When you make the call from a member function of a class derived from QObject
    or one of its subclasses.


    6. Is it possible to disconnect a connected slot from a signal?


    Yes, this is possible. Just use the QObject::disconnect() function.


    7. What does it mean to leave out the name of the object holding the slot in a
    call to the connect() function?


    That means that the slot is defined in the current class (that is, that class''s
    currently defined). Therefore, this kind of call can only be made from within
    member function of the class slot.


    8. Is it possible to connect a signal to another signal? If so, how?


    Yes, this is possible. You just use the connect() function as usual, as shown
    in the following:


    ```

    connect(button, SIGNAL(clicked )), this, SIGNAL(anothersignal() ));

    ```


