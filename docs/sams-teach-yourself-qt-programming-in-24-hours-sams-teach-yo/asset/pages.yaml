    # Understanding Nested Layout Managers


    If you''re familiar with C programming (or any other programming language, for
    that matter), you may have used the existing features of the language to achieve
    some other feature. For example, nested if statements are very usual in C. Basically,
    you put if statements inside other statements, and in this you get much better
    control over the program. Nesting can also be useful when working with layout
    managers.


    For example, suppose you want to change the program in Listing 11.3 so that the
    left column has three rows but the right column only two. By using nested layout
    managers, it''s quite easy to achieve this.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_210_0.png)


    > Of course, you could also easily do this by placing the widgets by hand. But
    then you wouldn''t get the layout manager features.


    Listing 11.4 shows a solution to this problem, and Figure 11.6 shows the graphical
    result.


