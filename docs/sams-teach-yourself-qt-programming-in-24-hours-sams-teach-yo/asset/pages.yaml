    KProcess is a class designed for starting a subprocess from within a KDE program.
    By using KProcess, you don''t have to worry about the quite complex process used
    on UNIX/Linux systems.


    KProcess defines the << operator for inserting commands and arguments to these
    commands. To start the execution, the KProcess::start() function should be called,
