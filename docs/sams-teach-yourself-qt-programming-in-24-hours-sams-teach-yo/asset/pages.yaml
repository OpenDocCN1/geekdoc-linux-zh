    | QFileInfo::permission() | With this function, you can test whether an item has
    a specific attribute. For example, QFileInfo::permission would test whether the
    item is writable by the owner (user). If this is the case, QFileInfo::permission()
    will return TRUE (See Reference Documentation for more information.). |

    | QFileInfo::size() | Returns the size of the item (most likely a file). |

    | QFileInfo::lastModified() | Returns a QDateTime object with the date and time
    the item was last modified. |

    | QFileInfo::lastRead() | Returns a QDateTime object with the date and time the
    item was last read. |


    QFileInfo is a great invention; it can get any information you want about a file,
    like its size and it''s permissions, when it was last read, its owner and so on.
    What''s more, like all Qt classes, it''s ridiculously easy to use.'
