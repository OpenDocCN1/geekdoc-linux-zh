  md: '# Reading Files Using Qt Classes


    In this lesson, you''ll learn how to use the hard drive (also known as secondary
    memory) to store and read information. In other words, you''ll learn how to work
    with files and directories. This is an important issue that will come into play
    when you don''t want your information to disappear after you exit your application/or
    turn off your computer.


    It''s possible that you''ve worked with files and directories from a C program
    before, and if you have, you''ve most likely used the file and directory functions
    for your operating system. However, if you do this, your program won''t be portable
    at all; it will be hard to use on platforms other than yours. On the other hand,
    if you use Qt classes, your program will work on all other Qt platforms. What''s
    more, even if portability is not (and never is going to be) an important issue
    for you, using Qt classes making working with files and directories easier.


    Maybe the simplest file operation you can perform is to read a file. For example,
    if you want to show a help file to the user, it''s more convenient to store this
    help in a file rather than implementing the entire text in the program.


    You''ll look at an example of how this can be done. You''ll use Qt classes to
    open the file README with the Qt distribution, create a text stream to it, and
    then show it in a QtLineEdit object. Listing 12.1 shows an example of how this
    can be done.


