  md: '# The RGB Model


    RGB is the most common method for specifying colors, and you''ve most likely heard
    about it before. With RGB, you specify colors with three integer values—one for
    each of the colors red, green, and blue. The higher value you specify for one
    of the three colors, the more the result will be dominated by that color. Each
    value must be an integer between 0 and 255. For example, (0, 0, 0) represents
    black, and (255, 255, 255) represents white.


    To allocate a color using RGB with Qt, you create a QColor object and pass the
    RGB values as arguments to its constructor. Here''s an example:


    ```

    QColor myBlack( 0, 0, 0 );

    ```


    This makes the QColor object black. If you want a pure red color, use this:


    ```

    QColor myRed( 255, 0, 0 );

    ```


    # The HSV Model


    The HSV (Hue Saturation Value) model is another way of defining a color. HSV splits
    a color into its hue, saturation, and value. Which values you can specify differs
    bit. However, in Qt, the hue can be any integer between -1 and 360, and the saturation
    and value can be any integer from 0 to 255.


    You can use HSV with QColor as well. Just add the argument QColor::HSV to the
    QColor constructor. Here''s an example:


    ```

    QColor hColor( 150, 73, 213, QColor::HSV );

    ```


    # Named Colors


    All X11 (Unix) systems have a database that maps color to RGB values. By using
    named colors, the chance of picking a color already in use is much greater, and
    you''ll avoid some color cells as well. Named colors can also be used with QColor.
    Here''s an example:


    ```

    QColor inBlue( "SteelBlue" );

    ```


    > Qt also provides this color database on Windows systems.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_175_0.png)


    # Changing the Standard Palette


    If you don''t like the standard color palette, you can define a custom one. A
    palette consists of three color groups: active (used when the application has
    focus), disabled'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Creating Simple Graphics


    (used when the application is not available to the user), and normal (used for
    all other purposes). Each color group consists of a number of colors that should
    be used for a cer-tain of the application.


    Therefore, if you want to create a palette of your own, you need to create three
    color groups. You do this with the `QColorGroup` class, and you pass the colors
    as arguments to the `QColorGroup` constructor. (See the Reference Documentation
    for a description of these arguments.) Next, you create a `QPalette` object and
    pass the three color groups as arguments to the `QPalette` constructor. Again,
    see the Reference for more information about this.


    # Printing Graphics with Qt


    Printing graphics from Qt is an easy task. The `QPainter` class is used for printing
    and because this is a subclass of `QPaintDevice` (like `QWidget`), you can draw
    with `QPainter` "on" the `QPrinter` object. Everything you draw will be printed!
    The only thing you actually have to control is when a new page is needed. You
    do this by calling the `QPrinter::newPage()` function.


    However, you might want to let the user change the print settings. The Print dialog
    appears if you call the `QPrinter::getPrinter()` function. This dialog is shown
    in Figure 9.12.


    FIGURE 9.12


    The Qt Print dialog.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_176_0.png)'
