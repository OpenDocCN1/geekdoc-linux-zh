  md: '# Internationalizing Your Qt Programs


    Of course, most people don''t have the knowledge to translate their programs into
    more two, maybe three, languages. However, by using English as the default language
    in your program and creating a translation file out of the source code, you can
    send this file to someone who knows the language you want to translate your program
    and have him or her fill in the blanks in the translation file and send it back
    to you. Also, many of the standard terms used in a program can most likely be
    found in some other program translated into your desired language.


    You should also consider which languages you''re actually going to translate your
    program into. Start with the most widespread languages, such as English, German,
    French, Spanish, Chinese, and Japanese. Of course, you should also consider what
    people would appreciate the most.


    There''s not much to say about the date and time values that Qt''s date and time
    classes are exceptionally well made and easy to use. They save you a lot of work
    compared to the standard date and time functions defined in time.


    # Q&A


    +   Q My program refuses to use the translation file I just created. What can
    be wrong?


    +   A Many things. However, the most likely problem is that you''ve forgotten
    to run the Q_OBJECT macro and use moc in the class declaration. Some other things
    that could include forgetting to create a binary translation file with the msq2
    utility and making changes to the program and then forgetting to update the translation
    file(s).


    +   Q Is there any way I can search the translation file for a particular entry?


    +   A Yes, this is very easy to do with the QTranslator::find( ) function. It
    takes two strings as arguments. The first represent of the scope (usually the
    name of the class in which this translation should be made) and the second represents
    the key (the string that should be translated).


    +   Q When working with the current time, will the time automatically change to
    the local time of the area where the program is started?


    +   A Yes, this depends on the computer system''s clock. Therefore, if it''s set
    to your local time, QTime will get the local time when QTime::getCurrent() is
    called. This means that if your system''s clock is set wrong, QTime::getCurrent()
    will also return the wrong time.


