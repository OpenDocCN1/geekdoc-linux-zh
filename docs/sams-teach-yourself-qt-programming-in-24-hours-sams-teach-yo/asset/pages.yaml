    In the directory-configuration menu, look for Show Directories For select Include
    Files from this menu. In the middle, you now see a big area where all the directories
    are listed. Now, double-click below the last entry and c:\qt\include (if you installed
    Qt under c:\qt). Then, select Library Files from the same menu and add the directory
