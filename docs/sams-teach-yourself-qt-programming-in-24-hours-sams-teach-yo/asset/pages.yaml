  md: '# Quiz Answers


    7. There’s one certain virtual function that you can use to fix strings that are
    almost acceptable. What function is it?


    The fixup() function.


    # Quiz Answers for Hour 14


    +   1. When should you use the QStack container class?

    When you want to create a list of elements and retrieve them in reverse order.

    2. When should you use the QQueue container class?

    When you want to create a list of elements and retrieve them in the same order
    as you inserted them.

    3. What is a hash table?

    A hash table is a list of elements in which every element can be accessed through
    a string key or an integer key.

    4. Which class would you use if you want to create a hash table with integer keys
    instead of string keys?

    TheIntDict class.

    5. What is the QCache used for?

    It’s used to create a hash table that you can control the size of.

    6. What happens when the maximum total cost is reached in a cache?

    The element that’s least recently touched will be deleted.

    7. When are you required to use an iterator?

    When you want to traverse one of the dictionary classes (QDict, QIntDict, QCache,
    or QIntCache).


    # Quiz Answers for Hour 15


    +   1. What’s the first thing you need to do before you can show a GIF animation?

    You need to make sure you compiled Qt with GIF support.

    2. Is there any way you can speed up an animation?

    Yes, you can set the speed of the animation with the QMovie::set() function.

    3. Is there any way you can get the current speed of an animation?

    Yes, by calling the QMovie::speed() function.'
