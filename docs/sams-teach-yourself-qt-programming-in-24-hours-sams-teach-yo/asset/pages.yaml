  md: 'When you want to declare a signal to be connected to another signal, just change
    the third argument of the connect() function, as shown in the following:


    ```

    connect(button, SIGNAL( clicked() ), this, SIGNAL( othersignal() ) );

    ```


    Now, every time the clicked() signal of button is emitted, it will appear that
    the othersignal() signal of the currently-defined class is emitted, If you then
    connect the othersignal() signal to some slot, that slot (function) will be executed
    every time clicked() is emitted.


    # Disconnecting Slots and Signals


    It''s possible that you''ll find it necessary to disconnect a signal from a slot
    (or a signal from a) at some point. This is good to do when you want to disable
    a function in your program for a while. To accomplish this, you use the QObject::disconnect
    function. It expects the exact same parameters as QObject::connect. For example,
    if you want to disconnect a clicked() signal from a Quit slot, you use the following
    line of code:


    ```

    disconnect(button, SIGNAL( clicked() ), qAPP, SLOT( quit() ) );

    ```


    If you implement this line in one of the examples that contain a Quit button,
    you won''t be able to terminate the program through the button anymore.


    # Saving Keystrokes When Using the connect() Function


    The connect() function has a feature that can save you a few keystrokes. If you''re
    connecting a signal to a slot of the class that you''re currently defining (in
    a method of that class), you can leave out the object that holds the slot. For
    example, consider the following example of a method of a class based on QWidget:


    ```

    QWidget::MyWidget()

    // Some code here (including the

    // definition of button1);

    ```


    ```

    //And then the call to connect():nconnect(button, SIGNAL( clicked() ), SLOT( clearFocus()
    );

    ```


    In this example, the third argument is left out. The connect() function will then
    default to the currently-defined object. However, although this method can save
    you a few keystrokes, it''s not advisable that you use it because your code becomes
    harder to understand. Although I don''t recommend that you use this feature, you
    should be aware of it because you might see someone else''s code that incorporates
    this shortcut.'
