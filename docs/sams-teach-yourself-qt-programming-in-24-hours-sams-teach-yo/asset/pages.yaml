    \nWhen the predefined dialogs aren't enough for you, you need to create custom\
    \ ones—ndialogs that are especially designed to meet your needs. Qt comes with\
    \ a couple classes\n make the creation of dialogs easier: QDialog (the base class\
    \ for all dialogs)\nand QDialog (for creating tab dialogs).\n\n# Creating Custom\
    \ Dialogs with QDialog\n\nQDialog is the base class—all other dialog classes are\
    \ based on it. It provides you\na a few basic functions for creating dialogs.\n\
    \nWhen creating dialogs, you have two types to select: modal dialogs and modeless\n\
    dialogs. A modal dialog starts its own event loop, and by doing this blocks the\
    \ rest of the\nprogram until the dialog is closed. A modeless dialog, on the other,\
    \ doesn't\nblock the rest of the application. You control whether your dialog\
    \ should be modal or\nmodeless by passing a boolean value as the third argument\
    \ to the QDialog constructor.\nReturn true for modal, and false for modeless.\n\
    \nNow, you'll look at a few important functions for working with QDialog.\nDialog::setWindowTitle()\
    \ is used to set the caption of the dialog window.\nThe functions Dialog::accept(),\
    \ Dialog::reject(), and QDialog::done() all destroy the\ndialog and return a value.\
    \ Accept() returns the constant QDialog::Accepted (1), and\nReject() returns the\
    \ constant QDialog::Rejected (0). You can also define your own\nreturn value by\
    \ passing the value (integer) as an argument to the done() function. In\nfact,\
    \ you can make calls to done(1) and done(0) instead of using accept() and\nreject();\
    \ to get the same result.\n\nAnother interesting feature of QDialog is that you\
    \ don't have to usesetGeometry() or\nresize() to define the size for the window.\
