    # Using The QMainWindow Widget


    Through the years of GUI development, programmers have worked out a standard look
    and feel for graphical applications. This standard mostly applies to Microsoft
    platforms, but lately it has also been used more on UNIX platforms as well. You''ll
    want to create applications following this standard to make it easier for users
    to use your applications. A great help doing this is the QMainWindow class. It''s
    a class that enables you to add toolbars and menus easily, and it makes the look
    and feel of these toolbars and menus more standard. If you want to create standard
    applications, QMainWindow will save you a lot of work.


    # Adding Menus, Buttons, and a Central Widget


    You''ll start by looking at a sample program on QMainWindow (see Listing 5.5).
    This program is a virtual text editor Although it doesn''t actually do anything,
    it looks like a real text editor, with menus, a toolbar, and a large text entry
    field. This example shows how easily you can create a professional look and feel
    for your program.'
