    # Installing RPM Packages


    If you''re using an RPM-based (RedHat Package Manager) Linux distribution, such
    as RedHat, SuSE, OpenLinux, Qt is most likely included in the distribution as
    a binary package. To check whether Qt is already installed on your system, issue
    the following command at a prompt or an xtterm window:


    ```

    # rpm -q qt

    ```


    If this command lists two packages—one similar to qt-<version> and similar to
    qt-dev-<version>—you''re all set. If the command lists only the qt-<version> package
    age, you need to install the Qt development package from your distribution CD.
    If neither of the packages is listed, you need to install both from your distribution
    CD. To do that, use cd to go to the directory containing your distribution rpms
    and execute the following command:


    ```

