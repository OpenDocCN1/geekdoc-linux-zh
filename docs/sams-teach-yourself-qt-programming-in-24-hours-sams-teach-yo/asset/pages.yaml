- img_proc: true
  md: "# Understanding the newStreamCreated() Function\n\nQNInstance::newStreamCreated()\
    \ is used by the browser to tell the plug-in that data is available for it. With\
    \ this function, you can also tell the browser whether you want the data as a\
    \ file or a stream. QInstance::newStreamCreated() returns TRUE if the data is\
    \ accepted. Here's a sample implementation:\n\n```\nbool newStreamCreated( QStream*,\
    \ StreamMode &mode )\n{\n    smode = AsFileOnly;\n    return TRUE;\n}\n```\n\n\
    In this example, the plug-in accepts the data and tells the browser that it wants\
    \ the data in a file. In this case, because the browser is told to provide the\
    \ data as a file, QInstance::streamAsFile() function will be called later. This\
    \ function includes the code that processes the data in the file.\n\nIf you set\
    \ to any of the other three values you choose from (Normal, Seek, or AsFile),\
    \ it's possible that the data will be received as a stream. Then, the browser\
    \ would have to call QInstance::ready(), to inquire about the minimum amount of\
    \ data is wishing to receive from the stream, and QInstance::write(), which should\
    \ take care of the actual processing (or call the appropriate function or functions\
    \ that will take care of the processing).\n\nThe code in QInstance::streamAsFile(),\
    \ QInstance::ready(), and QInstance::write() varies a lot depending on what type\
    \ of data you are processing. Therefore, this section won't cover any sample implementations\
    \ of these functions. However, the Qt Reference Documentation includes some interesting\
    \ information about them.\n\n# QWidget: Creating the Visual Part of the PlugIn\n\
    \nYour subclass of QWidget should include the event and drawing code for the plug-in.\
    \ QWidget is a subclass of QWidget and should be considered equal to any other\
    \ widget. Actually, the code in this class is just regular Qt programming code\
    \ (and you don't need an example of that, do you?)\n\n# QStream: Receiving Data\
    \ Streams from the Browser\n\nA subclass of QStream should only be implemented\
    \ if you're using streams of files to receive data. QStream is an abstraction\
    \ of a data stream and is used by QInstance::ready() and QInstance::write() functions\
    \ to stream data. However, the implementation of this class also varies a lot\
    \ depending on the kind of data"
