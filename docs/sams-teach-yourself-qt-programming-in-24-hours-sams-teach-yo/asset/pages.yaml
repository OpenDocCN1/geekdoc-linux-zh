  md: '# LISTING 6.6 A Simple Grid Created with QTableView


    ```

    1: #include <application.h>

    2: #include <widget.h>

    3: #include <tableview.h>

    4: #include <qpainter.h>

    5:

    6: class MyMainWindow : public QTableView

    7: {

    8: public:

    9:     MyMainWindow();

    10: private:

    11:     void paintCell(QPainter *, int, int int

    12: );

    13: };

    14: MyMainWindow::MyMainWindow()

    15: {

    16:     setGeometry(100, 100, 300, 300);

    17:     //Set the number of columns

    18:     setNumCols(6);

    19:     //Set the number of rows

    20:     setNumRows(10);

    21:     //Set the width of the cells

    22:     CellWidth(50);

    23:     //Set the height of the cells:

    24:     cellHeight(30);

    25: }

    26:

    27: //Here is the simple implementation of paintCell()

    28: void MyMainWindow::paintCell(QPainter *p, int row, int col)

    29: {

    30:     //Find out height and width of the cells:

    31:     int x = cellWidth(col);

    32:     int y = cellHeight(row);

    33:

    34:     //Two lines are enough for creating a cell:

    35:     p->drawLine(x, 0, x, y);

    36:     p->drawLine(0, y, x, y);

    37: }

    38:

    39:

    40: void main(int argc, char **argv)

    41: {

    42:     QApplication a(argc, argv);

    43:     MyMainWindow w;

    44:     a.setWidget(&w);

    45:     w.show();

