    they are sent to the debugger. you''ll probably want to remove the calls to debug()
    in the final version of your program, so this will rarely be a problem |

    | QApplication::flushX() | On X11 systems (UNIX), a call to this function will
    flush the X event queue. it does nothing on Windows |

    | QApplication::setColorSpec() | The functionality of this function depends on
    whether it is called on UNIX or Windows. This is described in the "Working with
    Colors" section of Hour 9,"Creating Simple Graphics."

    | QApplication::setDoubleClickInterval() | With this function, you can set the
    maximum amount of time in milliseconds that can elapse between two mouse clicks
    and still interpret this action as a double click. In Windows, this sets the double
