  md: '# Summary


    Developing Netscape plug-ins with Qt can make many aspects of plug-in easier.
    By choosing Qt over the standard API provided by the Netscape Plugin SDK, you
    also save yourself a lot of time. The API provided by the Netscape Plugin SDK
    is quite complicated and difficult to use. By now, it should be clear to you that
    this is not the case with Qt.


    You''ll find three interesting examples of plug-ins in the extensions/nsplugin/examples
    directory of Qt installation. Perhaps the most useful of the three is the qtimage
    plug-in. It extends Netscape''s capabilities to show any of the image formats
    supported by Qt. You are encouraged to take a look at the source code for this
    plug-in. It shows how easily you can create a useful plug-in with Qt.


    When you create a Netscape plug-in, you''ll find it hard to debug through Netscape.
    Therefore, you should make a regular Qt program of the plug-in first; then, when
    it''s tested and ready to use, you can convert it into a plug-in very easily.


    # Q&A


    +   Q When I''m trying to link with libqnp, my compiler says it can''t find any
    library with that name. What''s wrong?


    +   A probably forgot to copy the library from SQTDIR/extensions/nsplugin/src
    to SQTDIR/lib. The library will not be found if you don''t that.


    +   Q executing the command that makes the shared object, my compiler says it
    can''t find one of the libraries it was told to link with. What''s wrong?


    +   A it possible that you have the library in a directory that isn''t searched
    by the compiler. Try to find the library manually (with find or locate). If you
    find it, the compiler to search in that directory using the -l option. If you
    can''t find the library, removing it from the linking list and see whether the
    plug-in works anyway. If it doesn''t work, try to install the library from your
    distribution or search for it on www.freshmeat.net.


    +   Q compiling the qtimage plug-in, the compiler says it can''t find the qimgio
    library. Where do I find that library?


    +   A this library can be found in the extensions directory of your Qt installation.
    It''s not compiled and installed by default—you have to do that manually.'
