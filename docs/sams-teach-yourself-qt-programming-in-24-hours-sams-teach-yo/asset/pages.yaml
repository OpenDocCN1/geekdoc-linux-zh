    The browser uses ::newWindow() function to get a new QNPWidget object (actually,
    a subclass of QNPWidget).


    +   7. When does the browser call the QNPInstance::newStreamCreated() function?

    The QNPInstance::newStreamCreated() function is called when the browser has some
    data to feed the plug-in with.


    +   8. What kind of code should you find in a subclass of QNPWidget?

    Regular Qt code.


    +   9. When do you need to create a subclass of QNPStream?

    When you want your plug-in to receive data through a stream.


    +   10. What is the <embed> HTML tag used for?

    The <embed> tag is used to embed a plug-in into an HTML document.


