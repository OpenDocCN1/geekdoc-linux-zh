  md: "# Using the QPainter Class\n\nAs stated, QPainter is the class for creating\
    \ custom graphics with Qt. It's very straightforward and not difficult to use.\
    \ You'll start this QPainter section by learning how to create a QPainter object\
    \ and draw a simple rectangle.\n\n# Getting Started with QPainter\n\nFor creating\
    \ custom graphics with QPainter, you need to take a few precautions to ensure\
    \ that you don't interfere with the drawing handled by Qt. What you need to do\
    \ is to place the drawing code in a special function called drawEvent(), as well\
    \ as start and stop the painting by calling the QPainter::begin() and QPainter::end()\
    \ functions. Listing 9.1 provides a simple example.\n\n# 9.1 Drawing a Simple\
    \ Rectangle\n\n```\n1: #include <application.h>\n2: #include <widget.h>\n3: #include\
    \ <painter.h>\n4:\n5: class MainWindow : public QWidget\n6: {\n7: public:\n8:\n\
    \   MainWindow();\n9: private:\n10:  void paintEvent(QEvent *);\n11:  QPainter\
    \ *paint;\n12: };\n13:\n14: //Here is our implementation of paintEvent():\n15:\
    \ void MainWindow::paintEvent(QEvent *)\n16: {\n17:   paint = new QPainter();\n\
    18:   //Start the painting:\n19:   paint->begin(this);\n20:   //Draw a rectangle:\n\
    21:   paint->drawRect(20, 20, 160, 160);\n22:   //End the painting:\n23:   paint->end();\n\
    24: }\n25:\n26: MainWindow::MainWindow()\n27: {\n   setGeometry(100, 100, 200,\
    \ 200);\n29: }\n30:\n31: void main(int argc, char **argv)\n```"
