  md: '# Summary


    At this point, you know what benefits Qt has to offer, to install it, and how
    to write a very simple program. Also, you''ve learned how to compile a Qt program.
    Actually, the compilation process is pretty much the same no matter how big and
    complex your program is, so follow this procedure to compile all your programs
    from now. However, the larger the project will become, the more files there will
    be to compile. And later you will also be introduced to a tool called MOC that
    often needs to be used. You''ve also been introduced to the Qt Reference Documentation;
    make sure you understand how to use it and why you use it.


    It''s very important that you fully understand everything in this first hour so
    that you have all the basic knowledge required to follow the upcoming hours. The
    next hour will introduce you to object-oriented programming. After you work yourself
    through that hour, you can start writing object-oriented Qt programs.


