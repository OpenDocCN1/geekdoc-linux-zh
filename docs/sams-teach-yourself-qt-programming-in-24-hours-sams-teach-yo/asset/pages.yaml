    | QApplication::setWindowTitle() | On UNIX systems, calling this function will
    also set the position and size of the window according to the geometry command-line
    option. This is not the case in Windows |

    | QApplication::syncX() | On UNIX systems, this function processes all outstanding
    events and flushes all queues. However, there''s no need to do this on Windows,
    so this function does nothing on that platform |'
