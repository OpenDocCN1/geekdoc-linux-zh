  md: '# HOUR 13


    # Processing Text and Understanding Regular Expressions


    If you want to retrieve some kind of information from a user, such as the user''s
    name or email address, you need some kind of function to validate the input. This
    function should make sure the user enters appropriate information. For example,
    it''s not desirable that the user enter his or her full name when you actually
    want is his or her email address.


    You need something that can validate the submitted text and ensure it''s the information
    that the program needs. Qt provides the Validator class for doing this. It''s
    an abstract class you can base new classes on and exactly define what''s valid
    information and what''s not. Validators can be used with QLineEdit, QSpinBox,
    and QComboBox.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_234_0.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'To make it easier to define what should be valid information, Qt includes a
    number of definitions for regular expressions in the QRegExp class. A regular
    expression provides a way of defining an unknown character or an unknown number
    of characters. By using regular expressions, the process of creating a new validator
    becomes much easier.


    In this lesson, you''ll learn to create validator functions using QValidator and
    QRegExp.


    # # Understanding Regular Expressions


    You''ll start this lesson by going through the regular expressions included in
    the QRegExp class which makes rather natural because the creation of validator
    classes more or less depends on regular expressions. If you''ve worked with regular
    expressions before some other programming language, such as Perl, you probably
    won''t find much in this section. However, for those of you who are totally new
    to regular expressions, this will be very useful.


    As stated, a regular expression is a character that represents one or more characters.
    You have probably seen the regular expression * that represents any character.
    A common use of this is to define file types. For example, *.txt means all the
    ends of files with .txt (text files). By using all the different regular expressions
    that come with Qt, it''s simple to create a validator that defines which strings
    are of interest to you and which not.


    Actually, there are two types of regular expression in Qt. First, there are the
    meta characters that represent one or more literal characters (depending on which
    meta character you''re talking about). The other type of regular expression is
    the escape sequence. In contrast to the meta character, escape sequences represent
    one particular character.


    # # Understanding the Meta Characters


    This discussion will begin with meta characters. You''ll likely find this type
    of regular expressions most useful. Table 13.1 lists and explains all the meta
    characters.


    Table 13.1 The Meta Characters


    | Regular Expression | Explanation |

    | --- | --- |

    | . | Matches any single character. For example, .3 could be 1, followed by any
    character, followed by 3. |

    | ^ | Matches the start of a string. For example, ^12 could be 123 but not 312.
    |

    | $ | Matches the end of the string. For example, 12$ could be 312 but not 123
    |'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Processing Text and Understanding Regular Expressions


    | Regular Expression | Explanation |

    | --- | --- |

    | [] | Matches any of the characters, you enter between the brackets. For example,
    [123] could be 1, 2, or 3. |

    | * | Matches any number of the preceding character. For example, 1*2 could be
    any number of 1''s (even none), followed by a 2. |

    | + | Matches at least one character of the preceding type. For example, 1+2 must
    be one or more 1''s followed by a 2. |

    | ? | Matches one or none of the characters of the preceding type. For example,
    1?2 could be 12 or 2. |


    The meta character can also be set to wildcard mode by making a call to QRegExp::setwildcard(
    TRUE ). When wildcard, only one of the meta characters are used, and their functions
    change a bit. This is described in Table 13.2.


    # 13.2 Meta Characters in Wildcard Mode


    | Regular Expression | Explanation |

    | --- | --- |

    | ? | Matches any single character. For example, ?2 could be a 1 followed by any
    single character, followed by a 2. |

    | * | Matches any sequence of characters. For example, 1*2 could be a 1 followed
    by any number of characters, followed by a 2. |

    | [] | Matches a defined set of characters. For example, [a-zA-z] matches any
    character (upper or lowercase) from a to z, and dot. [^a] everything except a.
    |


    If you''ve ever worked with regular expressions at a Linux/UNIX prompt, you''re
    probably more familiar with the meta characters in wildcard mode. Which one you
    select to work in is a matter of taste and what you''re needing to do.


    # Understanding the Escape Sequences


    The other type of regular expressions is called the escape sequences. These regular
    expressions are used to represent those characters that cannot be entered as usual,
    such as * and ?. A description of these expressions can be found in Table 13.3.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_236_0.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# ### TABLE 13.3 The Escape Sequences


    As you see, these expressions all start with a backslash (\). This is also how
    C++ represents certain characters. For example, the \ character should be typed
    as \\" in a C++ program. Therefore, to use one of the escape sequences defined
    in QRegExp, you will need to add another \ to tell the program you actually want
    "\" to be printed. Therefore, to match ".", you actually need to enter "\\.".


    # # Using the Predefined Validator Classes


    In this section, you''ll learn how to use the predefined validator classes

    DoubleValidator and QIntValidator. You can use these two classes to validate double
    and int values. You''ll go through two examples to see how to do this.


    # ## Using the QDoubleValidator Class


    The QDoubleValidator class can be used to verify floating-point numbers. For example,
    if you want the user to input a floating-point number between 1 and 2, you can
    use QDoubleValidator to make sure the number really is between 1 and 2, and nothing
    else. QDoubleValidator is very easy to use. See Listing 13.1 for an example.'
