  md: '# Portability


    This will create a subdirectory called tmake, with the whole tmake distribution
    in it.

    You''ll probably want to move this directory to /usr/local/qt or somewhere that
    suits you better. To execute tmake easily, you should make a symbolic link to
    /usr/local/qt/tmake/bin/tmake in a directory that''s included in your PATH variable,
    such as /usr/bin. Here''s an example:


    ```

    # ln -s /usr/local/qt/tmake/bin/tmake /usr/bin/tmake

    ```


    On Windows, you''ll probably want to add the c:\tmake directory to your path so
    you don''t have to enter the full path every time you use tmake.


    On both UNIX, you also have to set the TMAKEPATH variable, which should point
    to the directory where tmake templates for your system are located. The template
    files are a set of files that hold various information about your system. tmake
    uses these to generate a Makefile. Therefore, if you''re on UNIX, using the Bourne
    shell, and your compiler is g++, add the following lines to one of your startup
    files:


    ```

    TMAKEPATH=/usr/local/qt/tmake/lib/linux.g++

    export TMAKEPATH

    ```


    If you''re using C shell, here''s what you should use:


    ```

    setenv TMAKEPATH /usr/local/qt/tmake/lib/linux-g++

    ```


    If you''re using Windows and the Visual C++ compiler, you should preferably set
    the TMAKEPATH and PATH variables in autoexec.bat:


    ```

    set TMAKEPATH=c:\tmake\lib\win32-msvc

    set PATH=%PATH%;c:\tmake\bin

    ```


    For a complete list of platforms and compilers that have predefined template files,
    run dir in /lib directory of your tmake installation.


    When you''ve followed one of these steps to set the TMAKEPATH variable and installed
    the tmake distribution correctly, you''re all set.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_380_0.png)


    > Note that you add something to your startup files, such as /etc/profile, you
    always need to log out and then log again to activate your changes. If you don''t
    want to log out and log back in, you can use the source command on the file in
    question. Here''s an example:

    source /etc/profile

    This will read the file /etc/profile file and execute all the commands in it,
    including the line that sets the TMAKEPATH variable.'
