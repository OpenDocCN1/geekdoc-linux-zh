  md: '# Introduction to Qt


    pixels high. When you set the maximum and minimum sizes of the window to the same
    value, this means the window (mainwindow) cannot be resized.


    Line 13 creates a QPushButton object called helloworld. Also, a direct call is
    made to one of QPushButton''s constructors. The first argument tells the constructor
    to label the button "Hello World!". The second argument makes mainwindow the button''s
    parent widget. This means the button will be placed on mainwindow.


    Line 14 sets the geometry of helloworld. The first two arguments tell where the
    button''s upper-left corner is placed on the button''s parent widget (mainwindow).
    This is done relative to the upper-left corner of the parent widget. Therefore,
    in this case, the button''s upper-left corner will be placed 20 pixels to the
    left and 20 pixels relative to mainwidget''s upper-left corner. The last two arguments
    set the width and height of the button (in this case, 160 pixels by 60 pixels
    high). This sounds difficult? Relax, when you use it, nothing in the world will
    be more obvious to you.


    Line 16 tells the QApplication object to set the program''s main widget. When
    the main window is killed (closed), the entire program is finished. This is useful
    if you have a program of more than one window.


    Line 17 calls mainwindow''s show() function. As you have guessed, this mainwindow
    is to be shown on the screen. You don''t need to call helloworld''s show() function;
    this is because helloworld is automatically shown when show() is called for its
    parent widget (mainwindow).


    Line 18 takes the control over main() to Qt. Qt receives and processes user system
    events and passes these on to the appropriate widgets. exec() will return when
    the application is closed. Figure 1.2 shows the compiled result of Listing 1.3.


