  md: "After reading this section about custom signals and slot, you should have a\
    \ good understanding of how to create them and how they can be used. As stated\
    \ earlier, you will find many more examples of how custom slots can be used later\
    \ in this book, and you will learn more about them as you go through the other\
    \ hours.\n\n# # Interesting Features of Slots and Signals\n\nYou now basically\
    \ know how to work with signals and slots. However, there are still a few interesting\
    \ features that you might find useful when working with signals and slots, such\
    \ as disconnecting slots and connecting signals to signals. These features, and\
    \ a few other, will be covered in this section.\n\n# # Avoiding Unwanted Information\n\
    \nIn Listing 4.1, the slider was connected to the LCD display with the following\
    \ code:\n\n```\nconnect(slider, SIGNAL(valueChanged(int)),\n      lcd, SLOT(display(int)));\n\
    ```\n\nNote that both signal valueChanged() and the slot display() take an int\
    \ (integer) value as an argument. This basically means that the signal will notice\
    \ that the slider has been moved as well as tell the new value. This int value\
    \ is sent to the connected slot display() and is then handled to be shown on the\
    \ LCD display.\n\nHowever, sometimes a signal gives more information than the\
    \ slot you connected to take. A good example of this is when you want to know\
    \ when a toggle button is toggled, but you don't care whether it's toggled on\
    \ or off. In this case, you can just leave out the corresponding parameter in\
    \ the slot definition, as shown in the following (note that the receiving object\
    \ and its slot are made up; they do not exist):\n\n```\nconnect(togglebutton,\
    \ SIGNAL(toggle(bool)),\n      anotherobject, SLOT(aslot(int)));\n```\n\nYou should\
    \ use this method when you want to connect a signal to a slot and they't really\
    \ fit together.\n\n# # Connecting Signals to Signals\n\nSometimes, you might find\
    \ it necessary to connect a signal to another signal. Although this may sound\
    \ strange, it's completely possible to do. For example, you might want a certain\
    \ event to occur when you click a button—an event's easiest to start by calling\
    \ another signal. In this case, it's a good idea to connect the button's clicked()\
    \ signal to the signal that will start the event.\n\n![](img/ed4f2be9f0799d95b6f041531c9a1f14_88_0.png)"
