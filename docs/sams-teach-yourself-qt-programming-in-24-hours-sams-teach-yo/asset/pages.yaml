  md: 'As you can see, you just change the type between the angle brackets (< >).
    The name of the stack was also changed, but this, of course, is not required—you
    can call it whatever you like.


    It''s very possible that you haven''t even seen this use of angle brackets before.
    However, there''s nothing mysterious about it; it''s just C++s way of defining
    what type a container class should store. However, if you have worked with the
    STL (Standard Template Library), this is nothing new to you.


    Note that the stack will handle its elements as pointers by default. You don''t
    need to enter this:

    defef QStack<char*> StringStack

    The stack will store pointers anyway. If you use this line, pointers to pointers
    will be stored. This applies to all container classes except QArray and QByteArray.


    Just with all classes, you can create an object of this class using the following
    line:

    StringStack stringstack;


    Then you use the class''s member functions to insert elements into and retrieve
    elements from the stack. QStack::push() should be used to insert an item; QStack::pop()
    to retrieve an item (QStack also removes the item it retrieves from the list);
    and QStack::current() to get the current item without removing it. To remove an
    item from the stack without retrieving it, use the QStack::remove() function.
    Figure 14.1 shows the program created in Listing 14.1.


