  md: '# SAMS

    Teach Yourself

    Qt Programming

    in 24 Hours


    # Get Started Now!

    24 proven one-hour lessons


    In just 24 lessons of one hour or less, you will be up and programming graphical
    applications with the Qt library. Using a straightforward, step-by-step approach,
    each lesson builds upon the previous one, allowing you to learn the essentials
    of Qt programming from the ground up.


    # Learn how to...


    +   * Build graphical applications for Linux*/UNIX, as well as Microsoft Windows*.

    * Install the Qt library and write, compile, and run a Qt program.

    * Program with KDE.

    * Gain a basic understanding of Object Oriented Programming (OOP).

    * Create dialogs for interacting with users.

    * Use layout managers.

    * Create and work with graphics of various formats.

    * Implement clipboard and drag-and-drop features.

