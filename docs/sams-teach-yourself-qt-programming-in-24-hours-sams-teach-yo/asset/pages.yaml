  md: '358


    Hour 22


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_381_0.png)


    tmake is a script written in Perl. Therefore, if you''re using UNIX, you need
    to have the Perl interpreter, perl, installed to be able to use tmake.

    Fortunately, perl is often installed by default in modern UNIX systems. if it''s
