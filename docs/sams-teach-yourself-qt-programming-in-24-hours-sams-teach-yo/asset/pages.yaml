    # Summary


    As mentioned in Hour 17, you don''t need to use KDE classes just because you''re
    writing a KDE program. If you don''t find any function in a KDE class that can
    make your program better, there''s no reason to use it. Use KDE classes when they
    can make your program better, or if they use a standard that''s essential to a
    KDE program. By using QApplication and QText instead of implementing the standard
    KDE Help menu, you have (in most people''s opinion) the full right to call your
    program a KDE program.


    However, as the KDE project develops and the KDE classes get better, you should
    take advantage of the great features that KDE classes provide. A good example
    of this is the KFilePreviewDialog class: by changing just one line in your program,
    to make use KFilePreviewDialog instead of QFileDialog, you can make your program
    much easier to use.


    Another point you should keep in mind is that KDE 2.0 is expected to be released
    in the spring of 2000. This is a major update, and it will include a lot of new
    features, for users as well as developers.


