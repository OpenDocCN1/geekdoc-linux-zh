  md: '# Summary


    OpenGL''s most obvious drawback is its lack of functions for user interaction
    (you should note, though that OpenGL was never intended to be a GUI program).
    If you''re a bit dramatic, you could say that Qt''s most obvious drawback is its
    lack of high-performance drawing operations. By putting the Qt and OpenGL libraries
    together, you solve this problem completely. By using OpenGL for the graphic-intense
    operations and Qt for user interaction, the results are quite extraordinary.


    However, although OpenGL is great for graphics, you should think twice before
    you use it. After all, OpenGL is a whole new library, and this course means that
    all your users must have MESA (or some other OpenGL implementation) installed
    to be able to use your program. If they don''t already have an OpenGL library,
    it''s very possible that they won''t install your software because of the extra
    effort they need to put in to install an OpenGL library. Therefore, for simple
    graphics functions, it''s safest to stick with Qt.


    This problem, of course, will only occur if you''re planning to distribute your
    software as source code. If you''re planning to provide binaries only, it''s simple
    to make a statically linked binary. Then users won''t need to bother with getting
    and installing OpenGL libraries at all. Note that static libraries are not created
    by default when compiling MESA; you must add the --enable-static option to configure
    and recompile to get static libraries.


