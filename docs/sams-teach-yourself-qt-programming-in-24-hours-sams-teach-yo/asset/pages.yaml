  md: 'Q How come when I''m using a QLabel object to show some text, my other gets
    (or some of them) disappear?


    A QLabel object is a rectangular object (although you can''t always see that).
    It needs room for the entire rectangle, not just the text. Therefore, if you have
    a QLabel object that''s 400 pixels wide, but the text in the middle of that object
    is 50 pixels, the object will still cover 400 pixels.


    Q I don''t see how the click-to-select function in Listing 6.7 would be useful
    at this point. Am I missing something?


    A No, you''re not missing anything. This function was included just to show you
    how a feature is added. You need to implement other features (such as one that
    lets the user change the contents of a cell) to make this function useful.


