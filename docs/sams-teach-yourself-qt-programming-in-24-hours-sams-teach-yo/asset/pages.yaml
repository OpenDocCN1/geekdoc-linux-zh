    \ a container class, it's best to use an iterator. An iterator is a special kind\
    \ of class that is created for this special purpose: traversing a container. Although\
    \ it's fully possible to use a while loop or something (as shown in Listings 14.1\
    \ and 14.2), it's better (since traversing is safer) to use an iterator. For example,\
    \ iterators can work with containers that change during the traverse. Also, you're\
    \ required to use iterators for traversing the dictionary classes.\n\nThere's\
    \ one type of iterator for each type of container class: QCacheIterator, QHashIterator,\
    \ QIntIterator, QListIterator, and QMapIterator.\n\nAll iterators include a few\
    \ functions for traversing through a container: toFirst() can be used to get the\
    \ first element in the container, and toLast() can be used to get the last element\
    \ in the container. You can also use the ++ and -- operators with iterators to\
