    # Quiz Answers for Hour 19


    +   1. What is OpenGL?

    OpenGL is a library for creating high-performance 3D graphics.


    +   2. What is MESA?

    MESA is a free implementation of OpenGL.


    +   3. What is libgl1?

    libgl is the name of Qt''s OpenGL extension. Qt''s OpenGL classes are defined
    in this library.


    +   4. When should you use OpenGL?

    When you want your program to do some graphic-intense operation. For simple drawing
    operations, it''s safest to stick with QPainter.


    +   5. What is OpenGL''s weakness?

    OpenGL''s most obvious weakness is its lack of functions for user interaction.
    It''s hard to implement buttons, menus, and so in an OpenGL program.


    +   6. What is the OpenGLWidget class used for?

    TheWidget class represents the OpenGL widget. You should add your OpenGL code
    to a subclass of QWidget.


    # Quiz Answers for Hour 20


    +   1. Why should you use Qt to develop Netscape plug-ins?

    Because it lets you use a library that you''re already familiar with and you don''t
    have to learn how to use the API provided by the Netscape Plugin SDK.


    +   2. What does the Plugin::getMIMEDcription() function do?

    ThePlugin::getMIMEDcription() function is used to set the MIME type, the filename
    extension, and the MIME description.'
