  md: '# Creating Simple Graphics


    # Q&A


    +   Q When I add some drawing code to my class constructor, my graphics just don''t
    appear onscreen. What''s wrong?


    +   As stated earlier, you need to place the drawing code in a special function
    called paintEvent(). This keeps your code from interfering with Qt''s internal
    drawing code. However, you can put the drawing code in some other functions as
    well, not in the constructor.


    +   Q When I''m drawing text with QPainter, I get an error message about a missing
    font. What''s wrong?


    +   A Actually, you''ve already found what''s wrong. You simply don''t have the
    font you''ve chosen or you''ve misspelled it.


    +   Q Why doesn''t anything happen when I try to print graphics?


    +   A Make sure you have a printer correctly installed. This is a very common
    problem. Check your graphics code that outputs to the printer for errors. Also,
    make sure you''ve called the begin() function with the QPrinter object as an argument.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_178_0.png)


