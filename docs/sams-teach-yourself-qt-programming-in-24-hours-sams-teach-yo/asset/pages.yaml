    # Summary


    Now you''ve got a basic understanding of what the KDE project is and how to get
    started with KDE development. As you''ve noticed throughout this hour, working
    with KDE classes is pretty much the same as working with Qt classes. This might
    make you doubt whether it''s really necessary to learn the KDE library as well.
    Of, course, it''s not necessary if you have no plans to make your applications
    KDE compatible, but it can be a good thing to do.


    KDE makes it easier for newcomers to UNIX Linux to learn how to use and take advantage
    of the system. If new users are presented with a GUI interface as the one for
