  md: 'This is a member function of QMainWindow. It creates a simple status bar at
    the bottom of the window. The program will now look as shown in Figure 5.10.


    FIGURE 5.10

    Here, a status bar is added the bottom of the window. It''s currently showing
    the status bar message of the Open button.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_107_0.png)


    If you hold the mouse pointer over one of the buttons, a message will appear in
    the status bar. This message is defined by the third argument you give the QToolButton
    constructor (in this case, Open File). However, you would normally want a more
    detailed description here, as Click This Button to Open a File.


    As stated, the status bar should be used to briefly inform the user about what''s
    going to happen if he performs a certain user event. By displaying a short explanation
    text in the status bar for each item in the program, you make the program easier
    to use and understand.


    Remember that the status bar can also be used for things other than explanations.
    For example, you can use the status bar to present the current line number, or
    the name of the currently open file in a text editor. A status bar improves the
    functionality of your program. What can it be used for is up to your imagination.


    # Summary


    This hour has brought you a step further along the Qt learning curve. We discussed
    some of the essential parts of Qt—parts that you''ll find valuable when you''re
