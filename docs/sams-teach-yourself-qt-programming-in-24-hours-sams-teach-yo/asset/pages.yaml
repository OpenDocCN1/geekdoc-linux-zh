  md: '# TABLE 21.1 Useful QDate Member Functions


    | Function | Description |

    | --- | --- |

    | QDate::year() | Returns an integer representing the current year. |

    | QDate::month() | Returns an integer representing the current month (1 for January;
    12 for December). |

    | QDate::day() | Returns an integer representing the day of the month (1 through
    31). |

    | QDate::dayOfYear() | Returns an integer representing the day of the year (1
    through 365). |

    | QDate::daysOfMonth() | Returns an integer representing the number of days in
    the month (28, 29, 30, or 31). |

    | QDate::daysInYear() | Returns an integer representing the number of days in
    the year (365 or 366). |

    | QDate::monthName() | This function takes an integer (1–12) as an argument and
    returns the name of the month as a QString. |

    | QDate::dayName() | This function takes an integer (1–7) as an argument and returns
    the name of the day as a string. |

    | QDate::daysTo() | This function takes a QDate object as an argument and returns
    an integer representing the number of days between this date and the date that
    was passed as an argument. |


    The QDate::current() function uses the day/month/year standard. However, it is
    easy to accomplish your desired standard by using the functions described in Table
    21.1.


    Another great feature of QDate is that you can use the ==, !=, <, <=, >= operators
    with it. It is very simple to compare multiple QDate objects.


