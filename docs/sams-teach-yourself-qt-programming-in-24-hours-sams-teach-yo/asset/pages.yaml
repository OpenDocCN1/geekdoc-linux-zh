  md: '# Compiling UNIX Systems


    First, you''ll need some valid code to compile. I suggest you use the code from
    Listing 1.3. Save the file on your hard drive, use cd to go to the directory containing
    the file, and issue the following command:


    ```

    # g++ -lqt 01lt03.cpp 01lt03

    ```


    Here, g++ is the C++ compiler. However, this could be gcc or c++ or something
    similar on your system. -lqt means that you want to link with the Qt libqt.so
    for /usr/lib/qt/lib directory. 01lt03.cpp is the source file you want to compile.
    -o means that the following string is what you want to call the binary file (program).


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_37_0.png)


    > You might get an error such as the following when you try to compile the program:


    ```

    can''t load library ''libqt.so.2''

    ```


    If so, make sure you''ve added either Listing 1.1 or Listing 1.2 to one of your
    startup files, and also make sure you''ve logged out and logged again to make
    these changes active. If this is done and you still get the error message, try
    to add /usr/local/qt/lib to your /etc/ld.so.conf file and then run ldconfig program:


    ```

    # ldconfig

    ```


    If still doesn''t work, check LD_LIBRARY_PATH by executing the following command:


    ```

    # echo LD_LIBRARY_PATH

    ```


    If the output from this command doesn''t include /usr/local/qt/lib, enter the
    following command (if you''re using bash, zsh, or sh):


    ```

    # export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/qt/lib

    ```


    Otherwise, if you''re using csh or tcsh, enter this following command:


    ```

    # setenv LD_LIBRARY_PATH /usr/local/qt/lib:$LD_LIBRARY_PATH

    ```


    Now, to compile again. If it works, make sure you add LD_LIBRARY_PATH from one
    of your startup files.


    Now, to run the program, issue the following command from the directory containing
    your newly compiled program:


    ```

    # ./01lt03

    ```


    Note that you could call the program whatever you like. In this example, the program
    is called 01lt03 just to show that it was compiled from the file 01lt03.cpp.'
