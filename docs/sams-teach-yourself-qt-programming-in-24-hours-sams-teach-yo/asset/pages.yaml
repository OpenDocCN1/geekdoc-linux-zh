    7: class MyWidget : public QWidget

    8: {

    9: public:

    10: MyWidget();

    11: };

    12:

    13: MyWidget::MyWidget(){

    14:

    15: setMinimumSize(200, 200, 200);

    16:

    17: QPushButton *b1 = new QPushButton("Button 1", this);

    18: b1->setMinimumSize(200, 100);

    19: b1->setFont(QFont("Times", 18, QFont::Bold));

    20:

    21: QPushButton *b2 = new QPushButton("Button 2", this);

    22: b2->setMinimumSize(200, 100);

    23: b2->setFont(QFont("Times", 18, QFont::Bold));

    24:

    25: QVBoxLayout *vbox = new QVBoxLayout(this);

    26: vbox->addWidget(b1);

    27: vbox->addWidget(b2);

    28: }

    29: int main(int argc, char *argv)

    30: {

    31: QApplication a(argc, argv);

    32: MyWidget w;

    33: w.setGeometry(100, 100, 200, 200);

    34: a.setWidget(&w);

    35: w.show();

    36: return a.exec();

    37: }

    ```


    This version of the program uses a layout manager (vbox, based on QVBoxLayout),
    and therefore looks slightly different. Let''s go through the ones by one:


    +   - To begin with, a new header file from the Qt header library is included,
    called qlayout.h. This file holds the definitions for the layout manager''s classes.
    In this case, qlayout.h is included to get access to the QVBoxLayout class.'
