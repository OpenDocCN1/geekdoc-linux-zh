  md: '# Hour 13


    When QValidator and QIntValidator were used in the previous examples, the predefined
    validate() function was used to determine whether the entered string was acceptable.
    However, here you need to define your own version of validate() (lines 22 through
    41), because that''s a virtual function of QValidator.


    In EmailValidator::validate(), you create a regular expression with ORegExp (line
    26) and then check whether the entered string matches with this expression with
    ORegExp::match(). If it does, you tell the validator to accept the string by returning
    QValidator::Acceptable (lines 32 through 35). If it doesn''t match, QValidator::Invalid
    is returned (lines 37 through 40).


    This new validator is used in the MainWindow class. Here, a QLineEdit object is
    created (lines 76, 77, and 78) and the EmailValidator class is used to validate
    the input to this object (line 7). So, slotPressed() is also created (lines 60
    through 68). This slot uses QMessageBox to show a message to the user.


    slotReturnPressed() is connected to the QLineEdit::returnPressed() (signal number
    80 and 81), which is emitted when the user presses Return or Enter.


    The result of this is that if you type an email address that matches <anything>@<3
    characters>, the message box will appear. If you type something else, nothing
    will happen.


    As you have noticed, this validator doesn''t accept all email addresses. This
    is because the top-level domain is defined to always consist of three characters.
    If the top-level domain of your email address has only two characters, the address
    will not be accepted. However, this is easy to fix.


    The concept used in this example should be used to create any custom validator.
    And, with the powerful regular expressions provided by QRegExp, writing validators
    get really easy.


    # Using the fixup() Function


    If you''ve looked up QValidator in the Reference Documentation, you''ve probably
    noticed that this class has another virtual function: fixup(). You can use this
    function for fixing strings that are not acceptable but invalid either. Actually,
    QValidator includes a special type for this state: QValidator::Valid. If you find
    that the entered string is not acceptable, but it could be made acceptable, you
    should return QValidator::Valid, and the validator will then call the fixup()
    function, which should include the necessary code to make the string acceptable.'
