    # Using Scrollbars


    Scrollbars enable you to create applications that are actually too big to fit
    the screen. In many cases, scrollbars are required for your application to run
    on all desktops. By learning to use scrollbars, you can make programs that are
    easier for people to use (since you can see all the widgets, no matter resolution
    they use for their desktops). For example, if you create a program optimized for
    your 1024 pixel by 768 pixel desktop, those who use 800 pixel by 600 pixel or
    640 pixel by 480 pixel desktops have no chance to get an overview of your program
    (since their desktops simply are not big enough). So, study this section and make
    sure your program never will suffer from this problem.


    # Getting Started with Scrollbars


    When you''re working with Qt, the easiest way of implementing a scrollbar function
    is to base your main window (the main window) on the QScrollView class. By doing
    this and making a call to QScrollView::addChild for each widget, you will automatically
    create a scroll on-demand window (that is, the window will only add scrollbars
    if it''s too small to show all its widgets at their original sizes). However,
    if no scrollbars are needed, scrollbars will be shown. Listing 5.1 shows an example
    of this.


