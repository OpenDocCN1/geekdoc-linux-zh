    # Creating and Using Custom Signals and Slots


    You spend much time creating custom slots when you''re writing a Qt program (in
    other words, slots that you have defined yourself). You can, of course, create
    your own signals as well. But because the predefined signals are enough in most
    cases, that is something you won''t have to do often. In this section, you will
    learn to use the Meta Object Compiler, which is required for doing this.


    # Getting to Know the Meta Object Compiler


    As mentioned, the signal/slot technique is quite special. Actually, there''s also
    a special programming syntax for creating slots and slots. Your C++ compiler doesn''t
    understand this syntax, so you have to use special tool, to make the Meta Object
    Compiler (MOC), to make this work. This tool scans a source file for the special
    programming'
