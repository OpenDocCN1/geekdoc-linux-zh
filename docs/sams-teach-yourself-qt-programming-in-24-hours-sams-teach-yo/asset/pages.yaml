  md: '# # SAMS Teach Yourself


    # # Qt Programming in 24 Hours


    # # BOSTON PUBLIC LIBRARY

    Copley Square

    Boston, MA 02216


    | HOUR | TITLE | CONTENT |

    |---|---|---|

    | 1 | Introduction to Qt | Learn the Qt library and its Reference Documentation.

    | 2 | Object-Oriented Programming | Get to know the basics of object-oriented
    programming. Learn how and why to use it.

    | 3 | Learning the Qt Basics | Create your first window and add a button to it.

    | 4 | Making Things Happen: Slots and Signals | Explore Qt slot/signal mechanism
    lets you connect widgets to events.

    | 5 | Learning More About Qt Building | Create scrollbars and menus. Also learn
    File IO and the qfile class.

    | 6 | Getting to Know Qt Widgets: Lesson One | Use and combine buttons, labels,
    and tables.

    | 7 | Getting to Know Qt Widgets: Lesson Two | Learn to use text editors, lists,
    sliders, and spin bars.

    | 8 | Getting to Know Qt Widgets: Lesson Three | Get to know the QColor class,
    work with colors, and patterns.

    | 9 | Creating Simple Graphics | Learn about Qt-predefined dialogs and how to
    create them.

    | 10 | Understanding Regular Expressions | Learn how you can use layout managers
    to make laying widgets easier.

    | 11 | Using Layout Managers | Learn to use Qt classes for working with filters
    and directories.

    | 12 | Working with Files and Directories | Get an understanding of regular expressions.
    Use the Qfile class.

    | 13 | Understanding Regular Expressions | Learn how Qt container classes can
    be used to store objects of classes.

    | 14 | Processing Text | Get to know the basics of the more advanced graphic functions.

    | 15 | Learning More About Graphics | Learn how to use the clipboard and implement
    the drag-and-drop feature.

    | 16 | Making Your Programs | Learn the basics of KDE''s core library, how to
    use interface, and file operation.

    | 17 | Writing KDE Applications | Learn how to implement OpenGL features in your
    program.

    | 18 | Getting to KDE Applications | Learn how to use creating plug-ins for the
    Netscape browser.

    | 19 | Learning to Use OpenGL Classes | Learn how to interpret your programs into
    other languages, and how to deal with time and date-time.

    | 20 | Internationalizing Your Programs | Learn how to use the three Qt programs
    for creating graphical user interfaces.

    | 21 | Portability | Get to know your debugging functions and macros.

    | 22 | Debugging Techniques | |

    | 23 | Use the Qt Builders | |


