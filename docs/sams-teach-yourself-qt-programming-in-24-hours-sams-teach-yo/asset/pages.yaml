  md: '# Working with Files and Directories


    # Summary


    As mentioned earlier in this chapter, quite often I choose to use Qt''s classes
    for working with files and directories when I''m developing programs using some
    other library. I''ve even used these classes in text-based programs. Although
    my programming habits might not be of interest to you, they show just how powerful
    these classes really are.


    Perhaps you''ve used the standard C++ classes (or the C functions and structures)
    when working with your file system, and you feel very comfortable with them. Maybe
    you have no plans at all to make your programs available on platforms other than
    you own. If so, you can continue using the methods you''re already familiar with
    without problems. But, however, keep one point in mind: Qt''s classes for working
    with files and directories are great. Once you''ve learned to use them which will
    not take long, you never want to use anything else.


