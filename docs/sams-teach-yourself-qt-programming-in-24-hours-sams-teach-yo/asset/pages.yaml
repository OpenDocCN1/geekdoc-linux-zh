    Spin boxes are very useful for setting a numerical value where the range of values
    is not too big. On the other hand, if the range is big (say from 1 to 1000), there
    will be a lot of clicking! In that case, a slider is a better choice. However,
    as stated, for setting numerical values where the numerical range is smaller (for
    example when setting the current date), spin boxes are great!


    # Summary


    In this hour, you learned how to use selection widgets. When working with selection
    widgets (for text strings as well as numerical values), you need to be aware of
    the provided-class methods. Laying out a few selection widgets in a window is
    not hard; however, you''ll most likely want these selection widgets to have some
    kind of functionality in your program.


    You won''t be able to do this if you don''t know which signal is emitted when
    a particular event occurs or which function to call when you want to change the
    value in a particular way. Although it''s nearly impossible to have all this information
    in your head, you should have at least a basic understanding of how the selection
    widgets work, which you''ve hopefully learned in this hour. In addition, it''s
    an easy task to check the Reference Documentation when you need information about
    some method.


    You also learned about arrangers in this hour. Arrangers are widgets you can use
    to arrange other widgets. Although you need to put in some extra work to implement
    arrangers in your programs, you should use them as often as possible. If used
    correctly, they can make an application look better and easier to use.'
