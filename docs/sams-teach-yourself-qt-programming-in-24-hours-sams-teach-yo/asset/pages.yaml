  md: '# Debugging Techniques


    delete display -- Cancel some expressions to be displayed when program stops

    disable display -- Disable some expressions to be displayed when program stops

    dissemble -- Disassemble a specified section of memory

    display -- Print value of expression EXP each time the program stops

    enable display -- Enable expressions to be displayed when program stops

    inspect -- Same as "print" command

    output -- Like "print" but don''t put in value history and don''t print newline

    print -- Print value of expression EXP

    printf -- Print "format string"

    typype -- Print definition of type TYPE

    set -- Evaluate expression EXP and assign result to variable VAR

    set variable -- Evaluate expression EXP and assign result to variable VAR\undissemble
    -- Cancel some expressions to be displayed when program stops

    whatis -- Print data type of expression EXP

    x -- Examine memory: X/TID ADDRESS


    Type "help" by command name for full documentation.

    Command name abbreviations are allowed if unambiguous.


    These gdb commands can be used to examine your program''s data. For example, you

    use the call command to execute one specific function of your program. With these

    commands, as well as the ones covered in the other gdb help sections, you get
    full con-

    trol your program.


    For more information about the GNU debugger, the gdb man page (man gdb).


    # Useful Command-Line Options


    When debugging a Qt program, you can use a few command-line arguments to make
    the

    debugging easier.


    First, the nograb argument tells the program to never grab the mouse or the keyboard
    (it

    will always allow other programs to use the mouse and the keyboard simultaneously).
    If

    the mouse or keyboard is grabbed during a run, it will be impossible to enter
    commands

    or click on other programs (such as a debugger). Fortunately, this argument is
    auto-

    matically when a Qt program runs through the gdb debugger.


    The -grab argument makes a program ignore the -no argument, in case you want

    the program to grab the mouse and the keyboard when it runs through gdb (how-

    ever, this is very rare).


    The -sync command-line argument tells the X11 server (it only works with X11)
    to run

    in synchronous mode. This means that the X server will not use any buffer optimization

    but rather perform each client request immediately. This often makes the program

    much slower and therefore easier to debug.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_398_0.png)'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Summary


    Using Qt''s debugging functions and macros gives you, the developer, a better-understanding
    of how a program works without using a debugger. By reading the information these
    functions and macros output to stdout (X) or the debugger (Windows), you increase
    your chances of finding the bug. When you run a program that gives no output at
    all, it''s much harder to get an overview of what''s actually happening, as how
    and when the functions are called.


    Of course, the information given by the debugging functions and macros is not
    limited to function calls; you can give yourself much more detailed information.
    Because the debugging functions use the same outstanding argument lists as the
    printf() function, it''s easy to embed various program variables in the output
    string as.


    In this hour, you learned the basics about the gdb debugger. This program is great
    when you feel the debugging functions and macros are not enough for you, such
    as when you need more insight. By using gdb, you get full control over your program
    and defeat any possible bugs, no matter how complex they are.


    Finally, remember to always remove all calls to debugging functions and macros
    in the final version of your program.


    # Q&A


    +   Where can I find information about all those other debugging macros not mentioned
    in this hour?


    +   Unfortunately, there isn''t any detailed information about these macros at
    the time of this writing. However, they are briefly described in the "Debugging
    Techniques" section of the Qt Reference Documentation.


    +   I don''t get it. Why should I use the debugging macros instead of the-debugging
    functions?


    +   The debugging macros do much of the work for you. By using them, you don''t
    have to create the output string yourself—it''s handled by the kernel. The only
    thing you need to do is feed the macro with a pointer or a Boolean value so it
    can determine whether a debugging string should be outputted.


    +   I don''t like text-based programs. Is there a GUI interface for the gdb debugger?


    +   Actually, there is. It''s written in Tcl/Tk and can be found at http://sourceware.cygnus.com/insight/.'
  merge: -1
