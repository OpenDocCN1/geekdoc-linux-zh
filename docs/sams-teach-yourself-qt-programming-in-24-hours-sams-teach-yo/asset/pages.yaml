  md: '# HOUR 16


    # Making Your Programs Communicate


    By implementing functions for communication between objects in a program, or between
    separate programs, you can make the programs a lot easier to use.


    The communication feature called the Clipboard is a memory area where you can
    temporarily store different kinds of data that you work with your application
    (usually text). The Clipboard makes it very simple to move or copy data within
    a program or between programs.


    The drag-and-drop feature provides an even more user-friendly way of moving or
    copying data. By using drag and drop, you can just grab an object with your mouse,
    drag it into another program (or another part of the same program), and drop it
    there.


