    If you make the window''s width too small to show the whole button, a horizontal
    scrollbar appears.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_95_0.png)


    As you see, a horizontal scrollbar now appears, and you can drag it with the mouse
    to see the hidden part of the button. On the other hand, if you decrease the window''s
    height, you should end up with something similar to what''s shown in Figure 5.3.


    # FIGURE 5.3


    By making the window''s height too small to show the whole button, you make a
    vertical scrollbar.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_95_1.png)


    This time, a vertical scrollbar appears. This can be used to see the part of the
    button that was hidden when you decreased the window''s height. Last but not,
    you can decrease both the width and the height of the window. By doing this, you
    make both the horizontal and the vertical scrollbars appear. This is shown in
    Figure 5.4.


    # FIGURE 5.4


    If both the width and the height of the window are too small for the button, both
    the horizontal and vertical scrollbars appear.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_95_2.png)


    What we''ve just covered here is called scroll-on-demand—that is, scrollbars are
    not shown if they''re not needed. However, you can add scrollbars manually using
    the QScrollBar class. (I wouldn''t recommend that you do, though, because it involves
    unnecessary work—that actually done automatically by the QScrollView class.) Therefore,
