  md: '# Getting to Know Qt''s Container Classes


    As stated, container classes are used to store other elements (often objects of
    other classes). However, there are a few different methods you can use to store
    and access objects in a container class. Therefore, Qt comes with a few different
    container classes, and although some of them work very similarly, they all have
    different purposes.


    An overview of Qt''s container classes can be found in Table 14.1. This table
    illustrates the different uses of Qt''s container classes. Take a look at it to
    get an overview of the different container classes can be used for.


    # Table 14.1 Qt''s Container Classes


    | Class | Description |

    |---|---|n| QArray | This is a very simple class that can only store very simple
    elements. It can''t store any other objects except the built-in ones and its elements
    mustn''t have any constructors, destructors, or virtual functions |

    | QByteArray | This is a class derived from QArray. However, it can only store
    bits. It can be useful when you want to collect flags in a program |

    | QPointArray | This is another class derived from QArray. It can be used to store
    QPoint objects |

    | QDict | This stores its elements in a hash table. A hash table is a table where
    elements are accessed via strings. For example, you can store pairs of strings
    in a QDict object and access one of the strings through the other |

    | QIntDict | Works like QDict but uses long values instead of char |

    | QPtrDict | Same as QDict but can use data other than char for the keys (the
    strings that represent the elements in the hash table) |

    | QCache |Cache works like QList. However, you can control the number of elements
    on a QCache object so the list doesn''t get too big |

    | QIntCache | Works like QCache but uses long instead of char |

    | QList | This class is a doubly linked list, which is a common element in C++
    programming. This is a very powerful kind of list that lets you insert and access
    elements in all kinds of ways. See the Reference Documentation for more information
    |

    | QString | This is a class derived from QList for storing lists of strings |

    | QString | Same as QString, but this one use case-sensitive compare operations
    |

    | QStack | This class should be used when you want to create a list and then access
    the elements in reverse order (last in, first out) |

    | QQueue | Use this if you want to create a list and then access the elements
    you inserted them (first in, first out) |'
