  md: '# Working with Files and Directories


    # ### TABLE 12.1 File-Opening Modes


    | Mode | Explanation |

    | IO0_Raw | Opens the file in raw mode (no buffer will be used). This is probably
    a mode you''ll have to worry about. |

    | IO0_ReadOnly | This is the mode used in Listing 12.1. In this mode, you can
    only read the file, not write to it. |

    | IO0_WriteOnly | In this mode, you can only write to the file, not read it. |

    | IO0_ReadWrite | This opens the file on read-write mode. By using this mode,
    you can both read and write to the file (as IO0_ReadOnly | IO0_WriteOnly). |

    | IO0_Append | This mode sets the file index to the end of the file. This means
    that when you writing to the file, it will be added at the end of it. This is
    very useful when you want to add text to a file without deleting its current contents.
    |

    | IO0_Truncate | With this mode, the file will be truncated if it exists. |

    | IO0_Translate | This mode carries return/linefeed translation in MS-DOS, Windows,
    and OS/2 systems |


    You should also know that QText includes definitions for the usual C++ operators
    (<< and >>). Therefore, if you''re more comfortable with those streamers, you
    can use them instead of read and write to files.


    Other QTextstream functions include QText::read() and QText::setEncoding(). Instead
    of reading just one line, like QText::readline(), QText::read() reads the entire
    string. QText::setEncoding(), you can set the encoding.


    QFile also has functions you might find useful. For example, QFile::exists() returns
    the boolean TRUE if the file exists and the boolean FALSE if it doesn''t. QFile::remove()
    removes the current file. This function returns TRUE if the deletion was successful
    and FALSE if it wasn''t. With QFile::setName(), you can set the name of the file.
    You can also get the name by calling QFile::setName() by calling the QFile::name()
    function. See the Reference Documentation for a complete list of functions.


