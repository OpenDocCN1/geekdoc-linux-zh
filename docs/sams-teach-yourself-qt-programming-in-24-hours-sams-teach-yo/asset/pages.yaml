  md: 'However, although GUI builders are a great help, you still can''t create Qt
    programs with-out actually knowing how the library works. There''s a chance that
    a GUI builder has bugs that will make it output bad code in certain situations.
    Therefore, it''s important that you know and understand the library so you can
    fix any problems. Because of this, the GUI builders were not even mentioned prior
    to this hour. However, if you''ve followed the first 23 hours successfully, you''ve
    certainly gained the right to use GUI builder by now.


    # Q&A


    +   If I understood it right, I need perl to compile QtEz. I don''t have perl.
    Where can I get it?


    +   A perl distribution is probably included in your UNIX/Linux distribution.
    If that''s not the case, you can download it from www.perl.com.


    +   When I''m trying to run QtEz, it says that the OTEZ environment variable is
    not set, but I''m absolutely sure I did it. What''s wrong?


    +   If you set the OTEZ environment variable in one xterm or virtual console and
    then try to start QtEz in another console, QtEz won''t find the variable. To be
    sure that this variable is set in all terms and virtual consoles, you need to
    set it in one of your startup scripts (for example, /etc/profile).


    +   I''m compiling QtEz (or QtArchitect), and it''s taken a few hours now. Something
    might be wrong!


    +   No, if the computer is still compiling, nothing is wrong. It''s just that
    QtEz and QtArchitect are quite large applications and take some time to compile.
    If your computer is a few years old, it''s quite possible that this process will
    take a few hours.


    +   I don''t know which GUI builder to choose. What do you think?


    +   If you don''t have anything against the QtEz interface, it''s currently the
    best choice. It has the most features and takes care of much of the work in actually
    building the GUI. However, it''s possible that this will change in the future
    as the other GUI builders develop.


    # Workshop


    You''re encouraged to work through the following questions and exercises to help
    you retain what you''ve learned in this hour about GUI builders.'
