    between QLineEdit and QMultiLineEdit?

    MultiLineEdit includes functions for programmatically inserting text at exact
    positions.

    4. If you don''t use the insertItem() function to insert items to a list view,
    which method is used?

    The parent-child method.

    5. Which signal is emitted when you double-click an item in the list view?

    The doubleClicked() signal.

    6. Which signal is emitted when you press Return or Enter in a list view?

    The returnPressed() signal.

    7. What is a progress bar?

    A progress bar is a smart widget that gives the user a view of how much time is
    left before one or more tasks are finished.

    8. When should you implement a progress bar in your application?

