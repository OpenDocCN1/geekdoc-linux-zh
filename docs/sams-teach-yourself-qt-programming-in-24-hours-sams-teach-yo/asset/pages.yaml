  md: '# HOUR 20


    # Creating Netscape Plug-Ins


    In this hour, you''ll learn how to take advantage of Qt to easily write browser
    plug-ins, which are pieces of software (a shared object in UNIX; DLL file in Windows)
    for many types of programs that easily extend the current features of these programs.
    An example of this is the popular Flash plug-in from Macromedia, which makes your
    Internet browser able to deal with Web sites that use Flash technology (for more
    information about this, see www.flash.com). If you have this plug-in installed,
    the browser will simply call the plug-in for help when it finds a file or a stream
    of data that the plug-in can handle. Keep in mind, though, that plug-ins for one
    program are not compatible with plug-ins for another program.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_338_0.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 316


    # Hour 20


    When creating plug-ins for Netscape Navigator, you''ll generally use the Plugin
    SDK (Software Development Kit), which can be downloaded from Netscape''s Web site,
    and write the plug-ins using the API (Application Programming Interface) provided
    by the Plugin SDK. However, the API provided by the Plugin SDK is considered pretty
    hard to use. That''s where Qt comes in. Qt includes a few classes you can use
    to create Netscape plug-ins. By using these classes, you don''t have to deal with
    the standard Plugin API; therefore, writing Netscape plug-ins becomes much easier.


    This hour focuses on developing Netscape plug-ins by using Qt''s plug-in. It does
    not cover how to use the Netscape Plugin SDK.


    # Preparing Your System for Plug-In Development


    Before you begin developing Netscape plug-ins with Qt, there are a few things
    you need to do first. The steps you''ll need to take are covered in this section.


    # Getting the Netscape Plugin SDK


    Although you don''t directly use the Plugin SDK provided by Netscape, the plug-in
    extension in Qt uses parts of this SDK; therefore, you need to download it.


    ```

    # tar xvf unix-sdk-3.0b5.tar.z

    ```


    This will unlike the archive and place the files in a directory called PluginSDK30b5.


    ![](img/ed4f2be9f0799d95b6f041531c9a1f14_339_0.png)


    As always, it''s very possible that the version number has changed. At the time
    of writing, the latest version was 3.0b5. If that has changed, it will affect
    both the name of the file and the name of the directory.


    Now you need to copy a few of these files to the SOTDIR/extensions/nsplugin/src
    directory. This can be done as follows:


    ```

    # cd PluginSDK30b5/common/

    # cp npunix.cpp SOTDIR/extensions/nsplugin/src

    ```'
