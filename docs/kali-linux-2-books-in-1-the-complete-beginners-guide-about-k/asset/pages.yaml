  md: '# Chapter 2: Troubleshooting Installations


    Kali Linux has turned out to be a quite reliable software when it comes to penetration
    testing and ethical hacking. But, there are times when the system fails and it
    becomes a tiresome job to install the same. There can be a wide range of possibilities
    behind the failure of Kali Linux installation. This could include problems like
    incomplete or corrupted iso download, insufficient disk space of the target machine
    and many others.


    The installer of Kali Linux is really reliable but facing bugs or encountering
    external problems like bad mirrors, network problems, etc. is very common. So,
    all that you need to do in such situations is to simply troubleshoot the process
    of installation so that you can proceed.


    Whenever the installer of Kali Linux fails, it comes up with a screen which shows
    “Installation Step Failed”. At such a point, you need to know that the Kali Linux
    installer functions with various virtual consoles: the primary screen which you
    can see either on fifth console (for the installer of graphics use CTRL+Alt+F5)
    or on the first console (for the installer of texts use Shift+F4).'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'In both of these cases, the fourth console which can be seen by CTRL+Shift+F4
    will help in displaying all the related logs of what exactly is happening within
    the installer. You can easily evaluate the reason for the installer problem with
    a more detailed error message such as “the log screen of installer” which indicates
    that the target machine is running out of space and the installer is unable to
    proceed with the step.


    # The log screen of the installer


    The third and the second consoles, which are CTRL+Shift+F3 and CTRL+Shift+F2 respectively,
    host the shells which can be used for further investigation of the present situation
    in complete detail. Most of the tools of the command line are provided by BusyBox
    and so the set of features is somewhat limited. They are enough for figuring out
    the majority of the problems which you are most likely to encounter during the
    installation of Kali Linux.


    As you click on Continue, which is available on the main screen Installation Failure,
    the installer will return you to a screen which are not likely to see in normal
    conditions, the Main Menu of the Kali Linux installer. This screen will let you
    launch the steps of the installation by one. If you can manage to mend the problem
    with the help of the installer shell access you can easily start again with the
    step which failed.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What can you do in the shell of installer


    With the installer shell, you can easily inspect and also modify the database
    of debconf with the commands debconf-get and debconf-set. These commands are used
    for the purpose of testing the preceeding values. You can check any of the files
    like the complete log of installation, available in /var/log/syslog with more
    or cat. You can also edit any of the files with nano along with the files which
    are being installed on the system.


    # Main Menu of the Kali Linux installer


    In case you are still not able to resolve the installation problem, you can file
    a report of the bug. The report of the bug needs to include the logs of the installer
    which can be easily retrieved with the Save Debug Logs option available from the
    main menu.


    With this, you can export the logs in various ways, like in mounted file system,
    floppy or on the web. The most convenient way of saving the debug logs is to let
    the Kali Linux installer start with a hosting of the web server for the log files.
    You can launch a web browser from any other computer which is also in the same
    network and then download all the available log files.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Other methods of troubleshooting


    There are various other simple ways to troubleshoot the installation of Kali Linux.
    Let''s have a look at them.


    +   - Downloading the official form of Kali Linux image: Make sure that you have
    downloaded the ISO file for Kali Linux from the official website. The image files
    are available in various formats such as ISO files, ARM images and VMware images.
    The ISO files are available in two formats: 32 bits and 64 bits. The VMware images
    come pre-installed with the VMware virtual machine. The image of VMware is available
    in the format of 32 bit PAE. In the case of ARM images, it is not all possible
    to have one format of image which will be working across all the devices of ARM.
    In the Kali Linux website, you can find ARM images for various devices such as
    rk3306 mk/ss808, ODROID-U2/X2, Samsung Chromebook, Raspberry Pi and others.

    - Verify the checksums of SHA1 for the downloaded images: While downloading the
    image for Kali Linux, make sure that you check the SHA1SUMS.gpg and SHA1SUMS file
    which is available right next to the images of download. Before verifying the
    image'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'checksums, be sure that SHA1SUMS file is the only one which has been generated
    by Kali.


    +   **Installation steps verification:** If you are installing Kali Linux using
    DVD, try to burn the DVD at the slowest speed. Make sure that you have disabled
    the firewall or antivirus on the system so that it does not interrupt the writing
    process. If you are facing a low disk space error, try to increase the allocated
    space of the disk. Check the space which you have allocated for the installation
    of Kali Linux. The best option is to allocate at least 20 GB of space along with
    the space of swap. You can also troubleshoot the installation by deleting and
    then repartitioning the free space on the disk. You can also allow the installer
    itself to partition the free space on the disk automatically and this might resolve
    your problem.'
  merge: -1
  pgno: 24
- img_proc: true
  md: <!-- no content -->
  merge: -1
