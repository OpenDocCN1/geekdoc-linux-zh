    # Changing the PATH variable


    The PATH variable is regarded as the most important of all. This variable ultimately
    controls the location to which your shell looks out for the commands which you
    type like ‘ls,’ ‘cd,’ ‘echo’ and many others. In case the shell of BASH is unable
    to find your command in any of your path, it will be returning an error message
    as “command not found”. In case you want to install a completely new tool named
    “newtool” into the directory of /root/newtool, you can do this by adding it to
    the PATH variable by entering:


    ```

