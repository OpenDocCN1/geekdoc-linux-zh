  md: '# Chapter 1: Installing and Downloading Kali Linux


    If you want to opt for information security as your career choice, the most important
    thing that you will need is to install an operating system which mainly functions
    as a security system administrator. a proper OS will help you in performing the
    variety of tasks related to information security and will make the time-consuming
    jobs very easy. In today''s world of information security, you can find a wide
    range of operating systems among which Kali Linux is regarded as the best of all.


    It works as a great tool for the purpose of penetration testing and information
    security. Today, it is being used by most penetration testers along with ethical
    hackers who are concerned with the security of a system as well as with various
    other assessments of the network.


    Among all other distributions of Linux, Kali Linux is one of the finest and leading
    distribution which is being widely used today in the world of security auditing.
    Kali Linux is the one and only operating system which is related to the security
    of networks and ethical hacking. It comes with loads of tools which are related
    to command line hacking which is necessary for various jobs related to the information
    security.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Kali Linux is most commonly used for computer forensics, security of system
    application, and penetration testing along with network security. Kali Linux is
    also the prime OS designed for the purpose of ethical hacking.


    # How to download Kali Linux?


    Kali Linux is an open-source software. That means that the OS can be used and
    utilized completely along with being totally free. So, Kali Linux can be downloaded
    easily from the official website of the OS. You can install it by various techniques
    which you can find in the next section. You will come across various versions
    of the same and you can install the one which meets your needs.


    While downloading the installation file, you will also come across some hexadecimal
    number which are being used for the purpose of security jobs. You need to properly
    check out the integrity of the image which you have downloaded. You will also
    need to check the SHA-256 fingerprint of the installation file.


    # How to install Kali Linux on your computer?


    The overall process related to the installation of Kali Linux on your computer
    is super easy. You can choose any of the options which are'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'available for installing the OS. The most commonly used installation options
    are:


    +   - Installing the OS with the use a of hard drive.

    - Installing the OS with the help of Kali Linux bootable USB drive.

    - Installing the OS with the help of VMware or VirtualBox.

    - Installing the OS with the help of dual booting.


    Among all the options which are available for installing Kali Linux on your system,
    installing the OS with the help of VirtualBox and by using bootable USB drive
    is the most common. Your system requires a minimum of 20GB of free hard drive
    space along with a minimum of 4 GB RAM in case you want to install the OS with
    the use of VMware or VirtualBox.


    # Installation of Kali Linux with the help of virtualization software


    +   - Just before starting with the process of installation, you need to install
    a virtualization software like VMware. You can also choose other options such
    as

    - VirtualBox which is a product of Oracle. After you are done with installing
    the virtualization software launch the software from the applications folder.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   - You need to download the installation file for the OS which you can easily
    get from the official website. After that, launch the virtual machine. For this,
    open up the home page of the virtualization software which you have installed
    on your system and then choose Create Virtual Machine from the options.


    +   - After you are done with creating a new virtual machine, select the iso file
    or image of the Kali Linux OS which needs to be followed by the selection of guest
    operating system. You also need to configure each and every detail related to
    the virtual machine, like Kali Linux. You can now easily start the virtual machine
    related to Kali Linux after selecting the Kali Linux VM. After you have selected
    the VM, click on the green button Power button.


    +   - Right after the VM has been powered up, you will see a pop-up menu where
    you need to select your required installation mode in the menu of GRUB. Select
    the option of Graphical Installation and then select Continue.


    +   - The succeeding screens will be asking you to determine the information related
    to locale such as your preferred language in which you want to use Kali Linux,
    your location, keyboard layout and others.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   After you are done with all these, you will need to set up a strong password
    for the Kali Linux VM. Followed by this, the installer will be asking you to select
    the time zone and then will pause at the step of disk partition. You can either
    choose Entire Disk Space or Create Separate Partition for the VM.


    +   You will need to save all the changes but do not continue with the process
    as it will completely erase all the data which is present on the disk. So, always
    confirm the settings first before proceeding further.


    +   After this, you will be asked to install the GRUB boot loader. Select Yes
    and then choose the device for saving up the information of the boot loader which
    is needed for booting up the Kali Linux VM.


    +   Click on Finish and the installer will finish the final stage procedures.


    +   The OS can also be installed by the help of a bootable USB drive as well.'
  merge: -1
