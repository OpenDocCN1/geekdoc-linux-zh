    This whole command can be broken down like:


    - sudo: This command holds the administrator rights as you are dealing with a
    file or folder which is owned by another user.

    - chown: This command is used for changing the ownership.

    - -R: This command acts as the recursive switch for making sure that all the child
    objects obtain the same changes of ownership.

    - B: This is the new owner of the file/folder.

    - /DATA/SHARE: This is the directory which is being modified.


    ## GUI: Permissions for files


    Suppose you need to allow everyone to gain permissions of write and read for the
    folder EXAMPLE. For doing this within the file manager of your Linux distribution,
    you are required to follow all the following steps:


    - Open your Linux distribution.

    - Navigate to the file or folder which is the target in this case.

    - Right click on that folder or file.

    - Click on Properties from the menu.

    - Select the Permissions tab.

    - Select the Access Files option in the Others tab.

    - Click on Create and Delete Files.

    - Select Change Permissions for the enclosed files.

    - A window will pop up where you need to select Read and Write option under the
    tab of Files and Create and Delete Files under the Folders.

    - Select Change.

    - Click on Close.


    The trick comes into play when you need to modify the permissions for a folder
    which does not even belong to you. For doing this:


    - Open up the terminal window.

    - Enter the command: sudo -i.

    - Enter the command: Nautilus.


    The command sudo -i will give you a persistent form of access to sudo until you
    enter the command Exit for removing the access. Once Nautilus is opened, you can
    easily modify the permissions for the folder or file, even if the file or folder
    does not belong to you.


    ## GUI: Ownership modification


    You can change the ownership for a file through Nautilus by following these steps:


    - Locate the file or folder in the window of Nautilus.

    - Right click on the file/folder.

    - Select the Permissions tab.

    - Click on New Owner from the drop-down menu of Owner.

    - Select Close.


    ## Managing User Environment Variables


    The most common area in which newcomers to Linux find hardest to manage the user
    environment variables might also be the most obscure of all. Although the environment
    of Windows comes with environment variables, most of the users manage their own
    variables. For getting the most out of Linux OS, you will need to understand as
    well as manage all environment variables in the very first place for the optimal
    form of performance, convenience and stealth. The environment variables are the
    form of variables which are being used in the specific user environment. In majority
    of the cases, the environment will be the shell of BASH.


    Every user along with the root comes with a specific set of environment variables
    which are all set at some default values until they are modified.


    You can easily change all these values for the purpose of making your system perform
    more efficiently and also customize your working environment.


    ## Viewing the environment variables


    You can start by viewing all the environment variables by simply entering ‘env.’
    You will need to understand that all the available environment variables will
    be in upper case like PATH, SHELL, HOME, among many others. You can also create
    your own set of user-defined variables which will be discussed later. The command
    list will print out various variables which are unique to your system. In majority
    of the cases, this command list is so long that it cannot be viewed in one single
    page. For viewing all the variables arranged by line, you can print out the output
    by using the command More.


    After you have used the command More, the whole list of variables will be filled
    up on one screen and will stop. It will be waiting for you to hit the Enter key
    to advance to the next line. You can continue to do this until you have found
    any variable which you are looking out for. When you hit the Enter key a number
    of times, you will be finding out a variable known as HISTSIZE. When you again
    hit Enter, you will be taken through each and every variable of these, one after
    the other. When you are using the command More for viewing the output, you can
    enter q for quitting or exiting and then return to the prompt of command.


    In place of just scrolling this long list of variables, a tedious job to look
    for the variable of your interest, you can also use the command ‘grep’ which acts
    as the filtering command and will help in easily finding out your required variable.


    ## Viewing the values of the variables


    The command ‘set’ will be displaying all the names of the variables, but if you
    want to view the values which are stored within the variables, you will need to
