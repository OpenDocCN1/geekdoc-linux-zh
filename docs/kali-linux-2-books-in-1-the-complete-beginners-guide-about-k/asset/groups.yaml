    ## Some Advanced Command Line


    Most of the developers who work with the command line of Linux know the basic
    form of commands such as ‘cd,’ ‘ls,’ ‘tail,’ ‘head,’ ‘cat,’ ‘grep,’ ‘find,’ ‘sort’
    and many others. The advanced users will need to know how to function with the
    beasts such as ‘awk’ and ‘sed’ or even perl-oneliners. With knowledge of BASH
    scripting, you will find that imagination is the only limit. Let’s have a look
    at some of the advanced form of command line.


    - watch: This command performs as a very beautiful program which periodically
    executes a program and also outputs the contents of the s on full screen. In case
    you place the command within inside quotes, you can also run one command at a
    time such as watch -n 1 ‘ls -la; echo; vmstat; echo; df’ This command will be
    executing a full listing, displaying the statistics of memory along with the disk
    space. All of these will be separated with empty lines and will repeat after every
    second. It is a great way of watching large files get copied and also keeping
    an eye on the disk space so that it does not come up with any form of issue.


    - curl: Most of the PHP developers are acquainted with the curl extension of php
    which is also available for the command line of Linux. In place of writing any
