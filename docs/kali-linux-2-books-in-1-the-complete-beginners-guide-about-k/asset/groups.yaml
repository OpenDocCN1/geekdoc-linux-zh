    根据你的操作系统选择正确的程序版本并开始下载过程。下载完成后，运行可执行文件。


    图中显示了 VirtualBox 安装的欢迎对话框。点击“Next”（下一步）继续。


    本练习将不涵盖自定义配置或高级安装。接受对话框中显示的默认选项，并点击“Next”继续。


    # 安装

    - 1. 如图 5.3 所示选择你的图标设置，并点击“Next”。将显示系统关联警告，点击“Yes”继续。

    - 2. 点击 Install（安装）按钮。如果显示 Microsoft 用户账户控制（UAC）窗口，点击“Yes”继续。

    - 3. 安装可能会提示用户引入设备驱动程序，如图 5.6 所示。提示时点击“Install”继续。（这可能会发生几次。）


    安装完成后，点击“Finish”（完成）按钮。


    VirtualBox 安装已完成，如果勾选了“安装后启动 Oracle VM VirtualBox 4.2.16”设置，VirtualBox 将打开 VirtualBox
    Manager。现在不会创建虚拟机，因此可以关闭管理器。


    打开浏览器并返回：https://www.virtualbox.org/wiki/Downloads。下载 VirtualBox 4.2.16 Oracle
    VM VirtualBox Extension Pack。下载完成后，双击文档执行它。


    点击 Install 继续。在提示时同意最终用户许可协议。如果显示 Windows UAC，点击“Yes”继续。安装完成后关闭 VirtualBox。


    # 设置虚拟平台


    为了将所有内容保持在虚拟化实验室中，创建一个可以运行 Kali Linux 的虚拟机是一个明智的主意。下面的步骤描述了如何设置 Kali Linux 以引导启动运行。在尝试或修改
    ISO 时，可以使用此引导启动虚拟机且只需少量更改。


    # 在 VirtualBox 中为 Kali Linux 设置虚拟机


    打开 VirtualBox，点击“New”（新建）。


    # 创建虚拟机

    - 1. 为新虚拟机命名一个名称，此处使用 Kali-Linux-LiveDisc。将类型设置为 Linux，将变体设置为 Debian（64 位）（如适用），并点击“Next”继续。

    - 2. 此阶段将仅在虚拟机内存中运行。确保将 RAM 大小至少设置为 2 GB。如果可用，建议 4 GB 更好。

    - 3. 点击“Next”继续。下一步选择“创建虚拟硬盘”选项，并点击“Create”继续。

    - 4. 选择 VMDK（虚拟机磁盘）选项，并点击“Next”继续。

    - 5. 选择固定大小（Fixed Size）选项，并点击“Next”继续。

    - 6. 默认名称和硬盘大小适用于引导启动情况；任何，如果你想在 VirtualBox 中完整安装 Kali Linux，将虚拟硬盘大小更改为 40 GB。点击“Create”继续。

    - a. 完成完成后不要启动虚拟机。

    - 7. 选择 Kali-Linux-LiveDisc 虚拟机，然后点击 Settings（设置）按钮。在左侧菜单中选择 General（常规）并切换到 Advanced（高级）选项卡。将共享剪贴板设置为
    Bidirectional（双向），并将拖放设置设置为 Bidirectional（双向）。

    - 8. 在左侧菜单中选择 Storage（存储）。点击标记为为空的 Controller: IDE “光盘”符号。在右侧勾选 Live CD/DVD 。浏览到下载的
    Kali Linux ISO 文件。

    - 9. 在左侧菜单中选择 Network（网络），并将 Attached to（连接到）设置为 Host-only Adapter（主机适配器）。


