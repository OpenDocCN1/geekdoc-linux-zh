  mdcn: '

    此命令返回一个包含特定字符组的所有路径名称的大列表。该命令最简单的形式是查找从根目录开始的文件系统中的所有文件。如果你想找到符合你提供的特定标准且仅符合该标准的目录或文件，可以在使用命令时配合使用
    `–b` 参数，如 `locate –b \yourdata`。反斜杠在命令行中被用作通配符（globbing character），它提供了一种将非特定性质文件名中的通配符字符扩展为一组特定性质文件名的方法。


    通配符无非一种符号，在评估整个表达式时，它可以被轻松替换为一个或多个字符。最广泛使用的通配符符号形式是“?”，它表示单个字符；以及“*”，它表示一长串字符。`mlocate`
    命令是 `locate` 命令的新形式。它有助于索引整个文件系统。然而，搜索结果仅包含当前用户有权访问的文件。每当你更新 `mlocate` 数据库时，它会保留数据库中的时间戳信息。


    ## 使用 ‘which’ 命令


    此命令返回在发布任何命令时调用的可执行文件的确切路径。


    `which` 命令对于查找任何可执行文件的位置非常有用，其目的是在用户桌面、任何面板或桌面管理器中的其他地方为该程序创建快捷方式。`which` 命令默认只会显示第一个匹配的可执行文件。为了显示所有匹配的可执行文件，你需要在使用命令时配合使用选项
    `–a`。


    ## 修改文件


    Linux 以及其他各种操作系统提供的许多功能之一，就是创建以及编辑文本文件所需的工具。今天可以找到各种文本编辑器，每个 Linux 用户都有他们个人喜爱的。让我们来看看
    Linux 中一些最著名的文本编辑器。


    ## 文本编辑器


    如果你是 Windows 用户，那么你一定对被称为记事本的经典编辑器非常熟悉。Linux 也为用户提供了一些类似的程序，如 gedit、NEdit 和 geany。这些程序都是完全免费的，且每个程序提供的服务或多少相同。此类程序具有语法高亮功能，可以很方便地帮助编辑源代码以及用
    CSS 或 HTML 等任何标记语言编写的文档。


    - NEdit：这是一种简单的文本编辑器，大体与 Windows 记事本相似。它带有 Motif 风格的界面。

    - Geany：它是一个 Linux 文本编辑器，与 Windows 的 Notepad++ 不同。它带有标签页形式界面，用于同时处理多个打开的文件，并带有在侧边栏显示行号等其他功能。它使用
    GTK 界面工具包。

    - Gedit：这是 GNOME 桌面环境的默认文本编辑器。它是最好的文本编辑器之一，可以在任何类型的 Linux 系统上轻松使用。


    ## 基于终端的文本编辑器


    当你从 Linux 命令行（CLI）工作时，你有许多文本编辑器可选。让我们来看看其中一些。


    - **pico**：这种文本编辑器最初构建在名为 pine 的基于文本的电子邮件程序中。这种编辑器被封装成一个独立的程序，用于编辑和修改文本文件。这种编辑器的现代版本被称为
    alpine。在基于 Linux 的系统上，你可以使用命令安装此编辑器：`sudo apt-get install alpine-pico`。

    - **nano**：可以被视为 pico 编辑器的 GNU 版本，可以看作是不同名称下的类似程序。你可以通过命令 `sudo apt-get install
    nano` 在任何基于 Linux 的系统上安装 nano。

    - **vim**：它代表“vi improved”（改进版 vi），它作为文本编辑器运行，被大多数计算机专业人士使用。第一次使用这种编辑器的控制功能可能会感到有些困惑。随着你熟悉它，它可以让执行最复杂的编辑任务变得非常快速简单。如果你想在任何基于
    Linux 的系统上安装 vim，请命令：`sudo apt-get install vim`。

    - **emacs**：这是一种非常复杂且高度可定制的文本编辑器，带有一个用于 Lisp 编程语言的内置解释器。它专门供从事 Scheme 等 Lisp 方言工作的计算机专业人士使用。如果你需要在你的基于
    Linux 的系统上安装 emacs，使用命令：`sudo apt-get install emacs`。


    ## 将命令输出重定向到文本文件


    当你使用 Linux 命令行时，有时可能需要在不实际运行文本编辑器的情况下创建甚至更改任何文本文件。以下是你可以用于此目的的一些命令。


    ## 使用 touch 命令创建空文件


    为了创建空文件，你可以使用 `touch` 命令。在假设文件内容已更改但没有任何变化的情况下，该命令有助于更新文件的 mtime（修改时间）和 atime（访问时间）属性。当你
    touch 任何实际不存在的文件时，系统将创建该文件而不向其中放入任何数据。你可以使用如下命令：`touch myfile.txt`。只有当文件不存在时，此命令才会创建一个名为
    myfile.txt 的新空文件。


    ## 将文本重定向到任何文件


    有时你可能需要将命令的输出结果保存到特定文件中。为了轻松实现这一目标，你需要使用符号 `>` 将结果输出重定向到某些特定文件。例如，`echo` 命令被用于将文本作为输出。因此，命令将是：`echo
    "example text"`。此命令会将文本打印在屏幕上，然后返回命令行提示符。要将此相同输出重定向到文件，你可以使用 `>`。例如，`echo “example
    text">myfile.txt`。这将把“example text”文本放入名为 myfile.txt 的文件中。如果 myfile.txt 不存在，系统将创建它。如果它已经存在，该文件的所有内容将被覆盖；它将破坏该文件的原有内容并替换为新文本。


    ## 重定向到文件的末尾


    重定向操作符 `>>` 与 `>` 相似。然而，该命令不是覆盖文件内容，而是将新数据附加到该文件的末尾位置。例如，`ls -l>>directory.txt`。此命令将获取
    `ls -l` 的输出并将其添加到 directory.txt 文件中。如果文件不存在，系统将创建它。如果它已经在系统中存在，`ls -l` 的输出将附加到文件末尾，位于现有文件内容最后一行之后。

