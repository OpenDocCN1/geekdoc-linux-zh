    which is also used by the majority of computer professionals. The controls of
    this text editor might feel a bit confusing the first time. As you become familiar
    with it, it can make the execution of the most complex editing tasks very fast
    and easy. If you want to install vim on any system which is based on Linux use
    the command: sudo apt-get install vim.'
  - '[PAGE 54]


    +   - emacs: This is a very complex and highly customizable form of text editor
    which comes with a built-in interpreter meant for the Lisp programming language.
    It is specifically used by computer professionals who work in the dialects of
    Lisp like Scheme. If you are required to install emacs on your Linux based system,
    use the command: sudo apt-get install emacs.


    # Redirecting the command output into text file


    When you are using Linux command line, you might sometimes need to create or even
    make changes to any text file without running a text editor in actual. Here are
    some of the commands which you can use for this purpose.


    # Creating empty file with the command touch


    For the purpose of creating an empty file, you can use the touch command. This
    command helps in updating the mtime and atime attributes of the file assuming
    that the file contents have been changed whereas nothing changes. When you touch
    any file which does not exist in actual, the system will be creating file without
    putting any form of data inside the file. You can use the command like: touch
    myfile.txt. This command will be creating a new and empty file named as myfile.txt
    only if that file does not exist already.'
  - '[PAGE 55]


    # Redirecting text into any file


    Sometimes you might need to stick the resulting output of a command into a specific
    file. For accomplishing this motive easily, you need to use the symbol ''>'' for
    redirecting the resulting output to some specific file. For example, the command
    echo is being used for echoing text as the output. So, the command will be: echo
    “example text”. This command will print the text on your screen and then return
    to the command prompt. For redirecting this same output to a file you can use
    >. For example, echo “example text">myfile.txt. This will be putting the text
    “example text” into a file named as myfile.txt. In case the myfile.txt does not
    exist, it will be created by the system. In case it already exists, all the contents
    of that file will be overwritten; it will destroy the previous contents of that
    file and replace it with the new text.


    # Redirecting to the end of any file


    The operator of redirect >> is somewhat similar to the >. However, in place of
    just overwriting the contents of a file, this command appends the brand new data
    to the end position of that file. For example, -l>>directory.txt. This command
    will be taking the output from ls-l and then add it to the'
  - '[PAGE 56]


    file directory.txt. If the file does not exist, it will be created by the system.
    If it already exists in the system, the output of ls-l will be attached to the
    file end, after one line of the already existing file contents.


    # Adding and Removing Software


    If you have been using a Linux based system for a long time, you must have known
    that there are ways of doing the same thing in Linux. This includes installing
    software applications onto a machine based on Linux by using the command line.
    The majority of the Linux based users opt for the CLI to install new software
    in the system. Among the most commonly used methods for installing the software
    from the CLI is via the software repositories which is where the software files
    are stored. It is done by using package manager. All the software based on Linux
    is being distributed as packages which are nothing but files which are associated
    with the management system of packages. Each and every distribution of Linux comes
    along with a management system for the packages, however, all of them are not
    the same.


    # What is the package management system?'
- md: '

    Package management systems consists of a set of tools with various file formats
    which are utilized together for installing, updating and uninstalling Linux-based
    software. The two most commonly found systems of package management are from Debian
    and Red Hat. CentOS, Red Hat and Fedora use the rpm system of files in which the
    files are in the .rpm format while Ubuntu, Mint and Debian use the dpkg system
    of files in which the files are in the .deb format. The main difference of all
    these systems is the way you are going to install and maintain them.


    The inside contents of the .deb or .rpm files are somewhat like the old files
    of archive like the .zip which contains the code of the applications, the methods
    of installing the software, the dependencies and the location of where the configuration
    files need to be placed. The software which executes and reads all of the above
    mentioned instructions is known as the package manager.


    ## Ubuntu, Debian, Mint and various others


    Ubuntu, Debian, Mint and the rest of the Debian based distributions use the .deb
    format of files, along with the dpkg system of package management. There are two
    different ways of installing the applications through this system.


    You can employ the apt application to install the repository or you can also use
    the dpkg applications to install the apps from the .deb files. Let’s see how to
    perform both the functions.


    Installing the applications by using the apt command is very easy:


    ```

    $ sudo apt upgrade

    ```


    If you want to update only one application:


    ```

    $ sudo apt update app_name

    ```


    In case the application which you want to install in the system is not readily
    available within the repository of Debian and is available as .deb download:


    ```

    $ sudo dpkg -i app_name.deb

    ```


    ## Red Hat, Fedora and CentOS


    Red Hat uses various systems of package management, by default. All these systems
    use their own terminologies but are still somewhat similar to each other and with
    the ones which are used in Debian. For instance, you can use either dnf or yum
    manager for installing the applications.


    ```

    $ sudo yum install app_name

    ```


    ```

    $ sudo dnf install app_name

    ```


    The applications which are in the .rpm format can also be upgraded in the system
    with the help of the rpm command.


    ```

    $ sudo rpm -i app_name.rpm

    ```


    If you want to remove some of the unwanted applications from the system then:


    ```

    $ sudo yum remove app_name

    ```


    ```

    $ sudo dnf remove app_name

    ```


    When you want to update the applications:


    ```

    $ yum update

    ```


    ```

    $ sudo dnf upgrade --refresh

    ```


    ## Uninstalling software from Linux system


    You can install the software in the Linux system by using the repositories of
    the software. For viewing all the installed packages in the system you can use
    the command dpkg and then press Ctrl+Alt+T to open the terminal window. So, you
    can use the command like:


    ```

    dpkg --list

    ```


    You can scroll through the complete list of all the packages which have been installed
    in the system in the terminal window to find out what you want to uninstall from
    the system.


    For uninstalling a package or program, you need to use the command apt-get which
    is the basic command for the purpose of installing as well as for manipulating
    all the programs which have been installed already. For instance, this command
    will be uninstalling gimp and will also delete all its configurations by using
    the --purge command:


    ```

    sudo apt-get --purge remove gimp

    ```


    You will need to enter your password here and then hit Enter. The process of uninstalling
    the program will start and the summary of the required actions which needs to
    be taken will be displayed on the screen. If you are asked if you want to continue
    with the process, type ''y'' and then hit Enter. The process will continue. After
    the process is over, type ''exit'' in the prompt and then hit Enter. It will close
    the terminal window. In case you do not want to wipe the files of configuration,
    you will just need to leave out the --purge command:


    ```

    sudo apt-get remove gimp

    ```


    When you are uninstalling any program, there might be other packages on which
    the uninstalled set of program was dependent.


    For removing any of the unused packages in the systems, you can use autoremove:


    ```

    sudo apt-get autoremove

    ```


    You can also combine two commands together for the purpose of removing any program
    along with its dependencies which are not used any longer by:


    ```

    sudo apt-get purge --auto-remove gimp

    ```


    In case you are running out of space in the system, use the command clean for
    removing all the downloaded files of archive:


    ```

    sudo apt-get clean

    ```


    This command will also be removing the cache in /var/cache/apt/archives.


    So, installing and uninstalling software on Linux is a very easy and simple job
    using the command line.


    ## Controlling Files and Directory Permissions


    For most users of Linux, getting used to permissions and ownership of the files
    might be a bit challenging. It is assumed that for this usage level, using the
    command line is a must. Although there are several other more powerful and flexible
    options available, opting for the complicated commands is not always necessary.
    With help from some of the user-friendly interfaces of desktop, you can easily
    move to little or no usage of command line. It is possible to manage file ownership
    and permission as well.


    The management of folders and files can be easily done from the inside of the
    file managers only. But, right before we get away with GUI, you will need to have
    a concrete understanding of what it is doing. So, let''s start off with the command
    line.


    ## Command line: File permissions


    The commands associated with modification of file ownership and permissions are:


    - chmod: For changing the permissions

    - chown: For changing the ownership


    Neither of the two commands is difficult to use. It is really important for you
    to understand that the sole user who can actually change the permissions or ownership
    of the files is the root user or the current owner. So, in case you are user B,
    you will not be able to make any changes to the folders and files which are owned
    by A without seeking help of the root or sudo. For instance:


    A new folder has been created on a partition of data known as /DATA/SHARE. Both
    users A and B require write as well as read permissions for this folder. There
    are various ways in which this can be achieved. If A and B are the only two users
    on the present system, you can easily change all the permissions of the files
    and folders for giving them access. You can do this with the command:


    ```

    sudo chmod -R ugo+rw /DATA/SHARE

    ```


    In this command, the breakdown of each and every command will be:


    - - sudo: This command is used for the purpose of gaining overall administrator
    rights for the command on any form of system which employs sudo.

    - chmod: This command is used for modifying the permissions.

    - -R: This command modifies all the permissions of the parent state of folder
    along with the child objects which are in it.

    - ugo+rw: This command provides group, user and other write and read access.

    - In this command, u stands for user, g for group and o for other. The o or other
    entry is the most dangerous of all as it will be giving permissions to everyone
    for the files and folders.


    The permissions which can be provided for a folder or file are:


    1. r: read

    2. w: write

    3. x: execute


    The use of the switch -R is very important. In case you have various files and
    folders within the directory SHARE and you want the permissions to get applied
    from the parent object to the following child objects, you have to use -R switch
    to make sure that the same permissions are being applied down to the deepest folder
    contained within the object of parent.


    ## Command line: Ownership of file


    Changing the file and folder ownership is also very easy and simple. Suppose A
    moved out a folder for B into the directory named SHARE but still has the ownership.
    This whole thing can be modified by using a very simple command:


    ```

    sudo chown -R B /DATA/SHARE

    ```

