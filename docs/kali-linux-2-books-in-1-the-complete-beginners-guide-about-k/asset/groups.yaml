    - strace: The ‘trace’ command helps by tracing the calls of the system which are
    made by a particular program to the kernel of Linux. This indicates that you can
    see when a program is opened, closed, read, writes, access the files and many
    others. It is somewhat like running an entire program without any form of cover.
    For example, ‘strace -ff -e trace=open /usr/bin/apache2’ will strace the apache2
    program and will also output all the open calls.


    - z* tools: You will often need to diff, grep or cat the files which are compressed.
