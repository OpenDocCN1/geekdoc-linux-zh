    MAC 地址可以被任何系统的合法地址。有很多原因使得更改 MAC 地址非常重要。MacChanger 有助于在渗透测试期间更改 MAC 地址，例如对启用了
    MAC 过滤的无线网络进行渗透测试。使用 MacChanger，你需要遵循以下命令：


    ```

    ~$ macchanger [options] networkDevice

    ```


    可用选项有：


    - -h, --help: 打印帮助信息

    - -V, --version: 打印版本并退出

    - -e, --ending: 不更改厂商的字节

    - -s, --show: 打印 MAC 地址并退出

    - -a, --another: 设置为相似类型的随机厂商 MAC

    - -p, --permanent: 重置为原始形式的永久硬件 MAC

    - -A: 设置为任意类型的随机厂商 MAC

    - -r, --random: 设置完全随机类型的 MAC 地址

    - -l, --list: 打印已知的厂商

    - -m, --mac=XX:XX:XX:XX:XX:XX: 将 MAC 地址设置为 XX:XX:XX:XX:XX:XX


    # Nmap


    这是一个作为网络映射工具的工作。它允许用户发现任何网络内活动的主机形式，然后收集与渗透测试任务相关的所有形式的信息。该工具的主要功能是：


    - 它帮助发现主机。它可以轻松地识别网络中的主机。

    - 它带有端口扫描功能。它允许你枚举远程或本地主机上所有开放的端口。

    - 它有助于收集与任何连接设备的操作系统以及硬件相关的相关信息。

    - 它还帮助确定任何应用程序的名称和版本。

    - 它通过 Nmap 脚本引擎 (NSE) 扩展了 Nmap 的默认功能。


    # Netcat


    这是一个网络探索工具，在安全领域世界闻名，在系统和网络管理领域也为人所知。它主要用于检查入站和出站网络以及探测端口。当与 C 或 Perl 等其他编程语言或
    BASH 脚本结合使用时，它也非常有用。该工具的主要功能是：


    - 它对 TCP 和 UDP 端口进行分析。

    - 它对入站和出站网络进行嗅探。

    - 它有助于 DNS 的反向和正向分析。

    - 它对远程和本地端口进行扫描。

    - 它与标准终端输入完全集成。

    - 它带有 TCP 和 UDP 隧道模式。


    # Unicornscan


    这是一种用于信息收集和数据关联的信息安全工具。它带有对 UDP 和 TCP 端口的异步扫描，并具有发现网络模式的功能，这可以帮助发现远程主机的形式。它还可以提供有关它们运行的所有软件的细节。该工具的主要功能是：


    - 它对 TCP 端口进行异步扫描。

    - 它对 UDP 端口进行异步扫描。

    - 它对 TCP banner 进行异步检测。

    - 它可以检测操作系统系统服务以及应用程序状态。

    - 它具有使用自定义数据集的能力。

    - 它还支持 SQL 的关系输出。


    # Fierce


    这是一个用于网络映射和端口扫描的工具。它还可以用于发现各种网络中的不连续 IP 空间以及主机名。它与 Unicornscan 和 Nmap 相似，但与两者不同，Fierce
    专门用于企业网络。渗透测试人员定义目标网络后，该工具会对选域运行各种测试，以检索用于后期分析和利用的信息。该工具的主要功能包括：


    - 它具有更改 DNS 服务器以进行反向查找的能力。

    - 它执行内部外部 IP 范围扫描。

    - 它对 IP 范围以及整个 C 类网进行扫描。

    - 它有助于将功能记录到文件系统中。

    - 它发现名称服务器并发现区域传输攻击。

    - 它具有使用自定义或内置文本列表进行暴力破解的能力。


    Linux 还有许多其他工具可以帮助渗透测试以及道德黑客攻击。每种工具都有自己的一套易用性，任何渗透测试人员都可以轻松使用。


    # 第 6 章：Linux 编程


    在 Linux 上编程被用于创建接口、应用程序、软件和程序。Linux 代码经常用于桌面、嵌入式系统以及实时程序。Linux 是一个开源内核，兼容 Perl、C++、Java
    以及其他各种编程语言。


    # Linux 是如何工作的？


    Linux 当作操作系统的内核运行，也可以被自由分发和共享。操作系统（OS）是能够帮助用户与计算机硬件连接的接口，并支持应用程序和程序的运行。内核本质上就是核心，因为它管理着硬件和软件组件之间所有的通信。


    # Linux 程序员的功能是什么？


    Linux 编程开始使用诸如 GCC 编译器和调试器等工具。它们有助于创建用于数据存储的应用程序、构建 GUI 以及编写脚本。与 Linux 相关的高级应用程序允许程序员开发与
    Linux 相关的软件。它们优化了已有的程序，并编写具有各种复杂功能的新程序，如多进程、多线程、进程间通信以及硬件设备交互。


    # Linux 的用途


    Linux 如今广泛应用于各种服务器、计算机安全系统和计算机系统架构。它被广泛应用于实时程序以及 PDA 和手机的嵌入式系统。Linux 编程也产生了各种应用程序。


    # 如何开发内核？


    开始 Linux 编程使用诸如 GCC 编译器和调试器等工具。它们有助于创建用于数据存储的应用程序、构建 GUI 以及编写脚本。与 Linux 相关的高级应用程序允许程序员开发与
    Linux 相关的软件。它们优化了已有的程序，并编写具有各种复杂功能的新程序，如多进程、多线程、进程间通信以及硬件设备交互。


    在开始内核模块开发之前，增加知识和专业知识的最佳方法是从内核模块开始。内核模块是独立开发的，作为紧凑操作操作系统运行。内核模块由许多事物组成，如外围设备的驱动程序、文件管理器和其他低级功能。


    内核模块入口的唯一障碍远低于开发内核的障碍。有许多模块是由不同的个人和团队开发的。因此，在开发入口没有特定的守门人。


    # Linux 编程的逻辑拆解


    当你使用一些主要的操作系统形式时，你是在间接地与 shell 交互。如果你使用 Linux Mint、Ubuntu 或任何其他 Linux 发行版，你每次使用终端时都会与
    shell 交互。让我们讨论 Linux 编程的拆解，它由 Linux shell 以及 shell 脚本组成。


    因此在我们开始之前，你需要熟悉一些术语：


    - 内核

    - shell

    - 终端


    # 什么是内核？


    内核本质上是一个作为操作系统核心的程序。它对系统中所有的元素拥有整体控制。它有助于管理基于 Linux 的各种资源：


    - 文件管理

    - 进程管理

    - I/O 管理

    - 设备及各种其他组件的管理


    完整的 Linux 系统可以分解为：内核 + 安装脚本 + 其他管理脚本 + GNU 系统库和实用程序。


    # 什么是 shell？


    shell 是一种特殊的用户程序，有助于为与操作系统相关的服务提供良好的接口。shell 接收用户人类可读的命令，然后将其转换为内核可以理解的内容。它可以被视为命令语言的解释器，有助于执行从键盘等输入设备或从系统文件中读取的命令。shell
    在用户登录系统或启动终端时启动。


