    当你开始将平板电脑、智能手机、笔记本电脑或台式机等任何设备连接到 VPN 时，你的设备系统将开始表现得就像与 VPN 服务器来自同一个本地网络。设置的网络流量将通过安全连接直接传输到
    VPN。由于你的系统表现得就像与服务器来自类似的网络，当你在从世界的其他部分访问它时，它将允许你以高度安全的方式访问该本地网络的所有资源。你也可以像身处 VPN
    所在的精确位置一样浏览互联网，如果你在使用任何公共 Wi-Fi 或想访问任何类型的地理限制网站，这还伴随着一些额外的权限。


    当你通过连接虚拟私有网络开始浏览互联网时，你的设备将连接 VPN 网络，且本质上是绝对安全和加密的。VPN 通过转发用户请求，然后通过安全连接带回网站的响应提供帮助。例如，如果你使用英国的
    VPN 访问 Netflix 内容，Netflix 将看到你的连接仅来自英国的某个州。


    你可以在旅途中访问任何业务网络。当你旅行时连接到任何业务网络时，完全不需要将本地网络资源暴露在网上，这也有助于提高你业务网络的安全性。


    ## 第 10 章：无线网络简介


    在谈到网络传输时，最热门的话题之一是无线网络。它让人们达到了可靠性的新高度，并带来了让他们可以在没有任何电缆或线缆的情况下使用设备上网的便利。这一切之所以成为可能，仅仅是因为无线网络。在无线网络中，所有设备连接到网络交换机或路由器，这通过无线电建立设备与互联网之间的连接。所有信息和连接都是通过空气建立的。


    因此，它可以被视为一种移动形式的网络，你不再需要坐在一个地方上网。无线网络带有一些非常有趣的特征，将在本书中进一步讨论。所以，让我们从无线网络及其各种特性开始吧。


    ## 使用 Kali Linux 进行黑客攻击和渗透测试


    每个组织和公司都有某些被证明是恶意的弱点。这些弱点可能导致某些严重形式的攻击，随后可被用于操纵组织数据。


