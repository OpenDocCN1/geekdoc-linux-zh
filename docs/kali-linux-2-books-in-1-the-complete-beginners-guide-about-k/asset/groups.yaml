    # Chapter 8: Proxies and Proxy Chains


    With advances in technology, the number of hackers is also increasing day by day.
    While talking about hackers, some are good and some can be regarded as evil. The
    evil hackers use the methods of hacking for stealing valuable and confidential
    information, for money or some even hack just for fun. The evil hackers have the
    tendency to create a situation of havoc in the world of cyber security by spreading
    harmful malware and other malicious items. The good hackers might also hack for
    money. But they do it the proper way like taking part in a bug bounty, by helping
    others to properly backup all their lost data, learning the possible vulnerabilities
    within a system to make the administrators aware of the possible threats, among
    others.


    By “hacker,” it does not mean that they are the ones who can break into any form
    of restricted area within the world of cyber security; they are also IT experts
    who manage the security of a company or an organization. Most of the hackers are
    required to be anonymous at the time of hacking and they always try hard to make
    it difficult to detect them. There are various types of tools which are used by
    the hackers for hiding their identities such as VPN or Virtual Private Network,
    RDP or Remote Desktop Protocol and ProxyServers.


    To perform a penetration test absolutely anonymously and to decrease the overall
    chances of detection, hackers are required to use some kind of intermediary machinery
    whose very own IP address will be left back on the system of the target. The hackers
    fulfill this motive by the use of proxy. A proxy server or proxy is a form of
    dedicated system of software or computer which also runs on a computer system
    and acts as the intermediary between a client''s server and the end device like
    a computer system. By connecting with the Internet via the proxies, the IP address
    of the client system will not be displayed but the IP address of the proxy server
    will be shown in place of it. It helps in providing the clients with an increased
    amount of privacy when they connect directly with the internet.


    # The features of ProxyChains


    The primary features of ProxyChains are:


    - It supports SOCKS4, SOCKS5 along with HTTP CONNECT based proxy servers.

    - The ProxyChains can be mixed up with any other type of proxy in the list.

    - ProxyChains does support various methods of chaining such as: random in which
    any random proxy within the list which is stored within a file of configuration
    or chaining proxies in the similar list of order, the various form of proxies
    are kept separated from each other by the use of new line in the file. It also
    comes with a dynamic option in which the ProxyChains pass through only those proxies
    which are live in nature. It excludes any form of unreachable or dead proxy. This
    form of proxy is also known as the smart option.

    - You can use the ProxyChains with servers such as sendmail, squid and many others.

    - The ProxyChains also come with the ability of resolving DNS via the proxies.

    - It can handle any form of TCP client application which is telnet, nmap and others.


    # Syntax of ProxyChains


    In place of just running a simple penetration test or by creating various target
    requests directly by using your IP address, you can use ProxyChains for covering
    up and handling all these jobs. You will just need to add a command ‘proxychains’
    for every job. This will enable the service of ProxyChains.


    For instance, you want to scan some of the available hosts along with its ports
    in the network by the use of Nmap with ProxyChains, the command will look like:


    ```

    proxychains nmap 192.168.0.0/25

    ```


    The breakup of this command syntax will be:


    - proxychains: This will tell the machine to run the service of ProxyChains

    - nmap: Tells the ProxyChains about which jobs to be performed

    - 192.168.0.0/25 or some other argument: It is the argument which is needed for
    any form of tool or job and in this case, it is your scan range which is needed
    for Nmap to run the scan.


    # How can ProxyChains be used?


    Before you start to use ProxyChains, you will need to set up the configuration
    file for ProxyChains. You will also be requiring a list of the proxy servers.
    The configuration file of ProxyChains is located on /etc/proxychains.conf. Open
    up the proxychains.conf in any text editor of your choice and then set up the
    overall configuration. By default settings, the proxychains will be directly sending
    the overall traffic first via your host at 127.0.0.1 on the port 9050 which is
    the default configuration for Tor. In case you are also using Tor, you can leave
    this whole thing as it is. If you are not using Tor, you will be required to comment
    this line out.


    You will now need to add some more proxies. There are various free proxy servers
    that can be found on the Internet. Comment the proxy which is set by default for
    Tor. If you are not using it, then add the proxy on the config file of Proxychains
    and then save it.


    # Random_Chain VS Dynamic_Chain


    A Random Chain will allow you to choose the IP addresses in a random way from
    the list. Every time you use ProxyChains, the chain of the proxy will be looking
    different to the target and making it more difficult to track down the traffic
    from the source.


    In Dynamic Chain, you can run your traffic via every proxy on the list and in
    case any of the proxies is not responding or is down, the dead proxies are completely
    skipped out and it will automatically go for the next proxy in line without giving
    an error message. Each of the connections is done through the chained proxies.
    Each and every proxy on the list is chained in an order as they appear in that
    list.


    # Chapter 9: Virtual Private Networks


    Virtual Private Network or VPN is one of the latest techniques of setting up a
    super secure form of connection along with another form of network directly over
    the internet. VPNs are being widely used today for the sole purpose of accessing
    various websites which are restricted in various regions, for protecting all the
    activities of browsing from the prying eyes of public Wi-Fi and many others. Today,
    VPNs are widely popular but in most cases, it is not being used for the purpose
    for which it was developed. It was designed for connecting with the business network
    in a much more safe and secure way over the Web.


    It also came on the market with the objective of allowing the users to access
    their business networks from their home only. This technique functions by forwarding
    all forms of traffic within a network by providing several benefits like accessing
    of local network resources remotely, bypassing any form of censorship on the web
    in some places, etc. Many of the operating systems which can be found today in
    the market also come with VPN pre-installed.


    # Benefits of using VPN


    The concept on which VPN works is very easy and simple. It works by connecting
    a user directly with some other computer system or server over the internet. It
    then lets the user surf the contents available on the internet by bypassing and
    using the internet connection of that same server or computer. So, what makes
    VPN much more interesting is that if you have connected with a computer from some
    other province or country, it will show that you are also from that same country.
    So, you will be now able to access anything by using VPN along with those things
    which you couldn''t have done normally.


    You can use a VPN for a wide collection of purposes:


    - You can use VPN for the purpose of bypassing any restriction on any website
    which is based on province or geography. You can also use VPN streaming of audio
    and video.

    - You can watch any form of online streaming such as Netflix, Hulu etc.

    - You can protect yourself from the radars at the time of accessing torrents.

