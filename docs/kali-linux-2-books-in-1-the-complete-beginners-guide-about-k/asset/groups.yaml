    每个网络主机的物理形式形式的地址被称为 MAC 地址。它与网络接口卡（NIC）保持连接。你可以找到 48 位或 12 个半字节（nibble）的 MAC 地址。MAC
    地址是在设备制造时分配给设备的。


    # 第 8 章：代理与代理链


    随着技术的进步，黑客的数量每天都在增加。在谈到黑客时，有些人是友好的，而另一些人可以被认为是坏的。恶意黑客利用黑客手段来偷取昂贵和机密信息，为了金钱，有些甚至为了好玩而进行黑客。恶意黑客倾向于通过传播有害恶意软件和其他恶意物品，在网络安全世界制造混乱局面。好的黑客也可能为了钱进行黑客，但他们以正确的方式进行，例如参与漏洞赏金计划、帮助他人妥善备份所有丢失的数据、学习系统内部可能的漏洞以让管理员意识到可能的威胁等。


    “黑客”并不意味着他们是那些能够进入网络安全世界中任何受限区域的人；他们也是管理公司或组织安全的 IT 专家。大多数黑客在进行黑客活动时需要保持匿名，他们总是努力让自己难以被发现。黑客使用各种类型的工具来隐藏自己的身份，例如
    VPN（虚拟专用网络）、RDP（远程桌面协议）和代理服务器（ProxyServers）。


    为了完全匿名地执行渗透测试并降低整体被检测的概率，黑客需要使用某种中介设备，其自身的 IP 地址将留在目标系统中。黑客通过使用代理来实现这一目的。代理服务器或代理是专用软件或计算机系统的一种形式，它也运行在计算机系统上，并充客户端服务器与终端设备（如计算机系统）之间的中介。通过代理连接互联网，客户端系统的
    IP 地址将不会显示，而将代之显示代理服务器的 IP 地址。这有助于在客户端直接连接互联网时提供更多的隐私保护。


    # ProxyChains 的功能


    ProxyChains 的主要功能是：


    - 它支持 SOCKS4、SOCKS5 以及基于 HTTP CONNECT 的代理服务器。

    - ProxyChains 可以与列表中的任何其他类型的代理混合。

    - ProxyChains 支持多种链式方法，例如：随机模式（random），即在配置文件的列表中随机选择任何一个代理；或者按类似的列表顺序链式代理，通过文件中的换行符将不同形式的代理彼此分开。它还带有一个动态选项（dynamic），ProxyChains
    只通过那些本身处于活动状态的代理。它排除了任何形式的无法访问或失效的代理。这种代理形式也被称为智能选项（smart option）。

    - 你可以将 ProxyChains 与 sendmail、squid 等许多服务器一起使用。

    - ProxyChains 还具有通过代理解析 DNS 的。

    - 它可以处理任何形式的 TCP 客户端应用程序，如 telnet、nmap 等。


    # ProxyChains 的语法


    与其仅仅运行简单的渗透测试或直接使用你的 IP 地址创建各种目标请求，你可以使用 ProxyChains 来涵盖并处理这些工作。你只需要为每项任务添加命令
    `proxychains` 即可。这将启用 ProxyChains 服务。


    例如，你想使用 ProxyChains 通过 Nmap 扫描网络中的某些可用主机及其端口，命令看起来如下：


    ```

    proxychains nmap 192.168.0.0/25

    ```


    该语法如下：

    - proxychains:

    - nmap:

    - 192.168.0.0/25:


    # 如何使用 ProxyChains


    在开始使用 ProxyChains 之前，你需要通过代理设置任何形式的代理。ProxyChains 的配置文件位于 `/etc/proxychains.conf`。使用文本编辑器打开
    proxychains.conf。在默认情况下，它会连接到 127.0.0.1:9050。如果你不使用它，则可以在配置文件中注释掉它。


    你可以使用 ProxyChains 执行以下命令：


    - proxychains:

    - nmap:

    - 127.0.0.1:port:


    你现在需要添加更多的代理。如果你不使用它，则可以在配置文件中注释掉它。


    # 随机链 (Random Chain) 与 动态链 (Dynamic Chain)


    随机链（Random Chain）允许你以随机方式选择代理。每次当你使用 ProxyChains 时，代理将是不同的，从而更难追踪来源。


    在动态链（Dynamic Chain）中，如果列表中的任何代理没有响应或失效，它将完全跳过并自动进入下一个代理。每个连接都是按照列表中出现的顺序完成的。

