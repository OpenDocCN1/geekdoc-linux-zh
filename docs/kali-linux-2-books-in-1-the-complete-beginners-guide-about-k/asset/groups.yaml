    available inside and not the label of the variable.


    ## Exporting the environment variables


    When you modify any environment variable, it is only for that specific set of
    environment. In this case, the environment is the BASH shell. This indicates that
    when you close the terminal, any of the modifications which you have made to these
    variables will be lost and will go back to their default value.


    If you want the new variable values to stay for your next session of the terminal
    and the terminal session after that, you will need to export the variables. You
    can think of this as exporting the brand new variable value from the present variable
    to the remaining system to make sure it remains available in each and every environment.
    You can do this very easily by:


    ```

    export HISTSIZE

    ```


