    DNS，因此本节仅将对 DNS 进行简单概述。从根本上说，域名服务器将人类可读的名称（如 www.synergy.com）解释为 IP 地址，PC 和具有名称管理分段的设备更擅长处理这种地址。DNS
    与域名服务器同义，在人类友好的名称与 PC 良好的位置之间进行解释。例如，当一台 PC 需要与另一台 PC（例如一个 Web 服务器）通信时，它最初应该将易懂的位置解释为可以发送消息的
    PC 邻居地址。个人将在其首选程序中输入 www.synergy.com，PC 将将此位置发送到 DNS 机器。DNS 将通过提供该网站页面的 IP 地址（163.172.x.x）进行回答。客户的
    PC 然后将使用此 IP 地址与 Sygress Web 服务器通信，客户即可与 Syngress 网站进行协作。如果没有这种管理，人们将被记住每个网站的特殊
