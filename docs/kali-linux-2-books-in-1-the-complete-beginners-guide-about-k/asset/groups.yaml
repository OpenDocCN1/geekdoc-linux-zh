    Syngress 模型，IP 地址是 69.163.177.2，如果我们处于一个少于 255 个客户端的小型系统中，我们可以使用 C 类子网掩码 255.255.255.0。在应用掩码时，位置的部分被抵消，而其他部分保留，使得系统上的
    PC 知道自己所在的哪个系统。再次，子网掩码的一个基本示例仅使用 255 和 0 这两个数字字节位；因此，为了区分系统，协调位置的任何部分都不会发生变化，所以
    IP 地址的前三个字节（69, 163, 177）将与 255 协调，允许前面的数字通过。由于 0 被完全抵消，位置的最后一个字节（即 2）将被偏移，导致变为
