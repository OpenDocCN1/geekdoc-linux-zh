    \ based platform but it is also very susceptible to some specific types of vulnerabilities\
    \ which ultimately makes it easier for the attackers to exploit the device security\
    \ and then steal data from it. The most dangerous threats for mobile devices are\
    \ third party applications, email Trojans and SMS.\n\n## How are Wi-Fi attacks\
    \ carried out?\n\nMost of the network attacks are carried out by setting up rogue\
    \ Access Points.\n\n- Evil Twin attack: In this, the hacker sets up a false access\
    \ point with the same name as that of the corporate AP which is close to the premises\
    \ of the company. When any employee of the company connects to that access point,\
    \ that employee unknowingly gives out all the details of authentication of the\
    \ actual access point. Thus, the hacker can easily compromise the overall connection.\n\
    - Signal jamming: The hackers can easily disrupt the network connection which\
    \ can be done by jamming the network signals. This is done by various tools which\
    \ are used for creating noise.\n- Misconfiguration attack: When the router of\
    \ a network is set up using a default form of configuration, weak form of encryption,\
    \ weak credentials and algorithms, an attacker can easily crack the network.\n\
    - Hotspot attack: The attackers set up false hotspots or access points with the\
    \ same name of the SSID similar to any public Wi-Fi access point. When any user\
    \ connects with that access point unknowingly, the hackers can easily get access\
    \ to the actual network.\n\n## How to Carry Out an Effective Attack\n\nThe term\
    \ ‘hacking’ doesn’t mean that it has to be negative all the time. You will have\
    \ a proper idea about the overall process of hacking only when you will have a\
    \ clear perception about the process behind it. Not only will you be able to learn\
    \ about the process of hacking, but you will also be able to make your system\
    \ much more protected from external attacks. Most of the time, when an attacker\
    \ tries to gain access to a server of an organization or a company, it is generally\
    \ done by using 5 proper steps. Let’s have a look at those steps.\n[/content]\n"
  mdcn: "\n对于目标机器，Metasploit 的武器库配备了一套完整的后渗透工具，其中包括权限提升、哈希值传递（pass the hash）、屏幕截屏、数据包嗅探、枢纽和键盘记录器工具。如果你需要，当目标机器由于某种原因重启时，你可以轻松设置一个后后门。\n\
    \nMetasploit 每年都会加载越来越多的功能，并包含一个用于识别二进制文件中潜在安全漏洞的模糊器，以及一份很长的辅助性模块列表。我们目前为止讨论的只是使用\
    \ Metasploit 所能做的事情的高层愿景。整个框架本质上是模块化的，可以轻松扩展，并且拥有活跃的社区支持。如果它不能满足你的需求，你可以轻松对其进行调整以满足需求。\n\
    \n## 如何学习 Metasploit？\n\n你可以找到各种廉价甚至免费的资源来学习 Metasploit。学习 Metasploit 的最佳方法是下载\
    \ Kali Linux，然后安装一个虚拟机用于在目标上进行练习。\n\n维护 Kali Linux 并运行 OSCP 认证的组织 Offensive Security\
    \ 提供了一门包含 Metasploit 培训的免费课程，被称为 Metasploit Unleashed。\n\n## 在哪里可以下载 Metasploit？\n\
    \nMetasploit 可以随黑客软件 Kali Linux 一起找到。但如果你需要，也可以从 Metasploit 官方网站单独下载。Metasploit\
    \ 可以运行在 Windows 和 *nix* 系统上。你可以在 GitHub 上找到 Metasploit Framework 的源代码。Metasploit\
    \ 在互联网上也以各种形式存在。\n\n## 数据存储 (Datastore)\n\n数据存储可以被视为 Metasploit Framework 的核心元素。它无非是一个包含多个命名值的表，允许用户轻松配置\
    \ Metasploit 内部的组件行为。数据存储允许接口配置任何设置、用于定义参数的漏洞（exploits）以及用于补补操作码的负载（payloads）。它还允许\
    \ Metasploit Framework 在模块选项之间进行内部传递。你可以找到两种数据存储：使用 `setg` 定义全局数据存储，以及使用 `set`\
    \ 在数据存储模块级别定义模块数据存储。\n\n## SQL 注入与 Wi-Fi 破解\n\n提到网络攻击时，最广泛的形式之一是 SQL 注入攻击。在这种攻击中，攻击者执行威胁或无效格式的\
    \ SQL 语句，用于控制 Web 应用程序的数据库服务器。它还用于在用户完全不知情的情况下修改、删除或添加数据库中的记录。这最终会损害数据的完整性。避免或防止\
    \ SQL 注入所可以采取的最重要步骤是输入验证。\n\n## SQL 注入及其类型\n\n今天你可以找到多种类型的 SQL 注入。让我们来看看它们：\n\n\
    - 经典或带内 SQL 注入：\n  1. 基于错误（Error based）：攻击者利用数据库生成的错误来攻击数据库服务器。\n  2. 基于并集（Union\
    \ based）：在这种情况下，使用 UNION SQL 运算符来组合返回到 HTTP 响应的响应。\n- 推断或盲注 SQL 注入：\n  1. 基于布尔（Based\
    \ on Boolean）：基于返回真或假。\n  2. 基于时间（Time based）：发送 SQL 注入强制数据库在响应之前等待。\n- 带外 SQL\
    \ 注入（Out of band）：当攻击者无法使用类似的通道进行攻击和收集结果时，就会发生这种情况。\n\n## 用于 SQL 注入的工具\n\n有多种工具用于执行\
    \ SQL 注入。\n\n- SQLMap：该工具用于自动形式的 SQL 注入，并能帮助接管数据库。\n- jSQL Injection：这是一个基于 Java\
    \ 的工具，用于 SQL 注入。\n- Blind-SQL-BitShifting：通过位移（BitShifting）进行盲注 SQL 注入。\n- BBQSQL：一种盲注形式的\
    \ SQL 注入利用工具。\n- explo：一种机器和人类可读的漏洞测试格式。\n- Whitewidow：用于检查 SQL 数据库漏洞的扫描工具。\n\
    - Leviathan：它充当一个音频工具包。\n- Blisqy：用于在 HTTP 头部中利用基于时间的 SQL 注入。\n\n## SQL 注入的检测工具\n\
    \n一种名为 Spider testing tool 的工具被广泛用于通过 POST 或 GET 请求手动识别 SQL 注入漏洞。如果你能解决代码中的漏洞，就可以轻松地防止\
    \ SQL 注入。你还可以使用 Web 漏洞扫描器来识别代码中的所有缺陷并进行修复以防止 SQL 注入。Web 应用程序或应用层中的防火墙也可以广泛用于防止任何形式的入侵。\n\
    \n## Wi-Fi 破解\n\nWi-Fi（或无线网络）是当今世界用于网络连接的首选媒介。然而，由于其流行性，无线网络也面临各种攻击以及若干安全问题。如果攻击者获得了网络连接的完全访问权限，攻击者可以从任何附近的位置嗅探数据包。攻击者利用嗅探工具寻找\
    \ SSID，然后破解 Wi-Fi 或无线网络。在成功破解后，攻击者可以监控所有设备。\n\n## 破解 Wi-Fi 的工具\n\n为了破解 WEP，攻击者使用诸如\
    \ Acrack、Aircrack、Kismet、WEPDecrypt 等多种工具。为了破解 WPA，会使用 Cain 和 Cowty 等工具。还有其他常用工具，如\
    \ wireshark、Airsnort、Wifiphisher、Netstumbler 等。Android 可以被认为是最常见的手机平台，但它也非常受到某些特定类型漏洞的影响，这最终使得攻击者更容易利用设备安全并从中窃取数据。对移动设备最危险的威胁是第三方应用程序、电子邮件木马和短信。\n\
    \n## 如何进行 Wi-Fi 攻击？\n\n大多数网络攻击都是通过设置流造访问点（Rogue Access Points）实现的。\n\n- 恶意孪胎攻击（Evil\
    \ Twin attack）：在这种情况下，黑客设置一个与公司场所附近的企业 AP 命名相同的虚假访问点。当公司的任何员工连接到该访问点时，该员工在不知情的情况下提供了实际访问点的所有身份验证详细信息。因此，黑客可以轻松地破坏整个连接。\n\
    - 信号干扰（Signal jamming）：黑客可以通过干扰网络信号来轻松中断网络连接。这是通过各种用于产生噪声的工具实现的。\n- 配置错误攻击（Misconfiguration\
    \ attack）：当网络路由器使用默认配置形式、弱加密形式、弱凭据和算法进行设置时，攻击者可以轻松破解网络。\n- 热点攻击（Hotspot attack）：攻击者设置与任何公共\
    \ Wi-Fi 访问点 SSID 名称相同的虚假热点或访问点。当任何用户无意中连接到该访问点时，黑客可以轻松进入实际网络。\n\n## 如何执行有效的攻击\n\
    \n“黑客”一词并不意味着它总是是负面的。只有当你对背后的过程有清晰的感知时，你才会对黑客的整个过程有一个正确的理解。你不仅能够学习黑客的过程，还能让你的系统受到来自外部攻击的保护。大多数时候，当攻击者尝试获取组织或公司的服务器访问权限时，通常是使用\
    \ 5 个正确的步骤完成的。让我们来看看这些步骤。\n"
