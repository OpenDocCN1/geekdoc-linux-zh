    This command returns a large list of all the names of the paths which also contains
    the specific character groups. The simplest form of this command finds out all
    the files within the file system which starts at the root. In case you want to
    find all the directories or files which contains the proper and only the criteria
    of search which you have provided, use the argument ‘–b’ along with the command
    as locate –b \yourdata. The backslash has been used in the command line acts as
    a globbing character which gives a way for expanding the characters of wildcard
    within a file name of non-specific nature into a set of filenames of specific
    nature.


    A wildcard is nothing but a symbol which can be easily replaced by one or more
    than one characters when the overall expression is being evaluated. The most widely
    used form of wildcard symbols are “?” which indicates one single character and
    “*” which indicates a long string of characters. The command ‘mlocate’ is a new
    form of the ‘locate’ command. It helps in indexing the complete file system. However,
    the results of search include only the files which the current user has access
    to. Whenever you update the database of ‘mlocate,’ it will keep the timestamp
    information within the database.


    ## Using the command ‘which’


    This command returns the exact path of the executable which is being called when
    any command is issued.


    The ‘which’ command is very useful for finding out the location of any executable
    for the purpose of creating a shortcut of the program on the user desktop, on
    any panel or on some other place within the desktop manager. The ‘which’ command
    by default will only display the first executable which is matching. For the purpose
    of displaying all the executables which are matching, you need to use the option
    ‘–a’ along with the command.


    ## Modifying Files


    One of the many things that Linux along with various operating systems provides
    is the tools needed to create as well as for edit the text files. There are various
    text editors that can be found today and every Linux user has their personal favorite.
    Let’s have a look at some of the most famous text editors in Linux.


    ## Text editors


    If you are a Windows user then you must be familiar with the classic editor known
    as Notepad. Linux also offers users somewhat similar programs such as gedit, NEdit
    and geany. All of these programs are absolutely free and each provides more or
    less the same service. Such programs come with the facility of syntax highlighting
    which readily helps in editing the source code along with the documents which
    are written in any markup language like CSS or HTML.


    - NEdit: This is a form of straightforward text editor which is more or less like
    the Windows Notepad. It comes with Motif-style of the interface.

    - Geany: It is a Linux text editor which is not similar to the Notepad++ from
    Windows. It comes along with a tabbed form of interface for the purpose of working
    with various open files at one time and also comes with other features such as
    displaying the line numbers in one margin. It uses the interface toolkit of GTK.

    - Gedit: This is the default form of text editor for the GNOME desktop environment.
    It is one of the best text editors which can be easily used on any type of Linux
    based system.


    ## Text editors based on terminal


    When you are working from the Linux CLI, you have a wide range of choice in text
    editors. Let’s have a look at some of them.


    - **pico**: This text editor started off the editor which was built in the email
    program which was also text based known as pine. This text editor was eventually
    packaged as one stand-alone program for editing and modifying the text files.
    The modern-day version of this text editor is known as alpine. On the system based
    on Linux, you can install this text editor using the command: sudo apt-get install
    alpine-pico.

    - **nano**: This can be regarded as the GNU version of the text editor pico and
    can be taken as the similar program under a completely different name. You can
    install nano on any Linux based system by using the command: sudo apt-get install
    nano.

    - **vim**: This stands for ‘vi improved’ and it functions as a text editor which
    is also used by the majority of computer professionals. The controls of this text
    editor might feel a bit confusing the first time. As you become familiar with
    it, it can make the execution of the most complex editing tasks very fast and
    easy. If you want to install vim on any system which is based on Linux use the
    command: sudo apt-get install vim.

    - **emacs**: This is a very complex and highly customizable form of text editor
    which comes with a built-in interpreter meant for the Lisp programming language.
    It is specifically used by computer professionals who work in the dialects of
    Lisp like Scheme. If you are required to install emacs on your Linux based system,
    use the command: sudo apt-get install emacs.


    ## Redirecting the command output into text file


    When you are using Linux command line, you might sometimes need to create or even
    make changes to any text file without running a text editor in actual. Here are
    some of the commands which you can use for this purpose.


    ## Creating empty file with the command touch


    For the purpose of creating an empty file, you can use the touch command. This
    command helps in updating the mtime and atime attributes of the file assuming
    that the file contents have been changed whereas nothing changes. When you touch
    any file which does not exist in actual, the system will be creating file without
    putting any form of data inside the file. You can use the command like: touch
    myfile.txt. This command will be creating a new and empty file named as myfile.txt
    only if that file does not exist already.


    ## Redirecting text into any file


    Sometimes you might need to stick the resulting output of a command into a specific
    file. For accomplishing this motive easily, you need to use the symbol ''>'' for
    redirecting the resulting output to some specific file. For example, the command
    echo is being used for echoing text as the output. So, the command will be: echo
    “example text”. This command will print the text on your screen and then return
    to the command prompt. For redirecting this same output to a file you can use
    >. For example, echo “example text">myfile.txt. This will be putting the text
    “example text” into a file named as myfile.txt. In case the myfile.txt does not
    exist, it will be created by the system. In case it already exists, all the contents
    of that file will be overwritten; it will destroy the previous contents of that
    file and replace it with the new text.


    ## Redirecting to the end of any file


    The operator of redirect >> is somewhat similar to the >. However, in place of
    just overwriting the contents of a file, this command appends the brand new data
    to the end position of that file. For example, -l>>directory.txt. This command
    will be taking the output from ls-l and then add it to the file directory.txt.
    If the file does not exist, it will be created by the system. If it already exists
    in the system, the output of ls-l will be attached to the file end, after one
    line of the already existing file contents.

