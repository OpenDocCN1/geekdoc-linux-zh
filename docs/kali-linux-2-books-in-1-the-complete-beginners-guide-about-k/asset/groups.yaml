    ## Chapter 7: Basics of Networking


    In today’s world where everything comes with the touch of technology, networking
    has turned out to be a mandatory component for setting up a new business or organization.
    Networking helps in seamlessly connecting with a set of related devices or systems
    with the endpoints or rather the host or master system via various forms. It holds
    a very important position for all providers of services, businesses and the consumers
    all around the globe to communicate and interconnect with each other at the same
    time.

    The concept of networking comes along with almost everything such as text messages,
    calling on the telephone, streaming of video and many more.


    The operation of networks comes along with some serious set of skills which largely
    depends on its complexity. For example, in a large enterprise where there are
    several nodes along with requirements of network security such as functioning
    of the administrator, encryption and various others. On the other hand, any person
    who just uses networking along with the internet for day to day work at home can
    set up easily along with troubleshooting the several problems of basic nature
    within the nature of wireless networks.


    ## Networking basics


    For properly understanding the functioning of networking along with its components,
    you will need to know about the basics. A network of computer systems is built
    up of several elements which help in the overall functioning.


    ## Types of networking


    Networking of computers can be classified into two main categories: wired and
    wireless. While talking about a wired network, it requires a physical form of
    network which is needed for the transportation of information between the two
    nodes. For digital communication in business places and homes, Ethernet cables
    are being used owing to their overall cost-effectiveness along with durability.
    Today, optical fibers are also being used for transportation of data across long
    distances.


    Optical fibers also offer a faster rate of speed than Ethernet cables. However,
    Ethernet cables are much cheaper when compared with optical fibers.


    In a wireless form of networking, radio waves are utilized for data transportation
    through the air. In this, the devices are connected to one another without any
    type of cables in between them. Wireless LAN is being used most widely for the
    purpose of wireless networking. There are various alternatives which can be found
    today like Bluetooth, satellite, cellular, microwave and various others.


    After various practical experiences, it has been found that the wired form of
    networking comes with much better speed and security plus reliability as compared
    with the wireless mode of networking. But, with wireless networking comes greater
    probability of scalability, mobility and flexibility than the wired form of networking.
    Both types of networking are being classified in accordance with the physical
    layer of the networks. It can also be differentiated according to the build and
    design structure of the networks, network overlay and approaches which are made
    for encompassing SDN. The networks can also be categorized by the scale, WAN,
    LAN, network storage area, environment and various other aspects.


    ## Networking system and its types


    When you come across networking systems you will find two different types: open
    and closed. Within an open system, the whole system stays connected with the network
    which is ready for any type of communication. In a closed system, the system stays
    unlinked with the network and you will not be able to connect with the network.


