    # Chapter 3: Kali Linux External Boot Drive


    Kali Linux is a well-renowned name in the world of information security. It has
    been funded and maintained by Offensive Security which is a provider of services
    related to penetration testing and information security. Kali Linux has become
    a go-to distribution for the purpose of hacking. Within a few minutes, you can
    have a functioning box of pen testing along with various sets of tools that you
    can find anywhere else. Kali Linux comes pre-installed with a wide array of tools
    which reduces the stress of installing other tools.


    ## Various options available for running Kali Linux


    You can have the option of installing Kali Linux completely on your system. But,
    in most cases, the systems which you need for the purpose of Penetration testing
    or ethical hacking might require you to still keep Windows or any other OS as
    the primary form of operating system. In such cases, what you are left with is
    to use a virtualization tool and then use the same for running Kali Linux within
    a virtual machine. However, if there is a lack of memory in the system running
    on Windows or any other OS, it might result in crashing the VM frequently. Another
    option is to run Kali Linux on an external USB drive with Kali Linux installed
    on it.


    The only problem that comes with this option is the lack of encryption.


    # What is the best option?


    Installing and then running Kali Linux from an encrypted form of external bootable
    USB drive is regarded as the best option.


    But, you also need to secure the same. So, for doing that, you need to follow
    these steps.


    - Start by using a USB drive which is owned by the concerned company.

    - Perform full installation of Kali Linux to 1 TB USB drive by using complete
    encryption of disk on the drive.

    - You then need to encrypt the data on the USB drive. As the onboard drive is
    also in the encrypted state by using a different form of encryption, the onboard
    drive will not be accessible as well as at the time of booting to the OS which
    is working from the USB drive.

    - As the USB drive which you are using is owned by the company, the all-over data
    which is used stored in the hardware of the concerned company.

    - After the entire project is over, you can hand over the external USB drive to
    the company and all the related information of testing and data is returned to
    the client.


    # Getting started with Kali Linux on USB drive


    To start the process, you need to download the ISO file of the Kali Linux installer
    and then burn the image to the external USB drive you are using. Insert the external
    USB drive into the machine on which you are going to run Kali Linux. Make sure
    that you insert the USB drive into the system before booting the system.


    - **Setting up the drive:** The next step that you need to follow is to set up
    the drive, encrypting and partitioning the same. A dialog box will appear which
    will be asking you to choose the partition type which you want for the installation.
    Opt for Guided-Use Entire Disk for the best performance. This also helps in fully
    encrypting the USB drive when compared to just encrypting the directory of /home.
    Always remember that the tools of Kali Linux store all the data in various other
    places other than the home directory at the time of penetration testing.

    The next screen will be asking you to choose the disk on which you want to install
    it. At this point, make sure that you pick the desired USB drive to install Kali
    Linux and not on any local drive of the system. If you select any of the local
    drives, you will be wiping the OS from that particular drive. After you have selected
    the USB drive click on Continue.


    - The next window will be asking you how to partition the USB drive. Select All
    Files on one partition and click on Continue.


    - Next, you will be asked to save all the information of partition and then the
    process of partitioning the drive will start. When you select continue, all the
    data on the USB drive will be erased. So, before clicking on Continue, select
    the Yes option.


    - The process of disk encryption will start along with the process of partitioning.
    The drive is completely erased first and then encrypted. This entire process will
    take a while. If you are using a USB drive of 64 GB, it will take 30 minutes to
    get encrypted. If you are using a 1 TB USB drive, it will take approximately 10
    hours for encryption.


    - After the process is complete, you will be asked to provide a passphrase which
    will be used for encryption. Make sure that you use a strong one as this will
    be used at the time of booting up Kali Linux.


    - Next, confirm the changes and then select Finish Partitioning.


    - Now the system will begin the process of partitioning and after the process
    has been completed, the installation system will start.


    - You will also be asked if you want to use any Network Mirror. Click on Yes as
    this will be selecting the repo mirrors which are nearby your location and will
    also help in speeding up the process of update later.


    # Booting Kali Linux


    Insert the USB drive into the machine and then start it up. At the booting process,
    open up the boot menu and select the USB drive which you want to use. Now you
    will be required to enter the passphrase and after successful entry, the system
    will start.


    # Chapter 4: Basics


    Before we start with other aspects of Kali Linux, it is necessary for you to learn
    about some of the basic tools and commands that come with Linux.

    Let''s have a look at some of the most basic components.


    # Essential Linux Terminal Commands


    In relation to the other operating systems which are available in the market and
    Linux in particular, when it comes to the term Command, it means a line of command
    for the applications or the functionalities which are built into the shell of
    the user. However, this distinction is of very little consequence for the end-users.


    Both of them are used in the same way. You need to input the words into the emulator
    of your terminal and it will provide results as outputs.


    # Linux commands for management of file system


    - **ls**: This command helps in listing all the contents in the current directory.
    When you provide the same with a path, it will list the specific contents of that
    path only. Some of the useful options you need to know are -l and -a, it displays
    information as a long list format which comes with much more detailed information
    and also shows the dot or hidden files.


    - **cat**: When provided with one single file, this command helps in printing
    the contents of that file to the output in standard style. When you provide the
    command with many files at a time, it concatenates them and then the output is
    redirected into a completely new file. The most useful is the option of -n which
    helps in numbering the lines.


    - **cd**: This command helps in jumping from the present directory to some other
    specified directory. When you use this command without any argument, it will return
    to the home directory. When you use this command with two dots such as ‘cd..’
    it will return you to the directory which is right above the present one and using
    the command with a dash such as ‘cd –’ will return to the directory just before
    the current one, regardless of the location in relation to the present directory.


    - **pwd**: This command helps in printing the current directory. This command
    is very useful when your prompt does not contain this specific information. It
    is very useful for BASH programming which is used for obtaining the directory
    reference of the one in which you are going to execute the code.

