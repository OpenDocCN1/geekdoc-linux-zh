    \ Framework on GitHub. Metasploit is also available in various forms on the internet.\n\
    \n## Datastore\n\nThe datastore can be regarded as a core element of the Metasploit\
    \ Framework. It is nothing but a table of several named values which allows the\
    \ users to easily configure the component behavior within Metasploit. The datastore\
    \ allows the interfaces to configure any of the settings, exploits for defining\
    \ the parameters and also payloads for the purpose of patching the opcodes. It\
    \ also allows Metasploit Framework to pass internally between the options of modules.\
    \ You can find two types of datastores, the Global datastore which can be defined\
    \ by using ‘setg’ and the Module datastore which can be defined at the modular\
    \ level of datastore by using ‘set’.\n\n## SQL Injection and Wi-Fi Hacking\n\n\
    When it comes to cyber attacks, one of the most widely forms is the SQL Injection\
    \ attack. In this, an attacker executes threat or invalid form of SQL statements\
    \ which are used for database server control for an application of the web. It\
    \ is also used for modifying, deleting or adding up records within the database\
    \ without even the user knowing anything about it. This ultimately compromises\
    \ the integrity of the data. The most important step which can be taken for avoiding\
    \ or preventing SQL injection is by input validation.\n\n## SQL Injection and\
    \ its types\n\nThere are various types of SQL injection which you can find that\
    \ today. Let’s have a look at them.\n\n- Classic or In-band SQL injection: \n\
    \  1. Error based: Attackers employ the generated error by the database to attack\
    \ the database server.\n  2. Union based: In this UNION SQL operator is employed\
    \ for combining a response for returning to the HTTP response.\n- Inferential\
    \ or Blind SQL injection: \n  1. Based on Boolean: It is based on return of true\
    \ or false.\n  2. Time based: Sends out SQL injection which forces the database\
    \ just before responding.\n- Out of band SQL injection: This takes place when\
    \ an attacker is unable to use the similar form of channel for attacking and gathering\
    \ the results.\n\n## Tools used for SQL injection\n\nThere are various tools which\
    \ are used for carrying SQL injection.\n\n- SQLMap: This tool is used for an automatic\
    \ form of SQL injection and it helps in taking over the database.\n- jSQL Injection:\
    \ It is a Java based tool which is used for SQL injection.\n- Blind-SQL-BitShifting:\
    \ It is used for blind SQL injection by the use of BitShifting.\n- BBQSQL: It\
    \ is a blind form of SQL injection exploitation tool.\n- explo: It is a format\
    \ of machine and human readable vulnerability testing.\n- Whitewidow: It is a\
    \ scanning tool which is used for checking out the vulnerabilities of the SQL\
    \ database.\n- Leviathan: It acts as an audio toolkit.\n- Blisqy: It is used for\
    \ the purpose of exploiting time-based SQL injection within the headers of HTTP.\n\
    \n## Detection tools for SQL injection\n\nA tool named Spider testing tool is\
    \ widely used for the purpose of identifying the holes of SQL injection manually\
    \ by the use of POST or GET requests. If you can resolve the vulnerabilities within\
    \ the code then you can easily prevent the SQL injections. You can also use a\
    \ web vulnerability scanner for identifying all the defects within the code and\
    \ for fixing the same to prevent SQL injection. The firewalls present in the web\
    \ application or within the application layer can also be used extensively for\
    \ preventing any form of intrusion.\n\n## Hacking of Wi-Fi\n\nWi-Fi, or wireless\
    \ networking, is the most preferred medium which is used for the purpose of network\
    \ connectivity in today’s world. However, because of its popularity, the wireless\
    \ networks are also subjected to various attacks, along with several issues of\
    \ security. If the attacker gains complete access to the network connection the\
    \ attacker can sniff off the data packets from any nearby location. The attackers\
    \ employ sniffing tools for finding out the SSIDs and then hacks the Wi-Fi or\
    \ wireless networks. After successful hacking, the attackers can monitor all the\
    \ devices.\n\n## Tools for hacking of Wi-Fi\n\nFor the purpose of cracking WEP,\
    \ the attackers use various tools such as Acrack, Aircrack, Kismet, WEPDecrypt\
    \ and many others. For cracking WPA, tools such as Cain and Cowty are used. There\
    \ are also other tools which are used in general like wireshark, Airsnort, Wifiphisher,\
