    # 第 3 章：Kali Linux 外部启动盘


    Kali Linux 是信息安全领域闻誉全球的名字。它由 Offensive Security 资助和维护，该公司是渗透测试和信息安全相关服务的提供商。Kali
    Linux 已成为黑客攻击的首选发行版。在几分钟内，您就可以拥有一个功能完备的测试箱，以及在其他地方可能找不到的各种工具集。Kali Linux 预装了大量工具，减少了安装其他工具的压力。


    ## 运行 Kali Linux 的各种选项


    您可以选择在您的系统上完全安装 Kali Linux。但在大多数情况下，您用于渗透测试或伦理黑客攻击的系统可能要求您仍保留 Windows 或任何其他操作系统作为主操作系统。在这种情况下，您只能使用虚拟化工具，然后在虚拟机中运行
    Kali Linux。然而，如果运行 Windows 或任何其他操作系统的系统内存不足，可能会导致虚拟机频繁崩溃。另一个选项是在安装了 Kali Linux
    的外部 USB 驱动器上在并运行 Kali Linux。


    这种方案带来的唯一问题是缺乏加密。


    # 什么是最佳选项？


    从加密的外部可启动 USB 盘上安装并运行 Kali Linux 被认为是最佳选项。


    但是，您还需要确保其安全。因此，为了做到这一点，您需要遵循以下步骤。


    - 首先使用相关公司拥有的 USB 盘。

    - 使用磁盘完全加密功能，在 1 TB USB 盘上对 Kali Linux 进行完整安装。

    - 随后，您需要对 USB 盘上的数据进行加密。由于内置硬盘也通过不同形式的加密处于加密状态，因此在从 USB 盘启动到操作系统时，内置硬盘也将无法访问。

    - 由于您使用的 USB 盘是公司拥有的，所有使用的数据都存储在公司的硬件中。

    - 整个项目结束后，您可以将外部 USB 盘交回公司，所有相关的测试信息和数据返回给客户。


    # 在 USB 盘上开始 Kali Linux


    要开始此过程，您需要下载 Kali Linux 安装程序的 ISO 文件，然后将镜像写入您正在使用的外部 USB 盘。将外部 USB 盘插入到将要运行 Kali
    Linux 的机器上。确保您在启动系统之前将 USB 盘插入系统。


    - **设置驱动器：** 您需要遵循的下一步是设置驱动器、对其进行加密和分区。将弹出一个对话框，要求您选择安装所需的分区类型。选择“引导式使用整个磁盘”（Guided-Use
    Entire Disk）以获得最佳性能。与仅对 /home 目录加密相比，这也有助于对整个 USB 盘进行完全加密。请始终记住，在渗透测试时，Kali Linux
    的工具会将所有数据存储在主目录（home directory）之外的各种其他地方。

    接下来的屏幕将要求您选择要安装 Kali Linux 的磁盘。此时，请确保您选择的是用于安装 Kali Linux 的目标 USB 盘，而不是系统的任何本地驱动器。如果您选择了任何本地驱动器，将删除该驱动器上的操作系统。选择
    USB 盘后，点击“继续”。


    - 下一个窗口将询问您如何对 USB 盘进行分区。选择“所有文件分区”（All Files on one partition）并点击“继续”。


    - 接下来，系统将要求您保存所有分区信息，然后开始分区过程。当您选择继续时，USB 盘上的所有数据将被擦除。因此，在点击继续之前，请选择“是”。


    - 磁盘加密过程将与分区过程同时开始。驱动器先被完全擦除然后进行加密。整个过程将需要一段时间。如果您使用 64 GB 的 USB 盘，加密将需要 30 分钟。如果您使用
    1 TB 的 USB 盘，加密大约需要 10 小时。


    - 过程完成后，将要求您提供一个用于加密的口令（passphrase）。请确保使用强密码，因为将在启动 Kali Linux 时使用它。


    - 确认更改并选择“完成分区”。

    - 现在系统将开始分区过程，分区完成后安装系统将启动。


    - 系统将询问您是否要使用任何镜像（Mirror）。点击“是”，这将选择附近的镜像并有助于加速更新。


    # 启动 Kali Linux


    将 USB 盘插入机器并启动。在启动过程中，打开启动菜单并选择要使用的 USB 盘。现在将要求输入口令，输入成功后系统将启动。


    # 第 4 章：基础


    在开始 Kali Linux 的其他方面之前，您有必要了解一些基础工具和命令。

    让我们来看一些基础组件。


    # 常用 Linux 命令


    相对于市场上的其他操作系统，特别是 Linux，当谈到“命令”（Command）一词时，它是用于应用程序或功能的单行指令。然而，这种区别对于终端用户来说意义不大。


    这两者的使用方法相同。您需要在您的终端模拟器中输入单词，它将提供输出结果。


    # 管理文件系统的 Linux 命令


    - **ls**: 此命令有助于列出当前目录下的所有内容。当向它提供路径时，它将仅列出特定路径的内容。您需要了解的一些有用选项有 -l 和 -a，它以长列表格式显示信息，包含更详细的信息，并显示点点隐藏文件。


    - **cat**: 当提供单个文件时，此命令有助于将文件内容以标准格式打印到输出中。当向命令提供多个文件时，它会将它们合并，然后输出重定向到一个全新的文件。最有用的选项是
    -n，它有助于行排序。


    - **cd**: 此命令有助于从当前目录跳转到指定的目录。当您不带任何参数使用此命令时，它将返回主目录。当您使用带有两个点的命令 `cd..` 时，它将带您返回上一级目录；使用带有连字符的命令
    `cd –` 则将返回到之前的目录，无论其相对于当前目录的位置如何。


    - **pwd**: 此命令有助于打印当前目录。当您的提示符不包含此特定信息时，此命令非常有用。它对于获取执行代码时的目录引用的 BASH 编程非常有用。


