    ## Ubuntu, Debian, Mint 以及其他版本


    Ubuntu、Debian、Mint 以及其他基于 Debian 的发行版都使用 .deb 格式的文件，并配合 `dpkg` 软件包管理系统。通过该系统安装应用程序有两种不同的方法。


    你可以使用 `apt` 应用来安装仓库，也可以使用 `dpkg` 应用从 `.deb` 文件安装应用。让我们来看看如何执行这两种功能。


