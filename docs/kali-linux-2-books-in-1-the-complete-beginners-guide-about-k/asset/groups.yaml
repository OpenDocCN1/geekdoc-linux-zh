    ```


    如果你只想更新一个应用程序：


    ```

    $ sudo apt update app_name

    ```


    如果要在系统中安装的应用程序在 Debian 仓库中并无法直接找到，而是以 .deb 下载的形式提供：


    ```

    $ sudo dpkg -i app_name.deb

    ```


    ## Red Hat, Fedora 和 CentOS


    Red Hat 默认使用多种包管理系统。所有这些系统都使用自己的术语，但彼此之间以及与 Debian 的术语仍然有些相似。例如，你可以使用 `dnf` 或
    `yum` 管理来安装应用程序。


    ```

    $ sudo yum install app_name

    ```


    ```

    $ sudo dnf install app_name

    ```


    处于 .rpm 格式的应用程序也可以通过 `rpm` 命令在系统中进行升级。


    ```

    $ sudo rpm -i app_name.rpm

    ```


    如果你想从系统中删除某些不需要的应用程序，可以执行：


    ```

    $ sudo yum remove app_name

    ```


    ```

    $ sudo dnf remove app_name

    ```


    当你想更新应用程序时：


    ```

    $ yum update

    ```


    ```

    $ sudo dnf upgrade --refresh

    ```


    ## 从 Linux 系统中卸载软件


    你可以通过软件仓库在 Linux 系统中安装软件。要查看系统中所有安装的包，可以使用 `dpkg` 命令，然后按 `Ctrl+Alt+T` 打开终端窗口。因此，你可以使用命令：


    ```

    dpkg --list

    ```


    你可以在终端窗口中滚动查看系统中已安装的所有包的完整列表，以找到你想从系统中卸载的内容。


    要卸载一个包或程序，你需要使用 `apt-get` 命令，它是用于安装以及操作所有已安装程序的基本命令。例如，此命令将使用 `--purge` 命令卸载 gimp
    并删除其所有配置：


    ```

    sudo apt-get --purge remove gimp

    ```


    你需要在此处输入密码并按回车键。程序的卸载过程将开始，屏幕上将显示需要采取的所需操作的摘要。如果系统询问你是否继续继续该过程，输入 ''y'' 然后按回车键。过程将继续。过程完成后，在提示符输入
    ''exit'' 然后按回车键。这将关闭终端窗口。如果你不想擦除配置文件，只需省略 `--purge` 命令即可：


    ```

    sudo apt-get remove gimp

    ```

