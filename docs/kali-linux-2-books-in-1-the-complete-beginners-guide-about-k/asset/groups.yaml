    ## By using the command ‘find’


    The command ‘find’ will allow you to search for the files for which you already
    know the probable filenames. The command in its simplest form searches for all
    the files within the present directory and then through the sub-directories of
    the same depending on your search criteria. You can search out for the files by
    using the name, group, owner, type, date, permissions and various other criteria.
    Enter a dot (.) after the command as ‘find.’ which will be listing all the files
    in the present directory which has been found. In order to find a file which matches
    with some particular pattern, you can use the argument –name. You can provide
    the metacharacters of the filename like * but you will need to put ‘\’ in front
    of them or enclose the same within quotes. In case the find command cannot locate
    any of the files which are matching with your criteria, it will produce no output.


    ## Using the command ‘locate’


    The command ‘locate’ is much faster when compared to ‘find’ as it employs a past
    built database, where the command ‘find’ searches within the real system along
    all the actual files and directories.

