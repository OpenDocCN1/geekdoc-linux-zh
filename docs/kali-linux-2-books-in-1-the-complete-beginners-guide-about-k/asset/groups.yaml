    # 在阅读本章之前：构建实验室


    个人如何获得机会来练习、检查和熟悉滥用程序呢？搭建一个实验室并投入其中吧！既然互联网随手可得，为什么要自己制造实验室呢？这是一个非常基础的问题，答案非常简单：因为没有人想进监狱。想象一下测试不属于你的系统会怎样。攻击政府或金融系统（如银行）可能会导致
    20 年或更长的监禁。


    对政府或州法律的无知并不能作为实施数字犯罪的借口。要谨慎、要机敏、要构建实验室。本节的活动基于免费获取的学习应用程序和编程。在进入后续部分之前，构建实验室是非常明智的。


    # 零成本构建实验室


    在虚拟化时代之前，信息技术（IT）专家、安全专业人员和学生都拥有装满 PC 设备的车库、地下室和其他房间。有时，这些 PC 和系统管理硬件从地板堆到天花板，电费单高得惊人。拥有大量的设备是一种折磨；如果你需要搬家，想象一下带走它们有多难。感激现在不是这样了。


    无论你的 PC 运行的是 Windows、Mac 还是 Linux 操作系统，处理家庭虚拟化都有两种基本方法。这两个项目都不需要费用，并且适用于大多数运行
    32 位或 64 位架构的各种操作系统。


    # VMWare Player


    优点

    - 虚拟机（VMs）创建在专用于 NAT 的虚拟交换机上。许多虚拟机将能够选项相互通信，并可能从主机进行访问。

    - 自然引入了 DHCP，因此所有虚拟机都可以相应获取 IP 地址。

    - 对 Xen、XenServer、vSphere 等其他主流虚拟机程序提供高级虚拟化支持。


    缺点

    - 不支持 Mac、Solaris 或 FreeBSD 操作系统。

    - 不考虑现有虚拟机的快或克隆。

    - 与某些 Wi-Fi 组织连接器存在困难。


    # VirtualBox


    优点

    - 适用于 Windows、Linux、Mac、Solaris 和 FreeBSD。

    - 具有克隆虚拟机的功能（节省时间）。

    - 支持日益增多的虚拟硬盘记录类型。这在运行下载和预制的虚拟机时特别有帮助。


    缺点

    - 除非在主机上启用了端口转发，否则虚拟机之间是相互隔离的。

    - 不支持 Xen、XenServer、vSphere 或其他类型虚拟机程序所需的硬件虚拟化。

    - 如果虚拟机崩溃，整个虚拟机损坏的概率更高。


    本指南专门针对在 Microsoft Windows 7 专业版上引入的 Oracle VirtualBox 版本 4.2.16。选择使用 VirtualBox
    而不是 VMware Player 是因为互联网上有更多资源可以在出现问题时提供帮助；尽管它需要一些额外的配置。


    请记住，在选择虚拟化框架时，最好的测试就是你的研究。关于哪种最好有很多讨论，最终选择一个虚拟化框架而不是另一个是个人喜好。同样，与防病毒软件不同，两者都可以引入以满足不同的需求，因此可以在同一台
    PC 上安装 VirtualBox 和 VMware Player。本指南使用的所有链接和引用在编写时是有效的。请注意功能、下载区域和数据可能会随时更改。


    # 在 Microsoft Windows 7 上安装 VirtualBox


