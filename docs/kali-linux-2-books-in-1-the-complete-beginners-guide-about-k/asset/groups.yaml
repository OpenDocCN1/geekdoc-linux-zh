    ## Programming in Linux Using Java


    Java is one of the most popular languages of programming. It is widely used for
    the purpose of developing software for almost everything starting from cell phones
    to the cable TV boxes and extending its use to the large systems of enterprise
    information. The overall concept behind writing the source code of Java, compiling
    and then running it is more or less the same across most of the OS.


    Java is a programming language which was originally developed by Sun Microsystems.
    It falls under the category of compiled form of programming language in which
    the programmer writes the source code and then submits the same to the compiler
    which will be checking out the syntaxes of the program and will generate a complete
    file which you can run. For instance, when you are using Google Chrome web browser,
    you are in true sense running all the programs which have been generated from
    a compiler which is used by the software developers.


    To a wide extent, the programming languages of the past needed you to re-compile
    all the source code for every new OS in which you wanted to run your program on.
    For instance, a program which has been compiled for running in Windows will not
    be running on a system which has Linux in it unless it has been re-compiled. Given
    the wide differences in the OS and the elements of hardware, this process was
    very difficult and complicated to carry out. One of the major motivations for
    Java was the motivation of being able to write only one single set of source code
    and then provide the resulting program with the ability to run on some different
    set of operating systems or environments of operation.


    Java comes with write once and then run anywhere capability only because of the
    way in which the compiler translates the entire source code in a particular file
    known as Byte Code which can then run under any form of supported JRE or Java
    Runtime Environment.


    The development process of Java involves these steps:


    - Write down the Java source code and then save it in one or more plain text files.
    All of these files generally come with .java format at the end.

    - Run the compiler of Java (javac) for compiling the source code which you have
    written into a file of Byte Code. The Byte Codes generally have .class at the
    end of the name of the file.

    - Run the program after submitting the byte code to a JRE.


    ## Downloading Java Development Kit


    For doing any of the programming stuff with Java, you will need to download, and
    then install, Java Development Kit or JDE. In most cases, when you come across
    the installation of Java in a system it means the installation of Java Runtime
    Environment or JRE. In this example, you will need JDK which comes with a special
    type of program named as javac which is used for compiling the Java source codes
    into the class files. You can download JDK from the official website of Oracle.


    While downloading the JDK, make sure that you download the one which matches with
    the operating system that you are currently using. In this case, if you are using
    Linux, download the file which is supported by Linux OS. Most of the distributions
    of Linux like Ubuntu, Debian, Red Hat and others, come with a tool of software
    repository which helps in automating the installation along with the download
    steps. For instance, the distribution of Ubuntu and Debian, the command apt-get
    is used for downloading and then installing JDK such as:


    ```

    sudo apt-get install openjdk-7-jdk

    ```


    For installing the OpenJDK under Fedora, CentOS and other distributions which
    use up YUM, you can use this command:


    ```

    yum install java-1.7.0-openjdk

