- md: '

    - **Reconnaissance**: This can be regarded as the very first step in the hacking
    process. During this phase, the attacker uses all the available means for the
    purpose of collecting all forms of relevant information about the primary target
    system. The relevant set of information might include the proper identification
    of the target, DNS records of the server, range of the IP address which is in-target,
    the network and various other aspects. In simple terms, the attacker tries to
    collect all sorts of information along with the contacts of a website or server.
    This can be done by the attacker by the use of several forms of search engines
    like maltego or by researching about the system which is the target or by using
    the various tools like HTTPTrack to download a complete website for enumeration
    at a later stage.


    By performing all these steps, the attacker will be able to determine the names
    of all the staffs within an organization very easily, find out the designated
    posts along with the email addresses of the employees.


    - **Scanning**: After collecting all the relevant information about the target,
    the attacker will now start with the process of scanning. During this phase, the
    attacker employs various forms of tools like dialers, port scanners, vulnerability
    scanners, sweepers and network mappers for the purpose of scanning the target
    website or server data. During this step, the attackers try to seek out all the
    information which can actually help in the execution of a successful attack such
    as the IP address of the system, the user accounts and the computer names within
    that server. Right after the hackers are done with scanning of basic information,
    they start to test the target network to find out the possible avenues of attack.
    They might also employ several methods for network mapping just like Kali Linux.
    The hackers also search for any automatic email system by which they can mail
    the staff of the target company about some false form of query like mailing the
    company HR about a job query.


    - **Access gaining**: This is the most important of all the steps. In this phase,
    the attacker designs the blueprint of the target network along with the help of
    all relevant information which is collected in the first and second steps. As
