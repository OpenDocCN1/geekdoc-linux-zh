    LED 和其他设备让 Raspberry Pi 与环境互动。


    **你花了多长时间从概念到成品？在构建过程中遇到了任何问题吗？**


    SmartPlantPi 套件的开发大约花了三个月时间，从项目开始到套件文档完成。我们在硬件设计上做出的重大选择是决定采用 Grove 连接器系统。Grove
    系统是一种标准插头，用于连接各种小型计算机设备。总的来说，市面上大约有 200 种不同的 Grove 传感器，来自不同制造商。所有 Grove 连接器尺寸相同，有四根线，但有四种类型：FC、数字、模拟和串行。采用全
    Grove 设计意味着 SmartPlantPi 完全不需要焊接，这使得该项目对各级别的创客都更加易接近。


    **对于可能不了解 SmartPlantPi 的人，你能给他们介绍一下这个项目是什么吗？**


    SmartPlantPi（或简称 Smart Plant）是一个入门级的、易于构建的基于 Raspberry Pi 的环境监测和植物浇水系统，使用先进的传感器监测土壤湿度、监测阳光、监控空气质量和温度湿度。它被设计为易于简单组装和测试，无需焊接。Smart
    Plant 还配有 USB 控制的泵、水流传感器、用于水的塑料管和用于控制的按钮。


    **你会说这个项目的重点在于教育吗？成年人也能从中受益吗？**


    嗯，我们为创客市场构建的一切都旨在教育和学习。制作就是教育。制作就是学习。构建自己的项目允许你在框架周围创新，并做出我们从未想过的美妙事情。


    > “制作就是学习。构建自己的项目允许你创新”


    Smart Plant 的教育目标是：


    - 了解 Raspberry Pi 和在其上安装软件

    - 将传感器连接到 Raspberry Pi

    - 了解反馈回路和调节植物用水

    - 理解你的室内环境及其影响因素

    - 了解被称为物联网的新兴技术


    **Raspberry Pi 在这里起什么作用？**


    Raspberry Pi 是该系统的关键组件。它是大脑。我们可以使用更简单的计算机（如 Arduino）设计这个系统，但我们希望提供 Pi 和 Linux
    的功率，以便让 Smart Plant 能够连接到物联网和 Alexa。为此，我们需要计算能力，Raspberry Pi 在一个廉价的项目中提供了所有这些。


    **我们听说 Smart Plant Pi 捆绑了多个传感器，它们为这个项目带来了什么？**


    传感器包提供了一个完整的室内环境监测系统。温度、湿度、阳光、紫外线指数，以及一个非常酷的传感器：空气质量传感器。我们惊讶于这个廉价传感器的敏感性。我们可以检测整个房屋中的各种事件。需要指出的一点是，传感器几乎总是低于
    3200（评级为新鲜空气），整个期间的平均值是 2727。


    **人们能够跟踪他们植物的进度吗？**


    当然，有几种方法。第一种是内置的 OLED 显示屏。它显示状态，并在检测到时闪烁警报。其次，我们可以使用 PubNub 和 Freeboard.io 在互联网上监控你的植物（如何操作的教程是
    SmartPlantPi 文档的一部分）。这是我们演示植物的实时链接：freeboard.io/board/BhKt4Y


    **在这个项目中，你发现与 Raspberry Pi 合作感觉如何？你以后会在其他项目中使用它吗？**


    Raspberry Pi 在这个项目中是设计和原型制作产品的项目的最佳和最强大的平台。我们可以构建能够做惊人事情的项目，并利用数千个可用的 Raspberry
    Pi 软件包和传感器。


    **我们的下一个 Raspberry Pi Kickstarter 是什么？我们正在构建一个板，允许创客在 Raspberry Pi 上使用一些神经网络硬件辅助来实验人工智能。你能想象我们能用它构建什么吗？技术不必只是技术人员的领域。我们所有人都可以成为这个未来的一部分。学习。制作。重复。**


    ![](img/6866071e033820549b214c239744aaa0_72_1.png)


    **John Shovic**

    在硬件工程领域度过了 30 多年，是 50 多篇论文的自豪作者，包括对 Arduino 和 Raspberry Pi 的报道。


    **喜欢吗？**

    你可以增强一份相当令人难以置信的作品集，他在他的网站 switchdoc.com 上详细介绍了其中的大部分内容。一定要查看网站的教程部分，其中充满了针对初级和高级
    Pi 项目的提示和技巧。


    **延伸阅读**

    SmartPlantPi 的整个过程相当复杂，如果我们这里的简要概述还不够，那么请确保转到 switchdoc.com 网站，那里有完整的详细说明。


