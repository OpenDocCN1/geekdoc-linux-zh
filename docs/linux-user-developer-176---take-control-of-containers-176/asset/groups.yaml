    adaptor card is accessible to the host just as the host memory is accessible to
    the device (albeit perhaps with security restrictions) and changes to that memory
    are immediately visible on either side of the interconnect. Implementing coherency
    requires a coherency protocol and a large amount of complexity, but the upside
    is that device memory can be managed just like host system memory. Which brings
    us to an RFC (Request For Comments) patch series posted by Anshuman Khandual of
    IBM. His ‘Define coherent device memory node’ aims to extend the existing kernel
    notion of NUMA (Non-Uniform Memory Access) to support the creation of device nodes
    that contain struct page structures managed by the Linux kernel in much the same
    way that it manages normal RAM today.


    The use of NUMA is interesting. In a NUMA machine (think multi-socket server),
    all parts of the system share a global memory, but may experience relative differences
    in performance for accesses that aren’t local to the NUMA node. Thus a CDA (Coherent
    Device Access) in the new world order would be able to see the same memory as
    another node containing CPUs, but Linux would know that such accesses may go across
    an interconnect. Anshuman’s patches are very interesting because they start to
    implement something a lot of us have wanted for years: allowing application software
    to directly map accelerator memory without the need for special device drivers
    at all. It’s early days, but this kind of work could eventually make using accelerators
    much easier.


    The full thread is available here: [https://lkm.lol/lkm1/20170/29/198](https://lkm.lol/lkm1/20170/29/198).


    ## Ongoing development


    Kernel development rarely stands still (perhaps it yields to a crawl during the
    annual Kernel Summit for those who are attending) and this month was no different.
    Two discussion threads caught our author’s attention. One had to do with the implementation
    of error handling for VFIO, the other focused on ongoing work to better understand
    and to document memory ordering in Linux.


    VFIO (Virtual Function I/O) is a Linux kernel abstraction that generically represents
    IOMMUs (IO Memory Management Units) and allows virtual functions provided by adaptor
    cards (such as PCIe) to be assigned into guest virtual machines. Such VMs see
    the performance of dedicated hardware while retaining the management and isolation
    benefits afforded through virtualisation. In the latest round of work, Michael
    S. Tsirkin seeks to extend the existing limited support for handling PCIe AER
    errors into a generic mechanism to report underlying host link errors into VMs.


    Meanwhile, Paul McKenney (author and co-inventor of the RCU Read Copy Update mechanism
    used within the Linux kernel for lock-free scalable data structures, as well as
    a wonderful free online book on parallel programming known as the ‘perf book’)
    has continued his work to describe the memory ordering models used by various
    computer architectures. Most people are completely unaware of memory ordering
    and how it works because they are used to the strong model employed by Intel x86.
    Many alternative models exist, however, and they have implications for low-level
    primitives (such as RCU) in terms of how changes to memory are observed between
    multiple processors (agents, processing elements, or observers), and in what order.
    Paul is working with a number of others (such as Will Deacon of ARM) to better
    describe these models and capture their semantics. Most recently, he was fishing
    for access to a live DEC Alpha machine to test out some assumptions.


    Finally this month, **kernel.org** (the site that hosts much of the Linux kernel
    development, and is supported through the donations of companies and others who
    want to support Linux) announced that it is finally discontinuing FTP service
    this year. Beginning 1 March, 2017 it will no longer serve our kernels via FTP.
    Mirrors.kernel.org will follow in December. FTP isn’t the only service from a
    bygone era that kernel.org has implemented over the years. It once implemented
    a public NFS/CIFS (yes, Windows) server, but that was a fairly brief occurrence
    for obvious (security) reasons.


