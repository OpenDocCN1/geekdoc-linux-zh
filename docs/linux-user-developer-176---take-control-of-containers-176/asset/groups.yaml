    FPGA（现场可编程门阵列）是一种非固定功能的硅片，包含数百万（甚至更多）未固定的门电路，可以动态地以几乎任何配置进行布线。这使得无需实际花费设计并制造完整芯片的成本，就能快速实现自定义硬件逻辑。当然，使用
    FPGA 也有缺点（否则没人会费心制造自己的芯片了）：它们比全定制芯片消耗更多能源，速度比定制芯片慢，并且生产和购买成本更高。尽管如此，FPGA 可以实现执行速度远快于当代
