    ## 声音编辑器


    ### EKO 声音编辑器 5.3.1


    简单快捷的软件总有其用武之地


    ![](img/6866071e033820549b214c239744aaa0_91_0.png)


    无论你使用的是非常老旧的笔记本电脑、像树莓派（Raspberry Pi）这样的小型主板，还是只是想快速完成一项简单任务而不想阅读那长达 200 页的说明书，日常工具总有需要简单版本的时候。Eko
    是一款声音编辑器，支持 OLA 或 OF5，依赖项极少，主要依靠你可能已经安装的软件，例如 libsndfile。


    该软件由 Peter Semiletov 编写，他也是我们曾在 **LU&D #159** 中评测过的 Tea 编辑器的作者。这是一个较新的项目，虽然功能远非全面，但正处于相当积极的开发阶段。安装过程一帆风顺。源码压缩包中附带了一份
    HTML 格式的手册，有英语和俄语版本，涵盖了各项功能的基础内容。


    在实际使用中，多窗口布局在近期单窗口界面的趋势下显得略微过时。不过这也自有其合理性，因为音频文件编辑是主要任务，其他功能均为周边辅助。编辑功能虽然精简，但当你想快速完成简单的音频任务时，这是一款很棒的应用程序。


    该软件以公有领域（Public Domain）许可证授权，但在作者的网站上有一个链接，用于向乌克兰当地的一个流浪狗收容所进行捐款。


    ![](img/6866071e033820549b214c239744aaa0_91_1.png)


    *上方图片* 简单的捕获和简单的效果——有时，快速简便比强大复杂更好！


    - **优点**

    - 安装简便，依赖项少，学习曲线平缓——简单且相当用户友好。


    - **缺点**

    - 即使对于简单的编辑器，它也可能缺少你最喜欢的功能。HTML 手册略显基础。


    > **非常适合...**

    > 在别人还在加载时就能完成的快速编辑。

    >

    > semiletov.org/eko/index.html


    ## CPU 信息工具


    ### cpuid 20170122


    将详细的 CPU 信息输出到命令行


    ![](img/6866071e033820549b214c239744aaa0_91_2.png)


    当你不确定自己登录的机器上是什么处理器时，可能运行过 `cat /proc/cpuinfo`，特别是在下载针对特定芯片编译的软件之前。它告诉你所需的信息，但在其他场合，你或许想要查看制造商写入芯片的
    CPUID 信息的完整输出。


    Cpuid 是一个实用的小型命令行工具，用于获取这些信息并将其输出到命令行。输出内容长达数页。还有一个选项可以输出原始十六进制信息，该工具的作者总是乐于收到这种形式的输出，以有助于进一步调试和更新
    cpuid。更新很频繁，引入了新的芯片系列并修复了错误——通常反映的是制造商的 CPUID 实现中的错误，而不是工具本身的错误。


    在各种机器上下载、解包和运行都毫无问题，这总是一个好兆头（有很多应用就是因为不够“配合”而未能出现在这些页面上）。附带的手册页（man page）对某些芯片系列的问题提供了一些见解——所有
    x86 架构，ARM 及其他处理器在输出方面没有直接的等效方案——并提供了进一步阅读材料。除了二进制压缩包外，还有 RPM 和源码包可用。这是 UNIX 精神下另一个出色的小工具，程序只做一件事，但做得极好。


    - **优点**

    - 尽可能详细、准确且保持最新。包含手册页。


    - **缺点**

    - 对于第一次寻找 CPU 信息的人来说，界面略显晦涩。不支持 ARM。


    > **非常适合...**

    > 确实省去了拆下散热片去检查的麻烦！

    >

    > etallen.com/cpuid.html


    ## 字节码转 JavaScript 编译器


    ### Js_of_ocaml 2.8.4


    浏览器中的 OCaml：强大、富有表达力、类型安全的代码


    也许你是通过 OCaml 的亲戚 SML，以及华盛顿大学关于编程语言的美妙 MOOC（大规模开放在线课程）接触到 OCaml 的；也许是因为对 F# 父系语言的好奇，或者可能是在寻找能编译为
    JavaScript 的静态类型语言。也许这是你第一次关注它。无论你是如何来到这里的，欢迎进入强静态类型和运行时错误大幅减少的世界。


    从操作系统的包管理器安装 OCaml，你将获得 OPAM 包管理器，从中


    ```bash

    opam install js_of_ocaml

    ```


    将获取所有依赖项。然而，Js_of_ocaml 也是 Ocsigen Web 应用程序框架的一个组件，并且


    ```bash

    opam install ocsigen-start

    ```


    将给你一个包含在更广泛包组中的 Js_of_ocaml。网站提供了 API 文档和关于如何使用 Ocsigen 的教程。使用 Ocsigen 组件 Eliom，你可以在单个程序中编写客户端和服务器端
    OCaml 代码，并实现自动双向通信。会话机制允许功能响应式网页，而且相当复杂的站点只需很少的代码行数即可实现。由于 Js_of_ocaml 以 OCaml
    字节码作为输入，即使对于没有源代码访问权限的 OCaml 库，你甚至也可以配合使用。如果你从未写过 OCaml，不要害怕跳入其中，冲破困惑继续前行。


    - **优点**

    - 富有表达力的语言，在运行时安全性方面记录良好，且没有运行时检查的开销。


    - **缺点**

    - Hindley-Milner 类型系统对某些人来说过于严苛（不妨试试 ClojureScript！）。


    > **非常适合...**

    > 通过单次遍历或函数式处理编写可执行的 Web 代码。

    >

    > ocamldoc 或指南: ocsigen.org/js_of_ocaml/


    ## 静态网站生成器


    ### Hugo 0.18


    将网站生成回归到文本编辑器！


    Hugo 是一个静态博客解决方案，具有足够的灵活性来构建多种类型的网站，并具备常规附加功能，如 RSS 源生成以及可自定义的 URL 和别名。很快你就会启动并运行——你甚至不需要
    Go 语言编译器，因为 Hugo 可作为二进制文件提供，这意味着——正如网站所宣传的——“只需下载并运行！” 第一步是使用以下命令设置站点：


    ```bash

    hugo new site name-of-site

    ```


    这将生成站点的脚手架。接下来：


    ```bash

    hugo new post/hello-world.md

    ```


    为你生成一个 Markdown 页面供编辑，创建第一篇文章。模板使用 Go 的 html/template 库，使你可以构建相当复杂的站点。Hugo 自带一个用于测试的
    Web 服务器，但如果你没有现有的 Apache 或 Nginx 配置可以接入，它实际上足以用于生产环境。你需要先安装一个主题，才能以这种方式查看你的站点。或者，让
    Hugo 编译你的文章（通常每页耗时约 1ms），并将生成的 HTML 上传到你的服务器任意位置。文档对于让你快速上手非常有用，并涵盖了诸如获取现有站点迁移到
    Hugo 的众多迁移工具等领域。


    ![](img/6866071e033820549b214c239744aaa0_92_0.png)


    - **优点**

    - 非常快、灵活且设置迅速。拥有无需数据库后端即可管理的站点很棒。


    - **缺点**

    - 命令行界面意味着你必须说服使用 WordPress 的朋友来尝试它。评论不是静态的。


    > **非常适合...**

    > 博客，无需博客引擎开销的站点：

    >

    > gohugo.io/


