    # ## 12 JAVA ISN''T INSTALLED


    Out of the box, Linux doesn''t include the Java programming language. When you
    do come to install it, there are a number of different options too. The first
    choice to make is whether to use open source (OpenJDK) or closed source (Oracle)
    Java. In reality, there isn''t an awful lot between them nowadays; however, depending
    on what you are using Java for, you may need a specific version. OpenJDK is included
    in the repositories of most distributions and so can be installed with a command
    such as:


    ```

    ```bash

    $ apt-get install openjdk-8-jre

    ```

    ```


    To install Oracle''s Java, the easiest way is to use a PPA, such as that hosted
    by webupd8team — use the commands:


    ```

    ```bash

    $ sudo add-apt-repository ppa:

    webupd8team/java

    $ sudo apt-get update

    $ sudo apt-get installer oracle-java8-installer

    ```

    ```


    Note that if you are not specifically doing Java development, you may only need
    the JRE (Java Runtime Environment) rather than the JDK (Java Development Kit)
    installed.


    Should you need both types of Java installed, however, perhaps in multiple versions
    (Java 7 / 8 etc), you can do that — and switch between which one is enabled as
    the default on your system. Use the command:


    ```

    ```bash

    $ sudo update-alternatives --config java

    ```

    ```


    ...to interactively choose your preferred version (and do the same for javac if
    required).


    The default installation of Java won''t enable support in your browser — you will
    need to manually install the plug-in if required. Oracle has a support page on
    its website detailing how to do so. [bit.ly/2lZIu8](bit.ly/2lZIu8).


    # ## 13 THIS APP HASN''T INSTALLED PROPERLY


    We''re willing to bet that if you''ve been using Linux for any time at all, you''ve
    already uss fat with installing applications directly, from the command line rather
    than using the GUI installer. Most new users learn about application dependencies
    quickly and rudely — trying to install the Chrome browser when the GUI quickly
    becomes an exercise in learning how to use the


    command line, for example. You''ll notice that when you try to install DEB packages,
    sometimes they will fail to install because dependencies are missing and not automatically
    resolved. Should you experience this (as in the case of Chrome), you can normally
    automatically fix the issues using the command:


    ```

    ```bash

    $ apt-get install -f

    ```

    ```


    # ## 14 I CAN''T PLAY ANY VIDEOS


    New arrivals on Linux are often surprised to find that there''s not a capable
    media player pre-installed, so playing video files can be a problem. Fortunately,
    there''s an easy solution in the form of VLC. VLC is a free and open source cross-platform
    multimedia player and framework that plays most multimedia files as well as DVDs,
    audio CDs, VCDs and various streaming protocols. To install on your Linux machine,
    either do so from your distribution''s repositories (we guarantee it''s there)
    or using the packages available on www.videolan.org. A browser plug-in (browser-plugin-vlc)
    and additional streaming codecs (libavcodec-extra-53) are also available. In order
    to play region-locked DVDs, you will need to install libdvdcss2 using the guide
    on the VLC site.'
