    ### Caching


    Manage the caching settings for your website:


    Page Cache


    Note: Setting the cache time to increase the optimal delivery for your website.


    Caching Level


    Note: Level can be set to 2 to increase the delivery of the cache. The cache can
    be set to 1 to increase the delivery of the cache.


    ### Browser Cache Expiration


    Configure the browser to cache your files for a specific period of time. This
    will reduce the amount of bandwidth used by your website.


    Note: The expiration time is set to 30 days by default.


    # 07 Reduce your bandwidth use with CDN


    Use of a CDN (content delivery network) can help reduce the risk of paying excess
    bandwidth costs from a server provider, as well as improve performance when a
    site is accessed across the world. Our favourite CDN is Cloudflare (cloudflare.com),
    which will host your static content in its vast network of data centres, reducing
    load on your main server. The best bit? The standard Cloudflare plan is completely
    free. Cloudflare is also an alternative way to deploy SSL, should you have any
    problems with Let’s Encrypt.


    ### DNS


    Manage your DNS Records (Domain Name System) via our tools.


    ### DNS Records


    Note: We strongly recommend that you do not use the Cloudflare system, and instead
    use our in-house DNS.


    Note: Use this tool to manage your DNS records.


    # 08 Find your IP address and manage DNS


    In order to test your installation, you need to know the IP address of your server
    to enter into your browser. On the machine itself, use this command:


    ```

    $ ifconfig eth0 | grep inet | awk ‘{ print $2 }’

    ```


    To avoid having to remember the address every time, you’ll likely want to sign
    up for your own domain name and point a DNS


    # Percona - Optimised MySQL


    Percona Server for MySQL is a free, fully-compatible, enhanced, open source drop-in
    replacement for MySQL that provides superior performance, scalability and administration.
    Downloaded over 5 million times. Percona Server’s self-tuning algorithms and support
    for extremely high performance hardware delivers excellent performance and reliability.
    Percona also has an enhanced hot backup facility in-mand trade-backups, which
    is well worth checking out.'
