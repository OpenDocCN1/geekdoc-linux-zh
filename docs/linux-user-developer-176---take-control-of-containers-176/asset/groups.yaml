    ## 前五名


    ### 最佳基于 Debian 的发行版


    **1. deepin**

    可以说，deepin 最大的卖点是自研的桌面环境 DDE。虽然 DDE 基于 Qt 5 工具包，但它可以根据用户需求进行自定义，而不会给硬件带来负担。请务必也看看它提供的本土化应用，包括出色的
    DMusic 和 DPlayer 应用。


    **2. Tails**

    如果安全对你很重要，那么 Tails 应该是你首选的发行版。它使用了一种巧妙的“隐身模式”，帮助你绕过互联网流量追踪，使追踪你仅成为一种微弱的 possibility。


    ### 开发


    ### 华硕 Tinker Board 是我们一直想要的树莓派竞品


    4K 能力能否让 Tinker Board 成为下一个必备的 SBC（单板计算机）？


    多年来，众多树莓派竞品来来去去，但很少有能真正经受住时间考验，与这款迷你计算 powerhouse 抗衡。但尽管来自密切竞争对手的多次失败，科技巨头华硕推出了自己的树莓派竞品——Tinker
    Board。其尺寸仅为 8.5 厘米 x 5.3 厘米，两款单板计算机在大小上几乎相同，但相似性就此结束。Tinker Board 的核心是一枚四核 ARM
    Cortex A17 CPU，运行频率为 1.8GHz。此外还配备了 ARM Mali GPU 和 2GB DDR3 内存。对于那些在树莓派的 Broadcom
    VideoCore IV GPU 和 Tinker Board 之间犹豫不决的人来说，Mali GPU 将引起极大兴趣，因为前者在测试中表现出 vastly
    superior 的性能。性能的提升有助于 Tinker Board 不仅支持全高清 1080p，还支持 H.265 4K 解码，这是其尺寸的单板计算机首次实现。然而，在华硕的一份官方声明中，4K
    支持目前仍在开发中，虽然用户实际上可以通过该设备享受 4K 视频，但暂时不要指望能观看 4K Netflix。除了核心组件外，其他贴心设计还包括为主板集成的主要
    Wi-Fi 模块配备的可更换天线，以及千兆以太网和对 SDIO 3.0 的关键支持。随着 Tinker Board 的发布，华硕还发布了配套操作系统。截至本文撰写时，操作系统细节尚少，但已知它基于
    Debian，并将与我们许多人习惯的核心树莓派操作系统非常相似。华硕还指出，正在为 OpenSUSE 和 Ubuntu 提供支持，并计划于 2017 年底推出扩展功能。华硕
    Tinker Board 在纸面上是一款诱人的设备，看起来不仅能在核心功能上与树莓派匹敌，还能在其他领域超越它。感兴趣的用户目前可以直接通过华硕预订该设备，价格仅为
    55 英镑，早期设备已开始发货。


    ![](img/6866071e033820549b214c239744aaa0_8_1.png)


    **3. antiX**

    尽管 antiX 不像本列表上的其他发行版那样知名，但不应被忽视。它主要面向较旧的硬件，但同样为新手和资深用户提供了完全功能性的操作系统。


    **4. SparkyLinux**

    SparkyLinux 在寻找简单且不含大量冗余附加软件的用户中获得了日益增长的声誉。它缺少一些核心应用，但只需下载几个即可解决该问题。


    **5. Parrot Security OS**

    这是另一款专为注重安全的人群设计的发行版。Parrot 包含大量用于渗透测试、计算机取证和高级逆向工程的实用工具。但它并不适合 Linux 新手。


    ## 开源


    你的 Linux 新闻与观点来源


    ### 树莓派


    ### 谷歌正将 AI 带入树莓派


    实验人工智能将变得轻松许多。


    谷歌与树莓派基金会之间的桥梁是粉丝们期待已久的事，而近期发展表明，来自谷歌总部的最新消息可能是我们迄今为止最接近这一合作的时候。


    科技巨头正寻求大力投资扩展其现有开发工具套件，这些工具目前可供树莓派开发者使用。反过来，这将有助于更好地在基于谷歌的项目中实施树莓派，提供一系列新的软件工具，用于自然语言处理、预测分析和情感分析。


    为了帮助勾勒出前景，谷歌目前正在树莓派基金会上运行一项调查，用户可以在其中留下他们的想法和建议。调查开头写道：“我们谷歌对为创客创建智能工具感兴趣，并希望听取您的意见，了解哪些是最有帮助的。”除了之前列出的所有领域外，调查还概述了谷歌热衷于与树莓派合作的其他领域。如
