    \ definition of `which_char/1` allows you to make easy changes to the way you\
    \ treat special characters.\n\n# Is Erlang good for text processing?\n\nExecuting\
    \ `wc:start/1` with a number of filenames as arguments creates the following kind\
    \ of output:\n\nErlang **should not** be your first choice for processing and\
    \ parsing text files, even if you are a fan of Erlang programming languages such\
    \ as Lyx, Python, or Perl. And Ruby might be a better candidate for such tasks\
    \ because they need less code to do the job. The only variol reason to use Erlang\
    \ for text-manipulation is when you have to process huge amounts of text, because\
    \ Erlang has no real scaling problems at that point. However, that is not the\
