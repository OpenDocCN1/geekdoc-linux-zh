    # ## 05

    # PersistentVolumeClaim


    A stateful application can request storage using PersistentVolumeClaims (PVCs).
    PVCs are similar to pods. Just like pods consume node resources and can request
    specific levels of resources (CPU and memory), PVCs consume persistent volume
    resources and can request specific size and access modes (eg they can be mounted
    once to read/write or many times in a read-only state). PVCs allow users to consume
    abstract storage resources while the responsibility to provide the resources lies
    with the platform.


    # ## 06

    # Services


    Services connect ephemeral pods to internal or external processes that need to
    be long-running, like an API endpoint. Suppose you have three pods running a web
    server container, and you need a way to route requests from the public internet
    to your containers. You can do this by setting up a service that uses a load balancer
    to route requests from a public IP address to one of the containers. Give the
    pods a label, say `web_server`, and then in the service definition say: ''Serve
    port 80 using any container labelled web_server''.


    # ## 07

    # The kubectl tool


    To deploy and manage applications on Kubernetes, you can use the Kubernetes command-line
    tool, kubectl. It lets you inspect your cluster resources, create, delete and
    update components, and much more. Install kubectl using:


    ```

    $ curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s
    https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl

    ```


    You should use the following syntax to run kubectl commands from your terminal
    window:


    ```

    $ kubectl [command] [TYPE] [NAME] [flags]

    ```


    ...where **command** specifies the operation you want to perform, **TYPE** specifies
    the resource type, **NAME** specifies the resource name, and **flags** are additional
    inputs to the command.


    # ## 08

    # Pick the right platform


    Kubernetes doesn''t have any prerequisites for installation; you can install it
    on a range of platforms, from a laptop to virtual machines, to cloud providers
    to bare-metal servers. The only thing to be aware of here is the capacity of your
    cluster is based on the underlying platform. For users looking to get acquainted
    with Kubernetes, the best way to get started is Minikube, a local Docker-based
    solution. This creates a single-node Kubernetes setup on your laptop. For cloud
    providers like GCE and AWS, setting up Kubernetes is easy. While GCE provides
    Kubernetes support out of the box, you can use the kops tool for AWS.


