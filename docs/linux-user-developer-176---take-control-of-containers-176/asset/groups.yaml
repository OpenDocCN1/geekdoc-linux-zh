    \ 找到关于 `file_info` 持有的数据的更多信息。\n\n## 查找文件信息\n\n以下代码说明了如何使用 `file_info` 记录查找文件的更多信息：\n\
    \n```Erlang\nfile_permissions(Path) ->\n    case file:read_file_info(Path) of\n\
    \        {ok, FR} -> io:lib:format(\"~.8B\", [FR#file_info.mode band 8#777]);\n\
    \        _ -> error\n    end.\n```\n\n上述代码打印文件或目录的文件权限。请记住，虽然 `file:read_file_info()`\
    \ 包含关于文件大小和类型的信息，但调用 `file:file_size()` 和 `is_dir()` 比使用 `file:read_file_info()`\
    \ 更实用。然而，请注意，`file:read_file_info()` 返回的一些数据无法通过使用其他 Erlang 函数发现。执行 `file_permissions()`\
    \ 会产生以下类型的输出：\n\n![](img/6866071e033820549b214c239744aaa0_50_0.png)\n\n**左侧**\
    \ Erlang Observer 应用程序的一个标签页正在运行\n\n## 监视 Erlang 进程\n\nErlang 提供了一个名为 Observer\
    \ 的强大的图形应用程序，允许你检查正在运行的 Erlang 进程。你可以通过在 Erlang shell 中执行以下命令来启动 Observer 应用程序：\n\
    \n```Erlang\n1> observer:start().\n```\n\n但是，你也可以从 Linux 命令行启动 Observer – 这种方法的优势在于它使用更少的进程，并且需要更少的\
    \ CPU 功率。\n\n```sh\n$ erl -sname observer -hidden -setcookie MyCookie -run observer\n\
    ```\n\n图 8 显示了 Erlang Observer 应用程序，它已经取代了 Xmon 应用程序。你可以通过访问 erlang.org/doc/apps/observer/observer_ug.html\
    \ 找到更多关于 Erlang Observer 的信息。即将发布的教程将更多讨论 Observer。\n\n![](img/6866071e033820549b214c239744aaa0_50_1.png)\n\
    \n**左侧** 一个简单的监督树图，帮助你理解工作者和监督者之间的关系\n\n```Erlang\n2> workBin:file_permissions(\"\
    wc.erl\").  \n[\"644\"]  \n3> workBin:file_permissions(\"/tmp\").  \n[\"777\"\
    ]\n```\n\n## 查找模块信息\n\n有两种简单的方法可以查找现有模块的导出函数信息。因此，假设有一个名为 **aModule** 的模块，你可以使用以下两个命令之一来了解更多关于它的信息：\n\
    \n```Erlang\n1> aModule.  \n2> aModule:module_info().\n```\n\n请注意，你需要该模块的 BEAM\
    \ 文件才能执行这两个命令中的任何一个。图 7 显示了上述命令的输出。\n\n## 更多关于 OTP\n\n监督树是一种图形化表示应用程序中工作者和监督者之间关系的方式。工作者是执行实际工作的\
    \ Erlang 进程，而监督者是密切关注工作者或其他监督者状态的 Erlang 进程。监督树中有三种主要类型的子项：永久性的，它们死亡时会重新启动；瞬时的，仅在它们异常死亡时重新启动；以及临时的，它们死亡时永远不会重新启动。图\
    \ 9 显示了监督树的图表。通过构建和查看监督树获得的主要优势是快速理解你的应用程序架构。当我们讨论 OTP 时，你将看到更多监督树的示例。\n\n"
