    cd openwrt\n./.scripts/feeds update -a\n./.scripts/feeds install -a\n```\n\n![](img/6866071e033820549b214c239744aaa0_33_1.png)\n\
    \n教程文件可供下载：fileso.co.uk\n\n# 持续部署！\n\n我们的源代码并不特定于任何架构：它适合为 OpenWRT 支持的任意类型设备编译产品。我们的下一个任务涉及为我们想要使用的\
    \ OpenWRT 目标设备创建自定义配置。\n\n实际的自定义过程可以由三种不同的配置工具之一处理。本示例将使用 menuconfig 工具，Linux\
    \ 世界的老手应该已经从为桌面编译内核中熟悉了它。开始使用它涉及输入以下命令，这将使 OpenWRT 开始准备过程：\n\n```\ncamhane@TAMM1414:~/workspace/openwrt$\
