    ```


    如果你有彻底重启的强烈需求，可以使用 `--all` 命令选项从环境中移除所有内容。


    Python 的一大优势在于拥有庞大的第三方模块集合，用于扩展功能。不幸的是，这也同时是它的一个弱点，导致随着时间推移堆积大量冗余数据。Python 模块
    `virtualenv` 的编写初衷便是尝试解决这一问题。conda 打包系统也懂得创建隔离的 Python 环境。这样，你就能兼得两者的好处：更便捷的 Python
