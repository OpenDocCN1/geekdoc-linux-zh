    \ the encoding of filenames. In `utf8` mode, filenames can contain Unicode characters\
    \ greater than 255 and the VM converts filenames back and forth to the native\
    \ filename encoding (usually UTF-8, but UTF-16 on Windows).\n\nThe default mode\
    \ depends on the operating system: Windows and MacOS X enforce consistent filename\
    \ encoding and therefore the VM uses `utf8` mode.\n\nOn operating systems with\
    \ transparent naming (for example, all Unix systems except MacOS X), default is\
    \ `utf8` if the terminal supports UTF-8, otherwise `latin1`. The default can be\
    \ overridden using `+fnl` (to force `latin1` mode) or `+fnu` (to force `utf8`\
    \ mode) when starting `xerl(1)`. \n\nOn operating systems with transparent naming,\
