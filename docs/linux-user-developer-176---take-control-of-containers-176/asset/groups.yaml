    ## 12 使用 phpMyAdmin 进行图形化界面管理


    如果你认为从命令行管理 MySQL 过于复杂，或者只是想使用更具图形化的方式来查看数据，那么你应该考虑使用 phpMyAdmin。大多数发行版的软件源中都提供它，但它们往往是过时的，因此更好的想法是从
    www.phpmyadmin.net 下载最新的 tar.gz 压缩包。安装非常简单，只需将压缩包提取到一个 Web 可访问的目录，并设置配置文件中的关键值即可。


    ![](img/6866071e033820549b214c239744aaa0_39_4.png)


    ## 13 备份你的数据


    你很可能会在 MySQL 服务器上存储宝贵数据，因此确保定期备份至关重要。`mysqldump` 命令可以很容易地将数据库内容转储到文件中，然后你可以将其上传到远程位置（如果将
    `/var/www` 的内容也上传保存有意义的话）。一些开源的自动化备份脚本可作为起点，然后你可以将其添加到 Cron 中定期运行。


    ## 14 下载并安装 PHP


    LAMP 技术栈的最后一个要素是 PHP，一种脚本语言，它驱动着世界上一些最受欢迎的应用程序。要安装 PHP，请使用以下命令：


    ```

    sudo apt-get install php libapache2-mod-php

    ```


    这将安装最新版本的 PHP 以及所需的 Apache 模块（或者会自动启用）。请注意，某些旧应用程序明确需要 php5 而不是 7，因此你可能需要相应地调整命令。你可以通过创建一个包含
    `<?php phpinfo(); ?>` 内容的 `test.php` 文件来测试你的 PHP 安装。


    ![](img/6866071e033820549b214c239744aaa0_40_0.png)


    ## 15 使用模块安装


    与 Apache 一样，PHP 也可以通过模块进行扩展。要查看可用的模块，请使用命令 `apt-cache search php-`。应用程序通常会指定它们所需的
    PHP 模块：然而，如果你遇到空白页面问题，可能是因为 PHP 错误报告已关闭，从而掩盖了问题的根源。你可以在脚本中通过添加 `error_reporting(E_ALL);`
    和 `ini_set(''display_errors'', ''1'')` 这两行代码来暂时启用它。Apache 日志位于 `/var/log/apache2`，也是寻找线索的好地方。


    ![](img/6866071e033820549b214c239744aaa0_40_1.png)


    ## 16 上传到服务器


    如果你正在本地机器上部署 LAMP 技术栈（可能用于测试目的），那么上传内容并不是挑战。然而，对于基于云或虚拟机的部署，情况可能并非如此。最简单的方法是通过
    SFTP 进行部署。确保服务器上已安装 openSsh-server。在你的机器上生成公钥 `ssh-keygen -t rsa`，将 `~/.ssh/id_rsa.pub`
    的内容添加到服务器上相应用户的 `~/.ssh/authorized_keys`，然后你应该能够使用 `sftp` 命令直接连接。


    ![](img/6866071e033820549b214c239744aaa0_40_2.png)


    ## 17 基于图形界面的服务器管理


    对于基于图形界面的服务器管理，我们最喜爱的工具之一是 Webmin。它可以从 www.webmin.com/deb.html 获取 apt 软件源。安装后，Webmin
    为 Linux 系统的各个方面（包括 LAMP 技术栈的所有元素）提供图形界面。Webmin 默认主题非常过时，但第三方 Authentic 主题通过基于
    Bootstrap 的响应式设计，将 Webmin 带入 21 世纪。你可以从 github.com/gcoop/strut2-theme-theme 获取它。


    ![](img/6866071e033820549b214c239744aaa0_40_3.png)


    ## 18 调整你的安装


    就这样，你都设置好了！开箱即用的 Apache 和 MySQL 拥有一套标准的配置文件，在大多数硬件上运行良好，但肯定没有针对你的特定配置进行优化。两个来自
    mycutter.net 的 Perl 脚本，即 apache2-tuner.pl，旨在检查所有配置文件以及系统配置，并根据你的系统建议改进。它们还查看正在运行的系统的日志，因此请确保在使用之前系统至少已运行
    24 小时。


    ![](img/6866071e033820549b214c239744aaa0_40_4.png)


