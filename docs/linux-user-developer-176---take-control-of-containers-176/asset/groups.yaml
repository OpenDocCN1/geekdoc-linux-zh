    # The kernel column


    Jon Masters summarises the latest happenings in the Linux kernel community


    ![](img/6866071e033820549b214c239744aaa0_15_0.png)


    **Jon Masters** is a Linux-kernel hacker who has been working on Linux for some
    19 years, since he first attended university at the age of 13. Jon lives in Cambridge,
    Massachusetts, and works for a large enterprise Linux vendor, where he is driving
    the creation of standards for energy efficient ARM-powered servers


    **Linus Torvalds announced a rare eighth release candidate of Linux 4.10.** This
    wasn’t due to massive instability in 4.10, but rather as a consequence of timing.
    Many of us (including Linus) in the Linux community were, at the time, in Tahoe,
    California for the annual Linux Foundation Open Source Leadership Summit (OSLS,
    formerly known as Colab Summit). Had the 4.10 final been released that week, it
    would have immediately opened the merge window for many thousands of patches destined
    to land in 4.11. Although he has juggled travel with managing a merge window before,
    Linus “prefers not to”, and who are we to blame him?


    It is worth noting that a couple of minor bugs have been reported against 4.10-rc8,
    including one rfad warning splat that Dave Jones reported (and was immediately
    fixed), and one boot time intermittent hang that Pavel Machek flagged on his primary
    x86 system. He is still working on “bisecting” the problem by continually building
    test kernels that bisect through the latest changes to the kernel since a previously
    known, good version. Bisection can be very laborious, but it will usually find
    the problem, provided that it can be reproduced fairly reliably in every iteration.
    Neither of these problems would generally hold up the 4.10 final, however.


    # Coherent device memory nodes


    The computing industry is currently undergoing a major technology inflexia as
    the rate of acceleration of compute performance across generations slows; yet
    customer and user demand for computation has never been higher. As a direct result
    of this dichotomy, active research in compute accelerators is gaining momentum.
    Workload accelerators (as they are sometimes called) are traditionally discrete
    pieces of silicon that provide some offload capability for performing functions
    that would otherwise waste CPU cycles. A classic example is that of an encryption
    or a compression engine, such as those contained within many contemporary network
    cards. The cards are said to offload certain calculations that might otherwise
    burden the CPU.


    For the past few years, workload acceleration meant widgets added to certain chips
    (whether server like examples like this example, or power efficient capabilities
    added to mobile chips to save energy - such as media playback/recording codecs
    implemented in hardware), or (perhaps more commonly) the rising use of GPUs in
    a GPGPU (General Purpose) configuration. Nvidia’s Tesla and AMD’s FirePro come
    to mind, but there are others. In recent times, however, the range of options
    for acceleration has begun to balloon, especially with the nascent adoption of
    once exotic technologies, such as FPGAs.


    An FPGA (Field Programmable Gate Array) is non-fixed function silicon containing
    millions (or even more) of uncommitted gates that can be dynamically wired up
    in almost any configuration. This allows for custom hardware logic to be implemented
    rapidly without actually going to the expense of designing and manufacturing a
    full chip. Of course, there’s a downside to using FPGAs (or nobody would bother
    with making chips of their own any more): they use more energy than full custom
    chips, are slower than a custom chip, and they cost more to produce and to purchase.
    Nevertheless, FPGAs can implement logic that executes far faster than contemporary
    CPUs, and even beats out GPUs in some cases. Couple that with an ability to dynamically
    reconfigure them without touching the underlying hardware, and FPGAs become very
