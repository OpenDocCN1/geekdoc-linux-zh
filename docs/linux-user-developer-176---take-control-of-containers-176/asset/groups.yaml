    Now that you have got your server deployed and updated, the first step is to install
    Apache (version 2). All of the elements of the LAMP stack are long established,
    so as you''d expect, they''re available in all major distribution repositories
    (and frequently updated). Typically there''s no need to build from source at all.
    Simply use:


    ```

    sudo apt-get install apache2

    ```


    ...and Apache will be automatically installed and started. The'
