    **Nitish Tiwari** 是一名软件开发者，对自由和开源软件有着浓厚的兴趣。除了担任领先 FOSS 出版物的社区版主和作者外，他还帮助组织采用开源软件来满足其业务需求。


    互联网是现有最大的知识来源，被广泛用于共享信息，但它也是恶意软件、间谍软件和多种其他类型病毒的最大来源。这使得互联网成为一个非常有趣但又充满挑战的地方。你需要小心从互联网下载的未经过验证（有时甚至是经过验证的）软件、你访问的网站、你打开的电子邮件附件等。无论是否有技术背景，这对任何人来说都可能很困难。


    虽然没有什么能取代对系统安全危险的警惕，但有一些工具可以帮助你沙箱化你运行的应用程序。这样，你就可以确保从互联网下载的应用程序只做它应该做的事情。在这里，我们将向你介绍
    Firejail。它是一个简单的工具，帮助你使用 Linux 命名空间来限制不可信应用程序的运行环境。


    Firejail 允许一个进程及其所有后代拥有其对全局共享内核资源（如网络堆栈、进程表和挂载表）的私有视图。Firejail 是用 C 语言编写的，几乎没有依赖项，该软件运行在任何具有
    3.x 内核版本或更高版本的 Linux 计算机上。它可以沙箱化任何类型的进程：服务器、图形应用程序甚至用户登录会话。请注意，我们选择 Ubuntu 16.04
    作为本教程的主机系统。


