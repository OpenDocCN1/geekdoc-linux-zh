    \ you want to read. The `file:write()` function also requires two arguments: the\
    \ open file descriptor of the file you want to write to and the data you want\
    \ to write, respectively. As you will see, there are easier ways to read a file.\n\
    \nYou will also need two more functions in order to open and close a file, which\
    \ are `open(File, Mode)` and `close(Device)`, respectively. The `file:open()`\
    \ function takes two arguments, which are the location of the file you want to\
    \ open and the mode in which you want to open the file. A successful call to `file:open()`\
    \ returns a tuple of type `{ok, FD}`. The first element shows that the operation\
    \ was successful and the second element is used for referencing the open file\
    \ afterwards.\n\nThe Mode part can have four values: `Read`, `Write`, `Append`\
    \ and `Exclusive`.\n\nErlang offers the `file:read_file()` function that takes\
    \ one argument, which is a filename, and stores its full contents all at once\
    \ into a variable. Although this function cannot fully replace `file:read()`,\
    \ it can be very handy from time to time!\n\n## Processing command-line arguments\n\
    \nThis section will illustrate how to read the command-line arguments of a program\
    \ in Erlang, which is a very significant task because most of the time you get\
    \ the names of the files you want to process as arguments. The Erlang code of\
    \ `cmdArgs.erl` is below.\n\nThe following interaction with Erlang shell will\
    \ help you clarify many things related to lists:\n\n```erlang\n-module(cmdArgs).\n\
    -export([main/1]).\n\nmain(Args) ->\n  io:format(\"Printing arguments:~n\",[]),\n\
    \  lists:foreach(fun(Arg) -> io:format(\"Arg: ~p~n\", [Arg]) end, Args).\n```\n\
    \nExecuting the `main/0` function of `cmdArgs.erl` from the command line generates\
    \ the following kind of output:\n\n```bash\n$ erlc cmdArgs.erl\n$ erl -noshell\
    \ -s cmdArgs main 1 2 3 4 five -s init stop\n\nPrinting arguments:\nArg: 1\nArg:\
    \ 2\nArg: 3\nArg: 4\nArg: five\n```\n\n## Opening text files for reading\n\nThe\
    \ following Erlang code opens a file that is identified by `File` for reading:\n\
    \n```erlang\n{ok, FD} = file:open(File, [read])\n```\n\nThe use of `file:open()`\
    \ is illustrated in `workText.erl`. Executing `lineByLine/1` from `workText.erl`\
    \ generates the following kind of output:\n\n```erlang\n1> c(workText).\n{ok,\
    \ workText}\n2> workText:lineByLine(\"cmdArgs.erl\").\n-module(cmdargs).\nok.\n\
    ```\n\nThe `lineByLine/1` function reads a file line by line and prints its contents\
    \ with the help of the `read_line_by_line(FD)` function.\n\nAs you can see, opening\
    \ a file for reading can fail for various reasons, including file not found and\
    \ not having the right file permissions to open a file. So, if there is such an\
    \ error somewhere, you will get the following kind of error message:\n\n```erlang\n\
    4> workText:lineByLine(\"cmdargs\").\n** exception error: no match of right hand\
    \ side\n   value {error,enotfound}\n5> in function workText:lineByLine/1 (workText.erl,\
    \ line 5)\n```\n\nLearning to interpret and work with error messages is critical\
    \ and handy because it allows you to decide what to do depending on the kind of\
    \ error you get. Please note that you are going to get the same error message\
    \ when you are dealing with a binary file.\n\n*Figure 1* shows the implementation\
    \ of both `lineByLine/1` and `read_line_by_line/1` functions as found in `workText.erl`.\
    \ The `file:read_line()` function reads a single line from a file.\n\n![](img/6866071e033820549b214c239744aaa0_47_0.png)\n\
    Right: The use of the `file:open/2` function for opening a file for reading and\
    \ `file:read_line/1` for reading a single line from an open file\n\n## Opening\
    \ text files for writing\n\nIn order to open a file for writing, you will need\
    \ to change the value of the second argument of the `file:open()` function, which\
    \ is the *Mode*. If the file you are opening for writing already exists, it will\
    \ be truncated, so be extra careful with it. If you do not want this behaviour,\
    \ use the append mode.\n\n*Figure 2* shows the implementation of `writeToFile/1`\
    \ that illustrates the use of the `file:write()` function. Executing `writeToFile/1`\
    \ generates the following results:\n\n```erlang\n1> c(workText).\n{ok, workText}\n\
    2> workText:writeToFile(\"./testing\").\nok\n3> q().\nok\n$ cat testing\nA Message.\n\
    ```\n\n![](img/6866071e033820549b214c239744aaa0_47_1.png)\nRight: The use of the\
    \ `file:write/1` Erlang function for writing data to a file\n\n## Error handling\n\
    \nError handling is a crucial task when you have to deal with file read and write\
    \ operations because many things can go wrong during file I/O. Once again, error\
    \ handling in Erlang is implemented with the help of pattern matching. The following\
    \ Erlang function presents a simple way to handle errors related to `file:open/1`:\n\
    \n```erlang\nopen_file_with_error_handling(File) ->\n   case file:open(File, [read])\
    \ of\n       {ok, Fd} ->\n           io:format(\"File ~p opened successfully.~n\"\
    , []),\n           [File],\n           file:close(Fd);\n       {error, Reason}\
    \ ->\n           io:format(\"Error opening ~p.~n\", [File]),\n           io:format(\"\
    Reason:~p.~n\", [Reason])\n   end.\n```\n\nYou can learn about the various file-related\
    \ error codes and their descriptions by visiting **bit.ly/2XMOHCm**.\n\n## Creating\
    \ temporary files\n\nThis section will explain how to create a temporary file\
    \ in Erlang using a random filename, which is pretty handy when you want to save\
    \ your data without having to worry about accidentally selecting an existing filename.\
    \ The developed function makes use of the `erlang:timestamp/0` function that returns\
    \ the current system time as a tuple with three elements, which is unique for\
    \ each given system. The tuple is converted into a single variable that can be\
    \ used for generating a new file or directory. **Figure 3** shows the Erlang code\
    \ of the `create_temporary/0` function that can be found in the `workBin.erl`\
    \ file. Executing it generates the following results:\n\n![](img/6866071e033820549b214c239744aaa0_47_2.png)\n\
    Right: The Erlang code presented in this figure shows how you can create unique\
    \ names\n\n```erlang\n10> c(workBin).\n   {ok, workBin}\n11> workBin:create_temporary().\n\
    \   Unique filename: \"1485-326598-527282\"\n   ok\n12> workBin:create_temporary().\n\
    \   ok\n   Unique filename: \"1485-326600-978734\"\n```\n\n## Developing wc in\
    \ Erlang\n\nThis section will present a rudimentary implementation of `wc(1)`\
    \ in Erlang. The code of `wc.erl` will not support command-line switches and will\
    \ not print the total number of characters, words and lines read, because this\
    \ would require too much code.\n\nYou are also allowed to specifically handle\
    \ some of the error messages. You can find the code inside `workBin.erl`. Executing\
    \ it generates the following kind of output:\n\n**Figure 4** shows a part of the\
    \ Erlang code of `wc.erl`. As you can understand from the implementation of `wc.erl`,\
    \ Erlang might not be the best candidate for such command-line tools!\n\n```erlang\n\
    2> workBin:open_file_with_error_handling(\"wc.erl\").\nFile \"wc.erl\" opened\
    \ successfully.\nok\n[\"wc.erl\"]\n3> workBin:open_file_with_error_handling(\"\
    wc\").\nError opening \"wc\".\nReason:enoent.\nok\n```\n\nThe input files are\
    \ passed as a list to the `wc:start/1` function in order to be processed. However,\
    \ if you want to process a single file, then you can use the `wc:one_file/1` function\
    \ instead. The two most important functions of `wc.erl` are `process_file/0` and\
    \ `count_bin/0`. The first one makes sure that all files are processed whereas\
    \ the second one does the actual processing with a little help from `which_char/1`.\
    \ The contents of each file are processed character-by-character using list operations,\
    \ which is pretty common in functional programming languages. Additionally, the\
    \ definition of `which_char/1` allows you to make easy changes to the way you\
    \ treat special characters.\n\n## Is Erlang good for text processing?\n\nExecuting\
    \ `wc:start/1` with a number of filenames as arguments creates the following kind\
    \ of output:\n\n| File | Words | Chars | Lines |\n| :--- | :--- | :--- | :---\
    \ |\n| wc.erl | 217 | 1828 | 84 |\n| mvc.erl | 1899 | 222 | 88 |\n| ok | | | |\n\
    \nErlang **should not** be your first choice for processing and parsing text files,\
    \ even if you are a fan of Erlang programming languages such as Lyx, Python, or\
    \ Perl. And Ruby might be a better candidate for such tasks because they need\
    \ less code to do the job. The only valid reason to use Erlang for text-manipulation\
    \ is when you have to process huge amounts of text, because Erlang has no real\
    \ scaling problems at that point. However, that is not the case for most developers\
    \ today. Having said that, if you have a big Erlang application and you want to\
    \ do a little text parsing with no need to use another programming language, Erlang\
    \ pattern matching will greatly assist you and make your life a lot easier.\n\n\
    If you modify the Erlang code of `wc.erl` a little, you are able to find out the\
    \ flow of the program, which can be very practical.\n"
  mdcn: "\n# 使用 Erlang 编程：文件 I/O\n\n![](img/6866071e033820549b214c239744aaa0_45_0.png)\n\
    \nMihalis Tsoukalos 是一名 UNIX 管理员、程序员（UNIX 和 iOS）、数据库管理员（DBA）以及数学家。他自 1993 年起开始使用\
    \ Linux。你可以通过 Twitter 上的 @mactosouk 或他的网站 mtoukalos.eu 联系到他。\n\n了解如何在 Erlang 中处理文件操作\n\
    \n## 资源\n\n- Erlang 的安装环境\n- 文本编辑器，例如 Emacs 或 vi\n\n如果一种编程语言无法处理文本和二进制文件，那么它就不能被认为是一种重要的语言，因为如果不从现有文件中读取数据或将数据存储到文件中，你就无法开发实用的系统工具。因此，本教程的主题将使用\
    \ Erlang 处理文件和目录，这也包括允许你查找文件信息的 Erlang 函数。\n\n下一篇 Erlang 教程将讨论 Erlang 中的网络编程，这也是一个非常重要且必不可少的任务，所以请继续阅读并尽可能多地编写\
    \ Erlang 代码。\n\n## 关于文件 I/O\n\n文件操作是系统编程的关键部分，因此它们必须可靠且快速；然而，在这种情况下，可靠性比速度更重要！可靠性的一部分来自于错误检查和错误报告代码，因为你无法确定什么会失败以及为什么会失败。\n\
    \n与文件操作相关的大多数函数都属于 `file` 模块，该模块为你提供文件系统接口。`file` 模块中与文件输入和输出相关的两个最重要的 Erlang\
    \ 函数是 `file:read()` 和 `file:write()`。\n\n第一个函数用于从打开的文件中读取，而第二个函数用于向文件写入数据。`file:read()`\
    \ 函数接受两个参数：一个打开的文件描述符和你想要读取的字节数。`file:write()` 函数也需要两个参数：分别是你想要写入的文件的打开文件描述符以及你想要写入的数据。正如你将看到的，有更容易的方式来读取文件。\n\
    \n为了打开和关闭文件，你还需要另外两个函数，分别是 `open(File, Mode)` 和 `close(Device)`。`file:open()`\
    \ 函数接受两个参数，即你想要打开的文件位置和你想要打开文件的方式（模式）。成功调用 `file:open()` 会返回一个类型为 `{ok, FD}` 的元组。第一个元素表示操作成功，第二个元素用于随后引用打开的文件。\n\
    \nMode（模式）部分可以有四个值：`Read`、`Write`、`Append` 和 `Exclusive`。\n\nErlang 提供了 `file:read_file()`\
    \ 函数，该函数接受一个参数，即文件名，并将其完整内容一次性存储到一个变量中。虽然此函数无法完全替代 `file:read()`，但它时不时非常实用！\n\n\
    ## 处理命令行参数\n\n本节将说明如何在 Erlang 中读取程序的命令行参数，这是一个非常重要的任务，因为大多数时候你都会将需要处理的文件名称作为参数传入。`cmdArgs.erl`\
    \ 的 Erlang 代码如下所示。\n\n以下与 Erlang shell 的交互将帮助你澄清许多与列表相关的事项：\n\n```erlang\n-module(cmdArgs).\n\
    -export([main/1]).\n\nmain(Args) ->\n  io:format(\"Printing arguments:~n\",[]),\n\
    \  lists:foreach(fun(Arg) -> io:format(\"Arg: ~p~n\", [Arg]) end, Args).\n```\n\
    \n从命令行执行 `cmdArgs.erl` 中的 `main/0` 函数会产生以下类型的输出：\n\n```bash\n$ erlc cmdArgs.erl\n\
    $ erl -noshell -s cmdArgs main 1 2 3 4 five -s init stop\n\nPrinting arguments:\n\
    Arg: 1\nArg: 2\nArg: 3\nArg: 4\nArg: five\n```\n\n## 以读模式打开文本文件\n\n以下 Erlang 代码打开由\
    \ `File` 标识的文件以供读取：\n\n```erlang\n{ok, FD} = file:open(File, [read])\n```\n\n\
    `workText.erl` 中说明了 `file:open()` 的用法。从 `workText.erl` 中执行 `lineByLine/1` 会产生以下类型的输出：\n\
    \n```erlang\n1> c(workText).\n{ok, workText}\n2> workText:lineByLine(\"cmdArgs.erl\"\
    ).\n-module(cmdargs).\nok.\n```\n\n`lineByLine/1` 函数逐行读取文件，并在 `read_line_by_line(FD)`\
    \ 函数的帮助下打印其内容。\n\n你可以看到，以读模式打开文件可能会因各种原因失败，包括文件未找到以及没有正确的文件权限来打开文件。因此，如果存在此类错误，你将得到以下类型的错误消息：\n\
    \n```erlang\n4> workText:lineByLine(\"cmdargs\").\n** exception error: no match\
    \ of right hand side\n   value {error,enotfound}\n5> in function workText:lineByLine/1\
    \ (workText.erl, line 5)\n```\n\n学习如何解释和处理错误消息至关重要且实用，因为它允许你根据获得的错误类型决定采取何种措施。请注意，当你处理二进制文件时，也会收到相同的错误消息。\n\
    \n*图 1* 展示了在 `workText.erl` 中发现的 `lineByLine/1` 和 `read_line_by_line/1` 两个函数的实现。`file:read_line()`\
    \ 函数从文件中读取单行。\n\n![](img/6866071e033820549b214c239744aaa0_47_0.png)\n右侧：使用 `file:open/2`\
    \ 函数打开文件以供读取，并使用 `file:read_line/1` 从打开的文件中读取单行\n\n## 以写模式打开文本文件\n\n为了以写模式打开文件，你需要更改\
    \ `file:open()` 函数第二个参数的值，即 *Mode*。如果你要写入的文件已经存在，它将被截断，因此请格外小心。如果你不希望出现这种行为，请使用追加模式。\n\
    \n*图 2* 展示了 `writeToFile/1` 的实现，该实现说明了 `file:write()` 函数的用法。执行 `writeToFile/1`\
    \ 会产生以下结果：\n\n```erlang\n1> c(workText).\n{ok, workText}\n2> workText:writeToFile(\"\
    ./testing\").\nok\n3> q().\nok\n$ cat testing\nA Message.\n```\n\n![](img/6866071e033820549b214c239744aaa0_47_1.png)\n\
    右侧：使用 `file:write/1` Erlang 函数向文件写入数据\n\n## 错误处理\n\n当你需要处理文件读写操作时，错误处理是一项关键任务，因为在文件\
    \ I/O 过程中很多事物都可能出错。再次强调，Erlang 中的错误处理是通过模式匹配实现的。以下 Erlang 函数介绍了一种处理与 `file:open/1`\
    \ 相关错误的简单方法：\n\n```erlang\nopen_file_with_error_handling(File) ->\n   case file:open(File,\
    \ [read]) of\n       {ok, Fd} ->\n           io:format(\"File ~p opened successfully.~n\"\
    , []),\n           [File],\n           file:close(Fd);\n       {error, Reason}\
    \ ->\n           io:format(\"Error opening ~p.~n\", [File]),\n           io:format(\"\
    Reason:~p.~n\", [Reason])\n   end.\n```\n\n你可以通过访问 **bit.ly/2XMOHCm** 来了解各种与文件相关的错误代码及其描述。\n\
    \n## 创建临时文件\n\n本节将解释如何在 Erlang 中使用随机文件名创建临时文件，当你要保存数据而不必担心意外选择现有文件名时，这非常实用。开发的函数利用了\
    \ `erlang:timestamp/0` 函数，该函数返回当前系统时间作为包含三个元素的元组，这对于每个给定的系统都是唯一的。该元组被转换为单个变量，可用于生成新的文件或目录。**图\
    \ 3** 展示了 `workBin.erl` 文件中找到的 `create_temporary/0` 函数的 Erlang 代码。执行该函数会产生以下结果：\n\
    \n![](img/6866071e033820549b214c239744aaa0_47_2.png)\n右侧：本图中展示的 Erlang 代码说明了如何创建唯一的名称\n\
    \n```erlang\n10> c(workBin).\n   {ok, workBin}\n11> workBin:create_temporary().\n\
    \   Unique filename: \"1485-326598-527282\"\n   ok\n12> workBin:create_temporary().\n\
    \   ok\n   Unique filename: \"1485-326600-978734\"\n```\n\n## 使用 Erlang 开发 wc\n\
    \n本节将展示 `wc(1)` 在 Erlang 中的一个基础实现。`wc.erl` 的代码将不支持命令行开关，也不会打印读取的字符、单词和行的总数，因为这需要太多的代码。\n\
    \n你也允许专门处理某些错误消息。你可以在 `workBin.erl` 中找到代码。执行它会产生以下类型的输出：\n\n**图 4** 展示了 `wc.erl`\
    \ 的 Erlang 代码的一部分。从 `wc.erl` 的实现中你可以理解，Erlang 可能不是此类命令行工具的最佳选择！\n\n```erlang\n\
    2> workBin:open_file_with_error_handling(\"wc.erl\").\nFile \"wc.erl\" opened\
    \ successfully.\nok\n[\"wc.erl\"]\n3> workBin:open_file_with_error_handling(\"\
    wc\").\nError opening \"wc\".\nReason:enoent.\nok\n```\n\n输入文件作为列表传递给 `wc:start/1`\
    \ 函数进行处理。但是，如果你想要处理单个文件，可以使用 `wc:one_file/1` 函数代替。`wc.erl` 中最重要的是两个函数：`process_file/0`\
    \ 和 `count_bin/0`。第一个函数确保所有文件都被处理，而第二个函数在 `which_char/1` 的少量帮助下执行实际的处理。每个文件的内容使用列表操作逐字符处理，这在函数式编程语言中相当常见。此外，`which_char/1`\
    \ 的定义允许你轻松更改处理特殊字符的方式。\n\n## Erlang 适合文本处理吗？\n\n以多个文件名作为参数执行 `wc:start/1` 会产生以下类型的输出：\n\
    \n| 文件 | 单词数 | 字符数 | 行数 |\n| :--- | :--- | :--- | :--- |\n| wc.erl | 217 | 1828\
    \ | 84 |\n| mvc.erl | 1899 | 222 | 88 |\n| ok | | | |\n\n即使你是 Lyx、Python 或 Perl\
    \ 等 Erlang 编程语言（注：原文此处逻辑可能有误，Lyx/Python/Perl 并非 Erlang 语言，但翻译保留原意或修正为“即使你是此类语言爱好者”）的粉丝，Erlang\
    \ **也不应该**是你处理和分析文本文件的首选。Ruby 可能是此类任务更好的候选者，因为它们需要更少的代码就能完成工作。使用 Erlang 进行文本操作的唯一有效理由是你必须处理大量文本，因为在这种情况下\
    \ Erlang 没有真正的扩展性问题。然而，对于今天的大多数开发人员来说，情况并非如此。话虽如此，如果你有一个大型 Erlang 应用程序，并且想要进行少量的文本解析而不必使用另一种编程语言，Erlang\
    \ 模式匹配将极大地帮助你并使你的生活变得更加容易。\n\n如果你稍微修改 `wc.erl` 的 Erlang 代码，你就能够找出程序的流程，这可能非常实用。\n"
