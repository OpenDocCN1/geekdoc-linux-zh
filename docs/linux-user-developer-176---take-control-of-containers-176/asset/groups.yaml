  mdcn: "\n# 评测\n\n## Synology RT2600ac 无线路由器\n\n![](img/6866071e033820549b214c239744aaa0_87_0.png)\n\
    \n### 硬件\n\nSynology 最新的路由器是一台昂贵的设备 – 它能对得起这个价格标签吗？\n\n- **价格**：243.03 英镑\n- **网站**：ebuyer.com\n\
    - **规格**：\n  - 802.11a/b/g/n/ac 无线\n  - 2.4GHz/5GHz 同时运行\n  - 4 个千兆以太网端口\n  -\
    \ 1 个 USB3.0 端口\n  - 1 个 USB2.0 端口\n  - SD 卡槽\n\nSynology 最新路由器的外观有一种令人愉悦的复古感。它是一台体积庞大的设备，凭借四根非常显眼的外置天线吸引眼球\
    \ – 简而言之，它并不追求像普通 ISP 提供的无线路由器那样美观且适合客厅摆放。Synology 显然专注于提供出色的网络设备，就这方面而言它做到了。从初始设置到日常管理，均通过\
    \ Synology 路由器管理进行，这是一个基于网络的图形用户界面，其外观和感觉模拟了桌面操作系统。我们几乎没有任何麻烦，在不到半小时的时间里就让设备与有线调制解调器和谐工作，并连接了全家的设备。该界面让人立即熟悉起来，并帮助你梳理可用的设置\
    \ – 这些设置数量众多。作为自定义细节水平的一个例子，家长控制包括针对特定设备的时间限制和网站屏蔽，而路由器正面的 LED 灯可以配置为按天或按小时避免令人分心的闪烁。其他实用功能包括内置防火墙、DoS\
    \ 防护和自动屏蔽。所提供控制水平简直令人惊叹。\n\n![](img/6866071e033820549b214c239744aaa0_88_0.png)\n\
    \n![](img/6866071e033820549b214c239744aaa0_88_1.png)\n\n上方：那四根棱角分明的天线非常引人注目，这意味着你可能会希望将\
    \ RT2600ac 放在视线之外\n\n> 无论你是想要简单安全的网络，还是功能齐全的 NAS，Synology RT2600ac 都能轻松满足你的需求\n\
    \n借助对 USB 或 SD 卡外接存储的支持，该设备还可以作为家庭文件服务器使用。通过简单的配置，该设备还可以作为 UPnP 媒体服务器，用于向智能电视、游戏机和移动设备流媒体传输\
    \ – 我们在一次连看马拉松活动中成功享受了这一功能！Cloud Station Server 功能也很有用，允许你在多台连接设备之间同步选定文件。\n\n\
    由于设备同时运行 2.4GHz 和 5GHz，连接很简单，路由器会自动确定每个特定连接设备最适合的连接。在我们的使用测试中，当连接十个或更多设备时，速度毫无故障，无线范围轻松足以覆盖标准家庭使用甚至更多，便携式设备可以在花园里较远的距离连接。\n\
    \n有线网络用户可以访问四个千兆以太网端口，不过其中第一个可以用作第二个 WAN 端口。它可以配置为故障安全连接，以防主要 WAN 连接不可用，或者作为第二个带宽来源\
    \ – 在这种情况下，负载以 60/40 的比例平衡，主要 WAN 端口处理大部分工作。\n\nSynology RT2600ac 的缺点很少。最大的缺点是价格\
    \ – 无论路由器多好，你都需要对家庭网络非常认真，才会花费超过 200 英镑购买路由器。如果你已经投资了大量布线，只是想替换现有路由器，你也会觉得标准的四个以太网端口有点吝啬，尤其考虑到该设备的尺寸。如果你使用第二个\
    \ WAN 连接，这就会减少到只有三个端口，意味着你可能最终需要额外的网络交换机。\n\n不过，这些缺点与设备的好处相比黯然失色。对于你的投资，你得到的是一台提供完美范围和速度的无线路由器，可以迅速且舒适地根据你的精确需求进行配置。无论你是想要简单安全的网络，还是拥有所有可能设想的顶级功能的\
    \ NAS，Synology RT2600ac 都能轻松满足你的需求。只是别指望它在做到这些的同时还能长得漂亮。\n\nNicholas Thorpe\n\n\
    ### 优点\n在 2.4GHz 和 5GHz 频段上性能出色，且用户界面使其与竞争路由器截然不同\n\n### 缺点\n价格不便宜，重度有线网络用户可能希望有以太网端口更多。它还稍微有点笨重\n\
    \n### 总结\n如果你想创建家庭网络，选择 Synology RT2600ac 不会错 – 速度和无线范围都很好，而且很少见到在保持用户友好界面的同时提供如此多灵活性的路由器。这是一台昂贵的设备，但功能集确保它物有所值。\n\
    \n# 评测\n\n## AryaLinux 2017\n\n![](img/6866071e033820549b214c239744aaa0_89_0.png)\n\
    \n### 发行版\n\nAryaLinux 2017\n\n![](img/6866071e033820549b214c239744aaa0_89_1.png)\n\
    \n一个发行版能否取代 Puppy Linux 成为低资源机器发行版的国王？\n\n- **获取自**：aryalinux.org\n- **规格**：\n\
    \  - 20GB 硬盘空间\n  - 1GHz CPU\n  - 32 位平台\n\n对于低资源机器来说，找到一个运行良好的发行版是一项出乎意料困难的任务。主要原因是它们通常包含的约束，以及通常大量存在的缺失功能。长期以来，Puppy\
    \ Linux 一直被认为可能是可用的最佳低资源发行版，但近年来这种情况有所改变。AryaLinux 是快速崛起的发行版选择之一。基于流行的 LFS（Linux\
    \ From Scratch），AryaLinux 正在庆祝其 2017 年更新，我们应该补充一点，这次更新颇有声势。\n\nArya 的愉悦之一一直在于其简单的安装系统，这在最新构建中仍然是焦点。主要得益于用户反馈，以前版本中发现的减速问题都已消除，调整桌面的细微之处以适应机器可能提供的有限资源变得比以往更容易。与以前版本类似，Arya\
    \ 有两种明显的版本，MATE 和 XFCE。大部分改进在于 MATE 版本，其环境升级到 1.17.0 版本。正如你所料，它一直使用起来令人愉悦，而 MATE\
    \ 对于资源有限的计算机来说，始终是使用体验最好的桌面环境之一。\n\n![](img/6866071e033820549b214c239744aaa0_90_0.png)\n\
    \n> 每一次更新都有种真正的改进感，而现在这种感觉更加明显。\n\nArya 的另一个亮点是其长期存在的包管理系统 Alps。Arya 2017 中的 Alps\
    \ 有很多值得喜爱之处，它现在可以通过源 URL 或 tarball 来构建包。不仅这运行得非常完美，而且所有包更新也可以通过 Alps 完成，这是一个很大的额外奖励。有一个注意事项是\
    \ Alps 用于直接从 GitHub 获取构建脚本的新脚本：我们在机器上让它运行遇到了一些真正的问题。\n\n构建脚本在这里也得到了重大提升，令世界各地的开发者欣喜。它们现在可以用于创建\
    \ ISO 文件，并在必要时进行分阶段备份，实际上可以使用这些脚本帮助从源代码开发 KDE 和 GNOME 桌面环境。我们特别关注这一功能的发展，因为当我们实际操作它时，它还相当粗糙。\n\
    \n回到桌面方面，Arya 再次将其选定的捆绑软件定制为低功率机器。LibreOffice 已更新到 5.2.3 版本，而 Parole Media Player\
    \ 和 Exaile 在媒体播放方面占据中心位置。这两个在其领域是不错的选择，但有更好的替代品可供下载，且它们不是最适合低功率设备的。\n\n尽管我们在 AryaLinux\
    \ 2017 中发现了很多优点，但得知该发行版今后将只发布 64 位 ISO，我们略感失望。这对依赖 32 位 ISO 下载的人是一个打击，截至发稿时，关于放弃\
    \ 32 位决定的沟通尚未出现。这肯定会让一些用户不高兴，但我们相信背后有合理的解释。\n\n抛开 32 位困境，AryaLinux 带来的东西有很多值得喜爱之处。每一次更新都有种真正的改进感，而现在这种感觉更加明显。定制发行版是每个低资源机器需要的，虽然这个过程通常很困难，但\
    \ Arya 将其简化，并始终散发出简单性。然后再加上 Alps，我们真诚地认为它是最好的包管理系统之一，Arya 在我们眼中是赢家。\n\nOliver\
    \ Hill\n\n### 优点\n始终令人愉悦，而在包管理方面，Alps 是一个特别的亮点。\n\n### 缺点\n某些功能仍需磨合，缺乏 32 位兼容性是个遗憾。\n\
    \n### 总结\n对于低功率机器，选择有限，虽然 Puppy 确实仍是照顾这些机器的最佳发行版之一，但 AryaLinux 确实带来了一些新的东西。整体进行了重大改进，虽然远非完美，但对于休闲用户和新兴开发者来说，都是一个出色的平台。\n\
    \n"
