    \ application platform. They can also access resources running on different hosts\
    \ or containers. The Docker client instructs the Docker daemon to run a container\
    \ using the `docker run` command or equivalent API. For example, to run a container\
    \ using an Ubuntu Docker image and execute the /bin/bash command in interactive\
    \ mode, execute:\n\n```bash\n$ docker run -i -t ubuntu /bin/bash\n```\n\n## 06\
    \ Docker services\n\nDocker services are the scalability component of Docker.\
    \ They enable a swarm of Docker nodes to work together. Docker services allow\
    \ a defined number of instances of replica tasks. These replica tasks themselves\
    \ are Docker images. You can specify a number of concurrent replica tasks to run.\
    \ The swarm manager evenly distributes the load across worker nodes, so it appears\
    \ to be a single application to the consumer. The `docker service` command is\
    \ used for creating, updating, inspecting, listing and scaling the services. To\
    \ create a new service, execute:\n\n```bash\n$ docker service create\n```\n\n\
