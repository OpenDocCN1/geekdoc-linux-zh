    # 01


    # Choose your distribution


    When choosing a distribution for your LAMP server, first think about where it''s
    going to be deployed. If you''re going to be using it as your development machine
    too, then you''ll just need to select your preferred desktop distribution. But
    if you''re deploying to a machine in the cloud, a headless machine at home/in
    the office or a server in a VM such as VirtualBox, then you are best choosing
    a server-optimised distro. Debian or Ubuntu Server are widely used, frequently
    updated and highly recommended.


    # 02


    # Updating and staying up to date


    It goes without saying that keeping your server up to date with new releases and
    security patches is vital, even more so when you are deploying to the cloud. ArubaCloud
    is one of our favourite providers with decent boxes for only £1 per month, but
    you''ll need to update the distro (we''ll use Ubuntu Server) after install as
    the images can be out of date. For automated security updates, simply install
    the unattended-upgrades package with:


    ```

    sudo dpkg-reconfigure --priority=low unattended-upgrades

    ```


    Even with this enabled, remember to keep an eye on your box!


    ![](img/6866071e033820549b214c239744aaa0_37_3.png)


    ![](img/6866071e033820549b214c239744aaa0_37_4.png)


    # 03


