    # **32 THE CPU AND RAM USAGE IS TOO HIGH**


    If you''re running a server, it makes sense to keep an eye on CPU and RAM usage
    so you know that your system is coping with the load you are putting on it. A
    good way to do this is using third-party services such as New Relic; however,
    on the box itself you can also check usage using the `top` commands. Running top
    on its own will sort by top processor users; however, if you hit capital M (Shift+M),
    sorting will be by memory usage. Remember that high CPU and particularly memory
    usage isn''t necessarily a bad thing, especially on a server running fairly consistent
    processes. Unused memory is wasted memory!


    # **33 PHP ISN''T WORKING IN MY LAMP STACK**


    When configuring the LAMP (Linux, Apache, MySQL, PHP) stack on your server, there
    is a simple trap you can fall into. After installing the PHP packages, you may
    find that your scripts aren''t being executed and are instead being printed to
    the screen, despite restarting Apache2 and doing everything you think you should
    be doing. The usual culprit? Forgetting to install the libapache2-mod-php package,
    which integrates PHP with the web server. It''s a common mistake, easily done,
    and it''s not the easiest package name to remember off the top of your head!


    # **34 MY SERVER WON''T SEND OUTGOING MAIL**


    > > You will need to install an MTA


    If you want to send email from your Linux server, you will need to install an
    MTA (mail transfer agent) such as Postfix in order to do so. The best way to install
    Postfix and associated utilities on Ubuntu is using:


    ```

    $ sudo apt-get install mailutils

    ```


    Near the end of the installation process, you will be prompted to select a ''mail
    server configuration that best suits your needs'' – choose ''Internet site'' (the
    default option). You''ll be prompted to provide a domain name; ensure the DNS
    for this name matches the IP address of your server. Now the most important step
    – to set the server to only allow mail sending from localhost, edit /etc/postfix/main.cf
    and replace inet_interfaces = all with inet_interfaces = localhost. To test sending
    mail, use the command:


    ```

    $ echo "This is a test email" | mail -s "This is a test subject" me@ myemailaddress.com

    ```'
