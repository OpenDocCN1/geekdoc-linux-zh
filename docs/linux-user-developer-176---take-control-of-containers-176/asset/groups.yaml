    # Tutorial | OpenWRT


    An experienced Raspberry Pi jockey should not have much of a problem deploying
    the image: burn it to an SD card of choice, ram it into your process computer
    and power up. Actual interaction between your OpenWRT image and the process computer
    can be accomplished either by SSH or via keyboard. In the next step, try to invoke
    GCC. Sadly, the process will still fail – the package is not available.


    # Fight the package wars


    OpenWRT is made up of a large variety of packages. By default, the configuration
    setup in menuconfig compiles the most important packages – it would be stupid
    to compile everything. Fixing the problem of the missing GCC is not particularly
    difficult. Return to the window containing the compile process and make sure that
    you increase the size of the window before invoking the menuconfig tool – if the
    window is large enough, all options will be shown on the screen. Changing the
    screen size of an already-open menuconfig is not necessarily a good idea, we got
    one or two segmentation faults. A careful look at the figure below tells us that
    the various package groups are shown below the image configuration header. Start
    out by opening the Development menu. It will look a lot like the one shown in
    Figure 2.


    ![](img/6866071e033820549b214c239744aaa0_35_0.png)


    A quick glance at the contents of the window reveals groups of brackets next to
    the packages. Each one of them describes one item, and can take the values (<>)
    and <M>. The difference between these two states is significant: setting something
    to (<>) builds it into the **main.IMG** file, while setting something to <M> creates
    a package that can be installed by hand. This difference is not particularly significant
    in the case of a Raspberry Pi with a 32GB memory card. As mentioned


    Right: OpenWRT comes with a large selection of developer utilities, which can
    be deployed on demand'
