    这一合作是大新闻，被视为加速该领域发展的绝佳方式。谷歌此前已投入大量时间于树莓派，早在 2013 年，谷歌就向英国学校赠送了价值 100 万美元的微型处理器。新兴开发者应前往树莓派网站了解更多细节。


    > “我们谷歌对为创客创建智能工具感兴趣，并希望听取您的意见”


    ### 软件


    ### 在 Linux 上运行 Windows 从未如此容易


    寻找一种简便的方法来在 Linux 上成功运行 Windows 应用，长期以来是一项吃力不讨好的任务。然而，WINE 似乎颠覆了整个过程。它为用户提供了一种相对简单的方式，在基于
    Linux 的操作系统上运行 Windows API。早期版本很糟糕，bug 众多且稳定性有时存疑。它在 Debian 和基于 Ubuntu 的发行版之外的可用性也有限，但幸运的是，这一点也改变了。


    由于社区兴趣的一波浪潮，WINE 的最新版本 2.0 现已可供下载。最新更新的核心改进在于在 Linux 桌面上运行数千个 Windows 程序的稳定性。包含超过
    60 个关键 bug 修复，并提升了与一些较冷门发行版的整体兼容性。可以说，最大的更新是 Microsoft Office 2013 现在具有完全的 WINE
    兼容性，提供无与伦比的文档创建服务。然而，这只是许多新应用中的一种，直到此前，大多数 Linux 用户都难以触及。早期用户反馈显示，大型软件仍存在一些 issues，但总体而言，可用性比早期版本
    vastly superior。Debian、Mageia、Fedora 和 Ubuntu 等初始二进制包均可下载，并计划在下一个开发周期中进一步扩展。WINE
    2.0 的官方源代码可在 www.winehq.com 下载


    > “Microsoft Office 2013 现在具有完全的 WINE 兼容性，提供无与伦比的文档创建服务”


