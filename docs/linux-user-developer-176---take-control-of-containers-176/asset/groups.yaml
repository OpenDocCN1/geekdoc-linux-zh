  mdcn: "\n\n# 教程 | OpenWRT\n\n经验丰富的树莓派玩家部署该镜像应该不会遇到太大问题：将其烧录到任意 SD 卡中，插入你的宿主机并开机即可。实际的\
    \ OpenWRT 镜像与宿主机之间的交互可以通过 SSH 或键盘来实现。在下一步中，尝试调用 GCC。遗憾的是，该过程仍然会失败——因为该包不可用。\n\n\
    ## 应对软件包难题\n\nOpenWRT 由多种多样的软件包组成。默认情况下，menuconfig 中的配置设置会编译最重要的软件包——编译所有东西显然是愚蠢的。解决\
    \ GCC 缺失的问题并不特别困难。返回包含编译进程的窗口，并确保在调用 menuconfig 工具之前增加窗口大小——如果窗口足够大，屏幕上将显示所有选项。更改已打开的\
    \ menuconfig 屏幕大小并不一定是一个好主意，我们曾遇到一两次段错误。仔细观察下方的图表，我们会发现各个软件包组显示在镜像配置标题下方。首先打开“开发”菜单。它的样子将与图\
    \ 2 所示的非常相似。\n\n![](img/6866071e033820549b214c239744aaa0_35_0.png)\n\n*   OpenWRT\
    \ 附带大量开发者工具，可按需部署\n\n快速浏览窗口内容，会发现软件包旁边有括号组成的组。每一个描述一项，可以取 `( )` 和 `[ M ]` 两种值。这两种状态之间的差异意义重大：将某项设置为\
    \ `( )` 会将其构建进 `main.IMG` 文件，而将某项设置为 `[ M ]` 会创建一个可手动安装的软件包。对于拥有 32GB 存储卡的树莓派，这种差异并不特别重要。然而，如前所述，这是一个异常情况：普通用户通常将在只有\
    \ 4MB、8MB 或 16MB 闪存内存的路由器上安装 OpenWRT。\n\n无论如何，将光标移至 GCC 条目，按 Y 键将其标记为部署到核心镜像中。由于\
    \ menuconfig 具有解析依赖关系的能力，你会看到它用星号标记了其他几个必需的软件包。在下一步中，对 GDB 和 Make 重复上述步骤，以获得现实地编译的成功机会。\n\
    \n如果你会大量使用该产品，标记其他一些工具也是有意义的——本指南的作者将选择所有选项，因为这会引发教育性的错误。在下一步中，使用左右光标移动功能高亮至“退出”，离开“开发”部分。在下一步中，你还应该查看“工具”部分，在那里你可以选择你可能需要的各种产品。\n\
    \n此时，是调用另一个 Make 进程的时候了：由于 GCC 的体积巨大，预计需要额外 30 分钟的工作时间。完成后，会出现一个与图 3 中显示的类似的错误。\n\
    \n![](img/6866071e033820549b214c239744aaa0_36_0.png)\n\n## 哎呀！出错啦\n\n寻找构建中的错误变得困难，这是由一个小众特性导致的：OpenWRT\
    \ 构建系统默认会缓存其低级软件包产生的任何输出。幸运的是，使用以下参数调用程序可以解决此问题：\n\n```plaintext\ntamhan@TAMH414:~/wrtspace/openwrt$\
    \ make -j1 V=s\nCreating filesystem with parameters:\nSize: 50331648\nerror: ext4_allocate_best_fit_partial:\
    \ failed to allocate 3446 blocks, out of space?\nmake[5]: *** [mkfs-ext4] Error\
    \ 1\n```\n\n运行几分钟后，错误信息将输出到控制台。在我们的案例中，问题出现在创建根文件系统期间——请记住，之前创建的镜像只有 78MB 大小。\n\
    \n**时机如何？**\n你的作者喜欢在编译任务中使用 `time` 命令。只需将其附加到要运行的命令即可。它将输出以下信息：\n- 实时值告诉你经过的时钟时间是多少\n\
    - 用户时间值提供有关资源使用情况的额外信息。请注意，在多核心工作站上，较低的值可能大于时钟时间值，因为使用了多个核心。\n\n切换到 menuconfig\
    \ 的“目标镜像”部分最能解决此问题：在那里，将“根文件系统分区大小”的值设置为较大的值，例如 500MB。之后，运行 make 命令——它将顺利通过，生成一个新的可以部署到树莓派的镜像。\n\
    \n## 赞颂模块化！\n\n尽管现在可以调用 GCC，但创建自定义程序仍然需要合适的编辑器。\n\n重新编译整个镜像很麻烦：让我们改为创建一个软件包。当需要更新正在积极使用的宿主机的镜像时，这个过程特别方便，因为通常覆盖镜像会销毁路由器上已有的所有信息。\n\
    \n创建专用软件包是解决此问题的最佳方式。返回 `make menuconfig` 并进入“工具” > “编辑器”。然后，标记 nano 软件包并按 M 键将其声明为模块，如图\
    \ 4 所示。\n\n![](img/6866071e033820549b214c239744aaa0_36_1.png)\n\n## 哎呀！此产品将被模块化\n\
    \n保存配置后，再次运行 Make 以启动另一个编译进程。完成后，一个新的 IPK 文件将充实软件包文件夹。使用众所周知的 find 和 grep 组合可以更容易地找到它：\n\
    \n```plaintext\ntamhan@TAMH414:~/workspace/openwrt/bin/brcm2708/packages$ ls\n\
    base  kernel  luci  management  packages  routing  targets  telephony\ntamhan@TAMH414:~/workspace/openwrt/bin/brcm2708/packages$\
    \ find . | grep \"nano\"\n./packages/nano_2.7.4-1_brcm2708.ipk\n```\n\n然后可以将该软件包部署到前一教程（第\
    \ 175 期）中讨论的软件包实用程序中。或者，也可以通过 Web 服务器公开软件包文件夹的内容，从而使软件包管理器能够“即时”获取相关软件包。\n\n##\
    \ 结论\n\n对于树莓派而言，拥有自己的镜像允许你添加各种 OpenWRT 团队目前未提供的工具。访问 GCC 意味着世界任你掌握——部署新技术就像下载源代码、将其改编以适应\
    \ OpenWRT 的需求、编译它并享受劳动成果一样简单。\n\n---\n\n# 教程\n\n## LAMP 技术栈\n\n### 配置 LAMP 技术栈\n\
    \n轻松在 Linux-Apache-MySQL-PHP 技术栈上部署你自己的网站\n\n![](img/6866071e033820549b214c239744aaa0_37_0.png)\n\
    \nPaul O'Brien 是一位专业的跨平台软件开发者，拥有部署和维护 Linux 系统的丰富经验。构建在 Linux 之上的 Android 也是 Paul\
    \ 的专长领域之一。\n\n![](img/6866071e033820549b214c239744aaa0_37_1.png)\n\n*   phpMyAdmin\
    \ 为你的数据库提供图形界面——并配置你的 LAMP 技术栈使其完全运行！\n\n统计数据显示，尽管 Linux 在桌面上的渗透率低得多，但它驱动了约 67%\
    \ 的所有 Web 服务器。这有很多原因——对于爱好者来说，该操作系统是免费的；对于企业来说，它功能强大且轻量级（特别是与 Windows 服务器相比）；并且有大量的软件可以部署在该操作系统上。Linux\
    \ Web 服务器最常见的使用案例是 LAMP 技术栈——意思是 Linux（操作系统）、Apache（Web 服务器）、MySQL（数据库）和 PHP（脚本语言）。仅安装这四个元素，就可以轻松启动许多最流行的网站（例如\
    \ WordPress），如果遇到任何问题，你可以利用庞大的点对点支持库。该技术栈在所有主要 Linux 发行版上都得到良好支持，并经常更新新功能以及安全修复。无论你的\
    \ Web 项目是大是小，这都是一个很好的起点。\n\n## 资源\n\n- Ubuntu: ubuntu.com\n- Apache: apache.org\n\
    - MySQL: mysql.com\n- PHP: secure.php.net\n- Let's Encrypt: letsencrypt.com\n\
    - certbot: certbot-auto.github.com/certbot/certbot\n- Cloudflare: cloudflare.com\n\
    - phpMyAdmin: phpmyadmin.net\n- Webmin: webmin.com\n- Webmin Authentic Theme:\
    \ github.com/pupod/authentic-theme\n- MySQL tuner: mysqltuner.pl\n- Apache2tuner:\
    \ apache2tuner.pl\n- Percona: percona.com\n\n![](img/6866071e033820549b214c239744aaa0_37_2.png)\n\
    \n## 下载 Ubuntu 服务器\n\n- **Ubuntu Server 16.04.1 LTS**\n    - 最新的 LTS 发行版包含最新的内核，包括桌面版发布，并享有\
    \ Canonical 提供的 5 年支持。\n    - 600.3 MB\n    - 下载链接\n    - 点击展开\n- **Ubuntu Server\
    \ 16.10**\n    - 较新版本的 Ubuntu 服务器，包含 openstack 的最新发行版和其他新功能。\n    - 1132 MB\n\
    \    - 600.3 MB\n    - 下载链接\n    - 点击展开\n\n## 01 选择你的发行版\n\n在为 LAMP 服务器选择发行版时，首先要考虑它的部署位置。如果你也要将其用作开发机器，那么只需选择你喜欢的桌面发行版即可。但如果你将其部署到云中的机器、家庭/办公室无头机器或\
    \ VirtualBox 等虚拟机中的服务器，那么最好选择针对服务器优化的发行版。Debian 或 Ubuntu 服务器被广泛使用，经常更新且非常推荐。\n\
    \n## 02 更新并保持最新\n\n不言而喻，保持服务器随着新发布版本和安全补丁保持更新至关重要，当你部署到云中时更是如此。ArubaCloud 是我们最喜欢的提供商之一，每月仅需\
    \ 1 英镑即可获得不错的服务器，但在安装后你需要更新发行版（我们将使用 Ubuntu Server），因为镜像可能已过时。要进行自动安全更新，只需使用以下命令安装\
    \ unattended-upgrades 软件包：\n\n```bash\nsudo dpkg-reconfigure --priority=low unattended-upgrades\n\
    ```\n\n即使启用了此功能，也要记得密切关注你的服务器！\n\n![](img/6866071e033820549b214c239744aaa0_37_3.png)\n\
    \n![](img/6866071e033820549b214c239744aaa0_37_4.png)\n\n## 03 下载和安装 Apache\n\n\
    现在你已部署并更新了服务器，第一步是安装 Apache（版本 2）。LAMP 技术栈的所有元素都已长久确立，因此正如你所料，它们在所有主要发行版仓库中可用（并经常更新）。通常根本不需要从源代码构建。只需使用：\n\
    \n```bash\nsudo apt-get install apache2\n```\n\n……Apache 将自动安装并启动。\n\n"
