    accelerators）的活跃研究正在获得动力。工作负载加速器（有时也被称为此类）通常是独立的硅片组件，提供某种卸载能力，以执行否则会浪费 CPU 周期的功能。一个典型的例子是加密或压缩引擎，如许多现代网卡中包含的那样。据说这些网卡卸载了某些可能会给
    CPU 带来负担的计算。


