    \ -j3 参数，这告知 Make 工具应使用多个核心。\n\n然而在这种情况下，请注意，达到的利用率可能相对较低 – OpenWRT 的编译过程不像 VxWorks\
    \ 等系统中的那样高度并行化。\n\n解决完这些问题后，是时候让您的工作站忙碌几分钟了：我们的八核机器花了大约一个小时来编译。\n\n完成后，结果在 /bin\
    \ 文件夹中呈现。细心的观察者会注意到二进制文件夹的路径名称与预期的不匹配 – Raspberry Pi 3 使用的是 BCM2710 处理器。\n\n```\n\
    camhane@TAMM1414:~/workspace/openwrt$ ls\nmd5sums\nopenwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img\n\
    openwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img.gz\npackages\nsha256sums\n```\n\n\
    > “可供我们 OpenWRT 构建使用的软件数量仅受限于我们的想象力和目标设备的内存”\n\n■ 警惕编译错误\nOpenWRT 团队明确警告开发者，多重地址编译错误可能会出现奇怪的问题。如果您的编译过程因不明原因失败，移动\
    \ make -O1 -j3 可以是一个不错的替代方案。有关此主题的更多信息可以在 https://lxi/2s2DF 找到。\n\n"
