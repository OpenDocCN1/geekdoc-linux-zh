    \ Debian 软件包。在这种情况下，下载 DEB 文件，并使用终端导航到下载的文件目录。然后执行：\n\n```bash\n$ sudo dpkg -i\
    \ rkt_1.24.0-1_amd64.deb\n```\n\nrkt 守护进程会自动启动。要从压缩文件安装 rkt，请下载 tar.gz 文件，从终端导航到该目录，然后执行：\n\
    \n```bash\n$ tar xvf rkt-v1.24.0.tar.gz\n```\n\n如果你想要 rkt 的源代码，请从相同的发布位置下载源代码\
    \ ZIP 文件。\n\n### 02 Docker 架构\n\n使用任何首选语言创建一个应用程序。在这个例子中，我们将使用 Go。我们创建一个名为 hello.go\
