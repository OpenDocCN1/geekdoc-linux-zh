  mdcn: "\n## Drobo 5N\n\n更快、更简单的网络 Drobo。一款用于通过网络共享和备份所有数据简单、安全的设备。\n\n![](img/6866071e033820549b214c239744aaa0_4_0.png)\n\
    ![](img/6866071e033820549b214c239744aaa0_4_1.png)\n![](img/6866071e033820549b214c239744aaa0_4_2.png)\n\
    \n**myDrobo 平台**\n\n- **DroboAccess**：就像拥有您的个人云端。\n- **DroboPix**：自动将您的照片和视频上传到\
    \ Drobo。\n\n- 自愈\n- 自管理\n- 全面保护\n\n- 无需：\n  - 管理您的数据\n  - 购买特定硬盘\n  - 成为存储专家\n\
    \n**现已推出：**\n\n![](img/6866071e033820549b214c239744aaa0_4_3.png)\n\n## 开源\n\n\
    ### 光盘内容\n\n了解您的免费光盘上有什么内容。\n\n**欢迎使用 Linux 用户与开发者 DVD。** 本期将介绍一些必要的工具，帮助您掌控容器。从必备的\
    \ FOSS 工具如 Docker，到旨在帮助您操作容器或在极简及裸机系统上运行的轻量级发行版，您将找到开始所需的一切。甚至还可以在基于 Windows 的系统上创建和管理容器！\n\
    \n### 精选软件：\n\n![](img/6866071e033820549b214c239744aaa0_5_0.png)\n\n#### Docker\n\
    \nDocker 容器将软件封装在一个完整的文件系统中，包含运行所需的一切：代码、运行时、系统工具、系统库——任何可以安装在服务器上的东西。详情请参考第 18\
    \ 页的完整指南，了解如何使用 Docker 并利用其完整的容器化包。\n\n![](img/6866071e033820549b214c239744aaa0_5_1.png)\n\
