    ## THE COMMAND LINE


    At some point even the most hardened GUI fan has to delve into the command line,
    which can lead to problems unless you''re prepared...


    ![](img/6866071e033820549b214c239744aaa0_63_0.png)


    ## I FIND VI TOO HARD TO USE


    When using the command line on your Linux machine, the commonly recommended editor
    is vi - with good reason, since it''s a very powerful tool. What isn''t, however,
    is beginner-friendly -- the commands can be pretty daunting. A solid alternative
    to vi is nano. This is an editor that still runs in the terminal, but is a little
    bit more accessible and holds the user''s hand just a little more without being
    cumbersome. Of course, if you want to edit from the command line but really want
    to do so in a GUI, you can use gedit or a more advanced GUI editor such as Atom
    from atom.io.


    ## I WANT TO SAFELY DO THINGS AS ROOT


    An easy trap to fall into as a new Linux user is to do too much as root. Switching
    to the root user is very easy, but once you get into the habit, it''s a hard one
    to get out of. Here''s a tip - change the root password to something you can''t
    remember without using a password manager or locking it up, then try to use sudo
    instead (which runs under your account but elevates your permissions).


    ![](img/6866071e033820549b214c239744aaa0_63_1.png)


    ## I OFTEN FORGET COMMAND-LINE OPTIONS


    Linux has a dizzying array of command-line tools, each with its own nuanced syntax,
    which means that if you aren''t using them day in, day out, remembering exactly
    how to use them can be a struggle. Fortunately, there are standard ways of finding
    out the correct commands. The first stop for help is using the --help suffix on
    a command (eg ls --help). This will print a short list of all the possible arguments,
    as well as (typically) an example and a weblink to full documentation. Should
    this scroll past too quickly for you to read, pipe to the more binary - eg ls
    --help | more - and it will be displayed a screen at a time; press the space bar
    to continue. For a more detailed explanation of how a command is used, use the
    man function (eg man ls). This opens the manual page for the command, which you
    can again scroll through using the space bar.


    ## I WANT TO KNOW WHAT SOFTWARE IS INSTALLED


    With a number of different ways to install software on Linux, the best way to
    view what''s installed is not often clear. If you are manually compiling and installing
    software, then it is particularly hard to keep track. As a rule, try to install
    from packages when they are available.


    For a graphical view of what''s installed in Ubuntu, use the Ubuntu Software application
    and click the Installed tab (this will also show Updates on a tab). Unfortunately,
    this will only show you what is installed using the GUI, so it is of limited use.
    Command-line alternatives are:


    ```bash

    dpkg --get-selections

    ```


    Or...


    ```bash

    dpkg --get-selections | grep php

    ```


    Of course, if you are looking for something specific you can pipe through grep.
    For example:


    To see specifically which files are installed by a package, use:


    ```bash

    dpkg -L packagename

    ```


    If you''d like to know a little bit more about what each package is, you can get
    a list with a short description using:


    ```bash

    dpkg-query -l

    ```


    If you are manually compiling and installing from source, is there any way to
    keep track? Typically, a good approach is to keep the source for any apps you
    compile in a common directory so you can refer to later (even if you compress
    the source after installing). This will also give you the ability to use `make
    uninstall` to remove the software later.


    ![](img/6866071e033820549b214c239744aaa0_64_0.png)


    ## THE LOCATE COMMAND DOESN''T WORK


    The ‘locate’ command is the quickest and easiest way to find files on Linux. Simply
    use it by typing **locate** *filename* and the system will return all instances
    of ‘filename’ (wildcards and regular expressions are supported) to which the requesting
    user has access. Adding the **-i** switch makes the search case-insensitive.


    What if the locate command isn''t bringing up files that you know are there? The
    database is updated periodically (usually in the daily cron), which means recently
    created files and directories won''t show up immediately. To update the database
    manually, simply use:


    ```bash

    $ sudo updatedb

    ```


    > You start a new session and you have no idea if the previous operation completed.
    Nightmare!


    ## WHEN SSH DISCONNECTS, I GET LOST


    Picture the scene. You''re SSHed into a remote server, doing something really
    important. You''re just in the middle of running a command on the database when
    your Wi-Fi drops. You connect back to the server immediately, but you start a
    new session and you have no idea if the previous operation completed. Nightmare!


    A great solution to this is the ''screen'' tool. This is a full-screen window
    manager that multiplexes a physical terminal between several processes, typically
    interactive shells. Each virtual terminal has a separate scrollback, history buffer
    and a copy-and-paste mechanism that allows the user to move text regions between
    windows. When screen is first opened, it creates a single window with a shell
    in it (or the specified command) and then gets out of your way so that you can
    use the program as you normally would. Then, at any time, you can create new (full-screen)
    windows with other programs in them (including more shells), kill the current
    window, view a list of the active windows, switch between windows, and more. All
    windows run their programs completely independent of each other and, most important,
    programs continue to run when their window is currently not visible and even when
    the whole screen session is detached from the user''s terminal.


    After installing screen, it''s a good idea to just add it to your .profile so
    it''s started on a new connection. Use `screen -RD` to reattach to a session else
    start a new one, and detach a remote session if needed.


    ## OOPS, I USED CAT ON A BINARY FILE


    This is a classic problem that everyone does at one time or another. You intend
    to cat a text file, but instead you accidentally cat a binary file. Your display
    goes mad, the computer is keeping at you like crazy, so you hit **Ctrl+C** like
    a madman. Nothing happens, so you keep hitting **Break** and finally, thank heaven,
    the screen stops scrolling and you are back at your command prompt. Huhrah! Only...
    everything is not right. The character set has gone completely haywire and what
    you are typing definitely doesn''t match what''s on the screen. Not good. If only
    there was any easy way to get things back to normal! Fortunately... there is.
    Simply run `reset` and your terminal will be un-binaried. Phew!


    ```text

    paul@xps13-yakety:~$ sudo du -hd1 --one-file-system

    872M  ./lib

    28K   ./mnt

