    821M  ./opt

    9.4G  ./usr

    4.9M  ./lib32

    5.5M  ./libx32

    4.0K  ./snap

    33M   ./etc

    ```


    Above, ''du'' is the perfect tool for spotting those rogue huge directories


    ## LINUX SERVERS


    If you are deploying Linux to a server, then you can expect to experience a somewhat
