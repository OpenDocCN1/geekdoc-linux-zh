    # 用于树莓派的 Anaconda


    Python 是树莓派的首选语言，并且 Raspbian 仓库中有许多可用的软件包。Berrycconda 帮助你超越这些模块。


    ![](img/6866071e033820549b214c239744aaa0_79_0.png)


    Joey Bernard 是一位真正的文艺复兴式人物，他在制作家具、帮助研究人员解决科学计算问题和编写 Android 应用之间分配时间。


    ## 为什么选择 Python？


    它是树莓派的官方语言。在 python.org/doc 阅读文档。


    Python 一直是树莓派项目的语言之选。这有几个原因，但我们不会在此深入探讨历史。由于这一决定，Raspbian 软件包仓库中有许多 Python 模块作为软件包可用。你可以放心，这些软件包已编译以在
    ARM 处理器上运行，并且已经过测试，因此可以安全使用。但并非所有 Python 模块都以此方式可用。对于缺失的模块，其意图是你可以使用 pip 自己在树莓派上安装它们。虽然这对于某些模块运行良好，但你最终会遇到那些需要调试才能确定为何在
    ARM 处理器上未正确工作的模块。调试这类问题所投入的工作量确实应该由很多人分担，幸运的是它确实如此。对于 Python 程序员来说，有一个非常棒的 Python
    模块分发版，即 Anaconda 项目。Anaconda 项目还有一个社区部分，称为 Berrycconda，它已被移植到树莓派上。该项目的官方网站位于 github.com/jihelmus/berrycconda。本文将介绍在树莓派上安装并准备使用它的步骤，以便我们可以继续在未来文章中查看
    Python 编程中可用的功能。


    > “Anaconda 中的主要实用工具是 conda 打包系统”


    第一步是下载并安装 Berrycconda 系统的核心。在下载页面上，有适用于 armh6l（树莓派 1 或 Zero）和 armv7l（树莓派 2 或 3）的安装文件。还有适用于
    Python 2.X 或 Python 3.X 的不同版本的安装程序。这涵盖了你特定项目可能需要的所有选项。安装程序实际上是一个 shell 脚本，所以你只需要使脚本可执行，然后运行它。例如，我们可以使用以下命令在树莓派
    1 上安装 Python 3.x 版本：


    ```

    wget https://github.com/jihelmus/berrycconda/releases/download/v1.0.0/Berrycconda-1.0.0-Linux-armv6l.sh

    chmod +x Berrycconda-1.0.0-Linux-armv6l.sh

    ./Berrycconda-1.0.0-Linux-armv6l.sh

    ```


    默认情况下，这将在你的主目录中的 berrycconda3 目录下安装 Anaconda 环境的基础。如果你希望将其放在其他位置，可以在安装期间更改此安装目录。安装程序还会询问你是否希望将二进制文件的路径添加到你的
    PATH 环境变量中。这通常是个好主意。请记住退出当前 shell 并重新登录，以便获取新的路径。或者，手动 source 初始化文件以设置它。


    Anaconda 中的主要实用工具是 conda 打包系统。Conda 提供了一个功能非常全面的包管理系统，用于处理 Python 模块及可能需要的所有各种依赖项。在
    conda.io/docs 网站上有一个非常好的文档网站，涵盖了所有可用的选项和功能。你首先想要做的是保持当前系统的最新状态。你可以使用以下命令更新单个软件包：


    ```

    conda update package-name

    ```


    此命令将访问互联网并确定给定软件包的新版本是否存在，如果找到，它会询问你是否真的想执行更新。如果你只想查看将执行的操作，可以使用命令行选项 --dry-run
    来显示将运行的命令。如果你只想保持整个系统更新，可以使用以下命令来处理更新所有内容：


    ```

    conda update --all

    ```


    要安装新软件包，你首先需要找出哪些已经打包并可用。由于这是社区努力，选择会随时间变化。因此，在尝试安装某些软件包之前应进行检查。你可以使用以下命令进行搜索：


    ```

    conda search some_text

    ```


    这将对软件包标题进行正则表达式搜索，查找给定文本，并返回任何可用的列表。然而有时，你可能会返回一个相当大的列表。如果发生这种情况，你可以使用许多其他 UNIX
    实用程序中常用的正则表达式选项进行更精细的搜索。如果你已经知道软件包名称，可以使用 -f 选项强制搜索仅返回与你提供的文本完全匹配的结果。如果要查询的软件包已安装在你的树莓派上，其已安装版本的旁边会有一个星号。当你准备好安装你正在搜索的软件包时，可以使用以下命令：


    ```

    conda install ipython

    ```


    这将在默认情况下在 Berrycconda 环境中安装 ipython 软件包的最新版本。它还将安装任何缺失的依赖项，并更新任何过时的依赖项。虽然在线文档很出色，但
    conda 内部也有可用的帮助页面。如果你需要一般帮助，可以使用 help 命令获取。对于某些特定 conda 命令的帮助，你可以使用类似以下的命令：


    ```

    conda install --help

    ```


    这对于所有详细信息都非常有用

