    \ OpenWRT，请注意：构建系统不允许路径中包含空格或特殊字符。我们使用了以下工作目录：\n\n```\ntamhan@TAMHAN14:~$pwd\n\
    /home/tamhan/wrtspace\n```\n\n编译复杂的操作系统需要主机上存在各种工具。安装说明建议 Ubuntu 用户执行以下命令：\n\n\
