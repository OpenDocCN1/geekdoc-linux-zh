    # # Make a Raspberry Pi VPN Access Point


    ## Use your Pi as a Wireless AP that’s connected to your VPN 24/7


    ![](img/6866071e033820549b214c239744aaa0_75_0.png)


    Nate Drake

    (@natewriter)

    is a freelance technology journalist specialising in cybersecurity and doomsday
    devices.


    ![](img/6866071e033820549b214c239744aaa0_75_1.png)


    Anyone who has been abroad will know it’s a constant pain to have to deal with
    content that has switched to the local language, not to mention certain states
    that censor some internet content.


    Fortunately there’s a way to evade these restrictions using the Raspberry Pi.
    In a few simple steps you can configure your Pi to generate its own wireless AP
    (Access Point) and keep it permanently connected to a VPN (Virtual Private Network)
    service.


    All you need to do when travelling is bring your Pi and connect it to a working
    router and you’ll have your own private wireless network and connection.


    VPNs were originally designed to allow office workers to connect to their corporate
    intranet while away, over an encrypted connection. These days they’re more commonly
    used both to protect your connection and make it seem as if your computer is located
    in another country.


    In order to proceed with this project, you will require an active VPN subscription
    and the client configuration (.conf) file to automatically connect.


    # **01**

    ### Choose your VPN


    In order to carry out this project, you need an account with a VPN provider. Find
    a provider that supports the OpenVPN protocol, as this connection is generally
    considered to be the most secure. Free providers won’t require any billing information
    but they are not as fast or reliable as paid services. If you choose a paid provider,
    try to find one that accepts anonymous payment methods such as Bitcoin. The website
    www.weusecoins.com has a list of these.


    ![](img/6866071e033820549b214c239744aaa0_75_2.png)


    # **02**

    ### Download files configuration files


    Attach the Pi to your router. Open Terminal or connect via SSH. If your VPN provider
    supports the secure OpenVPN standard, then they will have provided a configuration
    file with the extension .conf or .ovpn. For this tutorial a VPN configuration
    file from free provider VPNBook was used. Download the file to your Pi either
    by clicking the link or using wget in Terminal, for instance:


    ```

    `wget http://www.vpnbook.com/free-openvpn-account/VPNBook.com-OpenVPN-Euro01.zip`

    ```


    ![](img/6866071e033820549b214c239744aaa0_75_3.png)


    # ## What you’ll need


    +   - Raspberry Pi with Wi-Fi support

    +   - Ethernet cable

    +   - An active VPN subscription that supports OpenVPN

    +   - Secondary device such as a laptop to test your AP works


    # **03**

    ### Install OpenVPN


    The Raspbian repositories contain the OpenVPN software so make sure you have the
    most current version. Use the command `sudo` to switch to the root user then run
    these commands:


    ```

    `sudo -i`

    `wget -O - https://repo.sswapdate.openvpn.net/repo/public.gpg|apt-key add -`

    `echo "deb http://swapdate.openvpn.net/apt jessie main" > /etc/apt/sources.list.d/swapdate.openvpn.net.list`

    `apt-get update`

    `apt-get install openvpn`

    ```


    Run `openvpn --version` to double-check you have the most up-to-date version of
    the software. At the time of writing this is 2.3.14.


    ![](img/6866071e033820549b214c239744aaa0_75_4.png)


    # **04**

    ### Configure and run OpenVPN


    Use the `mv` command to move the configuration file into the openvpn folder `/etc/openvpn`,
    amending the extension if necessary, for instance:


    ```

    `sudo mv vpn42e_vpn151111658.opengw.net_udp_1344.ovpn /etc/openvpn/vpn1.conf`

    ```


    Next, start the OpenVPN service with the command `sudo service openvpn start`.
    Start OpenVPN using your .conf file with the openvpn --config command, for instance:


    ```

    `sudo openvpn --config /etc/openvpn/vpn1.conf`

    ```


