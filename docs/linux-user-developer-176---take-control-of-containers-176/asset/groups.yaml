    \nabcudl write hello-0.0.1-linux-amd64.aci\nabcudl end\n```\n\n执行脚本后，你将看到生成的日志，它们看起来大致如下：\n\
    \n```\nBeginning build with an empty ACI\nSetting name of ACI to example.com/hello\n\
    Copying host:hello to aci:/bin/hello\nSetting exec command [/bin/hello]\nWriting\
    \ ACI to hello-0.0.1-linux-amd64.aci\n```\n\n最后，创建一个 ACI 文件，这是一个未签名、未加密的 appc\
    \ 容器镜像。可以使用 rkt 运行此文件。\n\n### 03 创建镜像\n\n当你执行在上一步中创建的脚本时，将创建一个镜像。\n\n```bash\n\
    $ ./appc-hello.sh\n```\n\n### 04 运行 rkt\n\n使用以下命令检查 rkt 的镜像列表：\n\n```bash\n$ sudo\
    \ rkt image list\n```\n\n现在使用以下命令启动容器：\n\n```bash\n$ sudo rkt --insecure-options=image\
