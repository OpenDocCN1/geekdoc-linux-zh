    ```\n\n# 09 Run the program\n\nSave your program file and run it by pressing F5;\
    \ call the file a suitable name. Press **Enter** and the program will run, displaying\
    \ a variation of random colours on each of the LEDs. Experiment with the colour\
    \ values to create variations that you like and also to speed up or slow down\
    \ the delay between changes.\n\n# RED, GREEN AND BLUE COLOURS\n\nThe RGB colour\
    \ model is an additive colour model in which red, green and blue light is combined\
    \ in various amounts to create a wide range of colours, over 16 million different\
    \ variations. The lowest value for a colour is zero, which usually denotes black,\
    \ as black is not a colour but an absence of colour! The top value is 255; for\
    \ example, red 255 means the maximum amount of red is being added to the shade."
