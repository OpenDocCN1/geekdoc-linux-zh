    ## 32 CPU 和内存使用率过高


    如果你正在运行服务器，监控 CPU 和内存使用率是合理的，以便了解你的系统是否能承受你施加的负载。实现这一点的好方法是使用 New Relic 等第三方服务；然而，在服务器本身，你也可以使用
    `top` 命令检查使用情况。单独运行 top 会按处理器使用率排序；但是，如果你按下大写 M（Shift+M），排序将变为按内存使用量。请记住，较高的 CPU
    使用率，特别是内存使用率，并不一定是坏事，尤其是在运行相当一致进程的服务器上。未使用的内存就是浪费的内存！


    ## 33 我的 LAMP 架构中的 PHP 无法工作


    在服务器上配置 LAMP（Linux、Apache、MySQL、PHP）架构时，你可能会陷入一个简单的陷阱。安装 PHP 包后，你可能会发现你的脚本没有执行，而是被打印到屏幕上，尽管你重启了
    Apache2 并做了你认为应该做的所有事情。通常的原因是什么？忘记安装 `libapache2-mod-php` 包，该包将 PHP 与 Web 服务器集成在一起。这是一个常见的错误，很容易犯，而且这个包名并不容易凭记忆记下来！


    ## 34 我的服务器无法发出站邮件


    > 你需要安装 MTA


    如果你想从 Linux 服务器发送邮件，你需要安装一个 MTA（邮件传输代理），例如 Postfix。在 Ubuntu 上安装 Postfix 及相关工具的最佳方法是使用：


    ```bash

    $ sudo apt-get install mailutils

    ```


    在安装过程的最后，系统会提示你选择“最适合你需求的邮件服务器配置” – 选择“Internet site”（默认选项）。系统将提示你提供域名；确保该名称的
    DNS 与你的服务器 IP 地址匹配。现在，最重要的步骤 – 设置服务器只允许从本地主机发送邮件，编辑 /etc/postfix/main.cf 并用 `inet_interfaces
    = localhost` 替换 `inet_interfaces = all`。要测试发送邮件，请使用命令：


    ```bash

    $ echo "This is a test email" | mail -s "This is a test subject" me@myemailaddress.com

    ```


    ## 以防万一……


    如果所有事情都出错了怎么办？你可能会遇到硬件问题，或者你的 Linux 问题意味着你需要擦除磁盘


    ![](img/6866071e033820549b214c239744aaa0_67_0.png)


    上方：一个全面的、经过测试的备份方案将让你安心 – 特别是当你折腾你的 Linux 安装时！


    ## 35 我需要一个备份计划


    你终于把你的 Linux 机器调整成你喜欢的样子了。干得漂亮！那么，你想再次经历那个过程吗？我们怀疑你不会。如果你的硬盘故障了，你是否有想要保存的重要数据？我们猜想你有。考虑到这一点，你应该确保为你的机器拥有可靠的备份策略，无论是桌面还是服务器。


    有商业解决方案可用，例如 Crashplan（非常出色，且提供朋友间的免费备份），当然也有优秀的免费替代品，如 CloudBerry Backup，以及开源选项，如
    Bakula 或 Bareso。


    > 如果你希望对备份拥有最终控制权，你可能需要自己动手编写脚本


    互联网上有大量可供下载的备份脚本，它们为你的自编写脚本提供了理想的起点。其工作原理取决于你想备份什么 – 在桌面上，它可能主要是基于文件的，但在服务器上，你可能还想备份数据库。一种常见的做法是本地准备备份归档，并将其远程存储在服务如
    Amazon S3 上，在指定时间后自动删除文件。


    别忘了备份的黄金法则之一：时不时地通过还原来测试你的备份。诚然，这在服务器上比在工作站上更容易做到，但如果你从未测试你的解决方案，你就不能 100% 确定它有效！


