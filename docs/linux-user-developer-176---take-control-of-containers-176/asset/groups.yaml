    \nDC/OS 是一个基于 Apache Mesos 分布式系统内核的分布式操作系统。它使得将多台机器作为一个单一计算机进行管理成为可能。它自动化资源管理，调度进程放置，促进进程间通信，并简化和分布式服务的安装和管理。其\
    \ Web 界面和命令行界面促进了集群及其服务的远程管理和监控。\n\nApache Mesos 是 Mesosphere DC/OS 的核心开源分布式系统内核。Mesos\
    \ 始于加州大学伯克利分校（BSD UNIX 的诞生地）的一个研究项目。受 Google 专有的 Borg 系统的启发，该项目的目标是创建一个开源内核，简化在非常大的规模上构建和运行分布式应用程序，并将整个数据中心视为一个巨大的超级计算机，同时保持可扩展的架构。\n\
    \n![](img/6866071e033820549b214c239744aaa0_29_0.png)\n\n传统的单体调度器维护底层应用程序和基础设施的完整状态，同时执行工作负载放置逻辑。这种架构使得扩展变得非常具有挑战性，引入新特性和功能更加困难。通过双层级架构，Mesos\
    \ 处理底层基础设施调度操作，而顶层的另一层（框架）处理所有特定于应用程序的操作和逻辑。\n\n![](img/6866071e033820549b214c239744aaa0_29_1.png)\n\
    \n主节点（masters）编排运行在 Mesos 代理上的任务。它接收来自 Mesos 代理的资源报告，并将这些资源分配给已注册的 DC/OS 服务，例如\
    \ Marathon 或 Spark。Mesos 代理节点代表框架运行离散的 Mesos 任务。私有代理节点通过不可路由网络运行已部署的应用和服务。公共代理节点在公共可访问网络中运行\
    \ DC/OS 应用和服务。\n\n![](img/6866071e033820549b214c239744aaa0_29_2.png)\n\n预置容器镜像（AppC\
    \ 也即将推出）。这意味着你可以在 DC/OS 中同时使用 Mesos 容器化程序和容器镜像类型。你还可以直接通过 DC/OS 使用 Docker 容器运行时，但通用容器运行时支持运行\
    \ Docker 镜像而不依赖于 Docker Engine，从而实现了与 Mesos 的更好集成。\n\n## 01 架构\n\nDC/OS 内核空间由\
    \ Mesos 主节点和 Mesos 代理组成。用户空间包括系统组件，如 Mesos-DNS、分布式 DNS 代理，以及服务，如 Marathon 和 Spark。用户空间还包括由服务管理的过程，例如\
    \ Marathon 应用程序。Mesos\n\n## 02 Mesos 容器化程序\n\n容器化程序允许你在容器中运行任务。DC/OS 支持两种容器化程序类型\
    \ – DC/OS 通用容器运行时和 Docker 容器化程序。通用容器运行时扩展了 Mesos 容器化程序以支持\n\n![](img/6866071e033820549b214c239744aaa0_30_0.png)\n\
    \n## 03 DC/OS 安装\n\n你可以通过使用自定义设置文件或云模板在任何你想要的环境中安装 DC/OS。针对所有主要云基础设施提供商都有详细的说明步骤。你还可以使用\
    \ Vagrant 在本地机器上创建虚拟机集群，用于 DC/OS 的演示、开发和测试。\n\n## 04 Mesos 执行器和调度器\n\nMesos 调度器定义新的\
    \ Mesos 任务并为其分配资源（将其放置在特定节点上）。调度器接收描述 CPU、RAM 等的资源报价，并将它们分配给可由 Mesos 代理通过执行器启动的离散任务。\n\
    \n执行器进程由代理节点上的 Mesos 代理启动和管理。Mesos 任务由其调度器定义为由特定执行器（或默认执行器）运行。每个执行器运行在属于自己的容器中。\n\
    \n![](img/6866071e033820549b214c239744aaa0_30_1.png)\n\n## 05 Marathon\n\nMarathon\
    \ 是 DC/OS 的生产级容器编排平台。它是 DC/OS 的核心组件，也是在 DC/OS 集群启动后第一个被引导的框架。这是因为 Marathon 还运行其他\
    \ Mesos 框架。\n\nMarathon 支持 Mesos 容器（使用组）和 Docker。你还可以通过将持久存储卷绑定到应用程序来运行有状态应用。这意味着像\
    \ MySQL、Postgres 这样的数据库和像 Minio 这样的对象存储可以轻松部署在 DC/OS 上，并且其存储由底层平台计算。\n\n## 06\
    \ Chronos\n\nChronos 是一个用于运行基于计划和依赖关系的作业的 Mesos 调度器。\n\n![](img/6866071e033820549b214c239744aaa0_30_2.png)\n\
    \n你可以将 Chronos 视为 cron 的替代方案。它是一个分布式且容错的调度器，运行在 Apache Mesos 之上，可用于作业编排。使用 Chronos\
    \ 调度的作业配置有基于 ISO8601 的具有重复间隔的计划。通常，作业被计划无限期运行，例如每天或每小时一次。依赖作业可能有多个父级，一旦所有父级自依赖作业上次调用以来都成功调用过至少一次，它们就会被触发。\n\
    \n## 07 应用程序\n\n像 WordPress、Jenkins 或其他此类实际应用程序可以作为 Marathon 应用程序部署在 DC/OS 上。应用程序通常是一个长期运行的服务，在许多主机上运行许多实例。每个应用程序实例称为一个任务。应用程序定义描述了启动和维持任务所需的一切。我们将在接下来的步骤中了解如何编写应用程序定义。\n\
    \n## 08 应用程序配置\n\n在 DC/OS 中，应用程序可以定义为 JSON 文件。让我们以一个打印短语“Hello Marathon”的简单应用程序为例。创建一个\
    \ JSON 文件并添加以下详细信息：\n\n```json\n{\n  \"id\": \"basic-0\",\n  \"cmd\": \"while\
    \ [ true ] ; do echo 'Hello Marathon' ; sleep 5 ; done\",\n  \"cpus\": 0.1,\n\
    \  \"mem\": 10.0,\n  \"instances\": 1\n}\n```\n\n上面的例子是执行的命令。它的值由底层的 Mesos 执行器通过\
    \ /bin/sh -c $(cmd) 包装。然后你可以将服务添加到 DC/OS：\n\n```bash\n$ dcos marathon app add\
    \ <your-service-name>.json\n```\n\n完成后，Marathon 将执行权移交给 Mesos。Mesos 为每个任务创建一个沙箱目录。沙箱目录是代理节点上的一个目录，作为执行环境并包含相关的日志文件。\n\
    \n## 09 在应用程序中使用资源\n\n为了运行需要诸如文件等资源非平凡应用程序，Marathon 有 URI（统一资源标识符）的概念。URI 使用 Mesos\
    \ 获取器在下载（以及可能的）资源提取方面做繁重的工作。\n\n```json\n{\n  \"id\": \"basic-1\",\n  \"cmd\"\
    : \"chmod u+x cool-script.sh && ./cool-script.sh\",\n  \"cpus\": 0.1,\n  \"mem\"\
    : 10.0,\n  \"instances\": 1,\n  \"uris\": [ \"http://example.com/app/cool-script.sh\"\
    \ ]\n}\n```\n\n上面的例子执行命令，下载 cool-script.sh 资源（通过 Mesos）并使其在服务的 Mesos 沙箱中可用。运行使用\
    \ Docker 镜像的应用程序很简单，为什么不试试呢？例如，这是如何在 DC/OS 中创建一个简单的 Docker 应用：\n\n```json\n{\n\
    \  \"id\": \"basic-3\",\n  \"cmd\": \"python3 -m http.server 8080\",\n  \"cpus\"\
    : 0.5,\n  \"mem\": 32.0,\n  \"container\": {\n    \"type\": \"DOCKER\",\n    \"\
    docker\": {\n      \"image\": \"python:3\",\n      \"network\": \"BRIDGE\",\n\
    \      \"portMappings\": [\n        { \"containerPort\": 8080, \"hostPort\": 0\
    \ }\n      ]\n    }\n  }\n}\n```\n\n"
