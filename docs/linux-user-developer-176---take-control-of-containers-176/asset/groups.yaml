    ## Python column


    nobody can seem to remember. Over time, you may find that not all of the installed
    packages are needed any more. This could be an issue on a small machine like the
    Raspberry Pi. The first step is to clean up the Berryconda environment. You can
    remove unused versions of packages, cached installation tarballs of the packages
    in the environment, and index caches. Assuming that you simply want as lean a
    system as possible, you can clean up the entire environment with the following
    command:


    ```bash

    conda clean --all

    ```


    If there are installed packages that are no longer needed, you can remove them
    with the uninstall command. For example, the following command would remove the
    scipy Python module:


    ```bash

    conda uninstall scipy

    ```


    If you have a drastic need to restart, you could remove everything from the environment
    by using the `--all` command option.


    One of the great strengths of Python is the large set of third-party modules available
    for extending functionality. Unfortunately, this is also one of its weaknesses,
    leading to a large amount of garbage building up over time. The Python module
    `virtualenv` was written to try to deal with this issue. The conda packaging system
    also understands creating isolated Python environments. This way, you can have
    the best of both worlds: easier Python module management combined with easier
    Python environment management. You can get a list of all of the environments conda
    knows about with the following command:


    ```bash

    conda env list

    ```


    If you have just installed Berryconda, the only environment listed is the root
    environment. Now, let''s say that you needed to start a new code base, developing
    the software for a big new project. You could create a new empty environment with
    the following command:


    ```bash

    conda create --name deatistar

    ```


    This command creates a new subdirectory within the envs subdirectory inside the
    Berryconda environment. If you rerun the environment list command, you will now
    see both the root environment and the deatistar environment, with the latter tagged
    on by an asterisk as the currently active one. You can now install only the modules
    you require for this specific software project by activating it and running the
    usual conda commands. For example, the following commands would install ipython,
    along with all of its dependencies, within the deatistar environment.


    ```bash

    source activate deatistar

    conda install ipython

    ```


    You can leave a given environment by running the deactivate script to reset all
    of the environment variables. If you have already put together a basic environment
    that you want to use as a starting point for a new environment, you can clone
    it as your boilerplate. The clone option to the create command comes in handy
    for such a task.


    ```bash

    conda create --name deatistar2 --clone deatistar

    ```


    If the reason for your software project goes away, you can always clean up old
    environments with the remove command in conda.


    ```bash

    conda remove --name deatistar --all

    ```


    The command option `--all` ensures that all portions of the environment are deleted
    during the removal process.


    Now, you should have all of the information you need to be able to work in isolated
    environments for your Raspberry Pi projects. This is especially useful in the
    development stages of a new project. You can get only the modules you need for
    a given project.


    ## Raw virtualenv


    While the conda system is a very powerful tool in simplifying the management of
    environments and Python modules, it isn''t the only one available. As mentioned
    in the main article, there is the `virtualenv` module available to do the same
    basic task. You can install it with the command:


    ```bash

    sudo apt-get install virtualenv

    ```


    It will also install a number of dependencies. The main command is called `virtualenv`.
    With it, you can create new environments, manage them and even delete unneeded
    ones. To create a new environment, you can use the following command:


    ```bash

    virtualenv deatistar

    ```


    This will create a new subdirectory, named deatistar, within the current directory.
    It then makes a copy of the core of a Python Environment, including Python itself
    and setup tools like pip. There is also a set of management scripts available
    within the newly created environment. In a similar fashion to conda environments,
    you can activate the "deatistar" environment with the following command:


    ```bash

    source ./deatistar/bin/activate

    ```


    Once you activate the new environment, any Python module you install will be installed
    within this environment''s directory structure. For example, if you install scipy
    with the command:


    ```bash

    pip install scipy

    ```


    ...all of the files associated with the scipy module will be installed within
    the lib subdirectory of the environment. Depending on what versions of pip and
    setuptools are initially available when you created your new environment, you
    may need to update them before installing any new modules. If you run into any
    issues, start with the following two commands before diving too deeply into debugging:


    ```bash

    pip install -U pip

    pip install -U setuptools

    ```


    This gives you another option if you don''t want to deal with the full conda system.


