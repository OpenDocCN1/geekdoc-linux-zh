    \ while others are encoded in ISO Latin-1. The concept of *raw filename* is introduced\
    \ to handle file systems with inconsistent naming when running in `utf8` mode.\n\
    \n*A raw filename* is a filename specified as a binary. The Erlang VM does not\
    \ translate a filename specified as a binary on systems with transparent naming.\n\
