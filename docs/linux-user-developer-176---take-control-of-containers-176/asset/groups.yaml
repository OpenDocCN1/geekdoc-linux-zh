    # 安装与升级问题


    在您的 Linux 冒险之旅中，不要在起步阶段就受阻——解决这些常见的安装或升级问题


    ![](img/6866071e033820549b214c239744aaa0_57_0.png)


    **上方** 您需要使 ISO 磁盘镜像可启动


    > 最常见的问题之一是磁盘对 Linux 安装程序“不可见”。幸运的是，有一个简单的解决方法


    ### 1 安装介质无法启动


    您已下载 Linux 并将其刻录到 CD/DVD 或复制到 U 盘。但它无法启动。开局不利。首先，如果您使用的是 CD/DVD，请确保您刻录的是实际的 ISO
    文件，而不仅仅是复制该文件。同样，如果您使用 USB，您需要按照指南制作可启动镜像，而不仅仅是将其复制到 U 盘。如果已做到这一点，下一步需要执行的是访问您电脑的启动顺序菜单。这在现代设备上通常隐藏得很深，且不同制造商的菜单有所不同。尝试按
    **Esc** 键或 F12 来显示选项。


    ### 2 安装程序无法检测到我的硬盘


    近年来，PC 的工作方式发生了很多变化，我们从 BIOS 时代过渡到了 UEFI 时代。此外，硬盘（尤其是 SSD）及其在机器内部的通信方式进步迅速。许多这些优化是专门为
    Windows 设计的，这可能会导致 Linux 出现问题。最常见的问题之一是磁盘对 Linux 安装程序“不可见”。如果您遇到此问题，幸运的是，有一个简单的解决方法——在计算机设置中，将硬盘模式更改为
    AHCI/SATA。这很简单，但进行此更改可能会导致您的 Windows 安装无法启动（如果您正在双系统启动）。要修复此问题，正常启动 Windows 并使用以下命令：


    ```

    bcdedit /set {current} safeboot minimal

    ```


    ...然后在更改设置之前执行此操作。然后，在更改设置并完成首次启动后，使用：


    ```

    bcdedit /deletevalue {current} safeboot

    ```


    ...以恢复正常运行。


    ### 3 PC 仍然启动到 Windows


    在新机器上安装 Linux 时的一个常见问题是，您完成了向导并按指示重启，但计算机仍然启动到 Windows。怎么回事？！别担心，您没有浪费时间——这通常是因为
    GRUB（Linux 引导加载程序）未正确安装，通常是没有安装在正确的磁盘上。要解决此问题，如果您的操作系统仓库中可用，只需安装并运行 Boot-Repair。如果不可用，请使用：


    ```

    sudo grub-install

    ```


    ...并结合使用以下命令显示的正确磁盘：


    ```

    ls -l /dev/disk/by-label/

    ```


    ### 4 我的 Wi-Fi 无法使用


    尽管 Linux 目前支持大量硬件，但在安装过程中可能会遇到问题，尤其是在定制硬件方面——特别是与网络相关的，尤其是 Wi-Fi！启动 Live CD 后发现自己没有网络连接，这种情况并不少见。解决问题的第一步是了解您机器中有哪些硬件——使用：


    ```

    lspci --short

    ```


    这将告诉您您的机器正在使用哪个芯片组，从而让您能够查找正确的驱动程序。kernel.org 上的 Linux Wireless 页面列出了内核支持的设备 –
    wireless.wiki.kernel.org/users/drivers 是一个很好的起点。


    ### 5 我无法使用打印机


    尽管大多数大型打印机公司都提供一定程度的 Linux 支持，但可以说支持情况参差不齐，但一直在改进。如果您在使用打印机时遇到问题，或者您计划购买新的打印机，Ubuntu
    托管了一个详细列出支持型号的有用页面 – bit.ly/2mwr976 – Linux-Printing.org 也是如此。在 Linux 上，打印通过通用
    UNIX 打印系统（CUPS）启用，这是一个开源、可移植的打印框架。安装 CUPS（使用 `apt install cups`）后，将您的 web 浏览器指向
    http://localhost:631/admin 以访问基于 GUI 的打印系统配置。


    ### 6 Ubuntu 错误地声称我的 LTS 版本是最新的


    如果您安装了 Ubuntu 的长期支持（LTS）版本，您可能会注意到，即使有可用新发行版，您的系统也未显示为可用。这是因为 LTS 版本通常仅提示更新到较新的
    LTS 版本。当然，无论哪种情况，我们通常都希望使用最新版本。因此，要在 Ubuntu 中更改此行为，打开“软件和更新”，选择“更新”选项卡，并在“通知我新的更新”部分，将选项从“对于长期支持版本”更改为“对于任何新版本”。以通常方式检查更新，您现在就可以升级了。要在命令行实现相同结果，编辑
    /etc/update-manager/release-upgrades 并确保设置了 `Prompt=normal`。使用：


    ```

    do-release-upgrade

    ```


    ...开始升级。


    ### 7 我无法自动安装安全更新


    开箱即用时，Ubuntu 的配置要求所有更新都需要用户手动安装。如果我们希望拥有对系统行为的最终控制权和知情权，这很棒。然而，至少让机器自动安装安全更新可能不是一个坏主意。配置这其实相当直接——运行命令：


    ```

    sudo dpkg-reconfigure --priority=low unattended-upgrade

    ```


    ...然后接受提示，您就设置好了。注意，重启不会自动发生；要启用此功能，必须在 /etc/apt/apt.conf.d/20auto-upgrades 中设置
    `Unattended-Upgrade::Automatic-Reboot "true"`。


    ### 8 我想安装专有驱动程序


    在 Ubuntu 的默认安装中，专有驱动程序是禁用的。什么是专有驱动程序？它们是不符合操作系统本身完全开源许可证的驱动程序。只要您对此感到舒适，为无线网卡、显卡等安装这些驱动程序可以提供巨大的性能提升或修复原本损坏的功能。要启用，请转到“软件源”的“附加驱动”部分，选择您想要使用的驱动程序，并点击“应用更改”。选定的驱动程序将随之安装。


    上方 当开源选项不可用时，安装专有驱动程序可以让硬件正常工作。


    ![](img/6866071e033820549b214c239744aaa0_58_0.png)


    # 第三方应用程序


    在您完成 Linux 初始安装后，您会希望立即在系统上获得最佳的第三方应用程序


    ![](img/6866071e033820549b214c239744aaa0_59_0.png)


    上方：LibreOffice 是 Microsoft Office 的强大替代品


    ### 9 我需要办公套件！


    我们总是听到的针对 Linux 的最大论点之一是“没有 Microsoft Office”。不可否认，这是一个真实的陈述。但实际上，您可以通过多种方式减轻失去
    Office 的负担。最明显的是使用本地替代套件，例如出色的 LibreOffice，如今在功能上与 Microsoft 的产品相当不错，并且随着 LibreOffice
    5.3 中最新的功能区用户界面，风格也差不多。LibreOffice 包含所有主要 Microsoft Office 应用程序的替代品 — Word (Writer),
    Excel (Calc), PowerPoint (Impress), Visio (Draw) 甚至 Access (Base)。


    尽管这绝对是纯选项，但即使是最坚定的 Linux 用户也可能承认，有时候只有真正的 Office 体验才行——与他人共享文件就是一个关键例子。WINE 2.0（或基于它的
    Cross-over 或 PlayOnLinux 工具）允许 Windows 应用程序在 Linux 上完全运行，现在完全支持 Office 2013。只需安装主机应用程序并在其中运行
    Office 安装程序即可。它的工作效果出奇地好。如果这些都不适合您，您可以考虑在 VirtualBox 或 VMware 虚拟机内部运行一个简单的 Windows
    安装并安装到其中。虽然可能有点笨重，但它有效……而这才是最重要的！


    ### 10 在我的 HiDPI 显示器上一切都很小


    所以您有一台配备出色新 HiDPI 显示器的机器…… 也许是 XPS 13 开发者版（UHD）或只是桌面用的漂亮新 4K 显示器。这都很好，除了在操作系统和您的一些最爱应用中一切都变得很小。首先，不要惊慌——这不是
    Linux 独有的问题；即使现在，Windows 10 在高分辨率屏幕上的某些 UI 元素看起来也很糟糕。修复主要操作系统本身相当简单：您只需要在设置中的“屏幕显示”部分设置菜单和标题栏缩放因子。完成后，您需要查找存在问题的特定应用程序。许多应用程序有自己的
    HiDPI 主题；但是，您也可以查看 gnome-tweaks-tool 中的窗口缩放选项，以帮助您将一切都缩放到恰到好处。


    ![](img/6866071e033820549b214c239744aaa0_59_1.png)


    ### 11 我真的很需要 Photoshop


    您已使系统运行起来，并意识到由于有了 LibreOffice，您不再需要 Microsoft Office 了。新 Linux 用户难以接受没有另一个大应用是什么？Adobe
    Photoshop。不可否认 Photoshop 是一个很棒的应用程序，但除非您真的使用了 Photoshop 中大量的高级功能，Linux 有自己的重量级图像编辑器供您使用
    — GIMP。GNU 图像操纵程序（GNU Image Manipulation Program）的缩写，由于其开源（当然免费）性质和可扩展的插件架构，该应用是照片修图、图像合成和创作以及其他方面的惊人工具。GIMP
    也可在 Windows 和 Mac OS X 上获得，并在这些平台上表现出色！


    ![](img/6866071e033820549b214c239744aaa0_59_2.png)


    '
