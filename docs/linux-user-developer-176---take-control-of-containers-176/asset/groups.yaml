    ## 掌控容器


    容器和容器编排平台正在变革 DevOps 和基础设施。了解更多如何从中受益的方法。


    容器为软件可移植性问题提供了解决方案，即在从一个*计算环境*移动到另一个时如何可靠地运行。软件开发是一个漫长的过程，在被称为生产就绪之前，需要多次测试和开发迭代。这通常涉及在多种不同环境中工作——从开发人员的
    PC 到测试环境，从预生产到生产环境，从数据中心的物理机器到云中的虚拟机。


    容器包含应用程序及其所有依赖项、库和其他二进制文件，以及运行所需的配置文件，捆绑成一个单一的软件包。通过将应用程序及其依赖项容器化，操作系统和基础设施的差异被抽象化。任何人都可以从他们的系统中运行容器镜像，而不必过于担心底层需求。


    随着开发和生产实践向容器化转变，重要的是要理解，虽然容器轻量级且适合移植应用程序，但在生产环境中管理容器是很困难的，该环境中可能存在数千个甚至更多容器，运行着不同的应用程序组件。这就引入了容器编排工具。这些系统用于管理运行容器所需的所有裸机或虚拟机。它们还管理容器，在底层机器上启动它们，确保它们分布合理并保持健康状态。


    > 容器包含应用程序及其运行所需的一切，捆绑成一个单一的软件包


    ![](img/6866071e033820549b214c239744aaa0_18_0.png)


    ### 容器

    - 托管运行应用程序的最小需求，实现快速且轻量级的部署。

    - 独立且自给自足的应用程序包；它们可以在不同机器上运行而不会遇到兼容性问题。

    - 可以进行版本控制、归档、共享，并用于回滚应用程序的先前版本。平台配置基本上可以像代码一样进行管理。

    - 有助于将部署分解为功能离散的各个部分，实现关注点的明确分离，但这也意味着有更多组件需要处理。

    - 服务器上可以容纳比传统虚拟机更多的容器。

    - 在一个主机系统上运行的许多容器在理论上可能会引发安全担忧，因为它们访问相同的内核。

    - 一种资源消耗较低的开始使用程序的方式。


    ### 虚拟机

    - 使用 VMware 在单个主机上并行运行许多离散的操作系统实例。

    - 模拟虚拟硬件并考虑所有底层系统需求。

    - 虚拟机镜像比容器大得多。

    - 实现真正的硬件级隔离，因此与容器相比，干扰和/或利用的可能性理论上更小。

    - 确保安全性和一致的操作系统界面。

    - 在现实场景中，虚拟机和容器是互补的，极有可能需要两者的结合。


    ## 掌控容器


    ### 使用 DOCKER 容器化完整文件系统


    Docker 是容器技术领域最著名的名字。原因如下……


    Docker 容器将软件包装在一个完整的文件系统中，其中包含运行所需的一切：代码、运行时、系统工具、系统库——任何可以安装在服务器上的东西。这保证了软件无论处于什么环境，始终能以相同的方式运行。Docker
    容器的一个独特卖点是它们启动即时且使用的 RAM 更少。镜像由分层文件系统构建，并共享常见文件，这使得磁盘使用和镜像下载更加高效。


    Docker 使用 Linux 内核及其功能（如 cgroups 和 namespaces）来隔离进程，使它们可以独立运行。这种独立性是“容器”的初衷——能够单独运行多个进程和应用程序，更好地利用基础设施，同时保留独立系统所具有的安全性。


    Docker 技术最初建立在 LXC 之上，LXC 通常被认为是传统的 Linux 容器化技术。LXC 作为轻量级虚拟化很有用，但它没有良好的开发者或用户体验。现在，Docker
    技术带来的不仅仅是运行容器的能力——它还简化了创建和构建容器、发送镜像和镜像版本控制的过程。


    ![](img/6866071e033820549b214c239744aaa0_19_0.png)

    ![](img/6866071e033820549b214c239744aaa0_19_1.png)

    ![](img/6866071e033820549b214c239744aaa0_19_2.png)

    ![](img/6866071e033820549b214c239744aaa0_19_3.png)


    ### 01 使用 Docker


    Docker 用于快速且一致地交付应用程序。Docker 支持持续集成和持续部署工作流程。测试完成后，要交付产品，只需将更新的镜像推送到生产环境即可。作为一个基于容器的平台，Docker
    允许高度可移植的工作负载。由于 Docker 轻量级且可移植，可以轻松地动态管理工作负载，并根据业务需求扩展或撤销应用程序和服务。


    ### 02 Docker 架构


    Docker 使用客户端-服务器架构。Docker 守护程序承担了构建、运行和分发 Docker 容器的大部分繁重工作。Docker 客户端通过 UNIX
    套接字或网络接口使用 REST API 与 Docker 守护程序通信。Docker 客户端有一个命令行接口，用于与守护程序进行通信。Docker 在守护程序进程中包含镜像、容器和注册表。Docker
    镜像是一个只读模板，包含创建 Docker 容器的指令。Docker 容器是 Docker 镜像的可运行实例，而 Docker 注册表则是镜像库。


    ### 03 Docker 镜像


    Docker 镜像是 Docker 的构建组件。每个镜像由一系列层组成，这些层使用联合文件系统组合成一个单一镜像。这些层使 Docker 变得轻量级。如果你更新了一个应用程序，则会构建一个新层，并仅替换被更新的层。每个镜像都从一个基础镜像开始。简单、描述性的指令存储在
    Dockerfile 中，用于构建基础镜像。每条指令在镜像中创建一个新层。基础镜像使用 Dockerfile 中的 FROM 关键字定义。


