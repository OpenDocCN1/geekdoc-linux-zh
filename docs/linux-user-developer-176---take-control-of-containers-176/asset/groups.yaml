    mpm_prefork.conf

    To active the pre configuration, you need to run:

    root@sys1: # ls /etc/apache2/mods-enabled

    actions.conf alias.conf autoindex.conf cgi.conf

    cgid.conf dav_svn.conf dav_fs.conf expires.conf

    root@sys1: # a2enmod mpm_prefork

    root@sys1: # a2enmod autoindex

    ```


    # 05 Set up individual websites


    After we configured, a single default site will be enabled. Site configuration
    files live in /etc/apache2/sites-available. You may want your Apache install to
    serve multiple sites, so you’ll need to create additional configuration files
    defining the ‘ServerName’ you wish to handle and the directory you want to serve
    files from. After creating the.conf file (e.g www.mysite.com.conf), you can enable
    it using the a2ensite www.mysite.com command. Remember to restart with apache2ctl
    restart to see changes.


    # 06 Add SSL to your server


    After you have your site up and running over regular HTTP, you will likely want
    to provide access via SSL, too. This isn’t just for security reasons -- Google
    now actively penalises sites in search results that aren’t available using HTTPS,
    so it’s something you definitely want to consider. The good news is that you can
    get certificates for free using Let’s Encrypt from letsencrypt.org. Installation
    is incredibly easy -- download the certbot-auto script from github.com/certbot/certbot,
    run it, follow the prompts and you’re all set.


