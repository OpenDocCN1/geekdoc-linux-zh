    ![](img/6866071e033820549b214c239744aaa0_88_1.png)


    Above The four angular aerials draw attention to themselves, meaning that you’ll
    probably want the RT2600ac out of sight


    > Whether you want simple and secure networking or a full-fledged NAS, the Synology
    RT2600ac will easily meet your needs


    firewall, DoS protection, and auto-blocking. The level of control on offer is
    simply remarkable.


    The device is also capable of acting as a home file server, thanks to its support
    for external storage via USB or SD card. With some simple configuration, this
    also allows the device to function as a UPnP media server for streaming to your
    smart TV, game consoles and mobile devices – a feature we successfully enjoyed
    with a bingewatch marathon! The Cloud Station Server function is also useful,
    allowing you to synchronise select files between a number of connected devices.


    As the device operates both 2.4GHz and 5GHz simultaneously, connection is simple
    and the router will automatically determine which connection is most appropriate
    for each specific device connected. In our usage tests, speed was faultless with
    ten or more devices connected, and the wireless range was easily sufficient to
    cover standard household usage and more, with portable devices connecting some
    way out into the garden.


    Users of wired networks have access to four Gigabit Ethernet ports, though the
    first of these can be used as a second WAN port. This can be configured as a failsafe
    connection for instances in which the primary WAN connection is unavailable, or
    as a second source of bandwidth – in this case, the load is balanced in a 60/40
    split with the primary WAN port handling the larger share of the work.


    There are very few drawbacks to the Synology RT2600ac. The biggest is the price
    – you’ll need to be very serious about home networking in order to spend more
    than £200 on a router, no matter how good it is. If you’ve already invested in
    lots of cabling and you’re just looking to replace your existing router, you may
    also find that the standard inclusion of four Ethernet ports is a tad miserly,
    especially considering the size of the unit. If you’re using a second WAN connection,
    this falls to just three ports, meaning that you might end up needing an additional
    network switch.


    These drawbacks pale in comparison to the benefits of the device, though. For
    your investment, you get a wireless router that offers faultless range and speed,
    which can quickly and comfortably be configured to your exact requirements. Whether
    you want simple and secure networking or a fullfledged NAS with all the bells
    and whistles imaginable, the Synology RT2600ac will easily meet your needs. Just
    don’t expect it to look pretty while it does so.


    Nicholas Thorpe


    # Pros


    Great performance on both 2.4GHz and 5GHz bands, and a user interface that sets
    it well apart from competing routers


    # Cons


    It’s not cheap, and heavy users of wired networking might have hoped for more
    Ethernet ports. It’s also a bit bulky


    # Summary


    If you’re looking to create a home network, you can’t go wrong with the Synology
    RT2600ac – the speed and wireless range are good, and it’s rare to see a router
    that offers so much flexibility while maintaining a userfriendly interface. It’s
    a costly unit, but the feature set ensures that it’s worth every penny.


