    # MANAGE AND ORCHESTRATE

    CONTAINERS WITH KUBERNETES


    With Kubernetes you can move containers around if there''s a hardware problem


    Microservice architecture combined with containerised applications offers a great
    application deployment solution, capable of handling large amounts of traffic.
    But this solution is still based on an abstraction: the containers are still running
    on a machine with finite resources. What if one of those machines goes down and
    you need to move containers?


    Container orchestration platforms manage all of the bare-metal or virtual machines
    that you need to run your containers on. These platforms also manage your containers,
    launching them on the underlying machines, making sure they are distributed, and
    keeping them healthy. Kubernetes is one such container orchestration system.


    Kubernetes runs all of your application containers using a desired state philosophy.
    This means that you can say how many instances of an app you need and the


    ![](img/6866071e033820549b214c239744aaa0_25_0.png)


    ![](img/6866071e033820549b214c239744aaa0_25_1.png)


    system will then ensure that you always have that many replicas running. If one
    goes down, it restarts another one. If too many are running, it kills the extras.
    Kubernetes was created by Google, based


    ![](img/6866071e033820549b214c239744aaa0_25_2.png)


    on its experience of building its own container orchestration system, over the
    past ten years. There are a lot of components that make Kubernetes work; let''s
    take a look at them.


    ![](img/6866071e033820549b214c239744aaa0_25_3.png)


    # 01

    Containers and pods


    Pods are the smallest unit of execution in Kubernetes, while containers are subatomic
    components. That means you never just run a container; it always runs inside a
    control structure known as a pod. But this doesn''t mean you can''t run Docker
    images based on Dockerfiles exactly the same way you do in Docker. In this case,
    Kubernetes will spin up a single container pod.


    The other Kubernetes components spin up one or more pods, or connect one or more
    pods to the network. Pods are composed of one or more containers. Containers running
    in the same pod share disk, localhost, security context and other properties.


    # 02

    ReplicaSet


    A ReplicaSet is one of the core parts of the Kubernetes system. It ensures that
    a specified number of pod replicas are running at any one time. If there are too
    few, it will start more. Unlike manually created pods, the pods maintained by
    a ReplicaSet are automatically replaced if they fail, are deleted or are terminated.


    # 03

    Deployment


    A Deployment can be thought of as an abstraction containing pods and a ReplicaSet:
    When you create a deployment, a ReplicaSet and pods are brought up. You only need
    to describe the desired state of a deployment


    object, and the deployment controller will change the actual state to the desired
    state at a controlled rate for you. You can define deployments by creating new
    resources, or replace existing ones with new ones. The recommended way to deploy
    an application on Kubernetes is by creating a deployment.


    # 04

    StatefulSet


    Many distributed and stateful applications need to have unique, pre-known network
    identifiers before they are deployed. Stateful applications also need stable,
    persistent storage that is available to be bound to the appropriate pod even after
    the previous pod has gone down. StatefulSets provide all this to an'
