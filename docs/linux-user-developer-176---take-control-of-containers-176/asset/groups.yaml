    # ## Uuntu server admin


    +   - Right Usage of the rpm command


    ![](img/6866071e033820549b214c239744aaa0_53_0.png)


    configuration files, you will be able to set the values so that services can be
    further secured.

    Monitoring servers is a critical aspect. Since you will not be able to monitor
    every service every minute of every day, it is important to put in place some
    monitoring tools so that servers can be watched. This makes the life of a system
    administrator easier as they can find out when something needs their urgent focus.
    There are several tools that can be used for monitoring servers.

    Using the rsyslog service, you will be able to collect important information and
    error conditions about various services. By default, all the log messages are
    directed into the log files located in the /var/log directory. From an improved
    security and convenience perspective, you can also redirect all log messages to
    a centralised server.

    Sar is an important utility that can be configured to watch the activities that
    are happening on your system. Memory usage, CPU usage and network activities are
    some of those that can be monitored by sar.

    It is very important to keep system software up to date all the time. In other
    words, we need to ensure that the updated software packages containing the patches
    are installed on your system. One command that''s widely used is yum -- it will
    check for and install the packages that are available for your system.

    It is also important to check your file systems so that you can identify the possible
    intrusions. This can be done by using the following command:


    ```

    `$ rpm -V`

    ```


    This command will help us check if any commands, documents or configuration files
    have been tampered with on the system.

    The server administrator depends heavily on Secure Shell (SSH) services for managing
    remote access to the servers. The Secure Shell tools can be considered as a set
    of client and server applications and they help in carrying out the basic communications
    between the client machines and the Linux server. The popular SSH tools are ssh,
    scp and sftp. It can be noted here that as the communication between the clients
    and the server is encrypted, these tools are more secure. With these tools, in
    addition to the communication, the authentication process is also encrypted. We
    know that communications from telnet and the earlier “r” commands expose the data
    and passwords so that someone can easily access those over the network.

    It can be noted here that most Linux systems include shell clients and may also
    include a Secure Shell server. The client and server software packages that contain
    these tools are openssh, openssh-clients and openssh-server.

    You can use the following command for this purpose:


    ```

    `$ yum list installed | grep ssh`

    ```


    If the server package is not installed, use the following command to install it:


    ```

    `$ sudo apt-get install openssh-server`

    ```'
