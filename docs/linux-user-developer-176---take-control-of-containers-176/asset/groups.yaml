    ## 05 Test OpenVPN connection


    Once the OpenVPN service is running, open a new tab in your Terminal or start
    a new SSH service and run the command `ifconfig` to list your network interfaces.
    Usually the VPN connection will appear as `tun0`.


    ![](img/6866071e033820549b214c239744aaa0_76_0.png)


    You can check your apparent location with the command:


    ```

    curl --interface tun0 freegeoip.net/json/

    ```


    Next, make sure the OpenVPN service starts each time you log in. Then run


    ```

    sudo nano /etc/default/openvpn

    ```


    and remove the `#` at the start of the line reading "`#AUTOSTART=`all`".


    ## 06 Install prerequisites


    Now we’ll install the necessary software to set up a Wireless AP. Do this by running


    ![](img/6866071e033820549b214c239744aaa0_76_1.png)


    ```

    sudo apt-get install dnsmasq hostapd

    ```


    Next, run


    ```

    sudo nano /etc/dhcpd.conf

    ```


    Add these lines to the very bottom of the file:


    ```

    interface wlan0

    static ip_address=172.24.1.1/24

    ```


    Press Ctrl+X, Y then Return to save and exit.


    ![](img/6866071e033820549b214c239744aaa0_76_2.png)


    ## 07 Set static IP


    Open your network interfaces configuration with


    ```

    sudo nano /etc/network/interfaces

    ```


    Change the line "`iface wlan0 inet static`" to "`iface wlan0 inet manual`". Press
    Return to start a new line, and then paste:


    ```

    address  172.24.1.1

    netmask   255.255.255.0

    network   172.24.1.0

    broadcast 172.24.1.255

    ```


    Place a “#” at the start of the line beginning “wpa-conf”. Save and exit in the
    same way as before.


    Restart the dhcpcd service with


    ```

    sudo service dhcpcd restart

    ```


    ## 08 Configure AP


    Run


    ```

    sudo nano /etc/hostapd/hostapd.conf

    ```


    ![](img/6866071e033820549b214c239744aaa0_76_3.png)


    and paste the following:


    ```

    interface=wlan0

    driver=nl80211

    ssid=PiVPN

    hw_mode=g

    channel=1

    macaddr_acl=0

    auth_algs=1

    ignore_broadcast_ssid=0

    wpa=2

    wpa_key_mgmt=WPA-PSK

    wpa_passphrase=raspberry231

    wpa_pairwise=TKIP

    rsn_pairwise=CCMP

    ```


    Feel free to change the name of the network from ‘PiVPN’ to one that is meaningful
    to you. Similarly change the password ‘raspberry231’ to something more secure.


    Next run


    ```

    sudo nano /etc/default/hostapd

    ```


    Find the line starting `#DAEMON_CONF=`“`”` and change to DAEMON_CONF=`“`/etc/hostapd/hostapd.conf`”`.
    Note the “#” at the start of the line must be removed.


    ![](img/6866071e033820549b214c239744aaa0_76_4.png)


    ## 09 Configure dnsmasq


    Move the old dnsmasq configuration file with


    ```

    sudo mv /etc/dnsmasq.conf /etc/dnsmasq.conf.orig

    ```


    then create a new one by running


    ```

    sudo nano /etc/dnsmasq.conf

    ```


    Paste in the following text:


    ```

    interface=wlan0

    listen-address=172.24.1.1

    bind-interfaces

    server=8.8.8.8

    domain-needed

    bogus-priv

    dhcp-range=172.24.1.50,172.24.1.150,12h

    ```


    Note we are using Google’s DNS server (8.8.8.8) for now; change this if you wish,
    then save and exit.


    Run


    ```

    sudo nano /etc/sysctl.conf

    ```


    ## Automatic Login


    If you need a username and password for your VPN, you can save these so OpenVPN
    will connect automatically. First run


    ```

    sudo nano auth.txt

    ```


    On the first line put the username and on the second put your password. Save and
    exit. Next edit your OpenVPN config file e.g.


    ```

    sudo nano /etc/openvpn/vpn2.conf

    ```


    Scroll down to the line with the text "`auth-user-pass`", leave a space and enter
    the path auth. txt, for example:


    ```

    auth-user-pass /home/pi/auth.txt

    ```


    Save and exit once again.


    Find the line starting “net.ipv4_ip_forward=1” and remove the “#” at the start.
    Now reboot the Pi.


    ## 10 Setup IPv4 Forwarding


    For the next step, you need to run each of these commands individually:


    ```

    sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    sudo iptables -A FORWARD -i tun0 -o wlan0 -m state --state RELATED,ESTABLISHED
    -j ACCEPT

    ```


    Next, run


    ```

    sudo nano /etc/rc.local

    ```


    Paste the following right above the line reading “exit 0”:


    ```

    iptables-restore < /etc/iptables.ipv4.nat

    /usr/sbin/hostapd /etc/hostapd/hostapd.conf

    ```


    ## 11 Test Access Point


    Run the commands


    ```

    sudo update-rc.d hostapd enable

    sudo update-rc.d dnsmasq enable

    ```


    Reboot the Pi. You''ll need a second device at this stage to see if you can access
    the Wireless AP. Search for it in your network menu and enter the password you
    created earlier on. If you can''t remember this, run


    ```

    sudo nano /etc/hostapd/hostapd.conf

    ```


    on the Pi to view it again. Once connected visit www.whatsmyipaddress.com to check
    you''re behind the VPN.


    ## 12 Fix DNS Leaks


    Certain VPN providers use their own DNS servers. Other VPN Providers are less
    cautious. Visit https://www.dnsleaktest.com/ and click Extended Test to check
    you''re safe. If any of the DNS servers match your regular ISP, your connection
    is not fully secure.


    To resolve this, edit your VPN configuration file e.g.


    ```

    sudo nano /etc/openvpn/vpn2.conf

    ```


    and add these lines immediately above “ca”:


    ```

    script-security 2

    up /etc/openvpn/update-resolv-conf

    down /etc/openvpn/update-resolv-conf

    ```


    Save and exit, then restart your Pi. Check the DNS leak website once again. If
    this fails to resolve the issue, try using another VPN provider.


    Run the following commands to secure the connection:


    ```

    sudo iptables -A INPUT -i tun0 -m conntrack --state RELATED,ESTABLISHED -j ACCEPT

    sudo iptables -A INPUT -i tun0 -j DROP

    ```


    Make sure to save your changes so that they''ll apply on reboot:


    ```

    sudo sh -c “iptables-save > /etc/iptables.ipv4.nat”

    ```


    ## 13 Block unsolicited connections


    As your Pi is sitting between your computer and the internet, it can potentially
    be accessed by other devices. Prevent unsolicited incoming connections from other
    devices with the following commands.


    ## 14 Route all traffic through OpenVPN


    When you boot the Pi initially, certain applications may try to connect directly
    to the internet, which can undermine your anonymity.


    To channel all network traffic through the VPN, you need to edit your configuration
    file in /etc/openvpn, for instance by running


    ```

    sudo nano /etc/openvpn/vpn2.conf

    ```


    Make sure the line “redirect-gateway” reads “redirect-gateway def1”. DNS queries
    will also be routed through the VPN also so make sure your provider supports this.


    ## 15 Set up Firewall


    Although you may have previously configured iptables to prevent unsolicited incoming
    connections, to be on the safe side, consider installing ufw (Uncomplicated Firewall)
    with


    ```

    sudo apt-get install ufw

    ```


    Run


    ```

    sudo ufw enable

    ```


    to fire it up, then open the default OpenVPN port 1194 with


    ```

    sudo ufw allow 1194

    ```


    You may also want to enable Port 22 to allow connecting via SSH. Remember that
    this doesn''t change which ports are open and closed on the router.


