    \ allows you to buy and sell Docker images.\n\n![](img/6866071e033820549b214c239744aaa0_20_1.png)\n\
    \n## 05 Docker containers\n\nDocker containers are the run components of Docker.\
    \ Using Docker API or CLI commands, you can run, start, stop, or delete a container.\
