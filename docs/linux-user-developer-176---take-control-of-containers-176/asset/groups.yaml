  mdcn: '


    ## Ubuntu 服务器管理


    ### 正确使用方法 rpm 命令


    配置文件中，你可以设置数值以进一步加固服务。


    服务器监控至关重要。由于你不可能全天候监控每一项服务，因此部署一些监控工具以便观察服务器状态显得尤为重要。这使得系统管理员的工作更加轻松，因为他们可以及时发现需要紧急关注的情况。有多种工具可用于服务器监控。


    使用 rsyslog 服务，你可以收集关于各种服务的重要信息和错误状况。默认情况下，所有日志消息都定向到位于 /var/log 目录下的日志文件中。出于提高安全性和便利性的考虑，你还可以将所有日志消息重定向到集中式服务器。


    Sar 是一个重要的实用工具，可以配置为监视系统上的活动。内存使用情况、CPU 使用率和网络活动是其中一些可以被 sar 监控的项目。


    始终保持系统软件最新是非常重要的。换句话说，我们需要确保安装了包含补丁的更新软件包。一个广泛使用的命令是 yum —— 它将检查并安装适用于你系统的可用软件包。


    检查文件系统也很重要，这样你才能识别可能的入侵。可以使用以下命令进行此操作：


    ```

    $ rpm -V

    ```


    此命令有助于我们检查系统上的任何命令、文档或配置文件是否被篡改。


    服务器管理员严重依赖 Secure Shell (SSH) 服务来管理对服务器的远程访问。Secure Shell 工具可以被视为一组客户端和服务器应用程序，它们有助于在客户端机器和
    Linux 服务器之间进行基本通信。流行的 SSH 工具有 ssh、scp 和 sftp。这里需要注意的是，由于客户端和服务器之间的通信是加密的，这些工具更加安全。使用这些工具时，除了通信，身份验证过程也是加密的。我们知道，来自
    telnet 和早期“r”命令的通信会暴露数据和密码，使得有人可以轻松通过网络访问这些信息。


    这里需要注意的是，大多数 Linux 系统都包含 shell 客户端，也可能包含 Secure Shell 服务器。包含这些工具的客户端和服务器软件包分别是
    openssh、openssh-clients 和 openssh-server。


    你可以使用以下命令来完成此目的：


    ```

    $ yum list installed | grep ssh

    ```


    如果服务器软件包未安装，请使用以下命令进行安装：


    ```

    $ sudo apt-get install openssh-server

    ```


    预装了 openssh-server 软件包的 Linux 系统有时可能未配置为自动启动。在这种情况下，你可能需要使用命令以确保 SSH 服务器守护进程 (sshd)
    在你的 Linux 系统上正常运行。但在 Ubuntu 上，当我们安装 openssh-server 时，sshd 守护进程始终配置为在启动时自动运行。我们可能需要对
    sshd 守护进程进行进一步配置——这可以通过编辑 `/etc/ssh/ssh_config` 文件来完成。这里一个至关重要的配置是将 PermitRootLogin
    设置从 yes 更改为 no。这样，我们将阻止任何人远程登录为 root。


    通过网络。完成后，我们可以输入 `exit` 来结束我们的远程连接。


    ssh 命令也可以用于远程执行。我们可以使用此命令在远程系统上执行命令，并将输出返回到本地系统。当我们在 ssh 中运行包含选项或参数的远程执行命令时，我们需要确保整个远程命令行都被引号包围。


    服务器管理员使用 scp 和 rsync 命令在系统之间复制文件。scp 命令与较旧的 rcp 命令非常相似，唯一的区别在于使用 scp 时所有通信都是加密的。


    ### 服务器管理员严重依赖 Secure Shell 服务来管理对服务器的远程访问


    在所有的 Secure Shell 工具中，最常用的是 ssh 命令。服务器管理员可以使用此命令进行远程登录、远程执行以及其他类似任务。诸如 scp 和 rsync
    等命令可用于在 SSH 客户端和服务器系统之间复制一个或多个文件。默认情况下，Secure Shell 工具使用标准的 Linux 用户名和密码进行身份验证，所有操作都在加密连接上进行。这些工具还支持基于密钥的身份验证，可用于在客户端和
    SSH 服务器之间配置无密码身份验证。通过使用 ssh 命令，服务器管理员可以检查他们是否能够登录到正在运行 sshd 服务的 Linux 系统。一旦你登录到远程系统，你就可以开始执行
    shell 命令。请注意，连接的功能与普通登录相同——唯一的区别是数据在通过网络传输时是加密的。


    你可以将文件从远程复制到本地系统，或者反之亦然。scp 命令也可以用于通过网络备份文件和目录。但是，当我们比较包含选项或参数的 rsync 与 scp 时，我们需要确保整个远程命令行都被引号包围。


    ![](img/6866071e033820549b214c239744aaa0_54_1.png)


    ## 35 个必备修复技巧


    无论你是经验丰富的 Linux 用户还是新手，你都可能会时不时地遇到问题。以下是解决它们的方法


    ![](img/6866071e033820549b214c239744aaa0_55_0.png)


    ### 修复 LINUX？


    - 是

    - 否


    错误！


    ```

    paul@xps13-yakkey:~$ uname -a

    Linux xps13-yakkey 4.9.9-040909-generic #2d.02090333 SMP Thu Feb 9 08:35:27 UTC
    2017 x86_64 x86_64 x86_64 GNU/Linux

    paul@xps13-yakkey:~$

    ```


    Linux 是一种奇特而奇妙的野兽。它最棒的地方之一在于，它真正给了你深入操作系统内部、将一切调整到你喜欢的状态的机会。然而，另一方面，当你调整设置时，你很可能遇到意外的问题，无论这些问题与你使用的发行版、你运行的硬件、某个特别晦涩的开源软件有关，还是仅仅因为
    Linux 的工作方式与你习惯的不同。如果你是在从 Windows 转向后第一次使用 Linux，这种情况尤其可能发生——在许多领域，一开始可能会让人望而却步。


    本文强调了一些你在使用 Linux 时可能遇到的问题，无论你是刚刚入门还是长期 Linux 用户。


    如果你遇到的一个问题没有在我们的指南中列出，请不要担心，你几乎肯定不是第一个遇到这个问题的人。搜索引擎通常能为一般查询提供正确的方向，或者如果问题特定于某个软件，该产品的支持论坛或问题跟踪器是一个很好的起点。Linux
    社区是一群很棒的人！


    > “ 当你在 Linux 中调整设置时，你很可能遇到意外的问题 ”


    ### 内核问题


    Linux 内核是世界上最大的开源项目之一，拥有超过 1300 万行代码——它是你的 Linux 机器所做一切的基础。通常来说，大多数 Linux 用户不会太在意内核：它就在那里，做它该做的事。当即将发布的版本添加了对机器中新硬件的支持，或者修复了现有硬件的一些问题时，内核对用户来说变得最重要和有趣。


    通常，特定的内核版本与特定的发行版版本相关联。例如，Ubuntu Xenial Xerus 包含内核 4.4，而 Ubuntu Yakkey Yak 包含内核
    4.8。尽管情况如此，如果你希望利用一些新功能，没有什么能阻止你在系统上安装新版本的内核。内核最棒的地方之一是你可以轻松安装新版本，在两个版本之间切换（通过
    GRUB），并在需要时回滚到之前的版本。


    安装较新内核最简单的方法是使用 Ubuntu 上游内核存档中的软件包 (bit.ly/1zcskza)。浏览到你想要安装的内核版本，选择适当的架构并下载文件。正常安装并重启以加载新内核。如果你确实需要恢复，打开
    GRUB 高级菜单，加载旧内核并以正常方式卸载软件包。请注意，许多用户将内核更新视为 BIOS 更新——如果它没坏，就别修它！


