    more human-readable version. Next up is ‘du’, which summarises the disk usage
    of files / directories. Again, the ‘-h’ switch can be used to make the output
    more human-readable. Another particular switch is to use the command in the following
    way: `du -h1`. This means to show the usage in human-readable form, but to a max
    depth of one directory. So totals will be summed for every subdirectory, but presented
    as totals for paths one directory from the current one.


    ## INSTALLED APPS AREN’T UPDATING


    Earlier, we talked about configuring Linux to apply automatic security updates,
    but it’s worth remembering that application updates themselves and less critical
    updates won’t be installed. Generally speaking, automatically updating everything
    isn’t the best idea in the world, but if you want to do it, you can! In a similar
    way to the previous example, you can use:


    ```bash

    sudo apt install unattended-upgrades

    ```


    ...in order to install the appropriate file to `/etc/apt/apt.conf.d/50unattended-upgrades`
    and check the appropriate line to allow all types of updates.


    A useful package to install is `apticron`, which is used to email an administrator
    info about any packages on the system that have updates available, plus a summary
    of changes in each package. After installation, set the destination email address
    in `/etc/apticron/apticron.conf`.


    ## MY SERVER IS BOOTING TO X


    If you are going to run Linux on a server, then of course the best approach is
    to install a server-specific distribution. Sometimes, of course, this isn’t always
    practical — you may start with a desktop machine that becomes a headless server,
    or you might just prefer to use a GUI to get set up. Either way, if you’re not
    using the graphical interface, you probably don’t want it starting up on your
    machine. To boot to text mode on each boot, edit `/etc/default/grub`, comment
    out the `GRUB_CMDLINE_LINUX_DEFAULT` line and ensure `GRUB_CMDLINE_LINUX="text"`
    is set. After running:


    ```bash

    sudo update-grub

    ```


    ...you’re all set. If running a systemd-enabled system (Debian 8/Ubuntu 15.04
    onwards), you’ll also need to run:


    ```bash

    sudo systemctl set-default multi-user.target

    ```


    Undo by running:


    ```bash

    sudo systemctl set-default graphical.target

    ```

    '
  mdcn: '

    ## 命令行


    即使是老练的图形界面爱好者，在某些时候也不得不深入命令行领域，如果你没有做好准备，这可能会带来一些问题……


    ![](img/6866071e033820549b214c239744aaa0_63_0.png)


    ## 我觉得 VI 太难用了


    在 Linux 机器上使用命令行时，通常推荐的编辑器是 vi——这并非没有理由，因为它是一个功能非常强大的工具。然而，它对初学者并不友好——其命令可能显得相当令人望而生畏。vi
    的一个坚实替代品是 nano。这是一个仍在终端中运行的编辑器，但它稍微更易上手，在不显得繁琐的情况下给用户提供了更多的引导。当然，如果你想在命令行环境中编辑，但又真的希望在图形界面（GUI）中操作，你可以使用
    gedit 或像来自 atom.io 的 Atom 这样更高级的图形界面编辑器。


    ## 我想以 ROOT 身份安全地执行操作


    作为一个新的 Linux 用户，容易陷入的一个陷阱就是过多地以 root 身份进行操作。切换到 root 用户非常容易，但一旦养成习惯，就很难摆脱。这里有个小技巧——将
    root 密码更改为不使用密码管理器或锁定它就无法记住的内容，然后尝试使用 sudo（它是以你的账户运行，但提升了你的权限）。


    ![](img/6866071e033820549b214c239744aaa0_63_1.png)


    ## 我经常忘记命令行选项


    Linux 拥有令人眼花缭乱的命令行工具，每个工具都有其独特的语法，这意味着如果你不是每天都在使用它们，要记住具体如何使用它们可能会很困难。幸运的是，有一些标准方法可以找到正确的命令。寻求帮助的第一步是使用命令后的
    --help 后缀（例如 `ls --help`）。这会打印出所有可能参数的简短列表，以及（通常）一个示例和指向完整文档的网页链接。如果你滚动得太快而看不清，请将其管道传输到
    `more` 二进制文件 - 例如 `ls --help | more` - 它会逐屏显示；按空格键继续。要获取有关如何使用某条命令的更详细解释，请使用 `man`
    功能（例如 `man ls`）。这会打开该命令的手册页，你可以再次使用空格键滚动浏览。


    ## 我想知道安装了哪些软件


    在 Linux 上有多种安装软件的方式，查看已安装软件的最佳方法通常并不明确。如果你是手动编译和安装软件，那么跟踪起来就更难了。原则上，只要可用，请尽量从软件包安装。


    要在 Ubuntu 中以图形化方式查看已安装的内容，请使用 Ubuntu 软件应用程序并点击“已安装”选项卡（这也会在一个选项卡中显示更新）。不幸的是，这只显示通过图形界面安装的内容，因此用途有限。命令行的替代方案是：


    ```bash

    dpkg --get-selections

    ```


    或者...


    ```bash

    dpkg --get-selections | grep php

    ```


    当然，如果你在寻找特定的东西，可以通过 grep 进行管道传输。例如：


    要查看特定软件包安装了哪些文件，请使用：


    ```bash

    dpkg -L packagename

    ```


    如果你想更多地了解每个软件包的内容，可以使用以下命令获取带有简短描述的软件包列表：


    ```bash

    dpkg-query -l

    ```


    如果你是手动编译并从源代码安装，有没有什么方法可以跟踪？通常，一个好的做法是将你编译的任何应用程序的源代码保存在一个公共目录中，以便日后参考（即使你在安装后压缩了源代码）。这也让你以后可以使用
    `make uninstall` 来移除软件。


    ![](img/6866071e033820549b214c239744aaa0_64_0.png)


    ## LOCATE 命令不起作用


    `locate` 命令是在 Linux 上查找文件最快且最简单的方法。只需输入 **locate** *filename*，系统将返回请求用户有权限访问的所有
    ''filename'' 实例（支持通配符和正则表达式）。添加 **-i** 开关会使搜索不区分大小写。


    如果 `locate` 命令没有显示出你确定存在的文件怎么办？数据库是定期更新的（通常在每日 cron 任务中），这意味着最近创建的文件和目录不会立即显示出来。要手动更新数据库，只需使用：


    ```bash

    $ sudo updatedb

    ```


    > 你启动了一个新会话，却完全不知道之前操作是否完成。简直是噩梦！


    ## 当 SSH 断开连接时，我会迷失方向


    想象一下这个场景。你通过 SSH 登录到一台远程服务器，正在做一些非常重要的事情。你正在对数据库运行一条命令时，Wi-Fi 断开了。你立即重新连接到服务器，但你启动了一个新会话，并且完全不知道之前的操作是否完成。太糟糕了！


    解决这个问题的绝妙方法是 ''screen'' 工具。这是一个全屏窗口管理器，它在多个进程（通常是交互式 shell）之间复用物理终端。每个虚拟终端都有独立的回滚缓冲、历史记录缓冲区以及允许用户在窗口之间移动文本区域的复制和粘贴机制。当
    screen 首次打开时，它会创建一个包含 shell（或指定命令）的单个窗口，然后不打扰你，让你像平常一样使用程序。然后，在任何时候，你都可以创建其他程序（包括更多
    shell）所在的新的（全屏）窗口，终止当前窗口，查看活动窗口列表，在窗口之间切换，等等。所有窗口中的程序运行完全独立，最重要的是，即使当前窗口不可见甚至整个
    screen 会话从用户终端分离时，程序也会继续运行。


    安装 screen 后，最好在 .profile 中添加它，以便在新连接时自动启动。使用 `screen -RD` 重新连接到会话，否则启动一个新的会话，并在需要时分离远程会话。


    ## 哎呀，我对二进制文件使用了 CAT


    这是每个人在某时某刻都会遇到的经典问题。你本打算 cat 一个文本文件，但意外地 cat 了一个二进制文件。你的显示器开始发疯，计算机像疯了似的不断发出声音，于是你疯狂地按
    **Ctrl+C**。没有任何反应，所以你继续按 **Break**，终于，谢天谢地，屏幕停止了滚动，你回到了命令提示符。万岁！但是……一切都不正常了。字符集完全乱了套，你输入的内容绝对与屏幕上显示的不符。情况不妙。真希望能有一种简单的方法恢复原状！幸运的是……有。只需运行
    `reset`，你的终端就会恢复非二进制状态。呼！


    ```text

    paul@xps13-yakety:~$ sudo du -hd1 --one-file-system

    872M  ./lib

    28K   ./mnt

    4.0K  ./lib64

    8.0K  ./media

    261G  ./home

    2.2G  ./var

    17M   ./root

    16K   ./lost+found

    4.0K  ./srv

    4.0K  ./cdrom

    168M  ./boot

    16M   ./sbin

    821M  ./opt

    9.4G  ./usr

    4.9M  ./lib32

    5.5M  ./libx32

    4.0K  ./snap

    33M   ./etc

    ```


    如上所述，''du'' 是发现那些异常巨大的目录的完美工具


    ## LINUX 服务器


    如果你要将 Linux 部署到服务器上，那么你可以预见到会经历一组略有不同的挑战


    ## 我的磁盘空间不足


    在将 Linux 部署到 VPS 服务器或容器时，我们似乎有点回到了过去——我们再次置身于磁盘空间有限、每一字节都至关重要的世界中！这有点讽刺，但幸运的是，Linux
    有一些工具可以帮助我们查看宝贵的磁盘空间去向。第一个有用的命令行工具是 ''df''，它显示每个卷的空间及使用量。使用 ''-h'' 获取更具人类可读性的版本。接下来是
    ''du''，它总结文件/目录的磁盘使用情况。同样，可以使用 ''-h'' 开关使输出更具人类可读性。另一个特别的开关是这样使用该命令：`du -h1`。这意味着以人类可读的形式显示使用情况，但最大深度为一个目录。因此，每个子目录的总数将被汇总，但显示为距离当前路径一级目录的总合。


    ## 已安装的应用程序未更新


    之前，我们谈到了配置 Linux 以应用自动安全更新，但值得记住的是，应用程序本身的更新以及不太关键的更新将不会被安装。一般来说，自动更新所有东西并不是世界上最好的主意，但如果你想要这样做，你可以！以前面的示例类似的方式，你可以使用：


    ```bash

    sudo apt install unattended-upgrades

    ```


    ...以便安装相应的文件到 `/etc/apt/apt.conf.d/50unattended-upgrades` 并检查相应的行以允许所有类型的更新。


    一个有用的包是 `apticron`，它用于向管理员发送电子邮件，提供系统中任何有可用更新软件包的信息，以及每个软件包变更的摘要。安装后，在 `/etc/apticron/apticron.conf`
    中设置目标电子邮件地址。


    ## 我的服务器启动进入图形界面


    如果你要在服务器上运行 Linux，那么当然最好的方法是安装特定的服务器发行版。当然，有时这并不总是可行的——你可能从一台桌面机器开始，让它变成无头服务器，或者你可能更喜欢使用图形界面来设置。无论如何，如果你不使用图形界面，你很可能不希望它在你的机器上启动。要在每次启动时进入文本模式，编辑
    `/etc/default/grub`，注释掉 `GRUB_CMDLINE_LINUX_DEFAULT` 行并确保设置了 `GRUB_CMDLINE_LINUX="text"`。在运行：


    ```bash

    sudo update-grub

    ```


    之后，你就准备好了。如果运行的是启用了 systemd 的系统（Debian 8/Ubuntu 15.04 及更高版本），你还需要运行：


    ```bash

    sudo systemctl set-default multi-user.target

    ```


    撤销操作请运行：


    ```bash

    sudo systemctl set-default graphical.target

    ```


