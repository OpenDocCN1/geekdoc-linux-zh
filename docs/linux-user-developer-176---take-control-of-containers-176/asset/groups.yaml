    ### Password managers


    Keeping the details of your accounts safe is of more importance than ever before,
    but which open-source password manager is worth investing your time in?


    **Clipperz**

    Security is key when it comes to Clipperz, which is why it claims to know nothing
    about its users or the data they choose to encrypt. Through passphrases and vault
    options, Clipperz looks to offer everything a user could need to keep their virtual
    presence safe.

    Clipperz.com


    **Passopolis**

    While most password managers are tailored to individuals, Passopolis uses a friend-based
    system where users are able to invite certain people to access their account.
    It’s a unique feature, but does the program have a whole lot enough to stand out
    from some fierce competition?

    Passopolis.com


    **Encryptr**

    Considering Encryptr comes from the team who produce the amazing Spideroak secure
    cloud server, Encryptr has a pretty impressive history. It prides itself on its
    simplicity to attract new users, while not skipping on the staple elements that
    every password manager needs.

    Spideroak.com


    **KeePass**

    Consider KeePass the old man of the group, and a program that many seasoned Linux
    users will recognise. It’s undergone some big changes as of late, with improvements
    made to both the UI and expanding on what used to be a fairly limited set of features.

