    # Working with binary files


    Binary files are different to plain text files and therefore require a different
    approach to processing. The approach depends on the exact format of the binary
    file and therefore cannot be determined in advance.


    You can open a binary file for reading in raw mode as follows:


    ```

    ```Erlang

    1> {ok, S} = file:open("network.erl", [read, binary, raw]).

    {ok,{file_descriptor,prim_file,{#Port<0.435>,333}}}.

    ```


    ```


    The previous command gives you random access to the file you just opened. However,
    reading such a file requires the use of the file:pread/1 function.


    Similarly, you can open a binary file for writing in raw mode as follows:


    ```

    ```Erlang

    2> {ok, S} = file:open("aRawBinary", [raw, write, binary]).

    {ok,{file_descriptor,prim_file,{#Port<0.435>,333}}}.

    ```


    ```


    Writing to a raw binary file can be done using the file:pwrite/1 function.


    Talking more about raw binary files is beyond the scope of this tutorial.


    # Implementing cp in Erlang


    The cp(1) utility reads and writes all files in binary format, and the Erlang
    implementation is no exception to this unfriendly rule. The easiest way to implement
    the core functionality of cp(1) in Erlang is using the file:read_file/1 function.
    The relevant Erlang code can be found in myCP.erl, which you can also see in Figure
