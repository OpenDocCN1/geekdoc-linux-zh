    作为原始 MySQL 安装的一部分，你已包含 ''mysql-client''，它为数据库操作提供了一个命令行客户端。例如，要连接到 MySQL 数据库并创建新数据库，你可以使用命令
    `mysql -u root -p`，在提示时输入密码，然后使用 `create database newdbname;` 和 `\u newdbname`。此时，你可以手动输入
    SQL 语句，或使用 `\s filename.sql` 从磁盘运行脚本。请记住为你的应用程序设置所需的非 root 账户。


