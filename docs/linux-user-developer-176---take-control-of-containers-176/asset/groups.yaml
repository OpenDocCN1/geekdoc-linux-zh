    ## Ubuntu 中的服务器管理


    深入探讨 Ubuntu 下的服务器管理


    ![](img/6866071e033820549b214c239744aaa0_51_0.png)


    Swayan Prakash 拥有计算机工程硕士学位。他在信息技术领域工作多年，专注于操作系统、网络、网络安全、电子商务、互联网服务、LDAP 和 Web
    服务器等领域。Swayan 曾为多份行业出版物撰写文章，并在行业会议上宣读自己的论文。可通过 swayan.prakash@gmail.com 与他联系。


    ## 资源


    -   系统管理主题：bit.ly/2kt6yXx

    -   理解 Ubuntu Linux 系统的分步方法：bit.ly/2kCi642

    -   基本的 Ubuntu 服务器管理：bit.ly/2kQxIeJr

    -   Ubuntu 服务器指南 (PDF)：bit.ly/18NkPkK


    **右图** 广泛用于服务器管理的 sar 实用工具


    ### 当我们将 Linux 系统配置为服务器时，需要关注几项任务。


    顾名思义，服务器的存在就是为了提供服务。它们提供的数据可以包括网页、文件、数据库信息等。从服务器管理的角度来看，存在一些对系统管理技能的典型挑战。


    首先是远程访问。在大多数情况下，管理将通过远程访问工具进行。由于图形界面可能不可用，你需要完全依赖命令行工具来执行远程登录、远程复制和远程执行等各种任务。这些工具中最常见的是基于
    SSH 功能构建的。


    其次是安全性。正如预期的那样，服务器将接受来自远程用户和系统的请求。因此，服务器管理员会打开所需服务的端口，并锁定不需要服务的端口。可以使用各种工具来保护这些服务。


    第三是持续监控。服务器被期望全年 365 天、每年 7x24 小时保持在线。配置可用于监控每台服务器的工具有着巨大的需求。通过这种监控，你将能够收集所需的日志消息，并且在发生可疑活动时触发电子邮件通知。收集有关
    CPU 使用率、内存使用率、网络活动等方面的数据总是有益的。


    在此需要注意的是，无论你要启动的是文件服务器还是 Web 服务器，让服务器运行起来所需的许多步骤都是相同的。在配置和调整方面，我们会看到许多差异。一旦我们成功安装了服务器，下一步就是查看其默认配置。需要注意的是，大多数服务器软件包都安装为偏向于提供更高安全性的默认配置设置。


    众所周知，大多数 Linux 服务器可以使用 /etc 目录下的纯文本进行配置。在大多数情况下，会有一个主配置文件，有时还有一个相关的配置目录，可以从中提取扩展名为
    .conf 的文件并将其纳入主配置文件。Apache Web 服务器就是一个例子，它有一个主配置文件和一个目录，其他配置文件可以放入该目录并被服务包含。主配置文件是
    /etc/httpd/conf/httpd.conf，配置目录是 /etc/httpd/conf.d/。


    如前所述，大多数服务器软件包在安装时配置极少，如果我们想充分利用这些服务器，这将受到限制。邮件服务器和 DNS 服务器是功能有限的服务器的典型例子。请注意，这两个服务器都以其默认配置安装，并在重启时启动。但关键在于，它们都只监听本地主机上的请求。因此，直到我们配置这些服务器之前，未登录到你本地服务器的人员将无法向该服务器发送邮件或将你的计算机用作公共
    DNS 服务器。


    一旦我们安装并配置了服务器，下一步就是启动它。通常，我们在 Linux 上安装的大多数服务器都配置为在系统启动时启动。之后，服务持续运行并持续监听请求。这将一直持续，直到系统关闭。你可以使用两个主要功能来管理服务：systemd
    和 System V init 脚本。无论 Linux 系统使用哪种功能，由你决定是否让服务在系统启动时启动，并根据需要启动、停止和重新加载服务。这里需要注意的另一件事是，大多数服务都实现为守护进程。下表简要描述了一些参数。


    | 参数 | 描述 |

    | :-- | :-- |

    | 用户和组权限 | 守护进程通常以除 root 之外的用户和组身份运行。这样做的目的是，如果有人入侵这些守护进程，他们将没有权限访问该服务无法访问的文件之外的文件。
    |

    | 守护进程配置文件 | 通常，服务有一个守护进程的配置文件，存储在 /etc/sysconfig 中：有关更多详情，请参考特定守护进程的手册页。 |

    | 端口号 | 大多数标准服务都有特定的端口号，守护进程监听这些端口，客户端可以连接。通常我们不需要更改守护进程监听的端口。 |


    ![](img/6866071e033820549b214c239744aaa0_51_1.png)


    并没有强制要求所有服务都必须作为守护进程运行。一些服务使用 xinetd 超级服务器按需运行。我们可以将按需服务视为运行始终可用服务的主要方式。这里需要注意的是，按需服务不会持续运行，从而持续监听请求。这些服务注册在
    xinetd 守护进程中，当请求到达 xinetd 守护程序时，xinetd 守护程序启动所请求的服务，并将请求交给该服务。这种方法有一个明显的优势，即我们将拥有更少运行的守护进程。


    在保护服务器安全方面，你需要非常谨慎。在 Linux 系统中，各种措施可以帮助保护你的服务器和服务免受外部攻击。


    拥有良好的密码和密码策略是保护 Linux 系统安全的第一道防线。这里最好的做法是禁止 root 直接登录，并强制每个人都作为普通用户登录，然后使用 sudo
    变为 root。作为另一种最佳实践，你可以使用可插拔身份验证模块 (PAM) 功能，它将有助于调整某人登录失败尝试的次数，在此之后将阻止对该用户的访问。


    iptables 防火墙服务是另一层安全防护。使用此服务，你可以丢弃或拒绝系统中请求服务的每个数据包，除了你启用的那少数几个。你还可以告知 iptables
    仅允许来自特定 IP 地址的服务请求，或拒绝来自其他地址的请求。


    你可以使用 /etc/hosts.allow 和 /etc/hosts.deny 文件中的功能来允许或拒绝访问启用了 TCP 封装的服务。可以根据主机名或
    IP 地址允许或拒绝访问。


    > 服务器的存在就是为了提供服务。它们提供的数据可以包括网页、文件和数据库信息


    如今大多数发行版都带有安全增强型 Linux (SELinux) 功能，并且默认情况下以强制模式包含在内。SELinux 的一个重要功能是它有助于保护你的
    Linux 系统的内容免受在该系统上运行的进程的影响。


    作为另一项安全措施，你还可以在配置文件中处理安全设置。在


    ### 系统日志记录


    系统日志记录是在 Linux 系统上配置的基本服务之一，将有助于跟踪系统上发生的情况。rsyslog 服务将提供收集在 Linux 机器上运行的软件/应用程序日志消息的功能。然后，服务器管理员可以将这些消息重定向到本地日志文件、设备或远程日志主机。


