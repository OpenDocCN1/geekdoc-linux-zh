    \n幸运的是，解决这个问题并不特别困难。毕竟，OpenWRT 只是 Linux 的另一个版本——当本教程的作者还是个年轻程序员时，编译自己的内核是每位专业用户的荣誉徽章。完成这一步后，可供我们\
