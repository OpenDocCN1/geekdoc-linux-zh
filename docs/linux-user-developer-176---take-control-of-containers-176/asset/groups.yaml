    # **05 Compose file format**


    A Compose file starts with the version section. For a swarm-compatible Compose
    file, the version should be 3. Next, you need to define the services to be created
    in the swarm under the services section. Each service starts with the service
    name followed by the image section. Here you need to specify the image to be used
    for the service. Next you need to add volumes, ports, network, environment and
    deploy sections. Finally, the command section indicates the commands to be executed
    to launch the service.


    # **06 Load balancing**


    The swarm manager uses ingress load balancing to expose the services you want
    to make available externally to the swarm. The swarm manager can automatically
    assign the service a PublishedPort or you can configure a PublishedPort for the
    service. You can specify any unused port. In Compose files, the ports section
    specifies port mapping. If you do not specify a port, the swarm manager assigns
    the service a port in the 30000-32767 range.


    # **07 Create a swarm**


    To create a swarm, you need Docker Engine v1.12 or higher installed on all the
    host machines, with the Docker Engine daemon running on all the machines. Also,
