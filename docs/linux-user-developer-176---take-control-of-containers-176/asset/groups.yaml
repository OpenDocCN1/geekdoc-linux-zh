    providing an unrivalled document-creation service. It''s however, only one of
    the many new apps that up until now, would be out of reach for most Linux users.
    Early user feedback has shown there are still some issues with larger pieces of
    software, but that overall usability is vastly superior compared to earlier builds
    of the program. Initial binary packages for the likes of Debian, Mageia, Fedora
    and Ubuntu are all available for download, with further expansion planned in the
    next development cycle. The official WINE 2.0 source code can be downloaded over
    at www.winehq.com


    > “Microsoft Office 2013 now has full WINE compatibility, providing an unrivalled
    document-creation service”


    ## DISTRIBUTION


    ### Linux Mint 18.1 KDE and Xfce editions now available


    Latest update follows popular MATE release


    Towards the end of 2016, the Linux Mint Project unveiled the Cinnamon and MATE
    versions of the amazing Linux Mint 18.1 OS. The public response has been fantastic,
    especially due to the long term support plans put in place by the development
    team, with work on the 18.1 update expected to continue well into 2021.


    While the unveiling of the Xfce and KDE editions won''t be a surprise, the changes
    involved are great to see. The Xfce version in particular is based on the latest
    4.12 desktop environment, equipped with a wide range of XApps, including the likes
    of Xplayer, Xreader and Xed to name just a few.


    On the other side, the KDE version uses the Plasma 5.8.5 desktop environment,
    and includes a wide range of improvements to various menus and core settings.
    Both updates have gone down a storm so far, with more users than ever adding to
    Mint''s growing reputation. Plans are in place to provide further updates to these
    editions down the line, but as of yet, no concrete details have been released.


    Parties interested in either the Linux Mint 18.1 Xfce or KDE editions can head
    across to the official Mint website (www.linuxmint.com) for all necessary download
    links and instructions for installation for users moving to Mint for the first
    time.


    ![](img/6866071e033820549b214c239744aaa0_10_0.png)


    ## KERNEL


    ### Linus Torvalds announces latest 4.10 kernel release candidate


    Regular updates are coming thick and fast from the king of Linux


    We''re being spoilt with the amount of release candidates coming from Linux Torvalds
    in recent weeks. The latest announcement coming from Linux HQ shows off the new
    release candidate in the 4.10 kernel series.


    In an official post, Linux Torvalds has said: “Things seem to be calming down
    a bit, and everything looks nominal. There''s only been about 250 changes (not
    counting merges) in the last week, and the diffstat touches less than 300 files
    (with drivers and architecture updates being the bulk, but there''s tooling and
    networking too).”


    While most of the latest release candidate is a refinement of current driver improvements,
    more surprising is the disclosed information about future updates. Included in
    the official announcement, Torvalds has also revealed plans for a regular release
    schedule for Linux 4.10, with a total of seven release candidate builds in the
    pipeline.


    By our estimates, this could see the full, final release of Linux 4.10 land towards
    the end of March. Of course, these plans could soon change, but we''ll let you
    know if they do.


