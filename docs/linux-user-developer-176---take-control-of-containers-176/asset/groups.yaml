    \ on OpenWRT was somewhat discouraging: as the OpenWRT team did not populate many\
    \ of the packages, our experiments on the Raspberry Pi were severely limited due\
    \ to the lack of available products.\n\nFortunately, solving this problem is not\
    \ particularly difficult. OpenWRT, after all, is but another version of Linux\
    \ — when this tutorial’s author was a young code, compiling our own kernel was\
    \ a badge of honour for every professional user. When this is done, the amount\
    \ of software available to our OpenWRT build is limited only by our imagination\
    \ and the memory of the target device.\n\nThe following guide will show you how\
    \ to create your own OpenWRT image for Raspberry Pi process computers. Be aware\
    \ that this operation is not resource-cheap: the following project was written\
    \ on an AMD octa-core workstation equipped with SSD flash memory, 16GB of RAM\
    \ and a cooling system optimised for permanent high performance. Performing the\
    \ same steps on notebooks — HP’s compact sub-notebook families such as the 2540p\
    \ are common suspects — is likely to lead to thermal issues that could damage\
    \ your hardware.\n\nAs in most other operations, creating a working directory\
    \ is a great first step. In the case of OpenWRT, be careful: the build system\
    \ does not allow spaces or weird characters in its path. We used the following\
    \ working directory:\n\n```\ntamhan@TAMHAN14:~$pwd\n/home/tamhan/wrtspace\n```\n\
    \nCompiling complex operating systems requires the presence of a variety of tools\
    \ on the host. The installation instructions recommend Ubuntu users to execute\
    \ the following commands:\n\n```\n$ sudo apt-get install git-core build-essential\
    \ libssl-dev libcurlss5-dev unzip gawk zlib-dev\n$ sudo apt-get install subversion\
    \ mercurial\n```\n\nIn the next step, code must be downloaded from OpenWRT’s repositories.\
    \ This is accomplished by git — due to the limited speed of the service, be prepared\
    \ to wait a minute or two:\n\n```\ntamhan@TAMHAN14:~wrtspace$ git clone https://github.com/openwrt/openwrt.git\n\
    Cloning into 'openwrt'...\nReceiving objects: 100% (360595/360595), 132.89 MiB\
    \ | 1.32 MiB/s, done.\n```\n\nOur downloaded code must be expanded by a few external\
    \ modules. This is best accomplished by changing into the OpenWRT directory, where\
    \ you must then run two additional commands that download optional packages from\
    \ various sources:\n\n```\ncd openwrt\n./.scripts/feeds update -a\n./.scripts/feeds\
    \ install -a\n```\n\n![](img/6866071e033820549b214c239744aaa0_33_1.png)\n\nTutorial\
    \ files available: fileso.co.uk\n\n# Deploy, non-stop!\n\nOur source blob is not\
    \ specific to any architecture: it is suitable to compile products for any and\
    \ every type of device supported by OpenWRT. Our next job involves the creation\
    \ of a custom configuration for the OpenWRT target device we want to use.\n\n\
    The actual customisation progress can be handled by one of three different configuration\
    \ utilities. This example will use the menuconfig tool, which old hands of the\
    \ Linux world should already know from compiling kernels for the desktop. Getting\
    \ started with it involves entering the following command, which will make OpenWRT\
    \ start the preparation process:\n\n```\ncamhane@TAMM1414:~/workspace/openwrt$\
    \ make menuconfig\n```\n\nAfter about three or four minutes, a window similar\
    \ to that shown in Figure 1 pops up.\n\n![](img/6866071e033820549b214c239744aaa0_34_0.png)\n\
    \n*Above: Any similarities to SlackWare's installation are purely coincidental*\n\
    \nThe up and down arrow keys allow you to move the selection; pushing Enter allows\
    \ you to activate the option highlighted at the very bottom of the screen. First,\
    \ select the target system option and set it to BCM27xx.\n\nIn the next step,\
    \ the line below it will allow you to select the exact processor type. The correct\
    \ value depends on the SoC found in your Raspberry Pi – the table below provides\
    \ an overview.\n\n| Processor type | Board types |\n| :--- | :--- |\n| BCM2708\
    \ | Raspberry Pi Model B |\n| | Raspberry Pi Model B+ |\n| | Raspberry Pi Compute\
    \ Module |\n| BCM2709 | Raspberry Pi 2 Model B |\n| BCM2710 | Raspberry Pi 3 Model\
    \ B |\n\nFortunately, selecting the wrong value is not particularly difficult\
    \ – if you pick the wrong type, your target board will not be shown in the target\
    \ profile selection. When target system, subtarget and target profile have all\
    \ been set up correctly, use the side keys to enable the Save option and press\
    \ Enter. For the following steps, we assume that the file has been stored as .config.\
    \ The output of the menuconfig tool will prompt you to run Make – but we’re not\
    \ quite there yet:\n\n```\ncamhane@TAMM1414:~/workspace/openwrt$ make\n*** End\
    \ of the configuration. *** Execute 'make' to start the build or try 'make help'.\n\
    ```\n\nThe OpenWRT team, furthermore, suggests that the defconfig command should\
    \ be run before invoking the actual compile process:\n\n```\ncamhane@TAMM1414:~/workspace/openwrt$\
    \ make defconfig\n# configuration written to .config\n```\n\nThe defconfig tool\
    \ uses the information found in the .config file, which specifies the target architecture.\
    \ It is then expanded with a few default parameters, leading to a ‘sensible basic\
    \ configuration’.\n\nIn the next step, simply enter make to start the compile\
    \ process. Owners of multicore systems would be well advised to pass in the -j3\
    \ parameter, which informs the Make utility that more than one core should be\
    \ used.\n\nIn that case, however, be aware that the utilisation reached is likely\
    \ to be relatively low – OpenWRT’s compile process is not nearly as parallelised\
    \ as the one found in systems like VxWorks.\n\nWith that out of the way, it is\
    \ time to give your workstation a few minutes’ worth of time: our octa-core took\
    \ about one hour to compile.\n\nWhen done, the results are presented in the /bin\
    \ folder. Careful observers will note that the path name of the binary folder\
    \ does not match the one expected – the Raspberry Pi 3 uses a BCM2710 processor.\n\
    \n```\ncamhane@TAMM1414:~/workspace/openwrt$ ls\nmd5sums\nopenwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img\n\
    openwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img.gz\npackages\nsha256sums\n```\n\n\
    > “The amount of software available to our OpenWRT build is limited only by our\
    \ imagination and the memory of the target device”\n\n■ Beware of compile errors\n\
    The OpenWRT team explicitly warns developers that multidress compile errors can\
    \ have odd problems. If your compile process fails for inexplicable reasons, moving\
    \ make -O1 -j3 can be a nice alternative. Further information on this topic can\
    \ be found at https://lxi/2s2DF.\n"
