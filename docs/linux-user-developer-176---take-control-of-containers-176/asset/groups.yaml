    ## 采访帕维尔·鲍伊博罗丁（Pavel Baiborodin）


    ### 十分钟构建应用


    这个新平台旨在为你提供所有必要的工具，让你能在十分钟或更短时间内为你的 Arduino 项目构建一个应用。帕维尔·鲍伊博罗丁向我们详细介绍了为什么 Blynk
    对初出茅庐的开发者来说是一个颠覆性的创新。


    ![](img/6866071e033820549b214c239744aaa0_11_0.png)


    **帕维尔·鲍伊博罗丁（Pavel Baiborodin）**

    他拥有丰富的微型计算机开发历史和用户体验（UX）设计经验。他创建 Blynk 的初衷是希望消除为 Arduino 和树莓派（Raspberry Pi）开发过程中的复杂性。入门指南可在网站
    www.blynk.cc 上查阅。


    ![](img/6866071e033820549b214c239744aaa0_11_1.png)


    四年前，我惊讶于如今可以多么快速地开始对物理交互物体进行原型开发。凭借我在用户体验和设计方面的背景，我很快意识到我需要某种可视化的界面来控制我的项目，但令我沮丧的是，我发现并没有简单的方法来实现这一点。于是，你刚刚让你的第一个
    LED 灯闪烁（通过编程迈出的小小步子），然后你就意识到你需要学习 PHP、Xcode、Android 以及其他所有东西。更不用说，这个领域的大部分工具都是由开发者为开发者制作的。


    正是在这时，我决定解决这个问题。我把这个想法告诉了 Dmitry，我的联合创始人兼 CTO，于是我们开始为自己构建它。我们制作的第一个项目是一个浇水系统，以便在我出差时让我的植物存活下来。当然，它本可以自动化，但我只是喜欢按下按钮，让世界另一端的泵开始工作。随后我们进行了
    Kickstarter 众筹，社区规模扩大到 20 多万人，服务器每月处理数十亿次请求。


    Blynk 是最容易使用且应用最广泛的构建物联网（IoT）项目和互联产品移动应用的平台。它主要有三个组成部分：固件、服务器和移动应用。首先，我们提供库，几乎可以将任何硬件在线化（目前支持超过
    400 种型号），无论您选择哪种连接方式。Wi-Fi、蜂窝网络、以太网和 XBee 都已在线，对于本地连接，您可以使用 BLE 和 USB。此外，我差点忘了提及
    Node.js、Python 和 C 的支持。


    Blynk 还支持工业通信协议，如 RS232、RS485、UART、CAN、ModBus 和 OneWire。当您的硬件上线后，它将连接到我们的 Blynk
    云服务器，该服务器是开源的，基于 Java 构建。访问 Blynk 云服务器是免费的，不过您也可以本地运行它。从本质上讲，服务器将您的硬件和智能手机连接在一起。


    本地的 Blynk 服务器甚至可以运行在 5 美元的树莓派上，届时它将处理每秒高达 1,000 个请求。它是安全的、轻量的，而且快得惊人。接下来是用于 iOS
    和 Android 的移动应用，用户可以在上面快速拼接出一个界面，以远程控制事物并可视化传感器数据。我们让使用变得超级简单：你只需拖放按钮、滑块、仪表、图表、地图等小部件即可创建所需的界面。无需编码或设计技能，因为所有的重大
    UI 配置都在应用端完成。


    ![](img/6866071e033820549b214c239744aaa0_12_0.png)


    Blynk 包含许多专为物联网设计的功能，例如控制多个设备和组、轻松与他人共享硬件访问权限、同步物理和 HMI 状态、实时更新所有连接客户端的 UI、推送通知、电子邮件以及其他很棒的功能。正如你可能察觉到的那样，Blynk
    功能强大。


    **开发像这样的产品看起来非常复杂。从概念到现实很难吗？**


    确实如此，现在也依然充满挑战，但另一方面，它也极具趣味性和令人兴奋。从一开始，我们就为系统的每个组件设定了很高的标准。我要提到的第一个挑战是，当像 Blynk
    这样复杂的产品每周都在不断演进时，如何保持用户体验（UX）中相同的简单性和灵活性。


    其次，有数千种设备，它们各自具有特定的规范和协议。完全与硬件和连接无关意味着在固件方面需要投入大量工作。我们的嵌入式解决方案架构师 Volodymyr 为其建立了坚实的基础，现在添加新硬件相当容易，但总有我们需要关注的小细节。甚至有一些竞争对手也在使用它。


    总的来说，“打通各个环节”并提供无缝的开发者体验是最大的挑战。


    > Blynk 是最容易使用且应用最广泛的构建物联网（IoT）项目和互联产品移动应用的平台。


    ![](img/6866071e033820549b214c239744aaa0_12_1.png)


    ## OpenSource（开源）


    您的 Linux 新闻与观点来源


    **在开始他们的之前，用户需要注意哪些（基于硬件或软件的）要求？**


    Blynk 几乎可以在任何微控制器或微型计算机上工作。从 Arduino 和树莓派到 Particle Photon、Intel Edison 等。初学者可以先查看我们网站上的支持硬件列表（www.blynk.cc）。您还需要某种连接方式以启用互联网连接，很多人都会忘记这一点，这可能会让您感到惊讶。幸运的是，如今市场上有许多内置连接功能的设备。如果您没有这些设备，也可以支持
    BLE。如果您想使用有线连接，USB 是您的选择，不过对于新手来说有点棘手。


    如果您想运行自己的 Blynk 服务器，对硬件的唯一要求是安装 Java 8+。对于 Linux，我们建议使用我们的 Node.js 模块。


    Blynk 应用运行在所有 iOS 8 及更高版本的 iPhone 上，而 Android 应用需要 OS 4.0.3 及更高版本。


    我们尚未推出平板版本，但你仍然可以在 iPad 和 Android 平板上启动 Blynk——它只是会被放大显示。


    **Blynk 是否为不同类型的基于 Linux 的硬件提供兼容性？**


    关于 Linux 兼容性，我们开箱即用地支持像树莓派、BeagleBone、CHIP、Omega 和 Intel 板卡等单板计算机。你还可以在 Fedora
    和 Ubuntu 等常规发行版上运行 Blynk，我们希望能在不久的将来扩展这个库。


    我们建议使用 Node.js 模块进行 Linux 安装，因为它证明使用 JavaScript 实现简单项目要容易得多，不过也提供纯 C++ 库。


    我还想提一下，Blynk 提供了 OpenWRT 的安装包，从而扩展到数百种基于 Linux 的网络设备。


    **Blynk 是否适合第一次接触 Arduino 开发的人？**


    当我们开始做 Blynk 时，Arduino 和树莓派是仅有的两个目标平台，我们希望用户能在不到五分钟内看到初步结果。我认为我们在极其简单的起步方面做得非常出色。你只需要将特殊的密钥（我们称之为
    Auth Token）粘贴到我们提供的示例代码中，并将固件上传到设备即可。之后，你立即可以访问模拟输入的传感器数据，并可以直接从应用控制数字引脚和发送 PWM
    信号。完全不需要编写代码。


    当你探索更多功能时，你可能需要参考文档，或者 Hacker、Instructables、YouTube 上的大量教程。我们的社区页面充满聪明且积极的人，他们总是乐于助人。


    **我们注意到有关于 Blynk 可以使用的虚拟引脚（Virtual Pins）系统的提及，能否告诉我们关于这个的更多信息？**


    ![](img/6866071e033820549b214c239744aaa0_13_0.png)


    ![](img/6866071e033820549b214c239744aaa0_13_1.png)


    ### 小部件的奇妙世界


    通过 Blynk 创建的大多数项目的核心将主要由小部件（widgets）组成。许多为 Blynk 设计的小部件为特定功能提供了触发器，而其他的则与你的智能手机连接并同步。也许让
    Blynk 的小部件选择如此引人入胜的原因是，团队还引入了一系列传感器。所以，如果你的项目需要使用 GPS、加速度计，或者也许是陀螺仪，都会有预先编程好的小部件让它立即运行起来。团队计划在后续更新中推出更多的小部件，以真正开始探索一些尚未覆盖的硬件可能性。我们建议前往
    Blynk 论坛，查看用户将小部件引入项目的独特方式。


    '
