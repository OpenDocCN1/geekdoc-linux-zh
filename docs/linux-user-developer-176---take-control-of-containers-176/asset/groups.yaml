    ## TAKE CONTROL OF CONTAINERS


    Containers and container orchestration platforms are revolutionising DevOps and
    infrastructure. Find out more about how you can take advantage of them.


    Containers offer a solution to the problem of software portability, i.e. how to
    get it to run reliably when moving from one *computing environment* to another.
    Software development is a lengthy process and needs several iterations of testing
    and development before it can be termed production-ready. This will usually involve
    working in numerous different environments – from a developer’s PC to a test environment,
    from staging to production, and from a physical machine in a data centre to a
    virtual machine in the cloud.


    A container holds an application, along with all its dependencies, libraries and
    other binaries, plus the configuration files needed to run it, bundled into a
    single package. By containerising the application and its dependencies, differences
    in operating systems and infrastructure are abstracted away. Anyone can run the
    container image from their system without worrying too much about the underlying
    requirements.


    As development and production practices move towards containerisation, it is important
    to understand that while containers are lightweight and great for porting applications,
    it is difficult to manage containers in a production environment, which may well
    have thousands or more containers with different application components running.
    This brings container orchestration tools into the picture. These are systems
    to manage all of the bare-metal or virtual machines that you need to run your
    containers on. They also manage your containers, launch them on the underlying
    machines, make sure they are distributed and keep them healthy.


    > A container holds an application and everything needed to run it, bundled into
    a single package


    ![](img/6866071e033820549b214c239744aaa0_18_0.png)


    ### Containers

    - House the minimal requirements for running an application, enabling quick and
    lightweight deployment.

    - Independent self-sufficient application bundles; they can be run across machines
    without compatibility issues.

    - Can be versioned, archived, shared and used for rolling back previous versions
    of an application. Platform configurations can essentially be managed as code.

    - Help break down deployment into functional discrete parts, making a clear separation
    of concerns but this also means more components to handle.

    - More containers can be put onto a server than onto a traditional virtual machine.

    - Many containers running on one host system can in theory cause security concerns,
    as they have access to the same kernel.

    - A resource-light way to get started with a program.


    ### Virtual Machines

    - Run many discrete OS instances in parallel on a single host with VMware.

    - Emulate virtual hardware and account for all the underlying system requirements.

    - VM images are significantly larger than containers.

    - Enable true hardware-level isolation, so the chance for interference and/or
    exploitation is theoretically less likely compared to containers.

    - Ensure security and consistent OS interface.

    - In real-world scenarios, virtual machines and containers are complimentary and
    there is a high chance that you’ll need a combination of both.


    ## Take control of containers


    ### CONTAINERISE A COMPLETE FILE SYSTEM WITH DOCKER


    Docker is the most renowned name in container technology. Here''s why…


    Docker containers wrap a piece of software in a complete file system that contains
    everything needed to run it: code, runtime, system tools, system libraries – anything
    that can be installed on a server. This guarantees that the software will always
    run the same, regardless of its environment. One of the USPs of Docker containers
    is that they start instantly and use less RAM. Images are constructed from layered
    file systems and share common files, making disk usage and image downloads much
    more efficient.


    Docker uses the Linux kernel and its features, like cgroups and namespaces, to
    segregate processes so they can run independently. This independence is the intention
    of “containers” – the ability to run multiple processes and apps separately from
    one another to make better use of your infrastructure while retaining the security
    you would have with separate systems.


    Docker technology was initially built on top of LXC, generally thought of as traditional
    Linux containerisation. LXC was useful as lightweight virtualisation, but it didn''t
    have a great developer or user experience. Now, Docker technology brings more
    than the ability to run containers – it also eases the process of creating and
    building containers, shipping images and versioning images.


    ![](img/6866071e033820549b214c239744aaa0_19_0.png)

    ![](img/6866071e033820549b214c239744aaa0_19_1.png)

    ![](img/6866071e033820549b214c239744aaa0_19_2.png)

    ![](img/6866071e033820549b214c239744aaa0_19_3.png)


    ### 01 Using Docker


    Docker is used for fast and consistent delivery of your application. Docker supports
    continuous integration and a continuous deployment workflow. When the testing
    is complete, to deliver the product you can just push the updated image to a production
    environment. Being a container-based platform, Docker allows highly portable workloads.
    As Docker is lightweight and portable, it is easy to dynamically manage workloads
    and scale up or tear down applications and services as businesses require.


    ### 02 Docker architecture


    Docker uses client-server architecture. The Docker daemon does the heavy lifting
    of building, running and distributing your Docker containers. The Docker client
    communicates with the Docker daemon using REST API over UNIX sockets or a network
    interface. The Docker client has a command-line interface which it uses to talk
    to the daemon. Docker contains images, containers and registries in the daemon
    process. A Docker image is a read-only template that has instructions for creating
    a Docker container. A Docker container is a runnable instance of a Docker image,
    while a Docker registry is a library of images.


    ### 03 Docker images


    Docker images are the build components of Docker. Each image consists of a series
    of layers which are combined into a single image using union file systems. These
    layers make Docker lightweight. If you update an application, a new layer is then
    built and replaces only the layer that was updated. Every image starts from a
    base image. The simple, descriptive instructions are stored in a Dockerfile, which
    is used to build the base image. Each instruction creates a new layer in the image.
    The base image is defined using the FROM keyword in the Dockerfile.

