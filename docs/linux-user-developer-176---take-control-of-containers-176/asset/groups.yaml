    # This month


    ![](img/6866071e033820549b214c239744aaa0_10_1.png)


    Stable releases (17)

    In development (7)

    Downloads are generally up this month, with Mint extending its lead at the top
    of the distro food chain. It''s also great to see some emerging distros make their
    way into the top ten.


    # Highlights


    **Linux Mint**

    Mint is growing at a rapid pace, so much so that it''s hard to keep up with it!
    Its recent 18.1 update has been widely praised by the community, primarily for
    the amount of changes that have been introduced. If you haven''t checked it out
    already, make sure you do so on.


    **Solus**

    Solus keeps climbing up the board of top downloads, and it''s easy to see why.
    Touted as being one of the best distros for low-resource machines, Solus prides
    itself on its out-of-use-and beautiful design.


    **elementaryOS**

    We can''t talk about beautiful distributions without also mentioning elementaryOS.
    Its desktop environment, titled Pantheon, is arguably one of the most user-friendly
    environments we''ve ever used.


