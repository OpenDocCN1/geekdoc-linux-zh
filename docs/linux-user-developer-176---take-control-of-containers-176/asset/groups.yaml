    # INSTALLATION AND UPGRADE ISSUES


    Don’t fall at the first hurdle on your Linux adventure — overcome these common
    install or upgrade problems


    ![](img/6866071e033820549b214c239744aaa0_57_0.png)


    **Above** You need to make the ISO disk image bootable


    > One of the most common issues is disks being ‘invisible’ to Linux installers.
    Fortunately, there is an easy fix


    # 1 THE INSTALL MEDIA WON’T BOOT


    So you’ve downloaded Linux and either burned it to a CD/DVD or copied it to a
    USB stick. But it won’t boot. Not a good start. First up, ensure that if you’re
    using a CD/DVD, you’ve burned the actual ISO and not just copied the file. In
    the same way, if you’re using USB, you need to follow a guide on how to make the
    image bootable, not just copy it to a stick. If you’ve done this, the next thing
    you need to do is access the boot sequence menu on your machine. This is pretty
    well hidden away on modern machines and the sequence varies between manufacturers.
    Try the **Esc** key or F12 to display the selections.


    # 2 THE INSTALLER DOESN’T SEE MY HARD DISK


    Over recent years there have been a lot of changes to how PCs work, as we’ve moved
    from the BIOS era to the UEFI era. In addition, hard disks (and particularly SSDs)
    and how they communicate inside machines has progressed quickly. Many of these
    optimisations have been designed specifically for Windows, which can cause problems
    for Linux. One of the most common issues is disks being ‘invisible’ to Linux installers.
    Fortunately, there is an easy fix should you encounter this problem – in your
    computer’s settings, change the hard disk mode to AHCI/SATA. This is simple enough,
    but making this change will likely stop your Windows install from starting up
    if you are dual-booting. To fix this, start Windows as normal and use the command:


    ```

    bcdedit /set {current} safeboot minimal

    ```


    ...before changing the setting. Then, after making the change and completing the
    first boot, use:


    ```

    bcdedit /deletevalue {current} safeboot

    ```


    ...to get back up and running.'
  - '[PAGE 58]


    # # 3THE PC STILL BOOTS INTO WINDOWS


    A common problem when you install Linux on a new machine is that you''ll complete
    the wizard, reboot as instructed, but then the computer still boots into Windows.
    What gives?! Don''t worry, you haven''t wasted your time – this is generally down
    to GRUB, the Linux bootloadder, not installing correctly, typically not on the
    right disk. To resolve this issue, simply install and run Boot-Repair if it is
    available in your OS repo. If not, use:


    ```

    $\text{sudo grub-install}$

    ```


    ...together with the appropriate disk, as displayed by using:


    ```

    $\text{ls -l /dev/disk/by-label/}$

    ```


    # # 4I DON''T HAVE WORKING WI-FI


    Although Linux is supported on a vast range of hardware nowadays, the one area
    where you may encounter problems during installation is when it comes to custom
    hardware – particularly network-related, especially Wi-Fi! It''s not at all uncommon
    to boot a live CD and find you have no connectivity. The first step to resolving
    the issues is finding out which hardware you have in your machine – use:


    ```

    $\text{lspci --short}$

    ```


    This will tell you which chipset your machine is running, which will allow you
    to look for the correct driver. The Linux Wireless page on kernel.org lists kernel-supported
    devices – wireless.wiki.kernel.org/users/drivers is a good starting point.


    # # 5I CAN''T USE MY PRINTER


    Although most of the large printer companies have some degree of Linux support,
    it''s fair to say that support is pretty patchy but improving all the time. If
    you are having issues with your printer, or you are planning to buy a new printer,
    Ubuntu hosts a useful page detailing supported models – bit.ly/2mwr976 – as does
    Linux-Printing.org. Printing on Linux is enabled via the Common UNIX Printing
    System (CUPS), which is an open source, portable printing framework. After installing
    CUPS (with apt install cups), point your web browser to http://localhost:631/admin
    to access GUI-based configuration of the printing system.


    # # 6UBUNTU INCORRECTLY SAYS MY LTS RELEASE IS THE LATEST


    If you have installed a long-term support (LTS) version of Ubuntu, you may note
    that even though a new release is available, your system isn''t showing it as
    available. This is because LTS releases typically prompt only to update to newer
    LTS releases. Of course, we generally want to be on the latest version


    regardless. So, to change this behaviour in Ubuntu, open Software and Updates,
    select the Updates tab and in the ''Notify me of new updates'' section, change
    the option from ''For long-term support versions'' to ''For any new version''.
    Check for an update in the usual way and you''ll be able to upgrade. To achieve
    the same result on the command line, edit /etc/update-manager/release-upgrades
    and ensure Prompt=normal is set. Use:


    ```

    $\text{do-release-upgrade}$

    ```


    ...to start the upgrade.


    # # 7I CAN''T INSTALL SECURITY UPDATES AUTOMATICALLY


    Out of the box, Ubuntu is configured so that all updates need to be user-installed.
    This is great if we want to have ultimate control and awareness of what our system
    is doing. However, it''s probably not a bad idea to have our machine install security
    updates automatically at the very least. Configuring this is actually pretty straightforward
    – run the command:


    ```

    $\text{sudo dpkg-reconfigure --priority=low unattended-upgrade}$

    ```


    ...then accept the prompts and you''re all set. Note that reboots won''t happen
    automatically; to enable this, Unattended-Upgrade::Automatic-Reboot "true" must
    be set in /etc/apt/apt.conf.d/20auto-upgrades.


    # # 8I WANT TO INSTALL PROPRIETARY DRIVERS


    In a default installation of Ubuntu, proprietary drivers are disabled. What are
    proprietary drivers? They are drivers that don''t conform to the completely open
    source licences of the OS itself. Provided you are comfortable with this, installing
    these drivers for wireless cards, graphics cards and so on can provide big performance


    Above Installing proprietary drivers can get hardware working when open source
    options aren''t available.


    boosts or fix things that are otherwise broken. To enable, go to the Additional
    Drivers section of Software Sources, choose the drivers you wish to use and click
    Apply Changes. The selected drivers will then install.


    ![](img/6866071e033820549b214c239744aaa0_58_0.png)'
  - '[PAGE 59]


    # THIRD-PARTY APPLICATIONS


    After your initial Linux install, you''ll want to get the best third-party applications
    on your system right away


    ![](img/6866071e033820549b214c239744aaa0_59_0.png)


    Above: LibreOffice is a capable alternative to Microsoft Office


    # 9 I NEED OFFICE!


    One of the biggest arguments we always hear against* Linux is ‘there’s no Microsoft
    Office’. There’s no getting away from it: this is a true statement. But in reality,
    you can reduce the burden of losing Office in a number of ways. The most obvious
    is to use a native alternative suite, such as the excellent LibreOffice, which
    nowadays compares pretty well to Microsoft''s offering both in features and, with
    the latest ribbon user interface in LibreOffice 5.3, style too. LibreOffice includes
    alternatives to all the main Microsoft Office apps — Word (Writer), Excel (Calc),
    PowerPoint (Impress), Visio (Draw) and even Access (Base).


    Although this is definitely the purest option, even the most hardened Linux user
    will probably admit that there are times when only the real Office experience
    will do — sharing files with others is a key example of this. WINE 2.0 (or the
    Cross-over or PlayOnLinux tools based on it) allows Windows applications to run
    fully on Linux, now with full support for Office 2013. Simply install the host
    app and run the Office installer inside it. It works surprisingly well. If none
    of these works for you, you could consider running a bare Windows installation
    inside a VirtualBox or VMware virtual machine and installing into that. Although
    perhaps a little bit heavyweight, it works… and that''s the most important thing!


    # 10 EVERYTHING IS TINY ON MY HiDPI DISPLAY


    So you''ve got a machine with a fantastic new HiDPI display... perhaps an XPS
    13 Developer Edition (UHD) or just a lovely new 4K monitor for your desktop. That''s
    all great, except everything is tiny in the OS and some of your favourite apps.
    First up, don''t be alarmed — this isn''t a problem that''s unique to Linux; even
    now, Windows 10 has some pretty nasty-looking UI elements on high-resolution screens.
    Fixing up the main OS itself is easy enough: you just need to set a menu and title
    bar scaling factor in the Screen Display section of Settings. After that''s done,
    you''ll need to look for specific apps that are problematic. Many will have their
    own HiDPI themes; however, you can also check out the window scaling options in
    gnome-tweaks-tool to help you get everything scaled just right.


    ![](img/6866071e033820549b214c239744aaa0_59_1.png)


    # 11 I REALLY NEED PHOTOSHOP


    You''ve got your system up and running and you''ve realised that you don''t need
    Microsoft Office any more thanks to LibreOffice. What''s another big app that
    new Linux adopters struggle to come to terms with being without? Adobe Photoshop.
    There''s no denying that Photoshop is an awesome application, but unless you really
    use a large number of the advanced features in Photoshop, Linux has a heavyweight
    image editor of its own that you can use — GIMP. Short for the GNU Image Manipulation
    Program, the application is an incredible tool for photo retouching, image composition
    and authoring, and much more thanks to its open source (and of course free) nature
    and extensible plug-in architecture. GIMP is also available on Windows and Mac
    OS X, and excels on those platforms too!


    ![](img/6866071e033820549b214c239744aaa0_59_2.png)'
