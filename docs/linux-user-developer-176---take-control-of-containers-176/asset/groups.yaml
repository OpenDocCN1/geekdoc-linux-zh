    # Feature


    # Take control of containers


    # WORK WITH LIGHTWEIGHT STANDALONE

    CONTAINERS USING RUNC


    runc is the universal container runtime from the Open Container Initiative


    Docker has features that make the sandboxing environment *abstract*. It abstracts
    the specifics of the underlying host, without needing to rewrite the application
    and without excessive performance overheads. These features were integrated into
    a unified low-level component called *runc*. Later, Docker Inc made *runc* as
    a standalone tool. *runc* is a lightweight, portable container runtime. It has
    all the plumbing code that is used by Docker to interact with container-related
    system features. It is designed for security and scalability and is independent
    of the rest of the Docker platform. It has native support for security features
    available in Linux — SELinux, Apparmor, seccomp, control groups, capability drop,
    pivot_root, uid/gid dropping and more. runc has portable performance profiles,
    contributed by Google engineers. The Open Container Project, under the auspices
    of the Linux Foundation, governs it. runc aims to make standard containers available
    everywhere. Containers start as child processes of *runc*. They can be embedded
    into other systems without having a running daemon. *runc* does not restrict you
    to a particular workflow or deployment setup: it requires root file system and
    configurations only. It is based on the battle-tested plumbing used by Docker.
    In production, you can either use it as a part of a Docker deployment or as a
    standalone in your custom platform.


    ![](img/6866071e033820549b214c239744aaa0_23_0.png)


    # 01 runc features


    runc provides full support for Linux namespaces, including user namespaces. The
    security features that are available in Linux are also supported by runc. runc
    provides native support for live migration, Windows 10 containers, and is planning
    native support for Arm Power, Sparc and hardware features like DIOK, sr-iov, tpm
    and secure enclaves. runc is built on libcontainer, which powers Docker Engine
    installations. Though its configuration standards are formal and governed by the
    Open Container Project, it does not force you to have a restrictive workflow or
    deployment setup.


    ![](img/6866071e033820549b214c239744aaa0_23_1.png)


    Then execute:


    ```

    ```

    sudo apt-get install runc

    ```

    ```


    You need superuser access during installation so you can use the package post-installation.


    # 02 Installation


    To install *runc* on your Linux machine, download *runc-linux-amd64* from the
    GitHub releases repository (github.com/opencontainers/runc). Install from the
    package. If you need source code, then download the ZIP file.


    ```

    ```

    $ sudo mv runc-linux-amd64 /usr/bin/runc

    $ sudo chmod a+x /usr/bin/runc

    ```

    ```


    Or you can directly install from the Ubuntu package list:


    ```

    ```

    $ sudo apt-get update

    ```

    ```


    # 03 Root file system


    Only the root file system and a configuration are required to start runc containers.
    runc cannot create or extract the root file system on its own. Use Docker to create
    it.


    ```

    ```

    $ mkdir /tmp/myapp/rootfs

    $ docker export myapp | tar xvC - /tmp/myapp/rootfs

    ```

    ```


    You may use other tools that use OCI images to create the root file system, or
    use a directory that already has a root file system in it. Check the directory:


    ```

    ```

    $ ls /tmp/myapp/rootfs

    ```


    Then, in the parent directory, create an OCI runtime configuration file using
    *runc*:

    ```


    ```

    ```

    $ cd /tmp/myapp

    $ runc spec

    $ ls

    ```

    ```


    Check that *config.json* is created.


    # 04 Configuration file


    Edit the *config.json* file generated in the last step.


    ```

    ```

    $ sudo vi config.json

    ```

    ```


