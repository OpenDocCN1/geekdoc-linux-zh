    ## 03 Using Firejail, continued


    To view the list of running sandboxes, use the following command:


    ```bash

    $ firejail --list

    ```


    You will see the list in the format PID:username:command. To view the process
    tree within each sandbox, type:


    ```bash

    $ firejail --tree

    ```


    If you want to join an already running sandbox, obtain the PID of the sandbox
    using the `--list` option. Then pass this PID into the following command:


    > If you execute Firejail without any arguments, it starts the regular /bin/bash
    shell. Only the Bash session and its descendants are visible inside the sandbox
    [19]


    ```bash

    $ firejail --join=3974

    ```


    If you are starting Firefox in Firejail and you want a browser-specific iptables
    filter, execute:


    ```bash

    $ firejail --net=eth0 firefox

    ```


    This creates a new TCP/IP stack for the Firefox session, assigns an IP address,
    and installs a browser-specific iptables filter. If the program you are starting
    in Firejail doesn''t need network access, execute:


    ```bash

    $ firejail --net=none vlc

    ```


    Control the amount of data that flows into and out of sandboxes:


    ```bash

    $ firejail --name=browser --net=eth0 firefox &

    $ firejail --bandwidth=browser set eth0 70 30

    ```


    This example sets a bandwidth of 70 kilobytes per second on the receive side and
    a bandwidth of 30 kilobytes per second on the transmit side. You can change this
    at runtime and clear them as well, using:


    ```bash

    $ firejail --bandwidth=browser clear eth0

    ```


    ## 04 Firetools


    Firetools is the GUI for Firejail. It is distributed as a separate package and
    is built using Qt4/Qt5 libraries. It has a sandbox launcher option with the system
    tray, sandbox editing, management and statistics. It isn''t in standard repositories,
    but an official DEB is available. Download the relevant Firetools DEB file, then
    navigate to the folder where the file is downloaded and execute:


    ```bash

    $ sudo dpkg -i firetools*.deb

    ```


    This installs Firetools. However, in case of a dependency issue, resolve it using:


    ```bash

    $ sudo apt-get install -f

    ```


    Start it using:


    ```bash

    $ firetools &

    ```


    ### Network setup for sandbox applications


    Network connection to a sandbox application can be direct or routed. In a direct
    setup, a sandbox is connected to the network using the kernel MAC VLAN device;
    in a routed setup, it uses the bridge device. A direct setup looks like this:


    ```bash

    $ firejail --net=eth0 firefox

    ```


    In a routed setup, first set up the bridge and then pass the bridge name with
    the `--net` parameter in the above command.


    ## Tutorial


    ![](img/6866071e033820549b214c239744aaa0_43_0.png)


    You can see the Firetools window and an indicator for running the app in the system
    tray. To start any app, double-click it, or right-click and select Run. To monitor
    the running apps, right-click anywhere in the GUI and select Tools; all the running
    apps will be listed. To add a new app in Firetools, right-click the GUI and click
    Edit. Fill in the relevant details with the Command section value as the Firejail
    app name.


    ## 05 Firejail features


    The core technology behind Firejail is Linux namespaces. This lightweight visualisation
    technology is used as the first step of isolating the application.


    The application container is built automatically when the sandbox starts and is
    destroyed when the sandbox is closed. The container is based on the file system
    currently installed. Firejail can attach a new TCP/IP networking stack to the
    sandbox, which comes with its own routing table, firewall and set of interfaces.
    This stack is independent of the host network stack. Networking operations supported
    by Firejail are: create new interfaces, move existing interfaces, assign addresses,
    hostname support, DNS support, Linux netfilter support and traffic shaping. The
    security profile file is located in the `/etc/firejail` directory and it describes
    the file system container, the security filters and network configuration. Appimage
    in Firejail does native format packaging. Add `--appimage` to mount the package
    and run it inside the sandbox. Firejail provides sandbox auditing and monitoring.
    It can point out gaps in security profiles. It provides options to track all the
    aspects of sandboxed applications. Monitoring of CPU/memory/bandwidth usage, tracing
    system calls, monitoring exec and fork events can be done using Firetools.


    ![](img/6866071e033820549b214c239744aaa0_43_1.png)


    ## 06 Building custom profiles


    All the custom profiles are stored within the `~/.config/firejail` directory.
    Pass Firejail command-line configuration options to the program using profile
    files. To build a custom profile for any app, first create the `.config/firejail`
    directory in your home directory:


    ```bash

    $ cd ~

    $ mkdir -p .config/firejail

    $ cd .config/firejail

    ```


    Copy the default security profiles used by Firejail into this directory using:


    ```bash

    $ cp /etc/firejail/app_name.profile app_name.profile

    ```


    Here, `app_name` is the name of the app that you''re creating a custom profile
    for. Now edit the new profile. You can comment out lines, blacklist directories,
    whitelist files, etc. Once modified, save and close the file, then start your
    application using:


    ```bash

    $ firejail app_name

    ```


    As a profile file with the same name as the application is present in the `~/.config/firejail`
    directory, it will be loaded. You can also create a profile file in the `/etc/firejail`
    directory. If the profile file with app name is present in both the directories,
    `~/.config/firejail` takes precedence over `/etc/firejail`. A profile file can
    also be created at a different location and specified while starting the application.


    ## 07 Building whitelist profiles


    Whitelist profiles are more restrictive profiles and are built using Firejail''s
    whitelisting feature. The custom profiles we created in the last section are also
    called blacklisted profiles, in that you blacklist the files the application is
    not allowed to use. Here, files that are necessary for the application to run
    are listed while everything else is not accessible. To create a whitelist profile,
    first create a simple Bash sandbox using `--private`:


    ```bash

    $ firejail --private

    ```


    Now start the app in this Bash session and list all the files within it using:


    ```bash

    $ find .

    ```


    Locate the directory/file that needs to be whitelisted, then exit and close the
    sandbox. Then, as before, create a new profile in the `~/.config/firejail` directory
    with the name `app_name.profile`. Enter the following as the content of the file:


    ```

    $ app_name profile

    mkdir ~/, directory_name

    whitelist ~/directory_name

    include /etc/firejail/whitelist-common.inc

    include /etc/firejail/default.profile

    ```


    Here, we are whitelisting `directory_name`, which is within the `app_name` directory
    structure. Session configurations are included from `whitelist-common.inc`.


    ## 08 Firefox sandboxing


    Start a Firefox process by executing:


    ```bash

    $ firejail firefox

    ```


    A single instance of Firefox can have multiple browser windows. So, if Firefox
    is running already and you want to start a new session within Firejail, execute:


    ```bash

    $ firejail firefox --no-remote

    ```


    Firefox is allowed only a small set of files and directories by the sandbox. Log
    messages are sent to syslog if Firefox tries to access blacklisted files. The
    security filters enabled by default reduce the attack surface of the kernel. The
    seccomp filter is generally used by default. If you don''t trust the add-ons and
    plug-ins installed in your browser, use the **--private** option and configure
    the DNS at sandbox level. This prevents attacks from reconfiguring DNS.


    ```bash

    $ firejail --private --dns=8.8.8.8 --dns=8.8.4.4 firefox --no-remote

    ```


    To create a new TCP/IP stack, connect to your Ethernet network and give an explicit
    IP address:


    ```bash

    $ firejail --net=eth0 --ip=192.168.1.207 firefox

    ```


    Firejail replaces the regular X11 server with an Xpra or Xephyr server, preventing
    X11 keyboard loggers and screenshot utilities from accessing the main X11 server.


    ```bash

    $ firejail --x11 --net=eth0 firefox

    ```


    ## 09 Seccomp filter


    Firejail uses Seccomp-bpf by default. It stands for *secure computing mode*, which
    is expressed in Berkeley Packet Filter (BPF) format. Build a whitelist seccomp
    filter and attach it to a user program using the Firejail sandbox. Firejail needs
    the syscalls details for seccomp filter. We used strace for getting syscalls.
    Let''s take VLC media player as an example:


    ```bash

    $ strace -qc vlc

    ```


    This opens VLC; once you close it, strace prints the syscall list. Copy the list
    of all syscalls into a text editor and make them comma-separated without any space
    in between. Now use this comma-separated syscall string in **--seccomp**. Keep
    the values below:


    ```bash

    $ firejail --shell=none --seccomp=keep=poll,futex,[...] vlc

    ```


    The command looks lengthy, but make sure all the syscalls are included. In case
    of error, add the missed syscall. Now create a whitelist profile in **/etc/firejail**.
    Copy the default VLC profile here and add the two lines below to it:


    ```

    shell none

    seccomp keep poll,futex,rt_sigreturn,stat,read,[...]

    ```


    Note that the dots denote the rest of the comma-separated syscall names.


    ## 10 AppImage support


    AppImage is a universal software packaging format developed by Simon Peter.

    Start your AppImage application in Firejail using:


    ```bash

    $ firejail --appimage=Firefox-50.1.0.g1ibc2.3.3-x86_64.AppImage

    ```


    All sandbox options are available, like **--private** or **--x11**. Suppose you
    have downloaded Firefox from the AppImage project repository; to start the sandbox,
    use:


    ```bash

    $ firejail --appimage --private --net=eth0 --x11 ~/Downloads/Firefox-50.1.0.g1ibc2.3.3-x86_64.AppImage

    ```


    **--appimage** is used to enter AppImage mode, **--private** creates an empty
    home directory, **--net=eth0** creates new network namespace and **--x11** is
    used for Xpra-based sandboxing.

    To verify the security parameters, open Firetools and click Firefox sandbox to
    get the stats. See that seccomp stats that it is enabled and the capability field
    that is zero? These two parameters are most important for a sandbox and everything
    else is built on top of them. If you have more than one sandbox running, limit
    the bandwidth of each sandbox as follows:


    ```bash

    $ firejail --bandwidth=32119 set eth0 80 20

    ```


    > Firejail can attach a new TCP/IP networking stack to the sandbox, which comes
    with its own routing table, firewall and set of interfaces. This stack is independent
    of the host network stack [19]


    ## Firejail sandboxing for X11


    Xpra and Xephyr are supported in Firejail X11 sandboxing. Regular X11 is replaced
    by these X11 software packages:


    ```bash

    $ firejail --x11=xpra --net=eth0 program-and-arguments


    $ firejail --x11=xephyr --net=eth0 program-and-arguments

    ```


    Another option is to use:


    ```bash

    $ firejail --x11 --net=eth0 program-and-arguments

    ```


    This way, Firejail first tries Xpra and if not installed, it tries to find Xephyr.
    Note that it is Xpra that is started as the root user. X11 sandboxing features
    are not supported.

