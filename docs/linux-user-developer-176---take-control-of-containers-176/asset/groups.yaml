    \ 地址进行 curl 请求：\n\n```bash\n$ curl 172.16.28.2:5000\n```\n\n这将打印 'hello'。\n\n\
    ```bash\n$echo Generating a default key\nKey-Type: RSA\nKey-Length: 2048\nSubkey-Length:\
    \ 2048\nName-Real: Chad Container\nName-Comment: GPG signing key\nExpire-Date:\
    \ 0\nPassphrase: cha\nGenerating ltb.gpg\nGenerating rkt.sec\n\"secends\"\n\"\
