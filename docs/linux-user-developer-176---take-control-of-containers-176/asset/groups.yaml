    \ STANDALONE CONTAINERS USING RUNC\n\nrunc is the universal container runtime\
    \ from the Open Container Initiative.\n\nDocker has features that make the sandboxing\
    \ environment *abstract*. It abstracts the specifics of the underlying host, without\
    \ needing to rewrite the application and without excessive performance overheads.\
    \ These features were integrated into a unified low-level component called *runc*.\
    \ Later, Docker Inc made *runc* as a standalone tool. *runc* is a lightweight,\
    \ portable container runtime. It has all the plumbing code that is used by Docker\
    \ to interact with container-related system features. It is designed for security\
    \ and scalability and is independent of the rest of the Docker platform. It has\
    \ native support for security features available in Linux — SELinux, AppArmor,\
    \ seccomp, control groups, capability drop, pivot_root, uid/gid dropping and more.\
    \ runc has portable performance profiles, contributed by Google engineers. The\
    \ Open Container Project, under the auspices of the Linux Foundation, governs\
    \ it. runc aims to make standard containers available everywhere. Containers start\
    \ as child processes of *runc*. They can be embedded into other systems without\
    \ having a running daemon. *runc* does not restrict you to a particular workflow\
    \ or deployment setup: it requires root file system and configurations only. It\
    \ is based on the battle-tested plumbing used by Docker. In production, you can\
    \ either use it as a part of a Docker deployment or as a standalone in your custom\
    \ platform.\n\n![](img/6866071e033820549b214c239744aaa0_23_0.png)\n\n### 01 runc\
    \ features\n\nrunc provides full support for Linux namespaces, including user\
    \ namespaces. The security features that are available in Linux are also supported\
    \ by runc. runc provides native support for live migration, Windows 10 containers,\
    \ and is planning native support for Arm Power, Sparc and hardware features like\
    \ DIOK, sr-iov, tpm and secure enclaves. runc is built on libcontainer, which\
    \ powers Docker Engine installations. Though its configuration standards are formal\
    \ and governed by the Open Container Project, it does not force you to have a\
    \ restrictive workflow or deployment setup.\n\n![](img/6866071e033820549b214c239744aaa0_23_1.png)\n\
    \nThen execute:\n\n```bash\nsudo apt-get install runc\n```\n\nYou need superuser\
    \ access during installation so you can use the package post-installation.\n\n\
    ### 02 Installation\n\nTo install *runc* on your Linux machine, download *runc-linux-amd64*\
    \ from the GitHub releases repository (github.com/opencontainers/runc). Install\
    \ from the package. If you need source code, then download the ZIP file.\n\n```bash\n\
    $ sudo mv runc-linux-amd64 /usr/bin/runc\n$ sudo chmod a+x /usr/bin/runc\n```\n\
    \nOr you can directly install from the Ubuntu package list:\n\n```bash\n$ sudo\
    \ apt-get update\n```\n\n### 03 Root file system\n\nOnly the root file system\
    \ and a configuration are required to start runc containers. runc cannot create\
    \ or extract the root file system on its own. Use Docker to create it.\n\n```bash\n\
    $ mkdir /tmp/myapp/rootfs\n$ docker export myapp | tar xvC - /tmp/myapp/rootfs\n\
    ```\n\nYou may use other tools that use OCI images to create the root file system,\
    \ or use a directory that already has a root file system in it. Check the directory:\n\
    \n```bash\n$ ls /tmp/myapp/rootfs\n```\n\nThen, in the parent directory, create\
    \ an OCI runtime configuration file using *runc*:\n\n```bash\n$ cd /tmp/myapp\n\
    $ runc spec\n$ ls\n```\n\nCheck that *config.json* is created.\n\n### 04 Configuration\
    \ file\n\nEdit the *config.json* file generated in the last step.\n\n```bash\n\
    $ sudo vi config.json\n```\n\nEdit the configurations defined in it or add a new\
    \ configuration as required. By default, an SSH session is created inside the\
    \ container using **config.json**, which is created by the runc `spec` command.\
    \ If you want to launch the container in the background, remove the terminal settings\
    \ from it. Update the process field, for example:\n\n```json\n{\n  \"process\"\
    : {\n    \"terminal\": false,\n    \"user\": {\n      \"uid\": 0,\n      \"gid\"\
    : 0\n    },\n    \"args\": [\n      \"sleep\", \"5\"\n    ],\n    \"env\": [\n\
    \      \"PATH=/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin\",\n\
    \      \"TERM=xterm\"\n    ],\n    ...\n  }\n}\n```\n\n```text\n... root... 4096\
    \ Dec 21 03:18 /usr/bin/ls\n... root... 4096 Dec 21 03:18 /usr/bin/cat\n```\n\n\
    ### 05 Container lifecycles\n\nThe `run` command is used to create a runc Container.\
    \ It handles the creation, start and deletion of the container. First, create\
    \ a container ID:\n\n```bash\n$ cd /tmp/myapp\n$ runc create containerId\n```\n\
    \nNow create the container:\n\n```bash\n$ runc run containerId\n```\n\nView the\
    \ list of created containers:\n\n```bash\n$ runc list\n```\n\nTo start the process\
    \ inside the container:\n\n```bash\n$ runc start containerId\n```\n\nTo delete\
    \ the container on exit, execute:\n\n```bash\n$ runc delete mycontainerId\n```\n\
    \nThis allows higher-level systems to manage runc. This is used to set up the\
    \ network stack of the container between create and start.\n\n### 06 Systemd integration\n\
    \nrunc does not daemonise to manage containers. Since it launches directly from\
    \ the command-line interface, so it integrates with init systems like systemd.\
    \ For example, the systemd unit file could be something like:\n\n```ini\n$ vi\
    \ myapp-unit-file\n[Unit]\nDescription=Start My Container\n\n[Service]\nType=forking\n\
    ExecStart=/usr/local/sbin/runc run -d --pid-file /run/containerId.pid\ndelete\
    \ containerId\nWorkingDirectory=/tmp/myapp\nPIDFile=/run/containerId.pid\n\n[Install]\n\
    WantedBy=multi-user.target\n```\n\nIt can also be used with other init systems\
    \ and process supervisors to ensure that containers are restarted when they exit.\n\
    \n### 07 Uninstalling runc\n\nIf you want to uninstall runc from your system,\
    \ execute:\n\n```bash\n$ sudo apt-get remove runc\n```\n\nIf you want to remove\
    \ runc packages along with their dependencies, execute:\n\n```bash\n$ sudo apt-get\
    \ remove --auto-remove runc\n```\n\nTo completely remove runc with all of its\
    \ configuration files and data, execute:\n\n```bash\n$ sudo apt-get purge runc\n\
    ```\n\nOr use:\n\n```bash\n$ sudo apt-get purge --auto-remove runc\n```\n\nThese\
    \ commands remove all configuration files and data associated with the runc package.\
    \ They cannot be recovered, so only use them if you are very sure!\n\n### 08 runc\
    \ versus Docker\n\nDocker uses technologies like Linux, Go, bnc, aufs, fuse, iptables,\
    \ VirtualBox, vxlan, mesos, etc., and consul and systemd. Although these components\
    \ are reusable, they make Docker complex. runc is a lightweight, portable container\
    \ runtime. It does not depend on the rest of the Docker platform. Although runc\
    \ takes help from Docker to create a root file system, Docker and runc both support\
    \ portability, ubiquity and scalability. runc can be used as part of a Docker\
    \ deployment or standalone distribution.\n\n### 09 runc vs rkt\n\nrunc and rkt\
    \ are both implementations of the Open Container Initiative specification. Low-level\
    \ details of the host operating system and configuration are required in runc,\
    \ whereas rkt does not expect the user to understand the low-level details of\
    \ the host operating system. Neither has centralised daemons, so they both integrate\
    \ with init systems like systemd. runc requires container images to be downloaded\
    \ or cryptographically verified separately. rkt can download Docker images as\
    \ well as App Container images.\n\n> runc is designed for security and scalability\
    \ and is independent of the rest of the Docker platform\n\n## MANAGE AND ORCHESTRATE\
    \ CONTAINERS WITH KUBERNETES\n\nWith Kubernetes you can move containers around\
    \ if there's a hardware problem\n\nMicroservice architecture combined with containerised\
    \ applications offers a great application deployment solution, capable of handling\
    \ large amounts of traffic. But this solution is still based on an abstraction:\
    \ the containers are still running on a machine with finite resources. What if\
    \ one of those machines goes down and you need to move containers?\n\nContainer\
    \ orchestration platforms manage all of the bare-metal or virtual machines that\
    \ you need to run your containers on. These platforms also manage your containers,\
    \ launching them on the underlying machines, making sure they are distributed,\
    \ and keeping them healthy. Kubernetes is one such container orchestration system.\n\
    \nKubernetes runs all of your application containers using a desired state philosophy.\
    \ This means that you can say how many instances of an app you need and the system\
    \ will then ensure that you always have that many replicas running. If one goes\
    \ down, it restarts another one. If too many are running, it kills the extras.\
    \ Kubernetes was created by Google, based on its experience of building its own\
    \ container orchestration system, over the past ten years. There are a lot of\
    \ components that make Kubernetes work; let's take a look at them.\n\n![](img/6866071e033820549b214c239744aaa0_25_0.png)\n\
    ![](img/6866071e033820549b214c239744aaa0_25_1.png)\n![](img/6866071e033820549b214c239744aaa0_25_2.png)\n\
    ![](img/6866071e033820549b214c239744aaa0_25_3.png)\n\n### 01 Containers and pods\n\
    \nPods are the smallest unit of execution in Kubernetes, while containers are\
    \ subatomic components. That means you never just run a container; it always runs\
    \ inside a control structure known as a pod. But this doesn't mean you can't run\
    \ Docker images based on Dockerfiles exactly the same way you do in Docker. In\
    \ this case, Kubernetes will spin up a single container pod.\n\nThe other Kubernetes\
    \ components spin up one or more pods, or connect one or more pods to the network.\
    \ Pods are composed of one or more containers. Containers running in the same\
    \ pod share disk, localhost, security context and other properties.\n\n### 02\
    \ ReplicaSet\n\nA ReplicaSet is one of the core parts of the Kubernetes system.\
    \ It ensures that a specified number of pod replicas are running at any one time.\
    \ If there are too few, it will start more. Unlike manually created pods, the\
    \ pods maintained by a ReplicaSet are automatically replaced if they fail, are\
    \ deleted or are terminated.\n\n### 03 Deployment\n\nA Deployment can be thought\
    \ of as an abstraction containing pods and a ReplicaSet: When you create a deployment,\
    \ a ReplicaSet and pods are brought up. You only need to describe the desired\
    \ state of a deployment object, and the deployment controller will change the\
    \ actual state to the desired state at a controlled rate for you. You can define\
    \ deployments by creating new resources, or replace existing ones with new ones.\
    \ The recommended way to deploy an application on Kubernetes is by creating a\
    \ deployment.\n\n### 04 StatefulSet\n\nMany distributed and stateful applications\
    \ need to have unique, pre-known network identifiers before they are deployed.\
    \ Stateful applications also need stable, persistent storage that is available\
    \ to be bound to the appropriate pod even after the previous pod has gone down.\
    \ StatefulSets provide all this to an\n"
