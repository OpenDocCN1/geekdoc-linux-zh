    ```

    paul@xps13-yakkey: ~

    paul@xps13-yakkey:~$ uname -a

    Linux xps13-yakkey 4.9.9-040909-generic #2d.02090333 SMP Thu Feb 9 08:35:27 UT
    C 2017 x86_64 x86_64 x86_64 GNU/Linux

    paul@xps13-yakkey:~$

    ```


    Linux is a weird and wonderful beast. One of the best things about it is that
    it really gives you the chance to dig deep into the operating system to get everything
    up and running exactly as you like it. The flip side of this, however, is that
    as you tweak things, you are likely to come across


    unexpected problems, whether they''re related to the distribution you are using,
    the hardware you''re running, a particularly obscure piece of open source software
    or perhaps that Linux just works a little differently to what you are used to.
    This is particularly likely if you are using Linux for the first time after coming
    from Windows – it can be daunting at first in a lot of areas.


    This article highlights some issues you might come across when using Linux, whether
    you are just starting out or are a long-time Linux user.


    If you come across a problem that''s not featured in our guide then fear not,
    you''re almost certainly not the first. Search engines can normally point you
    in the right direction for general queries, or if issue is specific to a certain
    piece of software, the support forums or issue tracker for that product are a
    great place to start. The Linux community is a great bunch of people!


    > “ As you tweak things in Linux, you are likely to come across unexpected problems
    ”


    # KERNEL ISSUES


    The Linux kernel is one of the largest open source projects in the world, with
    over 13 million lines of code – and it underpins everything your Linux machine
    does. Generally speaking, most Linux users don’t think about the kernel too much:
    it just sits there, doing its thing. The kernel becomes most important and interesting
    to users when a forthcoming release adds support for a new piece of hardware that
    is in a machine or fixes some issues in existing hardware.


    Typically, a specific kernel version is tied to a specific distribution release.
    For example, Ubuntu Xenial Xerus includes kernel 4.4, while Ubuntu Yakkey Yak
    includes kernel 4.8. Although this is the case, there is nothing to stop you installing
    a new version of the kernel on your system if you want to take advantage of some
    new features. One of the nicest things about the kernel is you can easily install
    a new version, switch between the two (via GRUB) and roll back to a previous release
    if needed.


    The easiest way to install a newer kernel is using a package from the Ubuntu upstream
    kernels archive (bit.ly/1zcskza). Browse to the kernel version you want to install,
    select the appropriate architecture and download the file. Install as normal and
    reboot to load the new kernel. If you do need to revert, open the GRUB advanced
    menu, load the old kernel and uninstall the package in the normal way. Note that
    many users treat a kernel update like a BIOS update – if it ain’t broken, don’t
    fix it!'
