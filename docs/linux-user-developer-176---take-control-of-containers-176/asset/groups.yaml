  mdcn: "\n\n![](img/6866071e033820549b214c239744aaa0_20_0.png)\n\n## 04 Docker 镜像仓库\n\
    \nDocker 镜像仓库是 Docker 的发行组件。它们可以是私有或公有的，并且可以与守护进程位于同一服务器上，也可以位于远程服务器上。它们在仓库中存储\
    \ Docker 镜像。在构建镜像后，可以将其推送到公有或私有镜像仓库。Docker Hub 是一个公有的 Docker 镜像仓库，拥有庞大的镜像集合。它允许你贡献自己的\
    \ Docker 镜像。Docker Store（现已从测试版转为正式发布）允许你买卖 Docker 镜像。\n\n![](img/6866071e033820549b214c239744aaa0_20_1.png)\n\
    \n## 05 Docker 容器\n\nDocker 容器是 Docker 的运行组件。使用 Docker API 或 CLI 命令，你可以运行、启动、停止或删除容器。每个容器由镜像构建而成，表现得像一个隔离且安全的应用程序平台。它们还可以访问运行在不同主机或容器上的资源。Docker\
    \ 客户端指示 Docker 守护进程使用 `docker run` 命令或等效的 API 来运行容器。例如，要使用 Ubuntu Docker 镜像运行容器并以交互模式执行\
    \ /bin/bash 命令，请执行：\n\n```bash\n$ docker run -i -t ubuntu /bin/bash\n```\n\n##\
    \ 06 Docker 服务\n\nDocker 服务是 Docker 的可扩展组件。它们使 Docker 节点集群（swarm）协同工作。Docker 服务允许定义副本任务（replica\
    \ tasks）实例的数量。这些副本任务本身是 Docker 镜像。你可以指定并发运行的副本任务数量。swarm 管理器将负载均匀地分布在 worker 节点上，因此对于消费者而言，它看起来像是一个单一的应用程序。`docker\
