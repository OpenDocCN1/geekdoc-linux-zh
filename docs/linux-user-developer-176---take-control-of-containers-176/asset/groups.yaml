    ## 本期内容


    - 掌控容器

    - 35 个必备的 Linux 修复技巧

    - 使用 Firejail 限制不可信软件

    - 通过树莓派运行 VPN


    ![](img/6866071e033820549b214c239744aaa0_2_0.png)


    欢迎来到《Linux 用户与开发者》的最新一期，这是英国和美国最受欢迎的 Linux 和开源杂志。你加入容器革命了吗？无论你是寻找完整运行时环境的开发者，还是希望保护隔离基础设施的系统管理员，抑或是希望探索最新计算发展的探索者，我们在第
