    \ 和其他主要发行版。rkt 是可组合的。它还具有用于强信任、镜像审计和应用程序身份的加密原语，使其具有安全性。它可以下载、加密验证并运行应用程序容器镜像。它并非设计用于运行完整的系统容器，而是用于运行独立的应用程序，如\
