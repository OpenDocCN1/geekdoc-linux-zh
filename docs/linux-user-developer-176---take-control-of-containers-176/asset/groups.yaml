    ## Review


    ### Password managers


    ### Clipperz


    > Anonymity is key when it comes to using Clipperz''s vault system


    ![](img/6866071e033820549b214c239744aaa0_83_0.png)


    Different tags can be applied to each entry you make within Clipperz


    #### UI and design


    Thanks to its minimal UI system, navigating through Clipperz is a breeze. Individual
    vault entries are categorised through keywords, which are then accessible through
    the side menu; although some didn''t save correctly at times. Each password entry
    can be cloned and archived when needed, a nice touch if you''ve got several closely
    linked accounts.


    #### Adding and customising entries


    Large amounts of details can be attached to each entry, especially when it comes
    to debit and credit card information. As you create passwords, Clipperz will indicate
    any password that it feels needs to be updated, even providing examples for what
    makes a good password. However, the constant reminders of how rubbish our passwords
    were soon became tiresome!


    #### Security


    Instead of storing readable data on their server, they use a host-proof web app
    that instead encrypts and decrypts the data inside Clipperz. This is great news
    for users, as it makes it near impossible for your entries to be compromised from
    their side. There''s also 128-bit encryption board, which automatically adds two-step
    authentication at any point where Clipperz deems it necessary to use.


    #### Extra features


    One of Clipperz''s best features is its one-time password system, which allows
    for secure access to your files from an insecure device. It works a treat, and
    especially useful when you need instant access when out and about. There''s also
    a mobile version for users to explore, but it lacks many of the core features
    that the desktop version offers.


    #### Overall


    Clipperz does everything it sets out to do relatively well, and we truly believe
    your details will be safe. Certain features are a little rough around the edges,
    but expect that to be sorted in future updates.


    8


    ### Passopolis


    > Is sharing the key to success for Passopolis?


    ![](img/6866071e033820549b214c239744aaa0_83_1.png)


    Changes to your passwords can be made at any time


    #### UI and design


    While some will be attracted to Passopolis''s minimal design, it''s a little too
    bonebones for our liking. Most options are available through its on-board account
    system, but some are hidden away and pretty difficult to find unless you''re familiar
    with the software. However, a handy search tool is available for quickly sifting
    through your entries.


    #### Adding and customising entries


    Known as ''secrets'' in Passopolis, adding new entries is a one-button process.
    Details can be added as you see fit, but it does lack the customisability of what
    Clipperz offers. However, we did like the team-based entries that can be created,
    allowing you to share access to specific entries with pre-targeted family and
    friends when needed.


    #### Security


    Although there''s nothing truly unique about the security protocols used within
    Passopolis, it does include everything that you could need. A password generator
    is on hand for adding custom passwords, while users also have access to two-factor
    authentication when needed. Exporting files does require a decryption run-through
    first, which can take a while to complete, however.


    #### Extra features


    Again, there''s not a lot to get excited about here. There''s an import system
    on hand, however. If you''re moving from your previous manager across to Passopolis,
    you can have your entire vault of entries imported with relative ease. Be warned,
    this isn''t a quick process, and a full import can take anywhere from a few minutes
    to a couple of hours.


    #### Overall


    Sticking to the basics is all well, and good, but Passopolis tends to feel a little
    too minimal at times. A lack of customisation on entries is an annoyance, but
    all base options are present.


