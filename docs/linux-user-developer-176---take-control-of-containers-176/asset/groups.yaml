    \ gpg-batch 的批处理文件：\n\n```bash\n$echo Generating a default key\nKey-Type: RSA\n\
    %commit\n$echo done\n```\n\n现在使用批处理模式生成密钥：\n\n```bash\n$ gpg --batch --gen-key\
    \ gpg-batch\n```\n\n密钥创建后，列出密钥并使用 GPG 将相关密钥添加为受信任密钥。现在导出公钥：\n\n```bash\n$ gpg\
    \ --no-default-keyring --armor \\\n--secret-keyring ./.rkt.sec --keyring ./rkt.pub\
    \ \\\n--export lude@example.com > pubkeys.gpg\n```\n\n### 07 签名镜像：对 ACI 进行签名\n\
    \n既然你已经有了公钥，请使用 GPG 按照以下方式对 ACI 文件进行签名：\n\n```bash\n$ gpg --no-default-keyring\
    \ --armor \\\n--output hello-0.0.1-linux-amd64.aci.asc \\\n--detach-sig hello-0.0.1-linux-amd64.aci\n\
    ```\n\n验证签名后的镜像：\n\n```bash\n$ gpg --no-default-keyring \\\n--certify-keyring\
    \ ./.rkt.sec --keyring ./rkt.pub \\\n--verify hello-0.0.1-linux-amd64.aci.asc\n\
    hello-0.0.1-linux-amd64.aci\n```\n\n执行时你将看到签名详情。\n\n作为构建和签名我们的 hello.go 应用程序镜像的一部分创建的文件是\
    \ hello-0.0.1-linux-amd64.aci、hello-0.0.1-linux-amd64.aci.asc 和 pubkeys.gpg。\n\
    \n### 08 限制系统资源\n\n使用 rkt 限制容器使用的 CPU 和允许的内存等系统资源。容器继承在系统服务单元文件中配置的资源限制。资源控制设置限制\
    \ CPU 时间配额、I/O 和内存资源。要限制 CPU 时间配额，请创建一个单元文件：\n\n```ini\n[Service]\nExecStart=/usr/bin/rkt\
    \ run github.com/iximages/stress:0.0.1\nCPUQuota=20%\n```\n\n这确保了执行进程在一个 CPU 上获得的\
    \ CPU 时间不超过 20%。要检查使用情况，请使用：\n\n```bash\n$ ps -p <PID> -o %cpu\n```\n\n...其中 <PID>\
    \ 是运行中容器进程 ID。\n\n### 09 rkt 与 systemd\n\nrkt 与 systemd 等 init 系统协同工作。后者用于启动、停止和检查容器的状态。由于\
    \ rkt 不通过长时间运行的守护进程进行接口交互，因此其 pod 的生命周期由 systemd 直接管理。使用 rkt 创建一个单元文件：\n\n```ini\n\
    $ vi rkt-unit-file\n[Unit]\nDescription=etcd\n\n[Service]\nSlice=machine.slice\n\
    ExecStart=/usr/bin/rkt run coresys.com/etcd:v2.2.5\nKillMode=mixed\nRestart=always\n\
    ```\n\n这将在 systemd 下运行一个 etcd 实例。使用这些命令进行管理：\n\n```bash\n$ sudo systemctl start\
    \ etcd.service\n$ sudo systemctl stop etcd.service\n$ sudo systemctl restart etcd.service\n\
    $ sudo systemctl enable etcd.service\n$ sudo systemctl disable etcd.service\n\
    ```\n\n"
