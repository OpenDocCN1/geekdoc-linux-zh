    on a router which has 4MB, 8MB or 16MB of flash memory.


    Either way, move the cursor to the entry for GCC, and press Y to mark it for deployment
    in the core image. Due to menuconfig''s capability of resolving resulting dependencies,
    you can see the product mark a few other required packages with a star. In the
    next step, repeat the steps for GDB and Make to give yourself a realistic chance
