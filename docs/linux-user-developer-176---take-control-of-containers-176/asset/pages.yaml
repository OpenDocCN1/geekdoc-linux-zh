  md: "# **SOUND EDITOR**\n\n# EKO sound editor 5.3.1\n\nThere's always a role for\
    \ simple and quick software\n\n![](img/6866071e033820549b214c239744aaa0_91_0.png)\n\
    \nWhether you're running a very old laptop, a small board like the Raspberry Pi,\
    \ or just want to get a simple job done quickly without reading through a 200-page\
    \ manual, there's always a need for simple versions of everyday tools. Eko is\
    \ a sound editor, working with OLA or OF5 and with fairly minimal dependencies,\
    \ relying on software you may already have installed such as libsndfile.\n\nWritten\
    \ by Peter Semiletov, the author of the Tea editor that we reviewed in **LU&D\
    \ #159**, this is a newer project, and although far from fully featured, is under\
    \ fairly active development. Installation went without a hitch. Included in the\
    \ source tarball is a manual in HTML format - in English and Russian - covering\
    \ the basics of each feature.\n\nIn use, the multiple window layout feels a little\
    \ over-the-top after the recent trend towards single window interfaces. There's\
    \ a good case for it though, as the soundfile editing is the main task, and everything\
    \ else is peripheral. Editing features are minimal, but when you want to do a\
    \ simple audio task quickly, this is a nice app to have.\n\nThe software is licenced\
    \ under the Public Domain, but there is a link from the author's website for donations\
    \ to a local Ukrainian dog shelter.\n\n![](img/6866071e033820549b214c239744aaa0_91_1.png)\n\
    \n*Above* Simple capture and simple effects — sometimes quick and easy is better\
    \ than powerful and complex!\n\n+   **Pros**\n+   An easy install, with few dependencies,\
    \ and a gentle learning curve - simple and reasonably user-friendly.\n+   \n+\
    \   **Cons**\n+   Even for a simple editor, it may be lacking your favourite feature.\
    \ The HTML manual is a little basic.\n\n> **Great for...**\n> A quick edit done\
    \ in the time others take to load.\n> \n> semiletov.org/eko/index.html\n\n# **CPU\
    \ INFORMATION TOOL**\n\n# cpuid 20170122\n\nGet detailed CPU information dumped\
    \ to the command line\n\n![](img/6866071e033820549b214c239744aaa0_91_2.png)\n\n\
    You may have run cat /proc/cpuinfo when you weren't sure of the processor(s) on\
    \ a machine you were logged into, particularly before downloading software compiled\
    \ for particular chips. It tells you what you need, but there are other occasions\
    \ where you'll want to know the complete output of the CPUID information that\
    \ the manufacturer has put onto the chip.\n\nCpuid is a useful little command\
    \ line utility for getting that information, and dumping it out to the command\
    \ line. Pages of it. There's also an option to dump the raw hex info, and the\
    \ author of the utility is always pleased to get output in this form to help further\
    \ debug and update cpuid. Updates are regular, bringing in new chip families,\
    \ and fixing bugs — usually reflecting bugs in the manufacturer's CPUID implementation\
    \ rather than the tool itself.\n\nDownloading, untarring and running proved no\
    \ problem on various machines, which is always a good sign (there are many apps\
    \ that don't make it to these pages because they are nowhere near as co-operative).\
    \ The included man page gives some insight into the problems of certain chipset\
    \ families — all x86 relatives, ARM and other processors don't have a direct equivalent\
    \ for outputting — and provides further reading. As well as a binary tarball,\
    \ RPM and source packages are available. It's another great little utility in\
    \ the UNIX spirit of a program just doing one thing, but doing it extremely well.\n\
    \n+   **Pros**\n+   As detailed, accurate, and up-to date as the author can make\
    \ it. Man page included.\n+   \n+   **Cons**\n+   A little opaque to those needing\
    \ to find the CPU info for the first time. Not ARM.\n\n> **Great for...**\n> It\
    \ certainly saves tearing off the heatsink to check!\n> \n> etallen.com/cpuid.html"
