- pgno: 79
  md: "# Anaconda for the Pi\n\nPython is the language of choice on the Raspberry\
    \ Pi, and there are many packages available within the Raspbian repository. Berrycconda\
    \ helps you move out beyond these modules\n\n![](img/6866071e033820549b214c239744aaa0_79_0.png)\n\
    \nJoey Bernard is a true renaisssance man, splitting his time between building\
    \ furniture, helping researchers with scientific computing problems and writing\
    \ Android apps\n\n# Why Python?\n\nIt’s the official language of the Raspberry\
    \ Pi. Read the docs at python.org/doc\n\nPython has always been the language of\
    \ choice for projects on the Raspberry Pi. There are several reasons for this,\
    \ but we won’t dive into the history here. As a consequence of this decision,\
    \ there are many Python modules available as packages within the Raspbian package\
    \ repository. You can trust that these have been compiled to run on the ARM processor\
    \ and that they have been tested and are therefore safe to use. But not all Python\
    \ modules are available this way. For the missing modules, the intention is that\
    \ you could use pip to install them yourself on your Raspberry Pi. While this\
    \ works fine for some modules, you will eventually start running into those modules\
    \ that require debugging to figure out why they aren’t working correctly on the\
    \ ARM processor. The amount of work involved in debugging these types of issues\
    \ really should be distributed across many people, and luckily it is. For Python\
    \ coders, a very good distribution of Python modules is available as the Anaconda\
    \ project. There is also a community part of the Anaconda project, called Berrycconda,\
    \ which has been ported to the Raspberry Pi. The main website for the project\
    \ is located at github.com/jihelmus/berrycconda. This article will cover the steps\
    \ to getting it installed and ready to use on your Raspberry Pi so that we can\
    \ go on and look at some of the functionality that becomes available to you for\
    \ Python coding in future articles.\n\n> “The main utility in Anaconda is the\
    \ conda packaging system”\n\nThe very first step is to download and install the\
    \ core of the Berrycconda system. On the download page, there are installation\
    \ files for both armh6l (Raspberry Pi 1 or Zero) and armv7l (Raspberry Pi 2 or\
    \ 3). There are also different versions of the installer for Python 2.X or Python\
    \ 3.X. This covers all of the options that you might need for your particular\
    \ project. The installer is actually a shell script, so all you need to do is\
    \ to make the script executable, and then run it. For example, we can install\
    \ the Python 3.x version on a Raspberry Pi 1 with the following commands:\n\n\
    ```\nwget https://github.com/jihelmus/berrycconda/releases/download/v1.0.0/Berrycconda-1.0.0-Linux-armv6l.sh\
    \  \nchmod +x Berrycconda-1.0.0-Linux-armv6l.sh  \n./Berrycconda-1.0.0-Linux-armv6l.sh\n\
    ```\n\nBy default, this will install the base of an Anaconda environment into\
    \ the directory berrycconda3 in your home directory. You can change this installation\
    \ directory during installation in case you want to put it somewhere else. The\
    \ installer also asks you whether you want to add the path to the binaries to\
    \ your PATH environment variable. This is generally a good idea. Just remember\
    \ to exit from the current shell and log back in so that the new path is picked\
    \ up. Either that, or manually source the initialisation file to get it set.\n\
    \nThe main utility within Anaconda is the conda packaging system. Conda provides\
    \ a very fully featured package management system to handle Python modules and\
    \ all of the various dependencies that may be required. There is a very good site\
    \ of documentation available at the website conda.io/docs, covering all of the\
    \ options and functionality available. The very first thing you will want to do\
    \ is to keep your current system up to date. You can update individual packages\
    \ with the command:\n\n```\nconda update package-name\n```\n\nThis command will\
    \ go out to the internet and figure out what new versions of the given package\
    \ exist, and if it finds one, it will ask you whether you really want to perform\
    \ the update. If you want to just see what will be done, you can use the command\
    \ line option --dry-run to get a display of what commands would be run. If you\
    \ just want to keep the entire system updated, you can use the following command\
    \ to handle updating everything:\n\n```\nconda update --all\n```\n\nTo install\
    \ new packages, you need to first find out what has already been packaged and\
    \ is available. Because this is a community effort, the selection will vary over\
    \ time. So you should check before trying to install some packages. You can do\
    \ that search with the command:\n\n```\nconda search some_text\n```\n\nThis will\
    \ do a regular expression search of package titles, looking for the given text,\
    \ and return a list of any available. Sometimes, however, you may get a rather\
    \ large list returned. If this happens, you can do a more refined search using\
    \ the usual regex options used in many other UNIX utilities. If you already know\
    \ the package name, you could use the -f option to force the search to only return\
    \ exact matches to the text you give it. If the package in question is already\
    \ installed on your Raspberry Pi, it will have an asterisk beside it for the version\
    \ installed. When you are ready to install the package you were searching for,\
    \ you can do so with the following command:\n\n```\nconda install ipython\n```\n\
    \nThis will, by default, install the latest version of the ipython package within\
    \ the Berrycconda environment. It will also install any missing dependencies,\
    \ as well as updating any out-of-date dependencies. While the online documentation\
    \ is great, there are also help pages available within conda. If you want general\
    \ help, you can get it with the help command. For help with some specific conda\
