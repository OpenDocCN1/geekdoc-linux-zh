  md: '# NATIVELY MANAGE A CLUSTER WITH DOCKER SWARM


    Why use one container when you can run a whole bunch of them concurrently?


    While projects like Kubernetes and DC/OS (dcos.io) are building container orchestration
    platforms that can work with different container formats, Docker Inc integrates
    container orchestration with its core offering, the Docker Engine. As of Docker
    Engine v1.12.0, Swarm is built-in and can be used without the need to install
    any extra software. You will need networked host machines to run the container
    cluster, though.


    This integration of Swarm with Docker Engine means you can natively manage a cluster
    of Docker Engines. This means you can use the Docker CLI to create a swarm, deploy
    application services to a swarm and manage swarm behaviour. With the latest Docker
    Engine v1.13.0, you can even use Docker Compose files to manage your Docker swarm.
    For the uninitiated, Docker Compose is a tool for defining and running multi-container
    Docker applications on a single node. Compose works on files called docker-compose.yml.
    As of Docker Engine v1.13.0, docker Compose files can be used to configure a multi-node
    swarm as well. Swarm provides all the production-ready features you need, including
    load balancing,


    ![](img/6866071e033820549b214c239744aaa0_27_0.png)


    | NAME | ACTIVE | DESIRED | STATE | URL | SWARM | DOCKER ENGINES |

    |:---|:---|:---|:---|:---|:---|:---|

    | lucy@sdc-dockerswarm10/101905 docker-machine | | | | | | |

    | swarm-war-manager-1 | `*` | single | Running | `tcp://198.199.226.244:2376`
    | `v1:13.0` | |

    | swarm-war-manager-2 | `*` | single | Running | `tcp://198.199.226.223:2376`
    | `v1:13.0` | |

    | swarm-war-worker-3 | | single | Running | `tcp://198.199.226.228:2376` | `v1:13.0`
    | |

    | swarm-war-worker-4 | | | Running | `tcp://198.199.226.185:2376` | `v1:13.0`
    | |


    service discovery, rolling updates, scaling and more. We''ll learn about all these
    features in a little while. For now, just keep in mind that when you run Docker
    without using swarm mode, you execute container commands. When you run Docker
    in swarm mode, you orchestrate services.


    # **01** Swarm manager node


    Instances of Docker Engine participating in a swarm are called nodes. A swarm
    can be of two types of nodes, manager and worker. Manager nodes are the controlling
    authorities in a swarm and handle all the administrative tasks, like dispatching
    tasks to a worker and performing the orchestration and cluster management functions
    required to maintain the desired state of the swarm. When there is more than one
    manager node in a swarm, they elect a single leader to conduct orchestration tasks.
    Even when you want to deploy an application to a swarm, you submit a service definition
    to a manager node.


    | NAME | ADDRESS | CONTAINER | DESIRED/ACTIVE | REQUIRED MEMORY | LIMITS |

    |:---|:---|:---|:---|:---|:---|

    | manager | | 1/Running 1/Running 1/Running | | | |

    | | | 198.199.226.244:338372 | | 1536M | |

    | | | | | 15% 15% 15% 15% | |

    | | | | | | |

    | manager | | | | | |

    | | | | | | |

    | worker | | 3/Running 3/Running 3/Running | | | |

    | | | 198.199.226.244:338372 | | | |

    | | | | | | |


    # **02** Swarm worker nodes


    Worker nodes are also instances of Docker Engine whose sole purpose is to execute
    containers. Worker nodes don''t participate in making scheduling decisions, or
    serve the swarm mode HTTP API. You can create a swarm of one manager node, but
    you cannot have a worker node without at least one manager node. By default, all
    managers are also workers. In a single manager node cluster, you can run commands
    like docker service create and the scheduler will place all tasks on the local
    Engine.


    # **03** Swarm services


    To deploy an application image in Docker swarm mode, you need to create a service.
    A service generally includes an image for a microservice within the context of
    some larger application. Examples of services include an HTTP server, a database,
    or any other type of executable program that you wish to run in a distributed
    environment. When you deploy a service to a swarm, the swarm manager accepts your
    service definition as the desired state for the service. Then it schedules the
    service on nodes in the swarm as one or more replica tasks. The tasks run independently
    of each other on nodes in the swarm.


    # **04** Deploy services via Compose file


    As of the latest Docker Engine (v1.13.0) and Docker Compose v3.0, there is cross-compatibility
    between Compose and the Docker Engine''s swarm mode.'
