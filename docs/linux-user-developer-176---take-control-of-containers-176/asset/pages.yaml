- pgno: 43
  md: "# Tutorial\n\n# Firejail\n\nYou can see the Firetools window and an indicator\
    \ for running the app in the system tray. To start any app, double-click it, or\
    \ right-click and select Run. To monitor the running apps, right-click anywhere\
    \ in the GUI and select Tools; all the running apps will be listed. To add a new\
    \ app in Firetools, right-click the GUI and click Edit. Fill in the relevant details\
    \ with the Command section value as the Firejail app name.\n\n![](img/6866071e033820549b214c239744aaa0_43_0.png)\n\
    \n# 05 Firejail features\n\nThe core technology behind Firejail is Linux namespaces.\
    \ This lightweight visualisation technology is used as the first step of isolating\
    \ the application.\n\nThe application container is built automatically when the\
    \ sandbox starts and is destroyed when the sandbox is closed. The container is\
    \ based on the file system currently installed. Firejail can attach a new TCP/IP\
    \ networking stack to the sandbox, which comes with its own routing table, firewall\
    \ and set of interfaces. This stack is independent of the host network stack.\
    \ Networking operations supported by Firejail are: create new interfaces, move\
    \ existing interfaces, assign addresses, hostname support, DNS support, Linux\
    \ netfilter support and traffic shaping. The security profile file is located\
    \ in the /etc/firejail directory and it describes the file system container, the\
    \ security filters and network configuration. Appimage in Firejail does native\
    \ format packaging. Add `--appimage` to mount the package and run it inside the\
    \ sandbox. Firejail provides sandbox auditing and monitoring. It can point out\
    \ gaps in security profiles. It provides options to track all the aspects of sandboxed\
    \ applications. Monitoring of CPU/memory/bandwidth usage, tracing system calls,\
    \ monitoring exec and fork events can be done using Firetools.\n\n![](img/6866071e033820549b214c239744aaa0_43_1.png)\n\
    \n# 06 Building custom profiles\n\nAll the custom profiles are stored within the\
    \ `~/.config/firejail` directory. Pass Firejail command-line configuration options\
    \ to the program using profile files. To build a custom profile for any app, first\
    \ create the `.config/firejail` directory in your home directory:\n\n```\n$ cd\
    \ ~ \n$ mkdir -p .config/firejail \n$ cd .config/firejail\n```\n\nCopy the default\
    \ security profiles used by Firejail into this directory using:\n\n```\n$ cp /etc/firejail/app_name.profile\
    \ app_name.\n```\n\nHere, `app_name` is the name of the app that you're creating\
    \ a custom profile for. Now edit the new profile. You can comment out lines, blacklist\
    \ directories, whitelist files, etc. Once modified, save and close the file, then\
    \ start your application using:\n\n```\n$ firejail app_name\n```\n\nAs a profile\
    \ file with the same name as the application is present in the `~/.config/firejail`\
    \ directory, it will be loaded. You can also create a profile file in the `/etc/firejail`\
    \ directory. If the profile file with app name is present in both the directories,\
    \ `~/.config/firejail` takes precedence over `/etc/firejail`. A profile file can\
    \ also be created at a different location and specified while starting the application.\n\
    \n# 07 Building whitelist profiles\n\nWhitelist profiles are more restrictive\
    \ profiles and are built using Firejail's whitelisting feature. The custom profiles\
    \ we created in the last section are also called blacklisted profiles, in that\
    \ you blacklist the files the application is not allowed to use. Here, files that\
    \ are necessary for the application to run are listed while everything else is\
    \ not accessible. To create a whitelist profile, first create a simple Bash sandbox\
    \ using `--private`:\n\n```\n$ firejail --private\n```\n\nNow start the app in\
    \ this Bash session and list all the files within it using:\n\n```\n$ find .\n\
    ```\n\nLocate the directory/file that needs to be whitelisted, then exit and close\
    \ the sandbox. Then, as before, create a new profile in the `~/.config/firejail`\
    \ directory with the name `app_name.profile`. Enter the following as the content\
    \ of the file:\n\n```\n$ app_name profile\nmkdir ~/, directory_name\nwhitelist\
    \ ~/directory_name\ninclude /etc/firejail/whitelist-common.inc\ninclude /etc/firejail/default.profile\n\
    ```\n\nHere, we are whitelisting `directory_name`, which is within the `app_name`\
    \ directory structure. Session configurations are included from `whitelist-common.inc`.\n\
    \n# 08 Firefox sandboxing\n\nStart a Firefox process by executing:"
