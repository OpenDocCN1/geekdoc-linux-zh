  md: '# Review | Password managers


    # In brief: compare and contrast our verdicts


    | | Clipperz | Passopolis | Encryptpr | KeePass |

    |---|---|---|---|---|

    | **UI and design** | Vault entries are categorised by keywords, making navigation
    super easy | A minimal approach is one thing, but this is a little too barebones
    for our liking | An impressive dual-menu system is used to help keep all the different
    key tools separated | Fairly complicated to navigate around, with a steep learning
    curve for new users |

    | **Adding and customising entries** | Entries can be as detailed, or as basic,
    as you deem necessary for your account | The creation process is easy, but lacks
    some core options we''d expect to see | Every entry can be filled into one of
    three types, with each having their own set of options | Each entry can be specifically
    tailored to your exact needs and choice of security |

    | **Security** | No readable data is stored on your server, so there''s little
    chance of being compromised | Provides everything you need to keep your account
    details safe and secure | No two-factor support here is an annoyance, but all
    the other options are here | Different layers of security can be applied to every
    entry that you create |

    | **Extra features** | One-time passwords are ideal for accessing your files on
    an insecure device | The import system is handy, but incredibly slow when it comes
    to it working | Multi OS support means that you can access your account wherever
    you may be | While a repair system is on hand for any corrupted files, it''s a
    little hit and miss |

    | **Overall** | Clipperz offers a unique approach to what a password manager should
    be | Passopolis, in its current state, fails to compete with the stronger competition
    available | Encryptpr has brought every thing we love into one handy program that
    every user should have | KeePass is credible, but it''s not recommended for those
    not used to this sort of software |


    # AND THE WINNER IS...


    # Encryptpr


    The core technology behind password managers has dramatically changed over the
    past 24 months, and perhaps the most pleasing element about undertaking this group
    test is that some of the best Linux offerings have also moved with the times.


    Each of the four open-source Linux password managers we tested here all have their
    strong points, but it was Encryptpr that really impressed us.


    Simplicity plays a big role in Encryptpr''s success, and everything from the initial
    set up process to adding your first entry can be done in a matter of minutes.
    Although we should mention that advanced users can still find what they need here,
    with many additional options for tailoring the program to your desktop also available.


    ![](img/6866071e033820549b214c239744aaa0_85_0.png)


    Each entry you make within the program will fit into one of three categories,
    with each supporting their own set of options to help fill in all the necessary
    details. It''s something you don''t necessarily find in other management systems,
    but it works a treat here. Of course, it''s also simple to merge all your entries
    together, if and when you need to.


    It''s no slooch in the security department with Encryptpr''s password generator
    on hand to make sure your details are kept safe. The program''s links with Spidercake
    also plays a massive role, helping you and your account stay completely anonymous
    when you use it. One omission is two-factor authentication, but it''s something
    we expect to see later.


    While we highly recommend trying out both KeePass and Clipperz as a viable alternative
    password managers, it''s Encryptpr''s scope of features and usability that really
    make it stand out from the crowd. There really is no better way to keep your password
    and account details safe.


    Oliver Hill'
