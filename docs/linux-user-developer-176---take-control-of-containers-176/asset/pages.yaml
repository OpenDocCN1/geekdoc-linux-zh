    # LINUX SERVERS


    If you are deploying Linux to a server, then you can expect to experience a somewhat
    different set of challenges


    # 29 I''M RUNNING OUT OF DISK SPACE


    When deploying Linux to VPS servers or containers, we seem to have gone back in
    time somewhat — we’re again in a world of limited disk space in which every byte
    counts! It’s ironic, but fortunately Linux has some tools to help us see where
    our valuable disk space is going. The first useful command-line tool is ‘df’,
    which shows us space on each volume and how much is used. Use of ‘-h’ to get a
    more human-readable version. Next up is ‘du’, which summarises the disk usage
    of files / directories. Again, the ‘-h’ switch can be used to make the output
    more human-readable. Another particular switch is to use the command in the following
    way: du -h1. This means to show the usage in human-readable form, but to a max
    depth of one directory. So totals will be summed for every subdirectory, but presented
    as totals for paths one directory from the current one.


    # 30 INSTALLED APPS AREN’T UPDATING


    Earlier, we talked about configuring Linux to apply automatic security updates,
    but it’s worth remembering that application updates themselves and less critical
    updates won’t be installed. Generally speaking, automatically updating everything
    isn’t the best idea in the world, but if you want to do it, you can! In a similar
    way to the previous example, you can use:


    ```

    sudo apt install unattended-upgrades

    ```


    ...in order to install the appropriate file to /etc/apt/apt.conf.d/50unattended-upgrades
    and check the appropriate line to allow all types of updates.


    A useful package to install is apticron, which is used to email an administrator
    info about any packages on the system that have updates available, plus a summary
    of changes in each package. After installation, set the destination email address
    in /etc/apticron/apticron.conf.


    # 31 MY SERVER IS BOOTING TO X


    If you are going to run Linux on a server, then of course the best approach is
    to install a server-specific distribution. Sometimes, of course, this isn’t always
    practical — you may start with a desktop machine that becomes a headless server,
    or you might just prefer to use a GUI to get set up. Either way, if you’re not
    using the graphical interface, you probably don’t want it starting up on your
    machine. To boot to text mode on each boot, edit /etc/default/grub, comment out
    the GRUB_CMDLINE_LINUX_DEFAULT line and ensure GRUB_CMDLINE_LINUX="text" is set.
    After running:


    ```

    sudo update-grub

    ```


    ...you’re all set. If running a systemd-enabled system (Debian 8/Ubuntu 15.04
    onwards), you’ll also need to run:


    ```

    sudo systemctl set-default multi-user.target

    ```


    Undo by running:


    ```

    sudo systemctl set-default graphical.target

    ```'
