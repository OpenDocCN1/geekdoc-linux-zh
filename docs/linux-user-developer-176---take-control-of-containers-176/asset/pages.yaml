- pgno: 40
  md: 'applications. To install PHP, use the command:


    ```

    sudo apt-get install php libapache2-mod-php

    ```


    This installs the latest version of PHP together with the Apache module required
    to integrate it (or will be automatically enabled). Note that some older applications
    explicitly require php5 rather than 7, so you may need to adjust the command accordingly.
    You can test your PHP install by creating a test.php file with the content `<php
    phpinfo(); ?>`.


    ![](img/6866071e033820549b214c239744aaa0_40_0.png)


    # 15 Install with Modules


    Just as with Apache, PHP is extensible with modules. To see which modules are
    available, use the command **apt-cache search php-**. Applications will typically
    specify which PHP modules they require: if you are seeing issues with blank pages,
    however, you may have PHP error reporting turned off, hiding the cause of the
    problem. You can temporarily enable it in your scripts with the lines `error_reporting(E_ALL);`
    and `ini_set(''display_errors'', ''1'')`. The Apache log in `/var/log/apache2`
    is also a good place to look for clues.


    ![](img/6866071e033820549b214c239744aaa0_40_1.png)


    # 16 Uploading to your server


    If you are deploying your LAMP stack on your local machine (for test purposes
    perhaps), then uploading content isn''t a challenge. For cloud-based or VM deployments,
    however, this may not be the case. The easiest way to deploy is via SFTP. Ensure
    you have openSsh-server installed on the server. Generate a public key on your
    machine `ssh-keygen -t rsa,` add the content of `~/.ssh/id_rsa.pub` to `~/.ssh/authorized_keys`
    on the server (for the appropriate user) and you should be able to connect directly
    with the `sftp` command.


    ![](img/6866071e033820549b214c239744aaa0_40_2.png)


    # 17 GUI-based server admin


    For GUI-based server admin, one of our favourite tools is Webmin. Available in
    an apt repository from www.webmin.com/deb.html, once installed, Webmin provides
    a graphical interface to all aspects of your Linux system, including all elements
    of the LAMP stack. The stock Webmin theme is very outdated, but the third-party
    Authentic theme brings Webmin straight into the 21st century with a Bootstrap-based,
    responsive theme. Grab it from github.com/gcoop/strut2-theme-theme.


    ![](img/6866071e033820549b214c239744aaa0_40_3.png)


    # 18 Tune your installation


    So that''s it, you''re all set up! Out of the box, Apache and MySQL have a standard
    set of config files that work fine on most hardware, but are certainly not optimised
    for your specific setup. Two Perl scripts, available from mycutter.net and apache2-tuner.pl,
    are designed to examine all the configuration files together with your system
    config and suggest improvements based on your system. They also look at logs from
    your running system, so ensure everything is up for at least 24 hours before use.


    ![](img/6866071e033820549b214c239744aaa0_40_4.png)


    > “ You are likely to be storing valuable data on your MySQL server, so you should
    ensure that you make regular backups ”


    # Securing your installation


    There are simple steps you can take to help secure your LAMP environment. For
    example, you can disable directory listing on your server by including the `<Directory>
    Options -Indexes +Directory</Directory>` directive in your Apache config. You
    should also set the ServerTokens Prod and ServerSignature Off directives to avoid
    potential hackers learning about your server''s version/configuration. In the
    same way, add `expose_php = Off` in your PHP config to keep its version hidden.
    It''s a good idea to disable unused Apache and PHP modules too, and you can disable
    potentially dangerous PHP functions with:


    ```

    disable_functions

    =exec,shell_exec,

    passthru,system,

    popen, curl_exec,

    curl_multi_exec,

    popen, tmp_file,

    show_source,

    proc_open,pcntl_exec

    ```


    …in your config.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Tutorial


    # Firejail


    # # Sandbox applications with Firejail


    Run a potentially insecure application in a sandbox to protect your system and
    data


    ![](img/6866071e033820549b214c239744aaa0_41_0.png)


    **Nitish Tiwari** is a software developer by profession, with a huge interest
    in free and open source software. As well as serving as community moderator and
    author for leading FOSS publications, he helps organisations adopt open source
    software for their business needs.


    The internet is the biggest source of knowledge out there and is widely used to
    share information, but it is also the biggest source of malware, spyware and several
    other types of viruses. This makes the internet a very interesting, yet difficult
    place to be in. You need to be careful of unverified (and sometimes even verified)
    software that you download from the internet, the sites you visit, the email attachments
    you open and so on. This can be difficult to do for anyone, whether they are from
    a technical background or not.


    While nothing can replace being alert to the dangers to system security, there
    are tools that can help you sandbox the applications you run. This way you can
    be sure that an application downloaded from the internet does just what it is
    supposed to do. Here, we will introduce you to Firejail. It is a simple tool to
    help you restrict the running environment of untrusted applications using Linux
    namespaces.


    Firejail allows a process and all its descendants to have their own private view
    of the globally shared kernel resources, such as the network stack, process table
    and mount table. Firejail is written in C with virtually no dependencies, and
    the software runs on any Linux computer with a 3.x kernel version or newer. It
    can sandbox any type of process: servers, graphical applications and even user
    login sessions. Please note that we have taken Ubuntu 16.04 as our host system
    for this tutorial.


    # ## Resources


    Firejail

    firejail.wordpress.com


    # ### 01 Installation


    Prebuilt Firejail packages are available for all the popular OS distributions
    – like Debian, Ubuntu, Linux Mint, Fedora, openSUSE, CentOS 7 and RHEL 7 – from
    their website. Note that these packages require a 64-bit system. Firejail is available
    in the AUR for Arch Linux and you can find packages for Slackware from the SlackBuilds
    repository. To install Firejail on Ubuntu, execute this command in a terminal:


    ```

    ```

    $ sudo apt-get install firejail

    ```

    ```


    If prompted, type Y for installation to continue. Now you are ready to jail your
    applications using Firejail.


    You can also install Firejail from the source code. First, download the archive
    and extract the files with:


    ```

    ```

    $ tar -xvjf firejail-X.Y.Z.tar.bz2

    ```

    ```


    Or using:


    ```

    ```

    $ tar -xJvf firejail-X.Y.Z.tar.xz

    ```

    ```


    Then compile and install:


    ```

    ```

    $ cd firejail-X.Y.Z

    $ ./configure && make && sudo make install-strip

    ```

    ```


    To install in Debian and Mint, download the DEB package and install it with:


    ```

    ```

    $ sudo dpkg -i firejail_X.Y_1_amd64.deb

    ```

    ```


    Or using:


    ```

    ```

    $ sudo dpkg -i firejail_X.Y_1_i386.deb

    ```

    ```


    For Fedora, openSUSE and CentOS 7, download the RPM package and install it:


    ```

    ```

    $ sudo rpm -i firejail_X.Y-Z_x86_64.rpm

    ```

    ```


    ![](img/6866071e033820549b214c239744aaa0_41_1.png)


    # ### 02 Using Firejail


    All types of programs – GUI or CLI based – work well with Firejail. So, you can
    be confident while opening any untrusted program. To jail a program in the system,
    start with prefixing ‘firejail’ to it. The general command format is:


    ```

    ```

    $ firejail [options] program_and_arguments

    ```

    ```


    For example, if you want to run Firefox, execute:


    ```

    ```

    $ firejail firefox

    ```

    ```


    If you want to hide all the files in your home directory from sandboxed programs,
    execute the firejail command in private mode:


    ```

    ```

    $ firejail --private program_and_arguments

    ```

    ```


    Until the sandbox runs, Firejail mounts a temporary file system on top of the
    *$HOME/user* directory. Any files created in this directory will be deleted once
    the sandbox


    ![](img/6866071e033820549b214c239744aaa0_41_2.png)


    **Right** Applications sandboxed in Firejail; the window on the right side displays
    the processes running in a sandbox'
  merge: -1
  img_proc: true
- pgno: 42
  md: "![](img/6866071e033820549b214c239744aaa0_42_0.png)\n\nexits. To use the existing\
    \ directory as the home directory for your sandbox instead and have a persistent\
    \ sandbox on home, execute:\n\n```\n$ firejail /etc/init.d/apache2 start\n```\n\
    \nTo start servers in Firejail you will need root permission for it. To start\
    \ Apache server, execute:\n\n```\n$ firejail /etc/init.d/apache2 start\n```\n\n\
    Note that if you execute Firejail without any arguments, it starts the regular\
    \ /bin/bash shell. Only the Bash session and its descendants are visible inside\
    \ the sandbox.\n\n![](img/6866071e033820549b214c239744aaa0_42_1.png)\n\n# 03 Using\
    \ Firejail, continued\n\nTo view the list of running sandboxes, use the following\
    \ command:\n\n```\n$ firejail --list\n```\n\nYou will see the list in the format\
    \ PID:username:command. To view the process tree within each sandbox, type:\n\n\
    ```\n$ firejail --tree\n```\n\nIf you want to join an already running sandbox,\
    \ obtain the PID of the sandbox using the --list option. Then pass this PID into\
    \ the following command:\n\n> If you execute Firejail without any arguments, it\
    \ starts the regular /bin/bash shell. Only the Bash session and its descendants\
    \ are visible inside the sandbox [19]\n\n```\n$ firejail --join=3974\n```\n\n\
    If you are starting Firefox in Firejail and you want a browser-specific iptables\
    \ filter, execute:\n\n```\n$ firejail --net=eth0 firefox\n```\n\nThis creates\
    \ a new TCP/IP stack for the Firefox session, assigns an IP address, and installs\
    \ a browser-specific iptables filter. If the program you are starting in Firejail\
    \ doesn't need network access, execute:\n\n```\n$ firejail --net=none vlc\n```\n\
    \nControl the amount of data that flows into and out of sandboxes:\n\n```\n$ firejail\
    \ --name=browser --net=eth0 firefox & \n$ firejail --bandwidth=browser set eth0\
    \ 70 30\n```\n\nThis example sets a bandwidth of 70 kilobytes per second on the\
    \ receive side and a bandwidth of 30 kilobytes per second on the transmit side.\
    \ You can change this at runtime and clear them as well, using:\n\n```\n$ firejail\
    \ --bandwidth=browser clear eth0\n```\n\n![](img/6866071e033820549b214c239744aaa0_42_2.png)\n\
    \n# 04 Firetools\n\nFiretools is the GUI for Firejail. It is distributed as a\
    \ separate package and is built using Qt4/Qt5 libraries. It has a sandbox launcher\
    \ option with the system tray, sandbox editing, management and statistics. It\
    \ isn't in standard repositories, but an official DEB is available. Download the\
    \ relevant Firetools DEB file, then navigate to the folder where the file is downloaded\
    \ and execute:\n\n```\n$ sudo dpkg -i firetools*.deb\n```\n\nThis installs Firetools.\
    \ However, in case of a dependency issue, resolve it using:\n\n```\n$ sudo apt-get\
    \ install -f\n```\n\nStart it using:\n\n```\n$ firetools &\n```\n\n# Network setup\
    \ for sandbox applications\n\nNetwork connection to a sandbox application can\
    \ be direct or routed. In a direct setup, a sandbox is connected to the network\
    \ using the kernel MAC VLAN device; in a routed setup, it uses the bridge device.\
    \ A direct setup looks like this:\n\n```\n$ firejail \n--net=eth0 \nfirefox\n\
    ```\n\nIn a routed setup, first set up the bridge and then pass the bridge name\
    \ with the --net parameter in the above command."
