  md: '![](img/6866071e033820549b214c239744aaa0_90_0.png)


    > > There’s a real sense of improvement within every update, and it’s even more
    noticeable now.


    The environment being upgraded to its 1.17.0 version. As you’d expect, it’s a
    pleasure to use throughout and MATE will always be one of the very best desktop
    environments to use for limited computers.


    Another highlight of Arya has been its long-standing package management system,
    Alps. There’s a lot to love about Alps in Arya 2017, which can now be used to
    build packages via either the source URL or tarball. Not only does this work like
    a charm, but the fact that all package updates can also be done through Alps as
    well is a big bonus on top of that. One caveat is Alps’ new script for picking
    up build scripts directly from GitHub: we had some real problems getting this
    to function on our machine.


    Build scripts are also getting a big boost here, to the delight of developers
    around the world. They can now be used to create ISO files and make stage-wise
    backups whenever necessary, while it’s actually possible to use these scripts
    to help develop KDE and GNOME desktop environments from source code. We’re especially
    intrigued to see how this feature develops, as it was very rough around the edges
    when we went hands-on with it.


    Going back across to the desktop side of things, Arya again tailors its chosen
    bundled software to low-powered machines. LibreOffice has been updated to version
    5.2.3, while the Parole Media Player and Exaile take centre stage when it comes
    to media playback. These are two decent choices in their fields, but there are
    better alternatives to download and they aren’t best suited for under-powered
    units.


    Despite finding a lot of good with AryaLinux 2017, we were slightly disappointed
    to learn that the distribution will only be released in 64-bit ISO going forward.
    It’s a blow to those relying on 32-bit ISO downloads, and as of yet, there’s been
    no communication about the decision to leave behind the 32-bit. It’ll certainly
    leave some users unhappy, but we’re sure there’s a reasonable explanation behind
    it.


    Looking past the 32-bit conundrum, there’s a lot to love about what AryaLinux
    brings to the table. There’s a real sense of improvement within every update,
    and it’s even more noticeable now. Tailoring the distribution is something that
    every low-resource machine needs, and while the process tends to be difficult,
    Arya strips it back and oozes simplicity throughout. When you then throw in Alps,
    which we honestly reckon is one of the best package management systems going,
    Arya is a winner in our eyes.


    Oliver Hill


    # Pros


    A pleasure to use throughout, and Alps is a particular highlight when it comes
    to package management.


    # Cons


    Certain features still have kinks to ironed out, and the lack of 32-bit compatibility
    is a real shame.


    # Summary


    Choices are limited for those with a low-powered machine, and while Puppy is certainly
    still the best of the distros that cater for these, AryaLinux does bring something
    new to the table. Big improvements have been made throughout, and while it’s far
    from perfect, it is a great platform for both casual users and budding developers
    alike.


    8'
