    \ 2]\n[ 3]\n...\n```\n\n```\n... root... 4096 Dec 21 03:18 /usr/bin/ls\n... root...\
    \ 4096 Dec 21 03:18 /usr/bin/cat\n```\n```\n\n# 05 Container lifecycles\n\nThe\
    \ `run` command is used to create a runc Container. It handles the creation, start\
    \ and deletion of the container. First, create a container ID:\n\n```\n```\n$\
    \ cd /tmp/myapp\n$ runc create containerId\n```\n```\n\nNow create the container:\n\
    \n```\n```\n$ runc run containerId\n```\n```\n\nView the list of created containers:\n\
    \n```\n```\n$ runc list\n```\n```\n\nTo start the process inside the container:\n\
    \n```\n```\n$ runc start containerId\n```\n```\n\nTo delete the container on exit,\
    \ execute:\n\n```\n```\n$ runc delete mycontainerId\n```\n```\n\nThis allows higher-level\
    \ systems to manage runc. This is used to set up the network stack of the container\
    \ between create and start.\n\n# 06 Systemd integration\n\nrunc does not daemonise\
    \ to manage containers. Since it launches directly from the command-line interface,\
    \ so it integrates with init systems like systemd. For example, the systemd unit\
    \ file could be something like:\n\n```\n```\n$ vi myapp-unit-file\n[Unit]\nDescription=Start\
    \ My Container\n\n[Service]\nType=forking\nExecStart=/usr/local/sbin/runc run\
    \ -d --pid-file /run/containerId.pid\ndelete containerId\nWorkingDirectory=/tmp/myapp\n\
    PIDFile=/run/containerId.pid\n\n[Install]\nWantedBy=multi-user.target\n```\n```\n\
    \nIt can also be used with other init systems and process supervisors to ensure\
    \ that containers are restarted when they exit.\n\n# 07 Uninstalling runc\n\n\
    If you want to uninstall runc from your system, execute:\n\n```\n```\n$ sudo apt-get\
    \ remove runc\n```\n```\n\nIf you want to remove runc packages along with their\
    \ dependencies, execute:\n\n```\n```\n$ sudo apt-get remove --auto-remove runc\n\
    ```\n```\n\nTo completely remove runc with all of its configuration files and\
    \ data, execute:\n\n```\n```\n$ sudo apt-get purge runc\n```\n```\n\nOr use:\n\
    \n```\n```\n$ sudo apt-get purge --auto-remove runc\n```\n```\n\nThese commands\
    \ remove all configuration files and data associated with the runc package. They\
    \ cannot be recovered, so only use them if you are very sure!\n\n# 08 runc versus\
    \ Docker\n\nDocker uses technologies like Linux, Go, bnc,aufs, fuse, iptables,\
    \ VirtualBox, vixlan, mesos, etc., and consul and systemd. Although these components\
    \ are reusable, they make Docker complex. runc is a lightweight, portable container\
    \ runtime. It does not depend on the rest of the Docker platform. Although runc\
    \ takes help from Docker to create a root file system, Docker and runc both support\
    \ portability, ubiquity and scalability. runc can be used as part of a Docker\
    \ deployment or standalone distribution.\n\n# 09 runc vs rkt\n\nrunc and rkt are\
    \ both implementations of the Open Container Initiative specification. Low-level\
    \ details of the host operating system and configuration are required in runc,\
    \ whereas rkt does not expect the user to understand the low-level details of\
    \ the host operating system. Neither has centralised daemons, so they both integrate\
    \ with init systems like systemd. runc requires container images to be downloaded\
    \ or cryptographically verified separately. rkt can download Docker images as\
    \ well as App Container images.\n\n> > runc is designed for security and scalability\
    \ and is independent of the rest of the Docker platform"
