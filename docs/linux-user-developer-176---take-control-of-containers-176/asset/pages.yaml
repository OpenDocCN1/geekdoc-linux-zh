    Note: The expiration time is set to 30 days by default.


    # 07 Reduce your bandwidth use with CDN


    Use of a CDN (content delivery network) can help reduce the risk of paying excess
    bandwidth costs from a server provider, as well as improve performance when a
    site is accessed across the world. Our favourite CDN is Cloudflare (cloudflare.com),
    which will host your static content in its vast network of data centres, reducing
    load on your main server. The best bit? The standard Cloudflare plan is completely
    free. Cloudflare is also an alternative way to deploy SSL, should you have any
    problems with Let’s Encrypt.


