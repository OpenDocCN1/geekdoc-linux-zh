- pgno: 34
  md: '# Deploy, non-stop!


    Our source blob is not specific to any architecture: it is suitable to compile
    products for any and every type of device supported by OpenWRT. Our next job involves
    the creation of a custom configuration for the OpenWRT target device we want to
    use.


    The actual customisation progress can be handled by one of three different configuration
    utilities. This example will use the menuconfig tool, which old hands of the Linux
    world should already know from compiling kernels for the desktop. Getting started
    with it involves entering the following command, which will make OpenWRT start
    the preparation process:


    ```

    camhane@TAMM1414:~/workspace/openwrt$ make menuconfig

    ```


    After about three or four minutes, a window similar to that shown in Figure 1
    pops up.


    ![](img/6866071e033820549b214c239744aaa0_34_0.png)


    Above Any similarities to SlackWare''s installation are purely coincidental


    The up and down arrow keys allow you to move the selection; pushing Enter allows
    you activate the option highlighted at the very bottom of the screen. First, select
    the target system option and set it to BCM27xx.


    In the next step, the line below it will allow you to select the exact processor
    type. The correct value depends on the SoC found in your Raspberry Pi – the table
    below provides an overview.


    | Processor type | Board types |

    |----------------|-------------------------------------------|

    | BCM2708        | Raspberry Pi Model B |

    |                | Raspberry Pi Model B+ |

    |                | Raspberry Pi Compute Module |

    | BCM2709        | Raspberry Pi 2 Model B |

    | BCM2710        | Raspberry Pi 3 Model B |


    Fortunately, selecting the wrong value is not particularly difficult – if you
    pick the wrong type, your target board will not be shown in the target profile
    selection. When target system, subtarget and target profile have all been set
    up correctly, use the side keys to enable the Save option and press Enter. For
    the following steps, we assume that the file has been stored as .config. The output
    of the


    menuconfig tool will prompt you to run Make – but we’re not quite there yet:


    ```

    camhane@TAMM1414:~/workspace/openwrt$ make

    ```


    ```

    *** End of the configuration. *** Execute ''make'' to start the build or try ''make
    help''.

    ```


    The OpenWRT team, furthermore, suggests that the defconfig command should be run
    before invoking the actual compile process:


    ```

    camhane@TAMM1414:~/workspace/openwrt$ make defconfig

    # # configuration written to .config

    ```


    The defconfig tool uses the information found in the .config file, which specifies
    the target architecture. It is then expanded with a few default parameters, leading
    to a ‘sensible basic configuration’.


    In the next step, simply enter make to start the compile process. Owners of multicore
    systems would be well advised to pass in the -j3 parameter, which informs the
    Make utility that more than one core should be used.


    In that case, however, be aware that the utilisation reached is likely to be relatively
    low – OpenWRT’s compile process is not nearly as parallelised as the one found
    in systems like VxWorks.


    With that out of the way, it is time to give your workstation a few minutes’ worth
    of time: our octa-core took about one hour to compile.


    When done, the results are presented in the /bin folder. Careful observers will
    note that the path name of the binary folder does not match the one expected –
    the Raspberry Pi 3 uses a BCM2710 processor.


    ```

    camhane@TAMM1414:~/workspace/openwrt$ ls

    md5sums           packages

    openwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img sha256sums

    openwrt-BCM2708-bcm2710-rpi-3-ext4-sdcard.img.gz

    ```


    > “ The amount of software available to our OpenWRT build is limited only by our
    imagination and the memory of the target device ”


    ■ Beware of compile errors The OpenWRT team explicitly warns developers that multidress
    compile errors can have odd problems. If you compare process fails for inexplicable
    reasons, moving make -O1 -j3 can be a nice alternative. Further information on
    this topic can be found at https://lxi/2s2DF.'
