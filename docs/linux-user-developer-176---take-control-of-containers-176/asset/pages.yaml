  md: '# Open Source


    On the disc


    # # On your free DVD this issue


    Find out what''s on your free disc


    **Welcome to the Linux User & Developer DVD.** This issue, discover some of the
    essential tools you need to take control of containers. From must-have FOSS like
    Docker to lightweight distros designed to


    help you work with containers or run on minimal and bare-metal systems, you''ll
    find everything you need to get started. You can even create and manage containers
    on Windows-based systems too!


    # ## Featured software:


    ![](img/6866071e033820549b214c239744aaa0_5_0.png)


    # ### Docker


    Docker containers wrap a piece of software in a complete filesystem that contains
    everything needed to run: code, runtime, system tools, system libraries – anything
    that can be installed on a server. Find out more about how you can use Docker
    and take advantage of its complete containerisation package in our complete guide
    on p18.


    ![](img/6866071e033820549b214c239744aaa0_5_1.png)


    # ### rkt by CoreOS


    rkt is the next-generation container manager for Linux clusters. Designed for
    security, simplicity, and compatibility within modern cluster architectures, rkt
    discovers, verifies, fetches, and executes application containers with pluggable
    isolation. This means that you can containerise individual apps and everything
    that''s needed to run them.


    ![](img/6866071e033820549b214c239744aaa0_5_2.png)


    # ### Docker Toolbox


    Containers aren''t limited to the Linux side of your system! The Docker Toolbox
    is an installer to quickly and easily install and set up a Docker environment
    on your computer. This is the Windows version. Using the Docker Toolbox, you''ll
    be able to set up specialist containerisation distros and environments to run
    on a Windows machine.


    ![](img/6866071e033820549b214c239744aaa0_5_3.png)


    # ### Load DVD


    To access software and tutorial files, simply insert this disc into your computer
    and double-click the icon.


    # ### Live boot


    To live-boot into the distros supplied on this disc, insert the disc into your
    disc drive and reboot your computer.


    # ### Please note:


    +   - You will need to ensure that your computer is set up to boot from disc (press
    F8 on your computer''s BIOS screen to change Boot Options).

    +   - Some computers require you to press a key to enable booting from disc –
    check your manual or the manufacturer''s website to find out if this is the case
    on your PC.

    +   - Live-booting distros are read from the disc; they will not be installed
    permanently on your computer unless you choose to do so.


    # ### For best results:


    This disc has been optimised for modern browsers capable of rendering recent updates
    to the HTML and CSS standards. So to get the best experience we recommend you
    use:

    - Internet Explorer 8 or higher

    - Firefox 3 or higher

    - Safari 4 or higher

    - Chrome 5 or higher


    # ### Problems with the disc?


    Send us an email at linuxuser@imagine-publishing.co.uk. Please note however that
    if you are having problems using the software or resources provided, then please
    contact the relevant software companies.'
