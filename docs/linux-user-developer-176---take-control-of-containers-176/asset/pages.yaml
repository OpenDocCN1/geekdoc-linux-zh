    When you run it in swarm mode, you orchestrate services”


    This means you can create a file using the Docker Compose format and use it to
    deploy services in swarm mode. Not only does this ease the deployment process,
    it also makes it possible to easily pass along swarm service definitions.


    ![](img/6866071e033820549b214c239744aaa0_28_0.png)


    ```

    hosted-docker-dashboard swamd running pool "localhost-swarm-new" master-manager:1
    ... (text too small to extract accurately, appears to be terminal output for swarm
    init)

