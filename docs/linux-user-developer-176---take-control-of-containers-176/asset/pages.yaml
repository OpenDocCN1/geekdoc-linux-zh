- pgno: 61
  md: '# # TWEAKS AND IMPROVEMENTS


    Linux is almost infinitely tunable to your specific needs, but there are a few
    key things you''re going to want to do


    ![](img/6866071e033820549b214c239744aaa0_61_0.png)


    Above The Unity tweak tool provides an easy way to toggle some normally hidden
    Unity settings


    # ## 15 BATTERY LIFE IS WORSE THAN WINDOWS


    It''s a sad reality that battery life on a portable device running Linux is often
    worse than the same machine running on Windows. This is largely down to the fact
    that manufacturer will have made specific battery optimisations for the device
    / OS combo, the drivers being more mature. One secret weapon to help you mitigate
    this situation, however, is TLP. TLP brings you the benefits of advanced power
    management for Linux without the need to understand every technical detail. TLP
    comes with a default configuration that is already optimised for battery life,
    so you can just install and forget, although it is highly customisable to fulfil
    your specific requirements if preferred. After installation (TLP is in most distribution
    repos), it can be started with:


    ```

    ```bash

    sudo tlp start

    ```

    ```


    Then use:


    ```

    ```bash

    sudo tlp-stat -s

    ```

    ```


    ...to check the system is working properly.


    # ## 16 I WANT A ''DESKTOP'' SHORTCUT


    Sometimes it''s the little things that make the difference and this is a great
    example - you won''t believe how useful it is to have a ''Desktop'' shortcut on
    your launcher. Even better, it''s typically nice and simple to enable. The exact
    steps depend on the distribution you are using, but using Ubuntu with Unity as
    an example, simply install the unity-tweak-tool, navigate to the Launcher section
    and toggle the Show Desktop icon setting. The icon should appear straight away.
    The app has a host of other useful tweaks too!


    # ## 17 I''M MISSING SOME IMPORTANT FONTS


    If you are loading documents you''ve received from others, you may notice you''re
    missing some fonts that are installed by default on a Windows PC. Luckily, there''s
    an easy fix. Simply install the ttf-mscorefonts-installer package and your system
    will be updated with Andale Mono, Arial, Comic Sans MS (yeah), Courier New, Georgia,
    Impact, Times New Roman, Trebuchet, Verdana and Webdings. As this is a basic set
    of fonts, you will still be missing some Clementype fonts such as Calibri and
    Cambria. Unfortunately, these are not officially available for Linux.


    # ## 18 THE STOCK THEME IS KINDA UGLY


    Although things are much better than they used to be, Linux''s graphical interfaces
    still aren''t the most beautiful things out of the box, even on the Ubuntu flagship
    distribution running Unity. That''s the bad news - the good news is that most
    distros are easily theme-able. Try this as a nice simple way to make your Ubuntu
    machine look a lot slicker than before. Install unity-tweak-tool. Download the
    Adapta-gtk-theme from [github.com/adapta-project/adapta-gtk-theme](https://github.com/adapta-project/adapta-gtk-theme).
    Then download the paper icons from [snwh.org/paper](https://snwh.org/paper). Use
    the tweak tool to enable both. Now, doesn''t that look like a whole different
    OS? Beautiful.


    62'
