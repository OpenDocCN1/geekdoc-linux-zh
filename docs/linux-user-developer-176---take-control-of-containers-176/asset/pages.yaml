    +   - MySQL tuner mysqltuner.pl

    +   - Apache2tuner apache2tbuddy.p/

    +   - Percona percona.com


    ![](img/6866071e033820549b214c239744aaa0_37_2.png)


    # Download Ubuntu Server


    +   - Ubuntu Server 16.04.1 LTS

    +     The latest LTS release comes with the latest kernel, including the include
    a release of the desktop and has a 5 year support from Canonical.

