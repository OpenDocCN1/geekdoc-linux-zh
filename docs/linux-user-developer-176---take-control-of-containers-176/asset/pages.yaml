  md: "![](img/6866071e033820549b214c239744aaa0_30_0.png)\n\n# ## 03 DC/OS installation\n\
    \nDC/OS can be installed in the environment of your choice by using a customised\
    \ setup file or cloud templates. There are detailed instruction steps available\
    \ for all the major cloud infrastructure providers. You can also use Vagrant to\
    \ create a cluster of virtual machines on your local machine that can be used\
    \ for demos, development and testing with DC/OS.\n\n# ## 04 Mesos executor and\
    \ scheduler\n\nMesos schedulers define new Mesos tasks and assign resources to\
    \ them (placing them on specific nodes). A scheduler receives resource offers\
    \ describing CPU, RAM, etc, and allocates them for discrete tasks that can be\
    \ launched by Mesos agents via executors.\n\nExecutor processes are launched and\
    \ managed by Mesos agents on the agent nodes. Mesos tasks are defined by their\
    \ scheduler to be run by a specific executor (or the default executor). Each executor\
    \ runs in its own container.\n\n![](img/6866071e033820549b214c239744aaa0_30_1.png)\n\
    \n# ## 05 Marathon\n\nMarathon is a production-grade container orchestration platform\
    \ for DC/OS. It is a core component of DC/OS and is the first framework to be\
    \ bootstrapped once a DC/OS cluster is up. This is because Marathon also runs\
    \ other Mesos frameworks.\n\nMarathon supports both Mesos containers (using groups)\
    \ and Docker. You can also run Stateful apps by binding persistent storage volumes\
    \ to your application. This means databases like MySQL, Postgres and object stores\
    \ like Minio can easily be deployed on DC/OS, and have storage accounted for by\
    \ the underlying platform.\n\n# ## 06 Chronos\n\nChronos is a Mesos scheduler\
    \ for running schedule- and dependency-based jobs.\n\n![](img/6866071e033820549b214c239744aaa0_30_2.png)\n\
    \nYou can think of Chronos as a replacement for cron. It is a distributed and\
    \ fault-tolerant scheduler that runs on top of Apache Mesos that can be used for\
    \ job orchestration. Jobs scheduled with Chronos are configured with ISO8601-based\
    \ schedules with repeating intervals. Typically, a job is scheduled to run indefinitely,\
    \ such as once per day or per hour. Dependent jobs may have multiple parents,\
    \ and will be triggered once all parents have been successfully invoked at least\
    \ once since the last invocation of the dependent job.\n\n# ## 07 Applications\n\
    \nA real-world application like WordPress, Jenkins or any other such application\
    \ can be deployed on DC/OS as a Marathon application. An application is generally\
    \ a long-running service, with many instances running on multiple hosts. Each\
    \ application instance is called a task. An application definition describes everything\
    \ needed to start and maintain the tasks. We'll see how to write an application\
    \ definition in the following step.\n\n# ## 08 Application configuration\n\nApplications\
    \ can be defined as JSON files in DC/OS. Let us take an example of a trivial application\
    \ that prints the phrase ‘Hello Marathon'. Create a JSON file and add the following\
    \ details to it:\n\n```\n```\n{\n  \"id\": \"basic-0\",\n  \"cmd\": \"while [\
    \ true ] ; do echo 'Hello Marathon' ; sleep 5 ; done\",\n  \"cpus\": 0.1,\n  \"\
    mem\": 10.0,\n  \"instances\": 1\n}\n```\n```\n\nThe example above is the command\
    \ that gets executed. Its value is wrapped by the underlying Mesos executor via\
    \ /bin/sh -c $(cmd). Then you can add the service to DC/OS:\n\n```\n```bash\n\
    $ dos marathon app add <your-service-name>.json\n```\n```\n\nOnce this is done,\
    \ Marathon hands over execution to Mesos. Mesos creates a sandbox directory for\
    \ each task. The sandbox directory is a directory on each agent node that acts\
    \ as an execution environment and contains relevant log files.\n\n# ## 09 Using\
    \ resources in applications\n\nTo run non-trivial applications that need resources\
    \ like files, Marathon has the concept of URIs (uniform resource identifiers).\
    \ URIs use the Mesos fetcher to do the legwork in terms of downloading (and potentially)\
    \ extracting resources.\n\n```\n```json\n{\n  \"id\": \"basic-1\",\n  \"cmd\"\
    : \"chmod u+x cool-script.sh && \"cool-script.sh\",\n  \"cpus\": 0.1,\n  \"mem\"\
    : 10.0,\n  \"instances\": 1,\n  \"uris\": [ \"http://example.com/app/cool-script.sh\"\
    \ ]\n}\n```\n```\n\nThe example above executes the command, downloads the cool-script.sh\
    \ resource (via Mesos) and makes it available in the service instance's Mesos\
    \ sandbox. It's straightforward to run applications that use Docker images, so\
    \ why not put it to the test? For example, this is how to create a simple Docker\
    \ app in DC/OS:\n\n```\n```json\n{\n  \"id\": \"basic-3\",\n  \"cmd\": \"python3\
    \ -m http.server 8080\",\n  \"cpus\": 0.5,\n  \"mem\": 32.0,\n  \"container\"\
    : {\n    \"type\": \"DOCKER\",\n    \"docker\": {\n      \"image\": \"python:3\"\
    ,\n      \"network\": \"BRIDGE\",\n      \"portMappings\": [\n        { \"containerPort\"\
    : 8080, \"hostPort\": 0 }\n      ]\n    }\n  }\n}\n```\n```"
  merge: -1
