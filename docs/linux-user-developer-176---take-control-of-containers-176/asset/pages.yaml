- pgno: 44
  md: "# $ firejail firefox\n\nA single instance of Firefox can have multiple browser\
    \ windows. So, if Firefox is running already and you want to start a new session\
    \ within Firejail, execute:\n\n# $ firejail firefox --no-remote\n\nFirefox is\
    \ allowed only a small set of files and directories by the sandbox. Log messages\
    \ are sent to syslog if Firefox tries to access blacklisted files. The security\
    \ filters enabled by default reduce the attack surface of the kernel. The seccomp\
    \ filter is generally used by default. If you don't trust the add-ons and plug-ins\
    \ installed in your browser, use the **--private** option and configure the DNS\
    \ at sandbox level. This prevents attacks from reconfiguring DNS.\n\n# $ firejail\
    \ --private --dns=8.8.8.8 --dns=8.8.4.4 firefox --no-remote\n\nTo create a new\
    \ TCP/IP stack, connect to your Ethernet network and give an explicit IP address:\n\
    \n# $ firejail --net=eth0 --ip=192.168.1.207 firefox\n\nFirejail replaces the\
    \ regular X11 server with an Xpra or Xephyr server, preventing X11 keyboard loggers\
    \ and screenshot utilities from accessing the main X11 server.\n\n# $ firejail\
    \ --x11 --net=eth0 firefox\n\n# 09 Seccomp filter\n\nFirejail uses Seccomp-bpf\
    \ by default. It stands for *secure computing mode*, which is expressed in Berkeley\
    \ Packet Filter (BPF) format. Build a whitelist seccomp filter and attach it to\
    \ a user program using the Firejail sandbox. Firejail needs the syscalls details\
    \ for seccomp filter. We used strace for getting syscalls. Let's take VLC media\
    \ player as an example:\n\n# $ strace -qc vlc\n\nThis opens VLC; once you close\
    \ it, strace prints the syscall list. Copy the list of all syscalls into a text\
    \ editor and make them comma-separated without any space in between. Now use this\
    \ comma-separated syscall string in **--seccomp**. Keep the values below:\n\n\
    # $ firejail --shell=none --seccomp. keep=poll,futex[,] vlc\n\nThe command looks\
    \ lengthy, but make sure all the syscalls are included. In case of error, add\
    \ the missed syscall. Now create a whitelist profile in **/etc/firejail**. Copy\
    \ the default VLC profile here and add the two lines below to it:\n\n```\nShell\n\
    none\nseccomp keep poll,futex,rt_sigreturn,stat,read,[...] \n```\n\nNote that\
    \ the dots denote the rest of the comma-separated syscall names.\n\n# 10 AppImage\
    \ support\n\nAppImage is a universal software packaging format developed by Simon\
    \ Peter.\nStart your AppImage application in Firejail using:\n\n# $ firejail --appimage=Firefox-50.1.0.g1ibc2.3.3-x86_64.AppImage\n\
    \nAll sandbox options are available, like **--private** or **--x11**. Suppose\
    \ you have downloaded Firefox from the AppImage project repository; to start the\
    \ sandbox, use:\n\n# $ firejail --appimage --private --net=eth0 --x11 ~/Downloads/Firefox-50.1.0.g1ibc2.3.3-x86_64.AppImage\n\
    \n**--appimage** is used to enter AppImage mode, **--private** creates an empty\
    \ home directory, **--net=eth0** creates new network namespace and **--x11** is\
    \ used for Xpra-based sandboxing.\nTo verify the security parameters, open Firetools\
    \ and click Firefox sandbox to get the stats. See that seccomp stats that it is\
    \ enabled and the capability field that is zero? These two parameters are most\
    \ important for a sandbox and everything else is built on top of them. If you\
    \ have more than one sandbox running, limit the bandwidth of each sandbox as follows:\n\
    \n# $ firejail --bandwidth=32119 set eth0 80 20\n\n\U0001F3A4 Firejail can attach\
    \ a new TCP/IP networking stack to the sandbox, which comes with its own routing\
    \ table, firewall and set of interfaces. This stack is independent of the host\
    \ network stack19\n\n# Firejail sandboxing for X11\n\nXpra and Xephyr are supported\
    \ in Firejail X11 sandboxing. Regular X11 is replaced by these X11 software packages:\n\
    \n# $ firejail -- x11=xpra -- net=eth0 program-and-arguments\n\n# $ firejail --\
    \ x11=xephyr -- net=eth0 program-and-arguments\n\nAnother option is to use:\n\n\
    # $ firejail -- x11 -- net=eth0 program-and-arguments\n\nThis way, Firejail first\
    \ tries Xpra and if not installed, it tries to find Xephyr. Note that it is Xpra\
    \ that is started as the root user. X11 sandboxing features are not supported."
  merge: -1
  img_proc: true
- pgno: 45
  md: "![](img/6866071e033820549b214c239744aaa0_45_0.png)\n\nMihalis Tsoukalos \n\
    \ is a UNIX administrator, a programmer (UNIX and iOS), a DBA and a mathematician.\
    \ He has been using Linux since 1993. You can reach him at @mactosouk (Twitter)\
    \ and his website: mtoukalos.eu\n\n# ## Program in Erlang: File I/O\n\nDiscover\
    \ how to work with file operations in Erlang\n\n# ### Resources\n\n+   - An installation\
    \ of Erlang\n+   - A text editor such as Emacs or vi\n\nNo programming language\
    \ can be considered important if it cannot deal with text and binary files, because\
    \ you can't develop practical system tools without reading data from existing\
    \ files or storing your data to files. As a result, the subject of this tutorial\
    \ will be the use of Erlang to process files and directories, which also includes\
    \ Erlang functions that allow you to find information about files.\n\nThe next\
    \ Erlang tutorial will talk about network programming in Erlang, which is also\
    \ a very significant and essential task, so keep reading and write as much Erlang\
    \ code as possible.\n\nThe next Erlang tutorial will talk about network programming\
    \ in Erlang, which is also a very significant and essential task, so keep reading\
    \ and write as much Erlang code as possible.\n\n# ### About file I/O\n\nFile operations\
    \ are a critical part of systems programming and as such they must be reliable\
    \ and fast; however, in this case reliable is more important than fast! A large\
    \ part of reliability comes from error-checking and error-reporting code, because\
    \ you cannot be sure what might fail and why.\n\nMost of the functions related\
    \ to file operations belong to the file module that gives you an interface to\
    \ the file system. The two most important Erlang functions of the file module\
    \ that are related to file input and output are file:read() and file:write().\n\
    \nThe first one is used for reading from an open file whereas the second is used\
    \ for writing to a file. The file:read() function takes two arguments: an open\
    \ file descriptor and the number of bytes you want to read. The file:write() function\
    \ also requires two arguments: the open file descriptor of the file you want to\
    \ write to and the data you want to write, respectively. As you will see, there\
    \ are easier ways to read a file.\n\nYou will also need two more functions in\
    \ order to open and close a file, which are open(File, Mode) and close(Device),\
    \ respectively. The file:open() function takes two arguments, which are the location\
    \ of the file you want to open and the mode in which you want to open the file.\
    \ A successful call to file:open() returns a tuple of type {ok, FD}. The first\
    \ element shows that the operation was successful and the second element is used\
    \ for referencing the open file afterwards.\n\nThe Mode part can have four values:\
    \ Read, Write, Append and Exclusive.\n\nErlang offers the file:read_file() function\
    \ that takes one argument, which is a filename, and stores its full contents all\
    \ at once into a variable. Although this function cannot fully replace file:read(),\
    \ it can be very handy from time to time!\n\n# ### Processing command-line arguments\n\
    \nThis section will illustrate how to read the command-line arguments of a program\
    \ in Erlang, which is a very significant task because most of the time you get\
    \ the names of the files you want to process as arguments. The Erlang code of\
    \ cmdArgs.erl is below.\n\nThe following interaction with Erlang shell will help\
    \ you clarify many things related to lists:\n\n```\n```\n-module(cmdArgs).\n-export([main/1]).\n\
    \nmain(Arg) \n  io:format(\"Printing arguments:~n\",[]),\n  lists:foreach(fun(Arg)->\
    \ io:format(\"Arg: \t~p~n\", [Arg]) end, Args).\n```\n```\n\nExecuting the main/0\
    \ function of cmdArgs.erl from the command line generates the following kind of\
    \ output:\n\n```\n```\n$ erlc cmdArgs.erl\n$ erl -noshell -s cmdArgs main 1 2\
    \ 3 4 five -s init stop\n\nPrinting arguments:\nArg: 1\nArg: two\nArg: 3\nArg:\
    \ 4\nArg: five\n```\n```"
