- pgno: 72
  md: '# # My Pi project


    # # Automate your indoor garden


    John Shovic''s indoor garden monitoring system is the perfect project for new
    and seasoned Pi makers alike


    ![](img/6866071e033820549b214c239744aaa0_72_0.png)


    **We’ve seen some pretty unique projects using the Pi, but the Smart Plant is
    entirely different. How did the concept come about?**


    The original SmartPlantPi idea came from a discussion in a local pub. We were
    brainstorming about what we could build with the amazing amount of environmental
    sensors out there (while staring at my beer) and I suggested that we build an
    automated plant-watering system for the Raspberry Pi. What made me think of that?
    I had been teaching a class at the local university, CS270 Systems Programming,
    in which I had Raspberry Pi computers for each student to take home and build
    projects.


    Linux can be an intimidating study when you are down in the command line studying
    the kernel and the multitasking system. I decided to have the students do what
    I call “Physical Computing”, which is where we build sensor-based projects, like
    a sunlight analyser, and then use LEDs and other devices for the Raspberry Pi
    to interact with the environment.


    **How long did it take you to go from concept to a fully made product? Did you
    encounter any issues during the build process?**


    The development of the SmartPlantPi kit took about three months from (the) start
    to the finish of the project and kit documentation. The big choice we made in
    the hardware design was the decision to go with the Grove connector system. The
    Grove system is a standard plug used to connect a variety of small computer devices
    together. All told, there are about 200 different Grove sensors out there, from
    a number of different manufacturers. All of the Grove connectors are the same
    size and have four wires but come in four flavours: FC, Digital, Analog and Serial.
    Going with an all-Grove design means there is absolutely no soldering required
    for SmartPlantPi, which makes the project much more accessible for all levels
    of makers.


    **For those who may be unaware of the SmartPlantPi, could you give them an overview
    of what the project is?**


    SmartPlantPi (or Smart Plant for short) is an introductory, easy-to-build Raspberry
    Pi-based environmental monitoring and plant watering system using advanced sensors
    to monitor the soil moisture, monitor the sunlight, watch the air quality and
    monitor temperature and humidity. It is designed to be easy and simply put together
    and tested with no soldering required. Smart Plant also comes with a USB-controlled
    pump, water flow sensor, plastic tubing for the water, and buttons for control.


    **Would you say the focus of this project is on education? Can adults benefit
    from it as well?**


    Well, everything we build for the maker market is designed for education and learning.
    Making is education. Making is learning. Building your own projects allows you
    to innovate around a framework and do wonderful things that we have never thought
    of.


    > “Making is learning. Building your own projects allows you to innovate”


    The educational goals for Smart Plant are:


    +   - Learn about the Raspberry Pi and installing software on the Pi

    +   - Connecting up sensors to the Raspberry Pi

    +   - Learning about feedback loops and regulating water to plants

    +   - Understand your indoor environment and what affects it

    +   - Learn about the new technology called the Internet of Things


    **What sort of role does the Raspberry Pi play here?**


    The Raspberry Pi is the key component of the system. It is the brain. We could
    have designed this using a much simpler computer, such as an Arduino, but we wanted
    to provide the power of the Pi and Linux to allow the Smart Plant to be connected
    up to the Internet of Things and Alexa. To do that, we needed computing power,
    and the


    Raspberry Pi provides all of that in a single inexpensive project.


    **We’ve seen mentions of multiple sensors being bundled in with the Smart Plant
    Pi, what do they bring to this project?**


    The sensor package provides a whole indoor environmental monitoring system. Temperature,
    Humidity, Sunlight, UV Index, and one very cool sensor: the Air Quality Sensor.
    We were amazed at how sensitive this inexpensive sensor was. We could detect all
    sorts of events in the entire house. One thing to point out is that virtually
    all of the time the sensor was under 3200 (rated fresh air) and the average was
    2727 across the entire period.


    **Are people able to track the progress of their plant at all?**


    Absolutely, there are a couple of ways. The first is with the built-in OLED display.
    It displays status and also flashes alarms when detected. Secondly, we can monitor
    your plant on the internet by using PubNub and Freeboard.io (a tutorial on how
    to do that is part of the SmartPlantPi documentation). Here is a live link to
    our demo plant: freeboard.io/board/BhKt4Y


    **How have you found working with the Raspberry Pi in this project? Would you
    use it for other projects in the future?**


    The Raspberry Pi in this project is the best and most capable platform for designing
    projects and prototyping products. We can build projects that can do amazing things
    and make use of the thousands of software packages and sensors available for the
    Raspberry Pi.


    **What is our next Raspberry Pi Kickstarter? We are building a board that will
    allow the maker to experiment with artificial intelligence on the Raspberry Pi
    with some neural network hardware assists. Can you just imagine what we can build
    with that? Technology doesn''t just have to be the domain of the technologists.
    We all can be part of this future. Learn. Make. Repeat.


    ![](img/6866071e033820549b214c239744aaa0_72_1.png)


    **John Shovic**

    has spent over 30 years in hardware engineering, and is a proud author of over
    50 papers, including coverage of Arduino and the Raspberry Pi.


    **Like it?**

    You can boost a pretty incredible portfolio of work, much of which he goes into
    detail in over on his site at switchdoc.com. Make sure you take a look at the
    site''s tutorial section, which is packed with tips and tricks for beginner and
    advanced Pi projects alike.


    **Further reading**

    The entire process of the SmartPlantPi is fairly complex, and if our brief overview
    here hasn''t enough, then make sure you head across to the switchdoc.com website
    where a full rundown is available.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Get hands on with the Pimoroni Blinkt!


    ![](img/6866071e033820549b214c239744aaa0_73_0.png)


    # Learn the basics and create sparkling lights with your Blinkt!


    **Dan Aldred** is a Raspberry Pi Certified Educator and a lead school teacher
    for CAS. He led the winning team of the Astro Pi secondary school contest and
    appeared in the DfE’s ‘inspiring teacher’ TV advert. Recently he graduated from
    Skyacademy, launching a Raspberry Pi attached to a high-altitude balloon to over
    31,000 metres into the stratosphere.


    Pimoroni has created an awesome ‘super-bright RGB LED indicator’ that is ideal
    for adding visual notifications to your Raspberry Pi without breaking the bank!
    The Blinkt! offers eight APA102 pixels in the smallest (and cheapest) form factor
    to plug straight into your Raspberry Pi 3/2/B+/A+/Zero. This tutorial walks you
    through how to install the Blinkt! and the required Python libraries and modules.
    Next, create and try out some simple code to control the lights and change the
    colours and the brightness of the LEDs. Finally, combine these skills together
    to code an LED colour generator that selects a random LED and a random RGB colour
    value for the range of eight lights. This creates a psychedelic disco-light setup.


    # What you’ll need


    Pimoroni Blinkt!


    ![](img/6866071e033820549b214c239744aaa0_73_1.png)


    ![](img/6866071e033820549b214c239744aaa0_73_2.png)


    # 01 Install the Blinkt!


    The guys at Pimoroni have made it very easy to install the software for your Blinkt!
    (which also includes a wide selection of cool examples to show off its features).
    To get started, ensure that the power is off, attach the Blinkt! to the Raspberry
    Pi’s GPIO pins and push down firmly. One side of it is straight and one is curved.
    The curved edges align with the curved corners of your Raspberry Pi. This ensures
    that you attach it the correct way round. Now attach your power supply and boot
    up your Pi. Open the Terminal and type:


    ```

    ```

    curl -sS get.pimoroni.com/blinkt | bash

    ```

    This will install all the required code.

    ```


    # 02 Turn on an LED


    To turn on an LED, open your Python editor and import the required Python module,
    line 1. Use the code `set_pixel()`, line 2, to set which pixels are turned on.
    The first number in the brackets corresponds to each LED. As with the common computing
    method of numbering, the first LED is referred to by the number zero, the second
    LED is number one and so on up to the eighth LED, number seven. Copy the code
    below and run the program to turn the first LED on.


    ```

    ```

    from blinkt import set_pixel, show

    set_pixel(0,255,0,0)  show()

    ```


    ```


    # 03 Change the colour of an LED


    The next three values in the brackets (x, 255, 210, 150), are used to control
    the colour of the LED with the standard RGB colour palette. You can control and
    set the amount of Red, Green and Blue between the values of 0 and 255; the higher
    the number, the more of that colour is displayed on the LED. Combining these values
    gives you over 16 million possible combinations and colours. Change the values
    in your code, save and then run.


    ```

    ```

    set_pixel(0,255,255,0) show()

    ```


    ```


    # 04 Adjust the brightness of the LEDs


    You may find that the LEDs are too bright to look at. It is not advisable to look
    at them for long periods as they may damage your eyes. Instead, turn down the
    brightness so that they can be viewed safely. First, import the brightness module,
    line 1. You can import multiple modules by including the ‘module name’ on the
    same line—for example, `from blinkt import set_pixel, show, set_brightness`. Now
    set the brightness to a suitable level, line 2. The values range between zero
    and one, where one is full brightness and zero renders all the LEDs off.


    # WHO IS USING THE INTERNET?


    Do you live in a household or work in an office where several people use the internet?
    Are there numerous devices always connected to the network that suck the bandwidth
    up and slow down the speed for all other users? Combine the Blinkt with Python
    and npm to identify users, track them on the network and create a colourful LED
    visual for each user as they join and leave the network. Watch the video here:
    youtu.be/r_JDw65FTMA'
