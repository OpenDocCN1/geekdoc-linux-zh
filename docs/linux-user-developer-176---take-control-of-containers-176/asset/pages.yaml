    ![](img/6866071e033820549b214c239744aaa0_14_1.png)


    ![](img/6866071e033820549b214c239744aaa0_14_2.png)


    Virtual Pins is a really simple yet incredibly powerful concept we invented. As
    I already mentioned, the Blynk app can control and read physical GPIOs without
    any additional code. However, there are cases when data should be processed on
    the device, or [an] additional library is required to read a specific sensor.


    For example, [what] if you need to read an I2C temperature sensor, convert the
    readings from Celsius to Fahrenheit and calculate the average temp per minute?
    First, this sensor is not attached to a specific analog input pin, secondly you
    might need a library that would read this particular sensor model, and then you
    would need to perform an averaging operation on board. This is where Virtual Pins
    come into play. They act as a channel to send any data from the hardware to the
    apps and vice versa. On the hardware side, you would push the processed temperature
    to, let’s say Virtual Pin 1. On the app side, you would add a Graph Widget and
    configure it to use the same Virtual Pin 1 and plot the incoming data easily.


    Or, imagine you need a single button in the app that will automate the process
    of dimming the lights, closing the window blinds, and turning on your TV. This
    button would send a command to Virtual Pin 2, and on the hardware side this command
    will trigger a function that will perform all the actions one by one. It gives
    a lot of flexibility to developers, because no matter what is connected to the
    hardware, it can be controlled or read from within the app.


