  md: '# # OpenSource


    Your source of Linux news & views


    # ## RASPBERRY PI


    # # Google is bringin AI to the Pi


    Experimenting with artificial intelligence is set to become a whole lot easier


    A bridge between Google and the Raspberry Pi Foundation is something fans have
    wanted for a while now, and recent developments have shown that the latest news
    to come from Google HQ may be the closest we''ve got to this partnership yet.


    The tech giant is looking to invest heavily in expanding on its existing suite
    of development tools that are currently available to Raspberry Pi developers.
    In turn, this will help better implementation of the Pi in Google-based projects,
    offering a range of new software tools for natural language processing, predictive
    analytics and sentiment analysis.


    To help scope out the landscape, Google is currently running a survey over on
    the Raspberry Pi Foundation''s website where users can leave their thoughts and
    suggestions on the idea. "We at Google are interested in creating smart tools
    for Makers, and want to hear from you about what


    ![](img/6866071e033820549b214c239744aaa0_9_0.png)


    Above: All-new Al tools could soon be a feature of the Pi


    would be most helpful," it says at the beginning of the survey. As well as all
    of the areas listed previously, the survey also outlines the other areas where
    Google is keen to work with the Pi. Areas like 3D printing, IoT development and
    drones have all been explored with the Pi, but with Google''s Al tools on board,
    who knows what users could possibly achieve?


    This partnership is big news, and it''s seen as a great way to accelerate the
    development of this field in the near future. It has previously invested a lot
    of time in the Pi, with Google gifting $1 million worth of microprocessors to
    UK schools back in 2013. Budding developers should head across to the Raspberry
    Pi Foundation site for more details.


    > > “We at Google are interested in creating smart tools for Makers, and want
    to hear from you”


    # ## SOFTWARE


    # # Getting Windows on Linux has never been easier


    Finding an accessible way to successfully run Windows apps on Linux was for a
    long time a pretty thankless task. WINE, however, looked to turn the whole process
    on its head. It offered users a relatively easy way to run the Windows API on
    top of a Linux-based OS. Early versions were ropey, with bugs galore and questionable
    stability at times. It also suffered from limited availability outside of Debian
    and Ubuntu-based distributions, but that has also thankfully changed.


    Thanks to a wave of interest in the community, the latest version of WINE, 2.0
    to be exact, is now available for download. At the core of the latest update are
    improvements to the stability of running thousands of Windows programs on your
    Linux desktop. There''s more than 60 key bug fixes, and improvements have been
    made to overall compatibility with some of the more obscure distros around. Arguably,
    the biggest update is the fact that Microsoft Office 2013 now has full


    WINE compatibility, providing an unrivalled document-creation service. It''s however,
    only one of the many new apps that up until now, would be out of reach for most
    Linux users. Early user feedback has shown there are still some issues with larger
    pieces of software, but that overall usability is vastly superior compared to
    earlier builds of the program. Initial binary packages for the likes of Debian,
    Mageia, Fedora and Ubuntu are all available for download, with further expansion
    planned in the next development cycle. The official WINE 2.0 source code can be
    downloaded over at www.winehq.com


    > > “Microsoft Office 2013 now has full WINE compatibility, providing an unrivalled
    document-creation service”


    10'
  merge: -1
  img_proc: true
