  md: '# INSTALLATION AND UPGRADE ISSUES


    Don’t fall at the first hurdle on your Linux adventure — overcome these common
    install or upgrade problems


    ![](img/6866071e033820549b214c239744aaa0_57_0.png)


    **Above** You need to make the ISO disk image bootable


    > One of the most common issues is disks being ‘invisible’ to Linux installers.
    Fortunately, there is an easy fix


    # 1 THE INSTALL MEDIA WON’T BOOT


    So you’ve downloaded Linux and either burned it to a CD/DVD or copied it to a
    USB stick. But it won’t boot. Not a good start. First up, ensure that if you’re
    using a CD/DVD, you’ve burned the actual ISO and not just copied the file. In
    the same way, if you’re using USB, you need to follow a guide on how to make the
    image bootable, not just copy it to a stick. If you’ve done this, the next thing
    you need to do is access the boot sequence menu on your machine. This is pretty
    well hidden away on modern machines and the sequence varies between manufacturers.
    Try the **Esc** key or F12 to display the selections.


    # 2 THE INSTALLER DOESN’T SEE MY HARD DISK


    Over recent years there have been a lot of changes to how PCs work, as we’ve moved
    from the BIOS era to the UEFI era. In addition, hard disks (and particularly SSDs)
    and how they communicate inside machines has progressed quickly. Many of these
    optimisations have been designed specifically for Windows, which can cause problems
    for Linux. One of the most common issues is disks being ‘invisible’ to Linux installers.
    Fortunately, there is an easy fix should you encounter this problem – in your
    computer’s settings, change the hard disk mode to AHCI/SATA. This is simple enough,
    but making this change will likely stop your Windows install from starting up
    if you are dual-booting. To fix this, start Windows as normal and use the command:


    ```

    bcdedit /set {current} safeboot minimal

    ```


    ...before changing the setting. Then, after making the change and completing the
    first boot, use:


    ```

    bcdedit /deletevalue {current} safeboot

    ```


    ...to get back up and running.'
