  md: '# Tutorial


    # LAMP stack


    # Configure a LAMP stack


    Deploy your own websites with ease on top of a Linux-Apache-MySQL-PHP stack


    ![](img/6866071e033820549b214c239744aaa0_37_0.png)


    +   Paul O''Brien is a professional cross-platform software developer, with extensive
    experience of deploying and maintaining Linux systems. Android, built on top of
    Linux, is also one of Paul''s specialist topics.


    ![](img/6866071e033820549b214c239744aaa0_37_1.png)


    Above phpMyAdmin provides a graphical interface to your database – and configures
    your LAMP stack as fully operational!


    Statistics show that Linux powers around 67 per cent of all web servers, despite
    having much lower penetration on the desktop. There are lots of reasons for this
    – for hobbyists the OS is free, for corporations it''s powerful yet lightweight
    (particularly compared to Windows servers) and there is a vast range of software
    that''s ready to deploy on the OS. The most common use case for Linux web servers
    is a LAMP stack – meaning Linux (OS), Apache (web server), MySQL (database) and
    PHP (scripting language). With just these four elements installed, it''s easy
    to get many of the most popular websites up and running (such as WordPress) and
    should you hit any issues, you can tap into a vast library of peer-to-peer support.
    The stack is well supported on all major Linux distributions and is frequently
    updated with new features as well as security fixes. No matter how big or small
    your web project, it is a great place to start.


    # Resources


    +   - Ubuntu ubuntu.com

    +   - Apache apache.org

    +   - MySQL mysql.com

    +   - PHP secure.php.net

    +   - Let''s Encrypt letsnencrypt.com

    +   - certbot certbot-auto github.com/certbot/ certbot

