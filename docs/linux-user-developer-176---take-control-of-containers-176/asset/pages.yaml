  md: '# Take control of containers


    # CONTAINERISE A COMPLETE FILE SYSTEM WITH DOCKER


    Docker is the most renowned name in container technology. Here''s why…


    Docker containers wrap a piece of software in a complete file system that contains
    everything needed to run it: code, runtime, system tools, system libraries – anything
    that can be installed on a server. This guarantee that the software will always
    run the same, regardless of its environment. One of the USPs of Docker containers
    is that they start instantly and use less RAM. Images are constructed from layered
    file systems and share common files, making disk usage and image downloads much
    more efficient.


    Docker uses the Linux kernel and its features, like cgroups and namespaces, to
    segregate processes so they can run independently. This independence is the intention
    of “containers” – the ability to run multiple processes and apps separately from
    one another to make better use of your infrastructure while retaining the security
    you would have with separate systems.


    Docker technology was initially built on top of LXC, generally thought of as traditional
    Linux containerisation. LXC was useful as lightweight virtualisation, but it didn''t
    have a great developer or user experience. Now, Docker technology brings more
    than the ability to run containers – it also eases the process of creating and
    building containers, shipping images and versioning images.


    ![](img/6866071e033820549b214c239744aaa0_19_0.png)


    ![](img/6866071e033820549b214c239744aaa0_19_1.png)


    ![](img/6866071e033820549b214c239744aaa0_19_2.png)


    ![](img/6866071e033820549b214c239744aaa0_19_3.png)


    # **01** **Using Docker**


    Docker is used for fast and consistent delivery of your application. Docker supports
    continuous integration and a continuous deployment workflow. When the testing
    is complete, to deliver the product you can just push the updated image to a production
    environment. Being a container-based platform, Docker allows highly portable workloads.
    As Docker is lightweight and portable, it is easy to dynamically manage workloads
    and scale up or tear down applications and services as businesses require.


    # **02** **Docker architecture**


    Docker uses client-server architecture. The Docker daemon does the heavy lifting
    of building, running and distributing your Docker containers. The Docker client
    communicates with the Docker daemon using REST API over UNIX sockets or a network
    interface. The Docker client has a command-line interface which it uses to talk
    to the daemon. Docker contains images, containers and registries in the daemon
    process. A Docker image is a read-only template that has instructions for creating
    a Docker container. A Docker container is a runnable instance of a Docker image,
    while a Docker registry is a library of images.


    # **03** **Docker images**


    Docker images are the build components of Docker. Each image consists of a series
    of layers which are combined into a single image using union file systems. These
    layers make Docker lightweight. If you update an application, a new layer is then
    built and replaces only the layer that was updated. Every image starts from a
    base image. The simple, descriptive instructions are stored in a Dockerfile, which
    is used to build the base image. Each instruction creates a new layer in the image.
    The base image is defined using the FROM keyword in the Dockerfile.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/6866071e033820549b214c239744aaa0_20_0.png)


    # 04 Docker registries


    Docker  registries  are  the distribution components of Docker. They can be private
    or public and can be on the same server as the daemon process or on a remote server.
    They store Docker images on it. After images are built, they can be pushed to
    a public or private registry. Docker Hub is a public Docker registry and has a
    huge collection of images. It allows you to contribute Docker images of your own.
    Docker Store, which is now generally available after being in beta, allows you
    to buy and sell Docker images.


    ![](img/6866071e033820549b214c239744aaa0_20_1.png)


    # 05 Docker containers


    Docker  containers  are  the  run components of Docker. Using Docker API or CLI
    commands, you can run, start, stop, or delete a container. Each container is built
    from an image and behaves like an isolated and secure application platform. They
    can also access resources running on different hosts or containers. The Docker
    client instructs the Docker daemon to run a container using the docker run command
    or equivalent API. For example, to run a container using an Ubuntu Docker image
    and execute the /bin/bash command in interactive mode, execute:


    ```

    $ docker run -i -t ubuntu /bin/bash

    ```


    # 06 Docker services


    Docker services are the scalability component of Docker. They enable a swarm of
    Docker nodes to work together. Docker services allow a defined number of instances
    of replica tasks. These replica tasks themselves are Docker images. You can specify
    a number of concurrent replica tasks to run. The swarm manager evenly distributes
    the load across worker nodes, so it appears to be a single application to the
    consumer. The docker service command is used for creating, updating, inspecting,
    listing and scaling the services. To create a new service, execute:


    ```

    $ docker service create

    ```


    # 07 Write your own Dockerfile: 1


    Create a new file and save it with the name Dockerfile. In this file you can enter
    the instructions available for use in Dockerfile. We will take the example of
    a stateful application like Minio. First, specify the base image using the FROM
    instruction:


    ```

    FROM golang:1.7-alpine

    ```


    If you need to specify any environment variables, there are set instructions available
    for this, such as ADD, COPY, ENV, EXPOSE, LABEL, USER, WORKDIR, VOLUME, STOPSIGNAL
    and ONBUILD.


    Suppose you need the WORKDIR instruction; in this case, enter:


    ```

    WORKDIR /go/src/app

    ```


    This sets the working directory to /go/src/app.


    # 08 Write your own Dockerfile: 2


    The RUN instruction executes commands in a new layer on top of the current image
    and commits the results. The RUN command executes in the shell, which is by default
    /bin/sh -c. To execute more than one command append \ and continue on the next
    line. In our Minio Dockerfile, the RUN instruction looks like this:


    The EXPOSE instruction specifies the runtime network ports the container listens
    to:


    ```

    EXPOSE 9000

    ```


    ENTRYPOINT  configures  an  executable container:


    ```

    ENTRYPOINT ["minio"]

    ```


    The VOLUME instruction creates a mount point:


    ```

    VOLUME ["/export*"]

    ```


    ![](img/6866071e033820549b214c239744aaa0_20_2.png)


    # 09 Build and run your Dockerfile


    Navigate to the folder with your Dockerfile in it. Then use the build command
    to create the image:


    ```

    $ docker build .

    ```


    This finds the Dockerfile in the current folder and builds it, creating a Docker
    image. To see all the images, execute:


    ```

    $ docker images

    ```


    This displays repository, tag, image ID, date created and the size details of
    the image. Now run the image to create a container. For example:


    ```

    $ docker run -p 9000:9000

    65c7eba5362b server /export

    ```


    Here, 65c7eba5362b is the image ID of the image that has been built; it is obtained
    from the Docker images list.


    > Make better use of your infrastructure while retaining the security you would
    have with separate systems


    ```

    RUN \ apkg add --no-cache git && \ go-wrapper download && \ -

    ```'
