  md: "# Tutorial Erlang\n\n**Right** The use of the file:open/2 function for opening\
    \ a file for reading and file:read_line/1 for reading a single line from an open\
    \ file\n\n![](img/6866071e033820549b214c239744aaa0_47_0.png)\n\nYou can learn\
    \ about the various file-related error codes and their descriptions by visiting\
    \ **bit.ly/2XMOHCm**.\n\n# Creating temporary files\n\nThis section will explain\
    \ how to create a temporary file in Erlang using a random filename, which is pretty\
    \ handy when you want to save your data without having to worry about accidentally\
    \ selecting an existing filename. The developed function makes use of the `erlang:timestamp/0`\
    \ function that returns the current system time as a tuple with three elements,\
    \ which is unique for each given system. The tuple is converted into a single\
    \ variable that can be used for generating a new file or directory. **Figure 3**\
    \ shows the Erlang code of the `create_temporary/0` function that can be found\
    \ in the `workBin.erl` file. Executing it generates the following results:\n\n\
    **Right** The use of the file:write/1 Erlang function for writing data to a file\n\
    \n![](img/6866071e033820549b214c239744aaa0_47_1.png)\n\n**Right** The Erlang code\
    \ presented in this figure shows how you can create unique names\n\n![](img/6866071e033820549b214c239744aaa0_47_2.png)\n\
    \n```\n```\n10> c(workBin).\n   [ok,workBin]\n11> workBin:create_temporary().\n\
    \   Unique filename: \"1485-326598-527282\"\n12> workBin:create_temporary().\n\
    \   ok\n   Unique filename: \"1485-326600-978734\"\n```\n```\n\nErlang is implemented\
    \ with the help of pattern matching. The following Erlang function presents a\
    \ simple way to handle errors related to `file:open/1`:\n\n# Developing wc in\
    \ Erlang\n\n```\n```\nopen_file_with_error_handling(File) ->\n   case file:open(File,\
    \ [read]) of\n       {ok, Fd} ->\n           io:format(\"File ~p opened successfully.~n\"\
    ),\n           [File],\n           file:close(Fd);\n       {error, Reason} ->\n\
    \           io:format(\"Error opening ~p.\\n\", [File]),\n           io:format(\"\
    Reason:~p.\\n\", [Reason])\n   end.\n```\n```\n\nThis section will present a rudimentary\
    \ implementation of `wc(1)` in Erlang. The code of `wc.erl` will not support command-line\
    \ switches and will not print the total number of characters, words and lines\
    \ read, because this would require too much code.\n\nYou are also allowed to specifically\
    \ handle some of the error messages. You can find the code inside `workBin.erl`.\
    \ Executing it generates the following kind of output:\n\n**Figure 4** shows a\
    \ part of the Erlang code of `wc.erl`. As you can understand from the implementation\
    \ of `wc.erl`, Erlang might not be the best candidate for such command-line tools!\n\
    \n```\n```\n2> workBin:open_file_with_error_handling(\"wc.erl\").\nFile \"wc.erl\"\
    \ opened successfully.\nok\n[\"wc.erl\"]\n3> workBin:open_file_with_error_handling(\"\
    wc\").\nError opening \"wc\".\nReason:enoent.\nok\n```\n```\n\nThe input files\
    \ are passed as a list to the `wc:start/1` function in order to be processed.\
    \ However, if you want to process a single file, then you can use the `wc:one_file/1`\
    \ function instead. The two most important functions of `wc.erl` are `process_file/0`\
    \ and `count_bin/0`. The first one makes sure that all files are processed whereas\
    \ the second one does the actual processing with a little help from `which_char/1`.\
    \ The contents of each file are processed character-by-character using list operations,\
    \ which is pretty common in functional programming languages. Additionally, the\
    \ definition of `which_char/1` allows you to make easy changes to the way you\
    \ treat special characters.\n\n# Is Erlang good for text processing?\n\nExecuting\
    \ `wc:start/1` with a number of filenames as arguments creates the following kind\
    \ of output:\n\nErlang **should not** be your first choice for processing and\
    \ parsing text files, even if you are a fan of Erlang programming languages such\
    \ as Lyx, Python, or Perl. And Ruby might be a better candidate for such tasks\
    \ because they need less code to do the job. The only variol reason to use Erlang\
    \ for text-manipulation is when you have to process huge amounts of text, because\
    \ Erlang has no real scaling problems at that point. However, that is not the\
    \ case for most developers today. Having said that, if you have a big Erlang application\
    \ and you want to do a little text parsing with no need to use another programming\
    \ language, Erlang pattern matching will greatly assist you and make your life\
    \ a lot easier.\n\n| 2> wc:start([\"wc.erl\",\"mvc.erl\"]). | words | chars |\
    \ lines |\n|---|---|---|---|\n| wc.erl | 217 | 1828 | 84 |\n| mvc.erl | 1899 |\
    \ 222 | 88 |\n| ok | | | |\n\nIf you modify the Erlang code of `wc.erl` a little,\
    \ you are able to find out the flow of the program, which can be very practical"
