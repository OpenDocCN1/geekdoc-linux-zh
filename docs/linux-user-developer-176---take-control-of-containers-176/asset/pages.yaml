    1> c(workText).\n{ok, workText}\n2> workText:writeToFile(\"./testing\").\nok\n\
    3> q().\nok\n4> $ cat testing\nA Message.\n```\n\n# Error handling\n\nError handling\
    \ is a crucial task when you have to deal with file read and write operations\
    \ because many things can go wrong during file I/O. Once again, error handling\
    \ in"
