- pgno: 84
  md: '# Encryptr


    Simplicity is key when it comes to Encryptr keeping your files safe


    ![](img/6866071e033820549b214c239744aaa0_84_0.png)


    +   - Add as much detail as you see fit to any entry created within Encryptr


    # UI and design


    Encryptr prides itself on being lightweight, so the first thing you''ll notice
    is just how fast it''s to navigate through. This does mean there''s certain cutbacks,
    and there''s not a whole lot to look at once you''ve booted it up. However, all
    key options are present and easily accessible through their dual-menu system that''s
    available through the homescreen.


    # Adding and customising entries


    Users have the option to tailor their entry into one of three specific types,
    depending on if you want to add a payment card, password or general account details.
    Each menu is crafted with different options and menus to fill in, which makes
    each of these highly customisable. Best of all, these entries can be merged if
    you prefer having one steady stream of entries.


    # Security


    Encryptr''s ties with security specialists, Spidercake, mean security plays a
    big role here. A password generator system can be created to make each entry you
    add truly unique, all of which are backed up to their own Zero Knowledge cloud.
    One caveat, and something most of its competitors offer, is the lack of two-factor
    authentication as a staple part of the security process.


    # Extra features


    If you own multiple devices sporting more than one OS, you''re in luck! Encryptr
    works across nearly every OS you can think off, and any details stored within
    are accessible through each account. For peace of mind, an email will be sent
    to you every time a new device looks to gain access, which will put some people''s
    minds at rest. We did notice, though, that the warning email is usually sent to
    your spam inbox, which is something to keep in mind.


    # Overall


    There''s a lot to like in Encryptr, and in terms of both usability and accessibility,
    it''s second-to-none. Some other password managers could learn a lot from what
    it offers.


    9


    # KeePass


    Can KeePass roll back the years and prove it''s still a worthwhile manager?


    ![](img/6866071e033820549b214c239744aaa0_84_1.png)


    +   - KeePass offers a steep learning curve to its users, as there''s a lot here
    to explore


    # UI and design


    Compared to the competition, KeePass is far more convoluted in its design. While
    the UI is still accessible, there''s a vast array of menus and locating specific
    ones is especially tiresome at first, especially once you start exploring the
    program''s sub-menu system. Although it does take a while to get used to, there''s
    everything you could possibly want here.


    # Adding and customising entries


    KeePass''s crowning glory is that it offers the best entry creation system out
    of the programs featured here. Each entry can be prioritised for the level of
    protection it requires, as well as implementing a time to remove the entry after
    a certain date. Basic entries can use the auto-type feature that automates much
    of the creation process for you.


    # Security


    All the standard security protocols are implemented well here, and the scope of
    security you apply to each entry is entirely user-dependent. Also included is
    a master key option, which can be used to secure your account when being accessed
    from a new machine. We highly recommend using this feature if you''ve got access
    to a smartphone to link your account to.


    # Extra features


    File corruption is a possibility within password managers, but KeePass is one
    of the few that offers a repair system. If this happens and your files are corrupted,
    KeePass will look to restore the missing entries whenever possible, but be warned,
    this process can be hit and miss with its results. Multi-user support is also
    listed, but it''s a surprisingly hard system to setup that many will bypass.


    # Overall


    If users are able to look past KeePass''s steep learning curve, this is one powerful
    password manager vault. Every option you could possibly want is included, and
    some noticeable extras are there as well.


    8'
