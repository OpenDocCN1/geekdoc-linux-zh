  md: "# Blinkt!\n\n![](img/6866071e033820549b214c239744aaa0_74_0.png)\n\n```\nfrom\
    \ blinkt import set_brightness\nset_brightness(0.5)\n```\n\n# 05 Turn on multiple\
    \ lights\n\nTurn multiple LEDs on using the `set_pixel` code and then set the\
    \ RGB colour values. Remember that for the LED number, 'zero' is the first LED,\
    \ as you count from zero upwards. The last LED is number seven. Try turning on\
    \ two or more LEDs: for example, the last LED set to red and the fourth LED set\
    \ to blue. Save and run the program.\n\n```\nset_pixel(7,255,0,0) show()\nset_pixel(3,0,0,255)\
    \ show()\n```\n\n![](img/6866071e033820549b214c239744aaa0_74_1.png)\n\n# 06 Create\
    \ a random blinking light\n\nCombine the previous code steps and create a random\
    \ set of sparkling disco lights! Begin by selecting a new blank Python file and\
    \ importing the random module, line 1. This is used to select random values for\
    \ the colours and the LED position number. Next, import the time module, line\
    \ 2. This adds control over the frequency of the change (a bigger time value will\
    \ result in slower blinks). Finally, import the codes to clear the LEDs when the\
    \ program exits, set a particular pixel to on and reduce the brightness, line\
    \ 3. Line 4 enables the LEDs to clear on exit and line 5 sets your required brightness\
    \ value between zero and one.\n\n```\nimport random\nimport time\nfrom blinkt\
    \ import set_clear_on_exit, set_pixel, show, set_brightness\nset_clear_on_exit()\n\
    set_brightness(0.1)\n```\n\n![](img/6866071e033820549b214c239744aaa0_74_2.png)\n\
    \n# 07 Create a while loop and set random values\n\nNow create a `while` loop\
    \ to ensure that the program continually repeats and loops over the code, line\
    \ 1. On the next line, (which is indented), use a `for` loop to iterate the code\
    \ over each of the LEDs. This has the effect of applying the next instruction\
    \ to each of the LEDs, working from the first LED to the last, line 2. Turn the\
    \ LED on using the `set_pixel` code, line 3; note that this is indented too.\n\
    \n```\nwhile True:\n  for i in range(8):\n    set_pixel(i,\n```\n\n![](img/6866071e033820549b214c239744aaa0_74_3.png)\n\
    \n# 08 Select a random colour\n\nWhen coding the LED, state the RGB colour values\
    \ of the LED as covered in step 3; use the code `random.randint(0,255)`. This\
    \ randomly selects a colour value between 0 and 255. Add two more incidences of\
    \ the code to select values for the Green and Blue colours. On line 2, set the\
    \ LEDs to display the colour using the code `show()`; note that this line doesn't\
    \ have an indent. Finally, add a short time delay so that you can observe the\
    \ lights before they change state, line 3.\n\n```\nset_pixel(i, random.randint(0,255),\
    \ random.\nrandint(0,255), random.randint(0,255))\nshow()\ntime.sleep(0.05)\n\
    ```\n\n# 09 Run the program\n\nSave your program file and run it by pressing F5;\
    \ call the file a suitable name. Press **Enter** and the program will run, displaying\
    \ a variation of random colours on each of the LEDs. Experiment with the colour\
    \ values to create variations that you like and also to speed up or slow down\
    \ the delay between changes.\n\n# RED, GREEN AND BLUE COLOURS\n\nThe RGB colour\
    \ model is an additive colour model in which red, green and blue light is combined\
    \ in various amounts to create a wide range of colours, over 16 million different\
    \ variations. The lowest value for a colour is zero, which usually denotes black,\
    \ as black is not a colour but an absence of colour! The top value is 255; for\
    \ example, red 255 means the maximum amount of red is being added to the shade."
