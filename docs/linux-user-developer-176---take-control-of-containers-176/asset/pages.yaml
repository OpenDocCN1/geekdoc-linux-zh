  md: '# DISTRIBUTION


    # Linux Mint 18.1 KDE and Xfce editions now available


    Latest update follows popular MATE release


    Towards the end of 2016, the Linux Mint Project unveiled the Cinnamon and MATE
    versions of the amazing Linux Mint 18.1 OS. The public response has been fantastic,
    especially due to the long term support plans put in place by the development
    team, with work on the 18.1 update expected to continue well into 2021.


    While the unveiling of the Xfce and KDE editions won''t be a surprise, the changes
    involved are great to see. The Xfce version in particular is based on the latest
