    ```

    To add a worker to this swarm, run the following commands: $ docker swarm join
    ... (text too small to extract accurately, appears to be instructions for docker
    swarm join)

    ```


    # **05 Compose file format**


    A Compose file starts with the version section. For a swarm-compatible Compose
    file, the version should be 3. Next, you need to define the services to be created
    in the swarm under the services section. Each service starts with the service
    name followed by the image section. Here you need to specify the image to be used
    for the service. Next you need to add volumes, ports, network, environment and
    deploy sections. Finally, the command section indicates the commands to be executed
    to launch the service.


    # **06 Load balancing**


    The swarm manager uses ingress load balancing to expose the services you want
    to make available externally to the swarm. The swarm manager can automatically
    assign the service a PublishedPort or you can configure a PublishedPort for the
    service. You can specify any unused port. In Compose files, the ports section
    specifies port mapping. If you do not specify a port, the swarm manager assigns
    the service a port in the 30000-32767 range.


    # **07 Create a swarm**


    To create a swarm, you need Docker Engine v1.12 or higher installed on all the
    host machines, with the Docker Engine daemon running on all the machines. Also,
    if a network connects these host machines, the ports 2377 (for cluster management),
    7946 (for inter-node communication) and 4789 (for overlay network creation) should
    be available. Once you have the hosts ready, SSH into the machine you''d like
    to use as the manager, and initialise the swarm with:


    ```

    ```

    $ docker swarm init --advertise-addr <MANAGER-IP>

    ```

    ```


    Here, you need to set the IP address of the manager machine.


    ```

    hosted-docker-dashboard:~$ docker-swarm-init --advertise-addr worker01-01 ...
    (text too small to extract accurately, appears to be terminal output)

    ```


    # **08 Add nodes to a swarm**


    Once you''ve created a swarm with a manager node, you''re ready to add worker
    nodes. Open a terminal and SSH into the machine where you want to run a worker
    node. After logging in to the machine, run the command produced by the docker
    swarm init output from the previous step to create a worker node joined to the
    existing swarm. Alternatively, you can use the command:


    ```

    ```

    $ docker swarm join-tokens worker

    ```

    ```


    ```

    hosted-docker-dashboard:~$ docker swarm init ... (text too small to extract accurately,
    appears to be terminal output showing token)

    ```


    # **09 Inspect a service**


    You can use the Docker CLI to see all the details about services running in the
    swarm. If you haven''t already, open a terminal and SSH into the machine where
    you run your manager node. Then, run the command: easily readable format. You
    can use other docker service commands to explore the service details. For example:


    ```

    ```

    $ docker service inspect --pretty <SERVICE-ID>

    ```

    ```


    ...to display the details about a service in an


