  md: "# # Tutorial\n\nErlang\n\n**Right.** The code of the `workBin:visit()` function\
    \ that walks a directory tree in Erlang\n\n![](img/6866071e033820549b214c239744aaa0_49_0.png)\n\
    \n![](img/6866071e033820549b214c239744aaa0_49_1.png)\n\n**Across.** How you can\
    \ find information about a module from the Erlang shell. The output also includes\
    \ the names of the functions that are exported\n\nThe `filelib:file_size()` function\
    \ returns the size of a file or a directory that is given as a parameter to it:\n\
    \n```\n5> filelib:file_size(\".\").\n4096\n```\n\nThe `filelib:is_file()` and\
    \ `filelib:is_dir()` functions enable you to determine whether the given path\
    \ is a file or a directory, respectively:\n\n```\n6> filelib:is_file(\".\").\n\
    true\n\n7> filelib:is_dir(\".\").\ntrue\n\n8> filelib:is_file(\"wc.erl\").\nfalse\n\
    \n9> filelib:is_file(\"wc.erl\").\ntrue\n\n10> filelib:is_dir(\"/dev/random\"\
    ).\nfalse\n\n11> filelib:is_file(\"/dev/random\").\nFalse\n```\n\nAs you can see,\
    \ `filelib:is_file()` considers directories as files but can differentiate between\
    \ regular files and special files such as `/dev/random`.\n\n# ## Visiting all\
    \ files in a directory tree\n\nThere is a very frequent need to visit all files\
    \ in a directory and its subdirectories. This section will teach you how to perform\
    \ this task in Erlang. Once again, the developed function requires one argument,\
    \ which is a directory, and returns the desired information. The `visit()` function\
    \ is included in the `workBin.erl` file. Executing `visit()`\n\ngenerates the\
    \ following kind of output:\n\n```\n3> workBin:visit(\"/var/spool\").\n\n/var/spool\n\
    /var/spool/cups\n/var/spool/mqueue\n```\n\nYou can see the related Erlang code\
    \ in **Figure 6**. The most important Erlang function in the implementation of\
    \ `visit()` is `filelib:wildcard()`, which returns the list of files that match\
    \ the given criteria.\n\nThe `filelib` file holds the definition of the `file_info`\
    \ record - the information in `file_info` allows you to determine the type of\
    \ file you are dealing with. On a Debian Linux system, the `file.erl` file can\
    \ be found at `/usr/lib/erlang/lib/kernel-5.1.1/include`. You can find more information\
    \ about the data that `file_info` holds at: erlang.org/doc/man/file.html\n\n#\
    \ ## Finding information about files\n\nThe following code illustrates how you\
    \ can find more information about files using the `file_info` record:\n\n```\n\
    file_permissions(Path) ->\n    case file:read_file_info(Path) of\n        {ok,\
    \ FR} -> io:lib:format(\"~.8B\", [FR#file_info.mode band 8#777]);\n        _ ->\
    \ error\n    end.\n```\n\nThe previous code prints the file permissions of a file\
    \ or a directory. Please bear in mind that although `file:read_file_info()` contains\
    \ information about file size and type, calling `file:file_size()` and `is_dir()`\
    \ is more practical than using `file:read_file_info()`. However, note that some\
    \ of the data returned by `file:read_file_info()` cannot be discovered using other\
    \ Erlang functions. Executing `file_permissions()` generates the next kind of\
    \ output:"
