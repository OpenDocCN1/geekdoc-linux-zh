  md: '![](img/6866071e033820549b214c239744aaa0_7_0.png)


    Above The KDE Slimbbook comes with the fantastic KDE Neon pre-installed


    # HARDWARE


    # KDE unveils lightweight Linux laptop


    Move over Macbook, there’s a new king in town


    For many looking to get their Linux fix, choices primarily revolve around which
    desktop PC you’re going to buy. Laptops pre-loaded with Linux at their core are
    few and far between, and unless you managed to get your hands on Dell’s recent
    model, many contain a myriad of shortcomings that have often caused users a lot
    of frustration and annoyance, rather than enjoyment. However, the latest pre-loaded
    Linux laptop to make its debut could just be the game-changer we’ve been waiting
    for.


    Ever-popular KDE, famed for its fantastic graphical desktop environment, is launching
    its very own laptop. To do this, it’s partnering with the Spain-based Slimbook
    for the official launch of the KDE Slimbbook. In the past, KDE has been the desktop
    environment of choice for a vast majority of UNIX workstations, providing one
    of the most accessible ways to get started with everything that Linux offers.
    Slimbook, on the other hand, won’t be overly known to those outside of Spain,
    but it has previously built and sold entry-level laptops with varying levels of
    success.


    > “ The latest pre-loaded Linux laptop could just be the game-changer we’ve been
    waiting for ”


    The word budget won’t apply to the KDE Slimbook, however, as it’s being marketed
    as a mid to high-level desktop PC replacement. Early models allow for two variants
    to be sold, with a choice of a 2.3GB Intel Core i5 or 2.5GB i7 model available
    for users. Other noticeable specifications include 4GB of RAM, a 13.3-inch 1080p
    display, 120GB SSD and dual USB 3.0 ports. On paper, there are pleasing specifications,
    and at just 0.71 inches thick, it’s going to rival the same shape and design of
    leading laptops currently on the market.


    While Slimbook is taking care of the hardware side of things, KDE is in its element
    on the software side. The new KDE Slimbook ships with the popular KDE Neon distribution.
    While it’ll be tailored for new users, thanks to its Ubuntu base, there’ll be
    plenty of scope for advanced users to customise the system to their exact needs.


    Perhaps the best thing about using KDE Neon on the Slimbbook is having access
    to the KDE Plasma desktop environment, which has proven to be a big success over
    the years. It will contain a wide range of KDE-based apps, and it won’t skimp
    on the usual personalisation tools associated with the desktop environment. Although
    details on the matter are still scarce, it’s believed that KDE will provide all
    the necessary tools to switch environments if KDE Neon simply doesn’t suit your
    needs.


    What won’t be as pleasing to the ears of potential users will be the pricetag.
    Prices for the KDE Slimbook will be starting at around £700/£770 for the i5 model,
    with it then increasing closer to the £820/$910 mark for the faster i7 version.
    Pre-orders are currently being taken over at kde.slimbook.es, with the first units
    expected to ship towards the end of March, but if pre-orders take off, expect
    some delays.'
