  md: "# Tutorial\n\nFind the line starting “net.ipv4_ip_forward=1” and remove the\
    \ “#” at the start. Now reboot the Pi.\n\n# 10 Setup IPv4 Forwarding\n\nFor the\
    \ next step, you need to run each of these commands individually:\n\n```\n```\n\
    sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE\n```\n``` sudo iptables\
    \ -A FORWARD -i tun0 -o wlan0 -m state --state RELATED,ESTABLISHED -j ACCEPT```\n\
    ```\n\nNext, run\n\n```\n```sudo nano /etc/rc.local```\n\nPaste the following\
    \ right above the line reading “exit 0”:\n```\n\n```\n```\niptables-restore <\
    \ /etc/iptables.ipv4.nat\n/usr/sbin/hostapd /etc/hostapd/hostapd.conf\n```\n```\n\
    \n# 11 Test Access Point\n\nRun the commands\n\n```\n```sudo update-rc.d hostapd\
    \ enable``` \n\nand\n```\n\n```\n```sudo update-rc.d dnsmasq enable```\n\nReboot\
    \ the Pi. You'll need a second device at this stage to see if you can access the\
    \ Wireless AP. Search for it in your network menu and enter the password you created\
    \ earlier on. If you can't remember this, run\n```\n\n```\n```sudo nano /etc/hostapd/hostapd.conf```\n\
    \non the Pi to view it again. Once connected visit www.whatsmyipaddress.com to\
    \ check you're behind the VPN.\n```\n\n# 12 Fix DNS Leaks\n\nCertain VPN providers\
    \ use their own DNS servers. Other VPN Providers are less cautious. Visit https://www.dnsleaktest.com/\
    \ and click Extended Test to check you're safe. If any of the DNS servers match\
    \ your regular ISP, your connection is not fully secure.\n\n```\nTo resolve this,\
    \ edit your VPN configuration file e.g. ```sudo nano /etc/openvpn/vpn2.conf```\n\
    \nand add these lines immediately above “ca”:\n```\n\n```\n```script-security\
    \ 2\nup /etc/openvpn/update-resolv-conf\ndown /etc/openvpn/update-resolv-conf```\n\
    ```\n\nSave and exit, then restart your Pi. Check the DNS leak website once again.\
    \ If this fails to resolve the issue, try using another VPN provider.\n\n```\n\
    ```\nsudo iptables -A INPUT -i tun0 -m conntrack --state RELATED,ESTABLISHED -j\
    \ ACCEPT\n```\n```sudo iptables -A INPUT -i tun0 -j DROP```\n```\n\n```\n```sudo\
    \ sh -c “iptables-save > /etc/iptables.ipv4.nat”```\n\nMake sure to save your\
    \ changes so that they'll apply on reboot:\n```\n\n```\n```sudo sh -c “iptables-save\
    \ > /etc/iptables.ipv4.nat”```\n\n```\n\n# 13 Block unsolicited connections\n\n\
    As your Pi is sitting between your computer and the internet, it can potentially\
    \ be accessed by other devices. Prevent unsolicited incoming connections from\
    \ other devices with the following commands:\n\n# 14 Route all traffic through\
    \ OpenVPN\n\nWhen you boot the Pi initially, certain applications may try to connect\
    \ directly to the internet, which can undermine your anonymity.\n\nTo channel\
    \ all network traffic through the VPN, you need to edit your configuration file\
    \ in /etc/openvpn, for instance by running\n\n```\n```sudo nano /etc/openvpn/vpn2.conf```\n\
    \nMake sure the line “redirect-gateway” reads “redirect-gateway def1”. DNS queries\
    \ will also be routed through the VPN also so make sure your provider supports\
    \ this.\n```\n\n# 15 Set up Firewall\n\nAlthough you may have previously configured\
    \ iptables to prevent unsolicited incoming connections, to be on the safe side,\
    \ consider installing ufw (Uncomplicated Firewall) with\n\n```\n```sudo apt-get\
    \ install ufw```\n\nRun\n```\n\n```\n```sudo ufw enable```\n```\n\n```\nto fire\
    \ it up, then open the default OpenVPN port 1194 with ```sudo ufw allow 1194```\n\
    ```\n\nYou may also want to enable Port 22 to allow connecting via SSH. Remember\
    \ that this doesn't change which ports are open and closed on the router."
