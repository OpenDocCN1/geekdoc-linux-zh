- pgno: 59
  md: '# THIRD-PARTY APPLICATIONS


    After your initial Linux install, you''ll want to get the best third-party applications
    on your system right away


    ![](img/6866071e033820549b214c239744aaa0_59_0.png)


    Above: LibreOffice is a capable alternative to Microsoft Office


    # 9 I NEED OFFICE!


    One of the biggest arguments we always hear against* Linux is ‘there’s no Microsoft
    Office’. There’s no getting away from it: this is a true statement. But in reality,
    you can reduce the burden of losing Office in a number of ways. The most obvious
    is to use a native alternative suite, such as the excellent LibreOffice, which
    nowadays compares pretty well to Microsoft''s offering both in features and, with
    the latest ribbon user interface in LibreOffice 5.3, style too. LibreOffice includes
    alternatives to all the main Microsoft Office apps — Word (Writer), Excel (Calc),
    PowerPoint (Impress), Visio (Draw) and even Access (Base).


    Although this is definitely the purest option, even the most hardened Linux user
    will probably admit that there are times when only the real Office experience
    will do — sharing files with others is a key example of this. WINE 2.0 (or the
    Cross-over or PlayOnLinux tools based on it) allows Windows applications to run
    fully on Linux, now with full support for Office 2013. Simply install the host
    app and run the Office installer inside it. It works surprisingly well. If none
    of these works for you, you could consider running a bare Windows installation
    inside a VirtualBox or VMware virtual machine and installing into that. Although
    perhaps a little bit heavyweight, it works… and that''s the most important thing!


    # 10 EVERYTHING IS TINY ON MY HiDPI DISPLAY


    So you''ve got a machine with a fantastic new HiDPI display... perhaps an XPS
    13 Developer Edition (UHD) or just a lovely new 4K monitor for your desktop. That''s
    all great, except everything is tiny in the OS and some of your favourite apps.
    First up, don''t be alarmed — this isn''t a problem that''s unique to Linux; even
    now, Windows 10 has some pretty nasty-looking UI elements on high-resolution screens.
    Fixing up the main OS itself is easy enough: you just need to set a menu and title
    bar scaling factor in the Screen Display section of Settings. After that''s done,
    you''ll need to look for specific apps that are problematic. Many will have their
    own HiDPI themes; however, you can also check out the window scaling options in
    gnome-tweaks-tool to help you get everything scaled just right.


    ![](img/6866071e033820549b214c239744aaa0_59_1.png)


    # 11 I REALLY NEED PHOTOSHOP


    You''ve got your system up and running and you''ve realised that you don''t need
    Microsoft Office any more thanks to LibreOffice. What''s another big app that
    new Linux adopters struggle to come to terms with being without? Adobe Photoshop.
    There''s no denying that Photoshop is an awesome application, but unless you really
    use a large number of the advanced features in Photoshop, Linux has a heavyweight
    image editor of its own that you can use — GIMP. Short for the GNU Image Manipulation
    Program, the application is an incredible tool for photo retouching, image composition
    and authoring, and much more thanks to its open source (and of course free) nature
    and extensible plug-in architecture. GIMP is also available on Windows and Mac
    OS X, and excels on those platforms too!


    ![](img/6866071e033820549b214c239744aaa0_59_2.png)'
  merge: -1
  img_proc: true
