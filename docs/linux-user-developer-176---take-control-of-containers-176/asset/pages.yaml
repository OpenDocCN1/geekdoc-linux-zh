    Should you use the product heavily, marking some of the other utilities might
    make sense too – your guide''s author will


    > Look at the Utilities section, where you can pick a variety of products that
    you might need


    select all of them, as this will provoke an educational error. In the next step,
    use the left and right cursor to move the function highlight to exit and leave
    the Development section. In the next step, you should also look at the Utilities
    section, where you can pick a variety of products that you might need.


    At that point, it is time to invoke another Make process: due to the extreme size
    of GCC, a work time of another 30 minutes can be expected. After its completion,
    an error similar to the one shown in Figure 3 will pop up.


    ![](img/6866071e033820549b214c239744aaa0_36_0.png)


    # Above Un-oh!


    Finding errors in a build is made difficult by a small specialty: the OpenWRT
    build system, by default, caches any output produced by its lesser packages. Fortunately,
    invoking the program with the following parameters can solve this:


    ```

    ```plaintext

    tamhan@TAMH414:~/wrtspace/openwrt$ make -j1 V=s

    Creating filesystem with parameters:

    Size: 50331648

    error: ext4_allocate_best_fit_partial: failed to allocate 3446 blocks, out of
    space?

    make[5]: *** [mkfs-ext4] Error 1

    ```

    ```


    After running for a few minutes, the error will be emitted to the console. In
    our case, the issue occurs during the creation of the


    ```

    ```plaintext

    What''s the timing?

    Your author likes using the time command on the compile task. Simply append it
    to the command that is to be run. It will then output information:

    - the real time value tells you how much clock time has passed

    - the user time value provides additional information on resources used. Note
    that in multicore workstations, the lesser values can be larger than the clock
    time value as multiple cores are used.

    ```

    ```


    root file system – remember that the image created before was but 78MB in size.


    Switching into the Target Images section of menuconfig best solves this problem:
    There, set the value of ''Root filesystem partition size'' to a larger value such
    as 500MB. After that, run the make command – it will pass without problem, leading
    to a new image which can be deployed to your Raspberry Pi.


    # Praise modularity!


    Even though GCC can now be invoked, creating custom programs still requires the
    presence of the proper editor.


    Recompiling the entire image is a nuisance: let us instead create a package. This
    process is especially handy when it comes to updating an image of a process computer
    that is already in active use, since overwriting the image usually destroys all
    information already found on the router.


    This problem is best solved by creating a dedicated package. Return to make menuconfig
    and go to Utilities>Editors. Then, mark the nano package and press the M key to
    declare it a module, as shown in Figure 4.


    ![](img/6866071e033820549b214c239744aaa0_36_1.png)


    # Above This product will be modularised


    After saving the configuration, run Make another time to kick off another compile
    process. When done, a new IPK file will enrich the packages folder. Finding it
    is made easier by using the well-known combination of find and grep:


    ```

    ```plaintext

    tamhan@TAMH414:~/workspace/openwrt/bin/brxm2708/packages$ ls

    base  kernel  luci  management  packages  routing  targets  telephony

    tamhan@TAMH414:~/workspace/openwrt/bin/brxm2708/packages$ find . | grep "nano"

    ./packages/nano_2.7.4-1_brcm2708.ipk

    ```

    ```


    This package can then be deployed onto the package utility discussed in the previous
    tutorial (issue 175). Alternatively, the contents of the packages folder can also
    be exposed via a web server, thereby allowing the package manager to obtain relevant
    packages ''on the fly.''


    # Conclusion


    In the case of the Raspberry Pi, having your own image allows you to add a variety
    of utilities which the OpenWRT team currently does not provide. Access to GCC
    means that the world is your oyster – deploying new technologies is as easy as
    downloading the source code, adapting it to the needs of OpenWRT, compiling it
    and enjoying the fruits of your labour.'
