- pgno: 8
  md: '![](img/6866071e033820549b214c239744aaa0_8_0.png)


    # TOP FIVE


    # Best Debian-based distros


    **1 deepin**

    Arguably deepin''s biggest selling point is its self-developed desktop environment,
    DDE. While based on the Qt 5 toolkit, DDE can be customised to suit the needs
    of the user, without proving to be a burden on your hardware. Make sure you also
    take a look at all the home-grown applications it offers, including the fantastic
    DMusic and DPlayer apps.


    **2 Tails**

    If security is important to you, then Tails should be your first distro of choice.
    It uses a clever "incognito mode, which helps you bypass internet traffic and
    makes tracking you only a faint possibility.


    # DEVELOPMENT


    # Asus'' Tinker Board is the Pi competitor we''ve always wanted


    Can 4K capabilities make the Tinker Board the next must-have SBC?


    Numerous Raspberry Pi competitors have come and gone over the years, but few have
    managed to really stand the test of time against the mini computing powerhouse.
    But despite numerous failures from close competitors, tech giant Asus has waded
    in with its own Pi competitor, the Tinker Board. Sizing up at just 8.5cm by 5.3cm,
    both single-board computers are near identical in size, but that''s where the
    similarities really end. The Tinker Board features a quad-core ARM Cortex A17
    CPU at its core, running at 1.8GHz. Alongside this is an ARM Mali GPU and 2GB
    of DDR3 memory. The Mali GPU will be of particular interest to those who can''t
    decide between this and the Broadcom VideoCore IV GPU of the Pi, with the former
    providing vastly superior performance in tests. The increase in power aids the
    Tinker Board to support not only full 1080p, but also H.265 4K decoding, a first
    for a single board computer of its size. However, in an official statement from
    Asus, 4K support is still being worked on currently, and while users can technically
    enjoy 4K video through the unit, don''t expect to be watching 4K Netflix any time
    soon. Aside from the core components, other niceties include a couple of swappable
    antennae for the primary Wi-Fi module that''s also on board, along with gigabit
    Ethernet and key support for SDIO 3.0. Alongside the release of the Tinker Board,
    Asus has also released its own OS to accompany it. At the time of writing, details
    of the OS are fairly scarce, however it''s known that it''s based on Debian and
    will have a close resemblance to the core Raspberry Pi OS many of us have become
    accustomed to. Asus has also noted that it''s working on support for OpenSUSE
    and Ubuntu, with expansions planned towards the end of 2017. The Asus Tinker Board
    is a tempting piece of kit on paper, and looks to not only match the Raspberry
    Pi in core features, but also surpass it in other areas. Interested parties can
    currently pre-order the unit directly through Asus for the tasty price of just
    £55, with early units shipping now.


    ![](img/6866071e033820549b214c239744aaa0_8_1.png)


    **3 antiX**

    While not as well-known as the others on this list, antiX shouldn''t be discarded.
    It''s primarily built for older hardware, but still provides a fully functional
    OS for both newcomers and seasoned users alike.


    **4 SparkyLinux**

    SparkyLinux has gained a growing reputation among those seeking a simple distro
    that doesn''t contain a mountain of superfluous extras. It''s lacking in some
    core applications, but a few downloads will sort that issue.


    **5 Parrot Security OS**

    Another one for the security-minded folk out there. Parrot includes a myriad of
    utilities built for penetration testing, computer forensics and advanced reverse
    engineering. It''s not for those new to Linux, however.'
  merge: -1
  img_proc: true
