    # Working with binary files


    Binary files are different to plain text files and therefore require a different
    approach to processing. The approach depends on the exact format of the binary
    file and therefore cannot be determined in advance.


    You can open a binary file for reading in raw mode as follows:


    ```

    ```Erlang

    1> {ok, S} = file:open("network.erl", [read, binary, raw]).

    {ok,{file_descriptor,prim_file,{#Port<0.435>,333}}}.

    ```


    ```


    The previous command gives you random access to the file you just opened. However,
    reading such a file requires the use of the file:pread/1 function.


    Similarly, you can open a binary file for writing in raw mode as follows:


    ```

    ```Erlang

    2> {ok, S} = file:open("aRawBinary", [raw, write, binary]).

    {ok,{file_descriptor,prim_file,{#Port<0.435>,333}}}.

    ```


    ```


    Writing to a raw binary file can be done using the file:pwrite/1 function.


    Talking more about raw binary files is beyond the scope of this tutorial.


    # Implementing cp in Erlang


    The cp(1) utility reads and writes all files in binary format, and the Erlang
    implementation is no exception to this unfriendly rule. The easiest way to implement
    the core functionality of cp(1) in Erlang is using the file:read_file/1 function.
    The relevant Erlang code can be found in myCP.erl, which you can also see in Figure
    5. The module needs a small function to do the job because file:read_file/1 reads
    the entire contents of a file and stores it into a single variable, whereas file:write/2
    writes the contents of the variable to a file descriptor that was open for writing.
    Executing myCP:copy/2 generates the following:


    ```

    ```sh

    1> c(myCP).

    {ok,myCP}

    2> myCP:copy("myCP.erl", "copyMyCP.erl").

    ok

    $ diff copyMyCP.erl myCP.erl

    ```


    ```


    The empty output of diff proves that copyMyCP.erl and myCP.erl are exactly the
    same!


    # Useful functions related to files


    This section will illustrate various convenient Erlang methods that allow you
    to determine whether a file is really a file, whether a directory is in reality
    a directory, etc.


    First, the file:list_dir/2 or file:list_dir/1 function returns a list that contains
    the filenames of the given directory:


    ```

    ```Erlang

    3> file:list_dir(".").

    [{ok,["myCP.erl", "cmdArgs.erl", "wc.erl", "workBin.erl",

    "workText.erl"]}]

    ```


    ```


    # The Mnesia database


    Databases are related to files because they also provide a way of storing data.
    Mnesia is an extremely fast, distributed DBMS written in Erlang that is part of
    the standard Erlang distribution. You can query Mnesia with queries that are similar
    to SQL and List Comprehensions. As you might recall from a previous Erlang tutorial,
    List Comprehensions offer a mathematical way to create lists:


    ```

    ```Erlang

    1> [X * X || X <- [1,2,3,4,5,6], X > 3].

    [4,5,6]

    ```


    ```


    The previous Erlang code creates a new list based on a mathematical condition.


    Although a forthcoming tutorial will talk more about Erlang and Mnesia, you can
    learn more about Mnesia at erlang.org/doc/apps/mnesia/.'
