    # # Network Services Overview


    The network is merely the conduit through which data travel. The actual services
    provided on a network are hosted by the organization’s servers. A typical organization
    will offer the services outlined in Table 6.1.

    The services visible at the application or user level depend upon lower-layer
    network services. These are described in detail in Chapter 17, "Network Services."
    These lower-level services must be rock solid, since the entire environment depends
    upon them.


    | Table 6.1 Typical network services |

    | File Services | Transparent access to remote files |

    | Print Services | Access to printers as network objects |

    | Fax Services | Transmit documents via a networked facsimile facility |

    | Electronic Mail | Internal mail systems with connectivity to the Internet |

    | NetNews | Access to the network news service. Also permits system administrators
    to define local news groups. |

    | Web Access | Access to both internal web sites and the Internet |

    | Applications | Applications are installed on servers and accessed by the clients
    via file services |

    | Database Access | Database access via applications and ad hoc reporting tools
    |

    | Time Services | The Network Time Protocol allows system clocks to be synchronized
    within a few milliseconds of Coordinated Universal Time (UTC). |

    | Distributed Management | Whether an organization employs network management
    protocols like SNMP or utilizes a simple set of homegrown scripts, facilities
    exist to manage the environment as a whole rather than as isolated computers |

    | Remote Access | Members of the organization have access to all services whether
    they are at home or on the road. The remote access mechanisms support authentication
    and encryption to ensure the privacy and security of data.'
