    # NTP


    The Network Time Protocol (NTP) is used to synchronize time among,computers on
    the network. This is especially useful with PC hardware, because their internal
    clocks tend to drift significantly. NTP should be configured to ensure an accurate
    source of Universal Coordinated Time (UTC). There are three choices for a good
    time source.


    +   - WWV WWVB radio receivers. NTP supports a wide variety of radio clocks. These
    devices listen to a signal transmitted in the United States by the National Institute
    of Standards. The disadvantage of radio clocks is that the signal is often poor
    in densely populated areas. Also, for the highest degree of accuracy, it may be
    necessary to correct the signal, requiring accurate knowledge of the site''s latitude
    and longitude.

    - GPS receiver. Similarly to radio clocks, GPS receivers listen to an external
    signal for accurate time information. In this case, the source is the U.S. Global
    Positioning System, a constellation of satellites in orbit the earth. These satellites
    broadcast accurate time information that precise locations can be calculated by
    triangulating from several GPS satellites. The military uses a high-quality encrypted
    signal from these satellites for navigation and targeting. They also distribute
    a lower grade service for non-military use, which commercial products use. The
    time signal is still highly accurate. GPS receivers work anywhere on the Earth''s
    surface.

    - Internet NTP Servers. A large number of high-quality time sources are available
    from the Internet. The NTP home² has links to these sources. This option has the
    advantage of being free. While it is theoretically possible for someone to spoof
    Internet time, the basic NTP filtering algorithm is designed to throw out packets


