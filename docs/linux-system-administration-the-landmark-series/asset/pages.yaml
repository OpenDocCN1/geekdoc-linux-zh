    # # Versioning


    Every organization large enough to automate the installation procedure will require
    its own version numbering scheme. This may be an extension of the numbering scheme
    of a Linux distribution. For example, each time a new internal configuration is
    released to production, a number appended to the distribution''s version number
    may be incremented. Thus, an organization might have an internal configuration
    numbered 6.1.3, which is the third internal release based on RedHat 6.1. An alternative
    is to base the base number directly on revisions from a version control system
    like rcs or cv used to maintain the releases.


    These internal releases may be based on updates from the distributor, but they
    will also be based on software not released as part of the distribution. A good
    example is the cryptographic software that every organization needs for security
    which cannot be included in many distributions because of export controls.


    Large organizations may also find and correct bugs and then need to roll them
    into production quickly. Sometimes, this will happen before the maintainer of
    the software has released a new version.


    The organization may also need to make releases to meet its internal needs (that
    is, it is a requirement for the latest version of a package) or to address bugs
    that employees introduced via added software. Thus, there are several reasons
    why organizations may need versions of their configurations that may be revised
    independent of the Linux distributions. For this reason, it is imperative to instance
    a version numbering scheme to provide for when first setting up an installer server.
    The release number should be embedded in obvious places, like /etc/motd, the kernel
    version returned by uname -v and so on.


    # # Comparing Installs and Upgrades


    Each Linux distribution includes tools for installing the software. Most also
    include tools for upgrading a computer that is already running a previous version
    of the Linux distribution.


    At the project management level, there is another way in which the words "installation"
    and "upgrade" are used. New systems are installed, and systems that have been
    running previous versions of Linux are upgraded. However, at the project level,
    it does not matter whether machine is upgraded using the vendor''s upgrade mechanism
    or install mechanism. As long as the user is able to return to the system and
    begin his work unhindered, it does not matter whether the system was incrementally
    upgraded or reinstalled from scratch.'
