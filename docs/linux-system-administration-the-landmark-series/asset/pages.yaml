  md: "# Chapter 18 Mail\n\nThere are several software packages, most of which are\
    \ built on top of procmail.\nHere are some: \n\nspambard, http://ftp.netcom.com/pub/wje/release/sg-latest.tar.gz\n\
    \nSpam Bouncer: http://www.hrweb.org/spambouncer/\n\nSpamDunk: http://www.interlog.com/waldwaldnes/spamdunk/spamdunk.htm\n\
    \nJunkFilter: http://www.pobox.com/-gsutter/junkfilter/\n\n# Use Policies\n\n\
    Every organization should publish its email policy on its intranet, making clear\
    \ what is and is not permitted. It should also specify the penalties for specific\
    \ violations. For example, sending erotic mail to one's spouse might or not be\
    \ allowed, even if prohibited, would generally invoke the same response as launching\
    \ a denial-of-service attack against a personal enemy or spam soliciting a scam.\n\
    \nThe authors are from one organization that explicitly disallowed almost every\
    \ use of external mail. Specifically, external mail was prohibited for any contractual\
    \ business and all non-business use. Such a policy is general and can lead to\
    \ abuse. it is responsibility of management to provide a policy that is realistic\
    \ and enforceable. Human resource and corporate security professionals have access\
    \ to industry guidelines and recent court rulings that can be used as a basis\
    \ for developing an effective and enforceable email policy.\n\nEmail policies\
    \ may cover more than just sorts of mail may be sent. Various difficulties may\
    \ arise. One that arises is what to do with email that arrives for an employee\
    \ who has become incapacitated. Just as with paper mail, many employees receive\
