  md: 'With chmod there are similar concerns regarding chmod symlinks, chmod dereference
    those symlinks named on the command line (possibly as a result of glob expansion)—but
    not those that it encounters as a result of recursing through a directory. This
    is another of those annoying subtleties that can defy the system administrator.

    With the find command, you need to add the -f option to follow symlinks—or just
    add a trailing slash to the symlink/dirs you list them on the command line (forcing
    the shell to fail glob on a "zero length" trailing filename).

    As they say, "The devil’s in the details."


    # Corrupted Data


    fsck has excellent filesystem recovery abilities, and it can in fact have additional
    success when run multiple times over a dismounted filesystem. Recovered inode
    blocks will be placed under the recovered directory /found+, which exists on every
    physical partition of type ext2. With a good hex or binary viewer, you may be
    able to recover valuable data even though the original file remains unrecoverable.

    If you are willing to put the energy into such recovery, consider using the dd
    command to make a sector-by-sector copy of the entire disk partition to another
    device, a tape drive, or through a network pipe into an ssh process that redirects
    its output to a remove device, partition or file (if your remote filesystem supports
    files that are large enough to hold your whole partition; remember the 2GB file
    size limit on 32-bit versions of Linux!).


    # Network Problems


    This section covers problems that are manifest when a network is misconfigured,
    misused, or broken.


    # NIS Access Does Not Work


    Change /etc/nsswitch.conf to read

    passwd: compat

    for the +/- entries in /etc/passwd to work.

    Note that libc5 uses /etc/hosts.conf rather than /etc/nsswitch.conf and that a
    libc5 with NIS support compiled in in must be installed.

    Also see Chapter 21, "Managing NIS".


    # System Inaccessible Via Network


    Check the TCP wrapper settings, as controlled by /etc/hosts.allow and /etc/hosts.deny.
    Any other aspects of firewalling that apply to the machine should be checked,
    and then the Ethernet or other network cable and the points at which it is connected
    to the network.'
