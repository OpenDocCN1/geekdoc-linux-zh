    gets wedged, the window manager may get confused, after which all input is ignored
    as far the user can tell.(It sometimes happens that it is gathering in the input
    queue, then the process times out or dies, and all the "ignored" input happens
    at once.)


    You may not be able to get CTRL-ALT-FX working to escape to another virtual console.


    ```

    ssh or telnet, or otherwise get text mode access, and kill -9 the offending process
    (you can usually tell which one it is in a list). If this does not suffice, continue
    up the process tree (ps will display processes by family). In the worst cases,
    killing the X server will force it to garbage-collect the discover resources of
    its children—there''s no chance to save editors, or for any programs to close
