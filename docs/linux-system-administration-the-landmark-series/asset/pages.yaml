  md: '# Booting


    All contemporary computers use the same general components and the same general
    sequence for booting an operating system. The CPU initializes itself internally
    and then begins to fetch instructions, starting at a fixed address of physical
    memory.¹ Hardware engineers arrange for firmware programmed into an EPROM or flash
    EPROM to map to these addresses. These instructions typically initialize the hardware,
    then load the next level of software to be executed (usually from hard disk, but
    sometimes from a floppy disk, CD-ROM, or the network), and finally pass control
    to the software known as a bootstrap loader. If the computer architecture imposes
    severe limitations on the size of the bootstrap loader, sometimes a secondary
    bootstrap program is used. The bootstrap program then loads the operating system.


    The LINUX operating system is no exception to this model. LINUX differs from other
    operating systems in that the initialization process varies based on the hardware
    architecture used. This permits Linux to coexist with other operating systems.
    It permits the same device drivers to be used in the boot loaders in LINUX. Users
    of other PC operating systems will be surprised by the large number of boot configuration
    options available to the system administrator.


    On Intel-based PCs running Linux, the software loaded by the firmware is a package
    called LILO, the LINUX Loader. For the Alpha architecture, one of two mechanisms
    is used—MILO—MILO or boot. For the SPARC architecture, LILO is used. On Macintosh
    hardware, BootX is used.


    # PC Firmware and Loaders


    Unfortunately, as of this writing, most firmware for Intel-based PCs is bug-ridden
    and not well-suited for Linux. Because the source code is not widely available,
    it does not get fixed. The good news is that an OpenBIOS is underway. It is possible
    that PC motherboards will ship with an Open Source BIOS within a few years, and
    that system administrators with a good reason to configure and compile their own
    firmware will be able to do so sooner than that.


    One good reason for system administrators to replace proprietary BIOSes with OpenBIOS,
    when it stabilizes, is that the former do not provide for booting over the network,
    which the latter will. This will facilitate the installation and upgrade of large
    numbers of PCs.


    LILO is a small piece of software that exists to control which kernel will be
    loaded and booted. The system administrator determines which LILO will present
    to the user at the console during booting. The choices may include one or more
    Linux kernels and one or more other operating systems. LILO also provides the
    system administrator


    +   ¹ The Compaq Alpha Microprocessor is an exception. It fetches the first few
    instructions from a serial ROM (SROM), through a dedicated interface, before transferring
    control to conventional ROMs.'
