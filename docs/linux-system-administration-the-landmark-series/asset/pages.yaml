  md: '# Securing the Organization


    Most security efforts, at the policy and enforcement level, are aimed at denying
    access to unauthorized users. While this is a sensible objective, most security
    breaches are perpetrated by authorized users. A firewall is a useful adjunct to
    securing an organization, but it provides no security whatsoever against the principal
    threat. This section takes a broad view and provides measures for securing the
    organization from both the Internet and internal users while providing the services
    to conduct business.


    # The Internet


    Nearly every organization operating LINUX systems has a business reason to connect
    to the Internet. Because the Internet includes potentially hostile adversaries,
    competitors, crackers, and spammers, most organizations enforce a policy specifying
    the sorts of traffic that may come in and go out to the Internet.


    The basic mechanism for enforcing an Internet security policy is packet filtering.
    External routers are configured to let packets matching an acceptable profile
    pass to reject other packets. For example, packets to initiate a session from
    an unknown system outside the company to a system inside would be rejected at
    most sites.


    Packet filtering alone would suffice to provide security against threats from
    the Internet if there were not a requirement for services. Services that are too
    dangerous to allow in and out freely are often prevented indirectly, by a firewall.


    The firewall is located outside the packet router and is configured to act as
    an intermediary between internal systems and the Internet. The firewall is trusted
    by internal systems, even though it is expected to come under attack. Therefore,
    the firewall should be configured to provide only a limited set of services. Only
    required software should be installed on a firewall. Its log files must be examined
    carefully every day, and it should never store sensitive data. A firewall should
    be configured to accept logins only on the console or from trusted hosts via secure
    protocols as ssh. Ideally, system partitions are on a disk that is write-protected
    by a hardware jumper. /tmp and /var need to be mounted read-write. The /etc directory
    includes some files that must be read-write, but of /etc should be write-protected.
    This can be done by placing the files that must be read-write in a directory on
    the read-write disk where /tmp and /var reside, with links from the /etc directory
    to the files.


    The packet filtering software that may be compiled into the LINUX kernel is iptchains.¹
    Note that iptchains simplifies the kernel''s packet filtering tables—it does not
    require the interface to be configured.


    Virtual private networks (VPNs) may be set up over ordinary Internet connections
    by configuring FreeS/WAN² into the kernel. When two hosts both have Free/WAN enabled,
    all IP packets sent between them must be strongly encrypted. This is highly


    +   1. This is true for 2.2 and later kernels. 2.0 kernels used a different packet
    filter called iptfw.

    2. http://xs44.nl/~freeswan'
