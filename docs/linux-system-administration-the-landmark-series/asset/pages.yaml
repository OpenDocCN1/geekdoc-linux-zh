  md: '# Titles and Roles


    Many people whose primary job responsibilities include the administration of a
    Unix or Linux system don''t have the title system administrator. In fact, system
    administrator doesn''t appear in the Dictionary of Occupational Titles [26] at
    all. According to a survey done by SysAdmin Magazine, over 70 percent of their
    subscribers were primarily responsible for managing one or more UNIX systems had
    other job titles.


    SAGE, the System Administrators Guild, discusses this in detail in their Job Descriptions
    for System Administrators [28]. SAGE is a special technical group within the USENIX
    Association. Its mission is to promote the recognition of system administration
    as a profession and to develop standards of nomenclature, training, and possibly
    certification within the field.


    Looking at the SAGE Salary Survey, we find that their membership lists over a
    hundred job titles. In some cases this is due to simple bureaucratic nomenclature,
    while in others reflects real differences between system administrators'' responsibilities.


