  md: '# Boot Troubles


    # 257


    The boot secondary bootloader code is called by the MBR''s primary bootloader
    code to boot a LINUX kernel image. All of the image= directives in a lilo.conf
    file implicitly use this loader.


    The chain bootloader code is used to boot MS-DOS and other similar systems. It
    is used by other= stanzas in the lilo.conf file. Individual bootloaders can be
    set for specific stanzas using LILO loader= directive. The read LILO Technical
    Guide and the Multiboot Using LILO mini-HOWTO2 and LILO mini-HOWTO3 for details.


    # BIOS Drive May Not Be Accessible


    Warnings: BIOS drive 0x82 may not be accessible


    suggest that some stanzas in lilo.conf refers to image and operating systems on
    a drive other than the first two on the primary controller. lilo.conf is configured
    to boot from a third device, or a drive on a secondary controller.


    Some PC BIOSs, and secondary SCSI firmware, can access some devices beyond the
    first two on the primary controllers. This is very system-specific.


    This message from Lilo is just a warning. No harm should come from trying it on
    a newly installed system. Indeed, so a rescue floppy is handy, is a harmless experiment.


    If the system cannot boot that image rearranging the partitions to fit the bootable
    partitions on either of the first drives. Failing that, consider using an alternative
    bootloader as LOADLIN.EXE or the GNU GRUB package.


    # Damaged, Infected, or Corrupt MBR


    If the master boot record or partition table (which is actually part of the MBR)
    becomes damaged, it will not have affected any of the filesystems or data on the
    rest of the drive.


    Foresight can make this job trivially easy. In other words, as with so many other
    emergencies, an ounce of preparation before the damage occurs is worth many pounds
    of recovery effort.


    The MBR and partition table can be backed up with a command like:


    ```

    dd if=/dev/hda=$BACKUP_FILE count=1

    ```


    where /dev/hda is a reference to the first IDE hard disk (alternatively, /dev/sda
    for the first SCSI hard disk) and $BACKUP_FILE is an arbitrary filename /root/hda-mbr.bin.
    Here the block size is 512 bytes. Set the count to just one, because we want only
    one copy. If we failed to do that, then the dd command would default to dumping
    the contents of the entire disk.


    +   2. http://metalab.unc.edu/LDP/HOWTO/mini/Multiboot-with-LILO.html


    +   3. http://metalab.unc.edu/LDP/HOWTO/mini/LILO.html'
