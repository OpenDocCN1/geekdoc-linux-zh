  md: '# The Data Center


    Data centers are built to ensure the reliable operation of servers by providing
    ease of networking, more reliable power and cooling, and physical security. Access
    should be granted only to persons with an essential business need.


    Access to the data center should be controlled by a card key entry system. This
    provides a log of each person entered. It also provides a mechanism for canceling
    access without changing locks and reusing keys.


    The cabinets used in data centers typically have low-security locks. In large
    data centers where many persons have access, these may be used to keep system
    administrators, network administrators, and electricians out of cabinets to which
    they should not have access.


    # Securing Systems


    Securing the computing resources of an organization depends not only on arranging
    systems to provide security. Each system, individually, must also be secure. This
    section offers guidelines for securing individual systems.


    # Configuration


    The general configuration strategy for enforcing the security of a system is to
    disable all unneeded services. Check the /etc/inetd.conf file for services that
    are not needed. Also use /etc/inetd.conf to limit services to those that are needed.
    Make sure the appropriately secure /etc/inetd.conf file is part of each system
    profile. See Chapter 14, "System Profiles."


    The services that are provided should be protected by means of TCP wrappers. To
    begin with minimum security, create the file /etc/hosts.allow containing


    ```

    ALL: LOCAL

    ```


    and create the file /etc/hosts.deny containing


    ```

    ALL: ALL

    ```


    Most sites will need more complex /etc/hosts.allow and /etc/hosts.deny files in
    order to limit particular services to hosts or domains within the organization.
    Unless the system is located outside the firewall and intended to provide external
    services, such as WWW or ftp, services should not be provided to hosts outside
    the organization. Consult the man pages for information on other options.


    Use the command netstat -na to list the TCP ports that are accepting connections.
    Each is followed by the word LISTEN. Look up the port numbers in /etc/services
    to see which service is using each port.'
