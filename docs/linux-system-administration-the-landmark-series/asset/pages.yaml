- img_proc: true
  md: 'conventions. If the maps are stored in an alternate location, the directory
    must be specified with the -D flag. As an example, /etc/init.d/ypasswdd would
    be modified to read /etc/init.d/ypasswdd -D /var/yp/maps.


    These tools are often sufficient to manage NIS in a small environment. However,
    there is no mechanism to prevent two system administrators from simultaneously
    editing files, resulting in data loss. In large environments where multiple system
    administrators manage the same NIS domain, a mechanism is needed to manage access
    and updates to these files. Typically, a front end is written to manage concurrent
    access by interacting with the Revision Control System (rs). This technique has
    several advantages. First, rs manages access to the files by checking the file
    into and out of the rs system. Second, previous versions of NIS map can be recovered.
    Finally, rs can provide an audit trail. This is useful when the origin or time
    of introduction of a map needs to be researched. The NIS front end program also
    must interact with ypasswdd (and possibly shadow password) file.


    # NIS Database Distribution


    As described, the NIS Make invokes ypfd to distribute the maps to the slave servers.
    Optionally, the master may also run the ypffr daemon which registers itself with
    the portmapper and waits for map requests. If ypfkr is running on the slave, it
    checks for the presence of the ypffr program and will use it if present. Otherwise,
    the ypffr program makes a ypcall(3) remote call to transfer the map. The ypffr
    mechanism is far more efficient for a large NIS environment.


    # Custom NIS Data


    The standard data distributed via NIS is briefly described in Table 21.1. Specific
    sites may choose to share some, none, or all of maps. The best results—independence
    for users and programs—are obtained by using the full set of these maps.


    In addition to data, system administrators may choose to distribute additional
    maps via NIS. The most common of these maps are automunter maps for use by autof(8).


    However, the data distributed via NIS is not restricted to those formats understood
    by the existing applications. Nothing prevents a site from maintaining and distributing
    custom data via NIS. The applications that use these data have to be programmed
    to explicitly retrieve the data via NIS.


    # Implementation and Interoperability


    The original SunOS NIS implementation used the db libraries, which imposed a 1000-byte
    limit on the size of data objects. Most UNIX vendors mimicked this implementation,
    including the size limitation.'
