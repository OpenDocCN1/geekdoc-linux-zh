- img_proc: true
  md: 'Note that only the primary hard disk (/dev/hda or /dev/sda) has boot code in
    its MBR. All other drives will have partition tables, but the rest of the MBR
    will usually be empty. Nevertheless, it''s a good idea to save information about
    all of the partition tables on a system (They only take a half kilobyte each.).


    To restore a master boot record, simply reverse the if and of parameters in the
    dd command, so it looks like this:


    ```

    dd of=/dev/hda if=$BACKUP_FILE bs=512-count=1

    ```


    A partition table can also be rebuilt by using information previously saved or
    printed with the fdisk -l command. It''s a good idea to store one copy of inside
    the system case during initial setup (it can''t easily be misplaced as the system
    gets moved around).


    Naturally, it is likely that the system will not be booting properly when it is
    time to use these spare boot record codes. You''ll want to copy these .bin files
    to your rescue diskettes (boot root) and to any alternative root filesystem on
    each system.


    These files are in binary. They are not human-readable and cannot be edited with
    normal text editors. So it is also handy to store a human-readable list of all
    of the partitions, with their sizes and locations. This is easily accomplished
    using these commands:


    ```

    fdisk -l

    mount

    ```


    Just redirect the output into any convenient file. Also put the output from these
    commands in the /etc/README files. The mount command provides a mapping between
    the partitions and their mount points, indicating what should be on each partition.


    Restoring the partition table (the last 66 bytes of the MBR for every drive) can
    be a bit trickier if you don''t know what partitions were.


    If you find the beginning of any ext2 filesystem, use fdisk to create a partition
    starting at that point and extending to the end of the drive. If the partition
    is larger than the filesystem, the Linux filesystem drivers and e2progs utilities
    will not complain and will not access the regions of that partition lie beyond
    the end of the filesystem. You can then go back into fdisk and adjust the size
    to the next cylinder boundary beyond the end of the real filesystem''s size. From
    there, try to find the next filesystem (use a calculator figure where it should
    end). From starting a new partition just beyond the one that you''ve recovered).
    Stepping past the first recovered filesystem one cylinder at a time until fsck
    reports success finding a filesystem.'
