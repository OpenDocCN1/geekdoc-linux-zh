  md: '# Ownership


    Another problem with restoring systems from backups concerns the ownership of
    the files. When items are extracted from a tar file as root, the GNU tar utility
    attempts to restore the ownership (user and group) of each file, if the -p (--preserve-permission)
    switch is specified. Otherwise, tar will use the settings of the current UMASK.
    However, if the users and groups listed in the tar file do not exist, the ownership
    will not be properly set!


    Thus, ether NIS service or the /etc/passwd and /etc/group files must be restored
    before any non-root system files.


    As''ve seen, a number of factors about the restore process must be considered
    prior to implementing a backup process. During multi-user operating systems, the
    meta-data (information about the file) is often as important as the data (information
    in the file). When Linux is used as a workstation, with only a single user on
    the system, the proper functioning of many programs and subsystems depends upon
    the ownership and permissions of the system files.


    # Media


    The tape systems used by Linux system administrators today typically connect to
    their host via a SCSI interface and have one or more drives to handle one or more
    tapes of 4mm DAT, 8mm Exabyte, 8mm AIT, or DLT form factor. The number and type
    of tape will be chosen after determining the quantity of data to be backed up,
    keeping in mind the data transfer rate. Always assume that capacity requirements
    will at least double during the life of the tape system.


    Tapes have a life of several years. When data must be preserved for longer periods,
    another medium must be chosen. Media with a life span of ten years or more include
    CD-R, CD-RW, DVD-R. Cost considerations preclude the use of magneto-optical as
    an archive medium. CD-R has been the medium of choice, but the increased capacity
    and declining costs of DVD-R presage its widespread use for archiving.


    # Testing


    In the experience of the authors, most backups that untested turn out to be irrecoverable.
    Going to the effort of backing up data and then not verifying that it can be restored
    is worse than not doing backups at all. It is likely to provide a false sense
    of security while wasting time and money. Therefore, we recommend testing the
    restore procedure prior to relying on backups.


    Consider an experiment you might run on one of your systems. Don''t really think
    about it!


    ```

    cd / : chown -R nobody

