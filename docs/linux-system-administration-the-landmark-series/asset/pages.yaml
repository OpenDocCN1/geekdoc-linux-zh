    # 9 Booting and Shutdown


    LINUX BOOTING AND SHUTDOWN PROCEDURES are powerful, flexible, and complex. System
    administrators should be familiar with the software components involved in booting
    and shutdown, the role each component performs, and how each may be configured.


    Machines will occasionally fail to boot. This may happen for a variety of reasons,
    including hardware failures, network failures (including server processes that
    are not running), and software configuration errors. An intimate understanding
    of the system startup procedure is needed to isolate the cause of a boot failure.


    Lesser problems may also strike during booting. For example, a machine may complete
    the boot sequence without striking an essential service. This machine will be
    running, but it will not be doing its job. Familiarity with the boot sequence
    will be needed to solve the problem.


    Finally, the system administrator may be required to start a new server on a system.
    Software packaged with rpm may insert the files needed to start and stop the server
    automatically, while other software distributions may require the system administrator
    to write custom scripts to integrate a new server into the system startup process.'
