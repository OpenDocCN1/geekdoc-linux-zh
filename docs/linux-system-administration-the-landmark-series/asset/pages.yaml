    your assistants, and so on


    +   - Clarify the lines of authority


    +   - Inventory the resources for which you''re responsible:

    - Networks

    - Servers (hosts)

    - Peripherals and other equipment (hubs, routers, and so on)

    - Services (file, printing, email, and so on)

    - Applications and subsystems

