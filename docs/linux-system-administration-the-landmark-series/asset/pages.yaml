  md: 'regular file A file that is completely ordinary; It is neither a character
    special nor block file, nor a FIFO, nor a socket.


    RFC Request For Comments. These are documents that propose standard practices
    and protocols for all Internet practices. They are drafted by interested parties
    and submitted to the IETF, where they are assigned to working groups and subjected
    to a relatively simple and open review, refinement, and adoption process.


    All of the major Internet protocols and formats are defined by RFCs. This is of
    primary interest to programmers who write clients or servers to implement these
    protocols. Thus, a programmer working on a new mail user agent (MUA) or mail transport
    agent (MTA) should pay close attention to RFC 822, which defines mail header formats
    and options.


    Most RFCs are not directly relevant to system administrators. However, some administrators
    should be familiar with how to find and read RFCs, because some are essential.
    More information is available at http://www.iet.org/rfc.html


    Note: Some RFCs are written and never adopted, and some are adopted but never
    implemented by any significant number of sites. The intent of the RFCs is to promote
    and ensure interoperability among packages that implement a given protocol, and
    stable interaction between sites that are using these protocols.


    RISC Reduced Instruction Set Computer. This is a class of CPU designs including
    the SPARC, PowerPC, and MIPS processors. It is distinguished from CISC (Complex
    Instruction Set Computer) by a design philosophy that emphasizes high-speed execution
    of relatively simple instructions over availability of a large set of “powerful”
    language instructions.


    This design philosophy holds that the complex operations are best done in software,
    saving space on the CPU chip for registers, caches, pipelines, and other performance-enhancing
    features.


    shared library: libraries are object files that are dynamically linked to executable
    binary programs (binaries). They are analogous to Microsoft Windows DLL files.
    Under Linux, shared libraries can be stored in directories (usually under /etc/ld.so.conf).
    Shared libraries typically include files under /usr/lib and /usr/X11/lib. If the
    shared libraries are deleted or become damaged, or if the /etc/ld.so.conf file
    is corrupted, then programs that rely on them (dynamically linked) will fail to
    execute. Almost all normal programs on a system rely on lib (libc), so a damaged
    library usually requires a reboot (with a rescue diskette) for recovery.


    There are three primary advantages to shared libraries. They reduce program size,
    saving disk space. They reduce the memory footprint, allowing more programs to
    run in less RAM, because the LINUX kernel''s memory management system can use
    paging such that the shared library is actually loaded only once and is then shared
    among all processes using it. They can allow for “drop-in” upgrades'
