  md: 'To remount the root filesystem in read-write mode, use a command like this
    one

    (taking care not to include a space after the comma):


    ```

    mount -o remount,rw /

    ```


    If the layout of the system is unfamiliar, use the command fdisk -l to see a list
    of

    available partition entries. Often, the root will be the first native filesystem
    listed,

    while multiple root filesystems may be available. Keep mounting filesystems until
    a

    suitable /etc directory is found.


    It should now be possible to edit the /etc/passwd or /etc/shadow file (whichever

    contains passwords on the system) to remove the root password.


    Note that sometimes it is more difficult to remove the password than it is simply

    change it to a new value.


    PAM or any other authentication suite is configured to prevent null passwords,
    copy a

    hash corresponding to a known password. It does not matter whether the hash is
    copied

    from the same passwd file or from a different machine. The root account will now
    have

    tknown password.


    If the hard disk''s root filesystem is mounted on /mnt (the system was booted
    from

    rescue floppy), the chroot command can be used to allow commands passwd to work

    the intended copies of the passwd file. For example:


    ```

    cd /mnt usr/sbin/chroot . /bin/sh

    ```


    The example uses a relative path to the chroot command in case the rescue floppy

    does''t have a copy.


    Once the root filesystem has been mounted in read-write mode, and chroot has made

    t root for the shell process if necessary, the passwd command can be used to force
    a

    new password. This should also force any synchronized authentication methods/and

    dash hash files to be updated correctly.


    If the /etc/passwd file is corrupted, copy a new one from a similarly configured

    machine or from the rescue disk. Failing that, there may be an undamaged /etc/passwd,

    covery file, or other backup file available on the system. Note that this

    be missing recent entries. Examining the /etc/shadow (and on systems that are

    configured with one group per user, /etc/group) may indicate which users are using.

    NIS clients, there should be very few local user entries.


    Remember that the vipw command makes a backup of the passwd file during editing

    sessions. If the vipw package is properly installed, the /etc/rc.d/ scripts should

    check for the existence of a vipw backup and automatically restore it. These backup

    files should exist only while the vipw command is active, so the boot scripts
    are coded

    to presume that their existence indicates that a system was rebooted after a vipw
    edit

    session. Proper use of vipw can make it very unlikely that the /etc/passwd file
    will get

    corrupted in normal system operation.'
