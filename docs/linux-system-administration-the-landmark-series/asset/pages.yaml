  md: '# Glossary


    A system administrator should understand these terms in order to make sense of
    most of this book and of technical discussions in NetNews, on mailing lists, in
    man pages, and in many other contexts.


    Some terminology involves relatively obscure and subtle nuances (see the definitions
    of NAT and IP masquerading for example). System administrators must understand
    these differences and often be very precise in their use of terms. At the same
    time, they should be relatively forgiving and flexible in their interpretations
    of these terms, especially with users.


    For different, possibly conflicting, definitions of the Free Online Dictionary
    Of Computing at http://wombat.doc.ic.ac.uk/foldoc/, “The Linux Glossary Project”
    at http://glossary.linux-support.net/, or “Internet User’s Glossary” (RFC 1983)
    at http://www.cis.ohio-state.edu/htbin/rfc/rfc1983.html.


    For a broader, often humorous, compendium of terms and an extensive commentary
    on hacker culture in general, see the Jargon File


    ```

    http://www.tuxedo.org/-esr/jargon

    ```


