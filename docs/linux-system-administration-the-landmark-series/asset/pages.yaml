    # System-Specific Extensions


    As of writing, GNU tar and cpio don''t store "non-standard" meta-data specific
    to the ext2 filesystem. System-specific features like the ext2 attributes (immutable,
    dumpable, compressed, and bits) and the BSD UFS flags are neither stored in restored
    from standard tar and cpio files.


    As support for more of these features (access control lists or ACLs, privilege
    bits or capability sets, and others) is added to LINUX (and other UNIX implementations),
    tools will have to be enhanced to address these issues.


    # Using tar


    tar is one of the oldest and most commonly used archiving tools. It''s the most
    common format for distributing files over FTP sites and the like. Because most
    UNIX users are familiar with tar, we''ll compare all of the others to


    Old versions of tar had limitations regarding maximum filename length (typically
    100 characters) and device nodes (special files). Most of these have been eliminated
    in the GNU version. However, it is best to test your assumptions by relying on
    these features. One version of GNU tar within the last couple of years restored
    incorrect permissions on empty directories.


    We''re not picking on tar here. Similar problems may apply to any utility you
    may use (including commercial packages). Testing is the only way to be sure.


