  md: '![](img/ffdfa0821b4a8f1b49759a4b4d78044a_200_0.png)


    # 15


    # Automated Installation

    and Upgrade


    THIS CHAPTER IS NOT ABOUT how to install LINUX on a single computer—that is specific
    to each distribution and should be covered by the vendor documentation. This chapter
    is about how to install LINUX on thousands of computers.


    The general strategy is to boot each system to start an installation session from
    an appropriately configured install server. Information specific to each machine
    (such as a hostname and IP address) may be required. This information may be placed
    in one or more files before the new machine is booted, or supplied interactively
    during the install.


    The install server will generally have several profiles for different types of
    systems. At a minimum, the install server will have one profile for client workstations
    and for servers. Most will have profiles for more than one type of server, and
    some may even have profiles for more than one type of client. For details, see
    Chapter 14, “System Profiles.” Also note that for each system profile, a distinct
    install profile may be required for different hardware configurations.'
