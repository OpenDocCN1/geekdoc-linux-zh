    # Security


    Crackers who gain access to one system in a network usually gain access to many.
    They plant backdoors so that they can easily get back in if the original hole
    is closed and the root passphrase changed. The top target for a cracker is the
    build server. A backdoor installed in a build template is the ultimate penetration.


    To protect against such an exploit, the disks on which the templates and packages
    must be stored properly write-protected by means of a hardware jumper on each
    disk. The build server must be disconnected from the network before the jumper
    is changed to enable writes during the installation of new or updated profiles.
    It should be reconnected only after the disks are write-protected.


