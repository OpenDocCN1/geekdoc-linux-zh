  md: 'Apparent application sluggishness might also be due to a lack of available
    memory—or a disk drive that is also home to a busy filesystem (perhaps used by
    some other application). It could be that the system has a slow video card. For
    X WINDOW applications, the video card may be more important than the host''s processor
    and memory. Slow rendering of web pages is often incorrectly blamed on slow downloads.


    # Solutions


    Capacity problems have three general solutions: optimizing performance, adding
    resources, and reducing utilization.


    One solution to slow DNS lookups may be to provide a caching DNS server on the
    local LAN segment or on the local host. The trade-off is that this increases the
    utilization of memory, CPU, and disk space on the DNS server. Another solution
    may be to reconfigure a web server to not perform reverse lookups on each client
    for the log files. Yet another solution may be to upgrade the network. The best
    solution depends on local circumstances and the possible effects on other parts
    of the computing environment.


    # Performance Optimization


    Often, performance problems are not caused by hardware. Sometimes the application
    is working “harder” rather than “smarter.” For example, a web server may be spawning
    a copy of perl to generate every web page. Many sites have their document trees
    “dynamic” at great expense of CPU and memory. Some of these sites could provide
    the same information by generating static pages once or twice per day (via a cron
    job) than by dynamically rebuilding each page for each access. Another approach
    is to use the mod_perl module for the Apache web server. This loads the perl interpreter
    once and handles the scripts internally. Indexing, hashing, and caching may also
    be used to reduce the CPU overhead of many processes.


    Optimization of business systems and IT practices can greatly increase the efficiency
    of systems and capacity. For example, some sites use a central database to distribute
    their employee phone list. Some may provide a CGI/web front end to this database
    via their intranet web. In most cases, the data that a user hasn''t changed recently,
    so the most efficient method for providing this information is to periodically
    generate static pages from the databases.


    In our web/CGI-based example, there might be a link that allows any user to force
    a check against the database. So if an unexpected answer is received from the
    static pages (which may be a day old), the user can query the live database. Requests
    would be handled by the static pages, and only exceptional cases would impact
    the server’s load. Additionally, the statically generated pages can be cached
    throughout the organization, while replicating “live” databases is far more complex
    and costs a great deal more in terms of CPU cycles and (more importantly) administrator
    overhead.'
