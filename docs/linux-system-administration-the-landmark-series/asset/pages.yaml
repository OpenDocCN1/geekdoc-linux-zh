  md: '# NetNews


    Net News (NetNews) is the mainly of discussion forums on the Internet. Although
    it is being supplemented by chat programs like IRC (Internet Relay Chat), and
    webbased mail archive browsers, NetNews still handles most of the discussion traffic
    on the Internet.


    The Network News Transport Protocol (mtnp) is the mechanism by which news servers
    pass the latest postings to each other. There are two software packages to provide
    NetNews within an organization: INN^4 and mtp^5 which should not be confused with
    the protocol of the same name. INN is more widely used and more vigorously maintained.


    # Remote Shells


    Several programs are used to log on remote computers and establish an interactive
    session. The oldest and most popular is telnet, which is available for virtually
    any computer that runs IP. The r-commands, or remote shell programs, were written
    for the Berkeley System Distribution, and are available on most Unix systems.
    The r-commands consist of rsh, login, and rep are in general a huge security hole.
    The big advantage of host-based authentication is that no password challenge takes
    place. This permits r and rep to be invoked from shell scripts, allowing network
    tasks to be automated. The Secure Shell (ssh) utilizes public key cryptography
    to establish a session with an authenticated host. ssh extends the capabilities
    of the r-commands to include port forwarding and X Window display forwarding.
    This allows users to execute a variety of commands, with ssh to provide an encrypted
    path to a remote machine. The rsync file distribution utility and the cv version
    control system are examples of tools that can use the ssh command to provide themselves
    with a secure channel.


    # FTP


    The File Transfer Protocol is one of the earliest services provided on the Internet.
    It quickly became one of the most popular as well. Most FTP servers provide anonymous
    FTP, which allows anyone to access the shared portion of a server''s files. Care
    must be taken to limit the portion of the system that is accessible via anonymous
    FTP.


    System administrators who support FTP servers must aggressively monitor their
    systems for intrusion and tampering. The FTP daemon ftppd should be run chrooted
    on public servers. This reduces the possibility that the ftppd daemon itself can
    be exploited to alter or access sensitive files. Additionally, the ftppd daemon
    must be updated whenever new security fixes become available.


    +   4. http://www.isc.org/inn/


    +   5. http://www.academ.com/academ/nntp/'
