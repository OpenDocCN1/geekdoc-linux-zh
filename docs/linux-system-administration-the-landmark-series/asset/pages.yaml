  md: '# NIS


    All but the smallest installations will probably use NIS or a similar system to
    store user and group information. There are complications involved with using
    NIS and the shadow suite.


    Of course, NIS servers can provide shadow maps to clients. The objective of the
    shadow suite is to only allow root to view the encrypted passwords. ypserv.conf
    needs entries like these:


    +   * Host : Security : Passwd_mangle

    * : shadow.byname : port : yes


    This should ensure that non-root users who request the shadow map via NIS see
    only an x in the password field. The mechanism for determining whether or not
    the user making the request is root on the client machine is the port number.
    Only root should be able to use port number.


    Ifsecure machines (such as Windows NT)—with which any user can use any port—are
    present on the network, then the /etc/ypserv.securenets and /etc/ypserv.conf files
    must be configured to ensure that NIS maps will be passed only to Unix machines
    and not to any other machine that may request them.


    When loading NIS passwd map from a flat file, check that the mind variable in
    /var/yp/myfile is correct. Any user in the flat (such as root) with a uid less
    than the limit will not be loaded. The same is true for the mingid variable and
    the group map.


    # Large Databases


    Large installations are faced with complications that do not arise when the scale
    is smaller. Consider a site with 100,000 users and 100,000 workstations. DNS can
    easily handle name service—after all, DNS offers reliable name service for the
    whole Internet. But to maintain uid consistency? Maintaining 100,000 copies of
    a passwd with 100,000 entries is not feasible. Maintaining a single NIS domain
    with 100,000 entries in the passwd map.


    There must be a database of users, hosts, and so on from which NIS maps are pulled.
    The database must be configured to maintain data integrity. Additionally, permissions
    may be granted to each system administrator to change only the subsets of the
    data that are in their domain. Relational databases meet these requirements.


    One tool for maintaining a relational database of network information is MESA,
    a commercial product developed for SunOS/Solaris. It appears not to be marketed
    currently. Perhaps the creators can be encouraged to open the source code.


    > http://www.esm.com/'
