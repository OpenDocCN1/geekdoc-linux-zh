  md: 'Program Launch Troubles


    263


    # Programs Are “dumping core” (SIG 11)


    When a program reports that it has “dumped core” in response to a SIG 11 it means
    that the program attempted to execute an instruction that referred to memory that
    was not allocated to it.


    This is usually the result of a programming error. Often this is caused by attempts
    to dereference (use) an uninitialized pointer, or as a result of errors in pointer
    arithmetic. (Pointers are variables that refer to memory addresses.)


    However, when you see these errors from widely-used and well-tested programs,
    while performing common operations with well-known data sets, it usually indicates
    a hardware failure.


    For example, if an attempt to recompile the LINUX kernel using the current version
    of gcc fails with a message like “internal compiler error” and references to SIG
    11, it’s probably caused by unreliable memory.


    Unfortunately, it can be very difficult to detect intermittent failures in RAM
    chips. The systems are so complex that simple sequential “write, read, verify”
    passes memory may fail to exercise real hardware problems. Compiling kernels,
    and compressing, decompressing, and archiving/de-archiving large data sets can
    access memory in ways that simple software will not.


    For more information on this topic, visit the “SIG 11 Page” page: http://www.bitwise.nl/sig11


    Try running on other systems if it fails on one and not on others, and it will
    likely to be a hardware problem.


    If it is hardware, then to fix the problem, try installing new or different memory
    into the affected system. If it seems to stem from bugs in the software, have
    a programmer fix them (or report to the software’s maintainers). (Try linking
    the program with Electric Fence and running that. Electric Fence is a bounds-checking
    version of the standard memory allocation functions.)


    # root’s SPATH “Broken”


    This may seem like a silly thing to call an “emergency,” but some people are completely
    at a loss as to how to fix it. They should know that you can start any program
    by providing the full file specification to it—and that /bin/bin will get it into
    an order. Also, a command line


    ```

    export PATH=/bin:/usr/sbin:/usr/bin

    ```


    should suffice to get back up and running (for one session). Naturally, the /etc/profile
    and/or /etc/csh.for csh files will need to be edited. These are the files used
    by most common shells to configure their initial PATH settings. Usually the PATH
    settings will be reasonable, even in the absence of these files. There are defaults
    compiled into the init program, which is the ultimate ancestor of all UNIX processes.'
