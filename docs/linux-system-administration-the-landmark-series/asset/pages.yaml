  md: 'PostScript is a sophisticated language for describing text and graphics. It
    can generate very high-quality output. Most word processing and other office applications
    for LINUX and UNIX can generate PostScript output.


    However, when using PostScript printers, we often face a problem just plain text.
    Most printers will reliably detect whether a given print job is in ASCII or PostScript
    format. However, it''s often wiser to rely once again on the filtering provided
    by our LINUX printing subsystem


    Several filtering packages for LINUX convert ASCII to the equivalent PostScript.
    They prepend and append bits of PostScript code around each page of the text (Most
    of their internal complexity stems from tracking those page boundaries).


    The most common packages for LINUX are apsfilter by Andreas Klemm, the public
    domain Ghostscript, its gnuscript clone, and H.P. Anwin''s magfilter. These are
    sophisticated packages that can do a bit of additional filtering. A given server
    would use only one of them. Most can automatically detect the type of file being
    printed. This allows one to specify any sort of file to an lpr command, even listing
    compressed formats. DVI and PostScript files, and various sorts of graphics.


    Prior to the introduction of "magic filtering" (where the magic numbers, those
    recognized by the lpr command are used to automatically detect the format of data
    as it passes into the print queues), every user invoking the lpr command had to
    supply to their command manually specify this information. Each application that
    invoked lpr also had to be written and/or configured to pass these arguments to
    the command.


    The various "magic filtering" packages we have described seem overly complex.
    However, they greatly simplify the use of printers for non-trivial document formats.
    In the long run, the benefits easily translate to fewer Help Calls to the system
    administrator (despite the incumbent hassles of initially installing and configuring
    these systems).


    Because of the flexibility of these auto-detection features, these packages are
    also frequently used with non-PostScript printers. They will still generate PostScript
    output, which they feed into Ghostscript.


    Ghostscript is a package that implements the PostScript programming language in
    its own software. Normally, a PostScript printer has a relatively powerful CPU
    and a bit of its memory. For many years, the PostScript printers in many offices
    were more powerful than any of the desktop computing systems and most of the early
    NetWare servers. With Ghostscript, the PostScript processing is done by the host
    system and translated into the page description language (control and escape sequences)
    of any Ghostscript-supported printer. PostScript is used as an intermediary


    ```

    4. http://www.freebsd.org/andreas/@APSFILTER

    5. http://www.lcs.mit.edu/magnus/nenscript/

    6. http://www.gnu.org/software/enscript/enscript.html

    7. http://www.gnu.org/software/ghostscript/

    ```'
