  md: 'Note that these risks must be assessed from the standpoint of the impact they
    will have on the business, not just the impact they will have on the computer
    systems.


    Here we list some common risks that system administrators face. Most system administrators
    will require a plan for coping with all of them, but some will find that the need
    for preparedness for some kinds of disasters doesn''t justify the cost.


    # User Error


    The most common disaster from which recovery is needed is the deletion or overwriting
    of a needed file. In an ideal world, this would never be a problem because all
    filesystems would support journaling, and users would be able to recover from
    these errors themselves. The good news is that progress is being made toward journaling
    filesystems for LINUX. In the meantime, system administrators must be prepared
    to recover files for users who delete them. In large organizations, the system
    administrator''s department could bill the user''s department for each restore.
    This encourages users to be careful, and to only request files that are really
    needed, which is an economy for the organization as a whole.


    # Administrator Error


    Nearly as common as accidental deletion by users is accidental deletion by administrators.
    While system administrators are generally far more careful than ordinary users,
    they use commands that are inherently more dangerous. Thus, when a system administrator
    errors, he often does so on a greater scale than any user could. Again, better
    filesystems will help here, but not necessarily to the extent as with the sort
    of single file deletes that beset users.


    System administrators should be in the habit of stringent commands using double
    ampersands rather than semicolons. This ensures that, for example, if a cd fails,
    the following rm will not execute in the wrong directory. As we discuss in Chapter
    11, "Scripting," scripts are an even better way to reduce the likelihood of a
    typo causing a disaster.


    Also, system administrators should always use absolute paths. Some commands may
    have different intents in different locations in the filesystem, and invoking
    the wrong one may be consequential. The use of absolute paths affords protection
    against Trojan Horses.


    +   6. Some versions of UNIX have been implementations of cd which did not return
    a failure status. This should not be a problem with LINUX, but it is always appropriate
    to test such things before relying on them


    +   7. Like most absolutes, this has exceptions. Consider a link foo ->../usr/bin/foo
    in the /bin directory. An absolute link does the wrong thing if this system disk
    is mounted under /mnt, perhaps for recovery or building.'
