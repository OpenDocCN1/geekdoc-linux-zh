  md: '# Shutdown


    It is important that LINUX systems be shut down correctly. Simply turning off
    the power will leave a LINUX system in an "unclean" state. In other words, disk
    buffers will not be flushed, files will not be closed, and filesystems will not
    be unmounted. The shutdown or reboot command to cleanly shut down a LINUX system.
    The shutdown command is the preferred mechanism.


    The shutdown command calls init to change the runlevel to 0, 1, or 6, depending
    on the options with which shutdown was invoked. The shutdown man page for option
    details.


    When init is called to change the runlevel to a more quiescent state—typically
    single-user mode or a shutdown—init invokes rc, which executes the scripts in
    /etc/rc.d/rc (where N is the new runlevel). In the case of a shutdown or reboot,
    most of these scripts will begin with a K, indicating that they kill a subsystem
    process or processes. They will be executed in numeric order, shutting down the
    processes in the prescribed order.


    Systems may optionally be powered off when halted. Intel systems may be powered
    off if both the hardware and the kernel support Advanced Power Management (APM).


