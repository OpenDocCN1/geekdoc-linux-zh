- img_proc: true
  md: '# root Exploits


    Once an intruder gains root access to a system, he will have the ability to remove
    or alter evidence of the break-in. The intruder will also have the ability to
    install back doors into the system so that he may come and go unnoticed at a later
    date.


    By monitoring the system and the normal activities associated with a system, it
    may be possible to correlate unusual activities to an actual break-in. This is
    one why reviewing the log files is such an important component of security enforcement.
    Remote logging via syslog helps ensure the integrity of log information during
    attacks.


    # Traps and Trojan Horses


    A number of publicly available software packages were written to raise user consciousness
    about installing back doors into systems. The best known is rootkit, of which
    there are many variants. Search the Internet to find the latest versions, and
    experiment with them on your own systems to gain an understanding of what is possible
    and how to thwart and detect them.


    It is wise to assume that privately held software packages have more advanced
    capabilities than those that can be found on the Internet. Do not assume measures
    to detect the public versions will detect all versions.


    # Denial of Service


    Denial of service attacks attempt to shut down or render useless a computing service.
    Some denial of service attacks crash a system, whereas others overload it that
    it cannot provide service to legitimate users. Some attacks affect only one service;
    others affect an entire system or network.


    Most denial of service attacks fall into two classes: those that exploit a bug
    in the network stack and those that exploit a weakness in the protocols. Other
    attacks include fork bombs, which consume all the available memory or file descriptors,
    and attacks on particular network applications, such as the X Windows system.


    The only defense against denial of service attacks that exploit bugs in the network
    stack is to stay abreast of full-disclosure security mailing lists, as BugTraq.
    CERT should not be exclusively relied upon because they do not disclose many of
    the exploits reported to them. Once a bug has been reported and a patch posted,
    the patch should be applied, starting with exposed systems as firewalls.


    Typical attacks of exploit weaknesses in a protocol involve packets sent with
    forged destination and return addresses. One of these is a broadcast address.
    Thus, a small number of packets sent by an attacker results in a large number
    of packets bouncing back and forth between the two forged networks.


    > 4. The home of BugTraq is http://www.SecurityFocus.com/'
