    \ read mail that may be business-related, whether that arrives in a paper envelope\
    \ or an electronic one. In each case, it is often possible to distinguish business\
    \ mail from personal mail from the envelope—but not always. A clear policy must\
    \ be in place. At minimum, it should establish that the company owns all received\
    \ mail and has the right to read all received mail. It should also specify the\
    \ circumstances under which that right will be exercised.\n\nThe objective is\
    \ to ensure that the system administrators not the organization may be prosecuted\
    \ for taking reasonable actions, as well as fairly let everyone know what is expected\
    \ of them and what they may expect. Laws among many jurisdictions and over time,\
    \ it is appropriate to have the draft policies reviewed by legal counsel.\n\n\
    The objective should not be to prohibit use of email, but rather to make clear\
    \ that privacy is not offered by corporate policy. Some organizations have made\
    \ it a dismissable offense to receive \"offensive\" email. This is just another\
    \ example of hiding a \"terminate for any cause\" clause in an email policy. You\
    \ may receive email from unknown persons who found your address in mail that forwarded.\
    \ Determining how the address came to be known to the sender is usually impossible.\
    \ Therefore, persons should never"
  merge: -1
  pgno: 237
- img_proc: true
  md: 'be held responsible for email mail they receive, even if the email received
    would have been illegal to send.


    Also, the current email infrastructure of the Internet makes it easy to send mail
    pseudonymously. Therefore, care must be taken before holding someone responsible
    for email he appears to have sent, because heinous email is likely to have been
    sent by someone whose name does not appear in the headers.


    Many organizations will want to archive all incoming and outgoing mail. The presumption
    should be that deleted messages are more than a week old, the probability of ever
    having to refer back to them will be low. Therefore, email should be archived
    on read-only media that is kept offline, such as DVD-R. Each departmental mail
    server should separately archive incoming, outgoing, and local mail. This should
    obviate any need for the external mail servers to archive mail they receive.


    Accordingly we recommend that employees maintain personal email accounts outside
    the control of their employer. Many such accounts now offer http access, making
    them easy to use from any browser.


    # Privacy Ethics


    While organizations must maintain the right to read email, system administrators
    should strive to respect the privacy of users. We suggest that system administrators
    who are requested to read the files or email of others insist that a reasonable
    attempt be made to inform the user. Each request should be made in writing and
    should refuse include what specifically is to be sought and the purpose of the
    search. The authors refuse to provide access to email unless corporate security
    officers and/or law enforcement officials are notified and present. Members of
    SAGE are also expected to abide by the set of professional ethics published by
    the organization.


    If a system administrator wonders whether or not reading someone''s mail is justified,
    it probably is not. When it is justified, it will be obviously justified, and
    managers should not hesitate in signing their names to the directive. Each of
    the authors has taken a risk over this issue, and none of us have any regrets
    about having done so.


    # Troubleshooting Electronic Mail


    Debugging email problems test the depth of a system administrator''s skill and
    the breadth of his experience. A vast array of problems can occur at the source,
    destination, and any intermediate point in the mail message. Additionally, problems
    related to routing or capacity have a tendency to snowball, creating problems
    larger in scope than the original failure. The system administrator must quickly
    identify which component is failing on which host to minimize the effect of these
    types of problems.


    When confronted with a mail problem, the first task is to gather information on
    the scope. If one user complains about not receiving mail, immediately check to
    see if other users have the same problem. If multiple users complain about the
    same problem, the'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'system administrator must attempt to find a correlation. They all use the same
    mail server? Are they all on the same subnet? Hopefully, the system,administrator
    will gain a good feel for the scope of the problem and use this information to
    focus the initial troubleshooting effort.


    Begin the actual troubleshooting by identifying which subsystem is failing. Is
    it the user agent, the transport agent, or the delivery agent?


    If mail is bouncing, read the error message in the bounce. This sounds inside,
    but most junior and intermediate system administrators fail to read the error
    messages. If the error message doesn''t make the first time, read it again. Almost
    all bounces really do indicate the source of the problem. Also, be sure to inspect
    the full message headers. Most mail user agents suppress the display of most header
    information, so you may need to turn this behavior off or look at the mail directly
    with a text editor.


    If mail is slowing down, look for mail routing loops. All mail transport agents
    provide logging facilities, and the logs should be inspected for useful hints.


    Because failures and misconfiguration of NIS or DNS can lead to mail failures,
    don''t limit the search to only the mail server. Check for full disk partitions
    as well.


    Be flexible in your approach—if a theory is not working out, backtrack and re-examine
    the symptoms. Also, if the source of the problem leads out of your administrative
    domain, try to alert the postmaster for the machine(s) in question. Remember,
    users don''t really care about the arbitrary boundaries created by corporations
    and their support organizations. They just need their mail to work.


    We present a few of the common problems organized by component.


    # User Agent Problems


    +   - Bad recipient addresses. This kind of failure generates a user unknown bounced
    mail message, sometimes several days after the message was sent. A good directory
    service can virtually eliminate this problem within an organization, but there
    will be always undelirable addresses on the Internet. Sometimes a mail administrator''s
    job is to inform users. "Yes, that email address doesn''t work."


    +   - Sender addresses. This results in mail that cannot be replied to. User agents
    often let the user configure the return address when sending mail. Users may get
    this wrong, especially if the upper-level mail servers do a lot of header rewriting.
    Check message headers to see if the sender addresses match in the envelope and
    the message.


    +   - Corruption of mail folders. This can occur due to bugs in the user agent,
    full disk conditions, or bad interactions with mail delivery agents.


    # Transport Agent Problems


    +   - Bad mail aliases. These can result in bounces and loops. Definitely try
    to avoid bounces on the names mail-daemon, root, and postmaster, because these
    can lead to serious loops.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '+   - Bad rewriting rules. This can lead to the corruption of email addresses,
    and looping. Test configuration files thoroughly before deploying them.


    +   - Failure to accept mail or queue mail. Frequently caused by full disk or
    high system load conditions, and a common secondary effect of the other aforementioned
    problems.


    +   - Hangs during operation. Most commonly caused by NIS or DNS failures, and
    occasionally by corrupted password or group files.


    # Delivery Agent Problems


    +   - Corruption of mail folders. This can occur occasionally as a result of a
    buggy delivery agent, but it often occurs in conjunction with other delivery agents
    or a user agent. The most common cause is two programs accessing a mail folder
    simultaneously but using incompatible file locking mechanisms.


    +   - Agent hangs during delivery. Most likely caused by file locking problems,
    especially if the mail folder is mounted via NFS. The authors strongly recommend
    against NFS exporting and mounting of mail spool directories.'
