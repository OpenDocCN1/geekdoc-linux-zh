    reads a configuration file (/etc/lilo1.conf by default), and then "links" the
    boot loader and map files, and installs the needed code into the specified disk
    blocks.


    LILO is probably the most confusing element of a basic Linux installation. It
    helps to think the /sbin/lilo1 command as a "compiler" and the /etc/lilo1.conf
    file as a program that gets compiled, with a set of "directives" that affect where
