  md: '# Chapter 16 User and Group Administration


    +   - Kill all processes owned by the user.

    - Search other databases that might have account information, such as NDS, NT
    domains, RADIUS (remote access), or any Kerberos ticket servers.


    Unless the user is a skilled cracker actively trying to thwart his removal, the
    user will be deleted. If any of the removed files or entries or any processes
    left by the deleted user appear again, change the root password, check cron and
    jobs, and repeat the deletion process.


    This procedure may be fine for schools and ISPs, but it is unlikely to meet the
    needs of any business left with the account of a departed employee or contractor.
    Many of the files are valuable to the business. The employee may someday return.
    An important business process may depend on a cron job run by—cron jobs on which
    business processes depend should be owned by pseudo-login.


    Businesses will generally not want to delete the accounts left by departing workers.
    Rather, they will want to disable those accounts, preventing their active use
    by preserving the files until they are adopted by others. We recommend that the
    user''s home directory has permissions to mode 0 a few days or a week before the
    directory is actually deleted. This should catch any dependencies on files that
    would break upon their deletion.


    # Disabling Users


    Disabling a user''s account without deleting it is a matter of ensuring that all
    authentication mechanisms will not permit anyone to execute processes owned by
    that user. This is not a simple process, because UNIX does not have a unified
    authentication model.


    Any process that runs as root can do anything as any user. One of the consequences
    is that any process running as root can implement any authentication mechanism.
    Increasingly, software written for LINUX uses PAM (Pluggable Authentication Modules),
    but much software does not. Therefore, the procedure for ensuring a disabled user
    will not be authenticated depends on the software installed at the site.


    The first thing to do when disabling an account is to prepend a character such
    as * to the password field in the shadow file or map. Adding a character that
    cannot be generated by the hashing algorithm (using md5 is far more secure than
    crypt) should disable any authentication based on the password entry. Another
    method of disabling password-based authentication is to expire the password. Test
    any procedure to be sure that it works as expected. Here are some additional steps
    we recommend for most sites:


    +   - Remove or disable any authentication credentials, as those of Kerberos,
    that may be in use.

    - Change the default shell to /bin/false.

    - Change the user''s shell to a binary—not a script—which may be called /usr/sbin/nologin.
    This should contain only a few write()s and one exit()'
