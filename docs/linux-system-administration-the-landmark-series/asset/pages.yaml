  md: '/var/log/messages. As soon as you start your troubleshooting foray, choose
    an otherwise ideal virtual console or open an extra xterm with a shell session
    on the print server (and any one of the affected client systems for networking
    problems) and issue a command like this:


    ```

    tail -f /var/log/messages

    ```


    Error messages and warnings can then be monitored as they occur. The lpd daemon
    may need to be restarted with the -l (logging) option. Also, a copy of trace can
    be attached to the running lpd process using a command like


    ```

    trace -p 132

    ```


    where 132 is the hypothetical PID (process identification number) of the lpd daemon.
    Unfortunately, the error messages from lpd are often cryptic and usually not helpful.


    The system administrator who spends the time and energy to become proficient at
    configuring and troubleshooting print systems will be indispensable in most organizations.
    When the system works, it works well and tends to be reliable. When it is broken,
    it is one of the most frustrating and difficult sorts of problems a system administrator
    will face.


    # Winprinters


    By far the worst and most common cause of printer problems at this level are the
    infamous winprinters or Microsoft Windows GDI "driven" printers.


    Normal printers use their own CPUs and some memory that is used to store fonts,
    performing some, and to act as a buffer. In the mid-1990s several companies started
    producing printers that were driven by very low-level instructions from the host
    computer. This requires their proprietary sets of drivers to be running on the
    host system, and those typically have been available exclusively for Microsoft
    Windows. These printers cannot be used by any other systems—even MS-DOS systems.
    Naturally, these printers are sold at a lower price than their "real" cousins,
    and are so popular low-end peripherals.


    Winprinters are not suitable for use on multi-user systems. Even if the drivers
    available for LINUX the computing overhead on the CPU and the timing and latency
    requirements of these devices make them a very poor choice for business use. The
    point is moot there are currently no drivers available for them and there have
    been historically unfavorable relations with the Open Source programmers who have
    expressed an interest in developing such drivers and the manufacturers who would
    provide the requisite specifications and documentation.


    In the Printing HOWTO there are notes on support for GDI and PPA printers using
    special filters. There is also a section of HOWTO with links to lists and databases
    of supported printers.'
