- img_proc: true
  md: 'To prevent zombies, the programmer can use a “double fork()” as part of the
    exec(), leaving the “grandchild” process as an orphan that will then be “adopted”
    by the init process (see init for details). Another option is for the programmer
    to create a signal handler to respond to the SIGCHLD event, which is how the kernel
    informs a parent of the demise of any of its children.


    In short, only the programmer can prevent zombies.'
