    # The Rescue Root Partition


    In addition to maintaining rescue disk, it is wise to create an additional small
    partition on each system drive for a kernel and a full suite of repair tools and
    configuration snapshots—100MB is plenty of space. Then, if a root partition becomes
    unusable, it may be possible to boot into this rescue partition and repair or
    replace the root partition. Naturally there are cases of disk failure and/or corruption
    from which this will not recover, so a rescue diskette may still be useful.


    # Auto-Rescue Configuration


    There is a tricky way to set up a system that can automatically recover from some
    classes of damage to the root filesystem. Set up the production root and the “rescue
    root” and copy all of the basic files between them. On the rescue root, put an
    additional copy (perhaps in a .tar file) of the production root’s /etc files.


    Then modify the /etc/rc.d/.* files on the rescue root to perform fsck of the production
    root—with an error handler and timeout that can avoid the filesystem check if
    necessary; an except script is a good way to do this. If the fck fails, you can
    just script mkfs.ext2 the production root and restore it—copy and extract the
    production .etc.tar.gz file to overwrite the appropriate files that differ between
    the two systems. The result is that the “rescue root” can automatically restore
    the filesystem that’s used in production mode.


