  md: '# Initial Requirements Analysis


    It is possible, of course, to just jump in and learn as you go. You can use your
    best judgment at every turn and guess what your priorities should be. You can
    also seek out your boss and coworkers and ask these questions as you go. You''ll
    certainly need to do these things in any case. However, creating a service-level
    specification and clarifying these things—and negotiating a set of priorities
    among them—can save you a bit of time and fewer mistakes.


    As an example of setting priorities, it is likely that you will be responsible
    for a number of different services. If users do transaction processing (like phone
    orders) using a corporate database system, keeping that server and the networks
    and/or terminals connected to it and running is likely to have a high priority.


    In most organizations, company email has priority over Internet web access, which
    probably has precedence over Usenet news. Most of that is a matter of common sense.


    Of course, it''s not simple for example, most applications and services require
    access to DNS (the domain name service), and many services and applications depend
    on consistent time across all systems on a network (such as accounting systems).
    Almost everything depends on the basic routing and lower-level protocols. Therefore,
    maintaining these subsystems usually is a very high priority—though most users
    aren''t even aware of them as distinct aspects of your work.


    # Initial Requirements Analysis


    Your first opportunity to perform requirements analysis is when you''re considering
    a new job or an offered promotion. The purposes of the initial requirements analysis
    are to create the service-level specification and ultimately, to gather enough
    information to decide whether or you''re willing to take on that specific set
    of responsibilities.


    To summarize the process of determining requirements, we outline some processes
    appropriate to every organization. Before beginning the process, ask whether any
