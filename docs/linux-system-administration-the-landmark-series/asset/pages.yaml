    the corollary: the denial of service. Services are to be denied both in order
    to protect data from inappropriate disclosure and to ensure the provision of services
    to those legitimately requiring them. Because the services provided must rest
    upon correct data, security is also concerned with data integrity.


    Policies follow from requirements analysis. Security requirements will often conflict
    with other requirements. In most organizations, everyone will say that security
    is paramount. Usually, getting the job done in a manner that is comfortable and
    familiar and protects against blame takes precedence over security. The senior
    system administrator generally must keep this in mind as security requirements
    are translated into policies, and measures are chosen to achieve the policy aims.


    With other policies, an organization’s security policy must be disseminated to
    those whom it concerns. The intranet is generally the best way to do this. A security
    policy that is secret will only breed dissent as users demand services that are
    prohibited, without knowing that they are prohibited.


    The policy questions of what services are to be provided and denied—and to whom
    and under what circumstances—should precede all other security considerations.
