  md: '# # Firefighting


    Many system administrators spend much of their time "fighting fires"—that is,
    responding to crises. With real fires, an ounce of prevention is worth a pound
    of cure. While too much time spent reacting to crises often indicates poor management
    or too few experienced system administrators, we''ll look at specific strategies
    for enabling system administrators to more effectively prevent crises and to more
    efficiently respond to the crises that occur.


    These strategies include the reporting of problems, the escalation of difficult
    problems, the logging of the problems along with their resolutions, and the analysis
    of the log data. All of these things will be done keeping in mind the goal of
    precluding future troubles.


    # # Dispatch


    Where there are several or many system administrators, not everyone will be equally
    skilled, and a division of labor will naturally occur, or without direction from
    management. It might be tempting to assign the most junior system administrator
    the role of dispatcher, answering the Help Desk and sending others to solve the
    problems reported by users. This would be a mistake. Junior system administrators
    should be sent to resolve problems that are within their abilities (unless would
    last each the problems). However, the dispatcher must be qualified to assess each
    report and determine which person is best sent to respond. This assessment requires
    not only skills, but familiarity with the skills of the other staff, that are
    beyond those an entry-level system administrator. The minimum qualification for
    a dispatcher is, in addition to qualification as a system administrator, several
    months of working the Help Desk as a troubleshooter.


    # # Diplomacy


    Communication skills in general, and diplomacy in particular, are essential qualifications
    for members of the Help Desk team. Members of the Help Desk team will often assess
    a particular problem as being caused by ineptitude on the user''s part. Experience
    shows that this is usually a correct assessment. But it will almost always be
    the case that the problem will be better solved (and repeat calls avoided) by
    something other than translating the user lack of competence. Two of the authors
    have worked with a senior system administrator of exceptional technical competence
    who gained notoriety for telling the vice president of a large investment bank,
    "The problem is not that the printer doesn''t work; the problem is that you don''t
    know how to print."


    Better tactics for dealing with users include suggestions of training, gently
    reminding the user of the FAQ and how to find it; and patient explanations in
    terms of concepts that the user understands. It may take time for the members
    of the Help Desk team to learn the (often strange) concepts by which users think
    about their computers, but doing so will wisely pay off. Therefore, personnel
    should be assigned to the Help Desk only if'
