- img_proc: true
  md: 'organization that adheres to an architected environment will amortize the engineering
    costs over a larger number of desktops.


    Conversely, network computing environments that are allowed to grow in an uncontrolled
    fashion become exponentially more expensive to maintain. Eventually, almost all
    system resources will be consumed by problems crop up to unanticipated incompatibilities,
    dependencies, and the dire consequences of short-term solutions.


    This leaves the organization unable to respond to needed changes in a timely fashion.
    Network computing environments that have not built with an architected model always
    have this problem. Some reach a state of total paralysis. The only solution at
    this point is to create a totally new environment and migrate users and hardware
    to it. Worse, if the new environment is not architected, the same degradation
    will begin again. This is huge expense to incur, yet many organizations pay the
    price repeatedly due to a simple lack of vision.


    Some IT managers excuse themselves from planning by asserting a need to maintain
    flexibility. Networks without growth impose constraints as surely as planned networks.
    The difference is that planned networks impose planned constraints and unplanned
    networks impose unplanned constraints.


    # Few Words Regarding Namespaces


    A namespace refers to a system of mapping symbolic names to objects. Within the
    scope of system administration, we define a namespace to be the set of names that
    exist within a particular network naming protocol. The most important objects
    to be named are hosts, but namespaces apply to every network resource.


    Name services insure network services from details of the network environment.
    Hosts providing network services can be moved to different physical locations
    of the network yet retain the same symbolic name. This dramatically reduces the
    work required to make changes in the network environment, since all of the references
    to the host do not need to be changed.


    As the world stands today, there are many name services that provide overlapping
    functionality. Proprietary operating system vendors have worked to ensure that
    no one name server will be able to provide naming for a large organization. In
    fact, any organization with a heterogeneous environment will have to take special
    care to load all services with the same data, and more importantly, to ensure
    that the data synchronized as changes are made. It is the network architect’s
    responsibility to solve this problem.


    A new generation of name servers, known as directory servers, is being developed.
    Directory services can contain arbitrary data, and potentially be used to combine
    all namespaces into one unified service. Unfortunately, operating systems have
    been slow to integrate directory service access into their products.'
