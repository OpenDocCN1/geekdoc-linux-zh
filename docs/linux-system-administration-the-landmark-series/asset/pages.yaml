    flag bits and a fragment offset field to support fragmentation. At the destination
    host, a buffer known as a fragment reassembly window and a timer are used to manage
    the reconstruction of fragmented packets. If the timer expires before the fragmented
    packet is reassembled, a fragment reassembly time exceeded ICMP message is sent
    back to the originating host.


    Hosts also indicate that fragmentation is unacceptable by setting the Don''t bit
    in the IP header fields. In cases where fragmentation is required to send a datagram
    on its next hop, the router will drop the packet and send an ICMP message back
    to the originating host, reporting that the DF bit was set and fragmentation was
    needed. This functionality provides a mechanism for avoiding fragmentation entirely,
    called Path MTU Discovery.


    Fragmentation has turned out to be an undesirable feature of IP, because the loss
    of a single fragment requires the retransmission of the original datagram. This
    has led to the adoption of Path MTU Discovery as the preferred method for sizing
    IP datagrams.


    IP packets that travel over more than one network are said to be routed. Each
    system visited by the packet between the source and destination hosts are known
    as routers (or gateways, in the terminology of older RFCs). Each router makes
    an independent decision about where to forward the packet next, according to its
    routing table. This is known as "hop-by-hop" routing. Routers execute one or more
    dynamic routing protocols. The purpose of the routing protocol is to arrange the
    routing table is populated with a desired set of routes, and to update the table
    as quickly as possible to adapt to changes in the network.


    There are two major classes of routing protocols. One is set to connect large
    sections of the Internet, which are themselves composed of many networks. These
    sections are known as Autonomous Systems (AS), and each registers a unique AS
    number. autonomous systems are composed of Internet Service Providers (ISPs),
    universities, and some large corporations. The second class of protocols is designed
    to be used within an Autonomous System, and are known as Interior Gateway Protocols.


    The protocols used to exchange data between Autonomous Systems are called Exterior
    Gateway Protocols (EGPs) or Inter Domain Routing Protocols (IDRPs). Confusingly,
    there are two routing protocols that go by these names. This family is oriented
    towards reducing the overall number of routes needed, and they enforce routing
    based on policy, not just simplicity. These policies reflect the role of the Autonomous
    System in the Internet, as well as business relationships among them. An example
    policy might be "Large corporation X does not route traffic destined for it" or
    "Carrier A is preferred to Carrier B for traffic destined to AS C." Examples of
    exterior gateway protocols are EGP, BGP3, BGP4, and IDRP.'
