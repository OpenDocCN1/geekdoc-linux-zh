    \ /bin, which are more typically user-level commands.\n\nThus, /sbin tends to\
    \ change ever less than /bin. The /sbin directory is nearly always part of the\
    \ / partition.\n\n# # /tmp Directory\n\n /tmp directory is the conventional place\
