  md: '# Chapter 11 Scripting


    Obviously, most of the real work is in maintaining the list of patterns. An overly
    general pattern like .* will filter out everything. Therefore, the system administrator
    must have a good understanding of awk regular expressions to use this script and
    maintain pattern files for each type of log to be filtered.


    ```

    # Patterns for /var/log/messages file

    # the pattern ... ... antares should match the

    # date and time that leads each line.

    ? ... ... antares kernel: \[t]*

    ? ... ... antares kernel: Type: *

    ? ... ... antares kernel: Vendor: *

    ? ... ... antares kernel: aha542c: Using extended bliss translation

    ? ... ... antares login[0-9]*]: ROOT LOGIN on ''tty[0-9]*''

    ? ... ... antares innd: *

    ? ... ... antares nrpd[0-9]*]: localhost.starline.org *

    ? ... ... antares rnews: offered *

    ? ... ... antares rnews: rejected *

    ? ... ... antares named[0-9]*]: STATS *

    ? ... ... antares named[0-9]*]: XSTATS *

    ? ... ... pppd[0-9]*]: Connect script failed

    ? ... ... pppd[0-9]*]: Hangup (SIGHUP)

    ? ... ... pppd[0-9]*]: local IP address 10.45.123.[0-9]*

    ? ... ... pppd[0-9]*]: local IP address 206.61.225.[0-9]*

    ? ... ... pppd[0-9]*]: ppp0 /dev/mem

    ? ... ... pppd[0-9]*]: pppd 2.0 started by root, uid 0

    ? ... ... pppd[0-9]*]: remote IP address 192.168.13.[0-9]*

    ? ... ... antares[0-9]*]: abort on (NO CARRIER)

    ? ... ... diald[0-9]*]: Delaying [0-9]* seconds *

    ? ... ... diald[0-9]*]: Closing down idle link.

    ? ... ... diald[0-9]*]: Link died on remote end.

    ? ... ... diald[0-9]*]: Running *

    ? ... ... su[0-9]*]: ++ tty[0-9]* jmid-root

    ```


    This script is updated by taking the results from earlier runs (sent to a system
    administrator nightly) and pasting them into the pattern file. They are made into
    regex by replacing the date elements (MMM DD HH:MM:SS) with single-character wildcards
    (dots)—adding a question mark to the optional second digit—and replacing other
    variable data (such as the PID numbers that are commonly found in this) ex

    ample) with regex descriptions [0-9]+, which signifies a string of digits.


    These patterns filter most of the kernel boot-time messages, most messages from
    diald (a program that opens a PPP connection whenever traffic is destined for
    an outside network), and the pppd. innd, and named daemons. This is the gateway
    to the Internet'
