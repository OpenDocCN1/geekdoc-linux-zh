  md: '# Preface


    The world is even more full of technical books for technical readers than it is
    full of technical books for non-technical readers. Being technical readers, system
    administrators have an abundance of technical books on system administration from
    which to choose. But these books do not suffice because only half the job of system
    administration is technical.


    This book addresses the need for a non-technical book for technical readers before
    delving into the technical details of system administration. Part I surveys system
    administration from a bird''s eye view, scanning requirements analysis, recovery
    planning, capacity planning, network principles, and security policy. The intended
    audience is the professional system administrator who come from other backgrounds,
    such as programming or finance.


    Part I is accessible to any reader with a curiosity about system administration.
    As such, it is ideal for computer programmers and other users who wish to know
    what their system administrators are doing while they are out of sight, and for
    the parents of any system administrator who wishes to understand what their child
    does for a living.


    Part II takes a worm''s eye view of the technical aspects of system administration.
    It is a practical guide for system administrators without regard to accessibility
    for others. Some programmers, network administrators, and database administrators
    may find Parts II and III of interest, but non-technical managers and others without
    responsibility for hands-on administration of LINUX systems may well do skip directly
    to the Glossary.


    Part III provides an overview of the major services upon which systems and applications
    depend. Most system administrators will find these services essential to the performance
    of their duties: Email, Printing, NFS, NIS, and the myriad range of network services.


    Finally, a guide to the emergencies that may arise in the course of LINUX administration
    is included as an appendix. We hope that most readers will rarely need it.'
