    # Filesystem Support


    Another major subsystem of the Linux kernel supports the various filesystems.
    As is always the case with Unix operating systems, access to the filesystems is
    through an abstraction layer. The abstraction layer makes it possible to add support
    for new filesystem types as they become available.


    LINUX has changed its primary filesystem twice over the last few years and is
    preparing to do so again. Originally LINUX was brought up using the minix filesystem.
    Later it migrated to the ext filesystem. More recently, the ext2 filesystem was
    developed, and now it''s the primary disk filesystem used by systems on Linux
    kernels in the 2.0.x and 2.2.x series. Now under development as part of the 2.3.x
    experimental kernel series, the ext3 filesystem will be standard for stable kernels
    from 2.4.0. ext and ext2 will continue to be supported.


