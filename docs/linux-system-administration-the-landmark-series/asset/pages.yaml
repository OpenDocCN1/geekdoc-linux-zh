    # 2 Requirements Analysis


    AN ELEGANT APPROACH TO THE WRONG PROBLEM yields the wrong solution. Users and
    managers who make demands of system administrators often present the wrong problem
    because they lack the perspective to see the forest past the trees. It is easy
    for a system administrator to lose sight of priorities and objectives when he''s
    too busy solving apparent problems and reacting to superficial symptoms. Thus,
    it is a system administrator''s responsibility to have the depth and understanding
    of the business to discern the real problems underlying the complaints that queue
    up.


    Requirements analysis is a process of translating desired results into specifications.
    Management sets policy, and system administrators translate policy into procedures
    and plans (for operators) and make recommendations (to management). The system
    administrator''s input is necessary to provide management with the right information
    on which to base policies.


    The key to requirements analysis is to really understand the desired results of
    our managers and users, even when they do not, and to manage those expectations
    or meet those needs. Doing so precludes many problems.


    Ultimately, any job or project is about what a set of people want. Identifying
    the set of people to be satisfied is the first step toward figuring out what needs
    to be done. Then'
