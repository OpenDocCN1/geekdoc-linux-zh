  md: '# Filesystem Troubles


    # 265


    The tune2fs command can be used to set the user and group IDs permitted to use
    this reserved space.


    The obvious answer is to remove some files. Another is to move (migrate) some
    to another volume (leaving behind a symlink). Compressing some with gzip or another
    compression utility is another option.


    If root, a process running with root privilege, overruns a disk volume, the disk''s
    reserve space will be filled. For this reason, root mail should always be sent
    to an unprivileged account, and logfile rotation should be carefully maintained.


    To proactively protect filesystems from reaching capacity, install some form of
    monitoring system like SLEW (a copy of which can be found in Chapter 4, “Capacity
    Planning”).


    # Filesystem Out of Inodes


    It is possible to run out of inodes when ample space remains on a filesystem.
    Note this is much different from the kernel''s maximum number of currently open
    inodes (inodes) which is an entry under `/proc/sys/kernel/`. If a filesystem has
    a large number of files that are less than 4KB, you might run out of inodes before
    running out of disk space.


    The ratio of inodes to data blocks on any given filesystem is set at the time
    the filesystem is created (using the -i option to mke2fs). New partitions always
    require a greater proportion of inodes.


    # Suspected Bad Cluster/Sector


    Some formats such as ext2 support the -c option on their fsck and/or mkfs commands.
    Linux supports different versions of the fsck and mkfs commands for each of the
    filesystems that it supports.


    For example, you''d use e2fsck -c to detect bad blocks and add them to the appropriate
    filesystem list (the bad blocks inodes).


    # System Locked Up During Mount Command


    Occasionally a process can get into a “wedged” state—for example, the mount command
    is used on a filesystem whose underlying device is not responding. This can also
    happen when SCSI devices are detached or powered off from an active SCSI chain.


    It should still be possible to switch to other virtual consoles, log in serial
    terminals via telnet, a ps command will show these “wedged” processes in the D
    state. A kill -9 has no effect (since signal processing is disabled while the
    process is processing a kernel system call—in kernel mode).


    The most common case is when an NFS server becomes unavailable. See the section
    “System Inaccessible Via Network.”'
