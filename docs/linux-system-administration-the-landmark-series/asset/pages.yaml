    # 5


    # Help Desk and Escalation


    THINGS GO WRONG. No matter how well one anticipates the future, it will present
    unexpected setbacks. Bugs will corrupt files, users will erase data they need,
    and hardware will spontaneously combust.


    When such things happen, you will not always be the first to know. However, you
    should endeavor to monitor your systems such that when users call you with a problem,
    you can tell them that you already know about it and are working on it—better
    yet, you''ve just fixed it. In the best cases, it will be fixed before users notice
    that it was ever broken.


    Even so, users must have a well-defined procedure for reporting problems and requesting
    help. In a small organization, this may be as simple as each user having the email
    address, phone number, and pager number of the sole system administrator. In large
    organizations, it will be more complex. This chapter offers principles for the
    operation of Help Desks in large organizations, most of which are also appropriate
    for smaller organizations.'
