    Red Hat''s kickstart install is currently the most automated installation tool
    available for LINUX¹. Kickstart can be used for new installations or upgrades
    to existing systems. It is implemented as part of the Red Hat installation program.
    Only local CD-ROM and NFS installs are supported. This should not present a problem,
    since the NFS mechanism is the most sensitive choice anyway.


    A network-based kickstart install requires DHCP or BOOTP, so this service must
    be available on every network segment on which installs are to take place. One
