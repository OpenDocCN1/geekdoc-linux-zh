    # Other Programming Languages


    Several new interpreted programming languages have become popular within the last
    few years. They offer a rich command syntax that the shells are usually not used
    interactively.

    Tcl, the Tool Command Language, was originally developed to assist in the rapid
    prototyping of applications. It was designed to be embedded within C or C++ programs,
    giving them a simple language for configuration and scripting. There are many
    extensions to Tcl, a few of which are listed in Table 11.1.

    The Perl programming language has become a mainstay for system administrators
    and programmers, fitting a niche between small shell scripts and larger applications.
    Many people find they do much less C or C++ programming once they have been introduced
    to Perl. Perl has an elegant extension mechanism called the module system. The
    Comprehensive Perl Archive Network (CPAN) at http://www.cpan.org/ provides access
    to the currently available set of modules, and well as to the Perl language itself.

    Recently, a new language called Python is gaining popularity. It is useful for
    the same kinds of tasks as Perl. System administrators who work in an organization
    with many existing Perl scripts find it important to learn Perl, even if they
    choose Python for new scripts.


    # Motivations for Scripting


    Frequently, scripts must be written or adapted for specific situations. Perhaps
    the most common usage is to create application wrappers, which shell scripts define
    environment variables needed for an application and then launch the application.
    The other common case is to modify an aspect of system startup, usually to add
    a service to the system boot and shutdown sequence.

    Many monitoring tools, like Watcher and Big Brother, are built around shell scripts
    and are extended and configured by writing or modifying shell, awk, and/or Perl
    scripts. Other tools, like cfengine and scotty, have their own scripting languages
    or dialects.'
