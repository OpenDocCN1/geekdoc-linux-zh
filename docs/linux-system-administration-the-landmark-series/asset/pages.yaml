  md: '# Solutions


    NIS, Kerberos, DNS, and some filesystems, such as AFS and Coda, are similarly
    robust and scalable.


    In other cases the scaling issues are more complex. For example, it is easy enough
    to provide redundancy for basic TCP/IP routing (and normal practice in industries,
    such as banking), it is somewhat more difficult to provide load-balancing.


    LINUX is an unusual fragile operating system. An old 386 with 16MB of RAM can
    easily handle mail, web, and print files for a small company or department (to
    about 25 users). A 486 with 32MB can provide the same combination of services
    to at least 100 users. So, in contrast to conventions in the rest of the industry,
    it is often faster to deploy the slowest systems as LINUX servers and save the
    fastest CPUs for use as workstations. Many of the most important network services
    require very little processor power and are I/O bound (where the CPU is usually
    waiting for disk or network data).


    As the number of systems grows, the network will need to be segmented to maintain
    a low collision rate. Ensure that servers are local to the segments that make
    the heaviest use of their resources.


    # Adding Resources


    Of course, a CPU could be too slow, a disk too small, or bandwidth too little.
    In these cases, the system administrator must be prepared to prioritize recommendations
    for increasing the capacity of the affected resources.


    At a site where one of the authors was the system administrator, the requirement
    was to increase the capacity of the FTP servers. Installing a new host with more
    RAM and a faster processor allowed in the number of concurrent FTP sessions from
    100 to 300. Round-robin DNS was introduced later so that clones of this server
    could be installed.


    The next problem was that this site was fed by only a T1 leased line. This meant
    that all user traffic at the site had to share 1.5Mbps of bandwidth. Web surfing,
    incoming requests to the company''s web site, and outgoing and incoming FTP sessions
    were sharing the same bandwidth. Surprisingly, SNMP statistics from the routers
    at site showed that the T1 was overutilized. The FTP limit (in the wuftpd configuration)
    also exacerbated the problem. Hundreds of users could connect and start their
    downloads (which company distributed some popular shareware). Each session would
    take much longer than it had previously.


    The requirements of telephone support staff were met—they getting calls and complaints
    that the site was “always busy.” However, many of the customers were satisfied
    with the throughput.


    One recommended approach was to add another T1. This is more complicated than
    one might think. The manager at site initially wanted to add the new connection
    to a second ISP. The idea was to supplement the added bandwidth with some redundancy,
    so that any service interruptions from the first ISP would be less likely to shut
    down the whole site. That''s a worthy objective—however, Internet routing is not
    so simple.


