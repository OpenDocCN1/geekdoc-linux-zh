    \ but indeterminate time. Sometimes these files may be large, and an application\
    \ may depend on space being available. Also, because some applications are not\
    \ fastidious cleaning up after themselves, /tmp can grow over time.\n\nIf /tmp\
    \ fills, it is not likely to crash the system, but it will probably interrupt\
    \ the process that it failed to interfere with other processes trying to write\
    \ to /tmp. Because it is subject to considerable growth, it is best separate from\
