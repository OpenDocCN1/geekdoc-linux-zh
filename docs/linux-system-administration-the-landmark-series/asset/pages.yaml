  md: '# Testing the Recovery Plans


    +   - Is our staff trained in these procedures?


    +   - Have we verified that this plan will work?


    This question is the crucial one. Have you tested the plan? When was the last
    time you performed a recovery drill? How much of the plan did that account for?
    How much of the recovery plan does the recovery test plan cover? How many of the
    risks does the disaster plan cover?


    One of the authors used to work in the technical support department of a large
    software company that produced a popular backup product. It was heartbreaking
    to talk to so many people who had the foresight to do backups but lacked the skepticism
    to test them... until it was too late.


    Frequently these people were stressed because they had been doing backups for
    months or years and didn''t know how to do a restore—until they lost a file. Occasionally
    their attempts to do a selective restore were frantic enough to cause even more
    damage to their systems. In the worst cases, someone had decided to override the
    software''s default and skip the verification pass (in order to halve the time
    it took for each backup), only to find later that none of their backups were readable.


    Sometimes the plights of these callers held a certain humor—like the guy who habitually
    stored his QIC-80 tapes in a "wooden box" under his desk. The box turned out to
    be an old speaker cabinet—with the large speaker and its powerful magnet still
    in it.'
