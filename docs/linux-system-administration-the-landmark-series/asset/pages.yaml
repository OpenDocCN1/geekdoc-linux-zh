  md: 'snapshot. If key data change backups are taking place, inconsistencies may
    render the backup process worthless. On the other hand, an organization running
    a 9 a.m. to 5 p.m. operation can employ a simpler and less expensive solution.


    # Scheduling


    Daily backups normally be done at a time when the data are in a well-defined state,
    such as the end of the business day. If the backup system runs while nightly batch
    processing is taking place, data restored from the tapes may be inconsistent and
    incapable of re-creating the state of the organization at any one point. If it
    is not possible to get the organization into a quiescent state, management must
    be aware of the implications. In some cases, it won''t matter, because the environment
    as a whole is unlikely to run in lockstep. However, it is clear that processes
    with data that change during the backup operation may not have valid backups.


    Most backups are driven by either cron or their own internal scheduler. Typically,
    these permit a moderately complex schedule to be developed and maintained. The
    backup system may also need to interact directly with applications, such as databases.
    In this case it is usually desirable to have an application or script initiate
    its own backups.


    # Retention


    Because tapes are expensive, another important factor affecting the cost of backup
    systems is data retention policy. The retention policy reflects the nature of
    the organization, its work flow; and the regulatory requirements imposed by external
    interests, like governments and auditors. Disaster recovery plays a part in retention
    policy as well, and for this reason many organizations will contract a vendor
    to store data off-site.


    Most backups support efficient tape usage by offering at least two relative levels
    of data storage. A full or zero level backup will archive all files unconditionally.
    An incremental backup will archive only those files that have changed since the
    previous full or incremental backup. Some systems also provide intermediate levels.
    By combining levels, the system administrator can develop a backup strategy that
    balances efficiency and reliability.


    Here, as example, is the backup policy of a firm known to the authors. All data
    are dumped on Saturday. Sunday through Friday, incremental backups are performed.
    All tapes are kept forever. Once tapes are two months old, they are shipped off-site
    for storage.


    Here is another example: All data are dumped on Saturday. Sunday through Friday,
    incremental backups are performed. A special set of tapes is set aside for month-end
    backups. Month-end tapes are sent off-site for storage. Weekly and nightly tapes
    are reused after six weeks. Here, a policy decision was made that files not on
    disk at the end of a month are lost forever.'
