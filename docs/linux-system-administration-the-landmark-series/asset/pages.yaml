  md: '# Buzzwords


    Some buzzwords have arisen recently in networking. The Internet has had its name
    since the early 1980s, when it evolved from the ARPANet. However, "intranet" and
    "extranet" came into use during the late 1990s. We define the concepts that underlie
    these buzzwords in terms of network services.


    # Internet


    Every modern organization needs to be connected to the Internet, because email
    and web access are well on their way to replacing voice mail and facsimile. Most
    organizations will want to manage Internet access with a firewall. A firewall
    is a special-purpose computer dedicated to permitting use of the Internet from
    the inside and preventing abuse from the outside.


    Most organizations will also want to maintain a web site on the Internet. Increasingly,
    ISPs and integration companies are offering secure Internet access and web hosting,
    which are attractive to companes that do not have the requisite expertise to maintain
    these services themselves.


    # Intranet


    This term has become the popular way to describe the use of web servers to publish
    data internally. It also implies having the low-level services in place required
    for any system to connect to any other. It be hard to imagine this as a feat,
    but firm-wide access to data is a milestone in the evolution of many companies.


    A sophisticated definition of intranet also includes the ability to deliver standardized
    access to all internal data, enabling drastic improvements in the ability to deliver
    ad hoc reports, and to share data among departments.


    # Extranet


    This term was coined to reflect the business practice of establishing dedicated
    connections to key partners, allowing direct access to each other''s applications.
    For example, a manufacturer implements direct links to its suppliers to automate
    ordering and billing. The manufacturer is then free to implement just-in-time
    inventory management, directly generating requests to suppliers based on product
    orders.


    The term "extranet" will most likely die out in the next few years. Companies
    are already beginning to replace dedicated connections with Virtual Private Networks
    (VPNs). The perceived need for an extranet will wane as Internet commerce and
    encryption standards stabilize.'
