  md: '# Foreword


    Nearly from its beginnings, LINUX has found a natural home on server machines
    at large sites—business data centers, campus networks, research clusters. LINUX''s
    high reliability, coupled with the guarantee that if something goes wrong you
    can fix it yourself, has given it a strong appeal to overtaxed and underbudgeted
    system administrators.


    For all its utility, LINUX''s infiltration of serious iron has been a rather stealthy
    process until recently. Often, system administrators would replace machines providing
    Web service or mail or DNS or file-sharing services under other operating systems
    without their management improvements. In most cases, the resulting dramatic improvements
    in performance and uptime would be taken for granted by everyone except the sysadmin,
    who would be grateful enough for getting fewer 3:00 AM beeper calls.


    This book is an indicator of the un-stealthing of Linux. Over the last eighteen
    months, Linux has earned enough good publicity to join the toolkit that management
    will sign off on. The savvy administrators who have been using it all along are
    pulling Linux machines out of closets, and many others are giving it a first look.


    This book is a reference for experienced LINUX administrators and a guide for
    new ones. It distills the authors'' extensive rubber-meets-the-road experience
    with real-world challenges—including all the expertise Jim Dennis has built up
    in his "Answer Guy" persona at the LINUX Gazette.


    Armed with the knowledge in this book, you should be able to configure, deploy,
    and secure LINUX machines like a pro. This will make your life easier. And it
    will speed the day when you can say to boss "NT? Windows? Novell? Time to get
    rid of all that legacy software; it just doesn''t perform . . .


    So forth and conquer. And have fun, too!


    Eric S. Raymond'
