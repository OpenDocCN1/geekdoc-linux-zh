    # The Address Resolution Protocol


    The Address Resolution protocol, or ARP, is a co-requisite protocol for IPv4.
    Although IP does not include ARP in its protocol suite, the ARP protocol is a
    requirement for IP on most network types. ARP provides the mapping from IP addresses
    to physical layer addresses, using a broadcast-based mechanism. Hosts and routers
    utilize an ARP table to store translations from IP address to physical layer address.
    When a system has a packet to transmit, the ARP table is consulted. If the appropriate
    translation exists in the ARP table, no extra work is required. If the data is
    not found in the table, the system broadcasts an ARP request packet. If a system
    replies with an ARP response, the table is updated and the packet is transmitted.
    The ARP table can be viewed and manipulated with the arp command.


    Reverse ARP (RARP) is a protocol that supplies IP addresses when given physical
    layer addresses. RARP is used to support disk booting.


    # IPv4 Data Transmission


    The IPv4 protocol transmits data grouped in units called packets or datagrams.
    The data is the fundamental unit of data transmission for the IP layer. Datagrams
    can be from 20 to 65535 bytes long, both the data and the IP header. The packet
    header has a minimum length of 20 bytes but can vary by the inclusion of optional
    fields. A checksum exists for the header portion of the packet. If a host or router
    finds a packet with a bad header checksum, it will simply drop it. This is why
    the IP layer is said to be unreliable. Ensuring end-to-end integrity of transmitted
    data is left for the higher layer protocols like TCP.


    The IP protocol governs itself by generating and processing Internet Control Message
    Protocol (ICMP). ICMP is used to notify the sender of a sender of error conditions,
    to manage the flow and routing of data, and to provide diagnostic information.


    One of the fields of the IP header is the time to live. Originally, this was specified
    as the maximum lifetime of the packet in seconds. Since all implementations decrement
    this by one, this has come to be understood as a hop count. When a router decrements
    this counter to zero, the packet is dropped and a time-expired ICMP message is
    sent to the originating host. This is an important feature for packet-switched
    networks, because it removes datagrams misdirected by routing loops or other errors.


    The IPv4 standard defines the term Maximum Transmission Unit (MTU) to describe
    the largest datagram allowed for a particular network medium. IP is free to transmit
    packets of any size less than or equal to the MTU of the local network interface
    to its destination. If a datagram reaches a network with a smaller MTU, the packet
    is split into a number of smaller datagrams, a process termed fragmentation. The
    IP header utilizes two'
