    DVI (device indent) files are generated by TeX, \LaTeX, and other programs. There
    are direct DVI drivers for many printers. This diabase (as TeTeX call it) directly
    supports almost any printers as Ghostview (and the dvips command/filter allows
    DVI files to be easily printed by any PostScript printer or into any Ghostview
    print queue.


    To reduce wasted paper, one can use mpage to force plain text files to be printed
    with two, four, or eight pages per sheet--actually that''s per side of each sheet
    of paper. mpage has many options and produces its output in Postscript.


    There is a set of putils that force multi-page printing of PostScript pages. This
    is not actually a difficult trick because the PostScript programming language
    supports scaling, rotation, and translation primitives.) It''s also possible to
    force duplex printing (putting on both sides of each page) even on common simplex
    (one-sided) printers by feeding the same paper through twice, alternately filtering
    out and even numbered pages.


    For previewing files (another way to reduce wasted paper and toner--or ink for
    your non-laser printer), there are thevi, ghostview, and g programs for the X
    Window system. g is particularly nice for reviewing a PostScript document and
    for selecting subsets of the pages to be printed.


    # Remote Printing


    When lpd receives a job destined for a remote printer, it opens a connection using
    TCP sockets to the lpd daemon on the host specified by the rm field of the printcap
    entry.


    After the lpd daemon has acknowledged receipt of the job, the local lpd daemon
    deletes the files from the spool directory. Whether the lpd daemon is running
    on a Unix host or a networked printer is relevant to the local lpd daemon.


    # Administrative Commands


    LINUX includes the administrative BSD print commands. lpq lists queued print jobs
    that have been spooled by lpr and are still awaiting action by lpd. lrm removes
    jobs from the queue. lpc performs other administrative print duties.


    +   8. The authors used these programs extensively during the production of this
    volume.'
