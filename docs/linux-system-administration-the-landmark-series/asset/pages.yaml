    \ from a complete disaster—that is, it is simply gone or destroyed, including\
    \ archives and key personnel. Giving this some thought may help in preparing for\
    \ lesser disasters.\n\n# Assess Costs and Consequences\n\nOnce all the different\
    \ sorts of disasters have been enumerated, it is time to assess the cost of preparing\
    \ and recovering from each sort of disaster. This process will typically include\
    \ both your management and your users' \n\nThe first step in assessing cost is\
    \ evaluating (literally placing a value on) resources. Data files are only one\
    \ of many sorts of resources that this would cover, though they are most relevant\
    \ to this discussion.\n\nObviously each system is a resource. Less obvious is\
    \ the value of each system's configuration. How much does a system cost to configure?\
    \ Do you have a standard workstation configuration (such that you could automatically\
    \ install software on a new system and drop it on an employee's desktop)? How\
    \ much does it cost to install and configure each service on a server? Has everything\
    \ packaged for automatic installation and configuration?\n\nA part of this process\
    \ relies on operational analysis. For example, a programming team or Help Desk\
    \ might be needed to function for some time without a printer—most of their work\
    \ is on-screen, and quite a bit of their interaction is via email. However, accounts\
    \ receivable department might be crippled without access to the printers and forms\
    \ that produce the bills that are sent to customers.\n\nHaving assessed the costs,\
    \ management will need to decide which preventative measures will be taken, and\
    \ how much to budget for recovery if prevention fails.\n\n# Data Resources\n\n\
    In the context of data recovery, we focus on the data resources. We divide these\
    \ into software (excluding software in development), configuration data, and transient\
    \ data—including both data that are generated internally and data that are obtained\
    \ from external sources—data that are under development, data that are the product\
    \ of business operations, and databases. For most organizations the most valuable\
    \ data are those which they've generated and/or gathered—databases in particular."
