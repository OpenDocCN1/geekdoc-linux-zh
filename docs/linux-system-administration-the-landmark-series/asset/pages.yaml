  md: '# Software


    The disk drive in a typical workstation contains a large body of data that was
    included with the system and the applications. For most sites, these data are
    available via the original installation media (operating system and application
    CDs). These data are "valuable" in one sense—other data cannot be accessed in
    any meaningful way without the appropriate applications, which in turn can''t
    run without the operating system. The cost of such a risk is low because reinstalling
    the operating system and applications should be easy. However, the risk of corruption
    for many files can be significant, particularly in cases of intentional corruption
    (such as Trojan horses and logic bombs).


    # Configuration Data


    A typical system also includes site-specific applications and configuration files.
    On client systems, these generally represent a low risk. Presumably the original
    sources and binaries for custom applications will be available on a server, and
    most sorts of configuration files are easily regenerated. Ideally, they should
    be packaged. With the advent of inexpensive CD-ROM writers, it is now common for
    sites to "cut" CDs containing packages for all applications and templates.


    Configuration data usually represents a medium level of value—it can be regenerated
    at the cost of a system administrator’s time. Often (particularly with Microsoft
    Windows and Windows NT systems), configuration files are concealed within an application
    and can''t easily isolated and restored properly. This is one of the egregious
    deficiencies of those systems. Configuration data should be packaged so that they
    may be automatically reinstalled after (or along with) the base system software.


    # Transient Data


    There is a tremendous amount of transient data flowing through most organizations
    today. NetNews articles, browser cache files, and other temporary files are typically
    of almost no value, although they represent some risks other than simple loss
    or even corruption. The loss of a whole news filesystem or a directory of temporary
    files represents only a minor inconvenience. In the exceptional cases of applications
    that require access to temporary files for days at a time, it is worth noting
    that they have "checkpointing" features that allow processing to continue after
    an interruption. These are the sorts of temporary files that are worth including
    in your recovery plan.


    Then there is email. This is a special case that straddles the line between transient
    and persistent data. Some email, as spam and common "Hey, let’s lunch" chatter,
    is of very low value. However, increasing numbers of email messages are vital
    to an organization’s operations. Many individuals use their email as a personal
    information manager (PIM) and as a project management tool.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Thus, the value of most email is moderate if it has been retained at all. Loss
    of individual unread messages or spool files is usually easily remedied because
    most people archive their outgoing mail and can easily resend a failed or lost
    message. Also, the majority of email users expect occasional failure. Here’s a
    case where user expectations will work in our favor: If a message requires some
    response and fails to generate it, the sender will usually resend the request
    without much fuss.


    One company we know routinely cuts a pair of identical CDs for anyone who leaves
    the company on good terms. These contain that employee''s mail folders (archives)
    and home directory: one is given to the former employee, and the other is retained
    by the company.


    # Developmental Data


    The next sorts of data on a typical system are “developmental” in nature. These
    could be sources for site-specific applications, drafts of ad copy and graphics
    being prepared by marketing andor publications, sales proposals and contracts,
    or fiscal reports for the quarterly or annual report. These are typically important
    files and documents. The risk of loss is quite high (particularly due to user
    error since these files are being edited/created). Loss of this data is also likely
    to be expensive—particularly in terms of personnel stress and frustration.


    In the case of programming source code, there is readily use of “revision control”
    software to manage the data by replicating files from a central repository to
    a developer’s “working directory.” This reduces the risk of data loss for each
    of the clients—and increases the value of the file server and the source code
    control systems.


    Hopefully, we will see these techniques applied to developers of other sorts of
    information—and will see the integration of revision control into “editors” of
    all sorts (including graphics and photofinishing applications). Just noting that
    “developers” can describe people other than programmers—that sales and marketing
    people are “developers” of other sorts of “sources”—may encourage IS managers
    to demand these features from software vendors.


    # Production Data


    Flowing from this “developmental” data are “production documents” which usually
    should be archived. In many cases there are specific legal requirements for the
    retention of such documents and products. In many other cases the requirements
    stem from conventions of “best practice” and “due diligence” (particularly in
    the cases of financials and personnel records).


    Traditionally, most of this information has been handled in paper form. The electronic
    forms of this information have often been supplemental. However, there is a trend
    toward implementing electronic document management systems. WORM and CD-ROM are
    often the technologies of choice here.'
