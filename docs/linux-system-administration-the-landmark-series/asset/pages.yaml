- img_proc: true
  md: 'Further Reading


    There is a compelling advantage to completely reinstalling a system. The system
    is put in a known state, and whatever idiosyncrasies the machine may have had
    are removed. Systems tend to vary over time, and periodically bringing the workstation
    population to an identical configuration is a good thing. Therefore, the authors
    recommend using an install mechanism for desktop upgrades. The exception to this
    is when one or a few packages need to be upgraded to correct an urgent problem.
    It is best to use U or RPM rather than the build server. This may generally be
    done while the clients are running, except in the case of kernels and kernel modules.


    There are two ways to upgrade servers. If hardware is available, a new server
    should be built from scratch, configured, and tested. Then, over time, users are
    migrated to the new server. Once the old service is no longer in use, the hardware
    can be reclaimed and used in future upgrades. The authors refer to this as the
    *swing machine upgrade*. This is the ideal upgrade path. Unfortunately, budgetary
    constraints or unique characteristics of the service offered by the server may
    demand that the system be *upgraded in place*. This is always a risky endeavor
    since servers need to be customized more than clients, and the customizations
    are very often key to the services provided by the system. The upgrade mechanism
    is preferred for upgrades in place because they present less risk. The system
    as a whole is still intact, and key system configuration files will not be deleted.
    This is less important for client workstations, but for key servers the capability
    to upgrade rather than reinstall is a highly desirable feature.


