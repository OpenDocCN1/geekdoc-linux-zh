    manual assignment of DNS addresses defeats the advantages of auto-address configuration.


    # Neighbor Discovery


    The IPv6 protocol does not use ARP to resolve hardware addresses. It follows a
    procedure related to the auto-address configuration procedures defined above.
    Router Advertisement messages contain the set of prefixes that are associated
    with this link. The host records the prefixes in a table, which is used to determine
    whether an IPv6 node is on the same link or needs to be routed to its destination.
    Packets addressed to IPv6 addresses on the same link send a Neighbor Solicitation
    message addressed to a special multicast address known as the solicited-node multicast
    address. This is a multicast address computed from the IPv6 address of the neighboring
    node. The neighbor returns a Neighbor Advertisement message which includes its
    link layer (or MAC) address. The transaction is then complete, and normal transmission
    can begin.


    # IPv6 Security


    The IPv6 specification mandates that all systems must be able to perform encryption
    and authentication of their data payloads. DES and HMAC encryption must be supported
    by every system, and many other encryption algorithms have been proposed. Hosts
    also need to know which set of keys to use for a particular conversation. Several
    key management protocols have been proposed.


