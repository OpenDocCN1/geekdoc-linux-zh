    directory has unique semantics based on the data it represents. The most of virtual
    files are read-only, others can be written. For example, the following command
    enables ipv4 packet forwarding:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    The best approach to take with /procs is to read the proc(5) man page and dedicate
    short periods of time to it a few times a week. It contains an incredible amount
    of useful information and one will glean more each time it is visited.


    # Capabilities


    The security of your system is determined by its weakest link. But the material
    from which those links are forged is provided by the kernel. Every kernel provides
    a model or schema of how it will determine the privileges or capabilities any
    given process will have. These models may consider things inherent to the process;
    things inherited from the parent process, such as the uid of the user who spawned
    it; or things about the data files would read or write.'
