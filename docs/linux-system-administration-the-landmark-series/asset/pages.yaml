  md: '# Chapter 19 Printing and Faxing


    Using Samba, it is also possible to configure a LINUX system to spool its print
    jobs off to a Windows NT or Microsoft Windows print server.


    Full details on configuring Samba print servers are included in the Printing.txt
    file that is included with the Samba source package.


    # Security


    Most installations of the printing suite depend on the port number for authentication
    using the protocol defined in RFC1179. There are many known techniques for defeating
    this security mechanism—it is inherently insecure. The traditional lpd daemon
    is typically installed su root despite reliance on insecure authentication.


    A new implementation of RFC1179 is available for Linux. It is called LPRng (next
    generation) and it overcomes some of the security problems of older implementations.
    In particular, it is not necessary for LPRng''s lpd to be installed su root. However,
    doing so allows the system to work over a wider range of less exacting configurations.


    # Diagnostics


    In its simplest form, printing is a matter of copying data (as plain text) to
    some interface (usually a parallel port). In some cases we can test the lowest
    layer components of a system''s printer subsystem by issuing a command


    ```

    cat /tmp/foo > /dev/lp0

    ```


    where /tmp/foo is any short text file, and /dev/lp0 refers to the first available
    parallel port.


    There are several reasons for a lack of output. The printer might not be attached
    to lp0. It might be an old serial printer (uncommon in recent years) or a USB
    device. It might be simply on /dev/lp1 or /dev2 or some other parallel port. Sometimes
    lpd detects its port in a different order than other operating systems on the
    same system. The MS-DOS PRN or LPT1 does not necessarily correspond to lp0 under
    Linux.


    It is also possible that the parallel port devices are not compiled into the kernel,
    and that the modular form of them is not loaded. As discussed in Chapter 10, “Configuring
    and Building Kernels,” LINUX device drivers can be built into the kernel (statically),
    or they can be compiled as separate modules. These kernel modules can be loaded
    “manually” (using insmod), semi-automatically (using modprobe), or “dynamically”
    (using the kernel daemon or the kmod kernel module).


    Note that the parallel port interface was completely rewritten between 2.0 and
    2.2 kernels. This resulted in a name change in the kernel configuration files
    (and their menuconfig and xconfig dialogs). The Linux kernel 2.0 configuration
    files referred


    > http://www.astart.com/lprng/LPRng.html'
