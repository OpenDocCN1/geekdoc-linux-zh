    In the first case, it is assured that the tape drive can be read from that tape
    drive, though all we get a list of the filenames on the backup tape. In the latter
    case, we get a list of differences between the data on the tape and the current
    state of the system.


    How to do a full restore? If a root filesystem is trashed tonight, what is the
    exact procedure to bring the file back into operation by morning? Let''s assume
    you''ve created and tested a rescue floppy, and that it has all the modules, drivers,
    and utilities needed to


    +   * Boot the system

    * Access the tape drive

    * Partition the (replacement) drive

    * Make new filesystems in those partitions

    * Extract the files from the tape archive


    That sounds simple enough. However, there are a few more issues to consider. One
    issue is that the entire /proc hierarchy of pseudo-files will be restored as regular
    files and directories in the proc. The normal boot process will mount a copy of
    the /proc filesystem over a non-empty directory without complaint, so it may be
    some time before anyone realizes the extra space on the root filesystem exists.
    This is easily remedied with an rm command. The only harm done is the waste of
    a bit more disk space than there is RAM in the system.


    # Sparse Files


    Another relatively minor issue is a bit more difficult to understand and explain.
    It has to do with sparse files (that is, with "holes"). Under the ext2 and other
    Unix filesystems, a file can be created in such a way that regions of the file
    do not have blocks allocated. Programs typically create these files using the
    seek call to skip over parts of a file. Blocks within the skipped portion are
    not allocated. If an application writes to the "hole," then filesystem blocks
    will be allocated for that region of the file.


    Any normal operations on these files (such as using the cat, grep, or other commands
    on them) will behave as though these regions of the file are filled with NULs.
    This applies to the default behavior of the cp, tar, and cp commands (dump works
    on filesystems at a lower level such that this consideration doesn''t apply to
    it). When restoring files, it is preferable to preserve this sparse allocation
    wherever possible. For this to work with GNU tar, the -S (--sparse) switch must
    be used when the archive is created. If the sparse file has been stored without
    the -S option, the restored file will take up significantly more space than it
    did at the time of the backup.'
