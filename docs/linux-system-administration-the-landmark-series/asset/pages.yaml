  md: '# Linux and Network Technologies


    LINUX supports all of the services mentioned in the previous section. Additionally,
    LINUX supports almost every network protocol needed to integrate these services
    into existing PC computing environments. LINUX can be integrated into Macintosh,
    Microsoft Windows, NetWare, and of course commercial UNIX environments. Many system
    administrators who administer Microsoft Windows networks prefer to use LINUX rather
    than native servers to provide file and print services.


    LINUX is also prepared for the emergence of the IPv6 protocol, which in upcoming
    years will replace IPv4, today''s standard networking protocol. IPv6 offers the
    same basic services as IPv4, but it supports a greatly expanded address space,
    is streamlined for more efficient processing, and has improved security.


    In addition to the variety of higher-layer protocols, LINUX supports a variety
    of physical network types. Ethernet, Token Ring, and FDDI interfaces are supported,
    as well as a variety of high-speed serial interfaces.


    More technical discussions of networking may be found in Chapter 13, "Network
    Technologies" and Chapter 17, "Network Services."'
