    kernels in the 2.0 and 2.2 series, and it should always be enabled.


    +   - ISO 9660 support is available for reading and writing ISO 9660 CD-ROMs.


    +   - HFS Macintosh filesystem support. It is still experimental as of this writing.


    +   - MS-DOS filesystem support, which is useful for reading and writing floppy
    disks.


    +   - NTFS support for the Windows NTFS filesystem is read-only as of this writing.


    +   - VFAT support for the Windows 95 or 98 filesystem.


