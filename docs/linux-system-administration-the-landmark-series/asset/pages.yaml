  md: '# Chapter 19 Printing and Faxing


    option after the hash sign (#). Boolean functions can take either true or false
    after the equal sign. A Boolean option may be specified without an assignment,
    in which case it is taken to indicate true. For example, :sh: and :sh-true are
    interpreted identically.


    Note that if a printer has enough memory to accept a complete job and its power
    fails after it has accepted the job, then the job is lost. The lpd daemon is responsible
    for seeing that the printer gets the job, not that the printer is successful in
    printing. Since printers are power-hungry devices, providing them with uninterruptible
    power supplies is rarely worthwhile.


    lpd as a printer name has a special meaning to lpd as the default printer to use
    if a default printer is not otherwise specified.


    sh suppresses headers—the pages that announce the owners of print jobs—so suppression
    saves one sheet of paper per print job. If headers are needed to identify jobs,
    use sb (short banners) similar to those at the top of modern machines. sh and
    sb take Boolean values.


    printcap entries for printers that are connected to another machine on the network
    or that attach directly to the network are similar. Replace the entry for the
    device (lpd-device) with two entries, describing the address of the machine serving
    the printer and the name of the print queue on the remote host. Consider this
    example:


    ```

    lpd|generic:

    :sd=/var/spool/lpd:rm=192.168.64.22:lp:

    ```


    rm could be a hostname or FQDN, as long as the name can be resolved properly.
    Using names is preferred, because a change of IP address for a network printer
    or the host to which a printer is attached should not necessitate a change in
    the printcap files.


    Several printcap fields may be used to send control signals to the printer. Many
    common of these use the feed character ff, issue a form feed before each print
    job fo, and allow special output after the print run (tr sets trailing info, and
    h1 the header page last instead of first). There are many other minor options,
    possibly varying distributions. If composing a new printcap file, consider the
    printcap(5) man page reference.


    # Filters


    The previous printcap examples were not attempted to correct data sent to the
    printer—to present the data to the printer that it expects. For instance, text
    printers may star-step, and PostScript must be handled differently than PCL.


    Parsing the data and transforming it into something that the specific printer
    understands is the job of a filter. printcap entries allow several types of filters—some
    specific to certain kinds of input data—of (output filtering) and if (individual
    filtering). Although these accept options, lpd gathers the other entries in the
    printcap file, only the name of the filtering program or script must be specified.'
