    # Linux Network Initialization


    When a LINUX system boots to runlevel 3 or 5, the /etc/rc.init/network script
    is executed. This script first initializes the kernel variable which controls
    whether the system will forward packets. This is a security feature—doing this
    ensures that the system will not forward packets during boot unless forwarding
    is intended. The next scripts bring up the network interfaces on each interface.
    One is done by running the /etc/sysconfig/network-scripts/ifup script on each
    interface. The configuration details for each interface are contained in the /etc/sysconfig/network-scripts/ifcfg-xxx
    scripts, where xxx is the name of the network interface (as eth0). These files
    determine whether the interfaces are to be configured statically or dynamically,
    using either boot or dhcp protocols. Systems that use PCMIA network interfaces,
    such as laptops, defer the initialization of PCMIA devices to later in the boot
    sequence. In this case, their network interfaces will be initialized when the
    /etc/rc.d/initpcmia script is run. Finally, if a default gateway has been indicated,
    it will be set during this stage of initialization. This normally completes the
    network configuration for most home or office systems.


    When a LINUX system is configured for a more complex network environment, such
    as a router or firewall, additional configuration and initialization becomes necessary.


