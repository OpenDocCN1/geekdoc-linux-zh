  md: '# I''ve Been Hacked!


    This is a large and complex issue. Security incident response procedures are discussed
    in Chapter 8, “Enforcing Security.”


    If there is reason to believe that the root account has been compromised in any
    way (SUID) root program or root daemon or other process has been subverted and
    forced to run any exploit code, disconnect the system and do a fresh install of
    the operating system from write-protected sources such as a CD-ROM or the build
    server. (This is why the properties on a build server should be hardware-jumpered
    read-only, except when the server is disconnected from the network.) Then perform
    a restoration of the data and configuration files. Do not restore binaries from
    tape, because they may be compromised (trojan troys).


    Configuration files that need to be changed from the image on the CD-ROM or build
    server should be carefully checked by hand. Many configuration files have scripting
    and programming statements or other features that can be used by an attacker to
    regain access. It is best to maintain copies of all configuration files after
    they were initially created and after all vetted changes. These copies should
    be kept on write-protected media (and printed copies should be kept on file as
    well)


    # Boot Troubles


    Because there are several software components involved in the boot process, there
    are several distinct stages during which booting problems can occur. We discuss
    each separately.


    # Can''t Boot Kernel: Stops in LILO


    To prevent LILO problems, rerun /sbin/lilo when building new kernels or changing
    drivers. Be sure to note any error messages or warnings that the command generates
    as it updates the MBR and its boot map file. Use the verbose option, -v, to see
    more detailed information as it runs.


    Keep a boot floppy handy for situations where the LILO maps are damaged (including
    cases where a DOS sector has trashed the partition table and MBR). Backing up
    the MBR and partition table of a drive is described in the section “Damaged, Infected,
    or Corrupt MBR.”


    Keep a copy of /etc/lilo.conf, these MBR backups, and other small crucial files
    like this on the rescue diskettes. Be sure to keep them up-to-date as the system
    changes.


    LILO Prints an Endless Stream of 010101010 . . .


    The kernel/boot image is on a device that is not BIOS-accessible.'
