  md: 'recommended for all Internet gateways. The use of FreeS/WAN internally presents
    an additional challenge to any cracker system which may compromise one machine,
    as well as to employees attempting to access data or systems for which they are
    not authorized.


    # Remote Access


    Before Internet access was common, remote access was provided via direct dial-up.
    When most Internet connections were made via analog modems, this continued to
    be a sensible approach. However, as employees increasingly acquired dedicated
    Internet access at speeds beyond the 128kbbs offered by the fastest dial-up ISDN
    service, demand increased for remote access via the Internet.


    Many IT departments have resisted the remote access via the Internet due to security
    concerns. The concerns are reasonable because it is easier to eavesdrop on Internet
    traffic than most telephone system traffic. However, these concerns can be overcome.
    Strong cryptographic authentication and encryption offer secure mechanisms for
    remote access via the Internet.


    Access should be provided to employees via ssh and FreeS/WAN. This reduces the
    support and other costs of maintaining a large dial-in pool.


    # Internal Security


    Most security breaches are committed by authorized users. There are two problems
    here—one is misuse of data to which a user has authorization, and the other is
    users gaining access to data for which they are not authorized. The former is
    a management problem. The latter is the subject of this section.


    In most jurisdictions, every organization is bound by law to keep certain information,
    such as personnel records, from unauthorized users. Public corporations are required
    to protect financial information until it is disclosed. Investment banks are required
    to keep merger and acquisition information from the sales force.


    Even that are not subject to legal prosecutions must often be protected from internal
    users. In many firms, engineering data must be kept from sales force lest they
    disclose information to customers in an effort to pre-sell products.


    Therefore, internal systems should be crafted as if no firewall were in place.
    It should be assumed that crackers are already inside the firewall. Strong encryption
    and authentication protocols such as ssh and Kerberos should be employed. Protocols
    such as ssh and telnet should be disabled. Consideration should be given to using
    IPSec to encrypt all internal IP traffic.


    Firewalls may be erected to separate departments within an organization. Each
    department that is restricted should have its own NIS domain and its own servers.
    Only members of the department should have entries in the passwd map for the domain.
    The file servers should not export filesystems to machines outside the domain.'
