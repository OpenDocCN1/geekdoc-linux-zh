    # 10


    # Configuring and Building Kernels


    LINUX IS BEST DESCRIBED AS A MULTITASKING, multiuser operating system. This means
    that the LINUX operating system can create the illusion of many programs running
    simultaneously on behalf of several different users. This is true even on a personal
    computer, which is typically used by one person at a time.


    This concept of a multiuser operating system allows LINUX a higher level of system
    integrity and reliability that would otherwise be possible. All of the basic facilities
    necessary to provide this multitasking, multiuser environment are encapsulated
    within the LINUX kernel.


    While the kernel is often thought of as a monolithic executable, it is really
    more a collection of privileged system calls (see Figure 10.1). The kernel''s
    privileges are enforced by the CPU, ensuring that processes in user space cannot
    interfere with each other.


    This chapter is concerned with configuring the appropriate collection of system
    calls into the kernel, compiling it, and preparing it for installation on a large
    number of systems.'
  merge: -1
