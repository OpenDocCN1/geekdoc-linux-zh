    Figure 10.1 Kernel processes


    The kernel is loaded at system boot time. Once loaded, it initializes the computer''s
    hardware resources and begins the LINUX startup sequence. It is the only software
    component allowed complete access to the entire computer''s resources. The kernel
    schedules CPU time to run among the running processes, manages memory, and controls
    I/O.


    The kernel is said to run in privileged mode. All microprocessors on which LINUX
    runs support for privileged (kernel) and unprivileged (user) modes. All user processes
    run in unprivileged mode. They are constrained by the hardware from directly accessing
    any physical component in the system, or each other.


    The upper half of the kernel provides a carefully designed set of subroutines
    that transfer data between a process and the kernel. Only through the system calls
    can a process interact with the outside world.


    The lower half of the kernel interacts with the physical hardware, as shown in
    Figure 10.1. This is done in a consistent modular fashion via device drivers.
    Device drivers have a common interface to the upper layers of the kernel. This
    enables the kernel to treat functionally equivalent devices in an identical fashion,
    despite differences in the hardware implementation.


    The lower half of the kernel also has to contend with asynchronous hardware events
    known as interrupts. Device drivers must supply interrupt handlers and arrange
    with the kernel to have them called when the computer signals an interrupt.'
