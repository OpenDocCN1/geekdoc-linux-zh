    # The rc Scripts


    The runlevels specified by the /etc/inittab file correspond to directories beneath
    the /etc/rc.d directory. When a new runlevel is invoked, the scripts in the corresponding
    directory are executed. The files in the rc.d directory are symbolic links to
    scripts in the /etc/rc.d/init.d directory (see Figure 9.1).


    These symbolic links have an ordering naming convention: The first character is
    the letter S or K, indicating whether the subsystem controlled by that script
    be started (S) or stopped (K) at that level. Then there are two numeric digits,
    followed by the script name as it appears in /etc/rc.d/init.d. The numeric values
    indicate the order of invocation. Scripts start and stop subsystems that comprise
    one or more related processes that provide a proper operating system service.⁸


    When the runlevel changes, init invokes the /etc/rc.d/rc script that processes
    all of the K files and then the S files. It first checks the /var/lock/subsys
    directory to verify that a subsystem is running before taking any action. This
    prevents subsystems from being stopped more than once.


    Any service without a shutdown service in runlevels 0 and 6 won''t be killed before
    a halt. therefore, any service needing handling during shutdown needs a K script,
    and a symlink to it rc.0 and rc.6 directories. Existing scripts can be used as
    examples.


