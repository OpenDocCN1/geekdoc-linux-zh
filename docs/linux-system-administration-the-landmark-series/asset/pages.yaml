    # # 18 Mail


    Do not get involved with an exotic lover, whispering delicious promises in your
    ear, flashing her bright eyes at you. But she is insane, and will draw you down
    into her madness.


    > ~ Andrew Molitar


    EMAIL HAS ECLIPSED TELEPHONY, facsimile, and direct personal interaction as an
    essential vehicle for business communication. The operation of many businesses
    has come to depend on the reliable delivery of email. With this in mind, we examine
    the software agents used by computers running Linux to deliver email, in order
    to ensure its secure, reliable delivery.


    First, we must distinguish between mail transfer agents (MTAs), mail delivery
    agents (MDAs), and mail user agents (MUAs). MTAs transfer email from one computer
    to another and are the agents by which email is delivered across organizations
    and over the Internet. qmail and sendmail are the MTAs commonly found on Linux
    machines.


    Once a message has reached the destination host, the mail delivery agent delivers
    it to the recipient''s mailbox. /bin/mail and procmail are examples of MDAs.


    MUAs are the programs with which users read, compose, edit, and forward email.
    When a user clicks the Send button, the MUA attaches some headers to the body
    of the message and passes it to the MTA running on the machine. The MTA then attaches
    additional headers and attempts to deliver the message to the destination host.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# sendmail


    sendmail was first written in 1981, in order to deliver mail among BerkNet.^1
    UUCP, and the ARPANET.^2 which then ran NCP (Network Control Protocol) as well
    as TCP (Transport Control Protocol), which superseded NCP. sendmail did an excellent
    job of delivering mail among various networks and earned its place as a widely-used
    piece of software upon which the Internet depended.


    Over the intervening decades, sendmail has grown even larger and more complex,
    even as the requirements have become simpler with the standardization of protocols.
    This large, complex, piece of software runs as root and must interact promiscuously,
    accepting connections from unknown machines across the Internet. It should be
    no surprise that sendmail has been the cause of more computer security problems
    than any other piece of Open Source software.


    Although sendmail still runs on most of the mail servers on the Internet, and
    is still the most widely used free software in the enterprise, sendmail should
    be avoided if possible. Its requires extreme vigilance in seeking of new security
    holes. With each new hole, a new version of sendmail must be compiled and installed.
    At large sites this may require considerable effort, because testing to ensure
    that the version doesn''t break anything. Then it must be packaged for mass installation
    and the package tested as well. Note that not only the external mail gateways
    must be kept up-to-date. As we discuss in Chapter 7, “Security Policy,” it is
    no less important to defend against attacks from within.


    If bureaucratic or technical considerations require that sendmail be run, ensure
    that the version^3 installed has no security holes by checking the website of
    your linux distribution and checking http://www.sendmail.org/. There are also
    mailing lists (we list in Chapter 8, “Enforcing Security”) by which to keep assured
    of security problems. Be ever-vigilant.


    # sendmail Configuration


    sendmail gathers its configuration from a single file, sendmail.cf. Current versions
    include an m4 facility for generating sendmail.cf files. The m4 package should
    be used, because it facilitates maintenance of any sendmail.cf generated by it.
    It is essential to maintain each .mcf file from which production .cf file is generated.
    When a .mcf file needs to be updated, it is all too common that the original .cf
    file has been lost. We recommend distributing the .mcf file as part of any binary
    sendmail package.


    +   1. A network used then within the University of California, Berkeley

    2. The predecessor of the Internet.

    3. To check which version of sendmail is installed on a particular host, telnet
    to port 25 of host. Of course, the banner that announces the version can be overridden,
    as can any method of checking the version.'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'In other words, everywhere a .cf file is found, its corresponding .mc file
    should also be present.

    To prevent mail bombs and secure against other exploits involving mail, mail should
    never be delivered to a mailbox or pool file owned by root. Ideally, mail for
    root should be delivered to an account that is not a member of the wheel group.
    Because this is not convenient, mail for root is usually forwarded to the accounts
    of the system administrators who manage mail.


    # # qmail


    qmail is a simple MTA first written in 1996 to provide a secure alternative to
    sendmail. qmail comprises several smaller binaries, each of which performs one
    task. That which must be run as root are run as root presents several advantages
    over sendmail: one large monolithic binary. The likelihood of bugs is reduced
    because each binary is smaller—in fact, all the qmail sources contain less than
    one fourth the number of lines of code as sendmail. It is also inherently more
    secure, because the compromise of one executable does not necessarily imply the
    compromise of all and because most of the functionality does not run as root.


    # # qmail Configuration


    The configuration of qmail is completely different from that of sendmail. Where
    the latter bundles all of its configuration options into a single file of notorious
    complexity, qmail is configured by means of many simple files, each of which determines
    a single aspect of qmail''s behavior.

    This makes qmail considerably easier for the novice system administrator (as well
    as some senior administrators) to manage. The disadvantage is that the large number
    of files adds to the complexity of packaging qmail for installation throughout
    the enterprise.


    # # qmail Installation


    Large organizations should produce their own packages for qmail installation,
    in order to include as much of the required local configuration information as
    possible.\Departmental mail servers will will have a common configuration that
    is quite different from the common configuration that clients and other servers
    will have. This difference may be provided for either by having a different package
    for mail servers or by breaking the distribution into two packages: binaries and
    config files. In the latter case, there will be alternative packages for mail
    servers and client config files. We recommend this because it allows the base
    package to be revised without having to change the configuration package. In addition,
    a system''s role can be determined by inspecting the packages.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Mail Service Structure


    Reliable and timely delivery of email within an organization requires mail service
    to be structured without any single point of failure that might interrupt mail
    service for the whole organization. In other words, the failure of any mail server,
    DNS server, NIS server, or network should not delay delivery of all email.


    # Departmental Mail Servers


    Each operational department should have its own mail server. dedicated to mail,
    or it may run on hardware that also provides services such as DNS and NIS. This
    choice will depend on the requirements and budget of the organization.


    Departmental mail servers should direct mail for any given internal recipient
    to the user''s departmental mail server. For this to work, each mail server must
    be able to resolve user names to fully qualified email addresses. The alias information
    by which this is accomplished usually taken from the aliases NIS map, though it
    may be taken from the aliases file.


    Mail should never be transferred to a client workstation for storage. Doing so
    would violate the principle of not storing any user data on client machines. Rather,
    mail should be stored on the mail server until it is no longer needed, and copies
    should only be sent to client machines to be read. In order to accomplish this,
    POP or IMAP or both should be supported on each departmental mail server. IMAP
    is preferred, but some MUAs do not support it. Ensure that users do not have the
    option of saving mail locally. Some system administrators export the mail spool
    via NFS for each client to mount. Doing so is unreliable and usually leads to
    grief.


    It is usually acceptable for departmental mail servers to be single points of
    failure for their department''s mail. Incoming mail will queue until service is
    restored.


    # External Mail Gateways


    Mail destined for users outside the organization should be directed by each departmental
    mail server to external mail gateways. Large organizations will typically have
    two servers for handling outgoing mail, with DNS pointing at both of them in round-robin
    fashion. Incoming mail will typically be received by either of two servers, also
    served by round-robin DNS. These will then consult the aliases map and direct
    mail to the appropriate mail server.


    Large organizations will run incoming and outgoing mail servers on separate hardware
    to prevent faults in affecting the other and to facilitate the diagnosis of any
    problems that may occur. For these reasons, smaller organizations that can afford
    only two external mail servers are better served by having one for incoming mail
    and the other for outgoing mail than by having each machine provide both services.
    Simplicity is usually more important than hardware redundancy.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# procmail


    procmail is a mail delivery agent that processes mail according to rules specified
    in a .procmail file. It is most often used to sort mail into different folders
    based on the sender, the subject, or it is also used to selectively forward mail,
    and to start programs upon the receipt of some or any type of mail message. For
    example, procmail can forward to a pager the first 80 characters of every message
    that meets specified criteria. procmail is also capable of managing mailing lists.


    System administrators can set procmail to the default MDA. This will enable users
    to create .procmailrc containing files for how they would like their mail to be
    processed. Note that procmail, by default, will deliver to the usual spool directory
    for mail users who don''t have a .procmail file. The software and additional information
    may be found at http://www.procmail.org/


    # Spam


    Spam is unsolicited mail, usually sent to Usenet, often to large numbers of newsgroups,
    which are off-topic. Here we discuss unsolicited mail and what may be done to
    stop it.


    The first thing that every system administrator responsible for external mail
    gateways should do is ensure they cannot be used as relay hosts. Spammers often
    use someone else''s email mailhost to send hundreds of thousands of messages.
    Sites that unwittingly are used by spammers to relay mail are often eventually
    cut off from large portions of the Internet. Explaining to management that half
    the Internet couldn''t buy anything from the company''s website because a spanner
    used the misconfigured mail gateway to relay 400,000 advertisements is not likely
    to be a pleasant experience.


    Sites running procmail are not vulnerable to spam relays. Running should ensure
    that they are running version 8.9.0 or higher, because such disabling relay may
    be default. See http://maps.vix.com/ for more information on spam relaying and
    how to fight it by automatically denying service to surveyors of spam and those
    who abut them.


    To protect users email addresses have fallen into the wrong hands, we recommend
    installing software on departmental mail servers that use patterns to determine
    whether an incoming message is from a known valid sender, a known spammer, a probable
    spammer, or an unknown sender. This software either accepts the mail, drops or
    bounces the mail with a polite explanation, in an effort to combat spam, the mail
    is being returned because the sender is unknown. The bounce message should include
    instructions for resending the mail so that it will be accepted. Maintaining the
    pattern file of good senders may be tedious, because entries for senders from
    many companies will generally match any user in the domain, while entries for
    senders at ISPs should match only that user. This is an excellent task for a junior
    system administrator.'
  merge: -1
