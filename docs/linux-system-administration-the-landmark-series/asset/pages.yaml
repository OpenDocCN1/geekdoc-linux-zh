  md: 'format between lpr and one can use plain native printer languages. Luckily,
    most common printers are supported by Ghostscript.


    The other two major formats used in UNIX and LINUX are troff and DVI.


    The troff and groff formats are most commonly used for man pages. The GNU groff
    package provides support for printing and displaying these files. The easiest
    way to use troff files is to let "magic" filter pass them through groff (gro to
    PostScript conversion) filter. There is also a grovi filter to generate DVI formatted
