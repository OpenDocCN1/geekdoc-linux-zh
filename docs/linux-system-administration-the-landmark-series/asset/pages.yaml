  md: '# Glossary


    # 289


    and local customization without requiring re-compilation and re-installation of
    the many programs that are linked to them.


    Thus, with shared libraries a system administrator can move from file-based directory
    services to NIS, NDS, LDAP, or some future or custom set of services without changing
    the rest of the programs that use these services.


    See also libre, library.


    Under Unix and Linux, the signal is the most fundamental and common form of interprocess
    communications (IPC). It is also the basis for “event-driven” programming under
    these systems. Each UNIX implementation defines a set of signals that are associated
    with various asynchronous events, such as a terminal sending an “interrupt request”
    (SIGINT) or a change in window size (SIGWINCH).


    signal handler A routine within a program that serves the special purpose of responding
    to signals provided by its parent or other processes. A common example would be
    SIGINT, described above, or SIGSUSP as described under job control.


    skuler A script that periodically removes unwanted files (such as core files)
    or kills specific processes.


    These must be carefully written to avoid “false positives”—erroneous matches to
    the criteria used to determine which files to remove or processes to kill.


    sockets A socket is the primary form of interprocess communication (IPC) introduced
    by BSD. There are two major sorts of sockets. A “UNIX domain socket” is a node
    (directory entry) in the filesystem, such as /var/run/printer, /dev/log, or /tmp/.unix/*.
    The other major sort of socket is in the TCP/IP or “inet” addressing family. Sockets
    are the normal form of connections and transactions performed over TCP/IP address.
    In either case, they allow a client to communicate with a server, locally in the
    case of UNIX domain sockets, and across TCP/IP networks in the case of Internet
    sockets.


    An “Internet socket” is uniquely identified over the entire Internet by a combination
    of source IP address and destination port.


    sparse files Under many filesystems, a file can be stored in such a way that large,
    “blank” portions are “skipped,” not stored as long streams of NUL characters.
    Any normal operations on these files will behave as these regions of the file
    are filled with Nulls. The amount of data stored on disk is significantly less
    than the entire file. This is especially useful for large datasets.


    Programs that perform seek() and lseek() pass the end of an existing file may
    create a “hole” (depending on how large the seek gap is, and on the filesystem
    type and its block size settings).'
