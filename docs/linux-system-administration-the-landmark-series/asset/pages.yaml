    # # 11 Scripting


    Never send a man to do a script''s job.


    ONE OF THE GREATEST STRENGTHS OF LINUX is the ease with which it can be configured
    or modified. Two features of the operating system make this possible—nearly all
    configuration and system data files use plain ASCII text, and much of the system
    initialization code exists as executable shell scripts. Shell scripts are stored
    in files as human-readable instructions that are executed by one of the many command
    interpreters¹ available on a LINUX system.


    This chapter describes many of the interpreted languages used by the LINUX system
    itself, as well as those used to build system administration tools. Examples are
    provided in a variety of scripting languages. This does not to suggest that particular
    tasks must be scripted in a particular language, but rather to show that a variety
    of choices are available. Of course, some languages are better suited to particular
    tasks than others, but nearly any scripting language can be used. The best choice
    often depends as much as the skills of the system administrator as on the nature
    of the task.


    > ¹. Command interpreters are programs that implement a programming language by
    interpreting a series of commands as they are executed. This contrasts with a
    compiler, which translates the entire program into machine instructions for later
    execution.'
