  md: '# Booting


    The opportunity to pass parameters to the kernel via the /etc/lilo.conf file.
    Options may also be set interactively by running lilo at the console.


    LILO is instantiated running /sbin/lilo, which reads /etc/lilo.conf to determine
    the intentions of the system administrator. This creates the map file /boot/map,
    which records the locations of the kernel and all other files that the boot loader
    may need to reference. It is critical, because the boot loader does not understand
    filesystems; it must reference files by their location on the disk. Thus, it is
    imperative to run /sbin/lilo before rebooting whenever there is a change to the
    kernel. Failure to do so is likely to render the system unstable.


    lilo can be run in multi-user mode with either the -t (test) or q (query) options
    to show what LILO would do during an actual boot. See the lilo(8) page for more
    detail.


    Some of the interesting options that may be configured in /etc/lilo.conf include
    whether or not to present a console prompt before uncompressing and loading the
    kernel, a list of up to 16 kernels that may be loaded and the parameters to be
    passed to each, and the timeout for the prompt, if present. Many other configuration
    options are possible. They are documented in the LILO User''s Guide, distributed
    with the LILO source code.


    LILO is sometimes configured to compress and load a ramdisk image into memory,
    as well as a kernel. This is used by the Linux kernel to load modules into the
    kernel needed to boot the boot media. The most common case is SCSI support, where
    the SCSI adapter driver is specified as a kernel module. The filesystem is deallocated
    when the driver(s) are loaded into the kernel.


    Normally, /etc/lilo.conf is configured such that /sbin/lilo installs the first
    part of LILO''s boot loader (along with the partition table) in the Master Boot
    Record (MBR) of the hard disk from which the system is to be booted. The first
    part of LILO''s boot loader loads the second part, which is normally /boot/boot.b.
    However, /etc/lilo.conf may be configured to install LILO other places, such as
    a floppy disk, or in the first sector of a boot partition. The latter allows for
    the option of leaving management of the MBR to the software of any other operating
    system also installed on the system.


    In addition to passing parameters to the kernel, LILO is capable of passing parameters
    to init. These have the effect of defining environment variables. The BootPrompt
    HOWTO for more information on passing parameters at the Boot: prompt.


    Another mechanism for booting LINUX on PCs is Loadlin, which boots LINUX from
    within a Microsoft Windows operating system.


