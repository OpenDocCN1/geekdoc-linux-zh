    # The Process


    The process of transforming a request into a specification should be simple, quick,
    and easy, yet thorough enough to ensure that meeting the specification will solve
    not just a symptom but the real problem at hand.


    This process may vary somewhat from one organization to the next, but it will
    generally involve most or all of the following steps. If the project is urgent,
    these may all be taken in a single day. Emergency projects may condense the process
    to a quick discussion among the most senior system administrators. But the objectives
    of the process remain invariant—to determine the real problem at hand, and what
    would constitute a solution.


    # Abstract the Problem Description


    Often a request or requirement will be expressed as a directive to implement a
    specific approach or solution—example, “We need to install a new web server.”
    You’ll want to abstract that to find out the desired results. “What information
    are we trying to publish, and to whom should it accessible?


    We can, of course, just do what is being asked of us. In some cases that is is
    required. However, if we understand more about the desired results or the intended
    goal, we are far more likely to offer good recommendations. Even when we consult
    with others (such as by posting to a newsgroup), “Which is the best web server?”
    is likely to yield a less useful answer than “Which is the best web server for
    ...”


    # Clarify the Authorities


    The first thing to do is know whose requirements are to be met. Ultimately there
    is a person or group of persons whose judges whether an effort has been beneficial
    or detrimental to the overall mission of the organization. It will usually but
    not always be appropriate to define the problem in terms of their requirements.


    A system administrator who understands the business as well as those who will
    judge his performance may seek to meet the requirements of the shareholders above
    the parochial interests of managers. While doing so may be the most ethical thing
    a system administrator ever does professionally, the risks should not be taken
    lightly. It will usually suffice to point out to a manager that a particular path
    of action does not appear to be in the interests of the shareholders. A manager
    intent on doing the wrong thing may sometimes be dissuaded by nothing short of
    a senior system administrator offering his resignation. If the resignation is
    accepted, it would not have been a good environment in which to work anyway.'
