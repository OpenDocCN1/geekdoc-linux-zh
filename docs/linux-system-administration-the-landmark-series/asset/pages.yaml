    # 12


    # Backups


    BACKUPS ARE COPIES OF DATA held in reserve against loss or corruption. These copies
    are made periodically, according to a predetermined schedule. Backup solutions
    vary greatly with the size and scope of their environments, depending on the organization’s
    requirements. The elements of a backup system are the hardware, the backup media,
    and the software. The hardware can range from a single SCSI tape drive to a tape
    librarian. The media required is a function of the hardware, the amount of data
    maintained, and the retention policy for the data. Typically, backups reside on
    magnetic tape like it is an affordable medium. Finally, the software can range
    from free utilities like tar and cpio to distributed, cross-platform storage management
    systems costing thousands of dollars.


    Backups generally provide three services:


    +   - They allow for the recovery of files that have been accidentally deleted
    or lost because disk hardware has failed.

    - They provide regular snapshots of the state of the organization’s data. The
    organization may use this service extensively for a variety of technical and business
    purposes. Financial and budgetary data can be recovered to assist in audits. Data
    may also be used to assist in litigation.'
