  md: 'hierarchical domain structure of Netinfo overcomes most of the difficulties
    of maintaining consistent common data among NIS domains.

    NIS+ was Sun''s response to Netinfo. It includes some of the advancements made
    by Netinfo while maintaining some backward compatibility with NIS. However, both
    the design and the implementation were less than compelling. NIS+ is far less
    widely used than NIS. We mention it here because it does offer some advantages
    over NIS, and work on a Linux implementation is in progress.


