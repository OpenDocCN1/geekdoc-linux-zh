  md: '# Application Considerations


    Some applications absolutely require a consistent set of data in order to function
    wisely. Database management systems are the most common example, although Enterprise
    Resource Planing (ERP) systems have similar requirements. These applications require
    their own backup procedures.


    The data belonging to such systems are often in flux, the task of capturing a
    consistent state is beyond the capabilities of software such as tar, cpio, and
    dump. For example, data referenced early in the process may be deleted or changed
    before the backup system gets to it.


    To accommodate this problem, vendors of systems that have needs usually include
    backup software for capturing a consistent state. They may include hooks provided
    in an API, or simple shell scripts called by the application, which can be modified
    or replaced. If these applications and the backup system do not have a common
    interface, a glue layer will have to be developed.


    In cases where the business processes allow the applications to be offline periodically,
    a simple backup scheme might work, but it should be thoroughly tested.


    Database systems that support replication still require backups. Replication does
    not protect against accidental or intentional deletion of needed data. Also, the
    network connection between the replicated systems may fail, resulting in inconsistencies.
    Other types of failure tend to happen during such conditions.


    The backup strategy for databases should be worked out in cooperation with the
    database administrators (DBAs). It may be acceptable to permit the DBAs to manually
    initiate backups and restores, or it may be necessary to involve system administrators.
    This depends largely on the skill sets of the personnel at hand.


    # Systems Versus Data


    In this section, we discuss some of the problems that may arise when attempting
    to restore a complete system. We do this to underscore the recommendation we made
    in Chapter 3, “Recovery Planning,” that the recovery plan for systems should be
    rebuild them from a well-developed template. We use system administrators not
    to rely on backups for anything but data. Rather, we suggest that systems be recovered
    by rebuilding them as described in Chapter 15, “Automated Installation and Upgrade.”


    Conceptually, doing backups is pretty simple—just a copy of everything you might
    want to restore. However, there are complications with that. Let’s consider the
    following scenario:


    +   A full system is backed up to a SCSI template with the following command:


    ```

    tar cf /dev/st0

    ```


