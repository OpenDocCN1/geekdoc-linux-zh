  md: '# System Features


    Although the functionality of a complete backup system has been discussed, there
    are specific features that merit explanation. These include archive formats, cataloging,
    and robotics.


    # Archive Formats


    There is a great deal of debate on archive formats. Many system administrators
    think that a backup product must write a standard UNIX format (dump, tar, or cpio).
    Meanwhile, several vendors have declared proprietary tape formats. In an effort
    to win support for their decision to use proprietary formats, vendors have provided
    format specifications and have released open source stand-alone restore utilities.
    These actions have had limited impact on their detractors.


    The real concern underlying this discussion is the ability to recover data years
    after it is retired, even if the vendor no longer supports the backup software
    or if the vendor is no longer in business.


    # Cataloging


    Backups are exercised when a request to restore data comes in. In most cases,
    the previous night''s tapes are retrieved—a simple matter. It is quite another
    matter to find the correct media for a backup of a server that has been retired,
    or to locate database dumps two years earlier.


    In these circumstances we look to the cataloging capabilities of the backup system—or
    the system administrators. Many of the sophisticated backup systems maintain a
    catalog of all media in use, including the volumes written on those media. For
    large environments, this may require considerable disk space. Basic utilities
    such as tar and cpio do not offer such catalogs.¹ If these are to be used, either
    additional software must be written to them, or manual procedures must be implemented
    so that tapes may be recovered. Also, many systems that have a catalog do not
    have a mechanism to convey that a tape has been moved to off-site storage. We
    may have to be implemented by labeling and keeping good records.


    # Tape Robots and Jukeeboxes


    Robotic tape changes reduce the demands on operations staff and automate the backup
    process as much as possible. This is for two reasons: first, the reduction of
    computer operator time saves the organization money; second, taking the operator
    out of the loop reduces the possibility of human error. Larger tape robots support
    multiple tape drives and utilize bar code readers to manage the tapes, resulting
    in far more reliable operation.


    > ¹The t option to tar could be used with some scripts to form the basis of a
    primitive cataloging system.'
