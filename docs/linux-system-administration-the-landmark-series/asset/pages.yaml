  md: 'files and directory permissions are correctly set upon installation, so it
    is a matter of not corrupting them during file maintenance or as part of the build
    process.


    Certain programs have the set user id set. This means the program will begin running
    with the effective user id identified by its file ownership. This is an important
    mechanism for allowing restricted access to secure resources, but it is also exploited
    as a means to gain unauthorized privileges. It is considered unsafe to mount filesystems
    from remote hosts allowing the set user id option; therefore, use of the nosuid
    option is recommended.


    In addition to the user id option, NFS filesystems should not be exported without
    restriction. Always specify a list of hosts or use wildcarding to restrict the
    hosts being exported to. If the environment is running NIS, restricting exports
    to specific netgroups is appropriate. More information about NFS access control
    can be found in Chapter 20, “Working with NFS”


    # Special Accounts and Environments


    Frequently, special accounts need to be created. Some are created because they
    are exposed to the public and must be secured against prevent intrusion. Some
    are pseudo-logins used for the purpose of creating a uid to own a particular data
    set and are not intended for interactive use. Another special account type is
    granted limited access to privileged commands (for example, an operator account).


    The best way to secure a user account is to create a root account. By specifying
    the root login shell, system administrators can create an account that does not
    have access to the normal file hierarchy. The first argument is a directory that
    contains the root environment. This is a minimal version of the normal UNIX hierarchy,
    populated with the minimum number of utilities, shared libraries, and devices
    to perform the job at hand. This often requires experience because it is difficult
    to guess what may be required by it; the C runtime library. The trace utility
    may be helpful in identifying the needed components. The third argument must be
    the command interpreter or the utility to be executed.


    An account may be created solely to provide shared access to a data set or a binary
    distribution. Such an account needs the functionality of a normal user account,
    but with restricted access to the account itself. By setting /bin/false we can
    limit access to this account to those who know the password and already have another
    account on the system. Users use the sudo command to access the account, an event
    which is reported to syslog. Note that this type of account is more of an administrative
    convenience than a security measure, but it does control access to the account.
    However, once a user gains access to the account, no audit trail exists. It is
    impossible to determine what commands were used by which user with access to the
    account. Most auditors hate this sort of thing, but they are generally unable
    to come up with a workable alternative.


    The third type of account grants the user special privileges beyond normally permitted
    for a user-level account. The sudo utility can be used for this purpose. The sudo'
