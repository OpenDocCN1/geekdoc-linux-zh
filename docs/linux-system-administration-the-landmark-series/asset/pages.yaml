    Beyond the range of environments with which they work, system administrators are
    often given responsibility for any roles for which an organization has no specialists.
    Sites that have no dedicated DBAs (database administrators) generally have one
    system administrator who manages any local databases. Sites that have only one
    system administrator is likely to cover for him and is likely to manage many technical
    aspects of any database servers that the DBA works on. Similarly, sites that have
    no dedicated network administrators, the system administrators manage the hubs,
    routers, and switches often maintain the network cabling. Sites that have no Help
    Desk, the system administrators usually provide for all of the on-site user technical
    support. For sites with a Help Desk, the system administrators are nearly always
    the ultimate point of escalation for technical questions. A system administrator
    is usually a “jack-of-all-trades."


    # ## “Vendor” Documentation


    The primary source of information for any operating system or software package
    should always be its own documentation, whether printed or electronic. It includes
    the help pages (traditionally provided by the man command in UNIX and Linux, and
    supplemented by the texinfo program and files that are part of the GNU suite),
    help screens, menus, and other features within programs themselves.


    Since LINUX is not the product of a single “vendor,” we find that the documentation
    for different GNU, LINUX, and Open Source packages comes from diverse sources
    and in many formats.


    The documentation for Linux is developed by the same process and distributed in
    the same ways as Linux itself. The LINUX Documentation Project is a collaborative
    effort by many individual volunteers and various interested organizations. It
    includes over a hundred HOWTO documents on specific topics and packages, a number
    of FAQs, and a set of guides (full-length books).


    These are the “vendor” sources for Linux documentation. The place for Linux novices
    to start is Linux Installation and Getting Started. From there a user might progress
    to the Linux User’s Guide, while the aspiring system administrator will certainly
    want to peruse the Linux Network Administrator’s Guide and Linux System Administrator’s
    Guide.


    In addition to these sources, most distributions of Linux come with their own
    documentation. It may be printed (with Red Hat), some may be included electronically
    (Debian), and some may be included in both forms (S.U.S.E.).


    In all cases refer to your documentation’s documentation. Some packages change
    as they get upgraded and ported. The map is not the terrain. If our program disagree
    with the man or texinfo pages at your site, its probable that a program’s behavior
    will match its documentation. Ultimately it is the program itself that is the
    “terrain.” In some cases it may be necessary to test the program or read its sources,
    in preference to relying on the documentation that came with it.'
