    # Tools


    Several toolkits are available to assist with securing a system and for detecting
    potential security breaches. Many of the packages provided with Linux already
    have security features—we encourage their use.


    The highest degree of authentication security can be obtained by utilizing hardware
    tokens, such as products manufactured by SecureNet or Secure-ID. These require
    physical possession of a small device to authenticate. Several security software
    packages contain support for these products.


    We suggest using the following tools with eye towards further enhancing the security
    of exposed systems or systems containing highly sensitive data. These tools improve
    access security by implementing stronger authentication mechanisms:


    +   - PAM (Pluggable Authentication Modules). This is the Linux authentication
    framework. There is currently no support for one-time passwords or hardware tokens,
    but the PAM framework should allow support for these technologies to be integrated
    into the Linux operating system.

    - s-key. This is a package for creating and processing one-time passwords.

    - opie. This is another one-time password package.

    - ssh (The Secure Shell). ssh can be configured to use public key passphrases
    and perform encryption.


    These tools are intended for checking password strength and examining network
    services and filesystems for known weaknesses:


    +   - COPS. Detects system and password security problems.

    - Crack. This program checks for weak passwords.

    - Tiger. Detects system and password security problems.

    - SATAN. Detects network security holes.


    These tools are for performing advanced diagnostics and logging:


    +   - tripwire. This program detects files that have been altered.

    - swatch. A utility for monitoring log files. This is a useful general-purpose
    tool.

    - netcat. This utility can be used for low-level port scanning for TCP and UDP
    sockets.

    - tcpdump. This is a general-purpose packet sniffer.'
