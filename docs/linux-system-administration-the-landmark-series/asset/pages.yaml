- img_proc: true
  md: 'While most shell scripts are quite short (fewer than 100 lines), some can be
    quite complex. There is an ambiguous area beyond which scripting becomes “real”
    programming. This is appropriate for those system administrators who are interested
    in programming. In other cases, it may be necessary to negotiate the assignment
    of some scripting projects to a programming team or to outsource further development
    and enhancements.


    It is useful to ask, “What does a script do for us?” System administrators often
    ask, “Saves time,” “Makes things easier,” or “Makes things less error-prone.”
    One may also think in terms of the “ates”—abbreviate, automate, regulate, and
    delegate.


    # Abbreviate


    System administrators often repeat a sequence of commands. Enclosing them in a
    script provides an abbreviated way to invoke command sequence. This is the simplest
    sort of script.


    After typing a long, complex command, or a sequence of shell commands will be
    needed again, one can make them into a script by using a command like this:


    ```

    history > ~/bin/script

    ```


    and then editing that file, cutting out the unnecessary portions, adding the appropriate
    header at the top, and setting execute permissions.


    Here is a sample script for abbreviating a telnet session:


    ```

    #!/usr/bin/expect -f

    # Sample telnet automation

    ## call with autotel ~/.autotel and

    ## expects a directory named ~/.autotel and

    ## a file corresponding to a nickname for the host thereunder.

    ## reads the true hostname, username and password therefrom

    ```


    ```

    set nick [index $argv 0]

    set rcfile [ open ~/.autotel/$nick ]

    gets $rcfile host

    gets $rcfile user

    gets $rcfile pass

    spawn telnet "$host"

    expect "$login:"

    send "$user\r"

    expect "word:"

    send "$pass\r"

    interact

    ```


    This script reads the hostname, login name, and password from the “nick” file
    (a user’s nickname for the remote system) under ~/.autotel/ that corresponds to
    the hostname.'
