    # The Rescue Disk


    The first step in recovering from most catastrophic system failures is to boot
    into some system where diagnostic, repair, and restore commands can be issued.


    The Linux system administrator’s toolkit should include a boot/root floppy for
    every major type of system supported. It is often possible to build one with sufficient
    drivers to work in all Linux machines within an organization, or if the diskette
    needs enough access to the network to mount an NFS exported (read-only) partition
    with a full set of recovery tools.


    There are many “microdistributions” of Linux–systems that fit on one to three
    floppies and run completely from RAMdis. The most popular is probably Tom’s Root/Boot,¹
    created and maintained by Tom Oeser. This is fairly easy to customize and is sufficiently
    “complete” to allow full network client access. Thus, one can customize a Root/Boot
