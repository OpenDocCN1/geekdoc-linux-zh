    # BOOTP, DHCP, TFTP, and RARP


    This is a collection of services that perform operating system related tasks.
    BOOTP and DHCP support automated IP address configuration for LINUX and other
    systems. BOOTP supports static mapping of Ethernet addresses to IP addresses,
    while DHCP provides dynamic address allocation. Unfortunately, DHCP cannot update
    DNS, which will be needed for many configurations. If DNS is not updated to follow
    IP addresses, hosts will change names when they are issued new IP addresses. This
    interferes with hostname authentication. If all client workstations have the permissions
    to resources, then this may not be a problem, and using DHCP for client workstations
    is quite feasible.


    In addition DHCP and BOOTP can be used to assist in network-based system installs,
    such as with RedHat''s Kickstart installer. See Chapter 15. "Automated Installation
    and Upgrade."


    Another tool used to assist is the Trivial File Transfer Protocol (TFTP). TFTP
    is typically used to download files from a server to a client during the install
    process. It is unsuitable for a secure environment, and care must be taken not
    to allow TFTP to be used to steal or alter files on the server.


    Finally, the Reverse Address Resolution Protocol (RARP) is used by some systems
    to discover their IP addresses. LINUX does not require RARP services. This service
    is provided to support network devices that may need it. Sites that do not need
    RARP should disable it, with any unused service.


    # RPC


    A Remote Procedure Call (RPC) service provides applications with the ability to
    perform subroutine calls to other processes, which are typically running on other
    computers. The Open Network Computing Remote Procedure Call (ON RPC) service has
    become a standard in the UNIX community. Many other RPC protocols exist, but ON
    RPC benefits from the popularity of the applications that have been layered on
    top of it. NIS and NFS are both implemented using ON RPC.


    The RPC service uses the concept of program numbers to identify RPC-based services,
    The RPC port mapper daemon maps program numbers to TCP or UDP ports, as needed.
    Each RPC service registers with the portmapper on its host and provides its program
    number and the port to which it is listening.'
