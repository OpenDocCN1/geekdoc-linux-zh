  md: '# http


    The World Wide Web is based on the HyperText Transfer Protocol (http). This protocol
    defines mechanisms for the transfer of web pages, images, and other files. It
    depends on several lower-level protocols, including TCP, DNS, and RPC.


    The software most commonly used to provide http services is Apache. A properly
    configured Linux system running Apache and the needed underlying services is an
    excellent WWW server. Most of the configuration requirements are imposed by Apache.
    Here, we discuss system configuration issues that are independent of Apache.


    WWW servers come under attack more often than others. The prudent server administrator
    will disable all services not essential to the proper functioning of the server.
    Unless there is reason otherwise, ensure that Apache runs as user nobody. Never
    run any WWW server as root. With FTP, the files served should be in a directory
    structure protected by chroot.


    Provide a /var or /var/log partition with enough capacity to store the logs that
    a WWW server can generate. Servers with high loads may be fine with a 100MB partition.
    Heavily loaded servers may require a /var/log partition of 500MB or more.


