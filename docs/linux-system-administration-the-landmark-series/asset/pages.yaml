  md: 'Regardless of the tool used to generate the .config file, be sure to compare
    it with the previous .config file, and understand all the differences. In rare
    cases it may be necessary to reference the source code, but the documentation
    should suffice. If the previous .config file is unavailable, have a good look
    at the new one before compiling the kernel. The options should all make sense.
    Consult the documentation if they don''t.


    Note that once a kernel Proc filesystem has been compiled, many kernel features
    can be reconfigured without recompiling. As described above, Linux uses a pseudo
    filesystem located at /proc that provides the means to view and change many parameters
    of a running kernel as though they were entries in ASCII files.


    # Modules


    Determining whether or not particular features may be needed by the kernel is
    straightforward requirements analysis task. However, Linux provides two different
    methods for including features. A feature may be either statically compiled into
    the kernel or as a loadable module.


    The advantages of statically compiling functionality into the kernel are simplicity
    and speed of execution. The advantage of compiling a loadable module is that the
    base kernel remains smaller, using less memory when the module is not needed.
    Of course, when the module is loaded, a bit more memory is used than the static
    kernel would have, and loading imposes a small execution delay.


    The two questions to ask before deciding whether to compile something statically
    into the kernel or as a loadable module are How many of the systems will require
    this? How often will they require it? The former question is more important of
    the two. Functionality that will be used frequently by a small minority of systems
    should be compiled as a loadable module.


    For example, someone may have a business justification for a particular printer
    that is not available with a network interface. This will require a print host,
    for printing. Compiling a nonstandard kernel for this machine would make support
    and upgrading unnecessarily difficult. So, it would be better to compile print
    support as a loadable module available to all machines, though few if any would
    ever need it.


    # Compiling the Kernel


    Once the .config file has been prepared, it is time to compile the kernel. Follow
    the instructions in the README file included with the kernel sources. These evolve
    as the kernel does, so it is not appropriate to reproduce them.


    Pay attention to dependencies, because a new kernel often requires one or more
    updated packages, such as binutils or net-tools. The Changes in the Documentation
    directory of the kernel source should provide a complete list.'
