    # Configuring the Kernel


    System administrators will generally want to use the latest stable kernel. Up-to-date
    sources are available from http://ftp.kernel.org/pub/kernel/linux/ where is the
    two-letter ISO code for the country from which it is downloaded. For example,
    a system administrator in the United States would use http://ftp.us.kernel.org/
    while a system administrator in Germany would use http://ftp.de.kernel.org/. If
    no mirror exists in a particular country, choose a nearby country to which there
    is good internet connectivity.


    After acquiring the kernel sources, apply any patches that are needed, using the
    patch command. See the README file included with the kernel sources. Once the
    sources are as desired, the .config file must be prepared. This file directs which
    features are to be compiled into the kernel, as modules, or not at all.


    There are three tools for preparing the .config file: make config, which is a
    commandline utility; makeconfig, which offers text-based menus, radio lists, and
    dialogues; and makeconfig, which is an Windows-based configuration tool. In the
    experience of the authors, make config is kept up-to-date better than the graphical
    tools, this is not likely to be perfect with stable kernels. However, make config
    lacks any facility for returning to a previously chosen option, so a type requires
    make config again. Defaults are from an existing .config file, if present.


    Additionally, make oldconfig is similar to make config, except that it asks questions
    for only new configuration options, setting all other options to the .config file
    from the last time a kernel was configured. If configuring a new kernel revision
    using make oldconfig, be sure to move the previously .config file to the new directory
    if the previously chosen options are desired.


    System administrators with experience compiling Linux kernels may prefer to edit
    .config directly. This may not work if the kernel needs to be compiled with configuration
    options that were added since the .config file was originally generated. Also
    note that just commenting out lines in .config may not have the desired result.
    If at all unsure, one of the configuration tools,'
