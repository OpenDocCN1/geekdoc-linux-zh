    # Firewall with Linux


    Most organizations use a firewall to connect to the Internet. The LINUX kernel
    supports a number of firewall configurations. The 2.2 kernel contains a mechanism
    called IP chains, which allows almost arbitrarily complex packet filtering and
    forwarding rules to be created. As an additional security feature, the TCP wrappers
    program is integrated into most of Linux. TCP wrappers allow network services
    to be granted or withheld based on host, domain, or network and includes identity
    to guard against spoofing.


    The 2.2 kernel series also supports Network Address Translation (NAT), which can
    circumvent many of the limitations of configuring an RFC 1918 network. NAT ensures
    that packets from machines on an internal network have their dynamically renumbered
    to the address of the host performing network address translation. The host also
    keeps track of which sessions have been renumbered, and that it is possible to
    match responses to these packets and map them appropriately. The result of NAT
    is that hosts on an internal network have nearly transparent access to external
    networks (usually the Internet). There are some problem protocols for which some
    special processing might take place. The Linux kernel supplies special "helpers"
    for most of these. A properly configured firewall that supports NAT provides reasonable
    security while presenting the look and feel of being directly connected to the
    Internet.


    # Further Reading


    +   * RFCs

    * Networking with TCP: IP, v1, 3rd ed., Douglas E. Comer, 1993

