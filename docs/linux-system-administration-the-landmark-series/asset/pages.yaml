  md: '![](img/ffdfa0821b4a8f1b49759a4b4d78044a_370_0.png)


    M Carling consults at the intersection of system administration and investment
    banking, having merged system projects for large banks in New York, London, Tokyo,
    Toronto, and Zurich. He runs Linux on Intel, Macintosh, and SPARC hardware.


    ![](img/ffdfa0821b4a8f1b49759a4b4d78044a_370_1.png)


    Stephen Degler has been administering UNIX systems for major financial firms for
    the past eight years. He currently manages system administration for the FAST
    (Financial Analytics and Structured Transactions) group at Bear Stearns. He runs
    Linux on Alpha, Intel, and SPARC hardware.


    ![](img/ffdfa0821b4a8f1b49759a4b4d78044a_370_2.png)


    Jim Dennis holds the position of Senior Researcher at Linux. He writes the “Answer
    Guy” column for the Linux Gazette, and he has performed system administration
    for Fortune 100 Corporations. He runs Linux on Alpha, Intel, and Macintosh hardware.


    # Here’s what reviewers are telling us about Linux® System Administration:


    “This book is a reference for experienced Linux administrators and a guide for
    new ones. It distills the authors’ extensive rubber-meets-the-road experience
    with real-world challenges into a system administration handbook that covers the
    range from home users to large enterprises.


    Eric S. Raymond'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Linux System Administration


    System administration is both a computer science and a computer art. That is why
    M Carling, Stephen Degler, and Jim Dennis have written a book that supplies copious
    technical detail and investigates the philosophy behind administering an environment
    of Linux and other systems.


    With deep appreciation of the value of Open Source software, and acute insight
    into the requirements of networked systems, the authors help you design, install,
    and manage IT environments. You will learn techniques to develop effective security
    and data recovery strategies. You will find expansive coverage of scripting tools
    and the reasons for using them, as well as a discussion of how to choose the right
    commands for the job.


    In writing this book, the authors drew from dozens of years of experience in developing
    and managing some of the world’s largest and most complex networked systems to
    illustrate how to craft an environment that evolves along with the system software.


    If you administer a Linux network, this book offers solid expertise to help you:


    +   Learn the most effective means to administer your network


    +   Comprehend security theory and how to enforce it


    +   Design your environment with expansion in mind


    +   Ensure reliability by automating operations


    +   Transition to IPv6


    +   Maintain consistency over hundreds of NIS domains.


    +   Configure and compile Linux kernels


    +   Learn the theory and practice of disk partitioning


    +   Prepare for recovery from any sort of disaster


    Operating Systems/Linux $29.99 USA / $44.95 CAN / £21.99 Net UK


    ![](img/ffdfa0821b4a8f1b49759a4b4d78044a_371_0.png)'
  merge: -1
