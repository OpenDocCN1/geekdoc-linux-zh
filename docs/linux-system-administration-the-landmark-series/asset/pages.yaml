  md: '# Exposed Systems


    We define exposed systems as those that are exposed directly to the Internet or
    reside in the DMZ of the firewall. The DMZ (or Red Net) of a firewall is the network
    segment on which the external interface of the firewall resides; it is normally
    connected to an Internet service provider via a filtering router.


    Systems deployed in this environment should be configured with the minimum functionality
    needed to perform their tasks. NIS and NFS should not be used in this environment,
    and the RPC portmapper should be disabled. Entries in the inetd.conf file should
    be trimmed to a bare minimum. Only a minimum number of user-level accounts should
    be in the passwd file. The passwd entries themselves should be tested periodically
    with crack or some other password checking utility. If the system is based on
    a distribution that uses a package manager, periodically verifies the packages
    to check the integrity of the system. Also, the syslog service should forward
    events to a host in the inside, as well as retain logs locally. This makes it
    more difficult for an intruder to erase evidence of presence. Finally, full backups
    of the system data must be available along with an image on the build server (see
    Chapter 15. “Automated Installation and Upgrade”) so that the system may be rebuilt
    rapidly from scratch if compromised.


    # Exploits and Consequences


    To enforce security effectively, a system administrator needs some familiarity
    with the exploits of crackers and the consequences of those exploits. An effective
    strategy can be developed to enforce the organization’s security policies. Studying
    the history of computer security exploits helps to put everything in perspective.


    # User Exploits


    Anyone who gains access to the system at the user level may steal any data readable
    by the user. Any files writable by that user id should be considered compromised.
    Most experienced intruders will not do much with a user-level account, because
    it is not possible to cover one’s tracks. Instead, he will leverage the user-level
    access in an effort to gain root access.


    > 3 Sec http://www.rootshell.com and http://www.insecure.org for examples of current
    exploits.'
