  md: "Chapter 3 Recovery Planning\n\n# Other Disasters\n\nMany organizations will\
    \ face other kinds of disasters not listed here. Thinking about the possibilities\
    \ and asking users and management will go a long way toward making the list complete.\
    \ Of course, if some unforeseen disaster does strike, it should be added to the\
