- img_proc: true
  md: '# Without Rebooting


    If a rootshell prompt remains open on one of the virtual consoles, use it to force
    a password change with the passwd command. For this purpose, a privileged under
    sudo to run a shell or the passwd command as root would surface. (See Chapter
    8. "Enforcing Security," for more about.)


    Since ssh does not use /etc/passwd to authenticate when a public key is present,
    the host with the private key could allow access to the system. This assumes that
    the passphrase to the companion ssh key has not been lost. (If the problem is
    a manifestation of firing the system administrator, then change all the keys.)


    # Rebooting Without Root Account Access


    Without this means of accessing the root account, it will be necessary to reboot
    the system into single-user mode, where the account can be repaired. Obviously,
    this will cause a service interruption, so follow your policy for notifying users.


    Systems occasionally have a dedicated account to properly shut down a system,
    with a password of its own. If this password is known, or a user with sudo privileges
    is allowed to shut down the machine, then the system should be rebooted accordingly.


    To reboot safely from the system console, press CTRL+ALT+DELETE. If the X WINDOW
    is active, it may be necessary to kill the X display server using CTRL+ALT+BACKSPACE
    first. Most LINUX systems are configured with a ctrlalt entry in /etc/initab.
    This is ordinarily to trigger a safe shutdown. (This can usually be checked by
    verifying the initab file is "normal readable").


    It is possible to compile a kernel with support for the Magic SysRq features to
    enable a forced sync, a mount, or a reboot. Although this configuration is not
    the default, the feature should be included in the 2.2 and later kernels in most
    servers and workstations. These features are documented in the /usr/src/linux/Documentation/sysrq.txt
    file (although, with all things, this might change in future kernel sources).


    The following is suitable for use with a typical PC and kernel:


    +   1. ALT+SysRq+S attempt to sync all mounted filesystems

    2. ALT+SysRq+U unmount and remount in read-only mode

    3. ALT+SysRq+B reboot


    If the system will not reboot using any of these "gentler" methods, then attempt
    to minimize the potential damage to the filesystems that can be caused by a hard
    reset. We recommend waiting until hours before resorting to this. Because this
    method will not dismount the files cleanly, it will also enable an fck session
    when the system comes back up. On a server with lots of disk space, this fck may
    take hours.


    Disable as many processes as possible to reduce the system''s need to access the
    disk. Try to sync the filesystems (Normal user accounts can usually do this. There
    might be a sync pseudo-user account in the passwd file with no password.) Then
    press the button.'
