    # Plan Recovery Strategies


    Now, equipped with a prioritized list of the disasters for which preparations
    are to be

    made, and a budget for doing so, the strategies must be planned, for both prevention

    recovery. The prevention strategies should be defined first, and then the recovery

    strategies.


    Prevention strategies will include the following:


    +   - Defining security policies

    - Enforcing the security policies

    - Keeping hardware spares on hand

    - Putting in place redundant networks, power sources, and servers

    - Keeping client machines free of data


    Recovery strategies will include the following:


    +   - Defining standard configurations for clients and various types of servers

    - Preparing one or more kickstart servers capable of building any standard

    configuration

    - Preparing one or more packages that install all nonresident files for any peculiar

    servers that must deviate from the standards

    - Documenting the procedures for recovering from the various types of disaster
    that

    may occur


    The strategies listed here are likely to meet the needs of organizations. However,

    sites may employ additional strategies. There are many possible strategies, most
    of

    which will not work. A particular strategy may seem sensible, but until it has
    been tested,

    it should not be relied upon.


    # Testing the Recovery Plans


    Obviously most recovery plans depend on the data being available *where*. In many

    the easiest way to ensure this is to perform regular backups and regularly transport

    some of those to an off-site storage location—perhaps an underground vault in
    another

    state.


    Focusing on “recovery” rather than “backups” makes another factor more obvious.

    it should raise questions like these:


    +   - Do we have an inventory of spare parts?

    - How long will it take to get necessary replacement equipment?

    - Do we reserve capital in place for this?'
