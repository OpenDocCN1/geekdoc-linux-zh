  md: '# Chapter 17 Network Services


    and applications. The delivery of these services to all systems within an organization
    lays the groundwork for the higher level services. Reliable delivery of these
    services makes the network computing environment stable and predictable.


    # DNS


    The Domain Name Service (DNS) provides translations of hostnames to IP addresses.
    It also provides reverse translations of IP addresses to hostnames. The Domain
    Name Service came into being when users of the (then) Arpanet realized they could
    no longer maintain host information in a single file that had to be copied to
    every machine on the Arpanet time was changed, or deleted. DNS delegates hostname
    management to the system administrators responsible for the systems. DNS has scaled
    with the rapid growth of the Internet.


    The hierarchical structure of DNS comprises hosts at the leaves and domains at
    the branches. A hostname presented with its domain is known as a Fully Qualified
    Domain Name (FQDN). The hostname is written to the left and the branches of the
    domain are separated by periods. For example, the name sun.edu refers to a host
    within the unc domain, which is part of the edu top-level domain. At the root
    of the DNS hierarchy, a NS (Name Server) record points to the edu domain. Within
    the edu domain, another set of NS records points to the unc domain. The unc domain
    contains the host name. A name server that carries this recursive search will
    normally cache all of the data it learns along the way. Subsequent queries will
    need to access any other server. All cached data has a lifetime associated with
    it and will expire after that period.


    The root name servers are preloaded onto every server. These systems are essential
    to processing queries and cannot be learned dynamically. The root servers are
    comparatively static, but current data is always available


    ```

    ftp://internic.net/domain/root.zone.gz

    ```


    DNS is one of the fundamental services that a system administrator must set up
    within any organization. DNS services are implemented by configuring and running
    named, the name server. The named daemon is distributed by BIND (Berkeley Internet
    Name Daemon). The BIND distribution contains the name server as well as the client
    side software, as the resolver. BIND is available from the Internet Software Consortium
    (ISC).


    BIND uses ASCII to implement the name database. These are split into a number
    of zone files. BIND defines a zone as a domain and any subdomains that are administered
    by the same server. One of the quirks of DNS is that the reverse translations
    appear in different zone files than the forward translations. This means that
    a system administrator must edit two files to change any hostname. Many system
    administrators


    +   1. ftp://ftp.internic.org/'
