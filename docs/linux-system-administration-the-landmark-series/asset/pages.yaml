    # Partition Tables and Bootloader Code


    Under Linux it''s easy to ensure recovery from corrupted partition tables and
    damage to a system''s master boot record (MBR). The MBR is the first sector on
    the first track under the first head on any PC hard drive. It consists of two
    parts: some bootloader code and the partition table.


    The bootloader code is supplied by any OS on the system. Most Linux use LILO (the
    Linux Loader) installed on the MBR of the primary hard disk. Some others use GRUB
    (the GNU GRand Unified Bootloader). In other cases, one might use System Commander
    or the Windows NT or OS/2 Boot Manager on the MBR and run LILO in the logical
    boot record (or superblock of your root filesystem—or any of the Linux filesystems,
    for matter).


    There are a number of common situations where the bootloader code may get replaced
    or damaged without affecting the partition tables, the fact that both share the
    same sector. Most boot sector viruses and the installation software for many operating
    systems replace the boot code located in the MBR with their own version—typically
    moving the existing bootloader into another "unused" sector on track zero


    So, there is a common need to restore the bootloader code when it has been overwritten.
    The easy way is to simply run /sbin/lilo1. This will read the /etc/l110.conf file
    (by default) and build a new boot record as specified therein. It will append
    the existing partition table to the bootloader and merge in the BIOS disk address
    of LILO''s map files. These maps enable the LILO bootloader to find kernels, boot
    messages, and other files without needing "knowledge" of the filesystems on they
    are stored.


    So, to restore the bootloader code after it''s been replaced by, for example,
    the latest reinstallation of Windows NT, just run /sbin/lilo with no arguments
    (assuming a proper /etc/l110.conf file).


