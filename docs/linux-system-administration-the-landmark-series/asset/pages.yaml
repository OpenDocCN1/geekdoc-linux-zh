    # 3


    # Recovery Planning


    MAINTAIN ACCESS TO SYSTEM RESOURCES: With that as part of our Prime Directive,
    it logically follows that we must prevent disasters to the extent possible, and
    be able to recover from many others as are unavoidable (or unavoid-ed, as the
    case may be). Every responsible professional and publication advises users and
    administrators of computer systems to do backups. On the surface, this seems simple
    enough—a backup is basically a copy of a data that promises a way to recover from
    loss or damage.


    However, backups are only a tiny portion of the problem; in fact, the focus must
    be on recovery. The recovery scenarios you plan will dictate how your backups
    must be done—and a lack of planning and testing may mean that any erroneous decisions
    made during the creation of backups will not be understood until it''s too late.


    Moreover, data recovery is only a facet in a broader process of disaster recovery
    planning, risk assessment, and operational analysis. Here are some questions to
    ask:


    +   - What is the total volume of it that changes over various intervals (per
    day, per week, per month)?

    - Are there any availability considerations that limit when and how long your
    systems can access the data for backup and restoration?'
