  md: '# Adding Users


    The command normally used for adding a UNIX user is useradd. Because the useradd
    command does not create NIS entries, the logical host on to run it is the NFS
    server that will host the user''s home directory. This will create a home directory
    for the user, based on the template home directory that the system administrators
    have set up in the /etc/skel directory. It will also create /etc/passwd, /etc/shadow,
    and possibly, /etc/group entries that may, on the NIS master, be added to NIS.


    We recommend reusing users for at least one year and reusing users unless they
    reach their numeric limit, at which time assignment should start again from the
    bottom of the range. Avoiding reuse precludes a host of problems that may arise
    in case a user''s files need to be restored, or if their vestiges remain. Thus,
    we suggest assigning the next uid that is higher than that of all other users,
    until the upper limit is reached. The number is presently limited to 216 by the
    kernel; however, gl permits 232. Most sites will never need to reuse users unless
    constrained to 216.


    Whatever is added to new users, it must be documented, and to the extent, automated.
    The same is true of modifying user account information, disabling users, and deleting
    users. All system administrators within an organization should be able to easily
    find the correct procedure on an intranet site.


    # Updating Users


    The standard command for updating users is usermod. It accepts a variety of options.
    Generally, each option corresponds to a particular attribute of the user''s account.
    For example, the command


    ```

    usermod -G techpubs,marcomm jjones

    ```


    would make the user jjones a member of the techpubs and marcomm groups. jjones
    would no longer be a member of any groups of which he may previously have been
    a member. The groups must exist.


    # Deleting Users


    Deleting a user is rather simple, and nearly as easy. All one needs to do is this:


    +   * Remove or redirect all the user''s mail aliases.

    * Back up and then remove the user''s home directory and all its contents.

    * Remove all other files and directories owned by the user. The find command will
    be useful for this.

    * Remove the user''s entries from /etc/passwd, /etc/shadow, NIS, and so on. The
    userdel command will remove these entries from local flat files. NIS attributes
    must be removed from the NIS master. See Chapter 21, "Managing NIS," for more
    details.'
  merge: -1
