  md: '+   They provide a data source for disaster recovery. The backup system must
    play a role in any comprehensive recovery planning. In a large-scale disaster,
    data will be retrieved from tape archived at an off-site storage facility. The
    backup system itself must be in place and working at a disaster recovery site.


    Some of the terms used in relation to backup and restore planning are confusing
    and are often used inconsistently. The terms archive, backup, data set, differential,
    full, incremental, level zero, and media set are defined in the Glossary.


    It''s possible to build a backup plan out of just full (level zero) backups or
    combinations of full with incrementals or differentials. It is even possible to
    build a complex plan involving all three. For example, one might do a level zero
    backup followed by a series of differentials (cycling among several media sets).


    # Assumptions


    The assumptions one makes about backups and the implications gathered from them
    are primarily based on previous experience. However, risk assessment and disaster
    planning should not be based only on first-hand experience. System administrators
    generally hope to avoid experience with most types of disasters. Therefore, we
    recommend a more comprehensive look at a site''s needs as part of the process
    of developing a restore strategy. This process is discussed in detail in Chapter
    3, "Recovery Planning."


    It is worth noting that these same issues are involved in developing security
    policies and procedures. This is handy because there are many security/integrity
    concerns that should be addressed concurrently with recovery strategy. For example,
    discarding old tapes may inadvertently release confidential data, even if the
    tapes have erased—or corrupted data be backed up and result in the restoration
    of bad data.


    # Requirements and Policies


    When designing a backup system, the first task is to obtain an accurate set of
    requirements. The second task is to reconcile these requirements against the available
    budget for a backup system. This may require several design iterations because
    some individuals—particularly those in management—have unrealistic expectations.
    The initial design phase is complete, all interested parties should be aware of
    the costs and capabilities of the system and should use these to establish policies.


    # Estimating Costs


    Key factors that determine the cost of a backup system are the amount of data
    that must be backed up and the time available to do it. The higher the quantity
    of data per hour, the more expensive the backup solution will be. Environments
    that have narrow maintenance windows or that require 24x7 operation must consider
    the backup solution as part of the design of the systems and applications to ensure
    that the backups represent a valid'
