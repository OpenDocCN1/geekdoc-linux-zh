  md: '![](img/ffdfa0821b4a8f1b49759a4b4d78044a_276_0.png)


    # # A Emergencies


    THIS APPENDIX LISTS SOME OF THE MORE COMMON EMERGENCIES that beset system administrators.
    Most of these are situations that should be considered in recovery planning. Practice
    recovering from these situations as part of normal training and recovery plan
    drills.


    For each situation we describe the problem, and one or more solutions, a few brief
    pointers on prevention, and some references to other parts of this book that go
    into detail.


    # ## Lost Root Password


    This is one of the most common, and most easily remedied, problems under most
    forms of Unix. It''s a FAQ for the comp.unix.admin newsgroup, and it appears there
    about every week or two. Variations include the following:


    +   - My /etc/passwd file is corrupt . . .

    - I was editing /etc/passwd when the lights went out . . .

    - We fired the system administrator and he left without . . .


    There are many ways to recover from this under LINIX.'
  merge: -1
