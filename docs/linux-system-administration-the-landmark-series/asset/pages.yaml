  md: 'Even after identifying the group whose requirements are to be primary, it will
    usually be necessary to consider the requirements of various secondary and tertiary
    groups. For example, in investment banking the needs of the traders are paramount,
    but the needs of bureaucrats and others must also be satisfied.


    # Define Metrics for Success


    Having selected the persons whose requirements are to be met, the next step is
    to determine exactly what constitutes success in meeting them. In other words,
    a set of metrics must be found by which one may readily determine the extent to
    which efforts have been successful. For example, if the requirement is for fewer
    workstation crashes, the metric could be mean time between failure or number of
    crashes per unit of time.


    # Ask Open Questions


    It will often be necessary to survey the persons whose requirements are to be
    met—both in order to understand the real requirements and in order to define metrics
    for determining success. While many questions will be specific, even having "yes"
    or "no" answers, some questions should be open-ended, such as "What are your concerns?"What
    could we do to help you be more productive?"What about our operation causes you
    the most grief?


    # Write the Specification


    Each specification should be formalized in writing. This will ensure that everyone
    has agreed to the same thing. Unless the specification is for a particularly important
    project, it should probably be written by a mid-level system administrator, with
    guidance from senior administrators or a manager if necessary.


    Once a draft has been written, and the system administrators who may be involved
    with the project are satisfied with it, it must be submitted along with cost estimates
    to the users for approval.


    # Implicit Requirements


    Now that we''ve covered the process of determining your site''s specific requirements,
    we can make the observation that all sites will have some requirements in common.
    There are issues that every system administrator will almost certainly have to
    consider. These are the implicit requirements of the job.


