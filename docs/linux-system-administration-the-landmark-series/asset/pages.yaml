- img_proc: true
  md: '# Alternatives


    This centralized installation approach should be compared to manual installs and
    disk "cloning" techniques. The advantage of the centralized install server is
    that the configuration is tightly controlled by those who administer the install
    server. Manual interactive installs are subject to system administrator error
    and variation because men tend to follow written procedures unreliably, even processes
    that are described flawlessly.


    Disk cloning is subject to errors. The common problems associated with disk cloning
    involve using the wrong disk as a template. These problems are endemic finding
    and updating all the disks used for cloning every time a system profile is changed
    is unlikely to be simple or easy. Often, the disk used is an outdated clone disk,
    reintroducing a problem that was previously corrected. In other cases, the disk
    will be up-to-date, but for the wrong system profile. Sometimes, disks are cloned
    from production disks and may include configuration information that is inappropriate
    for the new system. The centralized install server solves these problems.


    # Hardware Issues


    Prior to the development of LINUX and other free UNIX operating systems, large-scale
    installations were restricted to RISC workstations running UNIX. These workstations
    were (and are) more standardized in configuration and limited in peripheral options
    than today''s PC. This simplified the job of automated installation, because it
    was straightforward to build a single system profile with the appropriate kernel
    and device support for the entire workstation community. This is still the case
    for LINUX on workstation hardware, but sites that run LINUX on PCs will suffer
    from the complexity that follows from much more diverse hardware.


    Another complication presented by PC hardware is imposed by the PC BIOS. While
    the ability to boot from SCSI and ATAPI CD-ROMs is now common, support for network
    booting is still lacking. This requires that the installation be supported by
    a local floppy or CD-ROM—which means a mandatory visit to the desktop. While desktop
    visits are common in Microsoft Windows support, they are far less common in large
    LINUX environments. This is due to the greater ability to remotely administer
    LINUX systems through the network and to the higher ratio of desktop computers
    per system


    The hardware configuration issues that very most are hard disk size, video cards,
    monitors, network adapters, and audio hardware. Physical memory also varies; however,
    this is a performance issue rather than a configuration issue.


    The challenge, then, is to exploit the generality that does exist and dynamically
    adapt to the inevitable variations in hardware. Organizations having a purchasing
    policy that restricts desktop systems to comply with a standard will do best;
    those that have changed vendors several times or deferring decisions to the users
    will encounter the most problems. It should be noted that even the largest PC
    vendors tend to change'
