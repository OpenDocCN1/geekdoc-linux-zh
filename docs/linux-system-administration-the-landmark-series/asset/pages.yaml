  md: 'deploying two NIS slave servers on every subnet, the clients will be able to
    rebind in

    event that one server becomes unavailable.


    It is common practice to modify the initialization scripts for each NIS slave
    to ensure

    t it will bind itself. This can be done by specifying localhost as the server
    for

    domain in /etc/yp.conf. Also, the order of ypserv and ybind must be altered

    such that the server starts first. This is done to avoid problems that can occur
    when both

    servers on a subnet are rebooted.


    # Debugging Techniques and Analysis Tools


    By far, the most common problem with NIS occurs when slave servers become

    unavailable, and the clients that bind cannot find another server to

    they can bind. Once that problem is remedied, as described, NIS failures occur
    much

    frequently. Nevertheless, problems can still arise.


    If NIS maps push not to update all hosts, there may be a rogue slave server

    running in the domain. A rogue is a system that is running ypserv but is not listed

    in the ypserv map. To find the rogue, log onto a machine where the data are not

    current and issue the ywhich command. Check the hostname against the NIS slave
    to

    which the host is bound. Check the yservers map.


    Another problem that can occur on NIS slaves is map corruption. This occurs much

    as a result of disk-full conditions. Similar to the process described, identify
    the

    offending slave by binding to an affluent client and issuing the ywhich command.
    If

    tmaps are corrupt due to lack of disk space, the space must be freed and the maps

    transferred with ypxf.


    Finally, nothing prevents incorrect and incomplete data from being propagated
    via

    NIS. It is possible, for instance, to push out an empty map. This is especially
    exciting in

    the case of hosts map. The system administrator can use ypcat -k to list entries
    with

    the keys. The practice of using rec to maintain previous versions of the NIS source
    file

    is valuable in this situation. It makes the difference between restoring service
    in a few

    minutes versus the hour or so that it may take to find the most recent backup
    tape from

    to restore the file.


    # NIS Alternatives


    NIS is the most common distributed system for managing system information,

    and the only one currently available for LINUX. Here we note two possible alternatives:

    Netinfo and NIS+


    In March 1999, Apple Computer released Netinfo under an Open Source license,

    Apple acquired Netinfo when it purchased NeXT. Netinfo was developed by NeXT

    in 1988 as an improvement over Sun''s NIS. At the time of this writing, the Linux

    community had not yet adopted Netinfo, but it provides a viable alternative to
    NIS.'
