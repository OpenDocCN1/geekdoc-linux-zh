  md: '# Installing the Kernel


    Organizations that employ a kernel developer may be tempted to make him responsible
    for compiling kernels that are to be used in production. This would be unwise.
    Developers do not normally have the mindset of extreme caution needed for the
    task. A system administrator should compile kernels and ask the in-house kernel
    developer questions if technical difficulties arise that are not explained in
    the documentation.


    # Installing the Kernel


    There is, of course, some quality assurance work to be done before installing
    a newly compiled kernel on a production machine, and even before installing on
    a thousand or ten thousand machines. The instructions for installing a kernel
    that appear in the documentation are appropriate for installing a kernel on one
    or a few machines. For testing the new kernel, this might suffice.


    Some caveats should be kept in mind whenever a new kernel is installed. It is
    critical to run /sbin/l11o after any new kernel is added and before the machine
    is rebooted. It is also important to ensure that the System.map file to which
    /etc/l11o.conf points matches the kernel version. If multiple kernel version are
    located in /boot, corresponding System.map files (with distinct names) should
    also be there with /etc/l11o.conf reflecting the correspondence.


    However, since the kernel should be packaged for mass installation anyway, it
    would be propitious to do so from the beginning. This approach has the advantage
    of testing the package as well as its contents—the kernel. Deploying a perfect
    kernel in a flawed package can be as disastrous as deploying a flawed kernel.


    Once the new kernel has been packaged, installation is simply a matter of installing
    a package. This should be done first on a test machine. When all appears to be
    well with the test machine, the new kernel package should be installed in a staging
    environment. Finally, when correct functionality has been verified in the staging
    environment, the new kernel can be deployed to production. We provide suggestions
    on how to deploy new software in Chapter 15, “Automated Installation and Upgrade."'
