  md: 'Application-Level Services 203


    # # NIS


    Network Information Service (NIS) provides to all systems within a NIS domain
    unified system data regarding users, groups, mail aliases, and other system information.
    See Chapter 21, “Managing NIS.” for details on NIS.


    # # LDAP


    The Lightweight Directory Access Protocol (LDAP) was designed to provide services
    similar to DNS and NIS. LDAP overcomes the limitations of both services, permitting
    richer data than is available from DNS, and having a hierarchical structure, unlike
    NIS. Years ago, developers of MIT’s Athena project used DNS to create a service
    known as hesiod. hesiod used TXT records to manage user and group data. Unfortunately,
    hesiod in larger organizations persists. LDAP should be able to fulfill a similar
    role, but progress has been slow: Support for LDAP as a naming service has not
    been integrated into libc, so use of LDAP is restricted to programs which explicitly
    communicate with it. Many programs do, so LDAP currently exists in a dormant state,
    waiting for the Internet community to decide which directory service to use and
    with which data to populate it.


    # # Application-Level Services


    A range of network services directly support user-level clients. These are distinct
    from the system-level services described previously in that the former over the
    latter. Application-level services include mail, news, printing, FTP, http, remote
    shells, and file services such as NFS and Samba. Because mail, printing, and NFS
    are covered in their own, this section focuses on the other application-level
    services.


    # # Samba


    Samba provides file and print services to Microsoft Windows clients. Deploying
    Samba allows the system administrator to employ Linux servers as an organization’s
    primary file and print servers. This obviates the stability problems inherent
    in attempting to use Windows NT servers. Samba is also able to provide NT domain
    services, further lessening the need for Windows NT systems and thus improving
    the reliability of the computing environment.


    Samba is configured via the smb.conf file. We defer to the Samba documentation,
    which accompanies the software.³3


    3. http://www.samba.org/'
