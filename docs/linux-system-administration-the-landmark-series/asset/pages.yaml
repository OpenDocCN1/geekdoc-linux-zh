    computing, in the same way object-oriented and component-based programming methodologies
    contribute to application architectures.


    # Architectural Objectives


    The obvious requirement for a systems architecture is to build an infrastructure
    that provides desktop computers with a standard set of services. This accomplishment
    alone is deserving of merit. Unfortunately, it is not sufficient. The method of
    service delivery itself is a key feature of network computing. Several key requirements
    distinguish an architecture:


    +   - It must be reliable.

    - It must be maintainable.

    - It must be scalable.


    Meeting these requirements is a lofty goal. Due to the limitations of system technologies,
    there are no perfect solutions. The following list is a series of guidelines that
    help achieve these goals:


    +   - All desktop computers are generic, have the same software installed, and
    store no data.

    - All servers conform to a well-defined system profile, as detailed in Chapter
    14, "System Profiles."

    - Servers use RAID to attain higher availability.

    - Network hardware is deployed in a redundant fashion.

    - Software is distributed in a controlled fashion. If an organization has multiple
    locations, all sites should contain the same suite of applications.

    - Every desktop computer sees an identical file hierarchy.

    - Each user account appears ideally on every system within a department. Typically,
    user home directories are available to every system via the automounter or Samba.


    Larger organizations with multiple departments should utilize a number of senior
    system administrators to collaborate on the systems architecture for the entire
    organization. If standardization exists among departments, system administrators
    responsible for one group can administer systems in another department when the
    needs arise. Also, custom applications developed by one department are easy to
    integrate into another.


    Standardized solutions save an organization real money. Nothing scales better
    than a solution that can be replicated arbitrarily. Even if the initial investment
    in time seems large, the recurring cost savings in deploying a well-architected
    environment will quickly outweigh the initial expense of design and documentation.
    Additionally, a growing'
  merge: -1
