  md: '# Glossary


    The SUID and SGID bits are ignored on non-executable files and on "scripts" (text
    programs in sh syntax or starting with a shebang #! line). This latter addresses
    historical security implications (race conditions) of such scripts.


    SGID directories in LINUX ignore new files created to have a group assignment
    matching that of the directory, regardless of the GID and supplemental group membership
    of the user/process that creates such files. The SUID setting for directory can
    also be assigned using the mount command''s -o bsgroups option on filesystems
    that support it.


    The sticky setting on files is ignored under LINUX. Historically, it marked certain
    exclusives for preferential caching. however, sticky directories modify the semantics
    of write access to that directory. In a sticky directory, only the file''s owner
    (and root, of course) can unlink (remove) file links.


    pid Process identifier. A number used by the kernel to keep track of the system-level
    resources necessary to switch between this process and others running on the system.
    It is easily visible to a system administrator by the ps command.


    POST Power On Self Test. When PC-compatible hardware is turned on, a set of minimal
    programs in BIOS tests to verify that it has the minimum functions necessary to
    launch the boot loader. Failure of the tests that precede video access results
    error messages in a pattern of beeps.


    PRAM Parameter RAM. This is what Macintosh users usually call the CMOS or chip
    and its contents. See also nvram, firmware.


    process An instance of a running process. init is the first process and is the
    ancestor of all others.


    protected mode On Intel microprocessors in the 8086 (x86) family, a mode of the
    8028 or higher processor that has special memory addressing and protection features,
    allowing it to address much more memory than was previously possible. The first
    Linux kernel took special advantage of the protected mode features found in the
    80386. Although its code has been revised and made portable to many architectures,
    LINUX is not compatible with the 80286, whose implementation of protected mode
    is rather unusual.


    real mode On Intel microprocessors in the 8086 (x86) family, a mode of a processor
    that is backward-compatible with the original 8088/8086 memory addressing model.
    This term was introduced to distinguish that from protected mode.


    recursion See recursion. When you get tired of following the references there,
    return to whatever you were doing before.'
