  md: '1pd is normally started at boot time by an rc script. The rc script should
    verify that

    1pd is loadable, kill any stale lock files, and start the daemon.


    The first thing 1pd does read the printcap file. Then 1pd checks the queues by

    examining the spool directories for waiting print jobs. Once started, 1pd listens
    for TCP

    connections from instances of 1pd running on other hosts. Before accepting a print
    job

    from a remote host, 1pd weakly authenticates that host by checking for an entry
    in the

    /etc/hosts.equiv or the /etc/hosts.1pd file.


    # The printcap file


    The printcap file, which is normally found in the /etc directory, provides a layer

    of abstractions. Each entry in printcap defines a virtual printer that may

    be connected locally or across the network. Multiple virtual printers with different

    characteristics can be created by defining multiple entries with different options
    in the

    printcap file for the same physical printer.


    The local 1pd daemon accepts jobs locally for any printer with a correct printcap

    entry.


    The printcap file deliberately follows a format similar to that of termcap. Designed

    for fast handling by primitive software, each entry is one line, and fields are
    separated

    by colons (: The first field is a list of one or more names by which the printer
    may

    be selected. To accommodate long entries, lines may be continued by placing a

    backslash () at the end of any line. This form of line continuation is

    common in Unix shells and many other Unix contexts, such as configuration files.

    (Caveat: Trailing whitespaces after the backslash usually do not work.) The following

    lines must begin with a tab and typically begin with another colon as well, which
    is not

    common in Unix shells.


    Unneeded fields may be omitted. A minimally useful printcap entry for a locally

    connected printer is


    ```

    generic:1pd=/dev/1pd0:sd=/var/spool/1pd0:sh:

    ```


    Using the line continuation feature for clarity, the entry is:


    ```

    generic:

    :1pd=/dev/1pd0:\nsd=/var/spool/1pd0:\

    sh:

    ```


    These functionally equivalent entries define a print queue that can be addressed

    ether 1pd or generic. Print jobs to this queue will be temporarily held as a file
    in

    the directory /var/spool/1pd0, until 1pd has verified the data at /dev/1pd0 (the
    first

    parallel port on a typical PC) has accepted all of it.


    As noted above, the first field is a list of one or more names by which the virtual

    printer can be addressed. All other fields take one of three formats: string,
    numeric, or

    Boolean. String fields take an option after the equal sign (=). Numeric fields
    take an'
