    # IPv4 Address Architecture


    IPv4 addresses are 32-bit values, typically expressed as decimal numbers from
    0 to 255, separated by periods (for example, 127.0.0.1). IPv4 addresses are segregated
    into classes. Within each class, addresses have two distinct parts, the network
    address and the host address. The classes are outlined in Table 13.1.


    At the time of IPv4''s inception, it was completely unclear what network technologies
    would exist in large networks. Consequently, the original class assignments did
    not match the networking topologies. The solution developed was called subnetting,
    which allowed an organization to choose an arbitrary boundary between the host
    and network components of addresses within a particular network. A subnet is expressed
    as a subnet mask and is usually written in a dotted quad address format. The zeroes
    indicate the host portion. Therefore, if Class A network 10 was subnetted with
