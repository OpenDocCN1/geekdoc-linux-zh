  md: 'The defense is to filter at the external gateway all packets addressed to either
    the broadcast address of the network or the broadcast address of any subnet. Using
    iptchains, the command


    ```

    iptchains -A input -d xxx.xxx.xxx.xxx -j DENY

    will drop any packets with xxx.xxx.xxx.xxx in the destination field.

    ```


    Because there is never a friendly reason to send packets addressed to another
    network''s broadcast address, any packets received at the gateway should be presumed
    hostile. Use DENY rather than REJECT to avoid sending ICMP host unreachable messages
    back to the alleged source of these hostile packets.


    # Breach Procedures


    When an intrusion has been detected, tread softly until a decision has been made
    as to whether or not evidence will be gathered. If it will, take the affected
    systems offline and prepare clean spares into production.


    Next, assess the nature of the exploit and the damage caused. In cases of user-level
    exploits, finding and closing the hole, changing the password, and restoring any
    lost or corrupted data may suffice. In cases of root-level exploits, a complete
    reinstallation is the only way to ensure that the system has no backdoors. Of
    course, after a reinstallation, the original security hole will still exist. It
    must be found and closed.


    Unless it is a home system, never discount the possibility that the breach could
    have been committed or facilitated by an insider. Investigate logs on seemingly
    unaffected machines because they may hold clues, as well as possible backdoors.


    After service has been restored, initiate a review of the security policies and
    procedures. If in-house expertise is lacking, consider retaining a qualified consultant.
    Ask whether a different policy or more rigorous enforcement would have prevented
    the breach without impeding business operations. Update the security policy if
    necessary.


    # Current Information


    Current information on security tools and exploits may be found at the following
    sites:


    +   - http://www.SecurityFocus.com/

    - ftp://coast.cs.purdue.edu/pub/tools/unix'
