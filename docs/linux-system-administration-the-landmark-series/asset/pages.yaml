  md: '# Password Aging


    The aging of passwords is enabled by the shadow suite. The shadow file or map
    contains entries that specify when each password or passphrase will expire and
    how much notice to give each user. Failure to change a password will result in
    the automatic disabling of the account a specified number of days after expiration.


    The command used to change user password expiration information is chage. Several
    command-line options are available. If none are specified, chage prompts the user
    interactively.


    # Quotas


    It is often necessary to enforce disk space quotas to ensure that one or few users
    do not fill a disk partition. Quotas are also useful to ensure that users consume
    only the disk capacity for their departments are willing to pay.


    It is possible (and recommended) to set two limits for each user. Upon hitting
    the lower limit, the user is warned. Upon reaching the higher limit, the user
    may no longer write to disk space until space has been freed or the limit is raised.
    It is also possible to allow the temporary use of space.


    Quotas are set by editing the /quota.user file. Quotas may also be set for groups
    of users by means of /quota.group.


    # Mail


    All the mail for each user should be delivered to one place. This location must
    be specified (explicitly or implicitly) each time a user is added.


    Each user should have an entry in the aliases file or NIS map. It is essential
    to ensure that these entries are unique in the organization. In other words, there
    should never be conflicting entries in aliases files or maps used by different
    domains or departments.


    In small organizations, we recommend setting each alias to


    ```

    user@mailhost

    ```


    Then mailhost should be set as an alias in /etc/hosts or the hosts map. There
    should not be a machine whose true mailhost is mailhost.


    In organizations large enough to require separate mailhosts serving each department,
    we recommend setting each alias to


    ```

    user@mailhost.subdomain.domain

    ```


    where subdomain corresponds to the NIS domain, the DNS subdomain, and to the functional
    department; and where domain corresponds to the DNS domain for the organization.
    In this scheme, the mailhost alias must be set correctly in each NIS domain''s
    hosts map and in each corresponding DNS subdomain.'
  merge: -1
