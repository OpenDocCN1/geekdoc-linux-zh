    DNS can arrange to have a public server encrypt the data using a private key.


    NTP defines 16 levels (called strata) to describe the distance is from a high-quality
    time source. NTP servers are configured to form a network or tree of time servers,
    with the top being the time servers with the lowest stratum (closest to the time
