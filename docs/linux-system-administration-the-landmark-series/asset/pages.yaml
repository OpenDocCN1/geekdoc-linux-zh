  md: '# Table 19.1 lpc commands


    | command | description |

    |---|---|n| abort | Kills the active spooling daemon and disables printing on
    the specified printer(s). |

    | stop | Kills the spooling daemon after the current job completes; then disables
    printing on the specified printer(s). |

    | clean | Removes any files that are not part of a complete job from a queue (or
    all of them). |

    | disable | Prevents new printer jobs from being entered into a given queue disables.
    Any additional arguments to this command are taken as a "message" that will be
    printed by lpr to explain why jobs are being rejected from this queue. |

    | up | starts and enables a queue. |

    | enable | Accepts new jobs into this queue. (opposite of disable) |

    | start | Spools jobs from this queue to its printer. (opposite of stop) |

    | status | Provides status information for the specified printer(s). |

    | restart | Tries to kill and start a new lpd daemon. |

    | topq | Moves a specific list of jobs or users to the top of the queue. |


    # # Adding a Printer


    There are several steps to be taken when adding a printer:


    +   - Physically connect the printer to the host or network.

    - If the printer is connected to a host, ensure that lpd starts up during the
    boot process.

    - If the printer is connected directly to the network, configure its hostname,
    IP address, and so on, as indicated in the printer''s documentation.

    - Add an appropriate entry to the printcap file, and distribute it to the hosts
    that may access the printer.

    - Create the spool directories, ensuring that they have appropriate ownership
    and permissions.


    Most system administrators use printtool to create both spool directories and
    printcap entries. This works well for the spool directories, but printcap entries
    occasionally need to be edited manually.


    # # Print Server Configuration


    Some printers may have several different entries in the printcap. Each of those
    entries can describe different filters and other aspects of the printer''s operation.


    # # Samba


    As noted in Chapter 17, "Network Services," Samba allows a LINUX or other Unix
    system to function as a print server for Microsoft WINDOW and WINDOW NT clients.'
