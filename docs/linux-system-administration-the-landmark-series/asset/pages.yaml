    # Automated Monitoring: Alerts


    Monitoring is an essential task of system administration. But it is a task for
    which men are notoriously ill-suited. Frankly, computers are well-suited to monitoring
    each other and to alerting humans when an anomaly is discovered.


    Note that more than one computer must be configured to perform monitoring, because
    any computer doing monitoring itself will need to be monitored, preferably by
    a computer on another subnet. One of the things they should check is that cron
    is working correctly on the other monitoring hosts.


    The common means by which computers may alert humans to a potential problem are
    displaying or sounding a warning (or both) on a system administrator''s workstation,
    paging one or more system administrators, logging the problem to a file, and sending
    email to one or more system administrators.


    The selection of alerts will depend on the nature of the particular problem. For
    example, notice of a file system nearing capacity may be emailed to the system
    administrator responsible for the filesystem. A network printer that doesn''t
    respond properly to pinging might alert the Help Desk dispatcher, while a file
    server that doesn''t respond to pinging would probably set off pagers. All of
    these would be logged.'
