  md: 'The kernel provides three basic abstractions to user programs:


    +   - A virtual computer, also known as a virtual machine

    - Filesystems for persistent storage

    - Mechanisms for communicating with other programs


    # Virtual Machine


    A program written to run on Linux does not have to do anything special to the
    system with other processes. It happens automatically, because the kernel supports
    preemptive multitasking. The kernel scheduler is responsible for switching processes
    in and out of context as they contend for available CPU time.


    # Persistent Storage


    The kernel provides access to persistent storage, such as disk and tape drives.
    It interacts with storage devices via direct hardware addresses and provides this
    service to user processes. However, the kernel also provides filesystems that
    permit user processes to address persistent storage at a higher level of abstraction.


    # Interprocess Communication


    The kernel supplies mechanisms for user-level processes to exchange data with
    one another and to synchronize across shared resources. The System V IPC module
    provides shared memory, semaphores, and message queues for this purpose. The addition
    of network protocols allows interactions between processes on different systems.


    # Kernel Structure


    Kernels fall roughly into two types: monolithic kernels and microkernels. Monolithic
    kernels include all kernel functionality in one large package. Microkernels include
    only that absolutely must be part of the kernel, leaving ancillary functionality
    to be loaded as modules when required.


    The advantage of the microkernel is that the smaller set of software changes less
    and is more stable. Most revisions to kernel code are ancillary functions, such
    as device drivers, which must change as new hardware is released. The microkernel
    makes it possible to update a driver without replacing the kernel itself.


    The disadvantages of the microkernel system include the performance hit taken
    when module loads occur, as well as the security risks of reading code from a
    file and loading into the kernel. Microkernels also suffer from the overhead of
    copying messages, which is expensive compared to passing pointers to static buffers
    in a common kernel-wide address space. So, the principal advantage of a monolithic
    kernel is performance.


    Starting with version 1.3, it became possible to compile the Linux kernel either
    as a monolith or a hybrid. By compiling some features as loadable modules, the
    kernel gains'
