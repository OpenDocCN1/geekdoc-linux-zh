  md: '# Recovering from Corruption


    Once data has been found to be corrupt, recovery entails replacing the corrupt
    data with a copy that is still intact. Typically, this is done by restoring the
    data from an archive, by getting another copy from its original (possibly external)
    source, or by regenerating from source data. Any data of value that cannot be
    regenerated from source data should, of course, be backed up or archived. See
    Chapter 12, “Backups,” for details on various backup methodologies.


    # Ensure Availability


    Denial of service attacks are commonly attempted by both crackers and disgruntled
    employees. They range from outsiders bombarding gateway machines with carefully
    crafted packets to insiders deliberately unplugging networks to (usually insiders)
    planting Trojan horses and logic bombs.


    These types of attack involve a trusted user maliciously engaging software where
    it will be executed. Such software may shutdown systems (often intermittently),
    corrupt data, or destroy data. These are most often faced by disgruntled software
    developers and system administrators. The best defense against these is the maintenance
    of good morale.


    Denial of service attacks are generally difficult to prevent, usually but not
    always easy to detect, and pose varying recovery challenges.


    # Preventing Denial of Service


    Ensuring the physical security of servers helps to defend against some types of
    denial of service attacks. Servers should be located in a suitable data center.
    In addition to providing adequate cooling and redundant power, the data center
    should provide physical security for the servers. At a minimum, access to the
    data center should be controlled by card keys or a similar system that logs the
    entry (and preferably the exit) of each user. Obviously, only system administrators,
    network engineers, and wiring technicians have access. The locks that come with
    the cabinets should be used.


    Some services as anonymous ftp and public WWW service are inherently unrestricted.
    But most servers in most organizations are meant to serve a limited set of clients.
    The limit may be enforced by restricting the set of client machines to which the
    service will be provided or by restricting a set of users. Which restriction is
    better for a particular server will depend on the nature of the service being
    provided. Occasionally, it will be appropriate to check both the client host and
