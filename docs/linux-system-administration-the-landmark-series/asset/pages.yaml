    \ has an opportunity to corrupt valuable data. This may also be true of\ndatabases.\n\
    \n# Shadow Passwords\n\nThe information in /etc/passwd and the NIS passwd map\
    \ must be world-readable so\n processes correlate usernames to us. Traditionally,\
    \ the hash of the password\noccupied the second field of the passwd file or map.\
    \ Unfortunately, this provided\nanyone with access to the system an opportunity\
    \ to run attacks against all the password\nentries.\n\nTo prevent such attacks,\
    \ the hashed passwords have been moved out of the passwd files\nand maps into\
    \ /etc/shadow and the shadow map, which are readable only by root. This\nmakes\
    \ systems considerably more secure against attackers who have either authorized\
    \ or\nunauthorized non-root access to a system. Without the use of shadow passwords,\
    \ once a\ncracker has access to one account, he could easily gain access to many\
    \ others, except\nwhere the strictest rules are enforced to ensure strong passwords.\n\
