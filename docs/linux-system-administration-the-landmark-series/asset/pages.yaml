  md: '# Conclusion


    for personal use. After three months, the partition reached 95% of capacity. It
    would have been possible to procure more disk space, but doing so did not appear
    to be in the interests of the company or a good use of the system administrator''s
    time. Instead, the system administrator sent a message to the users, asking that
    they clean up their directories. Utilization fell less than 1%. The next day,
    the system administrator sent another message to the users, warning that if sufficient
    space did not appear within the hour, he would remove any pornography found in
    the home directories. Utilization quickly fell to 80%.


    # Overengineering


    One of the most common strategies for avoiding capacity-related failures is to
    overengineer each system at purchase. Most managers and even home users do this
    to some degree. It is common to spend a little more on a powerful system than
    one currently needs—in anticipation of future needs.


    We overengineer the consistent trend for more powerful systems to be released
    for about the same price or lower year after year. The early PCs cost about $5,000
    (US) back in 1982. That was for a system with 64KB of RAM and no hard drive. Just
    a decade ago, a 386 with 8MB of RAM and an 80MB hard disk cost about $3,000. Five
    years ago, a 486 with 16MB of RAM and a 200MB drive was about $2,000. Current
    Pentium II systems with 32MB of RAM and gigabytes of disk space sell for well
    under $1,000.


    # Personnel Capac


    System administrators are also a resource—and have limited capacities as we. Include
    the time and capabilities of system administrators in capacity planning models,
    as well as that of DBAs, network administrators, and other IT personnel.


    Because system administrators are more expensive than hardware, and degrade with
    excessive use, opportunities to reduce the load on the system administrators by
    acquiring or upgrading hardware should generally be availed.


    # Conclusion


    When considering capacity planning and performance tuning, here are some principles
    to follow:


    +   - Get baseline performance metrics.

    - Identify bottlenecks.

    - Consider methods to conserve or reduce utilization.

    - Try trading off a dearth of one resource for a surfeit of another (caching,
    indexing, and so on).

    - Provide management with a specific, prioritized list of requisite additional
    resources.'
