    # 8


    # Enforcing Security


    THE ENFORCEMENT OF SECURITY is the sexiest part of system administration. Hollywood
    does not depict the drama of moving an operational network from one place to another,
    the excitement of installing the latest hardware, the comedy of user questions,
    or the tragedy of failed restore operations. However, the intrigue of computer
    security has been the subject of numerous films.


    The mystique that surrounds computer security derives from the seemingly magical
    ability of crackers to gain unauthorized access. This magical similitude follows,
    like anyful trickery, from a lack of understanding about the methods involved.
    Deep understanding of computer security is rare—even among experienced system
    administrators. This lack of understanding is manifested in the widespread absence
    of security policy, which was discussed in Chapter 7, “Security Policy."


    The enforcement of security always follows from a security policy. Every security
    measure enforces a policy, whether explicit or implicit. The crafting of an explicit
    policy enforces deliberate consideration of threats and promotes preparedness
    for security breaches.'
