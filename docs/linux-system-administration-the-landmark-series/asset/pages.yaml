    # Newly Installed Kernel Doesn''t Boot


    Run /sbin/lilo to update the loader map. This contains information about the exact
    location on disk of files that the LILO boot manager will need to access before
    the system is completely included, including the kernel (or, in the case of multiple
    /etc/lilo.conf stanzas, of the kernels). This problem can happen when an automatic
    upgrade process does everything except /sbin/lilo.


    If the message Loading Kernel ... appears before it hangs, then there is probably
    a bug in the kernel. Perhaps an included driver is probing an I/O port or reserved
    memory addresses that is incompatible with the system. Try the reserve= exclude
    kernel parameters (passed via the LILO prompt or on the LOADLIN command line,
    and to isolate and work around such problems.


    # New Kernel Gets "kernel too big" Message


    When compiling the kernel, the make target bzlilo will create a compressed kernel.
    On newer systems, the default bzlilo will use a compression method called bzip2.
    If bzlilo was used and this message is still generated, upgrade the version of
    LILO.


    It''s also possible to build a smaller kernel--by moving more of the desired features
    into loadable modules. However, for servers, particularly for exposed servers
    where security is a concern, consider avoiding the use of loadable modules. See
    Chapter 10, "Configuring and Building Kernels," for more about creating modules,
    and Chapter 8, "Enforcing Security," for some of the deangers.


    # Kernel Gives "VFS Panic: unable to mount root"


    The Linux kernel has a default root filesystem (device and partition) encoded
    into it. It can be changed by the rdev command. There are a number of defaults
    that are "hard wired" into a kernel at compile time—and various options for rdev
    can be used to patch new values into a kernel without requiring a recompilation.


    If the root filesystem value is wrong for a given kernel, this message may appear
    as it tries to mount its root filesystem. Possibly the kernel was built on a different
    machine, built wrong, or the machine has been changed "underneath" (such as upgraded
    from IDE to SCSI.


    The easy solution is to override the kernel default while booting providing it
    with the root= parameter (from the LILO boot loader''s prompt) or on the LOADLIN.EXE
    command line.'
