    ~William Shakespeare. King Henry VI.


    # 19


    # Printing and Faxing


    MANY JUNIOR SYSTEM ADMINISTRATORS find UNIX printing difficult to configure. It
    need not be so. LINUX uses the BSD printing system, which is not as difficult
    to administer as some believe. The BSD printing system may be antiquated, System
    V printing has to be less reliable, even when supported by the largest commercial
    UNIX vendors. This chapter explains the components of the LINUX printing system,
    and how each relates to the others.


    The user-level print command is l1pr, which may be invoked by an application or
    directly on the command line. l1pr consults the printcap file to learn which spool
    directory to use for the specified printer, and then hands the job to the local
    l1pd daemon by writing it as two files to the appropriate spool directory. If
    the printer is locally attached (such as a serial or parallel port), then l1pd
    writes the job to the device specified in the printcap file, deleting the spool
    files only when the printer has acknowledged receiving them. If the printcap file
    specifies that the printer is attached to another host on the network or is itself
    a host, then l1pd passes the print job across the network to the l1pd daemon on
    the remote host or printer before deleting the job from the spool directory.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# lpr


    Every printjob is handled by lpr.¹ Typically, lpr is invoked by an application,
    a script, or directly on the command line. lpr never actually prints anything;
    rather it queues the print job, placing it in a spool directory to be processed
    by lpd.


    The common argument to lpr is the -P option used to specify the printer. If -P
    is not defined, the default printer environment variable, PRINTER, is used. If
    PRINTER is not defined, lpr defaults to using lpd, which should be defined as
    an alias for the default printer. The -m option instructs that a notification
    be sent to the user via email upon completion of the print job. The -s option
    is useful when printing very large files. It creates a synonym in the spool directory
    rather than a copy of the file.


    Other arguments can be used to specify the type of data to be printed. These are
    rarely used now because general-purpose filters have become sophisticated enough
    to automatically discover data types and handle each correctly. lpr indicates
    it in the control file. Eventually, the lpd daemon on the print host pipes the
    data through the filter specified by the corresponding entry in the printcap file.


    lpr parses the printcap file, searching for the desired printer name to learn
    the correct spool directory for the specified printer. lpr then writes one data
    file and one control file to the spool directory. The data file begins with df,
    the control file begins with cf, where cff is the job number.


    The last thing lpr does is open a socket to notify the local lpd daemon that the
    job awaits.


    # Spool Directories


    The print spool directories normally found under /var/spool/lpd/ may vary with
    the particular LINUX distribution. Ownership of the contents varies even more.
    It is safest to use the ownership and permissions expected by the applications
    included with the distribution. A directory owned by root may or not still be
    functional if the applications expect it to be owned by lpd.


    It is rare that a spool directory will need to be created manually. Normally,
    this is done using the printtool application.


    # lpd


    The line printer daemon. lpd, arbitrates access to printers by providing the spooling
    and scheduling functionality needed to support printing in a multiuser environment.
    It is the core of the LINUX printing system. The lpd daemon speaks the Berkeley
    lpd protocol over the socket, which is well understood and documented as RFC 1179.
    Most modern network printers support the lpd protocol.


