- img_proc: true
  md: 'The security model employed by LINUX is the traditional Unix model, which is
    rather simple. A process either has the unlimited powers of root, or it has the
    powers of a user or predefined group of users. Any process needing just a portion
    of root''s powers must be granted all of them. Clearly, this is not optimal.


    To improve the security model of the LINUX kernel, its developers are undertaking
    to implement the Capabilities Model, as defined by the POSIX standards. This development
    effort is part of the 2.3x developmental kernel series and is expected to be a
    feature of production kernels 2.4.0 and higher.


    In the academic definition used by computer scientists, capabilities are intangible
    tokens that are passed among processes and are used to mediate accesses. Under
    this model, no privileges are implicit or derived from the uid. Every privilege
    is itself. This is an elegant model. The implementation, however, would require
    rewriting nothing but the kernel, but the APIs and every utility and application.
    Someday an operating system may be developed in accordance with this model, but
    it will not be LINUX.


    The Capabilities Model under development for Linux requires making changes to
    the filesystem. The ext filesystem is planned to provide the necessary features.
    Changes will also have to be made to programs that need to recover the filesystem''s
    meta-data. But other software will continue to work as is.


    # Hardware Support


    Rapid tracking of emerging personal computer hardware standards allowed LINUX
    to be deployed on the latest generations of personal computers. This section is
    biased towards the Intel port, but this is, since the PC world is driving these
    advancements.


    Perhaps the biggest contribution to overall processing capability has been the
    drastic improvement of SMP support available in the 2.2 series of kernels. Dual
    CPU motherboards are now common: four-way systems are available from vendors,
    and eight-way systems are now just becoming available. The current implementation
    of Linux supports SMP systems with up to sixteen processors. Spin locks have been
    added to manage critical sections that could be entered by multiple processors.
    Note that this is in addition to the traditional code to make sure sections did
    not get reentered due to interrupts. By this writing, SMP on non-Intel architectures
    is still experimental.


    PCMC in Linux has been stable since the 2.0.x series of kernels. PCMC is noteworthy
    as it is a key feature for enabling Linux on laptops. It is also significant because
    it demonstrates the power and flexibility of the module system. PCMC devices that
    are hot-plug. The PCMC module detects the removal and addition of PCMC cards and
    cardmgr loads or unloads the appropriate driver as needed. Note that the PCMC
    source is distributed independently of the kernel, so to build a kernel with PCMC
    support, it is necessary to download and install the latest PCMC sources in addition
    to the kernel.


    Advanced Power Management allows systems to transition to power-saving modes of
    operation without halting the LINUX operating system. Used mostly with laptops,
    APM'
