    data can be restored.


    # Security Breaches and Sabotage


    It is often important to protect data against intentional destruction by both
    authorized

    and unauthorized users—even against destruction by root. If a disgruntled employee

    who knows or acquires the root password erases everything at his disposal, what

    will it take to recover, and what will it cost the business?


    Obviously, prevention is important, so it is covered from two different perspectives
    in

    Chapters 7 and 8, "Security Policy" and "Enforcing Security." But must

    be given to recovery if prevention fails. In some cases, it might be justified
    to have two

    system administrators sign off redundant sets of tapes or CD-Rs contain correct

    copies of important data and store them in different safes to which the system

    administrators do not have access. Sometimes there will be legal requirements
    to ensure

    data are available; even stricter protocols may be required, possibly armed

    guards in extreme cases.


    But the principle is the same—ensure that data remain available even in cases
    of

    malicious or incompetent system administrator.


    # Key Personnel


    The loss of key personnel may be just as disastrous as loss of data. Of course,
    good

    management always seeks to prevent the loss of key personnel, but sometimes disaster

    strikes despite the best attempts at prevention. Thus, planning the recovery from
    the loss

    of a person is no less important.


    There are four general areas of preparation to protect against the loss of experienced

    key personnel: documentation, cross-training, satisfactory compensation, and ensuring

    that personnel do not "burn out" or will suffer from stress-related health problems.


    # Environmental Disasters


    Floods, fires, and earthquakes routinely damage businesses in a variety of ways.
    One way is

    in interrupting computer operations. If necessary, steps may be taken to ensure
    continued

    operations even during an environmental disaster. One of the authors was responsible
    for

    building a computational infrastructure for a large investment bank that would
    generate a

    set of government-mandated reports every night—no matter matter. Three sets of
    servers

    were set up—two in New York and one in London—with two transatlantic connections

    along different undersea cables, and with well-backed-power sources. Most businesses

    do not have such extreme needs, but this example illustrates the sort of preparations
    that

    can be made for environmental disasters.'
