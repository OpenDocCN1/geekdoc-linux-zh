    initdefault. This entry determines which runlevel should be started. The runlevels
    are defined in Table 9.1. The process field of the initdefault entry is ignored.
    Never specify runlevels 0 or 6 in initdefault, because this will render the system
    useless. Supplying no value in the runlevel field will cause the system to prompt
    for the runlevel at the console boot;


    krequest. The process will be executed when a special key sequence is pressed.
    The keyboard map must have a definition for the KeyboardSignal key, which is used
    to define the key sequence for this feature.


    once. The indicated process will be executed once when the specified runlevel
    is entered. Used to start update, the Linux process that periodically flushes
    disk buffers.


    ondemand. This entry allows the indicated process to be executed when the associated
    runlevel is entered. The ondemand runlevels are a, b, and c. No actual change
    in runlevel occurs. The process is simply run when the ondemand runlevel is selected
    via init.


    off. This action disables the current entry. The entry is a no-op.


    powerfail. This action is called when init receives the SIGPWR signal. This indicates
    that the system is about to lose power. The indicated process is launched, and
    init returns immediately. The process should shut down the system gracefully.


    powerwait. This action is also associated with the SIGPWR signal. In this case,
    init also checks for the /etc/powerstatus and expects the contents to be the word
    Ox. This means that the process has returned to normal. This action is used along
    with the powerfail or powerwait actions to implement support for Uninterruptible
    Power Supplies (UPSs). It waits for the process to complete before continuing.


    powerwait. Similar to powerfail, except that init waits for the completion of
    the process before it continues.


    respawn. The respawn action starts the process associated with this entry when
    the indicated runlevel is entered. If the process exits, init will restart it.
    respawn entries are traditionally used to manage getty processes.'
