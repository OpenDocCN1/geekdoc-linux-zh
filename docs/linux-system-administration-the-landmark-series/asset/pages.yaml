    # # 17 Network Services


    THE OPERATION OF A NETWORK COMPUTING ENVIRONMENT depends on many services provided
    by various software components. Network services are provided to applications
    both on the same host and on other hosts. This chapter explains the purpose, function,
    and configuration of these services, which fall into two classes, system-level
    services and user-level services.


    Some of these services are necessary for computers to participate in the network
    computing environment, even before any user-level applications are running. These
    system-level services enable the computers in a network computing environment
    to function as a coherent whole. System-level services include DNS, RPC, NTP,
    and NIS.


    Other services are needed only to support user-level applications. These application-level
    services include mail, news, printing, FTP, http, remote shells, and file services.
    Application-level services shape the users'' view of the network computing environment.


    # ## System-Level Services


    System-level services are not used directly by users. Rather, they form an integral
    portion of the network computing environment by providing service to both operating
    systems'
