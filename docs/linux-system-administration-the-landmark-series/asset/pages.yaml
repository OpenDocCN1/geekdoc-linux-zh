    # User Datagram Protocol


    The User Datagram Protocol (UDP) provides simple low-level packet transmission
    and reception to applications. A UDP packet contains the IP header, a UDP header,
    and the packet data. The UDP header contains two fields known as ports and a checksum
    that includes the UDP header, packet data, and portions of the IP header. The
    ports serve to differentiate UDP conversations, so that multiple applications
    on a host can use the UDP protocol simultaneously. The most common applications
    Internet Numbers Authority (IANA) register their port numbers


    UDP is described as a connectionless protocol because there are no fixed relationships
    among hosts communicating via UDP is also a stateless protocol, because the protocol
    does not specify relationships among any packets transmitted or received. This
    does not mean that all UDP communication is stateless; it simply means that higher
    layer applications and protocols define the relationships. UDP does not provide
    end-to-end reliability, so applications that use UDP typically provide sequence
    numbers and retransmission algorithms.


    Applications that need to use IP broadcasting and multicasting must use UDP. Broadcasting
    and multicasting are incompatible with TCP, which is strictly a connection-oriented
    protocol between two endpoints.


    Many protocols are implemented on top of UDP and are available to programmers
    via a library. The Open Networking Remote Procedure Call (ONC RPC) protocol is
    an example. The RPC library includes all of the logic to create a reliable transport
    on top of UDP. This removes the burden of low-level network programming from the
    application programmer.


    The following applications use UDP to communicate:


    +   * The Domain Name System (DNS)

    * The Network Time Protocol

    * bootp

    * The Network File System (via RPC)

    * The Network Information System (via RPC)'
