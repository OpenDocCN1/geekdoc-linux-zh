    Note that even this simple case requires some investigation and analysis.


    # The System Administrator’s Job Requirements


    Most professional system administrators want to get or keep a job in the field,
    to progress in their careers, or possibly move into another field for system administration
    may be a stepping stone. Most system administrators prefer working with the latest
    technology, and derive satisfaction not just from a good job, but from solving
    problems or keeping an organization smoothly.


    The preliminary requirements analysis is a matter of determining whether you have
    the prerequisite skills for, and interest in, a position. You may decide that
    you don’t have the necessary expertise—and be offered the position despite that.
    Expertise may be the most obvious prerequisite for the system administrator, but
    it’s not the most important. The ability to recognize the limitations of your
    own knowledge, and the willingness to ask, to research, and to recommend further
    consultation will often be more valuable than fluent in shell or Perl scripting.


    Alternatively, you may come to the conclusion that a good position doesn''t interest
    you. Requirements analysis will almost certainly help you discover more quickly
    than the on-the-job experience. In some cases, you may be able to identify the
    specific aspects of the position that you dislike, and get them changed, delegated,
    or reassigned.


    Most books for system administrators start with a list of duties and responsibilities
    that are typical for the position. As we’ve discussed, there are a variety of
    titles under which system administrators work. In addition, the actual jobs vary
    considerably from one position to another and over time. The problem is that this
    one of them of “typical” duties won’t cover all or most of the duties of any particular
    system administrator. For the exceptions, the extraordinary, and the rest, we
    have a process to explore the requirements and negotiate among possible solutions.


    Ideally, you want to perform some analysis of the requirements for your potential
    role as a system administrator before you accept the job. Asking appropriate questions
    to that end in an employment or promotion interview will probably increase your
    chances of getting the offer. Good questions demonstrate experience and knowledge
    far more than testimonials or anecdotes about past performance, and will demonstrate
    your interest in the position.


    Here are some questions to ask before accepting a system administration position:


    +   - Who would you report to?

    - Who, if anyone, would be reporting to you?

    - What were the duties of your predecessor?

    - Under what circumstances did your predecessor leave?'
