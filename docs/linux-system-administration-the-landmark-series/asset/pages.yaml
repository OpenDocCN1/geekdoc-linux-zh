  md: '![](img/ffdfa0821b4a8f1b49759a4b4d78044a_188_0.png)


    That which comes after ever conforms to

    that which has gone before.


    ~Marcus Aurelius Antoninus, 121–180 A.D.


    # 14


    # System Profiles


    EVERY SYSTEM ON A NETWORK should have a profile; every organization should have
    a taxonomy of the systems it employs. Each system should fit into a category or
    class of machines. At the highest level, each machine should be categorized as
    either a client or a server. Most likely, servers will be further categorized
    into classes such as NFS servers, mail servers, DNS servers, database servers,
    and so on.


    Standard profiles should be defined for each class of machine, based on the specific
    requirements of the organization. As we discuss in Chapter 15, “Automated Installation
    and Upgrade,” each standard profile may be installed automatically from a build
    server using a set of packages prepared for that profile. This facilitates installation,
    upgrades, and disaster recovery.


    It is not necessary that all existing machines exactly fit the profiles. The objective
    should be that each existing machine could be replaced with a machine built from
    one of the profiles. In other words, the profiles should be defined such that
    they can be used to build all the machines that the organization may need.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Clients


    To the extent possible, the software configuration of all client machines should
    be the same. The only differences should be the configuration parameters that
    enable each machine to be a part of the network, such as hostname, IP address,
    broadcast address, default route, and so on. DHCP permits them to be stored on
    a server.


    Each user should find exactly the same environment on any machine to he can log
    in. Everything specific to a user should be in his home directory mounted from
    an NFS server, not installed locally on a client machine. Similarly, application
    software should be mounted from a server, or kept under strict version control.


    No permanent data ever be stored on any client machine. All data should be stored
    on servers. Compliance with this principle obviates any need to back up clients.
    Servers should be the only machines that require backing up.


    If a client machine suffers a failure, it can be replaced by a spare already built
    with the standard client profile, which needs only to have its network parameters
    set. Then the failed system may be diagnosed and corrected as the system administrators
    have time. Once corrected, it becomes a spare.


    # Servers


    Many different services may be provided by server machines. Often, more than one
    service may be provided by a single host. Indeed, Linux can reliably run almost
    any combination of services and applications on the same machine. For example,
    a strong case can be made for configuring a single host to provide (caching) DNS,
    NIS, and mail services to a department. Because mail hosts make frequent lookups
    in both DNS and NIS, providing all three services on the same machine eliminates
    some local network traffic.


    Some servers will necessarily require a different configuration than others. For
    example, hosts that provide NFS or database services will require vastly more
    disk space (possibly in a RAID configuration) than those providing DNS, NIS, or
    mail services. In practice, it is rare to combine (on a single host) NFS service
    or database service with other services.


    NFS servers and database servers require partitions not on other types of servers,
    so they will require their own profiles. Or will they define profiles that all
    the server software used is installed on every server, in a standard set of partitions.
    Obviously, NFS exported volumes would have to reside on a separate (potentially
    external) drive array, however, it is possible to install bind and syslog on database
    servers. Ample disk space should be available. The problem is that most of the
    database software in use is still proprietary and subject to licensing restrictions.
    Depending on licensing terms, there may be a problem with installing Oracle, Sybase,
    or Inform on hundreds of servers without paying for it, even if the software is
    never run.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'One strategy is to install all server software on every server, and enable
    only the required services. This permits an organization to have one server profile
    from which most or all servers can be built. The alternative strategy is to install
    on each server the software that it needs to run. The former is more convenient,
    but the latter is more flexible and may be more secure. The revisions will also
    be less frequent.


    # Unique Machines


    Unique machines are the bane of scalability, but sometimes there will be a business
    or technical requirement for a machine that deviates from the defined profiles.
    When this happens, the first question to consider is: Do we need to redefine an
    existing profile, or is this a unique case requiring a new profile?


    When the requirement really is for a unique machine, the task at hand will be
    to adapt a standard profile to meet the need, if possible. First, build the machine
    nearest to that which is required, and add what is needed, carefully documenting
    all that is added. If anything must be removed, document that also. Once the system
    works as desired, prepare a set of packages to install all that was needed to
    configure the system beyond the standard profile from which it was built. Build
    a standard system again and install the packages to test that this procedure works.
    Finally, fold these packages back into the automated build server and test that
    the automated build works correctly. Now a recovery procedure is in place if anything
    happens to the machine. Of course, any transient data of value will have to be
    backed up too.


    # Documentation


    Profiles should be self-documenting. Each profile should include a README file
    in the so on directory that identifies and describes the profile. If a unique
    machine cannot be built automatically from a profile, the README file should indicate
    on which profile the machine is based and all the steps to recreate the machine
    from the nearest profile. A copy of the README file should be printed and taped
    inside the case.


    # Partitioning Theory


    Every LINUX system must have partitions. Selecting the number and size of the
    partitions and then distributing the filesystem over them must be done sensibly
    if the system is to be reliable. Partitions ensure that disk capacity needed by
    particular types of processes will not be consumed by others. This helps ensure
    that systems and processes continue running, even if some partitions are filled.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Chapter 14 System Profiles


    Every LINUX system must have a minimum of two partitions: at least one for the
    filesystem and least one swap partition.¹ We strongly recommend at least two filesystem
    partitions: one for directories that tend to grow, and the other for directories
    that need to maintain free space for the system to function.


    We also recommend an alternative root partition for rescuing the system in the
    event that the partition becomes damaged. This is discussed in Chapter 3, "Recovery
    Planning."


    There is not controversy about how a filesystem should be divided into partitions,
    but neither is universal agreement. The advantage of fewer partitions is that
    it makes more efficient use of the available disk capacity. By reducing the number
    of partitions on which free space and inodes must be preserved, the total space
    that must be kept free is reduced. The advantage of more numerous partitions is
    a reduced impact of any one partition filling capacity.


    Rather than advocating a particular partitioning scheme, we explain the filesystem
    in terms of how various directories may fill to capacity, and the consequences
    when they do. This should help the reader determine which parts of the filesystem
    may safely placed on the same partition, and which parts should be kept separate.


    # The /Directory


    The directory is the root of the hierarchical filesystem. All other directories
    are under the directory (called the root directory), either directly or indirectly.
    Because the / directory can never be mounted under another directory; there must
    be a /.


    Each directory that is immediately under the / directory and does not have its
    own partition is necessarily a part of the / partition. The root directory itself
    is, of course, always located on the / partition.


    Generally, directory structures placed on the / partition are small, are very
    unlikely to grow much during operations, and may require some free space in order
    for the system to run. Such directories typically reside together without doing
    each other harm.


    # The /bin directory


    A good example of a directory that is normally placed on the / partition is /bin.
    The /bin directory contains only executables, so it grows only when a system administrator
    adds to it. This means that operations in this directory are most unlikely to
    fill the partition on which it is stored.


    Thus, the characteristics of the /bin directory are that it could be placed on
    any partition of the filesystem. It doesn''t harm others, nor does it need free
    space to execute its role in the system.


    +   1. The 2.0 kernels constrained the useful size of swap partitions to no more
    than 128MB, so servers employed multiple swap partitions. This limit has been
    removed with the 2.2 kernels, rarely will there be a need for more than one swap
    partition on a machine.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Partitioning Theory


    167


    # The /boot Directory


    The /boot directory is, by convention, the place where LILO finds everything it
    needs to boot the kernel. Specifically, one or more kernel images, module information,
    and maps that LILO know where things are located may be found in /boot. None of
    these things are changed or added during normal system operations. The need for
    free space arises when a new kernel needs to be installed.


    If /boot were on a partition that had become full, that alone would prevent the
    system from booting. However, it would be inconvenient to not have ample space
    on whatever partition includes the /boot directory. For these reasons and because
    there would be little advantage in having it on its own, it is usually included
    on the / partition.


    # The /dev Directory


    Interfaces to hardware devices as pseudo-files in the /dev directory. They exist
    so that the stdin and stdev counts may be employed when sending data to and receiving
    data from hardware devices.


    The directory also contains one executable, /dev/MAKDEV, which creates device
    entries in the directory.


    Because devices are created during normal system operations, a full partition
    that included the /dev directory would crash the system. The directory uses very
    little space, but often more than a thousand modes. So, normally, /dev is included
    on the / partition.


    Note that, in the future, /dev will be a virtual filesystem, not actually resident
    on disk, as is the /proc filesystem.


    # The /etc Directory


    Most system configuration information is stored in various files in the /etc directory.
    Some of these files contain configuration information that the system maintains
    on an ongoing basis, so it is important that /etc not be part of a partition subject
    to filling.


    It is uncommon for the /etc directory to have its own partition. Because it tends
    not to grow much, it is usually included on the / partition. One exception is
    when, for security reasons, such as on a firewall, the / partition is placed on
    a drive which is write-protected by a physical jumper.


    # The /home Directory


    Except on isolated systems, such as a home user might have, /home is typically
    an NFS mount. On systems that have a local /home directory, it should be a symlink
    to a /usr/home directory on the / partition or have its own partition, because
    home directories tend to fill, and filling the / partition can cause serious problems.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# The /lib Directory


    The basic system libraries are found in /lib. These are usually updated during
    system upgrades, so there is little danger of this directory causing a partition
    to fill. Also, normal operation of the system will not be impaired by a lack of
    space in the /lib directory. Since /lib affects neither nor is affected by other
    directories on the same partition, there is no reason not to make part of the
    / partition. The compelling reason why the /lib directory should be included on
    the / partition is that nearly every executable depends on the shared libraries
    therein.


    # The /lost+found Directory


    Every filesystem has a /lost+found directory. This is where fsck places filesystem
    entries for files that are orphaned by a filesystem failure, such as when a system
    is shut down (perhaps due to a power failure) without a filesystem synchronization.
    These directories are not of concern in partitioning.


    # The /mnt Directory


    This directory exists to provide mount points at other filesystems may be mounted.
    Floppy disks and CD-ROMs are normally mounted here, and NFS filesystems may also
    be mounted here, so the /mnt directory should never consume disk space, and not
    a large number of inodes. If the partition on which the /etc directory is found
    full, the mounting of any filesystems that should happen automatically will fail
    because /etc/stab will not be writable.


    Typically, the /mnt directory is located on the / partition.


    # The /opt Directory


    The /opt directory is one of the conventional places for third-party applications
    to be installed. If it is used for this purpose, it should probably have its own
    partition. Alternatively, if applications are to be stored under /usr/local, then
    /opt may be located on the / partition. In the latter case, we recommend that
    it be a link to /usr/local/opt, so that anything that may be installed in /opt
    is actually stored on the /usr or /usr/local partition.


    # The /proc Directory


    The /proc directory is not a real directory. It is an interface to virtual configuration
    parameters belonging to the kernel. It does not take up space on any disk, and
    it does not reside on any partition. Therefore, it is not of concern in matters
    of partitioning, except that the mountpoint must exist.'
  merge: -1
