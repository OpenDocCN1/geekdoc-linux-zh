  md: 'Friends don''t let friends use closed source software.


    # 1


    # The Prime Directive


    TO PROVIDE AND MAINTAIN ACCESS TO SYSTEM RESOURCES is the system administrator''s
    "prime directive." Ultimately, all of our professional activities stem from or
    relate to this goal. Regardless of the computing platform involved, all operating
    systems provide mechanisms to manage resources. These resources include files,
    applications, peripherals, services, bandwidth, CPU cycles, memory, and storage
    space.


    Identifying the resources, their owners and users, and defining the forms of access
    and the authorities involved is a process of requirements analysis. System administrators
    must transform this generalization into specifics for their systems, their users,
    and their management.


    Maintaining access to a system''s resources transcends the maintenance of access
    to the system itself. If the system fails or is made unavailable due to some disaster,
    the system administrator will be expected to restore normal operations in a timely
    fashion. Most people think "doing backups" fulfills this requirement. However,
    our focus will be on recovery planning—which includes doing backups but also entails
    risk assessment, testing, and more.


    During normal operations, and especially as organizations grow and adapt, the
    utilization of resources changes across systems. When the attempted utilization
    of any'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1 The Prime Directive


    resource exceeds capacity, it is likely to be viewed as a disaster. The system
    administrator will have failed in his prime directive to provide the necessary
    access. One failure may also cause the failure of other services. For example,
    if system logs fill a disk partition, this can prevent the delivery of email through
    that system. These disasters must be avoided through capacity planning.


    Security is the corollary of our prime directive—to deny access to system resources,
    as well as to ensure that services are provided appropriately during and after
    attacks by outsiders or insiders. Security involves both policy management and
    enforcement.


    Appropriate forms of access must be provided, as authorized by the owners of each
    resource. The processes of defining and enforcing these policies are the two essential
    components of system security. Security permeates every aspect of system administration,
    although we include a chapter on each of these security topics, we also refer
    to security implications throughout every chapter.


    These topics—requirements analysis, recovery planning, capacity planning, and
    security—are the core of the system administrator''s job and constitute the first
    part of Linux System Administration. Throughout the discussion of these topics,
    GNU/LINUX-based examples are used, but most apply to other variants of UNIX. The
    concepts apply to computer systems generally.


    The rest of this volume covers practical details of administering LINUX systems,
    including booting and shutdown, the kernel, network profiles, and sample configuration
    descriptions for the most common types of servers and workstations.


    # Why Do Systems Need Administration?


    With LINUX we have a version of UNIX that is easy to install, on such a wide variety
    of commonly available (and inexpensive) hardware, that relatively inexperienced
    users can install and use themselves. Current versions of the popular LINUX distributions
    are easier to install than the versions of MS-DOS that were sold by the millions
    less than a decade ago.


    However, it is one thing to install LINUX on a PC and run typical applications
    on it. Almost anyone can do that. To do this in a way that meets the specific
    business needs defined by management requires a professional.


    Those who have become accustomed to home computers naturally ask, "Why do these
    systems need constant maintenance?"


    The fact is that many systems do not need. There are "embedded" and "turnkey"
    systems that function like appliances. These need even less maintenance than a
    toaster or refrigerator (which have to be cleaned occasionally). Some of these
    computing appliances, like the Igel Etherulation X terminals, the Cobalt Networks
    Qube, and the Cobalt NetWinder "network computer," are built around customized
    versions of LINUX. Some organizations purchase these, plug them in, and use them
    with no system-level changes throughout the lifetime of the product.


    ![](img/ffdfa0821b4a8f1b49759a4b4d78044a_29_0.png)'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Who Administers Linux Systems?


    However, the computer systems in most organizations are much more dynamic. Computers
    are general-purpose devices, and most operating systems and widely available software
    are written for general use. Thus, it is the system administrator''s job to adapt
    these tools to the specific needs of a given organization. Those needs change
    over time and differ among departments within an organization.


    # Who Administers Linux Systems?


    If you are reading this, chances are that you''re professionally managing at least
    one Linux system, or you expect to be responsible for one or more LINUX systems
    in the near future.


    Perhaps you''ve been administering a LAN full of Unix workstations and servers,
    and you are adding some PCs to the network. This might be motivated by their low
    cost, their ubiquity, or any other factors. You might also be considering the
    SPARC or MIPS products of Linux on older Sun or SGI workstations unsupported by
    recent versions of Solaris and Iris.


    Perhaps you''re approaching Linux from the PC world. You''ve been managing NetWare,
    LAN Manager, or Windows NT servers and you need to manage or replace these with
    some form of Unix.


    Perhaps it isn''t even the servers you''re concerned about. Some of your users
    may be demanding access to applications and tools from the Unix world. The release
    of WordPerfect for Linux and recent upgrades to that package, and the maturing
    Apprentice and StarOffice commercial applications, as well as the ongoing development
    of free applications like LyX, SIAG, and the GIMP, are contributing to this demand.


    It may also be that your management requires more centralized control and security
    for their desktop systems than is possible using more PC and Macintosh operating
    systems.


    Perhaps you are an experienced Linux user and the professional administration
    of these systems is new to you. The management of multi-user and network systems
    is much more complex than maintaining and using home systems.


    Linux Administration addresses these cases and many others. Naturally, it can''t
    be "all things to all people We assume you are a reasonably advised Linux user—and
    we won''t waste your time with "blow by blow" monographs on how to install Linux
    on a PC, how to use a command shell, or how to edit files.


    System administrators are advanced computer users. Although a majority of Linux
    users had no previous UNIX experience (some estimates suggest as many as 75 percent),
    most Linux system administrators have experience with several forms of UNIX.


    +   1. This is more likely for some specialized scientific applications and, of
    course, many programmers. Surprisingly, the 1997 IDC survey showed that Linux
    was used for workstations 2:1 over Windows NT and almost 4:1 over all of the traditional
    variants of Unix.'
