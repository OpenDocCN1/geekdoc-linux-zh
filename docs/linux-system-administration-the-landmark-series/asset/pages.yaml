    # 20


    # Working with NFS


    THE NETWORK FILE SYSTEM is the set of building blocks for creating a filesystem
    hierarchy shared across the network. In LINUX, all files are visible as a single
    tree structure descending from the / directory, also called the root directory.
    The mount command is used to attach filesystems to this tree. NFS clients mount
    filesystems provided by one or more NFS servers using either the automounter or
    entries in /etc/fstab to specify the filesystems to be mounted. An NFS server
    provides NFS for one or more filesystems that are locally mounted on the server.
    The /etc/exports file specifies the filesystems to be exported and the access
    controls applied to them. Access to NFS mounted filesystems is transparent to
    users and user processes. From the user''s perspective, NFS filesystems exhibit
    the same semantics and behavior as locally mounted filesystems.


    # NFS Basics


    In the simplest case, there are only five things one needs to do to use NFS. On
    the server, add the filesystems to be exported to the /etc/exports file and start
    NFS with the /etc/rc.d/init.d/nfs start command. On the client, specify in /etc/fstab
    the filesystems to be mounted and the directories where they are to be mounted.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'structure of files is documented in the exports(5) and fstab(5) man pages.
    There are a large number of NFS mount options, the defaults are appropriate for
    most situations.


    If a filesystem is desired only on a temporary basis, the mount command may be
    used directly, bypassing the fstab file. Filesystems mounted in this fashion will
    not be mounted during subsequent reboots of the client.


    # Managing NFS Mounts with the Automounter


    At smaller sizes, the system administrator typically will begin by mounting a
    few filesystems using the fstab method. This technique becomes cumbersome, and
    the automounter becomes the preferred mechanism for managing NFS mounts.


    The automounter has several distinct advantages. It minimizes NFS mounts until
    they are actually needed, which can prevent mount storms if a large number of
    NFS clients reboot at the same time. It also unmounts filesystems that are not
    in use after a specified period of time. This helps the administrator move data
    between servers minimizing interference with processes running on client workstations.
    Finally, the automounter maps reread every new mount request is processed, so
    one can make changes on-the-fly, and the new mapping will take place the next
    filesystem is mounted. However, if the automounter crashes or encounters a serious
    bug, the system may have to be rebooted to solve the resulting problems. This
    occurs very infrequently, so it rarely has a reason to not use the automounter.


    +   There are two flavors of automounter available to UNIX users (and also known
    as aututils) and autofs. The automounter uses an older technique for managing
    mounts. The automounter cannot mount filesystems directly where the mount points
    indicate; instead, a symlink is placed at the mount point, which points to an
    alternate location where all autom mounts are made. This directory is normally
    specified as /a, but another location can be specified on the command line, and
    has been ported to a large number of platforms and may be the best choice in heterogeneous
    environments that share a single set of maps. The autofs is a more modern implementation
    and is not annoying. It is implemented as a filesystem, so there are no annoying
    links. Thus, automount files appear exactly as indicated by the autom maps. Also,
    the format of the autofs maps are simpler and easier to maintain. If one chooses
    to support both the and and autofs automounters, we recommend that one set of
    maps be generated programmatically from the other. The authors use a utility called
    automount2amd to generate and style maps from autofs style maps. One automounter
    is required per mount point. The format of an autofs map is as follows:


    +   key options source


    The options field can be empty. A typical home directory tree might look like
    this:'
