  md: '# Appendix A Emergencies


    It is possible, even wise, to create a /bin directory and create hard or symbolic
    links from there to every file that root should use. Then root''s PATH can consist
    of just that directory and nothing else.


    While this may seem a silly exercise, it may help discourage operators from unnecessarily
    running programs as root might even prevent trojan horses from working (some old
    case where an attack can add a new file to one of the bin directories while they
    can''t overwrite any of the files thereunder).


    # Maximum Files Opened


    The kernel has a built-in limit, rarely reached in normal use, for how many files
    may be open at one time. Encountering this limit may lead to file open failures
    even when no other user is in contention for the file.


    echo new values into /proc/sys/kernel/file-max and into /proc/sys/kernel/inode-max


    For example:


    ```

    inode-max = 32768

    file-max = 5120

    ```


    ```

    NR_TASKS = 1024 (linux/tasks.h)

    MAX_TASKS_PER_USER = 128 (linux/tasks.h)

    ```


    Also ensure that 256 pty nodes exist under the /dev device: many distributions
    create only 64 (use the /dev/MAKDEV script).


    Some settings related to the maximum number of tasks (system-wide) and maximum
    number of tasks per user can be modified at compile time in the kernel sources.
    Look in /usr/src/linux/include/linux/tasks.h for these settings.


    # Filesystem Troubles


    This section details various difficulties that a filesystem can present.


    # “unable to find swap-space signature” Error


    Use fdisk to double-check the partition types of the entries in the partition
    table. After verifying that the partition settings are correct, use the mkswap
    command.


    It is possible to cause this error while trying to share swap space with other
    operating systems. See the LINUX+FreeBSD HOWTO for an example of proper swap sharing.


    # Filesystem Out of Space


    If a user exhausts the space available from a filesystem, you should find that
    root has a bit of “breathing room” courtesy of the reserved-space feature of UNIX
    systems.'
