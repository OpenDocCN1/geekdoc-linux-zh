  md: '# 268 Appendix A Emergencies


    It is also possible that a nearby system is flooding the network connection. If
    this is the case, several neighbors on the segment will be affected erratically,
    and it will not matter what kind of service they are attempting to access.


    # TCP Traffic Is Slow and/or Erratic


    There may be filtering problems with ICMP packets at either end or along the way.
    To block ICMP pings, you want to do something like this:


    ```

    /sbin/ipfwadm -Ia accept -P icmp -S 0/0 0 3 11 12

    /sbin/ipfwadm -Ia deny -P icmp

    ```


    Note that type 3 is for path-MTU discovery!

    This will accept these ICMP types:


    +   0. echo reply so that outbound ping works

    3. destination unreachable (for path-MTU discovery and to eliminate wait for a
    timeout on references to nonexistent hosts and domains)

    11. TTL exceeded for traceroute

    12. IP parameter error (very rate)


