  md: '# Table 21.1 Common NIS data


    | Map | File Equivalent | Description |

    | --- | --- | --- |

    | password | /etc/passwd | Correspondence of user name, uid, password, shell,
    and so on |

    | group | /etc/group | Group names, gid, members, and so on |

    | aliases | /etc/aliases | Shared mail aliases |

    | hosts | /etc/hosts | Host data. Normally DNS observes the need for this map.
    |

    | networks | /etc/networks | Information on networks and netmasks |

    | protocols | /etc/protocols | Data about IP protocols |

    | services | /etc/services | Well-known ports for TCP and UDP |

    | rpc | /etc/rpc | RPC program numbers |

    | netgroup | /etc/netgroup | Data derived from hosts, group, and passwd files.
    This set of data is specific to NIS. |

    | auto.master | /etc/auto.master | The root automount map |

    | auto.home | /etc/auto.home | The automount map of home directories |


    The size limitation could be circumvented by creating nested definitions for large
    aliases and netgroups. Where such workarounds are in place, they should not be
    unraveled without due care.


    The implementation of NIS available for LINUX (NYS) is written with dbm, which
    does not suffer from such data length limitations. However, when deploying NIS
    in a heterogeneous environment, a slave server using a dbm implementation will
    impose data object size limitations. Also, do not use the ypfd daemon if slave
    servers are not running Linux or have a byte order different from that of the
    NIS master. See the ypfd page for additional information.


    # Configuring NIS for High Availability


    NIS contains critical system data, and systems configured to use NIS will hang
    or respond sluggishly if the NIS service becomes unavailable. Therefore, NIS should
    be deployed in a manner that ensures the highest possible availability. The key
    to providing highly available NIS is understanding how the ybind process behaves
    when the server to which it has bounds unavailable.


    The ybind process attempts to rebind when a server becomes unavailable. Usually,
    this means that the client will broadcast to another server on the local subnet.
    By


