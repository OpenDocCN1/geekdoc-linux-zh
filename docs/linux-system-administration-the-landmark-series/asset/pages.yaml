- img_proc: true
  md: 'A system can safely run for many hours in this state, as long as no attempt
    is made to use the wedged processes or device (mount, for instance). Most services
    can be cleanly shut down and the system safely rebooted.


    Become root and read /etc/mtab to see the presently mounted filesystems. Don''t
    use the mount command, if it might also edge. Arrange for a manual orderly shutdown
    by closing processes in their expected fashion. The scripts in the init. directory
    are given the stop parameter to aid in this. Avoiding running scripts that will
    access mount (if applicable) the affected network will significantly reduce the
    number of open files that may be affected by the hard reboot that will have to
    be performed.


    Routinely enabling the Magic SysRq option when building kernels is recommended
    for situations like this. (See page 252 for details.)


    # Accidental File Deletion


    When all links and file handles to a file have been removed, and the last descriptor
    to the file is closed, the space occupied by the file is available to garbage-collected
    by the filesystem driver. Once it has been cleared by that, it is gone.


    There''s an Undelete HOWTO, and there are several LINUX hex editors. The ext2abcd
    and debugs commands are a couple of tools that are suitable for this sort of problem.


    However, these heroes are best avoided by regular backups, data replication/mirroring:
    version control, good computing practices, and proper enforcement of security
    policy.


    # Accidental Recursive chown/chmod of .


    One of the more subtle ways of breaking a system is by using a command like this:


    ```

    chown -r foo *

    ```


    A system can be ruined by incomplete parameters during a restore command. In such
    cases, reissuing the command (if you haven''t run your access to that program,
    or to chown) will correct the problem.


    However, recursive use of commands like chown and rm -rf . * is very bad and should
    be issued by root with extreme caution. Here are some possible methods to prevent
    globbing from giving you extra trouble.


    One solution is to use -a -ld.* to find an alternative glob. For example, ../[a-z]*
    is usually sufficient. In some cases you can use a "negated character class" of
    the form: [[!]* to get everything that doesn''t start with two dots. In other
    cases you might use ??* to get all links that start with a dot followed by any
    two other characters.


    In many cases it is safest to find a ... -type f ... | while read command to explicitly
    recurse over the intended files


    Also with chown there is the danger posed by symlinks. It is probably wise to
    routinely use the -h (--dereference) flag when using chown as root.'
