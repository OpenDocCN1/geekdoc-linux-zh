  merge: -1
  pgno: 194
- img_proc: true
  md: '# /var Directory


    Files that will be kept either for a determined period or until a particular event
    occurs contained in subdirectories of the /var directory. In other words, /var
    is the canonical place for applications to keep working data that cannot be kept
    in memory. Examples include mail, news, and print pools, which are kept until
    they have been processed, as well as log files, which are usually rotated and
    deleted after a fixed number of rotations.


    Thus, the contents of the /var directory grow and shrink under normal system operations.
    If space is not available in the /var directory, a number of applications will
    be interrupted—some gracefully, others not. Therefore, the /var directory may
    be part of the / partition on client machines but it nearly always resides on
    its own partition on server machines. In fact, on servers it is often sensible
    to install the subdirectories /var/log and /var/spool on their own partitions.
    As an alternative or conjunct to a distinct /var/log directory, it is possible
    to install a syslog server to accumulate the log files from multiple machines.


    # Partitioning Clients


    The partitioning requirements on client workstations are simpler than on servers.
    It is because there are fewer processes running on clients that might fill a partition,
    and because the consequences of filling a partition on a client are less severe
    than on a server.


    We recommend a minimum of three partitions for a LIN client, including a swap
    partition. The only reasonable partitioning strategy for only two filesystem partitions
    (plus one swap partition) is to include all the directories the filling of which
    would interfere with system operations in the / partition, and all the directories
    that might tend to fall in the other.


    Fewer than five partitions should be employed only when disk space is at a premium,
    because the symlinks required to keep multiple top-level directories in the same
    (non-root) partition complicate matters. It is simpler to put /tmp and /var on
    their own partitions. Dispensing with the requirement for symlinks makes it easier
    for a system administrator who comes along later, because everything is exactly
    as it appears.


    # Partitioning Servers


    Servers naturally justify more partitions than do clients because it is more important
    that servers be robust. We recommend that every server has separate partitions
    for /, rescue root, /tmp, /usr, and /var, in addition to the swap partition(s).
    Many servers will need even more partitions, depending on the services to be provided.
    In this section, we examine various sorts of servers in detail.'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'A server that may be subject to heavy loads either have the swap partition
    on its own disk or have one swap partition on each of two or more disks. Swap
    partitions on different disks should have equal priorities.


    # DNS Server Partitions


    DNS servers provide directory information to the other machines on the network.
    They are used redundantly so that if one fails, clients still get the information
    they need. This involves delays, so it is best to partition DNS servers to be
    robust.


    Not pooling takes place on DNS servers, so separate partitions for /var/log and
    /var/spool are not required. But /var should definitely have its own partition
    of at least 100MB, because DNS can generate significant log files and backup files
    by secondary.


    # NIS Server Partitions


    The partitioning requirements of NIS slave servers are similar to those of DNS
    servers, except that the log files should be kept from filling the partition containing
    the YP maps (usually /var/yp/maps). Therefore, we recommend separate /var and
    /var/log partitions. The /var/log partition should be at least 50MB, and the var
    partition should be considerably more than twice the maximum size to which the
    YP maps may be expected to grow.


    NIS masters have the same needs as NIS slaves, but the /var and /var/log partitions
    should be even more generous. One cannot have too much space.


    # Mail Server Partitions


    The concern with mail servers is to ensure that /var/log and /var/spool each have
    ample space and that neither impairs the other. Therefore, either or both should
    be on partitions separate from /var. The /var/log directory should be on a partition
    with at least 100MB of space. The space required is proportional to load. The
    /var/spool directory will require enough space to retain all the mail messages
    for all the users whose mail resides there. This could easily run into the gigabytes
    for machines serving for many users.


    # ftp and http server Partitions


    All ftp and http servers should have at least 100MB on either the /var or a /var/log
    partition to accommodate log files. The space required is proportional to load.


    Additionally, the directory structure made available by the ftp daemon or the
    http daemon should occupy its own partition(s). This permits it (or them) to be
    mounted with as ro (read-only). If one server provides both ftp and http services,
    the partition on which the data are stored should be shared. This facilitates
    the configuration of a chrooted environment, and so on.


    +   2. The exception is when not all disks with swap partitions are during booting.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# NFS Server Partitions


    The directories to be served over NFS should be on partitions separate from the
    operating system. This makes backing them up simpler. Better yet, the exported
    directories and the operating system should be on separate disks. The use of RAID
    for the exported partitions is highly recommended—less so for the operating system.


    Recent implementations of NFS permit the export of directories spanning multiple
    partitions, as well as the export of directories that are less a complete partition.
    However, we recommend that directories belonging to distinct units be kept on
    separate partitions. Doing so avoids contention and simplifies the issue of whom
    to bill for an upgrade.


    # Samba Server Partitions


    With NFS, directories that are to be exported using Samba should be kept on partitions
    separate from the operating system, and better yet on separate disks. The use
    of RAID for the exported partitions is recommended. Because the operating system
    should be quickly rebuildable from packages, it has less need for RAID.


    Home directories and others that need to grow and belong to particular departments,
    or cost centers should be kept on separate partitions. When home directories fill,
    it is important to be able to tell the department that they need to either clean
    up their files or pay for more disk space. Do not give them the opportunity to
    blame another department sharing the partition.


    # News Server Partitions


    News servers process transient data of low-to-moderate value. The news spool can
    be very large, and access to it may need to be speedy. It is generally not backed
    up, but it should definitely be kept on its own partition, and it probably should
    be spread over several partitions.


    The /var/spool/news partition(s) should, ideally, be kept on disks separate from
    the operating system. This will help performance, and, if a disk for the news
    spool fails, the replacement will only need to be partitioned. Also, because news
    spools contain very large numbers of small files, the ratio of inodes to disk
    space should be three or four times that for typical filesystems.


    # Database Server Partitions


    The partitioning of database servers should be planned in cooperation with the
    database administrators. Most large databases should be installed with several
    filesystem partitions spread over multiple disks, and often, with one or more
    raw partitions that host the databases.


    Additionally, ample space should be reserved on either /var or /var/log for log
    files.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Application Server Partitions


    Application servers run software that is usually mission-critical and often developed
    in-house. In this, this software performs core functions of the business. In many
    cases, if one of these servers stops working, part or all of the company stops
    doing business.\ application that the server runs is normally located in either
    /opt or /usr/local. Whichever of these is chosen should be on its own partition,
    because the space required is likely to grow with each revision. Also ensure that
    sufficient space is available to store multiple copies of the application to facilitate
    upgrades and rollbacks.


    # Generalizing Server Partitions


    A generalized server partition layout should be developed, both to enable single
    machines to provide multiple services and to facilitate maintenance of the kickoff
    server.

    The generalized server should have separate partitions, as shown in Table 14.1.
    The suggestions therein should be adapted in accordance with local requirements.


    Table 14.1 Possible partitions for a generalized server


    | Partition | Size | Description |

    | --- | --- | --- |

    | / | 100MB | The / partition may contain the /bin'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'one or more partitions will need to be larger than the suggested minimum size
    listed. Sometimes, additional partitions will be required to further divide the
    filesystem. System administrators at each site will have to make these judgments
    based on an understanding of the issues we have discussed, on previous experience,
    and often on trial and error.


    # Conclusion


    Although we''ve given some examples of server and client profiles, and some guidelines
    for combining servers on multi-function servers, it is vital for each organization
    to define its own. It may be difficult to enforce a policy that all systems conform
    to defined profiles. However, when the majority of systems matches, it makes the
    system administrator''s job much easier. That increases the system administrator''s
    capacity and results in fewer errors.


    Using profiles is a bit like following the principles of object-oriented programming:
    each system is an "instantiation" of the profile (class). There are analogues
    to "inheritance" and "multiple inheritance" (a generalized server profile inherits
    from intranet web, DNS caching, Samba, and other servers). System administrators
    who use system profiles wisely and consistently will enjoy increased productivity,
    reduced stress, and perhaps even some fun setting them up.


    # Further Reading


    +   - Sun Performance and Tuning, Adrian Cockcroft, 1995

