  md: '# lpq


    The lpq command checks the spool area and reports on the print jobs that it finds.
    The job numbers reported by lpq are required to kill a print job using lpr.


    The printer to check may be specified using the -P option, as lpr. If it is not
    specified, the queue for the default printer is checked—the printer defined by
    the PR environment variable, or lp if undefined. The -l option provides the information
    in long


    form.


    # lprm


    The lprm command removes print jobs from a queue. As with other print commands,
    the printer is specified using the -P option; otherwise the default printer is
    assumed. One or more numeric arguments specified on the command line are interpreted
    as job numbers. The number of a job in the print queue can be learned using the
    lpq command. Arguments containing non-numeric characters are interpreted as user
    ids whose jobs are to be removed from the queue.


    # lpc


    All other administrative tasks relating to existing printers are performed by
    the lpc command, which takes a variety of command options. Alternatively, lpc
    can be invoked without options, in which case it runs interactively, accepting
    commands at a prompt of its own.


    A system administrator can use lpc to stop and start printers and to enable and
    disable queues. Unfortunately, lpc suffers from a number of commands with similar
    names that perform similar actions. Also, it can only control the queues on the
    local host—no provision is made to control remote print queues.


    lpc accepts a -l command that is not particularly helpful. Most of the other commands
    take a single argument, the name of a printer or the -a all keyword. (Printers
    should never be named all.)


    The other commands are described in Table 19.1.


    Because lpc is notoriously unreliable, its use is less likely to resolve a problem
    than is a complete restart of the printing system. The commands


    ```

    /etc/rc.init.d/lpd stop

    /etc/rc.init.d/lpd start

    ```


    can be used. As with most other daemons, running the command


    ```

    tail -f /var/log/messages

    ```


    in another window or on another virtual console before issuing these commands
    is a good way to see error messages from the process.'
