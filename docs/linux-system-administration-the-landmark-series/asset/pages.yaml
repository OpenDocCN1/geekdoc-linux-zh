    # ### Linux Kernel Versions

    LINUX kernels have a three-part version number. The first part is the major version
    number, the second part is the minor version number, and the third part is the
    revision number. Kernels with even minor version numbers are officially stable
    and suitable for production use. Kernels with odd minor version numbers are experimental
    and likely to cause serious problems in production environments. While development
    progresses with an odd-numbered kernel series that incorporates new features,
    the even-numbered series is updated to fix bugs and support new hardware.


    When a developmental kernel series attains the goals set for it, a feature freeze
    is declared, and it is revised as bugs are fixed, much like with a stable kernel
    series. When the kernel appears to be stable, its minor version number is increased
    by one (or set to zero when the major version number is increased by one), and
    it becomes the first of a new stable kernel series. Shortly afterwards, a experimental
    kernel series begins.


    This chapter covers the 2.x series of kernels, because it is the current stable
    series of this writing. Millions of computers are still running 2.x kernels, but
    most are being upgraded. The 2.1x series is not in use, because it evolved into
    2.2x. The 2.3x series are of great interest to kernel developers, but not yet
    to set system administrators. Eventually, the 2.3x kernels will evolve into 2.4x,
    at which time system administrators will need to learn about them.


