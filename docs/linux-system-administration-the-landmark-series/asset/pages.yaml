    # Assumption of Responsibilities


    Taking over the administration of a new set of systems can be a scary experience.
    Ideally you''ll work with the system administrator who initially set up this system—or
    who has used and managed it awhile. Sometimes you may be forced to take over a
    system completely—with little or no support from the previous system administrator.


    In the worst case you''ll be taking over a system that has not been properly managed—and
    one where your predecessor left on hostile terms. In these cases you''ll be faced
    with the very real possibility that your predecessor has left backdoors and/or
    logic bombs on one or more systems, which we will discuss further in Chapter 8,
    “Enforcing Security.”


    # Your Organization’s Requirements


    What does your boss (or prospective boss) expect from you? How does he define
    system administration? As we''ve discussed, this term covers a range of jobs and
    titles that mean different things to different organizations.


    Requirements analysis is about answering these questions and many more like them.
    Typically, requirements analysis is studied by programmers and engineers in the
    context of product design. It''s unfortunate that the subject isn''t discussed
    more broadly. At its core it is simply a matter of clarifying problems at hand.
    In other words, it is making sure that you really understand the problems before
    committing time and resources to misguided effort.


    The usual product of a requirements analysis process is a manufacturing requirements
    document or a product specification. This is essentially a set of criteria by
    which management can determine the extent to which the program or product that''s
    delivered matches what they asked for.'
