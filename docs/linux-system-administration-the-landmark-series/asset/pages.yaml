    # 4


    # Capacity Planning


    RUNNING OUT OF STEAM IS A DISASTER. If users are suddenly complaining about system
    response time, or if they are unable to complete their work due to a lack of disk
    space, then their system administrators have failed.


    Our prime directive emphasizes the “availability of resources” to remind us that
    just maintaining existing systems is not enough. As an organization grows and
    changes, its resource utilization generally increases. We have already seen the
    difference between resources and systems—and have ensured (through recovery planning)
    that the current set of resources can be readily restored after various disasters.


    Capacity planning ensures that resources will remain sufficient to meet future
    needs. It is the process of measuring and monitoring utilization of each resource,
    managing and possibly budgeting the consumption of those resources, and recommending
    upgrades, additions, and enhancements. As in recovery planning, we are concerned
    with a whole range of resources: CPU cycles, memory, disk space, local and gateway
    bandwidth, and even intangibles like IP addresses and UID space.


    Capacity planning ties back into requirements analysis. We must have a list of
    resources of interest to us, and we must have priorities among them. Although
    this could be done rigorously, with advanced metrics, graphs, and statistical
    analyses, most system'
