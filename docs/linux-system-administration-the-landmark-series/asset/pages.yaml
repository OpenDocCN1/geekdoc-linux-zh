  md: '# NFS Server Processes


    The server side of NFS is also based on RPC, so the port mapper must also be running
    on each server. In addition, user-level processes are required. rpc.statd supports
    the NFS lock manager, while rpc.quota deals with NFS disk quotas. The rpc.mount
    handles NFS mount requests. Finally, rpc.nfsd notifies the kernel to start NFS
    file requests. These processes are started by the /etc/rc.d/nfs script during
    system boot. This script also facilitates the on-the-fly administration with several
    useful options: start, stop, status, restart, and reload.


    # NFS and File Locking


    NFS file locking is supported in the Linux kernel by means of rpc.statd. Note
    that support for locking has always been fragile and may not stand up to the rigors
    of a production environment. The problems are design issues and are not likely
    to be resolved. If NFS file locking is needed, try it. It work fine for simple
    cases and lower volumes. If problems arise, try to find another solution.


    # The NFS Stateless Model


    A key concept behind the design of NFS is that it is (mostly) stateless, restart.
    The primary benefit of this approach is that there are no complex protocols for
    restart and recovery. The disadvantage is that when a server crashes or becomes
    unavailable, processes get stuck in the wait state (the ps(1) man page) and will
    not respond to signals. When NFS server is restored, the system calls complete
    normally (with the exceptions noted below) and processes resume where they left
    off. If the system administrators or users have been trying to kill these processes,
    the signals will be received after the problem has been resolved! Once the administrator
    becomes familiar with this behavior model, many tragedies can be avoided by simply
    taking no action until the NFS server or network recovers.


    Two mount options modify this behavior. The first option is the keyword soft,
    which causes NFS file operations to return failure codes after a major timeout.
    A major timeout occurs after retransries have failed. By default the number is
    3, but can be specified as a mount option. The soft mount option should be used
    with extreme caution, as it can lead to data loss. The second mount option is
    the keyword intr, which allows signals to be received during major timeouts. The
    intr is far better because it allows the system administrator to decide whether
    intervention is needed, rather than automatically returning error. These options
    and many others are documented in the nfs(5) man page.


    If the NFS server has lost data or will be down for a long time, then a more aggressive
    approach is wanted. What is done at this depends on the length


    +   1. 2.0 (and earlier) kernels do not support NFS file locking.'
