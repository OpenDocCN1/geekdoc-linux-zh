  md: 'Securing Systems


    # Passwords and Passphrases


    The traditional UNIX password hashing algorithm is no longer secure because the
    computing power available to generate valid hashes has rendered it obsolete. In
    fact, the very concept of the password has rendered obsolete. One should think
    in terms of passphrases of at least 12 to 20 characters. The MD5 hashing algorithm
    should be used for every computing environment that contains any valuable or sensitive
    data. To enable MD5 passphrases, use the `passwd` command.


    A good passphrase must satisfy two criteria: it must be unfeasible to guess (even
    with the power of cryptanalysis tools), and it must be easy for the user to remember.
    Prior to MD5 passphrases, this was difficult to achieve because of the eight-character
    length limitation. To be difficult to guess, an eight-character password had to
    include lowercase, uppercase letters, numerals, and punctuation. Such passwords
    are rarely easy to remember. One trick for composing easy-to-remember passwords
    or passphrases that meet this criteria is to condense an easy to remember phrase.
    For example, “Mary had a little lamb” could be condensed to “Mah1!” without making
    it too difficult to remember. Reversing it to “!1llahM” makes it a bit more difficult
    to guess, at the expense of being a bit more difficult to remember. For course,
    one should not use this particular example.


    Each time a new user is added, an initial passphrase must be set. In cases such
    as schools, where many new accounts must be created at the same time and there
    is little at, it may safe to use each user''s date of birth as the initial passphrase.
    If this is done, the authentication mechanism must be configured to require the
    passphrase to be changed the first time user logs in. In other cases, a system
    administrator could generate a random passphrase that is then conveyed to the
    user. This also requires that the user be forced to change the passphrase the
    first time he logs in. One case does not require the passphrase to be changed
    immediately is when a system administrator can sit down with the user and let
    the user type the passphrase directly as the new account is created.


    Regardless of how initial passphrases are chosen, they must be tested regularly
    or continuously. The system administrators should attempt to crack all passphrases
    in the NIS maps. In large organizations, it might be appropriate to dedicate one
    system to this task. The system used might be one that has been recently retired
    from other duties. In some environments, it might be reasonable to require the
    department of any user whose password is cracked to pay a penalty to be used for
    improved security. Such incentives are often effective enforcement mechanisms.


    # File Permissions


    The security of a UNIX system depends on the correctness and security of the file
    permissions and ownership present on the system. When configuring systems and
    defining system profiles, it is essential that the file system is not compromised.
    For instance, the `/tmp` directory is compromised if the sticky bit is lost. In
    general, most'
