  md: '# Booting into Single-User Mode


    If the system has an alternative root filesystem and the root password to that
    is remembered, then boot from it.


    Otherwise, interrupt the normal boot sequence to force into single-user mode.
    The usual way to do this is to use the single option, which is a normal request
    to start the system in single user mode. (Details may differ for systems that
    aren''t using LILO. See the documentation if another bootloader is in.) For example,
    at the LILO: prompt, type


    ```

    LILO: linux single

    ```


    to load the linux stanza and pass its copy of it the single option. Some installations
    have a login command configured to require the root password for single-user access.
    This feature, if enabled, is enforced by it. (The directive to use LILO''s boot
    sequence with scroll Lock and add the parameter init=bin/sh to the boot/command
    line. This bypasses the normal execution of it and just starts a shell.


    ```

    LILO: linux init=/bin/sh

    ```


    In both of these examples the stanza name is linux. Pressing the Tab key to the
    LILO prompt displays a list of all boot boasts. It''s possible that the system
    has passwords set in the /etc/lilo.conf file can be used to require a password
    to boot a particular configuration (to prevent users from getting into a particular
    MS-DOS or LINUX configuration on personal documentation, and so.). Or the configuration
    can be marked as “restricted”—meaning they can be booted without a password—but
    a password is required to override any of the boot parameters for stanza. (See
    the lilo(8) man page for details on these options.)


    Luckily, password and restriction features of LILO are rarely used. They are not
    always needed for systems in a data center. However, if lack of a password prevents
    the system from being booted into single-user mode, move to “Plan B”—the boot
    diskette.


    Boot into a shell boot/rescue diskette or a bootable CD-ROM, such as an installation
    CD-ROM. The toolkit of every Linux system administrator should include a boot/root
    floppy (possibly several). See Chapter 3, “Recovery Planning,” for a full discussion
    on creating and maintaining rescue disks.


    # Repairing the Root Password


    Having successfully booted into a shell, mount the root filesystem (if you booted
    from rescue floppy or CD-ROM) or remount it in read-write mode (if you used the
    init=/sbin/sh options).


    +   1. The very popular “Tom’s boot/root diskette may be found at http://www.toms.net/rb/
    along with pointers to other rescue floppy and “micro-LINUX” distributions.'
