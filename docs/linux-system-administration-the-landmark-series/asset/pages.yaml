    # # 6


    # # Network Computing


    A HEALTHY NETWORK COMPUTING ENVIRONMENT resembles a healthy living organism: it
    is resilient to the failure of individual components, it can adapt to rapid changes
    in the environment, and its competitive effectiveness is greater than the sum
    of its parts.


    When computing environments attain this state, several concrete results are achieved.
    Data are always available to those who are intended to have access and are always
    unavailable to those who are not. Redundancy is built into the environment so
    that the failure of one component or service does not affect other components
    or services. Other machines continue to provide the affected service so the failure
    is invisible to end users. Finally, the environment lends itself to collaboration,
    because an arbitrary group of functionally identical computers can be chosen to
    contribute to a particular task. They have the same configuration, the same filesystem
    hierarchy, the same set of shared user accounts, and equivalent network connectivity.


    Purchasing 100 copies of Windows NT or Linux and 100 computers does not purchase
    a network computing environment. It purchases some of the elements of network
    computing. An overall systems design is still needed. In this chapter, as well
    as in Chapters 14 and 15, "System Profiles" and "Automated Installation and Upgrade,"
    we present the concepts and practices needed to complete an architecture. It is
    our hope'
  merge: -1
