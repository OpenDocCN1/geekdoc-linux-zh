  md: '32


    Chapter 3 Recovery Planning


    Getting all of the IRQs and other settings right is often a nuisance in the first
    place or a series of nuisances encountered over several months as the system evolves.
    Good documentation precludes the need to duplicate all of that during an emergency.


    Therefore, it is a good idea to keep a summary of each system''s hardware and
    software configuration hand. Then, if the operating system needs to be reinstalled
    from scratch, you''ll know what kind of video card is installed and what selection
    it requires in the xconfigurator menu; where SCSI is installed and which kernel,
    drivers, or modules need to be enabled to use it; and so on.


    We recommend keeping an online set of notes in /etc/README (or /etc/README.$hostname),
    as the case may be and printing two copies: one for the regular filing system,
    and one to tape the case (possibly with an extra boot disk).


    This README file should also contain information about software configuration,
    especially any deviations from the organization''s standards, as well as information
    such as who should be contacted, who built the system, and who are responsible
    for it and how they may be, what systems depend on this one and what systems this
    depends, during times it may be taken down for maintenance, and who needs to be
    notified beforehand. Additional information may be needed by some sites.


    It is important to keep the README up-to-date. Another good idea is to require
    that changes be logged with a timestamp and the name of the system administrator
    who made the change, along with the version and location of the package that can
    restore the change if the system needs to be rebuilt. Changes are usually made
    for good reasons, the reasons are not always immediately obvious to other system
    administrators.


    # Hint: Keep a Printed Partition Table Handy


    One lifesaver for a damaged partition table is to have a printout of what it means
    to look like for each system. Then, one can use the LINUX disk command to rebuild
    the partition from scratch and run fdisk16 to rebuild the bootloader (the "other
    part" of a master boot record). Often one can recover a non-booting system with
    data loss and no need to restore from backups by simply rebuilding the MBR.


    # Risk Assessment


    The first step to before planning for disaster recovery is to list the threats.
    Many sorts of disasters may befall a system administrator. Try to think of as
    many as you can, and then survey your users to find all the things they could
    go wrong. They will come up with some that you overlooked. We discuss some common
    disasters, which you may want to add to your list if your survey didn''t produce
    them. Then you''ll need to assess the risks posed by all the conceivable disasters
    in terms of likelihood and consequences in order to prioritize them. Once your
    management has approved a prioritized list of disasters for which you need to
    be prepared, you can examine recovery options and plan recovery strategies.'
