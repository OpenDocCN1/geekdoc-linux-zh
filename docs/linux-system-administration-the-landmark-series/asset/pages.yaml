  md: '# Kernel Boot Actions


    Once an image of the kernel has been loaded into memory, execution is passed to
    the kernel.


    The kernel begins by initializing the virtual memory subsystem and the task scheduler.
    Next, it initializes the timer subsystem and parses command-line options. The
    module system and various kernel buffers and caches are then initialized. If a
    ramdisk for loading modules has been specified, LILO has already loaded it into
    memory. The kernel will verify that it has not overwritten the image and then
    copy it to a ramdisk (/dev/ram0). The ramdisk will be mounted as the root filesystem.
    Later in the boot sequence the new root filesystem is then examined for a /linux
    file, and this is executed. The /linux file is normally a shell script that runs
    insmod to load drivers needed to mount the root filesystem.


    Finally, the last step of the kernel boot sequence is to create the process context
    for init and begin execution.


    # init


    init is the ancestor of all processes. Its purpose is to span the core processes
    needed by the system. There are two flavors of init: BSD and System V. Most Linux
    distributions use the System V version of init, which parses the /etc/initabb
    file. initabb contains one entry per line, each with four colon-delimited fields.
    The first field is a tag of one to four characters that uniquely identifies the
    entry. The second field lists the runlevels associated with this initabb entry.
    The third field specifies an action keyword that controls the behavior of the
    entry. The fourth field is the process—the commands to be executed for this initabb
    along with its parameters. This is a typical initabb entry:


    ```

    13:3:wait:/etc/rc.d/3

    ```


    The action (third) field may contain any of the following values:


    boot. The process will be executed once at system boot. The runlevel is ignored.

    bootwait. The process will be executed while the init process waits for processing
    of the initial runlevel to complete. The runlevel is ignored.


    ctrlaltdel. The process will be executed when the init process receives the INT
    signal. This is typically when the Ctrl-Alt-Delete key combination is pressed
    at the system console.


    +   6. The BSD-style init invokes a central initialization script /etc/rc. The
    runlevel is passed as an argument'
