  md: "For a standard, HP LaserJet expects text files to include a carriage return\
    \ at the end of each line. Raw text from a Unix file will-step to the right, printing\
    \ off the right side of the page. This is the natural result of line feeds being\
    \ applied without a balancing carriage return to bring the print-head to the beginning\
    \ of the line. The following example includes a filter to correct the problem:\n\
    \n```\nlp[generic:\n:sd=/var/spool/lp0:rm=192.168.64.22:rp=lp:sh:\n:pw=80:pl=60:of=/usr/local/bin/fixrlf\n\
    ```\n\nThe Perl script /usr/local/bin/fixrlf adds a carriage return:\n\n```\n\
    #!/usr/bin/perl -wp\ns/((^\\r)$/$r/\n```\n\nThe same script written in Tcl looks\
    \ like this:\n\n```\n#!/usr/bin/tcl\n## James T. Dennis. <jim@starshine.org>\n\
    ## filter to convert line terminations into MS-DOS compatible CRLF\n## sequences.\
    \ (Also useful as a printcap filter)\n```\n\n```\nfconfigure -translation \"crlf\"\
    \nwhile { [ -e stdin ]; {\n  gets stdin line\n  puts stdout $line\n}\n```\n\n\
    The example script sets /usr/local/bin/fixrlf as the of filter. All non-blank\
    \ lines in the data file are converted into lines ending with ASCII 13 (carriage\
    \ return) followed by the standard Unix ASCII 10 (line feed). Binary content should\
    \ not be sent through this filter because it would be ruined by bytes added to\
    \ the data stream.\n\nA more intelligent filter only makes changes that are appropriate\
    \ to the current time. Examples include apsfilter and encrypt, which only make\
    \ changes that are appropriate to the type of content flowing through to the printer.\
    \ There are also filters specific to particular printer models.³\n\nIt could be\
    \ useful to have your printer track how it is used, by whom, how much its pages\
    \ count, and so on. With the af (accounting file) set, the filters above (except\
