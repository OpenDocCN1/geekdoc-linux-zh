  md: '# Chapter 3 Recovery Planning


    To reduce the likelihood of administrator error, it is important when making any
    sort of change to a production system that there is a plan for testing, deployment,
    and regression. You should have the plan checked by others and then follow the
    plan.


    # Hardware Failure


    Hardware failure is another common cause of crises. The best defenses against
    hardware failure are redundant systems and having spares on hand, along with a
    practiced procedure for replacing the failed hardware. When a hard disk fails,
    the procedure will sometimes be complex, and should always be well-documented.


    # Utility Outages


    Somewhere in the world, utilities such as power and telecommunication are less
    than perfectly reliable. In some places reliability is worse than in others. But
    one must always consider the impact that a utility outage may have on the business,
    and what may be done in preparation and response.


    Power outages generally shut down LINUX systems uncleanly. In least in the case
    of servers, many organizations will have enough UPS capacity to perform a clean
    shutdown. Many organizations will have emergency power from their own generators,
    with batteries to handle the transition. This emergency power is not without cost,
    so determine which systems are critical to the operation of the business, and
    see that continuous power is available to them.


    Many data centers have separate power sources (fed from different utility substations),
    with cabinets having a power strip from each source. One runs the left side, and
    the other runs the right. Systems with redundant power supplies, as routers and
    major servers, are plugged into each. Frequently, at least one of the two power
    sources will be backed up by generators and batteries, because utility outages
    often affect more than one substation.


    An interruption in external data communications is not as catastrophic as a loss
    of electricity, but it can shut down operations for some businesses and impair
    the operations of others. If lost telecom would cost the business to justify it,
    redundancy is called for. One may order lines from different demarcation points
    in the building, running along different trenches, to telecom central offices.
    All of these costs money and is fundamentally a business decision. The role of
    the system administrator is to help document risks, options, and their costs so
    that management may make an informed decision.


    # Software Defects


    Many disasters are caused by software defects, particularly with closed, proprietary
    software. These disasters involve the loss of data, so a system administrator
    can protect against them (to a degree) by ensuring copies of the data are available
    somewhere'
