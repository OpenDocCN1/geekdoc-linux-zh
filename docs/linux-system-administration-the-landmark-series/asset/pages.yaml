    # "gcdwd: cannot access parent directories"


    This happens when a process (usually a privileged or SUID program) has changed
    into a restricted-access directory and then dropped its privileges or performed
    a setuid() or getgid() to an identity that has no access to one of the permissions
    along the path to the current working directory.


    Typically, the unprivileged process cannot use ls or echo * in this situation.
    The child process cannot open any files or directories below the current-one—though
    it can access outside of the current tree (subject to its normal permissions descriptions).


    One of the most likely cases of this is to have a directory leading to the home
    directories set to the wrong permissions for some of the users listed thereunder.
    If you set /home to be 771 (world executable, but not world readable), then you
