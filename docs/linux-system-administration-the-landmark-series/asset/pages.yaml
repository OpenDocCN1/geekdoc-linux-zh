  md: 'Theoretically, policies are handed down by management to be implemented by
    the administrative staff. A manager or director gets (or negotiates) a set of
    directives/or objectives and translates these into requirements or policies. Ideally,
    managers also act as mediators to provide their IT department with the necessary
    resources to do the work—and as liaison to other managers to deal with interdepartmental
    issues.


    Typically the system administrator and his manager must negotiate a service-level
    agreement or specification. This might be very informal, or it could be in the
    form of quarterly/or annual objectives. A properly agreed-upon service specification
    is of great benefit to system administrators and to management as it helps the
    system administrators prioritize conflicting resolutions, and should provide a
    reasonably unambiguous reference as new and unexpected goals.


    The nature of IT departments may make them a scapegoat for other departments.
    Frequently departmental managers will engage in “turf wars” and “job dodging.”
    The debates and negotiations that follow from these are always unnecessary—the
    distribution of responsibilities genuinely differ from one organization to another
    and changes over time.


    A good manager will deal with these issues while allowing the system administrator
    to focus on more technical and specific issues. A good system administrator will
    understand these issues and account for them in his recommendations and planning.


    As we see in Chapter 2, identifying the involved parties, their priorities, and
    the lines of authority throughout a vital part of the requirements analysis process.
    That is crucial to the work of everyone in an IT department. Less obvious is the
    work that goes into accomplishing these tasks.


    A big part of being a good system administrator is knowing what is possible and
    what is being done by others in the field. In smaller organizations, example,
    system administrators who do not know about IP masking or proxying may be constrained
    in their ability to consider and offer options. System administrators in large
    organizations who do not know about DNS round-robin load distribution and who
    do not understand the principles underlying a VLAN (virtual LAN), may be constrained
    similarly:


    Thus, the system administrator must be a forager, periodically wandering a number
    of fields surrounding his “core competency” to find the fruits and veggies that
    are growing and ripening whereabouts. He must also be a hunter, describing the
    user’s and management’s desires in terms that are likely to find matches in Internet
    search engines and generate responses from the mailing lists and newsletters.


    # Overlapping Duties


    Experience has shown that system administrators are rarely dedicated to a specific
    platform. Most sites use several different operating systems for system administrators
    supporting desktop systems running Windows or MacOS.


    In particular, many system administrators have to manage routers, telephone switches,
    modem pools, tape libraries, specialized fileser (like those from Network Appliance
    and Auspex), and other equipment that is often not thought of as being a “computer.”'
