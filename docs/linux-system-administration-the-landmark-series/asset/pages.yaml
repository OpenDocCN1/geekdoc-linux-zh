- img_proc: true
  md: '# The Shells


    Shells are command interpreters that are intended primarily to be used interactively
    by users and system administrators. The basic shells provide a small set of built-in
    commands that are implemented within the shell itself. The rest of the commands
    used by the shell are actually programs stored in /bin and /usr/bin directories
    or others in $PATH.


    The bash, ash, and tsh shells are present on most systems. Other shells may be
    installed as well, such as ksh or zsh. The default shell on Linux systems is dash.


    Shells can be used interactively or can execute stored programs called scripts.
    Shell scripts can be written using any text editor, such as vi or emacs. The real
    power of the shell programming environment is not the capability of any single
    tool (in fact, most are fairly simple) but the ability to combine simple commands
    into powerful constructs. Commands can be combined using pipes and I/O redirection.
    For example, to find processes that are owned by user root, one can enter the
    following:


    ```

    ps aux | awk ''$1 - "root" ( print )

    ```


    The pipe operator (represented by the | character) redirects the output of the
    ps command to the input of the awk command. Now, to look root''s processes sorted
    by memory size, we add sort to the pipeline:


    ```

    ps aux | awk ''$1 - "root" ( print )'' | sort +3n

    ```


    Of course, we missed the first few processes because they scrolled past the top
    of the terminal window. We add the more command to the end of the pipeline to
    display one screen at a time:


    ```

    ps aux | awk ''$1 - "root" ( print )'' | sort +3n | more

    ```


    In this manner, very powerful expressions can be created from the simple utilities
    provided with LINUX.


    # Common Utilities


    A number of intrinsic UNIX utilities are always available within shell scripts.
    The expr command is used for simple math and pattern matching. The test command
    is used for conditional evaluation; it can be used to determine information about
    files and to compare strings or numbers. The stream editor sed is used to edit
    streams in an automated fashion. The grep utility prints lines that match a pattern.
    The awk programming language is used for basic data processing, such as summing
    fields of input or extracting fields from lines of tabular data. The sort utility
    can be used to sort lines of data. Typically, dozens of other utilities are invoked
    by a shell interpreter to perform most of a shell program''s work.'
