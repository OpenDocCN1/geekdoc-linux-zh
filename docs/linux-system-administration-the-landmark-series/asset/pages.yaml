    Generally, a username may be used to log in to one or more systems, although a
    few

    called pseudo-logins, cannot log in to any system. A username typically belongs
    to a

    s person, and most people have only one username (in any particular organization).

    root is an obvious exception, because more than one person uses root on most systems,

    and everyone who uses root should also have a personal username.


    Just as citizens live best when governments leave them free to make their own

    decisions, users work best when system administrators leave them to choose from

    ownown usernames. Some system administrators have tried formal schemes for assigning\usernames,
    such as the first two letters of the first name followed by the first five letters

    of the last name. Every such scheme results in clashes, which are usually

    resolved by something like appending a numeral to the username joined

    organization layer. Even without complications, these schemes do little to

    facilitate real names to usernames and are detrimental to morale.


    Each user has a corresponding password, the hash of which is also stored in /etc/passwd,

    /etc/shadow, or NIS. Each user also has other attributes, such as a default shell.


    # Pseudo-Logins


    Pseudo-logins exist so that processes can run with the uid of the pseudo-login
    without

    y user being able to log in to any machine using the corresponding username. Some

    of pseudo-logins found on most LINUX systems include bin, daemon, adm, lp, mail,

    news, uucp, and nobody.


    Additional pseudo-logins may be created if necessary. Some system administrators

    create pseudo-logins with a username that matches a command to be executed as
    its

    shell. Examples include hostname, ifconfig, netstat, and who. Security concerns
    should

    be kept in mind any time a pseudo-login is to be created, especially if attempts
    to log

    in using that username will result in the execution of a command. It is important
    to

    document the reason for creating each pseudo-login.


    # Groups and gids


    Groups provide a mechanism for aggregating users so that permissions can be repeatedly

    grant to a group of users without need to enumerate the members each time.

    The passwd file or map contain a gid field. This is a vestige of Unix limited

    e user to membership in only one group at any given time. Information about the

    groups to which a user belongs is now derived from the group file or map.


    The group file or map contains a list of entries, one for each group. Each entry
    contains

    four fields: group name, passwd, gid, and a list of the members.


    +   1. glibc raises the permissible number of characters in a uid from 8 to 31.
    However, some applications

    remain limited to 8 characters, so the transition may take some time.'
