    # 21

    Managing NIS


    THE NETWORK INFORMATION SYSTEM (NIS) is a network service for sharing common system
    information. The data commonly managed by NIS include user password and group
    information, host-to-IP address mappings, mail aliases, and other system data
    that should be common among systems. By generalizing the administration of these
    data, NIS enables the system administrator to create a more homogeneous environment,
    while at the same time simplifying the task of updating and distributing these
    data.


    NIS was created by Sun Microystems for SunOS. It was originally known as Yellow
    Pages (YP), but Sun had to change the name as a result of a lawsuit brought by
    British Telecom. They officially renamed YP to NIS, but they left vestiges of
    the YP naming conventions within the system. NIS is implemented using the ONC
    RPC (Open Network Computing Remote Call) networking protocol as the underlying
    mechanism.


    Data sets in NIS are represented as one or more maps. NIS maps consist of key/value
    pairs arranged in accordance with the various system library functions expect
    to access the data. For instance, two maps represent hostname information in NIS:
    hosts.byname and hosts.byaddr. These maps are a direct reflection of how hosts
    are accessed by the system library functions gethostbyname(3) and gethostbyaddr(3).
    Given a hostname,'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'gethostbyname(3) yields an IP address, and given an IP address, gethostbyaddr(3)
    returns a host name.


    All systems that share the NIS database are members of the NIS domain. Within
    a domain, a system can have one of three roles: client, slave server, or master
    server.


    Master. The system is the source of NIS data for the domain. All updates to NIS
    data occur on this host.


    Slave. The system maintains a copy of the master''s database. It is updated when
    data is changed on the master.


    Client. The system connects to a NIS slave or master server to obtain NIS data.


    NIS domains differ significantly from DNS domains. Whereas DNS domains specify
    nodes on a graph, NIS domains are singular entities. There is no hierarchical
    relationship between two NIS domains, even if a naming convention might suggest
    that there is. In fact, there are no relationships between any two NIS domains
    at all. For example, it is possible to have two NIS domains with the names subdomain.domain.com
    and domain.com. These domains will not interact with each other in any way whatsoever.
    They could be named apple and orange and function identically.


    This limits the scalability of NIS. Although there are those who would push NIS
    to its limit, it is best not to include more than approximately a thousand machines
    in a NIS domain.


    # NIS Client Processes


    The NIS client process is ybind. Since NIS is an RPC-based system, the portmap
    process must also be running on each client for NIS. The ybind process initializes
    itself by parsing /etc/yp.conf for how to find a server for its given NIS domain.
    If the domain is not present in /etc/yp.conf or the file does not exist, the ybind
    process broadcasts to find a server. The broadcast mechanism will only find NIS
    servers on the IP subnet as the client. Once the client successfully binds to
    a server, it periodically checks the server and restarts the whole binding process
    if the NIS server becomes unavailable.


    The ybind process also expects the NIS domain name to be set. RedHat Linux store
    the NIS domain name in /etc/sysconfig/network as the variable NISDOMAIN. The domain
    name is set with the hostname command at system startup. This occurs in the /etc/rc.sysconfig
    script. Unlike many other Unix systems, merely setting the NIS domain name does
    not configure a Linux system to be a NIS client. The ybind daemon must be enabled
    via the chconfig(8) command. For those who prefer a visual front end, the tksys,
    ntsys, and linuxconf programs offer graphical configuration of ybind (and other
    daemons).'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# NIS Server Processes


    NIS provides the ypinit command to simplify the creation of slave and master servers.

    ypinit -m command creates maps from the standard source files stored in the /etc
    directory. It is not advisable to initialize a NIS master with this command if
    the system administrator has placed files in an alternate directory. Instead,
    create the /var/yp/domainname file, where domainname refers to the NIS domain
    name, and create a /var/yp/ypsvers file. Edit the master, supplying the correct
    values for YPSCRDIR and YPPDDDIR, and then (as root) run it in /var/yp.


    Each NIS server runs the ypserver process, which stores the NIS maps in /var/yp/domainname.
    NIS slaves must be initialized with the ypinit -s master command, where master
    is the name or IP address of the NIS. When new NIS slaves are created, it is vital
    that the host be added to the /var/yp/ypsvers file. If it is not added, the new
    slave server will not receive updates. Each NIS server will also be normally configured
    as a NIS client.


    Many also configure slaves with cron jobs to pull maps from the master at periodic
    intervals. Simple cron jobs are distributed with LINUX in the /usr/lib/yp directory.
    The intent is to update the slave server in case where there is a transient failure.
    These may not be necessary for all slaves, particularly not for those where the
    /var/yp/ypsvers file is kept up-to-date.


    A NIS master is similar to a NIS slave but has two additional roles. The first
    is to provide for the maintenance of NIS data, and the second is to distribute
    updated maps to the NIS slave servers. The master also functions identically to
    a slave server in NIS clients may bind to, because it runs the ypserver daemon
    as master.


    # NIS Database Maintenance


    The central file in the maintenance of the NIS maps is /var/yp/Makefile. The system
    administrator simply makes type in the /var/yp directory, and the makefile is
    processed to update NIS. This makefile translates the file representations of
    the NIS database into the NIS maps with the makedbm command. The maps are distributed
    to the slave servers with the ypcommand. The ypcommand itself uses the ypsvers
    map to determine the list of slave servers, the system administrator is highly
    encouraged to keep this database current.


    Another set of processes allows NIS to be updated from any host NIS domain. The
    ypasswd, ypcfn, and ypch commands enable users to update their password, full
    name, or respectively without the intervention of a system administrator. These
    commands communicate with the ypasswd daemon on the master and arrange for an
    automated edit of the password (and possibly shadow) maps, and then a push of
    the updated maps.


    By default, the NIS master generates the NIS maps from the resource files in the
    /etc directory. The NIS maps can be created from data in another location. Popular
    alternate locations are /var/yp/maps and /var/yp/ypsfiles, but these are only'
  merge: -1
