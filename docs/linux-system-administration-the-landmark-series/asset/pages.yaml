    loadable modules Portions of kernel code that have been compiled separately and
    can be loaded during normal operation using probe or insmod.


    LOADLIN.EXE An MS-DOS program that can load a LINUX kernel (stored as a normal
    MS-DOS file) and pass its parameters. It is an alternative to LILO. It is particularly
    helpful for running Linux on a laptop or from some hard drive that the system’s
    BIOS cannot access.


    +   - LOADLIN.EXE (and similar programs for the Windows NT console) can be used
    to launch Linux as though it were an MS-DOS program. It should be noted that this
    is a “one way trip,” and that the only way back to MS-DOS (or Windows 95 or 98
    or Windows NT) is by shutting down Linux and rebooting.


    loop, Endless See loop,


    loop, infinite See loop.


    media set One or more tapes, diskettes, or other backup media that comprise a
    single backup. One normally maintains several media sets per data set. Providing
    alternatives addresses the risk of loss, theft, or corruption of any set. It also
    allows the system administrator to restore older versions of a file in cases where
    the damage to the file was not immediately detected, and the corrupted version
    of the file was backed up.


    meta-data Information about a file rather than in it. This includes the file’s
    ownership, permissions, link count, time stamps (mtime, cime, atime), and any
    attributes and ACLs that might apply to a given file. In some contexts, the filename
    or inode can be considered an element of its meta-data. However, it is convenient
    to think of the meta-data as the contents of the inode, and the data as the contents
    of the blocks (which the inode points to) that are the contents of the file.


    Minix A minimal microkernel operating system with a vaguely Unix-like set of programming
