    justify paging one or more system administrators, even at 2:00 a.m.


    The scripts by which computers monitor another and alert humans when they discover
    a problem are normally run from cron. How frequently they need to be run depend
    on local circumstances but will normally be at least once per hour. More on scripting
    may be found in Chapter 11, "Scripting."


    # Evaluation, Prevention, and Documentation


    It is important for the senior system administrators (perhaps with their managers)
    to periodically review the problems logged in, and statistical reports generated
    from, the incident database. The main purpose of this is to prevent or costly
    troubles that can be obviated by automating (or better automating) a task or of
    tasks. This database should be the principal basis for decisions about which the
    senior system administrators most urgently need to automate.


    Managers of system administrators should also examine the database. This is one
    of the sources available to them about both the quality and quantity of work performed
    by the system administrators. Managers may glean hints about which administrators
    need commendation, training, and discipline. Final action will of course depend
    on a broader review of the evidence.


    As they look through the database, the senior system administrators should also
    be thinking about opportunities to better document procedures so that users and
    junior system administrators can avoid problems in the future. Keep in mind that
    better tools can be de to be preferred over better documentation. But sometimes
    the tools are as good as they can be, and the best course of action is to better
    document a procedure. As the Help Desk gains experience, historical information
    gleaned from the incident database should be used by the system administrators
    to update the system FAQ, as well as to better document procedures for junior
    system administrators.


    # Escalation Plan


    Sometimes a system administrator will be dispatched to solve a problem beyond
    his abilities. When this occurs with an impatient user, it is important that the
    system administrator on the spot know when he should turn. This is a good reason
    why the most junior system administrators should not be sent by themselves to
    help users whose work is mission-critical. For example, if the problem is due
    to an incorrect entry in DNS, the system administrator on the spot should at least
    know that is the nature of the problem, even if he cannot correct it. Then he
