  md: '# Transmission Control Protocol


    The Transmission Control Protocol (TCP) is a high-level protocol for the reliable
    communication of data between two endpoints. TCP is layered on top of IP, so a
    TCP packet contains the IP header, the TCP header, and the TCP data. TCP also
    differs from UDP in that TCP connections are defined by two endpoints, so it is
    the combination of local remote port, local IP address and IP address that distinguishes
    a unique TCP connection. Because TCP is connection oriented, it also contains
    state information. The state of a TCP connection can be viewed via the netstat
    command. Also, the protocol provides flow control mechanisms, which allow it to
    deal with variations in network throughput.


    The design of TCP is robust and much research has gone into refining its retransmission
    and flow control algorithms. Therefore, TCP should be the protocol of choice for
    any application that does not require IP broadcasting or multicasting.


    Here are a few examples of protocols that use TCP to communicate:


    +   * Telnet

    * The File Transfer Protocol (FTP)

    * The Hypertext Transfer Protocol (HTTP)

    * The Network News Transfer Protocol (NNTP)

    * The Post Office Protocol (POP)

    * The Simple Mail Transfer Protocol (SMTP)


    From this short list, it should be obvious that most of the Internet runs over
    TCP.


    # IP Version 6


    Crisis loomed over the Internet in 1990. The 32-bit address space defined by IPv4
    was running out. Every now more pressing was the growth in the size of the routing
    tables of the core Internet routers. If the routing tables continued to grow,
    it did not seem that it would be possible to manufacture routers powerful enough
    to manage the burden. Development of IP version 6 began in 1992 as a response
    to this growing crisis.


    Version 6 of the Internet Protocol was developed to address these problems. IPv6
    uses 128-bit addresses, which create a vast new address space. In addition, IPv6
    addresses the complexity of configuring hosts, which was hindering the rate at
    which IP could be deployed. To their credit, the designers of IPv6 did not improve
    parts of the protocol that already worked well. They reasonably avoided adding
    any complexity to the protocols that would impact the time needed to process a
    packet. The result is that the IPv6 packet structure has been simplified, and
    it is reasonable to expect an IPv6 protocol stack to perform as well or better
    than an IPv4 implementation on the same host.


    While IPv6 was still in development, a solution was engineered to address the
    explosive growth of routing tables in IPv4. Classless Inter Domain Routing (CIDR)
    was developed'
