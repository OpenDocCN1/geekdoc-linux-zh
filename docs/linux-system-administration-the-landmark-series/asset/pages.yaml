    programs into physical memory addresses. The virtual memory manager manages the
    allocation of virtual memory, assigning locations in physical memory or secondary
    storage (swap) as needed.


    At the same time, user programs are presented with a single flat address space
    model that not limited by the size of physical memory, as shown in Figure 10.2.


