    # Managing Access Control


    Another issue, in larger NFS environments, is the management of access control.
    It is a security risk to export writable filesystems such that they can be accessed
    by any host. However, enumerating every NFS client machine in an organization
    may not be feasible. groups of clients that may be granted NFS privileges to simplify
    access management in larger environments. The first mechanism is the use of wildcards.
    If all of a group''s machines (and no others) reside in the same DNS domain, a
    wildcard may be used to specify them. For example, /exports entry would permit
    all systems in subdomain.domain to access work/project2


    ```

    /work/project2 *.subdomain.domain

    ```


    Where NIS is in, netgroups may also be used to specify access lists. The following
    /etc/exports entry would allow all systems in the NIS network myhosts accesses
    to the /work/project3 hierarchy:


    ```

    /work/project3 @myhosts

    ```


    # User Id Mapping


    A security mechanism (and perhaps the only effective one) built into NFS is the
    practice of mapping UID 0 (root) to a user-level. Normally root is mapped to the
    user nobody with a value of -2 (65534). This is the default behavior unless the
    no_root_squash option is specified. Additional options provide a great deal of
    flexibility. The anongid options can be used to set the anonymous user and group
    id, which may be helpful in maintaining compatibility with other UNIX systems.
    The squash_all option can be used to force all users and groups to the anonymous
    value. The squash_g options allow a list of uids or gids to be specified for remapping,
    not just uid/gid 0. These options can be used to provide security by selectively
    removing access to publicly shared areas. One could also use these facilities
    to manage access from PC/NFS, an NFS implementation for Microsoft Windows operating
    systems. A better solution for providing file services to PCs running Microsoft
    Windows is samba(8), which is discussed in Chapter 17, “Network Services."'
