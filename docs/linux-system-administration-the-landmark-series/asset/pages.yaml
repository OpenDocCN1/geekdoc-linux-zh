- img_proc: true
  md: '# Motivations for Scripting


    It then attempts to open a telnet session to that host using username and then
    “interact”—leave the user running interactively with the resulting session.


    This is just the bravest hint of the power offered by the expect scripting language
    and the Tel library which it is built.


    Most distributions of LINUX and expect ship with a few sample expect scripts.
    Two scripts that are particularly useful to many system administrators are autopasswd
    and kibitz. autopasswd automates the setting of new user passwords, such as for
    new school terms. kibitz enables two or more users to collaborate on a single
    shell session—each can see the screen and type commands on a shared shell session.
    kibitz can even support curves/curses programs, such as vi and emacs.


    There are also modules for Perl and Python that implement the core features of
    expect, allowing one to use these languages to spawn programs, expect output from
    them, send input to them, interact with them, and generally automate one’s way
    around those unavoidable programs.


    # Automate


    Many system administration tasks must be performed on a regular basis—mundane
    tasks like logging files, cleaning /tmp directories, and performing nightly backups.
    By automating these tasks, system administrators free themselves to do other work.
    So it is typical for system administrators to script these tasks and have them
    scheduled by cron. The cron facility provides the ability to run programs automatically
    on a specified schedule, relieving system administrators of having to remember
    to perform these tasks. Typically, maintenance jobs are run at night by cron,
    and scripts for these cases, mail the output of the jobs to the system administrators.


    # Regulate


    Abbreviating a list of commands does more than saving time. It regulates the procedure,
    ensuring that the commands will run in the same sequence every time the script
    is invoked and no steps are overlooked.


    As system administrators gain experience with particular scripts, they add various
    sorts of sanity checks, tests, and options—particularly in cases where other users
    and operators may be using them. Such a script regulates the operation, ensuring
    that there is enough disk space for a build, or that temporary files are removed,
    and so on.


    In some cases, it may not be exactly how to script a particular operation—one
    can just prompt skilled users/operators with reminders of what to do, and they
    will know what commands and parameters to provide. For these cases, and early
    prototyping stages of any script, just use simple sequences of echo, read, and
    eval commands to step a user through a process.'
