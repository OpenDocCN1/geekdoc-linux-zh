  md: "# Log File Filtering and Aging\n\nThus, most system administrators write scripts\
    \ or install packages to manage their log files. Log file scripts are easy to\
    \ write and offer a relatively safe way for junior system administrators to learn\
    \ scripting, the loss of some log files is usually not a catastrophe. Here is\
    \ one such script (written in awk):\n\n```\n#!/usr/bin/awk -f\n# filter.log\n\
    # by James T. Dennis\n\n# syntax filter.log patternfile datafile [datafile ...]\n\
    \n# purpose -- trim patterns, listed in the first filename\n# from a series of\
    \ data files (such as /var/adm/messages)\n# the patterns in the patternfile should\
    \ take the form\n# of unlimited (no '/foo/' slashes and no \"foo\" quotes)\n\n\
    # Note: you use a - as the data file parameter\n# if you want to process stdin\
    \ (use this as a filter in a pipe)\n# otherwise this script will not see any input\
    \ from it!\n\nARGIND -- 1 (\n# ugly hack.\n# allows first parameter to be specially\
    \ used as the\n# pattern file and all others to be used as data to\n# be filtered;\
    \ avoids needs to use\n# awk -v patterns=$filename ... syntax.\nif ($0 ~ /^[\\\
    t]*$/) { next } # skip blank lines\n  # also skip lines that start with hash\n\
    \  # to allow comments in the patterns file.\n  if ($0 ~ /^#\\/\\)/) { killpat[++]=$0\
    \ }\n)\n\nARGIND > 1 (\nfor (i in killpat) (\nif($0 ~ killpat[i]) { next })\n\
    )\n\nARGIND > 1 (\nprint FNR \": $0\"\n)\n```\n\nThis script contains only eight\
    \ lines of code. The first block, executed only when this script processes its\
    \ first argument/filename, loads a \"pattern file,\" a list of regular expressions\
    \ (regex) that describe all the innocuous messages. The second and third blocks\
    \ are active for all arguments/filenames after the first. The second block compares\
    \ the current record/line to each pattern, and if a match is found, skips further\
    \ processing of that line and skips to the next record (without printing anything).\
    \ This effectively filters those records. The last block simply prints anything\
    \ that is left."
