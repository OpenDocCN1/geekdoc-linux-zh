    # Glossary


    generically to the platform and architecture of systems built around the x86 and
    derivative processors.


    The term pc can be used to distinguish these systems from Apple MacOS-compatible
    systems and various RISC workstations. It is occasionally used in the obsolete
    sense to refer to microcomputers in general.


    Linux was originally developed on a 386-based system, although it has been ported
    to many others, including Apple 68 and PowerPC, Sun SPARC, and other workstations.


    PCI Peripheral Component Interconnect. A self-configuring local bus. Originally
    proposed by Intel for PCs, PCI can now be found on PowerPC systems and RISC workstations.
    PCI is now the dominant bus in modern computing.


    permissions Access to UNIX files and directories are evaluated through three categories—user,
    group, and others or “world”—for three forms of access—write, and execute. All
    UNIX files have an owner and belong to a group. The group is usually the primary
    ID of the owner at the time the file was created, or the file was assigned using
    the chmod command.


    these “modes” are stored as three sets of three bits. They are usually represented
    as a string like rwxr-xr-x or in octal (75). The chmod command to used to modify
    a file''s mode (permissions). of the owner ( a file ( can change its mode. Default
    permissions on newly created files are determined by the umask of the creating
    process as the shell built-in umask command/ or the umask() system call.


    The read (r), write (w), and execute (x) permissions have obvious meanings when
    applied to regular files and device nodes. However, their application to directories
    is not intuitive. The write permission conveys the ability to create, modify,
    and remove links in a directory regardless of the ownership and permissions on
    the nodes to which these links point. The read permission allows a user/process
    to perform commands and the execute permission allows “travel” of a directory.
    It is not possible to access any point under a directory (including subdirectories)
    without execute permissions on and every parent directory. This implies that the
    root directory must be executable.


    There are three additional settings that can be set on standard UNIX files: setuid
    (SUID), sgid, and “sticky”(The term frequently referred to as SUID and SGID settings).
    The SUID bit on an executable file indicates that the program will execute with
    the effective privileges of the file’s owner, rather than the normal permissions
    of the process/user that launched it. The SGID bit has an analogous meaning with
    respect to the group to which a program file is assigned.


    SUID and SGID executable binaries are one of the most widely used forms of delegation
    under UNIX.'
