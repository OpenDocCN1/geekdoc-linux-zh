  md: '# Chapter 4 Capacity Planning


    That plan would have required the site to peer with both ISPs—usually over the
    BGP protocol. In other words, the site would need an AS (autonomous-system) number,
    and the routers would need to be configured to exchange routing tables and updates
    with both ISPs—who would need to reciprocate by recognizing the routes that were
    published by that site.


    This was all eventually done (over a year later). However, to meet immediate needs,
    the new T1 was placed between the site and the original ISP. In particular, it
    was installed at each end, and both T1s were placed into the same router. Both
    routers of the same manufacture, which permitted load balancing across both T1s.


    This solution avoided the routing and IP addressing issues that would be raised
    when connections were established to multiple ISPs, or to multiple points of presence
    (POPs) at a single ISP. The latter configuration, where a site is served by multiple
    sites, is called multi-homing. However, the term can be confusing since a multi-homed
    site is one that contains multiple network interfaces (like any router), while
    a multi-homed site is one where the whole LAN or WAN is served by multiple ISPs.


    It is possible to connect concurrently to multiple ISPs without peering. However,
    for example, if internal hosts are using private addresses (as described in Chapter
    13, "Network Technologies") or otherwise accessing the Internet through proxy
    servers, groups of them can be configured using different gateways.


    One of the biggest problems with throwing "more" at capacity problems is that
    you often run into more substantial limitations as you attempt to resolve the
    obvious ones. For example


    Situations may arise where there are no available resources to add to a system,
    necessitating replacement of complete systems. Simple considerations apply to
    increasing memory and adding more printers.


    # Reducing Utilization


    Some resources are wasted. When a resource shortage appears imminent, it is often
    worth considering whether resource is being used wastefully. The elimination of
    waste is sometimes a quick and inexpensive solution to capacity problems. The
    most obvious example is the use of compression to reduce the utilization of storage
    or bandwidth or both. There are also more subtle methods.


    For example, in 1996, one of the authors was responsible for providing home directories
    for a team of ten programmers and their manager. An 8GB partition was provided,
    without quotas. Code repositories and work areas were provided separately, so
    this 8GB was largely'
