  md: '# Databases


    Finally, we have databases. Of course, we include any client/server and relational
    database systems in this category. However, we also include other aggregations
    of data—such as password/account (NIS maps and so), DNS zone tables, and aliases
    files.


    Databases are often the most valuable data a sites to its computing systems. They
    are also the most difficult to incorporate into a disaster recovery plan, because
    a running database will not maintain data integrity long enough for the data to
    be copied by traditional tools. Unless the filesystem provides snapshots, special
    tools provided by the database vendor must be used.


    System administrators will have to work with the database administrators (DBAs)
    to develop a recovery plan for the databases. If the organization lacks DBAs,
    the system administrators will have to learn from the database vendor about the
    utilities available to safely back up a live database can always be done while
    no one has write access to the databases. Typically, the system administrators
    will perform the backups, and the DBAs will perform the tests to verify them.


    Those are the common types of data resources. Evaluating the risks associated
    with each type of data depends on the nature of the organization. We can identify
    classes of risks (security, which includes confidentiality, integrity, and access;
    recovery, which includes backup, restore, and corruption detection), the costs
    of each must be determined for each site.


    # The Easy Cases


    An important result of this risk assessment is that we may find that the most
    effective recovery strategy for many disasters does not involve traditional file
    or system “backups” at all. For example, a public web server that receives all
    of its data and configuration information from an internal staging host might
    have this recovery plan:


    +   * Pull the preconfigured spare system from the shelf.

    * Power it up.

    * Set the IP address and so on, as necessary.

    * Test it to the network.

    * Initiate an “update” push from the staging server.


    The recovery plan for the failure of any individual client workstation should
    be to replace it with a spare. The failed machine can then be diagnosed and repaired
    later. Once repaired it should be added to the pool of spare clients.

    In the case of a set of DNS name servers, the recovery plan may be to do a manual
    zone transfer from one of the other servers (secondary or primary). A set of SMTP/POP
    mail servers might have a similar plan: The server for the next available MX record
    starts receiving the mail automatically after a failure, and an administrator
    issues ifconfig'
