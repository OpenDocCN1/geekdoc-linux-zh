  md: '# Debugging Techniques and Analysis Tools


    of outage is tolerable by the user community and the contingency plans for the
    environment. Users whose files or filesystems are missing will experience errors
    due to NFS file handles. Stale filehandles occur when clients have files or directories
    open that are no longer available on the server. Server marks these file descriptors
    as invalid, and the processes on the client machine that refer to them fail with
    the ESTALE error code (errno(3) and /usr/include/asm/errno.h for system error
    codes). Stale files may also include multiple clients which are reading and deleting
    files in the same directory.


    NFS does not hide this side of its stateless nature by special treatment of deleted
    files. File removals are translated into rename operations that create .xxxxx
    files in the users'' home directory. This allows a client program to open files,
    remove them (really unlink(2) them), and continue to read and write to them. When
    the process exits, the .nxxxxx files are removed. This mimics the semantics of
    local filesystems, where open files are reference counted by the operating system.


    # Debugging Techniques and Analysis Tools


    A common message seen when problems occur with NFS


    ```

    NFS server xxx not responding, still trying

    ```


    This occurs when the server has not responded to the client within the number
    of retries specified by the retrans parameter of mount. This value defaults to
    3 on most systems. If this message repeats several times, the server or the network
    is down hard. However, if users see this message alternating between


    ```

    NFS server xxx Ok

    ```


    either the server is overloaded or the network is losing packets.

    To diagnose an NFS server problem, start by collecting some basic information:


    +   - Is the server up?

    - If so, does the server accept logins?

    - Does rpcinfo servername indicate that the portmapper and rpc services are in
    order?

    - Are all clients, or just a subset?


    The first task is to determine whether the problem lies with the server or with
    the network. Diagnoses of NFS problems often lead directly to debugging the network.
    For instance, if a system administrator becomes aware that all affected clients
    are on the same IP subnet and all other clients are fine, the focus of debugging
    immediately will shift to the network.


    Problems encountered while mounting filesystems can generally be resolved in a
    straightforward fashion. If the mount hangs, use ping to verify that the server
    can be reached. If it is reachable, try rpcinfo -p xxxx, where xxxx is the name
    of the server. The nfs and mount ports should appear.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'If the mount fails with the error message permission denied, then it is time
    to examine the /etc/exports file and determine if there is a problem with the
    mount entry in question. The output reflects what the server has exported, along
    with the export options. If there is an obvious problem with the exports, edit
    the /etc/exports file and reexport all the filesystems using the exports -a command.
    On the other hand, if the output looks good, then perhaps there is a problem with
    the underlying data. For example, consider the following wildcard export statement:


    ```

    /vol1 *.subdomain.domain(rw)

    ```


    In this example, the client mars.subdomain.domain is having a problem mounting
    /vol1 from this server. One possible reason is that DNS might not have the correct
    reverse name mapping. When the server gets the request it will call gethostbyaddr(3)
    on the IP address of the client. If the response does not match the wildcard pattern,
    the mount will be refused. For example, the following mappings have an error:


    ```

    mars# nslookup mars

    Server: venus.subdomain.domain

    Address: 192.24.12.164


    Name: mars.subdomain.domain

    Address: 192.24.12.120


    mars# nslookup 192.24.12.120


    Name: mars.domain

    Address: 192.24.12.120

    ```


    Here the reverse mapping returns a fully qualified domain name that does not match
    the entry in /etc/exports, which will cause the mount to fail. A similar error
    may crop up in NIS. Here is the exports line again, using a regexp:


    ```

    /vol1 nfsclients(rw)

    ```


    The regexp(5) file format is subject to numerous typos. Again, verify that the
    IP address-to-hostname mapping is correct as in the wildcard case, and also verify
    that the network nfsclients is correct. Look for missing line continuation characters
    and tab characters in inappropriate locations.


    The automounter may also be a source of errors. The two common problems stem from
    typos in the automounter maps themselves and export permission problems, as discussed
    in the preceding sections. Frequently, the automounter may hang or malfunction,
    in which case it may be killed with the -USR82 signal and restarted. Otherwise,
    a reboot will be required.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Port Mapper


    If the port mapper dies, all processes that register with it must also be restarted.
    A common tactic at this point is to reboot the system, since this often meets
    with more success than trying to find and restart everything.


    # Analysis Tools


    Table 20.1 presents a set of tools frequently used to debug NFS-related problems.


    Table 20.1 NFS analysis tools

    | Command | Use |

    | --- | --- |

    | ping | This utility is used to verify basic connectivity to the client or server
    host. If ping succeeds in reaching a host, there may still be problems with upper-layer
    programs. |

    | traceroute | If ping fails, traceroute will determine the location at which
    the failure occurs. traceroute is most useful in identifying network hardware
    and routing problems. |

    | tcpdump | tepdump is a network sniffing program. Its utility as a general-purpose
    sniper may be negated by switched networks, but it is still a standby for packet-level
    debugging at each end of a problem. Note that IP-level encryption, if present,
    must be disabled for tepdump to be useful. |

    | rpcinfo | rpcinfo can be used as a ping of the RPC network layer and can be
    used to view the programs registered on a system. |

    | fuser | This shows the running processes that have a particular file descriptor
    open, which can be used to determine which processes are keeping a mount point
    busy. |

    | lsof | Similar to fuser, but generally much more informative. A must-have for
    the system administrator''s toolbox. |

    | nfsstat | This utility dumps kernel statistics on NFS and can be used to collect
    historical data or for real-time analysis of the NFS subsystem. |

    | nfsstone | A utility for measuring NFS performance. Available from various sites
    on the Internet. |


    # Providing a Common File Hierarchy


    Many NFS environments are the product of unplanned growth and layers of short-term
    solutions. Any business expected to grow beyond two or three servers needs a long-term
    plan for how the global file hierarchy will look and how it will scale. This initial
    plan for the NFS environment may be flawed, but it will still yield better results
    than actions taken in the absence of a plan.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'There are some guidelines for setting up a shared file hierarchy:


    +   - Applications and their static data should be maintained together.

    - Home directories and shared data directories should be maintained together.

    - If a software development environment is present, it must be separated from
    the normal production environment.


    Table 20.2 presents a possible hierarchy based on these guidelines.


    # Table 20.2 NFS file hierarchy


    | /prod | The directory for production applications and static data |

    | /prod/applix | Third-party software installed on the server and visible to all
    |

    | /prod/dataal | Static data shared by users and applications |

    | /prod/scripts | Startup scripts for all applications in production |

    | /dvlp | The directory for development tools, present only on development systems
    |

    | /dvlp/nag | Third-party libraries and include files |

    | /home | The directory for home directories |

    | /home/fred | Fred''s home directory |

    | /home/salesdata | Frequently modified data shared by the sales group |

    | /home/bob | Bob''s home directory: Won''t get mounted on non-development machines
    because Bob is a developer |


    # More About Automounting


    Often system administrators will be inclined to set up NFS servers with the filesystems
    mounted locally at the same point at they are to be mounted. In the previous example,
    the /prod directory on a server may be exported to client systems, which will
    mount it at /prod. This is simple, elegant, and completely wrong. The server should
    have the same view of the global file hierarchy as the client.


    If this server needed to mount an NFS partition from another server, one would
    be forced to create a special automounterer map for this server. The introduction
    of a special map for each server is complex, confusing, and unnecessary.


    A better methodology is to arrange for local filesystems to be mounted at a different
    place. Let the automounter put everything in the correct place.


    Consider the following hosts file:


    ```

    /vol1 hosta,hostb,hostc,this-server(no_root_squash)

    along with this automounter map for /prod:


    bin this-server:/vol/\nlib this-server:/vol/\netetc this-server:/vol//

    ```'
  merge: -1
