  md: '# Glossary


    virtual console LINUX and most implementations of UNIX for the PC platform this
    feature. It allows the console (keyboard and video monitor) to be treated as several
    "virtual terminals."


    Each of these has its own device node (/dev/tty??) and can run its own copy of
    getty. Someone at the console can log in to each of these any valid user name,
    as if he had several separate terminals at hand.


    By default, Left Alt+F1 through Left Alt+F6 are used to switch among the first
    six of these. Most distributions are configured to support VCs with getty on.
    Additional getty sessions can be added by editing the /etc/initab file and ensuring
    that the appropriate device nodes exist (possibly adding them using the mkmod
    command).


    If more than twelve VCs are used, the thirteenth through twenty-fourth can be
    accessed by using the Right Alt key for the various F keys. It is also possible
    to "cycle" among the active VCs using the Left Alt+Arrow and Left Alt+Arrow keys.


    When xdm start X Windows sessions, they are bound to the first virtual console
    (the one right after the last getty). It is possible to start multiple concurrent
    sessions of X using a command like startx::1 and to switch from them to other
    VCs using Ctrl+Alt+F2.


    It is possible to use VCs without running a getty on by redirecting output to
    the appropriate device node. By adding an entry to the /etc/syslog.conf, one can
    configure syslogd to copy or redirect messages to a VC. One can start interactive
    programs on a VC using programs open.


    virtual memory Memory beyond what is actually available


    virtual terminal See virtual console.


    xafs An early Linux native type of filesystem. Although it offered advantages
    over the Minix filesystem that was first supported by Linux, it was later supplanted
    by the ext (extended) and ext2fs (second extended) filesystems. It is named after
    its creator, Frank Xia.


    LINUX supports many filesystem types; any programmer can write a new set of drivers
    to link into the Linux VFS interface.


    zombie An entry in the kernel''s process table that is preserved until the parent
    process performs a wait() call on it. This is how the exit code is stored and
    returned for all UNIX and Linux processes. A zombie is also known as a defunct
    process.


    The process that results in a zombie has exit()ed, and all resources allocated
    of memory, open files, and so on that were assigned to it have already been reclaimed
    by the kernel. To get rid of a zombie, kill the parent (which can be discovered
    by searching the PPID column from the ps command''s output).'
