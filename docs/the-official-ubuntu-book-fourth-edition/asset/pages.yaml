- img_proc: true
  md: '# Sending Messages


    You can send short messages to users, for example, “You have 5 minutes left for
    this lesson.” To do this, first select a user (or multiple users) and then click
    the Message button. You will then be presented with a box to type in your message.
    After you click OK, the message will be sent to the selected user.


    # Starting Programs


    It is also possible to start an application or process in a client''s session
    from Thin Client Manager. To do this, simply select the user (or multiple users),
    and click the Execute button. You will then be presented with a dialog box to
    enter a command to be run in the user’s session. After you click OK, an internal
    message will be sent to the user’s session asking for them chosen to run.


    # Locking or Blanking Screens


    Sometimes it become necessary to temporarily prevent users from accessing the
    computer. To do this, select the user (or multiple users) and click the Blank
    button. This will activate a locked screensaver on the client''s machine, forcing
    the user to stop and wait until you have unlocked the machine. Unlocking is done
    the same way, but using the Un-Blank button instead.


    # The Lockdown Editor


    By selecting only a single user and right-clicking on that, you can use the context
    menu to lock down a specific user. Lockdown will open Pessulus, the GNOME lockdown
    editor. Ticking and unticking options in Pessulus will enable and disable certain
    functions for the user. Ticking the padlock next to an option will make it un
    by the user. This is called a mandatory setting. Pessulus has been altered for
    integration with Thin Client Manager so that mandatory keys are now per user,
    instead of per system. For further help with Pessulus, please refer to'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'the Pellusus documentation, www.gnome.org/learn/admin-guide/latest/lockdown.html.


    # Managing Users with Groups


    The latest version of Thin Client Manager comes with a user group and filtering
    system. This is all accessed by the context menu. By right-clicking in the user
    list, you will be presented with a menu that has an option called Groups. From
    this menu, you can create new groups, delete old groups, and assign users to groups.


    To assign users to a group, simply select the users required from the user list
    and then right-click to bring up the context menu. From here you can move through
    the menu, Groups > Add to Group > Group Name. The process is identical for removing
    users from groups.


    When your groups are all assigned, you can use the filter combo above the user
    list to show only members of a particular group. The groups and members are persistent
    across Thin Client Manager sessions and automatically saved once they have been
    altered. If you wish to access the file that stores the groups and members, it
    is located at /etc/tcm/users.conf.


    # Plug-ins


    The plug-in framework allows you to expand the way Thin Client Manager works.
    Select a set of users in the left-hand panel and right-click to bring up the context
    menu. From the Plugins option, you''ll see a list of all the plug-ins installed
    in Thin Client Manager. On a fresh installation, this will consist of a single
    plug-in, which is used purely as an example. You can also look at the example
    plug-in file located in /usr/lib/python2.4/packages/studentcontrolpanel/plugins/cheap_plugin.
    Simply, a plug-in consists of a class and a registration function. The plug-in
    is provided with a list of users, which you can use to write a routine to perform
    operations on that list.


    # Troubleshooting LTSP


    Sometimes when administrating your LTSP system, you may come across problems that
    you can''t solve immediately. This section has been written'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'to try to give some hints about how to diagnose and fix common LTSP problems.
    The LTSP Web site, www.ltsp.org, has a large wiki and knowledge base to help you
    find answers to your LTSP problems.


    # The Computer Is Not Obtaining an IP Address


    If your client machines are not receiving IP addresses, it is likely that there
    is a problem with the DHCP server. In order to check this, you must load a terminal
    window and run the following:


    ```

    pidof dhcpd3 2&>/dev/null && echo OK

    ```


    If this shows the result is okay, the problem lies elsewhere. If the result shows
    that the DHCP server is not running, it is time to check the DHCP logs for errors.
    To do this, you must restart the DHCP server and view the logs. Restart the server
    using the following command:


    ```

    sudo /etc/init.d/dhcpd3-server restart

    ```


    If at this stage you see a FAIL message on starting the DHCP server, you know
    that there must be a problem with the DHCP configuration. Checking the logs in
    the way should lead you to the problem. You can easily see the last errors that
    the dhcpd server had by running the following command:


    ```

    tail /var/log/daemon.log

    ```


    A variety of problems can be shown by using this method, and after you have a
    better idea of what the problem is, you may be able to solve it yourself. You
    can also contact the Edubuntu team for help by using the information provided
    at the end of this chapter.


    # NFS Server Is Not Responding


    If your clients exhibit an error, similar to nfs warning: server not responding,
    it is possible that the kernel is using too large a block size for the NFS packets.
    In essence the kernel uses 32K block size, which must be broken down into 1,500
    byte datagrams. Since this results in a large number of small datagrams being
    sent, the client can time out before receiving all the data. Fortunately, the
    fix is simple enough.'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'You must load the file /var/lib/tftbootoot/ltsp/pxelinux.cfg/default so that
    it can be edited. To do this you can use any of the methods previously described
    in this chapter. Once the file is open, there is a line beginning with APPEND;
    to the end of this line, you must add one of the following:


    ```

    NFSOPTS="-o nolock,ro,wsize=2048,rsize=2048"

    ```


    or:


    ```

    NFSOPTS="-o nolock,ro,proto=tcp"

    ```


    After this, your clients should be able to boot normally. If you are using Etherboot
    or require more information on the LTSP wiki, you can find help on the Troubleshooting
    section.


    # VMware Client Crashes While Booting


    Some people use VMware, a virtualization suite, to test various aspects of their
    setup before they roll out. However, you may find VMware clients are unable to
    boot properly. This is a problem with the graphics driver and can be solved simply
    by taking the actions described in the previous section, but instead of adding
    the NFSOPTS line, simply remove the word splash from the APPEND line. This will
    remove the loading screen from Edubuntu and make your VMware clients bootable
    again.


    # Some Intel Boot Agents Will Not Boot at All


    Some Intel Boot Agents have a bug that makes them unable to boot at all if your
    LTSP server (TFTP server) is different from your DHCP server. The reason for this
    is that the Intel Boot Agent assumes wrongly that the TFTP information resides
    on the DHCP server, which of course doesn''t. One way to work around this is to
    make a mirror of the /var/lib/tftboot/directory on the DHCP server and install
    a TFTP server on that machine to serve that. Remember that if you update the NFS
    chroot, you must then update this new mirror. It is also possible there is a firmware
    update for your NIC.'
  merge: -1
