    # Finding Your Files and Folders


    When using your computer, you often need to save and open files and folders, move
    them around, and perform other tasks. The Places menu contains a bunch of entries,
    including those listed here, to access different parts of your computer and the
    network.


    +   - Home Folder:** Your home folder is used to store the files and work for
    each user who is logged in. This is the most important folder on the system, and
    you can think of it as the equivalent of My Documents in Windows—virtually everything
    you save lives here. Each user has a separate home folder.

    - **Desktop:** The Desktop folder is inside your home folder and contains files
    that visually appear on your desktop as icons. If you drag a file onto your desktop,
    it will appear in the Desktop folder. Similarly, moving a file out of this folder
    or deleting it will remove it from your desktop.

    - **Computer:** Clicking this item displays the different drives attached to your
    computer as floppy drives, CD/DVD drives, and USB keys or sticks. This is the
    equivalent of the My Computer icon in Windows.'
