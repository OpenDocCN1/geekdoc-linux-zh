  md: '# Chapter 9 Using Edubuntu


    and LTSP setups installed on top of Ubuntu, you must add an entry to the /opt/ltsp/i386/etc/lts.conf
    file to enable sound for client machines.


    The easiest way to edit this file is to hold Alt-F2, which will bring up the run
    command dialog box. Type in the following command:


    ```

    gksudo gedit /opt/ltsp/i386/etc/lts.conf

    ```


    Clicking OK will bring up an editing window. Make sure to have at least a [default]
    section in the Lts.conf file where you will add the following line:


    SOUND=True


    > Dapper 6.06 LTS Y is very particular about the SOUND=True statement. You must
    type it exactly as shown, taking extreme care with capital letters and so on.


    For all versions after 6.10 of Edubuntu, this is already done for you, and sound
    should work on client machines out of the box.


    # Printing over LTSP


    There are two ways in which printing can be achieved in an LTSP environment. The
    first is for a printer to be connected directly to the server. In this instance,
    printing is set up in the usual way. You can find more details on this in Chapter
    4.


    The second way to allow printing is to make one of the workstation machines a
    print server. This feature was introduced in Ubuntu Edgy 6.10. Up to three printers
    can be attached to the workstation using the parallel USB ports. LTSP uses the
    jetpipe program on the workstation to redirect printing from the server to the
    workstation. In order to attach a printer to the workstation, a change must be
    made to the /opt/ltsp/i386/etc/lts.conf file. The following is an example of some
    configuration options.


    ```

    [00:4C:69:73:61:00]

    PRINTER_0_DEVICE = /dev/lp0

    PRINTER_1_DEVICE = /dev/usb1p0

    ```


    This will cause the jetpipe program to begin running as a background process and
    will open ports 9100 and 9101, where it will listen for a print'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'stream from the server. This stream will then get redirected to the printer
    attached to the parallel port on the computer.


    In this example, we use the client''s MAC address to identify it on the network.
    Unless you know the MAC address of the client machine that the computer is connected
    to, you will need to run the following command to find it. When the client boots
    up, it will display its IP address in the bottom of the login screen. Simply replace
    the <IP> in the following chunk of code with that IP address to find the MAC address
    of the client machine.


    ```

    IP=<IP>; ping -c1 $IP | grep "NULL"; arp -a | grep $IP

    ```


    Here is an example:


    ```

    pete@ubuntu:~$ IP=192.168.16.5; ping -c1 $IP | grep "NULL"

    pete@ubuntu:~$ arp -a | grep $IP

    ? (192.168.16.5) at 00:12:50:30:5A:E5 [ether] on eth0

    pete@ubuntu:~$

    ```


    All that is needed is to create the print queue on the server, so that the client
    machines know the printer exists. This can be done in the usual way of adding
    a printer as shown in Chapter 4. The jetpipe program allows the workstation printer
    to be identified as an HP JetDirect system. To add the printer to the server,
    you will need to enter the IP address of the workstation and the port that the
    jetpipe service is listening on. The first printer you connect to a workstation
    will be on 9100, the second on 9101, and the third on 9102.


    # Other Window Managers with Edubuntu


    Using other window managers with Edubuntu is easy. With versions from Edubuntu
    Edgy 6.10 forward, adding a window manager will result in a new option being present
    in the LDM login screen. This will allow you to choose which window manager to
    use when logging in. In order to use a new window manager, you must install the
    appropriate package. You have the following choices:


    +   - xubuntu-desktop: a lightweight window manager, perfect for lower-end systems

    - kubuntu-desktop: a feature-rich window manager

    - ubuntu-desktop: the standard window manager, used by default'
