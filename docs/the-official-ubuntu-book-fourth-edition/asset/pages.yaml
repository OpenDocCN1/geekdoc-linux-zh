  md: '# Shutting Down Your Computer and Logging Out


    Now that you''re becoming acquainted with Ubuntu, you''ll want to keep using it
    as long as possible, but there will always come a time when you have no choice
    but to leave your computer and do something else. Ubuntu is extremely flexible,
    and this area is no exception. Click the icon in the top right of the screen by
    your username to see the various options (shown in Figure 3-5) for ending your
    current session.


    There are a number of options available upon logout, however, the choices presented
    to you will depend on your installation (e.g., Suspend may not be available).


    +   **Guest Session:** This option lets you allow someone to use your computer
    while keeping you logged in but your data and account secure by giving the guest
    a limited desktop to work with temporarily requiring your password to return to
    your desktop.

    **Lock Screen:** This option locks the screen. This is useful when you need to
    use the bathroom or grab some lunch. It will lock the computer and ask for your
    password to reopen the desktop.

    **Log Out:** This option lets you log out of the current session and go back to
    the main login screen.

    **Suspend:** If your computer supports Suspend, this option will be included in
    the list, and you can click it to save the current state of your system in RAM.
    The next time your computer is turned on, the desktop will be resumed. This option
    continues to use battery but only a minimal amount.


