    # Launchpad


    Launchpad can be found at www.launchpad.net.


    # Soyuz


    Soyuz is the distribution and archive management software integrated into Launchpad.
    It handles all of the automatic building of software in Ubuntu on each of the
    architectures and the integration of successfully built software into the archive.
    Soyuz means “union” in Russian and is the name of the spacecraft that Mark Shuttleworth
    traveled in his voyage to space.


    Soyuz works almost entirely behind the scenes. It was first activated in February
    2006, but had no initial effect on the software was uploaded or downloaded in
    Ubuntu. What Soyuz does is to integrate the process by which software is built
    and inserted into different parts of the Ubuntu archive. The building of software
    cannot be tracked using the Launchpad infrastructure.


    # Recent Builds


    The status of recent builds in Ubuntu can be found at https://launchpad.net/distros/ubuntu/+builds.


    # Rosetta


    Rosetta is a Web-based translation system integrated into Launchpad. It was the
    first piece of Launchpad to be publicly released. It was named after the Rosetta
    Stone, the famous piece of dark grey granite with the same text in three scripts
    that led to the deciphering of Egyptian hieroglyphs.


    Rosetta is a Web-based version of a “PO” file editor. In other words, it provides
    a simple mechanism by which translators can view a list of untrans-'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'lated phrases or strings and then translate each of them into their language.
    At the moment, the system works only with translations from English. Rosetta’s
    non–Web-based predecessors include Kbabel and Gtranslate, both of which can be
    downloaded and installed on Ubuntu. By putting this functionality on the Web and
    integrating it into the archive management scripts, Rosetta lowers the barrier
    of entry for translation and lowers the chance that a translation will not make
    it into the distribution.


    Rosetta includes each of the translatable strings contained in every application
    in Ubuntu. When new software is uploaded into Ubuntu, Rosetta will check to see
    if any strings have changed or been added. Changes to a string that has previously
    translated will result in the translation being marked as fuzzy until a translator
    can check the translation and the new string, make any necessary changes, and
    then mark the translation as no longer fuzzy. By tracking new strings, Rosetta
    can easily prompt translators with strings to translate as they appear as well
    as provide statistics on the percentage of strings within a particular application
    or within all of Ubuntu that have been translated into a particular language.


    As users translate strings, they build up “karma” within the system—an innovation
    that has been deployed to many other parts of Launchpad. Users can also work in
    localization teams (called L10n teams because the word localization has ten letters
    between its first and last letters). Rosetta provides a great way for Ubuntu users
    to get involved in the distribution. Anybody who knows English and another language
    can begin contributing. Because the system is integrated into Launchpad, users
    do not need to submit their translations that they have included in Ubuntu—the
    project already has them. Several days later, new translations are pushed out
    to Ubuntu users who use Ubuntu in those languages.


    TIP


    Rosetta

    Rosetta can be found at www.launchpad.net/roetta.


    # Malone


    Malone is a Web-based bug system like the Mozilla project Bugzilla, which might
    be familiar to some users. It provides a location where users can find bugs they
    find in their Ubuntu software by using easily accessible pieces of'
  merge: -1
  pgno: 415
- img_proc: true
  md: 'software such as Bug Buddy and the command-line reportbug or by report- over
    the Web. Malone''s name is a reference to the gangster movie musi- cal Malone.


    Malone''s first role is to provide a location where users can submit bugs. Malone
    is not just a way to collect complaints, though. Rather, his job is to track and
    record a bug through its full life cycle, from report to close. Bugs can be assigned
    to a particular developer or reassigned. If the bug is, in fact, the result of
    another application, the bug can be reassigned to another package. Bugs can be
    rated according to severity, or tagged and categorized in any number of useful
    manners. Information, files, and patches that fix a bug can be uploaded into Malone.
    When the bug has been resolved, it can be closed. The Malone bug report provides
    a single venue in which to- lect information from the bug submitter, the bug fixer,
    the upstream maintainer if necessary, and any other involved party.


    All of this, course is exactly what you would expect from any usable modern bug
    tracker. Where Malone aims to distinguish itself from its competitors through
    its integration in Launchpad. First and foremost, this means that users of Malone
    can track the status of a bug as it relates to a particular patch or a particular
    piece of code. Ubuntu supports every release for 18 months and some releases,
    such as Ubuntu 6.06 LTS, for much longer, it''s important that Ubuntu be able
    to track which bugs show up in which releases. As derivative works of Ubuntu are
    created in Launchpad, Malone also allows these derivatives to Malone to see whether
    bugs submitted against Ubuntu or other distributions apply to their code and,
    if so, to quickly grab a fix.


    As with Rosetta, Launchpad karma can be built up by fixing, reporting, and interacting
    with bugs over time. Bug triage that involves irre-ducible bugs and merging duplicate
    bugs is one way that users can build up their karma. Of course, simply running
    developer versions and submitting new bugs is another great way to build good
    karma.


    +   TIP Malone

    Malone can be found at www.launchpad.net/malone.'
