    # Kiosk Mode


    Kiosk mode allows an administrator to configure KDE and all aspects of the desktop
    and prevent the end user from changing the settings.


    KDE stores all of its configuration information in text files. These files control
    everything from the default background to whether or not a person can add bookmarks.
    To see the locations of the configuration files, simply type `kde-config --path
    conf` from the Konsole. Note that the order is the reverse order of what is displayed.
    By simply changing one of the files in the highest priority, the last listed in
    the kde-config statement, you can affect all users see.


    To change the background for all users, simply edit the Wallpaper section found
    in kdesoptrc, located in `/usr/share/ubuntu-default-settings/kde-profile/default/share/config`.


    As previously discussed, each user can change the desktop to meet his her own
    needs. However, an administrator can make it so some things cannot be changed.
    Simply insert [$1] at the top of the file for each application you would like
    to make immutable.'
