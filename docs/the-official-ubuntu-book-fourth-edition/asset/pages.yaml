  md: '# Which Image?


    When you are reading about .iso files, you will often see them referred to as
    CD images. The term *image* here does not refer to a visual image such as a photo
    or picture but to an exact copy of a CD.


    You need to use a CD-burning application to burn your .iso file to the CD correctly.
    Inside the application there should be a menu option called Burn from Disk Image
    or something similar. The wording and details will vary according to the program
    that you use to burn the image. You should select the .iso file, insert a blank
    CD, and after a few minutes, will pop a fresh Ubuntu installation.


    To give you a head start, the following subsections present instructions for burning
    a CD in popular tools.


    **In Windows with ISO Recorder** To burn your .iso file with the freely available
    ISO Recorder, first go to http://isorecorder.alexfeiman.com, and then download
    and install ISO Recorder. To burn your image, follow these steps.


    +   1. Insert a blank CD into your CD writer.

    2. Locate the .iso file you downloaded, right-click it, and select Copy Image
    to CD.

    3. Click Next, and the recording process begins.

    4. When the image has been written, click Finish to exit ISO Recorder.


    **In Windows with Nero Burning ROM** To burn your image using Nero-Burning ROM,
    follow these steps.


    +   1. Insert a blank CD into your CD writer.

    2. Start Nero Burning ROM.

    3. Follow the wizard prompts, and select Data CD.

    4. When the wizard finishes, click Burn Image on the File menu.

    5. In the Open box, select the .iso file, and then click Open.

    6. In the wizard, click Burn to create the Ubuntu CD. When completed, click the
    Done button to exit.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Chapter 2 Installing Ubuntu


    In Linux with GNOME To burn your image using Linux with GNOME follow these steps.


    +   1. Insert a blank CD into your CD writer.

    2. In the Nautilus file manager, right-click on the file you just downloaded,
    and choose Write to Disk. The Write to Disk dialog box opens.

    3. In the dialog box, choose your CD writer and speed, and then click on Write.
    The Writing Files to Disk Progress dialog box opens, and Nautilus begins writing
    the disk.


    Burning with Mac OS X To burn your image using Mac OS X, follow these steps.


    +   1. Load the Disk Utility application (found in your Utilities folder).

    2. Insert a blank CD, and then choose Images > Burn and select the .iso file.


    Use the Right Option You need to use the Burn from Disk Image or similar option
    rather than just copy the .iso image onto the CD to be burned. If you just burn
    the file directly, you will have a CD containing the single .iso file. This won''t
    work.


    The Burn from Disk Image function takes the .iso file and restores all the original
    files from the installation CD onto the disk. This ensures you have a proper installation
    CD.


    # Installing from the Desktop CD


    So let''s assume you are playing with Ubuntu running from the desktop CD, and
    you decide you like it so much, in fact, that you want to install it on your computer.
    Does this mean you need to get a separate CD and install it? Heck, Ubuntu lets
    you to install the hard disk by simply clicking a single icon and following the
    instructions—one disk to run them all.


    If you don''t already have the desktop CD running, pop into your DVD/CD drive,
    and reboot your computer. If your computer does not boot from the CD, you should
    enter your computer''s BIOS and change the boot order to ensure that your CD-ROM
    drive is tried first and the hard disk is tried next. Save your BIOS changes,
    and then restart again. The disk should boot now.'
  merge: -1
