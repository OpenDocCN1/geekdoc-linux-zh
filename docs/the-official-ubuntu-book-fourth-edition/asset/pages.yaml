  md: 'COMMUNITY IS A WORD OFTEN used in discussions of Ubuntu. Early articles about
    Ubuntu bore subtitles asking, “Would you like some community with that?” The earliest
    press releases and communiqués from the project emphasized a “community-driven
    approach” to operating system development and distribution. Also, the highest-level
    governance board in Ubuntu is called the Community Council. Canonical, Ltd. employs
    a full-time community manager (Jono Bacon, one of the authors of this book). And
    we made a very conscious decision to spend an entire chapter of this book the
    Ubuntu community. In fact, all three editions are dedicated to the Ubuntu community!


    Still, while the Ubuntu community is important, it is not always easy to succinctly
    describe it. Ubuntu is, in large part, developed and funded by Canonical, Ltd.
    The community, almost by definition, extends far beyond Canonical, Ltd. The Ubuntu
    project has members and self-declared activists (Ubunteros), but the Ubuntu community
    is more than even those with such explicitly declared relationships. The project
    contains a wide variety of different venues for participation. But while the community
    is active in each of these areas, its scope is even wider.


    The Ubuntu community is the collection of individuals who build, promote, distribute,
    support, document, translate, and advocate Ubuntu—in myriad ways and in myriad
    venues. Most people in the Ubuntu community have never met, talked with, or heard
    of each other. Members of the community are linked by their contributions, both
    technical and nonlocal, and by Ubuntu itself. These contributions have built Ubuntu
    as a distribution, as a social movement, as a set of support infrastructures,
    and as a project. In short, they built Ubuntu as a community. While any active
    software development project has a number of people making contributions, not
    every project has a community.


    Community is also a term that represents a promise by the Ubuntu project to remain
    inclusive. The focus on community means that volunteers are not only welcome but
    also essential. It means Ubuntu is a “place” where individuals can come together
    to create something greater than the sum of its parts. The word community gives
    a nod to the fact that while much development work is paid for by Canonical, Ltd.,
    and some'
