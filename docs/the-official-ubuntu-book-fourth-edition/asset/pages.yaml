  md: '# Ubuntu Subprojects, Derivatives, and Spin-offs


    Finally, no introduction to Ubuntu is complete without an introduction to a growing
    list of Ubuntu subprojects and derivatives. While Ubuntu was derived from Debian,
    the project has, over the last four years, already developed a number of derivatives
    of its own.


    First and foremost among these is Kubuntu—a version of Ubuntu that uses KDE instead
    of GNOME as the default desktop environment. Kubuntu is described in depth in
    its own chapter (Chapter 8) and so is not explored in any serious depth here.
    However, it is important to realize that the relationship between Kubuntu and
    Ubuntu is different from the relationship between Kubuntu and Debian. From a technical
    perspective, Kubuntu is fully within the Ubuntu distribution. Organizationally,
    the Kubuntu team works fully within Ubuntu as well.


    A similar organization exists with the Edubuntu project, which aims to help develop
    Ubuntu so that a configuration of the distribution can be easily and effectively
    put into use in schools. That project has a dual focus on both educational and
    school-related software and on a Linux Server Project (LTSP) setup that allows
    schools to run many students'' computers using one or more powerful servers and
    many "dumb" terminals that connect to the server and run software off. This relatively
    simple trick translates into huge cost savings in educational settings. The Edubuntu
    project is treated in depth in Chapter 9.


    The Xubuntu project is based on the lightweight window manager Xfce. Xubuntu is
    designed to be appropriate on older or less powerful computers with less memory
    or slower processors—or for people who prefer a more responsive environment and
    a slimmer set of features. While started as an unofficial project, Xubuntu has
    enjoyed great popularity and has become integrated as an official part of the
    core distribution.


    Other derivatives exist as well, such as Ubuntu Studio and Mythuntu. A list of
    officially supported and recognized derivatives is available at www.ubuntu.com/products/whatisubuntu/derivatives.


    In a way, it is through these derivatives that the work and goals of the Ubuntu
    project come together and are crystallized. It is only through the'
