- img_proc: true
  md: '+   - sed: The sed (or Stream EDitor) command allows search and replace of
    a particular string in a file. For example, if you want to find the string "cat"
    and replace it with "dog" in a file named pets, type sed s/cat/dog/g pets.


    Both grep and sed are extremely powerful programs. There are many excellent tutorials
    available on them, but here are a couple of good Web sites to get you started:


    +   - https://help.ubuntu.com/community/grep

    - http://manpages.ubuntu.com/manpages/intrepid/en/man1/sed.1.html


    Three other commands are useful for dealing with text.


    +   - cat: The cat command, short for concatenate, is useful for viewing and adding
    to text files. The simple command cat FILENAME displays the contents of the file.
    Using cat FILENAME f1e adds the contents of the first file to the second.


    +   - nano: Nano is a simple text editor for the command line. To open a file,
    use nano filename. Commands listed at the bottom of the screen are accessed by
    pressing Ctrl followed by the letter.


    +   - less: The less command is used for viewing text files as well as standard
    output. A common usage is to pipe another command through less to be able to see
    all the output, such as 1s | less.


    # Dealing with Users and Groups


    You can use the following commands to administer users and groups.


    +   - adduser: The adduser command creates a new user. To create a new user, simply
    type sudo adduser $login. This creates the user''s home directory and default
    group. It prompts for a user password and then further details about the user.


    +   - passwd: The passwd command changes the user''s password. If run by a regular
    user, it will change his or her password. If using sudo, it can change any user''s
    password. For example, sudo passwd changes Joe''s password.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Appendix A Welcome to the Command Line


    +   - who: The who command tells you who is currently logged into the machine.


    +   - addgroup: The addgroup command adds a new group. To create a group, type
    sudo addgroup $username


    +   - deluser: The deluser command removes a user from the system. To remove the
    user''s files and home directory, you need to add the -remove-home option.


    +   - delgroup: The delgroup command removes a group from the system. You cannot
    remove a group that is the primary group of any users.


    # Getting Help on the Command Line


    This section provides you with some tips for getting help on the command line.
    The commands -help and man are the two most important tools at the command line.


    Virtually all commands understand the -h (or -help) option, which produces a short
    usage description of the command and its options, then exits back to the command
    prompt. Try man -h or man -help to see this in action.


    Every command and nearly every application in Linux has a man (manual) file, so
    finding such a file is as simple as typing command to bring up a longer manual
    entry for the specified command. For example, man mv brings up the mv (move) manual.


    Some helpful tips for using the man command include the following.


    +   - Arrow keys: Move up and down the man file by using the arrow keys.


    +   - q: Quit back to the command prompt by typing q.


    +   - man man: man man brings up the manual entry for the man command, which is
    a good place to start!


    +   - man intro: man intro is especially useful. It displays the Introduction
    to User Commands, which is a well-written, fairly introduction to the Linux command
    line.'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'There are also info pages, which are generally more in-depth than man pages.
    Try info info for the introduction to info pages.


    # Searching for Man Files


    If you aren''t sure which command or application you need to use, try searching
    the man files.


    +   - **man k foo**: This searches the man files for foo. Try man -k nautilus
    to see how this works.


    > NOTE -k foo is the same as the apropos command.


    +   - **man f foo**: This searches only the titles of your system''s man files.
    Try man -f gnome, for example.


    > NOTE -f foo is the same as the whatis command.


    # Using Wildcards


    Sometimes you need to look at or use multiple files at the same time. For instance,
    you might want to delete all .rar files or move all .odt files to another directory.
    Thankfully, you can use a series of wildcards to accomplish tasks.


    +   * matches any number of characters. For example, *.rar matches any file with
    the ending .rar.


    +   * matches any single character. For example, ?.rar matches a rar but not ab.rar.


    +   * [characters] matches any of the characters within the brackets. For example,
    [ab].rar matches a.rar and b.rar but not c.rar.


    +   * ![characters] matches any characters that are not listed. For example, ![ab].rar
    matches c.rar but not a.rar or b.rar.'
  merge: -1
