    > TIP Array Failure and Spare Devices

    When a physical drive fails in a RAID array that''s running in a level that provides
    redundancy—such as 1 or 5—the array goes into so-called degraded mode (never abuse
    or cruel to your RAID arrays!). Depending on the number of devices in the array,
    running in degraded mode might have performance downsides, but it might also mean
    that another drive failure will bring down the whole array and cause total data
    loss. To recover the array from degraded mode, you need to add a working physical
    drive to the system (the old one can be removed) and instruct the array to use
    the new device to "build.

    Order to minimize the amount of time an array spends in degraded, and to prevent
    having to power the machine to insert new physical drives if the server doesn''t
    support hot-swapping, you can put extra physical drives into the machine and flag
    them as hot spares, which means the system will keep them active but unused until
    there''s a drive failure. spares, as the names imply, are just extra drives that
    you keep on on a shelf until there''s a failure, at which point you manually add
    them to the array.


