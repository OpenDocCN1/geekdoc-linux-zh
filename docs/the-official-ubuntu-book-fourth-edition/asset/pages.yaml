  md: '# # Foreword to the First Edition


    IT''S A SMALL CELEBRATION for me to write this foreword—almost exactly two years
    after the first meeting of a small group of free software professionals that turned
    into us the Ubuntu project. A celebration because two years ago none of us would
    have predicted that our dream would spawn several million CDs, three or four million
    enthusiastic users, hundreds of commitments of support from companies large and
    small, a minor prime television reference, and now *The Official Ubuntu Book*.


    The dream that brought us together can be simply expressed:


    To build a world-class operating system for ordinary desktop computer users, that
    is genuinely free and freely available, is immediately useful, and that represents
    the very best that the free software can achieve today.


    In setting out to build a platform for "ordinary desktop computer users," I had
    no idea that I would have the privilege of meeting and working with so many extraordinary
    desktop computer users. Some of those extraordinary individuals are the authors
    of this book, people who understand the importance of the free software movement
    and the talent to have real contributors to its success. Others make up the backbone
    of the Ubuntu community—the small but dedicated army of a few hundred people who
    work to produce a new release of Ubuntu every six months. They are at the heart
    of a network that reaches through the global free software community—through the
    world of Debian, an extraordinary project in its own right and without which Ubuntu
    could not exist, and out to the thousands of projects, large and small, that produce
    the code and documentation that we pull together and call Ubuntu.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'While this huge extended community can often appear to be fractured and divided
    among infinitesimal ideological lines, we are all broadly in agreement about four
    key ideas, and it is those ideas that are central to the Ubuntu promise:


    +   - That our software should not come with a license fee. That we should be
    able to share our software, modify it, and then share our modifications,


    +   - That this free software should be the best version available, including
    regular security updates, and not a tease for a better, commercial product.


    +   - That full-scale, high-quality commercial support from local and global companies
    should be available for this free platform.


    +   - That this software should be usable in as many languages as possible and
    usable by as many people as possible regardless of disability.


    The 17 of us who met in London two years ago come from a very wide variety of
    countries and backgrounds, but we all agreed that the goal of producing a platform
    that could live up to that promise was a worthy one, and one that we would devote
    ourselves to wholeheartedly.


    For several months we worked quietly. We wanted to come to the world not only
    with a manifesto but also with a clear demonstration of work done toward our goal,
    something that people could test and comment on. We had no name (though industry
    insiders us us “Super-Secret Debian Startup”), and, as a result, we hosted most
    of our work at www.no-name-ubuntu.com. We were looking for a name that could express
    the beauty of the free software community development process—collaboration, interdependence,
    sharing, standing gently on the shoulders of giants, and reaching for lofty goals.
    The only word that comes close to that, of which I’m aware, is the African word
    ubuntu. It is found in forms in many different African languages. And so we adopted
    it as the name of our project.


    We know that our first release would have blemishes—warts—and give it the codename
    “The Warty Warthog”. We called ourselves “the warthogs” and coordinated our work
    on the #warthogs IRC channel. Today, for better or worse, that’s turned into a
    tradition of codenames as “Breezy'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Foreword xxii


    Badger” and “Dapper Drake.” As lighthearted as they sound, these nicknames come
    to embody the spirit of our community as it works towards a particular release.
    This next one—Dapper—is exactly that: a man emerging from youth, professional,
    bold, confident, and energetic. This is our first release that is designed to
    meet the needs of large organizations as much as developers and engineers. In
    the same way, the Ubuntu community has moved from being something of a rebellion
    against the “Linux establishment” to a strong and professionally organized group.


    # What Makes Ubuntu So Popular?


    First, this is the time for free software to come to the forefront, and Ubuntu
    is very much the beneficiary of the vast amount of work that has gone into building
    up a huge body of work in the GNU/Linux world. That has been underway for nearly
    30 years, in one form or another, Ubuntu is one way in which it is suddenly becoming
    “visible” to the non-specialist computer user. We are in the middle of a great
