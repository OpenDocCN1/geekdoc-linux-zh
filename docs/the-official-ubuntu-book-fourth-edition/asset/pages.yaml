  md: '# The Ubuntu File Chooser and Bookmarks


    One area in which the GNOME file chooser developers have worked hard is in creating
    an intuitive and useful file chooser that is accessed in applications with File
    > Open. You may be wondering why they have spent so time on such a small and seemingly
    insignificant part of the desktop. In reality, finding files is one of the most
    frustrating aspects of using computers and often involves digging through folder
    to find what you need. Luckily, the GNOME file chooser (Figure 3-35) helps cut
    down much of this file hunting significantly.


    The listing of files on the right-hand side is used to find the file you need,
    and you can click on folders in this listing to traverse deeper into your sub-folders.
    Note how each folder is displayed above the listing in a series of buttons. You
    can click these buttons to easily jump back to parent folders when needed.


    Aside from enabling to manually pick files, the chooser also supports bookmarks.
    On the left side of the chooser is a list of devices and bookmarks labeled Places.
    These include your home directory (shown as your user-


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_142_0.png)


    Figure 3-35 The file chooser has a number of subtle features such as bookmarks.'
  merge: -1
