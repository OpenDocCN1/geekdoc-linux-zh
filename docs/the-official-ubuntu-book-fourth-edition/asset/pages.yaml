- img_proc: true
  md: '![](img/126675dbc4d8377bd44bbaf9fe40a0f3_387_0.png)


    **Figure 9-14** Educational applications available through Add/Remove Applications


    Once the install has completed, the new applications should be available on your
    Edubuntu machine. If you are running a thin client system, this now means that
    all the clients have the software available to them and can use it right away.


    # # Removing Applications


    Just as was easy to install applications in Edubuntu, the same applies for removing
    them. The process is just the reverse of the install procedure. Load the Add/Remove
    Applications utility and simply until you no longer want to be installed.


    Clicking on the Apply button will prompt you to confirm your decision before removing
    the packages you selected. The package will now no longer be available on the
    Edubuntu server or on any thin client machine that boots from the network.'
