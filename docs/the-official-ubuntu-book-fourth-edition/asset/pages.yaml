  md: '# xxviii


    # Foreword


    it muscle, but it is in every regard an open project, with participation at the
    highest levels by true volunteers. We work in a fishbowl—our meetings take place
    online, in a public forum. That can be tricky. Building an operating system is
    a fast-paced business full of compromise and tough decisions in the face of little
    information. There are disagreements and dirty laundry, and mistakes are made.
    (I should know; some of them are mine.) You hear the one about the Warty Warthog
    desktop artwork.) The transparency of our environment, however, means that we
    can count on having robust conversations about our options—all of them, even the
    core team would never have dreamed up. It also means that mistakes are identified,
    discussed, and ultimately addressed faster than they would be if we lived and
    worked behind closed doors. You get a better platform as a result.


    We work as a community to recognize the contributions of all sorts of individuals—advocates,
    artists, Web forum moderators, channel operators, community event organizers,
    writers, translators, people who file and triage bugs ... whatever your particular
    interest or talent, we will have a way to integrate your contribution.


    Perhaps most important is the way our approach to community differentiates Ubuntu
    from other free software projects with similar vision. We try to do all of this
    in a way that recognizes disagreements are important but prevents those disagreements
    from creating deep divides in our community. Our code of conduct may not be perfect,
    but it reminds each of us to remember the meaning of the word ubuntu—that each
    of us has best impact through the relationships we maintain with one. Finding
    common ground and maintaining healthy communication are more important for us
    as a community in the long run than a technical decision or the specific choice
    of words which to translate “File” into Spanish. Our community governance structures—our
    Technical Board and Community Council—exist to ensure that debates do not become
    personal and that decisions can be taken after all sides have been heard.


    If you are a software professional or curious about Linux, this book and this
    platform are an excellent choice. You will learn about the world of Ubuntu and,
    indirectly, Debian and GNU/Linux. These are great foundations for working with
    the tools that I believe will come to define the “standard,” the everyday computing
    base upon which we build our homes and offices.'
