    Figure 8-11 The GHNS framework at work


    Different applications have the ability to download information from the Internet
    and KDE sites. Throughout applications in Kubuntu, you will find references to
    Get More, which uses the GHNS framework.


    # System Administration


    Like any computer application or system, Kubuntu occasionally needs administrative
    support. Do not be afraid of personally administering your Kubuntu. While system
    administration is not foolproof, a lot of changes have been made to help make
    administration easier. Knowledge of command line will go a long way, but the developers
    have made sure to provide graphical interfaces wherever it makes sense to do so
    (e.g., from DHCP to a static address). Everything changing the IP address to installing
    packages can be done without having to drop down to the command line. This section
    focuses exclusively on system administration performed through the graphical interface.


    # Installing New Packages


    As mentioned earlier, Kubuntu is built around some of the same applications and
    systems as Ubuntu. All applications are installed through packages. Like Ubuntu,
    Kubuntu uses the Advanced Package Tool (APT), and'
  merge: -1
