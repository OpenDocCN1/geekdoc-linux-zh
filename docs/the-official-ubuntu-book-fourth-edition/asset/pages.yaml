    If you are having trouble writing to a USB key or external hard drive, there are
    a number of possible causes of the problem.


    The first and most simple to diagnose is that you may not have permission to write
    to the device. When you plug in the drive, right-click the icon that appears on
    your desktop, and select Properties. In the window that appears, click the Permissions
    tab and ensure that the Others line has the'
