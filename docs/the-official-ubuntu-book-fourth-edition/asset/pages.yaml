    package. Along with this, you will need the openssh-server package.


    The easiest way to do this is to open a terminal window via the Applications >
    Accessories > Terminal link in the main menu. Once, here, you should type the
    following commands to install the LTSP server and the SSH server. In our example,
    a DHCP server was not required.


    ```

    sudo apt-get install ltsp-server openssh-server

    ```


    > If you require a DHCP server, modify the line above from ltsp-server to ltsp-server-standalone.
    You will also need to configure a second network device to an IP address of 192.168.0.1
    before running the procedures described in this subsection.


    All that is left to do now is install the client chroot by running the following
