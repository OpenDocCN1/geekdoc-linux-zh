  md: '# Ubuntu and Multimedia


    In recent years, multimedia has become an essential part of computing. Watching
    DVDs and videos and listening to CDs and music have become part and parcel of
    the modern desktop computer experience. These media capabilities have been further
    bolstered by the high popularity of legal music downloading. With a range of online
    stores for a variety of different types of music, it is not uncommon to listen
    to most of your music without ever seeing a little shiny silver disk.


    # Installing Codecs


    Multimedia files and disks come in a variety of different types, and each type
    uses a special codec to compress the content to a smaller size while retaining
    a particular level of quality. To play this media, you need to ensure that you
    have the relevant codecs installed. Ubuntu now makes this easier by suggesting
    packages that provide a suitable codec when you open a file that is not supported
    by the ones that are currently installed. Simply double-click the file you want
    to open, and you should be provided with a list of packages that you can install
    to enable support for the file you have tried to open. Select the packages that
    seem appropriate, and click Install.


    > QUICK TIP If you double-click a file but no packages are suggested, you may
    need to change the package filter in the top right-hand corner to All Available
    Applications.


    Codecs still remain a problem for open source software because of the legal restrictions
    placed upon them. Certain codecs (including MP3, Windows Media Format, QuickTime,
    and RealMedia) are proprietary and as such have restrictions placed on their use,
    distribution, and licensing.


    Although developers in the open source community have gone away and created free
    implementations of some of these codecs, the licensing that surrounds them conflicts
    with the legal and philosophical position that Ubuntu has set. These codecs are
    not included not only because they are legally dubious but also because they disagree
    with Ubuntu''s ethics of creating a distribution that is entirely comprised of
    free software in the freest sense of the word.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'QUICK TIP If you want to find out more about installing these codecs, see https://wiki.ubuntu.com/RestrictedFormats.


    To work toward resolving these problems, a number of developers are working on
    free codecs as Ogg Vorbis and Ogg Theory that provide high-quality results and
    open licensing. The Ogg Vorbis codec is used on audio and can provide better results
    than MP3 at a smaller file size. The Ogg Theory codec is used for video and competes
    with the MPEG-4 codec. Ubuntu includes the Ogg Vorbis and Ogg Theory by default,
    and you can encode and play back any media that uses these out of the box.


    Although the world would be a better place if the reality is different, and many
    Ubuntu users still want to play media compressed with proprietary codecs. Table
    3-3 shows the most typical codecs used to encode and play back media and lists
    their support in Ubuntu.


    # Listening to Audio Files


    Ubuntu includes a powerful music player called Rhythmbox to organize and play
    your music file collection. By default, Ubuntu will look for music in the Music
    directory accessible in the Places menu.


    | Codec | File Type | Included | Supported |

    |---|---|---||}{

    | MP3 | .MP3 | No | Yes |

    | Ogg | .ogg | Yes | N/A |

    | Windows Media Audio | .wma | No | Yes* |

    | Wave | .wav | Yes | N/A |

    | MPEG-1 | .mpg | No | Yes |

    | MPEG-2 | .mpg | No | Yes |

    | Raw DV | .dv | Yes | N/A |

    | Quicktime | .mov | No | Yes* |

    | Windows Media Video | .wmv | No | Yes*


    * These codecs involve the installation of nonfree software that may or not be
    legal in your country.'
  merge: -1
