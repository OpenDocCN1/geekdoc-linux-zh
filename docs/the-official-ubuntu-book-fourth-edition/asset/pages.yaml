  md: '# Ubuntu in Your Language


    name), Desktop (the files on your desktop), and File System (the entire hard drive),
    as well as devices such as CD drives, floppy drives, and USB sticks.


    To create your own bookmark, use the listing on the right to find the finder that
    you want to bookmark, single-click, and then click Add below the Places box. The
    folder now appears in your bookmarks. Now whenever you need to access that folder,
    just click the bookmark! In addition to picking the bookmark in the file chooser,
    it is also available in other parts of the desktop, such as the Places menu and
    in the file manager.


    # Ubuntu in Your Language


    When you installed Ubuntu, you were asked which language the system should use.
    Although this sets the initial language for the system, you may want to change
    the language at a later date. To do this, click System > Language Support.


    Ubuntu supports a huge range of different languages, and many applications include
    a Translate This Application menu option in the Help menu so that all Ubuntu users
    can contribute translations in their language(s). If you would like to help with
    this effort, it is a fantastic contribution to the Ubuntu project.


    When the language selector first loads, it may ask you to update your language
    packs. Just click Yes to continue. Inside the dialog box a number of languages
    are listed, each of which has a Support checkbox next to it. For each language
    that you want available on the system, check the relevant boxes.


    When you have selected the boxes, click the Apply button, and the appropriate
    language packs are downloaded and installed. Now use the Default Language combo
    box to choose the new language. You need to log out and log in for the changes
    to take effect.


    +   TIP


    Choosing a New Language

    When you see the login screen, you can use the Language button to choose a language
    for that specific login session. When you select the language, you are asked if
    you want to make the default language or use it just for that specific session.'
