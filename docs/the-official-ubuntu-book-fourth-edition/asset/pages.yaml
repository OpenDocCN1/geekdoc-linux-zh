  md: '# The Notification Area


    In the right-hand part of the top panel is the notification area and the clock.
    The notification area is similar to the Windows system tray in that it provides
    a series of small icons that indicate something specific. A good example of this
    is Network Manager, which looks after your network connections—both wired and
    wireless—for you.


    You can fiddle with the notification area items by right-clicking them to view
    a context menu. Some icons (such as the volume control) allow you to left-click
    on them to view them. As an example, try clicking the little speaker icon and
    adjusting the slider.


    Right-click the volume icon and select Open Volume Control to access the mixer
    settings for your sound card. These settings configure the speakers, microphone,
    line-in, and any other sound inputs or outputs.


    # The Clock


    Next to the notification area is the clock. Click on the clock to view a calendar.
    Later, when you use Evolution, items that are added to your calendar in the clock
    applet too. Instead of opening up Evolution to find out when your dentist appointment
    is, just click on the clock to see it immediately.


    Customize your clock by right-clicking it and selecting Preferences.


    # The Taskbar


    The taskbar sits at the bottom of the screen. This small bar is always visible
    and indicates which applications are currently open. In addition to this, the
    taskbar also sneaks in a few other handy features.


    To the far left of the taskbar is the Hide/Show Desktop button. Clicking this
    button hides all of your open applications and shows the desktop. Clicking it
    again redisplays them. This button is useful when you need to quickly access something
    on your desktop.'
