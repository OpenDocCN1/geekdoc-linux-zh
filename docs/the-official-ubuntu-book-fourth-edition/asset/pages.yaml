- img_proc: true
  md: '# A Couple of Installer Tricks


    As we''ll explore below, in terms of partitioning and storage, server installations
    can be quite a bit more complex than desktop ones. There''s a small bag of useful
    tricks with the installer that can help when things get hairy.


    The installer itself runs on virtual console 1. If you switch to console 2 by
    pressing Alt-F2, you''ll be able to activate the console by hitting Enter and
    land in a minimalistic (busybox) shell. This will let you explore the complete
    installer environment and take some matters into your own hands if necessary.
    You can switch back to the installer by pressing Alt-F1. Console 4 contains a
    running, noninteractive log of the installation, which you can inspect by pressing
    Alt-F4. Finally, it''s sometimes useful to be able to connect to another server
    during installation, phép to upload a log file or gain access to your mailbox
    or other communication. By default, the shell on console 2 will not provide you
    with an ssh client, but you can install one by running apt install openssh-client-udeb
    after the installer has configured the network. Now you can use the ssh and scp
    binaries to log in or copy data to the server of your choice.


    # Partitioning Your Ubuntu Server


    Deciding how to partition the storage in your server is a tricky affair and certainly
    no exact science. Generally, it''s a good idea to have at least three partitions
    separate from the rest of the system:


    +   - /home: where all the user files will live

    - /tmp: temporary scratch space for running applications

    - /var: mail spools and log files


    # Partition Security and Separating Logs and Spools


    There are several options that you can turn on for specific system partitions
    that afford you extra security. We''ll explain them later in this chapter, in
    the section dealing with security.


    As an aside, if your server will keep extensive mail and news spools, you might
    want to further separate /var into partitions for /var/log and /var/spool. Having
    both on the same partition might cause severe I/O congestion under heavy use.'
