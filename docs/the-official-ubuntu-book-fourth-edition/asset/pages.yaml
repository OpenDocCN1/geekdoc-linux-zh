  md: '# 158 Chapter 5 The Ubuntu Server


    Last but not least, recent Ubuntu versions support encrypting LVM volumes right
    from the installer, which is music to paranoid ears: Then you can now have full-disk
    encryption from the moment you install your machine. Encrypted LVM is offered
    as one of the "guided" options in the partitioning menu, but you can also accomplish
    the same result by.


    # TIP


    LVM Doesn''t Provide Redundancy

    The point of LVM storage is fluidity, not tolerance. In our example, the logical
    volume containing the /var filesystem is sitting on a volume that spans two drives.
    Unfortunately, means either drive failure will corrupt the entire filesystem,
    and LVM intentionally doesnt contain functionality to prevent this.


    Instead, when you need fault tolerance, build your volume groups from physical
    volumes that are sitting on RAID. In our example, we could have made a partition
    spanning the entire size of the 10GB hard drive and allocated it to physical space
    for a RAID volume. Then, we could have made two 10GB partitions on the 20GB hard
    drive and made the first also a physical space for RAID. Entering the RAID configurator,
    we would create a RAID 1 array from the partitions on both drives, but instead
    of placing a regular filesystem on the RAID array as a physical space for LVM.
    When we get to LVM configuration, the RAID array would show up as any other physical
    volume, but we know that the physical volume is redundant. If a physical drive
    fails beneath it, LVM won''t ever know, and no data loss will occur. Of course,
    standard RAID array caveats apply so if enough drives fail and shut down the array,
    LVM will still come down kicking and screaming.


    # Encrypted Home and Software Selection


    After you have partitioned the disk, the installer will install the base system
    and ask you for user information, much like with the desktop install. Then you''ll
    be asked a question you might not have seen before: Do you wish to encrypt your
    home directory?


    If you answer in the affirmative, your account password will take on a second
    purpose. Rather than just allowing you to log in, it will also be used to transparently
    encrypt every file in your home directory, turning it into gibberish for anyone
    without the password. This means that if your computer gets stolen, your data
    remains safe from prying eyes as long as your password is not too easy to guess.
    If this familiar, it''s because this functionality exists as FileVault on Apple''s
    Mac OS X and is also a subset of the BitLocker system that debuted in Windows
    Vista. (The directory encryption system used in Ubuntu is also cryptfs, which
    is decidedly less punchy name. We''re working on it.)'
