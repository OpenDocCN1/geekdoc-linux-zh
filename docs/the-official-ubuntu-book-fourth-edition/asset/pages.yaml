  md: '# Customizing Ubuntu''s Look and Feel


    Whenever we put someone in front of Ubuntu for the first time


    # Changing the Background


    To change the background of your desktop, right-click it select Change Desktop
    Background. Inside the dialog box that appears, choose your wallpaper by clicking
    on an image, and the desktop background will automatically change. Ubuntu comes
    with a limited range of pre-installed wallpapers, so it is likely that you will
    want to add your own wallpaper. To do this, save your wallpaper somewhere on your
    computer, and then use the Add Wallpaper button to select it. The new wallpaper
    can be selected from the list.


    If you are not really a wallpaper kind of person and would prefer a color for
    the background, you can use the Desktop Colors controls at the bottom of the dialog
    box. The combo box provides three different types of background: Solid Color,
    Horizontal Gradient, and Vertical Gradient. Next to the combo box, click on the
    color chip to select the relevant color(s).


    # Changing the Theme


    When you are using your applications, the visual appearance of the buttons, scroll
    bars, widgets, and other bits and pieces are controlled by the theme. The built-in
    theming system can make your applications look radically different, and Ubuntu
    ships with a number of themes that you can.


    Choosing a New Theme To choose a new theme, click System > Preferences and then
    click on the Theme tab. Inside the tab that pops up are a number of themes that
    you can choose. Just click on a theme, and the desktop will be adjusted automatically.
    You can further customize your theme by clicking the Customize button. A new dialog
    box appears that has tabs for the different parts of the theme you can config-'
