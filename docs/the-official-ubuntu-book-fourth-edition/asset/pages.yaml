  md: '# MOTUs


    Another very special team that deserves an in-depth description in this book is
    the MOTUs. The MOTUs are the maintainers of Ubuntu''s universe repository, and
    the acronym stands, jokingly (if not slightly embarrassingly), for Masters of
    the Universe. MOTUs call themselves the “brave souls who try to keep the universe
    section of Ubuntu in shape.”


    MOTUs are package maintainers. They maintain, as a group, the vast majority of
    packages in the Ubuntu archive. Several of the packages have been well maintained
    by the MOTUs, with time, migrated into the main component and become an official
    part of the Ubuntu distribution. Because Ubuntu does not support or quality promises
    regarding the packages in universe, the MOTU team provides a way for maintainers
    to sharpen their teeth and (since it’s sometimes unavoidable) make mistakes before
    jumping into the higher-responsibility packages in.


    The roles and responsibility of the MOTUs are many. Two important ones are these:


    +   1. Filing and fixing bugs on Ubuntu packages using Malone

    2. Getting new or updated packages included in Ubuntu’s universe


    This work is done largely by full-fledged MOTU members, who as team members, can
    upload directly into Ubuntu. This group is helped by MOTU hopefuls, who work closely
    with the MOTUs and whose work is then sponsored into Ubuntu. Many of these hopeful
    graduate to full-fledged MOTUs, and many MOTUs eventually are granted full-core
    status. This three-step system is the process by which almost all new maintainers
    learn to maintain packages in Ubuntu and gain their stripes.


    # The Community Council


    The Community Council and the Technical Board are the highest-level governance
    structures within Ubuntu. The Community Council, as it pertains to all Ubuntu
    members and activities, is arguably the most powerful team'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'within the Ubuntu project. The Community Council is charged with supervising
    the social structures, venues, and processes of the project.


    The Community Council''s day-to-day work involves five major areas in Ubuntu.
    The first, and the most straightforward, is the maintenance of the Ubuntu Code
    of Conduct. The Community Council is the only body that can approve revisions
    to the code. Because the Community Council does not ask each member to “reagree”
    to the code when it is changed, each of these revisions must be fully within the
    spirit of the previous drafts.


    The second charge of the Community Council is the arbitration of disputes that
    cannot be handled within a particular team or arise between teams. Very frequently,
    these are disputes about the Code of Conduct that may require clarification of
    a part of the Code of Conduct or a description of whether any of the code was
    violated by a particular action or behavior. However, the Community Council''s
    purview is not limited to handle disputes in any nontechnical situation. In most
    situations, the Community Council does not take action against individuals, but
    rather, helps group members come to agreement or consensus among themselves. If
    this fails, the Community Council can ask a maintainer or other member of the
    community to apologize and refrain from particular behavior or to leave the community.
    The Council promises that nobody will be asked to leave without a substantial
    review and an opportunity to defend him- or herself.


    A third area of council work is the creation and dissolution of teams and the
    appointment of team leaders. New teams are proposed to the Community Council in
    the manner described earlier in the section on teams, and the Community Council
    either approves the request or asks the proposer to wait. In defunct or inactive
    teams can similarly be dissolved by the Community Council. In cases where team
    leadership is requested, the Community Council can appoint leaders of teams or
    shift leadership to different team members. In most situations, the appointment
    of team leaders is an internal team matter but, when requested, the Community
    Council is available- to intervene.


    Fourth, the Community Council is responsible for approving and welcoming new members
    to the project. This will be described in more depth in the upcoming subsection
    on membership.'
