  md: 'THIS CHAPTER INTRODUCES THE Ubuntu Forums by describing what they are, why
    they exist, and some of the history and quirks that make them a place where people
    come for the tech support and end up staying for the community. Whether you have
    used Internet forums in the past or not, this chapter will give you a good introduction
    to an official Ubuntu presence on the Web, a place that is helpful, welcoming,
    and an enjoyable community to participate.


    # # What Are the Ubuntu Forums?


    An Internet forum is a Web site where people may sign up for an account and then
    communicate with one another in discussions of varying types in a casual and free-flowing
    manner. Most forums are divided into smaller areas, each dedicated to a particular
    topic or set of related topics. For those who have participated in online activities
    for a long time, Internet forums are easy-to-find and easy-to-use equivalent of
    local dial-up bulletin board systems (BBSS) from the 1980s and early 1990s, as
    well as a prettier version of Usenet news groups.


    The Ubuntu Forums were created as a place for people to come and help one another
    learn how to install, use, and customize Ubuntu. The goal was to create a place
    on the Internet that was easy to access for those who are not especially adept
    or experienced with technology. The site is divided into a number of different
    areas to make finding information easy and to make asking questions and finding
    answers simple.


    In addition, the forums exist in a very informal, sometimes whimsical atmosphere,
    where the information and tech advice are both solid and useful; the community
    is kind, gentle, and welcoming; and the spirit is often playful.


    # # A Brief History of the Ubuntu Forums


    The Ubuntu Forums were created in October 2004 by Ryan Troy, aka ubuntu-geek (we
    will talk about forum usernames later in the chapter). The forums were started
    as a personal project, an unofficial resource provided by one man who was having
    fun and trying to help people at the same time. Quickly the forums became known
    as a wonderful place to find


    382'
  merge: -1
