  md: '# Web Browsing with Konqueror


    As mentioned earlier, Konqueror can function as a Web browser as well as a file
    manager. To launch Konqueror, open the Application Launcher and navigate to Internet,
    then Web Browser. Alternately, you can launch KRunner (Alt-F2) and type in Konqueror.
    Like other modern web browsers, Konqueror provides tabbed browsing, the ability
    to have multiple pages open in the same window. To do this, select File > New
    Tab or press Ctrl-T. A new tab will be created in your open Konqueror window.
    A cool feature is that you can be browsing the Web in one tab, browsing your home
    directory in another tab, and also browsing network folders in a third tab. All
    of these functions can help manage your taskbar and keep your desktop looking
    clean and sharp.


    As a browser, Konqueror enables you to set bookmarks, change your home page, and
    use all the other features you would expect from a Web browser.


    Navigating around the Internet is no different in Konqueror than in any other
    Web browser, including Firefox, Opera, Netscape, and Internet Explorer. Just type
    the Web address into the address bar and hit Enter. For example, type type in
    www.ubuntu.com to visit the home page for Ubuntu.


    To search using Google, simply move to the search bar, and directly to the right
    of the address bar type in what you are looking for. Konqueror will use Google
    to find it for you.


    > If you are using Konqueror in the file manager mode, the Google search bar defaults
    to locate, which will search your hard drive instead of using Google''s search
    to search the Internet.


    Often when browsing the Web, you will see an orange icon at the bottom of Konqueror.
    This means there is an RSS feed available. To track this feed, simply click on
    it, and Konqueror will add it to your subscribed feeds in Akregator. We''ll talk
    more about Akregator later in this chapter.'
  merge: -1
