  md: 'To watch a video on your hard disk, click Movie > Open, and select the file
    from the disk.


    **TIP Another Way to Load Files into Totem**

    You can also load multimedia files into Totem by double-clicking them on your
    desktop or in the file manager.


    Totem also supports video streams. To watch a stream, click Movie > Open Location,
