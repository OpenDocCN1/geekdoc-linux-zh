    # Recognized Derivatives


    Beyond the officially supported derivatives, recognized derivatives use all the
    same repositories as Ubuntu and release on the same schedule, but they are not
    officially supported by Canonical in development or security.


    # Xubuntu


    Xubuntu is a version of Ubuntu built on top of the Xfce window management system.
    In Xubuntu, Xfce and its associated applications play a role analogous to KDE
    in the context of Kubuntu. Xf is small and lightweight compared to the much fancier
    GNOME and KDE. It uses fewer CPU cycles than either of the alternatives in a normal
    configuration.'
