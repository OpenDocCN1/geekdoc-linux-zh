    # U-lite


    U-lite, formerly Ubuntilite, is an Ubuntu derivative targeted at low-power computers.
    Its slogan, “Ubuntu Power for Slow Machines,” is an apt tagline for a project
    that targets computers as slow as 75Mhz Pentiums with no more than 32MB RAM. The
    project aims to provide a solution for computers that most operating system developers,
    including Ubuntu, have written off as impossibly antiquated. Most of the bells
    and whistles from Ubuntu have been stripped out in the process, but the system
    provides a compelling option for computers that would be useless with almost any
    modern operating system.


    # U-lite


    U-lite can be found at u-lite.org


    # Nexenta OS


    Nexenta OS is the first Ubuntu operating system that is not based on the Linux
    kernel. Instead, it is built on Sun Microsystems’ OpenSolaris kernel, which was
    previously proprietary but now being distributed as free software. It is the first
    distribution that combines the GNU system—all imported from Ubuntu—with OpenSolaris.


    # Nexenta OS


    Nexenta OS can be found at www.nexenta.org.


    # Launchpad


    As mentioned in Chapter 1, most of Canonical, Ltd.’s technical employees do not
    work on Ubuntu. Rather, they work on infrastructure. The majority of this infrastructure
    is a large collection of services that work together to provide the framework
    through which Ubuntu is built. This superstructure of related applications is
    collectively referred to as Launch-'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'pad. While it has several non–Web-based systems, it is almost wholly accessible
    over the Web.


    While Launchpad is primarily used to develop Ubuntu, the infrastructure was designed
    to be useful for any free software project and is becoming more popular. It aims
    to provide these projects with the code-, bug-, and translation-tracking software
    necessary to more easily and powerfully collaboratively with others and to develop
    free and open source software. Each of these functions (code, bug, and translation
    tracking) is highly integrated, making it much more ambitious, and potentially
    much more powerful, than traditional Web-based solutions with similar goals. Early
    on, the Launchpad Web page described the project as follows:


    +   A collection of services for projects in the Open Source universe. You can
    register your project, and then collaborate with the Open Source community on
    translations, bug tracking, and code.


    That description continues to be valid even as the project has expanded with support
    and specification modules. In addition to code, bug, and translation tracking,
    Launchpad provides the ability to develop with code, not just on a per-package
    or per-project level, but on the distribution level as well. If a bug has been
    reported against a piece of software in Ubuntu, it is visible to both the upstream
    and downstream projects. The project can track how its software evolves over time
    and see, at a glance, bugs apply or not. Developers can track translations in
    a similar way.


    A source of controversy in the free and open source world is the fact that the
    source code to Launchpad is not distributed. While Launchpad is designed to help
    free software, it is not free itself. This has led to fear about the risk of enclosure
    or dependence that comes from using a tool that developers cannot change, update,
    or copy. Also, while all code and history can be fully copied, some information
    (such as bug information and metadata) stays within the Launchpad system. Some
    developers feel insecure about providing this data to Canonical, Ltd. in such
    a way that they cannot copy or replicate it. Mark Shuttleworth replied to these
    fears by saying that the goals of Launchpad required that he build a community
    before the code that allows forking is distributed but that, with time, the code
    to all of Launchpad will be distributed. While several pieces of Launchpad have
    been made open, the vast majority currently remains proprietary.'
