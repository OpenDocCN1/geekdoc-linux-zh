- img_proc: true
  md: '# # APPENDIX A


    # # Welcome to the Command Line


    ONE OF THE MOST powerful parts of any Ubuntu system is the command line. It can
    also be one of the most daunting to dive into. It seems there is often little
    help, and that the commands are not easy to find or figure out. If you are willing
    to learn, the power of the command line will speed up your work and will be a
    great education that will serve you for years by increasing your ability to do
    exactly what you want to do with your computer with greater efficiency.


    While the command line is a nice addition to a desktop user''s life, it is completely
    invaluable if you run a server. The Ubuntu server installs with any graphical
    user interface, so the tools explained in this chapter and other books will be
    absolutely critical to success. And hey, remember to have fun!


    # ## Starting Up the Terminal


    The terminal can be found under Accessories > Terminal. When it first launches,
    you will see something similar to what Figure A-1 shows.


    You will see a blinking cursor preceded by some letters, and perhaps numbers and
    symbols, ending with a s. The first word in string of characters is your username,
    followed by a @. After the @, the hostname of your computer is listed, followed
    by a colon and the name of the directory you are currently in (you always start
    in your home directory, which is represented by a -).


    There are many dozens of commands. This appendix presents just a few useful ones
    in a narrative style to get you started, then lists some more with just a basic
    description and broken down by category.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# 394 Appendix A ■ Welcome to the Command Line


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_434_0.png)


    Figure A-1 The terminal window


    # # Getting Started


    First have a look at the files in your home folder by running the following command:


    ```

    username@computer:-$ ls

    ```


    The ls command lists the files in your current folder. The default command just
    displays a collection of items that are in your current directory, or location
    in the filesystem. To make ls more useful, you can type it with -al options:


    ```

    username@computer:-$ ls -al

    ```


    The -al parts are options that can be passed to the command. In this example,
    two options, a (list all files) and l (use a long display format to display file
    permissions, dates, sizes, and more), are used with ls to display all of the files
    (including hidden files) and their details.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# Building Pipelines


    # To Dash or Not to Dash?


    In command-line tools, options are added after a dash (-). Some tools, however,
    don''t need the dash. It isn''t particularly consistent, so you pay attention
    as you learn new commands.


    When move to a different directory:


    ```

    username@computer:-$ cd Desktop

    ```


    The cd command changes the directory to the place you specify after the command
    (in this case, the desktop directory). A nice shortcut that you can use when typing
    files and folders is to type the first few letters and press the Tab key to fill
    in the remainder of the file/folder name. As an example, in the previous command,
    you could type Des and press the Tab key to fill in the rest of Desktop.


    When inside a directory, you may want to have a quick look at the contents of
    a text file. To do this, use the cat command:


    ```

    username@computer:-$ cat myfile.txt

    ```


    This command prints the contents of the file on the screen (a more correct way
    to say this in computer geek jargon would be “outputs to the screen”).


    # Building Pipelines


    The power of the command line really comes into its own when you start combining
    commands by using pipelines. A pipeline uses the pipe symbol (| to string together
    a number of commands to perform a specific task. As an example, if you use the
    cat command to display the contents of a file to the screen, but the file scrolls
    past you, you create a pipeline and use the less command so you can browse the
    file:


    ```

    username@computer:-$ cat foo.txt | less

    ```


    To see how this works, break the command into parts, each separated by the pipe.
    The output of the part on the left (cat’ing file) is fed into the file with the
    less command on the right, which allows you to browse the file with the arrow
    keys.'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'Pipelines can be useful for finding specific information on the system. As
    an example, if you want to find out how many particular processes are running,
    you could run a command like this:


    ```

    username@computer:-$ ps ax | grep getty | wc -1

    ```


    You count how many getty processes are running (getti is the soft that runs a
    console session). The ps ax command on the list lists the processes on the system,
    and then the grep command searches through the process list and returns only the
    lines that contain the text “getti.” Finally, these lines are fed into wc, which
    is a small tool that counts the number of words or lines. The -l option specifies
    that the number of lines should be counted. Cool, huh?


    # Running Commands as the Superuser


    When you log in to your computer, the account you use is a normal user account.
    This account is restricted from performing various system administration tasks.
    The security model behind Ubuntu you run as a normal user all the time and dip
    into the system administrator account only when you need to. This prevents accidental
    changes or malicious installation of unwanted programs and similar things.


    To jump to this superuser account when using the terminal, put the sudo command
    before the command you want to run. As an example, if you want to restart the
    networking system from the command line, run:


    ```

    username@computer:-$ sudo /etc/init.d/networking restart

    ```


    The command to the right of sudo is the command that should be run as the administrator,
    but sudo lets you run the command as the current user. When you run the above
    command, you are asked for the administrator password. This is the same password
    as the one you established for the first user you added when you installed Ubuntu
    on the computer. If you are using that user’s account, just enter your normal
    password.


    When you have authenticated yourself to sudo, you will not be asked for the password
    again for another 15 minutes.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# Finding Help


    Each command on your computer includes a manual page—or page—that contains a list
    of the options available. Man pages are rather terse and intended only for referencing
    the different ways the command should be used. For a friendlier introduction to
    using commands, we recommend a Google search.


    To view a man page (such as the man page for ls), run:


    ```

    username@computer:~$ man ls

    ```


    The man page itself has a number of options (run man man to see them), and one
    of the most useful is -k. This option allows you to search the man pages for a
    particular word. This is useful when you don''t remember the command. As an example,
    you could find all commands related to processes by running:


    ```

    username@computer:~$ man -k processes

    ```


    The remainder of this appendix gives a brief introduction to some of the more
    common and useful commands you will encounter and want to learn, organized in
    categories based on how they are used. We will end with a short list of some other
    resources for further research.


    # Moving Around the Filesystem


    Commands for navigating in the filesystem include the following.


    +   - pwd: The pwd command allows you to know the directory in which you''re located
    (pwd stands for “print working directory”). For example, pwd in the desktop directory
    will show ~/Desktop. Note that the GNOME terminal also displays this information
    in the title bar of its window, as shown in Figure A-1.

    - cd: The cd command allows you to change directories. When you open a terminal,
    you will be in your home directory. To move around the filesystem, use cd.

    - use cd ~/Desktop to navigate to your desktop directory.

    - use cd / to navigate into the root directory.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '+   - Use cd to navigate to your home directory.


    +   - Use cd .. to navigate up one directory level.


    +   - Use cd - to navigate to the previous directory (or back).


    +   - If you want to go directly to a specific, known directory location at once,
    use cd /directory/otherdirectory. For example, cd /var/www will take you directly
    to the /www subdirectory of /var.


    # # Manipulating Files and Folders


    You can manipulate files and folders with the following commands.


    +   - cp: The cp command makes a copy of a file for you. For example, cp file
    makes an exact copy of the file name you entered and names the copy foo, but the
    first file will still exist with its original name.


    +   - mv: The mv command moves a file to a different location or renames a file.
    Examples are as follows: mv file foo renames the original file to foo. mv foo
    ~/Desktop moves the foo to your desktop directory does not rename it. You must
    specify a new filename to rename a file. After you use mv, the original file no
    longer exists, but after you use cp, as above, that file stays and a new copy
    is made.


    +   - To save on typing, you can substitute ~ in place of the home directory,
    as /home/jono/pictures is the same as ~/pictures.


    > NOTE If you are using mv with sudo, which is often necessary outside of your
    home directory, you will not be able to use the ~ shortcut. Instead, you will
    have to use the full pathnames to your


    +   - rm: Use this command to remove or delete a file in your directory, as in
    rm file.txt. It does not work on directories that contain files.


    +   - ls: The ls command shows you the files in your current directory. With certain
    options, it lets you see file sizes, when files were created, and file permissions.
    For example, ls ~ shows you the files that are in your home directory.'
  merge: -1
