    **Getting DVDs to Work** Ubuntu comes with DVD support for unencrypted DVDs. With
    the DVD industry being what it is, the majority of DVDs are encrypted, and if
    you want to watch them, you need to ensure that a library can decrypt these DVDs
    is installed. Unfortunately, this library needs to be installed separately and
    is not included with Ubuntu. Refer to the Ubuntu restricted formats page at https://wiki.ubuntu.com/RestrictedFormats
    for details.


    With the library installed, insert a disk into your computer, and Ubuntu will
    automatically start Totem to view the disk. Alternatively, fire up Totem, and
    click Movie > Play Disk to play the DVD. Totem doesn''t support DVD menus but
    you can still use it to play a DVD.


    If you are settling down to watch a movie, you may want to configure a few other
    settings. First click View > Aspect Ratio to select the correct ratio for your
    screen, and then select View > Fullscreen to switch to fullscreen mode. To exit
    fullscreen, just move your mouse, and some-screen controls will appear.


    **Control Totem with a Remote Control**

    Totem supports the Linux Infrared Control (LIRC) library so you can use a remote
    control while watching your media.


