- img_proc: true
  md: '# Teams, Processes, and Community Governance


    The Ubuntu Web site describes the goals of its community governance system as
    threefold.


    +   1. Ensure that a process is defined that allows people to contribute to decisions
    regarding the Ubuntu community and distribution.

    2. Ensure that decisions regarding the Ubuntu distribution and community are made
    in a fair and transparent fashion.

    3. Ensure that necessary decisions are actually made, even when there is no clear
    consensus amongst the community.


    With these goals in mind, Ubuntu’s system is based on the delegation of decision-making
    power to small and medium-sized teams. When agreements arise, they are handled
    within a relevant team. In the cases of larger teams, team councils handle a variety
    of dispute resolutions in a very structured fashion. When teams cannot resolve
    their disagreements or when there are disagreements between teams, issues are
    forwarded to either the Community Council or the Technical Board–depending on
    whether the issue is technical in nature. As the financier and the project’s progenitor,
    Shuttleworth on both boards and occupies a special position as the self-appointed
    benevolent dictator for life (SABDFL). Users can participate in the Ubuntu governance
    structure by serving on teams and by approving members of both the Community Council
    and the Technical Board as Ubuntu members and maintainers.


    # Teams


    Most work in Ubuntu is delegated to a set of teams, each responsible for a particular
    area of work in Ubuntu. A sample of important teams (which is by no means complete)
    might include the forums, marketing, art, documentation, kernel, server, laptop,
    and translation teams. Anyone with an interest in a particular aspect of the Ubuntu
    project can join a team’s discussion and contribute to its decisions.


    When participants feel that a particular area is underserved, they can go ahead
    and build a new team by starting work and writing up a proposal for consideration
    by the Community Council, which approves the creation of all new teams. Rather
    than catalyzing work with the creation of a team, the Community Council likes
    to recognize existing work with official team'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'status. Teams should always involve the participation of several individu-als.
    There are no one-man or one-woman teams in Ubuntu.


    Teams are so large and important that they have built their own more advanced
    governance structures in the forums of team councils. These councils are appointed
    by the community council from active mem-bers and leaders within the team and
    as delegates of the Community Council for team and its domain in the project.
    These teams have regular meetings, resolve conflicts, report to the Community
    Council, and in some cases even grant membership of the Community Council. Current
    large teams with councils include the forums, Edubuntu, Kubuntu, and MOTU teams.


    # Local Community Teams


    Local community teams, affectionately referred to as LoCos in the com-unity, an
    extremely important type of team. Each LoCo is respons-ible for promoting, supporting,
    and representing Ubuntu in a particular locale. These locales are usually geographical
    and frequentlywide, although in some situations they may overlap geographically.
    Ubuntu tries to encourage LoCos to work together whenever possible.


    LoCos are like Linux User Groups (LUGs) and may often work closely or be associated
    with a LUG. LoCos are often involved in localization or translations of Ubuntu
    into local languages and in advocacy in local schools, public administrations,
    and communities. The best LoCos regularly for social events, talks, and discussion.
    Often, they meet for installests, where team members help new users install Ubuntu
    onto their computers. Representatives of LoCos are asked to assist with localization
    matters, to speak on behalf of the Ubuntu project at local conferences and trade
    shows, and to organize a booth or presence at such events.


    Canonical, Ltd. provides each team with a mailing list and a domain name (usually
    in the form of ubuntu-<CC>.org, where CC is the country’s two-letter country code).
    Canonical also is willing to host LoCo Web pages, wikis, forums, blogs, download
    areas, and additional mailing lists. LoCos are open to participation by anyone.'
