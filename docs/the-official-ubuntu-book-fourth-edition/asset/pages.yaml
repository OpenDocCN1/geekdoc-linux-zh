    software developers and advocates—Eric S. Raymond and Bruce Perens—saw the important
    business proposition offered by a model that could harness volunteer labor or
    interbusiness collaboration and create intrinsically better software. However,
    they worried that the term free software was problematic for late reasons. First,
    it was highly ambiguous—the English word free means both gratis, or at no cost
    (e.g., free as in beer), and liberated in the sense of freedom (e.g., as in free
    speech). Second, there was a feeling, articulated most famously by Raymond, that
    all this talk of freedom was scaring off the very business executives and decision
    makers whom the free software movement needed to impress in order to succeed.


    To tackle both of these problems, this group coined a new phrase—open source—and
    created a new organization called the Open Source Initiative. The group set at
    its core a definition of open source software that overlapped completely and exclusively
    with both Stallman''s four-part definition of free software and other community
    definitions that were also based on Stallman''s.


    One way to understand the split between the free software and open source movements
    is to think of it as the opposite of a schism. In religious schisms, churches
    separate and do not work or worship together because of small differences in belief,
    interpretation, or motivation. For example, most contemporary forms of Protestant
    Christianity agree on almost everything but have separated over some but irreplaceable
    differences. However, in the case of the free software and open source movements,
    the two groups have fundamental disagreements about their motivation and beliefs.
    One group is focused on freedom, while the other is focused on pragmatics. Free
    software is most accurately described as a social movement, while open source
    is a development methodology. However, the two groups have no trouble working
