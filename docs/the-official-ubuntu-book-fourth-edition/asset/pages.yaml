    # QUICK TIP


    You can switch between multiple applications in Ubuntu just like in Windows by
    press-ing Alt-Tab. When you press this key combination, a small window appears
    that can be used to switch between active applications.


    To the right of the applications area are two small rectangles called the workspaces.
    Each of these rectangles represents another screen in which you can view an application.
    As an example, you may be using your Web browser and e-mail client while talking
    to your friends in a chat on the first desktop and working on a document on the
    second desktop. You can just click your virtual desktop to switch to access your
    different applications. Another tip applies when you are moving between virtual
    desktops—if you have an application on the first desktop, just rightclick the
    brown window or the taskbar entry, select Move to Another Workspace, and pick
    the relevant workspace number. The menu also has Move to Workspace Left and Move
    to Workspace Right options. This makes moving applications between your workspaces
    quite simple.


    # QUICK TIP


    Although Ubuntu has only two workspaces configured by default, you can have many—or
    few—as you like. To configure them, right-click on one of the workspaces in the
    bottom right-hand corner of your screen, and select Preferences from the menu.


    To the right of the workspaces is the trash. Files that are dragged onto this
    icon are destined to be deleted. To fully delete these files, right-click the
    trash and select Empty Trash.


    # TIP


    Usability and the Ubuntu DesktopnThroughout the development of the Ubuntu desktop,
