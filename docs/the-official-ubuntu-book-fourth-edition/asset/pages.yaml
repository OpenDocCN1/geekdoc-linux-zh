    # Tips and Tricks


    The more you use Kubuntu, the more tips and tricks you will learn to make your
    computer experience better and easier. Kubuntu can be configured to do almost
    anything you would like.


    **Run Programs Automatically When Kubuntu Starts** You might like to start some
    programs automatically every time you log in to your system. For example, to help
    you with your Kubuntu work, you might want to access channels IRC every day via
    Conversation. There are four easy steps to set this up using the session management
    feature of KDE.


    +   1. Launch all the applications you would like to open automatically.


    +   2. Open up System Settings from the Application Launcher, and click on the
    User Management section.


