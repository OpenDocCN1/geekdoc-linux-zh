    Ubuntu clients. This setup also allows users to have their LTSP thin clients receiving
    their DHCP network addresses from a single network server.


    Essentially the choice of network design layout will impact the number of network
    cards installed in your server. It is primarily this that affects the difference
    between the standard Ubuntu install and the LTSP install.


    **The Installation Procedure** The installation procedure from the alternate CD
    looks very different from the desktop CD, but the questions asked are largely
    the same. The alternate CD is all text based, which can be a little daunting at
    first, but you will find installing Ubuntu in this way quicker because it doesn''t
    require the entire desktop session to be loaded.


    Remember that the server CD sets up LTSP for you. If you are planning to run an
    LTSP server, the easiest installation method is to use the Ubuntu alternate.


    After the CD has booted, press F4 and select Install an LTSP server, and then
