    packages; however, this application was no longer developed and was not updated
    for KDE 4. The developers of Kubuntu switched to KPackageKit, and many improvements
    to the KPackageKit were made during the release cycle. The developers of KPackageKit
    and the Kubuntu developers worked together to make sure this application was up
    to the quality that Kubuntu users expect.


    KPackageKit is found in the Application Launcher under Applications > System as
    Software Management and can also be launched through Krunner as Software Management.


    Upon launching Software Management, you are presented with the KPackageKit application
    (Figure 8-12).


    Three options are available in Software Management: Add and Remove Software (through
    the Software Management section), Software Updates, and Settings.


    In order to add a new piece of software, type the name of the application in the
