- img_proc: true
  md: 'When your Ubuntu server first boots, you’ll have to log in with the user you
    created during installation. Here’s an important point that bites a number of
    newcomers to Ubuntu: Unlike most distributions, Ubuntu does not enable the root
    account during installation! Instead, the installer adds the user you created
    during installation to the admin group, which lets you use a mechanism called
    sudo to perform administrative tasks. We’ll show you how to use sudo in a bit.
    In the meantime, you’re interested in the rationale for the decision to disable
    direct use of the root account, simply run man sudo_root after logging in.


    > **Care and Feeding of RAID and LVM Arrays**

    If you set up some of these during installation, you''ll learn how to manage the
    arrays after the server is installed. We recommend the respective how-documents
    to The Linux Documentation Project at


    www.tld.org/HOWTO/Software-RAID-HOWTO.html and

    www.tld.org/HOWTO/LVM-HOWTO.


    The how-tos sometimes get technical, but most of the details should sound familiar
    if you''ve understood the introduction to the subject matter that we gave in this
    chapter.


    # Ubuntu Package Management


    Once your server is installed, it contains only the few packages it requires to
    boot and run properly whatever software you selected at the software screen. In
    the comfort of the GNOME graphical environment on an Ubuntu desktop, we could
    launch Synaptic and point and click our way through application discovery and
    installation. But on a server, we must be shell samurai.


    # The Ubuntu Archive


    Before we delve into the nifty-gritty of package management, let’s briefly outline
    the structure of the master Ubuntu package archive, which we mentioned in the
    introduction to this chapter. Each new release has five repositories in the archive,
    called main, restricted, backports, universe, and multiverse. A newly installed
    system comes with only the first two enabled plus the security update repository.
    Here’s the repository breakdown.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '+   - Main: This includes all packages installed by default; these packages
    have official support.


    +   - Restricted: These are packages with restricted copyright, often hardware
    drivers.


    +   - Backports: These are newer versions of packages in the archive, provided
    by the community.


    +   - Universe: The universe includes packages maintained by the Ubuntu community.


    +   - Multiverse: The multiverse includes packages that are not free (in the sense
    of freedom).


    The term *official support* is a bit of a misnomer, as it doesn''t refer to support
    that one would purchase or obtain but speaks instead of the availability of security
    updates after a version of Ubuntu is released. Standard Ubuntu releases are supported
    for 18 months, which means that Ubuntu''s parent company, Canonical, Ltd., guarantees
    that security updates will be provided, free of charge, for any vulnerabilities
    discovered in software in the *main* repository for 18 months after a release.
    No such guarantee is made for software in the other repositories.


    Of particular note is that Ubuntu releases have longer support cycles. These releases
    are denoted by the acronym LTS (Long Term Support) in their version number. The
    latest Ubuntu LTS, version 8.04 (Hardy), is supported for five years on servers,
    while the LTS is out for 2010.


    # APT Sources and Repositories


    You''re now aware of the structure of the Ubuntu archive, but we didn''t explain
    how to actually modify the list of repositories you want to use on your system.
    In Debian package management parlance, the list of repositories is part of the
    list of Advanced Package Tool (APT) sources. (Keep your eyes peeled: Many of the
    package tools we''ll discuss below with the prefix *apt.*) These sources tell
    APT where to find available packages: in the Ubuntu archive on the Internet, on
    your CD-ROM, or in a third-party archive.'
