    # I Still Can''t Write to My Drive!


    If you have permissions to access the drive but still can''t write to it, the
    problem is likely to be a filesystem issue. On a storage device such as a floppy
    disk, USB key, or hard drive, a specific type of filesystem is used to manage
    how the files are written to the physical disk. Ordinarily, you don’t need to
    worry about this. But when things go wrong, it’s time to figure out the details.


    There are a number of different filesystems The default Linux filesystem is ext3.
    In the Windows world, a few other filesystems are available, such as FAT16, FAT32,
    and the NTFS system used by Windows NT.


    Although FAT16 and FAT32 are fully supported in Ubuntu, an NTFS filesystem cannot
    yet be written reliably on a Linux computer. Recent new code has gone into the
    Linux kernel to write to NTFS with FUSE or a kernel module. This code is still
    rather experimental and not included in a stock Ubuntu system, so be careful when
    playing with it.'
