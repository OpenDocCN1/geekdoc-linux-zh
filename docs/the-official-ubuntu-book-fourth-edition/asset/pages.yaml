  md: '# Ubuntu Promises and Goals


    of the Ubuntu Philosophy of Software Freedom are these core ideals:


    +   1. Every computer user should have the freedom to run, copy, distribute, study,
    share, change, and improve their software for any purpose without paying licensing
    fees.

    2. Every computer user should be able to use their software in the language of
    their choice.

    3. Every computer user should be given every opportunity to use software, even
    if they work under a disability.


    The first item should be familiar by now. It is merely a recapitulation of Stallman’s
    free software definition quoted earlier in the section for software history. In
    it, the Ubuntu project makes explicit its goals that every user of software should
    have the freedoms required by free software. This is important for a number of
    reasons. First, it offers users all of the practical benefits of software that
    runs better, faster, and more flexibly. More important, it gives every user the
    capability to transcend his or her role as a user and a consumer of software.
    Ubuntu wants to be empowering and to work in the ways that users want it to work.
    Ubuntu wants all users to have the ability to make it works for them. For this,
    software must be free, so Ubuntu makes this a requirement and a philosophical
    promise.


    Course, the core goals of Ubuntu do not end with the free software definition.
    In fact, the project articulates two new, equally important goals. The first of
    these, that all computer users should be able to use their computers in their
    chosen languages, is a nod to the fact that the majority of the world’s population
    does not speak English while the vast majority of software interacts only in that
    language. To be useful, source code comments, programming languages, documentation,
    and the texts and menus in computer programs must be written in some language.
    Arguably, the world’s most international language is a reasonably good choice.
    However, there is no language that everyone speaks, and English is not enough
    to the majority of the world’s population that does not speak it. A computer can
    be a great tool for empowerment and education, but only if the user can understand
    the words in the computer’s interface. As a result, Ubuntu believes that it is
    the project’s—and community’s—responsibility to ensure that every user can easily
    use Ubuntu to read and write in the language with which he or she is most comfortable.'
