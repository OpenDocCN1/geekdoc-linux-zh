- img_proc: true
  md: '# How May I Participate?


    other Ubuntu users who are knowledgeable, helpful, and friendly. The forums caught
    the eye of Canonical very early on, and in November 2004, in recognition of the
    solid foundation and great atmosphere that had already been established, the forums
    became the Official Ubuntu Forums. The forums hosting continued to be paid for
    by Ryan and the occasional donations of forum community members until March 2006,
    when Canon graciously offered to host the forums on its own servers. In June 2007,
    the forums’ domain name, license, and assets were all transferred to Canonical,
    which now maintains sole ownership.


    Over the years, the forums have changed their look and feel several times, but
    one thing has always remained: the feeling of community. The Ubuntu Forums began
    as a small group of playful geeks (meant in the best of ways) who gathered to
    have some fun and help one with a new and interesting Linux distribution in a
    lighthearted and welcoming atmosphere. As of this writing, the forums have well
    over 750,000 members, with an average of eight and fifteen thousand at any given
    time, and yet the friendliness and helpful community feeling remains.


    # How May I Participate?


