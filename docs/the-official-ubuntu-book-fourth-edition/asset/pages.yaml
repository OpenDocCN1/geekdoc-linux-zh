    # Running Another OS in Ubuntu


    Some of you read the title of this recipe and wondered how on earth you run another
    OS on an existing OS. Surely such a thing is not possible? Well, actually, it
    is.


    In recent years, virtualization technology has been developed to simulate a computer
    in software. You can use this technology to boot a virtual computer in a window
    and run an entire operating system on it. There are a few options open to the
    Ubuntu user to enable this functionality: qemu, kvm, and VirtualBox.


    Qemu and kvm have a similar core and are both command-line based, although various
    graphical front ends exist to simplify them. The main differences are their speed
    and hardware support. Many modern CPUs have hardware features (often called VT,
    VMX, or SVM) that enable virtualization software to more closely interact with
    the hardware to improve performance. kvm supports VT where qemu does not. Qemu
    does have an extra kernel-level module called kqemu, which mitigates the lack
    of VT support and improves performance accordingly.


    VirtualBox comes in two main incarnations: a free source edition (OSE) and a binary-only
    version. The binary-only nonfree version is almost identical to the OSE but also
    currently features USB support.


    In recent versions of Ubuntu, the OSE edition of VirtualBox is available in the
    universe repository. The nonfree version of VirtualBox can be obtained from virtualbox.org,
    where an additional Ubuntu-compatible repository can be used to simplify installation.


    All of the above-mentioned virtualization options can run Windows, FreeBSD, Netware,
    and even other Ubuntu installations. We now describe how to get started with each
    of the three in this turn.'
  merge: -1
