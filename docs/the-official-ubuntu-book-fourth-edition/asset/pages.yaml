    # Playing and Ripping CDs


    When you pop a CD into your CD drive, Audio CD Extractor (Sound Juicer) automatically
    loads to play your CD. If you are connected to the Internet, the CD is looked
    up on the Internet, and the album details and song titles are displayed.


    **Ripping Songs as Ogg** Sound Juicer is not just a CD player but a ripper too.
    Using a ripper you can convert the songs on the CD into files that you can play
    on your computer. By default, Sound Juicer rips the files in the Ogg format, which
    provides better sound quality than MP3 at a smaller size. By default, the ripped
    files are stored in the format discussed earlier, with each artist as a folder
    and albums as folders.


    To rip songs, just select the checkboxes of the songs you want (by default, all
    songs are selected), and then click Extract. Each song is then stored in your
    Music folder, and the song titles are used as the names of the files.


    **Ripping Songs as MP3s** Although the default Ogg support is recommended in most
    situations, you may prefer to rip MP3 files if you have a digital audio player
    that does not support Ogg files. To do this, you need to configure Sound Juicer
    to enable MP3 support.'
