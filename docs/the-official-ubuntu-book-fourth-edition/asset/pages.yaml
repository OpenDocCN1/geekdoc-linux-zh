    # Using and Abusing Devices and Media


    With the increasingly cheap prices of hardware and media, typical users are burning
    more and more CDs and using USB memory sticks.


    Using these kinds of devices in Ubuntu is simple and intuitive. In the vast majority
    of cases, you just plug them in and they work. Each device needs to be mounted
    before it is used, but Ubuntu automatically mounts for you. The main point to
    remember is to always mount the device before you remove it. Even floppy disks
    should be properly mounted before they are removed. Unmounting a device ensures
    all data has been copied to it before you pull it out.


    > **TIP** Problems Unmounting

    If you have problems unmounting a device, make sure that you are not using it
    in. As an example, if you have an open file manager window looking at the files
    on the device, it is currently being used and, as such, cannot be unmounted. As
    a general rule, just make sure you close everything down from the device and everything
    will be fine.


    If at any time you are unsure which devices are plugged into your computer, click
    Places > Computer to see a list of the drives available.


