    # How Can I Monitor the Weather?


    Besides looking out the window, you can add a weather applet to a panel that shows
    the current temperature along with an icon that indicates sunshine or rain. Right-click
    a panel, and select Add to Panel. Drag the weather applet (under Accessories)
    to an empty spot on the panel, and click Close. Now right-click the weather applet,
    select Preferences, and select the Location tab. From here you can select your
    city or a city in the vicinity. Click Close when you are done. If you want more
    detailed information, just click the applet.


    # How Do I Make Ubuntu Bread?


    With many recipes in this chapter to solve common problems or perform small tweaks
