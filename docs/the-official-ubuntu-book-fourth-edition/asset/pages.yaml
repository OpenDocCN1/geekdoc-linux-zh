- img_proc: true
  md: '# Installing Ubuntu Server 157


    want to use for LVM just as you did with RAID, but tell the installer to use them
    as physical space for LVM. Note that in this context, PVs are not actual physical
    drives; they are the partitions you are creating.


    You don''t have to devote your entire drive to partitions for LVM. If you''d like,
    you''re free to create actual filesystem-containing partitions alongside the storage
    partitions used for LVM, but make sure you''re satisfied with your partitioning
    choice before you proceed. Once you enter the LVM configurator in the installer,
    the partition layout on all drives that contain LVM partitions will be frozen.


    Let''s look back to our fictional server, but let''s give it four drives, which
    are 10GB, 20GB, 80GB, and 120GB in size. Say we want to create an LVM partition,
    or PV, using all available space on each drive, and combine the first two PVs
    into a 30GB volume group and the latter into a 200GB one. Each VG will act as
    a large virtual hard drive on which we can create logical volumes as we would
    normal partitions.


    As with RAID, arrowing over to the name of each drive and hitting Enter will let
    us erase the partition table. Then hitting Enter on the FREE SPACE entry lets
    us create a physical volume—a partition that we set to be used as a physical space
    for LVM. Once all three LVM partitions are in place, we select Configure the Logical
    Volume Manager on the partitioning menu.


    After a warning about the partition layout, we get to a rather spartan LVM dialog
    that lets us modify VGs and LVs. According to our plan, we choose the former option
    and create the two VGs we want, choosing the appropriate PVs. We then select Modify
    Logical Volumes and create the LVs corresponding to the normal partitions we want
    to put on the system—say, for each of /,var,/home, and /tmp.


    You can already see some of the partition fluidity that LVM brings. If you decide
    you want a 25GB logical volume for /var, you can carve it out of the first VG
    you created, and /var will magically span the two smaller hard drives. If you
    later decide you''ve given /var too much space, you can shrink the filesystem
    and then simply move over some of the storage space from the first VG to the second.
    The possibilities are endless.'
