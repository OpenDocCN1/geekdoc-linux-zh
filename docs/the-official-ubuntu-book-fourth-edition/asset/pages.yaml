    +   - Search for Files: Use this to search for files on your computer.


    +   - Recent Documents: Click this submenu to display the most recent documents.


    # Configuring Your System


    The third and final menu, System, is used to configure and customize your system,
    access help, and report problems. Inside the menu are a few options, including
    these:


    +   - Preferences: This submenu contains items for customizing and feel of your
    desktop. Each of these settings applies only to the desktop of a user who is logged
    in. If you log in as another user, the settings change to that user''s preferences.


    +   - Administration: This submenu is used to configure systemwide settings as
    networking, users, printing, and more. To use these menu items, you need to know
    the system administrator password.


    +   - Help and Support: With this you can access the Ubuntu Help Center, which
    provides documentation and guides for your Ubuntu desktop.


    Feel the Power


    When you installed Ubuntu, you were asked for a username and password for the
    system. This password not only provides access to your normal user account but
    also accesses the all-powerful Administration features. As such, when you access
    the options and are asked for the password, just enter your normal password, and
    you can use those features.


    This feature applies only to the first user account that you created on the system.
    If you add other accounts, those users cannot access the Administration options
    unless you explicitly give them access.'
