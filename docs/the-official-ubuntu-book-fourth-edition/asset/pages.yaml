    a very familiar interface for burning and copying CDs (Figure 8-30).


    Simply click on one of the icons from the Kreat screen that describes the project
    you would like to create, for example, a new audio CD, a new data CD, or a new
    data DVD project. You can even copy a CD. After the new project has been started,
    simply drag the files you want from the top section to the lower section (Figure
    8-31).


    Once you have moved the files, select Burn, and sit back while your new CD is
    created.


