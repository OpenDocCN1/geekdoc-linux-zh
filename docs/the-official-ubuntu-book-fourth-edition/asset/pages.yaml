    # Managing Repositories


    The Software Management application has the ability to manage the repositories
    you would like to use. To change which repositories are being used, open Software
    Management and select settings and the select “Edit Software Sources.\ After you
    provide the correct password, a new window will open up (see Figure 8-15).


    Software Sources is divided into five sections: Kubuntu Software, Third-Party
    Software, Updates, Authentication, and Statistics.


    Packages are organized into four groups or repositories: main, restricted, universe,
    and multiverse. The main repository contains applications that are free software,
    programs that allow for complete distribution and are supported by the Kubuntu
    team. When you install something from the


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_330_0.png)


    **Figure 8-15** Software Sources lists'
