  md: '# Chapter 3 Using Ubuntu for the Desktop


    TIP


    # Vendor Lock-?


    In the proprietary software world, it is common for each application to have its
    own closed file format that only the vendor knows how to implement. When a person
    uses the software to create documents, the closed file format means that only
    that specific tool can read and write the format. As long as you want to access
    your documents, you need that tool. This is known as vendor lock-in.


    To combat this problem, the OpenOffice.org site (and the vast majority of other
    open applications) uses an open file format that is publicly documented. In fact,
    the format is a published standard under ISO/IEC 26300:2006. This means that other
    applications can implement the OpenDocument file format, and you can be safe in
    the knowledge that documents will always be available and you are not locked in
    any specific tool.


    Another useful featureged into OpenOffice.org is the capability to save your documents
    in the Adobe PDF format. PDF files have been increasingly used in the last few
    years and are useful for sending people documents that they should not change
    (such as invoices). PDF provide a high-quality copy of the document and are well
    supported across all operating systems. This makes PDFs ideal for creating catalogs,
    leaflets, and flyers. To save a document as a PDF file, click the PDF button on
    the main toolbar (next to the printer icon). Click the button, enter a filename,
    and you are done. Simple.


