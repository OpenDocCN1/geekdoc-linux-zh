    a better browsing experience but also adheres to Web standards. Like Konqueror,
    Firefox includes browsing (File > New Tab or Ctrl-T), bookmarks, and everything
    you would expect of a modern browser.


    Firefox has many different extensions that can be plugged in to allow greater
    flexibility for your Web browser. The common plug-ins are for using Macromedia
    Flash and Java, which some Web pages requires.


    Installing a plug-in is as simple as visiting a Web site that requires it. A yellow
    bar will indicate that you are missing a plug-in. Click on the Install Missing-in
    button to install the required plug-in.


