    Ubuntu includes everything you need to get started, such as an office suite, media
    tools, a Web browser, a graphics package, an e-mail client, and more. Once the
    installation is complete, you are up and running right away having to install
    any additional software. Different people use their computers in different ways,
    and every user has her own preference for look and feel. Recognizing this desire,
    Linux has the capability to use any one of a number of graphical interfaces. This
    flexibility, combined with the ballooning popularity of Linux and open source,
    resulted in literally hundreds of different graphical environments springing up,
    each covering these different types of users and ways of working.


    Even though there is a huge range of different environments available, there are
    two clear leaders in KDE and GNOME. Each environment provides a good-looking,
    comprehensive, and easy-to-use desktop, but differ in how that desktop is used
    as well as how further personalization can take place. The KDE system is in many
    ways more akin to Windows for complete configurability of the desktop. If an option
    exists, the user has easy access to it and can change the behavior and look of
    almost everything. The competing GNOME desktop takes inspiration from both Windows
    and Mac OS X and sets a priority on simplicity and ease of use. GNOME is still
    easy to customize, but the less common options are either eliminated or hidden
    to prevent user overload. Luckily, Ubuntu users are blessed with the choice of
    either desktop—the default desktop in stock Ubuntu is GNOME, and the Ubuntu distribution
    uses the KDE desktop. Ubuntu is covered in Chapter 8.


    In this chapter, you started with GNOME and use it to do the normal things you
