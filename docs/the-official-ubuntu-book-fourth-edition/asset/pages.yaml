    The fsck program is a little tool to fix hard disks that don''t have consistent
    filesystems, that is filesystems typically made inconsistent by power failures.
    When the disk is inconsistent, Ubuntu automatically runs fsck to fix it. It asks
    you a bunch of questions that only a filesystem developer really understands,
