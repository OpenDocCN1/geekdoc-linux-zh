    # Searching and Editing Text Files


    Search and edit text files by using the following commands.


    +   **grep**: The grep command allows you to search inside a number of files for
    a particular search pattern and then matching lines. For example, grep blah file
    will search for the text “blah” in the file and then print any matching lines.'
  merge: -1
