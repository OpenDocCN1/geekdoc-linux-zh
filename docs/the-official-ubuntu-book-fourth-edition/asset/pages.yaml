  md: '# It Was Suggested I File a Bug Report, but I Don''t Know Why


    Ubuntu is a collaboratively developed system with hundreds of developers from
    around the world work together to build a simple yet powerful distribution. With
    so much software involved in Ubuntu, bugs and problems can naturally creep into
    the system. If you believe the problem you have is not a configuration or hardware
    error, it may well be a bug. Anyone can submit a bug, and it is encouraged that
    regular users of Ubuntu contribute bug reports where possible.


    Bug reports are handled on a special Web site called Launchpad, which resides
    at http://launchpad.net/ (Figure 6-9).


    Launchpad provides a complete environment in which bugs can be tracked and future
    features are merged into Ubuntu. Launchpad is designed not only to make bugs for
    Ubuntu easy to report but also to support reports for other systems, too. This
    means that developers can work together to resolve problems.


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_277_0.png)


    Figure 6-9 Launchpad is where the bug reports live.'
