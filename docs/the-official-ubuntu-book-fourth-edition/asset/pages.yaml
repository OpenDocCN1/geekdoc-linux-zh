  md: '# Navigating in Kubuntu


    All of the applications in Kubuntu can be accessed through the Application Launcher
    (Figure 8-7), which is located in the bottom left corner of the Task Manager.


    An additional change in KDE4 to the Application Launcher is how applications are
    named. Instead of program names (familiar to those who have previously used some
    version of KDE) such as Konqueror, Aggregator, and Kontakt, the applications are
    named after their purpose. For example, Aggregator shows up as RSS Feed Reader,
    and Konqueror shows up as Web Browser.


    Once you click on the Application Launcher, you are presented first with Favorites,
    which is a list designed for applications that are used regularly. You can add
    any application to the Favorites at any time. Kubuntu 9.04 ships with Web Browser,
    Systems, and File Manager already listed in the Favorites section. To remove an
    application from the Favorites portion of the Application Launcher, right-click
    on the application and select Remove From Favorites. Likewise, to add an application
    to the Favorites section, right-click on the application you would like to add
    and select Add to Favorites.


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_322_0.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'After the Favorites tab is the Applications portion of the Application Launcher.
    These applications are organized according to type of program. For example, Instant
    Messenger (Kopete) is located under the Internet section, while CD & DVD Burning
    (K3B) is located under the Multimedia section.


    The third tab is the Computer tab. This tab provides quick access to different
    folders within the file system, including the home directory folders and the CD-ROM
    drive. The Computer section is divided into Applications (System Settings), Places
    (Home, Network, Root, Trash), and Removable Storage (Floppy Drive, CD-ROM, and
    any USB drives).


    The fourth tab is the Recently Used section, which is populated by both applications
    and documents that have recently been used.


    One of the best features of the new Application Launcher is the Search Bar at
    the top of the page (Figure 8-8). The search program searches both menus in the
    Application Launcher and the Web for information.


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_323_0.png)


    Figure 8-8 Using the Search portion of the Application Launcher'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Shutting Down Your Computer and Logging Out


    To shut down your computer, log out, or switch users, go to the Application Launcher,
    and under the tab labeled Leave, select the option you would like. This section
    is divided into two subsections: Session and System. Since Kubuntu is a multiuser
    system (many users per system), you can easily switch to a parallel session as
    different user under the Session subsection. Also under Session, you can Lock
    the Screen or Logout (ending the current session). Under the System subsection,
    you can either shut down (Turn off the computer) or restart (Restart the computer).
    Figure 8-9 shows these options. Also, you can lock the session or Logout by right-clicking
    on the desktop and selecting the correct option.


    # Using sudo Instead of a Root Account


    A large change for many seasoned users of other Linux distributions is the lack
    of a root account. Upon installation, you are not prompted to create a root password.
    The password created with the first user, will allow you to access the administrative
    functions. You will need the sudo password often when configuring the system or
    making global changes.


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_324_0.png)


    Figure 8-9 Logging out of Kubuntu'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Customizing Kubuntu


    A major feature of Kubuntu is the ability to customize almost everything and anything
    in the system. If you don''t like the desktop background, change it. Would you
    like to remove the new Application Launcher and go back to the old Kmenu style?


    # Customizing Plasma


    Continued improvements in KDE 4 have been made to Plasma, the replacement for
    Kdescript. A great amount of customization can be done with Plasma, including
    the addition or subtraction of Widgets. From the Plasma Web page (http://plasma.kde.org),
    Plasma is defined as “the component that is ''in charge'' of the desktop interface:
    the desktop, panel (often referred to simply as the task bar), and related elements.


    Widgets allow you to add and remove items from your desktop. A widget can be something
    from the Application Launcher, for example, or a clock showing a different time
    zone. Widgets can be added to the desktop only if the desktop is unlocked. To
    add widgets, either right-click on the desktop and select Add Widgets or click
    on the Plasma Toolbox located in the top-right corner of the desktop (Figure 8-10).


    Additional widgets are available through the extrages package installed via Software
    Management and also on kde-look.org under the Widgets section. In, KDE4, the Application
    Launcher and Task Manager are both widgets that can be added or removed for complete
    customization. If the old Kmenu is your style, remove the Application Launcher
    widget and replace it with the Application Launcher Menu.


    To change the background on the desktop, right-click on the desktop and select
    Configure Desktop. This opens the Configure Desktop – Plasma Workspace where you
    can change the picture, positioning, color, and preferences for managing icons.
    New wallpaper can be added through Get Hot Stuff.


    Choosing how the desktop looks can help give a personalized feel to Kubuntu. If
    the appearance seems lacking, you can make further changes by choosing System
    Settings > Appearance. You can further customize things, such as color, icons,
    and style. Kubuntu is all about customization,'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 8 ■ Using Kubuntu


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_326_0.png)


