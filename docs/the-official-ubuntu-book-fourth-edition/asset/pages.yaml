  md: 'The APT sources are specified in the file /etc/apt/sources.list. Let''s open

    this file in an editor. (If you''re not used to vim, substitute nano for it, which

    is an easier-to-use, beginner-friendly editor).


    ```

    $ vim /etc/apt/sources.list

    ```


    The lines beginning with a hash, or # denote comment lines and are

    skipped over by APT. At the top, you''ll see the CD-ROM source that the

    installer added, and following it these two lines (or something very similar):


    ```

    deb http://us.archive.ubuntu.com/ubuntu/ jaunty restricted

    deb-src http://us.archive.ubuntu.com/ubuntu/ jaunty restricted

    ```


    We can infer the general format of the APT sources list by looking at these

    The file is composed of individual sources, one per line, and each

    line of several space-separated fields. The first field tells us what kind of
    a

    source the line is describing, such as a source for binary packages (deb) or

    source code packages (deb-src). The second field is the actual URI of the

    package source, the third names the distribution whose packages we want

    (jaunty), and the remaining fields tell APT components to use

    source we are describing—by default, name and restricted.


    If you look up the rest of the file, you''ll find its nicely commented to

    let easily enable two extra repositories: the very useful universe and

    the bleeding-edge backports. In general, now that you understand the-

    format each source line, you have complete control over the repositories

    you use, and while we strongly recommend against using the backports

    repository on a server, enabling universe is usually a good idea.


    With that in mind, let''s get you acquainted with some of the basic com-

    line package management tools on an Ubuntu system. Ubuntu

    inherits its package management from Debian, so if you''re familiar with

    Debian, the utilities we''ll discuss are old friends.


    # dpkg


    Our first stop is the Debian package manager, dpkg, which sits around the

    lowest levels of the package management stack. Through a utility called\dpkg-deb,
    dpkg deals with individual Debian package files, referred to as

    deb for their .deb filename extension.'
