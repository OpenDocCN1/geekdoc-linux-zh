  md: '# System Information Commands 399


    +   - mkdir: The mkdir command allows you to create directories. For example,
    mkdir creates a music directory.


    +   - chmod: The chmod command changes the permissions on the files listed. Permissions
    are based on a fairly simple model. You can set permissions for user, group, and
    world, and you can set whether each can read, write, and/or execute the file.
    For example, if a file had permission to allow everybody to read but only the
    user could write, the permissions would read rwr-r-r-. To add or remove a permission,
    you append a + or a - in front of the permission. For example, to add the capability
    for the group to edit in the previous example, you could type chmod g+x file.


    +   - chown: The chown command allows the user to change the user and group ownership
    of a file. For example, chown file changes the ownership of the file to Jim.


    # # System Information Commands


    System information commands include the following.


    +   - df: The df command displays filesystem space usage for all partitions. The
    command df-h is probably the most useful. It uses megabytes (M) and gigabytes
    (G) instead of blocks to report. (-h means "human-readable.\'')


    +   - free: The free command displays the amount of free and used memory in the
    system. For example, free -m gives the information using megabytes, which is probably
    most useful for current computers.


    +   - top: The top command displays information on your Linux system, running
    processes, and system resources, including the CPU, RAM, swap usage, and total
    number of tasks being run. To exit top, press Q.


    +   - uname: The uname command with the -a option prints all system information,
    including machine name, kernel name, version, and a few other details. This command
    is most useful for checking which kernel you''re using.'
  merge: -1
