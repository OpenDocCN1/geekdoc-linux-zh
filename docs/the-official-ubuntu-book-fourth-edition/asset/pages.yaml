    # # Keeping Your Computer Updated


    OS or piece of software is perfect. This means Ubuntu developers release a number
    of security and other updates. These come as needed and are easy to install.


    Most of the updates to your machine will be security related. This means that
    the developers have found a weakness in a particular program in Ubuntu and have
    released a fix for it. There will also be a small number of updates to fix some
    critical bugs. For a home user, there is generally no reason not to install these
    right away, not installing them might leave your computer open to security breaches,
    virus infection, or worse. Ubuntu developers also have a very strict policy about
    not putting new versions of programs into stable versions of Ubuntu, which keeps
    your system stable by not introducing new problems.'
