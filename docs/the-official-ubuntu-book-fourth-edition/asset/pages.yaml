  md: '# Ubuntu Package Management 163


    dpkg is extensively documented in the system manual pages, so you can read about
    the various options it supports by entering dpkg in the shell. We''ll point out
    the most common dpkg operations: listing and installing packages. Of course, dpkg
    can also remove packages, but we''ll show you how to do that with the higher-level
    tool called apt-get instead.


    **Listing Packages** Running dpkg -l | less in the shell will list all the packages
    on your system that dpkg is tracking, in a six-column format. The first three
    columns are one letter wide, signifying the desired package state, current package
    status, and error status, respectively. Most of the time, the error status column
    will be empty.


    The three lines of dpkg output serve as a legend to the letters you can find in
    the first three columns. This lets you use the grep tool to search through the
    package list, perhaps to look only at removed packages or those that failed configuration.


    # Installing a Package Manually


    There are more than 17,000 packages in the Ubuntu archive for each release. Only
    a small percentage of those are officially supported, but all the other packages
    are still held to reasonably rigorous inclusion requirements. Packages in the
    Ubuntu archive are almost universally of high quality and are known to work well
    on your Ubuntu system.


    Because of this, the archive should be the very first place you look when you
    choose to install new software. On rare instances, however, the software you want
    to install will not be available in the archive because it''s new or because redistribution
    restrictions prevent it from being included. In cases, you might have to either
    build the software from source code, run binaries or find third-party Ubuntu or
    Debian packages to install.


    > TIP  Practice Safe Hex!!

    That''s a terrible pun. We apologize. It probably got your attention, so follow
    closely: By very, very cautious when dealing with third-party packages. Packages
    in the Ubuntu archive undergo extensive quality assurance and are practically
    certain to be free from viruses, worms, Trojan horses, or other computer pests.
    If you install software only from the archive, you''ll never have to worry about
    viruses again.'
