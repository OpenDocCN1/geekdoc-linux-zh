  md: 'THE KUBUNTU PROJECT STRIVES to take the best of Ubuntu and the best of the
    K Desktop Environment (KDE) to produce a great Linux distribution. This chapter
    covers information ranging from what exactly Kubuntu is to how to manage and keep
    your Kubuntu system up to date with the latest applications and fixes. The goal
    of Kubuntu is to provide a graphically beautiful and easy-to-use Linux operating
    system, an OS that is simple to customize to your desire.


    # Introduction to Kubuntu


    Kubuntu is an official product of Ubuntu—a complete implementation of the Ubuntu
    OS led by Jonathan Riddell (an employee of Canonical, Ltd.) and an army of developers.
    However, Kubuntu uses KDE as the graphical user interface instead of GNOME, as
    in Ubuntu. The main goal of Kubuntu is to be an integrated Linux distribution
    with all the great features of Ubuntu, but based on KDE. Since Kubuntu is an official
    part of the Ubuntu community, it adheres to the same manifesto: Great software
    should be available free of charge and usable by people in their own language
    and regardless of disability. Also, people should be able to customize and alter
    their software in ways they deem fit.


    Like Ubuntu, Kubuntu makes the following commitments: Kubuntu will provide the
    very best translations and accessibility infrastructure that the free software
    community has to offer; Kubuntu will always be free of charge, and there is no
    extra cost for an “enterprise” version; and Kubuntu will always provide the latest
    and best software from the KDE community.


    Looking for a certain piece of software? Kubuntu has it, with more than 1,000
    pieces of software in its repositories, including the latest kernel version and,
    of course, the latest KDE. The standard desktop applications (Web browsing, e-mail,
    word processing, and spreadsheet applications) allow Kubuntu to replace any current
    desktop OS. If you are running servers—whether they’re Web servers, e-mail servers,
    or database servers—Kubuntu can do that as well.


    # A History of KDE


    In 1996, Matthias Erich posted a now famous newsgroup post that described some
    of the problems he had with the UNIX desktop.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'UNIX popularity grows thanks to the free variants, mostly Linux. But still
    a consistent, nice looking, free desktop environment is missing. There are several
    nice free or low-priced applications, so that Linux/X11 would almost fit everybody''s
    needs if we could offer a real GUI...


    IMHO a GUI should offer a complete graphical environment. It should allow a user
    to do his everyday tasks with it, like starting applications, reading mail, configuring
    his desktop.... All parts fit together...


    The goal is NOT to create a GUI for the complete UNIX-system or for the System-Administrator....
    The idea is to create a GUI for an ENDUSER.


    With that post, he started building the KDE GUI. KDE originally stood for the
    Kool Desktop Environment but was adapted to K Desktop Environment. The mascot
    for KDE is a green dragon Konqi, who can be found in various applications.


    Matthias chose to develop KDE around the Qt toolkit, and by 1997, the first large,
    complex applications were being released. However, there was much debate because
    Qt was not licensed with a free software license. Two projects came about from
    this debate, one named Harmony, which would use only free libraries, and another
    project GNOME. In 1998, the Qt toolkit was licensed under a new source license
    called the Qt Public License (QPL), and in 2000, Qt was released under the GNU
    Public License.


    KDE is primarily a volunteer effort. However, many companies employ developers
    to work on this project. Some of these companies include Noble (through the purchase
    of SUSE Linux) and Trolltech (the company that produces the Qt toolkit).


    KDE 4.0 came with a great number of changes to the desktop environment, including
    the introduction of Plasma, Solid, Krunner, and many other infrastructure changes,
    most of which are discussed throughout this chapter.


    KDE 4.2 is the current version of KDE that ships with Kubuntu 9.04. Significant
    improvements have been made over the first release of KDE, and most of the KDE
    3 applications have been ported over to KDE 4.'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'For more information on KDE, visit the project''s Web site at www.kde.org.
    The project''s home page also provides information on how you can help with the
    project and contribute to the KDE community.


    # A History of Kubuntu


    When Ubuntu was first being discussed, there were rumors that it would be based
    on GNOME and that KDE would be left out. Jonathan Riddell, a KDE developer, posted
    an article on his blog that soon became the Number 1 hit on Google for Ubuntu
    Linux. The article states:


    The signs are there that this could be something big, so more than the likes of
    Linspire, Xandros or Lyrosis. Unlike those companies, they [Canonical, Ltd.] understand
    Free Software and open development. It is likely to be a GNOME-based job, but
    maybe there is a KDE developer out who is working for them without letting on.
    If not I''m always available.


    This post started a flurry of activity for Riddell and the others who wanted to
    participate.


    A lot of changes needed to be made to get Kubuntu working correctly. A hardware
    abstraction layer (HAL) had been changed; programs and packages, with a clean
    Kmen own, changed to fit the philosophy of Ubuntu, had been created; and more
    people needed to join the project. It was a conscious decision to keep the default
    KDE colors and icons in order to remain as close to KDE as possible.


    Kubuntu 9.04 is a unique and important release. It was released in two versions
    and includes KDE 3.5.9 and Kubuntu 9.04 (KDE4 Remix). This chapter focuses on
    Kubuntu 9.04 (KDE4 Remix). Also, Kubuntu 9.04 differs from Ubuntu 8.04 in that
    Kubuntu is not a long-term support version; 9.04 is supported for 18 months.


    Kubuntu 8.10 was released in October 2008 and was the first version to include
    KDE 4 as the default version of KDE. This change upset quite a few members of
    the community who felt KDE 4 was not ready for prime time. Kubuntu 8.10 included
    both KDE 4 and KDE 3 apps in order to make it feature complete. A big change in
    8.10 was the ability for you to select the'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'language settings right from the boot up. This feature allows for more localization
    and sets the system in the language you understand best.


    Kubuntu 9.04 will have only KDE 4 applications installed, which necessitated some
    changes in the default applications. The big changes include switching the package
    manager to KPackageKit instead of Adept and using Quasel as the default IRC client
    of Conversation, which was dropped because it was not ported to KDE 4. The current
    version of KDE shipping in 9.04 is 4.2.


    Kubuntu is quickly building a sizable community of its own. There are not only
    more and more package maintainers and a growing, dedicated documentation team
    but also many community and fan sites to provide support and the most current
    information, including forums located at www.kubuntuforums.net. Kubuntu has grown
    tremendously from just one developer to a large group as it continues to improve
    the quality of the distribution.


    # Installing Kubuntu


    Installing Kubuntu is just like installing Ubuntu. It is pretty much a snap. Let''s
    start with where you can find it.


    # Where to Find Kubuntu


    Kubuntu is available at www.kubuntu.org/download.php. An image file can be downloaded
    and burned onto either a DVD or a CD-ROM. Two different types of Kubuntu images
    can be downloaded and used. The first is the desktop CD, which allows the user
    to test and run Kubuntu without changing any settings. The second is the alternate
    CD, which provides for a more advanced installation.


    The desktop CD of Kubuntu 9.04 is the primary way to install Kubuntu on your system.
    This CD is a great way to demonstrate the power of Kubuntu to your friends before
    they install it on their systems. The desktop CD acts as a live CD and allows
    Kubuntu to run on your system without erasing anything already installed.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Can I Switch to Kubuntu If I Have Ubuntu Installed Already?


    If you have installed Ubuntu on your system already, it is extremely easy to install
    and configure Kubuntu. In Synaptic, find the package kubuntu-desktop, which provides
    all the necessary programs to have your system look and act like Kubuntu. Don''t
    worry—you can switch between Ubuntu with GNOME and Kubuntu with KDE. Once Kubuntu
    is installed, you can choose which desktop environment to use, either GNOME or
    KDE. Also, if you have Kubuntu installed already and wish to install Ubuntu, it
    is just simple to switch: Just install ubuntu-desktop through Software Management,
    and you will be using the GNOME desktop.


    Once you have installed the kubuntu-desktop package, enable your GNOME session
    and choose Session from the menu. Select KDE instead of GNOME as your window manager,
    and then select Make Default. From now on, KDE will start for you when you sign
    on.


    # Installing from the Desktop CD


    Kubuntu has the ability to install directly from the desktop CD, so there is no
    need to download separate CDs; simply download the desktop CD and show off to
    your friends how great Kubuntu is, or give it a test run for the first time. Kubuntu''s
    live installer program is called Ubiquity.


    After you start up the desktop CD, an icon called Install appears on your desktop.
    Choose to install Kubuntu, and Ubiquity guides you through the installation phase
    (Figure 8-1).


    Ubiquity guides you in setting up the correct country and time zone (Figure 8-2).


    Once you have answered these questions, Ubiquity prompts you to select the correct
    keyboard layout (Figure 8-3), create a username and password, configure your disk
    and its partitions (Figure 8-4), and create your user-name and assign a name to
    the computer (Figure 8-5).


    When everything is all set, click Install to finish the installation (Figure 8-6).'
