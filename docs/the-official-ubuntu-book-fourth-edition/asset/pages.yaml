  md: '# Changing Your IP Address


    At some point it may become necessary to change the IP address of the server.
    Changing the IP address of a normal machine would not usually have much consequence
    on the client machine. However, in an LTSP environment, changing the IP address
    will result in clients being unable to log in. This is because when the LTSP root
    is built, it is populated with SSH authorization keys, which allow authentication
    between the client and the server without a password.


    The procedure for solving this issue is fairly simple. First, you must load a
    terminal window, using the Applications > Accessories > Terminal link in the main
    menu. Once this has loaded, you need to run the LTSP SSH key update by typing
    the following command into the terminal and pressing Enter. You will be prompted
    for your password.


    ```

    sudo ltsp-update-sshkeys

    ```


    > When entering your password, nothing is displayed on the screen, although your
    password is still being read by the computer. The password is not displayed for
    security reasons, but it is also not obfuscated. This prevents people who may
    be looking over your shoulder from seeing how many characters your password has.


    > It is possible to update the SSH keys by simply restarting the network interface,
    using a command similar to the following one. You will need to replace <interface>
    with the interface identifier, usually something like <eth0> or <eth1>.


    ```

    sudo ifdown <interface> sudo ifup <interface>

    ```


    Once completed, your SSH keys will be updated, and after the clients reboot, you
    should be able to log in again.


    # Local Devices over LTSP


    Since Ubuntu Edgy 6.10, Edubuntu has included the update to LTSP to allow what
    are called local devices. Plugging a USB storage device into a thin client machine,
    for example, will trigger the local devices mechanism, and the device will be
    correctly mounted and shown on the desktop of the client machine.'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'When using USB sticks with Ubuntu, you would normally have to unmount the device
    before removing it physically. This is so that Ubuntu has to write all the data
    it needs to the USB stick and safely unmount it. In the LTSP environment, using
    a USB stick is a little different. There is no unmount option because the data
    is written to the USB stick on a very regular basis. Hence you do not need to
    unmount it and can just remove it once the computer has finished writing information
    to it.


    Local device support is set up by default in Edubuntu; however, you must add it
    to the fuse group users who require access to such support. You can do this from
    the user manager. Start by going to System > Administration > Users and Groups
    option. From here, select the user to whom you wish to give local device access
    and click on the User Properties button. Click on the User Privileges tab, and
    from here tick the checkbox for allowing of fuse filesystems, as shown in Figure
    9-15.


    # Sound over LTSP


    Since Edubuntu Dapper 6.06, Edubuntu has the ability to play through the speakers
    of the client machine. For versions of Edubuntu prior to 6.10


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_389_0.png)


    Figure 9-15 Setting fuse preferences'
