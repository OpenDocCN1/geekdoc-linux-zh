  md: '# OpenOffice.org


    The default office application for Kubuntu 9.04 is OpenOffice.org 3.0.1. This
    version is an update of the second major release of the suite that includes Writer,
    Calc, Impress, and Math; the first three can be launched from the Application
    Launcher. (Draw and Math are not available from the menu and are launched within
    one of the other applications.) Note that the developers of Kubuntu have renamed
    the applications in the Application Launcher to better reflect what each does.
    For example, Writer is renamed Word Processor.


    Each of these programs is easy to use and can help you switch from the Microsoft
    OpenOffice product line. In fact, the OpenOffice.org suite is included in the
    desktop CD and can be installed on a Windows system to get you comfortable and
    ready for a switch to Kubuntu. Each corresponds to a similar application in the
    Microsoft product line. Calc is very similar to Excel, Writer works like Word,
    and Impress replaces Power-Point. OpenOffice.org can handle all Access files without
    problems, and the whole suite is ready to be used in a corporate environment as
    well as for personal use.


    To demonstrate the power of OpenOffice.org, let''s create a new document. To start
    OpenOffice.org Writer, open the Application Launcher and navigate to Office and
    then Word Processor. You can also launch KRunner (Alt-F2), type Word processor,
    and hit Enter.


    Writer resembles any other word processing software that you have used. Simply
    start typing your letter or paper as you normally would, and use the toolbar for
    formatting options, including changing alignment, setting boldface or italic type,
    and other needs.


    When you are done working on a document, save it by selecting File > Save or by
    typing Ctrl-S. OpenOffice.org saves documents in the Open Document format. This
    format is a standard across the world. You can also save documents in other formats,
    including Microsoft Office and Adobe PDF. To save as a PDF file, just click the
    PDF button on the main toolbar (located next to the print icon) and enter a filename.'
  merge: -1
