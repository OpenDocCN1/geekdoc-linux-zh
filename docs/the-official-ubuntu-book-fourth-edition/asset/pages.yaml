    default, and then you can just update as described in the previous graph. You
    can confirm that this feature is activated by going to Settings > Preferences
    (Figure 4-9). Make certain that the System Upgrade option is set to Smart Upgrade.


    # Moving to the Next Ubuntu Release


    Now your system is up to date, but Ubuntu doesn''t like to the grass grow. One
    of the original goals for Ubuntu was to have frequent releases, and with only
    one notable exception (the 6.06 LTS release, which was delayed by two months),
    there have been six months between each release since 4.10. This book has been
    revised for the latest version—9.04—but another one will be along soon. Release
    8.04 and earlier 6.06 are both Long Term Support (LTS) versions of Ubuntu, supported
    for three years on the desktop and five on the server. All other versions are
    supported for eighteen months and are superseded by a new version every six. Essentially,
    if you are running the LTS version, you might not be too interested in moving
    to the latest and greatest until the next LTS version comes out.'
