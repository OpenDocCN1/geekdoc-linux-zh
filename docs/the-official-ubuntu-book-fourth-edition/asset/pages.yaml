  md: 'The diagram shown in Figure 3-37 should give you an idea of how every-thing
    hangs together.


    Right at the top of the tree is the root folder, referred to as /. Inside this
    folder are a number of special system folders, each with a specific use. As an
    example, the /home folder contains a number of home directories for each user
    on the system. As such, the mako user account has the home folder set to /home/mako.


    # Which Folder Does What?


    The folder structure in a modern Linux distri-b as Ubuntu was largely inspired
    by the original UNIX foundations that were created by men with large beards. Although
    you don''t really need to know what these folders do, since Ubuntu looks after
    the house-keeping for, some of you may be interested in the more important fold-ers.
    For your pleasure, we present the Linux folder hit list in Table 3-1.


    # Configuration Files


    In Table 3-1, /etc is described as storing systemwide configuration files for
    your computer. Aside from these files that affect everyone, there are also configuration
    files for each specific user. Earlier, when you customized Ubuntu’s look and feel,
    the settings were applied only to your current user account. So where are those
    settings?


    Inside your home directory are a number of folders that begin with a dot (.),
    such as .gnome2 and .openoffice2. These folders contain the confi-ration settings
    for specific applications for that specific user. By default,


