- img_proc: true
  md: '# Chapter 8 Using Kubuntu


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_332_0.png)


    Figure 8-16 System Settings


    you will be prompted at times to enter your password. Changes made that require
    a password are systemwide and will affect all users of the Kubuntu system.


    System Settings is divided into two tabs, General and Advanced, and each tab is
    further divided into sections based on tasks. Under the General tab are the following
    sections: Look & Feel, Network & Connectivity, and Computer Administration. The
    Advanced tab contains two sections: Advanced User Settings and System.


    When moving through the different options, be sure to select Overview to return
    to the main screen of System Settings instead of clicking on the X. Doing so may
    take some getting used to.


    # Look and Feel


