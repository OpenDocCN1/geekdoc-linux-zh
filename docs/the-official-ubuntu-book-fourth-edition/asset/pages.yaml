  md: '# Installing Ubuntu Server


    TIP


    # Encrypted Swap and Remote Login


    If you use a swap partition, protecting your home directory isn''t enough; sensitive
    data can get swapped out to disk in the clear. The solution is to use encrypted
    swap, which you can manually enable with the cryptfs-setup command, but this will
    presently take away your computer''s ability to enter the hibernate power-saving
    mode. Suspend mode is affected.


    Note that encrypting your home directory makes all the data in it, including directories
    such as .ssh, unavailable until you log in. If you''re logging into a machine
    where your home directory is encrypted and hasn''t yet been unlocked, and the
    machine only allows SSH key authentication, there is no way for the system to
    trust your authorized_keys file, and you''re locked out. You can fix this by physically
    logging in, unmounting your encrypted home directory with cryptfs-mount-private,
    creating a .ssh directory in your "underlying" home directory left behind by cryptfs.
    Stick your keys into an authorized_keys file under .ssh as normal, and you''ll
    be all set to log in remotely, at which point you can use cryptfs-mount-private
    to enter your password and unlock your actual home directory.


    After the installer downloads updated software sources, though, you will see a
    new menu that lists a number of common server types, including DNS, LAMP, Mail,
    OpenSSH, PostgreSQL, Print, and Samba servers. Select one or more of these options
    and the installer will automatically download the standard set of packages you
    will need for server as well as perform some basic configuration of the services
    for you. For instance, if you wanted to install a LAMP environment, but you also
    wanted to make sure you could ssh into the machine from another computer, you
    could select both LAMP and OpenSSH server from the menu.


    TIP


    # Software Install Prompts


    Depending on which servers you select, you may be asked a number of questions
    as the packages install. For instance, when you select the LAMP environment, the
    installer will recommend you choose a password for the root MySQL user.


    # You''re Done—Now Watch Out for Root!


    Whew, with the storage and software out of the way, the rest of your server installation
    should go no differently than installing a regular Ubuntu workstation. And now
    that your server is installed, you can move on to the fun stuff. From this point
    on, everything we will happen in a shell.'
