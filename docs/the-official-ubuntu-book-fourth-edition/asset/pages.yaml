  md: '# Chapter 5 The Ubuntu Server


    **NOTE** The update process may take a couple of hours and should not be interrupted
    during that time.


    **Building Packages from Source** The Ubuntu archive, unlike Debian''s, doesn''t
    permit direct binary uploads. When Ubuntu developers want to add a piece of software
    to the archive, they prepare their source code in a certain way and put it in
    a build queue. From there it''s compiled, built automatically, and—if those steps
    succeed—pushed into the archive.


    Why go through all the trouble? Why not have the developers build the software
    on their machines? They could upload binaries to the archive, bypassing the build
    queue, which can take hours to build software. Here''s the catch: Ubuntu officially
    supports three hardware platforms (Intel x86, AMD64/EM64T, and PowerPC). Without
    the build queue, developers would have to build separate binaries of their software
    for each platform, which entails owning a computer running on each platform (expensive!)
    or creating complicated cross-compilation toolchains. And even then, sitting through
    three software builds is an enormous waste of precious developer time.


    The build queue approach solves this problem because the automatic build system
    takes a single source package and builds it for all the necessary platforms. And
    it turns out that the approach provides you, the system administrator, with a
    really nifty benefit: It lets leverage the dependency-solving power and ease of
    use of apt-get and apply it to building packages from source!


    Now you''re excited, let''s backtrack a bit. Building packages is primarily of
    interest to developers, not system administrators. In fact, as a sysadmin, you
    should avoid hand-built packages whenever possible and instead benefit from the
    quality assurance that packages in the Ubuntu archive received. Sometimes, though,
    you might just have to apply a custom patch to a piece of software before installing
    it. We''ll use the attr package example, as before. What follows is what a session
    of building attr from source and installing the new package might look like—if
    you want to try it, make sure you install the dpkg-dev, devscripts, and fakeroot
    packages.


    ```

    $ mkdir attr-build

    $ cd attr-build

    ```'
