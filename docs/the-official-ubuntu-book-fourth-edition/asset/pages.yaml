    You will be asked to read and agree to the forum rules shown in the Ubuntu Forums
    Code of Conduct is summarized later in this chapter.


    After doing so, choose and provide a username and password, along with an e-mail
    address. You may choose a username that is serious, whimsical, informative, or
    secretive, almost anything you want as long as it is clean and'
