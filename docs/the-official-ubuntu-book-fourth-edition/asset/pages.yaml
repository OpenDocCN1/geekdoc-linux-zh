    # Cronab Sections A typical line in a cronab looks like this:


    ```

    00 01 3 5 6 ps ax

    ```


    Each of the sections is separated by a space, with the final section having one
    or more spaces in it. No spaces are allowed within sections 1–5, only between
    them. Sections 1–5 are used to indicate when and how often you want the task to
    be executed. This is how a cron job is laid out from left to right:


    +   - Minute: (00–59)

    - Hour: (00–23; 0 = midnight)

    - Day: (1–31)

    - Month: (1–12)

    - Weekday: (0–6; 0 = Sunday)

    - Command: code


