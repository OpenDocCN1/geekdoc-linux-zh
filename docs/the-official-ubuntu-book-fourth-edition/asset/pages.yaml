- img_proc: true
  md: 'To report a bug, click on the Help menu in the application for which you want
    to report the bug. Select Get Online Help. Firefox will now load and take you
    to the Launchpad site. To use Launchpad, you need a user account, so click the
    Register link to register your account. Enter your e-mail address, and you will
    be e-mailed registration details. When you have completed the registration, log
    in to Launchpad. You can always access your application in Launchpad by using
    the Get Online Help item.


    # TIP


    Another Way into the Bug-Tracking System

    You also access the bug-tracking system by going to Launchpad, clicking the Bugs
    link in the right sidebar, and then entering the name of the application in the
    text box further down the page. If possible, it is generally recommended that
    you use the Help menu approach as it will automatically pick the right application
    for you.


    The first step is to check whether the bug has already been reported. The right
    sidebar of Launchpad is a series of menu options. Each bug added to the system
    is automatically given a unique ID for the bug, and you can search for this number
    if needed. You can alternatively search for something related to the problem.
    As an example, search for "crash" or "hang." If you find your bug has already
    been reported, you can stay updated with changes related to the bug by clicking
    the Subscribe link in the right sidebar.


    If no bugs exist, you should report it yourself. To do this, click the Report
    a Bug in <application name> Ubuntu link. Simply fill the Summary box with a single-line
    description of the bug, and then use the Description box to fill in the details.
    You should be as detailed as possible and include your computer''s specifications,
    any special steps you went through to trigger the bug, the effects of the bug,
    and how you expected the software to work. Try to be detailed, but keep everything
    you relevant to the bug. If you would prefer to keep your report confidential,
    select the checkbox for that, but it is highly recommended that you keep your
    bug reports public if possible. This means that as many people as possible can
    see the report and properly act on it.


    With the bug submitted, you will receive e-mail updates about the progress of
    the developers making to fix the bug. In some cases the developers may ask you
    to run commands or try different things to help nail down the bug so they can
    fix it.'
