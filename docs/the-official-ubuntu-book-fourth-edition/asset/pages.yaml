  md: '# Chapter 6 Support and Typical Problems


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_280_0.png)


    **Figure 6-10** The Ubuntu loaf


    First, put the yeast in the warm water while you gather the other ingredients.


    Beat the three eggs in a bowl and save a teaspoon of the egg mixture for later.
    After add three cups of flour to a big bowl with the egg, sugar, oil, and salt.
    When the yeast is bubbly, add it in too. Knead. If the mixture is crumbly, add
    water. If it is too sticky, add more flour. The dough should be firmer than your
    average bread dough to keep its shape.


    Cover the bowl with a damp towel, and let the dough rise in a warm place. When
    it has doubled in size, punch it down, and roll it into three ropes.


    Make the ropes less than one inch (2.5 cm) thick so that the loaf will bake evenly.
    Do this on a large surface. You need a lot of room. Use a bit of oil if things
    are sticky. dough should be somewhat soft, so this should not be a problem.


    You should end with three ropes that are a little less than three feet (75 cm)
    long. Pinch them together on one end, and set them horizontally on your work surface.


    Braid the lowest rope and place it between the other two. The middle rope is now
    the lowest rope. Move it into position by bringing it down to where the other
    rope (lowmost) used to be. Take the rope that is highest and pull it up to its
    position as topmost rope. Place the lowest between the two others. What you get
    is...


    When you have a long braid, snip off the ends, and join the ends to form a circle.
    Join the individual ropes together as well as you can. Place the loaf on an oiled
    cookie sheet. Take the snipped-off ends and form two long strands. Intertwine
    them by putting them side by side and holding one end while rolling the other
    end with the palm of your hand. Stretch this out around the bottom of the big
    braid and join the ends.


    Cover the kalach with a damp towel and let it double in size (about an hour, maybe
    less on a hot day). Brush with the egg mixture. You should have enough to cover
    the loaf completely. Bake at 350°F/180°C until it becomes dark brown. Let it cool.'
