    # # A Wild Ride


    In April 2004 Mark Shuttle brought together a dozen developers from the Debian,
    GNOME, and GNU Arch projects to brainstorm. Shuttleworth asked the developers
    if a better type of operating system (OS) was possible. Their answer was “Yes.”
    He asked them what it would look like. He asked them to describe the community
    that would build such an OS. That group worked with Shuttleworth to come with
    answers to these questions, and then they decided to make answers a reality. The
    group named itself the Warthogs and gave a six-month deadline to build a proof-of-concept
    OS. The developers nicknamed their first release the Warty Warth with the reasonable
    assumption that their first product would have its warts. Then they got down to
    business.


    It''s difficult, particularly for those of us who were privileged to among those
    early Warthogs, to imagine the brainstorming meeting before the Ubuntu project
    took place five years ago. Far from being was, the Warty Warth surpassed our most
    optimistic expectations and everyone’s predictions. Within six months, Ubuntu
    was in the Number 1 spot on popularity rankings of GNU/Linux distributions. Ubuntu
    has demonstrated the most explosive growth of any GNU/Linux distribution in recent
    memory and had one of the most impressive first years of free or open software
    project in history.


