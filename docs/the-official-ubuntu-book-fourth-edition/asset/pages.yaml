  md: '# Chapter 3 Using Ubuntu on the Desktop


    Nautilus is also flexible in how your files are displayed. You can view the files
    and folders as either the default collection of icons or as a list. You can switch
    to the list view, select View > As List. You can also configure the organization
    of how your files and folders are displayed by right-clicking the main part of
    the window and selecting one of the options in the Arrange Items menu. Play with
    each of these options to see which ones work best for you.


    **QUICK TIP** Just in the file dialog, Nautilus displays each of the different
    parts of the path as different buttons. As an example, /home/mako/would have three
    buttons: home, mako, and work.


    # Selecting, Copying, and Moving Files and Folders


    Copying and moving files and folders are simple tasks with Nautilus and can be
    done in a number of different ways. To test this, create two folders called Work
    and Invoices in your home directory. Save some files inside each folder. You can
    quickly create empty folders by double-clicking the folder to go into it, right-clicking,
    selecting Create Document > Empty File, and renaming the file to something useful.
    With a couple of folders now complete with files in them, let''s move them around.


    One method is to use two windows. Right-click the Work folder, and select Open
    in New Window. You now have two windows open, one with the contents of Work and
    one with the contents of your home directory. Now copy the Invoices folder to
    the Work folder by clicking it and dragging it over the second window (which shows
    the contents of Work). By default, dragging from one window to another copies
    the item.


    Another option is to select what you want to copy and paste. Selecting items can
    again be done in a number of ways. One method is to click each file/folder while
    holding the Shift or Ctrl keys to make multiple selections. The difference between
    the two keys is that Shift allows you to select a number of files and folders
    next to each other, and Ctrl selects independent files and folders from anywhere
    in the folder-listing view. When you have selected what should be copied, right-click
    and select Cut or Copy. Cut will copy the original files but remove them, and
    Copy will copy them while leaving the original files intact. Go to the destination
    folder, right-click it, and select Paste. The files/folders are now added.'
