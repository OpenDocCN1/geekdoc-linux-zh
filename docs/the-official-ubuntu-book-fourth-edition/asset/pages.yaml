    ways. For example, the number of users and posts in the Ubuntu Forums has nearly
    doubled since the last edition of this book year ago. Again. Again again, the
    number of officially supported flavors of Ubuntu have been added to. Again. Once
    again, we feel blessed that The Ubuntu Book has been able to benefit from, and
    perhaps in a small way even contribute to, that success. Ultimately, that success
    paved the way for the second, third, and now the fourth edition of the book that
    you''re reading now.


    In the process, this book, Ubuntu, is beginning to mature. Ubuntu, we have now
    put together our piece a few times and are beginning to get more comfortable.
    Our job as authors, like that of the Ubuntu developers, now involves more updating
    and polishing than it used to. Distributed under a free license, a once-risky
    book on a once-risky operating system is, just a few short years later, as close
    to a sure thing as an author, publisher, and if we have done our job well, a reader,
    could hope for.


    And yet with success comes responsibility to our readers and to our users with
    high expectations. Ubuntu''s success is built in by part of maturity and excellence,
    and it cannot sacrifice these qualities if it will succeed. We cannot either.
    Our job as writers is complicated because we need to accurately reflect and represent
    both while catering to an increasing and increasingly diverse group of users.


    As we''ve noted in the prefaces to previous editions of this book, being Official
