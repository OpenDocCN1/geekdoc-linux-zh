    other users download and use them. In an interview posted on KDE News (http://dot.kde.org/1110652641),
    Josef Spillner describes exactly how the process works.


    > [U]ser A is using a spreadsheet application and modifies a template that comes
    with it. This template can then be uploaded to a server and eventually downloaded
    by user B by checking the contents of the “Get Hot Stuff” download dialogue.


    The GHNS framework (Figure 8-11) shows up in several places throughout Kubuntu.'
