    routine that will ask you to press a series of keys on the keyboard. From these
    keys, the installer can work out which keyboard layout best suit you. If there
    are any keyboard variations, these are now presented for you to choose from.


    The installer will now load various components. If you have more than one NIC
    in your computer, you will be asked to choose the primary card'
