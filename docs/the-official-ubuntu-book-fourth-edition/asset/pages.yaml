  md: '# Ubuntu and Multimedia


    Go to the site in Firefox, and when you see a link that indicates a podcast feed
    or RSS feed, right-click it and select Copy Link Location.


    Rhythmbox has good support for Podcast feeds, and subscribing to a feed is simple.
