- img_proc: true
  md: 'Stallman grew up with computers in the 1960s and 1970s, when computer users
    purchased very large and extremely expensive mainframe computers, which were then
    shared among large numbers of programmers. Software, was for the most part, seen
    as an add-on to the hardware, and every user had the ability and the right to
    modify or rewrite the software on or her computer and to freely share this software.
    As computers became cheaper and more numerous in the late 1970s, producers of
    software began to see value in the software itself. Producers began to argue that
    their software could be copyrighted as a matter of intellectual property like
    a music recording, a film, or a book''s text. They began to distribute their software
    under licenses and in forms that restricted its users'' abilities to use, redistribute,
    or modify the code. By the early 1980s, restrictive software licenses had become
    the norm.


    Stallman, then a programmer at MIT''s Artificial Intelligence Laboratory, became
    increasingly concerned with what he saw as a dangerous loss of the freedoms that
    software users and developers had previously enjoyed. He was concerned with computer
    users'' ability to be good neighbors and members of what he thought was an ethical
    and efficientuser community. Stallman articulated a vision for a community that
    developed liberated code—in his four characteristics—“free software.” He defined
    free software as software that had the following four—labeled as freedoms 0 through
    3 instead of 1 through 4 as a computer programmer''s joke:


    +   - The freedom to run the program for any purpose (freedom 0)

    - The freedom to study how the program works and adapt it to your needs (freedom
    1)

    - The freedom to redistribute copies so you can help your neighbor (freedom 2)

    - The freedom to improve the program and release it to the public so that the
    whole community benefits (freedom 3)


    Access to source code—the human-readable and modifiable blueprints of any piece
    of software that can be distinguished from the computer-readable version of the
    code that most software is distributed as—is a prerequisite to freedoms 1 and
    3. In addition to releasing this definition of free soft-'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'ware, Stallman created a project with the goal of creating a completely free
    to replace the then-popular UNIX. In 1984, Stallman announced this project and
    called it GNU—another joke in the form of a recursive acronym for “GNU’s Not Unix.”


    # Linux


    By the early 1990s, Stallman and a collection of other programmers working on
    GNU had developed a near-complete OS that could be free—a complex system command
    processor that lies at the center of any OS. In 1991, Linus Torvalds wrote an
    early version of such a kernel, released under a free license, and called it Linux.
    Linux''s kernel was paired with the GNU project''s development tools and OS and
    with the graphical system called X. With this pairing, a completely free OS was
    born—both in terms of price and in Stallman''s terms of freedom.


    All systems referred to Linux today are, in fact, built on the work of this collaboration.
    Technically, the term Linux refers to the kernel. Many programmers and contributors
    to GNU, including Stallman, arguably that the full OS should be referred to as
    GNU/Linux in order to give credit not to Linux but also to the GNU project and
    to highlight GNU''s goals of spreading software freedom—goals not shared by Linus
    Torvalds. Many others find this name cumbersome and prefer calling the system
    simply Linux. Yet others, as those working on the Ubuntu project, attempt to avoid
    the controversy altogether by referring to GNU/Linux only by using their own project''s
    name.


    # Open Source


    Disagreements over labeling did not end with discussions about the naming of the
    combination of GNU and Linux. In fact, as the list of contributors to GNU and
    Linux grew, a vibrant world of free software projects sprouted up, facilitated
    in part by gaining access to the Internet. This community grew and diversified,
    a number of people began to notice an unintentional side effect of Stallman''s
    free software. Because free software was built in an open way, anyone could contribute
    to software by looking through the code, finding bugs, and fixing them. Because
    free software ended up being examined by larger numbers of programmers, free software'
