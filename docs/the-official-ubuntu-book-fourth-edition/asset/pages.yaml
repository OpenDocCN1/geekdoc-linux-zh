  md: '# Ubuntu Package Management 167


    up to date. This doesn''t upgrading to newer and newer versions of the software
    (well, it does, but not in the conventional sense), because once a given Ubuntu
    version is released, no new software versions enter the repositories except for
    the backports repository. On a server, however, you''re strongly discouraged from
    using backports because they receive a very limited amount of quality assurance
    and testing and there''s usually no reason for a server to be chasing new software
    features. New features bring new bugs, and as a system administrator, you should
    value stability and reliability over features. Ubuntu’s brief, six-month development
    cycle means you will be able to get all the new features in half a year away.
    But then they will be in the main repositories and will have received substantial
    testing. Keeping a system up to date thus means making sure it''s running the
    latest security patches, to prevent any vulnerabilities discovered after the release
    from endangering your system.


    Luckily, apt-get makes this process amazingly easy. You begin by obtaining an
    updated list of packages from the Ubuntu archive:


    ```

    $ sudo apt-get update

    ```


    and then simply run the upgrade:


    ```

    $ sudo apt-get upgrade

    ```


    After this, apt-get will tell you either that your system is up to date or what
    it''s planning to upgrade, and it will handle the upgrade for automatically. How''s
    that for cool?


    # Running a Distribution Upgrade


    When a Ubuntu release comes out and you want to upgrade your server to it, you''ll
    use a tool, do-release-upgrade. The upgrade tool will switch over your sources.list
    to the new distribution and figure out what packages are needed and whether they
    have any known issues. After it has done this, it will ask you to confirm the
    update by pressing y or to view the updated packages by pressing d. If you choose
    to view the updates, merely type y to continue the update, as the tool will not
    prompt you again.'
