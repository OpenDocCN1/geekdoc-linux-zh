    amount of usage. Statistics as of the time of writing activity of more than 6,600,000
    messages on more than nearly 1,000,000 topics in 100 different forums. The forums
    also boast more than 822,000 users with around 10,000 active at any given moment.
    The forums continue to grow explosively. The topics discussed in the forums run
    the gamut. Are roughly broken down into the following categories:


    +   - Support discussion including spaces for questions about specific hardware
    (e.g., Dell computers with Ubuntu preinstalled, or networking and multimedia cards)
    and specific use cases (e.g., desktop or server servers)


    +   - Ubuntu community discussions, including spaces for talk of people working
    on art for Ubuntu, those working in science and education, and those developing
    new documentation and tutorials


