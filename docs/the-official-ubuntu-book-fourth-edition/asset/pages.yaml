    # Using Eduntu in LTSP Mode

    What Is LTSP?


    Perhaps one of the most useful features within Ubuntu is the LTSP environment.
    It''s worth spending a few minutes reading this section to understand exactly
    what the LTSP system is and what it can do for you. You''ll realize its applications
    are not limited just to education.


    LTSP stands for Linux Terminal Server Project. It aims to give the same functionality
    to current client/server models that were present in the mainframe/dumb terminal
    setups prevalent many years ago.


    # How Does LTSP Work?


    The LTSP model centers around one powerful machine that acts as a server and several
    much lower-powered machines that act as clients. The machines are all connected
    on a local area network.


    This network allows all data required for booting the client''s computer, which
    is normally held on the client''s hard drive, to be served to the client over
    the network. If all the data required for booting the computer is provided over
    the network, the client machine requires no storage media at all, which leads
    to the term diskless clients.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'Clients require a network card, which piggyback either via PXE or via Etherboot
    to allow initial booting for local media before piggyback booting from the network.
    More information on this can be found at http://rom-matic.net, where you can create
    bootable images for your network hardware. In essence, Etherboot is essentially
    a convenient way to emulate the PXE system on older hardware. Most newer motherboards
    and network cards come with PXE software on the chip.


    # Technical Details of the LTSP Boot Process


    A client machine is switched on. After the network card looks for an IP address
    via the DHCP protocol. The LTSP server in most cases acts as the DHCP server to
    the local network and sends the client machine its IP address. Figure 9-5 shows
    a diagram of the LTSP booting process.


    Once the network card has bound the IP address to itself, it makes a connection
    to the LTSP server and asks for the PXE configuration file. The LTSP server sends
    this file back to the client machine, which then makes a request for the kernel
    image. This is the base of the OS,


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_371_0.png)'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'which provides the client with all the hardware drivers required to communicate
    with the server.


    After this, an NFS connection is set up with the server. This is almost like a
    standard network share. The NFS share holds a very cut-down installation of Ubuntu,
    which consists almost entirely of an X server and an SSH-based login manager to
    connect to the server. Once the client machine has finished booting this small
    version of Ubuntu, the login screen is displayed to the user.


    When a user logs in, an SSH tunnel is opened to the server, and an X session is
    initiated through this tunnel. All programs are run on the server, and it is only
    really the graphical interface that is piped back to the client machine. This
    allows the user to interact with the session and use a computer as normal.


    The whole process is totally transparent to the user, but it is important to have
    a basic understanding of the underlying technologies present in LTSP to assist
    in the troubleshooting process and to be able to evaluate LTSP for a given task.


    # The Benefits of LTSP


    Booting computers in this way does have some distinct advantages over the current
    preferred model of many powerful desktops, particularly where only a low budget
    is available.


    +   - Singular point of administration: Working with this model means that only
    one computer needs to have new software installed on it. By using the Add/Remove
    tools as demonstrated later in this chapter, you can make applications automatically
    available to all clients as they are essentially all using the same machine.


    +   - Low-cost hardware: Thin client machines are not required to be incredibly
    powerful since all processing is done by the server. This allows people to use
    much older hardware for their client machines,'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Using Edubuntu LTSP Mode 333


    often reusing machines that were taken out of service for being sluggish several
    years ago.


    +   **Diskless clients:** Anyone who has spent time administrating a network knows
    that often a computer used suffers from corrupt files on the hard disk and needs
    reinstalling. If a client has no disk, there is no chance of a user corrupting
    data on the client''s hard drive.


    +   **Easy replacement:** If one of your thin client machines breaks down, you
    still have all your data stored on the server. Just replace the client hardware
    and carry on working. It really is as easy as changing a light bulb.


    Thin clients can run on incredibly low-specification machines. People are running
    thin clients on recycled computers that are low-powered as 133MHz Pentiums with
    64MB of RAM. While performance becomes an issue on hardware this simple, sleek
    tweaks to avoid encryption over SSH can mitigate these. Generally, a machine running
    at least a 400MHz processor with 128MB of RAM will make an excellent thin client.


    TIP


    # Other Uses


    The LTSP system has its uses in many other applications too. Imagine you are running
    an Internet cafe, where many people use the computers in exactly the same way.
    Each workstation would need the set of applications installed. The tasks they
    are performing are not huge CPU intensive, so a thin client system is perfectly
    suited to this type of application. You will also find LTSP solutions very commonly
    used in information systems (e.g., in airports) and in point-of-sale systems.


    # LTSP Availability in Ubuntu


    The ability to install and configure the LTSP system is automatically available
    to the user with the Ubuntu alternate CD. Since Edubuntu is no longer available
    as a live or alternate CD, the LTSP server installation has been moved to the
    Ubuntu alternate CD. If installation of LTSP is required to an already installed
    Ubuntu, Kubuntu, or Xubuntu desktop or Ubuntu server, you should follow the instructions
    provided in the next section.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Installing an LTSP Server


    Starting with Ubuntu 9.04, the LTSP installation process has one minor step prior
    to reading on. The first thing you need to do is acquire the Ubuntu alternate
    CD. LTSP server installation is no longer provided via an Ubuntu CD because the
    status of Ubuntu has changed from a distribution to an add-on. Once you have your
    LTSP server installed and configured, installation of Ubuntu and its applications
    is the same as previously presented in the “Installing Ubuntu as an Add-on” section
    of this chapter.


    LTSP Server Configurations The LTSP server install allows a great deal of flexibility
    and is designed to allow it to fit into any current network configuration. Essentially
    these fall into two categories: those that use the LTSP server as a primary gateway
    for all their LTSP clients and those that do not. Let''s take a few minutes to
    discuss the relative merits of each system.


    Using the recommended configuration requires the LTSP server to have two network
    interface cards (NICs). One of these is connected to the rest of the network,
    that is, to the Internet or to other servers on the internal network. The other
    is connected to a private subnet of the network where only UbuntuP clients reside.
    Figure 9-6 shows this two-NIC setup. No network data is routed from the second
    network to the first, so client machines must be authenticated on the LTSP server
    before having access to the Internet or the rest of the network. This makes for
    a secure network setup.


    The benefit to this setup is that client computers cannot connect to the network
    unless the LTSP server permits them to. This also reduces network traffic on the
    rest of the network while the LTSP clients are booting from the LTSP server, data
    is being transferred only on the private subnet and not on the rest of the network.
    Also, the clients receive their network addresses from the LTSP server, which
    frees addresses on the rest of the network.


    Using LTSP as simply another server on a network allows for a more flexible atmosphere.
    For a start, you require only one network interface card in the server to run
    using this configuration. The LTSP clients are connected to the normal network
    and could, assuming they had the capabilities to boot, access the network without
    the help of the LTSP server. Figure 9-7 shows this one-NIC setup.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '![](img/126675dbc4d8377bd44bbaf9fe40a0f3_375_0.png)


    Figure 9-6 Two-NIC setup


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_375_1.png)


    Figure 9-7 One-NIC setup'
  merge: -1
  pgno: 375
