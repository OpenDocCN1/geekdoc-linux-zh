  md: '# Chapter 5 - The Ubuntu Server


    # TIP


    The Mythical Parity Drive

    If you lose 20GB drives into a RAID 5 array, the array''s total usable size will
    be 800GB, or that of four drives. This makes it easy to mistakenly believe that
    a RAID 5 array ''sacrifices'' one of the drives for maintaining redundancy and
    parity, but this is not the case. Through some near mathematics of polynomial
    coefficients over Galois fields, the actual parity information is striped across
    all drives equally, allowing any single drive to fail without compromising the
    data. Don''t worry, you won''t quit on the math.


    Which RAID to Choose? If you''re indecisive by nature, the past few graphs have
    left you away hunched in your chair, mercilessly chewing a No. 2 pencil, feel
    tapping the floor nervously. Luckily, the initial choice of RAID level is often
    a no-brainer, so you''ll have to direct your indecision elsewhere. If you have
    one drive, RAID is for you. Do not pass Go, do not collect $200. Two drives? Toss
    into RAID 1, and sleep better at night. Three or more? RAID 5. Unless you really
    know what you''re doing, avoid RAID 0 like the plague. If you''re not serving
    mostly read-only data without a care about redundancy, RAID 0 isn''t what you
    want.


    # TIP


    Other RAID Modes

    Though the installer offers only the most common RAID modes—0, 1, and 5—many other
