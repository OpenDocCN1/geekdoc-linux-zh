  md: 'When posting a new thread with a request for assistance, it is a good idea
    to follow these steps for the greatest effectiveness:


    +   1. Show that you tried to do some research on your problem. Mention the results
    of searching the forums or via Google, what you have tried, and the results of
    your attempts far.


    +   2. Come up with a title that accurately describes your problem. A title like
    “help, it doesn’t work” is less likely to attract attention and receive quick
    assistance than one titled “Installing nvidia video driver on laptop with GeForce
    9300M GS,


    +   3. State the important facts, but don’t rumble. All of the forum members are
    volunteers. Not a single one is paid to read answer questions. You want to keep
    your post short and to the point, with enough detail to be helpful for understanding
    the problem but not so that people get bored or overwhelmed.


    +   4. Focus on the problem you are trying to fix, and stick to one issue per
    thread. If you have multiple problems, please feel invited to post multiple threads
    asking questions. If you do this, each issue is more likely to be seen and answered.


    +   5. Be polite to those who help you, and ignore anyone who is rude. Better
    yet, use the “report post” function to inform the staff of problems by clicking
    an icon at the bottom corner of any post that is violation of the Forum Code of
    Conduct (discussed later in this chapter). If you’re not sure which icon, hover
    over each of them with your mouse pointer, and a tool tip will pop up for each
    to tell you what it does.


    +   6. When your problem is solved, please say so. If the solution was posted
    by someone in the thread you started, please acknowledge their help. If you found
    the answer elsewhere, please post it in the thread where you asked your question.
    This will help other members in the future who may be struggling with the same
    problem.


    Once you have a feel for the community and for how things work, please know that
    you are invited to help out as well. One of the pleasures of the Ubuntu Forums
    is that anyone who knows something is welcome'
