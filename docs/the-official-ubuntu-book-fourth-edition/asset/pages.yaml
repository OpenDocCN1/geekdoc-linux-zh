    # Filesystem Security


    The security model for files is standardized across most UNIX-like oper-ing systems
    and is called the POSIX model. The model calls for three broad types of access
    permissions for every file and directory: owner, group, and other. It works in
    exactly the same way as any Linux distribu-tion, which is why we won''t focus
    on it here. For a refresher, consult the man pages for chmod and chown, or browse
    around the Internet.


    We want to actually look at securing partitions through mount options, an oft-neglected
    aspect of dealing with system security that rather powerful when used appropriately.
    When explaining how to partition your system, we extolled the virtues of giving,
    at the very least, the /home, /tmp, and /var directories their own partitions,
    mentioning how it is possible to use special options when mounting these to the
    filesystem.


    Many of the special mount options are filesystem-dependent, but the ones we want
    to consider are not. Here are the ones that interest us.


    **nodev** A filesystem mounted with the nodev option will not allow the use or
    creation of special "device" files. There''s usually no good reason to allow most
    systems to allow interpretation of block or character special devices, allowing
    them potential security risks.


    **nosuid** If you read up about UNIX permissions, you know that cer-tain files
    can be flagged in a way that lets anyone execute them with the permissions of
    another user or group, often that of the system administra-tor. This flag is called
    the setuid (suid) or the setgid bit, respectively, and allowing this behavior
    outside of the directories that hold the system bina-ries is often unnecessary
    and decreases security. If a user is able to, in any way, create or obtain a setuid
    binary of his or her own choosing, the user has effectively compromised the system.


    **noexec** If a filesystem is flagged as noexec, users will not be able to run
    any executables located on it.'
