    # Watching Videos


    To watch videos in Ubuntu, you need to ensure that you have the correct codecs
    installed. As discussed earlier, some of these codecs are available separately
    due to the legal implications of including them with the Ubuntu system. Although
    the new process for suggesting and installing codecs should cover most popular
    types of files, you should still refer to the Ubuntu wiki at http://wiki.ubuntu.com
    for details of how to install ones that are not recognized.


    **Using Totem** To watch videos in Ubuntu, you use the Totem media player (Figure
    3-40). Load it by clicking Applications > Sound & Video > Movie Player.


