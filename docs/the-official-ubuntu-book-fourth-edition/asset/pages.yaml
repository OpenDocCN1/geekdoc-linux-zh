    Figure 2-12 Partitioning disks


    In most cases, you probably want to use the Guided—Use Entire Disk option. This
    will erase everything on the hard drive in your computer and set everything up
    for you. The second option, Guided—Use Entire Disk and Set Up LVM, allows you
    to use the Logical Volume Manager (LVM). The third is identical to the second
    option but also employs disk encryption, which will make your data safer and more
    secure in some circumstances. Finally, if you want to set up specific partitions,
    use the Manual option.


    Let’s look at each of these options in turn and how they are used.


    Guided—Use Entire Disk When you select this option, your entire disk is partitioned
    automatically. The installer will tell you that a primary and logical partition
    will be created, and then it asks if you want to go ahead and create the partitions.
    Click Yes, and you are done.


    Guided—Use Entire Disk and Set Up LVM Configuring LVM is covered in Chapter 5.


    Guided—Use Entire Disk and Set Up Encrypted LVM Configuring LVM is identical to
    the previous option except that it also uses a secure encryption layer to provide
    additional security and protection for your data.'
