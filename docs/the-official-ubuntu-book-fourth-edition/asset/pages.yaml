  md: '# Teams, Processes, and Community Governance 265


    Finally, the Community Council is responsible for all community-related structures
    and processes. New types of teams, requirements for membership, and core philosophical
    documents should first be approved by the Community Council. Community members
    who wish to suggest new structures or processes can submit their proposal to the
    Community Council for discussion and approval.


    The Community Council meets every two weeks on IRC. Any community participant
    can submit an item or proposal for discussion by the Community Council. Meetings
    are open to the community, but the Council seeks only consensus or votes from
    Council members—although it consults representatives from the team that submitted
    the proposal and other community members. If an open becoming too noisy, the Council
    reserves the right to move to a private channel for the duration of the meeting.
    To date, has never happened. In all situations, full transcripts of meetings are
    published immediately following a Community Council meeting. The Community Council
    at the time of this writing consists of Benjamin Mako Hill, Mark Shuttleworth,
    James Holbach, Cory Burger, Matthew East, and Mike Binger. Notably, Shuttleworth
    and Troup are Canonical employees. Appointments to the board are made by Shuttleworth
    and subject to confirmation by a vote among all members. Appointments are for
    a period of two years.


    # The Technical Board


    The Ubuntu Technical Board is responsible for the Ubuntu project''s technical
    direction. By handling all technical matters, the Technical Board complements
    the Community Council as Ubuntu''s highest most of governance. In particular,
    the Technical Board is responsible for three major areas of Ubuntu policy: package
    policy, release feature goals, and package selection. Also, the Technical Board
    is available to arbitrate any technical disagreements or issues within between
    teams in a manner similar to the one described earlier in relation to the Community
    Council.


    The Technical Board''s first responsibility is Ubuntu''s package policy. The Technical
    Board maintains the policy document, which describes the processes and standards
    to which all Ubuntu packages are held. Since the policy is constantly evolving,
    each Ubuntu Release is associated with a specific version of the Ubuntu package
    policy as determined by the Technical'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'Board. Any suggestions or proposals about policy are suggested to and considered
    by the Technical Board.


    Also, the Technical Board is responsible for maintaining Ubuntu''s feature goals
    for each release. During each release cycle, there is a date defined as Feature
    Freeze, after which no new features are added. The Technical Board sets these
    dates and decides when and if the rules can be bent for a particular feature or
    piece of software.


    Finally, the Technical Board is responsible for maintaining the list of pieces
    of software (i.e., packages) in Ubuntu. In this capacity, the Technical Board
    determines which software is installed in the default desktop installation and
    which packages qualify for full support as the main component of Ubuntu. Users
    and developers can propose a particular piece of software for inclusion in main,
    the base install, or a desktop install. In all cases, the ultimate decision will
    be made by the Technical Board.


    Like the Community Council, the Technical Board meets at least two weeks on IRC.
    Also like the Community Council, any user can submit an item or proposal for discussion
    by the Technical Board ahead of the meeting. Meetings are open to all interested
    parties, although decision making and voting is restricted to Technical Board
