    sudo apt-get install xubuntu-desktop


    # Managing Your Edubuntu Clients


    Although you will not be installing anything on your clients, it is important
    to realize that there are still some maintenance tasks specifically towards the
    clients.


    # Updating the Client NFS Root


    You may have an up-to-date server, but this does not necessarily mean that the
    system clients run on up to date. Remember that essentially you have two versions
    of Ubuntu installed on the Edubuntu server. One is the server and another is a
    very slimmed down that simply provides clients with enough capability to boot
    and log in.


    First, open a terminal window using the Applications > Accessories > Terminal
    link in the main menu. You need to copy your list of package sources from the
    server to the client. To do this, type the following line into the terminal window,
    press Enter, and type your password when prompted.


    ```

    sudo cp /etc/apt/sources.list /opt/ltsp/i386/etc/apt/

    ```


    Your root directory must must be altered so that you are inside the NFS client
    root. That way, when you enter commands, they will be run on the client system
    and not on the main server. To do this, issue the commands shown here. The first
    makes sure that all programs running inside the chroot will work as expected.


    ```

    sudo chroot /opt/ltsp/i386

    mount -t proc proc /proc

    ```


    Although you copied the list of package sources from the server to the client,
    you''ll need to update the actual list of packages available to be'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'installed or upgraded. To do this, you must issue the following command, which
    will download the latest list of packages from the Internet.


    ```

    apt-get update

    ```


    Once this has completed, it is time to start the upgrade. To do this, enter one
    final command:


    ```

    apt-get upgrade

    ```


    This will show you a list of all packages that need to be upgraded and will prompt
    you to continue. If you are happy with the selection, press y to confirm and to
    begin the installation process. When the installation is completed, you will need
    to reboot the client machines for the changes to take effect.


    > Important: Don''t forget to unmount the proc in the chroot by typing sudo ummount
    /proc and pressing Enter, and then leave the chroot by pressing Ctrl-D.


    # Upgrading the Client''s Kernel Version


    Once in a blue moon, or if security update is available, it is necessary to upgrade
    the kernel version of the client machine. This process should be treated with
    caution and should really be performed only if you are experiencing problems with
    your client''s hardware. To upgrade the kernel version in the client NFS root,
    you must explicitly tell it to install the new kernel. Much like in the upgrading
    of the client software described in the previous section, you must first load
    a terminal and enter the client chroot, using this command:


    ```

    sudo chroot /opt/ltsp/i386

    mount -t proc proc /proc

    ```


