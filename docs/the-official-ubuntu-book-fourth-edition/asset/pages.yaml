    # Virtualization


    If there''s been one buzzword filling out the server space for the past couple
    of years, it''s virtualization. In August 2007, a virtualization company VMware
    raised about a billion U.S. dollars in its initial public offering, and the term
    virtualization finally went supernova, spilling from the technology realm into
    the financial mainstream, and to CIOs and technology managers everywhere.


    Fundamentally, virtualization is a way to turn one computer into many. (Erudite
    readers will note this is precisely the opposite of the Latin motto on the Seal
    of the United States, "E Pluribus Unum," which means "out of many, one.") Some
    technologies that match description, too like Single System Image, or SSI, grids.
    If we talked about virtualization in Latin, it would be "Ex Uno Plura.") Why is
    it useful to turn one computer into many?


    Back in the 1960s, servers were huge and extremely expensive, and no one wanted
    to buy more of them than they absolutely needed. It soon became clear that a single
    server, capable of running different operating systems at once, would allow the
    same hardware to be used by different people with different needs, which meant
    fewer hardware purchases, which meant happier customers with less devastated budgets.
    IBM the first to offer this as a selling point, introducing virtualization in
    its IBM 7044 and IBM 704 models, and later in the hardware of its Model 67 mainframe.
    Then, the industry largely moved away from mainframes and toward small cheap rack
    servers, which meant the need to virtualize mostly went away. If you needed to
    run separate operating systems in parallel, you just bought two servers. But eventually
    Moore''s law caught up with us, and even small rack machines became so powerful
    that organizations found many of them underutilized, while buying more servers
    (though cheap in'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'itself) meant sizable auxiliary costs for cooling and electricity. This set
    the stage for virtualization to once again become vogue. Maybe you want to run
    different Linux distributions on the same machine. Maybe you need a Linux server
    side by side with Windows. Virtualization delivers.


    There are four key types of virtualization. From the lowest level to highest,
    they are hardware emulation, full virtualization, paravirtualization, and OS virtualization.
    Hardware emulation means running different operating systems by emulating, for
    each, all of a computer''s hardware in software. The approach is very powerful
    and painfully slow. Full virtualization instead uses a privileged piece of software
    called a hypervisor as a broker between operating systems and the underlying hardware,
    and it offers good performance but requires special processor support on instruction
    sets like the ubiquitous x86. Paravirtualization also uses a hypervisor that supports
    only operating systems that have been modified in a special way, offering high
    performance in return. Finally, OS virtualization is more accurately termed “containerization”
    or “zoning” and refers to operating systems that support multiple user spaces
    using a single running kernel. Containerization provides native-performance benefit
    but isn''t really comparable to the other virtualization approaches because it
    is not running multiple operating systems in parallel but carving one into isolated
    pieces.


    The most widely used hardware emulators on Linux are QEMU and Bochs, available
    in packages quemu and both respectively. The big players in full virtualization
    on Linux are the commercial offerings from VMware, IBM''s z/VM, and most recently,
    a technology called KVM that''s become part of the Linux kernel. In paravirtualization,
    the key tender is Xen; the Linux OS virtualization space is dominated by the OpenVZ
    and Linux-VServer projects, though many of the needed interfaces for OS virtualization
    have gradually made their way into the Linux kernel proper.


