    # Planet Ubuntu


    It is hardly surprising that most of the Ubuntu community is highly geared towards
    gathering and distributing information and communication about Ubuntu. Of course,
    before the Ubuntu community is a group of people working on the project of building,
    supporting, and spreading a GNU/Linux distribution, it is first a group of people.
    For the community its members should have some idea of what other members are
    up to—both in their Ubuntu work and in their lives extend beyond Ubuntu.


    Planet Ubuntu (http://planet.ubuntu.com) tries to capture this element of the
    Ubuntu community (Figure 7-4). Planet is a Web log aggregator and can be thought
    of as a blog of blogs. Planet retrieves the latest journal or log entries from
    Ubuntu members who have chosen to add content to the system and then publishes
    a single blog that includes, in reverse chronological, all of the latest entries.
    Much of the content in Planet Ubuntu is about Ubuntu. Sometimes this is because
