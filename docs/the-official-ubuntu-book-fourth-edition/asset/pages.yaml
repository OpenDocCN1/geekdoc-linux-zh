    # Other Functionality


    In addition to Malone, Rosetta, Blueprint, and Answers (the hidden flagship products
    within Launchpad) and Soyuz (the diligent workhorse that allows Ubuntu to work),
    Launchpad has several other important uses. We''ve already alluded to the fact
    that Launchpad handles all the authentication for all the Ubuntu Web sites. If
    you want to edit or create a Web page in the Ubuntu wiki or even order a CD, you
    must first create an account in Launchpad. In addition to holding a username and
    password, a Launchpad account can contain rich information about each individual,
    including GNU Privacy encryption key, wiki pages, contact information, and more.
    More important, Launchpad also contains representations of every team and group
    within Ubuntu and handles permission within the entire Ubuntu world. For example,
    the only people who are allowed to upload core packages to Ubuntu are people who
    are part of the Ubuntu Core Developers Team in Launchpad.'
