    # Ubuntueros and Ubuntu Members


    Membership in the Ubuntu project is one official way that the project sustains
    and significant contributions. The first level of membership in Ubuntu is as an
    Ubuntuero (formerly, the name was Ubinite). Ubuntueros are activists and can be
    any person in the Ubuntu community who has explicitly committed to observing the
    Ubuntu Code of Conduct. Ubuntueros are self-nominated and self-confirmed. Using
    Launchpad, participants can generate a GPG encryption key and “sign” the Code
    of Conduct as a way of pledging to uphold within the Ubuntu community. By doing
    so, participant gains status as an Ubuntuero.


    The next, more significant, step is official membership. Official membership is
    available to any Ubuntuero who has demonstrated a significant and sustained set
    of contributions to the Ubuntu community. These contributions can be of any kind—technical
    or nontechnical—but need to be of a form that can be represented to the Community
    Council, which will consider each application individually. A list of types of
    contributions that qualifies in the following section on getting involved. The
    Community Council tries to be flexible in the variety of different types of contributions
    that it accepts in consideration of membership.


    Members are responsible for confirming, by voting, all nominations to the Ubuntu
    Community Council. They may also be asked by the Community Council to vote on
    resolutions to the general membership. In exchange, members gain the right to
    an @ubuntu.com e-mail address and the right to carry Ubuntu business cards. Membership
    lasts for two years and is renewable. Members who fail to renew their membership
    will be marked as inactive but, with renewed activity and a simple procedure that
    involves approval of the Community Council, can be easily reactivated.'
