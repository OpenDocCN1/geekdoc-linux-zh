  md: '# Managing Music


    Amarok is the default application for browsing and managing your music collection.
    Kubuntu 9.04 includes Amarok 2, which is a large rewrite of Amarok. Amarok is
    a powerful program that can track your podcasts and music and even provides access
    to an open music store (Magnatune). Magnatune is a music store that is completely
    free of DRM (Digital Rights Management) restrictions. Looking for Online radio
    stations? Amarok provides access to multiple online radio stations through Cool
    Streams and also Shoutcast Streams. Amarok can also manage your portable music
    player (Figure 8-29). Once you have connected your music player, it will show
    up in the device section. Then feel free to manage your files and playlists.


    The first time Amarok is launched, it recommends installing additional multimedia
    packages from the restricted repository. Depending on where you live, you may
    encounter some legal restrictions for installing these pieces. The recommended
    packages are for MP3 Tag Reading and Encoding, Flash, Video Codecs, MPEG Plugins,
    and DVD Reading. A notification from Update Notifier will load in the Taskbar,
    and after double-clicking, you will be prompted to select which components to
    install. To install these packages, you will need the administrative password.


    # Common Applications


    Kubuntu comes with a large number of applications preinstalled and configured,
    including Web browsers, office applications, and e-mail programs. Remember, since
    choice is a huge feature of Kubuntu, if you do not like the default applications,
    you can always change them. All of these applications are available through the
    Application Launcher.


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_343_0.png)


    Figure 8-29 Managing your music player in Amarok'
