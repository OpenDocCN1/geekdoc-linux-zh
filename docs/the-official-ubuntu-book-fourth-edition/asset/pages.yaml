  md: 'UBUNTU IS NOT MERELY a COMPLETE operating system; it is also the center of
    a growing ecosystem of distributions. Some, referred to as the partner projects,
    work closely with and within Ubuntu. Others prefer to work outside the project
    and are considered full derivatives. Often, these projects are created in order
    to highlight a specific selection of software or use case, such as the nUbuntu
    project, which focuses on security and networking tools. Others, like the gNewSense
    project supported by the Free Software Foundation, exist for philosophical or
    social reasons.


    Others are created for reasons connected to the international nature of Linux
    and open source software. While most Ubuntu development happens in English, there
    are large developer and user communities in other languages and countries. Thus,
    a derived distribution might spring up to satisfy that need. There are derived
    distributions targeted at Christians, Muslims, people with slow computers, and
    people who prefer to have an Ubuntu system optimized for any of several alternative
    user interfaces or for use in several different schools and government bureaucracies
    across the world. Should you use any of these over Ubuntu? We can''t answer for
    you. Some of these projects are fully within and, as a result, not mutually exclusive
    from Ubuntu. Others might be more depending on your preferences or circumstances.
    You can mix, match, and sample these distributions until you find that what works
    for you. As we mentioned in Chapter 1, Ubuntu sees these derivatives as a sign
    of a healthy and vibrant community. One of the goals of the project is to make
    easier for this type of distribution to appear. We can expect to see more of them
    in the future.


    # Officially Supported Derivatives


    Officially supported derivatives, formerly called Partner projects, are those
    projects that work in close relation with Ubuntu. They share a common repository
    of packages and release in sync with Ubuntu. These derivatives are officially
    supported by Canonical in both development and security.


    # Kubuntu


    Kubuntu is the first and oldest of all the partner projects. First released alongside
    Ubuntu 5.04 (Hoary Hedgehog), Kubuntu, which means “toward'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'humanity” in Bemba, builds on the strengths of the K Desktop Environment (KDE)
    rather than GNOME as Ubuntu. The project is led by Jonathan Riddell, who now works
    for Canonical, Ltd.


    As with Ubuntu, Kubuntu is a complete desktop, but one built around KDE and Qt.
    Rather than Ubuntu’s brown theme, Kubuntu opts for a more traditional blue and
    only a few visual choices. Rather than the two panels and three menus of Ubuntu
    with GNOME, Kubuntu uses two menus and a single lower panel, close in style to
    that of Microsoft Windows.


    Kubuntu also comes with OpenOffice, the same office suite included in Ubuntu.
    Along with this office suite, Kubuntu also includes Krita, the K3b CD Creator
    tool, and the media player Amarok, all parts of KDE. Kubuntu is explored in much
    depth in Chapter 8 and is not given a full treatment here.


    +   TIP

    Kubuntu can be found at www.kubuntu.org.


    # Edubuntu


    As the name implies, Edubuntu is a version of Ubuntu for use in schools and other
    educational environments. Edubuntu uses the thin client technology of the Linux
    Terminal Server Project (LTSP) as well as a number of programs aimed at the educational
    market, such as GCom and the KDE education. Oliver Gawert, a Canonical, Ltd. employee,
    leads the Edubuntu development. Like Ubuntu, Edubuntu uses the GNOME desktop.
    One of Edubuntu’s unique features is the inclusion of the LTSP in an easy-to-use,
    out-of-the-box installer. Ubuntu uses a different method of deploying clients
    over a network than is used in traditional computer deployments. Instead of full-powered
    computers, LTSP uses thin clients, less capable, cheaper computers that connect
    to a larger server and have it to do all the processing work.


    Edubuntu has grown rapidly over the last two years. As a result, we’ve included
    a full chapter on the subject at the expense of a longer section here. Worth noting
    perhaps is the fact that rather than simply a different'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'distribution, Edubuntu is now distributed as an add-on to a standard Ubuntu
    install. To learn much more about this and about the project, take a look at the
