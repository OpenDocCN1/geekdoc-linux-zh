  md: '# Mailing Lists


    The single most important venue for communication in Ubuntu is the Ubuntu mailing
    lists. These lists provide the space where important announcements are made and
    where development discussions take place. There are, at the time of this writing,
    280 public e-mail lists. This number is constantly growing—there were less than
    half as many when we wrote the third edition of this book a year ago and half
    that many a year before that!


    An up-to-date, full page of mailing lists for Ubuntu can be found at http://lists.ubuntu.com,
    where users can see a list of available mailing lists, viewed archived discussions,
    and subscribe to lists through a Web interface.


    Lists are one of the oldest forms of communication by e-mail. A mailing list provides
    a single e-mail address that, when mailed to, will then relay the received message
    to a large number of people. In Ubuntu, others and individuals can subscribe to
    a mailing list if they want to receive information on the list''s topic. All mailing
    lists at Ubuntu are hosted at lists.ubuntu.com. If you would like to send a message
    to a list, simply e-mail `<mailinglist>@lists.ubuntu.com`, replacing `<mailinglist>`
    with the name of the list you are trying to.


    With a few exceptions (e.g., the e-mail lists for the Technical Board or Community
    Council), anybody can subscribe to any Ubuntu list. In most cases, the capability
    to send e-mail to lists is restricted to list members (membership in lists is,
    of course, open to anyone). This means that an e-mail sent to a list from someone
    who is not a member of that list puts into a queue to be reviewed by a human moderator
    before it is broadcast to list members. Users can subscribe to lists and then
    configure the system to never send e-mail. For several mailing lists, *all* messages
    are moderated. This is largely to ensure that lists remain "low volume" or "announcement
    only."


    Ubuntu''s mailing lists are run by the popular Mailman software, which may be
    familiar to some users. Mailman makes it simple to subscribe to lists, unsubscribe,
    and configure any number of options about mail delivery. One popular option is
    to receive a daily digest of messages rather than a separate e-mail each time
    a new message is sent. This is all available through a Web interface at http://lists.ubuntu.com.
    Users can also sub'
