    # Hardware


    There are many, many different types of hardware available for computers, including
    Webcams, network cards, hard disks, video cards, sound cards, and more. For each
    of these devices to work, a driver needs to be loaded by the Linux kernel. Unlike
    systems as Windows, you don''t need to install a special driver included with
    the device. Instead, the driver should already be included in Ubuntu and ready
    to work out of the box.


    Of course, this is not always the case, and sometimes hardware can be something
    of a beast to get working. In this section, we tear apart some of the hardware-related
    problems and attempt to resolve them.


    # I Plug In My USB Stick and Nothing Happens


    When a USB stick is plugged in, it must be mounted before you can access it. This
    normally happens automatically, and you should see an icon on your desktop similar
    to that displayed in Figure 6-7.


    Unfortunately, in some rare cases it doesn''t work. To fix this problem, first
    check that your system is set to automatically mount USB sticks. Click System
    > Preferences > Removable Drives and Media and look in the Storage tab. The following
    checkboxes should be selected:


    +   - Mount removable drives when hot-plugged


    +   - Mount removable media when inserted


    +   - Browse removable media when inserted


    When you have selected the boxes, click Close, and try plugging in your USB stick
    again.'
