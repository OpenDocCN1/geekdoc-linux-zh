  md: 'The Lock Screen When Screensaver Is Active checkbox can be selected to lock
    the screen when the screensaver starts and, as such, requires a user to enter
    the password to reactivate the desktop. This is useful if you work in an office
    and want to ensure that no one tampers with your computer when you are away.


    # # Managing Your Files


    Files are the tofu and potatoes of any computer, and they need to be managed,
    copied, moved, renamed, grouped, and loaded. Included with Ubuntu is powerful
    yet simple file manager Nautilus that integrates tightly into your desktop. You''ll
    use it all the time even if you don''t see the name.


    Nautilus makes extensive use of drag and drop. Unlike the kind of file manager
    used in Windows with its tree view and listing of files, Nautilus displays files
    in a series of windows in which you can drag files easily. For those who can''t
    say goodbye to the tree view, Nautilus also supports that. Aside from providing
    a simpler user interface, Nautilus includes a number of useful features such as
    video and image previews, emblems, bookmarks, permissions management, and more.


    # # How Linux Stores and Organizes Files


    Before we use Nautilus, it is worthwhile to have a crash course in how files and
    folders are organized on a Linux system. If you have not used Linux before, this
    is likely to be new to you because the layout is quite different from Windows
    and Mac OS X.


    > **TIP Folders and Directories**\When reading about file management, don''t get
    confused by the terms *folders* and *directories*—both words describe the same
    thing.


    In the Windows world, each disk drive is labeled with an identifying letter such
    as C: for your hard disk and A: for the floppy disk. In the Linux world, however,
    everything is part of the same filesystem organization. as such, if you have two
    or three hard disks, a CD drive, and a USB stick plugged in, they will all be
    part of the same folder structure.'
