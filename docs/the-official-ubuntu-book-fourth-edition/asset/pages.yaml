  md: '# Blueprint


    Blueprint is Ubuntu''s custom specification and feature-tracking system. Blueprint
    provides a way that users can create specification pages, linked into the existing
    Ubuntu wiki, for features they would like to see in Ubuntu. Other interested parties
    can use Blueprint to subscribe to specifications or proposals they are interested
    in to collaborate on the development of the specification and track progress.
    Over time, users working in the wiki and in Blueprint help new ideas through a
    process that starts with “brandump”—a very rough collection of ideas and brainstorming—ends
    with an implemented feature. In Ubuntu, this (1) review by the community and trusted
    members and (2) approval by decision makers and the Ubuntu Technical Board or
    by appropriate team leaders and councils. Blueprint provides technology to support
    this process and ensure that nothing important is dropped on the floor.


    In particular, Blueprint helps leaders and decision makers on Ubuntu prioritize
    features and specifications and ensure that work is progressing on necessary features
    towards on-time completion for releases. As a result, Blueprint is used as both
    the primary specification tracker and the major release management tool for Ubuntu.


    While Blueprint is extremely useful for technical specifications, it is also used
    heavily for developing and tracking community-related proposals as well as for
    brainstorming stages into implementation. Blueprint also has features designed
    around sprints and conferences to help organize sessions and coordinate groups
    to bring forward specifications. As a final bit of trivia, it''s interesting to
    note that Blueprint was written largely by Ubuntu founder and financier Mark Shuttleworth
    himself!


    > Blueprint

    Blueprint can be found at www.launchpad.net/blueprint.


