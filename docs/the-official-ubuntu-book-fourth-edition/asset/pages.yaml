    # Starting Applications and Finding Things


    Starting applications is simple. Just click on the Applications menu on the left
    side of the panel. Inside this menu are a number of submenus for different types
    of applications. Hover your mouse over each category, and then click the application
    you want to load. As an example, click on Applications > Internet > Firefox Web
    Browser. After a few seconds the browser will pop up.


    When applications are loaded, the brown window border has three buttons on the
    right-hand side:


    +   - Left button (thin white line): This is used to minimize the application
    and put it in the taskbar.


    +   - Middle button (white square): This maximizes the window to take up the full
    desktop area.


    +   - Right button (white cross): This closes the application.


    Every application has an entry in the taskbar at the bottom of the screen. You
    can click these entries to minimize or maximize the application and right-click
    to see some other options.'
