  md: '# The definitive, authorized Ubuntu server guide: The server companion to the
    world’s best-selling Ubuntu book!


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_503_0.png)


    +   - The complete guide to using the powerful Ubuntu server capabilities that
    Canonical has been aggressively upgrading and promoting

    - Modern, easy-to-use best practices for deploying, managing, and securing any
    type of Ubuntu server

    - Two CD-ROMs contain the latest version of Ubuntu Server Edition 9.04 and the
    Long Term Support (LTS) Ubuntu Server 8.04.2.


    The Official Ubuntu Server Book covers everything mere mortals need to know to
    install, configure, and administer efficient low-cost Ubuntu servers in any environment.
    Ideal for both new and experienced Ubuntu and Linux administrators, this book
    covers a wide spectrum of core admin tasks, including automated Kickstart and
    FAI installation techniques; package management; security; backup; monitoring;
    and even virtualization. Readers will also find detailed, step-by-step recipes
    for installing and configuring each type of server, including web, database, DNS,
    DHCP, file, mail, and many other types. Being administrators and power users can
    rely on this book from the moment they decide to install and configure their first
    Ubuntu servers. Advanced sysadmins and netadmins can save time with elegant, streamlined
    techniques that fully leverage the major improvements to Ubuntu and Linux administration
    that have been implemented in recent years.'
