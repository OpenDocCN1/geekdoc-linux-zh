    called kalach, which is much like challah or any other egg bread. The twist, of
    course, is that it is shaped like our favorite distribution''s logo (Figure 6-10).


    To create this bread, you will need the following ingredients:


    +   - 1 teaspoon of yeast

    - 3/4 cup warm water (100°F/40°C)

    - 3 eggs

    - 3 to 5 cups flour

    - 1/4 cup sugar

    - 1/4 cup oil

    - pinch of salt'
