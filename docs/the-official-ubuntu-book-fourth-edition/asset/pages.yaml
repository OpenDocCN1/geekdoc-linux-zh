  md: '# PolicyKit Authorizations


    Another new addition to System Settings is PolicyKit Authorizations (Figure 8-23).
    PolicyKit itself is an application that controls systemwide privileges. It allows
    nonprivileged users and processes to work with privileged processes. PolicyKit
    provides a fine level of control, and this part of System Settings allows you
    to customize how PolicyKit is enabled in Ubuntu.


    # Managing Files with Kubuntu


    Now that you have your system installed and set up the way you would like, it
    is time to learn how to navigate the different files and access information in
    Kubuntu. This starts with the default file manager, Dolphin. Konqueror, another
    application that can be used both as a Web browser and a file manager, is discussed
    later in the chapter.


    # Introduction to Dolphin


    Dolphin was first introduced during the 7.10 release schedule as d3olphin. The
    KDE4 version, Dolphin, is now included as the default file manager (see Figure
    8-24).


