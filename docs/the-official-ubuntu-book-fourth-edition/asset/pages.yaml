  md: '# When I Start Some Applications, I Hear No Sound on Playback


    There are literally hundreds of thousands of applications for the Linux system,
    and many of them have different requirements and dependencies. In one area in
    which this can be a problem audio software. Each audio application relies on one
    of many sound servers: pieces of software that manage communication with the sound
    card. These sound servers come in many forms, including pulseaudio, JACK, and
    the now obsolete esd and aRTs.


    In Ubuntu, pulseaudio is the default sound server. Although the media applications
    included with your desktop work fine, some other applications (such as Audacity)
    may fail to play with pulseaudio running. To solve this, go to Applications >
    System Tools > Monitor. In the list of processes, click on pulseaudio, and click
    the End Process button. By you can now use the application.


    > Remember...

    Of course, by killing pulseaudio, those applications that require pulseaudio will
    not run. Use those applications (such as the default multimedia application included
    in Ubuntu), start pulseaudio by pressing Alt-F2 and typing pulseaudio into the
    text box. You will hear some beeps to indicate pulseaudio is running.


    # My Microphone Doesn''t Work


    Although it seems an obvious first point to check, make sure that you have plugged
    your microphone into the right socket. Many computers include a number of audio
    inputs/outputs, and they can be easily fused. In recent years, a number of hardware
    manufacturers seem to gone out of their way to poorly mark these sockets, don''t
    worry if you get them mixed up. If doubt, consult your manual.


    With the microphone properly plugged in, load the recording level monitor by clicking
    Applications > Sound & Video > Sound Recorder, press Record, and speak into your
    microphone. If you record nothing, press to turn on and adjust the volume of your
    microphone. To do this, right-click the volume icon in the notification area,
    and select Open Volume Control. Inside the dialog that pops up, click the Capture
    tab, and make sure that the microphone sliders are near the top and that the small
    microphone icon not have a red cross on it. Clicking this icon toggles whether
    devices are muted.'
