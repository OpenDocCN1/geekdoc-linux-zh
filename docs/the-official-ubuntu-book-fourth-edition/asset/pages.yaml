  md: '# How Do I Get My Root Account Back?


    In a default Ubuntu installation, the root account is disabled. Instead, the user
    account created during the installation process is used with sudo to access administer
    facilities. The sudo command is used extensively to temporarily take on root privileges
    when needed.


    If you want to get the root account back, run the following command:


    ```

    foo@bar:~ sudo passwd root

    ```


    Enter your user''s password, and then enter a new root password. You will be asked
    to verify the new root password.


    +   **TIP Tired of Typing sudo?** If you want to type in a number of root commands
    and don''t want to constantly prefix every command with sudo, run the following
    command:


    ```

    foo@bar:~ su -

    ```


    This will upgrade your terminal to the root user. You can also use the -i switch
    in sudo:


    ```

    foo@bar:~ sudo -i

    ```


    Everything you type in now is as the root user. To go back to your original user,
    use the following command:


    ```

    foo@bar:~ # exit

    ```


    When using this command, note that when you are a normal user, the prompt ends
    with a $ symbol, but when you are working as the root user, it ends with a # symbol.


    To disable the root account at a later date, run the following command:


    ```

    foo@bar:~ sudo passwd -l root

    ```


    This will lock the root account.


