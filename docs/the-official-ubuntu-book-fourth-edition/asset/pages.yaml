    # Multimedia


    Multimedia is playing an increasingly important role in modern desktops, and most
    people like to listen to music, watch movies, and watch videos on their desktops.
    Unfortunately, multimedia had something of a checkered history in the Linux world
    due to the licensing problems with the all-important codecs required to view and
    hear media. This section explores some of the common problems faced with multimedia
    and your Ubuntu desktop.


    > Restricted Formats

    You can get further help and guidance on restricted media formats that don''t
    ship with Ubuntu by visiting http://help.ubuntu.com/community/RestrictedFormats.


    # I Downloaded a Particular Media File, and It Won''t Play


    Included with Ubuntu are open source codecs such as Ogg Vorbis and Ogg Theora,
    but the vast majority of media on the Internet use restrictively licensed codecs
    such as MP3, Windows Media, QuickTime, and others.


    Ubuntu does not ship these codecs for legal reasons. It is legally questionable
    to freely distribute most multimedia codecs because either the codec is patented
    or the player is reverse engineered and, as such, may fall foul of the Digital
    Millennium Copyright Act (DMCA) in the United States. For most cases, when you
    attempt to play the multimedia file, the movie or audio player will attempt to
    install the codecs as they are needed.


    Ubuntu 7.04 began shipping a new tool to help address this problem. If you try
    to play a file without a necessary codec, Ubuntu will prompt you'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'allow you to automatically install any available codecs that can decode the
    file in question.


    # My DVD Won''t Play


    As with the previous problem, DVD playback is also a somewhat restricted process
    that requires special software to be installed. The software is available if needed.
    See http://help.ubuntu.com/community/RestrictedFormats/PlayingDVDs for more details.


    # DVD Playback Is Jittery and Jumpy


    When you watch DVD movies on your computer, you may find that they are jittery
    and unstable. In most cases the problem is that the direct memory access (DMA)
    mode in your DVD drive is not enabled. When you enable this mode, your problems
    should appear.


    Check whether DMA mode is enabled by running this command:


    ```

    foobar:~$ sudo /sbin/hdparm /dev/hdc | grep dma

    ```


    Most DVD drives are /dev/hdc, but change the final letter if yours is different.
    If DMA mode is not enabled, you will see this:


    ```

    using_dma = 1 (on)

    ```


    To turn on DMA mode, run this command:


    ```

    foobar:~$ sudo /sbin/hdparm -d1 /dev/hdc

    ```


    Now try to play your DVD.


    If this solves your problems, you should edit /etc/hdparm.conf and add the following
    block:


    ```

    /dev/hdc {

    dma = on

    }

    ```'
  merge: -1
