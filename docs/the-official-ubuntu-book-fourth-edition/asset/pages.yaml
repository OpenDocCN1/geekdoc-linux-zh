  md: '# Executing Multiple Commands


    Often you may want to execute several commands together, either by run- one after
    another or by passing output from one to another.


    # Running Sequentially


    If you need to execute multiple commands in sequence but don''t need to pass output
    between them, there are two options based on whether or not you want the subsequent
    commands to run only if the previous- mans succeed or not. If you want the commands
    to run one after the other regardless of whether or not preceding commands succeed,
    a place : between the commands. For example, if you want to get information about
    your hardware, you could run llsci ; llsusb, which would output unfor- tion on
    PCI buses and USB devices in sequence.


    However, if you need to conditionally run the commands on whether the previous
    command has succeeded, insert && between commands. An example of this is building
    a program from source, which is traditionally done with ./configure, make, and
    make install. The commands make and make install require that the previous commands
    have completed success- fully, so you would use ./configure && make && make install.


    # Passing Output


    If you need to pass the output of one command so that it goes to the input of
    the next, after the character used between the commands, you need something called
    a pipe, which looks like a vertical bar or pipe (|).


    To use the pipe, insert the | between each command. For example, using the | in
    the command ls | less allows you to view the contents of the ls easily.


    # Moving to More Advanced Uses

    of the Command Line


    There are a great number of good books out there for working the com- mand line.
    In addition, because most of the command line has not changed in many years, a
    large body of information is available on the'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Moving to More Advanced Uses of the Command Line


    Internet. If you need help with something, often simply searching for the command
    will turn up what you need.


    As you can imagine, there are hundreds and hundreds of different commands available
    on the system, and we don''t have the space to cover them here. A number of superb
    Web sites and books can help you find out about the many different commands.


    To you get started, here are some recommendations.


    +   - A Practical Guide to Linux® Commands, Editors, and Shell Programming by
    Mark G. Sobell (Prentice Hall, 2005) is a good book for any user of the shell
    in Linux to have on his or her bookshelf.


    +   - LinuxCommand.org, found at http://linuxcommand.org/, is an excellent Web
    site designed to help people new to using the command line.


    +   - The Linux Documentation Project, found at www.tdldp.org/, is an excellent
    and free resource for many things Linux.'
