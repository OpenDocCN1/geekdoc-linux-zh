    # Controlling and Managing the Users’ Desktops

    Thin Client Manager began life as Student Control Panel in Dapper 6.06 and was
    written by Oliver Grawert. It was then revamped and feature-enhanced in 6.10,
    and again in 7.04 by Pete Savage and Oliver Grawert. Thin Client Manager now offers
    many of the features you would find in a commercial client network management
    package. Designed specifically to administrate and manage the LTSP thin client
    environment, it provides the following features.


    +   - Stop a process on the client’s machine.

    - Log users out of their sessions.

    - Send users a message.

    - Run an application on the client’s machine.

    - Blank or lock users’ screens.

    - Lock down clients using Pessulus.

    - Add users to groups for ease of filtering.

    - Use a plug-in framework to perform simple tasks.


    Using Thin Client Manager

    Upon loading Thin Client Manager for the first time, you will be presented with
    a screen similar to the one shown in Figure 9-16. The screen is basically split
    into two sections. The first is the user list, on the left-hand side, which shows
    a constantly updating list of all users who are logged into the LTSP server. The
    second section, on the right, contains the Process View and Screen Viewer tabs.
    This section is tab operated so that you can switch between viewing the currently
    processes/running applications and, in the future, a selection of four screenshots
    of currently running clients.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Chapter 9 ■ Using Eduntu


    ![](img/126675dbc4d8377bd44bbaf9fe40a0f3_396_0.png)


    Figure 9-16 Thin Client Manager


    # Managing Processes


    You can end a user''s running applications by first choosing a user, selecting
    a process from the right-hand side, and then clicking on the End Process button.
    You will be asked to confirm your actions. After you do, an internal message is
    sent to the client''s session asking for the program to terminate.


    # Logging Users Out Of Their Sessions


    If desired, you can log a user out of his or her session by first selecting the
    user and then clicking on the Disconnect button. (You can also select multiple
    users.) You will then be asked to confirm your actions. After you do, an internal
    message is sent to the user''s session. This will log the user out of the current
    session.'
  merge: -1
