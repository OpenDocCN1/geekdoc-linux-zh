    # # Teams, Processes, and Community Governance


    Ubuntu operates under the famous hacker mantra of “rough consensus and running
    code.” The project attempts to forge consensus, to make technical decisions, and
    to move forward. It attempts to minimize polarization wherever possible and distribute
    power to those who are best at getting good work done. Mark Shuttleworth explains,
    “This is not a democracy, it’s a meritocracy. We try to operate more on consensus
    than on votes, seeking agreement from the people who will have to do the work.”


    The project attempts to keep disagreements from spiraling out of control by enforcing
    mutual respect at all times with the Code of Conduct described in Chapter 1. Disagreements,
    of course, are inevitable and can be technical or nontechnical in nature. The
    community needs to be able to deal with these and, toward that end, has created
    a lightweight governance system that ensures that disagreements are carefully
    resolved and that the project always has a strong, fair, and responsive direction.'
