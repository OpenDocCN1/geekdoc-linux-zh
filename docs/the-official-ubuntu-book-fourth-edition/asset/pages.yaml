  md: 'splits up physical volumes into small slabs of bytes (4MB by default), each
    of which is called a physical extent, or a PE.


    Okay, so that was a mouthful of acronyms, but as long as you understand the progression,
    you''re in good shape. You take a physical hard drive and set up one or more partitions
    on it that will be used for LVM. These partitions are now physical volumes (PVs),
    which are split into physical extents (PEs) and then grouped in volume groups
    (VGs), on top of which you finally create logical volumes (LVs). It''s the LVs,
    these virtual partitions, not the ones on the physical hard drive, that carry
    a filesystem and are mapped and mounted into the OS. And if you''re really confused
    about what possible benefit we get from adding all this complexity to wind up
    with the same fixed-size partitions in the end, hang in there. It''ll make sense
    in a second.


    The reason LVM splits physical volumes into, equally sized extents is that the
    definition of a volume group (the space that will be carved into logical volumes)
    becomes “a collection of physical extents” rather than “a physical area on a physical
    drive,” as with old-school partitions. Notice that “a collection of extents” says
    nothing about where the extents are coming from and certainly doesn''t impose
    a fixed limit on the size of a volume group. We can take PEs from a bunch of different
    drives and toss them into one volume group, which addresses our desire to abstract
    partitions away from physical drives. We can take a VG and make it bigger by adding
    a few extents to it, maybe by taking them from another VG, or maybe by tossing
    in a new physical volume and using extents from there. And we can take a VG and
    move it to different to a different collection of extents. Best of all, we can
    do this on the fly, without any server downtime.


    Do you smell that? That''s the fresh smell of the storage revolution.


    # Setting Up LVM


    By now, you must be convinced that LVM is the best thing since sliced bread. Which
    it is—and, surprisingly enough, setting it up during installation is no harder
    than setting up RAID. Create partitions on each physical drive you'
