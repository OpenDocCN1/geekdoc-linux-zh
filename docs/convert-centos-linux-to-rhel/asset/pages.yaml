  md: '# Cheat sheet


    # Convert CentOS Linux to RHEL


    Convert2RHEL is a command-line utility that facilitates a smooth migration from
    CentOS Linux 7 to a fully supported Red Enterprise Linux (RHEL) operating system.


    Convert2RHEL simplifies the process by converting existing CentOS systems to RHEL,
    ensuring compatibility and a seamless transition. Because CentOS Linux was derived
    from RHEL sources, users migrating to RHEL can continue to use many of the same
    techniques and elements with minimal training, while also gaining features, tools,
    support, and value.


    This cheat sheet outlines the steps to convert a CentOS Linux instance to RHEL
    using the Convert2RHEL tool.


    # 1. Validate CentOS


    Check whether you have a valid CentOS release version:


    ```

    cat /etc/centos-release

    ```


    Output:


    ```

    CentOS Linux release 7.9.2009 (Core)

    ```


    Switch to root user by using following command


    ```

    sudo su -

    ```


    # 2. Update your system


    Check that your system is up to date before starting the conversion.


    ```

    yum update -y

    ```


    Output:


    ```

    Loaded plugins: fastestmirror

    Loading mirror speeds from cached hostfile

    * base: centos.excellmedia.net

    * extras: centos.excellmedia.net

    * updates: centos.excellmedia.net

    Resolving Dependencies

    -> Running transaction check

    -> Package NetworkManager.x86_64 1:1.18.8-1.el7 will be updated

    -> Package NetworkManager.x86_64 1:1.18.8-2.el7_9 will be an update

    ```'
  merge: -1
  pgno: 0
