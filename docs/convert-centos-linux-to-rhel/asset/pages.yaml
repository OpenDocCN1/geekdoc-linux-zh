  md: '# 5. Install convert2rhel


    Install the convert2rhel utility:


    ```

    yum install -y convert2rhelnoarch

    ```


    Output:


    ```

    Running transaction check

    Running transaction test

    Transaction test succeeded

    Running transaction

    Installing : efibootmgr-17-2.11.el7.x86_64 1/3

    Installing : pepect-2.3-11.el7.noarch 2/3

    Installing : convert2rhel-1.1-1.el7.noarch 3/3

    Verifying : convert2rhel-1.1-1.el77.noarch 1/3

    Verifying : pepect-2.3-11.el7.noarch 2/3

    Verifying : efibootmgr-17-2.el7.x86_64 3/3

    ```


    Installed:

    convert2rhel.noarch 0:1.1.el7


    Dependency Installed:

    efibootmgr.x86_64 0:17-2.el7

    ppect 0:2.3-11.el7


    Complete!


    # 6. Convert to RHEL


    Find the organization_id by running this command:


    ```

    subscription-manager org id

    ```


    Use the name of the organization_id in the next step. Begin the conversion by
    running the following command:


    ```

    convert2rhel -org <organization_id> -activationkey convert2rhel

    ```


    You can pass a -y tag to answer yes to the questions that follow.


    Output:


    ```

    Continue with the system conversion? [y]: y

    ```


    ```

