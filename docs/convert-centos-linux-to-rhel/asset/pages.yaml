  md: '# 3. Secure the packages


    Download the signing keys to ensure that we are pulling in only Red Hat created
    and vetted packages:


    ```

    curl -o /etc/pki/rpm-gpg/RPG-GPG-KEY-release

    https://www.redhat.com/security/fd43d51.txt

    ```


    Copy the SSL certificates from Red Hat Subscription Management, which will allow
    us to pull packages over a secure channel:


    ```

    curl --create-dirs -o /etc/rhsm/ca/redhat-uep.pem

    https://ftp.redhat.com/redhat/convert2rhel/redhat-uep.pem

    ```


    # 4. Download the repository definition


    Download a repository from the Red Hat FTP server to your `/etc/yum.repos.d/`
    directory:


    ```

    curl -o /etc/yum.repos.d/convert2rhel.repo

    https://ftp.redhat.com/convert2rhel/7/convert2rhel.repo

    ```


    To verify Convert2RHEL for CentOS 7 is configured for usage run, enter the following:


    ```

    yum repoinfo convert2rhel-for-rhel-7-rpms

    ```


    Output:


    ```

    Loaded plugins: fastestmirror

    Loading mirror seeds from cached hostfile

