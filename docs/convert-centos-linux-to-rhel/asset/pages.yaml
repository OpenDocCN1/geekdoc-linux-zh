    # 7. Reboot


    After the conversion is complete, reboot the system:


    ```

    reboot

    ```


    Take a look at `/etc/redhat-release` confirm it is a RHEL 7 server:


    ```

    cat /etc/redhat-release

    ```


    Output:


    ```

    Red Hat Enterprise Linux server release 7.9 (Maipo)

    ```'
