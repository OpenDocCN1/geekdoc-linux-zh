    # TCP/IP Networking Basics


    Linux comes with all the TCP/IP networking goodies you would expect from a full-featured
    UNIX box. It has telnet, ftp, mail, and many other services. Here''s a quick list
    of the bread-n-butter commands:


    # Basic Network Applications and Services


    +   telnet RemoteHost Connect to another system (insecure)

    login RemoteHost Login to RemoteHost (insecure)

    ftp RemoteHost File Transfer Protocol transfers files between hosts

    ssh RemoteHost Secure connection to RemoteHost

    scp RemoteHost Secure copy file from here to RemoteHost

    scp Host1:f1 Host2:f2 Secure copy f1 from Host1 to Host2


    # TCP/IP Diagnostics


    +   ping RemoteHost Send a "ping" to a remote host to check connectivity

    slookup RemoteHost Query a DNS server for hostname resolution

    route Print out the routing table (check /sbin/route)

    ifconfig Print local TCP/IP network interface configuration

    arp print/manipulate ARP cache

    tctpdump -i ethX listen to traffic on ethX


    # Networking Terms


    +   TCP/IP Transmission Control Protocol / Internet Protocol

    ARP Address Resolution Protocol

    route a route to another machine

    host Any machine on the network

    client The that wants data or a service

    server The host that provides data or a service'
