  md: '# Chapter 5


    # Process Control


    In this chapter we will learn how to control your processes both interactively
    and non-interactively. It is very important to maintain control of your system
    and manage unruly processes.


    # 5.1 Creating Foreground and Background Processes


    Process control refers to the ability to control processes both in the foreground
    and back-ground of the shell. A foreground process is one that is running interactively
    in your shell, and include most processes we have discussed so far. You can interrupt
    a foreground process by typing Ctrl-Z pronounced "control z" (hold <Ctrl> and
    hit the z key). To put that process back into the foreground, use the <bash> command
    fg.

    A background process, by contrast, is one that does not interact with your shell
    directly. It keeps itself and runs silently. To place a process into the background
    you use the builtin command bg. From the shell point of view, all processes have
    a job number. From the system''s point of view, all processes have a process ID,
    often (see the ps command).


    To actually be catch one of these processes, we need to find a command that lasts
    longer than an instant (like date). Lets work with the xterm command which creates
    an X-terminal window:


    ```

    <bash>: xterm

    Ctrl-Z

    [1]+ Stopped xterm

    # Start a fresh xterm

    # You hit Ctrl-Z and suspended it!

    <bash>: fg

    exterterm

    Ctrl-Z

    [1]+ Stopped xterm

    # Restarted with fg

    # You suspended it again.. good.

    ```'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# CHAPTER 5. PROCESS CONTROL


    ```

    <bash>:jobs      # Find the job number.

    [3]+ Stopped xterm

    <bash>:

    ```


    ```

    <bash>:bg %3      # Put xterm in the background.

    [3] xterm &\n<bash>:

    ```


    You should now have an xterm which behaves normally. The last [3] displayed indicates
    its Job Number is 3. You can use that to refer to it using fg as in


    ```

    <bash>:fg %3      # foreground it with fg

    Ctrl-Z           # Suspend it again.

    ```


    ```

    <bash>:bg %3      # Put it in the background with bg

    [3] xterm &

    <bash>:jobs

    [1] Running         xterm -cr red -ms &

    [2] Running         xclock

    [3] Running         xterm

    <bash>:kill -9 %3

    ```


    ```

    <bash>:jobs         xterm -cr red -ms &

    [1] Running         xclock

    [2] Running         xterm

    [3]- Terminated

    ```


    The jobs displays all jobs in the shell with their number and status. The kill
    -9 %N kills job N. The flag (-9) is needed to force a "sure kill" which is sometimes
    needed. The ampersand symbol (&) is what you use to put a command directly into
    the background with xterm &.


    Be careful because some commands can write errors to the standard output stdout
    and could cause strange results on your screen. To avoid this, you can redirect
    stdout to /dev/null (or a log file) AND put it into the background in one gulp:


    ```

    <bash>:xterm & /dev/null &

    or

    <bash>:xterm & /tmp/xterm-log &

    ```


    This is advisable if you plan to script your commands, because stdout that has
    no place to stop your script in tasks. Experience has shown to always deal with
    the trash in advance.'
