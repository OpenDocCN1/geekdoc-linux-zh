- pgno: 32
  md: '# 4.3 Changing File Attributes with chmod


    An important task for any Linux user is to manage file attributes (permissions)
    with the chmod command. The syntax for chmod is


    ```

    chmod [-R] MODE FILE

    ```


    where MODE can be a comma separated combinations of 3 sets of symbols:


    ```

    [ugo][+ -] [rwx]


    uu --> user

    g --> group

    o --> others

    na --> all

    ```


    You can add (+), subtract (-), or exactly (=) the mode. Examples:


    ```

    chmod u+w mail      # Add user (u) write (w) privileges

    chmod u-w mail      # Remove user (u) write privileges.

    chmod g+w mail      # Add group (g) write privileges

    chmod g-r mail      # Allow only the group read privileges, nothing else.

    chmod o+x mail      # Add execute (x) privileges for others.

    chmod a+x mail      # Add execute (x) privileges for everyone.

    chmod a=xr mail     # Allow read and execute to everyone.

    chmod go-r mail     # Remove group and others read privileges.

    chmod u+w mail      # Same as chmod+w mail

    ```


    MODE can also be an octal representation which represents the absolute mode:


    ```

    1 = others execute #=x

    2 = others write   #=w

    4 = others read    #=r

    10 = group execute #=x

    20 = group write   #=w

    40 = group read    #=r

    100 = user execute  #=x

    200 = user execute  #=w

    400 = user read    #=r

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# CHAPTER 4. FILESYSTEM ESSENTIALS


    The trick with octal is that you can add up the different numbers to get all different
    combinations of privileges like:


    ```

    1 = others execute # o=x

    + 2 = others write # o=w

    + 4 = others read # o=r

    ```


    ```

    = 7 = other read, write, and execute = o+rwx

    ```


    ```

    10 = group execute # g=x

    20 = group write # g=w

    00 = no group read #

    100 = user execute # u=x

    000 = no write execute #

    400 = user read # u=r

    ```


    add these last 6 to get


    ```

    530 = u=rx, g=wx


    chmod 750 mail => chmod u=rwx,g=rx,u=mail

    chmod 701 mail => chmod u=rwx,g=,u= (wait, error in text)

    chmod 751 mail => chmod u=rwx,g=rx,o=x mail

    chmod 741 mail => chmod u=rwx,g=r,o=x mail

    ```


