- pgno: 24
  md: '# 3.3. SHELL VARIABLES


    # 3.3 Shell Variables


    In Linux , you always keep shell variables user, directory, path, group, and many
    others. These variables help your shell cope with all the information it needs
    to deal with normal operations. As we discussed before, the set, env, printenv
    commands will display your environment variables: (with: #comments)


    ```

    PWD   = /home/carinhas/misc  # Your current working directory

    GID   = 100                   # Your current group ID number

    GROUP = users                 # Your current group name

    HOME  = /home/joe             # Your current home directory

    HOST  = astro                  # The name of your workstation.

    PATH  = <>                     # Your current path to executable commands.

    PS1  = <s>                      # Your current prompt

    SHELL = /bin/bash            # Your current shell

    UID  = 501                    # Your current user ID number

    USER  = carinhas               # Your current user name

    ```


    Your current working directory (cwd) is where all files are sought and written
    by default. wid and gid are the numerical values for your user and group, which
    identify you as a user and group member respectively. Your home is where you (and
    your files) live, and your path is where you look for your prey (executable commands).


    You can determine your cwd with the pwd command. Your cwd is always referred by
    the "dot" (.) symbol, and the directory directly is referred to by the double-dot
    (..) symbol as the result of an ls -Agl:


    ```

    <bash> ls -gl

    total 608

    drwxr-xr-x 2 joe users       1024 Dec 20 19:09

    drwxr-xr-x 15 root root       1024 Dec 10 10:04 ..

    drwx------------ 1 joe users       3185 Dec 19 15:51 .cshrc

    drwx------------ 1 joe users       3185 Dec 19 15:51 .bashrc

    dr-xr-x-- 1 joe users       33 Dec 20 10:49 doubletake

    drwxrwxrwx 1 joe users       33 Dec 20 10:49 maxwm

    ```


    Note that ".. refers to /home/joe when you are in your home directory /home/joe.
    The first character in the file listing is the file type, which tells us what
    kind of animal we have. also ~ refers to your home directory in your prompt, and
    changes to the /fully/qualified/path only when moved out of /home/joe .'
