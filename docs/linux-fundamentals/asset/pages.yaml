  md: '# 3.4 Choosing the Right Path


    Your PATH is used by the system to find commands. Its is important to set this
    correctly so that you can access everything that you need.

    To set path in bash we edit the .bash profile file:


    ```

    <bash>: pico .bash.profile

    PATH=$PATH:$bin # Add $HOME/bin to $PATH

    write and quit ... (hit Ctrl-X, type Y, return)

    <bash>: source .bash.profile # Initialize $PATH.

    ```


    Once this is done, bash will look in your own /home/user/bin folder to find any
    commands you put there. It is a good thing which will come in handy later when
    we work on scripting.


    # 3.4.1 Exercises


    Set your path in tcsh by editing your .login file, and add ~/bin to your path.


    ```

    <tcsh>: pico .login

    set path = (/bin /sbin /bin /usr/bin /usr/usr /usr/bsd) # added /bin

    write and quit ...

    <tcsh>: source .login # Install the new $path.

    <tcsh>: rehash # Tell csh to find files in $path.

    ```


    tcsh uses its refresh function to reall the folders in your path and find the
    new commands.


    # 3.5 Groups and Newgrp


    Groups allow users to have access to files and programs jointly. This is what
    the group attribute is for. Users can belong to many groups. You can belong to
    more than one group, however you can only be active in one group at a time. All
    users have a default group that they enter at login. You change your group interactively
    using the newgrp command:


    ```

    <bash>: newgrp groupname

    ```


    which will spawn a new shell (on top of the one) with your default group given
    by groupname. To work this, you must belong to this group to begin.

    Once you are in your new group state, all processes and files created will carry
    the group name as your user name. Having multiple groups can be useful when accessing'
