  md: '# 6.5.2 AWK


    Awk is a pattern scanning and process language. Its Syntax is


    ```

    awk ''program'' input-files

    ```


    When the program is long, it is usually more convenient to put it in a file and
    run it with a command like:


    ```

    awk -f program-file input-files

    ```


    Take a look at the manual now. Here are some one-liner examples:


    ```

    awk ''/***'' input.txt # Find '''''''''' in input.txt

    Most all regular expression syntax works inside the //''

    awk ''NF > 0'' input.txt

    ```


    This program prints every line that has at least one field. Its an easy way to
    delete blank lines from a file.


    ```

    awk -F: ''{ print $1 } /etc/passwd | sort

    awk ''{ END print NR } input.txt

    ```


    This program prints a sorted list of the login names of all users.

    This program counts lines in input.txt.


    ```

    awk ''NR % 2 == 0'' input.txt

    awk ''{if(length($0) > max) max=length($0)} END print max}'' input.txt

    awk ''length($0) > 80'' input.txt

    ```


    This program prints the length of the longest line.

    This program prints lines longer than 80 characters.

    Since the sole rule has a relational expression as its pattern, and the default
    action, printing the record, is used.


    ```

    awk ''BEGIN { for (i=1; i<=100; i++) print int(101 * rand()) }''

    ls -lg *.txt | awk ''{ x += 5 }; END print "total bytes:" x }

    ```


    This program prints seven numbers from zero to 100, inclusive.

    This program prints the total number of bytes used by all .txt files.'
