- pgno: 4
  md: '# Chapter 1


    # Introduction to Linux


    Linux is a computer operating system originally developed by Linus Torvalds as
    a research project. There is some interesting history about the rapid Linux evolution,
    but suffice it to say, Linux has come a long way in a decade.


    Linux runs on Intel, Mac, Sun, Dec Alpha, and several other hardware platforms.


    # 1.1 Linux Features


    +   * Linux is a full-featured, 32-bit multi-user/multi-tasking OS.

    * Linux adheres to the common (POSIX) standards for UNIX .

    * Native TCP/IP support.

    * A mature X Windows GUI interface.

    * Complete development environment. C, C++, Java, editors, version control systems.

    * Open Source.


    # 1.2 Multi-User Operation


    UNIX and Linux , all interactions with the OS are done through designated “users”,
    who each have an identification ID (login name) and a password. UNIX allows different
    users to co-exist simultaneously and allows for different levels of users.


    The most powerful user is called superuser or “root”, and has access to all files
    and processes. The superuser does many of the system management tasks like adding
    regular users, file backups, system configuration etc.


    Common users accounts, which perform non-system type tasks, have restricted access
    to system-sensitive components to protect Linux from being accidentally or purposely'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'damaged. In a moment you will enter a user account and start exploring the
    Linux filesystem.


    # 1.3 Why Linux?


    Linux can operate as a web, file, smb (WinNT), Novell, printer, ftp, mail, SQL,
    masquerading, firewall, and POP server to name but a few.

    It can act as a graphics, C, C++, Java, Perl, Python, SQL, audio, video, and documentation,
    development workstation etc.


    ![](img/88f6e495c6955949cf21ab740d865351_5_0.png)


    Figure 1.1: Linux Uses


    Linux is a good solution for developers that need a stable and reliable platform
    that has open source code. It is not a good system for beginners that want a simple
    GUI interface to a programming language, although Linux has many GUI software
    development interfaces.


    Linux is ideal as a workstation also, and offers many customizable features not
    found in any other platform. It makes a good platform for dedicated workstations
    that have limited functions in an educational or laboratory environment.


    Its may not be ideal as a workstation for beginners who want an instantly customizable
    universal WYSIWYG interface. Other systems provide solutions for this need. Still,
    Linux becomes easier to use on a daily basis. It''s only a matter of time until
    Linux is accessible by everyone.'
  merge: -1
  img_proc: true
