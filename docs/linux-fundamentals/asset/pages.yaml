- pgno: 63
  md: "# 7.3 General Scripting\n\nIn this section we will create several script programs\
    \ named \"doubleletake\" that will remove entries in a list. We will use several\
    \ of our newly learned languages to accomplish that task.\n\n# 7.3.1 awk version\n\
    \nEdit doubleletake and put in the following lines:\n\n```\n#! /bin/csh -f\n#\
    \ This script remove double in a sorted file. See the uniq manual.\nset file=\
    \ $1 # $1 is going to be the filename.\ncat $file | awk '{ if ($0 != last) {print\
    \ $0; } } { last = $0; }'\n```\n\nThe script first starts the first command in\
    \ '$1'. It then cat's the file into awk.\nNotice the initial line of\n#! /bin/csh\
    \ -f\n\nNow the script that awk does 2 things. It first checks to see if the variable\
    \ last was seen, if not, the second thing it does is to store the current line\
    \ in last. Of course you could just type the second line into the command line,\
    \ but that's not much fun if you have to do it 9 times a day.\n\n# 7.3.2 Perl\
    \ Version\n\n```\n# /usr/bin/perl -w\nmy $line = \"\"; # declare this variable.\n\
    foreach $filename (@ARGV) {# cycle through each filename in the ARGV list.\n{\n\
    \    open($SF, $filename) or die \"Can't open $filename\"; # open the file and\
    \ complain if not.\n    while (<$SF>) {\n# For every line in the file\n      \
    \  chomp($line); # Remove trailing whitespace and/or linefeeds.\n        if ($line\
    \ != $_) {\n# ne = not equal\n            print \"$line\\n\"; # Yes, print me.\n\
    \        }\n        $line = $_; # Reset $line.\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: "# 7.4 Script Automation\n\nShell scripts are great tools when you can use them,\
    \ and can save a lot of time. If you need to run applications or backups at odd\
    \ hours or nightly, you really want to automate the task by using cron tools,\
    \ which have already covered in chapter 5.4.\n\nThe following exercise describes\
    \ how to set up a script program to do your dirty work while you are playing golf\
    \ or sleeping.\n\n# 7.4.1 Getting Scripts in Order\n\nBefore you submit a cron\
    \ to handle, you must make sure you can run the job by hand. This involves making\
    \ every command self sufficient by providing complete paths to the commands and\
    \ setting the right permissions. Lets take backups for example. You need to have\
    \ privileges to write to the tape device as a normal user unless you plan to run\
    \ your jobs as root.\n\nHere is a typical script, /home/guest/bin/backup.sh that\
    \ would back up your home directory to the floppy device /dev/fd0. In this example,\
    \ the floppy is being used as a character device just like the tape drive would\
    \ be:\n\n```\n#! /bin/bash\n# This file is named backup.sh      # Make sure you\
    \ are at home.\ncd /home/guest                          # Back up your home directory\n\
    /bin/tar cvfz /mnt/fd0 .                 \necho All done boss!\n```\n\nIn this\
    \ example, we have specified all paths to commands. This is required since your\
    \ normal path/shell is not invoked in a script like this one. This script will\
    \ create a lot of output which must be sent into a log file or /dev/null later\
    \ when we make our crontab file."
  merge: -1
  img_proc: true
