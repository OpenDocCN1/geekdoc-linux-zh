  md: '# 3.2 Bash


    Bash is the default shell for Linux . The default shell is like an environment
    where all the basic commands come from bash. Let''s look at the bash manual page:


    ```

    <bash>: man bash

    ```


    Look at the default prompt on your screen. Notice that the prompt contains the
    shell name and username. The prompt in bash is controlled by the variable PS1.
    Type in the command "set" to get the following sort of output:


    ```

    PRINTER=astro

    PS1=$s

    PS2>

    PS4=+

    PWD=/home/joe

    SHELL=/bin/bash

    SHLVL=2

    TERM=vt100

    ```


    # 3.2.1 Setting your Prompt


    Note that set provides the definition for PS1 and several other variables. You
    are looking at an endless stream of information from the native Linux manual pages.
    Type by typing "man bash". Type "/prompt" to search for the word "prompt". You
    can find the next occurrence by typing "n". Keep going until you see something
    similar to


    # PROMPTING


    When executing interactively, bash displays the primary PS1 when it is ready to
    read a command, and the secondary prompt PS2 when it needs more input to complete
    a command.


    ```

    \t the current time in HH:MM:SS format

    d the date in "Weekday Month Date" format

    w the name of the shell, the basename of $0

    w the current working directory

    W the basename of the current working directory

    u the username of the current user

    h the hostname

    # the command number of this command

    ! the history number of this command

    $ if the effective UID is 0, a, #, otherwise a $

    ```'
  merge: -1
