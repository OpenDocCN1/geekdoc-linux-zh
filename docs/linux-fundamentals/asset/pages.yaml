- pgno: 76
  md: '# 9.2 Using X-Windows Over the Network


    One great thing about X is that it has networking right into it. You can use any
    X application from anywhere on your network. All you need to do is set a few parameters
    that allow communications.


    # 9.2.1 Connecting X to another client


    There are two things you do to get X to work over a network. First you need to
    allow other machines to connect to your workstation. One way to do this is use
    xhost RemoteHost, where RemoteHost is the machine you want to communicate with.
    Second, you must telnet (or ssh) to another workstation, and set the DISPLAY environment
    variable to your workstation like this:


    ```

    [LocalHost]/home/joe:xhost + RemoteHost

    [LocalHost]/home/joe:telnet RemoteHost

    Red Linux release 6.1

    Kernel 2.2.12-20 on an i586

    login: joe

    Password: ******

    Last login: Jan 13 12:13:37 from bistro.rr.com

    [RemoteHost]/home/joe:setenv DISPLAY LocalHost:0

    [LocalHost]/home/joe:xcalc - title RemoteHost

    Ctrl-C

    [RemoteHost]/home/joe:exit

    [LocalHost]/home/joe:

    ```


    Remember that RemoteHost and LocalHost need to be changed to whatever your workstation
    is named. What you should have now is a process that is run by the remote system!
    It should be clear that this is powerful. In the next chapter we''ll talk about
    other networking features.. If you put a line like the following in your .login
    or .bashrc, your DISPLAY variable will be set automatically for you. Play with
    this for a second:


    ```

    <tcsh>:setenv DISPLAY ''who am i | perl -n ''\/(.+)/; print $1":""0'' in bash,

    <bash>:set DISPLAY=''who am i | perl -n ''\/(.+)/; print $1":"""0''

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# CHAPTER 9. TCP/IP NETWORKING BASICS


    # 9.2.2 Securing Your X Connection


    Above we talked about xhost and how it allows other machines to connect to your
    X-Server on your workstation. There is a security flaw that allows ALL people
    from the RemoteHost to connect to your workstation. This “hole” has been used
    to exploit many a computer.


    Fortunately there is a secure alternative to using xauth. The way to use xauth
    is to first execute xauth list on the RemoteHost, grab the information it produces
    with your mouse (middle-click drag), and then paste it (middle-click) on your
    workstation after typing xauth add.


    ```

    [RemoteHost]/home:xauth list

    bistro.max:0 MIT-MAGIC-COOKIE-1 6c7d8ba30a

    bistro/unix:0 MIT-MAGIC-COOKIE-1 7bf452301a230498

    localhost:0 MIT-MAGIC-COOKIE-1 a43f0989db

    localhost:10 MIT-MAGIC-COOKIE-1 3c08b9241d

    ```


    On your (local) workstation:


    ```

    <bash>:xauth add bistro/unix:0 MIT-MAGIC-COOKIE-1 7bf452301a230498

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Network Security for Users


    Network security from a user point of view is simple: Don''t use easy-to-guess
    passwords, and don''t leave the “R” commands open to attack.


    Hard to guess passwords do not resemble any word and should have non alphabetic
    characters in them. Hello is not a good password, but h39Xz is. Hackers always
    use crack which uses a dictionary to guess passwords, and Hello would be cracked
    in a few seconds. As far as security is concerned, you need remember a couple
    of things.


    +   * Always keep your home directory () protected.

    * `bash: chmod -R 700 ~`


    +   * Don''t use Rcommands over an insecure network, as hackers can see most everything.
    If you secure shell OpenSSH and secure versions of R-commands, you are better
    off. Check http://www.openssh.org for info on OpenSSH.


    +   * Programs like telnet show your passwords over the Internet. Use OpenSSH
    from http://www.openssh.org.


    +   * Never tell anyone your password, and if you do, change it the next day.


    +   * `chmod 600 .hosts`


    +   * Change your password every few months.


    +   * Never write your password down or identify it as a password.


    +   * Pick an account name that is difficult to guess. Passwords should have uppercase,
    lowercase, and numerical characters. Do not use a dictionary word as a password
    or even part of a password. You can check your password tables again crack at
    http://ftp.cerias.purue.edu/pub/tools/unix/pwdutils/crack.


    +   * Check permissions on files periodically. Most files should be 600 or 700.'
  merge: -1
  img_proc: true
