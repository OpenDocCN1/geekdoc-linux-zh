- pgno: 73
  md: '# 9.1 Network Communication


    This section covers network communication from a user point of view. We won''t
    talk much about how to set up hardware or server configurations. This has already
    been done by your administrator.


    # 9.1.1 Checking Network Status


    Sometimes it is unclear if your network is working correctly. There are some easy
    commands that you can use to check if a computer is “alive” on the network. The
    first and most important command is ping will send a test message to the computer
    who should respond:


    ```

    [LocalHost]/home/joe:ping grouch

    PING grouch (192.168.1.3): 56 data bytes

    64 bytes from 192.168.1.3: icmp_seq=0 ttl=255 time=0.7 ms

    64 bytes from 192.168.1.3: icmp_seq=1 ttl=255 time=0.3 ms

    64 bytes from 192.168.1.3: icmp_seq=2 ttl=255 time=0.3 ms

    ...

    ```


    This shows that the host group is alive and well. It provides us with some timing
    information which indicates the speed of the connection between LocalHost and
    Remote-Host.


    If your DNS (see next section) is not working, you may not be able to ping by
    name, but perhaps by number. You can also ping by IP number like:


    ```

    [LocalHost]/home/joe:ping 192.168.1.3

    PING 192.168.1.3 (192.168.1.3): 56 data bytes

    64 bytes from 192.168.1.3: icmp_seq=0 ttl=255 time=0.7 ms

    64 bytes from 192.168.1.3: icmp_seq=1 ttl=255 time=0.3 ms

    etc....

    ```


    If you don''t get any response, or get an error, something is wrong with the network
    and you will not be able to communicate with that computer.


    # 9.1.2 DNS and Nslookup


    The Domain Name Service also known as DNS allows you, the users, to translate
    names like www.yahoo.com into a number like 216.32.74.52 which is needed for your
    computer communicate over the network. Networks are controlled by gremlins that
    only use names not. DNS is very important if you are going to use the network
    at all.'
