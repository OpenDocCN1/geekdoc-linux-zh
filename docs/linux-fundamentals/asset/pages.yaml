  md: '# 5.4 Cron


    *Cron* is a daemon that can automate tasks by periodically running them based
    on a time scheme. It is very useful for maintenance tasks. *Cron* takes a filename
    as a script for input that it incorporates internally and checks periodically.
    The file is called a crontab file.


    # 5.4.1 Making a Crontab File


    The crontab file is by default a *bash* style script. It has extra parameters
    that tell *cron* when to start execution. Here is the format:


    ```

    | mm hh dd D COMMAND |

    |---|---|---|---|---|---|

    | -minute -hour -day -Month-Weekday -Executable |

    ```


    Figure 5.1: Crontab File Specification Format


    Stars (*) are wildcards which always match, and on the other parameters to give
    *cron* timing queues. If you want to execute every day, just put a * in the day
    column.

    A simple example of this would be to run a script at 12 midnight every night:


    ```

    # File: crontab. Execute me at 00.00 hours EVERYDAY!

    0 0 * * /home/joe/bin/backup & /home/joe/backup-log &

    ```


    Notice that we have carefully routed *stdout* to a log file, otherwise *cron*
    could hang the job, or send us all the error by mail.

    Another interesting property of the *cron* time spec is it''s ability to specify
    numbers in a *modulo* fashion. Just divide a * by a number to cron to execute
    a periodic command:


    ```

    # File: crontab. Execute backups every four hours.

    * /4 * * /home/joe/bin/backup >> /home/joe/backup-log 2>&1

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# CHAPTER 5. PROCESS CONTROL


    # 5.4.2 Submitting Cron Jobs


    Once we have written our crontab file, we can submit it by doing a crontab crontab-file.
    crontab -l lists the crontab entries for you.


    ```

    bash: crontab crontab-file

    bash: crontab -l

    # DO NOT EDIT THIS FILE - edit the master and reinstall.

    # (crontab installed on Mon Feb 7 00:13:36 2000)

    # (Cron version $Id: crontab,c,v 2.13 1994/01/17 03:20:37 vixie Exp)$

    # Execute the job every four hours.

    # /home/joe/crontab-file

    * 0 * * * /home/joe/bin/backup >> /home/joe/backup-log 2>&1

    ```


    You may also edit the crontab file using the crontab -e command, which will throw
    you into your default editor. When you exit, the crontab file is automatically
    updated.


    # 5.4.3 Removing Cron Jobs


    You can always remove your cron jobs by using the (-r) flags:


    ```

    bash: crontab -r

    bash: crontab -l

    ```


    # 5.4.4 Exercises


    Exercise 1:


    Create a simple script named hello that prints out "hello joe". It should only
    have two lines:


    ```

    #!/bin/bash

    echo Hello joe you slacker...

    ```


    This file should be placed in your personal ~bin directory, and should have the
    appropriate file mode for execution (hint: chmod). Make sure to test this script
    before you go on.


    Exercise 2:


    Now create a crontab file named crontab-file that will execute hello every 2 minutes.
    Submit this crontab file as discussed above and check your mail on the even minutes
    to see if the scripts works.'
