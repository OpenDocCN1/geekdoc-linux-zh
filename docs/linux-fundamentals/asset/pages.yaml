- pgno: 75
  md: '# CHAPTER 9. TCP/IP NETWORKING BASICS


    # 9.1.3 The “R” Commands


    The so-called R-Commands are login, rcp, rsh, and friends. These are powerful
    and dangerous commands, and should be used with great care. Many systems exposed
    to the Internet disable, as they, these commands because data is completely open
    to public scrutiny that network. Now, some of these commands have secure versions
    where data is encrypted, or the commands are replaced by ssh, the secure shell.


    In order to execute remote commands on a remote machine without passwords, you
    set up a file called .hosts (in your home dir) that looks like the following:


    ```

    .hosts file for RemoteHost

    LocalHost joe

    ```


    and on the local machine a complimentary setup allows you to work from there.


    ```

    .hosts file for LocalHost

    RemoteHost joe

    ```


    Now try to copy a file from here to there:


    rc filename RemoteHost:

    rc filename RemoteHost:: # Same as above.


    Now copy a file from RemoteHost to LocalHost:


    rc RemoteHost:fileA # Copy the file to . with same name.

    rc RemoteHost:fileAB # Renames the file


    Now user login to log into RemoteHost:


    login RemoteHost

    Last login: Sat Jan 15 02:53:13 from beppo

    You have mail.

    [RemoteHost]/joe:is -agl


    ```

    total 3236

    drwx-xr-x 20 users 4096 Jan 14 09:45 .

    drwx-xr-x 5 root 4096 Jan 14 08:42 .

    --rw-rw-- 1 joe users 1748 Jan 14 06:59 .ICEauthority

    --rw-rw-- 1 joe users 101 Jan 14 08:35 .Xauthority

    --rw-r--r-- 1 joe users 1506 Jan 14 08:18 .Xdefaults

    --rw-rw-- 1 joe users 133 Jan 11 15:56 .bash_history

    ....

    ```'
