- pgno: 67
  md: "# CHAPTER 8. USING X-WINDOWS\n\nA typical .Xdefaults looks like this:\n\n```\n\
    ---------------------------------\n! .Xdefaults X-Resource File\n---------------------------------\n\
    Netscape.Navigator.geometry :=700x700\nXTerm*visualBell : on\nXTerm*Font : 9x15\n\
    XTerm*scrollBar : on\nXTerm*saveLines : 4940\nXTerm*borderColor : white\nxclock*geometry\
    \ : 60x60-0+0\nxclock*background : black\nxclock*foreground : white\n```\n\nThe\
    \ initial instance in the variables is a class name. The subsequent variables\
    \ in string all X-resources or just Resources identify the property of the program\
    \ or property to modify. The *s are wildcards and can match anything.\nFinding\
    \ and isnt a valid X-resource can be difficult, but normally most man pages have\
    \ a list of these and examples of how to them. If you have edited this file to\
    \ your liking, you must activate the changes using the xrdb utility like this:\n\
    \n```\nxrdb -merge .Xdefaults\n```\n\nAfterwards, try a command to see if your\
    \ changes hold. Normally, there is an initialization script in a system folder\
    \ or in your home directory that read when you start your X session. This file\
    \ is sometimes called .xinitrc and is easy to customize:\n\n```\n#!/bin/sh\nresources=$home/.Xdefaults\n\
    usermap=$home/.Xmodmap\nsysresources=/usr/X11/lib/X11/xinit/.Resources\n\n# merge\
    \ in Xdefaults and keymaps\nif [ -f $home/.netscape/lock ]; then\nrm -rf $home/.netscape/lock\n\
    fi\nif [ -f $sysresources ]; then\n/usr/bin/X11/xrdb -merge $sysresources\nfi\n\
    if [ -f $sysmodmap ]; then\nxmodmap $sysmodmap\nfi\n\n# start some new programs\n\
    xterm & \nxclock & \n# fix the bell- 11 Nov 96 rcr\n/usr/bin/X11/xset b 50 4500\
    \ 100 &\nexec fvwm\n```"
  merge: -1
