  md: '/dev/null is a funny device that swallows everything you feed it like a _black
    hole, so don''t put anything there that you want back. It''s very convenientient
    for swallowing up unwanted error messages like this:


    ```

    <bash>: netscape & /dev/null &

    ```


    We will learn the meaning of the preceding example in the next section. The cat
    command prints a text file to the console and the cp command copies one file to
    another. Try this example


    ```

