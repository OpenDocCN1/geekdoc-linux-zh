- pgno: 55
  md: '# CHAPTER 6. TEXT EDITING TOOLS


    # 6.5.3 Perl


    Perl, “Practical Extraction and Report Language” is the Swiss Army Knife of all
    scripting languages. It has everything except a Megawatt laser, and a kitchen
    sink. Perl has a very complete set of regular expressions and a large set of UNIX
    system calls that make it a steroid-pumped tool:


    ```

    perl [options] [ program ]

    ```


    On the command line you can use the syntax


    ```

    perl -ne ''command'' file

    ```


    where the options are


    +   -e ''command''execute command instead of script-file

    -n run the script on each line of input file

    -w Print WARNINGS for your script file


    Even though complex, we can learn a few one liners that work miracles:


    +   # 1. Find lines starting with ‘Linux Rocks’ in input.txt.

    perl -ne ''if ( /Linux Rocks /) {print}'' input.txt


    +   # 2. Find ‘Linux’ in a non word boundary like ‘TurboLinux’

    perl -ne ''if (<VBLinux/) {print}'' input.txt


    +   # 3. Find ‘Linux Rocks’ and replace it with ‘Rocks Linux’

    # Regular expressions matching ()''s get name $1, $2, $3, etc...

    perl -ne ''s/(Linux) (Rocks)/$$1/'' input.txt


    +   # 4. Lines start with ‘Linux’, end with ‘Rocks’.

    perl -ne ''print if /Linux$$/'' input.txt


    +   # 5. Find email addresses in input.txt.

    perl -ne ''print if (/(\w[\]*@[\w\-]+)/gm)'' input.txt


