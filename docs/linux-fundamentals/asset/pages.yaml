- pgno: 58
  md: "# # Chapter 7\n\n# # Shell Scripting\n\nThere's nothing more aggravating than\
    \ having to type out long commands over and over again. Shell scripts are simple\
    \ text files that list shell commands into a convenient “tool” which you can use\
    \ more easily than typing in all those commands over and over.\nNow that we know\
    \ enough shell workings to be dangerous, we need to focus our attention to making\
    \ changes permanent. It is essential to have use environments and scripts to do\
    \ complex tasks, because otherwise we are stuck repeating numerous small commands\
    \ daily. The natural starting point is to customize our .bashrc .cshrc files with\
    \ few aliases and a prompt or two.\n\n# ## 7.1 Shell Initialization Files\n\n\
    We are going to develop simple aliases and shell variables for our bash shell\
    \ that will make easier when you log into your Linux system.\n\n# ### 7.1.1 Initialization\
    \ Files for Bash\n\nStart editing .bashrc now. In writing the aliases and prompt\
    \ definitions:\n\n```\n```\nalias m='less -EMsX ' \nalias h='history | tail -40'\n\
    alias d=ls -1 $* |less -EMsX'\nalias dt='ls -blt $* |less -EMsX'\nalias D='ls\
    \ -aglt $* |less -EMsX'\nPS1='[\\]:u: '\n```\n```\n\nThe $ represents all remaining\
    \ variables on the command line for calling the command. It is equivalent to all\
    \ subsequent command line variables, \"$1 $2 ...\".\nAfter modify you must do\
    \ a \"source .bashrc\" to initialize your changes. Type aliases to see what the\
    \ system defines, and try out our new aliases."
  merge: -1
  img_proc: true
- pgno: 59
  md: "# CHAPTER 7. SHELL SCRIPTING\n\nRemember we can also have a .bash_profile which\
    \ is supposed to carry your environment variables:\n\n```\n# .bash_profile\n#\
    \ Get the aliases and functions\nif [ -f \".bashrc ]; then\n  . ~/.bashrc\nfi\n\
    \n# User specific environment and startup programs\nPATH=$PATH:/usr/local/bin:$HOME/bin\n\
    ENV=$HOME/.bashrc\nUSERNAME=\"\"\n\nexport USERNAME ENV PATH\n```\n\nNote the\
    \ final export at the end of the file.\n\n# 7.1.2 Initialization Files for Tcsh\n\
    \nNow lets make the analogous aliases in your .cshrc:\n\n```\nalias lester \"\
    less -ExS\"      # Use less as our pager.\nalias h \"history\\*! | tail -40 |\
    \ lester\"\nalias m lester                   # Used to be more, now is less.\n\
    alias d \"-ls -1 |\\*! | lester\"\nalias dt \"-ls -lt |\\*! | lester\" # Sort\
    \ by chronological order.\nalias D \"-ls -laft |\\*! | lester # Same as above,\
    \ show dot (.xxx) files.\nset prompt=\"%n:%m:%\"           # \"user:location/location/location:\"\
    \n```\n\nTry these out in test after executing\n\n```\n<tcsh> source .cshrc\n\
    Now submit these changes by typing source .cshrc. Type alias to see what the system's\
    \ definitions, and try some of them. Both Tcsh and use .cshrc and .login. The\
    \ .login is normally to store environment variables and path information, while\
    \ .cshrc normally hold aliases and prompt information.\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: "# 7.2 Utility Shell Scripts\n\nOur first goal is to create a script utility\
    \ that will print files in a directory /home/joe/address. The syntax will be\n\
    \n```\nphone.shell file1 file2 ....\n```\n\nBecause of tcsh's simple and clear\
    \ syntax, we will first use the tcsh language to construct a solution. Afterwards,\
    \ we will show the equivalent bash solution.\n\n# 7.2.1 Tcch Solution\n\nThe first\
    \ thing we want to do is to tell the script that it is a csh script, and what\
    \ the acceptable number of parameters are. In the following scripts make sure\
    \ you ALWAYS remove the comment from the first line, otherwise these examples\
    \ will not function. In general, students should NOT write any comments in these\
    \ examples.\nStarting by editing a file named ~/bin/phone.csh:\n\n```\n#!/bin/csh\
    \ -f      # This is not a comment. Remove from 2nd #.\n#\nset a=$0 # $0 refers\
    \ to the name of this script.\nif($#argv < 1) then\n  echo Usage::$a 'Name'\n\
    \  exit(1)\nendif\n```\n\nThe set a=$0 refers to the 0th component of the command\
    \ line, which is the command line, phone.csh, in our case. The $a:t instructs\
    \ csh to remove all the leading pathname components, since we are uninterested\
    \ in seeing the full path. Test this by invoking the name of the script:\n\n```\n\
    <bash>: phone.csh\nUsage: phone.csh Name\n```\n\nDid you remember to chmod our\
    \ script so that it is executable?\nSo far the script does nothing but tell us\
    \ if we have the right format. We will add a foreach line that will give us control\
    \ for each filename:\n\n```\nforeach name ($*)\n  echo \"/address/$name\"\nend\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 61
  md: "# CHAPTER 7. SHELL SCRIPTING\n\nNow your script should print each filename\
    \ you enter on the command-line, as a check in our progress. Again, test this\
    \ script and check that the loop works:\n\n```\nbash: phone.csh red green blue\n\
    \n/home/joe/address/red\n/home/joe/address/green\n/home/joe/address/blue\n```\n\
    \nNow that we know it, replace the echo command with the correct cat phrase. While\
    \ we are at it, we will check for the existence of each file with the (-e filename)\
    \ test. The previous foreach clause should NOW look like:\n\n+   foreach ($)\n\
    \  if (-e \"/address/$name\") then\n    cat /address/$name\n  else\n    echo \"\
    no such file $name\"\n  endif\n  echo \"--------------------------------------\"\
    \nend\n\n# (-e) flag checks for existence\n# Separate entries with a line.\n\n\
    The final script should resemble the following:\n\n```\n#!/bin/csh -f\n# phone.csh\n\
    set a=$0\nif ($#argv < 1) then\n  echo Usage: $a:t 'name'\n  exit(1)\nendif\n\n\
    foreach ($)\n  if (-e \"/address/$name\") then\n    cat /address/$name\n  else\n\
    \    echo \"no such file $name\"\n  endif\n  echo \"--------------------------------------\"\
    \nend\n```\n\n# This csh script, omit this comment!\n# Comment to give the filename.\n\
    # $0 refers to the name of this script.\n# If right number of arguments,\n# Echo\
    \ the proper syntax\n# Exit with error code 1\n# End if\n# For each name on the\
    \ command line.\n# If file exists (-),\n# List the file\n# Else\n# Barf\n# End\
    \ if\n# Separate entries with a line, cosmetic.\n# Bye-Bye"
  merge: -1
  img_proc: true
- pgno: 62
  md: "Lets check our program by creating an /address directory and several files\
