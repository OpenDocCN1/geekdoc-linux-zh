- pgno: 56
  md: '# 6.5.4 SED


    sed is a stream editor, which means that it works like a conveyer belt on your
    terminal.

    The text flies past just until it works.


    sed [ script ] file..


    sed is complex so we''ll just show some simple usage and examples:


    +   # 1. From line 1 to 32, print the line number

    sed ''1,32 ={ }'' input.txt      # Almost works in VI


    +   # 2. Delete lines 1 through 32

    sed ''d"'' input.txt      # :1,32 d in VI


    +   # 3. Under UNIX: convert DOS newlines (CR/LF) to Unix format

    sed ''s/^M$//'' input.txt      # In bash ^M = C-v C-m, tcsh ^M = C-v C-j


    +   # 4. Under DOS: convert Unix newlines (LF) to DOS format

    sed ''s/\//'' input.txt      # method 1

    sed -n p input.txt      # method 2


    +   # 5. Delete whitespace (spaces/tabs) from front of each line

    # ''t'' represents a tab character. ^t => Ctrl-V Ctrl-I.

    sed ''s/^[t]*//'' input.txt      # OK in VI without single quotes.


    +   # 6. Delete trailing whitespace (spaces/tabs) from end of each line

    sed ''s/[t]*$///'' input.txt      # see note on ''^t'', above


    +   # 7. BOTH leading and trailing whitespace from each line

    sed ''s/^[t]*\s[t]*$///'' input.txt      # see note on ''^t'', above


    +   # 8. Substitute "foo" with "bar"

    sed ''s/foo/bar/'' input.txt      # replaces 1 instance foo with bar

    sed ''s/bar/4/'' input.txt      # replaces only 4th instance in a line

    sed ''s/bar/g/'' input.txt      # replaces ALL instances within a line

    sed ''/baz/foo/bar/g/'' input.txt      # Sub ONLY on lines which contain "baz"


    +   # 9. Match lines that have ''Regular'' in them:

    sed ''s/^Regular/d'' input.txt      # Delete lines starting with ''Regular''

    sed ''s/Regular$/d'' input.txt      # Delete lines ending with ''Regular''


    +   #10. From ''Start'' to ''Linux'', substitute apples for oranges

    sed ''s*/Linux/s/apples/oranges/'' input.txt'
  merge: -1
