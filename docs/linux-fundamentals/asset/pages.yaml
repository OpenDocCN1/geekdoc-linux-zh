- pgno: 20
  md: '# # Chapter 3


    # ## The Linux Environment


    In Linux and UNIX , you carry many local attributes that control how your immediate
    shell interface interacts with the system. These attributes are called Shell and
    Environment Variables, and they are critical to Linux operation. UNIX and Linux
    use many variables for internal processing. These help the system manage resources
    for users. This chapter discusses the bare necessities all Linux survivalists
    need to know.


    # ### 3.1 The UNIX Shell Game


    One prominent feature of UNIX is that you can control the interface by which you
    communicate with it. These interfaces are called shells and the original shell
    is sh and has many cousins including ash


    Many users prefer to use the Berkeley C-type shells like csh and tcsh. Your choice
    is largely a matter of preference, however, we will use bash as the default in
    the course. We will also discuss tcsh because of its easy to understand C-like
    syntax.


    Normally a shell can be invoked anywhere in your login session by typing the shell
    name. This is used for testing, but normally, you will use your default shell.

    A user can control fundamental aspects of his/her environment by setting shell
    variables as work, or inside of a startup script file which gets invoked when
    you log to your account. Simple examples common to each shell are your prompt
    (the thing that stays at and waits for your commands) and aliases. An alias is
    a shorthand for some other command which a user can define, normally in the shell
    startup files like .bashrc. We''ll work with these concepts shortly.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# CHAPTER 3. THE LINUX ENVIRONMENT


    # 3.1.1 Shell Features


    Most Linux distributions come with bash and tcsh which replace sh and csh respectively.
    These are the two big shells that 99.9% of the Linux world uses. There are several
    key commonalities and differences between the two. The following tables outline
    these:


    | Action | bash | tcsh |

    | --- | --- | --- |

    | Default Prompt | | # |

    | Force Redirection | > | > |

    | Force Append | >> | >> |

    | Variable assignment | var=value | set var=value |

    | Set Environment | export var | setenv VAR value |

    | Number of arguments | # | $$ ($argv in csh) |

    | End loop statement | esac | end |

    | Loop | for/do | foreach |

    | If statement | if [ ...] | if ( ) |

    | End if | fi | endif |

