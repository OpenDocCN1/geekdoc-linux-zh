- pgno: 12
  md: '# 2.4 Create, List, Copy, and Move


    The most fundamental of all commands is to list, create, copy, move (rename),
    remove files. This section will show you the basics. Lets start with creating
    some files now, so we can list them later.


    # 2.4.1 Creating New Files


    File creation can be done by invoking an editor on a new filename. Before we try
    this, there is an easier way to make a new empty file by using the touch command.
    This is how it works:


    ```

    bash touch file1

    ```


    This will make a new file named file1` that is empty. There are many ways to make
    new files that we will see later.


    # 2.4.2 Creating New Directories


    Directories are created with the mkdir command. Thus


    ```

    bash mkdir dir1

    ```


    will create a new directory named dir1 located in your current working directory.
    List this file now with the "long" format we just spoke about. Check your files
    with


    ```

    bash ls -l

    ```


    # 2.4.3 Listing Files and Directories


    By far, listing a file is the most basic of all commands. As we have seen before,
    you list files with the ls command:


    ```

    bash ls file1

    file

    bash ls -l file1

    -rw-r--r-- 1 joe users 0 Oct 28 22:05 file1

    ```


    Using the -l flag causes a "long" listing that shows more information about file1.
    You list your directories in a similar way the second example shows that dir1
    is empty):


    ```

    bash ls -l

    total 10

    drwxr-xr-x 1 joe users 0 Oct 28 22:05 dir1

    0

    ```'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 2.4.4 Copying Files and Directories


    You can copy a file by using the cp command. The following statement


    ```

    cp file1 file2

    ```


    will copy file1 to file2. Copying a folder or directory requires the use of the
    recursive or -r flag indicating that cp should descend into the directory and
    copy all sub-files and sub-folders:


    ```

    cp -r dir1 dir2

    ```


    Exercise 2.4.4: Please create a directory like this now. Explain clearly the following
    examples are different from the above:


    ```

    cp file1 dir1

    ```


    ```

    cp -r dir1 dir2/

    ```


    ```

    cp -r dir1 dir2/dir3

    ```


    # 2.4.5 Moving Files and Directories


    Moving a file is as simple as renaming it. This allows for the possibility that
    you move the file to another directory as well:


    ```

    mv file2 file3

    ```


    ```

    mv file1 dir1/file2

    ```


    You move a directory in EXACTLY the same way as a file:


    ```

    mv dir1 dir3

    ```


    # 2.4.6 Changing Directories


    Changing your current directory is done with the cd command:


    ```

    cd dir1

    ```


    ```

    cd ..

    ```


    # 2.4.7 Removing Files and Directories


    Normal files are removed with the rm command:


    ```

    rm file1

    ```


    Removing directories is also done with the rm command, but again you need to use
    the "recursive" or -r option:


    ```

    rm -r dir1

    ```


    After you try the make, make sure file1 and dir1 are gone.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 2.5 I/O, Redirection, and Pipes


    I/O refers to Input (I) and Output (O). This section talks about input and output
    of commands and how you can manipulate these. These principials are very important
    because they are used constantly in Unix.


    # 2.5.1 Standard I/O


    In UNIX , Standard Input (stdin) and Standard Output (stdout) are mechanisms that
    allow you to input or output data from a command line. Simple commands like "cat
    file!" send their results to stdout (normally to your screen) while the word file1
    is an example of stdin which is fed to the command **cat**.


    Independent of stdin and stdout, there is also the standard error (stderr) which
    normally goes to your screen when the command detects an error. This manipulation
    is special feature. Bash assigns special numbers, called File Descriptors, stdin,
    stdout, and stderr:


    | Name | Abbreviation | File Descriptor | Standard Device |

    |---|---|---||

    | Standard Input | stdin | 0 | Keyboard |

    | Standard Output | stdout | 1 | Console |

    | Standard Error | stderr | 2 | Console |


    Table 2.1: Bash Standard I/O


    # 2.5.2 Redirection


    Redirection refers to the art of redirecting input and output from commands. Shells
    like bash allow for redirection of stdin and stdout with the < and > operators
    respectively. As an example, you can list some files and send (redirect) the output
    to a file instead of the screen. Do it this easy way:


    ```

    bash: ls -al > output.txt

    ```


    To check the output, you can use cat (short for concatenate). cat is useful when
    you want to view your files:


    ```

    bash: cat output.txt

    -rw------ 1 carinhas users 1606 Aug 17 23:14 .acrorc

    -rw------ 1 carinhas users 153 Dec 20 08:47 .bashrc

    -rw------ 1 carinhas users 3189 Dec 23 15:34 .cshrc

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: "Examples of stdin redirecting:\n\n```\nbash: cat < output.txt\nbash: wc -l\
    \ output.txt\n  7 output.txt\nbash: wc -l < output.txt\n7\n```\n\nNote that \"\
    cat output.txt\" and \"cat < output.txt\" give the same result, but the \"wc -1\"\
    \ gives something slightly different.\n\nIn bash stderr is redirected with the\
    \ 2> operator, while in tcsh, the >& operator. Just relax and will see examples\
    \ of this shortly.\n\nLinux Warning: Please note that > will overwrite anything\
    \ in the output file, if it exists, or create the file if it does not. In contrast,\
    \ the >> operator will append to the existing file.\n\nHere is a brief summary\
    \ of the redirects:\n\n| Name | Operator | Description |\n| Redirect stdin | <\
    \ | Feeds the file to input |\n| Redirect stdout | > | Creates or overwrites |\n\
    | Append stdout | >> | Creates or appends |\n| Redirect stderr | >< | Both stdout\
    \ and stderr |\n| Redirect stderr | 2> | Only stderr in bash |\n\nTable 2.2: Standard\
    \ Redirection I/O\n\n# 2.5.3 Pipes\n\nWhen you want to take the output of one\
    \ command and use that is input into another, use the \"pipe operator\" | . Think\
    \ of actually connecting a metal pipe from one command to another. The following\
    \ example sorts some ls command in reverse order (do it!):\n\n```\nbash:ls | sort\
    \ -r\ndoomrc\n.cshrc\n.bashrc\n.acrorc\n```"
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2.5.4 Examples to Try


    ```

    <bash>: cat noname 2> error.txt               # Sends error to error.txt

    <bash>: cat noname > error.txt 2>&1      # Send stdout + stderr to error.txt

    <bash>: cat noname &\ error.txt             # everything (as above) goes to error.txt

    ```


    Try these examples in tcsh:


    ```

    <tcsh>: tcsh

    <tcsh>: (cat noname > output.txt) >& error.txt # Send stderr to error.txt

    <tcsh>: more output.txt                            # Same as in bash.

    <tcsh>: more error.txt                             # Just like in bash.

    <tcsh>: cat testfile.txt >& out.txt               # ditto

    <tcsh>: cat < testfile.txt | sort | more          # ditto

    <tcsh>: locate .bashrc | xargs grep alias         # find ''alias'' in .bashrc

    <tcsh>: exit

    ```


    Don''t forget the last "exit" to get out of tcsh and back into fabulous bash.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# CHAPTER 2. UNIX COMMAND LINE BASICS


    #  2.6 Command Line Editing


    A great shortcut in bash tcsh is to use the command editing facilities. Just hit
    the up-arrow key to a previous command and move the cursor to edit that command.
    Just try it. Command editing is very useful in repeating and correcting previous
    commands. Now we discuss other features of command line editing.


    #  2.6.1 Command and File Completion


    Most shells support command and file completion typing shortcuts. These shortcuts
    allow you to hit the Tab key to finish the name of a command or file after hitting
    a few keys. Try this example for a filename (directory):


    ```

    bash: cd /usr/inc<TAB> will produce

    bash: cd /usr/include/

    ```


    Now this example for a command:


    ```

    bash: ghostv<TAB> should produce

    bash: ghostview

    ```


    Note that command and file completion can only complete up a unique set of commands.
    This means you have to provide a unique start string.


    Thus bash:ghost<TAB> won''t work because it could complete to ghostview ghostscript.


    tcsh has the same file-name completion mechanism as bash. The <TAB> key will complete
    filename and command up to unique names.


    #  2.6.2 Possible Command Completion


    bash will show the possible choices by hitting <TAB>twice (Ctrl-D) in tcsh:


    ```

    bash: ls /etc/h<TAB>

