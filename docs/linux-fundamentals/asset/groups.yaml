    Awk is a pattern scanning and process language. Its Syntax is\n\n```\nawk 'program'\
    \ input-files\n```\n\nWhen the program is long, it is usually more convenient\
    \ to put it in a file and run it with a command like:\n\n```bash\nawk -f program-file\
    \ input-files\n```\n\nTake a look at the manual now. Here are some one-liner examples:\n\
    \n```bash\nawk '/***' input.txt # Find '/' in input.txt\n# Most all regular expression\
    \ syntax works inside the '/'\nawk 'NF > 0' input.txt\n```\n\nThis program prints\
    \ every line that has at least one field. It's an easy way to delete blank lines\
    \ from a file.\n\n```bash\nawk -F: '{ print $1 } /etc/passwd | sort\nawk '{ END\
    \ { print NR }' input.txt\n```\n\nThis program prints a sorted list of the login\
    \ names of all users.\nThis program counts lines in input.txt.\n\n```bash\nawk\
    \ 'NR % 2 == 0' input.txt\nawk '{if(length($0) > max) max=length($0)} END { print\
    \ max }' input.txt\nawk 'length($0) > 80' input.txt\n```\n\nThis program prints\
    \ the length of the longest line.\nThis program prints lines longer than 80 characters.\n\
    Since the sole rule has a relational expression as its pattern, and the default\
    \ action, printing the record, is used.\n\n```bash\nawk 'BEGIN { for (i=1; i<=100;\
    \ i++) print int(101 * rand()) }'\nls -lg *.txt | awk '{ x += 5 }; END { print\
    \ \"total bytes:\" x }'\n```\n\nThis program prints seven numbers from zero to\
    \ 100, inclusive.\nThis program prints the total number of bytes used by all .txt\
    \ files.\n\n# CHAPTER 6. TEXT EDITING TOOLS\n\n## 6.5.3 Perl\n\nPerl, “Practical\
    \ Extraction and Report Language” is the Swiss Army Knife of all scripting languages.\
    \ It has everything except a Megawatt laser, and a kitchen sink. Perl has a very\
    \ complete set of regular expressions and a large set of UNIX system calls that\
    \ make it a steroid-pumped tool:\n\n```\nperl [options] [ program ]\n```\n\nOn\
    \ the command line you can use the syntax\n\n```bash\nperl -ne 'command' file\n\
    ```\n\nwhere the options are:\n\n- -e 'command' execute command instead of script-file\n\
    - -n run the script on each line of input file\n- -w Print WARNINGS for your script\
    \ file\n\nEven though complex, we can learn a few one liners that work miracles:\n\
    \n- # 1. Find lines starting with ‘Linux Rocks’ in input.txt.\nperl -ne 'if (\
    \ /Linux Rocks /) {print}' input.txt\n\n- # 2. Find ‘Linux’ in a non word boundary\
    \ like ‘TurboLinux’\nperl -ne 'if (<TurboLinux/) {print}' input.txt\n\n- # 3.\
    \ Find ‘Linux Rocks’ and replace it with ‘Rocks Linux’\n# Regular expressions\
    \ matching ( ) get name $1, $2, $3, etc...\nperl -ne 's/(Linux) (Rocks)/$1/' input.txt\n\
    \n- # 4. Lines start with ‘Linux’, end with ‘Rocks’.\nperl -ne 'print if /Linux$/'\
    \ input.txt\n\n- # 5. Find email addresses in input.txt.\nperl -ne 'print if (/(\\\
