    # Changing File Ownership with chown and chgrp


    Just as you can change the file permission, you can change the owner and group
    of a file. chown does not this for you with the syntax:


    ```

    chown [-R] USER[:.GROUP] FILE

    ```


    Note that chgrp can change the group at the same time as that in the following
    examples.


    ```

    <bash>: chown johnson mail # Sorry, only johnson or Root can do that.

    chown mail: Operation not permitted

    <Super>: chown joe.users mail # Change owner to joe and group to users.

    <Super>: chown joe.bozos mail # Change owner to joe and group to bozos.

    chown mail: Operation not permitted # You''re not a member of bozos group!

    <Super>: chown .testers mail # Ok, you are in the testers group.

    ```


    chgrp is less powerful and not really needed but should be noted. Its syntax is


    ```

    chgrp [-R] GROUP FILE

    ```


    Here is an example.


    ```

    <bash>: chgrp testers mail # Same as “.testers mail’

    <bash>: chgrp users mail # Same as “.users mail”

    ```


    # 4.4.1 Questions


    Why can''t you change ownership of someone else files? Who can do this? Is this
    a good or bad feature?


    # 4.4.2 Exercises


    +   1. Log in as root and change the owner and group of some files in the /tmp
    directory. Make sure you are in /tmp and not /home/you/tmp or some other place.'
