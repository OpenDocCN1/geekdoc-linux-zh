    # CHAPTER 2. UNIX COMMAND LINE BASICS


    #  2.6 Command Line Editing


    A great shortcut in bash tcsh is to use the command editing facilities. Just hit
    the up-arrow key to a previous command and move the cursor to edit that command.
    Just try it. Command editing is very useful in repeating and correcting previous
    commands. Now we discuss other features of command line editing.


    #  2.6.1 Command and File Completion


    Most shells support command and file completion typing shortcuts. These shortcuts
    allow you to hit the Tab key to finish the name of a command or file after hitting
    a few keys. Try this example for a filename (directory):


    ```

    bash: cd /usr/inc<TAB> will produce

    bash: cd /usr/include/

    ```


    Now this example for a command:


    ```

    bash: ghostv<TAB> should produce

    bash: ghostview

    ```


    Note that command and file completion can only complete up a unique set of commands.
    This means you have to provide a unique start string.


    Thus bash:ghost<TAB> won''t work because it could complete to ghostview ghostscript.


    tcsh has the same file-name completion mechanism as bash. The <TAB> key will complete
    filename and command up to unique names.


    #  2.6.2 Possible Command Completion


    bash will show the possible choices by hitting <TAB>twice (Ctrl-D) in tcsh:


    ```

    bash: ls /etc/h<TAB>

    host.conf hosts.allow hosts.deny httpd/

    bash: ls /etc/

    ```


    The shell tells you what your choices are and again ready for more input. This
    also works on commands too:


    ```

    bash: mo<TAB>

    modemights:applet mount.smbfs

    modemtool more mouse-properties-capplet

    modinfo morepgpp mouse-test

    modprobe mount mouseconfig

    bash: mo

    ```'
