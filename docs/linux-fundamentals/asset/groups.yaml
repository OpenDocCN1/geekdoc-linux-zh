    \ D | 后台进程的 tty 输入 |\n| SIGTOU | 22,22,27 | D | 后台进程的 tty 输出 |\n\n“Action”列中的字母含义：\n\
    A 默认动作是终止进程。\nB 默认动作是忽略信号。\nC 默认动作是转储核心。\nD 无法捕获。\nE 无法忽略。\nF 不符合 POSIX。\n\n##\
    \ 5.3 管理优先级\n\n在 Linux 和 UNIX 中，所有进程都有一个称为优先级的重要因子。优先级告诉系统如何调度该进程。显然，某些进程比其他进程更关键。优先级值越小，进程的重要性越高。优先级范围从\
    \ -20 到 20，其中 -20 最高，20 最低。\n\n你可以通过读取 `ps -xl` 中的 `PRI` 列来查看进程的优先级：\n\n```bash\n\
    <bash>: ps -xl\n```\n\n| F UID PID PPID NI VSZ RSS WCHAN STAT TTY TIME COMMAND\
    \ |\n|---|---|---|---|---|---|---|---|---|---|\n| 000 501 617 612 0 2032 504 S\
    \ | | 0:03 |\n| 000 501 622 617 0 3144 872 S | | 0:03 |\n\n有两个主要的工具处理进程优先级：`nice`\
    \ 和 `renice`。`nice` 允许为命令指定优先级，而 `renice` 允许在进程启动后更改优先级。这里有一个练习题：\n\n```bash\n\
    <bash>: man nice\n```\n\nNICE(1)\nnice - 以修改后的优先级运行程序\n\nSYNOPSIS\nnice -priority\
    \ [arguments]\n\n### 5.3.1 练习\n\n```bash\n<bash>: xclock &\n<bash>: -10 xclock\
    \ &\n<bash>: /bin/nice -10 xclock &\n<bash>: ps -xl\n```\n\n| F UID PID PPID NI\
    \ VSZ RSS WCHAN STAT TTY TIME COMMAND |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 000 501 617 612 0 2032 504 S | | 0:03 |\n| 000 501 622 617 0 3144 872 S | |\
    \ 0:03 |\n\n"
