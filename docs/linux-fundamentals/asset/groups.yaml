    \ 6. TEXT EDITING TOOLS\n\n## 6.5.3 Perl\n\nPerl, “Practical Extraction and Report\
    \ Language” is the Swiss Army Knife of all scripting languages. It has everything\
    \ except a Megawatt laser, and a kitchen sink. Perl has a very complete set of\
    \ regular expressions and a large set of UNIX system calls that make it a steroid-pumped\
    \ tool:\n\n```\nperl [options] [ program ]\n```\n\nOn the command line you can\
    \ use the syntax\n\n```\nperl -ne 'command' file\n```\n\nwhere the options are:\n\
    \n- -e 'command' execute command instead of script-file\n- -n run the script on\
    \ each line of input file\n- -w Print WARNINGS for your script file\n\nEven though\
    \ complex, we can learn a few one liners that work miracles:\n\n- # 1. Find lines\
    \ starting with ‘Linux Rocks’ in input.txt.\nperl -ne 'if ( /Linux Rocks /) {print}'\
    \ input.txt\n\n- # 2. Find ‘Linux’ in a non word boundary like ‘TurboLinux’\n\
    perl -ne 'if (<TurboLinux/) {print}' input.txt\n\n- # 3. Find ‘Linux Rocks’ and\
    \ replace it with ‘Rocks Linux’\n# Regular expressions matching (s get name $1,\
    \ $2, $3, etc...\nperl -ne 's/(Linux) (Rocks)/$1/' input.txt\n\n- # 4. Lines start\
    \ with ‘Linux’, end with ‘Rocks’.\nperl -ne 'print if /Linux$/' input.txt\n\n\
    - # 5. Find email addresses in input.txt.\nperl -ne 'print if (/(\\w[\\\\]]*@[\\\
    w\\-]+)/gm)' input.txt\n\n## 6.5.4 SED\n\nsed is a stream editor, which means\
    \ that it works like a conveyer belt on your terminal.\nThe text flies past just\
    \ until it works.\n\n```\nsed [ script ] file\n```\n\nsed is complex so we'll\
    \ just show some simple usage and examples:\n\n- # 1. From line 1 to 32, print\
    \ the line number\nsed '1,32={ }' input.txt      # Almost works in VI\n\n- # 2.\
    \ Delete lines 1 through 32\nsed 'd' input.txt      # :1,32 d in VI\n\n- # 3.\
    \ Under UNIX: convert DOS newlines (CR/LF) to Unix format\nsed 's/^M$//' input.txt\
    \      # In bash ^M = C-v C-m, tcsh ^M = C-v C-j\n\n- # 4. Under DOS: convert\
    \ Unix newlines (LF) to DOS format\nsed 's/\\//' input.txt      # method 1\nsed\
    \ -n p input.txt      # method 2\n\n- # 5. Delete whitespace (spaces/tabs) from\
    \ front of each line\n# 't' represents a tab character. ^t => Ctrl-V Ctrl-I.\n\
    sed 's/^[t]*//' input.txt      # OK in VI without single quotes.\n\n- # 6. Delete\
    \ trailing whitespace (spaces/tabs) from end of each line\nsed 's/[t]*$//' input.txt\
    \      # see note on '^t', above\n\n- # 7. BOTH leading and trailing whitespace\
    \ from each line\nsed 's/^[t]*\\s[t]*$//' input.txt      # see note on '^t', above\n\
    \n- # 8. Substitute \"foo\" with \"bar\"\nsed 's/foo/bar/' input.txt      # replaces\
    \ 1 instance foo with bar\nsed 's/bar/4/' input.txt      # replaces only 4th instance\
    \ in a line\nsed 's/bar/g/' input.txt      # replaces ALL instances within a line\n\
    sed '/baz/foo/bar/g/' input.txt      # Sub ONLY on lines which contain \"baz\"\
    \n\n- # 9. Match lines that have 'Regular' in them:\nsed 's/^Regular/d' input.txt\
    \      # Delete lines starting with 'Regular'\nsed 's/Regular$/d' input.txt  \
    \    # Delete lines ending with 'Regular'\n\n- # 10. From 'Start' to 'Linux',\
    \ substitute apples for oranges\nsed 's*/Linux/s/apples/oranges/' input.txt\n\n\
