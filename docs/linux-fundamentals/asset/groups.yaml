    ## 2.5.3 Pipes


    When you want to take the output of one command and use that into another, use
    the "pipe operator" |. Think of actually connecting a pipe from one command to
    another. The following example sorts some ls command in reverse order (do it!):


    ```bash

    ls | sort -r

    ```


    ## 2.5.4 Examples to Try


    ```bash

    cat noname 2> error.txt               # Sends error to error.txt

    cat noname > error.txt 2>&1      # Send stdout + stderr to error.txt

    cat noname & error.txt             # everything (as above) goes to error.txt

    ```


