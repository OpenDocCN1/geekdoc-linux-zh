    # 2.5 I/O, Redirection, and Pipes


    I/O refers to Input (I) and Output (O). This section talks about input and output
    of commands and how you can manipulate these. These principials are very important
    because they are used constantly in Unix.


    # 2.5.1 Standard I/O


    In UNIX , Standard Input (stdin) and Standard Output (stdout) are mechanisms that
    allow you to input or output data from a command line. Simple commands like "cat
    file!" send their results to stdout (normally to your screen) while the word file1
    is an example of stdin which is fed to the command **cat**.


    Independent of stdin and stdout, there is also the standard error (stderr) which
    normally goes to your screen when the command detects an error. This manipulation
    is special feature. Bash assigns special numbers, called File Descriptors, stdin,
    stdout, and stderr:


    | Name | Abbreviation | File Descriptor | Standard Device |

    |---|---|---||

    | Standard Input | stdin | 0 | Keyboard |

    | Standard Output | stdout | 1 | Console |

    | Standard Error | stderr | 2 | Console |


    Table 2.1: Bash Standard I/O


    # 2.5.2 Redirection


    Redirection refers to the art of redirecting input and output from commands. Shells
    like bash allow for redirection of stdin and stdout with the < and > operators
    respectively. As an example, you can list some files and send (redirect) the output
    to a file instead of the screen. Do it this easy way:


    ```

    bash: ls -al > output.txt

    ```


    To check the output, you can use cat (short for concatenate). cat is useful when
    you want to view your files:


    ```

    bash: cat output.txt

    -rw------ 1 carinhas users 1606 Aug 17 23:14 .acrorc

    -rw------ 1 carinhas users 153 Dec 20 08:47 .bashrc

    -rw------ 1 carinhas users 3189 Dec 23 15:34 .cshrc

    ```'
