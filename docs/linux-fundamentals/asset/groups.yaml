    # 9.2 Using X-Windows Over the Network


    One great thing about X is that it has networking right into it. You can use any
    X application from anywhere on your network. All you need to do is set a few parameters
    that allow communications.


    # 9.2.1 Connecting X to another client


    There are two things you do to get X to work over a network. First you need to
    allow other machines to connect to your workstation. One way to do this is use
    xhost RemoteHost, where RemoteHost is the machine you want to communicate with.
    Second, you must telnet (or ssh) to another workstation, and set the DISPLAY environment
    variable to your workstation like this:


    ```

    [LocalHost]/home/joe:xhost + RemoteHost

    [LocalHost]/home/joe:telnet RemoteHost

    Red Linux release 6.1

    Kernel 2.2.12-20 on an i586

    login: joe

    Password: ******

    Last login: Jan 13 12:13:37 from bistro.rr.com

    [RemoteHost]/home/joe:setenv DISPLAY LocalHost:0

    [LocalHost]/home/joe:xcalc - title RemoteHost

    Ctrl-C

    [RemoteHost]/home/joe:exit

    [LocalHost]/home/joe:

    ```


    Remember that RemoteHost and LocalHost need to be changed to whatever your workstation
    is named. What you should have now is a process that is run by the remote system!
    It should be clear that this is powerful. In the next chapter we''ll talk about
    other networking features.. If you put a line like the following in your .login
    or .bashrc, your DISPLAY variable will be set automatically for you. Play with
    this for a second:


    ```

    <tcsh>:setenv DISPLAY ''who am i | perl -n ''\/(.+)/; print $1":""0'' in bash,

    <bash>:set DISPLAY=''who am i | perl -n ''\/(.+)/; print $1":"""0''

    ```'
