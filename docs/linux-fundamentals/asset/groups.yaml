    # 2.4 Create, List, Copy, and Move


    The most fundamental of all commands is to list, create, copy, move (rename),
    remove files. This section will show you the basics. Lets start with creating
    some files now, so we can list them later.


    # 2.4.1 Creating New Files


    File creation can be done by invoking an editor on a new filename. Before we try
    this, there is an easier way to make a new empty file by using the touch command.
    This is how it works:


    ```

    bash touch file1

    ```


    This will make a new file named file1` that is empty. There are many ways to make
    new files that we will see later.


    # 2.4.2 Creating New Directories


    Directories are created with the mkdir command. Thus


    ```

    bash mkdir dir1

    ```


    will create a new directory named dir1 located in your current working directory.
    List this file now with the "long" format we just spoke about. Check your files
    with


    ```

    bash ls -l

    ```


    # 2.4.3 Listing Files and Directories


    By far, listing a file is the most basic of all commands. As we have seen before,
    you list files with the ls command:


    ```

    bash ls file1

    file

    bash ls -l file1

    -rw-r--r-- 1 joe users 0 Oct 28 22:05 file1

    ```


    Using the -l flag causes a "long" listing that shows more information about file1.
    You list your directories in a similar way the second example shows that dir1
    is empty):


    ```

    bash ls -l

    total 10

    drwxr-xr-x 1 joe users 0 Oct 28 22:05 dir1

    0

    ```'
  - '[PAGE 13]


    # 2.4.4 Copying Files and Directories


    You can copy a file by using the cp command. The following statement


    ```

    cp file1 file2

    ```


    will copy file1 to file2. Copying a folder or directory requires the use of the
    recursive or -r flag indicating that cp should descend into the directory and
    copy all sub-files and sub-folders:


    ```

    cp -r dir1 dir2

    ```


    Exercise 2.4.4: Please create a directory like this now. Explain clearly the following
    examples are different from the above:


    ```

    cp file1 dir1

    ```


    ```

    cp -r dir1 dir2/

    ```


    ```

    cp -r dir1 dir2/dir3

    ```


    # 2.4.5 Moving Files and Directories


    Moving a file is as simple as renaming it. This allows for the possibility that
    you move the file to another directory as well:


    ```

    mv file2 file3

    ```


    ```

    mv file1 dir1/file2

    ```


    You move a directory in EXACTLY the same way as a file:


    ```

    mv dir1 dir3

    ```


    # 2.4.6 Changing Directories


    Changing your current directory is done with the cd command:


    ```

    cd dir1

    ```


    ```

    cd ..

    ```


    # 2.4.7 Removing Files and Directories


    Normal files are removed with the rm command:


    ```

    rm file1

    ```


    Removing directories is also done with the rm command, but again you need to use
    the "recursive" or -r option:


    ```

    rm -r dir1

    ```


    After you try the make, make sure file1 and dir1 are gone.'
