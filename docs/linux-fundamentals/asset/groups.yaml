    # 第 9 章：TCP/IP 网络基础


    ## 9.2.2 保护您的 X 连接


    上面我们讨论了 xhost 以及它如何允许其他机器连接到您工作站上的 X-Server。存在一个安全漏洞，允许来自 RemoteHost 的所有人员都连接到您的工作站。这个“漏洞”曾被用来攻击许多计算机。


    幸运的是，有一个 `xauth` 的安全替代方案。使用 `xauth` 的方法是先在 RemoteHost 上执行 `xauth list`，用鼠标抓取其产生的信息（中键拖动），然后在输入
    `xauth add` 后在您的工作站上粘贴它（中键点击）。


    ```

    [RemoteHost]/home:xauth list

    bistro.max:0 MIT-MAGIC-COOKIE-1 6c7d8ba30a

    bistro/unix:0 MIT-MAGIC-COOKIE-1 7bf452301a230498

    localhost:0 MIT-MAGIC-COOKIE-1 a43f0989db

    localhost:10 MIT-MAGIC-COOKIE-1 3c08b9241d

    ```


    在您的（本地）工作站上：


    ```bash

    <bash>:xauth add bistro/unix:0 MIT-MAGIC-COOKIE-1 7bf452301a230498

    ```


    # 用户网络安全


    从用户的角度来看，网络安全很简单：不要使用易于猜测的密码，不要让“R”命令开放受攻击状态。


    难以猜测的密码看起来不像任何单词，并且应该包含非字母字符。`Hello` 不是一个好密码，但 `h39Xz` 是。黑客总是使用 `crack` 通过字典来猜密码，`Hello`
    在几秒钟内就会被破解。至于安全，你需要记住几点：


    - 始终保持您的主目录 (~) 受保护状态。

    - `bash: chmod -R 700 ~`


    - 不要在不安全的网络上使用 R 命令，因为黑客可以看到几乎所有内容。如果你使用安全 shell OpenSSH 和安全版本的 R 命令，情况会好很多。访问
    http://www.openssh.org 获取有关 OpenSSH 的信息。


    那时 `telnet` 等程序会在互联网上显示您的密码。请使用来自 http://www.openssh.org 的 OpenSSH。


    - 永远不要告诉任何人您的密码，如果这样做，请在第二天更改它。


    - `chmod 600 .hosts`


    - 每几个月更改一次密码。


    - 永远不要把密码写下来，或将其标识为密码。


    - 选择一个难以猜测的账户名。密码应该包含大写字母、小写字母和数字。不要使用字典单词作为密码，甚至是密码的一部分。你可以通过 http://ftp.cerias.purue.edu/pub/tools/unix/pwdutils/crack
    再次使用 `crack` 检查密码表。


    - 定期检查文件权限。大多数文件应该是 600 或 700。


    # 第 10 章


    ## 原生 Linux 编译器、软件和服务


    Linux 包含了 C++、C、Perl、Python、awk 以及许多其他版本。它还有 TeX 和 LaTeX 等文本格式化解决方案，我们使用它们来格式化本文。还有许多其他免费提供的扩展，如
    Java、Fortran 和 Lisp。


    以下是我们的系统执行 `man -k compiler` 时的输出：


    - ccc, cpp (1) - GNU C 兼容编译器预处理器。

    - f4rpcgen (1) - 一个 RPC 协议编译器

    - g++ (1) - GNU 项目 C++ 编译器

    - gcc, g++ (1) - GNU 项目 C 和 C++ 编译器 (egcs - 1.1.2)

    - gcc, g++ (1) - GNU 项目 C 和 C++ 编译器 (egcs-1.1.2)

    - tic (im) - 终端项描述编译器

    - zic (8) - Perl 编译器

    - B (3)

    - B::Bytecode (3) - Perl 编译器的字节码后端

    - B::C (3) - Perl 的 C 后端

    - B::CC (3) - Perl 编译器的优化 C 翻译后端

    - B::Deparse (3) - 产生 perl 代码的 Perl编译器后端

    - Perl编译器后端的通用接口


    以下是我们的系统执行 `man -k language` 的输出：


    - Tcl (n) - Tcl 语言语法摘要。

    - bc (1) - 任意精度计算器语言

    - gawk (1) - 模式扫描和处理语言

    - perl (1) - 实用提取和报告语言

    - perls (1) - XS 语言参考手册

    - python (1) - 一种解释型的、面向对象的编程语言


