    # CHAPTER 6. TEXT EDITING TOOLS


    # 6.5 Regular Expressions


    Regular Expressions form the pillars of UNIX obscurity in text processing. Regular
    Expressions are search patterns that give you ominous control over how text patterns
    are found. Here are the basics pattern matching symbols:


    +   * Match anything. `.*` matches any number of times. See *

    * Match the last char or exp 0 or more times. `a*` matches ``, `a`, `aa`,...

    * Match the last char or exp 1 or more times. `a+` matches `a`, `aa`, `aaa`,...

    * Match the last char or exp 0 time. `a?` matches ``,...

    * Match the beginning of the line. `^` matches lines starting with.

    * Match the end of the line. `$` matches empty lines.

    * Match chars: `[abc]` can match `a`, `b`, or `c.

    * Negates chars: `[^abc]` matches anything except `a`, `b`, or `c.

    * Grouping: `(abc)` matches `abc`, `abcabc`,...

    * Match chars like `\.` and `\.

    * `{n}` The preceding item is matched exactly n times.

    * `{n,}` The preceding item is matched n or more times.

    * `{m}` The preceding item is optional and matched at most m times.

    * `{n,m}` The preceding is matched at least n times, not more than m times.

    * Match a word boundary: `\b` matches `abc` but not `abcd.

    * Match a non-boundary: `\B` matches `abcd` but not `abc`.

    * Match a word: `\w` matches `abcdef` but not `abc`.

    * Match a non-word: `\W` matches `abcd` but not `abc`.


    # 6.5.1 GREP


    grep is a search tool. It will find patterns in a file and print them to the terminal.
    These patterns are regular expressions as well. Test grep with the file as before.


    grep [ options ] pattern file..


    ```

    # 1. Find lines with "Linux" ANYWHERE in the file.

    grep input.txt


    # 2. Find "Linux" in a non word boundary ``TurboLinux"

    grep "\bLinux\" input.txt # Remember \b


    # 3. Find "Linux" at beginning and end of line, regular expressions.

    grep input.txt # Note the single quotes to trick the shell,

    grep input.txt # Because shell tries to interpret stuff like $.


    # 4. Lines start with ``Linux", end with ``Respect"

    grep "^Linux.*Respect$\

    ```


