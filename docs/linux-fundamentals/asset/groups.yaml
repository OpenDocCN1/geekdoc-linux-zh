    # CHAPTER 4. FILESYSTEM ESSENTIALS


    # ## 4.5 Devices


    In Unix (almost) all commands and hardware are represented by files. The hardware
    devices are fundamentally different and live in the directory /dev. Device files
    allow access to the hardware directly through the kernel.


    These special files have major and minor numbers that identify the driver in the
    Linux kernel. Major Device Numbers specify a particular driver for I/O redirection
    in the kernel, and Minor Device Numbers specify a device to be accessed by that
    driver. A typical example is the /dev/hda


    ```

    brw-rw---- 1 root disk 3,0 May 5 1998 /dev/hda

    ```


    It has a major number 3 and minor number 0. The leading “b” indicates that this
    is a block device. Its owner is root and its group is disk.


    An ls -agsl /dev to see the major and minor numbers of typical devices. We list
    the most commonly used devices below. Note that N will represent an integer number.


    | Device Name | Type | Description |

    |---|---|---|

    | /dev/hda | B | first IDE hard disk |

    | /dev/hdaN | B | Nth partition of /dev/hda |

    | /dev/sda | B | first SCSI hard disk |

    | /dev/sdaN | B | Nth partition of /dev/sda |

    | /dev/loop0 | B | first loopback device |

    | /dev/console | C | System console |

    | /dev/parport0 | C | first parallel port |

    | /dev/lp0 | C | first printer port |

    | /dev/nll | C | System Trash Can (Black Hole) |

    | /dev/ttyN | C | N virtual console |

    | /dev/pts/N | C | Nth pseudo terminal (dynamically created) |

    | /dev/ttySN | C | N serial port |

    | /dev/psaux | C | PS/2-style mouse port |

    | /dev/mouse | L | Soft link to a serial mouse like psaux |

    | /dev/printer | S | lpd local socket |


    Table 4.2: Linux Devices (See 4.1 for type info)'
