    \ boogie.man boogie.man.old\n  11 8:36 echo hello >> boogie.man\n  12 8:37 diff\
    \ boogie.man.old boogie.man\n```\n\n```bash\n<bash>!-2\nvi boogie.man\n```\n\n\
    ```bash\n<bash>:diff !2-2:old !2-2\ndiff boogie.man.old boogie.man\n```\n\n```bash\n\
    <bash>:diff !!1.old !!2\ndiff boogie.man.old boogie.man\ndiff: boogie.man.old.old:\
    \ No such file or directory\n```\n\n```bash\n<bash>:!?cat?:0 !!2\ncat boogie.man\n\
    ```\n\n# 第 3 章\n\n## Linux 环境\n\n在 Linux 和 UNIX 中，你携带许多本地属性，这些属性控制着你的直接 shell\
    \ 界面如何与系统交互。这些属性被称为 Shell 变量和环境变量，对 Linux 的运行至关重要。UNIX 和 Linux 使用许多变量进行内部处理。这些变量帮助系统管理用户资源。本章将讨论所有\
    \ Linux 生存者需要知道的基础知识。\n\n### 3.1 UNIX Shell 游戏\n\nUNIX 的一个显著特征是，你可以控制与其通信的界面。这些接口被称为\
    \ shells，而原始的 shell 是 sh，它有许多兄弟版本，包括 ash。\n\n许多用户倾向于使用伯克利 C 类型的 shell，如 csh 和\
    \ tcsh。然而，你的选择很大程度上取决于喜好，但我们将使用 bash。\n\n### 3.2 Bash\n\nBash 是默认 shell。注意 set\
    \ 提供了 PS1 以及其他变量。输入以下命令获取输出：\n\n```\nPRINTER=astro\nPS1=$s\nPWD=/home/joe\nSHELL=/bin/bash\n\
    SHLVL=2\n```\n\n#### 3.2.1 设置提示符\n\n在交互式执行时，bash 在准备读取命令时显示主提示符 PS1，在需要输入时显示次提示符\
    \ PS2。\n\n\\t 当前时间，HH:MM:SS\nd “星期 日期”格式日期\nw shell 的名称，$0 的基名\nw 当前工作目录\nW 当前目录的基名\n\
    u 当前用户的用户名\nh 主机名\n# 命令的编号\n! 该命令的历史编号\n$ 如果有效 UID 为 0，a, #\n\n让我们通过添加命令编号更改 bash\
    \ 提示符。这是一个示例：\n\n```bash\nbash PS1=' \\s \\u \\t# \\#: '\n```\n\n应该产生类似的结果\n\n\
    ```\nbash joe 00:02:07#: 13:\n```\n\n现在设置你的提示符，使其始终显示你的路径。尽管本手册将指定 <bash>，你仍应使用如下提示符：\n\
    \n```bash\nbash PS1='<w> '\n```\n\n#### 创建别名\n\n现在，由于每次查看详细目录列表都要输入 `ls -Agl`\
    \ 非常累，所以我想将命令 d（代表“directory”）别命名如下：\n\n```bash\nbash alias d='ls -Agl'\n```\n\
    \n我们确实希望让这个定义永久化，放入 .bashrc 中，我们将在第 7 节脚本中学习如何操作。\ntcsh (或 csh) 中的相同别名编写时不带等号\
    \ (=) 符号：通过输入 tcsh 启动 tcsh：\n\n```bash\ntcsh: tcsh\ntcsh: alias d 'ls -Agl'\n\
    tcsh: d\n....\ntcsh: exit\n```\n\n"
