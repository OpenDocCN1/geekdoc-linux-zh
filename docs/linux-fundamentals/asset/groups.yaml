    ## 2.5 I/O, Redirection, and Pipes


    I/O refers to Input (I) and Output (O). This section talks about input and output
    of commands and how you can manipulate these. These principials are very important
    because they are used constantly in Unix.


    ## 2.5.1 Standard I/O


    In UNIX , Standard Input (stdin) and Standard Output (stdout) are mechanisms that
    allow you to input or output data from a command. Simple commands like "cat" send
    their results to stdout (normally to your screen). Independent of stdin and stdout,
    there is also the standard error (stderr) which goes to your screen when the command
    detects an error. Bash assigns special numbers, called File Descriptors, stdin,
    stdout, and stderr:


    | Name | Abbreviation | File Descriptor | Standard Device |

    | --- | --- | --- | --- |

    | Standard Input | stdin | 0 | Keyboard |

    | Standard Output | stdout | 1 | Console |

    | Standard Error | stderr | 2 | Console |


    Table 2.1: Bash Standard/O


    ## 2.5.2 Redirection


    Redirection refers to the art of redirecting input and output from commands. Shells
    like bash allow for redirection of stdin and stdout with < and > respectively.
    As an example, you can list some files and (redirect) the output to a file instead
    of the screen:


    ```bash

    ls -al > output.txt

    ```


    To check the output, you can use cat is when you want to view your files:


    ```bash

    cat output.txt

    ```


    Note that "cat output.txt" and "cat < output.txt" give the same result, but in
    bash stderr is redirected with the 2> operator, while in tcsh, the >& operator.
    Just relax and see examples of this shortly. Linux Warning: Please note that >
    will overwrite anything in the output, if it exists, or create the file if does
    not. In contrast, >> operator will append to the existing file. Here is a brief
    summary of the redirects:


    | Name | Operator | Description |

    | --- | --- | --- |

    | Redirect stdin | < | Feeds the file to input |

    | Redirect stdout | > | Creates or overwrites |

    | Append stdout | >> | Creates or appends |

