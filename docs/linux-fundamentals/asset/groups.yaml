    # 第 2 章 UNIX 命令行基础


    当你遇到疑问时，使用 **man** 和 **man -k 关键词** 来获取命令或 UNIX 相关术语的信息。找到 **ls** 命令的帮助页。**ls**
    将列出目录内容：


    ```bash

    ls

    ```


    | LS(1) | FSF | LS(1) |

    | --- | --- | --- |

