  - '[PAGE 8]


    # Chapter 2


    # UNIX Command Line Basics


    The objective of this chapter is to configure the shell account so that printing,
    manuals, and editor functions are working normally. This will give us experience
    with the basic commands, environment variables, and workhorse tools needed.


    # 2.1 Logging In To Your Account


    Log into your system with the login name and password given to you. You will see
    something like


    ```

    bash:

    ```


    Your system should always prompt you with the name of the shell (bash) and your
    login name. This is a customizable feature in the bash shell which you are now
    using.

    The most basic command in Linux is the directory listing "ls" command.

    You can see the contents of your account by typing


    ```

    ls -al

    ```


    You will see files like


    | drwxxr-xr-x 13 joe 1024 Nov 9 17:06 .dt |

    | -rwxrxr-xr 1 joe 5111 Sep 30 15:19 .dtprofile |

    | drwxxr-r-- 2 joe 96 Dec 1 12:25 .elm |

    | -drwxr---- 1 joe 1178 Nov 19 10:58 .emacs |


    # 2.2 Command Structure


    We''ve already seen ls give a directory listing the current working directory
    (cwd).

    Commands in Linux follow a general format:


    Command -options Other parameters'
  - '[PAGE 9]


    # CHAPTER 2. UNIX COMMAND LINE BASICS


    for example:


    ```

    <bash>: ls -bashrc

    ```


    First comes the command name, followed by options. Options are normally preceded
    by a dash or minus sign. There is always a space between the command and the dash.
    Some commands use no options at all. After the options comes any other parameters
    or informations that command may need.


    Let''s talk about the workhorse commands. Note that these definitions are purposely
    abbreviated and incomplete! Consult the man pages for each of the commands below.
    In the commands in square brackets [...] [-opts] refers to options in the style
    mentioned.


    # Special Keys Strokes:


