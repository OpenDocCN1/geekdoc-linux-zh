    # CHAPTER 3. THE LINUX ENVIRONMENT


    # 3.1.1 Shell Features


    Most Linux distributions come with bash and tcsh which replace sh and csh respectively.
    These are the two big shells that 99.9% of the Linux world uses. There are several
    key commonalities and differences between the two. The following tables outline
    these:


    | Action | bash | tcsh |

    | --- | --- | --- |

    | Default Prompt | | # |

    | Force Redirection | > | > |

    | Force Append | >> | >> |

    | Variable assignment | var=value | set var=value |

    | Set Environment | export var | setenv VAR value |

    | Number of arguments | # | $$ ($argv in csh) |

    | End loop statement | esac | end |

    | Loop | for/do | foreach |

    | If statement | if [ ...] | if ( ) |

    | End if | fi | endif |

    | Read from terminal | read | $<$ |

    | Start until loop | until/do | until |

    | While loop | while/do | while |


    Table 3.1: Bash-Tesch Difference


    | Symbol/Command | Action |

    | --- | --- |

    | > | Redirect output |

    | >& | Redirect stdout stderr |

    | >> | Append output to file |

    | \| | Pipe output |

    | & | Run process in background |

    | TAB | Filename/command completion |

    | $ | Repeat command #n in history |

    | $var | Variable substitution |

    | # | Comment line |

    | bg | Put process in background |

    | fg | Put process in foreground |

    | cd | Change directory |

    | echo | Echo execution output |

    | jobs | List current shell processes |

    | kill | Kill specified processes |

    | unmask | Set default file permissions |


