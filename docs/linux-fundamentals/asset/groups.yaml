    # 5.3 MANAGING PROCESS PRIORITIES


    # 5.3 Managing Process Priorities


    In Linux and UNIX , all processes have an importance factor called a priority.
    The priority tells the system kernel how to serve that process. Obviously some
    processes are much more critical to the system than others. Hardware access is
    more important than email. The smaller priority value, the more importance the
    process is given. Priority values from -20 to 20, where -20 is the highest priority
    and 20 is the least.


    You can see the priority of your processes by reading the PRI column in the ps
    -xl command:


    ```

    <bash>: ps -xl

    ```


    | F UID PID PPID NI VSZ RSS WCHAN STAT TTY TIME COMMAND |

    | 000 501 617 612 0 2032 504 do_del S ? | 0:03 fvvm |

    | 000 501 622 617 0 3144 872 do_del S ? | 0:03 xterm -cr r |

    | ... | |


    There are two major tools for manipulating process priorities, nice and renice.
    nice lets you specify the priority for a command, and renice allows you to change
    the priority after the process is started. Here''s an exercise for you:


    ```

    <bash>: man nice

    ```


    NICE(1)

    nice - run a program with modified scheduling priority


    SYNOPSIS

    nice -priority command [arguments]


    # 5.3.1 Exercises


    ```

    <bash>: xclock -rv &\n<bash>: -10 xclock -rv &\n<bash>: /bin/nice -10 xclock -rv
    &\n<bash>: ps -xl

    ```


    | F UID PID PPID NI VSZ RSS WCHAN STAT TTY TIME COMMAND |

    | 000 501 617 612 0 2032 504 do_del S ? | 0:03 fvvm |

    | 000 501 622 617 0 3144 872 do_del S ? | 0:03 xterm -cr r |

    | 000 501 2855 1321 8 2568 1030 do_del SN ttype2 | 0:00 xclock


    ```

    <bash>: renice 20 2855

    2855: old priority 4, new priority 20

    ```


    > # Renice to LOWER # xclock pid 2855.

    # Don''t worry if others don''t join.

    # Only HIGHER #''s allowed!


    ```

    <bash>: renice 5 2855

    2855: priority: Permission denied

    ```'
