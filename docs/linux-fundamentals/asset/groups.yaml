    - C-g 向前搜索、向后搜索、正则表达式搜索\n\n### 格式化\n\n- TAB 缩进当前行（取决于模式）\n- TAB 缩进区域（取决于模式）\n\n\
    ### 帮助\n\n- C-h 基础帮助、滚动窗口、apropos：显示匹配字符串的函数描述\n\n### 6.4 使用邮件\n\nLinux 有几个邮件处理器。我更喜欢\
    \ elm，因为它很好且强大，然而 pine 非常用户友好且易用。我们将讨论两者。\n\n### 6.4.1 Elm \n\n通过输入 \"elm\" 启动。第一次启动，它会询问你关于文件的问题，只需说\
