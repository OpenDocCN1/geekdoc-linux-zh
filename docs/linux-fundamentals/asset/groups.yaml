    more error.txt                             # Just like in bash.

    cat testfile.txt >& out.txt               # ditto

    cat < testfile.txt | sort | more          # ditto

    locate .bashrc | xargs alias         # find ''alias'' in .bashrc

    exit

    ```


    Don''t forget the last "exit" to get out of tcsh and back into bash.


