    Linux comes with all the TCP/IP networking goodies you would expect from a full-featured
    UNIX box. It has telnet, ftp, mail, and many other services. Here''s a quick list
    of the bread-n-butter commands:


    ## Basic Network Applications and Services


    - telnet RemoteHost Connect to another system (insecure)

    - login RemoteHost Login to RemoteHost (insecure)

    - ftp RemoteHost File Transfer Protocol transfers files between hosts

    - ssh RemoteHost Secure connection to RemoteHost

    - scp RemoteHost Secure copy file from here to RemoteHost

    - scp Host1:f1 Host2:f2 Secure copy f1 from Host1 to Host2


    ## TCP/IP Diagnostics


    - ping RemoteHost Send a "ping" to a remote host to check connectivity

    - nslookup RemoteHost Query a DNS server for hostname resolution

    - route Print out the routing table (check /sbin/route)

    - ifconfig Print local TCP/IP network interface configuration

    - arp print/manipulate ARP cache

    - tctpdump -i ethX listen to traffic on ethX


    ## Networking Terms


    - TCP/IP Transmission Control Protocol / Internet Protocol

    - ARP Address Resolution Protocol

    - route a route to another machine

    - host Any machine on the network

    - client The that wants data or a service

    - server The host that provides data or a service


    ## 9.1 Network Communication


    This section covers network communication from a user point of view. We won''t
    talk much about how to set up hardware or server configurations. This has already
    been done by your administrator.


    ### 9.1.1 Checking Network Status


    Sometimes it is unclear if your network is working correctly. There are some easy
    commands that you can use to check if a computer is “alive” on the network. The
    first and most important command is ping will send a test message to the computer
    who should respond:


    ```

    [LocalHost]/home/joe:ping grouch

    PING grouch (192.168.1.3): 56 data bytes

    64 bytes from 192.168.1.3: icmp_seq=0 ttl=255 time=0.7 ms

    64 bytes from 192.168.1.3: icmp_seq=1 ttl=255 time=0.3 ms

    64 bytes from 192.168.1.3: icmp_seq=2 ttl=255 time=0.3 ms

    ```


    This shows that the computer is alive. If it is not, you will get an error message.
    You can also use nslookup to find the IP address of a hostname.


    ## 9.1.2 DNS and Route


    The nslookup command is used to query DNS servers for hostname resolution. This
    is very useful when you need to find the IP address of a website.


    ```

    nslookup google.com

    ```


    The route command is used to see the routing table. This can help you understand
    how traffic is being routed through your network.


    ```

    route -n

    ```


    The ifconfig command is used to display the configuration of your network interfaces.
    This is a good way to check your IP address and subnet mask.


    ```

    ifconfig

    ```

