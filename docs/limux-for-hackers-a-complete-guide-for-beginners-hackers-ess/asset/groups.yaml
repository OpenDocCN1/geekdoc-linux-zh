    Capacity（所需容量）输入框中选择输入的大小为“500M”。


    `/boot` 分区不需要太大，因为它只用于存储一些系统启动信息和内核信息。点击 Add（添加）挂载按钮，即可创建 `/boot` 挂载点。


    - 7) 然后创建一个 swap 类型的挂载点。在 Mount 下拉列表中选择 swap，然后在 Desired Capacity 输入框中输入大小，此处指定
