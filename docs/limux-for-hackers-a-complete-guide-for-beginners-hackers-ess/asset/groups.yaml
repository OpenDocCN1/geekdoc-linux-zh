    ## WHAT ARE DATA TYPES IN PYTHON?


    Data types are an easy way to say to the interpreter about the data you are dealing
    with. Unlike traditional programming languages such as C and Java python automatically
    detects what data type you are using.


    Confused? Let us take an example in C program.


    Example :


    ```

    Int a;

    Int b;

    ```


    ```

    A = 23;

    B = 46;

    ```


    The above code is an example of C program. Here, we need to first declare variables
    with a datatype (int) before assigning them a value.


    However, in Python all we need to do is enter the below code:


    ```

    A = 23

    B = 46

    ```


    You can further simplify as below


    ```

    A,b = 23, 46

    ```


    Writing in very few lines of code can improve overall performance of the program.


