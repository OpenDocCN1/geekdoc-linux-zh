    # Python 中的函数是什么？


    函数是一组代码，每当需要就可以反复使用。你所做的就是在程序中使用参数来调用函数以获得结果。虽然原理看起来很简单，但函数的实现对于尤其是学习 Python 的初学者来说，可能会让人无从从。


