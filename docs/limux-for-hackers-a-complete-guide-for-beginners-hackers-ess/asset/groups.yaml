    In the previous chapter we already provided step-by-step instruction to install
    Kali linux in a virtual machine. You can also install Kali Linux as a separate
    operating system using the USB installation method we explained in module 1 of
    this book.


    # WHAT IS A HACKING PROCEDURE?


    Hackers use different protocols to crack and destroy systems. Some simple tools
    to find bugs and create their own scripts to exploit them. Some advanced hackers
    create their own worms, spiders to crack systems on a much larger viewpoint.


    Remember Ransomware software that destroyed a lot of industries a few years back?
    It used an unknown bug in windows to exploit the systems all the world and locked
    them to pay money to delete their sensitive information from servers.


    Talented hackers always do a complete research about the target system before
    attacking it. Newbies at this point and waste their system resources by attacking
    a lot of targets at the same time Whereas experienced hackers pin point a specific
    location and hack it using different tricks.


    # HOW MANY TYPE OF HACKERS ARE THERE?'
