    和 EPOLET 事件，最后将新 socket 设置为非阻塞。


    wait 调用检测到文件描述符上的事件，这表明工作线程正确处理了客户端请求并准备好了发送的数据，因此主线程开始执行 write 系统调用并响应客户端。


    最后，服务器从 epoll 事件表中移除文件描述符 5 的所有注册事件并关闭文件描述符。因此，trace 命令使我们能够清晰地看到每个系统调用的时机和相关参数的值，这比使用
