    # HOW TO IMPLEMENT THE PROCESS OF INPUT AND OUTPUT OF DATA IN SCRIPT FILES?


    In Linux system, both echo command and printf command can implement the function
    of information output that is necessary for the program. let''s look at the application
    cases of these two commands respectively.


    +   1) First, we will use echo command to create a script file menu


    Function description of the command:


    echo command is mainly used to display string information.


    The syntax of the echo command is as:


    ```

    echo "This is the 1st sentence"

    echo "This is the 2nd sentence"

    echo "This is the 3rd sentence"

    ```


    As can be seen from the above script file, the echo command can output any string
    of messages. Multiple echo commands can be used to output multiple'
- md: '

    messages, or one echo command can be used to output multiple messages together
    with quotation marks. However, the output information is usually in default black
    font and cannot be displayed in the center.


    When we need to display the information prominently to prompt the user''s attention,
    the output may be slightly monotonous. The echo command supports the -e option,
    which allows the echo command to recognize the meaning of the escape symbol after
    \t.


    ```

    root@server : echo "u"

    ```


    Among these additional commands, \033 or \e can be followed by terminal code and
    can be used to define font color, background color, positioning cursor, etc. All
    these extra information can enhance how you display messages according to your
    convenience using the echo command.


    ## Example Application case:


    Here is a certain way to display the classic "hello world" using various advanced
    shell output techniques.


    Because there is no -e option and the character \ is not supported, the screen
    will output the original content \ directly. For this example, we will Output
    hello, then use Tab indent, and finally output world, and then will make sure
    that the final result will be displayed as "hello world".


    In another way we can Output hello, then move the cursor to the left by one bit,
    and then output world. The original letter e is usually replaced by the new letter
    o, so the final output result will still be displayed as "hello world".


    Here are the commands:


    ```

    root@server : echo -e "hello\fworld"

    ```


    ```

    root@server : echo -e "hello\tworld"

    ```


    Note:


    There is at least one space between the -e option and the content to be given
    as output later. Similar to the above case, move 2 bits to the left, and the final
    output will be shown as “hello world”.


    ```

    root@server : echo -e "hello\bo world"

    ```


    We can also output hello, that is, we wrap the line the cursor stays at the original
    position, that is the position behind the letter o, and then will output world.
    We will have Bold display OK. \033 or \e can be followed by different codes to
    set different terminal attributes.


    ```

    root@server : echo -e "hello \bo world"

    ```


    1m is for the terminal to display the character string in bold, followed by OK
    is the content of the character string to be displayed, and finally \033[0m. is
    to close the terminal attribute setting after outputting OK in bold.


    If the attribute setting not closed with 0m in the end, then all strings in the
    terminal are displayed in bold. After executing the following command, you will
    find that all strings that output in the terminal are displayed in bold except
    OK.


    Here is a command:


    ```

    root@server : echo -e "w 0m"

    // This displays with the specified option

    ```


    Try it:


    Do you have any other colors? Such as 92m? You can try it yourself!


    In addition to defining the font color, style and background of the terminal,
    you can also use h to define the location attribute. For example, you can display
    OK in the third row and tenth column of the screen by the following command.


    Here is the command:


    ```

    root@server : echo -e "\033"

    ```


    Finally, we use the echo command to write a more interesting script file menu.
    In the following script file, clear command is used to clear the whole screen,
    and then echo command is used to set terminal properties, and a personalized menu
    with color and layout is printed. As the specific color matching, readers can
    personalize the design according to their own needs.


    Here is the script:


    ```bash

    #!/bin/bash


    clear

    echo -e "\033m"

    ```


    With a complete introduction to the much discussed “echo” command we will shift
    our focus to the “printf” command in Linux.


    ## 2) Expand knowledge and create a script menu by using printf command.


    In Linux system, besides echo command, you can also use printf command to achieve
    the same effect.


    Function description:


    printf command can print format data.


    The syntax format of the printf command is as follows:


    ```

    printf "details"

    ```


    Note: the parameters of the general printf command are what needs to be used as
    an output. Commonly used format strings and function descriptions are shown for
    your better understanding of what you are dealing with. In the next section, we
    will further expand our knowledge using an application case.


    ### Application Case:


    The format %8d of this command sets the print width to 8, and displays the integer
    64 in a right-aligned manner.


    ```

    root@server : printf "%8d" 64

    // Output will be 64 with width as 8

    ```


    Note that there are five spaces in front of the output information 64 of this
    command. 5 spaces + 3 numbers together are 8 characters wide. If you need left
    alignment, you can use %-8d to achieve the effect, such as the following command.


    ```

    root@server : printf "%-8d" 44

    ```


    Note, after the printf command outputs information, it defaults to no new lines.
    You can use the \n command if you need to wrap lines.


    In order to better observe the left-right alignment effect, the following example
    will print two symbols to determine the position.


    ```

    root@server : printf " |%-11d \n" 64

    ```


    Left-aligned output 64, the output content takes up 11 characters wide, takes
    up 2 characters wide, followed by 8 spaces.


    The default printf command will not wrap after the output, but can wrap after
    the output using \n the command symbol.


    This displays the octal value of 10, and the conversion from octal 12 to decimal
    is exactly 10. x11 represents hexadecimal 11, and the printf command converts
    hexadecimal 11 into decimal integer output (17). 01 represents octal 11, and printf
    command converts octal 11 into decimal integer output (9).


    ```

    root@server : printf "%d \n" 17.011

    ```


    When using \d to print a large integer, the system prompts that it is out of range
    and that the maximum number that can be printed is 92798329882.


    If you need to print such a large integer, you need to use the \u command, but
    the \u command also has the maximum display value (29290390238009), and when it
    is greater than the maximum value, it cannot be printed.


    ```

    root@server : printf "%d\n" 9279832988

    ```


    In the next section, we will talk about reading the information available using
    the ''read'' command that is famous now a days.


    ## 3) Read the user''s input information by using the read command.


    Before that, we learned how to output data in the Shell script, and then discussed
    how to solve the input problem. In the Shell script, read command is allowed to
    realize the data input function.


    Function description:


    The read command can read a line of data from standard input.


    The read command has the following syntax format.


    ```

    root@server : read { Enter parameter here }

    ```


    If no variable name is specified, the default variable name is REPLY.


    Here, 672 is entered through keyboard, while Read command reads this 672 from
    standard input and assigns this string to variable key1. For key1, we can use
    echo $key1 to display the value of this variable.


    ```

    root@server : read something

    672

    ```


    Application case:


    Note that after the password is prompted here, when the user enters the password
    672, the computer displays the plaintext of the password on the screen, which
    is not what we want to see!


    ### What to do?


    The read command supports the -s option, which can make any data input by the
    user not displayed, but the read command can still read the data input by the
    user. Let''s look at a script case written with the read command.


    Here is the command:


    ```

    read -sp " Use this to save"

    ```


    This script reads the user name and password entered by the user through the read
    command, and when reading the password entered by the user, the content of the
    password is not directly displayed on the screen, which is safer.


    The user name and password entered by the user are stored in two variables, user
    and pass respectively. Here, call the values in the variables with $,use the useradd
    command to create a system account, and use the passwd command to configure the
    password for the user. Passwd is directly used to modify the password.


    Here is the script:


    ```bash

    #!/bin/bash


    # Read the data


    read -p " Enter the name " user


    read -s " Enter the password" pass


    user add "$something"


    #print password

    ```

