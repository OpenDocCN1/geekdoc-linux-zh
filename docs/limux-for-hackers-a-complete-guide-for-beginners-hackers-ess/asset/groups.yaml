    is. Without log files, it would be a tremendous task to manually check where the
    problem exists.


    How logs are created?


    Log files in linux are generally created using a specific daemon known as syslogd.


    But, what is a daemon?


    A daemon is a system service that automatically starts whenever a system is rebooted.
    They are the first processes that run no matter what software is installed in
    the system. They are also known as default system processes. syslogd is a specific
    system process that takes care about creating log files for every event that runs
    in the operating system.


