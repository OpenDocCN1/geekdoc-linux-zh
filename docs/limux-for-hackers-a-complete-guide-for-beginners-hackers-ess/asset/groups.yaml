    Thin Provisioning (thin provisioning).


    Among them, standard partitions can be used for various file systems or swap space
    (swap), which is a commonly used partitioning scheme. Btrfs is the next-generation
    Linux file system, which is used by companies and communities as Oracle, Red Hat,
    Intel, and Suse.


    LVM is a logical management partition scheme. When creating an LVM partition,
    LVM logical volume is automatically generated, and the physical disk can be used
    flexibly through LVM and can improve disk performance. Using LVM thin provisioning,
    you can dynamically create and allocate storage pools, and then freely manage
    disk space. LVM thin provisioning is an upgraded version of LVM.


    In fact, there is also a RAID partition scheme. When there are two or more disks,
