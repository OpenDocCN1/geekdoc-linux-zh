    ```


    # Under what circumstances are so many symbols used?


    Let''s look at a few cases. It can be seen here that the function of double quotation
    marks is to quote a whole, and the computer will treat all the contents in quotation
    marks as a whole. Instead of using double quotes, three different files are created.
