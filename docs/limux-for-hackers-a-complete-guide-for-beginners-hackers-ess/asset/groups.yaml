    - 4) Linux installation method on virtual machine


    There are two commonly used methods for installing Linux on a virtual machine:
    CD-ROM installation and ISO image file installation.


    - 1) Optical drive installation method


    In the "Oracle VirtualBox Management Controller" interface, select the virtual
    machine that needs to be installed, and click the "Settings" button to enter the
    virtual machine settings interface, and then select the "Storage" option.


    After clicking the "Storage" option, an IDE controller and a SATA controller will
    appear on the right. Under the SATA controller is the virtual disk device of the
    virtual machine, and the default IDE controller is empty and displays "No Disk".
    Click the "No Disk" option so that the property settings of the IDE controller
    will appear on the right. Click the CD icon under "Properties". All available
    devices will appear, both physical devices and virtual devices. The physical device
    "F:" here is the CD-ROM drive of the physical machine. After selecting, it, click
    the "OK" button. Use the physical CD-ROM to install the system.


    Finally, click the "Start" icon on the "Oracle VirtualBox Management Controller"
    interface to start the virtual machine. VirtualBox will automatically read the
    CD of the physical machine and enter the Linux boot installation interface.


    - 2) ISO file installation method


    ISO file is a kind of CD image file. The burning software can directly burn the
    ISO into an installable system. Since the ISO file runs directly on the hard disk,
    the data transfer speed is very fast. The CD installation method is simple but
    because the transmission speed of ordinary CD-ROM drives is relatively slow, the
    installation process is also relatively slow.


    Therefore, it is recommended to install the system through an ISO file on a virtual
    machine.


    - 1) Similar to the CD-ROM installation method, when selecting the virtual machine
    to be installed on the "ISO VirtualBox Management Controller" interface, and then
    click the "Settings" icon to enter the virtual machine setting interface. Then
    select the "Storage" option, click the "Select Disk" button and specify the corresponding
    ISO file on the physical machine. Finally click the "OK" button to complete the
    loading of the ISO image file.


    - 2) Click the "Start" icon on the "Oracle VirtualBox Management Controller" interface
    to start the virtual machine. VirtualBox will automatically read the ISO file
    and then boot into the Linux installation interface.


    - 3) Sometimes the virtual machine may not be able to boot from the CD-ROM drive
    or ISO file, and you may need to modify the boot sequence of the virtual machine.
    After the virtual machine starts, quickly press the F12 key on the keyboard to
    enter the virtual machine boot sequence configuration interface.


    - 4) The default boot sequence of the virtual machine is hard disk, floppy drive,
    optical drive and network. If you want to choose to boot from the optical drive,
    directly press the c key in the interface to enter the CD to boot. Other operations
    are similar.


    - 5) After the VirtualBox virtual machine is started, it will enter a new virtual
    computer console. When entering the new computer console, there will be a problem
    of switching the mouse and keyboard between the virtual machine and the physical
    machine.


    - 6) By default, the switch is the right Ctrl key, that, when the virtual machine
    monopolizes the keyboard and mouse, press the right Ctrl key to exit the exclusive
    mode, and press the right Ctrl again to enter the exclusive mode again. This right
    Ctrl key is also called a hot key or a hot key.


    - 7) The combination of the host key and other keys can realize shortcut operations
    on the virtual machine. For example, the Host+Del key combination represents the
    Ctrl+Alt+Del key combination on the keyboard, Host+R represents the restart of
    the virtual machine, and the Host+H key combination represents normal Shut down
    the virtual machine, and so on.


    From now, just follow the installation procedure we have discussed in the first
    module to install the Kali Linux until the Home Screen appears.


    # CHAPTER TWO


    # HACKING PHILOSOPHY


    IN THE PREVIOUS chapter we have installed Kali Linux in a virtual machine and
    we are now ready to experiment with it to learn a bit about hacking and get a
    solid introduction that is considered necessary for an ethical hacker.


    First, we will start with a pretty basic question.


    # WHAT IS HACKING?


    It may seem arbitrary because of constant wrong introduction of hacking in popular
    culture references. From 90''s films, books and comics are representing hackers
    as a shady guys who are trying to break systems and collapse the internet.


    But, is it right? Or hackers really what they are represented? I mean there are
    definitely some bad people who stay in dark web and stolen credit card information
    at cheap prices for people who are willing to exploit.


    But on the other side of coin there are also thousands of ethical hackers who
    are working hard to protect complex network systems to be attacked by some mischiefs
    that are trying to brute force the systems.


    Hacking is a computer learning where people try to destroy systems. While it may
    seem that destroying is a bad thing but what they are actually doing is to help
    us understand the loopholes that may arise while developing software, operating
    systems and applications.


    In the early days hacking used to be a skill that requires both hardware and software
    access. But now, after the advent of internet and network architecture anything
    can be hacked just with the help of few software with just a computer.


    # WHAT IS LINUX TO HACKERS?


    All popular hackers highly recommend newbies( which they also call as script kiddies)
    to stop using windows or macOS for hacking. Windows and macOS are not only very
    bad operating systems for hackers but can also compromise your security while
    hacking and cracking systems.


    Linux is a highly secured kernel base system that is pre installed with network
    monitoring tools and other command utilities that can help you to monitor traffic.


    # WHAT IS A HACKING PROCEDURE?


    Hackers use different protocols to crack systems. Remember Ransomware software
    that destroyed a lot of industries a few years back? It used unknown bug in windows
    to exploit them.


    Talented hackers always do a complete research about the target before attacking
    it. Newbies at this point waste system resources by attacking a lot of targets
    at the same time.


    # HOW MANY TYPE OF HERS ARE THERE?


    There are mostly three type of hackers that are usually distinguished by the technical
    world. Among them the most important are ethical hackers who help to secure the
    systems with their penetration testing skills and loophole detection.


    Here is a small description about each type of hackers for you.


    ### 1) Black hackers


    These are the type of hackers who use hacking practices for their personal gain.
    They exploit systems and steal data with a motive. According to latest statistics
    black hackers steal more than $2 billion every year from the internet. More tech
    companies are worried about the black hackers and spend thousands of crores to
    develop intrusive detection systems. If you are learning this book to become a
    black hat hacker we are warning you that it is not easy out there.


    ### 2) White hackers


    These are the type of hackers who do hacking to secure systems. Almost every security
    researcher come under this category. Not only hackers but also forensic specialists
    and reverse engineers fall under this category. White hat hackers are as sophisticated
    as black hackers in knowledge and speed. The only advantage that white hat hackers
    possess apart from black hat hackers is that they have good information about
    the target.


    ### 3) Gray hackers


    If a hacker fall in between other two categories then we can simply call him a
    gray hacker. Hackers working for a government or an university can fall under
    this category.


    # WHAT NEXT?


    To be a hacker you need to have a good mind for research about the target. In
    the next chapter we will talk about different networking tools to improve your
    reconnaissance knowledge. We also suggest you to learn about hacking and cybersecurity
    in much larger detail by reading different blogs. You can also try to involve
    in bug bounty hunting if you become interested in ethical hacking.

