    # 第八章

    Shell 扩展


    在上一章中，我们学习了 Shell 的基础。在接下来的章节中，我们将讨论 Shell 的高级概念。


    ## 我们学习什么？


    我们将学习可以提高 Shell 编程准确性和可预测性的不同扩展。我们将详细解释这些扩展。


    ## Shell 大括号


    首先，我们将讨论大括号及其在 Shell 编程中的重要性。Shell 脚本支持七种扩展，即大括号扩展、波浪扩展、参数和变量扩展、命令替换、算术扩展、单词分割和路径扩展。


    这些扩展技术在编写脚本时非常有用。你可以使用大括号扩展 Shell 脚本中的字符串。我们可以在一对大括号中包含一组字符串或逗号分隔的字符串序列形成字符串扩展。


    注意输出结果用空格分隔。使用此扩展时，大括号不能加单双引号，括号数量必须为偶数。字符串序列后面可以跟一个可选的大小整数，该大小的默认值为 1 或 -1。


    在使用大括号扩展时，可以在大括号前后添加可选字符串，且大括号扩展支持嵌套。


    以下是示例：


    ```

    root@server : echo {a,g,h}

    // 这是使用大括号

    ```


    ## 波浪扩展


    这是上述 Shell 扩展功能之一，在脚本中默认表示当前用户的家目录。我们也可以配合有效账户登录名使用波浪扩展返回特定账户的家目录。


    然而，注意该账户必须是系统中的有效账户。波浪扩展使用 `~+` 表示当前工作目录，`~-` 表示前一个目录。


    工作目录通过以下扩展确定。


    以下是一些其他命令：


    ```

    root@server : echo ~root

    root@server : echo ~+

    // 显示顶部目录

    ```


