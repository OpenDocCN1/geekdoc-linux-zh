    ## CHAPTER THREE: REDRECTING INPUT AND OUTPUT IN SHELL


    IN THE PREVIOUS chapter we gave a satisfactory introduction to the importance
    and implementation of input and output statements in shell scripting. In this
    chapter we will talk about advanced expertise details such as Redirection of input
    and output statements with sufficient examples. Follow along!


    ## WHY IS REDIRECTION IMPORTANT IN SHELL?


    In most systems, the output information is usually displayed on the screen by
    default, while the standard input information is obtained through the keyboard.


    However, when writing scripts, we can''t or don''t want the output information
    of some commands to be displayed on the screen (when the scripts are executed,
    a large amount of output information will make users feel confused). It also uses
    system resources more than what we ought to.


    At this time and for this reason, it is better to write the output information
    into the file temporarily, and then read the file and extract the required information
    when needed later. There are similar problems with the default standard input
    information. When we use the mail command to send mail in Linux system, the program
    needs to read the text of the mail.


    By default, the input data from the keyboard is used as the text, which will make
    the script enter interactive mode, because reading the keyboard information requires
    manual input.


    For example, if at this the default input mode can be changed, instead of reading
    the data from the keyboard, the data can be read from the file prepared in advance,
    so that the mail program can automatically read the file content and send the
    mail automatically when needed without manual interaction. In this way, the automation
    effect of the script will be a better experience.


    ## OUTPUT IN LINUX SYSTEMS


    In Linux system, the output can be divided into standard output and standard error
    output. The file descriptor of standard output is 1, and that of standard error
    output is 2. While the input file descriptor holds for 0.


    If you want to change the direction of the output information, you can use the
    > or >> symbol to redirect the output information to a file. Use 1> to redirect
    standard output information to a file (1 can be ignored without writing, the default
    value is 1), or use 2>> to redirect wrong output information to a file.


    Use the >> symbol to redirect the output information to the file. If the file
    does not exist, the system will automatically create the file. If the file already
    exists, the system will append the output information to the end of the original
    information of the file.


    In the following example, the echo command would have displayed the data on the
    screen, but redirection is used, the output information can be exported to a file.


    ```

    root@server : echo "This is a sample" > sample.txt

    // This exports the file to a text file named sample

    ```


    The previous echo command will not give an error message. However, when using
    ls command, the final output information is divided into standard output and error
    output according to whether the file exists or not. At this time, if we use only
    > or >>, we cannot redirect and export the error information to a file.


    Here we need to use 2 > or 2 >> to redirect the error output.


    Here we need to use 2 > or 2 >> to redirect the error output.


    If we want to redirect both standard output and error output to the same file,
    we can use 2>&1. For example, `ls /root > file 2>&1` will redirect both standard
    output and error output to `file`.


    If we want to redirect standard output to one file and error output to another,
    we can use > and 2>. For example, `ls /root > file1 2> file2` will redirect standard
    output to `file1` and error output to `file2`.


    If we want to append the output to a file, we can use >> and >>1. For example,
    `ls /root >> file 2>>1` will append both standard output and error output to `file`.


    If we want to discard the output of a command, we can redirect it to /dev/null.
    For example, `ls /root > /dev/null` will discard the standard output, and `ls
    /root 2> /dev/null` will discard the error output.

