    在 shell 脚本中，我们经常使用 $ 扩展和替换变量。还要记住，变量字符可以放在花括号中，这可以防止需要扩展的变量字符与不需要扩展的字符发生混淆。


    如果 $ 后面跟着一个包含多个数字的位置变量，必须使用 `{}`，例如 `$1`、`${11}`、`$12`。如果变量前面有一个感叹号 (!)，你可以实现对变量的间接引用，而不是返回变量的值。


    感叹号必须放在花括号中，且只能使用一层变量的间接引用。变量替换操作还可以测试变量是否存在或为空。如果变量不存在或为空，可以为变量设置默认值。Shell 脚本支持各种形式的变量测试和替换。


    这里有一个示例场景：


    根据变量替换的规则，当变量未定义或其定义值为为空时，将返回关键字 `streamer`。


    ```

    boats = ""

    root@server: echo $(boats)-streamer

    ```


    但它只会返回关键字 `streamer`，不会改变 `boats` 的值，因此 `boats` 的值仍然为空。让我们通过一个例子来验证，即使变量已经定义，当值为空时，也会返回关键字。


    无论变量未定义还是变量的值为空，以下示例都会返回变量的值。


    当变量的值非空时，此扩展将直接返回变量本身的值。偶尔，我们可以使用变量替换来实现脚本的错误报告功能，判断变量是否有值。如果没有值或值为空，我们可以返回特定的错误报告信息。


    ```

    root@server : echo $(boats=yatch)

    nYatch

    root@server : echo $(boats)

    Yatch

    ```


    观察相反的结果来看，当变量有值且不为空时，返回的是关键字；而当变量未定义或值为空时，它就是为空。


    在前面的一节中，我们已经编写了几个创建系统账户和配置密码的案例。结合我们在这里学到的变量替换函数，我们可以继续优化脚本并实现更多功能。


    变量替换就这些了吗？


    当然不是！变量替换还有非常实用的字符串拆分功能，可以分离字符串的头部和尾（前缀和后缀）。我们下一节讨论这些功能。


    ## 字符串切割与截取的后续


    我们建议这些变量变量不会改变变量本身的值。以下示例演示了这些函数的具体应用。


    以下是解释：


    首先，定义一个变量 `home`，变量的偏移量从 0 开始，表示变量值中每个字符的位置。


    如果设置了特定长度，则将截取给定长度的值并结束。如果未指定截取长度，则将直接截取到变量的末尾。这里使用了几个示例来介绍变量截头和去尾的操作。


    使用 `#` 截头，使用 `%` 去尾。因为 `#` 表示最短匹配，执行以下命令将仅删除第一个 `sr` 及其左侧的所有内容。


    ```bash

    root@server : echo ${home#sr}

    // 这将一直截取到字符串 sr

    ```


    如果你需要进行最长匹配，即始终找到最后一个指定的字符并删除其之前的所有字符，你需要使用两个 `#` 符号。从右向左删除直到匹配到 `d`。一个 `%` 则从右向左匹配。


    ```

    root@server : echo ${home%%d*}

    ```


    它会在第一个 `d` 处停止，两个 `%` 会从右向左匹配，但直到匹配到最后一个 `d` 才停止。


    如果变量是数组类型，这些扩展仍然有效吗？答案是肯定的。理解 shell 编程的力量。


    你可以通过截头和去尾批量修改文件名或扩展。批量修改文件扩展有两种情况：一种是批量修改当前目录下的文件扩展，另一种是脚本批量修改指定目录下的文件扩展。


