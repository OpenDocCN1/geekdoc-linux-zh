    # 第八章

    系统安装设置


    前一章节为 Linux 爱好者了解不同的流程提供了一个良好的开始，这有助于理解 Linux 是什么。在本章中，我们将讨论 Linux 安装过程中常用的不同系统安装设置。请继续阅读！


    ## 系统安装设置


    - 1) 现在进入磁盘分区阶段。在所示的界面中，点击“安装目标”（INSTALLATION DESTINATION）进入磁盘分区阶段。你可以看到有一个大小为
    100GB 的硬盘 sda。显示的大小将根据你的磁盘大小而定。


    在分区之前，有一些关于 Linux 分区的必要说明。


    Linux 系统下的必要分区是根分区（root partition，标记为 "/"）和交换分区（swap partition，标记为 swap）。交换分区等于
    Windows 中的虚拟内存概念，即在内存与硬盘之间交换数据。关于交换分区的大小，许多来源指出它至少是物理内存的两倍，事实并非如此。


    基本原则是：如果内存较小（根据经验，物理内存小于 4GB），通常将交换分区的大小设置为内存的两倍。如果物理内存大于 4GB 但小于 16GB，可以将交换分区的大小设置为与物理内存相等。如果内存大小超过
    16GB，可以将交换分区设置为 0。虽然交换分区可以设置为 0，但并不建议这样做，因为设置特定大小的交换分区仍然具有的一定的效果。


    虽然 Linux 默认只需要划分根分区和交换分区即可完成系统安装，但并不推荐这样做，因为如果只划分了根分区，当根分区损坏且数据存储在根分区中时，系统可能无法启动。数据也可能丢失，这非常不。因此，建议为独立的应用程序分配独立的分区，这样即使某个分区被破坏，也不会影响其他分区的数据，并可以尽力减少系统崩溃造成的损失。


    安装系统时，建议独立分配以下分区：


    - /boot：存储系统启动信息和内核信息。

    - /usr：存储系统应用软件的安装信息。

    - /var：存储系统日志信息。


    关于每个分区的含义，请参考下一章获取更详细的。。


    根分区包含 Linux 系统所有的目录。如果安装系统时只分配了根分区，上述的 /boot、/usr 和 /var 都将包含在根分区，这意味着分区将占用根分区的空间。如果你单独划分了
    /boot、/usr 等，这些分区将不再占用根分区的空间。


    了解了一些基础分区知识后，开始下方的磁盘分区。


    - 2) 在所示界面中，首先选择 100GB 的 sda 磁盘，然后在左下角会有两个分区选项。第一个是“自动分区”（Automatically configure
    partitioning），意味着自动分区。第二个是“我将配置分区”（I will configure partitioning），意味着手动分区。


    如果你不熟悉分区，可以默认选择“自动”。然而，从学习的角度考虑，建议选择手动分区，即使你是新手，选择手动分区也有助于理解和掌握系统分区。在此选择手动分区。选择后，点击左上角的“完成”按钮进入界面。


