    Linux uses system resources such as hardware equipment to interact with the software
    kernel so everything would function in a perfect way. Linux kernel is complex
    and provide use case for almost every driver that has been created. All the communication
    between the user and the kernel is performed in a command line environment known
    as a shell.


    In Linux, shell is like a crossover bridge between the user and the operating
    system. Whatever you enter will be sent to the Linux kernel. However, remember
    that Linux kernel responds to the only shell commands that seem correct to it.
    It will not perform any malicious destructive commands that can shut down the
    system or wipe it down completely. If you do have root privileges and are performing
    commands using shell environment then be sure because any wrong command can mess
    up your system properly badly.


    # WHAT ARE THE ADVANTAGES OF SHELL?


    You might have often heard about shell and should be confused why they are so
