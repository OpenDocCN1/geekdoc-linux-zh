    interface will be entered by default. If the graphical interface is installed,
    the graphical interface will automatically start. Now click the idxba user, and
    then enter the password to log in to system. If you need to log in with another
    user, select the Not listed below and enter the user who needs to log in the desired
    Name and password. You can comfortably switch users to log in to the system.


    +   3) After logging in to the system through the graphical interface, the language
    selection interface will pop up. You can select the desired language as needed,
    and then select the default as English. Click the Next button to enter the next
    interface.


    +   4) Enter the keyboard selection below and select the default English (US),
    and click the Next button to enter the next interface where all this completes.


    +   5) At this point, the user initialization process after installation is all
    over, click the Start using Linux Mint button in the interface to start the Linux
    learning journey.


    # WHAT TO DO NEXT?


    Congratulations. You have now installed the Linux Mint in your system. After a
    successful installation it is highly recommended to update the system so that
    there will be no lags or bugs in the installed operating system. For every couple'
  - '[PAGE 51]


    of months the linux kernel can be updated to improve the performance of the Linux
    Mint.


    With this, we have completed the important part of this book. In the next module
    of this book we will introduce complex Linux topics that are important for making
    Linux a better place for programmers and developers. Let us dive into the second
    module of this book. But before going, have a look at the next chapter that simplifies
    U disk installation process for you.'
  - '[PAGE 52]


    # BONUS : U-DISK INSTALLATION PROCESS


    AS EXPLAINED in the previous section there are different ways to install Linux
    in a desktop computer or a laptop or sometimes even in server based systems. We
    have discussed in the previous section using CD rom files. In this section, we
    will discuss about USB installation procedure which is now being used as a mainstream
    way to install Linux. Follow along carefully to know more about it.


    # U DISK INSTALLATION PROCESS


    Most PCs and servers nowadays are not equipped with CD-ROM drives, and are replaced
    by USB interface devices. At the same time, the USB 3.0 specification has been
    widely popularized, and the data transmission speed of U disk can reach gigabit
    per second. There are tens of products in market ranging from 2gb to 2tb according
    to your requirements.


    Due to this up in the installation procedure, there are now more and more applications
    based on the USB interface, as USB keyboard, USB mouse, USB optical drive, etc.
    When installing the system, although USB optical drive can be used to install,
    the current cost of USB optical drive is relatively high, and the installation
    of the system through U disk is not only of low cost, but also fast and convenient.
    In large-scale systems installation, through U disk has become a mainstream procedure.


    The basic steps for installing a Linux system through a U disk are as follows:


    +   1) First, a U disk of about 8GB is needed. The larger the capacity, the better
    it will be. The full ISO image file size of Linux Mint has reached 7GB now days.
    Always make sure to verify the file size before deciding to make an USB'
  - '[PAGE 53]


    installation medium.


    2) Download the ISO file of Linux Mint from the open source site (http://mirrors.163.com
    ). Or you can just visit the official Linux mint website to select your preferred
    disk image for installation.


    3) Download a U disk burning tool from the Internet. Common U disk burning tools
    include UltraISO, USBWriter and Rufus. USBWriter is recommended here, because
    USBWriter is easy to use and can be used to burn a disk image file in one step.
    Although UltraISO can also burn ISO images to U disk, the burned Us disk will
    sometimes have problems during the installation and boot process. If you are using
    a windows system to make the installation medium then we highly suggest you to
    use Rufus for burning the USB disk as it is more convenient and recommended one.


    4) USBWriter is an open source tool, which can be downloaded from http://sourceforge.net/projects/usbwriter/.
    It is a U disk burning tool that is specially used for Linux systems.


    Its working principle is to divide the U disk into two partitions, a FAT32 partition
    (only a few megabytes in size) that is used to install the boot program, and the
    other Linux partition is used to store the system installation package.


    There is sometimes a known problem:


    The capacity of the U disk by USBWriter will automatically become smaller. This
    is because only one FAT32 partition is seen, and the other Linux partition is
    invisible under Windows. But don''t worry, it''s easy to restore the USB flash
    drive to its original size. DownloadDiskius utility tool from the Internet to
    restore the USB flash drive to its original size.


    5) Use USBWriter to burn the downloaded ISO image file to the U disk. First select
    the location of the ISO image file, and specify the U disk that needs to be burned.
    For example, a 16GB U disk is selected. After selecting, click the Write button
    to start the burning process.


    After burning the ISO file to the U disk, all the previous data on the U disk
    will be lost, before burning, back up the data on the U disk.


    6) The U disk burning process is relatively fast, usually 10 to 30 minutes. If
    there is no error during the burning process, the burning process can basically
    be successful. After the U disk burning is completed, it will prompt that the
    burning'
  - '[PAGE 54]


    is successful.


    7) After the U disk is successfully burned, you need to re-plug the U disk. At
    this time, in the Windows Disk Manager, you can see that the 16GB U disk has become
    about 6MB in size.


    8) After the U disk is successfully burned, insert the U disk into the USB interface
    of the server, then enter the BIOS, set to boot from the USB device, and then
    restart the system to the interface that provides more options.


    9) The following installation process is exactly the same as the installation
    method of the optical drive that we introduced before, so the introduction will
    not be repeated. But one thing to note is that the disk partitioning phase, you
    will see two disks.


    After the installation procedure the USB disk will be ready and you can use it
    to install Linux in any computer easily.


    # WHAT NEXT?


    With this, we almost completed the first module of this book successfully. Even
    though being a short introduction to Linux and its installation procedure this
    module is opening to the much important roadmap that you are going to take now
    to become a Linux enthusiast and a cyber security specialist.


    In the next module of this book you will learn about important Linux topics as
    Linux file system, Process management and Log analysis. There are a lot of other
    topics that we are going to discuss. Follow along!'
