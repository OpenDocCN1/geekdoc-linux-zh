    ```


    - ii) In the second line, we use echo to display a message on the computer screen.
    Echo is a shell built-in-program that can be used to display or print information
    according to the user wish.


    - iii) The third line is followed after the ''#'' is known as a comment. Comments
    are usually used by programmers to make others understand what they have written.
    However, it is important to remember that everything that is written in a comment
    will be ignored by the bash interpreter to save compiling time and system resources.


