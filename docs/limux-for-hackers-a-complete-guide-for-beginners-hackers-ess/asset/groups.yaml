    # CHAPTER FIVE


    # VARIABLES IN SHELL PROGRAMMING


    IN THIS CHAPTER we will talk about the efficient implementation of variables while
    writing shell programs. They may seem easy but are usually complex and can change
    the shell implementations tremendously. We will also discuss about expressions
    in shell programming with detailed examples. Follow along!


    # WHAT ARE VARIABLES?


    Let us introduce variables with a small analogy. We all know that water is stagnant
    if it does not flow. If the constants used in the script are all immutable, then
    the function of the script is not flexible enough, and it is only a fixed script
    that can meet specific needs.If the water flows, there will be various forms.
    In the same way, if the script uses variables, it will become more flexible and
    changeable.


    Just as air temperature and air pressure are real-time changing data in real life,
    the computer data that scripts need to deal with often changes in real time.In
    Linux system, variables are divided into system preset variables and user-defined
    variables.


    # CUSTOM VARIABLES


    First, let''s look at how custom variables are defined and called.In Linux system,
    the definition format of a custom variable is “variable name = variable value”,
    and the variable name is only used to find an identifier of the variable value,
    and it has no other function.'
- md: '

    When defining a variable, the variable name can only use a combination of letters
    (both upper and lower case), numbers and underlined lines (_). And can not start
    with numbers. In addition, it is best to use easy-to-understand words when defining
    variable names in your work. Remember not to use random characters to name variables.
    Irregular variable names will make the readability of scripts extremely poor.


    It should be noted that there should be no spaces on both sides of the equal sign
    when defining variables.


    ## Tips for variable names:


    When you need to read the variable value, you need to add a dollar sign "$" before
    the variable name. If variable names are mixed with other characters that are
    not variable names, they need to be separated by {}. Finally, if you need to undefine
    a variable, you can use unset command to delete it.


    Examples:


    ```

    root@server : test=567

    root@server : $test

    ```


    Output


    ```

    567

    ```


    At this point, you need to use $ to separate the variable name from other characters.


    Although these three commands do not use $ to separate the variable name from
    other characters, the final return value is not blank, the Shell variable name
    can only be composed of letters, numbers and underlined lines, and it is impossible
    to include special symbols (such as horizontal lines, colons, spaces, etc.), so
    the system will not regard special symbols as a part of the variable name, but
    will understand that the variable name is followed by other strings unrelated
    to the variable name.


    Let''s look at a simple case of using variables.


    In the next section, we will analyze a script to understand in depth about the
    complexities these variables offer.


    ## Script case analysis is as follows:


    Before starting the analysis, here is the script that we are going to use. You
    can change variable names or other values according to your own choice.


    ```bash

    #!/bin/bash

    localip=$(ifconfig | grep -eth0)

    mem=$(uptime | grep -m)

    cpu=$(uptime | grep -u)

    echo " The IP address is $localip"

    echo " The memory that cpu offers $mem"

    echo " The cpu name is $cpu"

    ```


    There are three variables defined in this script, all of which are the return
    results of commands, so the variable values may change every time the script is
    executed. However, no matter how the variable values change, the script can normally
    output these variable values at the end.


    The first variable, localip, stores the IP address of the native eth0 network
    card. Here, it is assumed that eth0 network card is in the system and the IP address
    is configured.


    The second variable, mem, stores the remaining capacity of local memory.


    The third variable, cpu, stores the average load of local CPU within 15min. tr
    and cut commands are used in the statements for obtaining these three variable
    values, and a space is quoted after tr -s, which is used to combine several consecutive
    spaces in the data transmitted by the pipeline into one space.


    If quotation marks are used after the -s option to refer to other characters,
    the effect is the same, and multiple specific characters can be combined into
    one character. Using the cut command can help us get the specific columns of data
    (specify the number of columns to be obtained by using the -f option), and set
    the separator with what character as the column using the -d option.


    ## SYSTEM VARIABLES


    The user-defined variables are introduced above, and then the system preset variables
    are known. System preset variables, as the name implies, are variables that have
    been preset by the system and can be used directly without the user''s own definition.


    The system default variables are basically in capital letters or some special
    symbols as variable names.


    Preset variables can be subdivided into environment variables, position variables,
    predefined variables and user-defined variables.


    When writing scripts, we can apply suitable variables in the right places, so
    we will not elaborate on them here. Write script cases and call these system preset
    variables to check the execution effect.


    ## WHY ARE SYSTEM VARIABLES NECESSARY?


    While custom variables can help us create programs that can help us define what
    needs to be done, the latter can help us create programs that use system environmental
    variables. System variables are used for details such as memory disk values, root
    partitioning and sometimes regarding minute system details as time, memory size
    and other values.


    Here are some of the most important system variables that are used so often.


    - a) UID

    This is a system variable that is used to display the ID of the user that is usually
    using the system now. If it is being used as the root system then the default
    value will be shown.


    - B) PWD

    This is a system variable that is used to create passwords for all kinds of file
    and networking systems in Linux. For example, we can use ''umask'' command to
    create passwords for a file system.


    - C) RANDOM

    This is a system variable that uses the random mechanism to display in the output
    as we wish. We can display numbers, text files or sometimes even a random path.
    All you need to do is call the RANDOM variable in the shell program.


    - D) PATH

    This is a system variable that is used to discuss about the current path that
    we are using. We can also select a path address and can display them using the
    ‘echo’ command for further reference.


    - E) LANG

    This is a system variable that can be used to print all the system commands that
    are present in different languages. For example, you can use FR to replace all
    the system commands written in English language to France. These system variables
    are especially recommended when you need to publish your shell program to different
    countries that don’t have English as a primary language.


    ## WHAT NEXT?


    With this, we have provided a brief introduction to variables. In the next chapter
    we will talk about filtering using the grep command. Follow along!

