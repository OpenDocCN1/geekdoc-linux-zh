    ## SHELL CURLY BRACE


    First, we will talk about curly braces and their importance in shell programming.
    Shell script supports seven types of extensions that are famously defined as curly
    brace expansion, tilde expansion, parameter and variable expansion, Command substitution,
    arithmetic expansion, word splitting and pathname expansion.


    This extension techniques are very useful when writing scripts. You can use curly
    braces to extend strings in Shell scripts. We can include a set of strings or
    string sequences separated by commas in a pair of curly braces to form a string
    extension.


    Note that the final output results are separated by spaces. When using this extension,
    curly braces cannot be quoted (single or double quotation marks), and the number
    of brackets must be even. A string sequence can be followed by an optional size
    integer, and the default value of this size is 1 or -1.


    When using curly brace extension, optional strings can be added before and after
    curly braces, and curly brace extension supports nesting.


    Here are examples:


    ```

    root@server : echo {a,g,h}

    // This is using curly braces

    ```


    ## TILDE EXPANSION


    This is one of the above mentioned extended functions of Shell and represents
    the home directory of the current user by default in the shell script. We can
    also use the tilde expansion with a valid account login name to return the home
    directory of a specific account.


    However, note that the account must be a valid account in the system. Tilde extension
    uses ~+ to indicate the current working directory, and ~- indicates the former
    directory.


    A working directory is determined with the following expansion.


    Here are some other commands:


    ```

    root@server : echo ~root

    root@server : echo ~+

    // displays the top directory

    ```


