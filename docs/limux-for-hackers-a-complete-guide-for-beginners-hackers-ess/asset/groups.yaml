    # 算术替换


    算术替换扩展可以执行算术计算并返回计算结果。算术替换扩展的格式为 `$(())`，也可以使用 `$[]` 的形式。


    算术扩展支持嵌套。书中会有专门介绍。这里再次通过一个简单的示例演示算术扩展的功能。


    这里是命令：


    ```bash

    root@server : k=3

    root@server : echo $((k++))

    // 这将输出 3

    root@server : k=3

