    these number partition naming schemes.


    /dev: This is the directory where all device files are stored.


    hd and sd: They are the first two letters of the partition and represent the device
    type in which the partition is located, where hd represents the IDE hard disk
    and sd represents the SCSI hard disk.


    a: It is the third letter of the partition name, indicating which device the partition
    is on.


    For example,/dev/hda represents the first IDE hard disk,/dev/sdb represents the
    second SCSI hard disk,/dev/sdd represents the fourth SCSI hard disk, and so on.


    +   2: This number partitions.


    The first 4 partitions (main or extended partition) under Linux are represented
    by numbers 1 ~ 4, logical partitions start from 5, and so on ~


    For example,/dev/hda2 represents the second primary or extended partition of the
    first IDE hard disk,/dev/sdb3 represents the third primary or extended partition
    of the second SCSI hard disk, and/dev/sdc6 represents the second logical partition
    of the third SCSI hard disk.


    # DUAL-SYSTEM WINDOWS + LINUX HARD DISK PARTITION SCHEME


    Many beginners who switch from Windows to like to install dual systems on their
    computers. This is also as dual booting in technical terms. This method is more
    dangerous for beginners of Linux and may cause the loss of hard disk data. Therefore,
    it is necessary to talk about how safely and effectively install the dual system
    of Linux + Windows coexistence.


    First of all, it should be understood that Linux and Windows are two completely
    different systems, so the file systems of Linux and Windows are also incompatible
    with each other. If you want to install Linux, you must "dedicate" a partition
    from the hard disk to Linux, and this dedication is not to empty the data under
    a certain drive letter, but to completely delete the disk from Windows.


    For example, if I want to give G disk space to Linux system, I need to completely
    delete D disk in disk management under Windows. The size of the space depends
    on the size of the installation package. Generally, 10GB of space can meet the
    requirements.'
