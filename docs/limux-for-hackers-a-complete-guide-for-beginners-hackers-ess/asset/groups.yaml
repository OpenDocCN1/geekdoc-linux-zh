    # SHELL PROPERTIES OF SHELL INTERPRETER AND INITIALIZATION OF COMMAND LINE TERMINAL


    Shell script need to be executed in command terminal, and command terminal often
    supports a large number of properties and functions, so setting the properties
    of shell interpreter and command terminal can provide the best environment for
    script execution.


    First of all, let''s look at the property setting and viewing method of Shell
    interpreter. At present, the Linux Mint operating system uses Bash interpreter
    by default, so we will mainly learn Bash''s internal commands set and shopt.


    With these two commands, you can view and set many features of Bash. Use the set
    -o and shopt commands to view all the attributes supported by their respective
    commands and whether they are turned on or not. Set command can turn on or off
    specific Bash attributes through options, shopt command can turn on or off some
    Bash attributes through -s and -u.


    We will demonstrate and explain these attributes one by one. The variables functions
    defined by Bash are local by default, and they can no longer be called and used
    after entering subprocess. Using set -a can make all variables functions be called
    by subprocess by default.


    By default, Bash supports brace replacement, so that we can use simple commands
    to quickly generate a data sequence, such as letter sequence table and number
    sequence table.


    The function can be turned on or off by using the "braceexpand" property. Sometimes
    it is necessary to set a set -e (error exit) at the beginning of the script. If
    we write a script, the main function of the script is to create an account, the
    account password, and finally output a prompt message.


    ```

    root@server : vim script.if

    set -e (error exit)

    ```


    When the account already exists or the account creation fails due to reasons,
    the default script will still insist on executing all the script commands.


    Obviously, there will be an avalanche prompt. There are many scripts like this,
    and the related scripts such as installing software, modifying configuration files,
    and starting services may cause large-scale errors in the whole script because
    of a small mistake in front. Setting set -e can stop the script when the first
    command goes wrong.


    ## WHAT IS HASH?


    "Hash" allows Bash to record the executed command PATH and save it in a memory
    hash table, so that the next time the command is executed, it is no longer necessary
    to search the command path through the path variable, which usually improves efficiency.


    But sometimes, the path of the program changes, because the existence of Hash
    records will lead to the failure of command execution. It can be seen that the
    external commands executed before have specific record information, and hits represents
    the number of hits, that is, the number of times that the system can locate the
    command path by reading the Hash table.


    ```

    root@server : hash sample.txt

    ```


    Usually there is no problem in the above situation. However, if we move the ip
    command from the /usr/bin/ directory to the /bin/ directory, the system still
    executes the command according to the location recorded in the Hash table, and
    the ip program cannot be found.


    ```

    root@server : hash -d

    root@server : hash -r

    ```


    We can use Hash -d to delete a certain record information, use Hash -r to clear
    the whole hash table, or use set +h to disable the hash table directly. These
    methods can solve similar problems. Hash can support calling with exclamation
    marks by setting the histexpand property.


    ```

    root@server : histexpand(!)

    ```


    Historical commands, as Yum can directly call the last command in history that
    starts with yum. By default, when we use redirection symbols such as > >>&, the
    file will be overwritten, which may lead to the loss of existing data.


    ```

    root@server : yum <history

    ```


    Setting noclobber can prevent data from being overwritten. If the scripts we use
    tools such as tar, rsync and mysqldump to back up the data, because the backup
    takes a certain amount of time, the scripts may be repeatedly executed, such as
    opening multiple command terminals to execute the same script repeatedly, or multiple
    remote connected users executing the same script, and finally the backed-up files
    are chaotic.


    ```

    root@server : no clobber tar

    ```


    For scripts like this, we can use the "noclobber" attribute of Bash to prevent
    the scripts from being executed. If the script wants to read the user''s input
    value as the script parameter through read or position variable, and the actual
    execution script does not assign value to the script, an unexpected error will
    occur at this time.


    ```

    root@server : unset

    // This will display error as it is not defined by default

    ```


    Opening the “unset” attribute of Bash can effectively prevent the error of undefined
    variables. Because the above script didn''t assign values to $1 and $2 and set
    -u, it quit the script directly after prompting that the variables were assigned.


    If “unset” attribute is not set, the operations of creating account and changing
    password will be executed and the wrong result will be returned.


    Advanced information about Hash Table: The function of Hash table has been introduced
    before. Under normal circumstances, the system will search the records in Hash
    table first when executing commands, and then execute commands according to the
    records in the table.


    However, according to the records in the Hash table, if the command cannot be
    found, an error will be reported. After we open the checkhash attribute through
    shopt, if the system cannot find the command according to the records in the hash
    table, we will continue to search the normal command path. Cmidhash attribute
    allows us to record a history that needs to be saved by multiple lines of commands
    into a record.


    ```

    root@server : cmdhash

    ```

