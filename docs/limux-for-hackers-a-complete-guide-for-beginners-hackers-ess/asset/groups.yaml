    # CHAPTER FIVE


    # LOGGING SYSTEM IN LINUX


    IN THE PREVIOUS chapter we talked about ways to make you secure and anonymous
    in the internet. As a hacker staying in the dark and stealing sensitive information
    is usually your main motto. As a fellow security enthusiast I would suggest you
    to maintain a good grasp about different logging systems in Linux distros to help
    you understand what is actually going in the system that you are trying to gain
    access. Also, deleting sensitive log files that can reveal your identity is also
    an important task for hackers to master. To help you understand different logging
    systems and daemons that make up the log files we have introduced this chapter
    with tons of examples. Follow along!


    # WHAT ARE LOG FILES?


    Log files are information about all the important events that occur in an operating
    system. Traditional operating systems like Windows and macOS doesn''t give access
    to log files unless you have special administrative privileges. Linux provides
    details about all the errors and warnings that exist in the system. Some log files
    are accessed even when there are no root privileges. However, all the log files
    that are created can be modified or deleted only if you have root privileges.


    # HOW LOG FILES CAN HELP HACKERS?


    Imagine log files as a path to your destination (Le your IP address / other sensitive
    information). Each time a new user gains access to the system the Linux system
    automatically registers all of its information and will connect only after this
    procedure. This security feature can be a nightmare to hackers because forensic
    enthusiasts can extract all the information / proxy addresses and can investigate
    further.


    To make sure that you are not to be tracked whenever you gain access to a system
    you should head over to the logs location and delete them permanently. Administrators
    can find that there are missing log files but can never know who did it. There
