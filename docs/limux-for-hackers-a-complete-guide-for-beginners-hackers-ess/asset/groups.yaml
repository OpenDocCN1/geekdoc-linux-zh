    # 如何编写一个简单的 Bash 脚本？


    如前所述，Bash 脚本可以用于与内核进行交互。它像一个解释器一样执行所编写的 shell 代码。Bash 和其他 shell 解释器的区别在于，它有自己的内置命令，这使得执行过程变得简单且耗时更短。


    为了更好地理解 Bash，请阅读这段代码：


    ```bash

    #! /bin/bash

    echo " This is a sample example"

    # This is a comment

    ```


    # 解析：


    上述可以在 Linux 计算机上执行的 bash shell 程序包含了 Bash 的三个重要概念，每个黑客都需要理解这些概念并在程序中实现它们。


    I) 首先，我们将讨论以 Shebang (`#!`) 符号开头的行。如果一个文本文件以 Shebang 命令开头，那么直接意味着该文件正在请求 Linux
    内核查找可以作为解释器运行此程序的系统文件。


    这里，提供了 `/bin/bash` 作为解释器位置。所以现在 Linux 知道上述文本文件需要作为 Bourne-again shell 运行。


    如果你想作为 Python 解释器运行程序，则需要输入如下所示命令。


    ```python

    #! /bin/python

    # This runs using the Python interpreter

    ```


    - ii) 在第二行中，我们使用 `echo` 在计算机屏幕上显示消息`Echo` 是一个 shell 内置程序，可以根据用户的意愿显示或打印信息。


    - iii) 第三行紧跟在 `#` 之后被称为注释（comment）。注释通常由程序员用来让其他人理解他们写了什么。然而，重要的是，注释中写的所有内容都将被
    bash 解释器忽略，以节省编译时间和系统资源。


    在下一节中，我们将了解如何在 Linux 机器上运行 Bash 程序。


    # 如何运行 Bash 脚本


    Linux 尊重用户隐私，并对运行可能损害系统的程序（如 bash 脚本）有严格限制。即使你是文件的所有者，如果没有某些调整，你被允许运行 bash 程序，这些调整将确认你已经意识到如果搞乱任何系统文件可能发生的风险。但这正是我们这些黑客要做的，不是吗？承担风险，搞乱系统并修复它们。


    每当你想在 Linux 操作系统运行任何脚本时，首先需要检查文件默认拥有的权限。


    使用以下命令：


    ```bash

    root@server : ls -l sample.sh

    # This shows all the permissions

    ```


    如果你不了解 Linux 系统中的权限，我们建议阅读本书的第二个模块，我们在那里详细介绍了 Linux 文件权限。


    上述命令将显示该文件所拥有的权限的输出。通常情况下，创建一个文件时，文件所有者将具有读 (r) 和写 (w) 权限，但没有执行 (x) 权限。要运行 bash
    脚本，我们需要执行权限，我们可以通过下面的命令来实现。


    ```bash

    root@server: chmod +x sample.sh

    # Now, the sample file gets the execute permissions

    ```


    你可以使用 `ls -l` 命令再次检查权限，以确认你的操作正确。检查完毕后，进入文件所在的目录并输入以下命令运行 bash 脚本。


    ```bash

    root@server : ./sample.sh

    ```


    在这里，`./` 表示只在当前目录下搜索指定的文件。这是一个良好的习惯，它减少了搜索时间，因此被所有 Linux 系统管理员建议在终端中运行 Bourne-again
    shell。


    当你运行时，计算机屏幕上将显示以下输出：


