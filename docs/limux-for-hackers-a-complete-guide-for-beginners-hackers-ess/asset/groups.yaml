    U 盘安装过程。


    # 额外赠：U 盘安装过程


    正如上一节所述，有多种方法可以在台式电脑、笔记本电脑，有时甚至是基于服务器的系统上安装 Linux。我们在上一节中讨论了使用 CD-ROM 文件的方法。在本节中，我们将讨论
    USB 安装程序，这目前已成为安装 Linux 的主流方式。请仔细跟随以了解更多信息。


    # U 盘安装过程


    如今大多数 PC 和服务器已不再配备 CD-ROM 驱动器，而是被 USB 接口设备取代。同时，USB 3.0 规范已广泛普及，U 盘的数据传输速度可以达到每秒千比特。根据您的需求，市场上上有从
    2GB 到 2TB 不等的数十种产品。


    由于这种安装程序的出现，现在有越来越多基于 USB 接口的应用程序，如 USB 键盘、USB 鼠标、USB 光驱等。在安装系统时，虽然可以使用 USB 光驱进行安装，但目前
    USB 光驱的成本相对较高，而通过 U 盘安装系统不仅成本低，而且快速方便。在大规模系统安装中，通过 U 盘已成为主流程序。


    通过 U 盘安装 Linux 系统的基本步骤如下：


    - 1) 首先，需要一个大约 8GB 的 U 盘。容量越大越好。如今 Linux Mint 的完整 ISO 镜像文件大小已达到 7GB。在决定制作 USB
    安装介质之前，请务必确认文件大小。


    - 2) 从开源网站 (http://mirrors.163.com) 下载 Linux Mint 的 ISO 文件。或者您可以直接访问 Linux Mint
    官方网站选择您偏好的磁盘镜像进行安装。


    - 3) 从互联网下载一个 U 盘刻录工具。常用的 U 盘刻录工具包括 UltraISO、USBWriter 和 Rufus。这里推荐使用 USBWriter，因为它易于使用，且可以一步刻录磁盘镜像文件。虽然
    UltraISO 也可以将 ISO 镜像刻录到 U 盘，但刻录的 U 盘在安装和启动过程中有时会出现问题。如果您使用 Windows 系统制作安装介质，我们强烈建议您使用
    Rufus 来刻录 U 盘，因为它更方便且是推荐的做法。


    - 4) USBWriter 是一个开源工具，可以从 http://sourceforge.net/projects/usbwriter/ 下载。它是一个专门用于
    Linux 系统的 U 盘刻录工具。


    它的工作原理是将 U 盘分为两个分区：一个 FAT32 分区（大小仅几 MB）用于安装启动程序，另一个 Linux 分区用于存储系统安装包。


    有时会出现一个已知问题：


    使用 USBWriter 刻录后，U 盘的容量会自动变小。这是因为只能看到一个 FAT32 分区，另一个 Linux 分区在 Windows 下是不可见的。但不用担心，很容易将
    U 盘恢复到原始大小。从互联网下载 Diskius 工具即可将 U 盘恢复到原始大小。


    - 5) 使用 USBWriter 将下载的 ISO 镜像文件刻录到 U 盘。首先选择 ISO 镜像文件的位置，并指定需要刻录的 U 盘（例如选择一个 16GB
    的 U 盘）。选中后点击“写入（Write）”按钮开始刻录过程。


    将 ISO 文件刻录到 U 盘后，U 盘上之前的所有数据将丢失，刻录前请备份 U 盘中的数据。


    - 6) U 盘刻录过程相对快，通常需要 10 到 30 分钟。如果刻录过程中没有错误，则刻录基本上就成功了。U 盘刻录完成后，将提示刻录成功。


    - 7) U 盘刻录成功后，你需要重新插入 U 盘。此时，在 Windows 磁盘管理器中，你可以看到 16GB 的 U 盘大小变成了约 6MB。


    - 8) U 盘刻录成功后，将 U 盘插入服务器的 USB 接口，然后进入 BIOS 设置从 USB 设备启动，然后重启系统进入提供更多选项的界面。


    - 9) 接下来的安装过程与我们之前介绍的光驱安装方法完全相同，因此将不再重复介绍。但需要注意的是磁盘分区阶段，你会看到两个磁盘。


    在完成（U 盘刻录）后，U 盘就就绪了，你可以用它在任何电脑上安装 Linux。


