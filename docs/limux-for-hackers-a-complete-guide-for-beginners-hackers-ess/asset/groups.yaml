    # DEVELOPMENT OF LINUX IN THE DESKTOP FIELD


    In recent years, especially in the technological market, the development trend
    of Linux desktop operating system is very rapid. The Linux desktop operating system
    launched by local system software vendors as the winning Red Flag Linux, Deepin
    Linux, has been widely used in the government, enterprises, OEM and other fields.


    In addition, SUSE and Ubuntu have also launched Linux-based desktop systems, especially
    Ubuntu Linux, which has accumulated a large number of community users. However,
    from the perspective of the overall functions and performance of the system, there
    is still a certain gap between the Linux desktop system and the Windows series,
    mainly in terms of ease of use, system management, software and hardware compatibility,
    and software richness. macOS is also popular among designers, creative professional
    in films and people who write books. Linux has a purpose and serve it well. So,
    do the other operating systems. As a hacker, it is mandatory to understand the
    importance of Linux as it may be hard to crack any system using windows and Mac
    software.


    In the next section, we will talk about the development of Linux in various fields
    using a set of examples. Follow along!


    # THE DEVELOPMENT OF LINUX IN THE MOBILE EMBEDDED FIELD


    Linux''s low cost, powerful customization features, and good portability have
    made Linux widely used in embedded systems. At present, Linux has been widely
    being used in mobile phones, tablet computers, routers, TVs, and electronic game
    consoles. The Android operating system widely used on mobile devices is created
    on top of the Linux kernel. At present, Android has become the world''s most popular
    smartphone operating system, crossing the much hyped iOS operating system. According
    to the latest statistics from authoritative departments in 2015, the global market
    share of Android operating system has reached 84.6%.


    In addition, Cisco has also used customized Linux in network firewalls and routers,
    and AWS Cloud has also developed a Linux-based operating system which can be used
    on smart phones, tablets and Internet TVs. Common digital video recorders, Stage
    lighting control systems are gradually adopting customized versions of Linux to
    achieve, and all this is by the power of Linux and open source. Linux is nowhere
    near to get extinct. It will readily spread across every corner in the world.


    # DEVELOPMENT OF LINUX IN THE FIELD OF CLOUD COMPUTING/BIG DATA


    The rapid development of the Internet industry has promoted the formation and
    rapid development of cloud computing and big data industries. As a platform based
    on open source software, Linux occupies the core advantage of cloud computing
    and big data.


    According to the Linux Foundation''s research, 86% of enterprises have used the
    Linux operating system to build cloud computing and big data platforms. At present,
    Linux has begun to replace UNIX as the most popular cloud computing and big data
    platform operating system.


    In the next chapter, we will provide details about different Linux distros to
    help readers choose the operating system of their choice. Choosing a Linux distro
    is always an overwhelming challenge. To know what is best for you, we suggest
    to experiment with different distros to find what you really like.


    There are so many Linux distributions that no one can give an accurate figure,
    but one thing is certain, Linux is becoming more and more popular. Faced with
    so many Linux distributions, beginners who plan to switch from other systems to
    Linux systems may be confused. Even loyal Linux users do not have the time and
    energy to try them one by one. Therefore, before beginners learn Linux, they need
    to have a clear direction. It is very important to choose a Linux system that
    suits them. The following next chapter is a classified introduction of Linux distributions.


    # CHAPTER TWO


    # CHOSING A LINUX DISTRO


    THE PREVIOUS CHAPTER has been a good introduction to the importance and philosophy
    of Linux as an operating system. There are many Linux distros at present and it
    can be an overwhelming task to select that one perfect distro. Even professionals
    struggle to maintain or use one distro consistently. As far as we say, using a
    Linux distro that perfectly supports your preferences is the best way. There may
    be popular ones but they will not please you until you know what you want.


    Here are some common Linux distributions:


    - Red Hat Linux


    Red Hat Linux is the earliest personal version of Linux released by Red Hat. Its
    1.0 version was released on November 3, 1994. Although its history is not as long
    as other famous Linux distributions, it has a much longer history than many newer
    Linux distributions.


    Since the release of Red Hat 9.0, Red Hat no longer develops desktop Linux distribution
    kits. Red Hat Linux has stopped development and concentrated all its efforts on
    the development of the server version, which is the Red Hat Enterprise Linux version.
    On April 30, 2004, Red Hat officially stopped supporting Red Hat 9.0 version,
    which marked the official end of desktop Red Hat Linux. The original desktop Red
    Hat Linux distribution was merged with Fedora from the open source community to
    become the Fedora Core distribution.


    Red Hat is currently divided into two series: Red Hat Enterprise Linux, which
    is provided by Red Hat with paid technical support and updates, and the free Fedora
    Core developed by the community.


    For who do we suggest this?


    To all better enterprises with a need for server administration, there is no distro
    that is better than Red Hat Linux.


    - Fedora Core


    Fedora Core (FC) is positioned by Red Hat as a testing platform for new technologies,
    and many new technologies will be tested in FC. If these new technologies are
    stable, Red Hat will consider these software joining Red Hat Linux.


    Fedora Core 1 was released in late 2003, and FC is positioned for a desktop user.
    FC provides the latest software package, and version cycle is very short, only
    6 months. Due to frequent version updates, performance and stability cannot be
    guaranteed and it is generally not recommended to use Fedora Core on the server.


    For users, Fedora is a free operating system with complete functions and rapid
    updates. Therefore, for personal applications, such as development and to experience
    new features, you can choose this release version.


    - Kali Linux


    As a hacker you need to be aware of the perfect Linux distro that exists for hackers.
    Previously, it is called Blacktrack and is maintained by a number of volunteers.
    What Kali Linux excels is providing tools that are essential for both hackers
    and forensic specialists in the same operating system.


    While nowadays it is true that Kali is being given competition with Parrot Linux,
    another famous Linux we still recommend beginners to use Kali Linux to begin their
    hacking career. Kali Linux is free to download and fully supports all open-source
    policies. If you need to be serious with hacking then it is obvious that you take
    advantage by using Kali as your main operating system.


    - CentOS


    The full name of CentOS is "Community Enterprise Operating System". It is compiled
    from the source code released by RHEL in accordance with the open source regulations.
    Since RHEL is a commercial product, all Red Hat logos must be changed to their
    own CentOS logo, which gave rise to the CentOS operating system.


    The difference between the two is that CentOS does not include closed source software.
    Therefore, CentOS can not only be used freely, but also enjoy the long-term free
    upgrade and update service provided by CentOS. This is a great advantage of CentOS.


    CentOS is built from the source code of RHEL. Its version number has two parts:
    a major version and a minor version. The major and minor version correspond to
    the major and update packages of RHEL respectively. For example, CentOS 6.5 is
    built on the 5th update of RHEL 6.0.


    However, since RHEL7.0 version, the CentOS naming format has changed slightly.
    The major version still corresponds to the major version of RHEL, and the minor
    version is subject to the release date of the RHEL update package.


    In 2014, CentOS announced its cooperation with Red Hat, but CentOS will continue
    to operate under the new committee and will not be affected by RHEL. This strategy
    indicates that the follow-up development of CentOS will be strongly supported
    by Red Hat.


    - SUSE Linux


    SUSE is the most famous Linux distribution in Germany and enjoys a high reputation,
    but its fate is quite rough now. On November 4, 2003, Novell announced the acquisition
    of SUSE. The acquisition was successfully completed, and Novell officially named
    SUSE as SUSE Linux. Novell''s acquisition of SUSE accelerated the development
    of SUSE Linux and changed the free SUSE Linux into an openSUSE community project.


    But in 2010, Attachmate acquired Novell. After being acquired, the development
    of SUSE Linux was blocked. And just 3 years later, SUSE changed ownership again.
    In September 2014, Attachmate was acquired by the listed company Micro Focus.
    Fortunately, SUSE officially announced that open source is the foundation of SUSE
    development and will continue to contribute to open source. SUSE still will fully
    support openSUSE.

