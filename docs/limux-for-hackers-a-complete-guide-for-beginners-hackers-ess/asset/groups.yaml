    # CHAPTER EIGHT


    ## IN-BUILT BASH COMMANDS


    IN THE PREVIOUS chapters we have talked about the building blocks of bash scripting
    language with few example programs and detailed explanations. In this bonus chapter
    we will be discussing some of the inbuilt commands Bash offers for us in Linux.
    You might be surprised because a lot of these commands are well known even for
    Linux beginners who have just started to learn about the wonders of it. Without
    wasting time let us start exploring now.


    ## WHAT ARE IN-BUILT COMMANDS?


    In-built commands are commands that come themselves while we install the software
    or shell interface. For example, when we install a Python interpreter we can run
    the ‘py’ command in the shell. To say in other words, ‘py’ is an inbuilt command
    that comes because of installing Python.


    Just like that, bash also comes with these commands and some of them are extensively
    used by the Linux operating system because of its efficiency in communicating
    with the kernel resources.


    Some of the famous commands:


    ### I) echo


    We already discussed about this command and also used in some of our programs.
    Echo command is like the ‘print’ command in programming languages. All it it does
    is to display the output on the screen. It can take variable or function instances
    with the help of ‘$’ symbol.


    Here is an example :


    ```

    Echo “This can display output on computer screen"

    ```


    # Output:


    This can display output on computer screen


    ### ii) cd


    This is one of the famous Linux commands that is developed by bash. All de it
    is to change the directory of the user in the terminal. You many need to change
    the directories while performing executions because some may run only in the current
    directory.


    Here is an example:


    ```

    Cd /bin/home

    ```


    After you execute the above command in the shell interface you will be in that
    particular directory. You can now use ls to check all the files in the current
    directory.


    ### iii) pwd


    Also remember that you can also find information about the current directory you
    are in using the pwd command


    Here is a command :


    ```

    root@ server : pwd

    ```


    This will give an output with a bunch of information about the directory you are
    in along with with number of files and the location of the directory.


    ### iv) Process management commands


    We all know that in Linux everything run as processes. There are background and
    foreground processes that improves the accuracy of the system configurations that
    are available. Bash has some in-built commands that can help users better organize
    the processes that are available or processes that are just created.


    ### A) bg


    This built-in command that makes the software or process that you are trying to
    start to run in background instead of being in foreground and consuming the system
    resources.


    Here is an example :


    ```

    root@server : bg vmware

    // This starts the software in background

    ```


    As a hacker you need to be aware which software are running in the background
    as anti virus software work as background processes. Also, when you plant an exploit
    in the target system you need to make sure that it will not be found out by the
    system administrator.


    ### B) exec


    This is a built in bash command that starts a software as a new process. Sometimes
    even when a software or utility is opened you can use this command to open a new
    instance of the software.


    Here is the command :


    ```

    root@server : exec vmware config

    // This starts the config file of Vmware software as a new process

    ```


    You can confirm whether or not a new process had been created the following command


    ```

    root@server : pid

    ```


    Check for vmware in this using the grep command to see two processes running in
    the same time


    ### C) wait


    Usually processes are started automatically and are ended whenever they are feasible
    for the system resources. Sometimes processes even get stuck and end before they
    need to. Sometimes, you can force wait the software to wait for process to be
    completed using the wait command


    Here is an example :


    ```

    root@server : wait vmware

    ```


    ### V) umask


    This in-built command is used to change the default permissions that are already
    present. We can usually use chmod to give execute permissions but umask is much
    more complex and can be used to perform complex changes whenever needed.


    Here is a command :


    ```

    root@server : umask 777 bash.sh

    // This makes the files as executable even though by default it has just read
    and write permissions.

    ```


    ### Vi) In built command for variables


    Variables are memory locations that are used by programming languages to point
    to the memory address of computer. They are simple and are needed for the efficient
    functioning of scripts. Bash provides two simple commands for tweaking their possibilities.


    ### A) read-only


    This bash command make the variable not change . Usually variables are temporary
    but when they are given this particular bash command their values cannot be changed.


    Here is a command :


    ```

    readonly first

    ```


    ### B) export


    Also, whenever you create variables or functions in computer programs or in scripting
    files they cannot be used by other files. Only way to use these components in
    other files is by using the export command that is available.


    Here is a command :


    ```

    export first

    ```


