    Linux provides many useful tools for developers to debug and evaluate server programs.
    Skilled network programmers will constantly use one or more of these tools to
    monitor server behavior in the whole process of developing server programs.


    Some of these tools are common for hackers.


    This chapter will discuss some of the most commonly used tools: tcpdump, nc, trace,
    lsof, netstat, vmstat, ifstat and mpstat. These tools support many options, but
    our discussion is limited to the most common and practical ones. Also, remember
