    Sometimes, in Linux system, we need to complete a complex task, but a certain
    command may not be able to complete this task. At this time, we need to combine
    two or more commands together to complete such a task.


    As said from the Linux documentation, similar to the pipeline for transporting
    water, the pipeline of Linux system can store the output result (data) of command
    1 into the pipeline, and then let command 2 read the data from the pipeline and
    further process the data.


    In the next section, we will talk about the advanced abilities of giving output
    and input to the functions that are available.


    ## a) who


    The who command can help us check which accounts log in to the computer at what
    time. However, when there is a lot of login information on the computer, it is
    inconvenient to record the number of logins manually.


    The wc command in Linux system can count the number of rows, but the wc command
    needs data. If you give several rows of data, this command can automatically count
    the number of rows of data. We can use pipelines to combine who and wc commands.


    ```

    root@server : who

    ```


