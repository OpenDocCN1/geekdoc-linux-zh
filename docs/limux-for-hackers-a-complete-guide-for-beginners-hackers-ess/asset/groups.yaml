    # WHAT IS OBJECT ORIENTED PROGRAMMING ?


    Object oriented programming is a programming paradigm that is developed much later
    after the invention of functional and procedural programming. functional and procedural
    programming, methods are created and used whenever needed to complete tasks. In
    object oriented programming we used classes and objects to complete these tasks.


    We are not arguing that Object oriented programming is the best because every
    paradigm has its ups and downs. The success of Object oriented programming is
    mainly due to its simplicity and a logical way to create classes that can be used
    in much larger projects. This is the reason why OOP languages such as Java and
    C++ are used extensively in enterprises and businesses.


    # WHAT ARE OBJECT ORIENTED OBJECT AND CLASSES?


    In simple words, Objects are programming entities that are created to replicate
    real world things. In real world, things have properties and perform methods.
    The same way, in OOP model objects replicate these properties and methods.


    Classes are the collection of objects in a sense that can help us understand its
    importance. Classes may not be sequential but consist of a group of objects that
    are similar and thus easy to implement in any project.


    A real world example:


    Imagine boats in the real world. They are things and thus satisfy as objects in
    the programming world. They have engine, deck and color which are called as attributes.
    These are also known as properties and are usually represented by variables and
    constant modifiers in the programming implementation.


    On the other hand, we can use these attributes to create methods. For example,
    boat can drive, accelerate and lift weights using these attributes that are present.
    Without attribute you cannot perfectly explain the method and without methods
    attributes have no use.


    In syntactic terms, properties are destined to be adjective that valuate the noun
    that is an object. All the methods are called as verbs that do a work in general.


    When we collect different type of boat objects and group them then these are called
    classes. We can also create sub classes with more concrete evaluation to create
    more efficient programs.


    In python :


    ```

    class car

