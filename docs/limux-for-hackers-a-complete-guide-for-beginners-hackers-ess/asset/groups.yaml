  mdcn: '

    有时在 Linux 系统中，我们需要完成一项复杂的任务，但某个命令可能无法完成该任务。此时，我们需要将两个或多个命令结合在一起来完成此类任务。


    正如 Linux 文档所述，类似于输送水的管道，Linux 系统的管道可以将命令 1 的输出结果（数据）存储到管道中，然后让命令 2 从管道中读取数据并进一步处理。


    在下一节中，我们将讨论关于向可用函数提供输出和输入的高级能力。


    ## a) who


    `who` 命令可以帮助我们检查哪些账户在什么时候登录了计算机。然而，当计算机上有大量的登录信息时，手动记录登录次数是不方便的。


    Linux 系统中的 `wc` 命令可以统计行数，但 `wc` 命令需要数据。如果你提供几行数据，该命令会自动统计数据的行数。我们可以使用管道将 `who`
    和 `wc` 命令结合。


    ```

    root@server : who

    ```


    ## b) ss


    另一个例子是 `ss` 命令可以查看 Linux 系统所有服务监听的端口列表。然而，`ss` 命令本身没有灵活的过滤功能，而 `grep` 命令具有强大且灵活的过滤功能，因此这两个命令可以通过管道结合使用。显然，有很多数据没有经过
    `grep` 命令的过滤，这不够清晰。


    在 `ss` 命令将其输出数据存储到管道后，`grep` 命令再次从管道中读取数据，并过滤出包含 `sshd` 的许多数据，最终的输出结果只有两行数据。


    ```

    root@server : ss

    ```


    ## 结论...


    通过这种方式，我们可以更简单、更清晰地看到我们需要的数据。某些命令是特殊的，例如我们之前使用的 `passwd` 命令，它用于修改系统账户密码，但该命令默认只能从键盘读取密码。


    如果你想让命令从管道中读取数据并将其作为密码，你需要使用 `--stdin` 选项。所示，`echo` 命令默认会在屏幕上显示输出结果。在建立管道后，`echo`
    命令可以将输出的 `123456` 存储在管道中，而 `passwd` 则可以从管道中读取 `123456` 来修改系统账户 ''sample'' 的密码。


    在模块的下一节中，我们将讨论与 Shell 脚本中输入输出语句相关的高级主题。请继续阅读！


    ## 第三章：在 Shell 中重定向输入和输出


    在上一章中，我们对 Shell 脚本中输入输出语句的重要性及其实现进行了很好的介绍。在本章中，我们将通过大量的示例讨论高级专家细节，例如输入输出语句的重定向。请继续阅读！


    ## 为什么重定向在 Shell 中很重要？


    在大多数系统中，输出信息通常默认显示在屏幕上，而标准输入信息通过键盘获取。


    然而，在编写脚本时，我们不能或不想让某些命令的输出信息显示在屏幕上（当执行脚本时，大量的输出信息会让用户感到困惑）。它还消耗了比需要的系统资源。


    此时由于这个原因，最好将输出信息临时写入文件，然后在以后需要时读取文件并提取所需的信息。默认的标准输入信息也存在类似的问题。当我们使用 `mail` 命令在
    Linux 系统发送邮件时，程序需要读取邮件的文本。


    默认情况下，来自键盘的输入数据被用文本，会导致脚本进入交互模式，因为读取键盘信息需要手动输入。


    例如，如果此时可以更改默认输入模式，不再从键盘读取数据，而是从预先准备的文件读取数据，这样邮件程序就可以在需要时自动读取文件内容并自动发送邮件，而无需手动交互。通过这样，脚本的自动化效果将带来更好的体验。


    ## Linux 系统中的输出


    在 Linux 系统中，输出可以分为标准输出和标准错误输出。标准输出的文件描述符是 1，标准错误输出的文件描述符是 2。而输入文件描述符为0。


    如果你想更改输出信息的方向，可以使用 `>` 或 `>>` 符号将输出信息重定向到文件。使用 `1>` 将标准输出信息重定向到文件（1 可以省略不写，默认值为
    1），或使用 `2>>` 将错误输出信息重定向到文件。


    使用 `>>` 符号将输出信息重定向到文件。如果文件不存在，系统会自动创建文件。如果文件已存在，系统会将输出信息追加到文件原始信息的末尾。


    在接下来的示例中，`echo` 命令本会在屏幕上显示数据，但使用了重定向，输出信息可以导出到文件中。


    ```

    root@server : echo "This is a sample" > sample.txt

    // 这将文件导出到名为 sample 的文本文件中

    ```


    之前的 `echo` 命令不会给出错误信息。然而，当使用 `ls` 命令时，最终输出信息根据文件是否存在被分为标准输出和错误输出。此时，如果我们只使用 `>`
    或 `>>`，我们就无法将错误信息重定向并导出到文件中。


    这里我们需要使用 `2>` 或 `2>>` 来重定向错误输出。


    如果我们想将标准输出和错误输出都重定向到同一个文件，可以使用 `2>&1`。例如，`ls /root > file 2>&1` 将标准输出和错误输出都重定向到
    `file`。


    如果我们想将标准输出重定向到一个文件，将错误输出重定向到另一个文件，可以使用 `>` 和 `2>`。例如，`ls /root > file1 2> file2`
    将标准输出重定向到 `file1`，错误输出重定向到 `file2`。


    如果我们想将输出追加到文件，可以使用 `>>` 和 `>>1`。例如，`ls /root >> file 2>>1` 将标准输出和错误输出都追加到 `file`。


    如果我们想丢弃命令的输出，可以将其重定向到 `/dev/null`。例如，`ls /root > /dev/null` 将丢弃标准输出，而 `ls /root
    2> /dev/null` 将丢弃错误输出。


