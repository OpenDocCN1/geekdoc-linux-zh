    For hackers, a lot of scripts that automate certain things are usually uploaded
    by hackers for the community. A lot of key logger tools and monitor tools are
    also uploaded by the open-source community.


    If you are a beginner and are trying to use code for your exploitation techniques
    then it makes sense that you need to clone that repository into your Linux system.
    To make that possible, use the below mentioned commands.


    ```bash

    root@server : apt-get install git


    // This installs the git supported system in your Linux system

    root@server : git clone https://github.com/enterurlhere


    // This clones your desired repository into the Linux system

    ```


    With this, we have completed a brief introduction to installing, updating and
    removing software using package managers in Linux. You can also install software
    in Linux using the executable .deb files after giving necessary permissions. In
    the next chapter, we will learn about process management that is said to be a
    necessary skill for hackers who are using kali linux for exploitation purposes.
    Follow along!


    # CHAPTER TWO


    # PROCESS MANAGEMENT IN LINUX


    AFTER HAVING a thorough understanding about the installation philosophy and Linux
    uses, you are now all set to enter into a new Linux arena which helps you ignite
    much more significant thoughts as a hacker. Linux uses processes to maintain and
    interact all its components with Linux kernel. If there are no process running
    then we can confidently say that the Linux system has shut down. As a hacker,
    understanding processes, manipulating them and ending them whenever necessary
    is a blessing skill. In this chapter, we will not provide basics about processes
    in Linux but will also provide examples that can help you understand the foundations
    of Linux more concretely. Follow along!


    # WHAT ARE PROCESSES?


    Processes are what Linux programs run. They are a representation that the software/command
    line utility is interacting with system resources as Linux kernel to do what it
    is ought to. Every software that is running in Linux has a process and if we end
    the process manually the software will stop working.


    As a hacker, when you access to a system, you will be easily monitored by the
    anti virus processes that are running in the Linux system. To make them stop sending
    your logs to the system administrator, you may need to end their processes manually.


    While it may seem simplistic to end processes like Task manager using windows
    this can have some serious consequences if done wrong. You need to have a practical
    experience and a good theoretical understanding of process management to achieve
    your wishes.


    In the coming sections you will be learning some tips to find and manage processes
    along with a way to automate them according to your convenience.


    # HOW TO VIEW PROCESSES?


    Whenever a Linux system boots up, some processes will start opening automatically.
    Every time when you open a terminal or a web browser, their respective processes
    will be opened. When you close some, of the processes will be automatically shut
    down while others will be running in the background consuming your system resources.


    Here is the command for viewing processes:


    ```bash

    root@server : ps

    // This displays all the processes that are running in the Linux system

    ```


    Here is a sample output:


    ```

    PID

    45637

    // The numbers are the identification for a process

    ```


    If you want to make any changes to a particular process, then you should note
    down the process number. The output information will show other information as
    the process name, time and the type of command it is using. If you opened the
    process from a terminal, then the bash cmd will appear in the output information.


    Note:

    Finding processes is sometimes an overwhelming task because you need to search
    from tens of processes that are running. Always make sure that you are confident
    before changing the process status. If you by any mean the system processes that
    are running your Linux system may stop responding until the next reboot.


    # HOW TO DISPLAY ADDITIONAL INFORMATION?


    Usually by using the ps command, you can only get basic information. You can display
    additional information about processes using the aux command. Let us check it
    with an example.


    ```bash

    root@server : ps aux

    // This prints an output that describes a lot of information about a process

    ```


    Here is a sample output:


    ```

    PID - 2134 %CPU -2.3%MEM - 32% Start Time - 22:34

    // It displays additional information such as the memory and CPU power it is consuming.
    It also displays start time to easily estimate the process name

    ```


    The aux command also describes about the instance that started the process. This
    is essential for forensic investigators because they can easily track the origin
    point of the attack using this procedure.


    # HOW TO FILTER PROCESSES?


    Imagine that you are starting to find a process that you badly need to stop but
    can''t easily find it because there is a lot of other processes that are displayed
    on the output screen. If you are smart, you would find a way to filter the process
    you need instead of manually going through all the processes to find the one you
    want.


    If you are looking to be smart, Linux is there for you. Linux specifically provides
    functionalities to filter processes using the grep command. Here is an example
    for your understanding.


    ```bash

    root@server : burp suite

    // First start a process or any software that you like using the default command

    root@server : ps aux | grep burpsuite

    ```


    ```bash

    // Now use this command to filter the process that starts by using the "burp suite"
    command

    ```


    This will display an output like we have shown before with all the information
    that one needs to understand about the process.


    # HOW TO FIND PROBLEMATIC PROCESSES?


    Before describing greedy processes, we should talk about a scenario that have
    become popular these days especially in the windows systems.


    A lot of spammers and hackers are now nowadays including mining programs in applications
    to install your system. When you willingly or by any other reason install it,
    your computer will become very slow and will not function normally.


    # Why does this happen?


    Because, the mining program forcefully uses all the system resources and will
    run in background. A normal user can''t observe it because its hidden. Only professional
    who can access the terminal can analyze that there is malware in operating system.
    As system administrator you should be aware of killing greedy process.


    # HOW TO FIND TOP PROCESSES?


    To find top processes all you need to do is to enter the following command as
    root user.


    ```bash

    root@server : top

    // This will display an information that is allocated with maximum resources

    ```


    If you feel that any of these top processes are not necessary for your system,
    you can end them with the kill command which we will be discussing in the coming
    section.


    # HOW TO PRIORITISE PROCESSES IN LINUX?


    In a linux system with a ton of processes running as an ethical hacker or as a
    system administrator it is always recommended to prioritize your processes using
    the nice command.


    # Why should you prioritize?


    If you are an individual user then prioritizing may not seem intelligent because
    you have all the resources you need. But imagine if you are in an enterprise and
    are using the server resources that linux is maintained with other users then
    it is impossible to use all the system resources for yourself. If you do it, your
    system administrator may find out and can temporarily block your access.


    A lot of newbie hackers they crack a system attack all the resources at once notifying
    sysadmins and shutting down all the access to the system. If you are a smart hacker
    you will carefully prioritize the processes without gathering much attention and
    when you get all the sensitive information you need then kill the process and
    remove all the logs so that there won''t be any footprints left for the forensic
    investigators.


    # WHAT DOES NICE COMMAND EXACTLY DO?


    nice is a linux utility command that is developed to give score to a process according
    to its importance. The priority number can be customized but they usually range
    from -19 to +19. In here, 0 is the neutral range whereas -19 is used to determine
    the weakest preferred process whereas +19 is used to determine the most preferred
    process.


    ```bash

    root@server: nice -n 5 /bin/terminal

    // This is a process with priority 5

    root@server: nice -n 10 /bin/game

    ```

