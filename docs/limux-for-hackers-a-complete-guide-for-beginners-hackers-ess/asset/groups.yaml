    ## PATH REPLACEMENT


    Path replacement is also a famous shell functionality. Unless set -f is used to
    disable path replacement, Bash will search for \*, ?, and symbols. If these symbols
    are found, the pattern matching is replaced.


    The Shell processes the path or file after the path replacement when processing
    commands. If the nocaseglob option is turned on when using the shopt command,
    bash is case-insensitive when performing pattern matching, and it is case-sensitive
    by default.


    In addition, you can turn on the extglob option when you use the shopt command,
    which allows Bash to support extended wildcards. The -s option of shopt command
    can turn on specific Shell properties, and the -u option can turn off specific
    Shell properties.


    With regard to the path or file name, you cannot only use Bash''s automatic path
    extension function, but also use two external commands, basename and dirname,
    and intercept the contents of the path or file name in a path.


    When using the ls or find command to list files, it is always with a path by default,
    but sometimes we need the file name, so we can use basename to extract the file
    name.


    Here are the commands :


    ```

    root@server : shopt naseglob

    root@server : basename sample.txt

    ```


