    ## CHAPTER FIVE

    ## BURPSITE FOR PENETRATION TESTING


    IN THE PREVIOUS chapters we have talked about network monitoring tools that can
    help us to understand different network modules that are present in the target
    system. While Network hacking is a popular hacking procedures until few years
    back now due to the increase of internet and web applications we are now on a
    verge of getting stolen just by browsers.


    ## WHAT ARE WEB APPLICATIONS?


    Web applications are software that run in a browser and can be accessed by just
    an URL. For example we.gmail.com is a web application that can be used to send
    messages in an Email across the world to whoever has an Email address.


    It is very easy to find bugs in a web application for experienced programmers.
    For finding these bugs they use certain software like Burp suite. Burp suite is
    at this point the most popular web application vulnerability finder software.
    It comes in both community and professional versions. Community version is free
    and will not provide automatic whereas professional version is available for a
    nominal price and provides automatic spidering and scanning of targets with documentation
    availability for enterprises. Burp-suite also has a plugin store that consists
    of tons of free and premium add-ons to make web application penetration tester
    life much easier.


    ## HOW TO USE BURPSUITE?


    To install Burp-suite head on to the official website and install it after giving
    permission using the chmod command.


    If you are using Kali Linux then you are lucky because burp community edition
    is pre installed in this hacking distro. Open Burp-suite from the “ Web application’
    Menu bar in the start menu.


    After opening Burp-suite follow these instructions:


    - 1) Use the proxy options and enter ‘127.0.0.1” in both Firefox and burp suite
    as host address. By doing this procedure all the HTTP requests that are coming
    from the browser will be sent to burp suite.

    - 2) You can also be to run HTTPS protocol requests using the certificate that
    is present from the port swigger security website.

    - 3) After receiving requests you need to enter “ Accept’ or “ Reject” to send
    it to the Burp spying. You can also enter the url to make burp spiders the whole
    website. However be realistic when the websites are scanned because you will not
    get fascinating results with the scanners. To find vulnerabilities you need to
    a much harder digging and a lot of testing.

    - 4) Burp-suite also has other interfaces as Burp suite intruder, Burp suite comparer
    to automate brute force attacks and analyzing cookie information.

    - 5) Burp-suite also provides a documentation panel where you can write POC for
    the bugs that you have found.


    In the next section, we will provide a detail instruction to hack online web page
    passwords using the Burp intruder option available in Burp-suite. We want you
    to carefully follow the exercise to understand how to crack accounts of any website
    you like. It is tricky sometimes but if done correctly you can have some fruitful
    results.


    Burp intruder is an important component in the Burp suite software. Using intruder
    you can individually send a request to brute force it with available dictionaries
    and options. Intruder can send both GET and POST requests and can easily be used
    to analyze the results it.


    Using intruder security analysts often understand how well the intrusion detection
    systems are. A lot of other web penetration bugs such as XSS and CSRF attacks
    can also be detected using the Burp intruder component.


    ## How to use it?


    Step 1:


    Find a webpage that you want to crack. It can be either HTTP or HTTPS supported
    website. If you are not sure about the attacking restrictions the website is imposing
    we suggest you to try with sample test websites that are developed specifically
    for the practice of web application penetration testers.


    Step 2:


    Enter the webpage with burp intercept proxy in On. Within seconds you will get
    a request in the Burp interface. Just take a look at it and accept all the requests
    that appear. If you deny any requests sometimes the web may not open properly.
    So, make sure that the webpage has appeared in the Burp site menu.


    Step 3:


    Now carefully observe all requests the burp inspector has. In those requests find
    out the requests that have a “POST” identifier. Normally, all the requests will
    have “GET” identifier because they are asking certain information from the server.
    Whereas login pages and other sensitive boxes use “POST” identifier as they are
    sending information to the server.


    Step 4:


    After finding the login form that you are wishing to brute force left on a menu
    will appear. In burp menu click on “ Send to intruder”. Now you can go to intruder
    interface to see that the selected page is all ready to perform ( dictionary )
    attack.


    Step 5:


    Now, select the parameters using the HTML code that appears in the bottom box.
    This is where you select the “login” and “password” boxes for easy attacking.
    After selecting the options menu and select the type of dictionary that you are
    willing to use.


    From numbers to common passwords there are tens of options for you to consider.
    You can also upload your custom wordlist in professional version of Burp-suite.
    Also don’t forget to select the type of brute force attack you are willing to
    perform. I normally use “pitchfork” as it is simple and easy.


    Step 6:


    Now click start and within seconds the requests will start flooding your results
    screen. After the brute force carefully observe the results. All the results with
    "404" errors are bad results. If you get any successful messages then they are
    potentially good results. Cross check the good results and make a documentation
    about the attack scenario.


    With this, we have provided a clear cut instruction to Burp suite along with various
    important information.


    ## WHAT NEXT?


    Congratulations! You have now successfully completed the last module of this book.
    In these five modules you have learned a lot of new information that can help
    you to become an efficient hacker.


    To make use of the knowledge you have acquired please write your own shell and
    python scripts that can automated brute forcing. Also, read tons of open-source
    code from Github so that you can challenge yourself with complexities that may
    arise while dealing with catastrophic situations as an ethical hacker.


    Finally, a friendly suggestion. We are not here to talk about ethics. Do whatever
    it makes you happy. But it genuinely feels better to stop destroying things instead
    of destroying thing. Cheers and All the Best!

