    # 第一章

    ## 在 Linux 中安装软件和软件包


    与所有操作系统一样，安装软件也是 Linux 的一个必用用例。Linux 使用了组织良好的包管理系统，并在操作正确的情况下，以一种更完美的方式安装软件。初次处理
    Linux 软件的安装和更新时，可能会感到有些复杂，但随着时间的推移，你会发现 Linux 的安装哲学是非常有条理且易于的。作为一名黑客，理解并找到简单的软件安装方法至关重要，以防破坏系统。即使你是在使用
    Live USB 进行黑客攻击，理解 Linux 中包的安装工作原理也是至关重要的。


    为了帮助你理解这些概念，我们在本章中提供了各种用例和示例。请跟随我们一起！


    ## 它与 Windows 有何不同？


    与 Linux 相比，Windows 的安装程序可能看起来很直观，但事实并非如此。Windows 安装文件巨大，因为它们创建了一个沙箱来包含软件在不同实例调用的所有
    API。这导致安装文件变大，并可能在以后引起延迟问题。


    然而，Linux 使用不同的方法来安装文件。它使用紧密封装且独立的软件包，并由它们自己的实例进行更新。这有时可能会引起问题，但大多数时候它运行得非常完美。


    ## 如何在 Linux Mint 中安装软件？


    众所，Mint 是一个基于 Debian 的轻量级系统，甚至可以在低端系统上运行。不同的 Linux 发行版使用不同的包管理器。例如，Arch Linux
    作为一个开发者喜爱的 Linux 发行版，使用 Pacman 来安装软件。


    所有基于 Debian 的系统基本上都使用“apt”来安装软件。Apt 是一个简单的包管理器，它紧密集成了所有组件，并使用脚本文件中提供的指令将它们安装到
    Linux 中。


    ### 它是如何工作的？


    当调用一个软件时，首先下载第一个脚本文件，然后包管理器将分析系统正常运行所需的所有组件。如果系统已经安装了某个组件，它将跳过到下一个进行下载。在安装所有组件后，软件将在几秒钟被打包并安装到
    Linux 系统中。


    这是一个命令：


    ```

    apt-get install python

    // 这将 Python 下载到 Linux 系统中

    ```


    ## 如何搜索软件包？


    Apt 几乎提供了 Linux 爱好者和开发者青睐的所有著名软件包。然而，由于兼容性原因，有很多第三方软件包可能无法使用。


    如果你正尝试下载一个软件包，且你不确定该软件包是否存在于包管理器中，你可以使用搜索命令来找到它。如果你没有针对包名得到任何准确的结果，那么显而易见 apt
    不支持你的软件包。


    这是一个命令：


    ```

    root@server : apt-cache search Python4

    // 这将搜索 apt 仓库并在命令行中显示“no results”

    ```


    为了获得更准确的结果，请使用 apt 仓库的网页版本，那里所有可用软件包甚至根据类别进行了排序。


    如果你正在使用 Arch Linux，Pacman 也提供了搜索选项，在下载和安装软件包之前进行检查。


    ## 如何删除软件？


    从操作系统中删除软件与将软件安装到系统中同样重要。


    你可能会疑惑，为什么删除一个对你的 Linux 系统没有造成任何损害的软件是重要的？但请听专家的建议，因为过时的空闲软件可能会与新安装的软件发生冲突。


    如果 Linux 系统中存在潜在冲突，可能会导致整个操作系统崩溃。删除不需要的软件可以提高系统性能，并帮助用户将那些浪费的内存资源分配给更有价值的事物。


    伦理黑客也应该理解如何删除软件，因为当他们检测到攻击者为了劫持系统而插入任何木马或爬虫时，他们应该能够尽快从系统中清除痕迹。某些高风险木马在你不手动找到并结束其进程之前是不会删除的。如果黑客使用潜在危险的方法来实现软件，那么删除软件将非常困难。


    现在，我们将学习使用像 apt 这样的包管理器来删除软件。


    是一些命令：


    ```

    apt-get remove python

    // 这将删除 python

    ```


    '
