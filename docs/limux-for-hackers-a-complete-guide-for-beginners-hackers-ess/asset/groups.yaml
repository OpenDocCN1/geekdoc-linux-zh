    Windows 上的 FAT 文件系统，而 swap 是 Linux 上的交换分区。BIOS boot 主要用于系统启动设备，是一个非常小的分区，而 xfs
    系统是一种出现在 RHEL/CentOS 7.x 上的高性能文件系统。


    “标签（Label）”选项是对应磁盘分区的标签，通过它可以快速识别分区。标签选项可以填写内容，也可以不填写，默认留白。


