    To not be a prey to multi national madness we suggest you to use encrypted mail
    services such as Proton mail. They work as good as famous Email providers like
    Gmail. Also, you will be completely secured and not become prey to any phishing
    or spam mails because of their advanced filtering features.


    # WHAT NEXT?


    With this, we have given a complete introduction to the security concerns that
    a beginner Linux user can have. As a hacker you need to constantly delete your
    logs and cookies to not being tracked by the Network providers or internet gains.
    With this sufficient knowledge you are now set to learn about Logging system in
    Linux. This is the final chapter of this module and can give us a good clarity
    about an important expertise that all hacker should master. Let us jump into right
