    of the tool. To further know and experiment with the tool we first suggest you
    to


    ## TCPDUMP


    Tcpdump is a classic network capture tool. Even today, we have a package grabbing
    tool like Wireshark which is easier to use and master, and tcpdump is still a
    necessary tool for network programmers. Tcpdump provides users with a large number
    of options to filter data packets or customize the output format.


    Before learning more tcpdump we suggest you to understand about the essence of
    network packets and how they are tracked using tools such as Wireshark. If you
    are an efficient hacker it is also important to learn a bit about sniffing networks
    to collect sensitive information from the data that is being collected.


    We introduced a lot of different hacking tools in this chapter, and now we summarize
    the common options with examples for your better understanding of the wonders
    this tool can do.


    In 4.0 and earlier versions, the default capture length was 68 bytes. This is
    enough for protocols as IP, TCP and UDP, but for protocols such as DNS and NFS,
    68 bytes usually cannot hold a complete data packet.


    For example, when we grab DNS packets, we use the -s option (the version of tcpdump
    on the test machine is 4.0).


    ```

    root@server : tcpdump -s 192.132.112.11

    ```


    However, in the version after 4.0, the default capture length was changed to 65535
    bytes, so we don''t have to worry about the capture length. -s, the serial number
    of TCP segment is displayed as absolute value, not relative value. -w, directs
    the output of tcpdump to a file in a special format. And -r will read the packet
    information from the file and display it.


    In addition to using options, tcpdump also supports expressions to further filter
    packets. Operands of tcpdump expressions are divided into three types: type, direction
    and protocol. The following are introduced in turn in this section. Type will
    explain the meaning of the parameter immediately following it. All the types supported
    by tcpdump include host, net, and portrange.


    They specify host name (or IP address), network address expressed by CIDR method,
    port number and port range respectively. For example, to grab data packets on
    the whole 1.2.7.0/255.253.231.0 network, you can use the following command.


    ```

    root@server : $ tcpdump net 1.2.7.0/13

    ```


    Here, src specifies the sender of data packets, and dst specifies the destination
    of data packets.


    For example, to grab packets entering port 13111, you can use the following command:


    ```

    root@server : $ tcpdump dstport 13111

    ```


    For example, to grab all the internet control message protocol, you can use the
    following command.


    ```

    root@server : $ tcpdump ICMP

    ```


    You can use it for several other protocols such as SMTP, FTP etc.


    Of course, we can also use logical operators to organize the above operands to
    create more complex expressions. The logical operators supported by tcpdump are
    exactly the same as those in programming languages, including (&&, or (||), not
    (!)).


    For example, to grab IP data packets exchanged between host -laptop and hosts
    other than the source, we can use the following command.


    ```

    root@server : $ tcpdump IP host

    ```


    If the expression is complex, we can use parentheses to group them. However, when
    using parentheses, we either use backslash "\" to escape it, or enclose it in
    single quotation marks "''" to avoid being interpreted by shell.


    For example, to grab packets from host 8.0.2.4 and destination port 3369 or 12,
    you can use the following command.


    ```

    root@server : $ tcpdump src 8.0.2.4 and (dstport 3369 or 12)

    ```


    In addition, tcpdump also allows direct use of some protocol fields in packets
    to filter packets. For example, to grab only TCP synchronization segments, you
    can use the following command.


    ```

    root@server : $ tcpdump TCP [13]&2!=0

    ```


    Because the second bit of the 14th byte of TCP header is the synchronization flag
    we can get a lot of information from the data. Finally, the specific output format
    of tcpdump is not only related to protocols, but also related to protocols. We
    discussed the tcpdump output format of IP, TCP, ICMP, DNS. For tcpdump output
    formats of other protocols, please refer to the manual. With this, we have completed
    a brief introduction to the popular monitoring tool. In the next section we will
    discuss lsof, another popular monitoring tool in Kali.


    ## LSOF


    lsof(list open file) is a tool to list file descriptors opened by the current
    system. Through it, we can know which processes opened the file. The usage method
    of this option is:


    ```

    $ lsof [-4|-6] [protocol] [@hostname | ipaddr] [:service | port]

    ```


    where 4 represents IPv4 protocol and 6 represents IPv6 protocol. Protocol specifies
    the transport layer protocol, which can be TCP or UDP. Hostname specifies the
    host and ipaddr specifies the IP address of the host. Service specifies the service
    name and Port specifies the port number respectively. For example, to display
    the socket file descriptors of ssh services connected to the host 192.168.1.108,
    you can use the command.


    ```

    root@server : $ lsof -i192.168.1.108:22

    ```


    If no parameters are specified after the -i option, the lsof command will display
    all file descriptors. -u, displays all file descriptors opened by processes started
    by the specified user and -c, displays all file descriptors opened by the specified
    command. For example, to see which file descriptors are opened by the websrv program,
    you can use the following command.


    ```

    root@server : $ lsof -c websrv

    ```


    To display all file descriptors opened by the specified process use -p. only the
    PID of the process with the target file descriptor is displayed. We can directly
    take the file name as an argument of the lsof command to see which processes have
    opened the file. It can be seen from the listing that the program files and dynamic
    libraries on the test machine are stored in the equipment "8,3". Among them, where
    "8" indicates that this is a SCSI hard disk,"3" indicates that this is the third
    partition on the hard disk, named sda3.


    The equipment corresponding to standard input, standard output and standard error
    of websrv program is "136,3". Among them, "136" indicates that this is a fake
    terminal,"3" indicates that it is the third pseudo terminal, i.e ./dev/pts/3.


    For FIFO-type files, such as pipes and sockets, this file will display the address
    of a kernel reference file, or its inode number. If the file is displayed as "Ot"
    or "Ox", it means that it is an offset value, otherwise it means that it is a
    size. It is meaningless to define the file size for a character device or FIFO
    type file, so this file will display an offset value. For socket, it shows the
    protocol type, such as "TCP". Name, the name of the file. If we use the telnet
    command to initiate to the websrv server, when we execute the lsof command again,
    The following line will be added to its output.


    ```

    websrv63466shuang5gu IPv4 442880tcp localhost: 13579-> localhost: 48215

    (ESTABLISHED).

    ```

