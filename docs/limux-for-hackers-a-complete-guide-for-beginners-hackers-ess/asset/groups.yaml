    # CHAPTER EIGHT

    SYSTEM INSTALLATION SETTINGS


    THE PREVIOUS CHAPTER has been a good start for linux enthusiasts to understand
    about different processes that will help to understand what Linux is. In this
    chapter we will talk about different system installation settings that are normally
    used in Linux installation procedure. Follow along!


    ## SYSTEM INSTALLATION SETTINGS


    - 1) Now enter the disk partitioning stage. In the interface shown, click INSTALLATION
    DESTINATION to enter the disk partitioning stage. You can see that there is a
    hard disk sda with a size of 100GB. The size shown will be according to your disk
    size.


    Before partitioning, some necessary instructions for Linux partitioning.


    The necessary partitions under the Linux system are the root partition (the root
    partition is marked with "/") and the swap (marked as swap) partition. The swap
    partition is equivalent to the concept of virtual memory in Windows, which is
    the exchange of memory data with the hard disk. Regarding the size of the swap
    partition, many sources point out that it is at least twice the size of the physical
    memory, it is not.


    A basic principle is: if the memory is small (according to experience, the physical
    memory is less than 4GB), generally set the swap partition size to twice the memory.
    If the physical memory is greater than 4GB but less than 16GB, you can set the
    swap partition size to be equal to the physical memory. If the memory size is
    above 16GB, you can set the swap partition to 0. The swap partition can be set
    to 0, but this is not recommended, because setting a certain size of swap partition
    still has a certain effect.


    Although Linux only needs to divide the root partition and the swap partition
    to complete the system installation by default, it is not recommended because
    if only the root partition is divided, the system may not be able to boot after
    the root partition is damaged and it is stored in the root partition. The data
    may also be lost, which is very insecure. Therefore, it is recommended to assign
    independent partitions to independent applications, so even if a partition is
    destroyed, it will not affect the data of other partitions, and can minimize the
    loss caused by system crashes.


    The following partitions are recommended to be allocated independently when installing
    the system.


    - /boot: Store system boot information and kernel information.

    - /usr: Storage system application software installation information.

    - /var: Store system log information.


    For the meaning of each partition, please refer to the next chapter for more detailed
    information.


    The root partition contains all the directories of the Linux system. If only the
    root partition is allocated when the system is installed, the above /boot, /usr,
    and /var will all be included in the root partition, that is, the partitions will
    occupy the space of the root partition. If you divide /boot, /usr, etc. separately,
    the partitions will no longer occupy the space of the root partition.


    After understanding some basic partitioning knowledge, start disk partitioning
    below.


