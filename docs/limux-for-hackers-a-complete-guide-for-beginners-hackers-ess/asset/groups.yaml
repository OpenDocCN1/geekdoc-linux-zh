    # CHAPTER SEVEN

    OPERATORS IN SHELL PROGRAMMING


    IN THE PREVIOUS CHAPTER, we talked about filtering and given examples to understand
    how filtering works with the help of grep command in Linux. Now we need to use
    operations in these commands for further improving the quality of the shell code.


    ## WHAT ARE OPERATORS?


    We all know about mathematical operations such as addition, subtraction, multiplication
    and division that are extensively used in programming languages for arithmetic
    calculations and other programming use cases such as writing search algorithms.
    Even in shell programming we can use operations to improve the quality of the
    code.


    ## VARIOUS ARITHMETIC OPERATIONS


    Shell support various arithmetic operations.


    You can use $((expression)) and let expression to perform integer arithmetic operations.
    Note that these commands cannot perform decimal operations. Use bc command to
    perform decimal operation.


    Below, according to the above operation symbols and when combined with specific
    commands, the effect of actual operation is demonstrated by means of $(()) and
    $ [], both of support the calculation of variables.


    Here are the commands :


    ```

    root@server : echo $(( 2 +4))

    // The solution is 6

    ```


    Next, we will learn this case of arithmetic operations with built-in command known
    as let. Note that when using the let command to calculate, the result of the operation
    will not be given as output by default. Generally, it is necessary to assign the
    result of the operation to a variable and view the result through the variable.


    In addition, when using the let command to calculate variables, there is no need
    to add the $ symbol before the variable name.


    Finally, note when using \+x or - operators, the results of x++ and xxx are different,
    and the results of x- and -x are also different. x++ refers to calling x and adding
    1 to x, and ++x refers to adding 1 to x and then calling x. x- is to call x first
    and subtracting 1 from x while x-- is subtract 1 from x first and then x.


    Bash only supports four operations on integers, not decimal operations. If we
    need to operate on decimals with arbitrary precision or even write calculation
    functions in the script, we can use bc calculator to realize it.


    ## WHAT IS BC IN SHELL PROGRAMMING?


    Bc calculator supports interactive and non-interactive execution modes. First,
    look at the calculation mode in interactive mode. One line of code is a command,
    and multiple calculations can be performed. The bold part below is the manual
    input, and italicized output is the calculation result.


    In addition to bc calculator in interactive mode, it can also be calculated in
    a non-interactive way. In addition the two built-in variables ibase(in) and obase(out)
    of bc calculator can be used for binary conversion.


    ibase is used to specify the binary of input numbers, obase is used to set the
    binary of output numbers, and both input and output numbers are decimal by default.
    Through calculation, we can solve many problems in reality. Each part of the following
    script case needs calculation results can be run independently, or can be merged
    into a file for unified execution.


    Note:


    The variable names of user-defined variables cannot use special symbols, but some
