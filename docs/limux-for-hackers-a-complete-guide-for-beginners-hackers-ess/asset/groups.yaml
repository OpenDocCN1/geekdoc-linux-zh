    Done（完成）按钮。


    到此为止，已经介绍了分区的所有基本操作。现在我们将进入网络配置。


    ## 接下来做什么？


    虽然这部分看起来很复杂，但对 Linux 功能至关重要。如果处理不当，系统可能会出现错误。在下一章中，我们将讨论安装系统前需要填写的网络设置。


    # 第九章


    ## 网络安装设置


    本章讨论了在启动安装程序前需要输入的网络设置。众所周知，网络设置对于系统的运行至关重要，因此必须学习它们。让我们去配置网络设置以完成安装。


    ## 配置网络


    - 1) 在上一步设置后出现的界面中，DHCP 选项默认启用。如果不需要额外的微调和设置，只需保持启用即可。然后点击 NETWORK NAME（网络名称）选项进入网络设置界面。


    左侧面板显示了安装程序识别到的网络接口。点击左侧列表中的网络接口，右侧将显示详细信息。


    在示例操作过程中，只使用了一块网卡。Ethernet（以太网）代表网络设备类型，eno1 代表网卡的设备 ID。你的设备 ID 可能会有所不同。你可以使用以下命令找到它：


    ```

    root@server: netstat

    注意输出信息中的 "ethernet" 单词样。

    ```


    如果使用无线网络，请搜索 "wlan"。界面的右侧显示该网卡的连接状态，如 MAC 地址、连接速率等。


    你可能还可以设置主机名（hostname）信息。在左下角的输入框中输入对应的主机名。


    默认情况下，网卡是断开的，你可以点击右上角的 ON/OFF（开关）按钮激活网卡。激活的网卡无法自动获取 IP 地址，因此你需要手动设置 IP 地址信息。


    点击右下角的 Configure（配置）按钮进入网络信息界面。


    - 2) 在出现的配置界面中，根据连接的网络类型配置有线、无线、VPN 或 DSL 连接。选择“Automatically connect to this
    network when it is available（可用时自动连接到此网络）”，以便所有用户都能连接到此网络。勾选框以自动连接。


    - 3) 在网络配置部分，似乎有很多选项需要设置。在界面中选择 IPv4 设置标签进入 IP 地址配置界面。首先选择 Method（方法），常用有 DHCP、Manual（手动）。选择手动后点击
    Add（添加）添加 IP 地址。IP 地址为 192.234.56.101，子网掩码为 255.255.255.0，网关为 192.187.56.1，然后添加
    DNS 服务器地址 113.5.5.55。


    如果网络需要设置多个路由，也可以点击右下角的 Routes（路由）按钮添加路由。


    所有设置完成后，点击 Save（保存）保存设置并返回之前的界面。


    - 4) 设置完成后，网卡将自动尝试连接网络。配置的网络将作为摘要显示供参考。点击 Done（完成）按钮完成网络设置并返回到包含其他选项的界面。


