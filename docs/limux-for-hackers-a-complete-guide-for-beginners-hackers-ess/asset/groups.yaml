    ## CHAPTER THREE

    ##WORKING TOOLS IN KALI LINUX


    IN THE PREVIOUS modules of this book we discussed hacking philosophy along with
    an introduction to Kali Linux. While Kali linux is an excellent way to master
    and utilize tools, we also need to be aware of some of the monitoring tools that
    are available in it. Networking is the backbone for internet communication and
