    # CHAPTER ONE

    ## INSTALLING SOFTWARES AND PACKAGES IN LINUX


    AS WITH EVERY OPERATING SYSTEM, installing software is a mandatory use case for
    Linux also. Linux uses organized package management systems and installs software
    in a more perfect way when done correctly. It may feel a bit of complexity when
    first dealing with installing and updating software in linux but as time goes
    on you will feel organized and easy Linux installation philosophy is. As a hacker
    it is important to understand and find easy ways to install software to not break
    the system. Even if you are dealing with Live USB to hack systems it is very essential
    to understand how installing packages work in Linux.


    To help you understand these concepts we are providing various use cases and examples
    in this chapter. Follow along!


    ## HOW IS IT DIFFERENT FROM WINDOWS?


    When compared to Linux, windows installation procedure may seem straightforward
    but it’s not. Windows installation files are especially large because they create
    a sandbox to include all the API’s that the software calls at different instances.
    This makes installation file big and may cause lag issues down the road.


    Linux however uses different approach to install files. It uses packages which
    are tightly enclosed and independent and are updated by their own instance. This
    may cause problems sometimes but most of the time it just works perfectly.


    ## HOW TO INSTALL SOFTWARE IN LINUX MINT?


    As we are aware that Mint is a light weight Debian based system that can work
    even under low end based systems. Different Linux distros use different package
    managers. For example, Arch Linux which is a developer favorite Linux distro uses
    Pacman to install software.


    All the Debian based systems fundamentally use “apt” to install software. Apt
    is a simple package manager that tightly integrates all the components and installs
    them in the Linux machine using the instructions provided in the script file.


    ### How does it work?


    When a software is called the first script file is downloaded and then the package
    manager will analyze all the components that are necessary for the system to function
    properly. If any component is already installed in the system it skips to the
    next one to download it. After all the components are installed the software will
    be packaged and installed within seconds into the Linux system.


    Here is a command:


    ```

    apt-get install python

    // This will download Python to the Linux system

    ```


    ## HOW TO SEARCH PACKAGES?


    Apt almost provides all the famous packages that Linux enthusiasts and developers
    root for. However, there are a lot of third party packages that may not be available
    because of compatibility reasons.


    If you are trying to download a package and if not you are sure whether that package
    exists or not in the package manager then you can use the search command to find
    it. If you do not get any accurate results for your package name then it is evident
    that the apt is not supporting your package.


    Here is the command:


    ```

    root@server : apt-cache search Python4

    // This will search the apt repository and will display “no results” in the command
    line

    ```


    To get more accurate results please use the web version of apt repository where
    all the available packages are sorted even according to a category.


    If you are using Arch Linux, Pacman also provides a search option to check packages
    before downloading and installing them.


    ## HOW TO REMOVE SOFTWARE?


    Removing software from an operating system is as important as installing software
    into a system.


    You may wonder why it is important to remove software that is significantly not
    doing any damage to your Linux system? But listen to experts because idle software
    that are outdated can conflicts with the newly installed software.


    If there are potential conflicts in a Linux system it may lead to breaking the
    whole operating system. Removing unwanted software improves system performance
    and can help users allocate those wasted memory resources to something worthwhile.


    Ethical hackers should also understand how to remove software because when they
    detect any trojans or spiders that are inserted by the attackers to hijack system
    they should be able to remove their traces from the system as soon as possible.
    Some high risk trojans will not get removed until you end their process by manually
    finding them. It is tough to remove software if a hacker users potentially dangerous
    ways to implement them.


    For now, we will learn about removing software by using a package manager like
    apt.


    Here are some commands:


    ```

    root@server : apt-get remove python

    // This removes python packages along with all the dependencies that are not being
    used by any other package in the operating system.

    ```


    ## HOW TO UPDATE PACKAGES/SOFTWARE?


    Updates are a way to improve the performance of your software. Almost every software
    release updates to provide new features to their users. In windows system, when
    you click update first downloads an executable file and asks you to install it
    manually.


    In linux however however all you need to do is to use the package managers to
    install them and all of its dependencies. You can also manually provide instructions
    in the installation file to update the repositories that you are not willing to
    update. In linux, updating software gives a lot of freedom unlike traditional
    operating systems like Windows and Mac.


    Linux also provides an easy way to update all the software that is available with
    a one click. During this process Linux kernels and header files will be updated
    to support the newer versions of the software.


    Here are some commands:


    ```

    apt-get update

    // Use this command to update all your software by one click

    apt-get upgrade

    // use this command to upgrade all the software packages that are installed on
    the system

    apt-get upgrade python

    // This command will check whether python has any updates and if there are any
    updates available then it will install them cumulatively.

    ```


    ## GUI BASED INSTALLATION PROCEDURE


    Linux is a terminal centric operating system and will always support the philosophy
    of using commands to change the system files as installing/removing software.
    However, it should be understood that GUI is also supported extensively by some
    Linux enthusiasts.


    There has always been a wide debate about GUI installers that are developed by
    third party developers. Unlike in the beginnings of Linux deployment now Linux
    is also being used as a daily operating system by a lot of users. And, it is a
    known fact that a lot of them are not tech savvy and prefer GUI based installers
    because they are more to operate.


    This is the reason why some of the Linux distros that have huge downloads including
    GUI based installers in the operating system. For example, a popular arch based
    Linux distro Manjaro comes with GUI version of Pacman and solves a lot of installation
    problems that users may face.


    For Debian based system synaptic installer is highly recommended and is binned
    with a lot of Debian based distros.


    If you do not find Synaptic installer we suggest you to use the below command


    ```

    root@server : apt-get install synaptic

    // This will install the synaptic GUI installer in the Linux system

    ```


    Now, all you need to do search your preferred package in the search column of
    the GUI installer so that it can be installed seamlessly along with all of it''s
    dependencies that are required to run the software.


    Removing software is also easy with a GUI based installer. All you need to do
    is find the software name and select it to remove from your system along all of
    its dependencies.


    Now, in the next section of this chapter we will talk about git which is a famous
    developer tool that needs to be mastered if you are into open-source and working
    in teams. You might have already heard "Github" that uses the git structure to
    share code with others.


    ## GIT INSTALLATION


    If you never heard about Github it is a git code sharing platform that offers
    both free and professional plans. In the free plan your code will be public and
    therefore automatically comes under open-source license.


    ### What does git go exactly?


    Git uses a complex technique that involves commits to automatically update the
    source code in a project in a way that it supports all the present code.


    It becomes handy especially if you are working in teams to check the compatibility
    of the newly written code. It also makes testing process easy for enterprise applications.

    '
