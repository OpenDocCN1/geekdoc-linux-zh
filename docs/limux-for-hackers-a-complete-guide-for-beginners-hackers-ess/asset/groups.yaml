    ## WHAT ARE VARIABLES?


    Computer has memory in it which all the values are temporarily stored. All the
    data that we see in our computers and smartphones use the same basic philosophy.


    Data changes constantly and we need to use a certain temporary entity that computer
    can understand to make things easy. Before the invention of variables in programming
    scientists used to waste a lot of data and that is the reason why Invention of
    variables certainly changed the way we looked at computers.


    Variables are data entities that can be used to store numbers, strings or characters
    that can be further manipulated or modified.


    ## HOW TO REPRESENT A VARIABLE?


    Variables are case sensitive and can cause problems if you do not follow these
    rules. Also, remember that you cannot start a variable name with a number. Python
    also consists of more than forty reserved keywords which cannot be used as any
    identifier. Some of the examples of reserved keywords are if, for, while.


    Here is an example :


    ```

    first = 3

    // ''first'' is the variable with value 3.

    ```


    Note : Python automatically recognizes 3 as value with ''int'' data type unlike
    traditional programming languages which need them to be declared before.


    ## HOW DOES VARIABLES WORK?


    It just acts like a pointer to a memory location. Whenever a variable is created
    a particular memory reserve will be created for that with the value you are giving
    it. And whenever the variable is called it points to that particular memory location.
    Variables can be replaced and are so called as temporary values.


    For example :


    ```

    First = 3

    First = 5

    Print (first)

    ```


    Output :


    ```

