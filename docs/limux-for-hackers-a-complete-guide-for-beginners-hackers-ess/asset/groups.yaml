    左侧面板中的挂载点，你可以在右侧面板进行各种修改，例如：编辑挂载点、修改分区大小、选择设备类型、选择文件系统类型、用于自定义的标签选项，以及对相应分区进行加密或重新格式化。


    对于文件系统选择，默认是 xfs，但共有七种类型：swap、vfat、BIOS boot、ext2、ext3、ext4 和 xfs。其中，ext2、ext3
