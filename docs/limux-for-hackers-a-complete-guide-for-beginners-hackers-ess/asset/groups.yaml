    ### 1. VirtualBox software overview


    VirtualBox is an open source virtual machine software. It was originally developed
    by the German Innotek company, and the software produced by Sun Microsystems was
    written in Qt. After Sun was acquired by Oracle, it was officially renamed Oracle
    VirtualBox.


    VirtualBox can be said to be the most powerful virtual machine software. It not
    only has rich features, but also has excellent performance and is easy to use.
    It can virtualize systems such as Windows, Mac OS X, Linux, OpenBSD, Solaris,
    IBM OS2, and even other operating systems.


    VirtualBox is not only open source, but also has many advantages. This module
