    # 第七章

    Shell 编程中的操作符


    在上一章中，我们讨论了过滤，并提供了示例来帮助理解 Linux 中如何通过 `grep` 命令实现过滤工作。现在，我们需要在这些命令中使用操作符来进一步提高
    Shell 代码的质量。


    ## 什么是操作符？


    我们都知道数学运算，如加、减、乘、除，这些操作在编程语言中广泛用于算术计算以及编写搜索算法等其他编程场景。即使在 Shell 编程中，我们也可以使用操作符来提高代码质量。


    ## 各种算术操作


    Shell 支持各种算术操作。


    你可以使用 `$((expression))` 和 `let expression` 来执行整数算术操作。注意，这些命令无法执行小数运算。使用 `bc` 命令来执行小数运算。


    下面，根据上述操作符号并在结合特定命令时，通过 `$(())` 和 `$[]` 演示了实际操作的效果，两者都支持变量的计算。


    以下是命令：


    ```

    root@server : echo $(( 2 +4))

    // 结果是 6

    ```


    接下来，我们将通过内置命令 `let` 学习这种算术操作用例。注意，当使用 `let` 命令进行计算时，操作结果默认不会作为输出给出。通常，需要将操作结果赋值给变量，并通过变量查看结果。


    此外，当使用 `let` 命令计算变量时，不需要在变量名之前添加 `$` 符号。


    最后，注意当使用 `++x` 或 `-x` 操作时，`x++` 和 `xxx` 的结果是不同的，`x-` 和 `-x` 的结果也是不同的。`x++` 指调用
    x 并给 x 加 1，`++x` 指先给 x 加 1 再调用 x。`x-` 是先调用 x 然后从 x 减 1，而 `x--` 是先从 x 减 1 然后。


    Bash 仅对整数支持四种运算，不支持小数运算。如果我们需要对任意精度的小数进行操作，甚至在脚本中编写计算函数，可以使用 `bc` 计算器来实现。


    ## Shell 编程中的 BC 是什么？


    `bc` 计算器支持交互式和非交互式执行模式。首先，看交互式模式下的计算模式。一行代码是一个命令，可以执行多次计算。下面的**加粗部分**是手动输入，*斜体部分*是计算结果。


    除了交互模式下的 `bc` 计算器，还可以以非交互方式进行计算。此外，`bc` 计算器的两个内置变量 `ibase(in)` 和 `obase(out)`
    可用于二进制转换。


    `ibase` 用于指定输入数字进制，`obase` 用于输出输出进制，输入和输出数字默认都是十进制。通过计算，我们可以解决现实中的许多问题。以下脚本案例中每个需要计算结果的部分都可以独立运行，也可以合并到一个文件中统一执行。


    注意：


