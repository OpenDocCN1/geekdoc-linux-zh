    car.driving()


    // This is an object calling a method in Python

    ```


    # INHERITANCE IN PYTHON CLASSES


    Inheritance is an Object oriented concept by which the child classes can inherit
    all the properties and methods that the parent class possess. You can implement
    this principle in Python to create much more efficient programs. All you need
    to do is call the parent and child class together using a single apostrophe between
    them.


