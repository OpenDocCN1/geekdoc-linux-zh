    默认 `printf` 命令输出后不会换行，但可以使用 `\n` 命令符号在输出后换行。


    这显示了 10 的八进制值，从八进制 12 转换为十进制正好是 10。`x11` 代表十六进制 11，`printf` 命令将十六进制 11 转换为十进制整数输出
    (17)。`01` 代表八进制 11，`printf` 命令将八进制 11 转换为十进制整数输出 (9)。


    ```

    root@server : printf "%d \n" 17.011

    ```


    当使用 `\d` 打印大整数时，系统提示超出范围，且可以打印的最大数字是 927983298。


