  mdcn: '

    到此，我们已经对 `strace` 命令string了简短而复杂的介绍。我们建议你仔细阅读。虽然理解网络包在 `strace` 中重要性的方法有多种，但我们还应该使用如
    `netstat` 等其他工具来进一步提升我们作为黑客对网络监控工具的影响力。


    ## NETSTAT


    Netstat 是一个强大的网络信息统计工具。它可以打印本地网卡接口上的所有连接、路由表信息和网卡接口信息。对于本书，我们主要使用上述功能中的第一种，即显示
    TCP 连接及其状态信息。


    毕竟，对于路由表信息和网卡（NIC）接口信息，我们可以使用 `route` 和 `ifconfig` 命令获取更丰富的输出内容。


    接下来，我们运行 `websrv` 服务器并执行 `telnet` 命令向其发起连接请求。


    ```bash

    root@server : $./websrv 127.0.0.1 13579 & $ telnet 127.0.0.1 13579

    ```


    然后执行命令来检查连接状态。


    ```bash

    netstat -nat | grep 127.0.0.1:13579

    ```


    结果如下：


    ```

    proto recv-q send-q local address foreign address state

    TCP 0 0 127.0.0.1:13579 0.0.0.0:

    ```


    在上述输出中，第1行表示本地 socket 地址 `127.0.0.1:13579` 处于 `LISTEN` 监听状态，等待任何远程 socket（由 `0.0.0.0:`
    表示）向其发起连接。第2行表示服务器与远程地址 `127.0.0.1:48220` 建立了连接。


    第三行仅从客户端的角度反复输出由第二行信息所指示的连接，因为我们正在同一台机器上运行服务器程序 (`websrv`) 和客户端程序 (`telnet`)。在服务器端程序的开发过程中，我们必须确保每个连接在任何时刻都处于我们期望的状态。因此，我们应该学会使用
    `netstat` 命令。


    我们可以使用 `netstat` 命令显示关于不同网络服务器、其流量包和其他重要的大量信息。在下一节中，我们将讨论另一种名为 `vmstat` 的基础网络工具。请继续！


    ## VMSTAT


    Vmstat 是 virtual memory statistics（虚拟内存统计）的缩写，它可以实时输出系统各种资源的使用情况，例如进程信息、内存使用、CPU
    使用率和 I/O 使用率。


    默认情况下，`vmstat` 的输出非常丰富。


    看示例：


    ```bash

    root@server : $vmstat 5 3

    # 每5秒输出一次结果。

    ```


    注意，第一行的输出是自系统启动以来的平均结果，而下一行的输出是采样间隔内的平均结果。


    如果这两个值变化频繁，说明内存不足。`io` 是块设备的使用信息，单位是 block/s；`bi` 表示从块设备读取块的速率；`bo` 表示向块设备写入块的速率；`in`
    表示每秒中断数，`cs` 表示每秒上下文切换（进程切换）的次数次。


    然而，我们可以使用 `iostat` 命令获取更多关于磁盘使用情况的信息，也可以使用 `mpstat` 获取更多关于 CPU 使用率的信息。`vmstat`
    命令主要用于检查系统内存的使用情况。


    许多黑客利用此工具了解内存资源，并临时停止那些消耗高内存的程序。在执行暴力破解等任务时，我们需要理解这些可以减轻系统负载的工具的重要性。在下一节中，我们将详细介绍
    `ifstat` 网络工具。请继续！


    ## IFSTAT


    Ifstat 是 interface statistics（接口统计）的缩写，是一个简单的流量监控工具。


    例如，我们在测试机上执行以下命令：


    ```bash

    root@server : $ifstat-a 2 5

    # 每2秒输出一次结果。

    ```


    `ifstat` 的输出显示了每个 NIC 接口接收和发送数据的速率（单位为 KB/s）。因此，使用 `ifstat` 命令可以粗略估计服务器在每个阶段的总入出流量。


    在本章的后续节，我们将讨论 `mpstat`，这是一种黑客分析不同处理器统计数据的常用网络工具。请继续！


    ## MPSTAT


    Mpstat 是 multi-processor statistics（多处理器统计）的缩写，它可以实时监控多处理器系统中每个 CPU 的使用情况。`mpstat`
    命令和 `iostat` 命令通常集成在 `sysstat` 软件包中，可以通过安装 `sysstat` 获取。


    `mpstat` 命令的典型用法如下（`mpstat` 的选项并不多，此处不做专门介绍）：


    ```bash

    mpstat [-p { all }] [interval [count]]

    ```


    选项 `p` 指定要监控的 CPU 编号（0 ~ CPU 数量 -1），其值 "all" 表示监控所有 CPU。


    `interval` 参数是采样间隔（单位为秒），即每隔一个间隔输出一次统计信息。`count` 参数是采样次数，即 `mpstat` 总共输出 `count`
    次统计信息，并最终输出这 `count` 次采样结果的平均值。


    与 `vmstat` 命令类似，`mpstat` 命令的第一个输出结果是自系统启动以来的平均结果，而接下来的（第 `count` 次）输出结果是采样间隔内的平均结果。


    例如，我们在测试机上执行以下命令：


    ```bash

    root@server : $mpstat -P ALL 5 2

    # 每5秒输出一次结果。

    ```


    每次采样的输出包含三部分信息，每部分包含以下字段：CPU，“0”表示第一个 CPU 的数据，“1”表示第二个 CPU 的数据，“all”表示两个 CPU 的平均值。


    %usr 表示除了具有 nice 值的进程外，系统其他进程在用户空间运行的时间占比例。


    %nice 表示具有负 nice 值的进程在用户空间运行的时间占比例。


    %sys 表示系统所有进程在内核空间运行的时间占比例，但不包括由硬件和软件中断消耗的 CPU 时间。


    %iowait 表示 CPU 等待磁盘操作的时间占比例。%ir 表示处理硬件中断的 CPU 时间占比例。


    %soft 表示处理软件中断的 CPU 时间占总 CPU 时间的比例。


    %steal 表示一个物理 CPU 可能包含一对虚拟机 CPU，它们由虚拟机管理器管理。当虚拟机管理器处理一个虚拟机 CPU 时，另一个虚拟机 CPU 必须等待其处理完成后才能运行。这种等待时间被称为窃时。该字段表示窃时占总
    CPU 时间的比例。


    %guest 表示运行虚拟机 CPU 的时间占总 CPU 时间的比例。


    %idle 表示系统空闲时间占总 CPU 时间的比例。在所有输出字段中，我们最关注 %user、%sys 和 %idle。


    它们基本上反映了代码中业务逻辑代码和系统调用的比例，以及系统能够承受的负载。显然，在上面的输出中，执行系统调用消耗的 CPU 时间比执行用户业务逻辑更多。这是因为我们运行了此机器上介绍的压力测试工具，它不断执行
    recv/send 系统调用来收发数据。


    ## 接下来是什么？


    到此，我们对几个帮助你理解黑客本质的网络监控工具提供了完美的介绍。要成为一名黑客，你需要在自己的网络上亲自尝试在本章中学学会的所有命令。否则，你所做的一切都无法被理解。Linux
    并不在于背诵命令，而在于以特定的方式使用命令，改变系统与硬件资源和软件内核交互的方式。


    在模块的下一章中，我们将详细讨论不同的 Kali Linux 工具。请继续！

