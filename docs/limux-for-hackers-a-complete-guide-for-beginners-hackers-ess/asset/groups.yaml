    # shell 解释器的 shell 属性与命令行终端的初始化


    Shell 脚本需要在命令行终端中执行，命令行终端通常支持大量的属性和功能，因此设置 shell 解释器和终端的属性可以为脚本执行提供最佳环境。


    首先，让我们看看 Shell 解释器的属性设置和查看方法。目前，Linux Mint 系统默认使用 Bash 解释器，因此我们将主要学习 Bash 的内部命令集和
    `shopt`。


    通过这两个命令你可以查看并设置 Bash 的许多功能。使用 `set -o` 和 `shopt` 命令可以查看各自命令支持的所有属性以及它们是否已开启。`set`
    命令可以通过选项开启或关闭特定的 Bash 属性，`shopt` 命令可以通过 `-s` 和 `-u` 开启或关闭某些 Bash 属性。


    我们将逐一演示并解释这些属性。由 Bash 定义的变量和函数默认是局部的，进入子进程后它们将不再被调用和使用。使用 `set -a` 可以让所有变量和函数默认被子进程调用。


    默认情况下，Bash 支持大括号替换（brace replacement），使得可以使用简单的命令快速生成数据序列，例如字母序列表和数字序列表。


    可以通过 `braceexpand` 属性开启或关闭该功能。有时在脚本开头设置 `set -e`（错误时退出）是必要的。如果我们写一个脚本，脚本的主功能是创建账户、账户密码并最后输出提示信息。


