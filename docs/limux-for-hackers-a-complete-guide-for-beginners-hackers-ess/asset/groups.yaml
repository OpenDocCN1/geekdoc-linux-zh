    root@server : $ strace/foo/baropen("/foo/bar", rdnly | large file) =-1

    ```


    This will display the output as eno (no such file or directory)


    strace command will have different output modes for different parameter types,
    for example, for C-style strings we will get a different output depending on its
    parameter. This helps us to monitor data in a dynamic way using the strace command
    utility tool.


    The default maximum output length is 32 bytes, and the excessive strace will be
    omitted with "...".


    For example, the ls-l command will read the /etc/passwd file:


    ```

    root@server : $ straces-read(4, "root: x: 0: root:root:/bin/bash \n" ..., 4096)
    = 2342.

    ```


    It should be noted that the file name is not regarded as a C-style string by strace.
    For a structure, strace will output each field of the structure with "{}" and'
  - '[PAGE 208]


    separate each field with ",".For structures with more fields, strace will omit
    some output with "..."


    For example:


    ```

    root@server : $ stracels-/dev/null lstat64 ("/dev/null",{mode = ifchr | 0666,
    rdev = makedev(1,3),...) = 0

    ```


    The strace output above shows that the first parameter of trace and is the output
    parameter (pointer) of stat structure type. strace only shows two fields of the
    structure parameter: mode and rdev.Should be noted that when the system call fails,
    the output parameters will be displayed as the values before passing in.


    For bit parameters (such as signal type sigset), strace will output all bits set
    to 1 in the set with "[ ]", and separate each item with a space.


    Suppose there is the following code in the program:


    ```

    sigaddset(&set,SIGUSR1);sigprocmask(SIGBLOCK, &set,NULL);

    ```


    Then strace command for this program will output the following contents:


    ```

    rt sigprocmask (SIG block, [quitrus1], null, 8) = 0.

    ```


    For the output modes of other parameter types, please refer to strace''s manual,
    and do not repeat them here.


    For the signal received by the program, strace will output the value of the signal
    and its description.For example, we run the "sleep 100" command on one terminal,
    and then use the strace command to trace the process on another terminal, and
    then use "Ctrl+C" to terminate the "sleep 100" process to observe the output of
    strace.


    The specific operation is as follows:'
  - '[PAGE 209]


    ```

    root@server : $ sleep 100 $ PS-EF | grep sleep

    ```


    The specific operation is as follows:


    ```

    root@server : $./websrv 127.0.0.1 13579 $ PS-EF | grep websrv

    ```


    Next, use the method to initiate a connection to the server and send an HTTP request.
    Therefore, this event indicates that a new client connection is coming, so the
    websrv server makes an accept call to the listening socket, and accept returns
    a new connection socket with a value of 5.


    Then, the server clears the errors on the new socket, sets its REUSEADDR attribute,
    then registers EPOLLRDHUP and EPOLLESHOT events on the socket in the epoll kernel
    event table, and finally sets the new socket as non-blocking.


    The wait call detected the event on file descriptor, which indicated that the
    first line of data from the client had arrived, so the server executed recv system
    calls to receive the data.The first recv call reads 38 bytes of customer data,
    that is, "http://localhost/@a.htmlhttp/L1 \ r \ \n".The second call to recv failed,
    and errno is EAGAIN, which means there is no more customer data to read at present.


    After that, the server called mutex function to unlock the mutex to wake up the
    thread waiting for the mutex.It can be seen that pthread_mutex_unlock function
    in POSIX thread library calls mutex function internally. The contents of the third
    and fourth parts are similar to those of the second part, so we will not repeat
    them here.


    In the fifth part, the wait call detects the EPOLLOUT event on file descriptor
    5, which indicates that the worker thread correctly processed the client request
    and prepared the data to be sent, so the main thread started to execute the write
    system call and respond to the client.


    Finally, the server removes all registered events on file descriptor 5 from the
    epoll kernel event table and closes the file descriptor.Therefore, trace command
    enables us to clearly see the timing of each system call and the values of related
    parameters, which is more convenient than debugging with gdb.'
- md: '

    With this, we have described a brief and complex introduction to strace command.
    We recommend you to read it with attention. While there may be different ways
    to understand the importance of network packets in strace, we should use other
    tools as netstat to further improve the impact of network monitoring tools as
    a hacker.


    ## NETSTAT


    Netstat is a powerful statistical tool for network information. It can print all
    connections, routing table information and network card interface information
    on the local network card interface. For this book, we mainly use the first of
    the above functions, that is, display TCP connection and its status information.


    After all, to routing table information and NIC interface information, we can
    use route and ifconfig commands with richer output content.


    Next, we run the websrv server and execute the telnet command to initiate a connection
    request to it.


    ```bash

    root@server : $./websrv 127.0.0.1 13579 & $ telnet 127.0.0.1 13579

    ```


    And then execute the command to check the connection status.


    ```bash

    netstat -nat | grep 127.0.0.1:13579

    ```


    The result is as follows:


    ```

    proto recv-q send-q local address foreign address state

    TCP 0 0 127.0.0.1:13579 0.0.0.0:

    ```


    In the above output, line 1 indicates that the local socket address 127.0.0.1:13579
    is in the LISTEN state, and waits for any remote socket (represented by 0.0.0.0:)
    to initiate a connection to it. Line 2 indicates that the server has established
    a connection with the remote address 127.0.0.1:48220.


    The third line only repeatedly outputs the connection indicated by the information
    in the second line from the client''s point of view, because we are running the
    server program (websrv) and the client program (telnet) on the same machine. In
    the process of server program development, we must ensure that every connection
    is in the state we expect at any moment. Therefore, we should get using netstat
    command.


    We can display a lot of information about different network servers, their traffic
    packets and other important information using the netstat command. In the next
    section, we will talk about other fundamental networking tool which is called
    as vmstat. Follow along!


    ## VMSTAT


    Vmstat is the abbreviation of virtual memory statistics, which can output the
    usage of various resources of the system in real time, such as process information,
    memory usage, CPU usage and I/O usage.


    By default, the output of vmstat is quite rich.


    Look at the following example:


    ```bash

    root@server : $vmstat 5 3

    # outputs the results every 5 seconds.

    ```


    Note that the output in the first line is the average result since the system
    was started, while the output in the next line is the average result in the sampling
    interval.


    If these two values change frequently, there is not enough memory. io, the usage
    information of block devices, and the unit is block/s; bi indicates the rate at
    which blocks are read from the block device; "bo" indicates the rate at which
    blocks are written to the block device; "in" indicates the number of interrupts
    per second and "cs" indicates the number of context switches (process switch)
    per second.


    However, we can use iostat command to get more information about disk usage, and
    we can also use mpstat to get more information about CPU usage. The vmstat command
    is mainly used to check the usage of system memory.


    A lot of hackers use this to understand about memory resources and temporarily
    stop those programs that are consuming high memory. While performing tasks like
    brute force attacks we need to understand the importance of these tools that can
    decrease the work load of the system. In the next section, we will talk about
    ifstat networking tool in detail. Follow along!


    ## IFSTAT


    Ifstat is the abbreviation of interface statistics, which is a simple network
    traffic monitoring tool.


    For example, we execute the following command on the test machine:


    ```bash

    root@server : $ifstat-a 2 5

    # outputs the result every 2 seconds.

    ```


    output of ifstat shows the rate of receiving and sending data on each NIC interface
    in KB/s. Therefore, using ifstat command can roughly estimate the total input
    and output traffic of the server in each period.


    In the following section of this chapter, we will talk about mpstat which is a
    popular networking tool for hackers to analyze different processor statistics.
    Follow along!


    ## MPSTAT


    Mpstat is the abbreviation of multi-processor statistics, which can monitor the
    usage of each CPU on multi-processor system in real time. The mpstat command and
    iostat command are usually integrated in the package sysstat, which can be obtained
    by installing sysstat.


    The typical usage of the mpstat command is (there are not many options of the
    mpstat command, which are not specificALLY introduced here)


    ```bash

    mpstat [-p { all }] [interval [count]]

    ```


    option p specifies the CPU number to be monitored (0 ~ CPU number -1), and its
    value "all" means to monitor all CPUs.


    The interval parameter is the sampling interval (in s), that is, the statistical
    information is output once every interval. Count parameter is the number of sampling
    times, that is, a total of count times of statistical information are output,
    by mpstat will finally output the average value of these count times of sampling
    results.


    Like the vmstat command, the first output result of the mpstat command is the
    average result since the system was started, while the next (count) output result
    is the average result within the sampling interval.


    For example, we execute the following command on the test machine:


    ```bash

    root@server : $mpstat -P ALL 5 2

    # outputs the result every 5 seconds.

    ```


    The output of each sampling contains three pieces of information, and each piece
    of information contains the following fields: CPU, which indicates which CPU,"0"
    indicates the data of the first CPU, "1" indicates the data of the second CPU,
    and "all" indicates the average value of the two CPUs.


    %usr, except for the process with nice value, the proportion of the time that
    other processes on the system run in user space to the total CPU time.


    %nice, the proportion of the time that a process with negative nice value runs
    in user space to the total CPU time.


    %sys, the ratio of the time that all processes on the system run in kernel space
    to the total CPU time, but excluding the CPU time consumed by hardware and software
    interrupts.


    %iowait, the proportion of CPU waiting for disk operation to total CPU time.%
    IR, the proportion of CPU time processing hardware interrupts to the total CPU
    time.


    %soft, the proportion of CPU time spent processing software interrupts to the
    total CPU time.


    %steal, a physical CPU can contain a pair of virtual CPUs, which are managed by
    the hypervisor. When a hypervisor is processing a virtual CPU, another virtual
    CPU must wait for its processing to finish before running. This waiting time is
    called steal time. The field indicates the proportion of steal time to the total
    CPU time.


    %guest, the time spent running virtual CPU accounts for the total CPU time.


    %idle, the ratio of system idle time to total CPU time. Among all output fields,
    we are most concerned about %user,%sys and %idle.


    They basically reflect the proportion of business logic code and system call in
    our code, and how much load the system can bear. Obviously, in the above output,
    executing system calls takes more CPU time than executing user business logic.
    This is because we have run the stress testing tool introduced on this machine,
    which constantly executes recv/send system calls to send and receive data.


    ## WHAT NEXT?


    With this, we have provided a perfect introduction to a couple of network monitoring
    tools that can help you understand the essence of hacking. To become a hacker
    you need to personally try out all these commands you have learnt in this chapter
    on your own networks. If not, anything that you do cannot be understood. Linux
    is not about using the written commands but it is about using commands in a definite
    way that can change the way system interacts with the hardware resources and software
    kernel.


    In the next chapter of this module we will discuss about different Kali Linux
    tools in detail. Follow along!

