    # 进程替换命令


    进程替换通过命名管道将一个进程的返回结果传递给另一个进程。


    进程替换的语法格式为：


    ```

    < (command) 或 > (command)。

    ```


    一旦使用了进程替换函数，系统会在 `/dev/fd/` 目录下创建一个文件描述符，并通过该文件描述符将进程的输出结果传递给其他进程。


    我们可以通过匿名管道 (`|`) 将一个进程的输出作为另一个进程的输入。在上面的示例中，`| wc -l` 的目的是通过匿名管道统计当前系统的登录人数。


    ```bash

    root@server : | wc -l

    ```


    我们也可以使用进程替换来实现相同的功能。`< (who)` 将 `who` 命令生成的结果保存到文件描述符 `/dev/fd/63`，并将该文件描述符作为
    `wc -` 命令的输入参数。


    `wc -l < (who)` 的最终输出结果将显示 `/dev/fd/63` 文件中有五行。需要注意的是，文件描述符是实时生成的，当进程执行完毕时，用 `ls`
    查看文件描述符，它会提示没有该文件。


    使用进程替换，我们还可以将多个进程的输出结果作为输入传递给一个进程。


    ```bash

    root@server : paste -d '' /etcetc/ < <etcetc/shadow```


    在下面的情况下，我们要从 `/etc/passwd` 文件中提取用户名（第一列）和家目录（第六列），然后从 `/etc/shadow` 文件中提取密码信息（第二列）。


    最后，通过 `paste` 命令将数据合并到一个文件中，`paste` 按行读取多个文件的内容并合并多个文件。


    ```bash

    root@server : paste

    // 这用于合并行、列以及许多其他标识符

    ```


    在 Linux 系统中，上一个命令的输出可以使用管道重定向到文件，一旦命令输出被重定向到文件，结果就无法显示在屏幕上。使用 `tee` 命令可以将内容重定向到文件并在屏幕上显示输出。


    这里是命令：


    ```bash

    root@server : tee

    ```


    以下命令可以查看 `/etc` 目录下所有以 `.conf` 结尾的文件，并将输出结果保存到 `/tmp/conf.log` 文件。


    注意：


    如果系统中已存在该文件，`tee` 命令将覆盖原来的内容。


    接下来，我们将演示一个使用 `tee` 命令的进程替换案例。我们将创建三个 `.sh` 扩展的文件和三个 `.conf` 扩展的文件作为实验材料，然后通过进程替换将
    `ls|tee` 的输出写入临时文件描述符。


    ```bash

    root@server : touch a,b,c (.sh)

    root@server : tee <config.log

    ```


    最后，我们将通过 `grep` 过滤文件描述符的内容，将以 .sh 结尾的文件重重定向到 `sh.log` 文件，将以 .conf 结尾的文件重定向到 `conf.log`
    文件。


    ```bash

    root@server : cat sh.log

    root@server : cat conf.log

    // 这将在最后的 conf 文件中填充所有细节

    ```


