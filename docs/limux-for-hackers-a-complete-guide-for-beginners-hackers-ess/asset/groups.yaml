    the execution process easy and less time-consuming.


    To understand Bash better read this code:


    ```bash

    #! /bin/bash

    echo " This is a sample example"

    # This is a comment

    ```


    # Explanation :


    The above bash shell program that can be executed from a Linux computer consists
    of three important concepts of Bash that every hacker needs to understand and
    implement them in their programs.


    I) First, we will talk about the Line that starts with a Shebang (#!) symbol.
    If a text file starts with a Shebang command then it directly means that the file
    is asking the Linux kernel to look for the system file that can run this program
    as an interpreter.


    Here, /bin/bash is provided as the interpreter Location. So now Linux knows that
    mentioned text file needs to be run as a Bourne-again shell.


    If you want to run the program as a Python interpreter then you need to enter
    the command as below mentioned.


    ```python

    #! /bin/python

