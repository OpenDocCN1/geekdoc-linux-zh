    ```

    rt sigprocmask (SIGBLOCK, [SIGUSR1], NULL, 8) = 0.

    ```


    关于其他参数类型的输出模式，请参考 strace 的手动页，我们在此不再重复。


    对于程序接收到的信号，strace 将输出信号的值及其描述。例如，我们在一个终端上运行 "sleep 100" 命令，然后在另一个终端使用 strace 命令跟踪该进程，然后使用
    "Ctrl+C" 终止 "sleep 100" 进程以观察 strace 的输出。


