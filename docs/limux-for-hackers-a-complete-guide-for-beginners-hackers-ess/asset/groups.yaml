    # STRACE


    Strace is an important tool for testing server performance. It tracks the system
    calls and signals received during the program running, and outputs the system
    names, parameters, return values and signal names to the standard output or specified
    files.


    The format is:


    ```

    [qualifier=][!value1,value2]..

    ```


    The qualifier can be one of trace, abbrevi, verbose, raw, signal, read and write,
    and the default is trace. Value is a symbol or numerical value used to further
    limit the tracked system calls. Its two special values are all and none, which
    respectively mean to track all system calls of the type specified by qualifier
    and not track any system calls of this type.


    For example, -e read=3, 5 means to output all data read from file descriptors
    and 5.


    - -o, writes strace''s output to the specified file. Each line output of strace
    command contains these fields: system name, parameter and return value.


    For example, the following example:


    ```

    root@server: $ strace /dev/null open("/dev/null", O_RDONLY | O_FILE) = 3.

    ```


    This line of output indicates that the program "cat/dev/null" executed the open
    system call during running.


    Open opened the large file /dev/null in a read-only manner, and then returned
    a file descriptor with a value of 3. It should be noted that this example command
    will output a lot of content, and here we omit a lot of secondary information.
    In the following examples, we only display the content related to the topic.


    When there is an error in the system call, the strace command will output the
    error identification and description, such as the following example.


    ```

    root@server : $ strace /foo/bar open("/foo/bar", O_RDONLY | O_FILE) = -1

    ```


    This will display the output as ENO (no such file or directory).


    strace command will have different output modes for different parameter types,
    for example, for C-style strings we will get a different output depending on its
    parameter. This helps us to monitor data in a dynamic way using the strace command
    utility tool.


    The default maximum output length is 32 bytes, and the excessive strace will be
    omitted with "...".


    For example, the ls -l command will read the /etc/passwd file:


    ```

    root@server : $ strace -read(4, "root: x: 0: root:root:/bin/bash \n" ..., 4096)
    = 2342.

    ```


    It should be noted that the file name is not regarded as a C-style string by strace.
    For a structure, strace will output each field of the structure with "{}" and
    separate each field with ",". For structures with more fields, strace will omit
    some output with "..."


    For example:


    ```

    root@server : $ strace /dev/null lstat64 ("/dev/null",{mode = S_IFCHR|0666, rdev
    = makedev(1,3),...) = 0

    ```


    The strace output above shows that the first parameter of trace and is the output
    parameter (pointer) of stat structure type. strace only shows two fields of the
    structure parameter: mode and rdev. Should be noted that when the system call
    fails, the output parameters will be displayed as the values before passing in.


    For bit parameters (such as signal type sigset), strace will output all bits set
    to 1 in the set with "[ ]", and separate each item with a space.


    Suppose there is the following code in the program:


    ```c

    sigaddset(&set,SIGUSR1);sigprocmask(SIGBLOCK, &set,NULL);

    ```


    Then strace command for this program will output the following contents:


    ```

    rt sigprocmask (SIGBLOCK, [SIGUSR1], NULL, 8) = 0.

    ```


    For the output modes of other parameter types, please refer to strace''s manual,
    and do not repeat them here.


    For the signal received by the program, strace will output the value of the signal
    and its description. For example, we run the "sleep 100" command on one terminal,
    and then use the strace command to trace the process on another terminal, and
    then use "Ctrl+C" to terminate the "sleep 100" process to observe the output of
    strace.


    The specific operation is as follows:


    ```

    root@server : $ sleep 100 $ ps -EF | grep sleep

    ```


    The specific operation is as follows:


    ```

    root@server : $ ./websrv 127.0.0.1 13579 $ ps -EF | grep websrv

    ```


    Next, use the method to initiate a connection to the server and send an HTTP request.
    Therefore, this event indicates that a client connection is coming, so the websrv
    server makes an accept call to the listening socket, and accept returns a new
    connection socket with a value of 5.


    Then, the server clears the errors on the new socket, sets its REUSEADDR attribute,
    then registers EPOLLRDHUP and EPOLET events on the socket in the epoll event table,
    and finally sets the new socket as non-blocking.


    The wait call detected the event on file descriptor, which indicated that the
    worker thread correctly processed the client request and prepared the data to
    be sent, so the main thread started to execute the write system call and respond
    to the client.


    Finally, the server removes all registered events on file descriptor 5 from the
    epoll event table and closes the file descriptor. Therefore, trace command enables
    us to clearly see the timing of each system call and the values of related parameters,
    which is more convenient than debugging with gdb.

