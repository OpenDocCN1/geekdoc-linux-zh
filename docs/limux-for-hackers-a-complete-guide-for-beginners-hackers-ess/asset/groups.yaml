    ## Virtual machine operating environment and hardware requirements


    ### 1. Operating environment


    Popular virtual machine software includes VMware and VirtualBox, both of which
    have Windows and Linux versions. They can also be used for macOS operating system.


    That is to say, they can be installed on both Windows and Linux platforms: Windows,
    Linux, UNIX, etc. can be virtualized under the Windows platform. In the same way,
    Windows, Linux, UNIX and other computers can be virtualized on the Linux platform.
    However, remember that according to Apple EULA you can only virtualize macOS in
    an apple hardware.


    Attention:


    The operating system running the virtual machine software is called Host OS, and
    the operating system running in the virtual machine is called Guest OS.


    ### 2. Hardware requirements


    The virtual machine software integrates the tasks of two or more computers into
    one computer. Therefore, the hardware requirements are relatively high, mainly
    involving memory, hard disk and CPU.


    The memory must be large enough, because each virtual machine occupies a certain
    amount of memory resources, and the total size of the memory is equal to the sum
    of each virtual system. Fortunately, memory is now very cheap, so it is not a
    problem. Similarly, the hard disk space is also occupied by every virtual machine.
    The CPU has now developed to the multi-core stage, and the hard disk prices should
    not be a problem.


