- img_proc: true
  md: 'The third line only repeatedly outputs the connection indicated by the information
    in the second line from the client''s point of view, because we are running the
    server program (websrv) and the client program (telnet) on the same machine.In
    the process of server program development, we must ensure that every connection
    is in the state we expect at any moment.Therefore, we should get using netstat
    command.


    We can display a lot of information about different network servers, their traffic
    packets and other important information using the netstat command. In the next
    section, we will talk about other fundamental networking tool which is called
    as vmstat. Follow along!


    # VMSTAT


    Vmstat is the abbreviation of virtual memory statistics, which can output the
    usage of various resources of the system in real time, such as process information,
    memory usage, CPU usage and I/O usage.


    By default, the output of vmstat is quite rich.


    Look at the following example:


    ```

    root@server : $vmstat 5 3


    # outputs the results every 5 seconds.

    ```


    Note that the output in the first line is the average result since the system
    was started, while the output in the next line is the average result in the sampling
    interval.


    If these two values change frequently, there is not enough memory.io, the usage
    information of block devices, and the unit is block/s; bi indicates the rate at
    which blocks are read from the block device;"bo" indicates the rate at which blocks
    are written to the block device;"in" indicates the number of interrupts per second
    and "cs" indicates the number of context switches (process switch) per second.


    However, we can use iostat command to get more information about disk usage, and
    we can also use mpstat to get more information about CPU usage.The'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'vmstat command is mainly used to check the usage of system memory.


    A lot of hackers use this to understand about memory resources and temporarily
    stop those programs that are consuming high memory. While performing tasks like
    brute force attacks we need to understand the importance of these tools that can
    decrease the work load of the system. In the next section, we will talk about
    ifstat networking tool in detail. Follow along!


    # IFSTAT


    Ifstat is the abbreviation of interface statistics, which is a simple network
    traffic monitoring tool.


    For example, we execute the following command on the test machine:


    ```

    root@server : $ifstat-a 2 5

    # outputs the result every 2 seconds.

    ```


    output of ifstat shows the rate of receiving and sending data on each NIC interface
    in KB/s.Therefore, using ifstat command can roughly estimate the total input and
    output traffic of the server in each period.


    In the following section of this chapter, we will talk about mpstat which is a
    popular networking tool for hackers to analyze different processor statistics.
    Follow along!


    # MPSTAT


    Mpstat is the abbreviation of multi-processor statistics, which can monitor the
    usage of each CPU on multi-processor system in real time.The mpstat command and
    iostat command are usually integrated in the package sysstat, which can be obtained
    by installing sysstat.


    The typical usage of the mpstat command is (there are not many options of the
    mpstat command, which are not specificALLy introduced here)


    ```

    mpstat [-p { all }] [interval [count]

    ```'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'option p specifies the CPU number to be monitored (0 ~ CPU number -1), and
    its value "all" means to monitor all CPUs.


    The interval parameter is the sampling interval (in s), that is, the statistical
    information is output once every interval.Count parameter is the number of sampling
    times, that is, a total of count times of statistical information are output,
    by mpstat will finally output the average value of these count times of sampling
    results.


    Like the vmstat command, the first output result of the mpstat command is the
    average result since the system was started, while the next (count-1) output result
    is the average result within the sampling interval.


    For example, we execute the following command on the test machine:


    ```

    root@server : $mpstat-P ALL 5 2

    # outputs the result every 5 seconds.

    ```


    The output of each sampling contains three pieces of information, and each piece
    of information contains the following fields: CPU, which indicates which CPU piece
    of information is,"0" indicates the data of the first CPU, "1" indicates the data
    of the second CPU, and "all" indicates the average value of the data of the two
    CPUs.


    % usr, except for the process with negative nice value, the proportion of the
    time that other processes on the system run in user space to the total CPU running
    time.


    % nice, the proportion of the time that a process with a negative nice value runs
    in user space to the total CPU running time.


    % sys, the ratio of the time that all processes on the system run in kernel space
    to the total CPU running time, but excluding the CPU time consumed by hardware
    and software interrupts.


    % iowait, the proportion of CPU waiting for disk operation to total CPU running
    time.% IR, the proportion of CPU time spent processing hardware interrupts to
    the total CPU running time.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '% soft, the proportion of CPU time spent processing software interrupts to
    the total CPU running time.


    % steal, a physical CPU can contain a pair of virtual CPUs, which are managed
    by the hypervisor.When a hypervisor is processing a virtual CPU, another virtual
    CPU must wait for its processing to finish before running.This waiting time is
    called steal time.The field indicates the proportion of steal time to the total
    CPU running time.


    %guest, the time spent running virtual CPU accounts for the total CPU running
    time.


    % idle, the ratio of system idle time to total CPU running time.Among all output
    fields, we are most concerned about %user,%sys and %idle.


    They basically reflect the proportion of business logic code and system call in
    our code, and how much load the system can bear.Obviously, in the above output,
    executing system calls takes more CPU time than executing user business logic.This
    is because we have run the stress testing tool introduced on this machine, which
