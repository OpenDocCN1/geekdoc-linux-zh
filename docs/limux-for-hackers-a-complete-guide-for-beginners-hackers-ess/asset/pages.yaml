- img_proc: true
  md: 'KALI LINUX CONSISTS of more than 350 hacking tools pre installed. All these
    tools provide different use cases and can help hackers spoof network data and
    can even monitor them for future proof cases.


    In this chapter we will discuss about some of the most important tools that are
    available in Kali Linux along with what they do. Grab your seat and have fun exploring
    different branches of hacking.


    # STAGE 1 - RECONNAISSANCE TOOLS


    As said before to cracking and hacking systems you need to first have a lot of
    information about the target. For example, knowing what server architecture the
    target is using can help you find vulnerabilities for that particular server architecture.


    But, how do you actually know about the target?


    To explain this we need to explain how hackers work first. Hackers are not only
    smart geeks but also good conversationalists that try to acquire information from
    normal conversations from the users that are using the target.


    If a hacker is looking to target a bank server then he persuades few of the bank
    employees and tries to gather information about the server. While it may seem
    risky but just installing a monitoring software can help them get all the resources
    and information they need.


    For this reason we are dividing this branch of hacking into two categories. One
    is social engineering attacks and the other is digging the valuable information.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# A) Social engineering attacks


    These are the attacks that hackers use to the target users, employees and system
    administrators. One of the famous attacks is to create a phishing page for expecting
    the target to enter their username and password. After obtaining the credentials
    they use this privilege to reach the root level.


    There are tons of tools for these type of attacks. There are different command
    line utilities to create fake phishing pages of social networking websites.


    # B) Digging the valuable information


    A lot of information about the target is usually available in the open world.
    A couple of intelligent google searching can give you tons of information about
    the target. Reaching out to the system administrators using e-mail can also be
    a good way to get some sensitive information.


    However, the most important tool hackers use for this hacking step is nmap. nmap
    is an open-source tools that scans the open ports that are available and outputs
    tons of information that is related to the target.


    If done correctly you can find the server architecture and the operating system
    the target using different automated commands. However, remember that the internet
    security researchers have learned a lot in these years and have developed diverse
    intrusive detection systems to counter the requests that are coming form newbies
    who are trying to scan the open ports.


    If you are an experienced hacker the only thing you will do is to not draw attention
    from the system administrators to ban your IP address or MAC address permanently.


    Here are some commands:


    ```

    root@sample : nmap

    // This displays the menu

    root@ sample : nmap www.google.com

    // This scans the open ports of this particular address

    root@sample : nmap -V 192.32.222.12

    // This sends requests for open port detection for this input address

    ```'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Nmap is also very efficient to know about other advanced stuff such as pinging
    time and the presence of firewalls. If there are firewalls present you can find
    open vulnerabilities to exploit them.


    After scanning and finding potential loopholes you can proceed to the next stage
    of hacking. That is exploitation.


    # 2) EXPLOITATION TOOLS


    What is fun in hacking systems if you don''t know a way to hack them and exploit
    them?


    After finding vulnerabilities hackers usually insert trojans or spider worms to
    complete the dirty work for them. A lot of hackers are now implementing bitcoin
    mining in different systems to make some quick bucks. But how do they it?


    Experienced hackers write their own software for exploits whereas moderate hackers
    use kali linux tools such as Metasploit.


    # What is Metasploit?


    Metasploit is the most popular exploitation tool and can be used for tracking
    the users or for binding trojans in an image or pdf files. And when the target
    clicks the metas-loot modified file we can track them and exploit them.


    Here are some command:


    ```

    root@server : metasploit

    // This is will start the msf console

    root@server : msf bind image.jpg

    // This binds the image file with metasploit trojan code

    ```


    You can also use metasploit to hack servers and mobile devices. However, remember
    that you can''t hack an apple device without hardware access whereas you can hack
    android files even remotely.


    # STAGE 3 - MONITORING TOOLS'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'In the previous stages we used Kali Linux tools to scan and exploit the systems.

    In this section we will learn about Monitoring tools such as Wireshark to understand
    the hacker attacks that may happen anytime.


    # What is Monitoring?


    Network data travel in the form of packets. Packets if not encrypted can be spoofed
    and can be used to steal information by hackers. Tools like Wireshark can help
    ethical hackers monitor the packets to analyze any suspicious traffic that is
    coming.


    Wireshark is one of the most downloaded packet analysis software. It provides
    a pane where every packet, its headers and the host information will be displayed.
    You can analysis these records from the logs that wireshark leave.


    +   Here are some tips to use Wireshark:

    1) Always make sure that you are aware of the target host address you are trying
    to monitor.

    2) Use utility tools such as net stat and ping to analyze the network traffic
    and use this information to capture the packets effectively.

    3) Understand the difference between encrypted and non-encrypted network packets.
    If you are forced to decrypt the encrypted packets then make sure that you understand
    other complex stuff as HTTP protocols and cookie information.


    Wireshark provides premium features for network administrators for a nominal price.
    In the professional version you can automatically make reports using the captured
    information where as in community version you need to manually make them.


    # DICTIONARY ATTACK TOOLS


    While there is a ton of complex stuff for hackers to deal with what they are most
    interested in to steal sensitive information such as passwords and email addresses.
    The only way to steal a lot of passwords and accounts on is by using dictionary
    attacks. Also known as brute force attacking in technical terms.


    Kali linux provides tools such as Hydra and Jack the Ripper to crack websites'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'and databases. Some crackers also exploit SQL injection to crack databases
    to obtain sensitive information.


    # A) Hydra


    Hydra is a dictionary attack tool that is available in kali linux. Using hydra
    all you need to do is provide the url page and a text file that consists of username
    and passwords separated by a colon.


    All the successful logins will be printed in a log file and can be used to login
    to the website.


    Here are some commands:


    ```

    root@server : hydra www.google.com/login user.txt

    // This will attack the login page with the information provided in text file

    ```


    # B) Jack the Ripper


    Jack the Ripper is the same type of tool which can be used to crack login pages.
    While hydra can brute force only static login pages this tool can help you crack
    login pages dynamically.


    That is, you can customize a brute force attack can be performed according to
    the ongoing results. For example, if the login page is giving a “ Server not found
    “ errors Jack the Ripper will automatically change the proxy servers to mitigate
    a proxy ban that is performed by intrusive detection systems.


    Here is a command:


    ```

    root@server : jtr -w pass.txt www.sampleurl.com -p proxy.txt

    ```


    Here w stands for the wordlist that carries the username and password where proxy.txt
    has information about different proxy servers that can be randomly used if they
    are live by the brute force engine.


    # WIRELESS NETWORK TOOLS'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'The last set of tools we are going to discuss is about wireless tools. We all
    know that the world is rapidly changing and network ethernets are now not the
    only way to transmit information in a network. Wireless networks include wifi
    hotspots, mobile phones, laptops and even smart watches.


    There is a lot of privacy at stake and even a small vulnerability in the network
    protocol can be used to steal a lot of sensitive information. This is the reason
    why you need to update your system regularly.


    Here are some of the important tools :


    # A) aircrack-ng


    This is a famous network tool that can be used to brute force all the available
    Wpa/wp2 networks. It can also automatically find vulnerabilities in the WPS network.
    You all need to do is to find the network address of the Wireless network using
    net stat command and insert in the tool to crack them automatically.


    Here are commands:


    ```

    root@server : aircrack-ng 192.23.11.234 text.txt

    ```


    # B) Airdump


    Airdump is a network monitoring tool that does the same work as the above mentioned
    tool but with more options and customizations. Airodump even provided fake phishing
    pages to obtain information from the target users using social engineering attacks.


    With this, we have completed a brief intruction to Kali Linux tool set. In the
    next chapter of this module we will talk about different network monitoring tools
    that can help to analyze the networks and hack them. Let us go!'
