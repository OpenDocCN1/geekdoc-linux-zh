    output.The file descriptor of standard output is 1, and that of standard error
    output is 2. While the input file descriptor holds for 0.


    If you want to change the direction of the output information, you can use the
    > or >> symbol to redirect the output information to a file. Use 1 > 1 > to redirect
    standard output information to a file (1 can be ignored without writing, the default
    value is 1), or use 2 > 2 >> to redirect wrong output information to a file.


