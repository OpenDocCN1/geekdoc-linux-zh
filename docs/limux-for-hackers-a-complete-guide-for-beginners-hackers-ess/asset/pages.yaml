    While it not have advanced capabilities like tcpdump, lsof still serves the purpose
    it is made for. In the next section of this chapter we will talk about nectar
    in detail. Follow along!


    # NC(NETCAT)


    netcat command is short, capable and powerful, and has the reputation of "Swiss
    Army Knife".It is mainly used to quickly build network connections.We can make
    it run as a server, to a port and receive client connections, so it can be used
    to debug client programs.We can also make it run as a client, initiate a connection
    to the server and receive data, so it can be used to debug the server program,
    which is bit like a telnet program.


    The transport layer protocol used by nc command by default is TCP protocol.-w,
    if the nc client does not detect any input within the specified time, exit.-x,
    which specifies the communication protocol used between nc client and proxy server
    when they communicate.At present, proxy protocols supported by nc include "4"
    (socks v.4), "5" (socks v.5) and "connect" (https proxy).The proxy protocol used
    by nc by default is SOCKS v.5.-x, specify the IP address and port number of the
    target proxy server.


    For example, to connect to squid proxy server from laptop from source and access
    Web services in www.google.com through it, you can use the following command.


    ```

    root@server: $ NC-x source: 1080-x Connect www.google.com 80-z, and scan whether
    one or some services on the target machine are turned on (port scanning).

    ```


    For example, to scan services with port numbers between 20 and 50 on the machine
    ernst-laptop, you can use the following command.


    ```

    root@server: $nc-z source 20-50.

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'For example,We can use the following methods to connect to the websr server
    and send data to it.


    ```

    root@server :$nc -C 127.0.0.1 13579 (server listening port 13579)

    http://localhost/a.htmlHTTP/1.1 (carriage return)

    ```


    It will provide with requested file was not found on this server. Here we use
    the - C option, so that every time we press the key to send a line of data to
    the server, the nc client program will send an extra < Cr > < If > to the server,
    which is exactly the HTTP line terminator expected by websrv.


    After sending the third line of data, we got the response from the server, which
    is exactly what we expected. The server did not find the requested resource file
    a.html.Therefore,nc command is a convenient and quick testing tool, through which
    we can quickly find out logic errors of the server.


    In the next section of this chapter, we will discuss abstr tool that can conveniently
    help us to track the routes of the network packets. Follow along!


    # STRACE


    Strace is an important tool for testing server performance.It tracks the system
    calls and signals received during the program running, and outputs the system
    names, parameters, return values and signal names to the standard output or specified
    files.


    The format is:


    ```

    [qualifier=][!value1,value2]..

    ```


    The qualifier can be one of trace, abbrevi, verbose, raw, signal, read and write,
    and the default is trace.Value is a symbol or numerical value used to further
    limit the tracked system calls.Its two special values are all and none, which
    respectively mean to track all system calls of the type specified by qualifier
    and not track any system calls of this type.


    For example, -e read=3, 5 means to output all data read from file descriptors'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'and 5.-o, writes strace''s output to the specified file.Each line output of
    strace command contains these fields: system name, parameter and return value.


    For example, the following example:


    ```

    root@server: $ strace/dev/nullen("/dev/null", rdnly | largefile) = 3.

    ```


    This line of output indicates that the program "cat/dev/null" executed the open
    system call during running.


    Open opened the large file /dev/null in a read-only manner, and then returned
    a file descriptor with a value of 3.It should be noted that this example command
    will output a lot of content, and here we omit a lot of secondary information.
    In the following examples, we only display the content related to the topic.


    When there is an error in the system call, the strace command will output the
    error identification and description, such as the following example.


    ```

    root@server : $ strace/foo/baropen("/foo/bar", rdnly | large file) =-1

    ```


    This will display the output as eno (no such file or directory)


    strace command will have different output modes for different parameter types,
    for example, for C-style strings we will get a different output depending on its
    parameter. This helps us to monitor data in a dynamic way using the strace command
    utility tool.


    The default maximum output length is 32 bytes, and the excessive strace will be
    omitted with "...".


    For example, the ls-l command will read the /etc/passwd file:


    ```

    root@server : $ straces-read(4, "root: x: 0: root:root:/bin/bash \n" ..., 4096)
    = 2342.

    ```


    It should be noted that the file name is not regarded as a C-style string by strace.
    For a structure, strace will output each field of the structure with "{}" and'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'separate each field with ",".For structures with more fields, strace will omit
    some output with "..."


    For example:


    ```

    root@server : $ stracels-/dev/null lstat64 ("/dev/null",{mode = ifchr | 0666,
    rdev = makedev(1,3),...) = 0

    ```


    The strace output above shows that the first parameter of trace and is the output
    parameter (pointer) of stat structure type. strace only shows two fields of the
    structure parameter: mode and rdev.Should be noted that when the system call fails,
    the output parameters will be displayed as the values before passing in.


    For bit parameters (such as signal type sigset), strace will output all bits set
    to 1 in the set with "[ ]", and separate each item with a space.


    Suppose there is the following code in the program:


    ```

    sigaddset(&set,SIGUSR1);sigprocmask(SIGBLOCK, &set,NULL);

    ```


    Then strace command for this program will output the following contents:


