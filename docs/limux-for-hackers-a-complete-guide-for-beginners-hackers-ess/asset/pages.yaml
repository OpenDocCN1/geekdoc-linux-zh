    and can help users allocate those wasted memory resources to something worthwhile.


    Ethical hackers should also understand how to remove software because when they
    detect any trojans or spiders that are inserted by the attackers to hijack system
    they should be able to remove their traces from the system as soon as possible.
    Some high risk trojans will not get removed until you end their process by manually
    finding them. It is tough to remove software if a hacker users potentially dangerous
    ways to implement them.


    For now, we will learn about removing software by using a package manager like
    apt.


    Here are some commands:


    ```

    root@server : apt-get remove python

