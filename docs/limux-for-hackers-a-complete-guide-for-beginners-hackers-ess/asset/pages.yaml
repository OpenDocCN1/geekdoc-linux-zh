  md: '# CHAPTER ONE

    INTRODUCTION TO LINUX


    THIS CHAPTER mainly describes some methods and experiences of learning Linux system,
    including how to choose a Linux distribution that suits you, as well as the relationship
    and applicable environment of each Linux distribution. Then it summarizes the
    general roadmap for learning Linux. It will also give sufficient information about
    building your own Linux learning environment, and finally will talk about some
    resources for learning Linux. By the study of this chapter, beginners will no
    longer feel confused in the process of learning Linux, and can find a learning
    method that suits them. Initially we will talk about some of the applications
    of Linux in everyday life.


    # CURRENT STATUS AND TRENDS OF LINUX IN VARIOUS FIELDS


    Many novices have a very confusing question:


    > I have heard of Linux, but after learning the Linux system, can you do on it?
    Or what can the Linux system specifically do?


    With this question, the book begins with an overview of Linux and its relationship
    with open source software. We will also talk about application fields and future
    development trends of Linux.


    # LINUX AND OPEN SOURCE SOFTWARE


    Linux is a free and open source UNIX-like operating system. The kernel of this
    operating system was first released by Linus Torvalds in 1991. After that, with'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'the addition of user space applications, it became the Linux operating system.


    Strictly speaking, Linux use just the operating system kernel itself. The term
    "Linux kernel" is usually used to express this. Linux is often used to refer to
    a complete operating system based on the Linux kernel, which includes GUI components
    and many other utilities.


    The GNU General Public License (most commonly called as GNU GPL or GPL) is a widely
    used free software license agreement. Originally written by Richard Stallman for
    the GNU project, the GPL gives the definition of free software for computer programs.
    Any product derived from GPL software must be released under the GPL license and
    the source code must be disclosed.


    Linux is the most famous example of the development of free software and open
    source software. As long as they follow the GNU GPL, any individual and organization
    can freely use the underlying source code of Linux, and can freely modify and
    redistribute it. With the rapid development of the Linux operating system, various
    integrated open source software and utility tools on Linux have also been applied
    and popularized. Therefore, Linux has also become synonymous with open source
    software. Red Hat is one of the famous Linux operating systems that commercialized
    its tools to be sold for enterprises looking out a database administration system.


    # THE DEVELOPMENT OF LINUX IN THE SERVER FIELD


    With the increasing influence of open source software worldwide, the Linux server
    operating systems has occupied more and more market shares in the server operating
    system market structure and has conventionally formed a situation of large-scale
    market applications, and has maintained a rapid Growth rates, especially in key
    areas such as government, finance, agriculture, transportation, and telecommunications.
    In addition, considering the rapid growth of Linux and the support of relevant
    national policies in different countries, Linux server products are bound to impact
    the larger server market.


    According to statistics from authoritative departments, Linux currently has a
    75% market share in the server field. At the same time, the rapid rise of Linux
    in the server market has attracted great attention from the global IT industry
    and has become the backbone of the server operating system field with a strong
    momentum.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# DEVELOPMENT OF LINUX IN THE DESKTOP FIELD


    In recent years, especially in the technological market, the development trend
    of Linux desktop operating system is very rapid. The Linux desktop operating system
    launched by local system software vendors as the winning Red Flag Linux, Deepin
    Linux, has been widely used in the government, enterprises, OEM and other fields.


    In addition, SUSE and Ubuntu have also launched Linux-based desktop systems, especially
    Ubuntu Linux, which has accumulated a large number of community users. However,
    from the perspective of the overall functions and performance of the system, there
    is still a certain gap between the Linux desktop system and the Windows series,
    mainly in terms of ease of use, system management, software and hardware compatibility,
    and software richness. macOS is also popular among designers, creative professional
    in films and people who write books. Linux has a purpose and serve it well. So,
    does the other operating systems. As a hacker it is mandatory to understand the
    importance of Linux as it may hard to crack any system using windows and Mac software.


    In the next section, we will talk about the development of Linux in various fields
    using a set of examples. Follow along!


    # THE DEVELOPMENT OF LINUX IN THE MOBILE EMBEDDED FIELD


    Linux''s low cost, powerful customization features, and good portability have
    made Linux widely used in embedded systems. At present, Linux has been widely
    being used in mobile phones, tablet computers, routers, TVs, and electronic game
    consoles. The Android operating system widely used on mobile devices is created
    on top of the Linux kernel. At present, Android has become the world''s most popular
    smartphone operating system crossing the much hyped iOS operating system. According
    to the latest statistics from authoritative departments in 2015, the global market
    share of Android operating system has reached 84.6%.


    In addition, Cisco has also used customized Linux in network firewalls and routers,
    and AWS Cloud has also developed a Linux-based operating system which can be used
    on smart phones, tablets and Internet TVs. Common digital video recorders, Stage
    lighting control systems are gradually adopting customized versions of Linux to
    achieve, and all this is by the power of'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Linux and open source. Linux is no where near to get extinct. It will readily
    spread across every corner in the world.


    # DEVELOPMENT OF LINUX IN THE FIELD OF CLOUD COMPUTING/BIG DATA


    The rapid development of the Internet industry has promoted the formation and
    rapid development of cloud computing and big data industries. As a platform based
    on open source software, Linux occupies the core advantage of cloud computing
    and big data.


    According to the Linux Foundation''s research, 86% of enterprises have used the
    Linux operating system to build cloud computing and big data platforms. At present,
    Linux has begun to replace UNIX as the most popular cloud computing and big data
    platform operating system.


    In the next chapter, we will provide details about different Linux distros to
    help readers choose the operating system of their choice. Choosing a Linux distro
    is always an overwhelming challenge. To know what is best for you we suggest to
    experiment with different distros to find what you really like.


    There are so many Linux distributions that no one can give an accurate figure,
    but one thing is certain, Linux is becoming more and more popular. Faced with
    so many Linux distributions, beginners who plan to switch from other systems to
    Linux systems may be confused. Even loyal Linux users do not have the time and
    energy to try them one by one. Therefore, before beginners learn Linux, they need
    to have a clear direction. It is very important to choose a Linux system that
    suits them. The following next chapter is a classified introduction of Linux distributions.'
