  md: '# CHAPTER TWO


    # PROCESS MANAGEMENT IN LINUX


    AFTER HAVING a thorough understanding about the installation philosophy and Linux
    uses you are Now all set to enter into a new Linux arena which helps you ignite
    much more significant thoughts as a hacker. Linux uses processes to maintain and
    interact all its components with Linux kernel. If there are no process running
    then we can confidently say that the Linux system has shut down. As a hacker understanding
    processes, manipulating them and ending them whenever necessary is a blessing
    skill. In this chapter we will not provide basics about processes in Linux but
    will also provide examples that can help you understand the foundations of Linux
    more concretely. Follow along!


    # WHAT ARE PROCESSES?


    Processes are what Linux programs run. They are a representation that the software/
    command line utility is interacting with system resources as Linux kernel to do
    what it is ought to. Every software that is running in Linux has a process and
    if we end the process manually the software will stop working.


    As a hacker, when you access to a system you will be easily monitored by the anti
    virus processes that are running in the Linux system. To make them stop sending
    your logs to the system administrator you may need to end their processes manually.


    While it may seem simplistic to end processes like Task manager using windows
    this can have some serious consequences if done wrong. You need to have a practical
    experience and a good theoretical understanding of process management to achieve
    your wishes.'
  merge: -1
