  md: '# CHAPTER THREE

    STRATEGY TO MASTER LINUX


    IN THE PREVIOUS chapter we have talked about various Linux distributions.

    Before heading to the installation procedure we need to provide you a few tips
    so that you will master Linux in the way that worked for a lot of other professionals
    before. However, remember that this is not a strict roadmap to follow. You can
    experiment and find out which strategy is working for you in the long run. This
    is only a strategy for your better understanding about obtaining the technical
    skills that needs a practical use case in enterprise industry.


    # HOW TO DEVELOP GOOD LINUX OPERATING HABITS?


    After learning Linux, please do not think about the problem in the way of working
    in Windows, because there are indeed very big differences between them. For example,
    the memory management mechanism and process operation mechanism between them are
    very different. These similarities and differences Points will be described in
    the following chapters. Therefore, it is very important for beginners to put aside
    the kind of thinking of Windows and try to tap the unique potential of Linux with
    a new concept. Always make sure that you are thorough with all the Linux basics
    such as File management, process management and Logging management.


    # BE SURE TO GET USED TO THE COMMAND LINE MODE


    Linux is an operating system composed of command lines. The essence and heart
    of the operating system is in the command line. No matter what level the graphical
    interface develops, the operation of the command line mode will never change.
    Linux commands have many powerful functions: from simple disk'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'operations, file access, to the production of complex multimedia images and
    streaming media files, they are inseparable from the command line. Although Linux
    also has a desktop system, X-Window is just an application running in command
    line mode.


    Therefore, it can be said that commands are the basis for learning Linux systems.
    To a large extent, learning Linux means learning commands. Many Linux masters
