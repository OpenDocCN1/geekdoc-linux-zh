  md: '# CHAPTER ONE

    INSTALLING SOFTWARES AND PACKAGES IN LINUX


    AS WITH EVERY OPERATING SYSTEM, installing software is a mandatory use case for
    Linux also. Linux uses organized package management systems and installs software
    in a more perfect way when done correctly. It may feel a bit of complexity when
    first dealing with installing and updating software in linux but as time goes
    on you will feel organized and easy Linux installation philosophy is. As a hacker
    it is important to understand and find easy ways to install software to not break
    the system. Even if you are dealing with Live USB to hack systems it is very essential
    to understand how installing packages work in Linux.


    To help you understand these concepts we are providing various use cases and examples
    in this chapter. Follow along!


    # HOW IS IT DIFFERENT FROM WINDOWS?


    When compared to Linux windows installation procedure may seem straightforward
    but it’s not. Windows installation files are especially large because they create
    a sandbox to include all the API’s that the software calls at different instances.
    This makes installation file big and may cause lag issues down the road.


    Linux however uses different approach to install files. It uses packages which
    are tightly enclosed and independent and are updated by their own instance. This
    may cause problems sometimes but most of the time it just works perfectly.


    # HOW TO INSTALL SOFTWARE IN LINUX MINT?'
