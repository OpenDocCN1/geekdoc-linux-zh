  md: 'In the coming sections you will be learning some tips to find and manage processes
    along with a way to automate them according to your convenience.


    # HOW TO VIEW PROCESSES?


    Whenever a Linux system boots up some processes will start opening automatically.
    Every time when you open a terminal or a web browser their respective processes
    will be opened. When you close some of the processes will be automatically shut
    down while other will be running in the background consuming your system resources.


    Here is the command for viewing processes:


    ```

    root@server : ps

    n// This displays all the processes that are running in the Linux system

    ```


    Here is a sample output:


