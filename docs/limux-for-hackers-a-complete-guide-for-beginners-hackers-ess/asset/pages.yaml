  md: '# CHAPTER FIVE


    # VARIABLES IN SHELL PROGRAMMING


    IN THIS CHAPTER we will talk about the efficient implementation of variables while
    writing shell programs. They may seem easy but are usually complex and can change
    the shell implementations tremendously. We will also discuss about expressions
    in shell programming with detailed examples. Follow along!


    # WHAT ARE VARIABLES?


    Let us introduce variables with a small analogy. We all know that water is stagnant
    if it does not flow. If the constants used in the script are all immutable, then
    the function of the script is not flexible enough, and it is only a fixed script
    that can meet specific needs.If the water flows, there will be various forms.
    In the same way, if the script uses variables, it will become more flexible and
    changeable.


    Just as air temperature and air pressure are real-time changing data in real life,
    the computer data that scripts need to deal with often changes in real time.In
    Linux system, variables are divided into system preset variables and user-defined
    variables.


    # CUSTOM VARIABLES


    First, let''s look at how custom variables are defined and called.In Linux system,
    the definition format of a custom variable is “variable name = variable value”,
    and the variable name is only used to find an identifier of the variable value,
    and it has no other function.'
