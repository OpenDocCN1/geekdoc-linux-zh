- img_proc: true
  md: '# CHAPTER THREE

    NETWORKING TOOLS IN KALI LINUX


    IN THE PREVIOUS modules of this book we discussed hacking philosophy along with
    an introduction to Kali Linux. While Kali linux is an excellent way to master
    and utilize tools, we also need to be aware of some of the monitoring tools that
    are available in it. Networking is the backbone for internet communication and
    understanding the basics of it is a must for every programmer.


    Linux provides many useful tools for developers to debug and evaluate server programs.
    Skilled network programmers will constantly use one or more of these tools to
    monitor server behavior in the whole process of developing server programs.


    Some of these tools are common for hackers.


    This chapter will discuss some of the most commonly used tools: tcpdump, nc, trace,
    lsof, netstat, vmstat, ifstat and mpstat. These tools support many options, but
    our discussion is limited to the most common and practical ones. Also, remember
    that we only provide the important commands for your understanding of the abilities
    of the tool. To further know and experiment with the tool we first suggest you
    to


    # TCPDUMP


    Tcpdump is a classic network capture tool. Even today, we have a package grabbing
    tool like Wireshark which is easier to use and master, and tcpdump is still a
    necessary tool for network programmers.Tcpdump provides users with a large number
    of options to filter data packets or customize the output format.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'Before learning more tcpcdump we suggest you to understand about the essence
    of network packets and how they are tracked using tools such as Wireshark. If
    you are an efficient hacker it is also important to learn a bit about sniffing
    networks to collect sensitive information from the data that is being collected.


    We introduced a lot of different hacking tools in this chapter, and now we summarize
    the common options with examples for your better understanding of the wonders
    this tool can do.


    In 4.0 and earlier versions, the default capture length was 68 bytes.This is enough
    for protocols as IP, TCP and UDP, but for protocols such as DNS and NFS, 68 bytes
    usually cannot hold a complete data packet.


    For example, when we grab DNS packets, we use the -s option (the version of tcpcdump
    on the test machine is 4.0).


    ```

    root@server : tcpcdump -s 192.132.112.11

    ```


    However, in the version after 4.0, the default capture length was changed to 65
    535 bytes, so we don''t have to worry about the capture length. -s, the serial
    number of TCP segment is displayed as absolute value, not relative value. -w,
    directs the output of tcpcdump to a file in a special format. And -r will read
    the packet information from the file and display it.


    In addition to using options, tcpcdump also supports expressions to further filter
    packets.Operands of tcpcdump expressions are divided into three types: type, direction
    and protocol.The following are introduced in turn in this section.Type will explain
    the meaning of the parameter immediately following it. All the types supported
    by tcpcdump include host, net, and portrange.


    They specify host name (or IP address), network address expressed by CIDR method,
    port number and port range respectively.For example, to grab data packets on the
    whole 1.2.7.0/255.253.231.0 network, you can use the following command.


    ```

    root@server : $ tcpcdump net 1.2.7.0/13

    ```'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Here, src specifies the sender of data packets, and dst specifies the destination
    of data packets.


    For example, to grab packets entering port 13111, you can use the following command:


    ```

    root@server : $ tcpdump dstport13111

    ```


    For example, to grab all the internet control message protocol, you can use the
    following command.


    ```

    root@server : $ tcpdump ICMP

    ```


    You can use it for several other protocols such as SMTP, FTP etc.


    Of course, we can also use logical operators to organize the above operands to
    create more complex expressions.The logical operators supported by tcpdump are
    exactly the same as those in programming languages, including (&&, or (||), not
    (!).


    For example, to grab IP data packets exchanged between host -laptop and hosts
    other than the source, we can use the following command.


    ```

    root@server : $ tcpdump IP host

    ```


    If the expression is complex, we can use parentheses to group them.However, when
    using parentheses, we either use backslash "\" to escape it, or enclose it in
    single quotation marks """ to avoid being interpreted by shell.


    For example, to grab packets from host 8.0.2.4 and destination port 3369 or 12,
    you can use the following command.


    ```

    root@server : $ tcpdump src 8.0.2.4 and (dstport 3369 or 12)

    ```


    In addition, tcpdump also allows direct use of some protocol fields in packets
    to'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'filter packets.For example, to grab only TCP synchronization segments, you
    can use the following command.


    ```

    root@server : $ tcpdump TCP [13]&2!=0

    ```


    Because the second bit of the 14th byte of TCP header is the synchronization flag
    we can get a lot of information from the data.Finally, the specific output format
    of tcpdump is not only related to protocols, but also related to protocols. We
    discussed the tcpdump output format of IP, TCP, ICMP, DNS and other protocols.For
    tcpdump output formats of other protocols, please refer to the manual of tcpdump,
    and this book will not repeat them.


    With this, we have completed a brief introduction to the popular network monitoring
    tool tcpdump. In the next section we will discuss about lsof, another popular
    network monitoring tool in Kali Linux with command examples. Follow along!


    # LSOF


    lsof(list open file) is a tool to list the file descriptors opened by the current
    system.Through it, we can know which file descriptors are opened by interested
    processes, or by which processes.


    The usage method of this option is:


    ```

    $ lsof -46] [protocol] [@ hostname | ipaddr] [:service | port]

    ```


    where 4 represents IPv4 protocol and 6 represents IPv6 protocol.Protocol specifies
    the transport layer protocol, which can be TCP or UDP. Hostname specifies the
    host name and Ipaddr specifies the IP address of the host. Service specifies the
    service name and Port specifies the port number respectively.


    For example, to display the socket file descriptors of ssh services connected
    to the host 192.168.1.108, you can use the command.


    ```

    root@server : $lsof-i@192.168.1.108:22

    ```'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'If no parameters are specified after the -i option, the lsof command will display
    all socket file descriptors.-u, displays all file descriptors opened by all processes
    started by the specified user and -c, displays all file descriptors opened by
    the specified command.


    For example, to see which file descriptors are opened by the websrv program, you
    can use the following command.


    ```

    root@server :$ lsof -c websrv-p

    ```


    To display all file descriptors opened by the specified process use the man command.-
    only the PID of the process with the target file descriptor turned on is displayed.We
    can directly take the file name as an argument of the lsof command to see which
    processes have opened the file.


    It can be seen from the code listing that the program files and dynamic libraries
    on the test machine are stored in the equipment "8,3".Among them, where "8" indicates
    that this is a SCSI hard disk,"3" indicates that this is the third partition on
    the hard disk, named sda3.


    The equipment corresponding to standard input, standard output and standard error
    output of websrv program is "136,3".Among them, "136" indicates that this is a
    fake terminal,"3" indicates that it is the third pseudo terminal, i.e ./dev/pts/3.


    For FIFO-type files, such as pipes and sockets, this file will display the address
    of a kernel reference file, or its inode number.If the file is displayed as "Ot"
    or "Ox", it means that it is an offset value, otherwise it means that it is a
    size.It is meaningless to define the file size for a character device or FIFO
    type file, so this file will display an offset value.


    For socket, it shows the protocol type, such as "TCP".Name, the name of the file.If
    we use the telnet command to initiate to the websrv server, when we execute the
    lsof command again,The following line will be added to its output.


    ```

    websrv63466shuang5gu IPv4 4428800tcp localhost: 13579-> localhost: 48215

    (ESTABLISHED).

    ```'
  merge: -1
