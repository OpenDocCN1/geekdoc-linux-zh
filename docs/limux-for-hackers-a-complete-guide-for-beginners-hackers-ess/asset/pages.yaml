  md: '# CHAPTER FIVE

    INSTALLATION PROCEDURES FOR LINUX


    LINUX SYSTEM INSTALLATION is diverse and flexible, and different installation
    methods can be selected according to different environments. Common installation
    methods include hard disk installation, U disk installation, network installation,
    and CD-ROM installation.


    # HARD DISK INSTALLATION METHOD


    The hard disk installation method is generally based on the Windows system. For
    example, if you want to install a dual system where Windows and Linux coexist
    or if the system does not have an optical drive, you can use the hard disk method
    to install.


    Attention:

    Because the file system format of Windows is completely different from that of
    Linux, it is absolutely impossible to install both Windows and Linux in one partition.
    Even if you do this, Linux cannot recognize the hard disk partition. This type
    of installation is usually not recommended for normal users. If you are using
    a low end system but need a high memory based operating system then we suggest
    you to Linux using Hard-disk installation.


    # U DISK INSTALLATION METHOD


    Today''s servers are generally not equipped with CD-ROM drives, and the installation
    speed of CD-ROM drives is slow, and a lot of time will be wasted when installing
    systems in batches. At this point, you can install the system'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'through a USB flash drive, which is a fast, cheap and efficient Linux installation
    method.


    First of all, the U disk is inexpensive and can be used in many ways. Secondly,
    all servers or PCs are basically equipped with a USB interface, and U disk installation
    is universal. Finally, the installation speed of U disk is very fast, which can
    save a lot of time. Therefore, the U disk installation of Linux is a current development
    trend. The next chapters in this module will introduce in detail the method of
    U disk installation of Linux using Rufus and Usb writer software.


    # NETWORK INSTALLATION METHOD


    When installing a single server or a small number of servers (no more than 10),
    the installation via U disk or CD-ROM can also be used, but if you want to install
    hundreds or even thousands of servers, this method is obviously unrealistic. So
    how quickly install it in the face of such a demand? Yes networks are the answer


    Network installation of Linux is generally an automated installation process in
    large quantities. The most common batch network installation tool is Kickstart,
    which is an unattended Linux system automatic installation tool.


    With Kickstart, system administrators can automatically complete the installation
    of Linux systems by creating an answer file. Its working principle is to generate
    a ks.cfg response file through various parameters that need manual intervention
    in the typical installation process.


    The installer only needs to tell Kickstart where the installation program reads
    the ks.cfg file, and then Kickstart will automatically complete the installation
    of the system according to the settings of this file.


    As the network installation needs the support of network services, it is difficult
    for beginners and therefore not described too much here. The following section
    focuses on installing Linux through CD-ROM and U disk.


    # INSTALLATION USING CD-ROM


