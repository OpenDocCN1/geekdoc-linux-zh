- img_proc: true
  md: 'As we are aware that Mint is a light weight Debian based system that can work
    even under low end based systems. Different Linux distros use different package
    managers. For example, Arch Linux which is a developer favorite Linux distro uses
    Pacman to install software.


    All the Debian based systems fundamentally use “apt” to install software. Apt
    is a simple package manager that tightly integrates all the components and installs
    them in the Linux machine using the instructions provided in the script file.


    # How does it work?


    When a software is called the first script file is downloaded and then the package
    manager will analyze all the components that are necessary for the system to function
    properly. If any component is already installed in the system it skips to the
    next one to download it. After all the components are installed the software will
    be packaged and installed within seconds into the Linux system.


    Here is a command:


    ```

    apt-get install python

    // This will download Python to the Linux system

    ```


    # HOW TO SEARCH PACKAGES?


    Apt almost provides all the famous packages that Linux enthusiasts and developers
    root for. However, there are a lot of third party packages that may not be available
    because of compatibility reasons.


    If you are trying to download a package and if not you are sure whether that package
    exists or not in the package manager then you can use the search command to find
    it. If you do not get any accurate results for your package name then it is evident
    that the apt is not supporting your package.


    Here is the command:


    ```

    root@server : apt-cache search Python4

    // This will search the apt repository and will display “no results” in the command
    line

    ```'
