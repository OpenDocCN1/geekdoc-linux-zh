    In fact, the partition size setting is related to the hard disk size. If the hard
    disk is large enough, ensuring that the system is sufficient without wasting space
    is the criterion for partitioning disks.


    The Mount point (mount point) can be selected by clicking the drop-down list,
    or can be filled in by yourself. Desired Capacity (partition size) such as 20GB
    can be directly filled in "20G", 500MB can be filled in "500M", And so on. After
    the setting is complete, click the Add mount point button to complete the addition
    of the mount point.


    5) After the mount point is successfully created, it will enter the interface.
    Click'
  merge: -1
