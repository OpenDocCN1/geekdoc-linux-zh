  md: '# CHAPTER TWO


    # CHOSING A LINUX DISTRO


    THE PREVIOUS CHAPTER has been a good introduction to the importance and philosophy
    of Linux as an operating system. There are many Linux distros at present and it
    can be an overwhelming task to select that one perfect distro. Even professionals
    struggle to maintain or use one Distro consistently. As far was we say, using
    a Linux distro that perfectly supports your preferences is best way. There may
    be popular ones but they will not please you until you know what you want.


    Here are some common Linux distributions:


    +   - Red Hat Linux


    Red Hat Linux is the earliest personal version of Linux released by Red Hat. Its
    1.0 version was released on November 3, 1994. Although its history is not as long
    as other famous Linux distributions, it has a much longer history than many newer
    Linux distributions.


    Since the release of Red Hat 9.0, Red Hat no longer develops desktop Linux distribution
    kits. Red Hat Linux has stopped development and concentrated all its efforts on
    the development of the server version, which is the Red Hat Enterprise Linux version.
    On April 30, 2004, Red Hat officially stopped supporting Red Hat 9.0 version,
    which marked the official end of desktop Red Hat Linux. The original desktop Red
    Hat Linux distribution was merged with Fedora from the open source community to
    become the Fedora Core distribution.


    Red Hat is currently divided into two series: Red Hat Enterprise Linux, which
    is provided by Red Hat with paid technical support and updates, and the free Fedora
    Core developed by the community.'
