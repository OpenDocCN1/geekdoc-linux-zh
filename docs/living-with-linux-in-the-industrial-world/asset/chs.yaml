- "# 工业领域中的 Linux 生活指南\n\n\n\n\n\n\n## 关于作者\n\n![ ](img/author.png)\n\nElaiya Iswera\
  \ Lallan 先生在过去的 12 年中一直从事 IT 行业。他是 Blue Micro Solutions 的董事总经理，该公司位于 SIRIM Bhd（政府机构）。\n\
