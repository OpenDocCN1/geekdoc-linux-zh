    ssl` commands to debug.


    ## What OpenSSL ?


    `OpenSSL` is a cryptography toolkit implementing the Secure Sockets Layer (`SSL
    v2/v3`) and Transport Layer Security (`TLS v1`) network protocols and related
    cryptography standards required by them.


    ## OpenSSL Usage


    *   Creation and management of private keys,public keys and parameters

    *   Public key cryptographic operations

    *   Creation of `X.509` certificates, `CSRs` and `CRLs`

    *   Encryption and Decryption with `Ciphers`

    *   SSL/TLS Client and Server Tests


    ## Types of Encryption Algorithm


    ### AES


    `AES` has been adopted by the U.S. government and is now used worldwide. It supersedes
    the Data Encryption Standard (`DES`). The algorithm described by `AES` is a symmetric-key
    algorithm, meaning the same key is used for both encrypting and decrypting the
    data.


    ### DSA


    The `DSA` is used by a signatory to generate a digital signature on data and by
    a verifier to verify the authenticity of the signature. Each signatory has a public
    and private key. The private key is used in the signature generation process and
    the public key is used in the signature verification process. For both signature
    generation and verification, the data (which is referred to as a message) is reduced
    by means of the Secure Hash Algorithm (`SHA`).


    ### RSA


    `RSA` involves a public key and a private key. The public key can be known to
    everyone and is used for encrypting messages. Messages encrypted with the public
    key can only be decrypted using the private key.


    ## What is Symmetric Key Encryption?


    Symmetric-key algorithms are a class of algorithms for cryptography that use the
    same cryptographic keys for both encryption of plaintext and decryption of ciphertext.


    Below is the diagram of Symmetric-key encryption:


    ![ ](Images/ClipboardImage.png)


    ## Symmetric Sample Commands


    ### Installation commands for Open SSL tool


    ```bash

    wget http://www.openssl.org/source/openssl-fips-ecp-2.0.1.tar.gz

    ./config

    make

    make install

    ```


    Note:Dont have to repeat the steps above if you have `OpenSSL` tool installed.


    For symmetic encryption, you can type the following command at the Linux Terminal:


    To encrypt:

    ```bash

    openssl aes-256-cbc -salt -a -e -in plaintext.txt -out encrypted.txt

    ```


    To decrypt this, you can use the following.


    ```bash

    openssl aes-256-cbc -salt -a -d -in encrypted.txt -out plaintext.txt

    ```


    ## What is Asymmetric Key Encryption


    In an asymmetric key encryption scheme, anyone can encrypt messages using the
    public key, but only the holder of the paired private key can decrypt. Security
    depends on the secrecy of the private key.


    Below is the diagram of asymmetric key encryption:


    ![ ](Images/ClipboardImage_ssl1.png)


    ### DSA SAmple Commands


    ### Installation commands for Open SSL tool


    ```bash

    wget http://www.openssl.org/source/openssl-fips-ecp-2.0.1.tar.gz

    ./config

    make

    make install

    ```


    Note:Dont have to repeat the steps above if you have `OpenSSL` tool installed.


    Now, for Asymmetric encryption you must first generate your private key and extract
    the public key. The below commands are utilizing `DSA` concepts of encryption.


    ```bash

    openssl dsaparam 1024 < /dev/random > dsaparam.pem

    ```


    Generate private key:

    ```bash

    openssl gendsa dsaparam.pem -out dsa_priv.pem

    ```


    Generate public key:

    ```bash

    openssl dsa -in dsa_priv.pem -pubout -out dsa_pub.pem

    ```


    Insert text into `foo.txt`:

    ```bash

    echo "foobar" > foo.txt

    ```


    Encrypt the `foo.txt`:

    ```bash

    sha1sum < foo.txt | awk ''{print $1}'' > foo.sha1

    ```


    Generate signature file:

    ```bash

    openssl dgst -dss1 -sign dsa_priv.pem foo.sha1 > sigfile.bin

    ```


    Verify the signature file:

    ```bash

    openssl dgst -dss1 -verify dsa_pub.pem -signature sigfile.bin foo.sha1

    ```


    ### DSA Signing Procedure


    ![ ](Images/ClipboardImage_ssl5.png)


    ## RSA Sample Commands


    ### Installation commands for Open SSL tool


    ```bash

    wget http://www.openssl.org/source/openssl-fips-ecp-2.0.1.tar.gz

    ./config

    make

    make install

    ```


    Note:Dont have to repeat the steps above if you have `OpenSSL` tool installed.


    Now, for Asymmetric encryption you must first generate your private key and extract
    the public key. The below commands are utilizing `RSA` concepts of encryption.


    ```bash

    openssl genrsa -des3 -out private123.key 4096

    ```


    ```bash

    openssl rsa -in private123.key -pubout > public123.key

    ```


    Once the private and public key is generated, then only the encryption and decryption
    command can be utilized.


    To encrypt:

    ```bash

    openssl rsautl -encrypt -pubin -inkey public123.key -in plaintext.txt -out encrypted.txt

    ```


    To decrypt:

    ```bash

    openssl rsautl -decrypt -inkey private123.key -in encrypted.txt -out plaintext1.txt

    ```

