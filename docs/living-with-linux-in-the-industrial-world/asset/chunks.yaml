    # Chapter 5: Handling of SSL Certificates


    `OpenSSL` for TLS/SSL usage and implementations. The `OpenSSL` `ssl` library implements
    the Secure Sockets Layer (`SSL v2/v3`) and Transport Layer Security (`TLS v1`)
    protocols.


    *   What is SSL and TLS?

