    Chapter 7: Overview of IPV6 vs IPV4


    The Internet has run out of Internet addresses. Perhaps you’ve heard the news:
    the last blocks of IPv4 Internet addresses have been allocated. The fundamental
    underlying technology that has powered Internet Protocol addresses since the Internet’s
    inception will soon be exhausted.


    A new technology will take its place, though. IPv4′s successor is IPv6, a system
    that will not only offer far more numerical addresses, but will simplify address
    assignments and additional network security features.


    The transition from IPv4 to IPv6 is likely to be rough, though. Most people are
    unfamiliar with IPv4 and IPv6, much less the potential impact the switch to IPv6
    may have on their lives.


    Introducing IPV6


    Here is a typical IPv4 address:


    192.168.0.1


    IPv4 address as a 32-bit value (2 power 4)


    And here is a IPv6 address format:


    2001:0db8:0000:0000:a526:2962:3960:c0e1


    IPv6 addresses have a size of 128 bits


    to 512 bits (2 power 8)


    IPv6 Zero-Compression


    Suppressing the leading zeros, the following IPv6 address:


    2001:0db8:0000:0000:0007:0062:0060:00e1


    becomes:


    2001:db8:0:0:7:62:60:e1


    To further shorten the address, we can also compress the largest "group" of all
    zeros to an empty group.


    2001:db8:0:0:7:62:60:e1


    becomes:


    2001:db8::7:62:60:e1


    IPv6 Network Prefixes


    In your dealings with IPv6 addresses, you will probably encounter what is known
    as the network prefix. A network prefix denotes how many leading bits (those nerdy
    1s and


    0s) are set aside for identifying the network for which the address is a member.
    This number is specified at the end of the textual representation of an address
    by "/n" where n is the number of bits.


    So for the address:


    2001:0db8:0000:0000:a526:2962:3960:c0e1/32


    we know from the "/32" that this address is a member of the 2001:0db8


    IPv6 Addresses as URLs


    To open a http connection to the host identified by 2001:db8::1234, we would type:


    http://[2001:db8::1234]/ or


    http://[2001:db8::1234]:3011/


    Recognizing Types of IPV6 Adresses


    The beginning of an address provides useful information. Apart from the link local
    prefixes, here are a few others :


    *   3FFE is the prefix of a 6Bone address. The 6Bone provides addresses and connectivity
    to whoever wants to experiment with IPv6.


    *   2002 is the prefix of a 6-to-4 address. 6to4 is an optional method of connecting
    IPv6 domains via IPv4 clouds. It provides a mechanism for assigning of an IPv6
    address prefix to a machine that has a global IPv4 address.


    *   2001 is the prefix of the first block of production addresses. http://www.dfn.de/service/ipv6/ipv6aggis.html
    lists block assignations.


    *   FEC0 is the prefix of a site local address. Site local addresses are the equivalent
    of a private IPv4 address.


    *   FF02::1 is address that multicasts to all nodes on the LAN.


    *   FF02::2 is address that multicasts to all routers on the LAN.


    IPV6 Commands in Linux


    Type the following command below at putty tool:


    ping6 -I eth0 fe80::21b:63ff:feab:e6a6


    ![ ](Images/ip61.png)


    Below are some basic commands to test IPV6:


    cat /proc/net/if_inet6


    route -A inet6


    ping6 -c4 -I eth0 ff02::1 - check all ipv6 available machine around ip -6 neigh
    show - check arp table


