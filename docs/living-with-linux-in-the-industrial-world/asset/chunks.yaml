    An X.509 certificate binds a name to a public key value. The role of the certificate
    is to associate a public key with the identity contained in the X.509 certificate.


    ### Integrity of the public key


    Authentication of a secure application depends on the integrity of the public
    key value in the application’s certificate. If an impostor replaces the public
    key with its own public key, it can impersonate the true application and gain
    access to secure data.


    To prevent this type of attack, all certificates must be signed by a certification
    authority (`CA`). A `CA` is a trusted node that confirms the integrity of the
    public key value in a certificate.


    ### Digital signatures


    A `CA` signs a certificate by adding its digital signature to the certificate.
    A digital signature is a message encoded with the `CA`’s private key. The `CA`’s
    public key is made available to applications by distributing a certificate for
    the `CA`. Applications verify that certificates are validly signed by decoding
    the `CA`’s digital signature with the `CA`’s public key.


    ## Commands to Generate Certificates


    Below are step and commands to produce and practice `openssl` tool for producing
    certificates.


    #### Step 1: Generate a Private Key


    ```

    openssl genrsa -des3 -out server.key 1024

    ```


    #### Step 2: Generate a CSR (Certificate Signing Request)


    ```bash

    openssl req -new -key server.key -out server.csr

    ```


    #### Step 3: Generating a Self-Signed Certificate


    ```bash

    openssl x509 -req -days 365 -in server.csr -signkey server.key -out server.crt

    ```


    ### How do I verify that a private key matches a certificate?


    To verify that a private key matches its certificate you need to compare the modulus
    of the certificate against the modulus of the private key.


    Please follow the below command to view the modulus of the certificate:


    ```bash

    openssl x509 -noout -modulus -in server.crt | openssl md5

    ```


    Please follow the below command to view the modulus of the private key:


    ```bash

    openssl rsa -noout -modulus -in server.key | openssl md5

    ```


    #### Remove Passphrase from Key:


    ```bash

    cp server.key server.key.org

    openssl rsa -in server.key.org -out server.key

    ```


    ## Chapter 6: Network Packet Tracing


    Packet sniffing is a process of acquiring any data passed over the local network
    and looking for any information that may be useful for spying. Mostly system administrators
    use packet sniffing to troubleshoot network problems (Eg. finding out why traffic
    is so slow in the network) or to detect intrusions or compromised password hacked
    workstations (Eg. A workstation that is connected to a remote machine on port
    6667 continuously when there is no IRC clients connected), and that is why this
    type of analysis originally was designed for network scanning.


    ### What is Wireshark


    Wireshark is a network packet analyzer. A network packet analyzer will try to
    capture network packets and tries to display that packet data as detailed as possible.
    You could think of a network packet analyzer as a measuring device used to examine
    what''s going on inside a network cable, just like a voltmeter is used by an electrician
    to examine what''s going on inside an electric cable.


    In the past, such tools were either very expensive, proprietetary, or both. However,
    with the advent of Wireshark, all that has changed. Wireshark is perhaps one of
    the best open source packet analyzers available today.


    ### Some intended purposes


    Here are some examples people use Wireshark for:


    * network administrators use it to troubleshoot network problems

    * network security engineers use it to examine security problems

    * developers use it to debug protocol implementations

    * people use it to learn network protocol internals


    ### Installation steps for Wireshark


    Type the commands below at Linux terminal:


    ```bash

    wget http://sourceforge.net/projects/wireshark/files/src/all -versions/wireshark-1.0.3.tar.gz/download

    gunzip -d wireshark-1.0.3.tar.gz

    tar -xvf wireshark-1.0.3.tar.gz

    ```


    Finally execute the wireshark tool by typing the below:


    ```bash

    tcpdump -i eth1

    ```


    ## Chapter 7: Overview of IPV6 vs IPV4


    The Internet has run out of Internet addresses. Perhaps you’ve heard the news:
    the last blocks of `IPv4` Internet addresses have been allocated. The fundamental
    underlying technology that has powered Internet Protocol addresses since the Internet’s
    inception will soon be exhausted.


    A new technology will take its place, though. `IPv4`’s successor is `IPv6`, a
    system that will not only offer far more numerical addresses, but will simplify
    address assignments and additional network security features.


    The transition from `IPv4` to `IPv6` is likely to be rough, though. Most people
    are unfamiliar with `IPv4` and `IPv6`, much less the potential impact the switch
    to `IPv6` may have on their lives.


    ### Introducing IPV6


    Here is a typical `IPv4` address:


    `192.168.0.1`


    `IPv4` address as a 32-bit value (2 power 4)


    And here is a `IPv6` address format:


    `2001:0db8:0000:0000:a526:2962:3960:c0e1`


    `IPv6` addresses have a size of 128 bits to 512 bits (2 power 8)


    ### IPv6 Zero-Compression


    Suppressing the leading zeros, the following `IPv6` address:


    `2001:0db8:0000:0000:0007:0062:0060:00e1`


    becomes:


    `2001:db8:0:0:7:62:60:e1`


    To further shorten the address, we can compress the zeros: `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Prefixes


    The beginning of `IPv6` is known as the network prefix. `2001:0db8:0000:0000:a526:2962:3960:c0e1`
    is an example. `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Network Addresses


    In dealings with `IPv6` addresses, the `IPv6` prefix denotes the network. The
    `IPv6` addresses have a size of 128 bits. The `IPv6` is defacto successor of `IPv4`.
    The `IPv6` addresses have a size of 128 bits. The `IPv6` is the standard.


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Global Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Site Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Link Local Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Multicast Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Unique Local Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ### IPv6 Anycast Addresses


    `IPv6` addresses have a size of 128 bits. The `2001:0db8:0000:0000:0007:0062:0060:00e1`
    becomes `2001:db8:0:0:7:62:60:e1`.


    ## IPv6 Commands in Linux


    Type the following below at putty:


    ```bash

    ping6 -I eth0 fe80::21b:63ff:feab:e6

    ```


    Below are some basic commands to test `IPv6`:


    ```bash

    cat /proc/net/if_inet

    route -A inet6

    ping6 -c4 -I eth0 ff02::

    ip -6 neigh

    ```


