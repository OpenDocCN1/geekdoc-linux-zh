    IFTOP


    IFTOP listens to network traffic on a named interface, or on the first interface
    it can find which looks like an external interface if none is specified, and displays
    a table of current bandwidth usage by pairs of hosts. IFTOP must be run with sufficient
    permissions to monitor all network traffic on the interface.


    By default, IFTOP will look up the hostnames associated with addresses it finds
    in packets. This can cause substantial traffic of itself, and may result in a
    confusing display. You may wish to suppress display of DNS traffic by using filter
    code such as not port domain, or switch it off entirely, by using the -n option
    or by pressing n when the program is running.


    By default, IFTOP counts all IP packets that pass through the filter, and the
    direction of the packet is determined according to the direction the packet is
    moving across the interface. Using the -F option it is possible to get IFTOP to
    show packets entering and leaving a given network. For example, iftop -F 10.0.0.0/255.0.0.0
    will analyze packets flowing in and out of the 10.* network.


    Installation steps for IFTOP


    $ wget http://packages.sw.be/rpmforge-release/rpmforge-release-0.5.2-2.el5.rf.i386.rpm
    (32-bit system)


    $ sudo rpm -ivh rpmforge-release-0.5.2-2.el5.rf.i386.rpm


    $ sudo yum install iftop


    If you would like to build and install the latest version of iftop manually, do
    the following.


    $ yum -y install ncurses-devel libpcap-devel


    $ wget http://www.ex-parrot.com/~pdw/iftop/download/iftop-0.17.tar.gz


    $ tar xvfvz iftop-0.17.tar.gz


    $ cd iftop-0.17


    $ ./configure


    $ make


    $ sudo make install


    Just type iftop at your terminal.


