  raw: 'Normally shells are interactive. It means shell accept command from user and
    execute them. But if user uses command one by one, then user can store this sequence
    of command to text file and tell the shell to execute this text file instead of
    entering the commands. This is known as shell script.


    1\. Writing scripts and executing them


    2\. Basic commands


    3\. Shortcuts


    Understanding Linux Kernel


    Kernel is the main heart of Linux O/S. It handles resources of Linux O/S. The
    resources means are facilities available in Linux. For eg. Facility to store data,
    print data on printer,


    memory, file management etc . Kernel allocates who will use this resource, for
    how long and when. It executes your programs and it''s memory resident portion
    of Linux. It performance the following task:-


    1) I/O management


    2) Process management


    3) Device management


    4) File management


    5) Memory management


    Understanding Linux Shell


    Computer understand the language of 0''s and 1''s called binary language, In early
    days of computing, instruction are provided using binary language, which is difficult
    for all of us, to read and write. So in O/s there is special program called Shell.
    Shell accepts your instruction or commands in English and translate it into computers
    native binary language.


    You type your command and shell will convert it as it''s environment provided
    for user interaction. Shell is an command language interpreter that executes commands
    read from the standard input device (keyboard) or from a file. Linux may use one
    of the following most popular shells (In MS-DOS, Shell name is COMMAND.COM which
    is also used for same purpose, but it''s not as powerful as our Linux Shells are!)


    How to Run Shell Scripts


    Because of security of files, in Linux, the creator of Shell Script does not get
    execution permission by default. So if we wish to run shell script we have to
    do two things as follows:-


    (1) Use chmod command as follows to give execution permission to our script


    Syntax: chmod +x shell-script-name


    OR Syntax: chmod 777 shell-script-name


    (2) Run our script as


    Syntax: ./your-shell-program-name


    For e.g.


    $ ./first


    Here ''.''(dot) is command, and used in conjunction with shell script. The dot(.)
    indicates to current shell that the command following the dot(.) has to be executed
    in the same shell i.e. without the loading of another shell in memory. Or you
    can also try following syntax to run Shell Script


    Syntax: bash &nbsh;&nbsh; your-shell-program-name


    OR /bin/sh &nbsh;&nbsh; your-shell-program-name


    For e.g.


    $ bash first


    $ /bin/sh first


    Note that to run script, you need to have in same directory where you created
    your script, if you are in different directory your script will not run (because
    of path settings), For eg. Your home directory is ( use $ pwd to see current working
    directory) /home/vivek. Then you created one script called ''first'', after creation
    of this script you moved to some other directory lets say /home/vivek/Letters/Personal,
    Now if you try to execute your script it will not run, since script ''first''
    is in /home/vivek directory, to Overcome this problem there are two ways First,
    specify complete path of your script when ever you want to run it from other directories
    like giving following command


    $ /bin/sh /home/vivek/first


    Commands Related with Shell


    (1) echo [options] [string, variables...]


    Displays text or variables value on screen.


    Options


    -n Do not output the trailing new line.


    -e Enable interpretation of the following backslash escaped characters in the
    strings:


    \a alert (bell)


    \b backspace


    \c suppress trailing new line


    \n new line


    \r carriage return


    \t horizontal tab


    \\ backslash


    For eg. $ echo -e "An apple a day keeps away \a\t\tdoctor\n"


    (2) More about Quotes


    There are three types of quotes


    " i.e. Double Quotes


    '' i.e. Single quotes


    ` i.e. Back quote


    1."Double Quotes" - Anything enclose in double quotes removed meaning of that
    characters (except


    \ and $).


    2\. ''Single quotes'' - Enclosed in single quotes remains unchanged.


    3\. `Back quote` - To execute command.


    For eg.


    $ echo "Today is date"


    Can''t print message with today''s date.


    $ echo "Today is `date`".


    Now it will print today''s date as, Today is Tue Jan ....,See the `date` statement
    uses back quote, (See also Shell Arithmetic NOTE).


    (3) Shell Arithmetic


    Linux Shell Script Tutorial


    http://www.freeos.com/guides/lsst/shellprog.htm (5 of 19) [17/08/2001 17.42.21]


    Use to perform arithmetic operations For e.g.


    $ expr 1 + 3


    $ expr 2 - 1


    $ expr 10 / 2


    $ expr 20 % 3 # remainder read as 20 mod 3 and remainder is 2)


    $ expr 10 \* 3 # Multiplication use \* not * since its wild card)


    $ echo `expr 6 + 3`


    For the last statement not the following points


    1) First, before expr keyword we used ` (back quote) sign not the (single quote
    i.e. '') sign. Back quote is generally found on the key under tilde (~) on PC
    keyboards OR To the above of TAB key.


    2) Second, expr is also end with ` i.e. back quote.


    3) Here expr 6 + 3 is evaluated to 9, then echo command prints 9 as sum


    4) Here if you use double quote or single quote, it will NOT work, For eg.


    $ echo "expr 6 + 3" # It will print expr 6 + 3


    $ echo ''expr 6 + 3''


    Local and Global Shell Variable


    Normally all our variables are local. Local variable can be used in same shell,
    if you load another copy of shell (by typing the /bin/bash at the $ prompt) then
    new shell ignored all old shell''s variable. For e.g.


    Consider following example


    $ vech=Bus


    $ echo $vech


    Bus


    $ /bin/bash


    $ echo $vech


    NOTE:-Empty line printed


    $ vech=Car


    $ echo $vech


    Car


    $ exit


    $ echo $vech


    We can copy old shell''s variable to new shell (i.e. first shells variable to
    seconds shell), such variable is know as Global Shell variable. To do this use
    export command


    Syntax: export variable1, variable2,.....variableN


    For e.g.


    $ vech=Bus


    $ echo $vech


    Bus


    $ export vech


    $ /bin/bash


    $ echo $vech


    Bus


    $ exit


    $ echo $vech


    Operators


    Type bc at $ prompt to start Linux calculator program


    $ bc


    After this command bc is started and waiting for you commands, i.e. give it some
    calculation as follows type 5 + 2 as


    5 + 2


    7


    7 is response of bc i.e. addition of 5 + 2 you can even try


    5 - 2


    5 / 2


    Now what happened if you type 5 > 2 as follows


    5 > 2


    0


    0 (Zero) is response of bc, How? Here it compare 5 with 2 as, Is 5 is greater
    then 2, (If I ask same question to you, your answer will be YES) In Linux (bc)
    gives this ''YES'' answer by showing 0 (Zero) value. It means when ever there
    is any type of comparison in Linux Shell It gives only two answer one is YES and
    NO is other.


    To preserve sanity it is better to use only "double round bracket comparison"
    without using dollar sign prefix before variables. This flavor of the "double
    round bracket" construct is supported in bash and all implementations of ksh in
    major Unixes so it is perfectly portable. Here is short summary of operators for
    "double round bracket comparison"


    *   < is less than (within double parentheses). For example, (( a < b ))


    *   <= is less than or equal to (within double parentheses) (( a <= b ))


    *   > is greater than (within double parentheses)(( a > b ))


    *   >= is greater than or equal to (within double parentheses) (( a >= b ))


    Decision Statements


    If you use bash for scripting you will undoubtedly have to use decision statements
    a lot, for example for an if ... then construct or a while loop. The syntax of
    these conditions can seem a bit daunting to learn and use. This tutorial aims
    to help you understanding conditions in bash, and provides a comprehensive list
    of the possibilities. A small amount of general shell knowledge is assumed.


    While Loop Statements


    While Loop is executed as long as given condition is true. For eg. Above for loop
    program can be written using while loop as


    while [ condition ]


    do


    command1


    command2


    command3


    ..


    ....


    done


    Type the script below at Linux shell terminal


    $cat > nt1


    #!/bin/sh


    #


    #Script to test while statement


    ##'
