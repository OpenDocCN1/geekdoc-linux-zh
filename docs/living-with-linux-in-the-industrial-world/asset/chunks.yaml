    $ cat foo


    $ echo $?


    The cat command return zero(0) on successful, this can be used in if condition
    as follows, Write shell script as:


    $ cat > showfile


    #!/bin/sh


    #


    #Script to print file


    #


    if cat $1


    then


    echo -e "\n\nFile $1, found and successfully echoed"


    fi


    Now run it.


    $ chmod +x showfile


    $./showfile foo


    Here


    $ ./showfile foo


    Conditional Execution


    The control operators are && (read as AND) and || (read as OR). An AND list has
    the


    Syntax: command1 && command2


    Here command2 is executed if, and only if, command1 returns an exit status of
    zero. An OR list has the


    Syntax: command1 || command2


    Here command2 is executed if and only if command1 returns a non-zero exit status.
    You can use both as follows


    command1 && comamnd2 if exist status is zero || command3 if exit status is non-zero


    Here if command1 is executed successfully then shell will run command2 and if
    command1 is not successful then command3 is executed. For e.g.


    $ rm myf && echo File is removed successfully || echo File is not removed


    If file (myf) is removed successful (exist status is zero) then "echo File is
    removed successfully" statement is executed, otherwise "echo File is not removed"
    statement is executed (since exist status is non-zero)


    I/O Redirection and FIle Descriptors


    As you know I/O redirectors are used to send output of command to file or to read
    input from file. (See Input/Output redirection). Now consider following examples


    $ cat > myf


    This is my file


    ^D


    Above command send output of cat command to myf file


    $ cal


    Above command prints calendar on screen, but if you wish to store this calendar
    to file then give


    command


    $ cal > mycal


    Here sort command takes input from keyboard and then sorts the number, If we wish
    to take input from file give command as follows


    $ cat > nos


    10


    -20


    11


    2


    ^D


    $ sort < nos


    -20


    2


    10


    11


    First we have created the file nos, then we have taken input from this file and
    sort command prints sorted numbers. This is called input redirection.


    User Interface and Dialog Utility


    Good program/shell script must interact with users. There are two ways to this
    one is use command line to script when you want input, second use statement like
    echo and read to read input into variable from the prompt. For e.g. Write script
    as


    $ cat > userinte


    #


    # Script to demo echo and read command for user interaction


    #


    echo "Your good name please :"


    read na


    echo "Your age please :"


    read age


    neyr=`expr $age + 1`


    echo "Hello $na, next year you will be $neyr yrs old."


    Save it and run as


    $ chmod +x userinte


    $ ./userinte


    Your good name please :


    Vivek


    Your age please :


    25


    Hello Vivek, next year you will be 26 yrs old.


    User interface usually includes, menus, different type of boxes like info box,
    message box, Input box etc. In Linux shell there is no built-in facility available
    to create such user interface, But there is one utility supplied with Red Hat
    Linux version 6.0 called dialog, which is used to create different type of boxes
    like info box, message box, menu box, Input box etc. Now try dialog utility as
    follows :


    $ cat > dia1


    dialog --title "Linux Dialog Utility Infobox" --backtitle "Linux Shell Script\


    Tutorial" --infobox "This is dialog box called infobox, which is used\


    to show some information on screen, Thanks to Savio Lam and\


    Stuart Herbert to give us this utility. Press any key. . . " 7 50 ; read


    Save the shell script and run as


    $ chmod +x dia1


    $ ./dia1


    Chapter 3: Task Automation


    CronTab is a Linux system process that will execute a program at a preset time.
    To use cron the user must prepare a text file that describes the program that
    you want executed and the times that cron should execute them.


    *   What is a cron job?


    *   How to create a cron job?


    *   Executing cron job command


    *   Testing the cron job scripts


    Linux Crontab Format


    MIN HOUR DOM MON DOW CMD


    Table: Crontab Fields and Allowed Ranges (Linux Crontab Syntax)


    | Field | Description | Allowed Value |


    | MIN | Minute field | 0 to 59 |


    | HOUR | Hour field | 0 to 23 |


    | DOM | Day of Month | 1-31 |


    | MON | Month field | 1-12 |


    | DOW | Day Of Week | 0-6 |


    | CMD | Command | Any command to be executed. |


    Scheduling a Job For a Specific Time


    The basic usage of cron is to execute a job in a specific time as shown below.
    This will execute the Full backup shell script (full-backup) on 10th June 08:30
    AM.


    Please note that the time field uses 24 hours format. So, for 8 AM use 8, and
    for 8 PM use 20.30 08 10 06 * /home/ramesh/full-backup


    30 – 30th Minute


    08 – 08 AM


    10 – 10th Day


    06 – 6th Month (June)


    * – Every day of the week


    Schedule a Job For More Than One Instance (e.g. Twice a Day)


    The following script take a incremental backup twice a day every day. This example
    executes the specified incremental backup shell script (incremental-backup) at
    11:00 and 16:00 on every day. The comma separated value in a field specifies that
    the command needs to be executed in all the mentioned time.


    00 11,16 * * * /home/ramesh/bin/incremental-backup


    00 – 0th Minute (Top of the hour)


    11,16 – 11 AM and 4 PM


    * – Every day


    * – Every month


    * – Every day of the week


    Schedule a Job for Specific Range of Time (e.g. Only on Weekdays)


    If you wanted a job to be scheduled for every hour with in a specific range of
    time then use the following.


    Cron Job everyday during working hours


    This example checks the status of the database everyday (including weekends) during
    the working hours 9 a.m – 6 p.m


    00 09-18 * * * /home/ramesh/bin/check-db-status


    00 – 0th Minute (Top of the hour)


    09-18 – 9 am, 10 am,11 am, 12 am, 1 pm, 2 pm, 3 pm, 4 pm, 5 pm, 6 pm


    * – Every day


    * – Every month


    * – Every day of the week'
