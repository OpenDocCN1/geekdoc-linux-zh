    通常 shell（外壳）是交互式的。这意味着 shell 接受用户的命令并执行它们。但如果用户一个接一个使用命令，用户可以将这一系列命令存储到文本文件中，并告诉
    shell 执行该文本而不是手动输入命令。这被称为 shell 脚本（shell script）。


    ### 1. 编写并执行脚本

    ### 2. 基础命令

    ### 3. 快捷方式


    ## 理解 Linux 内核


    内核是 Linux 操作系统的核心。它处理 Linux 操作系统的资源。资源是指 Linux 中可用的设施，例如：存储数据的设施、在打印机上打印数据、内存、文件管理等。内核分配谁使用这些资源、使用多久以及何时使用。它执行你的程序以及
    Linux 的驻留部分。它执行以下任务：


    1) I/O 管理

    2) 进程管理

    3) 设备管理

    4) 文件管理

    5) 内存管理


    ## 理解 Linux Shell


    计算机理解由 0 和 1 组成的语言，称为二进制。在计算早期，指令是使用二进制语言提供的，这对于我们所有人来说都难以阅读和编写。因此，在操作系统中有一个名为
    Shell 的特殊程序。Shell 接受你用英语编写的指令或命令，并将其翻译成计算机的二进制语言。


    你输入命令，shell 会根据其提供的用户交互环境进行转换。Shell 是一种命令语言解释器，用于从标准输入设备（键盘）或文件中读取并执行命令。Linux
    可能使用以下最流行的 shell 之一（在 MS-DOS 中，Shell 的名称是 `COMMAND.COM`，用途相同，但它没有我们的 Linux Shell
    强大！）


    ## 如何运行 Shell 脚本


    由于文件的安全性，在 Linux 中，Shell 脚本的创建者默认没有执行权限。因此，如果我们想运行 shell 脚本，必须执行以下两件事：


    (1) 如下使用 `chmod` 命令为我们的脚本赋予执行权限


    语法：`chmod +x shell-script-name`


    或者语法：`chmod 777 shell-script-name`


    (2) 如下运行我们的脚本


    语法：`./your-shell-program-name`


    例如：


    $ `./first`


    在这里 `.`（点）是命令，与 shell 脚本配合使用。点(`.`) 表示当前 shell，点(`.`）之后的命令必须在同一个 shell 中执行，即无需在内存中加载另一个
    shell。你也可以尝试使用以下语法来运行 Shell 脚本


    语法：`bash your-shell-program-name`


    或者 `/bin/sh your-shell-program-name`


    例如：


    $ `bash first`


    $ `/bin/sh first`


    注意，要运行脚本，你需要在创建脚本的同一目录下，如果你在不同的目录，脚本将无法运行（因为路径设置的原因）。例如，你的主目录是（使用 `$pwd` 查看当前工作目录）`/home/vivek`。然后你创建了一个名为
    ''first'' 的脚本，创建后你移动到了另一个目录，假设是 `/home/vivek/Letters/Personal`。现在如果你尝试执行脚本，它将无法运行，因为脚本
    ''first'' 在 `/home/vivek` 目录下。为了解决这个问题有两种方法：首先，每当你从其他目录运行时，指定脚本的完整路径，例如输入以下命令：


    $ `/bin/sh /home/vivek/first`


    ## 与 Shell 相关的命令


    (1) `echo [options] [string, variables...]`


    在屏幕上显示文本或变量值。


    选项

    - `-n` 不输出末尾的新行符。

    - `-e` 启用对字符串中后续反斜杠转义字符的解释：

    - `\a` 警告（铃声）

    - `\b` 退格

    - `\c` 抑制末尾的新行符

    - `\n` 新行

    - `\r` 回车

    - `\t` 水平制表

    - `\\` 反斜杠


    例如：$ `echo -e "An apple a day keeps away \a\t\tdoctor\n"`


    (2) 关于引号更多


    有三种引号


    - `"` 即双引号

    - `''` 即单引号

    - `` ` `` 即反引号


    1. `"双引号"` - 双引号内的任何内容都会取消其字符的含义（`\` 和 `$` 除外）。

    2. `''单引号''` - 单引号内的内容保持不变。

    3. `` `反引号` `` 用于执行命令。


    例如：


    $ `echo "Today is date"`


    无法打印带有今天日期的消息。


    $ `echo "Today is `date`".`


    现在它将打印今天的日期，如 Today is Tue Jan ..，可以看到 `date` 语句使用了反引号（另见 Shell 算术备注）。


    (3) Shell 算术


    Linux Shell 脚本教程

    (5/19)


    用于执行算术运算。例如：


    $ `expr 1 + 3`


    $ `expr 2 - 1`


    $ `expr 10 / 2`

    $ `expr 20 % 3` # 余数读作 20 mod 3，余数为 2

    $ `expr 10 \* 3` # 乘法使用 `\*` 而不是 `*`，因为它是通配符

    $ `echo `expr 6 + 3``


    针对最后一条语句，而不是以下几点：

    1) 首先，在 `expr` 关键字之前，我们使用了 `` ``（反引号）符号而不是（单引号即 `''`）符号。反引号通常位于 PC 键盘上波浪号 (`~`)
    下方的按键，或者 TAB 键上方。

    2) 第二，expr 同样也结尾。

    3) 这里 expr 6 + 3 求值结果为 9，然后执行 echo


