    Normally shells are interactive. It means shell accept command from user and execute
    them. But if user uses command one by one, then user can store this sequence of
    command to text file and tell the shell to execute this text file instead of entering
    the commands. This is known as shell script.


    ### 1. Writing scripts and executing them

    ### 2. Basic commands

    ### 3. Shortcuts


    ## Understanding Linux Kernel


    Kernel is the main heart of Linux O/S. It handles resources of Linux O/S. The
    resources means are facilities available in Linux. For eg. Facility to store data,
    print data on printer, memory, file management etc . Kernel allocates who will
    use this resource, for how long and when. It executes your programs and it''s
    memory resident portion of Linux. It performance the following task:-


    1) I/O management

    2) Process management

    3) Device management

    4) File management

    5) Memory management


    ## Understanding Linux Shell


    Computer understand the language of 0''s and 1''s called binary language, In early
    days of computing, instruction are provided using binary language, which is difficult
    for all of us, to read and write. So in O/s there is special program called Shell.
    Shell accepts your instruction or commands in English and translate it into computers
    native binary language.


    You type your command and shell will convert it as it''s environment provided
    for user interaction. Shell is an command language interpreter that executes commands
    read from the standard input device (keyboard) or from a file. Linux may use one
    of the following most popular shells (In MS-DOS, Shell name is `COMMAND.COM` which
    is also used for same purpose, but it''s not as powerful as our Linux Shells are!)


    ## How to Run Shell Scripts


    Because of security of files, in Linux, the creator of Shell Script does not get
    execution permission by default. So if we wish to run shell script we have to
    do two things as follows:-


    (1) Use `chmod` command as follows to give execution permission to our script


    Syntax: `chmod +x shell-script-name`


    OR Syntax: `chmod 777 shell-script-name`


    (2) Run our script as


    Syntax: `./your-shell-program-name`


    For e.g.


    $ `./first`


    Here `.` (dot) is command, and used in conjunction with shell script. The dot(`.`)
    indicates to current shell that the command following the dot(`.`) has to be executed
    in the same shell i.e. without the loading of another shell in memory. Or you
    can also try following syntax to run Shell Script


    Syntax: `bash your-shell-program-name`


    OR `/bin/sh your-shell-program-name`


    For e.g.


    $ `bash first`


    $ `/bin/sh first`


    Note that to run script, you need to have in same directory where you created
    your script, if you are in different directory your script will not run (because
    of path settings), For eg. Your home directory is ( use `$pwd` to see current
    working directory) `/home/vivek`. Then you created one script called ''first'',
    after creation of this script you moved to some other directory lets say `/home/vivek/Letters/Personal`,
    Now if you try to execute your script it will not run, since script ''first''
    is in `/home/vivek` directory, to Overcome this problem there are two ways First,
    specify complete path of your script when ever you want to run it from other directories
    like giving following command


    $ `/bin/sh /home/vivek/first`


    ## Commands Related with Shell


