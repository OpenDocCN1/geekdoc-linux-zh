    ## Foreword


    This book is an introduction to writing Linux shell scripts and installation of
    certain important tools for industry usage.


    Topics included are the use of commands and shortcuts in shell scripting, monitoring
    of memory and CPU usages, SSL implementation, packet tracing and webservers in
    linux environment.


    This book was written based on real life industrial experience and practical usage.
    Plus before this book was produced a several advance linux trainings have been
    conducted by our experience linux practitioners to several organizations.


    ## Chapter 1: Linux Basic Commands


    The following commands are for new users or for beginners only. The purpose is
    you will become more familiar with your shell scripting and secondly, you need
    some of these command in your Shell script.


    ```

    $ date --help

    ```


    To see help or options related with `ls` command (Here you will screen by screen
    help, since help of `ls` command is quite big that can''t fit on single screen
    )


    ```

    $ ls --help | more

    ```


    Syntax: `command-name --help`


    Syntax: `man command-name`


    Syntax: `info command-name`


    See what happened when you type following


    ```

    $ man ls

    $ info bash

    ```


    ### Linux Commands List


    - `ls`: list files and directories

    - `ls -a`: list all files and directories

    - `mkdir`: make a directory

    - `cd directory`: change to named directory

    - `cd`: change to home-directory

    - `cd ~`: change to home-directory

    - `cd ..`: change to parent directory

    - `pwd`: display the path of the current directory

    - `cp file1 file2`: copy file1 and call it file2

    - `mv file1 file2`: move or rename file1 to file2

    - `rm file`: remove a file

    - `rmdir directory`: remove a directory

    - `cat file`: display a file

    - `less file`: display a file a page at a time

    - `head file`: display the first few lines of a file

    - `tail file`: display the last few lines of a file

    - `grep ''keyword'' file`: search a file for keywords

    - `wc file`: count number of lines/words/characters in file

    - `command > file`: redirect standard output to a file

    - `command >> file`: append standard output to a file

    - `command < file`: redirect standard input from a file

    - `command1 | command2`: pipe the output of command1 to the input of command2

    - `cat file1 file2 > file0`: concatenate file1 and file2 to file0

    - `sort`: sort data

    - `who`: list users currently in


    ## HTOP Tool


    This is `htop`, an interactive process viewer for Linux. It is a text-mode application
    (for console or X terminals) and requires ncurses.


    ![ ](Images/ClipboardImage_htop)


    ### Comparison between htop and top


    - In `htop` you can scroll the list vertically and horizontally to see all processes
    and complete command lines.

    - In `top` you are subject to a delay for each unassigned key you press (especially
    annoying when multi-key escape sequences are triggered by accident).

    - `htop` starts faster (`top` seems to collect data for a while before displaying
    anything).

    - In `htop` you don''t need to type the process number to kill a process, in `top`
    you do.

    - In `htop` you don''t need to type the process number or the priority value to
    renice a process, in `top` you do.

    - `htop` supports mouse operation, `top` doesn''t.

    - `top` is older, hence, more used and tested.


    You can interact with the htop using mouse. You can scroll vertically to view
    the full process list, and scroll horizontally to view the full command line of
    the process.


    Installation command for HTOP tool:


    ```

    wget http://packages.sw.be/rpmforge-release/rpmforge-

    release-0.5.2-2.el5.rf.i386.rpm

    rpm -Uhv rpmforge-release*.rf.i386.rpm

    ```


