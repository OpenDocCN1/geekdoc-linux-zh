    and was involved in the ISO9000:2001certification for the company. With his extensive
    working experience and good track record of able to handle mega IT projects in
    government sector, Mr Lallan managed to join the incubatorship program under SIRIM
    Bhd in February 2010\. With this Mr Lallan moved Blue Micro Solutions’ operations
    into the SIRIM building. He obtained certification from Ministry of Finance in
    Malaysia in the software fields where he can participate in tenders for government
    IT projects. He also started employing staffs to do IT projects and ventured into
    IT trainings in private corporations, government institutions and polytechnics,
    such as SKALI Bhd, Kolej Komuniti in Klang, Politeknik Ungku Omar in Ipoh and
    Politeknik Kuching in Sarawak. He has made Blue Micro Solutions to be a certified
