    ## Chapter 4: Port Checking


    Linux has a lot of tools to check which ports are open, the most common is `nmap`
    which is a command line tool, but also exist a Graphical frontEnd for it if the
    user prefer that way.


    1) Basic understanding of TCP and UDP protocol

    2) Techniques to find out which process uses which port number, directory, owner,
    etc

    3) Overview of rootkits to find out the processes that are really running


    ### Understanding of TCP and UDP Ports


    As you know every computer or device on the Internet must have a unique number
    assigned to it called the IP address. This IP address is used to recognize your
    particular computer out of the millions of other computers connected to the Internet.
    When information is sent over the Internet to your computer how does your computer
    accept that information? It accepts that information by using `TCP` or `UDP` ports.


    An easy way to understand ports is to imagine your IP address is a cable box and
    the ports are the different channels on that cable box. The cable company knows
    how to send cable to your cable box based upon a unique serial number associated
    with that box (`IP Address`), and then you receive the individual shows on different
    channels (`Ports`).


    Ports work the same way. You have an IP address, and then many ports on that IP
    address. You can have a total of 65,535 `TCP` Ports and another 65,535 `UDP` ports.
    When a program on your computer sends or receives data over the Internet it sends
    that data to an ip address and a specific port on the remote computer, and receives
    the data on a usually random port on its own computer. If it uses the `TCP` protocol
    to send and receive the data then it will connect and bind itself to a `TCP` port.
    If it uses the `UDP` protocol to send and receive data, it will use a `UDP` port.
    Figure 1, below, is a represenation of an IP address split into its many `TCP`
    and `UDP` ports. Note that once an application binds itself to a particular port,
    that port can not be used by any other application. It is first come, first served.


    ## Network Mapper(NMAP)


    `NMAP` ("Network Mapper") is a free and open source utility for network discovery
    and security auditing. Many systems and network administrators also find it useful
    for tasks such as network inventory, managing service upgrade schedules, and monitoring
    host or service uptime. `NMAP` uses raw IP packets in novel ways to determine
    what hosts are available on the network, what services (application name and version)
    those hosts are offering, what operating systems (and OS versions) they are running,
    what type of packet filters/firewalls are in use, and dozens of other characteristics.
    It was designed to rapidly scan large networks, but works fine against single
    hosts. `NMAP` runs on all major computer operating systems, and official binary
    packages are available for Linux, Windows, and Mac OS X.


    ### Installation steps for NMAP


    1) Install `libpcap` library


    ```bash

    wget http://www.tcpdump.org/release/libpcap-0.9.4.tar.gz

    ./configure --prefix=/usr && make

    make install

    ```


    #### What is libpcap?

    Monitoring software may use `libpcap` to capture packets travelling over a network
    and, in newer versions, to transmit packets on a network at the link layer, as
    well as to get a list of network interfaces for possible use with `libpcap`.


    2) Install NMAP and command usage


    ```bash

    rpm -vhU http://nmap.org/dist/nmap-4.68-1.i386.rpm

    nmap -sS 127.0.0.1

    ```


    ### Type of NMAP Scan Commands


    - `-sS` (TCP SYN scan)

    - `-sT` (TCP connect scan)

    - `-sU` (UDP scans)

    - `-sY` (SCTP INIT scan)

    - `-sN; -sF; -sX` (TCP NULL, FIN, and Xmas scans)

    - `-sA` (TCP ACK scan)

    - `-sW` (TCP Window scan)

    - `-sM` (TCP Maimon scan)

    - `-sZ` (SCTP COOKIE ECHO scan)

    - `-sI <zombie host>[:<probeport>]` (idle scan)

    - `-sO` (IP protocol scan)

    - `-b <FTP relay host>` (FTP bounce scan)


    ### Sample Output from NMAP Tool


    ```text

    [root]# nmap -sS 127.0.0.1


    Starting Nmap 4.01 at 2006-07-06 17:23 BST

    Interesting ports on chaos (127.0.0.1):

    (The 1668 ports scanned but not shown below are in state: closed)


    PORT STATE SERVICE

    21/tcp open ftp

    22/tcp open ssh

    631/tcp open ipp

    6000/tcp open X11

    ```

