    SSL (Secure Sockets Layer) is the standard security technology for establishing
    an encrypted link between a web server and a browser. This link ensures that all
    data passed between the web server and browsers remain private and integral. SSL
    is an industry standard and is used by millions of websites in the protection
    of their online transactions with their customers.


    To be able to create an SSL connection a web server requires an SSL Certificate.
    When you choose to activate SSL on your web server you will be prompted to complete
    a number of questions about the identity of your website and your company. Your
    web server then creates two cryptographic keys which known as Private Key and
    Public Key.


    Differences between TLS and SSL


    Although there are some slight differences between SSL 3.0 and TLS 1.0, this reference
    refers to the protocol as TLS/SSL.


