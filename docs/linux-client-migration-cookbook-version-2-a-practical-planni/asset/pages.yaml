    http://www.ibm.com/software/tivoli


    # Open Country OCM Suite


    Open Country provides an enterprise level management tooling platform. It addresses
    many traditional large enterprise system management requirements. Some of those
    include: provisioning, system management, monitoring, updates, and asset tracking.
    For more information, see:


    http://www.opencountry.com


    # OpenNMS


    OpenNMS is an open source distributed enterprise network and system management
    platform. The OpenNMS framework is SNMP-based and handles discovering network
    nodes and services, polling for their availability, and recording the system information
    for immediate use or creating thresholds. OpenNMS also gathers and reports network
    and service events. For more information about the project, to view a demo, or
    to download the itself, refer to the OpenNMS Web site:


    http://www.opensms.org


    # SBLIM


    SBLIM is an acronym for Standards-Based Linux Instrumentation for Manageability.
    This open source project provides standard Web-Based Enterprise Management (WBEM)
    components. The goal of this project is to provide a complete Open Source implementation
    of a WBEM-based management solution for Linux. WBEM-based management is a growing
    method of managing clients using a object-based approach defined by the Distributed
    Management Task Force (DMTF).


    The SBLIM components or packages help to provide a unified management strategy
    among Linux clients with distribution specific configuration files and management
    tools. It also provides an abstraction to len simplification of common management
    tasks. The result is a common management method for handling system management
    tasks across different Linux clients.


    You can read more about SBLIM project, the available packages, and the underlying
    technology at the SBLIM Web site:


    http://sblim.sourceforge.net'
