    # Sabayon


    Sabayon is a graphical systems administration tool that can be used to manage

    GNOME desktop configuration settings. Sabayon brings a new approach to

    policy editing. Instead of providing a pre-built GUI to edit each of the settings,

    Sabayon launches a nested X session that runs an entire GNOME desktop

    environment (more information about X sessions can be found in 5.2.4,

    "Graphical and text-based environments" on page 118). Any settings changed in

    t nested environment are recorded, and at the end of the session, those

    settings can be applied to either the default or mandatory GConf stores. Sabayon

    also detects that local files have been edited, which is necessary for

    applications that do not use GConf, such as Mozilla Firefox or OpenOffice.org.

    Sabayon shows you a list of settings that have been changed, which you can

    save as default or mandatory settings.


    More information about Sabayon can be found at:


    ```

    http://www.gnome.org/projects/sabayon

    ```


    As an example, graphic designers need a profile which contains a shortcut to

    The GIMP on the panel and has your company''s Web site as the home page. To

    create this type of profile through Sabayon, simply add a new profile, then click

    **Edit**. In the nested session that appears, a shortcut to The GIMP on

    panel, then launch Firefox and set the home page. As seen in Figure 7-6 on

    page 154, Sabayon then shows the two changes that have occurred, which you

    can save as default or mandatory settings.'
  merge: -1
