- pgno: 147
  md: 'In the case where you want a graphical environment to start at the end of the
    boot process, display managers can be set up as an additional service that is
    started up. The display manager starts an Window Server and communicates with
    that server to display itself. The display manager normally provides a login screen
    for a desktop and allows users to choose which window manager desktop environment
    to use for their session if multiple choices are provided.


    The ability to choose one of the multiple display management environment options
    (that is, GNOME, KDE, and so forth) during the graphical login process significantly
    demonstrates the modularity and flexibility of Linux relative to Windows.


    The X Window system is essentially a client/server application. The labeling of
    the client and server components is at first non-intuitive. What would normally
    be seen as the client application (running on the local workstation or desktop)
    is called the X Server and the server applications (which can run remotely) are
    called X clients. The X-Windows architecture is shown schematically in Figure
    5-3 on page 121. The X Window Server program has control over the display and
    mouse+keyboard. The X client programs (in this case, Xterm and Xclock) run either
    on the local machine (machine A) or on a remote machine (machine B) and communicate
    with the X Server through sockets.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/23b949da14ff7bab8762f0f0361af394_148_0.png)


    Figure 5-3 Schematic X-windows architecture


    The X Window Server handles drawing images on the screen, using the correct video
    card and monitor displays. The X server also handles receiving input from devices
    such as a mouse and keyboard. X Window Servers follow a standard interface, called
    X11, so that any X server can receive input from an X client. This interface works
    over network sockets, even on the local machine (it is important to note that
    local sockets are not limited to network speeds though). This abstraction allows
    for X forwarding, where an X client on one machine can display on an X server
    on a different machine, with extra implementation necessary for the X client.


    Window managers are X client programs that control how other X clients are positioned,
    resized, or moved, see:


    http://xwinman.org


    Chapter 5. Linux architecture and technical differences 121'
