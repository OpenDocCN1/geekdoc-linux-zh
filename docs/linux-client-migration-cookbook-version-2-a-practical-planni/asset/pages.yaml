- pgno: 54
  md: '# 2.1 Why migrate


    For many business environments today, Linux-based client computers can already
    provide a fully functional and cost-effective alternative to Microsoft Windows.
    The decision whether or not to migrate in your environment depends on many factors.
    It is important that you carefully consider all of the technical and organizational
    challenges before making any decisions. There are many situations where, on technical
    merits alone, a Linux-based computing strategy is hard to beat. But in the broader
    analysis, a migration in these environments might still not be justifiable because
    of the high cost of overcoming organizational lock-in around an existing Windows-based
    environment.


    In this section, we focus on some of the differentiating aspects of a Linux-based
    computing strategy, presented as follows:


    +   - Desktop security (2.1.1, "Desktop security" on page 27

    - Costs: direct & indirect (2.1.2, "Costs related to Linux client" on page 22

    - Manageability of the Linux client solution (2.1.3, "Manageability of the Linux
    client" on page 34)

    - Client customization (2.1.4, "Client customization" on page 37)

    - OSS philosophy (2.1.5, "Free software and the open source philosophy" on page
    38

    - Ease of use (2.1.6, "Ease of use and retraining" on page 38)

    - Economies of scale (2.1.7, "New economies of scale" on page 38


    # 2.1.1 Desktop security


    You can easily write an entire book about the topic of comparing methods of securing
    Windows-based and Linux-based client systems. And, the technical landscape for
    comparing Windows with Linux is currently evolving rapidly.


    +   - The upcoming release of Windows Vista™ will significantly change how the
    Windows platform manages many security-related concerns from a user point of view.

    - The continuous improvement and wider adoption of SELinux. All versions of Red
    Hat Linux Version 5 and Red Hat Desktop Version 5 include SELinux as an optional
    security services layer, providing the latest methods for multi-level security
    controls (MLS)¹ that are needed in many environments where highly sensitive data
    is managed. New "targeted policies" are evolving that will allow for desktop-oriented
    security


    > ¹ For more information, see: The Path to Multi-Level Security in Red Hat Enterprise
    Linux: http://www.redhat.com/f/pdf/sec/path_to_mlsec.pdf'
