    # Deployment considerations


    This section examines various deployment considerations relating to multi-station
    systems. In general, multi-station computers are best deployed in environments
    where the shared system''s CPU and memory usage are not expected to be intensive,
    such as in most fixed function or provisioned office systems where each user runs
    a limited number of concurrent applications.


    For general office deployments where the primary computer uses of an e-mail client,
    several Web browser and office suite windows, and perhaps a data entry or terminal
    emulation application, the processing, storage, and networking capabilities of
    ever modestly equipped computers far exceed the demands of individual users.


    # Storage, printing, and external service considerations


    The basic requirements for deploying multi-station desktop Linux systems differ
    little from those deploying standard-PC environments. Few or no adjustments to
    print, and other network services are necessary to accommodate access from multi-station
    computers. In both single and multi-user variations of the desktop Linux environment,
    the use of local storage for persistent data such as user documents is discouraged
    in favor of centralized, managed storage.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Remote file systems


    Users of multi-station Linux desktops require access to remote file systems in
    the same manner that users of single-user Linux desktops do.


    Access to remote file systems is implemented in the underlying Linux operating
    system, which is multi-user aware, rather than in X or the desktop environment,
    posing few additional challenges for multi-station Linux desktop deployments.
    in the majority of cases where remote file systems are accessed on a per user
    basis (rather than per workstation), those file systems can be securely and privately
    mounted by individual users on a multi-station Linux system in the same fashion.


    Because most storage deployed according to best practice are already multi-user
    aware, and because such awareness is not a characteristic of the physical layers
    of connectivity, adjustments to file and print management are typically not required
    to accommodate access from multi-station computers.


    Multi-station Linux desktops use the same standard authentication or directory
    services (such as NIS, LDAP, or local authentication) as those provided for single
    Linux desktops.


    # Network services


    Most network-enabled services are unaffected by consumption from clients using
    multi-station computers. For example, in a UNIX-type network environment, sockets
    and client/server connections are all multi-user aware and many services can be
    accessed by clients behind a NAT router or firewall. Most services do not need
    to be reconfigured to accept multiple client connections from a single IP address,
    in either single or multi-station configurations.


    > Note: Users on a particular multi-station system share a single IP address in
    the default configuration, although integrated solutions such as Desktop Server
    and DiscoverStation can optionally bind unique IP addresses to individual users.
    Be sure to review any applications that depend on unique IP addresses for identification
    purposes for possible issues.


    # Network, electrical, and physical infrastructure considerations


    Multi-station computers substantially reduce network, electrical, and physical
    infrastructure requirements, resulting in substantial management and cost savings
    in all areas.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Network infrastructure requirements


    Deploying multi-station Linux rewards the advantage of simpler network configurations
    with fewer IP addresses and network devices to manage.


    In most multi-station deployment scenarios, a standard 100 Mbps Ethernet connection
    to the multi-station computer provides sufficient bandwidth for all users to access
    network-based data. Although each individual multi-station computer can conceivably
    require as much bandwidth as individual workstations do for the same number of
    users, it is frequently the case that users are fully productive on less than
    1 Mbps of bandwidth, as evidenced by the success of telecommuting over home broadband
    connections.


    We recommend gigabit network connections to the multi-station systems if many
    users are expected to simultaneously access bandwidth-intensive resources such
    as streaming video or large file access. IntelliStation and most other workstation-class
    PCs include an integrated gigabit network interface, providing sufficient bandwidth
    for each user on the system without noticeable network lag.


    # Electrical requirements


    Traditional single-station workstations such as IntelliStation require approximately
    550 W per user, with the computer consuming 450-500 W and the LCD monitor consuming
    50 W through a total of two electrical outlets. A five station configuration reduces
    this requirement to under 150 W per user, eliminating 400 W of consumption and
    one electrical outlet per user sharing the multi-station computer. For new deployments,
    the reduced power consumption of multi-station systems can lead to substantial
    savings in facility upgrade costs and reduced power consumption.


    Consult your workstation and display manuals for detailed power requirements.


    # Office layout


    Multi-station configurations are best suited to office environments where users
    work in proximity, for example, open plan offices where cables and stations can
    be easily installed. Multi-station configurations are less suited for enclosed
    office deployments because the cabling and distance requirements become technically
    challenging. Extension cables and KVM over copper solutions help to enable effective
    multi-station deployments in otherwise restrictive office layouts. Multi-user,
    multi-display configurations are spatially suited to almost any office or production
    environment. The small footprint of modern LCD monitors allows at least two moderately
    sized monitors to occupy the physical desktop space of a traditional CRT monitor.'
  merge: -1
  img_proc: true
