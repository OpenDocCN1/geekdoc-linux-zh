- pgno: 294
  md: 'We describe each of these concepts in some detail the ZENworks Linux management
    context. Some of these same terms exist as a concept in the satellite server as
    well (“RHN Terminology” on page 259), but might have a slightly different meaning.


    # Machine


    Machine is the term used for a client system. The ZENworks server collects a lot
    of information about the system through the zmd daemon. This information can be
    used to search machines, but also to create sets on which to perform transactions.


    # Group


    A group of machines is a collection of machines that can share certain properties,
    such as administrators or channels. The group is used to segment an enterprise
    into smaller entities, for example, to limit the scope of administrators.


    # Machine set


    The machine set is like a group. Only one set exists and it is populated from
    all machines manually or by a search on properties of the machines. The machine
    set can contain all machines with a certain graphics card, or all machines needing
    a specific update and not having installed it yet. The set is a very powerful
    mechanism to perform a change across the enterprise.


    # Channel


    A channel is a collection of RPM packages or package sets for a specific distribution
    or architecture. The package set is a collection of packages that is handled by
    ZENworks as a single package. It can have a version and dependencies.


    # Transaction


    Transactions are generally updates that can be performed on machines, groups,
    or the machine set. The transactions can be scheduled. A feature in ZENworks,
    for example, is the ability to do a “dry run” of a transaction on the server to
    decrease the load on client machines.


    # Activation key


    The activation key is the primary mechanism to register machines in ZENworks.
    The key is generated and certain properties are given to the key, such as groups,
    channels, and administrators. When a machine is activated using this key, it gets
    all these properties automatically in ZENworks. So the activation key used to
    activate the client or less sets its role in the organization.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'This section describes standard actions in the ZENworks Linux management server.
    This shows a small example of how the tool works and what it can do. describe
    these actions:


    +   - Creating a group

    - Adding a channel with packages

    - Creating an administrator

    - Adding an activation key


    An evaluation of ZENWorks Linux management can be obtained from:


    http://download.novell.com


    On first login using the administrator account, the Web page of ZENworks management
    looks looks similar to the window in Figure B-5 on page 269.


    Different areas of the server are reached through navigation links on the left
    side of the page. These links are present on all pages to enable quick navigation
    through the Web-enabled administration of the ZENworks Linux management server.


    # Creating a group


    A group is created by going to the Group administration page. After selecting
    New Groups, the necessary information is entered on the next page. After saving
    this page, the Edit page for the new group is reached. Through the tabs on this
    page, it is possible to edit all of the properties of the group, for example,
    administrators or channel permissions.


    # Adding a channel with packages


    To work with this, we go to the Channel administration page. Once there, click
    the Create New link and on the next page, enter the Name, Description, and Alias
    for the new channel. After saving the new channel, the Edit page for this channel
    is shown. To add a package to the channel, we click the Add Package link. Saving
    this page adds the package for the selected platforms to the channel.


    # Create an administrator


    First, go to the Account administration page. Once there, follow the link Create
    new administrator and fill in the needed information. Saving this information
    displays the Edit page, where the groups and channels that the administrator wants
    to administer can be added to the new administrator.


    # Usage examples'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Add an activation key


    The activation pages are not mentioned in the navigation menu. To get there, you
    go to Server, and on that page, choose Activation codes. You then get the Activation
    administration page. Here you can create either a reusable or single-use activation.
    The single-use activation becomes invalid after one machine has been activated
    using that code. The reusable activation key can be used many times and is the
    ideal to activate copy of systems with the same function. Following the Create
    New Reusable Activations link, we come to a page allowing you to enter the description
    and generate a value for the key. On the Edit page for the activation key, we
