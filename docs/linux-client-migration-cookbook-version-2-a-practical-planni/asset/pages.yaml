- pgno: 140
  md: 'Windows environment. For more information about these terms, refer to Appendix
    A, "Linux glossary for Windows users" on page 233.


    The Linux operating system contains the following components (as shown in Figure
    5-2 on page 114):


    # Linux kernel


    +   Provides a set of services or kernel features to applications allowing them
    to run. Device drivers and modules can be added to the kernel to expand these
    services. The kernel also supports concepts such as multitasking and a multi-user
    environment.


    # Devices


    A device is an entity within the operating system that forms the interface to
    hardware. The device driver handles translation of operations on the device in
    the operating system to physical actions in the hardware.


    # Modules


    A module is dynamically loadable or unloadable kernel code that provides a service,
    such as a device driver. Modules provide the ability for the kernel to interface
    with hardware, making the hardware functionality available for use by the kernel
    or user space applications. Once a module is loaded into the kernel, it is considered
    part of the kernel, but it can be unloaded when not needed


    # Application level (user space)


    Environment where applications that make use of the kernel services run. This
    environment or user space can be a graphical or a command line-based user interface.
    An application has access to the kernel services through invocation of system
    calls.'
  merge: -1
  img_proc: true
