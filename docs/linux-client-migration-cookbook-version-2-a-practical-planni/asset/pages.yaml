    user interfaces for just about anything you want to change on the client system,
    including many things that would be useful for servers as well. The modules are
    grouped into different manageable areas, including Webmin, System, Servers, Networking,
    Hardware, Cluster, and Others.


    Just some of the modules supported:


    +   * Webmin

