    # ## 4.1.2 Assessing the client software configuration


    You need to complete a client software configuration survey of all client systems
    targeted for migration. The results of this survey will enable you to identify
    all applications, services, special configurations, and component support issues
    that need to be considered in the migration plan. This survey can shed light on
    technical support issues, such as hidden user IDs or scheduled tasks.


    Key questions:


    +   * Third-party applications are installed and used? This will result in a list
    of ISV applications including versions used and potential fixes applied.

    * In-house applications are installed and used? This will result in a list of
    applications developed and maintained within the company that might need to be
    ported to Linux or a platform-neutral environment.

    * What applications require access to data external to the client? This will result
    in a list of applications accessing file servers, application servers, Web databases,
    mainframes, and other implementations of data processing. See 4.4, "Migrating
    applications" for more details.

    * Are groups of users defined? How are they characterized? This should give you
    an overview as to whether there are some typical groups or users and, if so, how
    they are grouped. Grouping can be done by departments, applications used, type
    of work, or business responsibility. If a questionnaire is used when interacting
    with users, then this should become a kind of self-assessment.'
  merge: -1
  img_proc: true
