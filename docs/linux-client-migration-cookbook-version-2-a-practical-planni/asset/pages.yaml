- pgno: 375
  md: '# # Linux Client Migration Cookbook, Version 2

    ## A Practical Planning and Implementation Guide for Migrating to Desktop Linux


    For any organization that is exploring or planning for a Linux desktop migration


    The goal of this IBM Redbook is to provide a technical planning reference for
    IT organizations large or small that are now considering a migration to Linux-based
    personal computers. For Linux, there is a tremendous amount of "how-to" information
    available that addresses specific and very technical operating system configurations,
    platform-specific installation methods, user interface customizations, and so
    forth. This book includes some technical "how-to" as well, but the overall focus
    of the content in this book is to walk the reader through some important considerations
    and planning issues that you encounter during a migration project. Within the
    context of a pre-existing Windows-based environment, we attempt to present a more
    holistic, end-to-end view of the technical challenges and methods necessary to
    complete a successful migration to Linux-based clients.

    This version of the Linux Client Migration Cookbook builds on the content we started
    with the first version. Although anyone interested in using Linux on the desktop
    could benefit from different portions of this book, our primary audience for this
    book is business IT environments that need to begin an evaluation of desktop Linux,
    or in a broader sense, any organization whose strategy is to move toward greater
    adoption of open source software and standards.


    Provides in-depth detail on the technical and organizational challenges


    Includes methods for planning and implementation


    ![](img/23b949da14ff7bab8762f0f0361af394_375_0.png)


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Partners from around the world create timely technical information
    based on realistic scenarios. Our recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-6380-01  ISBN 037849691X'
