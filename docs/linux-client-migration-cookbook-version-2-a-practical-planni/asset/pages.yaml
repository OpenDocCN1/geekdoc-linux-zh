- pgno: 108
  md: 'While using a Windows XP theme with KDE or GNOME might seem like it would ease
    the transition to Linux, it is probably not a good idea, because users will expect
    exactly the same behavior they experienced with Windows, which could be quite
    confusing.


    ![](img/23b949da14ff7bab8762f0f0361af394_108_0.png)


    Figure-4-1 Theme Preferences dialog in GNOME


    # Application menu design


    Another standardization topic to consider is the application design. In enterprise
    environments, users do not need five different applications appearing in their
    menus that do basically the same thing. SUSE Linux Enterprise Desktop 10 takes
    this approach further, by limiting the total complexity in the root "Computer"
    menu to a few specific productivity applications plus a few entry points to some
    other frequent tasks. An example screen capture of the SLED 10 menu structure
    is shown in Figure 4-2 on page 82.


    > available at http://primates.ximian.com/~glesage/stuff/firefox/


    Chapter 4. Technical planning 81'
