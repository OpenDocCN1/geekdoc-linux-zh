    # From Server to Desktop: Linux Standard Base Engages Application Developers Worldwide


    The opportunities and the promise of LSB as a stabilizing force to build greater
    acceptance for Linux at the enterprise level, particularly on the desktop, substantial.


    For years, the open source development community has been engaged in the quest
    for a stable, unified, well-supported operating system (OS) — a reliable platform
    to provide the foundation for large-scale adoption at the enterprise level. While
    the UNIX* OS has fulfilled many of the requirements of large-scale organizations
    as a cost-effective, reliable server OS, its adoption at the desktop level has
    been less common within enterprises. Part of the reason for this is the relative
    lack of full-featured desktop applications that meet the requirements of large
    organizations. The varied nature of non-standardized Linux distributions makes
    it difficult or impossible to achieve a global reach while developing applications
    for the desktop — the variations are too numerous and the user base is fragmented.


    The efforts of the Free Standards Group (FSG) and Intel, as well as other committed
    members of the ecosystem, promise to create a wealth of new opportunities for
    application developers. The fragmentation and disunity that inhibited the potential
    of UNIX* stands as a lesson to the industry. To avoid the mistakes of the past,
    many of those who were strongly involved with the evolution of UNIX are committed
    to achieving standardization and wider acceptance for Linux OS. A positive step
    in that direction has been the emergence of Linux Standard Base (LSB) as a worldwide
    standard ratified by the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'International Standards Organization (ISO) and International Electrotechnical
    Commission (IEC). This landmark ratification points toward the emergence of a
    thriving, competitive Linux distribution ecosystem that will encourage greater
    innovation and increased market opportunities. Both software vendors (ISVs) and
    users benefit from the expanded options and increased flexibility in the selection
    of operating systems for the desktop environment. Now is an excellent time for
    software companies and developers to become engaged in advancing and improving
    LSB and producing innovative applications for this platform. The Linux Desktop
    Project, initiated in 2005 and discussed later in this paper, focuses on standardizing
    the Linux environment and establishing a commonality upon which developers can
    rely.


    # The current state of the Linux operating system desktop


    The substantial costs of porting applications impose a burden on developers targeting
    applications for various operating systems. Particularly in the case of Linux
    OS, ISVs have been forced to grapple with multiple distributions of the operating
    system, often supporting multiple versions of the kernel, libraries, and applications
    to reach a worldwide audience. To expand the availability of applications for
    the Linux OS platform and minimize the development tasks in porting applications,
    standardization is vital. The Free Standards Group was founded to bring together
    participants and establish a working standard for the Linux OS that addresses
    binary portability and application development concerns. This purpose was achieved
    with the ISO/IEC ratification of LSB, which brings balance and order to the creation
    of desktop applications for Linux.


    > From a market perspective, the state of the Linux Desktop OS is relatively immature,
    but a number of indicators show that the arc of innovative development for the
    desktop is rapidly increasing.


    The latest Linux OS desktop versions available today enable a very friendly user
    experience. Also, the addition of application suites, such as OpenOffice 2.0,
    provide a viable alternative to proprietary desktop tools.


    Jim Merlin, executive director of the FSG, described LSB in simple means a unified
    set of application interfaces (ABIs), software libraries, and interoperability
    standards that will enable developers to target a single Linux operating system,
    avoiding the need to port applications for multiple distributions. "However, having
    said that," Merlin continued, let''s talk a bit about market adoption and the
    availability of a broader set of applications on the desktop. The value of a given
    environment is proportional to the network effect that is created by the total
    number of users within that environment. In other words, the more people who can
    exchange information easily using a particular computing environment, the more
    valuable that computing environment is. ISVs want to'
  merge: -1
