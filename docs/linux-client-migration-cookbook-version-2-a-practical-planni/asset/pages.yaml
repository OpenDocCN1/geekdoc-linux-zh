- pgno: 137
  md: '# 5.1 What is Linux


    Linux is an operating system that was initially created by Linus Torvalds. He
    began his work in 1991 when he made available Release 0.02 of the kernel through
    a newsgroup on the Internet. Development continued, driven by a loosely coupled
    team of programmers and release 1.0 of the Linux kernel was made available in
    1994.


    The kernel''s main role is to supply an interface to the hardware and peripherals.
    It also manages the memory and schedules execution of processes. A lot of additional
    software is required to provide all of the functions expected from a complete
    operating system. Fortunately, open source developers, including IBM, have contributed
    time and effort to put all of the necessary pieces in place.


    Today, Linux is a fully functional, flexible, reliable, and free operating system
    that runs in many different hardware environments and on an extremely diverse
    set of architectures. Linux is all about the freedom to choose the features and
    configuration of your operating system


    Linux, both the kernel and associated software, is developed and distributed under
    the GNU General Public License (GPL) and its source code is freely available to
    everyone. The GPL means you can share and modify the software without being charged
    for it and it makes the software remains free of charge for everyone. For more
    information about the GPL, use following URL:


    ```

    http://www.linux.org/info/gnu.html

    ```


    For more information about the Free Software Foundation and the GNU project, refer
    to:


    ```

    http://www.fsf.org

    ```


    # 5.1.1 Distributions


    There are hundreds of distributions (commonly called distros) of the Linux operating
    system, available from sources all over the world. A distribution is a organization
    that packages an installable set of components including the Linux kernel, and
    makes it available to a broad audience. Most distributions have their feature
    set, and some are customized for special hardware configurations or for special
    purposes. Some well-known distributions are: Red Hat, Novell SUSE, Debian, Gentoo,
    and Mandriva. Although the operating system from these organizations is freely
    available, many sell retail versions that offer greater levels of support should
    need it.'
  merge: -1
  img_proc: true
