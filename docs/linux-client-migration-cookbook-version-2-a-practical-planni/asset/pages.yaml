- pgno: 110
  md: 'If your desktop environment needs to support both KDE and GNOME desktops, then
    you will want to ensure that both desktop environments have similar menu structures.
    Until recently, keeping a unified menu structure was difficult because KDE and
    GNOME used different format for menus. However, as KDE 3.3 and GNOME 2.12, both
    environments now support the freedesktop.org Menu Specification, available at:

    http://standards.freedesktop.org/menu-spec/latest


    #  4.3.4 User lockdown


    When setting up a Linux environment, there are several options for locking down
    workstations. While in a technical workstation, users can be given complete control
    over their workstations (by giving them the root password), most desktop environments
    would limit what a user can do.


    On many Linux distributions, some hardware and software features are limited based
    on group membership. For instance, there is often an audio group, and only members
    of this group have access to the sound card. There can also be a games group,
    where only members of this group can play any games installed on the system. Similar
    restrictions can be made to any hardware device or application on the system.


    You might want to limit what menu items are shown to the user, and what settings
    can be configured. More information about this topic can be found in 7.1, "Restricting
    the desktop" on page 140.


    #  4.3.5 Application choices


    One of many benefits of open source software is that it provides choices. However,
    sometimes these choices can be overwhelming. For some distributions install four
    text editors, five terminals, and six e-mail clients. A user who is new to Linux
    will not know which application to choose. Depending on the technical knowledge
    of the user, the number of applications available for each task should be limited.
    The majority of installations should only include one e-mail client, one Web browser,
    and probably only one desktop environment. However, if the users are used to more
    control over their desktops, they might resent some of the choices selected. This
    is another situation where user desires needs to be balanced against technical
    support considerations.


    #  4.3.6 File systems and partitions


    As discussed in 5.2.6, "Drives, partitions, and file systems" on page 123, Linux
    provides many more options of file systems and drive partitioning schemes. When
    configuring the standard desktop environment, drive partitioning is'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'homogeneous across the desktops. Also, locations for network share points should
    be standardized, for ease of technical support among other reasons. Because the
    new mount point configurations can confuse users, you might to add the old drive
    names in brackets when configuring desktop folder icons, that users will recognize
    their old environment.


    # 4.4 Migrating applications


    A migration path needs to be determined for each application that will be migrated
    to a Linux-based equivalent. Different migration paths will be necessary, because
    not all Microsoft Windows-based applications have Linux-based equivalents. Some
    example scenarios include:


    +   Bridging applications: These have native equivalents for both Microsoft Windows
    and Linux. See 3.2.1, "Bridging applications" on page 53, for the definition and
    importance of using bridging applications if possible.


    +   Similar applications: Applications that provide the same functionality and
    usually import data capabilities. For instance, OpenOffice.org provides word processing,
    spreadsheet, and presentation capabilities and can import Microsoft Office files.
    See 3.2.2, "Functionally equivalent utility applications" on page 54.


    +   Server-based applications: For an application that has no Linux-based equivalent.
    In this case, application servers provide some type of remote terminal service,
    and the Linux client then runs the application using a remote desktop application
    interface. See 3.2.4, "Building bridges to the server" on page 55.


    +   Web-based functional equivalent: Provide a platform-independent application
    interface that is browser-based. See 3.2.3, "Web applications" on page 55.


    # 4.4.1 Moving back to client/server computing


    When planning for a Linux-based client migration, it is possible that you might
    find compelling reasons to consider moving to a client/server computing architecture
    for certain application services. This consideration becomes especially evident
    when the Linux migration coincides with an application'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'migration to a Web services-based model (for example, moving from a PC-based
    application to an equivalent Web portal-based solution).


    Thus, we need to consider patterns for logical segmentation of workstation types,
    as discussed in the following section.


    # 4.4.2 Logical segmentation - Thin, slim, or fat


    Generally speaking, a major shift from an existing client computing environment
    can also trigger an expansion in workstation types that are used by the organization.


    For the purpose of this logical segmentation discussion, we define three major
    “types” of workstations, as follows:


    +   - Thin: Always connected; no local applications besides a displaying component,
    which could be either a Web browser or any other client component of a terminal
    services environment.


    +   - Slim: Intermittently connected; some applications running locally (that
    is, not requiring synchronous server connectivity). This could be any type of
    implementation of such components ranging from self-written client/server to Eclipse-based
    Java components in a portal-based solution.


    +   - Fat: Off-line capable; most applications are locally installed and run locally
    on the client.


    Within a client/server environment, Figure 4-3 on page 86 shows the progression
    from thin to fat, where the important difference is in how many layers of the
    application logic are hosted locally on the client.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 4.5 Client administration planning


    This section describes several methods for efficient administration of Linux clients.
    For a corporate network with more than twenty clients, it becomes impractical
    to install and maintain clients individually. An added advantage for maintenance
    of the Linux client is remote login is possible, either through SSH, telnet, or
    even an xternet connection.


    The topics discussed in this section have to do with administering installed clients
    after a migration. We do not discuss initial installation or rollout of the Linux
    clients in this section. Topics in this section are relevant to migration planning,
    because it is important to consider the impact of post-migration administrative
    tasks.


    At the end of the section, we highlight two enterprise desktop distributions to
    show how the administration issues are solved using tools provided by those products.


    > Planning tip: Even though this section provides details about daily administration
    tasks, after a migration, these topics are still relevant. It is extremely important
    to consider the impact of post-migration administrative tasks during migration
    planning.


    ![](img/23b949da14ff7bab8762f0f0361af394_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 4.5.1 Operating system and vendor distribution updates


    Keeping up with security concerns, and a constant stream of enhancements and bug
    fixes that are submitted by the OSS community as well as distribution vendors,
    means that there is an essentially continuous stream of updates and patches that
    are available. Methods for managing the process include:


    +   - Automate all operating system updates and patches.

    - Facilitate the operating system update process for the user.

    - Force critical operating system updates and patches when necessary.


    In the automatic update process, the operating system will be updated at regular
    intervals. This means that a client will never be "out-of-date". The process is
    completely out of the user''s control.


    When facilitating operating system updates for the user, the user needs to perform
    some action to update. One possibility is to put updates the corporate intranet
    and notify users to fetch and install them. This process can lead to clients with
    varied status, some up-to-date and some out-of-date.


    In both cases, a mechanism has to be in place that forces critical updates and
    patches. This can be an administrator running a script centrally, which contacts
    all remotely and forces an update using either the automated facility (casing
    it to run immediately instead of once a week) or the facilitated fetch and install
    method. This mechanism is needed in case of severe security problems where patches
    need to be applied immediately.


    A typical Linux distribution consists of a lot of parts that all have independent
    updates. This means that can be many different states of a client. Certainly a
    lot than under Windows, which generally aggregates fixes in service packs (even
    Windows updates are generally small service packs and include changes for multiple
    parts of the operating system). To be able to administer a larger pool of Linux
    clients, it is important to keep all at or less the same level and version. This
    means that the automated update process is preferred over the driven process.


    Most distributions have tools to do this automatically. Examples are:


    +   - Red Hat Network (update) tools on Red Hat Enterprise Linux; see "Administration
    of Red Hat Desktop" on page 91.

    - YaST online Update on SUSE Linux at:

    http://www.novell.com/coolsolutions/feature/11823.html

    - Novell ZENworks Linux Management.

    See: "Administration of Novell Linux Desktop" on page 93.

    - OSS alternative update management applications include apt and yum.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '> Planning tip: Automate operating system updates and patching to keep all
    clients at the same level. If possible, as a best practice you should maintain
    a private enterprise accessible repository of authorized updates.


    # 4.5.2 Application updates


    If the application is included with maintained as part of the distribution, the
    tools mentioned in the previous section can be used.


    When the application is not part of the distribution, there are several ways to
    approach the update:


    +   - Use scripts to fetch updated files and configurations from a network server.

    - Third-party applications, an update executable or script might be provided.

    - Build a package that can be handled by OSS tools such as apt and yum.

    - If the change is extensive and the client is thin, replace the entire client
    image with a new one.


    In early proof-of-concept tests and pilot migrations, most of the changes can
    (and will) be done manually. When the size of the Linux clients grows, this quickly
    becomes unfeasible, and more automated methods need to be put in place.


    > Planning tip: Plan to create an update mechanism during early proof-of-concept
    or pilot migration of the Linux client.


    Special care should be taken to make sure that the desktop and menu structure
    are not adversely impacted when updating (or may even removing) applications.
    The menu should keep pointing to existing applications to prevent stale menu items.
    Icons on the desktop should point to applications still available, and to the
    right version if multiple versions exist simultaneously.


    > Important: Always include desktop and menu structure in changes related to application
    updates. A successful update can appear failed, because the users are left with
    stale icons or menu items.


    # 4.5.3 Remote administration


    The Linux client supports various remote administration methods without to install
    extra software. An administrator can log on remotely through one of the standard
    mechanisms, for example, by using SSH. This enables the'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'administrator to analyze and fix problems remotely (except networking problems
    that prevent remote access). It also enables the administrator to remotely run
    scripts to monitor clients and gain data about the state of the clients.


    Monitoring of the clients is used to proactively prevent problems instead of reacting
    to users not able to work. It is used to detect problems with disks, memory, and
    CPU usage, or even with certain applications. There are several products and solutions
    available to monitor systems, from commercial products such as IBM Tivoli Software
    for OSS solutions as Nagios and Big Brother.


    # 4.5.4 Rollout of additional or replacement clients


    In a steady state situation (that is, after the initial rollout of Linux clients),
    there will still be requirements for on-going replacement and addition of client
    systems. For both tasks, there should always be an up-to-date system image that
    can be used to build the client. Some extra updates after installing the initial
    client should not be a problem, but building a new client should mean applying
    many updates after the initial image installation to bring it fully-to-date with
    the current supported image.


    When replacing a client, there are several things that have to be taken into account:


    +   * In the case of a thick client, personalization data has to be transferred
    from the old replaced client or restored from backup


    +   * Configuration files need to be copied over.


    +   * Care has to be taken that the old name for the system will not lead to extra
    unnecessary problems.


    +   * When using a new name on a replacement, make sure that the old name is removed
    from server-side configurations.


    > **Important:** In the case where windbind is used, take care to copy the windbind
    idmap file from the replaced client. Because this keeps track of domain user to
    uid and gid matching, this is very important for file ownership.


    On Hat Enterprise Linux systems the windbind idmap file is:


    ```

    /var/cache/samba/winbind_idmap.tdb

    ```


    On Novell Linux Desktop and SUSE Linux systems the windbind idmap file is:


    ```

    /var/lib/samba/winbind_idmap.tdb

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 4.5.5 Backup of clients


    Backup of the client is only important if there is data stored locally on the
    client. If all important data is kept on a reliably backed up server, then replacing
    a broken client just means resetting with a clean initial client image or install.


    If the client contains important application data, this has to be backed up. This
    is generally implemented in a client/server configuration where a client of the
    backup software is installed on the client that sends its data to the backup server.
    The backup server will then write the data to offline storage (such as a tape
    drive). One such product that supports Linux clients for this purpose is IBM Tivoli
    Storage Manager. As Manager,


    However, as stated before, some configuration and cache files are important and
