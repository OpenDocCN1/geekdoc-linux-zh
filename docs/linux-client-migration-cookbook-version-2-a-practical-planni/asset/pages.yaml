  md: 'The highlighted line in Example 9-14 on page 209 enables us to narrow the users
    from AD that can actually connect to the Linux client. PAM only accepts the user
    if the user is a member of the group unixgroup in AD.


    Since the PAM implementation of Linux distribution differs, we look at our test
    distributions in detail.


    # LDAP and PAM on Red Hat Desktop


    Red Hat has implemented the pam_stack module. This means that configuration files
    in /etc/pam.d/ can use settings from other files, essentially stacking settings.
    For this purpose, Red Hat has implemented most of the settings in the /etc/pam.d/system-auth
    configuration file. This means that we only have to add LDAP PAM modules to this
    file, and then, all applications using PAM are aware. The PAM module for LDAP
    is called pam_ldap.


    Since the /etc/pam.d/system-auth file is generated by authconfig, you must run
    this command after making changes.


    Example 9-15 A sample-auth file contains the lines in

    Example 9-15.Example of part of /etc/pam.d/system-auth file for LDAP authentication-


    ```

    #PAM-1.0

    # This file is auto-generated.

    # User changes will be destroyed the next time authconfig is run.

    auth required /lib/security/$ISA/pam_env.so

    auth sufficient /lib/security/$ISA/pam_unix.so leauth nullock

    auth sufficient /lib/security/$ISA/pam_ldap.so use_first_pass

    auth sufficient /lib/security/$ISA/pam_krb5.so use_first_pass

    auth required /lib/security/$ISA/pam_deny.so

    ```


    ```

    account required /lib/security/$ISA/pam_unix.so

    account required /lib/security/$ISA/pam_ldap.so

    ```


    Once pam_ldap.so has been incorporated into the system-auth file, all applications
    using the file through pam_stack.so are now LDAP aware. This means that we can
    log on to the Linux client using a domain account.


    If it is problematic that domain users are available for all applications using
    the pam_stack module, then you could place pam_ldap.so calls only in the configuration
    files for those applications that need it.


    > Important: Take care to put pam_ldap as required in the account section; otherwise,
    a user can get through that does not belong to the group that was entered in /etc/ldap.conf
    as required.'
