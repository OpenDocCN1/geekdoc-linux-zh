    #  2.2.2 Client roles fit thin and slim client model


    Clients within a client/server model are generally either fat, slim, or thin.
    This indicates where the majority of the application used actually runs. For example,
    in a thin client only the presentation part of the application runs locally (for
    example, in a browser), and the rest of the application runs on the server. These
    different roles are described in more detail in 4.4.2, "Logical segmentation -
    Thin, slim, or fat" on page 85.


    One of the complicating factors in the migration is a large number of fat clients.
    A fat client is a client with a large number of applications locally installed.
    The larger the number of applications, then the greater chance that some of those
    applications will be difficult to migrate to the Linux client. Some of them might
    be unmigratable, which leads to a more complex infrastructure integration, as
    described in 4.7, "Unmigratable applications" on page 99.


    If the current client is thin, this means that migrating the client to Linux does
    not involve the complicating factor of a complex infrastructure integration.


