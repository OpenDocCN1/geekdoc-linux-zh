    design of client architecture. See 7.2, “Remoting tools” on page 154 and 7.5,

    “Multi-station client architecture” on page 162 for more details.


    # 2.2 When to migrate - Or not to migrate


    This book focuses on methods for migrating Microsoft Windows-based clients to
    Linux-based clients within a mainly Windows-based enterprise. But in general,
    the client migration is almost always part of a larger migration to open source
    software within the enterprise. This has to be taken into account when planning
    a client migration.


    Even though the new Linux desktop might have properties (as indicated in 2.1,
    “Why migrate” on page 27) that are in favor of a migration, the total end result
    of the migration must have advantages as well. The total end result of the migration
    is not just a number of clients running Linux. Because of infrastructure and application
    environments, the architecture after the migration is usually more complex.


    In the rest of this section, we look at several circumstances that favor a decision
    to migrate to a Linux client. These circumstances can mostly be described as an
    absence of a complicating factor. We describe some in detail.


    # 2.2.1 Desktop Linux markets — the threshold of entry


    The Open Source Development Labs (OSDL) is at:


