- pgno: 349
  md: '# Scripting languages


    Open source scripting languages for Linux as Perl, Python, Ruby, ECMAScript, or
    Tcl, have been ported to diverse operating systems, including Windows and Mac
    OS X. The typical Windows scripting language, Visual Basic, and the related project,
    Visual Basic for Applications (VBA), are not directly available for Linux; although
    there are similar projects available through commercial offerings (such as RealBasic,
    "Application porting" on page 329) or through free implementations (such as StarBasic
    in OpenOffice):


    ```

    http://www.thefreecountry.com/compilers/basic.html

    http://documentation.openoffice.org/How_TO/various_topics/VbaBasicXref.pdf

    ```


    All of these Basic dialects are certainly relevant from a compatibility point
    of view (for example, for Excel migration), but they do not play a central role
    in the foundation of the GNOME or KDE environments, because there are many other
    natural choices.


    # Shell scripting


    The traditional way of scripting on Linux (and UNIX) machines involves shell scripting.
    Shell dialects include bash, ksh, and tosh. Shell scripts are the equivalent of
    batch files on Windows, except that they are significantly more powerful. Shell
    scripts are frequently used for startup routines (such as those found in /etc/init.d)
    or as wrappers around more complex programs (such as Mozilla or OpenOffice). More
    information about programming with shell scripts can be found at:


    +   - Linux Shell Scripting Tutorial: http://www.frees.org/guides/lsst

    - Advanced Bash-Scripting Guide: http://www.tdp.org/LDP/abs/html/


    # Perl


    Perl (Practical Extraction and Report Language) is a flexible and powerful scripting
    language. Perl was originally developed for text manipulation, and now can be
    used for much more. An impressive collection of third-party modules are available
    at the Comprehensive Perl Archive Network (CPAN). While enthusiasts say that Perl''s
    philosophy of "TMTOWDI" ("More Than One Way To Do It") makes Perl easy to use,
    others can make a legitimate claim that such philosophy makes code difficult to
    read and maintain.


    > 1 http://en.wikipedia.org/wiki/StarOffice_Basic

    2 http://www.cpan.org'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Python


    Python is a modern object-average scripting language that has remarkable power
    while still maintaining clear syntax. There are built-in libraries, which provide
    abstractions for many platform specific features (such as file access and threading),
    and many built-in or third-party open source libraries for graphical applications
    (such as PyGTK, PyQt, and wxPython, and bindings for Mac OS X and Microsoft Foundation
    Classes (MFC)). New modules can be written in either Python, C, or C++. While
    an entire application can be written in Python, it is also frequently used as
    an extension language for applications that have a built-in plug-system


    Red Hat uses Python extensively in the installation process and at many other
    places. Tools, such as kudzu (which is also used for hardware recognition in the
    Debian-based Knoppix distribution), are available as Python modules, too. While
    using **kudzu --probe** is straightforward, the Python wrapper allows administrators
    to write their own hardware recognition scripts in a much more elegant fashion,
    as seen in Example F-1


    Example: F-1 Hardware recognition with kudzu and Python


    ```

    #!/usr/bin/env python


    kudzu

    print kudzu.probe(kudzu.CLASS_SOCKET, kudzu.BUS_PCI, kudzu.PROBE_ALL)

    print kudzu.probe(kudzu.CLASS_NETWORK, kudzu.BUS_PCI, kudzu.PROBE_ALL)

    ```


    ```

    devices = kudzu.probe(kudzu.CLASS_UNSPEC, kudzu.BUS_UNSPEC, kudzu.PROBE_ALL)

    for dev in devices: print dev

    ```


    # Embedded Scripting Languages


    Most Linux scripting languages have wrappers for the GTK+, Qt, and wxWidgets libraries,
    and the whole GK/GNOME APIs. It is possible to write simple desktop applications
    or panel applets in a scripting language in order to allow for rapid development.
    Several applications also have embedded languages, which allow for user-customized
    actions. Such customization is often useful to tailor these applications for your
    exact business needs. The language used for these embedded capabilities often
    varies by application. For example, Perl and Python are used in Gnumeric and The
    GIMP,


    Appendix F. Desktop automation and scripting 323'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'JavaScript, XUL are used in Mozilla and Mozilla-based projects (such as Firefox
    and Thunderbird), and Star Basic is used in OpenOffice.org.


    # Qt Script for Applications


    Trolltech decided to give ECMAScript (the standardized version of JavaScript)
    a dominant role in Qt by releasing the Qt Script for Applications toolkit (QSA),
    which is tightly integrated into their framework:


    ```

    http://www.trolltech.com/products/qsa/

    ```


    QSA plays the same role as VBA for Windows applications and is very easy to use
    for Qt programmers. QSA is released under a commercial license for Linux, Windows,
    and Mac platforms. In addition to that, QSA is also licensed under the GNU GPL
    for free software development.


    # KJSEEmbed


    An very similar approach is the KDE JavaScript Engine, KJSEEmbed. KJSEEmbed has
    bindings for Qt, KDE, and DCOP interprocess communication mechanisms. You can
    find KJSEEmbed, which is licensed under the LGPL, and a lot of documentation at:


    ```

    http://xmelegance.org/kjsembed

    http://www.sourceextreme.com/presentations/KJSEEmbed/

    ```


    In Example F-2, you see how easy it is to write to a simple HTML browser with
    JavaScript using this toolkit.'
  merge: -1
  img_proc: true
