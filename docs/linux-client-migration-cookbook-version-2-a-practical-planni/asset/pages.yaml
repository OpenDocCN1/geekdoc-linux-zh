- pgno: 105
  md: '# KDE Desktop


    KDE is at:


    http://www.kde.org


    KDE provides a full-featured desktop and application environment for Linux and
    other UNIX-like operating systems. KDE is based on the cross-platform Qt programming
    toolkit from Troiltech, and uses the KParts component model together with the
    DOCP/RCP mechanism, which we describe in Appendix F, "Desktop automation and scripting"
    on page 321.


    With KDE, you can place icons and folders on your desktop and start applications
    from the KDE panel (Kicker). The panel can also contain KDE applets (such as a
    clock, battery and wireless status, or a virtual desktop chooser). SuperKarambamba³
    provides options for more fine tuning of KDE. More information about KDE applications
    can be found at:


    http://www.kde-apps.org


    Significant applications for the KDE desktop include:


    +   - Kontakt PIM application with Kolab or eGroupware as calendar server


    +   - KOffice suite (including KWord, KSpread, KPresenter, Kivio, Karbon, and
    KChart)


    +   - K3b CD and DVD burning application


    +   - Digikam digital photo management application


    +   - Scribus desktop publishing system


    +   - Konqueror Web and file browser


    > Note: Apple is using and extending the rendering engine from Konqueror (KHTML)
    in its Safari Web browser.


    # GNOME desktop


    GNOME is at:


    http://www.gnome.org


    GNOME is an open source desktop environment based on CORBA (Orbit2) and the GTK+
    GUI toolkit. It is the default desktop for Red Hat, and is also used by some traditional
    UNIX vendors including Sun™. More information about GNOME applications can be
    found at:


    http://www.gnomefiles.org


    ³ http://netdragon.sourceforge.net'
