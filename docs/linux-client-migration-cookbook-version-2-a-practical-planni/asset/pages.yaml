- pgno: 149
  md: 'They can also provide title bars and other decorations to windows, handle focus,
    and provide user-specified key and mouse button bindings. Example 5-1 on page
    122 shows how to start a nested X server with Xnest, which is an X server that
    is simultaneously an X client. This allows you to test other window managers or
