    # # A basic multi-station configuration


    In a multi-station configuration, multiple client workstations simultaneously
    share the resources of a single computer. Each user''s desktop environment and
    application processes are supported independently. See Figure 7-9.


    ![](img/23b949da14ff7bab8762f0f0361af394_192_0.png)


    Figure 7-9 IntelliStation A Pro showing VGA and USB connections supporting two
    client workstations


    Each station has an independent set of input and output devices, consisting of
    a monitor, mouse, and keyboard, which are configured to work together as a set.
    Figure 7-9 illustrates connections to support two client workstations. Each user
    is provided with an independent private desktop environment from which the user
    can access fixed and removed input, output, and storage devices. These devices
    are directly connected to the workstation through the use of extension cables,
    USB hubs, and other devices as necessary to provide stations at almost any distance
    from the shared workstation. You can configure each user''s desktop to consist
    of a single desktop on a single display, or more advanced setups such as multiple
    virtualized desktops on a single display, or even multiple desktops on multiple
    displays.'
