  md: 'logos and graphics elements for your desktop. SVG images typically look better
    than bitmaps, are easily resizable, use a standardized format viewable by Web
    browsers, and are part of a general desktop Linux trend towards SVG-based themes.


    Table 4-2 SVG editing programs


    | Editing program | URL |

