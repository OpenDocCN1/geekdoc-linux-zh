    # Complementary technologies


    A variety of complementary technologies can extend the flexibility of multi-station

    deployments. This section discusses several of the key technologies that can be

    used to logically complement and physically extend a multi-station computing

    platform.


    # Adding more stations using PCI bus expansion


    If the number of available PCI or PCI-Express expansion slots in the shared

    system is a limiting factor, PCI bus expansion hardware allows additional video

    cards and peripheral devices to directly link to the shared system. PCI expansion

    units up to 13 additional PCI slots can be daisy-chained or fanned out from the

    single shared system to facilitate many extra PCI cards as the computer''s

    PCI bus bandwidth permits. PCI expansion units can also be used in conjunction

    with PCI extension technologies over fiber-optic cable, effectively enabling an

    unlimited number of PCI expansion slots at almost any distance from the shared

    server system, using a single fiber-optic connection.


    # Connecting remote stations


    KVM over CAT5 cable and PCI extension technologies can effectively support

    connection of workstations to the multi-station platform at distances up to

    250 feet using copper¹, or up to 1000 feet or more fiber². In a

    multi-station scenario, one or more workstations of a multi-computer

    system can be deployed to hostile or remote environments where deploying an

    entire computer can be impractical or even impossible. These units can typically

    be combined and linked in a variety of ways to accommodate virtually any

    deployment scenario.


    # Remote desktop clients and services


    Multi-station technologies combined with remote desktop client software enables

    a single multi-station platform to support multiple connected clients that can
    run

    virt any kind of operating system interface or application available on remote

    hosting servers. For example, remote Linux desktop services over RDP.


    ¹ The KVM units combine (multiplex) the electrical signals carrying keyboard,
    mouse, and

    ideo into a data stream.

    ² PCI extension over fiber-optic cabling allows the complete PCI subsystem to
    be extended to

    any individual PCI cards as the computer''s bandwidth can support.'
