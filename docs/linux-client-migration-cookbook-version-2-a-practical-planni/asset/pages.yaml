- pgno: 38
  md: 'target platform where, ideally, there will be millions and millions of users
    who will purchase and utilize their software.


    “Linux [OS] needs to create this kind of environment,” Zemlin said. "By using
    an open standard—such as Linux Standard Base—application vendors will not only
    be able to target the Linux desktop platform, but they will be able to target
    more than a single distribution—for example, Novell and Red Hat. They will be
    able to target a Linux Standard Base certified distribution of their choice, creating
    an ecosystem of distribution vendors. It could be an Asian desktop, such as Red
    Flag in China, or Mandriva in South America, or Novell in Europe, or Red Hat in
    the U.S. You will get the kind of consistency required for mainstream uses in
    business, government, and education."


    # Components of a Linux Standards Base


    Built from a foundation of existing standards, LSB delineates the binary interface
    between an application and a run-time environment. Existing standards that LSB
    draws from include Single UNIX Specification (SUS), System V Interface Definition
    (SVID), for the Intel Itanium processor, C++ ABI, and System V Application Binary
    Interface (ABI). At the same time, LSB builds on earlier efforts that attempted
    to prevent UNIX fragmentation, such as POSIX and SUS. In fact, it uses POSIX source
    code standards and SUS interface definitions.


    Although LSB has incorporated the durable aspects of these precursors, because
    of this, the FSG has learned from the UNIX experience, and, of this, LSB has not
    adopted the limitations of POSIX and SUS. Notably, POSIX defined only programming
    interfaces and could not guarantee binary compatibility. The other end of the
    spectrum, such as OSF/1, which aimed for binary compatibility, were found to be
    too restrictive. LSB strikes a balance between the two approaches—It includes
    a binary compatibility layer that splits the difference between the approaches
    taken with POSIX and OSF/1.


    LSB formalizes the framework for interface availability within individual libraries
    and itemizes the data structures and constants associated with each interface.
    Figure 1-2 on page 12 illustrates the component organization in the LSB 3.1 environment.
    These components include shared libraries required by developers (including C++),
    file system hierarchies (defining where files are located in the system), specifications
    for the behavior of public interfaces, application packaging details, application
    behavior pre- and post-installation, and so on.'
