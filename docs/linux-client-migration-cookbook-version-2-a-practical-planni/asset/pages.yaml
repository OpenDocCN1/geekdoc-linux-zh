    # 9.5 How to mount a share on the Linux client


    This section describes in general some of the ways to approach data on Windows
    shares.


    One way is to permanently connect the share by mounting it somewhere in the filesystem.
    The shares can either be mounted using an smb mount or a CIFS mount.


    If mounting is not an option, use the command smbclient. The smbclient works similarly
    to an ftp-client. Using the smbclient, it is possible to get and put files from
    and to a Windows shares.


    # 9.5.1 Mounting a share using smbfs


    A share is mounted using the mount command in the following way:


    ```

    mount -t smbfs //servername/sharename/mountpoint -o user=domainuser

    ```


    The mount command calls smbmount to perform the mount of the share with the name
    shares on server server on the mountpoint specified. To connect to the server,
    the user domainuser is used and the command prompts for the password to use.


    This is most commonly used way to mount Windows share on non-Windows operating
    systems using Samba.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'However, if the share resides on a server that performs SMB signing (most recent
    Windows servers do), this fails with an error message. This is because the Samba
    client does not handle SMB signing and, thus, cannot mount the share.


    # 9.5.2 Mounting a share using CIFS


    Common Internet File System (CIFS) is a platform-independent file sharing system
    built around the principles in the SMB-based filesystems of Microsoft. Recent
    2.6 Linux kernels have CIFS built-in. Mounting a share as a CIFS filesystem enables
    the Linux client to go around the SMB signing problem mentioned before.


    Also, a CIFS mount can be used to mount Microsoft DFS™ filesystems, something
    that smbount cannot handle.


    The syntax for a mount using cifs is highly similar to a mount using smbs:


    ```

    mount -t cifs //servername/sharename /mountpoint -o user=domainuser

    ```


    > Tip: Because of future compatibility, use CIFS where possible.


    # 9.5.3 Use of smbclient


    The smbclient essentially turns a Windows share into an ftp-server. The command
    is invoked as follows:


    ```

    smbclient //servername/sharename -U domain domainname

    ```


    The command prompts for the password and connects to the share. Some of the commands
    that are available in the smbclient environment:


    +   - get - retrieves a file from the share to the local filesystem

    - put - copies a file from the local filesystem to the share

    - cd - changes working directory in the share

    - lcd - changes working directory in the local filesystem

    - help - shows all of the available commands

    - quit - exits the smbclient environment


    Example 9-22 shows how to connect to a share and how to get help on the commands
    in the smbclient environment.


    > Example 9-22 Example of smbclient to connect to a Windows share


    ```

    nld9="# smbclient //w2k3ad.ad6380.local/sharel -U administrator

    Password:

    Domain=[AD6380] OS=[Windows Server 2003 3790] Server=[Windows Server 2003 5.2]

    smb:\\ help get

    HELP get:

    ```'
  merge: -1
  img_proc: true
