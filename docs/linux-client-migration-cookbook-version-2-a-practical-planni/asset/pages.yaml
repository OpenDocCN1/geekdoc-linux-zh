    # 4.5.6 Virus mitigation


    It is important to start protecting Linux clients from virus infection as soon
    as the clients become operational. Even though there are few viruses targeted
    at Linux, the number is expected to grow as the number of Linux clients grows.


    Virus or worm protection is done in three ways:


    +   - E-mail virus protection on the mail server

    - Regular virus scanning on the client (perhaps once a day or once a week)'
