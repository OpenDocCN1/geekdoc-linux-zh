    # ## 4.6.1 Hardware considerations


    When discussing hardware support in Linux, it is important to first state that
    support has improved significantly in the last few years. More manufacturers see
    the rising demand and use of Linux both in private and corporate environments,
    and therefore have started to focus more resources toward delivering compatible
    device drivers for Linux. Unfortunately, there is still a lot to be done, especially
    in areas such as wireless LAN device support, or specialties as Winmodems or G-printers.
    Also, the open source community runs projects that develop device drivers, such
    as the Wlan driver for the Centrino chipset. A problem in this context is the
    firmware files, which are mostly closed source and so open source developers have
    to achieve some level of functionality for native Linux drivers.


    Developments such as this have even led to ideas such as the ndiswrapper project,
    which enables the loading of Windows ndis drivers to run network cards under NDIS.
    NDIS is the Windows network driver API, and ndiswrapper allows use of this API
    as kernel modules in Linux. The URL of project is:


    ```

    http://ndiswrapper.sourceforge.net

    ```


    It is very important that the hardware types are determined during the planning
    stage of a client migration (see 4.1.1, "Assessing the client hardware" on page
    63). Existing hardware needs more effort to get it running properly on Linux than
    the hardware is currently worth.


    This rule applies especially for the selection of PC models. Almost every PC vendor
    provides a model type that is suitable for Linux. IBM provides a Web site about
    supported models, which can be found at:


    ```

    http://www.ibm.com/pc/support/site.wss/MIGR-48NT8D.html

    ```


    Regarding desktop computers, it is quite easy to determine if Linux will run without
    problems; all the components, such as the graphics, are known and'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'can be checked for Linux support. Onboard components need special consideration
    because they likely cause problems; but even if this happens, it is possible to
    work around this problem, such as inserting a separate AGP card with a supported
    graphics chipset.


    When considering notebook computers, such an exchange cannot be made, because
    the components cannot be removed from the motherboard. Thus, it is necessary to
    check Linux support for notebook models before purchasing them.


    Of special concern for mobile Linux-based computers is support for power management
    functions. The support of the standards APM and ACPI in Linux is still lacking
    in some areas. ACPI has been supported in the kernel since Version 2.6; but the
    implementation in hardware drivers varies, resulting in problems for some users.
    For example, it is frequently more reliable to use APM for systems than it is
    to use ACPI.


    > Note: One method to test hardware compatibility is to use a bootable CD-ROM
    image of the Linux distribution that you are considering migrating to. These live
    CDs are designed for this purpose. See 3.4.5 "Hands-on Linux prior to migration"
    on page 59 for more details. We highly recommend that you use this method to verify
    existing laptop system support.


    In conclusion, it is very important to pay special attention to the hardware that
    will be in use after the migration. Additional work might be required to have
    a customized version of a distribution that supports all components, if it is
    even possible to support every component.


