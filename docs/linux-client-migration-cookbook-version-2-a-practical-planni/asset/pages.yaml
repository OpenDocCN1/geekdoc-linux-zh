  md: '+   - Partitions

    - Printers


    +   ▶ Cluster

    - Heartbeat Monitor

    - Cluster users and groups


    +   ▶ Others

    - Command shell

    - System and service status

    - Upload and download


    # Usage examples


    In this section, we describe a small subset of the basic functionality of Webmin.
    The standard actions we describe:


    +   ▶ Adding a user to the managed client

    ▶ Remote command execution on the client system


    # Adding a user


    Creating a user using Webmin is started by selecting the System icon from the
    top bar. Presented in the System tab is an icon for Users and Groups. Clicking
    this icon presents the Users and Groups tab, showing all the current users of
    this system. Select the Create New User link at the top and the Create User tab
    is shown. Simply fill in all the fields on this page and select the Create button
    at the bottom of the page to create the new user. Once this user is created, Webmin
    returns to the Uses and Groups summary tab, where you see the new user as a part
    of the system users.


    # Remote command execution


    Being able to remotely execute a command on another server can be extremely useful.
    To run a remote command, start by selecting the Other icon from the action bar
    at the top of the page. The Other tab then shows all the modules available in
    this group. Select the Command Shell icon and the Command Shell tabs in the box
    provided, select the Execute Command button, and the command is run on the system
    to which you are connected. The output of the command is presented on the Command
    Shell page. To see where the current path is, try issuing `pwd` first. You can
    use the `cd` command to change location of the command shell to any other directory.'
  merge: -1
  img_proc: true
