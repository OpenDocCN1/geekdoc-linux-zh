    the development you do (usually for one specific distribution) is easily accessible
    to customers who are running a different distribution. This means that it broadens
    your market without dramatically or exponentially increasing the effort on the
    development side."


    Any desktop platform by nature is more successful if it is localized and can be
    customized to a particular region or use case. When a developer customizes software,
