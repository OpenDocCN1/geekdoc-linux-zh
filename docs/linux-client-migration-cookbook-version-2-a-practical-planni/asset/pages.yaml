    To simplify graphical programming, several GUI toolkits have been developed on
    top of the base X11 libraries. Most GUI toolkits also provide a theming engine,
    and some base libraries allow for a similar look and feel between applications.
    There are also many integrated development environments (IDEs) available that
    further simplify GUI programming:


    +   * Develop and Qt Designer for KDE and Qt

    * Anjuta and Glade for GNOME and GTK+

    * MonoDev for Mono

    * Eclipse or NetBeans™ for Java with Swing or SWT


    Desktop environments provide a much richer user environment than just window managers
    by providing standard productivity applications such as:


    +   * E-mail and calendaring

    * Instant messaging

    * Image manipulation

    * Document editing and viewing

    * Scanning

    * CD and DVD binding


    These applications are created with a standard GUI toolkit. They have a homogeneous
    look and feel, theme flexibility, inter-application communication, drag and drop
    functionality, session management, and virtual desktop management.


    Most recent Linux development activity is beginning to standardize around the
    GNOME and KDE desktop environments (and their respective toolkits of GTK+ and
    Qt). Some traditional UNIX vendors are also beginning to adopt these environments.


    # 5.2.5 System runlevels


    Linux operating systems have the ability to boot into multiple runlevels. It is
    a configuration option which defines which processes should be allowed to run,
    and at what level. This is somewhat analogous to booting Windows into'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Safe Mode, though much more granular and configurable. While it is technically

    possible to boot into eleven different runlevels (the numbers 0 through 9, and

    also S), only runlevels 1, 2, 3, and 5 are commonly used. (Runlevel 0 is reserved

    for system shutdown and runlevel 6 is reserved for system reboot. Runlevel S is

    special level used by scripts before entering the first runlevel.) By default,
    the

    runlevels are laid out as you see in Table 5-3.


    # Table 5-3 System runlevels and modes


    | Runlevel | Mode |

    |---|---|

    | 1 | Single user text mode |

    | 2 | Multiuser text mode without networking |

    | 3 | Multiuser text mode with networking |

    | 5 | Multiuser graphical mode with networking |


    The default runlevel is configured in the file /etc/initab. With root level access,

    y you can switch between runlevels using the `init` command.


    # 5.2.6 Drives, partitions, and file systems


    Unlike Windows, Linux does not treat drives as separate top-level items in the

    system device hierarchy. Instead, everything is mounted into a file system

    hierarchy. For instance, the main hard drive is usually mounted as /, CD

    drives are mounting as /mnt/cdrom or /media/cdrom on some distributions.

    Both methods have advantages and disadvantages. On Windows, it is obvious

    tell which files are on drive. With Linux''s format, a faster drive could be used

    for system mount point (/) and a larger slower drive could be used

    for home directories (/home), all without the user noticing the difference.


    Similar to mapping a drive to a file share in Windows, Linux can mount network

    shares (using NFS, SMB, or) into the current file system, as seen in

    Example 5-2. It is even possible to mount the users'' home directories over the

    network, in a setup similar to Windows'' roaming profiles. When mounting

    Windows shares (or Samba shares), it is important to note that the SMB protocol

    does allow for symbolic links or sockets, and, as such, is not suitable for

    home directories.


    # Example 5-2 Mounting a Samba share


    ```

    smbount //itsont05/data /mnt/itsont05_data

    ```


    There are many different file systems available for Linux, such as ext2, ext3,

    ReiserFS, XFS, and JFS. Each file system has reasons for and against its use,'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'though are mature. Red Hat defaults to using ext3, while Novell Linux Desktop
    uses ReiserFS. Both ext3 and ReiserFS are journaling file systems. A journaling
    file system keeps an independent log (or journal) of data that is stored. Linux
    file systems also not need to worry about the problems caused by a fragmented
    hard drive, so that if a drive was fragmented, it would not cause any significant
    speed decrease.


    Linux has built-in support for the FAT file system used by DOS and Windows. NTFS,
    the file system introduced with Windows NT, is currently supported in read-only
    mode. There is an experimental driver for writing to NTFS, but because this can
    cause data loss, we do not recommend it for real use.


    # 5.2.7 Virtual memory


    Both Windows and Linux have a system for virtual memory. The model behind is both
    different and can change from one version to the next.


    One difference between Windows and Linux is the way swapping or paging is done.
    A Linux system will only paging out memory pages when no physical memory is available
    for allocation. Paging occurs when memory pages are needed that are no longer
    in physical memory. Performance can be adversely affected when there is a lot
    of paging activity especially when there is a lot of paging in and out. This generally
    means physical memory or certain kernel parameters governing virtual memory might
    be set incorrectly, or possibly, the parameters of the paging space is not optimal.
    Windows sometimes perform paging out of certain memory pages even when physical
    memory is not exhausted. This is called preventive paging. This does speed freeing
    up memory when the need arises, but it also means that Windows will be paging
    out more often.


    Another difference is that Windows usually uses a swapfile, while Linux uses a
    swap partition (but can use swapfiles as well). On Windows, the main drive C:
    usually contains a file named paging.sys, and that file is used for virtual memory.
    The file can grow if necessary, which can lead to the swapfile becoming fragmented,
    which significantly hampers performance. On Linux, a swap partition is usually
    created on installation. This partition is set aside for virtual memory, and is
    always contiguous. However, because it is a partition, it can never grow larger
    than the original size to which it was initialized during partitioning, without
    repartitioning the disk.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '**Tip**: To more efficiently utilize disk space on a dual-boot system, there
    are ways to make both Windows and Linux use the same partition for managing the
    virtual memory. More detail about this can be found at:

    http://www.tldp.org/HOWTO/Swap-Space.html


    It is also possible to specify swap partitions or swapfiles on the same Linux
    machine. This might be necessary if the swap partition created on installation
    was too small. Unlike Windows, which will automatically allocate more virtual
    memory, partitioning the drive and allocating it are tasks that a system administrator
    must perform manually.


    **Tip**: Using separate swap partitions or swap files that are resident on each
    of the physical disks installed in the same system usually has a positive impact
    on overall system performance.


    # 5.2.8 File links


    Unlike Windows, Linux supports shortcuts, called *links*, at the file system.
    (Technically, NTFS supports links, but Microsoft Windows does not use them.) Linux
    uses two types of links, symbolic links and hard links.


    *Symbolic links*, or symlinks for short, are direct references to another file
    or directory. A symlink can be created anywhere and point to a file on any other
    partition or mount point. Similar to Windows shortcuts, if the original file pointed
    to is moved or deleted, the symlink will no longer function.


    In order to understand hard links, it helps to understand Linux file systems.
    A path on Linux is just a pointer to an object called *inode*. The inode contains
    all the information about where a file is stored and how large it is. When creating
    a hard link, another pointer to a file''s inode is created. When all of the pointers
    are deleted an inode is removed. Therefore, if the original file is moved or deleted,
    the hard link link still points to the original inode, and thus the file still
    exists. Hard links, however, cannot point to directories, nor can they point to
    a file on a separate partition.


    # 5.2.9 Replaceable kernel


    Unlike Windows, the Linux kernel can be treated as another modular component of
    the system. It is possible to have multiple kernels installed on a machine. For
    instance, you might have the distribution installed kernel by default. However,
    for instance if that kernel does not support new hardware or an optional device,
    you have the option to download a newer version of the kernel'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'compile it to support the additional device. It is possible to configure the
    bootloader to display an option to boot either kernel; the default kernel as well
    as the one which the new device support functions compiled into it. While this
    ability is useful for testing out hardware support or new kernel features, users
    do not need to do this. However, it is important to point out that this is another
    feature of the modular nature of the Linux OS.


    Not all distributions give you the ability to choose which kernel to boot out
    of all the kernels installed. This depends on how Grand Unified Bootloader (GRUB)
    is configured. For instance, Novell SuSE enterprise distributions usually replace
    the kernel in the bootloader automatically with the last installed kernel. For
    more information about GRUB and how you can manage boot access to multiple kernels
    in Linux, see the following:


    ```

    http://www.gnu.org/software/grub/

    http://en.wikipedia.org/wiki/GNU_GRUB

    http://www.tldp.org/HOWTO/Multoot-with-GRUB.html

    ```


    # 5.2.10 Device drivers and hardware support


    Windows is known for its hardware support and device drivers being available for
    almost everything. This is based on manufacturers developing drivers for their
    hardware for Windows first (and sometimes so last). Because not all manufacturers
    supply Linux drivers, not all hardware can be used under Linux.


    However, the open source development framework and the modular structure of the
    Linux operating system enable everyone to write device drivers. This generally
    means as a piece of hardware (that is not supported by the manufacturer of Linux)
    becomes more popular, an open source device driver appears after some time.


    The number of manufacturers now supplying source code for their drivers is increasing.
    The advantage of providing source code is that the driver can be compiled for
    any version of the corresponding kernel that is available. The support is usually
    limited to a number of distributions'' kernels for which the manufacturer has
    tested the driver.


    # 5.2.11 Font support


    As we mentioned in 5.2.4, "Graphical and text-based environments" on page 118,
    the Windows OS has a fully integrated display driver. This includes font support.
    The Windows OS has many fonts bundled, some of which are copyrighted by Microsoft.


    In case of Linux, the display is driven by the X Window system. Recent incarnations
    of the X Window system have a separate font driver. This font'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'server can be used by other systems. Lately, a number of nicely rendered fonts
    have become available for Linux, either in the public domain or for a small license
    fee. Novell Linux Desktop and Red Hat Desktop each include fonts from suppliers
    that ask for a license.


    # 5.2.12 64 bit and multi-core support


    Up until recently, 64-bit support was not relevant for desktop operating systems.
    Lately, the processors used in desktops have not only gone to 64 bit, but also
    to multiple cores.


    Multiple cores in the CPU are handled both by Linux and Windows as multiple CPUs.
    They are handled in a way similar to how hyperthreading in certain types of CPUs
    resulted in multiple logical CPUs that are apparent to both Windows and Linux.


    Linux has been supporting 64-bit processors for a long time, predominantly because
    Linux is also available on processors that have been 64 bit for a while (for example,
    IBM Power architecture). Recently, Windows operating systems have been released
    in 64-bit versions as well.


    The key to remember when using a 64-bit version of an OS is that not all 32-bit
    applications run smoothly, and 32-bit applications cannot always find the correct
    libraries. Also, drivers cannot be mixed when using 64-bit operating systems.
    A 32-bit driver in a 64-bit OS can lead to problems.'
  merge: -1
  img_proc: true
