- pgno: 77
  md: "# 3.1 Assessing usage patterns\n\nWhen planning a pilot migration, one of the\
    \ most important steps is to perform as-is analysis of your current IT environment\
    \ that focuses on client application usage patterns. From this analysis, you should\
    \ be able to derive a segmentation of role-based usage patterns. A very helpful\
    \ tool for gathering this information is a user survey. Practical methods for\
    \ performing this survey are provided in 4.1, \"Assessing the client IT environment\"\
    \ on page 63.\n\n# 3.1.1 Functional segmentation - Fixed function to general office\n\
    \nWhen considering the range of applications hosted by a client (that is, what\
    \ type of work is done at a workstation), desktops in an enterprise or corporate\
    \ environment can be roughly segmented into five distinct types, as shown in Figure\
    \ 3-1.\n\n| Fixed Function | Technical Workstation | Transactional Workstation\
    \ | Basic Office | General Office |\n|---|---|---|---|---||\n| Limited use of\
    \ business applications | | | Applications which drive business processes | |\n\
    | Limited office productivity | | Simple office productivity | | Advanced office\
    \ productivity |\n| No e-mail | | Simple e-mail | | Advanced e-mail |\n| No instant\
    \ messaging | | | Instant messaging | | |\n| Simple browser access to the intranet\
    \ | | | | Advanced browser access to the Internet |\n| File/print, systems management,\
    \ network access, host emulation | | | | |\n\nFigure 3-1 Client functional segmentation\n\
    \nThe types are:\n\n+   - Fixed function\n  Users of these client machines run\
    \ only a fixed and limited set of designated applications. Applications are customized\
    \ for specific usage. For example, a kiosk or point-of-sale terminal.\n- Technical\
    \ Workstation"
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Users of these client machines work on industry-specific applications. It might
    require specific software packages, tailored to sector or problem domain, for
    example, engineering applications, such as CAD and CAM applications, or entertainment
    applications, such as movie animation.


    # Transactional Workstation


    A client designed to run form-based applications to support transaction processing.
    Often additional functions required access to an intranet or defined Internet
    sites, and e-mail (though no attachments). Examples of transactional clients include
    travel agency workstations, bank teller workstations, and front office workstations
    in insurance agencies.


    # Basic Office Workstation


    A client designed to run applications in support of a company''s business processes.
    It is required for ERP and CRM GUIs, intranet browsing, access to Internet sites,
    instant messaging, e-mail (with attachments), and the creation and viewing of
    simple documents (memos, letters, and spreadsheets) within the company only. The
    level of Windows interoperability depends on the number of Windows clients deployed
    in the organization. The applications could create files in portable formats (for
    example, ODF, PDF, or HTML). Examples of basic office clients include a loan officer
    workstation or an office administrator in a small business.


    # General Office Workstation


    A client designed to run a broad suite of applications, including business process
    applications (ERP and CRM GUIs), complex compound document creation (such as word
    processing, presentation graphics, and desktop publishing), and collaboration
    (instant messaging, file sharing, workflow, and advanced calendaring). The level
    of Windows interoperability required depends on the number of Windows clients
    deployed in the organization and the number of external organizations that a user
    interacts with. Browsing intranet and Internet sites is required, with support
    for a broad range of multimedia (such as streaming audio and video or Macromedia
    Flash). Examples of an advanced office client include to support sales and technical
    professionals, finance planners, and executive assistants.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '**Planning tip**: You should expect the migration of clients that fit into
    the more advanced functional segments as defined in the right side of Figure 3-1
    on page 50 requires more intensive application and data migration steps. In considering
    the overall cost of migration, might be appropriate to identify and migrate only
    those workstation segments that fit into the left side of this figure. As native
    Linux applications for the desktop mature and become more readily available, migration
    of the more advanced client functional segments, as shown in the right side of
    Figure 3-1 on page 50, should become more common.


    For more discussion on this topic, 2.2.1, "Desktop Linux markets — the threshold
    of entry" on page 39. Also, the discussion about "segmented perspectives" on the
    Open Source Development Labs "Desktop Linux" page:


    http://www.osdl.org/lab_activities/desktop_linux


    # 3.1.2 Surveying user data


    Assuming a group or role-based segment of users is identified for migration, the
    next step is to collect data (a technical survey) that captures all aspects of
    the workstation usage profile. This profiling data should include all applications
    that are being used, application dependencies (for example, database servers),
    and all required file types that are used, as well as client hardware demands.


    As part of this survey, you need to pay careful attention to evaluating hardware
    and peripheral device compatibility. Another topic that needs special attention
    is the range of file types that are used company-wide. In order to avoid the possibility
    of inaccessible files or content, it is reasonable to make a list of all types
    and identify applications or migration paths that guarantee the usability on the
    new system.


    # 3.1.3 User survey


    The task of an user survey can take a lot of time, but it is also extremely important,
    along with information about users'' application usage patterns, you can gain
    insight into the user''s point of view. This can help you discover how users use
    the systems and what is important to them.


    Another important issue you can learn about this survey is the existence of applications
    or other items that are not listed in the software catalog of a company. Sometimes
    users have built templates or databases on their'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'which are useful to them, or they have installed applications that are necessary
    for their work requirements.


    # 3.2 Establishing functional continuity


    This chapter includes methods to help retain the functions of existing applications.
    After the migration, users in most cases will have to switch to different but
    functionally equivalent applications. In order to bridge this gap, which can result
    in a loss of productivity, it is useful to develop a strategy for users accustomed
    to the new applications.


    # 3.2.1 Bridging applications


    Some applications that run natively on Linux are also available natively for Windows.
    These applications provide an opportunity to minimize the transition effects and
    retraining requirements that are triggered by an operating system migration to
    Linux. Thus, it is possible to migrate to applications that will be supported
    on the Linux platform prior to actual migration of the operating system self.


    > Important: The method described in this section can provide an extremely important
    way to help ease user interruption and frustration, as well as minimize the amount
    of application retraining necessary to complete the migration.


    The benefit of such pre-migration changes is that the users are allowed to get
    accustomed to the new applications before the actual migration of the operating
    system is done.


    After the new operating system is installed, the users will not experience any
    change at all as far the applications are concerned when making the switch with
    respect to those applications.


    Table 3-1 on page 54 provides several examples of applications that you can use
    as “bridging” applications between Microsoft Windows and Linux. The Linux-based
    equivalents listed in the second column are examples of applications that provide
    run natively on both Microsoft Windows and most major distributions of Linux.
    Thus, they allow application migration to occur prior to operating system migration.'
  merge: -1
  img_proc: true
