    # 7.5.2 What is multi-station computing


    The concept of a single computer providing independent desktop environments to
    multiple users is not new. Many solutions enable desktops to be remotely served
    to one or more client computers over a network using a single powerful computer
    such as a mainframe or terminal server.


    Traditional terminal server-based solutions require a PC or proprietary thin-client
    hardware system to be deployed at each user''s physical desktop. However, traditional
    networked thin client solutions are often limited in display and computing performance,
    and their deployment typically requires additional network bandwidth along with
    a powerful server system and uses much power infrastructure as regular desktop
    PCs.


    Multi-station computing, in contrast, is based on standard desktop PC hardware
    to serve each user''s monitor, and is designed to overcome many of the challenges
    and limitations of networked-based client solutions. For new users, there are
    potential cost savings and management'
