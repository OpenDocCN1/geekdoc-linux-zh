    # 3.2.2 Functionally equivalent utility applications


    The functions provided by utility applications such as file system browsers, archivers,
    and viewers free the design of these tools to be more closely tied to the operating
    system. They cannot be considered "bridging applications", in the sense that we
    described for the applications listed in the previous section. One of the reasons
    Linux is considered to be approaching equivalency with Windows is the availability
    of many choices for utility applications. In many cases, these applications can
    in fact have more powerful feature sets than their equivalent utility applications
    used in Windows today.


    Table 3-2 on page 55 provides examples of functionally equivalent utility applications
    available in Linux.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Table 3-2 Examples of equivalent utility applications in Linux


    | File managers (Windows Explorer) | Konqueror (KDE) Nautilus (GNOME) |

    | Archivers (like WinZip) | KArchiver, Ark (KDE) FileRoller (GNOME) |

    | Viewers (like Adobe Reader) | Konqueror, KView (KDE) Nautilus, Evince (GNOME)
    Adobe Reader for Linux |

    | Multimedia players (like Windows Media® Player) | xmms, xine, RealPlayer, totem,
    amaroK, JuK (KDE) Rhythmbox, Banshee (GNOME) |


    # 3.2.3 Web applications


    Unfortunately, it is not likely that you can find bridging applications (the ideal
    case) or functionally equivalent applications to meet every requirement. For instance,
    applications providing ERP or CRM are especially likely to have thick client implementations
    for which there are no cross-platform equivalents between Windows and Linux. Enterprise
    application vendors are responding to this not by developing separate thick client
    implementations for each operating system, but by focusing the Web browser as
    the container for extending their client applications to alternative client platforms,
    such as Linux.


    If a browser-based solution is not feasible, the approach of bridging applications
    to the new desktop by first transitioning to a cross-platform Web client interface
    cannot be used. In this case, you might have to migrate the application to a newer
    version that does support multi-platform clients, or you might have to consider
    switching to another software vendor that meets cross-platform client requirements.


    # 3.2.4 Building bridges to the server


    In last three sections, we showed ways to make the change easier for the users
    by switching to ported applications or Web clients. Another possibility to bridge
    gaps regarding functionalities is moving the application from the client back
    to the server as the primary processing host.


    Server-based computing (for example, terminal services-based remote hosting of
    client applications) can yield many advantages. An introduction to some methods
    for this are discussed in more detail in 7.2, “Remote tooling” on page 154. Regardless
    of which operating system is installed or which sort of client is in, you should
    always be able to insure that the same application user interface is delivered
    in your terminal application. The only requirement is'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'the availability of client-based applications that facilitate interaction with
    the remotely hosted application on the server.


    In the case of Windows Terminal Server or Citrix Metaframe, the requirements are
    met—clients are available for both Windows and Linux. Native Windows terminal
    servers can be accessed from Linux using rdesktop, an open source client for the
    Remote Display Protocol (RDP). The URL for this useful tool is:


    http://sourceforge.net/projects/rdp/


    Citrix delivers ICA clients for several operating systems with its MetaFrame Suite,
    including an ICA Client for Linux.


    Using this technique, many applications can be moved to the server-based model.
    Your migration path in this client introduces the possibility of moving from a
    fat to a thin client. This approach is especially worth considering for clients
    that fit into the Fixed Function and Transactional Workstation roles as defined
    in Figure 3-1 on page 50.


    A new approach to server-based computing is given by the developers of NoMachine
    NX, using a connection protocol that has been shown to reduce network traffic
    on both X and RDP sessions. More information about the NX protocol and NoMachine
    can be found here:


    http://en.wikipedia.org/wiki/NX_technology


    http://www.nomachine.com


    # 3.3 Human factors


    Because a desktop client migration affects users in a very direct way, considering
    human factors in the transition management strategy is extremely important.


    You can expect that a radical change in the desktop interface from what users
    are accustomed to will cause different kinds of reactions: From enthusiastic acceptance
    to outright rejection. Therefore, it is important to keep the users informed about
    the new developments in a clear and understandable way. A communications plan
    is key.


    Figure 3-2 on page 57 provides an example of a new technology acceptance curve
    in an organization.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/23b949da14ff7bab8762f0f0361af394_84_0.png)


    The effect of a good communications plan is to flatten the negative aspects of
    the acceptance curve in Figure 3-2. A communications plan coupled with proper
    training on the new desktop applications should minimize the number of users that
    fall into the rejection and opposition mode, cause users to start out with acceptance
    instead of dissatisfaction as the initial response, and lead to a quick transition
    into exploration and productive use.


    Regarding the IT support staff, these same issues have even more importance. A
    strategic decision to switch the operating system and the way the clients are
    managed can cause the impression of disapproval of the work they have done so
    far. It could give the impression that their current skills are being devalued.
    It probably not be easy to convince an administrator of Windows systems that migrating
    to Linux is a good strategy unless you can convince them that the organization
    is prepared to make a significant investment in upgrading their skills as well.


    Thus, very important areas to focus on prior to starting a pilot migration are:


    +   - Develop a communications plan.

    - Select a pilot group that is best suited for the task.


    # 3.4 Retraining considerations


    In the course of the migration, retraining for users will be necessary in many
    cases. Because classes are always cost-intensive due to the payment for a trainer
    and the non-productive time of the employees, you have to figure out ways that
    can reduce this amount.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 3.4.1 Bridging applications can separate retraining from migration


    Referring to the bridging applications mentioned in 3.2.1, "Bridging applications"
    on page 53, the strategy of replacing current applications with OSS equivalents
    that are available on both Windows and Linux could reduce training costs. The
    migration could be done in a smoother way, because users have the chance to acclimate
    themselves to the same applications that will be used on a Linux-based client,
    prior to actual migration.


    # 3.4.2 Learning a new look and feel


    Another strategy to save costs is the effort to retain the look and feel of the
    current applications and the desktop. It is possible to customize certain aspects
    of the GNOME and KDE desktops to emulate the look and feel of the Windows Desktop
    and Windows-based applications. Many freely available themes are available for
    download and further customization. For both KDE and Gnome, examples can be found
    at:


    ```

    http://www.kde-look.org

    http://art.gnome.org

    ```


    # 3.4.3 Familiar actions


    Emulating actions is also a good idea. A good example is enforcing double-click
    instead of single-click as the open action for desktop icons in the window manager.


    # 3.4.4 File systems: Everything has been moved


    Windows users are used to a hierarchical file system based on partition points
    such as C:\ or D:\. The hierarchical file systems in Linux differ from this. Some
    conventional mount points for file systems in linux include /usr, /home, and so
    forth. Migrated users could encounter much confusion when trying to understand
    the new Linux file system hierarchy. To smooth this transition, one recommended
    method is to migrate the entire contents of the user''s My Documents folder into
    a similarly named folder in the user''s home directory. Inside of /home/user/My
    Documents, the content and structure will appear exactly the same as was present
    in the original folder in Windows.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 3.4.5 Hands-on Linux prior to migration


    Most Linux distribution vendors are now providing live or bootable CD-ROM-based
    distributions. One of the pioneers in creating live CD distributions was Knopix:


    http://www.knoppix.com


    The following description from Knopix further explains what a live CD provides:


    KNOPPIX is a bootable CD with a collection off GNU/Linux software, automatic hardware
    detection, and support for many graphics cards, sound cards, SCSI and USB devices,
    and other peripherals. KNOPPIX can be used as a Linux demo, educational CD, rescue
    system, or adapted and used as a platform for commercial software product demos.
    It is not necessary to install anything on a hard disk. Due to the on-the-fly
    decompression, the CD can have up to 2 GB of executable software installed on
    it.


    A live CD can be used to provide users with the ability to run a bootable Linux
    system on their desktop. They can use it to test and evaluate the UI, applications,
    and other facets of the Linux client, before an actual client migration occurs.
    And this can be done without harming the operating system install on the local
    hard disk. Another benefit of using a live CD as part of a migration plan is for
    detection of hardware and device problems. If you are able to customize the driver
    modules loaded by a live CD image, then you should be able to also validate proper
    hardware detection and device support on your target platforms prior to actual
    client migration.'
  merge: -1
  img_proc: true
