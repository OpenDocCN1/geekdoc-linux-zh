- pgno: 28
  md: '# Introduction


    For several years now, many people involved with computing and the Internet have
    harbored hopes that Linux might become a viable user operating system choice for
    a broader segment of general purpose users. At the same time, there has been growing
    frustration with the problems and limitations of the current dominant commercial
    desktop operating system offerings from Microsoft. In turn, this frustration has
    fueled a greater need in the market for alternative desktop operating system choices.
    At the same time, Linux-based desktop-oriented distributions have improved tremendously
    as a result of the inclusive and open-ended dynamics of the open source development
    movement.


    The goal of this book is to provide a technical planning reference for IT organizations
    large or small that are now considering a migration to Linux-based personal computers.
    For Linux, there is a tremendous migration of "how to" information available that
    addresses specific and very technical operating system configuration issues, platform-specific
    installation methods, user interface customizations, and more. This ebook includes
    some technical "how to" well, the overall focus of the content in this book is
    to walk the reader through the important considerations and planning issues you
    could encounter during a migration project. Within the context of a pre-existing
    Microsoft Windows-based environment, we attempt to present a more holistic, end-to-end
    view of the technical challenges and methods necessary to complete a successful
    migration to Linux-based clients.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.1 The migration landscape today


    As this book was written, the range of choices and capabilities of native Linux
    software was expanding rapidly. For those few nascent IT organizations have the
    choice to grow an install base of Linux desktops organically (that is, they are
    starting a desktop IT infrastructure from scratch), the Linux choice should provide
    a basis for all of their application needs today. But the majority of Linux desktop
    deployments will most certainly occur within the context of a migration. And,
    at an application''s level, one of the most common and important migration challenges
    will likely be the feasibility of migrating users from the Microsoft Office productivity
    suite to a Linux-based equivalent.


    Other high-profile migration challenges with heavy infrastructure dependencies
    include messaging (Microsoft Outlook® does not run natively on Linux), and to
    a lesser interaction with enterprise directory and authentication services. To
    that end, this book includes sections that discuss and demonstrate migration methods
    for Linux integration into an Active Directory® and Exchange-based network.


    As for migration of office suite applications, at this time we believe the odds
    for migration success currently favor organizations or users that do not rely
    heavily on use of advanced functions in Microsoft Office, or customized applications
    that integrate with or extend Office. We believe that greater odds for success
    favor the "fixed function" or "technical/transactional" usage patterns, as defined
    in 2.2.1, "Desktop Linux markets — the threshold of entry" on page 39, and 3.1,
    "Assessing usage patterns" on page 50.


    > Note: In the near term, we will see successful client migrations favoring "limited
    use" client scenarios (the fixed function, transactional, or technical user segments).
    As Linux-based office productivity suite applications (and the content migration
    tools supporting those applications) mature, we expect greater frequency and success
    for migration of advanced office users.


    # 1.2 Identifying suitable environments


    Some clients, such as large banking and insurance companies, public administrations,
    and the retail sector, are pushing toward an Open Source based-solution not only
    on servers, but also on their corporate desktops. With all products, technologies,
    or solutions, a "one size fits all" approach to the open source desktop will not
    be feasible in all cases. Critical questions need to be asked:


    +   - Is the client''s employee population strictly dependent on a third-party
    application, plug-in, or devices that are only supported on Windows?'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   Has the client intensively developed custom applications based on native
    Win32® APIs and programming environments, such as Visual Basic® or other Windows
    scripting languages?


    +   Is the client''s entire employee population dependent on advanced Microsoft
    Office-based functions (for example, dependencies on complex macros)?


    If the answer is yes to any of these questions, then a Linux-based solution might
    be a less-suitable alternative, or present a complex (higher initial deployment
    cost) solution strategy that will require careful consideration.


    # 1.3 Strategic context


    From a migration point of view, Linux is only one piece in the puzzle. Clients
    are faced with the problem of simplifying and optimizing end-to-end IT infrastructures,
    including servers, databases, applications, networks, systems management processes,
    and clients. All of this has to be done while constantly maintaining complexity,
    risk, and cost, while providing a stable and scalable foundation for growth and
    new solution deployment as business requirements dictate.


    In business environments, a desktop computer is almost never an island. It needs
    to be integrated into a larger networked, services-oriented environment; it connects
    to various servers, storage devices, printers, and so on. It uses not only the
    operating system, but also a wide range of middleware products, application packages,
    and might even require custom application development. It has to be deployed,
    supported, and managed.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '**Note:** For medium to large enterprises, you can expect that the business
    case for a migration cannot be entirely justified by the potential just for cost
    savings in operating system and application software licensing fees. In fact,
    a migration scenario, you should expect that the most important cost consideration
    that will come into play in medium to large enterprises will be the overall cost
    of *managing* the client computing infrastructure on an ongoing basis.


    Be prepared to answer this question: “How will migrating to desktop Linux affect
    your year-to-year overall cost associated with supporting and managing your client
    IT infrastructure?”,


    The key to answering this question lies in understanding the following:


    +   - How you can leverage the Linux software stack to create innovative, cost-effective
    deployment models.


    +   - Recognition of the importance and value in using enterprise management tooling
    that is specifically designed to optimize efficient ongoing support of desktop
    Linux in the enterprise.


    +   - Understand how migration strategies apply to the different functional segments,
    and how the threshold of entry for each migrating of those segments can be affected
    by both technical and business process dependencies.


    There are many sections of this book that, collectively, will enable you to better
    understand how to create innovative, cost-effective desktop Linux deployment models.
    We focus on the importance of enterprise management tooling in 6.8, “Use a systems
    management tool” on page 136, and in Appendix B, “Using enterprise management
    tools” on page 255. You can find more information about functional segmentation
    strategies and threshold of entry analysis in 2.2.1, “Desktop Linux markets —
    the threshold of entry” on page 39, and 3.1.1, “Functional segmentation - Fixed
    function to general office” on page 50.


    In this IBM Redbook, we take the approach that will be migrating clients within
    an existing Microsoft Windows-based environment. In this IBM Redbook, we do not
    present an entire network migration strategy to clients and servers. But, it is
    safe to assume that any Linux client migration will likely be part of a larger
    strategic IT infrastructure migration plan, where Linux plays a role in supporting
    enterprise network and application services. To demonstrate this separation of
    concerns, in Figure 1-1 on page 5 we show an example infrastructure migration
    path for converting a Windows NT-based infrastructure to Linux. This Redbook mainly
    focuses on the portions of this migration path that are within the dotted line
    box in the figure.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/23b949da14ff7bab8762f0f0361af394_32_0.png)


    # # 1.4 Client environments


    The choice of an appropriate client platform for a particular set of users can
    depend on their functional role and the applications they must use to accomplish
    their objectives.


    More and more line-of-business applications are being developed to depend less
    on the underlying operating system by taking advantage of open standards and pervasive
    technologies as Web browsers. For economical reasons, many enterprises are quickly
    moving towards Service Oriented Architectures (SOAs) that allow them to compose
    applications out of existing services. This allows and encourages the reuse of
    application logic and data across the enterprise and even between enterprises.


    SOA are often implemented through Web services. Web services is an emerging set
    of standards that ensures interoperability by using such common technologies as
    Extensible Markup Language (XML), Simple Object Access Protocol (SOAP), Hypertext
    Transfer Protocol (HTTP), and others.


    > ¹ Source "The IDA Open Source Migration Guidelines", netproject Ltd © European
    Communities 2003'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Clients for applications based on Web services are often written in Java™ or
    based on Web browsers accessing portals. This makes the underlying operating system
    transparent to the application and allows flexibility of choice, based on cost,
    support, flexibility, support for open standards, and so on.


    It is important to understand what functions are required by a client platform
    to meet the needs of users, while keeping an eye on the direction of technologies
    and enterprise architectures. This helps to ensure that choices made today provide
    the capabilities that are required now and support the requirements of future
    architectures.


    # 1.5 Why Linux


    Linux has evolved into a powerful desktop operating system that can run on already
    existing hardware. In many cases, it requires less memory and processing power
    than other alternatives to provide similar performance on the client.


    Because of its core design and open nature, Linux can be easily customized. Linux
    is available under the GNU General Public License² (GPL) agreement and can be
    obtained for free. However, most enterprises buy a Linux to take advantage of
    the bundling features and support that accompanies them. The openness and flexibility
    of Linux, not the price, is becoming the driver for many organizations to migrate
    to this operating system. Its functionality, stability, scalability, and support
    have been key factors that have expanded the use of Linux from academic areas
    to the enterprise.


    With support from such companies as IBM and others deliver key client platforms,
    such as Lotus Notes®, the Mozilla browser, open office suites, and Java desktops,
    Linux is gaining momentum as a desktop operating platform.


    Linux supports the Portable Operating System Interface (POSIX) standard that defines
    how a UNIX-like system operates, specifying details such as system calls and interfaces.
    POSIX compliance has made it possible for developers to port popular applications
    and utilities to Linux.


    Linux also provides a complete implementation of the TCP/IP networking stack.
    A full range of clients and services are supported, including a standard socket
    programming interface so that programs use TCP/IP can be ported to Linux.


    > ² Copies of the GNU GPL Licenses can be found at http://www.gnu.org/copyleft/gpl.html

