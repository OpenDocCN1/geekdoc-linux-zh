- pgno: 304
  md: '# C


    # Automating desktop migration using Versora Progression Desktop


    This appendix describes the benefits of using an automated migration tool, such
    as Versora''s Progression Desktop. It then expands upon the three ways to run
    Progression Desktop; manually with the GUI, manually with the command line, and
    automatically with a systems management tool. Finally, we describe Progression
    Desktop''s extensible architecture.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Benefits of an automated migration


    A manual desktop migration is a time-consuming task. When dealing with a standard
    office or advanced office user, there are a myriad of technical considerations
    associated with the migration of data and application and system settings. A sample
    migration of e-mail, Web browser settings, and data is shown in Chapter 8, "Client
    migration scenario". Since a manual migration is estimated to require several
    hours of time per desktop, it could feasibly take an organization weeks or even
    months to complete. A Windows to Linux migration requires a technician to be proficient
    on both platforms with an understanding of the differences in file structures,
    applications, application settings, and system settings.


    By using an automated tool in a large migration, a test machine or lab can be
    used to quickly lay the migration strategy. Any issues with the migration can
    be fixed in the test lab and rolled into the process. This allows for the least
    amount of downtime when it is time for the actual migration to begin. Use of automated
    tools provides predictable results that can be repeated simultaneously on desktops
    throughout the organization. Also, automated tools do not require the technician
    to have the same level of technical expertise required for a manual migration,
    because much of that knowledge is built into the program. When used in conjunction
    with systems management tools, certain automated tools allow one technician to
    migrate up to one hundred desktops in the same time period that a single migration
    requires.


    # What is Progression Desktop


    Progression Desktop by Versora is an example of a set of applications and tools
    that can automatically migrate system settings, application settings, and data
    from Windows to Linux-based clients. The Web site is:


    http://www.versora.com


    System settings include such as desktop wallpaper, keyboard and mouse settings,
    screen saver settings, system sounds, network shares, dial-up connections, and
    fonts. System settings can be applied to both GNOME and KDE desktop environments.
    Application settings include e-mail related settings such as messages, address
    books, and calendar events; Web browser-related settings such as favorites, cookies,
    and the browser home page; word processing-related settings such as custom dictionaries,
    default templates, and AutoCorrect settings; instant messaging settings such as
    accounts and buddy list preferences. In each of these application categories,
    settings can be migrated from any source application to any of the available destination
    applications. Some example mappings can be found in Table C-1 on page 279.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Documents can be chosen by folder or by file, or even by file type. The documents
    can be copied as they are or sent through a conversion process based on file type
    to ensure complete compatibility on the target desktop. Progression Desktop also
    allows files to be excluded based on location or file type; for instance, a corporation
    might want to migrate the users'' directories, but exclude all MP3 files or others
    that violate corporate policies.


    # Table C-1 Some applications supported by Progression Desktop


    | Category | Source applications | Destination applications |

    | --- | --- | --- |

    | E-mail | Microsoft Outlook Microsoft Outlook Express Mozilla Mail Mozilla Thunderbird
    | Novell Evolution KMail Mozilla Mail Thunderbird |

    | Web browser | Microsoft Internet Explorer Mozilla Mozilla Firefox | Konqueror
    Mozilla Firefox |

    | Word processor | Microsoft Word OpenOffice.org Writer | OpenOffice.org Writer
    |

    | Instant messaging | AOL Instant Messenger GAIM | GAIM Kopete |


    # # How to migrate with Progression Desktop


    There are three ways to migrate clients with Progression Desktop:


    +   * Using the provided GUI

    * Using the command line with templates

    * Using a systems management tool to automatically invoke the command line with
    templates


    Each of these methods follows the same basic steps, as shown in the diagram Figure
    C-1 on page 280. First, the Windows-based executable of Progression Desktop is
    run on the source desktop. This process retrieves information from each of the
    selected source applications and stores these settings into a neutral source.
    This neutral source, called a Platform Neutral Package (NP), must be made available
    to the destination machine. This step is accompanied by copying the file to a
    network share, or directly to the destination machine. Finally, the Linux-based
    executable of Progression Desktop is run on the destination machine. This process
    gathers information from the PNP and applies the settings to the appropriate location
    for each of the target applications.


    Appendix C. Automating desktop migration using Versora Progression Desktop 279'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/23b949da14ff7bab8762f0f0361af394_307_0.png)


    Figure C-1 Progression Desktop neutralization process


    # # GUI


    The GUI allows users to perform the migration via a “Next-Next-Finish” style wizard
    interface. The user is presented with a series of questions that ask which system
    settings, application settings, and files from the Windows desktop should be captured
    and stored for migration. For instance, in Figure C-2 on page 281, a list of detected
    applications is shown, and the user is choosing to migrate settings from Microsoft
    Outlook, AOL Instant Messenger, Microsoft Internet Explorer, and Microsoft Word.'
