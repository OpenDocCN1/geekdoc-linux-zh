    # ## 2.1.4 Client customization


    Sometimes it is useful to match the client to the role of the user using it. If
    a standard client build contains every possible application provided by the source
    distribution, then it becomes not large but also more difficult to maintain. Therefore,
    client customization becomes an important goal in a Linux desktop deployment strategy.


    In this section, we look at the following features of the Linux client:


    +   - Flexibility to add or remove components of the Linux installation

    - Availability to prevent "bloating" of the client by maintaining package control

    - Availability of task-oriented distributions

    - Flexibility of desktop design and session manage


    # ### Flexibility to add or remove components


    Starting during the installation, it is fairly simple to add or remove components
    to the installation. Most installers supply a default installation, with the option
    to change which components to add or remove. This is again result of the modular
    structure of the Linux operating system. This flexibility enables the construction
    of customized installations for the Linux client.


    # ### Ability to prevent bloating the client


    Using the flexibility to add or remove components, it becomes possible to prevent
    the client from "bloating". Because customized Linux clients can be constructed
    for different user roles, it is not necessary to put all applications in one client
    image. This ensures that the client size does not grow out of control.


    Linux distributions have been constructed as small as a single floppy disk (1.4
    Mb). The enterprise distributions will install to several Gb in a default installation.


    # ### Availability of task-oriented distributions


    Because of the freedom to include and remove components and the absolute freedom
    to add other applications from the source community, it becomes possible to create
    special task-oriented distributions. This (and a Linux client based on it) for
    audio/video work or signal processing. These task-oriented distributions are useful
    when there are very specialized desktop client requirements in an organization.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Flexibility of desktop design and session manager


    One of the most obvious differences between the design of a Microsoft Windows
    client and a Linux-based client is the freedom of choice you have in selecting
    desktop session managers and window managers in Linux. Also, most session managers
    (certainly KDE and GNOME) also provide extensive sets of theme options that can
    be used to further customize the look and feel of the user interface. These themes
    are essentially a collection of icons, colors, window frames, backgrounds, and
    widgets, which combine to provide the selected look and feel.


    # 2.1.5 Free software and the open source philosophy


    For some organizations, the fact that Linux is open source software can be reason
    enough for justifying a migration. This is mainly because those organizations
    want to avoid vendor lock-in. Another reason that organizations might want to
    use open source software is that the source code is available and can be studied
    or adapted to their specific needs when necessary.


    > Note: If these factors are not influencing your migration decision, it is still
    very important that you understand the dynamics of the free software and open
    source software movements. The Linux alternative as it exists today and the rate
    of innovation occurring right now around the Linux platform would not be possible
    without the support of the developer communities. (See 2.3.1, "The movements:
    free software and open source" on page 42)


    # 2.1.6 Ease of use and retaining


    Modern Linux-based user interfaces (UI), such as those based on GNOME and KDE,
    provide the familiarity of a windowing desktop application environment as well
    as very sophisticated application platforms. In a properly designed Linux-based
    UI, you should be able to provide acceptable levels of both familiarity (in the
    mechanics of controlling the UI components and in application behavior) and ease
    of use. Further on in this book, we discuss key strategies for easing the "on-the-glass"
    transition in a Windows to Linux migration scenario (for example, see 3.2.1, "Bridging
    applications" on page 53).


    # 2.1.7 New economies of scale


    A Linux-based desktop computing strategy introduces many new options for designing
    client deployment models, options that introduce new economies of scale in the
    design of client architectures. Then client architectures, and the hybrid strategy
    aptly demonstrated by the "Multi-Station" approach pioneered by'
