- pgno: 144
  md: '# 5.2.3 Multi-user


    The way in which users are used in Linux is based on the model of UNIX. Since
    UNIX was developed as a multi-user operating system from the start, the concept
    of multiple users is very tightly bound to the workings of the operating system.
    The Windows operating system originally started as a single-user, single-thread
    operating system. Since then, Windows has come a long way. Because of this difference
    in history, there are inherent differences between the way multiple users are
    handled by both operating systems.


    There are several different ways to look at how good an operating system handles
    multiple users:


    +   - Multiple users run processes at the same time?

    - Can multiple users be logged on at the same time?

    - Can applications be installed for multiple users?

    - What are the rights of the different users?


    > Note: Useful''s multi-station client computing solution is an excellent example
    of how to leverage the multi-user flexibility in the Linux OS and the X architecture.
    See 7.5, "Multi-station client architecture" on page 162 and Appendix D, "Multi-station
    computing deep dive using Useful Desktop''" on page 289 for more details.


    # Can multiple users run processes at the same time


    One way to look at multi-user is that more than one user can run processes at
    the same time. In Linux, usually all system processes run as the root user. Any
    number of users can have processes running on a Linux system at the same time.
    The number can be limited by specific tables in the kernel, but in essence the
    code enables any number.


    In Windows, it is also possible to have processes running for multiple users at
    the same time. This property is the basic building block for the Windows Terminal
    Server.


    # Can multiple users be logged on at the same time


    In the case of both operating systems, the answer to this question is yes. Multiple
    users can be logged on at once.


    If a login consists of having a console with a graphical display, this is also
    possible in both operating systems. In Windows, this is done using Terminal Server
    and a Remote Desktop Protocol (RDP) connection. In Linux, this is done by allowing
    the session manager to create screens on Xservers.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'A multi-station client architecture provides an excellent example of how a
    Linux-based system can support multiple user logins, and in fact also support
    multiple, independently connected KVM (keyboard-video-mouse) connections to a
    single system. See 7.5, "Multi-station client architecture" on page 162 and Appendix
    D, "Multi-station computing deep dive using Useful Desktop Multiplier" on page
    289.


    # Can applications be installed for multiple users


    If different users want to run an application at the same time, it is extremely
    useful if each user has individual settings for the application.


    In Linux (UNIX), this is usually handled by "dot-files" (filenames starting with
    a period) that appear in the user''s home-directory, or by environment variables
    that are set for the specific user.


    Originally on Windows, settings were stored in the system registry, which was
    originally created for a single user. This situation sometimes creates problems
    in the Windows operating system, but most modern applications on the latest incarnations
    of the Windows OS handle user settings differently. More and more settings are
    now stored in files in the "Documents and Settings" structure in Windows.


    # What are the rights of the different users¹


    In Linux, the user with all rights (that is, the superuser) is the user "root".
    Many lower level system services in Linux run "as root", meaning that the process
    user ID is root and therefore the process itself is running with root privileges,
    for example, the system initialization process "init" (always process ID 1). The
    root user cannot be renamed and, therefore, cannot be more than one root user.


    In Windows, the Administrator is the user with all rights. There can be multiple
    instances of users defined with equivalent Administrator access levels, and the
    Administrator can be renamed to something else.


    You could say that Linux is a "single-superuser OS" and Windows is "multi-superuser
    OS". And where multi-user is good, it does not seem a good to have multiple supersers,
    with free-to-be-chosen names.


    # 5.2.4 Graphical and text-based environments


    Microsoft Windows is inherently a graphical system. Windows will always boot into
    a graphical mode, even on servers that do not need a graphical environment for
    daily operation. Most applications developed for Windows


    > Note: At the time of this writing, behavior of the security systems in Windows
    Vista is not known. In the future, Vista might have different ways of managing
    administrator level access to the system.'
  merge: -1
