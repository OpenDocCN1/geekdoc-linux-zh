- pgno: 277
  md: '# Shell Script


    A script designed to run automatically when a shell is started.


    # Slash


    The / symbol. Slash is used in file path names, instead of the backslash, \ used
    in the DOS, Windows, and OS/2 operating systems.


    # Source Code


    Programming commands in their raw state as input by a programmer. Some programming
    languages allow the commands to be executed on the fly by a interpreter. Other
    languages require the commands to be compiled into executable programs (binaries)
    before they can be used. In the Linux world, some software is distributed as source
    code only; other packages include both source and binaries; others are distributed
    in binary format only.


    # Spool (Simultaneous Peripheral Operation On-Line)


    To send data to a program that queues up the information for later use (for example,
    the print spooler).


    # SQL (Structured Query Language)


    The language used for manipulating records and fields (rows and columns) in a
    relational database. Sometimes pronounced "sequel".


    # SSH (Secure Shell)


    A secure protocol for logging in to a remote machine. Many protocols can be "tunneled"
    through SSH, such that connections travel through a SSH connection between two
    machines instead of travelling unencrypted across the network.


    # String


    A sequence of characters, as in a "search string",


    # Superuser


    Usually synonymous with root user.


    # Swap


    To move data (or data files) from random access memory to disk storage (swap out),
    or back (swap in), to allow more programs and data to be processed than there
    is physical memory to hold it. Also called Virtual Memory.


    # Swap Space


    Where swapped data is temporarily stored on disk. Linux uses a dedicated disk
    partition for swap space, rather than a specific swap file.


    An shortcut to a file or directory. Sometimes called a symlink. If the original
    file is deleted, the symbolic link will no longer work. (Also, see Hard link.)


    # Sync


    To force all pending input/output to the disk drive.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Syslog


    The Linux System Logger, where all system messages or errors are stored.


    # Tag


    A command in a markup language, such as HTML, to display information in a certain
    way, such as bold, centered, or using a certain font.


    # Tar (Tape Archive)


    A file packaging tool included with Linux for the purpose of assembling a collection
    of files into one combined file for easier archiving. It was originally designed
    for tape backup, but today can be used with other storage media. When run by itself,
    it produces files with a .tar extension. When combined with Gzip, for data compression,
    the resulting file extensions can be .tgz, .tar.gz, or .tar.Z.


    # Tarball


    A file created by the Tar utility, containing one or more other archived and,
    optionally, compressed files.


    # TeX


    A popular macro-based text formatter. The basis for such formatters, including
    LaTeX and TeX.


    # Text Editor


    A program for editing text files. Similar to a word processor, but without most
    of the formatting functions (such as margins, italics, and fonts). Often used
    for writing scripts, programs, and plain text files.


    # Text Formatter


    A program that prepares a text document for printing, allowing the user to perform
    layout functions, such as margins, headers, footers, indentation, pagination,
    and justification.


    # TFTP (Trivial File Transfer Protocol)


    A simplified version of FTP without authentication or many basic features of FTP.


    # Thread


    A small piece of programming that acts as an independent subset of a larger program.
    A multithreaded program can run much faster than a monolithic, or single-threaded,
    program because several different tasks can be performed concurrently, rather
    than serially (sequentially). Also, threads within a single application can share
    resources and pass data back and forth between themselves.


    # Time-sharing


    A method of allowing multiple users to share a processor by allocating each user
    a portion of the resources on a timed basis and rotating each user''s processes
    within those time segments. (Also, see Multitasking.)'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Touch


    A command that changes the date and stamp of a file without affecting the contents.
    If passed a file name that does not exist, touch will create an empty file.


    # True Fonts


    A wide variety of fonts designed to be printer-independent, unlike PostScript
    fonts. (Also, see BDF Fonts and PostScript Fonts.)


    # Tux


    The name of the fictional penguin mascot.


    # Umount


    The command for unmounting a hard drive partition, removable media, or other resource.
    (Also, see Mount.)


    # UNIX


    UNIX began as a proprietary operating system developed by Bell Laboratories in
    the 1960s. It eventually spawned of mutually incompatible commercial versions
    from such companies as Apple (Mac OS X), Digital (Digital UNIX), Hewlett-Packard
    (HPUX), IBM (AIX), NeXT (NEXTSTEP), and others.


    # UUCP


    A set of programs and protocols that became the basis for a wide network of UNIX
    computers. Named after the UNIX to UNIX Copy Program.


    # Vi


    A popular text editor, usually used as a console application. Also used when discussing
    newer version, Vim. (Also, see Emacs.)


    # Virtual Desktop


    A method for expanding the user''s workspace beyond the boundaries of the computer
    screen. The desktop can be scrollable left and right, up and down, as though a
    larger desktop was positioned behind the glass screen and moved around to reveal
    icons, windows, and other objects that were "off-stage," or out of view. Alternatively,
    with the KDE desktop, multiple buttons can be available, each of which displays
    an area of desktop equal to the size of the glass screen and which each can contain
    different objects.


    # Virtual Machine


    Virtual Machines (VMs) are features of central processor chips that isolate an
    area of memory from the rest of the system. Because operating systems and applications
    run in a "protected mode" environment, if a program freezes in one Virtual Machine,
    it will not affect the operation of the programs and operating systems running
    outside of that Virtual Machine.


    # Virtual Memory


    The process of using a portion of disk space as a temporary storage area for memory.
    Synonymous with Swap.


