  md: '# The Linux kernel


    User Programs and Applications


    | System calls | | | | Application Level |

    | --- | --- | --- | --- | --- |

    | Process Management | Memory Management | Filesystems | Device Control | Networking
    | Kernel Level |

    | Concurrency Multitasking | Virtual Memory | Files & Directories | Device Access
    | Connectivity | Kernel features |

    | Architecture dependent Code | Memory Manager | | Character Devices | Network
    Subsystem | Software support |

    | | | Block Devices | | | Hardware control


    ![](img/23b949da14ff7bab8762f0f0361af394_141_0.png)


    Figure 5-2 Linux Operating System


    # 5.2.1 Kernel booting process


    One of the biggest differences when migrating to Linux is its stability. It is
    conceivably possible to never need a reboot, unless the kernel needs upgrading.
    However, when it is time to boot, the process is somewhat different that it is
    in Windows. The initial kernel booting process is also referred to as kernel bootstrap.


    # Kernel bootstrap process


    The kernel bootstrap process is:


    +   1. Processor initialization, only low memory addressed, BIOS starts boot (GRUB,
    LILO).

    2. Bootloader loads initrd and kernel into memory; bImage unzips itself to high
    memory (/boot).

    3. Bootloader starts kernel, and bootloader tells kernel that there is an initrd.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   4. Kernel unzips initrd and mounts it as root-filesystem.

    5. Within initrd, a program called linuxrc is executed. The linuxrc program loads
    the modules necessary to mount various physical filesystem devices.

    6. The real root filesystem is mounted; initrd is remounted to /initrd.

    7. The init process starts (pid 1); init is the only process started by the kernel
    itself, every other process is a child process of init.


    In the previous description, the term initrd indicates a file that is decompressed
    and used as an initial RAM disk (hence, the name). This initial RAM disk is the
    kernel starts running. This initial root filesystem needs to contain modules and
    drivers for all devices needed. So if the actual filesystem lives on an ext3 filesystem
    of a SCSI disk, the initial RAM disk both ext3 and SCSI kernel-modules.


    # 5.2.2 Communication, files, and services


    Communication in Linux is performed using sockets. A socket is a pseudo-file that
    can be read or written to. This then corresponds to a receive of a send operation
    on the communication device. A network connection between two Linux systems, for
    example, is built from two sockets on both ends, corresponding to an IP address
    and a port number.


    Devices in Linux are also represented by files, usually in the /dev directory.
    Writing to the file corresponds to writing to the hardware device. Device drivers
    handle translation between this file-access and the physical action on the hardware.


    As mentioned in 5.1.2, "Standards" on page 111, the Filesystem Hierarchy (FHS)
    governs the Linux filesystem. Filesystems in most Linux distributions are set
    up along the lines of the Filesystem Hierarchy Standard (Table 5-1 on page 116).'
  merge: -1
  img_proc: true
