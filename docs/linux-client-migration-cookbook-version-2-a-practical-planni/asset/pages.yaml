- pgno: 158
  md: '# Migration best practices


    In this chapter, we describe several best practice methods you can use in your
    own Linux client migration projects. The topics we cover include situations which
    can make a Linux client migration easier and also the use of third-party tools
    to automate specific migration tasks.


    The sections in this chapter are:


    +   - 6.1, “The transitional desktop” on page 132

    - 6.2, “Choose an installation methodology” on page 132

    - 6.3, “Centralize data locations” on page 133

    - 6.4, “Break down migration into manageable groups” on page 134

    - 6.5, “Minimize impact of down time” on page 135

    - 6.6, “Get user feedback” on page 136

    - 6.7, “Automate the migration” on page 136

    - 6.8, “Use a systems management tool” on page 136

    - 6.9, “Do not migrate until you are ready” on page 137

    - 6.10, “Do not just migrate, upgrade” on page 138'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 6.1 The transitional desktop


    As seen in 3.2.1, "Bridging applications" on page 53, many open source applications
    run on Windows as well. Migrating to a Windows desktop with a few open source
    applications is an easier transition than replacing the entire operating system
    and application stack in one jump. Also, you can gain many of the benefits of
    using open source tools, as protection from viruses and spyware, enhanced customizability,
    and compliance with open standards. Once users are comfortable with the open source
    application stack, a migration to a Linux desktop running the same applications
    is less intimating


    You might even choose to stage the rollout of open source applications into several
    steps. For instance, you could start with a migration from Microsoft Internet
    Explorer to Mozilla Firefox. This involves making sure all intranet and important
    Internet sites are compatible with Firefox. After this migration, you could switch
    from Microsoft Outlook or Outlook Express to Mozilla Thunderbird for e-mail. However,
    because Thunderbird does not include calendering or Exchange support, you might
    not be able to implement this change. Finally, you could switch from the Microsoft
    Office suite to OpenOffice.org, converting any macros or incompatible documents
    to the new format. Once all users are comfortable with the new applications, switching
    to a Linux distribution provides support for Firefox, Thunderbird, and OpenOffice.org
    is less difficult for users.


    # 6.2 Choose an installation methodology


    There are several options available for rolling out Linux desktops. Each option
    has advantages and disadvantages, and you should choose the methodology that is
    most appropriate to your organization.


    # 6.2.1 Wipe and Reload


    The most obvious installation method, Wipe and Reload involves removing the current
    Windows installation and installing Linux on the same hardware. This method gets
    users over Linux immediately and requires no extra hardware, but can be dangerous
    if some important data on the Windows installation is not backed up before reloading
    the machine.


    # 6.2.2 Dual boot


    A dual boot installation installs Linux side-by-side with Windows, and allows
    the user to choose either operating system at time. Many distributions can resize
    Windows partitions during installation, and they can be set up to'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'and write from the main Windows partition. This option allows users to return
    to Windows if necessary, for example, to use an unmigratable application or to
    use a more familiar application for a time-sensitive task. It guarantees that
    the user''s data is preserved and accessible on the Windows partition. However,
    dual-booting requires maintaining two operating systems with current patches and
    anti-virus systems. Also, certain users might continue to boot into Windows as
    their main operating system, without ever trying to learn Linux.


    #  6.2.3 Hardware refresh


    The migration to Linux desktops could be timed with your organization''s next
    upgrade. When the users get their new hardware, it also comes with a new operating
    system. With a dual-boot scenario, the old desktop could be left with the user
    for a time, to run unmigratable applications or to use a more familiar application
    for a time-sensitive task. Or, the old desktop could be kept only for backup purposes,
    in some case data was not migrated to the new desktop. If no hardware refresh
    is planned for a significant amount of time, this option might be suitable for
    your organization.


    #  6.2.4 Hardware round-robin


    Similar to the hardware refresh option, in a hardware round-robin, the user is
    delivered a new computer with the new operating system installed on. After the
    user is comfortable with Linux, and all data is definitely recovered from the
    Windows desktop, then the old desktop can be wiped and used as a new Linux desktop
    for some other user. This option delivers many of the benefits of a hardware refresh,
    without requiring purchasing new machines for all users. However, you need as
    many new machines available as you have users being simultaneously migrated. Also,
    it works best if your hardware is interchangeable between users. Users receiving
    noticeably slower machines might not welcome such a change.


    #  6.3 Centralize data locations


    The most important personalization on a user''s desktop is the user''s data. Whether
    that data is word processing documents, presentation files, or e-mail, users need
    that data to perform their day-to-day jobs. By centralizing the said data, migrations
    can be made easier and more reliable.


    #  6.3.1 Central file server


    There are many advantages to using a central file server. Easier and more reliable
    backup procedures, more cost-effective use of storage space, easy'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'collaboration between users, and data migration is unnecessary. Connecting
    desktops to a file server can be as simple as mapping a Windows share (perhaps
    using a Linux server running Samba and requiring all users to keep their data
    in that directory. Laptops are more difficult, because users want their documents
    available when they are away from the office. Using a synchronizing system like
    Novel''s Folder can solve the problem. If a user''s files are all stored in the
    network server, you only need to connect the new Linux desktop to the same server,
    and all of the user''s documents are available on the new machine.


    For some reason files cannot be stored in the network, then it helps to implement
    a policy which requires files to be in a specific directory structure on each
    machine. For instance, users could be told to keep all of their documents in the
    My Documents directory. Then, during a migration copying the My Documents to the
    new Linux desktop ensures that all the necessary documents are on the new machine.


    # 6.3 Central mail server


    Just like storing files in the network, using a central e-mail server provides
    many of the same benefits. There are numerous open source mail servers which provide
    IMAP. However, these servers only centralize e-mail and not the storage of contacts,
    calendar, and tasks. To centralize these features, a groupserver is required.
    There are still many choices from open source servers such as Open-Xchange, OpenGroupware
    and the upcoming Hull project from commercial servers such as Novel Groupwise,
    Scalix, or even Microsoft Exchange. Not all groupware servers support all e-mail
    clients, so more investigation into the available options is required. The user
    stores all e-mail, contacts, and calendar information about the groupserver, the
    migration of this data only requires setting the account information about the
    new Linux desktop.


    # 6.4 Break down migration into manageable groups


    Replacing the operating system and applications on every computer in an organization
    is a daunting task. Not only is it usually not to replace every machine in one
    step, it is certainly unwise. Before a migration, you break the task of migration
    into smaller, more manageable tasks. It makes sense to start with the easiest
    groups to migrate, then continue on the line. For instance, you might want to
    move your call center (which only requires e-mail and Web access) first, after
    that, the sales team (which also requires an office suite), and then marketing
    (which requires graphics tools). You probably want to break each of those groups
    into smaller groups, such as project or by


    134 Linux Client Migration Cookbook, Version 2'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'location. It is important to ensure that each of the groups that have been
    migrated can still operate with those that have yet to be migrated. If two groups
    need to work with each other, cannot work together during a migration, then there
    is unnecessary animosity directed towards the Linux desktop, either combine the
    groups into one, or find a solution to their interoperability needs. This might
    require a migration to a transitional desktop setup, which was described in 6.1,
    "The transitional desktop" on page 132. A sample breakdown is shown in Figure
    6-1.


    ![](img/23b949da14ff7bab8762f0f0361af394_162_0.png)


    # 6.5 Minimize impact of down time


    One of the most expensive results of a migration is down time. Any time users
    are not able to perform their job duties is lost productivity that costs the company
    money. While there is never a perfect time for a disruptive migration, minimizing
    the amount and impact of down time is key. One option is to do migrations during
    the evening or weekend off-hours. This might require paying overtime or other
    compensation to the IT staff, but it could severely minimize the outages. Depending
    on the size and skill set of the group migrating, the migration could be performed
    during an all-day training session. This, the users could return from the training
    session to start using their new Linux desktops.


    Figure 6-1 A sample breakdown of down time'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 6.6 Get user feedback


    Before migrating a group of users, select a representative minority to give feedback
    on the proposed Linux desktop solution. Ensure that the users will be able to
    perform all the necessary tasks for their jobs under the new operating system.
    Try to see if the users can perform these tasks without help. Listen to the problems
    that the users face and try to solve the underlying problem. For instance, users
    might complain that the new desktop cannot perform certain tasks, in reality,
    they do not know how to perform the task or solve the problem. Use what you learn
    from the users'' problems to fix the desktop solution or to tailor the training
    classes to focus on problem areas.


    After migrating each group, learn from any mistakes that happened, and plan better
    for next group. You might decide to offer more in-depth training or to change
    your installation methodology.


    # 6.7 Automate the migration


    Users have an easier time adjusting to the new operating system if their data
    and personalized settings have been applied to the new machine. Custom scripts
    can be written to copy data from the users'' My Documents and Desktop directories
    and to set up any of the settings on the new desktop. However, there are hundreds
    to thousands of settings that users can have customized on their desktop. There
    are commercial tools, which can automate migration of settings such as the user''s
    wallpaper or screen saver settings, and application settings, as e-mail messages
    and accounts. Internet bookmarks and home page, custom dictionaries in word processor
    programs, or instant messaging accounts. These tools also handle the migration
    of data, either from specified directories or the ability to search by file type
    over the entire hard drive. More information about a tool like this, Desktop from
    Versora, is available in Appendix C, “Automating desktop migration using Versora
    Progression Desktop” on page 277.


    # 6.8 Use a systems management tool


    Systems, management tools, such as IBM Tivoli Provisioning Manager¹, Red Hat Network²,
    and Novell ZENWorks Management³ provides features such as automated installation
    of software, or even full operating system deployment through provisioning modules.
    Many systems management tools


    +   1 http://www-306.ibm.com/software/tivoli/products/prov-mgr/

    2 http://www.redhat.com/rhn/

    3 http://www.novell.com/products/zenworks/linuxmanagement/'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'can also be used to schedule the execution of custom jobs, such as running
    an automated migration tool on multiple machines at once (an example of this is
    described in Section 6.7, "Automate the migration" on page 136). Studies have
    shown that by leveraging a combination of an enterprise systems management tool
    and an automated migration tool, one technician can complete migration of one
    hundred or more desktops in a single day, as opposed to much fewer if the process
    was managed manually.


    **Important**: For medium to large enterprises, you can expect that the business
    case for a migration cannot be entirely justified by a potential cost for savings
    in operating system and application software licensing fees. In fact, in a client
    migration scenario, you should expect that the most important consideration that
    will come into play in medium to large enterprises will be the overall cost of
    *managing* the client computing infrastructure on an ongoing basis.


    As the size of the supported client base scales up, these costs (IT staffing,
    support and help desk, system upgrade and repair and protection from viruses and
    others, and so forth) greatly outweigh the costs of recurring operating system
    and application software licensing.


    This is why we strongly recommend that the approach for building a cost justification
    model for a client migration to Linux shows the potential for introducing innovative
    ways to achieve savings in how enterprise client platforms are managed. The integrated
    management tooling suites by strategic IBM Business Partners, such as Novell and
    their ZENWORKS Suite and Red Hat and their Red Hat Network, provide important
    value added features that any enterprise must consider implementing as part of
    a Linux client migration plan.


    Not only do systems management tools help in the installation and migration of
    Linux desktops, but they can also help to maintain these desktops throughout their
    lifecycles. More about systems management tools can be found in Appendix B, "Using
    enterprise management tools" on page 255.


    # 6.9 Do not migrate until you are ready


    Replacing an operating system is a difficult task. It should not be done lightly,
    or without sufficient planning. Even then, Linux might not be the perfect solution
    for some users (such as those with many irreplaceable applications, or laptop
    users whose power management, sound, and wireless drivers are not supported under
    Linux). It might be necessary to have a mixed network of Linux, Windows with only
    commercial software, and Windows transitional desktops. While this setup is'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'more complicated than a Linux-only network, it is often still advantageous
    to migrate some users.


    Migrations fail from under-planning than over-planning. While not every contingency
    can be planned for, the majority of possible problems can be found before the
    migration of the first user. Sufficient planning requires thoroughly investigating
    all distributions and software choices, involving the users with the proposed
    solution, and performing a pilot migration with the systems management and automated
    migration tools you will. After that, any and all problems encountered need to
    be fixed and then run through the testing process again. Only after a successful
    pilot should the migration of the rest of the organization begin. However, before
    migrating some of the groups, you might need to plan and retest for any additional
    needs they have.


    # 6.10 Do not just migrate, upgrade


    A migration is not just a task; it is an opportunity to switch to a better environment.
    For instance, a systems management tool could be introduced to ease the migration,
    but also to manage machines once they have been migrated. Depending on the role
    of the user, it could ease future application rollout and technical support to
    switch to a thin client or rich client environment. Perhaps some of the main IT
    problems resulted from users having too much control over their desktops; implementing
    the KDE Kiosk feature on those desktops could keep the users from performing any
    potentially destructive tasks by limiting them to usage of only approved interfaces.
    More information about additional desktop configurations is available in Chapter
    7, "Client deployment models" on page 139.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Client deployment models


    In this chapter, we concentrate on several client deployment models that can make
    Linux desktop Linux clients easier to manage.


    The sections in this chapter are:


    +   - 7.1, "Restricting the desktop" on page 140

    Methods for locking down the KDE desktop using the KDE Kiosk framework, the GNOME
    desktop with gconpool-2, and other tools are described.


    +   - 7.2, "Remoting tools" on page 154

    Several Linux-based solutions, which involve separating application logic from
    the display of that application, are covered.


    +   - 7.3, "Rich client" on page 156

    Rich client solutions are introduced and several implementations are discussed.


    +   - 7.4, "Stateless client" on page 160

    The goals behind stateless clients are introduced and some solutions are discussed.


    +   - 7.5, "Multi-station client architecture" on page 162

    In-depth discussion about Linux-based multi-station computing architectures.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 7.1 Restricting the out-of-box desktop


    An out-of-the-box Linux installation gives users a lot of power to change their
    settings according to personal preferences. In an enterprise environment, this
    is not necessarily preferable. There are several ways to lock down a Linux desktop,
    depending on the applications that need to be locked down. We describe in 4.3.4,"User
    lockdown" on page 83 how to keep users from certain hardware or software. In this
    section, we describe methods for locking down KDE desktops using the Kiosk framework.
    We also look at how to set default and mandatory settings for GNOME desktops using
    gconfigtool-2 and several graphical tools.


    # 7.1.1 KDE Kiosk framework


    In this section, we describe how to lock down your KDE desktop with the Kiosk
    framework that was introduced in KDE 3. Kiosk allows you to disable KDE features
    to create a more controlled environment. It is built on top of KDE''s configuration
    framework and adds a simple API that applications can query to get authorization
    for certain operations. We demonstrate both the configuration files directly and
    using the easy-to-use Kiosk Admin Tool¹


    For more information about how KDE stores its settings and how to edit them, see
    "KDE Desktop" on page 315.


    # Profiles


    The Kiosk framework should be used in addition to standard Linux security measures;
    the files that disable certain features should only be writable by the Kiosk administrator,
    which can be the root user or somebody designated specifically for that task.
    The Kiosk framework uses the standard UNIX user and group semantics and adds a
    profile layer to it. Profiles are configuration sets that specify what can be
    done when working with KDE and are associated to single groups of users.


    You have to tell KDE in the global configuration file /etc/kderc (or in times
    /usr/share/kdeglobals) which profiles are available and where to find the mapping
    file. In Example 7-1 on page 141, we showcase the configuration with two user
    profiles, which are internationalized (English and German [de]) and owned by the
    root user (ProfileInstallUser=root). The other three profiles look identical.


    > http://extragear.kde.org/apps/kioskt/'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Example 7-1 Profiles and the mapping file are specified in /etc/kderc


    [Directories]

    kioskAdmin=root:

    profileDirsPrefix=/etc/kde-profile/

    userProfileMap=/etc/kde-user-profile/


