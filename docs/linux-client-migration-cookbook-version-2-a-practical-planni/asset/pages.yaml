    in the planning part of this book can be put into practice. The example client
    migration is a simple one. However, the infrastructure integration is almost completely
    as described in 4.2, “Integrating with existing network services” on page 69.


    # 8.1.1 Assess the client usage pattern


    The client we use for the example migration is an ITSO desktop used to write this
    book. The client migration has the following properties:


    +   * It is a registered workstation in an NT4 domain.

    * Microsoft Internet Explorer is used to access intranet and Internet sites.

    * Adobe FrameMaker is the primary content authoring application.

    * Jas Paint Shop Pro is used to create and work on screen captures.

    * Network printers are used for all printing jobs.

    * Microsoft Outlook connects to Microsoft Exchange for e-mail.


    The client is running Windows 2000 with Service Pack 4 installed. We plan to migrate
    to Linux using the Red Hat Desktop distribution.


    # 8.1.2 Identify the most important applications and infrastructure integration
    points


    Since the user role for this workstation is primarily for writing books, Adobe
    FrameMaker is the most important application, and the most important infrastructure
    components are printing and access to network file shares.


    The first thing to note about the Adobe FrameMaker application is that there is
    no appropriate Linux alternative. There is no Linux native version, and moving
    to another application on Linux is not acceptable from a business point of view.
    In other words, FrameMaker is a unmigratable application that has to be handled
    in the manner described in 4.7.2, “Terminal Server, Citrix Metaframe, or NoMachine
    NX solutions” on page 100.


    Printing using the network printers and accessing shares in the NT4 domain means
    that the methods from 4.2, “Integrating with existing network services” on page
    69, have to be followed.'
