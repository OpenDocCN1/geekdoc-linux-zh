    # 2.2.3 High number of migratable applications


    An application is termed migratable when there is a direct way to migrate the
    application to a Linux client, either by using a Linux version of the application
    or using a Linux-based alternative.


    As described in more detail in 4.7, "Unmigratable applications" on page 99, applications
    that do not migrate well to Linux complicate the migration to a large extent.
    This also means that migratable applications lead to easier migration.


    Before performing a migration and handling the unmigratables, some organizations
    try to move away from applications that do not migrate easily. The best way to
    do this is to move the application to a portal-based application. This not only
    facilitates moving to a Linux client, but then the application also is not a problem
    in future migrations.


    # 2.2.4 Organizational readiness


    Even if all other factors in the migration are favorable, an organization that
    is not ready for a migration will still be unsuccessful. An organization that
    is ready be defined as:


    +   Having users that are ready and able to move to another client

    Having administrators and support staff that are enthusiastic about the migration
    and knowledgeableabout the technology you are migrating to

    Having procedures in place that will streamline the handling of problems during
    and after the migration


    These factors are discussed further in Chapter 3, "Organizational and human planning"
    on page 49.


    One of the most important factors is that the migration has to be carried by the
    administrators. The people who have to manage the clients and infrastructure after
    the move can make or break the migration. Getting system administrators'
