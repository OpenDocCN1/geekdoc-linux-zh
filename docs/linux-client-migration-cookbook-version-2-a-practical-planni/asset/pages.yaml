    OSDL has developed a useful chart that illustrates the relative threshold of entry
    levels for each type of user segmentation in an organization. For more information
    about user and role segmentation and how it can affect your migration strategy,
    see 3.1.1, “Functional function to general office” on page 50. The threshold chart
    is shown in Figure 2-1 on page 40 below.


