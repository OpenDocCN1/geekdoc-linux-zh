- pgno: 202
  md: '# 8.2 Migration plan details


    In this section, we want to discuss the migration steps, which possible problems
    we could come across, and how we plan to establish the functional continuity.


    After assessing a current ITSO desktop and its environment, as we have done in
    the section before, we have to build a plan that includes the necessary work to
    make the client functional after removing the Windows operating system.


    # 8.2.1 Client approach


    The ITSO resident workstation would fit into either the Basic Office or Advanced
    Office logical segment, as defined in 3.1.1, "Functional segmentation - Fixed
    function to general office" on page 50. Since the users use these workstations
    primarily for authoring technical papers using FrameMaker, as well as doing research
    using a Web browser, they map most closely to the Fat client type, as discussed
    in 4.4.2, "Logical segmentation - Thin, slim, or fat" on page 85.


    # 8.2.2 Graphical environment


    Another key decision that has to be made is what type of graphical windowing environment
    to use on the Linux client. Alternatives are discussed in 4.3.2, "Linux desktop
    environments" on page 76.


    In this special case, we are not going to discuss advantages and disadvantages
    of one or the other environment; both of them would provide enough functionality.


    But as GNOME is the default session manager for Red Hat distributions, we decided
    to stay with this choice for our sample scenario. The version that is included
    in Red Hat Desktop 4 at the time of writing we use GNOME 2.8.


    # 8.2.3 Hardware


    Another topic to be considered before migrating is the hardware that is in use.


    In this case, no peripherals are connected to the client, and all other resources
    (such as printers, for example) are accessed through the network.


    The migration PC platform for this example is listed in Table 8-1 on page 176.'
