- pgno: 222
  md: '# Integration how-tos


    This chapter demonstrates additional methods for integrating Linux clients into
    an existing Windows domain (NT4 or Active Directory). Many integration issues
    are covered, including mounting home directories from SMB shares at logon.


    There are two ways to authenticate users to a Windows domain:


    +   - Using winbind provided by Samba

    - Using LDAP to connect directly to Active Directory (this needs changes to the
    Active Directory schema)


    The sections in this chapter are:


    +   - 9.1, "How to join a Windows domain" on page 196

    - 9.2, "Using winbind to make users known locally" on page 199

    - 9.3, "Automatically use LDAP to connect to Active Directory" on page 204

    - 9.4, "Pluggable Authentication Modules and the domain" on page 207

    - 9.5, "How to mount a share on the Linux client" on page 214

    - 9.6, "Automatically mounting home directories at logon" on page 216

    - 9.7, "How to use network printers in the domain" on page 219


    All examples and how-tos in this section assume at least Samba Version 3.0. Some
    of the functionality is either present or not mature in earlier versions.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 9.1 How to join a Windows domain


    Most how-tos discuss in detail how to add Linux servers to a domain. This how-to
    describes adding a Linux client to a domain. Adding a client to an NT4 domain
    is different from adding a client to an Active Directory domain. We discuss both
    in detail.


    In most examples in this section, we use a domain AD6380 with Primary Domain Controller
    SMBLAB26 and Backup Domain Controller SMBLAB27. In some examples (using Windows
    2003 Active Directory), we use the domain AD6380 with domain controller W2K3AD.


    # 9.1.1 Joining an NT4 domain


    We use Samba to connect to the domain. The minimum smb.conf looks like Example
    9-1.


    ```

    Example9-1 smb.conf for joining NT4 domain

    ```

    [global]

    workgroup = AD6380

    security = domain

    password server = SMBLAB26,SMBLAB27

    ```

    ```


    Replace the domain and password servers with your own domain and the correct names
    or addresses for the primary (and backup) domain controllers.


    You can then join the domain:


    ```

    net join -S SMBLAB26 -U administrator

    ```


    Replace SMBLAB26 with the name (or IP address) of your own primary domain controller
    and use any domain account that has the right to add machines to the domain. The
    command prompts you for the password of the domain account "administrator".


    More details about joining an NT4 domain can be found in the current Samba-3 release
    version of the Samba-HOWTO-Collection. The collection can be found at the following
    location:


    ```

    http://samba.org/samba/docs/

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 9.1.2 Joining an Active Directory domain


    In this case, we need both Samba and Kerberos to connect. We need Kerberos to
    authenticate against a Windows 200x KDC.


    In the example, we use domain AD6380.LOCAL with AD server SMB3LAB26.


    The minimum smb.conf contains the lines given in Example 9-2.


    Example 9-2 smb.conf for joining Active Directory domain


    ```

    [global]

    realm = AD6380.LOCAL

    workgroup = AD6380

    security = ads

    password server = SMB3LAB26

    ```


    For the realm, care to use the correct case, since Kerberos is sensitive. Use
    the full-qualified name (that is, AD6380.LOCAL) for the realm and the short name
    for the work; otherwise, warnings appear.


    The minimum krb5.conf looks like Example 9-3.


    Example 9-3 krb5.conf for joining Windows 200x Kerberos


    ```

    [libfaults]

    default_realm = AD6380.LOCAL


    [realms]

    AD6380.LOCAL = {

    nkdc = SMB3LAB26:88

    admin_server = SMB3LAB26

    }


    [domain_realm]

    kerberos.server = AD6380.LOCAL

    ```


    Make sure the name of the Kerberos server is in the DNS in such a way that a reverse
    lookup over the IP address returns the NetBIOS name of the KDC or the NetBIOS
    name followed by the realm. It should not return the host name with a domain attached.
    The easiest way to ensure this is by putting it in the /etc/hosts entry.


    Since Kerberos tickets are heavily time dependent, it is important to make sure
    that the AD server and clients have the same time. Because Windows clients get
    their time from the domain controller, the Linux client can use Samba tools to
    get the time from the server as well. You do this using the net time set command.
    This fetches the time from the AD server and sets the local clock.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '**Important:** Make sure to use the right version of Kerberos (either MIT or
    Heimdal). For AD on Windows Server® 2003, Heimdal should be at least Version 0.6
    and MIT at least Version 1.3.1. Also check to see if the kinit and klist commands
    actually come from the correct implementation and not from Java. The Java kinit
    is known not to work.


    When using Novell Linux Desktop, the heimdal and heimdal-linux-tools packages
    might not be installed by default. These are needed to connect to AD on Windows
    2003 Server.


    **Important:** Make sure clients and the Active Directory (or Kerberos) server
    have the same time within a defined allowed skew.


    Microsoft Windows servers use Simple Network Time Protocol (SNTP), which is a
    simplified version of the (UNIX/Linux) Network Time Protocol (NTP). The packets
    and formats are identical and thus can be used together. This means that the Linux
    clients can be synchronized with the AD servers using ntp.


    You can test the Kerberos configuration by doing a `kinit USERNAME@REALM` to make
    sure the password is accepted by the Windows 200x KDC.


    **Important:** Only newly created accounts in ADS or accounts that have had their
    passwords changed once since migration work. If an account stems from before the
    migration (or installation in the case of Administrator), the **kinit** command
    returns a message about a wrong encryption. Changing the password of the account
    resolves this problem.


    To actually join the AD domain, you execute the following:


    ```

    net ads join -U administrator

    ```


    This prompts for the administrator password, for example, joining client1 to the
    domain AD6380 using administrative user idsadmin (see Example 9-4).


    *Example 9-4* Example of joining client1 to domain AD6380


    ```

    [root@client1]# net ads join -U idsadmin

    idsadmin password:*******

    Using short domain name -- AD6380

    Joined ''CLIENT1'' to realm ''AD6380.LOCAL''

    ```'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Joining a particular organizational unit can be done by first getting the correct
    credentials and then joining the unit. For example, if you want to join the domain
    (that is, create a computer account) in a container called Clients under the organizational
    directory Computers/ITSO, you execute:


    ```

    kinit Administrator@AD6380.LOCAL

    net ads join "Computers\ITSO\Clients"

    ```


    > **Important:** Since Windows 2003 uses SMB signing, you might have to put the
    following line in the smb.conf file when trying to join a Windows 2003 ADS.


    client spengo = yes


    To check a join to an AD domain (at all times), use the command:


    ```

    net ads testjoin

    ```


    More details about joining an Active Directory domain can be found in the **Samba
    HOWTO collection section 6.4:**


    http://samba.org/samba/docs/Samba-HOWTO-Collection.pdf


    # ## Using winbind to make domain users known locally


    After joining a domain as described in 9.1, "How to join a Windows domain" on
    page 196, it is necessary to add all domain accounts to the Linux client if the
    domain accounts are going to log on to the client. In smaller domains, this is
    not a problem, but it is generally not good administrative practice. This means
    that adding an account to the domain means adding an account to all clients. That
    negates the advantage of using a domain.


    In this section, we describe how to use winbind to avoid creating domain accounts
    locally. The winbind daemon takes care of translating domain accounts to uids
    and gids to the client operating system.


    # ### 9.2.1 Common implementation of winbind


    The winbind daemon reads its settings from the smb.conf file. You must add the
    lines in Example 9-5 to the smb.conf to enable winbind to function.


    Example 9-5 Lines added to smb.conf for winbind


    ```

    [global]

    winbind separator = +

    idmap uid = 10000-20000

    idmap gid = 10000-20000

    winbind enum users = yes

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: '```

    windbind enum groups = yes

    template homdir = /home/%U

    template shell = /bin/bash

    ```


    The separator means that accounts are written as "AD6380+Administrator" for the
    Administrator account in the domain AD6380. The other entries give the uid and
    gid range to use for domain accounts and what to use as shell and home directory
    in case of actual logon. We have found that a plus sign (+) as a windbind separator
    works successfully within the Linux environment.


    Alternatively, it is possible to not use a separator and domainname at all. The
    way the default domain is used. To enable this, add the following line to the
    smb.conf file:


    ```

    windbind use default domain = yes

    ```


    and probably change the template homdir to:


    ```

    template homdir = /home/%U

    ```


    All domain users show up without the dirname and separator. This might cause problems
    if local users and domain users have the same name.


    > Tip: Use the default domain option when in doubt. The separator and domainname
    can lead to problems in applications. Using pam_mount for the default domain avoids
    a lot of problems.


    The idmap uid and gid tell windbind range it can use to generate uids and gids
    for domain accounts. Choose a range that does not overlap the local users.


    > Important: If you have an extremely large domain, you might not be able to incorporate
    all users in your idmap uid range. This is only problematic if you use windbind
    on a domain client, which all users use through the network.


    After these changes, the windbind daemon has to be started. Usually, this is done
    using the command:


    ```

    /etc/init.d/windbind start

    ```


    Make sure the windbind daemon starts on system boot. On most distributions (certainly
    on Red Hat Enterprise Linux and Novell Linux Desktop), this is done using the
    following command:


    ```

    chkconfig windbind on

    ```'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The windbind functionality can be tested using the wbinfo command. Executing
    with the -u option shows all domain accounts translated and the -g option shows
    all domain groups.


    Example 9-6 Example output of wbinfo


    ```

    [root@client1 root]# wbinfo -u

    AD380+Administrator

    AD380+Guest

    AD380+TsInternetUser

    AD380+idsadmin

    AD380+krbtgt

    AD380+HOST|client1

    AD380+SMB3LAB26$

    ```


    > **Important:** The service called name cache daemon (nscd) interferes with proper
    functioning of windbind. Never run nscd on systems where windbind runs.


    With these settings, the windbind daemon is able to translate domain accounts
    to local users. We let the system to use windbind by putting a reference in the
    Name Service Switch (NSS) configuration.


    The configuration file for NSS is /etc/nswitch.conf. This file contains entries
    as:


    passwd: files example


    This means that when a request for a password comes in, first a routine in /lib/libnss.so
    is called to resolve it and then a routine in /lib/libnss_example.so. Once the
    request is resolved, the result is returned to the application. To add windbind
    to the resolve path, we change the following lines in /etc/nswitch.conf in the
    following manner:


    ```

    passwd: files windbind

    group: files windbind

    ```


    To test this, execute the command:


    ```

    getent passwd

    ```


    This returns not only the entries in the file /etc/passwd, but also the domain
    accounts that were translated by windbind.


    Example 9-7 Partial output of getent passwd using windbind in


    ```

    [root@client1 root]# getent passwd

    root:x:0:0:root:/bin/bash

    bin:x:1:1:/bin/nologin

    ```'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'AD6380+Administrator:x:10000:10000:Administrator:/home/AD6380+Administrator:/bin/bash

    AD6380+Guest:x:10001:10000:Guest:/home/AD6380+Guest:/bin/bash

    AD6380+TsInternetUser:x:10002:10000:TsInternetUser:/home/AD6380+TsInternetUser:/bin/bash

    AD6380+idsadmin:x:10003:10000:idsadmin:/home/AD6380+idsadmin:/bin/bash

    AD6380+krbtgt:x:10004:10000:krbtgt:/home/AD6380+krbtgt:/bin/bash

    AD6380+HOST/client1:x:10005:10001:client1:/home/AD6380+HOST/client1:/bin/bash

    AD6380+SMB3LAB26$:x:10006:10002:SMB3LAB26:/home/AD6380+SMB3LAB26_:/bin/bash


    Because of how windbind works (namely, handling the first out in the range to
    the first domain user has to authenticate and then storing the mapping), the mapping
    between domain user and uid is not the same on all clients. This leads to problems
    if clients are using a shared file system based on NFS. The mechanisms discussed
    in 9.2.2, "Alternate implementations of windbind" on page 202 avoid this problem.


    > Important: When windbind fails because the Kerberos connection is lost because
    of time skew, the daemon has to be restarted after fixing the skew.


    The windbind daemon translates users and generates home directories and shells.
    These home directories are not created by windbind. We show you how to this in
    9.4.3, "PAM and home directories" on page 212.


    Using windbind creates the connection to the domain for translating users. To
    enable domain users to log on to the Linux client, we need a change in the PAM
    configuration, as shown in the section 9.4.1, "How to authenticate users using
    windbind and PAM" on page 208.


    # 9.2.2 Alternate implementations of windbind


    The primary difference in the alternative implementations is the way that uid
    and gid are generated by windbind. In the previous section, windbind chooses uid
    and gid for each user from the range provided. This generally happens with the
    order used, which means it is not the same on all clients in a domain.


    +   - idmap_rid back to generate from Active Directory information

    - idmap_ad back end to obtain uid and gid from an AD with an extended schema (for
    example, extended with Services for UNIX)'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'These idmap back-ends are quite new and, thus, still a bit experimental. Both
    remove one of the disadvantages of windbind as a solution in enterprise environments.


    # idmap_rid backend


    This back-end calculates a uid and gid for users based on the domain SID. To enable
    this option, include the lines in Example 9-8 in the smb.conf file.


    Example 9-8 Example of entries in smb.conf to use the idmap_rid backend


    | idmap uid = 10000-20000 |

    | idmap gid = 10000-20000 |

    | idmap backend = idmap_rid:AD6380=15000-20000 |

    | allow trusted domains = no |


    Use these settings and set the default domain to not clearly distinguish the domain
    accounts. Part of the output of getent passwd looks like Example 9-9.


    Example 9-9 Partial output of getent passwd when using idmap_rid


    ```

    root:x:0:0:root:/bin/bash

    bin:x:1:1:bin:/bin/bash

    AD6380+administrator:x:15500:15513:Administrator:/home/administrator:/bin/bash

    AD6380+guest:x:15511:15514:Guest:/home/guest:/bin/bash

    AD6380+w2k3ad_:x:16003:15516:w2k3AD:/home/w2k3ad_:/bin/bash

    AD6380+krbtrgt:x:15502:15513:krbtrgt:/home/krbtrgt:/bin/bash

    AD6380+testuser:x:16108:16121:Test User:/home/testuser:/bin/bash

    AD6380+rhd45:x:16112:15515:rhd45:/home/rhd45:/bin/bash

    AD6380+rhd4a_:x:16113:15515:rhd4a_/home/rhd4a_:/bin/bash

    AD6380+idmapbind:x:15517:15513:idbind:/home/idbind:/bin/bash

    AD6380+nld9_:x:16120:15519:nld9_/home/nld9_:/bin/bash

    ```


    It is clear from the output in Example 9-9 that this is no longer a simple algorithm
    for picking the uid and gid after the other in the allowed range. The major advantage
    of this is that the mapping is same for all clients within the AD6380 domain.


    # idmap_ad backend


    In the next section about LDAP, the concept of the Microsoft Services for UNIX
    (SFU) is explained. Using the SFU, the schema for the Active Directory is extended
    with uid and gid information. Using the idmap_ad backend, it is possible to get
    at this information and use with windbind.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'This way the mapping on all clients is consistent, because the mapping is actually
    done in the Active Directory.


    The idmap_backend is enabled using the following line in the smb.conf file:

    idmap_backend = idmap_ad


    # 9.3 How to use LDAP to connect to Active Directory


    Active Directory is an implementation of Lightweight Directory Access Protocol
    (LDAP). Thus, we can use an LDAP client to connect to an AD to gather information
    about users. However, since the AD is not designed to store UNIX/Linux users,
    some of the necessary objects are missing in the default schema. One of the first
    steps is to extend the schema with the needed object-classes.


    A simple way to extend the schema is to install the "Services for UNIX" (SFU)
    from Microsoft. These include the object-classes needed to store the information
    needed.


    Install SFU with the default settings, as follows:


    +   1. Extract files to a directory that is not C:\SFU, for example, C:\Temp\SFU.

    2. Run setup.exe.

    3. Accept Standard Installation.

    4. On the Security Settings window, leave both options blank.

    5. Choose Local Username Mapping Server and Network Information Services.

    6. Choose the domain name.

    7. Reboot the AD server.


    This installation has extended the schema of AD to include fields such as uid
    and gid.


    The next step is to create a user in the Active Directory to be used by LDAP clients
    to bind to the directory. Choose a highly secure password and set it to not expire.


    Given the schema extensions, it is now possible to provide groups with a gid field
    and users with uid, shell, and a home directory, as shown in Figure 9-1 on page
    205.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Test User Properties


    ![](img/23b949da14ff7bab8762f0f0361af394_232_0.png)


    Figure 9-1 Active Directory User properties window with UNIX Attributes


    In this example, we have created a user called tester with UID 5000, a Login Shell,
    and a Home Directory. We have also created a group or Primary group name/GID of
    Linuxusers with gid 5000.


    More information about Services for UNIX and integrating Active Directory as the
    directory for a Linux or UNIX client can be found in the document Solution Guide
    for Windows Security and Directory Services for UNIX available from Microsoft.


    To enable the system to use LDAP to connect to the Active Directory, you must
    configure the LDAP configuration file, /etc/ldap.conf. This configuration file
    contains the following information:


    +   - Host of the directory, that is, the IP address of the Active Directory server
    if more than one, separated by spaces

    - The base node in the directory to start the search

    - The bind user to connect to AD


    Chapter 9. Integration how-tos 205'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   The password for the bind user (in plain text, so you secure the configuration
    file)


    +   Scope to search


    +   SSL enablement


    +   A number of entries to map domain schema objects to objects needed by the
    NSS


    An example configuration file for /etc/ldap.conf is shown in Example 9-10.


    # Example 9-10 Partial /etc/ldap.conf file


    ```

    host 192.168.100.110

    base cn=Users,dc=AD6380,dc=LOCAL

    binddn cn=ldapbind,cn=Users,dc=AD6380,dc=LOCAL

    bindwp Webcome2006

    scope up

    sl no

    nss_map_base_passwd cn=Users,dc=AD6380,dc=LOCAL?sub

    nss_map_shadow cn=Users,dc=AD6380,dc=LOCAL?sub

    nss_map_base_group cn=Users,dc=AD6380,dc=LOCAL?sub

    nss_map_objectclass shadow posixAccount user

    nss_map_objectclass uid SAMAccount user

    nss_map_attribute uid SAMAccountName

    nss_map_attribute udnNumber mSFU30UidNumber

    nss_map_attribute gidNumber mSFU30GidNumber

    nss_map_attribute loginShell mSFU30LoginShell

    nss_map_attribute geos name

    nss_map_attribute userpassword mSFU30Password

    nss_map_attribute homedirectory mSFU30HomeDirectory

    nss_map_objectclass posixGroupGroup

    ss_map_attribute uniqueMember mSFU30PosixMember

    nss_map_attribute cn cn

    ```


    The following entries are changed in the NSS configuration to enable the domain
    users through LDAP:


    ```

    passwd: files ldap

    group: files ldap

    ```


    To test this, use the command:


    ```

    getent passwd

    ```


    This should now show the testuser entry in the passwd output. This is shown in
    Example 9-11 on page 207.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Example 9-11 Partial output of getent passwd ldap in NSS


    | root:x:0:0:root::/bin/bash |

    | bin:x:1:1:bin::/sbin/nologin |

    | daemon:x:2:2:daemon::/sbin/nologin |

    | ................. |

    | testuer:ABC1efgh1234567890:5000:5000:Test User:/home/testuer:/bin/bash |


    > **Important**: Notice how the users show up without a domain name and a separator
    character. This also means that you should take care to prevent overlap, that
    the same user in both local files and in the domain.


    So, instead of generating the uid and gid entries on each client, this method
    takes those entries from Active Directory. However, this means that these entries
    have to be put in the first place.


    The differences, advantages, and disadvantages of the two methods, winbind and
    LDAP, were already mentioned in 4.2, “Integrating with existing network services”
    on page 69.


    Part of this section is based on the information available at:


    ```

    http://enterprise.linux.com/enterprise/04/12/09/2318244.shtml?tid=102&tid=100

    ```


    # 9.4 Pluggable Authentication Modules and the domain


    Once the Linux client is part of a domain (as described in 9.1, “How to join a
    Windows domain” on page 196) and knows about the domain accounts using either
    winbind (as described in 9.2, “Using winbind to make domain users known locally”
    on page 199) or LDAP (as described in 9.3, “How to use LDAP to connect to Active
    Directory” on page 204), we can configure the system to allow domain accounts
    to log.


    Pluggable Authentication Modules (PAM) is a system for abstracting authentication
    and authorization technologies. Using PAM modules, it is possible to change the
    way applications authenticate or authorize accounts without having to recompile
    the application.


    In most distributions, the configuration of PAM is governed by files in/etc/pam.d/.
    Usually there is one file per application. So, changing authentication modes for
    an application is as simple as adding a corresponding module to the config file.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 9.4.1 How to authenticate users using windbind and PAM


    Since the PAM implementation of Linux distribution differs, we look at our distributions
    in detail.


    # Winbind and PAM on Red Hat Desktop


    Red Hat has implemented the pam_stack module. This means that configuration files
    in /etc/pam.d/ can use settings from other files, essentially stacking settings.
    For this purpose, Red Hat has implemented most of the settings in the /etc/pam.d/system-auth
    configuration file. This means that we have only to add windbind PAM modules to
    this file, and then, all applications use windbind aware.


    Because the file /etc/pam.d/system-auth is generated by authconfig, care has to
    be taken in this command after making changes manually.


    Example 9-12 A sample system-auth file contains the lines in Example 9-12.Example
    of part of /etc/pam.d/system-auth file for windbind authentication


    ```

    #PAM-1.0

    # This file is auto-generated.

    # User changes will be destroyed the next time authconfig is.

    auth    required        /lib/security/$ISA/pam_env.so

    auth    sufficient      /lib/security/$ISA/pam_unix.so likeauth nullock

    auth    sufficient      /lib/security/$ISA/pam_winbind.so use_first_pass

    auth    sufficient      /lib/security/$ISA/pam_krb5.so use_first_pass

    auth    sufficient      /lib/security/$ISA/pam_smb_auth.so use_first_pass nolocal

    auth    required        /lib/security/$ISA/pam_deny.so

    account  required        /lib/security/$ISA/pam_unix.so

    account  sufficient      /lib/security/$ISA/pam_winbind.so

    ```


    Once pam_winbind.so has been incorporated into the system-auth file, all applications
    using the file through pam_stack.so are now windbind aware. This means that we
    can login to the Linux client using a domain account, remembering to use:


    ```

    <domainname>=windbind-separator=<accountname>

    ```


    So an example in our domain is AD6380+Administrator.


    If it is problematic that windbind-enabled users are available for all applications
    using the pam_stack module, then pam_winbind.so calls could be placed only in
    the configuration files for those applications that need it.'
