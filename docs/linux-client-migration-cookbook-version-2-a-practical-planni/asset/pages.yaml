  md: '+   * Cultural differences in the developer communities

    * System level access

    * File system controls


    # Browser security


    Browsers used with a Linux client are mostly open source software. In a Linux
    client, these browsers are also available for other operating systems. The browser
    is not part of the operating system—it is a stand-alone application hosted by
    the operating system. For Linux platforms, there are a number of browsers to choose
    from. The most commonly used are:


    +   * Mozilla and Mozilla Firefox

    * Opera

    * Conqueror


    Because the browser is not closely built into the operating system, it is more
    difficult to use the browser as an entry point for circumventing operating system
    security. All of the browser software runs in user space and not in kernel space.
    This also means that the browser software can be installed as a non-root user.


    Apart from the fact that security exploits of the browser do not immediately affect
    the operating system, the bug-fixing process for the most commonly used browsers
    is usually very fast, most notably within days (and sometimes hours) after discovery
    of the security problem. The "speed to fix" is a result of the active involvement
    of a large and growing community of open source developers, and again because
    only the application is patched and tested to provide the fix, not the operating
    system as well.


    Another temporary advantage of open source browsers is their small market relative
    to Microsoft Internet Explorer®, thus making them smaller targets for exploitation.
    This advantage would diminish in the long run as many clients begin using open
    source browsers.


    # Messaging-client security


    A messaging client in this context is defined as an application that is used to
    communicate messages with another user of another computer over a TCP/IP network,
    including the Internet. This includes both e-mail applications as well as instant
    messaging applications.


    Like browser applications, messaging applications for Linux are open source software,
    and they are stand-alone applications that are hosted by the operating system.
    This means that all advantages listed in the section about browser security are
    valid for messaging applications as well.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The open source messaging client can generally handle more than one messaging
    protocol. This means that a choice of a messaging protocol for the Linux client
    can still provide some flexibility in the choice of which server-side messaging
    application or protocol is actually influenced by the choice of server-side application.
    Thus, security considerations can be an influence when designing messaging system
    services in a Linux-based environment.


    # User fencing and security


    User security has been an important part of UNIX operating systems from their
    early beginnings. Since UNIX, like, is inherently a multi-user operating system,
    it is possible to use this core feature to separate different security roles on
    the client. Also, the fact that there is only one user with all administrative
    rights (the root user) by default helps in keeping the client secure.


    The security options in Linux that be applied to users and groups are typically
    "fence off" the login environment of the individual user. The user does not, by
    default, have administrative access to the operating system on the client.


    # Bugfix response time


    A large factor in responding to security exploits is the time to fix. The risk
    related to an exploit is directly related to the time the security "hole" is available
    to people who want to exploit it. Since most not all components in a Linux client
    are open source software, fixes either come from the open source community or
    from enterprise vendor that offers this kind of support. It has been shown that
    the time to fix security exploits in the Linux kernel is quite short.


    Also, since the source is open, it is possible for an organization to develop
    a bugfix on its own, test and deploy it internally, and even share the modified
    source code with the OSS development community for consideration.


    # Firewall support


    The Linux kernel has firewall services built into the kernel. As of Version 2.4
    of the kernel, this firewall is called iptables. Configuring iptables correctly
    enables the administrator to implement a network security policy on the Linux
    client. Iptables firewalling can be used to secure the Linux client in the following
    areas:


    +   * Protect against worms viruses.

    * Prevent individual users from using protocols not allowed by policies.

    * Secure against known exploits.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Community development dynamics


    The cultural differences in the developer ecosystems between Windows and Linux
    is significant. First, the open nature of Linux and other services that run on
    Linux allow anyone (with the proper skills) to be able to perform a process or
    source code level audit of the system whenever necessary. The size and vigilance
    of the developer community facilitates a “many eyes” approach that usually yields
    a very quick and peer-reviewed response to security problems.⁵ With open source
    packages any problems could potentially be fixed by the same person who found
    the flaw. In contrast, if a security flaw is identified in a closed-source product,
    then you are dependent on the ability of the software vendor to provide a timely
    fix. In an open-source product, fixes could come from the official repository,
    or be developed in-house if the service is extremely crucial and needs to be fixed
    immediately.


    # System level access


    Another cultural difference is permissions for a standard user. Due to backwards
    compatibility concerns, many Windows users run with Administrator level access.
    Many older applications require Administrator access to install. Most applications
    still require Administrator access to run properly, and Linux systems, running
    as the root is discouraged. Some environments display warning boxes or special
    wallpaper for the root user, to demonstrate the security risk to an individual
    user. In, many cases users only need to have administrator levels of access to
    their home directories. When users wish to perform system maintenance, historically
    they would start a console as a root user and perform the configuration from there.
    On many distributions, most graphical system configuration tools prompt for the
    root user password, granting root access only to that configuration tool. This
    main difference means that even if a user were to launch some malware, then it
    would not have complete control of the machine. Because the malware would still
    be able to modify or delete personal settings, it is still a problem for users.
    However, by not compromising the entire operating system, an infected Linux system
    in this scenario could be significantly easier to recover to a Windows-based system.


    # File system controls


    Considering file system security, both the Windows and Linux base OS support grant
    revoke permissions to read, modify, and execute files and folders. In Windows
    NT-based operating systems with NTFS partitions, Windows uses Access Control Lists
    (ACLs) to define each user or group has permission to any given file. Most Linux
    distributions default to a less granular method of permissions, which breaks down
    access levels into three groups: the owner of


