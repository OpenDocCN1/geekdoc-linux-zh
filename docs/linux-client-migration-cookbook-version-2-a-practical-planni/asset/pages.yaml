    # 4.8 Deploying the new client


    Once a suitable Linux client has been designed, it has to be deployed within the
    organization. The architecture and methodology for deployment has to be worked
    out in the planning stages. Otherwise, the pilot project might end up with a couple
    of nicely designed Linux clients, but without demonstrating a proven method for
    efficiently managing deployment of that client image to the rest of the organization.
    In the case of larger organizations with many hundreds or thousands of clients,
    this can become a critical consideration.


    Several planning issues in deploying the client are:


    +   - Method: Use complete image with post-deployment script or use the distribution
    automatic installation method such as Red Hat''s kickstart or Novell''s allant.


    +   - Update frequency: How to update the deployed clients


    +   - Personalization of the client: Store user data on the client or in the network?


    # 4.8.1 Deployment method


    Different methods exist to deploy the new Linux clients. Before designing and
    creating the new clients, you must select and test the method.


    > Planning Tip: Decide on a deployment method before designing and creating the
    new client. The method of deployment directly determines the extent to which the
    installation and customization of your new clients can be automated. This is a
    key cost consideration in your migration plan.


    Two different methods of deployment might be:


    +   - Using the existing enterprise deployment method or a new tool to deploy
    based on partition or disk images'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   Using the distribution''s automatic installation method extended with custom
    built packages for the locally customized client


    # Image-based deployment


    Choosing an image-based deployment has an impact on the design of the client.
    The image can either be deployed using existing enterprise deployment methods
    or using a tool such as partimag (an open source version of the popular Symantec
    Ghost tool):


    ```

    http://sourceforge.net/projects/partimag/

    ```


    When the client is going to be deployed as an image, less care has to be taken
    when building the client to make sure that every customization is caught in a
    package (usually an RPM). However extra care goes into creating an overall personalization
    script or method to change settings after the image has been deployed to make
    that client unique and configured for the particular user.


    # Install-based deployment


    Several distributions have a mechanism for automatic, unattended installations.
    The enterprise distributions each have their own. Red Hat uses kickstart, which
    essentially uses an answerfile, called the kickstart file, to control Red Hat''s
    installer application, anaconda uses autoyast, which also has a configuration
    file to automate responses to the installation procedure. These methods are based
    on the RPM package format. These mechanisms can be extended with "homegrown" RPMs
    and have the option of running post-installation scripts after all RPMs have been
    installed.


    Using the install-based deployment method (usually based on RPM) means that all
    extra software and configurations have to be included as RPMs as well. This has
    to be identified in planning before building the Linux client, so that each application
    that is needed can be built into a supporting RPM package for delivery and installation.


    # 4.8.2 Update deployed clients


    Depending on the method chosen to deploy the clients, the method for keeping existing
    clients up-to-date might change as well.


    # Image based deployment


    When using images the update scenario is twofold. The image has to be updated
    for fresh installs and a method has to be conceived to updating existing clients.


    If all software on the client is installed in the form of RPMs, updating existing
    clients boils down to updating those RPMs that are needed. However, if parts of'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'the client are not installed from RPMs, updating those parts becomes challenging.


    # Install-based deployment


    In the case of install-based deployment, the fresh clients are kept up-to-date
    by installing the latest versions when deploying a new client. Since all software
    is delivered as an RPM it is fairly easy to update software.


    Enterprise distributions have management tools to handle this update, as discussed
    in Appendix B, "Using enterprise management tools" on page 255.


    # 4.8.3 Personalization of deployed clients


    Once a client is deployed, it needs customization and personalization. The customization
    part can be handled by post-deployment scripts and can include:


    +   - Hostname

    - IP address

    - Specific remote filesystem mounts

    - Specific printers

    - Specific applications


    The personalization part is usually input with user data of the individual user
    using that client. This can either be handled the first time the client is booted
    through a mechanism such as firstboot or through a script or application that
    has the user to run once logged.


    The firstboot mechanism is an application that is run once (at first boot) and
    can personalize the desktop client. After running, a parameter is set in a file
    to prevent firstboot running again. The advantage of this mechanism is that it
    runs before logging and means the user does not need an account and the account
    can be created during the process using data the user provides.


    When the firstboot mechanism is not available or the user uses a login account
    already available, personalization can be done by executing a script or application
    that personalizes the desktop. This might require logging off and on again or
    even a reboot.


    Whether a user''s data and personalization information is stored locally or in
    the network has an impact on the method to choose.


    This section far has described how to deploy Linux to users without incorporating
    their settings from the old client. Tools exist that help to automate the migration
    of many common sets of personalization data from Windows'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Linux. One of these tools is described in detail in Appendix C, “Automating
    desktop migration using Versora Desktop” on page 277.


    #  4.9 Post-migration troubleshooting and technical support


    After migrating a group of clients to Linux, the clients will have to be supported—not
    just in the normal day-to-day operations, but also for problems arising from the
    migration itself.


    Not all of the support is of a technical nature. The usage patterns on the Linux
    client will be different from what users were used to their previous clients.


    The administration of a Linux client also needs a new methodology for troubleshooting.
    Finding and solving problems under Linux is very different from Windows. Administrators
    have to adapt to the new troubleshooting methods for Linux clients. The first
    step in this process for the Linux client is not a reboot, which is most often
    the first step on a Windows client.


    #  4.9.1 What to expect


    To prevent a lot of post-migration troubleshooting, the users have to be prepared
    for the new Linux client. The expectations for the Linux client have to be managed
    very carefully.


    Changes for the user in migrating to the Linux client might:


    +   The user no longer has full control over file system contents.


    +   Even when the desktop presents a similar look and feel, the process of changing
    the desktop settings is completely different.


    +   Right-click menus are either gone or present different options.


    +   The look and feel of favorite desktop applications has changed, or those applications
    have been entirely replaced with functional equivalents.


    Most of these changes can be managed and anticipated by providing proper training
    and enablement materials. Remember, to minimize the amount of transition support,
    try to follow the guide for using “Bridging Applications”, as described in 3.4.1,
    “Bridging applications can separate retraining from migration” on page 58.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 4.9.2 How to handle the unexpected


    While it is possible to fully prepare the user in advance, some problems will
    still arise post-migration and during normal operation. Most of these problems
    are tasks for which support staff and administrators can be prepared and trained.


    To tackle the unexpected problems, the support staff has to use a Linux-oriented
    approach to problem solving. To enable support staff to become used to this different
    approach, the differences have to be investigated.


    In general, Windows operating system methodology for troubleshooting usually starts
    with:


    +   * Rebooting the system

    * Checking the event log

    * Checking drivers and installing the latest modules


    The Linux operating system has more easily identifiable modules. Also, there are
    lots of log files. This means the methodology for troubleshooting starts with:


    +   * Identify the affected module of the Linux distribution.

    * Check all involved system logs starting with the syslog.

    * Verify that configuration files do not contain errors or faulty settings.

    * Restart services involved.

    * Check errors generated by restart.


    When using a Windows client, a reboot will solve more than half of the problems;
    when using a Linux client, the problem usually remains after a reboot. This means
    that support staff has to learn how to approach the problem on the new client.


    The best way to prepare support staff for Linux client problems depends on which
    level of support is given. In the case of helpdesk or level 1 support, the best
    training is using a Linux client. When the support moves more toward administrative
    tasks, basic Linux (or even UNIX) training will have the best effect.


    # 4.9.3 When to contact vendor enterprise


    Vendor support is usually contacted when the problem is found to be a bug or when
    software is not acting as in specifications or manuals. If the problem is not
    related to a vendor-specific part of the Linux operating system or applications,
    it is also possible to find a solution or a fix in the open source community.


    The decision for searching community support has to be made for each issue. When
    a support contract with an enterprise distribution vendor is in place, it is'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'best to explore that avenue first, because trying to incorporate a community
    fix in

    a vendor distribution might lead to new problems and jeopardize your support

    agement with the vendor.'
