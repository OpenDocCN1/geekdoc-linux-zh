- pgno: 353
  md: '![](img/23b949da14ff7bab8762f0f0361af394_353_0.png)


    # Desktop interprocess communication


    Sometimes you want to control multiple applications from one authority. Or, perhaps
    you want to standardize on one programming language so that customizations do
    not need to be written in each of the various embedded languages. Many Linux-based
    applications support a form of interprocess communication, which allows you to
    control the application programmatically.


    The GNOME developers originally used ORBIT2 (a highly optimized CORBA implementation),
    but lately, they have focused on D-BUS for future development projects.


    DCOP the standard KDE Desktop Communication Protocol. You can use it for all kinds
    of KDE automation and scripting purposes. It is based on the Inter Client Exchange
    (ICE) protocol and uses UNIX sockets instead of method calls. It has its roots
    in a CORBA implementation, but it was completely redesigned for desktop needs
    because the KDE developers were not happy with the CORBA performance at that time.
    Let us take a closer look at DCOP, because this is a proven technology that is
    available today. You can also use DCOP for KDE applications running on the GNOME
    desktop.


    > Figure F-1 Integrated DCOP development with Komander


    326 Linux Client Migration Cookbook, Version 2'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# DCOP


    When you log in to your KDE session, a program called kdeinit is started (by startkde).
    It triggers other applications, such as dcopserver and the KDE daemon ked, which
    are responsible for system configuration management and caching (sysoca), interprocess
    communication, and a lot more. If you really want to understand how this process
    works and which environment variables and configuration files can influence it,
    you should read the KDE for System Administrators Guide available at:


    ```

    http://www.kde.org/areas/sysadmin/

    ```


    You can explore your desktop environment and make DCOP calls with the command-line
    tool dcop, its graphical counterpart kcdop, or with the DCOP language bindings
    using Perl, Python, Ruby, Java, or any other language supported through the keddbindings
    package. The dcop command syntax is as:


    ```

    dcop [ application object [function [arg1] [arg2] [arg3] ... ]

    ```


    # Desktop automation with DCOP


    To begin with your desktop automation, just call dcop, check the output, and go
    further down the pipeline. In Example F-3 on page 327, you can see how this works
    in practice. After listing all applications registered with the DCOP server (of
    which include process IDs, as console''s process ID 366), we open a new KDE session
    and display the first session name afterwards. Next, we list our e-mail accounts,
    check e-mail, compact all e-mail folders, and open a new KMail composer window
    with a few defined values.


    Example: F-3 DCOP in action


    ```

    % dcop

    konsole-366

    kmail


    % dcop console-366 console newSession

    % dcop console-366 session-l sessionName

    % dcop kMailIface accounts


    % kmail default checkKMail

    % kmail default compactAllFolders

    % kmail default openComposer info@kde.org "" "Subject" "DCOP Rocks" 0

    ```


    In Example F-4, we open our favorite URL in Konqueror and generate another browser
    window with two preloaded tabs. The new line switches Konqueror to full screen
    mode, which is useful for presentations or unattended Kiosk mode.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Finally, we switch to desktop 2 by using the published interface of the KDE
    window manager kwin.


    Example: F-4 More DCOP magic


    ```

    % dcop

    konqueror-21209

    kwin

    ...

    % dcop konqueror-21209 konqueror-mainwindow#1 openURL http://www.ibm.com/linux

    % dcop konqueror-21209 default openBrowserWindow http://www.kde.org

    % dcop konqueror-21692 konqueror-mainwindow#2 newTab http://www.linux.com


    % dcop `dcop konqueror-21209 konqueror-mainwindow#1 action fullscreen` activate


    % dcop kwin default setCurrentDesktop 2

    ```


    DCOP is an extremely powerful mechanism and can even be used with XML Remote Procedure
    Calls (through the XML-RPC to DCOP bridge). By using standard UNIX security measures
    for the ICE communication sockets, users should not be able to attack DCOP sessions
    from other users.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Application porting


    When planning for a Linux client migration, you might discover early on in the
    assessment process that you have custom-developed applications that do not run
    natively on a Linux-based client (any Microsoft Visual Basic application fits
    into this category).


    This appendix provides information and links for learning more about the application
    porting process. This topic alone could easily fill an entire redbook. We introduce
    the topic here for the sake of completeness (many Windows-to-Linux client migration
    projects have application porting considerations).


    An extensive online guide for planning porting and migration efforts is provided
    by Novell at this site:


    ```

    http://developer.novell.com/wiki/index.php/Porting_and_Migration

    ```'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# GTK+


    GTK+ is a cross-platform graphical toolkit that is used by applications such as
    The GIMP, GAIM, and the GNOME desktop. GTK+ is written in C, although there are
    language bindings for C++, Python, Perl, and many more languages. GTK+ is licensed
    under the LGPL, and it can be used in both open source and commercial applications.
    More information about GTK+ can be found at:


    http://www.gtk.org


    # Qt


    Qt is a cross-platform graphical toolkit developed by Trolltech and is used by
    the KDE desktop and related applications. Qt is written in C++, although there
    are language bindings for C, Python, Ruby, and many more languages. Qt is dual-licensed
    under the GPL and a commercial license. Therefore, you can develop Qt compatible
    applications free of charge, but to develop commercial applications, you must
    purchase a license from Trolltech. More information can be found at:


    http://www.trolltech.com


    # REALBasic


    REALbasic, provided by REAL Software, Inc., is a cross-platform software development
    environment that also provides an extremely effective path for porting Visual
    Basic applications, so that they can run natively on a Linux client. A technical
    white paper is available that provides a detailed description of the porting process
    using REALBasic. The white paper can be accessed at the following URL:


    http://www.realbasic.com/vb


    # wxWidgets


    Formerly known as "wxWindows", wxWidgets provides an open source C++ GUI framework
    for cross-platform programming. It lets developers create applications for Win32,
    Mac OS X, X11, and so forth. wxWidgets, appear to be native on each platform that
    it targets. wxWidgets is licensed under the wxWidgets License, and can be used
    free of charge in both open source and commercial applications. More information
    about wxWidgets can be found at:'
  merge: -1
  img_proc: true
- pgno: 358
  md: "http://www.wxwidgets.org\n\nhttp://en.wikipedia.org/wiki/WxWidgets\n\nSome\
    \ older tutorials are available at the IBM Developerworks Web site that explain\
    \ how to use this toolkit in detail:\n\n+   * Looking through wxWindows: An introduction\
    \ to the portable C++ and Python GUI toolkit:\n  * http://www-106.ibm.com/developerworks/library/l-wxwin.html\n\
    * Porting MFC Applications to Linux: A step-by-step guide to using wxWindows:\n\
    \  * http://www-106.ibm.com/developerworks/linux/library/l-mfc\n\n# Mono and the\
    \ .NET Framework\n\nThe Mono project is an open source implementation of the Microsoft\
    \ .NET Framework. Mono is based off the ECMA standards for the .NET Common Intermediate\
    \ Language (CIL) and the C# language. The majority of the .NET standard libraries\
    \ have been reimplemented on Mono. As of Mono version 1.1, WinForms, the graphical\
    \ library used by most applications, which targets the .NET Runtime, has been\
    \ rapidly progressing and is expected to be completed in Version 1.2. Mono also\
    \ includes support for GTK+, a graphical toolkit that works on both Linux and\
    \ Windows.\n\nBoth Mono and .NET support programming in more than C# with languages\
    \ such as Visual Basic.NET, IronPython, Nemerle, and Boo. Languages that target\
    \ the Common Language Runtime (CLR) can access the framework, and they are seamlessly\
    \ interoperable with other languages, even in the same application.\n\nWhile .NET\
    \ applications can contain calls into native APIs, the majority of any given.\
    \ .NET application can easily be ported to Mono. More information about Mono can\
    \ be found at:\n\nhttp://www.go-mono.com\n\nSome tutorials about porting from\
    \ Microsoft .NET to Mono can be found at:\n\nhttp://developer.novell.com/wiki/index.php/Porting_and_Migration"
