    # 7.5.1 Multi-station computing and Useful Desktop Multiplier


    Multi-station computing software enables a single computer system to be shared
    by or more connected users, each user having an independent workstation consisting
    of a keyboard, monitor, and mouse. For instance, multi-station Linux "desktop
    virtualization" software such as Useful''s Desktop Multiplier can enable a single
    IBM IntelliStation system to provide many users with fully independent desktop
    workstation services, simply by plugging in extra video cards, monitors, USB keyboards,
    mice, and other peripheral devices directly to the single shared system.


    Providing multiple workstations with a single high-end desktop system (rather
    than using multiple individual PC systems) can yield significant savings in hardware
    and software acquisition costs, and it also multiplies those savings for ongoing
    energy and system administration overhead. Powerful computer systems such as high-end
    IBM IntelliStation workstations can provide fully independent desktops to many
    local users, all directly connected to the shared system using regular VGA and
    USB cabling. Even more users can be connected to the single shared system by PCI
    expansion units and distance extensions as needed.


    Multi-station computer systems are ideal for environments where workstations are
    clustered together in close proximity. Example scenarios include classrooms, point
    of service systems, training labs, kiosks, centers, Internet cafes, voting and
    registration systems, and back-office environments where PCs are used as low-cost
    console terminals for servers and networking equipment.


    Using a powerful and reliable IBM IntelliStation system to serve independent desktops
    to many directly connected users offers an efficient alternative to deploying
    multiple desktop computers and can deliver significant advantages over traditional
    methods of providing desktop systems. Figure 7-8 on page 164'
