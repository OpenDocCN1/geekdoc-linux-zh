    # 9.7 How to use network printers in the domain


    Being able to use existing printers is one of the most important preconditions
    for a new type of client in any environment. We do not want to keep separate printing
    environments for every type of client.

    This means that the Linux client has to use the (network) printers available in
    the domain. We can achieve this in two ways:


    +   - Print directly to the printer using its network interface.

    - Print to the printer using the Windows print server and its SMB interface.


    Both options are available using CUPS from the Linux client. We suggest using
    the second option, however, since all printing in the domain (and user''s environment)
    is equal. This means there are just prints and not Windows prints and Linux prints.

    You need to be running CUPS on the Linux client. Check this by:


    ```

    /etc/init.d/cups status

    ```


    This should return that CUPS is running and give its PID. If not, start it using:

    /etc/init.d/cups start'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Make sure that CUPS is started at the next reboot:


    ```

    chkconfig cups on

    ```


    You also need to make sure that there is a link to smbpool in the CUPS back-end
    directory:


    ```

    # ls -al /usr/lib/cups/backend/smb

    lrwxrxrxr 1 root 21 Mar 1 12:34 /usr/lib/cups/backend/smb ->

    ../../../../bin/smbpool

    ```


    You can verify smb support in CUPS using this command:


    ```

    # lspinfo -v | grep smb

    network smb

    ```


    You can create a new printer in two ways:


    +   - Using the lpadmin command

    - Using the CUPS Web interface


    We describe both methods in detail.


    # Create a printer using lpadmin command


    You can create a printer from the command line. This enables scripted creation
    of many printers. This means that creation of domain printers can be incorporated
    into a login profile, such that users do not have to create printers manually
    on their client


    To create the printer on the command line, we use the following command:


    ```

    lpadmin -p printer1 -E -v smb:Administrator:****SMB3LAB26/printer1

    "printer1" in AD6380 example domain"

    ```


    You need to change the fields to the names in your own domain. The first printer
    is the local printer name and the second printer is the name of the printer share.
    The server SMB3LAB26 is the printer server. If the printer share is available
    for everyone, you can leave out the username and password in the smb: URL. Since
    using a user-protected printer share exposes passwords in scripts and login profiles,
    the best practice is to make printer shares available for everyone.


    You can also add the -m option to set the model. Use the -l option to set a location.'
