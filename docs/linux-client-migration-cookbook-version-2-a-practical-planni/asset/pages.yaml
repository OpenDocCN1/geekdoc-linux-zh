- pgno: 334
  md: '# Solution Design


    The office deployed multi-station systems based on Fedora Core 4 and Desktop Multiplier,
    each with four or six video heads. Four of the quad-user systems were retrofitted
    from the existing inventory of workstations by adding video cards and memory,
    while the two six-user systems required new computers based on AMD''s Athlon 64
    processor. All systems contained memory to provide between 256 and 512 MB of RAM
    per attached workstation.


    In the new deployment, each multi-user system served four to six users. One of
    the systems was fitted with four dual-head video cards to accommodate four dual-display
    systems. A central server running Linux was added to provide authentication services
    and remotely mounted home directories for each user.


    The four users in the executive suite were provided with client workstations connected
    to another multi-station host


    Access to optical drives was preserved by positioning multi-station systems (each
    with a single optical drive) close to the users who anticipated them most frequently.
    Deploying external USB optical drives (for approximately $30 more than the cost
    of an additional internal drive) is an option if concurrent and frequent access
    become necessary in the future.


    Minimal changes to the office layout were required to accommodate the new configuration.
    The most drastic changes were the removal of individual workstations under most
    employees'' desks, and the deployment of storage, backup, and intranet servers
    based on hardware from the former workstation computers. No additional electrical
    or network cabling was required to add workstations for the ten new users. An
    important consideration became installing new cabling and electrical outlets costly.


    With the savings from reduced management costs, the office was able to expand
    the deployment beyond the initial plan to have one workstation for each employee,
    and the office outfitted every available desk with a workstation. The extra workstations
    increased flexibility in work patterns and improved collaboration among employees.
    In addition, an RDP server was set up to provide access to key Windows applications
    from anywhere in the office using the Open Source rdesktop software at:


    http://www.rdesktop.org/


    The move to a consistent software platform and patch level reduced demands on
    the IT staff. The hardware-related savings allowed the office to increase their
    refresh cycle from four years to two years, ensuring all users have the latest
    high performance computer hardware. As a result, single image desktops eased management,
    central storage, and backup-related overhead.


    Appendix D. Multi-station computing deep dive using Useful Desktop Multiplier
