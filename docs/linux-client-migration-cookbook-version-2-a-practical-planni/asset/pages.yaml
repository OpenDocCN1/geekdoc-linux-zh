    # 2.3 What makes Linux so different


    We must begin any discussion about why Linux is so different by first understanding
    where it came from. Linux would not exist as it is today if it were not for the
    cultural dynamics of the free software and open source movements.


    > Note: We begin defining how Linux is different by discussing the cultural dynamics
    of the free software and open source movements. We continue this discussion by
    illustrating top-to-bottom technical differences of the Linux desktop software
    stack in Chapter 5, "Linux architecture and technical differences" on page 109.


    # 2.3.1 The movements: free software and open source


    Two critical forces have shaped the development of Linux so far:


    +   - The free software movement¹¹¹

    - The open source movement¹¹²


    These two forces have created the growth medium for the grass-roots community
    dynamics that have led to the development of Linux as it is today (and, to a large
    extent, led to the graphical desktop environments and applications that you run
    on top of it).


    In casual conversations, it is easy to lump the goals of the free software and
    the open source movements together. To an outside observer, the differences between
    them are subtle and rarely recognized. To members of the community, the differences
    are very important.¹¹⁰ The free movement is a social movement. "Free software"
    in this case is not free by their definition unless the source code is available.
    In other words, free software implies open source. In contrast, the open source
    movement embodies a development methodology. The fact that a software product
    is "open source" does not necessarily mean it is free. So, "free software" implies
    open source, while defining a project as "open source" does not necessarily guarantee
    all of the freedoms that are promoted by the free software movement.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Note: "Free" in this context has a different meaning than simply not having
    to pay for something. A common refrain in the development community is to define
    freedom in this context using the following phrase: “freedom as speech, not as
    beer”. Freedom in this sense means that you have been granted certain liberties
    in how you may use the product, and that it has a certain price.


    An excellent essay is available online that explains in detail the relationship
    between the free software and open source movements:


    Live and let License, by Joe Barr, in linuxworld.com, published 5/23/2001


    ```

    http://www.itworld.com/AppDev/350/LWD010523vcontrol14/

    ```


    The community development dynamics that have been guided by the goals of the free
    software and open source movements have led to top-to-bottom transparency in the
    Linux software stack: from low-level kernel all the way up to user productivity
    applications in the UI.


    It is characteristic, the potential for top-to-bottom transparency of the entire
    software stack, that should be viewed as the single most important differentiator
    between Linux and Windows. And note too that this characteristic does not derive
    from purely technical differences. It is rooted in the freedoms promoted by both
    the free software movement and the community development dynamics promoted by
    the open source movement.


    The following is stated earlier in this book, but it is worth repeating again
    in this context. In an actual setting which you are presenting a justification
    model for a large migration to desktop Linux, you undoubtedly talk about overall
    cost to the company and the return on investment models that justify that cost.
    But within setting, it is important to emphasize that you would not be talking
    about Linux on that day, in that context, if it were not for the game changing
    dynamics of the free software and open source movements.


    Any IT organization that makes a strategic investment in Linux is also making
    investment in these movements. And the long-term viability of a Linux-based strategy
    is going to be affected by the continuing progress of these movements.


    # 2.4 Migration goals


    Not all migrations are the same. While eventually migrations will have a goal
    of replacing all desktop clients in an organization with Linux clients, most early
    migrations serve as pilot projects and only migrate a part of the desktops.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'In this section, we discuss both goals in more detail. We indicate how the
    goals of both types of migration are different. Details for planning either a
    partial migration, pilot migration, or full migration are found in the rest of
    this book.


    # 2.4.1 Pilot migration


    The actual goal of the pilot migration is not that some client will be running
    the Linux operating system. The main goal of a pilot migration is answering the
    following question: How can we deploy across the organization with confidence?


    A pilot migration has to target all types of usage models that will be included
    in an eventual migration. All applications that are going to be considered in
    the migration have to be included in the pilot as well. This way, the pilot can
    be seen as an information-gathering exercise for the full migration.


    The pilot migration should give answers to most of the following questions:


    +   - Can all applications be used after migrating?


    +   - Users are able to use the infrastructure of the organization in the way
    they before the migration?


    +   - Administrators still able to perform all their tasks after the migration?


    +   - Do the new infrastructure components, such as terminal servers or consolidated
    Windows desktops, function as planned?


    # 2.4.2 Full migration


    In full migration, the migration methods that were tested in the pilot phase are
    used to successfully complete migration of all targeted desktops to the new configuration.


    Goals of a full migration could include the following:


    +   - Increase the level of desktop client security.


    +   - Improve manageability of desktop clients.


    +   - Lower the overall total cost of ownership (TCO) of desktop clients.


    +   - Decrease dependency on a single software vendor.


    +   - Improve the lifecycle of client hardware.


    +   - Comply with governmental regulations or strategies (for example, China has
    declared use of OSS as a strategic imperative).


    +   - Extend usage of Linux from servers to desktop to leverage existing experience
    and skills.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   - An excuse for change (for example, to clean up existing problems and
    start new with a standardized client implementation strategy).


    Good planning is a major part of the migration. If a migration is started from
    a technical perspective, it is very easy to start with the technical challenges.
    That is certainly a part of a successful migration. But to complete a successful
    migration, management support on all levels is certainly just as important.


    In the remainder of this book, we discuss how to plan a migration, both human
    factors and from a technical point of view. We then document an example of migration,
    including technical *how to* steps for solving some of the issues involved.'
