    # 7.4 Stateless client


    A stateless client is a desktop installation that stores no state information
    on the client. This means that not only is every user''s personalization data
    stored on a central server, but also operating system and application installation
    and configuration are performed through a central server. Stateless clients can
    either boot the entire operating system from the network or cache an installation
    locally and synchronize at a regular interval. A stateless installation includes
    benefits of a thin-client solution in that user data is backed up centrally and
    available to any client automatically, and that application patches and upgrades
    only need to be performed on one central server. However, unlike thin-client solutions,
    stateless clients run all applications'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'thus, utilizing the full power behind desktop workstations, and require no
    specialized network infrastructure. Some stateless installations do not appear
    to be any different than a standard Linux installation. However, if a client machine
    were to fail, it could be completely rebuilt instantaneously, with no data loss.
    The benefits of stateless clients are clear, however as of the time of writing
    this IBM Redbook, stateless Linux required in-development software or a custom
    implementation.


    > "Stateless Linux ... where the root partition is mounted read-only and synched
    transparently with a central source, giving the central-state advantages of client
    with the low hardware and network infrastructure costs of a cheap-Intel-box client."


    +   - Seth Nickell, from:

    - http://www.gnome.org/~seth/blog/sabayon


    # 7.4.1 Red Hat''s Stateless Linux project


    Currently in development, Red Hat''s Stateless Linux project aims to include stateless
    Linux with Red Hat Enterprise 5. To deploy stateless Linux, first a prototype
    server needs to be created. This server stores the snapshots, or client installations,
    that are to be distributed to each stateless client. A snapshot is a complete
    installation of an operating system in a subdirectory on the server. This environment
    is entered by the **chroot** tool (For more about **chroot**, see the Linux man
    page), and managed via standard management tools, such as yum.


    Stateless Linux supports booting operating system snapshots over the network,
    from a read-only partition on the local hard, or off a CD or DVD-ROM. Updates
    to a snapshot take effect on the next boot for network boot machines, while local
    hard drive-based snapshots poll the server for updates. Naturally, CD and DVD-based
    snapshots have to be burned in for each snapshot release.


    A description of the goals and theories behind Stateless Linux is available at:


    http://people.redhat.com/~hp/stateless/StatelessLinux.pdf


    More information about Stateless Linux can be found at:


    +   - Stateless Linux tutorial:

    - http://fedora.redhat.com/docs/stateless

    - Stateless Linux project:

    - http://fedora.redhat.com/projects/stateless/'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 7.4.2 Custom implementation of stateless client


    A customized stateless Linux installation method has been implemented at a large
    industry company in Germany, using a highly specialized initrd adaptation. They
    use about 4,500 laptop computers and another 2,000 stationary clients. These are
    booted over the network (PXELinux³) and configured booting according to:


    +   * What hardware is detected (using Kudzu⁴ for detection)

    * What applications need to be run (for example, some applications require a screen
    resolution of 1024x768, even if the hardware could do better)

    * How they are connected to the network (Olympic Token ring, ISDN, GPRS Option
    Card, or Bluetooth phone)

    * System default login rights: What user and group is logging on (which results
    in access to different applications)


    All configuration data (such as /etc or configuration files in the users'' home
    directories) is assembled during the boot process and written to memory, such
    that even with access to a hard drive from one system, it is impossible to tell
    which network this machine was connected to or who has been working with. Each
    user needs to have an up-to-date system at any time. As such, stationary users
    have access to all applications via NFS. Mobile users (who have pre-installed
    Linux system on their Thinkpads) get their applications rsynced during the boot
    process, though certain parts of the system are rsynced only when the network
    connectivity is fast enough (for example, an X11 server update does not run over
    a dual-connection). After booting, users have thirty seconds to log into the system
    with Omikey USB smart card reader and password; otherwise, the system is rebooted
    (and in certain cases, even reed and destroyed). This configuration allows for
    secure data backup, easy installation and upgrade rollout, and a fast, reliable
    desktop environment for users.


