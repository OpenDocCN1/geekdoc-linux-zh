    the suite for managing: assets, data, desktops, handhelds, Linux, desktop personality
    settings migration, servers, software, and patches. Their Linux Management solution
    uses policies and automation to manage and maintain Linux systems.


    The ZENworks suite focuses on full lifecycle systems management. For a complete
    overview of the ZENworks Suite functionality, refer to the Novell Web site at:


    http://www.novell.com/products/zenworks/


    See Figure B-3.'
