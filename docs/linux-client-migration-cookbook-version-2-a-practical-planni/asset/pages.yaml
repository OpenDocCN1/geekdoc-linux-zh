    # 4.7 Unmigratable applications


    This section discusses issues related to applications that cannot be migrated
    to run directly on a Linux client. We propose alternate ways to support these
    applications for access from a Linux client.


    We assume that the number of unmigratable applications is small and that a small
    percentage of users are using these applications. If this is not the case, then
    the case for the client migration has to be reconsidered.


    # 4.7.1 What makes an application unmigratable


    We define an application as unmigratable when one or more of the following statements
    about the application are true:


    +   - A Linux version of the application or an alternative application does not
    exist.

    - Porting the application to Linux is not feasible.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   License issues make a move to Linux impossible or highly expensive.


    Once an application is designated as unmigratable, there are several ways to migrate
    to a Linux client and solve the issues around this application:


    +   Investigate whether the application can run on a Windows server and be used
    through remote access mechanisms such as a Terminal Server, Citrix Metaframe,
    or NoMachine NX.


    +   When usingWorkplace™ Managed on the Linux client, investigate the use of Ericom
    Powertem WebConnect for Workplace to connect to Windows servers unmigratable applications.


    +   Examine whether it is possible from a cost perspective to run VMware workstation
    on the client to create virtual Windows machines on those clients that still need
    to run the application natively in Windows.


    +   Create dual-boot clients if the application is not used very often.


    +   Leave some clients out of the migration and consolidate unmigratable applications
    on those shared clients, for use by all users who need to use those applications.


    # 4.7.2 Terminal Server, Citrix Metaframe, or NoMachine NX solutions


    If the application can run as a centralized application on a server, solutions
    such as Windows Terminal, Citrix Metaframe, or NoMachine NX can be used to access
    them remotely. Before an application can be moved to a central server, certain
    conditions have to be met:


    +   The application has to be able to run on a multi-user environment. A multi-user
    environment has several consequences:


    +   Settings must be stored in a per-user location in the registry and file system.


    +   More than one user can run the application simultaneously.


    +   The application license must allow you to run it in a multi-user environment.


    +   The servers must have enough resources to allow you to concurrently run multiple
    instances of the application or other non-migratable applications.


    Client applications are available for Linux for Windows Terminal Server, Citrix
    Metaframe, and NoMachine NX. The client for Windows Terminal Server, desktop,
    is open source; the Citrix client is available when you purchase Metaframe solutions;
    and NoMachine has released the NX client under the GPL.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 4.7.3 Ericom Perwaterterm WebConnect for Workplace solution


