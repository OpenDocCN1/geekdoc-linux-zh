    # Understanding how multi-station computing works: Exploiting the flexibility
    of X Window System


    The X Window System (also known as X11 or X) is a windowing system for computer
    displays, which provides the framework for the graphical user interface found
    in most Linux distributions. X is responsible for drawing and moving windows on
    the display and interacting with input devices such as a mouse and keyboard. X
    does not specify the appearance or behavior of the user interface. Xorg, the current
    reference implementation of X, is the most commonly bundled and distributed version,
    although implementations as XFree86 are also popular. For more information, see:


    ```

    http://en.wikipedia.org/wiki/X_Window_System

    http://wiki.x.org/wiki/

    ```


    # The design of X


    The design of X is based on a client/server model, in which the server communicates
    with client programs. The X server accepts requests to display graphical output
    (windows) from the window manager and returns input (keyboard, mouse, and so forth)
    to the window manager. The window manager running above X (such as Enlightenment
    or twm) controls the placement and display of application windows. On top of the
    window manager, GUI widget toolkits (such as Qt and GTK) and desktop environments
    (such as KDE and Gnome) provide the windows with their specific appearance and
    visual styles.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Applications, such as Web browsers, text editors, and so forth, request that
    the window manager provide windows with specific user controls (check boxes, buttons,
    scroll bars, and so forth) in specific positions. The window manager, in conjunction
    with any GUI widget toolkits in use, then composes the requested window for the
    user.


    The X server is capable of keeping track of multiple video cards, monitors, and
    input devices. Therefore, an X server is capable of logically interfacing with
    a large array of displays. In a multi-display configuration, X can be configured
    to present the displays as individual displays or as one large display, or as
    multiple logical groupings of one or more displays. See Figure D-3.


    ![](img/23b949da14ff7bab8762f0f0361af394_337_0.png)


    Figure D-3 Standard single-user X server


    Figure D-3 shows a typical single-station X implementation that uses a single
    server to handle a single keyboard/mouse input and outputs a single desktop to
    one or more monitors.


    See Figure D-4 on page 311.'
