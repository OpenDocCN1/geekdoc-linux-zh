- pgno: 197
  md: '# Point of service and call center applications


    Multi-station platforms can provide cost-effective access for point of service
    applications as service desks, ticket vending, and registration systems. Computer
    terminals at point of service and point of sale locations are often located in
    close proximity that multi-station systems can provide cost-effective access to
    back-end systems. Since applications running on these systems are typically based
    on terminal emulation, distributed Java applications, or Web-based technologies,
    multi-station solutions can easily provide an effective alternative to dedicating
    PCs or thin client terminals. a multi-station approach provides significant cost
    savings where the cost of on-site service is high by reducing the number and complexity
    of computer workstations in the field.


    # Back office and data centers (terminals)


    Multi-station systems combined with terminal emulation softare could enable IT
    departments to more efficiently deploy green-screen terminal replacements that
    connect securely with terminal-based applications as online transaction processing
    (OLTP) systems and console monitors. Each multi-station system could provide up
    to ten independent user stations, with each running or more terminal services
    connected to the back-end system using common protocols as TN3270 and TN5250.
    Using a multi-station Linux system to provide console terminals eliminates the
    need to acquire and maintain proprietary terminals and potentially less rack space
    than terminal emulation systems based on single-station PCs.


    # Public computer access and education environments


    Applications running in public access or educational environments are typically
    not computationally intensive, users are often clustered in close proximity, and
    their needs are well met with desktop Linux. IT expertise and the resources needed
    to maintain computer hardware is often scarce in these environments, hence the
    reduced maintenance of the multi-station approach combined with Linux’s enhanced
    security and client lock down provide many significant advantages.


    # 7.5.5 Advantages of deploying multi-station Linux systems


    Multi-station systems can potentially provide all the advantages of both thin
    client and rich client environments, effectively integrating the performance benefits
    of rich client computing with the cost and management benefits of centralized
    server-based computing environments.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Performance


    Multi-station multiplies the overall return on IT investment, especially when
    deploying high performance and high quality IBM IntelliStation hardware, because
    all of the users on the shared system benefit from the increased performance and
    reliability gains.


    Compared to multi-station systems, thin client devices could be more susceptible
    to negative performance impacts because they depend almost entirely on the server
    system and underlying network infrastructure to provide applications, storage,
    and CPU processing power.


    In contrast, each station of a multi-station deployment could be directly connected
    to a single system, thus sharing in the full capabilities of a powerful workstation-class
    system that might not be affected by variability in network and remote server
    performance. In a properly designed environment, multi-station systems could provide
    substantially higher performance for users compared to using dedicated thin-client
    or low-performance PC systems, while reducing the overall network traffic loading
    as compared to client/server systems.


    # Infrastructure and system management


    Deploying large quantities of computers anywhere is typically an extremely complex,
    time-consuming, and expensive process. The total maintenance and support costs
    for the average corporate PC system can be significant. Multi-station Linux technology
    provides an alternative strategy that could reduce redundant hardware, software,
    energy and system management costs.


    Useful Desktop Multiplier, like other approaches to desktop virtualization and
    desktop consolidation as remote desktops, can substantially reduce the number
    of software and support subscriptions required. In addition, because the number
    of deployed systems is reduced versus single-station systems, remote management,
    software updates, and support costs are also reduced.


    # Security


    Since each user on a multi-station client is connected directly to a common computer
    system, there is no need for client hardware or software at the user’s physical
    desktop other than a regular keyboard, mouse, and monitor. This added security
    feature can help facilitate compliance with increasingly stringent internal standards
    or regulatory access control requirements.


    Reducing the number of deployed systems enables IT staff to rapidly respond to
    emerging security threats that require software updates. Using centralized multi-station
    deployments reduces the number of systems that need to be both physically and
    logically secured, and allows the consolidated server systems to exist in centralized
    and distributed locations as needed.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Cost: Economy of scale


    For most organizations, the up-front costs of deploying desktop computer systems
    typically represents a small fraction of the total lifecycle cost of maintaining
    those systems. The remaining costs consist mostly of IT staffing costs, hardware
    and software maintenance, and lost productivity due to interruptions for software
    updates, troubleshooting, viruses, and various technical support issues.


    The multi-station client computing strategy introduces the potential for significant
    cost savings in total PC lifecycle management. This is due to all of the inherent
    economy of scale benefits that have been discussed so far.'
