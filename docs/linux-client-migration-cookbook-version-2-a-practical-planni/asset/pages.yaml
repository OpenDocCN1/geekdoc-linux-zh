    # 4.6.4 Offline mode


    In this section, we discuss working in offline mode.


    # Offline messaging


    There are many full-featured desktop e-mail client available (such as Microsoft
    Outlook or IBM Lotus Notes) that provide for offline access to a user''s e-mail.
    Frequently when planning a Linux migration for mobile (laptop-based) users, supporting
    a Linux-based messaging client with offline capabilities will be the single most
    important design decision in a mobile desktop application migration strategy.
    There are Linux-based messaging client options that provide for offline access
    modes. Mozilla Thunderbird supports POP and IMAP protocols. More information about
    Thunderbird can be found at:


    http://www.mozilla.org


    Although Thunderbird will support offline messaging modes, it does not provide
    a way to integrate calendar and scheduling functionality into the messaging client
    that is provided by systems such as Microsoft Outlook with Microsoft Exchange
    back-end and IBM Lotus Notes with Domino back-end. For this reason, we choose
    to demonstrate of Novell''s Connector combined with the Novell Evolution e-mail
    client in Chapter 8, "Client migration scenario" on page 173. Extending the example
    migration scenario in Chapter 9, "Integration how-tos" on page 195, for the notebook
    user that you will also have to test and evaluate the offline capabilities of
    that solution.


    # Offline files


    Because every user to some extent creates and manages files and folders, follows
    that the notebook user should be able to access copies of their files in offline
    mode. However, the primary storage location for these files should be a regularly
    backed up and highly available server.


    For example, Microsoft provides methods for automatic synchronization of files
    between servers and mobile clients. One of these methods uses the Briefcase, a
    special folder whose contents are synchronized at specific intervals. A second'
