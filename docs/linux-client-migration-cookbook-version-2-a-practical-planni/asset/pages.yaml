- pgno: 317
  md: '# Deploying multi-station solutions on the IBM IntelliStation platform


    The amount of computing power available to the user of a computer system is determined
    by a number of factors including CPU speed, system memory, and storage. Those
    measures also apply to multi-station systems, with some additional considerations.


    As with single-station PCs, the number of simultaneous users or processes that
    can be supported is bound not just by the amount of computational power that is
    available on the PC, but also by how long it takes to service a particular process
    and the number of concurrent running processes. Obviously, the total number of
    concurrent processes increases with the number of users sharing a multi-station
    computer. Less obvious is how those processes and other factors interact to affect
    the user experience on each station.


    In this section, we consider a number of hardware and software factors that can
    determine the total number of users who can effectively work from a single multi-station
    Linux computer.


    > **Important:** In deploying a multi-station computing solution, you must care
    to test client interactivity and overall performance. Defining the acceptable
    level of client performance supported by the multi-station host with the maximum
    number of clients all logged on and running their key applications simultaneously,
    and provisioning the host systems to meet that goal, is a critical design requirement
    for success of the solution. See "Processor requirements" on page 293.


    # Hardware requirements


    This section describes the hardware requirements and related considerations for
    deploying multi-station Linux desktop systems.


    Due to the widespread availability of multi-headed video cards and USB input devices,
    many current personal computer systems can be configured for two local users simply
    with the addition of a new set of input and output devices including a keyboard,
    mouse, and monitor. By adding video cards, several users can be simultaneously
    supported on properly configured systems.


    A multi-station computer can be built using standard PC components; however, more
    robust, higher performing platforms, such as the IBM IntelliStation A Pro and
    IntelliStation M artworks, are ideal. Most common configurations incorporate dual-head
    cards using ATI or NVIDIA chipsets, a generous amount of RAM, and x86, EM64T,
    AMD64 processor and motherboard with a'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'number of free PCI/AGP/PCI-E expansion slots. Criteria for specifying equipment
    to meet each of these requirements is described in more detail.


    # Dual-head video cards


    Although multiple single-head video cards can also be used, dual-head video cards
    are preferred for multi-station systems both to maximize the use of workstation
    expansion slots, as well as for taking advantage of the cards'' on-board screen
    mirroring or screen spanning capabilities. In general, any recent single or dual-head
    video card is compatible with multi-station configurations. However, cards based
    on ATI''s FireGL workstation or Radeon consumer chipsets, or NVIDIA''s Quadro
    workstation or GeForce consumer chipsets are known to work and provide good driver
    support for multi-station configurations and other multi-monitor setups. Some
    video cards might work well individually but not in concert with other video cards
    installed in the same multi-station system. Be sure to test combinations of video
    cards in all anticipated multi-station configurations prior to establishing standard
    configurations. Figure D+1 on page 292.


    > Note: Some video cards do not support 3D rendering on multiple screens simultaneously.
    If 3D video rendering is critical to the utility of the multi-station systems,
    individual models of video cards should be tested for 3D compatibility.


    Useful''s Desktop Multiplier system does not currently support 3D graphics acceleration
    software.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/23b949da14ff7bab8762f0f0361af394_319_0.png)


    Figure D-1 Adding a video card to an IBM IntelliStation A Pro workstation


    # PCI/AGP/PCI-E expansion bus


    The number of video cards (and hence, video heads) that you can install in a workstation
    computer is limited by the number of expansion slots on the workstation, and to
    a lesser extent, the bandwidth of the expansion bus. A single 32-bit PCI bus at
    33 MHz is theoretically capable of transferring data at 133 Mbps, or approximately
    the data required to display full-screen software-decoded DVD movie streams simultaneously
    to six video heads with overhead (720 pixels x 480 pixels x 2 bytes/pixel x 24
    frames per second x 4 video heads=99.5 Mbps). This worst case bus utilization
    scenario far exceeds normal workstation display usage.


    In new workstations, each lane of a PCI Express expansion bus can carry up to
    250 Mbps, which supports the data transfer for more than ten software decoded'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'DVD movie streams. With up to 16 lanes for PCI Express video card, the number
    of available expansion slots, rather than the bandwidth, is often responsible
    for limiting the total number of video displays that can be connected to a multi-station
    system. Current IntelliStation models typically have three to five free PCI-X
    or PCI Express expansion slots, supporting a total of 6 to 10 single-monitor stations,
    or 3 to 5 dual-monitor stations per computer. In either configuration, performance
    of the multi-station system is not strictly limited by the bus or video cards.


    When deploying high-density desktop computers to many users within the same area,
    PCI hardware expansion units can allow additional video cards and peripheral devices
    to be added to facilitate as many directly users as the systems memory, CPU, and
    PCI bus permit.


    # Processor requirements


    The optimal number of users supported by a particular CPU in a multi-station system
    cannot be reduced to a simple formula, because overall performance issues are
    largely dependent on the nature of usage. An IntelliStation system with a dual-core
    2.6 GHz processor could reliably support over 20 users, simultaneously running
    "low utilization" applications as terminal emulators or simple data entry applications.
    The same system could support far fewer users, 4-8 users, with full graphical
    environments performing office tasks such as word processing and Web browsing.
    The same system used by programmers who frequently compile and test code could
    likely support 2 to 4 users without noticeable lag.


    One method to estimate CPU usage is to examine the CPU load average, which is
    the number of users waiting for execution time at any given point. On a single
    processor system with no HyperThreading, a load average of 1.0 indicates that
    one process is always waiting for execution time. This is the ideal condition.
    A load average of more than 1.0 indicates that some processes are waiting for
    execution time, while a load average of less than 1.0 indicates that CPU cycles
    are being unused or idle.


    To determine the optimal multi-station system configuration for a particular usage
    pattern, profile the load average for that class of users at peak usage on their
    current single-user systems. For best results, the load average during peak usage
    of all users on a multi-station system should not exceed 2.0 per processing core.
    A load average of 2.0 during peak usage indicates that the CPU is, in general,
    able to serve all regular priority user processes as required by user applications,
    while ignoring the usually more numerous background processes. Faster CPUs or
    additional processing cores can increase the computational power to decrease the
    amount of time it takes to service a process, and therefore increase the number
    of users that the system can support.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'Useful''s Desktop Multiplier software shares the opportunity for processor
    time at the X server equally for all users, but it does not attempt to modify
    the way in which the underlying Linux kernel handles processes and threads. Since
    most line-of-business applications do not spawn multi-threaded CPU-intensive processes,
    the combination of a dual-core processor and an SMP kernel should easily provide
    acceptable levels of performance for each client on the multi-station system.


    As a single-station Linux desktop or thin client system, if a CPU-intensive application
    or event is triggered by a user on a multi-station system, all other running user
    processes might experience a negative performance impact from processes running
    in the system context Hardware-related CPU spikes arising from processes context
    at a higher priority than processes can negatively affect the processes of all
    users. Various scheduling utilities exist to set priorities for application and
    system-level events, as nice and renice, which are standard process management
    tools available with most Linux distributions. There are numerous other special
    priority schedulers available from various sources.


    # Persistent storage


    When considering local storage for multi-station deployments, hard disk speed
    and cache size tend to be more important factors than total disk size. Multi-station
    computers with networked user file storage, the swap partition and temporary user
    files are unlikely to ever occupy more than 10 GB in total, but that usage would
    be the result of many small files. Many user applications and system processes
    store temporary working files in the /tmp directory. With a single user, relatively
    few processes read and write files to directory, and it is unlikely to grow to
    more than 1 GB in size with any regularity.


    As a single user, responsiveness of applications as a Web browser or OpenOffice
    benefits from a high-performance hard disk. Applications often make and rely on
    many small files for each open document, which tie application responsiveness
    to reading and writing these small files from the hard disk quickly. On a multi-station,
    multi-user system, overall performance benefits greatly from a large disk cache
    and high spindle speed on the hard disks on which /tmp and swap files are hosted.
    If persistent local storage is required, local storage capacity should be provisioned
    according to the needs of each user, with any other desktop computer system.


    # Memory


    Assessing memory requirements for multi-station Linux setups is no different from
    assessing the memory requirements for a single user Linux workstation, with the
    exception that the underlying system memory image is only loaded once. Red Hat
    Enterprise Workstation Version 4 loads a'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'full-featured Linux configuration in under 256 MB of non-swapped memory while
    Ubuntu loads a complete Linux operating system with GUI in 350 MB of non-swapped
    memory. Each additional user requires an additional 20-40 MB of system memory
    to expand the scope of USB device handlers, X (understanding how multi-station
    computing works: Exploiting the flexibility of X Window System (on page 309)),
    and the window manager, because no additional copies of X, the kernel, or any
    other system software need to be loaded. With single station systems, each user
    application has requirements that can be profiled with standard tools such as
    ps, top, and the contents of `/proc/<process>/status`.


    Individual user applications such as OpenOffice Writer and Firefox browsers use
    no more or less memory on a multi-station system than a single user system, which
    is easily profiled with utilities such as ps and top, and such application memory
    requirements are easily provided on a multi-station system. In a typical office
    deployment, each user typically requires between 256-512 MB of non-swapped memory
    for running local applications.


    # Device support


    Common devices such as keyboards, mice, barcode scanners, magnetic stripe readers,
    and most USB storage devices have mature multi-station (or multi-user) aware driver
    support. For other devices, multi-station device support can currently be limited
    by driver module implementations that are not multi-user aware. many Web Cameras
    and USB audio devices function in multi-station configurations, but access to
    these devices is shared by all users.


    While non-user aware devices can be used in multi-station systems, the issue of
    multiple users contending for access to such devices should be reviewed and fully
    tested before deploying such devices. A simple procedure outlining access to a
    shared device such as the workstation''s CD burner is feasible for most devices.


    If controlling access to shareable devices is a requirement of the workplace environment
    to meet policy or regulatory requirements, integrated solutions are available.
    For example, Userful''s Desktop server system (which integrates Desktop Multifunctionality
    with Fedora Core system and specialized access control features) can quickly form
    logical workstations and assign exclusive access to almost any non-privileged
    resource to a particular station, overcoming many limitations of a non-integrated
    solution.


    # Shared access to removable storage


    As mentioned, managing access to shared devices on a multi-station computer can
    present unique technical and management challenges. Because most computer systems
    are not configured with multiple local users in mind, they do'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'not include multiple optical floppy drives. Therefore, a combination of policies
    and technology enhancements might be needed to ensure appropriate access and data
    security.


    Providing shared access to removable storage devices means that the local multi-station
    system can access the contents of any or USB memory connected to the shared system.
    This can pose a security concern if the enterprise data handling policy permits
    confidential information to be stored by employees on removable media and could
    raise user concerns regard to identifying and working with multiple connected
    devices of the same kind. Denying access to removable storage devices at the system
    level solves both of these concerns, but can frustrate employees who occasionally
    access data stored on removable media.


    Prior to deploying multi-station systems, be sure to inform users about best practices
    and policies regarding shared drive access.


    # Selecting IBM IntelliStation model


    The technologies that enable multi-station computing are based on standard PC
    software a variety of hardware configurations are capable of providing stations
    to multiple users. However, there are distinct advantages to selecting and implementing
    multi-station solutions based more scalable workstation class platforms.


    IntelliStation Pro systems with Intel Xeon® and AMD dual-core Opteron processors
    can be configured for up to 16 GB of memory along with fast storage subsystems
    help ensure acceptable levels of performance for all client workstations. Such
    systems are appropriate for supporting a moderate number of client workstations
    to power users, or higher numbers of client workstations for users of lightweight
    applications such as terminal emulators.


    # Software requirements and installation considerations


    The software requirements for multi-headed or multi-station Linux solutions are
    easily met by most Linux distributions. Typically, multi-station Linux requires
    Kernel Version 2.6, X.Org version 6.8.2 or later, or Xfree86 4.3.0 or later and
    a recent Gnome or KDE build.


    Important note about X.org: Some older versions of X.org, are incompatible with
    multiple installed PCI video cards, and they might fail to launch an X environment.
    The current version of X.org (6.8.2-37) does not exhibit this problem.'
  merge: -1
  img_proc: true
