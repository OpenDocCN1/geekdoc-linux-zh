    \nvar view = Factory.createROPart(\"text/html\", box, \"view\");\nview.connect(view.child(0),\n\
    \  'openURLRequest(const KURL&,const KParts::URLArgs&)',\n  'openURL(const KURL&)')\n\
    view.openURL(const KURL&);\n\nmw.resize(650,500)\nmw.show();\n\napplication.exec();\n\
    ```\n\n# Kommander\n\nThe developers of the Quanta+ Web development framework\
    \ introduced a new toolkit called Kommander, which you can use to design KDE Dialogs\
    \ and widgets by using **kmdr-editor** (a program derived from Qt Designer) and\
    \ executing them with **kmdr-executor**. Kommander uses XML-GUI description files\
    \ with embedded DCOP scripts, which can be written in any language to speak the\
    \ DCOP protocol (such as Bash, Python, Perl, Java, or JavaScript). Kommander allows\
    \ you to write KDE dialogs by using the powerful DCOP mechanisms itself. It is\
    \ already used at many places inside Quanta+ (DCOP is also used for the inter-component\
    \ communication in the KDE PIM framework Kontakt). Take a look at Figure F-1 to\
    \ see how the integrated DCOP development with **kmdr-editor** looks and can be\
    \ used for your own purposes. For more information:\n\nhttp://kommander.kdewebdev.org\n\
    http://quanta.kdewebdev.org"
