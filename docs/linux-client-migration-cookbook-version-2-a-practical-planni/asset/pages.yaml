    # 1.6 Linux overview and distribution choices


    In 1984, the Free Software Foundation (FSF), started by Richard Stallman, began
    the GNU project to create a free version of the UNIX operating system. This system
    can be freely used, but even beyond that, the source code can be freely read,
    modified, and redistributed. A number of components were created, including compilers
    and test editors. However, it lacked a kernel. In 1991, Linus Torvalds began developing
    an operating system in a collaborative way. All information made available for
    anyone on the Internet to improve the operating system that was called Linux.
    Linux was exactly the operating system kernel the FSF needed.


    In the community, different organizations have created different combinations
    of components built around the kernel and made them available as a bundle. These
    bundles are called distributions. Some of the most well-known distributions include
    Fedora and Red Hat Enterprise, openSUSE Linux, Debian, and a derivative of Debian,
    Ubuntu Linux.


    Linux is a UNIX-like, POSIX-compliant operating system distributed under the GNU
    software license. This means that the operating system can be distributed for
    free. Linux supports all the major window managers and all the Internet utilities,
    such as File Transfer Protocol (FTP), telnet, and Serial Line Internet Protocol
    (SLIP). It provides 32-bit and 64-bit multitasking, virtual memory, shared libraries,
    and TCP/IP networking. It is coupled to a POSIX thread library for high-performance
    multithreading, symmetric multiprocessing (SMP) up to 16 logical CPUs or eight
    hyperthreaded CPU pairs, and massive parallel processing (MPP) up to 1000 AMD
    Opteron processors in a new Cray computer under development.


    Linux has been developed to run on the x86, Itanium®, AMD64, and IBM System z™,
    System™, and System™ servers and S/390® architectures. A common source code base
    is used for all of them.


