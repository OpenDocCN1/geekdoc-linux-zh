- pgno: 193
  md: '# 7.5.3 Approaches to desktop consolidation and deployment


    Desktop virtualization is one of several approaches to desktop consolidation and
    deployment. Multi-station platforms use virtualization software to manage each
    user''s desktop similar to the way a terminal server or virtual machine operates,
    however multi-station systems provide each user with a direct connection to their
    virtual desktop, eliminating the client altogether and consolidating many computer
    systems into one single shared workstation. In this section, we compare and contrast
    popular desktop deployment scenarios with a multi-station computing approach.


    # Comparison with thin client systems


    Thin client technology relies on small footprint client workstations that facilitate
    user interaction between a server and a remote user via a standard data network.
    PCs contain both the hardware and software to function independently of any other
    device, while thin clients require connections to servers to provide a of remotely
    hosted terminal services: login, session management, hosted applications, and
    so forth.


    Multi-station computing solutions share the advantages of thin client systems
    such as centralized management and minimal hardware at the physical desktop. However,
    multi-station client architectures differ from thin client architectures in some
    key aspects: they can be less dependent on network connection availability, or
    network bandwidth limitations, and do not require one-to-one deployment of complete
    client systems for each user.


    > Tip: As soon as you move above hardware level considerations, multi-station
    and thin client architectures can become complimentary instead of competing design
    strategies. This is illustrated in the following section.


    # Comparison with remote desktop systems (RDP, VNC, and XDMCP)


    The Remote Desktop Protocol (RDP), X Display Manager Control Protocol (XDMCP),
    and Virtual Network Computing (VNC) protocol are industry-standard methods of
    connecting to desktops on remote computer systems through a local area network
    or Internet.


    A user of a PC or thin client system runs an RDP, VNC, or XDMCP client locally,
    which captures user input from the local keyboard and mouse, sending it to the
    remote server through a network connection. All of the processing for applications
    displayed on the remote desktop is performed on the server, which means that the
    server hardware and configuration sets the hard limit on the number of simultaneous
    users who can connect to the host server.'
  merge: -1
  img_proc: true
