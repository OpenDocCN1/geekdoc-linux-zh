  md: '+   - Configuration of the client firewall to protect against worms


    To scan for viruses on the mail server, several solutions are available, both
    OSS and commercial.


    Virus scanning on the client should include all parts of the local file systems.
    Several solutions, both OSS and commercial, are available. The virus definition
    files of the tool chosen should be regularly updated automatically. The user should
    not be allowed to stop the scanning operation.


    The Linux client firewall should be configured to defend the client against infection
    by worms. The firewall configuration should not be changeable by the user and
    should be regularly, centrally updated.


    > **Planning tip:** Plan to start virus mitigation procedures on Linux clients
    early in the migration process. Linux viruses will appear eventually.


    # # 4.5.7 Examples of administration of enterprise distributions


    In this section, we highlight how Red Hat Enterprise Desktop and SUSE Enterprise
    Desktop can be managed using vendor integrated system management frameworks.


    # ## Administration of Red Hat Desktop


    The Red Hat Desktop distribution is based on Red Hat Enterprise Linux. Like other
    products in this range, the mechanism for administration and update is Red Hat
    Network (RHN).


    Red Hat offers three architectures for connecting to RHN: Hosted, Proxy, and Satellite.
    Usually a client will connect directly to the RHN servers at Red Hat. This is
    called the *Hosted architecture*. Included in the Red Hat Desktop offering are
    the Proxy and Satellite architectures, where you can install a RHN proxy or RHN
    satellite server locally. The RHN proxy caches traffic and content between the
    RHN servers at Red Hat and the local client. Using a satellite, it is possible
    to replicate a RHN server.


    The proxy and satellite servers are useful when the number of clients increases
    and the amount of traffic to Red Hat becomes large. Also, these solutions will
    increase security because there is a limited connectivity to the Internet. An
    added advantage of the satellite server is that the RHN solution can be taken
    offline (disconnected from the Internet) if you choose.'
