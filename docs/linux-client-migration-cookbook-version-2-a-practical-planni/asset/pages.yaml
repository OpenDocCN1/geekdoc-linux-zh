- pgno: 181
  md: '# 7.2 Remoting tools


    Due to the modular nature of Linux, there are numerous options when implementing
    a thin or slim client desktop solution. The options include basic remote access,
    where one workstation remotely displays the desktop of another workstation, network
    bootingless hardware, remote execution of a single application with a local display,
    or multiple users connecting to a single workstation.


    # 7.2.1 Remote access


    Remote access is where the entire application logic resides on a server and the
    client only runs presentation logic. Implementations include Virtual Network Computing
    (VNC), NoMachine NX, or even desktop, a Linux client for Microsoft Remote Display
    Protocol (RDP) servers. However, because this kind of remoting usually requires
    a significant amount of network resources, remoting of the entire operating system
    is usually not used as a user''s standard environment. Instead, they are used
    for situations such as remote diagnosis and help desk scenarios, or accessing
    a desktop workstation out of the office.


    Figure 7-6 Sabayon editing a profile


    ![](img/23b949da14ff7bab8762f0f0361af394_181_0.png)


    154 Linux Client Migration Cookbook, Version 2'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 7.2.2 Thin client


    Thin client solutions involve many clients (either standard workstations or diskless
    terminals) booting over the network off of a central server. Because applications
    are all run on the server, upgrades and patches only need to be applied to one
    location. Also, most user data is stored on the server, so users can use any client
    connected to the server and receive the same experience. Depending on the solution
    in use, thin clients can require a substantial amount of network bandwidth between
    the clients and the server. Modern thin client solutions include the Linux Terminal
    Server Project at:


    ```

    http://www.ltsp.org

    ```


    And various thin client solutions from Neoware:


    ```

    http://www.neoware.com

    ```


    # 7.2.3 Application forwarding


    The X client/server environment (as described in 5.2.4, "Graphical and text-based
    environments") on page 118 allows a more granular approach to remotely. Because
    X clients send their displays through networking sockets to connect to a local
    X server, forwarding the display to a remote X server is trivial and requires
    no changes to the client. There are numerous scenarios where application forwarding
    could reduce technical support issues, such as configuring a desktop to run-mail
    and Web browsing applications locally, but to connect to a network server to run
    an in-house application which receives frequent updates. X forwarding can be tunneled
    over a Secure Shell (SSH) to connect the session, allowing for secure application
    forwarding over the Internet or an unsecured portion of your intranet. It is also
    possible to use NoMachine or FreeNX, which compresses the session significantly,
    making applications far more responsive over slower connections, and usable over
    dial-up connections.


    Similar application renting can be done with Windows applications running through
    products such as San Secure Global Desktop Software (formerly Tarantella) or Microsoft
    Terminal Server. These services can be useful for unmigratable applications; the
    unmigratable application can run on the server, while all other applications run
    locally.


    # 7.2.4 Multi-station computing


    Thin client solutions are often limited in performance their deployment require
    extensive infrastructure. Performance and response time are highly sensitive to
    network traffic between the client and the server, potentially frustrating some
    users. Multi-station computing based on standard desktop computing'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'hardware overcomes many of these challenges. Due to widespread availability
    of multi-headed video cards and USB input devices, many personal computers can
    be configured for two users simply with the addition of a new set of input and
    output devices as keyboards, mice, and monitors. With the addition of one or more
    video cards, several users can be simultaneously supported without taxing a desktop
    computer''s multi-gigahertz CPU and gigabytes of memory and hard disk storage.


    Deploying multi-station systems instead of an individual computer for each user
    can reduce infrastructure build-outs of both initial hardware and software purchases,
    as well as through savings in electricity and data network infrastructure. In
    addition, the total cost of ownership of each workstation is dramatically reduced
    during the life of the system by reduced hardware and software support and maintenance.
    With multi-station systems, IT departments can refresh software images on fewer
    computers while also reducing software subscription and support costs. And at
    the end of the computer life cycle, disposal costs are reduced.


    Consider deploying multi-station client architectures whenever workstations require
    clustering in close proximity, and their primary application usage patterns not
    involve CPU or memory intensive requirements. We discuss multi-station computing
    strategies in more detail later in this chapter (7.5), "Multi-station client architecture"
    on page 162.


    # 7.3 Rich client


    Rich technology is based on a browser/server relationship that attempts to bring
    all the advantages of a browser-based thin client solution while inheriting none
    of the disadvantages compared to a location-based thick client solution. In a
    rich client environment, applications are hosted on a central server, which clients
    download on demand and run completely on the local machine. As such, application
    upgrades or patches only need to be applied to the client server, and are then
    propagated to the client on the next run, greatly reducing the costs of running
    out an upgrade or application patch. And, because the application logic runs on
    the client, rich client solutions take full advantage of the power available on
    a standard desktop. By running the application locally, a full-featured application
    environment can be used, unlike browser-based solutions which severely can cache
    the latest version of an application, resulting in minimal network traffic during
    online use, and allowing for offline use that a thin client or browser-based solution
    cannot provide. The sweet spot for rich-clients is illustrated in the upper right
    quadrant of Figure 7-7 on page 157.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 7.3.1 Eclipse and the Eclipse Rich Client Platform


    Eclipse is an open source IDE and integration platform. To develop an understanding
    why the Eclipse platform was created, you should consider what is currently happening
    at the intersection of two IT trends:


    +   - The explosion in Internet use. This led to a need for Web application services


    +   The open source movement. The exploding popularity and increasing credibility
    of open source software development methods naturally encourage development of
    a supporting set of open standards.


    What follows then is the need to create a free, open, standards-based, and extensible
    application development framework. Meeting the need for standards-based open and
    extensible application development platform has from the beginning been one of
    the primary goals of the Eclipse project. And with the release of Eclipse 3.0,
    the Eclipse platform became more than just a Java-based IDE and tool integration
    platform. It also became a very capable host for client applications. Thus, the
    Eclipse Rich Client Platform was born.


    ![](img/23b949da14ff7bab8762f0f0361af394_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '"While the Eclipse platform is designed to serve as an open tools platform,
    it is architected so that its components could be used to build just about any
    client application. The minimal set of plug-ins needed to build a rich client
    application is collectively known as the Rich Client Platform.\²


    # 7.3.2 IBM Workplace Client Technology


    The IBM Workplace Client Technology™ provides a flexible and extensible framework
    for applications. It is built on a standards-based platform and utilizes the Eclipse
    technology as a base component. Among its approaches to help enable low cost of
    ownership (TCO), a key element of IBM Workplace Client Technology is its ability
    to provide a no-touch deployment model coupled with policy-based management. Additionally,
    as an enterprise solution, IBM Workplace Client Technology provides built-in security
    features and a managed, synchronized relational data store that supports both
    connected and disconnected operations. As one example, this secure data can provide
    document management capabilities, and when combined with plug-in document editor
    support (another capability of this technology), it enters a new level of document
    management combined with low TCO and ubiquity.


    IBM Workplace Client moves beyond the browser, enabling not only browser capabilities,
    but also the ability to securely and decrementally download, update, and intelligently
    cache the engine of "rich" and hybrid client applications. These applications
    run locally on the user''s machine using an encrypted, synchronized content store
    with security features and offline capabilities. Such harness the full power of
