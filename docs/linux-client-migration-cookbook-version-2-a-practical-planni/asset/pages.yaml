- pgno: 282
  md: '# Using enterprise management tools


    This appendix describes the system management tools available from two major Linux
    enterprise distribution vendors, and some from other sources as well. For each
    of these tools, this appendix describes their basic functionality, in what environments
    the tool might be useful, and pointers to more information. These tools provide
    extremely useful functions for facilitating a large migration.


    This appendix discusses the following topics:


    +   * “Why use enterprise management tools” on page 256

    * “Red Hat satellite server and Red Hat Network (RHN)” on page 257

    * “Novell ZENworks Linux Management” on page 264

    * “Webmin” on page 269

    * “Other important tools” on page 272'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Why use enterprise management tools


    Just like you need to automate certain tasks when using other operating systems,
    it is also advantageous to do this when using Linux. Red Hat and Novell SUSE both
    provide options for automating client management tasks. These tools and a few
    others are introduced and discussed in this appendix.


    You might might not have used these tools, but you might want to consider their
    use when you migrate to Linux. These system management services enable a client
    or set of clients to be configured and remotely monitored using optionally available
    management frameworks or applications. In the case of client deployments based
    on Red Hat Linux and the RHN management framework, or SUSE Linux Enterprise Desktop
    and the Novell ZENWORKS framework, the management tools provide a set of key value-added
    options that can easily justify the subscription-based licensing fees.


    The availability of enterprise management tools and how you plan on using can
    strongly affect the cost justification models in a migration scenario. This is
    discussed in 2.1.2,"Costs relate to Linux" on page 32.


    # Internet standard technologies


    There are published Internet standards that support community development of system
    management tooling. There are currently many active open source management tooling
    development projects that are based those standards. In the case of Web-Based
    Enterprise Management (WBEM), the goal is to provide a platform for unifying the
    management of distributed computing environments.


    # Web-Based Enterprise Management (WBEM)


    Web-Based Enterprise Management (WBEM) and the Common Information Model (CIM)
    are the object-based architecture standards and the data model promoted by the
    industry consortia Distributed Management Task Force (DMTF). The WBEM services
    described here are implementations of these standards. More information about
    these standards, refer to the DMTF Web site:


    http://www.dmtf.org


    WBEM services are made available for use by a system application through a CIM
    object manager or CIM server. Providers are written that gather and manage system
    resources. These providers register their classes with the CIM server to enable
    these objects to be used by a management application or even other providers.
    There are increasing number'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'of applications adopting this management standard. For more information about
    the components in the WBEM architecture, refer to the DMTF Web site:

    http://www.dmtf.org/standards/wbem


    # Simple Network Management Protocol (SNMP)


    Another commonly used remote system service is the Simple Network Management Protocol
    (SNMP). SNMP is an Internet Engineering Task Force (IETF) standard and is perhaps
    the most widely implemented for system management. The data model used by an SNMP
    service is called a Management Information Base (MIB). Different sections of a
    MIB are supported by different devices and servers depending on the services available
    on the system. For more information about the SNMP service, refer to the IETF
    Web site:

    http://www.ietf.org


    SNMP services are implemented through a background server or daemon. This daemon
    listens for requests and if the object is supported in the set of MIB extensions
    maintained by the server, the action is performed and the response returned. The
    SNMP service also has the ability to send and receive system events called traps.
    And, with the deployment and wide spread adoption of secure SNMPV3, it is now
    safer to use.


    # Red Hat Satellite server and Red Hat Network (RHN)


    The Red Hat Network (RHN) is a systems management framework for your Linux infrastructure.
    Through a Web-based interface, it is possible to automate system updates, management,
    provisioning, and monitoring. It provides a set of services through what is known
    as modules. See the following list for additional information over RHN:

    http://www.redhat.com/rhn


    Each of the major functions in RHN are defined in more detail here:

    https://rhn.redhat.com/rhn/help/reference/index.jsp


    # Architectural and functional overview


    There are three basic architectures for using RHN. These are the Hosted server
    model, the Proxy server model, and the Satellite server model. The architecture
    of the Red Hat Network is one where there is a central server from which all systems
    are managed. With the Hosted model, the RHN server is located at and hosted by
    Red Hat, with access to the Internet.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'For supporting small numbers of systems and in scenarios with limited security
    considerations, the hosted model can provide an appropriate level of service and
    flexibility. When the number of systems in an enterprise grows or when security
    constraints prevent all systems from reaching the Internet, you should consider
    the proxy or satellite models. Of the three models, satellite provides the most
    flexibility and features.


    # Red Hat Network architectures:


    +   - Hosted model - All systems connect to the RHN server at Red Hot through
    the organization''s Internet firewall. All management information and services
    are exchanged directly with the RHN servers over the Internet.

    - Proxy model - The managed systems connect to the locally administ proxy server.
    The Proxy server aggregates data, caches content, and performs several tasks locally.
    It communicates with the RHN server on the Internet and can be connected to a
    Satellite model to help scale content distribution. In this model, all management
    information for the RHN is stored on the RHN servers (or the locally hosted Satellite
    servers).

    - Satellite model - Systems connect to the satellite server running locally. The
    satellite server functions as a locally connected RHN update server. It can receive
    updates for distribution to your network using Internet connection to RHN servers.
    It can also be loaded with updates manually, using physical media, eliminating
    the need for an external Internet connection for the satellite server (disconnected
    mode).


    All of the models provide a core set of modules that can be grouped within the
    following functional areas:


    +   - Update

    - Management

    - Provisioning

    - Monitoring


    Additional modules that add more functionality for Provisioning and Monitoring
    are available in the Proxy and Satellite models. For more details, see the Red
    Hat Network module and architecture comparison tables here:


    ```

    http://www.redhat.com/rhn/compare/

    ```


    In Figure B-1 on page 259, we show an example topology that demonstrates a tiered
    approach combining proxy and satellite servers. This approach might be best suited
    for larger, distributed enterprises.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/23b949da14ff7bab8762f0f0361af394_286_0.png)


    # # Satellite server


    The technical architecture of the satellite server consists of a server application
    on top of a database to contain all of the data about systems, groups, entitlements,
    channels, packages, and errata. This application has a management Web interface.
    The communication with the clients is performed through the update2 application
    and several daemons running on the client.


    > Note: In Red Hat Enterprise Linux Version 5, update2 will be replaced by yum.


    # # RHN Terminology


    In this section, we describe terminology used in discussing the RHN/satellite
    server. These concepts include:


    +   - System

    - System group

    - System set

    - System Entitlement

    - Channel

    - Channel Entitlement

    - Errata

    - Action

    - Activation key


    ¹ Copyright 2004 Red Hat, Inc. All rights reserved. Reprinted by permission.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'We describe each of these concepts in some detail the satellite server context.
    Some of these same terms exist as a concept in ZENWorks as well, but might have
    a slightly different meaning.


    # System


    A system can be any Red Hat Linux installed machine with update configured for
    connection to a server. A system is connected to a satellite server using a registration
    process that associates the system with a user ID on the satellite server.


    # System group


    A group is an entity in the satellite server that can contain systems. When created,
    the container is empty. Systems can be added to the system group. The system group
    is used in the satellite server to perform actions for multiple systems (the ones
    in the group) simultaneously. You can also have individual systems that belong
    to multiple system groups, for instance may overlap by function and geography
    in your enterprise.


    # System set


    Where the system group is or less fixed, the system set can be used to select
    systems to perform an action on. individually, or on a group level, or based on
    some property of the system. You can construct a system set "on the fly" in order
    to group systems together for applying a particular action.


    # Entitlements


    Entitlements allow subscription access to the service level offerings in RHN.
    The quantity and types of available subscriptions are set by RHN licenses purchased.
    You can have system level or software channel level


    # Modules


    The concept of modules allows for the choice of levels of service entitlement
    that the satellite server can perform. In the current Red Hat Network and satellite
    server, there are four modules:


    +   * Update - The entry-level module, complimentary with Red Hat Network, most
    appropriate for single or a few systems.


    +   * Management - Includes Update module features plus additional features that
    enable more efficient system grouping, management, and channel definition to support
    larger numbers of systems.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   Provisioning - Includes Management module features plus additional features
    that provide for full Linux infrastructure lifecycle management.


    +   Monitoring - Requires the management module and a satellite server. Enables
    tracking and monitoring of all the Linux systems performance.


    > Note: For the most current information about RHN modules, refer to the Red Hat
    Web site:

    http://www.redhat.com/rhn


    With each higher level entitlement, more functions of the satellite server/RHN
    become available. You can change the module entitlement levels assigned to a particular
    system or group of systems whenever necessary.


    # Channel


    A channel is a collection of updates. There are two types of channels: Base channels
    and child channels.


    A base channel consists of a list of packages based on a specific architecture
    and Red Hat Enterprise Linux release. For example, all of the packages Red Hat
    Enterprise Linux 4 for the x86 architecture are a base channel.


    A child channel is associated with a base channel, but it contains extra packages.
    This way, it is possible for an organization to use a base channel to create a
    child channel that contains the base packages and extra packages specifically
    needed by the organization.


    # Action


    Actions can be performed on clients from the satellite server. Since the rhnd
    daemon is running as root, even a reboot can be scheduled from the satellite server.
    Some actions that can be scheduled are:


    +   Boot


    +   Package update


    +   Hardware properties update


    # Errata


    Errata is the name for the collection of all updates and patches. Red Hat distinguishes
    between three types of errata:


    +   Security updates


    +   Bugfix updates


    +   Enhancement updates'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'These three types of errata each have their own priority for an application.
    Security updates should be applied immediately, Bugfix updates if necessary, and
    Enhancement updates when needed.


    # Activation key


    An activation key is used to register the system, entitle the system to a service
    level, and subscribe the system to specific channels and system groups through
    the command line utility rhnreg_ks. These keys can only be created for Management
    and Provisioning entitlements. The keys are generated in the satellite server.
    For a single system, you can combine multiple activation keys (key stacking).
    Key stacking allows for a lower total number of keys required for multiple systems
    with differing subscription level requirements.


    # Sample update scenario


    Consider a large multinational, running Red Hat Desktop across the enterprise
    as their primary user client platforms. Their IT department developers run the
    latest versions on test bed client applications are ported to the latest releases
    and pass Quality Assurance (QA) testing, they can then provide updates to their
    production client groups using RHN channels.


    A simplified Red Hat Network topology focusing on the desktop channels is shown
    in Figure B-2 on page 263. A satellite server provides three base channels. The
    Red Hat Desktop channel serves as a base for set of child channels that are used
    for management development and testing (numbered 1-2-3 in the figure). The RHD
    base channel provides RHD Update 3 (the base channel would be labeled "RHD_U3”).
    So each of the child channels could be labeled as follows:


    +   1. RHD_U3dev

    2. RHD_U3test

    3. RHD_U3prod


    The IT department wants to deploy RHD Update 4 to their production desktop channel
    in the same way that they managed the Update 3 deployment. To do this, they follow
    the same pattern used to roll out Update 3 to the enterprise. They first create
    a "RHD_U4dev" base channel on the satellite server. They can do this by cloning
    the Red Hat Desktop channel as provided by Red Hat, or if they create a new blank
    channel and push the appropriate packages to the channel from the installation
    media. This new RHD_U4dev channel is then used by their developers for testing
    and updating any applications.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Once the developers have completed their work on RHD_U4dev, the same channel
    is cloned as RHD_U4test, and the IT quality assurance team takes over. They test
    the packages and file bugs, and they might also request that the development team
    apply fixes to any packages included in the channel.


    When the QA team is able to sign off on production readiness for the RHD_U4test
    channel, it can be cloned to a new channel, RHD_U4prod. This new production channel
    is then used to manage deployment of the U4 update to the enterprise.


    ![](img/23b949da14ff7bab8762f0f0361af394_290_0.png)


    Figure B-2 Red Hat Network update topology'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Novell ZENworks Linux Management


    This section describes Novell ZENworks, now called ZENworks Suite. ZENworks Suite
    is Novell''s application platform for deploying, managing, and maintaining systems
    in the enterprise. It can be especially useful for enterprise customers running
    a large number of Linux client installations within their organization.


    ZENworks is the preferred tool for Novell/SUSE distribution, but can manage any
    client desktop, either Linux-based or Windows-based. The ZENworks Linux Management
    tools are the focus in this section.


    # Architecture and Functionality


