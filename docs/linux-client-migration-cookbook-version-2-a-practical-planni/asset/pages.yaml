- pgno: 146
  md: 'built with GUI first, with command line automation a lower priority. Proponents
    say that these graphical tools make Windows easier to use, though detractors claim
    that the lack of command line options makes it hard to automate tasks on Windows.


    As we have stated, Linux is an extremely modular operating system. Even though
    distributions of Linux configure a graphical environment by default, it is always
    possible to boot Linux into a command line interface. In fact, this is a common
    practice for "headless" servers, that is to say servers which have no display
    attached and will only be accessed remotely. As such, not loading a graphical
    environment can save resources such as memory and disk space. Many system level
    tools for Linux (such as networking configuration or application packaging tools)
    are built with a command line interface first. Later, graphical tools are built
    to wrap the command line interface. This results in a multitude of different graphical
    "front end" applications that implement the same features provided by the console
    (command line equivalent) applications in a GUI-based equivalent.


    The application structure for graphical environments in Linux is extremely modular.
    There are several layers of abstraction provided by different applications, with
    many choices available in each layer. Table 5-2 demonstrates many of the choices
    available at each layer of the user interface.


    | Table 5-2 Layers on top of the X Windows system |

    | Layer | Choices |

    | Display manager | XDM, GDM, KDM, and Entrance |

    | X Window Server | XFree86 or X.org |

    | Window managers | FVWM, IceWM, WindowMaker, Metacity, KWin, and Enlightenment
    |

    | GUI toolkits | OpenMot, GTK+, Qt, wxWidgets, FLTK, FOX, Swing, SWT, and EFL
    |

    | Desktop environments | KDE, GNOME, GnuStep, XFCE, ROX, Looking Glass, and Metisse
    |


    This level of modularity (the ability to independently start, and modify the behavior
    of the X Window system on a Linux-based computer) is what allows for the success
    of many-to-one computing solutions such as User''s multi-station Desktop Multiplier.
    See 7.5,"Multi-station client architecture" on page 162 and Appendix D, "Multi-station
    computing deep dive using Useful Desktop Multiplier" on page 289 for more details.'
