    +   - With the rapid and continuous decline in computer memory prices and the
    common availability of 1 GB memory modules, planners should consider deploying
    workstations with as much memory as possible. Typical PC motherboards support
    up to 4 GB of memory per processor, offering enough capacity for each user to
    have a 512 MB share. Providing additional memory during the initial deployment
    ensures that multi-station systems have adequate memory to support more users,
    and more intensive usage patterns.


    Some of these considerations are illustrated in the case studies included in Appendix
    D, "Multi-station computing deep dive using Useful Desktop Multiplier" on page
    28.


    # Multi-station desktops as a replacement for existing PCs


    Deploying multi-station Linux desktops as replacements for existing workstations
    could be a cost-effective way to maximize the use of current infrastructure. Replacing
    several older computers with a more powerful multi-station system reduces complexity
    and power demands. This makes it possible to add more workstations without substantial
    additions to the existing technology infrastructure. And with conventional desktop
    replacement programs, in almost all cases, existing workstation monitors and input
    devices can be reused on multiple generations of new multi-station systems.


    # Provisioned multi-station desktop implementations


    In addition to general purpose provisioned office desktops (as described above),
    multi-station Linux has many applications in fixed function, transactional, provisioned
    desktop implementations.'
