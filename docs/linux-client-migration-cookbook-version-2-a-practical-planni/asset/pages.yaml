- pgno: 94
  md: 'migrated to a Linux-compatible solution before the Linux client migration can
    begin.


    # 4.1.4 Assessing application equivalency


    We expect most, but not all applications, to have functional equivalents available
    that run natively on the Linux client. And there are special (ideal) cases where
    the functional equivalents are also what we call "bridging applications" (discussed
    in 3.2.1. "Bridging applications" on page 53). In general, once you have assembled
    a list of all the supported (and required) applications that require functional
    equivalents on the target Linux platform, then you will need to select applications
    that provide the same functions on Linux. There are many online sources to help
    guide you in this process. Here are three:


    +   The table of equivalents/replacements/analogs of Windows software in Linux:


    http://www.linuxrsp.org/win-linux-soft/table-eng.html


    +   Linuxquestions.org: "Software equivalents to Windows Software":


    http://wiki.linuxquestions.org/wiki/Linux_software_equivalent_to_Windows_software_ftware


    +   www.novell.com: "Novell Linux Desktop Equivalents of Windows Software":


    http://www.novell.com/coolsolutions/feature/11684.html


    # 4.1.5 Assessing the infrastructure


    Survey considerations in this area include:


    +   What is the network infrastructure that clients connect to?


    +   What is the topology of the network infrastructure? This includes an architectural
    overview of all local and remote connections including bandwidth and protocol
    conversion.


    +   What type of network protocols are installed and configured on the client
    in order to access any type of infrastructure components?


    +   What do the clients connect to and which services do they use? The list of
    servers should include physical and logical instances. Services include file,
    print, DHCP, Web content, dynamic content, applications, and others.


    +   What databases are accessed and how is this access implemented? From this,
    all connections to databases can be well described as the type of implementation,
    such as a native client (such as IBM DB2® UDB client), an API connection (perhaps
    over named pipes), message queuing (such as IBM WebSphere® MQ), or direct application
    access (such as an SAP client).'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   What mainframes are accessed, how do the workstations connect to them?

    Accessing mainframes of different kinds can be done through native clients (such
    as IBM Personal Communications), Web interfaces (such as IBM WebSphere Host on
    Demand and IBM WebSphere Host Publisher), or API connections (such as through
    High Level Language Application Program Interface (HLLAPI)).


    # 4.1.6 Assessing the user


    Another key element of a migration is the user. In some cases, especially when
    talking about success and acceptance of a migration, this is the most important
    aspect at all. If users are committed to the change, looking forward to working
    in the new environment, or actively involved in development or deployment of the
    solution, then user expectation management issues can be minimized.


    Questions to ask in this area:


    +   * What are the most often performed tasks for a user or group of users?

    * Are there definitions of user roles? If so, how are they defined?

    * Are there any defined exemptions from these user roles or rules?

    * Are user-specific settings that need to be migrated, such as browser bookmarks
    or wallpaper?

    * Do any of the existing applications use user-customizable plug-ins for operation?

    * Are users involved in the software selection process, and how?

    * Do users have the option to pull software from an installation repository?

    * Is there a process to request, install, or delete software?

    * How often do users call the help desk and what are the average of key measurements
    such as response time, recurring calls, and level of support involved?

    * What is the skill level of users for the base operating system?

    * What is the skill level of users for productivity applications (that is, word
    processing)?n* What is the skill level of users for business applications?

    * What type of devices (local and remote) do users require access to?'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 4.2 Integrating with existing network services


    In this section, we describe how to plan for integrating Linux clients in an existing
    network. We specifically look at how to incorporate Linux clients in a predominantly
    Microsoft Windows-based network.


    # 4.2.1 Setting the environment


    Usually a Linux client will not be the first Linux machine added in an environment.
    Instead, back-end servers are typically the first machines that are migrated to
    Linux. This means that most descriptions of how to incorporate Linux clients in
    an existing network will describe the servers as being Samba servers running on
    Linux. Since this book is focused on client migration only, we decided to consider
    the scenario where Linux client migration is occurring in an environment where
    back-end servers have not yet merged.


    A Linux client migration project could occur within any of the following environments:


    +   * NT4 domain with Microsoft Windows NT 4 PDC (and possibly BDCs)

    * Active Directory (AD) domain with Microsoft Windows 2000 or 2003 servers

    * NT4 domain with Linux running Samba PDC and BDCs

    * Other non-Microsoft Windows domain-based environment


    The majority of environments will be the second option, because the first is becoming
    less common now that NT4 is end-of-life. The third option is becoming more widespread,
    and most descriptions of client migration already assume the server-end to be
    migrated to a Samba domain.


    In this book, we concentrate on the first two types of environments (that is,
    a pure Windows environment) for two reasons:


    +   * Most domains still fit this model.

    * There are already a lot of descriptions about how to put Linux clients in a
    Samba domain.


    **Planning tip:** If a server-side upgrade of the domain to either AD or Samba
    is already planned, take this into account in the client migration planning. Try
    to avoid integrating twice.


    Within the Linux community, the most widely used tool for integrating UNIX clients
    with Windows is Samba. Samba originates from being a successful application that
    provides network services based on the Server Message Block (SMB) protocol. This
    is the same protocol used by Microsoft Windows to provide client/server networking
    services for file and printer sharing. Thus, Linux systems'
  merge: -1
  img_proc: true
- pgno: 97
  md: +   - When using the winbind separator, this can impact most applications being
    used on the client.
  merge: -1
  img_proc: true
- pgno: 98
  md: '# The windbind separator


    Using windbind will lead to a choice for what is used as the windbind-separator.
    This is the character that will separate the domain name from the username in
    the Linux username. For example, AD6380+Administrator is the Linux username of
    the user Administrator in domain AD6380 when the windbind-separator is a plus
    (+). The impact of the chosen character has to be studied in all applications
    and network services used. Using the plus (+) character for separation generally
    is the best choice for Linux shells and applications.


    **Planning tip:** Plan and test windbind and the windbind separator extensively
    to validate the setting prior to migrating clients.


    # LDAP connect to changed Active Directory


    Advantages:


    +   - Mapping users to uid and gid is done within the AD, that is, centrally.

    - LDAP is a general protocol to connect to AD.


    Disadvantages:


    +   - The AD schema needs to be changed.


    Using LDAP means that it might be necessary to change the Active Directory schema
    to include UNIX-like information such as a uid and gid for users and groups. Microsoft''s
    Service for UNIX can be used to do this.


    > **Planning tip:** When planning to use LDAP with Active Directory to authenticate,
    check whether it is possible to extend the Active Directory schema in your organization.


    # LDAP connect to directory synchronized with Active Directory


    Advantages:


    +   - Mapping users to uid and gid is done within a central directory.

    - LDAP is a general protocol to connect to directories.


    Disadvantages:


    +   - The two different directories have to be synchronized.


    Synchronizing two directories, each containing different objects with partially
    different definitions, is not a trivial exercise. This is one of the reasons that
    this method is not discussed in Chapter 9, "Integration how-tos" on page 195.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Choosing to create users locally on the client means extra overhead. In this
    case when a user is added to the domain, the user ID has to be added to any of
    the Linux clients that the user will be to connect with that domain. Even though
    this process could be automated, it is really necessary when using winbind.


    In the case of authenticating natively with an Active Directory domain, Kerberos
    has to be configured as well as Samba.


    In summary, the applications that are going to enable us to authenticate with
    a Windows domain are Samba, Kerberos, winbind, and LDAP.


    # 4.2.3 File sharing using domain shares


    Let us assume that some Linux clients are joining a domain and the majority of
    clients will still be Windows clients. In this scenario, the best way to share
    files is through Windows shares.


    Mount shares on a Linux client using the correct mount command (smbmount mount
    -t cifs) gives the user access to file systems on the Linux client, in a way that
    is much like any other file system they are using to. However, if the share is
    not open for everybody, a username and password combination is needed, just like
    under Windows. When mounting a share manually, the login information can be input
    without problem. However, this might lead to several other problems:


    +   Manually mounting shares using the mount command might not be an acceptable
    practice for all users. Users are not used to having to mount shares manually,
    because under Windows this is done automatically when logging on.


    +   A way must be enable automatic mounting on login just like on Windows. In
    Linux, automatic mounting of SMB shares can be accomplished using entries in the
    /etc/fstab file.


    A simple solution would be to mount shares in a login profile. However, this needs
    a password, and the user is used to shares being using the password supplied upon
    logon.


    A Pluggable Authentication Module (PAM) exists to enable automatic mounting at
    logon, Since this module is not completely mature yet, care has to be include
    this in the plugin. Currently, it is the preferred way to incorporate some sort
    of single sign-on-like functionality, such as Windows, so that all the shares
    are mounted automatically on login to the Linux client.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'When planning for this, extra time should be included to test the pam-mount
    module on the Linux client chosen for the project. When it works, it is a very
    powerful method of mounting shares automatically.


    **Planning tip:** Test and plan use of pam-mount extensively.


    # Home directories and shares


    During planning, it might be very tempting to push user home directories on Linux
    clients to Windows shares. This will enable a “inner” client.


    Putting the user''s home directory on a share would indeed enable logging on to
    any client and have the same home directory integrated. Using a graphical logon,
    this would mean getting the same desktop and environment on any client used.


    However, care has to be taken. Some session managers (most notably KDE) need to
    create symbolic links or sockets in the user''s home directory as part of normal
    operation. One of the shortcomings of the SMB file system is that symbolic links
    or sockets cannot be created in such a file system. This means that any KDE-based
    application would have problems when running on the desktop machine in a scenario
    where home directories are remotely mounted on shares.


    **Planning tip:** A strategy using remote file shares for mounting of directories
    which will need to be carefully tested.


    # 4.2.4 Printing services in the domain


    Of course, it is possible to add printers directly to Linux clients. But this
    creates extra administrative overhead in a scenario where you are integrating
    Linux clients into an existing Windows domain that provides printing services
    already. Since almost all Linux distributions now include the Common UNIX Printing
    System (CUPS), it is possible to use CUPS in conjunction with Samba on the client
    to enable printing to the existing domain printers.


    If you plan to use CUPS on the Linux clients to print to printers, some issues
    have to be taken into account:


    +   - Is CUPS and Samba integration handled correctly?


    +   - Do the printers need authentication? Domain passwords for shared printer
    access be exposed.


    +   - What are the advantages of using print versus direct printing to the printers
    network interface?


    +   - Are drivers available for CUPS for each printer model in use?'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# CUPS and Samba integration


    In most distributions, CUPS and Samba will be integrated properly. It needs to
    be checked, however, and this has to be taken into account when planning. Most
    importantly, you have to check if Samba is part of the CUPS back-end. How to do
    this is described in 9.7, "How to use network printers in the domain" on page
    219.


    # Printers and authentication


    Printers in the domain can require domain authentication to be able to use them.
    This is possible using CUPS, by providing the username and password in the URI
    of the printer. The consequence of this is that the password will be exposed in
    several CUPS configuration files. The only current workarounds to exposing passwords
    are making printers unauthenticated (that is, available to everyone) or creating
    a special printer user for each printer and only incorporating this special user
    on those clients that need to print to the server.


    # Print server versus direct printing


    Using CUPS, it is possible to use the domain print servers or print directly to
    the network interface of the printer (if available). Usually if all clients already
    in the domain use print servers, it is good to follow this principle for the Linux
    clients as.


    The advantages of using the print servers are:


    +   * There is no difference between print jobs coming from the Windows or Linux
    clients.


    +   * The printer is controlled from the print server, so when it needs to be
    rerouted or disabled this is done for all clients.


    # CUPS drivers


    There is quite a big difference in the models and drivers included in CUPS in
    each of the different distributions. So this is one of the most important steps
    to check.


    If your printer is old, or used by very few people, then decisions have to be
    made about how much to invest to get it working on Linux clients. The investment
    for a new printer that works "out-of-the-box" might be a lot less than to get
    older models to work.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 4.2.5 DHCP and DNS configuration


    In almost all cases, using DHCP and DNS from a Windows domain will work without
    problems. This is completely transparent to the user. Once configured correctly
    for the Linux client, both protocols should work without any problems.


    However, some care has to be taken using DHCP and X11. The Linux client generally
    accepts host names from DHCP. If this occurs after X11 has started and the user
    is logged on, new applications might have trouble accessing authorization information
    handled by Xauth.


    > Planning tip: Make sure a DHCP host name is accepted by the Linux client before
    starting X11 or logging on graphically.


    # 4.2.6 Web proxy interface


    The protocol that is used to talk to a Web proxy is independent of the operating
    system. This means talking to a Windows Web proxy is as easy as setting the correct
    settings in the Web browser.


    This means interfacing the Linux client with an existing Web proxy is one of the
    easiest tasks of the migration.


    # 4.3 Standardizing the desktop


    When deploying a Linux desktop solution, you will most likely want a standardized
    environment used across your organization. One of Linux''s advantages is its freedom
    of choice, passing this choice on users in your organization will most likely
    increase the technical support load. Instead, a standardized desktop environment
    should be created for your organization, with only slight variations depending
    on the needs of the user.


    > Important: Linux''s greatest advantages include freedom of choice and 100% top-down
    client software design flexibility. Use these advantages to create simplified
    and task-focused desktop user interfaces that are designed to limit excessive,
    non-business-oriented complexity.


    Compared to building a standard Windows desktop environment, there can be far
    more design decisions to be made when building a standard Linux desktop environment.
    These choices include the distribution to base your client platform on, the desktop
    environment users will work with, the look and feel of the environment, permissions
    available to the user, applications that the users'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'will use, and even which type of file system to use and a partitioning and
    mount point strategy for those file systems.


    > **Planning tip:** Assuming that you are migrating to a Linux desktop distribution
    purchased from an enterprise vendor, then you will have the option of using the
    default predesigned desktop environment as the basis for your clients. In that
    case, you might not need to design your standard desktop from the ground up, as
    discussed in this section. In fact, your selection criteria for choosing this
    enterprise vendor distribution to be used in large part on how closely the default
    desktop provided by that distribution meets your client-side functional requirements.


    # 4.3.1 Linux distributions


    Because Linux, and most of the software surrounding it, is open source, this means
    that anyone can legally create a new distribution of Linux. This empowerment has
    led to hundreds of various distributions, each with a niche it is trying to fill.
    Some distributions are made to be easy-to-use, others are targeted toward enterprise
    users, while others are based on the idea of extreme customizability. The two
    distributions that we focus on in this Redbook are Hat Enterprise Linux and Novell
    Linux Desktop (which is based on Novell''s SUSE Linux).


    There are many reasons to choose one distribution over another. When choosing
    a distribution, you must consider some or all of the following:


    +   - Vendor support options and costs

    - Applications bundled with the distribution

    - Administration tools offered with the distribution

    - Availability of third-party software which targets this distribution


    # 4.3.2 Linux desktop environments


    While there are numerous desktop environments available for desktop Linux (as
    seen in 5.2.4, "Graphical and text-based environments" on page 118), the majority
    of desktop Linux installations feature either a KDE or GNOME-based desktop. These
    two environments provide a complete desktop environment. This means not only a
    graphical toolkit and window manager, but also a standard environment with desktop
    icons, a menu panel, and applications such as a file browser, CD burner and other
    tools. More advanced applications have been written for each environment, such
    as office productivity suites, players, photo management tools, and advanced e-mail
    and groupware events. Applications that are written specifically for either KDE
    or GNOME will look similar to other applications written for the same environment
    and will typically follow global settings that have been configured for that environment.
    For'
