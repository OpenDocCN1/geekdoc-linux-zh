    # 9.4.3 PAM and home directories


    Domain-enabled users do not exist on the client locally. Either the winbind configuration
    in /etc/samba/smb.conf or use the entries in the AD schema tell which shell to
    use and where the home directory of the user is located (this function is performed
    by the /etc/passwd file for local users). However, the home directory is not created
    by either winbind or LDAP.


    This problem can be solved in a number of ways:


    +   - Create possible home directories (empty) on all clients.

    - Create all home directories on a server file system that is mounted on all clients
    (through SMB or NFS).

    - Use the pam_mkhomedir.so module to create a home directory at first logon.


    The two options seem straightforward to implement but lead to management issues
    every a user is added to the domain. The last option is seen as a best practice
    and consists of adding a line to the PAM configuration files that creates the
    home directory if it does not exist. This change of the PAM configuration file
    has to be done once when the Linux client "master" is created.


    # Red Hat Desktop


    On Red Hat systems, the pam_mkhomedir module is added to /etc/pam.d/system-auth.
    This way the home directory is created when a user logs in through a login (for
    example, a terminal prompt), a secure shell, or a graphical logon.


    The line you must add to the file is shown in Example 9-19.


    ```

    Example 9-19 Example of the /etc/pam.d/system-auth file, including pam_mkhomedir

    #%PAM-1.0

    # This file is auto-generated.

    # User changes will be destroyed the next time authconfig is run.

    auth    required /lib/security/$ISA/pam_env.so

    ```'
