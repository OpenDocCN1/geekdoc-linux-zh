    # # 9.6 Automatically mounting home directories at logon


    One of the great functionalities of Windows is the Single Sign On (SSO) function.
    Once you log on to a Windows operating system, it takes your password to try to
    mount shares that you have installed as remountable at next logon.


    A similar functionality can be created on a Linux client using the pam_mount module.
    This PAM module is not completely mature yet. It is not included in all enterprise
    distributions. With a little extra work, it can be made to function.


    > **Important:** Since September 2005, pam_mount seems to be getting more attention.
    New versions become available more rapidly. Although, these do not work on all
    distributions.


    The SMB and CIFS filesystems do not allow the creation of symbolic links or sockets,
    because the underlying Windows share does not allow these constructs. This means
    that any application that needs to create a link or a socket cannot run from a
    mounted filesystem.


    > **Restriction:** Take care when mounting SMB shares as users'' home directories
    when using graphical login. Some graphical desktop environments do not work in
    a SMB-mounted file system, most importantly, those that depend on symbolic links
    or sockets, because SMB file systems do not work with symbolic links and sockets.


    > **Tip:** The user''s domain share in a subdirectory of the home directory, thus,
    avoiding all issues with desktop environments.


    The pam_mount module only mounts SMB and CIFS file systems, but also NCP, loop-mounted
    encrypted file systems, and basically any file system handled by the **mount**
    command.


    # # 9.6.1 pam_mount on Red Hat Desktop


    The module is added to the /etc/pam.d/system-auth file to enable automatic mounting
    for all login modes. The module consists of both an “auth” part,'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'acquires the password through PAM, and a "session" part, which does the actual
    mounting. Because this is a session module, this enables an unmount of the file
    systems when the session closes.


    > Tip: Check if you need automatic mounting for all modes to log in. For example,
    a su from root to a user does not work because a password is not provided.


    The lines to add look like this:


    ```

    auth        required        pam_mount.so

    ```


    And:


    ```

    session     optional        pam_mount.so

    ```


    The auth line should go before pam_unix and pam_winbind lines. The session line
    should go in the session section. Remember to add a use_first_auth argument for
    the line not having one before adding pam_mount; otherwise, a second password
    prompt shows for that entry.


    The pam_mount module has its own configuration file /etc/security/pam_mount.conf.
    This file contains such as where the mount and unmount commands are found, debug
    settings, whether mount points should be created, and which file systems should
    be mounted for users.


    A minimum pam_mount.conf file for mounting SMB shares like Example 9-23.


    Example 9-23 Minimum pam_mount.conf


    ```

    debug 1

    mkmountpoint 1 require nosuid,nodev

    lsof /usr/sbin/lsof

    fsck /sbin/fsck

    losetup /sbin/losetup

    unmount /sbin/losetup -d

    smbmount /usr/bin/smbmount

    unmount /usr/bin/smbumount

    volume * smb31ab26 & /home//&domainshare uid=,dmask=0750 -

    ```


    This enables debugging on pam_mount. Points are created when they are non-existent
    and the share to be mounted is indicated in the last line.


    The asterisk near the beginning of the last line in this example indicates that
    this security is mounted for every user. The ampersand character (&) in the'
