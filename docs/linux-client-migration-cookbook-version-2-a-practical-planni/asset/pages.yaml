    # 4.7.4 VMware solutions


    Using VMware (or any similar application that runs on Linux), it is possible to
    create a virtual Windows machine that the user can use to work with applications
    that cannot be moved to Linux or a central server.


    The virtual machine is a completely functioning Windows machine and can be loaded
    with the image of a Windows client already in use before the migration to Linux.
    When using a domain, this means that the virtual machine has to become part of
    the domain as well. The virtual machine has to be connected to the network via
    bridging or NAT.


    This solution has several disadvantages:


    +   - A full Windows license is needed for the virtual machine.

    - VMware software needs a license also; this will lead to extra cost.

    - Extra management tasks to keep VMs running on clients.

    - Possible extra requirements on the client resources in terms of memory and disk
    space.

    - The user might be tempted to work in the virtual machine to avoid using the
    new Linux client.


    Whether this solution is feasible with the extra cost depends on the number of
    clients involved and the cost of alternative solutions.'
  merge: -1
  img_proc: true
