    # Additional system management considerations


    Software maintenance, system management tools, security, and privacy are common
    concerns among all managed desktop environments; however, a few basic additional
    considerations pertaining to multi-station Linux should be noted.


    # Software updates


    Software packages and updates provided by the vendor of the installed Linux operating
    system typically do not account for multi-station systems. For most multi-station
    deployments, this fact can be both advantageous and annoying.


    Updating user application and system component packages do not affect an existing
    multi-station installation. The exceptions are software packages that directly
    affect X, the login managers, and configurations for those subsystems.


    The following kinds of updates can affect Desktop Multiplier settings:


    +   * Updates that change GDM settings might prevent graphical login from more
    than one station.


    +   * Updates that change the runlevel of the system might cause Desktop Multiplier
    to exit prematurely (Desktop Multiplier defaults to runlevel 5).


    However, to compensate for these cases, on the next reboot, Desktop Multiplier
    will attempt to automatically restore the GDM configuration file should it be
    overwritten by an OS update, software package, or service pack.


    The Desktop Multiplier configuration can be reset to defaults with the following
    command: `rm -f /etc/X11/Mxorg.conf`. After doing this, a software wizard creates
    a new configuration file on the next reboot. In situations of extreme modification
    due to vendor updates, reinstalling Desktop Multiplier might be necessary.'
  merge: -1
  img_proc: true
