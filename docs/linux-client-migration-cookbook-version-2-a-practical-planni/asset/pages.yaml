    # Case study two: Transactional desktops: Public computers for a city library


    A multi-branch city library experienced a period of significant growth due to
    population increases in their area. Library branches were added and modernized
    to increase services with a focus on electronic access. The highest growth rate
    was in public computer use. Its eight branches saw a 400% increase in computer
    hours logged between 1998 and 2003.


    # Requirement


    Since began deploying public access computers, the library had prized itself on
    offering its patrons an excellent service. Unfortunately, tight budgets coupled
    with high hardware, software, and support-related costs were forcing choices on
    the library. If the branches wanted to meet the immediate demand for computer
    access for all their patrons, not all of the computers could have the latest software
    packages. Even free software updates (as the latest version of Macromedia Flash)
    were often not up-to-date staff was always in limited supply. Many stations lacked
    floppy drives, because staff time lacked building capabilities, and not all stations
    could run processes. For years, the library was forced to pick and choose from
    a limited set of options. They simply could not provide everything patrons wanted
    on every computer. This created a heterogeneous hardware and software environment
    that was difficult to maintain and support.


    Helping patrons find the correct station to print a resume or download attachments
    to disk also placed a unwanted burden on the reference desk staff. Supporting
    the wide array of hardware and software combinations on 100 public access computers
    across eight branches became a headache for the IT staff. In addition, there were
    never enough machines to go around and there were often long lineups for computers,
    particularly during peak hours.


