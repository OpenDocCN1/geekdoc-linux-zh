    # Management tools


    Multi-monitor and multi-station system setups can at times pose additional management
    challenges. Even though the one-to-one relationship between users and GUIs is
    preserved, some system management software might not be aware that multiple monitors
    or other interface devices are in.


    Tools, such as Novell ZENorks system management software or OCM Suite from OpenCountry,
    typically work seamlessly in multi-station setups, while vendor specific tools
    might or not. Be sure to thoroughly test tools in a variety of multi-user configurations
    prior to deployment.


    # Software and support


    Multi-station desktop Linux can reduce the total number of software and subscriptions
    required in many deployment scenarios by reducing the total number of CPUs deployed.
    Depending on the particular software agreements in force, licensing and support
    subscription costs can be reduced substantially. Deploying multi-station systems
    also substantially lowers the total system load because there could be significantly
    fewer desktop systems to manage.


    # System shutdown


    System shutdown and physical access to controls on multi-station computers are
    important considerations where multiple individuals share the same computer. Restarting
    a system without notice could result in loss of work or data for multiple users
    at once. Useful''s Desktop Multiplier removes the shutdown option from the default
    greeter on Fedora Core. Best practices suggest similar modifications should be
    made to all-station deployments to avoid accidental loss of work. As an example,
    Useful''s multipier greeter for Fedora is available:


    http://www.useful.com/no-shutdown-gdm-greeter


    # Multi-language support


    Desktop Multiplier supports international keyboard layouts and allows each user
    to have different keyboard settings as needed. However, GDM and KDM currently
    do not allow users to change keyboard layouts³. As a result, users cannot switch
    keyboard layouts until after they log in. The result is that users'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'might be unable to type their username and password to log in if the keyboard
    layout is incorrect.


    If a multi-computer system is serving users who need to type multiple languages
    or use different keyboard layouts, the system and the greeter should be started
    using a common language layout, which can be changed by the individual users after
    logging in. Desktop Multiplier supports full internationalization of its configuration
    tools with translations available in most commonly languages. Support for additional
    languages are typically available within several business days of a request for
    supporting a new language.


    # Security considerations


    Security security on multi-station Linux poses significant challenges beyond those
    of single-user Linux workstation deployments. The key security difference between
    a single-user Linux workstation and multi-station Linux is that multiple users
    share access to the same computer system; therefore, its storage, processes, programs,
    and other hardware are also shared. Any system compromise or corruption during
    one user''s activity can potentially affect all users.


    Sharing systems is not explicitly a problem if the users never modify their workstation
    environment, for example, by installing browser plug-ins and applications, or
    by adding or compiling shared libraries. But multiple users are able to simultaneously
    run potentially untrusted applications on the same computer, a physical or electronic
    compromise of one user''s environment could result in the compromise of all local
    user environments.


    In order to minimize the effect of user configuration changes, we recommend that
    users of multi-station systems never get local root or administrator level access,
    and that users are made aware of how to install software in their own private
    directories without adversely affecting the shared multi-station computer environment.
    In this manner, no user can have access to another user''s temporary files or
    running processes, and no user can modify the shared environment.


    # Privacy considerations


    As discussed above, sharing a computer could result in the inappropriate, inadvertent,
    or deliberate disclosure of confidential information. The potential for sharing
    data and the sometimes complicated access controls required to prevent


