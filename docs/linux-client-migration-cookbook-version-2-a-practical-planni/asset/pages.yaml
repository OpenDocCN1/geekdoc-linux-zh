    when using a Linux client is small to none.


    If an application is not included in the distribution, chances are that there
    is an OSS equivalent that can be installed free of cost.


    # Management and support costs related to the client


    In any medium to large enterprise, keeping any production desktop client operational
    and free of bugs and security exploits is usually one of the largest cost factors.
    This does not change in a Linux-based client strategy. But, the fact that the
    operating system is UNIX-like introduces a lot of innovative cost-saving strategies
    for consideration. For example, because the client can be remotely connected and
    managed using telnet or SSH protocols, it is possible to install scripts on the
    client that can easily be executed.


    Using remote scripts, it is possible to monitor the clients for problems and to
    execute a task on all clients from a central server. For example, it is possible
    that a bugfix can be implemented on all clients by remotely executing a script
    on the client that is able to fetch a patch and install it, without user interruption.'
