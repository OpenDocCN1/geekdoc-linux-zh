- pgno: 90
  md: '# 4.1 Assessing the client IT environment


    Before starting to look into technical details of a future Linux and open source-based
    environment, it is critical that you thoroughly assess the current status of the
    IT infrastructure and the supporting processes.


    For the IT Infrastructure, many components will come to play, not only the core
    installation of a desktop environment, but also any other infrastructure components
    around it. This might be servers providing file and print functions, databases,
    directory services, application servers (both native and Web-based) or even mainframes
    which are accessed via host emulation or API-based communication. Some of the
    key considerations and methods in this area are discussed in more detail at 4.2,
    “Integrating with existing network services” on 69.


    Because we are focusing on migrating client workstations, two key areas in the
    client environment need to be surveyed:


    +   - Interactions: The user application patterns

    - Physical systems: Desktop system properties, special devices, and peripheral
    integration requirements


    # 4.1.1 Assessing the client hardware


    You should complete a physical systems survey of all client systems targeted for
    migration. The results of this survey will enable you to identify any hardware
    support issues, and define rules for buying and replacing systems in the future.


    This survey should ideally be done through an automated process to develop historical
    data. This survey can also be done as a one-time scan for migration purposes.
    IBM eGather technology and the Asset Depot offering can help automate the survey.
    For more details, the IBM Redpaper Using Asset Depot for Inventory Management:


    http://www.redbooks.ibm.com/abstracts/redp3763.html70open


    Questions to ask in this area:


    +   - What hardware is in (vendor, type, and model?) If this results in a large,
    diversified list, then consolidation is something to consider, regardless of the
    platform you are using.

    - Is the hardware standardized? If all the machines are the same, then driver
    support and operating system deployment should be significantly simpler.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   What local attached devices are currently installed and required by users?
    This includes any type of printers, scanners, and special function keyboards required
    for business types of transactions.


    +   Is support for Linux included in current requests or proposals to hardware
    vendors when buying hardware?


    +   Which key components of your hardware are currently required by users? For
    example, machines might have sound cards installed, but drivers are not installed
    because users are not supposed to use them. Therefore, support on Linux would
    not be required.


    +   What types of attached devices need to be supported? For instance, synchronizing
    calendaring and other data with PDAs or smartphones might be required. Also, USB
    sticks, Bluetooth devices, and external FireWire hard drives have become very
    popular, though organizations disallow such devices due to security reasons. It
    might be necessary to support such hardware or to not include support for some
    of these devices. Likewise, many users might be synchronizing their desktops with
    MP3 player. While supporting these MP3 players in Linux could help users enjoy
    the Linux experience, it can also increase the complexity of supporting a Linux
    installation.


    Sometimes hardware providers provide explicit support for Linux, while other devices
    are maintained by a third party. IBM, for example, provides information about
    supported desktop hardware for their current models, so customers can check on
    officially supported hardware as well as available drivers. Information can be
    found at:


    > http://www-306.ibm.com/pc/support/site.wss/MIGR-48NT8D.html


    A sample client hardware survey might look like Table 4-1 on page 65.'
  merge: -1
  img_proc: true
