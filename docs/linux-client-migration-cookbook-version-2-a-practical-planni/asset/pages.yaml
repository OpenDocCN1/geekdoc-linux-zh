    From an Intel standpoint, a standards-based Linux OS running on an open computing
    platform contributes to the overall health of the Linux OS ecosystem. Within a
    healthy Linux OS ecosystem, innovation and collaboration come together to produce
    fresh business models and solutions stacks — helping to extend the desktop market
    into areas of the world where demand for cost-effective PCs has been rising. Having
    clearly standardized interfaces create more interest for ISVs to innovate and
    develop targeted solutions for the platform. In turn, this creates opportunities
    for hardware sales in areas of the market where inexpensive systems are required
    for large and small organizations.


    Dirk Hohandel, director of Open Source Strategy in the Intel Software and Solutions
    Group, "Intel actively engages in Linux Standard Base efforts to help meet the
    requirements of our customers who are asking for Linux [OS] solutions. We are
    working to provide a healthy and stable set of solutions for customers in different
    parts of the world. Obviously, whatever stack our customers are choosing and for
    whatever reason, we want to make sure that Intel represents the choice for them.
    Our primary goals are to respond to customer demand and contribute to the progress
    in developing a strong, international ecosystem."


    # Incentives for independent software vendors


    The nature of open-source development has created a climate in which new business
