    # Case study one: General office desktops for a 25-user office


    This case study shows a multi-station solution for adding employees at a branch.


    # Requirement


    A 15-employee branch office of an IT company needs to expand its open plan to
    accommodate ten additional employees. The office also has an executive suite with
    four workstations.


    The office is located in an older building with aging electrical infrastructure
    with relatively few wall outlets, low amperage, and most network cables must be
    run through the plenum space due to the poor quality of installed copper lines.
    Local construction bylaws concerning older buildings prevent the addition of new
    electrical cabling without renovating the electrical infrastructure of the entire
    building.


    Each employee''s workstation either ran Windows or a Red Hat or Fedora Linux distribution
    at various patch levels and was maintained as needed. User files were maintained
    locally with no effective security measures, centralized data storage, or backup
    plan. Several Windows workstations were required for print document design and
    production, accounting functions, and for access to occasionally used Windows
    applications.'
