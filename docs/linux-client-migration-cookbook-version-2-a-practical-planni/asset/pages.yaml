- pgno: 205
  md: '# ## 8.3 Performing the migration


    In this section, we discuss performing the migration.


    # ### 8.3.1 Basic installation tasks


    The first thing to do is complete a base installation from the distribution CDs.
    In the case of Red Hat Desktop, the CD set contains four CDs. Special packages
    for the desktop are available from the Red Hat Network. Third-party applications
    such as Acrobat Reader or Real Player and a set of high-quality trueetype fonts
    from AGFA.


    During installation, we accepted the default selections for application packages
    defined by the installation program. On our target hardware, the Red Hat Anaconda
    installation program completed the base installation without any problems. Also,
    the Red Hat hardware probing library called kudu worked as expected. All hardware
    components were detected correctly. The modules for the integrated video and audio
    chipset loaded successfully. The network card driver was loaded, and the network
    was activated successfully at the end of the installation. The system successfully
    received a DHCP lease from the DHCP server in the ITSO network. Name resolution
    worked well, without any extra configuration steps.


    # ## Setting up remote administrative access using VNC


    Once the installation completed, we chose to immediately modify our client setup
    to provide remote terminal access to it from other workstations in the network
    using VNC. This way we could complete any additional administrative tasks to complete
    the install remotely.


    To begin this process, we first checked that the SSH daemon was running and that
    every connection through VNC gets a complete desktop. One way to enable this for
    the root user is to modify the file $HOME/.vnc/startup, as shown in Example 8-1


    > *Example 8-1 Enabling VNC connections*


    ```

    #!/bin/sh

    ```


    ```

    # Uncomment the following two lines for normal desktop:

    unset SESSION_MANAGER

    exec /etc/X11/xinit/xinitrc

    ....

    ```


    Also, we had to enable Xdmcp in /etc/X11/gdm/gdm.conf and set up a session in
    /etc/sysconfig/vncservers.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'After we start executing the command service vncserver start, we can connect
    to VNC client and work on the complete graphical interface.


    > **Important:** Allowing complete access through VNC can be dangerous, because
    it enables connecting to the local X server from any place. If it is needed, editing
    /etc/hosts.allow or /etc/hosts.deny can allow you to limit who can access the
    workstation.


    # Preparing to integrate with Windows network services


    The next step in our migration is to connect the client to the existing networking
    services. In our existing environment, we integrate with Windows NT and Windows
    2000 servers, so we follow the instructions in Chapter 9, "Integration how-tos"


    Our first goal is the ability to use the services of the existing Windows domain,
    primarily using user authentication. In order to be able to log on to the Linux
    client using Windows usernames and passwords, it is necessary to set up windbind.


    We edited /etc/samba/smb.conf for a proper setup in our network environment.


    Example 8-2 Changes to smb.conf for Linux client domain authentication


    ```

    workgroup = ITSAUSNT

    security = domain

    password server = ITSONT00,ITSONT01,ITSONT02,ITSONT03

    ...

    windbind separator = +

    idmap uid = 10000-20000

    idmap gid = 10000-20000

    windbind enum users = yes

    windbind enum groups = yes

    template homdir = /home/%U:%D%U

    template shell = /bin/bash

    ```


    # 8.3.2 Integrating existing network services


    After the windbind daemon has started, the command wbininfo -u should deliver
    the current user list of the Windows domain. Before this works, it is necessary
    to join the domain with the Linux client. As long as there is no machine account
    in the domain for the client, it is not possible to fetch the list of users using
    windbind. Therefore, we have to join the domain with the following command:


    ```

    net join - ITSAUSNT -U administrator

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: '> Important: Do not forget to join the domain with the command `net join -a
    <domainname>`. This creates a valid machine account on the domain controller and
    gives the Linux client a valid SID for authentication.


    Because we are now able to read the user database on Windows, only two more steps
    are needed to log in on the Linux client with an existing account managed by the
    existing Windows domain.


    Next, nssswitch.conf is changed according to 9.2, "Using winbind to make domain
    users known locally" on page 199, which changes the mapping of Windows users and
    Groups to the Linux uids and gifs.


    # Example 8-3 Changes to /etc/nsswitch.conf


    | passwd: files winbind |

    | group: files winbind |


    By performing the command `getpasswd` for testing purposes, all users should be
    listed with their correct uids and gifs.


    Now it is time to enable the login process to use the mapped users. This is done
    by using two different PAM modules, which is described in detail in 9.4.1, "How
    to authenticate users using winbind and PAM" on page 208.


    Because we use Red Hat Desktop for our pilot migration, all information in "Winbind
    and PAM on Red Hat Desktop" on page 208 applies.


    At first, set up the pam_winbind and the pam_smb_auth module, which allow system
    authentication with a user of the domain ITSOSAUSNT. To enable this, we edited
    the /etc/pam.d/system_auth file, as in Example 8-4.


    # **Example 8-4** Edit the /etc/pam.d/system_auth file


    ```

    #PAM-1.0

    # This file is auto-generated.

    # User changes will be destroyed the next auth config is run.

    auth required /lib/security/$ISA/pam_env.so

    auth sufficient /lib/security/$ISA/pam_unix.so likeauth nullok

    auth sufficient /lib/security/$ISA/pam_winbind.so use_first_pass

    auth sufficient /lib/security/$ISA/pam_smb.auth.so use_first_pass nullok

    auth required /lib/security/$ISA/pam_deny.so


    account required /lib/security/$ISA/pam_unix.so

    account sufficient /lib/security/$ISA/pam_winbind.so

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'It is possible to authenticate both with a local or a domain user account.
    A first test on the console shows that it is working, but at this point, logging
    in on the GNOME welcome window generates an error.


    The reason for this problem is that at the time of the first login, there is no
    home directory for the associated user ID. GNOME had no file system path in which
    to create the personalization and settings files during first login. To solve
    this, we used another module, pam_mkhomedir. By using this module, a home directory
    is created at login, if it does not exist yet.


    It is necessary to add the line in /etc/pam.d/system-auth


    Example 8-5 Addition of pam_mkhomedir entry in /etc/pam.d/system-auth


    ```

    #%PAM-1.0

    # This file is auto-generated.

    # User changes will be destroyed the next time authconfig is run.

    auth required      /lib/security/$ISA/pam_env.so

    auth sufficient    /lib/security/$ISA/pam_unix.so likeauth nullock

    auth sufficient    /lib/security/$ISA/pam_winbind.so use_first_pass

    auth sufficient    /lib/security/$ISA/pam_smb_auth.so use_first_pass nolocal

    auth required      /lib/security/$ISA/pam_deny.so


    account required    /lib/security/$ISA/pam_unix.so

    account sufficient  /lib/security/$ISA/pam_winbind.so

    ```


    ```

    session optional      /lib/security/$ISA/pam_mkhomedir skel=/etc/skel umask=0022

    ```


    Now, we can enter the username and password on the GNOME window, a home directory
    is created, and the complete GNOME desktop is available.


    We log on using the ID:


    ```

    ITSOAUSNT+AUSRES06

    ```


    The login username has the format:


    ```

    <domainname:separator:username>

    ```


    So, the GNOME desktop shows an icon with ITSOAUSNT+AUSRES06''s home. Unfortunately,
    it is not possible to separate the domain and username on a standard GNOME installation;
    the winbind separator will always be visible.


    # Mounting Windows file shares


    After enabling domain user logon, it should also be possible to use the file shares
    on the Windows servers. Our example client needs to map three separate file using
    the same credentials. We have to store the user credentials in a file'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'in order to avoid having interactively use the mount command on each login.

    smbmount command allows the use of a credentials file. For security reasons,

    placed the credentials file in root''s home directory and set the file permission

    such that only root has access to the file. The file /root/.credentials looks
    like

    Example 8-6.


    ```

    username = ausres06

    password = password

    domain = itsoausnt

    ```


    The most local place for such a execution is in /etc/fstab, where there is

    possible to define the file system to smbfs, and the file shares would be mounted

    at the same time as the local file systems.


    # Example 8-7 Mounting file shares in /etc/fstab


    | /dev/hda1 | | reiserfs | acl,user_xattr | 1 1 |

    | /dev/hda5 | /scr | auto | noauto,user | 0 0 |

    | /dev/hda2 | | swap | pri=42 | 0 0 |

    | /dev/fd0 | /media/floppy | subfs | fs=floppyfs,procid,novec,nosuid,sync 0 0
    |

    | /itsont5/data | /shares/data_g | smbfs | credentials=/root/.credentials 0 0
    |


    This works fine the Windows file share use nonstandard characters. In

    contrast to UNIX-like operating systems, Windows allows you to use space\characters
    and non-ASCII characters (such as German umlauts) in the names of

    file shares. You might run into problems in the case where the Windows file

    shares contain special characters. For example, the /etc/fstab file uses the space

    character as a delimiter, so if a share contains a space, it takes the following

    string as a mount point. While mounting the "project data" file share, the

    mount command complains about several errors in the fstab file, as it tries to

    data as a mount point.


    > Tip: When mounting Windows file shares in a Linux file system, it is very

    reasonable to check the names of the shares for special characters.

    Renaming them to be UNIX-compliant can save a lot of time and annoyance.


    Thus, we had to use another way of mounting the file share, and we decided

    to extend the /etc/rc.local file with the corresponding smbmount commands.


    Modifications to rc.local are shown in Example 8-8 on page 183.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Example 8-8 Extended rc.local file


    ```

    ```bash

    !/bin/sh

    # This script will be executed *after* all the other init scripts.\n# This script
    will be executed *after* all the other init scripts.

    # You can put your own initialization stuff in here if you don''t

    # want to do the full Sys V style init stuff.


    touch /var/lock/subsys/local


    #mounting windows file shares

    smbmount //itsont05/data /shares/data_g -o credentials=/root/.credentials,

    gid=ITSAUSNT+Domain\Users,umask=0775

    smbmount //itsont02/"project data" /shares/projectdata_e -o credentials=/root/.credentials,

    gid=ITSAUSNT+Domain\Users,umask=0775

    ```

    ```


    If like shares with special characters here, it is necessary to put them in quotation
    marks, as shown in the last line of Example 8-8 above. The gid and dmask options
    of the smbmount command are used to ensure that the permissions are set in the
    right way for the Linux directories in which the shares are mounted. If they are
    left out, users would not have write permissions because of the default umask
    in the root directory. The permissions are set on the Windows file server are
    inspected only after a user has full access to the mount point. It is evident
    that smbmount does not override permissions on the server side.


    > **Important:** Be careful with permissions on the directories that you use as
    mount points; make sure they fit to the permissions given on the Windows server.
    Using a gid in the command prevents file access from users who are not members
    of group.


    # Printers


    Printer services are provided via the smb protocol as well. We decided to use
    CUPS to integrate our network printers on the Linux clients.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Tip: If drivers for your printer are not included in the standard installation
    of CUPS, it might be possible to find the right ppd (Postscript Printer Description)
    driver file for your printer on the Internet. The correct ppd driver file for
    your printer should be added to the directory /usr/share/cups/model. Then after
    restarting CUPS, the new driver is available when adding a printer. Methods for
    finding a ppd driver file are:


    +   - Search your printer manufacturer''s Web site for Linux support or ppd driver
    downloads.

    - Purchase printing software supporting Linux:

    http://www.easysw.com/printpro

    - Try a Windows PPD file provided by Adobe:

    http://www.adobe.com/products/printerdrivers/winppd.html

    - See the CUPS home page for more links:

    http://www.cups.org


    By following the steps in “Create a printer using CUPS Web interface” on page
    221, it was extremely easy to add the printers with the right credentials.


    # 8.3.3 Application configuration and installation


    As pointed out earlier in this chapter, the main application on the resident PC
    is Adobe FrameMaker. Interestingly enough, Adobe offered a Linux version some
    time ago, but as of Version 6.0 this was cancelled. Because the client needs FrameMaker
    Version 7.0 with some special plug-ins, it is not possible to install this application
    on Linux. Thus, we have to find a way to handle this “unmigratable” application
    (see 4.7, “Unmigratable applications” on page 99, for a detailed discussion about
    strategies).


    The solution we chose to support FrameMaker users on the migrated Linux client
    was to use a remote services method using Windows Terminal Server Remote Desktop
    Protocol (RDP) to an application session running on the WTS host. Other terminal
    services solutions for this type of application hosting requirement exist, but
    for this small scenario, we decided using WTS is satisfactory. Our next step is
    to install the application on the Terminal Server.


    Because it is not guaranteed that every application can run on a Terminal Server,
    we ran several tests by starting FrameMaker several times in different sessions.
    We learned that our version of FrameMaker was not optimized for this scenario,
    since each FrameMaker application instance running on the WTS host consumed an
    equal amount of system memory.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '> **Important:** If an application is not optimized for terminal servers, it
    takes the same amount of memory for each instance. The server needs to have enough
    main memory to handle the expected Terminal Server load.


    The connection to the Terminal Server is made by tsclient, GTK+ GUI for the rdesktop
    application. Using a launcher file on the desktop, it is possible to use a configuration
    file while executing tsclient. Our command syntax for starting the tsclient session
    is as follows:


    ```

    tsclient -x $HOME/framemaker.tc

    ```


    The framemaker.tc contains all of the information for the connection, such as
    the IP address of the host and the username to connect to.


    An example window of FrameMaker running inside a Terminal Server client on Linux
    is provided in Figure 8-1 on page 190.


    # Image manipulation


    On the Windows-based client, we used Jasc Paint Shop Pro for manipulating images
    and taking screen captures. Because Paint Shop Pro is not available for Linux,
    we decided to use the GIMP as a functionally equivalent Linux application instead.
    This open source application is very mature and provides a good functional equivalent
    to Paint Shop Pro for the specific uses that the Windows client in this scenario
    needs. Further information can be found at:


    http://www.gimp.org


    The GIMP is included as part of the standard installation of Red Hat Desktop,
    no extra configuration was necessary. A screen capture showing the GIMP running
    on the migrated desktop is shown on Figure 8-2 on page 191.


    # Browser


    For our migration scenario, we decided to use the Mozilla Firefox Browser. Firefox
    is the browser-only project from the Mozilla Foundation. Because we do not need
    mail capabilities (these are provided by Novell Evolution), using the stand-alone
    browser offering from Mozilla seemed reasonable.


    We recommend that you check important Web sites or especially Web clients for
    compatibility with the browser before the migration. Some Web sites use ActiveX®
    controls or special JavaScript™ functions, which are only supported by Microsoft
    Internet Explorer. Because this is not the case for our migration client, it is
    easy to make the switch and use Mozilla Firefox instead of Internet Explorer.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# E-mail client


    To make our client migration scenario more realistic, we added the requirement
    that existing clients using Microsoft Outlook, which connects to a Microsoft Exchange
    2000 server. Our migration task includes migrating from the Windows-based Outlook
    client to a Linux-based messaging client that provides similar functionality and
    integrates with the existing Exchange 2000 messaging system.


    # Novell Evolution with Novell Connector for Exchange


    Our migration solution consists of using the Novell Evolution e-client in conjunction
    with the Novell Connector for Microsoft Exchange Server. The e-mail client has
    an architecture that supports building special connectors for different groupware
    applications. A connector for Microsoft Exchange 2000 and 2003 was developed and
    released under the terms of the GPL in May 2004. A key factor in enabling the
    development of the Exchange connectors was Microsoft''s inclusion of a Web interface
    to Exchange Outlook Web Access (OWA). OWA used WebDAV for communication to the
    Exchange message store. So it became possible to develop connectors by implementing
    a WebDAV interface, instead of having to reverse the proprietary MAP protocol
    of Exchange.


    > Restriction: Only the Exchange versions 2000 and 2003 support WebDAV connections.
    As of the writing of this book, a connector supporting native Linux client access
    to Exchange 5.5 was still available.


    We installed the required Novell Connector for Microsoft Exchange Server RPMs
    that were delivered with Red Hat Desktop and found it to quite easy to set up
    a connection to the Exchange Server. There were some requirements to get this
    working, mainly enabling Outlook Web Access on the server.


    > Important: Before using the Exchange connector, you need to check prerequisites.
    It is necessary to start the Exchange virtual server in the HTTP section of the
    Exchange system manager. You also need to enable HTTP protocol for the users.
    This is done in the user settings through the Directory Users console.


    More information about the Novell Connector for Microsoft Exchange Server can
    be found on the Novell Evolution page at:


    ```

    http://www.novell.com/products/evolution

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Settings migration


    In order to keep the user productive, we want to maintain their settings and data.
    Users are supposed to keep their documents on a network share, so we do not need
    to search the entire hard drive for documents. In cases users keep some notes
    or import scratch files on their local machine, we will move data from the My
    Documents and Desktop directories. E-mail messages are stored on the Exchange
    Server, so we need to only move the account information. User bookmarks and the
    Internet home page should also be migrated to make the migration easier.


    # Manual migration


    First, we look at performing this migration manually. The Windows version of Firefox
    can import custom data such as bookmarks and the home page from Internet Explorer,
    which the Linux cannot. Thus, on the Windows machine, we install Firefox and launch
    it to start Firefox''s feature. Next, we enable Windows sharing if it is not already
    enabled and share out the My Documents and Desktop directories. We also share
    Firefox''s settings directory, which is a subdirectory in the user''s Application
    Data directory, in the Mozilla folder. The full path to this directory on our
    machine is:


    ```

    C:\Documents and Settings\AUSRES06\Application Data\nMozillaFirefox\xyjib4ms.default

    ```


    As the last step on the Windows machine, we launch Microsoft Outlook and ensure
    that all e-mail is stored on the server. If there are any local folders, we create
    a new folder on the server and copy the mail onto the server.


    On the Linux client, we use Nautilus to connect to the Windows shares. We copy
    the contents of the My Documents directory into a directory named Documents in
    the user''s home directory. We then copy all of the data files (but not shortcuts)
    from the old Desktop share onto the user''s desktop. Next, we launch Firefox to
    initialize a new profile. Then, we find the new profile directory, which is in
    the user''s home directory, in .mozilla folder. The full path on our machine is:


    ```

    /home/ITSAUSNT+AUSRES06/.mozilla/firefox/xdch2a44.default

    ```


    Now we copy all the files from the old profile share on the Windows machine into
    this folder, overwriting all files that are currently there. Finally, we launch
    Evolution and add a new account to the Exchange Server.


    # Automated migration


    Because there are several authors using a similar environment, we do not want
    to migrate each desktop manually. Instead, we use Progression Desktop to automate
    the migration. More information about Progression Desktop is found in Appendix
    C, “Automating desktop migration using Versora Progression Desktop'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'on page 277. Because we have more than ten workstations, we decide to use the
    command line interface with a template to make the migration step easier. We also
    write a script to make the migration over two simple steps


    First, we create a template, which contains all of the data we want to migrate
    and save on our network share. Then for the Windows store operation, we use the
    following batch file to install the .NET framework and Progression Desktop and
    store the settings into a Platform Neutral Package (PNP) over network share.


    # Example 8-9 Batch file to install and run Progression Desktop on Windows


    ```

    cmd / c itsont5\data\ProgressionDesktop\Windows\dotnet.exe /q:c:\install /q /1

    cmd / c msiexec /quiet \itsont5\data\ProgressionDesktop\Windows\zf7fg42j.msi

    "C:\Program Files\VirtualProgram\ProgressionDesktopCore." --store

    --file=\:itsont5\data\%userDomain%%username%

    --template=\:itsont5\data\template.xml

    ```


    Next, we create a script for the Linux operation, which temporarily installs Mono
    on the desktop (because Red Hat Desktop does not ship with Mono), and we run Progression
    Desktop to apply the user''s settings from the network share. Finally, the bash
    script cleans up the machine by removing Mono.


    # Example 8-10 Bash script to install and run Progression Desktop on Linux


    ```

    #! /bin/bash

    /shares/data_g/monoinstaller-mono-1.8.2-1-installer.bin \

    --mode unattended --prefix var/tmp/mono --AddMonoToPath 0 \

    /var/tmp/mono/bin/mono/shares/data_g/ProgressionDesktop/Linux/ProgressionDesktopCore.exe
    \\

    --apply --file=/shares/data_g/$USER.pnp --template=/shares/data_g/$ITSOtemplate.xml

    rm -rf /var/tmp/mono

    rm -f ~/Desktop/mono

    ```


    To migrate any machine from Windows to Linux, we need to do is the first batch
    file on the Windows machine, and once it finishes, run the bash script on the
    Linux destination.


    # Customization


    There is an extremely high degree of flexibility in modifying the look and feel
    of desktop Linux. For our client migration scenario, we choose to just modify
    a few settings as a way of demonstrating some possibilities.


    The first thing we did was adjust the default background color and insert the
    ITSO Redbooks image on the background. You can do this by using the background
    settings application for the GNOME Desktop. Another possibility,'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'especially to set this desktop background image as a mandatory value, the use
    of the gcontrol2 with a command syntax as in Example 8-11.


    Example 8-11 Using gcontrol2 to replace the desktop background image for all users


    ```

    # gcontrol2-2 --direct --config-source \

    xml:readwrite:/etc/gconf/gconf.xml.mandatory --type string -- \

    desktop/gnome/background/picture_filename=itso-logo.png

    ```


    Further information about how to change values in the GNOME database can be found
    in "Desktop personalization: GNOME Desktop" on page 317. Specific details about
    using gcontrol2 to make mandatory changes can be found in 7.1.2, "GNOME lockdown
    options" on page 15.


    You can create another nice by inserting another logo for the menu button. By
    default, Red Hat has replaced the GNOME logo with its own custom image. We replaced
    this by editing the following file:


    ```

    /usr/share/pixmaps/redhat-main-menu.png

    ```


    While we rename of this file is set in GConf, we decided to take the easy way
    out and just rename ITSO logo file to redhat-main-menu.png. Of course, it has
