    Performing a migration using the GUI is the simplest approach. However, because
    this approach requires installing Progression Desktop on each machine (either
    off of the CD or a network share), this option does not scale well to large environments.
    This approach is probably best suited for migrations of smaller groups of systems
    (ten to twenty). For larger groups, you should consider the other approaches.


    # Command line (with templates)


    Templates are defined policies, which tell the Progression Desktop engine what
    items are are to be saved from the Windows machine and what items are to be applied
    to the new Linux machine. Templates are used as part of an automated migration
    processes without having to step through the Progression user interface each time
    you want to perform a migration on a specific machine. Templates are simple XML
    files, which can be created by editing the default templates provided, or by capturing
    a temporary template that is created during a migration with the GUI.


    Once the template has been created, a simple batch file or shell script can create,
    which installs Progression Desktop automatically and then runs it'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'the specified template. This process can then be run with a single command
    on each workstation or run using a logon script, as your environment allows. This
    option is probably best suited for migrations of up to forty systems.


    # Systems management tool


    It is possible to manage the migration of large environments through the use of
    third-party systems management tools. Migrations managed by a systems tool use
    the same command line approach discussed in the previous section. The systems
    management tool needs to be configured to automatically install and run Progression
    Desktop on both the source and destination machines. For information regarding
    IBM Tivoli Provisioning Manager, see the IBM Redbook Provisioning On Demand Introducing
    IBM Tivoli Intelligent ThinkDynamic Orchestrator, SG24-8888, available at:


    ```

    http://www.redbooks.ibm.com/abstracts/sg246888.html?Open

    ```


    For information about how to set up a customized workflow which to run Progression
    Desktop or other custom jobs with Tivoli Provisioning Manager, see the IBM Redbook
    Developing Workflows and Automation Packages for IBM Tivoli Intelligent ThinkDynamic
    Orchestrator, SG24-6057, available at:


    ```

    http://www.redbooks.ibm.com/abstracts/sg246057.html?Open

    ```


    The general steps of configuring a systems management tool to trigger a migration
    process are similar on most platforms:


    +   1. Create a template.

    nThe first step in a migration is to create a template; for larger migrations,
    you might choose to have different templates for different Neutral Package.

    2. Create the Platform Neutral Package.

    You create a job, which automates the installation of Progression Desktop, runs
    it using the specified template, and then copies the Platform Neutral Package
    (PNP) to a network server.

    3. Apply the Platform Neutral Package.

    The apply job would be similar, where the systems management tool copies the PNP
    from the server, installs Progression Desktop, and then runs the apply process
    using the same template.


    If your systems management tool allows for multiple machines to the same job,
    you could schedule the job to start as soon as the store finishes. If you are
    planning on reusing hardware (an "in-place" migration), some systems management
    tools can even be used to install the Linux system in the store and apply phases,
    leading to a complete automated'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'migration and installation with the click of a button. Because this option
    requires the most setup before migrating, it is best suited for migrations of
    more than forty machines.


    # Progression Desktop architecture


    Some of the benefits to developing on Linux are the wide variety of higher-level
    languages available on the Linux platform. When developing for Progression Desktop,
    the majority of the engine code needed to be portable between the Windows and
    Linux versions. When looking for a high-level language that was equally supported
    on Windows and Linux, that provided robust run-time services, such as the Windows
    registry or GNOME GConf, the development environment that made the most sense
    to use was Microsoft Visual C# (pronounced "C sharp"). While first was created
    by Microsoft as a competitor to Java, the Mono project implemented the language
    and run time to provide a Linux compatible implementation as well. However, because
    a native user interface for all platforms was, a c#-based GUI program was not
    suitable for KDE-based desktops at the time of this writing. The Linux GUI uses
    another-level, flexible language; Python. Python was chosen in addition to its
    object-oriented nature and dynamic run-time flexibility, the PyGT and Qt libraries
    for developing graphical applications are quite mature. By creating Python base
    classes for each step and deriving a GTK and Qt version from those classes, Progression
    Desktop manages to provide a native look-and-feel in its Linux GUIs with only
    a minimal amount of duplicated code.


    One of the major design goals of Progression Desktop was extensibility. With many
    unique choices of applications in both Windows and Linux for each of the common
    and targeted migration data sets, Progression Desktop needed to be able to migrate
    to several different configurations. For instance, a user who had been running
    Microsoft Outlook might want to migrate to Evolution, while another user might
    migrate from Mozilla Mail to Thunderbird. In order to achieve this goal and be
    able to run on both Windows and Linux, Progression Desktop utilizes a plug-in-based
    architecture and XML data files running on the .NET platform. The three main technologies
    developed for this are the PNP file format, the Settings Packages, and the plug-ins
    as Transforms and Accessories.


    # PNP Files


    Progression Desktop stores extracted settings in a Platform Neutral Package, or
    PNP. PNP files are a standard Zip file, which can be opened with your favorite
    Zip editor, such as FileRoller, Ark, or WinZip. Figure C-4 on page 285 shows


    284 Linux Client Migration Cookbook, Version 2'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'an example PNP file open in FileRoller. Inside the Zip file are XML files describing
    the PNP, your previous environment, and the settings that were stored. Stored
    settings are grouped by category, with each application being a root level node
    in the XML file. The PNP also contains subfolders, which are either files that
    are referenced by a setting, or files that were explicitly selected by the user
    storing.


    ![](img/23b949da14ff7bab8762f0f0361af394_312_0.png)


    Figure-4 An example PNP file open in FileRoller


    # # Settings Packages


    Settings Desktop is extended to support additional applications through Settings
    Packages. A Settings Package is an XML file that describes an application and
    its settings. Settings Packages provide a flexible data definition format that
    can be used to migrate anything from custom-in applications to well known third-party
    applications. Versora-maintained Settings Packages are bundled into a single DLL
    in the root folder, but additional settings packages might be added in the “SettingsPackages”
    subfolder. This gives the user the ability to easily extend their own migration
    without having to contract out to Versora for new application support. Settings
    Packages include information that tells


    Appendix C. Automating desktop migration using Versora Progression Desktop 285'
  merge: -1
