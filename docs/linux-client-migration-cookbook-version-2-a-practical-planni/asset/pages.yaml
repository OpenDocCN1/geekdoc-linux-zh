    | OpenOffice.org | http://graphics.openoffice.org/svg/svg.htm |


    # Themes


    Images and logos are part of the bigger topic of themes. The standard choices
    the Linux distributors or desktop projects make (for example, Novell Linux Desktop''s
    Industrial, Red Hat''s BlueCurve, or KDE''s Plast theme) are quite reasonable
    and most users are comfortable with them.


    Designing a new theme from scratch is probably not worth the effort and could
    be confusing to users reading standard documentation from the Linux distributors.
    If you feel the need to design a corporate theme yourself, first visit the following
    Web site to check if a theme that meets your needs is already designed and available:


    +   * http://themes.freshmeat.net

    * http://www.customize.org

    * http://www.kde-look.org

    * http://art.gnome.org

    * http://www.crystalgnome.org


    Even when you decide to use a standard theme, you can make a lot of small changes
    to refine the look even further.


    Some applications include their own theme engines, such as Mozilla-based projects
    or OpenOffice.org. Also, when running a GNOME-based application on a KDE desktop,
    the GNOME-based application will use the selected GNOME theme, which might not
    look appropriate (Figure 4-1 on page 81). When choosing a theme, you might wish
    to choose one which has variants for all the applications you wish to use. For
    instance, Red Hat''s default BlueCurve theme is available for both KDE and GNOME.
    Also, there is a Firefox theme which matches Novell Linux Desktop''s default Industrial
    theme.'
  merge: -1
