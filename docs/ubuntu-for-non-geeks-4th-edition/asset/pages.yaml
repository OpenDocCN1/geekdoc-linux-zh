    # Creating and Deleting partitions


    You can create new partitions if you only have “free space” to put them in. This
    free space is in the sense that there’s not already a partition on part of the
    disk, not that there are no files there. One way of creating free space is to
    delete an existing partition; to do this, click the list item for the partition,
    and click **Delete**. After a few seconds it’ll change into free space in the
    list (Figure C-2). Alternatively, if you’re planning to completely change your
    partition setup, select the hard you want to modify, and click **New Partition
    Table**. You’ll be left with a completely blank slate, where all you need to do
    is add partitions.


    Select free space, and click **Add** to put a new partition in it. You''ll be
    presented with a Create new partition window (Figure C-3), which will ask how
    big you want to make the partition in megabytes (1GB is roughly 1000.0MB). See
    “Varieties of Partitions” on page 416 for advice on how big to make your partitions.


    The use as option lets you specify the filesystem you want to use. A *filesystem*
    tells your operating system how to store files on the partition. There are a number
    of different filesystems that you can choose, but not all of them can be understood
    by Windows and Mac OS. Ext4 is the best for a partition that will be solely used
    by Linux, but FAT32 is the one you need if you want to share files with Windows
    or Mac OS.


    414 Appendix C'
