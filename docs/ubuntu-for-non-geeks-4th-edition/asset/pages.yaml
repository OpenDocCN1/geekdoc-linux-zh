  md: '# Software Installation Problems


    Ubuntu''s software management tools tend to operate pretty smoothly these days.
    Nevertheless, I''ve included some troubleshooting tips for two or three problems
    that used to be common (but seem to be getting rarer with each release). If you''re
    having a problem with installing, removing, or updating packages, this section
    is for you.


    # I Get an Error About Unauthenticated Packages


    If you get an error message about unauthenticated packages when you try to install
    a program, try the following:


    +   1. Select System ► Administration ► Update Manager to open the Update Manager.

    2. Click the Check button, and enter your password if prompted. The package list
    will be updated, along with all the files that are used to check whether your
    packages are “”.

    3. When it has finished updating the package list, close the Update Manager, and
    try to install your program again.


    If you''re still getting the error message, you may have added a software repository
    without adding its GPG key. The GPG key is required to do the authentication staff
    that the error message is talking about. If this is the case, look at “Adding
    Extra Software Repositories” on page 86 for instructions on how to add the GPG
    key for a repository.


    # I Get a dpkg error


    There are couple reasons why you might get an error message related to dpkg when
    you try to install, update, or remove a software package.

    If you get an error saying E: Sub-process /usr/bin/dpkg returned an error code
    (1), you could have a broken package on your system. Here are some techniques
    you can try to fix a broken package:


    +   1. Select Application ► Accessories ► Terminal to open a Terminal.

    2. Type sudo apt-get install --fix-broken, and press ENTER. Type your password
    when prompted, and press ENTER again. This command looks for broken packages and
    tries to fix them.

    3. With any luck, this will fix the problem; try installing a package via the
    Ubuntu Software Center to see whether you will get the dpkg error message.

    4. If you do get the error message, type sudo dpkg --configure into the Terminal,
    and press ENTER. This command tries to fix half-installed packages if there are
    any.

    5. Try installing a package from the Ubuntu Software Center again. If you''re
    still getting an error message, ask for help on the Ubuntu forums.'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'If you get an error message saying E: Could not lock /var/lib/dpkg/lock - open
    (11: Resource temporarily unavailable) or E: Unable to lock the administration
    directory (/var/lib/dpkg/), you are probably running more than one package manager
    (APT frontend) at the same time (see the note at the end of Chapter 6). For example,
    if you are installing a package using the apt-get command in a Terminal while
    simultaneously trying to install a program with the Ubuntu Software Center, you
    will get this error.


    Wait until one of the package managers finishes what it''s doing, and then close
    it and try to use the other one again. If no other package managers are running,
    you won''t get this error message. If you don''t have any other package managers
    running, the Update Manager could be running in the background and causing the
    problem. Wait for a few minutes for the Update Manager to finish what it''s doing
    and then try again.


    # I Have a Broken Update


    If you update your computer using Update Manager but receive an error message
    saying that you have a broken update, try the instructions in "Get a dpkg Error"
    on page 399 to try and fix the problem. If it doesn''t work, try asking on the
    Ubuntu forums for help—there may be a bug in the package that was being updated
    when the error occurred.


    # Common Problems with Applications


    Many applications are available for Ubuntu that it would be impossible to go through
    each one and point out what might possibly, some day, wrong. Instead, in this
    section I''ve chosen to provide some general advice on how to deal with misbehaving
    programs, plus a little attention to particularly common Firefox problem. If it
    is something specific that you need to handle, it''s never a bad idea to try looking
    at the help files for a given program. Select Help > Contents should get you to
    a manual for most software. Failing that, a Google search often does the trick
    for them.


    # Firefox Says It''s Already Running


    When you exit Firefox, it takes a while to close itself down properly—the window
    will disappear, but Firefox could still be running somewhere in the murky depths
    of your computer. When you try to open Firefox again, you may receive a message
    that Firefox is running in the background, so open a new window. This is no good,
    because you want a Firefox window that you can see! If this happens, open a Terminal
    (Applications > Terminal), killall firefox, and then press ENTER.(The command
    is sensitive, so be sure you''re typing in all lowercase). This will force Firefox
    to shut down immediately. With done, try to open Firefox again, and the window
    should show up as normal. If it still isn''t working, try repeating the previous
    command one or two more times.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# A Program Always Crashes


    If you have a program that keeps crashing, try running it in a Terminal to see
    what''s going wrong. You''ll have to get the name of the command needed to run
    the program first—see "Reporting a Bug" on page 359 for information on how you
    can find it. Once you have the command, type it into the Terminal, and press ENTER.
    The program should run as normal, so keep it until it crashes. When it does, look
    at the Terminal to see whether there any clues as what''s going wrong there. Error
    messages in the Terminal can be quite cryptic, so you might like to ask someone
    on the forums or IRC (both of which are discussed in Chapter 20) if they know
    what it means.


    If the messages in the Terminal are no help, you should report a bug.

    "Bugs, Bugs, Glorious Bugs" on page 358 for details.


    # A Program Won''t Start


    If a program doesn''t start when you click your shortcut in the Applications menu,
    running it in the Terminal, as described in the previous section. It could be
    crashing soon after starting and might leave some information about the crash
    in the Terminal.


    # My Computer Is Running Slowly


    Certain tasks take up lots of computing power and can cause your computer to run
    slowly. Burning a CD, installing software, and converting music files to a different
    format all tend to strain your system, so you shouldn''t be surprised if things
    feel a little sluggish when something like that is running. But what if your computer
    is running slowly even if you''re not running anything intensive? You can investigate
    the cause of the slowdown by selecting **System Monitor** to open the System Monitor.
    Select the Resources tab, and check your CPU (processor) usage—if it''s over 100
    percent, then a program running in the background is probably responsible for
    the problem (for example, the one in Figure 21-14). Choose the Processes tab,
    and click the % CPU column heading a couple of times until it has an "up" arrow
    next to it. This will show the list of programs in order of how much of the processor
    they are using. The one that''s using all of the CPU should appear at the top
    of the list.


    It''s normal to wait a few minutes and see whether the program reduces its CPU
    usage by itself. After all, it could be some software running a scan or other
    maintenance operation. If it doesn''t go away, the program might have gotten stuck,
    select it and click **End Process** to close it. Your system should return to
    its usual speed within a few seconds.


    If you didn''t notice high CPU usage on the Resources tab, then it''s possible
    that something is overusing your hard disk index. Programs that do almost always
    finish what they''re doing within five or ten minutes, you should probably ride
    it out. If it persists, the easiest way of fixing the problem is by restarting
    the computer.'
