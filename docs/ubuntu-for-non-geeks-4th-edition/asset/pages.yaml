    # # Backing Up Your Files


    You''ve worked hard to accumulate all of your files. Hours of typing, hundreds
    of photos, piles of music CDs—it’s all there on the hard disk. So, what happens-
    pens to it if something goes wrong with your computer? In many cases the answer
    is, unfortunately, all of the data is lost. To save you the pain of this experience,
    it’s a great idea to make regular backups.


    Plenty of backup utilities are available, *Deja Dup* stands out to me as being
    the easiest to use. Open the Ubuntu Software Center, and install the *Deja Dup
    Backup Utility*. It''ll put itself in the **System Tools** section of the **Applications**
    menu, so head there and start up.


    116 Chapter 7'
  merge: -1
  pgno: 152
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_153_0.png)


    Figure 7-21: Choosing where to save the backup files in Déjà Dup


    **NOTE** If you want to put your backup files on a CD or DVD, you''ll have to
    save them to a folder somewhere first and copy that folder onto a disc using the
    burning software mentioned earlier this chapter.


    **Hit Forward**, and you will be presented with the screen in Figure 7-22. Your
    first task is to decide what you want to back up, so check the list labeled *Include
    files in folders*, which should have only your *Home* folder in it the moment.
    This is a pretty sensible choice for most people, since absolutely of your files
    should be in your *Home* folder. You can add and remove other items as you please
    using the buttons to the right of the list.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_153_1.png)


    Figure 7-22: Selecting which files you want to backup


    There''s another list on that screen, *Except files in folders*. You can use this
    to define any files or folders that you *don''t* want to back up. Say, for example,
    that you wanted to back up everything in your *Home* folder except for your pictures—maybe
    you don''t have space on your backup disk for all of them. You''ll need to do
    is make sure that your *Home* folder is in the *Include files in folders* list
    and your *Pictures* folder is in the *Except files* list.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'When you''ve chosen what to keep and what to ignore, click Forward again to
    get to the summary page. Check that everything looks hunkory, and click Backup
    to start the backup. If you chose to encrypt your backup, you''ll be asked to
    type a password, so do this and click Continue.

    Make sure you keep that password safe; otherwise, you won''t be able to recover
    your backed-up files at a later date! A flurry of copying will ensure and may
    last for some time if you have lots of files to back up. Once that''s finished,
    click Close, and safely recover your backup disk (or whatever you have instead).


    That should be . . . for now. Remember, there''s little in backing up if you don''t
    do it regularly, since you''ll only be able to recover older files (and not more
    recent ones) if something goes wrong. I made a backup about once a month, but
    I would probably do it more regularly than that. It''s not much of a chore; when
    you use Déjà Dup, you''ll remember all of your settings from the previous backup.
    If you want to do something different, click Edit Preferences in the main window,
    and change the options there. You''ll find options for automatically backing up
    as well; check the Automatically backup on a regular schedule setting in the Preferences
    window, and then choose how often you''d like the backup to happen. click Close,
    and Déjà Dup should take care of the rest.


    NOTE Canical, the company behind Ubuntu, now offers an online backup service called
    Ubuntu. Take a look at https://one.ubuntu.com/ for more information on that.


    # Recovering from a Backup


    Ideally you''ll never have to recover your backup, but if you do, here''s a quick
    guide:


    +   1. Find your backup disk, hook it up to the computer, and start Déjà Dup.

    2. Select Edit Preferences, and make sure that the disk is selected as the Backup
    location. Click Close to get back to the main screen.

    3. Click Restore, and enter the password you chose for the backup if you encrypted
    it.

    4. You''ll be asked to choose which backup you want to restore. Choose the one
    that looks right (normally the most recent one), and click Forward.

    5. If you want the files to be back exactly where they came from, choose the Restore
    files to original locations. Otherwise, you can choose a folder to restore them.
    Click Forward again.

    6. Glance over the summary to make sure everything looks OK, and click Apply to
    restore your files. There''s a chance you might have to reenter your encryption
    password, so go ahead and do so if asked.

    7. Click Once the restoration has finished, and check that the files have been
    put back correctly.


    Everything should have returned to normal now. Phew!'
  merge: -1
