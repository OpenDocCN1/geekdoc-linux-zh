  md: '# 18


    # PENGUINS AT THE GATES

    Working with Ubuntu in a Windows World


    ![](img/35405f17cef8b43ddf1af3fc22de194c_359_0.png)


    Despite the rapidly growing popularity of Linux, it’s still very much a Windows
    world.

    If you’re anything like me, you’ll often find yourself working with people who
    use Windows, so it’s important to know how to make Ubuntu happily coexist with
    Microsoft’s ubiquitous OS. Frequently,


    Linux is just the most accommodating operating system available and has no problems
    sharing files, reading Windows disks, and so forth. In fact, your Ubuntu programs
    properly support a wider range of file formats than their Windows equivalents;
    on more than one occasion I’ve tried to open a file in Windows, failed, and then
    booted into Ubuntu where I could open it effortlessly.

    Of course, sharing files with others may not be your only Windows-related worry,
    especially if you’re a dual-booter. Plenty of people decide to run both Windows
    and Linux on their computer, so it pays to know how to minimize the bureaucracy
    involved in switching between the two. If you kept Windows for the sole purpose
    of running a specific application and can’t find a Linux-compatible equivalent
    to it, perhaps you can save the effort of dualbooting altogether and simply install
    the program directly onto Ubuntu. I told you Linux was accommodating . . . it’ll
    even adopt Windows programs as its own!'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'Over the course of this chapter, you''ll learn how to make the most of your
    double operating system setup: You''ll install Windows fonts, install some Windows
    programs, and share files on a Windows network. And if that isn''t quite enough
    for you, you''ll even see how to run Windows (in a window!) in Ubuntu. You might
    want to sit in a dark room for this—if you''re not tired of windows already, you
    will be by the end of the chapter!


    # Project 18A: Accessing Files on Your Windows Partition (for Dual-Booters)


    If you decided to dual-boot with Windows when you installed Ubuntu, you''ll have
    a partition lurking somewhere on your hard disk filled with your Windows files
    and programs (Chapter 2 if you need a refresher on how partitions work). You can
    access files on Windows by mounting the partition from Ubuntu. When you mount
    a partition, the files are made available to you through Nautilus (and other programs)—mounting
    is Linux''s way of recognizing a partition and preparing it for use.


    # 18A-1: Mounting Your Windows Partition


    Your Windows partition in Linux used to be a bit of a chore, but that isn''t the
    case anymore (at least not in Ubuntu). All you have to do is open a Nautilus window
    and click the Windows partition in the side pane.


    You will likely find at least two hard disk icons in the side pane, so it is possible
    that you won''t be sure which one your Windows partition actually is. Just remember
    that your Linux partition is represented by the hard disk icon named File System.
    Things aren''t simple for the Windows partition, unfortunately. It could be labeled
    OS (as shown in the side pane in Figure 18-1) or with the size of the partition
    followed by the word Media (for example, your Windows partition might appear as
    *80GB Media* in the left pane). Or, it might be something else entirely. Guess—it
    won''t hurt if you get it wrong.


    Now that you know which disk icon is, it''s time to get mounting! Just click the
    icon for the Windows partition in the Nautilus side pane. An Authenticate window
    may appear; type your Ubuntu password, and click the **Authenticate** button if
    it does. A new window showing the contents of your Windows partition will appear.


    > NOTE If you hibernated rather than quit Windows, you will most likely receive
    a "Cannot mount volume. You are not privileged to mount this volume." message
    when trying to mount your Windows partition. Some hibernated partitions cannot
    be safely read-write mounted in Linux, because adding new files while Windows
    is hibernated could seriously confuse it when it starts up again. To get full
    access to the drive, be sure to shut Windows down rather than hibernating.


    324 Chapter 18'
  merge: -1
  pgno: 360
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_361_0.png)


    # 18A-2: Unmounting Your Windows Partition


    You can mount your Windows partition immediately after finishing your work with
    it, or you can wait until you shut down your system, whereupon it will be automatically
    unmounted. Before you unmount it, you must first make sure that none of your programs
    are accessing files or folders on the partition. Nautilus and the Terminal are
    the usual suspects, so before unmounting, close any Nautilus or Terminal windows
    that are browsing that partition. Once you''ve done that, click the eject icon
    next to the Windows partition in the side pane of a Nautilus window (Figure 18-2),
    or right-click and select Unmount.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_361_1.png)


    # Accessing a Linux Partition While Running Windows


    Viewing your Windows files in Ubuntu is just too stressful, as you have no doubt
    found out. But what about going the other way and getting Windows to recognize
    your Linux partition? Unfortunately, Windows isn''t too helpful in this respect—it
    can only view FAT or NTFS-format partitions and Windows has no built-in support
    for the ext format normally used by Linux. As such, if you need to access to your
    Linux files in Windows, it''s probably easiest to create a FAT partition to be
    shared between both operating systems (see Appendix C). Hmm, not exactly convenient.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'An alternative is to add support for Linux partitions into Windows by installing
    some extra software. Unfortunately, the state of such software is pretty dry:
    Support for the old-fashioned ext2 format is pretty good, Ubuntu uses ext4 nowadays,
    which is a different beast entirely. As far as I can tell, the best that people
    have managed to do is get an ext4 partition in Windows in read-only mode. Although
    you won''t be able to add new files to the partition, at least you''ll be able
    to see what''s there and copy them into Windows. See http://www.soluwa.com/read-browse-explore-ext2-ext3-ext4-partition-filesystem-from-windows-7/
    for an example of how you can do this.


