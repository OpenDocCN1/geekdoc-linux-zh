  md: '# Knowing Your Limits


    Assuming you downloaded and installed the recommended audio codecs mentioned in
    Chapter 14, you shouldn''t encounter any problems handling music or podcasts on
    your digital media device in Ubuntu. Even if you didn''t install them, Ubuntu
    automatically help you find the necessary items if you try to play a file it doesn''t
    support out of the box. Nevertheless, not all formats will work with equal degrees
    of comfort or success—it depends on your device and the file format''s compatibility
    with Ubuntu. As a general rule of thumb, most players will be able to handle MP3
    files and unlocked AAC (.m4a) files. Check your device''s manual for specifics
    about other formats (or give them a try).


    As as Ubuntu goes, it can work with all the file formats mentioned with the exception
    of locked AAC files, but you will learn how to deal with this later in the chapter.


    Although working with your digital media devices in Ubuntu has become increasingly
    simple, it is still a relatively new procedure. It is always worth approaching
    things with a bit of caution by making sure to have backups of files on your device
    before working with it Ubuntu.


    # Mounting and Ejecting Your iPod or iPhone


    Working with your iPod or iPhone is an extremely simple process. Basically, plug
    it in via a USB connector, and Ubuntu will mount the device so you can access
    it. An icon for your device will then appear on the desktop (Figure 15-1) and
    in the left pane of any Nautilus window you happen to have. Two of those what-do-you-want-me-to-do-with-this-stuff
    type of windows that appear when you insert a music CD or DVD into your drive
    or connect a digital camera to your machine via USB cable—one for the music and
    podcasts on your device and one for the photos (also shown in Figure 15-1)—will
    also appear, usually directly above the other. By default, Ubuntu will point you
    to Rhythmbox for music-handling chores and to F-Spot for photo handling, both
    of which will be discussed later in the chapter. Click OK in each window to accept
    Ubuntu''s choices.


    To "ject" your iPod or iPhone, either right-click the desktop icon for the device
    and select Eject or from a Nautilus window, click the eject button next to the
    icon for your device in the side pane of the window.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_315_0.png)


    Figure 15-1: Ubuntu instantly recognizes your iPod or iPhone.


    # # (Not) Auto-updating Your iPod or iPhone


    With the simple instructions as to how to use your iPod or iPhone with Ubuntu
    out of the way, it''s worth thinking about a couple of other things. Most important
    of these is the device''s auto-updating settings. When you enable auto-update
    on your iPod or iPhone via iTunes, the function is set up within the device itself.
    You can use your iPod in Windows, Mac OS, or Linux—or all of them interchangeably.
    If you set up your iPod to auto-update songs and playlists, however, you are leaving
    yourself open for trouble unless you have exactly the same music collection on
    all of your machines.


    Plugging'' In the Penguin 279'
