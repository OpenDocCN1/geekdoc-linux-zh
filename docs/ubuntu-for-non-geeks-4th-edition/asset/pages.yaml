  md: '# Installing Windows Inside Ubuntu


    One of the weirder things you can do with a computer is to run a simulation of
    a computer inside it. This simulation, known as virtual machine (VM) software,
    allows you to install one operating system inside another, so you can run both
    at once without having to reboot. This is handy if you need to run Windows for
    some reason, perhaps for some specialized software, or you are too comfortable
    working in Ubuntu to contemplate going through the somewhat time-consuming rebooting
    procedure that dual-booters must follow to get back Microsoft territory. You can
    even get Windows to sit inside, well, a window, which micro can be opened and
    closed just like any other program.


    There are some caveats. First, the virtual machine has to share your computer''s
    resources with all your other programs, so it can slow things down if you''re
    doing anything computationally strenuous. Second, it doesn''t have the same access
    to your computer''s hardware as the "real" operating system, so you probably won''t
    be able to get Windows working through the virtual machine. Finally, and perhaps
    most awkwardly, you can win-Windows installation CD to be able to put Windows
    into a VM, but most computers only come supplied with a recovery CD, which won''t
    do the trick.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_370_0.png)'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'If you do have an installation CD, getting Windows into a VM doesn’t take much
    more work than getting it onto a real computer:


    +   1. Open the Ubuntu Software Center, and install VirtualBox. Other virtual
    machines are available, but I find this the easiest to use.


    +   2. Select Actions ► System Tools ► Sun VirtualBox to start it up, and click
    New followed by Next.


    +   3. Choose a name and type for your VM. The name is up to you, but the operating
    system should be of Microsoft Windows.


    +   4. Click Next, and choose the amount of memory (system memory, not hard disk
    size) that you’d like to have the VM to access (Figure 18-12). This can be a tough
    decision; on one hand, you need enough memory for the “virtual” operating system
    to be able to run (Windows XP needs at least 128MB, for example), but you want
    to leave enough memory for Ubuntu programs to be able to use it. VirtualBox normally
    suggests something.


    +   5. Click Next again, and Create New hard disk (Figure 18-13). Make sure that
    Boot Hard Disk is checked, and click Next to open the New Virtual Disk window.


    +   6. Run through the Virtual Disk Wizard, clicking Finish when you’re done;
    the defaults should be fine for most of the options, but you might want to choose
    the size of the virtual disk you desire. This will be used as the hard disk of
    the virtual machine and is stored as a file in a hidden folder inside your home
    folder. Again, choose a size that’s big enough to run the OS but small enough
    it doesn’t engulf your entire hard disk.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_371_0.png)


