  md: '# Project 8C: Installing TrueType Fonts


    Your Ubuntu system comes with a wide variety of very usable, and at least my eyes,
    rather handsome TrueType fonts. However, these tend to be a bit on the conservative
    side of the aesthetic spectrum, and many users will want to add a few more distinctive
    fonts to the system repertoire. In my case, I had this really cool idea of writing
    messages to my friend in old Scandinavian (Of course, my friend wet-blanketed
    the idea, so it all came to naught. . .)


    You probably won''t be interested in sending cryptic, run messages to your friends,
    but you may want to print an award for an event using some sort of Gothic font,
    or you might be preparing a newsletter for the local chapter of your breeders
    society and use a font that is round, bubbly, and slimy. Whatever your penchant,
    or desire, you will probably come to the point when you want to install some TrueType
    fonts on your system, so in this project I''ll tell you how to do just.


    How you install fonts depends on who is going to use them. If you use only one
    account on your machine, the easiest way is to install the fonts locally, as described
    in "Project 8C-2: Installing Fonts Locally" on page 144. Locally installed fonts
    are ones that you or someone logged into your account will be able to use. On
    the other hand, if you have more than one user account and want the fonts to be
    available to all the users on your machine, you''ll need to install them globally—in
    this case, "Project 8C-3: Installing TrueType Fonts Globally" on page 145.


    # 8C-1: Getting the Font Files


    The Internet is awash in free fonts. For this project, I will point you to http://www.fontfre.com/,
    which has a very nice collection of fonts. Once you get to the FontFreak home
    page, click the Fonts link on the left-hand side of the page. The next page will
    ask you whether you want to download all the free fonts on the site in one single
    file; click No, I will download them by one. This will lead you to the main list
    of fonts; browse through the various pages until you find the one that is to liking,
    and then click it. Which font you download is completely up to you—the PC version,
    or the Mac version. You can do this by clicking the Windows icon at the bottom
    of the page (next to where it says Download). When the download pops up, choose
    Save File and click OK to save the font as a .zip file. To follow along with this
    project, download a couple of fonts—I chose Ajax Surreal Freak and Accidental
    Presidency.


    When you''ve finished downloading, drag the font files from the Downloads folder
    (or wherever you saved them) to your home folder so it''s easy to follow along
    with my instructions. Also, be sure to unzip your fonts before going on the installation
    steps. (Right-click each .zip file, and choose Extract Here.)'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 8C-2: Installing Fonts Locally


    If you''re the sole user of your computer, installing fonts locally will just
    do fine. To get started, you need to set up your system by providing it with a
    location to place your fonts. You will need to do this only very first time. Here''s
    what you must do:


    +   Open your home folder, and, in that window, create an invisible folder by
    selecting **File ▶ Create Folder.**.

    When the folder appears, name it *.fonts* (the period before the name means that
    it will be hidden).

    Hide the new folder by clicking the **Reload** button. *.fonts folder should no
    longer be visible. If this is the case, you can close the window—your setup was
    successful.


    Now that everything is set, let''s continue with this project using one of the
    fonts you downloaded. After you''ve decided which font to use, follow these steps:


    +   Choose the unzipped font file (its name probably ends in *.ttf), and copy
    it by right-clicking and selecting **Copy**.

    Press CTRL-L, or select **Go ▶ Location**. This will display the location bar
    in Nautilus.

    In the location bar, type “~/.fonts, and press ENTER. The ~ sign is a short-cut
    that means “my home folder.”.

    You should be taken to the empty *.fonts* folder you just created, like the one
    in Figure 8-19. Right-click anywhere in the folder, and select **Paste** to copy
    the font into the folder.


    Now that you have installed your font, you can give it a try in your applications,
    such as OpenOffice Writer. (Any running applications need to be restarted before
    the new font will appear in that application''s menu.)


    ![](img/35405f17cef8b43ddf1af3fc22de194c_180_0.png)'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 8C-3: Installing TrueType Fonts Globally


    As I mentioned earlier, the font you just installed locally can be used only when
    you log in under your usual username. however, you want to install fonts that
    can be used by you and anyone else who has an account on your computer, the process
    is slightly different and will require a little “superuser” action. You can use
    the other font you downloaded for this part of the project.


    The folder for globally installed fonts is in root territory, so you will need
    to open the file browser as superuser in order to install the fonts. Superuser
    is another name for the root (administrative) user. It’s possible to run a program
    without switching to a different user account using a system called sudo (more
    on this in Chapter 9), but since root can modify important system files, you shouldn''t
    run a program in sudo mode unless you absolutely.


    Here are the steps for getting your font file into the global directory:


    +   1. Press Alt-F2, and then type gksudo naut /usr/share/fonts/truetype to the
    box that appears. Click Run, and type your password if prompted.

    2. A File Browser will open. Select File ► Create Folder to create a new folder;
    call it MyFonts.

    3. Open a normal File Browser (Nautilus) window by selecting ► Home, find the
    .ttf font you want to install, and copy it (for example, by right-clicking and
    selecting Copy).

    4. Switch back to the truetype File Browser window, open your newly created MyFonts
    folder, and paste the font into it.

    5. Be sure to close the superuser File Browser window—leaving it open is a recipe
    for disaster!


    > NOTE The gksudo command in Step 1 is the graphical environment version of the
    non-graphical sudo command that you will learn via the command Terminal in Chapter
    9.


    Now you can test things by opening OpenOffice.org and looking for the font in
    the font menu. Remember that you will need to restart OpenOffice.org if it was
    already open when you installed the font.


    # 8D: Changing Your Login Screen


    There’s always a holdout. You may have gotten your desktop and windows looking
    just like the way, but the screen that displayed when you log in hasn''t changed
    one bit—it’s still the same default theme, with the same old default background.
    It’s time to give it a makeover.


    The login screen, also known as the greeter, is shown to everyone who has a user
    account on your computer, so you may want to check others before making some of
    the following cosmetic changes. If you’re the only person who uses the computer,
    then ask yourself for permission and carry on.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 8D-1: Beautifying the Login Screen


    The software that displays the login screen is GDM, and it has its own hidden
    user account on your computer. This might seem a little strange, but this is the
    way of Linux programs do when they are shared between several users. What you
    need to do now is log in to this hidden user account and change the settings for
    GDM. Fortunately, it''s a pretty straightforward process and doesn''t even require
    you to log out of your account:


    +   Press ALT-F2 to open the Run Application window.

    Type gku -u gdm dbus-launch gnome-appearance-properties into the box, as shown
    in Figure 8-20.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_182_0.png)


    Figure 8-20:Typing the command into the Run Application window


    +   Click Run. You''ll be asked for your password, so type it, and click OK.


    > NOTE Some extra icons might appear on your panel when you perform this step.
    Don''t worry, they''re harmless and will disappear when you log out and log back
    in.


    +   The Appearance Preferences window should appear. This Appearance Preferences
    window works the same way as the one you used earlier in this chapter.


    +   Use the Background tab to change the wallpaper behind the login screen and
    the Theme tab to change how the login window looks.


    +   When you''re happy with your changes, click Close, and log out of your user
    account to get back to the login screen and inspect your changes.


    Take a look at Figure 8-21 to see what you can do. I changed the background to
    a delicious-looking picture of cherries and the login window to the brownie-orange
    Human theme, for a slightly more rural feel.'
  merge: -1
