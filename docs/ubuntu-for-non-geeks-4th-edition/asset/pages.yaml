    # Project 17B: Installing a Java-Based Game: Schnapsen


    As you can see from all the games discussed thus far in this chapter, the Ubuntu
    Software Center is a great one-stop shop for most Linux games. As you have also
    learned, there are also many games beyond those in the Ubuntu Software Center.
    These include the games you worked with in Chapter 9 that were written in scripting
    languages, as the Python-based PyWings and the Tcl/Tk-based Briscola, but it just
    wouldn''t be right to leave games written in what might be considered the mother
    of all scripting languages—Java. In this project, you will learn how to install
    the Java Runtime Environment and run the Java-based version of a classic Austrian
    game: Schnapsen.


    # 17B-1: Installing the Java Runtime Environment


    To run Java-based applications, or scripts, you need to first install the Java
    Runtime Environment. You can do this via the Ubuntu Software Center by searching
    and installing openjdk java 6 runtime. The whole set of packages is pretty hefty
    in terms of download weight, so don''t get freaked out if it seems to take longer
    than usual. When the process is complete, close the Ubuntu Software Center, and
    move on to the next part of the project.


    16 Chapter 2'
