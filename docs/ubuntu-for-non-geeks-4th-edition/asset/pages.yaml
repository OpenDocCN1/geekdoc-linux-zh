  md: '# 11


    # POLYGLOT PENGUINS


    Linux Speaks Your Language


    ![](img/35405f17cef8b43ddf1af3fc22de194c_247_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux as well.


    Just open your web browser and, without performing any special installations,
    you can read pages in any European language, including those with Cyrillic alphabets,
    such as Russian. You can even view pages in Chinese, Japanese, Thai, Arabic, and
    Hebrew, to name a few.


    But the multilingual capabilities of Linux are much greater than this, and the
    way that it handles multilingual matters makes it quite easy to take advantage
    of these capabilities. As you will soon see, you can even set up your system to
    give you a totally foreign language environment, allowing you to'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'function completely in the language of your choice. Add to the ever-expanding
    number of free programs available for language study, and you have a truly meaningful
    language-learning tool.


    # Read-Only Support


    If all you want is be able to read web pages or documents in a foreign language,
    you don''t need to install any additional language support except in some rare
    cases. From the get-go, you will be able to view documents in just about any language
    you happen to throw at your system—it doesn''t matter if it''s Swedish, Italian,
    Chinese, Arabic, Hebrew, Russian, Vietnamese, Armenian, or Thai. You will be able
    to read whatever you are lingu (see Figure 11-1 for an example).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_248_0.png)


    Figure 11-1: A Japanese web page displayed in Firefox


    Firefox automatically recognizes the language in a web page is written and displays
    the page correctly. Sometimes, however the author of the page may neglect to include
    the character coding for page in the HTML, in which case Firefox, not knowing
    that the page is prepared in another language, will very often open it in the
    default language of your system. The result is a page in which you see nothing
    but odd combinations of symbols and letters that have no meaning. In this case,
    changing the character coding in Firefox to the language you believe the page
    to be in. Some languages employ more than one encoding scheme, so if you''re not
    sure, give it a try. You may choose this by going to the Firefox View menu and
    selecting Character Encoding. From the submenu there, you can select the appropriate
    coding for the language of that page.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Typing Nonstandard Characters


    Typing characters that are not standard in English, such as é, ç, ß, ø, æ, and
    ã can be done quite easily in Linux without any modifications. In most situations,
    you can do this by using the Character Map utility included in your system, which
    can be found at Applications > Accessories Character Map. Upon running Character
    Map, a window like the one in Figure 11-2 will appear.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_249_0.png)


    Figure 11-2: Inputting characters with the Character Map


    To input the character you want, just select the language or click in the left
    pane of the window, and in the right pane, double-click the character you want
    to input. The character will appear in the little box next to the Text to copy
    at the bottom of the window. Just click the Copy button, and paste the character
    wherever you want to place it.


    OpenOffice offers a method of its own that you can use. Click Insert in the menu
    bar, and then select Special Character. A selection window will open, and you
    can select the character you want there. Once you''ve done that, click the OK
    button, and the character will appear in your document, after which the selection
    window will close by itself. Double-clicking the character will also accomplish
    the same thing.


    # Using the Compose Key Option


    If you need to type an accent or umlaut only once in a while and don''t feel particularly
    keen on opening an application or going to a special menu to do so using the compose
    key option for your keyboard is a good way to go. Basically this means you use
    one of the lesser-used keys on your keyboard in conjunction with six symbols ('',
    ''~'', \'',^) to help in the creation, so to speak, of accented characters.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Before you can use this feature, you have to select which key you want to use
    as your compose key. For this example, I''ll use the right ALT key, since most
    people don''t use it much. Here''s what you need to do:


    +   1. Go to the System menu, and select Preferences ▸ Keyboard.

    2. In the Keyboard Preferences window that appears, click the Layouts tab, and
    then click the Options button.

    3. In the Keyboard Layout Options window, click the + button next to the words
    Compose key position.

    4. Check the box next to the key you want to use as your compose key (Figure 11-3).
