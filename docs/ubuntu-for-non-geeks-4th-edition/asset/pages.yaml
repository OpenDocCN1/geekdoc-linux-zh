  md: '# 19


    # # DEFENDING THE NEST


    Security


    ![](img/35405f17cef8b43ddf1af3fc22de194c_375_0.png)


    Many a Windows user has entered the Linux fold after a host of bad experiences
    with malware in the Windows world—viruses, spyware, and all sorts of other malicious
    bits of software code, too numerous to imagine. Windows is also plagued by a seemingly
    endless array of security vulnerabilities, leaving the system easy prey to invaders
    with less than noble intentions. Every trip out into cyberspace becomes something
    like a run through the infectious diseases ward of a hospital. For a Windows user,
    it can sometimes seem that more time is spent ridding the system of viral pests
    and defending it from invaders than is actually getting things done.


    Fortunately, Linux does not suffer greatly from such problems, leading to the
    much-tout claim that Linux is practically virus free and quite secure. Numerous
    lines of reasoning have been proffered to explain Linux''s malware-and exploit-resistant
    nature. One reason is simply popularity—or lack thereof. Because Linux is not
    as widespread as a system as Windows, it is also a much less attractive target
    of digital evil-doers, who very often seen to be motivated'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'by the challenge and headline-catching glory that comes with creating a truly
    global virus or finding a heretofore unknown back door.


    Another reason is that Linux users, as a general rule, work on their computers
    in a nonprivileged mode, in which the user does not have the right to install
    software without a password. This is not the case in some versions of Windows.
    A virus or other form of malware attached to another file or application cannot,
    therefore, install itself in your Linux system without a password ... well, theoretically,
    at least Of course, now more recent versions of Windows use a privilege structure
    by default, this point is less of an issue.


    There is also the matter of structural design. Every system has security holes
    that can be exploited by digital and human foe. Windows might be the Swiss cheese
    of operating systems in this regard. Of course, Linux has its holes too, far fewer
    than Windows does; and Linux plugs them through downloadable updates faster, once
    they are found.


    Finally, Ubuntu’s preconfigured security policy brings a defense edge—there are
    no open ports in Ubuntu desktop systems. This means your Ubuntu Linux system is
    even less susceptible to unwanted intrusions.


    # Does My System Need Protection?


    So, with all this talk about Linux’s great security, you may wonder whether you
    need to bother about it all. Well, if you take a look at the Ubuntu forums, you
    might find yourself a bit confused. When asked Linux users need to install antivirus
    or firewalls, most users answer with an emphatic no. On the other hand, you’ll
    find an awful lot of people who have installed or are trying to install that software.
    Hmm.


    So, what’s a Linux user to do?


    If you are on a network where you transfer a lot of files among a lot of Windows
    machines, you might want to think about installing some antivirus software, for
    not more than the good of the Windows systems involved and the users of these
    systems—your unenlightened (i.e., Windows-using) email pals, for example. You
    might also want to give it a go if you are, by nature, on the cautious side of
    the spectrum. Basically, if it makes you feel safer to install some protection,
    go ahead. If it makes you safer to go whole-hog and install the full line of defense
    mechanisms I cover in this chapter, go. After either way you go, it isn’t going
    to cost you anything, and it certainly isn’t going to hurt you.


    # The First Line of Defense


    Regardless of the system you happen to be using (though I am assuming that you
    have become a Linux devote by now), the first line of defense for any computer
    permanently hooked up to the Internet is a router—electronic device that allows
    a number of computers to connect to a local network (such as in your home or at
    your office) to connect and share a single connection from your'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'Internet service provider (ISP). While the router is connected to your modem
    via cable, the connection from the router to the computers on your local network
    can be wired, wireless, or both.


    What does a router have to do with the defense of your computer? most routers
    include a firewall, which essentially functions to keep all the bad stuff on the
    Web away from your computer, in the way that the firewall keeps your car heat,
    fumes, and noise out of the passenger compartment. Built-in firewall is one reason
    that even people with only one computer, could just as easily connect their computer
    directly to a DSL modem, use a router. Of course, just how much security the firewall
    in your router provides depends on which filters you select in the firewall setup.
    For example, a very common and useful filter (particularly for those with a wireless
    network) limits Internet access to those machines specified on the firewall''s
    access list. They prevents your door neighbors from hitching a wireless ride via
    your ISP connection. They aren''t paying the bill, after all.


    The setup software for a router is built into router, so you don''t have to worry
    about software installation and system compatibility. Using your router with Linux
    is no different from using it with Windows. You can access the software and modify
    your settings via a web browser, as you can see in Figure 19-1. Just type the
    IP address of the router (usually provided in the router''s manual) in the browser''s
    location bar, press ENTER, and you''ll be ready to go.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_377_0.png)


    Figure 19-1: Setting up a router'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Software Firewalls


    If you don''t have a router and don''t plan on getting one or if you have one
    but are bordering on paranoia, you might want to consider using a software firewall,
    in particular one of the most popular software firewalls available for Linux,
    Firestarter.


    You can get Firestarter via the Ubuntu Software Center by searching for firestarter
    and installing it. Once it is installed, you run it by selecting System > Administration
    > Firestarter (you might be asked for your password). Firestarter starts with
    a self-explanatory setup wizard the first time. Just read each screen carefully;
    make whatever selection are suggested, if any; click the Forward button in each
    of the screens until you get to the last one (shown in Figure 19-2). On that screen,
    make sure the box to Start firewall now is checked, and then click the Save button.
    The wizard will close, and the main Firestarter window will appear. Assuming the
    correct network device was detected and selected and the correct wizard choice
    made, the firewall will be up and running.


