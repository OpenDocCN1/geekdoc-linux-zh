    are hidden snippets of code that programmers seem to sneak into their programs.
    They are usually pretty useless, but they can be found in all operating systems,
    numerous applications, and even on DVDs (to find out more about those, go http://www.dvastereggs.com/).
    A good example of an Easter egg is my first'
