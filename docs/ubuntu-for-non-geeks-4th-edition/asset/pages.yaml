- img_proc: true
  md: '# Project 5: Installing Firefox Extensions


    The plug-ins I covered earlier are non-essentials that pretty much everyone has
    installed, but hundreds of other, less vital extensions are available for Firefox
    too. These come in the form of add-ons and include all sort of things; many are
    quite functional tools while others are just fun and goofy. They range from blog-writing
    tools to to-do lists to image viewers and travel guides. For this project, however,
    you will install a blog editor called ScribeFire (Figure 5-8) that allows you
    to write entries, log in to your blog, and upload your addition. All of this is
    available at the click of a button or an icon in the bottom-right corner of the
    window.


    NOTE If you don''t have a blog but you''d like to give blogging a try, you can
    sign up for an account on a free hosting website, such as http://www.blogger.com/,
    http:// wordpress.com/, http://www.tumblr.com/, or http://www.livejournal.com/.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_102_0.png)


    66 Chapter 5'
