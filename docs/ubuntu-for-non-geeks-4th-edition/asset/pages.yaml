    # Installing Drivers for Your Network/Wireless Card


    If your network card or wireless card hasn''t been recognized or isn''t working
    as expected, you might need to install some drivers for it. You can try a few
    methods, and the one that works will much depend on the name and model of your
    card. I''ve included two of the most general ones in the following sections, but
    some cards need you to follow very specific instructions to get them working.
    The lists at https://wiki.ubuntu.com/HardwareSupportComponentsWiredNetworkCards/
    (wired cards) and https://help.ubuntu.com/community/WifiDocs/WirelessCardsSupported/
    (wireless cards) should be able to help you figure out which method to use.


    # Check for Restricted Drivers


    Some network/wireless cards have restricted drivers that you can download to get
    your card working. These drivers are normally provided by the manufacturer of
    the card and are "restricted" in the sense that they can be fixed by Ubuntu developers
    if something goes wrong with them (in other words, they''re not open source).


    You need to connect to the Internet to download restricted drivers. If you don''t
    have a working connection (probably because you''re currently in the process of
    trying to get your card working!), try using an Ethernet cable to plug the computer
    directly into your wireless router or cable modem (see Chapter 4 for more information).
    This will work only if you have a functioning wired network card. If your wired
    network card doesn''t work, you won''t be able to follow these instructions.'
