    \ partition size in megabytes. If\nyou change the size and then click OK, you\
    \ will be warned that the changes\nbe written to disk. Click Continue, and the\
    \ partitioner will start to resize the\npartition immediately—you can't undo this\
    \ change, so think carefully\nwhether you've chosen the right options before hitting\
    \ Continue.\n\n![](img/35405f17cef8b43ddf1af3fc22de194c_452_0.png)\n\nFigure C-4:\
    \ Editing a partition\n\n# Varieties of Partitions\n\nYou'll need to be familiar\
    \ with a few varieties of partitions when you manu-\nally partition your disk,\
    \ I've summarized these in the following sections and\nprovided some tips on choosing\
    \ their size, mount points, and filesystems.\n\n# Root Partition\n\nYou must have\
    \ a root partition; it's where important file systems are stored\nand software\
    \ is installed. I recommend making it at least 8GB in size, aim\nfor 10GB to 15GB\
    \ if you can leave room for installing new programs.\nYou're not going to have\
    \ a separate home partition (described in a moment),"
  merge: -1
  pgno: 452
- img_proc: true
  md: 'all of your files will be stored in the root partition too, so you should make
    it as big as possible to accommodate all your stuff in that case. The mount point
    should be set to /and the filesystem to ext4.


    # Swap Partition


    You must have a swap partition. The swap partition is like an extra area of system
    memory (RAM); if your computer''s system memory gets full, it will start using
    this partition to handle the overspill. It is also used to store the contents
    of your system memory (like all of your open files and programs) when you hibernate
    your computer. See https://help.ubuntu.com/community/SwapFaq/for more details
    on swap.


    As rough guide, it should be a little larger than the amount of RAM that your
    computer has. For example, if you have 2GB of RAM, make a 2GB swap partition.
    The filesystem should be set to swap area, and there''s no need to set a mount
    point.


    NOTE It is possible to get away without a swap partition by creating a swap file
    after you''ve installed Ubuntu. The method for doing this is beyond the scope
    of this book.


    # Home Partition


    The /home folder can be put in a separate partition. You don''t need to do this,
    but it''s useful if anything goes wrong and you need to reinstall Ubuntu—all your
    personal files and configuration settings will be left on the home partition while
    Ubuntu is reinstalled on the root partition. This can save a lot of work when
    restoring your system. If you don''t have a separate home partition, the /home
    folder will be put in your root partition with everything else. The way you access
    your home folder (for example, through the Places) will be exactly the same whether
    you put it on a separate partition or not.


    The home partition is where all your files and settings are stored, so you will
    want to make it as big as possible. The filesystem should be set to ext4, and
    the mount point should be set to /home.


    # Windows Partition


    If you have Windows installed for Ubuntu, you will need to resize the Windows
    partition to make room for Ubuntu. When you do this, be sure to leave at least
    enough disk space for Windows to function properly. Windows XP needs a partition
    at least 2GB in size, for Vista and Windows 7 you should leave at least 16GB.
    You will probably want to leave more space than that so you can install programs
    and save files when using Windows, and remember to leave space for your existing
    Windows files too. The Used color in the main partitioning window will tell you
    how much space your Windows files are currently taking.


    Windows partitions will be of type NTFS or FAT32. Remember not to format the Windows
    partition, or your current installation of Windows will be erased.'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Shared Partition


    If you want an easy way to share files between Windows and Ubuntu, create a shared
    partition. In both operating systems, it will appear as a separate hard disk,
    which you can use to store whatever you like.


    Make the partition as big as you think you''ll need: if you only copy small files
    between Ubuntu and Windows, 1GB to 2GB should be plenty; if you want to permanently
    store all your Windows and Ubuntu files in there (sort of a shared folder), make
    it as big as possible. You should choose FAT32 as the filesystem, but you can
    use almost anything for the mount point—/windows will be one of the default suggestions,
    but you could type something like /shared or /blackhole into the Mount point box
    if you liked. Just sure you use a name without any spaces in it.


    # Example Partition Layouts


    Partitioning can be confusing if you''ve never done it before, I''ve provided
    a few example partition layouts that should make things clearer. In all of these
    examples I''ve used a 100GB hard disk, but you can scale all the partition sizes
    up or down for your disk according to the advice in "Varieties of Partitions"
    on page 416.


    # Standard Ubuntu-Only Installation


    Only Ubuntu will be installed on the disk, only the root and swap partitions are
    needed (Figure C-5). Since I have 4GB of RAM, I made the swap partition 4.2GB.
    The root partition filled up the rest of the disk space to give me as much room
    for files and programs as possible (There was no need to partition the disk manually
    in this case; the Ubuntu installer''s Erase and use the entire disk option would
    have achieved the same result.)


    # Ubuntu-Only with a Separate Home Partition


    Only Ubuntu will be installed, but there will be a separate home partition to
    keep my data safe in case I ever need to reinstall (Figure C-6). I''m planning
    to store home movies on this one, which means lots of very large files, so I went
    for a smallish 10GB root partition and a slightly undersized 4GB swap partition.
    This leaves lots more space for the home partition (and my videos), which takes
    up the remaining 86GB of the disk.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_455_0.png)


    Figure C-5: A simple Ubuntu-only partition layout


    ![](img/35405f17cef8b43ddf1af3fc22de194c_455_1.png)


    Figure C-6: The partition layout for Ubuntu with a separate home partition'
