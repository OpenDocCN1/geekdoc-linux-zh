  md: '# 4


    # MORE THAN WEBBED FEET


    Connecting to the Internet


    ![](img/35405f17cef8b43ddf1af3fc22de194c_81_0.png)


    These days, the average home computer user spends more time surfing the Web and
    writing email messages than doing just about anything else. Even if you''re not
    much of a surfer, there are numerous other applications that aren''t all per se
    but that still use the Internet in some way, such as gathering song and album
    information when you rip audio CDs to MP3 files. Having a computer that isn''t
    hooked up to the Internet is like buying a new Maserati and then refusing to take
    it out of the garage.


    Of course, how you connect to the Internet depends on your hardware and provider.
    There are a number of possibilities in this area, including high-speed local area
    networks (LANs), cable modems, mobile (3G) broadband, and ADSL connections from
    phone companies. Some computers have an internal 56Kbps modem or can be connected
    to external dial-up modems for slower connections over regular phone lines. Depending
    on what you have, setting things up on your system should provide a cinch in the
    case of LAN connections and any others that use your Ethernet port (such as'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'cable modems), possibly a bit more work in the case of wireless and mobile
    connections, and sometimes a bit of a challenge when it comes to dial-up connections.
    and in the next chapter you will learn how to set up these connections, and in
    terms of the most commonly used Internet applications. learn about what Linux
    has to offer


    # # How Do You Connect?


    The way you go about setting up your connection really depends on how you''re
    trying to connect to the Internet. Here''s a list to help you decide which method
    to use:


    +   * If you connect your computer to a wall socket, a router, or a cable modem
    by using an Ethernet cable, go to “Setting Up a Wired Connection” on page 46.

    * If you connect to a wireless network or your own wireless router, head to “Setting
    Up a Wireless Connection” on page 49.

    * If you connect using a dial-modem connected to your phone line, the section
    “Setting Up a Dial-mod Connection” on page 53 is the one for you.

    * If you have an ADSL or DSL modem that is built into your computer or connects
    to a USB port, try “Connecting with a DSL or ADSL Modem” on page 52.

    * If you connect using a mobile (3G) broadband connection that plugs into your
    computer, skip to “Mobile (3G) Broadband Connections” on page 55.


    # # Setting Up a Wired Connection


    If you have a high-speed Connection from your cable television company or ISP
    or if you are connected to the Internet by a LAN at your office, you are really
    in luck, because these setups are probably the easiest to deal with. I''m assuming
    that you''ve already set up your router or modem according to your Internet provider''s
    instructions, so that remains is to connect an Ethernet cable between the modem/router
    (or LAN wall socket) and your computer''s network socket. After you''ve done that,
    you should be ready to go without any further settings to fool with.


    # # Checking Your Connection


    If you like, see whether you''re connected by opening Firefox (the Firefox launcher
    in the top panel, right next to the System menu) and then, once it starts up,
    trying to navigate to a common site, such as http://www.yahoo.com/. If the site
    comes up, you''ll know all.


    If you have a problem connecting online and you are trying to connect via a LAN
    or cable modem, you could try to refresh your connection by right-clicking the
    Network Manager icon in the top panel, unchecking the Enable'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Networking box in the pop-up menu, waiting a few seconds, and then checking
    the Enable Networking box in the pop-up menu again. If that doesn''t work, try
    restarting your machine while physically connected to your Internet source with
    the Ethernet cable. If the lack of connectivity persists, it is possible that
    your network card is not supported by Linux. This is relatively rare but, fortunately,
    easily remedied (by replacing it).


    The problem could be that your network or service provider does not assign addresses
    via Dynamic Host Configuration Protocol (DHCP). DHCP is a means by which your
    Internet provider can automatically provide your system with the configuration
    information it needs in order to connect to the Internet. If your provider does
    not use DHCP, you will have to get the necessary information about settings from
    the network administrator or service provider and enter the settings yourself.


    # Setting Up a Cable or Ethernet Connection for Providers Not Using DHCP


    To input your cable or Ethernet settings yourself, first get the settings that
    you need from your network administrator or Internet provider, and then perform
    the following steps:


    +   1. Select System ▸ Preferences ▸ Network Connections.

    2. Choose the Wired tab (Figure 4-1), and select the network connection from the
    list by clicking it once (it should have a name like *eth0*). If there are no
    entries in the list, then your network card hasn''t been properly recognized.
    Take a look at “Installing Drivers for Your Network/Wireless Card” on page 390
    to see how to fix this.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_83_0.png)


    3 Click Edit, and you''ll be presented with a settings window. Choose the IPv4
    Settings tab, and change the Method setting from Automatic (DHCP) to Manual.


    Figure 4-1: The Network Connections window'
  merge: -1
  pgno: 83
- img_proc: true
  md: '+   4. Click the Add button to enter the IP address information for your computer.
    This should have been provided by your ISP or network administrator and will consist
    of an IP address, default gateway, and netmask (see Figure 4-2 for an example).
    Enter the DNS server address that you were given too.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_84_0.png)


    Figure 4-2: Manually inputting network settings


    +   5. Make sure that the Available to all users option is chosen if other users
    of your computer will be using the connection.


    +   6. Click Apply to save the settings. You''ll be asked to enter the password
    for your user account, so do that, and click Authenticate.


    +   7. Network Manager will try to establish the connection using the details
    you provided. If it''s successful, a message will pop up saying that the network
    was connected. If that doesn''t happen, click the Network Manager icon on the
    top panel, and choose Disconnect.


    +   8. Then, click the Network Manager icon again, and select your network underneath
    where it says Available.


    NOTE If you are wondering whether Internet Protocol (IP) and Domain Name Service
    (DNS) are all about, you can simply think of them in this way: DNS translates
    the easy-to-remember URLs that you have to know, such as http://www.google.com/,
    into numerical, or IP, addresses that the Internet can understand. The address
    help: http://www.google.com/ becomes thus /209.85.229.104. You can type the numerical
    version in your browser later to see for yourself.'
