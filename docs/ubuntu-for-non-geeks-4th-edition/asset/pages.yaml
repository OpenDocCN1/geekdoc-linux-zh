    # Sharing Files with Windows Users on Your Network


    One of the main reasons for connecting to a network (apart from accessing the
    Internet) is to share files with computers. You may be familiar with this concept;
    network shares are used in many workplaces, and you may have set up one before
    on your home network. For the uninitiated, a network share is a folder on another
    computer that you can access if it were on your own. Files are transferred around
    the network, so there''s no need to use a portable hard disk or flash drive to
    get them from one place to another.


    # Accessing Files Stored on a Windows Computer


    Network shares are two-way thing: You can share your files with others by creating
    a shared folder or accessing shared folders created by others. If you''re connected
    to a network of Windows computers, then you probably have some network shares
    already. I talked about browsing network shares in some depth in "Using Nautilus
    as a Network Browser" on page 101, but to save the anguish of flipping back so
    many pages, here''s a quick outline of what you need to do to access a share from
    Ubuntu.


    +   1. Select Places › Nautilus will open.

    2. Double-click the Windows Network folder to see a list of all the Windows computers
    connected to the network.

    3. Double-click one of the computers to see its shared folders.

    4. Pick a shared folder, and double-click it to access the files inside it.


    # Making Your Files Accessible from a Windows Computer


    Since your Windows computers have so gladly made their files available on the
    network, let''s have Ubuntu reciprocate by sharing a folder of ours:


    +   1. Open Nautilus and find the folder you want to share; then right-click it,
    and select Share Options.

    2. Check Share this folder in the Folder Sharing window that appears.

    3. You''ll be told that the sharing service is not installed—click Install service,
    and wait for the installation process to finish.

    4. Back in the Sharing window (Figure 18-14), choose a name for the shared folder,
    and type a comment if you like.'
