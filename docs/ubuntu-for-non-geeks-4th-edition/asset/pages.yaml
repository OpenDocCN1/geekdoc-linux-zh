  md: '# # Removing Unwanted Files


    Remember all that talk of keeping a tidy nest at the start of the chapter? Well,
    now it''s time to dust off your spring cleaning gear and give your home folder
    once over.


    The first step is the Trash. Sometimes I''m surprised by how much stuff accumulates
    here; I can go for weeks on end without emptying it. Luckily, this lacks the unpleasant
    odor of its real-world counterpart, so all that stands in your way is a quick
    check to make sure you didn''t accidentally throw anything away. Click the Trash
    icon on the bottom panel, and when the window opens, click Empty Trash to delete
    all the files in there. They will be deleted, with no way of getting them back.


    Next is a little more sophisticated. If you''re running low on hard disk space
    and want to know why (or just to sniff around your files), select Applications
    > Accessories > Disk Usage Analyzer. The window appears, click Scan Home, and
    wait for a while as your folders are sized up. A colorful ring will appear, accompanied
    by a list showing where all your hard disk space is being eaten up. Hover over
    the mouse one of the colored segments on the chart to see what''s taking up the
    most room, or double-click one of them to zoom in on a particular folder. After
    that, it''s up to you to weed out the hard disk hogs: Click a file in the left
    list, and choose Move to Trash to delete it.


    # # Project 7: Creating and Extracting Compressed Files


    Since I have been talking about file storage, it seems only fitting to wrap things
    up in this chapter by teaching you how to create and extract compressed files.
    In the Windows world, these are generally referred to as Zip files, in the Linux
    world, tarball is the operative name. The Linux name, in case you''re wondering,
    comes from the application that I use to create for such files, Tar. Compressed
    archives are great for two reasons: They let you bundle a load of files into into
    handy package, and they also squeeze all the files so they take up space on your
    hard disk. If you''ve ever tried to email a bunch of files to someone, you know
    how useful this is.


    Anyway, to get some of the hands-on stuff down, you''ll be creating a Windows/Linux/Mac-friendly
    Zip file and extracting it. You can get down to basics by opening a Nautilus and
    creating a couple of dummy files to work with. Do this by going to the Nautilus
    File menu and selecting Create Document > Empty File. A new file will appear in
    the Nautilus window, with its name highlighted. You can type a name for the file,
    such as the one I''m using: dogwood. Now repeat the process to create a second
    file. I''ll be calling that one violet. Use something equally evocative for yours.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'Now that you have two files to work with, you can create the compressed archive
