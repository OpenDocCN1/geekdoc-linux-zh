  md: 'To create an archive, you would simply type tar -cvf, followed by the name
    final tarball will be, and then the name of the folder or file you are trying
    to archive. For example, let''s say you want to create an archive of your photos
    folder, and you want to call it pics4pals. In this case, you would type the following
    command and press ENTER:


    ```

    tar -cvf pics4pals.tar photos

    ```


    As you no doubt noticed, there are some flags after the tar command in that string.
    The c cells the tar program to create a new archive. The v tells the program to
    be verbose, or in other words, to tell you what it is doing in the Terminal as
    it is doing it. Finally, the f tells the program that what follows is the file
    information.


    If after creating the archive, you suddenly remember that there is one more file
    you want to add to the mix, you can use the -r flag to append the archive.


    For example, to add a file called cranky.png to the archive, you would type the
    following and press ENTER:


    ```

    tar -rvf pics4pals.tar cranky.png

    ```


    Of course, chances are that you will be doing more extracting than creating, so
    you no doubt want know how to do it. Fortunately, the process is pretty similar
    to what you use when creating the tarball. The main difference is in the first
    flag. Rather than using the tar command with the -c flag, you would instead use
    it with the -x flag, which tells the tar program to extract the specified archive.
    If you want to extract a tarball called spicyfood.tar, type the following command,
    and press ENTER:


    ```

    tar -xvf spicyfood.tar

    ```


    What you have been doing thus is creating and extracting archives, which are basically
    just collections of files. They are not, however, compressed. In fact, many tarballs
    you find will be compressed, and you can tell by the ending tar.gz. That gz means
    that the archive was compressed using the gzip program. Extracting a compressed
    tarball is as easy as extracting a tar archive; all you have to do is add the
    -z flag, which tells your system to decompress the archive. For example, if you
    want to extract a compressed tar called goosedown.tar.gz, type the following command,
    and press ENTER:


    ```

    tar -xzvf goosedown.tar.gz

    ```


    Well, now that you know how to decompress and extract a zipped tarball, you probably
    will know how to create one. This is, again, little different than creating the
    tar archive itself; you would just add the -z flag to tell the'
  merge: -1
