    # Project 19C: Shredding Documents Digitally


    Although most people are satisfied with deleting their files when they no longer
    need them, they may not realize that the deleted file data is still retrieveable.
    This may pose little concern when it comes to photos of your summer trip to Maryland
    or reports you may have written for a class on Thai cooking, but it is a completely
    different situation if you''ve been storing bank details or other confidential
    information on your hard disk. The data stays. That is great if you want to retrieve
    any files you have accidentally deleted (or formatted away), but it isn''t such
    good news if your computer got lost or stolen or you just decide to give it away.
    In such cases, it might not be a bad idea to do some digital shredding.


    # 19C-1: Trying the shred Command


    Digital shredding in Linux is done with the shred command. Its usage is similar
    to the rm command you learned to use in Chapter 9, though in terms of removal,
    shred is much more thorough. To give it a try, create a dummy file by going to
    the File menu of a Nautilus window, and selecting Create Empty File. Make the
    new document myShredExp.txt, and then double-click the file. This will open edit.
    Type a couple of sentences in the document—anything you do—and save it. Close
    edit. The first couple of words typed should now appear on the icon of the new
    dummy file you created (as shown in the example on the left side of Figure 19-9).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_386_0.png)


    Figure 19-9: Files change their appearances after being shredded.


    With new file in hand and placed in your home folder to make it easier to follow,
    you are ready to try shred. Open a Terminal window, type shred myShredExp.txt,
    and then press ENTER. If you now look in your home folder, you will notice the
    difference right away. Your original file is still there, but the text on the
    icon now looks like gibberish (as you can see in the example on the right side
    of Figure 19-8), which is what your file has become. If you double-click the file,
    edit will open like it did before, but this time around, it won''t be able to
    read your file, and it will tell you so (Figure 19-10).'
