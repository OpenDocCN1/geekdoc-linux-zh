    \ pyWings.py is a script, rather than an application, you are calling pyWings'\
    \ attention to fact so that Python will know it needs to deal with that script.\
    \ If all went according to plan, pyWings will be up and running and will be making\
    \ you a wiser person.\n\n# 9B-7: Creating a Launchable Link for pyWings\n\nThe\
    \ method of running pyWings that you've just used works well enough, but it is\
    \ a pain to open your Terminal and type that somewhat lengthy every time you want\
    \ to find out what it has in store. Let's find a way to make things easier in\
    \ the future.\n\nTo run an application from the Terminal, you generally type the\
    \ name of that, or to type it more precisely, the name of that program's executable\
    \ file; the application's name acts as a sort of command. For your system to recognize\
    \ that command, however, the command (the executable file or a link to it) must\
    \ be in a location where the system can find it. Whenever you run a command of\
    \ any sort, your system checks a series of locations (most of which are folders,\
    \ where executable files are located) to find that command.\n\nYou can easily\
    \ find out these locations are by typing echo PATH in your Ubuntu system, and\
    \ pressing ENTER. As you will see, these locations are as follows:\n\n+   * /usr/local/bin\t\
    \ /bin\n* /usr/local/sbin\t /usr/bin\n* /sbin\n* /usr/games\n\nThe results of\
    \ the echo PATH command will not appear as they do in the easier-to-read chart\
    \ shown here, rather, in a single line divided by colons: The actual output shown\
    \ in the Terminal is /usr/local/sbin:/usr/local/bin:/usr/bin:/sbin:/usr/bin:/\n\
    \nIf the command you typed is in one of those locations, the program, or script,\
    \ will run. As you no doubt know, however pyWings is not any of those locations.\
