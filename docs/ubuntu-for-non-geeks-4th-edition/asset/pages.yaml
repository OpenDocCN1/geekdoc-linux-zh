  md: '# I Get a GRUB Error


    When you try to start your computer, you might be left with a black screen, which
    says there was a GRUB error. This means there is a problem with the GRUB bootloader,
    which is responsible for telling your computer''s hardware how to start Ubuntu.
    Fixing these errors involves typing a few cryptic-looking commands or booting
    off a live CD, be prepared for that. You can find a short guide to handling common
    GRUB errors at https://help.ubuntu.com/community/Grub2#GRUB%20Errors


    # I Get a Kernel Panic or the Computer Freezes


    Kernel panics have a scary name for a reason. If you get an error message saying
    there was a kernel panic, something pretty serious went wrong in Linux-land, and
    you''ll probably find you can''t use the computer until you fix the problem. Fortunately,
    these errors are rare, and even if you do one, you should be able to fix it without
    too much work. I should also note that kernel panics are only serious in that
    they make difficult to run software on the computer—the physical hardware side
    of your computer won''t be damaged at all, once you get the software working again,
    everything will be back to normal. So really, there''s no need to panic at all.


    Freezes and kernel panics often go in hand, but they''re not necessarily the same
    thing. You''ve probably seen a computer freeze before—moving the mouse or pressing
    keys on the keyboard does nothing, and the displays frozen. If the computer freezes,
    all you can do is give it a minute or two to see whether it wakes up and, if not,
    restart the computer or turn it off by holding down the power button for a few
    seconds.


    You can try a few things if you keep getting kernel panics or freezes, detailed
    in the following sections. If nothing seems to be working, ask for advice in the
    Ubuntu forums, and with a bit of luck, you''ll see up and running again.


    # Unplug Unnecessary Hardware


    A lot of freezes are caused by problems with hardware devices. If you recently
    bought some new hardware, try unplugging it and see whether you still get the
    freezes. If you recently installed system updates, the driver for them could be
    causing the problem too. It''s worth unplugging any unnecessary hardware (such
    as scanners, printers, external hard drives, and the like) to check whether they''re
    causing the problems.


    # Disable Restricted Drivers


    Some freezes are caused by problems with accelerated graphics drivers ("Games/Compiz
    Don''t Work: Installing Accelerated Graphics Drivers" on page 394) or restricted
    drivers for other hardware ("Installing Drivers for your Network/Wireless Card,
    on page 30). If you suspect this might be the case, disable the restricted drivers
    if you can. To do this, select **System > Administration > Hardware Drivers**
    to open the Hardware Drivers tool (Figure 21-3). Select a currently activated
    driver, and click **Remove**. Then, restart the computer to see whether you experience
    any more.'
