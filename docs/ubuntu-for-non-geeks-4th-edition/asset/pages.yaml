- img_proc: true
  md: 'back to the original account. Fortunately, there''s an alternative: You can
    temporarily switch users. Switching users differs from the logout/login approach,
    that you remain logged in to your original account while you log in to your other
    (while someone else with an account on your computer logs in theirs). This route
    keeps all the windows and applications you have open. These windows will not appear
    in the account you are switching to, but they will be there, conveniently waiting
    for you, when you switch back to the account from whence came.


    This is a good way to proceed if you plan to be switching back and forth between
    your accounts. It is also a good approach when, say, your child needs to log in
    to their account for a moment to do a quick email check, burn a CD to play on
    the beach, or print a file for school. When your child is done, you can quickly
    get back to what you were doing without having to reopen files, web pages, or
    whatever else you happened to be dealing with at the time of the switch.


    You can switch users quite easily by clicking the power button on top GNOME panel
    and selecting the account you want to switch. After a few seconds you will be
    asked for the password for the account you selected, so type it into the box,
    and press the ENTER key. After that, you will be at the desktop of the selected
    user account.


    To get back to your original user account after going the switch-user route, just
    click the power button, click the username from which you came, and after a few
    seconds of darkness, a window will appear into which you must type the password
    of the account you are returning to. Type your password, click Unlock, and you
    will be back at your original desktop, with everything as it was when you last
    saw it, open windows and Pretty cool.


    # Project 8B: Customizing Your Desktop Environment


    Whichever user account you decided to play with, you are now ready for action.
    By the time we get to the end of the process, you will have created a much wider
    and gaudier desktop environment than you''ve ever seen before. All of this is
    in good fun, of course, and when you are done, you should be able to completely
    and confidently customize things the way you want on your own. So, let''s go.


    # 8B-1: Adding Emblems to Folders


    One of the coolest things about Nautilus is that it allows you to add little folder-icon
    emblems. These emblems can graphically remind you what each folder is, and they''re
    not only for folders—you add them to files too. The look of these emblems also
    changes when you change your desktop themes, so you''re in more visual excitement
    later in this chapter. For now, let''s learn how to use them by adding one to
    the Documents folder. Open your home folder, right-click Documents, and then select
    Properties in the pop-up menu. When the Properties window appears, click the Emblems'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'tab, and scroll down until you see the emblem called Personal (Figure 8-3).
    Click the checkbox next to it, and then click the Close button. The emblem should
    now appear on your folder.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_163_0.png)


    Figure 8-3: Choosing emblems for your folders


    Now, for additional practice, try adding the Sound emblem to your Music folder.
    Just use the same steps as before, and substitute the appropriate items and entries.
    When you''re finished, you should have a Music folder that is surrounded by musical
    notes—one is the emblem, the other is the folder''s default icon. Not all folders
    have default icons, so that when emblems really come in handy.


    # 8B-2: Setting Window Backgrounds (and Emblems Again)


    Once you''ve added those emblems, your folders should look a bit spunkier (and
    you''ll make them look spunkier later in the chapter). Nevertheless, the background
    of the Nautilus window is still pink and white. You need not want that for if
    you don''t want; you can change it as well. To do so, just go to your home window,
    click the Edit menu, and select Backgrounds anding. The Backgrounds and Emblems
    window will then appear (see Figure 8-4).'
