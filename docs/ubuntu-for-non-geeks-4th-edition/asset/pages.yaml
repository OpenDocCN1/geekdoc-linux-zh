    on your Ubuntu-ized computer? Finished filming a video of your sibling talking
    asleep and want to do some creative editing of the evidence? Chapter 16 covers
    these and other video-related topics.


    # Chapter 17: Feathery Flippers—Linux Gaming


    If music and art don''t keep your mind off things enough, Chapter 17 presents
    you with more diversions: games. In addition to learning what your system comes
    with, you will also learn how to add more and even how to run Java-based games.


    # Chapter 18: Penguins at the Gates—Working with Ubuntu in a Windows World


    Like it or not, Microsoft Windows is probably to stay here (for the foreseeable
    future, at least). Chapter 18 shows you how to share files between Windows and
    Ubuntu over a network, install Windows fonts, and'
