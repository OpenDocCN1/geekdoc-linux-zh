    Figure 19-8: Checking your encryption passphrase


    If you open your home folder, you''ll now see a folder called Private. Anything
    you put in this folder will be encrypted and will be safe from prying eyes. This
    is especially useful if your computer gets stolen—only someone with your password
    will be able to look at the files, ideally the only person knows who it is!


    # 19B-2: Recovering Encrypted Files If Something Goes Wrong


    If you have problems with your computer and need to recover the files in the encrypted
    Private directory, follow the following steps after you get Ubuntu up running
    again. If you don''t feel confident following these instructions, you should definitely
    ask for advice on the Ubuntu forums.


    +   1. Open a Terminal, type sudo mount -t ecryptfs /home/username/.Private /home/username/Private,
