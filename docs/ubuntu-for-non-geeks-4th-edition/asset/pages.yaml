  md: '# MANUALLY PARTITIONING

    YOUR HARD DISK


    ![](img/35405f17cef8b43ddf1af3fc22de194c_449_0.png)


    When you''re partitioning your hard disk with the Ubuntu installer, the first
    two options (use the whole disk and resize an existing partition) should cover
    most eventualities. They''re both discussed in Chapter 2. But if you''re in a
    geekier mood, there are a few ways to carve up your disk space. For example, you
    can create a shared data partition so your files can be shared between Windows
    and Ubuntu, or you can make a separate partition for your /home directory so you
    can reinstall Ubuntu (or install a different Linux distro) without having to fully
    back up all of your files.


    When you get to the Prepare space screen of the installer, choose Specify partitions
    manually and click Forward. You''ll be presented with a colored-bar view of your
    current partition setup (Figure C-1) and a list of your partitions below. None
    of the changes that you make in this window will be applied until you click Forward
    again, and you can click the Back button if you want to forget about making the
    manual changes altogether. (There is one exception: Changes are made immediately
    and irreversibly when you resize a partition. See “Editing Existing Partitions”
    on page 416 for more on this.)'
  merge: -1
