    # # Lost Files


    Losing an important file is one of those uniquely frustrating experiences in life.
    If you''ve looked in all of the most locations (like your home folder), try one
    of the following:


    +   **Recent Documents** Select Places > Recent Documents to see whether the missing
    file is in the list of recently edited files. If you use the File > Recent Documents
    menu in OpenOffice.org too.

    **Basic search** The basic search for Files tool is useful only if you can remember
    part of the the file''s name. Select Places > Search, type part of the file''s
    name in the Name contains, and click Search. It might turn up in the list of search
    results.

    **Heavy-duty search** The more advanced Tracker search tool can look inside documents,
    which is handy if you don''t remember the file''s name but remember some of its
    contents. Install the Tracker Search Tool from the Ubuntu Software Center, and
    select System > Preferences > Search and Indexing. Check the Enable indexing option
    on the General tab, and click Apply. Restart Restart in the window that appears,
    and wait for Tracker to build its search index (about 20 minutes should do it).
    When it has finished, select Applications > Accessories > Tracker Search Tool,
    and search for your lost file there.'
