  md: '# 17


    # # FEATHERED FLIPPERS


    Linux Gaming


    ![](img/35405f17cef8b43ddf1af3fc22de194c_341_0.png)


    Many people hate to admit, but games are a big attraction to almost everyone at
    the helm of a personal computer. Even those who deny being gamers often find themselves
    caught in the act of rapping off a quick round of solitaire between work projects.
    As a Linux user, you will most likely find that one of the most common questions
    you will be asked about Linux by users of other operating systems is, “What games
    does it have?” Well, although there might not be as many games in the Linux world
    as there are on Planet Windows, Linux still has plenty to choose from. In fact,
    most Linux distributions come bundled with a number of games. Ubuntu, for example,
    comes with the games AisleSolitaire (a collection of more than 80 solitaire card
    games), gbrain (a collection of puzzles, memory trainers, and brain teasers, shown
    in Figure 17-1), Mahjong (a tile-matching game, similar to the one introduced
    in Chapter 9), Mines (the Linux world''s answer to Minesweeper), Quadrapassel
    (a Tetris clone), and Sudoku. Many other free games are available via the Ubuntu
    Software Center (and other sources), some of which you will learn about in this
    chapter.'
  merge: -1
