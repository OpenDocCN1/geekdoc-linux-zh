- img_proc: true
  md: 'Fortunately, there is good news for those of you who were a bit disappointed
    by the content of that previous paragraph. Ubuntu is available in a native 64-bit
    version. Check Appendix B for information on how to get it. The information provided
    there will also be of use for i386 users who have to lose or damage the disc that
    comes with this book.


    # Mixed News for Mac Users


    Those of you with pre-Intel era PowerPC Macs (such as those with G3, G4, and G5
    processors) may be aware that previous Ubuntu releases have been available in
    PowerPC versions. Unfortunately, as of the Ubuntu 7.0 Feasty Fauna release, this
    is no longer the case. This means that if you are a Power Mac user, you will have
    to use one of the older Ubuntu releases or an unofficial, community-supported
    release of Ubuntu 10.04 Lucid Lynx (or on that name in the following section)
    for PowerPCs (http://cdimage.ubuntu.com/ports/).


    Of course if you are using an Intel-based Mac, you will be in luck: The disc that
    comes with this book will work on your Mac. After all, the i in i386 stands for
    "Intel".


    # Speaking Ubuntu


    It''s worth noting that you are bound to come across a lot of weird phrases when
    dealing with Ubuntu, especially when searching for information on the Net. In
    particular, I am referring to seemingly incongruous phrases, such as Warty Wget,
    Hoary Hedgehog, Breezy Badger, Dapper Drake, Ej, Fisty Faun, Guilty Gubby, Hardy
    Heron, Intrepid Ives, Jaunty jackalope, and Karmic Koi. These are the unique names
    of each of the releases of Ubuntu since its first appearance in 2004. The important
    one for you to remember is that of the current release, which is the one on the
    book''s disc: version 10.04, known as Lucid Lynx.


    You are also likely to come across a few other variations of the Ubuntu. These
    are Kubuntu, a KDE-based version of Ubuntu; Edubuntu, a special version of Ubuntu
    designed for the classroom; Xubuntu, a lightweight version of Ubuntu based on
    the XFCE desktop; and Ubuntu Studio, a flavor of Ubuntu aimed at "creative people,"
    which contains a strong set of graphics, video, and music applications. There''s
    even a slimmed-down version of Ubuntu, called Ubuntu Network Edition, designed
    specifically


    # Where Do I Go From Here?


    Now that you know more about the world of Linux and Ubuntu and you have your disc
    in, it''s time to get down to it. If you have already installed Ubuntu on your
    machine, it''s time to flip ahead to Chapter 3. If your machine is Linuxless,
    though, it''s time to take it out for a spin and see whether you like it. So for
    now, strap yourself down in front of that computer, click on your spurs, and go
    straight to the next chapter. It''s time to become a Penguinist!'
