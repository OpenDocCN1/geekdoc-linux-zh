    \ is a Shell?\n\nAs you noticed, I mentioned that the results of the finger command\
    \ showed I was using the Bash shell, so you may be wondering just what Bash is.\
    \ Well, Bash (Bourne Again Shell) is one of the shells that are used in Linux\
    \ systems, and it's the one that happens to come with your Ubuntu distro (and\
    \ most others, for that matter). A shell is a program that interprets the commands\
    \ you type into the Terminal and delivers them, so to speak, your system so that\
    \ it can act upon them. I like to think of it as a command-handling subsystem,\
    \ for which the Terminal acts as a graphical frontend."
