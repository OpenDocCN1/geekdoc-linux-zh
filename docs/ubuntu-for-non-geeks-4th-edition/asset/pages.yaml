  md: '# Keeping Up-to-Date with Live Bookmarks


    The Web is awash with all sorts of news and information, and it can be keep tabs
    on all of it. Personally, I hate missing my daily dose of offbeat stories from
    Boing, the aptly titled "directory of wonderful things" (http://www.boinging.net/).
    Fortunately, Firefox has a new way of dealing with information overload, called
    live bookmarks (also known as RSS feeds). This provides you with an automatically
    updated list of articles from any website that supports them. To an example, click
    the Latest Headlines underneath Firefox''s address bar—it''s a live bookmark for
    the BBC News website and show you a list of current news stories.


    You can check whether a website has RSS feed by looking in the address bar for
    an orange beacon symbol (like the one shown in Figure 5-3). If it has, you''re
    in business! Let''s use Boing as an example: Load http://www.boinging.net/ in
    Firefox, and click the beacon icon. You''ll get a list of the most recent articles
    with an invitation to subscribe to the feed in the box at the top of the page.
    Click Subscribe Now, and in the window that appears, click Subscribe to add the
    live bookmark to the toolbar or the Latest Headlines.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_98_0.png)


    Figure 5-3: The beacon icon is displayed when a website has an associated RSS
    feed.


    Some websites provide links to their RSS feeds rather than showing them in the
    address bar. If you find one of these links (it''s normally ATOM or RSS/XML),
    click it, and you should be taken to a list of articles with a box at the top,
    like in the previous example. From there, the steps for adding the feed to your
    bookmarks are the same.


    # Pop-up Manager


    Firefox has a number of other useful features. One is Pop-up Manager, which suppresses
    those annoying pop-up windows when you access a new web page. You can enable or
    disable this feature from the Preferences window (Edit + Preferences) by clicking
    the Content icon in the top pane of that window and then checking or unchecking
    the Block pop-up windows. You can also permit certain sites to pop-up windows
    (some pop-ups are not only useful but necessary for the correct functioning of
    a site) by clicking the Exceptions button to the right of Block pop-up windows
    entry and inputting the web address for the site in question.


    # Multimedia Plug-ins


    One of the coolest things about Firefox is that it allows you to further expand
    your functionality by adding extensions. The most commonly used extensions come
    in the form of plug-ins. These allow web pages to do much more than just display
    text and pictures—you need a plug-in to watch videos or play games. Three plug-ins
    are used far more widely than any others, I''ll concentrate on those here.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Flash


    The most frequently used browser-plugin for any system is Adobe''s Flash Player
    provides websites with all sorts of exciting multimedia effects and capabilities,
    and as a result, it is used by an ever-increasing number of sites. In fact, you''ve
    probably seen numerous Flash-enhanced pages without even being aware of it. For
    example, if you''ve watched a video on YouTube, you''ve enjoyed the wonders of
    Flash.


    How do you get the Flash plug-in? Well, all it takes is a few clicks and a working
    Internet connection:


    +   1. Select Applications ▸ Ubuntu Software Center

    2. Type adobe flash in the search box at the top right of the window.

    3. In the list that appears, click the Adobe Flash plug-in once. An Install button
    will appear (Figure 5-4).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_99_0.png)


    Figure 5-4: Installing the Flash plug-in with the Ubuntu Software Center


    +   4. Click Install, if prompted, type your password, and click Authenticate.
    The plug-in will be downloaded and installed.


    +   5. When the plug-in has finished installing, a green check will appear next
    to the Adobe Flash plug-in''s icon in the list. Close the Ubuntu Software Center,
    and open Firefox (if it was already open, close it, and then start it up again).


    +   6. To check that the plug-in is working, find a site that uses Flash. If you
    don''t know of one offhand, try YouTube (http://www.youtube.com/). Once you have
    arrived at YouTube, click any video you see. If Flash was installed successfully,
    a video should appear and start playing (Figure 5-5).'
  merge: -1
  pgno: 99
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_100_0.png)


    5-5: Playing a YouTube video after installing the Flash plug-in


    # Silverlight


    A newcomer to the plug-in scene is Microsoft''s Silverlight. It''s less common
    than Flash but seems to be used on the websites of TV channels and major sporting
    events quite a lot. Unfortunately, Microsoft is a little behind the times, and
    it hasn''t made Silverlight available for Linux yet. But never de fear: An alternative,
    open source plug-in called Moonlight is available. Follow these steps:


    +   - Open Firefox, and browse to http://www.go-mono.com/moonlight/.

    - Click the Install button on the Moonlight page, and scroll down to section 3,
    Download the plug-in.

    - Now, click the green down-pointing arrow. A narrow bar will appear at the top
    of the screen saying that the website was prevented from installing software.

    - Click the Allow button in the (usually black) bar, and a Software Installation
    window will pop up. Click Install Now, and wait for the plug-in to download.'
  merge: -1
