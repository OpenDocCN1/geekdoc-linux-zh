  md: '# Hardware Requirements


    All worries about compatibility aside, you will need to meet some minimum

    hardware requirements:


    +   - Any computer with a 1 GHz or higher i386-based processor, or an Intel

    or or AMD 64-bit processor

    - About 5 gigabytes (GB) of hard disk space, though having at least 10GB

    would be a bit more comfy

    - Sufficient memory (RAM)


    NOTE The CD that comes with this book is designed to work on machines with i386-based-pro

    cessors (basically, all Pentium chips, including Celeron, Xeon, and the new Core

    Duo, as well as processors from AMD). Though this CD will install Ubuntu on a
    computer

    an an AMD or Intel 64-bit processor, it will run in 32-bit mode only. To make
    full use

    of your 64-bit processor, you need to download the 64-bit version of Ubuntu. Additional

    information is provided in Appendix B.


    As random access memory (RAM), the official specs tell you that you

    eed a minimum of 512 megabytes (MB) to run Ubuntu. Although you can

    o doubt get by with this, you''d get with much more. My basic rule

    of thumb, no matter what OS I am dealing with, is that you need the recom-

    mended (not the minimum) memory plus at least 128MB. Regardless of what

    of official specs say, put you in. You won''t regret it


    Saying "the memory you have, the "better" may sound a little bit,

    and even cavalier, but trust me on this one. When you have too little

    memory, no matter what system you are running, weird things happen: Applica-

    seem take years to open or not at all, make forever to

    render their little icons, and freezes and general system meltdown happen

    more often. In other words, running your machine on too little RAM is

    sort like trying to do jumping jacks in a broom closet. Sure, you could

    it, but you would be all contorted, and you''d be smashing your hands into

    the walls every 1.4 seconds.


    Fortunately, it is pretty hard to find a machine with less than 512MB of

    RAM these days (256MB, perhaps, on the really old beasts), but if you

    h to have such a machine, you can at least take solace in the fact that

    memory is relatively cheap, so for it.


    # Good News for 64-Bit Machine Users


    It is again important to mention that the CD that comes with this book is

    designed to work on machines with i386-based processors, which pretty much

    covers the vast majority of PCs out there. If your machine is 64-bit compatible,

    you will be glad to know that it will also work, albeit not in 64-bit mode. Sorry,

    but no go.'
  merge: -1
