    # The Screen Is Blank


    One possible cause of a blank screen is that something went wrong with your graphics
    card or its drivers. Frankly, this is a reasonably rare occurrence, and it''s
    much more likely that something minor (and easy to fix) happened. Peruse the following
    tips before you start worrying about some of graphics card apocalyptic scenario:


    **Check that the display cable is connected** Most computers have a separate monitor
    that plugs into the back of the monitor, and make sure both of the cables coming
    out of the back of it are firmly plugged in both ends. You might also want to
    check that the display is switched on and that its power cable hasn''t fused.


    **Try to wake up the computer** Your computer may have gone into a power-saving
    (sleep) mode, which you can wake up by moving your mouse or pressing keys on the
    keyboard. If that doesn''t work, try pressing the power button on your computer
    once. This sometimes wakes up from your sleep too.


    **Switch to a command line** The part of the Ubuntu that''s responsible for displaying
    things on the screen is X11, or just X fails to start. To see whether this is
    the case, press CTRL-ALT-F2. You should see a login: prompt if everything X is
    working properly. You can type your username and password (press ENTER typing
    each one) to access a command line, just like the Terminal you met in Chapter
    9. While you''re using the command line, try typing sudo starts, followed by ENTER,
    and type your password again if prompted. This will try to start X; it might work,
    or it might give you an error message telling you what the problem is. Alternatively,
    type sudo reboot to restart your computer. If you''re wondering what happened
    here, pressing CTRL-ALT-F2 switched to a different virtual terminal. Ubuntu starts
    a few virtual terminals and uses them for different things; CTRL-ALT-F7 will switch
    you back to the virtual terminal using X to display everything.


    **Restart the computer** Some computers occasionally start without turning on
    the graphics card or the monitor. (This tends to be more of a problem on older
    computers.) As a last resort, try turning the computer off and then again by pressing
    the power button. If the computer won''t turn off, hold down the power button
    for a few seconds until it does.'
