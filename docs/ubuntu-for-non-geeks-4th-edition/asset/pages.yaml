    # $ chmod


    In Chapter 7, you learned how to change file permissions via the Nautilus interface.
    This is without doubt the easiest way to go about such things, but you might find
    times when it is easier to use the command-line approach.


    The command for changing file permissions is chmod (change mode). To use it, just
    the command followed by the permissions you want to extend to a file and the location
    of the file itself. For example, lets you a JPEG file, mybirthday.jpg, from a
    CD to the personal subfolder within the Photos folder on your hard disk, and the
    file is protected. To change the file so you can write permissions (meaning that
    you can alter the file), you would type the following and then press ENTER:


    ```

    chmod 744 ~/personal/mybirthday.jpg

    ```


    To change permissions of all the files and subfolders (and all the files within
    those subfolders) in one fell swoop, you can add the -R (recursive) flag to the
    chmod command. The command would be as follows:


    ```

    chmod -R 744 ~/personal/personal

    ```


    The number 744, by way, extends read, write, and execute (run) permissions to
    you, the owner, but gives read-only to everyone else—a pretty safe choice when
    doubt. If you want to figure out permission numbers for yourself, it is pretty
    easy. You are basically dealing with three number positions, each of which has
    eight numerical possibilities (0–7). The left slot'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'represents permissions for the owner, the center slot represents permissions
    for the group, and the third slot represents permissions for others.

    The meanings of the numbers themselves are as follows:


    +   - 7 Read, write, and execute permissions

    - 6 Read and write permissions

    - 5 Read and execute permissions

    - 4 Read-only permissions

    - 3 Write and execute permissions

    - 2 Execute-only permissions

    - 0 No permissions


    Figure 9-7 points out the meaning of each of these numbers and what each slot
    represents. In fact, if you don''t mind a bit of addition, things are even easier
    to understand. To start with, remember that 1 = execute, 2 = write, and 4 = read.
    Add any of those numbers together, and you get the permission combos. For example,
    1 (execute) + 4 (read) = 5 (read and execute). As you can see, permissions aren''t
    all complicated.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_202_0.png)


    Figure 9-7: The meaning of permission numbers


    If you''re more of a letters than numbers sort of person, you''ll be happy to
    know that there is another way to change permissions that is probably even easier.
    In this approach, you have to deal only with two groups of letters and the symbols
    + and -

    The first group consists of the following:


    +   - User (owner of the file)

    - Group (specified group of users)

    - Others (anyone who is not the user or a member of the group)

    - All (all of the above)'
