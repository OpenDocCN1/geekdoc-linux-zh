    Figure 17-1: gbrainy


    # Project 17A: Expanding Your Game Collection via the Ubuntu Software Center


    Expanding your gaming repertoire is quite easily done via the Ubuntu Software
    Center. In this project, you''ll be plugging in a few holes by installing some
    classic Linux games. The steps in this project are basically a review of what
    you learned in Chapter 6, so there will be no challenging work involved—just fire
    up the Ubuntu Software Center and click away.


    # 17A-1: Installing Missing GNOME Games


    The standard GNOME collection of games includes a number that were not included
