    # Working with Bluetooth Devices


    While we''re on the topic of file handling, it is probably a good time to learn
    how to work with Bluetooth devices. As I mentioned in Chapter 3, if you have a
    Bluetooth adapter in your machine, either built in or plugged into a USB port,
    a Bluetooth icon will appear in the right half of the GNOME panel.


    # Pairing Devices


    Before you can transfer files between your Bluetooth devices, you need to pair
    them. This is how you do it:


    +   1. Click the Bluetooth icon in the top panel, and select Set new device.

    2. In the Bluetooth setup wizard that appears, click Forward.

    3. Ubuntu will then search for Bluetooth devices in the vicinity of your computer.
    Once it discovers a device, that device will appear in the center of the window,
    as in Figure 7-17. Once the device you want to pair appears, click it, and then
    click the Forward button.

    4. In the next page of the wizard, a personal identification number (PIN) will
    appear (Figure 7-18). An input window should also appear in the Bluetooth device
    you''re trying to connect to. Input the PIN into that input box.

    5. Assuming the pairing is successful, the final page of the wizard will then
    appear. Click Close to complete the pairing process.'
