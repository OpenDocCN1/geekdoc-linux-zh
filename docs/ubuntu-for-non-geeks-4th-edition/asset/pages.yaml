    # Creating Playlists in Rhythmbox


    Of course, you can tailor things even to match every situation and your mood.
    There are days, after all, when you''re feeling a bit ethereal for Adam Lambert
    (and thanks for that). To prepare for such moments, you can create playlists,
    which are lists of songs to be played in a predetermined order. Just think of
    each playlist as an all-request station . . . where all the requests are your
    own.


    To create a playlist in Rhythmbox, select Music ▸ Playlist ▸ New Playlist. When
    the Playlist icon appears in the left pane of the Rhythmbox window, type a name
    for the list, and add the songs you want by dragging them from the Library pane
    to the Playlist icon. The songs themselves will remain in the Library, so you''re
    really moving anything—just creating aliases.


    You also create create playlists, which are lists that automatically scan the
    Library for songs that match your creation criteria. You could choose to create
    a list for all the songs in your Library by a particular artist or of a specific
    genre. To do this, just select Music ▸ Playlist ▸ New Automatic Playlist. A window
    will appear in which you can specify what the list is to contain.


    Once you''ve created your lists, you can play one by clicking the list once and
    then clicking the Play button near the top of the window (or by just double-clicking
    the list).


    266 Chapter 14'
