- img_proc: true
  md: 'Linux support for USB modems can be patchy, so do your research before buying
    one. External serial modems are a safer bet since most of them should work with
    your system ... if you have a serial port, that is. Modern computers rarely have
    them any more, so check to see whether you have one by looking at the back of
    your computer for a connector with little prongs in it (Figure 4-5). If you are
    worried and are looking for a sure thing, Zoom Telephony (http://www.zoom.com/)
    makes an external serial modem that is compatible with Linux, and the company
    says so right on its website. USRobotics 56K V.92 External Faxmodem is also said
    to work, though I haven''t tried this model myself.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_91_0.png)


    Figure 4-5: Serial port and connector


    If you find another model that you think will do the trick, before you commit
    to it by slapping down the cash, do a Yahoo! or Google search with that modem''s
    make and model number, along with the word linux, and see what results you get.
    Of course, you can try one of the Linux forums and ask about the modem make and
    model there. A lot of people are in the same boat, so you are sure to get plenty
    of opinions and advice.


    # Mobile (3G) Broadband Connections


    Wireless networks, for all the convenience and freedom that they offer, still
    have quite a limited range. This won''t be an issue if strays from the general
    vicinity of your house or office, but it can get mighty inconvenient if you''re
    on the road, miles from the nearest wireless-enabled shop. This being the 21st
    century, there are, of course, ways around this limitation.


    If you''re a computer-equipped traveler, you''re probably already come across
    mobile broadband technology, also known as 3G. All you need to get a high-speed
    connection on the go is a 3G card (also inexplicably called a'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'dongle), which plugs into your computer and connects you to the Net via a cell
    phone network (Figure 4-6). Ubuntu is pretty good support for most 3G cards right
    from the get-go, and the setup process is a snap:


    +   1. Plug your 3G card or dongle into the computer; the New Mobile Broadband
    Wizard should open automatically. If it doesn''t, click System > Preferences >
    Network Connections, open the Mobile Broadband tab, and click Add.


    +   2. The first page of the wizard has a drop-down list that has the make and
    model of your 3G card displayed in it. If it says Any Device instead, your card
    may not have been recognized, so take a look at https://wiki.ubuntu.com/NetworkManager/Hardware/3G/
    to see whether there are any steps you need to take to recognize the card.


    +   3. Click Forward, select your country from the list, and then click Forward
    again.


    +   4. Pick your mobile broadband provider from the list, and then hit Forward.


    +   5. Now you need to select your broadband billing plan from the drop-down list
    (Figure 4-7). It''s important that you choose the right plan to avoid being wrongly
    charged. If you don''t see a plan that looks appropriate, choose My plan is not
    listed, and call up your broadband provider to ask what to put in the Access Point
    Name (APN) box.


    +   6. Click Forward, check that all of the details look OK, and click Apply.
    You''ll be taken to an Editing window where you can enter details such as your
    account PIN and password if needed.


    +   7. Click Apply, and then close the Network Connections window to finish.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_92_0.png)


    Figure 4-6: A 3G mobile broadband card'
