  md: '# More no-nonsense books from no starch press


    ![](img/35405f17cef8b43ddf1af3fc22de194c_490_0.png)


    # # MY NEW® iPad


    User''s Guide


    by WALLACE WANG


    Apple''s iPad has revolutionized the way consumers experience the Web, email,
    photos, and video. As all Apple gadgets, the basic features are easy to access
    and understand. But there''s a world of possibility beyond the basics, and many
    users need guidance to make the most of their iPads. My features—like the Internet,
    sending email, listening to music, taking notes, reading ebooks, using Swift,
    and playing with digital photos. And since no one wants to read a dry, textbook
    to learn how to use them now, author Wallace Wang takes a practical, easy-to-follow
    approach and keeps the tone light.


