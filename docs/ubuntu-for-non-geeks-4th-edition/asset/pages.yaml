- img_proc: true
  md: '# Firefox: Your Internet Browser


    The default web browser in your Ubuntu system is Firefox, which is enjoying increasing
    popularity in not only the Linux world but in the Windows and Mac worlds as well.
    Chances are you already a Firefox user, but if you are not, then you needn''t
    worry—things work more or less in all browsers. That being the case, you should
    be able to use Firefox''s basic features without any instruction. Open some of
    its features to distinguish Firefox from its competition, I will mention those.


    # Controlling Browser Window Clutter with Tabs


    Usually when you click a link on a web page, the new page opens in the same window.
    On some pages, links are coded so that the new page opens in a new, separate window,
    or maybe you occasionally open a link in a new window by right-clicking the link
    and selecting the Open Link in New Window option. This can be very useful; however,
    once you have a few browser windows open, it gets sort of hard to find what you''re
    looking for in all open windows. It can also slow down a bit.


    This is where Firefox''s tab feature comes in handy (handy, in fact, that almost
    every other there has copied it). To see how it works, try it right here and now.
    Open your Firefox by clicking the launcher on the GNOME panel (or selecting Applications)
    Internet Firefox Web Browser); then search for nickelharpa using Firefox''s search
    box, which is at the top-right corner of the browser window (see Figure 5-1).
    By default, Firefox will perform searches for keywords entered in the search box
    using Google. You can, if you like, select other websites to search by clicking
    the colored icon in the search box and then making your selection. Amazon.com,
    eBay, and Yahoo! are available, to name a few, and you can even add others. Now
    however, let''s stick to Google for your present search, typing nickelharpa in
    that box. Once you''ve finished pressing the ENTER key, after which a page of
    search results appear in the main pane of the Firefox window.


    One of the results should be the American Nickelharpa Association, and you are
    now going to open page in a new tab, rather than in the same or a new window.
    To do that, right-click the link, and in the pop-up menu that appear, select Open
    Link in New Tab. You can, if you prefer, make things a tad easier and dispense
    with the pop-up menu selection by simply clicking the link with the middle mouse
    button or. Either way, the new page will appear in a new tab, while your original
    page of search results remains, ready and waiting in the other tab (see Figure
    5-2). I am pretty confident in saying that, once you get used to this feature,
    you will wonder how you ever got along without it.'
