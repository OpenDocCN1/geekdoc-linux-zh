    # TUX ROCKS


    Music à la Linux


    ![](img/35405f17cef8b43ddf1af3fc22de194c_297_0.png)


    It''s now time to move on to the audio side of things. Yes, Linux does indeed
    rock, and in this chapter you will find out about those musical talents that your
    system possesses. You will learn how to rip CDs, create MP3 and Ogg Vorbis files
    (files that you can recognize by their .ogg filename extensions), add album cover
    art, change file tags, play music files, and burn files onto audio CDs that you
    can play in any CD player. You''ll also learn how to play a variety of audio streams.
    If you''re interested in learning how to work with your iPod, iPhone, or other
    digital media device, or how to convert audio files from one format to another,
    you''ll have to wait until Chapter 15.


    # Audio File Formats


    Before we go any further, it is probably best to discuss the various formats in
    which audio data can be stored on your computer. For the longest time, the de
    facto standards have been WAV (created by Microsoft/IBM and using the'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'Computers underwent their evolution in the multimedia machines they are today,
    because it became something was going to have to be done about disk-space-devouring
    files. Audio compression formats were then developed. These compression formats
    work, to oversimplify things by bit, cutting out the portions of a sound that
    the human ear cannot hear—sort of a dog-whistle approach. The most widely known
    and embraced of these audio compression formats is MP3. Audio files encoded in
    MP3 format end up being as little as one-twelfth of the original WAV file without
    any noticeable loss of quality


    Another audio compression format was developed by Ogg Vorbis. Ogg Vorbis has been
    used under the open source community, unlike MP3, which has always been under
    the shadow of yet-to-be-expired patent rights, is free of patent and licensing
    worries from the get-go. Because of the fact and that the Equal of MP3 is in terms
    of quality and performance (if not, as many claim, better), Ogg Vorbis becomes
    the darling of the Linux community.


    As you work with ripping audio files in this chapter, you are sure to notice another
    encoding option—FLAC. Lossless Audio Codec (FLAC) is an encoding format, unlike
    the MP3 and Ogg Vorbis formats, which does not remove any audio information from
    the audio file during the encoding process. The downside of this is that FLAC
    provides space savings of 30 to 50 percent, which is much less than the 80 percent
    neighborhood achieved by MP3 or Ogg Vorbis. The upside, is that the FLAC files
    should be equivalent to CDs in terms of quality.


    Given retention of audio quality, FLAC becomes an ideal choice if you are not
    satisfied with the audio quality provided by Ogg Vorbis or MP3 files. It is also
    a good choice if you want to create both Ogg Vorbis and MP3 files or if you just
    don''t know which one you want to work with. In such cases, you can just rip the
    file and encode it in FLAC format. As I mentioned earlier, once you get to Chapter
    15, you will learn how you can convert the FLAC file later, when you know what
    you want or.


