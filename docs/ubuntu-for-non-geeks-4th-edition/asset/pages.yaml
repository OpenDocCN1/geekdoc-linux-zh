    # Editing Digital Video with PiTiVi


    Digital video cameras have become increasingly common in recent years, and still
    digital cameras (and even phones!) have also become more impressive in terms of
    their video-handling capabilities. In addition, more and more people are sharing
    their video creations on YouTube—it''s fair to say that digital video is also
    ubiquitous. Linux support for video processing is also catching up, though it''s
    not 100 percent there.


    Ubuntu''s default video editor is called PiTiVi (Figure 16-6). You can run it
    by going to the Applications menu and selecting Sound & Video ► PiTiVi Video Editor.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_333_0.png)


    As you will immediately see, PiTiVi lacks the bells and whistles of applications
    like iMovie or Windows Live Movie Maker. It is really little more than a movie
    editor, allowing you only to trim and combine video clips. Some of its'
