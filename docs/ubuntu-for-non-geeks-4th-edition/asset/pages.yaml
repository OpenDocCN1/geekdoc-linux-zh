  md: 'The only problem with you''ve just done is that the title of the stream appears
    in the Rhythmbox window as the URL you typed in, and the genre, for its part,
    appears as unknown. Needless to say, this isn''t all that way to have things,
    especially once you have more than a couple of streams and have to go through
    them to figure out what is what.


    Remedying this state of affairs is a simple process. Just right-click the stream,
    and select Properties. In the window that appears, change the content of the Title
    and Genre boxes so they represent something more meaningful to you. You can see
    in Figure 14-7 I used Radio France – FIP for the title and Eclectic for the genre.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_305_0.png)


    Figure 14-7: Changing a stream''s title and genre properties in Rhythmbox


    # 14-2: Adding Additional Radio Streams to Rhythmbox


    Now you''ve had a taste of Rhythmbox does with radio, you may be hungry for more.
    Ah, but where do you find these radio streams? For the largest collection of MP3
    streams, go to http://www.showcast.com/, find a stream that seems interesting
    to you, right-click the Tune In! button for stream, and then select Copy Link
    Location in the pop-up menu. After that, paste the URL in the URL box of Rhythmbox''s
    New Internet Station window, and click Add. You can then double-click the stream
    in the right pane of the Rhythmbox window to play it.


    # Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis for your computer
    is fine and dainty, but there are no doubt times when you would like to have your
    songs on a plain audio CD that you can play while you slog your way to work on
    the Jersey Turnpike or the Ventura Freeway. Luckily, this is easy enough to do,
    and there are a couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox users, the easiest way of going about things is to do it all from
    Rhythmbox. To do this, first create a playlist with the songs you want to burn
    to CD, and then click the Create Audio CD button. A confirmation window will appear,
    asking you whether you want to create the CD you you just'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'set out to create. You no doubt do, click the Create button, and copies of
    your tracks will be created in WAV format. When that process is complete, you
    will be prompted for a blank CD, so pop one into your drive, and the process will
    begin. When it''s done, the progress window will vanish, and your new audio CD
    will pop out of your drive.


    # Burning Audio CDs with Brasero


    Another way to create "play-anywhere" audio CDs from your ripped MP3 and Ogg Vorbis
    files is with Brasero, which we first discussed in Chapter 7. To go this route,
    place a blank CD in your drive (and the Nautilus window pops up to handle it),
    and then select Sound & Video > Brasero Disc Burn. When Brasero appears, click
    Audio project. Now add any mix of songs (in any mix of audio formats) to the blank
    area of the window. You can do this by navigating to the songs you have in the
    left pane and then clicking the Add button (or dragging the files to the right
    pane). You can also drag files from any Nautilus window to the right pane of the
    Brasero window.


    As you add to the Brasero window, a bar at the bottom of the window will show
    how much more space you have available on the disk (Figure 14-8). Keep an eye
    on it so not to queue more than your disk can hold. Once you are ready, just click
    the Burn button, and then click Burn in the setup window that appears after. A
    progress window will appear, and once the burn is complete, Brasero will let you
    know and eject your disk. You can take the disk, plot it in your car stereo or
    wherever you want to play, and enjoy the results.


