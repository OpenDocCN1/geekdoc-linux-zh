  md: 'Once the Update Manager window appears (Figure 6-4), click the Check button
    to make sure the package information is up-to-date as possible. You will be prompted
    for your password. Type it, and after a short while, a list of all the available
    updates will appear in the Update Manager window.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_119_0.png)


    Figure 6-4: Upgrading packages in masse via Update Manager


    If there are any applications you don''t want to upgrade, list them and check
    the box next to their names. But for now, it''s safe to just leave all the boxes
    checked. Either way, once you''re ready, click the Install Updates button. The
    selected updates will then be downloaded and installed. Once the installation
    is complete, you will be notified in a separate window. Click Close in that and
    the Update Manager window to finish up. Depending on what you installed, another
    notification may appear that you will need to restart your system in order for
    the changes to take effect. If so, it is best to debrief and reboot.


    # How Often Should You Install Updates?


    Ubuntu will check for updates every day, and the Update Manager will appear on
    your desktop if it finds any. If this is happening too often and you find yourself
    being pestered by updates, select System > Administration > Software Sources.
    When the Software Sources window appears,'
  merge: -1
