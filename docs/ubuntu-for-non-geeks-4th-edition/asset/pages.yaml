  md: '# 5-2: Setting Up the ScribeFire Extension


    When Firefox starts up after you''ve installed the ScribeFire extension, you will
    see a small icon in the lower-right corner of the window. Just click that icon,
    and ScribeFire will appear as a resizable pane in the lower half of your Firefox
    window. A ScribeFire Account Wizard will also pop up, asking for details about
    your blog. Follow the instructions to get it working with your blog.


    # Evolution with Evolution


    Evolution is the default email program in Ubuntu, and its probably described as
    a better-groomed, spunklier clone of Microsoft Outlook (see Figure 5-12). It allows
    you to send and receive mail, make appointments, and keep a list of tasks. It
    can also filter junk mail, which is a necessity these days, and even synchronize
    with your PalmPilot, if you have one of those, if such things are important to
    you, it can connect to a Microsoft Exchange server.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_105_0.png)


    Figure 5-12: Ubuntu''s default email client—Evolution


    To start Evolution, just click the envelope icon (called the indicator applet)
    on the top panel, and select Set Up Mail; or select Applications > Internet Evolution.


    The Set Up option will change to just plain Mail once you''ve entered your account
    details.


    When you run Evolution, you will be greeted by a setup wizard, that has the account
    details you received from your mail provider. This should consist of your POP
    host address for receiving mail, your SMTP address for sending mail, and your
    mail password, which is different'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'from your Internet logon password. Your mail password is not actually entered
    during the various wizard steps, so check the Remember password checkbox when
    filling in the POP details. When you first connect to your mail server, you will
    be prompted for your mail password, so you can type it at that time, and you won''t
    have to deal with it again.


    # An Email Alternative: Thunderbird


    Evolution is the fully featured email software in the Linux world, but despite
    its obvious attractions and popularity, I prefer the more straightforward Thunderbird
    for my email client. In contrast to the multifunctional Evolution, Thunderbird
    (Figure 5-13) is a more mail-oriented program that is very straightforward to
    use yet includes most of the important functions you''ve come to expect, such
    as junk mail filters. In fact, it is remarkably similar to Mail in terms of appearance
    and handling. The fact that Thunderbird is also available in both Mac and Windows
    versions means you may be familiar with it.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_106_0.png)


    Figure 5-13: The Thunderbird email client


    Thunderbird does not come bundled with Ubuntu, so if you want to try it, you will
    have to download and install it yourself. Now that you have set up your machine
    to connect to the Internet, however, you can easily do this after going over the
    contents of Chapter 6 (OK, so I''m jumping the gun bit again). Just do a search
    in the Ubuntu Software Center for thunder, click the Thunderbird Mail/News item
    once, and click Install to install it. You may be asked to type the password for
    your Ubuntu user account, so that and click Authenticate. Once it is installed,
    you can run Thunderbird by selecting Applications > Internet > Thunderbird Mail/News.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'As I mentioned, both Evolution and Thunderbird are equally capable and possess
    essentially the same features in terms of mail handling. The difference is primarily
    a look-and-feel matter. Why not try both Evolution and Thunderbird and see which
    one you like?


    By the way, if you find that you prefer Thunderbird to Evolution, you can add
    a panel launcher for it to make things easier on yourself when you run the program.
    Just go to Applications ▸ Internet ▸ Mozilla Mail/News, right-click that entry,
    and then in the pop-up menu that appears, select Add this launcher to panel.


    # Chatting with Your Friends via Empathy


    Email is an extremely useful tool, but there''s often quite a delay between sending
    a message and getting a response. If you just fancy a quick chat? That''s instant
    messaging (IM) comes in. If you''re not familiar with the concept, all you do
    is find your friend on an IM network and type a message to them. Your message
    will show up on their screen in the blank of an eye. They can reply to it, and
    you receive their reply just quickly. So if you continue, you say goodbye and
    disconnect from the network.


    There are lots of different IM networks out there, such as AIM, MSN/Windows Live,
    and Yahoo! Messenger. You can usually talk to those people who are using the same
    network as you, and you''ll need an IM application to connect to any of them.
    Ubuntu comes preinstalled with a fully featured IM client called Empathy, which
    has the ability to connect to multiple networks at once.


    # Starting a Chat


    For this section, I''m going to assume that you already have a user account on
    an instant messaging network. If you don''t, you''ll need to go to the network''s
    website and sign up (most of them are free). Now that you have your account details,
    let''s get Empathy connected to your chosen network:


    +   1. Select System ▸ Preferences ▸ Messaging and VoIP Accounts. The Empathy
    Accounts window will open.


    +   2. Choose Yes, I''ll enter my account details now, and click Forward.


    +   3. Select your IM network from the drop-down list at the bottom of the window,
    and then enter your account details (Figure 5-14). You''ll normally need to enter
    your username and password.


    +   4. Choose the No, that''s all for now option at the bottom of the window,
    and then click Forward.


    +   5. You''ll be asked to enter your personal details. These are used to enable
    a feature that lets you talk to other people connected to the same local network
    as you—just enter them for now, choose a nickname, and click Apply. The Accounts
    window will disappear.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Messaging and VoIP Accounts Assistant


    # Enter your account details


    What kind of chat account do you have?


    What is your Google ID?


    Example: user@gmail.com


