    or iPod. Basically, this is the process:


    +   1. Connect your computer and Android-powered device using the USB cable that
    came with it.


    +   2. A “USB Connected” notification should appear on the notification bar at
    the top of your phone''s screen. Drag down the notification bar, and then touch
