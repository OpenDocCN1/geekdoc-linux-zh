    Figure 8-2: The new user account displayed in the Users Settings window


    # # 8A-2: Logging In to Your New Account


    To use this new account, click the power button at the far right of the top panel,
    and click Log Out. A countdown will appear, but you can skip that; just click
    the Log Out button. After a few seconds, you will be back at the login screen.
    Click your username in that window, type the password for the account, and press
    ENTER. You will soon be at the new, untouched desktop.


    When you log out of a user account, all the programs you have running will be
    closed—if you were planning to use a different account for only a few minutes,
    it can be annoying to have to open everything when you get


