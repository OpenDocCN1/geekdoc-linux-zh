  md: '# What Is a Plan?


    I also mentioned that the results said I had no plan, so you may also be wondering
    that is all about. A .plan file is a small file kept in your home folder that
    other users see when they use the finger command on you. Traditionally, a .plan
    file contained information about where you were going to be or what you were working
    on. These days, however, most people use them to leave old little messages, quotations,
    or whatever makes what happens after they do in signatures. Take a look at Figure
    9-4 to see what happens after I add a .plan file to my home folder.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_196_0.png)


    Figure 9-4: Output from the finger command with a plan


    You can now see my plan, which is a quotation from Kurt Vonnegut The Sirens of
    Titan (or Al Stewart''s song by the same name, for that matter), though you can
    put anything in your own. You will get the chance to create your own plan file
    in Project 9SA, so if this all seems fun to you, just hang in there.


    Before moving, I should mention that you can also use the finger command to do
    a little domestic espionage of sorts. Let''s say your friend, Chris, has a user
    account on your machine. Chris, who wants your permission to go to the movies,
    claims to have been hard at work on the computer all day writing a report for
    school. Having your doubts, you could type finger chris to see what the facts
    actually are. It may be a bit understated and rotten, it works both ways; others
    can check up on you as well. You can try it by seeing the time you logged in to
    your graphica account (assuming you created such an account in Chapter 8). Just
    type finger graphika, and then press ENTER.


    You can even use the finger command to find out about people on other systems,
    providing their network''s finger service is active and you know their email address.
    Typing something like finger username@hostname.com would do the trick. It''s kind
    of cool but also kind of spooky, I suppose.'
  merge: -1
