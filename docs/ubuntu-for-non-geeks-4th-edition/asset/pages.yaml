    # 8B-7: Changing Window Borders, Controls, and Icon Sets


    Now we get to my favorite part of this journey through the world of digital cosmetic
    surgery—changing the window borders and controls in GNOME. The procedure is really
    quite easy. Select ► Preferences ► Appearance. The Appearance Preferences window
    will open to the Theme tab, you will find a list of the themes that are installed
    on your system (Figure 8-10). The default theme in Lucid Lynx is *Ambiance*, but
    as you can see, there are others.


    To get the hang of it take a look at each of the themes by clicking one by one.
    The changes will take effect immediately. Just clicking a theme will change your
    window borders, controls, and even, if you take a peek in your home folder, the
    icons. This is especially noticeable when you click Dust Sand or New Wave.


    Each theme consists of a window border, a set of controls, and a collection of
    icons. It is also possible to mix and match these elements on your own. For example,
    let''s say that you like the subdued color and color of the controls in Dust,
    but you prefer the icons in Clearlooks and the borders in Dark-Room. Well, you
    needn''t despair, because you can create a custom theme consisting of these three
    different elements.


    To create your own mix-and-match theme, click the Customize button on the Theme
    tab of the Appearance Preferences window. A new window will open, where you will
    find five tabs: Controls, Colors, Window Border, Icons, and Pointer (Figure 8-11).
    From each of these tabs, you can select the components you prefer. For now, let
    click the **Controls** tab and select Dust. Then click the **Window Border** tab,
    and select **DarkRoom**. Finally, click the **Icons** tab, and select **GNOME**.


    Chapter 8'
