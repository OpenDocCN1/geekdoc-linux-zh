- img_proc: true
  md: 'NOTE If you experience working with other Linux distributions, you may be surprised
    to learn that the root account is disabled by default in Ubuntu. There is, therefore,
    no installation step for inputting a root password. You can check the forums (http://www.ubuntuforums.org/)
    to learn ways of getting around this setup. You can also set a root password later
    at any time after the system is installed, so if having a root account is important
    to you, don''t worry.


    # Dual-Booters Take Note


    If you are creating a dual-boot setup, it is a good idea to defragment your Windows
    disk before moving on to installing Ubuntu. This step isnt strictly necessary,
    but it can make the repartitioning phase of the installation process a little
    faster, and it helps guard against unwanted surprises.


    If you are using Windows Vista or Windows 7, your system is set up to automatically
    defragment your hard disk on a regular basis, so you should be good without any
    additional effort on your part. On other versions of Windows, you''ll have to
    defragment your disk manually. In Windows XP, you can do this by double-clicking
    **My Computer**, right-clicking the icon for your hard disk, and selecting **Properties**.
    You can then defragment your hard disk using the **Tools** tab in the Properties
    window and clicking the **Defragment Now**. In Windows 2000, you can do this by
    going to the **Start** menu and selecting **Control Panel** > **Administrative
    Tools** > **Computer Management** > **Disk Defragmenter**, while in Windows 98
    and some other versions, you can do the same by selecting **Programs** > **Accessories**
    > **System Tools** > **Disk Defragmenter**. Defragmenting can take quite a while,
    so you might want to leave it overnight.


    # Doing the Deed


    Well, now that I''ve covered all preliminary stuff, let''s get down to the actual
    Linux installation. Set this book on your lap so you can follow along, and then
    get ready for action. It''s time to do the deed!


    Fortunately for you, the installation process is extremely easy, because there
    are very few steps in which you actually have to do anything. Most of what you
    will do is clicking buttons on your screen.


    Of course, when you look at the directions and descriptions listed here, it may
    look like a long and cumbersome process. It is not. It will be over more quickly
    than you can imagine. As a beginner frequently referring to this text, you might
    take a bit longer, of course, but in all, the whole process is faster and easier
    than for Windows or Mac OS X. And keep in mind that with Windows and OS X you
    are installing the operating system with just a few bundled applications. In an
    Ubuntu installation, on the other hand, you are installing not only the operating
    system itself, but also most of the applications you will ever want or need to.
    Use this will then be getting a lot done in one fell swoop.'
