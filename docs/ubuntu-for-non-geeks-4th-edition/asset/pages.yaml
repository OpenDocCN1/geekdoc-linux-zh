    # Virtual Desktops


    It is now to discuss a rather convenient feature of Linux: virtual desktops. Although
    the virtual desktop feature has only recently made its way into other operating
    systems, it has a Linux feature for years (yes, it started here, (folks)). Rather
    than babble about what this virtual desktop business is and what it can do for
    you, it is probably best to have you learn about it by giving you some hands-on
    experience.


    In your GNOME panel, click the Wanda (Fish), OpenOffice.org Writer, and Firefox
    launchers. You will then have three windows in your present desktop, or workspace.
    Now look at the Workspace Switcher to the right of the bottom panel. There should
    be four boxes, with one on the left (your present workspace) in light gray. If
    you click the box next to that, in dark gray, all your open windows suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your other windows are still open and running in the previous desktop.


    Chapter 3'
