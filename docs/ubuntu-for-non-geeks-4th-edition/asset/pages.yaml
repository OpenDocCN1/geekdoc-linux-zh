  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_441_0.png)


    # # INSTALLING UBUNTU FROM A USB FLASH DRIVE


    ![](img/35405f17cef8b43ddf1af3fc22de194c_441_1.png)


    If you have a netbook or some other computer that doesn’t come with a CD drive,
    don’t worry: You can install Ubuntu using a USB flash drive. Booting from a USB
    drive can be a little more involved than simply booting from a CD or using Wubi,
    but once the installer is up and running, the installation process is identical.
    I’m going to assume that you’re using Windows for the rest of this appendix, but
    it’s possible to create a USB install disk with other operating systems too; see
    https://help.ubuntu.com/community/Installation/FromUSBstick/ for instructions.


    NOTE Some older computers don’t have the ability to boot from USB disks. If this
    is the case, you won’t be able to use this method to install Ubuntu. Other alternative
    installation methods are available, such as downloading Wubi directly; see https://help.ubuntu.com/community/Installation/
    for a list of options.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Preparing the Installer Files


    First, you''re going to need a flash drive with sufficient capacity to hold the
    Ubuntu installer: About 2GB should do it. Make sure that you don''t have any files
    on the flash drive—either you''re formatting the drive, so any files on there
    will be permanently deleted.


    Next, you''ll need to download an Ubuntu CD image. If you''re feeling clever,
    you can use your CD-burning software to make an .iso image from the CD provided
    with the book, but otherwise head over to http://www.ubuntu.com/getubuntu/download/,
    select your location from the drop-down list, and click Begin Download to download
    an Ubuntu CD image. The image is large around 700MB, so it might help to squeeze
    it down your Internet connection.


    Sometimes, large downloads don''t finish properly, and you could be left with
    an incomplete CD image. An easy (but not foolproof) to check whether the image
    downloaded correctly is to open the folder where you saved it, rightclick the
    image, and select Properties. Check that the size of the image file is almost
    700MB (690MB, say).


    The final thing you need is the software used to put the installer into the USB
    drive. Use your web browser to download the Universal USB Installer from http://www.pendrivinux.com/downloads/Universal-USB-Installer/Universal-USB-Installer.exe.


    # Creating a Bootable Disk


    With the installation files downloaded, you''ll now be able to make a bootable
    Ubuntu flash disk. Plug your USB drive into the computer, and follow these instructions:


    +   1. Double-click the Universal-USB-Installer.exe file you just downloaded and
    then run it.

    2. A License Agreement screen will appear. Click I Agree, and you''ll be taken
    to the Setup Your Selections page.

    3. When it says Step 1, choose Other Live Linux ISO from the list.

    4. Click the Browse button under Step 2, and find the Ubuntu CD iso image that
    you downloaded earlier. Click once to select it, and then click Open.

    5. Under Step 3, select your flash drive from the list (make sure it''s the right
    one; otherwise, you could wipe a bunch of important files from some other disk!),
    and check the box to say that you want to format the drive. Your screen should
    now look like the one in Figure A-1.

    6. Click Create, and wait for a few minutes until the installer is on the disk.


    Once the process has finished, close the Universal USB Installer window, and safely
    eject your flash drive, as you would normally.'
  merge: -1
  pgno: 442
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_443_0.png)


    Figure A-1: Creating a bootable USB install disk


    # # Booting from the USB Disk


    Now, plug the flash drive back in, and restart the computer. This is where you
    find out whether you''re set up to boot from USB drives—if you get a purple Ubuntu
    boot screen, you''re all ready to go! The rest of the process will be the same
    as the usual installation from CD, which you can read about Chapter 2.


    If your computer boots back into Windows (or whatever operating system you''re
    using), you''ll need to change some settings to get it boot from the flash drive.
    Restart the computer, and look at the screen for text that lead to the boot order
    or BIOS settings for your computer. You will normally have to press a key (such
    as DELETE, F2, or ESC) to access these settings, but this very depends on the
    make and model of your computer. More information on accessing your BIOS is given
    in Chapter 2.


    Once you''ve found the settings screen, find the option where you can choose to
    boot from a USB drive (that is, make the USB drive the first boot device), save
    your changes, and restart. Ideally, you''ll be taken to a purple Ubuntu boot screen.
    In case, head over to Chapter 2, and continue the installation as normal.


    If you run into any problems, take a look at https://help.ubuntu.com/community/Installation/FromUSBStickQuick/
    for hints and tips, or head over to the forums (http://www.ubuntuforums.org/)
    for advice.'
  merge: -1
