  md: '# 20


    # A COLONY OF PENGUINS


    The Ubuntu Community


    ![](img/35405f17cef8b43ddf1af3fc22de194c_391_0.png)


    One thing that really sets open source apart from the commercial software world
    is the importance placed on the community. This can include pretty much anyone
    who has anything to do with the software: the people who use it, the people who
    design it, the people who help others with problems . . . every last of them is
    a valued community member.


    Consider the commercial software world, where things tend to be quite top-down.
    When you have a problem, you go to some company that provides you with support.
    This company probably also designed and sold you the software, and you probably
    played no part in that process—you’re the customer; they’re the vendor. Open source
    is different: Rather than one business aging, everyone patches together and helps
    each other. People write software and fix faults because it helps other people
    and because they want to help. Everyone can play their part in offering feedback
    and suggestions and helping others with problems, and no one is in absolute control
    of the whole process. All in all, it’s much more democratic and, in my opinion,
    much more fun!'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'The Ubuntu community in particular is large, vibrant, and notoriously friendly.
    In this chapter, you''ll learn how to get the most out of it and how you can play
    your part by joining in and giving something back (if you like).


    # Take Me to Your SABDFL


    Open source communities tend to have a well-defined structure, and Ubuntu is no
    exception. At the top of the pile is Ubuntu’s founder, Mark Shuttleworth, whom
    you met in Chapter 1. He’s the Self-Appointed Benevolent Dictator For Life (SABDFL),
    and according to http://www.ubuntu.com/community/ubuntustory/governance/, his
    role is to “provide clear leadership on difficult issues and set the pace for
    the project.” This does not mean that he makes all of the plans and decisions—that’s
    more the job of the Technical Board, a group of senior Ubuntu contributors who
    figure out what shape the next Ubuntu release will take. Mark is just there to
    step in if no one can agree.


    There’s also the Community Council, which oversees the teams of contributors who
    make up the bulk of the project. There are lots of teams with all sorts of responsibilities:
    The Documentation Team writes the documents for each release of Ubuntu, the Installer
    Team looks after the software used for installing Ubuntu, and so. You can find
    a list of them at https://wiki.ubuntu.com/Teams/ Teams consist of members from
    all over the world (Figure 20-1), and people on the team may have all sorts of
    responsibilities: Developers, for example, are the people who write and update
    the software. Last, but certainly not least, are the millions of Ubuntu users
    worldwide who form the biggest part of the community. This group includes you!


    ![](img/35405f17cef8b43ddf1af3fc22de194c_392_0.png)


    Figure 20-1: A world map showing the locations of the members of the Ubuntu Documentation
    Team'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'Everyone who participates is expected to abide by the Code of Conduct (http://www.ubuntu.com/community/conduct/),
    and people who make changes to the project (like developers) are asked to sign
    a copy of this document to show their commitment to the principles of Ubuntu.
    One final note: Ubuntu is a meritocracy, where the people who contributed most
    to the project get the biggest say. The most prolific contributors are awarded
    with Ubuntu membership (if they apply for it) and benefit from such perks as an
    ubuntu.com email address.


    # Launchpad: Your Passport to the Ubuntu Community


    Every open source software project needs a place to call home. In Ubuntu’s case,
    this is Launchpad, a sort of project information on steroids. Whether you want
    to report a problem, ask for help, design a new feature, or write your own program,
    Launchpad is where you go.


    Fire up Firefox, and browse to http://www.launchpad.net/. Unless you''ve signed
    up before, you''ll need to register for an account, so click **Log in / Register**
    at the top of the page, and answer the questions under the "Registered yet? Heading.
    Hit Register, and check your email for details on how to finish up. When the message
    arrives, click the first link, find your details, and click **Continue** on the
    page you got sent to so you can start using your account.


    Once that''s all and dusted, click your name in the top right of the page to see
    your profile. It''s probably looking pretty empty at the moment, apart from a
    bunch of three-letter acronyms and a mysterious invitation to change your "branding."
    Click one of the round, yellow pencil icons to changing your details. You can
    put as much or as little information on your account as you want—for, if you''d
    like to be able to find you on IRC (see "Chatting with IRC" on page 367), make
    sure you enter your nickname on the page (Figure 20-2). Otherwise, you can leave
    most blank.


    If you''ve created your account, you might notice a sad little zero hanging around
    the "Karma" section. Fortunately, it''s not karma of metaphysical sort, and your
    eternal soul isn''t in any danger. Rather, it''s a points system for recognizing
    people who have made Ubuntu better. The more you contribute, the more karma points
    you get, and hence the greater your bragging rights over your Ubuntu-obsessed
    friends (that''s all of them, right?). Check out https://help.launchpad.net/YourAccount/Karma/
    for details on how it all works.'
