  md: '# Some Goofy Yet Useful Fun with the Command Terminal


    A rather cool thing about typing in the command Terminal is that it has what you
    call short-term memory. Try it by typing the word cherry and pressing ENTER. Ignoring
    the command-not-found message, go on and type vanilla, and press ENTER. Now type
    gelato, and press ENTER. So far, so dumb, right? Not really. Let''s type everything
    you typed for again, but this time let''s do it with one key.


    Huh?


    Yes, just press the up arrow key once, and what do you see? That''s the last command
    you typed appears, which in this case would be gelato. Press the up arrow key
    again, and the command that you typed before that appear—vanilla. One more time?
    Yes, cherry. And one more time for the finale ... I like cherries so very much.


    Considering what we have thus far, this may all seem a bit silly, imagine that
    you''re not typing goofy little words and instead have to deal with considerably
    longer strings, as a simple copy command (which you''ll learn about in this chapter)
    like this:


    ```

    cp mypics/stpierre/coastal/onthebeach1_27.jpg /home/frog/photos_for_mom/stpierre

    ```


    By typing that, you are copying an image called onthebeach1_27.jpg from the coastal
    folder to another folder called stpierre. If you wanted to copy another photo
    into the coastal folder, onthebeach1_16.jpg, for instance, you could simply press
    the up arrow key once, use the left arrow key and DELETE key to move over and
    delete the 27, and replace it with 16. All in all, it would be much simpler and
    much faster. It would also help you avoid mistakes in typing. Not so dummy, eh?


    # Nontoxic Commands


    As you know now, all of this typing is easy enough, but to actually do something
    useful with your Terminal, you need to type commands—and there are more of them
    than you could ever hope or know to. To get you started, we will begin with some
    commands that are easy to understand, nontoxic, and completely kitten-friendly.


    # $whoami


    There is no command as easy, safe, or even as seemingly useless as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami whoami tells you which user is currently logged in. Try
    it by typing whoami after the $ and then pressing the ENTER key. Remember that
    commands are case sensitive.'
