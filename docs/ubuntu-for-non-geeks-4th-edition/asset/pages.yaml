    # Use an Older Kernel


    Some freezes occur because of problems with kernel updates or drivers. You can
    try using an older version of the Linux kernel if you have one installed. Take
    a look at “If Update Ruins Your Day . . . System” on page 84 for instructions
    on running an older kernel.


    # Use Rescue Mode


    If you''ve asked for help online, chances will be called upon to type some commands
    to fix your computer. There''s no way of entering any commands if you can''t get
    it to start up, though, you''ll need to use the rescue mode to get yourself to
    a command line.


    Restart your computer, and, as quickly as you can, hold the SHIFT key until GRUB
    boot menu appears like the one in Figure 21-5. If you have a dual-boot setup,
    you''ll be seeing this boot menu again. Then, use the keyboard to select the topmost
    item with (recovery mode) in its name, and press ENTER. Text will flash the screen
    for a while, and you''ll be left at the Recovery Menu.


    Use the arrow keys to highlight the netroot option, and press ENTER. After some
    time passes by, you''ll be dropped to a root command line, which says something
    like root@:~# and a blinking cursor. Here, you can type commands that can help
    fix your computer.


    In particular, you might like updating your system to see whether subsequent updates
    fix your problem. (This will work only if you''re connected to the Internet).
    Type apt-get update; then press ENTER, and wait for the list of packages to be
    updated. Then, type apt-get dist-upgrade to see if any more updates are available
    for you to install.


    NOTE Wireless Internet connections are unlikely to work in recovery mode. Plug
    your computer in with an Ethernet cable if you can.


    Chapter 21'
