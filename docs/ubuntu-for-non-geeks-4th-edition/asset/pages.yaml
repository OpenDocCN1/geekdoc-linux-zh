- img_proc: true
  md: '# 9D-5: Cleaning Up and/or Uninstalling Xmahjongg


    Once you are done and everything seems to be working as it should, you would normally
    tidy things up in the Xmahjongg folder by getting rid of any unnecessary files.
    You can do this via the Terminal using the cd command to go back into the Xmahjongg
    folder, typing *make clean*, and pressing ENTER.


    If you want to uninstall Xmahjongg, open a Terminal, go to the Xmahjongg folder
    by using the cd command, typing *sudo make uninstall*, and finally press ENTER.
    The routine is essentially the same for any applications installed in this way,
    though as you might imagine, uninstallation isn''t as smooth as a process that
    I''ve just described (and it''s definitely not easy as it is the Ubuntu Software
    Center).


    The main reason for the uninstallation process being less cooperative is that
    the make uninstall routine requires you to keep the original project folder, which
    means you have to keep a bit of clutter you normally wouldn''t need to bother
    with. On top of this, some projects do not provide a uninstall routine at all.
    This means that you have to keep track of whatever has been installed and then
    remove each item using a series of sudo commands.


    All that negativity aside, go ahead, have some fun, and your command-skills will
    tell you. You''ll have something to tell your grandkids about in the future.


    # Customizing the Terminal


    The Terminal is a very simple application in terms of looks, though you can spice
    things up a bit if you''re so inclined. Not only can you change the background
    and text colors in the Terminal, but you can even display one of your favorite
    photos as a background (as shown in Figure 9-19) or make the background transparent.


    To change the Terminal background, go to the Terminal, and select **Edit > Profiles**.
    When the Profiles window appears, select the profile you want to edit, which would
    be Default, and then click the **Edit** button. In the Editing window that appears,
    click the **Background** image (Figure 9-20), and then navigate to the photo you
    want to use as your background by clicking the Menu button next to the Words Image
    file and then finding the file in the Select Background Image window. When you''ve
    found the photo of your choice, click **Open**. You may find it difficult to see
    the text once your image appears in the Terminal. If so, try moving the slider
    under the words *Shade transparent or image background in the Editing Profile
    window. If that still doesn''t do the trick, click the **Colors** tab, deselect
    **Use colors from system theme**, and then try some of the preset Foreground and
    Background combinations from the menu button to the words Built-in schemes.'
