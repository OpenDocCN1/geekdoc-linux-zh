- img_proc: true
  md: 'The reason for this is simple. Although iTunes allows you to add files to your
    iPod, it does not allow you to copy files from it. The auto-update feature is
    strictly a one-way street, means whenever you hook up your auto-update-enabled
    iPod to an iTunes-enabled computer, iTunes will automatically add the tracks in
    its library to your iPod; more frighteningly, it will remove any tracks from your
    iPod that are not present in that machine''s iTunes library. I learned this hard
    way when I took my loaded iPod to work and plugged it into my Windows box which
    completely emptied iTunes library. When I brought the limited Podster back home
    to it with nothing at all on, ... what wasn''t synes?


    Make sure to disable your iPod''s auto-update function before bringing the device
    into the Linux world. To do this, connect your iPod to your Mac or Windows machine,
    and open iTunes. In the left pane of the iTunes window, click your iPod in the
    Devices section, and then in the Summary tab in the right pane, check the box
    to the words Manually manage music (or Manually manage music and videos in video-capable
    iPods), as shown in Figure 15-2. If you have a photo-capable device, repeat nearly
    the same process for your photos by clicking the Photos tab in the right pane
    and unchecking the box next to the Sync from photos.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_316_0.png)


    Figure 15-2: Disabling the auto-update function on your iPhone/iPod in iTunes


    # Working with Android-Based Phones


    Although the iPhone continues to be the king of the smartphone world, it now has
    some strong competition from phones running Google''s Android operating system.
    Fortunately, working with your Android-powered device in Ubuntu


    280 Chapter 15'
