    Once the burning gets underway, your progress will be shown in a new window, and
    when the job is done, you will be asked what you would like to do next. Assuming
    you are done with your disc burning for the day, click Eject and then **Close.**.


    In case you are wondering, the discs you burn in Linux will be readable in other
    operating systems.


    # Dealing with CD-RWs


    CD-RWs are pretty much like CD-Rs except that they can be erased and written to
    again. They are also a bit more expensive than CD-Rs and, generally, cannot handle
    faster speeds.


    Using CD-RW is much like working with CD-Rs. If the disc is blank, there is no
    difference in the process at all, which makes things quite simple. And, even if
    the CD-RW already has data on it that you want to replace with some-else, the
    process is only slightly different.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'One of these differences is that Nautilus will treat your CD-RW as a regular
    data disc rather than a blank one. This means that when you pop your disc into
    the drive, a regular Nautilus window will automatically open, rather than a CD/DVD
    Creator window.


    To write the disc, you will need to switch from the Nautilus window to a CD/DVD
    Creator window, which is easily done by selecting **CD/DVD Creator** in the Go
    menu of Nautilus window opened for that. If you can''t see a CD/DVD Creator option,
    click **Go ▶ Location** and type `burn:/// to the location bar (followed by ENTER)
    instead. the disc will become a CD/DVD Creator window. Drag the files you want
    to burn to CD to that; once you are ready to burn, click the **Write to Disc**
    button.


    As is the case with regular CD-Rs or DVDs, a CD/DVD Creator window will appear.
    When you click the **Burn** button in that window with a used CD-RW in the drive,
    however, a slight difference occurs. At this point, a new window like in Figure
    7-13 will appear telling you that this disc has files already written on it. Click
    the **Blank Disc** button in that window, and the CD/DVD Creator will erase the
    files on the CD-RW and replace them with the new ones that you dragged to the
    CD/DVD Creator window. Not bad at all, eh?


    ![](img/35405f17cef8b43ddf1af3fc22de194c_145_0.png)


    Figure 7-13: Erasing a CD-RW with Nautilus


    # Burning ISO Images to Disc


    When you download Ubuntu or other Linux distributions from the Internet, you usually
    download them in the form of one or more disc images, which are commonly referred
    to as *ISOs* because such files end in the .iso extension. An ISO is an image
    of a CD''s file contents, which means that it is the CD minus the itself. To put
    it another way, if CDs have souls, the ISO would be the soul of a CD; take away
    the CD''s metal and plastic, and the remaining data would be an ISO.


    Because it is impossible to download a physical CD over the Internet, the bodeless
    ISOs are the next best thing. For example, to get a working copy of Ubuntu from
    the Web, you usually need to download an ISO, which you then burn onto a blank
    CD in order to give the images their bodies back, to speak. In the process, you
    create the working installation disc that you need to install Ubuntu.'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'Fortunately, burning an ISO to disc is a pretty simple chore. Just open a Nautilus
    window, and locate the icon for the ISO file you want to burn disc. Right-click
    the ISO file, and in the pop-up menu that appears, select **Write to Disc**. Once
    you do this, the Write to Disc window will appear; just click the **Burn** button,
    and you''ll be on your way.


    # Creating Your Own ISO Images


    While on the topic of ISOs, it is good to know that you can create ISOs of your
    own. Of course, you''re probably not going around creating your Linux distros,
    but you might come up with a set of files that you need to repeatedly burn disc
    now or in the future. To create your own ISO, follow the normal process for creating
    a data CD, but when the Write to Disc window (Figure 7-12) appears, select **Image
    File** in the drop-down menu below the words *Select a disc to write*. After,
    click *Properties*, which will open a new window asking for a filename for your
    new disc image. Give it a name, click **Close**, and hit the **Burn** button.
    In a very short time, you will have your own creation.


    # Burning Multisession CDs


    If you are coming from the Windows environment, you are no doubt familiar with
    multisession CDs. These are CDs on which data is added one session at a time.
    For example, you burn a few files to disc today and add a few more to the disc
    tomorrow and a few more files the day after that. Each time you burn additional
    files to the same disc, you are adding a session, which explains the name *multisession*.
    Think of them working like floppy disks (albeit with considerably more capacity).


    Nautilus has basic support for multisession discs, but let''s try something a
    little more specialized this time: Brasero, which is a more fully featured application
    that you can use for all of your disc-burning chores.


    You can run Brasero from the **Applications** menu by selecting **Sound & Video
    ► Brasero Disc Burnner**. In the main Brasero window that opens, click the **Data
    project** button.


    To burn the first session to CD, drag the files you want to burn into Nautilus
    the Brasero window (Figure 7-14), or click the **Add** button (which looks like
    a +) on the Brasero toolbar to browse for files.


    When you have all the files in place that you want to burn, plug a blank disc
    into the drive at the bottom of the screen, and click the **Burn** button. A Properties
    window will appear. In that window, check the **Leave the disc open to add other
    files later**.this is the step that sets up a multisession disc.) Once you''ve
    done that, click **Burn** to start the burning process. Brasero will eject the
    disc when the burn complete.


    Chapter 7'
