    # # Simulators


    Waging war isn''t everyone''s idea of escapism, which is why an extensive collection
    of simulation games are available for Linux. I''ve tried to cover as many bases
    possible in this section, but as always, you should peruse the Ubuntu Software
    Center if you don''t see anything here that appeals to you.


    When I think of simulation games, my mind immediately jumps to Sim City, the venerable
    city-building game. As the mayor, you are in charge of running your city: Plan
    construction work, build and maintain transport links, and set budgets and taxes.
    Throw the old natural disaster into the mix, and you have a challenge on your
    hands! The equivalents of Sim City are LinCity-NG and OpenCity. I prefer LinCity
    (Figure 17-12)—the graphics seem friendlier and more cartoonish—but you should
    try both and decide for yourself. The original Sim City game is available too,
    if you don''t mind playing game with old-fashioned graphics. Search for Micropolis
    in the Ubuntu Software Center (it was renamed for legal reasons).


