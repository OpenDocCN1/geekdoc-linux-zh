    # Working with Other Digital Media Players and Cells Phones


    Although the iPod may be the most popular digital media player out there

    the iPhone holds the crown in the smartphone market, they are by

    means the only games in town. As I have already shown, Android-based phones

    are quite popular, and there are other devices, ranging from simple

    $15 MP3 players to the Linux-based Palm Pre cellular phone.


    How to work with these devices in Ubuntu vary by device, but for the

    most part, they should work in the same manner as an iPod or Android

    device or in the same manner as a USB device. The Palm Pre, which\uses a Linux-based
    operating system, works in Ubuntu in the same way as the

    iPhone, with the $19 MP3 player I bought at Depot acts like a

    thumb drive. The simplest way to see how your device will work is

    connect it to your computer via a USB cable. If windows ask you how

    deal with the device do not appear, open a Nautilus window to see whether

    you find an icon for the device. If so, you can work with your device

    using the tried-and-true-drag-and-drop method. You can also use Rhythmbox

    to work with the audio files on your generic device by doing the following:


    +   1. Create a Music folder if there isn''t one on the device.

    2. Right-click the Music folder, and select Open with Other Application.

    3. In the open window, select Rhythmbox (Figure 15-4), and then clickclick Open.


    # Managing Your Audio Device’s Files with Rhythmbox


    As''ve already mentioned, Rhythmbox is set as the default application for

    iPhones, iPods, Android-powered devices, and, one way, or another,

    other music players in Ubuntu. Once Rhythmbox is up and running, things

    work perfectly much as you do in iTunes.


    +   - To view the contents of your iPod or other device, click the icon for the

    device in the left pane of the window. The contents of the device will then

    appear in the right pane of the window.

    - To copy a song from your library to your device, just click Music in the

    Library section of the left pane, and then drag the artists, albums, or sin-

    g tracks you want from the right pane to your device’s icon in the left

    pane. The copy progress will be shown in a bar in the lower-

    right of the Rhythmbox window (Figure 15-5).'
