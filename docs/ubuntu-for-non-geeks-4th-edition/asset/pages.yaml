  md: '# Installing Additional Wallpapers


    As you can see if you hover your mouse over it, the default wallpaper in Ubuntu
    is called Ubuntu. If purple blobs aren''t your style, click any of the other wallpapers
    to immediately change the wallpaper on the desktop. There are a few to choose
    from, but maybe you''d prefer to use some images of your own. These could be photos
    from a digital camera, works of art that you created. In this case, however, you
    are going to venture out onto the Web to get whatever you want to put there. and
    then install some wallpaper.


    A number of sites provide free desktop wallpaper—two specifically geared toward
    Linux are http://www.gnome-look.org/ and http://art./, but you can get wallpaper
    from wherever you like. Astronomy Picture of the Day (http://apod.nasa.gov/apod/)
    is a particular favorite of mine. If you want to follow along using the same bigger-than-life
    wallpaper that I use, however, go directly to the wallpaper image by pointing
    your web browser to http://www.tainati.com/linux/index.php, scrolling the page
    a tad to the select TUX section, and then clicking the download next to the image
    size that matches your screen. When the picture appears in the browser window,
    right-click it, and then select Save As. In the Save Image window, it gives an
    easy-to-remember name (wall_TUX_2_1024x768.png may be exact, but it might prove
    a bit much to deal with otherwise), or you can download any wallpaper however
    you like, as long as it is in a supported format, such as BMP, PNG, or JPEG. It''s
    all up to you.


    Once you''ve downloaded your wallpaper, move it from the Downloads folder into
    your Pictures folder. You may want to create a Wallpapers subfolder to keep things
    organized, but that''s up to you, too. After that, you can install the new image
    by going to the Background tab in the Appearance Preferences window and clicking
    the Add button. In Add Wallpaper window that appears, navigate to your new wallpaper,
    click to highlight it, and then click Open. The wallpaper will then appear highlighted
    in the Appearance Preferences window and will soon reappear on the desktop (Figure
    8-7). Once it does, click Close to complete the process.


    # Wallpaper from Internet to Desktop—Quick and Easy


    It''s also possible to automatically set an image from the Web as your desktop
    wallpaper by right-clicking that image within your web browser and then selecting
    Set Desktop Background. A small window will appear, in which you can preview what
    the download will look like (for example 8-8). You can also adjust the position
    (tiled or centered) and background color for your desktop in this window. Once
    you''re making adjustments, click the Set Desktop Background button. The image
    will then appear on your desktop, while the file will be saved to a download location
    (your home folder, by default) with the title Firefox_wallpaper.png.'
  merge: -1
