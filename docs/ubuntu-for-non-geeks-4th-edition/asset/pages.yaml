  md: '# About Rickford Grant


    ![](img/35405f17cef8b43ddf1af3fc22de194c_184_0.png)


    Figure 8-22: The About Me window


    #  8D-3: Logging In Automatically


    While you''re tinkering with the login screen, it seems like a good idea to mention
    some of the other login-related options that you can change. Log in your user
    account again, and select **System > Administration > Login Screen**. Click the
    **Unlock** button, and type your password to gain access to the settings in the
    Login Settings window that appears.


    If you''re the only person who uses the computer, you can save time by having
    your user account automatically log when the machine starts up. Select the **Log
    in as** and choose your username from the drop-list (it should be selected automatically).
    If you''re not the only user but you''re the person who uses the computer for
    most of the time, there''s also a setting to give others a chance to log in before
    you''re logged in automatically. Check **Allow 30 seconds for anyone else to log
    in first**, and change the amount of time you''d like GDM to wait for the one
    logging you in.


    The last option in this window (the one about default sessions) can be used to
    switch between different desktop environments. As you know, Ubuntu uses the GNOME
    desktop by default, but you can install others like KDE and Xfce. That''s a bit
    of a teaser for you be—if you want to perform the little customization and change
    the whole desktop environment, this is one of the settings you''re going to need.
    Changing desktops is beyond the scope of this book, though, so I''m just going
    to leave it there! (If you''re interested in trying a different desktop environment,
    you might find *//help.ubuntu.com/community/FromUbuntuToKubuntu/** useful.)


    > **NOTE** If you''re not keen on the sound that plays every time you log in,
    uncheck the Play log-in sound option in the Login Screen window.


    148 Chapter 8'
