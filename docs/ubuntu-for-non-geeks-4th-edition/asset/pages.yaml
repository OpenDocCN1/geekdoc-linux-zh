  md: '# Sending Files by Bluetooth


    To send a file by Bluetooth from your computer to another Bluetooth-capable device,
    click the Bluetooth panel icon, and select Send files to device. A window will
    appear in which you can navigate to the target file. click Open. The Select Device
    window will then appear (Figure 7-19). Select the recipient machine, and click
    Send to. Your machine will begin transferring the file. If the recipient machine
    is set up to seek permission before accepting a Bluetooth file transfer, you or
    the recipient will have to perform the appropriate action on the recipient machine
    before the transfer can be completed.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_151_0.png)


    Figure 7-19: Selecting paired Bluetooth devices to receive sent files


    # Receiving Files by Bluetooth


    To receive files via Bluetooth from another Bluetooth-capable device, you have
    to first set up your device to allow such transfers. To do this, click the Bluetooth
    panel icon, and select Preferences. In the Bluetooth Preferences window, click
    the device you want to set up, and then click Receive Files. A Personal File Sharing
    window will then appear. In that window, check the box to the words Receive files
    in Downloads folder over Bluetooth. For your safety, select Only for set up devices
    in the drop-down menu button to the right of the words Accept files. Your window
    should look like that in Figure 7-20. If so, click Close. Your machine will then
    automatically receive files sent to it via Bluetooth and save them to the Downloads
    folder.'
  merge: -1
