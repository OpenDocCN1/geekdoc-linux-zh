  md: '# 16B-1: Installing Kino and Setting Up Your System


    The first and easiest step is to download and install Kino. Just go to the Ubuntu
    Software Center to do this. Once installed, you can take a look at Kino by selecting
    Applications > Sound & Video > Kino. At this point, you can use Kino to work with
    video files you already have on your hard disk and start capturing video. If,
    however, your camera connects to your computer via a FireWire (IEEE 1394) connector,
    you must perform a few steps the first time around your system can recognize the
    connection:


    +   Connect your camera to your computer using the FireWire cable that came with
    (or you were forced to buy for) your camera.

    Turn on your DV camera in play mode. Once you''ve done this, the raw1394 module
    will appear in your system''s /dev directory, though you won''t see any indication
    of this up front.

    After a few seconds, turn off your camera, but leave the cable connected.

    Open a Terminal window, type cd /dev, and press ENTER.

    In the same window, change the permissions of the raw1394 module so that everyone
    on your machine can read and write to it by typing sudo chmod +w raw1394 and pressing
    ENTER.

    Type your password when prompted, and press ENTER.


    If all goes without a hitch, you will be returned to your user prompt without
    any other messages appearing in the Terminal. You can then close the Terminal
    window.


    # 16B-2: Capturing and Editing Digital Video with Kino


    Once you have gone through the preparatory steps, you are ready to capture video
    from your camera. To do this, connect your camera to your computer (if it isn''t
    already connected), turn on your camera to Play mode, and start up Kino. Once
    Kino is open, click the Capture button to talk of the playback pane.


    Now you can use the playback controls located below the playback pane. These controls
    actually control the functions of your camera. Start by clicking the Rewind button
    until you get to the beginning of the video segment you want to capture. Once
    you get there, click the Play button, after which the video on your camera will
    play back within the window. When you reach the point at which you want to capturing,
    click the Capture button just above the play back controls in the window. Kino
    will start capturing your video to disk (in your home folder by default) and show
    you what it is capturing in the main pane of the window (Figure 16-9). To keep
    things easy to manage, the captured video stream will be split into several files,
    the number of which depends on the length of the video played.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_337_0.png)


    **Figure 16-9:** Capturing video from your digital camera with Kino


    When you get to the point where you''d like to stop capturing, click the Edit
    tab and use the Stop button. You can then view the captured video by clicking
    the playback controls at the bottom of the playback pane. You can also view the
    video in Timeline view (as shown in Figure 16-10) to navigate between the various
    segments of the video: Click the Timeline tab, click the segment you want to view,
    and then use the playback controls below the playback pane.


    If you feel like getting a bit arty, you can also try the effects in Kino (some
    examples of which are shown in Figure 16-11) by clicking the FX tab and then playing
    around with the various effects in the Video Filter. Make your choice, and specify
    the segment you''d like to convert (or at least experiment!) by typing the beginning
    and ending frame numbers in the boxes below the word Override. To see the results
    of the filter without saving the changes to disk, click the Play button. If you
    decide you want to convert the segment to keep the effect, click the Render button,
    and Kino will create a new file of just that segment. You can also double-click
    these files (as well as the original captures) to view them in Totem, which is
    better suited for viewing videos than Kino.


