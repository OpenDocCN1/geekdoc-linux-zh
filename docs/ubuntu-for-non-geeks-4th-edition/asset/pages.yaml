  md: '# ACKNOWLEDGMENTS


    There are a good number of people who deserve thanks for the help and support
    they provided either while or before this book was written, and there are still
    others whose help will come after the book is released. I (Rickford) would like
    to acknowledge all of them now.


    Starting with my family and friends, I''d like to thank my mother, Dixie Angelina
    Burckel-Testa; my aunt and uncle, Danica Lucia and David Zollars; and Sumire,
    who continues to inspire me with her art and creativity. And, somewhere in the
    dimension between family and geistfreund, a special shout-out to Mini—Pakalakai!
    I also send thanks to my long-time friends Donald Hammang, Tracy Nakajima, and
    Kimberly Jo Burke, who helped to give me a needed sense of continuity and balance;
    and to my very dear friends back in Japan, Keith Hagen, Kyoto Nagata, and Setsu
    Usaka, who kept me connected with the sensibilities and joys I acquired. Very
    special thanks also go out to my godfather, The Dort, who is an always kind and
    patient ear for my incoherent ramblings and who does his best to keep me relatively
    sane in the context of my otherwise whacko world.


    In the production of any book, editors are so very important, and I would like
    to thank the editor of this edition of Ubuntu for Non-Geeks, Keith Fancher, who
    had the uneniable task of dealing with files flying from two different authors,
    one of whom (me) is particularly good at mucking up in the numbering and attachments
    department. Good job, Keith! Thanks also go out to Milo Casagrande, the technical
    editor on this edition, who did'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'his best to ensure that all of the details in the book were straight duck,
    and Kim Wimpseit, the copyeditor, made sure that every i crossed and of orphaned
    text was found and dealt with. Thanks to those folks whose job it is to turn the
    jungle of text and images we submit into a book—Megan Danch, Ansel Stanton, and
    Riley Hoffman, who also taught us a thing or two about indexing. And finally,
    a very special set of thanks went out to William Pollock for not only taking a
    chance on the completely unknown writer I was but for turning me on a great pupuseria
    in San Mateo, California.


    Having worked on my own for the previous editions of this book, working with a
    coauthor this time was a new and pleasant experience, and for that reason I would
    also like to add a couple of lines to that coauthor, Phil Bull. Working with Phil
    not only provided me with some inspiration and ideas for the book, but it also
    made working on this edition a lot more fun and less than working on the previous
    editions before. It''s always nice to have to bounce around with.


    Finally, a special thanks to my sweet little cat and dear feline friend, Mujo,
    who despite protesting as I spent her writing time continues to listen to whatever
    I have to say and keeps me sane when I''m feeling down—though I admit to losing
    a bit when she demands I spin around my swivel chair at 4 AM. Such life is in
    service to one''s cat.


    With two authors you get two sets of acknowledgments, I''d like to take this opportunity
    to thank all of the people who helped me (Phil) during the writing of this book,
    too.


    First and foremost, I want to thank my parents, Julie and Jeff, for all of the
    love, support and home cooking they''ve provided over the years. Someday, as an
    expression of my gratitude, I might even remove all of my old computer junk from
    their house! I''d also like to acknowledge my sister, Ellen, for Nan, Gramps,
    and Nana for their affection; and my aunt and uncle. Pam and Roy Beeson, for being
    (mostly) Ubuntu guinea pigs.


    Emily Johnstone has been superb in putting up with my nonsense and helping me
    through some of life''s little obstacles. I know how much I appreciate her friendship.
    My good friends (and fellow nerds) Kiran “K-Dizzle” Joshi and Leo “Tenacity” Huckvale
    waded through my initial script and gave me the confidence to keep writing, and
    Will “Willybobs” Was the inspiration for the troublesome chapter; thanks, guys!
    I''m also grateful to Adam Blundra who, despite his misguided attempts to convince
    me that Windows is better than Linux, has a wonderful friend, and to Matt Glover,
    Jamie Poole, and the other folks in Stoke for all the fine times.


    While I''ve been in Manchester, Christina Smith, Amanda Jackson, Michel Schemmal,
    Sarah Johnson, Sarahman Mason have made every day interesting, and their friendship
    has been so important to me. Sally and the Millican family have also been a big
    part of my life these past few years, and I''m grateful to them for all the adventures
    we''ve shared. Thanks'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'must go out, too; the guys in the physics department at the University of Manchester,
