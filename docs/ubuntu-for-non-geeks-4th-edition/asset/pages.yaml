  md: '# 8


    # # DRESSING UP THE BIRD


    Customizing the Look and Feel of Your System


    ![](img/35405f17cef8b43ddf1af3fc22de194c_159_0.png)


    One of the features of Linux that pleased me to no end, and continues to do so,
    is that users can drastically change the look of things. I don''t mean just the
    icons and backgrounds but everything, including the actual window borders and
    controls. Add to the variety of graphical desktop environments and window managers
    available for Linux, and you have a totally customizable system. Is it any wonder
    that there are so many more Linux desktop screenshots'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'on the Web for any other system? If you don''t believe me, just take a look
    at a site dedicated to Linux screenshots, http://www.linuxscreenshots.org/, and
    click the **Screenshots** link.


    You may not be fickle as I am in terms of the look and feel of your system, but
    you can learn to use and enjoy all the graphical customization power that Linux
    offers you as work through this chapter.


    # Project 8A: Creating a New User Account


    If you are reluctant to alter the look of your current setup, you can create a
    new user account and experiment with making the changes in this chapter when logged
    in to the new account. If you opt to this route, your regular home environment
    will remain untouched, look-and-feel customizations that are performed in one
    user account do not affect other user accounts. When you are all done with the
    project, you can then simply delete the new user account. Either way, it''s to
    you.


    # 8A-1: Creating the Account


    To set up a new user account, follow these steps:


    +   1. Select **System ► Administration ► Users and Groups**.

    2. Once the Users Settings appears, click **Add**. If asked for your password,
    type it into the box, and click **Authenticate**.

    3. In the Create New User window that appears (Figure 8-1), type a new username
    in the Short Name box; I''m using *graphika* for my example. In the Name field,
    you can type whatever you like; I''m using *Graphics Laver*.

    4. Click **OK** to add the new user.

    5. The password by hand option should be selected. Type a password for the new
    user; you should put numbers and letters in the password to make it more difficult
    to guess. Retype the password in the Confirmation box to confirm your choice,
    and then click **OK**.

    6. You''ll be back to the Users setting (Figure 8-2). Select the new **graphika**
    account from the list on the window, and then click the **Change** button next
    to where it says Account type.

    7. In the window that appears, give yourself the ability to install software and
    perform other administrative tasks in the new account by selecting **Administrator**.
    Click **OK** to return to the main Users Settings window.

    8. Click **OK**, and close the Users Settings window. The new account should be
    ready to use.


    > **NOTE** Normally, the privilege to install and perform other system-wide changes
    (Administrator) is not selected by default on new user accounts, since you probably
    don''t want your kids, workmates, or anyone else with their own user account on
    your computer installing all sorts of weird stuff and screwing up your system
    settings. We need it here because we''re going to be installing things, though.


    Chapter 8'
