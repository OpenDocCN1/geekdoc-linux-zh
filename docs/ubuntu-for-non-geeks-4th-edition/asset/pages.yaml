    of the window as many times as necessary until the Word Processor icon is right
    at the top of the list.


    Now that your word processor is up at the top of the menu, the other OpenOffice.org
    modules seem a bit out of place at the bottom, so you might move the other OpenOffice.org
    modules up near the top too by using the same method.


    While I''m being logical and, why not make things even better by getting the Evolution
