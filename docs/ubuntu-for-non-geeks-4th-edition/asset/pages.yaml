  md: '# 8B-3: Dolling Up the Side Pane (and Emblems Yet Again)


    Now let''s change the look of the Nautilus side pane. Keeping the Backgrounds
    and Emblem window open (if you already closed it, open it again), click the Places
    menu button in the Nautilus side pane, and select Information.


    You can add a different background pattern to the side pane as well, but for practice
    it adds a color instead. To do this, click the Colors in the Backgrounds and Emblems
    window. The window will now be filled with swatches of color. Drag the Grapefruit
    swatch to your side pane, and it will turn from gray to, of all things, grapefruit
    (albeit a very dark and unusual grapefruit). You can also create a two-color gradation
    by adding another color. Drag the Mango swatch to the very bottom of the side
    pane (but still within the pane), and you should have a grapefruit-to-mango, top-to-bottom
    gradation within the pane. Of course, if you are not pleased with this tropical
    color, you can get back to your original default gray panel by dragging the Reset
    swatch onto the area. When you''re done, you can close the Backgrounds and Emblems
    window.


    The side pane of your Nautilus window provides a third way to work with emblems.
    But before I let you on this (and last) way, let''s add another folder to your
    home folder. Create a folder and name it Finances, which you can use to store
    files dealing with your relative in the modern scheme of things.


    After you''ve created the new folder, go to the side pane, click the Information
    drop-down menu, and select Emblems. A list of emblems will appear within the side
    pane. Select the Money emblem, and drag it into your Finances folder. Next, select
    the Plan emblem, and drag it into the folder too. Add even more emblems to it
    if you like—you should be able to fit about four before Nautilus decides to prevent
    any more from being displayed. Your window should now look something like the
    one in Figure 8-5.


    Once you are done, go back to the drop-down menu, and select Places to get everything
    back to relative normalcy again.


    Even if it''s not your cup of tea, you have to admit that your Nautilus window
    is definitely more colorful now. You, of course, can change it to look however
    you want, but I''ll ask you to hold off on that a little longer, because you are
    going to do some playing around it shortly.


    # 8B-4: Changing the Desktop Background


    Now that your home folder is all gossied (or gaudied, depending on your aesthetic
    sense of things), you might think your desktop looks rather drab in comparison.


    You can easily change the desktop background (often called wallpaper) by right-clicking
    any open space on the desktop and selecting Change Desktop Background in the pop-up
    menu. This will open the Appearance Preferences window, opened to the Background
    tab (see Figure 8-6).'
