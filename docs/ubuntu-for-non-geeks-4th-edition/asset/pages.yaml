  md: '# Setting Up a Wireless Connection


    With the right wireless hardware, you can now surf the Web just as any-where you
    can catch a (radio) wave, so to speak. Whether you happen to be at your breakfast
    table, in the library of your university, or at your local Starbucks, you can
    now go online without having to physically hook up your computer to anything.


    Fortunately, the process of setting up wireless networking in Ubuntu is quite
    easy and not very different from what you just read in the previous section.


    # Hardware


    If you lead a solely wired existence or are just inexperienced in this particular
    area, there are a few things worth knowing. To get started, you need to have the
    right hardware. If you just want to go wireless, then all you need is a network
    card (sometimes referred to as an 802.11a/b/g card or WiFi card). These are built
    in almost all modern laptops, while for older models they are usually add-ons
    in the form of cards that pop into the PCMCIA slot on side of your computer (as
    shown on the right of Figure 4-3).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_85_0.png)


    Figure 4-3: All you need for a WiFi setup—an access point and a network interface
    card


    Some wireless cards plug into one of your machine''s USB ports, or in the case
    of desktop models, one of its PCI slots. Although support for cards of this type
    has improved through the past couple of years, there are still gaps and some can
    be rather tricky to deal with. You will find some tips on how to deal with awkward
    adapters in Chapter 21, but if you''re looking for a sure thing, Centrino IPW-2100
    and IPW-2200 cards are definitely supported by Ubuntu. As cards of the built-in
    or PC card variety, you will find support much better, but even then you have
    to make sure, or at least hope, that the card you are using is Linux compatible.
    No matter what wireless card you are wondering about, the easiest way to find
    out whether it will work is just to try it. The Linux kernel comes with many wireless
    drivers built in, and Ubuntu'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'updates provide new ones, if you use a card that is compatible with

    one of those drivers, things will be smooth sailing. Things don''t seem to

    work, check Ubuntu''s list of supported cards (https://help.ubuntu.com/

    community/WifDocs/WirelessCardsSupported/), or check the Ubuntu forums to

    find a driver that is compatible or to see anyone has experience with

    your particular card.


    If you want to set up a wireless system in your home or office, then you

    also need to get a wireless access point (WAP), on the left of Figure 4-3.

    Fortunately, Linux compatibility is not much of an issue in this depart-\ment,
    because the access point doesn''t physically interface with your computer,

    and the settings are handled via your web browser.


    Access points come in several different types. The most common type is a wireless
    router,

    which many ISPs provide for free.


    You should be aware, however, that a few access points require you to

    use Internet Explorer or running Explorer in Linux Wine (as you''ll be in

    Chapter 18), you can''t be 100 percent sure that it will work. Unless you have

    W Windows machine somewhere in your house or office to handle such chores,

    it is probably a good idea to steer clear of access points of this kind.


    # Activating Your Wireless Card


    Setting up a Linux-compatible wireless PC card is actually relatively simple.

    First connect your access point to your Internet source, and then turn on

    t access point. Once it is up and running, plug your wireless card into the

    PCMCIA slot or USB port on your laptop (unless your wireless connection

    is built in, in case you can forgo this step). Any LEDs on the external

    card will most likely light up at this time.


    If your access point was when you booted your computer and your

    wireless card was in place during booting, you probably don''t need to do much

    el to access to the Internet. Just follow these steps:


    +   1. Click the Network Manager icon on the top panel to reveal a drop-down

    menu showing the wireless signals that are present in your vicinity and

    t strength of each signal (Figure 4-4).

    2. From that, select the signal for your access point (or any other

    wave you are entitled to latch onto) by clicking it.

    3. Your system will try to connect to the Internet. Once a connection

    is made, the Network Manager icon will morph into a small signal-

    strength indicator. Pretty handy.

    4. If your network has a WEP or WPA password, you''ll be prompted to enter

    it. It could be useful to check Show password before you type the password

    so you can check for any mistakes. Click Connect when you''re finished.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Most access points employ an added level of security in the form of Wired Equivalent
    Privacy (WEP) or a Wi-Fi Protected Access (WPA) key. If you didn''t choose your
    own password when you set up the access point, looking for a sticker on the base
    or side of the access point to see whether a default is used. If you''re trying
    to connect to a network for which you don''t happen to know the key, then chances
    you are not supposed to be making the connection in the first place. Naughty,
    naughty.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_87_0.png)


    Figure 4-4: The Network Manager shows available wireless networks and their signal
    strengths.


    If you were not successful in making your wireless connection (the system will
    tell you that there''s the case), you have a few possibilities beyond the annoying
    noncompatible-card scenario. First, double-check to make sure your card is actually
    physically turned on. I know sounds dumb, but I have been guilty of this oversight
    myself on numerous occasions. Many laptops you have to press the function key
    (FN) and enable or disable the wireless card; mine mine you have to press the
    function key (FN) and F2 at the same time.


    If you still have no luck connecting wirelessly, the drivers may not be installed
    for your card, or Ubuntu may not support the card. You can try plenty of tricks
    to get things working, so head over to Chapter 21 and look for "Installing Drivers
    for Your Network/Wireless Card" on page 390.


    # Switch Off or Refreshing Your Wireless Connection


    Sometimes you''ll want to disconnect from a wireless network, such as when you
    use your laptop on an airplane or when you just want to connect to'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'different network, as you might when moving your laptop from one wireless

    hotspot to another.


    To do this, click the Network Manager icon to reveal the list of

    available wireless networks (that is, signals). In that list, click the Connect

    option below the name of the wireless network to which you are connected.

    Within a second or two, you will be disconnected.


    If you want to turn off your wireless card (as you should if you''re

    boarding an airplane) and you don''t have a physical way to do it, like a switch

    or a button, right-click the Network Manager icon, and then deselect

    Enable Wireless. And if you want to turn back on again, just get

    back to that menu, and select Enable again.


    Sometimes, your wireless card might lose its connection for no apparent

    reason, so it might be useful to refresh the connection (that is, turn it off
    and

    on again) to get it back. The quickest way to do this is to click the Net-

    work Manager icon and click the name of your wireless network in the

    List. You will be disconnected and then automatically reconnected.


    If doesn''t work, try disabling and enabling the wireless connection

    using Network Manager''s Enable Wireless option, as described earlier. If

    y still have no luck, try turning the wireless card off and on again using

    witch or if you have one, unplug it and plug it back again. Finally, if

    nothing seems to be working, restarting the computer.


    # Connecting with a DSL and ADSL Modem


    How easy it is to set up your DSL or ADSL modem depends on the connection

    that it has. If it can be connected using an Ethernet cable, use that, and for-

    down the instructions in "Setting Up a Connection" on page 46; it''ll be

    much easier than trying to use a USB cable! If you have a USB or internal

    modem, try the instructions in this section and hope for the best.


    The first step is to check whether Ubuntu recognized your modem.

    Assuming it''s already plugged in, click System > Preferences > Network

    Connections, and select the DSL tab. If a connection is listed in that window,

    your modem was recognized, and you can begin setting up. If the list is

    empty, refer to help.ubuntu.org/8.04/internet/cmodem-adsl-usb.html to

    see whether there are any steps you can follow to get your modem working.


    Select the connection by clicking it, and then click Edit. The

    DSL tab of the Editing window appears, and enter your username and

    password into the appropriate fields. Then enter your connection informa-

    t (usually a phone number) into the Service box, and click Apply. Now,

    click the Network Manager icon on the top panel, and choose your DSL con-

    nection from the list. Network Manager will try to connect using your modem-

    if it''s not successful, go back and try changing some of the settings to see

    whether you can get it to cooperate.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Setting Up a Dial-up Connection


    Although much of the world is moving to high-speed Internet connections, many
    of you may still be using dial-up Internet connections, which means you need to
    have a traditional dial-up modem to reach beyond your box to the outside world.
    In case you broadband surf-gods have forgotten, modems are those wonderful machines
    that whistle, chime, screech, and spit whenever you dial your Internet provider.
    I suppose you could think of them as noisy telefones in need of a good burp.


    Now here comes the bad news—in the world of Linux, few internal modems are supported,
    and for those that, the setup process can be quite frustrating. The main reason
    behind this compatibility problem is that most built-in modems are software dependent,
    and the software they depend on is part of, or designed for, Windows. Such modems
    are called Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmod
    beasts so that they work with Linux systems. Though support for the wide variety
    of Winmod models is still patchy, you might just look out. My advice is to hold
    off on the worrying and worry just give your modem a try to see whether it works.
    If it does, then you''re all set. If it doesn''t, then you''ll have some options,
    and at least you haven''t done any damage to your system.


    With that intro-babble out of the way, let''s get down to the steps for setting
    up your dial-up connection. First, get the settings you need from your Internet
    provider. Most providers aim their operations at Windows and Mac users, and yet
    there is no technical reason for your Linux system not to work via their setup,
    so nag and push them until they give you the information you need. After, make
    sure your modem is connected to a live telephone connection—for example, the phone
    jack in your wall.


    Now it''s time to set up the connection. I''ll use the GNOME program to install
    all of the setting up, but there''s a caveat: it cannot install! If you have access
    to some other Internet connection that you can use temporarily, connect to that,
    and use the Ubuntu Software Center to download and install GNOME PPP (see Chapter
    6 to learn how to install software). The alternative is to use the pppconfig command,
    which is installed by default but is difficult to use. Find another computer and
    check out instructions at http://ubuntu.com/community/DialupModemHowto/SetUpDialials/
    for instructions if you have no alternative but use pppconfig.


    Assuming you got GNOME PPP installed using a borrowed Internet connection, you
    can follow these steps to set up your modem:


    +   1. Select Applications > Internet > GNOME PPP, after which GNOME PPP will
    appear.

    2. Click Setup, and make sure you''re looking at the Modem tab.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '+   3. Click the Detect button to identify your modem. If you get a message
    saying that no modem was found on your system, you''re out of luck—the best you
    can do is ask for advice on the Ubuntu forums (http://www.ubuntuforums.org/) or
    try selecting items from the Devices drop-down list by trial and error.


    +   4. How you change the rest of the settings depends on how your modem and ISP
    are set up, select the defaults for now. If these don''t work, trial and error
    is a potential way forward.


    +   5. Click Close to get back to the GNOME PPP window. Type your username and
    password, and enter the phone number provided by your ISP.


    +   6. Click Connect. You should then hear your modem begin its dialing, spitting,
    and churning sequence as it makes the connection with your provider.


    +   7. If you manage to get connected, you can start browsing, emailing, or whatever
    else it is online. If you get an error message, there''s little you can do but
    take deep breath and click the Setup button to try tweaking your settings.


    # What to Do If Your Modem Isn''t Compatible


    Though it might not sound that way, what I''ve just described is pretty much best-case
    scenario. What happens, if your modem and Ubuntu do not see eye to eye? Well,
    there are a few options. My first, more radical suggestion, is to dump your dial-up
    ISP and find a broadband provider that covers your area. If that is not an option,
    then you have two ways to go. One is to try get around your modem to see whether
    you can get to work. This is a slightly more complicated process, but there are
    instructions at https://help.ubuntu.com/community/DialupModemHowto. If you are
    afraid of a heart or a voice issue, you may find that the process entails to be
    a bit more than you''re willing to deal with.


    The simpler, although costly, to get your modem to work is to chase a true hardware
    modem. Hardware modems are not software dependent, so work with any operating
    system. You can think of them as telephones without a headset.


    Such modernos come in two forms: internal and external. As the USRobotics models
    56K.V2 Performance Pro (internal slot) and 56 PC Card Modem (PC card slot, for
    laptops) are true hardware that are easily available and are said to work. You
    can check the USRobotics site at http://www.usr.com/ for more information on these
    models, though checking the Ubuntu forums for suggestions is always a good idea.
    Perhaps the half of all solutions is to buy an external dial-up modem. This may
    come with serial or USB connectors and sit in a box outside your computer. Because
    the modem doesn''t use your operating system to operate, it does not tie up system
    resources which is busy, which may result in a possible pickup in computer speed.'
  merge: -1
