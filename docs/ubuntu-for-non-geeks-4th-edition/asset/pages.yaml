- img_proc: true
  md: '# Look in the Trash It''s possible that you accidentally deleted the file.
    Click the Trash icon on the bottom panel, and look for it in there.


    Another explanation for the lost file might be that it was saved in a temporary
    folder. This happens when you open an email attachment, for example—the file is
    put temporary folder by your client and opened using the default application for
    that type of file. Unfortunately, some programs don''t realize it''s a temporary
    file, and they save it in the temporary directory ... which is periodically wiped
    clean. If you suspect that this have happened and you restarted your computer
    since you last saved the file, then it''s probably gone.


    If you haven''t restarted, there may still be hope; try opening the (unmodified,
    original) file again to see which folder it gets stored in by selecting File >
    Save As (or similar) in the program that you''re using. Then, check which folder
    the Save window opens up to. For example, the Evolution mail client temporarily
    stores attachments that you open in a randomly named folder within the /home/username/.evolution/cache/tmp
    folder (see Figure 21-15 for an example). Note the name of the folder, and open
    your folder. Then, select Go > Location, type the name of the folder in the box
    that appears, and to find your file in the folder saved in a temporary folder.
    It''s hardly convenient, but it might just help you find your file.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_439_0.png)


    Figure 21-15: Looking for a file that was saved in a temporary folder by Evolution'
  merge: -1
