  md: 'In this case, you can simply close the INSTALL file, because it prescribes
    the same steps I''ve listed next. However, in the future, when you install other
    programs from source, you will need to follow the instructions in the INSTALL
    files that come with the source files. However, with most INSTALL files, the instructions
    will match the process I am about to describe.


    Of course, it may well happen that you take a look at the contents of the INSTALL
    file and start wondering what tongue it is written in. In cases when you have
    no idea what the INSTALL file is going on about, look for a configure file in
    the package folder. If you find one, you should be able to follow the instructions
    in this project.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_223_0.png)


    # 9D-3: Running configuration and make for Xmahjongg


    Now that you have downloaded and untared the Xmahjongg tarball, installation is
    perfectly standard. Here''s what you need to do:


    +   1. Open a Terminal window, and then move into the new folder by typing cd
    xmahjongg* and pressing ENTER.


    +   The next step is part of a setup phase that runs the configure script in the
    xmahjong-3.7 folder. The configure script checks what files, compilers, and other
    things it needs, and then searches your computer to see whether those things are
    there and, if so, Based on this information, it writes a file called a makefile,
    which is a set of instructions that will tell the make command in the subsequent
    step how to set up specifically for your system configuration.


    Figure 9-18: Identifying a package''s INSTALL file


    Simple Kitten Ways 187'
  merge: -1
  pgno: 223
- img_proc: true
  md: '+   2. Configure the program by typing ./configure and pressing ENTER.


    While you are running configure, you will see lots of mysterious things flowing
    through your Terminal window; this is essentially a running account of what is
    going on, each step of the way. This can take a bit of time, but don''t worry.
    As long as the mysterious text keeps flowing and you don''t get an error message
    at the very end of the process, all will be well.


    When configure has done its thing, you will see your prompt again, and you can
    go to the next step, which is the translation, or compilation, step. The make
    command created the makefile to see how things needs to be set up on your machine.
    It then proceeds to call the compiler to translate the high-level source code
    into low-level, machine-readable files that can be installed in the subsequent
    step.


    +   3. To perform this translation, type make, and press ENTER.


    Again, you will be treated to even more mysterious text flowing through the window
    and a short wait, usually a tad longer for the configure process. Once make has
    done its job and you see your prompt again, you are ready to install the program.


    Up to this point, you have not changed your system in any way. All changes thus
    far have taken place in the xmahjongg-3.7 only—your system is still as pure as
    you started. Of course, all that is going to go right now when you perform the
    final installation.


    # 9D-4: Installing and Running Xmahjongg


    Now you''ve come to the last step in this part of the process, make install. Here
    you are telling your system to install what you have created, or compiled, in
    the make step. Note that because installation takes place in permissions-protected
    parts of your system, you will need to add sudo to the command string to give
    yourself administrative privileges.


    To perform the installation, type sudo make install, and press ENTER. You will
    then be prompted for your password. After typing it and pressing ENTER, the installation
    process will take place. Once your Terminal brings you back to your user prompt,
    Xmahjongg will be installed and ready to run. As a general rule, programs compiled
    from source do not automatically install a launcher in your Applications menu;
    you must instead run them by command. Although you can run a program for the first
    time by clicking the Run Application panel, it is better to run the program for
    the first time by typing the command in your terminal window. If anything goes
    amiss during installation, the Terminal will tell you what the problem is, whereas
    the Run Application method would leave you wondering what''s going on.


    To run Xmahjongg, just type xmahjongg in a Terminal window, and then press ENTER.
    If everything goes as it should, you can then create a launcher for Xmahjongg
    in your Applications menu, on the GNOME Panel, or in a panel drawer.'
  merge: -1
