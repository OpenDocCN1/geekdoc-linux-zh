  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_183_0.png)


    Figure 8-21: Changing the way the login screen looks


    # 8D-2: Adding a Picture to Your User Account


    Aesthetics aside, it''s time to make things a little more personal. What better
    way to do this than by adding a picture to your user account? Select **System
    > Preferences About Me,** and when the window appears (Figure 8-22), click the
    button that looks like a blank face. The Select Image window will appear—choose
    one of the stock images from the list, or use the pane on the left of the screen
    to find a picture from elsewhere (a passport photo, perhaps). Now, click **Open**
    to finalize your selection, and the picture will appear next to your username
    in the About Me window.


    While you''re there, fill out some of the other information you like. It''s not
    used for very much, but as anyone who has ever possessed a permanent marker knows,
    it can be fun to stamp your identity all over your things. When you''re finished,
    close the About Me window. The picture you chose will be displayed next to your
    username on the login screen the next time you start the computer (as you can
    see in Figure 8-21).'
