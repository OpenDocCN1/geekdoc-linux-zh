  md: '# Project 9D: Compiling and Installing Programs from Source: Xmahjongg


    Though it was far more common in the earlier days, compiling programs from source
    seems to be a phrase you still hear more in the Linux world than in any other.
    For the beginner, just the mention of compiling a program from source seems off-putting
    enough. The words compile and source seem to instill a sense of foreboding in
    the heart of the new user. Certainly that was the case for me, anyway.


    You can live long and prosper without ever bothering your system. You can move
    quite happily with your system is, or you can just install programs by means of
    the much more convenient Ubuntu Software Center. Still, in the Linux world, you
    are likely to come across this installation method and may well become curious,
    especially if you move into the geekier side of the community.


    # So, What Is Source?


    To get started, it is probably a good idea to understand what source is to help
    you understand a bit about how a program actually gets from its primitive state
    on the programmer''s computer to an up-and-running application on your machine.
    First the programmer writes a program in programming language. You have probably
    heard of programming languages such as BASIC or C, and there are many others.
    What the programmer writes with such a language is a set of instructions called
    the source code, or source. Your computer, however, cannot understand any of that
    source on its own. It is as if the computer speaks ancient Greek, and the source
    code is all written in French. The computer needs some sort of interpreter to
    help you out.


    The various languages that programmers use are high-level languages—they are relatively
    easy for programmers to read. The computer, on the other hand, understands low-level
    languages, which are quite difficult for most mortal programmers to deal with.
    To convert the high-level language instructions to a low-level language, the computer
    needs some other program to translate


    If this translation actually takes place while a program is running, the translator
    is called an interpreter. Applications that run using an interpreter are usually
    called scripts. The PyWings and Briscola applications mentioned earlier in this
    chapter are examples of script applications.


    The problem with these scripts is that they can be slower than most of the applications
    you''re familiar with—the computer must run an interpreter, interpret the source
    code, and run the actual application at all the time. This is like having a French
    book translated into Greek by a live interpreter; it''s very indeed slow.


    As an alternative, most programs use a compiler instead of interpreter. A compiler
    translates the high-level source code into low-level machine code or object code,
    that the computer can understand before the application is


    184 Chapter 9'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'actually run. Once this translation is done, the computer never has to bother
    with the high-level instructions again; it can merely read the translated version
    each time it runs the program. This is like having a translated version of a foreign
    book that you can read any time you want. Because computers can run compiled programs
    without simultaneously using an interpreter, compiled programs run faster than
    scripts. Most applications for all operating systems are, therefore, compiled.


    # The Basics


    The actual process of compiling an application from source and then installing
    it is quite simple—a "one, two, three" of presto change-o. Basically, after extracting
    the source code from an archived file (usually in the form of a tarball), you
    would use the following commands to accomplish the task:


    ```

    ./.configure To configure a makefile, which provides instructions for the command

    ```


    ```

    make To translate the source code into object code that the computer can understand

    ```


    ```

    sudo make To give yourself write privileges in protected folders and then install
    the application

    ```


    ```

    make clean To tidy up the leftovers once the process is complete (to clean up
    the mess)

    ```


    I know that sounds like a lot of commands, but as I always say, it is easier to
    actually do what it looks like on the page, so fear not.


    # 9D-1: Installing the Tools You Need


    Before doing anything else, you have to get your system ready to do what you are
    about to ask of. Because Ubuntu is the default computer in mind, it does not come
    with the various applications and libraries you need to compile applications from
    source. Fortunately, everything you need to get the job done is available via
    the Ubuntu Software Center. To get ready for the work at hand in this chapter
    (and many other jobs you are likely to do on your own in the future), perform
    searches for and install the following:


    +   - build-essential

    - libgtk2.0-dev


    # 9D-2: Downloading and Extracting the Xmahjong File


    To get some hands-on experience with compiling a program from source, you will
    be working with a game called Xmahjong, which you can see in Figure 9-17. If you''ve
    tried the version of Xmahjong that comes with your Ubuntu distribution, you will
    notice that this one is much easier on your eyes and is a bit more colorful (check
    out the project site at http://www.lcdj.org/xmahjong/ to catch a glimpse of it
    in its full-color glory).'
