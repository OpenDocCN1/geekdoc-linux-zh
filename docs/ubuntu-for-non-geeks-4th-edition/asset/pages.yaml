  md: '# 3A-5: Adding a Drawer to the Panel


    One of the features I like about the GNOME panel is the drawer. The drawer is
    a little app that saves on panel space by letting you add drop-panels, in which
    you can place launchers that you do not have room to place launchers elsewhere.
    These drawers are also handy locations to place launchers for applications that
    you must normally run by typing a command in a Terminal or via the Launch Application,
    such as those you compile yourself from source code or are run via scripts. You''ll
    learn how to do this in Chapter 9. Of course, you can put anything you want in
    a drawer, including used files or even menus.


    Adding a drawer to your panel is very easy and is basically the premise that you
    want to add the Force Quit button to the panel. Here is all you need to do:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel window
    will appear.

    3. In that window, click Drawer to highlight it, and then click the Add button.
    Close the window by, quite logically, clicking Close.


    # 3A-6: Adding Program launchers to the Drawer


    The drawer you''ve just added is empty at this stage, so let''s put it to use
    by adding launchers for three useful, yet less glamorous, system utilities. These
    are System Monitor, which allows you to view your computer''s running applications
    and processes, memory and CPU usage, and storage device; Terminal, in which you
    can type and execute commands (slightly geeky, I admit, but very useful); and
    the Software Center, which you can use to download and install applications.

    Here''s what you need to do:


    +   1. Right-click the drawer applet in the panel, and select Add to Drawer in
    the pop-up menu.

    2. In the Drawer window that appears (and looks and behaves the same as the Add
    to Panel window), select Application Launcher, and then click the Forward button
    that appears.

    3. On the next screen, click the small + next to Accessories, scroll down and
    click Terminal to select it, and then click the Add button. The Terminal launcher
    will now be loaded into the drawer.

    4. Next, scroll down and click the small arrow next to Administration.

    5. Scroll down that category until you find Ubuntu Software Center, click it to
    select it, and then click Add.

    6. Finally, add a launcher for the System Monitor by scrolling down the System
    Tools category, clicking the small + next to that category, selecting System Monitor
    from that group, and then clicking Add. You can now close the Add to Drawer window.'
  merge: -1
