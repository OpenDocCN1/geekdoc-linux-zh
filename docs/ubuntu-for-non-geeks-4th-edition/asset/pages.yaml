    to create a special folder for it.


    Although I sure you now know the drill, I''ll tell you again. Just open a Terminal
    window, typing the following command, and press ENTER:


    ```

    tar -xzvf briscola-4.1.gz

    ```


    A new folder, Briscola-4.1, will now appear in your home folder with all the Briscola
    files in it. To make things easier to deal with in the future, lets'' shorten
    the name of the folder to simplify briscola. You already know how to do this via
    the right-click method, but this time around''s to do it via the command line.
    To do this, you, perhaps surprisingly, the mv command followed by the name of
    the file whose you are going to change, followed by the new name of the file.


    Give it a go by typing the following command and pressing ENTER:


    ```

    mv briscola-4.1 briscola

    ```


    # 9C-3: Preparing the Briscola Script


    Most applications that come in tarball form include a README file, which includes
    information on what you need to install and use the application. If you double-click
    the README file in the briscola folder in Nautilus, you will see that the "HOW
    TO START" section tells you to adjust the first line of the briscola.tk script
    to point to your Tk shell, and to adjust the second line of the script to point
    to the directory where the various Briscola files are located.


    To perform the adjustments as instructed in the README file, just follow these
    steps:


    +   Find the Tk shell, called Wish, by typing wish in the Terminal window and
    pressing ENTER, then note the location given on a piece of paper. You may get
    a number of locations in your search results, but the one you want is /usr/bin/wish.


    +   Direct the Terminal to the briscola folder by typing cd briscola and pressing
    ENTER.'
