  md: 'Be that as it may, there is still much to be said for the power and convenience
    of the command line. The fact that the command line can now be utilized within
    a graphical environment also makes it much less forbidding. The Terminal is just
    a tiny text-based island in a sea of graphical bodies (see Figure 9-1). Using
    the command line can be as pain-free as anything else you do on your system, and
    it can actually provide you with a little fun if you are willing to give it a
    try.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_192_0.png)


    Figure 9-1: Putting the Terminal in perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a really good thing
    inadvertently makes what they write even more offputting to the real Linux immigrant
    or wanna-be.


    For your sake, I will try to curb my own enthusiasm so not to scare you right
    back to Chapter 6 and the more comfortable world of the Ubuntu Software Center.
    I will also help to you keep things in perspective by teaching you, whenever possible,
    to use the command line as a complement to the various graphical tools that you
    have at your disposal, rather than presenting it as the sole way of going about
    things. Of course, in this regard—just enough to give you some exposure and experience
    and, ideally, make you feel at least a little more at ease with the command line.
    Who knows, could you actually come to think of using the command line as ... fun?
    Well, I won''t get too carried away.


    # # Meet the Terminal


    You can run the Linux command-line Terminal application in your Ubuntu system
    by selecting Applications > Accessories > Terminal. When the Terminal opens, it,
    in all its simplicity, look much like Figure 9-2.


    156 Chapter 9'
