  md: '# Adding Extra Software Repositories


    The Ubuntu repositories contain more than 30,000 packages—enough to last a lifetime,
    or so you might think. But as it turns out, a whole world of software is waiting
    for you outside the official Ubuntu repositories, and it''s not more difficult
    to reach. Various individuals and companies compile small numbers of packages
    that are not available in Ubuntu into their third-party repositories. These are
    typically free to use, if you can find them. You all need to tell APT to search
    for packages in one of these repositories as well as Ubuntu''s, and you''ll be
    able to get at the extra software.


    Each repository has its own APT line, which contains extra information about the
    repository, which APT uses to figure out what sort of packages it contains. You''ll
    need to get the correct APT line from the website of the repository you''re trying
    to add, so pick an example to see how it works. Open Firefox, and head to http://www.getdeb.net/updates/Ubuntu#how_to_install.
    GetDeb specializes in making packages for software that isn''t officially made
    into Ubuntu yet. There should be instructions on installing packages from GetDeb
    in a box at the top of the page, skip to the second item in the list and find
    the APT line, which should look something like this: deb http://archive.getdeb.net/ubuntu/lucid-getdeb-apps.
    This follows the same format as all APT lines: the word deb, followed by a web
    address, followed by a couple of other words that specify which part of the repository
    should be checked by APT when it, right-click it, and select Copy from the pop-up
    menu.


    While you''re in Firefox, you''ll also need to grab the repository''s GPG key
    (which I''ll explain more at the end of this section). It should be linked to
    the same website you got with the APT line; in the case of GetDeb, go to http://archive.getdeb.net/getdeb-archive.key,
    when the Opening getdeb-archive.key window opens, select Save File and click OK
    to save the key file.


    Now that you''re in possession of these vital bits of information, adding the
    repository to your system is perfectly straightforward:


    +   1. Select System > Administration > Software Sources. Enter your password
    if asked, and then click the Other Software tab in the Software Sources window
    that appears.


    +   2. Click Add. You will be prompted to enter the APT line, so paste it into
    the box, and then click Add Source (Figure 6-7). A new entry should appear in
    the Other Source list.


    +   3. Select the Authentication tab, and click OK. Use the window that appears
    once, to find the .key file you downloaded earlier. (It''s probably in your Downloads
    folder).


    +   4. Select the .key file by clicking it once, and then click OK. Check the
    list of trusted software providers to make sure that the GetDeb Automatic Signing
    Key is now present, as it is in Figure 6-8.'
