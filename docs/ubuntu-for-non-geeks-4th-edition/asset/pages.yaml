  md: '# # 12


    # # PENGUINS AT WORK

    Getting Down to Business in Linux


    ![](img/35405f17cef8b43ddf1af3fc22de194c_263_0.png)


    I have to admit it, when I think about the joys of computing, I tend to think
    of the more hedonistic, self-indulgent areas like gaming, music, and graphics.
    Still, as is the case for most computer users, what I usually end up doing on
    my computer is work, and writing this book falls into that category.


    Fortunately, Linux can get down to business and do it as well as the next OS.
    I think it''s safe to say that you are missing nothing and are probably gaining
    a bit in terms of home and office productivity programs in the world of Linux.
    In this chapter, I''ll walk you through the Linux offerings in this department.


    # OpenOffice.org


    Whether they should be or not, people are quite obsessed with office suites, even
    though most people seldom need more than a word processor. The de facto standard
    among office suites is Microsoft Office, which is available in'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'both the Windows and Macintosh worlds. Of course, because it is a Microsoft
    product, you can be sure that no Linux version is available.


    Fortately, Linux does have an exceedingly capable office suite in the form of
    OpenOffice.org, which is, incidentally, also freely available (as in free) Windows
    and Mac OS X versions. OpenOffice.org is not lightweight sour-grapes substitute
    for the Microsoft-less Linux world; it is a full-featured contender, and in some
    cases, OpenOffice.org is a clear winner.


    # OpenOffice.org Applications


    The entire OpenOffice.org office suite consists of a number of application modules,
    and the most commonly used ones bundle with Ubuntu. These include a word processor
    (Writer), a spreadsheet (Calc), and a presentation creator and player (Impress),
    all of which you can find by selecting Applications Office. In addition, there
    is a handy vector drawing program (Draw), which you will find by selecting Applications
    Graphics. The database module (Base) and the mathematical formula editor (Math),
    which are no longer packaged with Ubuntu, are still available as separate downloads
    via Ubuntu Software Center (by searching and marking openoffice.org-base and pages,
    respectively).


    Since giving full and detailed instructions on how to use each of these applications
    would take up entire book (and there are books on the subject), I will simply
    introduce each module to you.


    # Writer


    As mentioned earlier, the word processor is the office application that the majority
    of users turn to most often. Fortately, OpenOffice.org Writer is a good one (see
    Figure 12-1). It is check-full of features and can read and save Microsoft Word
    files. Like Word, it will even let you save your documents as HTML files that
    you can easily change your documents into web pages.


    As said, Writer is a very straightforward word processor, so I won''t go on about
    it, but if you would like an introduction to Writer (or the other OpenOffice.org
    modules), check out the various tutorials and other resources available at http://support.openoffice.org/.


    # Calc


    Calc is the OpenOffice.org spreadsheet application, and it is similar to Excel
    in terms of capabilities and general layout (see Figure 12-2). It can also, quite
    importantly, read and save Microsoft Excel files.


    Since most people who use spreadsheets generally understand what they are all
    about, after a bit of poking around, can figure out how to use them, I won''t
    go into any sort of primer about using Calc. However, because there are many others
    who don''t see any need to try using spreadsheets, I will mention a few of the
    simpler tasks that can be done with Calc, in the hope of enticing some of you
    into trying it.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Peugeot Memories


    Yep, it wasn''t that long ago that I was back in Japan looking for a new car to
    park in front of my new house. Of course, any of you who knew me, also know that
    I am long legg, and as such had quite a time trying to fit behind the wheel of
    most right-hand car, especially in Japan. It changed when I moved to Tokyo, and
    ever so dearly pleased myself into the seat of a Peugeot 406. I felt so comfy
    that I didn''t want to get out. Although I had been more of a Citroen fan, there
    was a time back when in Los Angeles, when French cars were


    ![](img/35405f17cef8b43ddf1af3fc22de194c_265_0.png)


    ![](img/35405f17cef8b43ddf1af3fc22de194c_265_1.png)'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Most people who don''t use spreadsheets think of them as sort of giant calculators
    used for computing uncomfortably large sets of numbers, such as payrolls (which
    was the original purpose of such applications). That''s right, of course, but
    spreadsheets can be used for everyday tasks, such as projecting household budgets,
    calculating grade averages (by teachers or students), figuring out how long it
    will take you to save up for your trip to Hungary, or even comparing the seat
    heights for the four motorcycles you are trying to choose among. And when doing
    any of these minor mathematical tasks, you can easily create graphs in order to
    make all the abstract numbers speak to you.


    If numbers are just not your thing, you can still use Calc for creating lists
    of information, such as birthday lists, class rosters, shopping lists, address
    lists . . . whatever. You can even have Calc put the lists into alphabetical order,
    sort them by date of birth, and so on. Everyone eventually seems to find some
    use for Calc, so don''t ignore it entirely.


    And if you are still not convinced that Calc has a place in your life, you might
    at least find some amusement from an Easter egg hidden within the program, which
    allows you to play a Space Invaders clone called Star-Wars (Figure 12-3). Just
    type=GAME("Starwars") into any cell in Calc, and press ENTER. The instructions
    are in German, but it should be easy enough to figure out how play even if you
    don''t remember any of your high-school Deutsch.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_266_0.png)


    Figure 12-3: Space Invaders in OpenOffice.org Calc? Yup.


    230 Chapter 12'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Impress


    Impress is OpenOffice.org''s answer to Microsoft''s PowerPoint, with which it
    is compatible. It allows you to create attractive slides for use in presentations
    and also allows you to create notes or handouts to accompany them. Although these
    features make Impress quite handy in business and education settings, you may
    not find much value in it as a home user.


    # Draw


    More to the home user is OpenOffice.org Draw. Although Draw isn''t great for creating
    true graphics in the artistic sense, it is very useful for creating flowcharts,
    organizational diagrams (such as setting arrangements for wedding receptions or
    conferences), or any other document in which you want a bit more control over
    the placement of text and graphics (especially when the two are combined), such
    as flyers, awards, diagrams, and newsletters. In this sense, Draw can be used
    quite effectively as a simple page layout program, as you can see in Figure 12-4.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_267_0.png)


    12-4: A newsletter created (and displayed) in OpenOffice.org Draw


    # Microsoft Office and OpenOffice.org File Compatibility


    Although I mention the point throughout this section, it is worthwhile to emphasize
    that OpenOffice.org can read and write Microsoft Office files. This compatibility
    is quite good, though times seem slightly problematic.'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'To read Microsoft Office files, all you need to do is double-click the file
    in question, and it will open in the appropriate OpenOffice.org module. When saving
    files within OpenOffice.org to use earlier versions of Microsoft Office, however,
    you must save them into the appropriate format, or its native format (.odt for
    Writer documents, .ods for Calc documents, and .odp for Impress documents) by
    default, and only the most recent versions of Office can deal with these files.


    To do this when saving a file, click the small + next to the Word type in the
    Save window, and select the appropriate Microsoft Office format from the list
    of available file formats that appears below—choose Word 97/2000/XP for a Writer
    document, example.


    # OpenOffice. Features


    The three main applications in OpenOffice.org (Writer, Calc and Imp) are quite
    similar to their pre-Office 2007 equivalents in Microsoft Office (Word, Excel,
    and PowerPoint), switching to the OpenOffice.org applications should be relatively
    easy if you were weaned on those versions of Microsoft Office.


    If you don''t have any experience with Microsoft Office, you should still find
    it straightforward, because the basic layout is intuitive. And if you are lacking
    in the intuition department, the built-in Help files are pretty good, too. To
    help you along, the Tips system works just like tool tips in the Windows and Mac
    worlds. (In case you''re not what I''m talking about, tool tips are those yellow
    boxes that pop up to tell you what a button or menu item does when you place your
    mouse over that button or menu item). Another cool and useful feature is What''s,
    which is a more detailed version of the Tips system. If you select Help What This,
    your cursor will turn into a question mark. Move that question mark over almost
    any item in the OpenOffice.org interface, and you''ll find out what it does rather
    than what the item is called.


    Despite all the straightforwardness I am speaking of, a few interface items will
    likely be unfamiliar to you. That being the case, I will briefly discuss these
    items. I will be using the word processor, Writer, as I describe these things,
    if you want to run OpenOffice.org while following along, Writer might be a convenient
    starting point for you too.


    # Getting to Know the Buttons


    Although you should be able to figure out most of the buttons on the OpenOffice.org
    toolbar, a few buttons are common to all OpenOffice modules and deserve a bit
    more explanation.


    # Export to PDF


    The Export to PDF button is situated to the left of the two printer buttons (Print
    and Page Preview). You can use this button to export, or save, your document as
    a PDF file.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, opens
    the Hyperlink window, from which you can assign links to specified documents—not
    only to web pages but also to documents on an individual computer and even targets
    within that document. Although a hyperlink on a web page is something we have
    all come to take for granted, the idea of hyperlinking between text sounds like
    a pretty radical concept. It is, in fact, a rather old one that has been around
    before you or I even heard of.


    # Navigator


    The forth to the last button in the top row (the one that looks like a star-burst)
    is the Navigator button. Clicking this button (or just pressing the F5 key) opens
    the Navigator window (see Figure 12-5), which is a pretty cool navigational feature
    that comes in handy when working with length or otherwise complex documents.


    The Navigator allows you to easily bounce and forth between pages there, such
    as sections, links, and so on. Let say you have a document with lots of illustrations
    in it (like this chapter), and you would to jump directly to graphic. In this,
    you would double-click the word *Graphics* in the main pane of the Navigator window
    and then click the jump buttons (the odd buttons to the left of the page number
    selector) to begin jumping.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_269_0.png)


    Figure 12-5: The Navigator window


    If you are dealing with a document containing various heading levels, such as
    all of the chapters in this book, you can also use Navigator to switch among those
    levels. Say you''ve decided to add a new heading at the last minute to a document
    you''ve writing. You thus need to drop all of the headings you had before a down
    notch; the former heading becoming a subheading, and so on. By double-clicking
    the word *Headings*, the text of all the headings you have listed in the document
    appears. You can then select a heading in that list and click the Demote Level
    button (that''s the one at the far right of the second row of buttons) to move
    it down a level.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'To the right of the Navigator button is the Gallery button. By clicking this
    button, the Gallery, a library of graphical elements for use in your documents
    or web pages, will appear in a separate pane at the top of your document window
    (see Figure 12-6). The elements within the Gallery range from various types of
    lines to colored three-dimensional doughnuts, and you can even add items of your
    own.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_270_0.png)


    Figure 12-6: The Gallery


    Inserting a graphic into your document is a simple task even when not using the
    Gallery. All you need to select **Insert ▸ Picture ▸ From File** and locate the
    image file you want to insert. It can be handier to use the Gallery, however,
    when you intend to use certain graphics. Once in the Gallery, your graphics are
    always only a click or two away and can be conveniently viewed in the Gallery
    browser window.


    The collection of artwork that comes with OpenOffice.org is mostly geared towards
    building web pages, but other clip art is available elsewhere. For example, you
    can find a great collection online at http://www.openclipart.org/. Everything
    there is in the public domain, so it is free to use. Be sure to check out the
    “Game badge collection”—it’s one of my favorites.


    Adding these (or any other) graphics to the Gallery is relatively easy to do.
    First you need to create a new category (called a *theme*) for each group of images
    you want to add. To create a Gallery theme of your own, just click the New Theme
    button in the Gallery window. This will open Properties of New Theme window, where
    you should give your theme a name. Once you''ve done that, click the **Files**
    tab and then the **Find Files** button, which will open the Select Path window.
    From there you can navigate to the folder


    234 Chapter 12'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'in which you are storing your clip art, photos, or other graphics. Once you
    have found the folder, click the OK button, after which a list of all the files
    in that folder will appear in the Properties of New Window.


    From this window, you can easily add images to your New Gallery by clicking the
    name of each image you want to add (you might want to make sure the box next to
    the word Preview is checked to make a bit easier) and then clicking the Add button.
    Once you have done that, a copy of the image will immediately appear in the Gallery
    in your browser, where it will remain for future use (Figure 12-7). When you are
    adding images to your new theme, click the OK button, after which the Properties
    of New Window will close, revealing your new theme and its contents. To use one
    of the images in the Gallery, you just-right click the image you want to insert
    into your document, choose Insert, and select Copy or Link in the pop-up menu.


    If you''re more of a convenience-oriented type, you will be happy to know that
    you can use the Ubuntu Software Center to download and install a significant portion
    of the clipart available from http://www.openoffice.org/. Just search for and
    install openoffice.org. After the somewhat lengthy download and installation process
    is complete, restart OpenOffice.org (if it is running), and click the Gallery.
    Your new collection will be all here!


    ![](img/35405f17cef8b43ddf1af3fc22de194c_271_0.png)


    Figure 12-7: Viewing clip art and your own collections in the Gallery


    # Styles and Formatting


    The final stop on our tour through OpenOffice.org''s unfamiliar buttons is the
    Styles and Formatting button, which is located at the far left of the second row
    of buttons. This button acts as a toggle for the Styles and Formatting window
    (Figure 12-8), from which you can select and apply any styles to any of


    Penguins at Work 235'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'various elements within your document. Oh, and if you just can''t take your
    hands off the keyboard for a moment to fiddle with the mouse, you can also open
    the window by pressing the F11 key.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_272_0.png)


    Figure 12-8: The Styles and Formatting window


    To give you an example of how convenient styles can be, imagine that you are typing
    a bibliography page for some document you''ve prepared. You typed each entry as
    you might any paragraph, as in the following:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.


    Like most paragraphs you type, the entry is formatted as a first-line indent,
    which is fine and dancy that you want the norm for bibliography entries. Rather
    than messing around with tabs or margins to get the things you want, all you have
    to click your mouse anywhere within the paragraph and then double-click the Hanging
    indent entry in the Styles and Formatting window. After that, as if by magic (you
    know better), the transformation is made:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'You could follow the same procedure for each of your other entries or, with
    Hanging indent selected, click the paint can button in the Styles and Formatting
    window, after which your mouse cursor, placed over the document, will appear as
    a paint can. Click in any paragraph in your bibliography, and that entry, too,
    will be formatted in the new style. The process is essentially the same when applying
    different styles to any other document elements.


    One thing might annoy you when using the Styles and Formatting window is that
    it can be a pain at times, floating around as it does. It has a tendency to get
    in the way of your text more than you put it. Sure, you can toggle it on and off,
    but if you''re using it a number of times within the same document, this can get
    old too.


    A happy compromise is to dock the Styles and Formatting window into the main document
    window. You can do this by dragging the Styles and Formatting window into the
    top-left or top-right corner of the work area. When an outline of the Styles and
    Formatting window appears around the-document portion of the window (as you can
    see in Figure 12-9), release the mouse button. The Styles and Formatting window
    will now appear as a pane on the side of the document window (Figure 12-10).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_273_0.png)


    Figure 12-9: Preparing to dock the Styles and Formatting window into place within
    the main document window'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Word Processing Done Lightly with AbiWord


    If OpenOffice.org''s Writer is a bit more powerful than what you need for your
    everyday word processing chores and you prefer something that pops up as you click
    the launcher, you might want to consider giving another word processor, AbiWord,
    a try (Figure 12-11).


    Figure 12-10: The Styles and Formatting window in place as a pane within the main
    document window


    Figure 12-11: The other linux processor—AbiWord


    238 Chapter 12'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'AbiWord has a straightforward and easy-to-use interface, which you should be
    able to figure out without much, if any, help. It also has a couple of rather
    interesting features, such as its autoresize function, magnifies the onscreen
    document size (fonts, images, and everything) or shrinks it if you increase or
    decrease the size of the program window. AbiWord can read and save Microsoft DOC
    files and save documents as PDF files.


    You can easily install AbiWord via the Ubuntu Software Center by performing a
    search for abiword. Once you have AbiWord installed, you can run it by selecting
    Applications ▸ Office ▸ AbiWord.


    # Some Other Cool Productivity Apps


    In addition to the more traditional office applications, a number of other applications
    are either included with or available for your system that can be grouped under
    the “productivity” label. I will introduce a few of those to you.


    # Sticky Notes


    Mac users will be familiar with the digital version of the now ubiquitous yellow
    Post-it like notes called Sticky Notes (Figure 12-12) that come as part of GNOME’s
    Sticky Notes is a panel applet that you can add to your own panel by right-clicking
    any open panel space and then selecting Add to Panel in the pop-up menu. and then
    click Sticky Notes, and click the Add button. Close the Add Panel window by clicking
    Close. You will be ready for note-taking action.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_275_0.png)


    Figure 12-12: GNOME’s Sticky Notes'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Tomboy


    Sticky Notes doesn''t cut it for you and your more dramatic note-taking needs,
    perhaps you will find yourself better served by another application that comes
    with your system, called Tomboy (Figure 12-13). Like Sticky Notes, Tomboy also
    works as a panel app, but it is a bit more featured, albeit making any claims
    to stickiness. the various notes can be viewed by selecting them from the menu
    that appears when you click the Tomboy panel app. In all all, it''s a very handy
    approach.


    What really gives Tomboy bragging rights, however is its search and hyperlink
    functions. These allow you to search for entries within your Tomboy note library
    and create hyperlinks that connect in one note to another linked node. In fact,
    Tomboy will automatically create a hyperlink whenever you type a word that matches
    (or at least most useful), Tomboy by means of its plug-in features, allows you
    to export notes to HTML or print them, either as hard copy or as PDF docs.


    If you''d like to try Tomboy, start it by selecting Applications > Tomboy Notes,
    after which Tomboy will appear in the GNOME panel.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_276_0.png)


    # GnuCash


    If you are familiar with the personal financial management software Quicken, then
    you might be interested in GnuCash, which is the Linux world''s best-known offering
    in the personal finance arena. It reads Quicken and Intuit QIF files, which makes
    things even nicer you should be making the transition from another operating system.
    Unfortunately, unless you live in Germany, you cannot use GnuCash for online banking.
    but as the GnuCash folks-selves, don''t blame them; blame your bank.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'To install GnuCash, just do an Ubuntu Software Center search for gnucash, and
    install both gnucash and gnucash-docs. Once these are installed, you can run the
    application by selecting Applications > Office > Gnuash Finance Management.


    # Scribus


    To round things out, we come to a open source desktop publishing application,
    Scribus (Figure 12-14), for those times when OpenOffice Writer and Draw just don''t
    cut it. Scribus is designed to produce commercial-grade output, with support for
    professional publishing features, such as CMYK colors, PostScript handling, and
    creation of color separations, to make name a few.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_277_0.png)


    Figure 12-14: Scribus


    You can download and install Scribus by doing an Ubuntu Software Center search
    for scribus. Once the installation is complete, you can run the application by
    selecting Applications > Graphics > Scribus.'
