  md: '# UBUNTU DESKTOP CDS

    FOR AMD64, OPTERON,

    OR INTEL CORE 2 USERS


    ![](img/35405f17cef8b43ddf1af3fc22de194c_445_0.png)


    As I mentioned in Chapter 1, the version of the Ubuntu Desktop CD that comes with
    this book is designed to work with i386 processors, either in PCs or Intel-based
    Macs. It will also work with AMD64 or Intel Core 2 processors, albeit not in 64-bit
    mode. In order to use Ubuntu with these processors (or any other machine based
    on AMD64 or EM64T architecture) in 64-bit mode, you must get a different disc
    on your own. There are several ways of doing this: downloading an ISO (disc image)
    and then burning it to CD yourself, ordering the CD from Ubuntu (for free), or
    ordering it from an online Linux CD provider (for a nominal cost).


    # Downloading and Burning Ubuntu Desktop CDs to CD


    To download an ISO of the Ubuntu Desktop CD, go to the Ubuntu website at http://www.ubuntu.com/,
    find the link to the download page, and select and download the appropriate version
    for your machine. Remember that the ISO file you will be downloading is a heavyweight,
    weighing in just under'
  merge: -1
  pgno: 445
- img_proc: true
  md: '700MB, the download will take a bit of time. Don''t count on getting it all
    downloaded and before dinner . . . or, if you happen to be using a dial-up Internet
    connection, before dinner tomorrow. Yikes!


    # Burning the ISO to CD in Windows


    Once the Ubuntu Desktop CD ISO has been downloaded, you need to burn it to CD
    before you use it. Although Windows has built-in CD-writing capabilities, not
    all versions have the built-in ability to burn ISOs. To burn ISO to CD in Windows
    7, just right-click the ISO file, and then click the Burn button in the window
    that appears. In all versions of Windows, however, you must use a third-party
    commercial application, as Nero. If you don''t have a commercial disc-burning
    utility installed on your system, try the free and handy ISO Recorder.


    To get ISO Recorder, visit http://isorecder.alexifeman.com/isorecder.htm. Once
    the download is complete, double-click the ISOSetup.msi file on your hard disk
    to install. After the installation is complete, burn your ISO to CD by right-clicking
    the Ubuntu ISO file on your machine and selecting **Open > ISO Recorder** in the
    pop-up menu. A CD Recording window will appear.


    It is generally best if you install or live CDs at a lower speed to reduce the
    chance of error (2X to 4X speeds considered optimal). To do so, make your choice
    from the Recording speed drop-down menu. Next, pop a blank CD into the drive,
    and click the **Next** button. The CD-burning process should begin. Once it is
    done, the CD should pop out of the drive, and if all goes well, you''ll have an
    AMD64-compatible live CD. You can then use it by following the directions at the
    beginning of Chapter 2 for using the live CD that comes with this book.


    > If your CD there could be a problem with the ISO file you downloaded. Find out
    by doing an integrity check as explained at https://help.ubuntu.com/community/HowToMDDSUM/
    .


    # Burning the ISO to CD in OS X


    Ubuntu no longer comes in PowerPC editions, the i386 editions can be installed
    and run on Intel-based Macs. You can also, of course, download-ISOs for other
    architectures on your Mac and then burn them to CD for use on other machines.


    To an an file to CD in OS X, first check to make sure the ISO image is not mounted
    by opening a Finder window and checking the disc in the area at the top of the
    left pane. If the disc is mounted, a drive icon will appear in that location.
    If the drive icon is there, click the arrow next to that to entry, or *unmount*,.


    After that, click **Applications** in the same Finder window, and then look for
    and open the **Utilities** folder. In that folder, find and then double-click
    **Disk Utility**. If the ISO is not listed in the left pane of the Disk Utility
    window'
  merge: -1
