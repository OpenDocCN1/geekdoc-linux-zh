    searching for BookWrite, a fun little program to help you write your own novel.
    It should appear in the search results just like any other application, so you
    can install it in the usual way.


    That was quite a few steps to go through, but that''s all there is to it. It beats
    driving to your local computer store to buy a new program, eh?


