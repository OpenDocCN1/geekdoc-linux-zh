    # 8B-10: Placing Home and Trash Icons on the Desktop


    As you are already aware, unlike Windows, Mac OS, or other Linux distributions,
    Ubuntu has a completely empty desktop upon installation. A lot of people advocate
    this approach because it discourages the permanent use of the desktop as a location
    to store files and program launchers. After all, the argument goes, you don''t
    place your trash or file cabinet on the desktop in your office, do you?


    All logic aside, many people prefer to have their trash can, hard disk, and home
    folder on their desktops, thank you very much. If you are one of them, here''s
    what you need to do:


    +   1. Open the Configuration Editor, as you did in "Project 8B-9: Changing the
    Order of the Window Buttons" on page 138.

    2. Click the + next to apps, scroll down to nautilus, and click the + next to
    that.


