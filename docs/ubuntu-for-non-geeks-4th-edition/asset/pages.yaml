    Once the CD/DVD Creator window is open, copying the files you want to burn to
    disc is pretty much a simple drag-and-drop maneuver. Just open new Nautilus window,
    and drag the files you want to burn from that window to the CD/DVD Creator window.
    If you prefer to do this in a decidedly Windows-esque fashion, you can select
    the files you want to transfer to disc by clicking each file once, holding the
    CTRL while doing so, for multiple selections. If you want to select consecutive
    files, then click the first file in the group, and hold SHIFT, and then click
    the last in the group, automatically selecting all the files in. Once you''ve
    made your selections, release the CTRL or SHIFT key, right-click any of the highlighted
    files, and select Copy in the pop-up menu. After that, go back to the CD/DVD Creator
    window, right-click any open space, and then select Paste in the pop-up menu.


    It is probably worth mentioning that the files you copy to the CD/DVD Creator
    are not actually copied. Instead, you will see them in the CD/DVD Creator in their
    original locations. Thus, if you move one of the files from its original location
    before burning the contents of the CD/DVD Creator to disc, the link won''t work
    any more and the file won''t be copied onto the disc. This isn''t too much of
    a problem, since all of the other files will be put onto the disc correctly, but
    it is something worth aware of.'
