  md: '# 15


    # PLUGGIN'' IN THE PENGUIN


    Working with Your iPod, iPhone, and Other Digital Media Devices


    ![](img/35405f17cef8b43ddf1af3fc22de194c_313_0.png)


    With all the talk in the previous chapter about ripping, encoding, and playing
    back audio files, you may be wondering whether Ubuntu will allow you to transfer
    any of those files to your digital media devices, such as your MP3 player or cell
    phone. Well, you will be happy to know that using your device on your Ubuntu system
    is quite easy—easier than ever before. No longer do you have to mess around with
    mount and unmount commands or edit system tables, and if you don''t know what
    I''m talking about, consider yourself lucky. Just plug in your device, and Ubuntu
    will do the rest.'
