    # Locked AAC (M4P) Files


    If you purchased music from the iTunes Store before Apple did away with digital
    rights management (DRM) in its music, chances are you in possession of some locked
    AAC files, which you can recognize by .m4p extension. These files can be played
    only on registered machines through iTunes. You might have already discovered,
    you cannot touch such files on your system as. All you get when you try to play
    one is an error message and an option to have Ubuntu search for the plug-in. Accepting
    that option is the easiest way to get the support you need to play files within
    Ubuntu.


    Once you accept, Ubuntu will search for the plug-in and necessary files. Once
    Ubuntu finds them, it will show the result of its search in a new window (Figure
    15-11). Click Install to continue. When the process is complete, you will be able
    to play previously locked AAC files on your system. If Rhythmbox was running while
    the installation process was taking place, however, you will need to restart it
    before it will be able to handle the files.


    288 Chapter 15'
