  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_394_0.png)


    # # Bugs, Bugs, Glorious Bugs


    The computers of yesterday were enormous, complicated beasts, filling entire rooms
    with delicate electronics and whirring tape drives. Renowned computer scientist
    Grace Hopper, retrieving a moth from a relay in such giant, tapped the offending
    insect into her log book and remarked that she had found a “bug” in the computer.
    Well, computers may have changed a lot since the 1940s, but some of the terminology
    hasn’t. Whether it’s as major as a program crashing or freezing or as minor as
    a missing icon, any problem that you find with a piece of software is still referred
    to as a bug.


    You’ve almost certainly come across a bug before—software, whether commercial
    or open source, is ever perfect. The difference with open source is that you’re
    strongly encouraged to report problems wherever you see them. Developers need
    feedback in the form of bug reports so they know what needs fixing, and problems
    get fixed more quickly if they’re reported sooner. Filing a report is a relatively
    easy way of giving back to the community; it doesn’t take long, it helps to improve
    the software for everyone, and you get an annoying software problem fixed for
    free!


    # ## What Counts as a Bug?


    There are lots of different types of bug, but you can usually fit them into one
    of the following categories:


    +   - When a program crashes, freezes, or shows an error message for good reason
    (for example, Figure 20-3)

    - When something doesn’t work (for example, when a button does nothing when you
    click it)'
  merge: -1
  pgno: 394
