    5. In the Permissions tab, go to the Group and Others sections, and select **None**
    in the drop-down menus next to the words **Folder** access. Be sure to do this
    in both the Group and Others sections. When you''re done, your window should look
    like mine in Figure 7-10. If so, click **Close**.'
