  md: '# Hardware Drivers


    Proprietary drivers are being used to make this computer work properly.


    Proprietary drivers do not have public source code that the screen has Ubuntu
    developers are free to modify. Security updates and corrections depend solely
    on the responsiveness of the manufacturer. Ubuntu cannot fix or improve these
    drivers.


    +   - Broadcom STA proprietary wireless driver


    +   - ATI/AMD proprietary GLX graphics driver


    # Broadcom STA proprietary wireless driver


    +   - Tested by the Ubuntu developers

    - License: Proprietary


    These packages contain Broadcom 802.11 Linux wireless driverfor use with Broadcom''s
    BCM4311, BCM4312, BCM4321-,and BCM4322-based hardware.


    This driver is activated and currently in use.


    Figure 21-3: Using the Hardware Drivers tool to disable a restricted driver


    # Check Your System Memory for Defects


    Your system memory (also known as RAM) is vital to the operation of your computer.
    It''s where all your programs (and Linux itself) store information when they''re
    running. If a fault occurs in your system memory, freezes and crashes can start
    happening for seemingly no reason.


    To check for problems with your system memory, boot from the Ubuntu CD included
    with this book (Chapter 2 to remind yourself how to do this). As soon the purple
    boot screen appears, press a key and select your language from the menu that pops
    up. Then, choose Test memory from the main menu and press ENTER. The screen will
    turn blue, and the Memtest86 program will start running (Figure 21-4).


    test86 repeatedly writes to your system memory and then accesses them few moments
    later. It''s like a stress test for your RAM. Let it run until the Pass percentage
    at the top right of the screen has 100 percent once or twice—this might take as
    long as an hour or two, depending on how much memory you have. By that time, Memtest86
    should have found any faults in the system memory and reported them on the screen.
    If it finds a problem, you might need to get some of your RAM replaced, because
    it could be damaged.


    You can turn off your computer at any time Memtest86 is running—you don''t need
    to shut it down properly as you usually would.


    Wounded Wings 381'
