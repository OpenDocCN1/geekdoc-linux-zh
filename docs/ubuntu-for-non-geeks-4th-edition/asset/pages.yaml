  md: '# Online Music Stores via Rhythmbox


    While iTunes only has the iTunes store, Rhythmbox provides you with options, all
    of which can be accessed from the left pane in the Rhythmbox window under the
    Stores heading. Two of these stores, Jamendo and Magnature, provide music released
    under Creative Commons or open license by independent artists. The other store
    is the Ubuntu One Store, which provides music by major artists from the 7digital
    catalog. The songs there are free from the digital rights management (DRM) limitations
    found in many songs purchased from other online stores.


    # Other Cool Features in Rhythmbox


    Rhythmbox includes a few cool features worth noting. In addition to manage podcasts,
    it also supports displaying album cover art. As you can see in Figures 14-2 and
    14-4, when you play a track in Rhythmbox, the album cover art for that is automatically
    downloaded and displayed in the lower-left corner of the window (assuming Rhythmbox
    can find the cover online).


    Another cool feature is to have lyrics. To use this feature, you must first activate
    it by selecting the Edit menu and selecting Plugins. In the Plugins window that
    appears (Figure 14-5), check the Song Lyrics box, and then click the Close button.
    After that, go to the View menu, and select Song Lyrics. Rhythmbox will then search
    the Internet for the lyrics to the track you are currently playing and display
    them in a separate window (Figure 14-6).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_303_0.png)


    Figure 14-5: Activating Rhythmbox''s lyrics function'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'Finally, if you are an iTunes user and attached to a bit of visual stimulation
    while playing your tunes, Rhythmmbox can now satisfy you with a visualizer of
    yours. To activate it, go to the View menu and select Visualization (you can turn
    it off in the same way). The right half of the Rhythmmbox window will be filled
    with the wild, swirling shapes and colors of psychedelic that you''ve come to
    know and love.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_304_0.png)


    Project 14-6: Rhythmmbox displays the lyrics to the track currently playing.


    # # Project 14B: Listening to Streaming Media with Rhythmmbox


    In addition to allowing you to play audio CDs or the music you have stored on
    your hard disk, Rhythmmbox also allows you to play Internet radio streams in either
    MP3 or Ogg format. To add a stream, click the Radio icon in the left pane of the
    Rhythmmbox window—you will come face with only about a dozen streams the first
    time around. In this project, I will try to fatten your collection a bit by showing
    how you can add streams on your own.


    # ## 14B-1: Adding Radio Streams to Rhythmmbox


    To started, let''s try adding FIP, a French music station specializing in the
    eclectic. The process for adding FIP is essentially the same for adding any other
    stream. Here are the steps:


    +   1. Click Radio in the left pane of the Rhythmmbox window.

    2. At the right end of the button strip below the menu bar, click the Create new
    Radio Station button (the one that looks like a little red radio).

    3. In the window that then appears, type http://www.tv-radio.com/station/fip_mp3/fip_mp3-128k.m3u/,
    and click Add.

    4. Double-click the new entry for your stream to play it.'
