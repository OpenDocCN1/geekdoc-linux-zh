  md: '# 17B-2: Getting and Extracting Schnapsen


    Once you''ve installed the Java Runtime Environment, you need to run a Java application
    in order to see it work. The application you''ll be installing is one I had been
    searching for ever I moved to the world of Linux, a 20-card Austrian card game
    called Schnapsen, shown in Figure 17-17.


    To start, you will need to download and extract Schnapsen. Here''s what you need
    to do:


    +   1. Open your web browser, and go to http://projects.hagru.at/tjger/en/

    2. On that page, click the Schnapsen link in the left frame.

