  md: '# 3A-8: Moving Around on the Panel


    Well, now you''ve added all you are going to be adding to this chapter. It might
    seem a little messy up right now, so let''s do a bit of housekeeping by moving
    around. You will try to group things together somewhat theoretically as to make
    them easier to deal with.


    Fortunately, you can move panel launchers easily by right-clicking the launcher
    in question, selecting Move from the pop-up menu, and then dragging the launcher
    to the spot you want to place. Once the launcher is where you want it, click the
    launcher once, and it will stay there.


    To get some practice with this moving business, let''s move the launchers, menus,
    and drawers you added by placing them in the following order, from left to right:
    Applications, Places, System, Firefox, Help, OpenOffice.org Writer, OpenOffice.org
    Calc, Sound & Video, Games, Drawer. Place the remaining launchers towards the
    right end of the panel, to the left of the Network manager or others that appear
    the automatically, in the following left-to-right order: Eyes, Wanda (Fish), Force
    Quit. Finally, place the Run Application itself, midway between the two clusters
    of launchers. When you''ve made all your changes, your panel should look pretty
    much like in Figure 3-13.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_73_0.png)


    Figure 3-13: The GNOME panel with the new launchers


    # More Panel Fun


    In addition to the basic customization you did in Project 3A, you can do a lot
    more to change the look and feel of your panel. Of course, you can remove any
    of your launchers, drawers, or menus by right-clicking the item in question and
    selecting **Remove From Panel** in the pop-up menu, but there are still more options.
    Most of these are available by right-clicking any open space in the panel and
    then selecting **Properties**, which will open the Panel Properties window.


    From this you can change the position of the panel, its size, change its color,
    or make it transparent—very cool. You can also set the panel so that it will automatically
    disappear when you are not using it and have it reappear when you bring your mouse
    cursor into the area where the panel normally resides. Don''t feel afraid to play
    around—that''s half the fun!'
  merge: -1
