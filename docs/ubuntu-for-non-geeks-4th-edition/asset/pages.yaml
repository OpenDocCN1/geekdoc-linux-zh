    # # Choices, Choices, Choices—Installation Options


    If you have already installed Ubuntu on your machine, you are satisfied running
    it from the live CD, or still haven''t made up your mind what to do, you can skip
    the rest of this chapter and continue to the next one to get started working with
    the Ubuntu desktop. If, however, you haven''t installed Ubuntu and are rare and
    rarity to do so, then you had better stay right where you are and continue reading.


    # Going for a Swim—Installing Ubuntu Inside Windows (the Wabi Installer)


    It used to be that if you enjoyed Ubuntu enough to run it off your hard disk but
    were afraid to do it for fear of damaging the delicate state of your Windows setup,
    you were ... well, out of luck. Things have changed, because there is now an installation
    option called Wabi that lets you install Ubuntu directly on your Windows C drive
    as if it were any other Windows program. Once installed, every time you start
    up your machine, you will be able to choose between starting up into Windows or
    into Ubuntu from the Windows bootloader screen. Your Windows system stays as it
    is; you don''t have to partition your hard disk; and if you want to get rid of
    Ubuntu later for whatever reason, you can do so like you would with any other
    Windows application. It''s a great way to go about things for the faint of heart.'
  merge: -1
  pgno: 49
