    3. Click the entry for your printer in the left pane of window, and then printer
    click **Forward**.

    4. The system will begin searching for drivers for your printer and will identify
    the make of your printer in the next screen of the wizard. Check that the correct
    make is selected, and then click **Forward**.

    5. On the next screen, your printer model should appear in the left pane, while
    the recommended driver will appear in the right pane (Figure 10-5). Click **Forward**.'
