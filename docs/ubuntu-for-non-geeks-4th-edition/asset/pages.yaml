  md: '# $ mkdir


    You have already learned how to create folders by means of menus and your mouse,
    you can also do this using the command line. The command is mkdir (directory),
    and it is as easy as pie (though I''ve never been quite sure how pie is).


    To see how this command works and to work with the commands that follow, use the
    mkdir command now to create a folder called mkdir_exp (for command experiments).
    All you have to do is type mkdir command_exp in a new Terminal window and press
    ENTER. The new folder should appear in your home folder, so go ahead and check
    whether it is there by clicking on the icon on your desktop.


    OK, good, bunda. Now let''s create another folder within new—sub, if you will.
    We''ll call this one sub. So, just type mkdir command_exp/sub, and press ENTER.
    You can now take a peek and see the sub folder appears within the command_exp
    folder, if you like.


    # $ mv


    The next command is the mv (move) command, but before you experiment with it,
    you need to create a dummy file—you need something to move, after you can do this
    by using another command—touch. To make the file—let''s call it expfile.txt—go
    to the Terminal, touch expfile.txt, and press ENTER. The new file will now appear
    in your home folder.


    To move the file you''ve created, you will use the mv command of, just mv expfile.txt
    command_exp/sub (this tells the system which file to move and where to move it
    to), and press ENTER. The file will be in your subfolder.


    # $ cd


    Until now, you have been using the cd command, you can change your Terminal''s
    location to another folder. This is a very handy command that will be using quite
    a lot when doing the projects in this book. To take it out for a spin, let''s
    get inside the command_exp folder by typing cd command_exp and pressing ENTER.
    If you''ve done this correctly, the prompt in your Terminal should now read username@computer_name:~/command_exp.
    If so, you can pat yourself on the back.


    While you are there, you might as well try the ls -R with the R (recursive) flag
    to see what you have. Just type ls -R, and press ENTER. Your Terminal should now
    show that you have a subfolder there called sub and a file inside that subfolder
    called expfile.txt.


    That is all you really want to do in there for now, so get back to your home directory,
    just type cd and press ENTER, which will take you back home, to speak.'
