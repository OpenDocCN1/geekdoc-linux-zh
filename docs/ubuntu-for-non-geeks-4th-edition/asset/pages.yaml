- img_proc: true
  md: '# Project 16A: Installing Support for Encrypted DVDs


    As I already mentioned, Ubuntu does not allow you to play encrypted DVDs from
    the start. For you to watch such DVDs (and that would be the vast majority of
    them), you need to install a whole bunch of stuff, most crucially, the package
    libvdread4. Fortunately, if you installed the audio support files I mentioned
    in Chapter 14, you''re halfway there. If you didn''t install them or you just
    want to double-check, start running the Ubuntu Software Center, and make sure
    you have these files and a few others installed. If anything is missing, install
    it. Here''s what you need to have:


    +   - gst-gplugins-base

    - gstreamer0.10-plugins-good

    - gstreamer0.10-plugins-ugly

    - gstreamer0.10-plugins-bad

    - libvdread4


    Now you''ve come to the final and essential step required for this project. For
    this task, you''re going to have to the trusty ol'' Terminal (Applications ▸ Accessories
    ▸ Terminal). Once the Terminal is open, type the following command, and press
    ENTER:


    ```

    sudo apt-get install libvdread4

    ```


    With just any other application, you would be done at this point, but libvdread4
    requires you to also run an installation script that comes with it in order to
    fully get the job done. To run the script, go back to the Terminal, then press
    ENTER:


    ```

    sudo /usr/share/doc/libvdread4/install-css.sh

    ```


    Once the Terminal returns you to the user prompt, the process will be done. Try
    by playing a DVD in your drive—Totem should open and start playing the DVD. (You''ll
    learn more about Totem soon.) If it doesn''t work, open the Ubuntu Software Center,
    and check to make sure all the support plug-ins listed earlier are installed.
    If everything is there, go back to the Terminal, and perform the last two steps
    again.


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, or SECAM) and
    any regional encoding. This is a better than the DVD player you have hooked up
    to your TV, because the vast majority of stand-alone players in the United States
    (I would venture to guess 99.9 percent) do'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'not allow you to play anything other than Region 1 NTSC discs (NTSC being the
    broadcast standard in the United States and what its televisions are designed
    to display, while the DVD region is 1). This information is usually provided on
    the back of DVD packages (see the examples in Figure 16-1), though the packaging
    for most discs produced for the U.S. market does not include it.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_329_0.png)


    Figure 16-1: Examples of regional encoding labels on DVD packages


    Despite the wonderful everything-goes-nature of your computer in terms of DVD
    playback, there is a serious caveat to bear in mind. Depending on the manufacturer
    of your DVD drive, you will be able to switch back and forth between DVDs of differing
    regional encodings only four or five times. After that, the drive will be locked
    into the regional encoding of the disc you were playing at that time... is unrelated
    to your operating system—it is strictly a hardware matter. The only exception
    to this region-lock are DVDs Region Free or ALL labeled as Region 0, which can
    be played on any DVD player in any region and thus do not register as an encoding
    switch when you flop one of them in your computer''s drive.


    If your drive eventually lock into one regional encoding, especially one for which
    you have few DVDs, so there is some good news. Now that comes in the form of Videoolan''s
    libdvdcss2, the library that is included in the libdread package you installed
    in Project 16A. The libdvd2 allows you to play back encrypted DVDs. In addition
    to that libdvd2 also, in theory, allows you to play back DVDs from multiple regions
    even if your DVD drive is already locked into one region. This can be done by
    performing a cryptic attack (to use Videoolan''s for it) on your drive until you
    can find the key for that. Of course, this process of cryptic bombardment can
    take several minutes, so it is not the optimal way of getting about things. Better
    than being stuck, though. Whether this process of bypassing regional encoding
    remains a subject of debate, so if you are concerned about such things, you should
    do a little research.


    # Totem Movie Player


    The default video player in Ubuntu is Totem, which as you can see in Figure 16-2,
    has a very simple interface that makes using it quite simple. You can run Totem
    by selecting Applications › Sound & Video › Movie Player. You can also run it,
    as you have just learned, by simply placing a DVD in your drive, because Ubuntu
    is set up to run Totem any time you do so.'
