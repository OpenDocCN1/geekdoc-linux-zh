    # 9B-1: Getting Ready for pyWindows (Installing Tkinter)


    As I mentioned, one difference between pyWindows and the most of the applications
    you know is that pyWindows is a Python script. To create a graphical interface
    for itself, pyWindows uses a toolbox known as Tkinter, which is the facto standard
    (though not the only) GUI toolbox for Python. Tkinter, however, no longer comes
    bundled with Ubuntu, so you will need to download and install it. Fortunately,
    this is quite easily done.


    Although it is possible to whip the Ubuntu Software Center and install Tkinter
    by the simple means learned in Chapter 6, it seems more appropriate in this command
    line-oriented chapter to . . . yeah, you got there, use the command line. That
    said, open a Terminal window, type sudo apt-get install python-tk, and then press
    ENTER. When asked for your password, type it, and then press ENTER. ENTER will
    search the repositories and find your file, with anything else it requires to
    function properly. Once it is ready, it will ask whether you want to continue.
    You do, so y and then press ENTER. When your username prompt appears, you''ll
    know the job is done, and you can go on to the next step.


    > If you prefer, you can perform this installation using aptitude instead, using
    the techniques we discussed earlier in the chapter.


    # 9B-2: Getting pyWindows


    You are just about to begin "installing" pyWindows, but before you do, you need
    to get it from http://sourceforge.org/projects/pywindows/. Once there, click the
    View all files button, and then download the file pywindows-1.tar.gz. Then place
    the file in your home folder so that you can follow easily with the rest of the
    project.


    # 9B-3: Creating a LocalApps Folder for pyWindows


    As I mentioned earlier, you will be installing the pyWindows program locally in
    your home folder. Installing a program locally means that you are installing the
    program and all its support and data files in your home folder. This makes things
    a bit easier, but it also means that the program will not be available to other
    users. It also means that if you''re not careful, you might inadvertently delete
    it.'
