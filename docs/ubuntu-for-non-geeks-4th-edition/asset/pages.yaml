- img_proc: true
  md: 'Although it can be used on a number of operating systems, ClamAV is considered
    to be the Linux antivirus package. It is open source and totally free, and you
    don''t have to worry about licenses or suffer the bother of renewing them. Unfortunately,
    on its own, ClamAV is a command-driven application, which makes it a bit less
    user-friendly. Fortuntately for all involved, a graphical interface, albeit a
    simple one, is available; it goes by the name of ClamTk. Both ClamAV and ClamTk
    are available via the Ubuntu Software Center—search for clamtk, and Virus Scanner.
    The Ubuntu Software Center will automatically install ClamAV and all other packages
    it needs to run.


    Once ClamAV is installed, you can perform a virus scan by selecting Applications
    > Accessories > Virus Scanner. This will open the ClamTk Virus Scanner window
    (Figure 19-5).


    Once up and running, you can scan your system by demand from the menu Scan. To
    scan a single folder, choose A Directory. To scan a directory and everything in
    it, choose Recursive Scan. In either case, the Directory window will appear. Select
    the folder or disc you wish to scan, and click OK. ClamAV will then start scanning
    your system. ClamTk will tell you what it is scanning at any given moment in the
    empty space just below the button. If it finds anything suspicious, it will list
    that item in the main pane of the window.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_381_0.png)


    Figure 19-5: ClamTk—the graphical interface for ClamAV


    ClamAV is set up by default to check for signature updates when it starts. These
    signature updates tell ClamAV what viruses to be the lookout for. If you leave
    your machine on for days and days at a time, it is probably a good idea to set
    things up that ClamAV will automatically check for signature updates daily rather
    than just on startup. To do this, go to the Advanced menu, and select Scheduler.
    In the Schedule window, select a time for ClamAV to update its cache in the bottom
    half of the window. Click the Add button when done. You can also use this window
    to set up a time to regularly scan the system—just select the time you''d like
    the scan to occur, and click Add. When you''re finished, click Close.


    As I mentioned, the only viruses you are likely to encounter during a virus scan
    are designed for Windows systems, which cannot affect your Linux system. Although
    it won''t hurt you to scan your entire system for viruses,'
