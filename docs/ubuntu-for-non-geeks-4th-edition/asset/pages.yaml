  md: '# Project 13A: Importing Images from Digital Cameras


    Although scanner support for Linux can prove a bit spoty, support for digital
    cameras is practically a worry-free affair. In fact, if Ubuntu can''t figure out
    what kind of camera you have, it just treats it as if it were an external drive
    or flash drive plugged into your computer''s USB port. And even if your camera
    doesn''t seem to communicate with your connected directly, you can still transfer
    your images to your hard disk by removing the memory card from your camera, inserting
    it into a USB flash memory card reader, and plugging that into one of your computer''s
    USB ports. In that case, your system will mount the card reader as if it were
    an external drive (which is pretty much what it is), thus allowing you to copy
    the images to your hard disk. Of course, you can use this method even if your
    camera works just fine with Ubuntu—some people find it to the easiest to deal
    with things, anyway.


    # 13A-1: Importing Images from Camera to Computer Somewhat Automatically via F-Spot


    When you connect your camera to your computer via a USB cable, put your camera
    in play mode, and power it on, Ubuntu will automatically recognize and open a
    window that asks how to import the photos on the camera. To import the photos
    via F-Spot, accept the default selection in the drop-down menu button, Open F-Spot
    (as shown in Figure 13-1), and then click OK. After that, here''s what you need
    to do:


    +   In the window that appears, you will see thumbnails and filenames of all the
    photos on your camera. By default, all the images are selected. However, if you
    prefer to copy only some of the images, you can do so by holding the CTRL key
    and clicking the desired images, as shown in Figure 13-2.


    +   Once you''ve made your selections, click the Target location button, and choose
    where to copy your photos. Your Pictures folder, or a subfolder within it, might
    be a logical spot.


    +   You can also tag the photos you are about to import by checking the Attach
    tag box and selecting the desired tag from the menu button to the right. I''ll
    tell more about tagging in Project 13B-2.


    +   Finally, click the Copy button.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_281_0.png)


    Figure 13-1: Ubuntu recognizes your camera and asks you how to proceed.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_281_1.png)


    Figure 13-2: Selecting photos to import from your digital camera via F-Spot Photo
    Manager


    +   5. F-Spot will then begin the copying process, showing its progress in a separate
    window. When the download is complete, the words Download Complete will appear
    within the progress bar of that window. Click the OK button. You can now view
    your images within the main F-Spot window (Figure 13-3).'
  merge: -1
  pgno: 281
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_282_0.png)


    # 13A-2: Transferring Images from Camera to Computer via Nautilus


    As I mentioned, you can also use Nautilus to import photos from your camera. The
    process for doing this starts pretty much the same as I discussed in Project 13A-1,
    albeit with a slight twist. Here''s how you do it:


    +   1. Plug your camera into one of your computer''s USB ports, and put your camera
    into play mode. Within seconds, a window like in Figure 13-1 will appear. In that,
    select Open Folder in the drop-down menu instead of the default F-Spot, and then
    click OK. A Nautilus window will appear revealing the contents of your camera''s
    storage card. An icon for your camera will also appear in the side pane of that
    window and any other open Nautilus window (Figure 13-4) and on your desktop as
    a doubleclickable launcher.

    2. Double-click your way through the folders on your camera until you find the
    photos you want to import.

    3. Drag and drop or copy and paste the images from your camera to any logical
    spot in your home folder.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '4. When you''re done with your transfers, either click the eject icon next
    to the entry for your camera in the left pane of Nautilus window or right-click
    the icon for your camera on the desktop, and Unmount. The icon for your camera
    will then disappear from the side pane and desktop. Or, easiest of all, just turn
    off your camera, and the desktop and Nautilus instances of your camera should
    automatically disappear.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_283_0.png)


    Figure 13-4: You can also drag and drop photos from your digital camera as if
    it were USB drive.


    # Project 13B: Working with Digital Images in F-Spot Photo Manager


    F-Spot not only imports images from camera to computer but also acts as a handy
    photo-organizing, browsing, viewing, and editing tool. And working in conjunction
    with Evolution, the default email software in Ubuntu, F-Spot allows you to send
    images via email (File > Send by Mail) without fiddling around with attachments.
    You can run F-Spot by selecting Applications > Graphics > F-Spot Photo Manager.
    Note that the first time out, you will be asked to select the folders that hold
    the images you want to import into F-Spot.


    # 13B-1: Exporting Images to Online Albums and Galleries


    A very cool feature of F-Spot is that it allows you to export images to numerous
    online gallery or album sites, such as Flickr and Picasa, like Windows Live Photo
    Gallery. Exporting an image to an online gallery or album'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'pretty simple, and I''ll use a Picasa web album for this example. Here''s what
    you need to do:


    +   1. Select the photos you want to place into your online album by holding down
    the CTRL key and clicking each photo once.


    +   2. In the main F-Spot window, select Photo ► Export to ► PicasaWeb, after
    which an Export window the one in Figure 13-5 will appear.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_284_0.png)


    Figure 13-5: Exporting images to online galleries via F-Spot


    +   3. The first time out, you will need to click the Add button at the top of
    the window (to the right of the *Gallery*) to set up so that F-Spot can access
    your online gallery.


    +   4. In the small window that appears, type the username and password for your
    online album/gallery service (not your username and password for Ubuntu). Click
    **Add** in window when you''re done.


    +   5. You can also decide which of your online albums you want to add the photos
    by clicking the drop-down menu in the Album section. Or, if you want to create
    a new album, click the **Add** button to the right of that menu, provide a title
    and description in the small window that appears, and then click **Add**.


    +   6. Once back in the Export window, click the **Export**.


    F-Spot will start uploading your images to your online gallery site, letting you
    know what it''s doing in a progress window. Once, your browser will open to your
    online gallery page, revealing your newly uploaded images. You can toggle this
    post-export automatic browser opening feature by checking or unchecking the **Open
    album in browser when done uploading** box in the Export window (Figure 13-5).'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 13B-2: Organizing Your Photo Collections with Tags


    As your photo collection grows and grows, it can get rather tough to sort things
    out and find exactly what you need. Unfortunately, F-Spot has a few ways of making
    this easier to deal with, one of which is the thumbnail slider, located immediately
    above the thumbnail-viewing pane, which allows you to locate images by year and
    month.


    An additional and interesting way of organizing things is by using tags, which
    allow you to identify images thematically. Applying tags and using such tags to
    narrow down your photo searches is pretty easy to do.


    First, to apply tags to your images, just drag the appropriate tag icon from the
    left pane of the F-Spot window directly onto the image you want to tag. You can
    place more than one tag on a picture. Once you have added a tag, a small version
    of the tag icon will appear below the image, as you can see in Figure 13-6.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_285_0.png)


    Figure 13-6: Using F-Spot''s tags feature to help deal with hefty photo collections


    The number of preset tags is rather limited, but you can add your own by selecting
    Tags > Create New Tag.


    Give your tag a name in the Create New Tag window that appears, and click Create.
    The new tag will then appear in the left pane of the F-Spot window, albeit without
    an icon. There are two ways to add an icon is'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'simply drag the iconless tag to a photo you want to tag with, after which a
    mini-thumbnail of that image will become the icon for the tag.


    The other approach is to right-click the new tag and select the icon for the pop-up
    menu. In the window that appears, click the icon button next to the word Icon,
    and then select one of predefined icons in the window that appears. You can also
    use this approach to edit the photo of an automatically created tag, which allows
    you to determine exactly what portion of a picture you want to use as the icon
    for tag (Figure 13-7).


    ![](img/35405f17cef8b43ddf1af3fc22de194c_286_0.png)


    Figure 13-7: Modifying the portion of photo used as an icon tag in F-Spot


    Searching for images by tag is perhaps even easier than adding the tags to the
    images in the first place. Let''s say you wanted to find all of your images that
    were tagged as Events. You would first go to the Find menu and select Find Selected
    Tag. A bar will appear directly above the thumbnail viewing area of the F-Spot
    window. Drag the icon for the Events to tag that bar, and almost immediately images
    tagged as Events will appear in the thumbnail area below. Sweet.


    #  Getting Arty with the GIMP


    The Windows and Mac worlds have Photoshop, but the Linux world has the GIMP (see
    Figure 13-8). Although arguably not as powerful as Photoshop, the GIMP is a capable
    contender, which may explain why it has been ported to both Mac and Windows. The
    GIMP allows you to create bitmap graphics and, quite importantly, retouch or completely
    doctor image files.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'With the GIMP you can get rid of red-eye in your digital photos, airbrush out
    unwanted shadows (or even facial blemishes), give your image a canvas texture,
    change a photo into an oil painting, and give a bell pepper here and—draw shadows
    shows no less.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_287_0.png)


    Figure 13-8: Manipulating a digital image in the GIMP


    Because not everyone needs or uses the power of the GIMP, the powers that have
    unfortunately decided to no longer bundle it on the Ubuntu Desktop CD, freeing
    up space for more frequently run applications. Pity that might be, you can still
    install the GIMP via the Ubuntu Software Center. Just do a search for GIMP, and
    then install it as you would any application, as you learned to do in Chapter
    6. Once installed, you can run the GIMP by selecting Applications > Graphics >
    GIMP Image Editor.


    # Using the GIMP to Resize Images and Convert File Formats


    Like F-Spot, the GIMP is also a very handy tool for resizing images. You can do
    this by simply right-clicking an image opened in the GIMP and then selecting Image
    > Scale Image in the pop-menu. This will open the Scale Image window, where you
    can set the new size of your image.


    The GIMP is also an excellent tool for converting images from one format to another.
    You can, for example, open a bitmap (.bmp) file and save it as a PNG (.png) file,
    save a JPEG (.jpg) file as a GIF (.gif) file, and so on.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'Although this can be done with other graphics applications, GIMP supports an
    extremely wide variety of file formats, and even lets you save an image as a compressed
    tarball, which makes it a true file conversion king.


    To perform a file conversion, just right-click an image opened within the GIMP,
    and then select File Save As in the pop-up menu. You can make the same selection
    from the File menu if you prefer. Either way, the Save Image window will appear.
    In that window, you can specify the new format by replacing the original file
    extension in the Name box of that window with the extension for the format you
    want to convert the image. If you''re not sure what formats are available to you,
    click the small arrow to the left of the words Select File Type (By Extension),
    and then choose from the options in the pane that appears below. To save a work
    in progress, use the GIMP-native XCF format so that you can continue working on
    the image later.


    # Learning More


    It is lots of fun to learn the GIMP by just playing around with it for a while.
    While you started, most of the fun is located in the Filters menu of any image
    window. Of course, you should make a backup copy of any image you are planning
    to experiment with before altering.


