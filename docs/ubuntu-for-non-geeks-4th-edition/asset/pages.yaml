- img_proc: true
  md: 'This is just an example—PPAs aren''t only used by enthusiasts to distribute
    nostalgic software. Some Ubuntu developers use PPAs to make the latest versions
    of software, albeit in an unofficial and untested manner. If a major new version
    of OpenOffice.org or Firefox comes out, for example, keep your ear to the Ubuntu
    forums (http://www.ubuntuforums.org/) to see whether someone has made the latest
    and greatest available through their PPA.


    # Project 6C: Installing DEB Packages Not Available via the Ubuntu Repositories:
    Skype


    As you may recall, the applications you install from the repositories via the
    Ubuntu Software Center are in the form of DEB packages. Although it might seem
    that those repositories contain just about every piece of software possible, certain
    packages, for one reason or another, never find their way to a repository. Skype
    is one of these packages.


    Skype, shown in Figure 6-11, is Voice over IP (VoIP) software that allows you
    to speak to other Skype users over the Internet, with the clarity of a regular
    telephone line. And the best part is, it doesn''t cost anything—even if you call
    users overseas. Skype also offers services, such as SkypeOut, which allows you
    to call regular mobile and landline telephone numbers from your computer at a
    fraction of what would normally cost from a regular telephone.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_126_0.png)


    Figure 6-11: Skype'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Although it is true that open source VoIP packages as Ekiga Softphone are available
    in Ubuntu, they are not compatible with the much better known and more widespread
    Skype. Since it is very likely that the majority of people you know are using
    a VoIP software package like Skype, it only makes sense to use Skype so that you
    can easily communicate with them.


    Skype is not available from the Ubuntu repositories, you will need to get it yourself
    from the Skype website (http://www.skype.com/). Once, click the Download button,
    which will automatically take you to the download page for Linux versions of Skype.
    On that page, click the link for Ubuntu, and click the Save File button in the
    window that appears.


    Once the download is complete, you will find the DEB package on your hard disk,
    probably in your Downloads folder. Double-click that package to open the Installer
    window (Figure 6-12). Click Install, after which you will be prompted for your
    password. Once the installation is complete, click the Close button in the window
    that appears and again in the Package Installer window.


    As is the case with all APT frontends, you cannot use Package Installer while
    another APT frontend is open. Also, make sure that Update Manager and the Ubuntu
    Software Center are closed before using Package Installer.


    Once all the pieces have been installed, you can run Skype by selecting Applications
    ▸ Internet ▸ Skype. If you find that you can''t make calls or the sound doesn''t
    work properly, take a look at https://help.ubuntu.com/community/Skype/ for troubleshooting
    hints. Also, while we''re on the topic of sound, remember that it is best to use
    Skype with a headset. Trying to talk with a cheap microphone could cause feedback
    or echoes, because the microphone will pick up and transmit sounds from the speakers.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_127_0.png)


    **Figure 6-12:** The Package Installer window'
