  md: '# Other Video Apps


    I''ve covered the main video applications in Ubuntu, but there are still others
    that you want to consider, all of which are available via the Ubuntu Software
    Center. If you are interested in yet another alternative/DVD player, you can try
    GNOME MPlayer, which has long quite a significant following because of its ability
    to handle numerous video formats.


    Another cool application for video streaming enthusiasts is Miro Net (16-12),
    which allows you to easily search, download, and play online video streams. just
    perform an Ubuntu Software search for miro.


    If you have a webcam, you might also want to try an application called Cheese,
    which allows you to take pictures and videos from your webcam and add cool video
    graphical effects. Camorama is yet another webcam viewer/capture application to
    think about.


    If you''re looking for an alternative to PiViT and Kino, Avidem. One very handy
    feature makes it worth having, even if you don''t use it as your main video editor:
    It can rip audio tracks from video files. You can get Avidem from the Ubuntu Software
    Center. Be sure to install the GTK+ (not the Qt one).


    For those of you interested in ripping DVDs, you might try DVD-Rip, AcidRip DVD
    Ripper, or the lesser known figure out Toggen DVD Ripper. You might also be interested
    in DVD9 and the more highly configurable K9copy, which is the Linux world''s answer
    to you to rip dual-layer DVDs (DVD9) and compress the output so that it will fit
    on a single-layer blank DVD (DVD5). For creating your own DVDs from scratch (like
    you would with iDVD), a few applications are worth considering: DVD Styler, JDVDAuthor,
    and Bonombo DVD.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_339_0.png)


    16-12: A video streaming enthusiast''s dream: Miro'
