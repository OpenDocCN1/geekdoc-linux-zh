  md: '# Keyboard Preferences


    ![](img/35405f17cef8b43ddf1af3fc22de194c_252_0.png)


    Figure 11-5: Viewing the active keyboard layouts on your system


    After closing the Keyboard Preferences window, a keyboard layout indicator will
    appear in the upper-right corner of the top panel. The letters USA or GrBr will
    appear, indicating that you are currently using your English language layout.
    If you click that, you will toggle between any of the other layouts you''ve activated.
    If you are not sure where the keys are located in your current map, you can get
    help by right-clicking the layout and selecting **Show Current Layout** in the
    drop-down menu, after which a map of the new layout will appear in a separate
    window. This map in can be hard to make out, so you will probably need to expand
    the window by dragging it by any of its bottom corners. You can also print a copy
    of the layout from this window by clicking the **Print** button.


    If you just want to choose a single keyboard layout to replace your current one
    (such as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window. Simply add the keyboard layout
    you want to use, and remove any additional layouts by clicking each one and clicking
    the **Remove** button.


    # Chinese, Japanese, and Korean Input


    For many European languages (and many other alphabet-based non-European languages),
    pressing a letter on the keyboard simply prints that letter to the screen. However,
    Chinese, Japanese, and Korean require a kind of conversion process that is handled
    by a special application (actually a set of applications)'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'called an input method editor (IME). Each of these languages has its own IME,
    and each is quite different because of the basic differences in the three writing
    systems.


    # Chinese


    Although most people (at least those in the linguistic know) would think that
    Chinese would be the most complicated system, because the writing system consists
    of thousands of characters, it is in the simplest. The Chinese IME simply takes
    the Romanized keyboard input, known as pinyin, and converts into Chinese characters,
    or Hanzi. For the IME, it is essentially a simple dictionary lookup task—big IME.
    In the event that there are more than one character for the pinyin input, a list
    of possible candidates will appear, and the user can then select the appropriate
    character from that list. Most recent Chinese IMEs also have predictive capabilities,
    by which they judge what you are trying to type on the basis of what you''ve typed
    so far (Figure 11-6). Although these more “intelligent” IMEs can be a bit squirrel
    to use at first, they prove to be rather handy once you get the hang of things.


    他没有


    ![](img/35405f17cef8b43ddf1af3fc22de194c_253_0.png)


    +   1. (1/22)

    2. 会

    3. 回

    4. 萨

    5. 理

    6. 天

    7. 宾

    8. 辉


    > Figure 11-6: Chinese IMEs can predict what you''re going to write . . . kind
    of.


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, because
    it has three writing systems to deal with: *Kanji* (ideographic characters borrowed
    long ago from China), *hiragana* (the phono-abetic system used mainly for tense
    and case endings), and *katakana* (mainly used for words borrowed from other languages).
    The standard input method for Japanese is primarily via the standard Roman keyboard
    layout, plus a few extra-function keys. Thus, typing in Japanese is a two-step
    process where the IME first converts the Romanized text into hiragana as it is
    typed and then converts to appropriate Kanji, katakana, or hiragana elements after
    the space is pressed.


    You can see an example of these systems in Figure 11-7. In the first line, the
    IME has already converted the Romanized input on the fly. It has converted rinakkusidenihongnyuryokugagamodekimasu
    (which means You can input japanese'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'in Linux) to hiragana. When a line of hiragana is highlighted, it means that
    the line has not yet been converted that. In the second line, however, the user
    has subsequently pressed the spacebar, which caused the IME to convert the hiragana
    string into the appropriate Kanji, hiragana, and kana elements. The first word,
    *Linux*, has been converted to katakana text, because it is a borrowed word, while
    *Japanese input* has been converted to Kanji; the rest stays in hiragana.


    りなっすでにほんごににゅうょくができます。


    リナックスで日本語入力ができます。


    Figure 11-7: IME conversions while typing in Japanese


    # Korean


    The job of the Korean IME is again quite different from that of the Chinese and
    Japanese IMEs, because the language is written in a very different way. Korean
    is written either entirely in alphabetical letters, called *Hangul*, or in a combination
    of Hangul and ideographic characters borrowed from Chinese *Hanja*. While the
    Hanja characters are essentially the same as their Chinese and Japanese counterparts,
    Hanzi and Kanji, the Korean phonetic alphabet, Hangul, has its own unique appearance,
    for Korea, *Hanguk(k)*, as you can see in Figure 11-8.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_254_0.png)


    Figure 11-8: Korea [Hangul] written horizontally in Hangul


    This seems simple; however, the representation is not quite correct, because Korean
    is quite unique in the way that its alphabetical characters are put to the page.
    Unlike the usual side-by-side positioning of hiragana, katakana, and most other
    languages written with an alphabet, Hangul letters are grouped in pairs, triplets,
    or quadruplets, which are written, as a general rule, clockwise. The IME, therefore,
    must take the input (usually based on a Korean alphabetical keyboard layout) while
    it is being typed, and it must adjust the size, spacing, and positioning of each
    of the letters as it puts them into appropriate clusters (see Figure 11-9).'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Chapter 11: Setting Up Asian-Language Support


    So, what do you do if, for example, you want to be able to type Chinese, Japanese,
    Korean, Hindi, Thai, or Nepali while still in your usual English environment?
    What if you want to be able to type all of those languages in the same document?
    Can you do it?


    You bet.


    There are actually several ways of going about this, but the default method in
    Ubuntu is the easy-to-use Intelligent Input Bus (IBus). IBus supports Asian languages,
    including Chinese, Japanese, and Korean, and it provides a number of input methods
    for many of these.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_255_0.png)


    Figure 11-9: An example of the clustering process in the Korean IME


    # 11-1: Selecting Input Method Modules


    The first thing you will need to use IBus is select the appropriate input modules
    for the language(s) you want to input. To do this, go to the **System menu**,
    select **Preferences** > **IBus Preferences**. A window will then appear asking
    whether you would like to start the IBus daemon. Click **Yes**, which yet another
    window may appear telling you what to do if you cannot get IBus to work. Click
    **OK** in that window. (Formately, these two windows will appear only when you
    first start IBus.) The IBus Preferences window will then appear. Click the **Input
    Method** tab.


    > NOTE A daemon is a program that runs in the background, unknown to the user,
    providing a system with added functionality. In the case of IBus, that added functionality
    is the ability to input complex character sets.


    On that tab, click the **Select an input method** drop-down button, select the
    input method you require, and then click **Add**. The input method you just added
    will then appear in the main pane of the window beneath the default method, English.
    Repeat the process for any other input methods you want to add. When done, your
    window should look like a variation on what you see in Figure 11-10, depending
    on which languages you actually select. When you’re done making your selection,
    click the **Close** button.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_256_0.png)


    Figure 11-10: Selecting complex input methods in iBus


    As you will notice when selecting input methods, some languages, such as Chinese,
    have a number of methods to choose from (as shown in Figure 11-11). To give you
    some quick help, I would suggest appropriate choices for the student or casual
    user of Chinese, Japanese, and Korean.


    +   - For simplified Chinese standard pinyin input support, select Chinese – py.

    - For traditional Chinese zhuyin/Bopomofo input support, select Chinese – bopomofo.

    - For Japanese input support, select Japanese – anythy.

    - For Korean input based on the standard English keyboard, select Korean – romaja.


    For those studying or teaching Chinese, you might also want to select Chinese
    – pinyin, which allows you to easily type the Chinese words in Roman letters with
    tone markings, as shown in Figure 11-12. Just type each character phonetically
    in pinyin followed by the character’s tone number (type zhongguo2 for China, for
    example), and then the diacritic tone marks will appear above the Romanized output.
    Very handy.


