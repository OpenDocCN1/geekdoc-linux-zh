    # # USB Storage Devices


    Unless have been under a digital rock for the past few years, you are no doubt
    familiar with USB devices. Your printer is very likely a USB device, as is your
    scanner. And although your digital camera is not a USB device in the traditional
    sense, chances are every time you connect it to your computer to transfer photos,
    you are doing so via a USB connector.


    Among the most popular USB devices others are used for file storage. These include
    external hard disks, flash memory readers, and the tiny, finger-sized devices
    known as flash drives (Figure 7-16). Flash drives are especially popular and deserved
    so: they are inexpensive, handy when you need to transfer large amounts of data,
    and perfectly safe in terms of cross-platform (including Linux) compatibility.


    Working with USB storage devices is really easy. Just plug the device into one
    of the USB ports on your computer. The LED on the device will do a bit of blinking
    while the system reads what''s on, and after that, a disc icon for that device
    will appear on your desktop. A few moments later, a Nautilus window will open,
    revealing the contents of the device. An icon for the USB device will also appear
    in the side pane of the Nautilus window. You can then copy files to from the device
    using the drag-and-drop or copy-and-paste procedures I mentioned earlier in this
    chapter.


    Once you are done and want to remove the device, right-click your disk icon, and
    select Safely Remove Drive in the pop-up menu. (You can also right-click the icon
    in the Nautilus side pane and select any data that needs to be written to the
    device, the system will start writing. Once it''s complete, the icon for the device
    will disappear from the desktop and Nautilus folder. Make sure that you always
    safely remove USB drives like this, rather than simply disconnecting them—otherwise,
    you risk losing data.


    *Figure 7-15: Using Brasero to duplicate disks*


    112 Chapter 7'
