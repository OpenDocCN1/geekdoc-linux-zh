- img_proc: true
  md: '# Project 3B: Manipulating Menus


    Now that you have learned some of the cool and useful things you can do with your
    panel, let''s move on to the topic of menus. A very nice feature of GNOME is that
    it allows you to edit its menus. You can add launchers, remove items, move items,
    and even change the icons that appear within the menus. In all, you have a lot
    of control over things, but for this project, you''ll limit the work to these
    of two areas: changing icons and moving menu items.


    # 3B-1: Changing Icons Within Menus


    As you doubt recall, one of the problems with the OpenOffice.org Writer and Calc
    launchers you added to the panel was that they shared similar icons. If you see
    Applications Office, you will see that the icons for the various OpenOffice.org
    modules, although not the same, are also a bit similar. To remedy this state of
    affairs, you will change these icons to the set you used for the two panel launchers
    in Project 3A-4. In this case, just follow these steps:


    +   1. Right-click the Applications and select Edit Menu, or go to the System
    menu and select Main Menu.

    2. In the menu editor window that appears (Figure 3-14), click Office window in
    the left pane. The contents of the menu will then appear in the right pane.

    3. In the right pane of the window, click OpenOffice.org Word Processor once,
    and then click the Properties button. A Launcher Properties window will appear.

