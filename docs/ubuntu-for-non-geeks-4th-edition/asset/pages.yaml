- img_proc: true
  md: 'install Windows programs to run under Ubuntu. Dual-booters take note: You''ll
    learn how to access your Windows files from Ubuntu and change the boot menu.


    # Chapter 19: Defending the Nest—Security


    Although Linux is about as safe and secure as any operating system as you are
    likely to use, Chapter 19 tells you how to add a few additional lines of defense
    to your system.


    # Chapter 20: A Colony of Penguins—The Ubuntu Community


    If there''s one thing that sets Ubuntu apart from most Linux distributions, it''s
    the friendly, ever-growing Ubuntu community that surrounds it. In Chapter 20 you''ll
    learn how to participate in the Ubuntu community by reporting bugs, sharing ideas,
    and talking to other users.


    # Chapter 21: Winged Wings—Fixing Common Problems


    Don''t panic! If a computer problem crops up and is spoiling your fun, flip to
    Chapter 21 and take heed of the many (and varied) troubleshooting-tips within.
    You''ll find fixes for the most common issues, and some general advice on diagnosing
    and treating your poor PC.


    # Appendix A: Installing Ubuntu from a USB Flash Drive


    What with the proliferation of notebooks in recent years, installing Ubuntu from
    CD is becoming something past. Appendix A shows how to install Ubuntu from a USB
    memory stick, which will be particularly useful if your computer lacks a CD drive
    or if you find the disc included with this book far attractive not to be used
    as a coaster.


    # Appendix B: Ubuntu Desktop Cbs for AMD64, Opteron, or Intel Core 2


    The CD bundled with this book is designed to work with i386 processors. It will
    also work with most 64-bit processors, although not in 64-bit mode. If you''ve
    got that to run Ubuntu in 64-bit mode, Appendix B will show how to get what you
    need to do it.


    # Appendix C: Manually Partitioning Your Hard Disk


    If the basic partitioning advice in Chapter 2 wasn''t enough for you, Appendix
    C shows you how to carve up your hard disk as you desire, free from the constraints
    of the Ubuntu installer''s sensible, but ultimately simple, suggestions. If you''re
    a dual-booter and want to share files between Windows and Ubuntu, this appendix
    is for you.


    # Appendix D: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you have a
