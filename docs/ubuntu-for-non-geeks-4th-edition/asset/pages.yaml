    # # Manually Configuring Printers


    If your printer isn''t automatically recognized, you can still set up manually.
    Here''s what you need to do:


    +   1. Select **System** ▸ **Administration** ▸ **Printing**. A Printing window
    will appear, showing the printers that have already been recognized and/or configured.

    2. Click the **Add** button, after which the system will show any new finds in
