  md: '# Rhythmmbox-Your Audio Player


    The main audio player in Ubuntu is called Rhythmmbox (see Figure 14-2), which
    seems to function pretty much like a simplified version of Apple’s iTunes alone.
    It’s a relatively easy-to-use audio player that, despite some quirkness in its
    early stages, has developed quite a following in the Linux world. To run Rhythmmbox,
    just go to the Applications menu and select Sound & Video ▷ Rhythmmbox Music Player.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_300_0.png)


    Figure 14-2: The Rhythmmbox audio player


    # Adding Songs and Albums to the Rhythmmbox Library


    If you are familiar with Apple’s iTunes, then you should understand the Library
    in Rhythmmbox too, because it is essentially the same concept. Rhythmmbox should
    automatically import everything you have in your Music folder without any extra
    work on your part. If you prefer to add songs to the Rhythmmbox library manually,
    you can open the preferences window Edit ▷ Preferences), click the Music tab,
    and uncheck the Watch my library for new files box. After that, you can add new
    albums to your Rhythmmbox Library by going to the Music menu, selecting Import
    Folder, and navigating to the folder for the new album you want to add. If you
    want to add a number of albums by the same artist, just navigate to and select
    the folder for that artist instead. If you want to add a single audio file, you
    can also do that—select Music ▷ Import Folder, and then navigate to the song in
    question.


    If you are not the navigating type, you can also add files and folders by other
    methods. The simplest way is to drag the file or song you want to add to the Library
    into the right pane of the Rhythmmbox window. You can also'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'add a song to the Library directly by right-clicking the file and selecting
    **Open with › Open with Rhythmbox** in the pop-up menu that appears.


    # Ripping Audio CDs with Rhythmbox


    Like iTunes, Rhythmbox also allows you to rip songs directly from a CD; convert
    them to Ogg Vorbis, MP3, or other audio formats; and then add the ripped tracks
    to its music library. The steps are as:


    +   1. Open the Preferences window (**Edit › Preferences**), and select the encoding
    format you want to use (Ogg Vorbis is the default). Once you''re done, click **Close**.
    Unless you change encoding formats, you won''t have to do this more than once.

    2. Select your audio CD in the left pane of the Rhythmbox window.

    3. Click the **Copy to library** button in the upper-right pane of the Rhythmbox
    window. The ripping and encoding process will begin, and the progress will show
    in the bottom-right corner of the Rhythmbox window. Once done, the ripped songs
    will automatically appear in the Rhythmbox library.


    > NOTE If you have not installed the gstreamer0.10-plugins-ugly-multiverse package,
    the MP3 option will not appear in the Output Format menu.


    # Browsing the Rhythmbox Library


    The Rhythmbox Library, which you can make visible by clicking **Music** in the
    left pane of the Rhythmbox window, is a collection of all the music you add to
    it. This can prove to be unwieldy as your collection grows. Fortunately, Rhythmbox
    has a nicer browser function, the one in iTunes, that can be toggled on and off
    by clicking the **Browse** button, shown in Figure 14-3. This function allows
    you to see lists of artists and albums in two separate panes above the main Library
    list. If you click a specific artist in the Artist pane, a list of albums by that
    artist will appear in the right pane. You can then double-click one of the albums
    in that right pane to play it. If you want to play all the albums you have by
    that artist, double-click the artist''s name in the left pane. All in all, it''s
    a very handy feature.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_301_0.png)


    Figure 14-3: The Browse button in Rhythmbox


    If you want to add a layer of categorization to the browser, you can do so by
    adding a Genre pane. To do this, go to the **Edit** menu, select **Preferences**,
    select the **General** tab of the window that appears, and then select **Genres,
    artists, and albums**. After clicking the **Close** button in the Preferences
    window, you will have a three-pane browser in Rhythmbox (Figure 14-4).'
