- img_proc: true
  md: 'In this second desktop, you can open something else: Select Applications ▶
    Games AisleRiot Solitaire. The AisleSolitaire game will will appear.


    You now have windows in two different desktops, and you can switch back and forth
    between them. To do so, just go to the Workspace Switcher in your panel, and click
    the now gray left box, which will take you to your original desktop. Once you''ve
    done that, the box for the workspace you were in just will turn gray, and you
    can then click one to go back to your game desktop.


    As you can imagine, this feature has some potential benefits for you, in addition
    to helping you avoid clutter. Just imagine that you are working some long document
    in OpenOffice.org Writer. Eventually, you get tired and decide to go off a bit
    by playing a game, such as Mines, for a while. To do this, switch to another desktop
    where you open and play the game. A bit later, when you notice your boss making
    the rounds of the office, you simply switch back to the first desktop that you
    look busy when he walks by and asks, “Keeping yourself busy, Boa?”


    Phew!


    By the way, you can switch between virtual desktops by simultaneously pressing
    and holding CTRL-ALT and then pressing your left and right arrow keys to move
    to your targeted desktop.


    So, what happens if, let''s say, you are running OpenOffice.org Writer in one
    workspace and suddenly that it would be handy to have both running in the same
    workspace? Do you want the GIMP and start it up in the other desktop? Fortunately,
    things are much simpler than that, and there are two ways to get the job done.


    The first of these ways is to right-click the title bar of the window you want
    to move, and then select Move to Workspace Left or Move to Workspace Right. You
    can also select Move to Another Workspace and then select the workspace you want
    to move the window to number: Workspace 1, Workspace 2, Workspace 3, and so on.


    If you prefer keeping your hands on your keyboard than on your mouse, you can
    also move a window from workspace to workspace using hotkeys. With the window
    you want to move active (on top of the file, so to speak), press and hold SHIFT-CTRL-ALT,
    and then use the left and right cursor to move to the desired desktop


    # Wanda Revisitedited–GNOME Easter Eggs


    Well, now that you''ve finished your work in this chapter, it''s time to go around
