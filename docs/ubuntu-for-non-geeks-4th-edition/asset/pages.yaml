  md: '# Ubuntu Doesn’t Play Any Sounds


    There are many reasons why Ubuntu might not be playing sounds. I''ll concentrate
    on some of the more basic issues in this section, but if none of this helps, you
    can always try the Ubuntu forums or IRC; both are discussed in detail in Chapter
    20.


    To troubleshoot, find a song on your computer and play it in Rhythmbox or the
    Totem Movie Player. (If you need, there''s a song available in the `/usr/share/example/content/Ubuntu_Free_Culture_Showcase`
    folder, aptly called “Frustration Blues.”) You need to have a sound file playing
    in the background so that you can tell whether changing any of these settings
    worked.


    If you are unable to start playing the file, Ubuntu may not have detected your
    sound card properly. Open a Terminal (**Accessories > Terminal**), type `aplay
    -l` into it, and press ENTER. If the list of playback devices is empty, your sound
    card hasn''t been detected. In this case, you''ll definitely need get some community
    support—see Chapter 20


    Next, check that your speakers are turned on, turned up, and plugged into the
    correct socket on your computer (it''s often a light green color). Many times
    in the past I''ve plugged my speakers into the microphone socket and sat there
    wondering why they were silent. When you''re confident that your speakers are
    OK, try the following steps:


    +   1. Click the speaker icon on the top panel, and select Sound Preferences from
    the menu that pops up. The Sound Preferences window will appear (Figure 21-7).

    2. Make sure that the Mute option is not checked and that the Output volume slider
    at the top of the window is pulled all the way right.

    3. Click the Applications tab, and make sure that none of the applications in
    the list is muted or set to a low volume.

    4. Click the Output tab, and make sure that the right connector is chosen If you''re
    not sure, try different connectors by trial and error until you get one that works.
    If none of them work, return this option to its original setting (usually Analog
    Speakers).

    5. Click the Hardware tab, and choose a different device from the Profile option.
    Then, repeat the previous steps, checking that nothing is muted or at low volume
    and that the output device is selected. Trial and error often works.


    If none of this helped, check out http://ubuntuforums.org/showthread/.phpid=205449/.
    It''s a pretty comprehensive guide to identifying sound problems, though it requires
    a lot of work in the Terminal. (See Chapter 9 if you need to refresh your memory
    on how the Terminal works.)'
