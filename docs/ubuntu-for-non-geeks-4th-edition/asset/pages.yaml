    In some cases, things will be even easier, particularly if you installed your
    printer driver by means of the installer that came packaged with the driver. In
    many cases, the driver will provide its own progress window that will appear whenever
    you print a document. If so, you can simply click the Cancel button (or equivalent)
    in that window to cancel your levels.


    > In some cases, you may have to clear your printer after canceling a print job.
    You can do this by turning your printer off, waiting a few seconds, and then turning
    it on again.


    # Checking Ink Levels and Other Printer Maintenance Tasks


    Printer ink (and toner) has a knack of vanishing at a rate of knots, so it is
    natural to check on how your cartridges are used. You might also run into problems
    with the printer, such as streaks on printouts or jagged lines that should really
    be straight, so might be necessary to clean or align the printer heads too. Unfortunately,
    there''s no simple method of doing this since every make of printer handles it
    differently. I''ll just mention a few ways you can access these options for the
    most common brands:


    +   - **HPLIP** This works for Hewlett-Packard printers. Open the Ubuntu Software
    Center, and install HPLIP Toolbox. Select **System > Preferences > HPLIP Toolbox**
    to run it, and use the Supplies to check ink levels and the Actions to align and
    clean your your.

    - **Inkblob** This works for a number of Epson, Canon, and HP printers—check http://inkblob.sourceforge.net/#supported/
    to see whether your printer is supported. Open the Ubuntu Software Center, install
    Inkblob, and select **Applications > System Tools > Inkblob** to clean your levels.

    - **escputil** This works for some Epson printers and is worth a try if Inkblob
    doesn''t support your model. Open the Ubuntu Software Center, and install *escputil*.
    Then, open a Terminal by selecting **Applications > Accessories > Terminal**.
    Type `escputil -i` (don''t forget the space) and hit ENTER to display the ink
    levels. To clean the print head, type `escputil -c`.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'If you have no luck with these utilities or if your printer''s make isn''t
    listed, you might still be able to access ink levels and maintenance functions
    using the manufacturer''s own Linux driver, if one exists. Also, some newer printers
    allow you to check ink levels and align and clean cartridges using controls on
    the printer. When in doubt, check your printer''s manual.


    # Scanners


    Scanners are extremely useful and about cheap a peripheral device as you can get.
    They allow you to take images or pages of text and input them, in digital form,
    into your computer—in the same way as you would duplicate a document on a copy
    machine.


    Even though scanners have been around for a relatively long time, support for
    Linux is still a bit spotty. Fortunately, this is changing for the better with
    every new Linux release. The backend—the hidden part of your system that handles
    scanner recognition and support in Linux—is called Sane. If you are wondering
    whether Linux will be able to recognize your scanner or what to buy, you can visit
    the Sane website at http://www.sane-project.org/sane-mfgs.html/.


    There will be able to see whether your scanner is supported or get tips about
    what scanner to buy. The page is pretty long, so you might want to use the Find
    function in your web browser (select Edit ▸ Firefox) to search for your scanner.
    As I have mentioned, you can also try the Ubuntu forums (http://www.ubuntuforums.org/)
    and for Ubuntu-specific recommendations there.


    # Scanning, No Questions Asked, with Simple Scan


    Simple Scan is a new addition to Ubuntu''s line-up of default applications, and
    it certainly lives up to its name—it doesn''t take many clicks to get a document
    from scanner to computer. Run Simple Scan, make sure that your scanner is connected
    and switched on, and then select Applications Graphics ▸ Simple Scan. If you get
    a warning saying that no scanners were detected, skip to “Unrecognized Scanners”
    on page 207.


    Assuming that your scanner has been recognized, you''ll be presented with the
    screen in 10-11.


    It''s pretty easy from here—select the type of document you''re scanning (Text
    or Photo) from the drop-down menu to select the Button (the menu’s icon is a small-down),
    and then click Scan. Your scanner will roar into action, and after a short wait,
    you''ll be presented with a preview of the picture or document you placed on the
    scanner. You can crop and rotate the image by using the options in the Page or
    by right-clicking the preview. When you''re happy with your scan, select Document
    ▸ Save to finish up.


    One little tip: To change the resolution of your scans, select Document ▸ Preferences,
    and tweak the settings in the window that appears. Higher resolutions longer to
    scan and take up more disk space, but lower resolutions can look terrible, so
    choose wisely!


    Chapter 10'
  merge: -1
  pgno: 240
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_241_0.png)


    # # Not-So-Simple Scanning with XSane


    Simple Scan will be able to handle most of your scanning needs, but if you have
    some particularly complex scanning that you need to do, you can use XSane. XSane
    is a real monster of a scanning program, packed full of professional features
    and fine-tuning options (see Figure 10-12). Search for and install XSane using
    the Ubuntu Software Center, and then select **Applications > Graphics > XSane
    Image Scanner**. XSane will perform a search for an attached scanner. If it finds
    “No devices available.” If this happens, click the **Close** button, and skip
    to “Unrecognized Scanners” on page 207.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_241_1.png)'
