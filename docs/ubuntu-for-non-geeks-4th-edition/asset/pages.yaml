- img_proc: true
  md: '# Printing in OpenOffice.org


    Occasionally, you will come across an application such as OpenOffice.org that
    has a slightly different way of handling printing. Fortunately, the differences
    may actually make printing in OpenOffice.org more Windows-like and thus easier
    for newbies in the Windows world to follow along. As you can see in Figure 10-7,
    the main Print window for OpenOffice.org applications allows you to select the
    printer you want to use, the range of pages, and many copies you want to print.
    You can access other options by clicking the Properties/ or Options buttons.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_237_0.png)


    Figure 10-7: Print settings in OpenOffice.org modules


    # Printing to PDF


    One of the nice features of Linux is that you can save most documents or web pages
    as PDF files. In some cases, such as in OpenOffice.org, you do this by exporting
    the document to PDF. In most other applications, however, you do it via the Print
    window, in which you are said to be "printing to PDF." Whether you are saving
    PDF, exporting to PDF, or printing to PDF, you are essentially doing the same
    thing: creating a PDF file of your document.


    This is very handy, because it allows you to create documents that cannot be altered
    by others and can easily be read regardless of the word processor or operating
    system the reader is using. Best of all, this feature, which you would have to
    pay a pretty penny in the Windows world, costs you nothing, it is built in your
    system.


    In GNOME applications (and now in Firefox), you can print to PDF by going to the
    File menu of the application in question and selecting Print. When the Print window
    (Figure 10-8), select Print to File in the list of printers, and make sure PDF
    is selected as the output format. Choose a name for the PDF file, and then click
    the Print button to save it.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_238_0.png)


    Figure 10-8: Printing a file to PDF in most GNOME applications


    # Canceling a Print Job


    It happens to all of us. You wanted to print just 1 page of a 57-page document,
    but you accidentally started printing the whole thing. What can you do to save
    your ink and 56 sheets of paper? Fortunately, the solution is simple.


    Once you''ve clicked the Print button and the print job is sent to your printer,
    a small printer icon will appear somewhere at the right end of the top GNOME panel
    (usually to the left of the other items there), as can you see in GNOME 10-9.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_238_1.png)


    Figure 10-9: A printer icon appears in the GNOME panel while printing.


    Just like that once, and a window showing your current and queued print jobs will
    appear (as shown in Figure 10-10). Your print job will be listed in that window,
    right-click the name of the job to select it, and then, in the pop-up menu, select
    *Cancel*. You will be asked whether you want to cancel the job, click *Yes*.


    After you do this, the print job listed in the queue will disappear, and your
    printer will stop printing. You can then close the print queue window. This is
    a very easy process that you may well find is more effective than what you''ve
    experienced in other operating systems.


    202 Chapter 10'
  merge: -1
  pgno: 238
- img_proc: true
