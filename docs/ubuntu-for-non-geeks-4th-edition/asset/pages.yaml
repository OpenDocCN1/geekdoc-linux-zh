    # # Project 19B: Encrypting Your Files


    Protecting yourself against Internet nasties is all well and good, but what if
    someone gains physical access to your computer? Data theft is a serious business,
    so if you have sensitive files, you should think about protecting them. A good
    way to do this is encrypt your sensitive files. Encryption is a way of taking
    a file and scrambling it in such a way that only a person with the right decryption
    key will be able to recover the original information. If someone tries to look
    the file while it''s still encrypted, they will all be able to see a bunch of
    nonsense characters.


    # ## 19B-1: Creating an Encrypted Folder


    Ubuntu is a nice way of encrypting files, but you should take care when using
    it! The whole point of encrypting your files is that no one but you will be able
    to access them, so there''s little chance of recovering them if you get your password.
    Here are the steps you need to get encrypted:


    +   - Open the Ubuntu Software Center, and search for install cryptfs-utils.


    +   - Once installation has completed, open a Terminal by clicking Applications
    > Accessories > Terminal, type cryptfs-setup-private, and press ENTER.


    +   - You''ll be prompted for the password that you use to log in Ubuntu. Type
    it, and press ENTER. (The letters won''t show up on the screen, but that''s normal.)


    +   - You''ll be asked to enter your passphrase (password). Pick some very memorable—there''s
    no recovering this password if you forget it! Press ENTER, retype the password
    (to make sure there were no typos), and press ENTER again.


    +   - Close the Terminal window, log out of your user account, and log back in
    again.


    +   - When you log in, an Update information window will appear (Figure 19-8).
    Click Run this action now, type your login password into the window that appears
    (it will look as if nothing is being typed again), and press ENTER.'
