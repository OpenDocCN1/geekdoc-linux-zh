    updates option to something else. Weekly updates should be fine.

    You''ll find a couple of other interesting options there too. Install security
    updates without confirmation, updates will happen automatically, without any intervention
    from you. Alternatively, you can choose to have updates download in the background
    so they''re ready to install immediately when Update Manager pops up.


    ![](img/35405f17cef8b43ddf1af3fc22de194c_120_0.png)


    Figure 6-5: The Updates tab in the Software Sources window


    # If an Update Ruins Your Day ... or System


    Now, I don''t want to worry you much, but one thing about massive system updates
    is just go screwy, leaving you with all sorts of regrets and a mouthful of replets
    just to be uttered. This is a fact of life no matter what operating system you
    are using. It can happen in Windows, it can happen in Mac OS, and it can happen
    in Linux. Therefore, it is always a good idea to wait a bit before installing
    a seemingly major update and to check the user forums first to see whether there
    are any disaster stories about a particular update. Leaving a week before noticing
    an update and installing it should protect you from most mishaps,


    To decide whether an update is “major,” look for updates with linux- in their
    name (linux-generic, for example, as seen in Figure 6-6). These are important
    system packages and are the ones most likely to cause problems.'
