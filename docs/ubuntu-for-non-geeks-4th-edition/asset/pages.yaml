    # # Microblogging—Twitter and Friends


    Blogging (writing an online diary/journal) is now a well-established Internet
    pastime. Twitter is on millions of blogs out there covering all sorts of subjects,
    from astronomy to economics to fluffy kittens. The quality of content varies wildly,
    but for the most part blog entries are typical newspaper-opinion-column types
    of pieces. So, what if you had a blog where you were forced to write everything
    you wanted to say in less than 140 characters? That is the idea behind microblogging:
    making frequent, very short, bulletin-like posts.


    Twitter is the well-known microblogging website (http://www.twitter.com/). People
    find all sorts of uses for Twitter: You can let your friends know what you''re
    up to at the moment, receive news, discuss popular topics with other users, write
    posts using your mobile phone ... the list goes on. I followed a Twitter conversation
    between few of my friends who were watching a live hockey game. They sent messages
    every time exciting happened, so I could follow the action textually, within seconds
    of it. News travels fast on Twitter.


    Perhaps it''s the sort of thing you need to try to appreciate, if you don''t have
    an account already, click the Sign up now on the Twitter home page, and follow
    the instructions. Once you''ve done that, take a look around the website to see
    how things works. The basic idea is that you can post messages (tweets) for your
    followers. People can choose to follow you by clicking a button when they view
    your user profile. You can choose to follow other people too—when you do this,
    all of their tweets will be displayed on your Twitter home page for you to read.
    Most people follow a few people and typically have a handful of followers themselves,
    but there are no restrictions on how many of you can have.


