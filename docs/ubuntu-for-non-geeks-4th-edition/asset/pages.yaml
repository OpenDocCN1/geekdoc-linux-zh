    You might already be able to figure out how this is all going to work, but I''ll
    spell it out in case you want to change the permissions of a file (butterhaters.txt,
    for example) so that all users on your machine can read and write to it. After
    opening a Terminal window, you can make the change using `chmod a+w butterhaters.txt`
    and pressing ENTER.


    Oops! Remembered that you don''t want anyone changing the content of the file,
