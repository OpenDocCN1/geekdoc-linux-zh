  md: '# 8B-6: Downloading and Installing the Art Manager (GNOME Art)


    Searching the Internet for wallpaper to install can in itself be a fun adventure,
    but sometimes it can also feel like quite a chore. Fortunately for you, and all
    involved in such things, there is an easier way: the Art Manager, also known as
    GNOME Art, is a handy application that searches for http://art.gnome.org/ and
    downloads a list, of all the wallpapers that are available. It can also do this
    for the various borders, controls, and icon themes that you can use in the following
    parts of this project. Using the thumbnail lists, you can easily download and
    install whatever you want—all without placing a cursor in your web browser. Needless
    to say, the Art Manager is decidedly cool!


    Unfortunately, the Art Manager is not installed by default. However, after going
    through Chapter 6, you know how easy it is to download and install applications
    like the Art Manager. All you have to do is run the Ubuntu Software Center, search
    for gnome-art, and then install the Art Manager.


    You can run the Art Manager by selecting System > Preferences > The GNOME Art
    window will appear with absolutely nothing in it. To put it to use and relieve
    that emptiness, select Art > Backgrounds > GNOME. (You can select instead of GNOME
    if you like, but it will take longer to download the list of available wallpapers.)


    Once you''ve made your selection, the Art Manager will begin downloading a list
    of all that is available for you at http://art.gnome.org/. It may seem like nothing
    is happening for a minute or so, but that is normal; just hang there. It might
    take a few minutes to download previews of the backgrounds, but when it''s done,
    you will see a list of thumbnails for you to choose from (Figure 8-9).


    You can now install wallpaper by scrolling down until you find one suits your
    fancy, clicking it once to highlight it, and then clicking the Install button.
    The Art Manager will then download and install it. After that, open the Appearance
    Preferences window, and choose the wallpaper you just downloaded as your desktop
    wallpaper. As I said before, the Art Manager is a very handy tool to have, especially
    since you''ll be using it more soon within this project.


    checkbox and then clicked Close. The autohide function works just like it does
    in Windows or Mac OS—the panel stays out of view until you move your mouse into
    the general vicinity of where it should be. You can make the same change if you
    like, but that is an aesthetic matter that I will leave up to you. Ah, the sweet
    of artistic freedom.'
  merge: -1
