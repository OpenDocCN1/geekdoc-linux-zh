    # I Can''t Get the Installer to Run


    If you boot from the Ubuntu CD (so that the blue boot screen in Ubuntu-21.1 is
    displayed) but when you choose to try or install Ubuntu, something goes wrong
    and you never get to the installer, the computer might be struggling to start
    some of the software required to run the CD. You can try the following:


    +   Try some kernel options As soon as you go to the purple boot screen, press
    any key (my favorite is the spacebar), and choose your language from the list
    that appears by using the arrow keys and ENTER. Then, press F6 to open a little
    menu with a list of cryptic options (Figure 21-2). These are kernel options and
    can be used to turn off off features that sometimes cause problems when you''re
    trying to start the computer. Use the arrow keys to go up and down the list and
    the ENTER key to select an option (an x will appear next to it). In the first
    instance, I recommend using acpi=off, noaptic, nodraid, and mododeset. Then, press
    ESC to hide the menu, and to boot the CD normally by selecting one of the options
    in the main list and pressing ENTER. If that didn''t work, you might need to apply
    some good ''ol'' trial and error to the kernel options to find a combination that
    works.


    +   Try an alternate CD/memory stack Some computers are simply unable to run the
    live CD. An alternative text-based installation CD is available from http://www.ubuntu.com/getubuntu/downloadmirrors#alternate/;
    you''ll have to download the CD image (.iso) file yourself and burn it to a disc
    before you can use it (see https://help.ubuntu.com/community/BurningISOHowto/
    for details). This installation method isn''t as user-friendly as the graphical
    installation from the live CD, but it''s more likely to work if you''re having
    problems. You could also try installing from a USB memory stick, as described
    in Appendix A.'
