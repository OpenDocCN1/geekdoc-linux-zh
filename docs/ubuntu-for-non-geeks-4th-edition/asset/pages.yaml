    +   1. Select the two files by clicking your mouse to the side of the files and
    dragging the cursor (with the mouse button still pressed) over both files until
    they are highlighted or by holding down the CTRL, and clicking each file individually.


    +   2. Once both files are highlighted, right-click either one, and select Compress
