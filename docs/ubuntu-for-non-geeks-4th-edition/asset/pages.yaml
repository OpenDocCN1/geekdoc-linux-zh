    # Games/Compix Don’t Work: Installing Accelerated Graphics Cards


    If you can''t get Compiz or a certain game to work, you may need to install some
    accelerated graphics drivers. This is because only basic drivers (which can handle
    fancy effects and 3D games) are installed for some graphics cards by default,
    due to the lack of availability of suitable open alternatives. Accelerated drivers
    exist for your card, you can install the more powerful (but less open source)
    drivers by selecting System Hardware Drivers, selecting the graphics driver from
    the list, and clicking Activate to install it. Once it''s installed, restart the
    computer, and the new driver should be enabled.


    You can directly download Linux drivers from some manufacturers. These need to
    be updated more regularly than the ones that come with Ubuntu, and they may have
    some extra features too. The next couple of sections cover how to get these drivers
    for the two biggest manufacturers, ATI and Nvidia.


