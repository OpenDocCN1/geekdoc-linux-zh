    That''s much simpler, you''ve got to admit.


    # # sudo


    When you run the Ubuntu Software Center in Chapter 6, you were first asked to
    input your password before you could the program. The reason for this, as I mentioned
    that, is that the Ubuntu Software Center installs the files it downloads in various
    folders throughout your system, almost all of which are protected. By supplying
    your password, you are telling your system that you, holder of the password, have
    the right to allow the Ubuntu Software Center to do that.


    The command version of that same password-giving process is the sudo command.
    To perform an operation in a folder that is protected, you would first type `sudo`
    and then the command you want to perform. For example, if you wanted to copy an
    icon, let''s call it `myicon.png`, to the globally and write-protected `pixmaps`
    folder (`/usr/share/pixmaps`), you would type `sudo cp myicon.png /usr/share/pixmaps`.


    After typing a command preceded by the sudo command and pressing ENTER, you will
    be prompted for your password. Once you type your password and press ENTER again,
    the command will be executed. I should mention that once you input your password,
    it will stay in memory for about five minutes. This means that you will not be
    prompted for your password when using the sudo command again within that time
    frame.


    # # locate


    Now that you are familiar with the sudo command, let''s take it out for a spin
    by working with the locate command. The locate command is essentially a command-line
    alternative to the graphical Search tool found in the Places menu. Using the locate
    command is quite easy: Simply type the command followed by a space and the name
    of the file you want to find.'
