  md: '# Unrecognized Scanners


    If you receive a message telling you that no scanners were detected when you opening
    a scanning program, your scanner may not have been recognized by Ubuntu. Here
    are a few things you can try to work around:


    +   Install the libsane-extras package using the Ubuntu Software Center. It contains
    a handful of scanner drivers that aren''t installed by default. Once it''s installed,
    try opening your scanning program again to see whether it worked.


    +   Press ALT-F2 to open the Run application; then type gsudo simple-scan, and
    click Run, entering your password if prompted. This will start Simple Scan with
    root (administrator) privileges, a step that sometimes manages to rescue the scanner
    from its slumber.


    +   If you still have no luck, check https://wiki.ubuntu.com/HardwareSupportComponentsScanners/
    to see whether there are special instructions that you need to follow, or ask
    for advice on the Ubuntu forums (http://www.ubuntuforums.org/).


    # Why Are My Scanned Images So Big?


    To wrap up this section on scanning, let me address a question that seems to confuse
    a lot of people: Why does a scanned image on the computer screen seem much bigger
    than its real-life counterpart? One of the first areas of confusion is that there
    is a general blurring of the terms pixels per inch (ppi) and dots per inch (dpi)
    used. Most applications use these terms interchangeably, and they aren''t really
    the same thing. To make things simple, when you are talking about images on your
    screen, you are talking about pixels (the little squares that make up your screen
    image) per inch, and when you are talking about printer resolution, you are talking
    about dots (of printer ink) per inch.


    Your computer screen generally has a resolution of 96ppi, while modern inkjet
    and laser printers have a resolution range of 300 to 12000dpi, or sometimes even
    more. This means that a photo scanned at 96ppi looks just fine on your screen,
    ends looking pretty lame when you print it. On the other hand, when you scan a
    picture at 300ppi, the image will look much better in your printout but will be
    gigantic if you display “full size” on your screen. This is because there will
    be three times as many pixels per inch, so it looks three times bigger onscreen.


    As an example, look at Figure 10-14, where you can see an identical image scanned
    at three different resolutions: 96ppi, 150ppi, and 300ppi. As you can see, the
    96ppi image at the far left (measuring 5 by 6 inches)—about the size of the hard
    copy itself—is the smallest, while the other two are proportionally bigger (about
    10 by 12 inches for the 150ppi image and about 25 inches for the 300ppi image).'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/35405f17cef8b43ddf1af3fc22de194c_244_0.png)


    Figure 10-14: The same image scanned at three different resolutions


    # # Which Resolution Should I Use When Scanning?


    Which resolution do you use when scanning depends on a variety of factors, the
    most important of which is what you plan to do with the image when you''re finished.
    When I look at Figure 10-14 on my computer screen, the smallest image looks best,
    the middle image looks OK, and the largest looks a bit odd, not as sharp as the
    other two. Basically, scanning images for display on a computer—on web pages,
    for instance—is probably best to stick with a ppi similar to typical scanner resolutions
    or slightly larger: 96 to 150ppi.


    When it comes to printing, a whole new set of considerations comes into play.
    First, there are the limitations of your scanner, since different models have
    different maximum resolutions. The resolution limits of your printer are also,
    naturally enough, a major consideration. For example, laser printers and inkjet
    printers have different characteristics; laser printers will produce better-quality
    images than inkjet printers, while inkjet output will be more greatly affected
    by the type of paper used than a laser printer will. Of course, your printed output
    is not going to suffer if you scan your images at higher resolutions than what
    you plan to print, but you will end up with a lot of files taking up too much
    disk space. Remember, the higher the resolution of a scanned image, the greater
    the file size in terms of disk space. If this is of concern to you, you can simply
    resize the images after you''ve done printing using an application such as the
    GIMP (more on that in Chapter 13), but if you prefer not to be caval with your
    use of disk space from the get-go, you can follow these general guidelines:


    +   - If you are using a laser printer, scan at the same resolution at which you
    are going to print.

    - If you are going to use an inkjet printer with photo-quality paper, scan at
    about 80 percent of your target print resolution—about 240ppi for a 300dpi printout.


    208 Chapter 10'
  merge: -1
  pgno: 244
- img_proc: true
  md: '+   If you are using an inkjet printer with regular paper, scan at about 65
    percent of your target printout resolution—about 195ppi for a 300dpi printout.


    Needless to say, these are just suggestions to get you started. What works best
    for you and your particular scanner/printer setup may be slightly different. Nothing
    works better than a bit of experimentation and trial and error. In this case,
    you can''t really go wrong. Just give yourself some time, don''t get frustrated,
    and, most importantly, don''t wait until you desperately need to scan something
    before trying things—stay ahead of the game.'
  merge: -1
