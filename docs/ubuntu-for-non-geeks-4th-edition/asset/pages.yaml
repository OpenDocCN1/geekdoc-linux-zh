    suffers from its fair share of annoyances, and although I seem to spend far less
    time fixing things on Ubuntu than I ever used to on Windows, it''s best not to
    ignore the possibility that you might some day experience a hardware hiccup or
    sticky software situation.


    The purpose of this chapter is to arm you with some general-purpose tips, tricks,
    and troubleshooting hints. You''ll find explicit instructions on how to fix specific
    problems, but for the most part I''ve tried to keep the discussion general. This
    is the way you resolve some issues will depend heavily on the peculiarities of
    your setup, and just isn''t a a bookshelf big enough for a guide that covers every
    possible eventuality in suitable detail. Fortunately, the Internet harbors a sizable
    collection of Ubuntu-related'
