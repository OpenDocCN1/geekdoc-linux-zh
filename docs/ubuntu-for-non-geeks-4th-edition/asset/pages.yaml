- img_proc: true
  md: 'dual-boot, though I eventually found that I used the Linux side of things exclusively.
    Having so much disk space being taken up by a Windows system I didn''t use seemed
    a waste of prime real estate, so I just dumped the whole thing and went for a
    straight Linux-only setup.


    My feeling is that you should try the Rubi route of installing Ubuntu inside Windows
    first and then, when you''re ready, go for a Linux-only setup and ditch Windows
    completely. Most people find Ubuntu can do whatever they need, so there''s no
    need to dual-boot unless you require some specific application that has no equivalent
    on Linux.


    If you opt for a dual-boot setup, starting up in either system is easy. When you
    start up your machine, you will be greeted by the GRand Bootloader (better known
    as Grub) screen, from which you can choose to continue booting Linux or choose
    Windows instead. After that, bootop proceeds for the system you selected. This
    setup works fine and is easy to use, so you needn''t worry.


    So as you see, either way you decide to go, you can''t really go wrong. Just be
    sure to back your important files before starting the installation. Proceed with
    common sense, patience, and a positive attitude, and you''ll be in fine. Short,
    don''t worry.


    # Getting Ready for Action


    There is less need to prepare for an Ubuntu installation than for other Linux
    distributions. Once you decided whether you want to go the dual-boot route, all
    you need to hand on is your single Ubuntu Desktop CD, and for guidance and security,
    the only mental energy you probably to expend is to come up with a username and
    user password, as you do for most other operating systems.


    # Usernames and User Passwords


    Your username is something that will be quite a bit. You will need to click it
    every time you boot up your system, among other things, so be sure it is something
    you can live with. It can be your first name or your initials whatever you want
    it to be. It must, however, begin with a lowercase letter, followed by numbers
    and/or lowercase letters. Mine, for example, is simply rg but you could use something
    like hopefu2pal, though that would get rather tiring to look at.


    You also need to come up with a user password, which you will need to type every
    time you log in. You will need to use it when you install new software or change
    certain system settings, as well. It should be a minimum of eight characters in
    length and consist of numbers and letters (upper- and lowercase) for improved
    security. You can, of course, get by fewer characters and only letters if you
    prefer. The installer will advise you if the password is unacceptable, so don''t
    worry too much. Be sure to write it down and keep the paper you''ve written it
    in in a safe place so you don''t end up locking yourself out of your system.'
