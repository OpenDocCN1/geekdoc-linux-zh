  md: '# # 5. Debian Etch installation workshop


    # ## 5.1. Introduction


    Whereas the first workshop helped us take our first steps on a UNIX-type system,
    and to do so we used a distribution that leaves no trace on our computer, since
    it was booted and executed from a CD-ROM or DVD-ROM, this one serves to teach
    how to install a basic GNU/Linux system on our computer.


    The distribution selected for this workshop was Debian GNU/Linux 4.0, known as
    Etch (the latest one at the time of publishing this work), which was released
    on 8th April 2007 following 21 months of continuous development. Debian GNU/Linux
    is a free operating system that supports a total of eleven architectures.


    In terms of software, its innovations include the desktop environments GNOME 2.14,
    KDE 3.5.a and Xfce 4.4; Office suites OpenOffice 2.0.4a, KOffice 1.6, GNUCash
    2.0, GMetric 1.6.3 and Abiword 2.4.6; Coreo Evolution 2.6 and messaging Gaim 2.0;
    iweasel 2.0.0.2 is the Firefox navigator, while icedove 1.5 is the Thunderbird
    mail client; both programs are versions that the registered trademarks do not
    use.


    It also includes cryptographic programs, it is compatible with FHS version 2.3
    and with the programs developed for version 3.1 of the L.


    Debian GNU/Linux 4.0 introduces a new graphic interface for the installation system
    which supports spellings using compound characters and complex languages. The
    installation system for Debian GNU/Linux is now translated into 58 languages.
    As of Debian GNU/Linux 4.0, security and the efficiency of the package management
    system has improved.


    Debian GNU/Linux can be executed on computers running from PDAs and pocket systems
    to servers, via any intermediary system. It offers manners for a total of eleven
    architectures: Sun SPARC (spar), HP Alpha (alpha), Motorola/IBM PowerPC (powerpc),
    Intel IA-32 (i386) and IA-64 (ia64), HP PA-RISC (ppa), MIPS (mips, mipsel), ARM
    (arm), IBM S/390 (s390) and introduced (for the first time in Debian GNU/Linux
    4.0) AMD64 (am664).


    The choice between Debian and RedHat for this workshop and the remaining ones
    were not easy, since RedHat offers commercial products that are very well received
    in the business world, and in general it is considered'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'much simpler to install a Red Hat as a Debian distribution. The fact that we
    have chosen Debian is due to the following reasons: this distribution reflects
    the philosophy of GNU/Linux more faithfully and everything is achieved thanks
    to the voluntary work of thousands of people; secondly, it is probably one of
    the distributions that gives us most freedom when it comes to installing and maintaining
    it; and as a fundamental point, for its packages system, which is probably the
