  md: '# 6.5.2 Network card (Ethernet type)


    To configure a new network card (Ethernet type), the first thing we have to do
    is to add the necessary kernel module so that it can be properly recognised. Although
    with some cards we may not have to carry out this step because the kernel itself
    is already compiled with the most common cards, we must make sure (before buying
    the card) that the necessary driver or module is available.


    # Network card module


    We can find out which module our network card needs using discover -module Ethernet.
    If we want to configure it so that it always loads, we have to overwrite it in
    /etc/modules (otherwise, we can insert it with modprobe or insmod).


    Once the system has recognised the card, we can configure however we want.


    In the /etc/network/interfaces file, we can specify all the configuration; we
    will list all the other interfaces in the system in this file. An interface (a
    real or virtual) device linked to the network with which the system can communicate
    with other computers, offer services etc. The file is the gateway that the system
    can use to communicate. This file should be used to specify the directives that
    are necessary to make the device work


    Let''s look at it with an example:


    ```

    #loopback interface auto lo0 iface lo0 inet loopback #NIC auto eth0 iface eth0
    static

    address 192.168.0.10 netmask 255.255.250 network 192.168.0.0 #optional broadcast

    192.168.0.255 #optional gateway 192.168.0.1 #optional

    ```


    The first entry we will find in this file is for the loopback interface. This
    interface does not correspond to any device or card in the computer, but is a
    mechanism in the operating system that makes it possible to use the communication
    protocols internally. Else, if we are carrying out functions without communicating
    with any other computer, it is not necessary to have a network card installed.
    In all the entries, before specifying the configuration of the device. We will
    find the auto directive in it. This directive indicates that the card can be mounted
