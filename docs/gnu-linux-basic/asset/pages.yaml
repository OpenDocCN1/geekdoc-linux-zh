    deb http://security.debian.org/ stable/updates main contrib non-free

    ```


    As critical packages are detected, they are placed in this source, so that by
    running apt-get update, we can find out what new updates have to be performed
    in the system and the required packages can be reinstalled.


    Although the dpkg programs can be used to change any aspect of the packages installed
    in the system, create new packages, modify the installed ones etc., we will only
    look at the most important ones at the user-level in this course, so that we can
    carry out all the basic operations. The main dpkg programs are as follows:


    +   - dpkg-divert: can be used to set the place where we will install some of
    the installation packages in the system. It is very useful for avoiding problems
    with dependencies.


    +   - dpkg-reconfigure: the deb package itself very includes some mechanism to
    configure some of the options of the application interactively. With this application,
    we can reconfigure the package that we want using the same mechanisms used during
    installation.


    +   - dpkg-scanpackages: this program can be used to scan a specific directory
    of the system that contains .deb files, so that an index file is generated. We
    can use this index file to include the directory as another source of apt. It
    is very useful when we download unofficial programs of the distribution.


    +   - dpkg-scansources: this is an application with the same functions as the
    preceding one but for packages of source code.


    +   - dpkg-split: this program is used to divide and unify a package in various
    different files.


    With these programs, we can manipulate our packages in any way we wish. The main
    application, dpkg, is the one that allows us to install, list or delete the packages
    in the system. In order to list the available packages, we can enter the -l parameter
    which will show a complete list of the packages and their installation status
    (installed, installed but not configured etc.). If we wanted to see all the information
    of a specific package, we could use the -p parameter followed by the name of the
    package, which would show all the dependencies, conflicts with other packages,
    version number, description etc.'
