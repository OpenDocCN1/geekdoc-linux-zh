  md: '# 6. Basic configurations


    # 6.1. The login system


    If we have still not configured the graphic environment, when we boot a GNU/Linux
    system login screen will appear asking the user to identify himself or before
    starting to use the system. In fact, most distributions launch several consoles
    that we can access through Alt+F1, Alt+F2 etc.


    This allows us to work simultaneously with several accounts at the same time,
    having various sessions to run different programs etc. The program responsible
    for managing each of these consoles is **Getty**. The only thing that this program
    does is to open a connection with the appropriate device (in the case of the screen,
    it is `/dev/ttyx`, where the *X* is the number of the console) and to the login
    application. This mechanism gives us a lot of flexibility, since the **Getty**
    program itself allows communication with different devices meaning we could connect
    a terminal to the serial port, a console using a telephone line and a modem etc.


    Before launching the login application, a welcome message appears on screen. We
    can configure this message in the `/etc/issue` file, writing whatever we want.
    In this same file we can also show some of the system''s variables referring to
    them as:


    | | |

    |---||

    | \d | current date |

    | \s | name of the operating system |

    | \l | console number |

    | \m | computer architecture |

    | \n | name of the computer |

    | \o | name of the domain |

    | \r | operating system version |

    | \t | current time |

    | \u | number of active users on the system |


    Once we have entered the system, the `login` program takes care of informing the
    day''s message. This message is written in the `/etc/motd` file, which we can
    also change. This mechanism is very useful for informing all users of a specific
    event, warning them of any problem etc. If a user wish-'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'es to suppress this message, he can do so by creating an entry file called
    .hashlogin in his home directory. After displaying this message, the login process
    launches the shell configured for the user default. The first thing the commands
    interpreter will do is execute the content of the .profile file (which is in the
    user''s home directory). This file serves to execute the configured instructions
    every time the user enters the system. In addition to this one/.profile, we also
    have the /etc/profile, which is executed for all system users and should be configured
    generically for all users with the options we want having the instructions in
    each user .profile.


    # 6.2. Exploring the bash


    Although the .profile is executed irrespective of the shell that we use, the files
    .bashrc .bashprofile tend only to execute when we use the interpreter or bash
    (although it can be configured from the user''s .profile, which is where the execution
    of this file is called). Let''s look at a few of the instructions that we find
    in these:


    ```

    #BASIC CONFIGURATIONS mesn umask 022 #PATH export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
    #PROMPT export PS1="\h:\w\$ #USER ALIAS

    alias ll=''ls --color=auto'' alias la=''ls -al'' alias rm=''rm -i'' alias cp=''cp
    -i'' alias mv=''mv -i'' alias v=''vim''

    ```


    As we can see, we can define whatever we want. The first two instructions of the
    file annul other users'' incoming messages and configure the permissions for the
    new files that we create have. The following instruction is the definition of
    the PATH. PATH is the directories where we have the commands, programs, applications
    etc., that we want to be able to call from any place within the file hierarchy
    having to write the full path [we separate every PATH directory with a colon (:)].
    The following is the system''s declaration. The prompt is the line that appears
    in the shell before the "# character (for the root user) or "$" (for all other
    users). We can configure this prompt for ourselves as we wish using the following
    system variables:


    Table 6.2


    | d | system date |

    |---|---|

    | \h | name of the machine |

    | \s | shell that we use |

    | \u | user name |

    | \v | bash version |

    | \w | current directory |'
