  md: '# Figure 7.1


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_143_0.png)


    # Shell scripts of the daemons


    The shell scripts of the daemons are nothing more than a tool for facilitating
    the whole boot process, shut-down process etc. In some cases, we can also use
    the mechanism and the organisation of these daemons to execute certain operations
    that we are interested in (writing a shell script that executes when a determined
    runlevel is entered).


    Although a daemon will be a process like any other that runs in the background,
    the way in which we organise and treat it is different from the rest of the commands
    and programs in the system. Generally, all the daemons have a shell script located
    in the `/etc/init.d/` directory that make it possible to start it, or see its
    status. To carry out one of these tasks, we must run the shell script corresponding
    to the daemon that we want to deal with, by specifying some of the following parameters:


    +   * **Start:** to start the daemon. If it is already running, an error message
    will appear.


    +   * **stop:** to stop the daemon. If it is not already running, an error message
    will appear.


    +   * **restart:** restarts the daemon. This can be used to reread its configuration
    files.'
  merge: -1
