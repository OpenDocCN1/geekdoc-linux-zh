    As the image shows, linuxconf divides its operations into the following sections:


    +   - Configuration: this is the main section within linuxconf, where we can configure
    most of the system''s aspects, such as the network, the users, the installed peripheral
    devices etc. The following figures show how the network configuration and user
    dialogue screens work:'
