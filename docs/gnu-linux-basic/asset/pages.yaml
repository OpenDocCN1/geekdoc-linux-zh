    can refer to the information that another operating system we have installed on
    the computer may be able to provide.


    Once we know what type of network card we have, need to find out what module will
    allow us to access the card. The safest strategy for this purpose is to use any
    engine, for example Google, enter key words for our card (reference of the card
    NIC Linux module, for example) and read some of the pages that we find. We can
    also go to the pages of the main linux distributions and enter the card reference
    in their searches. As a last resort, we can go to the documentation of kernel
    network modules, where it specifies the correspond-module for all supported cards.


    It is also good to know whether the manufacturer has developed its own module.
    Finding a module for a card can be fairly complicated task, and it can even be
