  md: 'manage users correctly: the access and identification system (login), the programs
    that each user can run, security mechanisms to protect the equipment''s hardware,
    protection for user files.


    Operating systems based on UNIX organise all this information into users and groups.
    To enter the system, we need to identify ourselves using a login and password.
    The login needs to be a name that identifies the user unequivocally. For systems
    with more than a few users, it is important to have a good names policy so that
    all users can be clearly identified. The password must consist of a combination
    of letters, numbers, and special characters. It must not consist of any dictionary
    word or similar which would constitute a serious security risk. The password system
    is the unidirectional type. This means that our password is not stored as text,
    instead it is ciphered and saved as it is. When we enter the system and our password,
    it is ciphered and compared to the one stored. If they match, identification is
    positive, if then, there''s no identification. What is important about this system
    is that through the ciphering we cannot obtain the original password in any way.
    All programs designed to break user passwords can do is cipher words based on
    dictionaries and search and test whether they coincide with the ciphering of any
    user password. Therefore, we need to choose our passwords carefully; otherwise
    we compromise the security of the whole system.


    Currently, GNU/Linux systems we can choose two types of ciphering for passwords.
    The one used since the beginnings of UNIX is 3DES. The only inconvenience with
    this type of ciphering is that it only allows us to have 8-letter passwords (if
    we write more, they are ignored), unlike the other type of ciphering, called MDS,
    which allows us to use cipher passwords of any length we like (in fact, MDS is
    a hashing system, but can also be used to cipher passwords unidirectionally).
    The longer the password the safer it is, so we recommend using the second type
    of ciphering. In case we need to use a special system to manage users, such as
    NIS, it may not be compatible with MDS.


    Unlike an individual that can access a system, a group of users who share the
    same characteristics, meaning that it is useful to group them together so we can
    give them some type of special permissions on the system. A user must belong to
    at least one group, but can belong to more than one. The system uses this mechanism
    of groups to manage installed applications servers and other mechanisms. For this
    reason, in addition to rule, a system will have many other users associated to
    tasks that need to be carried out on the operating system. Generally, this type
    of user will not be able to enter the system (using a normal login).


    Any operating system must have a super-user (root). The root user has maximum
    privileges to carry out any operation on the operating system. It needs to exist,
    since the root will be responsible for administrating and managing


    # NIS


    NIS is a series of applications that allow us to manage users of the same network
    in a centralised manner on a single server.


    # Server


    A server is a program responsible for providing some type of service (such as
    to web pages, allowing users to connect remotely), generally referred to as the
    Internet.'
