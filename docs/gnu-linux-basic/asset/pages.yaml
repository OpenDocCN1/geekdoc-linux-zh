- img_proc: true
  md: '# 4. Appendix D. Administration tools


    # D.1. Introduction


    When administering a GNU/Linux system, it is necessary to be familiar with a large
    variety of different programs and applications. Although it is absolutely essential
    to read all the documents related to any application we wish to install before
    installing it, in some cases, the configurations may be very, very complex. For
    this reason, certain administrative tools have been appearing over recent years,
    which are more intuitive and user-friendly and allow us to handle many applications
    and services, in an easier way.


    Generally, these global administration tools incorporate mechanisms for configuring
    and managing the basic aspects of the system and configuration files for the applications
    that we use. Although it is interesting to know that these tools exist, we should
    not rely on them when setting up the whole configuration of a server, for various
    reasons. Firstly, we need to remember that these programs do not take into account
    all the possibilities available for these servers. This could mean that we leave
    some option that is important for our needs without the proper configuration,
    that we could fail to take some security system into account. Secondly, we should
    not forget that although the configuration environment may be more user-friendly
    and, generally, easier to use and manage, we should be aware of what is actually
    happening when we enable the options of the different programs and services that
    we are configuring. Although the environment is intuitive, this does not mean
    that we do not know each option means exactly. If we do not have extensive knowledge
    of the service that we are managing, it is very easy to create bugs that will
    lead to the system not working properly, security vulnerabilities either. Finally,
    another reason for not using only these applications is that the system may fail
    at some point, which will mean that we cannot use them; we may have to manage
    a system that simply does not have the applications. If we do not know of the
    details of the configuration files of the applications that we use, we will have
    no way of dealing with any small problem that arises.


    # Security of the administrative tools


    When we install some global administration tool, it is important to limit its
    use and ensure that it can only be accessed by the system''s root user account;
    otherwise, any other user could modify some aspect of the system. Furthermore,
    we should be very alert to any security vulnerabilities that may appear in them,
    because we have to manage the programs installed in the system, most of these
    tools may run with the root user''s permissions, with the dangers that this entails


    For all these reasons, these tools should be used carefully and by someone who
    knows exactly what they are modifying. In some cases, they can be very useful
    for us to see how some form of complicated configuration should be'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'carried out for detecting any bugs we have created. We should use them as additional
    tools, which assist our administrative tasks, but never rely on them.


    GNU/Linux distributions usually incorporate their own automatic administration
    tools. This feature clearly differentiates the GNU/Linux distributions. In SuSE,
    for example, there is an application Yast2, which allows us to carry out any application
    that configures the system; RedHat incorporates many different programs for configuring
    the network, the daemons, the application servers etc.; when installing a package
    in Debian, we are already ready to startup a configuration based on the answers
    we provide over various dialogue scenes; some applications have their own scripts
    that make it possible to have faster standard configurations etc. Nevertheless,
    if we know what these applications are really doing and what files contain their
    configurations. Apart from these tools, which are unique to the distribution that
    we use, although there are more general tools that we can install in most existing
    distributions. Although there are a few dozens and each administrator must choose
    the one that they most like or that most appropriate for their needs, we will
    discuss some of the most versatile and popular of these tools in this appendix.
    linuxconf and webmin.


    # D.2. Linuxconf


    The general administration application linuxconf is based on an environment of
    text menus that we can use from any console in the system. The following figure
    shows the main menu:'
