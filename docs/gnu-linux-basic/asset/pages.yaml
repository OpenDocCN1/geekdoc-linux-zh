  md: 'There is also another type of boot that uses an image RAM Disk (initrd). This
    other type of boot serves for making a modular configuration of the Linux kernel.
    It is frequently used when we need a kernel with some special configuration, to
    include modules in the same kernel, to make a boot image for a live CD, to have
    the same image for all the computers of a laboratory stored on one single server.
    In any case, the standard installations of the operating system never use this
    type of boot. If we wish to create an image of this type, we can find out more
    in the initrd manual and for the mkinitrd program.


    # 6.4. Access to partitions and devices


    UNIX-type systems treat all of the computer''s devices as if they were files.
    This gives us a lot of flexibility since we can take advantage of all the mechanisms
    and functions that we use with the files and apply them to devices. In the /dev
    we have all the devices we recognize. If the system does not recognize a device
    correctly, or if we wish to create a special one, the mknod command allows us
    to carry out this type of operation, although it is important to know exactly
    what we want to do before using it, since defective could damage parts of the
    system.


    | Disk drive and CD/DVD directories |


    For the disk and CD/DVD many distributions create a default directories they can
    be mounted (/floppy and /cd-ROM and /dev). The /mnt/ and /media/ directories are
    also provided and we use these directories for other devices that we have on the
    system.


    For the storage units, systems use another type of operation to access its files,
    the mount operation. For this operation, we use the mount and unmount commands,
    which mount or unmount all of the file of a specific device/unit in an existing
    system directory. The basic way to access the file system of a device is the mount
    directory device, where device can reference any device on the IDE or SCSI channel
    (/dev/hdXX, /dev/sdXX, the disk drive /dev/fdX, backup tapes, USB memories etc.)
    and directory is the location where we mount these devices. It is helpful if the
    directory where we mount these devices is empty, as it is not possible to access
    the devices when this device is used as a mount point.


    To unmount one of these we can unmount directory, where directory is the mount
    point. If we mount devices such as a diskette or CD, it is important not to remove
    the device from the medium before we have told the system, so that it can update
    the device''s file system cache. Likewise, we cannot unmount the device if any
    user or application is using any of its files or directories (the system would
    display an error message if we tried).


    Notice that we are not specifying the type of file system used in the unit that
    we are mounting at any point in the operation; this means that it has to be determined
    automatically. If we want to specify the type of file system manually, we can
    use the mount command with the -ttype parameter where type can be any of the ones
    on the following (see the mount manual (for the full list):'
