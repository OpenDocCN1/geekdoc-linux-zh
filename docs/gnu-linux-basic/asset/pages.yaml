  md: '# 7. Daemons and runlevels


    # 7.1. The daemons


    As we know, GNU/Linux allows us to run as many processes as we want simultaneously,
    by sharing the CPU time equally among the processes. In fact, the mechanism for
    handling the processes must also take into account what are known as interruptions.
    An interruption is a signal that reaches the system''s kernel from any of the
    devices that we have installed in our computer. These interruptions are uniquely
    linked to a specific process, which means the kernel must wake up the process
    in question (if it is not running) and redirect the interruption so that it processes
    properly. A typical example of an interruption is when we press a key on the keyboard
    or move the mouse: when we do this, the device sends a signal that must be redirected
    to the right application so that it is properly treated.


    In order to properly handle all the interruptions that occur, the kernel does
    not listen permanently to the devices in the system, waiting for their signals.
    Instead, the system runs the operations of the processes in an execution queue
    and it is only when the interruption occurs, the system attends to the device
    that has generated the interruption. This has to take place in this way due to
    the large differences in the speed of the system''s devices and the CPU. The ways
    interruptions are treated is fundamental for any operating system, as this mechanism,
    among others, is the one that makes it possible to run as many processes as we
    want and as soon as the interruptions arrive, wake up the processes that are waiting
    for it.


    A daemon (disk and execution monitor) is a process that, generally, we have loaded
    in the memory, waiting for some signal (from an interruption in a device or the
    kernel itself) to wake up and execute the functions required to treat it. Although
    this definition can also apply to other processes in the system (launched by the
    user or the system itself), a daemon also tends to run in this manner (although
    it does not in certain special cases). In this way, the daemons that we have loaded
    do not take up CPU whilst they are not strictly necessary and we can always work
    on the computer without a problem no matter'
  merge: -1
  pgno: 142
