    # ### 2.3.3. Moving about


    In order to move about the directories structure we need to use the commands for
    listing contents and changing folders. When we enter the system, the login normally
    place us in our home directory, which is generally referred to by the character
    `~`. If we want to see what is in the directory we are in, we can list the contents
    using the `ls` command. We should remember that by default the command will not
    show files that start with a dot. By using the `-a` parameter all files will be
    listed. In all directories there is a `.` entry and another `..` . The dot refers
    to the current directory, whereas the two dots refer to the directory immediately
    above the current one (in the hierarchy tree). Naturally, when we are in the file
    system root, the entry `.` will not exist because we are at the top level.


    To change directory we can use the `cd` command. If we do not add any parameter
    we will be taken to go to our home directory. Generally, we tend to indicate where
    we want to go, absolute or relative terms. In relative terms, it means that we
    will start from the directory that we are in the moment of executing the command.
    For example, if we are in the `/usr/bin/` directory and we want to go to the `/root/`,
    we should enter the following command: `cd ../` (the first two dots indicate `usr/`
    and the next ones, the system''s / root, from where we can access `/root/`). In
    absolute terms, we start from the root, meaning the command we are in the previous
    example would be: `cd /root`. To know what directory we are in we can use the
    `pwd` command.'
