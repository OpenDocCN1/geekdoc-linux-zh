    # ## 7.4.2. Regular expressions (cron)


    Many of the administration tasks for a server must be performed regularly. There
    are also lots of actions, such as updating the cron or the internal databases
    use certain commands, which need to be performed regularly for the system to work
    properly. For this reason, it is very important for the operating system to provide
    us with some kind of tool for configuring all regular executions efficiently.


    The cron daemon is the one that handles the whole system for all regular executions.
    It is very simply organised: the /etc/crontab file is where the internal configuration
    of daemon is saved; /etc/cron.daily/, /etc/cron.weekly/ and /etc/monthly/ directories,
    contain the shell scripts of the programs that will run every day, week or month,
    respectively. There is also /etc/cron.d/, where we can place the files in a special
    format for executing of certain programs in a more flexible manner.


    # ### Configuring cron


    Many of the applications of the system require some form of regular update, generally
    configured using cron. If the computer is switched on all day, it is important
    to configure cron properly, so that the operations take place at a time that we
    know the computer be switched on.


    Generally, we will find the following directives in /etc/crontab:


    ```

    SHELL=/bin/sh PATH=/usr/local/sbin:/usr/local/bin :sbin:bin:/usr/sbin:/usr/bin
