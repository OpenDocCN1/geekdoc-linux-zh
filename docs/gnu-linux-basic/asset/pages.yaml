    does not strictly need a specific window manager, although it is advisable to
    ensure that it works properly (a GNOME-compliant window manager) such as IceWM
    or Sawfish. Nevertheless, in order to guarantee the preferences and freedoms of
    the user, GNOME''s control panel always has a window manager selector that allows
    us to choose which window manager we want to use. Gnome is based on Gtk toolkit,
    the actual libraries developed within the project, known as gnome-libs.


    Like all desktop managers, GNOME has its own panel, for Nautilus files and its
    control panel. GNOME Control Panel. In order to carry out a basic installation
    of GNOME, we will install the following package along with its dependencies:


    ```

    brau:-# apt-get install gnome-session

    ```


    As we have mentioned, although GNOME does not require users to use any specific
    window manager, it is recommended that the one used should be a GNOME-compliant
    window manager. We will now install Sawfish, which was developed solely to fulfill
    this requirement. We will install the package and all of its dependencies:


    ```

    brau:-# apt-get install sawfish-gnome

    ```


    Consequently, we now have another window manager installed. We will stop the display
    manager and relaunch it so this new manager is integrated into it (GNOME also
    has its own display manager, gdm, which we can install if we want). We have two
    options for achieving our objective, which is to: run GNOME. The first is to launch
    Sawfish, from the display manager or using startx and, once in the program, launching
    gnome-session from an X terminal. The second is carrying out the same operation
    but the other way around; in other words, launching GNOME with the same procedures
    as Sawfish, and then launching sawfish from if we want Sawfish to run next time
    we start GNOME up (the session manager of GNOME itself will be in charge of carrying
    out and logging the changes that are necessary for this to occur).'
