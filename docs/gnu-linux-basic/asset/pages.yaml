- img_proc: true
  md: '# Starting and stopping the gpm


    As we have mentioned, the program in charge of administering how the mouse works
    is a daemon. Therefore, we will act as as we would with any other normal daemon
    in order to start it or stop it. This subsection will provide an example of how
    to start or stop the daemon.


    Both starting and stopping the daemon are performed using a script that is located
    in /etc/init.d/. Generally, if we invoke this script without entering any parameter,
    it will show us a line that will assist us by telling us how to use it. Let us
    therefore proceed to stop the gpm daemon:


    ```

    brau:/etc/init.d/ /gpm Stopping mouse interface server: gpm

    ```


    Using ps aux, we can check whether, effectively, there is no other process called
    gpm running and besides, we can see that if we move the mouse, nothing-happens
    on the screen. We can now proceed to start it up:


    ```

    brau:/etc/init.d/ /gpm start Start mouse interface server: gpm

    ```


    Now, when we move the mouse, we will see the arrow appear on the screen. Now,
    let us proceed to analyse whether this daemon will launch automatically when we
    boot up the computer. The /etc/initab file will tell us the runlevel in which
    the operating system will boot up: by default, it will be 2; in this file, we
    will find a line similar to the following:


    ```

    # The default runlevel. id:2:initdefault:

    ```


    Let us therefore check the directory /etc/rc2.d/ contains a symbolic link to /etc/init.d/gpm:


    ```

    brau:/etc/init.d# ls -l ../rc2.d/ | grep gpm lrwxrwxrwx 1 root root 13 feb 21
    13:03 S20gpm -> ../init.d/gpm

    ```


    If this symbolic link does not exist, and we want gpm to launch automatically
    during the booting process, we should create it manually using ls -s. If, on the
    other hand, the link exists and we do not want gpm to launch during the booting
    process, all we would have to do is delete this symbolic link; however, it is
    not advisable to delete the scripts from /etc/init.d, as they are very useful
    for booting up and stopping daemons.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# ## 9.7.2. Configuring modems


    As occurs with all other hardware, modems can be configured completely manually,
    this practice is generally being forgotten, over time, tools that are sufficiently
    powerful and reliable have been developed, which can help us avoid the tedious
    task of configuring a modem manually. One of these tools is `ppconfig`, which
    is the one we use to configure our modem.


    However, before we start configuring our modem, we have to state that not all
    the devices that are spoken of or so are actually modems. As we have discussed,
    many manufacturers, in order to reduce their costs, have started replacing physical
    components with software, and historically, some were probably the IPs of devices
    to suffer from this practice. We have to be especially careful with internal modems,
    in reality, very few of these incorporate all hardware that these devices should
    have. Real modems are easily recognisable by the difference in price compared
    to fake modems. For this reason, many of these devices have been reduced to mere
    slaves of software.


    For this reason, it is generally recommended that we use external modems, whenever
    this is possible. Regardless of whether we have a real modem or not, we recommend
    http://www.tldr.org/HOWTO/ModemHOWTO.html. Given that we will use ppconfig to
    configure our modem, unless we installed it during the system installation procedure
    (you can check this by trying to launch the application density, in other words,
    entering `ppconfig` on the keyboard or using `dpkg -l | grep ppconfig`,), the
    first thing we must do is install the:


    ```

    brau:~# apt-get install ppp ppconfig

    ```


    Once we are on the main screen of the installation interface, we must select Create
    a connection and on the following screen, we will enter the name with which we
    will refer to this,, as it is to configure and manage more than one connection.


    After assigning a name to the new configuration, we must configure the DNS access:
    we choose the default option, static DNS assignment, or a dynamic DNS assignment,
    if we are sure that our ISP provided us with the DNS addresses we will enter the
    IPs of the DNS that we use and they will be stored in the `/etc/ppp/resolv/nameofConfiguration`
    file.


    On the following screen, we must choose the authentication method for establishing
    the configuration. Next, unless our case is exceptional, we will choose the first
    option, PAP. Then we will enter the username and the password for the connection
    and choose the connection speed; the default speed is 115200, and with most connections,
    this should work without a problem.


    # Bibliography


    For more information on these devices and how they integrate into GNU/Linux, please
    go to:


    http://www.tldr.org/HOWTO/Winmodems-and-Linux-HOWTO.html

    http://www.tldr.org/HOWTO/Linmodem-HOWTO.html

    http://www.idi.net/gnomlk/winmodem.html'
