    # 7.4.1. System logs (syslogd)


    The system logs are traceable files that the operating system generates so that
    any action performed in the system can be traced back. The daemon in these tasks
    is syslogd, which is configured in /etc/syslog.conf. Each line in this file consists
    of a rule with two fields: the selector and priority. The selector is used to
    configure the service that we wish to log and the level of priority. The priority
    is used to indicate where we want to redirect the logs (to a file, a console,
    etc.). The following tables show the options that are valid for these fields.


    Generally, all the log files of the system are saved in the /var/log/ directory.
    Although most of the log files are in plain text and we can see them with any
    editor, there are some special ones that do not save the data in this format.
    They are generally /var/log/wtmp and /var/log/btmp files, which are the user entry
    logs in the system and the invalid entries, respectively. To see them we can use
    the last and lastb commands. If we have these configured we also see them by the
    -f file parameter with the last command.


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_148_0.png)


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_148_1.png)


