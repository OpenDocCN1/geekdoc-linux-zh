- img_proc: true
  md: 'We select the option for emulating a three-button mouse


    # Modules


    We select the default modules


    # File path


    We select the default configuration of the section "Files".


    # Monitor


    We choose to automatically detect the monitor. We will then give it a name, such
    as the default one, for example Generic Monitor.


    Using the spacebo, we select the resolutions that the video card and monitor support,
    typically 1280 x 1024 or 1024 x 767. We select the advanced mode for configuring
    the monitor. We enter the horizontal scan rate and then the vertical rate. These
    values or ranges are usually found in the technical specifications section of
    the monitor''s manual. If we do not have this information, it is better to enter
    a higher range, such as 28-100 for the horizontal scan rate and 40-100 for the
    vertical. We select the depth, typically 24 bits.


    # Running scripts


    After unpacking the packages, configuration scripts of several of them will run
    automatically. It is always possible to interrupt the execution of these scripts
    by pressing Ctrl+C, and then restart the process, by running the previous command.


    # 11.3. Configuring X


    The file /etc/X11/xorg.conf contains the configuration of X.Org and is divided
    into sections:


    | Files # Path of the Module files # Dynamic modules InputDevice # Description
    of the peripheral devices Device # Description of the video devices Monitor #
    Description of the Monitor Screen # Configuration of the ServerLayout screen #
    Global DRI scheme # Configuration specific to DRI |


    Each section begins with the Section command followed by the name of the section
    in inverted commas and ends with EndSection. There are commands that are specific
    to each section. We will proceed step-by-step, necessarily in the order of the
    file, describing the sections and explaining the meaning of each command, so that
    we can then modify the configuration using a text editor (nano for instance) with
    the parameters that are appropriate for the hardware.'
