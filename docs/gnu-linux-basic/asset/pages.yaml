    # Table 2.4


    | Extension | Format |

    | --- | --- |

    | .tar | tar |

    | .gz | gzip |

    | .tgz | tar + gzip |

    | .bz2 | bzip2 |

    | .zip | zip |

    | .z | compress |


    # 2.5.3. Disk operations


    Managing and handling the computer''s hard disks is another fundamental aspect
    of system administration tasks. Although later we are going to take a look at
    how to properly configure the disks that we have installed on the computer, in
    this subsection we are going to discuss the commands required to obtain information
    about them. Hard disks are divided into partitions, which we can access if we
    are dealing with an independent device, which we will refer to as a unit. This
    is very useful because it allows us to separate information we have on the system
    appropriately, so that we can have more than one operating system installed on
    the same disk, for instance. The df command shows us, for each unit mounted on
    the system, the space used and space available. Let''s interpret the following
    df output:'
  merge: -1
