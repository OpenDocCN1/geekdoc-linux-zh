    This link uses its own protocol called XDCP (X Display Manager Protocol), which
    is on a higher level than that of the communication network that is used (which
    is why it is independent of the network).


    Figure 10.1


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_184_0.png)


    In this architecture, the server is programmed to register the events that occur
    as a result of the input devices, such as the keyboard, mouse etc. and report
    them to the client. The client processes these events and replies to the client,
    which shows the results in the output devices (usually a monitor). Although the
    first impression of this design might give that the response time must be very
    slow, the XDCP protocol is specially designed to provide a fast link between the
    client and the server, so that we can really work interactively. The only scenarios
    in which we might notice this inconvenience is in remote connections using slow
    communication networks.


    To summarise, then the main characteristics and functions of each one of the components
