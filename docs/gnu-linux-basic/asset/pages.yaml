  md: '# 9. Workshop on basic configurations


    # 9.1. Introduction


    In the second workshop, we have learnt how to install a basic system so that,
    on this basis, we can start to assemble a system tailored to our needs. The first
    workshop will be the subject of these last two workshops. In after specifying
    certain aspects concerning the configuration of the package installation system,
    we will set the foundations necessary for installing the required applications.
    We will then learn how to use the different tools that Debian provides for package
    management, in other words, how to install, uninstall, update the etc. and we
    will configure some of the most frequently used, which are necessary in most UNIX-type
    systems. The last workshop will cover the graphical system. In the workshop, we
    will learn how to install it, configure it, adapt it to our preferences and finally,
    how to install and use the applications that make it possible for the system to
    work.


    # 9.2. Bootloader


    Firstly, we must make sure we install a bootloader system that is able to manage
    all possible operating systems that we have installed in our computer without
    any problems. This question was already covered superbly in the preceding workshop,
    during the installation process. If we have already installed the bootloader and
    checked that it works properly, we can go on to the following subsection; however
    if this is not the case, in other words, if we need the backup disk created during
    the installation every time we want to boot up our operating system, it is time
    to install a startup management system or bootloader in the hard drive to avoid
    the tedious procedure of using the disk every time we start up the system. In
    any case, it is in our interests to install a bootloader, as it will allow us
    to start up different kernels, among many other things.


    As we have explained, there are different bootloaders, including Lilo and Grub.
    Grub is a powerful bootloader from the GNU project, which is known for being able
    to manage the booting process of any operating system that we have properly installed
    in our computer; nevertheless, using system and configuring this bootloader is
    somewhat complicated.


    In any case, if we do not have a bootloader and we want to start up the operating
    system that we have and check whether the application is installed; to do this,
    we can use the man command for the application, for example.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 9.2.1 Installing Grub


    Currently, Grub is the default bootloader. In any case, if we need to reinstall
    it, we should read the following subsections to learn about the package managing
    system, its configuration and how to use it; or, simply, if we have entered the
    contents of all the CDs/DVDs into the database during installation or decided
    to carry out the installation using the Internet, we should run the following
    line:


    ```

    brau:-# apt-get install grub-doc

    ```


    If we do not want to install the documentation package, we can omit the last parameter
    from the line above.


    One advisable way of working with Grub, is to, before writing in the MRB, the
    tests that we think may be appropriate for the disk and that it works properly
    when booting from it. To do this, we must first copy the necessary files in /boot/


    ```

    brau:-# cp /usr/lib/grub/i386-pc/stage* /boot/ brau:-# cp /usr/share/doc/grub/examples/menu.lst

    /boot/

    ```


    Once we have done this, we will edit Grub''s configuration file, /boot/menu.lst,
    and we will tailor it to others. This operation is what complex due to, among
    other factors, the change in nomenclature where the hard disks are concerned;
    in order to identify the device in which specific file is located, we use the
    find command, once we have entered Grub''s command mode, using grub. Therefore,
    for example, if we want to find a file, whose location we will have to specify
    in Grub''s configuration file, such as /vmlinuz, we should proceed as follows:


    ```

    brau:-# grub version 0.91 (640K lower / 3072K upper memory) [ Minimal BASH-like
    line editing is supported. For the first word, TAB lists possible command completions.
    Anywhere else TAB lists the possible completions of a device/filename. ] grub
    find /vmlinuz (hd2,0)

    ```


    Grub has many more commands, for a list of these, simply press the Tab in the
    command line to obtain the following:


    ```

    grub> Possible commands are: blocklist boot chainloader cmp color configfile deb
    device displayamem end findstest geometry halt help imps robe inittrd installprobe
    kernel lock keepactive md5crypt moduleno unzip partition partytype password pause
    quit read reboot root notoverify savede fault setkey setup terminal

    ```'
