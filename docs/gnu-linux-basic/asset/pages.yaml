  md: '# 5.4. Network installation of Debian Etch


    Many of the steps for carrying out a network installation are the same as for
    DVD-ROM installation, so we will highlight and focus only on the aspects that
    differ from the process described above.


    # 5.4.1. Particularities of a network installation


    The basic difference between an installation made from a set of DVD-ROMs and from
    a network is the location of the packages when it comes to installing them. Whereas
    for an installation made using DVD-ROMs we will have to insert at least one of
    them in the disc drive each time we install a new package so that we extract the
    necessary data from it, with a network installation the packages are obtained
    remotely, which allows us firstly, to access their latest version, and update
    all those we have installed with just a single command line (`apt-get upgrade`).


    At the same time, to carry out a network installation, we generally need just
    one CD-ROM or single DVD-ROM containing the necessary information for booting
    a operating system from which we can make the installation program run (which
    is already included in the CD-ROM or DVD-ROM, together with the modules that may
    be necessary for configuring the network access, and from here onwards, the rest
    of the information will be obtained remotely.)


    # 5.4.2. Aspects common to the different methods of installation


    As already mentioned, many of the steps that we need to follow to carry out a
    network installation are similar to out distribution''s set of DVD-ROMs. Therefore,
    we can launch the installation program in the same way as before ([5.3.1.] and
    [5.3.2.]) and initially follow the same steps to configure the installation language,
    the keyboard, to partition the disk and activate the partitions ([5.3.3.], [5.3.5.],
    [5.3.6.] and [5.3.7]).


