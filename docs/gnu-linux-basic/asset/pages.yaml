    X-Window is designed with a client/server architecture. This type of architecture
    means that the software is structured into two parts that are totally dependent
    (client and server), which communicate using a communication link. Although this
    means that the design and coding is slightly more complex, the architecture provides
    complete flexibility in the sense that the client and the server can be located
    in different places and use different platforms andor operating systems. In addition
    we can take advantage of the same client to a much greater extent, as the client
    will be able to provide the service to more than one server at a time. In this
    way, the server can work with one graphical environment and the client''s resources.
    Naturally, this architecture also allows us to work with Windows locally on the
    machine where the client is located, which is not essential.


    # Windows architecture.


    Windows architecture (or windows system) is a graphical environment that allows
    us to have different applications in different regions of the screen, generally
    limited by some form of window. These environments usually provide mechanisms
    for moving and handling these windows so that the work is more interactive and
    easier to perform.


    The components that comprise X-Window are: client, server and communication link.
    Client and server are designed to be independent of the platform and the communication
    link is designed to be independent of the network protocol.


    Consequently, we can use X-Window in any type of scenario: for example, we could
    have the server installed in a computer with Windows™, connecting to a client
    with GNU/Linux and use Internet as the communication channel (protocol IPv4).
    Although configuring each one of these components (espe'
