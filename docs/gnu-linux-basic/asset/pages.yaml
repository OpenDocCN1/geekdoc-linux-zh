  md: '# 8.3. Compilation of new programs


    When administering any server, we will probably find that in some cases we have
    to use some program that our distribution does not have or that we need the latest
    version of an applications server that has not yet been properly etc. In these
    cases, we can download the source of the program and compile it. It is important
    to understand the difference between compiling a program to obtain its executable
    and directly downloading the binary. When we download it directly, what will most
    probably happen is that it will not work properly because of the libraries available
    in the system, it will try to use some library that is not exactly the same as
    the one installed in the system. For this reason, the most advisable thing to
    do when we need to install a new program and we do not have the corresponding
    package, is to recompile


    When we download the sources of an application, we will obtain a file that has
    been packaged and compressed with tar and gzip or similar. There will usually
    be an added file called README, which explains each of the steps that have to
    be taken in order to compile the program properly. Although reading is advisable,
    in most cases the installation process is the same.


    The first thing that we need to do compile the new program is to decompress and
    extract it from the package. When we have done this, we should have the source
    code structured into various directories. In its root, we can find (or) a file
    called Makefile. This file tells the compiler which libraries are used, how the
    code files must be compiled etc. If we have this Makefile, we can already compile
    the program by running make. It is not necessary to enter any parameter by, default,
    it already looks for the makefile file and executes the actions specified therein.
    If the process does not result in an error message, we then move the executable
    that has been generated as put in one of the directories of the configured PATH;
    by doing this, we will not have to write the complete path every time we want
    to run. Many makefiles also provide instructions so we do not have to carry out
    the last step. Generally, by running make install, the same program will be in
    charge of putting the binaries and the documentation files, if applicable, in
    the right place. Finally, if we do not want to save the program''s source code,
    we can delete all the contents of the directories we have created.


    # Compiling a program


    When we compile we will likely have to the sources or headers of the libraries
    that are used in the system installed. Generally, these packages usually have
    the same name as the library, but with an added "-dev" (which stands for development)
    at the end.


    # Compiling time


    The compilation process for a program can take from seconds to hours, depending
    on the application in question. For example, compiling the Linux kernel will take
    anything from 5 or 10 minutes to 2 hours (depending on the version of the kernel
    and the power of the computer in question).'
  merge: -1
