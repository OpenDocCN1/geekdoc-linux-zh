    # ## 9.7.6. Configuring soundcards


    Due to the large number of soundcards that there are on the market, it is also
    most possible to provide a description of how they should be configured. We recommend
    reading http://tldq.org/HOWTO/Sound-HOW-TO/ and visiting the websites of the most
    important sound projects under GNU/Linux: http://www.opensound.com and http://www.alsa-linux.org.


    Advanced Linux Sound Architecture (ALSA) is a project that works under a GNU license,
    to provide Linux with audio and MIDI devices.


    We will now discuss how we proceed if we need to configure a common soundcard:
    SoundBlasterPCI (chipset ES1371). For these types of cards, the lspci command
    will we use like the following:


    ```

    00:0d.0 Multimedia audio controller: Ensoniq 5880 AudioPCI (rev 02)

    ```


    Firstly, we will load the module corresponding to this soundcard, using the modconf,
    drivers/sound, es1371 command.


    Next, we will use the audio group in /etc/group and we will include all the users
    that will require access to the sound device in the group (if we want all the
    users to access it, we can omit this step and provide all the permissions to the
    files /dev/dsp and /dev/mixer); and associate the files /dev/dsp and /dev/mixer
    to the new group we have created.


    With this, we have configured the soundcard. We can now check if this is the case
    by directing an audio file directly to /dev/dsp, as suggested in http://tldq.org/HOWTO/Sound-HOWTO/
    or using the audio applications that run on it. We will have to wait until we
    have the graphical environment, before we can install it.


    # ## 9.8. Conclusion


    In this workshop, we have learnt to work with Debian''s package system, which
    is essential, as it allows us to learn how to install, uninstall and manage applications.
    We have also learned how to configure different hardware devices, and with this,
    a basic point: GNU/Linux is not as simple as other operating systems, it requires
    generally, more in-depth knowledge of the actual device as well as the system
    itself. But, to compensate this aspect, we can guarantee that once the device
    has been configured, it will work properly and we will not have to worry about
    it again. And we should'
