  md: '# 9.6. Assembly of devices, /etc/fstab


    /etc/fstab is the file that contains the partitions and devices that will be set
    up automatically during the booting process and the ones that can be set subsequently,
    as well as information on who is permitted to carry out those procedures. We will
    now show the possible contents of this file and analyse them


    ```

    # /etc/fstab: static file system information. <file system> <mount point> <type>

    <options> dump <pass> /dev/hdg1 0 ext3 errors=remount-ro 1 0 /dev/hdg2

    no swap swap 0 0 /proc proc defaults 0 0 /dev/floppy auto user,noauto 0 /dev/hdg5

    usr ext defaults 0 2 /dev/hdg6 /var ext 0 2 /dev/hdg7 home ext 0 2

    /dev/CD-ROM /CD-ROM iso9660 ro,noauto 0 /dev/hdcl /mnt/hdcl ntfs utf8 ro,user,noauto,

    gid-windows,umask=0007 /dev/hdel /mnt/hdel ntfs ro,user,noauto,

    umask=0007,utf8 0 0 /dev/hde5 /mnt/hde5 ntfs ro,user,noauto,gid-windows,umask=0007,utf8
    0 0

    /dev/hde6 /mnt/hde6 vfat user,noauto 0 /dev/hde7 vfat utf8,user,noauto 0 0

    ```


    The first lines were automatically generated by the installation process and in
    them we can see how the directories are distributed within the GNU/Linux structure.
    Perhaps the line that will call all attention will be /proc /proc defaults 0 0,
    which is in charge of setting up the virtual /proc directory, which we discussed
    in the first workshop.


