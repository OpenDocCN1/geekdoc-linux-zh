  md: '# 2.3.4. Links


    Other mechanisms that most file systems provide are known as links. A link is
    a bridge to a file or directory belonging to the system; a reference we can place
    anywhere we wish and as a direct access to any other. This mechanism allows us
    to access files or folders more quickly and conveniently, without having to move
    through the directories hierarchy. Let''s look at it with an example: imagine
    that we are a user (user1) that frequently needs to access directory `/usr/share/man/man3`.
    Instead of writing the long command that takes us to our directory every time
    we need to go there, we can create a link in our own directory that immediately
    redirects us to it. The `ln -s /usr/share/man/man3 mmm` command would create this
    bridge for us. The user will have to write (from the home directory) `cd mmm`
    and the system will automatically redirect him or her to `/usr/share/man/man3`.
    It is important to bear in mind that when executing `a cd` command to go to the
    directory, we would return to the home directory and not to `/usr/share/man/`,
    since we accessed it from our link. We can envisage this scheme as follows:


    Figure 2.2


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_35_0.png)


    When we created the link in the previous example we passed the `-s` parameter
    to the command. This indicates that we wish to create a symbolic link. Symbolic
    links mean that we are just creating a pointer or bridge towards the file or directory,
    so that if we deleted the destination file, the link would point nowhere. If we
    did not add the `-s` parameter we would create what is known as a **hard link**,
    unlike the previous one, one makes a duplicate of the file. In fact, it is not
    exactly a duplicate; it is like two entries that point to the same data. This
    means that if we modify one or the other, the two are left the same. The advantage
    of this type of link is that if we delete one of the two copies of the file, the
    other will still be kept. This type of link is not commonly used because it complicates
    file management and handling (it is always better to have a single copy of the
