  md: '# Designed to minimise traffic in the network


    Transparent (independent of the network)


    As video cards have developed, more and more applications and games have started
    needing faster 2D or 3D processing. Although the X-Window architecture provides
    many advantages, when we need to use these types of application, the client/server
    design is not the most appropriate, as we are not taking advantage of the extremely
    fast 2D and 3D processing operations provided by the video card installed in the
    server. In order to solve this problem, a new technology called DRI (Direct Rendering
    Infrastructure) appeared in 1998; this makes it possible to take advantage of
    the cards’ processing chips to save the X-Window client work. In this way, we
    continue having all the advantages of X-Window and take advantage of the specific
    elements of the video cards.


    Unlike operating systems where the graphical environment is intimately integrated
    with the rest of the functions, the X-Window architecture is completely independent
    of the operating system and does not limit us to any GUI (Graphic User Interface).
    In fact, the architecture provides us with low-level graphical tools to manipulate
    the monitor’s output. These tools are included in the Xlib library and mainly
    consist of functions for creating and manipulating windows, operations with character
    fonts, detection of events and graphical operations. With these functions, we
    can provide our applications with the look and feel that we want, create new GUIs
    etc. In fact, this created additional work for the first developers of applications
    in XWindow, as they, now, apart from programming the graphical application, had
    to develop their own libraries for the creation of menus, icons etc. As X-Window
    continue to grow, what we call toolkits, which are libraries that are generally
    implemented with Xlib and that be possible to take a particular GUI, began to
    appear.


    In this way, when we design an application, we can use some of these toolkits,
    which already provide standard tools for creating menus, buttons, managing the
    cut and paste operations and we can focus on programming the application itself.
    Not defining a particular look and feel has been another of the keys to the success
    of the X-Window architecture, as each software manufacturer or developer has been
    able to design their own, which sets it apart from the others.


    Although there are many different toolkits, the following figure shows some of
    the most popular that have been used throughout the history of X-Window:


    # Look and feel


    The look and feel is the designed used for the buttons, the scroll bars, the menus
    etc., in graphical interface or application.'
