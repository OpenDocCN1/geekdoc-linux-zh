  md: 'If we are in a local network, we will need to consult our administrator to
    provide us with all the necessary information in regard. If we have another operating
    system installed on the computer, we can also access its configuration to obtain
    this information. However, we should never invent these values, since the most
    likely result is that it will not configure properly and we will cause problems
    on the local network.


    # 4.6. Boot system


    Once we have configured all these settings, we will need to install a small program
    on the hard disk so that during the computer boot process we can choose which
    of the operating systems we have installed to boot. Even if we have only installed
    GNU/Linux on the system, we should still install this program, since its boot
    system requires it.


    There are various applications for carrying out this process. The most common
    ones are Lilo (Linux Loader) and Grub (GNU Unified Bootloader). The only thing
    applications do is to initiate the process of loading and executing the kernel
    of the operating system that we specify. In general, all distributions detect
    whether we have another operating system installed on the hard disks and automatically
    configure the boot system for us. All need to be in mind that we will have to
    place this program correctly so that it runs when the computer is started up.
    Normally, it needs to be placed in the MBR of the master disk of the first IDE
    channel or SCSI, which is the first place that the computer''s BIOS or EFI inspects
    in a program of these characteristics.


    # 4.7. Package selection


    Most installation processes include two ways of selecting the programs that we
    will install on the system: basic or expert. With the basic selection process
    the available packages will normally be grouped into large sets of programs: administration,
    software development, office suites, mathematical etc. If we still do not know
    exactly what we are going to use, this type of installation is the most appropriate,
    since we can choose what type of programs we use in general without going into
    detail.


    # Packages


    A package consists of one or several interrelated programs/libraries, grouped
    to comprise a single block. Most distributions include utilities for handling
    packages (installation, elimination, configuration etc.). This type of organization
    is very useful when we need a program, utility etc., which we can install at all
    at once.


    When we know a bit more about the system and know exactly what we are going to
    use it, the expert package selection is better. With this type of selection we
    can adjust the programs that we need much better, saving disk space and avoiding
    the system loading more programs than are necessary.


    | RedHat update |

    |---|n| RedHat has also adopted a download or update system in a similar style
    to Debian''s apt. |'
