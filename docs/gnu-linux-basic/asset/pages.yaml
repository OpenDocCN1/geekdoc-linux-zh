    # ## 11.10.OpenOffice


    In this subsection, although the subject is not within the scope of the main aims
    of this course, we will present an office suite, which can be extraordinarily
    useful for those of us who are de working with software of this type. The element
    in question is OpenOffice, a project derived from StarOffice, by Sun MicroSystems.
    We must point out that this project is multiplatform and that it can be implemented
    in other operating systems that are not Unix-type.


    To install the suite, we can use the following command (all on one line):


    ```

    brau:~# apt-get install openoffice.org openoffice.org-base openoffice.org-draw
    openoffice.org-calc

    openoffice.org-common openoffice.org-core openoffice.org-draw openoffice.org-
    evolution

    openoffice.org-gnome openoffice.org-gtk openoffice.org-help-en openoffice.org-help-es

    openoffice.org-impress openoffice.org-java-common openoffice.org-l10n-es

    openoffice.org-math openoffice.org-writer

    ```


    All we have to do during the installation process (which should be carried out
    in a graphic environment) is to remember that we have to install it for the network.
    In this way, it will only be necessary for each user''s home directory to contain
    one small directory, in which their personalised configurations are saved.


    Once we have installed the program for the first time, each user must run the
    following program to create their own directory:'
  merge: -1
  pgno: 213
- img_proc: true
  md: '```

    /usr/lib/openoffice/program/setup

    ```


    Once we have done this and we have answered a few questions, the openoffice command
    will open the suite.


    Currently the OpenOffice version in Debian Etch is 2.0.4.


    # 11.11. Conclusion


    With this workshop, we come to the end of the didactic material of the second
    module of the Masters. In the workshop, we have learned how to install the graphic
    environment in the system, which, as we saw at the time, is not an essential part
    within the operating system. But it is evidently useful in many cases and many
    people say that the operating system we have studied in this module can be a serious
    alternative to other systems. We like to express our total conviction that GNU/Linux
    is an extraordinary operating system, not only because of its graphic interface,
    which is perhaps what catches our attention when we first look at the system,
    but due to many other countless arguments, of which we would highlight the philosophy
    behind the system, its reliability, adaptability, power, potential levels of security
    etc. We are convinced that this operating system is an investment for the future,
    from which we can only expect positive developments, although it has already proven
    that it is a serious competitor in the world of operating systems. We hope that
    we have provided enough knowledge and transmitted the enthusiasm that is needed
    for readers to begin their own journey into the world of GNU/LINUX, as well as
    known how to open the doors to a community in which everyone is welcome and respected.'
  merge: -1
