    # 5.1.2. Types of packages


    Next we focus on Debian and its packages system. A Debian package can be identified
    by its .deb extension. All packages included in the official Debian distribution
    are free according to the Debian free software guidelines. This ensures the free
    use and redistribution of the packages and all of their source code. The Debian
    distribution distinguishes between four different classes of packages. The distribution''s
    own packages are included in the main class, whereas classes contrib, non-free
    and non-US are provided by the Debian organisation for the benefit of users:


    +   * **main.** Packages that comply with the Debian free software guidelines,
    in other words, free use and redistribution of all the binaries comprising them,
    in addition to their complete source code, is guaranteed.

    * **contrib.** Packages that, while free and therefore like the binaries have
    their source code available, depend on other packages that are not.

    * **non-free.** Packages that although they may be free of charge, have restrictive
    conditions that in some way limit their use or redistribution.

    * **non-US/main.** The packages of this area are free themselves, but cannot be
    exported from a server in the US.

    * **non-US/non-free.** Packages that cannot be exported from the US because they
    contain ciphered software or software that can affect issues relating to patents.


    The official Debian distribution consists of the content in the main section of
    the Debian file.


    # 5.1.3. Package development status


    The package development status will condition the type of distribution that we
    install. Thus, there are three different types of distribution:'
  merge: -1
  pgno: 90
- img_proc: true
  md: '+   * Stable - this is the most recent version of the Debian GNU/Linux distribution.
    It consists of stable well-tested software and changes only to incorporate important
    security or usability corrections.


    +   * Testing - Distribution contains the packages expected to become part of
    the next distribution. There are a series of very strict requirements that each
    package must fulfill before moving from unstable to testing. Testing does not
    have the security team''s updates at the same time as they are released.


    +   * Unstable - This distribution includes the most recent Debian packages, and
    consequently, the least tested. Therefore, they can contain serious problems to
    affect the system''s stability.


    Although all packages have their own dependencies, there is no problem in mixing
    the packages of different distributions. apt-pinning (consult, man apt-pinning)
    makes this much easier. Even so, in critical systems it is advisable to use only
    the stable distribution''s packages, which are the most reliable.


