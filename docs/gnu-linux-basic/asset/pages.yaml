    We need to create two partitions at least: a first for mounting the system and
    a second one as we can perform installations without the swap, but as already
    mentioned, it is highly inadmissible). To increase the system''s efficiency, we
    will create six partitions.


    The tool that Debian provides for partitioning is cdisk and it functions based
    on the cursors to move through the disk partitions (upper part of the screen,
    with the Up and Down arrows), as well as to select the potential operations that
    can be carried out at each (lower part of the screen, with Left and Right), these
    will vary according to the status of the selected partition. To create a new partition,
    we need to select the [New] option; next, if we can still create primary partitions
    (the maximum number is four), we will be asked whether we to create it as a primary
    or a logical partition; then we need to specify the size of the partition, and
    finally, its physical location on the disk (it is advisable to make a sketch of
    how we want to do this before starting to partition the disk, and to create the
    partitions on that basis, so that we can always answer this question with [Beginning].


    The first partition is the one designed for the root (/); it does not have to
    be very big and for this reason we will allocate it at least ten percent of the
    hard disk, preferably in a primary partition, but if we do not have it, we'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'can create it as a logical partition without ittering. We will specify that
    the partition goes at the beginning of the free space and that the type of file
    system chosen for the partition is ext3.


    The second will be used for the swap partition (swap). It should have at least
    the same size as the RAM, 512MB, 1024MB etc., with this size we will make safe,
    for exceptional cases, that will never become saturated; it is also preferable
    for this to be a primary partition, but if it is to be logical, it will not affect
    the system''s performance either. If we have more one GNU/Linux installation on
    the same computer, we can use the same swap partition for all of them, since the
    information that can be stored on during the system''s functioning is volatile.
    The file system for the swap partition will be of the swap type (swap area).


    The third partition will be used for the user directory (/usr); we need to bear
    in mind that this partition will host most of the software to be installed, meaning
    that its size will have to be significant, approximately forty percent of the
    disk. The file system will be ext3.


    The fourth partition will be used for the var directory (/var), where libraries,
    log files etc., are kept. In the previous case, it will also be ext3.


    The fifth partition will be used for users'' home directories (/home), designed
    to store users'' data, and depending on the size of the hard disk, we can allocate
    between ten and twenty percent of the hard disk to it, depending on the number
    of users and to be made of the system. This partition will also be ext3.


    The remaining space, the sixth partition, will be used for the var directory (/tmp)
    and its file system will be ext3.


    The distribution of partitions above is merely a suggestion, with two objectives:
    on the one hand, improve the performance in relation to an installation based
    on one or two partitions, and on the other hand to make the system more robust.
    Among other advantages, having the data distributed over different partitions
    means that the corruption of one of them does not automatically imply the loss
    of all the system''s information. Obviosly, we can create other partitions or
    omit some of the ones we have proposed (the order of the partitions does not affect
    the system''s behaviour).


    Therefore, having detected the disks, we can select the partition method, which
    can be either guided or manual. If it is manual, we can create the partitions
    we wish, with the size and type of file system, as we have explained above, for
    example.


    And if we select the guided option, it will suggest the partitioning system for
    us. Because this is our first installation, we will select the guided option.'
