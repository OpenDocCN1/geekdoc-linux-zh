    # 11.8. Personalising some of the aspects


    The design of the X graphic environment is due to the ambitious aim of getting
    the best performance from the available hardware, using the least resources possible,
    while providing the greatest flexibility. The structure of the client server on
    which this system is based makes it possible to achieve these objectives, and
    the apparent difficulties that inexperienced users will come across disappear
    quickly with a bit of practice, allowing the many advantages of this design provides
    to flourish. The aim of this subsection is'
