    | named | | 9 | ner |

    | news | Gustavo Nieomer | 670 | |


    # D.3. Webmin


    As the name indicates, webmin is a tool for carrying out configuration using the
    internet. It is very well designed and most of the configuration methods have
    been thought out. When properly used, it can be a very useful tool. When it is
    installed it will open port 10000 (https://localhost:10000) so that we will be
    able to access it using any browser we want. Before we can start using the tool,
    we will be asked for the system administrator''s password, although it also has
    a very useful system for administering the users with which we can specify the
    actions that can be performed by each user. This option is very interesting because
    it allows us to configure more than one administrator account, creating accounts
    that are specialised according to the tasks each user needs to perform.'
