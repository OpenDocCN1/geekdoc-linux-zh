    When we create a partition, we need to specify which file system we will use for
    it (Linux ext2, Linux ext3 or Linux). Once we have made the partitions, we will
    save the configuration and must tell the installation process where we wish to
    place the root filesystem and system swap. We have carried out these steps, we
    can continue with the rest of the installation process.


    # Active partition


    Of all the partitions of a hard disk we can select one to be the active. This
    flag serves to tell the system BIOS or EFI which partition should be initiated
    if it finds no startup program in the MBR.


    # 4.4. Installation of modules


    The kernel''s modules are software packages specialised in a particular task.
    With manner of different devices and dozens of functions for multiple file systems,
    online management operations etc., it was decided not to include all of them and
    functions as standard. In one of the first versions of Linux, the kernel we had
    did not include any function, that we had to recompile it in fact and generate
    a new one adapted to our needs. With the incorporation of modules this is no longer
    necessary and we can directly choose the functions we need.


    Generally, the distributions already incorporate hundreds of different modules
    for the Linux kernel. they tend to be organised into different categories to make
    them easier and normally, with the same name of the module or the brief description
    that comes with it we can already know what device it is designed for or what
    function it carries out. This is why we mentioned earlier that it is important
    to know what hardware our computer has: in this step we can choose in more detail
    what modules we need. For some of them we may'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'have to pass a special parameter (such as the I/O address, the interruption
    used by the device etc.), information that we can obtain from the system''s RIOS
    or EFI through the procedures mentioned before.


    It is also true that if the installation process carries some type of program
    for automatic hardware recognition, the whole process of selecting and loading
    modules is not necessary because it is already carried out automatically. However,
    it may not detect correctly a device we have installed, in which case we will
    need to include the corresponding module manually.


    If we forget to include a module (or install some new device) at the time of installing
    the system, we can use the following commands: insmod (to add a new module), rmmod
    (to eliminate a module) and modprobe (to test one, and if it works correctly,
    include it in the kernel). All of these modules are no more than binary files
    that we tend to find in the system''s /lib/modules/.


    If we have problems discovering what hardware we have installed, a very practical
    utility that tends to come with the distributions is: We can use it to know exactly
    what components we have and what modules correspond to them.


    # 4.5. Basic network configuration


    After configuring the modules that will be included in the operating system''s
    kernel, we need to configure the network (if we have the required card). Although
    in this we will not go into the details of computer networks, we will provide
    the necessary ideas to carry out this step without any complications.


    The first thing we will be asked is the name we give to the system. This name
    will serve to refer to it without always remembering its IP address. Once we have
    entered the name, we will normally be asked if our network use a mechanism called
    DHCP or BOOTP, which consists of a special server responsible for assigning assigning
    IPs to computers or boot. If we use this mechanism, we will need to specify that
    this is the case, and if not, we will be asked for the IP and mask of our computer.
    If we do not know this data, we must ask our network administrator. We will have
    to enter the IP of our network''s gateway. The gateway is a device or a computer
    that acts as a bridge between our local network and the Internet (If we do not
    have any device of this type, we can leave this field blank). Next, we should
    specify the name server or servers that we use. A name server (DNS server) is
    a machine that gives us the equivalence between a name and an IP address. If we
    do not know which one we are using we will also have to ask the network administrator.


    | IP address |

    | An IP address is a computer''s identification within a network when we use the
    TCP/IP protocol, the most commonly used on the Internet. |'
