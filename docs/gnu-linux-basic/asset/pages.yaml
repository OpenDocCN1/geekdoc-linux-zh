- img_proc: true
  md: 'When we install a system for a specific use (http server, cves etc.) it is
    advisable to choose only those programs that we will really use, in order to avoid
    security problems (the fewer we leave open, the safer the system).


    Some distributions also allow the possibility of obtaining packages from different
    locations, such as one or several CDs or DVDs, from servers on the internet. Debian
    GNU/Linux was the first to have a system of this type, called apt. This type of
    management is very useful it gives us a great deal of flexibility and keeps us
    informed about the latest program corrections and updates.


    # 4.8. Other aspects


    We need to know what to do if we had any problem with the installation or at some
    time the boot system has not allowed us to load the operating system. Usually,
    during the installation process there is a step that asks us if we wish to create
    a recovery disk. It is always advisable to generate this disk, since it allows
    us to load the operating system and access the file system to fix what is needed.


    In some distributions, we can do the same with the start-up CD. In the case of
    Debian for example, the boot process itself includes a console (we can access
    it by pressing Ctrl+F2) with the basic commands to carry out essential recovery
    operations. At all events, if we are facing a serious problem that does not allow
    us to boot the system correctly and we want all the usual tools, we can also boot
    with a live CD of Knopix or any other distribution and mount the unit where we
    have the system installed in order to fix the fault. What is important is to have
    one of these tools and have tested it before a serious problem occurs so that
    we are prepared.


    Most installation processes use an application bootstrap, which we can also install
    on the system with the corresponding package. With it could create our own installation
    process or see how the system really carries out these installation and configuration
    tasks. We can reproduce most of them with the base-config program or any of the
    others that it calls itself (you can find further information in the manual),
    although we can always turn to the operating system''s configuration files to
    do it manually.'
