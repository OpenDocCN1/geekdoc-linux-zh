  md: '# Preface


    Software has become a strategic societal resource in the last few decades.

    The emergence of Free Software, which has entered in major sectors of the ICT
    market, is drastically changing the economics of software development and usage.
    Free Software – sometimes referred to as “Open Source” or “Libre Software” can
    be used, studied, copied, modified and distributed freely. It offers the freedom
    to learn and teach without engaging in dependencies on any single technology provider.
    These freedoms are considered a fundamental precondition for sustainable development
    and an inclusive information society.


    Although there is a growing interest in free technologies (Free Software and Open
    Standards), still a limited number of people have sufficient knowledge and expertise
    in these fields. The FTA attempts to respond to this demand.


    # Introduction to the FTA


    The Free Technology Academy (FTA) is a joint initiative from several educational
    institutions in various countries. It aims to contribute to a society that permits
    all users to study, participate and build upon existing knowledge without restrictions.


    # What does the FTA offer?


    The Academy offers one master level programme with course modules about Free Technologies.
    Learners can choose to enrol in an individual course or register for the whole
    programme. Tuition takes place online in the FTA virtual campus and is performed
    by teaching staff from the partner universities. Credits obtained in the FTA programme
    are recognised by these universities.


    # Who is behind the FTA?


    The FTA was initiated in 2008 by the Life Long Learning Programme (LLP) of the
    European Commission, with the coordination of the Free Knowledge Institute and
    in partnership with three european universities: Open Universiteit Nederland (The
    Netherlands), Universitat Oberta de Catalunya (Spain) and University of Agder
    (Norway).


    # For whom is the FTA?


    The Free Technology Academy is specially oriented to IT professionals, educators,
    students and decision makers.


    # What about the licensing?


    All learning materials used in and developed by the FTA are Open Educational Resources,
    published under copyleft free licenses that allow them to be freely used, modified
    and redistributed. Similarly, the software used in the FTA virtual campus is Free
    Software and is built upon an Open Standards framework.'
  merge: -1
