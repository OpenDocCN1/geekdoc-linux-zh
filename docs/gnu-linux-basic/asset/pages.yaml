    # Establishing and terminating a connection, pon, poff


    In order to establish a connection, all we have to do is key in the Pon command
    followed by the name of the connection that we want to use; if we have only configured
    one connection, it will not be necessary to specify its name. In principle, if
    its use is not restricted, Pon can be run by any of the users.


    To terminate the connection, all we have to do is run the Poff command.


    # 9.7.3. Configuring DSL modems


    As we did in the preceding section for configuring traditional modems, here we
    will use a tool for configuring DSL modems: pppoeconf. Before beginning, we recommend
    reading http://www.tld.org/HOWTO/DSL-HOWTO and http://www.tld.org/HOWTO/ADSL-BandwidthManagement-HOWTO.


    PPPoE (Point-to-Point Protocol over Ethernet), which is a protocol that is very
    similar to PPP that uses an Ethernet interface of a modem. This type of protocol
    has been adopted by some ADSL Internet providers.'
