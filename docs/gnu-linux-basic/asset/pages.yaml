  md: '# 3. Knoppix workshop


    # 3.1. Introduction


    This workshop aims to be your first experience with a UNIX environment. For this
    reason, it is carried out step by step, by of course leaving the door open for
    the curious among you to investigate of your own accord.


    The main objective of this workshop is to become familiar with the GNU/Linux operating
    system and to everything that we are used to doing with other operating systems,
    can be exactly the same with the GNU/Linux operating system. In this workshop,
    we are also going to start working with the command line, becoming familiar with
    it and losing our fear of anything that is not a graphic environment. So, let''s
    go ahead, it''s time to put into practice everything that has been explained up
    until now.


    This workshop can be carried out on any computer, since the risk of damaging the
    information we hold is minimal. We have chosen this distribution because it does
    not require prior knowledge of the operating system to boot it, and once we stop
    the system, it leaves no trace.


    KNOPPIX by default mounts all the hard partitions on the system with read only
    permissions; therefore, we can neither write execute anything, unless we force
    it to by changing the permissions. Obviously, if we have a different GNU/Linux
    operating system, we can use it to follow the workshop.


    As this is a bootable distribution on CD-ROM or DVD-ROM, we can work without leaving
    any trace on the computer where it has executed when finished; it means that it
    is based on Debian, the file system does not comply with the Debian Policy in
    this regard. Nonetheless, these differences will not affect the workshop, and
    everything we learn be valid for later times. Furthermore, its good to become
    used to working with different distributions from the beginning and to learn to
    distinguish what is common to all UNIX-based systems and what is particular to
    each distribution.


    Before we start, just one piece of advice: let''s go ahead with our own initiatives,
    try to answer your questions ourselves, consult the help provided by the man command,
    carry out tests, if they fail, analyse why, try again, over and over until we
    achieve the desired results; this is how to learn UNIX, fearlessly, learning from
    our mistakes.'
  merge: -1
  pgno: 53
