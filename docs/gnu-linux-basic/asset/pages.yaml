  md: '# # 1. Introduction


    # ## 1.1. What is GNU?


    In order to understand the whole free software movement, we should go back to
    the late sixties, early seventies. At that time, large computer firms did not
    give software the same value it does. They were mostly computer manufacturers
    whose main revenue was generated by selling their large machines, which came with
    some type of operating system and applications. Universities had permission to
    take and study the operating system''s source code for academic purposes. Users
    themselves could request the source code from drivers and programs, for adaptation
    to their needs. Software was not considered to have an intrinsic value and came
    simply with the hardware it supported. In this context, Bell laboratories (AT&T)
    designed an operating system called UNIX, emphasised by its efficient management
    of the system''s resources, its stability and compatibility with the hardware
    made by different manufacturers. This last factor was very important before then,
    every manufacturer had their own operating systems that were incompatible with
    the rest, since it made UNIX extremely popular.


    # ### Stallman, without drivers


    Stallman himself recalled how he was annoyed when he discovered that a company
    that had supplied a new printer for the laboratory where he was working did not
    want to give him the source code. All he wanted to modify it so that the printer
    would automatically alert him when the paper was jammed. The company refused to
    provide him with the source code.


    Gradually, the big firms started realising the value of software: the first to
    do so was IBM, which in 1965 stopped offering its operating system''s source code,
    at the end of the seventies Digital Research started selling its own. This made
    all companies aware that software could be very profitable and offered numerous
    benefits. Most companies started being reluctant to give out the source code for
    their programs and operating systems and selling them as an added value to their
    hardware. In this increasingly closed environment, Richard Stallman (who was working
    at MIT, the Massachusetts Institute of Technology) was indignant to find that
    it was becoming increasingly harder to obtain the programs'' source code, which
    he used to adapt the programs to his needs, as he had done up until.


    At that moment, Stallman decided to stand up for his ideals and to launch a grand
    project to try reopen programs'' source code. Aware of the fact that he would
    not convince companies to give in on this point, he proposed to create his own
    operating system and applications, initiating a project called GNU.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Stallman''s first manifesto is particularly interesting for understanding the
    reasons why he created GNU; in this document he explains to the entire community
    what the new project consists of, how it would be oriented, and why he had to
    do it. In the manifesto he started the concept of free software and why he believed
    programmers and developers from all around the world would contribute with him.
    Although on many occasions the concept of free software is confused with the concept
    of free-of-charge or unpaid software (in English, free can mean both), in this
    document it has been made clear that there is no reason why free software should
    be free of charge. We need to be free to study, modify and redistribute, without
    being obliged to pay for it. What we need to understand is that we can ask for
    the money we want for our programs and their source code, the support we may offer
    users, the books we sell or the material that we provide, just like the many companies
    that distribute GNU/Linux do. However, at no time can we oblige the users not
    to distribute the software that we have sold. This must be able to be distributed
    freely. It is a different way of understanding software than what we are used
    to. Many of the FSF (Free Software Foundation) texts deal more with ethics than
    with engineering. We need to understand the entire movement as a way of thinking
    or doing things rather than just another software company.


    The FSF''s principles with regards to software are defined according to the following
    four freedoms:


    +   - Freedom 0 refers to the freedom to be able to use the program for any purpose.

    - Freedom 1 allows us to study how the program works and adapt it to our own needs.
    Access to the source code is a pre-requisite for guaranteeing this freedom.

    - The second freedom allows us to freely distribute copies of the software, helping
    our neighbours.

    - The final freedom allows us to improve the program and to make our own improvements
    public, for the benefit of the entire community. Access to the source code is
    a pre-requisite for guaranteeing this freedom.


    The GPL (General Public License) was drafted to guarantee these freedoms for the
    software developed by the project and for the end users of the software, and has
    since been used to protect of all type of programs. This licence puts the above-mentioned
    ideas down on paper.


    The project started to produce software in 1984, by developing all the tools required
    to implement a complete operating system. Although realising a project of these
    characteristics is a long and complex process, from the out-'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'set software programmers and developers were captivated by Stallman''s idea
    and started collaborating with him for free. The community did not stop growing,
    and gradually the necessary tools appeared (editors, compilers etc.) to implement
    the operating system''s kernel, for which the tools under development were required.
    From the start it was to build an operating system similar to UNIX following POSIX
    standards (Portable Operating System Interface). Although UNIX had its own problems
    and faults, it was, and continues to be, good enough to adapt to most requirements.
    The task of designing and writing the operating system''s kernel was left until
    last. It is still pending definitive completion and the GNU kernel, called Hurd,
    remains in the development phase.


    # Kernel


    As its name indicates, the operating system''s kernel is the core that it manages
    the computer''s resources: it communicates with installed devices and applications,
    administers the memory correctly, distributes time for all programs, communicates
    with storage devices for saving files etc.


    # Activity


    +   1.1 Read the first message written by Stallman in 1983 announcing his project:
    http://www.sf.org/gnu/initial-announcement.html.


    # Activity


    +   1.2 Read The GNU manifestoStallman''s original.


    # Activity


    +   1.3 Read General Public License.


    # 1.2. What is GNU/Linux?


    Against this backdrop, the FSF did not have a stable kernel for its operating
    system, a professor of the University of Holland, **Andrew Tanenbaum**, decided
    to write an operating system so that his students could study it. Like Stallman,
    until then he had to use the source code of AT&T''s UNIX to help teach pupils
    to design operating systems. His idea was to write an operating system that could
    be studied and modified by anyone wishing to do so. In 1987, he went down to work
    and called his project mini Unix, resulting in MINIX. He did not use a single
    line of AT&T''s Unix code, there is no restriction to the code to use and modify
    it freely.


    # Micro-kernel technology


    Micro-kernel technology is based on splitting the different functionalities of
    an operating kernel into totally separate in-communicating programs. This makes
    it very modular making tests, detecting and correcting bugs, maintenance etc.,
    a lot easier. Currently, some operating systems such as Amoeba, Chorus, Mach or
    Windows-NTTM have incorporated this type of technology.


    Tanenbaum wanted to create a system for academic purposes, so he designed it using
    a micro-kernel architecture, for ease of comprehension, using innovative technology
    for the period, which provided versatility, was multi'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'platform etc. This has been one of MINIX''s strengths and weaknesses of the
    same time; although the system is a little jewel for study and design purposes,
    it is unlikely to be used in real environments. It was easy to understand, modular
    and good for teaching purposes, but not fast. In any case, that was not Tanenbaum''s
    intention; over the years MINIX has evolved and nowadays it continues to be studied
