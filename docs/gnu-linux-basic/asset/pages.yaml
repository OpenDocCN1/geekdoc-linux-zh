  md: '# 3. Appendix C. The Fedora 7 installation process


    # C.1. Introduction


    The purpose of this appendix is to provide a general idea of the basic steps that
    must be taken in order to install Fedora 7. We assume that readers have the basic
    knowledge gained throughout the module and that they are familiar with the installation
    of Debian Ethics. The theoretical knowledge that one must have in order to install
    either of these systems is practically identical; Consequently, this appendix
    focuses only on putting the theoretical knowledge into practice and we will only
    highlight the differences between the two installation processes.


    # C.2. Starting the installation


    As this distribution is very recent, only the English version of the installation
    was available at the time, which is why the screenshots are in English, but the
    process of the installation would be the same in any other language.


    The first thing we have to do is download the DVD iso image from http://mirrors.fedaproject.org/publiclist/Fedora/7,
    record it to a DVD and reboot the computer, telling it to boot up from the DVD.
    We must use the startup prompt to indicate that we wish to carry out an installation
    or update an existing system:


    Figure C.1


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'We would then highlight the correct language and click Next:


    Figure C.2


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_229_0.png)


    We would then set the keyboard layout:


    Figure C.3


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_229_1.png)


    # C.3. Hard disk partition


    The installation system will then propose partitioning the hard drive by default.
    Alternatively, we have the option of using Disk Druid to carry out this operation
    ourselves. This option is advisable, as the program is easy to use and'
  merge: -1
