    --pidfile /var/$NAME.pid -exec $DAEMON echo "."; stop) echo -n "Stopping DESC:
    $NAME" start-stop-daemon

    --quiet --pidfile /var/$NAME.pid -exec $DAEMON echo "."; restart) [force-reload])
    echo -n "Restarting DESC: $NAME" start-stop-daemon

    --start --quiet --pidfile /var/$NAME.pid -exec $DAEMON sleep 1 start-stop-daemon

    -*) /etc/init.d/$NAME echo "Usage: $0 (start|stop|restart [force-reload])" >&2

    exit 1 ;; esac exit 0

    ```


    # Running a daemon


    In order to run a daemon, we call it up with its complete path /etc/init.d/nameDaemon
    and enter the parameter in question. Some distributions have the service command,
    which makes it possible to do the same thing without having to specify the complete
    path.


    As we have seen, the variables set at the beginning of the shell script, we have
    to specify that PATH is necessary for processing the daemon, the program that
    we will run (DAEMON), the name that we give it (NAME, must be the same as the
    name of the shell script) and its description (DESC). The only thing that the
    code does is to write a file in /var/run/ directory with the PID of the process.
    When it is stopped, this PID and the stop signal will be sent to the corresponding
    process. Naturally, we will find scripts prepared for carrying out any operations
    with the daemon that we will call, at least, at the, we must all have this structure.


    # Programming the daemons


    Although the daemons are like any other program, programming them is something-different
    from programming the user applications we need to include functions for suspending
    them and having them wait for the signals to wake them up.'
