  md: '# Appendix B. Editor vi


    # B.1. Introduction


    Knowing how to use a text editor is essential for users who want to edit or modify
    the system''s files. Although there are hundreds of different editors, vi has
    always been the default editor in systems like UNIX. Although vi can seem like
    a very simple editor at first, as we get used to its commands, we will find that
    it has many utilities make it extremely easy to handle the files. Although there
    are other editors that are more useful for long painstaking tasks (such as programming),
    most system administrators use vi for many of the administration tasks. The fact
    is that a text editor (which means it can be used in the system''s console) and
    that it is available for all systems make vi the ideal editor in UNIX environments.


    | Vim |

    | GNU/Linux, it is more common to use vim (Vi Improved), which is 99.9% compatible
    with vi but adds a few functionalities |


    To call up, we can use any of the methods shown in the following table:


    Figure B.1


    | vi file | Edits in full screen mode |

    | vi -r file | Recovers last saved version of file (for cases which editor is
    not correctly edited and a swap file is left) |

    | vi + file | Edits file and places cursor on last line |

    | vi +line_number file | Edits file and places cursor on specified line |

    | vi -l ...file_N | Edits specified files. In order to save one file at a time
    we type "n" on the command line. If we type "n" modifications are not saved |

    | vi +string file | Edits file and places cursor at first occurrence of string


    # B.2. Modes of editor vi


    Editor vi can be used in two ways: normal mode and insert mode. In normal mode,
    everything we write is interpreted by the editor to carry out specific actions,
    whereas insert mode is used to modify the contents of the file. When we open vi,
    the default mode is normal mode. To change to insert mode, we can use any of the
    keys on the following table:


    Figure B.2


    | a | Appends text after current cursor position |

    | i | Inserts text before selected cursor position |

    | A | Appends text at end of current line |

    | I | Inserts text at beginning of current line |

    | R | Switches to replacing mode to replace characters |

    | o | Adds a new line below current line and switches to insertion mode |

    | O | Adds a new line above current line and switches to insertion mode'
  merge: -1
  pgno: 225
- img_proc: true
