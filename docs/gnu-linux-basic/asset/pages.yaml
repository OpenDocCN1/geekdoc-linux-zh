  md: '# # 11.X-Window workshop


    # ## 11.1. Introduction


    In the second workshop, we discussed the basic aspects for manipulating and managing
    packages properly and we learnt to configure some devices. Nevertheless, due to
    its complexity, we did not cover the configuration of the video card, or, rather,
    the installation of the X graphical environment. Due to the complexity of its
    structure and configuration, we have decided to dedicate one workshop to the X
    Window System. In this workshop, we will learn how to install, configure and personalise
    this system. But we will not try to provide an exhaustive example of the whole
    system, as doing so would be impossible for many different reasons. What we will
    provide some basic knowledge so that each person should be able to configure their
    own system, depending on the type of video card that they have and their personal
    tastes and preferences. By the end of the workshop, we should be able to install
    an X environment and know how to take advantage of its incredible power.


    # ## Activity


    +   11.1 Due to the complexity of the X system, it is helpful to read the following
    documents to get an idea of the basic concepts, before working on the system.
    In addition, these documents will provide additional knowledge, which we will
    be able to put into practice during the workshop.


    a) XWindow-Overview-HOWTO. This is a simple document that can be read to assimilate
    the basic concepts related to the system.


    b) XWindow-User-Howto. This is a document with more advanced contents than the
    previous one, but it is also helpful.


    # ## 11.2. Installation and configuration of X server.


    As we have mentioned, the X Window System is a very complex system that integrates
    many libraries and applications, some of which are essential for it to work, although
    only have to be installed if we really need them, due to our particular necessities.
    This is one of the reasons why, in Debian, the system is distributed in many different
    packages, of which we will only install the ones we need.


    # ## 11.2.1. Different strategies for installing the packages


    By the fact that there are strong interdependencies between the different packages,
    we can take advantage of this so that the actual package management system installs
    all that it believes be necessary for a high-level application to work, among
    which it will find, obviously, all of the system''s'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'basic packages. Consequently, we use dselect or apt-get to install one of these
    applications. This is not a good strategy, because it involves the loss of control
    of the packages that we are installing and it can also mean that some essential
    packages are omitted, no reference has been made to them when the dependencies
    were calculated, for any reason. Therefore, we recommend building the system step-by-step,
    so that we know which packages are being installed during each stage and understand
    why.


    # ## 11.2.2. Installation of basic packages


    # Chipset and device


    The first step is to determine the chipset of the video card and the device that
    supports it. Run the lspci command in a terminal and search for the words VGA
    compatible controller: the information that follows normally identifies at least
    the brand of the video card and possibly the device you will need. For example,


    ```

    $lspci 01:03.00 VGA compatible controller: ATI Technologies Inc ES1000 (rev 02)

    ```


    The first column shows the number of the PCI bus to which the card is connected
    in the format <bus>:<slot>:<func>.


    By running


    ```

    $lspci -n -s bb:ss.f

    ```


    we identify the PCI bus numbers to the vendor and device ID of the card. For example,


    ```

    $lspci -n -s 01:03.00 01:03.000: 1002:515e (rev 02)

    ```


    The vendor and device ID have format vvvv:dddd numbers. In this case, the vendor
    and device ID of the card is 1002:515e. With this information, we search the video
    cards (http://www.calele.org/pcidevices/xorg-device-list.html) for the devisce
    that we need to use. In this case, the device is radeon.


    We also need to know the monitor''s horizontal and vertical scans. The scans are
    usually found in the specifications section of the monitor''s manual. These data
    are very important and incorrect values can cause the monitor to stop working
    properly and even cause damage.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# # Installation of Xorg


    From the commands interpreter, from the root account, we key in:


    ```

    # apt-get install xorg

    ```


    This is a metapackage, when using the dependencies system, installs a set of X11
    packages, as X.Org server, a set of basic tools and fonts.


    We will now go over a step-by-step configuration of the xserver-xorg package,
    carried out with debconf. If we do something wrong, we can undo it with "Ctrl+C"
    and reconfigure it,


    ```

    # dpkg-reconfigure xserver-xorg

    ```


    # # X Device


    We will choose the device that most suits the video card from the list, in accordance
    with how we identified the chipset at the beginning. For example, .


    We will then give it a name, such as the default one, for example Generic Video
    Card.


    We identify the card in the PCI bus, for example, PCI:1:0:0.


    It almost automatically detects it. We should leave the amount of memory bank
    so that the server automatically detects it. We should choose not to use the kernel''s
    "framebuffer" device.


    # # Keyboard


    We set it so that the keyboard is not automatically detected. We select the keyboard''s
    default language (by default, es for Spanish). We select the keyboard rules xorg
    (by default). We select the Other options are pc101, pc102, pc105. The last two
    are for European keyboards. We leave the variant and options of the keyboard bank.


    # # Mouse


    We select the mouse device, for example, /dev/input/mice.


    If the mouse is connected to a serial communication port, /dev/ttyS0 corresponds
    to port COM1, /dev/tty1 for port COM2 etc. The unit /dev/psaux is for PS/2-type
    mouse and /dev/input/mice for USB-type mice.


    We select the mouse''s protocol, for example, ImPS/2.'
