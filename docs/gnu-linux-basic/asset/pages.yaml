  md: '# 6.3. The boot system


    Although with the installation of the operating system a boot system is already
    configured and installed, in this subsection we will look in more detail at what
    we are given and how we can customise and adapt them to our requirements. Although
    there are many, Lilo and Grub are the most common ones in GNU/Linux environments,
    so we will only focus on these two.


    Before going into detail about the configuration of these two programs, we will
    explain how a standard PC''s boot system works. As we already know, we can configure
    a computer''s boot sequence from the BIOS or EFI. Generally, this sequence tends
    to start searching in the disk drive continuing with the CD/DVD drive and the
    hard drive. Although we can install Lilo or Grub on a disk or boot sector of a
    CD, it is more normal to install it on the hard disk so as not to have to insert
    the disk every time we boot our computer.


    When the computer boot system searches for the hard drive, the first it will inspect
    whether the MBR (Master Boot Record) of the first hard drive (master of the first
    IDE channel or first disk channel) contains any indication of the system to be
    loaded. The MBR is the first track of the hard disk, where information regarding
    configured partitions is stored, and optionally, the program responsible for initiating
    the operating system. If this program is not found here, the boot sector of the
    disk''s active partition will be inspected. Whenever we wish to install a program
    in the computer''s boot system we must place it in one of these zones. In the
    following figure we can see this entire process when the boot sequence is first
    the disk drive and then the disk:


    Figure 6.1


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_127_0.png)'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'Whenever we install a boot system, we need to remember that the order in which
    this sequence is carried out is important: if we install one of the MBR and another
    on the active partition, the MBR''s will be executed because it is the area the
    BIOS or EFI installs first. If we do not have an active partition, we need to
    place the boot program in the MBR. At all events, the most advisable is to always
    install the boot program on the MBR because it is the first thing to be installed.
    Although we may have other operating systems installed on other disks, in the
    program configuration we will tell it which the operating system we wish to load.


    Normally, in modern computers the boot sequence is: CD/DVD, hard disk, USB, network
    etc.


