    # 6.5.5. ADSL and PPPoE


    Asymmetric digital subscriber line (ADSL) is a communication technology that makes
    it possible to transmit data through telephone and television cables. Asymmetric
    communication implies that the download and upload rates are different; generally,
    the upload rate is slower.


    ADSL uses a cable modem or a concentrator depending on the method implemented
    by the Internet service provider. Both connect the respective devices to the computer''s
    Ethernet interface, the first one, eth0 and some-times to a USB port.


    The ideal configuration for the Ethernet interface would be in DHCP mode, with
    the modem cable providing the IP address, DNS etc. as this means that everything
    configures itself automatically.


    PPP (Point-to-Point Protocol over Ethernet) is a protocol that is very similar
    to PPP that uses an Ethernet interface instead of a modem. This type of protocol
    has been adopted by some ADSL Internet providers.


    The ADSL connection is generally part of the telephone service. The signals (telephone
    and ADSL signals) are divided in a device called a splitter, which separates them
    to their respective frequency ranges. The ADSL signal then enters a device known
    as a concentrator that is connected to the computer''s Ethernet interface with
    a twisted pair cable, with RJ45 connectors or to one of the computer''s USB ports.'
