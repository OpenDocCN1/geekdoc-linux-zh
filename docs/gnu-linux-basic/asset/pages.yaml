  md: '# 3.6. Handling files and directories


    Having examined different options for achieving the same purpose, we are still
    in the root directory. Now we can learn how to create files and directories, move,
    copy, delete them all. We will do this on the disk that we used to boot KNOOPPIX,
    which the system has mounted while booting (later we will learn how to mount and
    unmount devices)


    Let''s remember that in UNIX before devices can be used they need to be mounted,
    and before the device is removed, they need to be unmounted. This last point is
    extremely important, otherwise the data''s integrity cannot be guaranteed. For
    example, we can attempt to remove the CD-ROM by pressing the eject button before
    proceeding to work on the disk. Surprise! we can''t; we shouldn''t think that
    the device has broken, much less than GNU/Linux has done this. It is simply that
    the system has mounted this device automatically during the boot, and, therefore,
    it has become part of the system; it would make no sense to be able to remove
    the CD-ROM without telling the system before; the system has taken control of
    this device and, among other things, has disabled the eject button for the CDROM,
    precisely in order to avoid it being removed without first having unmounted. This
    is not the same with the disk drive: for this device the eject button functions
    mechanically, meaning that the system cannot prevent us from ejecting the disk
    without telling it, first, but this is not advisable, as we have already said,
    it could entail the loss of the data that it contains. Therefore, until we learn
    how to mount and unmount data support devices, the disk must remain in the disk
    drive from the moment the system boots until it stops, since, along with other
    operations during the stop process these devices will be unmounted. Let''s go
    to the disk; but, where is it? Where has the system mounted it? To find the answer
    to these questions we will execute the mount command with no arguments or additional
    options (this is precisely the command used to mount devices, and ummount to unmount
    them):'
