    | "Device" Identifier Generic Video Card" Driver "sis" BusID "PCI:1:0:0" EndSection
    |


    The Driver specifies the device. In this example, the device sis supports many
    types of video cards with the SIS chipset. Other common devices are cirrus, ati,
    rtl128 (ATI Rage 128), radeon (ATI Radeon), s3virge, savage, trident, tseng. We
    can use the method described at the beginning to determine what type of device
    we are using.


    The BusID identifies the video card in the PCI bus, which we can determine with
    lspci.


    #  11.3.2. "Monitor" section


    This section defines the monitor.


    | "Monitor" Identifier Generic Monitor" Option "DPMS" HorizSync 28-100 VertRefresh
    40-100 EndSection |


    The Identifier is similar to that of the "Device" section. There may be various
    "Monitor" sections in the file, with a different identification. This is convenient
    if, for example, we have various monitors, say one at home and another at work.
    In this way, we can easily define a configuration for when the computer is in
    home and another for when it is at workplace.


    The HorizSync specifies the monitor''s horizontal scan rate in kHz units. It may
    be a fixed rate [31.5], multiple fixed rates, [31.5,35.2], of a range, [30-64],
    or ranges, [15-25,30-64]. The VertRefresh entry specifies the vertical refresh
    rate in Hz units and the values have the same format as HorizSync.'
