- img_proc: true
  md: '# Partition configuration


    When we format a hard partition (using the ext2 or ext3 system), we can configure
    the size of the block and many other parameters. These parameters can be adjusted
    to make the system adapt better to our needs and achieve greater efficiency.


    | Filesystem | 1k-blocks | Used | Available | Use% | Mounted on |

    |---|---|---|---|---||

    | /dev/hda1 | 7887712 | 421288 | 6970828 | 6% | / |

    | /dev/hdb1 | 19541504 | 5742384 | 13799120 | 29% | /info |

    | /dev/hdc | 664432 | 664432 | 0 | 100% | /CD-ROM |


    As we can see, for each partition or device mounted on the system, the command
    tells us the number of blocks available. The disk block is a unit that is used
    internally on the storage devices to make them more effective. By default, this
    command shows us the information in 1 blocks, although by passing the -h parameter
    (human readable) we can see it more easily. The first line always shows the root
    of the file system and then the other devices. Observe how it also shows the anchoring
    point (in the last column), which is the folder we go to in order to view its
    content.


    Another very useful command is du, which shows us what a file really occupies
    on the disk. For a clearer understanding of what we mean by this, we need to look
    in a bit more detail at the internal organisation of the disks and how the operating
    system handles them. As mentioned previously, for efficiency the operating system
    divides the disk space into smaller parts known as blocks. The size of the block
    can be configured and generally depends on the size of the disk, although we can
    also configure it to adapt better to our requirements. Every time we want to add
    a new file, the operating system will assign it to a block. When reading or acting
    on it, the operating system can read an entry directly (of the configured size)
    in just one step. When the file occupies more than one block, it is assigned more,
    trying to make sure that they are as close together as possible, so that they
    can be read consecutively thus increasing the read speed. The only inconvenience
    with this type of system is that the blocks are wasted when the files are very
    small, since if a particular file does not occupy an entry block, the remaining
    space cannot be used for any other. In any case, this type of organisation is
    the used by all existing file systems, it is the most viable for making use of
    the hard disk. The du command, therefore, shows us the number of blocks that a
    particular file really uses on the disk.


    To know what parameters we have configured on our disk units formatted with the
    ext2 or ext3 extensions, we can use the dump2fs command, adding the specific partition.
    We will see how there are many different options that allow us to adjust carefully
    its behaviour (we can find what each option means in the manual). In any case,
    once we formatted a partition, we will not'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'be to modify hardly any of these options. If we wish to change them, we will
    have to copy all of the partition''s information, reformat and copy the original
    files again.


    # Defragmenting a disk


    Defragaging (defragmenting) a disk is no more than reorganising the blocks of
    files to place them in consecutive places to make access quicker. In the file
    systems that we use with GNU/Linux it is not necessary to defragment the disks
    (there are normally programs for this purpose) the system automatically takes
    care of organising them properly.


    The kernel functions that take care of managing files use a series of methods
    to speed up the read and write processes. One of them is to use a disk cache,
    so that we do not have to be reading and writing to the physical device, which
    all that cache mechanism does is keep a copy of the file on which we are working
    in the RAM (much faster), so that the process is transparent for the user (the
    disk is following a policy implemented in the kernel). The only problem with this
    handling is if there is a cut in the power supply and we have not shut the system
    down properly, some files may not have saved on the physical disk and we may have
    an inconsistency in the file system. The `fsck` program will check and fix a file
    that has left in this state. Although we can execute it whenever we wish, generally
    the operating system itself will run it when the boot process detects the system
    did not shut down properly (before switching off the computer, we must run the
    `shut-down` command, which takes care of launching all the processes needed for
    the programs to end, etc.). In reality, the ext3 file system is more efficient
    than its predecessor because the journaling allows it to recover more information
    on lost files and faster.


    Naturally, if the files we are dealing with our system are highly critical and
    we cannot, allow ourselves to lose them, we can also configure the operating system
    not to use the disk cache system. At all times it is highly advisable to use this
    mechanism because it significantly improves the system''s performance. At any
    point we are interested in synchronising the disk cache information with the physical
    disk, we can use the `sync` command. We can also check a partition''s physical
    integrity using the `badblocks` command, which carries out a check on the indicated
    device to make sure that it has no damaged zones.


    Most of the commands we have described in this subsection require special permissions
    to be executed, meaning that only the root will be able to use them.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# 2.6. Operations with commands


    # 2.6.1. Rerouting


    Once we have learned to use the system''s commands, it is likely that we will
    want to use them simultaneously in some cases as to speed up the actions we wish
    to carry out. A very interesting operation consists of being able to connect a
    command''s output to another''s input and process it appropriately. The operating
    system uses a pipes mechanism, which allows us to reroute the outputs of any command
    or program to wherever we want. It works very simply: all we have to place the
    "|" character between the commands, so that the first one''s output serves as
    the input for the second. Let''s look at it with an example: when we write the
    echo field1:field2:field3:field4 command, all we would be a screen displaying
    field1:field2:field3:field4. If from this output we wanted to take "field3", we
    could reroute it with a pipe to the cut command, to select the field we are interested
    in as follows: echo field1: field2: field3: field 4 | cut -f 3. In the following
    diagram, we can visualise this example graphically:


    Figure 2.3


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_48_0.png)


    Of course, we can connect as many pipes as we need in order to carry out more
    practical tasks than the one we have seen. Another type of very practical rerouting
    is related to files. This type of rerouting allows us to take all the output of
    a command or program and to save it in a file using the character ">", as we did
    with. For example, if we wish to write in a new file everything we write until
    pressing Ctrl+C, we could use the following: cat > test.txt. With ">" can do exactly
    the same, but instead of creating the new file, if the file already exists, it
    would add information to the end of it. With "<" the rerouting is made in the
    opposite direction, directing the content of the file that we specify towards
    the indicated command or program.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'A very interesting aspect that we ought to know about UNIX type systems is
    that they separate the normal output of a program from its error. Although default
    outputs are directed at the console where the program was executed, we can manipulate
    them to direct them wherever we want. In this practical, we will try to delete
    a file that does not exist using the following instruction: `rm file > results`.
    Although we are rerouting the command''s output to the file, the screen will display
    an error message telling us the file has not been found. This is because by default,
    rerouting only the program''s standard output and not the error output, which
    is also displayed on screen. To reroute the output, we should indicate, in front
    of the character ">", the number "2" (1 is the normal output). Thus, by executing
    `rm file>2 results` we may reroute the output. We can also save the normal output
    and error output in two different files: `rm file 1>results 2>errors`. On the
    other hand if we wanted all outputs to be directed towards the same file, we could
    use >;. Furthermore, with the ampersand character (&) if we wish to direct outputs
    of one type towards others; for example, if we wish to direct the errors to the
    normal output, we could specify this as follows: `2>&1`.


    #  2.6.2. Specific bash commands


    Although of the commands that we have looked at are specific to bash, this commands
    interpreter has other commands that can help us carry out many more interesting
    operations. A very useful mechanism is to execute the processes in what what is
    known as **background** mode. This mode simply tells us that the process is being
    executed, but the shell is returning the command line so that we can continue
    to execute other programs. To tell the bash program this, we need to type the
    character "&" after the command or program that we are about to execute. Once
    the process has been launched in background mode, a line is displaying the job
    number and PID of the launched process.


    With the **jobs** command we can see what processes are launched in background
    mode (by passing the -l parameter we can also see its PID). If we wish to pass
    one of these processes into the foreground mode (as if we had launched it from
    the command without the "&") we can use the `fg` command indicating the PID process.
    We also have `bg`, which sends a particular process into background mode. This
    is useful, for example, when we are running a program in foreground mode and we
    pause it by pressing Ctrl+Z. Then we execute the PID, the process will continue
    to run in background mode. As we have seen in preceding subsections, processes
    also have a parent child hierarchy. When we run a program in background mode we
    we are not interfering with this hierarchy, meaning that if we sign out of the
    session,'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'all of these processes will finish because the parent interpreter (the commands
    from which we have launched them) will no longer be running. If we wish to unlink
    a process from our parent, we can use `disown`.


    Another useful bash mechanism is the command history. When we use the system we
    have to repeat many instructions that we have written already. Using the Up and
    Down keys we can see all the commands we have used and we repeat them by pressing
    "Return". We can also use `history`, which will display all executed commands
    on screen, numbered in order of appearance. By can also write `!NUM` the one corresponding
    to that history executed the program will search for the most recent one in order
    to execute it.


    The bash command interpreter has fast access keys or shortcuts that allow us to
    execute actions without having to write. Some of the most common ones are:


    +   - Tab: don''t need to write the name of a file, directory or command in full.
    If we write the first characters and press the tab key, it will write the rest
    for us. If there is more than one coincidence it will display the different possibilities.


    +   - Ctrl+L: clears the screen (leave the `clear` command).


    +   - Shift+PgUp: shows half the previous screen.


    +   - Shift+PgDn: shows half the next screen.


    +   - Ctrl+W: eliminates the last written.


    +   - Ctrl+T: interchanges the order of the last characters.


    +   - Ctrl+D: exits the command interpreter (equivalent to executing a `logout
    command`).


    +   - `ulimit` is a command that allows us to configure some of the internal aspects
    related to the bash. For example, it allows us to specify the amount of memory
    that the command interpreter can use, the maximum number of files that can be
    opened etc. This command can help us to somewhat restrict the actions that our
    system''s users can carry out (in the case of administering servers with lots
    of users).


    | Bash |

    | --- |

    | The bash command interpreter provides us with tools for regulating any aspect
    of the shell. In its extensive manual we can find the documentation required to
    learn how to manipulate them correctly.|'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 2.6.3. Shell scripts with bash


    The shell scripts are files where we write a series of commands (any of the ones
    we have seen in this section) to be executed. Although their syntax may become
    quite complex and we should go into programming aspects in order to understand
    it clearly, in this subsection we summarise some of their essential characteristics
    so that we can understand and use them at least (if we want to go into greater
    depth we go to the bash manual). The first line of the shell script should specify
    the command interpreter that is used:


    > fc command\nThe fc command allows us, like the shell script, to write a series
    of commands to be executed but without having to save the file.


    ```

    #!/bin/bash

    ```


    After this line we can start writing the commands we want to execute, one on each
    line. In any programming language, we can use variables, conditional structures
    and loops. In order to declare a variable we will use the following syntax:


    ```

    variableName=content

    ```


    If the content is a chain of characters, we do not have to put anything and if
    between quotation marks, if it is a number, and if we want to save a command output
    in the variable, we will need to put it between characters. To refer to the variable''s
    content in other instructions, we must always place the "$" character in front
    of the name. For conditional instructions we can use the following structures:


    ```

    if condition; then instructions else instructions fi

    ```


    wherecondition can refer to a file, perform an arithmetical comparison operation
    (between "(()") characters) etc. The test command is especially useful in that
    it allows us to compare files, directories etc., and returns a Boolean. Thus,
    for example, if we wanted to carry out one action or another depending on the
    existence of a particular file, we could use the following structure:


    ```

    if test -f /etc/initab; then echo "The initab file exists." else echo "The initab
    file does NOT exist." fi

    ```


    Another conditional structure is the selection:


    ```

    case word in case1) instructions; case2) instructions;; *) instructions esac

    ```'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'In this structure we compare word with case1, case2 etc., until finding the
    one that matches in which case the corresponding actions will be executed. If
    none is found, it would pass onto section (*), which is optional. This structure
    can come in very handy, for example, when we want a particular script to carry
    out one action or another to the parameter that we establish. We can refer to
    the parameters using $1 for the first, $2 for the second and so consecutively.
    For loops we can use any of the following structures:


    ```

    #LOOP TYPE FOR for i in list; do instructions where #LOOP TYPE WHILE while condition;

    do instructions done

    ```


    Of course, before we can execute a shell script we should give the execution permission
    to the corresponding file (chmod 750 fileName command).


    | Comments in shell scripts |

    |---| To write comments in the shell scripts we can use the "#" character followed
    by the comment we wish. This will be valid until the end of the line |'
  merge: -1
