    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_241_0.png)


    +   * Status: if we want to look at the logs or the status of any of the system''s
    aspects, we can use the menus in this section. Many of the system''s basic commands
    for seeing the status of the disk, the amount of memory used etc. are used in
    these.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '+   * Tasks: other configuration dialogues for starting up a modem properly,
    the network etc.


    Another way of using this program is a web browser. By default, access is not
    available for the browser and therefore, before using it we have to enable it
    using the menu Networking, Linuxconf network access and enable the Enable network
    access option. If we open the browser and go to `http://localhost:98/` we will
    have the same dialogues and menu options of `linuxconf` in html format. By default,
    we will only have access to this service from the same machine, although it is
    advisable to enable it when we want to use it.


    Finally, another project that is related to `linuxconf gnome-linuxconf`, which
    has the same functions as described above, but can be used in X systems. The following
    figure shows how it looks:


