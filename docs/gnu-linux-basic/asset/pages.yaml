    # Disk partitions


    With one or two partitions we would have enough to install GNU/Linux it is essential
    to divide the disk into more fragments and to certain directions, in different
    units so that we can manage the resources more efficiently, avoiding system crashes
    due to disk saturation. At all events, we will leave these aspects for advanced
    courses on administration.


    It is advisable for GNU/Linux to use two hard partitions. One will serve for saving
    the system files and the other for swap. Swap is an exchange zone between the
    computer''s RAM and the hard disk. It helps when the operating system''s RAM is
    totally occupied and the programs being executed need more memory. This is when
    we start using the swap to save zones of the RAM that are not being used, interchanging
    them so that the applications are left without available memory. It is also possible
    to do without swap, but it is not advisable because the system performance besides,
    when we use several applications simultaneously we will be left without enough
    memory more easily. Although the size of the swap can be as big as we want, we
