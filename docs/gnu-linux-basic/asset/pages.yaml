  md: '# 7.2. The runlevels


    The daemons that we have running at a determined moment, show us the services
    that the operating system is offering or receiving. The fact that we can have
    so many different daemons mean that we need to organise them properly. We understand
    a runlevel (or execution level) as the execution of specific daemons, which in
    turn, provide specific services. When installing a server, it is common to design
    a configuration so that certain services can be offered at certain moments and
    not at others. To allow this kind of function, the operating system offers us
    different runlevels that we can adapt to our needs.


    Although we have running number of runlevels that we want and the functionalities
    of each one, UNIX-like systems generally provide us with 6 different runlevels
    with the following properties:


    | Level | Functionality |

    |---|---|n| 0 | Runlevel 0 is configured to show the system. |

    | 1 | This level is called single user, as it only allows the root user to enter
    the system. Only a minimal number of daemons are started and it is used for maintenance
    tasks. |

    | 2-5 | Runlevels from 2 to 5 are to be configured according to the requirements
    of each installation process. When installing the system, they are all the same,
    by default. These are also called multiuser levels as, by default, they allow
    more than one user to work on the system. |

    | 6 | The last runlevel is prepared for rebooting the system. It is very similar
    to runlevel 0 but it has the rebooting function. |


    The command necessary for changing the runlevel is init (we enter the runlevel
    that we want as the parameter) and runlevel can be used to see our current runlevel.


    The only thing that the halt, reboot, shutdown or poweroff commands do do is to
    call up runlevel 0 or 6 after performing a specific operation (see the manual
    for more information). Only the system''s home user can use all of these commands.


    The way in which these daemons are organised in each runlevel is very simple.
    Each runlevel has a directory in /etc/rc/X/ where X is the number of the level.
    In these directories, we will find symbolic links to the shell scripts of the
    daemons located in which we can use to tell the system whether we want to start
    or stop the daemon that they point to. The name of the link identifies the operation
    that we will perform: if the link begins with an s (start) we tell the system
    that we want to start the daemon, if it starts with a k (kill) we tell the system
    that we want to stop or kill it. If the name does not begin with either of these
    letters, the system will not do'
  merge: -1
