  md: 'Note for all the directory content lists that we have been doing there special
    directories always appear: . and .. When we create directories, the system automatically
    creates these as subdirectories within the created directory, and they contain
    very special information. The . directory, which is known as the current directory,
    refers to the directory itself (if we execute a `ls -la` command, we will get
    the same information as by executing `ls -la` command). The .. directory, which
    is known as the parent directory, refers to the parent directory of the directory
    that we are (in executing a `ls -la` will give us the content of the parent directory
    or directory immediately above).


    # Activity


    3.1 Look at the mean of the `ls` command and understand the functions of the -a
    and -l parameters.


    Can we remember where we are in the file system? No? Well the `pwd` command will
    remind us. Let''s go back to the root directory. There are basically two ways
    of doing this and especially for this case; in any case, they are all based on
    using the `cd` command, and differ only in the argument that we pass in each case.


    The first way is to up repeatedly through the parent directories using `cd ..`
    (note, the system does not understand `cd ..`, because it interprets that we are
    trying to execute a command called "cd." which does not exist) until we reach
    the root directory (we will see it in the prompt).


    The second is more efficient, with just just one command line we will achieve
    our purpose, which is to go to the root directory (`cd /`); to do this, this second
    option is much more powerful and allows us to pass directly to directories belonging
    to different branches; for example we could have `cd /etc/rc` (the last slash
    is optional) to go to this directory, from `/usr/bin/`.


    As we have mentioned, for this case (going to the root directory) there is a third
    option to achieve the same goal with variations: it involves executing the `cd`
    command without passing any argument, and it would place us directly in the system''s
    root, in the case of KNOPPIX this is the home directory (an exceptional and somewhat
    particular case, in many distributions, and according to the Filesystem Hierarchy
    Standard, root must have its own home `/root`); a variation of this method is
    `cd *`, since `*` is the equivalent to the user''s home, the root directory in
    this case. There is yet another option for returning to the root directory, or
    rather, to return to the directory we''ve come from, the root, since we had executed
    `cd /usr/bin*` and it is `cd -`, since `-` it saves the last directory we were
    in prior to the current one.'
