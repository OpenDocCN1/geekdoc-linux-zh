    # 9.2. apts available.


    apt is an abbreviation for Advanced Package Tool, which, as we have discussed
    on various occasions, is the basic system in charge of administering the packages
    based on Debian. apt essentially provides us with two tools: apt-get and apt-cache.
    The first command can only be used by the root user of the system, as it is the
    package management tool: installing, uninstalling, updating etc.; whereas, the
    second, it is a command to find information in the database, packages that have
    not been installed yet, can be used by any of the users.


    In order to make easier to manage the packages, other applications have been developed;
    these run on a level below apt, such as the dpkg middle-end or the deselect and
    aptitude front-ends. But before looking at the different management systems, we
    should learn some concepts about these systems and how the system and the management
    system relate to each other.


    # Types of package, according to their priority


    Within the package system, there are five distinct types of packages, which are
    defined by their degree of dependence on the system itself. In their decreasing
    order of priority, they are classified as


    +   * **Required.** These are packages that are essential for the system itself
    to work properly.

    * **Important.** These are the packages that should be present in ANY UNIX-type
    system.

    * **Standard.** These are packages that are commonly found in a GNU/Linux system.
    Generally, they are small applications, which are no longer essential for the
    system.

    * **Optional.** These are packages that may or may not be present in a GNU/Linux
    system. Among others, this group includes all the packages referring to the graphical
    system, as it is not considered essential. In reality,'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'in servers, the graphical environment is discarded, with a view to increasing
    the system''s performance levels.


    +   - Extra. These are packages that either present conflicts with packages with
    a higher priority or require special configurations that render them inapt for
    integrating them as optional packages.


    We can determine which specific package belongs to, using, for example, the sentence
    apt-cache show <name of the package> and checking the contents of the Priority
    field.


    # The degree of dependency between


    apt packages are characterised by the large amount of consistency when it comes
    to managing the dependencies between packages. For example, it is possible that
    a application that we want to install depends on a library and, consequently,
    on another package that we have not installed. In this case, apt will tell us
    about this dependency and ask us whether we want to install the package that contains
    that library, along with the application that we are installing. The relationships
    between packages are classified as follows:


    +   - depends. The package that we want install depends on these packages and,
    consequently, if we want this package to work properly, we must allow apt to install
    the rest of them.


    +   - recommends. The person in charge of maintaining the package has decided
    that the users are going to install this package will normally also use the ones
    that are recommended.


    +   - suggests. The suggested packages make it possible to obtain a better performance
    than that obtained from the package that we were going to install.


    +   - conflicts. The package that we will install will not work properly if other
    packages are present in the system.


    +   - replaces. The installation of this package means uninstalling other packages.


    +   - provides. The package that we will install incorporates all the content
    of the aforementioned packages.


    We can determine the dependencies of a package with, for example, the sentence
    apt-cache depends <name of the package>.'
