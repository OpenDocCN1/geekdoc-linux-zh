    # ### 9.7.1. Configuring the mouse


    As was the case in the workshop on KNOPPIX, the daemon that will be in charge
    of administering the mouse will be gpm. We should then install the package:


    ```

    brau:/etc/apt# apt-get install gpm

    ```


    Upon completion of the installation, a script will launch automatically to help
    configure our mouse; The parameters that we must enter are essentially the same
    ones that we entered during the workshop on KNOPPIX, but if anything were to fail,
    we could always re-launch the configuration program using the gpmconfig command
    (generally, the configuration -m /dev/psaux -t ps2 should be valid for most PS2
    mice with buttons). The configuration that gpm will use every time the system
    is booted is saved in /etc/gpm.conf. It is helpful for the mouse to have three
    buttons, as functions will be assigned to all three, especially in graphical environments.
    For this reason, if we have a mouse that only has two buttons, we can press both
    buttons at the same time, for the functions that the third button would usually
    carry out.'
