    Most of these scripts use a program start-daemon which is provided by the operating
    system and is used for handling these processes. When we are administering a server,
    we often have to design our own daemons to carry out a specific task. The directory
    containing all the shell scripts of the daemons also contains an example of (/etc/init.d/skkeleton)
