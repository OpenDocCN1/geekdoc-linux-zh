    we will discuss some of the concepts that may be useful when working on a network.


    # 11.8.1. Personalisation of local aspects


    Generally, the configuration files are located in the directory /etc/X11/ or in
    one of its subdirectories. Each user can personalise and redefine the configuration
    parameters and add new ones by creating or editing the files in the home directory
    that have the same name as that of a general configuration, preceded with a \.".
    It will be possible to redefine or establish all those parameters that do not
    require superuser permissions, as the home files will be processed after those
    of the general configuration, and the parameters will always take the last value
    that are assigned to them.


    # Xsession


    /etc/X11/Xsession is a script that runs when a user starts a session.


    This script is the one that governs the whole of the process of starting a session
    we can start with, and it is also in charge of managing the error messages that
    may occur during this process, which are logged in $HOME/.xession-errors.


    In $HOME/.xession, we can personalise the booting process for a particular user.
    So, if we want the window manager to be blackbox, and we want bbkeys to launch
    automatically in the background when we begin the session, this will contain the
    following lines:


    ```

    bbkeys blackbox

    ```


    # Xresources


    In the file $HOME/.resources, we can personalise the appearance of the different
    applications. The syntax is application*parameter: value. Therefore, if we want
    to invert the colours of the application xterm, we will add the following line
    in the file:


    ```

    Xterm*reverseVideo: true

    ```'
