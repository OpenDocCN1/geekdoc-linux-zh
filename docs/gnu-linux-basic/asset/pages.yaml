  md: '# 2.3.2. System directories


    Most operating systems on the market follow the FHS standard, which defines the
    main characteristics that any operating operating system should have. These include
    how we should distribute our files into directories in order to organise them
    correctly and to be able to find them quickly and easily. Most distributions based
    on GNU/Linux follow these recommendations and we can find the following main directories:


    +   - /bin/: basic commands for all system users.

    - /boot/: static files for booting the system.

    - /dev/: system devices.

    - /etc/: system configuration files and the applications installed on the system.

    - /home/: directory for users'' home files.

    - /lib/: essential libraries for the system''s kernel and its modules.

    - /mnt/: temporary mounting point for devices.

    - /proc/: system kernel processes and variables..

    - /root/: home directory for the system''s root.


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_33_0.png)'
