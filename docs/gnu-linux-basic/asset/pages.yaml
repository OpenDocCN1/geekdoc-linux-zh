  md: '# PATH variable


    If we wish to execute the programs from the directory that we are in without having
    to place "/" at the beginning, we could add this to the PATH declaration. Likewise,
    if the PATH does not have the program that we need to execute, we can specify
    its path by the command line. In any case, it is not advisable to add "/" to the
    PATH because it can become a security hazard.


    Finally, we have the user alias. The alias are synonyms, generally for the commands
    that we use most often (to avoid having to type them in full). For example, in
    one of the alias that we had in the example we defined that when we write ls --color=auto
    should execute.. This way, we can use long commands without having to write every
    time we use.


    In defining both the PATH and the prompt we have used the export command variable.
    The shell uses these variables to define what we can carry out operations, save
    certain types of information etc. We can see all the ones that are declared using
    the same export command. With set and unset we can also handle other attributes
    of the command interpreter.


    Some of these variables and attributes that the bash has by default, are:


    +   * PWD: current directory.

    * BASH VERSION: bash version that we are using.

    * RANDOM: generates a different random number every time we display its content.

    * SECONDS: number of seconds that have passed since we opened the shell.

    * HOSTNAME: system name.

    * OSTYPE: type of operating system that we are using.

    * MACHYPE: computer architecture.

    * HOME: user''s home directory.

    * HISTFILESIZE: size of the history file (number of commands that are saved).

    * HISTCMD: number of the current command in the history.

    * HISTFILE: file where the command is saved (in general, .bash_history handling
    the user''s home directory).


    By handling these variables we can customise the commands interpreter much more
    adapting it better to our tastes and needs.


    > We can see all the aliases defined from the same alias command.


    ```

    echo command

    ```


    With echo $VariableName we can see the content of these variables and their attributes.'
