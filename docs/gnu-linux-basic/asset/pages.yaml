    It is very interesting to have a Grub diskette, using the command line interface,
    we can try to start up the different operating systems installed in the computer
    directly, so as perform to debug the contents of the /boot/menu.lst file. As an
    example, the procedure that has to follow in order to boot up a Microsoft™ system
    installed as a (hd0,0) is explained here and we will discuss the commands necessary
    to boot up a GNU/Linux system installed as (hd1,0):


    For a Microsoft system:


    ```

    grub> rootnoverify(hd0,0) grub> makeactivegrub chainloader +1 grub> boot

    ```


    For a GNU/Linux system:


    ```

    grub> kernel (hd1,0)/vmlinuz root=/dev/hdcl1 boot

    ```


    Once we have the definitive bootloader that we wish to implement in our diskette,
    all have to transfer this same configuration to the MBR of the booting hard disk;
    using the same command line of the diskette as we should key in:


    ```

