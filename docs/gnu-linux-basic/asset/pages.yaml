    # 9.3. The package system


    We will now analyse and learn how to use Debian''s package system, which is probably
    the most solid and reliable of those existing in the world of GNU.


    In the following subsections we will learn how to configure its database, how
    to use it, install different packages, update them each. There are many different
    ways of achieving the same result. Explained here, with two main objectives: the
    first is for readers to be able to choose which one they want to use, and the
    second is for readers to always know more than one solution to the problem, in
    case any of these methods does not.


    # Activity


    9.1 For a comprehensive understanding of how Debian''s package system works, we
    recommend:


    +   * APT HOWTO: http://www.debian.org/doc/manuals/apt-howto/index.html

    * http://www.debian.org/doc/manuals/debian-faq/ch-pkg basics.en.html

    * http://www.debian.org/doc/manuals/debian-faq/ch-pkgtools.en.html

    * The man of: apt, apt-cache, apt-get, sources.list, dpkg and dselect.


    In order to make reading easier, we could wait until we have configured the printer
    and learn to print the man.


    # 9.3.1. /etc/apt/sources.list


    The file /etc/apt/sources.list is the core of Debian''s package system configuration.
    It is a text file, like most configuration files in UNIX-type systems, we can
    edit it manually or using some of the tools that are for this purpose. The content
    of this file will depend on a large extent on the speed of our Internet connection,
    supposing we have a connection. However, we should never forget to run the following
    command as the root, once we have modified the file:


    ```

    brau:/etc/apt# apt-get update

    ```


    If we neglected to do this, and therefore, none of the changes that we had made
    would have any effect. In an installation where the packages are obtained remotely,
    this command must be run regularly, so that the database is kept updated; for
    this reason, it is not a bad idea to include it in the cron system.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Each line of this file refers to a source of packages and the packages are
    separated by a space. Firstly, we must specify whether the source is binary packages
    deb or if it is source code deb-src. The second field is used to specify how these
    packages are accessed: CD-ROMs, http, ftp followed by the address. The remaining
    fields refer to the type of packages that we wish to access using this line.


    In the ideal case, we should have a fast Internet connection. This would probably
    allow us to carry out the installation of the basic system using the Internet,
    as well us with the latest versions of the packages. In addition, it is the most
    comfortable way of working with the packages, as we do not even have to worry
    about inserting the correct CD in order to carry out the installation.


    However, what we must do, before doing anything else, is to ensure that the content
    of /apt/sources.list is correct. For example:


    ```

    deb http://ftp2.de.debian.org/debian/debian/ stable main non-free contrib deb-src

    http://ftp2.de.debian.org/debian/debian/ stable main non-free \ contrib deb

    http://non-us.debian.org/debian/non-US stable/non-US main \ contrib non-free deb-src

    http://non-us.debian.org/debian/non-US stable/non-US \ contrib non-free deb

    http://security.debian.org/updates main contrib-freefree

    ```


    All the addresses given above are official; in other words, they are recognised
    by Debian. Apart from these sources, we can use unofficial packages; just because
    they are unofficial does not mean that their quality is not good enough to include
    them in our configuration file. A good address where information on the location
    of these packages can be found is http://www.aptget.org.


    Once we have edited and saved the file, we should run the apt-get update command;
    after a few minutes, which the package system will configure its database and
    display the accesses performed on the screen, we should have access to the new
    packages.


    If we do not have an Internet connection or the one that is too slow, we shouldn''t
    hesitate to use the set of CDs/DVDs of the distribution to install the different
    packages. If we have not inserted the CDs or DVDs during the installation process
    up to this point, now is the time to do so. We should insert the first CD-ROM/DVD
    in the reader and use the apt-cdrom add command to include its contents in the
    database:


    ```

    brau:/etc/apt# apt-cdrom add Using CD-ROM mount point /CD-ROM/ . . . Repeat this

    ```'
