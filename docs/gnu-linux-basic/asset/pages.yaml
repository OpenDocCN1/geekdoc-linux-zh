    application will itself detect which of the packages is the most recent or which
    would take the least time to download and then download it from the corresponding
    source. In addition, we can use the `netselect` program to configure the whole
    download system in more detail.


    Another very interesting option that most distributions is of updating the packages
    in which any vulnerability or bug has been discovered. With Debian, all we have
    to do is add the following line in the `/etc/apt/sources.list` list:'
