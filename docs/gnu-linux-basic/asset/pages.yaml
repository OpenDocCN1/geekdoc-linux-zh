    # 9.7. Device configuration


    Having addressed the basics of package administration, we can cover the task of
    starting to configure the system so as to tailor to our specific needs. The process
    basically consists of two parts: configuring the different hardware devices we
    have installed in the computer, and installing the software that we will use.


    Configuring the system''s hardware is usually the part that requires the most
    effort, in general, because each computer will have different devices and therefore
    each computer can be a world unto itself. Generally, in GNU/Linux systems, we
    can configure any device, however unusual it is, although this will be more or
    less complicated depending on how standardised the devices are. However, it is
    also true that these are processes during which we can learn the most, as, configuring
    a device requires previous tasks, such as finding exactly what type of device
    we have, reading the documentation on these types of devices included in GNU/Linux
