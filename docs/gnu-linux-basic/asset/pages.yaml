    Now we have a basic system installed on our computer. Now begin the task of tailoring
    the system to our requirements. Reaching this point, it is very important to distinguish
    between two types of systems: development systems and production systems.


    A development system is designed for experimentation, where tests and experiments
    are carried out, and stability and efficiency are not primordial. However, a system
    designed to acquire knowledge about the system itself is designed for production.
    Therefore, we need to make sure that it contains solely and exclusively the strictly
    required packages, since having unnecessary packages installed will be detrimental
    for the system''s efficiency. The strategy is to be applied before mounting a
    production system (a web server, applications server etc.) always includes working
    first on a development system, where different tactics can be realized and tested
    so that we can draw conclusions before mounting the production system.


    Our first system will obviously be a development system, because we have not conceived
    it to a particular need, and because it is our first experience of mounting a
    system, for the main purpose of acquiring knowledge. We will install and uninstall
    various packages, test different configurations etc., and of course this will
    seriously affect the system''s stability and efficiency. Hence, we encourage students
    once they have completed this section and have a global idea of how a system involves,
    to reinstall the entire system again starting from scratch, to adapt it strictly
    to their own requirements.'
