    we should find out exactly which product we need (this information should generally
    be much more precise than that usually provided by the suppliers of the hardware
    themselves, sometimes, they do not have), whether it is fully supported, what
    information we will need to integrate the new product in our system ec. In general,
    when purchasing new hardware, the things that should be considered are the degree
