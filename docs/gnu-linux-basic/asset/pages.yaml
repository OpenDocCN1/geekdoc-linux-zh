  md: '# 10. X-Window architecture


    # 10.1. What is X-Window?


    X-Window is an architecture of windows designed in the mid-1980s to provide a
    graphical environment in workstations. Unlike other environments, the X-Window
    architecture was designed to be independent of the platform, so that it could
    be installed in any computer that worked on a UNIX-type system. Although the X-Window
    architecture has an extensive history in which different types of licenses, various
    implementations and many different teams of developers have been involved, it
    is currently as, mainly, the implementation developed by the X.Org. project. X.Org
    is an implementation of open code of the Windows System that arose as a fork of
