  md: 'CUPS (Common Unix Printing Protocol) is a modular printing system that uses
    IPP (Internet Printing Protocol) to handle the queues. This is a modern and sophisticated
    system, which can be used in a desktop environment such as GNOME or KDE. Furthermore,
    it comes with the option of maintaining the lpr traditional system of BSD command
    lines.


    The general topology of a printing system in GNU/Linux is that of client-server.
    The server, CUPS, is a daemon-type server and we will therefore treat it as such.
    The server’s configuration file is /etc/cups/cupsd.conf. In this file, we will
    be able to configure as many printers as wish.


    To install the cups system, we must run the command:


    ```

    # apt-get install cupsys cupsys-client cupsys-bsd printerconf fomatic-filters-ppds

    ```


    This last package contains the PDFs (Postscript Printer Definitions) of Adobe,
    which is used by CUPS to define the printers.


    CUPS-PDF is a virtual printer for printing documents to a PDF file. To install
    it in our system, we will run the command:


    ```

    # apt-get install cupsys-pdf

    ```


    In CUPS, there are two ways of configuring the printers. One of these is from
    the utility provided by the GNOME or KDE desktop. The other is from the website
    . In both cases, we need administrator privileges in order to configure the printers.


    # Printing text files


    Formatters are programs that are used, mainly, to transcribe files in text format
    to Postscript format (Postscript language, historically, has been more widely
    implemented in the field of printing). These programs can be very useful, as they
    allow us to print the help commands, configuration files etc. on paper, so that
    they are easy to read. One of these programs is mpage (within the package with
    the same name), or another would be enscript (also packaged with the same name),
    this is more powerful than the first one.. A few lines are given below an example
    of how we would use it:


    ```

    man man | mpage -2 -o lpr

    ```


    Using this line, we redirect the output of the man to mpage, which formats it
    so there are two columns per sheet, without margins, and we redirect its output
    to the printer client lpr:'
