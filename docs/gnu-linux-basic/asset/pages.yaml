  md: '# Evolution of this book


    The FTA has reused existing course materials from the Universitat Oberta de Catalunya
    and that had been developed together with LibreSoft staff from Universidad Rey
    Juan Carlos. In 2008 this book was translated into English, with the help of the
    SELF (Science, Education and Learning in Freedom) Project, supported by the European
    Commission''s Sixth Framework Programme. In 2009, this material has been improved
    by the Free Technology Academy. Additionally the FTA has developed a study guide
    and learning activities which are available for learners enrolled the FTA Campus.


    # Participation


    Users of FTA learning materials are encouraged to provide feedback and make suggestions
    for improvement. A specific space for this feedback is set up on the FTA website.
    These inputs will be taken into account for next versions. Moreover, the FTA welcomes
    anyone to use and distribute this material as well as to make new versions and
    translations.


    See for specific and updated information about the book, including translations
    and other formats: http://ftaacademy.org/materials/fsm/. For more information
    and enrolment in the FTA online course programme, please visit the Academy''s
    website: http://ftaacademy.org/


    I sincerely hope this course book helps you in your personal learning process
    and helps you to help others in theirs. I look forward to see you in the free
    knowledge and free technology movements!


    Happy learning!


    Wouter Tebbens

    President of the Free Knowledge Institute

    Director of the Free technology Academy'
