    # 4.1. Introduction


    In this section we will look at the essential steps followed in GNU/Linux installation
    processes. Although each distribution has its own installation environment, all
    of them share basic steps. In this section we will look at these steps and explain
    the concepts we need to carry them out successfully. It is important before we
    install a new operating system that we are suitably familiar with the main components
    that we have installed on our computer so that we can configure everything properly,
    even if the distribution we use includes hardware detection.


    It is possible that we may have two totally independent operating systems stalled
    on one hard disk. Although the process of installing another operating system
    on the same disk (or on another disk installed on the same computer) should not
    interfere with the other'' partitions, it is advisable to make backup copies of
    all our documents. Despite the fact that if we follow all the steps we describe
    correctly it is practically impossible to lose information, caution is always
    advisable and so making backups of important files.


    # Preparation to install Linux


    Before starting the installation process it is convenient to know the brand and
    model of the graphic and sound card we have installed; the network card; the type
    and characteristics of the monitor, as well as any other hardware that we have.
    Generally, for the motherboard, the CPU and the RAM, we do not need to know their
    characteristics. To obtain this information, we can study the manuals given when
    we purchased the computer, or if we have another operating system installed, use
    it for this purpose (on "Windows") systems we can obtain this data from the control
    panel.


    # 4.2. Booting


    In general, GNU/Linux distributions provide some type of means for booting the
    installation process. Currently, it is possible to provide a start-up CD or DVD
    or if our computer does not have the corresponding reader or if we wish to do
    a remote installation, a start-up disk is provided.


    The first step of the process tends to selecting the type of installation we wish
    to carry out. In general, this choice is given in order to identify the type of
    user installing the system, providing accordingly or less information and allowing
    the user to configure the system in more detail or not. If we have sufficient
    knowledge, it is advisable to do the installation in expert mode (or similar)
