  md: 'it is packaged it will cover all its levels and everything it contains. To
    create a new file, we need to pass the c parameter, and if we want to save it
    in a file, we need to pass the f parameter. tar cf final.tar o* package all the
    files in the current directory that start with an "o". If we also want to compress
    them, tar czf which would use the gzip program after packaging them. To depack
    a particular file, the parameter we need is x, so we should type xf the indicated
    file. If it is compressed, we will have to pass zxf.


    Although we can use tar to compress files, the application is not designed primarily
    for compression. As we have mentioned, for compression we use external programs
    like gzip. The gzip program uses its own compression format different from the
    popular zip, which we can also use by installing the corresponding application.
    Another fairly common compression application gives very good results is bzip2.
    In the following table, we can see the extension that is normally used to identify
