  md: '# 8. Installation of applications


    # 8.1. Introduction


    Managing and handling the packages is an essential aspect of GNU/Linux distribution.
    A package is one or various programs, libraries or software components that are
    bundled into one single file, which is prepared to be installed and integrated
    in the operating system. When designing any distribution, it is very important
    to provide the tools that are necessary for installing and managing the packages
    properly. Tools should also be provided, especially for software development,
    so that new applications can be created. These packages usually include the program''s
    executables and its dependencies and conflicts with other applications. When a
    package is installed, the dependencies indicate whether other programs are needed
    for the application to work properly, whereas the conflicts tell about any incompatibilities
    between the installed programs and the ones we want to install. The package systems
    are designed so that new applications can be installed easily, as some libraries
    are used by more than one program and it would not make sense to have the applications
    that use them again.


    Most distributions use one of the two package formats that are most widely used
    in the GNU/Linux world: deb or rpm. On one hand, the deb packages are those that
    the Debian GNU/Linux uses in its distribution, whereas rpm (RedHat Package Manager)
    is native to RedHat. The distributions based on one of these generally adopt the
    corresponding package system, although most distributions have also adopted one
    of the systems, as the great majority of the programs are packaged using these
    formats. On the other hand, the programs with a GPL license or similar, are also
    usually distributed with their source code (packaged and compressed with some
    standard format, such as tar). We can also install the program in our operating
    system using this source code, by compiling and placing the executables in the
    corresponding location.


    In this section, we will look at how the package system of the distribution is
    organised by the large amount of tools that are provided and the flexibility of
    its configuration. In the last subsection, we will learn how to install a program
    using its source code, as in some cases we might find out the program that we
    need is not packaged. This installation method was the one that was always used
    before the first packaging systems appeared, which were created to make the whole
    process easier.


    > Debian GNU/Linux was the first distribution to create a package system.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# 8.2. Debian packaging system


    The applications that use to manipulate the Debian GNU/Linux packaging system
    are basically one of two types: apt (Advanced Packaging Tool) and dpkg programs
    (Debian Package). The apt set of applications is used to figure out where the
    packages are and resolves any dependencies and conflicts with others. The dpkg
    programs can be used to install packages, configure them, find out which ones
    have been installed. There are other applications, such as dselect or aptitude,
    which can be used to manipulate the apt and dpkg programs, providing, in one single
    environment, interactive tools. The following diagram shows the schema:


    Figure 8.1


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_154_0.png)


    The programs that, in the last instance, install the applications are the dpkg
    programs. These decompress the .deb file and install the program. The apt applications
    help us locate the latest versions of the programs that we need, copy the files
    from the sources from where we have extracted them (FTP, CD-ROMs, Internet etc.)
    to the disk and check for any dependencies and conflicts between the old and new
    packages so that they can be installed properly. The main apt applications are
    the following:


    +   - apt-config: this application is used to configure some of the apt options
    (the architecture of our system, the directory where we save the files, etc).

    - apt-setup: this application is used to configure the sources of the packages
    (from where we obtain them).'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   - apt-cache: management of the packages cache (directory where the .deb
    files are saved before they are installed).


    +   - apt-cdrom: application for managing the CD-ROMs that contain packages.


    +   - apt-get: updating, installing or downloading the packages.


    The whole configuration of apt is located in `/etc/apt/` directory. The `/etc/apt/sources.list`
    file is where the configuration of the sources (origins) of the packages is saved.
    From these sources, a list of the available packages is generated, which we can
    consult and install when we want to. Generally, format of it uses the following
    syntax:


    ```

    ```

    http://site.http.org/debian distribution section1 section2 section3 deb-src

    http://site.http.org/debian distribution section1 section2 section3

    ```

    ```


    # dpkg programs


    Although the `apt` applications can also be used to install packages, the only
    thing that they call is the programs called `dpkg`.


    The first field in each line indicates the type of file that we are referring
    to: binaries (deb) or source code (deb-src). Next, we will find the source of
    the packages, which may be a CD-ROM, an Internet address etc. The distribution
    field tells `apt` which version of Debian GNU/Linux we are using. This field is
    important because each version of the distribution has its own packages. We can
    use the last fields to specify what types of packages we wish to use.


    | Packages from the source code |

    | The systems of packages also make it possible to create packages with the source
    code of the applications. If we all want to use the application, it is necessary
    to download the source code packages |


