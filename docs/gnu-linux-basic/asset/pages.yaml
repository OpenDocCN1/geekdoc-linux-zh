- img_proc: true
  md: 'it will help us to structure the partition in accordance with our needs. If
    we already have a swap partition, even if it is from another system, we will not
    have to create a new one for this installation, as we can use the existing one,
    because only volatile-type information is stored on swap partitions.


    We will then see a screen with the proposed layout for the partition:


    Figure C.4


    ![](img/bab8edb8b5bb81ee32451895afe1f8ae_230_0.png)


