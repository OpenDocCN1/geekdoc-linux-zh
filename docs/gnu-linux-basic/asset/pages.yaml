- img_proc: true
  md: '# Actions performed on the packages


    Using the dpkg or dselect flags, we will obtain information on what the user intends
    to do with those packages.


    +   - unknown. No reference has ever been made to the package in question.


    +   - install. The package has to be installed or updated.


    +   - remove. The package is going to be uninstalled, but without deleting its
    configuration files (which are usually located in /etc/).


    +   - purge. The package will be completely uninstalled, and the configuration
    files deleted.


    +   - hold. This is used to indicate that no operation should be performed on
    this package (in other words, its version and configuration should be maintained
    until such an operation is explicitly commanded)


    # Status of the package installation


    Within the package system, we will find:


    +   - installed. The package has been installed and configured correctly.


    +   - half-installed. The installation of the package began, but for some reason,
    it was not completed.


    +   - not-installed. The package has not been installed in the system.


    +   - unpacked. The package has been unpacked, but not configured.


    +   - config-files. Only the configuration files of the package exist in the system.


    # apt-cache


    As we mentioned, apt-cache is a command used to analyse the package system and,
    therefore, as it is not potentially dangerous for the system, all users can access
    it. The parameters that are most used for this command are as follows:


    +   - search pattern. This searches the database for the packages whose name contains
    pattern or packages that contain the word pattern in their description (if the
    result is a very long list, given that patterns are very common, we can use pipes
    and grep'
  merge: -1
  pgno: 167
- img_proc: true
  md: '+   - show package. Provides information on the package.


    +   - policy package. Provides information on the installation status, the version
    and revision number of the package, as well as its origin.


    +   - depends package. It lists the package''s dependencies.


    +   - show package. It shows the direct and reverse dependencies of the package.


    # apt-get


    apt-get is the command used to manage the system''s packages. This is why it can
    only be used by the system''s root user. The parameters that are most used for
    this command are as follows:


    +   - install package. This installs the package. If this depends on packages
    that are not found on the system, apt will report to us and ask if we want to
    install the packages that we want to install depends on and that are not installed,
    at the same time; generally, it is our interest to provide the advice by apt.


    +   - update. This updates the apt database. This must run every time the file
    is modified. /etc/apt/sources.list.


    +   - upgrade package. Forces the upgrading of the packages installed to the latest
    version.


    +   - remove package. This deletes the package, without deleting the configuration
    files, in case any reinstallations need to be performed.


    +   - remove --purge package. This completely deletes the package, including the
    corresponding configuration files.


    +   - clean. This eliminates the expired copies of the packages that have been
    gradually installed; during the process, a copy of the unpacked package is saved
    automatically in /var/cache/apt/archives whenever a package is installed. This
    is a very useful command for probably, freeing up space on the hard drive occupied
    by files that, most, will never be used again.


    +   - autoclean. This eliminates all the unpackaged copies of the packages, regardless
    of the expiry date.'
