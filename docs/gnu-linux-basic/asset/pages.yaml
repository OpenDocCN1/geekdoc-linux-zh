    are: CD-ROM or DVD-ROM, minimum CD-ROM or network installation. If we can master
    the first and the last, the second is irrelevant. Therefore, we will start by
    installing our first system set of DVD-ROMs and, once finished, we will analyse
    the differences between this process and the network installation.


    For the first time in Debian GNU/Linux, multi-architecture CDs and DVDs are provided
    that allow multiple architectures to be installed from a single.


    #  5.2.1. Debian Etch flavours


    Debian GNU/Linux 4.0 or Debian Etch supports twelve architectures and some variations
    of each architecture known as flavours (different pre-compiled kernels designed
    to support different types of hardware).


    For example, Debian GNU/Linux 4.0 for Intel x86 architecture comes by default
    with version 2.6.18 of the kernel. For more information, you can consult the document
    containing the installation instructions for the Debian GNU/Linux 4.0 system (key
    name "etch"), for the Intel x86 architecture. Also, it contains links to other
    sources of information, in addition to information on how to make the most of
    your new Debian system.'
