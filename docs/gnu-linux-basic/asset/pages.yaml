    # 5.1.1. Installation systems


    The installation is understood to mean the resources or devices used to install
    the operating system. Currently, all the distributions provide different possibilities
    for carrying it out, but essentially we can年纪 between two installation systems:
    CD-ROM/DVD-ROM or Internet. Also, in general, it is possible to combine different
    systems.


    Debian offers various types of installation:


    +   Using a set of CD-ROMs or DVD-ROMs that use debian-installer. This set of
    CD-ROMs/DVD-ROMs contain all the Debian packages, meaning we can carry out a full
    installation without connecting to a network. We can download Debian using bittorrent
    (which is the recommended method now), jigdo or HTTP/FTP.


    +   Using a CD-ROM. There are two network installation images for CD-ROM (''netinst'')
    that we design to use Etch with the debian-installer. These images are designed
    so that you can boot from the CD and install the additional packages you wish
    from the Net, have the name ''netinst''. The difference between the two images
    is the full netinst image contains the installer and the base system, the "visitor''s
    card" is small and does not contain the base system, meaning it has to download
    from the Net. You can obtain a full CD image that does not need a connection to
    the Net to complete the installation. To do this you will just to use the first
    CD of the set of Debian CDs.


    +   Through the boot disk (boot.img), when you boots, it will ask you to insert
    a disk (root.img). If you are going to carry out the network installation, you
    will need to insert floppy/net-drivers.img, since it contains additional controllers
    for many Ethernet network cards, and also includes support for PCMCIA. In the
    case of carrying out the installation from CD-ROM, and not being able to boot
    from it, boot first from a disk and use the floppy/cd-drivers.img as controllers
    disk to complete the installation using the CD-ROM.


    +   Using the memory device. The easiest way of preparing your USB memory device
    is by downloading hd-media/boot.img and using gunzip to extract the image. Next,
    mount the memory device (it will have a FAT file system) and finally, download
    an image of the Debian "netinst" CD and copy this file onto the memory device
    (it should be .iso).'
