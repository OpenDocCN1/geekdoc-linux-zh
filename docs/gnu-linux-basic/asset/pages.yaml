  md: 'To install new packages, we could use the -i parameter followed by the name
    of the file. If there are problems with the dependencies, we can ignore them with
    --ignoredependends=X, where the X indicates the dependency, although we must be
    careful with why we use this parameter because we ignore dependencies the installed
    package might not work properly. If we want to decompress the .deb file to see
    what it contains, we could also use -x. In order to delete the packages, we must
    enter -r, followed by the name of the package, which would delete them from the
    system, but saves the configuration files (we can use -P to delete everything).


    Another very interesting parameter is --force-things X (where X is one of the
    following options), which can help us if any of the following situations arise:


    +   - auto-select: this automatically selects the packages that must be installed
    or uninstalled with the new package that we choose.

    - downgrade: this installs the package even if there are more recent versions
    of it.

    - remove-essential: although this package is considered essential for the system,
    this will delete it.

    - depends: this does not take the dependencies into account, but considers them
    as alerts.

    - depends-version: this does not take any of the dependencies of the version of
    packages into account.

    - conflicts: this installs the package, even if it is in conflict with any other
    package in the system.

    - etc.


    Although all the programs that we have discussed in this subsection have many
    options and there are many more programs, the ones we have described should be
    enough (with the package system of the distribution that we are using) to carry
    out any task that is necessary. Although we have already mentioned that programs
    as deselect and aptitude can be used to carry out the basic installation and deletion
    procedures on the packages, it is important to learn about other commands properly
    because they can be very useful for performing specific operations or automating
    the selection and installation processes.


    > The dpkg utility

    With dpkg, we can also use templates to select, install, delete etc. the packages
