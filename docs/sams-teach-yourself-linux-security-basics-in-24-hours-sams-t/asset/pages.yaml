- img_proc: true
  md: '# Recovering from Attacks


    If you are unable to get a response, it is time to call /usr/sbin/traceroute,
    supplying the guilty IP number as an argument (in this case, 24.13.131.162). A
    list of hops will be printed out, many of them with domain names. At the bottom
    of your list is the IP address in question. Move up the line one at a time, mailing
    to abuse@ each domain until someone says he will look into the abuse or until
    you reach your own domain. Include a copy of the traceroute output and extract
    the date and time of the attack with each message.


    In all likelihood, the cracker involved will get booted from his current ISP and
    simply move to another one, free to craft another day. However, at least you caused
    the cracker some inconvenience. On the other hand, you may actually help to catch
    a major criminal instead of a mere script kiddie. At the very least, you will
    be helping to protect others upstream of the cracker''s IP from legal trouble.


    # Getting Back Online


    Once you''ve determined where your system''s weakness was (if possible), made
    a full backup copy of the compromised system for archival purposes, and contacted
    the authorities about the abuse (if possible), you''re ready to begin bringing
    your system back online again.


    # Reformat and Reinstall


    It''s inconvenient to reformat and reinstall, but it''s necessary to ensure that
    no compromised binaries remain on your system. If possible, it may be best to
    do a low-level or controller-run format of the drive, to eliminate any shenanigans
    that may have gone on the drive''s boot sector or partition table. Don''t think
    of it as a last system, think of it as a chance to upgrade your operating system
    or clean out all of those old scattered files that have been laying around for
    two or three years.


    Once the drive has been blanked and repartitioned for use, install Linux from
    a canonical source, such as your original CD. If you have an archive of additions
    and modifications, such as a /usr/local/src archive on MO disk, reinstall those
    cleanly as well.


    # Restore Important Data


    Now you can go restoring your important data. If possible, restore from a tape
    or backup media that was written before the compromise took place. If you must,
    retrieve only user data files from the most recent tape date of the compromised
    system.


    If you need to reinstall binaries and configuration files as well, do so from
    the early backup, not the archival backup of the compromised system, and avoid
    overwriting any


