  md: '# Preserving Data


    Consider the following:


    ```

    mt -f /dev/st0 eod; tar -cf /dev/st0 /home

    ```


    This simple command spaces the end of existing data and writes a new tar archive
    to the tape using the contents of the /home directory. Assuming your DAT drive
    holds 12 gigabytes uncompressed and your /home tree is about 2 gigabytes, you
    could use this command as a weekly CRON job and have switch tapes every month
    or so.


    If you need nightly backups and can enable DAT compression, you may find that
    you can replace the tape once every Monday morning, automatically keeping a week’s
    worth of backups going all the time.


    # Rotating Backups


    Under ideal circumstances, when your month (or your week) of scheduled backups
    is, you will simply eject the tape, label it with the week (or month) and file
    it away safely, never to be written to again. It will then always be on file should
    you need data it.


    If you absolutely reuse tape media, don’t use the same tape over and over again.
    Keep at least three or four media units on that; way, on Monday you won’t eliminate
    your only existing backups when you begin writing to the start of the tape again.


    When you’re finished with the first tape at the end of the week, insert tape two.
    At the end of that week, insert tape three. After the third week do you reinser
    the first tape again. That way, you’ll always have yesterday’s backup and last
    Friday’s backup as well.


    Tape changers can be especially useful in this regard. For example, assume for
    a moment you are using a six-tape changer and that you can afford to fill all
    slots with media. Consider the extremely simple script shown in Listing 23.1,
    which takes advantage of the date command and the built-in math capabilities of
    bash.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_362_0.png)


    # Listing 23.1 Simple Rotating Changer Script


    ```

    #!/bin/bash

    ```


    ```

    # This line sets the SLOT variable to contain the remainder

    # of the current week number (0–52) of the year divided by

    # the number of slots in the changer (6).

    SLOT=$(date +%U)%6

    ```


    ```

    # This line makes sure that no tape is already loaded

    mtx -f /dev/changer unload

    ```


    ```

    # This line loads the correct tape for this week

    ```'
