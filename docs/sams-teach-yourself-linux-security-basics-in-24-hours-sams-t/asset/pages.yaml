    | /tmp | 500MB | No SUID/SGID, no execute. |

    | /usr | 2000MB | No SUID/SGID. Any remaining trees found in root (/) that require
    capability will be made here, and a symlink will be created in root so that root
    can be mounted-only if desired. |

    | /home | varies | No SUID/SGID, no execute. This is the most secure route; workstation
    users may choose to change the noexec for convenience. |


    The methods for implementing special treatments for each file system will be discussed
    later in this hour.


    The size values given may need to be adjusted to better fit your needs. If you
    will be installing a lot of third-party application software or large commercial
    libraries of media (such as clip art), you may want to increase the size of the
    /usr partition. Note that personal user files (documents) are generally stored
    on the /home partition in /home/user.


    # Step 3: Install and Enable only the Essentials


    In the old days of Linux, installing the operating system was a definite pain.
    This was largely because there weren'' many distribution choices, so many users
    were forced to assemble their own Linux, and the distributions that did exist,
    such as Slack Linux or Debian GNU/Linux forced a user to choose which packages
    to install, one by one.'
