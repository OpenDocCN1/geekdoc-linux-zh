  md: 'A go back through the instructions and double-check everything to make sure
    you''ve followed all the steps. Did you use kdb5_util to create a database for
    your realm? Did you remember to use the -s option to stash the key? Did you remember
    to use ktadd to add admin/admin and kadmin/changpw to the kdb5.keytab file before
    trying to start kindmind? As a last resort, start kr5kdc or kindmind with trace;
    this should give you some indication of the reason for the failure.


    Q I installed Kerberos on one or more hosts, and now telnet, ftp, login, and some
    other protocol is not working. What happened?


    A You must be running the special Kerberos-enabled clients in order to connect
    systems requiring Kerberos authentication. Be sure that you''re calling the protocol
    from /usr/local/kerberos/bin directory and not the binaries from /usr/bin instead.


    Q Is there a way to make other protocols and use Kerberos?


    A Absolutely. Many Linux software packages support Kerberos, usually either with
    configuration files or (worst) recompile supplying a Kerberos-oriented option.
    For example, SSH version 2 (discussed in Hour 16, “Encrypting Data Streams”) can
    be compiled for Kerberos authentication support with an option to the configure
    command before compiling.


    Unfortunately, there''s no standard way to turn on Kerberos support for every
    program out. Your best bet is RTFM (Read The Friendly Manual) in each case for
    information on Kerberos support.


    Q Isn''t the single, central KDC a vulnerability?


    A Yes. This is why it''s important to secure your KDC as much as possible, run
    no additional services on it all, ensure that your hardware is in good condition,
    and make frequent backups of the KDC''s hard drive.


    There is also a provision for secondary KDC systems to act as backups when needed.
    This functionality is discussed in more detail in the Kerberos documentation.


    # New Terms


    eBones An alternative implementation of the Kerberos protocol for use outside
    the U.S. to circumvent export restrictions placed on the MIT Kerberos code by
    the U.S. government.


    Kerberized Enjoying the state of being Kerberos-enabled. A Kerberized system or
    service is capable of handling Kerberos authentication.


    key distribution center (KDC) The system responsible for maintaining information
    about all primaries in a Kerberos realm and for handling authentication exchanges.'
