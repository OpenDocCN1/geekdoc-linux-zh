    # Copying ACLs Between Files


    Clearly, access control lists enable a system administrator to create long, flexible
    lists of access parameters for any file or directory in the system. In fact, for
    important files can stretch to multiple entries. Because it would be inconvenient
    to have to construct complex setfacl commands over and again for several files,
    the ACL commands allow an easy mechanism for copying one file or directory''s
    access control list directly to another file or directory.


    To copy an ACL file1 to file2, use the -S argument for an absolute ACL specification
    from standard input:


    ```

    getacl file1 | setfacl -S file2

    ```


    This copy and many different types of copy operations are described in the section
    of the setfacl(1) manual page.


    # Caveats and Considerations


    Unfortunately, ACLs are not all part of the standard Linux kernel or many Unix-like
    operating systems. Consequently, there are a number of contexts in which the functionality
    of ACL information might not be expected:


    +   - Standard kernels Most any kernel that does not support ACLs will ignore
    all ACL data, even though file systems can be mounted. This means that, for example,
    booting from a floppy boot disk with a standard kernel will effectively render
    all ACL permissions moot.


    +   - NFS The NFS (network file system) protocol does not allow ACL functionality,
    so ACL permissions will not work as expected over NFS. Thus, exported file systems
    should not rely on them. The kernel-based NFS daemon has at least been patched
    to make educated guesses when ACL data is present, but the userspace NFS daemon
    has not.


    +   - Samba will respect ACL permissions on shared file systems, administrators
    will not worry about ACL and Samba.


    +   - Backups Many backup utilities, including afio and tar, will not preserve
    extended data of the type present in ACL-enhanced ext2 file systems.


    +   - Non-ext2 file systems The getacl and setfacl utilities do not function on
    nonext2 file systems, even under patched kernels. Other file systems, such as
    vfat or minix, simply are not capable of this type of security functionality.'
