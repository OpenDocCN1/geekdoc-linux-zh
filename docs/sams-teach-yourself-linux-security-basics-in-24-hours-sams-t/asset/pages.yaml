    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_337_0.png)


    Updated(2.1.1)


    # Impact


    The web server contains an application that may have a vulnerability. The vulnerability
    is present, an unauthorized user could read files, change files, or execute commands
    on the server.


    # Background


    The Hyper Text Transfer Protocol (HTTP) allows a client to access HTML pages,
    and other web applications using a web browser. HTTP servers contain programs
    which perform functions on the server at the request of the client (when a term
    is supplied, for example), and translate results to the client''s browser in the
    form of an HTML page.


    # The Problems


    Various programs may be installed with certain Web servers are vulnerable to exploitation.
    These include:


    ```

    plush/access/passwd.php

    pwd is a utility which comes with Red Hat for administering the Linux Virtual
    Server. It comes with a default backdoor which could allow unauthorized access
    to the Graphical User Interface (GUI). By exploiting vulnerabilities in the tools
    that come with the GUI, an attacker who knows the backdoor could execute arbitrary
    commands. Any server that has permis-root set, which is the default for Red Hat,
    is vulnerable.

    ```


    # Starting Alert with SWATCH


    SWATCH is a very simple tool written in Perl that performs a very simple task:
    it watches whichever log tells you to, searching for log activity you''ve described.
    When such log activity appears, SWATCH takes whatever action you have ordered.
    Because SWATCH can execute any command in response to a specific kind of log activity,
    it is incredibly flexible. You can even have it page you on your beeper or send
    you a fax if you have those installed on your system.


    Our SWATCH treatment will be fairly short and sweet. It''ll be up to you to configure
    SWATCH to suit your needs and circumstances and to perform the types of actions
    you need to perform in response to log activity.


    # Downloading and Installing SWATCH


    The SWATCH utility can be downloaded from its fairly Spartan home page, located
    at http://www.stanford.edu/~at/swatch/. It''s available only as a .tar representing
    the current version.


    Once you have downloaded SWATCH, extract it, visit the directory created during
    extraction to hold the source, and run the Makefile.PL script using the Perl interpreter.
    Note that you will need to have Perl 5.0 or later installed; earlier versions
    will not work.


    ```

    $ tar -xf swatch.tar

    $ cd swatch-3.0.1

    $ perl Makefile.PL

    ... [ Output of perl ] ...

    ```'
