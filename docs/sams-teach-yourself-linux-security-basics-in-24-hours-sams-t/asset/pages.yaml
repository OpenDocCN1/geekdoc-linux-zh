  md: 'Many users at this point think to themselves, “nobody but me has access to
    this machine!” Unfortunately, this is not always the case, especially in the small
    business setting. The list of individuals who have access to your equipment may
    include any of the following:


    +   - Landlords, property management personnel, or anyone else involved in the
    owner-ship or management of your business location.


    +   - Cleaning, maintenance, or janitorial personnel hired by you or hired by
    building management or ownership.


    +   - Service workers, repairmen, and other individuals who are brought in on
    a limited or one-time basis to make repairs or to solve problems.


    +   - Delivery personnel, vending machine operators, or supply runners who have
    given a door key for early-hour or after-hours work.


    +   - Any other employees or family members who have a key to the area either
    for after-hours work or because they live there.


    > Unfortunately, there is one last group of individuals you must also consider:
    any friends, acquaintances, or family members of those individuals already listed—especially
    those who regularly accompany those individuals on their rounds or to work.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_69_0.png)


    As you can see, this list can quickly grow to involve individuals you may not
    have considered in relation to your computing equipment. If you find that your
    list is very large or that some of the individuals in question can''t be fully
    trusted with your data or your equipment, stronger security measures are called
    for.


    Keep this list up-to-date at all times. Be vigilant, or you may come to the office
    one day to find that your equipment is no longer working.


    # Summary


    This hour, you''ve learned to consider the physical environment as an integral
    part of a holistic approach to Linux security. The basic steps are to be


    +   - Lock away all systems in isolation when possible.


    +   - Prevent power cycle issues by disabling reset and power buttons, securing
    the power cable, and installing battery backups.'
