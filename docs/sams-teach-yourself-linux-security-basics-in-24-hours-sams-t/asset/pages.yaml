  md: '# Preserving Data


    This hour, you''ll learn some of the basics of making timely backups under Linux.
    You''ll learn about tar and appropriate and be given a brief overview of some
    of the more popular commercial backup solutions for Linux systems.


    When you''re done, you should have enough information to make timely and complete
    backups and to protect them well.


    # Data Backups and Security


    What do system backups have to do with Linux security? Everything. Backups and
    security are intimately related because of the potential effect that an intruder
    or malicious user can have on the data stored in your system(s).


    The information presented thus far in this book has been designed to help you
    ward off potential threats—to protect your system from crackers, sniffers, sk
    kiddies and thieves. However, it is almost inevitable that at some point, no matter
    how vigilant you are, at least part of your system will be compromised. This is
    simply the nature of a networked world. Just as crime in the real world will eventually
    touch every citizen in some way, crime in the data world will eventually touch
    every citizen in some way.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_354_0.png)'
  merge: -1
