  md: '# Auditing and Monitoring


    SWATCH also needs a number of additional Perl modules to run. Many Linux operating
    systems install these modules or at least make them available as part of a Perl
    module kit package.

    If SWATCH is unable to find these modules, it will ask if you would like to contact
    www.cpan.org or one of its mirrors automatically and install the modules. This
    will work, but you will first need to interrupt the process, enter to become the
    superuser, and then restart the process again so that the modules can be correctly
    installed.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_338_0.png)


    After SWATCH has been built, you can install it with a simple make followed by
    a install; this will install both the main Perl script and the manual page.


    ```

    $ make

    ...[ Output of make ]...

    $ su

    Password:

    # make install

    ...[ Output of make install ]...

    #

    ```


    Assuming that you have a working Perl installation and that all of the required
    Perl modules were also installed correctly, you now have a working SWATCH installation.


    # Using SWATCH to Watch Logs


    Use of the swatch command is simple. Though there are a number of arguments documented
    in swatch(1), the basic form of operation

    swatch -c logfile -tail logfile


    The **logfile** is the path to one of your system logs. This can be a log maintained
    by syslog or it can be some other kind of log altogether; SWATCH doesn’t care.
    The SWATCH program is willing to watch any text file and treat it as an active
    log.


    The **logfile** is a short, simple file describing a series of text strings SWATCH
    is to look for in the file and the actions SWATCH should take each time any of
    these strings is matched.


    # The Match File Format


    The match file is a text file that begins with a watchful keyword followed by
    a regular expression indicating a pattern or series of patterns with which SWATCH
    is to be concerned. The following is an example:

    watchfor /ROOT LOGIN|uid=0/


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_338_1.png)'
  merge: -1
