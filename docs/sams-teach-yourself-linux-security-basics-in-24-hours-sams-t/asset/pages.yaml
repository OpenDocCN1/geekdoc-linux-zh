- img_proc: true
  md: '(whichever script your system uses to start syslogd) and add the necessary
    options.

    Then, restart the daemon so that the changes are in effect now well:


    ```

    # /etc/rc.d/init.d/syslog restart

    ```


    If you need more help with the files in /etc/rc.d/init.d, refer to Hour 4, "The
    Boot

    Process."


    # Starting named in the Chroot Jail


    We''re all ready for a chrooted dry run. If a named is already running and your

    new named would be listening on the same port, stop the old named before continuing

    with the correct init script. Some distributions use /etc/rc.d/init.d/dns, others
    use

    /etc/rc.d/init.d/named, and there are other variations as well. Use the one that
    is cor-

    rect for your distribution:


    ```

    # /etc/rc.d/init.d/named stop

    ```


    All systems are now go. It''s time to test the new named. The t command-line argu-

    allows us to specify the location of the chroot jail. The -u and -g options allow

    to specify the user and group under which this instance of named should run:


    ```

    # /usr/local/named/usr/sbin/named -t /usr/local/named -u named -g named

    ```


    If all goes well, your named would function as it did before, only now if it is
    com-

    romised by a cracker, it''s a dead end for further intrusion. To make the change
    perma-

    entough, you''ll also need to edit your /etc/rc.d.init.d/named (or synonymous)

    script to reflect the new command-line arguments with which named must be started.


    # Summary


    Here we learned how to make the domain service provided by BIND a bit

    more secure than it is in most default Linux installations. We did this with a
    three-

    pronged approach:


    +   - First, we make sure to configure package filtering to prevent connections
    to the

    domain port from systems we don''t have any legitimate business with.


    +   - Next, we implement good access control defaults in the named.conf file,
    paying

    special attention to disallowing zone transfers to strangers.


    +   - Finally, we alter the standard named installation so that the daemon now
    runs in a

    root jail, preventing crackers from further compromising the system if they man-

    age to break in through named.'
