  md: '# Hour 13: Network Security: DNS with BIND


    +   38. Strong packet filtering rules have been put in place to drop packets from
    hosts this nameserver doesn''t serve.


    +   39. BIND version information has been made unavailable.

    (/etc/named.conf)


    +   40. Zone transfers and recursive queries have been disabled.

    (/etc/named.conf)


    +   41. BIND has been placed in a chroot jail.


    # Hour 14: Network Security: NFS and Samba


    +   42. The userspace NFS daemon, if present, has been replaced with the kernel-based
    NFS service to enhance ACL compatibility.


    +   43. The list of exported file systems has been audited, and unnecessary exports
    or unnecessary hosts have been removed or disallowed, respectively.

    (/etc/exports)


    +   44. SWAT has been installed, and an audit of the security paradigm and other-settings
    have been completed.


    # Hour 15: Securing X11R6 Access


    +   45. The host-level access controls have been completely disabled so that no
    host is allowed to connect solely on basis of its claimed identity.

    (/etc/Xn.hosts)


    +   46. Magic cookie access control has been put in place, most likely using XDM.


    # Hour 16: Encrypting Data Streams


    +   47. SSH has been installed for stream encryption capability.


    +   48. Traditional services that can be replaced by SSH (telnet, login, rsh,
    and so) have been disabled.

    (/etc/inetd.conf)


