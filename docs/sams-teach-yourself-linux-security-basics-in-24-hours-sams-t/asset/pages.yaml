  md: '# Security and the Apache HTTPD Server


    The Apache Web server is one of the most famous pieces of open source software,
    and with good reason: It is fast, stable, and extremely secure out of the box.
    Therefore, most distributions’ Apache installations require few modifications.
    Rather than spend time recompiling and reinstalling Apache and creating configuration
    files from scratch, it is more efficient simply to cover a few basic security-oriented
    concepts to keep in mind when configuring Apache.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_197_0.png)


    As is the case with all software, different versions of Apache have different
    capabilities. For the purposes of this text, we''re going to assume that you''ll
    be using Apache 1.3.x, currently the most widely used version of Apache in the
    Linux community.


    As we browse through the configuration file, try to follow along. Many of the
    configuration items we''ll discuss might be present in your default configuration
    file. It is important that you find existing items and modify them rather than
    simply adding new ones without checking because, in some cases, the effects of
    multiple identical configuration items might be cumulative.


    # Global Basic Security-Related Directives


    The httpd.conf file is the central configuration file for most Apache installations.
    Different distributions store the file in different locations, but if you have
    installed Apache packages, you can find the httpd.conf file on your system with
    a simple command:


    Within this file is a series of directives within scoping (context-oriented) boundaries
    that are used to control the behavior of nearly every aspect of the HTTP server.
    An in-depth description of all possible directives in this file is beyond the
    scope of this text, but details can be found in the official Apache documentation
    at http://httpd.apache.


    A few global directives in the file are very important for the basic security
    of httpd.conf and Apache. The recommended settings shown here are a good starting
    point for most:


    ```

    ResourceConfig /dev/null

    AccessConfig /dev/null

    ```'
