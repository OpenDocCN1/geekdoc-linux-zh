    # HOUR 22


    # Detecting Attacks in Progress


    This hour, you''ll learn to use a program called Snort to monitor all traffic
    on your network actively and in real time to discover and report malicious packets
    as they are in transit. Though too resource-intensiveintensive very small installations
    (one or two machines), medium-size networks can certainly benefit from such monitoring.


    You''ll also learn about a quick-and-dirty tool for formatting and tabulating
    Snort''s alert output to make it more readable for administrators with a limited
    amount of free time.


    # What Is Snort?


    In the simplest sense, Snort is simply a packet sniffing tool, designed to grab
    packets as they travel across a network, so that they can be used for one purpose
    or another. The strength of Snort, however, and what makes it so popular among
    system administrators, is its capability to search through this network traffic
    and make decisions based on rule-matching with respect to the sniffed packets.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'Since the Snort user community is continually compiling rulesets about various
    classes of attacks that have occurred on some network somewhere, every Snort user
    has the benefit of thousands of man-hours of experience when he downloads one
    of the public rulesets from the Snort community.


    Using Snort, all of these attacks can be logged in, and if the system administrator
    is vigilant, stopped. More details can be found on the Snort home page at http://www.snort.org.


    # # Special Snort Requirements


    Because Snort is a very intrusive tool with respect to the network on which it
    is running, there are some very specific guidelines that most users will want
    to adhere when deciding whether or not to run Snort.


    It is generally a good idea to run Snort only when you dedicate an entire machine
    on your network to it. There are two reasons for this. First of all, Snort''s
    rule-matching capability is not without overhead; it takes resources to compare
    high-speed network traffic to a large set of attack signatures continuously. A
    dedicated machine is therefore the best candidate for Snort operation. Second,
    Snort''s packet-sniffing core capability places any network interface it listens
    on into promiscuous mode, so in the interest of isolating an interface to the
    greatest degree possible, it should be run on a separate host.


    Snort is best suited to operation on an internal network protected by a firewall.
    There''s a lot of network traffic out there as a general rule, and the number
    of false positives (innocent matches happen to be attacks) that you''ll receive
    with an external Snort machine makes for a large time investment. It simply isn''t
    practical for anyone on a small network to dedicate as much time or energy to
    Snort as would be required when watching packets outside a firewall.


    If your network is very small—for example, if you can afford a firewall or a Snort
    sniffer but not both—buy the firewall and pass on the Snort box. A firewall is
    a much more essential defensive measure.


    Also notable is the fact that Snort is most helpful on mixed networks, those that
    contain both Linux and Windows machines. This is because Snort can catch many
    types of attacks or compromises that many desktop versions of Windows can''t defend
    against even detect.


    # # Downloading and Installing Snort


    The process of downloading, compiling, and installing Snort involves several components,
    and not all of it is straightforward. You''ll need to be comfortable installing
    a few files by hand on the machine where Snort will be installed.'
