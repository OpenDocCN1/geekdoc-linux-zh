    # chmod Terms


    chmod The program used to alter or set file permissions.


    device A special file in the /dev directory that usually refers either to a device
    or a low-level service.


    group The group of accounts associated with a given file.


    other users All user accounts that are not the user owner and do not belong to
    the file’s group. Other common terms include “anonymous” users and “world” users,
    as in “this file is world read/write” or similar phrases.


    permissions Flags that grant or deny various types of access to a given file,
    depending on who the file’s owner is and which group is associated with the file.


    SGID An executable flag that indicates that the process of the program in question
    will always associated with the same group associated with the program’s binary
    file.


    SUID An executable flag that indicates that the process of the program in question
    will always owned by the owner of the program’s binary file.


    umask A numeric flag (in a format similar to the chmod flag) that determines the
    permissions given to new files created from within the shell.


    user The user who owns a given file. Only users logged in to this account can
    alter permissions for the file.'
