    # New Terms


    +   BIOS Also known as the Basic Input/Output System, this is the program that
    controls your system will boot.


    +   boot order The list of devices, in order, that your BIOS will search for an
    operating system at power-on.


    +   flash memory A type of memory commonly used to hold BIOS programs for various
    types of hardware. Leaving flash memory enabled can be risky because it means
    that a malicious user can perform damage to expensive components of your system.


    +   IDE An abbreviation for Integrated Drive Electronics. IDE-type hard drives
    are inexpensive and are the most common type of storage device on PCs. IDE is
    also commonly referred to ATA.


    +   ISA An acronym for Industry Standard Architecture, an old expansion system
    used by nearly 386 and 486 computer systems. VESA, a 32-bit local extension to
    ISA, is also found on 486 computer systems, but is rarely found on Pentium or
    later systems.


    +   jumper A small piece of plastic containing a copper clip, used to connect
    two jumpers on a board in order to change some aspect of the board''s behavior.


    +   motherboard Also commonly referred to as a motherboard, the motherboard is
    the main circuit board in a PC computer. The motherboard contains the CPU (for
    example, a 486 or Pentium chip), bus (such as PCI or ISA), the BIOS, and all hardware
    related to basic input and output.


    +   PCI An abbreviation for Peripheral Component Interconnect, a modern expansion
    system used by many 486 and all later PC systems.


    +   POST Power-On Self Test, the series of memory and device tests performed by
    the BIOS when a PC system is switched on.


    +   SCSI An acronym for Small Computer Systems Interface, a high-performance parallel
    communications interface for storage devices, scanners, printers, and other computing
    devices. SCSI devices are most common on server systems.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_60_0.png)'
