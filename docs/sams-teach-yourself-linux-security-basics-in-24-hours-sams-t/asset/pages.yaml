    # # m4 and sendmail.cf Configuration Notes


    Though m4 configuration of Sendmail is beyond the scope of this book, there is
    one

    security-oriented directive that you should consider adding to your sendmail.m4
    if

    y plan to rebuild sendmail.cf using m4. This directive is


    ```

    define(''confPRIVACY_FLAGS'', ''authwarnings,goaway'')dnl

    ```


    This directive adds two privacy flags, authwarnings and goaway, to your Sendmail
    con-

    figuration. The authwarnings flag causes X-Authentication-Warning: headers to

    appear in messages in which Sendmail configuration or communication oddities have

    been. The goaway flag causes Sendmail to reject all requests for information

    about your Sendmail server that could potentially be used to harm.


    If you don''t plan to reconfigure with m4, you can edit /etc/sendmail.cf file

    directly for the same effect. Search for the line beginning


    PrivacyOptions


    If it is commented out, uncomment it. Change the line to read


    PrivacyOptions=authwarnings,goaway


    This change will have the same effect as making the m4 change above and then

    regenerating the sendmail.cf file.


    # # Summary


    This hour, we covered basic security techniques for the three most common network
    ser-

    vices that interact with the outside world: Web service (HTTP), File Transfer

    Protocol (FTP), and Simple Mail Transfer Protocol (SMTP).'
