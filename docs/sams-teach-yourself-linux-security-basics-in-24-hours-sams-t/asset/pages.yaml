  md: '# File Ownership


    Each file must be owned by exactly one user and exactly one group. To see evidence
    of this, use the ls -1 command to get a directory listing. A sample directory
    listing is shown in Listing 7.1.


    # Listing 7.1 Sample Output of the ls -1 Command


    | total | | | | | |

    |---|---|---|---|---|---||

    | drwxr-xr-- | 2 | root | | 1024 Nov 8 14:04 | junk |

    | -rw-r--r-- | 1 | lenny users | 29065 Nov 1 15:52 | fiona.jpg |

    | -rw-r--r-- | 1 | jeff jeff | 156058 Jul 25 23:09 | lpg28539.pdf |

    | drwxr-xr-x | 1 | root uoccp | | 32 Nov 8 13:31 | temp-script |


    In this listing, there are three files: fiona.jpg, lpg28539.pdf, and temp-file.
    Their ownership can be described as follows:


    +   - The directory junk is owned by the superuser, root, and belongs to the super
    group as well.

    - The file fiona.jpg is owned by the user called lenny and the group called users.

    - The file lpg28539.pdf is owned by the user called jeff, who also has his user-private
    group, which owns the file, called jeff.

    - The file temp-script is owned by the superuser, root, and belongs to the group
    called uucp.


    Any user listed in the /etc/passwd file can be the owner of a file, also known
    as the file’s user. Similarly, any group listed in the /etc/group file can be
    the group owner of a file, also known simply as the file’s group. What exactly
    does user and group ownership mean for security?


    # Access Rights


    Take another look at Listing 7.1. You may notice that each file’s directory entry
    begins with a series of symbols that looks something like this:


    ```

    -rw-r--r--

