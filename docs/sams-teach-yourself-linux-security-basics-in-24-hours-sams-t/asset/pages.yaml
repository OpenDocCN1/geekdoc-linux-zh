  md: '# Introduction to Kerberos


    Because Kerberos is a time-sensitive system, it is important that clocks on the
    KDC and various client and server machines on your network all be perfectly synchronized.
    The easiest way to do this is via the network time protocol (NTP) used by many
    Linux distributions.


    # Getting a Ticket


    "ticket" in Kerberos is just what it sounds like—a small piece of identification,
    supplied by the KDC, that will essentially "admit" you to a Kerberos-enabled service
    or host. To obtain a ticket, you must have a principal account in the KDC''s database;
    you then use the kinit command to request a ticket from the KDC.


    For example, recall that a few moments ago, jake (an administrator) was kind enough
    to add a principal user account for lucy to the KDC''s database. lucy can now
    get her ticket like this:


    ```

    lucy@somehost.myn.net: kinit lucy

    Password for lucy@MYNET:

    lucy@somehost.mynet.net

    ```


    After her password has been entered, lucy''s ticket has been obtained. To list
    the tickets lucy has in her ticket cache, she uses the klist command:


    | Valid starting | Expires | Service principal |

    | --- | --- | --- |

    | 01/11/01 14:22:25 | 01/11/01 00:22:20 | krbtgt/MYNET.NET@MYNET |


    ```

    Kerberos 4 ticket cache: /tmp/tkt100

    klist: You have no tickets cached

    luc@somehost.myn.net

    ```


    I am now ready to connect to another Kerberos-enabled host using any "Kerberized"
    protocol. For example, ftp:


    ```

    lucy@somehost.myn.net ftp ftp anotherhost

    Connected to anotherhost.myn.net.

    220 anotherhost.myn.net FTP server (Version 5.60) ready.

    334 Using authentication type GSSAPI, ADAT must follow

    GSSAPI accepted as authentication type

    GSSAPI authentication succeeded

    Name (anotherhost:lucy).

    232 GSSAPI lucy@MYNET.net is authorized as lucy

    Remote system is using

    Unix mode to transfer files.

    ftp>

    ```'
