  md: 'properties on many systems. If you won''t be using ppd as a normal user (or
    at all) or are willing to use su to run traceroute, you can easily disable the
    SUID/SGID property on these binaries. The same holds true for a large number of
    binaries you''ll locate.


    # Checking for Anomalous SUID/SGID Instances


    As a matter of course, you should check often for “unexplained occurrences” of
    SUID or SGID permissions. The easiest way to do this is to maintain a list of
    all known SUID/SGID binaries on your system. Once you have settled on which binaries
    are to have SUID/SGID and which aren''t you''ve adjusted permissions accordingly,
    write this list to a file that is readonly only by root in /etc:


    ```

    # find -perm +6000 > /etc/splist

    # chmod g-rw /etc/splist

    ```


    Then, create a cron job or script that will run routinely checks the system for
    new SUID/SGID binaries and immediately notifies root or other active user when
    such binaries turn up. One sample script fragment is shown in Listing 7.2.


    # 7.2 Sample SUID/SGID Script Check Fragment


    ```

    for BINFILE in $(find -perm +6000 -follow); do

    if [ $(grep $BINFILE /etc/splist) != "" ]; then

    echocho $BINFILE | mail -s "New SUID/SGID!" root

    done

    ```


    This script simply searches for any SUID/SGID binaries and compares the newly
    generated list to the old one kept in /etc/splist. If any new binaries have turned
    up, it sends a warning message to the root account''s email box containing the
    path to the offending file.


    # Keep SUID/SGID Binaries Current


