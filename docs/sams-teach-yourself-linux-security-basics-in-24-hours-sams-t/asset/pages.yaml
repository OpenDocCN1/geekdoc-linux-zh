    # Table 10.1 continued


    | Option | Description |

    | --- | --- |

    | CONFIG_IP_MASQUERADE | Optional (recommended); needed if you plan to forward
    packets seamlessly between a private internal network and the public Internet
    at large. In short, enables Linux to act as a router |

    | CONFIG_IP_MASQUERADE_ICMP | Optional (recommended); when used in conjunction
    with masquerading, ICMP packets to be masqueraded as well—important for network
    performance and notification issues |

    | CONFIG_IP_ALWAYS_DEFRAG | Optional (highly recommended); prevents certain kind
    of attacks when using masquerading. Invisibly enabled behind the scenes in 2.2
    kernels |

    | CONFIG_IP_ADVANCED_ROUTER | Recommended; if not enabled, none of the advanced
    router options will be available |

    | CONFIG_IP_ROUTE_VERBOSE | Recommended; causes extra logging about suspicious
    packets to take place, helping to notify administrators of possible attack attempts
    |

    | CONFIG_IP_TRANSPARENT_PROXY | Optional; enables ipchains to transparently redirect
    local network traffic destined for a remote host to a local port for |


    For all other options, try to respect the canonical defaults, which are reasonably
    conservative. Don''t enable anything that is normally disabled unless you are
    certain that you need the related functionality and have read documentation on
    how to correctly administer it.


    > Some readers might plan to use additional packet types, such as IPX or AppleTalk,
    with the same hardware that will be passing TCP/IP packets. Be very aware that
    ipchains rules apply only to TCP/IP; no matter how protective and closed your
    ipchains rules are, they cannot prevent attacks over IPX or AppleTalk running
    on the same interface.

    If you plan to run AppleTalk or IPX on a machine that will also be connected to
    the outside (Internet) world via TCP/IP, it is suggested that you install two
    ethernet cards. One will connect to the outside world and will handle these via
    ipchains. The other will be for the internal network only and will handle these
    additional packet types.


    After a new kernel has been compiled, installed, and verified as functioning correctly,
    you''re ready to proceed with ipchains'' rule configuration.


