  md: '# HOUR 3


    # Physical Security


    This hour we will finish securing aspects of your computer that lie outside the
    direct influence of Linux, focusing on what is called physical security. Physical
    security refers to aspects of computer security that have to do with the physical
    placement of the machine itself, the machine''s operating environment, and the
    degree to which the machine is protected from hardware-level compromise.


    # Why Is Physical Security Important?


    Physical security is important because a physical attack is perhaps the most fundamental
    kind of attack. The types of actions we''re referring to when we speak of physical
    attacks can include things such as the following:


    +   * Simply hitting the reset switch or power button

    * Using a floppy drive or CD-ROM drive on a machine that does not support good
    BIOS security

    * Damage to or theft of important machine components, especially those that store
    data

    * Theft of an entire machine'
