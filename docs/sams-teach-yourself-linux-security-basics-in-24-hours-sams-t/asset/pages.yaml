    \nThis scenario allows for automatic rebooting while maintaining security by preventing\
    \ unauthorized passing of kernel arguments.\n\n# The prompt and timeout Keywords\n\
    \nOne more security issue needs to be addressed in a discussion of LILO boot loader.\
    \ The prompt and timeout keywords give the system administrator the ability to\
