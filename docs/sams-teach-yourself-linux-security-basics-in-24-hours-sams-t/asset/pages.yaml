  md: '# 272 Hour 17


    The same ticket is valid for all Kerberos-enabled services. A new ticket is not
    needed for each connection (the same one will do), though a ticket will need to
    be “refreshed” every few hours it will expire for security reasons.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_289_0.png)


    The new Kerberos-enabled protocols require new Kerberos-enabled clients. New ftp,
    telnet, login, rsh, and other clients are found in the /usr/kerberos/bin directory,
    and these should be used instead of the originals (which will no longer work with
    the Kerberos-enabled hosts).


    You may want to disable the original binaries for ftp, telnet, and so forth by
    doing a chmod a-x to them. Failure to do this can result in extreme user confusion!


    Note that also the new binaries in the Kerberos installation are backward-compatible
    with non-Kerberized systems, so the telnet in /usr/local/kerberos/bin will work
    with systems both inside and outside your network, while the original one in /usr/bin
    will now work only with hosts


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_289_1.png)


    There is a minor bug in the telnet client included with Kerberos 5 that causes
    it to fail on some Linux systems unless the -l or -x option is supplied. The -l
    simply simplifies the user’s account on the remote system:


    ```

    telnet anotherhost -1 lucy

    -x option enables data stream encryption and is described in the "Encrypting Data
    Streams" section, later in this hour.

    ```


    # Destroying a Ticket


    Every Kerberos ticket will eventually expire, but if a ticket will no longer be
    used, it is a good idea from a security perspective to destroy it that there is
    no chance at all that any malicious use can occur. Ticket destruction is performed
    with the chmod command, which destroys all active tickets:


    ```

    lucy@somehost.myn.net$ kdestroy

    lucy@somehost.myn.net$ klist

    klist: No credentials cache file found

    lucy@somehost.myn.net$

    ```


    Tickets will also expire automatically when a user logs out completely, meaning
    that a ticket will never be left over after its user has gone.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Introduction to Kerberos


    # Changing Your Password


    Any principal can change his password using the kpasswd utility.


    ```

    lucy@somehost.mynet.net$ kpasswd lucy

    Password for lucy@MYNET.NET:

    Enter new password:

    ter it again:

    Password changed.

    lucy@somehost.mynet.net$

    ```


    Since Kerberos passwords are stored centrally on the KDC, any new password will
    be effective on any host in the realm, not just on the host in which it entered.
    It is also important to understand that the Kerberos password has no relationship
    to the login password over any host.


    # Encrypting Data Streams


    Most of the client replacements included with Kerberos 5, including telnet, rlogin,
    rsh, and ftp, include built-in encryption options that will make them even more
    secure. To encrypt a session completely, use the -x argument:


    ```

    lucy@somehost.mynet.net$ login -x anotherhost

    This login session is using DES encryption for all data transmissions.

    Last login: Fri Jan 12 14:46:53 from somehost

    lucy@anotherhost.mynet.net$

    ```


    Though Kerberos documentation warns about slowdowns due to encryption, this warning
    doesn''t really apply to modern PC hardware running Linux, on which the encryption
    algorithm requires only a fraction of the CPU''s time.


    # Summary


    In this hour, you learned to compile and install Kerberos 5 in order to configure
    a KDC for your local realm. You also learned Kerberos administration tasks, such
    as adding administrator, additional host, and user principals to your realm''s
    KDC database.


    Finally, you learned the basics of working with Kerberos once it is installed,
    including how to obtain and subsequently destroy a ticket, how to change a Kerberos
    password, and how to encrypt the data streams of standard protocol clients included
    with Kerberos 5.


