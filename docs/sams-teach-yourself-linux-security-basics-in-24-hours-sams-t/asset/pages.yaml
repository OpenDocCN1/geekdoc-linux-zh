  md: '# HOUR 16


    # # Encrypting Data Streams


    This hour, you''ll learn to encrypt data streams of most kinds for increased security
    during transport. You''ll also learn to increase the authentication security of
    many types of protocols on your network.


    Two major software packages are regularly used with Linux to encrypt data streams
    and provide this increased authentication security. The first is SSH, the Secure
    Shell. The second, OpenSSH, is an open source implementation of the SSH protocol
    created by the OpenBSD project to address concerns with the commercial nature
    of the original SSH, which is free only for non-commercial use.


    In this hour, we''ll discuss installation and use of both SSH version 2.4.0 and
    OpenSSH 2.3.0p1. Both are available for download from their respective Internet
    sites.


    # ## What Do SSH and OpenSSH Do?


    In the simplest sense, the ssh2 utility, which forms the core of the SSH package,
    is a replacement for the rsh utility. The rsh utility allows Linux commands to
    be executed on remote systems, with the capability to pipe'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'standard input, standard output, or standard error path between systems over
    the network. The ssh2 command has one important advantage over rsh: with ssh2,
    all input, output, and other data involved in remote execution can be encrypted.


    The SSH package has two additional important capabilities, however. First, SSH
    can authenticate the systems on both ends of a connection much more securely,
    using any one of several methods, reducing the chance that data will be stolen
    from your nose.


    Second, SSH can “tunnel” other common network protocols through its encrypted
    connection, providing them with the same benefit.


    A traditional unencrypted data stream can be a security risk; on the network theoretically
    can intercept and use information in unencrypted form. This applies to encrypted
    data of all kinds, from e-mail to file transfer via FTP to remote X11R6 sessions.
    A packet belonging to an encrypted data stream on the other hand is exceedingly
    difficult to use if intercepted, because the intercepting party must have enough
    information to decrypt it. Data encryption of network communications is thus a
    good idea, especially if one of the machines involved in communication is not
    behind a dedicated firewall.


    The SSH package enables encryption to take place transparently for most protocols.
    As a result, compatibility is excellent, with protocols like the X11R6 data stream,
    provided that SSH capability is present on both ends of the connection.


    An additional SSH benefit is the capability to improve network speeds in some
    cases by compressing a data stream using gzip-based compression after it has been
    encrypted. This is especially helpful with slower modem, ISDN, or low-end DSL
    connections, where every last bit of bandwidth is valuable.


    # # Installing, Configuring, and Using SSH


    The original SSH suite is owned and maintained by SSH Communications Security
    Corporation, which can be found on the World Web at http://www.ssh.com. Though
    the source code is freely available for download, SSH cannot properly be called
    open source software, and the free download applies only to noncommercial users
    or a short trial period for commercial users, after which SSH must be purchased.


    # ## Downloading and Installing SSH


    The download page for SSH is located at http://www.ssh.com/products/ssh/download.html;
    U.S. users may download SSH from any of the following mirrors:


    ```

    ftp://ftp.cis.fed.gov/pub/ssh/

    ftp://ftp.iodynamics.com/pub/mirror/

    ```'
