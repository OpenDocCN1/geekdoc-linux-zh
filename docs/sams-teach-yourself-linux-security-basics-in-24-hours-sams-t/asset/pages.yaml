  md: 'Only a file or directory’s user can change its access permissions, even if
    the file is writable by everyone or the directory in which the file resides is
    writable by everyone. Of course, the superuser, root, is the exception here: root
    can set permissions for any file or directory in the system, regardless of ownership
    or existing permissions.


    # Permission Examples


    While these rules are often confusing at first, in practice they are actually
    quite simple to understand. The best way to learn about them is to study examples.
    Let''s step through the entries in Listing 7.1 again, by one by one.


    ```

    drwrxr-xr-- 2 root      root      1024 Nov 8 14:04 junk

    ```


    Because the character in the first position for junk is a d, we know that junk
    is a directory. The permissions in positions 2–4 are rwx, meaning that the user
    root will have permission to list all of the files in junk, to create new files
    or delete existing files in junk, or to make junk its current working directory.


    The permissions in positions 5–7 are also rwx, meaning that the group root will
    have identical access concerning the directory junk—to list the directory, create
    new files or delete old ones, and to make junk their current working directory.


    The permissions in positions 8–10, are only r--, meaning that users who are not
    root and do not belong to the group root will have permission only to list the
    directory. These users will not have the ability to create or delete files in
    junk, to run executable programs in junk, or to make junk their current working
    directory.


    Let’s look at another entry or two from Listing 7.1:


    ```

    -rw-r--r-- 1 lenny    users      29865 Nov 1 15:52 fiona.jpg

    ```


    In this case, the first position is a dash (-), meaning that the file fiona.jpg
    is a normal file without special properties. The file is readable by the user
    lenny, members of the group users, and (because there is an r in position 8) by
    anyone general. The file is writable by the user lenny. The file is owned by the
    group users, but because there is no w in position 6, members of users will not
    be able to write to fiona.jpg. Finally, fiona.jpg is not executable by anyone
    at all.


    One last case from Listing 7.1:


    ```

    -rwxr-xr-x 1 root      uucp      32 Nov 8 13:31 temp-script

    ```


    The file temp-script is also a regular file. It is readable, writable and executable
    by the root. Members of the group that owns the file, uucp, can read the file
    and execute it, but they cannot write to it. All other users can also read from
    and execute temp-script cannot write to it.'
