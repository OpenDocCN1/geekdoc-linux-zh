    By far the easiest way to go read-only is to add a script to your init.d folder
    like the one shown in Listing 7.3.


    # Listing 7.3 /etc/rc.d/init.d/read-only


    ```

    #!/bin/bash


    # The purpose of this script is to remount the root

    # file system as read-only toward the end of the boot

    # process.


    case $S1" in

    start)

    echo "preparing to go read-only on /; will sleep for"

    echo "twenty seconds to allow everything to settle down."


    sleep 20


    echo -n "here we go..."


    mount -n -o remount,ro /

    echo "done."

    ;;


    stop)

    echo "Remounting / as read-write."

    mount -n -o remount,rw /

    echo "done."

    ;;


    *)

    echo "use $1 start|stop"

    exit 1


    esac


    exit 0


