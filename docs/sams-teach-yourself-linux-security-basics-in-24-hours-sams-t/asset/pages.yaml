  md: '# TCP/IP Network Security


    A Unfortunately, not really. Though a small set of services are common across
    all TCP/IP-enabled systems, there are many, many services that can appear in /etc/inetd.conf
    and /etc/services, having been added and being used by various applications. It
    is folly to track down and document them all. Instead, simply know in certain
    terms what you want to offer to the outside world and offer only that.


    Q I changed my File Transfer Protocol server''s port from 21 to something else,
    and now I can''t connect to the system with nctfp, even when I specify the correct
    port.


    A Some early or beta versions of nctfp version 3 that shipped with Linux distributions
    always tried to connect to the default port, whether or not another port was specified
    explicitly. Use either the traditional ftp client or upgrade to a newer version
    of nctfp.


    Q The “paranoid” policy for /etc/hosts.deny seems just that—paranoid. Isn’t it
    unnecessarily strict?


    A In a word, no. You should always know exactly who and who shouldn’t be able
    to connect to the system for each service you offer. If a service should be offered
    to everyone, it’s easy to add one line for that service with an ALL wildcard to
    /etc/hosts.allow. Note that there may be some compile-time references to the PARANOID
    word in the hosts.deny files of various distributions. See the hosts_access(5)
    manual page for details.


    # New Terms


    inetd The Internet daemon. This daemon is responsible for managing most of the
    incoming network requests on a Linux system and for starting the specific individual
    servers to handle such requests.


    paranoia The cardinal virtue in the world of network security. A basic philosophy
    of paranoia means that you deny first and making exceptional allowances on a case-by-case
    basis rather than allowing first and making exceptional refunds on a case-by-case
    basis.


    security by obscurity A weak type of security that tries to employ the ignorance
    and incompetence of a would-be attacker in your defense. It is never as useful
    as a primary means of security, but it can be helpful in a holistic, “every-little-bit-counts”
    approach.


    syslogd The system logger. This daemon is responsible for accepting log entries
    from various types of Linux software or services and routing these log entries
    to various files, as specified in the /etc/syslog.conf file.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_114_0.png)'
