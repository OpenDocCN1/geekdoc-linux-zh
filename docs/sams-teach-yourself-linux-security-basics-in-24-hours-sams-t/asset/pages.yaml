    One important exception we want to create is for machines on the local network.

    Assuming that your local network is built using the 192.168.1 subnet (so that
    all

    machine in your network have an address like 192.168.1.N), you would add the follow-

    ing rule to your /etc/hosts.allow file to allow any host on the local network
    to connect

    to any service currently managed by inetd:


    ```

    ALL : 192.168.1.

    ```


    This line will match any system whose reported IP number is in the 192.168.1 subnet.

    Now, you also wanted to grant this kind of general-purpose access to a single

