    # Using GPG: Nuts and Bolts


    So far, there''s been a lot of discussion about keys and key exchanges. Now we
    finally begin to get into the actual day-to-day use of GPG for sending and receiving
    data.


    There are two kinds of exchanges that are routinely made with GPG: signed data
    and encrypted data. In the first case, the sender uses a private key and the receiver
    a public key. In the second case, the opposite is true.


    # Signatures for Data


    Data signatures are created for data you''re sending out. A signature is generated
    using your private key; any receiver this data who has your public key and trusts
    it can use it to validate the integrity of the data you sent. It can then be that
    the information being received comes straight from you and hasn''t been tampered
    with.


    The simplest way to sign a piece of data is to use the ASCII-ready --clearsign
    command to produce a nice, human-readable signature suitable for sending via-email.


    ```

    $ gpg --clearsign message.txt

    ```


