  md: '# TCP/IP Network Security


    # LISTING 6.5 continued


    ```

    # Allow talk and ftp from any identifiable source

    in.talkd in.ftpd : ALL EXCEPT UNKNOWN


    # Allow telnet from one specific host

    in.telnetd : wks9.xyz.com

    ```


    With your paranoid /etc/hosts.deny in place and your small list of exceptions,
    your inet daemon and all services it manages are much better protected than they
    were before.


    # More TCP Wrappers Tricks


    There is one more important trick that can be performed with TCP wrappers: the
    optional execution of a shell command when a rule is triggered. Though the possibilities
    are limitless, we''re going to make only one simple change to the /etc/hosts.deny
    file to aid in maintaining a secure system.


    Recall the /etc/hosts.deny file we constructed was very simple and contained the
    following line:


    +   ALL : ALL


    Wouldn''t it be nice to add a shell command to this rule that caused a log entry
    to be made each time the rule was triggered? That way, we could see in the log
    when unauthorized connection attempts were made. The amended line is a little
    more complex and looks like this:


    ```

    ALL : ALL : ( /bin/echo \

    $$(date +%b %d %Y:%H:%M:%S) %H TCPW: %d \ \

    >> /var/log/secure)

    ```


    The command should be spread across multiple lines using the backslash (\) and
    then enclosed in parentheses to ensure a clean shell. The net effect of the line
    is to cause an entry like this to echo to the /var/log/secure file when the rule
    is triggered:


    ```

    Oct 25 00:14:23 myhost TCPW: intelnetd

    ```


    This log entry would indicate that on October 25 at nearly a quarter past midnight,
    someone attempted to connect via Telnet and the connection was denied.


    You have noticed that the format given to the command in date is slightly off.
    Specifically, each format string in date is marked by two percent symbols (%%)
    rather than a single percent symbol (%). This is done intentionally; /usr/bin/tcpd
    contains a number of format strings of one (such as %h for server hostname and


