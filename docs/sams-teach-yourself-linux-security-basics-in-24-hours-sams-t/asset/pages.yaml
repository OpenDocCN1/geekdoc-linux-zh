  md: '# Log Elsewhere


    If you''re on a local area network, it is ideal that you maintain logs across
    systems as well. For example, if you have two hosts—pokey (a desktop machine)
    and webftp (the server)—consider duplicating webftp’s log entries on pokey. To
    continue our example, you might also choose to add the following two lines to
    your /etc/syslog.conf file:


    ```

    *.* @pokey

    auth.*;authpriv.*;*.emerg @pokey

    ```


    This way, you''ll have duplicate logs, and if webftp gets compromised and its
    logs are erased, you can still inspect them on pokey and find out what happened.


    Of course, you''ll have to instruct pokey to accept log entries from webftp. To
    do this, you''ll have to edit the init.d/syslog script on pokey so that it calls
    syslog with the -r option, instructing it to accept messages from other systems.


    # Summary


    In this chapter, you learned about the two pillars of TCP/IP security: the inetd
    daemon and the TCP Wrappers package, at the core of which lies /usr/sbin/tcpd.


    First, you learned to configure the inetd daemon security with editing /etc/inetd.conf
    and /etc/services changing them to suit your needs. In the case of /etc/inetd.conf,
    a few hash marks (#) to comment out services out is enough to make things secure.
    In the case of /etc/services, you learned how to move services from port to port,
    you should choose to do so.


    Then you learned that the TCP wrappers program /usr/sbin/tcpd allows you as a
    system administrator to decide who gets to connect and who doesn''t, simply on
    the basis of host identity. You then learned to construct a paranoid /etc/hosts.deny
    file with a few exceptions in /etc/hosts.allow for systems that should have permission
    to use various services.


    Finally, after learning about inetd and TCP wrappers, you made some simple changes
    to your /etc/syslog.conf file to ensure that you have good logs at all, preferably
    over several different systems.


    # Q&A


    +   There are many services that I can''t identify in /etc/inetd.conf and /etc/
    services. Couldn''t you have presented a table with a description of each one?'
