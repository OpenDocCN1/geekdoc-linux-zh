  md: '# Additional Scopes


    Four other scopes are used at times in addition to the Directory and DirectoryMatch
    scopes, although they aren''t as broadly useful.


    The Files and FilesMatch scopes perform similar functions, but with respect to
    a single file, which can be supplied either relatively or with an absolute path.
    For example, to prevent any file called private.txt from being accessed anywhere
    in the system, you could use


    ```

    <Files private.txt>

    Order Deny,Allow

    Deny from all

    </Files>

    ```


    To allow any file that ends in .public.html to be displayed, regardless of where
    it occurs, you would use


    ```

    <Files *.public.html>

    Order Allow,Deny

    Allow from all

    </Files>

    ```


    The FilesMatch scope is similar, but again enables complete regular expressions
    to be used as arguments.


    Two other scopes, Location and LocationMatch, perform similar functions, but on
    the URL location, rather than the local directory paths. In many cases, they can
    be used in place of Directory or DirectoryMatch when it is convenient to do.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_203_0.png)


    > The Location and LocationMatch scopes can sometimes be more confusing than Directory,
    DirectoryMatch, Files, and FileMatch, which allow the administrator to think in
    terms of local directories and files that should or should not be made public.


    > More importantly, however, they can also conflict with existing scopes. If a
    Location scope explicitly allows for a URL that otherwise would have been denied
    because of an existing Directory scope, for example, the file will go out to the
    requester anyway.


    # Authentication


    At times it is necessary to provide some kind of authentication method for accessing
    a file or directory. For example, you might want to allow access to the directory
    /private/projects via the Web, but only to certain employees. Step one is easy
    enough.'
