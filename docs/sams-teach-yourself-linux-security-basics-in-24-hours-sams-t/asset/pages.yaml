  md: '# BIOS and Motherboards


    # Controlling Flash BIOS Updates


    One of the most convenient features of modern PCs can also be one of the most
    dangerous. a flash BIOS is a BIOS chip that can be overwritten using special software.
    This capability is useful because it allows significant motherboard upgrades and
    bug-fixes to be supplied by the manufacturer without requiring that you ship the
    hardware back to the factory for changes. Not only motherboards have this feature;
    the BIOS chips on many SCSI and IDE controllers have such a feature. In fact,
    some drives have their own small BIOS writes with flash capability.


    Unfortunately, all of this is not necessarily a good thing. While the process
    is supposed to require special programming software, the hardware tricks used
    by such software can also be employed by a malicious user. If a flash BIOS is
    overwritten not by a new BIOS program rather by garbage or zeroes, your system''s
    motherboard, SCSI controller, or hard drive is for all intents and purposes and
    must be sent back to the manufacturer. One or two motherboards now include an
    automatic recovery feature, but using the feature is a complex process, often
    requiring that you open your computer and set several hard-to-reach jumpers, as
    well as have Internet access on a second machine in order to obtain a replacement
    BIOS program.


    Rather than going such headaches, it is better to simply disable flash BIOS writes
    altogether wherever possible. Most motherboards allow the user to completely disable
    flash BIOS writes with a single jumper or switch setting; consult your computer
    system or motherboard for details. If it is not listed in the manual, take the
    cover off the case, get a flashlight, and look for a chip on your motherboard
    with a sticker on top of it, usually labeled with a name such as Award, AMI, or
    Phoenix. This is the BIOS chip. Once you''ve located it, you''ll see a small jumper
    or switch nearby on the board that is labeled in white lettering with "flash disable"
    or "write disable" or something similar. Changing the position of the jumper will
    disable flash BIOS updates.


    For SCSI controllers, PCI IDE controllers, hard drives, and other devices with
    their own upgradable onboard software, check your manual for jumper to disable
    flash BIOS writes.


    It isn''t always possible to disable flash BIOS writes for every device, but where
    possible it should be done in the interest of security and convenience.


    # Summary


    This hour you learned that your computer ever loads a program called the BIOS
    must decide which the operating system must be loaded from. If a'
