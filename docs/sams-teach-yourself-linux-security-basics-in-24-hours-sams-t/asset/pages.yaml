    deny nameserver /home/ftp/nodns.txt causes the FTP server to reject logins from
    any machine that is not served by a nameserver or whose name doesn''t resolve
    with its own nameserver. This is a kind of identity check for connecting machines.
    The file specified will be displayed to users in violation before they are dumped;
    it should simply contain a message explaining why they are denied access.


    # The /etc/ftpusers file


    The /etc/ftpusers file can confuse new administrators because it behaves in the
    opposite way from what they expect. The /etc/ftpusers file is a simple list of
    account names that are not allowed to log in to FTP.


    If you want to prevent an exiting user from logging in to FTP, you should add
    her account to the end of the list. By default, the file should exclude everybody
    in /etc/password real users—who have access—and the ftp account—if you want to
    allow anonymous access.


    On a brand-new Linux installation where only one non-root user has been created
    and the ftp account exists, this file can be created with a little shell tricky:


    ```

    cut -f1 /etc/passwd | grep -v ftp | \

    head -$(wc -l /etc/passwd) | \

    awk ''{ print $1 }'' > /etc/ftpusers

    ```


    This mincript extracts all users the most recently created user and the user called
    ftp. It dumps the users, one per line, to the /etc/ftpusers file. Note that this
    won''t work after several users have been created or if the ftp user has been
    removed.


    # Anonymous Upload Permissions


    Allowing for anonymous FTP uploads to an incoming directory is never a good idea,
    either legally or with respect to security considerations. However, if you must
    allow for anonymous uploads, you should least ensure that you set permissions
    on this directory:


    chmod 733 incoming


    This will prevent users from seeing files that other users have uploaded, giving
    the system administrator a chance to preview what has been uploaded before it
    is made public.


