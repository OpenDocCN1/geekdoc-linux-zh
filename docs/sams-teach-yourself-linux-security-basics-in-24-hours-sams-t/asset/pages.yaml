- img_proc: true
  md: '# Compiling and Installing Apache+mod_ssl


    Unfortunately, the process of upgrading your Apache installation to support SSL
    means recompiling and reinstalling the Apache binaries. Because of this, it''s
    simplest to start over with Apache rather than trying to drop new components into
    old locations.


    It is therefore recommended that before you begin, back up your existing Apache
    configuration and data files, and then use your distribution''s package manager
    to remove the apache or httpd series of packages. It is not necessary to remove
    your actual Web documents tree; this can remain in place, and your new configuration
    file can be updated to reflect its location.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_295_0.png)


    > The lifting of export restrictions on SSL in recent months, some Linux distributors
    have started shipping Apache+mod_ssl as a standard distribution component.

    Before the steps in this chapter, you may want to check if Apache+mod_ssl is a
    standard component of your Linux distribution.


    # Downloading Apache, OpenSSL, and mod_ssl


    To compile and install mod_ssl, you''ll actually need to download and compile
    three software tarballs: one for Apache, one for OpenSSL, and one for mod_ssl.


    The home page for OpenSSL can be found at http://www.openssl.org. The latest version
    of the OpenSSL source code can be downloaded from http://www.openssl.org/


    The home page for mod_ssl can be found at http://www.mod_ssl.org/; The latest
    version of the mod_ssl source code can be downloaded from http://www.mod_ssl.org/source/.
    You''ll notice that each of the mod_ssl tarballs has two version numbers, consider
    the following names from the mod_ssl Web site:


    ```

    mod_ssl-2.7.1-1.3.14.tar.gz

    mod_ssl-2.6.6-1.3.12.tar.gz

    mod_ssl-2.5.1-1.3.11.tar.gz

    mod_ssl-2.4.10-1.3.9.tar.gz

    ```


    In each of these names, the version number before the second dash (2.7.1, 2.6.6,
    2.5.1, 2.4.10) represents the mod_ssl version number, while the version number
    after the second dash (1.3.14, 1.3.12, 1.3.11, 1.3.9) represents the Apache version
    with which this mod_ssl tarball is meant to work. Be sure to get the mod_ssl tarball
    matching the version of Apache you plan to use, or vice versa.'
