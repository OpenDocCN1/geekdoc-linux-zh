    #  HOUR 18


    # # Encrypting Web Data


    This hour, you''ll learn how to compile and configure minimally an Apache Web
    server that has been enhanced with the mod_ssl package, making it capable of handling
    SSL (Secure Sockets Layer) communications for increased security. You''ll also
    learn how to create a self-signed certificate for use in such communications,
    so that you can immediately begin accepting https:// connections with your Web
    browser.


    Understand, however, that Web security is a large and complex field of study,
    well beyond the scope of a book like this one in many respects. This hour will
    not discuss the underlying mechanism of SSL or the process involved in certifying
    your Web server with a well-known Certificate Authority (CA) such as VeriSign
    or Xcertert.


    For a preliminary understanding of SSL and some of the many issues involved, the
    mod_ssl user manual is an excellent place to begin. It can be found at http://www.modssl.org/docs/2.7/.'
