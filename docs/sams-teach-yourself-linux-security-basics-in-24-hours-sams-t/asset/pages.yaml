  md: '# Encrypting Web Data


    # Q&A


    +   Q Aren''t there times when I can use a self-signed certificate without potential
    bad effects?


    +   A Yes, and you''ve already seen it. When you know for a fact that both client
    and server are they who they claim to be—for example, when both machines are located
    in the same internal network—a self-signed certificate is perfectly adequate.


    +   Even when not used in the local network or the intranet content, many sites
    on the Internet use Apache with self-signed certificates to avoid the costs involved
    in being certified by a commercial Certificate Authority. However, if you are
    doing a large volume of e-commerce or handling very sensitive data over the Internet,
    you should definitely look into using a commercial Certificate Authority.


    +   Q I followed the instructions in this hour and Apache is running enough for
    me to visit it from my other machine. Isn''t that enough configuration?


    +   A No! Please at see Hour 12 for a little more information on configuring Apache
    securely. If you seriously plan to use SSL for e-commerce or other sensitive purposes,
    however, you should definitely invest your dollars in comprehensive Apache documentation
    and a significant amount of time in ensuring that your Apache configuration is
    correct and functional.


    +   To put it another way, SSL isn''t really so wonderful if there are gaping
    security holes and configuration-related stability problems throughout the rest
    of your Apache configuration.


    +   Q I can''t get the new Apache server to start.


    +   I can''t get the new Apache server to connect with SSL.


    +   Check your log files to see what sort of error is occurring. These are located
    at /usr/local/apache/logs in this case.


    +   If your logs are showing garbage when SSL connections are requested, double-check
    your httpd.conf file, taking care to ensure that you replace all instances of
    port 8080 with port 80 and all instances of port 8443 with 443. Also, be sure
    that you are starting Apache with /usr/local/apache/bin/apachectl startssl. Using
    start instead of ssl will start the server, with SSL functionality.


    +   If your logs all appear to be empty, check the default locations in /usr/local/apache/logs,
    regardless of what your log directives are set in httpd.conf. Unfortunately, Apache+mod_ssl
    seems to have some bugs in the form of hard-coded paths.


