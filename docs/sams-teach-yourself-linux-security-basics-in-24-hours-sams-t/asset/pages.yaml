  md: 'Snort monitors for a large variety of attacks, back doors, and distributed
    denial-of-service evidence and records an alert for all such activity. When a
    Snort alarm goes off that you are unable to discount, you''ll often find that
    you have been the victim of an attack.


    In addition, there are a few telltale signs that you may have been compromised
    in some way. You should watch for these carefully:


    +   - Sudden presence of a new account that you didn''t create in the /etc/password
    file. If you find one of these, your system has been compromised.


    +   - Failure or odd behavior of system binaries that are normally invisible.
    For example, if you are suddenly unable to log in to your system there is a good
    chance that a root kit has been installed on your machine. Check the integrity
    of the related binaries (such as login or syslogd) against known good binaries
    on another system, and run SAINT to see if it discovers anything.


    +   - Lots of unexplained network traffic is also good evidence that all is not
    well. Sometimes it is even more obvious than simply "lots of traffic." If a call
    to netstat reports lots of open connections to a system you''re not familiar with
    rarely used and high-numbered ports, you''ve likely been compromised. This is
    especially true if these connections are "magically" opened again without you
    every time you reboot.


    In general, any unusual and unexplicable cause should cause you to take a closer
    look. Examples include heavy CPU load that can''t be accounted for, files or directories
    that can''t be read by root, or the failure of your system to ask for a password
    when you log in a console.


    Be vigilant!


    # Worst-Case Scenario


    This is it. You saw some weird behavior in your system and checked it out, or
    you got an alert from Snort or SWATCH. Your system has been compromised.


    What now?


    # Pull Offline Immediately


    The first order of business is to get the system disconnected from the network.
    Any user malicious enough to break into your system is unlikely to stop and follow
    the law immediately afterward. Chances are that he is proceeding with additional
    illegal behavior, most'
