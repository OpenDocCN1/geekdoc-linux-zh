  md: '# Adding and Configuring Host Principals


    Before any host on your network can fully participate in services that have been

    Kerberos enabled, the host must be added to the KDC database and properly configured

    to use the new set of services.


    First, download and install Kerberos, following the same instructions that were
    used for the

    KDC but after the make install step. Once the Kerberos tree has been installed

    in /usr/local/kerberos bin with make install, create the /usr/local/kerberos/etc
    direc-

    tory and copy the kb5.conf and kdc.conf files from KDC host''s /usr/local/

    kerberos/etc directory. Add the /usr/local/kerberos/bin and /usr/local/kerberos/

    sbin directories to your PATH variable.


    Now, become the superuser on the new host and use the kinit command to get a ticket

    for an administrator account. For example, remembering that we already created
    an

    administrator account for jake, enter the command kinit jake on the new host and

    ent the password for jake.


    ```

    newhost$ su

    Password:

    newhost# kinit jake

    Password for jake@MYNET.NET:

    newhost#

    ```


    After a ticket has been acquired, launch the admin utility and use the

    add_principal command to add a principal for the current host, in the form

    host/f.q.d.n, where f.q.d.n is replaced with the fully qualified domain name of
    the

    host''s entry. Be sure to choose an unquestionable password for each host you
    add.


    ```

    newhost# kadmin

    Authenticating as principal jake/admin@MYNET.NET with password:

    Enter password:

    kadmin: add_principal host/gxstation.myn.net

    Enter password for principal "host/gxstation.myn.net@MYNET.NET":\Re-enter password
    for principal "host/gxstation.myn.net@MYNET.NET":

    Principal "host/gxstation.myn.net@MYNET.NET" created.

    kadmin:

    ```


    The final step inside kadmin is to add a keytab entry for the current host. This
    is

    done with the ktadd command.


    ```

    kadmin: ktadd host/gxstation.myn.net

    ... [Output of ktadd operation]

    kadmin: exit

    newhost#

    ```


    The current host has now been added to the KDC host''s database of known hosts
    in the

    realm, and a keytab file on the new host has been created at /etc/krb5.keytab.'
