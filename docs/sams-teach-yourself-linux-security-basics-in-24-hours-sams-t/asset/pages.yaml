  md: '# 76


    # Hour 5


    There are so many different Linux distributions and so many different script possibilities
    that it''s impossible to give a good account of all of them in Table 5.1.

    Because of this, you''re likely going to have to use your common sense when trying
    to identify at least one or two of the scripts on your system. One thing that
    may help you is to look at the script itself using a pager:


    /etc/rc.d/rc3/S20network


    Generally, you''ll find that distribution vendors have included helpful comments
    and descriptions in each of the scripts that are accessible this way. These can
    help you to decide whether or not a given script and its related service are right
    for you.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_93_0.png)


    Be ready to restart your system after any changes to cause the rc.d directory
    to activate your new init services configuration.


    # Reenabling Disabled Services


    If you need to reenable a previously disabled service, simply restore the symbolic
    link to the central script in question, taking care to place it within the order
    of services started. For example, to reinstate the xfs daemon for runlevel 5,
    you might use


    ```

    cd /etc/rc.d/rc5.d

    mv disabled/S90xfs

    ```


    If you have to re-create a symbolic link rather than simply move it, and if you
    are unsure about which order to start the service, use your common sense. For
    example, network daemons should be started after the network itself is started
    but before services that depend on a daemon are started. If you don''t get it
    the first time, you can always slide around until you get right:


    ```

    cd /etc/rc.d/rc5.d

    mv S90xfs S50xfs

    ```


    Eventually, you''ll find a working configuration again.


    If you would like to disable and reenable services for test purposes while the
    system is running, you can generally call each of the scripts in the init.d directory
    by hand with one of three arguments:


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_93_1.png)


    +   - Starts the service if it isn''t already running.

    - Stops a running service.

    - Stops a running service and then starts it again, usually to adopt new changes
    made to configuration files.'
  merge: -1
