- img_proc: true
  md: '# 142


    # Hour 9


    If you''re not aware of the wheel group, don''t worry—it''s not hard to implement.
    The wheel group is simply a way of restricting access to some sensitive services
    (such as su) to a small group of users who have been given administrative privileges.
    You probably have a wheel group in your /etc/group file already. If not, simply
    add one with groupadd and add users as necessary to the wheel group to create
    your administrator class. For example, if you want frank, mary, and joe to be
    administrators, the wheel entry in your /etc/group file might look like this:


    ```

    wheel::1:frank,joe

    ```


    This line makes frank, mary, and joe members of the wheel group. Then, using simple
    techniques as those documented in this section, you can grant access to services
    as su only to these users.


    We''re going to amend the /etc/pam.d/su file which controls the authentication
    behavior of the su command, to the following behavior:


    +   - Allow only members of the wheel group to use su all.

    - Require all users, even root, to enter a password when trying to use su to root-level
    access.

    - Log all su uses.


    The updated /etc/pam.d/su file looks like the one shown in Listing 9.4.


    # Listing 9.4 Updated /etc/pam.d/su Su File


    ```

    auth       required pam_warn.so

    auth       requisite pam_wheel.so group=wheel

    auth       required pam_pwdb.so

    account    required pam_pwdb.so

    password   required pam_pwdb.so use_authtok

    session    required pam_pwdb.so

    ```


    This /etc/pam.d/su file is obvious in this one of the pam_pwdb.so module, well
    documented in the PAM users guide and used often throughout the other PAM configuration
    files. Here new, the pam_pwdb.so module, which simply checks to make sure that
    the user is a member of the wheel group. Because it is marked as requisite, if
    the stack fails (when the user is not a member of wheel), the stack exits immediately
    in failure without continuing. Thus, only members of wheel will even be asked
    to enter a password. All others will be denied from the beginning.'
  merge: -1
