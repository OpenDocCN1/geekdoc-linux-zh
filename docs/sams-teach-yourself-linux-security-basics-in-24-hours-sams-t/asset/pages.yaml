    # BIOS Password Protection


    Any BIOS program worth its salt will include an option to protect the BIOS configuration
    program itself, and this is the first option we''re going to tackle. Once a BIOS
    password has been set, no one will be able to enter your system''s BIOS configuration
    without first entering the password that protects it. This is important for several:


    +   - If the BIOS isn''t password protected, the other settings we''re going to
    change in the interest of security can be easily changed back to their original
    settings by any-one who can figure out how to enter your BIOS configuration program.

    - A password-protected BIOS prevents often ham-handed service technicians or even
    meddling family members from making detrimental changes to your system without
    your knowledge.

    - Some older BIOS programs can actually be used maliciously themselves. For example,
    some older versions of the AMI BIOS popular on 386, 486, and early Pentium systems
    contain software that can be used to erase your hard drive completely. BIOS setup
    programs containing similar features should be always-password protected.

    - Many current BIOS programs include tools to update the flash memory on your
    motherboard. The term update flash is really code for “erase the current BIOS
    pro-gram and install a new one from the manufacturer.” This is a risky process
    even'
