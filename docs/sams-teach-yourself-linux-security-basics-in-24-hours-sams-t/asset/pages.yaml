    # HOUR 20


    # Encrypting E-Mail Data


    This hour, you''ll learn to use the Free Software Foundation''s implementation
    of the Pretty Good Privacy (PGP) method for general-purpose data security. The
    name of this implementation is the GNU Privacy Guard (GPG).


    Though PGP and more specifically GPG can be used for encrypting many kinds of
    data, PGP really became an international success because of its capability to
    do quick-and-dirty encryption with many popular e-mail clients. The encryption
    of e-mail remains PGP''s most common function.


    # A Quick PGP Overview


    Like many of the other encryption methods we''ve covered so far, PGP works with
    a two-key encryption system. Every person using PGP creates a key pair for himself.
    One key in the pair is a public key; the other is a private key. The public key
    is circulated as widely as possible and may even be listed in any one of several
    public key databases, where other Internet users around the world can find. The
    private key is a closely guarded secret and is never transmitted or copied anywhere
    or to anyone.'
