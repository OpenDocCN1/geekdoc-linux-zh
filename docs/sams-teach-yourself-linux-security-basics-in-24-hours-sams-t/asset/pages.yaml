- img_proc: true
  md: '# Securing Apache, FTP, and SMTP Services


    The ResourceConfig and AccessConfig directives specify locations for configuration
    files that are now considered obsolete. Just to be sure, it''s a good idea to
    point them to a location that cannot be edited.


    The MaxClients directive specifies the maximum number of connections that will
    be enabled at any one time, such as MaxClients 50


    It is important to understand that, if this number is reached, additional connecting
    users will receive an error message. Don''t set the number too low. On the other
    hand, a new HTTP process is started for each connection, so setting the number
    too high can make your system vulnerable to a simple denial of service attack.
    A number between 50 and 150 is acceptable for the average Pentium system with
    32–64 megabytes of memory.


    The Port 80


    is self-explanatory. The normal HTTP port is 80, but if you don''t want to make
    your Web server obviously accessible to the average person, you can specify an
    alternative port. Be not to conflict with any ports already used in /etc/services!


    The User and Group directives are extremely important. They represent the user
    and group ownership under which your HTTPD processes run:


    User nobody

    Group nobody


    The nobody user is a good choice if it exists on your system. If not, create a
    nobody user or a www user and specify it with this directive. Never run HTTPD
    with the permissions of any human user on the system or with the permissions of
    root. To do so is to make all of that person''s files completely accessible to
    the entire world. In the case of root, the potential results are disastrous!


    The DocumentRoot directive specifies the base directory from which Apache will
    serve pages:


    ```

    DocumentRoot /public/www

    ```


    It corresponds to a Web site''s root directory for users in the outside world.
    In the interest of both simplicity and security, it is important to set this directive
    to a location created specifically to house Web pages, owned by the user and group
    you specified in the User and Group directives. All Web content will then be placed
    in this directory.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'The UserDir directive allows the HTTPD server to serve files from a per-user
    location supplied in the URL, such as


    UserDir public_html

    UserDir disabled root


    Set to public_html, the following mappings would occur:


    ```

    http://host.net/-bob -> -bob/public_html

    http://host.net/-bob/funnies/ -> -bob/public_html/funnies/

    ```


    This sort of thing is giving multiple users a home page, but can represent a security
    risk if the server is pointed to the wrong areas. Thus, the disabled option enables
    the UserDir directive to exclude certain users from this kind of translation.
    If you also had, for example, /home/ftp /home/citadel directories and their corresponding
    users, you might want to exclude them at the same time, as:


    UserDir disabled ftp citadel


    An alternative, more conservative policy is to disable the UserDir feature altogether
    as a matter of policy and enable it only for specific users:


    UserDir disabled

    UserDir enabled bob jamie karen laffer


    > Even when using the disabled option, the UserDir directive poses some security
    risks unless a conservative root (/) directory directive is also in place in your
    httpd.conf file. Be sure to read and understand the "Directory and DirectoryMatch
    Scopes" section later in this hour if you plan to use UserDir.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_199_0.png)


    The UserDir facility isn''t by any mandatory. On small systems or networks where
    no user home directories need to be accessed, the feature should be disabled by
    default.


    # Global Logging Directives


    Good logging is critical to good security, and no time is this truer when dealing
    with a typically high-traffic area like the HTTPD server. The first two logging
    directives are straightforward:


    The ErrorLog and LogLevel directives


    ```

    ErrorLog /var/log/httpd/error_log

    LogLevel warn

    ```'
