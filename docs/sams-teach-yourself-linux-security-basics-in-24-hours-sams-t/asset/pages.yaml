  md: '# HOUR 6


    # TCP/IP Network Security


    Security is the focus of every hour in this book, but if there’s one chapter here
    that’s more important than all of the others, it’s this one, which concerns itself
    with securing the core of the Linux TCP/IP service request-handling mechanism.


    TCP/IP stands for Transmission Control Protocol/Internet Protocol and is the basic
    network technology used by Unix-like systems and the Internet as we know it today.
    You may have heard the term "wide open" or "port scan" in discussions about Internet
    or TCP/IP security. These terms have a lot to do with the configuration of two
    aspects of a network-enabled Linux system: the inetd daemon responsible for handling
    nearly all incoming network requests and the TCP wrappers package, which enables
    you to accept or deny requests on a system-by-system or network-by-network basis.


    Toward the end of this hour, we’re also going to look at configuring the system
    logger to report the right kinds of events in the right ways. This will allow
    you as an administrator to maintain a more secure system and understand what happened
    if something goes wrong.'
