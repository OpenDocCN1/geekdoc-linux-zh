  md: '# Hour 17: Introduction to Kerberos


    +   49. Kerberos 5 has been installed on all clients and a key distribution center
    has been constructed.


    +   50. Traditional services such as telnet, login, and rsh have been enhanced
    with Kerberos and the original binaries for these services have been disabled.

    (/etc/inetd.conf)


    +   51. As any systems and services as possible have been reconfigured or recompiled
    to be Kerberos-aware.


    # Hour 18: Encrypting Web Data


    +   52. Apache has been recompiled to be SSL-capable, and a self-signed certificate
    has been created.


    # Hour 19: Encrypting File System Data


    +   53. The Transparent Cryptographic File System has been installed, and volumes
    that are to be encrypted have been created or converted.


    # Hour 20: Encrypting E-Mail Data


    +   54. The GNU Privacy Guard system for PGP encryption and signatures have been
    made available to users on this host.


    # Hour 21: Auditing and Monitoring


    +   55. SAINT has been installed and run, and a regular regime of SAINT audits
    has been implemented.


    +   56. Any possible vulnerabilities reported by SAINT on its first pass have
    been thoroughly checked out and will be for future SAINT passes as well.


    +   57. SWATCH has been installed, and an initial match file has been constructed.
    It will be monitored vigilantly and expanded based on experience and observation
    of the system logs.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Hour 22: Detecting Attacks in Progress


    +   58. Snort has been installed using a collection of rulesets from the Snort
    community that will be updated regularly.


    # Hour 23: Preserving Data


    +   59. A system of periodic backups has been implemented using CRON or another
    scheduling daemon.


    +   60. A scheme for media rotation in periodic backups has been implemented.


    # Hour 24: Recovering from Attacks—

    A Mini-Checklist


    +   - Take system offline.

    - Reboot Linux into single-user mode.

    - Make an archival full backup.

    - Study logs, SWATCH alerts, Snort alerts.

    - Report attacker to ISP or upstream providers.

    - Reformat and reinstall Linux.

    - Cautiously restore important data from tape.

    - Require all groups and users to change passwords.

    - Watch closer on compromised ports.

    - Take system back online.'
