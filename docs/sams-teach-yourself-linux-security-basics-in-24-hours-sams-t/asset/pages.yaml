  md: '# BIOS and Motherboards


    # Entering Setup


    Unfortunately, there’s no standard way to enter the BIOS setup program. Any original
    equipment manufacturer (OEM) motherboards commonly used by home computer builders
    and smaller computer shops contain the standard American Megatrends Incorporated
    (AMI) or Award BIOS system. These BIOSs generally display a message when the machine
    is first started that gives instructions for entering the BIOS setup program.
    Such message may be similar to any of these:


    +   * DEL to enter SETUP

    * INS to enter SETUP

    * F1 for SETUP

    * ALT+F1 for SETUP, ALT+F2 for FLASH


    The key word in this case is SETUP, which refers to the BIOS configuration program
    we’re trying to access. If you can see a power-on message relating a specific
    keystroke to SETUP, the keystroke while the message is being displayed, and you
    should find yourself in the BIOS configuration program. Other keystrokes, which
    lead to functions the FLASH utility, are not directly related to configuring BIOS
    setup options.


    If your system displays no message and is manufactured by one of the larger retail
    computer makers, you may find that your system BIOS does not allow access to the
    configuration program without the use of a special BIOS setup disk that must be
    inserted before the computer is powered on. Other computers may require that you
    boot into Windows and use a Windows-based configuration utility to configure your
    BIOS. If this is the case with your system, perform these steps now.


    Finally, some systems display no message and include no obvious disk disk or software,
    but instead have hidden keystrokes. IBM machines, for example, require the user
    to hold the F1 key while the computer is switched on. The key must be held until
    the BIOS configuration program actually appears on the display or it will not
    run. If you find that your system offers no clear method for BIOS configuration
    access, try pressing each of the Delete, Insert, and F1 keys during the memory
    check. If none of these work, try each of them, this time holding one down as
    the system is switched on.


    In doubt, consult your computer or motherboard’s manual for instructions on entering
    the BIOS configuration program.


    # Navigating Setup


    There is no generally accepted standard or uniformity between the user interfaces
    of various BIOS configuration programs. Some of them, like the AMI WinBIOS, are
