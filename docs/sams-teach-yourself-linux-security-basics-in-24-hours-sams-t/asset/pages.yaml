  md: '# Auditing and Monitoring


    Using these actions and well-constructed watchful lines, you can have SWATCH monitor
    for your logs for almost any type of activity. A very simple file is shown in
    Listing 21.1.


    # LISTING 21.1 A Simple General-Purpose Match File


    ```

    watchfor    /ROOT LOGIN|uid=0/

    echo red

    mail addresses=admin@mynet.net,subject="*.SW.Root Activity"

    bell 2

    watchfor    /REPEATED|repeated|/

    echo red

    mail addresses=admin@mynet.net,subject="*.SW.Repeat Activity"

    bell 2

    watchfor    /FAILED|INVALID|authentication failure|Unauthorized/

    echo

    mail addresses=admin@mynet.net

    bell 1

    watchfor    /changed by/

    echo blue

    mail addresses=admin@mynet.net,subject="*.SW.Password Change"

    bell 2

    watchfor    /caught signal|exiting|abnormal|aborted|restart|registered/

    echo blink

    mail addresses=admin@mynet.net,subject="*.SW.Unknown"

    bell 2

    watchfor    /kernel:|init:/

    echo blink

    mail addresses=admin@mynet.net,subject="*.SW.System"

    bell 2

    watchfor    /LOGIN FROM/

    ```


    The file in Listing 21.1 attempts to track a general group of common but questionable
    log entries on many Linux systems and display them locally, notify an administrator,
    or both.


    When you have SWATCH configured to suit your needs, you might consider starting
    somewhere in the background during the boot process for important log monitoring.
    You might also dedicate a central log machine to logging all machines on your
    network and monitoring those logs with SWATCH.


