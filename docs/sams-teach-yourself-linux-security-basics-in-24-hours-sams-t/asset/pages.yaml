  md: 'No other configuration of any kind needs to be done for NFS. Once the /etc/exports
    file has been constructed, you are ready to go.


    # NFS Packet Filtering


    Though the /etc/exports file provides for some security, in and of itself it may
    not be enough. Unless you want to provide completely public NFS exports to the
    entire world, you should impose packet filtering rules to disallow NFS requests
    from strange hosts or networks.


    This is complicated by what the NFS actually requires three ports to operate.
    Port 111 traditionally is used by the portmapper, rpc.portmap, to mount the file
    system using rpc.mountd, 2049. Notice that I didn''t mention a port number for
    rpc.mountd. This is the problem; rpc.mountd typically uses a dynamic port number
    when it is configured in most Linux installations. However, this can be fixed
    with an addition to the /etc/services file:


    | mount 2050/udp | mount |

    | nfs 2049/udp | nfs |


    When rpc.mountd starts, it will search the /etc/services file for the mount service
    (or, in some cases, mount.mountd service, which is why we''ve created an alias)
    and if found, will use the port specified there. Notice that we''ve also added
    a line for nfs in order to simplify things. Now we''re ready to filter packets.


    > In order use NFS services, the rpc.portmap daemon must be running. If you''ve
    disabled it in your init system, you''ll have to re-enable before NFS will work
    properly. Be sure to start rpc.portmap earlier than services such mount or nfsd
    that depend on it, or they won''t start properly.


    Ipchains, an example set of rules for allowing one trusted external system to
    use NFS while forbidding all external systems from using these specific ports
    is shown in Listing 14.2.


    # 14.2 NFS Packet Filtering with ipchains


    ```

    ipchains -A input -p tcp -s trusted.ext.system.ip \

    -d ext.ip.number.here sunrpc -j ACCEPT

    ipchains -A input -p udp -s trusted.ext.system.ip \

    -d ext.ip.number.here sunrpc -j ACCEPT

    ipchains -A input -p udp -s trusted.ext.system.ip \

    -d ext.ip.number.here 2049:2050 -j ACCEPT

    ```'
