  md: '# HOUR 17


    # Introduction to Kerberos


    This hour, you''re going to learn how to use an open source implementation of
    the Kerberos authentication system to secure authentication and encrypt connections
    made on your local network. More specifically, you''re going to install and configure
    a key distribution center (KDC) and add principal hosts and users to its database.


    The home page for the Kerberos 5 implementation we''re going to cover here can
    be found at http://web.mit.edu/kerberos/www.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_276_0.png)


    Because Kerberos is still export restricted, this hour applies to users inside
    the U.S. and Canada only. An exportable alternative to Kerberos version 4 known
    as eBones is available to users outside of the U.S. and Canada. One set of eBones
    sources can be found at http://www.pdc.kth.se/kth-krb.


    # What Is Kerberos?


    First and foremost, Kerberos is a more secure authentication system than the one
    normally employed by most network-aware operating systems. It is'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 260


    # Hour 17


    needed because of a fundamental shortcoming in the way standard authentication
    takes place.


    Put simply, standard protocols like Telnet are very trusting. When Telnet accepts
    an incoming connection, it asks only for a password before granting access. It
    assumes that the remote user is really who he claims to be, rather than a stranger
    using a stolen password. It furthermore assumes the remote system is who he claims
    to be, rather than a rogue system hiding behind a stolen address. Similarly, the
    telnet user has no way of knowing if he is telnetting into the actual system he
    intended to reach, or if the address has been hijacked by a rogue system, ready
    to steal his password or do something even worse.


    Kerberos tries to solve this identity problem in a simple way: One system on the
    local area network key distribution center (KDC), a kind of master database of
    credentials. When a user employs a Kerberos-enabled protocol to connect from one
    system to another, all parties involved—the user and both hosts—request that the
    KDC check out everyone''s credentials. The KDC then gathers identification information
    in the form of encryption keys from the user and both hosts. If these keys are
    correct to the database of users and hosts on file at the KDC, the KDC informs
    each party that the others are really who they claim to be, and the connection
    is established.


    Though this method is relatively complex and is by no means foolproof, it is among
    the most secure methods for authentication currently in widespread use.


    # Building a Key Distribution Center


    The key distribution center, or KDC, is the machine on which the central database
    of credentials is stored. Once Kerberos authentication is made active on your
    network, any Kerberos-enabled connection will have to go through your KDC in order
    to be opened. It is therefore important that this machine be as secure and as
    stable as possible, because if the KDC goes down, the entire network can grind
    to a screeching halt.


    It is a good idea to dedicate one system to the KDC role. All other services and
    ports on the KDC machine will be disabled, and no logins or other types of activity
    will be performed on the KDC machine, either locally or remotely. A DC on smaller
    networks won''t handle huge amounts of traffic or streaming data, even an older,
    smaller computer system can suffice as long as it has a network interface and
    a reasonable amount of free disk storage.


    Perform a minimal Linux installation on the KDC machine. Neither XFree86 nor any
    user application is required for operation as a KDC.'
