    > If your computer system or motherboard includes no BIOS password-protection
    option, it may be time to get a new system or a new motherboard altogether, unless
    you''re sure that your physical environment is very secure. This is especially
    true if your BIOS includes flash update or hard drive low-level format capability.
    BIOS password protection is fundamental.


    # BIOS Password Protection


    In addition to password protecting the BIOS configuration program, it''s a good
    idea to password protect the boot process if the system doesn''t be able to boot
    automatically after power failures. The boot process has been password protected,
    any user who powers the system will be prompted for a password before any operating
    system is ever loaded from any device. Such a password is your first line of defense
    against unauthorized access.


    For example, imagine that you leave your office for lunch, and while you''re gone,
    some-one who has physical access to your computer attempts to break in it. Linux
    user accounts are protected, but suppose this simple person power-cycles the machine
    by switching it off and then on again? Suddenly, your system is unprotected. On
    an average computer system, any knowledgeable person can find at that point insert
    a floppy, bypass the Linux user accounts altogether, and have at all of your data.'
