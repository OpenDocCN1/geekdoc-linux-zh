  md: '# Physical Security


    +   - Use an adhesive cable lock

    Cables locks come in various shapes, sizes, and installation methods. The most
    common of these is a thin strong steel cable with an incredibly powerful adhesive
    block on each end. One end is glued to the table, the other to the machine. Such
    cables are generally thick and strong enough to act as a serious deterrent to
    theft.


    +   - Use a thicker, invasive cable lock

    Some site administrators have gone a bit further with the cable lock, drilling
    a hole in the computer''s sheet metal and another large hole in the edge of the
    table or desk. A bicycle combination lock with a thick steel cable or even a chain
    is threaded through holes and locked.


    +   - Use an alarm cable lock

    Several computer manufacturers sell alarm lock systems that are similar to cable
    locks described above but that are electrified and connected to an alarm system.
    If the case is ever cut, an audible alarm sounds.


    > In addition to locking down the box, it is also a good idea to lock the box
    so that a malicious individual with a few minutes and a screwdriver can open the
    case and make off with your hard drive and, then, your data. Some cases include
    built-in locking mechanisms of high quality, while others do not. The easiest
    to lock an unsecured box is to drill a set of strategically placed holes and then
    use a standard padlock to secure the major parts of the case.


    # Access Auditing


    Even assuming you''ve taken many of the measures mentioned so far in this hour,
    it is still important at all times to be aware when trying to ensure the security
    of a computer installation. The most important type of awareness in the case of
    physical security is access auditing. Access auditing is the process of knowing
    who has physical access to your machine and when. This list is important for two
    reasons:


    +   - If you understand who will physical access to the machine, you can make
    some guesses with regard to the degree of suspicion and caution you should have.


    +   - If your system is ever compromised physically or stolen, having a ready
    list of individuals who had physical access to the computing environment can help
    to expedite the discovery of the responsible party.'
