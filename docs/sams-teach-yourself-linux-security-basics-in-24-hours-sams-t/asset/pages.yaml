- img_proc: true
  md: "A number of other values can also be expanded; these are documented fully in\
    \ the canonical Apache document. The idea is to use them to construct a standard\
    \ log entry format to your tastes or needs. A good starting point might be\n\n\
    ```\nLogFormat \"%h %l %u \\%r\" %>%s %b\" common\nCustomLog /var/log/httpd/common_log\
    \ common\n```\n\nThis creates a log in common log format with enough information\
    \ to keep many administrators satisfied. In the interest of additional security,\
    \ you might also want to specify\n\n```\nLogFormat \"%h %t \\%{Referer}i\\%{User-Agent}i\"\
    \ extra\nCustomLog /var/log/httpd/extra_log extra\n```\n\nIf you feel that you\
    \ need extra logging information, feel free to create as many logs as you have\
    \ disk space for.\n\n# Directory and DirectoryMatch Scopes\n\nA scope in the httpd.conf\
    \ file can contain any number of directives, each of which will have effect only\
    \ within the scope in question. The format for a scope demarcation is as follows:\n\
    \n```\n<Scope argument>\n  Directive arguments\n  Directive arguments\n  Directive\
    \ arguments\n  ...\n</Scope>\n```\n\nThe httpd.conf file can contain any number\
    \ of scopes.\n\nThe Directory causes the set of directives it contains to apply\
    \ to the directory mentioned in the scope header. For example, consider the following\
    \ scope definition that should be present on every system:\n\n```\n<Directory\
    \ />\n  Order Deny,Allow\n  Deny from all\n</Directory>\n```\n\nThe two directives\
    \ Order and Deny will be effective for the directory / (root) and all subdirectories,\
    \ which inherit its properties. The Order directive instructs httpd to consider\
    \ Deny in this scope before Allow directives. The Deny directive blocks access\
    \ to all files in this scope."
