  md: 'The algorithm used for calculating permissions when traditional permissions
    and ACL permissions conflict is documented fully in acl(5), but it can generally
    be simplified to the following two rules:


    +   1. Permissions are checked from left to right. That is, user permissions supersede
    group permissions, and group permissions supersede other permissions.

    2. Traditional permissions supersede ACL permissions when granting access, but
    in all other cases ACL permissions supersede traditional permissions.


    # # Default Permissions (getfacl, setfacl, and Directories)


    The ACL software can allow for default permissions functionality similar to that
    offered by umask (see Hour 7), but on a more flexible directory-by-directory basis.
    The setfacl syntax for creating default permissions is the same as the syntax
    used by setfacl, except that the d must precede each set of permissions:


    ```

    setfacl [-m |-x] d:[user]:[+|permissions dir [dir...]

    setfacl [-m |-x] d:[group]:[+|permissions dir [dir...]

    setfacl [-m |-x] d:[+|permissions dir [dir...]

    ```


    The default permissions assigned to a directory do not apply to the directory
    itself. Rather, they will be applied to files created within that directory by
    default. For example, consider the following series of setfacl operations on a
    directory called myfiles:


    ```

    setfacl -m d:u:rw myfiles

    setfacl -m d:g::r myfiles

    setfacl -m d:o:rw myfiles

    setfacl -m d:u:jetty:rw myfiles

    setfacl -m d:g:workers:r myfiles

    setfacl -m d:admins:rw myfiles

    ```


    Each of these lines sets a default permission for the directory files. Thanks
    to the permissions specified here, all files created in my files will, by default,
    have the following set of permissions:


    +   * The user will have read and write permission.

    * The group will have read permission.

    * The additional user jerry will also be granted both read and write permission.

    * Members of the additional group workers will be granted read permission.

    * Members of the additional group admins will be granted both read and write permission.

    * All other users will have no permissions to act on the file in question.'
