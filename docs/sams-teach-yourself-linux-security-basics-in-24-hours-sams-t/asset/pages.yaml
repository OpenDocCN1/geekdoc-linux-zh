  md: '# Introduction


    That’s where this book comes in.


    By following a few relatively simple steps and making a few changes in the way
    your system handles requests for various types of data and connections, you can
    make your Linux system or Linux network much more secure than it is now.


    # But Can I Make It Secure Enough?


    # How Much Security Is Enough Security?


    Some veteran Linux users, especially system administrators, are fond of saying
    that a system can never be “secure enough” to let up on the security focus even
    a bit. These individuals are speaking from positions of experience in large organizations
    with large security needs. For users who aren’t computer professionals and can’t
    afford to hire one, a continual focus on security 24 hours a day, 7 days a week
    simply isn’t realistic. In other words, some amount of attention to security must
    at some point be called “enough.”


    Luckily, there is some good news for home and small business Linux users in need
    of security help. Though your system be an ideal candidate for break-in by a small-time
    crook or a script kiddie, it is probably not large enough to be the target of
    a systemattack from an expert hacker or a group of expert hackers. Therefore,
    enough security in your case is possible to define, or at to imagine.


    By taking the time to follow a few simple steps, regarded by security experts
    as the fundamentals of good security policy, and staying vigilant and aware of
    your system and your own Linux installation, you can prevent most attacks and
    close most vulnerabilities. In short, you can probably preserve your data, your
    privacy, and your peace of mind. The steps you may need to take, and which are
    covered in this book, can be summarized as follows:


    +   - Make sure your physical environment does not pose a security risk.

    - Install Linux and any updates you can find carefully and with a security-oriented
    mentality.

    - Password-protect everything you can and choose good passwords that are difficult
    to guess.

    - Instruct your file system not to give up any secrets to those who shouldn’t
    have them.

    - Turn off any network services you don’t use.

    - Make the network services you do more picky about who they’ll connect with and
    what sort of data they’ll release.

    - Protect your network, if you have one, with firewalling or packet filtering.

    - Encrypt any sensitive data you send out across the network and, if necessary,
    encrypt sensitive data stored locally.'
