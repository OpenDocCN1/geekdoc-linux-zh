- img_proc: true
  md: 'there are a number of different commands understood by mtx, the most important
    clearly are load and unload, which are self-explanatory.


    To load the tape in slot 2 from the changer pointed to by /dev/changer into the
    drive, use mtx -f /dev/changer load 2


    The command exits normally if the tape is successfully loaded or with a nonzero
    exit status on error. To unload the tape back to slot 2, use mtx -f /dev/changer
    unload 2


    The next and unload (no arguments) commands simply load the next tape found in
    the changer or unload the current tape into the slot from which it came, respectively:
    mtx -f /dev/changer next mtx -f /dev/changer unload


    Other commands understood by the mtx command can be found by consulting the mtx
    manual page at mtx(1).


    # Scheduling, Rotating, and Preserving Backups


    It is not enough to write all the data on your hard drive or on the NFS file systems
    on your network to tape once and assume your backup problem to be solved.


    If you do any kind of real work at all, data on your systems is constantly changing.
    Furthermore, tape media gradually deteriorate, so it''s helpful to have more than
    one backup around. One set of tapes might be inadequate—if you overwrite your
    only backup tape each night, what happens if you want to recover a file that was
    accidentally deleted last Thursday? Finally, what happens if the entire place
    burns down? Will your tapes safe, or will they go smoke with your systems and
    hard drives?


    Thinking ahead be more than half the battle when it comes to maintaining useful
    backups.


    # Scheduling Backups


    Because your data is constantly changing, you should back up often. If your system
    is hacked and you are forced to restore from tape, you probably won''t find a
    backup tape you made four months ago to be of much help. Even a one-month-old
    backup could be next to useless, depending on the freshness of the data you work
    with.


    It is therefore important to schedule your backups. This isn''t always difficult
    as it sounds. There''s no need to write a “backup date” in your Palm scheduler
    so that you can remember to insert a tape and run tar every Thursday. A simple
    CRON job involving a call to mtx and a call to tar can be more than enough make
    your drive work for you.'
