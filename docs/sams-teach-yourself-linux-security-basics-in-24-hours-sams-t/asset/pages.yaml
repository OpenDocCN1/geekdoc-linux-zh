    A script like the one in Listing 23.1 can automatically rotate the tapes in your
    changer on a weekly basis, meaning that you can have rotating scheduled backups
    indefinitely without any intervention at all.


    Of course, in your scripts, you''ll want to include some error condition checking,
    archive verification, and so forth—but the possibilities are clear.


    # Backups at Multiple Locations


    What about fire we mentioned, or a malicious intruder who gains access to your
    server''s tape changer, in which all of your rotated backups are sitting? Now
    we''re getting into escalating costs, but it''s still possible for many small
    businesses.


    At the very least, buy a fire- and waterproof safe and put your tapes into it
    for safekeeping. Though they won''t necessarily make it through a calamity, the
    chances will be greatly improved, and they will be under lock and key as well.


    Even better, is to make multiple simultaneous or near-simultaneous backups in
    multiple locations. If you can afford to do so and have the equipment to do so,
    buy two streamers or two changers. Keep one in the office and one in the other
    office, or if you can afford a reasonably fast pipe, at home. In your scripts
    or CRON jobs, run the backup twice—once to the local drive and once to an identical
    or similar drive on a remote machine. Your data is now well protected against
    catastrophic loss.


    For those who can afford not to be do-it-yourself backup artists, commercial network
    backup services exist that allow you to store your data safely under lock and
    key in fireproof, guarded installations with lots of insurance protection.


    # Proprietary Backup Software


    Though the combination of tar/mt/mtx or afio/mt/mtx will work well for many users,
    some users aren''t comfortable with command-line tools, and thus others require
    more sophistication and network-readiness than tar or afio provide. Because of
    these needs, two very popular commercial Linux backup solutions should be mentioned
    here.'
