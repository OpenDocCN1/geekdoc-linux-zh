    Remember if you adjust your installation path when configuring the source, you''ll
    need to account for this difference later when configuring and using SSH. A number
    of additional options can be used to change some of the properties or behaviors
    of the final SSH installation; to see a list of these options, use the --help
    option:


    ```

    ./configure --help

    ```


    The configure utility will likely take several minutes to finish on early Pentium
    or older systems. Once it has returned without errors, SSH can be built and installed
    using make. Don''t forget to install as superuser or the installation attempt
    will fail.


    ```

    $ make

    ... output of make ...

    $ su

    Password:

    # make install

    ... output of make install ...

    # exit

    $

    ```


