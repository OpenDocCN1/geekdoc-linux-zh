- img_proc: true
  md: 'In addition to a command, iptables will often require options, for example,
    in order to construct match criteria for an appended rule. There are a vast number
    of options for iptables, many of which depend on kernel compilation choices. The
    most commonly used iptables options are shown in Table 11.4.


    # Table 11.4 Common iptables Options


    | Option | Description |

    | --- | --- |

    | -p [!] protocol | Specifies the protocol matched by this rule, one of icmp,
    tcp, udp, or all. The exclamation mark (!) inverts the matching logic; when used,
    it should be surrounded by a space on either side. |

    | -s [mask] | Specifies the source address or range of addresses matched by this
    rule. |

    | --source-port [!] port | Specifies the source port or range of ports matched
    by this rule. Ports can be specified either as a numeric range (NNN:NNN) or in
    symbolic (as per /etc/services) form. |

    | -d [mask] | Specifies the destination address or range of addresses matched
    by this rule. |

    | --destination-port [!] port | Specifies the destination port or range of ports
    matched by this rule. |

    | --icmp-type [!] type | Specifies the type of ICMP message matched by this rule.
    Only applies when ICMP protocol has been specified. |

    | -i [!] interface | Specifies the incoming network interface matched by this
    rule. If present, the (+) character indicates that the rule should match all interfaces
    of the same type as the supplied interface. This option is only valid in the INPUT,
    FORWARD, and PREROUTING chains. |

    | -o [!] interface | Specifies the outgoing network interface matched by this
    rule. This option is only valid for the OUTPUT, FORWARD, and PROSTRUTING chains.
    |

    | -j target | Dictates that when matched, this rule should send the packet to
    this target (see Table 11.1 for a list of common targets). |

    | [!] --syn | Dictates that this rule should only match TCP packets that are initiating
    a connection. When preceded by an exclamation mark (!), matches only TCP packets
    that are in response to already open connections.|


    For commands that expect an address to be supplied via -s or -d, a default of
    0.0.0.0/0 (matches all addresses) will be used if the user supplies no address.'
