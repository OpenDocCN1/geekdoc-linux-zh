  md: '# Network Security: DNS with BIND


    Now it''s time to copy named and its components:

    # cp /usr/sbin/named /usr/sbin/named-xfer usr/sbin


    Because the named and named-xfer binaries are likely statically linked, some libraries
    will also be required. In order to find out which libraries ought to be copied,
    you can use the ldd command:

    # ldd usr/sbin/named

    libc.so.6 => /lib/libc.so.6 (0x40020000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)


    Remember to copy the libraries and not just the symbolic links that point to them.
    The symbolic links are created afterward:


    # cd lib

    # cp /lib/libc-2.1.2.so

    # cp /lib/ld-linux.2.1.2.so

    # ln -s libnss-compat-2.1.2.so libc.so.6

    # ln -s ld-linux.2.1.2.so ld-linux.so.2


    Experience demonstrates that in some instances in Linux, a few additional libraries
    are needed. Adjust to match your own version numbers:


    ```

    # cp /lib/libnss_compat-2.1.2.so

    # cp /lib/libnss_files-2.1.2.so

    # cp /lib/libns1-2.1.2.so

    # ln -s libnss_compat-2.1.2.so libnss_compat.so

    # ln -s libnss_files-2.1.2.so libnss_files.so

    # ln -s libns1-2.1.2.so libns1.so

    ```


    Be sure to check permissions on all the configuration files, libraries, and binaries
    to ensure that none of them are writable by user name or group and that none of
    them are running as SUID or SGID to root. Once this is all done, you (in theory)
    be almost ready to go.


    # Setting Up syslog for Chroot named


    Even though named will be running in its own root file system, we will be able
    to get logs from named to the normal system logger. New syslog daemons have a
    command-line option that allows us to do so. The option we''re interested in is
    -a, and it is used like this:

    syslog -a /usr/local/named/dev/log


    Starting syslog will allow it to create a listening socket at /usr/local/bind/dev/log,
    which the chrooted named will conveniently see as /dev/log. In order to make this
    change permanent, you''ll need to edit your /etc/rc.d/init.d/syslog script


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_222_0.png)'
