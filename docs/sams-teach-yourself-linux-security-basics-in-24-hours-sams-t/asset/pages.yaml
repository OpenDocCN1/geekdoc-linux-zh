  md: "# Securing Apache, FTP, and SMTP Services\n\nRemember that iptchains and iptables\
    \ rules are order-dependent. This\nmeans that if you already have a set of rules\
    \ that are active, perhaps started\na a script when you booted, you can't simply\
    \ type these new rules in andnexpect them to work at the end of the chain. Insert\
    \ them into your script before any final DENY or DROP rules and reboot in order\
    \ to activate the filter-\neffects given here.\n\nUsing iptables, the series of\
    \ commands is similar, albeit not exactly the same:\n\n```\niptables -t filter\
    \ -A INPUT -i lo -m state \\\n  --state ESTABLISHED,RELATED -j ACCEPT\niptables\
    \ -t filter -A INPUT -p tcp -s my.isp.mail.host \\\n  -d ext.ip.number.here --destination-port\
    \ smtp \\\n  -j ACCEPT\niptables -t filter -A INPUT -i lo \\\n  -d ext.ip.number.here\
    \ -j LOG --log-prefix \"iptables\": \"\niptables -t filter -A INPUT -i lo -m state\
    \ \\\n  --state NEW,INVALID -d ext.ip.number.here -j DROP\n```\n\nThe first two\
    \ iptables lines allow packets from an internal network (again, change this to\
    \ suit your needs) and from a trusted external host. The third line logs all packets\
    \ not caught by the first two rules, and the last line drops the bad packets.\
    \ Here again, if you have already implemented the set of iptables rules from Hour\
    \ 11, the last line isn't necessary a more stringent rule finished that script.\n\
    \n# Securing Sendmail using TCP Wrappers\n\nYou might remember the section on\
    \ configuring TCP wrappers from Hour 6, \"TCP/IP Network Security.\" The same\
    \ TCP wrappers used to start in, ftpd and telnet can also be used to start a mail\
    \ transfer agent such as Sendmail. Although a few distributions do this way alike,\
    \ most of the distributions do not.\n\nTo start Sendmail using inetd and /usr/sbin/tcpd,\
    \ you will need to do two things. First, remove the Sendmail script links from\
    \ the runlevels in which you want to secure sendmail. The process of managing\
    \ init scripts was discussed in Hour 5, \"System and User Fundamentals.\" After\
    \ you've stopped Sendmail from automatically being started at boot time, add the\
    \ following line to /etc/inetd.conf, or uncomment it if it is present commented\
    \ out:\n\n```\nsmtp troop nowait inetd start Sendmail only when it is required\
    \ and to use\n/usr/sbin/tcpd /usr/sbin/sendmail -bs\n```\n\nThis line instructs\
    \ inetd to start Sendmail using /sbin/tcpd, the TCP wrapper, to do it. This way,\
    \ information in the\n/etc/hosts.allow and /etc/hosts.deny files can be used to\
    \ govern who will be\n\n![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_212_0.png)\n\n\
    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_212_1.png)"
