  md: '# 334


    # Hour 22


    You learned which rulesets maintained by the Snort community are appropriate under
    various circumstances. Remember to keep these rulesets updated with the latest
    information from the Snort community if Snort is to remain an effective tool for
    you.


    Finally, you learned how to use the Web-based tool called SnortSnarf to tabulate
    and analyze the Snort alert logs on a regular basis.


    # Q&A


    +   Q I have a very fast machine that is behind a firewall. Can’t I use it to
    run Snort and a number of other services as well?


    +   A If you have reasonably trusted users on your internal network, this might
    be an option. Trial and error will quickly let you know whether or not the resource
    requirements of Snort will hurt the performance of daemons.


    +   While certainly not the ideal solution, on smaller networks with limited financial
    resources, it can be necessary at times to run many services, including Snort,
    on a small number of machines or even on a single machine.


    +   Q I want to watch for Snort activity with SWATCH. What alerts do I pay attention
    to and what alerts do I ignore?


    +   A This is where your job as system administrator comes in. Every Snort installation
    will generate false alarms. If you choose to have SWATCH notify you in a paranoid
    fashion of every little bit of Snort activity, you’ll quickly learn to ignore
    the warnings. Later on, when it’s not just “crying wolf,” you will regret that
    you made SWATCH so noisy with respect to Snort alerts.


    +   Since the false alarms generated by Snort will vary from installation to installation,
    it will be up to you to work with your Snort rulesets and your SWATCH monitoring
    until you get the balance right. This can be done only through experience.


    # New Terms


    packet sniffer A program that can see all data traveling across a network and
    record or analyze it. Packet sniffing can be used either for good (as is the case
    with Snort) or malicious purposes (such as data or password theft).


    promiscuous mode A mode of operation for an ethernet device in which it will accept
    and process all packets it receives, rather than silently dropping packets that
    are not specifically addressed to it.'
