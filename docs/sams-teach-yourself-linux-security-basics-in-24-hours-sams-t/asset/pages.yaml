  md: '# Q&A


    Q Is there a way to support the advanced random access and fast search features
    of my DAT drive?


    A variety of tools for KDE, GNOME, and the command line exist for DAT devices—too
    many to list here. Unfortunately, there is no de facto standard or even common
    favorite among these software packages; they all have their strengths and weaknesses.

    To find of some, visit a Linux application site such as: http://linuxapps.com
    or http://freshmeat.net and search for the strings dds and dat.


    Q Can I back up to a raw Zip disk?

    What device do I use to back up to a raw MO disk?

    Can I back up to a file?


    A using tar or afio to raw devices like unpartitioned Zip disks or MO disks is
    simple; use the device name for the drive in question. For example, if your IDE
    drive is /dev/hdc, insert a disk and tell tar or afio to write to /dev/hdc instead
    of a tape device like /dev/st0.

    To write to a file, just provide a file instead of a device. For example, consider
    the following:

    tar -cf /mnt/net/home.tar /home

    This command would back up the /home tree on the local system to the file /mnt/home.tar.
    The restoration would be identical—just supply the name of the tar or afio file
    instead of a device node.


    Q What is the best media for long-term archiving?

    A best media for long-term data storage is optical media like CD-R, CD-RW, DVD-R,
    or magneto-optical. CD and DVD formats have an especially long life—some types
    of CD and DVD media boost a 300-year data life expectancy. However, since the
    CD and DVD formats generally do not support random writes or variable-speed streaming,
    they are unsuitable for use as general-purpose backup devices. Magneto-optical
    (MO), on the other hand, can be used with afio, tar, and other backup software
    just as you would use any other removable storage device. Though life expectancy
    on MO disks is shorter (or the order of 50 years), it is significantly longer
    than the DAT life expectancy of magnetic media.

    Magnetic media such as DAT tapes or Zip and Jaz disks, while very popular, are
    among the worst for long-term storage. Magnetic media have an expected data life
    of 2–5 years. In a sense, many traditional paper documents have a better expectancy.
    Be sure to account for this when designing your backup and data preservation procedures.'
