- img_proc: true
  md: '# The Boot Process


    # The Three-Key Smash (Ctrl+Alt+Del)


    The “three-key smash” has been around in computing since the DOS days. Originally,
    the combination of Ctrl+Alt+Del was used to perform a soft-reset of an MSDOS machine.
    Linux users have preserved this tradition; most Linux distributions now configure
    this keystroke to reboot the machine at any console.


    For a machine that must be in physical contact with the public, however, the ability
    to perform a soft reboot by hitting Ctrl+Alt+Del is an unwanted one. Since most
    distributions currently carry this keystroke in the /etc/initabb file, simply
    look for a line like this and comment out with a hash character (#)


    ```

    ca:12345:ctrlaltdel:sbin/shutdown -r now

    ```


    The specific line on your system may be slightly different, but the key is to
    look for a line that contains the keyword ctrlaltdel after the second colon. This
    keystroke has been commented out, users will no longer be able to perform soft
    reboots using a simple keystroke. Instead, root will have to log in and shut down
    the system or reboot by hand.


    # Summary


    This hour, you''ve learned to secure your boot process by making LILO suspicious
    of kernel arguments and by changing a couple of typical problem spots in the /etc/initab
    file. The steps covered include


    +   - Using the keyword in /etc/lilo.conf to password-protect kernel images and
    the boot process in general.

    - Using the restricted keyword in /etc/lilo.conf to allow password-protected images
    to boot without intervention when no additional kernel arguments are supplied.

    - Editing the prompt and timeout values in /etc/lilo.conf to reflect your policy
    and needs with regard to unexpected reboots.

    - Editing the /etc/initab file to avoid starting X at boot on systems that do
    not need X running all time.

    - Editing the /etc/initab file on systems that will be available for physical
    public use to remove the Ctrl+Alt+Del soft reboot keystroke.


    Now that these steps have been taken, you’re done with “pre-Linux” security and
    ready to move on to the real meat and potatoes of securing a Linux system in the
    hours that follow.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_82_0.png)'
