    # Improving X Security with SSH


    The final security problem we''ll tackle while using SSH is the X11R data stream.
    Recall that in the last hour we used a little trick to move an X session''s magic
    cookie from one host to other:


    ```

    xauth extract :0 | rsh foobar xauth merge

    ```


    This command copied the X session''s magic cookie, designed to improve connection,
    from one system to another. Unfortunately, this introduced a new security vulnerability,
    since the magic cookie itself was transmitted in clear code and was therefore
    susceptible to being intercepted and used by unknown parties.


    With SSH, we can instantly fix this problem. The command is virtually identical:


    ```

    xauth extract :0 | ssh2 foobar xauth merge

    ```


    The difference is that the magic cookie is now encrypted before being sent out
    across the network, making it much susceptible to unwanted use by untrusted parties.


    Using SSH, X11R6 security can be improved even more. This is done by encoding
    the X11R6 data stream itself. Tunneling of other protocols was a little difficult
    to grasp, but X is such an important protocol that SSH includes some special functionality
    for working with X. The cleanest, simplest example requires only running an X
    server on the local machine.


    Assuming that you want to launch clients on a machine called remote that will
    display the already running X server, simply issue a command like this:


    ```

    ssh2 remote /usr/X11R6/bin/xterm

    ```


    An xtwindow running on remote appears on your local display, without additional
    intervention or explicit tunneling or forwarding instructions. From this xtterm,
    launching any number of X applications; they will all start on your local display
    as expected.


    In this case, SSH has taken care of all the details for you; when SSH determines
    that an X application is to be run, it automatically exchanges the magic cookie
    from XDMCP session and sets the DISPLAY environment variable in the remote environment
    correctly. More involved configurations might even call SSH in the .xinitrc file
    to start a window manager on the remote machine:


    ```

    ssh2 remote /usr/local/bin/wmaker

    ```'
