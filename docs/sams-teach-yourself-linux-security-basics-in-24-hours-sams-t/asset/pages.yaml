  md: 'access to a single important user, access must be given to all hosts on which
    the user might appear. For an administrative user, a number of systems may be
    involved. Furthermore, because adding a system to the access control list means
    that all users on that system can connect, any guarantee of access for a single
    important user may mean as a side effect the granting of unwanted access to any
    number of unrelated users.


    Clearly, host-based X authentication is not the most desirable type of access
    control for X11R6 servers.


    # # Token-Based Authentication


    To overcome the limitations of host-based authentication, the designers of X also
    implemented authenticating a remote user based on a system of token exchange.
    When a remote system makes a connection, the X server compares a magic cookie
    (a kind of unique identification code) it supplies with a magic cookie stored
    on the local system. If the two cookies match, access is granted. If they do not
    match, access is denied. It is assumed that only users who have access will have
    given the cookie.


    Normally, once a user has possession of a cookie, it is stored in a file located
    at HOME/.authority, and little intervention is then required to interact with
    the X server. Each time a connection is attempted, the cookie for the remote server
    will be read automatically and supplied as part of the authentication exchange.


    The actual implementation is a little more complex, but with practice, it can
    seem as easy to manage as the xauth method for controlling access.


    # # Using the xauth Command


    Before you start an X server with token-based authentication enabled, a magic
    cookie must first be generated and added to the magic cookie file maintained by
    the xauth command. The command used for manipulating magic cookies and cookie
    files for token-based authentication is xauth. To generate a cookie and add it
    to the file, which is normally found at HOME/.authority, you''d


    ```

    xauth add host:display keyvalue

    ```


    The value for:display will normally be the hostname of the system on which the
    X server is run, followed by the number 0 (zero), unless you are planning to run
    X on multiple devices. The keyvalue should be a large random or pseudor value
    with an even number of digits from which the magic cookie will be generated. For
    example, on a host station-john, using a variation on the current date and time
    as a key value, you must execute the command to generate the magic cookie and
    add it to the authentication file:


    ```

    xauth add station-john:$ $(date +%S%M%H%y%d)

    ```'
