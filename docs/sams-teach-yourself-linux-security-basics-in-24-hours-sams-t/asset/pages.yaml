    # # Backup and Restore Utility (BRU)


    The BRU application is perhaps the most popular GUI-based backup and recovery
    utility available for Linux. It is shipping or has shipped as a standard part
    of retail Linux distributions.


    BRU supports backup of live file systems and a number of different types of network
    file systems, as well as per-user backups and restores in NIS-enabled environments.
    BRU also supports crash recovery features designed to help bring a system back
    online from catastrophic data loss as quickly as possible. BRU archives are portable
    across a wide range of BRU-supported platforms, including Windows NT.


    More information about BRU can be found at http://www.estinc.com.


    # # Arkeia


    Arkeia is perhaps the most celebrated Linux backup solutions, and with good reason—it''s
    designed to handle the backup needs of the largest of networks.


    With extensive multipatform, multiprotocol, and robustness features, Arkeia is
    the first choice for many Linux users. Arkeia sports a flexible, smart implementation,
    including sophisticated network monitoring and choice of client-side or server-side
    compression to preserve resources of all kinds.


    Perhaps more interestingly, a full license to use Arkeia on a small network (one
    Linux server and two clients) is free. More information on Arkeia can be found
    at http://www.knox-software.com.


    # # Summary


    This hour you learned about the importance of maintaining multiple backups in
    secure an environment as is possible, in order to be able to recover more fully
    from malicious attacks of all kinds.


    To help you achieve this goal, you have learned the basics of using your choice
    of tar or afio in conjunction with mt and mtx (for magnetic tape devices) to maintain
    backups, including scheduled, rotating backups using CRON jobs.


    Finally, you learned briefly about two popular Linux backup solutions for those
    who are uncomfortable using command-line tools like afio, tar, mtx, and mt for
    those who find the standard tools lacking in some fashion.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_364_0.png)'
