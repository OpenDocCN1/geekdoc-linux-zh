  md: 'Many older versions of shadow that shipped with Linux systems are exposed to
    a serious compromise risk by a buggy /bin/login binary, which can be exploited
    by a cracker to gain root access on your system.


    If your distribution is over a year old, be sure to check your distribution version''s
    Web site for security updates to the shadow package or, better yet, acquire a
    more recent Linux distribution.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_95_0.png)


    Nearly all current distributions install shadow passwords by default, and many
    of them install MD5 encryption by default as well. If you can''t find the /etc/shadow
    file, check your distribution CD or FTP site. In most cases, if your distribution
    contains a package shadow or something similar, just installing it with rpm or
    dselect will be enough to install and activate shadow passwords on your system.
    To be sure, take a look at your /etc/passwd file. If you see anything other than
    in the second field of your entry, use the pwconv command to update the /etc/passwd
    and /etc/shadow files correctly.


    # Adding a User, Step 1: /usr/sbin/groupadd


    The default group behavior in most Linux distributions is to place all users accounts
    in a single group, usually group 100, called users. Clearly, forcing all users''
    files owned by the same group is a risk to the integrity of your users'' data.
    Thus, it is wiser to give each user a private group—a to which only the user in
    question will belong.


    To do this, choose a number for the user''s group and call /usr/sbin/groupadd
    to create the group. In the interest of clarity, it is best to give all users
    accounts within a certain range (for example, from 6000 to 6999) that is higher
    than any existing group ID numbers and is aside exclusively for users. To find
    the highest group number used so far, command:


    ```

    cat /etc/group | cut -d : -f3 | sort -n

    ```


    Once you''ve chosen a group number for the new user, call the groupadd to create
    the new group, supplying the user''s group login as the final argument:


    ```

    /usr/sbin/groupadd -g 6001 johnB

    ```


    Depending on how the users group is used on your system, you may also want to
    add the user to the list of members for the users group. To do this, simply edit
    the /etc/group file with vi or a similar editor and append the user''s login name
    to the comma-separated list of users members.'
