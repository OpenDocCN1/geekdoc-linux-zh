  md: '# HOUR 11


    # Using iptables for Firewalling and Routing


    This hour, we''re going to learn to configure basic firewalling and routing capabilities
    of Linux. These techniques are most useful when a dedicated firewall system is
    used between an internal network and an external network, but can also help to
    improve network security on any host. We''ll begin with important kernel options
    and then continue with the iptables utility, which controls the behavior of the
    firewalling and routing capabilities in the kernel.


    Packet filtering is an art rather than a science, and skill in packet filtering
    is heavily dependent upon a user''s basic knowledge of TCP/IP networking. It is
    recommended that readers not familiar with TCP/IP consult a basic TCP/IP reference
    manual before trying to tackle packet filtering.


    > This hour applies only to users of the 2.4 kernels, for whom iptables is the
    correct firewalling or filtering management utility. Users of 2.2 kernels should
    pay attention to Hour 10, "Using ipchains for Firewalling and Routing," which
    covers similar systems and utilities in the 2.1 and 2.2 series of kernels.'
