  md: '# Q&A


    Q I can''t seem to edit either /etc/lilo.conf or /etc/inittab. Every time I try
    to do so, I get a message saying that I don''t have permission.


    A Now that Linux is installed and running in multi-user, you must be working as
    the root user to make changes to these files and perform most of the other tasks
    we''re going to cover in this book. Log out and log back in as the root user,
    or use the command to become root.


    Q The /sbin/lilo command failed. What do I do now?


    A Carefully check your /etc/lilo.conf file for syntax and spelling errors. Consult
    the lilo.conf (5) manual page if necessary. To get more diagnostic output when
    running the command, use the -v argument. If all else fails, undo the changes
    you''ve made and start over.


    Q runlevels don''t seem to match the runlevels you describe. X still starts by
    itself. What do I do?


    A First, go back over the /etc/inittab file and look for comments that refer to
    the X Display Manager or launching X11R. If you find them, use them as a guide,
    along with the inittab(5) manual page to help you make the necessary changes.
    Some distributions start X as a service in the /etc/rc.d or /etc/init hierarchy.
    We''ll cover these directories in the next hour. You may also find that administration
    tools native to your Linux distribution give you the option of disabling the X
    Display Manager.


    # New Terms


    default runlevel The runlevel under which the system will start if no specific
    runlevel has been passed as an argument to the init process.


    global A kind of keyword that is supplied only once at the top of the /etc/lilo.conf
    file that affects all images listed later in the file.


    image An entry in the /etc/lilo.conf file that refers to a bootable operating
    system. An image specification begins with either the image= or other= keyword
    and can contain any number of other keywords, depending on how the operating system
    is to be handled by LILO.


    init The program responsible for starting services when the kernel is running,
    from basic services such as login prompts on consoles to high-level services like
    X, and Web servers.'
