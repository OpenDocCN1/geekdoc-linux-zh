    | Command | Description |

    |---|---|n| retension | On streamer devices (whose tapes require periodic retensioning),
    causes the tape to be wound completely onto the second reel, then back to the
    first reel. |

    | erase | Blanks the tape. Note that this is not the same thing as formatting:
    floppy-interface tapes must be formatted before a successful erasure can take
