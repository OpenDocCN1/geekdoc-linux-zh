    +   * Password protected the BIOS configuration program itself

    * Password protected the boot process

    * Changed the boot order to prevent floppy and CD-ROM boots

    * Disabled or secured secondary BIOSs where possible

    * Disabled BIOS update capability where possible


    Though these steps are not directly related to Linux per se, they are an important
    part of a holistic approach to security that addresses remote and local vulnerability
