- img_proc: true
  md: 'A PAM configuration file, is simply a list of these stack entries, one per
    line, which defines the entire set of authentication procedures for a Linux system.
    When new services are installed on a Linux system that require authentication
    techniques, they will normally include additional PAM modules, specific to the
    service in question, along with documentation on how the module is used. The new
    service and modules can then quickly and easily be incorporated into the existing
    authentication framework.


    # # How PAM Works: The Basics


    The functionality of the PAM system is actually fairly basic. Any service that
    requires authentication is linked against the PAM libraries included with Linux.
    For example, try the following:


    ```

    # ldd /bin/login

    libcrypt.so.1 => /lib/libcrypt.so (0x40020000)

    libpam.so.0 => /lib/libpam.so (0x4004d000)

    lib11.so.2 => /lib/lib1.so.2 (0x40055000)

    libpam_misc.so.0 => /lib/libpam_misc.so (0x4005a000)

    libc.so.6 => /lib/libc.so.6 (0x4005d000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40200000)

    #

    ```


    Notice that the login program, used by programs such as getty and in.telnetd to
    authenticate users and log them in, is linked against the PAM libraries.


    When a specific service as login requires authentication, it employs the PAM routines
    to complete this authentication. These routines look at the PAM configuration
    files for stack entries with a matching service name. It processes these entries
    in the order in which they are found, one by one.


    To help you understand the way in which PAM works, let''s take closer look at
    one service''s authentication procedure. For the login service, for example, a
    default configuration might look something like Listing 9.1.


    # ## Listing 9.1 Section of /etc/pam.conf for login


    ```

    login      required    pam_security.so

    login      required    pam_pwdb.so

    login      required    pam_nologin.so

    login      optional    pam_mail.so

    login      account   required    pam_pwdb.so

    login      session    required    pam_pwdb.so

    login      session    optional    pam_lastlog.so

    login      password required    pam_pwdb.so

    ```'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Making the Most of Pluggable Authentication Modules (PAM)


    On many newer systems, the PAM configuration is split among a number of files
    stored in the /etc/pam.d/ directory. Each file is named after the service it handles,
    and the service identifier is therefore omitted from each action inside the file.
    The file equivalent of Listing 5.4, /etc/pam.d/login file, might contain


    | auth required pam_securetty.so |

    | auth required pam_pwdb.so |

    | auth required pam_nologin.so |

    | auth optional pam_mail.so |

    | account required pam_pwdb.so |

    | session required pam_pwdb.so |

    | session optional pam_lastlog.so |

    | password required pam_pwdb.so |


    In the end, the result is the same. If the /etc/pam.d/ directory exists, it will
    be used exclusively, and the /etc/pam.conf file will be ignored.


    Because each of these rules belongs the login service, the entire stack will be
    processed each time a user attempts to log in. Let''s step through the stack rules
    one by one. Refer to the PAM modules reference guide mentioned earlier for extensive
    descriptions of each module and its properties. The actions will proceed in this
    order:


    +   1. The pam_security.so module checks to see if the requested user is allowed
    to log in at console by comparing the user''s login location against the /etc/security
    file. This action is required; if it fails, the authentication request will be
    rejected after all actions have been completed.


    +   2. The pam_pwdb.so module is called to see whether the user has the correct
    password. This action is also required.


    +   3. The pam_nologin.so module is called to see whether the file /etc/nologin
    exists. If so, the file is displayed, and the action will fail, eventually preventing
    the user from logging in. This action is also required.


    +   4. The pam_mail.so module is called to see whether the user has any new mail.
    This action is optional, so the user will be allowed to log in based on the results
    of other actions whether or not any new mail is present.


    +   5. The pam_pwdb.so module is called again, this time in the account context,
    which causes it to check for password or account expiration. If the account has
    expired, or if the user''s password has expired and the user refuses to enter
    a new one, the action will fail. This action is required for login.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 140 Hour 9


    +   6. The pam_pwdb.so module is called yet again, this time in the session context,
    causing to enter the login attempt in the system log. This action is required,
    meaning that if the system is unable to record the login, the user will not be
    allowed to enter.


    +   7. The pam_lastlog.so module is called to update the user login history in
    the /var/log/lastlog file.


    +   8. The pam_pwdb.so module is called one last time to replace the user''s password
    in the /etc/shadow file, in case the password has been updated (step 5) during
    the login process. This action is also required, meaning that if the system is
    unable to complete it, the user will not be allowed to log in.


    This stack of actions represents the entire authentication process for user logins,
    beginning to end. If it seems a bit cloudy at this point, try referring to the
    PAM System Administrator’s Guide for exhaustive detail. However, the best way
    to learn is to begin working with PAM directly.


    # Putting PAM to Work: Expiring Passwords


    Now that you understand, at some degree, how PAM works, we’re going to modify
    a few PAM service stacks. The first one we’re going to modify is the password
    service, which is responsible for updating a user’s login password. It is important
    that all user passwords be well-chosen passwords. They should be longer than one
    or two characters and avoid any dictionary words at the very least.


    Most distributions now include reasonably good password selection enforcement
    by default—but we’re going to describe one possible /etc/pam.d/passwd file in
    case you find this not to be the case on your distribution.


    First, we need to verify the presence of the pam_cracklib.so module somewhere
    on the system. Assuming your file database is intact, you should be able to discover
    whether or not pam_cracklib.so and the needed dictionaries are present present


    ```

    locate pam_cracklib.so dict | grep crack

    ```


    If with this command you are able to locate both pam_cracklib.so and a crack terms
    dictionary file or set of dictionary files, then in theory, be able to enable
    good password enforcement. Just comment out the existing lines in your /etc/pam.d/passwd
    file with a hash mark (#) and replace them with the ones in Listing 9.2.


    # LISTING 9.2 Enforced /etc/pam.d/passwd File


    ```

    password required pam_cracklib.so type=user retry=3

    password required pam_pwdb.so use_authtok

    ```'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Making the Most of Pluggable Authentication Modules (PAM)


    If you have an /etc/pam.conf file instead of the /etc/pam.d/ directory, search
    through the file for lines beginning with the text passwd. Comment them out and
    replace them with the lines shown in Listing 9.3.


    # Listing 9.3 Enforced password Lines for /etc/pam.conf


    ```

    passwd password required pam_cracklib.so type=user retry=3

    passwd password required pam_pwdb.so use=authtok

    ```


    Note that if you have MD5 passwords, you might need to append a space and the
    word md5 to the end of the second line in either case.


    These changes will cause the PAM system to demand better passwords of users rather
    than accept bad passwords without complaint. The theory behind this small passwd
    stack is as follows:


    +   When a user enters his desired password, check the password against a dictionary
    of common terms. This task is performed by the pam_cracklib.so module and is required
    in order to proceed in the stack.


    +   Ask for a good password up to three times before giving up (the retry=3 argument).


    +   If the user enters a good password (the pam_cracklib.so module completes successfully),
    update the authentication token (the password) using the pam_pwdb.so module (responsible
    for managing the password database).


    This simple change allows a system administrator to demand good password selection
    from his or her users without having to know what the passwords are or to install-party
    software or aftermarket password utilities.


    # Putting PAM to Work: Enforcing wheel


    It is traditional on Unix-like systems to allow certain actions to occur only
    if the user in question is a member of the wheel group, reserved by convention
    for users with system administration type access. Among the actions actually restricted
    to wheel is the command, which allows one user to take over the UID of another
    user, most often the root user.


    Many users are surprised to learn that the wheel group is not enforced by default
    on Linux systems, meaning that any user at all can execute the su command and
    use it to log in as root if the password is known. Clearly, the ability to execute
    su to completion is a security risk in the hands of normal users. Let''s remedy
    the situation.'
  merge: -1
