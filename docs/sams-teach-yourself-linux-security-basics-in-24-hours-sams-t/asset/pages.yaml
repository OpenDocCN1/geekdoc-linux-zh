  md: 'Most users do not install Linux with any particular attention to security.
    A security-oriented installation is slightly different; the major tasks to complete
    when installing Linux with a security-oriented focus


    +   **Verify** Is your source media legitimate? Make sure that it is.


    +   **Partition** Separate file systems for control and defense.


    +   **Eliminate** Don''t install X or GCC when needed.


    +   **Choose** Don''t install packages you won''t use or don''t know.


    +   **Options** Set /etc/fstab options for mounted file systems.


    After coming to an understanding of your machine''s role, selecting a distribution
    to match it, and installing with the attitude of a discriminating administrator,
    you''re ready to tackle more explicitly security-related tasks.


    After powering on and before your system sees Linux, a multitude of tasks are
    performed. Pay attention to the settings in your motherboard, SCSI, and other
    BIOS programs, set jumpers carefully, and choose the correct boot order and your
    system will be less vulnerable to a locally caused compromise.


    # # Q&A


    +   **Q** Which distribution is the most secure?


    +   **A** Generally speaking, the Debian GNU/Linux distribution is the most conservative
    of Linux distributions. This doesn''t mean that Debian GNU/Linux is necessarily
    secure than any other distribution, but rather that Debian GNU/Linux is tested
    before it goes into full release.


    +   **Q** What sizes should I use for my partitions?


    +   **A** There is no right or wrong answer; the sizes you use are based entirely
    on your preferences and needs. Typically, the root (/) partition will function
    easily with less than 100 megabytes. You should be willing to dedicate more space
    to the partition(s) hosting the /usr and /tmp /home file system will vary, depending
    on the number of users (and user files) you plan to accommodate.


    +   **I** have already installed my preferred version of Linux, and it isn''t
    one of those you''ve listed. Can I still use this book?


    +   **A** Absolutely, you may have to hunt in a little cases to track down the
    locations of files we''ll discuss, especially if you don''t have access to some
    of the higher-level tools we''ll discuss, such as Linuxconf.'
