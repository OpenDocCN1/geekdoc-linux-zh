  md: '# Selecting and Installing a Linux Distribution


    # Choosing a Linux Distribution


    The process of choosing a Linux distribution for secure installation is different
    from the traditional choice process. First, the role of the machine in question
    is suddenly more important than that otherwise would be. More importantly, however,
    different distributions treat security very differently, even given support for
    the same roles.


    # The Features/Security Tradeoff


    Once you understand the role the machine in question is going to play, it is useful
    to understand the features/security tradeoff inherent in all operating systems.
    This tradeoff is simple: An operating system can have the latest-and-greatest
    features or it can be secure and stable, but generally not both. This dichotomy
    is especially pronounced in the Linux community.


    Before we look at specific Linux distributions, let''s look at the tradeoff a
    little more closely and discuss some examples.


    # Workstations Need Features


    When choosing a Linux distribution for use on the desktop as a workstation, it
    is generally features and speed that govern the choice. The average workstation
    will be connected to a number of input/output devices that are necessary for the
    work at hand. Input devices like sketchpads, printers, scanners, and digital cameras
    or camcorders are all examples of such devices. Either subsystems like parallel-port
    or USB support become important above and beyond all else.


    Unfortunately, because many of these devices are relatively new to the world of
    computing, for the particular device or devices you need to use with a workstation
    may not exist in Linux kernel releases a few months old. Old devices supported
    in user space, such as graphics adapters, may not be supported in older distributions.
    The X Window System (provided by XFree8) is constantly evolving to support the
    latest in graphics hardware. Thus, for exclusive desktop workstation use, the
    cutting-edge distribution is often the Linux operating system of choice. A distribution
    usually with the latest kernel, the latest version of the X Window System, the
    latest drivers, and the latest software. Workstation users are often easier to
    get the "point-off"releases—the "point-off" referring to the zero version numbers
    like 1.0, 2.0, or 4.0. At times, even pre-release (or, as some vendors call them,
    "technology preview") versions are useful for desktop workstations.


    # Servers Need Security and Stability


    The situation is markedly different when the machine in question will be a network
    server or infrastructure machine. Such machines are intimately involved with connections'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'and to from strangers in the outside world via the Internet. These types of
    machines can thus come into contact with some of the most dangerous or willfully
    destructive forces in the computing world. In these cases, security becomes very
    important, with speed coming in (a distant) second and features (a very distinct).
    This is especially true for network infrastructure machines like firewalls, whose
    sole purpose is to provide security and network functionality. USB support and
    the capability to use GIMP with a sketchpad are absolutely unimportant for a dedicated
    Web server or a domain name server. On the other hand, a few minor vulnerabilities
    or stability bugs are completely intolerable.


    Thus, for any role other than workstation, a point-off release isn''t a good idea.
    This kind of early release isn''t yet well tested; numerous bugs and vulnerabilities
    are likely to remain, and these won''t be fixed until the point-one, point-two,
    or later releases. In fact, many administrators have the general policy of using
    the final release of a generation for production machines. For example, if the
    current version of operating system Foo-Bar is 3.1 and the last pre-3.0 release
    was version 2.9, the server will be deployed with 2.9 because this is the “most
    fixed” version of 2.0 before new features were added for 3.0. While this doesn''t
    always hold true in the industry, it illustrates the point nicely.


    Similarly, ever distributions that have a reputation for staying on the bleeding
    edge can be a bad idea (though not necessarily) simply because they tend to include
    newer (and thus less-tested) features in the operating system.


    # Multipurpose Machines and the Tradeoff


    For the multipurpose machine, which might act as a server, a workstation, a firewall,
    or some combination of the three, the tension is obvious. It is up to you to decide
    which cutting-edge features or security or stability are more important for the
    tasks at hand. Here are some things to keep in mind:


    +   * Some features are convenient but not necessary. Though it is nice to support
    for features as universal serial bus or USB, it isn''t necessary. If your machine
    is more a server than a workstation, you may want to consider whether some features
    are really necessary. For example, USB printers and USB removable devices are
    common now, but parallel versions of these types of devices are also available
    at similar cost and are supported by well-tested kernels. On the other hand, USB
    support in Linux is still relatively new.

    * Some features aren''t needed at all. If the current kernel doesn''t support
    your hardware or the 3D capacity of your graphics hardware, but your machine is
    serving Web pages and handling e-mail and you only use it interactively for word
    processing and Web browsing, these features aren''t needed. If you''re worried
    about security, never go cutting edge to get features you won''t use.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Selecting and Installing a Linux Distribution


    +   * Earlier isn''t always better. In some cases, the cutting edge will actually
    have benefits. For example, cutting-edge kernel versions support your SCSI controller
    well, but earlier kernel versions are a little unstable with it, you may need
    to consider whether the added stability is worth a security tradeoff.


    +   * Being to invest in security. The only thing preventing you from using a
    distribution with 2.2.18 kernel instead of a pre-2.4.0 beta-test kernel is your
    previously unsorted sound card, which you desperately need for sound editing,
    simply by buying a sound card that will be compatible with the older and better-tested
    distribution. If you can save yourself a security-related headache by spending
    the cost equivalent of two pizzas, the money will be well spent.


    # Choosing from the Major Linux Distributions


    It is unfair to categorically classify each vendor and Linux distribution with
    respect to security and features, because each release from each vendor is its
    own animal entirely. A vendor that is conservative during one release may take
    a few risks with the next. However, there are some reasonably justified stereotypes
    and a few incontrovertible facts that can be applied when discussing Linux distributions.


    Of course, there are far too many Linux distributions to count, much less discuss
    in a single hour, we''ll stick to the majors in our text: Red Hat Linux (Mandrake),
    Caldera OpenLinux, SuSE Linux, Slackware, and Debian GNU/Linux (Core Linux).


    Note that in terms of the features/security tradeoff we were discussing earlier,
    this list is ordered from generally most feature-oriented to generally security-oriented.
    After reading each of these systems, it will be up to you to decide which distribution
    meets your needs, based on the role your machine is to play and the features you
    require. Again, keep in mind that these are only guidelines based on typical experience.
    Any particular release by any of these vendors can vary to some degree from past
    or future performance.


    # Red Hat Linux and Mandrake Linux


    Red Hat is the leading vendor, enjoying a true majority in terms of installation
    numbers across the Linux community. Over the years, Red Hat has established itself
    as an excellent workstation distribution (though this dominance isn''t exaggerated
    as it once was) by including more features earlier than any other vendor. For
    example, Red Hat was the first to ship a distribution based on the second release
    of the GNU C library with the Red Hat Linux 5.0 release. Most recently with the
    Red Hat Linux 7.0 release, Red Hat was first to market with XFree8 4.x support
    and system tools that are'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'ready for kernel 2.4. Unfortunately, both Red Hat Linux 5.0 and Red Hat Linux
    7.0 received mixed reviews from users, some of whom experienced few or no problems
    and some of whom experienced pronounced problems.


    Mandrake Linux is based on Red Hat Linux and thus shares many of the same benefits
    and liabilities. Generally, Mandrake Linux tends to fix many bugs and vulnerabilities
    present in the most recent Red Hat releases, but of course they also add a few
    of their own thanks to the modifications made.


    Red Hat Linux generally has not been secure when shipped; many services are enabled
    by default, and no default connection or filtering policies have been constructed
    out-of-the-box. On the other hand, users of these systems can make use of the
    Bastille Linux scripts to aid in closing security holes not related to bugs in
    the software. Bastille Linux can be found at http://www.bastille-linux.org. For
    those running Red Hat Linux, Red Hat keeps a current list of security advisories
    and updates at http://www.redhat.com/support/errata.


    To summarize, Red Hat and Mandrake are excellent cutting-edge distributions, but
    each will require attention of the book presents before a system is secure. Furthermore,
    it is vitally important that either of these systems uses the user on top of the
    updates available from the vendor Web sites, which repair security and stability-related
    programming errors in such cutting-edge software as they are discovered. The early-point-oh
    releases of Red Hat Linux unless you absolutely require a feature provided by
    such a release. You can read more about Red Hat Linux at http://www.redhat.com.


    # Caldera OpenLinux (eDesktop and eServer)


    Caldera has made its name what it calls “Linux for business” through corporate
    deals and on retail shelves. Either version of OpenLinux can be used as either
    a workstation or as a network server platform; the difference between the two
    lies primarily in third-party applications included with the eServer product and
    with the support options available.


    Caldera also has a history of innovation in the Linux community. Caldera is responsible
    for developing the original version of the RPM package manager, later to be made
    famous by Red Hat. Caldera introduced one of the first graphics-based installers
    (Lizard) and was the first major distribution to ship with KDE as the default
    desktop (OpenLinux 1.3).


    Caldera’s platform is among the most readily networked in the Linux community,
    shipping with all traditional services but also making available to customers
    some additional services such as OpenLDAP (a directory services protocol), SQUID
    (a proxy server), and NetWare for Linux.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Selecting and Installing a Linux Distribution


    In contrast to Red Hat, Caldera''s point-of-arch releases generally don''t make
    it into wider circulation to the degree that Red Hat''s early releases do. Caldera
    is also more conservative when it comes to including cutting-edge versions of
    critical system components. Thus, Caldera has a slightly better record in security
    and stability than does Red Hat. On the other hand, Caldera''s products also do
    not install with any default security policy, and there is no Bastille-comparable
    product for OpenLinux. For those using OpenLinux-based products, Caldera keeps
    an active list of security advisories and updates at http://www.calderasystems.com/support/security/.


    Security-conscious users should avoid Caldera''s Technology Preview products;
    these products are Caldera''s equivalent of beta-test software and are designed
    for testing purposes only. The features found in Technology Previews will generally
    find their way into official system releases once the bugs and vulnerabilities
    have been worked out.


    To summarize, OpenLinuxDesktop and eServer are network-oriented products with
    a reasonable record for security and stability. No default security policy exists,
    however, the user will need to pay attention to details in securing each system
    after install. You can read more about Caldera OpenLinuxDesktop and eServer at
    http://www.calderasystems.com.


    # SuSE Linux


    SuSE Linux was popular in Europe before becoming very popular in the U.S. It has
