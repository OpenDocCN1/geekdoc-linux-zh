  md: '# Linux Security Before Linux Is Loaded


    Most users associate the word “security” with operating system issues only—commands,
    configuration files, network access, remote crackers halfway around the world,
    and so on. Indeed, most serious attacks, including large-scale attacks that make
    news headlines, occur this way. So why concern ourselves with what happens before
    the operating system is loaded?


    The truth is that a large number of compromises also occur in the local context,
    meaning that the system is compromised by somebody who is sitting in front of
    it. Any sufficiently determined attacker can eventually compromise any system
    with which he is in physical contact. After all, throwing the Web server over
    the tenth-story window is one of the easiest ways to maliciously take it offline.
    Still, any steps you can take to increase the effort needed to access your data
    are helpful to your cause as the system administrator.


    Though these issues aren’t necessarily Linux-specific per se, they’re certainly
    part of a holistic approach to Linux system security. After all, what good security
    inside your computer never gets that far?


    # The System BIOS


    It’s true that the operating system is what really runs the computer, but have
    you ever wondered just how the computer knows to load an operating system in the
    first place? After all, it’s a complicated process. The display must be switched
    on, and the hard drive must be queried for the operating system software—in our
    case, Linux. After that, the operating system software must be started.


    All of the tasks that occur between power-on and the operating system’s final
    takeover are handled by software contained on a read-only memory chip on your
    computer’s main circuit board (also called the motherboard). The software in question
    is the Basic Input/Output System, or BIOS for short. Even though the list of BIOS
    tasks is short when compared to the number of tasks Linux will perform once it
    has been loaded, most BIOS programs are highly configurable. Nearly every PC made
    the last decade has a configurable BIOS, and it is with this BIOS configuration
    that we need to concern ourselves.


    Three major options are available in most modern BIOS programs that need to be
    audited and perhaps fixed with security in mind. They are BIOS password protection,
    boot password protection, and main BIOS boot order configuration. Before you can
    change them, however, you’ll need to enter your BIOS software’s setup mode.'
