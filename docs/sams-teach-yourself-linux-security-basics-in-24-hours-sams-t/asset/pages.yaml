- img_proc: true
  md: 'These two keys work together to encrypt and decrypt data. Data encrypted with
    the public key can be decrypted only with the private key, and conversely, data
    encrypted with the private key can be decrypted only with the public key. This
    enables two kinds of verification to take place.


    First, the members of the public who want to send a message to a specific person
    can encrypt the message or data in question with the person''s public key before
    sending it. Since only the person''s private key can decrypt the message or data,
    the sender is guaranteed that no one than the intended recipient, who has the
    private key, will see it in unencrypted form.


    In the other direction, a sender can also validate (sign) a message or data using
    his private key and send it to his friends or various members of the public at.
    When the recipients are able to decode the signature using the supposed sender''s
    public key, they can be assured that the message or the data did indeed come from
    the sender or data claims to be.


    There are really many more twists, turns, and features than this, this is the
    basic idea behind public key cryptography. PGP represents a kind of brute force,
    simple implementation of this concept.


    # Getting and Installing GNU Privacy Guard (GPG)


    The GNU Privacy Guard implementation of PGP is largely compatible with the various
    encryption algorithms implemented by commercial versions of PGP, with the exception
    of the IDEA algorithm, which remains under patent until the year 2007. RSA encryption,
    whose patent has recently expired, is now included in the standard GPG distribution.
    The GPG home page can be found at http://www.gpg.org.


    GPG can be downloaded from http://www.pgp.org/download.html. This text goes to
    press, the most recent version of GPG is 1.0.4, and one important security patch
    has been released. To install GPG, download both the gnupg-1.0.4.tar.gz file and
    the patch file, gnupg-1.0.4.security-patch1.diff.


    Extract the GPG source and apply the patch, then run the configure script in the
    GPG source tree. The default installation options are adequate for most users.
    After running configure on the patches source, run make and then install to install
    the GPG binaries and other components.


    ```

    $ xzf gnupg-1.0.4.tar.gz

    $ cd gnupg-1.0.4

    $ patch -p1 ../gnupg-1.0.4.security-patch1.diff

    patching file g10/mainproc c

    ```'
