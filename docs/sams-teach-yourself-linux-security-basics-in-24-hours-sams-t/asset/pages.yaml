    Once you have followed these steps, you have a complete installation of the Kerberos

    baries in the /usr/local/kerberos tree. It''s time to proceed to configuration.


    Kerberos uses a few ports for key distribution and administration, among other
    things, so

    the first order of business is to add a few lines to the end of the /etc/services
    file.

    Rather than entering them by hand, it is easiest to use the services.append file,
    located

    in the src/config-files directory of the Kerberos source tree:


    ```

    # cat config-files/services.append >>/etc/services

    ```


    Some Linux distributions include entries in /etc/services for Kerberos, but

    these are often incorrect or are for Kerberos 4, be sure to remove any existing
    entries

    that match either port or protocol name before adding these new entries.


    Next, you need to create a few directories in the /usr/local/kerberos hierarchy

    that are necessary for Kerberos configuration:


    ```

    # cd /usr/local/kerberos

    # mkdir etc var/krb5kdc

    ```


    In the newly created /usr/local/kerberos/etc directory, you''re going to create
    two

    configuration files: krb5.conf and kdc.conf. You''ll need the name of your domain
    and

    treal realm you plan to use. For example, if your current host is kdc.myn.net,
    then

    your domain is mynet.net, and your realm, by convention, is MYNET.NET (case-sensitive).

    wo sample configuration files are shown in Listings 17.1 and 17.2.


