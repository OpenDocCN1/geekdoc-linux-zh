  md: 'rule A list of criteria that, when applied, instruct the kernel to discard
    or accept one specific group, family, or source of network packets.


    state-based matching A new kind of rule matching introduced with kernel 2.4 that
    allows packet filtering based on the context of the packet''s use, rather than
    just on source or destination IP address or protocol type.


    tables A way of incorporating the functionality of a number of programs into a
    single program, iptables, by allowing for multiple lists of chains that are applied
    or not applied based on the filtering or translation task at hand.


