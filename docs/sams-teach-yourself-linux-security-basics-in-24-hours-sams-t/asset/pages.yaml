  md: '# New Terms


    **chain** A list of rules that are applied for a given context. Three chains are
    automatically defined at all times: input, forward, and output.


    **packet filtering** A kernel feature that allows incoming network packets to
    be discarded based on a number of administrator-supplied criteria.


    **port forwarding** A method for allowing packets reaching a port on an external
    interface to be forwarded to the same port on an internal interface, thereby allowing
    network services to be provided from behind a firewall.


    **rule** A list of criteria that, when applied, instruct the kernel to either
    discard or accept one specific group, family, or source of network packets.


