  md: '# HOUR 5


    # System and User Fundamentals


    This hour, we''re going to tackle three major tasks that can best be thought of
    as security-oriented system administration fundamentals. They aren''t necessarily
    the most exciting things you''ll learn, but they are important nonetheless and
    should be covered before the more-service-specific information contained in later
    hours.


    First, we''re going to create or edit three important configuration files related
    to user security in the general sense. Then we''ll streamline the daemon and server
    init process, learning to edit the directories responsible for starting the services
    in question. Finally, we''ll take a look at user accounts and learn how to create
    accounts with an emphasis on security.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_86_0.png)'
