  md: '# New Terms


    **back door** A vulnerability put in place by an intruder who has compromised
    your system. This vulnerability can then be used in the future to gain access
    to your system again.


    **root kit** In a sense, a root kit is like a complicated back door. It is a series
    of files put in place by an intruder for devious ends, often in such a way as
    to disguise the changes that have occurred.


    **rotating backup** Scheduled backups occurring not only on a single tape but
    on a series of tapes in rotation.


    **scheduled backup** A periodic backup run by CRON or some other periodic execution
    daemon.


