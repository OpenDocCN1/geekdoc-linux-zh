- img_proc: true
  md: '# Network File System (NFS) Security


    Because NFS has been around so long, and because NFS, in configuration terms,
    is so simple, it is a very good security compromise of the type we are seeking
    in this text. On the one hand, because of its design, NFS can never be perfectly
    secured. Because of this, it shouldn''t be run on extremely sensitive systems
    or on a primary firewall. Whenever possible, it should be run only for a local
    network residing behind a firewall machine.


    On the other hand, with judicious use of packet filtering to keep NFS inside your
    net-work, careful construction of the /etc/exports file, and wise choice of your
    NFS server, NFS can easily be secure enough for most small to mid-size businesses.


    # Selecting an NFS Server


    There are two NFS servers for Linux: an older user space daemon and a newer kernel-based
    NFS daemon. Both are still widely used and supported, but there are two important
    reasons why the kernel-based NFS implementation should be the implementation of
    choice for security-conscious users.


    The first and most important reason is for the (admittedly kludgy) capability
    to operate more or less correctly with file systems that are locally enhanced
    by the addition of Access Control Lists (ACLs). While the interoperability is
    far from, the kernel-based version is automatically patched by the ACL patches
    to make conservative decisions about granting access based on local ACL information
    and won''t choke on ACL data or lose data because of ACLs. The user space NFS
    daemon, on the other hand, will require additional patches, recompilation, and
    re-installation; is known not to work correctly in many incarnations with ACLs;
    and may even lose data or grant access incorrectly to data that have been restricted.
    The kernel-based daemon also supports NFS version 3, which fixes many of these
    problems without the need for additional patching.


    The second reason for wanting to choose the kernel-based NFS implementation is
    the speed improvement that many users will see when choosing the kernel-based
    NFS implement-mentation over older user space NFS daemons. The user space NFS
    daemon has traditionally been much slower and CPU bound than kernel-based implementations.


    # Including Kernel-Based NFS Support


    NFS support is included in both the 2.2 and 2.4 versions of the Linux kernel.
    The options necessary to include kernel-based NFS server support in the Linux
    2.2 kernels are found in the Network File Systems submenu of the File Systems
    section. They are shown in Table 14.1.'
  merge: -1
  pgno: 227
