  md: '# TABLE 16.1 continued


    | Option | Description |

    | --- | --- |

    | PermitEmptyPasswords | Specifies whether authentication will be provided for
    accounts with an empty password string. Should be set to no for any secured system.
    |

    | PermitRootLogin | Specifies whether users claiming to be root will be authenticated.
    Should be set to no for any secured system. |

    | RequireReverseMapping | Specifies whether a connecting system''s IP number must
    match its DNS entry. Should normally be set to yes for any secured system. |


    The ssh2 client is located by default at /usr/local/bin/ssh2 and is responsible
    for initiating outbound ssh2-encrypted connections. Though the default set of
    behaviors is usually adequate, there are a few additional security-oriented options
    that can be changed by editing the /etc/ssh2/ssh2_config file.


    The format of /etc/ssh2/ssh2_config is virtually identical in many ways to the
    format of the /etc/ssh2/ssh2_config file; the file is composed of a number of
    keyword/value pairs, one pair per line. Empty lines or beginning with the hash
    mark (#) are assumed to be comments and are ignored.


    Some additional ssh2 options that may be helpful to you are shown in Table 16.2.
    The complete list of ssh2 configuration options is documented exhaustively in
    ssh2_config(5).


    # TABLE 16.2 Common Options for the ssh2_config File


    | Option | Description |

    | --- | --- |

    | Compression | When set to yes, causes the encrypted data stream to be compressed
    on-the-fly. This option is most useful for low-bandwidth connections, but can
    also slow things down on machines with very slow CPUs. |

    | EscapeChar | Supplies the character that can be used to interrupt SSH sessions.
    The word none disables the escape character. Control key combinations can be given
    by prefixing an alphanumeric character with the caret (^) character. The default
    is the tilde (-) character. |

    | User | Specifies the default username to use when connecting to remote SSH servers.
    Optional; this can be useful if your username on the local machine is different
    from your username on the remote machine. |


    Once you have installed SSH on at least two machines and are satisfied with any
    changes you''ve made to your SSH configurations, it''s time to put SSH to work.'
