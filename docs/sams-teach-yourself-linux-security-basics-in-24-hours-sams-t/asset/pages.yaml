    Although this script is simple and provides no defenses against “bad” users on
    the internal network, it is reasonably secure with respect to the outside world
    while at the same time avoiding unnecessary complexity.


    You might have also noticed that this iptables configuration doesn''t allow for
    incoming connection requests for most services on the local machine. For example,
    it doesn''t allow the local system to run an FTP server. It''s generally a bad
    idea to allow connection requests for services that aren''t going to be made available.
    Rather than enabling packets for every possible service, you should add lines
    as necessary to allow incoming requests for every service you plan to use. Remember
    to use /etc/services as your guide.


    # Summary


    In this hour, we learned the basics of IP firewalling, packet filtering, and forwarding
    with Linux 2.4 kernels using the iptables utility. Specifically, we covered


    +   - The list of kernel options necessary to make use of the iptables utility
    and various types of network address translation.

    - The basic logical process behind the functionality of the iptables command.

    - Construction of a simple yet reasonably secure ruleset that also enables network
    address translation when a machine is acting as the gateway between an internal
    network and an external one.

    - Simple-case port forwarding, such as when running a Web server from behind the
    firewall.'
