  md: '# Starting SWAT


    Since SWAT uses its own built-in Web server, you do not need to have Apache or
    another HTTPD service running in order to use SWAT.


    Once it has been installed, you can log in to SWAT on the local host simply by
    starting your browser (usually Netscape) and typing the following into the URL
    box:


    ```

    http://127.0.0.1:901

    ```


    This URL opens a connection to the local host on port 901, the port being used
    by SWAT. You''ll be asked to provide a username and a password; you should log
    in as root and provide the necessary password. If you find this isn''t working
    for you, troubleshoot based on the following steps:


    +   - Make sure that an entry for SWAT exists in the /etc/services file using
    grep swat /etc/services.

    - Make sure that an entry for SWAT exists in the /etc/inetd.conf file by using
    grep swat /etc/inetd.

    - Check if you have ipchains or iptables rules that may be preventing connections
    on the loopback interface on port 901.

    - Make sure that there are no entries in /etc/hosts.allow or /etc/hosts.deny that
    would prevent SWAT access under your particular circumstances.


    If you find that the problem is the first or second item in the preceding list
    (no SWAT entries in either /etc/services or /etc/inetd), SWAT hasn''t been installed
    on your system. Systems distribute Samba and SWAT into two separate packages,
    so look for a SWAT package and install it.


    If you''re not able to find a SWAT package anywhere for your distribution, there
    are no SWAT entries in /etc/services or /etc/inetd, and there is no SWAT binary
    anywhere on your system, you may want to consider downloading Samba from www.samba.org
    and re-installing it from scratch.


    > Because SWAT doesn''t use a secure (encrypted) connection, you may want to avoid
    using it from any location outside your internal network. If your network isn''t
    behind a firewall, it''s a good idea to prevent access from any remote host altogether.


    Regardless of how you decide to use it, it''s important to remember prevent all
    types of unauthorized access. To do this, edit your /etc/hosts.allow and /etc/hosts.deny
    files as necessary.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_233_0.png)'
