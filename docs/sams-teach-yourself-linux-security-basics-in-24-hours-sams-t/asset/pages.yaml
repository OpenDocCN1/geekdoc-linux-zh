  md: 'host-based authentication A method of authenticating an incoming connection
    in which the connecting system’s address, domain, or hostname is compared against
    a list of permitted systems.


    KDE Display Manager (kdm) An xdm-compatible display manager included with the
    K Desktop Environment.


    magic cookie A kind of randomly generated connection password that both sides
    must know for a connection to be established. Magic cookies are stored in an authentication
    file and managed by the xauth command.


    token-based authentication A method of authenticating an incoming connection in
    which the X server challenges the connecting system to provide a magic cookie
    for the session. If the remote user is unable to supply the correct magic cookie,
    the connection attempt is rejected.


    X Display Manager (xdm) A daemon that makes management of X access to networks
    much easier by automating tasks like magic cookie generation and exchange.


    X Display Manager Control Protocol (XDMCP) A protocol used by xdm for administering
    multiple X client/server sessions.'
