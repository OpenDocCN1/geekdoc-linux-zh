- img_proc: true
  md: '# Recovering from Attacks


    Nearly all Linux components are free software maintained by open source developers
    who depend on problem reports from real-world users to keep the software functioning
    and safe. They''ll be happy to hear from you, and you may get the problem fixed
    more quickly than it otherwise would have been.


    # Pay Special Attention to Repeat Visitors


    Before taking the system back online again, there is one last step you may want
    to take: snoop a little more on the port of entry involved in the attack. Though
    many script kids will never return, some, and you may be able to get additional
    information on a second time. For example, you might get an IP number you weren''t
    able the first time, which will help you put an end to your activities.


    Configure TCP wrappers or Snort with some very strict logging rules. In the case
    of TCP wrappers, you may even want to consider booby trapping the port or service
    involved so that attempts from certain hosts or networks result in identification
    attempts on your part. More information on these types of tactics and techniques
    can be found in the snort(1) and hosts.deny(5) manual pages.


    # Go Back Online


    Once everything is in place again, it''s time to take the system back online.
    Be sure that all of the security tools are in place, if applicable, and consider
    making a backup of your clean system as a final step, in case there are any unforeseen
    problems (damaged disk BIOS memory, for instance) that force you to start yet
    again.


    Try to play the optimist. You may have been compromised, but you have gained valuable
    experience. In addition, by contacting the violator''s provider and the software
    developers involved, you''ve helped others who may have been subject to the same
    attack.


    # Summary


    This hour, you studied a basic roadmap that you need to follow if you find that
    a system under your administration has been violated:


    +   - Pull the system offline immediately so that no further damage can occur
    and any criminal activity your system may be involved with is stopped.


    +   - Reboot Linux into single-user mode. Even with the network down, bad things
    can still be running and happening. Put and end to them and get the machine restarted.'
