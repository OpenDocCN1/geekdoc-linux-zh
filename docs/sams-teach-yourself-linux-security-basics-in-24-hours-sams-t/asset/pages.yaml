    this series of tasks represents enough security.


    # This Book Is Organized


    The 24 lessons in this book are divided into several parts and can be followed
    from beginning to end coherently. However, certain users may find that they can
    skip some of the individual lessons—for example, how users with a single PC and
    nothing more can skip the lesson on Kerberos authentication—but each of the four
    major parts of the book contains something of importance to you as a Linux and
    Internet user, regardless of how you use your system.


    The lessons in Part I, “Basic Security for All Roles,” discuss some security fundamentals
    not related to service networks or role-specific types of security needs. This
    section contains information that is both the simplest and the most overlooked
    when installing and configuring a Linux system. Physical security (hardware and
    location), operating system-independent security issues, Linux installation, booting,
    accounts, passwords, file permissions, and TCP wrappers (the most basic form of
    network security) are all covered in this part of the book.


    The lessons in Part II, “Network Security,” discuss issues related to using Linux
    in networked environments and especially to using Linux as a small server for
    various types of data services. Firewalling and packet filtering, Kerberos authentication,
    security related to individual network service including Web service, and security
    for X116 displays and data streams are covered in this part of the book.


    The lessons in Part III, “Data Encryption,” go a step forward and walk through
    the process of encrypting your sensitive data. You''ll learn to encrypt any data
    stream traveling into or out of your computer system or network, using the SSH
    secure shell and its tunneling capabilities. Part III also includes lessons on
    providing encrypted (secure) Web sessions, encrypting your local file system using
    two tools, and encrypting your e-mail using PGP (Pretty Good Privacy) and GNU
    Guard.


    The lessons in Part IV, “Intrusion Detection, Auditing, and Recovery,” will help
    you fortify the changes you''ve made to your system in the previous lessons. You''ll
    learn to audit'
