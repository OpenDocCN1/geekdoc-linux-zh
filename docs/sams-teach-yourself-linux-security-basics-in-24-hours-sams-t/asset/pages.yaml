- img_proc: true
  md: 'Even services like the auto-mount daemon, amd, which is responsible for allowing
    Linux to automatically access CD-ROM drives and floppy drives without manual mounting,
    have been the cause of complete system promises. Though updates to problem services
    are generally made available quickly through distribution vendors once problems
    are discovered, you should view each service as a potential violation.


    In short, if you don''t absolutely need it, turn it off.


    To determine which scripts are necessary and which are not, you need to be able
    to identify the service and the role of the service related to each script. Some
    of the common scripts are shown in Table 5.1.


