  md: '# Securing X11R6 Access


    If you want to add this cookie to a other file than the file located $HOME/.Xauthority,
    you need to supply the -f argument to the xauth command:


    ```

    xauth -f /etc/xac add station-john:0 . $(+S%M%H%%%y%d%m)

    ```


    To remove an existing cookie from an authentication file, use the remove argument
    along with the string matching an existing entry. For example, to remove the cookie
    just added for station-john, use


    ```

    xauth -f /etc/xac remove station-john:0

    ```


    It is a very good idea to remove magic cookies from the cookie file when you are
    done with them. To extract the magic cookie for a given host, use the extract
    argument. For example, to write the magic cookie for station-john to a file called
    cookie.auth, use xauth extract cookie.auth station-john:0


    If the name of the output file is a dash (-), the cookie will be sent to standard
    output, where it can be redirected or piped as necessary. To merge a supplied
    cookie into an existing authorization file, use the merge argument. For example,
    to merge a cookie from the cookie.auth file into the authorization file at /etc/xac,
    you''d use xauth -f /etc/xac merge cookie.auth


    If the name of the input file is a dash (-), the cookie will be read from standard
    input and then incorporated into the authorization file.


    # Starting the X Server


    Once you have created the magic cookie for a system and display, starting the
    X server with token-based authentication is a simple matter. Simply supply the
    -auth argument to the server, followed by the name of the file containing the
    authentication tokens. For example, any of the following may be correct, depending
    on the particulars of your installation and the circumstances surrounding the
    server''s launch:


    ```

    X -auth /etc/X11/global-cookies

    xwrapper -auth $HOME/.Xauthority

    startx -- $HOME/.Xauthority

    ```


    All of these commands have the same effect: They launch the X server and instruct
    it to use the supplied cookie file for token-based authentication. The server
    has been started this way, it will be able to challenge connection requests for
    the magic cookie before access is granted.


    # Distributing the Cookie


    Once the server has been started with token-based authentication, it is important
    that the cookie be supplied to those users or accounts that should have access
    to the running X server. The easiest way to do this is to use the extract and
    merge arguments with'
