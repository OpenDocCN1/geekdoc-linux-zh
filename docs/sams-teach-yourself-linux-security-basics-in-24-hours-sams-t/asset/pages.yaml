  md: '# New Terms


    **Certificate Authority (CA)** A trusted third party with a well-known public
    key who can vouch for the validity of a Web server’s identity certificate. In
    general, listing a Web server with a Certificate Authority is a costly step, so
    many smaller sites choose instead to use a self-signed certificate, which is less
    secure.


    `mod_ssl` An addition to the Apache source code that relies on the OpenSSL library
    and implements SSL capability in the Apache Web server.


    **Secure Sockets Layer (SSL)** A group of protocols and specific interactions
    implemented by Web browsers and Web servers to allow for the authentication of
    the hosts involved and the negotiation of an encrypted data stream.


    **site certificate** A block of data used for encryption and identification purposes
    by an SSL-enabled Web site and any party connecting to it. For best security,
    a site certificate should be signed by a Certificate Authority so that the authority’s
    public key can be used to verify the validity of the certificate.'
