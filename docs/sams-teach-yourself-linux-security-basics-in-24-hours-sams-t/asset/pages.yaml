  md: '# Extra File System Security Tools


    One final note should be repeated here. Although ACL data will not hurt or damage
    the ext2 file system in any way, and an ACL-enhanced file system will function
    correctly with non-ACL-enhanced kernels or ext2 utilities with regard to ACL permissions,
    the ACL software adds an argument to the /sbin/e2fsck binary. - X argument will
    purge all ACL data from an ext2 file system. Thus, in order to completely remove
    all ACL metadata from a file system,


    ```

    /sbin/e2fsck -X /dev/hddevice

    ```


    Other than purge-ACL permissions from the file system in question, there will
    be no visible effects on the files present. All Linux-style (that is, user, group,
    and other) permissions will be preserved in such a purge.


    # Secure File Deletion Tools


    You can probably imagine a situation in which it would be a disaster if a hacker
    or even a normal user were to obtain data from a previously deleted file. Most
    users assume that when a file is deleted, it is gone forever. Unfortunately, this
    isn''t the case. The data is no longer accessible via the same filename, but it
    might actually remain intact on the raw disk device for days, weeks, or months
    before being overwritten by new data. Even after data is overwritten, it might
    still be recoverable using special tools and knowledge.


    Clearly, it is important to destroy data that needs to be destroyed. In such,
    permanent deletion tools can be thought of as a paper shredder for your Linux
    files. The command traditionally responsible for this functionality is the wipe
    command. (wipe is not included with most versions of Linux.) There are several
    versions of wipe for Linux that can be downloaded and compiled.


    Perhaps the simplest and quickest, bcwipe, is available from http://www.jetico.com.
    The bcwipe utility is not open source, but code is available, and the utility
    is for non-commercial use. It works by rewriting data to wipe with different patterns
    and random data a number of times to ensure that the original data is completely
    wiped. The bcwipe utility can also operate on entire block devices, for example,
    if you need to erase an entire hard disk.


    The open source secure deletion utility called wipe is available from http://sourceforge.net.
    It functions similarly in principle to bcwipe but lacks the capability to erase
    partitions or devices and is not portable as bcwipe seems to be. If you have problems
    compiling wipe, you might also want to look into bcwipe.


    Another open source secure deletion utility called overwrite boasts similar features
    and can be downloaded from http://www.kyuzz.org/antirez/overwrite.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_148_0.png)'
