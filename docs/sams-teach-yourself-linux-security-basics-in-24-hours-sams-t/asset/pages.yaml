  md: "# LISTING 11.1 Sample iptables Script\n\n```\n#! /bin/bash\n\n# Clear out all\
    \ existing rules and user-created chains\nfor TABLE in filter mangle; do\n iptables\
    \ -t $TABLE -F\n iptables -t $TABLE -X\ndone\n\n# Add your own IP here\nMYIP=\n\
    \n# Add your internal network mask here if applicable\nINT=192.168.1.0/24\n\n\
    # Add your Web server's address here if applicable\nWEB=192.168.1.14\n\n# Edit\
    \ to reflect your network\nINTERNAL=eth1\nEXTERNAL=eth0\n\n# Allow any traffic\
    \ that we initiated\niptables -t filter -A INPUT -m state \\\n--state ESTABLISHED,RELATED\
    \ -j ACCEPT\n\n# Find the namesvers in /etc/resolve.conf; allow lookups\nfor DNS\
    \ in $(grep 'n' /etc/resolve.conf|awk '{print $2}'); do\n iptables -t filter -A\
    \ INPUT -p udp -s DNS \\\n--source-port domain -j ACCEPT\n# Allow incoming Web\
    \ if necessary\nif [ \"$WEB\" = \"\" ]; then\n iptables -t filter -A INPUT -p\
    \ tcp \\\n--source-port - -j ACCEPT\nfi\n# Deny log everything else that isn't\
    \ on logon\niptables -t filter -A logdeny -j LOG \\\n--log-prefix \"iptables\"\
    :\n iptables -t filter -A logdeny -j DROP\n\niptables -t filter -A INPUT -i lo\
    \ -m state \\\n--state NEW,INVALID -j logdeny\n\n# Now, enable network address\
    \ translation if necessary\nif [ \"$INT\" = \"\" ]; then\n echo 1>/proc/sys/net/ipv4/ip_forward\n\
    \ echo 1>/proc/sys/net/ipv4/conf/all/rp-filter\n if [ $EXTERNAL = pp0 ]; then\n\
    \ iptables -t nat -A POSTROUTING -o $EXTERNAL\n```"
