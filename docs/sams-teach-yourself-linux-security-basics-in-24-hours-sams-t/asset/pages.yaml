- img_proc: true
  md: '# Securing X11R6 Access


    included with nearly all X installations and is now installed and run by default
    on many Linux installations.


    When launched, XDM automatically generates a magic cookie and starts the X server
    with token-based authentication. The xdm process then provides a graphical login
    screen instead of the traditional text-based login. When a user logs in to the
    X session, his $HOME/.authority file will be updated automatically to contain
    the magic cookie for the local X server. When he logs out again, the cookie will
    be removed.


    Even remote X sessions can be further automated, using an additional option to
    the X server, the string -query followed by the name of the host on which xdm
    is running. For example, nearly all of the clients on your local X server will
    be connected from the host foobar, which is running xdm. You can start your local
    X server as follows:


    ```

    X -query foobar

    ```


    This will cause the local X server to initiate cookie exchange with your account
    foobar automatically, and then you will be able to log in to the X session securely
    as if it were running on foobar, as shown in Figure 15.2.


    FIGURE 15.2

    X Display Manager in a queried session.


    ```

    mysys.mynet.com


    login:

    Password:

    ```


    For more information on using xdm, see xdm(1).


    # X and Packet Filtering


    Many X servers (including the XFree86 server) include no functionality to dictate
    the ports on which the X server will operate. The XFree86 server used most commonly
    on Linux simply begins looking for an unowned port at 6000 and continues upward
    until it finds one. It is important to ensure that you that at least one port
    in the 6000 range is open for X to use and that your filtering rules take this
    into account if you want to allow networked X use on a filtered machine.


    Also important for networked X is port 177, which is used by the XDMCP protocol
    to manage connection authentication. Packet filtering rules that allow for networked
    X via ipchains and iptables are shown in Listings 15.2 and 15.3.'
