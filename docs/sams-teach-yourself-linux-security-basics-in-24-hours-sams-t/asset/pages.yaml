  md: '# SAMS Teach Yourself Linux Security Basics in 24 Hours


    # Get Started Now!


    24 proven one-hour lessons


    In just 24 lessons of one hour or less, you will be up and running with a secure
    Linux network. Using a straight-forward, step-by-step approach, each lesson will
    build upon the previous one, enabling you to learn the essentials of Linux security
    from the ground up.


    # Learn how to...


    +   - Configure basic TCP/IP security using TCP wrappers and packet filtering.

    - Secure network services like Samba, Sendmail, Apache, NFS, and BIND.

    - Encrypt network streams, X11R file system data, and text (e-mail) data.

    - Protect network traffic with the Secure Shell (SSH).

    - Add Secure Sockets Layer (SSL) capability to the Apache Web server.

    - Secure authentication across your network with Kerberos.

    - Detect and recover from malicious network activity.

    - Protect files from unauthorized access using access control lists (ACLs).


    +   Tips point out shortcuts and solutions


    +   Notes clarify concepts and procedures in a straightforward manner


    +   Cautions help you avoid common pitfalls


    Aron Hsiao is a computing entrepreneur and network consultant with a background
    in Unix-like operating systems stretching back to the mid-1980s. He has spent
    time both as an independent contractor and a professional, working in computer
    hardware and software retail, real-time software development, network deployment,
    Internet development, and Internet marketing. Aron has also worked as a volunteer
    in many of different computer-related and educational capacities in his local
    area. He served as the About.com guide to Linux from 1997 to 2000 and is the author
    of The Concise Guide to XFree86 for Linux.


