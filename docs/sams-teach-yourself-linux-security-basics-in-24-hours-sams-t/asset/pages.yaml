  md: '# HOUR 1


    # Selecting and Installing a Linux Distribution


    In our first hour, we''re going to perform a security-minded Linux installation.
    Before we hit the power switch, however, there are two steps that must be performed
    first: a distribution must be selected, and the role of the machine in question
    must be clearly defined. We''ll discuss the latter first.


    # Establishing the Role of the Machine in Question


    Before you can install Linux or even select the distribution that matches your
    needs, you must understand, on a fundamental level, what the machine in question
    will be doing for you. There are four primary roles for machines in small businesses:


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_26_0.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   Workstation A workstation is a machine that primarily will be used by a
    single local user for running applications, often under the X Window System. This
    includes tasks such as Web development (not serving or deployment), word processing
    and spreadsheets, graphic design, and other processes that require human interaction
    on a regular basis.


    +   Server There are a number of different types of servers. Network or Internet
    servers typically handle services like HTTP requests (Web), SMTP requests (e-mail),
    NNTP requests (net news), and other Internet-oriented protocols. File servers
    support NFS (Unix), SMB (Windows), or other systems for providing primary storage
    across a local area network. Database servers are more rare in small business
    settings and provide extensive data storage, retrieval, and manipulation capabilities,
    using a relational database like Oracle or IBM’s DB2. Larger servers or servers
    in very small environments can even handle all of these functions simultaneously.
    Regardless of the type of server in question, however, the basic concept behind
    a server is the same: Servers are primarily for providing services across a network,
    whether the network in question is a local area network or at the Internet.


    +   Infrastructure A network infrastructure machine’s primary role is to facilitate
    the functionality of the local network. Among such machines are firewalls and
    routers, which allow machines in local area networks to share a connection (such
    as a modem, cable, DSL, or T1 connection) to the local Internet. These types of
    machines provide security and either network translation or IP masquerading for
    machines on the inside. Also in this category are DNS (domain name server) and
    machines that provide directory services or authentication services (as is the
    case with Kerberos).


    +   Multipurpose Clearly, average small business doesn''t have the resources to
    shell out for a separate Web server, file server, firewall/router, and workstation.
    This is even more true for the average household. Thus, multipurpose machines
    are also very common. The multipurpose machine may act as its own firewall with
    packet filtering, providing routing services for one or two workstations, and
    serve Web pages to the outside world (the Internet) and files to a local area
    network.


    Before installing Linux, it is necessary that you understand which of these descriptions
    apply to the machine or machines in question, the expected role (or combination
    of roles) of the machine will directly influence the choice of distribution and
    the combination of options and preferences that will apply while installing it.'
  merge: -1
