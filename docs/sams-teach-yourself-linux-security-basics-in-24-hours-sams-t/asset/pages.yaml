  md: '# File System Security


    System administrators tend to be more fond of the numeric mode of chmod because
    it is quicker and more obviously related to the format of umask (which we''re
    going to discuss in the next section), while users tend to prefer chmod symbolic
    mode because it more closely resembles the output of the `ls -l` command.


    # Using umask to Set Default Permissions


    Clearly, the permissions given to various files throughout the system have a great
    effect on the security of data owned by any given user. However, it would be annoying
    (and nearly impossible) to set permissions explicitly on every file in a system,
    one by one, and then to maintain such discipline for new files as each file is
    created. Distribution vendors and package maintainers have already taken great
    pains to correct permissions for various system files when they are installed
    to set defaults. Therefore, it is generally not necessary to step through all
    of a Linux system one by one, setting permissions by hand.


    Luckily, it is also possible to create a default setting for new file within scripts
    or user accounts. This is done via the umask command. To see your current umask
    value, enter this command without arguments:


    ```

    # umask

    137

    #

    ```


    This indicates that the current default umask value for this user''s shell environment
    is 137. As is the case with chmod''s numeric mode, this value is a series of three
    numbers that represent user permissions, group member permissions, and other user
    permissions.


    Notice, however, that these values do not seem to make sense in context. A chmod
    value of 137 would cause new files to have only execute permissions for the user,
    write and execute permissions for members of the group, and full permissions (no
    security) for everyone else.


    In reality, this is because umask values are inverted with respect to the chmod
    values listed in Table 7.1. That is, while chmod specifies which permissions to
    add, umask specifies which permissions to remove. Thus, a umask value of 137 specifies
    the following:


    +   - The user should only have execute permissions removed by default from a
    newly created file.

    - Members of the file''s group should have execute and write permissions removed
    by default from a newly created file.

    - Other users should have all permissions removed by default from a newly created
    file.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_124_0.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'For example, a umask value of 137 means that any newly created file in the
    shell environ-ment will have the following symbolic permissions in ls-style output:


    ```

    -rw-r-- -

    ```


    For security purposes, it is desirable to remove all non-user permissions from
    newly cre-ated shell files. Thus, the user will have to add permissions manually
    via chmod if extra permissions should be granted. The umask value that accomplishes
    this is 177, which results in symbolic permissions like this:


    ```

    -rw-r----- -

    ```


    With permissions like this, only the file''s user will be able to read from write
    to operate on the file whatsoever. The user can easily change this via chmod if
    desired, but the default creation permissions remain more secure. To set the new
    umask value, simply pass 177 as an argument to the umask command:


    ```

    umask 177

    ```


    Of course, entering the command this will affect the umask value in the current
    shell only for as long as the shell is running. When the shell is exited, the
    changes will be lost and all new invocations of the shell will have the original
    umask value. To make the changes permanent, you will need to append the umask
    command to the /etc/profile file, which bash each time it is launched:


    ```

    echo ''umask 177'' >>/etc/profile

    ```


    All login shells will now by default have a umask of 177 when the user begins.


    > When making changes to this file using the shell append (>>) operator, be sure
    to include both greater-than symbols, without extra space between them. The following
    two commands are very different:

    echo ''umask 177'' >>/etc/profile

