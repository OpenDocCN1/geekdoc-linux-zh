  md: '# Physical Security


    +   Invest in a continuous power system


    When possible, invest in a continuous power system (or battery backup, as they
    are sometimes called) to mitigate the problem in the case of unexpected power
    failure. Even if you''ve locked your box tightly, you''re helpless if the power
    company decides to work on your block''s main line for an hour, cutting the power
    in the process. Having a solid, regularly tested continuous power system online
    can keep service up through any minor brownouts and give you time to notify users,
    shut down, and prevent data loss in the event of a sudden blackout.


    All of these steps should be combined with a holistic attitude toward computing
    environment. Be mindful of the physical circumstances surrounding your equipment
    and of the public at large as a potential danger. It is time to think of security
    in terms of your computer''s physical components, in addition to its cyber-existence.


    # Strategies for Difficult Locations


    Unfortunately, not every computer is sequestered in a locked room. Some machines
    must even be available for unattended public use. Though this is risky, there
    are some steps that can be taken to improve security and reduce the odds that
    service interruptions or data loss will occur.


    # The Power Cycle


    The simplest form of physical attack against a publicly accessible system is a
    power cycle—the unexpected loss of power to the system, resulting either in a
    reboot or unintended “off” time. Incidents of this kind usually aren''t malicious,
    but are caused by clumsy or unaware users or visitors to your place of business
    or by unaware children in your home.


    This type of incident is generally caused by easy access to reset and power buttons,
    which lie on the front of most computer cases and can be triggered by a stray
    elbow, finger, purse, or other solid object. There are several possible solutions
    to the power cycle issue, each slightly more severe than the one before:


    +   Politeness The most common method for small businesses to handle this problem
    seems to be place a note over the switch in question that says “Do NOT hit this
    switch!”


    +   Prevention In spite of the fact that it is the most popular solution, simple
    politeness is a bit silly in this context. A more proactive step is also sometimes
    seen as the placing of strong tape over the switches in question alongside the
    note.'
