  md: 'In theory, all these utilities will prevent a malicious user or organization
    from collecting data from your storage devices that you had thought was deleted
    and unrecoverable. They represent an important component in file system security,
    and you should always take care to securely delete any files you want completely
    removed, rather than simply deleted, from your Linux file system.


    # # Summary


    In this hour, we looked at a POSIX-compliant extension to the Linux permissions
    system security model, known as an access control list. Using access control lists,
    we learned to do the following:


    +   - Download and install the POSIX ACL implementation for Linux and ext2.

    - Add multiple users and per-user permissions to the ACL properties list for a
    Linux file or directory.

    - Add multiple groups and per-group permissions to the ACL properties list for
    a Linux file or directory.

    - Remove users or groups from the ACL properties list for a Linux file or directory.

    - Understand and set default ACL permissions for a Linux directory.

    - Understand and use the ACL permissions mask to control maximum permissions for
    all ACL properties applying to a given file or directory.


    We learned about so-called delete tools or permanent delete tools, which actually
    erase data being deleted on a hard drive, rather than simply marking space as
    available once again.


    # # Q&A


    +   - Which set of permissions is effective in the event that normal permissions
    and ACL permissions seem to be in conflict?


    +   - Actually, they are never in conflict. Because the set of normal permissions
    is always included in the ACL permissions list as user::, group::, and other::;
    the traditional set of permissions becomes a completely integrated subset of ACL
    per-permissions.


    +   - Can the setfacl command be used to set ACL permissions recursively?


    +   - Yes. Use the -R argument, just as you would when using the standard chmod
    command, to recurse into subdirectories and apply permissions to multiple files.'
