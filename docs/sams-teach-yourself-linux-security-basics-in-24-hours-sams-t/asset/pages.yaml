  md: '# Selecting and Installing a Linux Distribution


    In general, it is best to own a local copy of your chosen distribution. Thus,
    if you down-load it or do a Net install, be sure to burn a CD-R or save the distribution
    to tape. This will enable you to restore needed binaries from media later if necessary
