  md: '# Auditing and Monitoring


    Extract the source code, configure, and compile. You can run a make install if
    you want, but this will only install a manual page for SAINT; the program itself
    will remain in the source directory.


    ```

    $ tar -xzf saint-3.1.2.tar.gz

    $ cd saint-3.1.2

    $ ./configure

    ...{ Output of configure }...

    $ make

    ...{ Output of make }...

    $ su

    # make install

    mkdir -p /usr/local/man/man1

    install -c -o root -g -m 444 saint /usr/man/man1/saint.1

    #

    ```


    > SAINT isn''t meant to be released in a "stable version" and used that way for
    years on end. This is because network vulnerabilities and attacks are constantly
    evolving. You can and should regard any installation of SAINT as temporary, ready
    to be replaced with a new version or updated with new information the next time
    you run an audit.

    Audit should be run regularly, at least once a month with the latest version of
    SAINT available if you are on a small network. On larger networks, this should
    be done even more often.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_332_0.png)


    Assuming that SAINT has compiled without errors, you''re ready to put it to work.


    # Using SAINT


    You must be the superuser and have access to an X display in order to run SAINT,
    because it runs in a Netscape window. To start SAINT, run the saint executable
    in the source directory.


    ./saint


    Within a few moments, you''ll be greeted by a Netscape window displaying the SAINT
    title page, along with some basic information and a list of options. This page
    is shown in Figure 21.1.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_332_1.png)'
