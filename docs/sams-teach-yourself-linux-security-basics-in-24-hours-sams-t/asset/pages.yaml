  md: '# Using iptables for Firewalling and Routing


    Although the script we created here is a simple one, you should now have enough
    knowledge to construct very complex or very paranoid iptables configurations,
    given patience, determination, and a willingness to refer to the iptables (8)
    manual page often.


    # Q&A


    +   Q With the use of TCP wrappers described in Hour 6, “TCP/IP Network Security,”
    is the use of iptables and packet filtering really necessary?

    A In a sense, it''s up to you. Certainly if you''re running a system that is acting
    as a router between an internal network and the outside world, you''ll need iptables
    to administer address translation and protect the internal network. If you''re
    using a standalone machine, it isn''t strictly necessary, but it does provide
    one more measure of security and logging.

    Q What happened to iptmasquadm?

    A iptmasquad utility was used only for 2.2 kernels. With the advent of kernel
    2.4 and iptables, all functionality related to packet filtering, network address
    translation, and port forwarding has been moved to a central location—the iptables
    command.

    An Internet user has told me that the iptables script in this hour isn''t very
    secure and I should use the script from http://www.foo.bar instead. It''s a lot
    longer; I don''t really understand it. Should I use it?

    A Probably not, for two reasons. First, the script in this hour, although not
    as paranoid as possible, is really enough for smaller systems. This is especially
    true if all hosts on the internal network are similarly configured and TCP wrappers
    are installed and properly configured all around.

    Second, you should never install a script of that sort you don''t understand from
    a user you don''t personally know. If you understand exactly what the script does,
    the decision whether to use it is up to you, but if not, you might actually be
    opening your system to attack without realizing it.


    # New Terms


    +   chain A list of rules that are applied for a given context. Three chains are
    automatically defined at all times: input, forward, and output.

    packet filtering A kernel feature that allows incoming network packets to be discarded
    based on a number of administrator-supplied criteria.

    port forwarding A method for allowing packets reaching a network port on an external
    interface to be forwarded to the same port on an internal interface, thereby allowing
    network services to be provided from behind a firewall.'
