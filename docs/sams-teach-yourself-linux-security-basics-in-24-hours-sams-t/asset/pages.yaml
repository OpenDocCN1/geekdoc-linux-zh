  md: '# APPENDIX D


    # # Quick Security Checklist


    This security checklist quickly goes over the major points covered in each of
    the hour lessons in this book. Not every hour will apply to every need, depending
    on the role of the machine in question. However, a concise checklist this makes
    it much easier to see many of the security concerns in one place.


    # # Hour 1: Selecting and Installing a Linux Distribution


    +   1. The role of the machine in question has been clearly defined and an appropriate
    Linux distribution has been chosen.

    2. The distribution has been obtained from a canonical source.

    3. The file system has been split across multiple partitions to isolate security
    risks, and the root file system has been made read-only-capable.

    4. All current security updates from the distribution vendor have been downloaded
    and installed.'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Hour 2: BIOS and Motherboards


    +   5. A BIOS password has been installed.

    6. Boot order has been changed to first hard drive only.


    # Hour 3: Physical Security


    +   7. The system has been installed in a location that limits physical access
    to the greatest degree possible.

    8. The power switch has been set to permanently on and the reset switch has been
    disabled.

    9. The system has been physically secured (locked or cabled down).

    10. An access auditing system for the physical environment has been put into play.


    # Hour 4: The Boot Process


    +   11. LILO passwords and restrictions for boot images have been enabled.

    (/etc/lilo.conf)

    12. The default runlevel has been set correctly, and the Ctrl+Alt+Del sequence
    has been disabled.

    (/etc/inittab)


    # Hour 5: System and User Fundamentals


    +   13. Consoles available for root logins have been minimized or restricted.

    (/etc/security)

    14. Shells available to users have been minimized or restricted.

    (/etc/shells)

    15. Service startups have been audited; unnecessary services have been switched
    off.

    (/etc/rc.d/rc.n)

    16. Shadow passwords have been installed if necessary.

    17. All users have been added with user-private groups, and the importance of
    strong passwords has been explained.'
  merge: -1
  pgno: 393
- img_proc: true
  md: "# Hour 6: TCP/IP Network Security\n\n+   18. All unneeded services normally\
    \ controlled by the Internet daemon have been disabled.\n    (/etc/inetd.conf)\n\
    \n+   19. TCP wrappers are enabled, and the hosts access files have been configured\
    \ for security.\n    (/etc/inetd.conf, /etc/hosts.deny, /etc/hosts.allow)\n\n\
    +   20. The system logging daemon has been configured for the desired level and\
    \ location of logging activity.\n    (/etc/syslog.conf)\n\n# Hour 7: File System\
    \ Security\n\n+   21. All disk device nodes have been set to permissions 0600\
    \ with chmod.\n\n+   22. An audit has been performed of all SUID/SGID binaries\
