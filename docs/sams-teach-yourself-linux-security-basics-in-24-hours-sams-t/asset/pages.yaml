    # HOUR 19


    # # Encrypting File System Data


    This hour, you''ll learn to encrypt file system data using the Transparent Cryptographic
    File System (TCFS) for Linux. TCFS can be found at http://www.tcfs.it. Because
    TCFS is based on NFS, it is suitable for encrypting network file system data for
    transport. Since it stores file system data on the server in encrypted form as
    well, it is also well suited to local file system encryption.


    Because TCFS requires a patched kernel and a number of patched system utilities,
    it would normally be considered a fairly intrusive tool to install. This chapter,
    however, takes a few extra steps to isolate the TCFS installation in its own branch
    of the file system tree.


    TCFS currently is not available for the 2.4 kernel series. Two TCFS versions exist
    now: a stable version (TCFS 2.2.x) for the 2.0 series of kernels and a beta-test
    version (TCFS 3.x) for the 2.2 series of kernels. Though the TCFS 3 releases are
    currently not officially stable, they''re the versions covered in this chapter,
    largely because of the age of the 2.0 kernel series.'
