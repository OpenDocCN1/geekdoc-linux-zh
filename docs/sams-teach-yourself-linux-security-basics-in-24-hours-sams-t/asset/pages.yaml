  md: '![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_330_0.png)


    # HOUR 21


    # Auditing and Monitoring This hour you’ll learn to download, install, and use
    two tools, one for auditing and one for monitoring, that together are enough to
    keep most small networks reasonably safe from attack.


    For auditing hosts on your network, you’ll learn the basics of using SAINT, the
    Security Administrator’s Integrated Network Tool. SAINT’s easy-to-use interface
    and powerful vulnerability-finding capability combine to make SAINT the tool of
    champions for small network security.


    For monitoring your host and server logs, you’ll install and use SWATCH, the Simple
    WATCHer will lurk in the background watching logs. When something questionable
    happens in one of the monitored logs, you’ll be the first to know.


    # Putting SAINT to Work


    Security Administrator’s Integrated Network Tool (SAINT) is an incredibly useful
    tool for administrators of small networks. It single-handedly scans any hosts
    on your network and checks them against a database of vulnerabilities *'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'known for your operating type (in this case, Linux). It then compiles a report
    with enough information to help you hunt down and close nearly every vulnerability
    or potential vulnerability finds.


    SAINT is based on SATAN, the Security Administrator''s Tool for Analyzing Networks,
    but it has been updated to include a much friendlier user interface and wider
    operating system support.


    The SAINT home page can be found at http://www.wwdsi.com/saint/.


    # Downloading and Installing SAINT


    Before downloading and installing SAINT, you need to make sure that you have a
    fairly recent (5.0 or later) version of Perl installed. Most current Linux distributions
    include a new version, but you may need to visit http://www.cpan.org to download
    and install a new one. Be sure that your distribution has installed flex and bison
    as well. You can check for the presence of their manual pages to see if they have
    been installed.


    If you have Windows clients or servers on your network, you''ll also want to be
    sure to install Samba, since this will make a number of Windows-style networking
    tools available to SAINT. That way, even Windows-based clients can be scanned
    for vulnerabilities.


    You''ll also need to install nmap, a tool commonly referred to as a port scanner.
    SAINT will use nmap to check many of the network ports on your system to see how
    to open to attack them. To download nmap, visit http://www.insecure.org/nmap/
    and grab the latest source. Extract, configure, compile, and install it in the
    usual manner.


    ```

    $ xzf nmap-2.53.tgz

    $ cd nmap-2.53

    $ ./configure

    ...[ Output of configure ]]

    $ make

    ...[ Output of make ]

    $ su

    Password:

    # make install

    ...[ Output of make install ]]

    $ exit

    ```


    Once nmap has been installed, you''re ready to get on with the installation and
    use of SAINT itself. The latest version of SAINT can be downloaded anonymously
    and at no charge from http://www.wwdsi.com/saint/downloads/. After you have downloaded
    the source tarball to your hard drive, installation is very easy, because Linux
    is one of the primary platforms for which SAINT is developed.'
