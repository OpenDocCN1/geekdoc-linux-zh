    Instead of the htpasswd command, use dmmadmin, also relatively simple, to add
    and remove users, and replaces directives like AuthFile and AuthGroupFile with
    AuthDBUserFile and AuthDBGroupFile, respectively.

    Complete details can be found in the official Apache documentation.


