  md: '# Q&A


    With the use of TCP wrappers described in Hour 6, “TCP/IP Network Security,” is
    the use of ipchains and packet filtering really necessary?


    In a sense, it''s up to you. Certainly if you''re running a system that is acting
    as a router between an internal private network and the outside world, you''ll
    need ipchains to administer forwarding and protect the internal network. If you''re
    using a standalone machine, it isn''t strictly necessary, but it does provide
    one more measure of security and logging.


    What happened to ipfwadm?


    The ipfwadm utility was used only for 2.0 kernels. Even better, the iptables utility,
    which performs a similar function, is only for 2.4 kernels. When writing this
    text, the decision was made to document packet filtering and forwarding techniques
    for 2.2 and 2.4 kernels only. Three chapters on the same basic topic seemed too
    many, and the 2.0 series kernels and accompanying distributions are beginning
    to show their age anyway, both in terms of security and in terms of performance.


    An Internet user told me that the ipchains script in this chapter isn''t very
    secure and that I should use the script from http://www.foo.bar instead. It''s
    a long one, and I don''t really understand it. Should I use it?


    Probably not, for two reasons. First, the script in this hour, although not as
    paranoid, is secure enough for smaller systems. This is especially true if all
    hosts on the internal network are similarly configured and TCP wrappers are installed
    and properly configured all around.


    Second, you need not install a script of that sort that you don''t understand
    from a user you don''t personally know. If you understand exactly what the script
    does, the decision based on whether to use it is up to you, but if not, you might
    actually be opening your system up without realizing it.


    I''m using a dial-up network. This script doesn''t work because it needs a specific
    IP address for the local host. What should I do?


    You''ll have to make the necessary modifications yourself. There are two options.
    First, you could remove references to destination addresses using the -d argument
    and the port in the MASQ rule, meaning that only the source would be important.


    A second choice is to incorporate this into a script that a ppp-up or other script
    that launches your dynamic connection. You can use the following command expansion
    to extract the IP number from an active interface:


    ```

    MYIP=$( /sbin/ifconfig INTERFACE | grep inet | \

    awk ''{ print $2 }'' | cut -d '' '' -f2)

    ```


    After you have extracted the IP from the running interface, you should have no
    problem incorporating it into your script.'
