    # HOUR 12


    # Securing Apache, FTP, and SMTP Services


    This hour, we''re going to learn about basic security issues involving three common
    Internet services often provided to the outside world: HTTP, FTP, and SMTP. The
    HTTP server we''re going to discuss is Apache, the most commonly used Web server
    for Linux systems. The mail (SMTP) server we''re going to discuss is Sendmail,
    still the most popular SMTP server among Linux users.


    Having already configured TCP wrappers correctly and set up basic packet filtering,
    firewalling, and port forwarding when necessary, your network services are already
    fairly secure. However, all these general security measures are naught if gaping
    holes are left in your daemon configurations.


    This chapter doesn''t cover SSL-enhanced HTTP server modules, however. Hour 18,
    “Encrypting Web Data,” is dedicated completely to this type of functionality.'
