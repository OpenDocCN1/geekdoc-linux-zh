- img_proc: true
  md: 'On the other hand, if you run a Web server that needs to be available to users
    as much as possible, you may be willing to take that risk and instead want all
    unexpected power cycles to be followed by an automatic boot back to Linux. There
    are three basic methods for not or not using the prompt and timeout keywords.


    +   - If neither prompt nor timeout is present, the system will automatically
    load the default image during boot, without presenting the LILO boot: prompt or
    waiting for input from the user.

    - If prompt is present but timeout is not, then a booting system will stop at
    the LILO boot: prompt and will not continue until human intervention occurs.

    - If both prompt and timeout are present, then a booting system will stop at the
    LILO boot: prompt for as many tenths of a second as are set in the timeout argument.
    For example, a timeout value of 3600 is 360 seconds, or six minutes. Once time
    has run out, if no human intervention has occurred, LILO will load the default
    image and boot as it normally would.


    Your policy for using prompt and timeout will vary with the intended use of the
    machine and the degree to which you plan to be suspicious of reboots. You must
    use your own judgement about the situation to some decision.


    > If an unexpected reboot would be almost impossible in your case, such as if
    you have a solid system and a high-quality battery backup, you may want to stick
    to a very cautious policy regarding unexpected reboots. In situations where unexpected
    reboots are so unlikely, there a much greater chance that such an event represents
    some kind of foul play.


    of course, any cracker who is able to compromise a system so fully that he is
    able to reboot it can likely edit the /etc/lilo.conf file again and remove such
    protective measures. Still, it often pays to be conservative securing.


    # Saving Changes


    Before changes to your /etc/lilo.conf file take effect, you must rewrite your
    system''s boot sector. To do this, simply invoke the lilo command:


    ```

    /sbin/lilo

    ```


    You''ll see a list of labels that refer to the images configured in the lilo.conf
    file. Each of them will be a bootable label at the LILO boot: prompt next time
    you boot the system.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Permissions for /etc/lilo.conf


    One final step you''ll want to take with the /etc/lilo.conf file is to prevent
    non-root users from being able to read it, especially if you''ve configured a
    boot password for one or more images. To do this, issue the following command:


    ```

    chmod 600 /etc/lilo.conf

    ```


    This command sets the file''s permissions so that only root is able to read or
    write to the /etc/lilo.conf file. For details on file system permissions, see
    Hour 7, "File System Security."


    # The Init Program and the /etc/inittab


    The final aspect of the boot process that we''re going to address this hour is
    the configuration file for the init process. You may remember that init is the
    process responsible for taking control of the system once the kernel has started;
    it launches services, provides login prompts, and performs very basic Unix-type
    services.


    The format of the /etc/inittab file itself is beyond the scope of this hour, but
    here two simple changes that security-minded users might want to consider to make
    init defaults a little vulnerable.


    # Default Runlevel


    The init process uses a series of abstractions known as runlevels to help determine
    which services ought to be run on a given system at a given time. Linux distributions
    use runlevels for similar roles; the most common runlevel definitions are shown
    in Table 4.1. Note that Debian GNU/Linux uses a different set of runlevels, documented
    briefly in the /etc/inittab.


    # Table 4.1 Common Runlevel Definitions


    | Runlevel | Description |

    | --- | --- |

    | 0 | (Procedural) System halt: When the system enters runlevel 0, all processes
    will be stopped. |

    | 1 | Single user or maintenance: Network interfaces are started, but no services
    are started; only root is allowed to log in and only on the console. This is the
    runlevel entered when the single word is passed to the kernel as an argument at
    the LILO boot: prompt. |

    | 2 | Multi-user, minimal: Network interfaces are started, and some local services
    are allowed to start for user logins on the console, but most network services
    (for example, NFS and Web) are not started. |'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# TABLE 4.1 continued


    | Runlevel | Description |

    | --- | --- |

    | 3 | Multiuser, full: Network interfaces and desired network services are started.
    User logins and user requests are allowed both locally and remotely. |

    | 4 | Unused or user-specified. |

    | 5 | X11: Network interfaces and desired network services are started. User logins
    and user requests are allowed both locally and remotely. The X Display Manager
    or a substitute is started and the system boots into X11R6 |

    | 6 | (Procedural) Reboot: When the system enters runlevel 6, all processes will
    be stopped, and a cold reset will occur. |


    In Hour 1, "Selecting and Installing a Linux Distribution," you learned that many
    systems that provide only network services do not need X capability, and thus
    X need not be installed. However, there are some situations in which X will be
    installed but will rarely be needed to actually run.


    In such cases, many current distributions will set the default runlevel to 5,
    X11 mode, even though for the most part the X Window System will not be used on
    your machine. This is a bad thing; in Hour 15, "Securing X11R6 Access," you''ll
    learn that X is actually a network stream like any other and is therefore subject
    to attack. Because of this, you don''t want X running by default but doing nothing
    most of the time on a network server machine.


    Thus, on machines that fit this description, you will want to edit the /etc/initab
    file using your favorite editor and change the first non-comment line in the file.
    Generally, it will look like this:


    ```

    id:5:initdefault

    ```


    This line is telling the init program to boot the system using runlevel 5 and
    to start all services (including X11R6) normally associated with runlevel 5. To
    change this, simply delete the number 5 and replace it with number 3, referring
    to full multi-user system:


    ```

    id:3:initdefault

    ```


    After this change has been made, your system will boot to a console login prompt
    rather than an X login prompt, thereby securing via closure what might otherwise
    be an unnecessary potential security problem. Of course, you will still be able
    to start X from a console using the startx command after you''ve logged in.'
