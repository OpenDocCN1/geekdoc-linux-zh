  md: '# Securing X11R6 Access


    Token-based authentication grants or denies access based on the connecting user''s
    ability to supply a magic cookie, generated as a kind of connection password.
    Token-based authentication can be applied on a per-user basis and is much more
    secure than host-based authentication.


    When the two types of authentication are both used, a connecting system is checked
    against the host list first. If it appears in the list, access is granted, without
    the token ever being checked. It is therefore advisable to leave the host list
    blank when token-based authentication is enabled.


    The X Display Manager (xdm) can be helpful in automating the token-based authentication
    process. xdm is capable of automatically generating magic cookies and facilitating
    their exchange without needing to use the xauth command.


    # Q&A


    +   - My system doesn''t run xdm, but when I starts kdm (from KDE) or gdm (from
    GNOME) instead. These provide similar functionality?


    +   - Yes, kdm and gdm both implement the XDMCP protocol and perform token management
    if similar not identical. However, be sure to keep your kdm and gdm versions current;
    both KDE and GNOME are under heavy development, and both managers have at times
    been known to have serious bugs.


    +   - Isn''t X always insecure because it is an encrypted data stream? Isn''t
    it always a bad idea to use X over a network?


    +   - Yes, X is an unencrypted data stream. Thus, it is a good idea to use unencrypted
    X streams only behind a dedicated firewall. X can be encrypted by tunneling through
    ssh, making it much more secure. For details on ssh, please see Hour 16.


    +   - How long does a token-based authentication cookie last before expires?


    +   - Unfortunately, using the standard MIT-MAGIC-COOKIE mechanism, the cookie
    does not expire; either side can continue to use it indefinitely, as long as it
    matches the cookie on the other side. It is therefore good idea to cycle X sessions
    periodically and remove old cookies from your authentication file.


    # New Terms


    GNOME Display Manager (gdm) An xdm-compatible display manager included with the
    GNU Network Object Model Environment (GNOME).'
