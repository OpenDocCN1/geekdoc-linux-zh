    to find any reference to BIOS setup in your documentation, it''s time to contact
    the manufacturer for instructions. Your computer almost certainly has a BIOS setup
    routine somewhere. All computers since the 80386 machines had them.


    +   * My computer system doesn''t have the capability to password protect the
    BIOS configuration. Is it really that important?


