- img_proc: true
  md: '# TCP Wrappers Explained


    The /usr/sbin/tcpd binary is the core of a security measure TCP wrappers, included
    and installed by default with every Linux distribution for a number of years.
    TCP wrappers provide an absolutely essential extra layer of security for the services
    managed by inetd.


    When TCP wrappers are installed, instead of simply calling the in.telnet daemon
    for an incoming Telnet connection, inetd instead will call /usr/sbin/tcpd, supplying
    the correct server, in.telnet, as an argument. The /usr/sbin/tcpd program checks
    the identity of the requesting system against a list of rules that specifies who
    is allowed to connect and isn''t. If the requesting system is in /usr/sbin/tcpd''s
    list of denied systems for this type of service, the connection will be refused.


    In short, TCP wrappers provide a way for you to disallow connections from specific
    systems before the requester gets the chance to enter a login or password. In
    the most basic sense, this prevents a ham-handed cracker on an unknown system
    somewhere from connecting over and over again until he is able to give a working
    login/password combination.


    TCP wrappers also help to mitigate a more serious threat, however: security bugs
    or flaws. As the Internet and Internet services evolve, new bugs are always being
    found in the daemons that provide these services. Some of these are harmless,
    but many of them are security flaws. For example, many older daemons were subject
    to various kinds of buffer overruns. In the simplest sense, a buffer overrun is
    a way of breaking into a system that is willing to present a login prompt regardless
    of whether a valid login/password combination can be discovered or not.


    Clearly, any security measure that will allow you as the administrator to accept
    or deny a connection according to the remote system''s identity before any real
    interaction or authentication can take place is a helpful and important measure.


    # Healthy Paranoia (The /etc/hosts.deny file)


    The first of the two configuration files that govern the behavior of /usr/sbin/tcpd
    is the /etc/hosts.deny file. This file gives a list of rules that specify which
    remote systems should be denied requests to various services. It is best to think
    of this file as the general for incoming connections.


    The TCP wrappers software is actually complex and flexible; the full specification
    of the format for /etc/hosts.deny can be found in hosts.deny(5) but for our purposes,
    the basic format of a line in the file can be described this way:


    ```

    service : host(s) [ : action ]

    ```'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# TCP/IP Network Security


    The service is any one of the program names that might be passed from inetd

    response to an incoming connection request. The host(s) are those hostnames or
    IP

    numbers to this rule applies. An optional action can be supplied and will be exe-

    cuted by the shell when this rule is triggered.


    A number of special words and wildcards are available to make formatting of the
    config-

    uration file more convenient. The wildcards are shown, along with their meanings,
    in

    Table 6.2.


    # Table 6.2 Some TCP Wrappers Special Words


    | Word | Description |

    | --- | --- |

    | ALL | Wild; matches any hostname or service name. |

    | KNOWN | Wild; matches any user with a known name or any host for which both
    name and address are known. |

    | LOCAL | Wild; matches any hostname that does not contain a dot character. |

    | PARANOID | Wild; matches any whose name does not appear to match its address.
    |

    | UNKNOWN | Wild; matches any connecting host identity can''t be determined. |

    | EXCEPT | Operator; allows administrator to use a phrase like ALL EXCEPT N.N.N.N
    when con-figuring hosts or ALL EXCEPT in.ftpd when configuring services. |


    With these keywords, we''re now ready to assemble a general "deny" policy for
    incoming

    connections. On a local area network that wants to provide services to only other

    machines on the local network (and never to machines from the Internet), the following

    single line is all that is needed in the /etc/hosts.deny file:


    ALL : ALL


    This is indeed paranoid setting. This means that all connection requests from
    all hosts

    anwhere will be denied. This is a very safe /etc/hosts.deny file. Of course, we
    did

    want to allow machines from the local network to access services, and we also
    want

    to allow for things like anonymous FTP from the outside world, so we need to create
    a

    few exceptions. Though we mangle the /etc/hosts.deny file with multiple rules

    and the EXCEPT operator, another file has been created just for the purpose of
    making

    exceptions to the rules defined in /etc/hosts.deny.


    # Sparing Exceptions (The /etc/hosts.allow File)


    The /etc/hosts.allow file follows the same format used in the /etc/hosts.deny
    file,

    but its purpose is the inverse. Any incoming connection requests that match a
    rule in


