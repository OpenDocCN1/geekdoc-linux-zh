  md: '# POSIX Access Control Lists for Linux


    Though the permissions system in the native Linux file system is adequate for
    many purposes and users, you might have noticed a significant limitation in its
    capabilities:

    Permissions can only be specified for three rules:


    +   - The user (owner) of the file, a login account with which the file in question
    is associated

    - The group of the file, one of the groups from /Et/Group with which the file
    in question is associated

    - Everybody else, as a catch-all group


    Again, for most users on small systems, this traditional permissions structure
    is adequate and provides all the security that is needed. However, there are times
    when more flexibility is needed. At times like this, a tool called an access control
    list, ACL, is needed.


    # A Sample Scenario Needing ACL Capability


    The problem with the traditional paradigm is that specific permissions cannot
    be assigned for several different users. For example, consider a situation in
    which five users—joe, marcy, fred, patrick, and dirck—and two groups—workers and
    drivers. We. We want to give the permissions shown in Table 8.1 to each of them.


    Table 8.1 Sample Scenario Needing ACL Capability

    | Users | Groups | Description |

    | --- | --- | --- |

    | joe | | rwx | Read, write, execute |

    | marcy | | rw- | Read and write |

    | fred | | r-- | Read only |

    | patrick | | -x | Read and execute |

    | dirck | | -x | Execute only |

    | | workers | rw- | Read and write |

    | | drivers | r-- | Read only |

    | (others) | | -- | No permissions |

    | (others) | | ... | No permissions |


    Notice that for each user and group, the set of permissions that we want to grant
    to the world at large (everybody). Each of these users needs permissions that
    we don''t want to give. Under the traditional permissions system, we could give
    file ownership to joe, and then give him u=rwx permissions. We could create a
    group called marcy, of which marcy is a member. We''d give group ownership to
    marcy and'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Extra File System Security Tools


    grant g=rw permissions. For everyone else, we could give o-rwx. However, this
    leaves out fred, patrick, and dirck, as well as both important groups. Because
    of the com-plexity of the situation, the traditional permissions model is woefully
    inadequate.


    Using access control list capability, this list of users and required permissions
    could eas-ily implemented. Therefore, in situations that require this much flexibility,
    an ACL is generally the solution of choice.


    # POSIX ACLs for Linux


    POSIX ACLs for Linux package is one package. It consists of a set of patches to
    the Linux kernel and ext2 file system utilities along with a number of separate
    utilities. All can be downloaded at http://acl.bestbits.at in source releases
    built around vari-ous kernel versions.


    The package amends the Linux kernel to store an extra quantity of metadata for
    each file; this new metadata contains the extended permissions information provided
    by the ACL utilities. To install the POSIX ACLs package for Linux, you''ll need
    the components shown in Table 8.2.


    # TABLE 8.2 Required Downloads for ACL Installation


    | Item | Description |

    | Linux kernel source | You must have a supported version of the Linux kernel
    source available. As this text is written, the supported kernels are 2.2.17 and
    2.4.0 (test9, although the patches also work with test10). |

    | Extended attrs patch | The extended attributes patch extends the virtual system
    layer in the kernel source to allow for additional attributes. |

    | ACL patch | The access control list patch for the kernel uses the additional
    attributes in the extended attributes patch to store access control list information.
    |

    | e2fsprogs source | You must have a supported version of the ext2 file utilities
    available. As this text is written, the supported version of e2fsprogs is 1.19.
    |

    | e2fsprogs patch | This patch amends the e2fsprogs source to include additional
    command-line arguments for e2fsck, which have to do with access control list metadata.
    |

    | fileutils source | You must have a supported version of the GNU file utilities
    code available. As this text is written, the supported version of fileutils is
    4.0z. |

    | fileutils patch | This patch amends the GNU file utilities so that extended
    permissions is preserved in file utility operations. |

    | ACL utilities source | This is the source code for the extra utilities used
    to configure ACL information for files. |


