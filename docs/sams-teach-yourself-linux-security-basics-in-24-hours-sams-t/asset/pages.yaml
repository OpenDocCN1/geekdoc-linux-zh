  md: '# New Terms


    **entropy** A quantity of work-related disorder or activity present in a running
    system that is used to generate random numbers.


    **GNU Privacy Guard (GnuPG, GPG)** An implementation of PGP from the Free Software
    Foundation that is mostly compatible with commercial PGP implementations. The
    IDEA algorithm, which remains under patent until 2007, is not officially supported
    by GPG.


    **Pretty Good Privacy (PGP)** A general-purpose method of exchanging encrypted
    or signed data of nearly any type based on public key cryptography.


    **private key** The second half of an encryption key pair, the private key must
    be kept under strict secrecy and encrypted with a passcode and should be known
    only to its owner.


    **public key** One half of an encryption key pair, the public key can be circulated
    widely, signed by other users, and used to encode messages to the key''s owner.


    **signature** Validation information created using the source''s private key that
    can be verified as having come from the source in question using the source''s
    matching public key. Data and other public keys can be signed as valid.


    **web of trust** A measure of the degree to which the validity of a key is certain.
    Trust is determined by the number of trusted individuals who have signed a public
    key and whose signatures on the key can be verified using their own trusted public
    keys.'
