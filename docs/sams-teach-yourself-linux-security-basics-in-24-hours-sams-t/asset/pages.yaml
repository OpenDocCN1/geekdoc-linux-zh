    This block of symbols describes the access rights specification for the file in
    general, more commonly known as the file’s permissions. These access rights or
    permissions Linux instructions for handling all user requests to access the file,
    given the context of its user and group ownership. There are 10 permission properties,
    and thus a permissions list is always 10 characters long. It is formatted according
