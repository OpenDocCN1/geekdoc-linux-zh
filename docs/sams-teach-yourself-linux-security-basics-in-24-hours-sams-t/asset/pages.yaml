    Generally, there is no need to go read-only for runlevel 1 because it is for maintenance
    only and should be accessible only to root anyway. However, when dropping from
    a higher runlevel to runlevel 1 for maintenance, it is convenient to have the
    root file system automatically remapped as read-write. This can be done with another
    symbolic link:


