  md: '# A Brief Overview of TCFS


    TCFS is an unusual tool in the Linux world because of the way it is constructed.
    Rather than running on the server or implementing some form of client/server key
    exchange, TCFS functions exclusively on the client host.


    It is the kernel on the client that is patched for TCFS operation. An NFS share
    from any NFS-capable server is mounted on the client machine as file system type
    TCFS. To the NFS server, this operation is transparent.


    The user on the client system has a private encryption key that is used to encrypt
    the data to be stored. After being encrypted, the data is transmitted via NFS
    to the server and stored in encrypted form on the server''s drive. It is transmitted
    in encrypted form to the client once more, where it is decrypted by the user''s
    key. No encryption keys of any kind are ever transmitted across the network, and
    there is no way to decrypt the data stored on the server in isolation. Data stored
    this way can be decrypted only on the client machine by the user who generated
    the data in the first place.


    For local file system encryption, the server and client simply become one. A directory
    and volume is exported over NFS; it is mounted on the same machine via TCFS, and
    encrypted data is written to the new mount point, where it is encrypted before
    being written to the hard drive.


    Because of this client-based mode of operation, all of the configuration and installation
    in this chapter will occur on a TCFS client machine rather than an NFS server.


    # Preparing to Install TCFS


    Before installing TCFS, you should ensure that you have a number of things prepared.
    Because of the intrusive nature of a TCFS installation, it will be easy to make
    mistakes if you haven''t taken care of the following things in advance.


    # An Empty EXT2 Partition


    Because TCFS is beta-level code and because it uses raw storage, it is a good
    idea to isolate your encrypted files on a separate file system on the NFS server
    in question for export and mount, just in case. Normally, this means having created
    an empty partition and using mkfs to create an EXT2 file system on it.


    If you don''t have a spare partition or don''t want the hassle of creating one,
    you can use the Linux loopback driver if you don''t mind the extra overhead. For
    example, to create a 50-megabyte virtual disk and mount it at /mnt/virtual, you
    would do something like this:'
