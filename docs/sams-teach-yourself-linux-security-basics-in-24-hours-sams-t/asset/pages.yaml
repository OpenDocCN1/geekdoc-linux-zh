  md: '# Encrypting Data Streams


    # Using SSH for Remote Logins


    The first and simplest use for SSH is as a kind of secure replacement for remote
    login programs like login or Telnet. SSH can perform a similar function to these
    two protocols, because encrypts the data stream (including the password as it
    is being sent during authentication), communication between two systems is much
    more secure and difficult, if not impossible, to intercept.


    To connect to an SSH-enabled server from an SSH-enabled client machine for remote
