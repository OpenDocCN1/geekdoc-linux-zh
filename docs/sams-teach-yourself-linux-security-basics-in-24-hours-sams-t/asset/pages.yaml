    ```

    ls -1 | grep ''^.......r...''

    ls -1 | grep ''^.......w..''

    ls -1 | grep ''^.......x''

    ```


    The first command above will match all files that allow public read access. The
    second matches all files that allow public write access. The third matches all
    files that allow public execute access (this should be rare for device nodes).
    Once you have such a list, you can change permissions on the nodes by one.


    Device nodes are actually symbolic links to other device nodes. Symbolic links
    have a unique permissions format:

    lrwxrwxrwx


    All symbolic links are of type 1 and grant permission for full read, write, and
    execute to all users. The actual behavior of the link referenced depends on the
    permissions of the file to which the link points.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_128_0.png)


    # SUID/SGID Executables


    Perhaps the single complicating factor in the Linux permissions system is the
    SUID (set user ID) property. Normally, when a program is executed, the process
    will be owned by the user. Thus, the program is able to access only files that
    normally grant the user access. However, when a special property called SUID is
    set for a given program binary, the program will behave very differently.


    When an SUID binary runs, its process is not owned by the user who launched it,
    but rather by the user who owns the program binary. Thus, a program file that
    is owned by root but is publicly executable will in essence become the root user
    each time it is run.


    A similar property called SGID causes a program''s process to take on an identity
    matching its ownership in a similar fashion. One common SUID/SGID (both properties
    enabled) binary is /usr/bin/ppppd, which is responsible for dial-up Internet connections
    using analog methods.


    ```

    # ls -1 /usr/bin/ppppd

    -rwsr-sr-x 1 root 161792 Nov 8 13:31 /usr/bin/ppppd

    ```


    Note that instead of the usual x in the permissions for user and group members,
    an s, indicating SUID and SGID, is present instead.


    Obviously, this type of thing is a security risk: any program with the SUID or
    SGID property is like a potential rogue root user and must be treated with extreme
    caution. Bugs in programs that are usually run as SUID/SGID are very common places
    for exploits that render a system defenseless against attack. Unfortunately, the


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_128_1.png)'
