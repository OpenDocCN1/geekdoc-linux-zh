  md: '# Securing Apache, FTP, and SMTP Services


    185


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_202_0.png)


    The Deny and Allow directives provide a method to allow system administrators
    to grant or deny access within a scope based on simple rules. Any Deny or Allow
    directive can be followed by the word all (to allow or deny all requests), a network,
    or nearly any fragment of an IP number or a host-name. For example, the following
    are all valid:


    Deny from all

    Deny from 192.168.1.0/24

    Deny from 192.168.1.1.

    Deny from .conga.net


    Allow from all

    Allow from 10.0.0.0/8

    Allow from 10.

    Allow from .borne.com


    Typically, Deny or Allow directives are preceded in a scope by an Order directive,
    which determines whether Deny rules will be considered first, followed by Allow
    rules, or vice versa.


    The net effect of the previous scope is to prevent HTTPD from retrieving files
    anywhere in the file system as. Clearly, this isn''t desirable because a Web server
    is pointless if it isn''t allowed to serve any pages. So, exceptions must be created:


    ```

    <Directory /public/www/

    Order Allow,Deny

    Allow from all

    </Directory>

    ```


    ```

    <Directory /home/*/public_html>

    Order Allow,Deny

    Allow from all

    </Directory>

    ```


    These two scopes create exceptions in a sense to the first Directory scope we
    define. We now grant public access to all files in /public/www as well as all
    files in users'' public_html directories, assuming that account homes are in /home.
    Notice that simple wildcard characters can be used in scoping. The order of Order
    has been reversed in the interest of convenience and flexibility. If we want to
    create any Deny exceptions to the new Allow rules, they can come after the first
    rule allowing access to all.


    If more flexibility is desired, the DirectoryMatch scope can be used instead.
    It functions identically to the Directory scope but allows the use of complete
    regular expressions in the argument.'
