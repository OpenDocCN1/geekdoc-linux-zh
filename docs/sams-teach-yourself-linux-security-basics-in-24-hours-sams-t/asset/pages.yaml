    # HOUR 24


    # Recovering from Attacks


    In the final hour of this book, you''ll learn what to do if in spite of your best
    efforts you find that your system has been violated. You''ll learn the steps to
    take to protect yourself and your network against further harm, and how to get
    back online quickly, safely, and without risk of further mischief from the same
    intruder.


    # The Telltale Signs


    Three tools have been covered in this book that provide your best notification
    mechanism for illicit activity on your system or network:


    +   - SAINT, when run as a weekly audit, is able to detect the telltale signs
    left over from many kinds of attacks and point you to the files that have likely
    been compromised under such circumstances.

    - SWATCH monitors your logs and can report suspicious activity to you. By paying
