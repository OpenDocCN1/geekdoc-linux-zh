    # Step 2: Define Multiple Partitions


    It is infinitely more convenient to create a single partition for your Linux file
    system than to follow traditional Unix-world practices and separate your file
    systems across partitions. However, there are a number of security benefits that
    can be achieved by separate-rating file systems across multiple partitions. Among
    them are the following:


    +   * Avoiding some attacks There are some exploits that directly use world-writable
    directories like /tmp to gain root access for an intruder when such directories
    are on the physical device as other parts of your file system. Thus, it is best
    to isolate world-writable file systems from the rest of the file systems on your
    machine.


    +   * The capability to mount some areas with execution restricted On all the
    most open systems, there is rarely any legitimate reason for allowing executable
    files to be launched from locations outside of a binaries (bin) directory. Areas
    like user accounts (/home) and temporary storage (/tmp) can be isolated and mounted
    with the noexec flag to prevent any user from launching binaries from them.


    +   * The capability to mount some areas with SUID/GID SetUID and SetGID (GID)
    programs are marked with permissions that cause them to run under the identity
    of their owner or group, rather than the caller. This functionality is necessary
    for certain binaries that must access hardware directly, but such binaries should
    never be world-executable and never be found outside the /sbin, /bin, or /usr/X116
    directory. By separating these file systems and using the nouid flag, we can prevent
    unauthorized SUID/GID access. More information on the SID/GID attributes can be
    found in Hour 7, "File System Security."


    +   * The capability to mount some areas as read-only It is easy to understand
    why some of the file system should never be easily writable. Among them are directories
    like /sbin, /bin, and /etc, which do not change often and are never changed without
    the administrator’s attention. With separate partitions, these areas can be remounted
    as read-only once the boot process has finished.


    Of course, if a cracker is somehow to obtain root-level access to your system,
    each of these measures can be defeated, one by one. However, they do help to prevent
    an intruder from gaining root-level access in the first place, and they will stop
    many of the more sleupt kiddies dead in their tracks.'
