- img_proc: true
  md: '# The Boot Process


    Clearly, steps need to be taken to secure the LILO booter. Luckily, the LILO booter
    uses a flexible configuration file normally found at /etc/lilo.conf that can accept
    two important security-oriented arguments. Most distributions do not secure LILO
    for advance, so be sure to follow this section closely.


    # The /etc/lilo.conf File


    The /etc/lilo.conf file is separated into two main sections. The first section,
    global settings, occurs at the top of the file and includes keywords that apply
    to any kernel image or operating system that LILO is managing. Changes made to
    this global section of the configuration file will apply to every kernel image
    in your list of bootable images.


    The second section of the file begins with the first image= or other= keyword
    and continues through the end of the file. A new begins each time the image= or
    other repeats; the keywords below each image refer to the particular kernel in
    question. A sample /etc/lilo.conf file is shown in Listing 4.1.


    # Listing 4.1 Sample /etc/lilo.conf File


    ```

    #

    # Global section of /etc/lilo.conf

    #nbboot = /dev/hda

    install = /boot/boot.b

    prompt

    timeout = 100

    default = linux

    #

    # List of images in /etc/lilo.conf

    #

    other = /dev/hda1

    label = win

    image = /boot/vmlin-2.2.16

    label = linux

    root = /dev/hda4

    vga = 775

    append = "hdc-ide-scsi"

    read-only

    image = /boot/vmlin-2.4.0-t9

    label = new

    root = /dev/hda4

    vga = 775

    append = "hdc-ide-scsi"

    read-only

    ```


    ```

    #

    # end /etc/lilo.conf

    #

    ```'
