  md: '![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_388_0.png)


    # # APPENDIX C


    # # Security Web Sites of Note


    There are a number of security-oriented Web sites that should be of note to Linux
    users interested in pursuing system security diligently. A list of those sites
    follows.


    # # General Security


    Computer Emergency Response Team—nhttp://www.cert.org


    Originally hosted by DARPA, CERT is now at Carnegie Mellon University’s software
    engineering department and tracks the latest vulnerabilities and exploits on multiple
    operating systems.


    CERT also hosts a wealth of security-related information, links to security tools,
    and research and white papers related to security topics.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# Computer Incident Advisory Capability—nhttp://www.ciac.org


    This site, hosted at the U.S Department of Energy, posts monthly reports on the
    most recently discovered exploits for multiple operating systems, including Linux.
    Also at the site are links to various tools and other security-oriented U.S. government
    sites.


    # The Cypherpunks Home Page—ftp://ftp.csua.berkeley.edu/pub/cypherpunks/Home.html


    This site at the University of California, Berkeley, is the quintessential ever-restricted
    home page, containing large doses of papers, research, and tutorial information
    from cryptography. To cap it all off, there is a restative FTP archive file of
    cryptography-related Linux/UNIX software and a list of other FTP sites containing
    cryptographic tools.


    # SecurityFocus.com—http://www.securityfocus.com


    SecurityFocus.com tracks vulnerabilities across a number of operating systems,
    almost in real time, it sometimes seems. In addition to the latest vulnerability
    reports, SecurityFocus.com contains articles, tutorials, and links to security-related
    software, organized by operating system.


    # Linux-Specific Security


    # The Debian GNU/Linux Security Site—http://security.debian.org


    This site is extended and up to date, promising to rectify any discovered vulnerability
    with 48 hours of it being reported.


    # Red Hat Linux Errata Page—http://www.redhat.com/support/errata/


    Security advisors for the latest version of Red Hat Linux are always available
    from the Red Hat Linux errata page, which falls under the Red Hat support department.


    # Caldera Systems—http://www.calderasystems.com/support/security/


    Caldera Systems'' security page contains advisories by year and product, including
    the latest eDesktop and eServer platforms and related products.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Linux-Mandrake—http://www.linux-mandrake.com/

    en/security/


    This URL leads to the security advisories archive for various versions of Linux-Mandrake
    (more commonly known as Mandrake Linux).


    # SuSE Linux—http://www.suse.com/us/support/

    security/


    This page contains the latest security announcements and advisories for the users
    of SuSE Linux. Links to SuSE mailing lists can also be found here.


    # TurboLinux—http://www.turbolinux.com/security/


    All of the most recent security updates for users of the TurboLinux distribution
    can be found on this page, which is formatted for quick package downloads.


    # LinuxPPC—http://linuxppc.org/security/advisories/


    Users of LinuxPPC for PowerPC-based machines such as the Power Macintosh G3 and
    G4 systems will find security advisories for the latest LinuxPPC distribution
    here.'
