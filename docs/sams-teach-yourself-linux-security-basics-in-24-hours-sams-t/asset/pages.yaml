    Each time joe logs in, he must use tcfputkey to activate his key. When he logs
    out, should use tcffsrmkey to disable it.


    # Encrypting Files


    The actual process of encrypting files is fairly simple. The new chatter command
    in usr/local/tcfs/bin supports an additional attribute, +X (capital letter) for
    encrypted or -X for not encrypted. If joe had a file that he wanted to encryptallmyfile.txt
    in /mnt/priv/joe, he would use chatter as follows:


    ```

    client:-$ cd /mnt/priv/joe

    client:joe$ /usr/local/tcfs/bin/chatter +X myfile.txt

    client:joe$

    ```


    The lsattr command can demonstrate that the change has indeed been made:


    ```

    client:joe$ /usr/local/tcfs/bin/lsattr

    --------RX-- ./myfile.txt

    client:joe$ ************

    ```'
