  md: '# Q Is any way at all to back up an ext2 file system and preserve ACL permissions
    when restoring?


    A Yes, but the process is kludgy and will require scripting. The following command
    can be used to output ACL data recursively for an entire directory tree:


    ```

    getfacl -R /path/to/list

    ```


    After this output has been saved to a file, this file can be used to restore ACL
    data to the directory tree in question


    ```

    setfacl -B /path/to/data-file.acl

    ```


    By combining these two commands, a backup process can extract ACL data to a file
    before writing to streaming media, save the ACL data file to the streaming along
    with other files, and finally, use the ACL data file after restore to reconstruct
    ACL permissions.


    # Q Secure deletion is often used in conjunction with file encryption. Why isn’t
    encryption mentioned here?


