    # Syntax for the getfacl Command


    The getfacl command simply displays the current list of access control list permissions
    for a file or list of files. The basic syntax is:


    ```

    getfacl [file...]

    ```


    For example, consider the following command and resulting output:


    ```

    $ getfacl myfile

    # file: myfile

    # owner: jerry

    # group: users

    user::rw-x

    user:tami:r--

    group::r---

    group:maint:rwx

    other::--

    ```


    In the case of myfile, the owner of the file is jerry, and the group is users.
    The owner has read, write, and execute permissions; members of the file''s group
    have only read permissions. Additional users tando and tami have been granted
    read and write and just read permissions, respectively. An additional group, maint,
    has been given read, write, and execute permissions. All other users and groups
    have no permission at all.'
