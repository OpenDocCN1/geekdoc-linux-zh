    is capable of installing and running kernel 2.2.17 successfully without too many
    additional patches. Information on requirements for using kernel 2.2.17 can be
    found in the Documentation/Changes file in the kernel 2.2.17 source tree.


    Additional patches should be kept to a minimum, though TCFS has been known to
