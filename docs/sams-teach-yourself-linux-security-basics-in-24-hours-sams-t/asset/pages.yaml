  md: '# TCP/IP Network Security


    /etc/inetd.conf file, which is read each time the inetd daemon is launched

    restarted.


    In all but the most special of circumstances, all that needs to be done to secure
    the inetd

    demon is to comment out judiciously with a hash mark (#) all incoming request
    types

    that shouldn''t be managed by inetd any longer. Each line in the file is a complete
    rule

    composed of a series of whitespace-separated keywords or lists. The format is


    service socket-type protocol flags user server args


    The meaning of each of these fields is shown in Table 6.1.


    # Table 6.1 Fields in a Line from /etc/inetd.conf


    | Field | Description |

    |---||

    | service | The name of the service line relates to. Many of these (such as ftp
    or telnet) will seem familiar to you, while some more esoteric services may not.
    |

    | socket-type | Refers to the type of network socket involved; stream and datagram
    sockets are the most common. Other types are documented in inetd(8). |

    | protocol | Specifies which type of low-level TCP/IP protocol is used in a particular
    connection. Most services use either tcp or udp packets, and a complete list of
    protocols can be found in /etc/protocols |

    | flags | Any subset of several available arguments, which vary depending on the
    socket type and protocol in use. |

    | user | The user who will own the connection''s process. This is helpful in cases
    because a few services don''t require root permissions, meaning that they can
    run more securely. |

    | server | The path to the actual program which inetd will pass control of the
    incoming connection request, such as in .inetd or in .ftpd. |

    | args | Any arguments that should be passed to the server program. |


    While this may look very daunting and is certainly covered in greater detail in
    any book on the TCP/IP protocol suite, our interest this hour is only in the first
    field of each line—the name of the service in question.


    Simply put, your job is to move through the /etc/inetd.conf file one line at a
    time, commenting out any services that you don''t recognize as being you intend
    for your system to provide. For example, take a look at the /etc/inetd.conf snippet
