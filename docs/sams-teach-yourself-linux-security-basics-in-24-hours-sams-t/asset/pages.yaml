    ```


    When the file or message containing this signature is received, the recipient
    who has your public key can verify the message''s integrity by issuing the --verify
    command to GPG:


    ```

    $ gpg --verify message.txt.asc

    gpg: Signature made Sat Jan 13 23:33:21 MST using DSA key D9BAC463

    gpg: Good signature from "Ima User (I''m just ME)" <me@mynet.net>*

    $

    ```


    A verified signature indicates that the message or file really comes from the
    source it claims to be and that it hasn''t been modified in any way.


    # Encrypting and Decrypting Data


    GPG is also useful when a message, file, or other unit of data is for one person''s
    eyes only. At such times, GPG can use the person''s public key to encrypt the
    file, making it unreadable until it is decrypted by the person holding the matching
    private key (presumably the intended recipient).


    To encrypt a data file using the recipient''s public key, use the -r argument
    to specify a recipient and --encrypt command to instruct GPG to encrypt the file
    in question:


    ```

    $ gpg -r pipi@hairnet.org --encrypt message.txt

    $

    ```


    It''s as simple as that; GPG uses the public key for pipi@hairnet.org to encrypt
    message.txt and writes the output to message.txt.asc. The resulting file is shown
    in Listing 20.3.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_324_0.png)'
