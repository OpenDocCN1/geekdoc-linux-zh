  md: '# Encrypting E-Mail Data


    Once pipi has entered the passphrase for her secret key, the message you sent
    will be decrypted and sent to the file message.txt. You have now securely transmitted
    a message to pipi using GPG.


    # Summary


    In this hour, you downloaded and installed the GNU Privacy Guard, GnuPG or GPG
    for short, a free implementation of Pretty Good Privacy (PGP).


    You learned to create your public/private key pair, import and export public keys,
    fingerprint new public keys for verification, and sign keys you can positively
    verify. You learned to indicate to GPG whether or not signatures from other users
    whose keys you have on fought to be trusted as though you had signed the keys.


    Finally, you learned to use GPG to sign messages or data using your private key,
    to verify signed messages that others have sent you, to encrypt outbound messages
    that are for the receiver''s eyes only, and to decrypt inbound messages that are
    for your eyes only.


    # Q&A


    +   * What about subkeys, revocation certificates, alternative algorithms, e-mail
    integration...


    +   * This hour is intended only as a primer for a very large and flexible protocol
    and application system. If you plan to use GPG/PGP on a regular basis (and you
    should), it is strongly advised to visit the GnuPG home page and read the online
    documentation. Afterward, scour the gpg manual page and learn about the various
    options and commands.


    +   * I want to encrypt only data to send to others. Can''t I just use the keys
    they send me in e-mail and ignore all of this “trust” stuff?


    +   * Not really. You see, if you want to encrypt the data you send to others,
    there''s probably a reason—the data is sensitive to be seen by just anyone.

    Because a key contains nothing more than encryption data, name, and e-mail address,
    it is possible for you to receive a completely key from someone other than the
    person it appears to be. Whoever made the bogus key also has the matching pair
    key that can decrypt its output. If you encrypt and send without verifying a key''s
    authenticity, you may be revealing sensitive information to a malicious third
    party.


    +   * You should always verify a public key before you use it to send sensitive
    encrypted data to anyone.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_326_0.png)'
