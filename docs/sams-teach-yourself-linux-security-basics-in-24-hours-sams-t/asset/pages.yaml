  md: '# Selecting and Installing a Linux Distribution


    This process required hours of work, but there was one beneficial side effect:
    The administrator of the system knew every piece of software present, and thus
    only those components that were absolutely necessary were installed.


    Fortunately or unfortunately, these days the most popular distributions have streamlined
    the process considerably: Users generally choose from a short list of roles such
    as Standard Installation, Development Workstation, or Server when selecting packages.
    If you''re knowledgeable enough to know what packages you will and won''t need
    in your system, the best idea is to trust the installer (when possible) to allow
    you to select by hand the packages or groups of packages you need. There are a
    few things to keep in mind when the selection:


    +   - Development tools are a bad idea. Unless you plan to do software development
    on the system, install few or no tools. Installing C and C++ compilers and related
    tools for non-workstation systems is certainly unwarranted in nearly all cases.
    If you need to compile some software before placing the system into service, compile
    the software on a separate workstation machine and copy the files to the server
    machine over the network.


    +   - Don''t install XFree86 on a server. Since the X Window System uses a network
    protocol to communicate, it is fundamentally network aware and also fundamentally
    as vulnerable as any other network service to malicious attacks. If you won''t
    be doing desktop application work on a given machine, don''t unnecessarily increase
    the risk level associated with the machine by running X on it.


    +   - Limit the number of services you install. In general, if you''re sure you
    won''t ever use a service on the machine, don''t install it. For example, for
    a machine that will only act as a firewall/router to connect your LAN to the Internet,
    there is no reason to install Apache, WuFTP, NFS, or other network services.


    +   - Do the same for applications late. If you''re installing for a machine that
    will have no desktop or workstation functionality, avoid installing applications,
    games, or unnecessary software packages. There''s a great deal of software on
    the average Linux CD, the vast majority of it is designed for desktop workstation
    users. Don''t install software you won''t use on your server or network infrastructure
    machine; there''s no functional need, and you may unknowingly install a program
    that presents a risk of compromise.


    +   - Avoid excessive user-space hardware support. Take care to avoid installing
    user-space support for hardware devices you don''t plan to use. Generally, such
    binaries will either be SUID/SGID or employ some trick in order to interact directly
    with hardware. Any binary that has permission in any way to access hardware can
    conceivably pose a threat to system security.'
