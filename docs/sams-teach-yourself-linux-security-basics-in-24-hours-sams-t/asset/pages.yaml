- img_proc: true
  md: 'primary In a sense, another word for “account.” A primary is an entry in the
    KDC’s database that refers to a user, an administrator, or a host in the realm.
    Each primary has a password and, if so configured, additional policy information
    describing the primary’s properties and privileges.


    realm The area of influence of a Kerberos network or, more specifically, usually
    a single KDC. Inside a Kerberos realm, one typically finds a number of users,
    administrators, and hosts. By convention, a realm is the network’s domain, converted
    to ALL CAPS.


    ticket A small unit of identification given to a primary that is then used, in
    conjunction with the KDC, to authenticate that primary to other primaries in the
    realm.'
