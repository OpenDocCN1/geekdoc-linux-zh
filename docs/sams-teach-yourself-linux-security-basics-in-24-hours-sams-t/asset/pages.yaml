- img_proc: true
  md: '# Pre-Chroot BIND Security


    Of course, there are some basic things that can be done before chrooting named
    to improve the security quotient under which your DNS machine will be operating.
    There are several aspects of configuration that fall under this umbrella.


    First and most importantly, keep your BIND packages up-to-date. There are times
    when bug fixes for BIND seem to come almost rapid-fire style, and BIND intends
    to be very popular among script kiddies, so it''s important to stay on top of
    things, especially when your BIND socket will be open to hosts on an external
    network interface.


    Next, implement packet filtering and take care of a few important options and
    issues in the named port. We''ll discuss this now.


    # Packet Filtering for the Domain Port


    BIND uses both the TCP and UDP protocols, the former for larger queries and the
    latter for smaller ones, so to filter unwanted requests using packet filtering,
    we''ll have to account for both protocol types. Using ipables, a general form
    is shown in Listing 13.1.


    +   Listing 13.1 DNS Port Filtering with ipchains


    ```

    iptables -A input -p tcp -s 192.168.1.0/24 \

    -d int.number.here domain -j ACCEPT

    iptables -A input -p udp -s 192.168.1.0/24 \

    -d int.number.here domain -j ACCEPT

    #ipchains -A input -p tcp -s trusted.ext.system.ip \

    -d ext.number.here domain -j ACCEPT

    ipchains -A input -p udp -s trusted.ext.system.ip \

    -d ext.number.here domain -j ACCEPT

    iptables -A input -i lo \

    -d ext.number.here domain -j DENY -1

    ```


    Note that one iptables command is commented out. This is the command that allows
    larger (TCP) transfers on the external interface to a specific trusted host. Uncomment
    and use this command if you need to for your circumstances (for example, for transfers
    from inside to outside); otherwise you''re safer to leave it out. In most cases
    for small networks, using of filtering rules will match your needs. A similar
    set of rules for those using iptables is shown in Listing 13.2.


    +   Listing 13.2 DNS Port Filtering with iptables


    ```

    iptables -t filter -A INPUT -p tcp -s 192.168.1.0/24 \

    -d int.number.here --destination-port domain \

    -j ACCEPT

    ```'
