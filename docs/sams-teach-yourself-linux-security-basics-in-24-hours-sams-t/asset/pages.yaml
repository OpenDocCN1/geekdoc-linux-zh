  md: '# Using iptables for Firewalling and Routing


    When using iptables, the user defines a series of rules that determine what should
    happen to a network packet. A chain of rules processes various types of network
    packet activity. Each chain is one of a group of chains belonging to a specific
    table. The relationship of rules, chains, and tables is as follows:


    +   - There are three major tables in the new packet filtering code. They are
    the filter table, the nat table, and the mangle table. Each table contains a series
    of rule chains that will be used to process packets in a given context.

    - The filter table is the default example; no other is specified when calling
    iptables. The filter table contains the INPUT, FORWARD, and OUTPUT chains, which
    are processed for incoming, forwarded, and outgoing packets, respectively. These
    chains are similar to the same chains in the iptchains tradition.

    - The nat table handles address translation (including functionality related to
    masquerading) and contains the PRERUTING, OUTPUT, and PROSUTING chains, which
    are processed for incoming forwarding packets, locally generated packets, and
    outbound foldable packets, respectively.

    - The mangle table is used for special packet mangling and contains two chains,
    PRERUTING and OUTPUT, which are similar to the chains in the nat table with the
    same names. We will not concern ourselves with the mangle table in this text.

    - The rules in each chain are order-dependent. When a packet is processed, it
    is matched against rules in the linked chain, from first to last. Order is therefore
    important!

    - The user can create new chains, name them, and place rules in them as desired.
    These chains must then be called by the user in order for them to have any effect.


    Users of iptchains or the older ipfwadm might notice that the new iptables command
    has incorporated functionality from several other commands, bringing all packet
    filtering functionality in Linux under the umbrella of a single command.


    When you have mastered IPTables, you will have a firm grasp on the functionality
    of Linux packet filtering as an entire topic.


    # Understanding iptables Rules


    Of course, we''ve left nothing out here. Just what does an iptables rule look
    like? Fundamentally, a rule has four major components. The first and second are
    the table and chain to which the rule should belong. For example, if no table
    is specified, then it is assumed that the specified chain is a member of the filters
    table. The third component of a rule can be thought of as the rule''s matcher—a
    criterion or series of criteria that dictates which packets are matched, and therefore,
    when this rule should be used.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'The fourth and final component is the target, the actual task that will be
    carried out when a rule matches a packet. The iptables command is extensible via
    kernel modules and therefore includes support for many more targets than the ipchains
    command did. The most common targets are shown in Table 11.2.


    # Table 11.2 Most Common iptables Targets


    | Target | Description |

    | --- | --- |

    | ACCEPT | When a matched rule sends a packet to the ACCEPT target, the packet
    is allowed to pass through the network filter to the system, as it would have
    if no filter had been in place. |

    | DROP | When a matched rule sends a packet to the DROP target, the packet is
    filtered out of network traffic on the system and is never heard again. analogous
    to the DENY target when using ipchains. |

    | REJECT | When a matched rule sends a packet to the REJECT target, the packet
    is filtered out by the filter and an ICMP message notifies the sender that the
    packet was not accepted and has been dropped. In order to use the REJECT target,
    you must have enabled in the kernel or have the related module. |

    | MASQUERADE | When a matched rule sends a packet to the MASQUERADE target, the
    packet is masqueraded for routing to or from the outside world. This target can
    be used only in the POSTROUTING chain of the nat table. In order to use the MASQUERADE
    target, you must have enabled in the kernel or have the related module. |

    | SNAT | When a matched rule sends a packet to the SNAT target, the packet''s
    source address is translated for routing to or from the outside world. This target
    can be used only in the PRERUTING chain of the nat table and is typically used
    in place of MASQUERADE for routers with a static IP. When using SNAT, the --option
    is also supplied, with the address or range of addresses representing the new
    source packet. |

    | DNAT | When a matched rule sends a packet to the DNAT target, the packet''s
    destination address is translated for routing to or from the outside world. This
    target can be used only in the PRERUTING chain of the nat table and is typically
    used for configuring transparent proxies or performing forwarding. When using
    DNAT, the option is also supplied, with the address or range of addresses representing
    the new packet destination. |

    | LOG | When a matched rule sends a packet to the LOG target, information about
    the packet is logged. A number of extended options can be supplied with the LOG
    target, the most common of which is --prefix, to control the text string that
    precedes every log entry. In order to use the LOG target, you must have enabled
    it in the kernel or have the related module. |

    | (User chain) | When a matched rule sends a packet to a named user chain instead
    of one of the predefined targets listed here, processing of rules for this packet
    will jump to the current chain of rules and begin traversing the name user chain
    rules. In a sense, this can be thought of as a kind of subroutine calling chains
    |'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Using iptables for Firewalling and Routing


    # Table 11.2 continued


    | Target | Description |

    |---|---|

    | RETURN | Used only at the end of user rule chains; when the end of a chain is
    reached, this rule sends the packet back to the original calling chain for further
    processing, beginning where the calling chain previously left off. The traversal
    of that chain is then completed. In a sense, this can be thought of as returning
    from a sub-routine chain |


    Each rule can match multiple packets depending on the criteria supplied to iptables,
    each rule can send packets only to a single one of these targets.


    # Calling Syntax for the iptables Utility


    The iptables utility not only incorporates all the functionality formerly present
    in ipchains, but incorporates functionality from other utilities such as ipmasquad
    as well. Therefore, the syntax for iptables can be extremely complex, and you
    should consult iptables (8) for a complete enumeration. The syntax can usually
    be simplified, however, to the following:


    ```

    iptables [-t table] CMD [chain] [rule-spec|num] [options]

    ```


    The basic list of commands known to the iptables utility is shown in Table 11.3.


    # Table 11.3 Common iptables Commands


    | Command | Description |

    |---|---|

    | -A (--append) | Appends one or more new rule(s) to the end of the specified
    chain |

    | -D (--delete) | Deletes the numbered or matching rule from the specified chain
    |

    | -R (--delete) | Replaces the numbered or matching rule in the specified chain
    |

    | -I (--insert) | Inserts one or more new rule(s) in the specified chain just
    before the number rule |

    | -L (--list) | Lists all rules in the selected chain or, for example, if no chain
    is specified, list all rules in all chains |

    | -F (--flush) | Flushes (deletes) all rules in the specified chain and table
    |

    | -N (--new-chain) | Creates a new chain with the specified user-supplied name
    |

    | -X (--delete-chain) | Deletes the specified user-created chain |

    | -E (--rename-chain) | Renames the specified user-created chain |

    | -P (--policy) | Sets the blanket policy for the specified chain to the given
    target |

    | -C (--check) | Checks the given packet to see whether it matches a rule in the
    specified chain |'
  merge: -1
