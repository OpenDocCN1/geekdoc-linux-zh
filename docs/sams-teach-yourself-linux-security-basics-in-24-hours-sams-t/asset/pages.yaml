  md: 'SUID/SGID properties are useful because they allow programs like /usr/sbin/pppd,
    for example, to access system networking resources and the modem device—to which
    normal users don''t generally have access. Without SUID/SGID properties, the /usr/sbin/pppd
    program would be available only to the root user, meaning that normal users could
    not initiate a dial-out connection.


    # Setting SUID/SGID with chmod


    The chmod command can be used to set or clear the SUID/SGID properties for a file.
    In symbolic mode, the related character is s and can be applied only to a program
    binary that already shows the x property for the user. For example, to set the
    /usr/sbin/pppd program to SUID/SGID status,


    ```

    chmod +s /usr/sbin/pppd

    ```


    To clear the SUID status but leave the SUID status intact,


    ```

    chmod -s /usr/sbin/pppd

    ```


    The numeric mode can be used as well to specify SUID/SGID properties. Instead
    of using a series of three digits, four digits must be used when specifying SUID/SGID
    properties. If four digits are present, the first will automatically be used for
    special properties. A value of 4 represents the SUID property, and a value of
    2 represents the SGID property. To set a program to public read, write, and execute
    for user and group, read and execute only for others, with SUID and SGID set,
    you''d use


    ```

    chmod 6775 myfile

    ```


    # Eliminating Unnecessary SUID/SGID Permissions


    Because of the implications for system security, it is imperative that any SUID/SGID
    programs that are not absolutely needed be weeded out of a system immediately.
    To find SUID/SGID binaries in your file system, simply use the find command with
    the -perm argument to specify the permissions to look for:


    ```

    find -perm +6000 -follow

    ```


    This command causes find to search the entire set of mounted file systems for
    whose permissions include either SUID or SGID binaries (zero matches all values;
    find(1) for details). The additional -follow argument carries symbolic links to
    be fol-low as well, just in case.


    Once you have the list from this command, use manual pages and common sense to
    determine which SUID or SGID binaries should retain this special status. Most
    of the binaries of this will be in /usr/sbin and will be network-related items
    such as traceroute or /usr/sbin/pppd, which strictly speaking don''t need SUID/SGID'
