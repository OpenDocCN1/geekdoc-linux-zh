  md: '# A Simple Ruleset That Works


    Now that we have at least documented the command syntax of iptables and the logic
    upon which it operates, we can begin to add rules that will govern packet filtering
    in real life. This process is a tedious one and it might take you some time to
    get it correct, especially with very complex rulesets. The sample presented here
    is reasonably secure for most systems or private networks with a limited number
    of internal users. Try to follow the logic of each rule as it is presented, and
    you''ll be well on your way to creating your own rules to match your particular
    circumstances.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_189_0.png)


    The idea behind this simple ruleset is to create a few circumstances in which
    we accept incoming packets and to deny everything else. We won''t bother trying
    to filter out going packets, making the assumption that everyone on the "inside"
    is trusted and not committing illegal acts. We can use connection state matching
    to begin our simple ruleset by explicitly enabling all non-bound TCP


    ```

    iptables -t filter -A INPUT -m state \

    --state ESTABLISHED,RELATED -j ACCEPT

    ```


    Because state matching works only with TCP packets, we''ll still need some additional
    rules for UDP packets. DNS is perhaps the most fundamental service of all on today''s
    Internet, so let''s allow nameserver lookups to occur. Assuming that our nameserver''s
    IP address is stored in the environment variable DNS, we add the following:


    ```

    iptables -t filter -A INPUT udp -p $DNS \

    --source-port domain -j ACCEPT

    ```


    These four lines create rules for the default filter table''s INPUT chain (incoming
    traffic) making all TCP packets related to existing connections and UDP packets
    related to the domain service (via /etc/services) acceptable. Since we''ve already
    allowed TCP packets for established and related connections, no additional work
    is required for outbound Web or Ftp traffic.


    Now we want to make sure any packets that we haven''t explicitly allowed. In the
    process, it would be nice to make some logs as well. To do this, we add


    ```

    iptables -N logden

    iptables -t filter -A logden -j LOG \

    --log-prefix "iptables: "

    ```'
