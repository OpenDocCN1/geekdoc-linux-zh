  md: '# Using iptables for Firewalling and Routing


    Many users with basic TCP/IP knowledge do not recognize the slash and following
    number on IP specifications like 0.0.0.0/0 or 192.168.1.0/24. This slash and following
    number are called the network mask.


    The number following the slash indicates the number of bits (from "left" to "right")
    in a sense that are significant. For example, the IP 255.255.255.255 (the largest
    possible IP number in IPv4) is represented by four 8-bit words, each containing
    11111111 or the decimal number 255. These four 8-bit words, taken together, represent
    32 bits of data. In a configuration file when supplying IP addresses to ipvchains
    that will need to match a range of IP addresses, it is convenient to use a format
    such as


    ```

    192.168.1.0

    ```


    However, in such circumstances, we also want to indicate that we do not mean a
    host specifically assigned the address 192.168.1.0, but rather that only the first
    three numbers (192.168.1) are significant or fixed. The last digit is a kind of
    wildcard. Therefore, we specify


    ```

    192.168.1.0/24

    ```


    This means that the 24 bits (192.168.1) are significant and that the last 8 bits
    (the number 0 in this case) are not and can match any number.


    # State-Based Matches


    New with iptables is the capability to create rules based on packet states, using
    the state module. The format for creating rules based on state matches is


    ```

    iptables -m state --state [!] [state,state...]

    ```


    The four matchable packet states are shown in Table 11.5.


    | Table 11.5 State Module Matches |

    | Match | Description |

    | --- | --- |

    | NEW | Matches packets that initiate a new connection. |

    | ESTABLISHED | Matches packets that belong to an already open connection, and
    thus are sent in reply to other packets. |

    | RELATED | Matches packets that are related to another connection, for example
    the data section for filter transfer protocol exchanges. |

    | INVALID | Matches packets that don''t make any sense within the context of the
    existing connection or packets that couldn''t be successfully received for some
    reason. |


    The capability to match packets based on state information using iptables and
    kernel 2.4 greatly simplifies the packet filtering process.'
  merge: -1
  pgno: 188
