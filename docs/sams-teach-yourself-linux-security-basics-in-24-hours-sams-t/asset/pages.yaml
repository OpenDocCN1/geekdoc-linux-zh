    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_359_0.png)


    +   The method for restricting the list of files to be processed is a little more
    complicated in afio than it is in tar, so we won''t go into it here.

    - -y option and an argument in the form of a shell pattern causes files matching
    the supplied pattern to be processed and files not matching the pattern to be
    excluded.

    - -Y option and an argument in the form of a shell pattern causes files not matching
    the supplied pattern to be processed and files that do match to be excluded.


    Additional information on using afio for more complex operations, including multilevel
    (multi-tape) support and double-buffering for speed, can be found in the afio
    manual at afio(1).


    # Using mt to Operate Tape Devices


    While tar and afio are used for writing and reading from data storage devices,
    magnetic tape drives generally require more intervention than simple read or write
    commands. Functions such as tape loading and unloading, rewind, retention, density
    configuration, and fast file searching are not supported by tar or afio.


    The mt command is used to control tape devices. The basic syntax used in common
    situations with mt is


    ```

    -f device operation_command [arguments]

    ```


    A list of the most common operation commands and their arguments is shown in Table
    23.1.


    **Table 23.1** Common mt Operation Commands


    | Command | Description |

    |--- | --- |

    | rewind | Rewinds the tape. |

    | offline | Rewinds and ejects the tape. |

    | status | Shows the current status of the tape drive, including whether or not
    a tape is present and, if so, the density being used to write to the tape. |'
