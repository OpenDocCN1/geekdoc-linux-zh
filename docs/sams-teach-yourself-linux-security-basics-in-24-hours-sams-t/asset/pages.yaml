    \ for the small business user to focus on physical security as an important step\
    \ in preventing data loss or service interruption.\n\n# Location, Location, Location!\n\
    \nThe simplest way to provide good, solid physical security is to secure a secure\
    \ location for your system's installation. What means in simple terms is that\
    \ if a system doesn't need to be physically available to the public, don't let\
    \ it be. There are a few axioms that, when followed closely, can prevent nearly\
    \ all physical attacks involving systems that do not need to be publicly accessible.\n\
    \n+   * Keep your server and other machines in the back room\n  If you run a small\
    \ business with enough floor space, it may seem impressive to display your Web\
    \ server to your customers. However, if possible, keep all of your computer systems\
    \ in a back room. When spatially possible, run monitors, keyboards, and mice on\
    \ extended cabling to public areas. Keeping the processing units themselves in\
    \ a back room and away from public hands solves nearly every problem discussed\
    \ in this hour.\n\n+   * Secure the environment\n  Of course, no midnight thief\
    \ is going to consider the back room to be off limits. Ensure that the environment\
    \ in which your system runs is well secured day and night. Invest in high-quality\
    \ locks as well as in an alarm system when possible, and be sure to lock up and\
    \ enable the alarm whenever you leave the area, even if it's just for a 10-minute\
    \ trip to the sandwich shop.\n\n+   * Secure the power controls\n  If your environment\
    \ is locked tightly but your Web server is down due to loss of power, your customers\
    \ are cut off from your services. Know where your building's power sources are.\
    \ Old buildings especially may have circuit breakers or fuses in old or publicly\
    \ accessible locations. A padlock for the breaker box is an inexpensive investment\
    \ that can prevent all kinds of juvenile pranks, innocent accidents, malicious\
    \ attacks."
