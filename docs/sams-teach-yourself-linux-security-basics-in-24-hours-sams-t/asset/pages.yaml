    # More on Kadmin


    So far, we haven''t discussed the kadmin utility in great detail. This is because
    it''s really

    a very simple utility. There are three operations you should concern yourself
    with in a

    small Kerberos realm when starting out.


    The first is the add_principal command with which you are already familiar.

    add_principal command is used to add new principals (administrators, hosts, or
    users)

    to the KDC''s authentication database.


    The next is the delete_principals command, which works largely the same way, but
    has

    the opposite effect. It deletes whichever principal you supply from the KDC''s
    database,

    meaning that the principal in question will no longer be authenticatable.

    The third is the list_principals command, which does just that. It lists all principals

    p in the KDC database, one per line. Wildcards can also be used; for example,
    to list

    off all the hosts in the realm that are known to the KDC, supply a pattern like

    host/*@MYNET.NET as an argument.


    A few others are also supported, such as password changes and more complex

    per-user control using a technique called a policy. These are actually quite simple
    to use

    and are documented fully in kadmin(8), located in /usr/local/kerberos/man/man8.


    # Using Kerberos 5


    After you have a KDC up and running in your local area network and at least two
    hosts

    are "registered" with the KDC and prepared for Kerberos-enabled operation, it''s
    time to

    how to use Kerberos for authentication. Using Kerberos in a non-administrative

    capacity is quite simple, and most users adjust to it immediately.'
