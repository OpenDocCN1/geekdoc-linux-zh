  md: 'You should be able to launch a Web browser and visit your Web server from another
    system on your network, both with http:// and with https://, though at this point
    both types of connection share the same document root tree. Check to see that
    you can connect both ways and that, when connected securely, the Web browser can
    verify that your connection is secure.


    When connecting with SSL enabled, you may notice that Netscape (or another browser
    if you''re not using Netscape to connect) asks you about the certificate being
    supplied by your server, as is shown in Figure 18.1.


    # Figure 18.1

    Netscape may ask about your certificate.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_301_0.png)


    The browser asks how you want to proceed because the certificate your site is
    using self-signed, meaning that there is no trusted third party to verify the
    authenticity of your server. This shortcoming does limit security to some degree,
    because there is no way for a connecting user to be sure that he is really talking
    to your server.


    However, once the browser has been instructed to accept the certificate in spite
    of the fact that it is self-signed, the connection will be encrypted with full
    128-bit RSA encryption (if your browser supports it). Assuming that both the connecting
    client and the server are who they claim to be (and in this particular case, you
    know for a fact that they are), the data flowing back and forth through the connection
    is very secure.


    # Summary


    In this hour, you learned about using the mod_ssl module to Apache to enable your
    Linux Web server to operate with encrypted SSL connections for increased security.


    You learned how to download and compile an enhanced Apache server with mod_ssl
    included and to install and configure the server enough that it can be launched
    and tested successfully. Your server is now ready for full configuration before
    going online as a secure server.'
