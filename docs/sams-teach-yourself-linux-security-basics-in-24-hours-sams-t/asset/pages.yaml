  md: '# Q&A


    Q I''m still a little confused about how permissions work. What about scenario
    foo? Scenario bar?


    A best way to learn about permissions and get a feel for the way they work is
    to make a temporary directory, for example off of /tmp tree, and to play with
    them. By creating files and directories, using su and chmod to give them various
    permissions and test these permissions against various identities. Through experimentation,
    you''ll get a better feel.


    Q I changed the permissions as suggested in the /dev directory and I don''t have
    sound, I can''t access my floppy, my mouse doesn''t work, and my 3D games can
    only be run by root.


    A This is intended side-effect of the permissions change. If you need sound for
    non-root users, feel free to back and change permissions for the /dev/dsp and
    /dev/audio devices to make them available to all users. The same thing applies
    to the /dev/fd0 device or other devices you want made public.


    The idea is to implement an unspoken policy of "deny now, allow later" and to
    allow this to guide your actions and thinking. If you need a device to be publicly
    accessible and are willing to trade the risk for the benefit, by all means, chmod
    to give back the necessary permissions.


    Q know that the small letter s in permissions output means SUID or SGID permissions
    are set, but there are some files on my system with a large s in permissions output.
    What does this mean?


    A The large s is an essentially meaningless combination. It means the SUID or
    SGID bit is set for this file, but the execute bit for the related role is not.
    This means, in essence, the binary would run SUID or SGID if it could, since no
    execute permission exists, it can''t.


    Q Is there any way to give or remove permissions to a whole disk or file system
    at a time?


    A Yes. Use the execute permission flag (x) on file system mount points. For example,
    if you have a hard drive file system mounted on /dev/bpdisk and you want only
    root to access to this file, simply make sure that the mount directory, /dev/bpdisk,
    is owned by root and then remove group and other read, write, and execute permissions
    from the mount directory.


    Q I want to use a read-only file system, but when I try, I get unexpected errors
    or some programs or system resources don''t work properly.'
