  md: '# System and User Fundamentals


    # LISTING 5.3 continued


    | lrwxrxrwx | 1 root root | 20 May 3 22:58 S21nis-client -> ../init.d/nis-clien
    |

    | lrwxrxrwx | 1 root root | 13 May 3 22:58 S26ipx -> ../init.d/ipx |

    | lrwxrxrwx | 1 root root | 13 May 3 22:58 S30amd -> ../init.d/amd |

    | lrwxrxrwx | 1 root root | 13 May 3 22:58 S30ntp -> ../init.d/ntp |

    | lrwxrxrwx | 1 root root | 13 May 3 22:58 S35ipd -> ../init.d/lpd |


    Notice that the symbolic links have been named in a way that forces them to be
    executed in a specific order. Notice also that each of these is simply a symbolic
    link to a universal script located in ../init.d. The name of the scripts should
    be familiar: S15portmap brings up the portmapper, S16net starts the Internet daemon,
    S31ipd brings the print daemon, and so on. Each directory, rc.d through rc6.d,
    contains a series of these symbolic links. The links appearing in any one directory
    depend on which services should or shouldn''t be started (or killed) for the runlevel
    in question.


    This arrangement is called SystemV-style init configuration after the format used
    by the popular System V release of Unix. In Linux, it''s often simply a SysV-init
    configuration for short.


    # Finding and Disabling Unnecessary Services


    If you''ve checked your own rc.d directories, you''ve probably noticed that quite
    a few services seem to be started for each runlevel, especially for multi-user
    runlevels controlled by the rc.3 and rc.5 directories. It is very likely that
    you won''t needing all of them, and it is in the interest of better security that
    you turn off services you won''t be needing.


    To turn off a service in a given runlevel, simply remove the symbolic link. For
    example, to disable the xfs font server in runlevel 5, remove the script associated
    with it from rc.5:


    ```

    cd /etc/rc.d/rc.5

    mkdir disabled

    mv S70xfs disabled

    ```


    Of course, the path to rc.d should be adjusted to match the path on your system,
    and the name S70xfs should be adjusted to match the name link in your case. Be
    sure not to remove the original script in the init.d directory, or you''ll affect
    the service in all runlevels, rather than just in the one you intend to edit.


    > Some of the services we''re about to see seem fairly harmless, tempting to leave
    them enabled even if you don''t use them often or don''t really need them. Avoid
    this temptation.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_90_0.png)'
  merge: -1
