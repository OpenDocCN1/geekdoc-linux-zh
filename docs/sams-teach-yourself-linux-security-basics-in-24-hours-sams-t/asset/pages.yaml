    20, “Encrypting E-Mail Data,”


    # New Terms


    access control list (ACL) A more flexible set of permissions properties than is
    available via the standard Linux permissions paradigm.


    permissions defaults A set of permissions given the default label, which will
    be assigned by default to any newly created file within the directory in question.


    permissions mask A set of permissions which defines the maximum permissions granted
    to any entry in the ACL list, regardless of explicitly specified permissions.


    secure delete A method of removing files from the file system, which attempts
    to completely erase the magnetic patterns and traces left by the file, rather
    than simply making the space it occupied available once again.'
