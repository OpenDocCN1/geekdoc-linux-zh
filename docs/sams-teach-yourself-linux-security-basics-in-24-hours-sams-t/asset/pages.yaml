  md: '# Preserving Data


    clean and reinstall Linux from your installation CD. The other is to wipe the
    hard drive clean and restore from a series of backups made before the system was
    compromised. Most users prefer the latter.


    # Using tar and afio for Backups


    Despite the proliferation of user-friendly backup solutions, tar and afio remain
    the two most commonly used standbys for Linux data storage and retrieval. This
    is probably because tar and afio are both small enough to fit on a rescue floppy,
    and neither requires any support infrastructure in the form of additional libraries,
    configuration files, or graphics support.


    # Simple Backup and Restore with tar


    The tar command can archive data to a file or to a tape or raw disk device. The
    syntax for a typical tar command is as follows:


    ```

    tar -[c|x|t] -pv device path1 path2 ...

    ```


    Each invocation of tar requires a command, usually c for create, x for extract,
    or t for test. The p option instructs tar to preserve original file ownership
    and permissions when extracting. The v option instructs tar to operate verbose.
    The f option and the argument that follows specify that tar should write to the
    given device. All arguments to tar given path1, path2, and so on are directory
    trees or files that are to be added to the archive.


    For example, to write the /usr tree to the tape in the drive located at /dev/st0,
    the command is


    ```

    tar -cf /dev/st0 /usr

    ```


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_356_0.png)


    > At glance, it appears that a simple command to back up an entire file system
    is to tar -cf /dev/st0 / because this command will attempt to back up the /proc
    directory as well. Depending on your kernel version, this may add hundreds of
    megabytes of unwanted kernel runtime data to your backup or even cause tar to
    freeze or segmentation fault. Backing up the root directory/) also backs up the
    /mnt directory, where things like mounted CD-ROM data are often found, and any
    mounted network-file systems (which can be a good thing or a bad thing, depending
    on what you intended to do).'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'To back up your root directory but except the /proc and /mnt directories, try
    constructing a command like this one:


    ```

    tar -cf /dev/st0 $(ls -1 | grep -v -e proc -e mnt)

    ```


    This will back up all directories in the root directory but leave out the /proc\and
    /mnt trees.


    When a tar archive is created, the leading slash (/) will normally be removed
    from each filename. This means that when the files are restored, they will be
    restored relative to the working directory in which tar is running. For example,
    to restore files from the tape in /dev/st0 to their original location, the command
    is


    ```

    cd ; tar xpf /dev/st0

    ```


    During extract (restore) operations, additional paths can be specified. These
    paths then represent the limited list of files that to be extracted. Wildcards
    are permitted. To restore only the /usr/X11R and /usr/local trees to their original
    location in /dev/st0, use


    ```

    cd ; tar xpf /dev/st0 ''usr/X11R6/*'' ''usr/local/*''

    ```


    To restore the data stored on the SCSI magneto-optical drive at /dev/sdc relative
    to the /usr/local tree on the local machine, preserving all permissions and ownership
    and displaying the names of the files as they are restored, use


    ```

    cd /usr/local; tar -xpf /dev/sdc

    ```


    You can use the tee command to display the list of processed files to the terminal
    at the same time writing to a list to:


    ```

    cd ; tar -xpf /dev/sdc | tee /var/log/restored.files

    ```


    Additional information on using tar for more complex operations, including multilayer
    or incremental backup, and can be found in tar(1).


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_357_0.png)


    > There''s the z option for tar hasn''t been mentioned here. While it''s true
    that, for example, tar -cz will create a compressed tar archive, the compression
    of the tar is stream based.


    This means that you are storing to magnetic tape, which is often affected by high
    error rates, and an unrecoverable bit error encountered, you will not lose only
    the entire tape.


    Because of this, the use of the z option for tar is recommended only for lowerror
    media such as magneto-optical. Note that this problem is not related to tape drives
    that employ hardware-based compression, making software compression unnecessary.'
