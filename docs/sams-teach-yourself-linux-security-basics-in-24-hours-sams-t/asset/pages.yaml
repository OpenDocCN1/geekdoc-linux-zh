- img_proc: true
  md: 'xauth command as already discussed. However, it can be a pain to transfer extracted
    cookie files between hosts. Because of this, there is a shortcut often used for
    exchanging cookies that may be helpful to you.


    Using the xauth command in conjunction with rsh and a pipe, it is possible to
    transfer a cookie from your account to your account on another host within an
    X session. Assuming the remote host is called foobar, the command would


    ```

    xauth extract - :0 | rsh foobar xauth merge -

    ```


    This command instructs xauth to place the cookie for the current display on standard
    output, which is then piped to an xauth command on the remote system ready to
    merge the cookie from standard input.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_247_0.png)


    This method for distributing the cookie has two caveats. First, you must have
    access to use rsh on the remote system. rsh is not a secure protocol in and of
    itself, and passing a magic cookie over rsh may be doubly insecure because rsh
    does not encrypt data as it is transferred.


    The solution to this problem is to perform the same function using ssh install.
    The ssh service will be detailed in Hour 16, "Encrypting Data Streams." Please
    install and use ssh instead of rsh for magic cookie exchange whenever possible.


    # Host-Based and Token-Based Authentication Interaction


    There is obviously some tension between host-based and token-based authentication,
    since it''s already been made clear that disabling host-based authentication is
    a bad idea. If you plan to use token-based authentication, it is essential that
    you completely empty your host authentication file and list so that there are
    no hosts that are authenticated merely on their identity.


    This is because host-based authentication supersedes token-based authentication
    when both are present. If a connecting system appears in the authenticated hosts
    list, the connection will be opened without any challenge for a magic cookie,
    even if token-based authentication has also been enabled. It is therefore pointless
    to place hosts (which are easily spoofed) into the host-based access control list
    and enable token-based authentication at the same time.


    # The X Display Manager (XDM)


    Because the vast majority of X clients will be on the same machine as the X server
    to which they connect, it is possible to automate the management of token-based
    authentication even further. This is done using the X Display Manager, or XDM,
    which is'
