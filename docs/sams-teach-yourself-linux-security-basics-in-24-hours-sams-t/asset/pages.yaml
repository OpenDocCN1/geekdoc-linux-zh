    # Using tcppdchk and tcpmatch


    If all seems a little confusing and you''d like a quick and easy way to test your
    /etc/hosts.allow and /etc/hosts.deny configurations, you''re in luck. Two utilities
    are included to aid in the construction of working rules files.


    The tcppdchk file simply reads both of your rule files and ensures that there
    are no problems with them. Possible problems include incorrect syntax and inconsistencies
    between /etc/hosts.allow, /etc/hosts.deny any other files like /etc/inetd.conf.
    To run the checker, simply enter the following:


    ```

    tcppdchk

    ```


    If there is no output, your files are correctly formatted, and tcppdchk was unable
    to find any obvious problems or warnings. If there were problems or warnings,
    you will get a clear, concise, but brief list of them, which should help you to
    correctly format and configure the two files.


    The tcpmatch utility is used once after tcppdchk has verified its syntax to see
    if your rules actually do what you intended for them to do. The syntax is:


    ```

    tcpmatch daemon host

    ```


    For example, to see what would happen if the host at 192.168.1.59 were to make
    a Telnet request to the system, you''d


    ```

    tcpmatch in.telnet 192.168.1.59

    ```


    In each case, tcpmatch will give you a list of each triggered rule, in the order
    in which it was encountered. You''ll also be informed if any shell command was
    executed. Be sure'
