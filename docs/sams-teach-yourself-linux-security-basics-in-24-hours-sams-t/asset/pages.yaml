  md: '# Using ipchains


    With ipchains, as is the case with any complex system, the devil can be in the
    details. Really, however, the basic logic behind ipchains is simple. The user
    defines a series of rules that determine what should happen to a network packet.
    Each rule is one in a chain of rules that process all incoming, outgoing, or forwarded
    packets on a system. More explicitly, the contexts surrounding rules and chains
    are as follows:


    +   - There are three chains, or collections of rules. They are the input chain,
    the forward chain, and the output chain. When a packet is received by the filter,
    it will always be matched against the rules in the input chain. If a packet is
    to be forwarded by the filter to another host, it will be matched against the
    rules in the forward chain. If a packet is to be sent onward by the filter, it
    will be matched against the rules in the output chain before being sent.

    - The rules in each chain are order-dependent. When a packet is processed, it
    is matched against the rules in the related chain, from first to last. Order is
    therefore important!

    - The user can create new chains, name them, and place rules in them as desired.
    These chains must be “called” by the user, in order for them to have any effect.


    If you grasp these three basic ideas, understanding the rest of ipchains isn’t
    nearly as remote a prospect as many users assume it to be.


    # Understanding ipchains Rules


    Of course, we’ve left something out here. What does a rule look like? Fundamentally,
    a rule has three major components. The first is the name of the chain to which
    the rule should belong. The second can be thought of as the rule’s matcher—a criterion
    or series of criteria that dictates packets are matched, and therefore, when this
    rule be used. The third and final component is the target, the actual task that
    will be carried out when a rule matches a packet. There are seven possible targets,
    shown in Table 10.2.


    | Table 10.2 Seven Targets Used by ipchains |

    | Target | Description |

    | ACCEPT | When a matched rule sends a packet to the ACCEPT target, the packet
    is allowed to pass through the network filter to the system, as if it would have
    no filter in place. |

    | DENY | When a matched rule sends a packet to the DENY target, the packet is
    filtered out of network traffic on the system and is never heard from again.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Using ipchains for Firewalling and Routing


    **Table 10.2** continued


    | Target | Description |

    | --- | --- |

    | REJECT | When a matched rule sends a packet to the REJECT target, the packet
    is filtered out, and an ICMP message is notifying the sender that the packet was
    not accepted and has therefore dropped. |

    | MASQ | When a matched rule sends a packet to the MASQ target, the packet is
    masqueraded for routing to or from the outside world. This functionality requires
    that the CONFIG_IP_MASQUERADE kernel option be enabled. |

    | REDIRECT | When a matched rule sends a packet to the REDIRECT target, the outbound
    packet is redirected transparently to the specified local network port. This functionality
    requires that the CONFIG_IP_TRANSPNT_PROXY kernel option be enabled. |

    | (user chain) | When a matched rule sends a packet to a named user chain instead
    of one of the predefined chains listed here, processing of rules for this packet
    will jump to the current chain and begin traversing the named user chain of rules.
    In a sense, this can be thought of as a kind of subroutine calling chains.

    | RETURN | Used only at the end of user rule chains; when the end of a chain is
    reached, the rule sends the packet back to the original chain for further processing,
    beginning where the calling chain previously left off. The traversal of that chain
    is then completed. In a sense, this can be thought of as returning from a subroutine
    chain of rules. |


    Each rule can match multiple packages depending on the criteria supplied to ipchains,
    but each rule can send packets only to a single one of these targets.


    # Calling Syntax for the ipchains Utility


    One single utility, ipchains, is used to add rules to chains, to remove rules
    from chains, and to create new chains. Therefore, the syntax for ipchains is relatively
    complex. The calling syntax looks like this:


    ```

    ipchains CMD [chain] [rule-spec|num] [options]

    ```


    The basic list of commands known to the ipchains utility is shown in Table 10.3.


    **Table 10.3** Common ipchains Commands


    | Command | Description |

    | --- | --- |

    | -A (append) | Appends one or more new rule(s) to the end of the specified chain.
    |

    | -D (delete) | Deletes the numbered or matching rule from the specified chain.
    |

    | -R (replace) | Replaces the numbered or matching rule in the specified chain.
    |

    | -I (insert) | Inserts one or more new rule(s) in the specified chain just before
    the number-given rule. |'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# TABLE 10.3 continued


    | Command | Description |

    | -L (list) | All rules in the selected chain, or if no chain is supplied, list
    all rules in all chains. |

    | -F (flush) | Flushes all rules in the specified chain. |

    | -N (new chain) | Creates a new chain with the specified user-supplied name.
    |

    | -X (delete chain) | Deletes the specified user-created chain. |

    | -P (policy) | Sets the blanket policy for the specified chain to the given target.
    |

    | -C (check) | Checks the packet to see whether it matches a rule in the specified
    chain. |


    Addition to a command, ipchains often require options, for example, in order to
    construct match criteria for an appended rule. The most used ipchains options
    are shown in Table 10.4.


    # TABLE 10.4 Common ipchains Options


    | Option | Description |

    | -p [!] protocol | Specifies the protocol matched by this rule, one of icmp,
    tcp, udp, or all. The exclamation mark (!) inverts the matching logic; when used,
    it should be surrounded by a space on either side. |

    | -s [!] addr [!] port | Specifies the source address and port matched by this
    rule. Ports can be specified either in numeric range (NNN:NNN) or symbolic (as
    /etc/services) form. If the packet type is ICMP, then port is one of the ICMP
    service names given by ipchains -h icmp. |

    | -d [!] addr [!] port | Specifies the destination address and port matched by
    this rule. Ports can be specified either in numeric range (NNN:NNN) or symbolic
    (as /etc/services) form. If the packet type is ICMP, then port is one of the ICMP
    service names given by ipchains -h icmp. |

    | -i [!] interface+ | Specifies the network interface matched by this rule. If
    present, the plus (+) character indicates that rule should match all interfaces
    of the same type as the specified interface. |

    | -j target | Dictates that, when matched, this rule should send the packet to
    this target (refer to Table 10.1 for a list of possible targets). |

    | -1 | Dictates that, when matched, this rule should cause information about the
    packet to be logged. |

    | [!] -y | Dictates that this rule should match only TCP packets that are initiating
    a connection. When preceded with an exclamation mark (!), it will match only TCP
    packets that are in response to already open connections. |'
