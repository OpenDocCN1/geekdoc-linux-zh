  md: '# Network Security: NFS and Samba


    Table 14.1 Linux 2.2 Kernel-Based NFS Options

    | Option | Description |

    |---|---|

    | CONFIG_NFS_FS | Includes NFS file system support, a logical counterpart to NFS
    server. |

    | CONFIG_NFSD | Includes the actual kernel-based NFS server. |


    In 2.4 kernels, the options related to the kernel-based NFS server are in the
    Network File Systems submenu of the File Systems section. They are shown in Table
    14.2.


    Table 14.2 Linux 2.4 Kernel-Based NFS Options

    | Option | Description |

    |---|---|

    | CONFIG_NFS_FS | Includes NFS file system support, a logical counterpart to NFS
    server. |

    | CONFIG_NFS_V3 | Includes support for Linux to act as an NFS version 3 client.
    |

    | CONFIG_NFSD | Includes the actual kernel-based NFS server. |

    | CONFIG_NFSD_V3 | Includes additional code to allow the kernel-based NFS server
    to work with version 3 clients, the best server/client match for systems using
    ACLs with the local file system. |


    Of course, you must compile and install the kernel in order to cause the changes
    to take effect.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_228_0.png)


    > Many Linux distributions already include support for kernel-based NFS service.
    Use a command such as locate to search for the modules nfsd.o, lockd.o, and sunrpc.o.


    # Configuring the /etc/exports File


    The /etc/exports file is the primary configuration file for the NFS system. Each
    entry in the file is one line, and the format is very simple:

    /path/to/export [host](option,option) ...


    Each line in the file defines one directory or subdirectory in the local file
    system to which the line applies. When an entry for a subdirectory of an already
    exported directory exists, the more specific entry (subdirectory) will override
    the less specific entry, creating a kind of exception.


    Following the export path at the beginning of each line is any number of host
    option specifiers. Each one of these specifiers contains a host (which may be
    an IP, a hostname, a network with mask, or a wildcard) and a series of options
    enclosed in parentheses'
