- img_proc: true
  md: '# Hour 10


    The idea behind this simple ruleset is to create a few circumstances in which
    we accept incoming packets and to deny everything else. We won''t bother with
    trying to filter outgoing packets, thus making the assumption that everyone on
    the “inside” is trusted and not committing illegal acts.


    DNS is perhaps the most fundamental service of all today''s Internet, so let''s
    allow nameserver to lookups occur. Assuming that our nameserver''s IP address
    is stored in the environment variable DNS and that our system''s IP is stored
    in the variable MYIP, we add the following rules:


    ```

    ipchains -A input -p TCP -s $DNS domain -j ACCEPT

    ipchains -A input -p UDP -s $DNS domain -j ACCEPT

    ```


    These two lines create rules for the input chain (incoming traffic) making both
    TCP and UDP packets acceptable as long as they come from the domain service (see
    /etc/services/) of our nameserver.


    We also want to be able to browse the Web on this system, so let''s accept TCP
    packets when there''t connection initiation attempts:


    ```

    ipchains -A input -p TCP ! -y -j ACCEPT

    ```


    Now, let''s also allow FTP to work. The file transfer protocol is odd because
    it tries to open a connection to a port on the requesting system using the ftp-data
    service. Ports over 1024 should be protected, as ports between 6000 and 6255,
    which can be used by us. When all is said and done, we''ll have to use two calls
    to ipchains to specify two different port ranges. The addition for FTP looks like
    this:


    ```

    ipchains -A input -p TCP -s 0/0 ftp-data \

    -d $MYIP 1024:5999 -j ACCEPT

    ipchains -A input -p TCP -s 0/0 ftp-data \

    -d $MYIP 6255:-j ACCEPT

    ```


    Now, finally, we want to make sure that any packets that we haven''t explicitly
    allowed:


    ```

    ipchains -A input -i lo -o ICMP -j DENY -1

    ```


    This line creates a rule that denies all packets except ICMP packets (used for
    sending ping responses) from all sources that do not come in the loopback interface
    (lo). It then logs information about any dropped packets so that we know when
    there is “funny business” happening on the network.


    To check our new rules, the -C argument can be used. The syntax associated with
    -C is similar to the syntax for -A, so it is easy to use once you''ve created
    a few rules.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Using ipchains for Firewalling and Routing


    For example, to see if a connection to the local machine from 206.144.232.16 on
    port

    80 can be established:


    ```

    # ipchains -C input -i eth0 -s 206.144.232.16 -d $MYIP -p tcp

    denied

    ```


    #


    The output of the ipchains program, in this case the word denied, fortells the
    fate of the

    hypothetical packet in question. It is a good idea to use the -C argument to check
    your

    rules as you create them.


    # Masquerading


    If your machine is more than just a single host, but is instead a link between
    your inter-

    network and the outside world, then things get a little more interesting. In order
    to

    masquerade, you must have at least two network interfaces. Usually, this will
    be eth0

    and one of ppp0 or eth1. Though it is possible to configure a masquerading system
    with

    only one hardware interface using aliasing, this can put hardware into

    promiscuous mode and is therefore not recommended.


    First, you''ll need to instruct the Linux kernel to enable IP forwarding, which
    is disabled

    default in 2.2 kernels. To do this, write a 1 into the /proc/sys/net/ipv4/ip_forward
    file:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    This change will away each time you reboot, so you might need to insert it into
    an

    init script to make the change permanent. We will append the script full of calls
    to

    ipchains we just made to accommodate the new role of the machine in question.
    If we

    still operate under the assumption that all the users on the internal network
    are trusted to

    behave, the changes are minimal. First, we need to add three new calls to ipchains
    for

    forwarding requests:


    ```

    ipchains -A input -i eth1 -s $INT -j ACCEPT

    ipchains -A forward -s $INT -j MASQ

    ipchains -A forward -j DENY -1

    ```


    These three lines assume that your internal interface is eth1. The first line
    simply

    enables all communication with this machine and all other machines on the internal
    net-

    work. The second lines enable masquerading for all packets on the local network

    while forbidding and logging all other forwarding attempts.


    Notice that we''ve added a second variable—the IP range of the local network,
    complete

    with mask value. For some common examples, see Table 10.4.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_174_0.png)'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# TABLE 10.4 Common IP Range Values for Internal Nets


    | Host | INT Value | Host Masquerades For |

    ---|---|---||n192.168.1.1 | 192.168.0/24 | 192.168.1.1-192.168.254 |

    | 192.168.1.1 | 192.168.0.0/16 | 192.168.1.1-192.168.255.254 |

    | 10.1.1.1 | 10.1.1.0/24 | 10.1.1.1-10.1.254 |

    | 10.1.1.1 | 10.1.0.0/16 | 10.1.1.1-10.1.255.254 |

    | 10.1.1.1 | 10.0.0.0/8 | 10.1.1.1-10.255.255.254 |


    After these changes are made, the system on which the rules are created will act
    as a reasonably router for other systems on the internal network.


    # Port Forwarding


    Chances that there is at least one service you''d like to provide to the outside
    world from behind your minimal firewall. In order to enable machines in the outside
    world to connect to your internal network, some translation must clearly take
    place because IP addresses in your internal network are not valid in the large
    Internet.


    With Linux kernel 2.2 versions, this type of translation is accomplished with
    the kernel masquerading code and a utility called ipmasqadm, or IP MasQeringAdministration
    tool. The syntax of ipmasqadm is very simple, and looks like this:


    ```

    ipmasqadm portfw -a P tcp -L MYip port -R server_ip port

    ```


    For example, assume that there is a Web server running on a machine on the internal
    network. The machine''s IP address is 192.168.1.14, and the Web server is running
    on the standard port. You want to make this Web server available to the outside
    world, also at the standard port. The command you use is


    ```

    ipmasqadm portfw -a P tcp -L MYip port 80 -R 192.168.1.14 80

    ```


    Assuming masquerading for the internal network and incoming TCP connections on
    this interface and port has already been enabled by iptchains, this is all command
    that is needed to enable port forwarding for port 80 to 192.168.1.14''s port 80.


    # Putting It All Together


