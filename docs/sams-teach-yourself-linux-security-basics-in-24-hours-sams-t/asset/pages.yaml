  md: '# Encrypting E-Mail Data


    # Working with Keys


    Before you can encrypt or decrypt messages, files, or other data, you''ll need
    to collect, use, and validate GPG keys to ensure the integrity of the data you''ll
    be exchanging. The primary tools for working with keys that we''ll discuss here
    are key listing, key importing, key exporting, key signing, and user trust.


    # Listing Keys


    Throughout the rest of this hour, it will be very helpful to you to be able to
    list the keys in your own public key database. To obtain a list of keys in your
    “keyring” and the matching names and e-mail addresses of their owners, use the
    following:


    ```

    $ gpg --list-keys

    /home/joe/.gnupg/pubring.gpg

    pub 1024/D98AC463 2001-01-03 Joe User (PGP Rules!) <joe@mynet.net>

    sub 1024/5EE5D252 2001-01-03


    pub 1024/4F8B3D39 2001-01-15 Pipi Socks (I''m WIRED) <pipi@hairnet.org>

    sub 1024/FDBB477D 2001-01-15

    $

    ```


    Each entry in the list represents a public key that you have on file and can be
    used to encrypt data sent to the matching e-mail address.


    # Importing and Exporting Keys


    The process of importing and exporting public keys is the meat-and-potatoes of
    the PGP world, because it is only when a potential recipient has your public key
    that you are able to make use of PGP in messages or data sent to them. Likewise,
    any number of potential senders may want to have your keys so that they can send
    you secure information.


    The first step is to export your own key, so that you can provide it to others.
    This is done with the --export argument. For example, if you''re joe, you can
    export your public key to the file mykey.gpg like this:


    ```

    $ gpg --export joe@mynet.net >mykey.gpg

    $

    ```


    The public key for joe@mynet.net is now stored in mykey.gpg and can be supplied
    to friends, family, or co-workers who may want to communicate with you in a secure
    way. Unfortunately, the key is not in an easily readable format; it looks like
    a lot of garbage and isn''t pleasant at all. It is therefore common practice to
    communicate keys and other types of PGP information in ASCII format, suitable
    for inclusion in an e-mail message. This is done with the -a argument:


    ```

    $ gpg -a export joe@mynet.net >mykey.gpg

    $

    ```


