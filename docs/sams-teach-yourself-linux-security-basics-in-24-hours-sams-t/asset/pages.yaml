  md: '# Securing Apache, FTP, and SMTP Services


    aren’t explicitly security-related, but can become so if Apache becomes unstable
    or encounters runtime errors. It is therefore important to log errors and watch
    the log. The level suggested here is warn, which generates a minimal amount of
    log traffic, but doesn''t let anything critical pass.


    The other logging directives are more involved. The LogFormat directive allows
    the format of log files to be dictated by the administrator. The directive accepts
    two arguments, a format string enclosed in quotation marks that will be expanded
    each time an entry is made and a name for the log format specified. The most common
    special values that can be expanded in Table 12.1.


    # Table 12.1 LogFormat Special Values


    | String | Expands To |

    | --- | --- |

    | %a | Remote user''s IP address |

    | %A | Local HTTPD server''s IP address |

    | %b | Non-header bytes sent (common log file format) |

    | %c | Connection status after response: x = connection aborted + = response completed,
    keep alive - = response completed, connection closed |

    | %f | Name of file sent |

    | %h | Remote host |

    | %H | The request protocol |

    | %(str)i | The contents of the HTTP header string |

    | %m | Request method |

    | %l | Remote name as given by ident |

    | %p | Port to which HTTPD server is connected |

    | %P | Process ID of HTTPD serving request |

    | %q | The query string (when applicable) |

    | %s | Server status |

    | %t | Time (common log format) |

    | %T | Time elapsed in serving request |

    | %u | Remote name as given by auth |

    | %U | URL requested |'
