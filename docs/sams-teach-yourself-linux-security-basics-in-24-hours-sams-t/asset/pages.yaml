    | fsf n, bsf n | Searches forward or backward n |

    | fsr n, bsr n | Searches forward or backward n records in the current archive
    file on the tape device. |

    | eod | Positions the tape immediately after the end of the last archive file
    stored on the tape, so that a new file may be appended to the tape. |


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_360_0.png)


    Using mt and tar or mt and afio together creates a reasonably complete backup
    and solution for working with magnetic tape devices that can fit on a single floppy
    or run on memory-limited systems.


    More information on using the mtx command, including advanced features like density
    selection, can be found in mtx(1).


    # Using mtx to Operate Changer Devices


    Low-end magnetic tape devices have dropped radically in price over the last few
    years and have become much more popular on smaller networks. Tape changers have
    the advantage of flexibility: the multiple tapes in the changer can be used to
    hold a great deal more data at one backup cycle or they can be used to implement
    intervention-free rotating backups.


    The command needed for control of tape changer devices in Linux is the mtx command.
    Note that mtx controls only the robot in the changer device; the read/write mechanism
    itself is controlled by the mtx command. The mtx command can be downloaded from
    http://mtx.sourceforge.net.


    The syntax for mtx is as follows:


    ```

    `mtx -f generic-device command [args]`

    ```


    generic-device is one of the Linux SCSI device nodes: /dev/sg-n on system and
    devices /dev/sga-sgz on others. Check your /dev directory and the information
    in /proc/scsi device that refers to your changer. Though'
