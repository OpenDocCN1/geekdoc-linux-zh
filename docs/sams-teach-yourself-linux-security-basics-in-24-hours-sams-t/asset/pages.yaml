  md: '# Detecting Attacks in Progress


    Since SnortSnarf is a preconfigured Perl script, no building or installation is
    required per se.

    Simply place the SnortSnarf distribution where you want it and run snortsnarf.pl
    from there.


    # Practical SnortSnarf Use


    SnortSnarf is best called with a script from a CRON job or some other type of
    periodic execution daemon. A number of options are described at the top of the
    snortsnarf.pl file itself, but the simplest and most common syntax is


    ```

    snortsnarf.pl -d outputdirectory sniff

    ```


    outputdirectory is the directory that should contain all of the generated HTML
    files. In this directory, the file index.html will be the root document for SnortSnarf''s
    statistics and analysis. The snortfile argument refers to the Snort alerts.


    Though the number of potential deployment methods is nearly infinite, a simple
    script could be called from a CRON job to rotate and update Snort alert data and
    SnortSnarf out- put in Listing 22.1.


    # Listing 22.1 A Sample SnortSnarf Script


    ```

    #!/bin/bash


    DATE=$(date +%m%d%y)

    mdir /var/log/snortsnarf/$DATE


    /usr/local/snortsnarf/snortsnarf.pl \\

    -d /var/log/snortsnarf/$DATE \\

    /var/log/snort.alert


    mv /var/log/snort.alert /var/log/log/alert.$DATE

    gzip -9 /var/log/log/alert.$DATE

    ```


    The script in Listing 22.1 is a simple example. It can be run daily or ever weekly.
    It simply creates a new directory for the current day in /var/log/snortsnarf that
    will contain the HTML output. Then it saves the current batch of Snort alerts
    in the /var/log/snort directory to make way for the new day''s or new week''s
    alerts.


    # Summary


    This hour you learned how to install and use a network sniffing system called
    Snort, with the capability to detect and log attacks as they occur and vulnerabilities
    they appear. When combined with a tool like SWATCH, Snort provides a potent one-two
