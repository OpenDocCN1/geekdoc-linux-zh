  md: '# Using iptables for Firewalling and Routing


    > Do not confuse the kernel source included in a Linux distribution with the official
    kernel source from ftp.kernel.org. The kernel sources included in most Linux distributions
    are preconfigured to match the binary kernel with the distribution. Following
    defaults in this distribution-supplied kernel source leads to a significantly
    different result from following defaults in canonical kernel distributions.


    # Table 11.1 Required Networking Options


    | Option | Description |

    | --- | --- |

    | CONFIG_NETFILTER | Required; activates the submenu under which all other packet
    filtering options are enabled or disabled. |

    | CONFIG_IP_NF_CONNTRACK | Optional (recommended); needed if you plan to seamlessly
    forward packets between a private internal network and the public external Internet
    at large. In short, it enables Linux to act as a router. |

    | CONFIG_IP_NF_FTP | Optional (recommended); when used in conjunction with connection
    tracking, enables problematic FTP connections to be masqueraded as well. |

    | CONFIG_IP_NF_IPTABLES | Required; enables the fundamental packet filtering mechanism
    in the Linux 2.4 kernels. |

    | CONFIG_IP_NF_MATCH_STATE | Optional (recommended); when enabled, allows for
    rules based on connection-matches. |

    | CONFIG_IP_NF_MATCH_LIMIT | Optional; allows for a limit on logging when excessive
    numbers of log entries would otherwise be made. Can also be used to prevent denial
    of service attacks by slowing connection rates. |

    | CONFIG_IP_NF_MATCH_UNCLEAN | Optional; enables the kernel to make guesses about
    which packets might be bad or suspicious and filter based on this decision. |

    | CONFIG_IP_NF_FILTER | Required; creates the default filter table used by iptables
    for the INPUT, OUTPUT, and FORWARD tables. For most users, iptables is pointless
    without this option. |

    | CONFIG_IP_NF_TARGET_REJECT | Optional useful, for example, you want to send
    ICMP messages to hosts whose packets are being dropped. |

    | CONFIG_IP_NF_NAT | Optional (recommended); needed if you plan to seamlessly
    forward packets between a private internal network and the public external Internet
    at large. In short, enables Linux to act as a router. |'
