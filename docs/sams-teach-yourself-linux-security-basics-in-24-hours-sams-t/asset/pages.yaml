  md: 'During installation, the 1024-bit host keys necessary for some aspects of SSH
    operation will be generated automatically and stored in the /etc/ssh directory
    as hostkey and hostkey.pub. Simply repeat this process on each machine needing
    SSH installation so that each of them has its own set of keys. You may see error
    1 messages as SSH attempts to discover an existing SSH version 2.x installation;
    as long as the install process continues, these errors can be safely ignored.


    After you install the SSH files, it is necessary to make a few changes to the
    /etc/services and /etc/inetd.conf files. Making these changes will allow inetd
    TCP wrappers to manage SSH connections transparently, simplifying some aspects
    of SSH use and preserving system resources. Add the following lines to /etc/services:


    +   - ssh2 22/tcp ssh

    - ssh2 22/udp ssh


    These lines define a new service called ssh2 that will listen on port 22 for incoming
    connections. If you plan to run SSH on other port, be sure to adjust the port
    numbers as necessary. Add this line to /etc/inetd.conf:


    ```

    ssh2 stream nowait root /usr/sbin/tcppd /usr/local/sbin/ssh2 -1

    ```


    This allows inetd to start the SSH daemon when required and to use TCP wrappers.
    This way, you can control access to SSH from the /etc/hosts.allow and /etc/hosts.deny
    files using ssh2 as the name of the service. Once these changes have been made
    to the system''s network configuration files, you''ll need to send the hang-up
    signal (HUP) to the system''s running process:


    ```

    killall -HUP inetd

    ```


    This will restart the inetd process and cause any changes you''ve made to the
    /etc/inetd.conf file to become active. For most users, little or no additional
    SSH connection is required.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_257_0.png)


    In the past, it was common for system administrators to recommend that SSH be
    started from an init script like /etc/rc.d/rc.local rather than being started
    on demand by the inetd process. Administrators avoided using inetd with SSH because
    of the delays that could be introduced for connecting clients during daemon launch
    and key generation, resource-intensive operations.


    On a reasonably modern Linux system, however, concern of this is no longer warranted
    except in situations involving very loaded machines. On today''s average Linux
    box, with a 266MHz or faster CPU and a multigigabyte hard drive, the delays introduced
    by starting ssh2 with inetd are undetectable in most cases and will not result
    in any measurable loss of productivity.'
