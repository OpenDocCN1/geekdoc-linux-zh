  md: '# Introduction to Kerberos


    Now jake is classified as an administrator and will be able to start the kadmin
    program. However, the administrator given to each administrator still has no privileges
    inside kadmin. The set of privileges given to each administrator is controlled
    with an access control list file called kadm5.acl located in /usr/local/kerberos/var/krb5dc.
    Each line in the file contains the fully qualified Kerberos name of an administrator
    and the permissions he is to have. These permissions are shown in Table 17.1.


    # Table 17.1 Kerberos Administrator ACL Permissions


    | Permission | Description |

    |---|---|

    | a | Allowed to add principals or policies |

    | d | Allowed to delete principals or policies |

    | m | Allowed to modify principals or policies |

    | c | Allowed to change passwords for principals |

    | i | Allowed to run database inquiries |

    | 1 | Allowed to list principals in the database |

    | * or x | Short for admincil (all permissions) |


    To give full permissions to jake, add the following line to /usr/local/kerberos/var/krb5dc/kadm5.acl:

    jake/admin@MYNET.NET      admincil

    The same effect could also have been achieved by adding this:

    jake/admin@MYNET.NET      *


    > The default set of ACL permissions for an administrator is no permissions at
    all. Therefore, if you don''t add an entry to the ACL file for a newly created
    administrator, that administrator will be able to start kadmin but won''t be able
    to do anything inside.


    After editing the ACL file, you''ll have to restart kadmin for changes to take
    effect. Unfortunately, the -HUP signal doesn''t have the expected effect on kadmin,
    so the only option is to kill it and restart it:


    ```

    # killall kadmin; kadmin

    #

    ```


    The user should now be able to use kadmin from any host in the realm, provided
    he has a valid Kerberos ticket.


