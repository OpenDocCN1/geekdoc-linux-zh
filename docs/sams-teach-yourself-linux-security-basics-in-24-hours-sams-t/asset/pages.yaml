  md: '# Introduction to Kerberos


    # Downloading and Installing Kerberos 5


    The Kerberos 5 download page can be found at http://web.mit.edu/network/kerberos-form.html.
    You''ll need to read each question and answer truthfully to satisfy the export
    restriction conditions. If you have filled out and submitted the form, you''ll
    be able to download Kerberos 5 in various forms. For Linux, download the source
    code to the latest version (1.2.1 as this is being written) and save it to your
    hard drive.


    The source is packaged as a tarball containing several tarballs. To extract the
    tarball, which is uncompressed, use tar -xvf:


    ```

    $ tar -xvf krb5-1.2.1.tar

    krb5-1.2.1.crypto.tar.gz

    krb5-1.2.1.crypto.tar.gz.asc

    krb5-1.2.1.doc.tar.gz

    krb5-1.2.1.doc.tar.gz.asc

    krb5-1.2.1.src.tar.gz

    krb5-1.2.1.src.tar.gz.asc

    $

    ```


    Now, extract the additional tarballs created when the distribution tarball was
    extracted. They all overlay onto the ker5-1.2.1 source directory. Afterward, visit
    the directory containing the source.


    ```

    $ tar -xzf krb5-1.2.1.src.tar.gz

    $ tar -xzf krb5-1.2.1.crypto.tar.gz

    $ tar -xzf krb5-1.2.1.doc.tar.gz

    $ cd krb5-1.2.1/src

    $

    ```


    Building the source is a straightforward process on most Linux systems. The Kerberos
    5 sources use the GNU autoconf utilities, so configuration is generally as easy
    as running the configure script. However, most Linux users will want to include
    the --enable-shared option to build shared libraries instead of static ones, and
    in this case, we''re going to assume that you''ve used the --prefix=/usr/local/kerberos
    option in order to isolate the Kerberos installation and make things more.


    ```

    $ ./configure --enable-shared --prefix=/usr/local/kerberos

    ...[ output of configure script ... ]

    $

    ```


    Once configure has run successfully, building is simple. Just run a make followed
    by a make install as root. The actual time will vary, but you should expect it
    to be similar to that required to build a Linux kernel.


    ```

    $ make

    ...[ output of make ... ]

    $ su

    Password:

    # make install

    ```'
