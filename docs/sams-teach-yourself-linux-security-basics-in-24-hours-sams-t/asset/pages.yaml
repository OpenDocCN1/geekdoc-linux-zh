  md: '# Encrypting Data Streams


    # Additional Configuration


    The sshd binary, located at default /usr/local/sbin/sshd, is responsible for handling
    incoming ssh2-encrypted connections. Though the default behaviors are usually
    adequate, there are a few additional security-oriented options that can be changed
    by editing the /etc/ssh2/sshd_config file.


    The format of /etc/ssh2/sshd_config is familiar to most Linux and Unix users;
    the line is composed of a number of keyword/value pairs, one pair per line. Empty
    lines or lines beginning with the hash mark (#) are assumed to be comments and
    are ignored.


    Some ssh2 options that may be helpful to you from a security standpoint are shown
    in Table 16.1. The complete list of sshd configuration options is documented exhaustively
    in ssh2_config(5).


    # ### Table 16.1 Common Options for the sshd_config File


    | Option | Description |

    | --- | --- |

    | AllowGroups | Followed by a comma-separated list of regular expressions, this
    keyword gives a list of groups that are allowed to use connections controlled
    by SSH. Users who do not belong to a matching group will not be authenticated.
    The default is to allow groups. |

    | DenyGroups | Follows the same format as AllowGroups, but will deny authentication
    to users who belong to a matched group. |

    | AllowHosts | Followed by a comma-separated list of regular expressions, this
    keyword gives a list of hosts that are allowed to use connections controlled by
    SSH. Hosts can be given in text form or by IP number. Users who are connecting
    from a host on this list will not be authenticated. The default is to allow hosts.
    |

    | DenyHosts | Follows the same format as AllowHosts, but will deny authentication
    to users who connect from a matched host. |

    | AllowUsers | Followed by a comma-separated list of regular expressions in the
    form user@host, this keyword gives a list of individual users on specific hosts
    who are allowed to use connections by SSH. Users who do not match an entry in
    the list will not be authenticated. The default is to allow all users. |

    | DenyUsers | Follows the same format as AllowUsers, but will deny authentication
    to users matching an entry in the list. |

    | MaxConnections | Followed by a number indicating the maximum number of incoming
    connections that sshd will allow at any time, this option can prevent denial-of-service
    attacks caused by opening large numbers of simultaneous SSH connections. The default
    value is 0 (connections limited). |'
  merge: -1
  pgno: 258
