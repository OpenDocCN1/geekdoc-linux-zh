    # Taking Advantage of Encryption (User Tasks)


    Before joe will have permission to access files on the TCFS volume (even files
    to which he has access permissions), he must generate a key for himself. This
    is done with the tcfsgenkey utility, which will ask joe to enter his password
    and will then ask for 10 random keystrokes to seed the key.


