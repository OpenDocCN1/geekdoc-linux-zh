  md: '# Using ipchains for Firewalling


    155


    For commands that expect an address to be supplied via -s or -d, a default of
    0.0.0.0/0 (matches all addresses) will be used if no address is supplied by the
    user.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_172_0.png)


    Many users with basic TCP/IP knowledge do not recognize the slash and following
    on IP specifications like 0.0.0.0/0 or 192.168.1.0/24. This slash and number are
    called the network mask.

    The number following the slash indicates the number of bits (from "left" to "right")
    in a sense that are significant. For example, the IP 255.255.255.255, the largest
    possible IP number in ipv4, is represented by four-bit words, each containing
    11111111 or the decimal number 255. These four 8-bit words, together, represent
    32 bits of data. In a configuration file or when supplying IP addresses ipchains
    that will need to match a range of IP addresses, it is convenient to use a form
    such as


    ```

    192.168.1.0

    ```


    However, in such circumstances, we also want to indicate that we do not mean a
    host specifically assigned the address 192.168.1.0, but rather that only the first
    three numbers (192.168.1) are significant or fixed. The last digit is a kind of
    wildcard. Therefore, we specify


    ```

    192.168.1.0/24

    ```


    This means that the first 24 bits (192.168.1) are significant and that the last
    8 bits (the number "0" in this case) are not and can match any number.


    # A Simple Ruleset That Works


    Now that we have at least documented the command syntax of ipchains and the logic
    upon which it operates, we can begin to add rules that will govern packet filtering
    in real life. This process is a tedious one, and it might take some time to get
    it correct, especially with complex rulesets. The sample presented here is reasonably
    secure for most systems or private networks with a limited number of internal
    users. Try to follow the logic of each rule as it is presented, and you''ll be
    well on your way to creating your own rules to match your particular circumstances.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_172_1.png)


    Because the process of adding rules to the kernel''s table of rule chains requires
    repeated calls to the ipchains command, it''s a good idea to make your changes
    to a script file as you follow along with the remainder of this chapter. You''ll
    likely want to make any rule or change permanent anyway, and keeping them in a
    script will enable you to do this.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_172_2.png)'
