- img_proc: true
  md: '# Preserving Your Valuable Data


    When your system is compromised, a malicious intruder or Trojan horse program
    may gain access to some or all of the data on your system. A primary worry, course,
    is that such an intruder may gain access to data that is intended to be private.
    Another worry that is no less valid, however, should be that the intruder or malicious
    program may simply delete in an uncoverable way amounts of irreplaceable data.
    This can happen only if you don''t have well-maintained backups stored somewhere
    away from the system or network that was compromised.


    # Modified System Binaries


    It''s not only your data that is vulnerable, however. Believe it or not, your
    program binaries and configuration files are just as vulnerable and represent
    an even bigger problem—the threat of future vulnerability. This is because any
    intruder who gains write permission to the program binaries in your system will
    have the capability to replace any of them in a clandestine fashion with modified
    binaries. These modified binaries will often bear the hallmarks of originals,
    including things like size and date. They may even appear to function identically.
    However, the modified binary inserted by a cracker or malicious user will usually
    contain a back door of some kind.


    A back door is a hidden way—such as a secret password, listening on a secret port,
    or recognizing a secret series of network packets—for the malicious user to re-enter
    your system without your knowledge, even after you have analyzed his attack and
    tried to secure your system.


    # The Root Kit


    In the Linux world, one of the most common discoveries about a compromised system
    is that a root kit has been installed. A root kit is a group of modified binaries
    that can replace things like login, ls, syslog, and other system-level tools.


    A root kit is particularly dangerous because it is designed in such a way as to
    prevent its own discovery. For example, the modified login program in a root kit
    might accept the intruder’s secret password for root access—a back door. A modified
    might be programmed not to display extra files or system modifications introduced
    by the intruder. Other modified programs and configuration files participate in
    the deception possibly even introducing other back doors.


    Because of this danger'
