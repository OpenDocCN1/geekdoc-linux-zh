  md: '# Recovering from Attacks


    There may be cases, however (such as when malicious programs have been run or
    Trojans introduced), in which data is simply not recoverable through means available
    to the average home user or small business owner.


    I got the IP address of the intruder, found his domain, and reported him to his
    ISP. They didn''t care. So I reported to the upstream provider. They didn’t seem
    to care either. What can I do if nobody cares?


    Unfortunately, there are some larger providers out there who are notoriously nonchalant
    about what their users may or not be doing, whether it is illegal, harmful, or
    ethically troubling. Some of them receive thousands of complaints a year, but
    commerce is commerce and there isn''t much that can be done if the powers aren''t
    interested in hearing about abuse cases.


    One drastic move that you can make is to use packet filtering like iptables and
    chains to simply block network traffic of all kinds from the IP ranges or domains
    responsible.


    Understand, that if you are running a public service on your machine, such as
    a Web server or an anonymous FTP server, such drastic measures could prevent hundreds
    or thousands of legitimate users from taking advantage of your services.


    There''s no point in blocking the single IP where the attack came from, since
    a large percentage of attacks come from rotating dynamic IP addresses in ISP pools.


    I got compromised, but my network isn’t behind a firewall or anything of that
    sort. Would a dedicated firewall help to prevent such occurrences in the future?


    Yes!


    There is no better security investment that you can make, especially if you are
    a small network. Consider purchasing a dedicated firewall immediately. If you
    can’t afford one but a PC laying around, you can construct one with Linux and
    packet filtering, or you can download a system like Freesco, which can be found
    at http://www.freesco.org, that will transform the PC into a reasonably robust
    firewall/router for you.


    # New Terms


    +   abuse An e-mail box that exists on most domains that provide Net access or
    service of any kind to others. The abuse box is where reports of spamming, hacking,
    cracking, and general nastiness should go.'
