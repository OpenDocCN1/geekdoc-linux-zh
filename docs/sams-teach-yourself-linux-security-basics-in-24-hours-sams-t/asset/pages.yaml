  md: '# System User Fundamentals


    # Adding a User, Step 2: /usr/sbin/useradd


    Now that a group has been created for the new user, we can create a login account
    for him. The default account creation behavior in most Linux distributions is
    also not very secure, so it is not a good idea to use high-level tools or even
    theadduser script to create accounts. Instead, we are going to use the comparatively
    low-level useradd. The useradd command is fairly easy to use; simply supply the
    -u (user ID number), -g (group name), -d (home directory) and -m (make home directory)
    arguments, followed by the name of the user to create.


    Continuing with our example, since we created group number 6001 called johnB,
    our useradd command will look like this:


    ```

    /usr/sbin/useradd -u 6001 -d /home/johnB -m johnB

    ```


    This will create a user called johnB, place him in the group johnB that has a
    matching number, place his home directory at /home/johnB, create the home directory,
    and copy all of the template files from /etc/skel to it.


    # Adding a User, Step 3: passwd chage


    Now that you''ve created the user''s group, account, and home directory, the user
    can log in. However, no password has been assigned to this account—an unacceptable
    security risk unless the user will be logging in and choosing a password immediately.


    On larger systems, it may be necessary to install a random password generator,
    but on smaller systems it is generally enough for the system administrator to
    assign an interim password, which will last until the first time the user logs
    in:


    ```

    passwd johnB

    ```


    Choosing this interim password isn''t enough, however. We want to be sure that
    johnB changes the password immediately to something of his own. To the point,
    we also want to make sure he change his password so often that the password doesn''t
    become stale and more easily guessable. This is done with the change command,
    which controls account "aging" on Linux systems. Possible arguments to the chage
    command are shown in Table 5.2.


    # TABLE 5.2 Possible Arguments to the chage Command


    | Argument | Description |

    | --- | --- |

    | -m N | N = The number of days the user must wait between password changes, or
    ø to disable the counter. |

    | -M N | N = The number of days after the user must again change his password,
    or ø to allow passwords to exist indefinitely. |'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# TABLE 5.2 continued


    | Argument | Description |

    | --- | --- |

    | -d N | Indicates that the password was last changed N days after epoch (January
    1, 1970). This number is normally maintained automatically. |

    | -I N | N = The number of days of inactivity (no logins) after a password has
    expired before the account is locked due to neglect, or 0 to allow an account
    to be accessed any number of days after the password has expired. |

    | -E MM/DD/YY | The month, day, and year on which this account will expire, or
    -E if the account should never expire. |

    | -W N | N = The number of days in advance to warn the user of pending password
    expiration.|


    Here''s a sample command for dealing with password management:


    ```

    chage -m 90 -d 0 -I 0 -E 0 -W 10 johnB

    ```


    This command forces johnB to change his password immediately upon first login.
    It also forces him to change his password every 90 days thereafter, giving him
    10 days advance before a change will be required.


    > It is a good idea to set all of these options explicitly when calling chage,
    because some older versions of Pluggable Authentication Modules (PAM), which is
    responsible for password management in most recent Linux distributions, don''t
    acknowledge any of these settings unless they''re all explicitly set to value.


    Once this change has been made, johnB''s account is both complete and securely
    created, and he can log in at any time.


