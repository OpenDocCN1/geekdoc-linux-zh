    Finally, suppose you remember that sometimes you find yourself using a system
    on a

    separate network whose hostname is wks9.xyz.com, and that you do at times need
    to\Telnet from this machine to one. You add one final line to /etc/hosts.allow

    to for this connection as:


    ```

    in.telnetd : wks9.xyz.com

    ```


    Now you''ve constructed your set of exceptions to the blanket deny rule. The result

