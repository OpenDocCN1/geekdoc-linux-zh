    # Extra File System Security Tools


    This hour, we''ll pick up Hour 7, "File System Security," left off, exploring
    a few extra tools to improve the security of your Linux file system. There are
    two basic types of tools we''ll consider:


    +   - Access control list mechanisms, which enable permissions to be specified
    on a much more user-specific and flexible basis than the traditional Unix-like
    file system allows.

    - Tools for permanent deletion, which ensure that data in deleted files is not
    only easily available, but is actually erased from the disk completely.


    Though these measures are extreme compared to simple permissions maintenance,
    as discussed in Hour 7, they can at times be necessary, especially in circumstances
    under which maximum file system security and flexibility are required.'
