  md: '# Auditing and Monitoring


    By mounting your own series of “attacks” or at least “interesting” behavior on
    your own network, you can see how each action will appear in your log, and you
    can monitor for those strings. Running software like SAINT can generate a number
    of log entries that may indicate to you that bad things are going on. Furthermore,
    you actually have control over the logging of some systems—TCP Wrappers and Apache,
    for example. Since you decide on strings that will be logged in the first place,
    it should be easy for you to match them with SWATCH.


    # Q My logs are very inactive, or empty.


    +   First, or nearly empty logs that once were very active are an almost certain
    indication that some sort of attack has taken place. Run SAINT to check for problems
    and look carefully at your old logs, paying special attention to the point at
    which they stop. You may find that your system is already compromised.


    +   Second, you may simply need to reconfigure your daemons to be more verbose
    in their logging. This will have to be fixed in your init scripts, or /etc/inetd.conf,
    and in your /etc configuration files on a case-by-case basis. You may want to
    consider reinstalling or switching to a different distribution that does more
    logging.


    +   There is one more slightly obvious reason that your logs may be empty. You
    have checked to ensure that your disk isn’t full and hasn''t been full? Syslog
    will stop when it encounters a full disk and will not restart again on its own,
    even if space occurs again available.


    # Network Terms


    Security Administrator’s Integrated Network Tool (SAINT) An incredibly useful
    scanner and vulnerability analyzer that is popular with system administrators.
    SAINT tests a system for a vulnerability to a large number of standard or common
    attacks and generates a report that the administrator can use to make his system
    or network more secure.


    Security Administrator’s Tool for Analyzing Networks (SATAN) An older piece of
    software for analyzing security, upon which the newer SAINT application is based.


    Simple WATCHEr (SWATCH) A simple but powerful Perl script used to watch any text
    or log file as it progresses and takes action or make reports based on the information
    that appears there.


    vulnerability A term used to describe any way in which a malicious user or program
    might violate your system. Default Linux installations usually have a number of
    vulnerabilities at it. It is your job as the system administrator to systematically
    try to eliminate as many of them you can.


