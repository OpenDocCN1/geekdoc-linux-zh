  md: '# Securing Apache, FTP, and SMTP Services


    For the Apache Web server, we covered global security-oriented directives; the
    concepts of directory-based, file-based, or location-based scoping; basic username/password
    authentication techniques; and the local access file to secure administration
    easier.


    For www-ftpd FTP server, we covered the difference between anonymous and “real”
    FTP access and how to handle the former when necessary. We also discussed a number
    of recommended security-oriented options for the /etc/ftaccess file, as well as
    the format of the /etc/ftpusers file.


    Finally, for the sendmail daemon, an SMTP mail transfer agent, we discussed the
    most common external security risk: unauthorized connection. We covered two basic
    techniques for stopping unauthorized connections: packet filtering via ipchains
    or iptables and the conversion of sendmail from a permanently backgrounded daemon
    to a daemon managed by inetd and started with TCP wrappers.


    # Q&A


    +   Q I have questions about Apache that aren’t covered in this chapter!


    +   Unfortunately, there is just no space to cover every Apache directive in-depth.
    Web servers have become complicated, flexible animals with configuration needs
    to match. What we’ve discussed here are the basics. If you plan to run a high-traffic
    Web server, I heartily recommend that you obtain a text entirely about Apache
    and use it to guide you through the entire process.


    +   Q about anonymous FTP write access? A write is strongly discouraged for a
    number of reasons, most of them legal rather than technical. Unfortunately, publicly
    writable anonymous FTP has become a choice tool for software pirates. This isn’t
    a common need anyway, and it’s been included. You’ll find the details you need
    in ftaccess(5), however, and should be to go from there.


    +   Q Isn Sendmail fundamentally insecure? Isn’t it also obsolete? Can I use transfer
    agents foo or bar?


    +   A no, no, Sendmail isn’t more or less secure than any other network daemon
    out there. It’s secure as the last update you downloaded and the configuration
    file you’re using. As always, it’s important to stay on top of updates as they
    occur and (especially in the case of Sendmail) to use configuration files from
    canonical sources if you’re not ready to create your own.


    +   More importantly, the instructions given will work with most any SMTP mail
    transfer agent as well; you’ll simply have to adjust the paths to suit your needs.


