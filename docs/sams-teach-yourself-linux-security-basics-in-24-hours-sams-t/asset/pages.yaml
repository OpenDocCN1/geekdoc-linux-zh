  md: "# TABLE 13.1 Access Control in named.conf Zones\n\n| Keyword | Description\
    \ |\n| --- | --- |\n| allow_query | Determines which host(s) or network(s) will\
    \ be allowed to make ordinary queries of this server. |\n| allow_transfer | Determines\
    \ which host(s) or network(s) will be allowed to receive zone transfers from this\
    \ server. |\n| allow_recursion | Determines which host(s) or network(s) will be\
    \ allowed to make recursive queries to this server. |\n| allow_updates | Determines\
    \ which remote hosts will be allowed to submit dynamic DNS updates to this server.\
    \ |\n| blackhole | Determines which host(s) or network(s) will be blocked from\
    \ communication of any kind with this server. |\n\nThe default values for the\
    \ first three items are the most relaxed defaults possible: Allow queries from\
    \ everyone, allow everyone to receive zone transfers, and allow recursive queries\
    \ from everyone. Only updates are restricted; the default is to allow updates\
    \ from no one. Taken as a whole, this is clearly not the right set of defaults\
    \ for a small DNS server. allow_transfer is especially troublesome because it\
    \ could allow a potential cracker to map your network. A recommended modified\
