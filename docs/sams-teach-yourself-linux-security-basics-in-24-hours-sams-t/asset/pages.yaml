  md: '# 110


    # Hour 7


    Linux kernel 2.4 implements a new method called devfs for managing device nodes.
    When using devfs with kernel 2.4, device nodes exist only in memory in a virtual
    file system rather than on disk and are automatically assigned secure permissions
    by the kernel.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_127_0.png)


    Luckily, most distribution installers do a reasonably good job of configuring
    ownership and permissions for system device nodes. However, there are one or two
    instances in which we should reevaluate and possibly correct device nodes permissions:


    +   - It is important to ensure that disk devices have their permissions correctly
    configured. granting a non-root user access to a disk device is a sure way to
    get hacked, violated, or crashed quickly.

    - It is also important in the case of any devices that seem to grant public permissions
    (any permission for other users).


    In the case of disk devices, the only safe policy is to ensure that only the superuser,
    root, has read and write access to the device node. The chmod value that corresponds
    to these permissions is 600. To make the change, simply visit /dev and use a wildcard:


    ```

    # cd /dev

    # chmod 600 sd* hd*

    ```


    This will cause all IDE and SCSI disks to give and write permissions only to root.
    Note that this means that normal users won''t be able to use the hard drive; it
    means only that normal users won''t be able to format the hard drive or steal
    data that they don''t otherwise have permission to access.


    Now we need to make sure that no device nodes have read or write access to other
    (anonymous) users. This can be accomplished with a single chmod command in symbolic
    mode:


    ```

    chmod o-rwx *

    ```


    In general, there is no real drawback to doing this. There are very few cases
    in which it is a good idea to give all users access to devices. However, there
    are exceptions. A few special devices, such as /dev/null, /dev/zero, and /dev/random,
    should have some permissions available to anonymous users:


    ```

    chmod a+rw /dev/null /dev/zero /dev/random

    ```


    If you are wary about changing permissions on so many files at once, you can get
    a list of all files that have anonymous permissions by ls -l and grep together
    with simple patterns:'
