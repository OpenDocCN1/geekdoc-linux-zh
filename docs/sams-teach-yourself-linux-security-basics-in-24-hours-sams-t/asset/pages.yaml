  md: '# Summary


    In this hour, we covered the basics of PAM configuration. We learned that PAM
    configuration is really just a series of stack entries. Each time a service requests
    PAM''s help, the PAM routines simply call all the stack entries related to that
    service, in order. The process of adding authentication procedures for new services
    to the system is therefore easy as adding a few new stack entries in the PAM configuration
    files.


    Each stack entry in a PAM configuration file contains a module type to determine
    the context in which the stack entry will be run and a control flag to determine
    its importance. A module is also supplied that contains the actual code to process
    the task at hand.


    Though PAM configuration can seem complex at first, it is actually not too difficult
    to master, and the online PAM documentation located at www.us.kernel.org/pub/linux/libs/pam/Linux-PAM-html/pam.html
    can help quite a bit.


    # Q&A


    +   - Is there a comprehensive list of all PAM modules in existence?

    - There might be, but I''ve never seen it. Many different services include PAM
    modules of their own as a part of their source distribution, so it''s doubtful
    whether a truly comprehensive list could ever be assembled.

    - Should I create a wheel group on my system? How is wheel usually used, beyond
    the su command?

    - It''s probably not needed on a smaller system with only a few users and only
    one administrator, but on a larger system with multiple administrators and even
    more users, wheel can be an important step in overall security. As far as how
    wheel is used—there are different philosophies and conventions. Your best bet
    is to learn several books on Unix system administration.


    # New Terms


    +   - control flag: One of four levels of importance that determine how PAM will
    proceed when the results of the current action have become clear.

    - module type: One of four directives that refer to the contexts in which PAM
    stack entries will be processed.

    - restricted service: Any service that provides access to system or network resources
    in a way as to pose a potential security threat in the hands of an unknown user.'
  merge: -1
