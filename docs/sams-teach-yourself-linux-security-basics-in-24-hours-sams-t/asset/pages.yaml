  md: '# HOUR 13


    # Network Security:

    DNS with BIND


    This hour, we''re going to secure the BIND daemon, version 8.x. Actually, this
    is a little misleading. The BIND daemon is incredibly complex and nuanced; it
    would be more accurate to say that we''re going to improve the security of your
    BIND installation with a few security tricks.


    The BIND daemon used by many Linux distributions supplies domain name service
    (DNS) and has been victim to more than its fair share of attacks in the past,
    partly due to the complexity of the task it performs, and partly due to the resultant
    possibility for complexity in its configuration. Because of this, it has become
    a common practice to run named in a chroot environment—a kind of jail cell a cracker
    cannot easily penetrate.


    If your network is too small to require that you run your own domain name service,
    you can skip this hour. If you ever need to provide any DNS port access on an
    external network interface, however, you should take the time to secure the BIND
    daemon before going online. Understand that we''re not going to cover general-purpose
    BIND configuration here; this hour assumes that either you have a working BIND
    configuration or have resources to assemble one on your.'
