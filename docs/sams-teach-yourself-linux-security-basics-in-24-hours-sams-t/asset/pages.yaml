  md: '# Physical Security


    power, after all, and that power comes through a cord that plugs into 120 volts
    on one end and the back of the machine on the other.


    Here it is best to use your own discretion. If you are relatively sure that most
    of your power cycle vulnerability lies in unintentional accidents by otherwise
    trusted individuals, simply disabling the reset and power switches should prevent
    service interruptions. Beware the janitor''s power-waxer and the clumsy customer''s
    shoe, however: Either could unplug your machine and create the very power cycle
    problem we''re trying to prevent. To that end, you may choose to take additional
    steps:


    +   - Secure the power cable to the back of the machine


    This can be done in a variety of ways, but one of the most effective is to use
    glue to attach the cable to its socket permanently. Take care not to get glue
    on the metal contacts, or your newly glued power cord may not work at all!


    +   - Plug the other end of the cable in somewhere else


    Use a long cable and plug the 120-volt side of the cable into another room or
    somewhere out of view and easy reach so that the temptation to unplug the cable
    from the wall socket is minimized. Any home hardware store will also sell a wall-type
    cable clamp that can firmly affix a cable to a wall or floor use something like
    this right next to the wall plate to ensure that the cable can be pulled out by
    jerking it.


    +   - Protect the length of the cable


    Don''t run the cable across the floor. Run it to the outlet in conduit against
    the wall, under the carpet, in a rubber cable or some other apparatus that will
    prevent both accidental tripping and a jerk from the janitor.


    Unfortunately, these measures protect against incidental or unintended loss of
    power from cable interruption. All cables, however, are clippable—there is no
    way to prevent malicious interruption of power when someone has physical access
    to the machine. Therefore, the ideal policy is to secure the machine physically
    and securely from any individuals whom you don''t know or fully trust.


    # Boot Devices


    We covered this once in the previous hour when discussing BIOS issues, but the
    problem of bootable devices can be explored even further. If you are unable to
    password protect your BIOS or fix your boot order completely, your system is vulnerable
    to being hijacked by someone with his own boot disk. To prevent these types of
    attacks from occurring, concentrate on securing these devices specifically.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_66_0.png)'
