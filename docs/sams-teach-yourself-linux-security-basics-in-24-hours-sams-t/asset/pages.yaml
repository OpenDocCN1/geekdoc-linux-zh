  md: 'For example, to shut down the samba service temporarily to see if your network
    can do without it, you''d use this:


    ```

    /etc/rc.d/init.d/samba stop

    ```


    If you find that you really need it, you can start it again with a command like
    one:


    ```

    /etc/rc.d/init.d/samba start

    ```


    This trick will work with most Linux distributions that use a SystemV-style configuration.
    Note that any changes made this way are not permanent and will disappear when
    the system is rebooted. These types of changes are for testing only.


    # Creating User Accounts Securely


    Now that services are all up and running (or not running) as you''d like them
    to be, it''s time to take a look at user accounts. Though many small-system administrators
    never give this process a second thought and simply proceed with the adduser command
    Linux installation is complete, the creation of accounts must be as secure as
    the rest of the system if compromise is to be avoided.


    In fact, before adding users, it is important to ensure that shadow passwords
    are active on the system. Then, because each vendor''s implementation of adduser
    varies, and some adduser commands don''t even function, security-minded administrators
    will add each user by hand to ensure that all information for the user account
    is correctly entered.


    # Shadow and MD5


    Before taking the time to create user accounts, you should ensure that both shadow
    passwords and MD5 encryption are installed and running on your system. If no related
    package is available with your distribution, MD5 passwords may be forgotten, but
    if your distribution doesn''t support shadow passwords, you should upgrade to
    a newer distribution immediately. Shadow provides a way to protect your user passwords
    against public access; without shadow, your /etc/passwd file contains all of your
    user passwords, visible to the entire world—a high security risk!


    To see if shadow passwords are active on your system, check for the existence
    of an /etc/shadow file, which should be readable by root alone:


    ```

    $ cat /etc/shadow

    cat: /etc/shadow: Permission denied

    ```


    If you find that there is no shadow file present or that the shadow file is readable
    by a normal (non-root) user, then shadow is either not installed or is incorrectly
    installed on your system.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_94_0.png)'
