  md: '# # APPENDIX B


    # # System Account File Formats


    Tables B.1 through B.3 describe the formats of the /etc/passwd, /etc/shadow, and
    /etc/group files.


    Table B.1 Fields in /etc/passwd

    | Field Number | Description |

    | --- | --- |

    | 1 | Name of the account that the user will use to log in the system, all lowercase.
    Also known as the user''s login. |

    | 2 | Lowercase letter x on systems with shadow passwords installed; encrypted
    password on systems without shadow passwords installed. |

    | 3 | The numeric user ID of this account, typically in either the 500 or 1000
    range for normal users, though convention varies. |

    | 4 | The numeric ID referring to the user''s primary group membership. On systems
    without user-private groups, usually a number referring to the group users. On
    systems with userprivate groups, this number generally matches the numeric user
    ID and refers to a private group. |'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Table B.1 continued


    | Field Number | Description |

    |---|---|

    | 5 | Comment or information about the user. By convention, contains the user''s
    full human-readable name. |

    | 6 | Path to the user''s home directory and files, usually a subdirectory of
    /home on Linux systems. |

    | 7 | The user''s login shell. By default on Linux systems, /bin/bash is used,
    but it can be changed by the user to any shell listed in /etc/shells. |


    # Table B.2 Fields in /etc/shadow


    | Field Number | Description |

    |---|---|

    | 1 | Name of the account that the user will use to log in to the system, all
    lowercase. Also known as the user''s login. |

    | 2 | User''s encrypted password. |

    | 3 | The number of days since epoch (January 1, 1970) that had passed when the
    user last changed his password. |

    | 4 | The number of days that must pass before the password can be changed again.
    |

    | 5 | The number of days before the user''s current password expires and a new
    password must be selected. |

    | 6 | The number of days in advance to warn a user about an expiring password.
    |

    | 7 | The number of days to wait after a password has expired disabling a user
    account if no new password is provided. |

    | 8 | The number of days since epoch that have passed on the day the user''s account
    becomes disabled. |

    | 9 | Reserved (if present). |


    # Table B.3 Fields in /etc/group


    | Field Number | Description |

    |---|---|

    | 1 | The name of the group to which this line refers. If the system supports
    userprivate groups, many of these names will match names in the /etc/passwd file.
    |

    | 2 | The encrypted group password. If no data is present in this file, no users
    will be allowed to use newgrp to join the group. No password will be required
    of explicitly named group members. |

    | 3 | The numeric ID of this group. If the system supports user-private groups,
    many of these ID numbers will match IDs in the /etc/passwd file. |

    | 4 | A list of all users who can be considered members of this group. Account
    names in the list are separated by commas. |'
  merge: -1
