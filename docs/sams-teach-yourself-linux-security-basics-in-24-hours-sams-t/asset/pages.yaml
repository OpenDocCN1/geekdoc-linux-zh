  md: '# Introduction


    In the computing world, security is a strange topic. This is because the computing
    world as we know it has largely become a collection of technologies for the enabling
    of networks, and our conception of what a network should be is fundamentally opposed
    to our conception of what good security should be. A network is designed specifically
    to allow needed data to be retrieved and to allow connections to be made between
    otherwise unrelated computers and systems. The role of security, on the other
    hand, is largely to forbid data from being retrieved or to forbid one computer
    from making a connection with another. Clearly, the process of securing a system
    or a network is one in which context and balance are important. Security must
    function well enough within your own computing context to provide you and your
    users with an acceptable balance between allowing and forbidding.


    Because of the context-specific nature of this opposition, which is inherent in
    phrases like computer security and network security, because security is a nearly
    infinite deep topic for those who care to study it in depth, no book can ever
    be the final word on security—no one book can be used by every user or system
    administrator to secure your system.


    # But Why Security Important at All?


    When it comes to large Internet servers of users’ credit card numbers or large
    government servers full of nuclear secrets, it is easy to see why information
    ought to be protected—why some system-to-system connections and some attempts
    at data retrieval ought to be forbidden. These types of risks, on the one hand
    financial and involving hundreds of thousands of individuals and on the other
    national or even global scale, are easy to see. But what about the typical dial-up
    modem user, who connects to the Internet to browse the Web or help the kids with
    their homework? And what about the small business who runs a small Web but hardly
    feels important or large enough to be a target for international terrorists or
    organized crime?


    Unfortunately, the Internet, the real world, is not always a friendly place. There
    are any number of small-time ne''er-do-wells who like to get their hands on the
    10 or 15 credit card numbers your server contains. Even more frighteningly, there
    are thousands of ‘script kiddies’ roaming the Internet without any motive at all—they
    enjoy breaking into computer systems and erasing data simply for fun. Often, they''re
    not even knowable hackers, but instead download their exploits (tools used for
    breaking into other peoples’ computers) from security-oriented Web sites.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Sams Teach Yourself Linux Security Basics in 24 Hours


    In fact, these two classes of security threats—the small-time criminals and the
    clueless script kiddies—actually prefer to break into tiny computer systems located
    in living rooms and small business offices. Why? Because most of the time, these
    types of systems are the least protected of all. Think about it: Have you taken
    any measures to protect the computer in your living room from outside attacks?
    The data on your home computer may not be especially valuable in terms of money,
    but how would you react if you left your computer connected to the Internet to
    make a cup of coffee and came back five minutes later to find your hard drive
    blank and unrecoverable, all of your letters, checkbook balancing records, even
    your Netscape bookmarks gone?


    In the case of a small business, the threat is even easier to see. You certainly
    don''t want your Web site taken down if it is your main source of income. More
    importantly, there are all of those records—the books from your business, built
    with your blood, sweat, and tears, going back years—gone.


    In today''s world, network security is important for every Internet user and every
    Internet-enabled small business. Period.


    # I''m Using Linux! How Much More Secure Could It Be?


    Here are a few facts about the average home or small-business Linux user that
    are important in this context. The average Linux user


    +   - Is connected to the Internet often or always and may even run a small Web
    site, FTP server, or e-mail server.

    - Runs Linux on standard PC-compatible hardware.

    - Has installed a commercial Linux distribution, probably Red Hat Linux.

    - Has not taken any security measures beyond those (if any) taken by the makers
    of the distribution.

    - Rarely or checks the system logs.


    If this sounds a lot like you, you''re asking for trouble—or you may even be in
    trouble already. The truth is that most Linux distributions ship in a fundamentally
    insecure state—with access from anyone nearly always allowed for nearly all services
    that Linux is capable of handling. Why? Because Linux originates in the world
    of Unix operating systems, and most distribution vendors still operate as if a
    competent system administrator is performing all Linux installations and thus
    take the necessary steps to secure a system before it goes online.


    Unfortunately, this is not always the case. If you feel that most of the items
    describe your situation, one more fact is clearly to you right now: You need to
    make your system more secure.'
