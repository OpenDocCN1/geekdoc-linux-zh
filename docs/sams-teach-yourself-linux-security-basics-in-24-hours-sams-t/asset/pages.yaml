  md: 'The primary reason to want to understand what happened is so that you can fix
    it next time. If the log shows that the user got in through named, check your
    DNS configuration next time. Make it more paranoid, and check for a package update
    with a later version of BIND from your distribution maintainer. Once you understand
    that a particular aspect of the system is vulnerable, you''ll be less vulnerable
    to the same attack.


    # # Notify the Authorities


    In this case, the authorities means other Internet users, rather than law enforcement.
    Specifically, it means to determine the source of the attack using your logs and
    login information. A host name or network number is what you''re looking for,
    something to identify which machine was connected to your machine at the time
    the attack took place.


    Remember that the system on the other may not necessarily be some dark criminal
    organization. It may simply be that the system from which the cracker entered
    yours was a system that he had previously cracked. The administrators of the other
    system may not even aware that it has been compromised.


    If you get an IP address from your logs or SWATCH alerts, the first step is to
    notify the host directly. For example, if the attack come from 24.13.131.162,
    send mail to root@24.13.131.162 and carbon copy abuse@24.13.131.162, describing
    what happened and informing the administrator that the attack come from his host.


    This alone doesn''t guarantee your message will reach human eyes, however. The
    host may be a dynamic address in an ISP dialup pool or a Windows host. Try to
    get information about who the host is from the IP address you collected. The simplest
    way to do this is with nslookup, which should be installed by default on most
    Linux systems or sometimes can be installed as part of the DNS package.


    ```

    $ nslookup 24.13.131.162

    Server: newton.mynet.net

    Address: 192.168.1.100

    ```


    ```

    Name: c133337-a.saltk1.ut.home.com

    Address: 24.13.131.162

    $

    ```


    Judging by the hostname associated with this IP address, it is indeed a line at
    ISP whose domain is home.com. Now that you have the provider of the IP address
    from which the attack came, notify them at the abuse address (in this case, abuse@home.com)
    that your system was compromised and that the attack come from a host within your
    domain. Be sure to include the IP number of the attack source and the exact date
    and time of the attack.'
