    If you plan to use TCFS on this client regularly, you will want to edit your init
    scripts to load these modules automatically at boot time.


    # Using TCFS


    Before any regular use can take place, the volume in question must be mounted
    somewhere-on the client machine. Remember also that any user who is going to use
    the volume to store encrypted data must have write access to some directory on
    the mounted volume. This must all be done on the NFS server.


    For example, let’s assume that a user named joe be able to store encrypted data
    on the server in question, and that the server is exporting a directory at /exp/crypt
    for this type of storage. Assuming that joe has the UID and GID on both server
    and client, an administrator on the server would need to give joe a “home directory”
    on the encrypted volume:


    ```

    # cd /exp/crypt

    # mkdir joe

    # chown joe.users joe

    #

    ```


    Once this is, joe will be able to write somewhere.


    # Enabling TCFS Access (Administrative Tasks)


    Let’s assume now that the client machine joe is using, an administrator has mounted
    the encrypted volume at /mnt/priv. Remember, this must be done with the new mount
    command with knowledge of TCFS


    ```

    # /usr/local/tcfs/bin/mount -t tcfs server:/exp/crypt/mnt/priv

    #

    ```


    Once the volume has been successfully mounted, including joe, will find the encrypted
    volume at /mnt/priv. This means that joe’s directory on the encrypted volume is
    at /mnt/priv/joe.


    Before joe can manipulate any encrypted files, an account must also be configured
    for him in the TCFS database. This is done with the tcfsadduser command:


    ```

    # /usr/local/tcfs/sbin/tcfsadduser

    ```


