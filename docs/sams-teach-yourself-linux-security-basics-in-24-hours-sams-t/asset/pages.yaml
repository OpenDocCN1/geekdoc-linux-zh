    # Using Snort


    Before you can tell Snort to watch network traffic for certain patterns, you must
    have rulesets containing patterns that match common attacks. Luckily, you don''t
    have to build all of these rulesets yourself. A number of large, comprehensive
    rulesets have been compiled by the Snort community for machines operating in various
    roles.


    To download one or several of these rulesets, visit http://www.snort.org/snort-files.htm#Rules.
    Here you will find a list of text files that are ready for drop-in rules operation
    with Snort. Table 22.1 gives some of these rulesets and when they might be appropriate
    for Linux users.


    # Table 22.1 Using Snort Rulesets


    | Ruleset | Appropriateness |

    | Backdoor Activity | Most useful for Windows hosts; generates a lot of false
    alarms. |

    | Backdoor Attempts | Most useful for Windows hosts; generates a lot of false
    alarms. |

    | Backdoor (Sig.) | Most useful for Windows hosts. Recommended for mixed environments.
    |

    | DDoS | Recommended for all installations. |

    | Exploits | Essential for all installations. |

    | Finger | Recommended for all installations. |

    | FTP | Essential when FTP service will be available on the network. |

    | ICMP | Recommended for all installations. |

    | MISC | Recommended for all installations. |

    | NetBios | Essential when running Samba on a Linux host or when Windows hosts
    are present on the network. |

    | RPC | Recommended for all installations. |

    | Rservices | Recommended for all installations. |

    | Scans | Recommended for all installations. |

    | SMTP | Essential when SMTP service will be available on the network. |

    | Telnet | Essential when standard Telnet service will be available on the network.
    |

    | Virus | Most useful for Windows hosts; recommended when local Windows hosts
    are using e-mail clients. |

    | Web-cgi | Essential when Web service will be available on the network. |

    | Web-ColdFusion | Essential when ColdFusion-based Web service will be available
    on the network. |'
