  md: '# Securing Apache, FTP, and SMTP Services


    ln -s /private/projects /public/www/employee-projects


    Now there is a valid URL where the directory can be found. However, the Directory
    scope restricting access to the root (/) file system still prevents access to
    the directory. You could then add another scope:


    ```

    <Directory /private/projects>

    Order Allow,Deny

    Allow from all

    </Directory>

    ```


    This will allow access to the directory in question, but it will give access to
    everybody in the world. The proper way to handle a situation like this is via
    user authentication. assigning username and password pairs to the group of employees
    who need to have access to /private/projects, you can put the data on the Web
    without making it completely public.


    To do this, we can add the following scope to httpd.conf:


    ```

    <Directory /private/projects>

    AuthType Basic

    AuthName "Employee Files"

    AuthUserFile /etc/http/employee-users

    Require valid-user

    </Directory>

    ```


    The AuthType directs HTTPD to use basic authentication (ask for a username and
    a password) before allowing files in the directory to be served. The AuthName
    determines what will be displayed to the remote user when a username and password
    are requested.


    The next directives require more explanation. The AuthUserFile directive dictates
    that a user and password file located at /etc/http/employee-users are consulted
    for authentication information. The Require directive with the valid-user option
    dictates that a valid username and password pair is required before logins will
    be allowed. Where does this user and password file come from?


    The file must be created and maintained using the htpasswd utility. The utility
    is easy to use. To begin a new file and add a user to it, use


    ```

    htpasswd -b -c file password

    ```


    So, for example, to give a user named bob access to /private/projects over the
    Web, you''d create an account for him in a brand new file like this:


    ```

    htpasswd -b -c /etc/http/employee-users bob bobsspass

    ```


