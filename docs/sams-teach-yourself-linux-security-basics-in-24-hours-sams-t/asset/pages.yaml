    uses the SNAT target will attempt to keep connections open if the interface goes
    down for a moment, operating on the assumption that, when it comes back up, the
    IP number will be the same.


    After these changes are made, the system on which the rules are created will act
    as a rea-secure router for other systems on the internal network.


    # Port Forwarding


    Chances that there is at least one service you''d like to provide to the outside
    world from behind your minimal firewall. In order to enable machines in the outside
    world to connect to your internal network, some translation must clearly take
    place because IP addresses in your internal network are not valid in the larger
    Internet.


    With Linux kernel 2.4 and the advent of iptables, no additional software is required.
    Instead, port forwarding of this type can be accomplished using the DNAT target
    for destination network address translation. Using iptables, the basic syntax
    for port-forwarding is as follows:


    ```

    iptables -t nat -A PRERUTING [-p protocol] \\

    -d $MYIP --dport original_port \\

    -j DNAT --to destaddr:port

    ```


    The logic behind this type of rule is as follows: Inbound packets, being processed
    by the PRERUTING chain in the nat table, which were destined for the local network''s
    outside IP on the specified port, will be mangled and delivered to the new destination
    address and port. In the case of a local Web server delivering to 192.168.1.14,
    using default http ports, the result would be


    ```

    iptables -t nat -A PRERUTING -p tcp \\

    -d $MYIP --dport http -j DNAT --to 192.168.1.14:80

    ```


    This command would enable port forwarding to the Web server, enabling it to operate
    from behind the firewall. Before incoming connections would be allowed, however,
    one additional line must appear in our iptables script, before we block all NEW
    and INVALID packets:


    ```

    iptables -t filter -A INPUT -p tcp -source-port www -j ACCEPT

    ```


    This line allows connections from any source to be initiated on the www protocol
    port listed in the /etc/services file.


    # Putting It All Together


    To make things a little more clear, let''s put everything we''ve done so far together.
    A sample bash script that uses all of the rules we''ve created so far is shown
    in Listing 11.1.'
