    # Tunneling TCP Streams Through SSH


    One of the most important features of SSH is the capability to tunnel TCP data
    through an encrypted data stream. Using this feature, it is possible to encrypt
    data streams of all kinds, from the Simple Mail Transfer Protocol (SMTP) used
    by daemons like Sendmail to the protocol used by the print spool.


    Tunnels of this kind are created by asking SSH to listen for connections of the
    desired kind on the local machine. When a connection to this port is opened, SSH
    will then forward this connection to a port on the remote machine through an encrypted
    channel, securing an otherwise unsecured network protocol.


    The syntax for asking SSH to wait in the background and forward TCP streams through
    an encrypted tunnel


    ```

    ssh host -f -L localport:host:port

    ```


    In general, host refers to the destination system to which you want clients to
    be able to connect, port represents the normal port for the TCP stream you want
    to tunnel, and localport represents the new port you want SSH to listen on the
    local machine. The best way to illustrate is with a simple example.


    Suppose our fictitious joe regularly brings his e-mail from the host known as
    newton to the local machine using the Post Office Protocol version 3 (POP3). This
    protocol is perhaps one of the most used on the Internet today and manages lots
    of mail for lots of people, including joe. There are some problems with POP3,
    however. The two most important are that the identity and password information
    sent across the plain text and that messages are sent this as well, making any
    e-mail connection fair game for mischief. To remedy this situation, joe wants
    to encrypt his POP3 connection to newton.


    To do this, joe runs the following command:


    ```

    ssh newton -f -L 7501:newton:110

    ```


    Then, he configures his mail client to connect to the localhost on port 7501 instead
    of newton on port 110 as is normally the case with POP3 connections. Now time
    his mail client polls the remote system for new e-mail using the POP3 protocol,
    all of the communication, including passwords and any mail text, is encrypted
    by SSH.'
