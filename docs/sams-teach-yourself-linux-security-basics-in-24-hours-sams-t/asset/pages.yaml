  md: '# # What Is iptables? What Happened to ipchains?


    The iptables command is a successor to the ipchains associated with 2.1 and 2.2
    revisions of the Linux kernel. The ipchains command was rebuilt to make some things
    (like forwarding between interfaces or routing) more clear when dealing with packet
    filtering.


    Users familiar with ipchains already might find that iptables is a cinch to learn.
    It is also true that iptables is much more flexible than ipchains in many ways,
    allowing the administrator more control over little details such as logging levels.
    Since late 2.3 and early 2.4 kernels include ipchains backward-compatibility as
    a compile-time option, but a move to iptables is desirable because of the added
    functionality and flexibility iptables can offer.


    # # Network Security and the Kernel


    Before attempting to construct any firewalling or filtering rules using iptables,
    we need to compile support for this type of network functionality into the Linux
    kernel. Rather than to prescribe a set of “do” or “don’t” rules for the networking
    options in the 2.4 kernel, this text will defer to the canonical kernel source''s
    defaults as a foundation. These defaults are reasonably sane.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_181_0.png)


    > There aren''t many distributions shipping with 2.4 kernels as this text is being
    written, but generally speaking, distribution maintainers have a tradition of
    shipping kernels with nearly every networking option compiled into them. Although
    this means that such kernels are likely ready out of the box for iptables and
    packet filtering, it also means that the quality of your system might be lowered
    if you choose not to recompile your kernel. For example, some unnecessary networking
    options tend to place hardware into promiscuous mode, whereas others require special
    administration or knowledge in order to remain secure.


    Therefore, although it might be possible for you to use iptables without recompiling
    a new kernel, it is not recommended for reasons related to network security. In
    the end, you be the judge. For example, if your system is relatively low-traffic
    with regard to the Internet at large, iptables and a stock traffic systems systems
    should definitely make an attempt to be more conservative.


    In addition to those networking options that are enabled by default in canonical
    kernel sources, the Networking Options items shown in Table 11.1 should be enabled
    as well, in order to work with iptables configuration.'
  merge: -1
