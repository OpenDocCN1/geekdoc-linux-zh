  md: '# TCP/IP Network Security


    Most of the lower ports below 500 are either reserved by ICANN or are in common
    use, when deciding on your own ports, it''s best to pick a large number—usually
    somewhere in the thousands. You may want to avoid ports 6699, 7777, 8888, and
    other repeating-number ports, which are now commonly used in Napster, as well
    as port 6346, the default for Gnutella.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_106_0.png)


    Though modifying /etc/services may seem like a good idea, there are a couple of
    caveats.


    First, the list of ports contained in /etc/services is guaranteed only to affect
    those managed by the inetd daemon. Services that usually are started on a standalone
    basis by the rcm.d scripts discussed... may not obey the port hints specified
    in /etc/services.


    Next and more importantly, remembering that the ports in the /etc/services file
    leads only the casual observer to think that a service isn''t available. Crackers
    will use a piece of software scanner to get a list of every active port in your
    system before trying to break in, so changing default ports won''t help under
    these circumstances. In the end, the inconvenience of having to remember at which
    alternate ports your services lie may outweigh any security-oriented benefit.


    You''ll have to use your own discretion and judgement with regard to your specific
    circumstances for the /etc/services file.


    # TCP Wrappers Properly


    You may have noticed in Listing 6.1 that programs listed in the last field of
    each line in /etc/inetd.conf aren''t actually what you might have expected. For
    example, in the case of the FTP server, rather than just listing the path to a
    binary as /usr/sbin/in.ftpdd, the file actually contains the path to another binary,
    /usr/sbin/tcpd, which is then followed by the correct server program. If you examine
    your own /etc/inetd.conf file, you should find that this is the case with the
    majority of external services.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_106_1.png)


    > If you don''t find any references to /usr/tcpd in your /etc/inetd.conf file,
    and the /usr/sbin/tcp binary is not present on your system, yours is not protected
    by Tcp wrappers.


    > Check your distribution media''s package list immediately and install TCP wrappers
    now. If no such package is available for your distribution, upgrade now!


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_106_2.png)'
