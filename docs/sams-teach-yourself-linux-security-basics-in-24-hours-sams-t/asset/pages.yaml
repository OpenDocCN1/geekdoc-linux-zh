    # Network Terms


    3DES An older, reasonably fast encryption algorithm that is less complex than
    some newer algorithms but remains in widespread use, especially on mature networks
    like those serving teller machines (ATMs).


    network file system (NFS) The standard method for networked file exchange between
    Unix-like machines, similar in purpose to the type of file system sharing managed
    by Samba for communicating with Windows machines.


    Transparent Cryptographic File System (TCFS) A method of encrypting file system
    data for transport over an NFS connection and for secure storage.


