  md: '# Extra File System Security Tools


    Default permissions lists are inherited; if a subdirectly called yourfiles is
    created within myfiles, yourfiles will have all the permissions specified by the
    myfiles default list, and this default list will also apply to files created within
    yourfiles.


    # ACL Mask Permissions


    When experimenting with ACLs, you might notice a new set of permissions, known
    as mask permissions, in the output of the getfacl command. The mask permissions
    do not apply to a specific user or group, but rather indicate the maximum set
    of permissions that can be granted to any additional groups or users in the ACL
    list, regardless of the explicit permissions granted. To set the mask permissions,
    use


    ```

    setfacl -m[:|^]permissions file [file...]

    ```


    The idea of mask permissions can seem a little confusing at first, but it''s really
    quite a simple idea. Suppose you have granted the following permissions to a file
    called texasmap:


    ```

    setfacl -m u:jacob:rwx texasmap

    setfacl -m u:marlowe:rwx texasmap

    setfacl -m u:newton:rwx texasmap

    setfacl -m u:parson:rwx texasmap

    setfacl -m u:zender:rwx texasmap

    ```


    Five users other than the file''s user have been granted read, write, and execute
    permissions. Suppose, however that from time to time the texasmap is used on a
    Web site, and, during these moments, you the system administrator want to remove
    all write permissions for this file. The chmod command can be used to remove write
    access for the file''s user and group ownership, but not for these additional
    users. The setfacl command can be used to remove write permissions for each of
    them one by one, but this is a lot of work. Of course, the work is doubled when
    you need to re-enable write permission afterward. The solution lies in mask permissions:


    ```

    # setfacl -m m:^w texasmap

    # getfacl texasmap | grep mask

    mask:r-x

    ```


    This call to the setfacl command removes write permission from everyone in the
    access control list (other than the official user and group), even if some of
    the additional users or groups have explicitly been granted write permission.
    This is because the mask permissions, currently at r-x, dictate the maximum permissions
    any ACL entry can grant. To re-enable write permission for users with sufficient
    permission, use


    ```

    # setfacl -m m:+w texasmap

    # getfacl texasmap | grep mask

    mask:rwx

    ```


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_146_0.png)'
