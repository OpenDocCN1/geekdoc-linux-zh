    # Summary


    This hour, we''ve covered three main topics: understanding the role of your machine,
    selecting a distribution, and performing the installation in a security-conscious
    manner.


    Most home or small businesses fit into one of four basic roles. The role for your
    machine will affect the basic approach you take toward the security versus features
    tradeoff. The roles are


    +   - Workstation A typical desktop machine.

    - Server A machine dedicated to providing network services.

    - Infrastructure A machine used for firewalling, routing, or DNS.

    - Multipurpose A machine used for more than one of these tasks.


    When selecting a distribution, consider the role of your machine and the security
    features tradeoff. The major distributions are


    +   - Red Hat Features first, point-of-h releases, risky.

    - Caldera Features first, more conservative than Red Hat.

