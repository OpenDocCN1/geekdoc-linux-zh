  md: '# Network Security: DNS with BIND


    These basic security measures will make your domain name service daemon much less
    risky than the standard runs-as-root installation found on most Linux systems.


    # Q&A


    +   - I''ve seen other suggestions for domain name service, including a dual-named
    approach and using other servers instead of BIND. What do you think?

    - There are advantages and disadvantages to using BIND. The largest advantage
    is that it comes from the Internet Software Consortium and, following that, the
    degree to which BIND is a de facto Internet standard. Using the techniques in
    this hour can make BIND installations secure enough for any small to mid-size
    network.

    - I tried to install named in a chroot environment, but something isn''t working!
    Help!


    A first place to turn for aid is log. Check the system logs and if necessary increase
    the logging level as you start and run the new installation. If logging isn''t
    working, concentrate on getting that running first.


    The most common problem when converting from an existing BIND installation involves
    user oversight—the failure to set new permissions or file ownership on a critical
    file, or the failure to correctly edit one or more paths in the named.conf file.


    If you are familiar with strace, you can also use it to watch program execution
    and locate the trouble spot.


    # New Terms


    BIND The Berkeley Internet Name Domain, an open source implementation of the domain
    name service (DNS) set of protocols. BIND is the most common DNS implementation
    among Linux users.


    chroot jail A colloquial term meaning a chroot environment—a substituted root
    file system that is actually a subdirectory in a larger file system. The exterior
    file system can not be accessed by processes in the chroot environment.


    domain name service (DNS) A set of protocols and databases used to match a human-readable
    name to a machine-ready IP address. For example, without yahoo.com would instead
    be known as 64.58.76.179, a much less memorable name indeed.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_224_0.png)'
