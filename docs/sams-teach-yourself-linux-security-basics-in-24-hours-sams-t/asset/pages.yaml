  md: '# System and User Fundamentals


    /etc/shells file determines which default shells will be available to users through
    the chsh command. Many distributions provide a long list of available shells,
    but this is undesirable in a secure system; shells have been known to generate
    as many security problems as other components in a system, and it is much easier
    to monitor and update one shell than six or seven. More to the point, only the
    first default, bash on Linux systems, is likely to be used by most users. Thus,
    the /etc/shells file should be changed to contain a single line:


    ```

    /bin/bash

    ```


    This will ensure all users log into a similar baseline shell environment and the
    default .bash_logout file will be sourced and the screen cleared at logout.


    # The SysV-Style Init Process


    We discussed the init process a little bit in Hour 4, "The Boot Process," but
    now it''s time to really dig in and ensure that we understand and control what''s
    going on during system initialization. It''s going to get a bit dense for a moment,
    but by the time with me and you''re done with init, you''ll find it simple service
    to edit.


    In the /etc/inittab file, which controls the startup process for your Linux system,
    you''ll likely find a block of entries somewhere that looks similar to the one
    shown in List 5.2.


    # Listing 5.2 Calls to SysV-Style Scripts


    ```

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    16:6:wait:/etc/rc.d/rc 6

    ```


    Notice that each of these lines is run only if the system is starting at the specific
    runlevel, the runlevel shown between the first colons (:) on the line. Based on
    runlevel, it then calls a central script, in case /etc/rc.d/rc, and passes to
    this script the current runlevel of the system as an argument.


    This central script uses the information about the current runlevel to call an
    entire series of scripts located in a specific directory dedicated to the current
    runlevel. On this particular system, the script directories in question are probably
    numbered /etc/rc.d/rc00.'
