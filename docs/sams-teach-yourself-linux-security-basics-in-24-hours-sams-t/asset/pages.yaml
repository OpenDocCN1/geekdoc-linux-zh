  md: '# Teach Yourself Linux Security Basics in 24 Hours


    What you should already have to get the most out of this book...


    +   - A basic knowledge of Linux, including how to install and configure common
    Linux distributions

    - A basic knowledge of computer networking and the Internet

    - A basic knowledge of computer hardware


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_0.png)


    # Sams Teach Yourself Linux in 24 Hours, Third Edition


    This book will acquaint you with the Linux operating system.


    Some books that might help...


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_1.png)


    # Sams Teach Yourself Red Hat Linux in 24 Hours


    A collection of 24-hour lessons for using Red Hat Linux. Topics include installation,
    troubleshooting, connecting to the Internet, and removing programs, and more.
    The CD-ROMs contain a fully functioning version of Red Hat 7.


    # What this book will help you learn...


    +   - Security fundamentals for all network security, including role-specific
    types of security needs

    - Security issues related to using Linux in a networked environment and especially
    using Linux as a small server for various types of data services

    - Data encryption

    - Intrusion detection, auditing, and recovery


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_2.png)


    # Sams Teach Yourself Networking in 24 Hours, Second Edition


    Sams Teach Yourself Networking in 24 Hours, Second Edition is designed for the
    Linux user who wants to learn only the basics of networking, but also wants to
    understand the theory behind the practice.


    Related titles...


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_3.png)


    # Red Hat Linux 7 Unleashed


    Red Hat Linux 7 Unleashed shows how to install, configure, and manage version
    7. Version 7 boosts the latest stable kernel installation programs, updated libraries,
    and a host of other improvements, including the new x86_64.


    Where you may want to go from here...


    +   - Master Linux security

    - Learn advanced operating system concepts


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_4.png)


    # Maximum Linux Security, Second Edition


    This book is designed for system administrators, managers, and Linux users who
    want to protect their Linux servers and workstations from unauthorized intrusions
    and external threats to their systems'' integrity.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_1_5.png)


    # Policy Routing Using IPv4


    Traditional IPv4 routing is summarized as ''All routing is a driven process.''
    But what if you want to route packets differently? This is policy routing, and
    this book tells you how to do it.


    Titles to look for...'
