  md: '# Network Security: NFS and Samba


    # Summary


    This hour, we learned about security related to the two most popular networked
    file systems for Linux users and servers: the network file system (NFS) and Samba,
    which is used for sharing files with Windows systems.


    NFS is a classic Unix system and isn''t terribly risky or terribly secure but
    is somewhere between the two. If you can avoid having share files via NFS with
    the outside world, it''s best to run NFS only to serve local systems behind a
    dedicated firewall.


    If you serve files to the outside world via NFS, be sure to construct good packet
    filtering rules to protect it. It uses port 111 and 2049, a third port for `rpc.mountd`
    you must add to /etc/services in order for filtering to work.


    Always take the time to construct a good /etc/exports file. This is the primary
    means for securing NFS exports. Samba is a service that allows Linux to "speak"
    NetBIOS over TCP/IP in order to impersonate a Windows NT server and in so share
    files or directories with Windows users.


    The easiest way to configure Samba security options is with SWAT, the Samba Web
    Administration Tool, which can be launched in a browser window by connecting to
    port 901 on the Samba server. Once inside SWAT, choose between share-based access
    control, which asks for a password for the server requested, and user-based access
    control, which allows Samba to use username/password pairs just as the Linux server
    itself does. Samba resides on ports 137–139, so packet filtering rules affecting
    Samba should focus on these ports.


    # Q&A


    +   Q NFS isn''t terribly secure for public, untrusted system use, are there any
    alternatives that offer similar functionality?


    +   A AFS file system is the de facto alternative to the NFS file system. Unfortunately,
    AFS is a commercial product, and no free Linux version is available. An experimental
    implementation is under development and is usable, but you''ll have to use your
    own discretion with regard to the security implications of running unstable code.
    The free, experimental AFS system can be found at http://www.kth.se/projekt/arla.


    +   Q I don''t like SWAT. Is there a text-based configuration file for Samba?
    Where is it stored?


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_238_0.png)'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'Yes, there is a text-based configuration file for Samba; it uses a format similar
    to the format used by Windows INI files and is therefore not familiar to longtime
    Linux or Unix users. It is called samb.conf and is often found at /etc/samba.d/samba.conf,
    though a call to the locate command will help find it if it doesn''t appear in
    /etc/samba.d on your system. The format of the file is documented in excruciating
    detail in smb.conf. Unless you need the extra flexibility or have a book dedicated
    to Samba on hand, you''ll find yourself wanting to use SWAT, which is sufficient
    for most small to mid-size environments, with Linux acting as the single NetBIOS
    file server.


    # New Terms


    export A file system made available to other systems on the network via NFS.


    NFS (network file system) The traditional method for sharing Unix-like file systems
    over local area networks.


    Samba A set of two daemons that allows Linux to “speak” NetBIOS over TCP/IP and
    serve shares to Windows clients.


    share A resource (such as a file system or printer) made available to other systems
    on the network through Samba.


    SWAT The Samba Web Administration Tool, a program designed to automate the administration
    of a Samba server in a Web browser window.'
