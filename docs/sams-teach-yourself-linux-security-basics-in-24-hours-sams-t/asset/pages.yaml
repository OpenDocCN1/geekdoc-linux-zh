  md: '![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_72_0.png)


    # HOUR 4


    # The Boot Process


    This hour we''re going to focus for the first time on securing a system on which
    Linux has already been installed and is running. We will concentrate on the remainder
    of the system boot process as it plays out once LILO and later the Linux kernel
    have been loaded and are in control of the system. Security issues during the
    boot process include the following:


    +   - Forbidding the passing of kernel arguments via LILO

    - Implementing password protection via LILO

    - Choosing the correct runlevel for the machine''s primary role and editing runlevels
    where necessary


    # The Linux Loader


    The Linux Loader, or LILO as it is more commonly known, is the program responsible
    for loading the Linux kernel once the BIOS has passed control of the computer
    to the operating system. Most Linux users have seen one or both of the following
    lines of output during boot:


    ```

    LILO boot:

    Loading linux...

    ```'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'The lines are displayed by the LILO program before the Linux kernel is started.
    The first line of output above is the boot prompt, which allows the user to choose
    a kernel image to boot or pass arguments to the kernel. The second line of output
    is what might be displayed if a kernel labeled linux is loaded.


    The capability to pass arguments to the kernel is a useful one. For example, when
    an incorrect change to system libraries or a loss of data to power issues occurs
    and renders the system unbootable through normal means, the user can pass arguments
    to the kernel to boot into maintenance mode:


    LILO boot: linux single


    The single argument starts Linux in a special, stripped-down, root-only mode designed
    to allow system administrators to make repairs of the operating system otherwise
    needed for the boot process or normal system function. The single-user mode is
    analogous in many ways to the Safe Mode of the Windows operating system. However,
    it can pose a security risk by altering normal operating system functionality
    as you configured it and presenting users instead of a root-only password prompt.


    Even more dangerous, however, is the init= argument, which allows the user at
    the LILO prompt to specify an alternate init program for the operating system.
    The init program is a special program to be run first on Unix-like systems. It
    is responsible for all services, including things basic as the login prompt and
    password verification. A user at an unsecured LILO prompt might just as easily
    enter something like this:


    LILO boot: linux init=/bin/bash


    This line is particularly risky because it is a full system compromise in a single,
    simple line. When the init argument is set to /bin/bash, the Linux kernel will
    start bash (the shell) as the first process rather than init, meaning that no
    services will be started, no password prompts will be presented, the offending
    user will be dumped into a root shell!


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_73_0.png)


    > Don''t assume that this section doesn''t apply to simply because you never see
    a LILO boot: prompt when you start your computer. There is a good chance that
    LILO is still managing your boots. To see if this is the case, try holding down
    the Shift key just before your computer begins to load the operating system from
    the hard drive. If you see the LILO boot: prompt now, you''re vulnerable to these
    types of attack.'
  merge: -1
