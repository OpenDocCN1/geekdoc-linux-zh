    # Special Cases, Risks, and Rewards


    The permissions picture is a little more complicated than what we''ve painted
    so far Though the basics remain the same, there are some special cases that require
    special treatment in the context of a security-conscious Linux system.


    # Extra Directory Permissions


    In addition to the permissions covered so far, there are two interesting special
    cases for directories.


    The first special case is known as the sticky bit, named after a kind of functionality
    no longer in use. When applied to the other permissions of a directory (non-user,
    nongroup), the sticky bit creates a special situation: Users with write permission
    will be able to create files and modify and delete files that they have created.
    Files created and owned by other users, however, will remain off limits. The sticky
    bit can be enabled using the symbolic mode of chmod as follows:


    ```

    chmod +tmydirectory

    ```


    You will know that the sticky bit is set because a letter t will appear in the
    execute-other permission in ls output.


    The second special case is the SGID bit when applied to a directory. When this
    property is applied to a directory, any file created within the directory (including
    a new directory) will be created with the same group ownership as the parent directory.
    This is useful for situations requiring more subtle group file management techniques.


    # Device Nodes


    Recall that there are some types of files that actually refer to system devices,
    rather than files on the disk that contain user or program data. These types of
    files are commonly known as device nodes and reside in the /dev directory. If
    you visit /dev, you''ll notice that there are a lot of them, especially if you''re
    using one of the common Linux distributions.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_126_0.png)'
