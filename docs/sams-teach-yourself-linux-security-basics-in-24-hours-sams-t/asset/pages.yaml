    As was the case with SSH, in order to use public key authentication with OpenSSH,
    you must generate a personal set of keys and transfer the public key to the remote
    system. To generate your own key, simply run the ssh-keygen utility:


    ```

    ssh-keygen

    ```


    This program will ask you for an optional passphrase of your choosing and will
    generate two keys: a public key and a private key for your own personal use, which
    will be stored in $HOME/.ssh/identity.pub and $HOME/.ssh/identity, respectively.


    The exchange of keys when using OpenSSH is much simpler than the exchange of keys
    when using public key authentication with SSH. All that is required is that the
    key in identity.pub be appended to the $HOME/.ssh/authorized_keys file on the
    remote system. This can be accomplished easily, given a server host known as:


    ```

    $ cd .ssh

    $ cat identity.pub | ssh remote cat ''>'' .ssh/authorized_keys

    user@remote:password:

    ```


    Once you enter your password and the data is exchanged, your next call to ssh
    should proceed either without request or after asking for your public key passcode,
    if you choose to supply one when generating your set of keys.


    # Tunneling TCP Streams Through OpenSSH


    Like SSH, OpenSSH also includes a facility for tunneling many common network protocols
    through an encrypted channel by forwarding a port to the local machine. The syntax
    for forwarding a port in order to encrypt various kinds of network data using
    OpenSSH is


    ```

    ssh -L localhost:port:host port

    ```


    In general, host refers to the destination system to which you want to be able
    to connect, port represents the normal port for the TCP stream you want to tunnel,
    and localhost represents the new port you want SSH to listen to on the local machine.
    For


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_272_0.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'example, to tunnel the POP3 mail service through an encrypted channel at port
    8100 to a remote machine known as pokey, you might use


    ```

    ssh -L 8100:pokey:110

    ```


    There is no explicit way to force OpenSSH simply to forward a port in the background
    as there was with SSH, but a similar effect can be achieved, since OpenSSH won''t
    close a connection until all of the users have exited. Assuming that the user
    had already configured fetchmail to connect port 8100 at localhost for his mail,
    the following command would be suitable for a script that checks mail regularly:


    ```

    ssh -L 8100:pokey:110 pokey sleep 1; fetchmail

    ```


    The call to ssh forwards the port for the one second, during which fetchmail starts
    and connects to the port. OpenSSH will then leave the port open until fetchmail
    terminates.


    # # Improving X Security with OpenSSH


    Like SSH, OpenSSH includes extra functionality to streamline encrypted tunneling
    of the X11RG protocol. To use this functionality, you must first enable it in
    the /usr/local/etc/ssh_config file on the client (ssh server) machine, since OpenSSH
    disables this functionality by default.


    To enable the X-related features, be sure that the following line appears in the
    sshd_config file:


    ```

    X11Forwarding Yes

    ```


    Once you''ve added this line, launching X applications with OpenSSH is just as
    easy as it is with SSH:


    ```

    ssh remote-host /usr/X11RG/bin/xterm &

    ssh remote-host /usr/X11RG/bin/xclock &

    ssh remote-host /usr/local/bin/netscape &

    ```


    As was the case with SSH, OpenSSH takes care of all the duties for you; when OpenSSH
    determines that an application is to be run, it automatically exchanges the magic
    cookie from your XDMCP session and sets the DISPLAY environment variable in the
    remote environment correctly.


    # # Summary


    In this hour, you have learned to install, configure, and use your network encryption
    tool of choice: Secure Shell (SSH), for those who can afford or who prefer a commercial
    license, and the SSH version 2 protocol or OpenSSH, an open source implementation
    of the SSH protocol.'
