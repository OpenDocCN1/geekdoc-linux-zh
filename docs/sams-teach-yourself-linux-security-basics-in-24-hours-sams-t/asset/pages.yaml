    # HOUR 2


    # # BIOS and Motherboards


    During this hour, we''re going to step outside Linux for a moment and work on
    what a PC-class computer does before it gets around to starting an operating system.
    There are important security issues that must be addressed before we concern ourselves
    with Linux. This hour covers the following issues:


