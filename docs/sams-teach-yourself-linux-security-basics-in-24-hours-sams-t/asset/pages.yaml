  md: '# Securing inetd, the Internet Daemon


    You probably understand already that most network services on Unix-like systems
    are associated with a specific daemon. For example, File Transfer Protocol sessions
    are managed by in. ftppd, Telnet or remote login requests are handled by inetd,
    network file system requests are handled by nfsd, and so on.


    But you also have noticed that most of these daemons don''t run all the time.
    In fact, of all major network service daemons, only two, http and sendmail, routinely
    run on a continuous bas. When an incoming FTP or Telnet request is received, who''s
    responsible for starting in.ftpd or in.inetd to handle the connection?


    The answer to this question is inetd, a daemon whose major responsibility is to
    listen to a broad range of network ports and start service daemons dynamically
    in response to incoming requests. For smaller systems, this is a boon representing
    a significant amount of saved memory that would otherwise have been dedicated
    to keeping a large number of service daemons running all the time.


    # Why inetd is Risky


    The design of inetd allows many services to be multiplexed in a way through a
    single request broker, saving memory and resources. But on most smaller systems,
    the vast majority of the network services inetd is capable of managing are never
    used. Most homes and small businesses don''t run a network time server, a network
    news (Usenet) spooler, a Unix-to-Unix copy program (UUCP) node, or even a diskless
    boot server.


    What Linux users don''t realize that Linux distributions traditionally have left
    all of these on the inetd configuration, meaning that all of these types of requests,
    received across the network, will be serviced by your system. Even though many
    of them are password protected or employ some other minimal means of protection,
    any accepted network connection at all should be viewed as a potential system.
    compromise.


    Of course, we already know that this is the nature of networks. Since they are
    designed to accept incoming connections from best uncertain sources, they are
    always risky from an absolute security standpoint. In the case of inetd, however,
    the risk should be minimized.


    # The /etc/inetd.conf File


    Luckily, the configuration file for such an essential and central network daemon
    as inetd is surprisingly clear and simple. All configuration for the daemon resides
    in the'
