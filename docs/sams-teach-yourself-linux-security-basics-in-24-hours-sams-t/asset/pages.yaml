  md: '# File System Security


    Permissions are checked from left to right when a user attempts to access a file.
    For example, assume that the file fiona.jpg in the example above actually had
    the following permissions:


    +   -r-- -rw-


    Even if lenny is a member of the group users, he will not be able to write to
    the file, since he is denied write permission in the leftmost match.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_122_0.png)


    # Modifying Permissions


    The user of a given file or directory can change the permissions of the file using
    the chmod command. There are two modes in which chmod can function: a symbolic
    mode, which uses characters to modify a file''s permissions, and a numeric mode,
    which uses series of three numbers to modify a file''s permissions.


    # Using chmod in Symbolic Mode


    Each invocation of chmod in symbolic mode can be used to either add (enable) or
    remove (disable) permissions with respect to one or several files. When the (+)
    or minus (-) mode is used in symbolic mode, permission modifications are made
    while leaving existing, unreferenced settings intact. When the equals (=) mode
    is used, permissions are set explicitly to the set of permissions specified. The
    syntax is one of the following:


    ```

    chmod [ugo][rwx] file [file...] (add permissions)

    chmod [ugo]-[rwx] file [file...] (remove permissions)

    chmod [ugo]=[rwx] file [file...] (set permissions)

    ```


    u represents a permissions change for the user, g for members of the file''s group,
    o for other users (neither nor group member), and for everyone (members of the
    group, and other users). To illustrate how chmod works, we''ll go over a few examples.


    ```

    chmod u+rx file1.txt file2.txt

    ```


    In this case, both file1.txt and file2.txt gain execute permission for the user
    and members of the file''s group.


    ```

    chmod o-rw privatefile.doc

    ```


    Here, others (neither nor group owner) lose both read and write permissions for
    privatefile.doc.


    ```

    chmod ug=rwx,o=rw publicfile.wpd

    ```


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_122_1.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'In this example, publicfile.wpd will now be readable, writable, executable
    by the user and members of the related group. Other users will be allowed to read
    from the file and to write to the file but not to execute the file as if it were
    a program.


    # Using chmod in Numeric Mode


    In numeric mode, chmod uses a series of single-digit numerals to determine permissions
    for a file explicitly. The syntax for using chmod in numeric mode is follows:


    ```

    chmod NNN file [...]

    ```


    The first N represents permissions for the user, the second for the file''s group,
    and the third for all other users. The digit is either a zero (0) or a single-digit
    sum of the values related to the permissions assigned. These values are shown
    in Table 7.1.


    # Table 7.1 Values for chmod Numeric Mode Permissions


    | 4 | Indicates that read permission should be present for the file or directory.
    |

    | 2 | Indicates that write permission should be present for the file or directory.
    |

    | 1 | Indicates that execute permission should be present for the file or directory.
    |


    When you use chmod''s numeric mode, each of the three digits must be a digit,0–7,
    constructed as a sum of the permissions the user wants to grant to this file.
    Let''s look at some more examples.


    ```

    chmod 710 script*.sh

    ```


    In this case, any file matching the shell pattern script*.sh will be given the
    following permissions: read, write, and execute for the user; execute only for
    members of the related group; no permissions (no read, write, or execute) for
    other users who neither the user nor belong to the related group.


    ```

    chmod 664 file.txt

    ```


    Here, the file.txt has been given read and write permissions for the user, read
    and write permissions for members of the related group, and read permission for
    everyone else in the system.


    The most public permissions specification (read, write, and execute for everyone)
    when given via chmod''s numeric mode looks this:


    ```

    chmod 777 myfile

    ```


    By contrast, the most closed permissions specification (no read, no write, and
    no execute for anyone at all) is given by


    ```

    chmod 000 myfile

    ```'
