  md: 'existing binaries from your fresh installation. Both tar and afio support modes
    of operation that will refuse to overwrite existing files; most other backup software
    programs have similar modes of functionality.


    After you have restored the files you intend to restore, thoroughly inspect your
    /etc/passwd, /etc/shadow, /etc/group, and security-oriented configuration files
    to ensure that they were not tampered with earlier than you realized.


    Require all users, including root, to change their passwords. Consider issuing
    account names as well, if you are able.


    # Take Care of the Vulnerability


    Before bringing the system back online for full operation, be sure to repair the
    vulnerability that caused your headaches in the first place!


    The first place to check is with your distribution vendor. See if updated libraries,
    kernels, daemons, or other packages are available that have fixed the weakness
    exploited by the malicious individual who attacked your system. For an even better
    solution, simply download the entire trees if possible and install it. Each of
    the updates there is for a reason.


    If no package can be found to repair the vulnerability you encountered, report
    it to your distribution vendor through official channels and go in search of an
    unpacked version of the compromised piece of code. For example, if the attacker
    entered your system through BIND, and there are no BIND updates from your vendor,
    go to the home page of the BIND daemon and see if there is a new release version
    that fixes the attacker exploited that your vendor hasn''t packed.


    If you can find no way to fix the problem, it may be time to consider disabling
    the service altogether. Ask yourself: Is the service really important? It is absolutely
    essential to the functioning of your network? If the answer is no, switch it off
    and do without.


    If you can''t find a fix and you can''t afford to switch it off, there is only
    one other way to deal with the problem: Isolate the service on its own machine.
    Do almost nothing else on that machine and store as little account and network
    data as is possible on the machine until the problem can be fixed and the weakness
    eliminated.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_375_0.png)


    > If nobody appears to be aware that there is a vulnerability in a software package
    that as far as you can tell has been exploited in your case, be sure to submit
    a report of exactly what happened, along with the related log information, to
    the programmers responsible for the piece of code involved.'
