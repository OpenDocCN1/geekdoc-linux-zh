    | anogid=N | Specifies that all client requests operate as if they had come from
    the group with group ID N. |


    By using these options thoughtfully, it is possible to assemble a clear, concise,
    and relatively secure system of exportable file systems. A sample /etc/exports
    file is shown in Listing 14.1.


    ```

    ### Listing 14.1 Sample /etc/exports File

    /fs/work 192.168.1.0/24(root_squash)

    /fs/work/public 192.168.1.0/24(rw,root_squash)

    /fs/work/private (noaccess)

    /fs/pubrecords (all_squash)

    /usr/local/db phoenix(rw,no_root_squash)

    /usr/local/db-public *.redux.com(insecure,all_squash)

    /scratch phoenix(rw) newton (rw) hotswap

    ```


    This file says following to the NFS daemon:


    +   - Export a read-only file system at /fs/work to all systems on the local 192.168.1.0
    network, squaring root access attempts.

    - Export a writable file system at /fs/work/public to all systems on the local
    192.168.1.0 network, squaring root access attempts.

    - Do not allow anyone who has mounted the /fs/work file system to access the /fs/work/private
    directory at all.

    - Export a read-only file system at /fs/pubrecords to anyone in the world-connect
    coming from a port 1024. Squash all incoming user and group identification.

    - Export a writable, root-capable file system at /usr/local/db to the host in
    the local network called phoenix.

    - Export a public, read-only file system to anyone in the redux.com domain connecting
    from any port. Squash all incoming user and group identification.

    - Export the /scratch directory to the local network hosts phoenix and newton
    as writable. Export the /scratch directory to the local host hotswap as read-only.'
  merge: -1
