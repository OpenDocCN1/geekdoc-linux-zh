    amend

    to the line to:


    ```

    ALL : 192.168.1. berts-bar.outdoorbars.net

    ```


    Now, you also need to grant connection requests for FTP because you''re run-

    n an anonymous FTP server, and you also want to accept all incoming talk requests

    because you are enjoying chatting with whoever happens to dial you up. In that
    case, you would

    add the following:


    ```

    in.talkd.in.ftpd : ALL

