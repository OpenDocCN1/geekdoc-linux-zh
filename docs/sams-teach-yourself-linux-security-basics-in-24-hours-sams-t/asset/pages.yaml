    For all other options, unless you know what you are doing, try to respect the
    canonical kernel defaults, which are reasonably conservative. Don''t enable anything
    that is normally disabled unless you are certain that you need the related functionality
    and have read documentation on how to correctly administer it.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_183_0.png)


    > Some readers might plan to use additional packet types, such as IPX or AppleTalk,
    with the same ethernet hardware that will be passing TCP/IP packets. Be aware
    that iptables rules apply only to TCP/IP; no matter how protective and closed
    your iptables rulesets are, they cannot prevent attacks over IPX or AppleTalk
    running on the same interface.


    Therefore, if you plan to run AppleTalk or IPX on a machine that will also be
    connected to the outside (Internet) world via TCP/IP, it is suggested that you
    install two ethernet cards. One will connect to the outside world and will be
    filtered by iptables. The other will be for the internal network only and will
    handle these additional packet types.


    After a new kernel has been compiled, installed, and verified to function correctly,
    you''re ready to proceed with iptables rule configuration.


    # Using iptables


    As was the case with iptchains, and as is the case with any other complex system,
    the iptables devil can be in the details. The basic logic behind iptables is simple,
    although an extra layer of functionality has been added since the days of iptchains.'
