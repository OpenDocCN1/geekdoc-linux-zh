- img_proc: true
  md: '# 322


    # Hour 21


    This line will cause SWATCH to watch the log in question for the strings ROOT
    LOGIN OR uid=0 in order to stay abreast of root-level activity occurring on the
    system responsible for the log being watched. After each watchfor is a series
    of lines describing the actions that are to occur when the pattern is matched.
    For example, after the watchfor pattern, you may see the following:


    ```

    echo red

    mail addresses=admin@mynet.net:j2w1x.org,subject="SW.ROOT"

    bell 3

    ```


    These lines cause SWATCH to display the relevant log entry in red on the terminal
    controlling SWATCH. Then, SWATCH will mail the log entry to two addresses—admin@mynet.net
    and j2w1x.org—with the easily identifiable subject .SW.ROOT.

    Finally, SWATCH will run the terminal three times.


    The list of actions continues until the next watchfor line, which begins with
    a different pattern to watch for. The actions SWATCH can be instructed to list
    in Table 21.1.


    # Table 21.1 Actions for the SWATCH Match For


    | Action | Description |

    | echo [mode] | Displays the matching log entry to the controlling terminal. Optional
    mode can be one of bold, underscore, blink, inverse, black, red, green, yellow,
    blue, cyan, white, black_h (highlighted), red_h, green_h, yellow_h, blue_h, cyan_h,
    or white_h. |

    | bell [count] | Runs the terminal bell. Optional count describes the number of
    times the bell should sound. |

    | exec command [args] | Executes the specified command, with any supplied arguments.
    $N in arguments will be expanded to whitespace-separated field N in the log entry,
    $ will be sent to the log entry |

    | mail [addr],[sub] | Sends the related log entry to the user''s e-mail address.
    If addresses=addr... is supplied, sends mail to the list addresses(es). If subject=subject
    text... is supplied, uses the supplied subject as the subject for the message(s)
    sent. |

    | pipe command | Sends the log entry to the standard input of command. Writes
    the log entry to the terminal of user. More one user can be listed by separating
    with a colon (:). |

    | throttle h:ms | Specifies if the log entry is repeated more than once in the
    supplied period (hours:minutes:seconds), the action(s) for the match should be
    carried out only once during period of time. |

    | continue | Instructs SWATCH to attempt to match this log entry to other watchfor
    patterns in the match file after actions |'
