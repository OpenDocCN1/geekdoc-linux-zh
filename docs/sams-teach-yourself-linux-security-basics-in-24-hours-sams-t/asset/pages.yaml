    # # /etc/services File


    You may have been wondering just where the service names in the /etc/inetd.conf
    file come from. They''re contained in the /etc/services file, which associates
    a human-readable name with a port. It is the port that is really important to
    Linux when it comes to handling service requests, but of course, humans do not
    like to remember long lists of numbers.


    In most cases, feel free to leave the /etc/services file alone. It isn''t important
    for TCP/IP security in the same way that the /etc/inetd.conf file is, but there
    is one way in which it can be helpful.


    Any TCP/IP-enabled Unix-like system can respond to incoming connections on a large
    array of network ports. These ports can be thought of a sort of switchboard for
    connection requests. The request will be routed to a specific daemon such as ftp
    or http according to which daemon is listening to the port or which daemon has
    been assigned that port by the inetd server. Each TCP/IP service has been assigned
    a default port by the Internet Corporation for Names and Numbers (ICANN). For
    example, Web service (HTTP) normally resides on port 80, and File Transfer Protocol
    normally answers on port 21.


    Though it won''t challenge a knowledgeable cracker at all, some reduction in the
    number of unwanted connection attempts to a specific service can at times be achieved
    by altering the port on which the service in question is listening for requests.
