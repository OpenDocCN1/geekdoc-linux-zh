  md: '# Summary


    In this hour, you learned to use SAINT and its Netscape-based graphical interface
    to perform a basic security audit on your system. You then learned how to search
    the information provided by SAINT and use it to eliminate vulnerabilities found
    on your host or around your network.


    You also learned to install and use SWATCH, a simple but very useful tool for
    watching system logs as they are written. Using SWATCH, you can continuously monitor
    logs for certain important patterns and either notify an administrator(s) or take
    action based on the matching entries occurring.


    # Q&A


    +   Q I have a file or configuration issue that SAINT says may represent a vulnerability,
    but I think it''s supposed to be there. Should I remove it?


    +   A It depends on a number of factors. First, if SAINT says that a given file
    may indicate the presence of a backdoor or root kit but you are sure the file
    is original, there is an easy way to be sure. Compare the file''s checksum, size,
    and date against the original from your distribution package. If they match, the
    file is original. This does not necessarily mean that it is safe. Be sure to check
    for updates from your distribution maintainer in case the original file contains
    a vulnerability.


    +    SAINT is warning you about a configuration issue, you will need to apply
    some critical thinking to the issues SAINT is raising. Is there anyway to accomplish
    the same thing in a less vulnerable way? If the issue is an enabled service or
    open port, is it needed at all or can it be removed?


    +   Remember, software programs SAINT are only tools. You are the administrator,
    and in the end all—and consequences—are yours.


    +   Q How do I know which strings to match in SWATCH?


    +    Some of the strings in the sample SWATCH match file have never appeared in
    my logs.


    +    Shouldn''t you also include string “N” in your match file?


    +   A There are almost many different daemon and syslog versions as there are
    Linux distributions, so strings will vary from one system to the next, depending
    on vendor and date of assembly. Even such basic things the init binary can be
    based on completely different code bases from system to system.


    +    Your SWATCH match file will have to be based on experience. That is to say
    that you have to be hacked in advance to build a good file. There is a simple
    way to learn about the types of log entries you ought to watch for: behave yourself!'
