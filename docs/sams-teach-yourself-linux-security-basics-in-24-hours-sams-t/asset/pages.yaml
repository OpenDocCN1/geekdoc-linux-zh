  md: '# Recovering from Attacks


    likely against other systems, your system may be one hop in his path, potentially
    implicating you in his crimes. There is no time to waste.


    Unplug the network cable. If you are unable to do this for some reason for a single
    host in your network, disconnect your network from the firewall/router unit so
    that the outside world is no longer a threat.


    Disentangle the machines as quickly as possible and isolate the compromised machines
    from the others. There isn''t a long history of viruses or worm-like attacks with
    Linux, but it''s out of the query by any means, so you''ll need to quickly break
    the link between the compromised system and other systems on your internal network.


    When administering large networks with large amounts of resources, there may be
    time for romantic ideas like stealthily catching a criminal in your logs and gathering
    information until you spring on him with law enforcement at your back. However,
    this is the real world, and most mom-and-pop operations with one to five machines
    or even a few just can''t afford to waste time. Better to get things moving along
    toward recovery; you won''t catch this single-handedly.


    # Stop Linux


    Because malicious software installed by crackers can do some nasty things, you
    don''t want to leave this system running while you analyze what went wrong. You
    could lose data or hardware (even *hardware*) in the process as destructive programs
    dance through your drive space or your system''s various flash ROM units.


    Become root using the su command, if possible, and issue the reboot command:


    ```

    shutdown -r now

    ```


    If you are unable to use the root account for some reason (for example, the su
    binary and login binary have both been compromised to lock legitimate root access)
    and you have Magic SysRq key installed in your kernel, for an emergency sync.


    Whether you can emergency sync or not, if you are unable to shut down legitimately,
    the reset button immediately.


    > The Magic SysRq key is really a series of special keystrokes that instruct the
    Linux kernel to perform specific tasks if a system has become unstable.

    The SysRq key can be enabled with a compile-time kernel option (the last option
    in the kernel configuration process) or by writing 1 to the

    /proc/sys/kernel/sysrq file as the superuser:

    echo 1 >/proc/sys/kernel/sysrq


