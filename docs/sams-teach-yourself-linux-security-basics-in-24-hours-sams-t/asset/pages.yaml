    # Syntax for the setfacl Command


    The two important commands to remember when dealing with POSIX access control

    lists are setfacl, used to set or clear permissions in files with access control

    properties, and getfacl, used to display permissions in files with access control
    list properties.


    The setfacl command is used to add or remove access control list restrictions
    to a

    file or directory. The basic syntaxes for setfacl are as follows:

    setfacl [-m|x] u:[user]:[+]permissions file [file...]

    setfacl [-m|x] g:[group]:[+]permissions file [file...]

    setfacl [-m|x] o:[]permissions file [file...]


    These three forms of the setfacl command correspond to the modifications on a
    per-

    user basis, modifications on a per-group basis, or modifications for everyone
    (other

    users), respectively. In all cases, the -m argument is used to modify or add permissions,

    whereas the -x argument is used to remove permissions. If a specific user or group
    is

    supplied, and this user or group is not the existing user or group via traditional
    permiss-

    ions, action will take place in the set of special ACL permissions. Consider the
    list of

    examples shown in Table 8.3.


    # Table 8.3 Sample setfacl Commands and Descriptions


    | Command | Description |

    | --- | --- |

    | setfacl -m u:rwx | Gives read, write, and execute permissions to the user of
    the file in question. |'
