  md: '# HOUR 7


    # # File System Security


    This hour, we’re going to learn the security-oriented features of the Linux file
    system. In terms of its user interface, the Linux file system can be described
    as Unix-like. It is a permissions-based file system, meaning that access to various
    system resources is determined by ownership and access rights explicitly granted
    by the system administrator. This file system security model can generally be
    made to work very well. However, it can’t work for you if you don''t understand
    how it functions and take steps to employ it properly.


    # # Understanding Permissions


    The Linux file system security model works by assigning two properties to each
    file in the system. These properties are stored automatically on the disk, along
    with the file to which they apply. Since most devices in the system are also referenced
    by a file (known as a *device node*), this security model applies to many raw
    devices as well. The two sets of properties given to each file or each device
    are known as *ownership* and *access rights*.'
