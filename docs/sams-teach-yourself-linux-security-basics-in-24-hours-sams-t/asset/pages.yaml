  md: '+   - Lock floppy drives


    Many computer accessory dealers sell a small device called a floppy drive lock.
    This device is a small piece of plastic shaped more or less like a floppy disk
    with a keyhole on one end. When inserted into a floppy drive and locked, the plastic
    unit prevents a floppy disk from being inserted until the device is unlocked and
    removed again.


    +   - Disable CD-ROM drive eject buttons


    Some newer CD-ROM drives, especially those from big-name manufacturers, ship with
    a jumper- or switch-operated feature to allow the user to completely disable the
    frontal eject button while leaving software eject intact. Even in the absence
    of such an option, you may be able to disable the button manually with a little
    tinkering, doing so will likely void your warranty. Once the button has been disconnected
    or disabled, a CD can be inserted only after the user has logged into Linux and
    issued the eject command.


    +   - Consider removing drives altogether


    If there''s no reason to have removable storage on a publicly accessible system,
    by all means remove the device. Any computer system will operate perfectly with
    no floppy drive or CD-ROM drive, though a few BIOS configuration changes may be
    necessary. Remove the drive and put a blank faceplate in its place; this is the
    ultimate form of floppy or CD-ROM drive security.


    If finances allows it, you may even consider diskless clients for public access
    machines and mounting file systems using NFS or some other network system hosted
    in another. That way, even if the system is stolen or damaged physically, the
    data on your boot drive and file systems remains intact.


    # # Locking Down "the Box"


    Every measure we''ve discussed so far is moot if a thief or malicious individual
    simply picks up your "box" and walks away with it when you''re not looking. It
    makes little sense to spend money on cable clamps, uninterruptible power supplies,
    floppy drive locks, and other security paraphernalia if your box itself is vulnerable
    to simple theft. There are several possible ways to solve this problem, which
    are listed here and which involve progressively more expensive equipment.


    +   - Lock the back room


    This method of securing your room costs little or nothing. If you''re keeping
    your machine in a secure room, simply ensure that the room has a lock and that
    it stays locked at all times. Even when you''re on the premises, the circumstances
    can get out of control, and a five-minute absence can translate into a thousand-dollar
    loss from your secure but unlocked room.'
