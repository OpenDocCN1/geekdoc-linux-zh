    # HOUR 14


    # # Network Security: NFS

    and Samba


    This hour, we''re going to work toward more secure installations of the two most
    widely used Linux network file system implementations: Samba and the network file
    system (NFS).


    NFS is widely used among Unix and Linux users for sharing traditional Unix-like
    file systems over TCP/IP networking. It has been around since the early days of
    TCP/IP networking, but it has changed little when compared to many other network
    services.


    Samba, more popular than ever and commonly used as a replacement for Windows NT
    server, is designed to allow Linux to supply file and print services to Windows
    network users. Configuration of a basic Samba installation tends to be more complex
    than configuration of a basic NFS installation, but the resultant system is a
    cross-platform dream that can outperform Windows. Unless secured properly, however,
    it can suffer some of the same security problems as Windows.'
  merge: -1
