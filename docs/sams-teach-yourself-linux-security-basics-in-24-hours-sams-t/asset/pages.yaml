  md: 'dictate the type of access, if any, the host, series of hosts, or network in
    question is to be granted. Common valid formats for host are shown in Table 14.3;
    a list of the most common available options is shown in Table 14.4.


    # Table 14.3 Common Valid host Formats


    | Format | Description |

    | --- | --- |

    | hostname | Specifies that the options in question apply to the host with name
    hostname. |

    | N.N.N.N | Specifies that the options in question apply to the host with IP number
    N.N.N.N. |

    | N.N.N.N/M | Specifies that the options in question apply to the network given
    by N.N.N.N, with subnet mask M. |

    | *.domain.com | Specifies that the options in question apply to all in the domain.com
    domain. Note that wildcard characters do not match the dots in a fully qualified
    name. For example, *.domain.com would not match my.sys.domain.com, while *.domain.com
    would. |


    # Table 14.4 Common Options for Each host


    | Option | Description |

    | --- | --- |

    | insecure | This option allows client requests from connecting systems to come
    from source ports above 1024. Because it can be insecure, it is used only when
    needed and for completely public file systems. |

    | rw | Specifies parties that have permission to mount this export directory will
    also be given permission to modify the files and directories it contains. |

    | noaccess | Specifies that no access is given to this directory. Useful when
    creating per-directory exceptions to higher-level directory options. |

    | root_squash | Modify all client requests that come from the root user (user
    ID 0) to operate as if they had come from the nobody and group nobody, which should
    be present in the /etc/passwd and /etc/group files. |

    | no_root_squash | Specifies that client requests from the root user should be
    accepted as coming from the root user. For security reasons, this option is risky
    and should not be used for general-purpose exports. |

    | squash_uids=N,N,N,... | Specifies that client requests from the user IDs listed
    should operate as if they had come from the user nobody. |

    | squash_gids=N,N,N,... | Specifies that client requests from the group IDs listed
    should operate as if they had come from the group nobody. |

    | all_squash | Specifies that all client requests should be mapped to user nobody,
    group nobody. |'
