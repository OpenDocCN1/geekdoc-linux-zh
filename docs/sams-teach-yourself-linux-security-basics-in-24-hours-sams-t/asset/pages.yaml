    An additional possibility with SCSI cards complicates the issue considerably.
    Most SCSI cards have both internal and external connectors, and modern SCSI cards
    are automatically terminated, meaning that no changes must be made to the card
    itself in order for devices to be attached to the external connector. This creates
    a rather security problem during the pre-boot BIOS stage. If you plan to use an
    automatically terminating SCSI with BIOS and want your system to be secure between
