  md: '# /etc/securetty, /etc/shells, and

    .bash_logout


    There are three basic configuration files that don''t really fit anywhere specific
    in a discussion of Linux security, we''re going to cover them now. All three of
    these files are really important only if you are allowing remote user logins via
    a service like Telnet, but it''s a good idea to secure them just for the sake
    of correctness.


    The /etc/securetty file lists the tty devices on which root logins can occur.
    These devices are listed one per line and in order to be secure should include
    only local conditions. A sample /etc/securetty file is found in Listing 5.1.


    # Listing 5.1 Sample /etc/securetty File


    ```

    tty1

    tty2

    tty3

    ```


    /etc/securetty is not a terribly complicated file. This particular listing will
    allow root logins on the first three virtual consoles on the local machine and
    nowhere else. It is a good idea to remove everything but one or two tty devices
    from this file. if you are using a 2.4 kernel with devfs support enabled, it is
    a good idea to remove thing but one or two vc devices from the file.


    If no devices are listed (the file is empty), root access in multi-user runlevels
    will be available only through the sw command.


    /etc/shells file and /etc/skel/.bash_logout file work together. The problem is
    simple: When a user logs out of a text-mode, we want Linux to clear the display
    so that no data that has been left on the screen by the user will be visible to
    other users. These two files provide the means to accomplish this.


    First, /etc/skel/.bash_logout is edited. The $HOME/.bash_logout is sourced by
    the bash shell each user logs out. Thus, any commands it contains will be executed
    each time a user logs out. The template from which the $HOME/. bash_logout is
    created when new accounts are added is /etc/skel/.bash_logout. To this file, we
    add a single line:


    ```

    /usr/bin/clear

    ```


    This will cause the display to be cleared as the user logs out. Note that changes
    to /etc/skel/.bash_logout will be reflected in the accounts of users created after
    the file is edited.'
  merge: -1
