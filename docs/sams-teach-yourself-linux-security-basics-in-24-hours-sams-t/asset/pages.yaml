  md: '# The Boot Process


    **kernel arguments** Arguments passed to the kernel on the command line through
    LILO boot: prompt. These can be used to alter the default behavior of the kernel
    or init, posing a grave security risk.


    **LILO** The Linux Loader, a program designed to accept control of the computer
    system from your system BIOS, load the Linux kernel, and pass control of the system
    to it.


    **runlevel** An abstraction that init uses to decide which services should be
    started each time the machine boots.


    **three-key smash** Three keys (Ctrl, Alt, and Del) that, when pressed together,
    traditionally cause a system reboot to occur. Most Linux distributions continue
    to follow this tradition by default.'
