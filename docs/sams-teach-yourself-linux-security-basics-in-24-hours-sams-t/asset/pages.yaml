  md: '# HOUR 15


    # Securing X11R6 Access


    This hour we''re going to focus on securing the use of the X1R6 streaming protocol,
    with an emphasis on authentication when initiating new remotely connected streams.
    We''ll also take a moment to discuss packet filtering as it relates to X and to
    the X Display Manager, xdm.


    We''re going to cover two authentication methods: the simple and less secure host-based
    authentication mechanism and the more secure magic cookie authentication method.


    # Why Is X Security an Issue?


    X11R6 can be used as a network protocol, though it isn''t often used this way
    in small business or personal Linux installations. When used as a network protocol,
    X allows applications to run using the CPU and memory of one system while appearing
    on the display of and accepting input from another system on the network using
    the system''s X server, as shown in Figure 15.1.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# FIGURE 15.1


    X clients and server on

    separate machines.


    Clients running on network server

    appear on desktop workstation''s display.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_241_0.png)


    Because of this network-aware functionality, and because X servers will typically
    run with

    root permissions, it is important to have some control over who is allowed to
    connect to

    a running X server.


    There is often no need to run an X server at all on an important system.

    Though many combination desktop/server machines will need an

    instance of X running on the local console, most dedicated servers are used

    to supply a limited set of network services and are rarely or never used for

    desktop applications. If you use a machine in such a role, consider simply

    omitting X from the machine''s Linux installation altogether.


    Even if it is necessary to run an X application every now and then, you can

    make a server system more secure by not running an X server, displaying the

    applications instead of another X workstation using the network capabili-

    t of X. That way, no X server will be needed, and one more potential

    security risk will be eliminated.


    # Host-Based Authentication


    Host-based authentication enables the X server to allow or disallow incoming con-

    ections based on the network address, domain name, or hostname of the host making
    the'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Securing X11R6 Access


    connection request. If the network address, domain name, or hostname appears in
    a list of allowed hosts, then the connection will be accepted and opened. Otherwise,
    it will be rejected.


    # The /etc/Xn.hosts File


    There are two methods provided for editing the list of allowed hosts that the
    X server will use for authentication. The first of these is with the /etc/Xn.hosts
    file where n represents the number of the local display to which given file will
    apply. On most Linux systems, there will be only one file called /etc/X0.hosts.
    The format of this file is very simple: Each line contains one IP address, domain
    name, or hostname. A sample /etc/X0.hosts file is shown in Listing 15.1.


    # LISTING 15.1 A Sample /etc/X0.hosts File


    ```

    192.168.1.14

    192.168.1.15

    station20.bigwing.org

    station21.bigwing.org

    xclaim.multiply.net

    workstation1

    workstation2

    workstation3

    workstation4

    station-kathy

    station-john

    ```


    Notice that no wildcards are used in Listing 15.1; this is because no wildcards
    are allowed. Each system that should be allowed must be explicitly listed.


    # The xhost Command


    Because the /etc/Xn.hosts file is read only once each time the X server is launched,
    /etc/Xn.hosts file cannot be used to make changes to the authentication list at
    runtime (as the X server is operating). At times this can be inconvenient. For
    on-the-fly changes to the authentication list, X developers created the xhost
    command, which manipulates the X server''s internal host-based authentication
    list at runtime.


    Using the xhost command is also a very simple affair. To add a host to the list
    of hosts to be authenticated, call xhost with the name of the host to add, prepended
    by a plus symbol (+):


    ```

    $ xhost +host.to.add

    host.to.add being added to access control list

    $

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 226


    # Hour 15


    To remove a host from the list of hosts to be authenticated, call xhost with the
    name host to remove, prepended by a minus symbol (-):


    ```

    $ xhost -host.to.remove

    host.to.remove being removed from access control list

    $

    ```


    This command will remove the named host from the list, preventing future connection
    attempts from being accepted.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_243_0.png)


    Manipulation of the host access control list has no effect on connections that
    are already open. Therefore, removing a host from the list will prevent any future
    connection attempts from being successful, but all streams that existed at the
    time of the change will remain active and open after the change until they are
    shut down by one side or the other.


    To see the current list of allowed or forbidden hosts, call the xhost command
    with any arguments:


    ```

    $ xhost

    INET:localhost

    INET:192.168.1.14

    INET:192.168.1.15

    INET:station20.bigwing.org

    INET:station21.bigwing.org

    INET:xclaim.multiply.net

    INET:workstation1

    INET:workstation2

    INET:workstation3

    INET:workstation4

    INET:station-kathy

    INET:station-john

    LOCAL:

    $

    ```


    In addition to the capability to add or remove single hosts from the list or display
    the list to the user, the xhost command provides the capability to enable or disable
    hostbased authentication logout. To enable or disable host-based authentication,
    supply either the minus (-) or plus (+) symbol, respectively, as an argument.
    For example, to disable host-based authentication, supply the plus symbol as an
    argument:


    ```

    $ xhost +

    access control disabled, clients can connect from any host

    $

    ```'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Securing X11R6 Access


    To re-enable host-based authentication after it has been disabled, supply the
    minus symbol as an argument to the xhost command:


    ```

    $ xhost -

    naccess control enabled, only authorized clients can connect

    $

    ```


    There is rarely, if ever, a legitimate reason to disable access control, so use
    of the plus and minus arguments for the xhost command is strongly discouraged.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_244_0.png)


    It is important to understand that disabling host-based access control using the
    method shown here does not have the effect of disabling all incoming connections.
    Instead, it has the exact opposite effect. When access control has been disabled,
    the X server will accept all incoming connections from any anywhere. It is therefore
    never a good idea to disable host-based authentication on any system that is connected
    to a live network.


    Understand also that the plus (+) and minus (-) arguments are reversed with respect
    to many users'' expectations. The plus argument actually disables access control,
    while the minus argument enables it. Confusing the two can have serious security
    consequences!


    # Host-Based Authentication Problems


    There are some important problems with host-based authentication that must be
    considered for any user who will be running an X server on a live network.


    First, host-based authentication is not very secure, for several reasons. Most
    importantly and obviously, a host or IP address can be easily spoofed, rendering
    host-based authentication completely impotent in many cases. Even when spoofing
    doesn''t occur, access can be granted in error innocently.


    For example, many networks use Dynamic Host Configuration Protocol (DHCP) to assign
    IP addresses. This means that one IP address can actually represent a number of
    different systems over time, and there may be no way to predict which systems
    are associated with a given IP address at any time. An IP address added to the
    host list may refer to a completely different system on the network by half past
    noon. Because the IP address is in the host list, access will be granted to the
    new system if it were the old system, because it resides at the same address.


    Host-based authentication also fails to relate directly to user(s); it applies
    only to entire systems. It is therefore not possible to grant access to one user
    on a system but deny connection from another user on the same system. Using host-based
    authentication, all users on a system must have access if one user is to have
    access. Similarly, guarantee


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_244_1.png)'
