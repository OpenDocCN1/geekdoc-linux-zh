  md: '# Security and sendmail


    The sendmail daemon is an ugly beast, but it is very standard and very flexible.
    In fact, it is so flexible that its bizarre configuration file format is like
    a cross between a programming language and an exploding bit bucket.


    Because of this, it’s not unnoticed that you recommend Sendmail at all—certainly
    not without the aid of a Sendmail book. Most distribution maintainers do a better
    job of constructing Sendmail configuration files than the average small network
    administrator has to do. Thus, if you keep up to date with regard to Sendmail
    packages and updates from your distribution vendor, there’s little more you can
    really do about the configuration of Sendmail.


    However, sendmail or any mail daemon for matter can still be made more secure.
    In organizations of all sizes, the size of SMTP agents is especially vulnerable
    to unauthorized use, either from spammers or in a worst-case scenario, by crackers.
    Luckily, in the case of an SMTP agent, there’s never a need to allow for full
    public access. There will always be some small number of hosts or a specific network
    that should have access to SMTP and the rest of the world, which should not.


    There are two basic ways to secure Sendmail: with packet filtering or with TCP
    wrappers.


    # Securing Sendmail Through Packet Filtering


    Packet filtering, as discussed in Hour 10, “Using iptables for Firewalling and
    Routing,” and Hour 11, is a method of filtering out unwanted network traffic from
    untrusted sources using a table of information inside the kernel. Recall that
    the basic packet-filtering utilities are ipchains for 2.2 kernels and iptables
    for 2.4 kernels.


    Using ipchains to filter out Sendmail requests from untrusted sources is a simple
    matter:


    ```

    ipchains -A input -p tcp -s 192.168.1.0/24 \

    -j ACCEPT

    ipchains -A input -p tcp -s my.isp.mail.host \

    -d ext.input.number sendmail -j ACCEPT

    ipchains -A input -p tcp -i ! lo \

    -d ext.input.number sendmail -j DENY -1

    ```


    The first two ipchains allow packets from an internal network (change this to
    suit your own needs) and from a trusted external host on the other hand. The third
    line drops and logs all SMTP packets not originating in the internal network or
    with the trusted host. You might have realized that if you have already implemented
    the ipchains rules from Hour 10, you won’t need the last line because a similar,
    all-encompassing rule already exists.'
