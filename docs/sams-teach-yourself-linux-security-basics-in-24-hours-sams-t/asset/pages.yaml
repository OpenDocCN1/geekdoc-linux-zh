  md: '# Recovering from Attacks


    +   - It covers you legally, at least to some extent. Law enforcement hasn’t caught
    up to the digital age yet in all respects; you might be able to get your local
    police department or the FBI to file a report on the crime, but you’d better not
    hold your breath. Having a backup of a compromised system is proof that your system
    was attacked and is some measure of defense if the cracker used your system in
    some kind of illegal activity when he was in.


    If possible, make two copies of the system, one as a backup or in case it is subpoenaed
    at some future date as evidence. Label them clearly and lock them in a safe.


    # Understanding What Happened


    In spite of the cracker’s success in compromising the system, you’ll often find
    that it’s relatively easy to determine what went wrong. The vast majority of the
    crackers loose on the Internet are script kiddies, relatively unsophisticated
    crackers who use scripts or vulnerabilities developed by others to break into
    networked computer systems certain predefined criteria.


    Script kiddies are successful too often, but more than not, they leave behind
    a number of telltale footprints. If you know what you are looking for, it can
    often be a simple task to find them.


    By the most common types of attack against Linux systems are buffer overflow attacks
    against various daemons or network services. These are usually easy to spot because
    one of the most recent log entries or SWATCH alerts will be read as an error message
    from the daemon in question, often filling the log with garbage as well.


    Physically connect the root drive as a second drive to another system, if possible,
    and do a search using find files or directories (especially binaries) that have
    been recently modified. Often, these will be hidden or disguised with correct
    dates and modification times, but a good percentage of the time they will.


    If your system has package management, restore the package management databases
    from a backup before the compromise took place, along with the package manager
    itself. For example, many systems store the rpm database in /var/lib/rpm. Restore
    from your backup, along with the rpm program. Then, verify all packages:


    ```

    rpm -Va

    ```


    Note the differences. There shouldn’t be many, and any differences to critical
    system binaries like login, 1s, and so on will at least let know which files were
    compromised by the attack.'
