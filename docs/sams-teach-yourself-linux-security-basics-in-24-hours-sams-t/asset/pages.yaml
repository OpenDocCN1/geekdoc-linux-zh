    Inside the ssh-2.4.0 directory, use the configure command to tailor the source
    code configuration for your own system''s circumstances. You''ll probably want
    to supply the --with-libwrap option to allow SSH to work with TCP wrappers:


    ```

    $ ./configure --with-libwrap

