  pgno: 273
- img_proc: true
  md: '# Encrypting Data Streams


    You learned how to use either one of these tools for a number of purposes:


    +   - As a general-purpose replacement for rsh, login, Telnet, and other aging
    protocols that don''t protect any of the data they send across the network, including
    things like passwords and other account-oriented information.


    +   - As a multipurpose network stream encryption tool, using port forwarding
    from the local machine to a remote destination.


    +   - As a more secure and more convenient method for handling the X11R6 magic
    cookie authentication exchange.


    +   - As a more secure and more convenient method for handling X11R6 data streams
    representing multiple clients.


    Though SSH may seem daunting at first, once mastered it quickly becomes convenient
    and easy to use as familiar commands like rsh. The convenience of some functions
    (such as used by network-oriented X) is greatly enhanced through the use of SSH.


    # Q&A


    +   - Why didn''t you discuss the SSH version 2 protocol in OpenSSH?


    +   A Because it isn''t really done yet as this text is being written. Specifically,
    host-based authentication isn''t yet supported at all (RhostsRSA is not a part
    of SSH-2) and there have been some compatibility problems between the official
    SSH 2.x components and the OpenSSH components when running in SSH-2 mode.


    At this point, there is substantial loss to most small business or small network
    users forced to use SSH-1 instead of SSH-2; the original SSH protocol remains
    a mainstay of the networked world and provides most of the functionality of the
    SSH-2 protocol.


    +   - Aren''t there import or export restrictions on OpenSSH or SSH? Won''t I
    get into trouble if I them?


    +   A. The commercial SSH has never been subject to U.S. export restrictions because
    it is not developed in the U.S. but in Europe. There has never been an import
    restriction on cryptographic tools. The main issue for a number of years with
    SSH was the fact that the RSA encryption algorithm was patented by a U.S. company,
    and thus, free distribution of SSH was in violation of patent. However, the patent
    expired in 2000, and there are no known legal entanglements for using SSH or OpenSSH
    at this time.


    +   - I have installed SSH on an older computer system, and each time a connection
    attempt made, it seems to take forever for sshd (or sshd2) to respond. What''s
    going on?'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'This is because the daemon launch and key generation are using most of your
    limited resources each time a connection is opened. The solution in cases of old
    or very slow hardware is to start sshd and ssh2 once from an init script of your
    choice or construction as the machine boots, rather than to have it started by
    inetd each time a new connection is requested.


    # New Terms


    **keys (public and private)** A special kind of code used for encryption. Each
    authentication entity in the SSH world has two keys: a public key and a private
    key. Both keys yield the same encryption result, but the keys are different and
    one key cannot be derived from another. The public key is known by everyone and
    shared upon request. The private key is secret and is never shared. Authentication
    takes place when data encoded by a second party using the public key is correctly
    decoded by the original party with the secret private key, thereby proving the
    identity of a user or host on the network.


    **OpenSSH** An open source implementation of the secure shell protocol based on
    releases of the "official" SSH software, which were also open source.


    **Secure Shell (SSH)** A kind of Swiss Army Knife replacement for the original
    rsh command. The chief benefits of SSH (indeed, the reasons for its name) are
    its capability to perform much more secure types of authentication than rsh ever
    could and its capability to encrypt network data streams, making them harder to
    intercept and use maliciously.


    **tunneling** A way of describing what occurs when SSH forwards a local port to
    a remote destination or vice versa and encrypts the packets while they are in
    transit for increased security.'
