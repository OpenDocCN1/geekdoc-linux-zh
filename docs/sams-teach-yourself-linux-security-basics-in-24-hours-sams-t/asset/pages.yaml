  md: '# Detecting Attacks in Progress


    # Installing libpcap


    The pcap library is required for Snort to operate. This library is standard on
    BSD Unix systems, but must be separately downloaded and installed on Linux systems.
    The pcap library can be found on the ftp://ftp.ee.lib.gov FTP site. The latest
    version of pcap will generally be symlinked to the name libpcap.tar.Z (filename
    is case sensitive).


    After downloading the source code, extract it, run the configure script, and run
    a make followed by a make install.


    ```

    $ tar -xzf libpcap.tar.Z

    $ cd libpcap-0.4

    $ ./configure --prefix=/usr

    ... [Output of configure]...

    $ make

    ... [Output of make]...

    $ su

    ```


    ```

    # make install

    /usr/bin/install -c m 444 -o bin -g bin libpcap.a /usr/lib/libpcap.a

    ranlib /usr/lib/libpcap.a

    ```


    The pcap library is now installed. However, that no include files were installed.
    There is an install-incl target in the Makefile, but in order to give the pcap
    includes its own directory, they can be copied by hand to /usr/include/pcap and
    /usr/include/pcap/net. A manual page will be installed with the install-man target.


    ```

    # mkdir /usr/include/pcap

    $ cp *.h /usr/include/pcap

    # mkdir /usr/include/pcap/net

    $ cp bpf/* /usr/include/pcap/net

    # install-man

    /usr/bin/install -c m 444 -o bin -g bin .pcap.3

    $ /usr/man/man3/pcap.3

    # exit

    ```


    The pcap library and the related files have now been installed. It is possible
    to compile Snort without installing the pcap library completely by adjusting some
    of the Snort configuration options, described in the "Installing Section” later
    in this hour. Several popular network tools also use pcap, so it may be of your
    benefit to install it anyway.


    # Installing libnet


    The latest version of the Libnet library is found at http://www.packetfactory.net/Projects/Libnet/dist/.
    As this book gives to press, the latest version present is libnet-1.0.1b.tar.gz.'
