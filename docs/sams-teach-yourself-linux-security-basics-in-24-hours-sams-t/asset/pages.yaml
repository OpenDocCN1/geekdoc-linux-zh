    Because the password= keyword has been placed before the first other= keyword
    in the global configuration section of the file, the listed password will be required
    to boot any image.


    # The restricted Keyword


    The next order of business in securing this LILO configuration is to add restricted
    keyword to the configuration file. The restricted keyword allows a password-protected
    image to be booted without a password unless command-line arguments are sent to
    the kernel. Like the password keyword, the restricted keyword can be placed into
    the /etc/lilo.conf file in one of two ways:


    +   * If placed at the top of the file, in the global configuration section, all
    kernel images will be restricted and no kernel arguments will be passable without
    first supplying the password related to the image in question.

    * If placed in an image= section of the file, for example just as the read-only
    keyword, no arguments will be passable to that particular kernel without first
    supplying the password. Other kernel images remain unaffected.


    As an example, let''s change our file so that all images are completely restricted.
    The new /etc/lilo.conf file is shown in Listing 4.3.


    # LISTING 4.3 Updated /etc/lilo.conf File


    ```

    #

    # Global section of /etc/lilo.conf

    #

    boot = /dev/hda

    install = /boot/boot.b

    prompt

    timeout = 100

    default = linux

    password= "A4ni77a*"

    ```


