  md: '# Network Security and the Kernel


    Before attempting to construct any firewalling or filtering rules using ipchains,
    we need to compile support for this type of network functionality into the Linux
    kernel. Rather than to prescribe a set of “do” or “don’t” rules for the networking
    options in the 2.2 kernel, this text will defer to the canonical kernel''s defaults
    as a foundation. These defaults are reasonably sane.


    By default, most distributions ship with a kernel already capable of cooperating
    with ipchains configuration. However, these stock kernels available are very much
    bloated and “open”—nearly every option has been enabled in order to match any
    possible contingency or installation size. Generally speaking, this is bad for
    security. Some options tend to place ethernet cards in promiscuous mode, whereas
    others require special administration in order to be secure. Therefore, although
    it is likely possible for you use ipchains without compiling a new kernel, it
    is not recommended, for reasons related to network security. In the end, you be
    the judge. If your system is relatively low-traffic with regard to the Internet
    at large, ipchains and a stock distribution might be all you need. On the other
    hand, moderate traffic systems should definitely make an attempt to be more conservative.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_167_0.png)


    Do not confuse the kernel source included in a Linux distribution with the official
    kernel source from ftp.kernel.org. The kernel sources included in most Linux distributions
    are preconfigured to match the binary kernel included with the distribution. Following
    defaults in this distribution-supplied kernel source therefore leads to a significantly
    different result from following defaults in canonical kernel distributions.


    In those networking options that are enabled by default in canonical kernels,
    the items in Networking Options, shown in Table 10.1, should be enabled, in order
    to work with ipchains configuration.


    # 10.1 Kernel Options Related to ipchains Firewalling


    | Option | Description |

    |---|---|

    | CONFIG_FIREWALL | Required; if not enabled, no other filtering or firewalling
    options will be available |

    | CONFIG_IP_FIREWALL | Required; enables IP packet filtering. This is the fundamental
    option related to ipchains and must be enabled. |'
