  md: '# New Terms


    **directive** A single option element from an Apache configuration file. Some
    directives are global, whereas others apply only within a given scope.


    **local access file** A file, usually .htaccess, that contains directives that
    apply to the current directory tree. Often, an AllowOverride directive must appear
    in the master-configuration file for an .htaccess file to have effect.


    **scope** A segment of an Apache configuration file, generally referring to one
    file, directory, URL, or virtual host, which can contain a number of directives.


