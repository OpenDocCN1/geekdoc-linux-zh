    # Security and File Transfer Protocol


    The file transfer protocol, FTP, is an incredibly useful service, and is one of
    the most used services on the Internet, behind HTTP, SMTP, and DNS.


    The wu-ftpd server is very flexible, and configuration files can become quite
    complex. However, the vast majority of FTP servers on the Internet do one of two
    things (or both of them) on a regular basis: provide anonymous FTP access to everyone
    or provide private FTP access for a few users. Short files and a few tips are
    all that is needed to keep FTP secure under these circumstances, provided you
    update security patch releases made available.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_208_0.png)


    > We’re going to discuss the most common FTP server, wu-ftpd, in this section.
    There are any number of alternative servers, including some like NcFTPD and ProFTPD,
    which are quite popular. The wu-ftpd server is still king among the Linux distributors,
    however, and remains one of the easiest and most secure to configure and use.


    # Anonymous Versus Private FTP


    Before editing any FTP-specific configuration files, you should decide whether
    or not you to enable anonymous FTP. If you only need a few users with accounts
    on your system to be able to log in and manipulate their files, then by all means,
    disable'
