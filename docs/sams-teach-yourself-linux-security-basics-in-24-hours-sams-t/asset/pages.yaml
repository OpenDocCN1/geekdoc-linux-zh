  md: '# Network Security: DNS with BIND


    # TABLE 13.2 Access Control Specifiers


    | Specifier | Description |

    |---|---|

    | any | Allow from any host anywhere (no access control at all). |

    | none | Allow from no hosts anywhere (all access forbidden). |

    | localhost | Allow from the local host. |

    | localnet | Allow from hosts that resides on a network for which the local host
    has a hard-interface. |

    | N.N.N.N | Allow from host with matching IP number. |

    | N.N.N.N/N | Allow from the network matching this network/netmask specifier.
    For example, 192.168.1/24 allows from all hosts on the local 192.168.1.network.
    |


    The allow_updates and blackhole items, which are to be specified within zones,
    use the same access control specifier formats.


    # Running named in a Chroot Environment


    Since BIND is a favorite target among crackers to gain illegitimate entry into
    a system, many administrators have taken to running named in a chroot environment.
    A chroot environment is a way of tricking BIND into thinking a subdirectory is
    actually the root file system. For example, to all processes on the system, named
    may be running inside /usr/local/bind, but to the named process itself and to
    its children, the /usr/local/bind directory will actually appear to be the root/)
    directory. If someone cracks a chrooted named process, he will be only able to
    damage or access files in /usr/local/bind.


    It is also a good idea to run BIND under a user and group specifically created
    to hold the named process, rather than running as root, which seems to be the
    default on many Linux distributions.


    # Adding User and Group


    Because BIND version 8 includes its own chroot functionality, we need only add
    a user and group named to the system-wide passwd and group files located in /etc.
    This is easy to do from the command line:


    ```

    # echo "named::29" >>/etc/group

    # echo "named:x:29:named::" >>/etc/passwd

    ```


    > Remember to use the append redirect (>>) rather than the create redirect (>)
    when applying lines to a file you could end erasing your password and group files!


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_220_0.png)'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'We also need to add the new named user to the /etc/ftpusers file if the file
    transfer protocol is going to be running, because there''s no good reason to allow
    named login attempts at FTP:


    ```

    # echo named >>/etc/ftpusers

    ```


    Feel free to adjust the user and group ID numbers assigned to named if necessary
    to accommodate the needs of your own system. Try to choose low numbers, though,
    to indicate that these accounts are system accounts.


    # Creating the Jail


    The first steps in running BIND from a chroot jail are creating the jail "cell"
    and adding a specific user and group for the named process and file ownership.
    A good location for the cell is /usr/local/named, but use your own discretion:


    ```

    # mkdir /usr/local/named

    # cd /usr/local/named

    # mkdev dev etc/named lib usr usr/sbin

    ```


    The /etc/named directory (remember, this is chroot) will be used to hold DNS data.
    Adjust it if necessary to suit your needs or preferences.


    > If you''re going to copy data and configuration information from an existing
    setup (we haven''t shown this here), remember to change ownership with chosen
    to the new named user and group. Also remember that named will be running in the
    new chroot environment, so your named.conf will have to be edited to reflect the
    new paths—as though /usr/local/named were really /.


    ![](img/5b265b1d98ba2e1a657c3f9cdc5ce677_221_0.png)


    Some basic device nodes are also necessary in many instances for BIND to run,
    so we''ll create these as well:


    ```

    # kndev dev/null c 1 3

    # kndev dev/zero c 1 5

    # kndev dev/random c 1 8

    # kndev dev/urandom c 1 9

    # kndev dev/tty c 5 0

    # chmod 666 dev/null/dev/tty

    ```


    Now, we need to copy a files from the system''s /etc directory to the jail cell.
    These are basic files that named will need to operate properly:


    ```

    # cp /etc/nswitch.conf /etc/resolv.conf etc

    # cp /etc/ld.so.cache /etc/localtime etc

    ```'
