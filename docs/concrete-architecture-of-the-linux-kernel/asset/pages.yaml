    ![](img/4e15c97e21a8f49742cf467593ac4c6a_11_0.png)


    Figure 3 shows how the process scheduler depends on other kernel systems. The
    process scheduler requires the memory manager to set up the memory mapping when
    a process is scheduled. Further, the process scheduler depends on the IPC subsystem
    for the semaphore queues that are used in bottom-half-handing (discussed in Section
    3.3). Finally, the process scheduler depends on the file system to load loadable
    modules from the persistent device. All subsystems depend on the process scheduler,
    since they need to suspend user processes while hardware operations complete.
    For more details about the specific dependencies between subsystem modules, please
    see [PBS].


    # 3.2 Memory Manager


    # 3.2.1 Goals


    As discussed in [Ruling 1997] pp 13-30, the memory manager provides the following
    capabilities to its clients:


    +   - Large address space - user programs can reference memory than physically
    exists

    - Protection - the memory for a process is private and cannot be read or modified
    by another process; also, the memory manager prevents processes from overwriting
    code and read-only-data.

    - Memory Mapping - clients can map a file into an area of virtual memory and access
    the file as memory

    - Fair Access to Physical Memory - the memory manager ensures that processes have
    fair access to the machine''s memory resources, ensuring reasonable performance

    - Shared Memory - the memory manager allows processes to share some portion of
    their memory. For example, executable code is usually shared amongst processes.'
