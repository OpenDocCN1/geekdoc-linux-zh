    # # Abstract


    The objective of this report is to describe the concrete (as-built) architecture
    of the Linux kernel. A concrete architecture description of the Linux kernel serves
    as a high-level specification for developers to modify and extend the existing
    kernel source code.


    We used a reverse engineering tool (Portable Bookshelf) to extract the detailed
    information out of the Linux kernel source. The biggest challenge we faced to
    overcome was the enormous volume of extracted information into subsystems. We
    clustered the extracted information based on our domain-specific knowledge about
    modern operating systems; the Software Landscape visualization tool was used in'
