    # # 1 Introduction


    # ## 1.1 Purpose


    The goal of this report is to describe the concrete architecture of the Linux
    kernel. Concrete architecture refers to the architecture of the system as it is
    built. We intend to develop the concrete architecture to provide high-level documentation
    of the existing Linux kernel.


    # ## 1.2 Introduction to Linux


    Lin Torvalds wrote the first Linux kernel in 1991. Linux gained popularity because
    it has always been distributed as free software. Since the source code is readily
    available, users can freely change the kernel to suit their needs. It is important
    to understand how the Linux kernel has evolved and how it currently works before
    new system programs are written.


    A concrete architecture based on the Linux kernel source code can provide a reliable
    and up-to-date reference for Linux hackers and developers. Linux has been revised
    several times since 1991 by a group of volunteers who communicate through the
    USENET newsgroups on the Internet. To, Torvalds has acted as the main kernel developer.
    In the event that Lin Torvalds is no longer part of the Linux project, we can
    reasonably expect that the Linux kernel can be enhanced and modified if an accurate
    and up-to-date architecture is maintained.


    Linux is a Unix-compatible system. Most of the common Unix tools and programs
    now run on Linux. Linux was originally developed to run on the Intel 8038 microprocessor.
    The original version was not readily portable to other platforms because it uses
    Intel''s specific interrupt handling routines. When Linux was ported to other
    hardware platforms such as the DEC Alpha and Sun SPARC, the platform-dependent
    code was moved into platform-specific modules that support a common interface.


    The Linux user base is large. In 1994, Ed estimated Linux has approximately 40,000
    users (Chi 1994). The Linux Documentation Project [LDP] is working on developing
    useful and reliable documentation for the Linux kernel; both for use by Linux
    users and by Linux Developers. To knowledge, LDP does not maintain an up-to-date
    concrete'
