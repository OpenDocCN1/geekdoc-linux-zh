  md: '# Concrete Architecture of the Linux Kernel


    The hardware memory manager detects when a user process accesses a memory that
    is not currently mapped to a physical memory page. The hardware manager notifies
    the Linux kernel of this page fault, and it is up to the memory manager to resolve
    the fault. There are two possibilities: either the page is currently swapped out
    to disk, and must be swapped back in, or the user process is making an invalid
    reference to a memory address outside of its mapped memory. The hardware memory
    manager also detects invalid references to memory addresses, such as writing to
    executable code or executing data. These references also result in page faults
    that are reported to the memory manager subsystem. If the memory manager detects
    an invalid memory access, it notifies the user process with a signal; if the process
    doesn''t handle this signal, it is terminated.


    # 3.2.4 Data Structures


    The following data structures are architecturally relevant:


    +   * vm_area - the memory manager stores a data structure with each process that
    records what regions of virtual memory are mapped to which physical pages. This
    data structure also stores a set of pointers that allow to perform actions on
    a particular region of the process''s virtual memory. For example, the executable
    code region of the process does not need to be swapped to the system paging file
    since it can use the executable file as a backing store. When regions of a process''s
    virtual memory are mapped (for example when an executable is loaded), a vm_area_struct
    is set up for each contiguous region in the virtual address space. Speed is critical
    when looking up a vm_area_struct for a page fault, the structures are stored in
    an AVL tree. This data structure contains the status of the page (for example,
    whether it is currently in use). All page data structures are available in a vector
    (mem_map), which is initialized at kernel boot time. As page status changes, the
    attributes in this data structure are updated.

    * mem_map - the memory manager maintains a data structure for each page of physical
    memory on a system. This data structure contains flags that indicate the status
    of the page.

    * free_area - the free area vector is used to store unallocated physical memory
    pages; pages are removed from the free_area when allocated, and returned when
    freed. The Buddy system [Knuth 1975, Nowiton 1965, Tanenbaum 1992] is used when
    allocating pages from the free_area.


