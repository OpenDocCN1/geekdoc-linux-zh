  md: '# Concrete Architecture of the Linux Kernel


    The following is a brief description of the low-level functioning of each IPC
    mechanism identified in 3.4.1.


    Signals are used to notify a process of an event. A signal has effect of altering
    the state of the recipient process, depending on the semantics of the particular
    signal. The kernel can send signals to any executing process. A user process may
    only send a signal to a process or group if it possesses the PID or GID. Signals
    are not handled independently for dormant processes. Before, the scheduler sets
    a process in user mode again, it checks if a signal was sent to the process. If
    so, then the scheduler calls the do_signal() function, which handles the signal
    properly.


    Wait queues are implemented using linked lists of pointers to task structures
    that control processes that are waiting for a kernel event, such as the conclusion
    of a DMA transfer. A process can enter the wait queue by calling the sleep_on()
    or interruptable_sleep() functions. Similarly, the wakes_up() and wake_interruptable()
    remove the process from the wait queue. Interrupt routines also use wait-queues
    to avoid race conditions


    Linux allows to prevent other processes from accessing a file. This exclusion
    is based on a whole file, or a region of a file. File-locks are used to implement
    this exclusion. The file-system implementation contains appropriate data in it''s
    structures to allow the kernel to determine if a lock has been placed on a file,
    or a region inside it. In the former case, a lock attempt on a locked file will
    fail. In the latter case, an attempt to lock a region already locked will fail.
    In either case, the requesting process is not permitted to access the file since
    the lock has not been granted by the kernel.


    Pipes and named pipes have similar implementation, as their functionality is almost
    the same. The creation process is different. However, in either case a file descriptor
    is returned to the pipe. Upon creation, some memory is associated with the open
    pipe. This memory is treated like a circular buffer, to write operations are atomically.
    When the buffer is full, the writing processes block. If a request is made for
    more data than is available, the reading processes block. Thus, each pipe has
    a wait queue associated with it. Processes are added and removed from the queue
    during the read and write operations.


    Semaphores are implemented using wait queues, and follow the classical semaphore
    model. Each semaphore has an associated value. Two operations (up and down) are
    implemented on the semaphore. When the value of the semaphore is zero, the process
    performing the decrement is blocked on the wait queue. Semaphore arrays are a
    contiguous set of semaphores. Each process also maintains a list of semaphore
    operations it has performed, so that if the process exits prematurely, operations
    can be undone.


    The message queue is a linear linked-list, which processes read or write a sequence
    of bytes. Messages are received in the order that they were written. Two wait
    queues are associated with the message queue, one for processes that are waiting
    for a full message queue, and another for serializing the messages writer. The
    actual size of the message is set when the message queue is created.


    Shared memory is the fastest form of IPC. This mechanism allows processes to share
    a region of memory. Creation of shared memory areas is handled by the memory management
    system. Shared pages are attached to the user virtual memory space by the system
    call sys_shmat(). A shared page can be removed from the user of a process by calling
    the sys_shmdt().


    The Unix sockets are implemented in a similar fashion to pipes, in the sense that
    they are based on a circular buffer based on a page of memory. However, sockets
    provide a separate buffer for each communication direction.


