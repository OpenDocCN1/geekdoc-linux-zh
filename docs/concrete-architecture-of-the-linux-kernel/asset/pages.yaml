    # 1.3 Background on Software Architecture


    The study of software architecture has gained recent popularity in both the industrial
    and academic community. Software architecture involves the study of large systems.
    Recent studies show that software architecture is important because it enhances
    communication among stakeholders of the system. Software architecture can be used
    to support early design decisions; it can be maintained as a transferable architecture
    of a system ([Bass 1998]).


    Software architecture is related to the study of software maintenance. Maintaining
    existing or legacy systems is often problematic. The status of these systems can
    be described in a spectrum ranging from well documented to poorly designed and
    undocumented. In many cases, some or all of the original architects and developers
    may no longer be involved with the existing system. This lack of live architecture
    knowledge tremendously complicates the software maintenance task. In order to
    change, extend, modify, or recover functionality of an existing system, the implementation
    of the system needs to be understood. This therein reinforces the need to develop
    techniques to extract architecture and design information from existing system.
    The process of extracting high-level models from the source code is often referred
    to reverse


    The discipline of reverse engineering has two main areas [Bass 1998]:


    +   1. Technical approaches: These extraction approaches derive information about
    a system based on existing artifacts. In particular, source code, comments, user
    documentation, executable modules, and systems designs are often extracted.

    2. Human inference: These approaches focus on how humans understand software.
    Typically, human investigators use the following strategies:


    +   - Top-down strategies: start at the highest level of architecture and recursively
    fill in until the sub-parts.

    - Bottom-up strategies: understand the lowest levels of components and how they
    work together to accomplish the system''s goals

    - Model-based strategies: understand the mental model of how the system works
    and tries to deepen the understanding of selected areas

    - Opportunistic strategies: use some combination of the above approaches.


    In this report, we used both the technical and human approaches to describe the
    concrete architecture of the Linux kernel. The optimistic strategy follows the
    same strategy as the hybrid approach [Tzerpos 1996]. Instead of using "live" information
    from the developers of the Linux kernel, we use our domain-specific knowledge
    of modern operating systems (i.e., the conceptual architecture from assignment
    1) to repeatedly refine the concrete architecture of the Linux kernel.


    # 1.4 Methodology/Approach


    In this report, we used the opportunistic strategy to develop the concrete architecture
    of the Linux kernel. We used a modified version of the hybrid approach of [Tzerpos
    1996] to determine the structure of the Linux kernel. The steps, which are not
    necessarily in sequential order:


    +   - Define Conceptual Architecture. Since we have no access to "live" information
    from the developers, we used our modern operating system domain knowledge to create
    the Conceptual Architecture of the Linux kernel. This step was done in Assignment
    1 ([Bowman 1998], [Siddiqi 1998], and [Tamian 1998]).

    - Extract facts from source code. We used the Portable Bookshelf C Fact Extractor
    (cf) and Fact Base Generator (figer) (described in [Holt 1997]) to extract dependency
    facts from the source code.

    - Cluster into subsystems. We used the Fact Manipulator (i.e., grok and scripts)
    to cluster factors into these subsystems. This clustering was performed partially
    by the tool'
