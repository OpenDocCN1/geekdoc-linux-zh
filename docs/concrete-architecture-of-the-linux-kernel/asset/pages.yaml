    which cannot be used directly by the underlying hardware devices. Since a neutral
    addressing scheme is used, the communication protocols can be implemented across
    a variety of hardware devices.


    The network subsystem provides its own device drivers for serial connections,
    parallel connections, and ethernet connections. An abstract interface to the various
    hardware devices is provided to hide the differences between communication mediums
    from the upper layers of the network subsystem.


    # 3.5.4 Data Structures


    The BSD socket implementation is represented by the socket structure. It contains
    a field which identifies the type of socket (streamed or datagram), and the state
    of the socket (connected or unconnected). A field that holds flags modify the
    operation of the socket, and a pointer to a structure that describes the operations
    that can be performed on the socket are also provided. A pointer to the associated
    INET socket implementation is provided, as well as a reference to inode. Each
    BSD socket is associated with an inode.


    The structure sk is used to manage individual communication packets. The buffer
    points to which socket it belongs, contains the time it was transferred, and linked
    fields so all packets associated with a given socket can be linked (a doubly linked
    list). The source and destination addresses, header information, and packet data
    are also contained within the buffer. This structure encapsulates all packets
    used by the networking system (i.g. tcp packet, udp packets, packets, etc.).


    The sock structure refers to the INET socket-specific information. Members of
    this structure include counts of read and write memory required by the socket,
    sequence numbers required by the TCP protocol, which can be set to alter the behavior
    of the socket, buffer management fields, (for example, to maintain a list of all
    packets received for the given socket), and a wait queue for blocking routines.
    A pointer to a structure that maintains a list of function pointers that handle
    protocol-specific routines, the proto structure, is also provided. The proto structure
    is rather large and complex, but essentially, it provides an abstract interface
    to the TCP and UDP protocols. The source and destination addresses, and more TCP-specific
    data fields are provided. TCP uses timers extensively to handle time-outs, etc.
    thus the sock structure contains data fields pertaining to timer operations, as
    well as function pointers which are used as callbacks for timer alerts.


    Finally, the device structure is used to define a network device driver. This
    is the same structure used to represent file system device drivers.


    # 3.5.5 Subsystem Structure'
