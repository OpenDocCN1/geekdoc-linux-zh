    \ the memory manager through access to the data structures and implementation\
    \ details of the subsystem.\n\n# 3.2.3 Subsystem Description\n\nSince Linux supports\
    \ several hardware platforms, there is a platform-specific part of the memory\
    \ manager that abstracts the details of all hardware platforms into one common\
    \ interface. Access to the hardware memory is through this abstract interface.\n\
    \nThe memory manager uses the hardware memory to map virtual addresses to physical\
    \ addresses. When a user process accesses a memory location, the hardware manager\
    \ translates this virtual memory address to a physical address, then uses the\
    \ physical address to perform the access. Because of this mapping, user processes\
    \ are not aware of what physical address is associated with a particular virtual\
