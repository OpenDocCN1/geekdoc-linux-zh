    # 2 System Structure


    The Linux Kernel is useless by itself; it participates as one layer in the overall
    system ([Bowman 1998]).


    Within the kernel layer, Linux is composed of five major subsystems: the process
    scheduler (sched), the memory manager (mm), the virtual file system (vfs), the
    network interface (net), and the inter-process communication (ipc). The as-built
    architecture decomposition is similar to the conceptual architecture decomposition
    of [Siddiqui 1998, Tanuan 1998], and [Bowman 1998]. This correspondence is not
    too surprising given that the conceptual architecture was derived from the as-built
    architecture. Our decomposition does not exactly follow the directory structure
    of the source code, as we believe that this doesn''t perfectly match the subsystem
    grouping; however, our clustering is quite close to this directory structure.


    One difference that became clear after visualizing the extracted design details
    is that the subsystem dependencies differ quite radically from the conceptual
    dependencies. The conceptual architecture suggested very few inter-system dependencies,
    as shown by Figure 1(a) (derived from [Bowman 1998]).


