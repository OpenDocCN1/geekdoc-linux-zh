    Process ID information is also kept within the task_struct. The process and group
    id are stored. An array of group id''s is provided so that a process can be associated
    with not one group.


    File process data is located in a fs_struct substructure. This will hold a pointer
    to the inode corresponding to a processes root directory, and it''s current working
    directory.


    All files opened by a process will be kept track of through a files_struct substructure
    of the task_struct.


    Finally, there are fields that hold timing information; for example, the amount
    of time process has spent in user mode.


    All executing processes have an entry in the process table. The process table
    is implemented as an array of pointers to task structures. The first entry in
    the process table is the special init process, which is the first process created
    by the Linux system.


    Finally, a module structure is implemented to represent the loaded modules. This
    structure contains fields that are used to implement a list of module structure:
    a field which points to the modules symbol table, and another field that holds
    the name of the module. The module size (in pages), and a pointer to the starting
    memory for the module are also fields within the module structure.


