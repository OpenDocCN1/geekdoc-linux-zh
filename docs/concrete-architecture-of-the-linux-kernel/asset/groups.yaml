    # Concrete Architecture of the Linux Kernel


    The following is a brief description of the low-level functioning of each IPC
    mechanism identified in 3.4.1.


    Signals are used to notify a process of an event. A signal has effect of altering
    the state of the recipient process, depending on the semantics of the particular
    signal. The kernel can send signals to any executing process. A user process may
    only send a signal to a process or group if it possesses the PID or GID. Signals
    are not handled independently for dormant processes. Before, the scheduler sets
    a process in user mode again, it checks if a signal was sent to the process. If
    so, then the scheduler calls the do_signal() function, which handles the signal
    properly.


    Wait queues are implemented using linked lists of pointers to task structures
    that control processes that are waiting for a kernel event, such as the conclusion
    of a DMA transfer. A process can enter the wait queue by calling the sleep_on()
    or interruptable_sleep() functions. Similarly, the wakes_up() and wake_interruptable()
    remove the process from the wait queue. Interrupt routines also use wait-queues
    to avoid race conditions.


    Linux allows to prevent other processes from accessing a file. This exclusion
    is based on a whole file, or a region of a file. File-locks are used to implement
    this exclusion. The file-system implementation contains appropriate data in it''s
    structures to allow the kernel to determine if a lock has been placed on a file,
    or a region inside it. In the former case, a lock attempt on a locked file will
    fail. In the latter case, an attempt to lock a region already locked will fail.
    In either case, the requesting process is not permitted to access the file since
    the lock has not been granted by the kernel.


    Pipes and named pipes have similar implementation, as their functionality is almost
    the same. The creation process is different. However, in either case a file descriptor
    is returned to the pipe. Upon creation, some memory is associated with the open
    pipe. This memory is treated like a circular buffer, to write operations are atomic.
    When the buffer is full, the writing processes block. If a request is made for
    more data than is available, the reading processes block. Thus, each pipe has
    a wait queue associated with it. Processes are added and removed from the queue
    during the read and write operations.


    Semaphores are implemented using wait queues, and follow the classical semaphore
    model. Each semaphore has an associated value. Two operations (up and down) are
    implemented on the semaphore. When the value of the semaphore is zero, the process
    performing the decrement is blocked on the wait queue. Semaphore arrays are a
    contiguous set of semaphores. Each process also maintains a list of semaphore
    operations it has performed, so that if the process exits prematurely, operations
    can be undone.


    The message queue is a linear linked-list, which processes read or write a sequence
    of bytes. Messages are received in the order that they were written. Two wait
    queues are associated with the message queue, one for processes that are waiting
    for a full message queue, and another for serializing the messages writer. The
    actual size of the message is set when the message queue is created.


    Shared memory is the fastest form of IPC. This mechanism allows processes to share
    a region of memory. Creation of shared memory areas is handled by the memory management
    system. Shared pages are attached to the user virtual memory space by the system
    call sys_shmat(). A shared page can be removed from the user of a process by calling
    the sys_shmdt().


    The Unix sockets are implemented in a similar fashion to pipes, in the sense that
    they are based on a circular buffer based on a page of memory. However, sockets
    provide a separate buffer for each communication direction.


    # 3.4.4 Data Structures


    In this section, the important data structures need to implement the IPC mechanisms
    are described.


    Signals are implemented through the signal field in the task_struct structure.
    Each signal is represented by a bit in this field. Thus, the number of signals
    a version of Linux can support is limited to the number of bits in a word. The
    field block holds the signals that are being blocked by a process.


    There is only one data structure associated with the wait queues, the wait_queue
    structure. These structures contain a pointer to the associated task_struct, and
    are linked into a list.


    File locks have an associated file, lock_structure. This structure contains a
    pointer to a task_struct for the owning process, the file descriptor of the locked
    file, a wait queue for processes which are waiting for the cancellation of the
    file lock, and which region of the file is locked. The file_lock_structures are
    linked into a list for each open file.


    Pipes, both nameless and named, are represented by a file system inode. This inode
    stores extra pipe-specific information in the pipe_inode_info structure. This
    structure contains a wait queue for processes which are blocking on a read or
    write, a pointer to the memory used as the circular buffer for the pipe, the amount
    of data in the pipe, and the number of processes which are currently reading and
    writing from/to pipe.


    All V IPC objects are created in the kernel, and each have associated access permissions.
    These access permissions are held in the ipc_perm_structure. Semaphores are represented
    with the value of the semaphore and the pid of the process that performed the
    last operation on the semaphore. Semaphore arrays are represented by the semid_ds
    structure, which holds the access permissions, the time of the last operation,
    a pointer to the first semaphore in the array, and queues which processes block
    performing semaphore operations. The structure sem_undo is used to create a list
    of semaphore operations performed by an array, so that they can all be undone
    when the process is killed.


    Message queues are based on the msgid_ds structure, which holds management and
    control information. This structure stores the following fields:


    - access permissions

    - link fields to implement the message queue (i.e. pointers to msgid_ds)

    - times for the last send, receipt and change

    - queues on which processes block, as described in the previous section

    - the current number of bytes in the queue

    - the number of messages

    - size of the queue (in bytes)

    - the process number of the last sender

    - the process number of the last receiver.


    A message is stored in the kernel with a msg structure. This structure holds a
    link field, to implement a list of messages, the type of message, the address
    of the message data, and the length of the message.


    The shared memory implementation is based on the shmid_ds structure, which, like
    the msgid_ds structure, holds management and control information. The structure
    contains access control permissions, attach, detach and change times, pid of the
    creator and last call to an operation for the shared segment, number of processes
    to which the shared memory region is attached to, the number of pages which make
    up the shared memory region, and a field for page table entries.


    The Unix domains sockets are based on the socket data structure, described in
    the Network Interface section (3.5).


    # 3.4.5 Subsystem Structure


    img/4e15c97e21a8f49742cf467593ac4c6a_25_0.png


    Figure 8: IPC Subsystem Structure


    Figure 8 shows the IPC subsystem resource dependencies. Control flows from the
    system call layer down into each module. The System V IPC facilities are implemented
    in the ipc directory of the kernel source. The kernel IPC module refers to IPC
    facilities implemented within the kernel directory. Similar conventions hold for
    the File and Net IPC facilities.


    The System V IPC module is dependant on the Kernel IPC mechanism. In particular,
    semaphores are implemented with wait queues. All other IPC facilities are implemented
    independently of each other.


    # 3.4.6 Subsystem Dependencies

