    # Linux 内核的具体架构


    以下是对 3.4.1 中识别的每个 IPC 机制底层运行机制的简要描述。


    信号（Signals）用于通知进程发生事件。根据特定信号的语义，信号具有改变接收进程状态的作用。内核可以向任何执行中的进程发送信号。用户进程只有在拥有 PID
    或 GID 的情况下才能向某个进程或进程组发送信号。信号不会对休眠进程进行独立处理。在调度器再次将进程置于用户模式之前，它会检查是否向该进程发送了信号。如果是，调度器将调用
    `do_signal()` 函数妥善处理该信号。


    等待队列（Wait queues）使用指向任务结构的指针链表实现，这些结构控制着等待内核事件（例如 DMA 传输完成）的进程。进程可以通过调用 `sleep_on()`
    或 `interruptable_sleep()` 函数进入等待队列。同样，`wakes_up()` 和 `wake_interruptable()` 将进程从等待队列中移除。中断程序也使用等待队列来避免竞态条件。


    Linux 允许防止其他进程访问文件。这种排除基于整个文件或文件的某个区域。文件锁（File-locks）用于实现这种排除。文件系统实现在其结构中包含适当的数据，允许内核确定是否已对文件或其内部的区域加了锁。在一种情况下，对已锁文件的锁定尝试将失败；在后的情况下，尝试锁定已锁定的区域将失败。无论何种情况，由于内核未授予锁，请求进程都不被允许访问该文件。


    管道（Pipes）和命名管道（named pipes）具有类似的实现，因为它们的功能几乎相同。它们的创建过程是不同的。然而，在任何情况下，都会返回一个文件描述符给管道。创建后，某些内存会与打开的管道关联。这些内存被视为环形缓冲区，写操作是原子的。当缓冲区满时，写入进程会被阻塞。如果请求的数据多于可用数据，读取进程会被阻塞。因此，每个管道都关联有一个等待队列。在读写操作期间，进程会被添加到队列或从中移除。


    信号量（Semaphores）使用等待队列实现，并遵循经典的信号量模型。每个信号量都有关联的值。信号量上实现了两个操作（加和减）。当信号量的值为零时，执行减操作的进程将被阻塞在等待队列上。信号量数组是信号量的连续集合。每个进程还维护一个其已执行的信号量操作列表，以便在进程提前退出时可以撤销这些操作。


    消息队列（The message queue）是一个线性链表，进程在其中读取或写入字节序列。消息按照写入的顺序被接收。消息队列关联有两个等待队列：一个用于等待完整消息队列的进程，另一个用于序列化消息写入者。消息的实际大小在创建消息队列时设置。


    共享内存（Shared memory）是最快的 IPC 形式。这种机制允许进程共享一段内存。共享内存区域的创建由内存管理系统处理。共享页通过系统调用 `sys_shmat()`
    挂载到用户虚拟内存空间。可以通过调用 `sys_shmdt()` 从进程的用户内存空间中移除共享页。


    Unix 套接字（Unix sockets）的实现方式与管道类似，即它们是基于内存页的环形缓冲区。然而，套接字为每个通信方向提供了单独的缓冲区。


    # 3.4.4 数据结构


    在本节中，描述了实现 IPC 机制的重要数据结构。


    信号通过 `task_struct` 结构中的 `signal` 字段实现。每个信号由该字段中的一个位表示。因此，一个 Linux 版本能支持的信号数量限于字字的位数。该字段块持有被进程阻塞的信号。


    与等待队列仅关联一个数据结构，即 `wait_queue` 结构。这些结构包含一个指向关联的 `task_struct` 的指针，并链接成一个列表。


    文件锁有一个关联的文件结构 `lock_structure`。该结构包含一个指向所有者进程的 `task_struct` 指针、被锁文件的文件描述符、一个用于等待文件锁取消的进程的等待队列，以及被锁定的文件区域。对于每个打开的文件，`file_lock_structures`
    会被链接成一个列表。


    管道（无论是无名的还是命名的）都由文件系统索引节点（inode）表示。该节点在 `pipe_inode_info` 结构中存储了额外的管道特定信息。该结构包含一个用于在读或写上阻塞的进程的等待队列、一个指向用作管道环形缓冲区内存的指针、管道中的数据量，以及当前从管道读取或向管道写入的进程数量。


    所有 V IPC 对象都是在内核中创建的，且每个对象都有关联的访问权限。这些访问权限存在 `ipc_perm_structure` 中。信号量用信号量的值以及对该信号量执行最后操作的进程
    PID 表示。信号量数组由 `semid_ds` 结构表示，它持有访问权限、最后操作时间、指向数组中第一个信号量的指针，以及进程在执行信号量操作时阻塞的队列。`sem_undo`
    结构用于创建一个数组执行的信号量操作列表，以便在进程被杀死时可以全部撤销。


    消息队列基于 `msgid_ds` 结构，该结构持有管理和控制信息。该结构存储了以下字段：


    - 访问权限

    - 实现消息队列的链接字段（指向 `msgid_ds` 的指针）

    - 最后发送、接收和更改的时间

    - 进程在上面阻塞的队列（如前一节所述）

    - 队列中当前的字节数

    - 消息数量

    - 队列大小（字节）

    - 上一个发送者的进程号

    - 上一个接收者的进程号。


    消息以 `msg` 结构存储在内核中。该结构持有一个用于实现消息列表的链接字段、消息类型、消息数据的地址以及消息长度。


    共享内存实现基于 `shmid_ds` 结构，它与 `msgid_ds` 结构一样持有管理和控制信息。该结构包含访问控制权限、挂载、卸载和更改时间、共享段创建者的
    PID 以及最后一次操作的 PID、挂载到共享内存区域的进程数量、组成共享内存区域的页数，以及一个页表项的字段。


    Unix 域套接字（Unix domains sockets）基于网络接口部分（3.5）中描述的 `socket` 数据结构。


    # 3.4.5 子系统结构


    img/4e15c97e21a8f49742cf467593ac4c6a_25_0.png


    图 8：IPC 子系统结构


    图 8 显示了 IPC 子系统的资源依赖。控制流从系统调用层向下进入每个模块。System V IPC 实现在内核源码的 `ipc` 目录。内核 IPC 模块引用内核目录内实现的
    IPC 设施。文件 IPC 和网络 IPC 设施遵循类似的约定。


    System V IPC 模块依赖于内核 IPC 机制。特别是信号量是使用等待队列实现的。所有其他 IPC 设施都是相互独立实现的。


    # 3.4.6 子系统依赖


