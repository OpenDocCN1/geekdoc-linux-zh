    # Concrete Architecture of the Linux Kernel


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_26_0.png)


    Figure 9: IPC Subsystem Dependencies


    Figure 9 shows the resource dependencies between the IPC subsystem and other kernel
    subsystems.


    The IPC subsystem depends on the file system for sockets. Sockets use file descriptors,
    and once they are opened, they are assigned to an inode. Memory management depends
    on IPC as the page swapping routine calls the IPC subsystem to perform swapping
    of shared memory. IPC depends on memory management primarily for the allocation
    of buffers and the implementation of shared memory.


    Some IPC mechanisms use timers, which are implemented in the process scheduler
    subsystem. Process scheduling relies on signals. For these two reasons, the IPC
    and Process Scheduler modules depend on each other. For more details about the
    dependencies between the IPC subsystem modules and other kernel subsystems, see
    [PBS].


    ## 3.5 Network Interface


    ### 3.5.1 Goals


    The Linux network system provides network connectivity between machines, and a
    socket communication model. Two types of socket implementations are provided:
    BSD sockets and INET sockets. BSD sockets are implemented using INET sockets.


    The Linux network system provides two transport protocols with differing communication
    models and quality of service. These are the unreliable, message-based UDP protocol
    and the reliable, streamed TCP protocol. These are implemented on top of the IP
    networking protocol. The INET sockets are implemented on top of transport protocols
    and the IP protocol.


    Finally, the IP protocol sits on top of the underlying device drivers. Device
    drivers are provided for three different types of connections: serial lines (SLIP),
    parallel line connections (PLIP), and ethernet connections. An address resolution
    protocol mediates between the IP and ethernet drivers. The address resolver''s
    role is to translate between the logical IP addresses and the physical ethernet
    addresses.


    ### 3.5.2 External Interface


    The network services are used by other systems and the user through the socket
    interface. Sockets are created and manipulated through the socketcall() system
    call. Data is sent and received using read() and write() calls on the socket descriptor.


    No other network mechanism/functionality is exported from the network subsystem.


    ### 3.5.3 Subsystem Description


    The BSD socket model is presented to the user processes. The model is that of
    a connection-oriented, streamed and buffered communication service. The BSD socket
    is implemented on top of the INET socket model.


    The BSD socket model handles tasks similar to that of the VFS, and manages a general
    data structure for socket connections. The purpose of the BSD socket model is
    to provide greater portability by abstracting communication to a common interface.
    The BSD interface is widely used in modern operating systems such as Unix and
    Microsoft Windows. The INET socket model manages the actual communication endpoint
    for the IP-based protocols TCP and UDP.


    Network I/O begins with a read or write to a socket. This invokes a read/write
    system call, which is handled by a component of the virtual file system, the chain
    of read/write calls down the network layers are symmetric, thus from one point
    forward, only writes are considered). From there, it is determined that the BSD
    socket sock_write() implements the actual file system write call; thus, it is
    called. This routine handles administrative details, and control is passed to
    inet_write() function. This turns a transport layer write call (via tcp_write()).


    The transport layer routines are responsible for splitting the incoming data into
    transport packets. These routines pass control to the ip_build_header() routine,
    which builds an ip header to be inserted into the packet and, then tcp_build_header()
    is called to build a tcp header. Once this is done, the device drivers are used
    to actually send the data.


    The network system provides two transport services, each with a different communication
    model and quality of service. UDP provides a connectionless, unreliable data transmission
    service. It is responsible for receiving packets from the IP layer, and finding
    the destination to which the packet should be sent. If the destination is not
    present, an error is reported. Otherwise, if there is sufficient buffer memory,
    the packet data is entered into a list of packets received for a socket. Any sockets
    on a read operation are notified, and awakened.


    The TCP protocol offers a much more complex scheme. In addition to handling data
    transfer between sending and receiving processes, the TCP protocol also performs
    complicated connection management. TCP sends data up to the socket layer, rather
    than as a sequence of packets, and guarantees a reliable transport.


    The IP protocol provides a packet transfer service. Given a packet, and a destination
    of the packet, the IP communication layer is responsible for the routing of the
    packet to the correct host. For an outgoing data stream, the IP is responsible
    for the following:


    - partitioning the stream into IP packets

    - routing the packets into the destination address

    - generating a header to be used by the hardware device drivers

    - selecting the appropriate network device to send out on


    For an incoming packet stream, the IP must do the following:


    - check the header for validity

    - compare the destination address with the local address and forwarding it along
    if the packet is not at its correct destination

    - defr the IP packet

    - send the packets to the TCP or UDP layer to be further processed.


    The ARP (address resolution protocol) is responsible for resolving between the
    IP and the real hardware address. The ARP supports a variety of hardware devices
    such as ethernet, FDDI. This function is necessary as deal with IP addresses,
    which cannot be used directly by the underlying hardware devices. Since a neutral
    addressing scheme is used, the communication protocols can be implemented across
    a variety of hardware devices.


    The network subsystem provides its own device drivers for serial connections,
    parallel connections, and ethernet connections. An abstract interface to the various
    hardware devices is provided to hide the differences between mediums from the
    upper layers.


    ### 3.5.4 Data Structures


    The BSD socket implementation is represented by the socket structure. It contains
    a field which identifies the type of socket (streamed or datagram), and the state
    of the socket (connected or unconnected). A field that holds flags modify the
    operation of the socket, and a pointer to a structure that describes the operations
    that can be performed on the socket are also provided. A pointer to the associated
    INET socket implementation is provided, as well as reference to inode. Each BSD
    socket is associated with an inode.


    The structure sk is used to manage individual communication packets. The buffer
    points to which socket it belongs, contains the time it was transferred, and linked
    fields so all packets associated with a given socket can be linked (a doubly linked
    list). The source and destination addresses, header information, and packet data
    are also contained within the buffer. This structure encapsulates all packets
    used by the networking system (i.g. tcp packet, udp packets, packets, etc.).


    The sock structure refers to the INET socket-specific information. Members of
    this structure include counts of read and write memory required by the socket,
    sequence numbers required by the TCP protocol, which can be set to alter the behavior
    of the socket, buffer management fields, (for example, to maintain a list of all
    packets received for the given socket), and a wait queue for blocking routines.
    A pointer to a structure that maintains a list of function pointers that handle
    protocol-specific routines, the proto structure, is also provided. The proto structure
    is rather large and complex, but essentially, it provides an abstract interface
    to the TCP and UDP protocols. The source and destination addresses, and more TCP-specific
    data fields are provided. TCP uses timers extensively to handle time-outs, etc.
    thus the sock structure contains data fields pertaining to timer operations, as
    well as function pointers which are used as callbacks for timer alerts.


    Finally, the device structure is used to define a network device driver. This
    is the same structure used to represent file system device drivers.


