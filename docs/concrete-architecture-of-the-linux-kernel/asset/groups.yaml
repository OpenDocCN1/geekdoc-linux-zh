    ![](img/4e15c97e21a8f49742cf467593ac4c6a_29_0.png)


    # Linux 内核的具体架构


    图 10：网络子系统结构


    通用网络层包含为用户进程提供最高层接口的模块。这本质上是 BSD socket 接口，以及网络层支持的协议定义。这里包含了 802.x、ip、ipx 和 AppleTalk
    的 MAC 协议。


    核心部分对应于高层实现设施，如 INET sockets、对防火墙的支持、网络设备驱动程序接口，以及用于数据报和 TCP 传输服务的设施。


    系统调用与 BSD socket 接口进行交互。BSD socket 层为 socket 通信提供了通用的抽象，该抽象是使用 INET sockets 实现的。


    协议模块（Protocol modules）包含了获取用户数据并按照特定协议的要求进行格式化的代码。协议最终将数据发送到合适的硬件设备，因此网络协议模块与网络设备模块之间存在依赖关系。


    网络设备模块包含特定于设备类型的常规程序。实际的设备驱动位于 `drivers/net` 目录下的普通设备驱动程序中。


    ## 3.5.6 子系统依赖


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_30_0.png)


    图 11：网络子系统依赖


    图 11 显示了网络子系统与其他子系统的依赖关系。


    网络子系统依赖内存管理系统提供缓冲区。文件系统用于为 socket 提供节点接口。文件系统使用网络系统来实现 NFS。网络子系统使用内核守护进程，因此依赖
    IPC。网络子系统使用进程调度器处理定时功能并在执行网络传输时挂起进程。关于网络子系统模块与其他内核子系统之间特定依赖关系的更多细节，请参阅 [FBS]。


    # 4 发现


    总结，我们审查了现有文档，提取了源文件，将模块聚类为子系统，并利用关于现代操作系统的领域知识对这些类进行了细化。我们发现内核架构与我们之前形成的概念架构不匹配。最初提取的结构由于提取工具的局限性显示出依赖缺失。在手动验证依赖关系后，我们发现所有缺失都是由这些工具造成的。另一方面，最终的内核架构显示出几个概念架构中未考虑到的依赖。这些依赖源于设计决策，例如将
    IPC 系统与某些内存交换功能分离开。这些意外的依赖关系，或者如 [Murphy 1995] 中描述的差异，可能表明概念架构没有被正确呈现，或者内核架构没有使用适当的聚类机制。然而，我们认为这些差异是
    Linux 开发者忽略架构考量导致的结果。


    我们审查了 Linux 内核的文档。存在大量的系统文档，如 [Rushing 1997] 所示。甚至有一些随源码一起提供的文档。然而，这些文档的抽象程度太高，无法作为具体的架构使用。


    我们使用 csv 工具从 Linux 内核中提取设计信息。csv 提取器生成了十万个事实，这些事实通过 `grep` 合并为一百个源模块之间的几千个依赖关系。在检查了事实提取器的输出后，我们注意到有两个同名问题。首先，某些依赖关系没有被检测到。它们在隐式调用的情况下尤为常见。在隐式调用的情况下，一个子系统向另一个子系统注册其能力；由于架构是通过函数指针注册的，csv
    工具无法检测到这些依赖。其次，csv 报告了不存在的依赖关系。一个例子发生在 IPC 子系统中。IPC 子系统中的三个源模块具有同名的函数 (`findkey`)。由于
    csv 工具使用名称等效性，它报告这三个模块相互依赖，但手动验证显示并非如此。


    除了 csv 工具引入的产物外，我们还因为假设每个源模块 (`*.h`) 都有一个关联的头文件而遇到了一些问题。这在内核中通常是真实的，但有些头文件是在许多源模块中被实现的。例如，`mm.h`
    在内存管理器子系统的多个模块中被实现。由于所有对函数的调用都抽象到声明该函数的头文件中，我们很难将模块分离到不同的子系统中。所有的源模块都依赖于 `mm.h`，而不是实现所用资源的特定源模块。这可以通过调整
    `grep` 脚本来修正；也许某种能够识别如 `mm.h` 等头文件特殊性质的组合将是最好的。


    由于存在问题（遗漏的、虚假的和位置错误的依赖关系），我们手动验证了提取的事实，发现它们与我们的预期不符。遗憾的是，源代码的量以及我们对 Linux 的相对经验意味着，我们提取的依赖关系不能被视为完全准确。


    ## 4.1.1 未来工作


    应该调整 PBS 工具以处理 Linux 源码结构。我们提出的概念和具体架构应该通过与 Linux 开发者社区的讨论进行细化。细化后，可以使用反射模型 [Murphy
    1995] 对这两个模型进行比较。


    # 5 定义：


    - **BSD 系统**：加州伯克利分校计算机系统研究小组开发的基于 AT&T Unix 的 版本。

    - **设备文件**：文件系统中代表物理设备的文件。读取或写入此文件将直接访问物理设备。除了字符模式设备外，这些文件很少直接使用。

    - **fs**：Linux 内核的文件系统子系统。

    - **中断延迟**：从中断报告给 CPU 到处理之间的时间。如果中断延迟过大，高速外设将失败，因为在下一次中断触发之前没有处理（读取 CSR 数据）。随后的中断会覆盖
    CSR 中的数据。

    - **IPC**：进程间通信。Linux 支持信号、管道以及以它们首次出现的 Unix 版本命名的 System IPC 机制，

    - **内核线程 (守护进程)**：内核线程是在内核模式下运行的进程。这些进程是内核的一部分，因为它们可以访问内核的所有数据结构和函数，但被视为可以挂起和恢复的独立进程。内核线程没有虚拟内存，而是访问内核其余部分相同的物理内存。

    - **逻辑文件系统**：将数据块呈现为文件和目录的系统；这些文件和目录存储逻辑文件系统的特定属性，如权限、访问和修改以及计数信息。

    - **mm**：Linux 内核的内存管理子系统。

    - **挂载点**：虚拟文件系统中挂载逻辑文件系统的目录。挂载逻辑文件系统上的所有文件都显示为挂载点的子目录。根文件系统挂载在 `/`，

    - **Net**：Linux 内核的网络接口子系统。

    - **反向工程**：从源码中提取高层模型的过程。

    - **Sched**：Linux 内核的进程调度器子系统。

    - **架构**：系统的结构，由软件组件、组件的外部可见属性以及它们之间的关系组成。

    - **System V**：由 AT&T 实验室开发的 Unix 版本。

    - **Unix**：最初于 20 世纪 70 年代在 AT&T 实验室设计的操作系统。


    '
