    ![](img/4e15c97e21a8f49742cf467593ac4c6a_29_0.png)


    # Concrete Architecture of the Linux Kernel


    Figure 10: Network Subsystem Structure


    The General Network contains those modules that provide the highest level interface
    to user processes. This is essentially the BSD socket interface, as well as a
    definition of the protocols supported by the network layer. Included here are
    the MAC protocols of 802.x, ip, ipx, and AppleTalk.


    The cores correspond to high-level implementation facilities, as INET sockets,
    support for firewalls, a network device driver interface, and facilities for datagram
    and TCP transport services.


    The system call interfaces with the BSD socket interface. The BSD socket layer
    provides a general abstraction for socket communication, and this abstraction
    is implemented using the INET sockets.


    The Protocol modules contain the code that takes user data and formats them as
    required by a particular protocol. The protocol finally sends the data to the
    proper hardware device, hence the dependency between the Network Protocols and
    Network Devices modules.


    The Network devices modules contain high-level device-type specific routines.
    The actual device drivers reside with the regular device drivers under the directory
    drivers/net.


    ## 3.5.6 Subsystem Dependencies


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_30_0.png)


    Figure 11: Network Subsystem Dependencies


    Figure 11 shows the dependencies between the networking subsystem and other subsystems.


    The network subsystem depends on the Memory Management system for buffers. The
    File system is used to provide an node interface to sockets. The file system uses
    the network system to implement NFS. The network subsystem uses the kernel daemon,
    and thus depends on IPC. The network subsystem uses the Process Scheduler for
    timer functions and to suspend processes while network transmissions are executed.
    For more details about the specific dependencies between the network subsystem
    modules and other kernel subsystems, see [FBS].


    # 4 Findings


    In summary, we reviewed existing documentation, extracted source files, clustered
    modules into subsystems, and refined these clusters using domain knowledge about
    modern operating systems. We found that the kernel architecture did not match
    the conceptual architecture we formed earlier. The initial extracted structure
    showed missing dependencies due to limitations in the extraction tool. After manually
    verifying the dependencies, we found that all absences were caused by these tools.
    On the other hand, the final kernel architecture exhibited several dependencies
    that were not accounted for in the conceptual architecture. These dependencies
    were due to design decisions such as having the IPC system from some the memory
    swapping functions. These unexpected dependencies, or divergences as described
    in [Murphy 1995], could indicate that the conceptual architecture was not properly
    presented, or that the kernel architecture didn''t use an appropriate clustering
    mechanism. However, we believe that these divergences are the result of the Linux
    developers ignoring architectural considerations.


    We reviewed the documentation for the Linux kernel. There is a large quantity
    of system documentation, as in [Rushing 1997]. There were even some documentation
    available with the source code. however, this documentation was too high level
    to serve as a concrete architecture.


    We used the csv tool to extract design information from the Linux kernel. The
    csv extractor produced one hundred thousand facts, which were combined using grep
    into few thousand dependencies between one hundred source modules. After examining
    the output of the fact extractor, we noticed that there were two problems with
    the same name. First, some dependencies were not detected. They occurred particular
    in the case of implicit invocation. In the implicit invocation case, a subsystem
    registers its capabilities with another subsystem; since the architecture is registered
    through function pointers, the csv tool was not able to detect these dependencies.
    Secondly, the csv reported dependencies that did not exist. One example of this
    occurred in the IPC subsystem. Three source modules in the IPC subsystem have
    a function (findkey) that has the same name. Since the csv tool uses a name-equivalence,
    it reported that three modules depended on each other when a manual verification
    showed did not.


    In addition to the artifacts introduced by the csv tool, we encountered some problems
    because of the assumption that each source module (*.h) has an associated header
    file. This is generally true in the kernel, but there are some header files that
    are implemented in many source modules. For example, mm.h is implemented in several
    modules in the memory manager subsystem. Since all calls to functions are abstracted
    to the header file where the function is declared, we had had difficulty separating
    modules into subsystems. All of the source modules were depending on mm.h rather
    than the specific source module that implemented the resources being used. This
    could be corrected by adjusting the grep scripts; perhaps some combination that
    recognized the special nature of header files such as mm.h would be best.


    Because of problems (missed, spurious, and misplaced dependencies), we manually
    verified the extracted facts that they differed from our expectations. Unfortunately,
    the volume of source code and our relative experience with Linux means that our
    extracted dependencies cannot be viewed as completely accurate.


    ## 4.1.1 Future Work


    The PBS tools should be adjusted to handle the Linux source structure. The conceptual
    and concrete architectures we have presented should be refined through discussions
    with the Linux developer community. After refinement, the two models can be compared
    using the Reflection model [Murphy 1995].


    # 5 Definitions:


    - **BSD Berkeley System** A version of Unix based on the AT&T System Unix developed
    by the Computer System Research Group of the University of California at Berkeley.

    - **device file:** a file on the file system that represents a physical device.
    Reading or writing to this file will result in direct access to the physical device.
    These files are rarely used directly, with the exception of character mode devices.

    - **fs:** the file system subsystem of the Linux kernel

    - **interrupt latency:** the time between when an interrupt is reported to the
    CPU and the time it is handled. If interrupt latency is too large, high-speed
    peripherals will fail because their interrupts are not processed (reading data
    from CSR''s) before the next interrupt is asserted. The subsequent interrupt overwrites
    the data in the CSR''s.

    - **IPC:** Inter-process Communication. Linux supports signals, pipes and the
    System V IPC mechanisms named after the Unix release which they first appeared,

    - **kernel thread (daemon):** a kernel thread is a process that runs in kernel
    mode. These processes are properly part of the kernel since they have access to
    all of the kernel''s data structures and functions, but they are treated as separate
    processes that can be suspended and resumed. Kernel threads do not have virtual
    memory, but access the same physical memory that the rest of the kernel does.

    - **logical file system:** a system that presents blocks of data as files and
    directories; these files and directories store attributes that are specific to
    the logical file system, but can include permissions, access and modification,
    and other accounting information.

    - **mm:** the memory management subsystem of the Linux kernel

    - **mount point:** the directory within the virtual file system where a logical
    file system is mounted. All files on the mounted logical file system appear as
    subdirectories of the mount point. The root file system is mounted at ''/'',

    - **Net:** the network interface subsystem of the Linux kernel

    - **Reverse Engineering:** the process of extracting high-level models from the
    source code.

    - **Sched:** the process scheduler subsystem of the Linux kernel

    - **Architecture:** the structure(s) of the system, which comprise software components,
    the externally visible properties of those components, and the relationships among
    them.

    - **System V:** a version of Unix developed by the Bell Laboratories of AT&T.

    - **Unix:** an operating system originally designed at the Bell Laboratories of
    AT&T in the 1970s

