    Upon termination, a user process (implicitly or explicitly) calls the _exit()
    system call.


    Several routines are provided to handle loadable modules. A create_module() system
    call will allocate enough memory to load a module. The call will initialize the
    module structure, described below, with the name, size, starting address, and
    initial status of the allocated module. The init_module() system call loads the
    module from disk and'
  - '[PAGE 9]


    # Concrete Architecture of the Linux Kernel


    activates it. Finally, delete_module() unloads a module.


    Timer management can be done through the settimer() and gettimer() routines. The
    former sets a timer while the latter gets a timer''s value.


    Among the most important functions is signal(). This routine allows a user process
    to associate a function handler with a particular signal.


    # 3.1.3 Subsystem Description


    The process scheduler is primarily responsible for the loading, execution, and
    proper termination of user processes. The scheduling algorithm is called at two
    different points during the execution of a user process. First, there are system
    calls that call the scheduler directly, such as sleep(). Second, after every system
    call, and after every system interrupt (described in a moment), the schedule algorithm
    is called.


    Signals can be considered an IPC mechanism, thus are discussed in the inter-process
    communication section.


    Interrupts allow hardware to communicate with the operating system. Linux distinguishes
    between slow and fast interrupts. A slow interrupt is a typical interrupt. Other
    interrupts are legal while they are being processed, and once processing has a
    slow interrupt, Linux conducts business as usual, such as calling the scheduler
    algorithm. A timer interrupt is exemplary of a slow interrupt. A fast interrupt
    is one that is used for more complex tasks, such as processing keyboard input.
    Other interrupts are disabled as they are being processed, explicitly enabled
    by the fast interrupt handler.


    The Linux OS uses a timer interrupt to fire off every 10ms. Thus, according to
    our scheduler description given above, task rescheduling should occur at lease
    once every 10ms.


    # 3.1.4 Data Structures


    The structure task_struct represents a Linux task. There is a field that represents
    the process state; this may have the following values:


    +   - running

    - returning from system call

    - processing an interrupt routine

    - processing a system call

    - ready

    - waiting


    In addition, there is a field that indicates the processes priority, and field
    which holds the number of clock ticks (10ms intervals) which the process can continue
    executing without forced rescheduling. There is also a field that holds the error
    number of the last failing system call.


    In order to keep track of all executing processes, a doubly linked list is maintained,
    (through two fields that point to task, struct). Since every process is related
    to some other process, there are fields which describe a process: original parent,
    parent, youngest child, younger sibling, and finally order sibling.


    There is a nested structure, mm_struct, which contains a process’s memory management
    information, (such as start and end address of the code segment).'
- md: "\n## Concrete Architecture of the Linux Kernel\n\nProcess ID information is\
    \ also kept within the task_struct. The process and group id are stored. An array\
    \ of group id's is provided so that a process can be associated with not one group.\n\
    \nFile process data is located in a fs_struct substructure. This will hold a pointer\
    \ to the inode corresponding to a processes root directory, and it's current working\
    \ directory.\n\nAll files opened by a process will be kept track of through a\
    \ files_struct substructure of the task_struct.\n\nFinally, there are fields that\
    \ hold timing information; for example, the amount of time process has spent in\
    \ user mode.\n\nAll executing processes have an entry in the process table. The\
    \ process table is implemented as an array of pointers to task structures. The\
    \ first entry in the process table is the special init process, which is the first\
    \ process created by the Linux system.\n\nFinally, a module structure is implemented\
    \ to represent the loaded modules. This structure contains fields that are used\
    \ to implement a list of module structure: a field which points to the modules\
    \ symbol table, and another field that holds the name of the module. The module\
    \ size (in pages), and a pointer to the starting memory for the module are also\
    \ fields within the module structure.\n\n### 3.1.5 Subsystem Structure\n\n![](img/4e15c97e21a8f49742cf467593ac4c6a_10_0.png)\n\
    \nFigure 2 shows the Process Scheduler subsystem. It is used to represent, collectively,\
    \ process scheduling and management (i.e. loading and unloading), as well as timer\
    \ management and module management functionality.\n\n### 3.1.6 Subsystem Dependencies\n\
    \n![](img/4e15c97e21a8f49742cf467593ac4c6a_11_0.png)\n\nFigure 3 shows how the\
    \ process scheduler depends on other kernel systems. The process scheduler requires\
    \ the memory manager to set up the memory mapping when a process is scheduled.\
    \ Further, the process scheduler depends on the IPC subsystem for the semaphore\
    \ queues that are used in bottom-half-handing (discussed in Section 3.3). Finally,\
    \ the process scheduler depends on the file system to load loadable modules from\
    \ the persistent device. All subsystems depend on the process scheduler, since\
    \ they need to suspend user processes while hardware operations complete. For\
    \ more details about the specific dependencies between subsystem modules, please\
    \ see [PBS].\n\n### 3.2 Memory Manager\n\n### 3.2.1 Goals\n\nAs discussed in [Ruling\
    \ 1997] pp 13-30, the memory manager provides the following capabilities to its\
    \ clients:\n\n- Large address space - user programs can reference memory than\
    \ physically exists\n- Protection - the memory for a process is private and cannot\
    \ be read or modified by another process; also, the memory manager prevents processes\
    \ from overwriting code and read-only-data.\n- Memory Mapping - clients can map\
    \ a file into an area of virtual memory and access the file as memory\n- Fair\
    \ Access to Physical Memory - the memory manager ensures that processes have fair\
    \ access to the machine's memory resources, ensuring reasonable performance\n\
    - Shared Memory - the memory manager allows processes to share some portion of\
    \ their memory. For example, executable code is usually shared amongst processes.\n\
    \n### 3.2.2 External Interface\n\nThe memory manager provides two interfaces to\
    \ its functionality: a system-call interface that is used by user processes, and\
    \ an interface that is used by other kernel subsystems to accomplish their tasks.\n\
    \n- **System Call Interface**\n  - malloc() / free - allocate or free a region\
    \ of memory for the process's use\n  - mmap() / munmap() / msync() / mremap -\
    \ map files into virtual memory regions\n  - mprotect - change the protection\
    \ on a region of virtual memory\n  - mlock() / mlock() / munlock() / nullock()\
    \ - super-user routines to prevent memory from being swapped\n  - swapin() / swapoff()\
    \ - super-user routines to add and remove swap files for the system\n\n- **Intra-Kernel\
    \ Interface**\n  - kmalloc() / kfree() - allocate and free memory for use by the\
    \ kernel's data structures\n  - verify_area() - verify that a region of user memory\
    \ is mapped with required permissions\n  - get_free_page() / free_page() - allocate\
    \ and free physical memory pages\n\nIn addition to the above, the memory manager\
    \ makes access to all its data structures and most of its routines within the\
    \ kernel. Many kernel modules interface with the memory manager through access\
    \ to the data structures and implementation details of the subsystem.\n\n### 3.2.3\
    \ Subsystem Description\n\nSince Linux supports several hardware platforms, there\
    \ is a platform-specific part of the memory manager that abstracts the details\
    \ of all hardware platforms into one common interface. Access to the hardware\
    \ memory is through this abstract interface.\n\nThe memory manager uses the hardware\
    \ memory to map virtual addresses to physical addresses. When a user process accesses\
    \ a memory location, the hardware manager translates this virtual memory address\
    \ to a physical address, then uses the physical address to perform the access.\
    \ Because of this mapping, user processes are not aware of what physical address\
    \ is associated with a particular virtual memory address. This allows the memory\
    \ manager subsystem to move the process's memory around in physical memory. In\
    \ addition, mapping permits two user processes to share physical memory if their\
    \ virtual memory address space map to the same physical address space.\n\nIn addition,\
    \ the memory manager swaps process out to a page file when it is not use. The\
    \ memory manager contains a daemon (kswapd). Linux uses the daemon to refer to\
    \ kernel threads; a daemon is scheduled by the process scheduler in the same way\
    \ that user processes.\n\nThe kswapd periodically checks to see if there are any\
    \ physical pages that haven't been referenced. These pages are evicted from physical\
    \ memory; if necessary, they are stored on disk. The memory manager subsystem\
    \ takes special care to minimize the amount of disk activity that is required.\
    \ The memory manager avoids writing pages to disk if they could be retrieved\n\
    \nThe hardware memory manager detects when a user process accesses a memory that\
    \ is not mapped to a physical page. The hardware manager notifies the Linux kernel\
    \ of this page fault, and it is up to the memory manager to resolve the fault.\
    \ There are two possibilities: either the page is currently swapped out and must\
    \ be swapped back in, or the user process is making an invalid reference to its\
    \ mapped memory. The hardware memory manager also detects invalid references,\
    \ such as writing to executable code. These references also result in page faults\
    \ that are reported to the memory manager. If the memory manager detects an invalid\
    \ memory access, it notifies the user process with a signal; if the process doesn't\
    \ handle this signal, it is terminated.\n\n### 3.2.4 Data Structures\n\nThe following\
    \ data structures are architecturally relevant:\n\n- **vm_area**: the memory manager\
    \ stores a data structure with each process that records what regions of virtual\
    \ memory are mapped to which physical pages. This data structure also stores a\
    \ set of pointers that allow to perform actions on a particular region of the\
    \ process's virtual memory. For example, the executable code region of the process\
    \ does not need to be swapped to the system paging file since it can use the executable\
    \ file as a backing store. When regions of a process's virtual memory are mapped\
    \ (for example when an executable is loaded), a vm_area_struct is set up for each\
    \ contiguous region in the virtual address space. Speed is critical when looking\
    \ up a vm_area_struct for a page fault, the structures are stored in an AVL tree.\
    \ This data structure contains the status of the page (for example, whether it\
    \ is currently use). All page data structures are available in a vector (mem_map),\
    \ which is initialized at kernel boot time. As page status changes, the attributes\
    \ in this data structure are updated.\n- **mem_map**: the memory manager maintains\
    \ a data structure for each page of physical memory on a system. This data structure\
    \ contains flags that indicate the status of the page.\n- **free_area**: the free\
    \ area vector is used to store unallocated physical memory pages; pages are removed\
    \ from the free_area when allocated, and returned when freed. The Buddy system\
    \ [Knuth 1975, Nowiton 1965, Tanenbaum 1992] is used when allocating pages from\
    \ the free_area.\n\n### 3.2.5 Subsystem Structure\n"
  mdcn: "\n\n## Linux 内核的具体架构\n\n进程 ID（Process ID）信息也保存在 `task_struct` 中。其中存储了进程和组\
    \ ID（group id）。它提供了一个组 ID 数组，以便进程可以关联到多个组。\n\n文件进程数据位于一个 `fs_struct` 子结构中。它将包含一个指向进程根目录对应的\
    \ `inode` 的指针，以及其当前的工作目录。\n\n一个进程打开的所有文件都将通过 `task_struct` 中的 `files_struct` 子结构进行跟踪。\n\
    \n最后，还有一些存储计时信息的字段；例如，进程在用户模式下花费的时间。\n\n所有正在执行的进程在进程表中（process table）中都有一个条目。进程表实现为指向\
    \ `task` 结构的指针数组。进程表中的第一个条目是特殊的 `init` 进程，它是 Linux 系统创建的第一个进程。\n\n最后，实现了一个模块结构（module\
    \ structure）来表示已加载的模块。该结构包含了用于实现模块结构列表的字段：一个一个指向模块符号表的字段，以及另一个存储模块名称的字段。模块大小（以页为单位）和指向模块起始内存的指针也是模块结构中的字段。\n\
    \n### 3.1.5 子系统结构\n\n![](img/4e15c97e21a8f49742cf467593ac4c6a_10_0.png)\n\n图 2\
    \ 显示了进程调度器子系统。它被用于表示进程调度和管理（即加载和卸载），以及定时器管理和模块管理功能。\n\n### 3.1.6 子系统依赖关系\n\n![](img/4e15c97e21a8f49742cf467593ac4c6a_11_0.png)\n\
    \n图 3 显示了进程调度器如何依赖于其他内核系统。进程调度器在调度进程时需要内存管理器来设置内存映射。此外，进程调度器依赖 IPC 子系统用于底半部处理（bottom-half-handing）的信号量队列（见\
    \ 3.3 节讨论）。最后，进程调度器依赖文件系统从持久性设备上加载可加载模块。所有子系统都依赖于进程调度器，因为它们在硬件操作完成时需要挂起用户进程。有关子系统模块之间特定依赖关系的更多细节，请参阅\
    \ [PBS]。\n\n### 3.2 内存管理器\n\n### 3.2.1 目标\n\n如 [Ruling 1997] 第 13-30 页所述，内存管理器为其客户端提供了以下能力：\n\
    \n- 大内存地址空间 - 用户程序可以引用比物理上存在得多的内存。\n- 保护 - 进程的内存是私有的，不能被另一个进程读取或修改；此外，内存管理器防止进程覆盖代码和只读数据。\n\
    - 内存映射 - 客户端可以将文件映射到虚拟内存区域，并像访问内存一样访问文件。\n- 物理内存的公平访问 - 内存管理器确保进程能够公平地访问机器内存资源，确保合理的性能。\n\
    - 共享内存 - 内存管理器允许进程共享部分内存。例如，可执行代码通常在进程间共享。\n\n### 3.2.2 外部接口\n\n内存管理器为其功能提供了两个接口：一个用户进程使用的系统调用接口，另一个其他内核子系统用于完成其任务的接口。\n\
    \n- **系统调用接口**\n  - `malloc()` / `free` - 为进程的使用分配或释放内存区域\n\n- `mmap()` / `munmap()`\
    \ / `msync()` / `mremap` - 将文件映射到虚拟内存区域\n  - `mprotect` - 更改虚拟内存区域的保护\n  - `mlock()`\
    \ / `mlock()` / `munlock()` / `nullock()` - 超用户例程，防止内存被交换\n  - `swapin()` / `swapoff()`\
    \ - 超用户例程，为系统添加和删除交换文件\n\n- **内核内部接口**\n  - `kmalloc()` / `kfree()` - 为内核数据结构分配和释放内存\n\
    \  - `verify_area()` - 验证用户内存区域是否具有所需的权限映射\n  - `get_free_page()` / `free_page()`\
    \ - 分配和释放物理内存页\n\n除了上述之外，内存管理器在内核中访问其所有数据结构和大多数例程。许多内核模块通过访问子系统的数据结构和实现细节与内存管理器接口。\n\
    \n### 3.2.3 子系统描述\n\n由于 Linux 支持多个硬件平台，内存管理器有一个特定于平台的部分，它将所有硬件平台的细节抽象为一个通用的接口。对硬件内存的访问通过这个抽象接口实现。\n\
    \n内存管理器使用硬件内存将虚拟地址映射到物理地址。当用户进程访问内存位置时，硬件管理器会将此虚拟内存地址翻译为物理地址，然后使用该物理地址执行访问。由于这种映射，用户进程并不知道哪个物理地址与特定的虚拟内存地址相关。这允许内存管理器子系统移动进程。由于这种映射，内存管理器可以在内存中移动进程。映射允许进程共享物理内存，如果它们的虚拟地址空间映射到相同的物理地址。\n\
    \n此外，当内存不使用时，内存管理器将其交换到页文件。内存管理器包含一个守护进程（kswapd）。Linux 使用该守护进程引用内核线程，正如调度进程的方式。\n\
    \nkswapd 定期检查是否有未引用的物理页。这些页从物理内存中驱逐；如有必要，将存储在磁盘上。内存管理器子系统会特别注意减少磁盘活动。\n\n当硬件内存管理器检测到用户进程访问未映射到物理页的内存时，它会通知内核内核缺页异常，由内存管理器来解决该异常。有两种可能：该页已交换出需要换回，或者用户进程正在对其映射的内存进行非法引用。内存管理器也会检测非法引用，例如写入代码。这些引用会导致报告给内存管理器的缺页异常。如果内存管理器检测到非法内存访问，将通过信号通知用户进程；如果进程未处理该信号，将终止。\n\
    \n### 3.2.4 数据结构\n\n以下数据结构结构相关：\n\n- **vm_area** - 内存管理器为每个进程存储一个数据结构，记录哪些虚拟内存区域映射到哪些物理页。该数据结构还存储一组指针，允许对进程虚拟内存特定区域执行操作。例如，进程的可执行区域不需要交换到系统分页文件，因为可以使用可执行文件作为备份存储。当进程的虚拟内存区域映射时（例如加载可执行文件时），会为虚拟地址空间中的每个连续区域设置\
    \ `vm_area_struct`。在查找缺页的 `vm_area_struct` 时速度至关重要，这些结构存储在 AVL 树中。该数据结构包含页的状态（例如当前是否使用）。所有页数据结构在向量（mem_map）可用，它在内核启动时初始化。随着页状态的变化，该数据结构中的属性会更新。\n\
    - **mem_map** - 内存管理器为系统上的每个物理页维护一个数据结构。该数据结构包含指示页状态的标志。\n- **free_area** - 空闲区域向量用于存储未分配的物理内存页；页在分配时从\
    \ `free_area` 中移除，在释放时返回。从 `free_area` 分配页时使用伙伴系统（Buddy system）。\n\n### 3.2.5\
    \ 子系统结构\n\n"
