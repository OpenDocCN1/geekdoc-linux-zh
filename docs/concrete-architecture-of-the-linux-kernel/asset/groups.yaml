    ## 2 系统结构


    Linux 内核本身是无用的；它作为整个系统中的一个层参与其中 ([Bowman 1998])。


    在内核层内部，Linux 由五个主要子系统组成：进程调度器 (sched)、内存管理器 (mm)、虚拟文件系统 (vfs)、网络接口 (net) 和进程间通信
    (ipc)。实际构建的架构划分与 [Siddiqui 1998, Tanuan 1998] 以及 [Bowman 1998] 的概念架构划分相似。考虑到概念架构是从实际构建架构推导出的，这种对应关系并不令人意外。我们的划分并没有完全遵循源码的目录结构，因为我们认为这不能完美匹配子系统的分组；然而，我们的聚类与该目录结构非常接近。


    在可视化提取的设计细节后，变得清晰的一个区别是，子系统的依赖关系与概念依赖关系存在巨大差异。概念架构建议的系统间依赖非常少，如图 1(a) 所示（源自 [Bowman
    1998]）。


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_6_0.png)


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_7_0.png)


    (a): 概念划分 (b): 具体划分


    图 1：概念划分与具体划分


    尽管概念架构依赖很少，但具体架构显示 Linux 内核的五个主要子系统是相互依赖的。图 1(b) 显示连接距离完全图仅缺少两条边 ([PBS] 提供了哪些模块跨子系统交互的细节)。这种相互依赖性与概念架构形成了显著对比。似乎任何基于连接特性的反向工程技术（例如
    [Müller 1993] 中设计的 Rigid 系统）都无法从这样的系统中提取出任何相关结构。这验证了 Tzerpos [Tzerpos 1996] 所讨论的混合方法。


    系统层面的差异是子系统层面差异的特征。子系统结构在很大程度上与概念结构对应。然而，我们在具体架构中发现了许多概念架构中没有的依赖关系（Murphy [Murphy]
    意义上的分歧）。子系统结构在下文中将详细讨论这些关系。


    ## 3 子系统结构


    ### 3.1 进程调度器


    ### 3.1.1 目标


    进程调度是 Linux 操作系统的核心。进程调度器具有以下职责：


    - 允许创建新进程

    - 决定哪个进程访问 CPU

    - 接收中断并进行路由

    - 发送信号

    - 管理定时

    - 在进程结束时清理资源


    进程调度器还支持动态加载的模块，通过定时器。


    ### 3.1.2 外部接口


    进程调度器提供了两个接口：首先，它提供了一个可以调用的限制接口；其次，它为内核提供了一个丰富的接口。


    进程可以通过复制其他进程来创建。在启动时，Linux 系统只有一个运行进程：init。通过 fork(k) 系统调用产生子进程。在终止时，调用 `exit()`
    系统调用。


    定时器管理可以通过 `settimer()` 和 `gettimer()` 例程进行。前者设置定时器，后者获取其值。`signal()` 允许用户进程与特定的信号关联。`init_module()`
    会加载模块。最后，`delete_module()` 会卸载模块。


    ### 3.1.3 描述


    进程调度器主要负责进程的加载、执行和适当终止。调度算法在进程执行期间的两个点被调用：首先是如 `sleep()` 等系统调用；其次，在每次系统调用和每次系统中断后（在下文中描述）。


    信号可以被视为一种 IPC 机制，因此在进程间通信部分讨论。


    中断允许硬件与操作系统通信。Linux 区分慢中断和快中断。慢中断是一种典型的中断。其他中断在处理期间是允许的，一旦有了慢中断，Linux 就会照常运行，例如调用调度算法。定时中断是慢中断的范例。快中断用于更复杂的任务，例如处理键盘输入。其他中断在处理期间被禁用，由快中断处理程序式启用。


    Linux 使用定时器每 10ms 触发一次。因此，根据我们上面的调度描述，任务调度至少每 10ms 发生一次。


    ### 3.1.4 数据结构


    `task_struct` 结构代表一个 Linux 任务。有一个字段表示进程状态；该状态可能有以下值：


    - 运行

    - 返回系统调用

    - 处理中断例程

    - 处理系统调用

    - 就绪

    - 等待


    此外，有一个字段指示进程优先级，以及一个字段持有进程可以在不强制调度的情况下继续执行的时钟周期数（10ms 间隔）。还有一个字段持有上次失败系统调用的错误号。


    为了跟踪所有执行中的进程，维护了一个双向列表（通过两个指向 task struct 的字段）。由于每个进程都与其他进程相关，因此存在字段描述进程：原始父进程、父进程、最小孩子、较兄弟以及最后的兄弟。


    有一个嵌套结构 `mm_struct`，包含了进程的内存管理信息（例如代码段的起始和结束地址）。


