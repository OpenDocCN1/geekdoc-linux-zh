    # Linux 内核的具体架构


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_26_0.png)


    图 9：IPC 子系统依赖


    图 9 显示了 IPC 子系统与其他内核子系统的资源依赖关系。


    IPC 子系统依赖文件系统来实现套接字（sockets）。套接字使用文件描述符，一旦打开就会被分配到一个节点（inode）。内存管理依赖 IPC，因为页面交换程序会调用
    IPC 子系统来执行共享内存的交换。IPC 依赖内存管理主要是为了缓冲区分配和共享内存的实现。


    某些 IPC 机制使用定时器，这些定时器是在进程调度器子系统中实现的。进程调度依赖于信号。由于这两个原因，IPC 模块和进程调度器模块是相互依赖的。有关 IPC
    子系统模块与其他内核子系统之间依赖关系的更多细节，请参阅 [PBS]。


    ## 3.5 网络接口


    ### 3.5.1 目标


    Linux 网络系统提供了机器间的网络连接性以及套接字通信模型。它提供了两种类型的套接字实现：BSD 套接字和 INET 套接字。BSD 套接字是使用 INET
    套接字实现的。


    Linux 网络系统提供了具有不同通信模型和服务质量的两种传输协议。这些是不可靠的、基于消息的 UDP 协议和可靠的、流式的 TCP 协议。它们构建在 IP
    网络协议之上。INET 套接字则构建在传输协议和 IP 协议之上。


    最后，IP 协议位于底层设备驱动程序之上。系统为三种不同类型的连接提供了设备驱动程序：串行链路（SLIP）、并行线连接（PLIP）和以太网连接。地址解析协议（ARP）在
    IP 和以太网驱动程序之间起到调节作用。地址解析器的作用是在逻辑 IP 地址和物理以太网地址之间进行转换。


    ### 3.5.2 外部接口


    网络服务通过套接字接口供其他系统和用户使用。套接字通过 `socketcall()` 系统调用进行创建和操作。数据通过套接字描述符上的 `read()` 和
    `write()` 调用进行发送和接收。


    网络系统没有导出任何其他网络机制/功能。


    ### 3.5.3 子系统描述


    BSD 套接字模型呈现给用户进程。该模型是一种面向连接的、流式的、缓冲通信服务。BSD 套接字实现在 INET 套接字模型之上。


    BSD 套接字模型处理的任务类似于 VFS 的任务，并管理套接字连接的通用数据结构。BSD 套接字模型的目的是通过将通信抽象为通用接口来提供更好的可移植性。BSD
    接口广泛用于 Unix 和 Microsoft Windows 等现代操作系统。INET 套接字模型管理用于基于 IP 协议（TCP 和 UDP）的实际通信端点。


    网络 I/O 开始于对套接字的读或写。这会触发一个 `read/write` 系统调用，该调用由虚拟文件系统的一个组件处理（沿网络层层下的 `read/write`
    调用链是对称的，因此从某一点开始，只考虑写操作）。从那里，确定了 BSD 套接字的 `sock_write()` 实现了实际的文件系统写调用；因此调用了它。该例程处理管理细节，并将控制传递给
    `inet_write()` 函数。这变成了一个传输层写调用（通过 `tcp_write()`）。


    传输层例程负责将输入的数据拆分为传输包。这些例程将控制传递给 `ip_build_header()` 例程，该例程构建一个插入数据包的 IP 头部，然后调用
    `tcp_build_header()` 构建 TCP 头部。完成后，将使用设备驱动程序来实际发送数据。


    网络系统提供两种传输服务，每种服务都有不同的通信模型和服务质量。UDP 提供无连接的、不可靠的数据传输服务。它负责从 IP 层接收数据包，并找到包应该发送到的终地。如果目标不存在，则报告错误。否则，如果有足够的缓冲区内存，数据包数据将进入该套接字的接收包列表。任何正在读操作的套接字都会收到通知并唤醒。


    TCP 协议提供了一个得得方案。除了处理发送和接收进程之间的数据传输外，TCP 协议还执行复杂的连接管理。TCP 将数据发送到套接字层，而不是作为包序列，并保证可靠的传输。


    IP 协议提供数据包传输服务。给定一个包和一个目的地，IP 通信层负责将包路由到正确的主机。对于传出的数据流，IP 负责以下操作：


    - 将流划分为 IP 包

    - 将包路由到目标地址

    - 生成供硬件设备驱动程序使用的头部

    - 选择合适的网络设备进行发送


    对于传入的数据包流，IP 必须执行以下操作：


    - 检查头部的有效性

    - 将目的地址与本地地址进行比较，如果包不在正确的目的地，则进行转发

    - 重组 IP 包

    - 将包发送到 TCP 或 UDP 层进行进一步处理


    ARP（地址解析协议）负责在 IP 和实际地址之间进行解析。ARP 支持以太网、FDDI 等多种硬件设备。这种功能是必要的，用于处理 IP 地址。由于使用了中性地址方案，通信协议可以在多种硬件设备上实现。


    网络系统为串行连接、并行连接和以太网连接提供了自己的驱动程序。提供了指向各种设备的抽象接口，以隐藏介质之间的差异。


    ### 3.5.4 数据结构


    BSD 套接字实现由 socket 结构表示。该结构包含一个标识套接字类型（流式或数据报）以及套接字状态（已连接或未连接）的字段。标志字段可以修改套接字的操作，并提供指向可以在套接字上执行的操作的结构指针。还提供了关联的
    INET 套接字实现的指针，以及对 inode 的引用。每个 BSD 套接字都关联一个 inode。


    sk 结构用于管理单个通信包。缓冲区指向它所属的套接字，包含传输时间，以及使得与给定套接字相关的包可以链接的字段（双链表）。源目的地址、头部信息和包数据也包含在缓冲区。该结构封装了网络系统使用的所有包（例如
    tcp 包、udp 包、包等）。


    sock 结构引用 INET 套接字特定信息。结构成员包括套接字所需的读写内存、TCP 协议所需的序列号（可以通过设置来更改套接字的行为）、缓冲区管理字段（例如维护给定套接字接收的所有包列表）以及用于阻塞例程的等待队列。还提供指向维护协议特定函数指针列表的结构指针，即
    proto 结构。proto 结构相当大且复杂，但本质上为 TCP 和 UDP 协议提供了一个抽象接口。源目的地址以及更多 TCP 特定的数据字段。TCP
    大量使用定时器来处理超时等，因此 sock 结构包含了与定时器操作的数据字段，以及作为定时器警报调用的函数指针。


