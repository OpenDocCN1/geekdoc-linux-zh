    ## 1 Introduction


    ### 1.1 Purpose


    The goal of this report is to describe the concrete architecture of the Linux
    kernel. Concrete architecture refers to the architecture of the system as it is
    built. We intend to develop the concrete architecture to provide high-level documentation
    of the existing Linux kernel.


    ### 1.2 Introduction to Linux


    Lin Torvalds wrote the first Linux kernel in 1991. Linux gained popularity because
    it has always been distributed as free software. Since the source code is readily
    available, users can freely change the kernel to suit their needs. It is important
    to understand how the Linux kernel has evolved and how it currently works before
    new system programs are written.


    A concrete architecture based on the Linux kernel source code can provide a reliable
    and up-to-date reference for Linux hackers and developers. Linux has been revised
    several times since 1991 by a group of volunteers who communicate through the
    USENET newsgroups on the Internet. To, Torvalds has acted as the main kernel developer.
    In the event that Lin Torvalds is no longer part of the Linux project, we can
    reasonably expect that the Linux kernel can be enhanced and modified if an accurate
    and up-to-date architecture is maintained.


    Linux is a Unix-compatible system. Most of the common Unix tools and programs
    now run on Linux. Linux was originally developed to run on the Intel 8038 microprocessor.
    The original version was not readily portable to other platforms because it uses
    Intel''s specific interrupt handling routines. When Linux was ported to other
    hardware platforms such as the DEC Alpha and Sun SPARC, the platform-dependent
    code was moved into platform-specific modules that


    Concrete Architecture of the Linux Kernel


    Although the Portable Bookshelf tool provided detailed design information and
    some initial clustering based on file names, we found that this was not sufficient
    to form a concrete architecture description. The extraction tool didn''t accurately
    extract dependencies. It missed some dependencies, and asserted some did not exist.
    The tool didn''t automatically provide a structure that helped understand the
    system. We verified the extracted design facts and refined the clustering using
    our conceptual model of the Linux kernel.


    We concluded that the Portable Bookshelf tool by itself cannot accurately describe
    the concrete architecture of the Linux kernel. We remedied this limitation by
    using domain-specific knowledge to describe the concrete architecture.


    ### 1.3 Background on Software Architecture


    The study of software architecture has gained popularity in both the industrial
    and academic community. Software architecture involves the study of systems. Recent
    studies show that software architecture is important because it enhances communication
    among stakeholders. The status of systems can be described in a spectrum ranging
    from well documented to poorly designed. In many cases, some or all of the original
    architects may no longer be involved with the system. This lack of architecture
    knowledge tremendously complicates the maintenance task. In order to change, extend,
    or recover functionality of an existing system, the implementation needs to be
    understood.


    The discipline of reverse engineering has two main areas [Bass 1998]:


    1. Technical approaches: These extraction approaches derive information about
    a system based on existing artifacts. In particular, source code, comments, user
    documentation, executable modules, and systems designs are often extracted.

    2. Human inference: These approaches focus on how humans understand software.
    Typically, human investigators use the following strategies:


    - Top-down strategies: start at the highest level of architecture and recursively
    fill in the sub-parts.

    - Bottom-up strategies: understand the lowest levels of components and how they
    work

    - Model-based strategies: understand the mental model of how the system works

    - Opportunistic strategies: use some combination of the above


    In this report, we used both the technical and human approaches to describe the
    concrete architecture. The optimistic strategy follows the same strategy as the
    hybrid approach [Tzerpos 1996]. Instead of using "live" information from the developers
    of the Linux kernel, we use our domain-specific knowledge of modern operating
    systems (i.e., the conceptual architecture from assignment 1) to repeatedly refine
    the concrete architecture.


    ### 1.4 Methodology/Approach


    In this report, we used the opportunistic strategy to develop the concrete architecture
    of the Linux kernel. We used a modified version of the hybrid approach of [Tzerpos
    1996] to determine the structure of the Linux kernel. The steps, which are not
    necessarily in sequential order:


    - Define Conceptual Architecture. Since we have no access to "live" information
    from the developers, we used our modern operating system domain knowledge to create
    the Conceptual Architecture of the Linux kernel. This step was done in Assignment1
    ([Bowman 1998], [Siddiqi 1998], and [Tamian 1998]).

    - Extract facts from source code. We used the Portable Bookshelf C Fact Extractor
    (cf) and Fact Base Generator (figer) (described in [Holt 1997]) to extract dependency
    facts from the source code.

    - Cluster into subsystems. We used the Fact Manipulator (i.e., grok and scripts)
    to cluster factors into these subsystems. This clustering was performed partially
