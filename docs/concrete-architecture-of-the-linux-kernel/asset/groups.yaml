    Seite 16 von 34 (Note: Page header information removed)


    - (using names and dependencies), and partially using our conceptual model of
    the Linux kernel.

    - Review the generated software architecture. We used the Landscape Layouter,
    Adjuster, Editor and Viewer ([Holt 1997]) to visualize the extracted design information.
    Based on these designs, we could see the dependencies between the subsystems.
    The landscape diagrams confirmed our understanding of the concrete architecture.
    In cases where the extracted architecture disagreed with the concrete architecture,
    we inspected the source code and documentation manually.

    - Refine using Conceptual Architecture. We used the Concrete Architecture of the
    Linux kernel to verify the clustering of the components and the dependencies of
    these components.

    - Refine using Conceptual Architecture. In conjunction with the previous step,
    we drew the layout of the Linux kernel structure manually using Visio drawing
    tool.


    There are many views of the Linux kernel, depending on the motive and viewpoint.
    In this report, we described the concrete architecture using a software structure
    ([Mancoridis Slides]). We used the software structure to do the following:


    - specify the decomposition of the Linux kernel into five subsystems

    - describe the interfaces of the components (i.e., subsystems and modules)

    - describe the dependencies between components.


    We describe dependencies between resources, where resources can be subsystems,
    modules, procedures, or variable. The dependency relation is quite broad; usually
    we do not distinguish between function calls, variable reference, and type usage.


    The software structure says little about the run-time structure of the Linux kernel.
    However, we believe that the software architecture together with the detailed
    specifications gives enough information for a potential Linux developer to modify
    or extend the kernel without reviewing all the source code. We are not mainly
    concerned with the process view [Kruchten 1995] of the Linux kernel because we
    treat the Linux kernel as one single execution process.


    ## 1.5 Reader Profile


    We assume that the reader has a sufficient background in computer science and
    operating systems to thoroughly understand the discussion on the major components
    and interactions of the components of the Linux kernel in this report. We do not
    assume a detailed knowledge of the Linux operating system.


    ## 1.6 Organization of this report


    This remainder of this report is organized as follows:


    - Section 2 describes the overall system architecture. It describes the software
    architecture using the five major subsystems and the interdependencies between
    them.

    - Section 3 describes the software architecture of the major subsystems: Process
    Scheduler, Memory Manager, Virtual File System, Inter-Process Communication, Network
    Interface. Each subsystem description will be supported with a diagram to show
    the subsystem in context with lines showing dependencies. It also includes an
    interpretation of the system abstraction and design information extracted from
    the Linux kernel source code.

    - Section 4 describes the problems that we encountered in the report, and describe
    the findings and conclusion that we arrived at.


    ## 2 System Structure


    The Linux Kernel is useless by itself; it participates as one layer in the overall
    system ([Bowman 1998]).


    Within the kernel layer, Linux is composed of five major subsystems: the process
    scheduler (sched), the memory manager (mm), the virtual file system (vfs), the
    network interface (net), and the inter-process communication (ipc). The as-built
    architecture decomposition is similar to the conceptual architecture decomposition
    of [Siddiqui 1998, Tanuan 1998], and [Bowman 1998]. This correspondence is not
    too surprising given that the conceptual architecture was derived from the as-built
    architecture. Our decomposition does not exactly follow the directory structure
    of the source code, as we believe that this doesn''t perfectly match the subsystem
    grouping; however, our clustering is quite close to this directory structure.


    One difference that became clear after visualizing the extracted design details
    is that the subsystem dependencies differ quite radically from the conceptual
    dependencies. The conceptual architecture suggested very few inter-system dependencies,
    as shown by Figure 1(a) (derived from [Bowman 1998]).


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_6_0.png)


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_7_0.png)


    (a): Conceptual Decomposition (b): Concrete Decomposition


    Figure 1: Conceptual versus Concrete Decomposition


    Although the conceptual architecture has few dependencies, the concrete architecture
    shows that the five major subsystems of the Linux kernel are highly interdependent.
    Figure 1(b) shows that the connection is only missing two edges from a complete
    graph ([PBS] gives the details of which modules interact across subsystems). This
    interdependency is a striking disagreement with the conceptual architecture. It
    seems that any reverse-engineering technique based on interconnection properties
    (such as the Rigid system designed in [Müller 1993]) would fail to extract any
    relevant structure from such a system. This validates the hybrid approach discussed
    by Tzerpos [Tzerpos 1996].


    The differences at the system level are characteristic of differences at subsystem
    level. The subsystem structure corresponds largely to the conceptual structure.
    However, we found many dependencies in the concrete architecture that weren''t
    in the conceptual architecture (divergences in the sense of Murphy [Murphy 1995]).
    The reasons for these additional dependencies are discussed in the following section,
    where we examine the detailed design of each of the major subsystems.


    ## 3 Subsystem Structure


    ### 3.1 Process Scheduler


    ### 3.1.1 Goals


    Process scheduling is the heart of the Linux operating system. The process scheduler
    has the following responsibilities:


    - allow processes to create new copies of themselves

    - determine which process will have access to the CPU and effect the transfer
    between running processes

    - receive interrupts and route them to the appropriate kernel processes

    - send signals to user processes

    - manage the timer hardware

    - clean up process resources when a processes finishes executing


    The process scheduler also provides support for dynamically loaded modules; these
    modules represent kernel functionality that can be loaded after the kernel has
    started executing. This loadable module functionality is used by the virtual file
    system and the network interface.


    ### 3.1.2 External Interface


    The process scheduler provides two interfaces: first, it provides a limited system
    call interface that user processes may call; secondly, it provides a rich interface
    to the rest of the kernel system.


    Processes can create other processes by copying the existing process. At boot
    time, the Linux system has only one running process: init. This process spawns
    others, which can also spawn copies of themselves, through the fork(k) system
    call. The fork(k) generates a new child process that is a copy of its parent.
    Upon termination, a user process (implicitly or explicitly) calls the _exit()
    system call.


    Several routines are provided to handle loadable modules. create_module() will
    allocate memory to initialize the structure, described below, with the name, size,
    starting address, and initial status. init_module() loads the module from disk
    and activates it. Finally, delete_module() unloads a module.


    Timer management can be done through settimer() and gettimer() routines. The former
    sets a timer while the latter gets its value. signal() allows a user process to
    associate a function handler with a particular signal.


    ### 3.1.3 Subsystem Description


    The process scheduler is primarily responsible for the loading, execution, and
    proper termination of user processes. The scheduling algorithm is called at two
    different points during the execution of a user process. First, there are system
    calls that call the scheduler, such as sleep(). Second, after every system call,
    and after every system interrupt (described in a moment), the schedule algorithm
    is called.


    Signals can be considered an IPC mechanism, thus are discussed in the interprocess
    communication section.


    Interrupts allow hardware to communicate with the operating system. Linux distinguishes
    between slow and fast interrupts. A slow interrupt is a typical interrupt. Other
    interrupts are legal while they are being processed, and once processing has a
    slow interrupt, Linux conducts business as usual, such as calling the scheduler
    algorithm. A timer interrupt is exemplary of a slow interrupt. A fast interrupt
    is one that is used for more complex tasks, such as processing keyboard input.
    Other interrupts are disabled as they are being processed, explicitly enabled
    by the fast interrupt handler.


    The Linux OS uses a timer interrupt to fire off every 10ms. Thus, according to
    our scheduler description given above, task rescheduling should occur at least
    once every 10ms.


    ### 3.1.4 Data Structures


    The structure task_struct represents a Linux task. There is a field that represents
    the process state; this may have the following values:


    - running

    - returning from system call

    - processing an interrupt routine

    - processing a system call

    - ready

    - waiting


    In addition, there is a field that indicates the processes priority, and field
    which holds the number of clock ticks (10ms intervals) which the process can continue
    executing without forced rescheduling. There is also a field that holds the error
    number of the last failing system call.


    In order to keep track of all executing processes, a doubly linked list is maintained,
    (through two fields that point to task struct). Since every process is related
    to some other process, there are fields which describe a process: original parent,
    parent, youngest child, younger sibling, and finally order sibling.


    There is a nested structure, mm_struct, which contains a process’s memory management
    information, (such as start and end address of the code segment).

