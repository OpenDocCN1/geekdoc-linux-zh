    ### 1.1 目的\n\n本报告的目的是描述 Linux 内核的具体架构。具体架构指的是系统被构建时的实际架构。我们打算开发具体架构，以为现有的 Linux\
    \ 内核提供高层文档。\n\n### 1.2 Linux 简介\n\nLin Torvalds 在 1991 年编写了第一个 Linux 内核。Linux\
    \ 之所以流行是因为它一直作为免费软件分发。由于源码易于获取，用户可以自由地根据需要更改内核。在编写新的系统程序之前，理解 Linux 内核是如何演化的以及目前是如何运作的是非常重要的。\n\
    \n基于 Linux 内核源码的具体架构可以为 Linux 黑客和开发者提供可靠且最新的参考。自 1991 年以来，Linux 由一小组通过互联网上的 USENET\
    \ 新闻组通信的志愿者经过了多次修订。在此期间，Torvalds 一直担任主要的内核开发人员。如果 Lin Torvalds 不再参与 Linux 项目，我们完全可以预期，只要维护一个准确且最新的架构，Linux\
    \ 内核就可以得到增强和修改。\n\nLinux 是一个兼容 Unix 的系统。大多数常用的 Unix 工具和程序现在都运行在 Linux 上。Linux\
    \ 最初是为运行在 Intel 8038 微处理器上而开发的。原始版本并不容易移植到其他平台，因为它使用了 Intel 特定的中断处理例程。当 Linux\
    \ 移植到 DEC Alpha 和 Sun SPARC 等其他硬件平台时，依赖平台的代码被移动到了特定平台的模块中。\n\nLinux 内核的具体架构\n\n\
    尽管 Portable Bookshelf 工具提供了详细的设计信息和一些基于文件名的初始聚类，但我们发现这不足以形成一个具体的架构描述。提取工具未能准确地提取依赖关系。它遗漏了一些依赖关系，并断言某些依赖关系不存在。该工具没有自动提供有助于理解系统的结构。我们验证了提取的设计事实，并利用我们对\
    \ Linux 内核的概念模型完善了聚类。\n\n我们得出结论：仅靠 Portable Bookshelf 工具本身无法准确描述 Linux 内核的具体架构。我们通过使用领域知识来描述具体架构，弥补了这一局限性。\n\
    \n### 1.3 架构背景\n\n软件架构的研究在工业和学术界都变得流行。软件架构涉及对系统的研究。最近的研究表明，软件架构很重要，因为它增强了利益相关者之间的通信。系统的状态可以在从文档完备到设计糟糕的光谱上进行描述。在许多情况下，原始架构师的部分或全部成员可能不再参与该系统。这种架构知识的缺乏极大地复杂了维护任务。为了更改、扩展或恢复现有系统的功能，需要理解其实现细节。\n\
    \n逆向工程学科有两个主要领域 [Bass 1998]：\n\n1. 技术方法：这些提取方法基于现有构件获取有关系统的信息。特别是经常会提取源码、注释、用户文档、可执行模块和系统设计。\n\
    2. 人类推理：这些方法关注人类如何理解软件。通常，人类调查者使用以下策略：\n\n- 自顶向下的策略：从架构的最高层开始，递归地填充子部分。\n- 自底向上的策略：理解组件的最低层级及其工作原理。\n\
    - 基于模型的策略：理解系统运作的心理模型。\n- 机会性策略：使用上述策略的某种组合。\n\n在本报告中，我们同时使用了技术和人类方法来描述具体架构。机会策略遵循与混合方法\
    \ [Tzerpos 1996] 相同的策略。我们没有使用 Linux 内核开发者的“实时”信息，而是使用我们对现代操作系统的领域知识（即作业1中的概念架构）来反复完善具体架构。\n\
    \n### 1.4 方法论/方法\n\n在本报告中，我们使用了机会性策略来开发 Linux 内核的具体架构。我们使用了改进的 [Tzerpos 1996]\
    \ 混合方法来确定 Linux 内核的结构。这些步骤不一定按顺序排列：\n\n- 定义概念架构。由于我们无法获取开发者的“实时”信息，我们使用现代操作系统领域知识创建了\
    \ Linux 内核的概念架构。这一步在作业1中完成 ([Bowman 1998], [Siddiqi 1998], 和 [Tamian 1998])。\n\
    - 从源码中提取事实。我们使用 Portable Bookshelf C事实提取器 (cf) 和事实生成器 (figer)（在 [Holt 1997] 中描述）从源码中提取依赖事实。\n\
    - 聚类到子系统。我们使用事实操作器（即 grok 和脚本）将因素聚类到这些子系统中。这种聚类部分由工具完成。\n\n"
