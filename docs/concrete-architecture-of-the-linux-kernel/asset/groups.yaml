    通过半半处理器，设备驱动程序可以减少中断延迟并提高并发性。


    总而言，设备驱动程序隐藏了操作外设 CSR（控制状态寄存器）的细节以及每个设备的数据传输机制。缓冲区缓存通过尝试从内存缓冲区满足块设备的请求，来帮助系统性能。


    ## 逻辑文件系统


    虽然可以通过设备特殊文件访问文件类设备，但通过逻辑文件系统访问块设备是更常见的做法。逻辑文件系统可以挂载在虚拟文件系统中的挂载点上。这意味着关联块设备包含了文件和结构信息，允许逻辑文件系统访问该设备。在任何时候，一个物理设备只能支持一个逻辑文件系统；但是，设备可以重新格式化为不同的逻辑文件系统。Linux
    支持 15 个逻辑文件系统；这促进了与其他操作系统的互操作性。


    当文件系统作为一个子目录时，设备上的所有文件和目录都成为挂载点的子目录。虚拟文件系统的用户不需要知道是哪个逻辑文件系统实现了目录树的哪部分，以及哪些物理设备包含了逻辑文件系统。这种抽象在物理设备和逻辑文件系统的选择上都提供了极大的灵活性，而这种灵活性是
    Linux 成功的关键因素之一。


    为了支持虚拟文件系统，Linux 使用了 inode（索引节点）的概念。Linux 使用 inode 来表示块设备上的文件。inode 是虚拟的，因为它包含的操作会根据文件所在的逻辑系统和物理系统而以不同的方式实现。inode
    接口使得所有文件在其他 Linux 子系统中看起来是相同的。inode 被用作磁盘上所有打开文件相关信息的存储位置。inode 存储了相关的缓冲区、文件的块总数，以及文件偏移量与设备块之间的映射。


    ## 模块


    虚拟文件系统的大部分功能以动态加载模块的形式提供（在第 3.1 节描述）。这种动态配置允许 Linux 用户编译一个尽可能小的内核，同时允许它在单次会话中需要时加载设备驱动程序和文件模块。例如，Linux
    系统可能可选地为其内核附加一个补丁，那么如果打印机不可用而打印机程序已经链接到内核中，就会浪费内存。通过将打印机制为可加载模块，Linux 允许用户在硬件可用时加载驱动程序。


    ### 3.3.4 数据结构


    以下数据结构在架构上与文件系统相关：


    - *super_block*: 每个逻辑文件系统都有一个 superblock，用于向 Linux 内核的其他部分描述它。该 superblock 包含了关于整个文件系统的信息——哪些块、块大小是多少等。superblock
    类似于 inode，因为它们表现为通往逻辑文件系统的虚拟接口。

    - *inode*: 一种内存中的数据结构，表示内核了解一个打开文件需要的所有信息。单个 inode 可能会被多个打开该文件的进程共同使用。inode 存储了内核与单个文件关联所需的所有信息。计数、缓冲和内存映射都存储在
    inode 中。某些逻辑文件系统还有一个 inode 结构，用于以持久化方式维护这些信息，但这与内核其他部分使用的 inode 数据是不同的。

    - *file*: 文件描述符表示由特定进程打开的文件。所有打开的文件都存储在一个双链表中（由 `first_file` 指向）；在 POSIX 风格例程（`open`,
    `read`, `write`）中使用的文件描述符是该特定打开文件在该链表中的索引。


    ### 3.3.5 子系统结构


    ## Linux 内核的具体架构


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_20_0.png)


    图 6：文件子系统结构


    ### 3.3.6 子系统依赖


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_21_0.png)


    图 7：文件子系统依赖


    图 7 显示了文件系统如何依赖其他内核子系统。同样，文件系统依赖于所有其他依赖文件系统的内核子系统。特别是，网络子系统依赖文件系统，因为网络套字以文件描述符的形式呈现给用户。内存管理器依赖文件系统以支持交换。IPC
    子系统依赖文件系统来实现管道（pipes）和 FIFO。进程调度器依赖文件系统来加载可加载模块。


    文件系统使用网络接口来支持 NFS；使用内存管理器来实现缓冲区缓存和 ramdisk 设备；使用 IPC 子系统来帮助支持可加载模块，并使用进程调度器在硬件请求完成时让用户进程休睡眠。更多细节，请参阅
    [PBS]。


    ## 3.4 进程间通信


    ### 3.4.1 目标


    提供 Linux IPC 机制是为了让并发执行的进程有一种手段来共享资源、同步并相互交换数据。Linux 通过共享资源、内核数据结构和等待队列实现了在同一系统执行的进程之间所有形式的
    IPC。


    Linux 提供了以下形式的 IPC：


    - 信号（Signals）：可能是最老的 Unix IPC 形式，信号是发送给进程的异步消息。

    - 等待队列（Wait queues）：提供了一种让进程在等待操作完成时进入睡眠的机制。该机制被进程调度器用于实现第 3.3.3 节描述的半半处理。

    - 文件锁（File locks）：提供了一种机制，允许进程将文件的区域或文件本身声明为除持有者之外的所有进程的只读。

    - 管道和命名管道（Pipes and Named Pipes）：通过显式建立管道连接，或通过存在于系统文件文件中的命名管道进行通信，允许两个进程之间的双向数据传输。

    - 系统 IPC

    - 信号量（Semaphores）：经典信号量模型的实现。该模型还允许创建信号量数组。

    - 消息队列（Message queues）：一种无连接的数据传输模型。消息是一段带有类型的字节序列。消息被写入消息队列，并可以通过读取消息队列获取，可能按类型限制读取。

    - 共享内存（Shared memory）：多个进程访问同一内存区域的机制。

    - 域套接字（Domain sockets）：另一种面向连接的数据传输机制，提供与下一节的 INET 套接字相同的通信模型。


    ### 3.4.2 外部接口


    信号是发送给内核或其他进程的通知。信号通过 `send_sig()` 函数发送。信号号作为参数提供，以及目标进程。进程可以使用 `signal(function)`
    函数注册处理信号。


    文件锁由 Linux 文件系统直接支持。要锁定项，可以使用 `open()` 系统调用，也可以使用 `sysfcntl()` 系统调用。文件内部区域的锁定通过
    `sysfcntl()` 系统调用完成。


    管道通过 `pipe()` 系统调用创建。然后使用文件系统的 `read()` 和 `write()` 调用在管道上传数据。命名管道通过 `open()`
    系统调用打开。


    V IPC 机制具有共同接口，即 `ipc()` 系统调用。各种 IPC 操作通过系统调用参数进行指定。


    Unix 域套接字功能也封装在单个系统调用 `socketcall()` 中。


    上述每个系统调用都有良好的文档，鼓励读者查阅相应的手册页（man-page）。


    IPC 子系统向其他内核子系统暴露调用。由于等待队列不被用户进程使用，因此它们没有系统调用接口。等待队列用于信号量、管道和半半处理（参见第 3.3.3 节）。`add_wait_queue()`
    过程将任务插入等待队列。`remove_wait_queue()` 过程从等待队列中移除任务。


    ### 3.4.3 子系统描述


