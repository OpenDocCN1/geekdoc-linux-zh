    \ a system-call interface. Wait queues are\nin implementing semaphores, pipes,\
    \ and bottom-half handlers (as see section 3.3.3). The procedure add_wait_queue()\
    \ inserts a task into a wait queue. The procedure\nremove_wait_queue() removes\
    \ a task from the wait queue.\n\n# 3.4.3 Subsystem Description"
