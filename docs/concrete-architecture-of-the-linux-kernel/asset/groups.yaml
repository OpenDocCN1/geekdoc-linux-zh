    device drivers since there is a large number of hardware devices.


    The Linux kernel uses a buffer cache to improve performance when accessing all
    devices. Block device access occurs through a buffer cache system. The buffer
    cache greatly increases performance by minimizing reads and writes to hardware
    devices. Each device request adds a request to its queue and sleeps until this
    request has been satisfied. The buffer cache uses a separate kernel thread, klad,
    to write buffer pages to devices and remove them from the cache.


    When a device driver needs to satisfy a request, it is initiated by the operation
    the device driver managing the control and status registers (CSRs). There are
    three general mechanisms for moving data from the main computer to the peripheral
    device: polling, direct memory access (DMA), and interrupts. In the polling case,
    the device driver periodically checks the CSR of the peripheral to see if the
    current request has been completed. If so, the driver initiates the next request
    and continues. Polling is appropriate for low-speed hardware devices such as keyboards
    and mice. For other faster devices, DMA is used. In this case, the device driver
    initiates the transfer which operates concurrently with the main CPU, and the
    CPU is free to process other tasks while the operation is ongoing. When the DMA
    operation completes, the CPU receives an interrupt. Interrupt handling is very
    common in the Linux kernel, and it is more complicated than the other two approaches.


    When a hardware device reports a change (in motion mouse button, key pressed)
    to report the completion of an operation, it sends an interrupt to the CPU. If
    interrupts are enabled, the CPU stops executing the current instruction and begins
    the Linux kernel''s interrupt handler code. The kernel finds the appropriate handler
    to invoke (each device driver registers handlers for the devices it generates).
    When an interrupt is being handled, the CPU executes in a special context; other
    interrupts may be delayed until the interrupt is handled. Because of this restriction,
    interrupt handlers need be efficient so that other interrupts are not lost. Some
    interrupt handler cannot complete all work within the time constraints; however
    the interrupt handler schedules the remainder of the work in a bottom-half handler.
    A bottom-half handler is one that will be executed by the scheduler the next time
    that a system call has been completed. By deferring non-critical work to'
- md: '

    a bottom half handler, device drivers can reduce interrupt latency and promote
    concurrency.


    In summary, device drivers hide the details of manipulating a peripheral''s CSR
    and the data transfer mechanism for each device. The buffer cache helps improve
    system performance by attempting to satisfy requests from in-memory buffers for
    block devices.


    ## Logical File Systems


    Although it is possible to access file devices through their device special file,
    it is more common to access block devices through a logical file system. A logical
    file system can be mounted at a mount point in the virtual file system. This means
    that the associated block device contains files and structure information that
    allow the logical file system to access the device. At any time, a physical device
    can only support one logical file system; however, the device can be reformatted
    to a different logical file system. Linux supports fifteen logical file systems;
    this promotes interoperability with other operating systems.


    When a file system is a subdirectory, all of the files and directories on the
    device are made subdirectories of the mount point. Users of the virtual file system
    do not need to be aware what logical file system is implementing which of the
    directory tree, which physical devices are containing logical file systems. This
    abstraction provides a great deal of flexibility in both choice of physical devices
    and logical file systems, and this flexibility is one of the essential factors
    in the success of Linux operating.


    To support the virtual file system, Linux uses the concept of inodes. Linux uses
    an inode to represent a file on a block device. The inode is virtual in the sense
    that it contains operations that are implemented differently depending on the
    logical system and physical system where the file resides. The inode interface
    makes all files appear as other Linux subsystems. The inode is used as a storage
    location for all of the information related to an open file on disk. The inode
    stores associated buffers, the total of the file in blocks, and the mapping between
    file offsets and device blocks.


    ## Modules


    Most of the functionality of the virtual file system is available in the form
    of dynamically loaded modules (described in section 3.1). This dynamic configuration
    allows Linux users to compile a kernel that is as small as possible, while still
    allowing it to load device driver and file modules when necessary during a single
    session. For example, Linux system might optionally have a patch attached to its
    kernel, then memory would be wasted if the printer driver were already linked
    in the kernel, when the printer isn''t available. By making the printer a loadable
    module, Linux allows the user to load the driver if the hardware is available.


    ### 3.3.4 Data Structures


    The following data structures are architecturally relevant to the file system:


    - *super_block*: each logical file system has an superblock that is used to represent
    it to the rest of the Linux kernel. this superblock contains information about
    the entire file system -- what blocks are, what the block size is, etc. The superblock
    is similar to inodes in that they behave as a virtual interface to the logical
    file system

    - *inode*: an in-memory data structure that represents all of the information
    that the kernel needs to know about an open file. A single inode might be used
    by several processes that have the open file. The inode stores all the information
    that the kernel needs to associate with a single file. Accounting, buffering,
    and memory mapping are all stored in the inode. Some logical file systems also
    have an inode structure that maintains this information persistently, but this
    is distinct from the inode data used within the rest of the kernel.

    - *file*: the file descriptor represents a file that is opened by particular process.
    All open files are stored in a doubly-linked list (pointed to by first_file);
    the file descriptor that is used in POSIX style routines (open, read, write) is
    the index of the particular open file in this linked list.


    ### 3.3.5 Subsystem Structure


    ## Concrete Architecture of the Linux Kernel


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_20_0.png)


    Figure 6: File Subsystem Structure


    ### 3.3.6 Subsystem Dependencies


    ![](img/4e15c97e21a8f49742cf467593ac4c6a_21_0.png)


    Figure 7: File Subsystem Dependencies


    Figure 7 shows how the file system depends on other kernel subsystems. Again,
    the file system depends on all other kernel subsystems depend on the file system.
    In particular, the network subsystem depends on the file system because network
    sockets are presented to users as file descriptors. The memory manager depends
    on the file system to support swapping. The IPC subsystem depends on the file
    system for implementing pipes and FIFO''s. The process scheduler depends on the
    file system to loadable modules.


    The file system uses the network interface to support NFS; it uses the memory
    manager to implement the buffer cache and for a ramdisk device; it uses the IPC
    subsystem to help support loadable modules, and it uses the process scheduler
    to put user processes to sleep while hardware requests are completed. For more
    details, see [PBS].


    ## 3.4 Inter-Process Communication


    ### 3.4.1 Goals


    The Linux IPC mechanism is provided so that concurrently executing processes have
    a means to share resources, synchronize and exchange data with one another. Linux
    implements all forms of IPC between processes executing on the same system through
    shared resources, kernel data structures, and wait queues.


    Linux provides the following forms of IPC:


    - Signals – perhaps the oldest form of Unix IPC, signals are asynchronous messages
    sent to a process.

    - Wait queues – provides a mechanism to put processes to sleep while they are
    waiting for an operation to complete. This mechanism is used by the process scheduler
    to implement bottom-half handling as described in section 3.3.3.

    - File locks – provides a mechanism to allow processes to declare either regions
    of a file, or the entire file itself, as read-only to all processes except the
    one which holds the lock.

    - Pipes and Named Pipes – allows connection-oriented, bi-directional data transfer
    between two processes either by explicitly setting up the pipe connection, or
    communicating through a named pipe residing in the system-file.

    - System IPC

    - Semaphores – an implementation of a classical semaphore model. The model also
    allows for the creation of arrays of semaphores.

    - Message queues – a connectionless data transfer model. A message is a sequence
    of bytes, with an associated type. Messages are written to message queues, and
    can be obtained by reading from the message queue, possibly restricting which
    messages are read by type.

    - Shared memory – a mechanism by which several processes have access to the same
    region of physical memory.

    - Domain sockets – another connection-oriented data-transfer mechanism that provides
    the same communication model as the INET sockets, discussed in the next section.


    ### 3.4.2 External Interface


    A signal is a notification sent to the kernel or another process. Signals are
    sent via the send_sig() function. The signal number is provided as a parameter,
    and well as the destination process. Processes may register to handle signals
    using the signal(function) function.


    File locks are supported directly by the Linux file system. To lock an entry,
    the open() system call can be used, or the sys_fcntl() system-call can be used.
    Locking areas within a file are done through the sys_fcntl() system-call.


    Pipes are created using the pipe() system call. The file-systems read() and write()
    calls are then used to transfer data on the pipe. Named pipes are opened using
    the open() system-call.


    The V IPC mechanisms have a common interface, which is the ipc() system call.
    The various IPC operations are specified using parameters to the system call.


    The Unix domain socket functionality is also encapsulated by a single system call,
    socketcall().


    Each of the system-calls mentioned above are well documented, and the reader is
    encouraged to consult the corresponding man-page.


    The IPC subsystem exposes calls to other kernel subsystems. Since wait queues
    are not used by user processes, they do not have a system-call interface. Wait
    queues are in implementing semaphores, pipes, and bottom-half handlers (as see
    section 3.3.3). The procedure add_wait_queue() inserts a task into a wait queue.
    The procedure remove_wait_queue() removes a task from the wait queue.


    ### 3.4.3 Subsystem Description

