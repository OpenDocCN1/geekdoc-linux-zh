    # 使用 SSH 进行多因子认证


    ## 将 Google Authenticator 集成到 SSH 登录中


    ### 完美的计划


    Google Authenticator PAM 模块允许你在各种 Linux 服务器（包括 SSH）上使用基于时间的 Google Authenticator
    密码。作者：Jesse Hagewood。


    多年来，多因子认证（MFA）一直是安全领域的热点，许多选项和软件服务现在已将其视为强制要求。要实现 MFA，用户必须提供两个或多个身份验证密码才能通过验证。这些因素包括你知道的、你拥有的、你所在的位置或你所做的。


    许多组织已转向 Google Authenticator，通过基于时间的一次性密码（TOTP）来实现 MFA。Google Authenticator 满足了“你拥有的”身份验证因素，因为
    TOTP 需要用户拥有的设备，即用户的智能手机或 iPhone。添加普通用户密码来满足“你知道的”验证因素，就提供了实现 MFA 的第二个因子。许多软件即服务（SaaS）提供商（如
    GitHub、AWS 和 Microsoft Azure）都支持 Google Authenticator 作为 MFA 的选项。


    从高层来说，TOTP 的工作原理是在服务器上生成一个密钥并与设备共享。TOTP 算法接收两个输入：密钥加上系统的 Unix 时间，结果是设备和服务双方都已知的一次性密码。Google
    提供了一个可插拔身份验证模块（PAM）google-authenticator-pam [1]，系统管理员可以将其集成到带有 Google Authenticator
    的各种 Linux 服务器中。作为一个 PAM 模块，它可以用于几乎任何具有健壮行业标准验证方法的 Linux 服务。在本文中，我将详细说明如何将 Google
    Authenticator 集成到 SSH 登录中。


    ## 使用 SSH 进行 MFA 的优势


    你会发现对于对互联网开放 SSH 或对大型网络开放 SSH 的服务器，MFA 是非常有用的。通过在 SSH 中添加 MFA，你可以缓解 SSH 服务器的暴力破解攻击，以及用户密码的影响。攻击者需要同时拥有用户的
    Android 或 iPhone 设备以及 Google Authenticator 密钥，才能通过 SSH 访问其用户账户。


    通常，互联网上的 SSH 暴力破解是通过密码检测的，添加 TOTP 可以消除这种类型的攻击。然而，如果怀疑密码泄露，或者密码似乎被攻击者发现，无论是否实现了
    MFA，都有必要更改密码。


