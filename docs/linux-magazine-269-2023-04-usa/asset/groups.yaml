    # # MakerSpace

    Four Raspberry Pi advertising and tracking blockers

    Trustworthy


    A Raspberry Pi with the right software filters out annoying ads and nasty trackers
    for end devices on our local network.


    By Erik Bwaldt


    ![](img/9114a5c8af7098772983e86dad17c99b_71_0.png)


    advertising on the Internet can be intrusive and annoying, with trackers on your
    web browser. For standalone workstations, unwanted content can be easily restricted
    or blocked by browser extensions. However, if you want to configure several workstations,
    setting up the extensions can take a great deal of time. Luckily, connect and
    configure them once on the local network. For the most part, the systems automatically
    update during operation, which avoids avoidable overhead for customization and
    regular updates. Manual configuration of the clients is also largely eliminated.
    The tools support various devices. In addition to computers, smartphones, tablets,
    and Internet of Things (IoT) devices are automatically protected.


    # ## Functionality


    The solutions presented in this article can be integrated directly downstream
    of the router on the local network so that all incoming and outgoing data runs
    through them. These appliances act as DNS servers in this process, which sets
    up a wireless network for you to access the Internet securely. Some of the solutions
    also integrate VPN servers and anonymize IP addresses. Beyond the VPN, the workstations
    on the internal can no longer be identified by their IP addresses. All of the
    solutions discussed are free software, and the hardware is usually based on a
    Raspberry Pi.


    One of the main advantages of centralized appliances is that you only need to


    # ## AdGuard Home


    The AdGuard Home [1] DNS server contains blocks that distribute advertising and
    spying on surfing. Known malicious domains can be blocked with lists: the software
    does not require a client on the end-device. Just install it on a Raspberry Pi
    and it protects the whole. As its base, AdGuard Home is an installed operating
    system, such as Raspberry Pi OS. This provides the give-small board computer (SRC)
    with a static IP to avoid the problems caused by an address change after a reboot.
    The application can then be installed and started with a single command at the
    Raspberry Pi''s terminal:


    # ## Author


