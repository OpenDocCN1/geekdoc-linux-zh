    # MAD DOG''S DOGHOUSE


    Linux can be a great option for users from Windows XP owners to a range of interests.
    BY JOHN "MADDOG" HALL


    ## A path to Linux


    It is not often that I write about work at the Linux Professional (LPI, or loco),
    but there are a couple of expensive projects spearheaded by LPI that are worthy
    of note. The first project is Upgrade to Linux (https://upgradelin.com), which
    was originally focused on Windows users who will be unable to upgrade Windows
    11. Either they need more RAM or another graphics card, or they are missing the
    TPM module, then Windows users will have to upgrade their hardware or in some
    cases buy an entirely new system.


    It is not certain that Windows 11 will abandon it. There are software features
    that might not make it to Windows 11.


    Of course Microsoft points out they will support Windows 10 for a long time, and
    by the time the customer returns, software Windows 11 will probably "naturally"
    have a newer machine. But there are still millions of people using Windows XP
    who have no, for one reason or another, to migrate to a version of Linux.


    It is reason for LPI and others to have upgrading guides.


    However, the Linux program does not just talk about the path from Windows 10.
    It talks about all of the advantages of moving to Linux even if you have enough,
    or (better yet) never getting stuck with Windows in the first.


    In this upgrade program, LPI realized there were a lot of questions that were
    asked at one time but are not about FOSS or what they might expect. FOSS, and
    especially Linux, are now mainstream and are worth your consideration as your
    upgrade path.


    The Upgrade to Linux program is not limited to LPI. There are many others, like
    Ubuntu, Red Hat, and opencloud who have also joined, and LPI invites others.


    The second initiative is Linux Clubs (https://www.linuxclubs.org/). Based on the
    great work of Steve Krof''s Aspen Academy, the Linux Clubs program makes it easier
    to start a club that makes learning about computers easier and fun. In an environment
    that is not tied directly to class work, the nature they place in an environment
    that encourages learning by doing.


    Examples of projects include recycling laptops and desktops for people (and institutions)
    that cannot afford new computers. Using free software on these systems avoids
    the issues of license cost so often when an older Windows system is transferred
    to a new user without buying a new license. Plus, the club participants can discover
    the software as they want to go, because all of them are able to use them.


    Linux Clubs foster interest from students who are not interested in computers.
    Because Free Software covers a great range of software tools, all students who
    have interest in photography, music, video, and other areas of study will use,
    and improve their skills in a range of areas at low or no cost.


    The Linux Clubs reminds me of how I started in 1969 while a student at Dublin
    University, having a difficult time with electrical engineering (11 and 800 amps)
    when I took a correspondence course in how to use an IBM 1130 computer in Fortran
    as cost up. After returning to Dublin to finish my final education, I found a
    small engineering lab that had a lot of computers in them. By practicing, I learned
    how to program these machines in assembly language. Using software that was freely
    available helped.


    I started the Linux Computer Club, which helped to start my career as a programmer
    and an educator.


    LPI has explained the concept of Linux by offering free software and showing potential
    Linux Club leaders how to get the hardware that they might need for the club participants.


    I like all of these projects, but I particularly appreciate how Upgrade to Linux
    evolved from a rant that I me one day to the LPI staff.


    Carpe Runt


