    # MakerSpace：四种树莓派广告与追踪拦截器


    可靠性


    一台配备了合适软件过滤器的树莓派可以为我们本地网络的终端设备过滤烦人的广告和恶意的跟踪器。


    作者：Erik Bwaldt


    互联网上的广告可能具有侵入性和干扰性，网页浏览器中还带有跟踪器。对于独立的工作站，可以通过浏览器扩展轻松地限制或阻止不需要的内容。然而，如果你想配置多台工作站，设置扩展将花费大量时间。幸运的是，只需在本地网络上连接并配置一次即可。大多数情况下，系统在运行期间会自动更新，避免了自定义和定期更新的额外开销。客户端的手动配置也被很大程度上消除了。工具支持多种设备。除了电脑外，智能手机、平板电脑和物联网（IoT）设备也能受到保护。


    ## 功能


    本文介绍的解决方案可以直接集成在本地网络路由器的下游，以便所有入出站数据都通过它们运行。在此过程中，这些设备充当 DNS 服务器，为你建立一个可以安全访问互联网的无线网络。某些解决方案还集成了
    VPN 服务器并使 IP 地址匿名。除了 VPN 之外，内部网络的工作站将无法通过其 IP 地址被识别。所有讨论的解决方案都是免费软件，硬件通常基于树莓派。


    集中化设备的主要优势之一是，你只需要配置系统一次。


    ## AdGuard Home


    AdGuard Home [1] DNS 服务器包含了用于拦截广告和监控浏览行为的规则。可以通过列表拦截已知的恶意域名：软件不需要在终端设备安装客户端。只需将其安装在树莓派上，它就能保护整个网络。作为基础，AdGuard
    Home 需要安装一个操作系统，例如 Raspberry Pi OS。这为这台小型单板计算机（SBC）提供了静态 IP，以避免重启后地址更改引起的问题。然后可以在树莓派的终端通过单条命令安装并启动应用程序：


    ```

    $ curl -s https://raw.githubusercontent.com/AdGuardTeam/AdGuardHome/master/install.sh
    | sh -v

    ```


    软件会自动检测你正在使用的硬件，设置系统，并在信息结束处提示如何访问工具的 Web 界面以及如何在提示符处控制应用程序。一旦你在网页浏览器中了指定的 URL，图形化设置向导就会引导你完成五个步骤的配置，要求你创建用户和密码以保护访问。


    向导为配置路由器和网络工作提供了详细说明。对于 AdGuard Home 服务器，你需要修改路由器上的互联网 DHCP 和 DNS 设置；否则可能会出现问题。完成基础设置后，登录网页浏览器并访问仪表板
    (1)。


    仪表板以图形视图显示所有已连接的客户端、DNS 请求、需求和过滤后的页面。下方是请求最多的域名表格，以及拦截频率最高的域名列表。AdGuard Home 不更新这些统计数据，但你可以通过点击“刷新统计”手动更新。


    关闭并重新打开管理界面后，除非你在基础设置期间使用了默认值，否则需要在 URL 中指定端口号。


    各种设置（例如控制过滤器）可以在“设置 | 通用设置”中启用。在此对话框中，你还可以指定让 AdGuard Home 如何处理拦截列表。“强制安全”选项可以保护预定义的网页。


    根据你的本地网络规模和数据流量，你可能想要修改本地过滤器。在“通用设置 | 配置”中，你可以定义服务器保留日志的时间以及哪些客户端 IP 地址匿名。


    在 DNS 设置中，你可以在现有上游 DNS 服务器之上添加额外的 DNS 服务器。通过多个服务器，服务器支持负载均衡并优先使用最快的服务器，但你可以通过点击选项左侧的单选按钮来更改此行为。


    如果启用了日志功能，AdGuard Home 会在查询日志中列出所有请求、请求的服务器以及请求消息，同时在客户端计数器中列出你正在访问的网络。你可以使用这些日志来重新调整过滤器。对于本地客户端，可以通过点击“拦截
    (2)”来阻止某些服务器。


    “过滤器 | DNS 拦截列表”包含两个带有 55,000 个域名的过滤器。勾选框可以启用某个列表，而“检查更新”按钮会更新已启用的列表。


    要添加额外的拦截列表，点击下一个对话框，你可以决定是否从预定义的拦截列表 (3) 中添加一个或多个项目。预定义拦截列表的选择对话框允许你包含带有广告和追踪域名的通用列表并集成恶意域名列表。


    图1：AdGuard Home 的启动非常简单。


    图2：AdGuard Home 的日志功能支持多域名拦截。


    ## eBlocker


    eBlocker [2] 是针对树莓派、树莓派 M2+ 和 VirtualBox 机的完整解决方案。eBlocker 起于一种软硬件混合解决方案。然而，制造商在
    2019 年发布了商业版 eBlocker 设备，同时继续维护软件版 eBlocker，使其成为一个遗留项目。


    eBlocker 的开发者规定树莓派至少需要 1GB 内存，但建议使用至少有 2GB 内存的第四代设备。系统需要一张至少符合建议 10 级的 microSD
    卡。在电源方面，该项目建议至少使用 3A。


    浏览器的某些功能无法与 eBlockerOS 结合使用。


    开始之前，下载最新的 eBlockOS 镜像（文件大小接近 740MB），使用归档工具解压镜像。结果是你可以使用 BalEtcher [4] 工具或命令将其传输到
    microSD 卡：


    对于带有 Windows 客户端的异构环境，你也可以针对你操作系统的漏洞启用专门列出的值。


    要创建 eBlockOS，请点击此“仪表板”。在设置中，你可以接受协议。完成设置后，你将进入仪表板。


    ## Pi-hole


    Pi-hole [5] 为树莓派设计，但也适用于 Intel/AMD 架构，它最出名的特点之一是需要至少 2GB 磁盘空间和 512MB 内存。Pi-hole
    将树莓派变成过滤所有数据包的 DNS 服务器。你还可以为不同设备保存配置文件（例如，拦截广告）。


    ## 作者


    Erik Bwaldt 是一位在英国工作的自雇 IT 管理员和技术作者。他为 IT 杂志撰稿。


