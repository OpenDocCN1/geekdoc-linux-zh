    \n![](img/9114a5c8af7098772983e86dad17c99b_1_0.png)\n\n# 2023年5月26日 -28日\n\nevents.opensuse.org\n\
    \n# 编辑部欢迎\n\n# 身份关乎\n\n亲爱的读者：\n\nFacebook 背后的公司刚刚宣布了一种新的高级订阅模式，你为自己的 Facebook\
    \ 账户付费，该方案包含了你目前没有收到的附加服务。我一直在想，订阅服务是否可能是像 Facebook 这样的媒体巨头的更优模型。毕竟，他们确实为订阅者提供了服务——也许要求人们付费比出售他们的数据并充当精准投放的顾问更好。\n\
    \n然而，在看到令人鼓舞的标题后，我失望地发现这种新的基于订阅的服务并不能让你的数据更加隐私，也不会让你的在线存在感降低认可。你 Facebook 页面的主要目的是确保你是你，而不是别人。该服务使用“验证徽章”，显示你已经提交了政府\
    \ ID，并确保你是你所说的人。其目标是防止某些冒充你的无赖用户。\n\n企业社交媒体文化（以及在此之前的微软层）占据了一个真空空间，在这个空间里，当你的想法完全合理（即使并不合理）时，他们会告诉你你没错，只是想错了。如果你必须支付额外费用来确保没有人在外面冒充你（基本上是盗取了你的身份），那么另一面就是，如果你不额外付费，你肯定没有别人在外面试图冒充你。\n\
    \n我想表现得公平。验证某人的身份并确保无人冒充确实需要资源，从这个意义上说，公司必须将这些成本转嫁给用户。但这正揭示了基础服务从根本上有多么缺陷。在 Facebook\
    \ 上使用名字本应遵守规则，所以这项新服务的本质是让你额外付钱让 Facebook 去执行它的规则，而如果你不付钱，Facebook 就不负责执行它的规则。\n\
    \n确保二十亿用户不互相冒充似乎是一项不可能完成的任务。实际上，我相信这是一项不可能完成的任务，而且每月 11.99 美元并不以实现。是时候承认 Facebook\
    \ 拥有一个无法持续的商业模式了，而不是让他们通过推出附加服务并声称问题可以通过消费者选择来轻松解决来摆脱困境？\n\n但对我来说，这些都是吃醋葡萄，因为我仍然很失望他们推出了一个付费服务，而不是利用这个机会解决\
    \ Facebook 的真实问题——即所有的跟踪行为。在这方面是有替代方案的，我们将探索去中心化联邦的免费社交媒体工具，它们将帮助你应对跟踪。至于冒充问题，目前还没有通用的解决方案，但可以看看关于\
    \ Mastodon 的文章，它可以在无需额外付费的情况下向你的粉丝验证你的身份。\n\n![](img/9114a5c8af7098772983e86dad17c99b_2_0.png)\n\
    \nJoe Casad,\n主编\n\n# LINUX MAGAZINE\n2023年4月\n\n# 封面\n\n- 58 **Easy!Appointments**\n\
    在方便的网页界面中管理客户预约。\n\n- 68 **SMath**\n整理你的工程方程和数学笔记。\n\n- 90 **教程 - ImageMagick**\n\
    需要更改 100 张度假照片的分辨率？你可以使用 GUI 工具点击一整天，也可以使用强大的 ImageMagick 工具包编写单个脚本。\n\n- 64 **Google\
    \ 身份验证器**\n使用多因素身份验证击败密码窃窃。\n\n- 81 **Linux 启动过程**\nLinux 启动过程是从电源按钮到那个熟悉的桌面的一系列渐进步骤。\n\
    \n# 新闻\n\n- 8 **新闻**\n- KDE Plasma 5.27 发布\n- Sparkly 6.6 可供安装\n- Escuelas Linux\
    \ 8.0 可用\n- LibreOffice 7 带有新功能和改进\n- Elementary OS 的下一个主要版本已发布\n- KDE Plasma\
    \ 5.27 Beta 准备好测试\n- Netrunner OS 23 可用\n- 为游戏构建的新型 Linux 发行版\n- System76 强化了热门企鹅笔记本\n\
    \n# 封面故事\n\n- 18 **联邦宇宙简介**\n为了访问社交媒体你必须放弃隐私吗？联邦宇宙的制作者说不。\n\n- 22 **diaspora***\n\
    你不需要 Facebook 也可以在网上与朋友保持联系；diaspora 提供了类似的无监视的体验。\n\n- 28 **Mastodon**\n开始使用微博客，与有你有共同兴趣的人互动，甚至通过你自己的\
    \ Mastodon 实例扩展联邦宇宙。\n\n- 12 **内核新闻**\n- 构建工具的最小版本号\n- Intel 和 ARM 安全问题\n\n- 36\
    \ **PeerTube**\nPeerTube 是联邦宇宙的视频平台，它提供了一种去中心化的、开源的观看视频和流式传输内容的方法。\n\n- 16 **FOSDEM\
    \ 2023**\n两年之后，一场 FLOOD 风风暴之一于 2 月初回到布鲁塞尔参加 FOSDEM 2023。像同学聚会一样，FOSDEM 的主旨节目充满了精彩内容。\n\
    \n- 41 **Pixelfed**\nPixelfed 为中心化的、算法驱动的商业照片共享服务提供了替代方案。\n\n# 评论\n\n- 45 **发行版\
