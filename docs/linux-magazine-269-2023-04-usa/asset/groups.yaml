    # ## Ubuntu OS 23 Available


    "Vaporware" 23 has been made available by Blue Systems (https://blue-systems.com/),
    arriving after two years since the previous milestone release. Unlike Ubuntu,
    23 migates to Debian Bullseye, which it also includes the 5.10.19 Linux kernel.


    In addition, Ubuntu 23 brings Plasma 5.20, Firefox 115, Firefox 102 LTS, Linux
    Kernel 7.0.4, VLC 3.0, PipeWire 1.2.4, GIMP 2.10, and more. But don''t think—you''ll
    be getting a stock KDE desktop experience.


    The developers have added a number of customizations to the desktop, such as an
    over-the-line menu, a unique theme that helps to out Simple Settings with Plasma
    Tweaks, a unified look for KDE and non-applications, GTK with standard K kords,
    Task Manager with expanding icons, Show Desktop hotspot in the lower right corner,
    and...


    10 APRIL 2023 ISSUE 269 LINUX-MAGAZINE.COM'
- md: '

    ## NEWS Linux News


    One addition is the inclusion of the VirtualBox guest additions, which makes it
    easier to run the virtual machine without having to manually install the software.
    This means, out of the box, you can resize your Netrunner virtual machine window,
    without having to install the guest additions.


    Find out more about "Vaporware" on the official Netrunner overview page (https://www.netrunner.com/netrunner-overview/)
    and download an ISO (https://www.netrunner.com/netrunner/download/).


    ## New Linux Distribution Built for Gamers


    PikaOS (https://pakos.ferreo.dev/) wants to be your new favorite desktop Linux,
    especially if you''re into games. This distribution is similar to Nobara (https://nobarapject.org/)
    offers instead of using Fedora as its base, it opts for Arch Linux.


    PikaOS means gaming "out of the box", so you don''t have to bother with complicated
    configurations or complex third-party app installation. You''ll find the best
    drivers installed or readily available via the Welcome App and a high level of
    compatibility for both software and hardware.


    PikaOS goes with the XanMod kernel, which implements custom settings to provide
    ultra-low latency and support for cutting-edge hardware. You''ll also find the
    package manager, which is a wrapper for managing APT packages.


    One thing to keep in mind, is that PikaOS doesn''t come with a large selection
    of pre-installed apps. Even the apps commonly used with gaming on Linux aren''t
    installed by default.


    Apps such as Steam, Lutris, OBS Studio, and are available to install from the
    Welcome App. This is the same location where you can apply updates, install hardware
    drivers, and add media codecs.


