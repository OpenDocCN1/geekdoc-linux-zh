    图 3：发布工具的方法之一。


    你必须指定一个实例进行登录——注意，你的名称必须以小写字母输入在单词之间，无论网页界面上如何命名该实例。在 `toot` 找到实例后，输入你的电子邮件和密码登录。为了方便以后访问，`toot`会将你的访问令牌存储在配置文件中，因此不再需要存储你的密码。连接到实例后，你可以使用
    `toot` 显示你的个人资料并列出账户。切换账户时，使用 `toot` 查看活跃账户列表。通过这些变体，你可以最多添加四个媒体附件。对于第一个附件，使用以下选项：


    ```

    --path/to/image.png --description "TEXT"

    ```


    然后为随后的附件更改图像编号。如有必要，你可以使用标志：


    ```

    --media image.png --sensitive

    ```


    发布推文后，你可以使用 `toot` 通知查看任何回复。


    ## 查看时间线


    在时间线中查看推文（toots）时，基础界面会显示最新的一条。你可以选择显示最少的一十二或整个列表来修改显示哪些推文。在每条推文的底部，你可以找到 ID 以及它是否已注册。你可以通过以下方式在
    Mastodon 上找到其他人：


    ```

    toot search "name"

    ```


    或者通过他们的 Mastodon 地址：


    ```

    toot search NAME@INSTANCE

    ```


    有了实例地址后，你还可以使用自解释性强的命令来点赞、静音或取消关注！要点赞一条推文，使用命令：


    ```

    toot favourite ID

    ```


    （英文拼写）。要删除推文，使用 `toot id`。


    ## 发布推文


    你可以在搜索中发布推文。最简单的方法（如图 3 所示）是：


    ```

    toot "MESSAGE"

    ```


    或者，你可以在你选择的文本编辑器中发布（图 4）——使用带有以下命令的 Vim：


    ```

    toot --editor vim

    ```


    在编辑器中正常保存并编辑推文，推文也会被发布。如果你更倾向于使用文本编辑器，可以将首喜的编辑器定义为环境变量（例如 `export EDITOR=vim`），然后你就可以直接使用以下命令：


    ```

    toot --editor

    ```


    | 命令 | 描述 |

    | :--- | :--- |

    | toot timeline --public | 公共时间线，仅限 Mastodon  |

    | toot timeline --tag | 带有 #photo 标签的推文 |

    | toot timeline --count NUMBER | 获取 NUMBER 条推文 |

    | toot --once | 不再获取更多推文 |


    图 5：推文机制。


    ## 深度命令行 — Mastodon CLI


    如果你决定撤销这些操作中的任何一个，可以运行相同的命令并前缀 "un"。例如，如果你决定不再关注某条推文，命令是：


    `toot unfollow ID`


    其余部分你可能自己就能明白。如有需要，运行以下详细摘要：


    ```

    toot COMMAND --help

    ```


    你可以从命令行执行所有基本功能，或使用 `toot` 启动 curses 界面（图 6）。curses 界面通过键盘命令导航。似乎很少有人担心如果你带着一整个装满生成的文本的气球去图书馆会发生什么。从理论上说，什么都没有丢失。现实中，除非什么也找不，否则一切都丢失了。


    感谢记得列出好的东西，而不只是坏的。例如我必须猜一下：


    | 键位 | 动作 |

    | :--- | :--- |

    | k | 向上移动推文列表 |

    | j | 向下移动推文列表 |

    | h | 显示视图状态 |

    | t | 在浏览器中查看当前推文 |

    | b | 转发或取消转发状态 |

    | f | 点赞或取消点赞状态 |

    | q | 退出 curses 界面并返回命令行 |

    | s | 显示敏感内容 |


    表 2：curses 界面


    ## 正确的应用


    尽管仍在开发中，但 `toot` 运行像一个定义良好的应用程序。它的命令逻辑清晰、一致且文档齐全，特别是对于处于开发早期的项目来说。如果你不熟悉 Twitter
    或 Mastodon，你应该很少需要学习基础知识。如果你熟悉它，你可能会以惊讶的准确度引导 curses。事实上，在在使用过 `toot` 命令行之后，curses
    界面反而变得更难使用了。人们在上面花费了大量心血。考虑到 Twitter 的事件，它可能是在正确时间的正确应用。


