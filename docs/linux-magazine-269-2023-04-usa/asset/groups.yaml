    Neural synthesis and effects


    ## DDSP-VST


    DSP is a unique audio synthesizer and effect plugin that works with your favorite
    editor or workstation, such as Audacity, Ardour, and Linux. It''s a kind of thing,
    that is the first native Linux compatibility. It is native on Linux, however,
    by applying a simple review in the GitHub repository. This positivity will grant
    you Linux-native VST library to drop into your VST folder (usually). With that,
    you''re free to explore what DDSP makes, and to generate a sound model derived
    from a neural network. Digital Signal Processing is what DDSP name refers to.
    An academic research project and computational capability that generates sounds
    from models. These model learn from example records to create instrument that
    preconfigures a collection of linear filters and sinusoidal oscillators to generate
    a sound closely related to the example. DDSP is also able to adapt to different
    datasets, and thus, lots of different characters, from natural sounds to purely
    frequency based ones. To understand any of this, it is easy to hear the output
    and create unique sounds.


    Some presets are included for the pre-trained models, and a collection of voices.
    The synthesis takes MIDI input and generates sounds that can be manipulated like
    a piano by dragging a rectangular filter across the grid of pitches. This dynamically
    adjusts the series of filters generating the sound to emulate mouth shapes and
    positions, for example, or different playing positions for keys. When this is
    controlled by a rectangular filter, such as a sound source or a MIDI input, the
    output sound will sound organic and natural, even if it doesn''t sound too similar
    to the source records. This is due to the complex interconnectability between
    all the elements built into the model which is calculated in real-time and not
    at all like what you get from a traditional subtractive synthesizer. It''s also
    monotonic; you might might need to combine more than one note at a time, but that''s
    perfectly normal for a normal lead or bass sound.


    The other interesting aspect to this plugin is that it can be used as an effect
    to process any audio sound through it. Clearly, the incoming audio amplitude are
    detected and used to dry the model characteristics applied to the incoming sound.
    The sound can then be manipulated in the same way as the synthesizer, using the
    rectangular filter to adjust the model parameters and amount of pitch shift. The
    noise alone can create great sounds, while other inputs can generate sounds anywhere
    between digital noise and scratch. Finally, a layer of professional reverb can
    be added to the output with inbuilt reverb. It is experimental, but also a kind
    of fun to play with.


    DDSP generates uniquely organic and evolving sounds that can be controlled like
    acoustic instruments.


    The project includes its web portal where you can drop own sound sources to generate
    neural networks to load into DDSP-VST.


