    “我的作品集”（My Portfolio）功能是 Pixelfed 最近新增的，你可以用它来创建你在 Pixelfed 上分享的照片作品集（图 4）。作品集具有不同的设计，并有一个专用
    URL (https://portfolio.pixelfed.com/username)，将你的作品集与 Pixelfed 账户的其他部分分开。这项功能使得
    Pixelfed 不仅可以与粉丝分享日常照片，还可以展示你最好的摄影作品。


    如果你想查看其他 Pixelfed 用户发布的照片，或者正在寻找要关注的摄影师，Pixelfed 可以为你提供服务。“本地动态”（Local Feed）视图显示你所在实例上的近期用户，而“全局动态”（Global
    Feed）则从来自 Mastodon 等其他 Activity 驱动的服务获取内容。说到这里，你不限于任何 Activity 驱动的服务。只需使用搜索框通过用户名查找某人即可。（此处原文存在大量重复，已根据功能语意整合翻译）。


    ## 结语


    尽管 Pixelfed 已经存在了一段时间，但仍然感觉更像是一个进行中的项目而非完成品。各个 Pixelfed 实例随着时间的推移将如何发展还有待观察。不过，作为竞争竞争，并没有阻止你在使用现有服务的同时尝试
    Pixelfed。


    如果你对在 Pixelfed 上展示照片感兴趣，你可能仍然想设置一个作品集来展示你最好的作品。简而言之，从小开始，看看什么最适合你。


