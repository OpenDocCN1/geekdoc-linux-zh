    # # Fediverse TV


    PeerTube, the Fediverse''s video platform, offers a decentralized, open source
    way to watch videos and live stream your own content. We''ll show you how to get
    started and even set up your own instance. By Paul Brown


    ![](img/9114a5c8af7098772983e86dad17c99b_35_0.png)


    The Fediverse community is a parallel Internet based on ActivityPub, a W3C-recommended
    standard for social media, and PeerTube [1] is the Fediverse''s video service
    for communities, and other organizations.


    As Mastodon, it would be understandable to think of PeerTube as a Fediverse drop-in
    for the popular, proprietary alternatives like YouTube. And you can use PeerTube
    that way, but you would be ignoring its merits and how it can deliver video streaming
    that takes control from powerful corporations back into the hands of users.


    Running a service on the scale of PeerTube requires an immense amount of bandwidth
    and storage, unless you decentralize the whole thing. To be clear, PeerTube does
    not offer an amount of media on the scale of YouTube. However, PeerTube scales
    needs with the amount of media it serves. By using peer-to-peer (P2P) technology,
    PeerTube shares the load over instances (servers run by Peer members). Counterintuitively
    with instances, the more viewers you have, the higher the load on the server where
    the instance is hosted, because the load is spread over more nodes in the network.
    In addition,


    PeerTube''sated nature makes it possible for one instance to offer visitors a
    much larger catalog of videos than it could if it were isolated and exclusively
    on its own storage.


    In this article, I''ll show you how to find a PeerTube instance to join, set up
    an account, live stream video, and even you can still run your own instance.


