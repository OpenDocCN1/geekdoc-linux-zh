    在编辑普通帖子时，你可以添加一张或多张照片。Pixelfed 立即允许你添加说明、将帖子标记为收藏、指定许可以及删除内容。Pixelfed 还支持图像的裁剪和调整大小。点击窗口左上角的箭头进入编辑界面。Pixelfed
    提供了几种很棒的布局，可以改善看起来平淡无奇的照片 (2)。


    ## 优点


    主流平台通过算法管理的时间线并不是坏事，但并不适合很多人。如果你更倾向于按照自然意图查看帖子，你一定会非常欣赏 Pixelfed 使用时间顺序线来展示你和其他人的照片。现在，没有人可以买断你的时间线，没有广告，也没有人在追踪你。你可以通过评论或点赞与帖子互动，但对帖子数量没有限制。你可以以私密或匿名方式发布帖子，因为没有“点赞”数，而分享可能是获得你关注的一种方式。这几乎是他们能做的一切。更好的是，如果你不在乎点赞和分享，你可以通过
    Pixelfed 实例禁用这些功能。因此，作为一个普通用户，你也可以找到一个这些功能完全由你决定的 Pixelfed 实例。


    另一个方面，Pixelfed 区别于 Instagram 的的一点在于它的开放性。开放性允许你走进一个花园并自由漫步，而无需担心何时看到照片。它也不会让第三方应用和服务的运行变得困难。通过其
    API 以及 Pixelfed 的特性，你可以轻松地迁移数据或离开该服务。


    ## 设置你的实例


    Pixelfed 的优势之一是你可以建立自己的实例。但如果你具备设置和维护 Pixelfed 服务器所需的技术技能，那么这种努力是值得的。想要为他人提供分享照片场所良好意图很快就会遇到现实的阻碍。例如，维护服务器需要一定程度的技术水平（因为任何涉及硬件的东西通常都很费力）。确保运行时间和维护的负担完全落在你身上。一如既常，投入越多，收获越多。甚至在你定义好想要自己遵守的一系列规则之前，你就已经陷入了问题的深渊。什么能让你找到许多问题的答案？什么是本质是什么？你想建立什么样的冲突机制？你可能会受到诱惑，但这是成功的巨大代价。简而言之，只有当你拥有资源、时间，并且愿意投入精力让你的社区繁荣时，运行自己的
    Pixelfed 实例才有意义。


    ## 缺点


    在决定让 Pixelfed 成为你帖子的家之前，你需要考虑几点。Pixelfed 实例由志愿者维护而非商业实体维护（对应“设置你自己的实例”框）。因此，取决于志愿者的努力和捐赠。


