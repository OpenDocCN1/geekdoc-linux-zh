    \ also shows which upstream servers were used. At the very bottom there is additional\
    \ information about clients in the network.\n\nOne key feature of Pi-hole is the\
    \ ability to group individuals and separate filtering traffic. For example, you\
    \ can group tablet PCs or smartphones that are used by a separate group and define\
    \ uniform rules for them. This filtering option eliminates the time spent configuring\
    \ each individual device.\n\nYou can access your Pi-hole web interface from any\
    \ browser on the local network. `http://pi-hole/admin` or the Pi-hole IP address.\
