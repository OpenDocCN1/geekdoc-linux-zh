    # EndeavourOS Cassini 22.12 and Debian 11.6 “bullseye”


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/9114a5c8af7098772983e86dad17c99b_5_0.png)


    # EndeavourOS Cassini 22.12 64-bit


    # Debian 11.6 “bullseye” 64-bit


    EndeavourOS is Arch What Ubuntu is to Debian: a desktop-centered derivative that
    has gained its own popularity. Unlike Arch, EndeavourOS features an easy-to-use
    installer, as well as desktop environments and five tiling window managers. Like
    Arch, it is a rolling release faster than the general release.


    EndeavourOS Cassini 22.12 introduces a number of new features. Among them is a
    choice of bootloaders, a new EFI installer, automatic detection of Windows when
    multitasking, and a redesigned installer, especially for the minimal netinstall.
    In addition, several desktops have new icon sets, including Plasma, Cinnamon,
    and Budgie. EndeavourOS officially supports the Framework Pro laptop with hardware
    and driver support.


    If your priority is cutting-edge software in a usable format, EndeavourOS is a
    prime candidate for your choice of distribution.


    Debian is among the oldest and largest Linux distributions. To its stability and
    security, two-thirds of all the distributions listed on DistWatch are based on
    Debian, including Ubuntu and Linux Mint.


    Debian 11.6 is the latest point release from the stable repository (aka “bullseye”),
    the latest general release. Like all Debian, it is not the most cutting-edge distro.
