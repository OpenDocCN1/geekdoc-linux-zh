    # 回归线下参加 FOSDEM 2023


    # 回归正轨 (Back on Track)


    在经历了两年的在线活动后，FLOSS 支持者们在 2 月初回到布鲁塞尔参加 FOSDEM 2023。这就像是一场同学聚会，节目充满了惊喜。Richard Kiistään
    著


    > FOSDEM 2023 [1] 在布鲁塞尔举行，FOMO（错失恐惧症）是热门话题，不仅对于没能参加活动的人，对于与会者也是如此。这座比利时首都吸引的观众比新冠疫情前的几年少了一点，但回归了直播，会议举办的热门话题迅速填满了现场。


    Mastodon，你绝对想看视频 [3]。Mastodon 实例不仅需要一定的规模才能成为可靠的基础设施，还面临着法律陷阱。私人用户需要保持海量数据的安全，同时让志愿者员工对帖子进行审核。其他人还需要小心来自
    Fediverse 的哪些 Mastodon 实例集成到他们的平台中，哪些没有。此外，他们还需要正确处理账户的方法。但最后，不运营一个项目感觉就像这种持续性的服务。


    例如，分析了 180 个项目的软件，这些项目旨在确定、控制或优化建筑的能源需求。建筑的排放是气候关注的一些最大的驱动因素之一。结果令人兴奋。


    虽然大多数项目都使用开源组件，但只有少数项目（约 3%）发布的项目计划发布他们的软件。原因范围从技术到文化考量不等。通常，简单的手段意味着软件保持不变，


    # 第一个实例 (The First Instance)


    Mastodon 上出现了大量的社区和关于 FOMO 的表述，那里 #Fediverse 话题在一段时间内非常流行。随后 Elon Musk 购买了 Twitter，最终经历了一阵活动高峰。最终加入
    Mastodon 实例 Itch.io 的开发者 Kris Nó 描述了他的生活如何每周发生变化。他的计划是建立一个独立的 Mastodon 实例 [2]，让他随着成千上万新用户逐渐迁移到该实例而起飞。


    当达到 30,000 名成员时，诞生于 Nova 地室的强大硬件变得过时了。是时候选择服务了，他选择了 Nova Goetz。开发者保护条例（GDPR#forever）可能也是迁移的因素之一，他和其他开发者需要回答一些关于私有管理
    Twitter 的自由的问题。Nova 在他的主旨中指出，存在着陷阱。如果你在考虑建立一个……


    根据 Nova 的说法，该实例的技术运营每月费用约为 1,000 欧元。


    根据 Nova 的说法，解决方案是新成立的 Nova 基金会 [5]。实例正在寻找成员来帮助资助维护费用。这似乎是合理的：当用户数据和广告不是问题时，你需要找到如何以可持续的方式运营一个志愿者项目。


    重点是用户，许可倾向保持不变，或者开发者担心从那些出于商业原因保留财产的人那里继承任务。尽管有这些，仍然认为在该领域使用开源软件更好，例如 CAD 软件或仿真软件用于


    # 空间、道路与数据中心


    # 新可持续性


    可持续性在今年的 FOSDEM 也扮演了核心角色：关注化石燃料的使用和应对气候变化。组织者分配了一个专门的专题来解决这一紧迫问题，并占据了主舞台。


    NASA 参加了 FOSDEM（图 1）。NASA 正寻求利用其数据来帮助对抗气候变化，例如，在电力项目的范围内 [6]。Asterm Crawford 解释说，该机构正向开放，越来越多地采用开放
    API 和开放访问模型。然而，这并非完全明确。根据美国政府的一份声明，在柏林工业大学 Felix Rehn 的研究项目中，对于


