    # # NEWS

    Linux News


    When you install and boot elementary OS 7, there are no obvious and major changes
    to greet you. In fact, the desktop UI looks much more in line with what the team
    has released in the past, and that''s a good thing, that the elementary OS is
    one of the finest on the market.


    As for changes, you will find more engaging app descriptions in the AppCenter,
    an easier app update process, better support for sideloading and alternative app
    stores, and a more responsive AppCenter.


    Version 7 also supports web apps, making it easier to launch them from the applications
    menu and even use their own settings (such as privacy controls).


    Other new features include the ability to send feedback directly to the developers,
    a more streamlined interface and outstanding Onboarding app that makes it easier
    for you to configure the UI theme. You can even configure automatic updates for
    both free and paid apps.


    The Mail app has a more modern UI as well as a unified inbox that supports Microsoft
    accounts.


    The Music app was also completely rewritten from scratch to make it much quicker
    when queuing and playing audio from local files.


    For more information on the latest release, check out the release notes (https://blog.elementary.io/os-7-available-now)
    and download an ISO (https://elementary.io) for installation.


    # ## KDE Plasma 5.27 Available


    KDE Plasma 5.27 was recently announced (https://kde.org/announcements/plasma/5.27.0-announce/)
    and is aimed at testers, developers, and bug hunters. One of the more exciting
    additions is the new Bigscreen version, which makes the KDE desktop available
    for tablets.


    There is also a new addition to the Display Configuration, which now appears in
    System Tray by default when you have more than one monitor connected. The Big
    Multi-Monitor focus works with multiple screens and gives you fine-grained controls
    when you have three or more monitors.


    The Tiling System is already ready for testing. Using the Meta-T keyboard combination,
    you can launch the tiles to arrange where windows are placed.


    Another very addition is called Plasma Welcome, which helps you make of initial
    setup tasks, such as connecting online accounts. Plasma Welcome is an elegant,
    simple wizard that would make new users feel at home on the desktop.


    Flatpak gets some added attention in the new release by way of a New Settings
    module, called Flatpak Permissions Settings.


    This new feature gives you the ability to control permissions for every installed
    Flatpak app, including basic permissions (such as Internet connectivity, remote
    access, and Bluetooth), filesystem access, and more.


    You can download one of the many images to test (https://community.kde.org/PlasmaLive_Images/)
    KDE Plasma 5.27 beta.


