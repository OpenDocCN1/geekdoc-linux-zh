    A less-obvious real-life example is that a lot of people on Mastodon have a bit
    tired of all the mentions of Twitter, so a warning with “Birdast Rant” will tell
    people that they should skip this one.


    Again, it is Mastodon to use this feature generously to avoid spoiling the day
    (or wasting the time) of fellow users.


    # Verifying


    Your prowess will eventually build up your following. But with fame comes envy!
    And with envy identity theft, or at least someone trying to pass off as you. Notice
    that, if you are using @JaneDoe on one example, you can create an account @JaneDoe
    on another server and follow your followers [6].


    However Mastodon has an ingenious workaround to verify your identity to your followers.
    It helps you with colored checks, so please use your website.


    Preference (gear icon at the top of the screen) and then there is a section labeled
    Profile metadata. You can put your website here, but most users use it to provide
    links to their blogs, websites, Paweons, and so on. Use one of the rows to write
    in the URL of your profile website or blog (7).


    Under Verification, to the right of Profile metadata, you can click on HTML Copy
    to include in your clipboard, and then open your page editor. For inserting the
    string in the <header> — <header> section of your page.


    (For WordPress, you can use a plugin like WPCode (7); WPCode allows you to insert
    snippets into any part of your site. Once installed, it adds to the sidebar: Code
    Snippets, Header & Footer).


    Save your changes on your website, and after a few minutes, the link on your profile
    will show up with a green check (8); thereby verifying you as the owner of the
    linked site and Mastodon account.


    **Figure 7:** Add your website or blog to profile to verify the identity of your
    account.


    # Interoperability


    One of the greatest aspects of Mastodon is how it plays nicely with the rest of
    the Fediverse. Take example for Pixelfed [8], a Fediverse service for photos,
    somewhat akin to Instagram. Look around and you will notice that they follow the
    same name as Mastodon: [@name]@[instance].


    This means you can follow Pixelfed account from Mastodon (and vice versa) (9),
    and you can view your favorite photos, which will show up in your Mastodon feed
    (see the article on Pixelfed in this issue).


    Posts will be boosted and linked in Pixelfed too. If you send a reply to a post,
    it will show up in Pixelfed too.


    ![](img/9114a5c8af7098772983e86dad17c99b_30_2.png)


