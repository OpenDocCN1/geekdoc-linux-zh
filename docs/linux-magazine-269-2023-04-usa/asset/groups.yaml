    # MAKESPACE SMath


    To make things little more present, SMath shows variables, calculations, in blocks
    and units although this feature is adjustable. The final result of a calculation
    can be presented in fractions, units, or simply the numeric value.


    example, the plot is configured to show the f(x) quadratic equation. You can quantify
    the number of intercepts on curves (Figure 8) by manually solving the quadratic
    formula for y=0, or with SMath solve(2) function. To insert this type, press the
    tab key to show dropdown solve(2). To find the area, the result must be defined
    as a new variable (e.g., MyRoots checks whether MyRoots variable is valid (i.e.
    has roots). If roots found, the limits are passed to integral function (Integral
    and derivative functions are found in SMath panel). If no roots found, the string
    "Equation doesn''t cross x-axis" is assigned to the.


    ## Solutions


    SMath also offers useful features such as widgets and plotting, as well as conditional
    code. although needed to solve in high school and first-year courses is a function
    easily defined by a quadratic equation. The next example solves this problem and
    highlights some of keys that can be used in SMath. Figure 11 shows the final SMath
    example, with the widget and conditional code to find the x intercepts and area
    under parabola with a quadratic equation.


    The first step in solving this is to define variables. Using interfaces such as
    sliders can be defined by adding the Insert menu into toolbar (Figure 6). Slider
    widgets and toggle functions Plotting is a quick way to check the number of intercepts
    for an equation. To add a plot, use Plot (2D). Once a plot is dropped onto workbook
    it can be resized and repositioned. Added logic can handle intercepts for the
    area under the curve, used if statement is checked for valid (If). An solve(2)
    function returns two intercepts where the curve crosses the x-axis. If you don''t
    change the curve, the result will be defined or a 0 error.


    Figure 9: Changing calculation settings.

    Figure 11: Slider, plot, and example code.


    70 APRIL 2023 ISSUE 269 LINUX-MAGAZINE.COM


    ## Beam load calculation bearing two supports


    of the examples is a beam support reaction (Figure 12), which displays a diagram
    of a beam that automatically updates with just given values. I was able to make
    use of this example to help clarify some questions in one of my civil engineering
    classmates.


    | Input-data: | |

    |---|

    | n = 3 | Beam length |

    | L1 = 60 cm | Distance to the first support |

    | L2 = 2 m | Distance to the second support |

    | List of the Point Loads | options of a single Load |

    | (every column) | |

    | F1 = 1.5 kN | Distance to the Load |

    | 50 cm 1.1 m 2.6 m | |

    | List of the Uniform Loads | |

    | (every column) option of a single Load |

    | q1=4 kN q2=10 kN q3=15 kN | Distance to the Load |

    | 10 cm 10 m 2.2 m | |

    | 15 cm 40 cm 30 cm | |


    ## Summary


    Spreadsheets like Excel are great tools, but they are weak at clearly presenting
    complex equations. SMath, on the other hand, presents equations in conventional
    forms and has worksheets with customizable layouts.


    As university student, I spent lot of the past, I used static tools such as LaTeX
    [3] or the Microsoft Word Editor to build calculations. Now I find the dynamic
    presentation of complex calculations in SMath can be a huge time saver.


    ## Calculation:


    ```

    cols(F1) = L1-F - 2K*F

    cols(Q1) = q1 - q2*L1-sum k=1 to2 (q2-L1-k*L2-L1)

    cols(F2) = L2-F - 2K*F

    cols(Q2) = q2 - q3*L2-sum k=1 to2 (q3-L2-k*L3-L2)

    cols(F3) = L3-F - 2K*F

    cols(Q3) = q3

    ```


