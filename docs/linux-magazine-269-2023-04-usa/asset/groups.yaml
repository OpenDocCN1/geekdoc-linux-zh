    Harald Andersen pointed out that the ICC compiler is binary soft that it was deprecated.
    He ran ic -v and the got, "remark#10441 The ICC(I) C++ C Compiler will be deprecated
    and removed from product release early of 2023."


    He concluded, the logical approach is to unconditionally set by default, so to
    fix this CPU by using the flag. With a baseline, we can see if the way they were
    in ICC code works. With a baseline, we can see if the performance cost is worth
    the constant-time execution.


    Zitter Jaeger said pointing out that these ''CPU flags'' are actually specific
    to a given model of CPU - in other words, the kernel handles them differently
    and for each specific CPU model implement the constant-time execution flag.


    Peter suggested that it would be better to set and use the flags by specific processes,
    rather than globally


    There was a more discussion, and Mashiro Yoshida posted a patch to remove things
    that are related to GCC and clang. But until it happens then the ICC compiler
    looks like it will go away.


