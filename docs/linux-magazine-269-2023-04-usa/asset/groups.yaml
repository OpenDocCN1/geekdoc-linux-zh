    \ `clip copy RANGE`，README 文件的内容就会复制到内部剪切板。在末尾加上一个数字\n\n```\n$ cat test.txt |\
    \ clipboard copy\n# where are the bytes in clipboard 0? 20:53:06\n# This is test\
    \ clipboard contents\n# the clipboard is already empty. 20:53:09\n# like to replace\
    \ it? Add all or a to use this decision for you: [y/n] 20:53:18\n```\n\n剪切板可以使用\
    \ FHSFS 系统和共享目录来复制和粘贴你的内容。该命令在任何有 clipboard 的地方都可工作。输入 `clip paste` 将将内容输出到相同或不同的文件中（你可以从提示中选择），而\
    \ `show` 命令将显示你所有复制的内容。可以设置环境变量来记住设置，并如果你想与远程会话共享，可以允许一个持久化目录。最棒的是，它直接与 X11 剪贴板交互，无需任何额外配置，Wayland\
    \ 也支持它。\n\n## 项目网站\n\nhttps://github.com/Blackcladays/Clipboard\n\n## 命令运行器\n\n\
    ### just\n\n命令运行器很奇特，因为自动化运行命令的方法有很多。Shell 是最简单、最广泛使用的。如果你能把命令放入 Shell 中，你就可以把它变成一个重复脚本。但它们也容易出错，而且在处理参数、位置或其他系统方面并不特别聪明。如果规模非常大，需要一套用于运行和控制命令的沉重语法，那么\
    \ `just` 就是另一个例子，它桥接了这两个世界的鸿沟。它让自动化比写脚本更简单，既快速又像 Makefile 一样具有可性。\n\n命令分组在一个名为\
    \ `jest` 的类 YAML文件中。这些配方（recipes）易于构建，而且非常强大。每个配方以一个示例命令作为标签，运行命令后跟该标签将运行它们的所有内容。它包含了配方中的参数和结果。但这仅仅是个开始。配方还可以包含参数、变量和内置函数。你还可以使用循环和表达式，这对于迭代和解析输出特别有用，而无需使用繁琐的\
    \ Shell 脚本模板。所有这些内容都记录在项目的 README 文件中。\n\n```\n$ cat jest 00:14:33\n# use python\
    \ to execute recipe lines and backs\nset shell = \"#python3 -c\"\n# use print\
    \ to capture result of evaluation\nos = print(\"foo + 4\")nfoo:\nprint(\"snake\
    \ snake snake.\")\nprint(\"{foos}\")\n00:14:43\n#print(snake snake snake.)\nsnake\
    \ snake snake.\nprint(\"foofoofoofoo\")\n-foos=\n00:14:47\n```\n\n## 项目网站\n\n\
    https://github.com/casey/jest\n\n尽管功能涵盖广泛，但你自己却很容易理解和使用。不像 Makefile 需要在开始之前就掌握晦涩的语法知识，它非常易用。如果你发现自己在反复运行相同的旧命令（而这些命令在许多发行版中又不同），`just`\
    \ 可以提供更实用、更愉快的体验。\n\n## CD 抓取器\n\n### Whipper\n\n这个命令行工具的名字似乎让人联想起 1980 年代的 DevOps：“Whipper”（抽鞭者）这个名字很令人惊讶，考虑到我们正在考虑使用高科技——音频\
    \ CD 格式。但更有可能、也更没意思的是，这个名字本身代表将数据从 CD 复制到你的电脑。你可能会想，为什么 Whipper 在世纪的第三十年仍然有意义？有两个答案：第一是流媒体服务匮乏，很少有\
    \ CD 音质的数字音频。大多数通过低压缩传输，而 CD 音频提供了辉煌的、未压缩 16 位值，每秒 44,100 次。第二是即使它在 CD 上，你也无法对其进行压缩或流式传输。如果你可以，它可能已经过重制了。这使得许多原始\
    \ CD 定义变得过时，仍然值得抓取（ripping）。\n\n抓取过程本身也异常地复杂。因为音频数据在盘片上是数字编码的，读取它的光驱器可能会引入错误。虽然有一些纠错，但不足以保证音频数据的完整性，这意味着需要多次读取并取平均。\n\
    \nWhipper 是一个专注于准确而非速度的 CD 抓取工具。你可以使用 -h 获取子命令帮助。\n\n```\n$ whipper -h [a] [b]\
    \ [c] -e (never,failure,success,always)\n\n  record requests for playback\n  record\
    \ error requests\n  -e (never,failure,success,always)\n  handle drive\n  handle\
    \ errors\n  handle drive events\n  handle data events\n```\n\n如果你能找到 CD 驱器，Whipper\
    \ 就能抓取你喜爱的 CD。\n\nWhipper 执行“准确重于速度”，它可以检测隐藏轨道、执行离线记录，并正确命名和标记元数据。它还可以使用 AudioRip\
    \ 的驱动器数据设置基础驱动器属性，以纠正你通常通过得到的驱动器名称和参数。如果你想抓取音频质量，最大的问题可能是找到一种可以读取音频 CD 的光驱方法。\n\
    \n## 项目网站\n\nhttps://github.com/whpper/wipper\n\n## YouPlot\n\n标准或特定的格式。虽然输入格式基于制表符分隔的值\
    \ (TSV)，但它既灵活又可配置。默认情况下，它将使表格列代表 x 轴，第二列代表 y 轴。空格是默认分隔符，但你可以将其改为任何其他字符，以及用于轴的颜色。单列也可以被解析并以折线或柱状图绘制。\n\
    \n考虑到我们在命令行中处理数据的方式，惊讶的是帮助可视化的工具如此如此。除了 ASCII 字符，命令行在输出方面有自己的局限性，这可能是一个挑战。我们可以通过将数据管道到\
    \ YouPlot 来提供数据。YouPlot 是一个简单的命令行工具，可以使用 Ruby 的 gem 管理器轻松安装，使用也同样简单。首先，安装项目 \"\
    YouPlot\"，其可执行文件是 python，可能是为了减少绘点时的打字负担。命令可以从任一处获取输入\n\nYouPlot 提供了许多图表方法，包括柱状图、直方图、散点图和箱线图。它们看起来都极了，使用\
    \ Ruby 生成 ASCII 表格或提取数据并将其绘制到输出中是非常神奇的。输出结果非常棒，对于从命令行快速准确地获取数据真正有用。关于它的 README\
