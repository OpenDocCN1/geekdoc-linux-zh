    # 封面故事


    diaspora 是一种更常见的方法，特别是在朋友群体中。“维度”功能的多样性意味着关系并不总是平行的。例如，你可能会将某个用户放入你的“朋友”组中，但该用户可能会将你放入“工作同事”组中。这意味着你们中的每人看到的都可能是不同的内容流
    [12]。


    如果你搜索想要联系的名称或 diaspora ID，只需添加他们，然后将该联系人添加到自己下。你还可以将用户添加到某个维度个人资料（as profile）中。当用户出现在搜索结果中时，点击链接查看用户的个人资料。点击个人资料页右上角的按钮将该用户添加到你自己。


    你还可以启用邀请其他用户。任何搜索结果中的链接都会指向用户。你也可以点击自己个人资料页侧边的*邀请*（Invite）朋友链接（第 6 页）。


    # 缺点


    2014 年，diaspora 遭遇了糟糕的媒体关注，当时 IBS 成员成功地建立了他们的 diaspora 节点（pod），用于传播极端主义材料。开发者们从未真正利用好该网络的去中心化特性，但鼓励（节点管理员/podmin）从社交媒体上添加自己的帖子，而许多人确实这样做了
    [13]。


    全国范围内的功能并不适用于所有人。一组在开放空间工作的人类也可以建立自己的私人新闻共享，获取来自西方通讯社和其他具有关联关系的公民的新闻。以安全的方式使用
    diaspora 需要努力以及一个信赖的节点。


    将 diaspora 构建为一个开放的社交网络仍处于开发阶段，每个节点管理员是否启用某些功能仍有待定 [14]。目前无法与 diaspora 用户进行实时聊天。与
    Facebook 不同，没有办法在群组与其他用户交流或查看其他用户在相册中的照片。diaspora 团队计划使用 #tag 功能来对帖子进行分组，这在我 2017
    年之前的之前的文章中提到过，看来 [15] 当我们觉得这些功能已经实现的单体社交网络时，diaspora 使用将会好得多。尽管如此，它仍然存在这些局限性：参与的人越多，新界面上需要的工作就越多。


    一些贡献者已经实现了软件联邦化，该软件已经具备了这一能力。联邦协议（Federation protocol）[16] 仍然提供了 Mastodon 和 Fediverse
    服务使用的解决方案，这似乎很遥远。diaspora 对孤立的渴望意味着节点被设计为处于孤立状态，开发者解释说这并不是该网络的用途 [17]。这很遗憾，因为
