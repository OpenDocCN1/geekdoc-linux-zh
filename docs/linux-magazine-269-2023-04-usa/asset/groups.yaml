    预训练模型包含了一些预设和一组音色。合成通过 MIDI 输入并生成声音，你可以通过在音高网格上拖动矩形滤波器来像钢琴一样操作声音。这动态地调整生成声音的一系列滤波器，以模拟口型和位置（例如），或按键的不同演奏位置。当由矩形滤波器（如声源或
    MIDI 输入）控制时，输出声音将听起来有机且自然，即使它听起来与源记录不是太相似。这是由于模型中构建的所有元素之间复杂的互连性，这些是实时计算的，与你从传统减法合成器中得到的完全不同。它还是单调的；你可能需要同时组合多个音符，但对于普通的主音或贝斯音来说这是完全正常的。


    该插件的另一个有趣方面是，它可以作为效果来处理任何音频声音。显然，输入的音频幅度会被检测并用于将模型特性应用到输入的声音上。然后可以像合成器相同的方式操作声音，使用矩形滤波器调整模型参数和音高偏移量。仅噪声本身就能创建很棒的声音，而其他输入可以生成数字噪声和刮擦声之间的任何声音。最后，可以为输出添加一层内置的专业混响。它是实验性的，但也是一种好玩的。


    DDSP 产生独特有机且演化的声音，可以像声学仪器一样控制。


