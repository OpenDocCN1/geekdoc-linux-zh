    # LINUS 启动过程


    # LINUS 之声


    ### 理解 Linux 启动过程

    ### 启动训练营


    如果你想排查启动问题，你需要清晰了解 Linux 是如何启动的。作者：ALI IMRAN NAGMORI


    他的文章解释了内核加载的过程。从更技术性的角度来说，它解释了内核如何进入内存，以及在第一个过程中它实际做了什么，例如像 BIOS 本身、CPU 寄存器、MBR
    以及计算机所需的所有其他内容一样进行检查。在通过 POST（开机自检）后，系统会显示消息并在需要时安装所需的驱动程序 [2]。


    ### 启动过程


    在高级别，Linux 启动过程通过下面描述的五个步骤。有些文本将其描述为四或六步；然而，基本机制保持不变。每当你启动关闭的系统或已运行的系统时，启动过程都会开始。


    无论操作系统或标准（BIOS 兼容），计算机系统都使用经典的 BIOS/MBR (1) 启动过程或现代的 UEFI/GPT 启动过程。UEFI 固件管理启动系统，但启动方法和设置各不相同。


    ### 步骤 2 加载 MBR


    在完成首次启动检查后，BIOS 将在可用磁盘中找到主磁盘并扫描前 512 字节。启动设备位于主引导记录 (MBR) 中。MBR (2) 是一个 512 字节的区域，包含
    446 字节的引导加载程序、64 字节的分区以及两个字节的启动签名。最初，BIOS 并不感知文件。因此，MBR 位于磁盘上的特定位置，即启动磁盘的首扇区。每块磁盘上都有
    MBR 分区。


    ### 步骤 3 引导加载程序阶段


    加载 MBR 后，系统执行 446 字节的主引导加载程序。代码存储在 MBR 的开头。引导扇区位于此位置。引导加载程序通常被称为 Stage 1。这段代码太小，无法运行任何函数，但它通过加载和执行包含内核代码的分区来简化问题。Linux
    系统最常见的 Stage 2 引导加载程序是 GNU 统一引导加载程序 (GRUB)。


    ### 基于 BIOS 的启动


    经典的 BIOS/MBR 启动过程（如图 1 所示）遵循五个步骤：BIOS、POST、加载 MBR、引导加载程序阶段、内核以及启动。


    ### 步骤 1 POST


    BIOS 位于计算机的闪存中并执行开机自检 (POST)。这与所有操作系统有关。POST 是一系列测试，以确保计算机硬件运行正常、可用且完整性。


    图 1：传统的 BIOS 启动序列。


    图 2：MBR 块。


    LINUS-MAGAZINE.COM

    第 26 期 2023年4月


    Stage 2 引导加载程序的主要目的是加载 Linux 内核（磁盘镜像），通常是 /boot 文件系统，然后将其解压并加载到内存，通过 GRUB 配置文件将系统控制权交给内核以启动。如果未设置安全启动（Secure
    Boot），引导管理器将导致系统使用启动。而不是使用预设顺序，你可以选择操作系统来启动。你可以使用 efibootmgr 来指定你的选择。当有多个启动设备（可加载内核）时，UEFI
    管理器根据设置的启动顺序选择初始化哪个 ESP。


    ### 基于 UEFI 的启动


    对于 UEFI 系统（图 3），五个步骤包括 UEFI POST（带有 UEFI 安全启动）、引导加载程序和内核阶段。


    ### 步骤 1 UEFI POST


    UEFI 固件执行分区的 EFI，寻找外围设备和硬盘并对其进行设置。


    ### 步骤 2 使用 ESP 启动


    UEFI 利用分区 EFI，其中包含引导代码，系统 EFI 分区 (ESP) 是 GPT 上的一个特殊分区，用于搜索引导加载程序等实用程序。通常，ESP 挂载在
    /boot/efi。因此，boot/efi 是许多 EFI 目录树的链接点。UEFI 寻找一个名为 ESP 的唯一 GUID 分区。当有多个启动设备时，UEFI
    管理器根据设置的启动顺序选择初始化哪个 ESP。而不是使用预设顺序，你可以选择操作系统来启动。你可以使用 efibootmgr 来指定你的选择。


    ### 步骤 3 UEFI 安全启动 可选，UEFI 引导管理器确保验证安全启动是否开启 [7]。


    ### 步骤 4 内核阶段


    内核启动后，初始化系统内存并挂载根目录。最后，它启动 /sbin/init 进程，它是旧 SysVinit 的替代者，是系统上运行的第一个进程（PID 为
    1）。


    ### 步骤 5 内核阶段


    最后一步是启动操作系统（内核）。内核随后为系统的其余部分做好准备。内核后的过程对于 UEFI 保持不变。


    ### 步骤 5 启动过程


    在此处，systemd 管理用户空间并将系统提升到运行状态。例如，它挂载文件系统并启动其他服务。结果，此任务可以在几秒内完成 [6]。


    ### UEFI 与 BIOS


    现代 PC 使用 UEFI 是因为它支持超过 2TB 的硬盘、启动速度更快且具有更好的安全特性。UEFI 优于 BIOS。然而，并非所有主板都支持 UEFI
    配置。此外，某些平台提供类似 BIOS 的平台。通过这样做，UEFI 固件变得独立于任何特定制造商。对于特定的 UEFI 平台，固件不需要担心为多个启动过程初始化操作系统。这些设备在操作系统内部进行初始化。结果，此任务可以在几秒内完成。相比之下，该任务可能需要
    10 秒才能工作。


