    # Introduction to the Fediverse


    ## Social Time


    Do you have to give up your privacy to access social media?

    The makers of the Fediverse say no.


    *By Joe Casad*


    ![](img/9114a5c8af7098772983e86dad17c99b_17_0.png)


    As this magazine goes to press, Twitter has announced that it is closing its API
    — a radical move that will limit access from outside applications. Some form of
    access might be possible, but the terms are unclear, and anyway, the move is likely
    to cause still restlessness from the Linux community, who have never had much
    patience for broken APIs and are alike likely to access the platform from greater
    or lesser means will they get


    Social networking and the new generation of users who have it changed the Internet.
    Your thoughts, your experiences, your pictures — it all goes on the Internet through
    your platform of choice. Life on Facebook, Instagram, and YouTube: The world is
    connected, but many users, who have never heard of Linux or free software, have
    already begun to ask whether it is all worth the price.


    > "Mean," the companies tell us. "We are free. But it is all for free what you
    mean by free. Commercial social media services earn knowledge of users'' opinions
    and habits. To get on the site, you need to click a box that gives away your ownership
    of your data and in some cases, even away your ownership of your own works


    The whole concept of commercial social media is as it is practiced today at odds
    with the values of the Free Software community. Freedom Event many once referred
    to social media giants as "a monster on the attack," adding, "The threat is that
    by sharing our affairs with friends through a web intermediary who can store and
    remember our habits, we harm by destroying their privacy. It''s not the sharing
    that''s the matter, it''s the technical design of giving it to someone in the
    middle who will use it unexpectedly and unwanted dangerously."


    But over the past few years, while the media giants were entering their dollar
    empires, another project was quite underway. Now, with controversies at Twitter
    and growing distrust for Facebook, the work of these Free software pioneers has
    made a great entrance to the scene. Today a new group of tools to empower us the
    social media orthodoxy. Welcome to the Fediverse [2].


    ## Speech with Free Tools


    The Fediverse is a collection of servers running social media tools that offer
    access in a decentralized format without the spirit. There is no central authority
    wielding over the whole system. Servers operate independently, setting their own
    rules and managing the services as they see fit. Under the philosophy that tools
    should work together, if you have an account on one, you can view content from
    the others.


    In other words, if you have an account on any network, this goal of interoperability
    has been largely successful, although a few links are still needed to complete
    the chain.


    This month you learn about the Fediverse:


    - Mastodon — macroblogging platform that sends links and short messages (like
    Twitter)

    - diaspo — a macroblogging tool, like Facebook

    - Peerfed — a photo-sharing tool, similar to Instagram

    - Tools as Mastodon and diaspo are replacing a majority of the niches of conversational
    platforms because they fit so neatly into the spaces they replace, but as of the
    case with Free Software, users have an advantage of choice. Other tools of the
    Fediverse [3]:

    - Misskey — a macroblogging tool with extra features, like chat, service, and
    animated text

    - Hubzilla — a multi-blogging platform that calls itself a "home for nomads and
    powers users"

    - Perl — a macroblogging service tailored for low-resource systems like Raspberry
    Pi

    - Friendica — an early social media platform that supports protocols for strong
    connectivity with other Fediverse instances

    - Funkscale — a music-sharing platform that also allows "socializing around music
    and discovering new content"

    - GNU — The GNU project''s entry into the scene for an alternative microblogging
    platform


    # Nostr: Even More Decentralized


    The tools of the Pediverse don''t have a single point of control like Facebook
    or Twitter, but you still have to set up an account on a server, and whoever owns
    that server has control over the instance of the service you are using. The Nostr
    protocol [4] provides an approach that is even more decentralized. The goal of
    Nostr is to provide a "censorship-resistant global social network." Instead of
    relying on centralized servers in the classic sense, Nostr relies on relays, simple
    components that do not participate in the identity management system and do nothing
    but messages.


    The Nostr GitHub page describes the scenario as follows, "Every-body runs a client.
    It is a native client, a web client, to publish something, you write a post, sign
    it with your key and send it to multiple relays (relays hosted by someone else,
    or yourself). To get updates from other people, you ask relays if they know anything
    about these other people. Anyone can run a relay. A relay is very simple and dumb.
    It does nothing besides accepting posts from some people and forwarding to others.
    Relays don''t have to be trusted. Signatures are verified on the client side.[5]


    ![](img/9114a5c8af7098772983e86dad17c99b_18_0.png)


    Figure 1: Mastodon is the most popular Fediverse platform, and its popularity
    is growing with the recent changes at Twitter.


