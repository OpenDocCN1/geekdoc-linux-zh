    # Distro - EuroLinux


    LM: What are EuroLinux''s goals and philosophy?


    enterprise environments and act as a drop-in replacement. In most products available
    to the public, one of the key is to maintain compatibility with the upstream projects.
    This principle is quite similar to Linux kernel''s principle of no breaking changes.
    We ensure that even, for example, when configuration flags are enabled or disabled.
    When it comes to the distribution, we keep additional patches, different kernel
    versions, changes to the cryptographic protocols and used algorithms, additional
    software support, custom repositories, and also depends greatly on the kernel.


    EL: The values that guide us are encapsulated in our motto:


    +   * True product: The EuroLinux product stack based on power, well-known, and
    widely used projects. As a result, we create first-class software for the most
    needs. We provide stability and support, ready-to-use products that include standard
    modules in every release.


    +   * Support: Our support division is made up of specialists with the best certifications
    and the practical knowledge-needed to provide professional service.


    +   * Real: The quality of real support is facilitated through direct access to
    engineers and architects. Our keep support team simple-a conversation with a real
    engineer and client.


    +   * Price: Fair price: The price of our products does not depend on the number
    of processors in a machine. We do not license Linux Gaia tools on the number of
    virtual machines running on a physical server. We do not impose constraints on
    our solutions, but we allow them to freely choose their support and provide freedom.


    EuroLinux''s core team consists of a group of developers. Other employees of the
    company and group companies to work in product mode. A key element in building
    and maintaining (patches/patch changes) is the heavy use of automation processes
    implemented in Linux Gaia. This allows us to maintain and speed of systems development.
    We focus on basic features for the systems of (EuroLinux 6 EL, EuroLinux 7, EuroLinux
    8, and EuroLinux Desktop) and additional special projects.


    We collect feedback from users and customers in a registered manner, including
    through the support channel. We also strive to seek and realize your requests.
    Each person has the opportunity to submit a proposal for a change or improvements
    through both direct messages and on the GitHub.Hub.


    LM: What are the goals of our distro?


    EL: The most notable services are our potential to build a custom distribution
    tailored to our customers (professional, equal support support and training courses.


    With the help of the EuroLinux team we create dedicated systems. Anyone can create
    his own Linux distribution from scratch, with unique language and sets of changes.
    We will produce and maintain (updates/patches) for up to 10 years.


    At the beginning of each year, we publish the EuroLinux System Roadmap. In this
    post, we report what we did over the last quarter, but most importantly contains
    information about our development plans. Our roadmap reflects the regrets needed
    by EuroLinux users.


    EuroLinux supports customers and users who are migrating their systems to EuroLinux.
    We write scripts to automate the migration process and offer immediate support.
    Additional support is provided at three levels: premium support is 24/7, and standard
    support is provided 8/5. Base support only includes support for the system or
    installation.


    LM: What is EuroLinux Desktop?


    EL: EuroLinux Desktop (Figure 1), like its sister, is based on the core of RHEL
    8. This means that it is compatible with RHEL, but also includes additional functionality,
    extensions, and functions.


    LM: Is EuroLinux organized? How are decisions made? How do the community and industry
    interact?


    We''ve primarily made changes to ensure the system''s appearance and usability.
    To this end, we use gone extensions. They are confirmed by the system and are
    available immediately.


    User freedom is a very important element of our ethos. Every user can use the
    free available version of the system and switch to the paid version at any time.
    Conversely, they can use the paid version, support without any consequences. Then
    we will provide only standard updates to the system, which are identical to the
    paid version, including repository addresses.


    EL: We have a board, team-based traditional tradition. We operate a competency-based
    decision making, where the technical decisions are made by the specialized team.
    Only company-wide or executive decisions are made at the board level.


