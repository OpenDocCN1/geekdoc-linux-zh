    \n# May 26 - 28, 2023\n\nevents.opensuse.org\n\n# EDITORIAL Welcome\n\n# IDENTITY\
    \ MATTERS\n\nDear Reader,\n\nThe company behind Facebook just announced a new\
    \ premium subscription model, where you pay for your Facebook account and the\
    \ package includes add-on services that you do not currently receive. I always\
    \ wondered if a subscription service might be a better model for media giants\
    \ like Facebook. After all, they do provide a service to their subscribers - maybe\
    \ asking people to do it is better than selling their data and acting as a consultant\
    \ for targeting.\n\nAfter the encouraging headline, however, I was disappointed\
    \ to see that this new subscription-based service does not make your data more\
    \ private or your online presence less acknowledged. The principal purpose of\
    \ your-Facebook page is to make sure you are you and not somebody else. The service\
    \ uses a 'verification badge,' showing that you have presented a government-ID,\
    \ and assuring that you are who you say you are. The goal is to offer some protection\
    \ from rogue users pretending to be you.\n\nCorporate social media culture, the\
    \ Microsoft layer that preceded it, occupies an empty space where people tell\
    \ you that you are you and just not your head when it is perfectly reasonable,\
    \ even when it isn't. If you have to pay extra to ensure that no one is out pretending\
    \ to be you (basically, stealing your identity), the other side is that, if you\
    \ don't pay extra, you surely aren't others out trying to be you.\n\nI want to\
    \ be fair. It does require resources to verify someone's identity and ensure that\
    \ no one impersonates, in that sense, the company has to pass on those costs to\
    \ users. But it all sheds light on how faulty the basic service is in the first\
    \ place. It is supposed to follow the rules to use a name on Facebook, so what\
    \ this new service has is to pay extra for Facebook to enforce its rules, and\
    \ if you don't pay the money, Facebook is not responsible for enforcing its rules.\n\
    \nIt might seem like an impossible task to ensure that two billion users are not\
    \ impersonating each other. Actually, I believe it is an impossible task, and\
    \ $11.99 per month won't be enough to make it possible. It is time to admit that\
    \ Facebook has an impossible business model, rather than letting them climb out\
    \ of the mess by launching add-on services and claiming the problems are easily\
    \ solved consumer choice?\n\nBut this is all sour grapes for me, because I'm still\
    \ disappointed that they would launch a for-pay-service and not use the occasion\
    \ to address the real problem with Facebook, which is all stalking. Rest there\
    \ are alternatives, which we explore the free social media tools of the decentralized\
    \ Federation that will help you with the stalking. As for the impersonation, there\
    \ is still no universal fix, but check out the article on Mastodon that will verify\
    \ your identity to your followers - without paying extra.\n\n![](img/9114a5c8af7098772983e86dad17c99b_2_0.png)\n\
    \nJoe Casad,\nEditor in Chief\n\n# LINUX MAGAZINE\nAPRIL 2023\n\n# ON THE COVER\n\
    \n- 58 **Easy!Appointments**\nManage customer appointments in a handy web interface.\n\
    \n- 68 **SMath**\nTidy your engineering equations and math notes.\n\n- 90 **Tutorial\
    \ - ImageMagick**\nNeed to change the resolution for 100 vacation photos? You\
    \ could click all day with a GUI tool, or write a single script with the powerful\
    \ ImageMagick toolkit.\n\n- 64 **Google Authenticator**\nThwart the password thieves\
    \ with multi-factor authentication.\n\n- 81 **Linux Boot Process**\nThe Linux\
    \ startup process is a series of incremental steps leading from the power button\
    \ to that familiar desktop.\n\n# NEWS\n\n- 8 **News**\n- KDE Plasma 5.27 Released\n\
    - Sparkly 6.6 Available for Installation\n- Escuelas Linux 8.0 Available\n- LibreOffice\
    \ 7 Loaded with New Features and Improvements\n- The Next Major Release of Elementary\
    \ OS Has Arrived\n- KDE Plasma 5.27 Beta Ready for Testing\n- Netrunner OS 23\
    \ Available\n- New Linux Distribution Built for Games\n- System76 Beefs Up Popular\
    \ Penguin Laptop\n\n# COVER STORIES\n\n- 18 **Fediverse Introduction**\nDo you\
    \ have to give your privacy to access to social media? The makers of the Fediverse\
    \ say no.\n\n- 22 **diaspora***\nYou don't need Facebook to keep up with your\
    \ friends online; diaspora offers a similar experience without the spying.\n\n\
    - 28 **Mastodon**\nGet started with microblogging, interact with others who share\
    \ your interests, and even expand the Fediverse with your own Mastodon instance.\n\
    \n- 12 **Kernel News**\n- Minimum Version Numbers for Build Tools\n- Intel and\
    \ ARM Security Issues\n\n- 36 **PeerTube**\nPeerTube, the Fediverse's video platform,\
    \ offers a decentralized, open source way to watch videos and stream your own\
    \ content.\n\n- 16 **FOSDEM 2023**\nAfter two years, one of FLOOD storms returned\
    \ to Brussels in early February for FOSDEM 2023. Reminiscent of a class reunion,\
    \ the FOSDEM keynote program jam-packed with goodies.\n\n- 41 **Pixelfed**\nPixelfed\
    \ offers an alternative to centralized, algorithm-driven, commercial photo sharing\
    \ services.\n\n# REVIEW\n\n- 45 **Distro — EuroLinux**\nEuroLinux offers enterprise-class\
    \ software with support from real engineers for a fair price. Bruce talks to the\
    \ developers behind their RHEL-based distribution.\n\n- 48 **Distro — EuroLinux**\n\
    EuroLinux offers enterprise-class software with support from real engineers for\
    \ a fair price. Bruce talks to the developers behind their RHEL-based distribution.\n\
    \n- 54 **Command Line — Mastodon**\nIf you're looking for consumer choice, Mastodon.\n\
    \n- 95 **News**\n- 96 **News**\n- 97 **News**\n\n# IN-DEPTH\n\n# The Fediverse\n\
    \nSocial media the FOSS way\n\n- 58 **Easy!Appointments**\nManage customer appointments\
