    # # Meet Me in the Stream


    You don''t need Facebook to keep up with your friends online. With diaspora*,
    you get a similar experience without the spying.


    By Nate Drake


    ![](img/9114a5c8af7098772983e86dad17c99b_21_0.png)


    The diaspora* federated social network allows users to independently run pods
    (diaspora servers) to interact with each other and in the world in a "private
    first" way. Technically speaking, diaspora is a blogging platform. You could say
    it''s a Fediverse equivalent to Facebook. You can still create a space that serves
    as your online presence, pictures, links, and personal reflections. This time,
    you stay in control of your data.


    Anyone can set up or join their diaspora* pod using free and open source software.
    All pods are managed separately from each other, they can be federated, so someone
    who uses their account on the US-based diasp.org


    can interact with another user who''s registered with the German-based diaspora.do.


    Diaspora* (Figure 1) fills the need for a decentralized social network in a world
    where the established, monolithic, centralized social media services have abused
    their market dominance, playing fast and loose with users (see the box "Facing
    Up to Facebook")


    ![](img/9114a5c8af7098772983e86dad17c99b_21_1.png)


