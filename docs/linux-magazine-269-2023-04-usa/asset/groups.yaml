    Twitter 近期的事件让免费、开源且联邦的 Mastodon [1] 社交平台获得了深远且突然的成功。尽管 Twitter 的管理具有明显的优势，但 Mastodon
    的成功注定会发生。Cory Doctorow 在他的许多令人开眼界的文章 [2] 中解释道，私有的、中心化的和营利性媒体都会走向终结。Mastodon 和其他平台填补了它们留下的真空。


    我们发布的新没有界面，也没有其他平台那种要求注册才能继续浏览的烦弹窗。点击右侧（图 3），你将看到该特定节点（在本例中为 mastodon.org）的所有帖子。点击联邦（Federated），你将看到发布到
    mastodon.org 的信息。


    ## Mastodon 不是 Twitter


    将 Mastodon 视为 Twitter 的替代品会让消费者感到困惑。当然，Mastodon 是一个微博客社交媒体平台，你可以使用。但正如 Mastodon
    所发现的样，认为 Mastodon 就像 Twitter 是人们犯的首要根本性错误。它是多样化的，并利用了 Fediverse 的所有优势。它不仅是分布式的，而且是大规模分布的。除非你想控制自己的内容或言论，否则没有准入限制。或者，任何人都可以购买单个服务器，但作为一个不断扩张的互联、独立节点网络，这非常困难。


