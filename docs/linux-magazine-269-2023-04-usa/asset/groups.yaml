    # COVER STORY


    ## Mastodon


    ![](img/9114a5c8af7098772983e86dad17c99b_28_0.png)


    A good reason for this: the creators of Mastodon want to encourage human-human
    interaction, as opposed to human-to-algorithm. This often, in lessrupulous social
    platforms, ended up being writing posts to gain the favor of the moment. Also,
    as Mr. Musk, in the moment of the machine, points out in feature 3, there are
    other drawbacks to better-behaved recommendations.


    When it comes to building relationships, the onus is on you; Mastodon''s "recommendation"
    is a good place to start setting up your network of contacts.


    Maybe more interesting are the left and federated timelines. The Getting started
    menu (on the left, just above your profile) to bring back the original column
    on the right, click Local Timeline. This will display a column with all tools
    from your instance. If you are on a busy server, there will be a lot going on.
    If you are not, there won''t.


    Figure 1: Linux Magazine''s Mastodon account and feed.


    If you have a specialized job or hobby, you want to check if there is an instance
    specializing in your interests. You will also find instances tied to specific
    languages and locations. Table 1 shows some suggestions. Check the Mastodon website
    for more complete list [1].


    Remember, all instances talk to each other (except those that are blocked) and
    you can follow and interact with accounts that are on other instances.


    Once you have registered and logged in, the settings of your account are straightforward:
    Configuration (bottom option in the right-hand column), and Under Profile | Appearance,
    you can set your profile name, load an avatar, configure a header image, and bio
    of yourself.


    I also like to go to Preferences | Appearance and click the Enhanced enabled checkbox,
    click the CHANGES at the top of the page. That gives you a multi-column view (Figure
    2), as opposed to the single column view.


    In the Local Timeline column, you will notice a small Settings button. Click it
    and then click + to add it to your columns. Once it is pinned, a new Getting started
    column appears. You can do so with the Federated-timeline option and join to that
    interface. You can also show all posts from all in the Fediverse your instance,
    so the Federated-timeline is much better than following. To follow, click on their
    username at the top of a post, and their feed will appear in the column. Browse
    their posts to be sure you are really interested in reading what they say.


    ## It Follows


    The whole point of this is to be followed, and to read and share mentions, or
    tools, as they are known in Mastodon. But the first thing you want to do is decide
    what you want to see.


    Notice the column on the right of your multi-column view. Click on #Explore and
    it will open a new column that lists all over the Federated verse that are getting
    a lot of boosts (shares) at that moment, the most used hashtags, or a list of
    accounts.


    The algorithm that selects the unsuggested accounts is unintentionally aggressive.
    It recommends mainly "friends of friends," and people you follow.


    There is no analysis in Mastodon and profiling. The rules for recommendations
    are extremely basic. There is


    ![](img/9114a5c8af7098772983e86dad17c99b_28_1.png)


    Figure 2: The Advanced interface gives you a multi-column view.


    | Instance | Topic |

    | --- | --- |

    | astodon.com | Astronomy |

    | art | Art |

    | mastdn.com | Gaming |

    | mastodon.gorod.dev | Game development |

    | fostodon.org | Free/Open Source Software |

    | disabled.social | Accessibility |

    | social.tech | Free/Open Source Mathematics |

    | mastodon.xy | Press/Journalism |

    | federated_press, mapt.in | Cartography/Maps |

