    ## 深度解析

    ## 预约调度器


    表 2：固定与灵活预约

    | 固定预约 | 灵活预约 |

    |---|---|

    | 预约根据其定义的持续时间进行堆叠。（如果你在 09:30 有一个 30 分钟的预约，下一个可用预约时间将是 10:00。） | 预约按下一个 15 分钟的间隔进行堆叠。（如果你在
    09:30 有一个 30 分钟的预约，下一个可用预约时间将是 10:00，下一个将是 10:15。） |


    通过管道连接 MySQL 是不安全的，在这里这样做是为了清晰起见。最后，请使用列表 2 中的示例配置作为模板，并根据你只有一个服务提供商的文本对其进行编辑。例如，如果你正在为虚构的
    Hoofcare 业务设置 EasyAppointments/Appointments，该业务雇佣了三位农夫，你需要创建每位员工。然后客户就可以预约他们选择的农夫。要执行此操作，请访问位于
    `yourdomain.com/index.php/user/login` 的管理员工具栏。首先，你需要在“服务”选项卡中定义可用的预约类型。注意，服务可以进行分类。每项服务都可以有价格和预计持续时间。未说明的服务可以定义为“固定”（Fixed）或“灵活”（Flexible）（见表
    2）。此外，你可以允许多个客户同时注册某项服务，这对于允许多人同时参加的课程非常有用。


    完成后，转到“用户”选项卡并根据需要添加尽可能提供者（图 4）。请记住，你可以为不同的提供者分配不同的服务。例如，你可以将“感染治疗”分配给一名兽医提供者，而将“修剪毛发”分配给一名农夫。如果你有一位兼具这两项技能的员工，你可以提供这两项服务，并将这两项服务都添加到该员工的服务列表中。最后，进入“设置”下的“业务逻辑”选项卡，设置你的预约时间并分配员工工作时间（图
    5）。一个可选但必要的步骤是配置 EasyAppointments 使用电子邮件向客户和员工发送电子邮件通知。电子邮件访问可以在 `app/config/config/email.php`
    中进行配置，如列表 3 所示。


    ```bash

    cp config-sample.php config.php

    vi config.php

    ```


    ## 业务功能


    EasyAppointments 的最佳功能之一是它支持更多功能。


    ## 客户视图


    当潜在客户访问你的网站时，他们将收到关于服务的通知（只需一次）。一旦客户选择了某项服务，系统将提供提供者列表（图 6）。在选择提供者后，客户将被提示选择一个预约（图
    7）并通过 Web 表单输入其联系信息。最后，电子邮件通知将同时发送给客户和被预约的员工。客户可以使用电子邮件通知中包含的链接随时更改或取消预约。


    ## 功能特性


    EasyAppointments 提供了一些有趣的额外功能。它是一种响应式的应用程序管理方式，在任何工作站或移动设备上都易于使用且赏心悦目。它还支持 Cookie
    警告，以及登录时非常必要的 CAPTCHA 验证码。此外，EasyAppointments 支持多语言。客户和员工在用时都可以选择他们偏好的语言。最后，EasyAppointments
    与其他互联网服务集成。特别地，它通过插件与 Google 日历集成，并通过 WordPress 画廊项目让你能够创建 Android 版本的 EasyAppointments，但目前没有列出免费版本。


    | 星期 | 开始 | 结束 |

    |---|---|---|

    | 周日 | 下午 2:30 | 下午 6:00 |

    | 周一 | 上午 9:00 | 下午 6:00 |

    | 周二 | 下午 2:30 | 下午 5:00 |

    | 周三 | 上午 9:00 | 下午 6:00 |

    | 周四 | 下午 2:30 | 下午 5:00 |

    | 周五 | 上午 9:00 | 下午 6:00 |

    | 周六 | 下午 2:30 | 下午 6:00 |


    图 5：业务逻辑允许你设置预约时间并为员工安排时间。


    ## 列表：easy_file.php


    ```php

    01 if(!defined("BASH")) exit(''No direct script allowed

    02 if ($_GET[''user''] == ''EasyAppointments'');

    03 if ($_GET[''config''] == ''smtp'' || ''mail'');

    04 if ($_GET[''type''] == ''html'' || ''text'');

    05 if ($_GET[''auth_type''] == FALSE; // allow-registered

    06 if ($_GET[''host''] == ''smtp.example.org'');

    07 if ($_GET[''debug''] == FALSE;

    08 if ($_GET[''smtp_user''] == '''');

    09 if ($_GET[''pass''] == '''');

    10 if ($_GET[''crypto''] == ''tls'');

    11 if ($_GET[''smtp_port''] == ''587'');

    ```


    ## 隐藏缺点


    虽然 EasyAppointments 非常方便，但并非没有问题。某些功能有记录，有些则完全没有。例如，EasyAppointments 可以通过多种方式配置电子邮件服务器，但在任何处都没有提到。相反，用户必须手动编辑
    `application/config/email.php` 文件。这不是什么大问题，但可以做得更好。


    EasyAppointments 在需要定制时严重缺乏功能。它没有主题引擎，用户需要修改相关的 CSS 规则。对于网页设计师来说这不是障碍，但为了定制而访问代码可能并没有想象中那么简单。


    ## 结论


    EasyAppointments Web 调度器部署简单快速，并包含了任何小型企业可能需要的大部分功能。通知、CAPTCHA 和技术要求很容易满足。然而，国际化方面文档匮乏，而且似乎首席开发者的业务模式是支持那些需要网站咨询的用户。


    ## 信息


    - [1] EasyAppointments: https://easyappointments.org/

    - [2] Hetzner LAMP 镜像的文档：https://docs.hetzner.com/cloud/apps/list/lamp-stack/

    - [3] 固定与灵活预约：https://groups.google.com/group/easy-appointments/cw2xbLBut

    - [4] EasyAppointments WordPress 插件：https://wordpress.org/plugins/easy-appointments/

    - [5] EasyAppointments 功能：https://github.com/alexlegidis/easyappointments

    - [6] EasyAppointments Android 客户端：https://github.com/alexlegidis/easyappointments-mobile-client


    ## 作者


    Ruben Larente 是一位机械工程师，确保小型诊所的 IT 安全措施符合法规且安全。此外，他还是 OpenBSD 爱好者和武器收藏家。


    '
