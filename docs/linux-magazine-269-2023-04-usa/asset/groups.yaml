- md: "\n## Beginning and End\n\nR's diff function computes the difference between\
    \ two timestamps. For a result, line 23 R's asftime() returns the value with units=\"\
    minute\" as a floating-point number with minutes, which the round function rounds\
    \ to the nearest integer with a power of 10 zero decimal places. To take care\
    \ of the duration, line 24 and 25 insert the value into column 6 using the \"\
    mins\" header.\n\nFinally, R's csv() writes the output in CSV standard format,\
    \ which the user redirects to the tour-data.csv file, as metadata to enable automatic\
    \ and fast filtering. The Go program, which will be explained in a minute, grabs\
    \ the results from the file and applies it to user-configured filters. To do this,\
    \ Listing 4 uses readCSV() to read the metadata into memory by filling a slice\
    \ of structs of the Tour type. Starting in line 10, each of the structs store\
    \ all this metadata, such as the duration, meters, and starting point.\n\nAs you\
    \ can see, parsing expected data in Go is far easier than in R. The encoding/csv\
    \ package handles the CSV for us, but Go's reader needs to handle the library's\
    \ way of returning errors for the end of the file (line 29) and handling the first\
    \ line in the CSV format lists the column names, the logic in line 36 works past\
    \ the firstLine/Boolean variable.\n\nLines 41 to 48 extract the metric column\
    \ values using ParseFloat() and ParseInt() with the required precision (32-64\
    \ bit) and bit size for the integers. Line 49 to set the corresponding attributes\
    \ to the Tour type. Line 55 presents a single instance of this struct to the array\
    \ with all the data from the CSV file, and the action continues with the next.\n\
    \n## Truthy\n\nThe main program in Listing 5 uses a number of flags--gain is a\
    \ qualifying tour gain in meters and--radius is the maximum distance from my home,\
    \ the coordinates of which are defined in line 9. Adjust this to use your parameters\
