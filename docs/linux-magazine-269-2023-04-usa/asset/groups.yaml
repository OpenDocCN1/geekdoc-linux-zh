  mdcn: '

    # 头条故事


    ## Mastodon


    ![](img/9114a5c8af7098772983e86dad17c99b_28_0.png)


    这背后有一个很好的理由：Mastodon 的创建者希望鼓励人与人之间的互动，而不是人与算法的互动。在那些不良的社交平台上，这种互动往往变成了为了迎合时下的潮流而发布帖子。此外，正如马斯克在机器模式的特性
    3 中指出的那样，表现良好的推荐机制也有其他缺点。


    在建立关系方面，责任在于你自己；Mastodon 的“推荐”是建立你的人脉网络的好起点。


    也许更有趣的是本地时间线（Local Timeline）和联邦时间线（Federated Timeline）。使用“快速开始”菜单（位于左侧，个人资料上方）找回右侧的原始列，点击“本地时间线”。这将显示一包含来自你所处实例（instance）所有工具的列。如果你在一个繁忙的服务器上，会有很多动态；如果你不在，则没有。


    图 1：《Linux 杂志》的 Mastodon 账号和动态。


    如果你有专门的工作或爱好，你想要检查是否有专门针对你感兴趣领域的实例。你还会发现与特定语言和位置绑定的实例。表 1 显示了一些建议。请查看 Mastodon
    网站获取更完整的列表 [1]。


    请记住，所有实例之间都可以通信（被屏蔽的实例除外），你可以关注并互动来自其他实例的账号。


    一旦你注册并登录，你的账户设置非常直观：配置（Configuration，右侧列底部的选项），在“个人资料 | 外观”（Profile | Appearance）下，你可以设置个人资料名称、加载头像、配置横幅以及个人简介。


    我还喜欢进入“偏好 | 外观”（Preferences | Appearance）并勾选启用增强（Enhanced enabled）复选框，点击页面顶部的更改（CHANGES）。这将提供多列视图（图
    2），而不是单列视图。


    在“本地时间线”列中，你会注意到一个小“设置”按钮。点击它，然后点击 + 将其添加到你的列中。一旦固定，就会出现一个新的“快速开始”列。你可以通过“联邦时间线”选项并加入该界面。你还可以显示来自联邦宇宙（Fediverse）中你所在实例的所有帖子，因此联邦时间线比单纯关注好得多。要关注，点击帖子顶部的用户名，他们的动态就会出现在该列中。浏览他们的帖子，以确保你真的对阅读他们说的内容感兴趣。


    ## 它紧随 (It Follows)


    这一切的重点在于被关注，以及阅读和分享提及（mentions，在 Mastodon 中称为提及）或工具。但你想做的第一件事是决定你想看什么。


    注意你多列视图右侧的列。点击 `#Explore`（探索），它将打开一个新列，列出此时整个联邦宇宙中获得大量助推（转发）的帖子、最常用的标签或账号列表。


    选择未建议账号的算法在无意中是具有侵略性的。它主要推荐“朋友的朋友”以及你关注的人。


    Mastodon 中没有分析和画像分析。推荐规则非常基础。这里有


    ![](img/9114a5c8af7098772983e86dad17c99b_28_1.png)


    图 2：高级界面为你提供了多列视图。


    | 实例 (Instance) | 主题 (Topic) |

    | --- | --- |

    | astodon.com | 天文学 |

    | artodon | 艺术 |

    | mastdn.com | 游戏 |

    | mastodon.gorod.dev | 游戏开发 |

    | fostodon.org | 免费/开源软件 |

    | disabled.social | 无障碍 |

    | social.tech | 免费/开源数学 |

    | mastodon.xy | 新闻/新闻业 |

    | federated_press, mapt.in | 制图学/地图 |

    | vegan.social | 素食主义 |

    | metalverse.social | 金属音乐 |


    ![](img/9114a5c8af7098772983e86dad17c99b_29_0.png)


    网页界面的左上角。这是你编写帖子的地方。在你向联邦宇宙发射你的第一句智慧之前，图 4 显示了其他人的不同之处：你的消息有 500 个字符的额度，这很不错。再次注意主文本区域的底部，从左到右有一个带有五个按钮的栏。第一个按钮显示了附件文件的通用视觉系统。


    图 3：马斯克清醒的时刻。


    回针图标也用于向你的帖子附加文件。你也可以直接将其拖放到 Web 客户端。Mastodon 允许最多四张图片或一个视频文件。


    注意，无障碍性对于 Mastodon 社区非常重要。我们鼓励你为你上传的图像添加 alt（替代）文本。那些没有红黄色警告框的图片。其他一些更具侵略性和分裂性的社区会禁止发布没有描述的帖子，或将其删除。当你附加图像时，点击附件的描述，现在你就可以添加长多达
    1500 个字符的文本了。


    下一篇是关于帖子以及你预期的。


    带有地球图标的按钮用于你帖子的隐私级别。


    有一个是你想要开始的账号——关注：将 `@Fediverse@social.yourown.services` 输入 Mastodon 的搜索框并点击关注图标。该账号会发布定期更新。

    '
