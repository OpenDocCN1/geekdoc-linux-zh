    # A customizable distro with better support


    # # EuroLinux


    EuroLinux offers enterprise class software with support from real engineers for
    a fair price. Bruce talks to the developers behind this RHEL-based distribution.
    By Bruce Byfield


    ![](img/9114a5c8af7098772983e86dad17c99b_44_0.png)


    based on Red Hat Enterprise (RHEL), EuroLinux [1] is a Polish-based commercial
    distribution that sells support from engineers and offers specialist editions,
    including free editions for Raspberry Pi, the cloud, and desktops. Keeping with
    the company''s philosophy, my questions were answered by leading developers.


    commercial open source software since 2000. Our company''s name originates from
    the name of its first product, which was the EuroLinux operating system.


    service of rebuilding and customizing the system for the customer, even in a closed
    environment. We are also the only clone that has a (RPM release tag) of modular
    packages compatible 1:1 with RHEL. We are creating special versions of systems
    - available every release, as image for EuroLinux or EuroLinux Desktop. EuroLinux
    Desktop is an extended version of the distribution designed for individuals and
    organizations that use Windows or macOS as a host operating system, with a long
    life cycle, that feels like Microsoft and Apple. In addition, EuroLinux is offered
    as a complex collection of solutions in a series of paired elements. The customer
    who purchases our product and support services does not pay for additional system
    modules such as HA Load Balancers. We are also distinguished by a simple, freely
    licensing the system that does not limit the uses of systems in virtual or cloud
    environments. The number of CPUs or cores does not affect the price of support.


    Linux Magazine (LM): Tell readers about the founding of EuroLinux.


    LM: Do the distribution have any direct relationship, any connection to the campaigning
    organization [2] of the same name?


    EL: We don''t have a direct relationship, but we share many views. The emergence
    of our products is also in line with our goals, such as restriction of patents
    in software, freedom of licensing, and no vendor lock.


    EuroLinux (EL): Were founded in 2013 by a group of individuals all had been supporting


    LM: How does EuroLinux differ from other distributions based on RHEL?


    EL: there are many things distinguishing us from others through both our technical
    and business elements. We have our EuroLinux Gaia build system, which is not dependent
    on git.centos, made mainly by the CentOS and younger enterprise Linux distributions,
    with the help of our build systems, we with the organization


    # Author


    Bruce Byfield is a computer journalist and a freelance writer and editor specializing
    in open source software. Between writing projects, he also teaches and e-learning
    courses. In his spare time, Bruce writes while at Northwest Corp (http://brucebyfield.wordpress).
    He is also a co-founder of Printer Pieces, a blog about web design and fantasy
