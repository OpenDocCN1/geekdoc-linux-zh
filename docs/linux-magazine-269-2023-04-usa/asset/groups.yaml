    # MAKERSPACE SMath


    ## MakerSpace

    Free MathCAD alternative for Linux


    ## Computing Competency


    Present complex equations with intermediate steps, graphics, plots, and results
    in SMath. By Brooke Metcalfe


    University students in engineering often have assignments in which they must show
    their work step-by-step with calculations. Although Excel and Python are useful
    for advanced calculations, they can''t present complex equations formally. MathCAD
    [1] is a good package for writing engineering reports. The tool offers a workbook
    interface that allows you to enter complex equations in a readable format, along
    with a rich function library, programming interface, graphics, and plots. Unfortunately,
    MathCAD is not supported by Linux, and it is generally out of the budget for students
    or casual users. As an alternative, SMath is a great free option that works in
    Linux, macOS, and Windows.


    SMath has a side panel of common functions and symbols (Figure 1). All the functions
    are listed in the Insert (fn) dialog box.


    Figure 1: Panel of common functions.


    68 APRIL 2023 ISSUE 269 LINUX-MAGAZINE.COM


    ## Create and Edit Large Expressions


    ```

    $$\frac{5+3}{1} = \frac{8}{3} = 2.8471$$

    $\ln\frac{3}{4} + \exp\frac{1}{10}$

    ```


    In this article I introduce SMath and show you all the great features that I use
    in my nearing term. I also look at how SMath solves a typical high school or first-year
    mathematics problem.


    ## Equations, Variables, and Units


    Use the arrow keys to move to parts of the equation, and then edit SMath lets
    you create complex calculations from the side panel (Figure 1) with keyboard shortcuts.
    Equations can be modified with the arrow keys to move the cursor elements (Figure
    2).


    ## Getting Started


    SMath sheets from top to bottom, so it is important to define a variable before
    you use it. A variable is defined with :, and the results of calculated value
    are displayed with the signs (+).


    Figure 2: Editing and viewing a calculation.


    ![](img/9114a5c8af7098772983e86dad17c99b_68_0.png)


    To add a units, use a single quote ('') before entering the unit, or choose from
    a list of units (Figure 3). If a calculation has mixed units, SMath automatically
    manages the conversion (Figure 4)


    ## Using Units


    ```

    length1 = 2 m

    length2 = 10 in

    ```


    ```

    sudo apt install mono-dev

    ```


    In the next step, copy the SMath installation files to your location and run the
    SMath desktop:


    Figure 3: Inserting units.


    ```

    # Run SMath Desktop

    ./smathudio_desktop_mono

