    # 开始使用 PeerTube


    ## 联邦宇宙 TV


    PeerTube 是联邦宇宙的视频平台，提供了一种去中心化的、开源的观看视频和直播自己内容的方式。我们将向你如何开始，甚至建立你自己的实例。作者：Paul
    Brown


    ![](img/9114a5c8af7098772983e86dad17c99b_35_0.png)


    联邦宇宙（Fediverse）社区是一个基于 ActivityPub 的并行互联网，ActivityPub 是 W3C 推荐的社交媒体标准，而 PeerTube
    [1] 是联邦宇宙面向社区和其他组织的视频服务。


    就像 Mastodon 一样，将 PeerTube 视为 YouTube 等流行专有替代方案的联邦宇宙替代品是可以理解的。你可以这样使用 PeerTube，但你将会忽略它的优点以及它如何将视频流的控制权从强大的公司手中交回给用户。


    运行像 PeerTube 规模的服务需要巨大的带宽和存储，除非你将整个事物去中心化。明确的是，PeerTube 提供的媒体规模没有达到 YouTube 的程度。然而，PeerTube
    的扩展性随着其提供服务的媒体数量而增长。通过使用点对点（P2P）技术，PeerTube 在实例（由成员运行的服务器）之间分担负载。与直觉相反，对于实例来说，观众越多，实例所在服务器的负载就越高，因为负载分散到了网络中的更多节点上。此外，PeerTube
    的去中心化本质使得一个实例为访问者提供的比隔离且仅使用自己存储多多的视频目录。


    在这篇文章中，我将向你如何找到可以加入的 PeerTube 实例、设置账户、直播视频，甚至你仍然运行自己的实例。


    ## 成为观众


    当你第一次访问 PeerTube 实例时（图 1），除非所有者更改了默认配置，否则你将看到热门趋势视频。这些视频可能都没有托管在你访问的实例上，但你仍然可以在任何地方观看它们。


    要查看实例本身托管了什么，点击左侧的“本地”（Local）。另一侧将显示按分类划分的联邦视频选择。之前提到的默认趋势视图和“最近”（Recently）向你展示整个联邦宇宙的新视频。


    如果你想了解更多关于你访问的实例的信息，点击侧边栏底部的“关于”（About）。“关于”页面


    ![](img/9114a5c8af7098772983e86dad17c99b_36_0.png)


    图 1：PeerTube 实例将显示联邦中最热门的趋势视频。


    告诉我们你维护实例的原因、规则是什么，以及至少是实例的技术规格。通过滚动，你还可以查看实例的统计数据（图 2），包括那里托管了多少用户和视频，以及其他有用指标。


    了解关于你实例的内容、创建者制定的规则和意图以及本地库的大小，可以让你判断你是否想通过该实例加入 PeerTube 网络。


    选择一个实例开始并不困难，但确实需要一些研究。对于其他联邦宇宙服务，你可能想看其他地方。此外，一个发布争议性内容（疯狂的阴谋论、种族主义文献等）的 PeerTube
