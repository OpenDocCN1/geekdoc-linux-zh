    # 新闻


    技术、趋势和工具的更新


    ## 本月新闻


    - 08 KDE Plasma 5.27 发布

    - SparkyLinux 6.6 可供安装


    - 09 Elementary Linux 8.0 已发布

    - LibreOffice 7.5 引入了大量新功能与改进


    - Elementary OS 的下一个大版本已发布 - 更多请在线


    - 10 KDE Plasma 5.27 Beta 版已就绪测试

    - Netrunner OS 23 已发布


    ## KDE Plasma 5.27 发布


    下一个 KDE 桌面版本已问临，承诺为所有人提供卓越的体验。


    桌面添加的大部分改进都是通过优化实现的，因此你不会发现琳琅满目的新功能，但仍有一些值得注意。


    系统设置中新增了 Firefox 重新刷新选项，并新增了一个 KDE Plasma 应用，帮助用户了解如何设置在线账户等内容。


    在本次发布中，新功能被改进和错误修复所掩盖。在 Wayland 环境下，主显示器会显示充电和放电状态，Dolphin 现在会在你删除文件时自动选中该文件；此外
    Discover 的搜索速度快了许多。


    系统设置窗口现在使用了更“无边框”的设计（与之前的题化视图相比）；配置组件现在移至系统托盘中，并且在你只连接一个显示器时它处于非活动状态；对多显示器刷新进行了优化，以提升在多显示器上的工作体验；日历和
    KWin 平铺会话可以通过 Meta-T 隐藏。


    你可以在版本发布说明（https://kde.org/announcements/plasma/5.260）中了解更多关于新更新的详情。要体验最新的 KDE
    体验，最佳选择是通过 KDE Neon ISO（https://neon.kde.org）。


    ## SparkyLinux 6.6 可供安装


    SparkyLinux 提供了四种不同的桌面版本：LXD 0.16.0、Xfce 4.16、KDE Plasma 5.2.0 和 Openbox 3.6.1，并受益于这些环境中的所有升级。SparkyLinux
    最大的变化是引入了 Sparky USB Center。


    随着该版本的发布，现在可以创建带有持久化存储的启动安装。这意味着无论你去哪里，都可以使用该版本的 SparkyLinux，它将包含你保存到 USB 盘上的任何数据。


    由于 SparkyLinux 6.6 由 Linux 内核驱动，某些已安装的包可能过时，但事实并非如此。


    SparkyLinux 使用 Debian Debian，包含已安装软件的稳定包。这些软件包是最新发布版本，从 Debian 和 Sparky 仓库安装（截至
    2023年2月4日）。SparkyLinux 6.6 中找到的一些应用版本包括 Firefox 102.0.7-esr、Debian 10.6.0 和 LibreOffice
    7.0.4。


    你可以在官方发布说明（https://sparklinux.org/sparky-6-6/）上阅读更多关于此 SparkyLinux 版本的信息，并下载 ISO
    镜像（https://sparklinux.org/download/）进行安装。


    ## Elementary Linux 8.0 已发布


    Elementary Linux 分发于教育领域，范围从幼儿园到学校，是教育软件的集合。该发行版可以安装在 32 位或 64 位硬件上，并基于 Bodhi
    Linux。


    预装教育软件的列表令人印象深刻，包括 TuXpaint、GIMP、G、Scratch、Whatsapp、Geogebra、Kalibre 等许多软件。除了教育软件外，你还会找到
    LibreOffice、GIMP、Inkscape、Firefox、Chrome、Chromium 等软件包。


    根据最新更新，64 位版本的内核基于 Bodhi Linux 7.0，而该版本又基于 Ubuntu 20.04 LTS Focal。其内核基于 Bodhi
    Linux 6.0（即 Ubuntu 18.04.1 B 的 64 位版本），32 位版本的内核为 4.19。


    对于新功能，你将发现一个全新的安装程序、更新的应用程序以及更新的开发者包，其中包含了最新版本的 Android Studio、Apache Spark 和
    Firefox。


    请务必阅读 25 周年版本的发布说明（https://news.itsfoss.com/escuelas-linux-8-0-release）并下载 ISO
    进行安装（https://sourceforge.org/projects/escuelaslinux/）。


    ## LibreOffice 7.5 引入了大量新功能与改进


    LibreOffice 是许多 Linux 用户最喜爱的办公软件。在最新的 7.5 版本中，软件中引入了许多新功能，甚至进行了一些视觉上的刷新。


    最显而易见的之一是全新的图标集，色彩更加丰富且富有活力。此外，如果你在触控设备上使用 LibreOffice，可以完全控制和导航多点手势。你还会发现 UI
    发生了许多重大变化，这些变化有助于 LibreOffice 看起来更现代、更专业。


    其他更改包括每个模块的错误修复，例如：在 Calc 中用单引号输入数字现在可以正确处理，即剥离前缀并保留数字。Calc 现在还支持虚拟文件的 Mazovia
    编码，且某些条件格式选项支持区分大小写。


    Writer 的签签模式也得到了更新，允许从设置对话框轻松编辑签签。隐藏的签签现在可以编辑，签签在文档中可见，不再需要屏幕阅读器。


    开发者们还花费了大量时间改进了 MS 兼容性、导出功能以及宏编程工具。


    要了解更多 LibreOffice 7.5 的新特性和改进，请务必阅读发布说明（https://wiki.documentfoundation.org/ReleaseNotes/7.9）。你可以从
    LibreOffice 网站下载最新版本（https://www.libreoffice.org），或者等待 7.5 版本进入你发行版的官方仓库。


    '
