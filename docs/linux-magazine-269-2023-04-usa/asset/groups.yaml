    # 一款支持更佳的可定制发行版


    ## EuroLinux


    EuroLinux 提供企业级软件，由真实的工程师提供支持，且价格公道。Bruce 与此基于 RHEL 的发行版背后的开发者进行了交流。作者：Bruce Byfield。


    EuroLinux [1] 基于红帽企业级 Linux (RHEL) 是一款总部位于波兰的商业发行版，销售工程师支持服务，并提供专家版本，包括针对 Raspberry
    Pi、云端和桌面的免费版本。本着公司的哲学，我的问题由领先的开发者进行了解答。


    自 2000 年以来一直是商业开源软件供应商。我们公司的名称源于其第一款产品，即 EuroLinux 操作系统。


    我们为客户提供系统重建和定制化服务，即使在闭源环境中也是如此。我们也是唯一具有 (RPM release tag) 且与 RHEL 1:1 兼容的模块化软件包克隆版本。我们创建系统的特殊版本——每次发布都会以
    EuroLinux 或 EuroLinux Desktop 镜像的形式出现。EuroLinux Desktop 是该发行版的扩展版本，专为使用 Windows
    或 macOS 作为主机操作系统的个人和组织设计，具有长周期，体验类似于微软和苹果。此外，EuroLinux 以一系列成对元素的复杂解决方案集的形式提供。购买我们产品和支持服务的客户无需为额外的系统模块（如
    HA 负载均衡器）付费。我们的独特之处在于系统许可简单免费，不限制系统在虚拟或云环境中的使用。CPU 或核心数量不影响支持价格。


    《Linux 杂志》(LM)：向读者介绍一下 EuroLinux 的创立情况。


    LM：该发行版与同名的竞选活动组织 [2] 有任何直接关系或联系吗？


    EL：我们没有直接关系，但我们有许多共同观点。我们产品的出现也符合我们的目标，例如软件专利的限制、许可的自由以及无供应商锁定。


    EuroLinux (EL) 是于 2013 年由一群一直支持[该理念]的个人创立的。


    LM：EuroLinux 与其他基于 RHEL 的发行版有何不同？


    EL：在技术和业务元素上，有许多因素使我们与众众不同。我们有自己的 EuroLinux Gaia 构建系统，它不依赖于 git.centos（主要由 CentOS
    和较新的的企业级 Linux 发行版制作），在我们的构建系统的帮助下，我们与组织……


    # 作者


    Bruce Byfield 是一位计算机记者，也是一名专攻开源软件的自由作家和编辑。在写作项目之余，他还教授电子学习课程。在空闲时间，Bruce 在 Northwest
    Corp (http://brucebyfield.wordpress) 写作。他还是 Printer Pieces 的联合创始人，那是一个关于网页设计和幻想的博客（https://printiepieces.com/）。


    LINUX-MAGAZINE.COM 2023年4月第45页


    # 评测


    ## 发行版 - EuroLinux


    LM：EuroLinux 的目标和哲学是什么？


    在企业环境中运行并作为即插即替代。在大多数面向公众的产品中，关键点之一是保持与上游项目的兼容性。这一原则与 Linux 内核的“无破坏性变更”原则非常相似。我们确保即使在启用或禁用配置标志时也是如此（例如）。对于发行版本身，我们保留了额外的补丁、不同的内核版本、加密协议和使用算法的更改、额外的软件支持、自定义仓库，并且很大程度上取决于内核。


    EL：指导我们的价值观凝聚在我们的格言中：


    -   *真实的产品*：EuroLinux 产品栈基于强大、知名且被广泛使用的项目。因此，我们为最核心的需求创建顶级软件。我们提供稳定、支持以及每次发布都包含标准模块的开箱即用产品。


    -   *支持*：我们的支持部门由拥有顶尖认证和提供专业服务所需实践知识的专家组成。


    -   *真实*：通过直接接触工程师和架构师确保了真实支持的质量。我们保持支持团队的简单——与真实的工程师和客户进行对话即可。


    -   *价格*：公道的价格：我们产品的价格取决于机器中处理器的数量。我们不根据物理服务器上运行的虚拟机数量对 Linux Gaia 工具进行许可。我们不对自己的解决方案施加限制，而是允许他们自由选择支持并提供自由度。


    EuroLinux 的核心团队由一组开发者组成。公司的其他员工和集团公司以产品模式工作。构建和维护（补丁/补丁更改）的关键元素是大量使用在 Linux Gaia
    中实现的自动化流程。这使我们能够维护并加速系统开发。我们关注系统（如 EuroLinux 6 EL、EuroLinux 7、EuroLinux 8 和 EuroLinux
    Desktop）的基础功能以及额外的特殊项目。


    我们以注册的方式收集用户和客户的反馈，包括通过支持渠道。我们致力于寻求并实现您的请求。每个人都有机会通过直接消息和 GitHub Hub 提交更改或改进建议。


    LM：我们发行版的目标是什么？


    EL：我们最显著的服务是有潜力为客户构建定制发行版（专业的、对等的支持以及培训课程）。


    在 EuroLinux 团队的帮助下，我们创建了专用系统。任何人都可以从零创建自己的 Linux 发行版，具有独特的语言和更改集。我们将制作并维护（更新/补丁）长达10年。


    每年初，我们会发布 EuroLinux 系统路线图。在篇文章中，我们报告了上季度所做的工作。


    EuroLinux 以一系列成对元素的复杂解决方案集的形式提供。购买我们产品和支持服务的客户无需为额外的系统模块（如 HA 负载均衡器）付费。我们的独特之处在于系统许可简单免费，不限制系统在虚拟或云环境中的使用。CPU
    或核心数量不影响支持价格。


