    ## 工具与规则


    去中心化是 Fediverse 的主要特征之一，无需解释。像 Mastodon 这样的工具是一种不受语言和审查限制的开源实用程序。Mastodon 社区并非唯一的用户群。不同的组织以
    Mastodon 提供者的身份存在（图2）。每个提供者都管理着自己的服务器。若要开始使用 Mastodon，你可以在任何现有的提供者处注册，也可以创建自己的服务器。本杂志的出版者
    Linux New Media 在一个名为 fastest 的 Mastodon 提供者处拥有账户。通常情况下，Fediverse 服务器支持与其他提供者进行交互，因此你不会像许多商业社交媒体工具那样被困在围墙花园中；然而，第一步是创建一个账户。


    个人提供者的这种独立性意味着 Fediverse 不由单一公司控制。另一方面，多样性意味着提供者在管理其空间和交互方式上存在差异。每个服务器都托管一个特定的兴趣社区或政治诉求。服务器的所有者可以随心所欲地审核内容。例如，素食
    Mastodon 服务器专注于素食主义者和其他“动物活动人士进行的反物种歧视审核”。另一方面，由唐纳德·特朗普创建并受 MAGA 政治用户支持的社交 Truth
    Social 也是基于 Mastodon 的。


    ## 协议


    Fediverse 的秘密在于它们共享共同协议。仔细观察这些协议将让你更好地了解哪些是有效的，以及哪些最适合你的情况。然而，为了提高通用性，某些工具支持的比其他工具要多。


    最受欢迎的 Fediverse 通信协议是 ActivityPub。ActivityPub 基于早期的 Activity 和 Status 协议，是全球网的标准。Mastodon、Mastpeer、PixelFed
    和 Pleroma 都是 ActivityPub 的重要实现。


    Diaspora 独立开发且早于许多 ActivityPub 应用，它有自己的协议，与其他协议并不完全兼容。然而，diaspora 的优势是它实现了扩展，可以与许多商业社交媒体服务交互。你可以向
    Tumblr 和 WordPress 发布更新，并在帖子中嵌入 YouTube 和 Vimeo 视频。Diaspora 也对向 Twitter 发布内容提供一些支持，但可能需要启用
    Twitter API。


    GNU Social 是早期参与者之一，使用 Status 协议，Mastodon 也支持该协议。Hubblah 非常重视互操作性，并对 diaspora
    和 ActivityPub 服务提供内置支持。Hubblah 还支持 Zot 协议，这使其能够连接到 Jabber 微博客服务。


    图2：在 Mastodon 网站上拥有你账户的服务器。


    不同的协议意味着 Fediverse 中的所有服务并不一定兼容。它们并不可以直接相互连接。通常情况下，我们可以将 ActivityPub 服务归为另一组（图3）。联邦化的
    Friendica 和 Hubzilla 同时也属于这两个阵营。GNU Status 是连接 ActivityPub 和 Mastodon GNU Social
    第 3 版本的连接器，但已停止维护。


    请记住，不同服务之间的兼容性只是时间问题。在许多情况下，用户更有兴趣与处于同一工具社区内的人联系。Mastodon 社区是一个数百万用户每天相互互动的社区——他们并没有忽视自己在触达其他服务方面的价值。Mastodon
    社区本身就是一个联邦，拥有许多独立运行但提供多样选择的服务器。


