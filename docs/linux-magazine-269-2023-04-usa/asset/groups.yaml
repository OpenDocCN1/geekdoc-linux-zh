    # Multifactor Authentication with SSH


    ## Integrating Google Authenticator with SSH logins


    ### Best Laid Plans


    The Google Authenticator PAM module allows you to use time-based Google Authenticator
    passwords with various Linux servers, including SSH. By Jesse Hagewood.


    In recent years, multifactor authentication (MFA) has been a hot topic in security,
    with many options and software services now making it a requirement. To achieve
    MFA, two or more authentication passwords must be provided by a user to pass authentication.
    These factors include something you know, something you have, where you are, or
    something you do.


    Many organizations have turned to the Google Authenticator to implement MFA using
    a time-based one-time password to log in. The Google Authenticator satisfies the
    "something you have" authentication factor because TOTP requires a device in the
    user''s possession, or the user''s smartphone or iPhone. Adding a regular user
    password to satisfy the "something you know" authenticator factor provides the
    second factor to achieve MFA. Many software as a service (SaaS) providers, such
    as GitHub, AWS, and Microsoft Azure, support Google Authenticator as an option
    for MFA.


    At a high level, TOTP works by having a secret key that is generated on a server
    and shared with the device. The TOTP algorithm takes two inputs, the secret plus
    system''s Unix time, results in a one-time password known by both the device and
    the service. Google provides a pluggable authentication module (PAM), google-authenticator-pam
    [1], that system administrators can integrate into various Linux servers with
    Google Authenticator. As a PAM module, it can be used with virtually any Linux
    service with robust industry-standard authentication methods. In this article,
    I will specify integrating Google Authenticator with SSH logins.


    ## Advantages of MFA with SSH


    You will find MFA useful on servers that have SSH open to the Internet or have
    SSH open to large networks. By adding MFA to SSH, you can mitigate brute-force
    attacks on SSH servers, as well as the impact of user passwords. An attacker would
    need both the user''s Android or iPhone device and the Google Authenticator secret
    key to gain access to their user account via SSH.


    Typically, SSH brute-force attacks on the Internet are detected by password, and
    adding TOTP negate this type of attack. However, if a password leak is suspected,
    or a password seems to have been discovered by an attacker, it is necessary to
    change the password whether MFA has been implemented or not.


    Server 22.04 uses systemd-timesyncd for system synchronization, but it does not
    have an NTP server configured by default. To determine if the NTP service is active,
    use the following command:


    ```

    $ timedatectl status

    ```


    PAM looks for service-specific configuration files within /etc/pam.d/ by default.
    OpenSSH server has a file located at /etc/pam.d/sshd. Add this configuration line
    to the bottom of:


    ```bash

    auth required

    pam_google_authenticator nullok

    ```


    The nonullok option for testing, allows users that have not generated a secret
    key to authenticate with only their password. Once keys have been added to all
    SSH users, the nullok option will be removed to enforce MFA.


    Finally, reload the SSH server configuration with:


    ```

    $ systemctl restart systemd-timesyncd

    ```


    The system should synchronize its time with the NIST NTP server.


    ```bash

    $ systemctl restart sshd

    ```


    ## Considerations


    MFA may provide additional security for authentication with SSH, but it does not
    make sense for all cases. Bastion hosts, which are manually accessed by users
    or as a jump host, are usually used for cases where internal hosts are located
    behind a jump host. MFA codes will be required for the jump host and the destination
    server. You may choose for users on login. If a bastion host is configured with
    the MFA server on the network Internet, then SSH hosts that are only accessible
    internally could be sufficiently secured with normal password or key authentication.


    I recommend adding NIST''s NTP server as primary server, or another NTP service
    as default.


    ## Configuration


    The OpenSSH server must be configured to use /etc/pam.d/sshd config for the authentication
    using the UsePAM line. On Ubuntu server, sshd is configured to use PAM by default.
    Add the pam_google_authenticator option before the required line.


    Once these configurations have been added to sshd_config, you will need to add
    the Google Authentication module to PAM.


    ## Generating a Key


    Next, you will need to generate a key for your user account. If you are logging
    in with the user account you will see the authentication code: entering the password
    or authenticating with your key. Just click Enter. After added nullok to login,
    you will be authenticated. Once logged in to generate a secret key. Run the command,
    and you will be prompted to choose whether the token is: enter for y.


    ![](img/9114a5c8af7098772983e86dad17c99b_64_0.png)


    ```

    Your secret key is: HRBAMCA36XL.WODM9KZ2FE

    Next code configured if

    Your verification codes are:

    231596

    852263

    924673

    063240

    Do you want me to update your "home/user/.google_authenticator" file? (y/n) y

    Do you want to allow multiple uses of the same token? This restricts you to login
    once every 90 seconds, but it is more convenient if you use multiple devices.
    (y/n) y

    ```


    By default, a new token is generated every 30 seconds by the mobile app. This
    allows for a small window between the token being generated and the current time.
    This is for if you experience problems with poor time synchronization, you can
    increase the window by changing the code limit to 17 permitted codes (the 8 previous
    codes, the current code). This will persist for a time of up to 4 minutes between
    client and server. Do you want to go back? (y/n) y


