    \n参数如 `--geometry 800x600 -resize 50%` 用于缩小图像尺寸。你可以使用像列表 4 中的批量命令创建文件夹中所有 JPEG\
    \ 的缩略图。如果你想获取文件名并保存到单独的文件夹（例如 thumbs/）中，命令可能如下所示。如何创建 thumbs/ 文件夹？如果你只想编辑图像页面或条目的尺寸，请使用\
    \ 200x280 或 `-resize` 代替 200x280。如果你想使用缩略参数代替 `-resize`，它会自动删除元数据中的注释和颜色配置文件（第\
    \ 3 行）。\n\n```bash\nconvert SOURCE TARGET\n```\n\n这会创建一个新文件，保持原始文件不变。对应的 `mogrify`\
    \ 使用几乎相同的语法，但它会直接处理源文件。如果你需要从一种格式转换为另一种格式并同时重命名文件以更改格式：\n\n```bash\nconvert image.jpg\
    \ image.png\n```\n\n如果你只需要文件名：\n\n```bash\nconvert image.jpg photo.jpg\n```\n\n\
    结合使用时，命令为：\n\n```bash\nconvert *.jpg photo.png\n```\n\n如果需要，你可以将一种类型的所有文件转换为单一格式。有几种可能的方法可以选择。命令：\n\
    \n```bash\nconvert *.jpg *.png\n```\n\n将所有 JPEG 文件转换为 PNG 格式，但不使用原始名称。目标文件将被命名为\
    \ `*-1.jpg`、`*-2.png` 等。不过，你可以通过终端命令轻松更改。如果你想旋转或调整图像大小，`mogrify` 通常证明非常有用，因为它直接转换源文件。例如，如果文件夹中的所有图像都应该以竖屏显示\n\
    \n## 列表 4：创建缩略图\n```bash\n01 convert *.jpg -resize 200x200.jpg\n02 for i in *.jpg;\
    \ do convert \"$i\" -resize 200x200 \"thumbs/$i\"; done\n03 convert *.jpg -thumbnail\
    \ 200x200.jpg\n04 convert *.jpg -delay 100 *.jpg animation.gif\n```\n\n图 1：要应用模糊，请使用\
    \ `-blur RADIUS`。\n\n# 教程 – IMAGEMAGICK\n\n你可以以类似的方式将图像区域转换为动画。要从一组 JPEG 文件创建动画\
    \ GIF，请使用列表 1 第 4 行的命令。输入 `-delay` 值，单位为百分秒；如果像示例中那样指定为 10，则每秒出现一张新图像。\n\n## 效果与压缩\n\
    \n你可以利用 `convert` 和 `mogrify` 做更多事情，直接直接集成效果。你可以使用 `-blur` 对特定的固定半径应用模糊（图 1）。如果你想让图像看起来更有艺术感，`-charcoal`\
    \ 可以为你提供铅笔画效果（图 2）。要模拟彩色铅笔画，使用 `-sketch RADIUS(3)`。\n\n如果你想压缩图像以节省空间，有多种算法可以作为\
    \ `-compress TYPE` 选项选择。它们包括 bzip2、JPEG、Lossless（无损）、WebP 等。使用 `-contrast=+` 来增加或减少图像的对比度。`-sharpen\
    \ RADIUS` 增加锐度，0 是一个很好的起始值。你可以更改轴两侧的值，直到达到预想要的结果。要给你的图像加上边框：\n\n```bash\nconvert\
    \ input.jpg -border 1x1 -borderColor 0xFFF0F0\n```\n\n图 2：炭笔画效果随后与柔焦融合，创建一个厚度为一像素的红框。\n\
    \n## 版权及其他\n\n一旦你使用 ImageMagick 的工具创建自定义形状、为图像标记图片来源，或为在线预览添加水印，就会涉及到更多内容。列表 5\
    \ 中的命令在源图像的左下角添加版权标签（South - 方位方向的首字母大写）。这里使用的字体是白色的 150 像素大小 DeVu-Sans。y 轴跟随\
    \ `-annotate` 可以在需要时按像素移动字体文本（例如 `+58`）。在示例中，我将其留在了原始位置。\n\n图 3：这种素描效果需要完善。\n\n\
    ## 列表 6：水印\n```bash\ncomposite -watermark 50 \\\n-gravity Center \\\nWATERMARK.png\
    \ \\\nSOURCE.TARGET.jpg\n```\n\n图 4：水印保护你的图像在线。\n\n## 列表 5：标签\n```bash\nconvert\
    \ Image.jpg -gravity South -pointize 150 -fill white \\\n-font DeVu-Sans -annotate\
    \ 0 'c' PHOTO FROM XYZ / 2022 / target.jpg\n```\n\n## 列表 7：拼贴\n```bash\nmontage\
    \ -label % \\\ngeometry 800x600+10 \\\n*.jpg index.jpg\n```\n\n# 教程 – IMAGEMAGICK\
    \ LINUX 之声\n\n已字字体拼写由以下命令提供：\n\n```bash\nconvert -list font\n```\n\n设置水印，最好使用\
    \ ImageMagick 的 `composite` 将具有透明通道（即透明背景）的现有图像标记源图像（图 4）。该值位于 0（透明）到 100（完全不透明）之间。列表\
    \ 6 示例中的 50 意味着 50% 的容量。像使用星号代替文件名的命令适用于特定类型的所有文件。\n\n## 合并图像\n\n你可以使用 `assemble`\
    \ 命令将图像合并到一个文件中。一些摄影师使用它单独捕捉图像。列表 7 中的命令将所有图像以 800x600 的大小并排保存。\n\n## 信息\n\n-\
    \ [1] ImageMagick: https://imagemagick.org\n- [2] ImageMagick 绘图: https://imagemagick.org/Usage\n\
    \n# 作者\n\nClaudius Grieg 多多少通过命令行界面发现 ImageMagick，从那时起在他的 Debian 系统上使用它进行图形和照片的批量转换。\n\
    \n## 结论\n\n本文提到的功能仅是 ImageMagick 的表面。即使你从未完全精通它或创建复杂的组合，ImageMagick 在日常生活中转换格式、调整大小或嵌入水印方面仍然是一个方便的工具。\n\
    \n# 了解 ADMIN\n\nADMIN Network & Security 杂志是你解决现实问题技术解决方案的来源。ADMIN 包含了针对专业读者的对当代话题的详细讨论，涵盖安全、云计算、DevOps、HPC、容器、网络等。\n\
    \n订阅 ADMIN 每年可收到 6 期杂志\n\n想让 ADMIN 进入你的收件箱吗？\n\n免费订阅 ADMIN Update，获取杂志中没有的新闻和技术文章。\n\
    \nbit.ly/HPC-ADMIN-Update\n\n"
