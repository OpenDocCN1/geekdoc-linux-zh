    # MakerSpace: Four Raspberry Pi advertising and tracking blockers


    Trustworthy


    A Raspberry Pi with the right software filters out annoying ads and nasty trackers
    for end devices on our local network.


    By Erik Bwaldt


    Advertising on the Internet can be intrusive and annoying, with trackers on your
    web browser. For standalone workstations, unwanted content can be easily restricted
    or blocked by browser extensions. However, if you want to configure several workstations,
    setting up the extensions can take a great deal of time. Luckily, connect and
    configure them once on the local network. For the most part, the systems automatically
    update during operation, which avoids avoidable overhead for customization and
    regular updates. Manual configuration of the clients is also largely eliminated.
    The tools support various devices. In addition to computers, smartphones, tablets,
    and Internet of Things (IoT) devices are automatically protected.


    ## Functionality


    The solutions presented in this article can be integrated directly downstream
    of the router on the local network so that all incoming and outgoing data runs
    through them. These appliances act as DNS servers in this process, which sets
    up a wireless network for you to access the Internet securely. Some of the solutions
    also integrate VPN servers and anonymize IP addresses. Beyond the VPN, the workstations
    on the internal network can no longer be identified by their IP addresses. All
    of the solutions discussed are free software, and the hardware is usually based
    on a Raspberry Pi.


    One of the main advantages of centralized appliances is that you only need to
    configure the system once.


    ## AdGuard Home


    The AdGuard Home [1] DNS server contains blocks that distribute advertising and
    spying on surfing. Known malicious domains can be blocked with lists: the software
    does not require a client on the end-device. Just install it on a Raspberry Pi
    and it protects the whole network. As its base, AdGuard Home requires an installed
    operating system, such as Raspberry Pi OS. This provides the small board computer
    (SBC) with a static IP to avoid the problems caused by an address change after
    a reboot. The application can then be installed and started with a single command
    at the Raspberry Pi''s terminal:


    ```

    $ curl -s https://raw.githubusercontent.com/AdGuardTeam/AdGuardHome/master/install.sh
    | sh -v

    ```


    The software automatically detects the hardware you are using, sets up the system,
    and shows at the end of the information on how to access the tool''s web interface
    and control the application at the prompt. As soon as you have the specified URL
    in a web browser, a graphical setup wizard guides you through the configuration
    in five steps, requiring you to create a user and password to protect access.


    The wizard provides detailed instructions for configuring the router and network
    work. For the AdGuard Home server, you need to modify the DHCP and DNS settings
    on the Router for internet; otherwise, problems could occur. After completing
    the basic setup, log to the web browser and access the dashboard (1).


    The dashboard displays all the connected clients, DNS requests, demands, and filtered
    pages in a graphical view. Underneath is a table of the most requested domains,
    and a list of the most frequently blocked domains. AdGuard Home does not update
    these statistics, but you can update them manually by clicking Refresh statistics.


    After closing and reopening the administration interface, you do need to specify
    the port number in the URL unless you use the default values during the basic
    setup.


    Various settings (e.g., control filter) are enabled in the Settings | General
    settings. In this dialog, you can also specify how you want AdGuard Home to handle
    the blocking lists. The Enforce safety option protects predefined web pages.


    Depending on the size of your local network, and the volume of data traffic, you
    may want to modify the local filters. In General settings | Configuration, you
    can define how long the server keeps the logs and which client IP addresses are
    anonymous.


    In DNS settings, you can add additional DNS servers on top of the existing upstream
    DNS server. With multiple servers, the server supports load balancing and giving
    priority to the fastest server, but you can change this behavior by clicking on
    the radio button to the left of the alternatives.


    If the logging function is enabled, AdGuard Home lists all requests in the Query
    log, lists the requested servers, and messages of the requests, also in the Client
    counter - from the network which you are visiting. You can use these logs to readjust
    filters. For local clients, certain servers can be blocked by clicking Block (2).


    The Filters | DNS blocklists contains two filters with a list of 55,000 domains.
    Checking a box enables a list, whereas the Check for updating button updates the
    enabled lists.


    To add additional blocklists, click the next dialog, you can decide whether or
    not to add one or more items from a list of predefined blocklists (3). The selection
    dialog for predefined blocklists lets you include general lists with advertising
    and tracking domains and integrate malware domain lists. You will also find regional
    lists sorted by category.


    Figure 1: AdGuard Home''s start-up is straightforward.


    Figure 2: The AdGuard Home logging functions support many domain blocking.


    ## eBlocker


    eBlocker [2] is a complete solution for the Raspberry Pi, the Raspberry Pi M2+,
    and VirtualBox machines. eBlocker started as a hybrid hardware and software solution.
    However, the manufacturer distributed commercial eBlocker devices in 2019, while
    continuing to maintain the software eBlocker as it becomes a legacy project.


    Developers of eBlocker stipulate a minimum requirement of Raspberry Pi with at
    least 1GB of RAM, but recommend a fourth generation with at least 2GB of RAM.
    The system requires a microSD card that meets at least recommended classification
    10. In terms of power supply, the project advises you for at least 3A.


    Browsers have certain functions that cannot be used in combination with eBlockerOS.


    To begin, download the latest eBlockOS image, which weights in nearly 740MB, unpack
    the image with an archiving tool. The result is that you can transfer to a microSD
    card with a tool like BalEtcher [4] or the command:


    For heterogeneous environments with Windows clients, you can also enable a specifically
    listed value to the vulnerabilities of your operating system.


    To create eBlockOS, click Dashboard for this. In the setup, you can accept the
    agreement. After completing the setup, you will be taken to the dashboard.


    ## Pi-hole


    Pi-hole [5], designed for the Raspberry Pi but also available for Intel/AMD architectures,
    is one of the best known for at least 2GB of disk space and 512MB of RAM. Pi-hole
    turns the Raspberry Pi into a DNS server that filters all packets. You can also
    save profiles for different devices (e.g., block ads).


    ## Author


    Erik Bwaldt is a self-employed IT admin and technical author working in the United
    Kingdom. He writes for IT magazines.

