    并转向 Fediverse。我们不再是他们的奴隶。当记者像关注 Twitter 账户一样关注 Mastodon 账户作为新闻报道时，潮流必将开始扭转。但被引用的这些人只是社交用户的一小部分。大多数人使用社交媒体作为与朋友交流的方式，自由地创建自由的圈子来保护他们的隐私，并让他们免受数据挖掘和定向广告的影响。


