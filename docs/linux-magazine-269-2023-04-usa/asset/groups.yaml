    # 疯狗的狗窝


    对于从 Windows XP 所有者到兴趣广泛的用户来说，Linux 都是一个极佳的选择。作者：约翰“MADDOG”·霍尔


    ## 通往 Linux 之路


    我不经常写关于在 Linux 专业人员协会（LPI，或 loco）的工作，但有几个由 LPI 牵头的昂贵项目值得注意。第一个项目是[升级到 Linux](https://upgradelin.com)，它最初关注那些无法升级
    Windows 11 的 Windows 用户。他们可能需要更多内存，或者另一块显卡，亦缺少 TPM 模块，那么 Windows 用户就必须升级硬件，或者在某些情况下购买一台全新的系统。


    目前尚不确定 Windows 11 是否会放弃这些要求。有些软件功能可能无法进入 Windows 11。


    当然，微软指出他们将支持 Windows 10 长期一段时间，等客户回来时，软件 Windows 11 可能已经“自然而然”地拥有了一台更新的机器。但仍有数百万在使用
    Windows XP 的人，由于各种原因，他们无法迁移到某个 Linux 版本。


    这就是 LPI 等其他机构提供升级指南的原因。


    然而，Linux 程序并不只是讨论从 Windows 10 开始的路径。它讨论了迁移到 Linux 的所有优势，即使你已经足够，或者（更好的是）根本就没有被
    Windows 困住。


    在这个升级计划中，LPI 意识到有很多当时被问到的问题并不是关于自由开源软件（FOSS）或他们的预期。自由开源软件，尤其是 Linux，现在已经是主流，值得你作为升级路径来考虑。


    “升级到 Linux”计划不仅限于 LPI。还有许多其他机构，如 Ubuntu、Red Hat 和 opencloud 也已经加入，LPI 欢迎其他机构加入。


    第二个倡议是[Linux 俱乐部](https://www.linuxclubs.org/)。基于 Steve Krof 的 Aspen 学院的卓越工作，Linux
    俱乐部计划让建立一个俱乐部变得更容易，让学习计算机变得更简单有趣。在一个不直接挂钩课程的环境中，他们营造了一种鼓励“在做中学习”的环境。


    项目示例包括为负担不起新电脑的个人（及机构）回收笔记本电脑和台式机。在这些系统上使用免费软件可以避免旧版 Windows 系统在不购买新许可的情况下转给新用户时经常遇到的许可成本问题。此外，俱乐部参与者可以随心需要发现软件，因为他们都能使用这些软件。


    Linux 俱乐部培养了对计算机不感兴趣的学生兴趣。因为自由软件涵盖了广泛的软件工具，所有对摄影、音乐、视频和其他学习领域感兴趣的学生都将以低成本或零成本使用并提高他们在这些领域的技能。


    Linux 俱乐部让我想起 1969 年我在都柏林大学上学时的开始。当时我在电气工程（11 伏和 800 安培）方面过得很困难，为了省钱，我参加了一个关于如何使用
    Fortran 语言操作 IBM 1130 计算机的函授课程。回到都柏林完成最后的教育后，我发现了一个有很多计算机的小型工程实验室。通过实践，我学会了如何用汇编语言编写这些机器。使用免费提供的软件很有帮助。


    我创立了 Linux 计算机俱乐部，这帮助开启了我作为程序员和教育工作者的职业生涯。


    LPI 通过提供免费软件解释了 Linux 的概念，并向潜在的 Linux 俱乐部负责人展示如何获取他们参与者可能需要的硬件。


    我喜欢所有的项目，但我特别感谢“升级到 Linux”是如何从我某天向 LPI 员工的一段抱怨演变成如今的。


    Carpe Runt


    80

