    for one and all.


    Most of the improvements added to the desktop come by means of improvements, so
    you won''t find a plethora of features, but there are some worth noting.


    There is a new Firefox rehash option in the System settings and a new to KDE Plasma
    app that helps users on how to set online accounts and more.


    In this release, new features are overshadowed by improvements and bug fixes.
    In Wayland, the primary monitor shows statuses for charging, discharging, and
    Dolphin now selects the file when you delete a file; and the Discover search is
    much faster.


    In the System settings windows now use a more "frameless" (as opposed to the previous
    themed view); the configuration widget is now found in the System Tray and is
    inactive when you have only one attached monitor; a multi-monitor rehash has been
    undertaken, to make work better with multiple displays; the calendar and the KWin
    Tiling Session can be banished with Meta-T.


    You can find out more about what can be found in the new update of the release
    notes (https://kde.org/announcements/plasma/5.260). To experience the latest KDE
    experience, your best bet is via KDE Neon ISO (https://neon.kde.org).


    ## SparkyLinux 6.6 Available for Installation


    SparkyLinux offers four different desktop editions, LXD 0.16.0, Xfce 4.16, KDE
    Plasma 5.2.0, and Openbox 3.6.1, and benefits from all the upgrades found in those
    environments. The biggest addition to SparkyLinux is the change to bring the Sparky
    USB Center.


    With the release, it is now possible to create live installations with persistent
    storage. This means you can use a version of SparkyLinux with, wherever you go,
    that will include any data you save to the USB drive.


    Because SparkLinux 6.6 is powered by the Linux kernel, some of the installed packages
    may be out of date, but that is not the case.


    SparkLinux uses the Debian base, which include stable packages for the installed
    software. These software packages are the latest releases, which are installed
    from the Debian and Sparky repos (as of February 4, 2023). Some of the app versions
    found in SparkyLinux 6.6 include Firefox 102.0.7-esr, Debian 10.6.0, and LibreOffice
    7.0.4.


    You can read more about this release for SparkyLinux on the official release notes
    (https://sparklinux.org/sparky-6-6/) and download an ISO image (https://sparklinux.org/download/)
    for installation.


    ## Elementary Linux 8.0 Available


    Elementary Linux is distributed among the education sector, from preschool to
    school, and is a collection of educational software. This distribution can be
    installed on either 32-bit or 64-bit hardware and is based on Bodhi Linux.


    The list of pre-installed educational software is impressive, with the likes of
    TuXpaint, GIMP, G, Scratch, Whatsapp, Geogebra, Kalibre, and many. Along with
    the educational software, you will also find packages like LibreOffice, GIMP,
    Inkscape, Firefox, Chrome, Chromium, and more.


    As of the latest update, the core of the 64-bit release is based on Bodhi Linux
    7.0, which is based on Ubuntu 20.04 LTS Focal. The kernel is based on Bodhi Linux
    6.0, which is the 64-bit version of Ubuntu 18.04.1 B, and the 32-bit version with
    kernel 4.19.


    For new features, you will find a brand-new installer, updated applications, and
    an updated Developer Pack, which includes the latest of Android Studio, Apache
    Spark, and Firefox.


    Make sure to read the release notes for the 25th-anniversary (https://news.itsfoss.com/escuelas-linux-8-0-release)
    and download an ISO for installation (https://sourceforge.org/projects/escuelaslinux/).


