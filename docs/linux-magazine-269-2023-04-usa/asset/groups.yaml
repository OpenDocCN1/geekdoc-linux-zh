    # # Scheduling Specialist


    If you have a business that requires customers to make an appointment in advance
    for services, letting them request the appointment via Easy!Appointments can free
    up your phone line. By Rubén Llorente


    air salons, medical offices, and other small businesses need to book an appointment.
    Traditionally, small business machines manage these appointments by offering a
    phone number. Customers call in, and (or the business


    owner!) sets a date and time, usually writing everything down in an appointment
    book. While this approach works, it suffers from many shortages. Customers can
    only phone when the office is open. In addition,


    internal management becomes cumbersome if more than one person needs to know the
    next day''s schedule: the receptionist then has to spend time telling each employee
    the weekly schedule instead of working on important tasks.


    Table 1: Easy!Appointments 1.4.3 Prerequisites


    | | |

    |---|---|

    | Web server | Apache 2.4 |

    | Database | MySQL 5.7 |

    | PHP engine | PHP 7.3 |


    # LAMP Servers in a Nutshell


    Linux, Apache, MySQL, PHP (LAMP) describes machines serving web applications built
    upon these tools. Setting up a LAMP server is very easy, but deploying one is
    outside the scope of this article. For testing purposes, you can set a LAMP server
    in the cloud using a virtual server (VPS) from Hetzner with a LAMP stack preconfigured.
    For more information, see Hetzner''s documentation (2).


    ![](img/9114a5c8af7098772983e86dad17c99b_57_0.png)


    Figure 1: You can deploy a LAMP server via the Hetzner Cloud for testing purposes,
    if you don''t want to roll one manually. Hetzner Online GmbH


