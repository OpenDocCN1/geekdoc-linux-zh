    LibreOffice is the favorite office software for many Linux users. With the latest
    release, version 7.5, there are plenty of new features and even some visual refreshing
    that has gone into the software.


    One of the most obvious changes comes by a new icon set that is more colorful
    and vibrant. Also, if you use LibreOffice on a touch-based device, control and
    navigate fully multi-touch gestures. And you will find many major changes to the
    UI, the changes help make LibreOffice more modern and professional-looking.


    Other changes include bug fixes for each module, e.g., entering numbers with a
    single quote in Calc now behaves correctly to strip the prefix followed by a number.
    Calc now also supports DMF Mazovia Encoding for Virtual files, and some conditional
    formatting options are case-sensitive.


    The Writer bookmark mode also received updates to easily edit a bookmark from
    the Settings dialog. Hidden bookmarks are now correctly editable, bookmarks are
    visible in the document, and bookmarks are no longer needed using screen readers.


    The developers also spent a good deal of time improving MS compatibility, export
    features, and the macro programming tools.


    To find out more what''s new and improved in LibreOffice 7.5, make sure to read
