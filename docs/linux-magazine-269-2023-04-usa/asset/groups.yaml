    # REVIEW Distro Walk – EuroLinux


    for those accustomed to Windows or macOS. [For instance:]

    * The translucent dock at the bottom of the screen is modeled after the latest
    versions of these systems. As the dock is partially visible, in EuroLinux Desktop
    we have disabled the now redundant overview mode and the Gnome hot corner function,
    which displays mode when your mouse moves over the top left corner of the screen:


    +   * EuroLinux allows icons to be placed on the desktop by default, although
    the popular Gnome manager does not provide such functionality.

    * When you right-click on the wallpaper, additional menu items appear (including
    New Text Document). We have added icons for notifications from instant messaging
    or email forwards. EuroLinux Desktop lets you switch day/night themes with a single
    click


    on the moon in the dock and allows you to set a schedule for automatic switching
    based on the time of day.

    We integrated the system with the Flatub repository, which provides easy access
    to more than 2000 free apps. They are downloadable from the Software application.
    You can install them with a single click – analogous to the Microsoft Store or
    App Store.


    # Conclusion


    In many ways, EuroLinux is a case study in the position of commercial distributions.
    On the one hand, EuroLinux carefully breaks down products and services for customers.
    On the other hand, EuroLinux remains continually aware of the expectations of
    the community. Not only does it continue to offer a download version, but its
    use of developers for support seems likely to appeal to open source advocates.
    It is a balancing act that EuroLinux performs well.


