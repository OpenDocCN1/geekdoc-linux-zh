    # The Fediverse


    Social media tools connect the world, bringing us the latest news and commentary
    from politicians, movie stars, community leaders, and remote friends. But the
    tracking and data mining of the commercial social media platforms has left many
    users searching for a better option. This month we dive into the alternative universe
    for social media users: the Fediverse.


    # LINUXVOICE


    79 Welcome

    This month in Linux Voice.


    80 Doghouse — Expanding the Base

    Linux can be a great new option for users from Windows XP owners to students with
    a range of interests.


    81 Linux Boot

    If you want to troubleshoot startup issues, you need to understand Linux boots.


    84 FOSSTicks

    This month Graham looks at MuseScore 4, KZones, Whipper, YouPlot, DDFS-VST, FreedroidRPG
    1.0, and more!


    90 Tutorial — ImageMagick

    The free ImageMagick graphics toolbox the feature set of a full-blown image processor
    to the command line.


    # IN-DEPTH


    58 Appointment Scheduler

    If you have a business that requires customers to make an appointment in advance,
    letting them request the appointment via Easy!Appointments can free your phone
    line.


    64 Multifactor Authentication with SSH

    The Google Authenticator PAM module allows you to use time-based Google Authenticator
    passwords with Linux services, including SSH.


    # MakerSpace


    68 SMath

    Present complex equations with intermediate steps, graphics, plots, and results
    in SMath.


    72 Privacy Appliances

    A Raspberry Pi with the right software filtering out noisy ads and nasty trackers
    for end devices on your local network.


