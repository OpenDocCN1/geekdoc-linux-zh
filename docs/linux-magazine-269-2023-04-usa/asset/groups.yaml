    ## #267/2023年2月

    ### 备份


    理论上，每个人都可以使用相同的备份工具，但将定期、系统化的备份融入生活的最佳方法，是找到适合你自己习惯和方法的解决方案。本月，我们预览了 Linux 领域中一些热门的备份应用，以便你找到适合自己的工具。

    **光盘内容：** Linux Mint 21 Cinnamon 和 Kali Linux 2022.4


    ![](img/9114a5c8af7098772983e86dad17c99b_94_2.png)


    ## #266/2023年1月

    ### 生成式对抗网络


    计算机艺术和伪造视频近期爆发背后的秘密是什么？一个神经网络连接到另一个神经网络……

    **光盘内容：** Ubuntu 22.10 和 AlphaLinux 9.0


    ![](img/9114a5c8af7098772983e86dad17c99b_94_3.png)


    ## #265/2022年12月

    ### 量子计算


    大多数用户都知道这项未来技术利用了量子力学的奇异力量。但它真的有效吗？我可以用它做什么？今天是否有可用工具可以帮助我实验？本月，我们深入探讨量子计算。

    **光盘内容：** Manjaro 21.3.7-220816 和 Arch Linux 2022.10.01


    ![](img/9114a5c8af7098772983e86dad17c99b_94_4.png)


    ## #264/2022年11月

    ### 人工智能


    尽管机器学习现在已经是我们日常生活中不可或的一部分，但它仍然充满了神秘色彩。本月，我们将揭开一些流行的监督学习和无监督学习技术的神秘面纱。

    **光盘内容：** Debian 11.5 和 Rocky Linux 9.0


    ![](img/9114a5c8af7098772983e86dad17c99b_94_5.png)


    ## #263/2022年10月

    ### 构建一个 IoT Linux


    Linux 最惊叹的地方在于它的灵活性。Linux 系统运行在世界上最大的计算机上，也运行在许多为你家庭环境提供设备上。如果你好奇开发者如何让 Linux
    运行在小型科技设备上，你会喜欢本月关于 Buildroot 和 Yocto 项目的故事。

    **光盘内容：** 《Linux 杂志》第 1-262 期


