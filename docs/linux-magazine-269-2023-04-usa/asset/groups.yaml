    ## MAKESPACE 隐私设备


    安装完成后，系统会自动弹出一个配置向导。

    在向导中，你需要为电脑设置静态 IP 地址、DNS 提供商（Pi-hole 使用该提供商来解析请求），并加载屏蔽列表。下一步是启用用于管理的 Web ，并为数据日志指定更多细节。


    Pi-hole 按照允许和屏蔽的域名以及请求类型进行排序。系统还会显示使用了哪些上游服务器。在最底部有关于网络客户端的额外信息。


    Pi-hole 的一个核心功能是能够对个人进行分组并分离过滤流量。例如，你可以将某组人员使用的平板电脑或手机进行分组，并为它们定义统一的规则。这种过滤选项消除了为每个单独设备进行配置的时间。


    你可以通过本地网络上的任何浏览器访问 Pi-hole 界面：`http://pi-hole/admin` 或 Pi-hole 的 IP 地址。你将进入配置所需的设置选项（图
    6）。


    你会发现与客户端、被屏蔽查询和过滤器列表最重要的数据将以图形方式显示。然而，这些信息通过饼图可视化了被屏蔽的请求数量以及访问最频繁的域名。


    要将单个域名添加到屏蔽列表，你将使用 `Domains`（域名）对话框。你也可以包含列表中的所有域名。或者，你也可以在 Adlists（广告列表）部分通过列表的
    URL 添加要屏蔽的列表，然后运行 `pi-hole -g` 命令将列表添加到系统。或者，你也可以按照对话框提供的链接在浏览器中更新列表。


    新添加的列表将出现在输入对话框下方的表中，可以通过点击列表右侧的红色叉再次显示。默认情况下，Pi-hole 为所有组启用新的屏蔽列表。你还可以将特定列表分配给终端组。


    在侧边栏的 Groups（组）菜单中，你可以创建任意组，并在其中启用或禁用单个客户端。Pi-hole 发现的终端设备及其 MAC 地址将出现在下拉列表中。你可以为局域网创建一个单独的组并将每个客户端分配到一个组。


    要在指定时段禁用 Pi-hole，请从侧边栏的 *Disable Blocking*（禁用屏蔽）中选择相应选项，并指定你不希望应用程序运行的时段。


    可以通过两种方法之一来扩展 Pi-hole 的屏蔽列表：


    ![](img/9114a5c8af7098772983e86dad17c99b_75_0.png)


    图 6：Pi-hole 仪表板具有人体工程学且现代的设计。


    ## MAKERSPACE 隐私设备


    ![](img/9114a5c8af7098772983e86dad17c99b_76_0.png)


    图 7：在 Pi-hole 中选择性地向域名进行屏蔽。


    每个部分显示一百条目。如果你想将其中之一添加到黑名单，点击 Blacklist（黑名单）。在确认提示后，Pi-hole 将该域名添加到相同域屏蔽列表中（图
    7）。


    软件现在会打开一个对话框，你可以在其中输入新密码并更改管理员用户名。对于线缆局域网中的每个设备，你可以在仪表板中找到它的状态，通过选择单选按钮单独检查 WiFi
    网络上每个工作站的保护状态。设备默认处于静音模式。


    ## upbrix


    Upbrix 是内域网中央过滤解决方案中的老兵了。你可以从项目的 GitHub 页面 (6) 下载适用于你的树莓派（第三代）的免费软件，镜像文件为 650MB。Upbrix
    在启动时设置 WiFi 网络，但你需要通过电缆连接到局域网以完成设置。在网络上的任何电脑上操作，使用 WPA2 密钥登录 Upbrix 网络并在浏览器中访问
    URL：upri.box:8430。在安全提示后，你将进入系统管理界面。在登录界面，使用用户名和更改后的默认值登录！你现在将进入带有设备概览的仪表板（图 8）。


    开始之前，点击窗口右上角的用户名更改 upbrix 用户的密码。


    ![](img/9114a5c8af7098772983e86dad17c99b_76_1.png)


    图 8：Upbrix 仪表板看起来简单，但它提供了你所需的所有信息。


    LINUX-MAGAZINE.COM 第 269 期，2023 年 4 月 77 页


    ## MAKESPACE 隐私设备


    ![](img/9114a5c8af7098772983e86dad17c99b_77_0.png)


    **图 9：** up-ribox 配置对话框相当简单。


    在右侧列激活的 Ninja mode（忍者模式）允许进行网络浏览 [7]。然而，数据吞吐量明显低于静音模式。


    如果两种保护模式之一不再显示颜色，点击页脚中的单选按钮显示网络的所有保护机制。点击设备名称之一将显示客户端的互联网使用统计数据。


    要设置系统，点击左侧的 Configuration（配置）；此设置涉及五个选框勾选或取消勾选对 2022 年 12 月 1 日设置的 up-ribox 的访问。重新设置
    up-ribox。


    你的 WiFi 网络和追踪器。在右侧列激活的 Ninja mode 允许进行网络浏览 [7]。然而，数据吞吐量明显低于静音模式。


    如果两种保护模式之一不再显示颜色，点击页脚中的单选按钮显示网络的所有保护机制。点击设备名称之一将显示客户端的互联网使用统计数据。


    要设置系统，点击左侧的 Configuration（配置）；此设置涉及五个选框勾选或取消勾选对 2022 年 12 月 1 日设置的 up-ribox 的访问。重新设置
