    \ You can also include all domains in the list. Alternatively, you can add lists\
    \ to be blocked in the Adlists section by using the URL of the list and then running\
    \ the `pi-hole -g` command to add the listing to the system. Alternatively, you\
    \ can follow the link provided in the dialog to update the lists in your browser.\n\
