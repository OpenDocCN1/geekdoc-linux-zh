    # LINUX NEWSSTAND


    Order online:

    https://bit.ly/Linux-Newsstand


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics to complete your collection.


    ![](img/9114a5c8af7098772983e86dad17c99b_94_0.png)


    # #268/March 2023

    Data Poisoning


    Think computers don''t make mistakes? If you slip some doctored-training samples
    into the mix, you can get a fancy machine-learning system to think a dog is a
    cat or a 1 is 8 – you can trigger this behavior through a hidden signal no one
    else will notice.

    **On the DVD:** MX Linux 21.3 and Puppy FossaPup 9.5


    ![](img/9114a5c8af7098772983e86dad17c99b_94_1.png)


    # #267/February 2023

    Backup


    In theory, everyone could use the same backup tool, but the best way to build
    regular and systematic backups into your life is to find a solution that fits
    your own habits and methods. In this month, we preview some popular backup apps
    in the Linux space so you can find one that works for you.

    **On the DVD:** Linux Mint 21 Cinnamon and Kali Linux 2022.4


    ![](img/9114a5c8af7098772983e86dad17c99b_94_2.png)


    # #266/January 2023

    Generative Adversarial Networks


    What is the secret behind the recent explosion of computer art and fake videos?
    One neural network links to another neural...

    **On the DVD:** Ubuntu 22.10 and AlphaLinux 9.0


    ![](img/9114a5c8af7098772983e86dad17c99b_94_3.png)


    # #265/December 2022

    Quantum Computing


    Most users know that this futuristic technology leverages the weird power of quantum
    mechanics. But does it really work? What can I do with it? Are there tools available
    today that will help me experiment? This month we dive into quantum computing.

    **On the DVD:** Manjaro 21.3.7-220816 and Arch Linux 2022.10.01


    ![](img/9114a5c8af7098772983e86dad17c99b_94_4.png)


    # #264/November 2022

    Artificial Intelligence


    Machine learning is shrouded in mystery even though it is now an integral part
    of our everyday world. This month we look behind the curtain at some popular techniques
    for supervised and unsupervised learning.

    **On the DVD:** Debian 11.5 and Rocky Linux 9.0


    ![](img/9114a5c8af7098772983e86dad17c99b_94_5.png)


    # #263/October 2022

    Build an IoT Linux


    The most amazing about Linux is its flexibility. Linux systems run on the biggest
    computers in the world – and on many of the devices that power your home environment.
    If you''ve wondered how developers adapt Linux to run on tiny tech, you''ll appreciate
    this month'' stories on Buildroot and the Yocto project.

    **On the DVD:** Linux Magazine Archive issues 1-262'
