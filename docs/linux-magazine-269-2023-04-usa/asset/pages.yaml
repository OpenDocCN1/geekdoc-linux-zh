    # ## Command runner


    # # just


    Command runners are curious because there are so many ways to automate the running
    of commands. Shells are the simplest most widely used. If you can put a command
    into a shell, you can then turn it into a repeat script. But they''re also prone
    to errors, and not particularly clever with arguments, locations, or other systems.
    If the size of the scale is massive, which has a heavy syntax of over running
    and controlling the commands, just named just is just another example, and it
    bridges the gap of both worlds. It makes automation easier than writing a script,
    which is fast but also potentially programmable as a Makefile.


    The commands are grouped together in a YAML-like file called jest. These recipes
    are easy to build and are also powerful. Each recipe features a label by an example
    command, and running the command followed by the label will run all of them. It
    is included in, arguments, and results, from the recipe. But this is just the
    beginning. Recipes can also include arguments, variables, and built-in functions.
    You can also use loops and expressions, which are especially useful for iteration
    and parsing output without their shell script templates. All of this is documented
    in the project''s README file.


    ```

    $$ cat jest 00:14:33

    # use python to execute recipe lines and backs

    set shell = "#python3 -c"

    # use print to capture result of evaluation

    os = print("foo + 4")nfoo:

    print("snake snake snake.")

