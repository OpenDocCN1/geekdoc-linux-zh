    After so, you will find the programs listed in Table 1 on your computer. Many
    instructions still refer to old magick followed by the command. The newer versions
    have dropped this, meaning that magick convert has been simplified to a plain
    convert.


    # Everyday Commands


    You can use the identify FILE to initially identify an image without installing
    it outside the terminal with your distribution file manager, or use the identify
    command. The output looks like line 2 of Listing 2, if you want to limit the output
    to the height, width, and names, options to the command as shown in line 3, l
    stands for a line break here. This is how


    # Listing 1: Install


    +   01 OS Debian and derivatives

    02 $ sudo apt install imageagick

    03 ## Pora

    04 $ sudo dnf install imageagick

    05 ## Arch Linux and derivatives

    06 $ sudo pacman -S imageagick


    | Command | Function |

    |---||

    | convert | Main tool for converting, scaling, blurring, sharpening, cropping,
    rotating, and |

    | mogrify | Like convert, but replaces the source file |

    | identify | Reads out various image parameters including the Exif data |

    | composite | Overlaps images |

    | assemble | Combines multiple images into one target file |

    | compare | Marks differences between images in the destination file or outputs
    them as values |

    | stream | Copies data from one image to another |

    | display | Displays images via an X server as a pop-up |

    | import | Creates screenshots in the X server |

    | conjure | Runs scripts in the Magick Scripting Language |'
