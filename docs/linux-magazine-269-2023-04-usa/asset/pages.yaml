    # # Using Mastodon from the command line toot


    If you are looking for a Twitter alternative, toot lets you interact with Mastodon
    from the command line. By Bruce Byfield


    A new open, decentralized version of Twitter, Mastodon has been in development
    since 2016. With Elon Musk''s erratic decisions, many users predicting Twitter''s
    downfall searched for alternatives. The result has been a new surge in Mastodon
    - even if many newcomers were surprised by its open source organization. The interest
    is great that Mastodon, founded by Bruce Byfield, reports that he off receiving
    "hundreds of dollars" from investors - he refused so as not to compromise Mastodon''s
    nonprofit status. As I write, Twitter appears to have slowed, but along with the
    renewed interest in Mastodon has come a new interest in toot (2012), an open source
    command-line client for Mastodon. Took its name from Mastodon''s equivalent of
    Twitter, the microblog messages posted by users. Finally, the term is obsolete,
    with Mastodon''s latest releasing


    toot with a simple Publish button [3], but the term remains widely used. Toot
    compares favorably with Twitter clients for Linux such as Twitch, Oyster, and
    Rainbow Stream, many of which are not up-to-date, and have an alarming appearance.
    By contrast, although current users must still use the web interface for everyday
    use, toot is a complete replacement for the web version of Mastodon (1), providing
    functionality that is both


    and up-to-date with Mastodon through a series of commands and options that keep
    users'' hands firmly on the keyboard.


    # ## Getting Started


    You will find toot in the package repositories of many distributions and some
    sources are more current than others. However, you must first create an account
    in Mastodon from a web browser before using toot: login_cli (2). Upon launching,
    toot configures a configuration file in your home directory: ~/.config/toot/config.json.


    ![](img/9114a5c8af7098772983e86dad17c99b_53_1.png)


    Figure 1: The Mastodon web application.


    54 APRIL 2023 ISSUE 269 LINUX-MAGAZINE.COM'
