  md: '# NEWS


    Kernel News


    # Zack’s Kernel News


    ![](img/9114a5c8af7098772983e86dad17c99b_11_0.png)


    # Minimum Version Numbers for Build Tools


    Long ago, when this ancient planet was not quite so, the Linux kernel refused
    to support newer versions of the GNU compiler (GCC). Compiler development proceeded,
    and Linux could only compile on an older version because Binutils disagreed with
    GCC over some of the new behaviors however. In other words, it was war.


    Systems stuck with version 2.23 of GNU Binutils without the ability to upgrade
    might have a problem newer kernels.


    So in fact, it was significant that Masahiro Yamada pointed out that Binutils
    2.5 was released at the same time as GCC 5.1. It’s very likely that any one with
    access to GCC would be stuck with an older version of Binutils. The decision to
    require later GCC 5.1 was made fairly easily. For example, older versions of GCC
    actually produced errors at the time Linux decided to update them. It seemed very
    unlike that anyone was actually using the previous version (GCC 4.9) to build
    kernels.


    Today the situation is much different, and the Linux kernel now identifies the
    minimum version of tools it requires, rather than the maximum. And today, as Masahiro
    Yamada supports GCC 5.1 and later.


    However, Masahiro noted that 2.23 of Binutils - the linker, and other tools for
    building anything with GCC - 10 years old and showing its age. Masahiro wanted
    to raise Linux’s minimum supported version to Binutils 2.5, which was released
    around the time of GCC 5.1 (seven years ago). He posted a patch to match that.


    Chronicle Brown reports on the latest news, views, dilemmas, and developments
    within the Linux community.


    It’s not meaningless! Early tools support for features Linux actually uses. As
    a result, the kernel build systems needs to check for older tools during compilation.
    If they find them, it has to use less workarounds for the more modern features.


    It’s always just call. Other operating projects might insist that older tools
    must be supported under all circumstances. We would likely lose amount of trust
    in their kernel source rather force them to upgrade even older tools. Linux takes
    is a bit of compromise that allows ideas and the kernel source to continuously
    become cleaner and better organized - something very valuable when new developers
    depend on.


    Linux Masahiro’s patch seemed accepted it; Nic Desaulniers also liked the patch.
    There were no dissenting voices.


    Masahiro also took the patch into other kernel source tools and various subsystems
    and architects started to clean up their code.


    By Zack Brown


    # Author


    The Linux kernel mailing lists the core of kernel development activities. Traffic
    volumes are immense, often reaching 10000 messages in a week, and keeping up with
    the entire scope of development is virtually impossible task for one person. One
    of the few brave souls to take this task is Zack Brown.


    # Intel and Arm Security Issues


