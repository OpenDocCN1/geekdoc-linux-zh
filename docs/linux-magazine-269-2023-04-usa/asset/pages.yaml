    \ of Devops 1980s: \"Whipper\" is short surprising given we're considering to\
    \ use high technology, the audio CD format. But it's more likely, and less interesting,\
    \ that the name itself is copying data from a CD to your computer. Your thought\
    \ might be why Whipper still relevant in the third decade of the century, and\
    \ there are two answers to that: The first is a dearth of streaming services,\
    \ very few digital audio to CD quality. Most only via low compression, and CD\
    \ audio delivers a glorious\n\nuncompressed 16-bit value, 44,100 times a second.\
    \ The second is that you can't compress or stream it even though it is on a CD.\
    \ If you can, it's probably been remastered. This makes many of the original CD\
    \ definitions outdated and still worth ripping.\nThe process of ripping itself\
    \ is also surprisingly complicated. Because the audio data is digitally encoded\
    \ on the disc, the optical drives used to read it can introduce errors. While\
    \ there is some error correction, it's not enough to guarantee the integrity of\
    \ the audio data, which means multiple readings and averages are required. And\
    \ this is what\n\n![](img/9114a5c8af7098772983e86dad17c99b_86_0.png)\n\nWhipper\
    \ is a CD ripping utility focusing on accuracy over speed. You can get help subcommands\
    \ using the -h option.\n\n```\n$ whipper -h [a] [b] [c] -e (never,failure,success,always)\n\
    \n  record requests for playback\n  record error requests\n  -e (never,failure,success,always)\n\
    \  handle drive\n  handle errors\n  handle drive events\n  handle data events\n\
