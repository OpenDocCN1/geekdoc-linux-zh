    # ### Boot Processes


    At a high level, the Linux boot process passes through the five steps described
    below. Some texts describe it in four or six steps; however, the basic mechanism
    remains the same. The boot process begins every you start a shutdown system or
    an already running system.


    Irrespective of the OS or standard (BIOS-compatible), computer systems use either
    the classic BIOS/MBR (1) boot process or the modern UEFI/GPT boot process. UEFI
    firmware and manage startup system, but the boot method and settings differ for
    each.


    # ### Step 2 Loading the MBR


    After the first boot checks have been completed, the BIOS will find the primary
    disk among the available disks and scan the first 512 bytes. The boot device is
    found in the Master Boot Record (MBR). The MBR (2) is a 512-byte area that contains
    446 bytes of bootloader, a 64-byte partition, and the two bytes for the boot signature.
    Initially, the BIOS is not aware of files. As a result, the MBR is at a specific
    location on the disk, which is the first sector of the boot disk. There is an
    MBR partition on every disk.


    # ### Step 3 The Bootloader Phase


    After loading the MBR, the system executes the 446 bytes of the primary bootloader.
    The code is stored at the start of the MBR. The boot sector is located at this
    location. The boot loader or bootloader is usually called the Stage 1. This code
    is too small to run any function like calling a kernel. However, it can simplify
    things by loading and executing sections from partitions that contain all the
    code for loading the kernel. This code is called Stage 2 bootloader


    The most common Stage 2 bootloader for Linux systems is GNU Grand Unified Bootloader
    (GRUB). However, there are a number of


    # ### BIOS-Based Booting


    The classic BIOS/MBR boot process (as shown in Figure 1) follows five steps: the
    BIOS, POST, loading the MBR, the bootloader phase, the kernel, and the startup.


    # ### Step 1 The POST


    The BIOS is located on the chip of the computer in read-only or flash memory and
    performs the Power-On-Self-Test (POST). This is specific to Linux. It is related
    to the hardware initialization mechanism among all operating systems. The POST
    is a series of tests to ensure that the computer''s hardware is functioning properly.
    It does hardware verification of availability and integrity, as well


