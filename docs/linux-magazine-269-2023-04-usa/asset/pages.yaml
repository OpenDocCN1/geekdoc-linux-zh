  md: '# EDITORIAL Welcome


    # IDENTITY MATTERS


    Dear Reader,


    The company behind Facebook just announced a new premium subscription model, where
    you pay for your Facebook account and the package includes add-on services that
    you not currently receive. I always wondered if a subscription service might be
    a better model for media giants like Facebook. After all, they do provide a service
    to their subscribers - maybe asking people to do it is better than selling their
    data and acting as a consultant for targeting.


    After the encouraging headline, however, I was disappointed to see that this new
    subscription-based service does not make your data more private or your online
    presence less acknowledged. The principal purpose of your-Facebook page is to
    make sure you are you and not somebody else. The service uses a ''verification
    badge,'' showing that you have presented a government-ID, and assuring that you
    are who you say you are. The goal is to offer some protection from rogue users
    pretending to be you.


    Corporate social media culture, the Microsoft layer that preceded it, occupies
    a empty space where people tell you that you are you and just not your head when
    it is perfectly reasonable, even when it isn''t. If you have to pay extra to ensure
    that no one is out pretending to be you (basically, stealing your identity), the
    other side is that, if you don''t pay extra, you surely aren''t others out trying
    to be you.


    I want to be fair. It does require resources to verify someone''s identity and
    ensure that no one impersonates, in that sense, the company has to pass on those
    costs to users. But it all sheds light on how faulty the basic service is in the
    first place. It is supposed to follow the rules to use a name on Facebook, so
    what this new service has is to pay extra for Facebook to enforce its rules, and
    if you don''t pay the money, Facebook is not responsible for enforcing its rules.


    It might seem like an impossible task to ensure that two billion users are not
    impersonating each other. Actually, I believe it is an impossible task, and $11.99
    per month won''t be enough to make it possible. It is time to


    admit that Facebook has an impossible business model, rather than letting them
    climb out of the mess by launching add-on services and claiming the problems are
    easily solved consumer choice?


    But this is all sour grapes for me, because I''m still disappointed that they
    would launch a for-pay-service and not use the occasion to address the real problem
    with Facebook, which is all stalking. Rest there are alternatives, which we explore
    the free social media tools of the decentralized Federation that will help you
    with the stalking. As for the impersonation, there is still no universal fix,
    but check out the article on Mastodon that will verify your identity to your followers
    - without paying extra.


    ![](img/9114a5c8af7098772983e86dad17c99b_2_0.png)


    Joe Casad,

    Editor in Chief


    ![](img/9114a5c8af7098772983e86dad17c99b_2_1.png)'
