    # Viewing the Timeline


    When viewing toots in your timeline, the basic toot displays the most recent one.
    then you can choose the option of displaying the least dozen or the entire list.
    You can also use the options listed in Table 1 to modify which toots are displayed.


    At the bottom of each toot, you can find its ID and whether it has been registered.
    You can post one of your own toots to the timeline or even delete it with delete
    toot (ID 5).


    You can locate other people on Mastodon by


    ```

    toot search "name"

    ```


    or by their Mastodon address with


    ```

    toot search NAME@INSTANCE

    ```


    With an instance address, you can also use the self-explanatory commands flag-lute,
    mute, or unfollow! To like a toot, use the command


    ```

    toot favourite ID

    ```


    (the UK English spelling). To delete toot use delete toot id.


    # Posting Toots


    You can post a toot in your search. The simplest (as in Figure 3) is:


    ```

    toot "MESSAGE"

    ```


    Alternatively, you can post in a text editor of your choice (Figure 4) – Vim in
    this with the following command:


    ```

    toot --editor vim

    ```


    Save and edit the toot as you normally in the editor, and the toot is also posted.
    If you prefer to use a text editor, define your preferred editor as an environmental
    variable (for instance, export EDITOR=vim), and then you can simply use the following
    command:


    ```

    toot --editor

    ```


