    to the public.


    # ### Linux App Summit 2023


    **Date:** April 21-23, 2023


    **Location:** Brno, Czech Republic and Online


    **Website:** https://linuxappsummit.org/


    The Linux App Summit (LAS) brings the global Linux community to share ideas, collaborate,
    and help grow the Linux ecosystem. Through talks, panels, and Q&A sessions, we
    encourage attendees to make connections and join our goal of building a common
    ecosystem. Join us in-person or online.


