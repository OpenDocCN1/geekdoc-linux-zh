    # Adding New Users


    If you periodically add new users to the server SSH, these users will need to
    generate a key via a client console. If a login entry is not found, then a key
    will be generated by the system administrator or by the user created. An administrator
    can provide a recovery key for a new user with code in Listing 1.


    ```

    # touch /etc/ske/.first_login

    ```


    By having the flag file inside of /etc/ske/, the flag file will be placed in the
    new user''s home directory automatically, so the administrator will not need to
    touch the flag file after creating it.


    # Finalizing


    Once the key has been generated for every user that will need to use SSH, you
    must enforce MFA. Just remove the null option in configuration. A critical step
    before finishing, test the google-authenticator module to make sure it is working
    that all users have set up keys and Google Authenticator on their devices. This
    process is complete; check /etc/pam.d/sshd.


    Once generated, you will then need the secret key, QR code, or plaintext text
    with the new user. You will indeed need to run key generation on their first login,
    using various methods such as using a flag file for new users.


    # Flag File Enrollment


    The /etc/ske/ directory contains default profiles and configurations that are
    copied into users'' home directories when they are created. You will need to update
    /etc/ske/.profile to create a flag file. These flag files are empty files that
    are used by shell scripts to describe how the home directory should behave. If
    the flag file in Listing 1 exists, the script will not run.


    # Conclusion


    With simple setup and low overhead, Google Authenticator TOTP as SSH provides
    the additional method for MFA for remote access at a low cost.


