    # Considerations


    MFA may provide additional security for authentication with SSH, but it does not
    make sense for all cases. Bastion hosts, which are manually accessed by users
    or as a jump host, are usually used for cases where internal hosts are located
    behind a jump host. MFA codes will be required for the jump host and the destination
    server. You may choose for users on login. If a bastion host is configured with
    the MFA server on the network Internet, then SSH hosts that are only accessible
    internally could be sufficiently secured with normal password or key authentication.


    I recommend adding NIST''s NTP server as primary server, or another NTP service
    as default. To confirm this, use the command:


    ```

    auth required

    pam_google_authenticator nullok

    ```


    The nonullok option for testing, allows users that have not generated a secret
    key to authenticate with only their password. Once keys have been added to all
    SSH users, the nullok option will be removed to enforce MFA.

    Finally, reload the SSH server configuration with:


    ```

    $ restart systemd-timesyncd

    ```


    The system should synchronize its time with the NIST NTP server.


    ```

    $ systemctl restart sshd

    ```


    # Configuration


    The OpenSSH server must be configured to use /etc/pam.d/sshd config for the authentication
    using UsePAM line. On Ubuntu server, sshd is configured to use PAM by default.
    Add the pam_google_authenticator option before the required line.


    Once these configurations have been added to sshd_config, you will need to add
    the Google Authentication module to PAM.


    # Generating a Key


    Next, you will need to generate a key for your user account. If you are logging
    in with the user account you will see the authentication code: entering the password
    or authenticating with your key. Just click Enter. After added nullok to login,
    you will be authenticated. Once logged in to generate a secret key. Run the command,
    and you will be prompted to choose whether the token is: enter for y.


    ![](img/9114a5c8af7098772983e86dad17c99b_64_0.png)


    # Installation


    The Google Authenticator module requires libpam as a dependency for generating
    QR codes in a shell. On Ubuntu 22.04, libpam can be installed with:


    ```

    $ apt install

    libpam-google-authenticator

    ```


    ![](img/9114a5c8af7098772983e86dad17c99b_64_1.png)


    ```

    Your secret key is: HRBAMCA36XL.WODM9KZ2FE

    Next code configured if

    Your verification codes are:

    231596

    852263

    924673

    063240

    Do you want me to update your "home/user/.google_authenticator" file? (y/n) y\Do
    you want to allow multiple uses of the same token? This restricts you to login
    once every 90 seconds, but it is more convenient if you use multiple devices.
    (y/n) y

    ```


    By default, a new token is generated every 30 seconds by the mobile app. This
    allows for a small window between the token being generated and the current time.
    This is for because if you experience problems with poor time synchronization,
    you can increase the window by changing the code limit to 17 permitted codes (the
    8 previous codes, the current code). This will persist for a time of up to 4 minutes
    between client and server. Do you want to go back? (y/n) y


    # Time Synchronization


    TOTP requires that the time be accurate, so synchronizing the server with a Network
    Time Protocol (NTP) server is recommended. While not a requirement for TOTP to
    work, NTP will ensure system synchronization with an external server, by default.


