  md: '# # NEWS

    Linux News


    When you install and boot elementary OS 7, there are no obvious and major changes
    to greet you. In fact, the desktop UI looks much more in line with what the team
    has released in the past, and that''s a good thing, that the elementary OS is
    one of the finest on the market.


    As for changes, you will find more engaging app descriptions in the AppCenter,
    an easier app update process, better support for sideloading and alternative app
    stores, and a more responsive AppCenter.


    Version 7 also supports web apps, making it easier to launch them from the applications
    menu and even use their own settings (such as privacy controls).


    Other new features include the ability to send feedback directly to the developers,
    a more streamlined interface and outstanding Onboarding app that makes it easier
    for you to configure the UI theme. You can even configure automatic updates for
    both free and paid apps.


    The Mail app has a more modern UI as well as a unified inbox that supports Microsoft
    accounts.


    The Music app was also completely rewritten from scratch to make it much quicker
    when queuing and playing audio from local files.


    For more information on the latest release, check out the release notes (https://blog.elementary.io/os-7-available-now)
