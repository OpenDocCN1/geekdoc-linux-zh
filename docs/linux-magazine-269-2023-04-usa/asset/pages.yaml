    # Integrating Google Authenticator

    with SSH. logins


    # Best Laid Plans


    The Google Authenticator PAM module allows you to use time-based Google Authenticatorpasswords
    with various Linux servers, including SSH. By Jesse Hagewood


    In recent years, multifactor authenti-

    cation (MFA) has been a hot topic

    in security, with many

    options and software services

    ow making it a requirement. To achieve

    MFA, two or more authentication

    passwords must be provided by a user to pass au-

    thentication. These factors include

    something you know, something you have

    where you are, or something you do.


    Many organizations have turned to the

    Google Authenticator to implement

    MFA using a time-based one-time pass

    word to log in. The Google

    Authenticator satisfies the something

    you "have" authentication because

    TOTP requires a device in the user''s pos-

    session, or the user''s smart-

    phone or iPhone. Adding a regular user

    password to satisfy the "something you


    know" authenticator factor provides the

    second factor to achieve MFA. Many

    software as a service (SaaS) providers,

    such as GitHub, AWS, and Microsoft

    Azure, support Google Authenticator as

    an option for MFA.

    At a high level, TOTP works by having

    a secret key that is generated on a se-

    ctor and shared with the device. The TOTP

    algorithm takes two inputs, the secret

    plus system''s Unix time, results in a

    one-time password known by both the

    device and the service. A new device

    Google provides a pluggable authenti-

    module (PAM), google-authenticator-

    pam [1], that system adminis-

    trators can integrate various

    Linux servers with Google Authentica-

    or. As a PAM module, it can be used


    with virtually any Linux service with

    robust industry-standard authentication

    methods. In this article, I will speci-

    integrate Google Authenticator

    with SSH logins.


    # Advantages of MFA with SSH


    You will find MFA useful on servers that

    have SSH open to the Internet or

    have SSH open to large networks. By

    adding MFA to SSH, you can mitigate

    brute-force attacks on SSH servers, as

    well as the impact of user pass-

    words. An attacker would need

    noth the user''s Android or iPhone device or

    the Google Authenticator secret key)

    gain access to their user account on

    via SSH.


    Typically, SSH brute-force attacks on

    the Internet are detected


