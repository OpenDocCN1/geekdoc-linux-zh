  md: '# COVER STORY


    # Fediverse Introduction


    The popularity of the Fediverse varies widely. Mastodon (Figure 1) is thought
    to have more than 6 million accounts and 4 million active users. The smallest
    platforms might have only a couple thousand accounts. But new attention to the
    Fediverse could accelerate migration in the years to come.


    It is worth noting that the concept of federated servers used by the Fediverse
    is only up to the degree of decentralized social media (see the box "Even: More
    Decentralized").


    # Tools and Rules


    Decentralization is one of the major features of the Fediverse, and it requires
    no explanation. A tool such as Mastodon is an open source utility that is free
    from language and censorship. Mastodon community is not the only user base. Different
    organizations exist as Mastodon providers (Figure 2). Each provider manages its
    own own server. To get started with Mastodon you can sign up with any of the existing
    providers, or you can create your own server. Linux New Media, the publisher of
    this magazine, has an account with the Mastodon provider called fastest. In general,
    Fediverse servers support interaction with other providers, so you are not locked
    in a walled garden as many of the commercial social media tools, however, the
    first step is to create an account.


    This independence of individual providers means that the Fediverse isn''t controlled
    by a single company. On the other hand, diversity means in how providers manage
    their space and how they interact. Each server hosts a specific community of interest
    or political cause. Whoever owns the server is free to moderate the content as
    they wish. For instance, the vegan Mastodon server focuses on


    vegans and others "anti-speciesist moderation by animal activists." On the other
    hand, Truth Social, the social network created by Donald Trump and supported by
    users with MAGA politics, is also based on Mastodon.


    # Protocols


    The secret to the Fediverse is that they share common protocols. A close look
    at the protocols will give you a better understanding of what works and what works
    best for your situation. However, to improve versatility, some tools support more
    than others.


    The most popular Fediverse communication protocol is ActivityPub. ActivityPub,
    which is based on the earlier Activity and Status protocols, is a standard of
    the World Wide Web. Mastodon, Mastpeer, PixelFed, and Hinode are important implementations
    of ActivityPub.


    Diaspora, which was developed independently and earlier than many ActivityPub
    applications, has its own protocol that isn''t universally compatible with the
    others. However benefit of diaspora is that it has implemented extensions to interact
    with a number of commercial social media services. You can post updates to Tumblr
    and WordPress, and embed YouTube and Vimeo videos in posts. Diaspora also has
    some support for posting to Twitter, but might be enabled with Twitter API.


    GNU Social, one of the early entries, uses the Status protocol, which is also
    supported by own. Hubblah places a premium on interoperability and offers built-in
    support for both diaspora and the Activity-Pub services. Hubblah also supports
    the Zot protocol, which allows it to connect with the Jabber maxblog service.


    ![](img/9114a5c8af7098772983e86dad17c99b_19_0.png)


    Figure 2: For the server that will have your account at the Mastodon website.'
