  md: '# Burt


    Burt is a Tcl/Tk based set of extensions that allow for easy backups of Unix workstations,
    this allows it to run on pretty any system. Burt is a client/server architecture
    and appears pretty scalable, it is available at: http://www.cs.wisc.edu/~jmelski/b/


    # Commercial Backup Programs for Linux


    # BRU


    RedHat ships with a nice backup program (well a demo version anyways) called BRU
    (Backup and Restore Utility), this thing has been in the Linux world since as
    long as Linux Journal (they have had ads there since the beginning). This program
    affords a relatively complete set of tools in a nice unified format, with command
    line and a graphical front end (easy to automate in other words). It supports
    full, incremental and differential backups, as well as catalogs, and can write
    to a file or tape drive a solid, simple, easy to use backup program, it ships
    with RedHat Linux (one license), so if you bought RedHat you should have a copy
    to play with. BRU is available at http://www.estinc.com/features.html.


    # Quickstart


    Quickstart is more aimed at making an image of the system that when the hard drive
    fails/etc, you can quickly re-image a blank disk with a working system. It can
    also be used to ''master'' a system and load other systems (as an alternative
    to RedHat''s kickstart). It''s reasonably priced as well as garnered a good revue
    in Linux Journal (Nov 1998, page 50). You can get it at: http://www.estinc.com/qsdr.html.


    # Backup Professional


    http://www.unitrends.com/bp.html


    # CTAR


    http://www.unitrends.com/ctar.html


    # CTAR:NET


    http://www.unitrends.com/ctarnet.html


    # PC ParaChute


    http://www.unitrends.com/pcpara.html


    # Arkeia


    Arkeia is a very powerful backup program with a client - server architecture that
    supports many platforms. This is an ''industrial'' strength product and appropriate
    for heterogeneous'
