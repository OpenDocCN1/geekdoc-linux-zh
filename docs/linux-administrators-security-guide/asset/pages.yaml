  md: '# SQUID


    SQUID is a powerful and fast Object Cache. It proxies FTP and WWW sessions, basically
    giving it many of the properties of an FTP and a WWW server, but it only reads
    and writes files within its cache directory (so we hope), making it relatively
    safe. Squid would be very hard to compromise the system it is on, in addition
    to running as a root user (typically ''nobody''), so generally it''s not much
    to worry about. Your main worry with squid should be improper configuration, for
    example if squid is hooked up to your internal network (as is usually the case),
    and the internet (again, very common), it could actually be used to reach internal
    hosts (even if they are using non routed IP addresses). Proper configuration of
    squid is very important.


    The simplest way to make sure this doesn''t happen is to use squid''s internal
    configuration and only bind to the internal interface(s), not letting the outside
    world attempt to use it as a proxy to your internal LAN, in addition to this firewalling
    it is a good idea. Squid can also be used as an HTTP accelerator, perhaps you
    have an WWW Server on the internal network that you want to share with the world,
    in this case it gets a bit harder to configure but it is possible to do securely.
    Fortunately that squid has good ACL''s (Access Control Lists), allowing you to
    lock down access by names, ip''s, times of day, actual day (perhaps allow unlimited
    browsing on the weekends for people who actually come to the office). Remember
    that the more complicated the ACL is, the slower it will be to respond to requests.


    The ACL''s work by defining rules, and then applying those rules, for example:


    ```

    acl internet 10.0.0.0/255.255.0.0

    http_access allow internet

    http_access deny all

    ```


    Which defines "internet" as being anything with a source of 10.0.0.0/255.255.255.0,
    allowing it to access the http caching port, and denying everything else. Remember
    that rules are read in the order given, just like ipfwadm, allowing you to get
    very complex (and make mistakes if you are not careful). Always start with the
    specific rules followed by more general rules, and remember to put block denials
    after specific allows, otherwise it might make it through. It''s better to accidentally
    deny everything than to let it through, as you''ll find out that after denials
    (from annoyed users) faster than those that get through (when annoyed users notice
    accounting files from the internal www server appearing on the Internet). The
    squid configuration files (squid.conf) is well commented (to the point of overkill)
    and also has a decent man-page.


    Another useful example is blocking ads, so to block them you can add the following
    to squid.conf:


    ```

    acl ads dstdomain ads.blah.com

    http_access deny ads

    ```


    The acl declaration is simply a pattern, be it destination domain name, source
    domain name, regex and so on, the http_access declare activates what to do with
    it (deny, allow, etc). Properly setup this is an extremely powerful tool to restrict
    access to the WWW, unfortunately it does have one Achilles heel, it doesn''t support
    user based authentication and'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'control (not that may product do in any case). Remember that like any of rules
    they are read from top to bottom, so put your specific denials and allows first,
    and then the more general rules. The squid.conf file should be well commented
    and self explanatory, the squid FAQ is at: http://squid.nlar.net/Squid/FAQ/FAQ.html.


    One important security issue that many people overlook is the log files it keeps.
    By default squid may or not log every request it handles (depends on the config
    file), from http://www.nsa.gov/ to "members.porn.com/bin/access&johndoe&password=booboo".
    You definitely want to disable the access logs you want to keep a close eye on
    what people view of the Internet (legally this is questionable, check with your
    lawyers), the directive is "cache_access_log" and to disable it to "/dev/null",
    this logs all accesses, and ICP queries (inter-cache communications). The next
    one is "cache_store_log", which is actually useful for generating statistics on
    how effective your www cache is, it doesn''t log who made the request, simply
    what the status of objects in the cache is, so in case you see the pictures on
    playgrounds being repeatedly served, to disable it to "none". The "cache_log"
    should properly left on, it contains basic debugging info such as when the server
    was started and when it was stopped, to disable it to "/dev/null". Another, not
    well documented log files are cache_swap_log, which keeps a record of what is
    going with the cache, and will also show you who''s people are serving (but not
    who/etc), setting this to "/dev/null" doesn''t work (in squid peaks out) and setting
    it to "none" simply changes the filename from "log" to "none". The only way to
    stop it is to link the file to "/dev/null" (by the default root of the www cache
    files /log), and also link to the "log-last-clean" (although in my quick tests
    it doesn''t appear to store anything you can''t be sure of).


    in squid.conf:


    ```

    cache_access_log /dev/null

    cache_store_log none

    cache_log /dev/null

    ```


    and link:

    /var/spool/squid/log to /dev/null

    /var/spool/squid/log-cache-last-to /dev/null


    or whichever directory holds the root of your www cache (the 00 through 0F directories).


    Another issue that gets forgotten is the ICP (Internet Cache Protocol) component
    of squid. The only time you will use ICP is if you create arrays or chains of
    proxy servers. If you have only one proxy server you should disabled ICP. This
    is easily by setting the ICP port in squid.conf from the default "3130" to "0".
    You should also firewall 3128 (the default squid port that clients bind to) from
    the Internet:


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/0 -D 0.0.0.0/0 3128

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 3128

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 3128

    ```


    or inchains:'
