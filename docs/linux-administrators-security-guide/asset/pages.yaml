  md: '# Identd


    Identd service is used to map users/processes to ports in. For example src servers
    attempt to find out who is connecting to them by doing an ident lookup, which
    basically consists of asking the ident what it has about a port number, and can
    range from nothing (if no one is using that particular port) to a username, groupname,
    process id, and other interesting information. The default setting in many distributions
    is identd on (it is possible to run it, its and newer versions send small ident
    responds), and will only hand out the username. The primary use of ident is to
    allow remote systems by means of tracking down users that are connecting to their
    servers, inc, telnet, mail, or, for authentication purposes (not a good idea since
    it is very easy to fake). The local university in Edmonton requires identd if
    you want to telnet into any of the main servers, primarily so they can track down
    compromised accounts quickly. Identd is a useful tool, but generally on machines
    it is a two-edged sword, while it gives out information for tracking down attackers
    (definitely people you want to kick off your servers) it also be used to get information
    about your system, leading to their accounts being compromised. I would suggest
    running identd on servers with accounts/etc


    Identd supports a few features, and can be easily set to run as a non root user.
    Depending on your security policies you may not want to give very much information,
    or you might want to give as much as possible. Simply tack the option in inet.conf,
    after identd (the defaults are -l -e).


    ```

    -p port

    - address

    ```


    Can be used to specify which port and address it binds to (in the case of a machine
    with IP''s aliased, or multiple interfaces), this is generally only useful if
    you want machines to connect, since external machines will probably not be able
    to figure out what port you changed to it.


    ```

    -u uid

    -g gid

    ```


    Are used to set the user and group identd will drop it''s privileges after connecting
    to the port, this will result in it being far less susceptible to compromising
    system security. As for handling the amount of information it gives out:


    ```

    -o

    ```


    Specifies that identd will not return the operating system type, and simply say
    "UNKNOWN", a very good option.


    ```

    -n

    ```


    Will identd return user numbers (i.E. UID) and not the username, which still gives
    enough information to tell you and allow to track the user down easily, without
    giving valuable hints to would be attackers.


    ```

    -N

    ```


    Allows you to make a /.nident file, which will force identd to return "HIDDEN-USER"
    instead of information.


    ```

    -F format

    ```'
