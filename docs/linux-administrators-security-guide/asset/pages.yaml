  md: '# Finger


    Finger is one of things most admins disable and ignore. It is a useful tool on
    occasion, but if you want to allow other admins to figure out which of your users
    is currently trying to crack their machines, use ident. Finger lets out way much
    info, and is a favorite tool for initial probes and data gathering on targets.
    There have also been several nasty DOS attacks released, basically consisting
    of sending hundreds of finger requests and in certain configurations using the
    server crack. Please don''t run finger. Many distributions ship with enabled,
    but to quote inetd from RedHat


    ```

    # Finger, systat and netstat give out information which may be

    # valuable to potential "system crackers ". Many sites choose to disable

    # some or all of these services to improve security.

    ```


    If you still have the urge that you absolutely run it use -u to deny finger @host
    requests that are not ever used to gather information for future attacks. Disable
    finger, really. Finger has also been the cause of a few recent and very bad denial
    of service attacks, especially if you run NIS with large maps, DO NOT, repeat
    NOT run finger. Cfingerd (configurable finger) is a great replacement for the
    stock finger, it was built with security in mind, runs as a non root user and
    can easily configure it so they aren''t fingerable. Cfingerd is available from:
    http://ftp.bitgate.com/cfingerd/. Finger runs on port 79, and cfingerd runs on
    port 2003, both use tcp.


    ```

    ipfwadm -I -a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 79

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 79

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 79

    ```


    or



    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 79

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 79

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 79

    ```'
