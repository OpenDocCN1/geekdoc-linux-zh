  md: 'secure - the nfs system must originate from a privileged port, i.e. root HAS
    to be the one to mount the dir. This is useful if the server you are exporting
    to is secured well.


    ro - a good one, Read Only, enough said.

    noaccess - used to cut off, i.e. export/home/ but do no access on /home/root

    root_squash - squashes root''s UID to the anonymous user UID/GID (usually ''nobody''),
    very useful if you are exporting dirs to admins who do not 100% trust (root can
    always read any file... HINT)

    no_root_squash - useful if you want to go mucking around exported dirs as root
    to fix things (like permissions on your www site)

    squash_uids and squash_g - certain UID(s) or GID(s) to the anonymous user, in
    RedHat a good example would be 5-10000 (by default RedHat starts users and groups
    at 500), allowing any users with lower UID''s (i.e. special accounts) to access
    special things.

    all_squash - a good one, all privileges are revoked basically and everyone is
    a guest.

    anoid and anonid-specifically set the UID / GID of the anonymous user (you might
    want something special like ''anonnfs'').


    The man exports page is quite good.


    Beyond this there isn''t much you can do to secure NFS from ripping it out and
    putting some other product in (like NFS, Coda, etc.). NFS is good, every flavor
    of UNIX supports it, and is very easy to work, with and matters. It''s also ''old
    faithful'', been around a long time. Just check "Practical Unix and Internet Security",
    they also state in bond not to use NFS if security is a real issue.


    NFS should be restricted from the outside world, it runs on port 111, udp/tcp,
    and also runs on port 2049, as well as using RPC which runs on makes use of mount
    which on ports 635, udp. Replace the 2049 with 111, and 635 udp and tcp to secure
    these services (again the best idea is a blanket rule to use ports 1 to 1024,
    or better a default policy of denial).


