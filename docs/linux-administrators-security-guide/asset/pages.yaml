  md: '# Safe installation of Linux


    A proper installation of Linux is the first step to a stable, secure system. There
    are various tips and tricks to make the install go easier, as well as some issues
    that are best handled during the install (such as disk layout).


    # Choosing your install media


    This is the #1 issue that will affect speed of install and to a large degree safety.
    My personal favorite is ftp installs when popping a network card into a machine
    temporarily (assuming it doesn''t have one already) is quick and painless, and
    going at 1+ megabyte/sec makes for quick package installs. Installing from CD-ROM
    is generally the easiest, as they are bootable, Linux finds the CD and off you
    go, no pointing to directories or worrying about case (in the case of an HD install).
    This is also original media and you can be relatively sure it is safe (assuming
    it came from a reputable source), if you are paranoid however free to check the
    signatures on the files.


    +   * FTP - quick, requires network card, and an ftp server (Windows box running
    something like warpedpd will work as well).

    * HTTP - fast, and safer than running a FTP server for installs

    * Samba - quick, good if you have a windows machine (the cd crom).

    * NFS - not as quick, but since nfs is usually implemented in existing UNIX networks
    and AT no have an NFS server (MS for free) it''s mostly painless. NFS is the only
    network install supported by RedHat''s kickstart.

    * CDROM - if you have a fast cdrom drive, your best bet, pop the cd and boot disk,
    enter a few times and you are done. Most Linux CDROM''s are now bootable.

    * HardDrive - generally the most painful, windows kicks up filenames/etc, installing
    from an ext2 partition is painfully tough (catch 22 for new users however).


    So you''ve got a fresh install of Linux (RedHat, Debian, whatever, please, please
    DO NOT really install old versions and try to upgrade them; it''s a nightmare),
    but there are chances there is a lot of extra installed, and packages you might
    want to upgrade or things that would better upgrade if you don''t want the system
    compromised in the first 15 seconds of uptime (in the case of BIND/send/etc.).
    Keeping a local copy of the directories for your distributions is a good idea
    (there is a list of errata for distributions at the end of this document), and
    making it available is the quickest way to make it available. As well as there
    are other items you might want to upgrade, for instance I use a chroot''ed, non-root
    version of Bind 8.1.2, available on the contrib server (ftp://contrib.redhat.com/),
    instead of the stock, non-chروط, as root Bind 8.1.2 that ships with RedHat Linux.
    You will also want to remove any software that you are not using, and/or replace
    it with more more secure versions (such as replacing rsh with ssh).'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# General concepts, server workstations, etc


    There are many issues that affect actually security setup on a computer. How secure
    does it need to be? Will there be interactive user accounts (telnet/ssh)? Will
    users be using it as a workstation or is it a server? The last one has a big impact
    "workstations" and "servers" have traditionally been very different beasts, although
    the line is blurring with the introduction of very powerful and cheap PCs, as
    well as operating systems that take advantage of them. The main difference in
    today''s world between computers is usually not the hardware, or the OS (Linux,
    NT Server and NT Workstation are close family, etc.), it is in software packages
    loaded (apache, X, etc.) and how users access the machine (interactive, at the
    console, and so forth). Some general rules that will save you a lot of grief in
    the run:


    +   1. Keep users off the servers. That is to say: do not give them interactive
    login shells, unless absolutely must.

    2. Lock down the workstations, assume users will try to ‘fix’ things (heck, they
    might be hostile, temp workers/etc).

    3. Use encryption wherever possible keep plain text passwords, credit card numbers
    and more sensitive information from lying around.

    4. Regularly scan the network for open ports/installed software/etc that shouldn''t
    be, compare it against previous....


    Remember: security is not a solution, it is a way of life.


    Generally speaking workstations/servers are used by people who don''t really care
    about the underlying technology, they just want to get their done and retrieve
    their email in a timely fashion. There are many users who will have the ability
    to modify their workstation, for better or worse (install packet sniffers, warez
    ftp sites, www servers,  bots, etc.). To add this more users have physical access
    to the workstations, you really have to lock them down if you want to do it.


    +   1. Use BIOS passwords to lock users out of the BIOS (they should never be
    in here, also remember that other BIOS''s have universal passwords.)

    2. Set the machine to boot from the appropriate harddrive only.

    3. Password the LILO prompt.

    4. Do not give the user root access, use sudo to tailor access to privileged commands
    as needed.

    5. Use firewall if they do setup services they won''t be accessible to the world.

    6. Regularly scan the table, open ports, installed software, and so on for change.

    7. Have a written security policy that users can understand, and enforce it.

    8. Remove all sharp objects (compilers, etc) unless needed from a system.


    Remember: security in depth.


    Properly setup, a Linux workstation is almost user proof (nothing is 100% secure),
    and generally a lot more stable than a comparable Windows machine. With the added
    joy of remote administration (SSH/Telnet/NS) you can keep your users happy and
    productive.


    Servers are a different ball of wax together, and generally more important then
    workstations (one workstation dies, one user is affected, the email/www/ftp/etc
    server dies your boss'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'phones up in a bad mood. Unless there a strong need, keep the number of users
    with interactive shells (bash, pine, lynx, whatever) to a bare minimum. Segment
    services up (have a mail server, a www server, and so on) to minimize single point
    of failure. Generally speaking a properly setup server will run and not need maintenance
    (I have one email server at a client location that has been in for 2 years with
    about 10 hours of maintenance in total). Any upgrades should be planned carefully
    and executed on a test. Some important points to remember with servers:


    +   1. Restrict physical access to servers.

    2. Policy of least privilege, they can break less things way.

    3. MAKE BACKUPS!

    4. Regularly check the servers for changes (ports, software, etc), automated tools
    are great for this.

    5. Software changes should be carefully planned/tested as they can have adverse
    effects (like kernel 2.2.x no longer uses ipfwadm, wouldn''t that be embarrassing
    if you forgot to install ipchains)


    Minimization of privileges means giving users (and administrators for that matter)
    the minimum amount of access required to their job. Giving a user "root" access
    to their workstation would sense if all users were Linux savvy, trustworthy, but
    they generally aren''t (on both counts). And even if they were it would be a bad
    idea as chances are they would install some software that is broken/insecure or
    other. If all a user access needs to be shutdown/reboot the workstation then is
    the amount of access they should be granted. You certainly wouldn''t leave accounting
    files on a server with world readable permissions so that the accountants can
    view them, this concept extends across the network as a whole. Limiting access
    will also limit damage in the event of an account penetration (have you read the
    post-it people put on their monitors?).'
  merge: -1
