  md: '# File sharing methods


    I thought I should also give a brief overview of the various file sharing methods
    that exist fornLinux, show you the pro''s and con''s as it were.


    # SAMBA


    Samba is the best option (performance wise, security wise, etc.) for sharing files
    withnWindows client machines, I would not really recommend this as a method for
    sharing files betweennmachines.


    # NFS


    NFS is not very secure, but it is easy to use, and can be made relatively safe
    if

    environment it is in not hostile. I would not recommend this as a method for sharing

    files/etc if security is a concern (which arguably means you shouldn''t use it
    for diskless

    workstations, but such is life).


    # Coda


    An advanced network filesystem, not very fun to implement. http://www.coda.cs.cmu.edu/


    # Drall


    An http based systems for sharing files among machines securely.

    http://www.edlund.org/projects/drall/index.html.


    # AFS


    A high end, commercial file sharing application for large installations. The FAQ
    is available

    at: http://www.angelfire.com/hi/plutonic/afs-faq.html.'
