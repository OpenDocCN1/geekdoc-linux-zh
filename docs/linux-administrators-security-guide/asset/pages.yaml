  md: 'The simplest way to setup chrooted is to simply install dhcpd (latest one preferably)

    /move the necessary files. A good idea is to create a directory (such as)

    /chroot/dhcpd/, preferably on a separate filesystem from /,usr, /etc (symlinks),
    and then

    create a file structure under it for dhcpd. The following is an example, simply
    replace

    /chroot/dhcpd/ with your choice. You must course execute these steps for root
    to work.


    ```

    # Install so we have the appropriate files

    #

    rpm -i dhcpd-2.0b1p0-1.i386.rpm

    #

    # Create the directory structure

    #

    cd /chroot/dhcpd/

    # # or wherever

    mk ./etc

    mkdir ./usr/sbin

    mkdir ./usr

    mkdir ./var/dhcpd

    mkdir ./var

    mkdir ./lib

    #

    # Start populating the files

    #

    cp /usr/sbin/dhcpd /usr/sbin/dhcpd

    cp /etc/dhcpd.conf /etc/dhcpd.conf

    cp /etc/rc.id/init.dhcpd /etc/dhcpd.init

    cp /etc/rc.id/init.functions /etc/functions

    #

    # Now to get the latest libraries, change as appropriate

    #

    cp /lib/ld-linux.ld-linux.so.2 /lib/

    cp /lib/libc.so.6 /lib/

    #

    # And create the necessary symbolic links so that they behave

    # Remember that thinks /chroot-dns/ is /, so use relative links

    ```


    Then modify or create your startup script.


    Once this is done remove the original startup file and create a symlink from where
