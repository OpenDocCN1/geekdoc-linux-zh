    \nBind runs on port 53, using both udp and tcp, udp is used for normal domain\
    \ queries (it's lightweight and fast), tcp is used for zone transfers and large\
    \ queries (say dig www.microsoft.com). This firewalling tcp is relatively safe\
    \ and will definitely stop any zone"
