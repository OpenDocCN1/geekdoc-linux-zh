  md: '# Network services


    # Telnetd


    Telnet was one of the first services on what is now the Internet, it allows you
    to login to a remote machine interactively, issue commands and see their results.
    It is still the primary default tools for remote administration in most environments,
    and has nearly universal support (even NT has a telnet daemon and client). It
    is also one of the most insecure protocols, susceptible to sniffing, hijacking,
    etc. If you use telnet to come to the server you should definitely shroud your
    accounts in possible, as well as restricting telnet to the hosts they use with
    tcp_wrappers. The best solution for securing telnet is to disable it and use SSL:ified
    telnet or ssh.


    Problems with telnet:


    +   * Clear text authentication, username and password.

    * Clear text of all commands.

    * Password guessing attacks (minimal, will end up in the log files


    The best solution is to turn telnet off and use ssh. This is however not practical
    in all situations. If you must use telnet then I strongly suggest firewall it,
    have rules to allow hosts/networks access to port 23, and then a general rule
    denying access to port (which is more efficient because the system only checks
    tcp connection and not every packet (the firewall rules) using tcp_wrappers will
    allow people to establish that you are running telnet, it allows them to connect,
    evaluates the connection, and closes if they are not listed as being allowed.
    An example of firewall rules:


    ```

    ipfwadm -I -a accept -p tcp -s 10.0.0.0/8 -D 0.0.0.0/0 23

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 23

    ipfwadm -I -a deny -p tcp -s 10.0.0.0/0 -D 0.0.0.0/0 23

    ```


    or in ipchains:


    ```

    ipchains -A input -p all -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 23

    ipchains -A input -p all -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 23

    ipchains -A input -p all -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 23

    ```


    An example of the using tcp_wrappers:

    In /etc/hosts.allow


    ```

    in.telnetd: 10.0.0.0/255.0.0.0, some.trusted.host

    ```


    And in /etc/hosts.deny


    ```

    in.telnetd: ALL

    ```


    There are several encrypted alternatives to telnet as mentioned before, ssh, SSLeay
    Telnet, and other third party utils, I personally feel that the ''best'' alternative
    if you are going to go the bother of rippling telnet off and replacing it with
    something better is to use ssh.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'To secure user accounts with respect to telnet there are several things you
    can do. Number one would be letting root login via telnet, which is controlled
    by /etc/security and by default in most distributions is restricted to logging
    from the console (a good thing). For a user to successfully login their shell
    to be valid (this is determined by the list of shells in /etc/shells), setting
    up user accounts that are allowed to login is simply a matter of setting their
    shell to something in /etc/shells, and keeping users out simple as setting their
    shell to /bin/false/something not listed in /etc/shells. Now for some practical
    examples of what you can accomplish by setting the user shell to things other
    than shells.


    For an ISP that allows customers to change their password easily, but not allow
    them access to the system (my ISP uses Ultraspars and refuses to give out user
    accounts for some reason, I wonder why).


    +   in /etc/shells list:

    - /usr/bin/passwd


    and set the users to use /usr/bin/passwd so you end up with something like:

    username:x:1000:1000:/home/username:/usr/bin/passwd


    and voila, the user telnets to the server, is prompted for their username and
    password, and is then prompted to change his password, if he does successfully
    passwd then he exits and is disconnected, if he is unsuccessful passwd exist and
    he disconnects. The following is a transcript of such a setup when a user telnets:


    Trying 1.2.3.4...

    Connected to localhost.

    Escape character is "^".


    Red Hat Linux release 5.2 (Apollo)

    Kernel 2.2.5 on an i586

    login:

    tester

    Password:

    Changing password for tester

    (current) UNIX password:

    New UNIX password:

    Retype now UNIX password:

    ass: all authentication tokens updated successfully

    Connection closed by foreign host.


    Telnet displays a banner by default when someone connects. This banner typically
    contains systems information like the OS, release and sometimes other detailed
    information such as the kernel version. Historically this was useful if you had
    to work on multiple OS''s, however in today''s hostile Internet it is generally
    more harmful than useful. Telnet displays the contents of the file /etc/issue.net
    which is identical to /etc/issue which is displayed on terminals and so, this
    file is recreated at boot in most Linux distributions, from the rc.local startup
    file. Simply edit the rc.local file, either modifying what it puts into /etc/issue
    and /etc/issue.net or comment out the lines that create those, then edit the files
    with some static information.


    Typical Linux rc.local contents containing to /etc/issue and /etc/issue.net:'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'simply comment out the lines or remove the uname commands. If you absolutely
    must have telnet enabled for user logins make sure you have a disclaimer printed:


    This system is for authorized use only. Trespassers will be prosecuted.


    something like the above. Legally you are in a stronger position if someone cracks
    into the system or otherwise abuses your telnet daemon.'
