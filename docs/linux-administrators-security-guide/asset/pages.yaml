  md: '# Webmin


    Webmin is one of the better remote administration tools for Linux, written primarily
    in Perl it is easy to use and easy to setup. You can assign different ''users''
    (usernames and passwords are held internally by webmin) varying levels of access,
    for example you can assign bob access to shutdown the server only, and give join
    access to create/delete and manipulate users only. In addition to this it works
    on most Linux platforms and a variety of other UNIX platforms. The main ''problem''
    with webmin is somewhat poor documentation in some areas of usage, and the fact
    that the username/password pair are sent in clear text over the network (this
    is minimized slightly by the ability to grant access to only certain hosts(s)
    and networks. Most importantly it makes the system more accessible to non technical
    people who must administer systems in such a way that you do not have to grant
    actual accounts on the server. Webmin is available at: http://www.webmin.com/webmin/
    and is currently free. Webmin defaults to running on port 10000 and should be
    firewalled:


    ```

    ipfwadm -I -a accept -P tcp -s 10.0.0.0/8 -d 0.0.0.0/0 10000

    ipfwadm -I -a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 10000

    ipfwadm -I -a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/0 10000

    ```


    or in ipchains:


    ```

    ipchains -A input -p all -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 10000

    ipchains -A input -p all -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 10000

    ipchains -A input -p all -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 10000

    ```'
  merge: -1
