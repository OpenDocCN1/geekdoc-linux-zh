    The biggest part of file security is however is ‘owned’ by 3 separate entities,
    a User, a Group, and Other (everyone else). In Linux a file is ‘who can set the
    owner, and who is the owner by:

    chown user:group object


    where is a file, directory, etc. If you want to deny access to all of the 3 owners
    simply:

    chmod x="" object


    where x is ajlugo (All/User/Group/Other), force the permissions to be equal to
    "" (null, nothing, no access at all) and object is a file, directory, etc. This
    is by far the quickest and most effective way to rip out permissions and totally
    deny access to users/etc(= forces to clear it). Remember that root can ALWAYS
    change file and view/edit/run the file, Linux does not provide safety to users
    from root (which would argue is a good thing). Whoever owns the object is in (they
    be a user/group/other with appropriate permissions on the parent directory) can
    also potentially edit permissions (and since root owns/it can make changes that
    can traverse the filesystem to any location).


    # Secure file deletion


    One many of us forget is that when you delete a file, it isn’t actually gone.
    Even if you overwrite it, format the drive, or other attempt to destroy it, chances
    can it be recovered, and typically data recovery services only cost a few thousand
    dollars, so it might be well worth an attacker and money to have it. The trick
    is to scramble the data bits (a.k.a. the 1’s and 0’s) so that when finished no
    traces of the original data remain (i.e. magnetic bits still changed the same
    way they were originally). Two programs (both called wipe) have been written to
    do just.'
