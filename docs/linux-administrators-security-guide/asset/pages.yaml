  md: '# Samba


    SAMBA is one of the best since sliced bread, that is if you want to share files
    and printers between Windows and *NIX. It is also somewhat misunderstood, and
    suffers heavily from interaction with various (sometimes broken) Windows clients.
    SAMBA has a great kludges that attempt to make it somewhat sane, but can lead
    to what looks like broken behavior. SAMBA simply gives access to the filesystem
    VIA SMB (Server Message Block), the protocol uses to share files and printers.
    It verifies the username and password (if required) and then gives access to the
    files according to the file permissions and so forth are set. I am only going
    to cover Samba 2.x, Samba 1.x is pretty old and obsolete.


    Samba 2.x is controlled via smb.conf, typically in /etc (man smb.conf). In /etc/smb.conf
    you have four areas of configuration: [globals], [printers], [homes], and each
    [sharename] it''s own configuration (be it a printer or drive share). There are
    a number of switches, the samba conf page covers exhaustively. Of the important
    (security) ones are:


    security = xxxx where xxxx is the server or domain, security is per share, with
    a password that everyone gets to get at, or means the samba server itself authenticates
    users, either via /etc/password, or smpasswd If you set it to domain, samba authenticates
    the user via an NT controller, thrashing nicely into your existing NT network
    (if you have one).


    guest account = xxxx where xxxx is the username of the account you want the guest
    user to map. If a share is defined then all requests to it are handled as this
    user.


    hosts allow = xxxx where xxxx is a space separated list of hosts / IP blocks allowed
    to connect to the server.


    hosts deny = xxxx where xxxx is a space separated list of hosts / IP blocks not
    allowed to connect to the server.


    interfaces = xxxx where xxxx is a space separated list of IP blocks that samba
    will bind to


    I would highly recommend installing and using SWAT (samba Web Administration Tool)
    as it will kill down on the mistakes/etc that you are likely to make. Samba and
    SWAT are available at: http://www.samba.org/ and ship with almost every distribution.


    # SWAT


    SWAT is a very important tool to setup your samba.conf. The main problem is that
    it requires you to use the root account and password to ''log'' in, and as a separate
    process out of inet.conf, there is no easy way to encrypt it, and as far as I
    can tell no way to grant others administrative access to SWAT. Having said that
    it is a good tool for cutting down on mistakes while editing samba.conf You can
    also run SWAT with the -a switch, meaning no password will be required, and using
    TCP_WRAPPERS to restrict access to certain workstations (although you''d be open
    to IP spoofing), essentially SWAT was not meant as a secure administrative tool,
    but it is useful. SWAT comes with samba (usually)'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'and is available at: http://www.samba.org/, a demo of SWAT is online at:

    http://anu.samba.org/cgi-bin/swat.'
