    ; // _PATH_DUMPFILE\n    pid-file \"/var/run/named.pid\"; // _PATH_PIDFILE\n \
    \   statistics-file \"/var/tmp/named.stats\"; // _PATH_STATS\n    memstatistics-file\
    \ \"/var/tmp/named.memstats\"; // _PATH_MEMSTATS\n    // End necessary chroot\
    \ paths\n    check-names master warn; /* default. */\n    datasize 20M;\n}\n```\n\
    \n```\nzone \"localhost\" {\n    type master;\n    file \"master/localhost\";\n\
    \    check-names fail;\n    allow-update { none };\n    allow-transfer { any };\n\
    }\n```\n\n```\nzone \"0.0.127-in.addr.arpa\" {\n    type master;\n    file \"\
    master/127.0.0\";\n    allow-update { none };\n    allow-transfer { any };\n}\n\
    ```\n\n```\n// Deny and log queries for our version number except from localhost\n\
    zone \"bind\" chaos {\n    type master;\n    file \"master/bind\";\n    allow-query\
    \ (localhost);\n}\n```\n\n```\nzone \".\" {\n    type hint;\n    file \"named.zone\"\
