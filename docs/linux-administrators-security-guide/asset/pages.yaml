  md: '# Backups


    Something people forget about, but you can compare the current files to old backups,
    many backup formats (Tape, floppy, CDR, etc.) can be made read only, so a backup
    of a newly installed system provides a good benchmark to compare things to. The
    utility "diff" and "cmp" can be used to compare files against each other. See
    the backup session for a full listing of free and commercial software.'
