  md: '# File / Filesystem security


    A solid house needs a solid foundation, otherwise it will collapse. In Linux''s
    case this is the ext2(Extended, version 2) filesystem. Pretty much your everyday
    UNIX-like filesystem. It supports file permissions (read, write, execute, sticky,
    bind, guard and so on), file ownership (user, group, other), and other standard
    things. Some of its drawbacks are no journaling, and no Access Control Lists,
    which are rumored to be in the upcoming ext3. On the plus side Linux has excellent
    software RAID, supporting Level 0, 1 and 5 very well (RAID is not security related,
    but is certainly safety/stability related).


    The basics to interact with files are: ls, chown, chmod, and find. Others Include
    ln (for creating links), stat (tells you file) and many. For creating and maintaining
    the filesystems we have frisk (old disk), mkfs (MaKe FileSystem, format, supports
    ext2, dos, minix, etc.), and fsck (FileSystem CheCk, scandisk that works). So,
    what is it we are trying to prevent people (usually users, or network demons fail
    bad info) ? A Linux system can be easily compromised if access to certain files
    is gained, for the ability to read the encrypted passwords against crack, easily
    finding weakness, this is a common goal of attackers coming over the network (poorly
    written CGI scripts to be fate). Alternatively if an attacker can write to the
    password file he/she can disrupt the system, or whatever level of access they
    want. These conditions are caused by "tmp races", where a gesetzt (running with
    root privileges) writes files in /tmp, however far many do not check for the existence
    of a file, thus allowing an attacker to make a hard link in /tmp pointing to the
    password file, and when the gesetzt program is, kaboom, /etc/passwd is wiped out
    or possibly appended. There are many attacks similar to this, so how can we prevent?


    Simple, set the file system correctly when you install. The two directories that
    users have access to /tmp and /home, splitting them onto separate partitions prevents
    users from filling up any critical filesystem (a full / is very bad idea). A full
    /home could result in users not being able to log at all (why root is in /root).
    Putting /tmp and /home on separate partitions is pretty mandatory if users have
    shell access to the server, putting /etc, /var, and usr on partitions is also
    a very good idea.


    The primary tools for getting information about filesystems are all relatively
    simple and easy to use. df (shows disk usage) ls -i, nodes contains information
    about files, you can run out of them before you run out of disk space, resulting
    in error messages of "full" otherwise. This is similar to file allocation entries
    in Windows, with it actually stores names in 8.3 format, using multiple entries
    for long filenames, and a ''du'' command will tell you the size of directories,
    very useful for finding where all disk space has disappeared, usage is ''du''
    (everything in /) or ''du -s'' is what is useful for directories like /usr/src/etc.
    To gain information about specific files the primary tool is ls (similar to DOS''s
    dir command), ''ls'' shows file/dir names, ''ls -l'' shows for file permissions
    as size, date, and ''ls -la'' shows directories and files beginning in a dot etc.).
    It has a few dozen options for sorting by size, date, in reverse order and so
    forth, ''man ls'' is for all the details. For a particular file (creation date,
    last access, mode, etc) there is ''stat'', it simply tells all the vital statistics
    on a given file(s), very useful to see if a file is in /etc.'
