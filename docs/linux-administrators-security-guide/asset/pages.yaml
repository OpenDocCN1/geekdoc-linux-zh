  md: '# Apache


    What can I say about securing Apache? Not much actually. By default Apache runs
    as the user ''nobody'', giving it very little access to the system, and by large
    the Apache team has done an excellent job of buffering overflows/etc. In general
    www servers retrieve data from off the system and send it out, most of the danger
    come not from Apache but from sloppy programs that are executed via Apache (CGI''s,
    server side includes, etc). If I am going with Apache I would recommend using
    1.3 unless you have some strange reason for sticking to 1.2, the active development
    is now on 1.3, and includes many new features from security, usability, stability
    and performance viewpoints. Most servers based upon Apache (RedHat Secure Server,
    Stronghold, etc) are generally just as bug free there are occasionally problems.


    If you want to be paranoid I would suggest running Apache in a chrooted environment,
    however is more trouble than it is worth. Doing this will make great many things.
    You must also install numerous libraries, perl, and any other utilities that your
    apache server will be using, and any configuration files you wish to have access
    to. Any CGI scripts and others that interact with the system will be somewhat
    problematic and generally harder to troubleshoot.


    The simplest way to secure apache is simply install it and move/edit the necessary
    files. A good idea is to create a directory (such as /chroot/apache/), preferably
    on a separate filesystem for /,usr, etc (symlinks, accidental filling of partitions,
    etc...), and then create a file structure under it for. The following is an example,
    simply replace /chroot-http/ with your --root directive. You must execute these
    steps as root for it to work. RPM supports this with the --root directive, simply
    install apache and the needed libs using rpm (thus giving it''s support for dependencies/etc,
    making your life easier).


    Apache logs requests and so internally, so you don''t have to worry about setting
    up holographic or any strangeness in order to get your files behaving.


    But the simplest way to secure apache and ensure that it doesn''t have unnecessary
    access to your filesize is to create a /www/ or similar directory and place ALL
    the websites, webcontent, cgi and so forth under. Then you can set access.conf
    to deny any access to /, and enable access to /www/ and it''s various cgi-bin
    directories.


    Example for access.conf:


    ```

    <Directory />

    Options None

    AllowOverride None

    </Directory>

    ```


    ```

    <Directory /www >

    Options Indexes FollowSymLinks Includes

    AllowOverride None

    </Directory>

    ```


    Access to directories can also be easily controlled, Apache supports the defining
    and placement of files (usually referred to htaccess files) that can control access
    based on username and password, IP of origin, and so forth. This is defined in
    srm.conf:'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'AccessFileName .access


    The format of this file is covered in the apache documentation, and is identical
    to directives you would place in access.conf (almost most). User authentication
    via username and password is also covered in depth at: http://www.apacheweek.com/features/auth/


    You will also want to prevent people from viewing the .htaccess file(s), place
    this in your srm.conf:


    ```

    <Files>

    order allow,deny

    deny from all

    </Files>

    ```


    This will disallow the viewing of any file called ''.htaccess''


    Apache runs on port 80, tcp usual, and if it is for internal use only (an Intranet
    or www based control mechanism for a firewall server say) you should definitely
    deny it.


    ```

    ipfwadm -I -a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 80

    ipfwadm -I -a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 80

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 80

    ```


    or in iptables:


