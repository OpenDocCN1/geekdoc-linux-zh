  md: "# NFSD\n\nNFS stands for Network File System and is just that, it is a good\
    \ way to distribute filesystems, read only and/write, maintaining a degree of\
    \ security and control assuming your network is enclosed and secure. NFS is primarily\
    \ meant for use in a high bandwidth environment (i.e a LAN) where security risks\
    \ are not high, or the information being shared is not sensitive (a small trusted\
    \ LAN behind a firewall exchanging CAD/CAM diagrams, or a large university using\
    \ NFS for mount/. If you need a high level of security, encrypted data between\
    \ hosts, NFS is not the best choice. I personally use it at cross my internal\
    \ LAN (the machine which has 2 interfaces, which one is easily firewalled), to\
    \ share file systems containing rpn's, this website, etc. Safer alternatives include\
    \ SAMBA (free) and now IBM is portant NFS to Linux (costly but NFS is a sweet\
    \ hook of code).\n\nNFS has a few rudimentary security controls, the first one\
    \ would be firewalling, using NFS across a large, spoof network like the internet\
    \ isn't a good idea in case, so firewall port 2047, UID. Since NFS runs as a set\
    \ of daemons, tcp wrappers are of no use NFS is compiled to support. The config\
    \ for NFS actually has a few directives, the bulk of which deal with user and\
    \ group id settings (map everyone to nobody, perhaps all the engineering clients\
    \ to 'engineer', etc.) but not no real mechanisms for authentication (your client\
    \ claims to be UID 0, nor is your root's squashed by default nobody). NFS risks\
    \ are pretty safe, you only have to worry about the wrong people getting a look\
    \ at your info (if it is sensitive) or creating a denial of service attack (say\
    \ you have a directory word readable/etc for sharing kernel source, and some gomer\
    \ starts sucking down like crazy...). Writable exports are a whole ball game,\
    \ and should be used with extreme caution, since the 'authentication' is based\
    \ on IP/hostname (both easily). Bounce a client with a DOS attack, grab their\
    \ IP, mount the writable share and go to town. You say \"they'd have to know the\
    \ IP and UID (to run Linux and UID). packet sniffing is not rocket science, nor\
    \ is 'showmount'. So, how do we get about securing NFS? The first is to firewall\
    \ it, especially if the machine is multi-homed, with an interface connected to\
    \ a publicly accessible network (the Internet, the student lab, etc.). If you\
    \ plan to run NFS over a publicly accessible network itter be read only, and you\
    \ will be far off with a different product than NFS. The second most interesting\
    \ is the /etc/exports file. This controls what you allow clients to, and how they\
    \ do it.\n\nA sample exports file.\n\n```\n# Allow a workstation to edit web content\n\
    /www\n\t10.0.0.11(rw,no_root_squash)\n\n# Another share to allow a user to edit\
    \ a web site\n/www/www.bobo.org\n\t10.0.0.02(rw,no_root_squash)\n\n# Public ftp\
    \ directory\n/home/ftp\n\t*.example.org(ro,all_squash)\n```\n\nThe structure of\
    \ the exports file is simple pretty, if you want to export, the client can (always\
    \ use IP's, hostnames, and UID) (10.0.0.1, hostname gomer.poncho.net), a subnet\
    \ (10.0.0.0/255.255.255.0) or a wildcard (*bigdaddy.mil). Some of the most interesting\
    \ (and useful) directives for the exports file are:"
