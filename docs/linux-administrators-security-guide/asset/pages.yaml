  md: '# Physical Boot security


    # Physical Access


    This area is covered in depth in the "Practical Unix and Internet Security" book,
    but I''ll give a brief overview of the basics. Turns your main accounting server
    off, turns it back on, boots from it specially made floppy disk and transfers
    payroll.db to a foreign ftp site. Unless your accounting server is locked up is
    to prevent a malicious user (or the cleaning staff of your building, the delivery
    guy, etc.) from doing just that! I have heard horror stories of cleaning staff
    unplugging servers so that they could plug their cleaning equipment in. I have
    seen people clicking the little switch on power bar and reboot their servers (not
    that I have ever done that). It just makes sense to lock your servers in a secure
    room (or even a closed). It is also a very good idea to put the servers on a raised
    surface to prevent damage in the event of flooding (be it a hole in the roof or
    a super slurpee).


    # The Computer BIOS


    # LILO


    ```

    delay=x

    controls how long (in tenths of seconds) LILO waits for user input before booting
    to the default selection. One of the requirements of C2 security is that this
    interval be set to 0 (obviously a dual boot means most out of the water). It is
    a good idea to set this to 0 unless the system dual boots something else.

    ```'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'forces the user to enter something. LILO will not the system automatically.
    This could be useful on servers as a way of disabling reboots without a human
    attendant, but typically if the hacker has the ability to reboot the system they
    could rewrite the MBR with new boot options. If you add a timeout option the system
    will continue booting after the timeout is reached.


    restricted requires a password to be used if boot options (such as "linux single")
    are passed to the boot loader. Make sure you use this one on each image (otherwise
    the server will need a password to boot, which is fine if you''re never planning
    to reboot it).


    password=XXXXX requires to input a password, used in conjunction with restricted,
    also make sure lilo.conf is no longer readable, or any user will be able to read
    the password.


    Here is an example of lilo-conf from one of my servers (the password has been
    of course changed).


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    default=linux

    image=/boot/vmlinuz-2.2.5

    label=linux

    root=/dev/hda1

    read-only

    restricted

    password=some_password

    ```


    This boots system using the /boot/vmlinuz-2.2.5 kernel, stored on the MBR of the
    first IDE hardrive of the system, the prompt keyword normally stop unattended
    rebooting, however it is set in the system, it can boot "linux" no problem, but
    it would ask for a password if you entered "linux single", so if you want to go
    into "linux single" you have 10 seconds to type it in, at which point you would
    be prompted for the password ("some_password\). Combine with a BIOS set to only
    boot from C: and password protected and you have a pretty secure system.'
