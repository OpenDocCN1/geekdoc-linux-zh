  md: '# X Window System


    The X Window System provides a network transparent method for sharing graphical
    data, or more specifically for exporting the display of a program to a remote
    (the local) host. Using it you can run a 3d rendering package on SGI origin 2000
    and display it on a 486. Essentially it''s the grandaddy to all this ''thin client''
    hype that is very popular nowadays. It was created by MIT, and the time security
    was not much of a concern, this of has led to me a few nasty bugs being found,
    as the level of control over X is given (it handles keystrokes, mouse movements,
    draws the screen, etc) means if it is compromised very bad things can happen.
    This data, if sent over the network (i.e., the X program being is displaying on
    a remote host) can be easily loaded, sensitive information (an xterm being used
    to login another remote system) is vulnerable. In addition to these the authentication
    protocol that X uses relatively weak (although it has improved). Running a graphical
    xenc session on a 3 timezones however can be a very handy thing.


    X is very portable in usage, almost all implementations and installations of X
    use 6000 for the first session and increment by one for others, making it quite
    easy to scan. If you are not using X to display program running on remote systems
    I suggest strongly firewall port 6000. Control over how/what is connected to the
    X can be accomplished several ways.


    ```

    ipfwadm -I -a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 6000:6100

    ipfwadm -I -a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 6000:6100

    ipfwadm -I -a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/0 6000:6100

    ```


    or


    ```

    ipchains -A input -p tcp -J ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 6000:6100

    ipchains -A input -p tcp -J ACCEPT -s some.trusted.host -d 0.0.0.0/0

    6000:6100

    ipchains -A input -p tcp -J DENY -s 0.0.0.0/0 -d 0.0.0.0/0 6000:6100

    ```


    xhost


    xhost simply allows you to specify which machines are, or aren''t allowed to connect
    to the X environment, this is a very simplistic security mechanism and is not
    really suitable in modern environment, however used in conjunction with other
    mechanisms it can help. The command is quite simple:''xhost +hostname adds hostname,
    ''xhost -hostname removes hostname from the list, you must also specify ''xhost
    -'' to turn on the access control list, or everyone is in by default.


    mkxauth


    mkxauth is definitely a step up, it creates .authority files, and merge them,
    which are used to specify hostnames and the related magic cookies (basically a
    token used to gain access). These cookies can be used to gain access to a remote
    X host (you essentially have a copy of the config on each end) and are transferred
    plain text (insecure) or DES encrypted (quite secure). Using this method you can
    be relatively safe and secure. Authority files can also be used in conjunction
    with Kerberos, removing the necessity to copy Authority files and keep them in
    synchronization. Hosts authenticate to each other'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'through a central Kerberos key server(s) in an encrypted fashion, this method
    is most appropriate for large installations/etc. mkxauth has an excellent man
    page ''man mkxauth'' and more generalized details are available in the Xsecurity
    man page (not sure how common this name page is) ''man Xsecurity''.


    # SSH


    SSH can be used to create a tunnel between hosts (or more specifically between
    two X servers), thus encrypting the channel, providing authentication, and generally
    making things safer. The following web page explains it in detail:

    http://csociety.ecn.purdue.edu/~sigos/projects/ssh/forwarding.'
