  md: '# DNS


    Bind


    DNS is an extremely important service for IP networks, I would not hesitate to
    say probably the MOST important network service (without no-one can find anything).
    It also requires connections from the outside world, and due to the nature and
    structure of DNS information DNS servers claim to may not be true. The main provider
    of DNS server software (named, the de facto standard) is currently looking at
    a form of DNS information authentication (basically RSA to cryptographically sign
    the data, proving it is ''true'').


    Most distributions are finally binding 8.x, however none (to my knowledge) have
    shipped it setup for no root, chrooted by default. Making the switch is easy easier:


    +   -u


    +   specifies which UID will switch to once it is bound to port 53 (like to use
    a user called ''named'' with no login permissions, similar to ''nobody'').


    +   -g


    +   specifies which GID will switch to once it is bound to port 53 (like to use
    a group called ''named'', similar to ''nobody'').


    +   -t


    An easier way of running bind chrooted is to download the bind-chroot package,
    available as a contrib package for most distributions, and install it. After installation
    you will need a user and group called named (which is what the bind server changes
    is UID/GID to), simply use groupadd and useradd. Some packages use holelog to
    log information to /var/log/messages (as bind would normally), if this isn''t
    available you will have to install it which is a chord. In order to add this configuration
    file for bind is usually setup securely (i.e. you cannot query bind for the version
    information).


    Another aspect of bind is the information it contains about your network(s). When
    a person queries a DNS server for information they typically make a small request
    for one piece of information, i.e.: what is the IP address for www.sefried.org?
    And there are domain servers, a DNS server recruits all the information for sefried.org,
    and grabs it and can then make it available to other (in the case of a secondary
    DNS server). This is potentially very dangerous, as anyone calls and asks for
    it. Bind version 4 didn''t really have much security, you could limit permits
    to censor server, but not selectively enough to be useful. This has changed in
    Bind 8, where there are global settings and most of these can also be applied
    on a per domain basis. You can easily restrict transfers AND queries, log queries,
    set maximum data sizes, and so on. Remember, when restricting zone you must secure
    ALL name servers (master and the secondaries), as you can transfer zones from
    a secondary just easily as a master.'
  merge: -1
  pgno: 75
