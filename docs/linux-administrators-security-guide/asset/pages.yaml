  md: "rsync is an extremely efficient method for mirroring files, be it source code\
    \ files of a CVS tree, a web site, or even this document) rsync preserves file\
    \ permissions, links, file times and, in addition to this it supports an anonymous\
    \ mode (which incidentally I use for the mirroring of this document) that makes\
    \ life very easy for all concerned. The rsync program itself can act as the client\
    \ (from a command line or script) and as the server (typically run in inetd).\
    \ The program is quite secure, it does not require root privileges as a client\
    \ or the server (although if you really want to, and can choose into the root\
    \ directory of whatever is mirrored (which however requires root privileges and\
    \ can be more dangerous than it is worth). You can also map the user id and group\
    \ it will access the system (the default is nobody for precompiled rsync packages\
    \ and is probably the best choice). In non anonymous mode rsync supports usernames\
    \ and passwords, that are encrypted quite using 128 bit MD4. The \"rsync.conf\"\
    \ page clearly sets up rsync as a server and making it relatively fast. The default\
    \ configuration file is /etc/rsync.conf, and has a global section, and module\
    \ sections (basically each shared out directory is a module).\n\nrsync example:\n\
    \n```\nmotd file = /etc/rsync.modt # specifies a file to be displayed, legal\n\
    disclaimer, etc\nmax connections = 5      # maximum number of connections so you\
    \ don't\nget flooded\n[pub-ftp]\n    comment = public ftp area # simple comment\n\
    \    path = /home/ftp/pub     # path to the directory exported\n    read only\
    \ = yes          # make it read only, great for exported\ndirectories\n    chroot\
    \ = yes             # chroot to /home/ftp/pub\n    uid = nobody             #\
    \ explicitly set the UID\n    gid = nobody             # explicitly set the GID\n\
    [secret-stuff]\n    comment = my secret stuff # path to my stuff\n    path = /home/user/secret\n\
    \    list = no               # hide this module when asked for a\nlist\n    secrets\
    \ file = /etc/rsync.users # password file\n    auth users = mem, bob   # list\
    \ of users I trust to see my\nsecret stuff\nhosts allow = 1.1.1.1, 2.2.2.2  #\
    \ list of hosts to allow\n```\n\nAs you can see rsync is configurable, and generally\
    \ secure, the exception being the actual file transfers are not encrypted in any\
    \ way. If you need free I suggest you using SSH to tunnel a connection, or some\
    \ VPN solution like FreeS/WAN. Also make sure you are running rsync 2.3.x or have\
    \ a potential root compromise found in 2.2.x. Rsync is available at: http://rsync.samba.org/.\
    \ Rsync runs on port 873, tcp.\n\n```\nipwafmd -I -a accept -P tcp -S 10.0.0.0/0\
    \ -D 0.0.0.0/0 873\nipwafmd -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0\
    \ 873\nipwafmd -I -a deny -P tcp -S 10.0.0.0/0 -D 0.0.0.0/0 873\n```\n\nor\nipchains\
    \ -A input -p tcp -j ACCEPT -s 10.0.0.0/0 -d 0.0.0.0/0 873"
