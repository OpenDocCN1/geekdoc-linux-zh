  md: '# NNTP


    # INN


    The usenet server INN has a long and varied history, for a long period there were
    no official releases and it seemed to be in a state of limbo, however it is back
    for now it would seem. The server software is responsible for handling a potentially
    enormous load, if you take a fewfeed the server must process several hundred articles
    per second, some kilobytes by size. It index these articles, write them to disk,
    and hand them out to clients that request them. INN itself is relatively secure,
    since it handles data with a directory and generally does not have any access
    outside of that, however as with any messaging system you use it for private/confidential
    material you must be careful. INN is currently maintained by ISC and is available
    at: http://www.isc.org/inn.html.


    One of the main security threats with INN is resource starvation on the server,
    if someone decides to flood your server with bogus articles, or there is a sudden
    surge of activity you might be in trouble if capacity is lacking. INN has had
    bad security holes in past, but with today''s programmers we have chased down
    and eliminated all of them (none have surfaced recently). It is highly recommended
    (for more security reasons) that you use a partition, let alone disk partition,
    you might also wish to limit the amount of memory available so that it cannot
    bring the server to its knees.


    As for access you definitely not allow public access, any news server that is
    publicly accessible will be quickly hammered by using it to read news, send and
    the like. Restrict reading of news to your clients/internal network, and if you
    are really forced people to login. Client access to INN is controlled via the
    nnrp.access file, you can specify IP(s), domain names and domains (such as *.me.com),
    as well as there access levels (read and post), the newsgroups they do or not
    have access to and you can also specify a username and password, since this is
    linked to the/host it gets something messy.


    example of nnrp.access:


    ```

    *:-no : -nono :!*

    # denies access from all sites, for all actions (post and read), to all groups.

    *me.com:Read Post:::*

    # hosts in me.com have full access to all groups

    *the.com:Read::*:! , *me.*

    # hosts in them.com have read access to everything but the me hierarchy

    *aol.com:Read Post: myname:mypassword:*

    # give me access from my AOL account using a username and password

    ```


    If you are going to run a news server I highly recommend the O''Reilly book "Managing
    Usenet", us to Sendmail, a total beast to get running smoothly and keep happy.


    News should be firewalled as most servers typically use an internal group, and
    access connections from one or two upstream feeds:


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 119

    ipfwadm -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 119

    ```'
