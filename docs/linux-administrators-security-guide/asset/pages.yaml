  md: '# The Linux kernel


    Linux (GNU/Linux according to Stallman if you''re referring to a complex Linux
    distribution) is just the kernel of the operating system. The kernel is the core
    of the system, it handles access to all the harddrive, security mechanisms, networking
    and pretty much everything. It had better be secure or you were screwed.


    In addition to we have problems like the Pentium F00 bug and inherent problems
    with the TCP-IP protocol, the Linux kernel has it''s work out for it. Kernels
    are labeled as X.Y.Z, Z are minor revision versions, Y define if the kernel is
    a test (odd number) or production (even number), and X define the major revision
    (we have had 0, 1 and 2 so far). I would highly recommend running kernel 2.2.x,
    as of May 1999 it is 2.2.9. The 2.2.x series of kernel has major improvements
    over the 2.0.x series. Using the 2.2.x kernels also allows you to access features
    such as ipchains (instead of ipfwadm) and other advanced features.


    # Upgrading and Compiling the Kernel


    Upgrading the kernel consists of getting a new kernel and modules, editing /etc/lifof.conf,
    rerunning lilo to write a new MBR. The kernel will typically placed in /boot,
    and the modules in /lib/modules/kernel.version.number.


    Getting a new kernel and modules can be achieved 2 ways, by downloading the appropriate
    kernel and installing it, or by downloading the source code from http://ftp.kernel.org/
    (please use a mirror site), and compiling it.


    Compiling the kernel is straightforward:


    ```

    cd /usr/src

    ```


    there should be a symlink called "linux" pointing to the directory containing
    the kernel, remove it if there is, if there isn''t one no problem. You might want
    to ''mv'' the linux directory to /usr/src/linux-kernel.version and create a link
    pointing /usr/src/linux at it.


    Unpack the source code using tar and zip as appropriate so that you now have a
    /usr/src/linux with about 50 megabytes of code in it. The next step is to create
    the kernel configuration (/usr/src/linux.config), this can be achieved using "make
    config", "make menuconfig" or "make nconfig", my preferred method is "make config".
    This is arguably the hardest step, as there are hundreds options, which can be
    categorized into two main areas: hardware support, and service support. For hardware
    support make a list of hardware that the kernel will be running on (i.g. P166,
    Adaptec 2940 SCSI Controller, NE2000 ethernet card, etc.) and turn on the appropriate
    options. As for service support you need to figure out whichystems (fat, ext2,
    ...) plan to use, the same for networking (firewalling, etc.).


    Once you have configured the kernel to compile it, the following commands make
    dependencies ensuring that libraries and so get built in the right order, then
    cleans out any information from previous samples, builds a kernel, the modules
    and installs the modules.'
  merge: -1
