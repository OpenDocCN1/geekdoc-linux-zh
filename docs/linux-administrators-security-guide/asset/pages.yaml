  md: '# Network Based Authentication


    # NIS / NIS+


    NIS and NIS+ (formally known as ''yellow pages'') stands for Network Information
    Service. Essentially NIS and NIS+ provide a means to distribute password files,
    group files, and other configuration files across many machines, providing account
    and password synchronization (among other services). NIS+ is essentially NIS with
    several enhancements (mostly security related), they are very similar. To use
    NIS you set up a NIS server that will contain the records and allow them to be
    changed (add users, etc), this server can distribute the records to slave NIS
    machines that contain read only copy of the records (but they can be promoted
    to master and read/write if something bad happens). Clients of the NIS network
    essentially request portions of the information and copy it directly into their
    configuration files (like /etc/passwd), making them accessible locally. Using
    NIS can provide several thousand roadways and servers with identical sets of usernames,
    information, passwords and the like, significantly reducing administration nightmares.
    However this is the problem of, sharing this information you make it accessible
    to attackers, which is using NIS+ attempts to resolve, the problem NIS+ is another
    nightmare to set up. An alternative strategy would be to use some VPN support
    (FreeSWAN, doesn''t it solve some problem?) and encrypt the data before it gets
    onto the network. There is a NIS/ NIS+ howto:http://metalab.com/LDP/HOWTO/NIS-HOWTO.html,
    and O''Reilly has an excellent book on the subject. NIS+ runs over RPC which use
    port 111, tcp and udp. This currently should be defined at your network border,
    but will not totally persist NIS / NIS+


    ```

    ipfwadm -I -a accept -P udp -s 10.0.0.0/8 -d 0.0.0.0/0 111

    ipfwadm -I -a accept -P udp -s some.trusted.host -d 0.0.0.0/0 111

    ipfwadm -I -a deny -P udp -s 0.0.0.0/0 -d 0.0.0.0/0 111

    ```


    or


    ```

    ipchains -A -p input -udp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 111

    ipchains -A -p input -udp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 111

    ipchains -A -p input -udp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 111

    ```


    Since NIS and NIS+ are RPC services they do use higher port numbers (i.e. above
    1024) in a somewhat random fashion, making firewalling of it quite painful. The
    best solutions is to place your NIS server(s) on machines that are internally
    blocked from completely talking to the Internet, inbound and outbound.


    # SRP


    SRP is a relative newcomer, however it has several advantages over some of the
    older programs. SRP is free for commercial use and does not use encryption to
    secure the data, exporting it outside of the US isn''t as much of a problem. SRP
    uses one way hashes for authentication of both parties. The disadvantage is that
    SRP only encrypt the login (username and password) so any data transferred (such
    as the telnet session or or ftp sites) are vulnerable. You can get SRP from SRP:
    http://srv.stanford.edu/srp/. SRP currently has Telnet and FTP support (which
    we as well) enabling other protocols is relatively straightforward.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Kerberos is a modern network authentication system based on the idea of handing
    a user a ticket once they have authenticated to the Kerberos server (similar to
    NT''s use of tokens). Kerberos is available from: http://web.mit.edu/kerberos/www/.
    The Kerberos FAQ is available at: http://www.nrl.navy.mil/CCS/people/kenh/kerberos-faq.html.
    Kerberos is appropriate for large installations as it scales better and is more
    secure than NIS / NIS+. Kerberizing programs such as telnet, imap and pop can
    be achieved with some effort, Windows clients with Kerberos support are harder
    to find however.'
