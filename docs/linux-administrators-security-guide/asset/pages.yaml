- img_proc: true
  md: '# Scanning and intrusion detection tools


    If the last section has worried you should. There are many defenses, active and
    passive against those types of attacks. The best ways to combat network scans
    are keep software up to date, only run what is needed, and heavily restrict the
    rest through use of firewalls and other mechanisms. Luckily in Linux these tools
    are free and easily available, again I will only cover opensource tools, since
    the idea of a proprietary firewall/etc is rather worrying. The first line of defense
    should be a robust firewall, followed by packet filters on all Internet access
    machines, liberal use of TCP-WRAPPERS, logging and more importantly automated
    software to examine the logs for (it isfeasible for an administrator to read log
    files nowadays).


    # Logging Tools


    Port Sentry (beta)


    The third component of the Abacus suite, it detects and logs port scans, including
    stealthy scans (anything nmap can do it should detect). Port Sentry can be configured
    to block the offending machine (in my opinion a bad idea as it could be used for
    a denial of service attack on legitimate hosts), making completion of a port scan
    difficult. As this tool is beta I would recommend against it, with however some
    age it should mature into a solid and useful tool. Port Sentry is available at:
    http://www.psionic.com/abacus/portsentry/


    # Host based detection attack


    Firewalling


    Most firewalls support logging of data, and ipfwadm/ipchains are no exception,
    using the -l switch you get a syslog entry for every packet, and using automated
    filters (Perl is good for this) you can detect trends/hostile attacks and so on.
    Since most firewalls (UNIX based, and Cisco in any case) log via the syslog facility,
    you can centralize all your firewall packet logging on a single host (with a lot
    of harddrive space hopefully).


    # TCP-WRAPPERS


    Wi''s TCP-WRAPPERS allow you to restrict connections to various services based
    on IP address and so, but even more it allows you to configure a response, you
    can have it emulate, you finger the offending machine, and so on (with use however).
    TCP_WRAPPERS comes standard with most distributions and is available at: ftp/ftp.porcupine.org/pub/security/


    # Klaxon


    While mostly obsolete by TCP-WRAPPERS and firewall logging, klaxon can still be
    useful for detecting port scans/etc if you don''t want to totally lock down the
    machine. Klaxon is available at: ftp/ftp.eng.auburn.edu/pub/doug/


    Host Sentry (pre release software)'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'While this software is not yet ready for mass consumption I thought I would
    mention anyways as it is part of a larger project (The Abacus project, http://www.psionic.com/abacus/).
    Basically Host Sentry builds a profile of user accesses and then compares that
    to current activity in order to flag any suspicious activity. Host Sentry is available
    at: http://www.psionic.com/abacus/hostsentry.


    # Pikt


    Pikt is an extremely interesting tool, it is actually more of a scripting language
    aimed at system administration then a simple program. Pikt allows you to do things
    such as killing off idle user processes, enforcing mail quotas, monitor the system
    for suspicious usage patterns (off hours, etc), and much more. About the only
    problem with Pikt will be a steep learning tools, as it uses it'' own scripting
    language, but ultimately I think mastering this language will pay off if you have
    many systems to administer (especially since Pikt runs on Solaris, Linux and FreeBSD
    currently). Pikt is available at: http://pikt.uchicago.edu/pikt/


    # Network based attack detection


    # NFR


    NFR (Network Flight Recorder) is much more then a packet sniffer, it actually
    logs data and in real time detects attacks, scans and so on. This is a very powerful
    tool and requires a significant investment of time, energy and machine power to
    run, but it is at the top of the food chain for detection. NFR is available at:
    http://www.nfr.com.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Host monitoring tools


    Monitoring your server(s) and host(s) is important for a variety of reasons, from
    tracking down break-ins to legal requirements. Remember, an ounce of prevention
    is worth a pound of cure. There are a variety of monitoring tools available in
    the Logging section from syslog to audit (which allows you to audit users files,
    running programs, etc.). I strongly suggest you use them. As there are a number
    of more specific programs to monitor system status and prevent users from doing
    things they shouldn''t.


    # bgcheck


    bgcheck runs in background and checks the process table for items that should
    running (i.e. irc bots, password crackers, etc.). You can download it from: http://blue.dhs.org/bgcheck/.


    # Sxid


    Sxid checks setuid and setgid for changes, generates MD5 signatures of the files
    and generally allows you to track any changes made. You can get it at: ftp://marcus.seva.net/pub/sxid/


    # Viperdb


    Viperdb checks setuid/setgid programs and folders and will notify you of any changes
    as well as restricting access to them if any changes are made, it''s available
    for download from: http://www.resent.org/projects/viperdb/.


    # Pikt


    Pikt is covered in the previous section and can be used to monitor user activity.
    I would recommend it for large installations as it is extremely flexible and powerful.
    Pikt is available at: http://pikt.uchicago.edu/pikt/


    # DTK


    The Deception ToolKit is a set of programs that emulate well known services in
    order to provide a false set of readings to attackers. The hope is to confuse
    and slow down attackers by leading them to false conclusions, you can download
    DTK from: http://all.net/dtk/'
