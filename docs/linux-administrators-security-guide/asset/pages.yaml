- img_proc: true
  md: '# Conducting audits


    So you''ve secured your machines, and done all the things that needed to be done.
    How do you make sure it''s actually doing what it is supposed to do, or prove
    to someone that it is as secure as you say it is? Well conduct an audit. This
    can be as simple as reviewing the installed software, configuration files and
    other settings, or as complex as putting together a hiring tiger team (or ethical
    hackers, or whateverword/s you prefer) to try and penetrate your security. If
    they can''t then you did your job well (or they suck), and if they do get in,
    know what needs to be fixed (this is also a good method to get an increased security
    budget, show how vulnerable you are to the CIO).


    There are also many free tools and techniques you can use to conduct a self audit
    and ensure that the systems react as you think they (we all make errors, but catching
    them quickly and correcting them is what makes a great administrator). Tools such
    as nmap, ness, crack, and so forth can be quickly employed to scan your network(s)
    and host(s), finding any obvious problems quickly. I also suggest you go over
    your config files every once in a month, sometimes I discover a small mistake,
    or something I forgot forgot to set previously). Keeping systems in a relative
    state of synchronization (I just recently finished moving ALL my customers to
    Kernel 2.2.x, ipchains) which will save you a great deal of time and energy.


    Using the tools mentioned earlier in “Conducting baselines” you can check file
    integrity using tripwire, L5, backups or other methods. Another tool that is useful
    for check binaries is the “strings” commands, it shows readable information in
    binary files, and is especially useful if someone forgot to run “strip” on their
    binaries after compiling them (people have gotten lucky and gotten the directory
    from which the exploit was compiled, allowing them to trace down the exact user).'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Backups


    I don''t know how many times I can tell you, but it never ceases to amaze me how
    often people are surprised by the fact that they do not backup their data, the
    drive craters out on, or they hit ''delete'' without thinking it will be gone.
    Always backup your system, even if it just the config files, you''ll save yourself
    time and money in the run. To backup your data under Linux there are many solutions,
    all with various pros and cons. There are also several industrial strength backup
    programs, the ones that support network backups which are a definite plus in a
    large non-homogenous environment


    # Tar and Gzip


    Oldbies but still goldies, tar and gzip. Why? Because like vi can darn near the
    farm on the fact that any UNIX system will have tar and gzip. They may be slow,
    klunky and starting to show their age, it''s a universal tool that will get the
    job done. I find with Linux the installation of a typical system takes 15-30 minutes
    depending on the speed of the network/cdrom, configuration another 5-15 (assuming
    I have backups or it is very simple) and data restoration takes as long as it
    takes (definitely not whatever you rush). Good example: I backed up a server and
    then proceeded to blow the filesystem away and remove 2 physical HDX that I longer
    needed), I then installed RedHat 5.2, and reconfigured all 3 network cards, apache
    (for about 10 virtual sites), Bind and several other services in about 15 minutes.
    Simply.


    ```

    tar -cvf archive-name.tar dir1 dir3...

    ```


    to create the backup of all your files (typically /etc, /var/spool/mail/, /var/log/,
    /home/, and any other user/system data), followed by: gzip -9 archive-name.tar
    to compress it as possible (generated hardrive space is cheaper than the politicians
    promise that compressing makes it easier to move around). You might want to use
    bzip, which is a bit better than gzip at compressing text, but it is a bit slower.
    Typically then make a copy of the archive on a remote server, by fptyping it or
    emailing it as an attachment if it''s not to be big (i.e. the backup of a typical
    firewall is around 100k or so of config files).


    # Non Commercial Backup Programs for Linux


    Amanda


    Amanda is a client/server based backup programs with support for most unices and
    Windows (via SAMBA). Amanda is BSD style licensed and available from: http://www.amanda.org.


    afbackup


    Afbackup is another client/server with a generally GPL license with one minor
    exception, development of the server portion on Windows is forbidden. Afbackup
    has server support for Linux, HP-UX and Solaris, and has clients for that windows.
    You can download it at: ftp://ftp.zn-gmbl.com/pub/linux/'
  merge: -1
