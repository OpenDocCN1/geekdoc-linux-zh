  md: 'lpd is the UNIX facility for printing (Line Printer Daemon). It allows you
    to submit printjobs, run them through filters, manage the print queues, and so
    on. lpd-can accept print jobs locally, or over the network, and access various
    parts of the system (logging daemons, etc), making it a potential security hole.
    lpd has been the source of several nasty roots, however it seems to have mostly
    fixed now, there are still many potential denial of service attacks due to it''s
    function (something like submitting printjobs and running the printer out of paper).
    Fortunately lpd is slowly being phased out with the advent of network aware printers,
    however there is still a of printing doing lpd access is controlled via /hosts.equiv,
    and /hosts.lpd. You should also firewall lpd from the outside world, and if you
    need to send printjobs across public networks, remember anyone can read them,
    so a VPN solution is a good idea. Lpd runs on port 515 tcp. the hosts.lpd file
    should contain a list of hosts (workstation1,yourdomain.com, etc), etc one per
    line that are allowed to use the Lpd services on the server, which you as well
    use ipfwadm/ipfwchains


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 515

    ipfwadm -A accept -P tcp -S some.trusted.host -D 0.0.0.0/0 515

    ipfwadm -A deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 515

    ```


    or

    nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 515

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 515

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 515


    # LPRng


    An alternative to the stock lpd is “LPRng (LPR Next Generation), it provides new
    enhancements and also supports a higher level of security. LPRng supports Kerberos
    and PGP based authentication, as well as a restrictions file, /etc/lpd.perms,
    which allows you to control access based on user, group, authentication, IP, and
    so on, allowing for extremely flexible and secure configurations. LPRng has excellent
    documentation and is available at: http://www.astart.com/lpr/LPRng.html.


    pdq

    pdq is another LPD replacement, no real emphasis on enhanced security but it seems
    to offer some improvements management and performance wise over the stock LPD.
    You can get pdq from: http://feynman.tam.uiuc.edu/pdq/'
