  md: '# RSH, REXEC, RCP


    R services such as rsh, rcp, rexec and so forth are very insecure. There is simply
    no other way to state it. Their basis of security is based on the hostname/IP
    address of the machine connecting, which can easily be spoofed, or using techniques
    such as DNS poisoning compromised. By default they are not all disabled, please
    do so immediately. Edit /etc/inetd.conf and look for rexec rsh and so on, and
    comment them out, followed by a `killall -1 inetd` to restart inetd.


    If you absolutely must run these services using tcp_wrappers to restrict access,
    it''s not much but that it will help. Also make sure your firewall them as tcp_wrappers
    will allow an attacker to see that they are running, which might result in a spoofed
    attack, something tcp_wrappers cannot defend against if done properly. Access
    to the R services is controlled via hosts files, usually each user has their own
    hosts file, unfortunately this is susceptible to packet spoofing. The problem
    with r services is also that once there is a minor security breach that can be
    used to modify files, editing a users (like root''s) root file makes it very easy
    to crack a system wide open.


    If you need remote administration tools that are easy to use and similar to rsh/etc
    I would recommend nsh (Network SHeLL) or SSH, they both support encryption, and
    a much higher level of security. Alternatively using VPN software will reduce
    some of the risk as you can deny packet spofers the chance to compromise your
    system(s) (part of IPSec is authentication of sender and source, which is almost
    more important then encrypting the data in some cases).'
  merge: -1
  pgno: 58
