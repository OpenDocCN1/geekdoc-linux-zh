    chmod (CHangeMODe) changes file attributes, the basics being read, write and execute,
    as well there is setuid (set user and group id the program is run as the ones
    that it, often times root), sticky bit and so. With proper use of assigning users
    to groups, chmod and you can emulate ACL’s to a degree, but it is far less flexible
