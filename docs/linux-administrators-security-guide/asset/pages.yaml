  md: 'CVS allows multiple developers to work together on source code projects and
    maintain

    large code base in a somewhat sane manner. CVS''s internal security mechanisms
    are rather

    simple (and some would say weak) on their own, and I would have to agree. CVS''s

    authentication is typically achieved over the network using pserver, usernames
    are sent in

    clear text, and passwords are trivially hashed (no security reality). To get around
    this you have

    several good options. In a Unix environment probably the simplest method is to
    use SSH to

    tunnel connections between the client and the server, "Time Wemaster" (Tim

    Hemel) has written an excellent page covering that I would not bother to refresh,
    and it is

    available at: http://cubic.xa4.nl/~cvs/. A somewhat more complicated (but

    better in the long run for large installations) is to kerberize the CVS server
    and clients,

    type large networks (especially in university environments) already have an established

    Kerberos infrastructure. On kerberizing the CVS are already available at:

    http://www.cyclic.com/cyclic-pages/security.html. Apart from that I would strongly
    urge

    firewall CVS unless you are using it for some public purpose (such as an open
    source

    project across the Internet).


    Another tool for securing CVS that just appeared is "cvsd", a wrapper for pserver

    chroot''s and/or suid to a harmless user, cvsd is available at:

    http://chblack.mokey.com/cvsd/ in rpm format and a source tarball.


    There are other obvious concerns you should be aware of, when dealing with source
    code

    you should be to ensure no Trojan horses or backdoors are replaced. In an open
    source

    project this is relatively simple, review the code people submit, especially if
    it is a publicly

    accessible effort, make sure you have back ups. CVS uses port 2401, tcp.


    ```

    ipfwadim -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 2401

    ipfwadim -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 2401

    ipfwadim -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 2401

    ```


    or


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 2401

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 2401

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 2401

    ```'
  merge: -1
  pgno: 93
