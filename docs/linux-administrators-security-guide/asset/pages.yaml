  md: '# Log files and other forms of monitoring


    One integral part of any UNIX system is the majority of logging in Linux is provided
    by two main programs, syslog and klogd, the first providing logging services to
    programs and applications, the second providing logging capability to the Linux
    kernel. Kernel actually sends messages to syslog facility but will on occasion
    pop messages at the console (i.e. kernel panics). Syslog handles the task of processing
    messages and sending them to the appropriate file or device, this is configured
    within /etc/syslog.conf. By default logging to files takes place in /var/log/,
    and generally programs that handle their own logging (such as apache) log to /var/log/proname/;
    this centralizes the logs and makes it easier to place them on a separate partition
    (some attacks can fill your logs quite quickly, and a full /partition is no fun).
    Additionally there are programs that have their own internal logging, one of the
    most interesting being the bash command shell. By default bash keeps a history
    of file commands executed in ~username/.bash_history, this file can make for extremely
    interesting reading, as oftentimes many admins will accidentally type their passwords
    at the command line. Apache handles all of its logging inline, configurable from
    http.conf and extremely flexible with the release of Apache 1.3.6 (it supports
    conditional). Sendmail handles its logging via syslog but also has the option
    (via the command -X switch) of logging all SMTP transactions straight to a file.
    This will grow enormous in a short span of time, but useful for debugging. See
    the sections in network security on apache and sendmail for more information.


    # syslog /kld


    In a nutshell klog handles kernel examples, depending on your setup this can range
    from almost none to a great deal if you turn on process accounting. It passes
    most messages to syslog for actual handling, it placement in the log: many pages
    for syslog, syslog.conf are pretty good with clear examples. One exceedingly powerful
    and often overlooked ability of syslog is to log messages to a remote host running
    Since you can define multiple locations for syslog messages (i.e. send all messages
    to /var/log/messages file, to console, and to a remote host or multiple hosts)
    this allows you to centralize logging to a single host and easily check log files
    for security violations and other strangeness. There are several problems with
    syslog andlog however, the primary ones being the ease of which one an attacker
    has gained root access to deleting/modifying log files, there is no authentication
