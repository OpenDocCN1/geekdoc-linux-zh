  md: 'Mason is an automated firewall generator for ipfwadm and ipchains. You load
    it up and it monitors the packets flowing through the machine, then based on that
    creates a set of rules to allow that type of access. A good tool for first time
    firewall admins, available from: http://users.dhp.com/~whisper/mason/


    firewall.sh


    A dialog based script that walks you through creation of firewall rules, nicely
    done and good for new users or admins with RSI, available from: http://devplanet.fastethernet.net/


    Mklinuxfw


    Mklinuxfw is a perl tool that aims to provide a variety of interfaces (CGI, KDE,
    command line, etc.) to creation of firewall rules. It currently supports a CGI
    interface and GTK is in progress. You can download it from: http://www.madhouse.org.uk/~red/framepage.shtml?mklinuxfw/index.html.'
