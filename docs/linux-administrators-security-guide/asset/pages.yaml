  md: '# FTP


    WuFTPD


    FTP used to be the most used protocol on the Internet by sheer data traffic until
    it was surpassed by HTTP a few years ago (yes, there was a WWW Internet once upon
    a time). FTP does one thing, and it does well, transferring of files between systems
    (well that’s not entirely true, for mirroring of all rsync beats the socks off
    ftp). The protocol itself is insecure, passwords, data, etc is transferred in
    cleartext and can be easily sniffed, however most usage is ‘anonymous’, so this
    isn’t huge problem. One the main problems typically encountered with ftp sites
    is improper permissions on directories that allow people to use the site to distribute
    their own data (typically copyrighted material, etc). Again as with telnet you
    should use an account for fitting that is not used for administrative work since
    the password will be flying around the network in clear text.

    Problems with ftp in general:


    +   * Clear text authentication, username and password.

    * Clear text of all commands.

    * Password guessing attacks (minimal, will end up in the log files)

    * Improper server setup and consequent abused of privileges

    * Nearly nasty Denial of Service attacks still exist in Wu-FTPD


    Securing FTP isn''t to bad, by firewalling and tcp-wrappers you can restrict access
    based on IP address / hostname quite well. In adaption runs chooted by default
    logging in as anonymous, or an account defined guest. With some amount of work
    you can set all users that are fitting to be chooted to say their home directory.
    You can also run an ftp daemon that encrypts the data (such as the SSL add on
    package/etc) however this means your ftp clients must speak the encryption protocol
    and this isn''t always to practical.

    Also make sure you have publicly accessible directories on your ftp server that
    are both readable and writable, otherwise people will exploit it to distribute
    their own stuff (typically ware or porn).

    An example of firewall rules:


    ```

    ipfwadm -I -a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/21

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/21

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/21

    ```


    or


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/21

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/21

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/21

    ```


    An example of the same using tcp_wrappers:

    In /etc/hosts.allow

    inftpd: 10.0.0.0/255.0.0.0, some.trusted.host


    And in /etc/hosts.deny

    inftpd: ALL'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'There are several encrypted alternatives to ftp as mentioned before, SSLeay
    FTP, and third party utils. Since most ftp accounts are not used as admin accounts
    (BAD IDEA!), and hopefully run chrooted, the security risk is minimized. That
    now have fully covered all the network parts of ftp, lets over securing the accounts
    and environment. The main mechanism for user security in ftp is the use of chroot.
    For default all people logging in as anonymous have /home/ftp/ as their ''root''.
    They cannot get out of this and look at the contents of /home/or/etc/. The same
    can be applied to groups of users and individuals, for example you could set all
    users to be chrooted/home/ when they ftp, or in extreme cases of user privacy
    (on a www server hosting multiple domains) each user chrooted to within their
    own home directory. This is accomplished through the use of /etc/ftpass (man ftp
    has access). I will give a few examples of what needs to be done to accomplish
    this since it can be confusing at first. As well checks /etc/ftpassusers and if
    the user updating is listed in that file (like root should be) it will not let
    the user login via ftp.


    To roost users as login into the ftp server is rather simple, but poorly documented.
    The ftp server chroot checkpass for ''guestgroup'', which are simply ''guestgroup
    some-group-onset-system'' i. ''guestgroup'' and the groupname needs to be defined
    in /etc/group and have members added. As you well need to edit their password
    file line so that the ftp server knows where to dump. And since they are now chrooted
    into that directory of system, they do not have access to /etc so you must copy
    many files into their dir like is to work properly (always a nice touch).


    Setting up a billybob/ (because he keeps threatening to take the sysadmin possum
    hunting). In addition to this billybob can telnet in and change his password,
    but nothing else because he keeps trying to run irc on the system. The system
    is on shadowed passwords, so that''s why there is an ''x'' in billybob''s password
    field.


    First off billybob needs a properly setup user account:

    billybob:500:500:Billy Bob:/home/billybob:/bin/passwd


    this means that the ftp will chroot into /home/billybob/ and chdir into what is
    now /home/billybob/ to the rest of us. The ftpass man file covers this bit ok,
    and of course /usr/sbin/passwd needs to be listed in /etc/shells


    Secondly for the ftp server to know that he is being chrooted to be a member of
    a group (baddusers, ftpeople, etc) that is defined in /etc/group. And then that
    group must be listed in /etc/ftpass.


    Now you need to copy some libs/binaries otherwise billybob won''t be able to do
    a lot what he has etched in. The files needed are available as packages (usually
    "anonftp"), once this is installed the files will be copied to /home/ftp/, you
    will notice there is an /etc/passwd, this is simply means to map UID''s to users,
    if you want billybob to be his username and not ID, add a line for him (i copy
    his from the real /etc/passwd to this one). The same applies to the group file.


    withoutbillybob*:500:500::" in /home/billybob/etc/passwd:

    drwxrxr-x 2 500 500 1024 Jul 14 20:46 billybob'
