  md: 'SNMP (Simple Network Management Protocol) was designed to let heterogeneous
    systems and equipment talk to each other, report data and allow modifications
    to there settings over a TCP-IP network. For example an SNMP enabled device (such
    as a Cisco router) can be monitored/configured from an SNMP client, and you can
    easily write scripts to alert you if denied packets/seconds rise above 20. Unfortunately
    SNMP has no security built into it. SNMPv1, originally proposed in RFC 1157 (May
    1990) and section 8 (Security Considerations) reads truly: "Security are not discussed
    in this memo." I think that sums it up. In 1992/1993 SNMPv2 was released, and
    did contain security considerations these security considerations were dropped
    later on when they were shown to be completely broken. We end up with SNMPv2 and
    no security. The only way to protect your SNMP devices consists of setting the
    community name to something hard (but it is very easy to sniff the wire and find
    the name), and firewall/firewall SNMP so that the only hosts that need to talk
    to each other can (leaves you to spoofing). Brute force community attacks are
    easy to do and easily, and there are several tools specifically for monitoring
    SNMP transmissions and cracking an SNMP community, it is pretty dangerous world
    out there. These risks are slightly mitigated by the useless of SNMP, if properly
    supported and implemented it can make network administration significantly easier.
    In almost every SNMP the default community name is "public" (which is bad for
    Linux, NT, etc.), you must change this. Once a person has your community name
    they can conduct an "snmpwalk" and take over your network. SNMP runs over UDP
    ports on 161 and 162, block this at all entrances to your network (the backbone,
    the dialup pool, etc.). If a segment of network does not have SNMP enabled devices
    or an SNMP console you should block SNMP to and from that network. This is your
    only real line of defense with SNMP. The additional use of IPsec (or other VPN
    software) can greatly reduce the risk from sniffing. The RFCs for SNMPv3 go ever
    extensively (especially RFC 2274, Jan 1998) so there is hope for the future. If
    you are purchasing now SNMP-enabled products make sure they are using SNMPv3,
    as you then have a chance at real security.


    There are no specific problems with cu-sumpd se, apart from the general SNMP problems
    I covered. The cu-snap tools and utilities only use SNMPv1 and SNMPv2, so remember
    to be careful when using them on across untrusted networks as your main line of
    security (the community name) will be out of option for anyone to see.


    ```

    ipfwadm -I a accept -P udp -S 10.0.0.0/8 -D 0.0.0.0/0 161:162

    ipipfwadm -I a accept -P udp -S some.trusted.host -d 0.0.0.0/0 161:162

    ipfwadm -I a deny -P udp -S 10.0.0.0/8 -D 0.0.0.0/0 161:162

    ```


    or


    ```

    ipchains -A input -p udp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0

    ipchains -A input -p udp -j ACCEPT -s some some.trusted.host -d 0.0.0.0/0

    161:162

    ipchains -A input -p udp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 161:162

    ```'
