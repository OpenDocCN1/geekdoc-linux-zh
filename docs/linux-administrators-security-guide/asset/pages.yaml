  md: '# DHCPD


    DHCPD is something all network admins should use. It allows you to serve information
    to clients requesting their network settings/etc, meaning that the client setup
    needed for networking is leaving the defaults and turning the machine on. It also
    allows you to reconfigure clients easily (say move from 10.0.1.0 to 10.0.2.0,
    or a new set of DNS servers). In the long run (and short run ever) DHCP will save
    you amounts of work, money and stress. I run it at home with only 8 clients and
    found life to be much easier. DHCPD is maintained by the ISC and is at: http://www.isc.org/dhcp.html.


    I highly recommend you run DHCPD 2.x (3x is in alpha stages), it''s a lot of new
    features, and it is easy to setup and work with. The absolute version(s) of this
    tend to be a bit neurotic however, warned it is beta software. Definitely fairly
    DHCPD off from the Internet. DHCP traffic should only be on local segments, possibly
    forwarded to a DHCP server on another segment, but the only DHCP traffic you would
    see coming over the Internet would be an attack/DoS (they might recover all your
    IPs, leaving your clients high and dry). If you are forwarding DHCP traffic over
    the Internet, DONT. This is a bad idea for a variety of reasons (primarily performance
    / reliability, security as well).


    I recommend the DHCP server be only a DHCP server, locked up somewhere (if you
    rely on DHCP for your network and the DHCP server fails your network is in serious
    trouble), allowed to do it quickly, if you need to span subnets (if you have multiple
    servers, only one of which has a DHCP server physically connected to it) use a
    DHCP relay (NT has no built-in, the DHCP software for Linux has the capability,
    etc.). There are also known problems with NT and DHCP, NT RAS has a nasty habit
    of sucking up IP addresses like crazy (I have seen an NT server grab 64 and keep
    them indefinitely), because it is trying to reserve RAS IPs for the clients that
    will be dialing in/out. Either turn NT''s RAS off, or put it on it''s own subnet,
    the MAC address it sends to the DHCP server is very strange (and spells out RAS
    in the first few bytes) and is not easy to map out.

    ing DHCPD


    DHCPD consists of 2 executables:


    +   - dhcpd - the DHCP

    - dhrelay - a DHCP relay (to relay requests to a central DHCP server since DHCP
    is based on broadcasts, which typically don''t (and shouldn''t) spawn routers/ethers.


    DHCPD requires 2 libraries:


    +   - /lib/dhcp-linux.so.2

    - /lib/libc.so.6


    A config file:


    +   - /etc/dhcpd.conf - configuration info, location of boot files, etc.


    And a few other misc. files:


    +   - /etc/dhcpd.leases - a list of active leases

    - a startup file, you can modify only the one it comes with your own'
  merge: -1
  pgno: 80
