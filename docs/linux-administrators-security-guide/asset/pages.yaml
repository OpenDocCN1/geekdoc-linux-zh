  md: '# Firewalling


    Firewalling is the practice of filtering TCP-IP traffic, typically at the point
    where your network connects to another (i.e. the Internet, a customers LAN or
    other network), that may be untrusted (like the case of the Internet) or perhaps
    even trusted (another floor of your building). Like firewalls in a large building,
    a network firewall can prevent and even block the spread of an attack.


    Linux has firewalling capacity for a while now in the form of ipfwmad, which was
    a very simplistic packet level filter, but quite effective and enough for most
    people. With the advent of kernel 2.1+ this has been replaced with ipchains which
    is quite a bit more sophisticated. Both are still basic packet filters however
    do not allow for advanced features such as stateful inspection or some types of
    proxy connections, however Linux supports IPMAS, an advanced form of NAT (Network
    Address Translation). IPMAS allows you to hook a network of computers to the Internet,
    but proxy their connections at the packet level, thus all traffic appears to be
    coming and going to one machine (the Linux IPMAS box), which affords a high degree
    of protection to the internal network. As an added bonus the connections on internal
    network require no proxy configuration, as long as the Linux IPMAS server is configured
    correctly will work well.


    Both ipchains and ipfwmad provide the following basic capabilities:


    +   - blocking / allowing data to pass based on IP/port/interface source / destination
    masquerading of connections, based on IP/port/interface source / destination


    In addition to ipchains supports:


    +   - port forwarding

    - creation of chains, for more intricate rules and conditions, easier to maintain

    - quality of service (QoS) routing, using on slow connections or otherwise saturated
    connections

    - specification of IP/port/interface as well as inverse specification (using the
    !)


    The Firewall-HOWTO and "man <command>" (ipchains or ipfwmad) page cover in great
    detail the mechanics of setting up rules, but not really cover the strategy for
    firewalling safety. Your first choice is whether to go with default or deny all
    policies, followed by which services and hosts you wish to allow and block.


    When you decide you choose a policy that will default to denying everything unless
    specifically allowed (that is if there is a failure it will hopefully be minimized
    via default policies) or a policy that allows and blocks certain services/hosts.
    I typically use a policy of default denial as it can accommodate mistakes and
    make more safely than a policy that allows data through. Case in point, if you
    have a server secured via firewall, currently running apache, you install WU-FTPD
    for it internal use (so people can upload files) at 3 am, you forget to change
    the firewall rules. If you have chosen a policy of default allow anyone on the
    Internet can access the ftp server, and silly you, installed an old version which
    allowed someone to compromise the machine. If one'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'the other hand you go with a policy of default denial they would not have access
    to the ftp server, and would not notify your users, but you would find out quite
    quickly.


    I have decided not to cover specific firewalling rules in this section, for each
    network service I will provide examples, as to properly firewall a protocol you
    need to understand how it behaves. There is a huge difference between firewalling
    web and ftp for inbound and outbound access for example. Some general concepts/rules:


    # IPFWADM


    Ipfwadam is a solid packet filter for Linux, although it lacks a lot of features
    available in Ipchains. It only supports targets for a packet, accept deny or reject,
    whereas ipchains rules can be targeted at 6 built units, or a user defined target.
    Ipfwadam is really only appropriate for a IP level firewall, ipmasquerading and
    if you plan to use FreeSW(which currently does not support kernel 2.2.x). The
    basic options are: specify a direction (in or out, with the interface flag), input
    rules, output rules, rules (you may have multiple interfaces, also covers masquerading
    rules) and masquerade rules which control timeouts). You can insert, append and
    delete rules, set default policies, and list all the rules, unlike ipchains you
    only have the 3 targets (ACCEPT, DENY, REJECT). Other than it is very similar
    to ipchains, with minor variations. The following is a script appropriate for
    a server bridging 2 networks (10.0.0.x on eth0, 10.0.0.1 and 192.168.0.1 on eth1)
    with a mail server running.


    ```

    #!/bin/bash

    # Flush all the rule sets first

    #\ipfwadam -I

    ipfwadam -f -O

    ipfwadam -F

    ```


    > # Allow forwarding between the two networks and otherwise deny it for security


    ```

    ipfwadam -F -a accept -P all -S 10.0.0.0/24 -i eth0 -D 192.168.0/24

    ipfwadam -F -a accept -P all -S 192.168.0/24 -i eth1 -D 10.0.0.0/24

    ipfwadam -F -P deny

    ```


    > # And of course we have to allow those packets in


    ```

    ipfwadam -I -a accept -P tcp -S 10.0.0.0/24 -i eth0 -D 192.168.0/24

    ipfwadam -I -a accept -P tcp -S 192.168.0/24 -i eth1 -D 10.0.0.0/24

    ipfwadam -I -P deny

    ```


    > # Let them access the mail server port on the server but nothing else


    ```

    ipfwadam -I -a accept -P tcp -S 10.0.0.0/24 -i eth0 -D 10.0.0.1 25

    ipfwadam -I -a accept -P tcp -S 192.168.0/24 -i eth0 -D 192.168.0.1 25

    ipfwadam -I -P deny

    ```


    There is not time you should choose ipfwadam over ipchains, Free/WAN now supports
    the 2.2.x series of kernels.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# IPCHAINS


    Several new things in IPCHAINS, you can create chains of rules (hence the name)
    and link them together, making administration of firewalls easier. Ipchains supports
    more targets than iptwd, you can point a rule at: ACCEPT, DENY, REJECT, MASQ,
    REDIRECT, or RETURN a defined chain. As such is very powerful, I could redirect
    packets for port 80 (i.e. any traffic) going through my gateway machine to local
    port 3128, the squid proxy. You can also use this in conjunction with quality
    of service routing, the example given in ipchains is that of prioritizing traffic
    over a PPP link, you can get telnet traffic to a much higher priority than then
    ftp, reducing latency problems caused by a saturated link. Typically I create
    an /etc/rc.d/ipchains-sh (or wherever appropriate) and call it immediately after
    the network is brought up, which is such a small time in which the server is vulnerable,
    by miserably so no network daemons are running. The following script is appropriate
    for a gateway with 2 interfaces running, the reason I have used the DENY instead
    of REJECT target is that the packet is dropped and not responded to in any way,
    this slows down network scans (as they wait for packet timeout instead of receiving
    a response) and gives away less information. I would also advise logging data
    unless you have a significant amount of drive space available, for each packet
    I send (several bytes) many drive space is used to create a log, making it easy
    to overwhelm syslog andor your drive on a fast connection. The ipchains homepage
    is at:

    ://www.rustcorp.com/linux/ipchains/


    ```

    #!/bin/bash

    #

    # This script sets up firewall rules for a server with 2 interfaces

    # running as a gateway

    # This script needs to be edited if you plan to use it.

    # We assume the internal machines call all talk to the gateway, so no rules block

    # internal traffic

    #

    # A couple of variables

    # ETH0 is the IP address on ETH0 (the external interface)

    # ETHONET is the network

    # ETHETMASK is the network mask

    # TRUSTEDHOST1 is a trusted host (for webmin/ssh)

    # TRUSTEDHOST2 is a trusted host (for webmin/ssh)

    # ETH1IP is the IP address on ETH1 (internal interface)

    # ETHONET is the network

    # ETHETMASK is the network mask

    #

    ETHIP=1.1.1.1

    ETHONET=1.1.1.0

    ETHMASK=24

    TRUSTEDHOST1=1.5.1.1

    TRUSTEDHOST2=1.5.1.2

    ETH1IP=10.0.0.1

    ETHONET=10.0.0.0

    ETHMASK=24

    #

    PATH=/sbin

    # FLUSH ALL RULES

    ```'
