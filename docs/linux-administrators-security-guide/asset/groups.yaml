  - '[PAGE 111]


    Mason is an automated firewall generator for ipfwadm and ipchains. You load it
    up and it monitors the packets flowing through the machine, then based on that
    creates a set of rules to allow that type of access. A good tool for first time
    firewall admins, available from: http://users.dhp.com/~whisper/mason/


    firewall.sh


    A dialog based script that walks you through creation of firewall rules, nicely
    done and good for new users or admins with RSI, available from: http://devplanet.fastethernet.net/


    Mklinuxfw


    Mklinuxfw is a perl tool that aims to provide a variety of interfaces (CGI, KDE,
    command line, etc.) to creation of firewall rules. It currently supports a CGI
    interface and GTK is in progress. You can download it from: http://www.madhouse.org.uk/~red/framepage.shtml?mklinuxfw/index.html.'
  - '[PAGE 112]


    # Scanning / intrusion testing tools


    Over the last few years the number of security tools for Windows and UNIX has
    risen dramatically, ever more surprising is the fact that most of them are freely
    available on the Internet. I will only cover the free tools since most of the
    commercial tools are ridiculously expensive, are not open source, and in many
    cases have been shown to contain major security flaws (like storing passwords
    in clear text after installation). If any case serious cracker/hacker have these
    tools at their disposal, why shouldn''t you?


    There are several main categories of tools, once that scan from within that host,
    one that scan other hosts and report back what OS they are running (using a technique
    called TCP-IP fingerprinting), services that are available and so on, at the top
    of the food chain are intrusion tools that actually attempt to execute exploits,
    and report back if they worked or not, lastly I include the exploits category,
    while not strictly an intrusion tool per se they exist and you should be aware
    of them.


    # Host scanners


    Cops


    Cops is extremely obsolete and its original home at CERT''s ftp site is gone.


    Tiger


    Tiger is obsolete but I thought I''d mention it for historical accuracy, Texas
    Agricultural and Mechanical University used to require that a UNIX host pass tiger
    before it was allowed to connect to the network from offsite. You can get it from:
    ftp://net.tamu.edu/pub/security/TAMU/


    SBScan


    SBScan is an up and coming host scanner, it looks for a variety of problems such
    as bad files, open ports, passwordless accounts, and scans the network for other
    types of naughtiness. SBScan is available from: http://sy.tx.org/


    check.pl


    check.pl is a nice perl program that checks file and directories, and will tell
    you about any suspicious or ''bad'' ones (setuid, setgid, writeable directories,
    etc). Very useful but it tends to find a lot of false positives. It''s available
    at: http://opop.nols.com/proggie.html.


    # Network scanners


    Strobe


    Strobe is one of the older port scanning tools, simply it attempts to connect
    to various ports on a machine(s) and reports back the result (if any). It is simple
    to use and very fast, but doesn''t have any of the features newer port scanners.
    Strobe is available for almost all distributions as part of it, or as a contrib
    package, the source is available at: ftp://suburbia.net/pub/'
  - '[PAGE 113]


    # Nmap


    Nmap is a newer and much more featured hosting tool. It features advanced techniques
    such as TCP-IP fingerprinting, a method by which the returned TCP-IP packets are
    examined and the host OS is deduced based on quirks present in all TCP-IP stacks.
    Nmap also supports a number of scanning methods, from normal TCP scans (simply
    trying to open a connection) to stealth scanning and half open SYN scans (for
    crashing unstable TCP-IP stacks). This is arguably one of the best port scanning
    programs available, commercial or otherwise. Nmap is available at: http://www.insecure.org/nmap/index.html.


    # MNS


    http://www.thegrid.net/gravitino/products.html


    Bronc Buster vs. Michael Jackson


    http://www.thegrid.net/gravitino/products.html


    Leet scanner


    http://www.thegrid.net/gravitino/products.html


    Soup scanner


    http://www.thegrid.net/gravitino/products.html


    Portscanner


    Portscanner is a nice little portscanner (surprise!), that has varying levels
    of outputs making it easy to use in scripts, and by humans. It''s opensource and
    free to use, you can get it at: http://www.ameth.org/~veilleux/portscan.html.


    # Intrusion Scanners


    Nessus


    Nessus is relatively new, but is fast shaping up to the best intrusion scanning
    tool. It has a client/server architecture, the server currently runs on Linux,
    and clients are available for Linux, Windows and there is a Java client. Communication
    between the server and client is ciphered for added security, all in a very slick
    piece of code. Nessus supports port scanning, and attacking, based on IP addresses
    or host name(s). It can also search network DNS information and attack related
    hosts at your guest. Nessus is relatively slow in attack mode, which is hardly
    surprising, but it currently has over 200 attacks, and a plug in language so you
    can write your own. Nessus is available from http://www.nessus.org/.


    Saint'
  - '[PAGE 114]


    Saint is a sequel to Satan, a network security scanner made (in)famous by the
    media a few years ago (there were great worries that bad people would take the
    Internet using it). Saint also uses a client/server architecture, but uses a www
    interface instead of a client program. Saint produces very easy to read and understand
    output, with security problems graded by priority (although not always correctly),
    and also supports adding in scanning modules making it very flexible. Saint is
    available from: http://www.wdsi.com/saint/


    # Cheops


    While not a scanner per se, Cheops is a "network neighborhood" on steroids, it
    builds a picture of a domain, or IP block, what hosts are running and so on. It
    is extremely useful for preparing an initial scan as you can locate items (HP
    printers, Ascender routers, etc) quickly. Cheops is available at: http://www.marko.net/cheops/


    # Fpcheck / Relaycheck


    Two simple utilities that scan for ftp servers and mail servers that allow relaying,
    good for keeping tabs on naughty users they shouldn''t (or simply misconfiguring
    them), available from: http://david.weekly.org/code/


    # SARA


    Security Auditor''s Research Assistant (SARA) is a tool similar in function to
    SATAN and Saint. SARA supports multiple threads for faster scans, it stores''s
    data in a database for ease of access and generates nice HTML reports. SARA is
    free for use and is available from: http://home.arc.com/sara/


    # Firewall scanners


    # Firewalk


    Firewalk is a program that uses a traceroute style of packets to scan a firewall
    and attempt to reduce the time in place on that firewall. By sending out packets
    with various time to lives and seeing where they are refused a firewall can be
    tricked into revealing rules. There is no real defense against silently denying
    packets instead of sending a rejection message that hopefully will reveal. I would
    advise utilizing this tool against your systems as can help you tighten up security.
    Firewalk is available from: http://www.packetfactory.net/firewalk/


    # Exploits


    I won''t cover exploits specifically, since there are hundreds if not thousands
    of them floating around Linux. I will simply cover the main archive sites.


    http://www.rootshell.com/


    One of the primary archive sites for exploits, it has almost anything and everything,
    convenient search engine and generally complete exploits.'
  - '[PAGE 115]


    <!-- no content -->'
  - '[PAGE 116]


    # Scanning and intrusion detection tools


    If the last section has worried you should. There are many defenses, active and
    passive against those types of attacks. The best ways to combat network scans
    are keep software up to date, only run what is needed, and heavily restrict the
    rest through use of firewalls and other mechanisms. Luckily in Linux these tools
    are free and easily available, again I will only cover opensource tools, since
    the idea of a proprietary firewall/etc is rather worrying. The first line of defense
    should be a robust firewall, followed by packet filters on all Internet access
    machines, liberal use of TCP-WRAPPERS, logging and more importantly automated
    software to examine the logs for (it isfeasible for an administrator to read log
    files nowadays).


    # Logging Tools


    Port Sentry (beta)


    The third component of the Abacus suite, it detects and logs port scans, including
    stealthy scans (anything nmap can do it should detect). Port Sentry can be configured
    to block the offending machine (in my opinion a bad idea as it could be used for
    a denial of service attack on legitimate hosts), making completion of a port scan
    difficult. As this tool is beta I would recommend against it, with however some
    age it should mature into a solid and useful tool. Port Sentry is available at:
    http://www.psionic.com/abacus/portsentry/


    # Host based detection attack


    Firewalling


    Most firewalls support logging of data, and ipfwadm/ipchains are no exception,
    using the -l switch you get a syslog entry for every packet, and using automated
    filters (Perl is good for this) you can detect trends/hostile attacks and so on.
    Since most firewalls (UNIX based, and Cisco in any case) log via the syslog facility,
    you can centralize all your firewall packet logging on a single host (with a lot
    of harddrive space hopefully).


    # TCP-WRAPPERS


    Wi''s TCP-WRAPPERS allow you to restrict connections to various services based
    on IP address and so, but even more it allows you to configure a response, you
    can have it emulate, you finger the offending machine, and so on (with use however).
    TCP_WRAPPERS comes standard with most distributions and is available at: ftp/ftp.porcupine.org/pub/security/


    # Klaxon


    While mostly obsolete by TCP-WRAPPERS and firewall logging, klaxon can still be
    useful for detecting port scans/etc if you don''t want to totally lock down the
    machine. Klaxon is available at: ftp/ftp.eng.auburn.edu/pub/doug/


    Host Sentry (pre release software)'
- md: '

    While this software is not yet ready for mass consumption, I thought I would mention
    anyways as it is part of a larger project (The Abacus project, http://www.psionic.com/abacus/).
    Basically Host Sentry builds a profile of user accesses and then compares that
    to current activity in order to flag any suspicious activity. Host Sentry is available
    at: http://www.psionic.com/abacus/hostsentry.


    ## Pikt


    Pikt is an extremely interesting tool, it is actually more of a scripting language
    aimed at system administration than a simple program. Pikt allows you to do things
    such as killing off idle user processes, enforcing mail quotas, monitor the system
    for suspicious usage patterns (off hours, etc), and much more. About the only
    problem with Pikt will be a steep learning curve, as it uses its own scripting
    language, but ultimately I think mastering this language will pay off if you have
    many systems to administer (especially since Pikt runs on Solaris, Linux and FreeBSD
    currently). Pikt is available at: http://pikt.uchicago.edu/pikt/


    ## Network based attack detection


    ### NFR


    NFR (Network Flight Recorder) is much more than a packet sniffer, it actually
    logs data and in real time detects attacks, scans and so on. This is a very powerful
    tool and requires a significant investment of time, energy and machine power to
    run, but it is at the top of the food chain for detection. NFR is available at:
    http://www.nfr.com.


    ## Host monitoring tools


    Monitoring your server(s) and host(s) is important for a variety of reasons, from
    tracking down break-ins to legal requirements. Remember, an ounce of prevention
    is worth a pound of cure. There are a variety of monitoring tools available in
    the Logging section from syslog to audit (which allows you to audit users files,
    running programs, etc.). I strongly suggest you use them. As there are a number
    of more specific programs to monitor system status and prevent users from doing
    things they shouldn''t.


    ### bgcheck


    bgcheck runs in background and checks the process table for items that should
    be running (i.e. irc bots, password crackers, etc.). You can download it from:
    http://blue.dhs.org/bgcheck/.


    ### Sxid


    Sxid checks setuid and setgid for changes, generates MD5 signatures of the files
    and generally allows you to track any changes made. You can get it at: ftp://marcus.seva.net/pub/sxid/


    ### Viperdb


    Viperdb checks setuid/setgid programs and folders and will notify you of any changes
    as well as restricting access to them if any changes are made, it''s available
    for download from: http://www.resent.org/projects/viperdb/.


    ### Pikt


    Pikt is covered in the previous section and can be used to monitor user activity.
    I would recommend it for large installations as it is extremely flexible and powerful.
    Pikt is available at: http://pikt.uchicago.edu/pikt/


    ### DTK


    The Deception ToolKit is a set of programs that emulate well known services in
    order to provide a false set of readings to attackers. The hope is to confuse
    and slow down attackers by leading them to false conclusions, you can download
    DTK from: http://all.net/dtk/


    ## Packet sniffers


    Packet sniffing is the practice of capturing network data not destined for your
    machine, typically for the purpose of viewing confidential/sensitive traffic such
    as telnet sessions or people reading their email. Unfortunately there is no real
    way to detect a packet sniffer since it is a passive activity, by utilizing network
    switches and fiber optic backbones (which are very difficult to tap) you can minimize
    the threat.


    ### tcpdump


    The granddaddy of packet sniffers for Linux, this tool has existed as long as
    I can remember, and is of primary use for debugging network problems. It is not
    very configurable and lacks advanced features of newer packet sniffers, but it
    can be useful. Most distributions ship with tcpdump.


    ### sniffit


    My favorite packet sniffer, sniffit is very robust, nice filtering capabilities,
    will convert data payloads into ASCII text for reading (like telnet sessions),
    and even has a graphical mode (nice for monitoring overall activity/connections).
    Sniffit is available at: http://sniffit.rug.ac.be/sniffit/sniffit.html.


    ### Ethereal


    A nice looking network protocol analyzer (a.k.a. a souped sniffer), that has an
    interface very similar to NT''s network monitor, and always for easy viewing.
    Ethereal is available at: http://www.wireshark.org/ (Note: now Wireshark).


    ## Other sniffers


    - http://www.wireshark.org/

    - http://www.wincap.org/

    - http://www.tcpdump.org/

    - http://www.nmap.org/

    '
