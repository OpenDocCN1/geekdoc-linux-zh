    ipfw -I a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 25

    ipfw -I a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 25

    ipfw -I a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/0 25

