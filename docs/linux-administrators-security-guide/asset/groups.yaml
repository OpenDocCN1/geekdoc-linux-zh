  - '[PAGE 120]


    # Virii, Trojan Horses, Worms, and Social Engineering


    Linux is not susceptible to virii in the way that a Dos/Windows or Mac platform
    is. In UNIX security controls are a fundamental part of the operating system,
    things like not allowing users to write promiscuously to any location in memory
    that they choose to, something that Dos/Windows and the Mac allow. There be fair
    viruses for UNIX, however the only Linux one I have seen was "bliss", an uninstallation
    option ("--uninstall") and had to run as root to be effective. To quote an old
    Unix favorite "if you don''t know what an executable does, don''t run it as root."
    Worms are much more prevalent in the UNIX world, the first major occurrence being
    the Morris worm which exploited a vulnerability in sendmail. Current worms for
    Linux exploit broken versions of impad, sendmail, wu-FTTP and other daemons, the
    simplest fix is to keep up to date, and not make daemons unless necessary. These
    attacks can be very successful especially if they have a network(s) that are not
    up to date, but typically their effectiveness fades out as people upgrade their
    daemons. In general I would not specifically worry about these two items, and
    there is definitely no need to buy anti virus software for Linux.


    Social engineering on the other hand can be very effective, as no matter how many
    guards, security breaches and patches you apply, humans can provide a wonderfully
    weak link to exploit. Case in point:


    A customer bet I couldn''t crash his NT server (the bet was pizza and beer). The
    main problem in attacking his NT server I had no idea what it''s name or IP address
    was. Now I could have scanned the ISP''s network using tools like ntfstat, nbtstat
    and the look for lively names would have taken several hours and annoyed the ISP''s
    security officer (who I know well). The simplest solution was to ask the helpdesk.
    "Well you I shouldn''t be telling you this" and I was given his IP address after
    claiming I Needed to fix the server. One mangled ping packet after business hours
    and I got my free pizza and beer. "This is Bob from the IT department, we need
    to reinitialize all the accounts so change your password to "temporary". You get
    the idea. This is by far one of the difficult threats to protect against, the
    only real answer is user education, which doesn''t work very well (in point the
    Melissa macro virus, many users have been told not to open documents with macros
    they yet did).


    Worms have a long and proud tradition in the UNIX world, by exploiting security
    holes (generally very few exploit new/unknown holes), and replicating they can
    quickly mangle a network(s). There are several worms currently making their way
    around Linux machines, exploiting old Bind 4.x and old IMAP software, defeating
    them is as easy as keeping software up to date.


    Trojan horses are also popular, recently ftp.win.tk was known as the tcp_wrappers
    package (among others) was modified to allow passwords to an anonymous account.
    This was detected when someone checked the PGP signature of the package and found
    it was quite kosher. Moral of the story? Use software from trusted sites, and
    check the PGP signature(s).'
- md: '

    # Disinfection of virii / worms / trojans


    Back up your data, format and reinstall the system from known good media. Once
    an attacker has root on a Linux system they can literally do anything, from compromising
    gcc/egcs to leading increasing kernel modules at boot time. Do not run untrusted
    software as root. Check the PGP signatures on files you download, etc. An ounce
    of prevention will pretty much block the spread of virii, worms and trojans under
    Linux.


    The easiest method for dealing with virii and the like is to use system integrity
    tools such as tripwire, L5, and Gog&Magog, you will be able to easily find which
    files have been compromised and restore/replace/update them.


    # Virus Scanners


    As stated above virii aren''t a real concern in the Linux world, however virus
    scanners that run on Linux can be useful. Filtering email / other forms of content
    at the gateways to your network can provide an extra line of strong defense since
    the platforms providing the defense against the threat cannot be compromised by
    that threat.


    # AMaViS


    AMaViS uses third party scanning software (such as McAfee) to scan incoming email
    for virii. You can get AMaViS at: http://aachalon.de/AMaViS.


    # Password storage


    This is something many people don''t think about. How can you securely store passwords?
    The most obvious method is to memorize them, however this hass drawbacks, if you
    manage 30 different sites you generally want to have 30 different passwords, and
    a good password is 8+ characters in length and generally not the easiest thing
    to remember. This leads to many people using the same passwords on several systems
    (come on, admit it). One of the easiest methods is to write passwords down, this
    BIG NO-NO, you''d be surprised when people find lying around, and what they find
    if they are looking for it. A better option is to store passwords in an encrypted
    format, usually electronically on your computer or palm pilot, this way you only
    have to remember one password to unlock the rest which you can then use. Something
    as simple as PGP or GnuPG can be used to accomplish this.


    # Gpasman


    Gpasman is an application that requires gtk (relatively easily to install on a
    non Gnome system, just load the gtk libs) and encrypts your passwords using the
    rc2 algorithm. Upon startup of the program you type in your master password, and
    assuming it is correct you are presented with a nice list of your user accounts,
    sites, passwords and a comment field. Gpasman is available at: http://www.student.wau.nl/~olivier/gpasman/


    # Conducting baselines / system integrity


    One major oversight by a lot of people when securing their machines is that they
    forget to create a baseline of the system, which is a profile of the system, its
    usage of resources, and so on in normal operation. For example something simple
    as a "netstat -n > netstat-output" can give you a reference to later check and
    see if any ports are open that should not be. Memory usage and disk usage are
    also good things to keep an eye on, a sudden surge in memory usage could result
    in the system being starved of resources, likewise for disk usage, it might be
    an error, a malicious user, or a worm program that has compromised your system
    is now scanning others. Various tools exist to measure and disk usage: vmstat,
    free, df, du, all of which are covered by their respective managers.


    At the very minimum make a full system backup, and regularly backup config files
    and logs, this can also help you when you pinpoint an intrusion occurred (user
    account "rewrt") was added after the 4th backup, which is not in the March 20
    backup). Once a system is compromised a "rootkit" is installed, these of trojaned
    binaries, are near impossible to remove safely, you are better off formatting
    the disk and starting from scratch. There is course no exception to this rule,
    if you were diligent and used file/directory integrity tools such as L5 you would
    be able to pinpoint the affected files easily and deal with them.


    # Tripwire


    Tripwire is no longer a source tool, I have absolutely NO problems with commercial
    software, but when I expect me to rely on a program to provide security, when
    I (no anyone else really) can easily view the source (it is available under some
    special license agreement, probably an NDA) I must decline. Tripwire costs $70
    approximately for Linux, and is only available as an RPM package aimed (tripwire
    is $500 for other operating systems), which is rather on the high side for a piece
    of software that can easily be replaced with alternatives such as L5. Tripwire
    is available at: http://www.tripwiresecurity.com.


    # L5


    There is an alternative to tripwire however, L5, available at: ftp://avian.org/src/hacks/,
    it is completely free and very effective. I would definitely recommend this tool.


    # Gog&Magog


    Gog&Magog creates a list of system file properties, owner, permissions, an MD5
    signature of the file and so (similar to tripwire). You can then have it automatically
    compare this and ensure any changed files/etc come to your attention quickly.
    As well as recovering from a break in simpler as you''ll know which files were
    compromised. You can download Gog&Magog from: http://www.multimania.com/cparisel/gog/


    # confcollect


    confcollect is a simple script that collects system information such as routing
    tables, rpm''s installed and the like. You can download it from: http://www.skagelund/confcollect/


    # Backups


    Something people forget about, but you can compare... (truncated based on provided
    flow)

    '
  mdcn: '


    # 病毒/蠕虫/木马的消毒


    备份你的数据，格式化并从已知的介质重新安装系统。一旦攻击者获取了 Linux 系统的 root 权限，他们字面上可以做任何事情，从破坏 gcc/egcs 到在启动时加载增加的内核模块。不要以
    root 身份运行不可信软件。检查你下载文件的 PGP 签名等。稍防未缪就可以很大程度上阻止 Linux 下病毒、蠕虫和木马的传播。


    处理病毒及病毒的最简单方法是使用系统完整性工具，如 tripwire、L5 和 Gog&Magog，你可以轻松地找到哪些文件被破坏，并对其进行恢复/替换/更新。


    # 病毒扫描器


    如上述，病毒在 Linux 世界并不是真正的关注，但运行在 Linux 上的病毒扫描器是有用的。在网络网关处过滤电子邮件或其他形式的内容可以提供额外的强力防御，因为提供防御威胁的平台不会被该威胁本身破解。


    # AMaViS


    AMaViS 使用第三方扫描软件（如 McAfee）扫描入站邮件中的病毒。你可以在此处获取 AMaViS：http://aachalon.de/AMaViS。


    # 密码存储


    这是许多人没有考虑过的问题。如何安全地存储密码？最明显的方法是记住它们，但这样做有缺点，如果你管理 30 个不同的网站，你通常想要 30 个不同的密码，而一个好的密码长度在
    8 个字符以上，通常不是最容易记忆的。这导致许多人在多个系统中使用相同的密码（来吧，承认吧）。最简单的方法之一是将密码写下来，这是**大忌忌**，当人们发现到处乱丢时，以及他们在寻找时发现了什么，你会感到惊讶。更好的选项是以加密格式存储密码，通常以电子形式存储在你的计算机或掌电脑上，这样你只需要记住一个密码来解锁其他密码。可以使用像
    PGP 或 GnuPG 这样简单的工具来实现这一点。


    # Gpasman


    Gpasman 是一个需要 gtk（在非 Gnome 系统上相对容易安装，只需加载 gtk 库）的应用程序，并使用 rc2 算法加密你的密码。程序启动时输入主密码，假设它是正确的，你将看到一个漂亮的用户账户、网站、密码和注释字段列表。Gpasman
    的地址为：http://www.student.wau.nl/~olivier/gpasman/


    # 执行基准/系统完整性


    许多人在保护机器安全时的一个重大疏忽是忘记创建系统基准，基准是系统在正常运行时的配置、资源使用情况等。例如，简单的 `netstat -n > netstat-output`
    就可以为你提供一个参考，以便稍后检查是否有不该开启的端口。内存使用和磁盘使用也是需要关注的事项，内存使用的的突然激增可能导致系统资源匮乏，磁盘使用也是如此，这可能是错误、恶意用户或已经入侵你的系统并正在扫描其他人的蠕虫程序。存在多种工具来测量内存和磁盘使用：vmstat、free、df、du，它们都由各自的涵盖。


    至少要进行全系统备份，并定期备份配置文件和日志，当你准确定位发生了入侵时（例如用户账户 "rewrt" 在第 4 次备份后被添加，而该账户不在 3 月 20
    日的备份中），这也能对你有帮助。一旦系统被破解，就会安装“根内核包”（rootkit），这些被木马化的二进制文件几乎不可能安全地删除，你最好格式化磁盘并从头开始。这条规则当然没有例外，如果你勤快并使用了如
    L5 这样的文件/目录完整性工具，你就能轻松定位受影响的文件并处理它们。


    # Tripwire


    Tripwire 不再是源码工具，我完全不反对商业软件，但当我依靠一个程序来提供安全时，如果我（或任何人）无法轻松查看源码（它根据某些特殊协议提供，可能是
    NDA），我必须拒绝。Tripwire 在 Linux 上大约花费 70 美元，并且仅以 RPM 包的形式提供（其他操作系统上为 500 美元），对于一个可以被
    L5 等替代方案替换的软件来说，这个价格偏高。Tripwire 地址：http://www.tripwiresecurity.com。


    # L5


    但是有一个 Tripwire 的替代方案，L5，地址为 ftp://avian.org/src/hacks/，它是完全免费且非常有效的。我非常推荐这个工具。


    # Gog&Magog


    Gog&Magog 创建系统文件属性、所有者、权限、文件的 MD5 签名等。你可以让它自动对比，并确保任何更改的文件都能引起你的注意。这从入侵中恢复也变得简单，因为你会知道哪些文件被破坏了。你可以从此处下载
    Gog&Magog：http://www.multimania.com/cparisel/gog/


    # confcollect


    confcollect 是一个简单的脚本，用于收集系统信息，如路由表、安装的 rpm 等。你可以从此处下载：http://www.skagelund/confcollect/


    # 备份


    人们经常忘记的事，但你可以对比...


    '
