    # Burt


    Burt 是一个基于 Tcl/Tk 的扩展集，允许对 Unix 工作站进行轻松备份，这使其能够运行在任何系统上。Burt 采用客户端/服务器架构，看起来具有很好的扩展性，访问地址为：http://www.cs.wisc.edu/~jmelski/b/


    # Linux 商业备份程序


    ## BRU


    RedHat 自带了一个非常好的备份程序（至少是演示版本），称为 BRU（备份和恢复工具），这个东西自 Linux Journal 诞生以来一直存在于 Linux
    世界（从一开始那时那里就有他们的广告）。该程序以良好的统一格式提供了一套相对完整的工具，具有命令行和图形化界面（换句话说，便于自动化）。它支持全备、增量备份和差异备份，以及目录，并可以写入文件或磁带驱动器。这是一个可靠、简单易用的备份程序，它随
    RedHat Linux 一起发行（一个许可证），如果你买了 RedHat，就应该有一份可以玩玩。BRU 访问地址：http://www.estinc.com/features.html。


    ## Quickstart


    Quickstart 更多地旨在制作系统镜像，当硬盘故障等情况时，你可以快速在空白磁盘上重新映像一个运行中的系统。它也可以用于“主控”系统并加载其他系统（作为
    RedHat kickstart 的替代方案）。它的价格合理，并在 Linux Journal 上获得了好评（1998年 11 月，第 50 页）。你可以在这里获取：http://www.estinc.com/qsdr.html。


    ## Backup Professional


    http://www.unitrends.com/bp.html


    ## CTAR


    http://www.unitrends.com/ctar.html


    ## CTAR:NET


    http://www.unitrends.com/ctarnet.html


    ## PC ParaChute


    http://www.unitrends.com/pcpara.html


    ## Arkeia


    Arkeia 是一款强大的备份程序，采用客户端/服务器架构，支持许多平台。这是一款“工业级”产品，适用于异构环境，曾在 Linux Journal 上进行过评审（1999年4月）。


    ## Legato Networker


    Legato Networker 是另一个企业级备份程序，提供免费（但不支持）的 Linux 客户端。Legato Networker 访问地址为：http://www.legato.com/Products/html/legato_networker.html，Linux
    客户端可以在这里获取：http://feral.com/networker.html。


    # 备份介质的优缺点


    备份数据的方法比硬盘驱动器的范围多得多，但这里是一些流行/合理的替代方案：


    | 介质 | 优点 | 缺点 |

    | :--- | :--- | :--- |

    | 硬盘 | 速度快。便宜。相当可靠（每 GB $20-$30 美元）。 | 容量可能不够，而且它们确实会故障，通常在最糟糕的时候。也难以拆卸。不过 RAID
    是一个可行的选择。现在 20 GB 的硬盘 50 美元。 |

    | CDROM | 不受影响，世界上每个人都有 CDROM 驱动器。介质也很坚固且便宜（约每 650 兆字节 2 美元）。 | CDROM 的寿命有限（5-15
    年），且并非所有的刻录机都是一样的。避开阳光，并确保你有一个可以读取的 CDROM 驱动器。 |

    | 磁带 |可靠，你可以购买磁带、磁带转盘和机器人，它们正变得让每个人都负担得起。 | 磁性的，寿命有限，容易损坏（一分钱分货），要确保磁带可以在其他驱动器上读取（以防服务器烧毁……）。
    |

    | 软盘 | 我没开玩笑，有传言人们仍在用它备份数据。 | 它是软盘。你怎么想？ |

    | Zip 驱动器 | 我还没有弄坏过，我的猫也没有。它们的 100 兆对于大多数单用户机器足够了。 | 并不是每个人都有 Zip 驱动器，而且它们是磁性的。
    |

    | Jazz 驱动器 | 1 或 2 GB 的可移动硬件，平均写入速度为 5 兆/秒。 | 它们会坏。我已经在用到第三块了。盘片在需要时也有坏掉的习惯。 |

    | Syquest | 1.6 GB，密封盘片，与上述相同。 | 密封卡盒更可靠。不过公司最近宣布了破产。没有保修服务。 |

    | LS120 | 120 兆，且便宜，正越来越流行。 | 慢，我没开玩笑。通过软盘控制器传输 120 兆，广告称“比软盘驱动器快 3-4 倍”。 |

    | 打印机 | 保质期很长，需要一个标准的“1号人类”作为读取设备。方便向顾问展示并作为参考材料。无法轻易更改。 | 你想重新输入一个包含 4000 个条目的密码文件吗？OCR（光学识别）也是另一个选择。
    |


    # 处理攻击


    处理攻击取决于几个因素：攻击正在进行吗？你是否发现公司的计划正通过邮件服务器发送到 hotmail 地址？你是否被叫去发现了一堆死服务器？你的优先事项是什么？恢复服务？确保机密数据安全？保护攻击者？有几点需要记住：


    - 大多数管理员不会对其网站被用作攻击基地的消息做出积极反应，这通常是浪费时间。 |

    '
