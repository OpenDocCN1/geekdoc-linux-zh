- md: '

    There are several encrypted alternatives to ftp as mentioned before, SSLeay FTP,
    and third party utils. Since most ftp accounts are not used as admin accounts
    (BAD IDEA!), and hopefully run chrooted, the security risk is minimized. That
    now have fully covered all the network parts of ftp, let''s over securing the
    accounts and environment. The main mechanism for user security in ftp is the use
    of chroot. For default all people logging in as anonymous have /home/ftp/ as their
    ''root''. They cannot get out of this and look at the contents of /home/ or /etc/.
    The same can be applied to groups of users and individuals, for example you could
    set all users to be chrooted to /home/ when they ftp, or in extreme cases of user
    privacy (on a www server hosting multiple domains) each user chrooted to within
    their own home directory. This is accomplished through the use of /etc/ftpassconf
    (man ftp has access). I will give a few examples of what needs to be done to accomplish
    this since it can be confusing at first. As well it checks /etc/ftpassusers and
    if the user updating is listed in that file (like root should be) it will not
    let the user login via ftp.


    To roost users as login into the ftp server is rather simple, but poorly documented.
    The ftp server chroot checkpass for ''guestgroup'', which are simply ''guestgroup
    some-group-onset-system'', ''guestgroup'' and the groupname needs to be defined
    in /etc/group and have members added. As you well need to edit their password
    file line so that the ftp server knows where to dump. And since they are now chrooted
    into that directory of system, they do not have access to /etc so you must copy
    many files into their dir like is to work properly (always a nice touch).


    Setting up a billybob/ (because he keeps threatening to take the sysadmin possum
    hunting). In addition to this billybob can telnet in and change his password,
    but nothing else because he keeps trying to run irc on the system. The system
    is on shadowed passwords, so that''s why there is an ''x'' in billybob''s password
    field.


    First off billybob needs a properly setup user account:

    billybob:500:500:Billy Bob:/home/billybob:/bin/passwd


    this means that the ftp will chroot into /home/billybob/ and chdir into what is
    now /home/billybob/ to the rest of us. The ftpass man file covers this bit ok,
    and of course /usr/sbin/passwd needs to be listed in /etc/shells


    Secondly for the ftp server to know that he is being chrooted to be a member of
    a group (baddusers, ftpeople, etc) that is defined in /etc/group. And then that
    group must be listed in /etc/ftpass.


    Now you need to copy some libs/binaries otherwise billybob won''t be able to do
    a lot what he has etched in. The files needed are available as packages (usually
    "anonftp"), once this is installed the files will be copied to /home/ftp/, you
    will notice there is an /etc/passwd, this is simply means to map UID''s to users,
    if you want billybob to be his username and not ID, add a line for him (i copy
    his from the real /etc/passwd to this one). The same applies to the group file.


    withoutbillybob*:500:500::" in /home/billybob/etc/passwd:

    drwxrxr-x 2 500 500 1024 Jul 14 20:46 billybob


    and with a line added:

    drwxr-xr-x 2 billybob 500 1024 Jul 14 20:46 billybob


    and with a line for billybob''s group added to the group file:

    drwxr-xr-x 2 billybob billybob 1024 Jul 14 20:46 billybob


    Bilybob can now now ftp into the system, upload and download files from /home/billybob
    to his hearts content, change his password on all his own, and do no damage to
    the system, nor download the passwords file or other nasty things.


    FTP is also a rather special protocol in that the clients connect to port 21 (typically)
    on the ftp server, and then port 20 of the ftp server connects to the client and
    that is the connection that the actual data is sent over. This means that port
    20 has to be making outgoing connections, keep this in mind when setting up a
    firewall to protect ftp servers or clients using ftp. As well there is ''passive''
    ftp and usually used by www browsers/etc, and involves incoming connections to
    the ftp server on high port numbers (instead of using 20 they agree on some else).
    If you intend to have a public ftp server put up a machine that JUST does the
    ftp serving, and nothing else, preferably outside of your internal LAN (see Practical
    Unix and Internet Security for discussions of this ''DMZ'' concept).


    ## Apache


    What can I say about securing Apache? Not much actually. By default Apache runs
    as the user ''nobody'', giving it very little access to the system, and by large
    the Apache team has done an excellent job of buffering overflows/etc. In general
    www servers retrieve data from off the system and send it out, most of the danger
    come not from Apache but from sloppy programs that are executed via Apache (CGI''s,
    server side includes, etc). If I am going with Apache I would recommend using
