    # Log files and other forms of monitoring


    One integral part of any UNIX system is the majority of logging in Linux is provided
    by two main programs, syslog and klogd, the first providing logging services to
    programs and applications, the second providing logging capability to the Linux
    kernel. Kernel actually sends messages to syslog facility but will on occasion
    pop messages at the console (i.e. kernel panics). Syslog handles the task of processing
    messages and sending them to the appropriate file or device, this is configured
    within /etc/syslog.conf. By default logging to files takes place in /var/log/,
    and generally programs that handle their own logging (such as apache) log to /var/log/proname/;
    this centralizes the logs and makes it easier to place them on a separate partition
    (some attacks can fill your logs quite quickly, and a full /partition is no fun).
    Additionally there are programs that have their own internal logging, one of the
    most interesting being the bash command shell. By default bash keeps a history
    of file commands executed in ~username/.bash_history, this file can make for extremely
    interesting reading, as oftentimes many admins will accidentally type their passwords
    at the command line. Apache handles all of its logging inline, configurable from
    http.conf and extremely flexible with the release of Apache 1.3.6 (it supports
    conditional). Sendmail handles its logging via syslog but also has the option
    (via the command -X switch) of logging all SMTP transactions straight to a file.
    This will grow enormous in a short span of time, but useful for debugging. See
    the sections in network security on apache and sendmail for more information.


    # syslog /kld


    In a nutshell klog handles kernel examples, depending on your setup this can range
    from almost none to a great deal if you turn on process accounting. It passes
    most messages to syslog for actual handling, it placement in the log: many pages
    for syslog, syslog.conf are pretty good with clear examples. One exceedingly powerful
    and often overlooked ability of syslog is to log messages to a remote host running
    Since you can define multiple locations for syslog messages (i.e. send all messages
    to /var/log/messages file, to console, and to a remote host or multiple hosts)
    this allows you to centralize logging to a single host and easily check log files
    for security violations and other strangeness. There are several problems with
    syslog andlog however, the primary ones being the ease of which one an attacker
    has gained root access to deleting/modifying log files, there is no authentication
    built into the standard logging facilities.


    The standard log files that are usually defined in syslog.conf are:


    ```

    /var/log/messages

    /var/log/secure

    /var/log/mailog

    /var/log/spooler

    ```


    The first one (messages) gets the majority of information typically, user login''s,
    TCP_WRAPPERS dumps information here, and so on. The second typically records entries
    for users like information here and, etc.), changing their UID/GID (via su, sudo,
    etc.), failed attempts when passwords are required and so on. The mailog file
    typically holds entries for every pop/imap connection (user login and'
  - '[PAGE 29]


    logout), the header of each piece of file that goes in or out of the system (from
    whom, where, msgid, status, and so on). The spooler file is not often used anymore
    as the number of people running usenet user has plummeted, ucp been basically
    replaced with flip email, and most usenet servers are extremely powerful machines
    to handle a full, or even partial newsfeed, aren''t many of them (typically one
    per ISP or depending on size). Most homes and small/sized business will not (and
    should not in my opinion) run a usenet server, the amount of bandwidth and machine
    power required is phenomenal, let alone the security risks.


    You can also define additional log files, for example you could add:


    ```

    /var/log/kernel-log

    ```


    And or you can log to a separate log host:


    ```

    *.emerg @syslog-host

    mail.* @syslog-host

    ```


    Would result in all kernel messages being logged to /var/log/kernel-log, this
    is useful on headless servers since by default kernel messages go to /dev/console
    (ie someone logged in the machines). In the second case all emergency messages
    would be logged to the host “syslog-host”, and all the mail log files will be
    sent to the “mail-log-host” server, allowing you to easily maintain centralized
    log files of various services.


    secure-syslog


    The major problem with vslog however is tampering with log files is trivial. There
    is however several versions of vslog, available at http://www.core-sdi.com/syslog/
    (these guys generally make good tools and a good reputation, in any case it is
    open source software for those you truly parody). This allows you to cryptographically
    sign logs and ensure they haven''t been tampered with, ultimately however an attacker
    can still delete the log files so it is a good idea to send them to another host,
    especially in the case of a firewall to prevent the hard drive being filled up.


    next generation syslog


    Another alternative is “syslog-ng” (Next Generation Syslog), which seems much
    more customizable than either syslog or secure syslog, it supports digital signatures
    to prevent log tampering, and can filter based on content of the message, not
    just the facility it comes from or priority (something that is very useful for
    cutting down volume). Syslog-ng is available at: http://www.balabit.hu/products/syslog-ng.html.


