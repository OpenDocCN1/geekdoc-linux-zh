    # Basic network services config files


    There are several important config files that control what services Linux runs
    and how they run. Unfortunately many of them are in differing locations depending
    on what/how you installed Linux and the services. Typical locations are:


    Inetd server config file:

    /etc/inetd.conf


    Initial start up files in various places

    /etc/rc.d/*

    /etc/*


    The best thing to do is figure out which services you want to run, and disable/remove
    the rest. Please see the appropriate section in package management for your system
    (RPM, dpkg, tarballs).


    # inetd.conf


    inetd is responsible for starting services, typically ones that do not need to
    run continuously, or are session based (such as telnet, or ftpd). This is because
    the overhead of running a service constantly (like telnet) would be higher the
    occasional start up cost (or firing in telnetd) when you want users to use it.
    For some services (like DNS) that service makes quick connections to the overhead
    of starting the service every few seconds would be higher than constantly running
    it (also with services such as DNS and email time is critical, a few seconds delay
    starting an ftp session won''t hurt much). The page for inetd.conf covers the
    basics:


    ```

    man inetd.conf

    ```


    the service itself is called inetd and is run at boot time, so you can easily
    start/stop/reload it by manipulating the inetd process. When you make changes
    to inetd.conf you must restart inetd to make the changes effective, killall -9
    inetd will restart properly. Lines in inetd.conf can be commented out with a #
    as usual (this is a very simple and effective way of disabling services rexec).
    It is advisable to disable many services in inetd as possible, the only ones in
    use will be fif, pop and imap, telnet and r services should be replaced with ssh,
    and services like sysstat/netstat and finger give away far too much information.
    Access to programs started by inetd can be easily controlled by the use of TCP_WRAPPERS.


    # TCP_WRAPPERS


    Using TCP_WRAPPERS makes securing your servers against outside intrusion is a
    lot simpler and painless than you would expect. TCP_WRAPPERS is controlled from
    two files:


    ```

    /etc/hosts.allow

    /etc/hosts.deny

    ```


    hosts.allow is checked first, and the rules are checked from first to last, when
    it finds a rule that explicitly allows you to (i.e. a rule allowing your host,
    domain, subnet mask, etc) it lets you connect to the service, if it fails to find
    any rules that pertain to you in hosts.allow, it lets'
  - '[PAGE 50]


    goes to check hosts.deny for a rule denying entry. Again it checks the rules in
    hosts.deny from first to last, and the first rule it denies you access (i.e. a
    rule disallowing your host, domain, subnet mask, etc) means doesn''t let you in.
    If it fails to find a rule denying you it then by default lets you. If you are
    paranoid like the last rule (or only if you are going to a default policy of non-optimistic
    security) should be:


    ```

    ALL: 0.0.0.0/0.0.0.0

    ```


    which means all services, all locations, it a default policy. You might also want
    to just default deny access to saynet, and leave fpt wide open to the world, to
    do this you have:


    in hosts.allow:


    ```

    in.telnetd: 10.0.0.0/255.255.255.0    # allow access from my internal

    network of 10.*.*                    # allow access from anywhere in the

    in.ftptd: 0.0.0.0/0.0.0.0

    world

    ```


    in hosts.deny:


    ```

    in.telnetd: 0.0.0.0/0.0.0.0    # deny access to telnetd from

    anywhere

    ```


    or if you wish to be safe:


    ```

    ALL: 0.0.0.0/0.0.0.0    # deny access to everything from everywhere

    ```


    This may affect services such as ssh and nfs, so be careful!

    You may wish to simply list all the services you are using separately:

    in.telnetd: 0.0.0.0/0.0.0.0

    ipop3d: 0.0.0.0/0.0.0.0


    If you leave a service that you shouldn''t have in inetd, and DO NOT have a default
    policy, you could be the creep. It is safer (a bit more work, but in the long
    run less work rebuilding the server) to have default deny rules for firewalling
    and tcp_wrappers, this is what you leave on accident, by default there will be
    no access to it. If you install something that users need access and forget to
    put allow rules in, they will quickly complain that they can''t get access and
    you will be able to rectify the problem quickly. Better safe than sorry. The man
