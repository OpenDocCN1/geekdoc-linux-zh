    action based on what you tell it to do. WOTS looks for regular expressions you
    define and then executes the commands you list (mail a report, sound an alert,
    etc.). WOTS requires you perl installed and is available from: http://www.vccp.univie.ac.at/-tc/tools/


    swatch


    # Kernel logging


    auditd


    auditd allows you to use the kernel logging facilities (a very powerful tool).
    You can log mail messages, system events and the normal items that syslog would
    cover, but in addition to this you can cover events such as specific users opening
    files, the execution of programs, of setuid programs, and so on. If you need a
    solid audit trail then this is the tool for you, you can get it at: ftp://ftp.hert.org/pub/linux/auditd/


    # Shell logging


    bash


    I will also cover bash since it is the default shell in most Linux installations,
    and thus it''s logging facilities are generally used. bash has a large number
    of variables you can configure at or run time that modify how it behaves, everything
    from the command prompt style to how many lines to keep in the log file.


    ```

    HISTFILE

    ame of the history file, by default it is ~/.bash_history

    ```


    ```

    HISTFILESIZE\maximum number of commands to keep in the file, it rotates them as
    needed.

    ```


    ```

    HISTSIZE

    the number of commands to remember (i.e. when you use the arrow key).

    ```'
  - '[PAGE 31]


    The variables are typically set in /etc/profile, which configures bash globally
    for all users, the values can however be over-ridden by users with the ~username/.bash_profile
    file, and/or by manually using the export command to set variables such as export
    EDITOR=emacs. This is one of the reasons user directories would not be world readable,
    the bash_history file can contain a lot of valuable information to a hostile party.
    You can also set the file itself non world readable, set your .bash_profile not
    to log, set the file non writable (denying bash the ability to write to log) or
    link it to /dev/null (this is almost always a sign of suspicious user activity,
    or a paranoid user). For the root account I would highly recommend setting the
    HISTFILESIZE and HISTSIZE to a low value such as 10. Unfortunately you cannot
    really lock down normal user''s history files, you can set them so the user cannot
    delete them etc, but unless you deny the user the export command, etc. they will
    be able to get around having all their commands logged if they are competent.
    Ultimately, letting users have interactive shell accounts on the server is a bad
    idea and should be as heavily restricted as possible.'
  - '[PAGE 32]


    # Shadow passwords


    In UNIX like operating systems there are several constants, and one of them is
    the file /etc/passwd and how it works. For user authentication to work properly
    you need (minimally) some sort of(file) for username mappings, GID to groupname
    mappings, passwords for the users, and other misc. info. The problem with this
    is that everyone needs access to the password file, everytime you An it gets,
    how do you store all those passwords safely, keep them readable? For many years
    the solution has been quite simple and effective, hash the passwords, and store
    the hash, when a user needs to authenticate the password they enter it, hash,
    if it matches obviously the same password. The problem with this is that computing
    power has grown enormously, and I can now take a copy of your password file, and
    to brute force it in a reasonable amount of time. To solve this several solutions:


    +   - Use a ''better'' hashing algorithm MD5. Problem: can break a lot of things
    if they''re expecting something else.

    - Store the passwords elsewhere. Problem: the system/users still need access to
    them, and it might cause some programs to fail if they are not set up for.


    Several OS take the first solution, Linux has implemented the second for a while
    now, it is called shadow passwords. In the password file your password is replaced
    by an ''x'', which tells the system to check your password against the shadow
    file. Anyone can still read the password file, but only root has access to the
    shadow file (the same is for the group file and it''s). Seems enough but until
    recently implementing shadow passwords was a royal pain. You had to recompile
    all your programs that checked passwords (login, ftpd, etc, etc) and this only
    takes a bit of effort. This is why RedHat shines through in its reliance on PAM.


    To implement shadow passwords you must do two things. The first is relatively
    simple, changing the password file, but the second can be a pain. You have to
    make sure your programs have password support, which can be quite painful in some
    cases (this is a very strong reason why distributions should ship with PAM.


    Because of RedHat''s reliance on PAM for authentication, a new authentication
    scheme all you need to do is add a PAM module to understand it, and edit the config
    file for whichever program (say login) allowing it to use that module do authentication.
    No recompiling, and an amount of fuss and muss, right? In RedHat 6.0 you are given
    the option during installation to choose shadow passwords, or you can implement
    them later via pwcmd and grep which ship with the shadow-utils package. Most other
    distributions also have shadow password support, and implementation varies somewhat.
    Now for an attacker to look at the hashed passwords they must go to quite a bit
    more effort than simply copying the /etc/passwd file. Also make sure that all
    passwords are in fact shadowed. Sometimes passwords get left in /etc/passwd, and
    not be sent to /etc/shadow as they should be by some utilities that edit the password
    file.'
  - '[PAGE 33]


    # Cracking passwords


    In Linux the passwords are stored in a hashed format, however this does not make
    them retrievable, chances you cannot reverse engineer the password from the resulting
    hash, however you can hash a list of words and compare them. If the results match
    then you have found the password, this is why good passwords are critical, and
    dictionary words are a terrible idea. Even with a shadow passwords file the passwords
    are still accessible by the root user, and if you have improperly written scripts
    or programs that run as (a www based CGI script) the password file may be retrieved
    by attackers. The majority of current password cracking software also allows running
    on multiple hosts in parallel to speed things up.


    Jack the ripper


    An efficient password cracker available from: http://www.false.com/security/john/


    Crack


    The original widespread password cracker (as far as I know), you can get it at:
    http://www.users.dircon.co.uk/~crypto/.


    Saltine cracker


    Another password cracker with network capabilities, you can download it from:
    http://www.thegrid.net/gravitino/products.html.


    VCU


    VCU (Velocity Cracking Utilities) is a window based programs to aid in cracking
    passwords, “VCU attempts to make the cracking of passwords a simple task for computer
    users of any experience level.\. You can download it from: http://wilter.com/wf/vcu.


    I hope this is sufficient motivation to use shadow passwords and a stronger hash
    like MD5 (which RedHat 6.0 supports, I don''t know of other distributions supporting
    it).'
  - '[PAGE 34]


    # PAM


    "Pluggable Authentication Modules for Linux is a suite of shared libraries that
    enable the local system administrator to choose how applications authenticate
    users.” Straight from the PAM documentation, I don''t think I could have said
    it better. But what does this actually mean? Take a ‘normal’ program, say login,
    when a user connects to a tty (via modem or तेव्हा) a getty program answers the
    call (as it were) and usually starts up the ‘login’ program, login requests a
    username, by a password, which it checks against the /etc/passwd file. So what
    if you have a nifty digital card authentication system? Will you have to recompile
    login (and any other apps that use it) so they support the new system. PAM introduces
    a layer of middleware (nice buzz huh?) between the program and the actual authentication
    mechanism. Once a program is PAMified, any authentication methods PAM supports
    will be usable by the program. In addition to this PAM can handle account, and
    session data which is something ‘normal’ authentication mechanisms don’t do. Using
    PAM for example you can easily disable login access by normal users between 6pm
    and 6am, preventing security risks. By default RedHat systems are PAM aware, I''m
    not sure of any other distributions that are, in RedHat all I have to do implement
    shadow passwords is convert the password and group files, and possibly add one
    or two lines to some config files (if they ''re already added). Essentially PAM
    gives you a great deal of flexibility when handling user authentication, and will
    support other features in future such as transparent chroot’ing of users (be they
    telneting in, or piping). This kind of flexibility will be required for Linux
    to be an enterprise class operating system. Distributions that do not as “pam
    aware” can be made so but it requires a lot of effort (you must recompile all
    your programs with PAM support, install PAM, etc), it is probably easier to switch
    straight to a PAMified distribution if this will be a requirement. PAM usually
    comes with complete documentation, and if you are looking for a general overview
    you should visit:

    ://www.sun.com/software/solaris/pam/'
- md: '

    # Software Management


    ## RPM


    RPM is a software management tool originally created by RedHat, and later GNUed
    and given to the public (http://www.rpm.org/). It is the core of administration
    on systems, one of the major tasks for any administrator is installing and keeping
    software up to date. Various estimates place most of the blame for security break-ins
    on bad passwords, and old software with vulnerabilities. This isn''t exactly surprising
    one would think, but with the average server properly containing 200-400 software
    packages, one begins to see why keeping software up to date can be a major task.


    The man for RPM is pretty bad, there is no way of putting it out. The book "Maximum
    RPM" (ISBN: 0-672-31105-4) on the other hand is wonderful (freely available at
    http://www.rpm.org/ in post script format). I would suggest this book for RedHat
    administrator, and can safely say that it is required if you plan to build RPM
    packages. The basics of RPM are pretty elementary, packages come in an RPM format,
    with a simple filename convent:


    package_name-version-rpm_build_version-architecture.rpm


    nfs-server-2.2beta29-5.i386-rpm would be "nfs-server", version "2.2beta29" of
    "nfs-server", the fifth build of RPM is quite (it has been built and built 5 times,
    with minor modifications, changes in file locations, etc.), for the Intel architecture,
    and it''s an rpm file.


    | Command | Function |

    |---|---|

    | -q | Queries Packages / Database for info |

    | -i | Install software |

    | -U | Upgrades or installs the software |

    | -e | Extracts the software from the system (removes) |

    | -m | be more Verbose |

    | -h | Hash marks a.k.a. done-o-dial |


    | Command Example | Function |

    |---|---|

    | rpm -ivh package.rpm | Install ''package.rpm'', be verbose, show hash marks
    |

    | rpm -Uvh package.rpm | Upgrade ''package.rpm'', be verbose, show hash marks
    |

    | rpm -q /some/file | Check which package owns a file |

    | rpm -qa package.rpm | Query ''package.rpm'', lists all files |

    | rpm -ql package.rpm | Queries RPM database lists all packages installed |

    | rpm -e package-name | Remove ''package-name'' from the system (is listed by
    rpm -qa) |


    RedHat 5.1 with 528 packages, and RedHat 5.2 with 573, when you think about it
    is a lot of software (SuSE 6 on 5 CDs, I haven''t bothered to count how many packages).
    Typically you will end up with 2-300 packages installed (more apps on workstations,
    servers tend to be leaner, but this is not always the case). So which of these
    should you install and which you should avoid if possible (like the r services
    packages). One I will say, the RPM''s with RedHat distributions are usually pretty
    good, and typically last 6-12 months before they are broken.


    There is a list of URL''s and naming lists where distribution specific errata
    is in the document.


    The Debian package system is a similar package to RPM, however lacks some of the
    functionality, overall it does an excellent job of managing software packages
    on a system. Combined with the dselect utility (being phased out) you can connect
    to remote sites, scroll through the available packages, install them, run any
    configuration scripts needed for dpkg, all from the comfort of your console. The
    man page for dpkg "man dpkg" is quite extensive.


    The general format of a Debian package file (.deb):


    Unlike rpm files .deb are not labeled for architecture as well (not a big deal
    but something to be aware of):


    | Command | Function |

    |---|---|

    | -d | Queries Package |

    | -i | Install software |

    | -l | List installed software (equiv. to rpm -qa) |

    | -r | Removes the software from the system |


    | Command Example | Function |

    |---|---|

    | dpkg -i package.deb | Install package.deb |

    | dpkg -s package.deb | Lists info about package.deb (rpm-qpi) |

    | dpkg -c package.deb | Lists all files in package.deb (rpm -ql) |

    | dpkg -l | Shows all installed packages |

    | rpm -r package-name | Removes "package-name" from the system (as listed by dpkg
    -l) |


    Debian has 1500+ packages available with the system. You will learn to love dpkg
    (functionally it has everything, I just miss a few of the bells and whistles that
    rpm has, on the other dselect has some features I wish rpm had)


    There is a list of URL''s and mailing lists where distribute specific errata is
    later in this document.


    ## tarballs / tgz


    Modern Linux distributions use a package management system to install, keep track
    of and remove software on the system. There are many exceptions, Slack does not
    use a true package management system per se, but instead precompiled tarballs
    (a compressed tar containing files) that you simply unpack from the root directory
    to install, some of which you have install script tasks such as adding a user.
    These packages can also be removed, with functions such as querying, installing
    files against packages (trying to tampering, etc.) is pretty much not. Or perhaps
    you want to get the latest copy of X, and no one has yet gotten around to making
    a nice .rpm or .deb file, so you grab the source code.


    ## Checking integrity


    Something I would cover semi-separately, checking the integrity of software that
    is retrieved from remote sites. Usually people don''t worry, but recently ftp.win.tune.nl
    was broken into, and the tcp_wrappers package (among others) were trojan. 59 downloads
    occurred before the site removed the offending packages and initiated damage procedures.
    You should always check the integrity of files you download from remote sites,
    some day major site will be broken and in lot of people will suffer a lot of grief.


    RPM packages can (and typically are) PGP signed by the author. This signature
    can be checked to ensure the package has not been tampered with or is a trojan.
    This is described in great detail in chapter 7 of "Maximum RPM" (online at http://www.rpm.org/),
    but consists of adding the developers keys to your PGP keyring, and then using
    the -K option which will grab the appropriate key from the keyring and verify
    the signature. This way to trojan a package and sign it correctly they would have
    to steal the developers private PGP key and the password to unlock it, which should
    be near impossible.


    dpkg supports MD5, so you must get the MD5 signatures through a trusted channel
    (like PGP signed email). MD5 ships with many distributions.


    Many tarballs are distributed with PGP signatures in separate ASCII files, to
    verify add the developers keys to your keyring and then use PGP with the -o option.
    This way to trojan a package and sign it correctly they would have to steal the
    developers private PGP key and the


    | Command | Function |

    |---|---|

    | | List files |

    | -x | Extract files |

    | Command Example | Function |

    | tar -xf filename.tar | untars filename.tar |

    | tar -xt filename.tar | lists files in filename.tar |

    '
  mdcn: '


    # 软件管理


    ## RPM


    RPM 是最初由 RedHat 创建的软件管理工具，后来经过 GNU 化并向公众发布（http://www.rpm.org/）。它是系统管理的核心，任何管理员的首要任务之一就是安装并保持软件更新。据各种估计，大多数安全侵入事件都应归咎于弱密码和带有漏洞的旧版软件。这并不完全令人意外，但考虑到一台平均服务器恰好包含
    200-400 个软件包，人们就会开始理解为什么保持软件更新是一项重大任务了。


    RPM 的手册页（man page）写得相当糟糕，这不争疑。相反，《Maximum RPM》（ISBN: 0-672-31105-4）这本书非常出色（可以在
    http://www.rpm.org/ 免费获取 PostScript 格式）。我建议 RedHat 管理员阅读这本书，并可以肯定地说，如果你计划构建 RPM
    软件包，它是必不可少的。RPM 的基础知识非常简单，软件包采用 RPM 格式，并遵循简单的命名约定：


    包名-版本-RPM构建版本-架构.rpm


    `nfs-server-2.2beta29-5.i386-rpm` 将代表 "nfs-server"，版本为 "2.2beta29" 的 "nfs-server"，RPM
    的第 5 次构建（它已经构建了 5 次，并进行了微调、更改了文件位置等），适用于 Intel 架构，并且是一个 rpm 文件。


    | 命令 | 功能 |

    |---|---|

    | -q | 查询软件包 / 数据库信息 |

    | -i | 安装软件 |

    | -U | 升级或安装软件 |

    | -e | 从系统中提取软件（删除） |

    | -m | 显示更详细的信息（Verbose） |

    | -h | 标记进度符号（也称为完成拨号） |


    | 命令示例 | 功能 |

    |---|---|

    | rpm -ivh package.rpm | 安装 ''package.rpm''，详细输出，显示进度标记 |

    | rpm -Uvh package.rpm | 升级 ''package.rpm''，详细输出，显示进度标记 |

    | rpm -q /some/file | 检查哪个软件包拥有该文件 |

    | rpm -qa package.rpm | 查询 ''package.rpm''，列出所有文件 |

    | rpm -ql package.rpm | 查询 RPM 数据库列出所有已安装软件包 |

    | rpm -e package-name | 从系统中移除 ''package-name''（由 rpm -qa 列出） |


    RedHat 5.1 包含 528 个软件包，RedHat 5.2 包含 573 个，想想看这是大量的软件（SuSE 6 占了 5 张光盘，我没去数具体有多少个包）。通常你最终会安装
    200-300 个软件包（工作站上的应用更多，服务器往往更精简，但情况并非总是如此）。那么，你应该安装其中的哪些，哪些应该尽量避免（例如 r services
    软件包）。我要说，RedHat 发行版中的 RPM 通常非常好，通常在运行 6-12 个月后才会出现问题。


    文档中列出了 URL 列表和命名列表，用于特定发行版的错误说明（errata）。


    Debian 软件包系统与 RPM 类似，但缺少某些功能，尽管总的来说，它在管理系统软件包方面做得非常出色。结合 dselect 工具（正在淘汰中），你可以连接到远程站点，浏览可用软件包，安装它们，运行
    dpkg 需要的任何配置脚本，这一切都可以在舒适的控制台中完成。dpkg 的手册页 "man dpkg" 非常详尽。


    Debian 软件包文件 (.deb) 的通用格式：


    与 rpm 文件不同，.deb 也没有标记架构（虽然不是大问题，但需要注意）：


    | 命令 | 功能 |

    |---|---|

    | -d | 查询软件包 |

    | -i | 安装软件 |

    | -l | 列出已安装软件（等于 rpm -qa） |

    | -r | 从系统中移除软件 |


    | 命令示例 | 功能 |

    |---|---|

    | dpkg -i package.deb | 安装 package.deb |

    | dpkg -s package.deb | 列出 package.deb 的信息 (rpm-qpi) |

    | dpkg -c package.deb | 列出 package.deb 中的所有文件 (rpm -ql) |

    | dpkg -l | 显示所有已安装软件包 |

    | rpm -r package-name | 从系统中移除 "package-name"由 dpkg -l 列出） |


    Debian 系统提供了 1500 多个可用软件包。你会爱上 dpkg（从功能上说它全能，我只是想念 rpm 拥有的一些花哨功能，而在 dselect 上有一些我希望
    rpm 也拥有的功能）。


    文档后部列出了 URL 列表和邮件列表，用于特定发行版的错误说明。


    ## tarballs / tgz


    现代 Linux 发行版使用包管理系统来安装、跟踪和删除软件。有很多例外，Slack 并没有使用真正的包管理系统，而是使用预编译的 tarballs（包含文件的压缩
    tar 包），你只需将其从根目录解压即可安装，这些软件包也可以移除，具有查询、安装文件（尝试篡改等）等功能。或者你想获取 X 的最新版本，但还没有人制作出良好的
    .rpm 或 .deb 文件，所以你获取源码。


    ## 检查完整性


    我将单独讨论这一部分，即检查从远程站点获取的软件的完整性。通常人们并不担心，但最近 ftp.win.nl 被攻破了，tcp_wrappers 软件包（以及其他包）是木马。在发生
    59 次下载后，该站点删除了这些软件包并启动了修复程序。你应该始终检查从远程站点下载的文件的完整性，总有一天某个大型站点会出问题，许多人将面临痛苦。


    RPM 软件包可以（且通常）由作者进行 PGP 签名。可以检查此签名以确保软件包未被篡改或不是木马。这在《Maximum RPM》第 7 章（可在 http://www.rpm.org/
    在线查看）中有详细描述，包括将开发者密钥添加到你的 PGP 密钥环中，然后使用 -K 选项，它将从密钥环获取相应的密钥并验证签名。要这样伪造软件包需要窃取开发者的私钥
    PGP 密钥以及解锁它的密码，这几乎是不可能的。


    dpkg 支持 MD5，因此你必须通过可靠的渠道（如 PGP 签名邮件）获取 MD5 签名。许多发行版都带有 MD5。


    许多 tarballs 以独立的 ASCII 文件形式带有 PGP 签名发行，要进行验证，请将开发者密钥添加到你的密钥环中，然后使用带有 -o 选项的 PGP。要这样伪造软件包需要窃取开发者的私钥
    PGP 密钥和




    | 命令 | 功能 |

    |---|---|

    | | 列出文件 |

    | -x | 提取文件 |

    | 命令示例 | 功能 |

    | tar -xf filename.tar | 解压 filename.tar |

    | tar -xt filename.tar | 列出 filename.tar 中的文件 |


    '
