    # Forward by the author


    I got my second (our first doesn''t count, a TRS-80 that died after a few months)
    computer in Christmas of 1993, blew windows away 4 months later for OS/2, got
    a second computer in spring of 1994, loaded Linux on it (Slackware 1.?) in July
    of 1994. I ran Slackware for about 2-3 years and switched to RedHat after being
    introduced to it, after I switched over to it. Since then I have also earned an
    MCSE and MCP+Internet (come to the dark side Luke..), Why did I write this guide?
    Because no-one else. Why is it freely available online? Because I want to reach
    the largest audience possible.


    I have also received help on this guide (both direct and indirect) from the Internet
    community at large, many people have put up excellent security related webpages
    that I list, and mailing lists like Bugtra help me keep on top of what is happening.
    It sounds cliched (and god forbid a journalist pick this up) but this wouldn''t
    be possible without the open source community. I thank you all.


    # Contributing


    Contributions are welcome, especially URL’s for programs/resources that aren’t
    listed here yet. As for actual contributions of written material I cannot accept
    those at yet for a variety of reasons.


    # What this guide is and isn''t


    This guide is not a general security document. This guide is specifically about
    securing the Linux operating system against general and specific threats. If you
    need a general overview of security please go buy "Practical Unix and Internet
    Security" available at www.ora.com.

    O''Reilly and associates, which is one of my favorite publisher of computer books
    (they make nice T-shirts to) and listed in the appendix are a variety of other
    computer books I recommend.


    # How to determine what to secure and how to secure it


    Are you protecting data (proprietary, confidential or otherwise), are you trying
    to keep certain services (your mail server, we server, etc.), do you simply want
    to protect the physical hardware from damage? What are you protecting against?
    Malicious damage (8 Sun Enterprise 10000''s), deletion survey data, your mom''s
    recipe collection), changes (a physical with medical records, a bank), exposure
    (confidential internal communications concerning the lawsuit, plans to cope with
    unwowed mothers), What are the chances of a "bad" event happening, network probes
    (happens to me daily), physical intrusion (hasn''t happened to me yet), social
    engineering ("Hi, this is Bob from IT, I need your password so we can reset it...").


    You need to list out the resources (servers, data and other components) that contain
    data, provide services, make up your company infrastructure, and so on. The Following
    is a short list:


    - Physical server machines

    - Mail server and services

    - DNS server and services

    - WWW server and services

    - File server and services

    - Internal company data such as accounting records and HR data

    - Your network infrastructure (cabling, hubs, switches, routers, etc.)

    - Your phone system (PBX, voicemail, etc.)


    You need to figure out what you want to protect it against:


    - Physical damage (smoke, water, food, etc.)

    - Deletion / modification of data (accounting records, defacement of your www
    site, etc.)

    - Exposure of data (accounting data, etc.)

    - Continuity of services (keep the email/www/file server up and running)

    - Prevent others from using your services illegally/improperly (email spamming,
    etc.)


    Finally what is the likelihood of an event occurring?


    - Network scans – daily is a safe bet

    - Social engineering – varies, usually the most vulnerable people tend to be the
    ones targeted

    - Physical intrusion – depends, typically rare, but a hostile employee with a
    pair of wire cutters do a lot of damage in a telecom forest

    - Employees selling your data to competitors – it happens

    - Competitor hiring skilled people to penetrate your network – no one ever talks
    about this one if it also happens


    Once you come up with a list of resources and what needs to be done you can implementing
    security. Some techniques (physical security for servers, etc.) pretty much without
    saying, in this industry there is a baseline of security typically implemented
    passording accounts, etc.). The vast majority of security problems are usually
    human generated, and most problems I have seen are due to lack of education/communication
    between people, there is no technical ''silver bullet'', even the best software
    needs to be installed, configured and maintained by people. Now for the stick.
    A short list of possible results from security incident:


    - Loss of data

    - Direct loss of revenue (ww sales, file server is down, etc)

    - Indirect loss of revenue (email support goes, customers never to buy from again)

    - Cost of staff time to respond

    - Lost productivity of IT staff and workers dependant on IT infrastructure

    - Legal Liability (medical records, account records of clients, etc.)

    - Loss of customer confidence

    - Media coverage


    Proper installation of Linux is the first step to a stable, secure system. There
    are various tips and tricks to make the install easier, as well as some issues
    that are best handled during the install (such as disk layout). My personal favorite
    is choosing your install media, when popping a network card into a machine temporarily
    (assuming it doesn''t have one) is quick and painless, Installing from CD-ROM
    is generally the easiest, as they are bootable, Linux finds the CD and off go,
    no pointing to directories or worrying about case (the case of HD). This is also
    original media and you can be relatively sure (assuming it came from a reputable
    source), you''ve got a fresh install of Linux (RedHat, Debian, whatever, please,
    it''s a nightmare), but there is a lot of extra installed, and packages might
    want to upgrade or things that would better upgrade if you don''t want the system
    compromised in the first 15 seconds of uptime (in the case of BIND/send/etc.).
    Keeping a local copy of the directories for your distributions is a good idea
    (there is a list of errata for distributions at the end of this document), and
    making it available is the quickest way to make available. As well as there are
    other items you might want to upgrade, for instance I use a chroot''ed, non-root
    version of Bind 8.1.2, available on the contrib server (ftp://contrib.redhat.com/),
    instead of the stock that ships with root. You will also want to remove any software
    that you are not using, and/or replace it with more secure versions (such as replacing
    rsh with ssh).


    # General concepts, server workstations, etc


    There are many issues that affect security setup on a computer. How secure does
    it need to be? Will there be interactive user accounts (telnet/ssh)? Will users
    be using it as a workstation or is it a server? The last one has a big impact
    "workstations" and "servers" have traditionally been very different beasts, although
    the line is blurring with the introduction of very powerful and cheap PCs, as
    well as operating systems that take advantage of them. The main difference in
    today''s world between computers is usually not the hardware, or the OS (Linux,
    NT Server and NT Workstation are close family, etc.), it is software packages
    loaded (apache, X, etc.) and how users access the machine (interactive, at the
    console, and so forth). Some general rules that will save you a lot of grief in
    the run:


    1. Keep users off the servers. That is to say: do not give them interactive login
    shells, unless absolutely must.

    2. Lock down the workstations, assume users will try to ‘fix’ things (heck, they
    might be hostile, temp workers/etc).

    3. Use encryption wherever possible keep plain text passwords, credit card numbers
    and more sensitive information from lying around.

    4. Regularly scan the network for open ports/installed software/etc that shouldn''t
    be, compare it against previous


    Remember: security is not a solution, it is a way of life.


    Generally speaking workstations/servers are used by people who don''t really care
    about the underlying technology, they just want to get their done and retrieve
    their email in a timely fashion. There are many users who will have the ability
    to modify their workstation, for better or worse (install packet sniffers, warez
    ftp sites, www servers, bots, etc.). To add this more users have physical access
    to the workstations, you really have to lock them down if you want to do it.


    1. Use BIOS passwords to lock users out of the BIOS (they should never be in here,
    also remember that other BIOS''s have universal passwords.)

    2. Set the machine to boot from the appropriate harddrive only.

    3. Password the LILO prompt.

    4. Do not give the user root access, use sudo to tailor access to privileged commands
    as needed.

    5. Use firewall if they do setup services they won''t be accessible to the world.

    6. Regularly scan the table, open ports, installed software, and so on for change.

    7. Have a written security policy that users can understand, and enforce it.

    8. Remove all sharp objects (compilers, etc) unless needed from a system.


    Remember: security in depth.


    Properly setup, a Linux workstation is almost user proof (nothing is 100% secure),
    and generally a lot more stable than a comparable Windows machine. With the added
    joy of remote administration (SSH/Telnet/NS) you can keep your users happy and
    productive.


    Servers are a different ball of wax together, and generally more important then
    workstations (one workstation dies, one user is affected, the email/www/ftp/etc
    server dies your boss

