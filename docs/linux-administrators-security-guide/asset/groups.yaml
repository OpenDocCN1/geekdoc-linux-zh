    VIA SMB (Server Message Block), the protocol uses to share files and printers.
    It verifies the username and password (if required) and then gives access to the
    files according to the file permissions and so forth are set. I am only going
    to cover Samba 2.x, Samba 1.x is pretty old and obsolete.


