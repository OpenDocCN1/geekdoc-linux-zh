    虽然该软件尚未准备好供大众消费，但我认为应该提一下它，因为它是更大项目的一部分（Abacus 项目，http://www.psionic.com/abacus/）。基本上，Host
    Sentry 会构建一个用户访问的配置文件，然后将其与当前活动进行比较，以标记任何可疑活动。Host Sentry 位于：http://www.psionic.com/abacus/hostsentry。


    ## Pikt


    Pikt 是一个非常有趣的工具，它实际上更像是一种面向系统管理的脚本语言，而不是一个简单的程序。Pikt 允许你执行诸许多操作，如杀死空闲用户进程、强制邮件配额、监控系统是否存在可疑的使用模式（非工作时间等）等。Pikt
    唯一的问题可能是学习曲线曲线陡峭，因为它使用了自己的脚本语言，但我最终认为，如果你有许多系统需要管理，精通这种语言将是回报的（尤其是由于 Pikt 目前运行在
    Solaris、Linux 和 FreeBSD 上）。Pikt 位于：http://pikt.uchicago.edu/pikt/


    ## 基于网络的攻击检测


    ### NFR


    NFR（网络飞行记录器）远不止是一个数据包嗅探器，它实际上会记录数据并实时检测攻击、扫描等。这是一个非常强大的工具，需要投入大量的时间、精力和机器性能来运行，但它是检测领域中的顶端工具。NFR
    位于：http://www.nfr.com。


    ## 主机监控工具


    监控你的服务器和主机对于各种原因都非常重要，从追踪入侵到法律要求比应皆有。记住，防患胜于治疗。在“日志（Logging）”部分有多种监控工具可用，从 syslog
    到 audit（允许你审计用户文件、运行的程序等）。我强烈建议你使用它们。因为还有许多特定的程序可以监控系统状态并防止用户做他们不该做的事。


    ### bgcheck


    bgcheck 在后台运行并检查进程表以查找应该运行的项目（例如 irc 机器人、密码破解器等）。你可以从这里下载：http://blue.dhs.org/bgcheck/。


    ### Sxid


    Sxid 检查 setuid 和 setgid 的变化，生成文件的 MD5 签名，并通常允许你跟踪所做的任何更改。你可以在这里获取：ftp://marcus.seva.net/pub/sxid/


    ### Viperdb


    Viperdb 检查 setuid/setgid 程序和文件夹，并在发生任何更改时通知你，同时限制对它们的访问，它可以从这里处下载：http://www.resent.org/projects/viperdb/。


    ### Pikt


    Pikt 在上一节中介绍过，可以用于监控用户活动。我向大型安装推荐它，因为它非常灵活且强大。Pikt 位于：http://pikt.uchicago.edu/pikt/


    ### DTK


    欺骗工具包（Deception ToolKit）是一组程序，模拟已知服务以便向攻击者提供一组虚假的读数。其希望通过引导他们得出错误的结论来迷惑并减缓攻击者，你可以从这里下载
    DTK：http://all.net/dtk/


    ## 数据包嗅探器


    数据包嗅探是捕获并非指向你机器的网络数据的行为，通常用于查看机密/敏感流量，例如 telnet 会话或人们阅读电子邮件。遗憾的是，没有真正的方法可以检测数据包嗅探器，因为它是一种被动活动；但通过利用网络交换机和光纤骨干（这些很难被接管），你可以最大限度地减少威胁。


    ### tcpdump


    Linux 数据包嗅探器的鼻祖，这个工具自我记忆中以来就一直存在了，主要用于调试网络问题。它并不易于配置，缺乏较新数据包嗅探器的高级功能，但它可以很有用。大多数分发版都自带了
    tcpdump。


    ### sniffit


    我最喜欢的数据包嗅探器，sniffit 非常健壮，具有良好的过滤功能，可以将数据有效负载转换为 ASCII 文本以供阅读（如 telnet 会话），甚至有一个图形模式（非常适合监控整体活动/连接）。Sniffit
    位于：http://sniffit.rug.ac.be/sniffit/sniffit.html。


    ### Ethereal


    一个外观良好的网络协议分析器（又称为增强版嗅探器），它的界面与 NT 的网络监视器非常相似，并且始终便于查看。Ethereal 位于：http://www.wireshark.org/（注：现在改名为
    Wireshark）。


    ## 其他嗅探器


    - http://www.wireshark.org/

    - http://www.wincap.org/

    - http://www.tcpdump.org/

    - http://www.nmap.org/

    '
