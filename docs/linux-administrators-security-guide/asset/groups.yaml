    # 管理工具


    ## 访问


    ### Telnet


    Telnet 是目前最古老且广为人知的远程访问工具，几乎每个 Unix 系统都带有它，甚至连 NT 系统也支持它。只有当你能从命令提示符管理系统时（NT 系统并不擅长），Telnet
    才会真正有用，这使其非常适用于 Unix。Telnet 极不安全，密码、用户名以及会话数据均以明文形式传输，是嗅探器的首选目标。所有 Linux 发行版都带有
    Telnet。你永远不应该使用 telnet 来远程管理系统。


    ### SSL Telnet


    SSL Telnet 在 Telnet 的基础上增加了 SSL 加密，这使其变得更加安全、更可靠。通过使用 X.509 证书（也称为个人证书），你可以轻松地管理远程系统。与
    SSH 系统不同，SSL Telnet 是完全的 GNU 程序且供所有人免费使用。你可以从这里获取 SSLnet 服务器和客户端：http://ftp.replay.com/


    ### SSH


    SSH 最初是免费的，但现在采用了商业许可，不过它具有许多功能，使其值得使用。它支持多种形式的身份验证（密码、rho、RSA 密钥），允许你重定向端口，并轻松配置允许登录哪些用户。SSH
    可从这里获取：http://ftp.replay.com/。如果你打算将其用于商业，或者想获得最新版本，应该前往：http://www.ssh.fi/


    ### LSH


    LSH 是 SSH 协议的免费实现，LSH 采用 GNU 许可，并且开始看起来 SSH（从商业角度来看，SSH 已不再如此）的替代品。你可以从这里下载：http://www.net.lu.ac.uk/psst/，请注意它仍在开发中。


    ### REXEC


    REXEC 是较老的远程 Unix 工具之一，它允许你在远程系统上执行命令，它有一个严重的缺陷，即没有真正的安全模型。安全性是通过使用“hosts”文件来实现的，该文件指定了哪些主机/等可以运行命令，但这容易受到伪欺骗和其他形式的攻击。你永远不应该使用
    REXEC 来远程管理系统。


    ### Slush


    Slush 基于 OpenSSL，目前支持 X.509 证书，这对于大型组织来说，这比在各种服务器上记住几十个密码要好得多（也更明智）。Slush 是 GPL
    协议的，但尚未完成（它实现了大部分实用功能，但有局限性）。另一个完全基于开源软件，使得后门/等远程访问成为可能。最终，它可以使用更优的工具替代 SSH。你可以从这里获取：http://violet.ibs.com.au/slush/


    ### NSH


    NSH 是一款功能完备的商业产品（我的意思是全全）。它在构建时就支持加密，因此使用起来相对安全（我无法真正验证这一点，因为它不是开源）。易用性很高，你只需
    `cd //computername` 就能登录计算机，然后你可以轻松地复制/修改/等文件，运行程序并获取进程列表进行命令操作等。NSH 还有一个可用的 Perl
    模块，使得命令脚本编写变得简单，非常适合管理许多系统（如工作站）。此外，NSH 可用于多个平台（Linux、BSD、Irix 等）。NSH 可从这里获取：http://www.networkshell.com/，并可以轻松下载
    30 天的试用版。


    ### Fsh


    Fsh 代表“远程命令执行”，概念上与 rsh/rep 类似。它通过使用 ssh 建立加密隧道或在隧道上运行所有命令，避免了不断创建加密会话的消耗。你可以从这里获取：http://www.lysator.liu.se/fsh/


    ### secsh


    secsh（Secure Shell）提供了另一层登录安全，当你通过 ssh 或 SSL telnet 登录后，系统会提示另一个密码，如果你获取了 secsh，它会终止登录尝试。你可以在这里获取
    secsh：http://www.leenux.com/


    ## 本地


    ### YaST


    YaST（另一个设置工具）是一个功能完备的商业产品。它在构建时支持加密，因此使用起来相对安全（我无法真正验证这一点，因为它不是开源）。易用性很高，你只需 `cd
    //computername` 就能登录计算机，然后你可以轻松地复制/修改/等文件，运行程序并获取进程列表进行命令操作等。NSH 还有一个可用的 Perl
    模块，使得命令脚本编写变得简单，非常适合管理许多系统（如工作站）。此外，NSH 可用于多个平台（Linux、BSD、Irix 等）。NSH 可从这里获取：http://www.networkshell.com/，并可以轻松下载
    30 天的试用版。


    ### Fsh


    Fsh 代表“远程命令执行”，概念上与 rsh/rep 类似。它通过使用 ssh 建立加密隧道或在隧道上运行所有命令，避免了不断创建加密会话的消耗。你可以从这里获取：http://www.lysator.liu.se/fsh/


    ### secsh


    secsh（Secure Shell）提供了另一层登录安全，当你通过 ssh 或 SSL telnet 登录后，系统会提示另一个密码，如果你获取了 secsh，它会终止登录尝试。你可以在这里获取
    secsh：http://www.leenux.com/


