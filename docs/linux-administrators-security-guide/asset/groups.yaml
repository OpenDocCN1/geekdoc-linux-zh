    # TCP-IP and network security


    TCP-IP was created in a time and place where security wasn''t a very strong concern.
    Initially the ''Internet'' (then called Arpanet) consisted of very few hosts,
    all academic sites, corporations or government in nature. Everyone knew everyone
    else, and getting on the Internet was a pretty deal. The TCP-IP suite of protocol
    is remarkably robust (it hasn''t failed), but unfortunately it has no real provisions
    for security, i.e. authentication, verification, encryption and so. Spoofing packets,
    intercepting packets, reading data payloads, and so is remarkably easy in today''s
    Internet. The most common attacks are denial of service attacks that are the easiest
    to execute and the hardest to defeat, followed by packet sniffing, port scanning,
    and other related activities.


    Hostnames do not always point at the IP addresses and IP addresses do not always
    reverse lookup to the right hostname. Do not use hostname authentication if possible,
    DNS cache poisoning is relatively easy, relying on IP addresses for authentication
    reduces the problem to one of spoofing, but also is inherently flawed. There are
    no mechanisms within widespread to verify who sent data and who is receiving it
    (IP/IPv6 and VPN technology is starting to gain momentum however)


    You can start by banning data that claims to originate from your network(s), as
    this data is obviously spoofed, and prevent your users from spoofing attacks you
    should block all outbound data that is not from your IP addresses. This is relatively
    simple and easy to manage the vast majority of networks do not do it (I spent
    about a year pestering my ISP before they started). If everyone on the Internet
    had egress filters (that is restricted outbound traffic to that which) spoofing
    attacks would be impossible, and tracing attackers back to source would be easier.
    You should also block the reserved networks (127.*, 10.*, etc.), I have noticed
    many attacks from the Internet with packets labeled as those IPs, if you use network
    address translation (like IPMASQ) and do not have properly firewalled you could
    be easily attacked, or use to relay an attack to a third party.


    If you must communicate securely with people using VPN technology, the ''best''
    is probably IPSec, it is an open standard supported by all major vendors, and
    most major vendors have actual working implementations. Please see Appendix B
    or the Encrypting Services and Data section for more details.


    # IPSec


    IPSec is encryption at the packet level, it not only provides encryption of data
    but can provide authentication of the parties involved if you use a signed certificates
    (similar to signed PGP keys). Several certificate vendors (Verisigen, Thwaite
    to name) have plans to offer IPSec certificate signing, so that you would know
    for a fact who you are dealing with, and give you the ability to implement a company
    wide certificate architecture. IPSec is covered fully later in this document.


    # IPv6


    IPv6 provides no security per se, but it does have built in hooks for future enhancements,
    IPSec support and so on. If used on a network it would of course make life more
    difficult for an attacker as IPv6 use is not yet widespread. If you want to learn
    more visit: http://www.bieringer.de/linux/IPv6/. Linux currently supports Ipv6
    much completely (one of the few OS''s that does).


    # TCP-IP attack programs


    A variety of programs exist to cause TCP-IP disruption (most are Denial of Service
    attacks) however there are a few general purpose ones that can be useful to administrators.


    # HUNT Project


    The HUNT Project is a set of tools for manipulating TCP-IP connections (typically
    on an Ethernet LAN), that is it can reset connections, spy on them and do otherwise
    otherwise “naughty” things. It also includes a variety of ARP based attacks and
    other mischievous sources of fun, You can get HUNT at: http://www.cri.cz/kra/index.html.


    # PPP security


    PPP provides TCP-IP (as well as IPX/SPX, and NetBEUI) connections over serial
    lines (which can course be attached to modems). It is the primary method most
    people use to connect to the Internet (virtually all dial-up accounts are PPP).
    PPP connection essentially consists of two computing devices (computer, a Palm
    Pilot, a terminal server, etc) connected over a serial link (usually via modems),
    both ends invoke PPP, authentication is handled (one of several ways), and the
    link is brought up. PPP has no real support for encryption, so if you require
    a secure link you must invest in some of VPN software. Most systems invoke PPP
    in a rather clunky way, ''log in'' to the equipment (terminal server, etc) and
    then as your login shell is invoked, of this course your username and password
    are sent in clear text over the line, and you must have an account on that piece
    of equipment, in this case PPP does not handle the authentication at all. Somewhat
    safer way of handling this is to use PAP (Password Authentication Protocol), where
    the authentication is handled by PPP, so you do not require a real account on
    the server, however the username and password is still sent in clear text, but
    the system at somewhat safer. The third (and best) method for authentication is
    to use CHAP (Challenge Handshake Authentication Protocol), each side exchanges
    a public key, and uses it to encrypt data sent for the authentication, your username
    and password are relatively safe from snooping, however actual data transfers
    are sent normally. One caveat with CHAP, Microsoft''s implementation uses DES
    instead of MD5, making it slightly ''broken'' if connecting with a Linux client,
    there are patches available however to fix this. PPP ships with almost every Linux
    distribution as a core part of the OS, the Linux PPP-HOWTO is available at: http://www.interweft.com.au/other/ppp-howto/ppp-howto.html.


    # Basic network service security


    ## What is running and who is it talking to?


    You can''t start securing services until you know what is running. For this task
    netstat and nps, will tell you what is currently running (htop, inet, ...), netstat
    will tell you the status of ports, and finally we can look at the files. ps shows
    us status, the following is typical output:


