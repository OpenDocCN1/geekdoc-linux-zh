  mdcn: '


    # 作者前言


    我在 1993 年圣诞节买了我的第二台电脑（第一台不算，那是一台过了几个月就坏掉的 TRS-80），4 个月后为了删除了 Windows 改装了 OS/2，1994
    年春季又买了第二台电脑，并在 1994 年 7 月在上面安装了 Linux（Slackware 1.?）。我运行了 Slackware 大约 2-3 年，在了解并切换到
    RedHat 后，我转向了它。从那以后，我获得了了 MCSE 和 MCP+Internet 证书（加入黑暗面吧，卢克……）。我为什么要写这本指南？因为没有别人写过。为什么它在网上免费提供？因为我想触及尽可能广泛的受众。


    我还从整个互联网社区获得了关于本指南的帮助（包括直接和间接的帮助），许多人发布了优秀的与安全相关的网页，我已将其列出，而像 Bugtra 这样的邮件列表帮助我跟上最新动态。这听起来很陈词滥调（老天别让记者报道这件事），但如果没有开源社区，这一切是不可能实现的。感谢你们所有人。


    # 贡献


    欢迎各种贡献，特别是尚未列在此处的程序/资源 URL。至于实际的书面材料贡献，由于多种原因，我目前无法接受。


    # 本指南是什么，以及它不是什么


    本指南并不是一份通用的安全文档。本指南专门关于如何保护 Linux 操作系统免受通用和特定威胁的攻击。如果你需要对安全的概概述，请去 www.ora.com
    购买《Practical Unix and Internet Security》（《实用 Unix 与网络安全》）。

    O''Reilly 及其关联公司是我最喜欢的计算机书籍出版社之一（他们还制作很漂亮的 T 恤），附录列出了我推荐的其他各种计算机书籍。


    # 如何确定需要保护的内容以及如何保护


    你是否正在保护数据（专有的、机密的或其他）？你是否正尝试保持某些服务（你的邮件服务器、Web 服务器等）？你是否只想保护物理硬件免受损坏？你正在防止什么？恶意破坏（如
    8 Sun Enterprise 10000 的损坏）、删除（调查数据、你妈的食谱集）、篡改（带有医疗记录的物理介质、银行）、泄露（涉及诉讼的机密内部通信、应对未婚母亲的计划）。“坏”事件发生的概率有多大？网络探测（我每天都会遇到）、物理入侵（尚未发生在我身上）、社会工程学（“你好，我是
    IT 部门的 Bob，我需要你的密码以便我们重置……”）。


    你需要列出所有包含数据、提供服务、构成你公司基础设施等的资源（服务器、数据和其他组件）。以下是一个简短列表：


    - 物理服务器设备

    - 邮件服务器及服务

    - DNS 服务器及服务

    - WWW 服务器及服务

    - 文件服务器及服务

    - 公司内部数据，如会计记录和人力资源数据

    - 你的网络基础设施（线缆、集线器、交换机、路由器等）

    - 你的电话系统（PBX、语音信箱等）


    你需要确定你想要防止什么情况的发生：


    - 物理损坏（烟雾、水、食物等）

    - 数据的删除/修改（会计记录、你 WWW 网站的篡改等）

    - 数据泄露（会计数据等）

    - 服务连续性（保持邮件/网页/文件服务器正常运行）

    - 防止他人非法/不当使用你的服务（邮件垃圾邮件等）


    最后，事件发生的概率有多大？


    - 网络扫描——每天一次是稳妥的预期

    - 社会工程学——各异，通常最脆弱的人往往是目标人物

    - 物理入侵——视情况而定，通常罕见，但一个拿着电线钳的敌对员工在电信机房可以造成巨大破坏

    - 员工将你的数据卖给竞争对手——这种情况会发生

    - 竞争对手雇佣技术人员渗透你的网络——如果这种情况发生，没人会谈论它


    一旦你明确了内容，就可以采取相应的保护措施。


    '
