  mdcn: '

    ## COAS


    COAS 项目（Caldera Open Administration System）是一个非常有野心的项目，旨在为系统管理提供一个开放框架，范围涵盖了从命令行（带有半图形化界面）、X
    环境内（使用 qt 组件集）到 Web 端。它通过提供一个中间层来抽象实际的配置数据，使其适用于不同的 Linux 平台。版本 1.0 刚刚发布，看起来 Caldera
    终于在推进该项目。COAS 网站地址为：http://www.coas.org/。


    ## 系统文件


    ### /etc/passwd

    密码文件无疑是 Linux（以及大多数 Unix 系统）中最关键的系统文件。它包含了用户名、用户 ID（UID）以及用户所属的主组 ID（GID）的映射。它可能包含实际密码，但更可能（也安全得多）是使用影子密码将密码存储在
    `/etc/shadow` 中。该文件**必须**对世界可读，否则即使是像 `edit` 简单的命令也无法正常工作。GECOS 字段可以包含真实姓名、电话号码等数据；家目录是用户交互式登录时放置的默认目录；登录
    shell（login shell）必须是一个交互式 shell（如 bash 或菜单程序），并列在 `/etc/shells` 中，用户才能登录。其格式为：


    ```

    username:password:UID:GECOS_field:home_directory:login_shell

    ```


    ### /etc/shadow

    影子文件存储用户名和密码对，以及过期日期等账户信息和其他任何特殊字段。此文件必须不惜一切受到保护。


    ### /etc/groups

    组文件包含所有的组成员信息，以及可选项目如组密码（在当前系统中通常存储在 `gshadow` 中），此文件必须对世界可读，系统才能正常运行。其格式为：


    ```

    groupname:password:GID:member,member,member

    ```


    一个组可以不包含成员（即未未使用）、单个成员或多个成员，密码是可选的。


    ### /etc/gshadow

    与密码影子文件类似，此文件包含组、密码和成员。


    ### /etc/logins.def

    该文件（`/etc/logins.def`）允许你为各种程序（如 `usadd` 和密码过期）定义一些有默认值。它在不同的发行版甚至版本之间略有不同，但通常有良好的注释并倾向于包含合理的默认值。


    ### /etc/shells

    shells 文件包含有效 shell 列表，如果用户的默认 shell 未列在此处，他们可能无法进行交互式登录。更多信息请参见 Telnet 章节。


    ```

    /etc/securetty

    ```


    此文件包含 root 用户可以登录的 tty 列表。控制台 tty 通常是 `/dev/tty1` 到 `/dev/tty6`。串口（如果你想通过调制解调器以
    root 登录）通常是 `/dev/tty0` 及以上。如果你允许 root 通过网络登录（这是一个非常糟糕的主意，请使用 `sudo`），则添加 `/dev/ttyp1`
    及以上（如果有 30 个用户登录且 root 尝试登录，root 将来自 `/dev/ttyp31`）。通常你只应该允许 root 从 `/dev/tty1`
    登录，并且建议完全禁用 root 账户。


    ## 日志文件和其他监控形式


    任何 UNIX 系统的不可或缺的一部分是 Linux 中大部分日志由两个主要程序提供的：`syslog` 和 `klogd`。前者为程序和应用程序提供日志服务，后者为
    Linux 内核提供日志能力。内核实际上会将消息发送到 syslog 设施，但偶尔会在控制台上弹出消息（例如内核恐慌 kernel panic）。`syslog`
    负责处理消息并将其发送到适当的文件或设备，这在 `/etc/syslog.conf` 中配置。默认情况下，记录到文件的位于 `/var/log/`，通常处理自己日志的程序（如
    apache）会将日志记录到 `/var/log/proname/`；这使得日志集中化，并更容易将它们放置在单独的分区上（某些攻击可以很快填满你的日志，而分区分满可没意思了）。此外，有些程序有自己的内部日志，其中最有趣的是之一
    bash 命令行 shell。默认情况下，bash 在 `~username/.bash_history` 中保留执行过的命令历史，这个文件可能非常有阅读价值，因为很多管理员会无意中在命令行输入密码。Apache

    '
