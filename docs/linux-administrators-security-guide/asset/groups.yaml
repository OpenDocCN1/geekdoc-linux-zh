- md: '

    # Encrypting services / data


    ## Encrypting network services


    Virtually all network traffic is unencrypted and easily read by an attacker. If
    someone cracks a machine on your internet and installs a password sniffer (basically
    your common packet sniffer with a filter) your entire network can be compromised
    in a matter of hours. One ISP that shall remain nameless placed co-hosted customers
    on the same LAN, using a normal ethernet hub, means all machines can see each''s
    traffic (users retrieving email via pop, telnet sessions, and others). This is
    one of the many reasons why encrypting traffic is a good idea.


    Various mechanisms exist and/or are being developed to encrypt network traffic,
    at various levels of the network stack. Some schemes encrypt only the data sent
    (such as PGP encrypted email), some encrypt the session (SSL), and some the data
    payload of the packets (IPSec and VPNs). Ultimately the best solution will be
    IPSec (my opinion), as it requires no modifications to the applications, and provides
    for a very high level of security between computers. Microsoft does not support
    [it], which is a serious hindrance to any mass solution (to be fair Microsoft
    does not have IPSec support, but it is not ready yet). The best scheme currently
    available is SSL. Secure Sockets Layer, originally proposed by Netscape, encrypts
    the data at the server level, which is if your application supports SSL and the
    server supports SSL you are in. Most browsers, email/news readers, and a free
    ftp and telnet clients support SSL currently, for Linux most services can be SSL''ified.
    SSL does however require clients with SSL capabilities, something you won''t be
    able to get most people to support, which means SSL''ified services are typically
    restricted to within an organization. The SSL libraries are available at http://www.openssl.org.


    # SSL


    ### HTTP - SSL


    The common web server, Apache, has very good SSL support, which can be downloaded
    free of charge under the US (US patents on RSA/etc mean you have to pay royalties
    within the US, so the free software is illegal) from http://www.apache-ssl.org/.
    There are many commercial web servers that support SSL, the majority also based
    off Apache, such as RedHat Secure Server, Stronghold, and so forth.


    ### Telnet - SSL


    A drop in replacement for telnet, SSLnet and MZtel provide a higher level of security
    than old telnet, although SSLnet and MZtel are not flexible as SSH, they are practically
    free (i.e. GNU licensed) which SSL is not. The server and client packages are
    available as tarballs at: ftp://ftp.uni-mainz.de/pub/internet/security/ssl/, and
    as as RPM packages available at ftp://ftp.replay.ru/pub/relay/linux/redhat/


    ### FTP - SSL


    Also a drop in replacement for your favorite ftp (probably WuFTPD), also available
    as a set of patches for WuFTPD. This is highly appropriate as most servers have
    many users that require ftp access. The tarball is available at: ftp://ftp.uni-mainz.de/internet/security/ssl/,
    and RPM packages at ftp://ftp.replay.com/pub/linux/redhat.


    # Virtual private network solutions


    ### IPSec


    IPSec is a proposed (and now implemented in some operating systems) standard for
    IP level encryption. IPSec support vary, with some distributions shipping it,
    but the majority do not (us export laws are one reason). IPSec operates using
    public key cryptography, keys are exchanged and keyservers are also available
    (pluto, phyto, etc.). One major problem with IPSec is that the protocol has not
    been fully ratified as of yet, so implementations can vary. The Linux IPSec effect
    (Free/WAN) is hosted at: http://www.xs4all.net/~freeswan and it is headed by Canadians
    (my home and native land) is fully exportable to anywhere in the world that allows
    the use of strong crypto (exceptions being France, China, Libya, etc.). They just
    released 1.0, and are support for the 2.x series of kernels. The primary problems
    with Free/WAN currently (in my opinion) are the ways tunnels and routing are somewhat
    clunky, but they are working on it and making excellent progress.


    ### PPTP (Point to Point Tunneling Protocol)


    PPTP is a proprietary protocol controlled by Microsoft for VPN solutions. To date
    it has been shown to contain numerous and massive flaws. If you need to integrate
    Linux into a PPTP environment all not lost, http://www.moretonbuy.com/vpn/pptp.html
    contains an implementation of PPTP.


    ### CIPE (Crypto IP Encapsulation)


    CIPE is a free IP level encryption scheme, meant for use between routers. It is
    appropriate for ''bridging'' networks securely together over insecure networks
    (like the Internet). The official site for CIPE is at: http://sites.inka.de/~W10I1/devel/cipe.html.
    I would recommend Free/WAN as a better long term solution.


    ### ECLipt Secure Tunnel (current in beta)


    Another GNU licensed solution for Linux VPNs. Currently in beta (and not recommended
    for mass use) but I thought I should mention it since it seems to be a serious
    effort. The official page is at: http://eclipt.uni-klu.ac.at/projects/est/. Again
    I would have to recommend Free/WAN as a better long term solution.


    # Encrypting Data


    Several encryption programs are also available to encrypt your data, some at the
    file level (PGP, GPG, etc.) and some at the drive level (Cryptographic File System
    for example). These systems are very appropriate for the storage of secure data,
    and to some degree for the transmission of secure data (although both ends require
    the correct software, compatible versions, and an exchange of public keys will
    have to take place) which unfortunately an onerous task for most people. In addition
    to this you have no way of trusting someone''s public key unless you receive it
    directly from them (such as a key signing party), unless it is signed by someone
    else you trust (but how do you get the trusted signer''s key securely?). Systems
    for drive encryption such as CFS (CryptographicFileSystem) are typically easy
    to implement, and only require the user to provide a password or key of some form
    to access their files.


    # PGP (Pretty Good Privacy)


    The granddaddy of public encryption, this is by far one of the most popular programs
    as it is supported under Unix, Windows and Macintosh. Unfortunately it has now
    been commercialized, which has resulted in a loss of quality for users. I personally
    believe any software to encrypt or otherwise secure data MUST be open source or
    how else can you be sure it is. PGP is now stood by Network Associates and I cannot
    in good faith recommend it as a security mechanism for the secure storage and
    transmission of files. PGP is available for download from ftp://ftp.replay.com.


    # GnuPG (Gnu Privacy Guard)


    The alternative to PGP, GnuPG (Gnu Privacy Guard) is a direct replacement that
    is fully open and GNU licensed (if the name did not give it away). This tool is
    available at: http://www.gnupg.org/, as source code or precompiled binaries for
    windows, and RPMs.


    # CFS (Cryptographic Filesystem)


    CFS allows you to keep on your drive in an encrypted format, and is significantly
    easier to use than file encryption program (such as PGP) if you have many files
    and directories you want to keep away from curious people. The official distribution
    site is: http://www.cryptography.org/, and RPMs are available at ftp://ftp.replay.com/pub/replay/linux/redhat/,
    and Debian binaries are at: http://www.debian.org/Packages/stable/othersfs/cfs.html.


    # Sources of random data


    In order to be effective, especially on a large scale as IPSec across many hosts,
    sources of random, cryptographically secure data are. In Linux we have /dev/random
    and /dev/urandom which are good but not always great. Part of the equation is
    measuring ''random'' events, manipulating that data and making it available (via
    (u)random). These random events include: keyboard and mouse input, interrupts,
    drive reads, however as hard drives ship with more and more cache (IBM Descriptors
    come with 4 megabytes on drive, and more and more server have no keyboard/mouse
    used the sources of data become harder to find, some sources like network activity
    are not entirely appropriate because attacks may be measure to as well (granted
    this would be a very exotic attack, but enough to worry nonetheless). There are
    several sources of random data that can be used (or at least appear random), radioactive
    decay and radio frequency manipulations are two popular ones. The idea of sticking
    a radioactive device in a computer makes most people nervous. And using manipulated
    radio frequencies is prone to error, and the possibility of outside manipulation.

