  - '[PAGE 43]


    # TCP-IP and network security


    TCP-IP was created in a time and place where security wasn''t a very strong concern.
    Initially the ''Internet'' (then called Arpanet) consisted of very few hosts,
    all academic sites, corporations or government in nature. Everyone knew everyone
    else, and getting on the Internet was a pretty deal. The TCP-IP suite of protocol
    is remarkably robust (it hasn''t failed), but unfortunately it has no real provisions
    for security, i.e. authentication, verification, encryption and so. Spoofing packets,
    intercepting packets, reading data payloads, and so is remarkably easy in today''s
    Internet The most common attacks are denial of service attacks that are the easiest
    to execute and the hardest to defeat, followed by packet sniffing, port scanning,
    and other related activities.


    Hostnames do not always point at the IP addresses and IP addresses do not always
    reverse lookup to the right hostname. Do not use hostname authentication if possible,
    DNS cache poisoning is relatively easy, relying on IP addresses for authentication
    reduces the problem to one of spoofing, but also is inherently flawed. There are
    no mechanisms within wide spread to verify who sent data and who is receiving
    it (CIPE/IPv6 and VPN technology is starting to gain momentum however)


    You can start by banning data that claims to originate from your network(s), as
    this data is obviously spoofed, and prevent your users from spoofing attacks you
    should block all outbound data that is not from your IP addresses. This is relatively
    simple and easy to manage the vast majority of networks do not do it (I spent
    about a year pestering my ISP before they started). If everyone on the Internet
    had egress filters (that is restricted outbound traffic to that which) spoofing
    attacks would be impossible, and tracing attackers back to source would be easier.
    You should also block the reserved networks (127.*, 10.*, etc.), I have noticed
    many attacks from the Internet with packets labeled as those IPs, if you use network
    address translation (like IPMASQ) and do not have properly firewalled you could
    be easily attacked, or use to relay an attack to a third party.


    If you must communicate securely with people using VPN technology, the ''best''
    is probably IPSec, it is an open standard supported by all major vendors, and
    most major vendors have actual working implementations. Please see Appendix B
    or the Encrypting Services and Data section for more details.


    # IPSec


    IPSec is encryption at the packet level, it not only provides encryption of data
    but can provide authentication of the parties involved if you use a signed certificates
    (similar to signed PGP keys). Several certificate vendors (Verisigen, Thwaite
    to name) have plans to offer IPSec certificate signing, so that you would know
    for a fact who you are dealing with, and give you the ability to implement a company
    wide certificate architecture. IPSec is covered fully later in this document.


    # IPv6


    IPv6 provides no security per se, but it does have built in hooks for future enhancements,
    IPSec support and so on. If used on a network it would of course life'
