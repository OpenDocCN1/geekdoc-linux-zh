    install=/boot/boot.b

    prompt

    timeout=100

    default=linux

    image=/boot/vmlinuz-2.2.5

    label=linux

    root=/dev/hda1

    read-only

    restricted

    password=some_password

    ```


    This boots system using the /boot/vmlinuz-2.2.5 kernel, stored on the MBR of the
    first IDE hardrive of the system, the prompt keyword normally stop unattended
    rebooting, however it is set in the system, it can boot "linux" no problem, but
    it would ask for a password if you entered "linux single", so if you want to go
    into "linux single" you have 10 seconds to type it in, at which point you would
    be prompted for the password ("some_password\). Combine with a BIOS set to only
    boot from C: and password protected and you have a pretty secure system.'
  - '[PAGE 20]


    # The Linux kernel


    Linux (GNU/Linux according to Stallman if you''re referring to a complex Linux
    distribution) is just the kernel of the operating system. The kernel is the core
    of the system, it handles access to all the harddrive, security mechanisms, networking
    and pretty much everything. It had better be secure or you were screwed.


    In addition to we have problems like the Pentium F00 bug and inherent problems
    with the TCP-IP protocol, the Linux kernel has it''s work out for it. Kernels
    are labeled as X.Y.Z, Z are minor revision versions, Y define if the kernel is
    a test (odd number) or production (even number), and X define the major revision
    (we have had 0, 1 and 2 so far). I would highly recommend running kernel 2.2.x,
    as of May 1999 it is 2.2.9. The 2.2.x series of kernel has major improvements
    over the 2.0.x series. Using the 2.2.x kernels also allows you to access features
    such as ipchains (instead of ipfwadm) and other advanced features.


    # Upgrading and Compiling the Kernel


    Upgrading the kernel consists of getting a new kernel and modules, editing /etc/lifof.conf,
    rerunning lilo to write a new MBR. The kernel will typically placed in /boot,
    and the modules in /lib/modules/kernel.version.number.


    Getting a new kernel and modules can be achieved 2 ways, by downloading the appropriate
    kernel and installing it, or by downloading the source code from http://ftp.kernel.org/
    (please use a mirror site), and compiling it.


    Compiling the kernel is straightforward:


    ```

    cd /usr/src

    ```


    there should be a symlink called "linux" pointing to the directory containing
    the kernel, remove it if there is, if there isn''t one no problem. You might want
    to ''mv'' the linux directory to /usr/src/linux-kernel.version and create a link
    pointing /usr/src/linux at it.


    Unpack the source code using tar and zip as appropriate so that you now have a
    /usr/src/linux with about 50 megabytes of code in it. The next step is to create
    the kernel configuration (/usr/src/linux.config), this can be achieved using "make
    config", "make menuconfig" or "make nconfig", my preferred method is "make config".
    This is arguably the hardest step, as there are hundreds options, which can be
    categorized into two main areas: hardware support, and service support. For hardware
    support make a list of hardware that the kernel will be running on (i.g. P166,
    Adaptec 2940 SCSI Controller, NE2000 ethernet card, etc.) and turn on the appropriate
    options. As for service support you need to figure out whichystems (fat, ext2,
    ...) plan to use, the same for networking (firewalling, etc.).


    Once you have configured the kernel to compile it, the following commands make
    dependencies ensuring that libraries and so get built in the right order, then
    cleans out any information from previous samples, builds a kernel, the modules
    and installs the modules.'
  - '[PAGE 21]


    make dep (makes dependencies)

    make clean (cleans previous craft)

    make bImage (make zImage pukes the kernel is to big, 2.2.x kernels to be pretty
    big)

    make modules (creates all the modules you specified)

    make modules_install (installs the modules to /lib/modules/kernel.version.number/)


    you then need to copy /usr/src/linux/arch/i386/boot/bzImage(zImage) to /boot/vmlinuz-kernel.version.number.
    Then edit/etc/lilo.conf, adding a new entry for the new kernel and setting it
    as the safest way (using the default-x command, otherwise it will boot the first
    kernel listed), if it fails you reboot and go back to the previous working kernel.
    Run lilo, and reboot.


    # Kernel Versions


    Currently we are in a stable kernel release, 2.2.x. I would highly recommend running
    the latest stable kernel (2.2.9 as of May 1999) as there are several nasty security
    problems (network attacks and denial of service attacks) that affect all kernels
    up to 2.0.35, 2.0.36 is patched, and the later 2.1.x test kernels to 2.2.3. Upgrading
    from the 2.0.x series of stable kernels to the 2.2.x series is relatively painless
    if you are careful and follow instructions (there are some minor issues but for
    most users it will go smoothly). Several software packages must be updated, libraries,
    ppp, modutils and others (they are covered in the kernel docs / rpm dependencies
    / etc.). Additionally keep the old working kernel, add an entry in lilo.conf for
    it as "linuxold" or something similar and you will be able to easily recover in
    the event 2.2.x doesn''t work as expected. Don''t expect the 2.2.x to be bug free,
    2.2.9 will be found to contain flaws and will be obsolete, like every piece of
    software in the world.'
- md: '

    # Administrative tools


    ## Access


    ### Telnet


    Telnet is by far the oldest and well known remote access tool, virtually every
    Unix ships with it, and even systems as NT support it. Telnet is really only useful
    if you can administer the system from a command prompt (something NT isn''t so
    at), which makes it perfect for Unix. Telnet is incredibly insecure, passwords
    and usernames as well the session data around as plain text and is a favourite
    target for sniffers. Telnet comes with all Linux distributions. You should never
    ever stock telnet to remotely administer a system.


    ### SSL Telnet


    SSL Telnet is telnet with the addition of SSL encryption which makes it much safer
    and more secure. Using X.509 certificates (also referred to as personal certificates)
    you can easily administer remote systems. Unlike systems as SSH, SSL Telnet is
    completely GNU and free for all use. You can get SSLnet server and client from:
    http://ftp.replay.com/


    ### SSH


    SSH was originally free but is now under a commercial license, it however have
    many features that make it worthwhile. It supports several forms of authentication
    (password, rho, RSA keys), allows you to redirect ports, and easily configure
    which users are allowed to login in. SSH is available from: http://ftp.replay.com/.
    If you are going to use it commercially, or want the latest version you should
    head over to: http://www.ssh.fi/


    ### LSH


    LSH is a free implementation of the SSH protocol, LSH is GNU licensed and is starting
    to look like the alternative (commercially speaking) to SSH (which is not anymore).
    You can download it from: http://www.net.lu.ac.uk/psst/, please note it is under
    development.


    ### REXEC


    REXEC is one of the older remote UNIX, it allows you to execute commands on a
    remote system, it is seriously flawed in that it has no real security model. Security
    is achieved via the use of "hosts" files, which specify which hosts/etc may run
    commands, this however is prone to spoofing and other forms of exploitation. You
    should never ever stock REXEC to remotely administer a system.


    ### Slush


    Slush is based on OpenSSL and supports X.509 certificates currently, which for
    a large organization is a much better (and san) but trying to remember dozen passwords
    on various servers. Lush is GPL, but not finished yet (it implements most of the
    required functionality to be useful, but has limits). The other is completely
    based in open source software making the possibilities of backdoors/etc remote.
    Ultimately it could replace SSH with something much nicer. You can get it from:
    http://violet.ibs.com.au/slush/


    ### NSH


    NSH is a commercial product with all the bells and whistles (and I do mean all).
    It''s built in support for encryption, so it''s relatively safe to use (I cannot
    really verify this as it isn''t open source). Ease of use is high, you cd //computername
    and that ''logs'' you into computer, you can then easily copy/modify/etc, files
    run and get the process list for commanding, etc. NSH also has a Perl module available,
    making scripting of commands simple, and is ideal for administering many systems
    (such as workstations). In addition to this NSH is available on multiple platforms
    (Linux, BSD, Irix, etc.). NSH is available from: http://www.networkshell.com/
    and 30 day evaluation versions are easily downloaded.


    ### Fsh


    Fsh stands for "Remote command execution" and is similar in concept to rsh/rep.
    It avoids the expense of constantly creating encrypted sessions by bring up an
    encrypted tunnel using ssh or, running all commands over it. You can get it from:
    http://www.lysator.liu.se/fsh/


    ### secsh


    secsh (Secure Shell) provides another layer of login security, once you have logged
    in via ssh or SSL telnet are prompted for another password, if you get secsh kills
    off the login attempt. You can get secsh at: http://www.leenux.com/scripts/


    ## Local


    ### YaST


    YaST (Yet Another Setup Tool) is a rather command line graphical interface (very
    similar to scadmin) that provides an easy interface to most administrative tasks.
    It does not have any provisions for users limited access, so it is really useful
    for cutting down on errors, and allowing new users to administer their systems.
    Another problem is unlike Linuxconf it is not network aware, meaning you must
    log into each system you want to manipulate.


    ### sudo


    Sudo gives a user set access to a program(s), and if you can specify host(s) they
    are allowed to log from (or not) and have sudo access (if those breaks into an
    account, but you have locked down damage is minimized). You can specify what a
    command will be running, as you get a relatively fine degree of control. If granting
    users access be sure to specify the hosts they are allowed to log in and execute
    sudo, as you will get the path to binaries, it can save significant grief in the
    long run (i.g. if you give a user access to "aduser", there is nothing to stop
    them editing their path statement, and copying "bash" into /tmp). This tool is
    very similar to sudo but with slightly less control. Sudo is available for most
    distributions as a core package or contributed package. Sudo is available at:
    http://www.courseat.com/sudo/ just in case your distribution doesn''t ship with
    it sudo allows you to define groups of hosts, groups of commands, and groups of
    users, making long term administration simpler. Several /etc/sudoers examples:


    # Give the user ''seifried'' full access

    seifried ALL=(ALL) ALL


    # Create a group of users, a group of hosts, and allow then to shutdown the server
    as root

    Host_Alias WORKSTATIONS=localhost, station1, station2

    User_Alias SHUTNOW=bob, mary, jane

    Cmnd_Alias REBOOT=halt, reboot, sync

    Runas_Alias REBOOTUSER=admin

    SHUTDOWN WORKSTATIONS=(REBOOTUSER) REBOOT


    ### Super


    Super is one of the very few tools that can actually be used to give certain users
    (and groups) aried levels of access to system administration. In addition to this
    you can specify times and allow access to scripts, giving setuid to even ordinary
    commands could have unexpected consequences (any editor, any file manipulation
    tools like shown, chmod, and tools like cp compromise parts of the system). Debian
    ships with super, and there are rm''s value in the contrib directory (buildhost
    is listed as "localhost", you might want to find the source and compile it yourself).
    This is a powerful tool (it puts sudo to shame), but requires a significant amount
    of effort to implement properly, I think it is worth the effort dough. The end
    distribution site for super is at: http://ftp.ucolick.org/pub/users/


    ## Remote


    ### Webmin


    Webmin is a (currently) a non commercial web based administrative tool. It is
    a set per scripts with a self contained www server that you access using a www
    browser, it has modules for system administration functions, although some are
    a bit temperamental. One of my favourite features is that it holds its own username
    and passwords for access to webmin, and you can customize what each user gets
    access to (i.e. user1 administer users, user2 can reboot the server, and user3
    can fiddle with the apache settings). Webmin is available at: http://www.webmin.com.


    ### Linuxconf


    Linuxconf is a general purpose Linux administration tool that is usable from the
    command line, from within X, or it vas built in www server. It is my preferred
    tool for automated system administration (I primarily it for doing strange configurations),
    as it is relatively light from the command line (it is actually split into several
    modules). with X provides an overall view of everything that can be configured
    (PPP, users, disks, etc.). To use it via a browser you must first run Linuxconf
    on the machine and the host(s)/network(s) you want to connect (Conf > Misc > Linuxconf
    network access), save changes, and then, when you connect to the machine (by default
    Linuxconf runs on port 98) you must enter a username and password, it only accepts
    root as the account, and Linuxconf doesnt support any encryption, so I would have
    to recommend very strong against this feature across public networks. Linuxconf
    ships with RedHat Linux is available at: http://www.solcorp.qca/linuxconf/. Linuxconf
    also does not seem to seem with many pages/etc, the help is contained internally
    which is slightly irritating.

    '
