    此邮件可能会被投递到我的本地邮箱，或者一个备份邮箱（以防我删除了某封本不想删除的邮件，或者上帝保佑，Outlook 干扰了某人并搞乱了我的邮箱）。这对于公司也有用，因为你现在有了按用户备份的所有入站邮件，并且可以允许（或不允许）访问备份的邮件文件。


    一种方法是使用针对域名的捕获规则（例如 @seifried.org），你可以为每一个账户和邮件列表创建一个别名。否则，当它在列表中查找并没有找到条目（例如对于
    mailing-list@seifried.org）时，它将将其发送到捕获别名指定的邮箱箱。由于这个原因，你可能不想使用捕获规则。


    第二种方法非常简单，你只需带 -x 选项启动 sendmail 并指定一个记录所有事务的文件。这个文件会迅速变得非常大，除非你绝对必须，否则我不建议使用这种方法记录邮件。


    防火墙通过端口 25 发送出去，tcp：


    ```

    ipfw -I a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 25

    ipfw -I a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 25

    ipfw -I a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/0 25

    ```


    或者


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 25

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 25

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 25

    ```

