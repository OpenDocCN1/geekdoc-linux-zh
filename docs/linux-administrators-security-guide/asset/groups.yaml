    # DHCPD


    DHCPD 是所有网络管理员都应该使用的工具。它允许你向请求网络设置/等信息的客户端提供服务，这意味着网络连接所需的客户端设置只需保持默认值并开启机器即可。它还允许你轻松地重新配置客户端（例如从
    10.0.1.0 移动到 10.0.2.0，或使用一组新的 DNS 服务器）。从长期来看（以及短期内也是如此），DHCP 将为你节省大量工作、金钱和精力。我在家里运行它，只有
    8 个客户端，发现生活变得简单多得多。DHCPD 由 ISC 维护，地址为：http://www.isc.org/dhcp.html。


    我强烈建议你运行 DHCPD 2.x（3x 处于 alpha 阶段），它有很多新功能，而且易于设置和使用。不过，该程序的绝对版本往往有点神经质，请注意它是
    beta 软件。务必不要将 DHCPD 暴露在互联网上。DHCP 流量应该只在本地网段上运行，可能会被转发到另一个网段的 DHCP 服务器，但你在互联网上看到的唯一
    DHCP 流量将是攻击/DoS（它们可能会恢复你所有的 IP，让你的客户端孤立无援）。如果你要在互联网上转发 DHCP 流量，**千万不要**。出于多种原因，这是一个一个坏主意（主要是性能/可靠性，也包括安全性）。


    我建议 DHCP 服务器仅作为一个 DHCP 服务器，锁定在某个地方（如果你依赖 DHCP 运行网络，而 DHCP 服务器故障，你的网络将面临严重问题），允许它快速运行，如果你需要跨越子网（如果你有多个服务器，其中只有一个服务器物理连接了
    DHCP 服务器），请使用 DHCP 中继（NT 没有内置功能，Linux 的 DHCP 软件具有此能力，等）。NT 和 DHCP 之间也存在已知问题，NT
    RAS 有一个糟糕的习惯，会疯狂地吸取 IP 地址（我见过一个 NT 服务器抢占了 64 个地址并无限期保留），因为它正尝试为将拨入/拨出的客户端预留 RAS
    IP。要么关闭 NT 的 RAS，要么将其放在它单独的子网中，它发送给 DHCP 服务器的 MAC 地址非常奇怪（并且在前几个字节中拼写出 RAS），并且很容易进行映射。


    DHCPD 包含 2 个可执行文件：


    - dhcpd - DHCP 服务器

    - dhrelay - 一个 DHCP 中继程序（用于将请求中继到中央 DHCP 服务器，因为 DHCP 是基于广播的，而广播通常不会（也不应该）跨越路由器/以太卡。）


    DHCPD 需要 2 个库文件：


    - /lib/dhcp-linux.so.2

    - /lib/libc.so.6


    一个配置文件：


    - /etc/dhcpd.conf - 配置信息、启动文件位置等。


    以及其他一些杂项文件：


    - /etc/dhcpd.leases - 活动租约列表

