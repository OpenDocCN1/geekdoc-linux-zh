  - '[PAGE 121]


    # Disinfection of virii / worms / trojans


    Back up your data, format and reinstall the system from known good media. Once
    an attacker has root on a Linux system they can literally do anything, from compromising
    gcc/egcs to leading increasing kernel modules at boot time. Do not run untrusted
    software as root. Check the PGP signatures on files you download, etc. An ounce
    of prevention will pretty much block the spread of virii, worms and trojans under
    Linux.


    The easiest method for dealing with virii and the like is to use system integrity
    tools such as tripwire, L5, and Gog&Magog, you will be able to easily find which
    files have been compromised and restore/replace/update them.


    # Virus Scanners


    As stated above virii aren''t a real concern in the Linux world, however virus
    scanners that run on Linux can be useful. Filtering email / other forms of content
    at the gateways to your network can provide an extra line of strong defense since
    the platforms providing the defense against the threat cannot be compromised by
    that threat.


    # AMaViS


    AMaViS uses third party scanning software (such as McAfee) to scan incoming email
    for virii. You can get AMaViS at: http://aachalon.de/AMaViS.'
  - '[PAGE 122]


    # Password storage


    This is something many people don''t think about. How can you securely store passwords?
    The most obvious method is to memorize them, however this has''s drawbacks, if
    you manage 30 different sites you generally want to have 30 different passwords,
    and a good password is 8+ characters in length and generally not the easiest thing
    to remember. This leads to many people using the same passwords on several systems
    (come on, admit it). One of the easiest methods is to write passwords down, this
    BIG NO-NO, you''d be surprised when people find lying around, and what they find
    if they are looking for it. A better option is to store passwords in an encrypted
    format, usually electronically on your computer or palm pilot, this way you only
    have to remember one password to unlock the rest which you can then use. Something
    as simple as PGP or GnuPG can be used to accomplish this.


    # Gpasman


    Gpasman is an application that requires gtk (relatively easily to install on a
    non Gnome system, just load the gtk libs) and encrypts your passwords using the
    rc2 algorithm. Upon startup of the program you type in your master password, and
    assuming it is correct you are presented with a nice list of your user accounts,
    sites, passwords and a comment field. Gpasman is available at: http://www.student.wau.nl/~olivier/gpasman/'
  - '[PAGE 123]


    # Conducting baselines / system integrity


    One major oversight by a lot of people when securing their machines is that they
    forget to create a baseline of the system, which is a profile of the system, its
    usage of resources, and so on in normal operation. For example something simple
    as a "netstat -n > netstat-output" can give you a reference to later check and
    see if any ports are open that should not be. Memory usage and disk usage are
    also good things to keep an eye on, a sudden surge in memory usage could result
    in the system being starved of resources, likewise for disk usage, it might be
    an error, a malicious user, or a worm program that has compromised your system
    is now scanning others. Various tools exist to measure and disk usage: vmstat,
    free, df, du, all of which are covered by their respective managers.


    At the very minimum make a full system backup, and regularly backup config files
    and logs, this can also help you when you pinpoint an intrusion occurred (user
    account "rewrt") was added after the 4th backup, which is not in the March 20
    backup). Once a system is compromised a "rootkit" is installed, these of trojaned
    binaries, are near impossible to remove safely, you are better off formatting
    the disk and starting from scratch. There is course no exception to this rule,
    if you were diligent and used file/directory integrity tools such as L5 you would
    be able to pinpoint the affected files easily and deal with them.


    # Tripwire


    Tripwire is no longer a source tool, I have absolutely NO problems with commercial
    software, but when I expect me to rely on a program to provide security, when
    I (no anyone else really) can easily view the source (it is available under some
    special license agreement, probably an NDA) I must decline. Tripwire costs $70
    approximately for Linux, and is only available as an RPM package aimed (tripwire
    is $500 for other operating systems), which is rather on the high side for a piece
    of software that can easily be replaced with alternatives such as L5. Tripwire
    is available at: http://www.tripwiresecurity.com.


    # L5


    There is an alternative to tripwire however, L5, available at: ftp://avian.org/src/hacks/,
    it is completely free and very effective. I would definitely recommend this tool.


    # Gog&Magog


    Gog&Magog creates a list of system file properties, owner, permissions, an MD5
    signature of the file and so (similar to tripwire). You can then have it automatically
    compare this and ensure any changed files/etc come to your attention quickly.
    As well as recovering from a break in simpler as you''ll know which files were
    compromised. You can download Gog&Magog from: http://www.multimania.com/cparisel/gog/


    # confcollect


    confcollect is a simple script that collects system information such as routing
    tables, rpm''s installed and the like. You can download it from: http://www.skagelund/confcollect/'
  - '[PAGE 124]


    # Backups


    Something people forget about, but you can compare the current files to old backups,
    many backup formats (Tape, floppy, CDR, etc.) can be made read only, so a backup
    of a newly installed system provides a good benchmark to compare things to. The
    utility "diff" and "cmp" can be used to compare files against each other. See
    the backup session for a full listing of free and commercial software.'
  - '[PAGE 125]


    # Conducting audits


    So you''ve secured your machines, and done all the things that needed to be done.
    How do you make sure it''s actually doing what it is supposed to do, or prove
    to someone that it is as secure as you say it is? Well conduct an audit. This
    can be as simple as reviewing the installed software, configuration files and
    other settings, or as complex as putting together a hiring tiger team (or ethical
    hackers, or whateverword/s you prefer) to try and penetrate your security. If
    they can''t then you did your job well (or they suck), and if they do get in,
    know what needs to be fixed (this is also a good method to get an increased security
    budget, show how vulnerable you are to the CIO).


    There are also many free tools and techniques you can use to conduct a self audit
    and ensure that the systems react as you think they (we all make errors, but catching
    them quickly and correcting them is what makes a great administrator). Tools such
    as nmap, ness, crack, and so forth can be quickly employed to scan your network(s)
    and host(s), finding any obvious problems quickly. I also suggest you go over
    your config files every once in a month, sometimes I discover a small mistake,
    or something I forgot forgot to set previously). Keeping systems in a relative
    state of synchronization (I just recently finished moving ALL my customers to
    Kernel 2.2.x, ipchains) which will save you a great deal of time and energy.


    Using the tools mentioned earlier in “Conducting baselines” you can check file
    integrity using tripwire, L5, backups or other methods. Another tool that is useful
    for check binaries is the “strings” commands, it shows readable information in
    binary files, and is especially useful if someone forgot to run “strip” on their
    binaries after compiling them (people have gotten lucky and gotten the directory
    from which the exploit was compiled, allowing them to trace down the exact user).'
  - '[PAGE 126]


    # Backups


    I don''t know how many times I can tell you, but it never ceases to amaze me how
    often people are surprised by the fact that they do not backup their data, the
    drive craters out on, or they hit ''delete'' without thinking it will be gone.
    Always backup your system, even if it just the config files, you''ll save yourself
    time and money in the run. To backup your data under Linux there are many solutions,
    all with various pros and cons. There are also several industrial strength backup
    programs, the ones that support network backups which are a definite plus in a
    large non-homogenous environment


    # Tar and Gzip


    Oldbies but still goldies, tar and gzip. Why? Because like vi can darn near the
    farm on the fact that any UNIX system will have tar and gzip. They may be slow,
    klunky and starting to show their age, it''s a universal tool that will get the
    job done. I find with Linux the installation of a typical system takes 15-30 minutes
    depending on the speed of the network/cdrom, configuration another 5-15 (assuming
    I have backups or it is very simple) and data restoration takes as long as it
    takes (definitely not whatever you rush). Good example: I backed up a server and
    then proceeded to blow the filesystem away and remove 2 physical HDX that I longer
    needed), I then installed RedHat 5.2, and reconfigured all 3 network cards, apache
    (for about 10 virtual sites), Bind and several other services in about 15 minutes.
    Simply.


    ```

    tar -cvf archive-name.tar dir1 dir3...

    ```


    to create the backup of all your files (typically /etc, /var/spool/mail/, /var/log/,
    /home/, and any other user/system data), followed by: gzip -9 archive-name.tar
    to compress it as possible (generated hardrive space is cheaper than the politicians
    promise that compressing makes it easier to move around). You might want to use
    bzip, which is a bit better than gzip at compressing text, but it is a bit slower.
    Typically then make a copy of the archive on a remote server, by fptyping it or
    emailing it as an attachment if it''s not to be big (i.e. the backup of a typical
    firewall is around 100k or so of config files).


    # Non Commercial Backup Programs for Linux


    Amanda


    Amanda is a client/server based backup programs with support for most unices and
    Windows (via SAMBA). Amanda is BSD style licensed and available from: http://www.amanda.org.


    afbackup


    Afbackup is another client/server with a generally GPL license with one minor
    exception, development of the server portion on Windows is forbidden. Afbackup
    has server support for Linux, HP-UX and Solaris, and has clients for that windows.
    You can download it at: ftp://ftp.zn-gmbl.com/pub/linux/'
- md: '

    # Burt


    Burt is a Tcl/Tk based set of extensions that allow for easy backups of Unix workstations,
    this allows it to run on pretty any system. Burt is a client/server architecture
    and appears pretty scalable, it is available at: http://www.cs.wisc.edu/~jmelski/b/


    # Commercial Backup Programs for Linux


    ## BRU


    RedHat ships with a nice backup program (well a demo version anyways) called BRU
    (Backup and Restore Utility), this thing has been in the Linux world since as
    long as Linux Journal (they have had ads there since the beginning). This program
    affords a relatively complete set of tools in a nice unified format, with command
    line and a graphical front end (easy to automate in other words). It supports
    full, incremental and differential backups, as well as catalogs, and can write
    to a file or tape drive a solid, simple, easy to use backup program, it ships
    with RedHat Linux (one license), so if you bought RedHat you should have a copy
    to play with. BRU is available at http://www.estinc.com/features.html.


    ## Quickstart


    Quickstart is more aimed at making an image of the system that when the hard drive
    fails/etc, you can quickly re-image a blank disk with a working system. It can
    also be used to ''master'' a system and load other systems (as an alternative
    to RedHat''s kickstart). It''s reasonably priced as well as garnered a good revue
    in Linux Journal (Nov 1998, page 50). You can get it at: http://www.estinc.com/qsdr.html.


    ## Backup Professional


    http://www.unitrends.com/bp.html


    ## CTAR


    http://www.unitrends.com/ctar.html


    ## CTAR:NET


    http://www.unitrends.com/ctarnet.html


    ## PC ParaChute


    http://www.unitrends.com/pcpara.html


    ## Arkeia


    Arkeia is a very powerful backup program with a client-server architecture that
    supports many platforms. This is an ''industrial'' strength product and appropriate
    for heterogeneous environments it was reviewed in Linux Journal (April 1999).


    ## Legato Networker


    Legato Networker is another enterprise class backup program, with freely available
    (but unsupported) Linux clients. Legato Networker is available at: http://www.legato.com/Products/html/legato_networker.html
    and the Linux clients are available from: http://feral.com/networker.html.


    # Pro''s and Cons of Backup Media


    There are more things to back data up then you can give a drive range over but
    here are some of the more popular/sane alternatives:


    | Media | Pro''s | Cons |

    | :--- | :--- | :--- |

    | Hard Drive | It''s fast. It''s cheap. It''s pretty reliable. ($20-$30 USD per
    gig) | It might not be big enough, and they do fail, usually at the worst possible
    time. Harder to take off as well. RAID is a viable option though. 20 gig drives
    are $50 now. |

    | CDROM | Not susceptible to the developed everyone in the world has a CDROM drive.
    Media is also pretty sturdy and cheap ($2 USD per 650 Megs or so) | CDROM''s have
    a finite life of 5-15 years, and not all recorders are equal. Keep away from sunlight,
    and make sure you have a CDROM drive that will read |

    | Tape | It''s reliable, you can buy tapes, tape carousels and robots, they''re
    getting cheap enough for everyone | Magnetic, finite life span can be easily damaged
    (get what you pay for), make the tapes can be read on other drives (in the case
    the server burns down...). |

    | Floppies | I''m not kidding, there are rumors people still use this to backup
    data. | It''s a floppy. Whadda thinks? |

    | Zip Drives | I have yet to damage, nor have my cats. They 100 megs are good
    enough for most single user machines. | Not everyone is a zip drive, and they
    are magnetic. |

    | Jazz Drives | 1 or 2 gig removable hardwards, by $5 averages 5 megs/sec writes.
    | They die. I''m on my third drive. The platters also have a habit of going used
    if needed. |

    | Syquest | 1.6 gigs, sealed platter, same as above. | Sealed cartridges are more
    reliable. Company did recently declare bankruptcy though. No warranty service
    |

    | LS120 | 120 Megs, and cheap, gaining in popularity. | Slow I''m not kidding.
    120 megs over a floppy controller to something that is advertised as "up to 3-4
    times faster than the floppy drive". |

    | Printer | Very long shelf life, requires a standard Mark 1 human as a reading
    device. Handy for showing consultants and as reference material. Cannot be easily
    altered. | You wanna retype a 4000 entry password file? OCR is another option
    as well. |


