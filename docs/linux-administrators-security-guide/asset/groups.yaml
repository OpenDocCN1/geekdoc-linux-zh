    remote system, it is seriously flawed in that it has no real security model. Security
    is achieved via the use of "hosts" files, which specify which hosts/etc may run
    commands, this however is prone to spoofing and other forms of exploitation. You
    should never ever stock REXEC to remotely administer a system.


    # Slush


    Slush is based on OpenSSL and supports X.509 certificates currently, which for
    a large organization is a much better (and san) but trying to remember dozen passwords
    on various servers. Lush is GPL, but not finished yet (it implements most of the
    required functionality to be useful, but has limits). The other is completely
    based in open source software making the possibilities of backdoors/etc remote.
    Ultimately it could replace SSH with something much nicer. You can get it from:
    http://violet.ibs.com.au/slush/'
  - '[PAGE 23]


    # NSH


    NSH is a commercial product with all the bells and whistles (and I do mean all).
    It''s built in support for encryption, so it''s relatively safe to use (I cannot
    really verify this as it isn''t open source). Ease of use is high, you cd //computername
    and that ''logs'' you into computer, you can then easily copy/modify/etc, files
    run and get the process list for commanding, etc. NSH also has a Perl module available,
    making scripting of commands simple, and is ideal for administering many systems
    (such as workstations). In addition to this NSH is available on multiple platforms
    (Linux, BSD, Irix, etc.). NSH is available from: http://www.networkshell.com/
    and 30 day evaluation versions are easily downloaded.


    # Fsh


    Fsh stands for "Remote command execution" and is similar in concept to rsh/rep.
    It avoids the expense of constantly creating encrypted sessions by bring up an
    encrypted tunnel using ssh or, running all commands over it. You can get it from:
    http://www.lysator.liu.se/fsh/


    # secsh


    secsh (Secure Shell) provides another layer of login security, once you have logged
    in via ssh or SSL telnet are prompted for another password, if you get secsh kills
    off the login attempt. You can get secsh at: http://www.leenux.com/scripts/


    # Local


    # YaST


    YaST (Yet Another Setup Tool) is a rather command line graphical interface (very
    similar to scadmin) that provides an easy interface to most administrative tasks.
    It does not have any provisions for users limited access, so it is really useful
    for cutting down on errors, and allowing new users to administer their systems.
    Another problem is unlike Linuxconf it is not network aware, meaning you must
    log into each system you want to manipulate.


    # sudo


    Sudo gives a user set access to a program(s), and if you can specify host(s) they
    are allowed to log from (or not) and have sudo access (if those breaks into an
    account, but you have locked down damage is minimized). You can specify what a
    command will be running, as you get a relatively fine degree of control. If granting
    users access be sure to specify the hosts they are allowed to log in and execute
    sudo, as you will get the path to binaries, it can save significant grief in the
    long run (i.g. if you give a user access to "aduser", there is nothing to stop
    them editing their path statement, and copying "bash" into /tmp). This tool is
    very similar to sudo but with slightly less control. Sudo is available for most
    distributions as a core package or contributed package. Sudo is available at:
    http://www.courseat.com/sudo/ just in case your distribution doesn''t ship with
    it sudo allows you to define groups of hosts, groups of commands, and groups of
    users, making long term administration simpler. Several /etc/sudoers examples:'
  - '[PAGE 24]


    # Give the user ''seifried'' full access


    seifried ALL=(ALL) ALL

    nCreate a group of users, a group of hosts, and allow then to shutdown the server
    as root

    Host_Alias WORKSTATIONS=localhost, station1, station2

    User_Alias SHUTNOW=bob, mary, jane

    Cmnd_Alias REBOOT=halt, reboot, sync

    Runas_Alias REBOOTUSER=admin

    SHUTDOWN WORKSTATIONS=(REBOOTUSER) REBOOT


    # Super


    Super is one of the very few tools that can actually be used to give certain users
    (and groups)

    aried levels of access to system administration. In addition to this you can specify
    times and

    allow access to scripts, giving setuid to even ordinary commands could have

    unexpected consequences (any editor, any file manipulation tools like shown, chmod,
    and

    tools like cp compromise parts of the system). Debian ships with super, and there
    are

    rm''s value in the contrib directory (buildhost is listed as "localhost", you
    might want to

    find the source and compile it yourself). This is a powerful tool (it puts sudo
    to shame),

    but requires a significant amount of effort to implement properly, I think it
    is worth the effort

    dough. The end distribution site for super is at: http://ftp.ucolick.org/pub/users/


    # Remote


    # Webmin


    Webmin is a (currently) a non commercial web based administrative tool. It is
    a set per

    scripts with a self contained www server that you access using a www browser,
    it has

    modules for system administration functions, although some are a bit temperamental.

    One of my favourite features is that it holds its own username and passwords for

    access to webmin, and you can customize what each user gets access to (i.e. user1

    administer users, user2 can reboot the server, and user3 can fiddle with the apache
    settings).

    Webmin is available at: http://www.webmin.com.


    # Linuxconf


    Linuxconf is a general purpose Linux administration tool that is usable from the
    command

    line, from within X, or it vas built in www server. It is my preferred tool for
    automated

    system administration (I primarily it for doing strange configurations), as it
    is

    relatively light from the command line (it is actually split into several modules).

    with X provides an overall view of everything that can be configured (PPP, users,
    disks,

    et.). To use it via a browser you must first run Linuxconf on the machine and
    the

    host(s)/network(s) you want to connect (Conf > Misc > Linuxconf network

    access), save changes, and then, when you connect to the machine (by default Linuxconf

    runs on port 98) you must enter a username and password, it only accepts root
    as the account,

    and Linuxconf doesnt support any encryption, so I would have to recommend very
    strong

    against this feature across public networks. Linuxconf ships with RedHat Linux
    is

    available at: http://www.solcorp.qca/linuxconf/. Linuxconf also does not seem
    to seem with

    many pages/etc, the help is contained internally which is slightly irritating.'
- md: "\n## COAS\n\nThe COAS project (Caldera Open Administration System) is a very\
    \ ambitious project to provide an open framework for administering systems, from\
    \ a command line (with semi graphical interface), from within X (using the qt\
    \ widget set) to the web. It abstracts the actual configuration data by providing\
    \ a middle layer, thus making it suitable for use on disparate Linux platforms.\
    \ Version 1.0 was just released, so it looks like Caldera is finally pushing ahead\
    \ with it. The COAS site is at: http://www.coas.org/.\n\n## System Files\n\n###\
    \ /etc/passwd\nThe password file is arguably the most critical system file in\
    \ Linux (and most unices). It contains the mappings of username, user ID and the\
    \ primary group ID that person belongs to. It may contain the actual password\
    \ however it is more likely (and much more secure) to use shadow passwords to\
    \ keep the passwords in /etc/shadow. This file MUST be world readable, otherwise\
    \ commands even as simple as edit will fail to work properly. The GECO field can\
    \ contain such data as the real name, phone number and the like for the user,\
    \ the home directory is the default directory the user places if they log in interactively,\
    \ and the login shell must be an interactive shell (such as bash, or a menu program)\
    \ and listed in /etc/shells for the user to log in. In the format:\n\n```\nusername:password:UID:GECOS_field:home_directory:login_shell\n\
    ```\n\n### /etc/shadow\nThe shadow file holds the username and password pairs,\
    \ as well as account information such as expiry date, and any other special fields.\
    \ This file should be protected at all costs.\n\n### /etc/groups\nThe groups file\
    \ contains all group membership information, and optional items such as group\
    \ password (typically stored in gshadow on current systems), this file to must\
    \ be world readable for the system to behave correctly. The format is:\n\n```\n\
    groupname:password:GID:member,member,member\n```\n\nA group may contain no members\
    \ (i.e. it is unused), a single member or multiple members, and the password is\
    \ optional.\n\n### /etc/gshadow\nSimilar to the password shadow file, this file\
    \ contains the groups, password and members.\n\n### /etc/logins.def\nThis file\
    \ (/etc/logins.def) allows you to define some useful default values for various\
    \ programs such as usadd and password expiry. It tends to vary slightly across\
    \ distributions and even versions, but typically is well commented and tends to\
    \ contain sane default values.\n\n### /etc/shells\nThe shells file contains a\
    \ list of valid shells, if a user's default shell is not listed here they may\
    \ not log in interactively. See the section on Telnet for more information.\n\n\
    ```\n/etc/securetty\n```\n\nThis file contains a list of tty's that root can log\
    \ in from. Console tty's are usually /dev/tty1 through /dev/tty6. Serial ports\
    \ (if you want to log in as root over a modem say) are /dev/tty0 and up typically.\
    \ If you want to allow root to login via the network (a very bad idea, use sudo)\
    \ then add /dev/ttyp1 and up (if 30 users login and root tries to login root will\
    \ be coming from /dev/ttyp31). Generally you should only allow root to login from\
    \ /dev/tty1, and it is advisable to disable the root account altogether.\n\n##\
    \ Log files and other forms of monitoring\n\nOne integral part of any UNIX system\
    \ is the majority of logging in Linux is provided by two main programs, syslog\
    \ and klogd, the first providing logging services to programs and applications,\
    \ the second providing logging capability to the Linux kernel. Kernel actually\
    \ sends messages to syslog facility but will on occasion pop messages at the console\
    \ (i.e. kernel panics). Syslog handles the task of processing messages and sending\
    \ them to the appropriate file or device, this is configured within /etc/syslog.conf.\
    \ By default logging to files takes place in /var/log/, and generally programs\
    \ that handle their own logging (such as apache) log to /var/log/proname/; this\
    \ centralizes the logs and makes it easier to place them on a separate partition\
    \ (some attacks can fill your logs quite quickly, and a full /partition is no\
    \ fun). Additionally there are programs that have their own internal logging,\
    \ one of the most interesting being the bash command shell. By default bash keeps\
    \ a history of file commands executed in ~username/.bash_history, this file can\
    \ make for extremely interesting reading, as oftentimes many admins will accidentally\
    \ type their passwords at the command line. Apache\n\nOne integral part of any\
