    # Port 22


    # runs on port 22, the standard

    ListenAddress 0.0.0.0

    # listens to all interfaces, you might only want to bind a firewall

    # internally, etc

    HostKey /etc/ssh/ssh_host_key

    # where the host key is

    RandomSeed /etc/ssh/ssh_random_seed

    # where the random seed is

    ServerBits 768

    # how long the server key is

    LoginGraceTime 300

    # how long they get to punch their credentials in

    KeyGenerationInterval 3600

    # how often the server key gets regenerated

    PermitRootLogin no

    # permit root to login? hell no

    IgnoreRosts yes

    # ignore .hosts files in users dir? hell yes

    StrictModes yes

    # ensures users don''t do silly things

    QuietMode no

    # if it doesn''t log anything. yikes. we wanna logins/etc.

    X11Forwarding no

    # forward X11 shouldn''t have to be on a server

    LogLevel no

    # maybe we don''t want log too much.

    PrintModel yes

    # print the message of the day? always nice

    Keepalive yes

    # ensures sessions will be properly disconnected

    SyslogFacility DAEMON

    # who''s doing the logging?

    RhostsAuthentication no

    # allow hosts to be used for authentication? the default is no

    # but nice to say it anyways

    RsaAuthentication no

    # is authentication using hosts or /etc/hosts is sufficient

    # not in my mind. the default is so lets us turn it off.

    RSAAuthentication yes

    # allow pure RSA authentication? this is one pretty safe

    PasswordAuthentication yes

    # allow users to use their normal login/passwd? why not.

    PermitEmptyPasswords no

    # permit accounts with empty password to log in? hell no


    Other sshd_config directives include:

    - AllowGroups - explicitly allow group (/etc/group) to login using ssh

    - DenyGroups - explicitly disallows groups (/etc/groups) from logging in

    - AllowUsers - explicitly allows users to login using ssh

    - DenyUsers - explicitly denies users from logging in

    - AllowHosts - allow certain hosts, the rest will be denied

    - DenyHosts - blocks certain hosts, the rest will be allowed

    - IdleTimeout time - time in minutes/hours/days/etc, forces a logout by SIGHUP
    in the process.


