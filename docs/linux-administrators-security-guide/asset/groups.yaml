    # SSHD


    SSH is a secure protocol and set of tools to replace some (insecure) ones. It
    was designed from the beginning to offer a maximum of security, and is designed
    for remote access of servers in a secure manner. SSH can be used to secure any
    network based traffic, setting it up as a ''pipe'', i.e. binding to a certain
    port at both ends, this is quite kludgy for good things using X across the Internet,
    in addition to this server components runs on much UNIX systems, and NT, and the
    client components runs on pretty anything. Unfortunately SSH is no longer free,
    however there is a project to create a free implementation of the SSH protocol.


    There aren''t any problems with SSH per se like there are with telnet, all traffic
    is encrypted except copy and key exchange is done securely (alternatively you
    could prevent keys at either end to prevent them from being transmitted), SSH
    (typically runs as a daemon, and can easily be locked down by using the sshd_config
    file. You can also run out of indent, and then use tcp_wrappers, and by the default
    ssh rpms from replay.com tcp_wrappers chosen option into them using "sshd: blahblah"
    in hosts.allow and hosts.deny you to easily restrict access to ssh. Please note
    earlier versions of ssh contain bugs, and sites have been hacked (typically with
    man in the middle attacks or problems with buffer overflows in the ssh code);
    but later version of ssh addresses these problems


    The firewalls for ssh are pretty much identical to telnet, and there is course
    tcp_wrappers, the problem is that an attacker connects to the port, but doesn''t
    get a daemon, HOWEVER they know there is something on that port, where withallowing
    they don''t get a connection to the port. The following is an example of allowing
    people to ssh from internal networks, and a certain C class on the internet (say
    the C IP uses for their dial-up pool of models)


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 22

    ipfwadm -I a accept -P tcp -S isp.dial.up.pool/24 -D 0.0.0.0/0 22

    ipfwadm -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 22

    ```


    or


