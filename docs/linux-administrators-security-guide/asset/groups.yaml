  mdcn: '


    # 防火墙


    防火墙技术是过滤 TCP-IP 流量实践，通常发生在你的网络连接到另一个网络（例如互联网、客户的局域网或其他网络）的节点上。这些网络可能是不可信的（如互联网），也可能是可信的（你大楼的另一楼层）。就像大楼里的防火墙一样，网络防火墙可以防止甚至阻止攻击的扩散。


    Linux 长期以来一直具有以 `ipfwadm` 形式提供的防火墙功能，这是一种非常简单的数据包级过滤器，但非常有效，对大多数人来说足够了。随着内核 2.1+
    版本的出现，它被 `ipchains` 取代了，后者要复杂得多。然而，两者仍然都是基础的数据包过滤器，不支持高级功能，如状态检测（stateful inspection）或某些代理连接。尽管如此，Linux
    支持 IPMAS，这是一种高级的 NAT（网络地址转换）形式。IPMAS 允许你将计算机网络连接到互联网，但在数据包级上对其连接进行代理，因此所有流量看起来都像是进出某台机器（Linux
    IPMAS 节点），这为内部网络提供了高程度的保护。作为一个额外的好处是，内部网络上的连接不需要代理配置，只要 Linux IPMAS 服务器配置正确，就能良好工作。


    `ipchains` 和 `ipfwadm` 都提供了以下基本能力：


    - 根据 IP/端口/接口源/目的阻断/允许数据通过

    - 根据 IP/端口/接口源/目的进行连接的伪装（masquerading）


    此外，`ipchains` 还支持：


    - 端口转发

    - 创建链，以便于更复杂的规则和条件，便于维护

    - 服务质量 (QoS) 路由，用于慢速连接或其他拥堵的连接

    - 指定 IP/端口/接口以及反向指定（使用 `!`）


    `Firewall-HOWTO` 和 `man <command>`（`ipchains` 或 `ipfwadm`）页面非常详细地涵盖了设置规则的机制，但并没有真正涵盖防火墙安全的策略。你的首要选择是采用“默认允许”还是“拒绝所有”策略，然后是你希望允许和阻止的哪些和服务和主机。


    当你做决定时，你会选择一个默认拒绝所有内容（除非显式允许）的策略（也就是说，如果发生故障，希望可以通过默认策略将其降至最低），或者一个允许和阻止某些服务/主机的策略。我通常使用默认拒绝的策略，因为它可以容错错误，并且比允许数据通过的策略更安全。例如，如果你有一个通过防火墙保护的服务器，目前运行着
    apache，你在凌晨 3 点为其内部使用安装了 `WU-FTPD`（这样人们就可以上传文件），但你忘记了更改防火墙规则。如果你选择了默认允许的策略，那么互联网上的任何人都可以访问该
    ftp 服务器，而你又蠢地安装了一个旧版本，导致某人攻破了这台机器。另一方面，如果你采用默认拒绝的策略，他们将无法访问 ftp 服务器，也不会通知你的用户，但你很快就会发现问题。


    我决定在这一节中不涵盖具体的防火墙规则，对于每个网络服务，我将提供示例，因为要正确地对协议进行防火墙处理，你需要了解它的行为。例如，对 web 和 ftp
    的入站和出站访问进行防火墙处理有巨大的差异。一些通用概念/规则：


    ## IPFWADM


    `ipfwwadam` 是 Linux 下一个稳健的数据包过滤器，尽管它缺乏 `Ipchains` 中提供的许多功能。它只支持数据包的 Target：接受（accept）、拒绝（deny）或拒绝（reject），而
    `ipchains` 规则可以针对 6 个内置单元或用户定义的目标。`ipfwwadam` 实际上仅适用于 IP 级防火墙、IP 伪装以及如果你计划使用 FreeSW（目前不支持内核
    2.2.x）。基本选项是：指定方向（入站或出站，带上接口标志）、输入规则、输出规则、规则（你可能有多个接口，也涵盖了伪装规则）以及控制超时的伪装规则。你可以插入、追加和删除规则，设置默认策略并列出所有规则，与
    `ipchains` 不同，你只有 3 个目标（ACCEPT, DENY, REJECT）。除此外它与 `ipchains` 非常相似，只有细微差异。以下是一个适用于桥接两个网络（eth0
    上的 10.0.0.x，eth1 上的 10.0.0.1 和 192.168.0.1）且运行有邮件服务器的脚本。


    ```bash

    #!/bin/bash

    # 首先刷新所有规则集

    ipfwadam -I

    ipfwadam -f -O

    ipfwadam -F

    ```


    # 允许两个网络之间的转发，出于安全考虑其他拒绝


    ```bash

    ipfwadam -F -a accept -P all -S 10.0.0.0/24 -i eth0 -D 192.168.0/24

    ipfwadam -F -a accept -P all -S 192.168.0/24 -i eth1 -D 10.0.0.0/24

    ipfwadam -F -P deny

    ```


    # 当然，我们必须允许这些数据包进入


    ```bash

    ipfwadam -I -a accept -P tcp -S 10.0.0.0/24 -i eth0 -D 192.168.0/24

    ipfwadam -I -a accept -P tcp -S 192.168.0/24 -i eth1 -D 10.0.0.0/24

    ipfwadam -I -P deny

    ```


    # 让他们访问服务器上的邮件服务器，但什么都不能访问


    ```bash

    ipfwadam -I -a accept -P tcp -S 10.0.0.0/24 -i eth0 -D 192.168.0/24

    ipfwadam -I -a accept -P tcp -S 192.168.0/24 -i eth1 -D 10.0.0.0/24

    ipfwadam -I -P deny

    ```


    ## IPchains


    `ipchains` 有一些新功能，你可以创建规则链（因此得名）并将它们链接起来，使得防火墙的管理更加简单。`ipchains` 支持比 `iptables`
    更多的目标，你可以规则指向 ACCEPT、DENY、REJECT 或 RETURN。这种方式非常强大，你可以重定向 80 端口的数据包，并结合服务质量（QoS）路由，`ipchains`
    给出的示例中流量优先级高于 ftp，这减少了由拥塞链路引起的延迟问题。以下脚本适用于具有 2 个接口的网关，我使用 DENY 而不是 REJECT 的原因是数据包会被直接丢弃且不予响应，这会减慢扫描。`ipchains`
    适用于具有 2 个接口的服务器，如果你计划使用它，需要设置防火墙规则。我们假设所有机器都与网关通信。


    ```bash

    #!/bin/bash

    PATH=/sbin

    # FLUSH ALL

    # 变量

    # ETH0 是 IP 地址（外部接口）

    # ETHONET 是网络

    # ETHET 是掩码

    # TRUSTEDHOST1 是一个信任主机（用于 web）

    # TRUSTEDHOST2 是一个信任主机（用于 ssh）

    # ETH1 是 IP 地址（内部接口）

    # ETHONET 是网络

    # ETHET 是掩码

    ETHIP=1.1.1

    ETHONET=1.1.0

    ETHET=24

    TRUSTEDHOST1=1.5.1

    TRUSTEDHOST2=1.5.2

    ETH1=10.0.0.1

    ETHONET=10.0.0

    ETHET=24


    iptables -F input

    iptables -F output

    iptables -F forward


    # 伪造 (SPOOFING)

    iptables -A input -p all -j DENY -s 10.0.0.0/8 -i eth0 -d 0.0.0/0

    iptables -A input -p all -j DENY -s 127.0.0.0/8 -i eth0 -d 0.0.0/0

    iptables -A input -p all -j DENY -s 192.168.0.0/16 -i eth0 -d 0.0.0/0

    iptables -A input -p all -j DENY -s 172.16.0.0/16 -i eth0 -d 0.0.0/0

    iptables -A input -p all -j DENY -s $ETHIP -i eth0 -d 0.0.0/0


    # ICMP

    iptables -A input -p icmp -j ACCEPT -s $ETHONET/$ETHET -i eth0 -d 0.0.0/0

    iptables -A input -p icmp -j DENY -s 0.0.0.0 -i eth0 -d 0.0.0/0


    # SSH

    iptables -A input -p tcp -j ACCEPT -s $TRUSTEDHOST1 -i eth0 -d 0.0.0/0 22

    iptables -A input -p tcp -j DENY -s $TRUSTEDHOST2 -i eth0 -d 0.0.0/0 22


    # 阻断 11023

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 11023

    iptables -A input -p udp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 11023


    # 阻断其他

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 11039

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 1524

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 1600

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 2003

    iptables -A input -p udp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 2045

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 2049

    iptables -A input -p udp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 2045

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 2105

    iptables -A input -p tcp -j DENY -s 0.0.0.0/0 -i eth0 -d 0.0.0/0 3001

    iptables -A input -p udp -j DENY -s 0.0.0.0/0 - i eth0 -d 0.0.0/0 3128

    ```


    # 规则创建


    ipfwadm2iptchains

