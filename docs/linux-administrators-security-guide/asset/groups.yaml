    # Burt


    Burt is a Tcl/Tk based set of extensions that allow for easy backups of Unix workstations,
    this allows it to run on pretty any system. Burt is a client/server architecture
    and appears pretty scalable, it is available at: http://www.cs.wisc.edu/~jmelski/b/


    # Commercial Backup Programs for Linux


    ## BRU


    RedHat ships with a nice backup program (well a demo version anyways) called BRU
    (Backup and Restore Utility), this thing has been in the Linux world since as
    long as Linux Journal (they have had ads there since the beginning). This program
    affords a relatively complete set of tools in a nice unified format, with command
    line and a graphical front end (easy to automate in other words). It supports
    full, incremental and differential backups, as well as catalogs, and can write
    to a file or tape drive a solid, simple, easy to use backup program, it ships
    with RedHat Linux (one license), so if you bought RedHat you should have a copy
    to play with. BRU is available at http://www.estinc.com/features.html.


    ## Quickstart


    Quickstart is more aimed at making an image of the system that when the hard drive
    fails/etc, you can quickly re-image a blank disk with a working system. It can
    also be used to ''master'' a system and load other systems (as an alternative
    to RedHat''s kickstart). It''s reasonably priced as well as garnered a good revue
    in Linux Journal (Nov 1998, page 50). You can get it at: http://www.estinc.com/qsdr.html.


    ## Backup Professional


    http://www.unitrends.com/bp.html


    ## CTAR


    http://www.unitrends.com/ctar.html


    ## CTAR:NET


    http://www.unitrends.com/ctarnet.html


    ## PC ParaChute


    http://www.unitrends.com/pcpara.html


    ## Arkeia


    Arkeia is a very powerful backup program with a client-server architecture that
    supports many platforms. This is an ''industrial'' strength product and appropriate
    for heterogeneous environments it was reviewed in Linux Journal (April 1999).


    ## Legato Networker


    Legato Networker is another enterprise class backup program, with freely available
    (but unsupported) Linux clients. Legato Networker is available at: http://www.legato.com/Products/html/legato_networker.html
    and the Linux clients are available from: http://feral.com/networker.html.


    # Pro''s and Cons of Backup Media


    There are more things to back data up then you can give a drive range over but
    here are some of the more popular/sane alternatives:


    | Media | Pro''s | Cons |

    | :--- | :--- | :--- |

    | Hard Drive | It''s fast. It''s cheap. It''s pretty reliable. ($20-$30 USD per
    gig) | It might not be big enough, and they do fail, usually at the worst possible
    time. Harder to take off as well. RAID is a viable option though. 20 gig drives
    are $50 now. |

    | CDROM | Not susceptible to the developed everyone in the world has a CDROM drive.
    Media is also pretty sturdy and cheap ($2 USD per 650 Megs or so) | CDROM''s have
    a finite life of 5-15 years, and not all recorders are equal. Keep away from sunlight,
    and make sure you have a CDROM drive that will read |

    | Tape | It''s reliable, you can buy tapes, tape carousels and robots, they''re
    getting cheap enough for everyone | Magnetic, finite life span can be easily damaged
    (get what you pay for), make the tapes can be read on other drives (in the case
    the server burns down...). |

    | Floppies | I''m not kidding, there are rumors people still use this to backup
    data. | It''s a floppy. Whadda thinks? |

    | Zip Drives | I have yet to damage, nor have my cats. They 100 megs are good
    enough for most single user machines. | Not everyone is a zip drive, and they
    are magnetic. |

    | Jazz Drives | 1 or 2 gig removable hardwards, by $5 averages 5 megs/sec writes.
    | They die. I''m on my third drive. The platters also have a habit of going used
    if needed. |

    | Syquest | 1.6 gigs, sealed platter, same as above. | Sealed cartridges are more
    reliable. Company did recently declare bankruptcy though. No warranty service
    |

    | LS120 | 120 Megs, and cheap, gaining in popularity. | Slow I''m not kidding.
    120 megs over a floppy controller to something that is advertised as "up to 3-4
    times faster than the floppy drive". |

    | Printer | Very long shelf life, requires a standard Mark 1 human as a reading
    device. Handy for showing consultants and as reference material. Cannot be easily
    altered. | You wanna retype a 4000 entry password file? OCR is another option
