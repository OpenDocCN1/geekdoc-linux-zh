    ipchains -A input -p udp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0

    ipchains -A input -p udp -j ACCEPT -s some some.trusted.host -d 0.0.0.0/0

    161:162

    ipchains -A input -p udp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 161:162

    ```'
- md: '

    # Finger


    Finger is one of things most admins disable and ignore. It is a useful tool on
    occasion, but if you want to allow other admins to figure out which of your users
    is currently trying to crack their machines, use ident. Finger lets out way much
    info, and is a favorite tool for initial probes and data gathering on targets.
    There have also been several nasty DOS attacks released, basically consisting
    of sending hundreds of finger requests and in certain configurations using the
    server crack. Please don''t run finger. Many distributions ship with enabled,
    but to quote inetd from RedHat:


    ```

    # Finger, systat and netstat give out information which may be

    # valuable to potential "system crackers ". Many sites choose to disable

    # some or all of these services to improve security.

    ```


    If you still have the urge that you absolutely run it use -u to deny finger @host
    requests that are not ever used to gather information for future attacks. Disable
    finger, really. Finger has also been the cause of a few recent and very bad denial
    of service attacks, especially if you run NIS with large maps, DO NOT, repeat
    NOT run finger. Cfingerd (configurable finger) is a great replacement for the
    stock finger, it was built with security in mind, runs as a non-root user and
    can easily configure it so they aren''t fingerable. Cfingerd is available from:
    http://ftp.bitgate.com/cfingerd/. Finger runs on port 79, and cfingerd runs on
    port 2003, both use tcp.


    ```

    ipfwadm -I -a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 79

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 79

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 79

    ```


    or


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 79

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 79

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 79

    ```


    # Identd


    Identd service is used to map users/processes to ports in. For example, src servers
    attempt to find out who is connecting to them by doing an ident lookup, which
    basically consists of asking the ident what it has about a port number, and can
    range from nothing (if no one is using that particular port) to a username, groupname,
    process id, and other interesting information. The default setting in many distributions
    is identd on (it is possible to run it, its and newer versions send small ident
    responds), and will only hand out the username. The primary use of ident is to
    allow remote systems by means of tracking down users that are connecting to their
    servers, inc, telnet, mail, or, for authentication purposes (not a good idea since
    it is very easy to fake). The local university in Edmonton requires identd if
    you want to telnet into any of the main servers, primarily so they can track down
    compromised accounts quickly. Identd is a useful tool, but generally on machines
    it is a two-edged sword, while it gives out information for tracking down attackers
    (definitely people you want to kick off your servers) it also be used to get information
    about your system, leading to their accounts being compromised. I would suggest
    running identd on servers with accounts/etc.


    Identd supports a few features, and can be easily set to run as a non-root user.
    Depending on your security policies you may not want to give very much information,
    or you might want to give as much as possible. Simply tack the option in inet.conf,
    after identd (the defaults are -l -e).


    ```

    -p port

    - address

    ```


    Can be used to specify which port and address it binds to (in the case of a machine
    with IP''s aliased, or multiple interfaces), this is generally only useful if
    you want machines to connect, since external machines will probably not be able
    to figure out what port you changed to it.


    ```

    -u uid

    -g gid

    ```


    Are used to set the user and group identd will drop it''s privileges after connecting
    to the port, this will result in it being far less susceptible to compromising
    system security. As for handling the amount of information it gives out:


    ```

    -o

    ```


    Specifies that identd will not return the operating system type, and simply say
    "UNKNOWN", a very good option.


    ```

    -n

    ```


    Will identd return user numbers (i.E. UID) and not the username, which still gives
    enough information to tell you and allow to track the user down easily, without
    giving valuable hints to would be attackers.


    ```

    -N

    ```


    Allows you to make a /.nident file, which will force identd to return "HIDDEN-USER"
    instead of information.


    ```

    -F format

    ```


    Enables you to specify far more information then is standard, everything from
    user name and number to the actual PID, command name, command name and arguments
    that were given! This I would recommend for internal use, as it is a lot of information
    attackers could find useful.


    In general I would advise disabling identd, primarily due to the number of denial
    of service attacks it is susceptible to. You should only run it if you want to
    make the lives of other administrators, tracking which of your users are bad.
    There are however other versions of identd available, with security enhancements
    (I do not endorse these as I have yet to test):


    ```

    http://insecurity.net/ - Paul''s secure identd written in perl

    http://www.ojnk.nu/~ident/ - ojn identd

    http://www.tildes/null.html - null identd

    http://www.ajk.tele/~too/ - fake identd

    http://pur.het.net/ - midident

    ```


    Identd runs on port 113 using tcp, and typically will only need it if you want
    to IRC (many networks require an ident response), or be nice to systems running
    daemons (such as tcp_wrapped telnet, or sendmail).


    ```

    ipfwadm -I -a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 113

    ipfwadm -I -a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 113

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 113

    ```


    or


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 113

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 113

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 113

    ```


    # ntpd


    NTP (Network Time Protocol) is rather simple in its mission, it keeps clocks in
    synchronization. Try comparing log from separate servers if their clocks are out
    of sync by a few minutes. NTP simply works by a client connecting to a time server,
    working out the delay between them (on a local LAN it might be only 1-2ms, across
    the internet it may be several ms), and then it asks for the time and sets its
    clock. Additionally servers can be ''clustered'' to keep themselves synchronized,
    the chances of three or more servers losing track of what time it is (also called
    ''drift'') is relatively low. The time signal is typically generated by an atomic
    clock or GPS signal measured by a computer, these are ''stratum 1'' servers, below
    them are stratum 2 servers that are publicly accessible, a company might have
    its own stratum 3 servers if they have sufficient adjustment, and so on. The data
    exchanges is of course not terribly sensitively, however if an attacker were able
    to tamper with all sorts of cost might be rendered unusable, accounts might expire
    early, jobs that run your server causing delays. Then it is a good idea to run
    your time server(s) set at the maximum adjustment they will make only a few seconds
    (should''t drift much anyway). If you have a great number of clients consider
    buying a GPS time unit they come in all shapes and sizes, from a rack mount that
    plugs directly into your ISA and PCI cards into a server. It is a good idea to
    firewall your time servers, as a denial of service attack would be detrimental
    to your network, in addition to if possible you should use the encryption in DES
    it is generally sufficient to thwart most attackers. There are usually pages with
    ntpd or xntpd (well documented) help that can be found in /usr/doc/name/ typically,
    or at: http://www.e.udel.edu/~ntpd/spool/index.htm. NTP runs on port 123 using
    udp, and firewalling it is relatively simple:


    ```

    ipchains -I input -p udp -j ACCEPT -s 10.0.0.0/8 -D 0.0.0.0/0 123

    ipfwadm -I -a accept -p udp -s some.trusted.host -D 0.0.0.0/0 123

    ipfwadm -I -a deny -p udp -j DENY -s 0.0.0.0/0 -D 0.0.0.0/0 123

    ipfwadm -I -a accept -p tcp -s 10.0.0.0/8 -D 0.0.0.0/0 123

    ipfwadm -I -a accept -p tcp -s some.trusted.host -D 0.0.0.0/0 123

    ipfwadm -I -a deny -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123

    ```


    or


    ```

    ipchains -A input -p udp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 123

    ipchains -A input -p udp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 123

    ipchains -A input -p udp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123

    ```

