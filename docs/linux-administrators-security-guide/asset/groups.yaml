  - '[PAGE 96]


    lpd is the UNIX facility for printing (Line Printer Daemon). It allows you to
    submit printjobs, run them through filters, manage the print queues, and so on.
    lpd-can accept print jobs locally, or over the network, and access various parts
    of the system (logging daemons, etc), making it a potential security hole. lpd
    has been the source of several nasty roots, however it seems to have mostly fixed
    now, there are still many potential denial of service attacks due to it''s function
    (something like submitting printjobs and running the printer out of paper). Fortunately
    lpd is slowly being phased out with the advent of network aware printers, however
    there is still a of printing doing lpd access is controlled via /hosts.equiv,
    and /hosts.lpd. You should also firewall lpd from the outside world, and if you
    need to send printjobs across public networks, remember anyone can read them,
    so a VPN solution is a good idea. Lpd runs on port 515 tcp. the hosts.lpd file
    should contain a list of hosts (workstation1,yourdomain.com, etc), etc one per
    line that are allowed to use the Lpd services on the server, which you as well
    use ipfwadm/ipfwchains


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 515

    ipfwadm -A accept -P tcp -S some.trusted.host -D 0.0.0.0/0 515

    ipfwadm -A deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 515

    ```


    or

    nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 515

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 515

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 515


    # LPRng


    An alternative to the stock lpd is “LPRng (LPR Next Generation), it provides new
    enhancements and also supports a higher level of security. LPRng supports Kerberos
    and PGP based authentication, as well as a restrictions file, /etc/lpd.perms,
    which allows you to control access based on user, group, authentication, IP, and
    so on, allowing for extremely flexible and secure configurations. LPRng has excellent
    documentation and is available at: http://www.astart.com/lpr/LPRng.html.


    pdq

    pdq is another LPD replacement, no real emphasis on enhanced security but it seems
    to offer some improvements management and performance wise over the stock LPD.
    You can get pdq from: http://feynman.tam.uiuc.edu/pdq/'
  - '[PAGE 97]


    # X Window System


    The X Window System provides a network transparent method for sharing graphical
    data, or more specifically for exporting the display of a program to a remote
    (the local) host. Using it you can run a 3d rendering package on SGI origin 2000
    and display it on a 486. Essentially it''s the grandaddy to all this ''thin client''
    hype that is very popular nowadays. It was created by MIT, and the time security
    was not much of a concern, this of has led to me a few nasty bugs being found,
    as the level of control over X is given (it handles keystrokes, mouse movements,
    draws the screen, etc) means if it is compromised very bad things can happen.
    This data, if sent over the network (i.e., the X program being is displaying on
    a remote host) can be easily loaded, sensitive information (an xterm being used
    to login another remote system) is vulnerable. In addition to these the authentication
    protocol that X uses relatively weak (although it has improved). Running a graphical
    xenc session on a 3 timezones however can be a very handy thing.


    X is very portable in usage, almost all implementations and installations of X
    use 6000 for the first session and increment by one for others, making it quite
    easy to scan. If you are not using X to display program running on remote systems
    I suggest strongly firewall port 6000. Control over how/what is connected to the
    X can be accomplished several ways.


    ```

    ipfwadm -I -a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 6000:6100

    ipfwadm -I -a accept -P tcp -s some.trusted.host -D 0.0.0.0/0 6000:6100

    ipfwadm -I -a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/0 6000:6100

    ```


    or


    ```

    ipchains -A input -p tcp -J ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 6000:6100

    ipchains -A input -p tcp -J ACCEPT -s some.trusted.host -d 0.0.0.0/0

    6000:6100

    ipchains -A input -p tcp -J DENY -s 0.0.0.0/0 -d 0.0.0.0/0 6000:6100

    ```


    xhost


    xhost simply allows you to specify which machines are, or aren''t allowed to connect
    to the X environment, this is a very simplistic security mechanism and is not
    really suitable in modern environment, however used in conjunction with other
    mechanisms it can help. The command is quite simple:''xhost +hostname adds hostname,
    ''xhost -hostname removes hostname from the list, you must also specify ''xhost
    -'' to turn on the access control list, or everyone is in by default.


    mkxauth


    mkxauth is definitely a step up, it creates .authority files, and merge them,
    which are used to specify hostnames and the related magic cookies (basically a
    token used to gain access). These cookies can be used to gain access to a remote
    X host (you essentially have a copy of the config on each end) and are transferred
    plain text (insecure) or DES encrypted (quite secure). Using this method you can
    be relatively safe and secure. Authority files can also be used in conjunction
    with Kerberos, removing the necessity to copy Authority files and keep them in
    synchronization. Hosts authenticate to each other'
- md: '

    through a central Kerberos key server(s) in an encrypted fashion, this method
    is most appropriate for large installations/etc. mkxauth has an excellent man
    page ''man mkxauth'' and more generalized details are available in the Xsecurity
    man page (not sure how common this name page is) ''man Xsecurity''.


    # SSH


    SSH can be used to create a tunnel between hosts (or more specifically between
    two X servers), thus encrypting the channel, providing authentication, and generally
    making things safer. The following web page explains it in detail:

    http://csociety.ecn.purdue.edu/~sigos/projects/ssh/forwarding.


    # Samba


    SAMBA is one of the best since sliced bread, that is if you want to share files
    and printers between Windows and *NIX. It is also somewhat misunderstood, and
    suffers heavily from interaction with various (sometimes broken) Windows clients.
    SAMBA has a great kludges that attempt to make it somewhat sane, but can lead
    to what looks like broken behavior. SAMBA simply gives access to the filesystem
    VIA SMB (Server Message Block), the protocol uses to share files and printers.
    It verifies the username and password (if required) and then gives access to the
    files according to the file permissions and so forth are set. I am only going
    to cover Samba 2.x, Samba 1.x is pretty old and obsolete.


    Samba 2.x is controlled via smb.conf, typically in /etc (man smb.conf). In /etc/smb.conf
    you have four areas of configuration: [globals], [printers], [homes], and each
    [sharename] it''s own configuration (be it a printer or drive share). There are
    a number of switches, the samba conf page covers exhaustively. Of the important
    (security) ones are:


    - security = xxxx where xxxx is the server or domain, security is per share, with
    a password that everyone gets to get at, or means the samba server itself authenticates
    users, either via /etc/password, or smpasswd. If you set it to domain, samba authenticates
    the user via an NT controller, thrashing nicely into your existing NT network
    (if you have one).


    - guest account = xxxx where xxxx is the username of the account you want the
    guest user to map. If a share is defined then all requests to it are handled as
    this user.


    - hosts allow = xxxx where xxxx is a space separated list of hosts / IP blocks
    allowed to connect to the server.


    - hosts deny = xxxx where xxxx is a space separated list of hosts / IP blocks
    not allowed to connect to the server.


    - interfaces = xxxx where xxxx is a space separated list of IP blocks that samba
    will bind to


    I would highly recommend installing and using SWAT (samba Web Administration Tool)
    as it will kill down on the mistakes/etc that you are likely to make. Samba and
    SWAT are available at: http://www.samba.org/ and ship with almost every distribution.


    # SWAT


    SWAT is a very important tool to setup your samba.conf. The main problem is that
    it requires you to use the root account and password to ''log'' in, and as a separate
    process out of inet.conf, there is no easy way to encrypt it, and as far as I
    can tell no way to grant others administrative access to SWAT. Having said that
    it is a good tool for cutting down on mistakes while editing samba.conf. You can
    also run SWAT with the -a switch, meaning no password will be required, and using
    TCP_WRAPPERS to restrict access to certain workstations (although you''d be open
    to IP spoofing), essentially SWAT was not meant as a secure administrative tool,
    but it is useful. SWAT comes with samba (usually)


    and is available at: http://www.samba.org/, a demo of SWAT is online at:

    http://anu.samba.org/cgi-bin/swat.


    # File sharing methods


    I thought I should also give a brief overview of the various file sharing methods
    that exist for Linux, show you the pro''s and con''s as it were.


    # SAMBA


    Samba is the best option (performance wise, security wise, etc.) for sharing files
    with Windows client machines, I would not really recommend this as a method for
    sharing files between machines.


    # NFS


    NFS is not very secure, but it is easy to use, and can be made relatively safe
    if environment it is in not hostile. I would not recommend this as a method of
    sharing files/etc if security is a concern (which arguably means you shouldn''t
    use it for diskless workstations, but such is life).


    # Coda


    An advanced network filesystem, not very fun to implement. http://www.coda.cs.cmu.edu/


    # Drall


    An http based systems for sharing files among machines securely.

    http://www.edlund.org/projects/drall/index.html.


    # AFS


    A high end, commercial file sharing application for large installations. The FAQ
    is available at: http://www.angelfire.com/hi/plutonic/afs-faq.html.


    # Network Based Authentication


    # NIS / NIS+


    NIS and NIS+ (formally known as ''yellow pages'') stands for Network Information
    Service. Essentially NIS and NIS+ provide a means to distribute password files,
    group files, and other configuration files across many machines, providing account
    and password synchronization (among other services). NIS+ is essentially NIS with
    several enhancements (mostly security related), they are very similar. To use
    NIS you set up a NIS server that will contain the records and allow them to be
    changed (add users, etc), this server can distribute the records to slave NIS
    machines that contain read only copy of the records (but they can be promoted
    to master and read/write if something bad happens). Clients of the NIS network
    essentially request portions of the information and copy it directly into their
    configuration files (like /etc/passwd), making them accessible locally. Using
    NIS can provide several thousand roadways and servers with identical sets of usernames,
    information, passwords and the like, significantly reducing administration nightmares.
    However this is the problem of, sharing this information you make it accessible
    to attackers, which is using NIS+ attempts to resolve, the problem NIS+ is another
    nightmare to set up. An alternative strategy would be to use some VPN support
    (FreeSWAN, doesn''t it solve some problem?) and encrypt the data before it gets
    onto the network. There is a NIS/ NIS+ howto: http://metalab.com/LDP/HOWTO/NIS-HOWTO.html,
    and O''Reilly has an excellent book on the subject. NIS+ runs over RPC which use
    port 111, tcp and udp. This currently should be defined at your network border,
    but will not totally persist NIS / NIS+


    ```

    ipfwadm -I -a accept -P udp -s 10.0.0.0/24 -d 0.0.0/0

    ipfwadm -I -a accept -P udp -s some.trusted.host -d 0.0.0/0

    ipfwadm -I -a deny -P udp -s 0.0.0/0 -d 0.0.0/0

    ```


    or


    ```

    ipchains -A INPUT -p udp -j ACCEPT -s 10.0.0.0/24 -d 0.0.0/0

    ipchains -A INPUT -p udp -j ACCEPT -s some.trusted.host -d 0.0.0/0

    ipchains -A INPUT -p udp -j DENY -s 0.0.0/0 -d 0/0

    ```


    Since NIS and NIS+ are RPC services they do use higher port numbers (i.e. above
    1024) in a somewhat random fashion, making firewalling of it quite painful. The
    best solutions is to place your NIS server(s) on machines that are internally
    blocked from completely talking to the Internet, inbound and outbound.


    # SRP


    SRP is a relative newcomer, however it has several advantages over some of the
    older programs. SRP is free for commercial use and does not use encryption to
    secure the data, exporting it outside of the US isn''t as much of a problem. SRP
    uses one way hashes for authentication of both parties. The disadvantage is that
    SRP only encrypt the login (username and password) so any data transferred (such
    as the telnet session or ftp sites) are vulnerable. You can get SRP from SRP:
    http://srv.stanford.edu/srp/. SRP currently has Telnet and FTP support (which
    we as well) enabling other protocols is relatively straightforward.


    Kerberos is a modern network authentication system based on the idea of handing
    a user a ticket once they have authenticated to the Kerberos server (similar to
    NT''s use of tokens). Kerberos is available from: http://web.mit.edu/kerberos/www/.
    The Kerberos FAQ is available at: http://www.nrl.navy.mil/CCS/people/kenh/kerberos-faq.html.
    Kerberos is appropriate for large installations as it scales better and is more
    secure than NIS / NIS+. Kerberizing programs such as telnet, imap and pop can
    be achieved with some effort, Windows clients with Kerberos support are harder
    to find however.

