    和管理工具进行了重大更新。重写了管理工具章节。1999/05/15


    0.1.0

    修复了末尾的 URL 部分，清理了各章节。添加了“互联网连接”检查。添加了 60 多个新程序和应用程序。添加了安全文件删除、软件管理工具、几种新的扫描和探测检测工具。增加了新的白皮书章节，列出了良好的安全文档，并在末尾按章节列出了
    URL 列表。添加了几个新附录，列出了 Linux 网站、安全网站、白皮书等。1999/05/29


