    \n# DHCPD\n\nDHCPD is something all network admins should use. It allows you to\
    \ serve information to clients requesting their network settings/etc, meaning\
    \ that the client setup needed for networking is leaving the defaults and turning\
    \ the machine on. It also allows you to reconfigure clients easily (say move from\
    \ 10.0.1.0 to 10.0.2.0, or a new set of DNS servers). In the long run (and short\
    \ run ever) DHCP will save you amounts of work, money and stress. I run it at\
    \ home with only 8 clients and found life to be much easier. DHCPD is maintained\
    \ by the ISC and is at: http://www.isc.org/dhcp.html.\n\nI highly recommend you\
    \ run DHCPD 2.x (3x is in alpha stages), it's a lot of new features, and it is\
    \ easy to setup and work with. The absolute version(s) of this tend to be a bit\
    \ neurotic however, warned it is beta software. Definitely fairly DHCPD off from\
    \ the Internet. DHCP traffic should only be on local segments, possibly forwarded\
    \ to a DHCP server on another segment, but the only DHCP traffic you would see\
    \ coming over the Internet would be an attack/DoS (they might recover all your\
    \ IPs, leaving your clients high and dry). If you are forwarding DHCP traffic\
    \ over the Internet, DONT. This is a bad idea for a variety of reasons (primarily\
    \ performance / reliability, security as well).\n\nI recommend the DHCP server\
    \ be only a DHCP server, locked up somewhere (if you rely on DHCP for your network\
    \ and the DHCP server fails your network is in serious trouble), allowed to do\
    \ it quickly, if you need to span subnets (if you have multiple servers, only\
    \ one of which has a DHCP server physically connected to it) use a DHCP relay\
    \ (NT has no built-in, the DHCP software for Linux has the capability, etc.).\
    \ There are also known problems with NT and DHCP, NT RAS has a nasty habit of\
    \ sucking up IP addresses like crazy (I have seen an NT server grab 64 and keep\
    \ them indefinitely), because it is trying to reserve RAS IPs for the clients\
    \ that will be dialing in/out. Either turn NT's RAS off, or put it on its own\
    \ subnet, the MAC address it sends to the DHCP server is very strange (and spells\
    \ out RAS in the first few bytes) and is not easy to map out.\n\nDHCPD consists\
    \ of 2 executables:\n\n- dhcpd - the DHCP server\n- dhrelay - a DHCP relay (to\
    \ relay requests to a central DHCP server since DHCP is based on broadcasts, which\
    \ typically don't (and shouldn't) spawn routers/ethers.)\n\nDHCPD requires 2 libraries:\n\
    \n- /lib/dhcp-linux.so.2\n- /lib/libc.so.6\n\nA config file:\n\n- /etc/dhcpd.conf\
    \ - configuration info, location of boot files, etc.\n\nAnd a few other misc.\
    \ files:\n\n- /etc/dhcpd.leases - a list of active leases\n- a startup file, you\
    \ can modify only the one it comes with your own\n\nThe simplest way to setup\
    \ chrooted is to simply install dhcpd (latest one preferably) and move the necessary\
    \ files. A good idea is to create a directory (such as) /chroot/dhcpd/, preferably\
    \ on a separate filesystem from /, /usr, /etc (symlinks), and then create a file\
    \ structure under it for dhcpd. The following is an example, simply replace /chroot/dhcpd/\
    \ with your choice. You must course execute these steps for root to work.\n\n\
    ```bash\n# Install so we have the appropriate files\nrpm -i dhcpd-2.0.1.i386.rpm\n\
    \n# Create directory structure\ncd /chroot/dhcpd/\nmkdir ./etc\nmkdir ./usr/sbin\n\
    mkdir ./var\nmkdir ./lib\n\n# Populating the files\ncp /usr/sbin/dhcpd /usr/sbin/dhcpd\n\
    cp /etc/dhcpd.conf /etc/dhcpd.conf\ncp /etc/rc.d/init /etc/rc.d/init\ncp /etc/rc.d/functions\
    \ /etc/functions\n\n# Now to get the latest libraries, change as appropriate\n\
    cp /lib/ld-linux.so.2 /lib/\ncp /lib/libc.so.6 /lib/\n\n# Create necessary symbolic\
    \ links so they behave\nln -s /chroot-dhcpd/ /\n```\n\nThen modify or create your\
    \ startup script. Once this is done remove the original file and create a symlink\
    \ where it was pointing to the new one, and dhcpd will behave 'normally' (that\
    \ is it will be automatically started at boot time), separated from your system.\
    \ You may also wish to remove the 'original' files, which is not necessary. If\
    \ you have the above properly you should have a /chroot/dhcpd/ (or other dir specified)\
    \ that contains everything required to run dhcpd. And a ps aux should show something\
    \ like:\n\n```\nUSER      PID %MEM SIZE TTY START TIME COMMAND\nroot      6872\
    \ 0.7  900 S 02:32 /usr/sbin/dhcpd -q\nroot      6873 0.9  736 S 02:32 tee /etc/dhcpd.log\n\
    ```\n\nDHCPD should definitely be farewell when querying your DHCP server for\
    \ IPs, in addition to making it available to the outside world could result in\
    \ an attacker starving the DHCP server of addresses assuming you use dynamic pools\
    \ of addresses, you could be out of luck for your internal network and learning\
    \ about the structure of your internal network. DHCP runs on port 67, udp because\
    \ the amounts of data involved are small and a fast response is critical.\n\n\
    ```\nipfwadm -I -a accept -P udp -S 10.0.0.0/8 -D 0.0.0/0\nipfwadm -I -a accept\
    \ -P udp -S some.trusted.host -D 0.0.0/0\nipfwadm -I -a deny -P udp -S 0.0.0.0/8\
    \ -D 0.0.0/0\n```\n\nor\n\n```\nipchains -A input -p udp -j ACCEPT -s 10.0.0.0/8\
    \ -d 0.0.0/0\nipchains -A input -p udp -j ACCEPT -s some.trusted.host -d 0.0.0/0\n\
    ipchains -A input -p udp -j DENY -s 0.0.0.0/8 -d 0.0.0/0\n```\n\n# NFSD\n\nNFS\
    \ stands for Network File System and is just that, it is a good way to distribute\
    \ filesystems, read only/write, maintaining a degree of security and control assuming\
    \ your network is enclosed and secure. NFS is primarily meant for use in a high\
    \ bandwidth environment (i.e. a LAN) where security risks are not high, or the\
    \ information being shared is not sensitive (a small trusted LAN behind a firewall\
    \ exchanging CAD/CAM diagrams, or a large university using NFS for mount/). If\
    \ you need a high level of security, encrypted data between hosts, NFS is not\
    \ the best choice. I personally use it across my internal LAN (the machine which\
    \ has 2 interfaces, which one is easily firewalled), to share file systems containing\
    \ rbinds, this website, etc. Safer alternatives include SAMBA (free) and now IBM\
    \ is porting NFS to Linux (costly but NFS is a sweet hook of code).\n\nNFS has\
    \ a few rudimentary security controls, the first one would be firewalling, using\
    \ NFS across a large spoof network like the internet isn't a good idea in case,\
    \ so firewall port 2047, UID. Since NFS runs as a set of daemons, tcp wrappers\
    \ are of no use unless NFS is compiled to support. The config for NFS actually\
    \ has a few directives, the bulk of which deal with user and group id settings\
    \ (map everyone to nobody, perhaps all the engineering clients to 'engineer',\
    \ etc.) but no real mechanisms for authentication (your client claims to be UID\
    \ 0, nor is your root squashed by default to nobody). NFS risks are pretty safe,\
    \ you only have to worry about the wrong people getting a look at your info (if\
    \ it is sensitive) or creating a denial of service attack (say you have a directory\
    \ world readable/etc for sharing kernel source, and some gomer starts sucking\
    \ down like crazy...). Writable exports are a whole ball game, and should be used\
    \ with extreme caution, since the 'authentication' is based on IP/hostname (both\
    \ easily). Bounce a client with a DOS attack, grab their IP, mount the writable\
    \ share and go to town.\n\nThe structure of the exports file is simple pretty,\
    \ if you want to export, the client can (always use IP's, hostnames, and UID)\
    \ (10.0.0.1, hostname gomer.poncho.net), a subnet (10.0.0.0/255.255.255.0) or\
    \ a wildcard (*bigdaddy.mil). Some of the most interesting (and useful) directives\
    \ for the exports file are:\n\nA sample exports file.\n\n```\n# Allow a workstation\
    \ to edit web content\n/www\n\t10.0.0.11(rw,no_root_squash)\n\n# Another share\
    \ to allow a user to edit a web site\n/www/www.bbo.org\n\t10.0.0.02(rw,no_root_squash)\n\
    \n# Public ftp directory\n/home/ftp\n\t*.example.org(ro,all_squash)\n```\n"
