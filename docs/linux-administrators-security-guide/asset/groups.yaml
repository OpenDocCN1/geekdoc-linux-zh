    tftp (Trivial File Transfer Protocol) is used for devices that require information
    from a network server, typically at boot time. It is an extremely simple form
    of ftp, with most of the security and advanced commands stripped off, it basically
    allows a device to retrieve (upload) files from a server in a very simple manner.
    tftp is almost exclusively used for workstations, router configuration, and any
    device that boots up, and requires information as it presents a large security
    hole, if someone were to connect to your tftp server and grab the file for your
    Cisco router. Additionally tftp defaults to granting access to the file system,
    /etc/passwd file among others. Modern versions of tftp delimit access to, and
    TCP_WRAPPERS are used to limit access to hosts. By default tftp (at least for
    RedHat) gives access only to the /tboot directory. It is a good idea to keep the
    tftp directory as separate from the system as possible. This is by specifying
    the directory or directories tftp to have access to after the ftp command starts
    inetd.conf This example starts tftp normally and grants access to the /tboot directory
    and the /kickstart directory.


    ```

    tftp dgram root /usr/bin/tcp in.tftp /tboot

    /kickstart

    ```


    Also remember tftp uses ''ps aux'' wont necessarily show who is logged in or what
    they are doing (as opposed to ftp which shows up unless they are currently downloading
    a file since you are unlikely to catch them). The best place to monitor tftp is
    from syslog, but even tftp doesn''t log addresses or anything useful. The following
    is some ps output, and syslog output of an active tftp session.


    ```

    nobody 744 0.0 6 780 R 14:31 0:tftp

    Apr 24 14:31 hostname tftpd[744]: trying to get file

    Apr 24 14:31 hostname tftpd[744]: serving file from /tboot

    ```


    TFTP can be easily restricted using TCP_WRAPPERS and firewalling, tftp runs on
    port 69 simply restrict access to needed by your workstations and like, it is
    also a good idea to block all traffic at network boundaries, as there is no need
    for a machine to remote boot using tftp across the Internet. Also tftp runs as
    nobody, but since no authentication is done and all devices accessing the tftp
    server are doing so, the file level security is pretty useless. tftp runs on port
    69, only.


