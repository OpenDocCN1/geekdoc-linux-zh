    # QMAIL'
  - '[PAGE 71]


    Qmail (like postfix) was created as a direct response to perceived flaws in Sendmail.
    Qmail is GPL with a no binary distribution clause meaning you must install it
    from source code. Very little code in Qmail runs as root, and it is very modular
    compared to sendmail (which is a pretty monolithic piece of code). You can download
    it from: http://www.qmail.org/


    # Postfix


    Postfix was written by Wietse Venema, who is also responsible for TCP_WRAPPERS.
    Postfix is somewhat modern then Sendmail or Qmail in the way it attempts to deliver
    email, and was written to be very secure. Like most IBM products it has a very
    funky license, but appears to be mostly open source and free. Postfix is available
    at: http://www.postfix.org.


    # Zmailer


    Zmailer is a GPL mailer available at: http://www.zmailer.org/. It has crypto and
    generally looks like it is well built.


    # DMail


    DMail is a commercial mail server, and is not open source. You can download a
    trial version from: http://netwinsite.com/dmail_first.htm.'
  - '[PAGE 72]


    # POPD


    WU IMAPd (stock popd)


    POP and IMAP are fundamentally related but very different, I have split them apart.
    POP stands for "Post Office Protocol" and simply allows you to list messages,
    retrieve them, and delete them. There are many POP servers for Linux available,
    the one that ships with most distributions perfect for the majority of users.
    The main problems with POP are similar to many other protocols, in that usernames
    and passwords are transmitted in the clear, making it a very good target for packet
    sniffing. POP can be SSL''ified, however not all mail clients support SSL secured.
    Most POP servers are configured to use TCP_WRAPPERS, which is an excellent method
    for restricting access. Please see the earlier on TCP_WRAPPERS for more information.
    POP runs as root (since it must access mailboxes) and there have a number of nasty
    roots in various POP servers in the past. POP runs on ports 109 and 110 (109 is
    basically obsolete though), using the tcp protocol. The Washington University
    IMAP server also comes with a pop server and is generally the ''stock'' server
    that ships with most Linux distributions. You can get it from: http://www.washington.edu/imap/


    ```

    ifpwmad -I -a accept -p tcp -S 10.0.0.0/8 -D 0.0.0.0/0 110

    ifpwmad -I -a accept -p tcp -S some.trusted.host -D 0.0.0.0/0 110

    ifpwmad -I -a deny -P tcp tcp -S 0.0.0.0/0 -D 0.0.0.0/0 110

    ```


    or


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 110

    ipchains -A input -p tcp -j DENY -s some.trusted.host -d 0.0.0.0/0 110

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 110

    ```


    # Cyrus


    Cyrus is an imap (it supports pop and kpop) server aimed at ''closed'' environments.
    That is to say that the users will have any access to the mail server other than
    imap or pop protocols. This allows Cyrus to store the mail in a much more secure
    manner and allows for easier management of larger installations. Cyrus is GNU
    licensed and available from: http://andrew2.andrew.cmu.edu/cyrus/imap/


    # IDS POP


    IDS (It Doesn''t Suck) POP is a lighter pop replacement aimed at smaller installations.
    It is GPL and available from: http://www.nodomainname.net/software/ids-pop/'
  - '[PAGE 73]


    # IMAPD


    WU IMAPD (stock imapd)


    IMAP is POP on steroids. It allows you to easily maintain multiple accounts, have
    multiple people access one account, leave mail on the server, just download the
    headers, or bodies no attachments, and so on, IMAP is ideal for anyone on the
    go or with serious email needs. The default POP and IMAP servers that most distributions
    ship (bundled together into a single package named imapd oddly) fulfill most needs.


    IMAP also starts out as root, although imapd typically drops to the privilege
    of the user accessing it, and cannot be easily set to run as a non user since
    they have to open mailboxes (or in IMAP''s case create folders, etc. in the user''s
    home directory), so they cannot drop privileges as one would like. Nor can they
    be easily choked (IMAP needs access to /var/sp/mail, and IMAP needs access to
    the user''s home directory). The best policy is to keep the software up to, and
    if at all possible firewall pop and imap from the outside world, this works well
    if no one is on the road and to collect their email via the Internet. Washington
    University (WU) IMAPD is available from: http://www.washington.edu/imap/


    IMAP runs on port 143 and most IMAPD servers support TCP_WRAPPERS, making it relatively
    easy to lock down.


    ```

    ipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 143

    ipfwadm -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 143

    ipfwadm -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 143


    or

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 143

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 143

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 143

    ```


    # Cyrus


    Cyrus is an imap (it also supports pop and kpop) server at ''closed'' environments.
    It is to say that the users will not have any access to the mail server other
    than imap or pop protocols. This allows Cyrus to store the mail in a much more
    secure manner and allows for easier management of larger installations. Cyrus
    is GNU licensed and available from: http://andrew2.andrew.cmu.edu/cyrus/imap/'
- md: "\n## WWW based mail readers\n\nOne of the better solutions is to use a www\
    \ based mail client, these usually be run under a secure server with minimal extra\
    \ work, and have the added bonus of letting users check email safely from locations\
    \ that would normally make checking email difficult (while on vacation in Europe\
    \ for example). Unfortunately the majority of www based mail reading stinks, and\
    \ the good ones cost an arm and a leg.\n\n## Non Commercial\n\n### IMP\n\nIMP\
    \ requires the Horde module (available on the same site) and a www server capable\
    \ of PHP3 support. You can download IMP and Horde from: http://www.horde.org/imp/\n\
    \n### AtDot\n\nAtDot is GNU licensed and written in Perl. It has several modes\
    \ of operation making it suitable for a variety of www based email solutions (hotmail\
    \ style providers, ISP’s, etc.). You can download it from: http://www.nodomainname.net/software/atdot/\n\
    \n## Commercial\n\n### DmailWeb\n\nhttp://netwinsite.com/dmailweb/index.htm\n\n\
    ### WebMap\n\nhttp://netwinsite.com/webimap/index.htm\n\n## DNS\n\n### Bind\n\n\
    DNS is an extremely important service for IP networks, I would not hesitate to\
    \ say probably the MOST important network service (without no-one can find anything).\
    \ It also requires connections from the outside world, and due to the nature and\
    \ structure of DNS information DNS servers claim to may not be true. The main\
    \ provider of DNS server software (named, the de facto standard) is currently\
    \ looking at a form of DNS information authentication (basically RSA to cryptographically\
    \ sign the data, proving it is 'true').\n\nMost distributions are finally binding\
    \ 8.x, however none (to my knowledge) have shipped it set up for no root, chrooted\
    \ by default. Making the switch is even easier:\n\n- -u specifies which UID will\
    \ switch to once it is bound to port 53 (like to use a user called 'named' with\
    \ no login permissions, similar to 'nobody').\n- -g specifies which GID will switch\
    \ to once it is bound to port 53 (like to use a group called 'named', similar\
    \ to 'nobody').\n- -t\n\nAn easier way of running bind chrooted is to download\
    \ the bind-chroot package, available as a contrib package for most distributions,\
    \ and install it. After installation you will need a user and group called named\
    \ (which is what the bind server changes is UID/GID to), simply use groupadd and\
    \ useradd. Some packages use holelog to log information to /var/log/messages (as\
    \ bind would normally), if this isn't available you will have to install it which\
    \ is a chord. In order to add this configuration file for bind is usually set\
    \ up securely (i.e. you cannot query bind for the version information).\n\nAnother\
    \ aspect of bind is the information it contains about your network(s). When a\
    \ person queries a DNS server for information they typically make a small request\
    \ for one piece of information, i.e.: what is the IP address for www.sefried.org?\
    \ And there are domain servers, a DNS server recruits all the information for\
    \ sefried.org, and grabs it and can then make it available to other (in the case\
    \ of a secondary DNS server). This is potentially very dangerous, as anyone calls\
    \ and asks for it. Bind version 4 didn't really have much security, you could\
    \ limit permits to censor server, but not selectively enough to be useful. This\
    \ has changed in Bind 8, where there are global settings and most of these can\
    \ also be applied on a per domain basis. You can easily restrict transfers AND\
    \ queries, log queries, set maximum data sizes, and so on. Remember, when restricting\
    \ zone you must secure ALL name servers (master and the secondaries), as you can\
    \ transfer zones from a secondary just easily as a master.\n\nHere is a relatively\
    \ secure named.conf file (stolen from the bind-chroot package at ftp.tux.org):\n\
    \n```\noptions {\n    // The following paths are necessary for this chroot\n \
    \   directory \"/var/named\";\n    dump-file \"/var/tmp/named_dump.db\"; // _PATH_DUMPFILE\n\
    \    pid-file \"/var/run/named.pid\"; // _PATH_PIDFILE\n    statistics-file \"\
    /var/tmp/named.stats\"; // _PATH_STATS\n    memstatistics-file \"/var/tmp/named.memstats\"\
    ; // _PATH_MEMSTATS\n    // End necessary chroot paths\n    check-names master\
    \ warn; /* default. */\n    datasize 20M;\n}\n```\n\n```\nzone \"localhost\" {\n\
    \    type master;\n    file \"master/localhost\";\n    check-names fail;\n   \
    \ allow-update { none };\n    allow-transfer { any };\n}\n```\n\n```\nzone \"\
    0.0.127-in.addr.arpa\" {\n    type master;\n    file \"master/127.0.0\";\n   \
    \ allow-update { none };\n    allow-transfer { any };\n}\n```\n\n```\n// Deny\
    \ and log queries for our version number except from localhost\nzone \"bind\"\
    \ chaos {\n    type master;\n    file \"master/bind\";\n    allow-query (localhost);\n\
    }\n```\n\n```\nzone \".\" {\n    type hint;\n    file \"named.zone\";\n}\n```\n\
    \n```\nzone \"example.org\" {\n    type master;\n    file \"zones/example.org\"\
    ;\n    allow-transfer {\n        10.2.1.1;\n        10.3.1.1;\n    };\n}\n```\n\
    \nBind runs on port 53, using both udp and tcp, udp is used for normal domain\
    \ queries (it's lightweight and fast), tcp is used for zone transfers and large\
    \ queries (say dig www.microsoft.com). This firewalling tcp is relatively safe\
    \ and will definitely stop any zone transfers, the occasional DNS query might\
    \ not work. It is better to use named.conf to control transfers.\n\n```\nipfwadm\
    \ -I -a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/0 53\nipfwadm -I -a accept -P tcp\
    \ -s some.trusted.host -D 0.0.0.0/0 53\nipfwadm -I -a deny -P tcp -s 0.0.0.0/0\
    \ -D 0.0.0.0/0 53\n```\n\nor\n\n```\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8\
    \ -d 0.0.0.0/0 53\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d\
    \ 0.0.0.0/0 53\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 53\n\
    ```\n"
  mdcn: "\n\n## 基于 WWW 的邮件阅读器\n\n较好的解决方案之一是使用基于 WWW 的邮件客户端，这些客户端通常运行在安全的服务器下，额外工作极少，而且还有一个额外好处，即让用户能够在通常难以查收邮件的地方安全地检查邮件（例如在欧洲度假期间）。遗憾的是，绝大多数基于\
    \ WWW 的邮件阅读器体验都很糟糕，而优秀的工具则价格昂贵。\n\n## 非商业性\n\n### IMP\n\nIMP 需要 Horde 模块（可在同一站点获取）以及一个支持\
    \ PHP3 的 www 服务器。你可以从这里下载 IMP 和 Horde：http://www.horde.org/imp/\n\n### AtDot\n\
    \nAtDot 采用 GNU 许可并用 Perl 语言编写。它有多种运行模式，适用于各种基于 WWW 的电子邮件解决方案（Hotmail 风格的供应商、ISP\
    \ 等）。你可以从这里下载：http://www.nodomainname.net/software/atdot/\n\n## 商业性\n\n### DmailWeb\n\
    \nhttp://netwinsite.com/dmailweb/index.htm\n\n### WebMap\n\nhttp://netwinsite.com/webimap/index.htm\n\
    \n## DNS\n\n### Bind\n\nDNS 是 IP 网络中极其重要的服务，我不毫不犹豫地说，它可能是**最重要**的网络服务（如果没有它，将找不到任何东西）。它还需要来自外部世界的连接，而且由于\
    \ DNS 信息的性质和结构，DNS 服务器所声称的信息可能并非真实。DNS 服务器软件的主要供应商（即事实上的标准）目前正在研究一种 DNS 信息认证形式（基本上是使用\
    \ RSA 对数据进行密码学签名，以证明其是“真实”的）。\n\n大多数发行版最终都使用了 bind 8.x 版本，但（据我所知）没有哪一个是默认配置为非\
    \ root 且经过 chroot（根禁）处理运行的。进行切换甚至更简单：\n\n- -u 指定在绑定到 53 端口后切换到哪个 UID（例如使用一个名为\
    \ 'named' 且没有登录权限的用户，类似于 'nobody'）。\n- -g 指定在绑定到 53 端口后切换到哪个 GID（例如使用一个名为 'named'\
    \ 的组，类似于 'nobody'）。\n- -t\n\n运行 chrooted 版本的 bind 更简单的方法是下载 `bind-chroot` 软件包（大多数发行版都作为\
    \ contrib 软件包提供）并安装它。安装后，你需要一个名为 `named` 的用户和组（这是 bind 服务器要切换的 UID/GID），只需使用 `groupadd`\
    \ 和 `useradd` 即可。某些软件包使用 `holelog` 将信息记录到 `/var/log/messages`（就像 bind 通常做的那样），如果不可用，你需要安装它，这很麻烦。为了给\
    \ bind 添加此配置文件，通常会配置得很安全（即你无法向 bind 查询版本信息）。\n\nbind 的另一个方面是它包含了关于你的网络的信息。当某人向\
    \ DNS 服务器查询信息时，他们通常会对某项信息发出一个很小的请求，例如：www.sefried.org 的 IP 地址是什么？存在域名服务器，DNS 服务器会收集\
    \ sefried.org 的所有信息并将其抓取，然后将其提供给其他服务器（在辅助 DNS 服务器的情况下）。这具有潜在的危险性，因为任何人都可以调用并请求。Bind\
    \ 版本 4 并没有多少安全性，你可以限制许可的审查服务器，但细粒度不足，无以产生实用价值。这在 Bind 8 中发生了变化，那里有全局设置，且大部分这些设置也可以应用于单个域名。你可以轻松地限制传输和查询、记录查询、设置最大数据大小等。记住，在限制区域时，必须保护**所有**名称服务器（主服务器和辅助服务器），因为你可以像主服务器一样轻松从辅助服务器传输区域。\n\
    \n这里是一个相对安全的 `named.conf` 文件（取自 ftp.tux.org 的 `bind-chroot` 软件包）：\n\n```\noptions\
    \ {\n    // 以下路径对于此 chroot 是必要的\n    directory \"/var/named\";\n    dump-file\
    \ \"/var/tmp/named_dump.db\"; // _PATH_DUMPFILE\n    pid-file \"/var/run/named.pid\"\
    ; // _PATH_PIDFILE\n    statistics-file \"/var/tmp/named.stats\"; // _PATH_STATS\n\
    \    memstatistics-file \"/var/tmp/named.memstats\"; // _PATH_MEMSTATS\n    //\
    \ 必要 chroot 路径结束\n    check-names master warn; /* default. */\n    datasize 20M;\n\
    }\n```\n\n```\nzone \"localhost\" {\n    type master;\n    file \"master/localhost\"\
    ;\n    check-names fail;\n    allow-update { none };\n    allow-transfer { any\
    \ };\n}\n```\n\n```\nzone \"0.0.127-in.addr.arpa\" {\n    type master;\n    file\
    \ \"master/127.0.0\";\n    allow-update { none };\n    allow-transfer { any };\n\
    }\n```\n\n```\n// 来自 localhost 外，拒绝并记录对我们版本数的查询\nzone \"bind\" chaos {\n    type\
    \ master;\n    file \"master/bind\";\n    allow-query (localhost);\n}\n```\n\n\
    ```\nzone \".\" {\n    type hint;\n    file \"named.zone\";\n}\n```\n\n```\nzone\
    \ \"example.org\" {\n    type master;\n    file \"zones/example.org\";\n    allow-transfer\
