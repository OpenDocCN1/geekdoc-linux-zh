    you have four areas of configuration: [globals], [printers], [homes], and each
    [sharename] it''s own configuration (be it a printer or drive share). There are
    a number of switches, the samba conf page covers exhaustively. Of the important
    (security) ones are:


    security = xxxx where xxxx is the server or domain, security is per share, with
    a password that everyone gets to get at, or means the samba server itself authenticates
    users, either via /etc/password, or smpasswd If you set it to domain, samba authenticates
    the user via an NT controller, thrashing nicely into your existing NT network
    (if you have one).


    guest account = xxxx where xxxx is the username of the account you want the guest
    user to map. If a share is defined then all requests to it are handled as this
    user.


    hosts allow = xxxx where xxxx is a space separated list of hosts / IP blocks allowed
    to connect to the server.


    hosts deny = xxxx where xxxx is a space separated list of hosts / IP blocks not
