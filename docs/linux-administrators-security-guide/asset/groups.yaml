    # SMTP


    Sendmail


    Sendmail is another one of those services most of us have a love/hate relationship
    with. We hate to admit and we''d love to replace it. It is usually not possible,
    as sendmail has many features and stability, with the downside being it runs as.
    Newer mail packages such as qmail, address these problems however they also suffer
    problems, qmail lacks certain features (anti spam/UBE) that sendmail has, as well
    as no binary distribution clause (actually you can make binary distributions but
    the restrictions are very heavy and you must gain the authors permission, he will
    probably not grant if you do not follow his restrictions to the letter.


    Sendmail has earned itself a very bad reputation for service, however I find hard
    to blame software when it finds running versions of sendmail like 8.6.x, we are
    now up to 8.9.1. The root of the problem is almost everyone runs sendmail (estimates
    %70 of all Internet email passes through a sendmail box on its journey), so as
    soon as a bug is found, finding a system to exploit isn''t all that. The last
    releases of sendmail have been quite good, no root hacks, and et with the new
    anti spam features are finally to come of age. More information on Sendmail and
    source code is available from: http://www.sendmail.org/


    Chrooting sendmail is a good option, but a lot of work, and it runs as root, debatable
    as to the effectiveness of it (since root can break out of a chrooted jail). I
    find by keeping sendmail up to date, you can pretty much yourself safe, if a new
    exploit comes out and the patch takes 24 hours we''re poop creek, the same applies
    to any piece of software though. Also by using Sendmail''s advanced anti spam
    features you can effectively block 99% of all spam coming to you, and prevent
    other from using your system to relay spam.


    Keeping sendmail up to date is relatively simple, I would recommend minimally
    version 8.9.3 (the 8.9 series has more anti-spam features, 8.8.7 has most of these
    features as well assuming you have a properly setup sendmail.cf), although the
    newer releases are generally shipping the 8.9.x. You can also get the source from
    ftp.sendmail.org, but compiling sendmail is not for the faint of heart or those
    who do not have a chunk of time to devote to.


    Sendmail only needs to be accessible from the outside world if you are actually
    using it to receive mail from other machines and deliver the mail. If you only
    want to run sendmail so that local delivery works (i.e. a stand alone workstation,
    test server or other) and so can easily be sent to other machines simply firewall,
    or to not run it in daemon mode. Sendmail can run in a queue flushing node, where
    it simply ''wakes'' once in a while and processes local mail, either delivering
    it locally, or sending it off on it''s across the net. To set sendmail in queue
    mode:


    ```

    edit /etc/rc.d/sendmail

    and change the line:

    daemon /usr/sbin/sendmail -bd -qlh

    nto:

    daemon /usr/sbin/sendmail -qlh

    ```'
- md: '

    Note if you use your system to send lots of email you may wish to set the queue
    flush timer lower, perhaps -q15m (15 minutes) - now outbound and system internal
    mail will behave just fine, unless you run a mail server, which is perfect.


    Now for all those wonderful anti-spam features in sendmail. Sendmail''s configuration
    files consist of (this applies to Sendmail 8.9.x):


    ```

    /etc/sendmail.cf

    Primary config file, also tells where other config files are

    ```


    ```

    /etc/mail/

    You can define the location of configuration files in sendmail.cf, typically people
    place them in /etc/ or /etc/mail/ (which keeps it a little cluttered).

    ```


    ### access

    Access list database, allows you to reject email from certain sources (IP or domain),
    and control relaying easily. My access file looks like:


    + - 10.0.0 RELAY

    - spam.com REJECT


    which means 10.0.0.* (on my network) are allowed to use the email server to send
    email when they want, and that all email to or *.spam.com is rejected. There are
    lists of known spammers, typically they are 5-10,000 entries long, this can seriously
    impede sendmail performance (as each connection is checked against this list),
    on the other hand having your sendmail used to send spam is even worse.


    ### aliases

    alias file, allows you to control delivery of mail local to the system, useful
    for backing up incoming users to a separate spool. SmartList uses this file to
    get mail sent to lists delivered to the programs that actually process them.


    ### domaintable

    domain table (adding domains) that you handle, useful for virtual hosting.


    ### majordomo

    configuration file for majordomo, I would personally recommend SmartList over
    Majordomo.


    ```

    sendmail.cw

    file containing names of hosts for which we receive email, useful if you host
    more than one domain.

    ```


    ```

    sendmail.hf

    location of help file (telnet to port 25 and type in "HELP")

    ```


    ### virtertable

    Virtual user table, maps incoming users, i.e. maps sales@example.org to john@example.org.


    Sendmail 8.9.x (and previous versions) do not really support logging of all email
    very nicely (something required in today''s world for legal reasons by many companies).
    This is one feature being worked on for the release of Sendmail 8.10.x. Until
    there are 2 ways of logging email, the first is somewhat graceful and emails coming
    IN to users on a user basis. The second method is not graceful and involves a
    raw log of all SMTP transactions into a file, you would have to write some sort
    of processor (probably in perl) to make the log useful.


    Mail (incoming SMTP connections to be more precise) is first filtered by the access
    file, in here we can REJECT mail from certain domains/IPs, and RELAY mail from
    certain hosts (i.e. your internal network of machines). Any local domains you
    actually host will go into sendmail.csv. Assuming mail has met the rules and is
    queued for local delivery the file gets virtertable, this is a listing of email
    addresses mapped to the account name/other email address. i.e.:


    ```

    seifried@seifried.org

    listuer@seifried.org

    seifried.org nmangled-emails

    ```


    The last rule is to catch so mangled email addresses do not get bounced, and instead
    send to a mailbox. The aliases file is checked, if an entry is found it does what
    it says, otherwise it attempts to deliver to a local users, my aliases entry for
    seifried:


    alias-seifried: seifried, "/var/backup-spool/seifried"


    This may email get delivered to my local mailbox, or a backup mailbox (in case
    I delete an email I really meant not to, or god forbid, Outlook could poke somebody
    and hose my mailboxes). This would also be useful for corporations, as you now
    have a backup of all incoming email on a user basis, and can allow (or not) to
    access the file backed up mail.


    One way, using a catch rule for a domain (i.e. @seifried.org) you can create an
    alias for EACH account, and for mailing lists. Otherwise when it looks through
    the list and doesn''t find a entry (for say mailing-list@seifried.org) it will
    send it to the mailbox specified by the catch alias. For this reason you might
    not wish to use a catch rule all.


    The second method is very simple, you simply start sendmail with the -x option
    and specify a file to log all transactions. This file will grow very large quickly,
    I would NOT recommend using this method to log email unless you absolutely must.


    Firewall sending it out on port 25, tcp:


