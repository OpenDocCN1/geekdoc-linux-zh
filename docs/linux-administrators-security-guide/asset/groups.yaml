    ## PAM


    Pluggable Modules for Linux is a suite of shared libraries that enable the local
    system administrator to choose how applications authenticate.” from the PAM documentation,
    I don''t think I could have said it better. But what does this actually mean?
    Take a ‘normal’ program, say login, when a user connects to a tty (via modem)
    a getty program answers the call (as it were) and usually starts up the ‘login’
    program, login requests a username, by a password, which it checks against the
    /etc/passwd file. So PAM introduces a layer of middleware (nice buzz?) between
    the program and the actual authentication mechanism. Once a program is PAMified,
    any authentication methods PAM supports will be usable by the program. In addition
    to this PAM can handle account, and session data which is something ‘normal’ authentication
    mechanisms don’t do. Using PAM for example you can easily disable login access
    by normal users between 6pm and 6am, preventing security risks. By default RedHat
    systems are PAM aware, I''m not sure of any other distributions that are, in RedHat
    all I have to do implement shadow passwords is convert the password and group
    files, and possibly add one or two lines to some config files (if they ''re already
    added). Essentially PAM gives you a great deal of flexibility when handling user
    authentication, and will support other features in future such as transparent
    chroot’ing of users (be they telneting in, or piping). This kind of flexibility
    will be required for Linux to be an enterprise class operating system. Distributions
    that do not as “pam aware” can be made so but it requires a lot of effort (you
    must recompile all your programs with PAM support, install PAM, etc), it is probably
    easier to switch straight to a PAMified distribution if this will be a requirement.
    PAM usually comes with complete documentation, and if you are looking for a general
    overview you should visit:

    ://www.sun.com/software/solaris/pam/

