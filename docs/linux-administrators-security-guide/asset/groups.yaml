    # SQUID


    SQUID is a powerful and fast Object Cache. It proxies FTP and WWW sessions, basically
    giving it many of the properties of an FTP and a WWW server, but it only reads
    and writes files within its cache directory (so we hope), making it relatively
    safe. Squid would be very hard to compromise the system it is on, in addition
    to running as a root user (typically ''nobody''), so generally it''s not much
    to worry about. Your main worry with squid should be improper configuration, for
    example if squid is hooked up to your internal network (as is usually the case),
    and the internet (again, very common), it could actually be used to reach internal
    hosts (even if they are using non-routed IP addresses). Proper configuration of
    squid is very important.


    The simplest way to make sure this doesn''t happen is to use squid''s internal
    configuration and only bind to the internal interface(s), not letting the outside
    world attempt to use it as a proxy to your internal LAN, in addition to this firewalling
    it is a good idea. Squid can also be used as an HTTP accelerator, perhaps you
    have a WWW Server on the internal network that you want to share with the world,
    in this case it gets a bit harder to configure but it is possible to do securely.
    Fortunately that squid has good ACL''s (Access Control Lists), allowing you to
    lock down access by names, ips, times of day, actual day (perhaps allow unlimited
    browsing on the weekends for people who actually come to the office). Remember
    that the more complicated the ACL is, the slower it will be to respond to requests.


    The ACL''s work by defining rules, and then applying those rules, for example:


    ```

    acl internet 10.0.0.0/255.255.0.0

    http_access allow internet

    http_access deny all

    ```


    Which defines "internet" as being anything with a source of 10.0.0.0/255.255.255.0,
    allowing it to access the http caching port, and denying everything else. Remember
    that rules are read in the order given, just like ipfwadm, allowing you to get
    very complex (and make mistakes if you are not careful). Always start with the
    specific rules followed by more general rules, and remember to put block denials
    after specific allows, otherwise it might make it through. It''s better to accidentally
    deny everything than to let it through, as you''ll find out that after denials
    (from annoyed users) faster than those that get through (when annoyed users notice
    accounting files from the internal www server appearing on the Internet). The
    squid configuration files (squid.conf) is well commented (to the point of overkill)
    and also has a decent man-page.


    Another useful example is blocking ads, so to block them you can add the following
    to squid.conf:


    ```

    acl ads dstdomain ads.blah.com

    http_access deny ads

    ```


    The acl declaration is simply a pattern, be it destination domain name, source
    domain name, regex and so on, the http_access declare activates what to do with
    it (deny, allow, etc). Properly setup this is an extremely powerful tool to restrict
    access to the WWW, unfortunately it does have one Achilles heel, it doesn''t support
    user based authentication and control (not that may product do in any case). Remember
    that like any of rules they are read from top to bottom, so put your specific
    denials and allows first, and then the more general rules. The squid.conf file
    should be well commented and self explanatory, the squid FAQ is at: http://squid.nlar.net/Squid/FAQ/FAQ.html.


    One important security issue that many people overlook is the log files it keeps.
    By default squid may or not log every request it handles (depends on the config
    file), from http://www.nsa.gov/ to "members.porn.com/bin/access&johndoe&password=booboo".
    You definitely want to disable the access logs you want to keep a close eye on
    what people view of the Internet (legally this is questionable, check with your
    lawyers), the directive is "cache_access_log" and to disable it to "/dev/null",
    this logs all accesses, and ICP queries (inter-cache communications). The next
    one is "cache_store_log", which is actually useful for generating statistics on
    how effective your www cache is, it doesn''t log who made the request, simply
    what the status of objects in the cache is, so in case you see the pictures on
    playgrounds being repeatedly served, to disable it to "none". The "cache_log"
    should properly left on, it contains basic debugging info such as when the server
    was started and when it was stopped, to disable it to "/dev/null". Another, not
    well documented log files are cache_swap_log, which keeps a record of what is
    going with the cache, and will also show who people are serving (but not who/etc),
    setting this to "/dev/null" doesn''t work (in squid out) and setting it to "none".
    The only way to stop it is to link the file to "/dev/null" (by the default root
    of your cache), and also link to "log-cache-last" (although in quick tests it
    doesn''t appear to store anything) in squid.conf:


    ```

    cache_access_log /dev/null

    cache_store_log none

    cache_log /dev/null

    ```


    and link:

    /var/spool/squid/log to /dev/null

    /var/spool/squid/log-cache-last to /dev/null


    Another issue that gets forgotten is ICP (Internet Cache Protocol) component of
    squid. The only time you will use ICP is if you create arrays of proxy servers.
    If you have only one proxy you should disable ICP. This is easily by setting the
    ICP port in squid.conf from the default "3138" to "0". You should also firewall
    it from the Internet:


    ```

    ipfwadm -I accept -P tcp -S 10.0.0.0/8 -D 0

    ipfwadm -I accept -P tcp -S some.trusted.host -D 0

    ipfwadm -I deny -P tcp -S 0.0.0.0/0 -D 0

    ```


    or ipchains:


    ```

    ipchains -A input -j ACCEPT -s 10.0.0.0/8 -d 0

    ipchains -A input -j ACCEPT -s some.trusted.host -d 0

    ipchains -A input -j DENY -s 0.0.0.0/0 -d 0

    ```


    # SMTP Sendmail


    Sendmail is another one of those services most of us have a love/hate relationship
    with. We hate to admit and we''d love to replace it. It is usually not possible,
    as sendmail has many features and stability, with the downside being it runs as
    root. Newer mail packages such as qmail address these problems however they also
    suffer problems, qmail lacks certain features (anti-spam) that sendmail has, as
    well as no binary distribution clause (actually you can make binary distributions
    but the restrictions are very heavy and you must gain the authors permission,
    he will probably not grant if you do not follow his restrictions to the letter).


    Sendmail has earned itself a very bad reputation for service, however I find hard
    to blame software when it finds running versions of sendmail like 8.6.x, we are
    now up to 8.9.1. The root of the problem is almost everyone runs sendmail (estimates
    70% of all Internet email passes through a sendmail box on its journey), so as
    soon as a bug is found, finding a system to exploit isn''t all that. The last
    releases of sendmail have been quite good, no root hacks, and the new anti spam
    features are finally coming of age. More information on Sendmail and source code
    is available from: http://www.sendmail.org


    Chrooting sendmail is a good option, but a lot of work, and it runs as root, debatable
    as to the effectiveness of it (since root can break out of a jailed jail). I find
    by keeping sendmail up to date, you can pretty much feel safe, if a new exploit
    comes out and the patch takes 24 hours we''re in creek, the same applies to any
    piece of software though. Also by using Sendmail''s advanced anti spam features
    you can effectively block 99% of all spam coming to you, and prevent others from
    using your system to relay spam.


    Keeping sendmail up to date is relatively simple, I would recommend minimally
    version 8.9.3 (the 8.9 series has more anti-spam features, 8.8.7 has most of these
    features as well assuming you have a properly setup sendmail.cf), although the
    newer releases are generally shipping the 8.9.x. You can also get the source from
    ftp.sendmail.org, but compiling sendmail is not for the faint of heart or those
    who do not have a chunk of time to devote.


    Sendmail only needs to be accessible from the outside world if you are actually
    using it to receive mail from other machines and deliver the mail. If you only
    want to run sendmail so that local delivery works (i.e. a standalone workstation,
    test server or other) and so can easily be sent to other machines simply firewall,
    or to not run it in daemon mode. Sendmail can run in a queue flushing node, where
    it simply ''wakes'' once in a while and processes local mail, either delivering
    it locally, or sending it off on its across the net. To set sendmail in queue
    mode:


    ```

    edit /etc/rc.d/sendmail

    and change the line:

    daemon /usr/sbin/sendmail -bd -qlh

    nto:

    daemon /usr/sbin/sendmail -qlh

    ```

