  - '[PAGE 92]


    # ntpd


    NTP (Network Time Protocol) is rather simple in its mission, it keeps computers
    clocks in synchronization. So? Try comparing log files from 3 separate servers
    if their clocks are out of sync by a few minutes. NTP simply works by a client
    connecting to a time server, working out the delay between them (on a local LAN
    it might be only 1-2ms, across the internet it may be several ms), and then it
    asks for the time and sets its clock. Additionally servers can be ''clustered''
    to keep themselves synchronized, the chances of 3 or more servers losing track
    of what time it is (also called ''drift'') is relatively low. The time signal
    is typically generated by an atomic clock or GPS signal, measured by a computer,
    these are ''stratum 1'' servers, below them are stratum 2 time servers that are
    publicly accessible, a company maint might have its own 3 time servers if they
    have sufficient adjustment, and so on. The data NTP exchanges is of course not
    terribly sensitively, it''s a time signal, however if an attacker were able to
    tamper with it all sorts of notwithstanding cost log might be rendered unusable,
    accounts might be expired early, copy jobs that run your server in prime time
    causing delays, Then it is a good idea to run your time server(s) set at the maximum
    adjustment they will make only a few seconds (shouldn''t drift much anyway). If
    you are really poorly, or have a great number of clients you consider buying a
    GPS time unit they come in all shapes and sizes, from a Ia rack mount that plugs
    directly into your ISA and PCI cards into a server and have an antenna. It is
    a good idea to firewall your time servers, as a denial of service attack would
    be detrimental to your network, in addition to if possible you should use the
    encryption in DES it is generally sufficient to thwart most attackers. There are
    usually no pages with ntpd or xntpd (well documented) help that can be found in
    /usr/doc/name/ typically, or at: http://www.eeces.udel.edu/~ntpd/spool/index.htm.
    NTP runs on port 123 using udp, and firewalling it is relatively simple:


    ```

    ipchains -I input -p udp -j ACCEPT -s 10.0.0.0/8 -D 0.0.0.0/0 123

    ipfwmad -I a accept -p udp -s some.trusted.host -D 0.0.0.0/0 123

    ipfwmad -I a deny -p udp -j DENY -s 0.0.0.0/0 -D 0.0.0.0/0 123

    ipfwmad -I a accept -p tcp -s 10.0.0.0/8 -D 0.0.0.0/0 123

    ipfwmad -I a accept -p tcp -s some.trusted.host -D 0.0.0.0/0 123

    ipfwmad -I a deny -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123


    oripchains -A input -p udp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 123

    ipchains -A input -p udp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 123

    ipchains -A input -p udp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 123

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 123

    ```'
- md: "\nCVS allows multiple developers to work together on source code projects and\
    \ maintain large code base in a somewhat sane manner. CVS's internal security\
    \ mechanisms are rather simple (and some would say weak) on their own, and I would\
    \ have to agree. CVS's authentication is typically achieved over the network using\
    \ pserver, usernames are sent in clear text, and passwords are trivially hashed\
    \ (no security reality). To get around this you have several good options. In\
    \ a Unix environment probably the simplest method is to use SSH to tunnel connections\
    \ between the client and the server, \"Time Wemaster\" (Tim Hemel) has written\
    \ an excellent page covering that I would not bother to refresh, and it is available\
    \ at: http://cubic.xa4.nl/~cvs/. A somewhat more complicated (but better in the\
    \ long run for large installations) is to kerberize the CVS server and clients,\
    \ type large networks (especially in university environments) already have an\
    \ established Kerberos infrastructure. On kerberizing the CVS are already available\
    \ at: http://www.cyclic.com/cyclic-pages/security.html. Apart from that I would\
    \ strongly urge firewall CVS unless you are using it for some public purpose (such\
    \ as an open source project across the Internet).\n\nAnother tool for securing\
    \ CVS that just appeared is \"cvsd\", a wrapper for pserver chroot's and/or suid\
    \ to a harmless user, cvsd is available at: http://chblack.mokey.com/cvsd/ in\
    \ rpm format and a source tarball.\n\nThere are other obvious concerns you should\
    \ be aware of, when dealing with source code you should be ensure no Trojan horses\
    \ or backdoors are replaced. In an open source project this is relatively simple,\
    \ review the code people submit, especially if it is a publicly accessible effort,\
    \ make sure you have back ups. CVS uses port 2401, tcp.\n\n```\nipfwadm -I a accept\
    \ -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 2401\nipfwadm -I a accept -P tcp -S some.trusted.host\
    \ -D 0.0.0.0/0 2401\nipfwadm -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 2401\n\
    ```\n\nor\n\n```\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0\
    \ 2401\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 2401\n\
    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 2401\n```\n\nrsync\
    \ is an extremely efficient method for mirroring files, be it source code files\
    \ of a CVS tree, a web site, or even this document rsync preserves file permissions,\
    \ links, file times and, in addition to this it supports an anonymous mode (which\
    \ incidentally I use for the mirroring of this document) that makes life very\
    \ easy for all concerned. The rsync program itself can act as the client (from\
    \ a command line or script) and as the server (typically run in inetd). The program\
    \ is quite secure, it does not require root privileges as a client or the server\
    \ (although if you really want to, and can choose into the root directory of whatever\
    \ is mirrored (which however requires root privileges and can be more dangerous\
    \ than it is worth). You can also map the user id and group it will access the\
    \ system (the default is nobody for precompiled rsync packages and is probably\
    \ the best choice). In non anonymous mode rsync supports usernames and passwords,\
    \ that are encrypted quite using 128 bit MD4. The \"rsync.conf\" page clearly\
    \ sets up rsync as a server and making it relatively fast. The default configuration\
    \ file is /etc/rsync.conf, and has a global section, and module sections (basically\
    \ each shared out directory is a module).\n\nrsync example:\n\n```\nmotd file\
    \ = /etc/rsync.modt # specifies a file to be displayed, legal\ndisclaimer, etc\n\
    max connections = 5      # maximum number of connections so you don't\nget flooded\n\
    [pub-ftp]\n    comment = public ftp area # simple comment\n    path = /home/ftp/pub\
    \     # path to the directory\n    read only = yes          # make it read only,\
    \ great for exported\n    chroot = yes             # chroot to /home/ftp/pub\n\
    \    uid = nobody             # explicitly set the UID\n    gid = nobody     \
    \        # explicitly set the GID\n[secret]\n    comment = my stuff # path to\
    \ my stuff\n    path = /home/user/secret\n    list = no               # hide this\
    \ module when asked for\n    secrets file = /etc/rsync.users # password file\n\
    \    auth = bob   # list of users to see my\n    hosts = 1.1.1.1, 2.2.2  # list\
    \ of hosts to allow\n```\n\nAs you can see rsync is configurable, and generally\
    \ secure, the exception being the actual transfers are not encrypted in any way.\
    \ If you need free suggest using SSH to tunnel a connection, or some VPN solution\
    \ like WAN. Also make sure you are running rsync 2.3.x or have potential compromise\
    \ found in 2.2.x. Rsync is available at: http://rsync.org/. Rsync runs on port\
    \ 873, tcp.\n\n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 873\n\
    ipfwadm -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 873\nipfwadm -I a\
    \ deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 873\n```\n\nor\nipchains -A input -p tcp\
    \ -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 873\nipchains -A input -p tcp -j ACCEPT\
    \ -s some.trusted.host -d 0.0.0.0/0 873\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0\
    \ -d 0.0.0.0/0 873\n```\n\nlpd is the UNIX facility for printing (Line Printer\
    \ Daemon). It allows you to submit printjobs, run them through filters, manage\
    \ the print queues, and so on. lpd can accept print jobs locally, or over the\
    \ network, and access various parts of the system (logging daemons, etc), making\
    \ it a potential security hole. lpd has been the source of several nasty roots,\
    \ however it seems to have mostly fixed now, there are still many potential denial\
    \ of service attacks due to its function (something like submitting printjobs\
    \ and running the printer out of paper). Frequently lpd is slowly being phased\
    \ out with the advent of network aware printers, however there is still of printing\
    \ doing lpd access is controlled via /hosts, and /hosts.lpd. You should also firewall\
    \ lpd from the outside world, and if you need to send printjobs across public\
    \ networks, remember anyone can read them, so a VPN solution is a good idea. Lpd\
    \ runs on port 515, tcp. the hosts.lpd file should contain a list of hosts (workstation1,yourdomain.com,\
    \ etc), one per line that are allowed to use the Lpd services on the server, which\
    \ you as well use ipfwadm/ipchains\n\n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8\
    \ -D 0.0.0.0/0 515\nipfwadm -A accept -P tcp -S some.trusted.host -D 0.0.0.0/0\
    \ 515\nipfwadm -A deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 515\n```\n\nor\nipchains\
    \ -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 515\nipchains -A input\
    \ -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 515\nipchains -A input -p\
    \ tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 515\n\n\n## LPRng\n\nAn alternative to\
    \ the stock lpd is “LPRng (LPR Next Generation), it provides new enhancements\
    \ and also supports a higher level of security. LPRng supports Kerberos and PGP\
    \ based authentication, as well as a restrictions file, /etc/lpd.perms, which\
    \ allows you to control access based on user, group, authentication, IP, and so\
    \ on, allowing for extremely flexible and secure configurations. LPRng has excellent\
    \ documentation and is available at: http://www.astart.com/lpr/LPRng.html.\n\n\
    ## pdq\n\npdq is another LPD replacement, no real emphasis on enhanced security\
    \ but it seems to offer some improvements management and performance wise over\
    \ the stock LPD. You can get pdq from: http://feynman.tam.uiuc.edu/pdq/\n\n##\
    \ X Window System\n\nThe X Window System provides a network transparent method\
    \ for sharing graphical data, or more specifically for exporting the display of\
    \ a program to a remote (the local) host. Using it you can run a 3d rendering.\
    \ This is a very powerful tool, but it is also very dangerous. The X Window System\
    \ has been the source of many vulnerabilities, however it seems to have mostly\
    \ fixed now, there are still many potential denial of service attacks due to its\
    \ function. You should also firewall X from the outside world, and if you need\
    \ to send data across public networks, remember anyone can read them, so a VPN\
    \ solution is a good idea. X runs on port 6000, tcp. The hosts.access file should\
    \ contain a list of hosts (workstation1,yourdomain.com, etc), one per line that\
    \ are allowed to use the X services on the server, which you as well use ipfwadm/ipfwchains\n\
    \n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 6000\nipfwadm -A\
    \ accept -P tcp -S some.trusted.host -D 0.0.0.0/0 6000\nipfwadm -A deny -P tcp\
    \ -S 0.0.0.0/0 -D 0.0.0.0/0 6000\n```\n\nor\nipchains -A input -p tcp -j ACCEPT\
    \ -s 10.0.0.0/8 -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host\
    \ -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0\
    \ 6000\n```\n\n## CVS\n\nCVS allows multiple developers to work together on source\
    \ code projects and maintain large code base in a somewhat sane manner. CVS's\
    \ internal security mechanisms are rather simple (and some would say weak) on\
    \ their own, and I would have to agree. CVS's authentication is typically achieved\
    \ over the network using pserver, usernames are sent in clear text, and passwords\
    \ are trivially hashed (no security reality). To get around this you have several\
    \ good options. In a Unix environment probably the simplest method is to use SSH\
    \ to tunnel connections between the client and the server, \"Time Wemaster\" (Tim\
    \ Hemel) has written an excellent page covering that I would not bother to refresh,\
    \ and it is available at: http://cubic.xa4.nl/~cvs/. A somewhat more complicated\
    \ (but better in the long run for large installations) is to kerberize the CVS\
    \ server and clients, type large networks (especially in university environments)\
    \ already have an established Kerberos infrastructure. On kerberizing the CVS\
    \ are already available at: http://www.cyclic.com/cyclic-pages/security.html.\
    \ Apart from that I would strongly urge firewall CVS unless you are using it for\
    \ some public purpose (such as an open source project across the Internet).\n\n\
    Another tool for securing CVS that just appeared is \"cvsd\", a wrapper for pserver\
    \ chroot's and/or suid to a harmless user, cvsd is available at: http://chblack.mokey.com/cvsd/\
    \ in rpm format and a source tarball.\n\nThere are other obvious concerns you\
    \ should be aware of, when dealing with source code you should be to ensure no\
    \ Trojan horses or backdoors are replaced. In an open source project this is relatively\
    \ simple, review the code people submit, especially if it is a publicly accessible\
    \ effort, make sure you have back ups. CVS uses port 2401, tcp.\n\n```\nipfwadm\
    \ -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 2401\nipfwadm -I a accept -P tcp\
    \ -S some.trusted.host -D 0.0.0.0/0 2401\nipfwadm -I a deny -P tcp -S 0.0.0.0/0\
    \ -D 0.0.0.0/0 2401\n```\n\nor\n\n```\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8\
    \ -d 0.0.0.0/0 2401\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d\
    \ 0.0.0.0/0 2401\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 2401\n\
    ```\n\nrsync is an extremely efficient method for mirroring files, be it source\
    \ code files of a CVS tree, a web site, or even this document) rsync preserves\
    \ file permissions, links, file times and, in addition to this it supports an\
    \ anonymous mode (which incidentally I use for the mirroring of this document)\
    \ that makes life very easy for all concerned. The rsync program itself can act\
    \ as the client (from a command line or script) and as the server (typically run\
    \ in inetd). The program is quite secure, it does not require root privileges\
    \ as a client or the server (although if you really want to, and can choose into\
    \ the root directory of whatever is mirrored (which however requires root privileges\
    \ and can be more dangerous than it is worth). You can also map the user id and\
    \ group it will access the system (the default is nobody for precompiled rsync\
    \ packages and is probably the best choice). In non anonymous mode rsync supports\
    \ usernames and passwords, that are encrypted quite using 128 bit MD4. The \"\
    rsync.conf\" page clearly sets up rsync as a server and making it relatively fast.\
    \ The default configuration file is /etc/rsync.conf, and has a global section,\
    \ and module sections (basically each shared out directory is a module).\n\nrsync\
    \ example:\n\n```\nmotd file = /etc/rsync.modt # specifies a file to be displayed,\
    \ legal\ndisclaimer, etc\nmax connections = 5      # maximum number of connections\
    \ so you don't\nget flooded\n[pub-ftp]\n    comment = public ftp area # simple\
    \ comment\n    path = /home/ftp/pub     # path to the directory\n    read only\
    \ = yes          # make it read only, great for exported\n    chroot = yes   \
    \          # chroot to /home/ftp/pub\n    uid = nobody             # explicitly\
    \ set the UID\n    gid = nobody             # explicitly set the GID\n[secret]\n\
    \    comment = my stuff # path to my stuff\n    path = /home/user/secret\n   \
    \ list = no               # hide this module when asked for\n    secrets file\
    \ = /etc/rsync.users # password file\n    auth = bob   # list of users to see\
    \ my\n    hosts = 1.1.1.1, 2.2.2  # list of hosts to allow\n```\n\nAs you can\
    \ see rsync is configurable, and generally secure, the exception being the actual\
    \ transfers are not encrypted in any way. If you need free suggest using SSH to\
    \ tunnel a connection, or some VPN solution like WAN. Also make sure you are running\
    \ rsync 2.3.x or have potential compromise found in 2.2.x. Rsync is available\
    \ at: http://rsync.org/. Rsync runs on port 873, tcp.\n\n```\nipfwadm -I a accept\
    \ -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 873\nipfwadm -I a accept -P tcp -S some.trusted.host\
    \ -D 0.0.0.0/0 873\nipfwadm -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 873\n```\n\
    \nor\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 873\nipchains\
    \ -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 873\nipchains -A\
    \ input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 873\n```\n\nlpd is the UNIX facility\
    \ for printing (Line Printer Daemon). It allows you to submit printjobs, run them\
    \ through filters, manage the print queues, and so on. lpd can accept print jobs\
    \ locally, or over the network, and access various parts of the system (logging\
    \ daemons, etc), making it a potential security hole. lpd has been the source\
    \ of several nasty roots, however it seems to have mostly fixed now, there are\
    \ still many potential denial of service attacks due to its function (something\
    \ like submitting printjobs and running the printer out of paper). Frequently\
    \ lpd is slowly being phased out with the advent of network aware printers, however\
    \ there is still of printing doing lpd access is controlled via /hosts, and /hosts.lpd.\
    \ You should also firewall lpd from the outside world, and if you need to send\
    \ printjobs across public networks, remember anyone can read them, so a VPN solution\
    \ is a good idea. Lpd runs on port 515, tcp. the hosts.lpd file should contain\
    \ a list of hosts (workstation1,yourdomain.com, etc), one per line that are allowed\
    \ to use the Lpd services on the server, which you as well use ipfwadm/ipfwchains\n\
    \n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 515\nipfwadm -A accept\
    \ -P tcp -S some.trusted.host -D 0.0.0.0/0 515\nipfwadm -A deny -P tcp -S 0.0.0.0/0\
    \ -D 0.0.0.0/0 515\n```\n\nor\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8\
    \ -d 0.0.0.0/0 515\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d\
    \ 0.0.0.0/0 515\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 515\n\
    ```\n\n## LPRng\n\nAn alternative to the stock lpd is “LPRng (LPR Next Generation),\
    \ it provides new enhancements and also supports a higher level of security. LPRng\
    \ supports Kerberos and PGP based authentication, as well as a restrictions file,\
    \ /etc/lpd.perms, which allows you to control access based on user, group, authentication,\
    \ IP, and so on, allowing for extremely flexible and secure configurations. LPRng\
    \ has excellent documentation and is available at: http://www.astart.com/lpr/LPRng.html.\n\
    \n## pdq\n\npdq is another LPD replacement, no real emphasis on enhanced security\
    \ but it seems to offer some improvements management and performance wise over\
    \ the stock LPD. You can get pdq from: http://feynman.tam.uiuc.edu/pdq/\n\n##\
    \ X Window System\n\nThe X Window System provides a network transparent method\
    \ for sharing graphical data, or more specifically for exporting the display of\
    \ a program to a remote (the local) host. Using it you can run a 3d rendering.\
    \ This is a very powerful tool, but it is also very dangerous. The X Window System\
    \ has been the source of many vulnerabilities, however it seems to have mostly\
    \ fixed now, there are still many potential denial of service attacks due to its\
    \ function. You should also firewall X from the outside world, and if you need\
    \ to send data across public networks, remember anyone can read them, so a VPN\
    \ solution is a good idea. X runs on port 6000, tcp. The hosts.access file should\
    \ contain a list of hosts (workstation1,yourdomain.com, etc), one per line that\
    \ are allowed to use the Lpd services on the server, which you as well use ipfwadm/ipfwchains\n\
    \n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 6000\nipfwadm -A\
    \ accept -P tcp -S some.trusted.host -D 0.0.0.0/0 6000\nipfwadm -A deny -P tcp\
    \ -S 0.0.0.0/0 -D 0.0.0.0/0 6000\n```\n\nor\nipchains -A input -p tcp -j ACCEPT\
    \ -s 10.0.0.0/8 -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host\
    \ -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0\
    \ 6000\n```\n\n## mkxauth\n\nmkxauth is definitely a step up, it creates .authority\
    \ files, and merge them, which are used to specify hostnames and the related magic\
    \ cookies (basically a token used to gain access). These cookies can be used to\
    \ gain access to a remote X host (you essentially have a copy of the config on\
    \ each end) and are transferred plain text (insecure) or DES encrypted (quite\
    \ secure). Using this method you can be relatively safe and secure. Authority\
    \ files can also be used in conjunction with Kerberos, removing the necessity\
    \ to copy Authority files and keep them in synchronization. Hosts authenticate\
    \ to each other\n"
  mdcn: "\nCVS 允许多个开发者协作进行源代码项目，并以一种相当合理的方式维护大型代码库。CVS 的内部安全机制本身相当简单（有些人甚至认为很薄弱），我对此赞同这一观点。CVS\
    \ 的身份验证通常通过 `pserver` 在网络上实现，用户名以明文发送，而密码经过了简单的哈希处理（没有任何安全性可言）。为了绕过这个问题，你有几个很好的选择。在\
    \ Unix 环境中，可能最简单的方法是使用 `SSH` 在客户端和服务器之间建立隧道连接，“Time Wemaster” (Tim Hemel) 编写了一篇涵盖该内容的优秀文章，我没打算重新整理它，你可以在此处找到：http://cubic.xa4.nl/~cvs/。另一种稍微复杂一点（但从长远来看对于大型安装更好）是将\
    \ CVS 服务器和客户端 Kerberos 化，类型大型网络（特别是大学环境）已经建立了 Kerberos 基础设施。关于对 CVS 进行 Kerberos\
    \ 化，可以在此处找到信息：http://www.cyclic.com/cyclic-pages/security.html。除外，我强烈建议对 CVS 使用防火墙，除非你将其用于某些公共目的（例如跨越互联网的开源项目）。\n\
    \n另一个新出的保护 CVS 的工具是 \"cvsd\"，它是 `pserver chroot` 和/或将 `suid` 指向一个无害用户的封装器，cvsd\
    \ 可以在此处获取：http://chblack.mokey.com/cvsd/，提供 rpm 格式和源码 tar 包。\n\n还有其他你应该注意的明显问题，在处理源代码时，你应该确保没有木马程序或后门被替换。在开源项目中，这相对简单：审查人们提交的代码，特别是如果这是一项公开访问的工作，并确保你有备份。CVS\
    \ 使用端口 2401`tcp`。\n\n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0\
    \ 2401\nipfwadm -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 2401\nipfwadm\
    \ -I a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 2401\n```\n\n或者\n\n```\nipchains\
    \ -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 2401\nipchains -A input\
    \ -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 2401\nipchains -A input -p\
    \ tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 2401\n```\n\nrsync 是一种极其高效的文件镜像方法，无论是是\
    \ CVS 树的源代码文件、网站，甚至是本文，`rsync` 都能保留文件权限、链接、文件时间，此外，它还支持匿名模式（顺便提一下我用它来镜像本文），这让所有相关人的生活变得非常容易。`rsync`\
    \ 程序本身可以作为客户端（通过命令行或脚本）也可以作为服务器（通常运行在 `inetd` 中）。该程序相当安全，作为客户端或服务器都不需要 `root`\
    \ 权限（除非你真的想要，并且可以选择任何被镜像内容的根目录，但这需要 `root` 权限并且可能比其价值更危险）。你也可以映射访问访问系统的用户 ID 和组\
    \ ID（对于预编译的 rsync 包，默认是 `nobody`，这可能是最好的选择）。在非匿名模式下，`rsync` 支持用户名和密码，这些密码使用 128\
    \ 位 MD4 进行加密。“rsync.conf” 页面清楚地将 `rsync` 设置为服务器并使其运行较快。默认配置文件是 `/etc/rsync.conf`，包含一个全局部分和模块部分（每个共享输出目录都是一个模块）。\n\
    \nrsync 示例：\n\n```\nmotd file = /etc/rsync.modt # 指定要显示的文件，法律\n免责声明，等\nmax connections\
    \ = 5      # 最大连接数，防止你被流量淹没\n[pub-ftp]\n    comment = public ftp area # 简单注释\n\
    \    path = /home/ftp/pub     # 目录路径\n    read only = yes          # 设置为只读，非常适合导出\n\
    \    chroot = yes             # chroot 到 /home/ftp/pub\n    uid = nobody     \
    \        # 显式设置 UID\n    gid = nobody             # 显式设置 GID\n[secret]\n    comment\
    \ = my stuff # 我的东西的路径\n    path = /home/user/secret\n    list = no          \
    \     # 在请求时隐藏此模块\n    secrets file = /etc/rsync.users # 密码文件\n    auth = bob\
    \   # 查看我内容的的用户列表\n    hosts = 1.1.1.1, 2.2.2  # 允许的主机列表\n```\n\n如你所见，`rsync`\
    \ 是可配置的且通常是，异常是实际传输没有以任何方式加密。如果你需要免费方案，建议使用 `SSH` 建立隧道连接，或者某些 VPN 解决方案如 WAN。还要确保你运行的是\
    \ `rsync 2.3.x`，或者在 2.2.x 中发现了潜在漏洞。`Rsync` 可以在此处获取：http://rsync.org/。`Rsync` 运行在端口\
    \ 873`tcp`。\n\n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 873\n\
    ipfwadm -I a accept -P tcp -S some.trusted.host -D 0.0.0.0/0 873\nipfwadm -I a\
    \ deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 873\n```\n\n或者\nipchains -A input -p tcp\
    \ -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 873\nipchains -A input -p tcp -j ACCEPT\
    \ -s some.trusted.host -d 0.0.0.0/0 873\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0\
    \ -d 0.0.0.0/0 873\n```\n\nlpd 是 UNIX 的打印设施（打印守护进程）。它允许你提交打印作业、通过过滤器运行、管理打印队列等。`lpd`\
    \ 可以在本地或通过网络接受打印作业，并访问系统的各个部分（守护进程等），这使其成为一个潜在的安全漏洞。`lpd` 曾是许多问题的根源，但现在大多已修复，由于其功能仍然存在潜在的拒绝服务攻击（例如提交打印作业和出纸）。随着网络打印机的出现，`lpd`\
    \ 正在被逐渐淘汰，但 `lpd` 访问仍通过 `/hosts` 控制。你应该从外部对墙l `lpd`，如果你需要跨网络发送打印作业，请记住任何人都可以读取，因此\
    \ VPN 解决方案是一个好主意。`Lpd` 运行在端口 515`tcp`。`hosts` 文件应该包含一个主机列表（workstation1,yourdomain.com\
    \ 等），每行一个允许使用服务器上 Lpd 服务的主机，你同样可以使用 `ipfwadm/ipchains`：\n\n```\nipfwadm -I a accept\
    \ -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 515\nipfwadm -A accept -P tcp -S some.trusted.host\
    \ -D 0.0.0.0/0 515\nipfwadm -A deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 515\n```\n\
    \n或者\nipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 515\nipchains\
    \ -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/0 515\nipchains -A\
    \ input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 515\n\n\n## LPRng\n\n原生 lpd 的替代品是\
    \ “LPRng”（LPR 下一代），它提供了新的增强，并支持更高级别的安全。LPRng 支持基于 Kerberos 和 PGP 的身份验证，以及一个限制文件\
    \ `/etc/lpd.perms`，它允许你根据用户、组、IP 等控制访问，实现了极其灵活且安全的配置。LPRng 拥有完善的文档，可以在此处获取：http://www.astart.com/lpr/LPRng.html。\n\
    \n## pdq\n\npdq 是另一个 LPD 替代品，对增强安全没有真正的强调，但在管理和性能方面比原生 LPD 有一些改进。你可以从此处获取 pdq：http://feynman.tam.uiuc.edu/pdq/\n\
    \n## X Window System\n\nX Window System 提供了一种共享数据的网络透明方法，具体说是将程序的导出到远程（本地）主机。使用它可以运行\
    \ 3D 渲染。这是一个强大的工具，但也非常危险。X Window System 是许多漏洞的根源，但现在大多已修复，由于其功能仍然存在许多潜在的拒绝服务攻击。你应该从外部对\
    \ X 使用防火墙，如果你需要跨网络发送数据，请记住任何人都可以读取，因此 VPN 解决方案是一个好主意。X 运行在端口 6000`tcp`。`hosts.access`\
    \ 文件应该包含一个主机列表（workstation1,yourdomain.com 等），每行一个允许使用服务器上 X 服务的主机，你同样可以使用 `ipfwadm/ipchains`：\n\
    \n```\nipfwadm -I a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 6000\nipfwadm -A\
    \ accept -P tcp -S some.trusted.host -D 0.0.0.0/0 6000\nipfwadm -A deny -P tcp\
    \ -S 0.0.0.0/0 -D 0.0.0.0/0 6000\n```\n\n或者\nipchains -A input -p tcp -j ACCEPT\
    \ -s 10.0.0.0/8 -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j ACCEPT -s some.trusted.host\
    \ -d 0.0.0.0/0 6000\nipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0\
    \ 6000\n```\n\n## CVS\n\nCVS 允许多个开发者协作进行源代码项目，并以一种相当合理的方式维护大型代码库。CVS 的内部安全机制本身相当简单（有些人甚至认为很薄弱），我对此赞同这一观点。CVS\
    \ 的身份验证通常通过 `pserver` 在网络上实现，用户名以明文发送，而密码经过了简单的哈希处理（没有任何安全性可言）。为了绕过这个问题，你有几个很好的选择。在\
