  - '[PAGE 138]


    # Internet connection checklist


    The following is a checklist for people attaching as computer to the Internet
    (PPP, *DSL, Cablemodem, etc). This is by means comprehensive, but it should help.


    Turn off all unneeded daemons and network software – disable telnet, ftp, ntlk,
    auth, pop, imap, etc. unless you plan to use it. If it''s turned off it''s much
    less of a risk.


    Use ipfwadm/ipchains to firewall services if possible, if you firewall by default
    this will also greatly down any scans people execute on your machines. Generally
    speaking services as NFS / Samba, imap and pop will only need to be accessible
    to internal users, blocking external access greatly simplifies matters.


    Use TCP_WRAPPERS to secure the services you leave on, where possible restrict
    access to internal or certain Internet clients for services such as imap, pop
    and ftp. Remember that most distributions ship with nfs configured to TCP_WRAPPERS,
    and SSH can use TCP_WRAPPERS as well. This allows you to easily centralize access
    control to services.


    Update all software (especially network software) to the latest versions, check
    the errata - security pages that apply to your distribution.


    Use a system integrity tool such as L5 of Gog&Magog to establish a list and signatures
    of your current (known good) files. If you are broken into later this will make
    your life easier.


    Run penetration tests from an external site, i.e. run nmap / strobe, nessus and
    similar tools against your machine to ensure it is properly locked up. Remember,
    the bad guys have these tools, so you should use them to.


    Keep software / access lists / etc. up to date. Audit your log files using tools
    like logcheck on a regular basis.


    Use tools like Pikt if possible to monitor and prevent system problems (i.e. users
    with huge mail boxes).


    If you need a truly detailed log install auditd and enable kernel auditing for
    events as the opening of files and running of programs. Make sure you have plenty
    of disk space.'
