- md: '

    phones up in a bad mood. Unless there is a strong need, keep the number of users
    with interactive shells (bash, pine, lynx, whatever) to a bare minimum. Segment
    services up (have a mail server, a www server, and so on) to minimize single point
    of failure. Generally speaking a properly set up server will run and not need
    maintenance (I have one email server at a client location that has been in for
    2 years with about 10 hours of maintenance in total). Any upgrades should be planned
    carefully and executed on a test. Some important points to remember with servers:


    - 1. Restrict physical access to servers.

    - 2. Policy of least privilege, they can break less things way.

    - 3. MAKE BACKUPS!

    - 4. Regularly check the servers for changes (ports, software, etc), automated
    tools are great for this.

    - 5. Software changes should be carefully planned/tested as they can have adverse
    effects (like kernel 2.2.x no longer uses ipfwadm, wouldn''t that be embarrassing
    if you forgot to install ipchains)


    Minimization of privileges means giving users (and administrators for that matter)
    the minimum amount of access required to their job. Giving a user "root" access
    to their workstation would sense if all users were Linux savvy, trustworthy, but
    they generally aren''t (on both counts). And even if they were it would be a bad
    idea as chances are they would install some software that is broken/insecure or
    other. If all a user access needs to be shutdown/reboot the workstation then is
    the amount of access they should be granted. You certainly wouldn''t leave accounting
    files on a server with world readable permissions so that the accountants can
    view them, this concept extends across the network as a whole. Limiting access
    will also limit damage in the event of an account penetration (have you read the
    post-it people put on their monitors?).


    ## Physical Boot security


    ### Physical Access


    This area is covered in depth in the "Practical Unix and Internet Security" book,
    but I''ll give a brief overview of the basics. Turns your main accounting server
    off, turns it back on, boots from it specially made floppy disk and transfers
    payroll.db to a foreign ftp site. Unless your accounting server is locked up is
    to prevent a malicious user (or the cleaning staff of your building, the delivery
    guy, etc.) from doing just that! I have heard horror stories of cleaning staff
    unplugging servers so that they could plug their cleaning equipment in. I have
    seen people clicking the little switch on power bar and reboot their servers (not
    that I have ever done that). It just makes sense to lock your servers in a secure
    room (or even a closed). It is also a very good idea to put the servers on a raised
    surface to prevent damage in the event of flooding (be it a hole in the roof or
    a super slurpee).


    ## The Computer BIOS


    ### LILO


    ```

    delay=x

    controls how long (in tenths of seconds) LILO waits for user input before booting
    to the default selection. One of the requirements of C2 security is that this
    interval be set to 0 (obviously a dual boot means most out of the water). It is
    a good idea to set this to 0 unless the system dual boots something else.

    ```


    forces the user to enter something. LILO will not boot the system automatically.
    This could be useful on servers as a way of disabling reboots without a human
    attendant, but typically if the hacker has the ability to reboot the system they
    could rewrite the MBR with new boot options. If you add a timeout option the system
    will continue booting after the timeout is reached.


    restricted requires a password to be used if boot options (such as "linux single")
    are passed to the boot loader. Make sure you use this one on each image (otherwise
    the server will need a password to boot, which is fine if you''re never planning
    to reboot it).


    password=XXXXX requires to input a password, used in conjunction with restricted,
    also make sure lilo.conf is no longer readable, or any user will be able to read
    the password.


    Here is an example of lilo-conf from one of my servers (the password has been
    of course changed).


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    default=linux

    image=/boot/vmlinuz-2.2.5

    label=linux

    root=/dev/hda1

    read-only

    restricted

    password=some_password

    ```


    This boots system using the /boot/vmlinuz-2.2.5 kernel, stored on the MBR of the
    first IDE hard drive of the system, the prompt keyword normally stop rebooting,
    however it is set in the system, it can boot "linux" no problem, but if you want
    to go into "linux single" you have 10 seconds to type it, at which point you would
    be prompted for the password ("some_password"). Combine with BIOS set to only
    boot protected and you have a pretty secure system.


    ## The Linux kernel


    Linux (GNU/Linux according to Stallman if you''re referring to a complex distribution)
    is just the core of the operating system. The kernel handles access to the hard
    drive, security mechanisms, networking and pretty much everything. In addition
    we have problems like the Pentium bug and inherent problems with the TCP/IP protocol,
    Kernels are labeled as X.Y.Z, Z are minor revision, Y define if the kernel is
    a test (odd number) or production (even number), and X define the major revision
    (we had 0, 1 and 2 so far). I would highly recommend running kernel 2.2.x, as
    of May 1999 it is 2.2.9. The 2.2.x series of kernel has major improvements over
    the 2.0.x series. Using 2.2.x kernels also allows you to access features such
    as ipchains (instead of ipfwadm) and other advanced features.


    ## Upgrading and Compiling the Kernel


    Upgrading the kernel consists of getting a new kernel and modules, editing /etc/lilo.conf,
    rerunning lilo to write a new MBR. The kernel will typically be placed in /boot,
    and the modules in /lib/modules/kernel.version. Getting a new kernel and modules
    can be achieved two ways: by downloading the appropriate kernel and installing
    it, or by downloading the source code from http://ftp.kernel.org/ (please use
    a mirror site), and compiling it. Compiling the kernel is straightforward:


    ```

    cd /usr/src

    ```


    there should be symlink called "linux" pointing to the directory containing the
    kernel, remove it if there no problem. You might want to ''mv'' the linux directory
    to /src/linux-kernel.version and create a link pointing /src/linux at it. Unpack
    the source code using tar and zip as appropriate so that you now have /src/linux
    with about 50 megabytes of code in it. The next step is to create the kernel configuration
    (/src/linux.config), this can be achieved using "make config", "make menuconfig"
    or "make nconfig", my preferred method is "make config". This is arguably the
    hardest step, as there are hundreds of options which can be categorized into two
    main areas: hardware support, and service support. For hardware support make a
    list of hardware that the kernel will be running on (e.g. Adaptec 2940 SCSI Controller,
    NE2000 ethernet card, etc.) and turn on the appropriate options. As for service
    support you need to figure out which filesystems (fat, ext2, ...) plan to use,
    the same for networking (firewalling, etc.).


    Once you have configured the kernel to compile it, the following commands make
    dependencies ensuring that libraries and so get built in the right order, then
    cleans out any information from previous builds, builds a kernel, the modules
    and installs the modules.


    - make dep (makes dependencies)

    - make clean (cleans previous builds)

    - make bImage (kernel is too big, 2.2.x kernels are pretty big)

    - make modules (creates all the modules you specified)

    - make modules_install (installs the modules to /lib/modules/kernel.version/)


    you then need to copy /usr/src/linux/arch/i386/boot/bzImage(zImage) to /boot/vmlinuz-kernel.version.
    Then edit /etc/lilo.conf, adding a new entry for the new kernel and setting it
    as the default (using the default-x command, otherwise it will boot the first
    kernel listed), if it fails you reboot and go back to the previous working kernel.
    Run lilo, and reboot.


    ## Kernel Versions


    Currently we are in a stable kernel release, 2.2.x. I would highly recommend running
    the latest stable kernel (2.2.9 as of May 1999) as there are several nasty security
    problems (network attacks and denial of service attacks) that affect all kernels
    up to 2.0.35, 2.0.36 is patched, and the later 2.1.x test kernels to 2.2.3. Upgrading
    from the 2.0.x series of stable kernels to the 2.2.x series is relatively painless
    if you are careful and follow instructions (there are some minor issues but for
    most users it will go smoothly). Several software packages must be updated, libraries,
    ppp, modutils and others (they are covered in the kernel docs / rpm dependencies
    / etc.). Additionally keep the old working kernel, add an entry in lilo.conf for
    it as "linuxold" or something similar and you will be able to easily recover in
    the event 2.2.x doesn''t work as expected. Don''t expect the 2.2.x to be bug free,
    2.2.9 will be found to contain flaws and will be obsolete, like every piece of
    software in the world.

