    # Version history


    0.0.1

    Initial draft, structure decided, basic information from older writings inserted.

    04/01/1999


    0.0.2

    Major spell checking, formatting changes. The book covers most major topics generally
    and with RedHat specific instructions. Added ipechains examples where ipfwadm
    examples are given. 04/03/1999


    0.0.3

    Started Appendix B (sites/etc.) and the glossary. Polished up some sections, added
    some new ones. Table of contents created. 04/07/1999


    0.0.4

    General cleanup, added sections on Encryption, IPSec and the line. 04/11/1999


    0.0.5

    Intrusion scanning tools and detection, packet sniffing, added some new sections.
    Edited some older section in need of cleanup. Got rid unnecessary graphics which
    removed before 200k (currently half the bulk). 04/12/1999


    0.0.6

    Added audits and baselines, inn., CVS, rsync, added some new tools in various
    sections (ssh, 04/16/1999


    0.0.7

    Added some new sections (Network Based Authentication, X Window System, PAM, etc.),
    finished some other sections (PPP, Linuxof, etc) and added some more commercial
    backup programs. Added whole whack of Linux vendors. Tools like YaST, super, Linuxof
    also added. 04/19/1999


    0.0.8

    Added some more sections (dpkg, tarballs/tgz, gz2, ftp, etc.), added some more
    tools. Actually installed Debian 2.1 and spent a few days playing with it. Now
    to experience Slackware for 0.0.9. Some minor reorganization (SAMBA) is it''s
    subject now as well as Novell connectivity. 04/22/1999


    0.0.9

    Major reorganization, finished up some. Major grammar and spell checking. Put
    in consistent farewell examples. Added page numbers (wheee). Skipped the release
    to get 0.1.0 out. New license, polishing, etc. New sections on dealing with attacks,
    and types of attacks, etc. Officially released the world. 04/27/1999


    0.0.95

    Removed the Security Consultants sections, possible conflict of interest and no
    method of vetting. Added a lot of new tools. Removed the word “RedHat” many times
    and made the guide somewhat more. 05/08/1999


    0.0.98

    Added many more tools, started adding some tools in areas other than the backup
    section. More spell and grammar checking. Added some new sections (password storage,
    denial of service attacks, etc.) and did some tidying up of the structure. Major
    updates to squid and the admin tools. Rewrote the administrative tools section.
    15/5/1999


    0.1.0

    Fixed the URL section at the end, tidied up sections. Added the “Internet connection”
    check. Added over 60+ new programs and apps. Added secure file deletion, software
    management tools, several new scanning and probe detection tools. New whitepaper
    section listing good security documents, and a URL listing by section at the end.
    Added several new appendices listing Linux sites, security sites, whitepapers
    and more. 29/5/1999

    '
