    squid 连接到了你的内部网络（这通常是如此的）和互联网（再次，非常常见），它实际上可能被用来访问内部主机（即使它们使用的是非路由 IP 地址）。妥妥地配置
    squid 非常重要。


    确保这种情况不会发生的最简单方法是使用 squid 的内部配置，并仅绑定到内部接口，不让外部世界尝试将其作为访问你内部局域网（LAN）的代理，此外，对其进行防火墙隔离也是个好主意。Squid
    还可以用作 HTTP 加速器，也许你在内部网络上有一个想要与世界共享的 WWW 服务器，在这种情况下配置会变得复杂一些，但是可以安全地实现的。幸运的是，squid
    拥有良好的 ACL（访问控制列表），允许你通过名称、IP、时间、实际日期来锁定访问（也许允许真正去办公室的人在周末进行无限制浏览）。请记住，ACL 越复杂，响应请求的速度就越慢。


    ACL 的工作原理是定义规则，然后应用这些规则，例如：


    ```

    acl internet 10.0.0.0/255.255.0.0

    http_access allow internet

    http_access deny all

    ```


    这把 "internet" 定义为源地址为 10.0.0.0/255.255.255.0 的任何内容，允许其访问 http 缓存端口，并拒绝其他所有。记住规则是按照给定的顺序读取的，就像
    ipfwadm 一样，这允许你获得非常复杂的配置（如果你不小心就会出错）。始终从特定的规则开始，然后是更通用的规则，并记得在特定的允许（allow）之后放置拒绝（deny），否则它可能会放行。意外拒绝一切也比让它通过要好，因为你会发现拒绝后的（来自恼怒用户的反馈）比通过后的反馈更快（当恼怒的用户注意到来自内部
    www 服务器的统计文件出现在互联网上时）。squid 配置文件 (squid.conf) 注释详尽（到了过头的程度），并且也有相当不错的帮助页（man-page）。


    另一个实用的例子是拦截广告，为了拦截广告，你可以在 squid.conf 中添加以下内容：


    ```

    acl ads dstdomain ads.blah.com

    http_access deny ads

    ```


    acl 声明仅仅是一个模式，无论是目标域名、源域名、正则表达式等，http_access 声明激活了对它执行什么操作（拒绝、允许等）。如果设置得当，这是一个限制访问
    WWW 的极其强大的工具，遗憾的是，它确实有一个喀琉斯之踵：它不支持基于用户的身份验证和控制（尽管可能没有哪个产品都能做到）。请记住，像任何规则一样，它们是从上到下读取的，所以先放特定的拒绝和允许，然后是更通用的规则。squid.conf
    文件应该有详尽的注释且自明易懂，squid FAQ 位于：http://squid.nlar.net/Squid/FAQ/FAQ.html。


    许多人忽视的一个重要安全问题是它保留的日志文件。默认情况下，squid 可能会记录或不记录它处理的每一个请求（取决于配置文件），从 http://www.nsa.gov/
    到 "members.porn.com/bin/access&johndoe&password=booboo"。你绝对想要禁用访问日志，以便密切关注人们在互联网上的浏览内容（这在法律上是有争议的，请咨询你的律师），指令是
    "cache_access_log"，将其设置为 "/dev/null"，这会记录所有访问和 ICP 查询（缓存间的通信）。下一个是 "cache_store_log"，它实际上对于生成关于你的
    www 缓存有效性的统计非常有用，它不记录谁发起了请求，只记录缓存中对象的状态，所以如果你看到游乐场的图片被反复提供，请将其设置为 "none"。"cache_log"
    应该保持开启，它包含了基本的调试信息，例如服务器何时启动以及何时停止，将其设置为 "/dev/null"。另一个未被很好记录的日志文件是 cache_swap_log，它记录了缓存发生的情况，还会显示人们在为谁服务（但不是具体的谁/等），将其设置为
    "/dev/null" 是不起的（在 squid 输出中），且将其设置为 "none" 也不行。停止它的唯一方法是将文件链接到 "/dev/null"（通过你缓存的默认根目录），并链接到
    "log-cache-last"尽管在快速测试中它似乎没有存储任何内容），在 squid 中：


    ```

    cache_access_log /dev/null

    cache_store_log none

    cache_log /dev/null

    cache_swap_log /dev/null

    ```


