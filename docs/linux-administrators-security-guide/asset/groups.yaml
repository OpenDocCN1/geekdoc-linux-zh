    # Basic network service security


    # ## What is running and who is it talking to?


    You can''t start securing services until you know what is running. For this task
    netstat and nps, will tell you what is currently running (htop, inet, etc.), netstat
    will tell you the status of ports (at this point we''re interested in ports that
    are open and listening, which is waiting for connections), and finally we can
    take a look at the various config files that control services.


    # PS Output


