    # 端口 22


    # 运行在端口 22，标准端口

    ListenAddress 0.0.0.0

    # 监听所有接口，你可能只想在内部

    # 绑定防火墙，等等

    HostKey /etc/ssh/ssh_host_key

    # 主机密钥的位置

    RandomSeed /etc/ssh/ssh_random_seed

    # 随机种子的位置

    ServerBits 768

    # 服务器密钥的长度

    LoginGraceTime 300

    # 用户输入凭据的时间限制

    KeyGenerationInterval 3600

    # 服务器密钥重新生成的频率

    PermitRootLogin no

    # 允许 root 登录吗？绝对不允许

    IgnoreRosts yes

    # 忽略用户目录下的 .hosts 文件吗？绝对可以

    StrictModes yes

    # 确保用户不执行蠢事

    QuietMode no

    # 如果不记录任何内容。那糟糕了。我们需要记录登录等信息

    X11Forwarding no

    # 服务器上不应该开启 X11 转发

    LogLevel no

    # 也许我们不想记录太多日志

    PrintModel yes

    # 打印每日信息吗？总是不错的

    Keepalive yes

    # 确保会话会被正常断

    SyslogFacility DAEMON

    # 由谁记录日志？

    RhostsAuthentication no

    # 允许使用主机进行身份验证吗？默认不允许

    # 但无论如何，写出来比较好

    RsaAuthentication no

    # 使用主机或 /etc/hosts 进行身份验证是否足够

    # 我认为不够。默认就是如此，所以我们可以关闭它

    RSAAuthentication yes

    # 允许纯 RSA 认证吗？这是一种非常安全的方式

    PasswordAuthentication yes

    # 允许用户使用普通登录名/密码吗？为什么不呢

    PermitEmptyPasswords no

    # 允许空密码账户登录吗？绝对不允许


    其他的 sshd_config 指令包括：

    - AllowGroups - 显式允许组（/etc/group）使用 ssh 登录

    - DenyGroups - 显式禁止组（/etc/groups）使用 登录

    - AllowUsers - 显式允许用户使用 ssh 登录

    - DenyUsers - 显式禁止用户登录

    - AllowHosts - 允许某些主机，其余的将被拒绝

    - DenyHosts - 阻塞某些主机，其余的将被允许

    - IdleTimeout time - 单位为分钟/小时/天/等，通过进程中的 SIGHUP 强制注销


    # Fresh Free FiSSH


    我们大多数人仍然必须坐在 Windows 工作站前，而 Windows 的 ssh 客户端很难找。Fresh Free FiSSH 是一个适用于 Windows
    95/NT 4.0 的免费 ssh 客户端，尽管尚未完成。如果你像我一样有很多 Windows 工作站的话，我建议你关注一下它，URL 为：http://www.massconfusion.com/ssh/


    # Tera Term


    Tera Term 是一个适用于 Windows 的免费 Telnet 客户端，并有一个附加 DLL 来启用 ssh 支持。可以从以下地址获取 Tera Term：http://hp.vector.co.jp/authors/VA002416/teraterm.html。用于
    SSH 支持的附加 可从这里获取：http://www.zip.com.au/~rca/tss.html。


    # putty


    putty 是一个 Windows SSH 客户端，非常好，完全免费，而且很小（目前为 184k）。你可以从这里下载：ftp://rak.isternet.sk/mnt/rhcd/misc/putty/


    # mindterm


    # LSH


    LSH 是 SSH 协议的免费实现（包括客户端和服务器），LSH 采用 GNU 许可证，并且看起来像是 SSH（现在已不再免费）的替代方案（从商业角度来说）。你可以这里下载：http://www.net.lut.ac.uk/psst/，请注意它正在开发中。


    # RSH, REXEC, RCP


    R 服务如 rsh, rcp, rexec 等非常不安全。没有其他方式可以描述这一点。它们的安全性基础基于连接机器的主机名/IP 地址，这可以轻易被伪造，或者通过
    DNS 投毒等技术被破坏。默认情况下，它们并没有被全部禁用，请立即禁用它们。编辑 /etc/inetd.conf 查找 rexec rsh 等并将其它们注释掉，然后执行
    `killall -1 inetd` 重启 inetd。


    如果你绝对必须使用 tcp_wrappers 限制访问来运行这些服务，虽然作用有限，但会有帮助。此外，确保你的防火墙拦截了它们，因为 tcp_wrappers
    会允许攻击者看到它们正在运行，这可能导致伪造攻击，如果处理得当，tcp_wrappers 无法防御这种攻击。R 服务的访问通过 hosts 文件控制，通常每个用户都有自己的
    hosts 文件，遗憾的是这容易受到数据包伪造的影响。r 服务的问题还在于，一旦发生可以修改文件的微小安全漏洞，编辑用户的（如 root 的）root 文件将极易地破解整个系统。


    如果你需要易用且类似于 rsh/etc 的远程管理工具，我推荐 nsh (Network Shell) 或 SSH，它们都支持加密，安全性高得多。或者，使用
    VPN 软件可以减少风险，因为它可以拒绝伪造者攻击你系统的机会（IPSec 是发送者的身份验证，这在某些情况下比加密数据更重要）。


    # Webmin


    Webmin 是 Linux 更好的远程管理工具之一，主要用 Perl 编写，易用且易于设置。你可以分配不同的“用户”（用户名和密码由 webmin 维护），例如你可以分配用户来关闭服务器，或者创建/删除用户。此外，它适用于大多数
    Linux 平台以及其他 UNIX 平台。Webmin 的主要问题是某些用法方面的文档较差，以及用户名/密码对是明文在网络传输的（通过允许访问某些主机可以稍微降低风险）。最重要的是，对于那些必须管理系统的非技术人员，Webmin
    提供了可访问性。Webmin 位于：http://www.webmin.com/webmin/，目前默认运行在端口 10000，应该被防火墙拦截：


    ```

    ipfwadm -I -a accept -P tcp -s 10.0.0.0/8 -D 0.0.0.0/21

    ipfwadm -I -a accept -P tcp -s some.trusted.host -D 0.0.0.0/21

    ipfwadm -I -a deny -P tcp -s 0.0.0.0/0 -D 0.0.0.0/21

    ```


    或者在 ipchains 中：


    ```

    ipchains -A input -p tcp -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/21

    ipchains -A input -p tcp -j ACCEPT -s some.trusted.host -d 0.0.0.0/21

    ipchains -A input -p tcp -j DENY -s 0.0.0.0/0 -d 0.0.0.0/21

    ```


    # FTP


    FTPD 曾经是互联网上最常用的协议，直到几年前它被 HTTP 取代（是的，互联网曾是那样的）。


