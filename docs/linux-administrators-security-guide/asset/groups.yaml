    # Dealing with attacks


    Dealing with an attack depends on several factors, the attack is in progress?
    Did you discover your company plan being sent out by the mail server to a hotmail
    address? Did you get called in to find a cluster of dead servers? What are your
    priorities? Restoring service? Ensuring confidential data is safe? Protecting
    the attacker(s)? Several things to keep in mind:


    +   * Most admins will not respond positively to news their site is being used
    as a base of attack, it''s a waste of time usually.

    * Most sites usually don''t want report attacks (successful or not) due to the
    potential embarrassment and related public relations problems.

    * Most quick attacks, denial of service attacks and the like are spoofed. Tracking
    down the real attacker is very difficult and resource intensive.

    * Even if all goes well there is a chance law enforcement will seize your equipment
    as evidence, and hold it, not something to be taken lightly.

    * Do you know how the attacker got in (i.e. NFR recorded it), if so you might
    just want to plug the holes and go on.


    Also before you deal with an attack, you should consult your company policy, if
    you don''t have one consult your manager, the legal department, etc. It''s also
    a good idea to have a game plan to deal with attacks (i.e. the mail server is
    first priority, checking fileservers is number two, who to notify, etc) will prevent
    a lot of problems when it happens (is prepared). The book “Practical Unix and
    Internet Security” covers this topic in great detail so I''m not going to rehash
    it, go buy the book.


    An excellent whitepaper on this is also available, see Appendix D, “How to Handle
    and Identify Network Probes”.'
  - '[PAGE 131]


    # Denial of service attacks


    One mess I didn''t want to venture into but must it seems. Denial of service (DOS)
    attacks are by far the most annoying and troublesome attacks, since in general
    they cannot be blocked, no matter how fast you flush your SYN connection tables,
    or limit CPU time for users, enough attacks fast enough will cause grief. Generally
    speaking there are two types of DOS attacks, local and remote, local are the easiest
    to deal with once you figure out which user account is responsible you may terminate
    it/etc. Remote DOS attacks are typically spoofed from a wide variety of addresses,
    making firewalling ineffective (or they simply spoof as from a location you actually
    need to talk to, such as a customer’s site).'
  - '[PAGE 132]


    # Examples of attacks


    Without going into much detail and helping the black hats I want to give a few
    examples of attacks, to show how innocuous things can be problematic and other
    complicate your life.


    Ping flooding (a.k.a. smurfing)


    Simply flooding a network with data is an old fashioned but effective tactic,
    made worse by the fact most networks have faulty firewall configurations. By pinging
    the network address of a remote network (a cable modem ISP) you can receive several
    hundred ping replies for each ping packet you send. Now if you spoof the IP address
    and label the outgoing packets from a network you do not like you can have someone
    else''s improperly setup network do the dirty work and flood the victim.


    # DNS cache poisoning


    Since so many services rely on DNS to work properly it provides a wonderful part
    of the network to attack. Subverting the information in DNS servers is easier
    then it should be, and you can insert false data if successful. For example if
    I convinced your name server that updates.redhat.com actually pointed at updates.badpeople.com,
    I could probably trick you into downloading and installing my software. This course
    is negated by the fact RedHat PGP signs their packages, but do you check those
    signatures? As well, if you use an automated tool such as autorpm it will happen
    without user intervention, the compromised packages are downloaded and installed,
    all I have to do is watch my ftp log and then exploit the sites that download
    packages. If I managed to convince your mail server that othercompany.com was
    actually one of my servers I could not receive email you send to othercompany.com,
    I could read the email, and perhaps send it along with minor modifications (like
    add an extra 0 to the cost of your bid).'
