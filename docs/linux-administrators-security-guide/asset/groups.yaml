    通过加密方式通过中央 Kerberos 密钥服务器（或多个），这种方法最适用于大型安装。`mkxauth` 拥有一个非常优秀的 man page（`man
    mkxauth`），更通用的细节可以在 Xsecurity man 页面中找到（不确定这个页面名称有多常见）`man Xsecurity`。


    # SSH


    SSH 可用于在主机之间（更具体地说是在两个 X 服务器之间）创建隧道，从而加密通道、提供身份验证并通常使一切更安全。以下网页详细解释了这一点：

    http://csociety.ecn.purdue.edu/~sigos/projects/ssh/forwarding.


    # Samba


    SAMBA 是自大发明以来最好的工具之一，如果你想在 Windows 和 *NIX* 之间共享文件和打印机。它在某种程度上被误解，并且受到与各种（有时是损坏的）Windows
    客户端交互的影响很大。SAMBA 有一些很棒的临时方案（kludges）试图让它变得正常，但可能会导致看起来像故障的行为。SAMBA 仅通过 SMB（服务器消息块）访问文件系统，这是用于共享文件和打印机的协议。它会验证用户名和密码（如果需要），然后根据设置的文件权限等访问文件。我将只介绍
    Samba 2.x，Samba 1.x 已经非常老且过时。


    Samba 2.x 通过 `smb.conf` 控制，通常位于 `/etc`（`man smb.conf`）。在 `/etc/smb.conf` 中你有四个配置区域：`[globals]`、`[printers]`、`[homes]`
    以及每个 `[sharename]` 自己的配置（无论是打印机还是驱动器）。有很多开关，samba conf 页面对此详尽说明。重要的（安全）选项包括：


    - security = xxxx 其中 xxxx 是服务器或域，security 按共享单独设置，带有每个人都可以获取的密码，或者意味着 samba 服务器本身通过
    `/etc/password` 或 `smpasswd` 身份验证用户。如果你将其设置为 `domain`，samba 将通过 NT 控制器验证用户，完美地融入到你现有的
    NT 网络中（如果你有的话）。


    - guest account = xxxx 其中 xxxx 是你希望客用户映射的账户用户名。如果定义了共享，则对该共享的所有请求将作为此用户处理。


    - hosts allow = xxxx 其中 xxxx 是用空格分隔的允许连接到服务器的主机/IP 块列表。


    - hosts deny = xxxx 其中 xxxx 是用空格分隔的不允许允许连接到服务器的主机/IP 块列表。


    - interfaces = xxxx 其中 xxxx 是用空格分隔的 samba 将绑定的 IP 块列表。


    我强烈建议安装并使用 SWAT（samba Web 管理工具），因为它可以减少你可能犯的错误等。Samba 和 SWAT 可在此获取：http://www.samba.org/
    ，并随几乎每个发行版一起发布。


    # SWAT


    SWAT 是设置 `samba.conf` 的非常重要的工具。主要问题是它要求你使用 root 账户和密码“登录”，并且作为 `inet.conf` 之外的独立进程，没有简单的方法对其加密，据我所知，也没有办法授予其他人
    SWAT 的管理权限。尽管如此，它是编辑 `samba.conf` 时减少错误的良好工具。你也可以使用 `-a` 选项运行 SWAT，这意味着不需要密码，并使用
    `TCP_WRAPPERS` 限制对某些工作站的访问（尽管你会面临 IP 伪造的风险），本质上 SWAT 并不是设计为一种安全的管理工具，但它是很有用的。SWAT
    通常随 samba 一起提供


    并在此处获取：http://www.samba.org/，SWAT 的在线演示位于：

    http://anu.samba.org/cgi-bin/swat。


    # 文件共享方法


    我认为我也应该简要概述一下 Linux 存在的各种文件共享方法，并在方面向你展示它们的优缺点。


    # SAMBA


    Samba 是与 Windows 客户端机器共享文件（从性能、安全性等方面考虑）的最佳选择，我并不真正推荐将此作为机器间共享文件的方法。


    # NFS


    NFS 不太安全，但易于使用，如果所在环境不是敌意的，可以使其变得相对安全。如果考虑安全性，我不建议将此作为共享文件/等的方法（这可以说意味着你不应该将它用于无盘工作站，但命如此）。


    # Coda


    一种先进的网络文件系统，实现起来并不很有趣。http://www.coda.cs.cmu.edu/


    # Drall


    一种基于 http 的系统，用于在机器之间安全地共享文件。

    http://www.edlund.org/projects/drall/index.html.


    # AFS


    一种用于大型安装的高端商业文件共享应用程序。FAQ 可位于：http://www.angelfire.com/hi/plutonic/afs-faq.html。


    # 基于网络的身份验证


    # NIS / NIS+


    NIS 和 NIS+（正式称为“黄页”）代表网络信息服务。本质上，NIS 和 NIS+ 提供了一种在许多机器上分发密码文件、组文件和其他配置文件的方法，提供了账户和密码同步（以及其他服务）。NIS+
    本质上是带有若干增强（主要与安全相关）的 NIS，它们非常相似。使用 NIS，你需要设置一个 NIS 服务器，它将包含记录并允许更改它们（添加用户等），此服务器可以将记录分发到从属
    NIS 机器，这些机器包含记录的只读副本（如果发生糟糕的情况，它们可以被提升为主节点并进行读写）。NIS 网络的客户端本质上请求部分信息并将其直接复制到配置文件中（如
    `/etc/passwd`），使其在本地可访问。使用 NIS 可以为数千条路由和服务器提供相同的用户名、信息、密码等，显著减少了管理噩梦。然而，问题在于，共享这些信息会使攻击者能够访问，这是
    NIS+ 试图解决的问题，但 NIS+ 的设置是另一个噩梦。另一种替代策略是使用某些 VPN 支持（FreeSWAN，这难道不解决一些问题吗？）并在数据进入网络之前对其进行加密。有一个
    NIS/ NIS+ 教程：http://metalab.com/LDP/HOWTO/NIS-HOWTO.html，O''Reilly 有一本关于该主题的好书。NIS+
    运行在 RPC 之上，使用端口 111，tcp 和 udp。这目前应该定义在你的网络边界，但将不会完全阻止 NIS / NIS+


    ```

    ipfwadm -I -a accept -P udp -s 10.0.0.0/24 -d 0.0.0/0

    ipfwadm -I -a accept -P udp -s some.trusted.host -d 0.0.0/0

    ipfwadm -I -a deny -P udp -s 0.0.0/0

    ```


    或


    ```

    ipchains -A INPUT -p udp -j ACCEPT -s 10.0.0.0/24 -d 0.0.0/0

    ipchains -A INPUT -p udp -j ACCEPT -s some.trusted.host -d 0.0.0/0

    ipchains -A INPUT -p udp -j DENY -s 0.0.0/0 -d 0

    ```


    由于 NIS 和 NIS+ 是 RPC 服务，它们以某种随机的方式使用高位端口（即 1024 以上），使得对其进行防火墙拦截非常痛苦。最好的解决方案是将你的
    NIS 服务器放置在内部禁止与互联网完全入出站通信的机器上。


    # SRP


    SRP 是一个相对新的成员，但它比一些旧程序有许多优势。SRP 商业用途免费，且不使用加密来保护数据，将其出口到美国以外并不是太大的问题。SRP 使用单向哈希对双方进行身份验证。缺点是
    SRP 只加密登录（用户名和密码），因此任何传输的数据（如 telnet 会话或 ftp 站点）都是脆弱的。你可以从 SRP 获取 SRP：http://srv.stanford.edu/srp/。SRP
    目前支持 Telnet 和 FTP（我们也是），启用其他协议相对简单。


    Kerberos 是一种现代网络身份验证系统，其基于一旦用户向 Kerberos 服务器身份验证后向其发放票据（类似于 NT 对令牌的使用）。Kerberos
    可在此获取：http://web.mit.edu/kerberos/www/。Kerberos FAQ 可位于：http://www.nrl.navy.mil/CCS/people/kenh/kerberos-faq.html。Kerberos
    适用于大型安装，因为它的扩展更好且比 NIS / NIS+ 更安全。通过一些努力可以实现 telnet、imap 和 pop 等程序的 Kerberos 化，然而，支持
    Kerberos 的 Windows 客户端则较难找到。

    '
