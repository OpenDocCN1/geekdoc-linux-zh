    `chroot`。默认情况下，所有以身份登录的用户都将 `/home/ftp/` 作为其“根目录”。他们无法离开此范围查看 `/home/` 或 `/etc/`
    的内容。这同样适用于用户组和个人，例如，你可以设置所有用户在 ftp 时 `chroot` 到 `/home`，或者在用户隐私的极端情况下（在托管多个域名的
