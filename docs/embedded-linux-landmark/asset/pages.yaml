    The image() function actually takes all the bits and pieces lying around the arch/opt
    directories and puts them all together, with the kernel, into a bootable image.


    ```

    # Some locals

    #

    my($BUILD)=\$CONFIG/.build";

    my($MNT)=\$BUILD/mnt";

    my($TMP)=\$TMP/tmp";

    my($IMG)=\$CONFIG/obj/rootfs";

    my($IMAGEROOT)=\$CONFIG/obj/imageroot";

    my($DISK)=\$CONFIG/obj/image";

    my($CFG)=\$CONFIG/CONFIG";

    my($REPORT) = "\n"

    ```


    ```

    # Setup

    #

    sys("umount \$MNT 2 /dev/null");

    if (sys("cd \$CONFIG && rm -rf \$BUILD")){return};

    if (sys("mkdir -p \$MNT")){return};

    if (sys("mkdir -p \$TMP")){return};

    if (sys("rm -rf \$IMG.gz \$DISK")){return};

    ```


    After creating some local shortcut variables, it sets up so that nothing is left
    over from the last build, and creating the local \$TMP directory for building
    and the \$MNT for the new root filesystem.


    ```

    # Update the build number

    my($APP_BUILD)=\`cat \$CONFIG/BUILD > /dev/null`;

    \$APP_BUILD = \$APP_BUILD + 1;

    if (sys("echo \$APP_BUILD > \$CONFIG/BUILD")) {return};

    ```


    Each build is numbered, so you can easily tell if you have two different versions
    of code.


    ```

    # Create the image file, puts a filesystem on it and mount it

    #

    if (sys("dd if=/dev/zero of=\$IMG bs=512 count=\$INITRDSZ")) {return};

    if (sys("/sbin/mkfs.ext2 -o none -F -vmb -N \$INITRDSINNODES \$IMG")) {return};

    if (sys("mount -t ext2 -o loop \$IMG \$MNT")) {return};

    ```


    This is where it starts to get interesting. A brand new file of all zeros is created
    to store the root filesystem. It''s important to start with a fresh file every
    time, since empty parts of the filesystem will compress better if they''re all
    zeros than if they contain garbage left over from a previous build.'
