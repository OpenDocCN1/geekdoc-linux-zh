  md: 'The workshop doesn''t try to be all things to all people. As I mentioned earlier,
    I put it together primarily as a teaching aid, but I''ve been using it as the
    basis of all of my embedded Linux projects. Let''s look in a bit more detail at
    the requirements for the Embedded Linux Workshop:


    +   - It must run on a very common hardware platform, so anyone can use it.

    - It must be small enough that someone trying to learn about embedded software
    systems can understand it completely, with only a few days'' work.

    - The product of the Embedded Linux Workshop is a single 1.44MB floppy disk that
    can be used to boot a machine into the embedded application. This is almost certainly
    not what your final product will do, but it gives you a reasonable goal, allowing
    you to use hardware that''s easily available. If you were to flash in this project,
    you probably would have to buy extra hardware before starting.

    - It must be very well documented that none of the pieces are mysterious. None
    of the binaries should be scraped from someone''s package, unless source is available.

    - The build environment must not have "hidden steps." That is, every piece of
    software that ends up on the floppy must be built from source instructions that
    are available as part of the toolkit itself.

    - Every piece available under Open Source license.

    - The sample applications should be very simple, so they don''t detract from the
    main point—the code that gets the computer from power-off to running application.


    # Hardware


    +   - **Development platform.** The obvious hardware platform for the Embedded
    Linux Workshop is the ubiquitous PC. A complete development platform capable of
    hosting the Embedded Linux Workshop can be purchased for little more than the
    cost of a good garden hose. You''ll want to make sure this computer has at least
    one free serial port and is networked.

    - **Workbench computer.** Someone is probably giving you the old 486 that you''ll
    need as your workbench computer. They may even be paying to haul it away! It should
    have least 8MB of memory to be useful.

    - **Professional choice.** If you''re developing software for a life, bigger is
    better. Buy a system with a large hard drive, lots of memory, and a large, crisp
    display. The display is especially important, since you''ll probably have a lot
    of windows open at all times. I personally like to do as much as possible on my
    laptop computer. That way, I can work on my projects from anywhere.'
