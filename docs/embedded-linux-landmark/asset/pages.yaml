    # # PeeWeeLinux Pros and Cons


    Let''s take a look at how well PeeWeeLinux stacks up to our list of questions.


    # ## What is the size of image produced?


    The image size produced by PeeWeeLinux isn''t all small. The big problem is the
    use of glibc. It can be difficult to get away from glibc, but for really small
    applications you have to do it. The glibc file that comes with PeeWeeLinux is
    just over 1MB. Using ulibc or even the old lib5 may be a better choice. This complicates
    the development environment somewhat, but it''s worth it in terms of cost.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# What architectures are supported?


    PeeWeeLinux has an impressive array of x86 targets, etc., but as of this writing,
    x86 only. If you''re looking for PowerPC, StrongARM, etc., look elsewhere. For
    x86, PeeWeeLinux supports the following environments:


    +   - Compressed RAM disk on FAT 16 partition

    - Compressed RAM disk on ext2 partition

    - Uncompressed RAM disk on FAT 16 partition

    - Uncompressed RAM disk on ext2 partition

    - Read-only root filesystem with multiple RAM disks

    - Compressed RAM disk on floppy disk without bootloader

    - Compressed RAM disk on FAT 12 floppy disk with syslinux

    - Read-write root on a single partition


    # How easy is the toolkit to use?


    Getting started with PeeWeeLinux is fairly easy. It took less than two hours to
    get my first bootable floppy image running after installing the software.


    # How many optional packages are available?


    # What exceptional packages are available?


    PeeWeeLinux gives you the tools necessary to build a Web-based configuration package,
    namely the tntpd and boa servers. However, nothing is set up for you. There are
    a couple of pieces of specific hardware support that might be interesting: the
    Color QuickCam and the Dallas Semiconductor DS1280 digital temperature sensors.


    PeeWeeLinux comes with four prebuilt Linux x86 kernels and the kernel source in
    case you decide to build your own.


    The authors of PeeWeeLinux have also taken the time to strip Netscape down to
    the minimum code required for a browser. This is helpful because the full browser
    suit with email and reader is quite large. Of course, Netscape requires X windows,
    and PeeWeeLinux has support for that, too.


    # How customizable is the image? How difficult is it to customize?


    To add custom software to your project, you add the files to the Project Custom
    Source Path. Each file and directory within this directory is copied to the destination
    directory during the build process.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 6 Embedded Linux Toolkits


    While this is simple and effective, it does have some drawbacks. This directory
    structure could quickly become polluted with crust if you try different ideas
    while building your device. If you want to use part of your software in another
    project, it may become difficult to extract those pieces from a big jumbled mess.


    If you want to do serious development, hook into the package system of PeeWeLinux
    and save the Project Source Path for quick-and-dirty changes during the development
    process.


    # How much does the toolkit cost? Is it a royalty involved?


    PeeWeLinux is completely free.


    # How well is the toolkit documented? Is printed documentation available?


    Documentation for Open Source projects typically falls into two categories: "much
    weaker than proprietary products" and "much stronger than proprietary projects."
    It seems that some magic threshold must be crossed before the documentation is
    really there. As of your writing, the PeeWeLinux documentation is in the former
    category—there''s not much there. To figure out how the product is working, you
    have to look at the source.


    But don''t let that stop you from using PeeWeLinux if it fits well in the other
    categories—it''s not hard to figure out how to use.


    # How well is the toolkit supported? Paid support? Active list?


    The PeeWeLinux mailing list had 30–40 members as of early 2001. The package seems
    to be updated at least on a monthly basis. The author is available for technical
    support, and does short-duration consulting work.


    # What are the requirements to use the toolkit?


    PeeWeLinux has been tested on all versions of Red Hat Linux from 6.0 through 7.0.
    It is also known to work with Mandrake 7.0.You''ll need 200MB of free space to
    install.


    # Can a new version of the toolkit be installed without losing changes?


    PeeWeLinux expects your projects to be in one of its subdirectories. Because of
    this restriction, upgrading can be a little disconcerting—you''re going to install
    on top of your current projects. They shouldn''t be overwritten, but if they are,
    well, I hope you have backups.


    Really, the best thing to do is remove the projects directory as soon as you install
    PeeWeLinux and create a symbolic link to somewhere else in your filesystem.'
  merge: -1
  pgno: 127
