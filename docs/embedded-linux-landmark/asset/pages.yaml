  md: '# Building the DiskChip Files 77


    Press Ctrl+D here.


    By convention, we don''t recompile any part of the kernel or libc—it just takes
    too long.


    +   cp -P /usr/share/terminfo/l/linux opt/minicom


    Create the terminfo file for the console. This file contains the definitions of
    escape sequences for the console for operations such as clearing the screen and
    drawing lines.


    +   Type the following commands:


    ```

    cat opt/doc/etc/rc/P@0doc

    !/bin/sh

    insmod -f /modules/doc.o

    ```


    Press Ctrl+D here.


    Each script in the /etc/rc directory begins with the letter P is executed in increasing
    sort order before the boot media (flash filesystem) is mounted. This is how we''re
    able to load the DiskChip module before we reference it. We use the -f (force)
    option of insmod because the kernel version encoded in the DiskChip driver may
    not agree with the kernel version we use. This happens because we aren''t recompiling
    the DiskChip driver from scratch, since we don''t have the source.


    +   chmod a+x opt/doc/etc/rc/P@0doc


    Make the script executable.


