    # # 4 Booting Your Embedded Linux Device


    CONCEPTUALLY, BOOTING AN EMBEDDED DEVICE IS VERY SIMPLE:


    +   1. Initialize the hardware.

    2. Ready the root filesystem.

    3. Load the kernel from the boot media.

    4. Jump into the kernel.


    The kernel takes it from here; it configures memory, its drivers take possession
    of the hardware they are interested in, and so on. Once the kernel is satisfied
    that it has taken care of everything, it starts up the userspace init process,
    which runs any other processes that are needed.


    Like many things in life, however, even though booting the device is conceptually
    quite simple, the devil is in the details. This chapter looks at those details—answering
    the question, “How does the Linux kernel move from the boot media to running in
    RAM?”'
