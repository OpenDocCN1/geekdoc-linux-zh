  md: '# Stripping Distributions Versus Building Your Own


    The simplest way to build an embedded Linux application is to start with a copy
    of your favorite commercial Linux distribution that works with your chosen CPU—for
    example, Red Hat, SuSE, or Debian. Install it onto a hard drive, get it up so
    your application starts as part of the initialization process, and call it “done.”
    This can be accomplished in less than a day. If your hardware has the memory and
    storage available, this isn''t a bad way to go. When you lose a lot of control
    over exactly what goes on in the box, the result is less robust and secure than
    a “from scratch” approach, but this might be a tradeoff that you''re willing to
    make for the time saved. This approach can take a few hours to implement, whereas
    the other approaches discussed in this book can take days or weeks.


    If you''re short on storage—but not too short—the next-easiest way to build an
    embedded application is much like the first: Install a Linux distribution in its
    minimal form, and then stripping out pieces until it fits in the space you have.
    Depending on your application''s needs, this will work if you have more than 50MB
    of storage available. This can probably be done in a day or two, depending on
    how well you know your chosen distribution.


    The third option is to start with one of the many Linux distributions available
    on the Internet. It seems as if if every other distribution becomes available
    for starting embedded projects. Because choosing one can be difficult, I''ve compiled
    a list of questions you should think about when looking at the choices. That list
    is available in Chapter 6, “Embedded Linux Toolkits.


    The fourth option is to “roll your own.” In days past, this was the solution for
    most people. With it, you have the greatest control over what your application
    actually does—but it also takes the most time. You must take great care in choosing
    the programs you''re going to use, and in building your binaries properly so that
    they''ll be as small as possible. However, this is probably the best way to get
    the smallest possible Linux system that will run.


