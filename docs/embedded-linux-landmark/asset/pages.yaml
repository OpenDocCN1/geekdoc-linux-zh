  md: '# Chapter 1 Software Considerations


    # Networking, Filesystems, and Executable Formats


    Some embedded Linux applications have use for the networking code. Be sure to
    configure the kernel so that the networking code is skipped if you don''t need
    it; it takes up a lot of space. Also, make sure that your kernel supports only
    the one or two filesystem type you actually need. Finally, you probably need only
    one executable format, ELF (Executable and Linking Format), for your embedded
    application, so be sure to turn off all the rest. For details on the ELF file
    format, consult the following documents:


    +   - http://biblio.org/pub/Linux/GCC/ELF.tar.gz

    - http://biblio.org/pub/Linux/GCC/elf-ps.gz


    In general, it''s a good idea to look through the documentation for all the choices
    in the kernel build menu. If you''re using menuconfig to configure the kernel,
    you can press the question mark (?) to get any information on the choice you have
    highlighted.


    While you''re developing your embedded device, it''s handy to enable loadable
    module support in the kernel. That if you need support for a feature that you
    hadn''t anticipated, you can go back, recompile the modules and copy them onto
    your device. Without loadable module support, you have to recompile the whole
    kernel, which can be a bit of a pain. When you''re developing the device, you
    can save some of RAM and ROM by recompiling the kernel with outloadable module
    support and your drivers compiled directly into the kernel. However, you should
    figure out exactly how much of this saving is and whether it''s worth it—having
    loadable module support may be useful for upgrading drivers in the field.


    # Execute-in-Place (XIP)


    One way may be save a lot of RAM requirements is to run your executable programs
    directly from the long-term storage (ROM or flash) where they reside. This is
    called execute-in-place (or XIP for short).


    On a desktop system, your applications live on the hard disk and may be read into
    RAM for execution. However, most embedded applications don''t have a hard drive
    for long-term storage; instead, they have some of memory device, as ROM or flash.
    Unlike a hard drive, these memory devices may be directly addressable by the CPU,
    RAM. You can use the direct addressability of these memory devices to reduce your
    RAM requirements. Instead of copying the executable code from the memory device
    into RAM, an XIP system sets up the kernel structures that normally point into
    the RAM copy directly at the long-term storage locations. The code executes just
    as if it were copied to RAM. Depending on the speed of the processor, memory;
    and flash, there could be a performance penalty for using XIP.'
