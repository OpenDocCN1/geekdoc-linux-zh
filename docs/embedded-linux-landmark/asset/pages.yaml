    # Booting from Flash Memory


    SOMETIMES YOU CAN''T JUSTIFY THE TIME AND EXPENSE of developing a dedicated hardware
    platform for your embedded application. Perhaps the quantities are too small or
    the market is unproven. However, even under these circumstances you still don''t
    want to ship a big chunky PC with a hard drive. Hard drives wear out over time;
    they draw lots of power and get very hot. Besides, customers know PC when they
    see one. Fortunately, manufacturers are starting to produce PC-compatible computer
    systems with form factors (think VCR), some are rack mountable. In the future,
    we''ll even see some top boxes (think desktop) that look like a desktop hub or
    modem. However, the hard drive remains a problem.


    Currently, flash memory is the best substitute for a hard drive in an embedded
    device. It has several advantages over a hard drive; it''s faster, it draws much
    less power, it produces less heat than has no moving parts. Unlike a hard drive,
    the processor can directly address the bits stored in flash memory just like RAM,
    making execution in place (XIP) possible, thereby reducing the overall RAM requirements.
    However, the disadvantages of flash memory may be prohibitive: It''s much more
    expensive than an equal amount of hard drive space; it has much less capacity;
    and, as you write to flash memories, they slowly wear out.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Appendix C Booting from Flash Memory


    In 1994, M-Systems(www.m-sys.com) introduced the DiskOnChip, a small flash memory
    device that works like a hard drive. It can plug directly into a properly equipped
    motherboard, or into an ISA card for development. The DiskOnChip comes in a variety
    of sizes ranging from 2MB to 512MB, and in a variety of packages—DIP, TSOP-II,
    or DIMM. Depending on your application, the DiskOnChip may be the perfect storage
    solution for smaller-run embedded Linux devices based on the x86 processor, for
    several reasons:


    +   - It''s relatively easy to use.

    - Many motherboards intended for embedded applications support it.

    - It''s not more expensive than plain flash chips.

    - It comes with block drivers that make it look like a hard drive.

    - You can boot Linux directly from it.


    However, for the Open Source pursuit, the DiskOnChip has one really big disadvantage:the
    driver from M-Systems is not Open Source. If you use the driver improperly, you''ll
    violate the GPL. It is possible to avoid this violation by installing the driver
    as a module at runtime with the insmod or modprobe command. By the time you read
    this, work should be complete on a completely Open Source MT DiskOnChip driver
    in the 2.4 kernel. If you''re using kernel 2.4 or above, you should look at the
    instructions for the built-in drivers before using the drivers from M-Systems.


    An alternative to DiskOnChip is Compact Flash (CF), A Compact Flash device looks
    like an ATA/IDE hard drive with no additional drivers. Because of this, Linux
    can boot from it as easily as from a hard drive with additional drivers. Compact
    Flash devices are also very inexpensive because of their use in a great number
    of consumer electronics such as digital cameras and MP3 players.


    This appendix guides you through the process of building a custom Linux image
    and installing it on the DiskOnChip in such a way that you won''t violate the
    GPL. The image will be bootable and you''ll be able to distribute the hardware
    without any sort of spinning media—hard drive, floppy disk, or CD-ROM.We''ll build
    the Minicom application discussed in Chapter 8—but it will boot from the DiskOnChip
    instead of the floppy disk.


    Generally, there are two phases to generating a working embedded Linux device
    based on the DiskOnChip:


    +   - Building the DiskOnChip files.

    - Installing the files onto the DiskOnChip.


    The following sections provide details on these procedures.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Building the DiskChip Files


    This procedure uses the Embedded Linux Workshop presented in Chapter 7. We''ll
    use the workshop to re-create our favorite example, the Mimicom appliance (also
    used in Chapter 8).


    +   1. Acquire root privileges for your machine, if you don''t already have them.
    Because the Embedded Linux Workshop mounts and unmounts filesystems, there''s
    really no way to run it except root.

    2. Download the Embedded Linux Workshop. It''s available from http://elw.sourceforge.net
    or ftp://elw.sourceforge.net/elw/. There are a lot of files if you download the
    full source to the ELW. However, for now you only need the workshop itself. It
    will be named elw-X.Y.Z.tgz, where X.Y.Z is the current version number. If you
    just want to experiment with the Embedded Linux Workshop, you won''t need to download
    the source code to all the packages. However, if you'' targeting a non-x86 CPU
    or to do more than fool around the software, you''ll have to download most of
    the Embedded Linux Workshop source over time.

    3. cd /usr/local

    Change to the /usr/local directory. This is the easiest place to install the Embedded
    Linux Workshop. If you decide to install it somewhere else, make sure that you
    point your /usr/local/elw symbolic link to the right place.

    4. xvzf /tmp/elw-X.Y.Z.tgz

    Install the Embedded Linux Workshop into the /usr/local directory. The example
    command assumes that you downloaded the elw-X.Y.Z.tgz tarball into the /tmp directory.

    5. rm -f elw && ln -s elw-X.Y.Z elw

    Remove the old elw symbolic link and create a new one that points to the directory
    you just installed. If you need to revert to a previous version of the Embedded
    Linux Workshop, you can just point this symbolic link back to the old version.

    6. cd /usr/bin && rm -f elw && ln -s /usr/local/elw/bin/elw elw

    Remove any old /usr/bin/elw link and create a new one that points to the script
    in the elw package.

    7. cd -yourhome/projects

    Change to the directory where you want your new project to live.

    8. elw --newproject minicom

    Use the elw command installed in the previous steps to create the new project.
    Several directories and files are created within the new minicom directory.'
