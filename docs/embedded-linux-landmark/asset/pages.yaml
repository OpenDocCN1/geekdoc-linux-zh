    time to download all the source files to the Embedded Linux Workshop, most of
    the binaries will fail to build. That''s okay; the binaries that will work. You
    must rerun this option each time you make a change.


    +   Choose the Build image option to build the Linux files and image.


    Congratulations—you''ve just created a new embedded Linux disk image!'
