- img_proc: true
  md: '# Chapter 8 Static Application Example: Minicom


    Build the kernel with the following command:


    ```

    make dep && make bImage

    ```


    We use the "and" continuation (&&) instead of the semicolon (;) so that the second
    make won''t happen if the first fails. I''ve never seen make dep fail when building
    the kernel, but this is good practice for all long software builds with more than
    one make. This way, if an error occurs in one of the makes, the subsequent makes
    won''t even start, leaving you with only error messages still on the screen. We
    don''t need to make any modules for this kernel, but if we did, I''d simply add
    it to the command line like this:


    ```

    make dep && make bImage && make modules

    ```


    # Build the Boot Floppy


    Change back to the root directory of your project:


    ```

    cd ..

    ```


    Insert a floppy disk into the drive. We''ll assume it''s /dev/fd0 (/dev/fd0H1440).
    The rest of this procedure assumes you''re using a 3 1/2-inch floppy of 1.44MB
    capacity. If this assumption is incorrect, change the commands accordingly.


    Perform a low-level format of the floppy disk. If you''re the floppy is already
    formatted for 1.44MB, you can safely skip this step:


    ```

    fdformat /dev/fd0H1440

    ```


    Create an MS-DOS filesystem on the floppy disk and mount the floppy as the MS-DOS
    disk:


    ```

    mkfs.msdos /dev/fd0

    mount -t msdos /dev/fd0 /mnt

    ```


    The mkfs.msdos command has a couple of parameters that you can tweak to get more
    room. If you''re really pressed for space, add -f to reduce the number of FAT
    tables


    Now copy the compressed kernel, the initrd filesystem, and the SYLINUX MS-DOS
    floppy boot loader file to the floppy disk:


    ```

    cp linux/arch/i386/boot/bImage /mnt

    cp fs.gz /mnt

    cp syslinux-1.48/ldlinux.sys /mnt

    cat > /mnt/syslinux.cfg

    ABEL linux

    KERNEL bImage

    APPEND initrd=fs.gz

    ```


    End the cat command with Ctrl+D. This command creates the syslinux.cfg file on
    the floppy disk.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Tip: Of course, you can use a more powerful editor such as vi or emacs to create
    this file, for demonstration purposes this is the simplest way to describe how
    to create the file. For a lot more information about what can go in this file,
    see the syslinux.doc file in the SYSLINUX distribution.


    Unmount the floppy disk, make it bootable, and use the sync command to make that
    all writes are synchronized to the floppy:


    ```

    umount /mnt

    syslinux-1.48/syslinux /dev/fd0

    sync

    ```


    Wait until the command reappears. Then remove the floppy disk from your build
    machine and boot your test bed machine with. If all goes well, Minicom should
    appear within a few seconds of booting.


    # Troubleshooting


    There are several potential pitfalls you may run into while following this procedure.
    Some of them are covered in this section.


    # /usr/share/termininfo/l/linux May Be Wrong


    If you''re not running on Red Hat 6.2, the terminfo database may not be in /user/share.
    If this is the case, find where the terminfo database is and substitute path for
    /usr/share/termininfo/l/linux everywhere you see it in the procedure.


    # You Need /dev/console


    Probably the least obvious thing about creating a bootable Linux floppy disk is
    the fact that you absolutely need the /dev/console device in your initrd filesystem
    because the kernel specifically attempts to open it before calling /linuxrc. If
    it doesn''t exist, the initrd filesystem will not load, and the kernel will panic.


    # The LABEL Statement in syslinux.cfg Must be Linux


    If you choose to call something else, you must have a DEFAULT statement, or the
    user will have to type the name at boot time. See the syslinux.doc file in the
    SYSLINUX distribution for more information about the syslinux.cfg file.


    # Exiting from Your Application Panics the Kernel


    The initrd filesystem was designed to be a short-weigh-station in the boot process.
    All the kernel designers intended for you to do was load a kernel module or two
    (for SCSI drivers, for example), and then exit. The kernel would mount the real
    root device and boot the user-mode part of the operating system.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'You use the initrd filesystem differently here—your entire application runs
    out of it. Because of that, it''s important to prevent the user from exiting the
    application. If that happens, the user gets a message like this:


    +   - driver: not present

    - VFS: Cannot open root device 03:01

    - Kernel panic: VFS: Unable to mount root fs on 03:01


    # Use chroot to Test on Your Build Machine


    When your build machine is running the same processor as your target, you have
    several additional debug tricks available to you. One of the handiest is the chroot
    trick.


    During the build process, you''ll create a root filesystem image that the machine
    will boot from. Once that image is created, it can be mounted using a loopback
    device. You can then use the chroot command to change a subshell''s root directory
    to the mounted filesystem. Any commands you type in the subshell will be limited
    to using only files within the filesystem image you created. This is quite handy
    for checking target device. make sure that your software generally works before
    committing it to the target device. For instance, if you''re missing a dynamic
    library, and you run a command that requires it, the command will error out.


    Some things won''t work, however. For instance, any command that relies on the
    /proc filesystem will fail. This is because the /proc file system is not available
    to the chrooted environment.'
  merge: -1
