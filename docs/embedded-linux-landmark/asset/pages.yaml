  md: '# Disadvantages of Open Source


    +   - It’s more difficult to protect intellectual property.

    There are many market reasons for which you might not want to release your intellectual
    property: You want to get ahead of the competition, you don''t own all the code
    your IP is based on, and so on. If you have intellectual property that you''re
    not planning to share with the rest of the world, you need to be very careful
    not to include any source code from other Open Source projects, even if you might
    have otherwise reduced your time to market. Including source code from (or basing
    your software on) other Open Source projects will generally cause your source
    code to be covered by the terms of that Open Source project—a bad thing for those
    wanting to maintain intellectual property.

    For application code, there are many closed-source apps under Linux (the most
    notable being Netscape). In kernel space, there are many examples of binary-only
    kernel modules (such as DiskOn, used in later examples in this book). In kernel
    space, though, the maintenance burden is often a very high price to pay. Since
    the kernel has many options that change the module interface (such as SMP versus
    UP, large memory version versus so on), even a single kernel release may require
    several builds for every platform. Furthermore, kernel interfaces change, leaving
    the proprietor of the binary-only kernel with broken code in need of constant
    repair. Also, when a bug crops up, the standard set of kernel developers may refuse
    to help using binary-only kernel modules and instead refer them to the modules''
    proprietor.


    +   - Kernel release comes fast and furious.

    Linux kernel changes can come out very quickly and can differ significantly from
    release to release. If you feel you must on the latest version, this can be quite
    demanding.


    +   - Kernel releases don''t always appear expected.

    This can be difficult if you want to plan a release of your product based on a
    feature set available in the newest kernel, but don''t want to release beta code.


    +   - It’s difficult to know whether your changes will be incorporated.

    If you make changes to the kernel, you can’t be sure they’ll be incorporated into
    the mainline source code. Sometimes a kernel change that works perfectly is completely
    rejected by the kernel maintainers as being philosophically wrong for Linux. (You
    want them to be incorporated so that other people can do the maintenance on these
    changes for when kernel interfaces.)'
