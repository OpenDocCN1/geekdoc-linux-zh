    # Time to Market


    The pace of technological innovation has been accelerating for the computer field—past
    50 years, with no let in sight. This is especially applicable in the computer
    field—where someone has even coined the phrase “Internet time” to describe the
    phenomenon.


    On one hand, companies such as Intel and Motorola are creating new chipsets at
    a furious pace to compete with each other. On the other, hundreds of software
    and Internet companies are creating new protocols and ways of hooking computers
    to humans and to each other. This puts a lot of pressure on embedded OS companies'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'such as QNX and WindRiver. They must support the hardware technologies as they
    first come out or soon after; then they must support those technologies long-term.
    The real problem for the embedded OS companies, however, is software support.
    They must constantly play catchup on the software front. Many of the newest software
    technologies are being developed using Linux, by by definition the technology
    is available first. Technologies that are not developed on Linux are usually created
    on Microsoft Windows. Because of Linux''s huge development, the important technologies
    developed on Windows are quickly migrated to Linux.


    One reason that Linux speeds time to market is that you often use the same OS
    for the development host as you would for the target host.


    # Open Source


    Except for cost, all of the reasons previously outlined are technical issues.
    For instance, Linux is very stable, but so are the commercial embedded OS choices.
    The area that really makes Linux apart is the fact that it is Open Source. This
    fact, above all issues, should make Linux (or perhaps some other Open Source operating
    system) the OS of choice until eliminated for some specific reason;

    What does it mean to be Open Source?


    Version 1.7 of the Open Source Definition (www.opensource.com)


    Free Redistribution


    The license may not restrict any party from selling or giving away the software
    as a component of an aggregate software distribution containing programs from
    several different sources. The license may not require a royalty or other fee
    for such sale.


    Source Code


    The program must include source code, and must allow distribution in source code
    as well as compiled form. Where some form of a product is not distributed with
    source code, there must be a well-published means of obtaining the source code
    for no more than a reasonable reproduction cost—preferably, downloading via the
    Internet without charge. The source code must be the preferred form in which a
    program would modify the program. Deliberately obfuscated source code is not allowed.
    Intermediate forms such as the output of a preprocessor or translator are not
    allowed.


    Derived Works


    The license must allow modifications and derived works, and must allow them to
    be distributed under the same terms as the license of the original software.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Integrity of the Author''s Source Code


    The license may restrict source code from being distributed in modified form only
    if the license allows the distribution of "patch files" with the source code for
    the purpose of modifying the program at build time. The license must explicitly
    permit distribution of software built from modified source code. The license may
    require that derived works to carry a different name or version number from the
    original software.


    # No Discrimination Against Persons or Groups


    The license must not discriminate against any person or group of persons.


    # No Discrimination Against Fields of Endeavour


    The license must not restrict anyone making use of the program in a specific field
    of endeavor. For example, it may not restrict the program from being used in a
    business, or from being used for genetic research.


    # Distribution of License


    The rights attached to the program must apply to all to whom the program is redistributed
    without the need for execution of an additional license by those parties.


    # License Must Not Be Specific to a Product


    The rights attached to the program must not depend on the program''s being part
    of a particular software distribution. If the program is extracted from that distribution
    and used or distributed within the terms of the program''s license, all parties
    to whom the program is redistributed should have the same rights as those that
    are granted in conjunction with the original software distribution.


    # License Must Not Contaminate Other Software


    The license must not place restrictions on other software that is distributed
    along with the licensed software. For example, the license must not insist that
    all other programs distributed on the same medium must be Open Source software.


    # Advantages of Open Source


    +   - You can find any bug when you have the source.


