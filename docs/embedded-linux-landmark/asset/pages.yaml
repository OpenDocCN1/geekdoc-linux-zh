    # A Tour of the Embedded Linux Workshop


    As the preceding section shows, using the Embedded Linux Workshop is fairly straight-forward.
    The way in which the toolkit was put together was also straightforward. When designing
    the toolkit, emphasis was placed on simplicity and expandability.


    # The Embedded Linux Workshop Directories


    A project using the Embedded Linux Workshop uses two unconnected directory trees;
    one for the specific project and one for the Embedded Linux Workshop itself. This
    section deals with the Embedded Linux Workshop directories and files. The next
    sec-deals with the project files.


