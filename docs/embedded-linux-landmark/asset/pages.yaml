  md: 'The code requirements at this level haven''t changed much since the i386 was
    intro-duced many years ago.


    # LinuxBIOS


    Let''s take a look at a few files from the LinuxBIOS project. The stated goals
    of the LinuxBIOS project are as follows (adapted from the LinuxBIOS home page
    at http://www.acl.lanl.org/linuxbios):


    # What is LinuxBIOS?


    We are working on making our BIOS. In other words, we plan to replace the BIOS
    in NVRAM on our motherboards with a Linux image, and instead of running the BIOS
    on startup we''ll run Linux. We have a number of reasons for this:


    +   - We initialize our cluster nodes to come [and] go out to the for direction
    how they should boot (diskless, local disk, reload, etc.). While there is a standard
    for (PXE from Intel), it has a lot of limitations.

    - By far the most important function of the BIOS is to support obsolete code,
    as DOS. Modern operating systems as Linux have absolutely no use for what the
    BIOS does. Still many BIOSes do a poor job of configuring the PCI bus for systems
    such as Linux. Replacing the BIOS with Linux allows faster reboots and better
    system configuration.

    - The NVRAM can be written with the kernel we most comly use. We can envision
    booting Linux in 10 milliseconds or so-a very attractive idea.


    # How will it work?


    +   1. When the PC enters the RESET state, it starts executing instruc tions at
    location 0xfff0. At this point, the Pentium is emulating a 20-year-old microprocessor,
    the 16-bit 8086. This address is in NVRAM. We will have rewritten NVRAM with a
    stub of LinuxBIOS.

    2. We initialize the chipset that so interrupts work, and DRAM is on.

    3. As soon as we have DRAM we turn on the GDT and jump to 32-bit assembly code.

    4. 32-bit assembly code does a bit more work and jumps to C.

    5. The code is short: it uncompresses the Linux image out of NVRAM into RAM and
    jumps to it.'
