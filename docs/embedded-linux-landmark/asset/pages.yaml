  md: 'The first call to conf() on lines 87–88 sets up the eth0 (wan) interface. Lines
    16–23 extract the local variables from the function call. Line 24 tests to make
    sure that the interface is enabled and that an IP address is assigned. Lines 25–28
    use an external C program, ipcalc, to calculate the network address, network mask,
    and network bits. Lines 31–35 assign the IP address and network information for
    the interface, and then deal with any error(s) returned. Similarly, lines 36–40
    actually bring up the link and check for errors. Line 41 is a bit of a kludge.
    A previous evolution of this script used ifconfig/route instead of the ip command.
    The NETOPTP variable was used to give ifconfig any extra parameters (such as the
    MTU setting). Since the syntax of the ip command is different from that the ifconfig
    command, the same technique wouldn''t work for it. I decided to redefine the NETOPTP
    as a separate command. With it, you can do whatever you need (such as the MTU
    of the interface). Lines 44–50 set up the default route, and lines 53–56 set up
    IP masquerading. After studying the code, you may be a bit worried about security.
    For instance, the NETOPTP variable could be set to "some.ip.address; rm -rf /*,",
    which would blow away the machine on line 45. For the Embedded Linux Workshop,
    I''ve taken the stance that the data in the configuration file is trustworthy.Verification
    that builds and/or modifies the software must be secure anyway. The second call
    to conf() sets up the eth1 (lan) interface. The specifics for the conf() function
    are very similar to those for the eth0 (wan) interface, except that the default
    interface is already set up, so the test on line 44 is not activated.


    # Summary


    Setting up a Linux system is quite complex. Much of that complexity stems from
    the fact that there are many configuration files spread across the directory tree,
    each of which has a unique syntax. Programmers who want to create an embedded
    application can make their job lot easier by planning out how to configure the
    machine, both at build time and runtime.'
