    images that are not themselves covered under the GPL. Your project contains a
    config file that can name other directories to search for binaries to load onto
    the image you are creating. Again, these binaries not to be covered under the
    GPL. |

    | VERSION | The current version of the Embedded Linux Workshop. This is not the
    version of the product you create; it''s the version number of the tool you used
    to create the image |


    These are the directories in the root of the Embedded Linux Workshop:


    | Directory | Contents |

    | --- | --- |

    | arch | One subdirectory for each of the architectures supported. |

    | bin | elw Perl script. This script displays the elw menu and runs through the
    build process. It also contains all of the style scripts. The style scripts know
    how to build one or more image styles. |

    | doc | Documentation for the current release of the Embedded Linux Workshop.
    Architecture-neutral files for each of the optional packages that the Embedded
    Linux Workshop supports. |

    | tools | Tool chains for the various architectures that the Embedded Linux Workshop
    supports. |


    arch/*src

    The arch/*src directory contains dozens of subdirectories, one for each source
    module that the Embedded Linux Workshop supports for a given architecture. Each
    architecture may support a different set of applications requiring a different
    set of modules. Within each source module directory is at least one source archive,
    an extracted archive in a subdirectory, and a symbolic link pointing to that extracted
    archive. For example, in the arch/i386/src directory are the following entries:


    | File | Description |

    | --- | --- |

    | sed-3.02.tar.gz | The original source code for sed. It is important to keep
    this file because you may need to find out what changed to make your specific
    version work. This is especially important if you have to change the Makefile
    to support your architecture. Just be sure not to blow away your changes if you
    re-extract the file in the current directory.


    continues'
