  md: '![](img/8b49953a368fc0ed5b31c2626a338037_94_0.png)


    # 6 Embedded Linux Toolkits


    THE MOST STRAIGHTFORWARD WAY OF EMBEDDING LINUX into the device of your choice
    is to grab the latest Linux kernel, a cross-compiler for your target hardware,
    a C library, and some applications—and start hacking. The problem is that you''ll
    spend an awful lot of time hacking before you have something that smoothly boots,
    let alone actually does what you want it to.


    In 1999-2000, many people in the Linux community realized how applicable Linux
    is to a large number of problems in the embedded application space. They also
    realized how non-trivial it is to create a working Linux system for the embedded
    platform. Many software toolkits were built to simplify the job of creating the
    software for these embedded Linux devices. Some of these toolkits come from newly
    created and well-funded companies; others come from companies that have been in
    the embedded market for some time but have reinvented themselves for Linux. Others
    don''t come from companies at all, but Open Source projects built up from collaborations
    across the Internet.


    This chapter attempts to make sense of the jumbled mishish of competing embedded
    Linux toolkits available as of 2001. Of course, as I write these words, the world
    continues to spin—so the landscape may be very different as you read this. However,
    I''ve attempted to define the questions that you should be asking of the packages
    you''re considering.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# What Constitutes an “Embedded Linux Toolkit?”


    There are a lot of products and projects available on the Internet that can help
    you with various aspects of building the software for your embedded Linux device.
    I''m defining “embedded Linux toolkit” to include only those products and projects
    that, together with a host Linux system and the target hardware, provide a complete
    end-to-end solution for building the image that you load onto the hardware that
    will boot Linux and run at least a simple application.


    Each toolkit has a different user interface and style. However, all must essentially
    be the same thing: Build a Linux kernel that contains the application as a kernel
    thread or also builds a root filesystem with the application software in it. The
    toolkit must then be able to install the pixels into a binary image from which
    the target system boots.


    For, by definition, BusyBox is not an “embedded Linux toolkit.” BusyBox is a great
    piece of technology that shoehorns a lot of software into a very small space;
    it’s especially useful for statically linked environments. But by itself, BusyBox
    does not contain enough software to create a complete Linux system. This chapter
    takes a close look at embedded Linux toolkits:


    +   - BlueCat from LinuxWorks (www.linuxworks.com)

    - PeeWeeLinux (www.peewelinux.org)


    In addition to this, some of the items in the following list may fill your needs.
    This is by no means there are many other products and projects that you can consider.


    +   - The Embedded Debian Project (www.debian.org)

    - Embedded DevKit (EDK) and GNUPro from Red Hat (www.redhat.com/embedded)

    - Embedfix from Lineo (www.lineo.com)

    - Hard Hat Linux from MontaVista (www.mvista.com)

    - Linux Router Project (www.linuxrouter.com)


    # Considerations


    While you''re considering the various toolkits, you should try to answer the following
    general questions. You should also make up a list of toolkits specific to your
    project.


    +   - What is the size of image produced?

    - What architectures are supported?

    - How easy the toolkit to use?'
  merge: -1
