    Linux is a great environment for many types of applications, and many good books
    have been written on the subject. This book looks at a very specific area of development—embedded
    devices. Using Linux on your embedded device seemed wild fantasy a few short years
    ago; now it''s almost routine. This book will help you get started building the
    software you need to run your embedded device. It will help you avoid the traps
    and pitfalls, and keep your system lean—reducing your build cost as much as possible.


    —John Lombardo


    > The rapid rise of Linux as a standard in embedded devices has resulted in a
    need for better texts John Lombardo''s in-depth understanding of the topic and
    his straightforward approach make this perfect book for getting started in embedded
    systems programming.


    Bob Young, Chairman and Co-founder, Red Hat, Inc.


