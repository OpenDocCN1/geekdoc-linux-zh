- img_proc: true
  md: '# What architectures are supported?


    The following target processor families are supported:


    +   - Intel IA-32 (x86)

    - PowerPC

    - PowerQUICC

    - ARM/ARM7/ARM9/StrongARM

    - Super-H

    - MIPS R3000/R4000


    # How easy is the toolkit to use?


    The toolkit is quite straightforward and easy to use. However if you''re a true
    believer in a graphical environment, you''ll be disappointed—it''s straight text
    only. This works for my style of development, but some people just don''t like
    hacking on Makefiles.


    # How many optional packages are available?


    I counted 381 optional packages in Appendix B of the BlueCat User''s Guide. Most
    of that stuff is completely useless for an embedded system, however (unless considering
    putting the Slovenian HOWTO on your target something useful).


    # What exceptional packages are available?


    The packages I reviewed were all standard Linux software. BlueCat''s value-add
    is their build environment and toolkit—they don''t give you anything out of the
    ordinary in their target RPM packages.


    # How customizable is the image? How difficult is it to customize?


    BlueCat Linux uses a special specification file to lay out the filesystem of the
    target. The specification file looks very much like a shell script, and as such,
    the target is completely customizable.


    # How much does the toolkit cost? Is it a royalty involved?


    In early 2001, BlueCat Linux costs anywhere from US$299 to US$20,000, depending
    on the support level you want to pay for.


    # How well is the toolkit documented? Is printed documentation available?


    The documentation was up to the task of getting me started. A HOWTO would be helpful.
    For instance, it wasn''t obvious how to add code to the target from the documentation
    (however, one look at the specification file was all it took).'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# How well is the toolkit supported? Paid support? Active list?


    LinuxWorks has been around for a number of years. They have another embeddable
    operating system called LinuxOS, so they have an established support organization.
    Therefore, their Linux support looks like many other software companies'' support—you
    can buy installation support and/ incident support from directly. As of writing,
    their Web site doesn''t mention any lists.


    # What are the requirements to use the toolkit?


    The following host operating systems are supported:


    +   - Red Hat 6.1 and 6.2

    - TurboLinux Workstation, version 6.0

    - Windows 98/NT/2000


    Windows is supported using cygwin. Supporting Microsoft Windows as a hosting environment,
    although it may make many Linux partisans cringe, is quite a good idea. It can
    only serve to spread Linux to more developers.


    # Can a new version of the toolkit be installed without losing changes?


    Even our examples lived within the -bluecat/bluecat directory tree, there was
    no reason why they had to.You can easily upgrade BlueCat without fear of blowing
    away your projects.


    # PeeWeeLinux (www.peewelinux.org)


    In the words of its author, "PeeWeeLinux is an ongoing development effort to provide
    an environment that makes the configuration and installation of a Linux operating
    system on an embedded platform as easy and painless as possible."


    Unlike BlueCat, PeeWeeLinux is a Open Source project, but not a product. As such,
    it doesn''t have dedicated engineering resources behind it, and probably doesn''t
    go through a testing procedure as rigorous as that for BlueCat.

    PeeWeeLinux uses RPM to build and maintain its packages, and has a nice text-mode
    build system. It specifically supports the 2.2 kernel, USB, PCMCIA, and XFree.


    # Using PeeWeeLinux


    I was able to install PeeWeeLinux version 0.53.23 and get my application floppy
    running in around an hour. Generally, the documentation is quite sparse, but there''s
    enough to get you started.


    +   - Download the latest distribution from one of the mirrors listed at www.peewelinux.org.
    I downloaded the binary-only version, which was over 53MB. The version with full
    source is almost 200MB!'
