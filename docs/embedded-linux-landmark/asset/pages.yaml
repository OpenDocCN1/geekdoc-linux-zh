  md: '# Booting the Kernel


    How the computer loads the operating system into memory and starts it is an issue
    that most software developers never have to think about. Most of us work on PCs
    or similar platforms that have a BIOS that does the dirty work of setting up the
    hardware and finding and loading the OS loader (for example, LILO or GRUB) into
    RAM so the kernel can start. The most we ever have to think about is which OS
    to use and how to configure properly.


    Welcome to the world of embedded devices, where you may start with a manual that
    says only something like this:


    > “Hard Reset (HRESET)—Input” causes the hard reset exception to be taken and
    the physical address of the handler is always x’FFF00100’.


    > PowerPC601 RISC Microprocessor User’s Manual (IBM Corporation, 1993), p. 5–16.


    It’s now up to you to write the assembly code to do the following:


    +   1. Initialize all of the hardware.


    +   2. Move the OS loader into memory from storage (or perhaps you just load the
    OS itself).


    +   3. Jump into the code you just loaded.


    Fortunately, most development boards for the various microcontrollers and processors
    come with ample documentation and sample code for startup. There are also many
    examples on the Internet for the many different processors that Linux supports.


    # Software Size


    Unlike a general-purpose computer system, an embedded system only requires enough
    software to actually get a specific set of jobs done. This means you can do without
    lot of the fluff that normally goes into a general-purpose computer system as
    X windows, email and newsletters, and so on. By doing this, you can make the software
    image much smaller. This is important because you normally don’t have a hard drive
    in an embedded application. Even when you do have one for storage, it may be better
    to put the system software and applications in ROM or flash so they aren’t vulnerable
    to corruption. Both ROM and flash are much more expensive byte-for-byte than space
    on a hard drive, so it’s important to include just the software that your embedded
    application actually uses.


    Another reason to limit the software that ships in your embedded application is
    simple; if it’s not there, it can’t break. It’s usually inconvenient to upgrade
    the software in an embedded application—sometimes it’s impossible.'
