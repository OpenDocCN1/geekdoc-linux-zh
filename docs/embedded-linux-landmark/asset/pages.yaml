- img_proc: true
  md: '# Testing and Debugging


    DEBUGGING AN EMBEDDED SYSTEM CAN BE A DAUNTING TASK. Developing software on a
    personal computer is easy by comparison—there''s an operating system under your
    software may not have to catch unexpected events, a screen to display debug messages,
    and a keyboard and mouse with which you can give your software input. Your embedded
    device may not have any of these; you may have only a little LED that your software
    can make blink—or you may not even have that!


    From the beginning, you need to design your embedded application with diagnostics.
    If you don''t, chances are that you''ll eventually be faced with a little box
    and no way to know what happened. You''ll wonder whether it will happen again—and
    then it will. This gives developers nightmares.


    This chapter looks at several obvious (and some less obvious) tips and techniques
    for speeding the development and increasing the “debugability” of your embedded
    Linux device.


    # Test on Your Host Computer as Much as Possible


    The target computer is a fun toy, and once it starts working, it seems to be the
    natural place to do all of your testing. After all, that''s where the software
    has to run eventually—why not test it?'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'That reasoning is invalid. You should test as much of your software as possible
    on your host computer system. If your host is running a different processor, modify
    your Makefile so that the software can be built for your host or target. If your
    software depends on hardware that can only be found in the target, you can still
    test a lot of your code on the host by #def-ing out the parts of the code that
    actually need the target''s hardware.


    Testing your software on your host is important for these reasons:


    +   * Access to debugging tools

    You probably have better debugging tools—and more control over them—on your host
    computer than on your target computer. The host computer is probably a desktop
    computer running Linux. On it you have a large array of great software development
    tools—not just the compiler tool, but debuggers, debug libraries, memory bounds-checking
    libraries, tools as strace, and so on. Chances many of these tools will not fit
    on your target box; they may not even have been ported to the processor you use.
    But that doesn''t mean you can''t use them. Compiling software on your host machine
    allows you to use this array of tools for debugging code—once you''re satisfied
    with your changes, you can recompile the code for the target.


    +   * Simpler cycle

    The debugging cycle almost will require considerably less effort on your host
    than on target. The time it takes you to start testing code that you have changed,
    the better—especially if you''re like me, and to change a small bit of code and
    then run it, then change more small bits and run them. Your host computer probably
    compiles code for itself just as fast as it compiles for your target; once it''s
    compiled, you don''t need to move it anywhere—you can run it where it is. It may
    take several minutes (or longer) to move the code to the target, just to find
    out that you''ve made a mistake and to repeat the whole process.


    Of course, you do need to do testing on your target, and the target''s environment
    may be very different from the host''s, not only in terms of hardware, but also
    the runtime—C libraries, other libraries, utility programs, and so on. If you
    go too long without moving the development code to the target computer, you may
    waste a lot of time backtracking when you made some incorrect assumptions about
    the target environment. This is especially true in the very beginning of a project,
    when you''re new to the environment—the first order of business should be to get
    the hardware up and running, and then test your software at least once a day.


    Sometimes it doesnt makes sense for you to debug software on your host machine.
    For instance, if you''re implementing a driver for hardware that can only exist
    on your target, you obviously can''t do beyond developing the stub code on your
    host machine. You may also want to steer clear of testing any “dangerous” software
    on your host machine. For instance, any software that, as part of'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Debugging Tools


    functionality, creates a new filesystem on the first partition of the first hard
    drive it sees should not be tested on your host machine—even if you believe the
    dangerous code path cannot be reached. You may be correct when you originally
    thought it, but as you test and debug your software, you may accidentally activate
    the wrong code path and blow away your machine.


    # Debugging Tools


    Every software programmer develops a quiver of tools that he or brings to bear
    on current projects. The tools described in the following sections are some that
    I''ve found very useful for software development. This is by no means a complete
    list of tools that can be used for building and debugging software, but getting
    to know at least tools will help you develop Linux software more quickly and effectively.


    # VMware Workstation


    VMware, Inc. describes VMware Workstation like this:


    VMware Workstation allows completely independent installations of operating systems
    on a single machine. Multiple instances of Windows or Linux can run side by side.
    Each machine is equivalent to a PC, since it has a complete, unmodified operating
    system, a unique network address, and a full complement of hardware devices.


    In essence, VMware Workstation allows you to run multiple operating systems at
    the same time on your x86 host computer. If your target happens to be an x86,
    this feature is extremely handy. You don''t have to move any software to your
    target computer until it comes to actually test anything or install into your
    host machine. VMware may also be useful if you''re not targeting an x86-based
    machine. You can use VMware for the day-to-day development process, requiring
    less recompiling to the target architecture to do integration testing. Remember,
    keeping everything on one computer can be a great time-saver and make you a much
    more effective developer.


    I use VMware Workstation extensively My current development platform is a Dell
    Inspision 7500 laptop computer. On it, run (don''t look) Windows 2000 as the host
    (VMware term) operating system. On another partition, I have an install of Red
    Linux that boots under Windows using VMware Workstation. Using Samba, I''m able
    to easily share files between the operating systems. I also run an X server for
    Windows 2000, so my sessions appear like any other Windows application.


    By the way—if you have ever burned this book before reading the above—the reason
    that I run Windows 2000 as my main OS is that I can use of the "hibernate" facility.
    I can shut down my computer for days at a time—it draws no power. I can then restart
    the computer and have all my windows open to exactly where I was when I left off.
    If I was in the middle of inserting text in vi, I myterm sessions are still there,
    sitting right where I left them. If I can go right back to doing that.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 140 Chapter 9 Testing and Debugging


    I used VMware extensively while developing the Embedded Linux Workshop in this
    book. With it, I don''t need a target computer, and can develop completely on
    one box. ELW''s builds build floppy images, which I boot using a new instance
    of VMware Workstation. With it, I can compile the target application, build the
    floppy image, and boot the image—all within two minutes. You can also use hard
    drive images. This entire hard drive is mapped to a single file in your filesystem.
    This makes it hard for your test system to most out your real disk partitions.


    If you decide to use VMware Workstation, make sure that your machine has enough
    horsepower. My 500 MHz 128MB Dell is a little underpowered for the job, especially
    if I have a lot of Windows applications open.


    # chroot


    Sometimes booting VMware is too much of a hassle, or perhaps you''re having trouble
    with libraries and your target machine doesn''t boot at all. If your host and
    target are running the same hardware, or you are simply testing your software
    on the same hardware as your host, you uncompress and mount your root image as
    a loop filesystem (mount -o loop) and then chroot to it. Doing gives you almost
    the same environment that you''ll get running on different hardware. Any binaries
    you run will use the libraries of your target, the filesystem will be the same,
    and so on. This will suffice for testing many kinds of problems. You can even
    get fancy and copy code into the filesystem.


    Some things won''t be the same, however:


    +   * Kernel


    You may be running a different version of Linux on your host than on your target.
    Depending on how different the versions are, the chrooted environment may not
    work at all on your host.


    +   * Boot code


    Any necessary setup code that''s normally done while your target hardware boots
    will have to be run manually when you start the chrooted environment.


    +   * /proc


    You can''t mount the /proc filesystem in your chrooted environment, so any software
    that relies on it will have difficulty.


    +   * Network connections


    The networking facilities are not part of the filesystem, so they''re visible
    in the chrooted environment.


    +   * System V IPC


    Because the System V Inter Process Communication structures (shared memory, message
    queues, and semaphores) don''t live in the filesystem, they''re visible to the
    chrooted environment.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# User Mode Linux


    Somewhere between chroot and VMware is User Mode Linux. User Mode Linux enables
    to set up a complete Linux kernel and runtime environment within the confines
    of a user mode Linux process.


    It''s a little more difficult to set up the chroot example described earlier,
    but most of the mentioned restrictions are lifted. For more information, see http://user-mode-linux.sourceforge.net/


    # strace


    strace is a utility that should be in every Linux bag of tricks, whether or not
    you''re developing an embedded device. Many times, there''s no quicker way to
    track down why a program is failing to run under it. trace displays stderr all
    of the system calls (along with its parameters and return values) that a program
    uses during execution. A program typically does a lot of system calls, there can
    be a lot of output—much of it useless to the problem at hand. But if you know
    what to look for, the stuff can be priceless.


    Let''s look at an example. I was recently developing a program called wb.c. I
    had just written a bunch of new code, and when I ran the software it got a segmentation
    fault


    ```

    [root@jilinux cadmin#]# wb -e showmeminfo

    Segmentation fault (core dumped)

    ```


    To debug the problem, I had several choices:


    +   Review all the code I changed, to find the mistake. If it had been a while
    since I made the changes, or if I made a lot of them, this could take a while.

    Add a bunch of debug printf()s to localize the problem. Of course, this solution
    is fairly hit-or-miss and can take a while.

    Rerun the program under gdb. Since I hadn''t compiled it with debug information,
    this would have been slow. Without strace, however, this would probably be the
    quickest choice.

    Review the code under strace.


    The output is shown below. Note that the old_mmap() and mprotect() calls were
    removed from the output for brevity:


    continues'
  merge: -1
  pgno: 170
