    # Terminology


    # Architecture


    In the world of the Embedded Linux Workshop, an architecture defines a specific
    application and kernel binary type. For example, if your product is based on an
    ARM7 without an MMU running in little-endian mode, and you decide to statically
    link your applications using the ulibc library, your architecture may be named
    arm7-little-uclibc-static. You can name the architecture anything that makes sense
    to you. For instance, the architecture that comes with the ELW is named 1386 for
    the Intel 80386 and compatible processors running applications that are dynamically
    linked with the glibc library.


    # Target


    The actual files created by the ELW.These may be disk images or a series of files
    to install on a machine.


    # Target Processor


    The ELW can cross-compile source into object code for different processors if
    the tool chain (compiler, linker, and so on) for that processor is installed.


    # Target Style


    The type of target to create. A SYLINUX disk image, a LILO disk image, a MILO
    disk image, etc. Most target styles have multiple suboptions. For instance, the
    SYSLINUX target style can create different disk image sizes, and can create upgrade
    files.'
