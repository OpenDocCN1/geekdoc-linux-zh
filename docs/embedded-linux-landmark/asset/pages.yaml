    The Makefile within the root of each opt directory has one or more of these targets:


    # Directory

    Description


    binaries


    This target attempts to make the binaries in each of the source directories and
    running make. The binaries then copies the pieces it wants from the source directory
    structure to one of its own directories. It strips them if necessary, attempting
    to build each binary as small as possible.


    This target is used by the elw script when the user selects Build Binaries from
    the menu. Before the script runs the make command, the entire opt directory is
    copied to the arch/*/opt directory. Binary files will never appear in the opt
    directory, only in the arch/*/opt directory.


    slowbinaries


    This target works like the binaries target, but is intended for packages that
    take a long time to build, such as the C library. Most binaries take a few seconds
    to build, so it''s no big deal to build them several times a day, whenever a source
    file changes. The C library can take tens of minutes to build—and it almost never
    changes.


    dependencies


    This target simply prints the names of the opt packages on which this opt package
    depends. The dependencies target is used by the elw script to build the complete
    list of opt packages needed for a project.


