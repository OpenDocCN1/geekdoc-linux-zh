  md: '# Chapter 2 Minimal Linux


    When the kernel starts up, it runs a program called /linuxrc or /bin/init, depending
    on whether you use the init feature of Linux. If you name your starting executable
    properly on the root filesystem, you can force the kernel to run it when the kernel''s
    doing booting. If you link the executable statically, you don''t need to have
    the shared C libraries in your root filesystem.


    Usually, however, you need many executables for your application. Perhaps you
    need to start the network with ifconfig and route. Perhaps you need certain daemons
    to respond to events. Each of these programs takes much more space when statically
    linked than dynamically linked. So it''s best to link executables dynamically
    if your application has more than a few.


    Dynamically linked executables share a single copy of functions that are commonly
    used in all executables. Examples of functions in the standard C library include
    printf(), open(), read(), write(), and close(). Sharing the code that performs
    these common functions helps the embedded programmer in you


    +   - With numerous executables, the total amount of storage used by all executables
    plus the shared libraries will be less than the total amount of storage used by
    the executables if they were statically linked.

    - In general, dynamically linked executables take up less real memory for the
    same reason. There will be only one copy of shared functions, such as printf(),
    the whole machine. If the executables are statically linked, each will have its
    own copy of printf(), and they may both be in memory at the same time even though
    they''re ideal.


    Dynamically linked executables are marginally slower, however. Because each shared
    function is not part of the executable code, whenever it''s called some fix-up
    code’s must discover what actual actual code needs to be called. This may be only
    a few dozen instructions, but in a tight loop these instructions can add overhead.
    Normally, however, the difference is negligible and the storage size is tremendous.


