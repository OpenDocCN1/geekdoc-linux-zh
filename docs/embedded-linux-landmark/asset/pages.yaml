    \nPress Ctrl+D here.\nThe Embedded Linux Workshop comes complete with a set of\
    \ startup scripts that work similarly to the Red Hat startup scripts. Each script\
    \ in the /etc/rc directory that begins with the letter S is executed in increasing\
