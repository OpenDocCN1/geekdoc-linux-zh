  md: '# Web Sites Devoted to Embedded Linux


    The following sites are excellent resources for anyone who needs all the gory
    details building and working with custom embedded Linux systems.


    # LinuxDevices.com (www.LinuxDevices.com)


    In October 1999, LinuxDevices.com was launched. Calling themselves“the embedded
    Linux portal,”LinuxDevices.com has some good information about using Linux in
    embedded applications. The site features news, articles, polls, forums, event
    and job listings, product information, and a links page.


    # All Linux Devices (www.AllLinuxDevices.com)


    All Linux Devices describes itself as “Your Daily Source for Embedded Linux Information.”The
    site posts and releases directly related to embedded Linux. It features a talkback
    section, user contributions, and “triggers” that will email you when a categorized
    piece of news is posted to the site.


    # The Embedded Linux Consortium (www.embedded-linux.org)


    The Embedded Linux Consortium describes itself as follows:


    > The Embedded Linux Consortium (ELC) is a nonprofit, vendor-neutral trade association
    whose goal is the advancement and promotion of Linux throughout the embedded,
    applied, and appliance computing markets. Members contribute dues and participate
    in management, promotion, and implementation efforts, in return for a growing
    market opportunity for all.


    Their mission is simple:


    ...to make Linux a top operating system choice for developers designing embedded
    systems.'
