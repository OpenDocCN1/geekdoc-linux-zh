  md: '# Creating or Acquiring a Development Environment


    +   - Schulability. In a hard real-time operating system, a process can be scheduled
    to perform at a very precise time in the future or at a very precise interval.
    Again, the precision is down to the microsecond level instead of the millisecond
    level.


    +   - Stability under pressure. In a hard real-time system, the processor can
    become inundated with far more signals from different sources than it can handle;
