  md: '# Chapter 7 The Embedded Linux Workshop


    +   4. Install the Embedded Linux Workshop in the /usr/local directory:


    ```

    tar xvzf /tmp/elw-X.Y.Z.tgz

    ```


    The command above assumes that you downloaded the elw-X.Y.Z.tgz tarball into the
    /tmp directory.


    +   5. Remove the old elw symbolic link and create a new one that points to the
    directory you installed:


    ```

    rm -f elw && ln -s elw-X.Y.Z elw

    ```


    If you need to revert to a previous version of the Embedded Linux Workshop, you
    can just point this symlink back to the old version.


    +   6. Remove any old /usr/bin/elw links and create a new one that points to the
    elw script in the elw package:


    ```

    (cd /usr/bin && rm -f elw && ln -s /usr/local/elw/elw elw)

    ```


    # Your First Embedded Linux Workshop Project


    If you read this book through, by the time you''re done with it you will be quite
    tired of the Minicom program. I use it in several examples. The great thing about
    Minicom is that it doesn''t require the test bed machine to have any more hardware
    than a regular off-the-shelf PC—it just needs a serial port. And it actually does
    something useful!


    The preceding section walked you through the installation of the Embedded Linux
    Workshop. In this section, I''ll give you a step-by-step procedure to build a
    bootable floppy disk that will directly run Minicom.


    +   1. Change to the directory where you want your new project to live:


    ```

    cd ~yourhome/projects

    ```


    +   2. Use the elw command installed to create the new project. Several directories
    and files are created within the new minicom directory:


    ```

    elw --new minicom

    ```


    +   3. Change to the src directory:


    ```

    cd minicom/arch/i386/src

    ```


    +   4. Create a minicom subdirectory to store the source for Minicom:


    ```

    mkdir minicom

    ```


    +   5. Change to the new minicom directory.


    ```

    cd minicom

    ```


    +   6. Download Minicom from http://www.pp.clinet.fi/~walker/minicom.html. If
    it''s not there, try http://www.freshmeat.net to find it. If you have trouble
    downloading it, use http://ftpsearch.lycos.com to search for the filename, and
    then choose a site near from which to download. At the time of this writing, the
    latest version was 1.83.1.'
