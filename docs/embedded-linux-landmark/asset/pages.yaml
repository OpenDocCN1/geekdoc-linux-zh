  md: '# Chapter 1 Software Considerations


    After you''ve finally decided on your hardware platform, it''s time to nail down
    exactly what you want the software to do. This chapter presents several software-related
    issues you''ll need to consider.


    Note: If you want to support a soft modem (also known as winmodems), you can write
    the driver for Linux and install it as a module at boot time. Linux doesn''t like
    this, but admits that it doesn''t violate the GPL.


    # Embedded Linux Toolkits


    Porting Linux to a new hardware platform can be a daunting task. Fortunately,
    several embedded Linux toolkits are designed to simplify the job of building the
    binary that runs your device. Some toolkits, like Lineo''s Embedix and Monte Vista''s
    Hard Hard Linux, are broadly focused, and are able to work on many processors
    for lots of different applications. Others are from smaller companies and focus
    on narrower processor sets. Still others, as PeeWeLinux, are not products distributed
    by companies, but rather projects built by a set of like-minded hackers in the
    traditional Open Source model.


    Here are a few things to consider when you''re looking for an embedded Linux toolkit:


    +   - Hardware support. Does the Linux include support for the processor you want
    to use? If the toolkit doesn''t already support that processor, does the toolkit
    vendor have the ability to develop that quickly enough for your purposes? If so,
    how much will it cost? Does it fit in your budget?


    +   - Documentation. Is the toolkit well documented? Are all of the programs involved
    documented? Does the documentation cover both high-level concepts such as architecture
    white papers and low-level documentation such as how to build binaries, how to
    add your software to the code base, and reference manuals to the build and runtime
    software?


    +   - Adaptability. How adaptable is the embedded Linux toolkit to the particular
    application you''re going to use? If it''s a very narrow toolkit and you''ll use
    it for several projects, how much work will be involved in changing the toolkit
    to the projects for it''s not well suited?


    +   - Developer support. What kind of developer support does the toolkit company
    offer, and how expensive is it? If you need a bug fix, a question answered, or
    a device driver written, how quickly can you get a response from the company?
    Is there a listerv available for the users of the product? If one is available,
    how active is it? Is anyone from company answering questions on the list?


    +   - Field upgradeability. Are facilities available in the toolkit for upgrading
    the software in the field? Does the toolkit company offer means for delivering
    those upgrades, or is that left to you?'
  merge: -1
  pgno: 33
- img_proc: true
  md: '+   - User interface. If your application requires some sort of user interface,
    what are your options? Does the embedded Linux toolkit offer some sort of embedded
    video interface? If so, how much room does it take? If not, is there some sort
    of Web-based interface for configuration?


    Note that the Open Source projects may not have any support for a graphical interface.
    Several Web projects and several commercial products are aimed at building small-footprint
    graphical user interfaces. For more information, see http://www.linuxdevices.com/articles/AT9202043619.html.


    +   - Track record. Does the toolkit vendor have any examples of customers who
    have created a similar product out in the field? How successful was that vendor
    with the toolkit?


    # Kernel Features


    Linux kernel runs on a vast array of hardware architectures—everything from handhelds
    to mainframes. To support this sort of scalability, the kernel is highly configurable.


    There are several ways of configuring the kernel (note that I''m using the word
    configure quite loosely):


    +   - Typing make config, make menuconfig, or make xconfig in the root of the
    kernel source runs the standard kernel routines. You can turn options on or off
    to compile them as modules so they can be loaded at runtime.


    +   - There are hundreds—perhaps thousands—of kernel patches floating around the
    Internet. Some are very small—enough to fix a small bug in one file. Medium-size
    patches may affect a half-dozen files and add support for a particular hardware
    device. Large patches add or affect dozens of files and add support for new architectures.
    Often applying a patch adds new questions or entire screens to the kernel-configuration
    screens previously described.


    +   - The True Method of “configuring” the kernel to do exactly what you want
    is to hack on it yourself. Until recently, this was an exercise only for those
    who have time and patience—the Linux kernel source code is well structured but
    obtuse. Linux does not believe in cluttering up the source with comments for the
    uninitiated (see Chapter 5 of Documentation/Coding Style in the Linux source).


    Fortunately'
