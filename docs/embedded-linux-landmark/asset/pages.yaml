  md: '# 3


    # Software Configuration


    CONFIGURING A NEWLY INSTALLED LINUX COMPUTER based on a standard distribution
    is a time-consuming task. Yet, if you''re going to use that computer on the Internet,
    it is crucial that you configure it correctly. If you leave lots of default services
    running with weak or nonexistent security, it''s just a matter of time before
    some cracker gets into your box and defaces it—or worse, destroys it.

    The author speaks from experience.


    # Be Selective About Software


    One day, during the summer of 2000, with my son in the hospital and a project
    at work falling apart, I got an email from my Internet service provider saying,
    in effect, “Don’t look now, but your server has been cracked.” Sure, some cracker
    replaced the home page on my two-week-old Red Hat 6.2 system with a long diat
    extol the virtues of the Esperanto language, complete with pointers to www.esperanto.org
    so I could find out more. Since I was running between work and hospital and home,
    I really didn''t have time to fix things properly, so I just changed all the passwords
    on the system and removed the cracker''s new home page.

    That just made him.

    A week later, I found that the Web server would no longer work at all. The cracker
    got in again, built numerous backdoors into the system, and tweaked things so
    that the'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Chapter 3 Software Configuration


    Web server wouldn''t start. He changed the definition of /null so that when Apache
    read from it, it would block. This took a while to find, and would have been almost
    impossible without the trace command. (By the way, if you''re a developer and
    have never used trace, you''re missing out on a powerful debugging tool.)


    This time I got serious about down the machine. I completely reinstalled Linux
    and all the software to the newest, most secure versions. Almost as important,
    I reviewed each software was the computer was running, and disabled the ones I
    didn''t need. When I was done, the machine had no open TCP or UDP ports.


    The moral of this story is that it was crucial to choose wisely the software that
    will run on your embedded system. Only ship the software that you need to run,
    and be sure to configure it properly. Don''t simply use the default configuration
    files that ship with server software; they''re often set up so it''s easy to get
    the software up and running by ignoring the security issues.


    > Tip: One of the best resources for securing a Linux system is David Ranch''s
    TrinityOS. See www.couchouch.edu/-dranch/LINUX/index-linux.html#trinityos for
    details.


    # Dealing with Software Expectations


    In an embedded environment, making choices about the software that runs on your
    device comes somewhat naturally—you''re very concerned about how much space your
    software takes up, so you probably don''t have a lot of extra servers clogging
    the boot flash anyway.


    But configuration is a different story. In general, configuring a Linux system
    is difficult. Each system usually wants its own configuration file. Each configuration
    file has a different syntax. Many configuration files want to live somewhere in
    the /etc tree, but others don''t. For all of these reasons, replicating a Linux
    system is especially difficult—where do you get all the files?


    Configuring an embedded system addresses all these issues and adds a few of its
    own. Each program that runs on the embedded device expects to find its configuration
    file in a certain location in the directory tree. Some locations may not be writable
    because they live in a read-only filesystem. Others may be in a RAM filesystem,
    so any changes will be lost during the next reboot. Writing several configuration
    files to flash memory implies that a filesystem must be on flash, which adds complexity.


    # Symlinking Configuration Files


    The solution to configuration files being spread across many directory trees is
    fairly easy; for each configuration file, create a symbolic link pointing to a
    file in a single directory that houses all the configuration files. A good name
    for this directory is /config.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Dealing with Software Expectations


    For example, let''s say that your application needs to be able to change the values
    stored in the resolv.conf and syslog.conf files as part of its normal operations.
    Both of these files normally reside in the /etc directory. However, the /etc directory
    also contains many files that you''ll never need to change but do need to exist,
    such as the hosts and services files. Instead of storing the contents of resolv.conf
    and syslog.conf you can simply create symlinks called /etc/resolv.conf and /etc/syslog.conf
    that point to /config/resolv.conf and /config/syslog.conf, respectively.


    This concept is quite powerful The config directory can be mounted on a different
    device from the root of the root filesystem. This way, the root can consist of
    a smaller read-only filesystem, and the /config filesystem can live in flash and
    read/write. Each configuration file looks like it lives where the server expects
    it to be, but it can be changed at will by the configuration software.


    The Embedded Linux Workshop takes this one step further. Instead of having multiple
    configuration files in one read/write directory, there is a single configuration
    file that can either live in one read/write directory or, using a simple kernel
    driver, in flash memory. There are several advantages to centralizing the configuration
    information to a single file:


    +   - You do not have to have a full flash filesystem to store a single file.


    +   - Your configuration software doesn''t have to understand how to modify all
    the different types of configuration files in existence. Most configuration files
    are meant for humans to modify, not computer programs, so they''re difficult to
    change programmatically.


    +   - A single configuration file makes replicating an embedded device simple—copy
    a single file from one machine to the other.


    +   - A simple name=value structure works for most situations. This structure
    is easily understandable by humans and easily parsable and modifiable by computers.


    # Resolving Software Expectation Conflicts


    There''s still one problem with this approach; the software programs that require
    the configuration files expect to be in a certain form. The syslog program, for
    example, won''t know what to do with the name=value syntax used by the Embedded
    Linux Workshop''s single configuration file.


    There are basically two approaches to resolving this problem:


    +   - Modify the programs so that they can use the single configuration file directly.


    +   - Using the information in the single Embedded Linux Workshop configuration
    file, create the configuration file(s) that the program expects to see.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'For the most part, I use the second approach for the Embedded Linux Workshop.
    I believe that the fewer changes made to the individual components of an embedded
    project (syslog, for example), the better. Here''s why:


    +   - If it was working when you got it, and you didn''t touch it, it should still
    work in the field.

    - Changing software as syslog is difficult and error-prone if you''re not already
    familiar with the software. However, creating the syslog.conf file with name=value
    pairs from the single configuration file is relatively easy.

    - If you change the syslog software to read its configuration information directly
    from the single configuration file, that''s a substantial change that you''ll
    have to keep track of forever. If you need to upgrade to a later version of syslog,
    fixing any problems in software you may not have seen for a while. On the other
    hand, if you use the second approach—creating the configuration file(s) that the
    software expects to see—and the configuration file syntax has not changed in the
    new version, you have no work to do when you upgrade versions.


    There are a drawbacks to building the configuration file(s) that the software
    expects to see after changing the software to use the single configuration file.
    First, your boot time will be slower than it could be. Probably by much, but still-slower.
    Second, the custom configuration file will take up more room on your embedded
    device. The software to create the application-specific configuration file and
    the configuration file itself take up room that may be extremely valuable, depending
    on the size of your embedded device. You can normally remove the application-specific
    configuration file once the software needs it is finished reading, but doing so
    adds complexity to your setup code.


    There is ample precedent for using a single configuration file for the entire
    computer. The most well-known example of this approach is the Registry in Microsoft
    Windows. Even with all its shortcomings, the Windows Registry has made life easier
    for developers and users by moving all configuration information to a central,
    searchable location. To get an idea of how the single-configuration file concept
    works in practice, let''s take a look at two examples from the Embedded Linux
    Workshop: the network setup code and the resolver setup code.


    When the machine boots, in initrd the first user space code is a script named
    linux. The job of this script is to set up the runtime environment. Part of that
    setup code calls each of the startup scripts for the various packages, like the
    /etc/rc.d/rc3.d scripts in a Red Hat system. Listing3.1 shows the code within
    linuxrc that runs the startup scripts.'
