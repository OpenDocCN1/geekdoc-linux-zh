  md: '# Using BlueCat Linux


    +   1. Obtain root privileges to your machine.


    +   2. As root, enter the following command to create a bluecat directory within

    /tmp/


    ```

    mkdir -p /tmp/bluecat

    ```


    The BlueCat tarball contains multiple files and directories in the root (naughty).
    By putting all these files into an empty directory /tmp , you can easily delete
    them after install.


    +   3. Now''s download the x86-linux.tar.gz file from the Blue Web site with the
    following command:


    ```

    cd /tmp/bluecat; lynx http://www.LynuxWorks.com/...

    ```


    At 70MB, it will take a bit of time.


    +   4. Extract xvzf x86-linux.tar.gz


    ```

    tar xvzf x86-linux.tar.gz

    ```


    When this process is finished, you''ll have an install script and a BlueCat_i386
    directory.


    +   5. Create the bluecat user:


    ```

    adduser bluecat

    ```


    You can put the software somewhere else if you prefer.


    +   6. Change to the bluecat user:


    ```

    cd -bluecat

    ```


    +   7. Create a bluecat directory within the bluecat user''s home directory and
    cd to:


    ```

    mkdir bluecat ; cd bluecat

    ```


    I tried to install the BlueCat software directly into the bluecat user''s home
    directory, but the install script will only install into a directory with no other
    files. Users home directories have lots of junk in them, which will prevent installation,
    so using a subdirectory is a requirement.


    +   8. Install the BlueCat software with this command:


    ```

    /tmp/bluecat/install

    ```


    When the install completes, you''ll have nine new directories and a setup script
    in the -bluecat/bluecat directory. The directories (bin, boot, cot, demo.x86,
