  md: '20. We have to make a small change to the Minicom source code to make sure
    that it works properly in our mini-environment. Change to the minicom source ndirectory:


    ```

    cd minicom/src

    ```


    21. Let''s remove a Minicom security feature that is unnecessary in an embedded
    application. In minicom.c search for the following line:


    ```

    if (real_uid == 0 && dosetup == 0) {

    ```


    Delete 61 lines—to, but not including this line:


    ```

    buf[] = 0;

    ```


    If these lines are not removed, Minicom will bail out at this point. Since we
    don''t have to be concerned with permissions and correct users in our embedded
    environment, it''s safe to skip this code.


    22. Save your changes.


    23. BlueCat comes with all of its libraries for the target environment, but the
    free version doesn''t come with the ncurses library installed, so we''re going
    to cheat a bit:


    ```

    vi Makefile

    ```


    Search for the following line within a group of assignments that we''re compiling
    for Linux with libcurses:


    ```

    LIBS = -lncurses -lcurl

    ```


    Change the line to read as follows:


    ```

    LIBS = -l /usr/lib -lncurses -lcurl

    ```


    We could have downloaded the ncurses library from the Internet and built it using
    the BlueCat build tools in a separate directory, then linked with it. If you''re
    building a real embedded device, that''s exactly what you should do. But that
    procedure takes a dozen more steps and adds little to the book, so instead I''m
    showing you how to take advantage of the fact that our host environment is the
    same as our target environment; we can just use the ncurses library''s installed
    with the host environment. This is handy if you want to kludge something (as long
    as you fix it later).


    24. Back to Makefile:


    ```

    vi Makefile

    ```


    Find the following line:


    ```

    minicom: $(MOBJS)

    ```


    Insert the text -static before the text -minicom on the next line. We need to
    make the minicom executable static because BlueCat won''t use the shared ncurses
    library from the host machine.


    25. Now make the minicom executable file:


    ```

    make

    ```'
