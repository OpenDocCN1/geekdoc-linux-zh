- img_proc: true
  md: '# Debugging Tools 43


    # print() and printk()


    Eventually, you will have to stop developing on your host machine and start developing
    on the target. On the target, you will usually be pretty limited in the debug
    tools available to you. You may get lucky and have debug hardware that allows
    you to single-step your software using gdb or some other debugger, but this won''t
    always be the case. Eventually, you''ll get to the point where you need to debug
    code running at full speed in a limited environment. The best way to do that is
    to pepper the code with printk() (depending on whether you''re debugging application
    code or kernel code). Using this debug style is pretty straightforward, but it''s
    sometimes missed as the easiest way to localize a problem.


    # syslog()


    Related to print() and printk(), described in the preceding section, is syslog().
    syslog() sends a string to an error-logging process on the current machine or
    another machine. It''s especially handy when you''re debugging a problem on a
    target machine on which you don''t have a command shell. You can instruct syslog
    to send debug messages to your host machine, where you can readily view them.


    # LEDs


    What do you do if you don''t have a display or serial port or network connection?
    Hopefully, you have one or more LEDs that you can light up software. This is a
    painful way to debug software, and can be quite time-consuming—but it has been
    done, and if there is no better way...


    # expect


    Most software development projects result in two sets of software: the application
    software that answers the problem at, and a test suite that verifies the application
    software. The test suite is usually in the form of numerous small programs and
    scripts, each of which checks an individual aspect of the application software,
    returning a passing/fail result. Many of these little programs and scripts are
    written so that, as bugs are squashed, they test for the reappearance of the bug.
    As the project progresses, the developer often runs the test to make sure the
    software is not sliding backward. This is called regression testing.


    It quickly becomes cumbersome to run each test individually, so they must-how
    be scripted. However, the script normally runs on a machine separate from the
    target machine in an embedded environment, so how can you get the tests to run
    and verify the results over a serial or network link?'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'One powerful tool for scripting these tests and verifying their results is
    expect.

    From the man page:

    expect a program that “talks” to other interactive programs according to a script.
    Following the script, expect knows what can be expected from a program and what
    the correct response should be. An interpreted language provides branching and
    high-level control structures to direct the dialogue. In addition, the user can
    take control and interact directly when desired, afterward returning control to
    the script.

    Using expect, you can build a script that connects to the embedded box, runs each
    diagnostic test and verifies each result. If a problem occurs, you can leave the
    connection open and run the test or check the status yourself.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 10


    # Embedded Linux Success Stories


    CURRENTLY LINUX IS EMBDED IN SEVERAL SUCCESSFUL PRODUCTS, with more being announced
    every day. This chapter briefly introduces a few of the more interesting products
    that are actually on the market that use Linux as the operating system.


    One of the interesting things to realize about these products is that Linux relates
    to a mere footnote or not mentioned at all in the product literature—there''s
    no “Linux Inside” sticker stamped on the side. From a marketing standpoint, the
    fact that Linux is used in the product is a non-issue.


    # TiVo (www.tivo.com)


    The first commercially successful embedded Linux device is TiVo, which lets you
    digitally record television programs and play them back whenever you want.


    TiVo works like this: Late at night, uses its built-in modem to call a central
    TiVo server, which contains all of the programming information for the next few
    days. You are then able to tell TiVo program(s) you want to record. It records
    the program(s) and stores the data on a built-in hard drive, and you can play
    back the recorded show whenever you want.


    TiVo also allows you to “pause” live television. That is, you can press a key
    on your remote, and the current program will be recording you. Then you then press
    the button to begin watching the recorded show. Similarly, you can “rewind” live
    TV. The TiVo is always recording the last 30 minutes of whatever you''re watching,
    so you can always rewind whatever you''re watching... neat.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Specifications


    While the TiVo is an embedded Linux device, it doesn''t suffer from the restraints
    of many other embedded devices. There''s a lot of room for software on the hard
    drive, where the recording software itself resides. Even so, the TiVo designers
    chose some interesting hardware. Much of the following information came from the
    TiVo FAQ (http://www.tifovaq.com/hack/faq.html).


    +   - Processor: IBM PowerPC 403GCX

    - Video decoder/scaler: Philips SAA7114H

    - Sound processor for analog TV signals: Miconas MSP 3430Ga4

    - Video encoder YUV to NTSC or PAL: Philips SAA7120H

    - MPEG audio/video decoder: IBM CS22PFJ22C

    - MPEG-II clock synthesizer: ICS MK2745-265

    - V90/K536flex/V.34 modem data pump: Conexant RP336LD

    - Micro controller for modem chip: Rockwell P39X

    - 16 bit DSP: Analog Devices ADSP-2183

    - MPEG-II video encoder: Sony CXD1922Q


    # Diamond Riocar (www.riohome.com)


    The Riocar audio player is a digital music player that you mount inside your car''s
    dashboard just like a regular car radio. It can store more than 1,000 hours of
    MP3 music—that''s enough music to keep you entertained if you ever decide to circumnigate
    the world in your car. Two and a half times.

    The files are loaded from your PC using your serial port, a USB cable, or Ethernet.
    An FM tuner is also available.


    # Specifications


    Much of this information comes from the Linux Reviews at http://www.linuxdevices.com/articles/AT5630105143.html.


    +   - Processor: Intel StrongARM 200 MHz

    - HD space: Two 2¹/2-inch laptop drives

    - Memory: 12MB

    - Flash: 1MB

    - DSP: Phillips SAA7705H

    - Pre-amps: Burr Brown'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Axis Network Camera (www.axis.com)


    The Axis Network Camera is a video camera and Web server all contained in a pack-age
    no bigger than a standard handheld camcorder. Plug one side into your LAN,point
    the other side at an an object to display on the network, and voilà, instant video
    server.


    # Specifications


    Axis has a good Web site for their products. The information below is from the
    datasheet on the Axis 2120 Web camera at http://www.axis.com/documentation/datasheet/2120/2120ds.pdf.


    +   * Processor: AXIS ETRAX-100

    * Memory: 16MB

    * Flash: 4MB

    * Image compression: AXIS ARTPEC-1


    # Summary


    In addition to commercial applications, there are many research projects, machine
    shop automation projects, and so on that embed Linux into hardware other than
    the ubiquitous desktop form factor. For instance, take a look at the data acquisition
    system controller used by NASA to hunt hurricanes (see http://lidar.wff.nasa.gov/sra/ij98/).'
  merge: -1
