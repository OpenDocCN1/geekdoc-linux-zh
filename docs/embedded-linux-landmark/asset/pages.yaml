    The mkboot command is part of the BlueCat distribution. It creates a bootable
    image on the specified device (/dev/fd0) from the parts created by the make command.
    The minicom.disk file is a copy of zimage from the kernel in -bluecat/bluecat/usr/src/linux.
    The minicom.fs file was built by BlueCat''s mkrootfs during the make. One problem
    with the mkboot command is that it might output to a real device if you use the
    -b option. This is a problem if you use hardware emulation software as VMware
    and never actually create a real floppy disk. For example, when testing BlueCat,
    I had to build a real floppy disk with the mkboot command and use the dd command
    to pull the image off the floppy and send it to a file.


