    # BlueCat Linux Pros and Cons


    We now turn to our list of questions to ask any embedded Linux toolkit to see
    how BlueCat Linux stacks up to the competition.


    # What is the size of image produced?


    Like PeeWeeLinux, examined later in this chapter, BlueCat suffers from the use
    of glib as its C library. This makes it difficult to put a lot of functionality
    into an embedded device with less than 2MB of storage. However, BlueCat can fit
    more on the floppy disk than PeeWeeLinux, since it doesn''t use syslinux to boot.'
