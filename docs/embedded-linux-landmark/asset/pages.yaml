  md: '# Chapter 5 Hardware Considerations


    # Custom Design


    If your search for a ready-made hardware platform fails to turn up any promising
    or suitable, or if your volume and cost requirements warrant going into full production,
    you may have no choice but to design it. Obviously, this approach yields the utmost
    in flexibility but provides the greatest risk as well as many challenges. You
    can design the hardware yourself if you have the in-house talent, or you can hire
    a consultant to do the designing.


    # Processor Choices


    Because Linux has been ported to virtually every processor type and family, it''s
    unlikely that you''ll have to start from scratch and do all the work yourself.
    This also means that the available choices in terms of performance, cost, power
    consumption, and peripheral functions are nearly unlimited, and you won''t be
    forced to make compromises just to accommodate some obscure processor family.


    It''s very important to do your homework on the processor you choose. For instance,
    it''s much easier to work with a processor that has a memory management unit (MMU)
    than a processor without one. A memory management unit provides different addressed
    spaces for the kernel and each process, enforces memory protection, and provides
    for virtual memory. Without an MMU, these desirable features simply don''t exist.


    The unix kernel fork was created specifically so you can use the MMU-less processors,
    but if your application programs behave quite differently when running in an MMU-less
    environment. For instance, because you can change any part of memory, including
    kernel memory, it''s quite easy for your application to completely freeze an MMU-less
    processor.


    # Storage Choices and Memory Requirements


    Perhaps the biggest concern to be addressed concerns memory requirements—type,
    and partitioning. Linux will never be as compact as the commercially available
    embedded OS products, but the price to pay for obtaining the power and flexibility
    that Linux offers. Besides, these days product costs continue to decline as memory
    and storage capacities increase.


    Typical embedded Linux products are partitioned much like their desktop counterparts,
    in that there is usually a small amount of dedicated boot and configuration memory
    (BIOS), an area of main memory and solid-state storage that replaces the usual
    drive. Because of its UNIX heritage, the simplest way to adapt Linux is to retain
    a disk-like device and file structure. The most common way this is accomplished
    is to use flash memory, which emulates a drive—for example, the DiskChip or CompactFlash
    devices, which provide an IDE interface.'
