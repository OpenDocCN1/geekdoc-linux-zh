  md: '# Chapter 1 Software Considerations


    downloads the new software directly on top of the old software and this process
    takes 20 seconds, you have a doorstop time of 20 seconds. If the customer''s power
    is lost, a cable is kicked loose, or the cat jumps onto the keyboard any time
    this 20 seconds, your customer now has a doorstop—plus, they''re angry, and it
    will cost you money.


    Now imagine that you have 2/1 times the amount of flash that you really need in
    the device (the extra 1/2 is for growth). Instead of overwriting the old code
    with the new, you store it in the extra room in the flash as it''s downloading.
    When all the code is safely written to flash, you then change a few pointers to
    complete the update. Now your “doorstop time” is just a few milliseconds, while
    the pointers are updated in flash.


    This procedure has other advantages. After all the new software has come across,
    you can make sure that the binary image is intact by including some checksum code.
    You can also make sure that the user has downloaded the right thing and has a
    later version than the one currently installed. None of this is possible if you
    overwrite the current software with the new as the download occurs.


    +   3. Put all the configuration information for your machine in a single place,
    such as a single file in flash. This makes all your software much easier to manage.
    because there''s only one file to manage (and perhaps change) during the upgrade
    process. Remember that you may have several versions out in the field, and you
    don''t want to force users to move from a very old version to the newest version
    by upgrading through each version in version. If your software changes a lot between
    releases, the permutations can become enormous quickly, so keeping things as simple
    as possible helps the user avoid losing configuration information.


    Of course, there are many ways to accomplish this objective. Above is more costly
    on a per-unit basis than simply putting everything in flash memory. Depending
    on your application and economies, it may make more sense to put everything in
    flash—just realize that in some instances you could end up with a lot of doorstops
    out in the field.'
