  md: '# Input/Output


    There are many choices for I/O devices as there are embedded systems. Your application
    will determine what type of I/O devices you need. Fortunately, a veritable army
    of Linux programmers have had years to develop and refine the necessary device
    drivers to support nearly any hardware imaginable. Probably the best example can
    be seen in the large number of network controllers supported. Chances are good
    that if a peripheral function exists on silicon, someone has already written the
    supporting code. Significantly, this includes the component manufacturers themselves,
    as Linux has become a major force in the marketplace in recent years.


    If your requirements are very simple (for example, a few LEDs and switches), chances
    are good that you can use a low-cost parallel port by slightly modifying the drivers.
    Some very simple systems require no I/O at all. A device with no I/O probably
    not be very useful, such devices are possible, unlike Windows, which have no set
    hardware requirements. Therefore, the choice is entirely up to you.


    # Display


    As mentioned previously, Linux doesn''t require any particular type or format
    of display device to be present, but—at for debugging and development purposes—you
    probably want to consider some form of display. It need not be very elaborate,
    often consisting of nothing more than a serial port that can be connected to a
    PC in terminal mode.


    For dedicated displays, which are sometimes required, you can use inexpensive
    LCD or vacuum fluorescent (VF) displays, which use a common parallel port; various
    examples and drivers are available. For more sophisticated needs, graphics controllers
    intended for PCs are readily available and inexpensive.


    # Summary


    Choosing the proper hardware for your embedded Linux device doesn''t have to be
    a nightmare. Choose your overriding design goal: better, faster, or cheaper. Once
    you''ve done that, the rest of the questions should be a lot easier. Do you want
    to buy or build? And exactly what hardware do you want to use?'
