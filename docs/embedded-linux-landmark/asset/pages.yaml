  md: '# Files


    The Build image menu entry created several new files in the obj subdirectory:


    | File | Description |

    | --- | --- |

    | obj/image | An image of the bootable 1.44 MB floppy disk. If you used the dd
    command to copy this file to a floppy disk, it would boot into Minicom. |

    | obj/imageroot/* | Contains all files used to build the obj/image file. These
    are the files that actually need to get to the DiskOnChip. |

    | obj/imageroot/banner.txt | This file is displayed on the console as the image
    boots. The file is built once by the elw--newproject command. Once built, it can
    be modified to display what you want to see. The source of this file is in mnt/banner.txt.
    |

    | obj/imageroot/bzImage | This file is the Linux kernel. It''s copied directly
    from within the kernel you built in the preceding procedure. |

    | obj/imageroot/ldlinux.sys | The meat of the SYSLUX bootloader. It copies the
    kernel from the boot media into memory and executes it. |

    | obj/imageroot/readme | A short file that tells what''s on the image. It''s built
    once by the elw--newproject command. Its source is in mnt/readme. |

    | obj/imageroot/rootfs.gz | Contains the initrd filesystem. This is the runtime
    filesystem of any ELW project. SYSLUX uncompresses it into memory as it loads
    from the boot media. |

    | obj/imageroot/syslinux.cfg | Tells SYSLUX how to boot the media. It''s built
    once by the elw--newproject command. Normally you shouldn''t have to change it;
    its source is in the mnt/syslinux.cfg file. Look to the SYSLUX documentation for
    more information about this file.'
  merge: -1
