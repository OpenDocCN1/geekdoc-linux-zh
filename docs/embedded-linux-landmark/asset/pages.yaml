    The Elwa River featured on the cover of this book is located in Olympic National
    Park—a World Heritage Site and Biosphere Reserve. The river originates on a snow
    finger of the park''s mountainous core and flows north into the Strait of Juan
    de Fuca.


    Historically, the Elwa was one of the largest producers of salmon and steelhead
    on the Olympic Peninsula. However, construction of two dams in the early 1900s
    prohibited fish passage to more than 70 miles of the river and its tributaries—reducing
    fish runs and disrupting the ecosystem.


    In recent years, the river has been the focus of conservation groups. In 1992
    Congress enacted the Elwa River Ecosystem and Fisheries Restoration Act of 1992,
    authorizing the Secretary of the Interior to buy and remove the dams and fully
    restore the ecosystem and native fisheries. Sadly, the dams remain in place, as
    recently passed legislation requires cost/benefit analysis to be conducted before
    new environmental regulations are adopted. Environmentalists believe that removal
    of the dams could result in the return of 400,000 salmon and steelhead within
    30 years.


    For more details on the Elwa River and plans for its restoration, see http://www.nps.gov/olym/issues/isselwha.htm.


    This book was written primarily on Red Hat Linux using vi. It was edited in Microsoft
    Word and laid out in QuarkXPress. The font used for the body text is Bembo and
    MCPdigital. It was printed on 50# Husky Offset Smooth paper at R.R. Donnelly &
    Sons in Crawfordsville, Indiana. Prepress consisted of PostScript computer-to-plate
    technology (filmless process). The cover was printed at Moore Langen Printing
    in Terre Haute, Indiana, on Carolina, coated on one side.'
