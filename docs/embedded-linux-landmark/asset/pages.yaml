  md: '# Software


    +   **Linux distribution.** Choose your favorite Linux distribution. I personally
    like Red Hat, but any choice should be fine.

    * **Professional choice.** If you''re developing software for a living, it pays
    to have the best equipment possible. The most valuable asset of professional developers
    is time, and saving time is usually worth the cost. When analyzing what steps
    a developer actually goes through during the development process, you''ll usually
    find that a large block of time is spent in the debugging cycle during active
    development. (See the next section for more on the debugging cycle).


    # Debugging Your Application


    When applied to an embedded Linux application, the term *debugging cycle* refers
    to the steps necessary to build the software, move it to the workbench machine,
    boot the workbench machine under the new version, and get the running software
    to the point where you''re currently developing or debugging. The shorter the
    debugging cycle, the faster you can develop. In a typical environment, you may
    end up running the debugging cycle several dozen times in a given day, so it''s
    worth to spend some time and mentoring the debugging cycle.


    Sometimes debugging cycles can be really short; the best case is when you''re
    using an interpreted language. You save the code and run the application right
    away. Other times you may have to do some time-consuming task such as burn the
    code into a PROM before the debugging cycle is complete.


    When developing any embedded application, the most time-consuming activity is
    usually waiting while the computer creates the boot media, and then waiting again
    for media to load on the workbench computer. I''ve found that the best way to
    shorten this debugging cycle is to use a product such as VMware and run the software
    on a virtual machine within the development machine. That is exactly I did to
    develop the sample applications for this book. Before using VMware, I had to create
    floppy disk images and then the Linux `dd` command to dump the images out to a
    floppy drive. After that was done, I would take the floppy out of the development
    machine and boot the workbench computer from it. The entire cycle took about five
    minutes, from the time I was then editing source to the time I was running the
    application, limiting me to about 12 rebounds an hour. I don''t have to move any
    media from place to place; the build script takes care of moving the image to
    the proper place for VMware. I just run the build script and power up the VMware
    machine when the image is ready. The whole process takes just under 11/2 minutes,
    allowing me to do more than 40 rebounds per hour.'
