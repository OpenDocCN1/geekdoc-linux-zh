  md: '# Upgrading the Software in Place


    However, a tradeoff exists between engineering time and footprint size. Generally,
    the longer you engineer the product, the smaller and more efficient you can make
    it, reducing your memory requirements, and thus reducing the cost of each unit.
    However, the more time you spend on efficiency, the fewer features the product
    will have, given constant engineering resources. Also, if the product sits in
    engineering too long, you may lose considerable market advantage to your competitors.


    # Reducing the Software Footprint


    How do you reduce the memory/storage requirements of your embedded application?
    Generally, there are three ways:


    +   - Include only the software you need.

    - Compile the software to reduce size.

    - Compressing the software.


    Chapter 2, "Minimal Linux," details how to reduce the size of your embedded application.


    # Upgrading the Software in Place


    Most software systems must be upgraded at some point in their lifetime for a variety
    of reasons: bugs and security vulnerabilities are found and fixed, new features
    are required, and so on. Embedded applications are no exception. However, if upgrading
    is not designed from the beginning, the upgrade process will be difficult or even
    impossible. For instance, unless you want your customers to do minor surgery on
    your embedded device, you shouldn''t ship the software in ROM. The only way to
    replace software that''s in ROM is to replace the ROM chip. Also, if you have
    only enough memory-plus-storage in the device to actually run the application,
    upgrading is very dangerous because there is no good place to put it. You can
    download the new code over the old code, but one small error and your customer
    now owns a doorstop inside of an embedded Linux application.


    So how do you design your upgrade process from the beginning?


    +   1. Start by putting the only low-level code in ROM and putting the rest in
    flash. The code that''s in ROM will probably never be replaced, so you have to
    get it right. You may want to put the upgrade code itself in ROM; that, no matter
    what happens in the field, the user can "upgrade" to a working set of code even
    after messing up an upgrade attempt.

    2. Configure the machine with enough RAM to hold two complete copies of the software
    in the machine simultaneously. Unless you put the upgrade software in ROM as described
    above, your application will become a doorstop if a catastrophic event occurs,
    such as loss of power. You want to reduce this "doorstop time" to the minimum
    possible. For instance, if your application'
