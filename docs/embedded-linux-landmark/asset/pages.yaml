- img_proc: true
  md: '# BlueCat Linux 67


    +   - How many optional packages are available?

    - What exceptional packages are available? (Web-based administration, perhaps)

    - How customizable is the image? How difficult is it to customize?

    - How much does the toolkit cost? Is a royalty involved?

    - How well is the toolkit documented? Is printed documentation available?

    - How well is the toolkit supported? Paid support? Active support?

    - What are the requirements to use the toolkit?

    - Can a new version of the toolkit be installed without losing changes?


    To test the toolkit, I tried to build a single floppy x86 boot disk that would
    run the Minicom application (for more on Minicom, see Chapter 8, "Static Application
    Example: Minicom").


    # BlueCat Linux from LinuxWorks

    (www.LynuxWorks.com)


    LynuxWorks'' BlueCat Linux Version 3.0 is a professional embedded Linux toolkit
    that''s fully documented, supports a broad range of target hardware, and is freely
    downloadable (although you have to agree not to develop commercial applications
    for the freely downloadable version). The software is distributed on several CDs—one
    for all of the source code, and for each architecture.

    LynuxWorks'' CDK includes the following items:


    +   - Compilers for C, C++, and Java

    - Hooks for the GDB debugger

    - Performance measurement tools

    - A small set of network tools and applications


    The following host processor families are supported:


    +   - Intel IA-32 (x86)

    - PowerPC

    - PowerQUICC

    - ARM/ARM7/ARM9/StrongARM

    - Super-H

    - MIPS R3000/R4000


    The following host operating systems are supported:


    +   - Red Hat 6.1 and 6.2

    - TurboLinux Workstation, version 6.0

    - Windows 98/NT/2000'
