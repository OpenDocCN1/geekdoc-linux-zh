  md: '# Download Minicom


    Minicom is a serial communications program originally written by Miquel van Smoorenburg.
    It''s a like the old MS-DOS programs PROComm and Telex, which were used by many
    people in the days before the Internet to connect to bulletin board systems with
    a serial modem. It can also be used to connect a PC to devices such as routers
    and switches for initial configuration.


    Minicom is a powerful program with a lot of configuration options. Help is available
    using the Alt+Z key sequence. It will be helpful to read the man page for Minicom
    on the system you build the floppy disk, to familiarize yourself with Minicom''s
    features. For instance, a Minicom configuration could be added that enables Minicom
    to save its dial list to the floppy disk, so the dial list would be kept through
    reboot.


    Download the source code for Minicom from www.pp-clinet.net/walker/minicom.html.
    If it''s not there, use www.freshmeat.net to find it. If you have trouble downloading
    it, use http://ftpsearch.lycos.com for the filename, and pick a site near you
    to download from. At the time of this writing, the latest version was 1.8.3.


    Caution: Be careful when downloading files that end in .gz with Netscape. You
    should shift-click or right-click and Save As when attempting to download the
    files in this section. See the Netscape documentation for more information.



    If you want to build a boot floppy for some other simple, single-binary application,
    you could download that instead.


    # Download SYSLINUX


    The documentation for SYSLINUX describes it like this:


    # SYSLINUX Is


    SYSLINUX is a boot loader for the Linux operating system which operates off an
    MS-DOS/Windows FAT filesystem. It is intended to simplify first-time installation
    of SYSLINUX, and for creation of rescue and special-purpose boot disks.


    SYSLINUX can be used, when properly set up, [to completely eliminate the need
    for distribution of raw disk images for boot floppies. A SYSLINUX floppy can be
    manipulated using standard MS-DOS (or any other OS that can access an MS-DOS filesystem)
    tools until it has been created.


    # What SYSLINUX Is Not


    SYSLINUX is probably not suitable as a general purpose boot loader. It can only
    boot Linux from a FAT filesystem, and not, for example, ext2. a native Linux implementation
    will typically use ext2, another boot loader (e.g. LILO) is probably more suitable.
    In a system which actually contains DOS or Windows, may be simpler to use. However,
    SYSLINUX has shown itself to be quite useful in a number of special-purpose applications.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 8 Static Application Example: Minicom


    Download the latest version of SYSLINUX from ftp://ftp.kernel.org/pub/linux/utils/boot/syslinux.
    At the time of this writing, the latest version was 1.48. It''s also possible
    to use GRUB or LILO, but SYSLINUX is a bit easier.


    # Download the Linux Kernel


    Download the current production Linux kernel from ftp://ftp.kernel.org/pub/linux/kernel.
    At the time of this writing, the latest version was 2.2.19. It doesn''t really
    matter which version of the kernel you use for this exercise. Anything from 2.0
    through 2.4+ should work fine.


    # Untar the Files


    Use the following commands to untar the minicom and SYSLINUX files and the Linux
    kernel:


    ```

    tar xzf minicom-1.83.0.src.tar.gz

    t xzf syslinux-1.48.tar.gz

    t xzf linux-2.2.15.tar.gz

    ```


    If you''re using different versions, substitute the correct filenames in the commands
    above. When you''re done, there will be a new directory named linux.


    > Tip: When untaring, change xzf to xvzf if you want to see the files that are
    created.


    > Caution: Be very careful not to blow away your current sources if you already
    have a linux directory. Normally, as soon as I untar a kernel I rename it to linux-x.y.z.
    On more than one occasion, I''ve untared a newly downloaded kernel tree and blown
    away another kernel I was already working on. Be careful!


    # Modify the Minicom Source


    You have to make a few changes to the source code for Minicom to make sure that
    works properly in your mini-environment. Begin by changing to the Minicom source
    directory:


    ```

    cd minicom-1.83.0/src

    ```


    You need to modify the Makefile so that a static executable is produced. When
    you compile an application on a modern Linux system, it creates a dynamic executable
    that needs shared libraries for common functions as read(), write(), and printf().
    The whole point of this exercise is to create a static embedded application; this
    way, you don''t have to worry about creating the shared libraries and setting
    them up so they''ll work at runtime.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Procedure 131


    Look for the line that begins with minicom: and add -static somewhere on the next
    line. This single switch causes all the code necessary to run the application
    to be contained in the single executable. For instance, if the line says this:


    ```

    $(CC) $(LFLAGS) -o minicom $(MOBJS) $(LIBS)$

    ```


    change it to look like:


    ```

    $(CC) -static $(LFLAGS) -o minicom $(MOBJS) $(LIBS)$

    ```


    Next, you need to remove a Minicom security feature that is unnecessary in this
    embedded application. In minicom,c remove the entire if clause that contains the
    string ''You don''t exist. Go away.'' If this logic is not removed, Minicom will
    bail out when execution gets to this point. Since you don''t have to be concerned
    with permissions and correct users in your embedded environment, it''s safe to
    remove this logic.


    Now make the Minicom executable file:


    ```

    make

    ```


    If everything goes well, you''ll end up with a static executable file called minicom.
    You can make it static with the ldd command:


    ```

    $ ldd src/minicom

    libc.so.6 => /lib/ld.so.6 (0x4001e000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    Change directories back to the root of your project (minicom) and create a blank
    initrd image using the dd command:


    ```

    cd ../

    diff if=/dev/zero of=fs bs=1k count=600

    ```


    This command creates a file with 600 KB blocks in it. Each block is filled with
    zeros. It''s important to create this file from scratch each time because as much
    as possible. If you keep using the same file over and over again, blocks that
    really have no data in them wouldn''t compress well because they no longer filled
    with only zeros. (When files are deleted, the contents of these files are still
    inside the initrd.)


    # Change and Mount the Filesystem


    Now you''re ready to create the filesystem in the fs file. We''ll use the e2fs
    filesystem because it''s the best-tested filesystem in Linux:


    ```

    mkfs.ext2 .fs

    ```


    Tip: You have a choice of several filesystems for your root filesystem. The choice
    usually boils down to ext2 or minix. I typically use the ext2 filesystem, although
    the minix filesystem is quite a bit smaller.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Now mount the filesystem. Linux mount is pretty good at determining the filesystem
    type from the filesystem itself. If it has a problem, you may need to tell it
    the filesystem type it''s dealing with, using the -t option.


    ```

    mount -o loop fs /mnt

    ```


    # Create the Devices


    You''re ready to create the special files needed for your embedded environment.
    You must use the -a option of the cp command so that the directory entries are
    copied but the files are not merged.


    ```

    mkdir -p /mnt/dev

    (cd /dev && cp -a console full kmm loop0 loop1 mem null port ram0 ram1 tty0 tty1
    tty2 tty9 tty2 tty3 urandom zero /mnt/dev)

    (cd /mnt/dev && ln -s /proc/core core)

    (cd /mnt/dev && ln -s ram1 ram)

    ```


    Now, create the terminfo for the console. This file contains the definitions of
    escape sequences for the console for operations such as clearing the screen and
    drawing lines:


    ```

    cp -p /usr/share/terminfo/1/linux /mnt

    ```


    # Copy the Minicom Executable


    Copy the Minicom executable to the initrd filesystem and name it /linuxrc

    cp minicom-1.83.0/src/minicom /mnt/linuxrc


    You name it /linuxrc because that''s the name of the script (or program in this
    case) the Linux kernel will run when it done booting. You might expect to name
    it init instead. But since you''re using the initrd feature of the Linux kernel
    to load your application into memory, you must name it linuxrc, because that is
    what Linux expects when starting an initrd process.


    # Set the Root Directory


    Test the setup by running the linuxrc program with /mnt as the root directory.
    This way, you know that /linuxrc runs in the same environment it will run on with
    your device:


    ```

    chroot /mnt /linuxrc

    ```


    chroot runs the command specified by the third parameter, using the directory
    specified in the second parameter. The command has no access to any files on the
    computer other than those under the specified root directory. The reason you run
    /linuxrc instead of /mnt/linuxrc is that the chroot happens before the execution
    of, and once the chroot happens the linuxrc file is then in the root of the new
    directory structure.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'If everything goes okay, the Minicom program should start. If you''re adventurous,
    you could attach a modem and put Minicom through its paces. To exit Minicom, Ctrl+A
    X.


    # Compress the Filesystem


    Now, unmount the initrd filesystem and compress it as much as possible (the -9
    option sacrifices speed for better compression):


    ```

    mount /mnt

    gzip -9 fs

    ```


    # Configure the Kernel


    Change to the kernel directory:


    ```

    cd linux

    ```


    Configure the kernel using the make menuconfig command. The following options
    are based on a 2.2 Intel kernel; your kernel configuration may be a bit different.
    Turn off all options except the following:


    # Processor Type and features


    386 processor family

    1GB Maximum Physical Memory


    # General setup


    Kernel support for ELF binaries


    # Block Devices


    # Character devices


    Virtual Terminal

    Support for console on virtual terminal

    Standard/generic (dumb) serial support


    # Filesystems


    DOS FAT fs support

    MSDOS fs support

    Second extended fs support

    Console drivers

    VGA text console'
