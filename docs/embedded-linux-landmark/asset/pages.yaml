  md: '# 8


    # Static Application Example:

    Minicom


    WHEN YOU''RE DONE WITH THIS EXAMPLE, you''ll have a floppy disk that turns an
    x86-based computer (80386 and above) with a keyboard, VGA monitor, and floppy
    disk drive into a dumb serial terminal. We''ll use Minicom, a serial communications
    application that comes with most Linux distributions, but we''ll download all
    the software in this example from the Internet to show how easy it is.


    This procedure takes somewhere between a half hour and two hours, depending on
    your hardware and experience—after you have the three files you need from the
    Internet. Before beginning this procedure, make sure that you have the following:


    +   - 110MB free disk space in the filesystem you''re going to use for this project

    - An Internet connection

    - A floppy disk

    - A Linux computer with the ability to compile x86 binaries'
