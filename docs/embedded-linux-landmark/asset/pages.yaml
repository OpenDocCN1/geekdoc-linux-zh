  md: '# Chapter 2 Minimal Linux


    # -i386


    The -i386 option causes the compiler to assume that the object code is going to
    run on an Intel 80386 (as opposed to 80486, Pentium, AMD, and so on). This affects
    instruction choice, ordering, and alignment. Normally, you''ll want to choose
    the 80386 execution model even if you''re running your application on a higher-level
    processor. You''ll get the optimal performance out of your processor, but you''ll
    get the smallest code footprint. If you have a small number of executables that
    compile the bulk of the processing for your application, you may want to compile
    particular executables with the option for the chipset you''re running.


    If you''re running on a non-x86 processor, don''t use this option. Instead, look
    at the processor-specific documentation in the compiler documentation (info gcc),
    and choose the smallest execution model for your processor.


    # -g


    Many packages automatically compile with the -g switch. This option tells the
    compiler to include debug symbols so that you can trace the code at the source
    level with the GNU debugger. The executable that the compiler produces is twice
    the size of an executable created without this.


    Once your program is working, you probably won''t have a chance to debug it while
    it''s in your embedded appliance, so it is best to get rid of all debug symbols
    before you ship the code. There are a few ways to do that. You can strip the code
    of the debug symbols when moving it from its default compiled location with the
    strip command, remove the -g option from the Makefile, or compile with the -s
    option to inform ld leaves in the .note and .comment ELF sections, and you will
    still want to do a ` -strip --remove-section=.note --remove-section=.comment`''.


    # -static


    If any of your executables are compiled with the -static switch, they''ll be gigantic
    compared to those without. The dhrystone executable compiled with the -O6 was
    14424 bytes long. The executable compiled with the -static switch was 967612 bytes
    long—more 67 times larger! The only time you might want to include a static executable
    in an embedded application is when you want to be the only executable that runs.
    For details on this special case see Chapter 8.


    # Surprising Results


    The results of the dhrystone benchmark are quite surprising. First of all, there
    was no difference in size or speed of the executables compiled with the -m386,
    -mpentium, no optimization switches at all. In fact, the executables produced
    using these options were identical.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'However, the most surprising result was that the code optimized for size ran
    much faster than even those supposedly optimized for speed. The highest speed
    optimization level (-03) resulted in 544 kilo-dhrystones per second on my 500
    MHz Pentium III compiled with gce version egcs-2.91.66 19990314/Linux (egcs-1.1.2
    release). That''s pretty good—47% faster than with no optimization at all. However,
    the -Os option, which is supposed to produce code that''s smaller but not necessarily
    faster than -03, produced code that''s 18% faster than the -03 code, which comes
    to a whopping-ping 74% faster than with no optimization at all!


    # Summary


    There are a few important concepts to glean from this chapter:


    +   - Size does matter when you''re working on embedded applications.

    - To build the smallest, most reliable embedded application, you must either choose
    an embedded Linux distribution that matches your needs or roll your own.

    - In all but the simplest applications, you should use the dynamic C libraries
    (shared libraries) as opposed to statically linking your executables.

    - Don''t use -g or -static when compiling your executables for inclusion in an
    embedded application. Use -static only when there will be a single executable
    in your embedded system. Always use -Os optimization.'
