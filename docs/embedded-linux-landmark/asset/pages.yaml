    \ fault (core dumped) message. It would have taken a longer with any of the other\
    \ methods I mentioned earlier.\n\n# Itrace\n\nSimilar to trace, it traces library\
    \ calls. It displays both the parameters passed to the function and the return\
    \ value. Combined with trace, it is extremely useful for debugging problems when\
    \ the source code is not readily available, or when debugging with gdb is too\
    \ much of a hassle.\n\n# gdb and Other Debuggers\n\nIt's usually worth spending\
    \ time figuring out how to use gdb (the GNU Debugger) or another debugger with\
    \ your target hardware, especially if you're going to spend a lot of time on a\
    \ project. gdb can save you a lot of time and energy when you have a pesky bug.\n\
    If your target device has a console, you can run gdb directly on the device as\
    \ usual, simply by compiling the -g option and running the executable under gdb.\
    \ If your target doesn't have a console, you can still use gdb by connecting your\
    \ host to your target through the serial port. You can then use gdb remotely from\
    \ your host."
