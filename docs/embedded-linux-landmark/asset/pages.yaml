    the loader is a double win because this code is uncompressed. However, usually
    very little code can be cut out, this should be one of the last places you look
    for code to remove.


    # initrd


    The one feature of the Linux kernel''s most helpful for creating small boot images
    is the initrd filesystem. Originally intended to simplify the Linux installation
    process, the initrd filesystem allows a small filesystem to be loaded by the same
    mechanism that loads the kernel itself from the storage media on which the kernel
    resides. Best of all, the filesystem is stored in a zipped format and the kernel
    decompresses it to a RAM disk at runtime. This helps the installation process
    of a standard distribution by eliminating the need to choose a kernel from a list
    of kernels, each with a different mix of drivers. Before the initrd filesystem
    was available, there was no way to boot Linux unless the driver was compiled into
    the kernel. This was especially difficult for x86 PCs using SCSI controllers.
    Unlike IDE, each type of SCSI controller has its driver, so the user had to select
    from dozens of different kernels before installing Linux. With initrd, a small
    compressed filesystem—complete with the essential drivers and a boot script—is
    loaded from the boot media along with the kernel. The kernel uncompresses this
    filesystem and executes a file within it /inituxre. Normally, the script loads
    the driver to complete the boot process and exits.


    Once the script exits, the initrd filesystem is usually unmounted, its memory
    is released, and the boot process continues to the real init. However, for an
    embedded device, there is no reason to exit the initrd filesystem. All the software
    your embedded application requires sit in the initrd filesystem, and as long as
    the /linuxre executable runs, the rest of the kernel boot procedure will never
    happen. This technique offers several significant advantages and two disadvantages.


    These are the advantages:


    +   - If you can get your loader to load the kernel, then you can get it to load
    the initrd filesystem too. They''re stored side by side on the media from which
    the boot loader reads. You can combine the initrd into the kernel image file,
    leaving the bootloader with only one file to load.

    - Unlike the kernel, the initrd image is compressed. This drastically reduces
    the space required to store it on your boot media.

    - It''s really a RAM disk, so any runtime configuration changes won''t survive
    a power cycle.


    And these are the disadvantages:


    +   - Configuration changes to the initrd filesystem also won''t survive a power
    cycle. This means that any log data or configuration information must be stored
    separately. You can''t just add a new line to /etc/passwd to add a user; any /etc/passwd
    on your system will be lost during the next power cycle.'
