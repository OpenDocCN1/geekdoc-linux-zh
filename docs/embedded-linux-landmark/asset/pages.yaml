- img_proc: true
  md: '# Procedure


    The procedure outlined in this chapter uses the components shown in the following
    table.


    | Component | Description |

    | --- | --- |

    | Linux 2.2 kernel | By the time you read this, the 2.4 kernel will be available
    and somewhat bug free. You may want to use the 2.4 kernel instead of the 2.2 kernel.
    If you do, you may have to modify the procedure somewhat. |

    | Minicom | Minicom is a great little serial communications utility. Because it''s
    a simple application, anyone with a standard PC can use and test it. If you want
    to use a different application in the following procedure, you can do so, remember
    that the procedure will need to change something to accommodate that application.
    |

    | SYSLINUX | The procedure uses SYSLINUX to boot the floppy disk. If you prefer,
    you can use GRUB or LILO.


    # Create the Directory


    You should create a directory for each of your projects so that the files that
    comprise each project are kept in a well-defined place.

    It''s best to keep the source code for the components of your project along with
    the project itself. For instance, in the following steps you''ll download the
    Linux kernel, Minicom, and SYSLINUX. But what happens if you make some changes
    to your copy today, and then you need to upgrade to new versions three years from
    now? You''ll need the original source code to create patches to the new versions.
    Because it''s so important to the Linux community at large, even three years from
    now you''ll be able to download the sources for the exact version of the kernel
    you used with this procedure. However, you may not be able to get old versions
    of Minicom or SYSLINUX. It really depends on whether the maintainer of each package
    keeps all the old versions.


    For this procedure, begin by creating a directory called eminicom to store the
    Minicom software. Then change to that directory in preparation for downloading
    Minicom:


    ```

    mdir eminicom

    cd eminicom

    ```'
