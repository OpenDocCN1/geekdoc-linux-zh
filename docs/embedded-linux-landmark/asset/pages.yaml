  md: "![](img/8b49953a368fc0ed5b31c2626a338037_84_0.png)\n\n# # Hardware Considerations\n\
    \nPREVIOUS CHAPTERS EXAMINED THE MANY ISSUES and advantages related to using Linux\
    \ in embedded environments. Of course, the eventual goal is an actual physical\
    \ product, and that means hardware. If you were creating a Linux application to\
    \ run on a standard PC, your task would be greatly simplified, because the environment\
    \ is well defined and doesn't vary much from one manufacturer to another. But\
    \ because the embedded world includes a huge number of different product types\
    \ and requirements, that means an equal number of potential hardware solutions\
    \ and difficult decisions to be made. the motorized hula-hoop controller you have\
    \ in mind is probably not going to be the perfect solution for the nuclear-powered,\
    \ telepathically controlled, handheld inertial navigation system that your boss\
    \ wants you to build.\n\nThere simply no *universal* platform that fits all needs.\
    \ That's the bad news. \nThe good news is that Linux support is available for\
    \ virtually every microprocessor type and family in existence, from simple micro-controllers\
    \ that cost only a few dollars to sophisticated multiprocessor systems with supercomputer\
    \ performance and hefty price tags. Whatever your application, it's certain that\
    \ one or more appropriate choices are available. And, while there is no simple\
    \ cookbook method for instantly selecting the right hardware solution, you can\
    \ apply some well-known guidelines to make the process manageable."
