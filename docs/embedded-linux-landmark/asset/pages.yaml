    \ (root@porky.devel.redhat.com)\n(gcc version egcs-2.91.66+19990314/Linux (egcs-1.1.2\
    \ release)) #f1\nMon Nov 23 10:25:54 EDT 2000\n```\n\nThis list gives you the\
    \ Linux kernel, the user and machine for which the kernel was compiled, the compiler\
    \ version, and the kernel compile detail.(So much detail that we had to break\
    \ it into three lines above.) A lot of information about the kernel boot proceeds\
    \ next. Each of the compiled-in drivers typically prints out some information\
    \ about itself. After the kernel is completely initialized, the computer is finally\
    \ ready to run the embedded application.\n\nIn Linux, in any version of UNIX,\
    \ the software that runs can be kernel code or user process. If the processor\
    \ has a Memory Management Unit (MMU), user code runs at lower privilege level\
    \ than kernel code, which prevents it from doing things that could crash the computer.\
    \ Linux can also run on computers without an MMU (using the kernel patches). In\
    \ these cases, there's no concept of differing privilege levels—all code runs\
    \ as if it were kernel code and has the potential to crash the machine. While\
    \ this can make debugging more difficult than usual, it shouldn't deter developers\
    \ from considering the less expensive MMU-less processors. Since users typically\
    \ don't put arbitrary software on their embedded device (as they do on their PCs),\
    \ an embedded device is much crash-prone. The software was put there by the embedded\
    \ system designer and presumably was well tested.\n\nAn embedded application will\
    \ usually contain one or more user-level applications, the first of which is called\
    \ init. In Listing 4.1, kernel code from /usr/src/linux/init/main.c the program\
    \ doesn't have to be called init; you can pass an init=/some_program command-line\
    \ argument to the kernel from the boot loader and the program you specified at\
    \ boot.\n\n# Listing 4.1 Kernel Code from /usr/src/linux/init/main.c\n\n```\n\
    static int init(void * unused)\n{\n  lock_kernel();\n  do_basic_setup();\n\n \
    \ /*\n   * Ok, we have completed the initial bootup, and\n   * we are essentially\
    \ up and running. Get rid of the\n   * init segments and start the user-mode stuff.\n\
    \   */\n  free_initmem();\n  unlock_kernel();\n```\n\ncontinues"
