  md: 'SBCs also tend to costly slightly than the industrial-PC products, but to be
    aware that the reduced cost comes at the expense of having limited expansion capacity.
    As a result, SBC designers need to take a “kitchen sink” approach by including
    as many peripheral functions as they can possibly squeeze onto a relatively small
    PCB, often using nonstandard connectors to save additional space.Power requirements
    vary wildly depending on processor speed, type grade, type of memory used, and
    peripheral functions available.


    If you''re lucky enough to find an SBC that has the exact mix of performance and
    functionality you need, to contend with packaging and a power supply, with anything
    else you need (display, controls, cooling, and so forth) in a suitable enclosure.
    In my experience, the small form-factor usually provides little benefit over the
    other bits and pieces that are added and the myriad and connector issues are sorted
    out.


    Perhaps the biggest drawback of SBCs is the limited expansion capacity. It never
    seems to fail that the interface you need—typically the thing that makes your
    application and product unique—is not available and will require substantial thrashing
    and contions on your part to accommodate and adapt.


    And finally there''s the cost if you''re building one or a small number of something
    truly custom (in other words, not intended for ongoing production), the costs
    of using the SBC will disappear the other costs (assembly, configuration, documentation,
    and so on) are assimilated.


    A somewhat more flexible approach is provided by a number of bus-based products,
    including PC104 and PC104+, STD bus, VME bus, CompactPCI, and others, all of which
    conform to published standards and are supported by extensive supplier organizations.The
    cost of these products is usually on par with the industrial-PC equivalents, but
    in many cases they can cost considerably.The benefits include much greater flexibility
    in packaging, processor/performance options, increased supplier base, and—theoretically,
    at least—choice of off-the-shelf interface types and functions.


    The primary advantage to be derived from using any of these systems is that it
    allows you to build custom functions to be added according to well-defined standards
    in a well-known, documented environment. Notice that I said build—meaning that
    you have already determined that some elements of your product will have to be
    engineered, designed, and constructed by you. What''s more, you''ve also determined
    that your performance or throughput requirements demand this level of sophistication.
    This approach, a combination of “buy” and “build,” represents the top of the food
    chain as as embedded defined. Systems like these are typically embedded in airlines,
    oil tankers, and skyscrapers—not wristwatches. Yet Linux can be equally at home
    in all of these cases.'
