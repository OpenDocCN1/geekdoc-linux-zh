  md: '# About the Author


    ![](img/8b49953a368fc0ed5b31c2626a338037_11_0.png)


    John Lombardo has been working with Linux since the "0.9" days. His ShareTheNet
    software product enables a novice to easily create a highly functional router
    out of an old x86 computer using Linux. Lately, John has been working on several
    embedded Linux projects, including easy-to-use IPSec routers, ARM7-based NAT routers,
    and this book. John has a B.S. in computer science.


    # About the Technical Reviewers


    The reviewers contributed their considerable hands-on expertise to the entire
    development process for Embedded Linux. As the book was being written, these dedicated
    professionals reviewed all the material for technical content, organization, and
    flow. Their feedback was critical to ensuring that Embedded Linux fits our reader''s
    need for the highest-quality technical information.


    Erik Andersen graduated from Brigham Young University with a B.S. in mechanical
    engineering and a master in mathematics. He also completed all the course work
    needed for an M.S. in manufacturing engineering from BYU, but to the arrival of
    his daughter Jessica, dropped out and started working for a robotics company doing
    workcell development, kinematics, and computer vision.


    ![](img/8b49953a368fc0ed5b31c2626a338037_11_1.png)


    Erik started with Linux in 1994 while still an undergraduate and became a Debian
    developer in 1996. After buying a CD-ROM changer and finding little kernel support
    for such devices, Erik ended up maintaining the Linux kernel''s CD-ROM subsystem
    from 1996 to 1998. During that time, he helped define the kernel''s CD-ROM changer
    interface, added proper support for changes to IDE-CD, made major updates to the
    kernel''s CD-ROM interface, ported the most useful of the old proprietary CD-ROM
    drivers to this new interface, and named the interface "Uniform CD-ROM driver."'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Erik was the first Linux engineer hired by Lineo. He was team lead for developing
