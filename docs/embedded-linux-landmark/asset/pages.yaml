  md: '2. Untar the distribution into a filesystem with at least 150MB free (binary
    only).


    3. Once it''s untared, you''ll have a new directory called Embedded_Build. Change
    to that directory and run the .pwqlconfig script. This script is the heart of
    PeeWeelinux—a 20KB bash script that builds and configures your project and builds
    your bootable image.


    4. Manage Package Files and then Extract ALL RPM files. You won''t have any packages
    to select until you do.


    5. PeeWeelinux comes with a couple of example projects. I suggest you don''t to
    build a new project from scratch; it''s difficult to tell which packages are needed
    for a project and not Just start with one of the sample packages. For example,
    to start with the minimal package,just untar from the PeeWeelinux root directory,
    rename projects/minimal to projects/yourprojectname and rerun .pwqlconfig. You
    should select the project include all of the Manage Projects.


    The minimal project includes all of the following:


    +   - Editor: ee

    - Kernel: basic 2.2.17 with minimal modulus

    - Shell: ash

    - System base: bflush, dev, filesystem, initscripts, mingetty, sysvinit, util-linux

    - System libraries: glibc, libtermcap

    - System utilities: fileutils, sh-utils, textutils


    6. Choose Configure File System to choose which packages to put in your filesystem.
    The minimal package almost fills the entire floppy disk, so Minicom won''t fit.
    However, the microcom also comes with PeeWeelinux, it''s only 12KB, so''s choose
    that package (under Network Serial) as an example.


    7. Choose Extract File System for Project. This copies all of the contents of
    the packages to the mnt directory within your project—getting you ready for the
    next step.


    8. Load a floppy disk into the drive and choose Load File System onto Target.
    If all goes well, you''ll have a bootable floppy disk.


    9. Boot the floppy disk. You''ll have to log in—the root password is redhat. Once
    logged in, type microcom /dev/ttySx to run microcom. Change the x to 0 or 1, depending
    on which serial port you''re testing.'
