  md: '+   - Linux is not afraid of breaking backward compatibility.


    Unlike other operating systems, Linux is not full of "cruft".That is, it doesn''t
    have a lot of version-specific code. This makes reading the source code much easier
    because it''s not littered with a lot of #ifdefs and compatibility code. Unfortunately,
    it means that some programs that run just fine under Linux may stop running with
    newer kernels. It''s usually up to the driver maintainer to make sure that the
