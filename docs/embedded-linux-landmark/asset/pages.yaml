  md: '# 44 Chapter 4 Booting Your Embedded Linux Device


    Now we set up the segment registers and stack pointer:


    ```

    movw    $0x18, %ax

    mov    %ax, %ds

    movw    %ax, %es

    mov    %ax, %ss

    mov    %ax, %fs        /* 586 */

    nmov    %ax, %gs        /* 586 */

    movl    $_PDATABASE, %esp

    ```


    After setting up, the RAM modules are set up using a long sequence of assembly
    macros that use the SIS630 directly, using x86 out instructions. To save space,
    they''re not shown here; see the LinuxBIOS project itself for details.


    ```

    /* initialize the RAM (for each motherboard) */

    #include "intel_sis630ram.S"

    ```


    Once the RAM chips on the motherboard are set up, the contents of the _data_segment
    are moved from ROM to the _ldata address in RAM:


    +   * Copy data into RAM and clear the BSS.

    * aren''t really that big, we just copy/clear using bytes, not double words.


    ```

    /* */

    intel_chip_post_macro(@x11)        /* post 11 */

    cld                                     /* clear direction flag */

    /* copy data segment from FLASH ROM to RAM * */

    leal EXT_(ldata), %esi

    leal EXT_(data), %edi

    mov    $EXT_(ldata), %ecx

    subl   %esi, %ecx

    j     .Lnodata               /* should not happen */

    rep

    movsb

    .Lnodata:

    intel_chip_post_macro(@x12)        /* post 12 */

    ```


    Next, the stack and BSS area (uninitialized data area) are zeroed out:


    ```

    /* clear stack */

    xor    %edi, %edi

    mov    $_PDATABASE, %ecx

    xor    %eax, %eax

    rep

    stos


    /* clear bss */

    leal   EXT_(bss), %edi

    mov    $EXT_(ebss), %ecx

    subl   %edi, %ecx

    j     .Lnobss

    ```'
