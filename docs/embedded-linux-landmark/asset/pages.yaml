- img_proc: true
  md: '# Buy or Build? 57


    you can add your own differentiating features via software. This scenario is particularly
    likely with offshore manufacturers, who may not have your marketing or distribution
    expertise or home field sales advantage.


    As a general rule, unless you intend to build minimum quantities of several thousand
    per month or your requirement is so unique that there''s no possibility of economically
    using anything off the shelf, you should shop for screwdrivers instead of CAD
    tools. If you do decide to buy rather than build, do not be disappointed at having
    to suppress the engineer''s natural instinct to invent. There will be plenty of
    other opportunities for challenge and excitement (like it or not).


    # ## “Cheap PC” Myth


    Invitably, while you''re researching platform possibilities, someone (most likely
    from Operations or Administration) will feel compelled to deliver an impassioned
    lecture that goes into exquisite detail in pointing out the galactic obvious:
    *Desktop PCs are ubiquitous, powerful, and incredibly cheap.* From this argument
    that if you could simply develop your product based on an ordinary PC, then it
    would become ubiquitous, powerful, and (in lieu of cheap) immensely profitable.


    In fact, there are a great many valid and compelling arguments that can be made
    for adopting such strategy, including reduced development time, expense, and risk.
    However, you cannot safely assume that you will get the same cost savings as the
    PC OEMs While you may use the same components (processor, chipset, memory), and
    these are produced in tremendous cost-reducing volumes, realistically they represent
    only a small fraction of the completed system cost. If you can use standard, unmodified
    PC components, you may save some money. But if you need a different form-factor
    or interface, diskless operation, alternative power sources, or any other modifications,
    your “standard PC” starts looking more and more like a wide range of other alternatives.


    One related alternative involves the use of so-called “industrial PCs,” which
    utilize standard form-factor boards with a passive ISA or PCI backplane in a rugged
    (typically rack-mounted) enclosure. If you have already done some shopping for
    these industrial PC components, you''re well aware of the huge cost difference
    between that PC you purchased at a discount warehouse for development and its
    equivalent (or lesser) industrial version. The industrial version can easily cost
    three to four times as much for the same functionality. Many developers aren''t
    aware of this difference until they''ve committed the project to being PC-compatible,
    and then it''s too late to reverse the decision easily. This makes the industrial
    PC suppliers very happy.


    The alternative to using an industrial product, which offers great long-term availability
    and reliability, is to settle for the “motherboard du jour” approach. Under this
    system, you use whatever boards are available; although these boards may indeed
    PC-compatible (by definition), some will also be completely different in terms
    of component layout, heat distribution, core chipsets, BIOS features, power requirements,
    memory compatibility, processor vendors, peripheral functions,'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Chapter 5 Hardware Considerations


    mechanical mounting, cabling/connector requirements. The PC industry is evolving
    rapidly and the competitive cost pressures are so great that in many cases the
    manufacturer will initiate a complete redesign to save only a few cents per board.
    As a result, the use of “standard motherboards” means that your product will be
    subject to constant change and evolution completely beyond your control. This
    is guaranteed to have some undesirable consequences, despite any “compatibility”
    claims.


    Perhaps you have other reasons for wanting a PC-compatible platform, such as the
    ability to reuse code, legacy applications or hardware interfaces, or specialized
    development tools. At the same time, you may find that the industrial approach
    is either too expensive or doesn’t offer the flexibility or feature set that you
    need. In this case, you have the option of designing your own “motherboard.”


    The major silicon vendors continue to devise new variations of x86-processors
    and chipsets targeted for embedded applications. More importantly, they’re beginning
    to address the need for a stable and long-term supply chain for both the processors
    and chipsets in line with the expected lifecycles of the products in which they’ll
    be used. What’s more, some manufacturers are willing to simplify the design process
    by supplying a wealth of reference materials, evaluation systems, and even ready-to-use
    designs in CAD format. All you have to do is ask—be prepared to “do the math”,
    since you have to contend with PCB layouts, mechanical and thermal issues, assembly
    and EMI and safety, and a wide range of other items to apply to any product—whether
    PC-compatible or not.


    If it sounds as though I’m discouraging the use of PCs for embedded Linux, rest
    assured that I’m not. It’s just that there are many alternatives in addition to
    the standard PC that others have neglected because the “PC option” seems so obvious.
    Still, the PC approach can be, and often, is the best.


    Another, more expensive approach is to use notebook computers. These tend to be
    rugged and small. You can take the main-logic board and mount it in a new box.
    Besides rugged, many logic boards have built-in power supplies and charging circuits.


    # SBCs and Other Options


    Pursuing the “buy” option? There are quite a few alternatives to desktop or industrial
    PCs. These generally fall into two categories: single-board computers (SBCs) with
    little or no expansion capacity beyond the features onboard, or modular systems
    products based on specific bus standards.


    Single-board computers come in a wide range of standard and custom form-factors.
    The most common types usually have a mechanical footprint equivalent to either
    a 3-1/2-inch disk drive or the slightly larger CD-ROM drive size. Most are PC
    compatible, although it’s not uncommon to find other processor families supported
    as well (for example, PowerPC or StrongARM).'
