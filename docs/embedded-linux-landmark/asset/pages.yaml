  md: '# Understanding the Boot Process


    Typically, a computer boots in three stages:


    +   1. The hardware is initialized by software closely tied to the hardware.

    2. The kernel is loaded into RAM by the kernel loader.

    3. The kernel itself runs, further initializing the hardware, and then runs the
    application software.


    # BIOS


    When power is applied to an embedded Linux device, the hardware goes through a
    series of events that ends with the processor in some sort of reset state. When
    the hardware releases the processor from the reset state, it begins executing
    instructions at a known location. These instructions are normally stored in ROM
    or flash memory. On a PC, these instructions are called the BIOS. BIOS code is
    responsible for getting the hardware on the PC ready for the operating system.
    At part of this setup process, the early BIOS does a number of low-level things
    such as enabling L1 and L2 caches, detecting how much memory is installed, and
    setting up the RAM refresh. If you are writing this code, you''ll have your nose
    deeply buried in the manuals for your processor, your processor''s supporting
    chipset, and the devices you''re setting up. After the initial chipset and hardware
    initialization, the BIOS then loads the kernel (or kernel loader) into memory
    and starts running. On a PC, once Linux is running it generally ignores the BIOS,
    so in this book we''ll ignore all the BIOS functionality used by other operating
    systems such as Microsoft Windows but ignored by Linux. Linux also runs on many
    architectures, such as ARM, MIPS, PowerPC, and so on, which we don''t use a PC
    BIOS. Generally these other architectures have architecture-specific sort of low-level
    startup (such as PCBIOS, OpenFirmware, RedBoot, and so on) that provides functionality
    similar to what''s provided by the PC BIOS. For the rest of this book, we''ll
    call this startup code “BIOS,” with the understanding that we''re really talking
    about whatever appropriate for the architecture.


    # Kernel Loader


    The kernel loader is a small program that has a better understanding of the rules
    of the operating system and mass storage layout than the BIOS. It can therefore
    load the OS and start it. On an x86 PC running a standard Linux desktop distribution
    such as Red Hat, SuSe, or Debian, a kernel loader like LILO or GRUB manages the
    kernel. For x86-based embedded applications, syslinux also works well.


    For non-x86-based architectures, other boot loaders like MILO may be needed. If
    you are writing BIOS from scratch, or using a system that was specially designed
    with Linux in memory, the kernel loader may well be integrated directly into the
    BIOS. Regardless of how it happens on your specific platform, after the kernel
    loader completes its job, the kernel is in memory and the loader jumps into it.'
