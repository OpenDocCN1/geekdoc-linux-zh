    The smallest embedded Linux application that uses all three software layers (kernel,
    C library, and application) consists of a kernel loader, the kernel, and a few
    statically linked application programs. We will call this a static application
    because to build it you link your executables statically against the C library.
    The great thing about this kind of embedded application is that it''s extremely
    small and very easy to put together if you have only a few executables. In fact,
    Chapter 8,“Static Application Example: Minicom,” shows how to build a single floppy-disk
    terminal emulator out of Minicom in about half hour, by downloading the pieces
    from the Internet and assembling them. The resulting application is less than
    500KB and will'
