  md: "# Your First Embedded Linux Workshop Project 111\n\n18. Change back to the\
    \ root directory of your project:\n\n```\ncd -username/projects/minicom\n```\n\
    \n19. Create the Minicom package directories:\n\n```\nmkdir -p opt/minicom/bin\
    \ opt/minicom/etc/rc\n```\n\n20. In the Embedded Linux Workshop, each opt package\
    \ can have a Makefile. The Makefile has three targets: everytime, binaries, and\
    \ dependencies. The everytime target is normally not used. The binaries target\
    \ used to rebuild any binaries whose source has changed since the last build and\
    \ move those binaries into the opt package. Once the package, the binaries are\
    \ then stripped. The dependencies target lists any dependencies for the opt package.\
    \ For instance, the minicom executable depends on the ncurses library. Obviously,\
    \ you don't have to use the cat command to build the Makefile; Here's the set\
    \ of commands; note that the indented lines are indented with a single tab:\n\n\
    ```\ncat > opt/minicom/Makefile\nneverytime:\nbinaries:\n  @cd ../src/minicom/src\
    \ @amp;@amp make\n  @cp -f ../src/minicom/src/minicom bin\n  @strip bin/minicom\n\
    \  @strip --remove-section=.note -remove-section=.comment bin/minicom\ndependencies:\n\
    \  @echo libncurses\n```\n\nPress Ctrl+D here.\n\n21. The Embedded Linux Workshop\
    \ comes complete with a set of startup scripts that work similarly to the Red\
    \ Hat scripts. Each script in the /etc/rc directory that begins with the letter\
    \ S is executed in increasing sort order. Naming a script S99(something) implies\
    \ that it should be the last script to run and that it may not return to the caller.\
    \ Here's the set of commands:\n\n```\ncat > opt/minicom/etc/rc/S99minicom\n\n\
    #!/bin/sh\necho \"Press a key for minicom\"\nread x\nminicom -s\n```\n\nPress\
    \ Ctrl+D here.\n\nWe use the -s option in Minicom will go directly into setup\
    \ mode. It defaults to COM2; change that setting if necessary.\n\nIn a real device,\
    \ you would create a minicom configuration file and let it start directly. You\
    \ also would not force the user to press a key to start, but this way you can\
    \ see any bootup error messages before Minicom erases them."
