  md: "# Sample BIOS and Boot Loader 43\n\nThe next bit of memory has both a pointer\
    \ to the GDT (gdtptr) and the GDT itself (gdt). The lgdt (Load Global Descriptor\
    \ Table Register) instruction, after the _restart label below, points to this\
    \ space. The Global Descriptor Table defines the translation between physical\
    \ and virtual memory for the kernel.\n\n+   * We have modified this from the original\
    \ freebios to make it\n* compatible with Linux. This puts the test at seg 0x10\
    \ and data at 0x18\n* /\n\n```\ngdtptr:\n  word 4*B1\n  long gdt             \
    \ / * we know the offset */\ngdt:\n  word 0x0000, 0x0000      / * dummy */\n \
    \ byte 0x00, 0x00, 0x00, 0x00\n  word 0x0000, 0x0000      / * dummy */\n  byte\
    \ 0x00, 0x00, 0x00, 0x00\n  word 0xffff              / * flat code segment */\n\
    \  byte 0x00, 0x0A, 0xCF, 0x00\n  byte 0x00, 0x92, 0xCF, 0x00\n  word 0x0000,\
    \ 0x0000      / * flat data segment */\n  byte 0x00, 0x00, 0x00, 0x00  / * kernel\
    \ tss */\n```\n\nThe next few instructions set the %es register, invalidate the\
    \ Translation Lookahead Buffer, and set the Global Descriptor Table Register to\
    \ the table defined above:\n\n```\n_restart:\ncli\nmovw %cs, %ax\nmov %ax, %es\n\
    xor %ax, %eax\nmov %ax, %cr3              / * Invalidate TLB */\nllddt gdtptr\
    \               / * load gdt */\n```\n\nNext, numerous bits in Control Register\
    \ zero (%cr0) are cleared and:\n\n```\nmovl %cr0, %ax\nandl $0x7AFFFD1, %ax  \
    \    / * PG, AM,WP,NE,TS,EM,MP = 0 */\norl $0x60000001, %ax      / * CD, PE =\
    \ 1 */\nmov %ax, %cr0\n```\n\nNow the cache is invalidated using the inv instruction,\
    \ and then we jump to the jump. The processor changes from 16-bit to 32-bit. The\
    \ first thing we do in 32-bit mode is execute the _chip_post_macro(0x10) macro.\
    \ This macro outputs the argument (0x10 in this case) to port 0x80 for debugging.\n\
    \n```\ninv                      / * invalidate the cache */\ndata32\nljmp $0x10,$L.protected\
    \   / * Be prefect cache reloads */\nalign 4\n.L.protected:\n  code32\n  _chip_post_macro(0x10)/\
    \ * We are now in protected mode */\n/ * post 10 */\n```"
