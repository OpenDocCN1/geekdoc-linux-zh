    The S15network script has three parts:


    +   - Lines 15–62 comprise the conf () function.

    - Lines 64-83 set various files in the /proc filesystem and initialize the firewall
    and localhost.

    - Lines 87–100 call the conf () function to set up each of the network interfaces.


    Let''s trace the following sample configuration through the S15network script:


    ```

    export NETEN0="wan"

    export NETNAM0="lan"

    export NETIF0="eth0"

    export NETIP0="192.168.0.9"

    export NETDEF0="192.168.0.1"


    export NETEN1=1

    export NETNAM1="lan"

    export NETIF1="eth1"

    export NETIP1="192.168.10.9"

    ```


    Lines 15–62 define the conf () function and are of no consequence until later
    in the script.


    Lines 67 and 72 set different kernel flags by writing special files in the /proc
    filesystem. Line 67 tells the kernel to retry the connection that caused a network
    session to activate–a PPP connection. Line 72 tells the kernel that it can forward
    packets between network connections. However, line 71 sets the default firewall
    rule to not allow forwards between network connections. If any forwards are required,
    they must be set up with specific firewall rules.


    Lines 82–83 set up the loopback interface.


    Finally, we get to the configuration of the network interfaces. In our example,
    we have two network interfaces, eth0 (named wan) and eth1 (named lan). Because
    we have only two, the first two calls to the conf () function (lines 87–88 and
    89–90) are of consequence.'
