  md: "# When Is Linux Inappropriate?\n\nWhen brings us to the topic of when Linux\
    \ is inappropriate. Clearly, no operating system is perfect for all situations.\
    \ Because Linux carries very little baggage, it covers more situations than most—but\
    \ it's not perfect for everything. You should consider the following points carefully\
    \ before deciding to use Linux as the operating system for your embedded application.\n\
    \n+   - You may not be able to live with the GPL.\n  Probably the thing that should\
    \ concern an embedded developer the most is the GPL and LGPL licenses. These Open\
    \ Source licenses are good things; without them, we wouldn't even have the choice\
    \ of using Linux in embedded applications—the huge growth of embedded applications\
    \ would be much slower and limited to proprietary software. However, these licenses\
    \ make it impossible to bring to market some applications based on Linux.\n\n\
    +   - Linux is big.\n  Another area of concern for anyone looking at Linux as\
    \ an embedded operating system is its size. Even when you pull everything out\
    \ of the OS, it is still pretty big. If you're building a nano-probe the size\
    \ of an ant and have 100 bytes of memory to do Linux is not for you. Compressed\
    \ takes about 400KB. When it's compressed at boot time, it's going to take almost\
    \ one megabyte. (Although Linux can run the kernel plus a few basic user space\
    \ apps around 800KB.) For a real embedded application, the smallest realistic\
    \ memory size is probably 2MB.\n\n+   - Suitability.\n  There are some embedded\
    \ applications for which other operating systems are just better suited. For instance,\
    \ if you're building a handheld PIM, it would be a lot of work to beat PalmOS\
    \ in terms of functionality and size. Instead of concentrating on your application,\
    \ you would have to concentrate on making the pen work, small memory management,\
    \ and so on.\n\n+   - Security.\n  The debate on whether an Open Source operating\
    \ system is more secure than one whose source is closed. On one hand, a bad guy\
    \ who doesn't have access to the source for your embedded application cannot stare\
    \ at that source code for days trying to figure out an approach with which to\
    \ attack your device. This bad guy is restricted to trying random attacks until\
    \ he finds one that works, or finding general vulnerabilities in the OS he chose."
