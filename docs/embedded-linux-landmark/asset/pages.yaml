  md: '# Embedded Linux®


    Embedded Linux is intended for designers of embedded systems and information appliances,
    as well as for general Linux programmers. It describes in detail how to marry
    your tiny Linux distribution to the hardware of your choice, building anything
    from a network router to a do-yourself MP3 player.


    With specific suggestions on how to build the smallest possible Linux system and
    advice on choosing the right hardware for your ultimate goal (better, faster,
    or cheaper), this book teaches how to build your first embedded Linux device.
    You''ll gain insight into finding the best Open Source software to fit your application,
    with a hands-on approach that guides you through selecting the right tools for
    debugging your application, and reducing your building costs.


    Author John Lombardo describes everything you need to put together an embedded
    Linux distribution that exactly what you want—no more, no less. Get now designing
    and building embedded Linux devices with Embedded Linux.


    If you''re a systems designer interested in rolling out an embedded Linux information
    appliance, this book will:


    +   Teach you how to build a minimal Linux distribution


    +   Enable you to decide which software best suits your application


    +   Help you to make wise decisions about the hardware for your application


    +   Provide tips, tricks, and tools to speed the development and increase the
    debuggability of your embedded Linux device


    +   Introduce you to the often overlooked tools you''ll need to get the job done
    in an embedded environment


    +   Demonstrate that it''s possible to create an Open Source embedded product
    that makes money


    > John Lombardo has working with Linux since the "0.9" days. His ShareTheNet software
    product enables a novice to use Linux to create a highly functional router out
    of an old x86 computer. Lately, John has been working on several embedded Linux
    projects, including easy-to-use IPsec routers, ARM-based NAT routers, and this
    book. John has a B.S. in computer science.


    Operating Systems / Linux


