    earlier, because an interface went away.


    # How the GNU Affects You


    The two most important licenses you must understand if you intend to use Linux
    in your development project are the GNU General Public License (GPL) and the GNU
    Lesser General Public License (LGPL). The source code to the Linux operating system
    is copyrighted under the GPL, and the GNU C Library is covered under the LGPL.
    Appendix A and B for the full texts of these licenses.


    # How the GPL and LGPL Are Similar


    Since both the GPL and LGPL are creations of the Free Software Foundation, they''re
    very similar. They both have the following important attributes:


    +   - Copyleft

    The term copyleft, invented by the folks at the GNU project, is a pun on the word
    copyright. Copyleft refers to the clauses of an Open Source license that stop
    an individual or corporation from taking a copy of source code that''s under a
    GPL license, making modifications, changing the license, and thereby "closing"
    their modified-and presumably better-version of the original source code. Once
    a piece of source code is placed under the GPL or LGPL, the code itself and all
    derivations of it are forever available in source form to any interested party.
    Should a third party make changes to this source code and distribute it, they
    are required to make both changes and the original source code available to anyone
    they distribute the software to.


    +   - Availability\If you make modifications to source code under GPL, your best
    bet is to get those changes folded back into the standard source set by submitting
    a patch to the code''s maintainer. You can usually figure out who the maintainer
    is looking for a README file in the root directory of the source tar file. If
    your changes are accepted by the maintainer, you''re relieved of a couple of burdens.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'First, you don''t have to keep reapplying (fixing) your patch when a new version
    of the code appears. This can become quite tiresome, especially if the code is
    released often and you want to keep up to date.


    Second, the GPL requires that you accompany your product with either the source
    to the changes or a written offer of the source code valid for at least three
    years. It''s generally accepted that if your changes are available in a standard
    distribution, you can simply point people who want those changes to standard distribution.


    Both version of the GNU General Public License and the GNU Lesser General Public
    License are reproduced in this book''s appendixes. If you''re considering Linux
    as the operating system for your embedded application, you should take the time
    to read and understand these licenses. Unlike a of legal language, they''re quite
    readable and understandable from a software developer''s view.


    # How the GPL and LGPL Are Different


    Licensing source code under the GPL or the LGPL produces similar results. Any
    changes to either code must be made available to anyone interested, and so on.
    The only real difference is whether proprietary code can link with the Open Source
    code. The LGPL allows an entity to link its proprietary code to the Open Source
    code and distribute resultant binaries with no restrictions, as long as those
    binaries are dynamically linked. Binaries are still covered under whatever proprietary
    license the owner wants.


    The most obvious example is the C library, glibc. Since it''s released under the
    GPL, a proprietary software company as Oracle can compile and link its database
    application in-house, put the binaries on a CD, and ship those binaries only.
    Those binaries will run under the Linux kernel, which is covered by the GPL, using
    the dynamic glibc C libraries, which are covered under the LGPL. If Oracle decided
    to make changes to the C or the Linux operating system, they would have to make
    those changes available to whoever wanted them, but they wouldn''t have to make
    the database itself because it is dynamically linked with the LGPL glibc.


    If your entire embedded application environment is really short on space, and
    the entire application lives within a single executable, you may want to link
    it statically. If you do that and use a library under GPL, such as the glibc library,
    you''ll have to make object code or source code available to all your customers.
    Section 66 of the GPL allows you to make a written offer of the object code, if
    you prefer. Therefore, statically linking your code can become a maintenance,
    support, and liability night-mare for embedded device manufacturers. I suggest
    dynamically linking your code so you don''t fall into this trap.'
