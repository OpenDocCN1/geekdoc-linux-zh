    # Embedded Linux Resources


    THERE ARE A LOT OF WEB WEB SITES DEVOTED to using Linux within embedded devices.
    Besides having varying amounts of their own content, the sites mentioned in this
    chapter have links to a lot of other sites that have more specific information
    about targeted aspects of embedding Linux on devices.


    This Book''s Web Site: www.EmbeddedLinuxBook.com


    As of June 2001, the whole idea of embedding Linux into products is still young.
    There are many Web sites devoted to this concept, plenty of great ideas, many
    prototypes, and many product announcements—but only a few shipping products. Companies
    as Lineo are pouring research dollars into building the infrastructure required
    to effectively embed Linux products. Great Open Source projects such as BusyBox,
    uClibc, and uLinux are thriving.


    Every effort has been made to make this book stand on its own for several years
    and not be tied to a particular technology, but the march of time demands that
    this book''s resources must continue to grow to keep up with changing technology.
    Web site for the book will always be a place where you can find links to the latest
    information on how to embed Linux into your product.'
