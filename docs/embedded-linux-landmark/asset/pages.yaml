  md: '![](img/8b49953a368fc0ed5b31c2626a338037_130_0.png)


    # # 7 The Embedded Linux Workshop


    HIS CHAPTER DESCRIBES THE EMBEDDED LINUX WORKSHOP (ELW), an Open Source embedded
    Linux toolkit—put together specifically for this book—that makes it easy to build
    embedded Linux applications quickly and efficiently. As discussed in Chapter 6,
    “Embedded Linux Toolkits,” there are already several embedded Linux toolkits available—so
    why I bother to create another one? The reason is simple: I wanted to create an
    Open Source Embedded Linux teaching aid that''s well-documented and simple enough
    to understand quickly and completely, yet powerful enough for any embedded Linux
    project.

    Here’s some basic info you need to know about ELW:


    +   - ELW assumes that you''re using a standard PC with a BIOS to prototype your
    embedded application.

    - ELW uses the SYSLINUX boot loader to load the kernel and root filesystem.

    - ELW doesn''t get into the gory details of how the processor initializes the
    hardware, loads the kernel and root filesystems into memory, switches the processor
    to 32-bit mode, and starts the kernel. These details vary wildly from processor
    to processor; covering them all in a single book would be impossible. The whole
    topic is glossed over with this simple statement:“The BIOS and SYSLINUX do that.”
    For more information, see Chapter 4 “Booting Your Embedded Linux Device.”'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Chapter 7 The Embedded Linux Workshop


    Of course, in your embedded Linux project, you may not have a BIOS and SYSLINUX
    may not be appropriate—after all, it works on an x86 platform. For that reason,
    I won''t spend a lot of time on SYSLINUX, but it''s a great utility that performs
    a specific need very well. You may even want to take a look at it when you''re
    emulating its behavior for your own embedded design.


    # General Goals


    These are the general goals of the Embedded Linux Workshop:


    +   * It must be easy to learn.

    * It must be useful in real-world situations.


    These are the goals of the Embedded Linux applications you can build with ELW:


    +   * **Minimal code size.** The top priority of any embedded Linux toolkit should
    really be building an embedded Linux application that minimizes code size. The
    smaller the code, the less memory and flash required to run the application; this
    reduces the final assembly.

    * **Extensibility.** The Embedded Linux Workshop strives to be as extensible as
    possible. Adding support for various application packages, library technologies,
    and processors should be conceptually easy. This is especially important in the
    Open Source world, where a project can take on a life of its own—if it''s difficult
    to manage the software, project''s growth can be quite limited.

    * **Upgradeability.** New versions of Open Source products can come fast and furious.
    If project developers want to accept and test upgrades, they must make upgrading—and
    sometimes downgrading—easy. The Embedded Linux Workshop is put together so the
    embedded project you''re working on doesn''t live in or have much to do with a
    specific version of the workshop itself. You could have several versions of the
    workshop running on your machine at any time, and build your project with any
    one of them.


    I''ll talk more about the goals of ELW later in this chapter.

    Of course, you may decide to use a different toolkit to build your embedded Linux
    product, but I hope that the concepts you learn with the Embedded Linux Workshop
    will be helpful in evaluating and using any other toolkit you encounter.


    # A Bit of History


    My first “embedded” Linux application, called ShareTheNet, was not originally
    distributed as hardware. It''s a software product that a lot of people around
    the world use to connect their homes and businesses to the Internet. The original
    idea was to enable a Windows-literate user to build a Linux-based IP masquerading
    router with very little effort. I got the idea after spending a week of evenings
    setting up IP masquerading for'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# A Bit of History


    my home network. After spending hours getting things like DNS, DHCP, and dial-onemand
    working, I realized that the typical Windows user would have little hope of getting
    a Linux IP masquerading up and running. So I decided to make it easy for them
    and built ShareTheNet.


    The design constraints for ShareTheNet were quite,simple: It had to fit on a 1.44MB
    floppy. That''s it. If it didn''t fit on the floppy, it didn''t go into the product.


    This left out a lot of cool development tools. For instance, Perl, C++, and Java
    have huge runtime libraries, so they were out. It also precluded features that
    I liked to have. For instance, one of the earliest complaints against IP masquerading
    was that it couldn''t support H.323 connections. H.323 does act like a normal
    TCP/IP client/server application; low-level proxies like NAT or IP masquerading
    do not work because they normally look at the content of the traffic—just the
    addressing information in the packet. Unfortunately, videophone software such
    as Microsoft''s Meeting ruled on this protocol. Proprietary "gatekeeper" software
    available for Linux meant that this software was written in C++ and was much bigger
    than a floppy disk. It wouldn''t fit. Fortunately, the problem has been solved
    by a protocol-specific IP masquerading module for H.323.


    The installation process for ShareTheNet went like this:


    +   1. The user runs a Basic program called ShareTheNet.exe. Its purpose is to
    gather user input about the specific installation and build a bootable Linux floppy
    disk based on that input.

    2. Build the floppy disk.

    3. Boot another computer with the floppy disk. The other computer would serve
    as the network gateway to the Internet.


    The boot floppy consisted of these items:


    +   - The Linux kernel

    - A minimal initrd.gz file

    - Optional software packages

    - User-selected network drivers

    - The SYSLINUX files

    - A single configuration file


    ShareTheNet typically boots from a floppy disk, although it can boot from a hard
    disk. Because the floppy is built in a Windows environment, it made much more
    sense for the floppy to be formatted in FAT format than ext2. This ruled out LILO.
    The original version of ShareTheNet used a small autoexec.bat that ran load1,
    but this required the floppy to have the DOS operating system on it—wasting 1/3
    of the space on the floppy. Now ShareTheNet boots from SYSLINUX, which'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Chapter 7 The Embedded Linux Workshop


    requires very little and is much faster than loadlin. SYSLINUX requires two files
    on the floppy disk: syslinux.cfg (the SYSLINUX configuration file), and llinux.sys
    (a 5KB file that contains the code that loads the Linux kernel and initrd.gz files
    into memory and runs the kernel.


    The following procedure is the ShareTheNet sequence:


    +   1. The kernel decompresses itself and the initrd.gz file and starts running.
    The uncompressed initrd.gz image becomes the root RAM disk.


    +   2. After the kernel reads and loads all the built-in device drivers, it runs
    the /initrc script from within the initrd.gz RAM disk.


    +   3. The /linuxrc command loads and uncompresses other packages from the boot
    media. these are stored as a compressed tar.


    +   4. The ldconfig command runs to rebuild the shared library cache (/etc/ld.so.cache).
    This is done because some of the optional packages require a shared library or
    two that are not normally needed. The ldconfig command must run so that shared
    libraries can be found by the loader.


    +   5. Package-specific startup scripts run next. This is how most of the services
    start, as ident, named, dhcpd (server), and dhcpd (client).


    As shown in Chapter 3, "Software Configuration," each script is responsible for
    taking parameters out of the /mnt/env file and building and any configuration
    files. Usually this can be done with a few shell-script commands, but sometimes
    a C program must be written to build the configurations. This is the case for
    named-configuration files that are complicated enough that a shell script was
    too difficult to write.


    +   6. The startup script is built and executed. ShareTheNet users are able to
    administer the software using a Web-based configuration program. However, some
    things are not quite enough, so users can add their own startup commands by using
    the browser. These commands can do anything, but used to enable traffic back into
    the local network that would be blocked (such as ICQ traffic). These commands
    execute at the final phase of the ShareTheNet boot process.


    # Requirements


    The years I''ve spent making ShareTheNet work have taught me many lessons in to
    make Linux perform in a very limited environment. After looking at the many "embedded
    Linux" products available for free or fee today, I felt that a simple, well explained,
    nuts-and-bolts example of an extremely small Linux toolkit would serve the developer
    community well. Therefore I decided to risk more hours of staring blankly at messages
    like the following while building the Embedded Linux Workshop:


    Kernel panic: No init found. Trying init= option to kernel.'
