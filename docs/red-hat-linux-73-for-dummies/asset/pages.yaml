  md: '# Chapter 11: Growing More Applications


    # Moving files and directories


    Moving a file or directory is as simple as clicking and dragging the item you
    want to move to the directory that you want to move it. Release the button and
    you have moved your file or directory.


    You can move multiple files by clicking and dragging the mouse cursor over the
    files that you want. The mouse cursor creates a rectangular outline and highlights
    all the files within that box. Next, click anywhere within the highlighted box
    and drag the cursor to the desired directory. Release the mouse button and the
    files move to the specified directory.


    # Copying files and directories


    Copying a file or directory is a bit more complicated than moving one. Rather
    than simply clicking and dragging an icon something, you have to right-click the
    file or directory icon and choose Copy from the menu that appears, as shown in
    Figure 11-2. The menu lists all the options available from the File Manager. Choose
    Copy and another dialog box appears. Within that dialog box, you can manually
    enter the pathname of where you want to copy the file, or you can use the Browse
    function. If you click Browse, yet another dialog box appears, and you can click
    and search for the target directory.


    ![](img/5275bfa3908ad63320aaea42eefe467c_182_0.png)


    Figure 11-2: Choose Copy from the File menu.


    Prepare the selected files to be copied with a Paste command.'
