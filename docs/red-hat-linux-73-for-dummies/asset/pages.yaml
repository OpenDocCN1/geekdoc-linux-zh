  md: '# How This Book Is Organized


    Like all proper For Dummies books, this book is organized into independent parts.
    You can read the parts in any order. Heck, try reading them backwards for a real
    challenge. This book is not meant to be read from cover to back; rather, it was
    meant to be a reference book that helps you find what you''re looking for when
    you''re looking for it. Between the Contents at a Glance, the Table of Contents,
    and the Index, you should have no problem finding what you need.


    If you read the book in order, you encounter the useful and interesting things
    first and the more technical items last. For instance, after installing Red Hat
    Linux in Part I, you may want to immediately proceed to Part II to see how to
    connect Linux to the Internet or your local network. From there, you can use your
    new workstation to surf the Internet and use e-mail.


    The following sections describe each part.


    # Part I: Installing Red Hat Linux


    In Part I, you find out what Linux is and how to prepare your computer to install
    Red Hat Linux. Then we walk you through installation and show you the basics of
    working with Red Hat Linux.


    # Part II: Got Not?


    In Part II, you find out about connecting to the Internet and local networks.
    You see how to jump on the Internet with your everyday modem or high-speed (broadband)
    DSL or cable modem. We also show how to connect to an existing network. If that
    local network has a high-speed Internet connection, then you can use it as your
    portal to the wonderful world of surfing. The Internet can be dangerous, so we
    include instructions on creating your own firewall. Finally, we show you how to
    use Mozilla to satisfy your browsing and e-mails.


    # Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Part III guides you through the glorious particulars of actually doing something
    with Red Hat Linux. You''re introduced to the GNOME desktop window environment.
    You''re taken through its paces by moving, resizing, hiding,'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Introduction


    closing windows, using the file manager, and much more. Two chapters are devoted
    to using the Red Hat Linux multimedia capabilities. You can listen to CDs and
    MP3s, as well as rip and record them. The world''s radio stations are now available
    to you with streaming media technology. The full-featured StarOffice desktop productivity
    suite is described in some detail. You can use StarOffice with your Red Hat machine
    to do all your writing and other work-related functions. You can even write a
    book with it! Finally, you see how to get organized with Red Hat.


    # Part IV: Revenge of the Nerds


    In Part IV, you''re guided through the processes necessary to care for and feed
    your new Linux computer. It''s real nerd city but fun in its own way. Topics such
    as file management are introduced. We also introduce the package management system
    — called RPM. We also devote an entire chapter to the art of troubleshooting and
    take you through the process of configuring the X Window System, which is the
    basis for all Linux graphics.


    # Martha Stewart we''re not:

    Other uses for CD-ROMs


    When computers abound, so do CD-ROMs. Eventually these CD-ROMs become obsolete
    or are never installed — that''s the case with software products that arrive without
    advertising. What can ecologically minded people do with these CDs that they don''t
    fill up landfills?


    +   - Use those defunct CDs as coasters for drinks.


    +   - Make pretty mobiles out of castaway CDs. (The sun shining off the CD-ROMs
    makes wonderful rainbows on the wall.)


    +   - Make CD-ROM clocks and give them to all your friends at the holidays. Just
    pur-chase inexpensive quartz crystal clock motors (complete with hands) and use
    the CD-ROM as the face of the clock. I have


    four of these clocks out of Windows NT CD-ROMs — hey, can you imagine a better
    use for them?


    +   - Make a nice flowerpot. Use a heat to melt a CD-ROM around the base of a
    water tumbler, or make an astray. Of, plug the hole and if you try this at work
    you could cause some在了 among management, particularly after they find out that
    one of the more expensive programs they''ve purchased ended up at the bottom of
    a flowerpot.


    For now, please let your Red Hat Linux 7.3 For Dummies CD-ROMs in a safe place,
    such as the sleeve in the back of the book, when you''re not using it.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 6 Red Hat Linux 7.3 For Dummies


    # Part V: The Part of Tens


    A Dummies book just isn''t complete without The Part of Tens, where you can find
    ten all-important resources and answers to the ten most bothersome people-have
    after installing Red Hat Linux. (The folks at Red Hat Software provided these
    questions.)


    # Part VI: Appendixices


    Finally, the appendices. Appendix A describes how to find out about the details
    of your computer''s individual pieces of hardware; this is sometimes helpful when
    installing Red Hat Linux. Appendix B revisits the Red Hat Linux installation system
    using the Text mode. The nongraphical installation system—known as the Text mode—is
    described in case the installation system can''t use your graphics driver. In
    Appendix C, instructions are given for using the facto Linux text editor vi. In
    Appendix D, you find out all you need to know about the Linux pages. Appendix
    E finishes by describing what you can find on the companion CD-ROMs.


    # You''re Not to Read


    Heck, you don''t have to read any of the book if you don''t want to, but why did
    you buy it? (Not that we''re complaining.) Part I has background information.
    If you don''t want it, don''t read it. Also, text in sidebars is optional, although
    helpful. If you''re on the fast track to using Linux, you could skip the sidebars
    and the text with a technical stuff icon. But we suggest instead you slow down
    a bit and enjoy the experience.


    # Icons in This Book


    ![](img/5275bfa3908ad63320aaea42eefe467c_29_0.png)


    Nifty little shortcuts and timesavers. Red Hat Linux is a powerful operating system,
    and you can save unbelievable amounts of time and energy by using its tools and
    programs. We hope our tips show you how.


    ![](img/5275bfa3908ad63320aaea42eefe467c_29_1.png)


    Don''t let this happen to you! We hope that our experiences with Red Hat Linux
    will help you avoid the mistakes made.'
  merge: -1
