- img_proc: true
  md: '# Part IV: Revenge of the Nerds


    Your Red Hat Linux machine is the foundation of your network and must be set up
    correctly for anything to run. If it isn''t working, or if you have an unusual
    setup (or Murphy is in a bad mood), you can check for several different causes.


    We use the Red Hat Linux network as the troubleshooting example in this chapter.
    The Red Hat Linux network is one of the more difficult things to set up correctly
    because it not only depends on your Linux computer, but other computers as well.
    Suppose that your Red Hat Linux network is not working. We use the following sections
    as a simple fault tree that you can follow to troubleshoot your network.


    ![](img/5275bfa3908ad63320aaea42eefe467c_307_0.png)


    Please see the Part of Tens chapters for insights into other problems. Chapter
    21 describes how to find information about your Red Hat Linux computer; it also
    points out where you can get. Chapter 22 discusses some of the simple, frequently
    encountered problems that people have with Red Hat Linux. Chapter 23 describes
    ten security fixes.


    # Ticking through Your Linux Networking Checklist


    We describe the most likely problems in order from most simple to most complex.
    After cataloging the problems, we look at one of the branches of the fault tree
    to solve a problem.


    # Is the power turned on? Check


    First verify that you turned on the power. Sounds simple, but hey, sometimes the
    simplest things go wrong.


    # I am an engineer


    An experienced electrical engineer and Linux author once got really angry with
    a cable TV company. His cable service went dead in the middle of a Philadelphia
    Eagles game. They were losing, the Eagles don''t appear on TV much in Albuquerque.
    The cable company called immediately. Blah! Blah! Blah! My connection... Blah!
