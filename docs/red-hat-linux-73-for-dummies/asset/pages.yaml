    The following list describes the differences between these views:


    +   - Icons view: Displays the symbol (icon) and indicates whether an item is
    a file or directory. Regular file icons take several forms, but text and configuration
    files look like pieces of paper with a corner folded, and executable files look
    like pistons. Links, devices, and so on take other forms. Directories take the
    form of a partially open file folder. Icons tend to make distinguishing files
    and directories easier but take more space on screen.

    - List view: Displays the size and time stamp of each file and directory, as well
    as their names.

    - Custom view: Enables you to choose what file attributes to display. You can
    select the attributes by choosing Settings<Preferences and selecting the Custom
    view tab. From there, you can add and delete the attributes from a list of possible
    attributes.


    Running programs and scripts

    Nautilus is such a hard worker that it happily launches commands for you. Right-click
    the icon that you want to run to open a submenu, and then choose Open. For example,
    if you click the xclock icon in the /usr/bin/X11 directory, the xclock appears
    on your desktop. (Double-clicking the icon also works.)'
