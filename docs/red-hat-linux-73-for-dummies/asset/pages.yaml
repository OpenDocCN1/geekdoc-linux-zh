  md: '# Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the move command. No, you''re
    not really moving the file, but in Linux (Unix), the developers realized that
    renaming something was a lot like moving it. The format of the move command is


    ```

    mv source destination

    ```


    With your example files from the preceding section, you can move the file named
    airfair to newfair by executing the following command:


    ```

    mv airfair newfair

    ```


    This command leaves the file in the same directory but changes its name to newfair.
    So you see the file was not moved, but just renamed.


    Now moving the newfair file to the vacation directory. To do that, you have to
    first move the file up and then move it into the vacation directory. You can do
    it with one command:


    ```

    mv newfair ../vacation

    ```


    The destination file uses the .. (or parent directory) designation. This command
    tells Linux to go up one directory level and look for a directory called vacation,
    and then put the file into that directory with the name newfair, because you did
    not specify any other name. If you instead did this


    ```

    mv ../vacation/newplans

    ```


    the newfair file would move to the vacation directory named newfair. Note that
    in both cases (the file maintaining its name of newfair or taking the name newplans),
    your current directory is cancun, and all your filenames are relative to that
    directory.


    Strictly speaking, the file still has not moved. The data bits are still on the
    same part of the disk where they were originally. The file specification (the
    directory path plus the filename) that you use to talk about the file is different,
    so it appears to have moved.


    In early versions of Unix, you were not allowed to mv a file to one disk partition
    to another; you could only copy it by the cp command. Linux allows you to use
    the mv command to move a file anywhere. Usually, mv leaves the data in place and
    just changes the file''s name or the directory where the name is placed. But when
    the file is moved across disk partitions (for example, from /usr/home in a lot
    of Linux systems),


