    # Working with E-Mail


    Besides its browsing and Web design capabilities, Mozilla can send and receive
    e-mail, too. This section describes how to send and receive messages with Mozilla''s
    e-mail program. We show you how to set Mozilla to be your e-mail client in the
    "Setting Up Mozilla" section earlier in this chapter.


    # Getting your e-mail


    To get your e-mail, you first need to start Mozilla Messenger by choosing Tasks:
    Mail. The Mozilla INBOX appears, as shown in Figure 9-10.


    To get your e-mail, simply click the Get Msg icon. This icon tells Mozilla to
    make contact with your mail server and see whether any e-mail messages are waiting
    for you. If you have no e-mail, a message at the bottom of the screen tells you
    so. If you do have e-mail, the subject and sender appear in the center of the
    screen, and the e-mail itself appears at the bottom of the screen, as shown in
    Figure 9-11.


