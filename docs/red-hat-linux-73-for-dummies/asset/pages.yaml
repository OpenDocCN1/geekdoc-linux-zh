    In any case, the purpose of this section is not to show you all the functionality
    of the l1pq command. Rather, the synopsis section shows in a shorthand how you
    should use the command, including which arguments are optional.


    Another confusing thing you see is the ... notation. Looking back at the l1pq
    command, you see it twice, once following the job # argument, and once following
    the user argument. This notation tells you that you can list as many job numbers
    on the line as you want, separated by spaces, and as many user names as you want,
    separated by spaces.


    Sometimes you see a command argument that begins with one hyphen ( ) or two --.
    These notations are technically known as options, whereas job # and user of the
    l1pq command are arguments. Options tell the command how to manipulate arguments.
    You may see an option line that looks like this:


    ```

    cat [-benstuvAET]

