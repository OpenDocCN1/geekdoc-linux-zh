    # Setting Up DNS


    Finding your way around the Internet would be nearly impossible if not for the
    Domain Name Service (DNS) system. This system converts the dot type of name format
    into a numeric Internet Protocol (IP) address. An example of an IP address is
    198.59.115.2. All the information that flows across the Internet (Web browsing,
    e-mail, and so on) is carried by IP packets that source and destination IP addresses.
    When you go to www.redhat.com, for example, that name is converted into a numeric
    IP by DNS.


    Unless you want to do all your browsing and e-mail by remembering numeric IP addresses,
    you must set-up own DNS. Your ISP provides you with one or two DNS server addresses,
    such as 198.59.115.2. You need to tell Linux about the DNS servers before you
    can browse the Internet. To do so, follow these steps:'
