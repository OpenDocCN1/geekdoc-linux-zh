    # The many faces of DSL


    Of the numerous types of consumer DSL service, the most common is Asymmetrical
    DSL (ADSL). The other types are more suited for business use. Most locals will
    only have access to two or three of these services. The following list describes
    the DSL variations.


    G.Lite is DMT incompatible, so it requires a modem different than the ADSL models
    in use today.


    +   ADSL (Asymmetrical DSL): ADSL uses a single twisted-pair POTS line. ADSL''s
    upstream and downstream speeds are different. Individual consumers use the Internet
    to browse the Web more than any function. Browsing involves downloading data more
    often than uploading information. Therefore, the DSL provider can minimize its
    infrastructure and costs by taking advantage of the customers'' usage pattern
    and provide with lower-cost, effectively high-speed, service.


    +   HDSL (High bit-rate DSL): HDSL is a symmetrical protocol with both downstream
    speeds equal. You can use HDSL as a substitute for T1 connections because it provides
    the same data rates as 1.544 Mbps. HDSL also provides the same rate of 2.048 Mbps
    as E1 connections in Europe.) This technology uses two loops (4 wires) and works
    up to 6,000 feet; it requires repeaters to go up to a maximum of 12,000 feet.


    +   HDSL2 (High Bit-rate DSL 2): HDSL2 provides the same specifications as DSL
    but works over a single twisted-pair connection.


    +   ISDN (Digital Subscriber Loop): ISDN is the successor to the current ISDN
    technology. It uses the same line encoding (2B1Q) as ISDN and DSL. Unlike ISDN,
    ISDN requires only a single line. ISDN is mostly used to provide DSL service in
    areas where the more popular forms, such as ADSL and DSL, are not available. ISDN
    is capable of providing upstream and downstream rates of 144 Kbps.


    +   G.Lite: Also known as Universal DSL and splitterless ADSL, G.Lite is a low-version
    of ADSL that doesn''t require filtering out the POTS signal. It provides up to
    15 Mbps downstream and 512 Kbps upstream.'
