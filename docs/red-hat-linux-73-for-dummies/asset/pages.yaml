  md: '# About the Authors


    Jon "maddog" Hall is the Executive Director of Linux International, a vendor organization
    dedicated to promoting the use of the Linux Operating System. He has been in the
    computer industry for over a quarter of a century (somehow sounds more impressive
    than just “25 years”), the past 18 years of which have been spent using programming,
    and admiring the UNIX Operating System. Currently, Jon works for Compaq Computer
    Corporation, where he is helping to shape Compaq''s strategy with respect to Linux.
    Previously, Jon was the Department Head of Computer Science at Hartford State
    Technical College, where his students lovingly (he hopes) gave him the nickname
    "maddog" as he tried to teach them operating system design, compiler theory, and
    how to live an honorable life.


    While working for Digital Equipment Corporation in May of 1994, maddog met Linus
    Torvalds, and was intelligent enough (his critics say maddog was just lucky) to
    recognize the potential of the Linux Operating System changed his life, mostly
    by providing him with 22-hour workdays. Since maddog started working with Linux,
    however, he has also started meeting more girls (in particular, his two grandchildren).
    You can usually find Jon speaking at various Linux conferences and events (maddog
    just barks), and he has also been known to travel long distances to speak to local
    Linux groups.


    Paul G. Sery is a Computer Engineer employed by Sandia National Laboratories in
    Albuquerque, NM, USA. He is a member of the Computer Support Unit, Special Projects,
    which specializes in managing and troubleshooting UNIX and Linux systems.


    When he is not beating his head against systems administration problems, he and
    his wife Lidia enjoy riding their tandem through the Rio Grande valley. They also
    enjoy traveling throughout Mexico. Paul is the author of LINUX Network Toolkit,
    Hungry Minds, 2000, and the co-author of several other books. He has a bachelor’s
    degree in Electrical Engineering from the University of New Mexico.'
