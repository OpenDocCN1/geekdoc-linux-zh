  md: '# Appendix C: vi Me


    the bottom-left corner would display the following line:


    ```

    / /etc/hosts [readonly]

    ```


    When you first invoke vi, you are in visual command mode, which is the default.
    You can use four special commands to either locate text or transition to more
    complex commands:


    +   / Forward search

    ? Backward search

    n Continue the search in whichever direction you were currently going down

    : ex command (ex is the line editor included in vi)


    In command mode, the characters you type are used as commands, not as input into
    the file. To use commands, type the character on the command line. For the first
    two search commands (/ and ?), the cursor moves to the bottom of the screen, where
    you type the string that you are searching for. After you press Enter, the search
    begins. If you want to search for an additional string, you can just press the
    lowercase n key to reexecute the search; to search backwards, press the uppercase
    N key.


    When you type : , the cursor moves to the bottom of the screen and waits for you
    to enter a command or a command string. You must press the Enter key to execute
    the command.


    Given that characters you type are interpreted as commands in command mode, how
    do you get from command mode to text mode? Simple. Enter a command to do something
    in text mode and vi takes you there. Here are some commands that you can use to
    switch from command mode to text mode:


    +   i Insert text before the cursor

    a Insert text after the cursor

    I Insert text at the beginning of the current line

    A Insert text at the end of the current line


    As soon as you type any of these commands, Linux puts you in text input mode.
    Do not press Enter after entering the command. Any text you type after you invoke
    the command is placed in a buffer and echoed to the screen.


    You may be asking yourself (because the directions are skimpy and you have no
    one else to ask), "How do I get out of text mode and back to command mode?" Again
    the answer is simple: get out, just press the Escape (Esc) key, and you are immediately
    whisked back to command mode. That''s pretty easy, isn''t it?'
