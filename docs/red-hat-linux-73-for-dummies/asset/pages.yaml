  md: '# Chapter 16: Filing Your Life Away


    # 251


    # # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission):


    +   * Read permission** for a file enables you to read the file. For a directory,
    read permission allows the `ls` command to list the names of the files in the
    directory. You must also have execute permission for the directory name to use
    the `-l` command or to change to that directory.


    +   * Execute permission** for a file means you can modify the file. For a directory,
    you can create or delete files inside that directory.


    +   * Execute permission for a file means you can type the name of the file and
    execute it. Unless you also have read permission. This means that that files containing
    executable Linux commands, called *shell scripts*, must be both executable and
    readable by the person executing them. Programs written in a compiled language
    such as C, however, must have only executable permissions, to protect them from
    being copied where they shouldn''t be copied.


    For a directory, execute permission means that you can change to that directory
    (with `cd`). Unless you also have read permission for the directory, `ls -` won''t
    work. You can list directories and files in that directory, but you can''t see
    additional information about the files or directories by just using an `ls -l`
    command. This may seem strange, but it''s useful for security.


    The first character of a file permission is a hyphen (-) if it is a file; the
    first character of a directory is d. The other nine characters are read, write,
    and execute positions for each of the three categories of file permissions:


    +   * Owner (also known as the user)


    +   * Group


    +   * Others


    Your vacationtime file, for example, may show the following permissions when listed
    with the `ls -l` vacationtime command:


    ```

    -rw-rw--r--

    ```


    The hyphen (-) in the first position indicates that it is a regular file (not
    a directory or other special file). The next characters (rw-) are the owner''s
    permissions. The owner can read and write to the file but can''t execute it.


    ![](img/5275bfa3908ad63320aaea42eefe467c_274_0.png)'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 252 Part IV: Revenge of the Nerds


    The next three characters (rw-) are the group''s permissions. The group also read-write
    access to the file. The last three characters (r--) are the others'' permissions,
    which are read-only.


    [r][rw][-- illustrates the four parts of the permissions: the file type followed
    by three sets of triplets, indicating the read, write, and execute permissions
    for the owner, group, and other users of the file (meaning everyone else).


    You can specify most file permissions by using only six letters:


    +   - ugo, which stands for — no, not a car — user (or owner), group, and other

    - rwx, which stands for read, write, and execute


    These six letters, and some symbols such as = and commas, are put together into
    a specification of how you want to set the file''s permissions.


    The command for changing permissions is chmod. The syntax for the


    ```

    chmod specification filename

    ```


    Change the mode of vacationtime to give the user the ability to read, write, and
    execute the file:


    ```

    u=rwx vacationtime

    ```


    That was easy enough, wasn''t it? What if you want to give the group permission
    to only read and execute the file? You would execute the following command:


    ```

    g=rx vacationtime

    ```


    Note that this last command does not affect the permissions for owner or other,
    just the group''s permissions.


    Now set all the permissions at once. Separate each group of characters with a
    comma:


    ```

    u=r,g=rw,o=rwx vacationtime

    ```


    This command sets the user''s permissions to just read, the group''s permissions
    to read and write, and the other''s permissions to read, and execute.


    You can set the permission bits in other ways. But this way is so simple, why
    use any other?'
