    ```


    In this case, the "c" option means to use tar to copy the specified files and
    directories. The "z" option tells tar to compress the data. The "f" option defines
    the text that follows it — username.tgz — as the file to copy the files to. The
    single dot ". says to copy all the files in the current working directory to another
    archive.


    3. Use OpenSSH to copy the tar archive to another location.


    ```

    scp username.tgz myloginaccount@myisp.com

    ```


    This command securely copies the tar archive to the account myloginaccount@myisp.com.


    # My Buffer Overflow-eth


    The most popular way hackers use to break into computers is with buffer overflows.
    The buffer overflow technique attempts to feed crazy streams of data to programs
    to make them behave in ways that their designers never intended. (It is beyond
    the scope of this book to describe what a queue details in detail. Suffice to
    show that Linux uses a queue and addresses for later use.) The end result of the
    buffer overflow is that sometimes the program will provide the hacker with a shell
    or other open door when it fails.


    The unintended shell is an open door to your computer. Sometimes the shell has
    root — superuser — privileges and then the hacker wins your system.


    Here are some simple techniques you can use to minimize buffer overflows:


    +   - Minimize the number of services that you run. You run zero risk of compromise
    from a buffer overflow vulnerability in service A if you do not run that service.


    +   - For instance, the Lion worm wrecked havoc in the spring of 2001. Lion practised
    vulnerability in the Linux sendmail and lpd printer services. Computers that did
    not run those services were not vulnerable to the Lion worm.


    +   - Update your Red Linux computer as often as possible. Red Hat posts updates
    that fix vulnerabilities as they become available. Buffer overflow fixes comprise
    many of the package updates. Updating your system will fix many buffer overflow
    vulnerabilities.'
  merge: -1
