  md: '# 78 Part II: Got Net?


    If you''re ready to make the switch to a DSL or cable Internet connection, believe
    us when we tell you you''ll never go back to a dial-up modem. This chapter describes
    how to obtain and configure a broadband connection. We start out by describing
    how the systems work in general. We then describe how to use several different
    manufacturers systems.


    ![](img/5275bfa3908ad63320aaea42eefe467c_101_0.png)


    # Introducing DSL and Cable Connections: The Proof Is in the Wiring


    Although today''s telephone network system is modern in many ways, it hasn''t
    fundamentally changed since the early 20th Century. The network consists of pairs
    of copper wire that connects homes and businesses with a telephone company''s
    central offices (CO). The phone company uses switches between its central offices
    to connect you to your destination when you make a call. The switches are designed
    to limit the range of frequencies — called bandwidth — that phone call can use.
    The bandwidth is roughly 3,000 cycles per second (Hz), which is enough to recognize
    a voice, but not a whole lot. More items prevent today''s analog modems from pushing
    more than approximately 56,000 bits per second, or 56kb, through the telephone
    lines. (That 56kb speed varies, by the, depending on the amount of Internet traffic
    your modem''s connecting.)


    ![](img/5275bfa3908ad63320aaea42eefe467c_101_1.png)


    What does all this mean to you? Improve your modem and the wiring, you''ll end
    up with faster internet access. Two of the most commonly-used broadband alternatives


    +   - Cable Television (CATV): Although CATV companies do not provide service
    to as many residences and businesses as the telephone companies do. their coaxial
    cable networks can carry much more bandwidth than telephone wires can. CATV networks
    do not have the 3 to 4 mile limits that DSL has. Typically, you can get Internet
    cable through the CATV company if 1) they offer it and 2) they serve your neighborhood.'
