  md: '# 354 Part VI: The Appendixes


    +   * **IP address.** This is the numeric network address of your Linux computer
    and is what your computer is known as on your local network and in many cases
    — the Internet. If you haven''t registered your private network''s (also known
    as local networks or LANs) address space with the InterNic (the organization that
    is in charge of distributing IP addresses), then you can use the public address
    space that goes from 192.168.1.1 to 192.168.254.254.


    +   * **Netmask.** Private networks based on the Internet Protocol (IP) are divided
    into subnets. The netmask determines how the network is divided. For addresses
    such as the one in the preceding bullet (192.168.1.1, and so on), the most common
    netmask is 255.255.255.0.


    +   * **Default gateway.** This is the numeric IP address of the computer that
    connects your private network to the Internet (or another private network). Red
    Hat guesses the address 168.1.254, for example, if you choose an address of 192.168.1.1
    (1-254) for the IP address. You can accept this, leaving it as a better option,
    unless that address is your actual gateway. Chapter 15 describes how to configure
    your Linux computer to connect to the Internet via a telephone connection. If
    you do that, setting a default route now can interfere with your connection.


    +   * **Primary nameserver.** The Internet Protocol uses a system called Domain
    Name Service (DNS) to convert names such as `redhat.com` into numeric IPs. Red
    Hat makes a guess based on the IP address and netmask that you use. We suggest,
    however, leaving this box blank, unless you are on a private network with a nameserver
    or will be connected to the Internet (your ISP will supply a DNS). When you designate
    a nonexistent nameserver, then many networking programs work very slowly as they
    wait in vain for the absent server.


    +   * **Secondary and Tertiary nameservers (IPs).** These are the addresses of
    the second and third DNS servers that your computer will use. They are the generally
    addresses of your ISP nameservers.


    +   6. When finish with this dialog box, select the OK button and press Enter.


    +   7. Enter the host, or FQDN, name for your computer. The host name consists
    of your machine''s alias and domain name. For instance, if you want to call your
    computer “veracruz” and your domain name is “paunchy.net”, then your FQDN is veracruz.paunchy.net.
    (You can also use just your computer name — veracruz — if you want. The FQDN is
    more descriptive however.)'
