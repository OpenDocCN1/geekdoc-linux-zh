    # My CD-ROM Isn''t Detected


    **Problem:** You are installing Linux, but it doesn''t find your CD-ROM.


    **Solution:** Most newer CD-ROMs are either EIDE (ATAPI) or SCSI, and most newer
    computer systems have enough support to see either the ATAPI CD-ROMs or the SCSI
    CD-ROMs, so CD-ROM support is not quite much as an issue in the early days. In
    addition, some older systems and CD-ROMs are now supported.


    Early CD-ROMs pretended to be other devices (such as tape drives or floppies)
    to fool the computer system into using them, but these CD-ROMs were hidden from
    the detection system. If your system is one of these, don''t despair. You can
    supply information to help Linux find your CD-ROM.


    First look at the preceding section about hard drive numbering. This enables you
    to figure out the name that Linux would call your CD-ROM if Linux knew about it.
    If you have an EIDE, ATAPI CD-ROM, type the following line whenever you see the
    lhdX prompt while booting or installing your system:


    ```

    linux hdxX=cdrom

    ```


    where X is the number your CD-ROM would have if it could be detected.'
