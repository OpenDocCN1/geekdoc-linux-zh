- img_proc: true
  md: '# 98 Part II: Got Not?


    Although forming a private network isn''t exactly rocket science, describing in
    detail how to network two or more computers is still beyond the scope of this
    book because there are so many possible network configurations. Many good books
    are available that explain how to do that, and you can consult the /usr/doc/HOWTO
    directory of your Red Hat Linux installation. Use the Ethernet-HOWTO, Networking-Overview-HOWTO,
    NET-3-HOWTO, and NET-3-4-HOWTO for more information on networking.


    # Going Local


    The invention of Linux has revolutionized the use of networks. Creating a LAN
    prior to Linux was complicated and expensive. LANs were nearly the exclusive domain
    of big corporations, universities, and other monstrous organizations.


    But TCP/IP networking was built into Linux from the beginning. In the mid-1990s,
    if you could afford a couple of PCs, a cheap piece of coaxial cable, and a 10
    Mbps (megabits per second) or faster Ethernet adapters, a LAN was born! The Ethernet
    adapters, which are also commonly known as network interface cards (NICs), cost
    about $150 at the time: Prices fortunately have crashed since then, falling to
    earth like David Bowie: A 100 Mbps NIC now costs as low as $15, and you can buy
    an 11 Mbps wireless NIC for less than $100!


    To get your Red Hat computer on a network, you have to configure a handful of
    networking subsystems. Here''s what needs to occur for your networking to work:


    +   - Load your wireless or Ethernet NIC kernel module. Linux generally detects
    your hardware and loads the correct kernel modules.

    - Configure your network interface card (NIC).

    - Configure your domain name service (DNS), which converts Internet names into
    Internet Protocol (IP) addresses.


    Wireless networking currently suffers from some security vulnerabilities. Please
    consult the sidebar, "Wireless network warning."


    Performing these steps is pretty heavy lifting. The load is eased somewhat by
    using the graphical Network Configuration system administration tool provided
    by Red Hat. (Red Hat likes to refer to its various configuration utilities as
    "Druids." Your guess about how programmers came up with that convention is as
    good as ours, regardless of their name, Druids work very well.) You can also use
    individual commands to perform the same configuration. Both methods are described
    in this chapter. Have fun!


