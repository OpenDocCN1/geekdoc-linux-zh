  md: '# Chapter 13


    # Using Streaming Media and RealPlayer


    In This Chapter


    +   - Listening to live radio with RealPlayer

    - Listening to broadcast MP3s

    - Viewing video clips with RealPlayer


    One of the coolest Internet innovations is streaming technology used for audio
    and video files. Streaming technology provides a continuous flow of audio and
    picture from a variety of sources in real time. Video streaming (movie, television,
    and so on) online is still somewhat limited, especially on slower connections,
    but the force of streaming media is certain to explode in the near future as broadband
    connections become more common.


    This chapter describes how to use your Red Hat Linux machine as both a radio and
    a TV using the popular RealPlayer streaming audio/video client. Configuring your
    Internet connection, firewall, and Mozilla browser in earlier chapters of this
    book, you''ve done most of the heavy lifting. All you need to do is download RealPlayer
    8 and configure it.


    ![](img/5275bfa3908ad63320aaea42eefe467c_206_0.png)


    You can also play video and audio clips using the gtv player (although you can''t
    play Real files in gtv — you need RealPlayer for that). The gtv program plays
    MPEG-formatted video files. It''s installed by default on your Red Hat Linux machine.
    Click the GNOME Main Menu button and choose Programs>Multimedia:gtv.


    # Configuring Your Red Hat Box


    You can think of your Red Hat Linux computer as a simple appliance. Though it
    does all the usual, diverse computersesque things, it can also work like any old,
    garden-variety radio. Downloading Real Audio''s free RealPlayer software enables
    you to listen to radio stations — and any other streaming audio — from around
    the world, and to watch video (which we discuss towards the end of the chapter).'
