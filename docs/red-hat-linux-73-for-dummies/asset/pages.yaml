  md: '# Chapter 19: Bringing In the Red Hat Repairman: Troubleshooting Your Network
    291


    The genmask is used to separate the parts of the IP address that are used for
    the network address from the host number. The flags are used to indicate things
    like U for up and G for gateway. The metric is used as a measure of how far a
    packet has to travel to its destination (a number greater than 32 is considered
    to be infinite). The two flags — Ref and Use — are not important for this discussion.


    The loopback field shows what network interface is being used (eth0 refers to
    an Internet interface and lo for the loopback interface; the loopback interface
    is used internally by the Linux kernel and you should not have any need to use
    it). The information about each interface — the routing table — is displayed below
    the headings. For example, the first line tells Linux to send packets for addresses
    of 192.168.1.0 through 192.168.1.255 to the Ethernet adapter. The second line
    deals with the kernel''s internal loopback interface. The third and last line,
    with the address of 0.0.0.0, is known as the default route. It defines where to
    send all packets that are covered by a specific route.


    # Defining a route to the loopback interface


    You must have a route to the loopback interface (also referred to as lo), which
    is the 127.0.0.0 address. If you''re missing either or both parameters, you must
    set them. To set the loopback device — which must be set for the network adapter
    to work — type the following command:


    ```

    route add -net 127.0.0.0

    ```


    To set the route for the network adapter and your local network, type the following
    command:


    ```

    route add -net 192.168.1.0

    ```


    This route is assigned automatically to your network adapter. But if you want
    to assign it explicitly, type the command as follows:


    ```

    route add -net 192.168.1.0 dev eth0

    ```


    Type netstat -r -n to see your routing table. You should see entries for the loopback
    and the Ethernet. If you don''t see a route to your network interface, try repeating
    the preceding steps. You may have to delete a route. To delete a route, type the
    following command:


    ```

    route del 192.168.1.0

    ```


    Note that we use the network address instead of a host address here. The zero
    (0) designates the class C network address of 192.168.1.1.'
