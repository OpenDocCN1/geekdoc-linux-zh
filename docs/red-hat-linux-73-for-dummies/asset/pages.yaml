    # Hard drive controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs, and newer PCs usually have two IDE controllers
    rather than one. For each IDE controller, your system can have only two hard drives:
    a master and a slave. Therefore, with a PC with two IDE controllers can have up
    to four hard drives. You should know which hard drive is which. Also, if you have
    a Windows system that you want to pre-serve, you should know which hard drive
    resides on. The following is the normal configuration on a Windows system:


    +   - The first controller''s master drive is called C.

    - The next hard drive is called D and is the slave drive on the first controller.'
