  md: '# # Chapter 9


    # # Surfing the Web and Managing E-Mail with Mozilla


    # In This Chapter


    +   - Introducing Mozilla

    - Tailoring Mozilla to your liking

    - Checkin'' out da Web

    - Receiving and reading e-mail

    - Sending e-mail messages and attachments


    > Once upon a time, there was a company called Netscape that created a browser
    to surf the Internet. The browser was called Netscape Navigator and after that
    Netscape Communicator, and millions of people downloaded it from the Internet
    for free. Netscape put in the hands of millions of people — including us, your
    authors — the power to access the exploding number of Web servers. Netscape Navigator
    made history and changed the world because it changed the Internet from a medium
    that served scientists into a tool that anyone could use.


    Even though Netscape Communicator is freely distributed to anyone who wants it,
    Netscape Communicator is not open source software in the same way that Linux is.
    Quite simply, Netscape Communicator is a money-making venture, and Netscape considers
    the way the software works to be proprietary.


    On the other hand, Netscape recognizes the importance of the open source dynamic,
    which is why it released an open source version of Netscape called Mozilla. Now,
    countless numbers of people are developing and enhancing Mozilla, which is the
    default browser for Red Hat computers.


    Open source software uses a license that basically says, "You can use and modify
    this software in any way as long as you don''t prevent anyone else from doing
    the same." The open source license has enabled Linux and many other software systems
    to grow and develop.


    ![](img/5275bfa3908ad63320aaea42eefe467c_150_0.png)'
  merge: -1
