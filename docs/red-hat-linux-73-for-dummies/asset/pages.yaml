  md: '# Chapter 16


    # Filing Your Life Away


    # In This Chapter


    +   - Discovering the ins and outs of files and directories

    - Finding your way through the Linux file system

    - Moving around in the Linux file system

    - Creating, moving, copying, and destroying directories and files

    - Giving permissions and taking them away


    In this chapter, you take your first steps through the Linux file and directory
    structure. Don''t worry, Linux may live a structured life, but it''s still very
    flexible. With a little bit of introduction, you''ll understand the Linux way
    of life.


    We also introduce you to file types, subdirectories, and the root — which is not
    at all — You''re also shown the way home — to your home directory, that is. After
    you''re oriented with the Linux files and directories structure, we show you how
    to make some changes, such as how to copy and move files and directories, as well
    as how to destroy them.


    # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and keep them separate. For instance, the text that makes up this chapter is stored
    in a file; all the others are stored in their own files. Follow the bouncing prompt
    as we make short work of long files.


    We use the command line interface (CLI) to examine file and file system basics
    in this chapter. Graphical User Interfaces, such as Nautilus, are great, and we
    use them extensively in this book. However, we believe that using a CLI is better
    for learning this subject. All the examples in this chapter use the Gnome Terminal
    Emulation Program to provide the CLI.


    ![](img/5275bfa3908ad63320aaea42eefe467c_258_0.png)'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Storing files


    We’re going to go ahead and assume that you know that a file is a collection of
    information that is identified by a filename, and that Linux can store multiple
    files in directories as long as the files have different names. Linux stores files
    with the same name in different directories.


    Each directory may contain only one file with the same name.


    Wonderful or not. Linux filenames can be as long as 256 characters. They can contain
    uppercase and lowercase letters (also known as mixed case), and special characters,
    such as the underscore (_), the dot (.), and the hyphen (-). Because filenames
    can be made up of mixed case, and each name is distinct, we can call these names
    sensitive. For example, the FILENAME, and FileName are unique filenames of different
    files (such as Compaq’s OpenVMs), but they are the same filename.


    Although filenames can technically contain wildcard characters, such as the asterisk
    (*) and the question mark (?), using them is not a good idea. Various command
    interpreters, or shells, use wildcards to match several filenames at one time.
    If your filenames contain wildcard characters, you’ll have trouble specifying
    filenames that don’t contain spaces or other characters that have meaning to shells.
    In this case, Linux filenames are different from DOS and Windows filenames.


    # Sorting through file types


    Linux files can contain all sorts of information. In fact, Linux sees every device
    (disks, display, keyboard, and so on) except for network interfaces as a file.
    The following five categories of files will become the most familiar to you:


    +   * User data files contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex data files, such as graphics or spreadsheet files, must
    be interpreted and used by special programs. These files are mostly illegible
    if you look at them with a text editor, because the contents of these files are
    not always ASCII text. Changing these files generally affects only the user who
    owns the files.


    +   * System data files are used by the system to keep track of users on the system,
    logins, passwords, and so on. As system administrator, you may be required to
    view or edit these files. As a regular user, you don’t need to be concerned with
    system data files except, perhaps, the ones that you use as examples for your
    own private startup files.


    ![](img/5275bfa3908ad63320aaea42eefe467c_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Chapter 16: Filing Your Life Away


    +   - Directory files hold the names of files — and other directories that belong
    to them. These files and directories are called children. Directories in Linux
    (or Unix) are just another type of file. If you''re in a directory, the directory
    above you is called the parent. Isn''t that homey?


    When you list files with the -l command, it displays a list of files and directories.
    Directory files begin with the letter d. For example:


    ```

    [lidia@veracruz lidia] $ ls -l

    drwx-xr-x 5 lidia 1024 Oct 9 2001 Desktop

    drwx------ 2 lidia 1024 Oct 9 2001 nsmail

    ```


    +   - Special files represent either hardware devices (such as a disk drive, a
    tape drive, or keyboard or some type of placeholder that the operating system
    uses. The /dev directory holds many of these special files. You can see this directory
    by running the following command at a command prompt:


    ```

    ls -l /dev

    ```


    +   - Executable files contain instructions (usually programs, or scripts) for
    your computer. When you type the name of one of these files, you''re telling the
    operating system to execute the instructions. Some executable files look like
    gibberish, and others like long lists of computer commands. A lot of these executable
    files are located in /bin, /usr/bin, /sbin and /usr/sbin.


    # Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as one
    huge folder that contains files and other file folders, which in turn contain
    files and other file folders, which in turn contain files... well, you get the
    point. In fact, the Linux file system is generally organized this way. One big
    directory contains files and other directories, and all the other directories
    in turn contain files and directories.


    # Directories and subdirectories


    A directory contained, or nested, in another directory is called a subdirectory.
    For example, the directory /mother may contain a subdirectory called /child. The
    relationship between the two is referred to as parent and child. The full name
    of the subdirectory is /mother/child, which would make a good place to keep a
    file containing information about a family reunion called /mother/child/reunion.


    # The root directory


    In the tree directory structure of Linux, DOS, and Unix, the big directory at
    the bottom of the tree is called the root directory. root is the parent of all
    other directories — the poor guy must be exhausted — and is represented by'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 238 Part IV Revenge of the Nerds


    a single / (pronounced slash). From the root directory, the whole directory structure
    grows like a tree, with directories and subdirectories branching off like limbs.


    If you could turn the tree over so that the trunk is in the air and the branches
    are toward the ground, you would have an inverted tree — which is the way Linux
    file system is normally drawn and represented (with the root at the top). If we
    were talking about Mother Nature, you''d soon have a dead tree. Because this is
    computer technology, however, you have something that looks like an ever-growing,
    upside-down tree.


    ![](img/5275bfa3908ad63320aaea42eefe467c_261_0.png)


    # What''s in a name?


    You name directories in the same way that you name files, following the same rules.
    Almost the only way that you can tell whether a name is a filename or a directory
    name is the way the slash character (/) is used to show directories nest in other
    directories. For example, usr/local means that local is found in the usr directory.
    You know that usr is a directory because the trailing slash character tells you
    so; however, you don''t know whether local is a file or a directory.


    ![](img/5275bfa3908ad63320aaea42eefe467c_261_1.png)


    You issue the ls command with the -F option Linux lists directories with a slash
    character at the end, as in local/, so you would know that local is a directory.


    The simplest way to tell whether the slash character indicates the root directory
    or separates directories, or directories and files, is to see whether anything
    appears before the slash character in the directory path specification. If nothing
    appears before the slash, you have the root directory. For example, you know that
    /usr is a subdirectory or a file in the root directory because it has only a single
    slash character before it.


    # Home again


    Linux systems have a directory called /home, which contains the user''s home directory,
    where he or she can


    +   * Store files

    * Create more subdirectories

    * Move, delete, and modify subdirectories and files


    Linux system files as well as files belonging to other users are never in a user''s
    /home directory. Linux decides where the /home directory is placed, and that location
    can be changed only by a superuser, not by general users. Linux is this dictatorial
    because it has to maintain order and keep a handle on security.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Chapter 16: Filing Your Life Away


    Your /home directory is not safe from prying eyes. Be sure to maintain your privacy
    by locking your directory. (We tell you how in the "Owning Files and Granting
    Permissions" section later in this chapter.) But anyone logging in to your system
    as root (superuser) can see what''s in your /home directory, if you do lock it
    up.


    # Moving Around the File System with pwd and cd


    You can navigate the Linux file system without a map or a GPS. All you need to
    know are two commands: pwd and cd. (These commands are run from the command line.)
    But you also need to know where you are to start with, hence the usefulness of
    the next section.


    # Figuring out where you are


    Log in to your Red Hat computer and open a Gnome Terminal Emulation Program. In
    this case, we log in as the example user lidia. To find out where you are in the
    Linux file system, simply type pwd at the command prompt as:


    ```

    [lidia@veracruz lidia]$pwd

    ```


    We receive the following response


    ```

    /home/lidia

