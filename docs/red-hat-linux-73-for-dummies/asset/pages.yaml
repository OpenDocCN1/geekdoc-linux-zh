    # Knowing What You Can Do with Red Hat Linux


    Linux is freely available software. The source code for Linux, which is the heart
    and soul of the operating system, is also publicly available. Red Hat Linux is
    an integrated product, meaning that Red Hat, Inc. combines the basic Linux operating
    system with software (some made by others, some made by Red Hat) to produce a
    package whose value is greater than the sum of its parts. That combination is
    known as a distribution of Linux.


    So you can get up and running with Red Hat Linux 7.3 as quickly as possible, we
    have been sweet enough to include the Publisher''s edition operating system on
    the CDs that come with this book. See Chapters 2 and 3 if you''re chomping at
    the bit to install the new version.


    Initially the sole domain of business and university servers, Red Hat Linux is
    now used by businesses, individuals, and governments to cut costs, improve performance,
    and just plain get work done. You can use Red Hat Linux as a desktop workstation,
    a server system, an Internet gateway, a firewall, the basis of an embedded system
    (such as a small VCR or a robot), or even as a supercomputer. And thanks to the
    thousands of people working on different parts of Linux, Red Hat Linux becomes
    more flexible and capable with each release.


    The following list includes some of the cooler features of Red Hat Linux:


    +   - **Fully protected multitasking:** This is just a way of saying Linux processes
    (when you run an e-mail client, for instance, you are running a process) are automatically
    prevented from interfering with each other. That means that more than one application
    can be running at the same time without your system crashing every five minutes.
    This feature prevents problems like the dreaded Blue Screen of Death (where Windows
    tells you you''ve messed up and that you have no choice but to reboot and like
    it). Fully protected multitasking also means that a few of people can access a
    Red Hat Linux computer at one time.


    +   - **Large file support:** Red Hat Linux can handle large files and programs.
    In fact, the Intel Pentium processor can handle files as large as 2GB. That''s
    big. If you work with large databases, for example, you can store them on your
    own workstation if you have a large enough hard drive.


    +   - **Graphical user interface (GUI):** Red Hat Linux includes a sophisticated
    interface called the Window System, also known as X, and the GNOME desktop manager
    (or K Desktop Environment, if you want to use it instead of or in addition to
    GNOME). Together, X and GNOME give you a powerful and very stable graphical workstation.


