    # Making the file system


    Every drive partition is simply an empty space with a beginning and an end. Unless
    the partition is being used for swap space, you have to put some type of file
    system on the partition before it can become useful. The mkfs (for file system)
    command is used to create the file system on the partition. Normally, the file
    system is a native Linux file system, which at this time is called ext3. The Linux
    version of mkfs has been nicely streamlined and requires hardly any input.


    To create a file system on the disk drive partition sda1, for example, you type
    the following command:


    ```

    mkfs -t ext3 /dev/sda1

    ```


    Or, for an IDE drive, type this command:


    ```

    mkfs -t ext3 /dev/hda1

    ```


    If you want to create an MS-DOS file system on the drive partition, you type this
    command:


    ```

    mkfs -t msdos /dev/sda2

    ```


    Be careful to type these commands precisely. You can easily format the entire
    disk if you make a mistake. For instance, typing in mkfs -ext /dev/sda formats
    the whole disk. The difference is that sda2 specifies a single partition, while
    sda means the whole disk.


    You can continue to execute mkfs commands to create file systems for every partition
    on your new drive. Or you can leave some partitions without file systems (for
    future use), as long as you remember to perform the mkfs command on them before
    trying to attach them to your file system by using the mount command or the /etc/fstab
    table.


    Congratulations! Your drive has been physically added to your system and partitioned,
    and you''ve added file systems to it. Now the drive is ready to join the rest
    of the file system — simply use the mount command or the /etc/fstab file, which
    we describe earlier in this chapter.


