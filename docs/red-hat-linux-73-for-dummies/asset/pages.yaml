  md: '# Chapter 5: Connecting to the Internet with a Dial-up Modem


    # If you''re buying a modem


    Modems are an old technology but still the most common method for making personal
    or small business Internet connections. This may not be true for much longer as
    the number of users of broadband connections is rising fast, and large businesses
    also use broadband services.


    computer. On the other hand, internal modems are cheaper and require fewer external
    cables. Also, internal modems need only a telephone line cable, whereas external
    modems require a telephone line, a serial connection, and power supplies.


    An internal modem plugs into a PCI or ISA slot of your computer''s motherboard
    and receives its power from the computer. An external modem comes in its own case,
    requires its own power supply, and connects to the computer via a serial (RS232)
    connection. Both types of modems use your phone to connect to the Internet.


    A third type of line modem is a PCMCIA (sometimes called a PC card). These cards
    are used most with laptop computers. Most laptop computers come with internal
    modems already installed.


    Avoid WinModems like the plague, because these modems are designed for Windows
    computers only. They''re cheaper than regular modems because they''re lazy (or
    smart depending on how you look at it) and depend on the Windows operating system
    to do much of their work for them. Linux drivers are only now beginning to appear
    for such modems.


    Internal modems are generally less expensive than external ones, but external
    modems have several advantages. You can easily turn them off and on, you can connect
    them to a computer without opening the computer case, and if your telephone line
    is struck by lighting, the charge passing through your modem won''t damage your


    Now is a good time to verify that your own phone service is billed at a flat rate
    and not metered; you should make sure that the dial-number you use isn''t a toll
    call either. If you have metered service or end up making a distance call, you''ll
    run into huge phone bills while spending hours chatting about lone gunmen and
    interdimensional space travelers.


    After you choose your Internet service provider and arrange payment, ISP provides
    you with certain pieces of information, including the following:


    +   - Telephone access numbers


    +   - A username (usually the one you want)


    +   - A password (usually the one you supply)


    +   - An e-mail address, which is typically your username added to the ISP''s
    domain name


    +   - A primary Domain Name Server (DNS) number, which is a large number separated
    by periods into four groups of digits


