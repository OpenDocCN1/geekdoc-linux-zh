  md: "# Chapter 15: Bashing Your Shell\n\n# Using careful naming conventions\n\n\
    The question mark and the asterisk can be helpful for identifying particular types\
    \ of files, if you're careful about naming your files. For example, text editor\
    \ files usually have the .txt extension, and Microsoft Word files have the .doc\
    \ extension. Linux doesn't care about the name of a file is, but some programs\
    \ work only with a particular type of file.\n\nSuppose you followed the convention\
    \ of naming all your text files with the .txt extension, and you want to see all\
    \ the text files in a directory. You can use the ls command like this: \n\n```\n\
    ls -1 *.txt\n```\n\nThe screen displays all the files in this directory with the\
    \ .txt extension. Notice that we didn't say that the command shows all text files\
    \ or that it shows only files. If you want to name a graphics file with a .txt\
    \ extension, Linux happily obliges you. For your own sanity, however, be diligent\
    \ in naming files. Some programs (such as those that create audio files or picture\
    \ files) strictly enforces a naming convention on files they create, but Linux\
    \ itself doesn't.\n\n# What to do if you're not careful naming files\n\nWhat do\
    \ you do if the * is part of the filename you're trying to match? How can you\
    \ tell the shell that you want only the file that contains *, and not all the\
    \ other files? The backslash character prevents the shell from interpreting the\
    \ * as a metacharacter and expanding it — in Linux terminology, the backslash\
    \ escapes the meaning of the special character. For example, hi*est matches a\
    \ file highest, but hi\\*est matches only the hi*est filename.\n\nIf you want\
    \ to delete the file hi*est, then enter the command:\n\n```\nrm hi*est\n```\n\n\
    The * expands to mean any character or characters (actually, * can also mean zero,\
    \ or no characters) and the file is removed. You can also explicitly delete the\
    \ file by using the following command:\n\n```\nrm \\*est\n```\n\nThe backslash\
    \ tells the shell to treat the asterisk as a character and not to expand it to\
    \ mean zero or more characters.\n\nAlthough more regular expression characters\
    \ are available, the ones listed in this section are enough for you to work with\
    \ for a while."
