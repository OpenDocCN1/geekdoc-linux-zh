    This book assumes that you choose that option, and X is the default environment
    used in all further discussions.


    If you choose No, then your system will start up in character-cell or text mode.
    You can always manually start X with the startx command or modify the /etc/initabb
    to automatically start X. The line id:3:initdefault should be changed to id:5:initdefault
    in the initabb file to do.


    After you make your choice, an informational screen appears, telling you where
    the configuration file can be found. It also points to you the README.Config for
    more information.


    If you have a problem with your X configuration, then you are unfortunately informed
    about the situation. You have the option of quitting or going back and starting
    over. If you''re game, go back and try, again.


    If, for some reason, you can''t get X working at this point, you can always finish
    finishing the configuration of X later by running the Xconfigurator program.


    # # Restarting Your System


    Ta Da! You''re finished with the installation. Not surprisingly, the Done dialog
    box appears.


    Follow these steps to start your system:


    +   1. All that''s left is to exit OK.


    Before the system reboots, remove the CD and the floppy disk. Otherwise, you''ll
    be faced with going through the entire installation process again. There''s no
    need to groan — you can always re-reboot and remove the pesky keys.


    Your system reboots, and you can start Linux.


    +   2. When you see the LILO boot: prompt, press the Tab key.


    You see a list of operating system names that you chose to represent your different
    systems to LILO. Type the name that represents Linux and then press Enter. Watch
    the glorious event: Your Linux system boots! Pop the champagne.


    +   3. After the startup messages stop and the login: prompt appears, type root
    and then press Enter. Enter the root password.


    You are now logged in as super, also known as root. Chapter 4 can help you get
    up to speed with your new Linux system.'
