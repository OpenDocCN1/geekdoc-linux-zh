  md: '# # Red Hat® Linux "X"

    For Dummies

    Cheat Sheet


    A Few Good Commands

    Common-used and useful commands are listed below. You enter these commands from
    a

    Shell prompt. Please consult Chapter 4.


    | `cd directory` | Change the current directory to directory |

    | `ls [options] [directory]` | List the current directory''s contents |

    | `ls -l` | List the current directory''s contents, along with sizes, permissions,
    ownerships, and dates of files |

    | `ls -a` | List all files, including invisible files (files names begin with
    a period) |

    | `pwd [option]` | Print the working directory (the one you are in) |

    | `rm [options] filename` | Remove filename |

    | `mkdir directory_name` | Make a new (empty) directory |

    | `rmdir directory_name` | Remove an empty directory |

    | `cp [options] src filename_dst` | Copy a file |

    | `mv [options] filename filename_dst(s)` | Move (or rename) a file |

    | `cat [options] filename` | Concatenate a file to the standard output (which
    displays the file) |

    | `more [options] filename` | Paginate a file |

    | `less [options] filename` | Paginate a file |

    | `touch [options] filename` | Make a new (empty) file, changing the access date
    of an existing file |

    | `chown [options] filename` | Change the owner of a file or directory |

    | `chgrp [options] filename` | Change the group of a file or directory |

    | `chmod [options] filename` | Change the permissions of a file or directory |

    | `sort [options] filename` | Sort a file in a particular order (depending on
    the option) |

    | `echo [options] text string` | Echo-on what is typed after the command |

    | `date [options] text string` | Read the date and time (without an argument);
    set the date and time (with an argument) |

    | `cut [options] filename` | Break a wide file into multiple rows |

    | `sed [options] source` | Stream editor for large files or real-time editing
    |

    | `ln [options] source filename/directory_target` | Link a file to another file
    |

    | `grep [options] filename` | Searching program that uses general expressions
    to find data, and then prints it to its output


