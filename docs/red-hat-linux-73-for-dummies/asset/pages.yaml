  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Getting out of GNOME or X


    If you want to leave your computer on but don''t want to leave your computer open
    to anyone just walking along, you can save the time logging out of your GNOME
    desktop by using the screen lock. To do so, click the Main Menu button and choose
    Lock Screen. The screensaver is displayed. To return to productive life and your
    desktop, press any key or wiggle your mouse and enter your password in the X Screensaver
    window that appears.


    # Securing your computer while you step out


    Locking your screen is actually one of the best security features that you can
    use. GNOME preconfigures an icon for locking your screen. You must enter your
    password to get your screen after this icon.


    To use this, click the little padlock it sits almost all to the left of the GNOME
    Panel. Your screen locks up and you must enter your password to get back in. Locking
    your screen is a good idea when you''re going to be away from it for a minute
    or two.


    # Locking up the shop


    When you''ve finished for the day and want to go home (or just upstairs), you
    need to log out. Click the Main Menu button and choose Log Out. The Really Log
    Out? screen appears. Click Yes to log out. You also have the options to halt (shut
    down) or reboot your computer.


    # Exterminating X


    When you can''t get your applications to respond to you, you can simply stop X,
    which kills all the programs running under it. To do so, press the Ctrl+Alt+Backspace
    keys all at once. If X started manually, you can log out of the account. If X
    is started automatically at boot time (as this book assumes), then you get the
    X login screen and you can log back in.


    # Tinkering with GNOME


    You can start the GNOME Nautilus by clicking the Main Menu button and then clicking
    the Start Here option at the top of the pop-up menu. The Nautilus control utility
    — called Start Here — appears, as shown in Figure 10-10. Here you can modify all
    the basic properties of GNOME. Choose Desktop; Background and you can set the
    color and other aspects of the desktop. Choose Desktop?; Screensaver?; Xjack and
    you switch from the default random screensaver to the “All work and no play makes
    Jack a dull boy” screensaver. Not a bad selection for those long winters spent
    at peaceful resorts with plenty of time to write Linux books!'
