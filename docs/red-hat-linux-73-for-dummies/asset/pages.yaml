  md: '# 200 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # A StarOffice Is Born


    StarOffice is a desktop productivity suite that does nearly everything that Microsoft
    Office does, but for less money. How much less? Well, 100 percent less because
    it''s now 100 percent free. Sun Microsystems, Inc. purchased StarOffice and licenses
    it under the GPL/LGPL and SiSL licenses. What do all those letters mean? They
    mean F-R-E-E, and they also mean that Linux can integrate office features from
    StarOffice now because the Linux and StarOffice share the GPL license. More information
    about the licenses can be found at the following URL:


    ```

    www.openoffice.org/project/www/license.html

    ```


    Not only is StarOffice free (did we mention that it''s free?), but it is also
    powerful, providing the user with the following functions:


    +   - A full-function what-you-see-is-what-you-get (WYSIWYG) word processor. StarOffice
    comes with many functions that you expect formatting, cutting and pasting, graphics,
    spell check, and more. It can also read from and write to Microsoft Word 97/2000
    files.


    +   - Calc: A full-function spreadsheet program used by Wall Street brokers. If
    you''re familiar with spreadsheet software, then Calc should be straightforward
    to use.


    +   - Imp: A graphics program with all the bells and whistles for creating presentations.
    You can also import and export PowerPoint documents.


    +   - Draw: Your personal graphics tools for creating anything from a novice drawing
    to a masterpiece. This program provides your creative side with a tool for creating
    graphics.


    +   - Schedule: This program helps you to organize your time. If you''re Paul,
    it''s increasingly difficult to schedule coffee time time. Schedule finds the
    time.


    +   - E-mail client: This is a full-function e-mail client program that can read,
    write, and filter your e-mail for you. You probably want to stick with Mozilla
    only to minimize the number of software packages that you use. Nothing is wrong
    with this, but if you''re like us and run the Mozilla browser constantly, then
    you may as well use it for e-mail, too. Doing so provides you with fuller integration
    of your Web browsing and e-mail clients.


    +   - HTML editor: StarOffice writer is also able to create HTML documents. HTML
    is the language of the Internet, and this function makes it easy to create Web
    pages. HTML editor works the same as the word processor, but the text you enter
    is saved in an HTML-formatted document. Any HTML document that you save can be
    used as a Web page.'
  merge: -1
