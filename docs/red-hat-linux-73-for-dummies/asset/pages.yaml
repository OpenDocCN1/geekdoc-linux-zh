  md: '# 52 Part I: Installing Red Hat Linux


    Each mount point is a drive partition or remote file system (such as your CD-ROM
    drive) that is mounted, or made visible to, a directory of the limb above it.
    When a disk partition is mounted on the directory branch, it turns that branch
    into another limb, allowing even more branches to be positioned and attached below
    the mount point.


    ![](img/5275bfa3908ad63320aaea42eefe467c_75_0.png)


    Figure 4-1: The Linux file system is like an upside-down tree.


    Linux needs at least a root partition in your directory structure (the upside-down
    tree) and a swap space partition. The root partition is used to store all your
    personal and system files and directories, and Linux uses swap space, the Hamburger
    Helper of the computer world, to extend your memory beyond the limit of your random
    access memory (RAM). If you have 64MB of RAM and 64MB of swap, for example, you
    can run programs that use 128MB of memory.


    The Workstation installation method we walk you through in Chapter 3 automatically
    sets up your root and swap partitions, as well as an additional boot partition
    that is used for storing the Red Hat Linux kernel and other files used for booting
    your computer.


