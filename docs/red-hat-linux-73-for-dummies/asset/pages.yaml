    9. In the Automatic Partitioning dialog box, select OK.


    You get three choices in this step: Remove All Linux Partitions on This System,
    Remove All Partitions on This System, and Keep All Partitions and Use Existing
    Free Space. The first — default — option will take any existing Linux files and
    combine them into three: /boot, / and and swap; the second will use the entire
    disk and create /boot, / and swap. The last option will only use free space.'
