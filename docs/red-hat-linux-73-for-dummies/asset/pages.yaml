    to configure your Linux network settings.


    If your LAN also has an Internet connection, you can set up your Linux computer
    to communicate with the Internet, too. A high-speed internet connection is best,
    but it doesn''t matter in terms of the network configuration.


    # Preparing to configure your wireless NIC


    Before you configure your wireless NIC, you need to figure out two things:


    +   - What type of wireless NIC you have (or need)

    - How your wireless NIC electronics is going to connect to your network


    Two main types of wireless electronics (chip sets) are used in today: Wavelon
    and Prism2. Intel designed Prism2, and Lucent Technologies built Wavelon. The
    two types are configured differently. The following list shows which can help
    you figure out what kind of chip device you use.


    +   - Wavelon: Orinco, Apple Airport Enterasys RoamAbout82, Elsa AirLancer11 and
    Melco/Buffalo 802.1b.

    - Prism2: D-Link DWL-650, LinkSsys WPC11, and Compaq WL100. Others include Addtron
    AWP-100, Bromax Freeport, GemTek WL-211, Intalk/Nokia, SMC 2632W, YDI, Z-COM X1300,
    and Zoom Telephones Zoom/Air 4100.


    Red Hat Linux comes with software to enable the use of Wavelon products (such
    as the Orinco PCMC cards), and a Wavelon wireless is very easy to configure. Prism2
    NICs are more difficult to configure, and we recommend Wavelon-based systems.
    We describe how to configure Wavelon in this chapter, but not Prism2 NICs. If
    you want to use Prism2, you can download the drivers for Prism2 from `linux-wan.org`.


    You need to figure out how your wireless NIC (or network adapter) is going to
    connect to your network. There are two ways for wireless NICs to connect to a
