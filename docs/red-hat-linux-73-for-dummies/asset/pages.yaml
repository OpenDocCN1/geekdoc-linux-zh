  md: '# # Chapter 20


    # # Configuring X


    **In This Chapter**


    +   - Uncovering details about your video controller, monitor, and mouse

    - Configuring the X Window System

    - Finding help if the X Window System still doesn''t work

    - Paying attention to Xtermination etiquette


    Did you receive an error message during the installation, informing you that the
    X Window System (we''ll call X from now on) was not installed properly and that
    you had to install it later? Or was your video card or monitor not included in
    the supported hardware in Chapter 3? Perhaps you skipped configuring X in the
    first place. If so, this chapter is for you. Take solace in fact that X is one
    of the trickiest parts of the Linux system to get working properly.


    X was invented at the Massachusetts Institute of Technology (MIT). MIT designed
    X to display graphical applications across a wide range of machines. It was originally
    built to run on Unix platforms but has been adapted to Linux, Windows, and other
    platforms.


    # # Discovering Your Hardware''s True Identity


    Before you start X, you need to find out information about your video controller
    card, monitor, mouse, and keyboard.


    For your video controller card, you need to find out:


    +   - The model number (and perhaps the video chip) used

    - The amount of video RAM it has


    You should be able to find this information in your system''s documentation or
    by using Windows, as described in Chapter 3. The Xconfigurator utility is also
    good at probing and discovering details about your video equipment.


    ![](img/5275bfa3908ad63320aaea42eefe467c_318_0.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 296 Part IV: Revenge of the Nerds


    Next you need to know the following about your mouse:


    +   - The model number and manufacturer

    - Whether it''s a PS/2 bus mouse or a serial mouse


    Again, if your system''s documentation should tell you, and often at the bottom
    of the wire, or tail, the mouse offers some basic information.


    A PS/2 mouse usually has a round connector on the end of its wire, or tail. A
    serial mouse has an oblong connector with nine holes. All varieties of PS/2 bus
    mice like to Linux. Different serial mice, however, have different characteristics.
    If you have a serial mouse, you need to know its model number and manufacturer,
    or whether it emulates some other well-known mouse.


    ![](img/5275bfa3908ad63320aaea42eefe467c_319_0.png)


    Three-button mice work best with Linux, but you can get by with a two-button mouse.
    To X, holding down both buttons at the same time on a two-button mouse is equivalent
    to holding down the middle button of a three-button mouse, but only if the system
    is configured correctly. You can find out how to configure your mouse in chapter
    3.


    Finally, you need to know about your monitor. Most monitor manuals have a table
    at the back with such information:


    +   - Horizontal sync range

    - Vertical sync range

    - Resolution

    - Whether it is multiscanning, which means your monitor can run at several resolution
    rates


    Older monitors, particularly VGA monitors that came with older systems, often
    aren''t multiscanning. These monitors can be damaged if you try to use them at
    a higher resolution than VGA, which is 640 x 480 and 60 Hz.


    Horizontal and vertical sync range numbers help X how to place the dots on the
    screen. The resolution number tells X how many dots can be considered horizontally
    and vertically. The 640 x 480 resolution is usually considered to be the worst,
    and 1,280 x 1,024 is usually considered to be the best for normal use. Strive
    for 800 x 600 resolution as a minimum and 1,024 x 768 as an ideal for most systems.


    Higher resolution video uses more video memory (which is on the video card and
    therefore separate from the system memory), allows fewer simultaneous colors on
    the screen (for a given amount of video memory), and typically shrinks text on
    the screen, making it harder to see. On the other hand, using a higher resolution
    means that more information can be visible on the screen at one time for the same
    size monitor (even though the writing may be'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'small that you can''t read it without new glasses). Some video cards can be
    upgraded to add more video memory, and some cannot.


    Most newer monitors have built-in protection mechanisms to keep them from burning
    up in what is known as overdriving, but older monitors do not.  Older monitors
    can literally catch on fire. Try to find the specifications for your monitor from
    the manual, from a dealer, or from the manufacturer''s Web page.


    If you hear noise from your monitor or smell burning components, turn off your
    computer immediately. If you think the screen doesn''t look right, press Ctrl+Alt+Backspace
    right to stop X Server and then try a lower resolution. Otherwise, you can easily
    damage the monitor.


    ![](img/5275bfa3908ad63320aaea42eefe467c_320_0.png)


    # Running Xconfigurator


    After you find all about your video hardware, you''re ready to start configuring
    X. We assume that you don''t have X up and running. If it is up and running, you
    can skip the rest of this chapter.


    The next step is to use a program Xconfigurator. This program asks you a series
    of questions, such as the type of monitor, the type of graphics card, and the
    amount of video memory in your system. As you supply the answers, Xconfigurator
    builds a file called xinitrc that X Server uses later to communicate with your
    monitor, the video card, and the rest of the system. (Xconfigurator is the same
    program that the Red Hat installation system uses.)


    Xconfigurator also tries to obtain information by probing the hardware. Sometimes
    the program is accurate, but it can make a mistake, particularly in older PCs,
    with older video cards, or with serial media. Therefore, you may have to supply
    information to the program. As Linux becomes more sophisticated in the methods,
    it uses to probe hardware, and as hardware becomes more sophisticated in the information
    it can return to the operating system, fewer questions need to be asked. For now,
    though, you have Xconfigurator.


    To run the Xconfigurator program, follow these steps:


    +   1. Log in as root and open a Terminal window by clicking the GNOME Terminal
    icon on the GNOME panel at the bottom of the screen (it looks like a monitor).


    +   Before you modify your current X Window settings, you should save the configuration
    file.


    +   2. Type the following command to make a backup copy of XFree86 configuration
    file (/etc/X11/XF86config):


    ```

