    # IEEE and wireless networks


    The dominant wireless standard is based on the IEEE 802-11b (and the older 802-11a
    and the about-to-be-released 802-11g) standard; the 802-11b is also referred to
    as WIFI. If you hear people talking about a WIFI NIC, they''re just talking about
    wireless NICs.


    IEEE, pronounced E-Triple-E, stands for the Institute of Electrical and Electronic
    Engineers and is a worldwide professional society of nerds. (I have proudly been
    a member for 21 years. Woo-hoo, and that a buck-89 will buy me a coffee!) The
    IEEE is the triclops of wireless networking and concerns itself with things like
    what frequency networking devices should use. Fortunately, this group has devised
    this wonderful standard that now enables everyone''s interested to communicate
    without stringent wires between machines.


    connected to a network. However, unlike an ad-hoc network, the individual computers
    can connect to any access point that allows them to.


    The wireless configuration instructions that provide work with either the infrastructure
    or ad-hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you configure your Network
    ID (ESSID) and encryption key correctly.


    # Choosing between ad-hoc and infrastructure


    There are several advantages to using ad-hoc mode, including lower costs, simpler
    configuration, and somewhat better security.


    +   * Lower costs: You don''t have to purchase an access point. Computers using
    wireless NICs running in ad-hoc mode communicate directly with each other.


    +   * Simpler configuration for the Linux user: You generally configure an access
    point using Windows-based software. You need to connect a Windows computer to
    the access point via an Ethernet network. That can be difficult if you don''t
    run any Windows-based computers. (Good access points are beginning to use HTML-based
    configuration systems. You can use browsers like Mozilla to configure those devices.)
    If you''re not using Windows-base software, you can use Red Hat''s Network Configuration
    Druid to configure a wireless NIC. You can create a network of Linux computers
    by configuring each NIC with the same Network ID and encryption key.


    ![](img/5275bfa3908ad63320aaea42eefe467c_123_0.png)'
