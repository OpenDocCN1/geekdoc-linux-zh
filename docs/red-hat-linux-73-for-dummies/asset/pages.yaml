  md: '# # Appendix C

    vi Me


    Everyone who manages a Linux computer needs a good editor. Whether you''re an
    administrator for a star-struck dot-com or a single, lonely Red Linux computer,
    you need to edit simple text files. The ubiquitous vi fits the bill. vi is lean,
    fast, and an effective editor that''s found on all Linux distributions.


    # ## Comprehending Text Editors


    A text editor is an essential tool for Linux. It enables you to create and modify
    an array of text files, including the following:


    +   - User files, such as the login file

    - System configuration files, such as /etc/fstab, /etc/initab, and /etc/lilo.conf

    - C and C++ programs

    - Shell programs

    - Mail messages


    Red Hat Linux comes with not one but two text editors: ed and vi. The ed editor
    is a line-oriented text editor. It was one of the first editors for Unix systems
    and traditionally is included with every Unix and Linux system. It''s also a small
    editor, so small distributions of Unix and Linux can include it. You can always
    count on being there.


    The second editor that comes with Linux is vi; it''s included with almost every
    Linux distribution (some specialized distributions such as Trinux don''t necessarily
    include it). This full-screen editor also supports the command set of a line-oriented
    editor named ex. The third major text editor for Linux is emacs; some people prefer
    to use this editor for most of their work.


    ![](img/5275bfa3908ad63320aaea42eefe467c_384_0.png)'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# 362 Part VI: The Appendices


    In Red Hat Linux, vi are emulated by another text editor vim. The commands for
    vi work just fine with vim. In addition, vim has more capability than vi. For
    instance, vim makes editing easier by allowing you to switch from command to insert
    mode and move around the file with the cursor keys. On the other hand, vi forces
    you to continually toggle between the two modes in insert text and move around
    the file. Therefore, vi isn''t included as a separate program with Linux systems.
    When you type vi, you''re really using vim, this fact is invisible to you.


    ![](img/5275bfa3908ad63320aaea42eefe467c_385_0.png)


    # Getting Friendly with vi


    The editor on your Red Hat Linux system is really the vi editor. With a little
    vim and vigor, you can invoke it by using vi, because a symbolic link exists between
    vi and vim.


    Like the editor, the vi editor has two modes of operation and the same type of
    single-letter commands. To start vi, you type vi at the command line. The screen
    clears, and the left-most column displays tildes (-). You are looking at an empty,
    unnamed buffer in memory, which you can enter text until you save the text to
    a named file.


    You can start the vi editor in a number of ways, with different options, but the
    most common way is to start vi with only a filename as the argument, like this:


    ```

    vi /etc/hosts

    ```


    where /etc/hosts is the name of either an existing file that you want to create
    or a new file that you create.


    The vi editor has three modes of operation:


    +   - Visual command mode

    - Colon command mode

    - Text mode


    When you invoke vi with a filename, the editor screen appears. At the bottom-left
    corner is the following line:


    ```

    "filename" [New File]

    ```


    This status line tells you what the editor is doing. In this case, the editor
    has opened a buffer, and the save and quit option saves the contents of the buffer
    to the filename. If you did indeed invoke vi with the following command:


    ```

    vi /etc/hosts

    ```'
