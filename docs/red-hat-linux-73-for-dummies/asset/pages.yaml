  md: '# Chapter 6: Broadband Rocks!


    +   Digital Subscriber Lines (DSL): Designed to skip the restrictions of the traditional
    telephone system by making an end-run around the voice switches, DSL rewires your
    existing telephone setup. Your local telephone company can connect you to new
    equipment that provides over 10 times the speed that dial-up modem can.


    The main limitation of DSL is that traditional copper wire can only carry a high-speed
    connection for a few miles. Connections between you and a CO are limited to 15,000
    to 18,000 feet (roughly 3 to 4 miles). Your telephone company will tell you if
    they can provide you with service.


    # The Cable Modem Option


    Cable modems provide fast and reliable Internet connections that are always turned
    on. Internet cable is simple to obtain and use if your TV company provides it.
    There are, of course, down sides to consider:


    +   Unfortunately, not all cable companies have caught up with 21st-Century technology
    yet. Many companies may provide you with TV but not Internet service.


    +   Many people do not live in an area served by cable TV. Internet cable is also
    not a good medium to provide services such as Web pages to the Internet.


    +   Most cable companies require that you connect to their ISP. Many people like
    to use their own ISP because it makes easier to set up your computer (or network)
    to provide services going out to the Internet. Cable companies can''t prevent
    you from using a different local ISP, but they won''t charge you — so you end
    paying for two services, one of which you''re not using.


    +   Few cable companies support Linux. You''re on your own if you need to troubleshoot
    problems, even problems that have nothing to do with Linux but which affect your
    machine. Don''t worry, we''re there for you.


    ![](img/5275bfa3908ad63320aaea42eefe467c_102_0.png)


    DSL may give you an alternative if any of these problems are familiar to you.
    The "DSL Option" section, later in this chapter, shows you how DSL works and how
    to use it.


    If you decide that cable access is the right choice for your Internet access needs,
    here''s an overview of the process for connecting your Red Hat Linux computer
    to a cable modem:


    +   1. Do some research and subscribe.


    Locate an Internet cable provider (ICP). Your ICP is usually your cable TV company
    and subscribe to the ICP service.'
