    2. Connect your DSL modem to your phone jack and your computer.

    Y DSL modem acts as the intermediary between you and your DSL service provider.
    You must connect one side to the phone jack and the other to your computer''s
    Ethernet NIC.

    3. Configure your Red Hat Linux to communicate with the DSL modem.

    Y Linux computer connects to the DSL modem via an Ethernet NIC. You must configure
