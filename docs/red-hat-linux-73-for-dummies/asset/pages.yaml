  md: '# # Red Hat Linux "X" For Dummies


    # ## vi Commands


    The following list of commands contains the most useful and commonlyused commands
    to control the vi editor. In fact, this has been using vi since 1981 and has never
    learned to use more commands than these. This proves that one can be lazy and
    still get job done.


    You enter these commands from a Shell prompt. See Chapter 4 for more details.


    | vi | Open filename in vi |

    |---|---|

    | i | Enter insert mode, inserting before the current position |

    | Shift+I | Enter insert mode, inserting at the beginning of the current line
    |

    | a | Enter insert mode, inserting after the current position |

    | Shift+A | Enter insert mode, inserting at the end of the current line |

    | esc | Return from insert mode to command mode |

    | d | Delete a character while in command mode |

    | cw | Delete the word to the left of the cursor and put the editor in insert
    mode |

    | :w | Write the file |

    | :q | Quit with no additional writes to the disk |

    | :wq | Write back the file, and then quit |

    | Shift+ZZ | Write back the file, and then quit |

    | :q! | Quit the file with impending changes |

    | /string | Search forward through the file for string |

    | ?string | Search backward through the file for string |

    | n | Find the next string (either forward or backward) |

    | u | Undo the last command |


    # ## System Administration Commands


    We list several commonly-used Linux commands below that help you to manage disks,
    shut down your computer, and get information about it.


    You enter these commands from a Shell prompt. Consult Chapter 4 for more information
    about how to enter commands.


    | mount [options] | Mount a file system |

    | device_file_system | |

    | umount [options] | Unmount a file system |

    | file_system | |

    | fsck [options] | Check the structure and integrity of a specified file system
    |

    | file_system | |

    | mkfs | Put a directory structure on a low-level formatted disk |

    | shutdown | Shut the system down instead of waiting for a message to be sent
    (Ctrl+Del does the same thing) |

    | vmstat [options] | Look at the virtual memory performance |

    | procinfo | Gather information about processes


    # ## File Permissions


    The following examples show different file permission combinations. Please Consult
    15 for more information about file permissions.


    | -wxrwxrwx | Read, write, and execute permissions for user, group and other (the
    world) (mode 777) |

    | drwxrxr-x | A directory that is completely open to its owner and can be read
    and searched by the group and read (but not) by the world (mode 754) |

    | cr-rw-r-- | A character file the owner can read or write to that group and the
    world can only read (mode 644) |

    | br-rw-r-- | A block special file; only the owner can read or write to it (mode
    600) |


