  md: '# 324 Part V: The Part of Tens


    **Solution:** Most Unix systems keep their time by using Universal Time (also
    known as Greenwich Mean Time, or GMT), but Microsoft systems keep their time as
    local time. When you set the time in either system, you set the CPU clock to that
    time. When you boot the other system, it interprets what is in the CPU clock differently
    and reports a different time.


    Linux enables you to set and think of the clock as either GMT or local time. You
    make this choice when you install the system. To change your choice, follow these
    steps:


    +   1. Log in as root.

    2. Type timeconfig.


    The Configure Timezones dialog box appears. Set your system clock to GMT (Greenwich
    Mean Time) by selecting the Hardware Clock Set To GMT option at the top of the
    screen.


    +   3. Deselect the Hardware Clock Set To GMT option.


    Highlight the option by pressing the tab key, if necessary. (Actually, you should
    be there when you activate the `timeconfig` command.)


    +   4. Press the spacebar to deactivate the option. Press the tab key until you
    reach the OK button, and then press Enter.


    +   5. Reset the time to the proper value by using the date command if you reboot
    Linux or through the Windows system if you boot Windows.'
  merge: -1
