  md: '# Chapter 19


    # # Bringing In the Red Hat Repairman: Troubleshooting Your Network


    In This Chapter


    +   - Understanding the philosophy of troubleshooting

    - Gardening with the fault tree

    - Diagnosing network problems


    His book is perfect, and there''s no way that anything described in it can ever
    go wrong. You''ll be as lonely as the Maytag repairman if you expect trouble (the
    trouble is trouble never happens). Errata (corrections) are as outdated as a brick
    and mortar bookstore. This book makes setting up computers and networks so easy
    that you''ll wonder why other people have so many problems! Blah, blah, blah,
    yada, yada, yada.


    Well, maybe not. This guy named Murphy hangs out in both virtual and real bookstores.
    He''s always jumping in just when things are starting to go well. The guy just
    can''t keep his nose out of other people''s business. This chapter is meant to
    smooth things out between you and Murphy in he catches up with you.


    # # It''s the Tree''s Fault, Not Mine!


    Troubleshooting is, as they say, more of an art than a science. Sometimes it''s
    easy to see what the problem is and how to fix it. Other times it''s not. The
    difficulty that you have fixing problems depends, of course, on how hard the problem
    is and how well you know your stuff. Obviously, the better acquainted you are
    with computers and Linux, the better you''ll be at troubleshooting.'
  merge: -1
