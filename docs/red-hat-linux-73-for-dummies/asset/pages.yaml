  md: '# 162 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Managers are generally not that smart. But Nautilus, and it tells the manager
    what to do when it encounters various file types. If you open a PDF file, the
    file manager knows what program to use in order to view it.


    Nautilus recognizes various file types because it keeps a list — its own Rolodex
    of sorts. These file types are known as Multipurpose Internet Mail Extensions
    (MIME) types, and they define what type of information a file stores.


    ![](img/5275bfa3908ad63320aaea42eefe467c_185_0.png)


    You can use Nautilus to create shortcut icons on your desktop to point to files
    or applications. In Nautilus, just click and drag any file or application to any
    blank part of the desktop and then release the mouse button. An icon is placed
    on the desktop. You can then start the application by double clicking its icon.
    If the icon points to a data file (such as a text file, for example) and Nautilus
    knows how to handle its MIME type, then Nautilus launches the appropriate application
    to open the file. Otherwise, Nautilus prompts you to tell it which application
    to use to open.


    # Navigating the Net with Nautilus


    Nautilus is more than just a file manager; it''s a double and triple threat. You
    can use it as a browser to navigate the Internet. Nautilus is just full of surprises.


    Nautilus is powerful, but it''s not a full-featured Web browser. It''s designed
    to extend your GNOME desktop from your Linux workstation''s hard drive to the
    Internet. The idea is to minimize the number of applications and utilities that
    you need to do simple, everyday tasks.


    ![](img/5275bfa3908ad63320aaea42eefe467c_185_1.png)


    Nautilus performs admirably to that end, but the GNOME people wisely didn''t burden
    the slim Nautilus system with every function including the kitchen sink. That
    wouldn''t be as fun as providing a link to the kitchen sink. You choose between
    Galeon (a lightweight browser), Mozilla, or Netscape when you view a Web page.
    Simply click the appropriate button, and the page opens in any of those browsers.


    To view Web pages, simply type an address in the location bar just like you would
    with Mozilla. Nautilus opens and displays the Web page. It''s just that simple.


    You can search for files and directories by using Nautilus''s search function.
    Click the Web Search button, and Nautilus opens a search engine. Nautilus knows
    what''s what and uses Google to do its searches.'
