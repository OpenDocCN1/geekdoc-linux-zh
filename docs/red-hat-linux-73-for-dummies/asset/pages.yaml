    # I Don''t Know How to Make the X Window System Start at Boot Time


    Problem: You don''t want to log in to a command-line mode (such as DOS) and then
    type startx. Instead, you want to log through X Window System.


    Solution: We set up our machines so that they start in nongraphical mode and allow
    us to switch to X. (Many times, we only want to make a simple edit or look at
    something on the system, and logging in without X is simply faster.) If you like
    to see a graphical interface from the beginning, though, do the following. In
    the /etc/inittab file, change this line:


    ```

    id:3:initdefault:

    ```


    to this:


    ```

    id:5:initdefault:

    ```


    Save your changes and reboot. X starts at the end of the boot process, and you
    can then log in through the graphical interface. To go back to the old way of
    booting, change the line in the /etc/inittab file back to the following:


    ```

    id:3:initdefault:

    ```


    and reboot the machine.


    # I Never Seem to Have the Correct Time


    Problem: When you boot Linux, the time is wrong, so you set it with the date command.
    Then you boot Windows and its time is wrong, so you reset it. When you reboot
    Linux, its time is wrong again.'
