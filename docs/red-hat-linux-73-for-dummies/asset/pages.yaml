  md: '# Chapter 3: Ready, Set, Install


    # Knowing your password etiquette


    Your password must be at least six characters long, but it''s better to use at
    least eight. The more characters that you use, the harder the password is to break.
    If you''re concerned about security at all, we recommend that you use a combination
    of uppercase and lowercase letters, symbols, and numbers to make your password
    as difficult to associate with you. In addition, don''t choose anything that would
    be found in a dictionary or names of items that are easy to associate with you.
    In other words, your name backwards, your birthday, your dog''s name, any word
    in language, and so on are all poor choices. For example, is a poor selection
    for Jon''s password and lowercase letters, because Jon and beer are usually seen
    in close proximity with each other.


    A good way to come up with a good password is to select a phrase and destroy it.
    For example, take "I am not a number" and make it into something like "ImNotnUn#
    Even though the result does not spell out the phrase in the real way, it gives
    you all the cues to remember the essentially random characters "I am", "not" =
    "Not", "a" = "un", and number = "#". Other combinations are for 3, 4 for a, 9
    for g, 1 for l, 8 for b, 5 for s, and so on. Thus you can create passwords like
    slth4by4(southday) and 14mnot4g33k(iamnotageek).


    Also, be sure to write your down where it won''t get lost and can be easily found
    or stolen. For example, save your passwords at home or store them in a locked
    desk or safe. And don''t write your password on a sticky note attached to your
    computer monitor, please!


    You have to type the password two times to make sure that you typed it correctly.
    The password appears on asterisks when you type it in. Holy breach of security,
    Batman! You wouldn''t want someone to be able to look over your shoulder and get
    your password, would you?


