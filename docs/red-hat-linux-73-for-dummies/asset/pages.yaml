  md: '# Social Engineering 1010101010


    Okay, you''ve exercised the security measures discussed in this chapter so


    Some hacker techniques don''t rely on technical measures at all. Another social

    technique is social engineering, which is a fancy way of saying "I''m going to

    trick you or your associates into giving information to use you."


    Social engineering can be as simple as a hacker calling to see if you''re

    at home or in the office. If you''re not physically present, then the hacker or

    burglar can break in and steal the computer or its disks. It''s pretty much a

    trivial process to break into a computer if you possess it. Another social

    engineering technique hackers employ to call a corporation''s help desk

    and pretend to be a VIP. The poor minimum wage slave can be bullied

    cajoled into giving out a password or other important information.


    ![](img/5275bfa3908ad63320aaea42eefe467c_353_0.png)


    The moral of the story is to exercise good security hygiene and be careful of

    strangers. Don''t give out information unless it is essential and you can verify

    t authenticity of the request.


    # Bad Passwords


    Probably the most easy to avoid, and most often abused, vulnerability is

    or or non-existent passwords. Passwords are your number line of

    defense. If your password is guessable or even worse, blank, then you will

    be broken into.


    Bad passwords are easy to fix. Start by assigning a password to every account

    you create — especially root. Then make it habit to use "good" passwords.

    Passwords can be cracked by brute force because computers have become

    very fast. Because you connect to the Internet, it is quite possible for hackers

    to steal your /etc/passwd file that contains the encrypted version of

    text-based passwords and use a computer to crack them.


    ![](img/5275bfa3908ad63320aaea42eefe467c_353_1.png)


    You should use passwords that do not use any word that can be found in a

    dictionary. For instance, don''t use the password "redhat73". Instead, change

    t "e" in "red" to "3" and the "a" in "hat" to "@". Your password becomes

    --r3dh@73, which means that the cracking software will have to use brute

    force to discover it out of a mere dictionary search.'
