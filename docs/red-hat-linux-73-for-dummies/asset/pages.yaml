  md: '# Chapter 10

    Gnowing GNOME


    # In This Chapter


    +   - Introducing the X Window System

    - Managing windows

    - Closing and killing windows

    - Understanding the virtual desktop

    - Logging out of GNOME

    - Stopping X

    - Configuring GNOME


    The Linux operating system comes with two interfaces in one, a command-line interface
    (like that found in MS-DOS) and the graphical X Window System, also known as just
    X, with GNOME sitting on top of X. X itself is said to sit on top of the command-line
    operating system, allowing total access to the operating system through a graphical
    interface. (Some operating systems, such as Windows Me, provide you with only
    a graphical interface.)


    ![](img/5275bfa3908ad63320aaea42eefe467c_164_0.png)


    GNOME is the default graphical user interface (GUI) for Red Hat Linux. You can
    also use the other Red Hat Linux, K Desktop Environment (or KDE), if you want.
    KDE is a fine environment and many people swear that it''s great. However, for
    the sake of brevity we describe how to use GNOME because it''s the default.


    In this chapter, you find out a little bit about X and the basics for working
    with GNOME. You also get to mess around with the GNOME Panel and desktop (the
    Panel is similar to the taskbar on a Windows computer). We also show you some
    cool but simple maneuvers to manage your windows (such as moving them, changing
    their size, bringing them to the front, and hiding them in the background). Find
    out how to lock your screen, log out of GNOME, and stop X altogether.'
  merge: -1
