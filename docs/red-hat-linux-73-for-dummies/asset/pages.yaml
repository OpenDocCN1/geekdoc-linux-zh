  md: "# Chapter 8: Fire, Fire, Heh, Heh, Firewalls Are Cool\n\nYou should see a list\
    \ displayed in the terminal window, as follows:\n\n```\nChain input (policy DENY):\n\
    target      prot opt source      destination ports\nACCEPT      all   anywhere\
    \      n/a\nACCEPT      all   anywhere      n/a\nACCEPT      tcp ly-       anywhere\
    \      -> -\n            any                                    \nACCEPT     \
    \ UDP        anywhere      domain -\nChain forward (policy DENY):\nChain output\
    \ (policy DENY):\ntarget      prot opt source      destination ports\nACCEPT \
    \     all   anywhere      n/a\nACCEPT      all   anywhere      n/a\nACCEPT   \
    \   tcp       anywhere      -> -\n            any                            \
    \        \nACCEPT      UDP        anywhere      any ->\n            domain\n```\n\
    \nThe first chain (which is simply a set of rules used for a common purpose or\
    \ function) is for incoming — IP packets. You can see that the default policy\
    \ is to deny all IP packets. The first two rules tell iptables to allow all internal\
    \ packets on the logical loopback (lo) and Ethernet (eth0) interfaces. The next\
    \ rule allows the return packets from outgoing connections to come back in. The\
    \ last rule allows incoming UDP domain packets, which are used for domain name\
    \ service (DNS).\n\nThe next chain — forward — denies all packets from being forwarded\
    \ through your Linux computer. Computing is only necessary if you use your computer\
    \ for routing or advanced networking functions.\n\nThe last chain — output defines\
    \ what IP packets are allowed out of your computer. The first two rules are for\
    \ your lo and eth0 interfaces again and allow internal traffic. The next rule\
    \ allows any and all IP packets destined for the Internet to leave through the\
    \ firewall. The last rule allows DNS packets to go out to the Internet.\n\nYou\
    \ can make your iptables tighter by allowing only certain types of packets to\
    \ the Internet. You can specify certain ports and addresses that are allowable,\
    \ for example. This makes your firewall incrementally safer but also more restrictive.\n\
    \n![](img/5275bfa3908ad63320aaea42eefe467c_148_0.png)\n\n# Testing Your Firewall\n\
    \nYour new firewall is no silver bullet, but it does provide a great deal more\
    \ protection than you didn't have one. Treat it for what it is — a good, sturdy\
    \ lock. it's the beginning of your Internet security, but not the end. Don't trust\
    \ it, however, without making sure it works."
  merge: -1
