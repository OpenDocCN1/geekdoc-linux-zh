  md: '# Chapter 12: Configuring Your Red Hat Linux Sound System


    A recordable CD is referred to as a CD-R; a rewritable CD is called a CD-RW (the
    difference is that CD-Rs can only be recorded on once). CD burners look like regular
    read-only drives and are connected with either an IDE or SCSI interface.


    # Installing the CD-ROM writing utility


    Red Hat Linux comes preconfigured to record CD-ROMs. However, just in case the
    CD-ROM writing utility was not installed, you can do so by following the following
    steps.


    +   1. Log in as root.

    2. Insert CD2 that came with this book into your CD-ROM drive.

    3. Open a Terminal emulator.

    4. Enter the following command to install the cdrecord package:


    ```

    4. Enter the following command to install the cdrecord package:

    ```rpm -ivh /mnt/cdrom/RedHat/RPMS/cdrecord```

    ```


    The cdrecord package is installed. You can now use cdrecord to record your own
    CD-ROMs. The next section describes the process of making CDs.


    # Burn, baby, burn: Saving files to a CD


    The following instructions describe how to create, or burn, a CD-ROM. You can
    copy either data or music to your CD-R. In this section, we switch gears to show
    how to back up your Linux home directory to a CD; however, you can also use these
    instructions to copy music. (The instructions are the same whether you have an
    IDE/ATAPI or SCSI CD-ROM drive.)


    +   1. Log in as root and insert a CD-R or CD-RW disc into your CD writer.

    What can you burn? Well, the world''s your oyster, and you can make a CD of anything
    you want — data, software, or music. A good place to start is backing up your
    /home directory on CD.

    2. Choose what you want to burn to CD.


    To copy data to a CD, you first need to make an ISO image of the data using the
    mkisofs utility. The general mkisofs syntax is the following:

    ```mkisofs -R -o filename filename or directory```'
