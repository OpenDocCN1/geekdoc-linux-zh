    # Diagnostics


    Error messages or exit codes indicate that something has gone wrong in the program
    or the shell. Normally, Unix error messages seem to be wrong when they are really
    okay. For example, most new users think that when they issue a command in an empty
    directory, they should get an error message such as directory empty or not found.
    The problem is ls can display the filenames in any order (as opposed to ls which
    displays the files in alphabetical order). So if you have a directory with three
    files in named file, not, and found—which to print in that order—you can''t determine
    whether the directory is empty or not. However, the developers of Unix thought
    that less was better than more (we''re not talking about the command names less
    and more), and that silence is golden (which means something if you''ve ever heard
    those old, noisy, hard-core terminals).


    Most programs display an exit code, which normally doesn''t unless it''s a non-zero
    code, which means the program ended unsuccessfully. If you''re a programmer, you
    can test for this, and if you do programming or shell-script writing, we encourage
    you to set and test exit codes.


    # Bugs/deficiencies


    Yes, all programs have bugs, and most Linux people are good about correcting them.
    But some bugs are so arcane that they affect only one in a million people, and
    to try and correct them would mean redesigning the entire program. This type of
    bug is regarded as a deficiency or a limitation and is listed in the man page.


    # Compatibility issues


    When a new version of a command or a program comes out, it may work slightly differently
    than the old command or program. This modification can cause a compatibility issue
    with shell scripts that have been written to use the old command or program. If
    the author of the command or program thinks a problem may occur, it should be
    documented here.'
  merge: -1
  pgno: 399
- img_proc: true
  md: Along with options and environmental variables, another way to determine what
    program the manual page is describing how to operate through configuration files,
    sometimes known as startup files. These files may be in your home directory, a
    systemwide directory, or a sitwide directory.
  merge: -1
  pgno: 400
- img_proc: true
  md: '# 378 Part VI: The Appendixes


    Often. Linux looks for them in a certain order: Sitwide files have the strongest
    influence, and systemwide and local user (your startup) files have the second
    and third strongest influence, respectively. The systems administrator can use
    those files to set policies across companies and systems, while allowing you to
    tailor the program to your needs.


    Two examples of startup files are the `.bashrc` file, which is probably in your
    home directory, and the `/etc/bashrc` file in the `/etc` directory. Note that
    if the file in your home directory starts with a period. This type of file is
    called a hidden, or dot, file. You don''t normally see hidden files when you list
    your directory, unless you issue the `ls -a` or `ls *` command.


    # Copyrights


    Many people mistakenly believe that Linux code or other freeware code is not copyrighted.
    This is typically not true. The authors of the code often take great care to copyright
    their code because they want to receive credit for their work.


    # Copying permissions/distribution policy


    The copyright holder gives away most Linux code through the GNU Public License,
    or what is commonly called copyleft. The copyleft stipulates that those holding
    a copy of code can use it for whatever purpose they want, as long as they make
    the code freely available to anyone who wants it. If they change the code, they
    must make the changed code (including the source code) freely available to those
    who want it.


    Sometimes, other copying and distribution policies are associated with the command
    or program that the manual page is describing. These policies can include the
    following types of permissions, where you may:


    +   - Use but not redistribute the code


    +   - Use the code, but no source code is available


    +   - Use and distribute the code as shareware, by paying a fee for continued
    use


    +   - Have limited use, such as educational or personal (but not commercial) use


    +   - Use the code on one machine only


    If you bought the operating system, or a layered product distribution (distribution
    that includes both the operating system and a commercial application), or both
    from a CD-ROM vendor, the overall distribution'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Appendix D: Diggin'' Them Linux Man Pages 379


    policy on the CD-ROM is usually the most strict (that is, you''re limited to

    installing it on one machine because of its licensed software). You don''t

    have to worry as long as you follow its overall licensing.


    # POSIX compatibility/standards conformance


    In the dark days of computer science, each vendor vent off to develop its

    operating system, with its own set of commands and programming

    interfaces. This way of thinking created a Tower of Babel (not to be confused

    with the Tower of Hanoi, which is a puzzle game) among computer users and

    programmers. When Unix systems first appeared, however, they were

    portable across different types of hardware, and you could have the same

    operating system, and programming interfaces whether you were

    programming a Digital Equipment Corporation system, a Sun Microsystems

    computer, an IBM computer, or others. Unfortunately, this approach lasted

    about ten minutes in the scope of Unix''s life, because as Unix escaped from

    Bell Labs, it to the University of California, Berkeley, and poof: Two

    different Unix systems were now in existence!


    A later time, vendors started introducing their versions of Unix, some using

    System V as a basis, others using BSD (as the Berkeley version was called).

    Some vendors, such as Sun Microsystems, started with BSD and then

    itched to System V (to the chagrin of its users).


    In 1988, the IEEE developed the POSIX standard for operating systems.

    The IEEE is a great organization, and probably the best thing that it did to

    build on Unix rather than start over from scratch. It took the interfaces from

    the existing System V and Berkeley versions of Unix.


    # Other places to look for help


    You can find help in several other places on the

    system. One is the /usr/doc directory,

    which contains the documentation that comes

    with the individual software packages.

    Instance, the nmap network service package

    described in Chapter 5 installs documentation

    about what it does and how to use it in the

    /usr/doc/nmap directory.


    systems. With the abundance of inexpensive

    disks, this is usually penny wise, pound foolish.

    Documentation, such as that found in /usr/

    doc, can be put on one system and then make

    available to everyone through the magic of the

    Network File System (NFS). Tell your system

    administrator to do that. If you are your own

    system administrator, go into a closet and give

    yyourself a lecture!


    Note: Some system administrators conserve

    disk space by not loading /usr/doc on their'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# 380 Part VI: The Appendixes


    If an operating system is POSIX- compatible and a program is written to POSIX
    standards, the program should run on the operating system with no problems, and
    users should be able to use that operating system with little or no retraining
    from the last POSIX operating system learned.


    > TIP





    Although much work still has to be accomplished both in defining what POSIX is
    and in vendors implementing POSIX, POSIX compliance and certification are worthy
    goals.


    Other standards should be implemented and met by manufacturers, distribution makers,
    and developers (not necessarily in that order) — standards for network communication,
    for the way data is put on the CD-ROM, and so on. Both formal standards and informal
    defacto standards exist, both of which help your system work better with the next
    system.


    Linux was built with POSIX compatibility as a goal, and it follows many of the
    other standards. This makes it easy to port code from one set of POSIX-compatible
    interfaces to another and one POSIX-compatible operating system to another. It
    also allows Linux to operate with other operating systems. Many Linux people are
    active in standards bodies, and the movement toward standards is generally supported
    in the Linux community.


    # Files


    In addition to the startup or configuration files mentioned previously, sometimes
    the command or program that the manual page is describing uses other files in
    the system and temporary files for holding intermediate work. Such files are listed
    in this section of the man page. If a command does not work, perhaps one of these
    files is missing, the wrong file permissions (or the directories they are in have
    the wrong permissions), is owned by the wrong person, or has corrupt data.


    # Future work


    The future work section lists the author’s plans for the command or program that
    the manual page is describing, often in an attempt to generate interest and help
    from other people.


    # See also/related software


    The see also/related software section lists programs associated with the command
    or program that the manual page is describing. Often, several programs make up
    a system of programs to do a particular task. Some'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# Appendix D: Diggin'' Them Linux Man Pages 381


    programs have similar capabilities, but are not quite the same. Some programs
    are the antithesis of the program you''re looking at (for example, cut and paste).
    The see also often gives you an overall picture of what the program is supposed
    to do or leads you to the right program for the job.


    # Finding the Right Man Page


    If you don''t know what command you''re looking for, use the apropos command followed
    by the word you''re interested in. The apropos command searches all the man pages
    looking for that word, and lists the man names along with one-line descriptions
    of all the commands that contain that word. You should pipe the output of the
    apropos command into the


    ```

    [paul@veracruz paul]$ apropos print |

    ```


    The apropos command can match partial words (called strings), which is why we
    suggested print instead of printer. The shorter your keyword, the more matches
    the command finds.


    After the pages you want to look at, execute the man command for each one. From
    the one-line description, you can probably decide which commands fit your needs.


    Look at the description field, which gives you a better idea of what the command
    can do. If you''re still not sure about the command''s basic functionality, look
    to the see also section, to see whether any other commands fit the bill.


    After that, skip the synopsis section — it''s usually a reminder of how to type
    the command — and go directly to the options section. Read through the options
    section, trying to apply the options to the basic description of the command.


    After you''ve read several man pages, you''ll notice the same options appear for
    similar commands.


    This is pretty much passive work. To find out what a command really does, you
    should try it out. Create a small test file by using an existing file, such as
    the /etc/passwd file, as input. (It''s better not to practice while logged in
    as root as you could accidentally damage a file or directory.)


    ![](img/5275bfa3908ad63320aaea42eefe467c_404_0.png)


    ![](img/5275bfa3908ad63320aaea42eefe467c_404_1.png)'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 382 Part VI: The Appendixes


    From time to time, we read all the man pages in the system, concentrating on the
    command descriptions. We do this because we want to become familiar with new commands.
    Also, our memories aren''t what they used to be. But to be fair to our failing
    memories, the system does have close to 1,200 general-user commands and about
    260 system administration commands.'
