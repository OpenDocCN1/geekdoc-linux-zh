    # Taking a Look at What RPM Does


    RPM performs three basic functions: installing, upgrading, and removing packages.
    In addition to these functions, it can also find out sorts of information about
    installed and yet-to-be-installed packages. (All this and it washes windows, too.)
    Here''s a brief rundown of each function:


