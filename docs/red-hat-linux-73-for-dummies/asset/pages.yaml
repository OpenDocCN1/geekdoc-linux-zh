    # The Command-Line Interface (CLI) versus the Graphical User Interface (GUI)


    Red Hat installs the X Window System by default. You can perform most of the administrative
    tasks with the GUI-based tools (GUI stands for graphical user interface) that
    Red Hat provides. Most of the how-to instructions in this book use the X-based
    applications and utilities. We do that because they are generally easier to use
    and is not a systems-administration-oriented book.


    Occasionally, a utility or program doesn''t run graphically, and other times using
    nongraphic methods and systems is just more interesting or convenient. Believe
    it or not, some geekier Linux users actually prefer to use a text-based, command-line
    interface, or what most call a shell. If you''re not familiar with the command-line
    interface just to prove that you can, we don''t recommend using it. If you''re
    a geek, we''ll still like you. On the other hand, it makes good sense to know
