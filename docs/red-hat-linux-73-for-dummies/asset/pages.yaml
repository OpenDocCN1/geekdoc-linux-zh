  md: '# 352 Part VI: The Appendixes


    Use the second option if you have a Windows PC and want to recycle as a Linux-only
    computer. You should use the third option if your disk has extra space and you
    want to save everything that is already stored on it.


    This book uses the automatic method because it provides the most straightforward
    installation process for by far the least hassle. The manual method can be quite
    difficult to perform, and unless you have a compelling reason to do so, there
    isn''t much point.


    The automatic partitioning process removes all the data from existing Linux partitions
    that are on your hard drive. Your Windows partitions will not be affected if you
    have any.


