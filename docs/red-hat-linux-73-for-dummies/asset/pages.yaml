  md: '# Chapter 7

    Connect Locally, Browse Globally:

    Connecting to a Local Area Network (LAN)


    +   In This Chapter

    - Networking with an Ethernet or wireless NIC

    - Using the Red Hat Network Configuration Druid

    - Starting and stopping your local network connection


    This chapter shows you how to connect your Red Hat Linux computer to an existing
    local area network (LAN) or private network. This is different than connecting
    directly to the Internet with a modem or broadband connection as described in
    Chapters 5 and 6. In this case, you connect directly to a LAN with an Ethernet
    or wireless network adapter. If your LAN has an Internet gateway, then you can
    connect to the Internet, too.


    We describe how to connect to an existing LAN because many people have access
    to them. You may be building your Red Hat Linux computer to use at work or at
    school. It doesn''t matter what the venue is, you can use this chapter to connect
    your computer to an existing LAN. You''ll be able to access the Internet if that
    LAN is connected to.


    In this book, the terms LAN and private network are used interchangeably.


    If you configured your Ethernet card during the installation process we show you
    in Chapter 2, then skip this chapter or just skim it. Otherwise, if you have a
    wireless adapter (not described in Chapter 2) or didn''t configure your Ethernet
    adapter in Chapter 2, then use this chapter to configure your Ethernet adapter
    for the first time or reconfigure networking for your Red Hat Linux machine.


    ![](img/5275bfa3908ad63320aaea42eefe467c_120_0.png)'
  merge: -1
