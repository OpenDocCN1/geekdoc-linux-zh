  md: '# In this part…


    You have finished your initial journey. Red Hat Linux is up an running, and you''ve
    mastered the basics of the Internet and LANs. You''ve looked at the map enough
    to know where you are. Now, the big question: What do you do with it?


    Well, one thing that you can do while the computer is warm your feet while you
    watch the screen saver kick in. You can also confide to all your friends that
    you have a “Red Hat box” at the next party you go to. Wow, that''ll make you popular
    as they clamor to know your stock options nature. Or you can actually use your
    new Red Hat Linux workstation to get things done.


    Chapter 10 introduces you to the wonderful world of the GNOME environment. GNOME
    is a friendly little guy to put a friendly face on Linux. With GNOME, you can
    set up the “look and feel” of Linux so that you feel comfortable and at home.
    Chapter 11 takes you a bit further and introduces some of the many cool things
    that you can do from GNOME.


    Next, in Chapter 12, the serious fun starts. Can you say “par-tay?” (Sorry.) Chapter
    12 describes how you can listen to audio CDs and MP3 files. We also show you how
    to record the sound from CDs. Finally, you become your own recording studio by
    recording audio — and data if you''re a nerd — to CD.


    Finally, Chapter 13 takes the audio thing step further. It shows how to use the
    commercial product RealPlayer to listen to streams. No, water streams, but audio
    and video streams flowing from the Internet. You can listen to radio, audio clips,
    and watch video, too. RealAudio provides a free version of its player (that we
    use here), which you can download from the Net. We also use two of the CD/MP3
    players — xmms and gtv — that come with Red Hat Linux to play MP3 audio and video.
    With this knowledge, you never have to leave your couch again. Now, that''s living!


    We finish Part III by describing how to get work done with StarOffice. Sorry,
    but reality bites and personal productivity suites — word processor, spreadsheet
    — are a necessary evil. Gotta make the donuts.'
