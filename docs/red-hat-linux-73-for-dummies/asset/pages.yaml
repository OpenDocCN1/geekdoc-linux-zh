- img_proc: true
  md: 'The less and more commands have two apparent differences. One, the less command
    requires a q command to get back to the Linux prompt, even when you''re at the
    end of the last page. Two, the more command always says More at the bottom of
    a screen, whereas less has just a : character at the bottom of the screen to indicate
    that it''s waiting for you to input the command.


    # Regular expressions: Wildcards and one-eyed jacks


    If you had to type every filename for every command, Linux would still be useful.
    But that makes Linux more useful is the capability to use a few special characters
    — called metacharacters, pattern-matching characters, wildcards, or regular expressions
    — to supply filenames. Just as you can substitute wildcards for any card of your
    choice in a poker game, Linux pattern-matching characters can be substituted for
    filenames and directory names, like DOS wildcards.


    Three of these special pattern-matching characters follow:


    +   * (asterisk)

    * ? (question mark)

    * \ (backslash)


    The asterisk matches at least one character in any filename. For example, * matches
    the following filenames:


    ```

    a

    acd

    bce

    moody

    ```


    You''ll probably use * the most in the command ls -1 *.


    The question mark matches any single character. The string of characters a?c,
    for example, matches the following:


    ```

    abc

    dc

    aac

    afc

    a9c

    ```


    ![](img/5275bfa3908ad63320aaea42eefe467c_249_0.png)'
