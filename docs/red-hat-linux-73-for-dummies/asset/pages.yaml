  md: '# Chapter 2: Preparing Your Hard Drive for Red Hat Linux


    We strongly suggest backing up any important files on your hard drive before performing
    any major work on repartitioning. You don''t lose any data or programs that you
    worked hard to install. Refer to your system''s owners'' manual to find out how
    to back up your system and how to restore the data if necessary.


    You can reconfigure an existing Windows partition so that you can install Red
    Hat Linux on the same disk using one of two methods:


    +   - Destructive repartitioning: This method involves shrinking the DOS partition,
    which wipes out all the data on the hard drive.

    - Nondestructive repartitioning: This method moves and confines data on the hard
    safely into its own partition, leaving the rest of your hard drive for Linux.


    Microsoft''s NTFS file system (Windows/2000 and XP) typically use NTFS but can
    also use FAT32) cannot be altered with the tools provided by Red Hat Linux. You
    can purchase commercial tools like Norton''s Ghost to modify NTFS. If you don''t
    want to pay for tools, you can still install Linux along with your NTFS-based
    computer has more than one partition, then you can use one of the partitions to
    install Red Hat Linux. You have to be willing, of course, to lose whatever is
    installed on that partition to do.


    # Nondestructive Repartitioning with fips: Can''t We All Just Get Along?


    If you add another hard drive to your system, then your only choices are either
    destructive or nondestructive repartitioning. Nondestructive repartitioning is
    definitely the better choice if you want to retain existing data or another operating
    system on the same computer as Red Hat Linux. (You still should back up your system,
    just in case you have to restore afterward.) Destructive repartitioning wipes
    everything out of your disk and makes installing a new operating system straightforward.


    The fips utility works by dividing the drive into two partitions. The first partition
    includes your initial operating system, such as Windows. The second partition,
    which begins at the end of the space used by Windows and encompassing the rest
    of the drive space, is the non-DOS partition where you install Red Hat Linux.'
