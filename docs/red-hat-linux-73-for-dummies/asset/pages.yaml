    Here''s the syntax you use to run the fsck command manually:


    fsck (options) filesystem


    The word filesystem here names the device driver (block special file in technical
    geek-speak) that connects Linux to the file system. If filesystem is omitted,
    the fsck utility checks all the files listed in the /etc/fstab configuration file.
    If the fsck utility finds any errors, it prompts you for input on what to do about
    the errors. For the most part, you simply agree with whatever the program suggests.
    The fsck command has the following options:


    | Option | How You Use It |

    | -p | Clean the file system. Perform automatic repairs that don''t change the
    contents of files. |

    | -n | Answer no to all prompts and only list problems; don''t repair them. |

    | -y | Answer yes to all prompts and repair damage regardless of how severe. |

    | -f | Force a file system check. |


    Many people run the fsck command with the -y option. If you run fsck with the
    -p option, Linux performs some steps automatically, placing lost files in the
    lost+found directory, deleting zero-length files, and placing missing blocks back
    on the list of free blocks.(Free blocks are still available for filling with data,
    among other things.)


    It is possible for fsck to cause problems with your disk. The best way to ensure
    fsck does not cause damage is to run it when your computer is operating in single
    user mode. Change the state of your computer to single by running the init -s
