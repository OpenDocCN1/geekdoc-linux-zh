  md: '# Description


    The description section is a brief introduction to the command''s functionality,

    which is then expanded on by what the options specify the command to do.

    A good example of a description is the manual page for man itself.


    # Options


    The options section tells how the command treats data in the arguments.

    Each option modifies the command''s actions, drastically or subtly.

    The options can also pass information to the command about where to find files.

    The three types of options are:


    +   - No argument

    - Attached argument

    - Positional argument


    No argument means the option has a hyphen, followed by one or more

    single-character options. For example:


    ```

    [paul@veracruz paul]$ ps -ax

    ```


    A and the x do not have any other values that they have to look at. But in

    the following command:


    ```

    [paul@veracruz paul]$ 1pq -Pzklsa

    ```


    the -P option needs you to supply an argument, in this example, zklpsa.


    # Environmental variables


    Sometimes, to cut down on the information you have to give the command,

    you can set an environmental variable. Each shell (or command interpreter)

    has an environment it works in. This environment (when it is created)

    consists of certain files that are open, some memory, and almost always

    some environmental variables.


    Using the bash shell, type the following (if you''re not sure that you''re using

    the bash shell, type bash at the command prompt and then continue

    the example:


    ```

    [paul@veracruz paul]$ printenv

    ```'
