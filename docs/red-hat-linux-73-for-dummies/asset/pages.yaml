  md: '# # Appendix B

    Installing Red Hat Linux in Text Mode (The Ugly Way)


    Red Hat Linux gives you two installation interface choices: a graphical and a
    menu-based one. The graphical system simplifies the process by grouping similar
    configuration choices together. (We cover this option in Chapter 3.)


    The menu-based option takes you step-by-step through the entire installation and
    works on more computers than the graphical one. The graphical system doesn''t
    work on all video cards.


    # ## Stage 1: Starting the Installation


    To begin the menu-based installation, follow these steps:


    +   1. Insert the CD into your CD-ROM drive (and your boot floppy disk you can''t
    boot from CD) and boot or reboot your computer.


    In Chapter 2 we show how to test and see if you can boot from CD-ROM and, if you
    can''t, how to create a boot floppy disk with Windows, MS-DOS, or Linux.


    The Welcome to Red Hat Linux screen appears along with the boot prompt.


    During the installation, you and Red Hat Linux talk to each each other by using
    — what else — dialog boxes. To maneuver between highlighted options in a dialog
    box and make your choices, using the following keys (note that cursor means the
    cursor or the highlight): Table B-1 gives you the lowdown on how to maneuver through
    those text boxes like a pro.


    ![](img/5275bfa3908ad63320aaea42eefe467c_372_0.png)


    ![](img/5275bfa3908ad63320aaea42eefe467c_372_1.png)'
  merge: -1
