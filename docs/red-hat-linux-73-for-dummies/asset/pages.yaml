  md: '# Introducing hard drives


    You need to decide whether you want to put Linux on a separate hard drive from
    MS-DOS and Windows or whether you want the two operating systems to share one
    hard drive.


    From here on, unless we mention a particular system, consider MS-DOS and Windows
    as the same thing.


    We strongly recommend that you put Linux on a separate hard drive. First, you
    can now find 2GB hard drives for less than $100 (U.S.). Second, the task of shrinking
    MS-DOS and Windows small enough to allow Linux to reside in its full glory on
    an existing hard drive is difficult at best and impossible at worst. And although
    splitting the Red Hat distribution across all hard drives is possible, doing so
    will make updating the distribution


    If you purchase another hard drive, install it as the second hard drive on the
    first IDE controller or as drive 1 over your SCSI controller (assuming your existing
    Windows hard drive is either the first hard drive on your IDE controller or ID
    0 on your SCSI controller). Adding hard drives is a hardware; store where you
    buy the hard drive should be able to add it to your system for you. And while
    the system is there, you can ask the store folks to tell you the details on the
    other hardware in your system.


    While installing Red Hat Linux on your hard drive, you may be asked to supply
    the number of drive heads (or tracks), the number of cylinders, and the number
    of sectors per track. Most modern hard drives provide this information on a paper
    label on the outside of the drive. Some modern hard drives are set up for Windows,
    and Linux can access the number of drive heads, cylinders, and sectors.


    If you have your computer apart looking for other information (a pox on manufacturers
    who don''t supply such useful information), you may well write down all the hard
    drive information you can find. You should look for the number of heads, cylinders,
    and sectors. This information is used to tell the operating system where to put
    data with the beginning of the hard drive. If you have trouble, check out the
    "Getting Information from Windows 95/98" and "Getting Information from MS-DOS"
    sections. SCSI hard drive users don''t have to supply this information because
    the SCSI controller and device drivers calculate it on the fly. SCSI hard drive
    owners should, however, know the size of their hard drives, which is printed on
    the hard drive or is available through the sections just mentioned.'
