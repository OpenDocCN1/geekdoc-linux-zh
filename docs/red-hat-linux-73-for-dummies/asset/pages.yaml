    # Locating your modem with Windows


    If you''re running a Windows 9x/ME or a Windows NT/2000 system, then you can see
    which port your modem is connected to by following these steps:


    +   1. E-mail Bill Gates and ask him for your configuration.


    +   If he''s in court all week, see Step 2.


    +   2. Choose Start Settings: Control Panel.


    +   The Control Panel window appears.


    +   3. Double-click the Modem icon.


    +   The Modems Properties dialog box appears.


    +   4. Select the modem listed with a COM line number beside it. This is the Windows
    designation for your modem''s serial communications line. Thus, if the number
    1 appears, that means Windows knows it as COM1; if it''s a 2, then it''s COM2;
    and so on. These number designations translate directly to the matching number
    of ttyS0, ttyS1, ttyS2, and ttyS3 in Red Hat Linux.


