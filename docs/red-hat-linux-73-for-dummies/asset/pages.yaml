  md: '# 282 Part IV: Revenge of the Nerds


    # The blind leading the blind


    Paul''s colleague, Ken Hatfield, once said, "One of the side benefits from lots
    of troubleshooting comes from what I call the value of blind alleys. Most often
    in troubleshooting, you go down blind alleys, or in your tree example, the wrong
    branches of the solution tree. But by doing so, you learn something. In the future,
    when you encounter a different problem down the road, that previous blind alley
    may be the road to the solution." Well said.


    file system had filled up, which caused some programs that used it to fail. When
    space on /var was freed up, most of the programs started to do their job again.
    But one program didn''t work. Paul spent a long time trying to figure out why
    it didn''t work even after the problem was fixed. As it turned out, this particular
    program''s real problem was that its license expired. He had not walked down a
    blind alley but bumped into a wall and kept trying to go forward. D''oh!


    Here''s an example: Paul recently had a server that was having a lot of problems.
    The /var


    Every problem has a solution. Computers are cause-and-effect-based machines. When
    something breaks, or doesn''t work, there''s always a reason. The reason may not
    be easy to find, but it exists.


    But how do you find the cause? That''s a million-dollar question. A million bucks
    isn''t easy unless you''re willing to grind your teeth, plot against your fellow
    contestants for months on a desert island, purchase ten million Ball tickets,
    or — believe it or not — work hard and work smart. Some people are willing to
    eat rats for the chance or are lucky enough to win the lottery, but most just
    have to work hard. Oh well.


    Working hard is easy, but how do you work smart? That''s the idea of the fault
    tree. The fault tree looks like an upside-down tree. The trunk of the tree represents
    the fault, and the ends, or leaves, of the branches represent all possible causes.
    The fault tree is a conceptual aid that helps you to eliminate all the cause of
    your problem. That''s why, solving the problem is virtually assured.


    For example, 19-1 shows part of a fault tree that points out what major subsystems
    you should look at. To find the solution to a problem, you need to systematically
    identify what''s working. You work your way back to what''s not working, and then
    when you find it, you usually solve your problem. The fault tree concept helps
    to formalize the process.


    Following are some of the possible faults:'
