  md: '# Configuring the Cisco 675 or 678 DSL modem


    The following steps describe how to configure a Cisco 675 or 768 DSL modem. We
    use a DSL modem here because it''s the most common DSL device available today.


    The following process involves setting up your authentication, routing, and NAT.
    You must first configure the DSL modem with its own passwords and other information.
    (See the "Connecting your Cisco modem to your Linux computer" section, earlier
    in this chapter).


    To configure your DSL modem so that it will work with Red Hat Linux, follow these
    steps:


    +   1. Only the enable account can be used to configure the modem, so type `enable`


    You need to set the Cisco modem passwords. Cisco 675 or 678 models use two passwords.
    One password is for the regular (non-privileged) password called exec, and the
    other works for the administrative account, called `enable`.


    +   2. No enable password is set, so press the Enter key when prompted for the
    password.

    `cbos>` prompt changes to `cbos#` with the pound sign (#) indicating that you''re
    in enable mode.


    +   3. Enter the non-administrative exec password:

    `set exec dslocks!`


    You should use your own password — not dslocks! — of course.


    +   4. Set the administrative enable password:

    `set enable dslislast!`

    Again, you should use your own password rather than our example password. That
    makes sense because our password is displayed in millions of books — well probably
    just three or four books, but we can be optimistic. Make sure you use a different
    password.


    Your DSL modem is very mellow because it uses non-volatile memory. Non-volatile
    memory is very good at remembering things like the passwords that you just set,
    but only if you tell it to remember these things.'
