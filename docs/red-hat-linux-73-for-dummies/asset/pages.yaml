  md: '# 148 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Resizing windows to your heart''s content


    Sometimes a window is a little too big or a little too small, and you know life
    would be much easier if you could nudge that window into shape. To do that, position
    the mouse cursor on either the lower-left or upper-right corner of a window until
    the cursor changes into a double-sided arrow. Click and drag the window''s outline
    to your desired size. Release the mouse button and the window takes the new size.


    Another way to resize a window is to click the far, upper-left corner. A menu
    appears. Click the Window Size submenu and you get another menu that allows you
    to toggle the height, width, or entire window between its normal (default) size
    and the entire desktop.


    ![](img/5275bfa3908ad63320aaea42eefe467c_171_0.png)


    # Making a molehill out of a mountain


    Now that you''ve put a lot of windows on the screen, how can you get rid of few
    or all of them? Well, you can minimize (or iconify) a window by clicking the bold
    underscore towards the upper-right corner, which removes the window from the desktop
    and places it in a storage area on the right side of the Panel. If you''re in
    a particularly devilish mood, you can be more drastic and close a window. Figure
    10-4 shows the previously open Mozilla window minimized—you can see its icon in
    the GNOME panel along the lower, central edge of the screen.


    Here are a few ways to get rid of a window, starting with the most drastic and
    escalating to outright window death:


    +   Take advantage of exit buttons or menu options that the window or application
    give you. For example, many applications allow you to choose File:Exit or File:Quit
    to close the application.


    +   Click the X button in the upper-right corner of the window''s title bar to
    close the window.


    +   Take the upper-left corner of the window or the title bar and then choose
    the Close or Destroy option in the menu that appears. Close attempts to contact
    the application and ask it nicely to stop itself, whereas Destroy doesn''t care
    what the application thinks and stops it immediately.


    +   You also have the option of completely closing the application by right-clicking
    its icon in the Panel and choosing either Close or Kill App in the menu that appears.
    The difference between the two is that Kill App closes the program if it does
    not respond to the Close command. Kill App isn''t as nice as Close and potentially
    could cause problems if you are running a program like a database that is actively
    manipulating data.


    ![](img/5275bfa3908ad63320aaea42eefe467c_171_1.png)


    You can return a minimized window to the desktop by clicking the icon that corresponds
    to the window on the Panel.'
