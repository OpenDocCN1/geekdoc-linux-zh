    # Resizing with fips


    The MS-DOS fips utility is used to nondestructively resize your MS-DOS and/ Windows
    partitions. Newer versions of Windows (including ME) use a 32-bit file allocation
    table (called FAT32) and drive management that provide for single-drive configurations
    larger than 2GB. Older versions of Windows 95 used a 16-bit FAT (called FAT16,
    oddly enough); to use the space above 2GB, the drive had to be partitioned into
    logical drives of 2GB or less. Newer computers often have drives larger than the
    old 2GB limit. If the drive is reed, the large drive management system is disabled,
    and DOS and Windows partitions are once again limited to 2GB.


    To use fips, you must first exit your Windows interface and get to the MS-DOS
    prompt. To do so with Windows 9x, follow these steps (in Windows ME, or Windows
    NT/2000, you need to reboot with an MS-DOS boot disk that includes the fips utility):'
