    > Solution: First recognize that you may have to wait a long time for a slow CPU

    with a small amount of main memory (about 6MB). Some machines with

    small amounts of memory take as long as 6 minutes to start X. Assuming

    that you start X on a machine with a faster CPU and more memory, you

    have problems with permissions on your home directory. This is particularly

    true if X works when you''re logged in as root (that is, as superuser) but not

    when you''re logged in as a general user.


    To correct this, log in as root and go to the home directory of the

    user who is having problems. For this example, suppose that the login

    name of the user is lu. After you in the user''s home directory, issue the

    is ld command to see who owns that directory and what the directory''s

    permissions are:


    ```

    cd -lupe

    is -ld

    drwxr-x- root bin 1024 Aug 31 16:00 .

    ```


    In this example, the directory is owned by root and the group ownership is

    bin, which doesn''t allow lu access to the directory structure inside the

    directory. Because the shells and terminal emulators that X needs require

    access to that directory structure, X can''t fully work.


