  md: '# Chapter 18: Revving Up RPM 279


    # Rpmfind


    Rpmfind window, shown in Figure 18-15, controls RPM find and download capabilities.
    The default server is located on Red Hat''s Web site. This may change over time
    or other (better?) servers may pop up. Well, you have the power to change it here
    by changing the location to where your downloads are saved. One common location
    to save RPM packages is the /usr/local/src/directory.


    ![](img/5275bfa3908ad63320aaea42eefe467c_302_0.png)


    Figure 18-15: The Rpmfind tab of Preferences window.


    Until the advent of the RPM (and the Debian package manager on Debian Linux systems),
    Linux software was only distributed by tar archives, which are sometimes referred
    to as tarballs or more descriptively, hairballs. The tar file storage mechanism
    stores one or more files in a single file in a tar format. A tar file has the
    suffix of .tar; if the tar file is compressed, it has a suffix like .tar.gz. Using
    the tar-based distribution system is sufficient if your software does not change
    often and you are young. When you need to upgrade or change software, or work
    with complex software systems, it becomes quite difficult to work with. Rather
    than spending your life spitting up hairballs, systems like RPM greatly simplify
    your life.'
