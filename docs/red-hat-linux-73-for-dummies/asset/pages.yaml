    Recall information that is given here for later use.


    This is particularly nerdy, technical information. You may skip it, but you may
    find it interesting if you''re of a geekier bent.


    This icon flags discussions that relate to the CD-ROMs. The CD-ROMs contain a
    copy of the latest Red Hat Linux distribution available at publishing time.


    # Where to Go from Here


    You''re about to join the legions of people who have been using and developing
    Linux. We''ve been using Unix for more than 20 years, Linux for more than 10 years,
    and Red Hat Linux for 8 years. We''ve found Red Hat Linux to be a flexible, powerful
    operating system, capable of solving most problems even without a large set of
    commercial software. The future of the Linux, and Red Hat Linux in particular,
    operating system is bright. The time and energy you expend in becoming familiar
    with it will be worthwhile. Carpe Linux.'
