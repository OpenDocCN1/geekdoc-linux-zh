    The physical connections aren''t set up right


    If you don''t see the line containing lo, which is the loopback interface, or
    eth0, which is your network adapter, then your physical network connections aren''t
    set up. The loopback interface is not a physical device; it''s used for the network
    software''s internal workings. The loopback interface must be present for the
    network adapter to be configured.


    If the loopback interface is not present, type the following command:


    ```

    ifconfig lo 127.0.0.1

    ```


    If the network adapter — generally an Ethernet card — is not present, type the
    following command:


    ```

    ifconfig eth0 192.168.1.1

    ```


    Because this is a class C network address, ifconfig automatically defaults to
    the 255.255.255.0 netmask. If you have an unusual netmask, which you shouldn''t,
    type the following command:


    ```

    ifconfig eth0 192.168.1.1 netmask 255.255.255.0

    ```


    Type ifconfig and you should see your network adapter displayed correctly. If
    it''s not, examine the manual page on ifconfig. You display this manual page by
    typing the following command and then pressing Enter:


    ```

    man ifconfig

    ```


    You can page through the document by pressing Enter to go line-by-line, pressing
    the spacebar to go forward one page at a time, pressing Ctrl+B to page backward,
    or pressing Q to quit. The ifconfig man page shows a great deal of information
    on what and how ifconfig works. If you''re still having problems, look at the
    Linux startup information by running the following command:


    ```

    dmesg

    ```


    Note that we use pipe (the | symbol) the output from dmesg to the more command.
    Linux pipes are used to transmit the command to the input of another. After you
    run the preceding command, you see the information page that was displayed during
    the boot process. The more command shows one page of information at a time; use
    the spacebar to display each subsequent page. Look for your Ethernet NIC, which
    should appear after the Adding Swap line in the following code:


    ```

    Free unused kernel memory: 60k freed

    Adding Swap: 13651k swap-space (priority 21)

    Eth0: 350c9 0x2310 tag, BNC port, address ... aa,IRQ 11

    c350c9.c.16 (2.2) 2/38

    becker@desis.gsfc.nasa.gobcker@desis.gsfc.nasa.gov.

    ```'
