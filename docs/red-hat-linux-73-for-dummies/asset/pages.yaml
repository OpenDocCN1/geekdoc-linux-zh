    # Or perhaps you''ve got a funky kernel


    You may also be using a kernel that does not have networking installed. (This
    is unlikely in the newer versions of Red Hat Linux because the Linux kernel automatically
    loads networking— and other modules— on. But it is still informative to go ahead
    and look at these files in order to gain an understanding of how Linux works.)


    Display the networking devices by typing the following command:


    ```

    cat /proc/net/devices

    ```'
