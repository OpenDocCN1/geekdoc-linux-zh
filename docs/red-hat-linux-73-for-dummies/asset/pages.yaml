  md: '# Chapter 15: Bashing Your Shell


    Linux doesn''t care if spaces surround the | character, but you may want to use
    them for clarity and to get in the habit of including spaces because they are
    important at other times.


    When you press Enter, the information appears one screen at a time with the word
    More appearing at the bottom of each screen except the last one. To move to the
    next screen, press the spacebar. When you finish with the last screen, the more
    command takes you back to the Linux prompt. The more command can do even, well,
    more. When the screen halts with the word More appearing at the bottom, you can
    type some commands to the more program:


    +   - q to get out of the more command without wading through all screens

    - h to see a list of all commands available in the more command


    If you press Enter after one screen, Linux shows you the next entry in the list,
    not the next screen.

    Some commands to the more program (such as the b command) don''t work when you''re
    piping input into the program, as opposed to using more with a file.


    # Deleting text from the Linux command line


    Everyone makes mistakes. Everyone changes his or her mind from time to time. For
    those reasons, you need to know how to delete text from the Linux command line.
    If you want to start over, press Ctrl-U to remove everything you have typed if
    you have not pressed Enter. The Backspace key erases one character at a time.
    The left- and right-arrow keys move the cursor along the line of characters without
    erasing; when you get to the place you want to change, use the Backspace key to
    erase mistakes and retype commands. In most cases, the up- and down-arrow keys
    jump the cursor back and forth through the last few commands.


    # Getting less for more


    Linux sometimes uses a command called less, which duplicates the functionality
    of the more command. Originally, the less command was designed to be more robust
    than the more command, but the more command caught up and they are now almost
    the same. Some Linux systems display text with the less command instead of the
    more command, which most Unix programs use.'
