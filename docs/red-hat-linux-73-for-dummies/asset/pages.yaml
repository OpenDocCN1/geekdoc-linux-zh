    # Installation Stage 1: Starting the Installat


    This section gets you started with the Red Hat Linux installation process. These
    initial steps start the installation and perform some basic configuration steps.


    Before getting started you know that you can easily change your configuration
    choices. If you realize you''ve made a mistake, you can hit the Back button to
    retrace your steps and redo your choices. And if you ever want to stop the installation
    process altogether, you can simply reboot your computer.


    ![](img/5275bfa3908ad63320aaea42eefe467c_55_0.png)


    # For installation masochists and text snobs only


    You can run the Red Hat Linux installation system from a graphical interface or
    from a text-based interface. The graphical method is the default, and that''s
    what we discuss in this chapter. In addition to the ease of using a mouse to point
    and click, the graphical method also groups similar configuration choices together.
    For example, the keyboard and mouse selection is presented within one window,
    not two, as in the text-based installation.


    Here are reasons why you might have to use the text-based installation:


    +   You really, really want to use the text-based install because you have some
    twisted prejudice against pointing and clicking.


    +   The Red Hat Linux installation system can''t use your graphics adapter. You
    will figure this out when the graphical installation window doesn''t appear and
    you see a text-based window adapter; the text-based system uses the keyboard to
    enter information and cursor (arrow) keys to move from step to step. This doesn''t
    happen very often because Red Hat has done its homework and refined the installation
    process.


    If you''re one of those lucky readers who has to do a text-based installation,
    the instructions in this chapter are best used to line your birdcage. We show
    you how to install Red Hat Linux the ugly way in Appendix B.'
