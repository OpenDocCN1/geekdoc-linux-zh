  md: '# Chapter 23: Ten Security Vulnerabilities 327


    # # Open the Encrypt


    It''s hard to trust communication media that you do not completely control — such
    as university LANs, wireless home networks, and the Internet. Our point: Trust
    no one!


    ![](img/5275bfa3908ad63320aaea42eefe467c_350_0.png)


    Any public network is potentially dangerous, especially the Internet. One way
    to protect yourself is to use encryption for all communication. You use encryption
    when you conduct credit card transactions or read remote e-mail. Secure Socket
    Layer (SSL) communication is the standard encryption mechanism for secure Internet
    browsing and e-commerce transactions.


    The Secure Shell (SSH) protocol is used to conduct encrypted CLI sessions and
    file transfers. Red Hat bundles the open source version called OpenSSH with its
    distributions. When you install Hat Linux, you automatically get the OpenSSH client.
    You can use OpenSSH from a terminal session by entering the command ssh destination.
    The destination is the computer you want to communicate with.


    Using encryption is essential when you use wireless networking. WIFI (also known
    as 802.11b) wireless networks with the ability to use built-in encryption based
    on the WEP protocol. WEP does some significant security vulnerabilities, though.
    The only long-term answer is to wait until the next standard comes along to fix
    the problem or else use SSH to provide your own encryption. You''ll be much safer
    if you use OpenSSH SSL for as much of your communication as possible.


    ![](img/5275bfa3908ad63320aaea42eefe467c_350_1.png)


    # # Aaha, No Firewall. Very, Very Good.


    Broadband connections give you a quantum leap in speed and convenience when connecting
    to the Internet. The two choices for a broadband connection are DSL and cable
    modems. Once you start using them, you''ll never go back to slow, Stone Age telephone-based
    modems.


    ![](img/5275bfa3908ad63320aaea42eefe467c_350_2.png)


    But every line has a dark cloud. Broadband connections not only give you fast
    Internet but also continuous ones. With a telephone-based modem, a hacker can
    only attack your home computer and private network while connected to the Internet.
    Using a 24/7 broadband connection means that every hacker on the Internet — that
    means every hacker in the world — can constantly bang on your computer and private
    network. That''s a lot of vulnerability.


    Firewalls provide you with number protection from Internet based attacks. The
    modern Netfilter/iptables packet filtering firewall system gives you excellent
    protection when properly configured: Chapter 8 describes how'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'to configure Netfilter/iptables for the three Internet connection paths that
    we use in this book. You should never, ever connect to the Internet without first
    configuring your personal firewall.


    We don''t mean to imply that you are vulnerable to attack if you use a telephone-based
    modem to connect to the Internet. Traditional modem connections are just as vulnerable
    as continuous broadband connections when they are active. What we mean is that
    a modem that isn''t connected to the Internet is a safe modem.


    # # Keeping Up with the Joneses


    Nobody''s perfect and goes for operating system vendors. Even open source Linux
    developers and great companies like Red Hat make mistakes. Vulnerabilities are
    found in software systems all the time and have to be fixed.


    Well, Red Hat provides a way to keep up to date with current problem and security
    fixes through its Web site. Go to www. redhat.com/updates to find the newest and
    safest versions of all your systems RPM packages. You can also find out how to
    configure your Red Linux system to update automatically.


