    # # Talking to Your Computer (And Knowing What You Should Ask)


    Knowing how your computer is constructed can help you when you install Red Hat
    Linux. Your computer is built from several primary groups of equipment. The following
    list shows what your groups are:


    +   * Hard drive controllers. How many do you have, and what are their types (IDE,
    SCSI?) Which hard drives are connected to which controllers? If a SCSI controller
    is installed in your machine, what’s its make and model number?


    +   * Hard drives. How many hard drives do you have? For each drive, what is its
    size and order (which one is first, second, and so on)?


    +   * CD-ROM. What is the interface type? Is it an IDE drive, a SCSI drive, or
    some other type? For CD-ROM drives other than IDE (ATAPI) or SCSI, what is the
    make and model number?'
