  md: '# Chapter 12: Configuring Your Red Hat Linux Sound System


    7. If you don''t know what kind of sound card you have, look at the files in the
    /proc directory by typing ls /proc command at the command prompt and press Enter.


    The proc file system does not correspond to an actual (physical) hard drive. /proc
    is a virtual file system that exists only within the mind of the Linux kernel.
    it is designed to provide information about Linux processes and hardware. /proc
    provides a window into the running Linux kernel (operating system). You can find
    out a lot of information about your equipment from it.


