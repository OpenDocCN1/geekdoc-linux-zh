  md: '# Chapter 5: Connecting to the Internet with a Dial-up Modem


    # Locating your modem with Linux


    Linux uses device files to communicate with peripherals. Device files occupy the
    /dev directory and are equivalent to Windows drivers — you need them so that your
    hardware works.


    Your modem can connect to one of four serial ports available on your PC. A serial
    port is the mechanism that your computer uses to communicate with a device, such
    as a modem. An external modem is generally connected to /dev/ttyS0 or /dev/ttyS1,
    although configuring it as /dev/ttyS2 or /dev/ttyS3 is possible. If you have an
    internal modem, then it can be one of the tty devices.


    During the boot process, Red Hat provides a utility called kudzu which automatically
    locates new devices when you boot your system. kudzu detects a new device, it
    prompts you to configure the device, and you should let it do so, kudzu''s hard-working
    little guy. Note of what device it is attached to.


    If kudzu is unable to find your modem, then finding it by process of elimination
    is a crude but effective method. The following numbered lists describe how to
    find your modem. The first method is for an external modem and involves searching
    a string of characters to the modem and looking for the light-emitting diodes
    (LEDs) to light up. The second method is for internal modems, which don''t have
    LEDs and use the hideous screeching sound of your modem to track it down.


    +   1. If you have an external modem, you can find it by running the following
    command as a command prompt:

    echo "anything" > /dev/ttyS0


    Honestly, it doesn''t matter what you put between the quote marks in the preceding
    commands. It just has to be some text — any text.


    If your modem is connected to the serial port, you yet try to send/receive LEDs
    (sometimes marked as RX/TX) string to light up in a short burst.


    +   2. If your isn''t found, try sending the string to /dev/ttyS2 and finally
    /dev/ttyS3 by altering the name at the end of the command in Step 1 to match the
    port you''re targeting.


    Life is a bit harder if you have an internal modem because you don''t have a visual
    response. You can, however, listen to the modem''s speaker to find out what''s
    going on. To do so, follow these steps:


    +   1. If you have an internal modem, enter the following command as a command
    prompt:

    echo "atdt55555309" > /dev/ttyS0'
