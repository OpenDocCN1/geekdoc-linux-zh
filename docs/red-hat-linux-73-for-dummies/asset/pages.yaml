  md: '# 144 Part III: Linux, Huh? What Is Good For? Absolutely Everything!


    A window manager isn''t necessary, but it would be difficult to use more than
    one or two applications at the same time without using a window manager. (The
    applications themselves would need to be written to allow resizing, window positioning,
    and so on. What a drag that would be for a programmer!)


    Among the many functions they perform, window managers may also maintain an icon
    bar, which keeps clickable icons easy to find and manage. But the most important
    thing to remember about window managers in X is that they user-level programs
    like any other—they are not part of the system. You have a choice of window managers,
    and each has different capabilities, although a discussion of window managers
    other than GNOME and their capabilities is outside the scope of this book.


    ![](img/5275bfa3908ad63320aaea42eefe467c_167_0.png)


    The Red Hat Linux 7.3 For Dummies CD-ROMs contain several window managers including
    the GNOME Sawfish window manager, KDE, and the previous Linux standard Fwm. GNOME
    Sawfish is the default for Red Hat Linux and is the window manager used in this
    book. KDE is similar to GNOME in many ways. You can also use old good Fwm to start
    applications (and stop them of course), move windows, shrink windows, expand windows,
    and do everything but wash windows. Just think, you can use your system without
    ever typing a command!


    # Going old-school with the terminal emulators


    The second main type of program under X is the terminal emulator, shown in Figure
    10-1, in the GUI. Back in the old days, you could only type in text commands and
    see the results in text and you did that on a terminal. You might be wondering
    why you would want to simulate a dumb, inexpensive terminal when you paid a lot
    of money for a neat graphics monitor. Shouldn''t every program be graphical?


    Well, in the early days of X, few graphical programs were available. Most programs
    were written to run on non graphical interfaces and did not include the libraries
    that create graphical programs on an X Server. That means that to run both graphical
    and non graphical programs, the dumb terminal had to be much through software.


    When you start a terminal emulator, the emulator usually executes a shell and
    gives you a command-line prompt. You type commands at this command prompt, and
    the results are output to the terminal emulator window. GNOME provides a terminal
    emulator called the GNOME terminal. You can start the terminal by clicking the
    icon that looks like a TV monitor with a footprint on it. You can find this icon
    on the GNOME menu bar at the bottom of the screen.'
