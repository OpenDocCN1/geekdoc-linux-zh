  md: '# 250 Part IV: Revenge of the Nerds


    To change the ownership of a file or a directory, use the chown command. (it chown
    — change ownership.) In general, you have to be root to do this.


    Suppose you''ve decided to settle down and lead a more contemplative life, one
    more in line with a new profession of haiku writing. Someone else will have to
    plan the weekend sprees and all-night basses. So you give up ownership of the
    vacationtime file:


    ```

    $lidia@veracruz lidia$chown root vacationtime

    ```


    This command changes the ownership of vacationtime to root. If you want to change
    it back, you can use the chown command, but you have to do it as root.


    Files and users all belong to groups in the vacationtime example, the group users.
    Having groups allows you to give large numbers of users — not all users — access
    to files. Group permissions and ownership are handy for making sure that the members
    of a special project or workgroup are handy for files needed by the entire group.


    To see which groups are available to your system, take a look at the /etc/group
    file. To do so, use the more command. You see a file that looks like this


    ```

    root::0:

    bin::1:root,bin,daemon


    nbody::99:

    users::100:

    floppy:x:19:


    your_user_name::500:your_user_name

    ```


    where your_user_name is the login name you use for your account. Please remember
    that the file won''t look exactly like this, just similar. The names at the beginning
    of the line are the group names. The names at the end of the line (such as root,
    bin, and daemon) are user-group names that can belong to the user-group list.


    To change the group that the file belongs to, log in as root and use the chgrp
    command. Its syntax is the same as that of the chown command. For example, to
    change the group that vacationtime belongs to, you would issue the following:


    ```

    $lidia@veracruz lidia$chgrp newgroup vacationtime

    ```


    Red Hat assigns a unique group to each user. For instance, when you add the first
    user to your system, that user gets the user ID and group ID of 500. The next
    user receives the user ID and group ID of 501, and so on. This gives you a lot
    of control over who gets access to your files.


