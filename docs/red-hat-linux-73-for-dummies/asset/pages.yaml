    # Commanding Linux with bash


    A command is just a program that you run in order to get something done. For instance,
    you use the ls command to list files and the mount command to make a floppy or
    CD-ROM drive accessible. Linux provides a rich and varied set of standard commands
    that you use to manage your system.


    Issuing commands can be simple or complicated. That''s because Red Hat Linux is
    a powerful operating system and can do just about anything that you want it to.
    We introduce some Red Hat Linux commands in this chapter.


    ![](img/5275bfa3908ad63320aaea42eefe467c_243_0.png)


    Commands can contain one, two, or all three parts, the first part — the command
    name — must always be present. Linux commands three major parts are:


    +   - The command name

    - Options to the command (telling the command how to change its actions for a
    specific execution)

    - Input or output files, which supply data or give the command a place to put
    output data, respectively


    # A shell for all seasons


    Ken Thompson and Dennis Ritchie first started writing Unix, they wanted to investigate
    lots of new ways in using computers. One of the ideas they explored was making
    the human interface to the computer changeable and adaptable to the specific needs
    of the application.

    This interface (or more specifically, what humans interact with most) is typically
    called a command interpreter because it looks at each command as it is typed and
    converts it into something the computer can follow as


    Most computer systems back then had the command interpreter built into the operating
    system, which meant the user couldn''t change it.(DOS is constructed this way).The
    Unix developed to separate the command interpreter from the rest of the operating
    system. Because the functionality desired was both a command interpreter and a
    complete environment, it was called a shell. The first command interpreter for
    Unix was called the Bourne shell, often abbreviated as sh.'
