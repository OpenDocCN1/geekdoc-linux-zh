    \ automatically.\n\n# Firing Up Your Firewall (And Dousing the Flames)\n\nThe\
    \ previous section described how to create your firewall. However, you do not\
    \ want to manually enter these rules every time you reboot your computer. This\
    \ section shows you how to automate your firewall. We show you how to make use\
