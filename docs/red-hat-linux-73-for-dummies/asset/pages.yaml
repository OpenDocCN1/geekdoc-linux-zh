    # Working on your virtual desktop


    After using GNOME for a while, you''ll probably know that you can create lots
    and lots of windows on the screen. You may even lose windows behind other windows.
    Perhaps you wish that your monitor was larger just so you could open up more windows
    and do more things at one time, or perhaps you might don''t want to close down
    or minimize one application before going to another application.


    Well, monitors are expensive, and a lot of systems can have only one graphics
    card, so you''re probably stuck using a single monitor. But you don''t have to
    be stuck with one screen. X, with the help of GNOME, can give you both virtual
    screens and virtual desktops.


    A virtual desktop enables you to have more than one desktop screen to work on.
    It''s like having four desktops to spread out all work in front of you. You have
    the option of organizing your work — terminals, windows applications like Netscape,
    Mozilla, StarOffice, and such — on different desktops. The default for Red Hat
    Linux GNOME is four virtual desktops. The virtual desktop display icon — the pager
    applet! — on the far-right side of the GNOME Panel controls the virtual desktops.


    By clicking any of the four Desk Guide buttons, you are placed in the corresponding
    desktop. Click the lower-right one, and you go to that screen. Give it a try!'
