    # Assign an IP address to your computer by typing it in the Address text box.


    IP addresses are analogous to street addresses; they provide a number that uniquely
    identifies your machine from all others. Public IP addresses don''t require any
    registration with the powers that be — the InterNIC organization that distributes
    IP addresses. Public IP addresses aren''t routed on the Internet, but they can
    be used on LANs for your own use.


    If you''re on a network with registered IP addresses, be sure to get an IP address
    from your system administrator. Otherwise, go ahead and use a private IP address.
    Use any class C between 192.168.1.1 and 192.168.1.254 or 192.168.1.20.). Private
    IP addresses in this range are designated for use by anyone on their private networks.
    By design, private IP addresses aren''t owned (rout


    ![](img/5275bfa3908ad63320aaea42eefe467c_128_2.png)'
