- img_proc: true
  md: '# 142 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Introducing the Amazing

    X Window System


    The GNOME desktop environment provides Red Hat Linux''s graphical interface by
    default (although you can use KDE if you want). GNOME and its Sawfish window manager
    run on top of the X Window System, also known simply as X, which is the software
    underneath GNOME that makes your Red Hat Linux computer able to display graphics.


    Although the version of X that comes with Red Hat Linux 7.3 is quite sophisticated
    its pretty simple to use. This was not always the case. It took a lot of natural
    — dare we say Darwinian — selection to arrive at the current arrangement of X,
    and the end result works well.


    X has three main parts:


    +   - A graphics server

    - A set of graphics libraries

    - A set of graphics applications that usually use the graphics libraries


    The graphics server is a program that talks to a bunch of important hardware —
    the video card, keyboard, and mouse — on your system, and runs interference between
    this hardware and the other graphics software.


    X''s graphics server receives commands from the set of graphics libraries that
    are associated by default with specified programs. Sometimes these programs are
    executed directly on the same system where the graphics device resides; other
    times, these programs talk across a network to a graphics device on another system.
    Using X you can run your program in one part of the world, and someone can see
    the output of it in another part of the world over the Internet.


    For instance, say you''re logged into a computer in Australia and want to see
    what time it is. You could run the date command (from a command line) to see the
    date and time, and that would be boring. You could instead run the xclock program
    on the remote machine and see a graphical clock displayed on your local computer.
    You can then verify that the Aussies clocks run clockwise and have 24-hour days.


    The server program, often called the X Server, is not part of the operating system,
    as it is in some other operating systems. Instead, X Server is a user-level program
    — a special and complex one.


    ![](img/5275bfa3908ad63320aaea42eefe467c_165_0.png)'
  merge: -1
