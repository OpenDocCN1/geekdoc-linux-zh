    Before you install Red Hat Linux on your hard drive, you need to make room for
    it. Some people find space by getting rid of Windows and installing Red Hat Linux
    by itself, but you may not want to make such drastic changes. Perhaps you prefer
    to have Red Hat Linux and another operating system coexist peacefully. The former
