  md: '# Finding out how X drivers are born


    Your programs come from code that was contributed to X project, which was first
    connected with Project Athena at the Massachusetts Institute of Technology. Later,
    the project became the main focus of XConsortium, a nonprofit group established
    to develop Xtechnology.


    love of programming. The XFree86 team of programmers tries to give support to
    new video controllers as they come out. Unfortunately, giving this support is
    often difficult for several reasons:


    +   - They have no relationship with the video controller manufacturer.


    +   - The video controller manufacturer thinks that keeping the programming interface
    secret gives it an edge against its competitors.


    +   - The video board is built into a larger system board.


    +   - The video controller is simply too new.


    Because the source code was freely distributed, a group of programmers from all
    over the world freely give support to X Window code on low-end PC systems. They
    called themselves XFree86 based on the fact that their code was free and directed
    towards PCs, were largely based on Intel x86 compatible processors.


    Over time, they ported the code to freely distribute operating systems on other
    architectures. They did this—and continue to do this—for the


    Until for new hardware is available, most people rely on SVGA compatibility mode
    to get the card to work.


    # Exterminating X


    If you''re accustomed to a Windows computer, having a section on shutting down
    the graphical interface may seem strange. After all, the Windows graphical interface
    is Windows — the GUI and the operating system are symbiotic. You can''t run one
    without the other.


    Red Linux can run without running X. All you have to do is change the run level.
    The following steps show you how to do that:


    +   1. Log in root.


    +   2. Open a terminal emulator window.


    +   3. Type init 3 at the command prompt and press Enter.


    X stops and you are returned to the command prompt.


    You can also stop X in emergencies (say, if it freaks out) by pressing Ctrl+Alt+Backspace.'
