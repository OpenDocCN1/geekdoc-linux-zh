  md: '# Introduction


    Red Hat Linux 7.3 For Dummies is designed to help you get Red Hat working quickly
    and efficiently. This book shows you how to do fun and interesting— to say nothing
    useful — things with Red Hat Linux. The book is also designed to be an effective
    doorstop or coffee cup coaster. Whatever you use it for, we hope that you have
    fun.


    # About This Book


    This book is designed to be a helping-hands tutorial. It provides a place to turn
    for help and solace in those moments when, after two hours of trying to get your
    network connection working, the 5-year-old tells you that you need to use the
    eth0 and not the eth1 Ethernet interface.


    We tried our hardest to fill up this book with the things you need to know about
    such as:


    +   - Installing Red Hat Linux

    - Getting connected to the Internet

    - Getting connected to your local network

    - Building a simple firewall

    - Using Red Hat Linux to useful things, such as playing CDs, MP3s, and listening
    to the world''s radio stations

    - Understanding the GNOME desktop environment

    - Using useful and applicable applications, such as the StarOffice productivity
    suite from Sun Microsystems, Inc. and RealPlayer from RealAudio, Inc.

    - Working with the StarOffice desktop productivity suite to satisfy your word
    processing, calculating, and presentation needs

    - Knowing where to go for help

    - Managing your Red Hat Linux workstation


    You''ll see troubleshooting tips throughout the book (Chapter 19 is devoted to
    the subject). It is not that Red Hat Linux is all that much trouble, but we want
    you to be prepared in case you run into bad luck.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Red Hat Linux 7.3 For Dummies


    # Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn''t make a few. This book is for you if:


    +   - You want to use the Linux operating system to build your personal workstation.
    Surprise, the CD-ROMs included with this book contain the Red Hat Linux distribution.

    - You have a computer.

    - You want to put the Red Hat Linux operating system and the computer together,
    and using duct tape hasn''t worked.

    - You don''t want to become a Red Hat Linux guru — at least not yet.


    # Conventions Used in this Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues such as:


    +   - What is the best hardware for running Red Hat Linux?

    - Is Coke better than Pepsi?

    - Could Superman beat Batman?


    But these aren''t the types of conventions we''re talking about here. Our conventions
    are shorthand ways of designating specific information, such as what is and what
    isn''t a command or the meaning of certain funny looking symbols.


    # Typing code


    Commands in the text are shown like this. Commands not shown in the text, but
    set off on lines by themselves, look like this:


    ```

    [lidia@veracruz lidia]$pwd

    /home/lidia ]

    ```


    See [lidia@veracruz lidia] in the preceding. You won''t necessarily see that on
    system, unless you''re happen to be my wife''s mirror image who also likes Veracruz,
    Mexico very much. But you will see similar depending on what your computer and
    username are. The first name lidia is replaced by whatever your user name is.
    The second name is your computer name. The final one is the directory you are
    working from, which in this case is lidia''s home directory. Therefore, if your
    user is zoot and computer name is wishbone, then your prompt is


    ![](img/5275bfa3908ad63320aaea42eefe467c_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    [zoot@wishbone zoot ]$.


    When you see stuff in boldface, it means it''s something you should type. For
    example:


    Type man chown at the command prompt and press Enter.


    If we tell you to type something in a bolded step, the text you type won''t be
    bold. As in


    +   1. Type man chown at the command prompt and press Enter.


    Here''s a rundown of the command syntax in Linux:


    +   - Text not surrounded by [ ] or ( ) brackets must be typed exactly shown.

    - Text inside brackets [ ] is optional.

    - Text in italics must be replaced with appropriate text.

    - Text inside braces { } indicates that you must choose one of the values that
    are inside the braces and separated by the | sign.

    - An ellipsis (..) means and so on to repeat the preceding command line as needed.


    Don''t concern yourself with this too much now. For most of the book, you don''t
    need to know these particulars. And when you need to know something about a particular
    syntax, come back here for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means you should press the Ctrl key, Alt key, and Delete key all at the same time.
    (No, we don''t make you press any more than three keys at the same time.)


    Most of the applications and utilities that we describe in this book use user
    interfaces (GUI) such as GNOME, which allow you to control your computer by pointing
    and clicking with your mouse. Occasionally, we give non-graphical instructions
    for pressing keys on your keyboard. In these situations, we simplify the instructions
    by saying, "select OK". Generally means that you press the Tab key, which moves
    the cursor to the OK button, and then press the Enter key. That two-step process
    is equivalent to clicking an OK button in a GUI.'
  merge: -1
