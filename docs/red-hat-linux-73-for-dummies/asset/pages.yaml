  md: '# 1 Don''t Know How to Remove LILO and Restore My MBR


    **Problem:** You don''t know how to replace the boot record that was on your system
    before you started installing Linux.


    **Solution:** You can log in to Linux as root, and then type the following command:


    ```

    lilo _u

    ```


    Another solution is to boot MS-DOS or Windows 95, 98, NT/2000 and XP to the MS-DOS
    prompt and type the following:


    ```

    fdisk /mbr

    ```


    # 1 Can''t Use LILO to Boot


    **Problem:** You need to put Linux on a hard drive or a partition that is beyond
    the 1023rd cylinder, the second IDE hard drive, the second SCSI ID number, or
    you need to do something else to make it difficult for Linux to boot using LILO.
    You can boot Linux in another way?


    **Solution:** You can use a program called LOADLIN to boot from your MS-DOS or
    Windows system:


    +   1. Copy your configured Linux kernel to the C drive of your MS-DOS or Windows
    system.


    The easiest way to do this is to install Linux, log in as root, and type the following:


    ```

    grep /etc/lilo.conf

    ```


    A line similar to the following appears:

    image=/boot/vmlinuz-2.2.16-21


    This points to your compressed kernel, which in this example is located at /boot/vmlinuz-2.2.10-3.


    +   2. Copy the compressed kernel to a floppy disk, as follows:

    copy /boot/vmlinuz-2.2.16-21 a:\vmlinuz-gz


    The kernel name vmlinuz-2.2.16-21 refers to a specific version of the Linux kernel.
    Except for the /boot/vmlinuz- which remains constant, the name may be slightly
    different on your system.


    A copy of LOADLIN is on the CDs that come with this book.'
