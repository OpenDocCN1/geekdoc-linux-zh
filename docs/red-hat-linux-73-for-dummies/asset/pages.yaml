  md: '# Chapter 20: Configuring X


    # Delving deep into color depth


    Color depth, the number of colors your system can have active on the screen at
    any one time, is loosely a function of both the amount of video memory your system
    has and the screen resolution. that you''re viewing will take up more of the screen,
    but color depth versus resolution is a trade-off that you can make by choosing
    the right options.


    If your system has a small amount of memory (such as 1MB), your screen can have
    a resolution of 1,024 x 768 pixels (dots) with 256 colors (8 bits) at one time.
    If your system has 2MB, you can have 64K colors (16 bits) on the screen at the
    same time at the same resolution. If you have an older video board with a small
    amount of video memory but some additional video sockets, you may be able to upgrade
    the amount of video memory on the video card. When you want to display an image
    and the color depth is not correct, drastic happens. The picture may look a little
    lackluster or not normal. X has an interesting capability to have virtual color
    maps, which allow the active window to utilize all the colors of the depth, even
    if other windows are using different colors. When this option is turned on (as
    it is with the Red Hat distribution in book''s companion CDs), the various windows
    turn off as your mouse moves from window to window, but the window that your mouse
    activates is shown in the best color video memories. With newer video cards and
    larger resolutions in every window, this option is less useful.


    If you have only 1MB at one time, and want to see 64K colors on the screen at
    one time, you can reduce your resolution from 1,024 x 768 to 800 x 600 pixels.
    If you want true color (24 bits), you can set your resolution to 640 x 480 pixels.


    Finally, if your hardware is not new or proprietary, or if you have a notebook
    computer, you may want to buy a commercial X from Metrolink (www.metrolink.com)
    or Xi Graphics (www.xigraphics.com). Sometimes their codes work when XFree86 does
    not. Plus, if you buy an X Server, you can call the company''s technical support
    line if you can''t get it installed.


    If you know all the issues involved in working with PC video hardware, you''d
    think it is fantastic that XFree86 developers can get it working at all (for more
    on XFree86, see the nearby beside). Even though XFree86 is freely distributable,
    you may want to make a donation to its development fund, which is listed at www.XFree86.org.


    If your X Server is working and you want it to stop, press Ctrl+Alt+Backspace.
    You can then log off the root account. If you want to start working again, X starts
    in a few moments (Note that you can use the xdb utility to create a graphical
    login screen that doesn''t exit by default to the command line).'
  merge: -1
