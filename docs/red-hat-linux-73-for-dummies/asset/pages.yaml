- img_proc: true
  md: '# 318 Part V: The Part of Tens


    Master Boot Record (MBR). This process overlays the linux boot loader and stops
    you from booting linux. The best correction requires advance of prevention: Make
    an emergency boot disk, as we instruct you to during installation. Keep this handy
    when you update your system or during any other system event, such as repartitioning
    drives or rebuilding your kernel. If you make a mistake, you can boot the floppy
    which enables you to reboot your linux system. When you''ve rebooted your system
    using the boot disk, log in as root and type lilo on the command line. This repairs
    the MBR by reinstalling LILO.


    ![](img/5275bfa3908ad63320aaea42eefe467c_341_0.png)


    If you install multiple operating systems on a new machine, do yourself a favor
    and install LILO last. Otherwise, you have to keep reinstalling LILO.


    # My Hard Drive Numbers Have Changed Since Installation


    Problem: Linux numbers hard drives each time it boots, calling scsi hard drives
    names like sda, sdb, and so on. Suppose that you hold your microsoft operating
    system, which holds the bulk of linamba. Your users files also hold your swap
    space. Now you add another hard drive and your user files are on side and your
    swap space is outside. The new hard drive is called sdc, but has nothing on it.
    What happened?


    Solution: SCSI hard drives are ordered according to the scsi ids set on each hard
    drive. Linux names the hard drives by using this ordering scheme. If you insert
    a new hard drive into the scsi with a scsid that is lower than an existing hard
    drive, you rename all hard drives with a scsid number above the one you installed.
    It''s best to start installing your scsi hard drives with a scsi id of 0, 1, 2,
    and so on, then put other scsi devices at the other end of the scsi bus (scsi
    ids 3, 4, and so on).


    Most scsi controllers are set to scsi id 7 by default


    ![](img/5275bfa3908ad63320aaea42eefe467c_341_1.png)


    ide drives are numbered according to the ide controller they''re on, and whether
    they are a master or a slave on that controller. For this reason, adding a new
    hard drive to a slave of ide controllers won''t change the existing names, as
    shown in the following two tables:


    | Controller | Hard Drive | Linux Name |

    |---|---|--|

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |'
