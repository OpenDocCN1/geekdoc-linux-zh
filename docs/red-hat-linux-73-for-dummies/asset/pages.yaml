  md: '# # Appendix E

    # About the CD-ROMs


    The CD-ROMs that come with this book contain the full GNU Public License distribution
    of Red Hat Linux 7.3.


    # ## System Requirements


    Make sure that your computer meets the minimum system requirements listed here.
    If your computer doesn''t match up to most of these requirements, you may have
    problems with the contents of the CDs:


    +   - A Pentium PC with a 200MH or faster processor recommended. Actually, you
    can run Linux on 386 and 486 computers but the graphics run slowly. (Older 386
    and 486 computers make for great Linux servers very often do not use graphical
    interfaces and the slower processors still handle functions like firewalls, personal
    Web servers, and such very well.)


    +   - At least 32MB of RAM installed on your computer. For the best performance,
    we recommend that people who want to use X Window System have at least 64MB and
    preferably 96MB of main memory.


    +   - At least 800MB of hard drive space available to install all the software
    from the CDs. You''ll need space if you don''t install every program, 2.5GB recommended
    for full installation.


    +   - A CD-ROM drive.


    +   - A 3½-inch floppy disk drive and a blank 3¼-inch disk.


    +   - A monitor capable of displaying at least 256 colors or grayscale.


    +   - An IDE or a SCSI hard drive.


    +   - A keyboard and a mouse.


    +   - A modem with a speed of at least 28,800 bps if you want to go online. (Older,
    slower modems will work but will unnecessarily make your hair gray from the frustration
    of waiting through Web page downloads.)'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Part VI: The Appendixes


    # Using the CDs


    You receive the Publisher''s Edition of Red Hat Linux on the companion CDs. The
    instructions for installing the Red Hat Linux operating system from the CDs are
    detailed in Part I. After you install the software, return the CDs to their plastic
    jacket, or other appropriate place, for safekeeping.


    # What You''ll Find


    The CD does not contain the freely distributable parts (or source code) of Red
    Hat Linux, but you can visit


    ```

    ftp.redhat.com

    ```


    All the packages included in this release of Red Hat Linux are available for download
    here.


    You can obtain the Red Hat Linux installation manual from Red Hat''s Web site
    at


    ```

    www.redhat.com.

    ```


    We recommend that you take a look at the official Red Hat Linux installation guide,
    available from the Red Hat Web site at


    ```

    www.redhat.com/docs/manuals/linux

    ```


    Because the CD-ROMs have a full implementation of Linux, to list all the accompanying
    tools and utilities would take too much room. Briefly, the CDs includes most of
    the software you need to access the Internet; write programs in several computer
    languages: create and manipulate images; create, manipulate, and play back sounds
    (if you have a sound board); play certain games; and work with electrical design.


    ![](img/5275bfa3908ad63320aaea42eefe467c_407_0.png)


    For information about Red Hat Linux agreements and installation, see the pages
    at the end of this book, following the index.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# If You Have Problems (Of the CD Kind)


    We tried our best to test various computers with the minimum system requirements.
    Alas, your computer may differ, and Linux may not install or work as stated.


    The two likeliest problems are that you don''t have enough RAM for the programs
    you want to use, or you have some hardware that Linux doesn''t support. Luckily,
    the latter problem occurs less frequently each day as more hardware is supported
    under Linux.


    You may also have SCSI hard drives that use a controller not supported by Linux
    or a controller that is simply too new for the Linux development team to have
    given it the proper support at the time these CDs were pressed.


    If you have trouble with corrupt files on the CDs, please call the Hungry Minds
    Customer Care phone number. 800-762-2974 (outside the United States: 317-572-3393).
    Customer service won''t be able to help with complications relating to the program
    or how it works. Please see the Installation Instructions in Part I.'
  merge: -1
