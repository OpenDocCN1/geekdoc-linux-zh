  md: '# 106 Part II: Got Net?


    from one machine to another) through the Internet and — anyone can use them. Private
    IP addresses would wreck havoc on the Internet if they were routed.


    7. Type 255.255.255.0 or the netmask for your IP address in the Subnet Mask text
    box.


    The Internet Protocol (IP) defines only three network address classes: A, B, and
    C. Only C addresses are assigned by the InternIC. We use 255.255.255.0 netmask
    for C networks, 255.255.255.0 for class B, and 255.0.0.0 for class A. Class C
    netmasks are used almost universally, and we only use class C addresses. If you''re
    not using a class C address, you''re probably experienced in the ways of TCP/IP
    and know what mask to use. Otherwise, don''t fool with Mother Nature, buddy: use
    a class C address.


    8. In the Default Gateway Address text box, type the IP address of the Internet
    gateway for your LAN.


    The Internet gateway is the device (router or computer) that connects your network
