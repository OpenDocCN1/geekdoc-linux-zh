  md: '# 326 Part V: The Part of Tens


    areas that you should be aware of. This chapter introduces ten important security
    topics. You can use them as a starting point to increase your computer security.


    # How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every commercial operating system vendor wants to make their operating systems
    easy to install and use. Operating systems are inherently complex animals and
    Linux is no exception. (Of course, we''re not biased when we say that Linux is
    an overall simpler system than Windows we measure simplicity by the number of
    lines of code or the transparency of its design.) Vendors walk the tightrope of
    making the systems easy to use so that they are used while making them reasonably
    secure.


    Ease of use security often do not coexist well. Your operating system will be
    much easier to use, if you install and activate every software package and option.
    On the other hand, running every software package means that you have more vulnerabilities.
    If you install 10 doors and 20 windows in your home, you can certainly enter and
    leave as you please but it also provides burglars with more opportunities to do
    you harm. The same thing with your operating system. The more software you install,
    the more chances someone has getting inside your computer.


    We can''t think of a cure-all for this dilemma. The best answer from a security
    viewpoint is to not provide intruders with any openings: place your computer in
    a locked room with no network or external connections and turn it off. You will
    have a really safe system that holds the floor from hitting the ceiling.


    With most things in life the real answer is to use your best judgment and balance
    security with ease of use. Run only the services you need. For instance, don''t
    run the Samba file service if you don''t want to use your Red Hat computer as
    a file server. Run the text-based gpm service if you use the graphical X Window
    mode on your computer. The list is endless and beyond the scope of this book to
    discuss in detail. You can find more info with the following sources:


    +   - Web sites: www.sans.org and www.usenix.org both deal with security issues.


    +   - HOWTOs: www.redhat.com/docs/manuals/linux/RHL-7.2-Manual/custom-guide/ch-gnomelokkit.html
    and www.redhat.com/manuals/linux/RHL-7.2-Manual/custom-guide/openssh.html do which
    are written for Red Hat 7.2 but still provide valid advice.


    +   - Books covering security: Browse through your local bookstore to find Linux
    books that discuss reducing services. Some good books are: Red Hat Security and
    Optimization and Security Toolkit.'
