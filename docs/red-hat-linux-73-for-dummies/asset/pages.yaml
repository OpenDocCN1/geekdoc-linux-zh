  md: '# # Dedication


    Jon "maddog" Hall: To Mom & Pop (TM), whose aversion to things electronic is well
    known, and who can still call their son Jon rather than maddog.


    Paul G. Sery: To my wife Lidia Maura Vazquez de Sery.


    # # Acknowledgments


    I want to thank my wife, Lidia, for her patience, support, and good advice that
    made this book possible. Without her, I would still be the pocket protector inserted
    into shirt, busted-eyeglass-fixed-with-tape wearing. Star Trek watching, wrinkled
    shirt suffering, spaghetti-in-the-pot-over-the-sink eating. Saturday night having
    sorry sorry sorta gout. I never was into Star Trek and am pecking at this keyboard
    on Saturday night, but my wonderful and beautiful wife has made me a better man.


    I would also like to thank Laura Levin, who gave me the chance to write this book.
    She showed great confidence and patience in me. I am very grateful and wish her
    success in her new ventures.


    And, of course, I''d like to thank the staff at Hungry Minds, who provided considerable
    and essential help. Tiffany Franklin and Nicole Haims provided constant and essential
    assistance. Their patience with me was truly vital.


    I''d also like to acknowledge a total lack of assistance in writing this book
    from my dog, the infamous Oso Maloso, eater of many things that should have ended
    his long career early, but not limited to: poison, Advil, many pounds of tootsie
    rolls Halloween, several bags of chicken bones one party, beer, and other assorted
    items; escaper of many fences and gates; and friend of the late, great Paunchy
    (whose name you''ll see throughout this book).


    How useful was Oso? Well, one night working on this book I got a phone call. Leaving
    my apple pie behind next to the keyboard, I went downstairs to take the call and
    passed him on on his way up. I should have known something was up because he had
    a cell phone with him and no one answered when I picked up up to take the call.
    I went up the stairs while he went down. The apple pie was gone. Oso 1, human
    0.


    — Paul G. Sery'
