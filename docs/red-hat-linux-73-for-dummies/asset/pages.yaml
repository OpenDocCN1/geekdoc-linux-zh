  md: '# Chapter 10: Gnowing GNOME


    # Separation anxiety? Not Linux


    Unlike in the Microsoft world, Linux is not defined by its graphical interface.
    Microsoft Windows includes both the operating system — the software that makes
    a usable computer — and its familiar graphical interface. The two are closely
    intertwined and essentially inseparable. Linux and X, however, are completely
    separate animals.


    Without the burden of having to incorporate graphics into itself, the Linux operating
    system can remain a lean, mean fighting machine. The X Window System concentrates
    on providing graphics and does not interfere with the operating system. Separating
    the two also makes for varied and interesting development efforts.


    So what? Well, for one, separating the two makes for a more reliable and robust
    workstation.


    The following sections discuss each of the three major types of programs in Red
    Hat Linux interact with X:


    +   Window managers, which control the appearance of windows, dialog boxes, menus,
    and other on-screen objects that enable you to click and type to make choices
    and run programs. GNOME and KDE are the window managers that Red Hat gives you
    to use.


    +   Terminal emulators are programs that allow you to type in commands and see
    the results. Terminal emulators are often used to connect to other computers using
    communication programs like Open Secure Shell.


    +   General applications, such as xclock and Mozilla, provide the functionality
    that help you see the time and browse the Web.


    # Comprehending window managers


    Window managers, like GNOME''s Sawfish window manager, are programs that receive
    commands indirectly from the user through mouse clicks and keystrokes. The window
    manager passes those commands to a set of graphics libraries, which then communicate
    with the X server to manipulate windows (usually your monitor screen). This happens
    seamlessly, behind the scenes. All you see are the windows and other objects on-screen.


    Sawfish acts like a playground monitor; it''s the central point of control for
    the major windows you see on the screen (and even some windows that you can''t
    see). It blows a whistle when a window gets unruly. The window manager can also
    serve as a desktop, where you can use it to launch applications.'
  merge: -1
