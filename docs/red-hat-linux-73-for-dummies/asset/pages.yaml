- img_proc: true
  md: '# 350 Part VI: The Appendixes


    | Table B-1 | Installation Keyboard Shortcuts |

    | Key | What It Does |

    | Tab | Moves the cursor to the next section in the screen |

    | Alt+Tab | Moves the cursor to the previous section in the screen |

    | Left arrow | Moves the cursor backward through a list of options |

    | Right arrow | Moves the cursor forward through a list of options |

    | Up arrow | Moves the cursor up through a list of options |

    | Down arrow | Moves the cursor down through a list of options |

    | Spacebar | Selects an item from a list of options |

    | Enter | Selects the highlighted item |

    | F12 | Accepts the values you choose and displays the next |


    2. Type in at the boot prompt and press Enter (the graphical installation process
    will begin after 60 seconds if you don''t enter anything).


    The Linux kernel loads and shows you a couple of pages of hardware and system
    information, indicating whether your hardware is being detected by the Linux kernel.
    From here on you can use the keyboard shortcuts described in Table B-1 to maneuver
    through the dialog boxes.


    If the hardware isn''t being detected, you can get more installation information
    from Red Hat''s online installation manual — in HTML format — located on the CDs
    in the /mnt/cdrom/doc/rmmanual/manual/manual directory. You can mount the CDs
    on another Linux or Windows system and view the document with Nextscape. Most
    of the time, thankfully, and particularly with newer systems, all your computer''s
    basic hardware.


    If you want to stop the installation process, simply eject the boot disk, remove
    the CD from the drive, and reboot or shut down your machine.


    3. The Red Hat Linux informational screen appears. Select OK.


    4. In the Language Selection dialog box, select the language that you speak and
    select OK.


    You can choose from several languages, but by all means, pick that one you — hopefully
    — understand.


    5. In the Keyboard Selection dialog box, select the keyboard that you want to
    use and select OK.


