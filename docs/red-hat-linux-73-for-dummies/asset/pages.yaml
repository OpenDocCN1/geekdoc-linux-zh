    # Linux is everywhere


    The Linux operating system has been ported (or converted) from the 32-bit Intel
    architecture to number of other architectures, including Alpha, MIPS, PowerPC,
    and SPC. This version uses a choice of hardware manufacturers and keeps the Linux
    kernel for new processors. Linux now handles multiprocessing (more than one CPU
    or mathematical and logical programming unit per system box). In addition, projects
    are in the works to provide sophisticated processing capabilities, as as:


    +   Journaled file systems: Linux uses named file systems that can "heal" more
