    > You''re probably familiar with the ubiquitous dial-up Internet connection: You
    log on the Internet, hear that fax-like connection sound, a little static, and
    then presto-whammy — you are online. If you''re lucky, the entire dial-up process
    takes about five minutes, but it can take longer; and then there''s the fact that
    Web pages take just a little to build on screen with a dial-up modem — especially
    when you compare dial-ups with high-speed connections (also called broadband connections).


    ![](img/5275bfa3908ad63320aaea42eefe467c_100_0.png)


    The broad in broadband means wires and cables that connect a modem to the Internet
    have a wide bandwidth; they can handle more data at faster speeds and with greater
    reliability. Plain old telephone service (POTS) was created for transferring analog
    voice data. Needless to say, POTS just don''t do as well as broadband media when
    it comes to the Internet.


    The most popular broadband connections allow you to access the Internet are cable
    modems (which use your existing cable television lines to transfer data) and DSL
    (which use new, fancy-shammy digital phone lines). Broadband connections work
    from roughly 500 thousand bits per second (Kbps) to several million (Mbps). That
    is enough to transfer graphic rich Web pages in a few seconds; it is also enough
    to listen to several audio streams or a low-resolution video stream.'
