    audio — and — air.


    # Getting RealPlayer through your firewall


    If your Red Hat Linux workstation sits on a network with a filtering firewall
    (see Chapters 5 and 6), then you don''t need to modify RealPlayer. A firewall
    is used to prevent unauthorized access from outside — in most cases the Internet
    — your computer and or network. The key is that the filtering firewall allows
    all outgoing TCP/UDP connections (ports), such as either of the ones we show'
