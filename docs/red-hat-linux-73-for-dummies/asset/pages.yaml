- img_proc: true
  md: 'The bash shell creates an environment for commands to operate in. When a new
    command is executed, bash creates a clean copy of the environment, executes the
    command in it, and then throws away that environment, returning to the environment
    it started with.


    ```

    cd /usr/lib

    ls -1 * | more

    ```


    In this case:


    +   1. The bash creates a new environment for the ls command to be executed in
    and determines what should be the input (called standard input in technical jargon)
    and the output (called standard output in nerd-speak). You can call this new environment
    child number 1; the old environment is its parent.


    +   2. Next, bash creates another new environment for the more command to be executed
    in, child number 2, and determines what should be input and output to the more
    command. Because the pipe | symbol is used between the ls -1 * command and the
    more command, the output of the ls -1 * command is sent to the input of the more
    command. The output of the parent bash shell is the one into which you have been
    typing commands and information, and the output of that original shell is the
    screen.


    +   3. And then bash expands * to match all the filenames in that particular directory,
    as default.


    +   4. Next, in the child 1 environment, bash searches the PATH environmental
    variable looking for a command called ls. The same process occurs for the more
    command in child number 2.


    +   6. The more command sees the output of ls -1 * as its input, and puts its
    output to the screen.


    The output of a command or application is sent to standard output (stdout); input
    comes from standard input (stdin). Linux (and UNIX too) uses the concept of stdout
    and stdin to — what — standardize the location that input and output taken from
    and sent to. The terminal emulator is stdout by default; your keyboard is stdin
    by default.


    +   7. After ls runs, bash returns to the parent environment, throwing away the
    side effects that occurred in the child number 1 environment.


