  md: '# Part IV: Revenge of the Nerds


    # # Tweaking Linux Commands with Options


    Most Linux commands are flexible and can be modified to perform special tasks.
    You can use two devices to alter a command: command options and standard input
    and standard output redirection. You find out about command options first.


    You can use command options to fine-tune the actions of a Linux command. We introduce
    the `ls` command earlier in this chapter so that you can see the results of actions
    taken on the file system. To see how its options work, in the next example, try
    out the `ls` command times, with different options.


    ![](img/5275bfa3908ad63320aaea42eefe467c_251_0.png)


    Use the `mkdir` command to make a new directory called vacation and then use the
    `cd` command to change your working directory to that directory:


    ```

    ```bash

    [lidia@veracruz emptydirectory]$ mkdir vacation

    [lidia@veracruz emptydirectory]$ cd vacation

    ```

    ```


    At the Linux prompt, type `ls` as follows:


    ```

    ```bash

    [lidia@veracruz vacation]$ ls

    [lidia@veracruz vacation]$

    ```

    ```


    That didn''t do much, did it? It seems as if the account has no files. You may
    need an option. Try the `-a` option and see what happens:


    ```

    ```bash

    [lidia@veracruz vacation]$ ls -a

    [lidia@veracruz vacation]$

    ```

    ```


    ![](img/5275bfa3908ad63320aaea42eefe467c_251_1.png)


    Remember to type the commands and options exactly as shown. For example, the `ls
    -a` command has a space between the command and the option, and no space between
    the hyphen and the letter a.


    Notice the two files (they''re actually directories, but in all directories are
    just files) that the `ls` command displayed. What? All you see are dots. Well,
    the single dot represents the parent directory you are in; the double dot is typically
    the one above the directory you''re in. (Linux creates these filenames and puts
    them into the directory for you. If you just installed your directory, all you
    have files that begin with a period.)'
