  md: '# Letting bash''s Memory Make Your Life Easier


    The bash shell has a good memory. By default, it remembers your last 500 commands.
    That function is very useful because it allows you to recycle your work. Several
    ways exist for recalling your past work, and this section describes how to do
    so.


    # Editing commands at the command line


    One of the most useful bash features is command-line editing, which is the capability
    to change parts of a command line without having to retype the entire command.
    Suppose you type the following line and pressed Enter:


    ```

    [lidia@veracruz lidia]$ ls -1 * | more

    ```


    but you actually meant to use the less command, not the more command.


    Groan. You can press Ctrl+C to halt the command. But if you want to reexecute
    the command, changing more to less, without having to type the entire command,
    just type the following:


    ```

    [lidia@veracruz lidia]$ ^^less

    ```


    This line resubmits the command to bash with more changed to less,

    as follows:


    ```

    ls -1 | less

    ```


    Output appears. if you have to stop the less command, type q.


    The shell redisplays the first command with the change, and then the command is
    reexecuted. How does the shell know about the first command? History. bash remembers
    all the commands that you have typed (to a certain extent) and allows you to edit
    and resubmit them. Awesome.


    We say "to a certain extent" because bash remembers only a number of commands,
    depending on a parameter in the environment. After bash holds many previous commands,
    it throws away the oldest ones as you type in newer ones. Normally, this parameter
    is large (perhaps 1,000 commands), so bash essentially remembers every command
    that you enter. (We can''t imagine ever wanting to be able to recall more than
    the last thousand commands that we entered.)


    ![](img/5275bfa3908ad63320aaea42eefe467c_253_0.png)'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Bang-bang!


    The fact that the shell remembers the command lines you type is useful for reexecuting
    commands at a later time. Simple reexecution commands are represented by exclamation
    points. In computerese, an exclamation point is called bang, and two exclamation
    points are called — you guessed it — bang-bang.


    Here are two key ways to use the exclamation point:


    +   - !! reexecutes the last command.

    - !<partial command line> reexecutes the command line that started with <partial
    command line>.


    Here''s an example. Type cat on the command line as follows (cat is the <partial
    command line> mentioned in the preceding list):


    ```

    $ lidia@veracruz lidia$ !cat

    ```


    The bash shell searches through the previously executed commands in this session,
    looking for the first occurrence of a command line that starts with the letters
    cat. After the program locates the command, it is reexecuted.


    Are you a little timid about doing this? Perhaps your memory of what you typed
    and when is a little faulty. Add :p to the command line to see what history finds.
    The command looks like this:


    ```

    $ lidia@veracruz lidia$ !cat:p

    /etc/passwd

    ```


    To run the command that !:p found, enter bang-bang, like this:


    ```

    $ lidia@veracruz lidia$ !!

    ```


    Don''t use this type of command recall when logged in as root. It''s too easy
    to mistakenly reexecute a command that causes unintentional problems.


    While using history to find and reexecute command lines, you can also make additions
    to the command line. Starting from the beginning with our example, if you type
    the following


    ```

    $ lidia@veracruz lidia$ cat /etc/passwd

    ```


    the file /etc/passwd is output to standard output, which in this case is the screen.


    ![](img/5275bfa3908ad63320aaea42eefe467c_254_0.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 232 Part IV: Revenge of the Nerds


    When you reexecute the preceding command by typing ||, you can also send the output
    to the sort command by using the pipe symbol:


    ```

    [lidiaveracruz lidia$ !! | sort

    cat /etc/passwd | sort

    [lidiaveracruz lidia$]

    ```


    Linux pulls the /etc/passwd file from the disk and passes it to standard output,
    feeds it into the standard input of sort, and then outputs it to the screen in
    sorted fashion.


    The bash shell also makes use of the up-arrow and down-arrow keys to reuse commands.
    The up-arrow key sequentially returns commands starting from the most recent.
    The down-arrow key, not surprisingly, goes forward in time. This is bash''s most
    convenient feature.


    This history command displays all the commands that you have used up to the Red
    Hat default of 1,000. You can use the history command to perform a sort of archaeological
    dig. For instance, if you want to see all the commands of a certain type that
    you have used, then you can pipe the output of the history command to the grep
    filter. To find all the times you have entered the ls command, you can use the
    command history | grep ls.


    Shells (such as csh, bash, tcsh, and zsh) have this type of simple editing, but
    bash also has more elaborate editing.


    ![](img/5275bfa3908ad63320aaea42eefe467c_255_0.png)


    # Going back to the future


    Linux offers a handy tool for rerunning commands that you''ve already entered.
    Press Ctrl-P, and the display scrolls through the commands that you''ve entered,
    one command at a time in reverse order, showing the most recent command first.
    When the command you want appears on the screen, press Enter to run it.


    ![](img/5275bfa3908ad63320aaea42eefe467c_255_1.png)


    # Recalling filenames


    Suppose your mind has been wandering, and although you do remember that a file
    in /etc contains passwords, you can''t remember whether the file is in /etc/passwd,
    /etc/password, or whatever. You may want the command interpreter to choose the
    proper spelling of the filename for | rather than type what you think it may be.'
