  md: '# 126 Part II: Got Net?


    To test your firewall, follow these steps:


    +   1. Throw some gasoline on your computer and light a . . . no, no, just kidding.
    Don''t do that, especially if you plan to sue.

    2. Try to Telnet to your ISP or university account; any computer that''s external
    to your own computer will do.

    Telnet is a network program that allows you to connect to a remote computer and
    interactively enter commands.

    3. If you don''t know it already, find out what your temporary (dynamic) IP address
    is by entering the following command at the command prompt:

    who | grep login

    where login is your, well, login name. This command shows an IP address in numeric
    form, similar to the following:

    amme (192.168.32.254) ...

    4. Run a port scan against your Red Hat Linux computer by typing in the actual
    address that you received in Step 3 in place of IP_address in the following command:

    nmap IP_address

    For instance, if your IP address is 1192.168.32.254, then run the nmap as follows:

    nmap -P0 192.168.32.254

    nPlease note that the preceding IP address has been changed to protect the innocent.
    The address is what is known as a public address and will (should) never exist
    on the internet anyway.


    Congratulations, you''ve successfully set up your firewall. Your job as a security
    professional, having only just begun. In reality, there''s no silver bullet where
    security is concerned. Education is your one true defense. For more information
    on firewalls and security, search the Internet for security-related topics. The
    SANS (www.sans.org), USENIX (www.usenix.org), Red Hat (www.redhat.com), and CERT
    (www.cert.org) Web sites are all good places to start. You should also consult
    Chapter 23 for the top 10 Linux security vulnerabilities.'
