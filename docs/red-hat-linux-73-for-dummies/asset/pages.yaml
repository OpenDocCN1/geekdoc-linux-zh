  md: '# 64 Part II: Got Net?


    # Desperately Seeking an ISP


    To get connected using a dial-up modem, you have to successfully hook up a modem
    to your computer and then find a good Internet service provider (ISP) to dial
    in. Odds are that you have an internal modem that came installed with your computer.
    If you don''t, you may want to consider upgrading. Check out Upgrading & Fixing
    PCs For Dummies, 5th Edition, by Andy Rathbone (Hungry Minds, Inc.).


    ![](img/5275bfa3908ad63320aaea42eefe467c_87_0.png)


    The best way to find a good ISP is by word of mouth. Ask your friends and acquaintances
    you live nearby (if they live far away, their opinions won''t mean much) which
    ISPs they use and whether they are satisfied with those ISPs. Getting personal
    recommendations is a good way to find out both the good and bad points of an ISP
    that you can''t find from reading advertisements.


    If you don''t have friends and your acquaintances won''t speak to you, then try
    finding a local Linux User Group (LUG) to ask. You can look up LUGS at Red Hat''s
    community page at www.redhat.com/apps/community.


    Before you sign on with an ISP, make sure that the company supports Linux. Table
    5-1 shows a sample of national/worldwide ISPs that support Linux.


    | ISP | Toll-free Phone Number (U.S. Only) | Web Address |

    | :--- | :--- | :--- |

    | A&T WorldNet | 800-967-5363 | www.att.net |

    | CompuServe | 800-336-6823 | www.compuserve.com |

    | Earthlink | 800-EARTHLINK | www.earthlink.net |

    | Prism Access | 888-930-1030 | www.prism.net |

    | SprintLink | 800-473-7983 | www.sprint.net |

    | CompuglobalHypermega | 555-867-5309 | www.compuglobalhypermega.net |


    Be sure to ask your potential new ISP if it offers a dial-up PPP — even if the
    company handles Linux. PPP (which stands for point-to-point protocol) is what
    Linux uses to connect to the Internet. If the person you talk to gives you the
    verbal equivalent of a blank stare, you may have troubles. If there appears to
    be some kind of a hitch, be warned. The ISP''s staff probably isn''t going to
    be able to walk you through procedures. You''re on your own.'
