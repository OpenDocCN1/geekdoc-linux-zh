    # Understanding your Linux file systems permissions


    Sections in this chapter explain how to mount and unmount a file system from a
    floppy. But those-structions assume that you''re mounting a vanilla—your average
    PC—system. You can specify other options. Here''s a short description of each
    option:


    - Read-only: The file system is mounted as read-only. You can''t write to the
    file system.

    - User mountable: When set, any user in addition to root can mount the partition.
    This is useful when regular users must be able to mount devices with CDs and floppy
    disks.

    - Mountable by device owner: A regular user who owns the device (for instance,
    /dev/fd0) can mount the file system.

    - Not mount at boot: Red Linux does not automatically mount the file system when
    it boots.

    - No program allowed to execute: A regular user is not allowed to execute files
    found on a file system. You may want to allow a regular user to mount a device
    (like a CD), but not execute programs on the device for security reasons.

    - No special device file support: The device files in the /dev directory are created
    with very specific permissions in order to enhance system security. This option
    prevents others, nonsecure device files from being used to mount a file system.

    - No setuid programs allowed: This is a very important security feature. When
    an executable Linux file has its setuid bit set, it can be run by a regular user
    who belongs to the same group. If root owns the file, then whatever file does
    with the power of root. Files with setuid permissions often prevent big security
    holes. Setting this option prevents any files found on the file system from exercising
    setuid privileges.

    - User quota enabled: This enables Linux quotas to be exercised. Quotas allow
    limits being set on what resources users can access.

    - Group quota enabled: This enables quotas to be set for groups.


    You can run fsck manually — as opposed to having the boot process run automatically.
    In some cases, you must run it manually because it needs to prompt you during
    the process.


    Unfortunately, fsck doesn''t always do the trick. For example


    +   - fsck can''t find (let alone repair) corrupted data that''s located in a
    structurally intact file.


    +   - With the exception of the root file system, fsck runs on only unmounted
    file systems.


    +   - You must make sure that the system is in single-user mode to use fsck on
    the root file system.'
