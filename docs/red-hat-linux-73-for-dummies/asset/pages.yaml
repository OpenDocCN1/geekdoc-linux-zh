    This friendly guide shows you step-by-step to install Red Hat Linux on your personal
    computer — and declare independence from Windows. From setting up a Internet connection
    to getting your firewall setup and using Red Hat applications, this book delivers
    just what you need to put Red Hat Linux to work.


    Jon "maddog" Hall is Executive Director of Red Hat International. Paul G. Sery
    works with Sandia National Laboratories and is the author of several books on
