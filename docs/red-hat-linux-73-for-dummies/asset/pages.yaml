    different from MS-DOS, Windows, and Macintosh operating systems. In Linux, everything
    is stored as files in predictable locations in the directory structure — Linux
    stores commands as files. Like other operating systems, Linux has a tree-structured,
    hierarchical, directory organization called a file system.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the root directory (not to be confused with the root user),
    which is designated with a slash, /. A file system''s contents are made available
