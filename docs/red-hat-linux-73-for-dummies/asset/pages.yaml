  md: '# Part II: Got Net?


    4. Set up the DSL modem user and administrative passwords.


    DSL modems provide a reasonable level of security. You should take advantage of
    their security by assigning your own passwords to the modem. This will prevent
    hackers from breaking into your modem and causing you problems.


    5. Set up the ISP/DSL connection account name and password.


    You must authenticate your DSL modem to communicate with your ISP. DSL connections
    logged on to your ISP just like traditional analog modems do. You configure your
    DSL modem with your ISP username and password.


    6. Configure the DSL modem''s internal (private) network interface.


    Your DSL modem must be able to communicate with your Linux computer over an Ethernet
    connection. You must configure the DSL modem so that it uses the same network
    parameters as your computer.


    7. Configure the modem''s network address translation (NAT) settings.


    ![](img/5275bfa3908ad63320aaea42eefe467c_111_0.png)


    The Internet was designed to send — route — as quickly as possible to its destination.
    Internet Protocol (IP) addresses are used to designate where the information is
    coming from and where it''s going. IP addresses can be routable or non-routable.
    Non-routable addresses can be reused — you can use the same non-routable addresses
    as your neighbor without either of you interfering with each other.


    NAT is used to convert non-routable IP addresses into routable ones. This is very
    useful when connecting your private network to the Internet by translating your
    internal IP addresses into one of your ISP''s routable addresses. You need to
    configure your DSL modem to convert your computer''s private — for instance 192.168.1.1
    — and non-routable address to an address assigned to your DSL connection by your
    ISP.


    8. Save the settings to non-volatile memory and reboot.


    You need to save your DSL modem''s settings after you''ve got them working. You
    don''t want to enter the configuration every time you run the modem.


    # Finding a DSL provider


    You must obtain both DSL and ISP services to make your broadband connection. Some,
