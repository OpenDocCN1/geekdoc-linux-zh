  md: '# 288 Part: Revenge of the Nerds


    # Or maybe you have a hardware problem


    If you don''t see your Ethernet adapter, then you may have a hardware problem.
    Check your adapter. Reseat it (take it out and put it back in) and see if it works.
    If not, then you probably need a new NIC. If you see the NIC, then look inside
    the Linux kernel and see which devices it has. Type the following command to change
    to a special directory called /proc where process information is located:


    ```

    cat /proc/devices

    ```


    You should see a line with your network adapter listed. If you don''t, then Linux
    doesn''t know that exists. If the NIC is Plug and Play (PnP) compatible, then
    that is the problem. Linux frequently has problems working with PnP NICs. It''s
    best to turn PnP off. Run the following program to if you have a PnP NIC:


    ```

    pnpprobe

    ```


    If you see that your Ethernet NIC is PnP, then you can use the isapnp program
    to reconfigure it. isapnp is a difficult program to use — it''s best to use the
    configuration program that comes with the NIC. In this case the 3c59cfg.exe, which
    runs under DOS, is used for configuring the 3Com 3c59 NIC. Use your NIC''s configuration
    program and turn off PnP.


    ![](img/5275bfa3908ad63320aaea42eefe467c_311_0.png)


    Try to run your Ethernet NIC again. If it still doesn''t run, then you need to
    find out more information.


    # Maybe you have an interrupt or address conflict


    You may have an interrupt or address conflict. Look at the list of interrupts
    and then the I/O addresses of all the devices that the kernel knows about by typing
    the following commands:


    ```

    cat /proc/interrupts

    cat /proc/ioports

    ```


    The I/O address is the actual location in memory where the device — such as the
    network adapter — is accessed by the microprocessor (for instance, your Pentium
    chip). The interrupt is a way that the microprocessor is informed that it should
    stop whatever it''s doing in order to process information that has arrived at
    the device that is sending the interrupt.


    When your Ethernet adapter receives a packet, it will send an interrupt to the
    microprocessor to say an event has occurred. Your Pentium what stops what it''s
    doing and processes the new information. Actually, the microprocessor interacts
    with Linux to do the processing.'
