  md: '# In this part ...


    Ah, the part you find in every For Dummies book:

    The Part of Tens. Here''s where we get to rummage around and come up with ten
    of this and ten of that.


    In Chapter 21, we list ten important places to find help. You can use some of
    these sources also to enhance and widen your knowledge of Linux. There''s no end
    to the things you can find out about Linux.


    The ten most frequently encountered problems after people have installed Red Hat
    Linux are described in Chapter 22. If you have trouble that''s not described in
    Chapter 19 — the network troubleshooting chapter — turn here first.


    Unfortunately, the world is still a dangerous place.

    Chapter 23 outlines the top ten safer computer security threats.

    We describe how to be a little safer in the wild west otherwise known as the internet.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Chapter 21


    # Ten Sources of Help


    In This Chapter


    +   - Read, read, read

    - Check out the Linux HOWTOs

    - Go back to Linux school

    - Become a Linux newshound

    - Become a Linux groupie

    - Pay for Linux support

    - Go the commercial route

    -Visit Linux-oriented Web sites

    - Attend Linux vacations, er, conferences

    - Try to help others


    By now, you''re probably wondering whether any end exists to the amount of information
    and knowledge needed to run a Red Hat Linux system. The answer is yes; there is
    an end to the knowledge that you need to run a system well. But there''s no end
    to the learning process if you want to understand how things work and interact.
    In this chapter, we suggest several ways to get additional training and support.


    # Books and More Books


    When we started working with computers many years ago, the number of computer
    books about computers could fill one bookshelf, and they were mostly about the
    electronics of the hardware itself. Networking texts described the probability
    of two Ethernet packets colliding. We hardly ever saw books on computers in the
    popular press bookstores. Today, thousands of books on computers are available;
    most describe the software and its interactions, with the hardware taking a back
    seat. Books like the For Dummies series aren''t just for bookstores anymore. You
    can find them in mass-market venues like Wal-Mart, for instance.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 310 Part V: The Part of the Tens


    Perhaps you looked at other books before you bought this one and were intimidated
    by their use of technical terms, or you thought them too general for what you
    wanted to do, and you wanted something more task-oriented. You may want to look
    over those books again because your knowledge level will be higher reading this
    book. TCP/IP networking, compiler design, operating system theory, formal language
    design, computer graphics, and systems administration training are all topics
    that you can study in greater depth when you''ve got a Linux computer at your
    disposal.


    Lots of books specifically about the Unix operating system are partially or completely
    applicable to Linux, such as books on Perl, a comprehensive interpreter. By getting
    one (or more) books on Perl and sitting down with your Linux system, you have
    both a new tool for doing your work and a new appreciation for a complete programming
    language. If you want to find out how to write Perl, you can just view the source
    code.


    # Linux HOWTOs


    Don''t forget about the Linux HOWTOs, which come on the commercial version of
    Red Hat Linux. You can obtain the disc at www.redhat.com. These excellent guides
    to Linux are covered under the Linux Documentation Project — LDP — copyleft, which
    means you can print them.


    # School Days


    Another way to find out more information about Unix and Linux is to take a course,
    perhaps at a local community college. Many colleges offer courses on Unix, and
    some have started using Linux to teach the Unix courses. You can do your homework
    on your system at home, or if you have a notebook (laptop computer), you can work
    anywhere. (Joned text for the first edition of this book in a hotel in Auckland,
    New Zealand, and updated text for the second edition in the United Airlines line
    in Chicago.) What we would have given during college for the chance to do computer
    projects sitting in the comfort of our pub . . . er dom rooms. Instead, we had
    to sit in a room with a bunch of punch-card machines . . . well, never mind. We
    would have been much more comfortable and productive with a Linux system.


    # In the News


    You can obtain additional information about the Linux operating system from the
    Internet. A facility called Netnews has tens of thousands of newsgroups, and'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 21: Ten Sources of Help 311


    each newsgroup covers a special topic. More than 30 newsgroups are devoted to
    Linux topics. You can search for newsgroups at www.dejanews.com and www.mailgate.org.


    An ISP (Internet service provider) usually provides access to Netnews. You can
    use a text reader (such as tr, tin, or pine) or one of several Web browsers (such
    as the Mozilla browser included in the CDs that come with this book) to read Netnews.


    # User Groups


    User groups are springing up all over the country. Some are more active than others,
    but most hold meetings at least once a month. Some groups are Linux only; others
    are connected to a larger computer group either Unix or a more general computer
    users association. User groups are a great opportunity to ask questions. User
    groups also tend to stimulate new ideas and ways of doing things.


    You can find out if Linux user group is in your area by checking with GLUE (Groups
    of Linux Users Everywhere), which is a service run by SSC (the publishers of the
    Linux Journal). GLUE is an automated map of user groups, and you can find it at
    the following address:


    ```

    WWW.SSC.COM

    ```


    When you arrive at the site, click the Resources link, which takes you to the
    Linux Journal site. Check out the Resources area to find out where the user group
    closest to you meets.


    No group in your area? Post a message at your local university or community college
    saying that you want to start one; people in your area may decide to join you.
    Terrified of the thought of trying to start a user group? User group leaders are
    not the most technically knowledgeable members but are simply good planners. They
    organize the meeting space, find (hound) speakers, send out meeting notices, locate
    sponsors, arrange refreshments (beer), and perform other organizational tasks.
    Sometimes being the leader seems like a thankless job, but when a meeting goes
    really well it makes all the work worthwhile. So, as a newbie to Linux, you may
    not know a grep from an awk, but you still make a very good chairperson.


    # Bring in the Cavalry


    Some people want to be able to hire people to manage or fix their systems. This
    is what the commercial computer world calls support. Often, the place'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'where you bought your computer, — whether it''s a store, a value-added reseller
    (VAR), or the manufacturer — provides the support.


    Linux is criticized for not providing that same level of support. Although the
    number of hardware vendors that offers support is low, more and more people are
    well-versed in using Linux and are willing to offer some level of support, whether
    it be by e-mail, telephone, or on-site services.


    The first group of people who offer support is the distribution makers. Red Hat
    Software, Inc. sells contracts to their customers. These contracts range from
    e-mail support to telephone support. Red Hat, for example, recently introduced
    round-the-clock (24/7) support for a reasonable fee. Check out the Red Hat Web
    page (www.redhat.com) for more details.


    Another group of people who offer support is resellers of Linux systems. These
    people typically install Linux on hardware that you purchase from them. They will
    repair your system when it breaks, and help you with thorny problems (all for
    a fee).


    The final group of people who offer support is the independent consultants who
    have learned about Linux and are now in the business of offering support for the
    system. You can find a list of consultants in a document called the Consultants
    HOWTO, which is available at the following address:


    www.cyrius.com/tbm/usr/doc/HOWTO/Consultants-HOWTO


    Once you become familiar with the resources that Red Hat Linux offers, you''ll
    realize that it offers better support than most other proprietary systems. We
    find that consulting the HOWTOs or Usenet groups to solve problems and answer
    questions is easier than going through the traditional Help Desk route.


    # Commercial Applications


    Many Linux users are frugal (we prefer that term to *cheap*) and often want or
    use only freely distributable software. And in many cases, the freely distributable
    software is very good and does exactly what you want it to do. Other times, though,
    the software you want is available only as a commercial application.


    Some Red Hat users use the latest and greatest hardware and want the same commercial
    applications on Linux that they''ve got on their other operating systems, no matter
    what the price.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Chapter 21: Ten Sources of Help 313


    For commercial application vendors everywhere who may be reading this, we cannot
    stress stress enough that you should look at Linux just like any other operating
    system. You can sell your applications to a market that is not only appreciative
    but also believes, for various reasons, that its operating system should get along.


    An example of functionality in the commercial world is Appluxware Office by Appix.
    This office suite includes a word processor, a spreadsheet, a presentation package,
    a mail front end, an HTML authorizing program, a graphical program for drawing
    pictures (usually to include in your presentation or paper), an application building
    program, and a scripting language that allows you to tie and other programs together.


    We wrote this using AppLinux Words and Sun Systems StarOffice. We chose to use
    these word processors instead of Microsoft Word because we could easily cut examples
    of code from the screen of our Red Hat systems and paste them into the text of
    the book. We can also run the applications used as examples on the same machine.
    After finishing a chapter, we saved the chapter file in Rich Text Format (RTF)
    and emailed it to our editors. They used Microsoft Word and had no problem reading
    the material. Here, the two can get along.


    Likewise


    # Visit Web Sites


    A variety of Web sites are available for help. Some of these sites provide technical
    information; some provide news about the Linux community, and others furnish a
    bandstand for the Linux community to voice their opinions. Here are some sites
    that you may want to check out:


    +   - Linux International: www.li.org

    - Linux Org: www.linux.org

    - LinuxHQ: www.linuxhq.com

    - Linux Today: www.linuxtoday.com'
