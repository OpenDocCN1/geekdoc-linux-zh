  md: '# In this part...


    After you have created your own Red Hat Linux workstation, it''s time to hit the
    great outdoors. This part shows three different ways to connect to the Internet:
    via the traditional and slow modem; or through a fast broadband DSL or cable modem;
    you can also connect your Red Hat computer to an existing Local Area Network (LAN)
    that itself is connected to the Internet.


    Chapter 5 concentrates on telephone-based modems. Modems are very much like an
    old, reliable pick-up truck that may not be the fastest way of getting somewhere
    but will get you there. In fact, they provide the most simple, economical, and
    effective Internet connection available.


    Chapter 6 introduces broadband Internet connections. Telephone, cable, and independent
    companies provide broadband service to many communities today. For not altogether
    unreasonable prices you can get high-speed, always-service.


    Many people have access to existing computer local networks (LANs) at work, school,
    and home. Chapter 7 shows how to connect your computer to a LAN, and if your LAN
    has an Internet connection, you can find out how to configure your workstation
    to use it.


    After you''ve connected to the Net and set up your firewall, you''re ready to
    journey into the great uncharted territory of the World Wide Web. Chapter 9 shows
    how to surf the Net with Mozilla. Mozilla actually provides the core of Netscape.
    However, it''s fully Open Source and the preferred Red Hat browser.


    Okay, now that you''re out in the wilds of computerdom, how will you communicate?
    Smoke signals? Yodeling? E-mail? That''s the ticket, and you will find out how
    to send and receive e-mail in Chapter 9 as well.'
