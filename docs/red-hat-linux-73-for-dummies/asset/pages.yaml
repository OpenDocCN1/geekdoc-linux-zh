- img_proc: true
  md: '# 128 Part II: Got Net?


    In this chapter, we show you how to set up Mozilla for your Red Hat computer so
    that you can surf the Net and receive e-mail.


    Our goal in this chapter is to describe how to use its basic features, but Mozilla
    can do far more than we describe here. For more information about Mozilla, check
    out the features available under the Help menu, such as the Reference Library
    or Help contents.


    The Red Hat Linux 7.3 For Dummies companion CD-ROMs include Mozilla. Mozilla is
    the open source brother of Netscape and they are quite similar. They have slightly
    different look and feel but are more the same than not. If you''re familiar with
    Netscape, you''ll have no problem with Mozilla.


    ![](img/5275bfa3908ad63320aaea42eefe467c_151_0.png)


    # Setting Up Mozilla As You Like It


    If you''ve browsed the Internet (and who hasn''t, these days?), the first thing
    you want to do is to tailor Mozilla to your preferences. You can do this offline
    (without connecting to the Internet). Use the steps in the sections to customize
    Mozilla to your liking and set up Mozilla to be your e-mail client.


    # Picking a home page and history settings


    When you connect to the Internet, you have the option to see a page that you want
    to see instead of looking at page that someone wants you to see. And you may also
    want to tweak your history settings for whatever reason (but certainly not a paranoid
    one). These steps explain what you need to do:


    +   1. Start Mozilla by clicking the Dinosaur icon on the GNOME Panel.


    The Welcome to Red Hat Linux screen appears in Mozilla, as shown in 9-1. You can
    use this page to find out information about Red Hat and its products. We want
    to concentrate on configuring Mozilla and skip over all the Red Hat information;
    there''s a lot of good information, however, so explore their world at your leisure.


    +   2. Choose Edit: Preferences.


    The Preferences window appears, as shown in Figure 9-2.


    On the left side of the Preferences window is a list of categories, which you
    can think of as a map of where you are in the Preferences window.


    ![](img/5275bfa3908ad63320aaea42eefe467c_151_1.png)'
