  md: '# Part II: Got Net?


    # Technical stuff


    Modern cable modems do more than just transmit network packets of course. They
    transmit data packets by modulating and demodulating electrical signals over the
    cable TV wires—thus, the name MODEM (MOdulate/DEModulate). Today''s cable modems
    use the industry standard Data Over Cable Service Interface Specification


    (DOCSIS) protocol to deliver the electrical signals across the cable network.
    The electrical signal carries the actual bits and bytes that comprise the network
    packets. A good analogy is an AM/FM radio system. The DOCSIS-based electrical
    signals carry data packets just like radio waves transmit speech or music.


    +   5. Check that you''re connected to the Internet.


    When you''re satisfied, turn off your network connection by clicking on the Stop
    button.


    ![](img/5275bfa3908ad63320aaea42eefe467c_109_0.png)


    Go to Chapter 8 to find out about building a firewall. After the firewall is working,
    you can restart your internet connection and be reasonably safe from hackers.


    # Registering your modem with your ICP


    You have to register your modem with your ICP. During the registration process,
    your computer is assigned a network address to connect to the ICP. Network addresses
    are called Internet Protocol (IP) addresses.


    You register your modem by giving your ICP the modem''s machine address (MAC).
    The ICP generates an IP address by using the MAC address as its reference. You
    don''t need to do anything to your cable modem. The your modem automatically assigns
    an IP address.


    You''re ready to use your cable modem to connect to the Internet. Woo hoo! Blazing
    speed is yours now!


    # The DSL Option


    The world is wired. Wired for telephones, that is. DSL takes advantage of the
    old common technology to provide high-speed Internet connection to the consumers
    of the world. DSL uses special equipment to pump much more data through the POTS
    lines than the traditional analog modem do.'
