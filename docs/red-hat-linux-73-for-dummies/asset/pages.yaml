    on various Digital Equipment Corporation (DEC) Alpha, Sun SPARC, Motorola, MIPS,
    PowerPC, and HP/PA platforms.


    # # Knowing if Your Hardware Can Handle Red Hat Linux


    Linux supports symmetric multiprocessing (SMP), which means you can have more
    than one CPU per computer. In fact, Linux supports several processors per system.
    If your system has more than one CPU, Linux can utilize those CPUs also, either
    by speeding up a specific program written to take advantage of multiple CPUs or
    by allowing more programs to execute at one. (If you have an SMP system, would
    you care to trade with us?)


    The Intel processor should have the following amount of RAM (main memory):


    +   - Without graphics, Linux runs (er, walks) with 4MB.

    - With graphics, Linux runs at a minimum of 8MB; with 16MB, the graphics get much
    faster.'
