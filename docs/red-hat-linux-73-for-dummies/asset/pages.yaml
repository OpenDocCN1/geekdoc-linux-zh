  md: '# Appendix A: Discovering Your Hardware


    # Getting Information from Windows


    If you have Windows 95, 98 or ME, but not Windows 2000/XP, you can use the msd
    program in MS-DOS mode as described in the next section to find out about the
    hardware in your system. Much more information is available, however, through
    the Control Panel in Windows.


    With pencil and paper handy, it''s time to get to the Control Panel and all that
    information. Follow along with these steps:


    +   1. Click the Start button and choose Settings; Control Panel.


    +   2. Double-click the System icon, and then click the Device Manager tab.


    +   3. At the top of the screen, select the View Devices by Connection option.


    This shows all components and how they relate to each other.


    If you have a printer attached to your system, at this point you can click the
    Print button. Then, in the Print dialog box that appears, select the All Devices
    and System Summary option. Click OK. This procedure prints a full report about
    your system. You may not have all the information you need, such as which hard
    drive goes with which controller, but you will save yourself a lot of writing.


    +   4. In the list, on the Device Manager tab, click Computer.


    +   5. Click the Properties button.


    The Computer Properties dialog box appears.


    +   6. Select the Interrupt Request (IRQ) option and write down the displayed
    information.

    The Setting column, at left, lists interrupt requests. The hardware using a particular
    IRQ is listed in the right column. Note that no two devices use the same IRQ.


    +   7. Select the Direct Memory Access (DMA) option and write down the displayed
    information.


    +   8. Select the Input/Output (I/O) option and write down the pertinent information.


    Look for and write down entries regarding a sound card (if you have one) and a
    parallel port (LPT).


    +   9. Click Cancel.


    Return to the Device Manager tab of the System Properties dialog box.


