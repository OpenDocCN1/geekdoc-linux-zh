  md: '# Chapter 14: Using Desktop Productivity Tools


    The desktop is organized by default to show the applications available to you
    from StarOffice. You can click the New Text Document icon, for example, and StarOffice
    opens up the Writer word processor with a new document for you.


    The desktop is a real file manager that you can access and use files and directories.
    The StarOffice desktop default directory is Office52/user/desktop (Office52 is
    installed in /home/login by default, where login is your login name, so the full
    pathname is /home/login/Office52/user/desktop). Therefore, it displays the applications
    stored in that directory. Those applications are actually URLs that point to the
    actual applications: you can view the information about the URLs by right-clicking
    any of them and choosing Properties from the pop-up menu.


    To demonstrate how the StarOffice desktop works as a file manager, click the Up
    Level button near the top-left of the screen (it looks like a yellow folder with
    an arrow on it). The desktop displays the next directory — /home/login/Office52/user.
    This directory contains mostly directories and is displayed as such. Moving up
    by levels and you eventually go to the root (/) directory.


    The desktop also has a menu bar displayed across the top of the screen. You can
    access all its functions through this menu. The following list introduces the
    main menu functions. You''re probably familiar with the layout and operation of
    the menu if you''re familiar with Microsoft Office:


    +   File: As you may expect, you can open, close, save, and otherwise manipulate
    Office documents with the File menu. Writer files have the .sdw suffix. Other
    file formats, such as Microsoft Word and HTML, must be imported and exported.


    +   Edit: Provides all the functions that you need to modify documents. Functions
    such as cut, copy, paste, and delete are all provided here. The functions that
    are active at any time depend on whether you are editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options are not active
    if you are not editing a document (like after you start up StarOffice and have
    not opened any files).


    You can also track changes just like with Microsoft Word. Go to Edit— and you
    can track changes on a character-by-character basis. You can display the changes
    or keep them hidden from view. When you''re satisfied with your edits, you can
    commit the changes and save only the finished document to disk. Pretty cool.


    StarOffice also provides the Find and Replace function from the Edit menu. The
    Find and Replace-feature enables you to find text strings and either replace them
    with another string or delete them. You can search forward or backward through
    a document. You can replace one instance or all instances.'
