  md: '# Chapter 15: Bashing Your Shell


    Next, create a few additional files in the vacation directory, by using the touch
    command:


    ```

    [lidia@veracruz vacation]$ touch file

    [lidia@veracruz vacation]$ touch .dotfile

    ```


    Now if you use the same ls command (without the -a option), you see the following:


    ```

    [lidia@veracruz vacation]$ ls

    file

    [lidia@veracruz vacation]$

    ```


    And if you redo the ls command with the -a option, you get this:


    ```

    [lidia@veracruz vacation]$ ls -a

    .. .dotfile file

    [lidia@veracruz vacation]$

    ```


    The ls command by default doesn''t list files that begin with a period. By adding
    the -a option, you modify the action taken by ls to print every filename whether
    or not begins with a dot.


    The ls command has many options, and you can use more than one at a time. Want
    to see how? Modify the -a option by adding l (l) to it. The command lines


    ```

    [lidia@veracruz vacation]$ ls -al

    total 5

    drwx-xr-x 3 (user)(group)(size) Jul 04 14:33 ../

    drwx-xr-x 6 (user)(group)(size) Jul 04 22:15 ..

    -rw-rw-r-- 1 (user)(group)(size) Jul 04 11:30 .dotfile

    -rw-rw-r-- 1 (user)(group)(size) Jul 04 17:40 file

    ```


    As you can see, instead of just listing the filenames, the l option shows a more
    detailed listing of files. If long listings don''t fit on a single line, Linux
    wraps to the next line.


    Most of the time, Linux doesn''t care what other you type the options and therefore
    considers ls -alt and ls -la to be the same. Multiple option choices are available
    with all commands, though, and they work only with commands that have single letters
    to specify their options.


    The command lists files in alphabetical order as the default, but you can tailor
    the output. For example, ls -alt displays the files in order by date and time,
    with the most recent first; ls -ltr reverses that order.


    ![](img/5275bfa3908ad63320aaea42eefe467c_252_0.png)'
