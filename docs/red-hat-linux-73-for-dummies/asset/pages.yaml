  md: '# 304 Part IV: Revenge of the Nerds


    # Starting Your Xengine


    Now you''re ready to try out your new X configuration.


    If you''re already running X — then you have reconfigured it — then you can either
    reboot your computer or restart X. It''s generally better and easier to simply
    restart it. To do this, press the Ctrl+Alt+Backspace keys at the same time. The
    screen goes black, flashes, takes a breath, flashes some more, and — if all goes
    well — returns with the new configuration.


    ![](img/5275bfa3908ad63320aaea42eefe467c_327_0.png)


    If you''re not running X, you can start it by entering the startx command at the
    command prompt.


    If your new configuration doesn''t work for some reason and the screen reverts
    to some unusable display, then something has gone wrong. It may be that you specified
    the video card incorrectly or that you answered some other question incorrectly.
    If you run into trouble, you can do several things:


    +   - Rerun Xconfigurator. Hopefully, you can zero in on the correct configuration.


    +   - Find out more detailed information about your video card and monitor by
    consulting manuals, documents, or Web sites.


    +   - Find a newer version of XFree86 code from www.redhat.com or the XFree organization
    itself at www.xfree86.org.


    +   - Find an experienced Red Linux guru to help you.


    +   - Purchase another video adapter or monitor.


    +   - Take a course to Fiji, where at the University of the South Pacific, they
    have a really good computer science department in which everyone uses Linux.


    If you try these solutions and still don''t have X running, look around for a
    Red Linux users group at a local college or high school. Or perhaps a group of
    computer professionals in your area may help. If you call the local college computer
    science department, the folks there probably can help you types of machines, and
    can help you figure out why your graphics system is not working or get a newer
    version of XFree86 that may support your video card. You may also consider purchasing
    a better video adapter. Even high-end cards are not terribly expensive and can
    give you a much better display.


    If you feel strange going to ask these people for help, remember that they were
    once new to Linux, too, and probably had to struggle through an even more difficult
    installation. When you do, remember to take all the accumulated information about
    your system that you have detected. It will save you and them time and energy.'
  merge: -1
