  md: '# Chapter 7: Connecting to a Local Area Network (LAN)


    +   Somewhat-better security: Access points make like a little bit easier for
    hackers (the practice of discovering and breaking into wireless networks is referred
    to as war driving) because the access points tend to handle more traffic than
    individual wireless traffic; for instance, if you have 10 wireless NICs communicating
    with an access point, then it handles 10 times the traffic that each NIC does.
    War driving must examine a lot of network traffic in order to discover the encryption
    keys. So, because access points process more network traffic they provide drivers
    with more raw material to work with.


    Ad-hoc networks can provide a bit more security because they connect to other
    networks — and the Internet — via a network router. Access points work as network
    bridges. Routers examine IP addresses before transmitting network traffic from
    one network to another. Ad-hoc networks can be configured to more tightly control
    network traffic than an access point based. You can configure ad-hoc networks
    with a firewall more easily than one using an access point.


    In the end, the IEEE is going to have the wireless encryption scheme so we can
    sleep at night.


    We explain how to connect a wireless NIC (or WiFi NIC) to an access point using
    infrastructure mode. It''s beyond the scope of this book to configure an access
    point in order to construct a wireless network. We assume that you already have
    access to an access point.


    # Wireless network warning


    WiFi, the standard for wireless technology, uses an encryption system called equivalent
    privacy (WEP) to provide security. WEP encrypts communication between wireless
    devices to prevent anyone with the right equipment from listening and using your
    wireless network. But WEP is flawed and can be broken using tools available on
    the Internet (big surprise). If your WiFi is hacked, a hacker can read your communication.
    But your problems don''t end. A hacker can use your wireless network to connect
    to both your private network and also the Internet — you''ll have the hacker launch
    a pad to Internet.


    for the risk. The thinking is that, if you assume that your wireless network has
    already been hacked, you don''t have to worry about when it might be hacked in
    the future.


    You should use Open Shell (open SSH) and Secure Socket Layer (SSL) — both bundled
    with Red Linux — to connect all your internal and external communication. Please
    keep in mind that SSH and SSL protects your information but doesn''t prevent someone
    from connecting to your network. The next generation of WiFi —802.11g — is supposed
    to fix the WEP weakness. Until WEP’s problems are solved, be aware of the risks.


    On the other hand, wireless networking is so useful that many people make accommodations


