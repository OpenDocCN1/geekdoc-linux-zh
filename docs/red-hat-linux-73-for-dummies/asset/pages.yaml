  md: '# Chapter 8


    # Fire, Fire, Heh, Heh,

    Firewalls Are Cool


    In This Chapter


    +   - Introducing the Netfilter/iptables firewall system

    - Designing filtering rules

    - Automating your firewall

    - Viewing your firewall filtering rules

    - Testing your firewall


    After connect to the Internet, you run the risk that the bad guys will try to
    rip off your computer. The bad guys that we speak about wear black hats just like
    in the movies (as opposed to red hats, which are a bit odd but still cool). You
    may also have them called hackers, crackers, and so on. Whatever their names and
    whatever intentions, the Internet is getting more dangerous every day, and ya
    gotta protect yourself.


    This chapter describes how to build a firewall to help protect your Red Hat Linux
    computer from the bad elements found on the Internet. First, in case you doubt
    that you actually need a firewall, we explain why firewalls are important. We
    introduce you to iptables, Linux''s firewall system, and discuss two different
    ways to set up your filtering rules. After you set up your firewall, you need
    to know how to run the firewall automatically. You do that by setting up a script—something
    else we explain in this chapter. And, of course, what good would it be if it didn''t
    work? We show you how to do a simple test to make sure your firewall is running
    brightly.


    The firewalls described in this chapter enable you to make RealAudio connections,
    but you must follow the directions for getting RealPlayer through your firewall,
    which you can find in Chapter 13. We explain how to configure RealPlayer to use
    the HTTP protocol in place of its native RTSP (what?) and PNA (huh?) protocols—those
    acronyms are just technical jargon that we clear up in Chapter 13. RealPlayer
    works with the firewalls we discuss in this chapter because HTTP is allowed to
    pass through to the


    ![](img/5275bfa3908ad63320aaea42eefe467c_138_0.png)'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Understanding Why You Need a Firewall in the First Place


    You may think that there''s safety in numbers. After all, literally millions of
    people, businesses, and organizations are connected to each other through networks
    and internetworks — including the Internet — at any given time. What do you —
    a simple person with a simple computer connected to the Internet — have to be
    concerned about? The bad guys are usually interested in big money or publicity,
    right?


    Well, that way of thinking is mostly true, and chances are that you''ll never
    get hacked. You''re relying on security by obscurity.


    Many hackers have tools that automatically scan and attack entire networks. The
    happy hacker doesn''t have to work hard to find and exploit unprotected computers.
    You shouldn''t risk getting owned — your computer broken into and controlled —
    by a hacker, especially when Linux provides effective tools for protecting yourself.


    Using a firewall is a simple but most effective method for protecting yourself
    when you connect to the Internet. A firewall allows you to connect to the Internet
    while blocking unnecessary and unwanted connections from coming.


    ![](img/5275bfa3908ad63320aaea42eefe467c_139_0.png)


    Linux is a multiuser and multitasking operating system, meaning that more than
    one task can be run at the same time. Unlike Microsoft Windows, more than one
    person can be logged in once. This flexibility comes at a price — it offers an
    attractive launching point for hackers. If someone can gain access to your Linux
    computer while it''s on the Internet, then that person can use your machine to
    launch attacks against other machines, and you become the proxy that helps the
    bad guys hide their identities.


    # LAN-ho: Adding firewall to a network


    Firewalls are essentially important if you''re connecting to the Internet via
    a local area network (LAN). Most Internet-connected LANs have a firewall that
    protects your computer from the worst attacks of the Internet. But a LAN''s-all
    firewall technology may not protect your computer; there''s always the danger
    of the


    insider threat — no, not from evil tobacco companies but from your fellow LAN
    users. Running a personal firewall gives you an added layer of protection. For
    instance, if you want to connect your computer to a university network, then you
    definitely want to use a firewall because such environments are very dangerous.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Chapter 8: Fire, Fire, Heh, Heh, Firewalls Are Cool 117


    # Building an Effective Firewall the iptables Way


    Linux installs bundled with a simple but extremely effective firewall system called
    Netfilter/iptables. The Netfilter part refers to the firewall system that''s built
    into the Linux operating system, and iptables is the interface it controls. We
    refer to the overall system as iptables because that is the part that you''ll
    be working with.


    The iptables utility filters IP packets, which are the backbone of the Internet
    (IP stands for Internet Protocol, in fact). When you''re connected to the Internet,
    all the information (graphics and text) that you send and receive is in the form
    of IP packets. All the information that enters and leaves your computer is packaged
    in the form of IP packets. You can use iptables to deny or deny packets based
    on their destinations, source addresses, and ports.


    Iptables is so effective because it uses stateful filtering. Stateful filtering
    means that the firewall is able to keep track of the state of each network connection.
    It''s a technical way of saying iptables knows which connections are valid. For
    instance, if you are browsing www.dummies.com through your firewall, then iptables
    is able to keep track of all the packets that belong to that connection. Iptables
    can deny packets that are trying to reach your computer that don''t belong to
    your connection, preventing any hackers from sneaking packets through your firewall.


    Red Hat installs the iptables firewall by default. The installation system configures
    a medium level of protection during the installation process. Recall that we advised
    you not to use the default iptables configuration in Chapter 3. iptables is not
    nearly as sophisticated or safe as the modern iptables firewall system. The Red
    Hat iptables configuration is also not comprehensive as the ones we set up in
    this chapter.


    Ports are an essential part of the Internet Protocol. Ports are used to organize
    the communication between clients and servers. For instance, when you click on
    a Web page, your browser communicates with the Web server by using a port. That''s,
    of course, a gross simplification but describes the basic idea. Suffice to say
    that ports are used to control the internal workings of the Internet for such
    things as Web browsing.


    ![](img/5275bfa3908ad63320aaea42eefe467c_140_0.png)'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 118 Part II: Got Net?


    # Designing filtering rules:

    Permissive and restrictive methods


    Firewall filtering rules are like the bricks, or as if you prefer, that build
    your firewall. Basically, the rules determine what network communication can come
    and go between your computer and the Internet.


    When you design filtering rules, you can take two directions: you allow all connections
    or deny all connections by default. Allowing all connections takes the view that
    it''s best to start by allowing communication with your computer and then denying
    connections by one. The danger with this method is that you unintentionally allow
    dangerous traffic to reach your machine. The alternative method is to start by
    denying all communication and then selectively allowing certain traffic. This
    is the best way to create a firewall with a security


    standpoint, but it can also create problems because you may unintentionally prevent
    needed or wanted network traffic from reaching your computer.


    We explain how to use the restrictive method in this chapter for two reasons:


    +   - The safest method is safer because it nearly completely prevents scanning
    and other hacker attacks from accessing your computer.


    +   - It is easier to configure. Iptables provides stateful filtering and requires
    only two rules to allow all outgoing network connections. You need to configure
    individual rules to block communication when using the permissive model.


    # Setting Up an iptables-Based Firewall


    Now so you know that you need a firewall and want to create one. What''s next?
    Well, the following sections explain how to set up an iptables-based firewall
    model. This section describes how to manually create the filtering rules. When
    you''re done setting up your rules, proceed to the "Saving your filters to a script"
    section so you don''t have to enter these rules every time you turn on your computer.


    The rules you use for each method vary slightly depending on the type of Internet
    connection you have. In the following sections, we''ve made the bold assumption
    that you''ve set up your Internet connection by using one of the three methods
    we discuss elsewhere in this book. We cover dial-up connections in Chapter 5,
    broadband connections in Chapter 6, and LAN connections in Chapter 7.


    In this section, you design an iptables-based firewall that turns off all incoming
    connections on your modem but still enables you to establish an outgoing connection
    to the Internet. You must follow all the steps in this list, or the firewall will
    likely prevent you from using the Internet:


    ![](img/5275bfa3908ad63320aaea42eefe467c_141_0.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 8: Fire, Fire, Heh, Heh, Firewalls Are Cool


    1. Log in to your computer as root.


    2. Open a terminal emulation window by clicking the terminal icon on the GNOME
    Panel. Figure 8-1 shows the terminal emulation window.


    The Panel is that big menu bar at the bottom of your screen. The terminal icon
    looks like a monitor.(Chapter 4 describes the function of a terminal emulation.)


    ![](img/5275bfa3908ad63320aaea42eefe467c_142_0.png)


    3. Make sure that you''re not already running a firewall by entering the following
    rules at the command prompt in the Terminal window:


    ```

    iptables --flush

    iptables --flush -t nat

    ```


    The iptables entries remove all the general-purpose filtering and Network Address
    Translation (NAT) rules that may be in place. NAT rules masquerade your network
    address as another address, making your computer appear to be someone else; NAT
    is frequently used to make your computer appear to be coming from your ISP so
    that you don''t have to register your computer for an official Internet Protocol
    (IP) address.


    4. Enter the following rules to allow network traffic to pass through the loopback
    device:


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux computers use an internal network called a loopback interface. The loopback
    is not an actual device, but the Linux operating system uses it for internal communications
    (a lot goes on behind the scenes on'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 120 Part II: Got Net?


    5. Turn off all network communication to your computer via the modem (or whatever
    you''re using) by entering the iptables rules that correspond to your connection
    type.


    +   * For a dial-up modem connection, use these rules:

    ```bash

    iptables -A INPUT -i ppp0 -j DROP

    iptables -A OUTPUT -o ppp0 -j DROP

    ```nThe modem uses the ppp0 interface, which is based on the Point-to-Point Protocol
    (PPP). Note that the first modem you use that you set up will use the ppp0 interface;
    the second modem uses ppp1, and so on.


    +   * For a broadband (DSL or cable modem) connection, use these rules instead:

    ```bash

    iptables --policy INPUT -i eth0 DROP

    iptables --policy OUTPUT -i eth0 DROP

    ```nThe only difference between these rules and the dial-up modem rules is the
    network interface that the firewall blocks access to. The broadband rules assume
    that broadband modem is connected to your first Ethernet device — eth0. Modify
    the rules as appropriate if you use a different configuration; for instance, if
    you have two Ethernet adapters and the DSL or cable modem is attached to the second
    one, use eth1 instead of eth0.


    +   6. Turn on all outgoing communication from your computer:

    ```bash

    iptables -A OUTPUT -m state -state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    These rules do not specify any particular network interface. However, because
    the filter is stateful, these rules effectively work on your broadband or LAN
    interface.


    The first filter rule permits all outgoing communication. The --state NEW, RELATED,
    ESTABLISHED option allows the firewall to allow packets of both new and already
    established connections to pass. (Packets are the basic part of all network communication.)
    Packets that are related to existing connections, such as FTP data transfers,
    are also permitted.


    The second filter rule controls the packets coming back from outgoing connections.
    When you connect to a Web site, for instance, your browser sends out packets,
    and the Web server responds to them. You might click a button on the Web site,
    and a new display pops up. Clicking a button sends a packet out, and the Web server
    sends packets back. You previously blocked packets from the Internet. This creates
    an exception that allows packets that belong to an existing connection — such
    as the connection that represents you clicking a button — to return to your computer
    through the firewall. Note that we do not allow new connections —state NEW — to
    be established because that would defeat the purpose of this firewall.'
  merge: -1
  pgno: 143
- img_proc: true
