    - Stopping Linux


    Before you can use Red Hat Linux, you need to check out a few of the basics. This
    chapter covers enough fundamentals to get started, including topics such as starting
    and stopping Linux and understanding the difference between graphical and nongraphical
    applications.


    Linux is a multiuser system, so you — every other user — need an individual name
    and password to protect your information and keep your tasks separate from other
    people''s tasks.


    # Introducing the Linux File System Tree


    Linux, like Unix, refers to everything as a file, giving each device, file, and
    directory a file address by which it can be identified. Linux refers to drives
    and drive partitions by using a system of letters and numbers; for example, /dev/sda
    could be the name of the first IDE hard drive, and /dev/sdb could be the name
    of the second SCSI hard drive.


    You can compare the Linux file system to a tree upside down, as shown in Figure
    4-1, which shows three subdirectories (a directory within a directory) of root.
    The top of the upside-down tree is represented by a / (slash) and is called the
    root directory, or just root. A series of limbs, branches, and leaves extend below
    the root: Limbs are mount points, the branches that extend from the limbs are
    directories, and the leaves on those branches are your files.'
  merge: -1
