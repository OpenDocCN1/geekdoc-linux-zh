    # Logging In


    When you use Linux, you must log in as a particular user with a distinct login
    name. Why? Linux is a multiuser system, and as such, it uses different accounts
    to keep people from looking at other people''s secret files, erasing files from
    the system, and otherwise doing bad things.


    The use of unique identities helps to keep the actions of one person from affecting
    the actions of another because many people may be using the same computer system
    at the same time (for instance, over a network). A benefit of this strategy is
    that Linux systems are essentially invulnerable to viruses, simply because each
    user''s files and directories can''t be used to corrupt the system as a whole.
    (Not that we''re keeping score or anything, but Windows systems can be destroyed
    by viruses because they don''t have this capability.


    As Red Hat Linux boots, you see all sorts of messages scrolling by the screen.
    After the scrolling stops, the login screen shown in Figure 4-3 appears.


