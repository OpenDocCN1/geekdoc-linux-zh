    get carried away.


    # Attend Conferences


    You can attend a number of conferences and trade shows to find out more information
    on Linux. All these shows are accurate as of the time we''re writing this, but
    events may change. Where possible, we listed the more general Web addresses for
    these events.


    You may have to do a little Web surfing to find the next upcoming event. If you
