- img_proc: true
  md: '# Appendix B: Installing Red Hat Linux in Text Mode (The Ugly Way) 351


    6. The Mouse Selection screen appears. Red Hat does a good job at detecting your
    mouse so you should be able to select OK and proceed to the steps that determine
    what software you install.


    Red Hat provides a complete and detailed Red Hat Linux installation guide at www.redhat.com/docs/manuals.
    You can find additional Red Hat Linux resources at ftp.redhat.com and www.redhat.com/apps/support.
    Or check out the Red Hat 7.3 Bible by Christopher Neuge and published by your
    good friends and buddies at Hungry Minds, for more detailed information using
    Red Hat Linux.


    If you access another computer — Linux or Windows — you can mount the Red Hat
    Linux CD-rom browser on that computer and look at the manual with Netscape or
    another browser. If you have another instance then open the /mnt/cdrom/doc/rhmanual/manual/index.htm
    file. On a Windows computer, you will want to look at D:\doc\rhmanual\manualindex.htm,
    assuming that your CD-ROM drive is the D:


    7. In the Installation Type dialog box, select OK.


    The Workstation option is selected by default in the Installation Type window.
    We base this on the software that the Workstation installation type installs.
    The Laptop type is optimized for laptops, of course, and includes extra software
    for systems like PCMCIA cards. You can choose the Laptop installation type if
    necessary and it should work with the examples in this book.


    Red Hat provides several installation methods: workstation, laptop, server and
    upgrade. The Server class installs software that provides services; Custom starts
    with a minimal workstation and allows you to select most of your software; Upgrade
    will simply start with a current Red Hat installation and install a new version
