  md: '# 292 Part IV: Revenge of the Nerds


    # Doing the ping thing


    If the network adapter is configured correctly and the routing is correct, check
    the network. The best way to do this is to ping the loopback interface first and
    then the other computer. Type the following command, let it run for a few seconds
    (one ping occurs per second), and stop it by pressing Ctrl+C:


    ```

    ping 127.0.0.1

    ```


    You should see a response like the one shown in the following code:


    ```

    PING 127.0.0.1: 56 data bytes

    64 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=2.0 ms

    64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=1.2 ms

    64 bytes from 127.0.0.1: icmp_seq=2 ttl=64 time=1.1 ms

    64 bytes from 127.0.0.1: icmp_seq=3 ttl=64 time=1.1 ms

    -- 127.0.0.1 ping statistics

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 1.1/1.8/4.6 ms

    ```


    Each line shows the number of bytes returned from the loopback interface, the
    sequence, and round-trip time. The last lines are the summary, which shows if
    any packets did not make the trip. This is a working system, but if you don''t
    see any returned packet, something is wrong with your setup and you should review
    the steps outlined in the preceding paragraphs.


    Next ping your Ethernet interface by typing:


    ```

    ping 192.168.1.1

    ```


    You should see a response like the following code:


    ```

    PING 192.168.1.1: 56 data bytes

    64 bytes from 192.168.1.1: icmp_seq=0 ttl=64 time=2.0 ms

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=1.2 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=64 time=1.1 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=64 time=1.1 ms

    -- 192.168.1.1 ping statistics

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 1.1/1.8/4.6 ms

    ```


