  md: '# 364 Part VI: The Appendixes


    If you don''t know whether you''re in command mode, just press Esc a few times.


    # Moving around in a file


    After you know how to open a file in vi, you''re ready to find out how to move
    around in it. The commands in Table C-1 move the cursor around. First, make sure
    that you''re in command mode; otherwise, Linux places these keys in your file
    just like any other data.


    | Table C-1 | Moving Around in vi |

    | Command | What It Does |

    | j | Move one line down |

    | k | Move one line up |

    | h | Move one character to the left |

    | l | Move one character to the right |

    | Ctrl+f | Scroll down a full screen |

    | Ctrl+b | Scroll up a full screen |


    If you want to go to a specific line number, you use a colon command. Type a colon
    (:), and it appears at the bottom of the screen. Next, type the line number where
    you want to be. Here''s an example:


    :12


    When you press Enter, the cursor moves to the beginning of line 12.


    # Deleting and moving text in vi


    This section describes how to delete and move text in vi. The vi editor has several
    commands for deleting. You can delete characters, words, or lines. The command
    for deleting a word is dw; this command deletes the word to the right of the cursor.
    You can delete more at once by prefacing the dw command with the number of words
    you deleted from the cursor position. For example, the command 6dw deletes the
    next six words following the cursor. Table C-2 lists additional deletion commands.'
