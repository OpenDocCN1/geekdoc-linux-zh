  md: '# 222 Part IV: Revenge of the Nerds


    When bash looks at that line, it performs the following steps:


    +   1. The bash shell creates a new environment for the ls command to be executed
    and determines what should be standard input and standard output to the command.
    Standard input is normally the keyboard, and standard output is normally the video
    screen. (You find out more about environments in a moment.)


    +   2. Then, bash expands * to match all the filenames in that particular directory.
    By expanding the filenames, we mean that certain special characters are used to
    indicate groups of filenames. When these characters are used, the computer sees
    what filenames match up with these special characters and supplies the filenames
    to the command, instead of the special characters.


    For example, suppose that you have the files ert, wert, uint and opgt in your
    current directory. If you type


    ```

    ls -l *

    ```


    to the ls command, it looks like you typed


    ```

    ls -l ert opgt uint wert

    ```


    The shell puts the names in alphabetical order before giving them to the command.


    +   3. Next, bash searches the PATH environmental variable looking for a command
    called ls. The PATH variable holds the names of directories that contain commands
    you may want to execute. If the command you want is not in the list, you have
    to explicitly tell the shell where it can find the command by typing either a
    complete or relative pathname to the command.


    +   4. After bash finds ls, it executes the ls command in the new environment,
    passing to the command the -l argument and all the filenames expanded, due to
    the use of the * character in the command.


    +   5. After ls runs, bash returns to the current environment, throwing away all
    the effects that occurred in the new environment, such as an environmental variable
    changing its value.


    In Step 1, we mentioned the environment. A shell operates in an environment just
    like humans live and work in an environment. We expect to have and use certain
    things in our human environment. Suppose you leave your office for a few days,
    and someone else steps in to use it. At first, this newcomer uses your environment
    as you arranged it. The person probably appreciates the fact that the phone works,
    office supplies are in the desk, and so on. After a while, the newcomer starts
    moving and changing things, and maybe even decaffeinated coffee out of your coffee
    mug! When you come back from your trip, everything is changed. You can''t find
    things easily, and stuff is growing in the bottom of your mug. It wouldn''t have
    been nice if person had left the office (your environment) exactly as you had
    arranged it?


    ![](img/5275bfa3908ad63320aaea42eefe467c_245_0.png)'
