  md: '# 276 Part IV: Revenge of the Nerds


    The following sections describe some of the more interesting and useful

    functions in each of the main.


    # Behavior


    The individual files that make up an RPM package often can simply be copied

    to their respective directories. Sometimes, however, more work is required.

    For example, some RPM packages require that a script be run after the files

    are copied to complete the installation. The following options are available

    in the GNOME RPM Behavior section of the Preferences window (refer to

    Figure 18-11):


    +   - Dependency checks on installations: To work correctly, some

    packages require that other packages be installed. RPM normally checks

    to see if all check — dependencies — exist before installing.

    You can turn off that check if you want to, though.


    +   - Don''t run scripts: RPM runs scripts, when they exist, after installing
    the

    software contained in a package. You can turn that off by selecting this

    option.


    +   - Don''t reorder packages: Sometimes you need to change the order that

    packages are installed. Another package may need to be installed first to

    satisfy a dependency.


    +   - Upgrade Options defaults: You should never change these these

    options.


    +   - Don''t install documentation: You can choose not to install README,

    docs, and other files by selecting this option.


    +   - Install all files: Clicking this option installs all the files in a package.


    +   - Just update database: This option updates the RPM database file but

    dot install any files.


    +   - Just test: This option sees if the package can be installed. When you use

    this option and select a package to be installed, for example, then the

    process is started but nothing is installed.


    +   - Don''t check package architecture: Most RPM packages are dependent

    to the type of processor that your computer uses. For example, the

    packages on the Red Hat installation CDs shipped with this book can be

    of Intel-based computers only.


    +   - Don''t check package OS: GNOME RPM does not check the operating

    system (OS) that the package is set to use.


    # Package listing


    This is a really difficult set of options to understand. You can display packages

    as icons or as a list. Decisions, decisions.'
