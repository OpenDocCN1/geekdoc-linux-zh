    # Navigating with the Nautilus File/Internet Integration Manager


    Being the boss doesn''t make you a bad person. It''s just a job. Right? Well that
    little GNOME guy is a good worker and doesn''t get paid much. Just press a key
    here, click a button, and you can boss him around like any worthy pointy Gilbert
    manager. GNOME even comes with its own file and integration manager that saves
    your work and makes time for those long lunches.


    Nautilus is GNOME''s file and Internet navigator system. Nautilus follows in the
    tradition of all good file managers, graphically displaying the files and directories
    on your computer. You can copy, move, delete, and execute files by pointing and
    clicking; creating directories and viewing file details are snap, too. But Nautilus
    goes a step further and can be used to configure your GNOME desktop. But that''s
    not all! Nautilus can also navigate the Internet, access multimedia, and slice
    and dice! Not a bad deal, considering that it works for free.'
