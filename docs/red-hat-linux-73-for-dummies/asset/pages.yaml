  md: '# Chapter 19: Bringing In the Red Hat Repairman: Troubleshooting Your Network


    # # Is your network cable broken? Nope


    Make sure that your network cables are not broken or cut. Check the connectors
    to make sure that they''re okay. You should also make sure that you are using
    the correct network cable, which should be category 5 (8-wire) straight-through
    cable.


    # # Is your Ethernet hub or switch working? Check


    Your Ethernet hub or switch should also be turned on. Ensure that the network
    cables are also connected.


    ![](img/5275bfa3908ad63320aaea42eefe467c_308_0.png)


    If you''re stuck in the Middle Ages (with me!) and are using coaxial network cable
    called Thinnet — 10base2 for geeks — then you don''t have to check an Ethernet
    hub/switch because there is none. Thinnet connects each NIC (computer, printer,
    and so on) to every other NIC on the subnet. In other words, each computer that
    is a Thinnet cable is connected electrically to all the computers in the network.
    Each computer sees all the network traffic on that bus If any of that bus is compromised,
    all traffic ceases. For example, if you disconnect the terminator at either end
    of the cable, all communication ends. The best way to troubleshoot that type of
    problem is to start at one end and work your way down the line. Try to get just
    two computers working together, then three, and so on. Eventually you''ll find
    the problem.


    Determining whether your network cable has been compromised requires addressing
    the following issues:


    +   - If you''re using Thinnet, make sure the BNCs (Bayonet Nut Connectors) are
    securely attached.

    - Look at the interface between the cable and Ethernet switch/hub — the BNC connector
    if you are using Thinnet — to make sure they are in good physical contact. Sometimes
    the cable can pull out a little bit and break the connection.

    - If you''re using Thinnet, make sure that each end of the cable has a 50ohm terminator
    attached to it. Thinnet must be terminated or else it won''t work right, just
    as it won''t work if the cable is broken. The reason for this is that the radio
    frequency (RF) signal reflects from the unterminated end and interferes with the
    incoming signals. If you have a cable that you know is good, try substituting
    it. The idea is to eliminate as many segments that you are unsure about as possible.
    If you have'
