    the contents of Linux files.


    Make sure that you are not logged in as root when you go through this section
    and follows. Wait until you are familiar with this chapter before you log in as
    root. It''s possible and fairly easy to delete any file or directory when you
    are root; you can even erase your entire disk by running the wrong command (rm
