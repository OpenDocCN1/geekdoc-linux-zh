  md: '# 158 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Waking up the little guy


    Red Hat Linux configures the Nautilus to start automatically when you log in.
    Nautilus appears toward the end of the login process, as shown in Figure 11-1,
    and works as a file manager showing the contents of your home directory. Should
    you want to start it manually — after you''ve closed it, for example — then click
    the Main Menu button and choose Programs>Applications>Nautilus.


    The main menu follows familiar menu formats (File, Edit, and so on) and does all
    the things that you would expect those menus to do. The toolbar immediately below
    the main menu enables you to quickly move one directory (Up) and redo previous
    moves (Back and Forward). It also lets you rescan a directory, go to your home
    directory, and change the way that icons are displayed. The Rescan function, for
    example, is useful if you create a new file via a terminal screen. The file doesn''t
    show up in the File Manager until you move to another directory and return, or
    else rescan.


    # Putting him through his paces


    Most people use file managers to do the basics: copying, moving, and deleting
    files, and such. We introduce show how to use Nautilus to do these basic tasks
    and leave the rest (advanced functions) for you to explore on your own.


