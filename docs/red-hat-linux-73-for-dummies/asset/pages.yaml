    capable of repartition both FIPS and NTFS file systems. Go to www.norton.com for
    more information.


    ![](img/5275bfa3908ad63320aaea42eefe467c_47_1.png)


    If you decide to create a dual-boot Linux and Windows system, keep Windows as
    the first partition. Windows likes to be first, Linux is happy to be flexible
    and make your life easier.


    The next two sections contain steps for defragmenting your hard drive using fips
    to carve the drive into partitions.


    # # Defragmenting your hard drive


    Defragmenting a hard drive consolidates all the data on your hard drive within
    one partition, leaving the empty space behind Linux. This is a necessary task
    because Windows is a slob as operating systems go, throwing data all over the
    hard drive rather than in any sort of logical order.


    Follow the steps in one of the following two sections to defragment your hard
    drive while running Windows.


    **Defragmenting in Windows 9x/ME or Windows NT/2000**


    The following steps show you how to defragment your hard drive in Windows 9x/ME
    or Windows NT/2000:


    +   1. Close all programs and windows on your system, leaving just the desktop
    and icon bar.

    2. Double-click the My Computer icon on the desktop.

    3. Select your C: drive by clicking it and choosing File: Properties...

    4. Click Defragmentation Now.


    ![](img/5275bfa3908ad63320aaea42eefe467c_47_2.png)


    The defragmentation program looks at the drive to determine whether it needs defragmentation.


    You may get a message telling you that you don''t need to defagment because your
    hard drive is not very fragmented, but don''t believe it. Under ordinary circumstances
    this may be true. Repartitioning isn''t an ordinary occurrence; defragmenting
    your hard drive is necessary because you''re going to move the end of the partition
    file system and make the partition smaller, erasing any data outside that barrier.'
