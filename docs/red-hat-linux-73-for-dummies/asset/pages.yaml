  md: '# Chapter 19: Bringing In the Red Hat Repairman: Troubleshooting Your Network
    283


    +   - The first branch on the left involves problems with the physical connection:
    Do you have a network adapter? Is the cable connected properly to the adapter?
    If so, do you have a break in the cable? If so, then you have to fix or replace
    the cable.


    +   - The second branch deals with the network interface configuration: Have you
    configured the IP address for your Ethernet adapter correctly? If so, is the netmask
    correct?


    +   - The third branch helps decide if the problem exists with the network routing.
    Can your network packets be directed towards the correct network?


    The fault tree helps you break down any big problem into simpler ones. by eliminating
    each simple problem one-by-one, you should eventually locate the root cause. The
    fault tree is a simple method for thinking a problem through.


    ![](img/5275bfa3908ad63320aaea42eefe467c_306_0.png)


    Figure 19-1: The fault tree.


    # The Fix Is In: Troubleshooting Your Network


    One common problem involves getting your Red Hat Linux computer to work on a network.
    Not that you''re having such problems after working Chapter 6, but if the impossible
    happens and Murphy comes to visit, then this section should help out.'
