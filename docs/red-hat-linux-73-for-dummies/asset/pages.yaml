    If you have a computer that was manufactured around 1997 or later, then you can
    probably boot directly from the CD-ROM. Woo hoo!


    Testing whether not your computer can boot from CD-ROM is easy:


    +   - Place CD1 that comes with this book into your computer''s CD-ROM drive.

    - Turn on your computer.


    If Red Hat Linux starts its preinstallation process, you''re golden.

    If nothing happens, your computer isn''t set to boot from CD-ROM by default. Or
    your computer isn''t capable of booting from the CD-ROM at all.


    If your computer doesn''t boot, that doesn''t necessarily mean that it''s unable
    to boot from CD; you may not have the option selected.


    You can try these general steps to find out if your computer is capable of booting
    from CD-ROM and just needs to have its settings tweaked. (Just about every BIOS
    is different from the next, so it''s impossible for us to make these steps anything
    but general.)


    +   - Boot (that is, turn on) your computer.

    DuringDuring the initial start phase, you should see some simple text displayed.
    While this is going on, you should see an instruction telling you which key to
    press to gain access to the menu that allows you to modify your computer''s BIOS.
    For example, typical instructions are Press <F1> to Enter Setup or Press <DEL>
    to Enter Setup.


    BIOS stands for Basic Input/Output Settings. The BIOS controls the basic functions
    of your computer that don''t require an operating system, as Red Hat Linux or
    Windows, to work. For example, the BIOS controls what devices your computer uses
    to boot from.


    +   - Press the correct key to enter the BIOS.

    A BIOS setup menu is displayed. Most of the time, you will need to press a function
    key (F1, F2, and so on) to enter the various submenus and identify the submenu
    that controls your computer''s boot sequence.


    +   - When you see the menu that includes your computer''s boot sequence, press
    the appropriate function key to enter the menu.

    This may take a bit of sniffing around, because some of the menus may have fairly
    techie-sounding names. Feel free to enter menus; just be careful not to change
    anything. If you do accidentally change something and you''re not sure how to
    fix it, exit the BIOS making sure to choose not to save changes when the BIOS
    asks you whether you want to save upon exit!'
