  md: '# 12 Part I: Installing Red Hat Linux


    In 1991, a student at the University of Helsinki named Linus Torvalds found himself
    dissatisfied with his current operating system. Torvalds thought that the Unix
    operating system might be better suited to help him accomplish his task. Unix
    was expensive, however, so he began writing his own version of Unix. After formulating
    the parts himself, Torvalds recruited a team of talented programmers, and together
    they created a new operating system, or kernel, now called Linux.


    One of the most important decisions Torvalds made in the early days of Linux was
    to freely distribute the Linux kernel code for anyone to do with as he wished.
    These free Linux distributions were and are still available in several forms —
    mainly online.


    The only restriction Linux imposed to the free distribution of his creation: No
    version of the software can be made proprietary (Proprietary software is software
    that is owned and developed under wraps by private companies. Open code is for
    the people — anyone can develop it without breaking the law.) You can modify the
    check out of it and distribute it for fun (and for profit, if you wish). What
    you can''t do stop anyone else from using, modifying, and distributing even your
    modified version of the software — freely or for profit.


    The lack of proprietary restrictions has led to drastic improvements in the technology.
    We overstress how important it is to the Linux operating system that its source
    code is freely available; the Linux operating system continues to operate rapidly
    — even organically — because it is constantly being tweaked by a lot of really
    smart people. (In contrast, operating systems like Microsoft Windows were tweaked
    every once in a while by a smaller group of smart people.)


    By the early spring of 1994, the first real version of Linux (Version 1.0) was
    available for public use. Even then it was an impressive operating system that
    ran smartly on computers with less than 2MB of RAM and a simple 386 microprocessor.
    Linux 1.0 also included free features that other operating systems charged hundreds
    of dollars for. Nowadays, tens of millions of users enjoy Linux at home and work.


    By the way, if you''re wondering about the whole penguin thing, the answer is
    actually disappointingly simple. The reason the friendly penguin (whose name is
    Tux, by the way) symbolizes All Things Linux is because Linus Torvalds, the inventor
    of the Linux operating system, loves penguins. Some mystery, eh?


