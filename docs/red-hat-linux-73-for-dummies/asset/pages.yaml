  md: '# # Appendix D

    # Diggin'' Them Linux Man Pages


    **In This Appendix**


    +   - Starting the man command

    - Reading the man pages

    - Finding commands


    Unix and Linux systems are largely made up of small, terse commands executed on
    the command line. Typically, each command is associated with at least one man
    page. The Linux man pages have nothing to do with gender: The man stands for manual.


    At one time, the man pages were the only documentation that came with Unix systems.
    Somewhere, we still have the thin book we received as first-time Unix users and
    system administrators. All that it contained were the man pages, and from that,
    we were supposed to install a Unix system. Many years later, we still look at
    the man pages first to get a quick idea of what a command should do, and what
    arguments to use on the command line or what values to set.


    This appendix shows you how to use the man command, how to read and understand
    the man pages, and how to locate other man pages that may help you understand
    the Linux command you''re investigating. Man pages are essentially help files.


    # ## Checking Out How the Man Pages Are Organized


    You can find the man pages in several directories throughout the system:


    +   - /usr/man

    - /usr/local/man

    - /usr/X11/man

    - /usr/lib/perl15/man'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Part VI: The Appendixes


    Each directory is broken up into subdirectories (referred to sections) of the
    manual. See Table D-1.


    | Table D-1: Man Sections and Where to Find Them |

    | Man Section | What the Section Covers | Available in This Directory |

    | Man 1 | User commands | /usr/share/man/man1 |

    | Man 2 | System calls | /usr/share/man/man2 |

    | Man 3 | Library functions | /usr/share/man/man3 |

    | Man 4 | Special files | /usr/share/man/man4 |

    | Man 5 | File formats | /usr/share/man/man5 |

    | Man 6 | Games (look at everyone going to that section!) | /usr/share/man/man6
    |

    | Man 7 | Miscellany | /usr/share/man/man7 |

    | Man 8 | System administration commands | /usr/share/man/man8 |

    | Man 9 (mann) | nroff, troff, and groff (and now tk) macros | /usr/share/man/man9
    |


    Most directories have more than one section. Two sections may have entries for
    a command of the same name. For example, section 1 has an open command, and section
    2 has an open system call. To make sure you are reading about the right command,
    you can specify the command on the man line. For example: [paul@veracruz paul]$$
    man 2


    Most sections of the man sections (which are basically databases of information)
    have two parts:


    +   - An page represented by a file called intro.n, where the n is a number that
    corresponds to the section name.

    - All commands, calls, library names, and filenames, represented by files with
    the name command.n, where n is the section name.

    - If you use cd to change to the /usr/man/man1 directory and issue the 1s command,
    you see files such as cat.1 and grep.1. Oddly, you don''t find a file called cd.1,
    because the cd command is built into the different shells, and its documentation
    is covered in the bash.1 file, or the csh.1 file.


    ![](img/5275bfa3908ad63320aaea42eefe467c_393_0.png)'
