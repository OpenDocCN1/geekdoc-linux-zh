  md: '# Chapter 12: Configuring Your Red Hat Linux Sound System 181


    4. Take the scsisbus values from Step 3 and use them with the cdrecord command
    by entering the following command:


    ```

    cdrecord -v speed=n dev=scsisbus_values -isosize filename

    ```


    Where n is the speed of your CD-ROM drive, scsisbus_values are the virtual SCSI
    values obtained from Step 3.isosize specifies that you are recording raw data,
    and filename is the name of the file that is created.


    For example, if you have a 4X speed ATAPI/IDE CD-ROM drive and want to create
    a CD from the mydir-31laug00.raw file, you run the following command:


    ```

    cdrecord -v speed=4 dev=0,0,0 -isosize mydir-31laug00.raw

    ```


    The scsisbus values from Step 3 — for example 0,0,0 — are used with the dev=parameter.
    The 0,0,0 value is combined with dev=create dev=0,0,0.


    Please note that you need to set your speed according to what your CD-ROM drive
    can handle. You need to obtain the speed value from the documentation that your
    recordable CD-ROM drive in order to enter it as part of the speed parameter in
    the cdrecord command. Look for a value like 4X or 8X. Don''t worry if you don''t
    know them. If you set the speed too high, then your CD is just recorded at the
    lower level.


    That''s it! You computer writes the information to CD. Congratulations! You''ve
    created a new CD.


    The process changes a little bit if you want to burn music. First, you don''t
    need to create an ISO image. Second, the following cdrecord command is used in
    place of the one shown in Step 3 of the preceding numbered list:


    ```

    cdrecord -v speed=n dev=scsisbus_values -audio filename

    ```


    Where n is the speed of your CD-ROM drive, scsisbus_values are the virtual SCSI
    values obtained from Step 3, -audio specifies that you are creating an audio disc,
    and filename is the name of the file that is created.


    For example, if you have a 4X speed ATAPI/IDE CD-ROM drive and want to create
    a music CD from the tom_waits.raw file, you should run the following command:


    ```

    cdrecord -v speed=4 dev=0,0,0 -audio tom_waits.wav

    ```'
