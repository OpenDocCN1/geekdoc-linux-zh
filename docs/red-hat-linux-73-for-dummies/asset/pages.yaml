  md: '# Part II: Got Net?


    If you hear the modem pick up and dial, you''ve won the game of hide-and-go-seek
    and know what device the modem is connected to. You can then skip to Step 4.


    +   2. If you don''t hear anything, make sure that you have the speaker on by
    entering the following command and then retry Step 1:

    echo "atv" > /dev/ttyS0


    If you hear the modem pick up and dial, you''ve found what device it is connected
    to and can skip to Step 4.


    +   3. If you can''t hear anything, then try using the other serial ports by substituting
    ttyS1, ttyS2, and finally ttyS3 in the command in Step 2 and trying it again until
    you find one works.


    +   4. After your modem is found, send the following command to the modem to kill
    the connection:

    echo "atz" > /dev/ttyS0


    # Getting desperate with dip


    If your modem isn'' still found after trying one of the two methods in the last
    section, you can use the dip dial-up program. You can use dip interactively; that
    is, dip allows you to enter a command and immediately see the result — a great
    advantage when experimenting or troubleshooting modems.


    To use dip to find your modem, follow these steps:


    +   1. Type dip-t at the command prompt and press Enter.

    Dip> appears (surprise!).


    +   2. Enter the following commands at the dip> prompt and press Enter after each:

    DIP>port ttyS0

    DIP>dial 555-5309


    If the modem picks up and dials, you''ve won! You can go on to Step 3. If the
    modem doesn''t pick up, then dip returns you to the command prompt, and you should
    skip to Step 4.


    +   3. If your modem is found, press the Enter key to immediately kill the connection.

    If modem picks up and dials, you''re done! You can skip Step 4. If the modem doesn''t
    pick up, then dip returns you to the command prompt, and you should go to Step
    4.


