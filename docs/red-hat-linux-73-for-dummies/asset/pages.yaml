    have files of all types that must be put into certain locations in order to work
    properly. For example, under Red Hat, some (but not all) the Mozilla files needs
    to go into the /usr/bin directory. RPM does that organizational stuff without
    any fuss or mess.


    +   - Not only does RPM install files into their proper directories, but it also
    does things like creating the directories and run scripts to do things that need
    to be done. Such a tidy and organized little scamp.


    +   - Upgrading packages: Gone are the days when updating a system was worse than
    going to the dentist. RPM acts like the personal Linux assistant you wish, updating
    existing software packages for you. RPM also keeps track — in a database of its
    — all the packages that you''ve got installed. When you upgrade a package, RPM
    does all of the bookkeeping chores and replaces only the files that needs to be
    replaced. It also saves the configuration files that it replaces.


    +   - Removing packages: The database that RPM keeps is also useful in removing
    packages. To put it simply, RPM takes out the trash (Housekeeping was never so
    easy) RPM goes to each file and uninstalls it. Directories belonging to the package
    are also removed when no files packages occupy them.'
