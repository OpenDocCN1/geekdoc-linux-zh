  md: '# 160 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    You can copy multiple files and directories in the same manner that you move them
    (see the preceding section); you simply trace a box around the files that you
    want to copy by clicking and dragging the mouse cursor. Next, right-click any
    of the highlighted icons (but not the white space around the icon and names themselves)
    to open a menu with three options: Copy, Move, and Delete. Choose Copy and follow
    the directions described in the last three sentences of the preceding section.


    # Deleting files and directories


    Deleting files and directories is much the same process as copying them. You right-click
    the deleted file or directory icon and choose Delete from the menu that appears.
    You''re prompted to verify that you really want to delete that file or directory.
    Exercise your normal caution and self-preservation skills before you click Yes.


    ![](img/5275bfa3908ad63320aaea42eefe467c_183_0.png)


    Deleting directories is naturally a bit more complicated. When you choose to delete
    an entire directory that isn''t empty, you''re prompted to delete it recursively,
    which means that any subdirectories will be deleted. Answer Yes and every file
    and directory within that is removed.


    Finally, you can delete multiple files and directories. Again, you trace a box
    by clicking and dragging the mouse cursor. Right-click the icons or (but not the
    white space around the icon and name). The simple menu, as described previously,
    appears. Choose Delete and then answer Yes in the confirmation window.


    ![](img/5275bfa3908ad63320aaea42eefe467c_183_1.png)


    You can change the confirmation behavior of moving, copying, or deleting functions.
    Choose Settings-Preferences and select the Confirmation tab in the Preferences
    window. You can then toggle various options that control your behavior.


    # Creating directories


    To create a new directory, choose File-New-Directory. The Create a New Directory
    dialog box appears in you type the name of the new directory. Linux creates the
    directory in the current working directory, which is the directory that the File
    Manager currently shows.


    # Viewing files and directories


    By default, files and directories display in iconic — symbolic — form. The only
    information that an icon shows is the name and whether an item is a file or directory.
    You can see more information by clicking the View as Icons, View as List, or View
    as ... buttons that appear when you click the View menu button at the top of the
    screen. Figure 11-3 shows the window after the View as List button is clicked.'
