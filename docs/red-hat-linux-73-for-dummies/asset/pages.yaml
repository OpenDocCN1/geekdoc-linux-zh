- img_proc: true
  md: '# Chapter 6: Broadband Rocks! 87


    The telephone system is referred to as Plain Old Telephone System (POTS) in the
    Telecommunication industry.



    DSL provides high-speed Internet connections by electronically converting your
    computer''s digital information into a form that can be transmitted from your
    home or business to the telephone company. When your data finds its way to the
    telephone company, it''s converted into another form and sent to your ISP.



    DSL uses frequencies in the millions of cycles per second — the Megahertz (MHz)
    range — compared to traditional analog systems that work with signals in the thousands
    of cycles per second (kHz). You get much higher connection speeds when you use
    higher frequencies. The problem is, however, that the telephone system wasn''t
    designed to work with higher frequencies.



    Fortunately, the brainiacs of the world have figured out how to get high-speed
    DSL connections out of old, slow POTS wiring. They have designed digital signal
    processing chips to overcome the POTS archaic architecture. The result is that
    if you live close enough—roughly 3 to 4 miles—to your DSL provider''s equipment,
    you can use DSL to get connected to the Net.


    # Facing DSL-configuration wees on head


