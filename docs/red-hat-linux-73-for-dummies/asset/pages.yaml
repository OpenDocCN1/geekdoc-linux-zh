  md: '# Appendix A: Discovering Your Hardware 339


    +   - The next hard drive is E and the master drive on the second controller.

    - The last hard drive is F and the slave drive on the second controller.


    Normally, Windows is located on your C drive, and data is on your other drives.
    This lettering scheme is just one possibility; your drives may be set up differently
    and may even include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have a SCSI controller on the motherboard or on a separate SCSI
    controller board, either in addition to or instead of the IDE controllers. SCSI
    controllers can have up to eight devices on them, numbered 0-7, including the
    controller. Newer SCSI controllers (known as wide controllers) can have up to
    16 devices, including the controller itself.


    If all you have a SCSI hard drive, usually drive 0 or drive 1 is your C drive,
    and others follow in order.


    If you have a mixture of IDE and SCSI controllers, your C drive could be any of
    them. The sections later in this chapter — “Getting Information from Windows”
    and “Getting Information from MS-DOS”— show you how to identify how many hard
    drives you have, what type they are, and the controllers to which they are attached.


    # Old systems and new hard drives


    Hard drives are made up of cylinders of information, which in turn are made up
    of tracks of information, which in turn are made up of blocks of information.
    Newer hard drives have more cylinders than older computer systems can handle easily.
    Therefore, a method logical addressing, or LBA, was created so that older systems
    can work with newer hard drives, which have more than 1,023 cylinders.


    LBA already, will make the data on the hard drive inaccessible. Therefore, before
    changing your hard drive to LBA, you should back it up if it contains any data.
    (You may decide that adding another hard drive is not such a bad idea as an expansion
    strategy.)


    The BIOS setup under hard drives specifies whether your computer system is capable
    of LBA. Your hard drive may already be accessed as an LBA hard drive. Some BIOS
    systems do this automatically the first time a drive with a large number of cylinders
    is accessed. Note, however, changing your hard drive to an LBA specification,
    if it is not


    Different hardware systems have different ways to enter the BIOS setup. Usually,
    you can enter when you turn on the power and start to boot; when you press the
    Reset button on the front of the system and start to reboot; when you go through
    the normal shutdown of your Windows system, and ask to reboot. As your computer
    starts, it displays a message telling you what key to press in order to enter
    the BIOS menu. The key is generally the Delete or F1 key, but can also be F2 or
    F10.'
