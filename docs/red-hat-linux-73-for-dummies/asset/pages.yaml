    or even


    ```

    1s [-abcdefghijklmnopqrstuvwxyzABCGLNQRSUX1]

    ```


    Don''t be overwhelmed. If you deal with the options one at a time, you''ll be
    able to understand how the command works. Take heart in the fact that most of
    the time, most people use only one or two options.


    If you use the man 1s command, you see that 1s has many more options. That''s
