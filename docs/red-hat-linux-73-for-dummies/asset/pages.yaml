    If you get a continuous stream of returned packets and the packet loss is zero
    or very near zero, your network is working. If not, the problem may be in the
    other machine. Review the troubleshooting steps in this chapter. Note that the
    ICMP is taking about 1 full millisecond (ms) longer to travel to the external
    computer than to the loopback device. That is because it is completely internal
    to the Linux computer.


    If you can''t locate the problem and you''re using a PPP connection to an Internet
    service provider (ISP), establish a PPP connection and try to ping the computer
    where you have your account. It''s considered a security breach to continuously
    ping someone else''s computer — and at least bad manners — so don''t leave it
    running. Also, the ISP''s firewall may not allow the Internet Control Message
    Protocol (ICMP) packets that ping uses. ICMP packets are the simplest type of
    packet defined in the Internet Protocol. They are used for doing simple things
    like a ping.


