  md: '# Chapter 14: Using Desktop Productivity Tools 211


    # Printing with StarOffice


    Printing from StarOffice is a simple process after you have configured Red Hat
    Linux to use a printer. This section first describes how to configure a Red Hat
    Linux printer and shows how to setup StarOffice to use that printer.


    Configuring a printer that is attached to your Red Hat Linux computer is a simple
    process. All that you have to do is run the printtool configuration tool and enter
    the information about your printer. The following steps describe how to it:


    +   1. Log in to your Red Hat Linux computer as root.

    2. Attach a printer to your Linux computer''s parallel (printer) port.

    The parallel port is a 25-pin female connector on the back of your printer case.
    Computers usually label the parallel port with some kind of printer icon (although
    sometimes it''s hard to imagine how they come up with the symbol). If yours is
    not marked, there''s no harm in plugging your printer into the appropriate port.
    If you choose a non-printer port, it''s probably a serial port and nothing bad
    can happen other than being able to print. In that case, use trial-and-error to
    find the correct port.

    3. Start the printer configuration tool by clicking the GNOME Main Menu Button
    and choosing Programs: System: Printtool.


    If you haven''t already configured a printer, printtool starts up with a blank
    screen.


