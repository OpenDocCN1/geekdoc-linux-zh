    Imagine you''re sitting alone, working at your computer. Feeling lonely? Want
    a little company? Well, we can''t provide friends, but we can show how your system
    can provide some tunes.


    In this chapter, we show you how to have fun with your Red Hat Linux computer.
    Red Hat Linux provides all the tools that you need to make your workstation into
    a sound system, including all the necessary applications to play CDs and MP3s,
    several CD and MP3 players, and tools for connecting your PC to a sound card and
    speakers.


    # Playing CDs and MP3s


    Everyone wants a little music in his or her life. That''s why you bought a $1,000
    computer instead of a $300 stereo system, right? No? Well even so, you can use
    your Red Hat Linux machine as a music system if you want. This section describes
    how to set up your computer to play music CDs and MP3s.'
