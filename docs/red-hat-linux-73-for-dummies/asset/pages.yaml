  md: '# Chapter 22: Ten Problem Areas and Solutions


    To correct this problem, use the chown and chgrp commands to change the ownership
    of the ~lupe home directory to lupe and to change the group ownership of the lupe
    home directory to users:


    ```

    chown lupe ~lupe

    chgrp users ~lupe

    ```


    Make sure you replace the lupe login name that we use in this example with the
