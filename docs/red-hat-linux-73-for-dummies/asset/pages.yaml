  md: '# Chapter 5


    # # Connecting to the Internet with a Dial-up Modem


    # ### In This Chapter


    +   - Finding an Internet service provider (ISP)

    - Configuring your modem

    - Configuring your Internet connection with LinuxConf

    - Setting up DNS

    - Connecting to your ISP


    Surfing the Internet is a lot of fun and a surprisingly useful activity. Come,
    admit it: you you want to tie up your phone line for hours in order to annoy your
    family or roommates, browse sites with ridiculous addresses such as www.theon.com,
    and chat chummily with people you''d never dream of speaking to person. The catch
    is that before you join the fray of the new online universe, you''ve gotta have
    access to the Internet.


    This chapter describes how to use a modem to connect to an Internet service provider
    (or ISP), and create your bridge to the Internet. After you''re hooked up to the
    Internet, you can then go to a party and drop the casual phrase, "I found this
    while surfing the Net after ... on my Red Hat Linux system." If you''ve never
    been the life of the party in the past, this will certainly make you immediately
    more popular.


    ![](img/5275bfa3908ad63320aaea42eefe467c_86_0.png)


    This chapter assumes you''re connecting to the Internet using a standard dial-up
    modem. We describe how to configure your Red Hat Linux computer to use faster
    connection technologies, referred to as broadband connections, in Chapter 6, which
    describes how to use cable modems and DSL models.


    Many people have access to Internet connected networks at work and school.(Or
    maybe your 5-year-old has constructed an Internet connected home network.) Chapter
    7 describes how to connect your Red Hat Linux computer to an existing private
    network and gain access to the Internet through its connection. You can then surf
    until the cows come home at light speed compared to a dial-up modem.'
  merge: -1
