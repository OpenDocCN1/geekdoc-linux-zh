    In any complex, technical situation, people end up having problems and issues
    that they need help with. The problems in this chapter were taken from a database
    of questions and answers created after hundreds of people installed the CD-ROMs.
    We answer some of these questions in the rest of the book, but because they still
    generate "what happened" questions, we repeat the information here.


    # I Can''t Boot Red Hat Linux Anymore


    Problem: You''ve installed Linux and everything is fine (normally). Then one day
    you make a change to your Windows or Windows NT system, and Linux stops working.
    You no longer see the LILO boot prompt, so you can no longer specify that you
    want to boot Linux.


    Solution: Various operating systems tend to think that they''re the only operating
    system on the hard drive or on the system. When they''re installed or updated,
    they write things to an area of the system called the'
  merge: -1
