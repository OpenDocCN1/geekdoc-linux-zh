    # Creating a drive partition


    You have to partition your new hard drive after you''ve added it to your Linux
    computer. The drive partition is Linux''s basic file storage unit. Here are the
    general steps you follow to create a drive partition:


    +   1. Create the file systems on the drive partitions.

    2. Combine the file systems to form a single directory tree structure.

    3. Define the drive partitions.


    The directory tree structure can be on one drive or spread across many.


    You can define drive partitions when adding a new drive or sometimes later.

    In most cases, Linux defines drive partitions during the original Linux installation.
    You may divide a drive into one, two, four, or more partitions, each of which
    may contain a special file or be used as a swap partition. Swap partitions allow
    very large partitions or small programs to run even if they take up more memory
    than you have in your computer. The total of all your swap partitions and RAM
    is called virtual memory.


    +   4. Create a file system.

    The file system occupies a single space on the drive that has a unique block special
    file (device) name. This unique name accesses the file system regardless of whether
    the data is stored on all or only part of the physical drive or is an aggregation
    of multiple drives.


