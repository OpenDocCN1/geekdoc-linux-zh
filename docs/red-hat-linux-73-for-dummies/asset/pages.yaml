    It''s best not to run the examples that remove (using the rm command) and move
    files (the mv command) when you''re logged in as a regular user too, because you
    can erase your own files accidentally. Linux (for the most part) doesn''t have
    an undo function, although a change is in the works.


    To find out what the cat command is all about, follow these steps:


    +   1. Make sure that you are in the /home directory.


