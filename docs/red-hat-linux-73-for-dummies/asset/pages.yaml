  md: '# Chapter 16: Filing Your Life Away 249


    # Owning Files and Granting Permissions


    All Linux files and directories have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    users'' access to files. File permissions can also be used to specify whether
    a file is executable as a command and to determine who can use the file or command.


    Files and directories are owned by user accounts. User accounts are defined in
    the /etc/passwd file. For instance, you created the root (superuser) account when
    you installed Red Hat Linux in Chapter 3 and the installation system created the
    superuser home directory—/root plus several configuration files—for instance,
    .bashrc. The root user owns all files and directories. If you created a regular
    user account—for instance, lidia—then that user''s home directory and configuration
    files are all owned by lidia. Users can access and modify any files or directories
    that they own.


    Files and directories all have group ownership in addition to user ownership.
    Groups are defined by the /etc/group file and provide a secondary level of access.
    For instance, you can assign group ownership to files that you own and allow other
    users who belong to the group to access those files.


    Files and directories are assigned permissions that permit or deny read, write,
    and execute access. Permissions are assigned to the owner, group, and anyone of
    the file or directory. The owner, group, and anyone permissions are independent
    of each other.


    Using the ls command with the -l option allows you to see the file''s permissions,
    along with other relevant information, such as who owns the file, group of people
    have permission to access or modify the file, the size of the file or directory,
    the last time the file was modified, and the name of the file.


    First, create a file with the touch command. The Unix and Linux communities use
    the touch command for many things, one of which is to create a little zero-length
    file:


    ```

    [lidia@veracruz lidia]$$ touch vacationtime

    [lidia@veracruz lidia]$$ ls -l vacationtime

    -rw-r--r-- owner group 0 Oct 3 16:00 vacationtime

    ```


    The -rw-r--r-- are the permissions for the vacationtime file: The owner is, and
    the group is probably you but may be someone or something else, depending on how
    your system is set up and administered.


    You may be wondering how you can become an owner of a file. Well, you automatically
    become the owner of any file you create, which makes sense. As the owner, you
    can change the default file permissions—and even the ownership. If you change
    the file ownership, you lose ownership privileges.'
