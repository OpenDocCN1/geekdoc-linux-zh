  md: "# CHAPTER 4. KUBNETES ARCHITECTURE\n\nkind: Deployment\nMetadata:\n\n```\n\
    <output_omitted>\ntemplate:\n  metadata:\n    creationTimestamp: null\n  labels:\n\
    \    app: hog\nspec:\n  containers:\n    image: vish/stress\n    imagePullPolicy:\
    \ Always\n    name: stress\n  resources:\n    terminationMessagePath: /dev/termination-log\n\
    <output_omitted>\n```\n\n3. We use the YAML output to create our configuration\
    \ file. The --export option can be useful to not include unique parameters.\n\n\
    ```\nstudent@lfs4s8-node-ia0a:~$ kubectl get deployment hog \\\n  --export -o\
    \ yaml hog.yaml\n```\n\n4. If you did not use the --export option we will need\
    \ to remove the status creationTimestamp and other settings, as we do not to set\
    \ unique generated parameters. We will add in limits found below.\n\n```\nstudent@lfs4s8-node-ia0a:~$\
    \ vim hog.yaml\n```\n\n```\nimagePullPolicy: Always      # Edit to remove {}\n\
    name: hog\nresources:                   # Add these 4 lines\n  limits:\n    memory:\
    \ \"4Gi\"\n  requests:\n    memory: \"2500Mi\"\nterminationMessagePath: /dev/termination-log\n\
    terminationMessagePolicy: File\n```\n\n5. Replace the deployment with the newly\
    \ edited file.\n\n```\nstudent@lfs4s8-node-ia0a:~$ kubectl replace -f hog.yaml\n\
    deployment.extensions/hog replaced\n```\n\n6. Verify the change has been deployed.\
    \ The deployment should show resource limits.\n\n```\nstudent@lfs4s8-node-ia0a:~$\
    \ kubectl get deployment hog -o yaml | less\n...\nresources:\n  limits:\n    memory:\
    \ 4Gi\n  requests:\n    memory: 2500Mi\nterminationMessagePath: /dev/termination-log\n\
    ...\n```\n\n7. View the stdio of the hog container. Note how much memory has been\
    \ allocated.\n\nLFS258: V.2018-11-13      © Copyright the Linux Foundation 2018.\
    \ All rights reserved."
