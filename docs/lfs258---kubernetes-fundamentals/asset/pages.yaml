    \ created\n```\n\n```\nstudent@lfs458-node-1oaa~$$ kubectl get pvc\nNAME STATUS\
    \ VOLUME CAPACITY ACCESSMODES STORAGECLASS REASON AGE\npvc-one Bound 1Gi RWX -\
    \ 4s\n```\n\n+   4. Look at the status of the pv, determine if it is in use. It\
