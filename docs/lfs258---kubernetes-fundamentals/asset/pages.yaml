  md: "# Chapter 6\n\n# API Objects\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_42_0.png)\n\
    \n# 6.1 Labs\n\n# Exercise 6.1: RESTful API Access\n\n# Overview\n\nWe will continue\
    \ to explore ways of accessing the control plane of our cluster. In the security\
    \ chapter we will discuss there are several authentication methods, one of which\
    \ is use of a Bearer token We will work with one then deploy a local proxy server\
    \ for application-level access to the Kubernetes API.\n\n# RESTful API Access\n\
    \nWe use the curl command to make API requests to the cluster, in an in-secure\
    \ manner. Once we know the IP address and port, then the token we can retrieve\
    \ cluster data in RESTful manner. By default most of the information is restricted,\
    \ but changes to authentication policy could allow more access.\n\n+   1. First\
    \ we need to know the IP and port of a node replica of the API server. The system\
