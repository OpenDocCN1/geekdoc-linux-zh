  md: '+   4. In the search box you probably see some existing text like `is:issue
    is:open` which allows you to filter on the kind of information you would like
    to see. Append the search string to read: `-is:issue is:open label:kind/bug` then
    press enter.


    +   5. You should now see bugs in descending date order. Across the top of the
