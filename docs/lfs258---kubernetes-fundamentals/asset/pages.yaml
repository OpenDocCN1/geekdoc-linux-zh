  md: '# Chapter 16


    # Security


    # 16.1 Labs


    # Exercise 16.1: Working with TLS


    # Overview


    We have learned the flow of access to a cluster with TLS connectivity, then authentication
    followed by authorization, finally an admission control plug-in allows advanced
    features prior to the request being fulfilled. The use of Initializers allows
    the flexibility of a shell-script to dynamically modify the request. As security
    is an important, ongoing concern, there may be multiple configurations used depending
    on the needs of the cluster.


    Every process making API requests to the cluster must authenticate or be treated
    as an anonymous user.


    # Working with TLS


    While one have multiple cluster Certificate Authorities (CA) by default each cluster
    uses their own, intended for intracl communication. The CA certificate bundle
    is distributed to each node and as a secret to default service accounts. The kubelet
    is a local agent which ensures containers are running and healthy.


    +   1. View the kubelet on both the master and secondary nodes. The kube-apiserver
    also shows security information as certificates and authorization. As kubelet
    is a system service we will start looking at that output.


    ```

    student@tls468-node-la0:~$ systemctl status kubelet.service

    kubelet.service - The Kubernetes Node Agent

    Loaded: loaded (/lib/systemd/system/kubelet.service; enabled; vendor preset: en

    Drop-In: /etc/systemd/system/kubelet.service.d

    10-kubeadm.conf

    ```


    +   2. If we look at the status output, and follow the cgroup information, which
    is a long line where configuration settings are drawn from, we see where the configuration
    file can be found.'
