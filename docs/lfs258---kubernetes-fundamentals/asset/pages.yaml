  md: "# Exercise 9.2: Creating a Persistent NFS Volume (PV)\n\nWe will first deploy\
    \ an NFS server. Once we create a persistent NFS volume for containers to claim.\n\
    \n+   1. Install the software on your node.\n\n```\nstudent@lfs458-node-la0a:~\
    \ sudo apt-get update && sudo \\\napt-get install -y nfs-kernel-server\n<output_omitted>\n\
    ```\n\n+   2. Make a directory to be shared. Also give it permissions to /tmp/\n\
    \n```\nstudent@lfs458-node-la0a:~ sudo mkdir /opt/sfw\n\nstudent@lfs458-node-la0a:~\
    \ sudo chmod 1777 /opt/sfw/\n\nstudent@lfs458-node-la0a:~ sudo bash - \\\n'echo\
    \ software > /opt/sfw/hello.txt'\n```\n\n+   3. Edit the NFS server to share the\
    \ newly created directory. In this case we will share the directory with all.\
    \ You can always sniff to see the inbound request in a later stage and update\
    \ the file to be more narrow.\n\n```\nstudent@lfs458-node-la0a:~ sudo vis /etc/exports\n\
    /opt/sfw *(rw,sync,no_root_squash,subtree_check)\n```\n\n+   4. Cause /etc/exports\
    \ to be re-read:\n\n```\nstudent@lfs458-node-la0a:~ sudo exports -ra\n```\n\n\
    +   5. Test the mounting from your second node.\n\n```\nstudent@lfs458-worker:~\
    \ sudo apt-get -y install nfs-common\n<output_omitted>\n\nstudent@lfs458-worker:~\
    \ mount - -l nfs-lfs458-node-la0a\nExport list for lfs458-node-la0a:\n/opt/sfw\
    \ *\n\nstudent@lfs458-worker:~ sudo mount 10.128.0.3:/opt/sfw /mnt\n\nstudent@lfs458-worker:~\
    \ ls -l /mnt\ntotal 4\n-rw-r--r-- 1 root 9 Sep 28 17:55 hello.txt\n```\n\n+  \
    \ 6. Return to the master node and create a YAML file for the object with kind,\
    \ PersistentVolume. Use the hostname of the master server and the directory you\
    \ created in the previous step. Only syntax is incorrect, an incorrect directory\
    \ will not generate an error, but a Pod using the resource will not start. Note\
    \ that the accessModes do not currently affect actual status and are typically\
    \ used as labels.\n\n```\nstudent@lfs458-node-la0a:~ vim PVVol.yaml\n\\apiVersion:\
    \ v1\nkind: PersistentVolume\nmetadata:\n  name: pvvol-1\nspec:\n  capacity:\n\
    \    storage: 1Gi\n  accessModes:\n    - ReadWriteMany\n  persistentVolumeReclaimPolicy:\
    \ Retain\n```"
