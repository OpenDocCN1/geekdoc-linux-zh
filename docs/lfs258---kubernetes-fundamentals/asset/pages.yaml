    ```


    +   2. Choose one of the pods and use the exec command to printenv the first pod.
    The example uses the first pod listed above.


    ```

    student@lfs458-node-la0a:~$ kubectl exec nginx-1423793266-13p69 \ \

    -- printenv grep KUBERNETES_SERVICE

    KUBERNETES_SERVICE_HOST=10.96.0.1

    KUBERNETES_SERVICE_PORT=443

    KUBERNETES_SERVICE_HOST=10.0.61.122

    NGINX_SERVICE_PORT=80

    <output_omitted>

