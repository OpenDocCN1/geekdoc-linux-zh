  md: "# Exercise 7.3: Rolling Updates and Rollbacks\n\nOne of the advantages of micro-services\
    \ is the ability to replace and upgrade a container while continuing to respond\
    \ to client requests. We use the default OnDelete strategy updates a container\
    \ when the predecessor is deleted, then we use the RollingUpdate feature as.\n\
    \n+   1. By viewing the current updateStrategy for the DaemonSet created in the\
    \ previous section.\n\n```bash\nkubectl get ds-node-la0 -o yaml \\\n| grep -A\
    \ 1 Strategy\nupdateStrategy:\n  type: OnDelete\n```\n\n+   2. Update the DaemonSet\
    \ to use a new version of the nginx server. This time use the set command instead\
    \ of edit. Set the version to be 1.8.1-alpine\n```bash\nkubectl set image ds-one-nginx\
    \ nginx:1.8.1-alpine \ndaemonset.extensions/ds-one-image updated\n```\n\n+   3.\
    \ Verify that the Image for the Pod checked in the previous section is unchanged.\n\
    \n```bash\nkubectl describe ds-one-b1dcv | grep Image:\nginx:1.7.9\n```\n\n+ \
    \  4. Delete the Pod. Wait until the replacement Pod is running and check the\
    \ version.\n\n```bash\nkubectl delete pod ds-one-b1dcv pod \"ds-one-b1dcv\" deleted\n\
    ```\n\n```\n```\nkubectl get pod\nNAME         READY STATUS RESTARTS AGE\ns-one-xc86b\
    \  1/1 Running   0      19s\ns-one-z31r4  1/1 Running   0      4m8s\n```\n```\n\
    \n+   5. View the image on the old Pod. It should show version 1.7.9.\n\n```bash\n\
    kubectl describe ds-one-z31r4 | grep Image:\nginx:1.7.9\n```\n\n+   6. View the\
    \ history of the DaemonSet. You will see two revisions. The number of revisions\
    \ is kept in the DaemonSet with v.12.1 the history has increased to two, by default.\n\
    \n```bash\nkubectl rollout history ds-one\ndaemonsets \"ds-one\"\nCHANGE-CAUSE\n\
