  md: "# Chapter 4\n\n# Kubernetes Architecture\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_24_0.png)\n\
    \n# 4.1 Labs\n\n# Exercise 4.1: Working with CPU and Memory Constraints\n\n# Overview\n\
    \nWe will continue working with our cluster, which we built in the previous lab.\
    \ We will work with **resource limits**, more with namespaces and then a complex\
    \ deployment which you can explore to further understand the architecture and\
    \ relationships.\n\nUse **SSH or PuTTY** to connect to the nodes you installed\
    \ in the previous exercise. We will deploy an application called **stress inside\
    \ a container**, and then use *resource limits* to constrain the resources the\
    \ application has to use.\n\n+   1. Use a container called stress, which we name\
    \ hog, to generate load. Verify that your container is running.\n\n```\nstudent@fs458-node-la0a~\\\
    $ kubectl create deployment hog --image vanish/stress\ndeployment.apps/hog created\n\
    \nstudent@fs458-node-la0a~\\$ kubectl get deployments\nNAME      DESIRED CURRENT\
    \ UP-TO-DATE AVAILABLE AGE\nhog       1        1               1           12s\n\
    ```\n\n+   2. Use the describe command to view details, then view the output in\
    \ YAML format. Note there are no settings limiting resource usage. There are empty\
    \ cupboards.\n\n```\nstudent@fs458-node-la0a~\\$ kubectl describe deployment hog\n\
    Name:\n  default\nCreationTimestamp:\n  Fri, 09 Nov 2018 19:55:45 +0000\nLabels:\n\
    \  app:hog\nAnnotations:\n  :deployment.kubernetes.io/revision: 1\n  <output-omitted>\n\
    \nstudent@fs458-node-la0a~\\$ kubectl get deployment hog -o yaml\napiVersion:\
    \ extensions/vbetal\n```"
