  md: '# Chapter 9


    # Volumes and Data


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_64_0.png)


    # 9.1 Labs


    # Exercise 9.1: Create a ConfigMap


    # Overview


    A Volume is a directory accessible to containers in a Pod. Cloud providers offer
    volumes which persist further than the life of the Pod, such that AWS or GCE volumes
    are pre-populated and offered to Pods, or transferred from one Pod to another.
    Ceph is also another solution for dynamic, persistent volumes.


    Unlike Docker a Kubernetes volume has the lifetime of the Pod, not the containers
    within. We can use different types of volumes in the same Pod simultaneously,
    but Volumes cannot mount in a nested fashion. Each must have its own mount point.
    Volumes are declared with spec.volumes and mount points with spec.containers.volumeMount.
    Each particular volume, 24 currently, may have other restrictions. https://kubernetes.io/docs/concepts/storage/types-of-volumes


    We will also work with ConfigMap, which is basically a set of key-value pairs.
    This data can be made available so that a Pod can read the data as environment
    variables or configuration data. A ConfigMap is similar to a Secret, except they
    are not base64 encoded arrays. They are stored as strings and can be read in serialized
    format.


    # Create ConfigMap


    There are three different ways a ConfigMap can ingest data, from a literal value,
    from a file or from a directory of files.


    +   We will create a ConfigMap containing primary colors. We will create a series
    of files to ingest into the ConfigMap. First, we create a directory primary and
    populate it with four files. Then we create a file in our home directory with
    our favorite color.'
