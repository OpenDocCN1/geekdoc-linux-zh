  md: '# Chapter 3


    # Installation and Configuration


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_10_0.png)


    # 3.1 Labs


    # Exercise 3.1: Install Kubernetes


    # Overview


    There are several Kubernetes installation tools provided by various vendors. In
    this lab we will learn to use kubeadm. As a community-supported independent tool,
    it is planned to become the primary method to build a Kubernetes cluster.


    The labs were written using Ubuntu instances running on Google Cloud Platform
    (GCP). They have been written to be vendor-agnostic so could run on AWS, local
    hardware, or inside of virtualization to give you the most flexibility and options.
    Each platform has different access methods and considerations. As of v1.12.1 the
    minimum (in as barely as possible) size for VirtualBox is 2vCPU/1G memory minimal
    OS for master and 1vCPU/1G memory minimal OS for worker node.


    If you are own equipment you will need to disable swap on. There may be other
    requirements which will be shown as warnings or errors when using the kubeadm
    command. Most commands run as a regular user, there are some which require root
    privilege. For example please sudo access as shown with AWS you will need to use
    an SSH client such as a local terminal or PuTTY if not using Linux or a Mac. You
    can download PuTTY from www.putty.org. You would also require a pem or ppp file
    to access the nodes. Each cloud provider will have a process to download or create
    this file. Attending in-person instructor trained the file will be made available
    during class.


    In this exercise we will install Kubernetes on a single node then grow the cluster,
    adding more compute resources. Both nodes use the same size, providing 2 vCPUs
    and 5g of memory. Smaller nodes could be used, but would run slower.


    Various exercises will use YAML files, which are included in the text. You are
    encouraged to write the files when possible, as the syntax of YAML has white space
    indentation requirements that are important to learn. An important note, do not
    use in your YAML files, white space only. Indentation.


    If you use a PDF of copy and paste after does not pass the single quote correctly?
    It pastes as a back-quote instead. You will need to modify it by hand. The files
    have also been made available as a compressed tar file. You can view the resources
    by navigating to this URL:'
