  md: "# CHAPTER 15. HELM\n\n3. Copy the helm binary to the `/usr/local/bin/` directory,\
    \ so it is usable via the shell path.\n\n```\n$student@lfs458-node-1oa0$ sudo\
    \ cp linux-amd64/helm /usr/local/bin/\n```\n\n4. Due to RBAC configuration helm\
    \ is unable to run in the default namespace, in this version of Kubernetes, initialization\
    \ you could create and declare a new namespace. Other RBAC issues may be encountered\
    \ then. In this we will create a service account for tiller, and give it admin\
    \ permissions on the cluster. More on RBAC in another chapter.\n\nBeginning the\
    \ serviceaccount object.\n\n```\n$student@lfs458-node-1oa0$ kubectl create serviceaccount\
    \ \\\n    --namespace kube-system tiller\n    serviceaccount \"tiller\" created\n\
    ```\n\n5. Bind the serviceaccount to the admin role cluster-admin inside the kube-system\
    \ namespace.\n\n```\n$student@lfs458-node-1oa0$ kubectl create clusterrolebinding\
    \ \\\n    --clusterrole=cluster-admin \\\n    --account=cluster-admin \\\n   \
    \ --serviceaccount=kube-system:tiller\nclusterrolebinding.rbac.authorization.k8s.io/tiller-cluster-rule\n\
    ```\n\n```\n$student@lfs458-node-1oa0$ helm init\n\n<output_omitted>\n```\n\n\
    7. Update the tiller-deployment to have the service account.\n\n```\n$student@lfs458-node-1oa0$\
    \ kubectl -n kube-system patch deployment \\\n    tiller-deployment -p '{\"spec\"\
    :{\"template\":{\"serviceAccount\":\"tiller\"}}\ndeployment.extensions/tiller-deployment\n\
    ```\n\n8. Verify the tiller pod is running. Examine the logs of the pod. Note\
    \ that each line of logs contains a tag of the component generating the messages,\
    \ such as [main], [storage], and [storage].\n\n```\n$student@lfs458-node-1oa0$\
    \ kubectl get pods --all-namespaces\n<output_omitted>\nkube-system tiller-deployment-84b97f465c-76lvs\
    \ 1/1 Running 0 30m\n```\n\n```\n$student@lfs458-node-1oa0$ kubectl -n kube-system\
    \ logs \\\n    tiller-deployment-84b97f465c-76lvs\n<output_omitted>\n```\n\n9.\
    \ View the available sub-charts for helm. As with Kubernetes tools, exploring\
    \ change.\n\n```\n$student@lfs458-node-1oa0$ helm help\n<output_omitted>\n```\n\
    \n10. View the current configuration files, archives and plugins for helm. Return\
    \ to this directory after you have worked with a Chart liner in the lab."
