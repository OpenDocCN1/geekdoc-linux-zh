    # APIs and Access


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_36_0.png)


    # 5.1 Labs


    # Exercise 5.1: Configuring TLS Access


    # Overview


    With the Kubernetes API, `kubectl` makes API calls for you. With the appropriate
    TLS keys you could run `curl` as well as a golang client. Calls to the `kube-apiserver`
    get or set a PodSpec, or desired state. If the request represents a new state
    the Kubernetes Control Plane will update the current state matches the specified
    state. Some ends may require requests. For example, to delete a ReplicaSet, you
    would first set the number of replicas to zero, then delete the ReplicaSet.


    An API request must pass information as JSON. `kubectl` converts `yaml` to JSON
    when making an API request on your behalf. The API request has many settings,
    but must include `apiVersion`, `kind` and `metadata`, and `spec` fields to declare
    what kind of container to deploy. The `spec` fields depend on the object being
    created.


    We will begin by configuring remote access to the `kube-apiserver` then explore
    more of the API.


    # Configuring TLS Access


    +   1. By reviewing the `kubectl` configuration file. We will use the three certificates
    and the API server address.


    2. We will set the certificates as variables. You may want to double-check each
    parameter as you set it. By beginning with the client-certificate-Data Key.


    ```

    student@lfs458-node-1a0a$: less "./kube/config

    <output_omitted>

    ```


    ```

    student@lfs458-node-1a0a$: export client-cert=$(grep client-cert ./kube/config
    -d " " -f 6)

    ```


    ```

    student@lfs458-node-1a0a$: echo $client

    LS0t1LSCR0udJ1TBRRVUZJQQOFURS0LS0tckIJ1UMAKkNDQWRxZ0F3SUJ

    ```'
