    \ po\nNAME READY STATUS RESTARTS AGE\nhog-i003763060-x3vn 1/1 Running 0 8s\n\n\
    $student@ifs458-node-1oa$: kubectl logs hog-i003763060-x3vn\n1 main.go:26] Allocated\
    \ \"0\" memory, in \"4Ki\" chunks, with a lm sleep \\\n    between allocations\n\
    0927 21:09:23.519464\n1 main.go:39] Spanning a thread to consume CPU\n0927 21:09:23.519491\n\
    1 main.go:39] Spanning a thread to consume CPU\n0927 21:09:23.519497\n1 main.go:29]\
    \ Allocated \"0\" memory\n```\n\n# Exercise 4.2: Resource Limits for a Namespace\n\
    \nThe previous steps list for that particular deployment. You can also set limits\
    \ on an entire namespace. We will create a new namespace and configure the deployment\
    \ to run. When set hog should not be able to use the provided amount of resources.\n\
    \n+   1. By creating a new namespace low-usage-limit and verify it exists.\n\n\
    ```\n$student@ifs458-node-1oa$: kubectl create namespace low-usage-limit\nnamespace/low-usage-limit\n\
    ```\n\n```\n$student@ifs458-node-1oa$: kubectl get namespace\nNAME STATUS AGE\n\
    default Active 1h\nkube-public Active 1h\nkube-system Active 1h\nlow-usage-limit\
    \ Active 42s\n```\n\n+   2. Create a YAML file that limits CPU and memory usage.\
    \ The kind used is LimitRange.\n\n```\napiVersion: v1\nkind: LimitRange\nmetadata:\n\
    \  name: low-resource-range\nspec:\n  limits:\n    default:\n      cpu: 1i\n \
    \     memory: 500Mi\n    defaultRequest:\n      cpu: 0.5\n      memory: 100Mi\n\
    \    type: Container\n```\n\n+   3. Create the LimitRange object and assign it\
    \ to the newly created namespace low-usage-limit\n\n```\n$student@ifs458-node-1oa$:\
    \ kubectl create -f low-resource-range.yaml \\\n    --namespace=low-usage-limit\n\
    limiterange/low-resource-range created\n```\n\n+   4. Remember that every command\
    \ needs a namespace and context to work. Defaults are not used if provided.\n\n\
