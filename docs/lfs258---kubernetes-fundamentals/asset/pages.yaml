- img_proc: true
  md: '(Note Linux distributions may require 400 instead of 440 for the permissions.)


    After you have done these steps, exit the root shell by typing exit and then try
    to do it la again.


    There are many other ways an administrator can configure sudo, including specifying
    only permissions for certain users, limiting searched paths etc. The /etc/sudoers
    file is very well-documented.


    However, there is one more setting we highly recommend you do, even if your system
    already has sudo configured. Most distributions establish a different path for
    finding executables for normal users as compared to root users. In particular
    the directories /sbin and /usr/bin are not searched, since inherits the PATH of
    the user, not the full root user.


    Thus, in this course we would have to be constantly reminding you of the full
    path to many system administration utilities; any enhancement to security is probably
    not worth the extra typing and figuring out which directories these programs are
    in. Consequently, we suggest you add the following line to the .bashrc file in
    your home directory:


    ```

    PATH=$PATH:/usr/sbin:/sbin

    ```


    If you log out and log in again (you don''t have to reboot) this will be fully
    effective.'
