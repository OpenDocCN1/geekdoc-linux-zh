  md: '# Chapter 11


    # Scheduling


    # 11.1 Labs


    # Exercise 11.1: Assign Pods Using Labels


    # Overview


    While allowing the system to distribute Pods on your behalf is typically the best
    route, you may want to determine which nodes a Pod will use. For example you may
    have particular hardware requirements to meet for the workload. You may want to
    assign VIP Pods to new, faster hardware and everyone else to older hardware.


    In this exercise we will use labels to schedule Pods to a particular node. Then
    we will explore taints to have more flexible deployment in a large environment.


    # Assign Pods Using Labels


    +   1. Begin by getting a list of the nodes. They should be in the ready state
    and without added labels or taints.


    ```

    student@lfs458-node-la0a:~$ kubectl get nodes

    NAME               STATUS   ROLES    AGE  VERSION

    lfs458-node-la0a  Ready    master   2d    v1.12.1

    lfs458-worker      Ready    <none>  2d    v1.12.1

    ```


    +   2. View the current labels and taints for the nodes.


    ```

    student@lfs458-node-la0a:~$ kubectl describe nodes | grep -i label

    Labels:             beta.kubernetes.io/arch=amd64

    Labels:             beta.kubernetes.io/arch=amd64

    student@lfs458-node-la0a:~$ kubectl describe nodes | grep -i taint

    Taints:             <none>

    Taints:             <none>

    ```


