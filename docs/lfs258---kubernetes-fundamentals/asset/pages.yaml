    ds-one-b1cdv 1/1 Running 0 2m

    ds-one-z31r 1/1 Running 0 2m

    ```


    3. Verify the image running inside the Pods. Use this information in the next
    section.


    ```

    student@lfs458-node-1a0a:~$ kubectl describe ds ds-one-b1cdv | grep Image:

    Image: nginx:1.7.9

    ```'
