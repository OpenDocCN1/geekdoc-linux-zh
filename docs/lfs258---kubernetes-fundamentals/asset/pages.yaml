  md: '# Chapter 2


    # Basics of Kubernetes


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_8_0.png)


    # 2.1 Labs


    # Exercise 2.1: View Online Resources


    # Visit kubernetes.io


    With such a fast changing project, it is important to keep track of updates. The
    main place to find documentation of the current version https://kubernetes.io/.


    +   1. Open a browser and visit the https://kubernetes.io/ website.

    2. In the upper right corner, use the drop down to visit the versions available.
    It will say something like v1.2.

    3. Select the top level link for Documentation. The links on the left of the page
    can be helpful in navigation.

    4. As time permits navigate around other sub-pages such as SETUP, CONCEPTS, and
    TASKS to become familiar with the layout.


    # Track Kubernetes Issues


    There are hundreds, perhaps thousands, working on Kubernetes every day. With that
    many people working in parallel there are good resources to see if others are
    experiencing a similar outage. The source code as well as feature and issue tracking
    are currently on github.com.


    +   1. To view the main page use your browser to visit https://github.com/kubernetes/kubernetes/

    2. Click on various sub-directories and visit the basic information available.

    3. Update your URL to point to https://github.com/kubernetes/kubernetes/issues.
    You should see a series of issues, feature requests, and support communication.'
