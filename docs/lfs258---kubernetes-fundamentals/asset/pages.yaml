  md: '# Chapter 1


    # Introduction


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_6_0.png)


    # 1.1 Labs


    # Exercise 1.1: Configuring the System for sudo


    It is very dangerous to run a root shell unless absolutely necessary: a single
    typo or other mistake can cause severe (even fatal) damage.


    The sensible procedure is to configure things such that single commands can be
    run with superuser privilege, by using the sudo mechanism. With sudo the user
    only needs to know their own password and never needs to know the root password.


    If you are using a distribution such as Ubuntu, you may not need to do this lab
    to get sudo configured properly for the course. However, you should make sure
    you understand the procedure.


    To check if your system is already configured to let the user account you are
    running sudo, just do a simple command like:


    ```

    $ sudo ls

    ```


    You should be prompted for your user password and then the command should execute.
    If instead, you will get an error message you need to execute the following procedure.


    Launch a root shell by typing su and then give the root password, not your user
    password.


    On all recent Linux you should navigate to the /etc/sudo.d subdirectory and create
    a file, usually with the name of the user to whom wishes to grant sudo access.
    However, this convention is not actually necessary as sudo will scan all files
    in this directory as needed. The file can simply contain:


    ```

    student ALL=(ALL) ALL

    ```


    if the user is student.


    An older practice (which certainly still works) is to add a line at the end of
    the file /etc/sudoers. It is best to do so using the visudo program, which is
    careful about sure you use the right syntax in your edit.


    You probably need to set proper permissions on the file by typing:


    ```

    $ chmod 440 /etc/sudoers.student

    ```'
  merge: -1
