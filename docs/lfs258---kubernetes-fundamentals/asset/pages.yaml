  md: '# Exercise 16.2: Authentication and Authorization


    Kubernetes clusters have types of user service accounts and normal users, but
    normal users are assumed to be managed by an external service. There are no objects
    to represent them and they can be added via an API call, service accounts can
    be added.


    We will use RBAC to configure actions within a namespace for a new contractor,
    Developer Dan will be working on a new project.


    +   1. Create two namespaces, one for production and the other development.


    ```

    ```

    student@fs458-node-ia0a~$ kubectl create ns development

    namespace "development" created


    student@fs458-node-ia0a~$ kubectl create ns production

    namespace "production" created

    ```

    ```


    +   2. View the cluster context. The context allows you to configure the cluster
    to use, namespace and user for kubectl commands in an easy manner.


    ```

    ```

    student@fs458-node-ia0a~$ kubectl config get-contexts

    CURRENT NAME CLUSTER AUTHFIN

    kubernetes@kubernetes kubernetes-admin

    ```

    ```


    +   3. Create a new user DevDan and assign a password of lfs458.


    ```

    ```

    student@fs458-node-ia0a~$ sudo useradd -s /bin/bash DevDan

    student@fs458-node-ia0a~$ sudo password DevDan

    Enter new UNIX password: lfs458

    Retype new UNIX password: lfs458

    password updated successfully

    ```

    ```


    +   4. Generate a private key then Certificate Signing Request (CSR) for DevDan.


    ```

    ```

    student@fs458-node-ia0a~$ openssl req -out DevDan.key \

    Generating RSA key, 2048 bits modulus

    ****

    ****

    e is 65537 (0x10001)

    ```

    ```


    ```

    ```

    student@fs458-node-ia0a~$ openssl req -key DevDan.key \

    -out DevDan.csr -subj "CN=DevDan/O=development"

    ```

    ```


    Using the newly created request generate a self-signed certificate using the x509
    protocol. Use the CA keys for the Kubernetes cluster and set 1 year expiration.
    You will need to access the inbound files.


    ```

    ```

    student@fs458-node-ia0a~$ openssl x509 -req -key DevDan.key \

    -CA /etc/kubernetes/pki/ca.crt \

    -CAkey /etc/kubernetes/pki/ca.key \

    -CAcreateserial \

    -days 365

    Signature ok

    subject=CN=DevDan/O=development

    Getting CA Private Key

    ```

    ```


    +   6. Update the access config to reference the new key and certificate. Normally
    we will need to make a safety directory home of a non-root user.


    ```

    ```

    student@fs458-node-ia0a~$ kubectl config set-credentials DevDan \

    --client-certificate=/home/student/DevDan.crt \

    --client-key=/home/student/DevDan.key

    User "DevDan" set.

    ```

    ```'
