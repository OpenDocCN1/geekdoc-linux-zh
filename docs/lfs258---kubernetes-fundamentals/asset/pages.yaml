  md: "# 6.1. LABS\n\n8. Pods also make use of included certificates to authenticate\
    \ the API. The certificates are automatically available to a pod under /var/run/secrets/kubernetes.io/serviceaccount/.\
    \ We deploy a Pod and view the resources. If you use the token file then it is\
    \ the same as the $token variable. The -i flag creates a terminal session of the\
    \ busybox container. Once the container will not restart and the pod will show\
    \ as:\n\n```\nstudent@lfs458-node-ia0a~$ kubectl run -i -t busybox --image=busybox\
    \ \\\n--restart=Never\n# ls /var/run/secrets/kubernetes.io/serviceaccount/\n#\
    \ namespace token\n# exit\n```\n\n# 6.2: Using the Proxy\n\nAnother way to interact\
    \ with the API is via a proxy. The proxy can be run from a node or within a Pod\
    \ through the use of a sidecar. In the following steps we will deploy a proxy\
    \ to the loopback address. We will use curl to access the API server. If the curl\
    \ request works, but does not outside the cluster, we have narrowed down the issue\
    \ to authentication and authorization issues after the API ingestion process.\n\
    \n+   1. Begin by starting the proxy. It will start in the foreground by default.\
    \ There are several options you can choose. Begin by reviewing the output.\n\n\
    ```\nstudent@lfs458-node-ia0a~$ kubectl proxy -b\nCreates a proxy server or application-gateway\
    \ between localhost\nand the also serving static content\nover specified HTTP\
    \ path. All incoming data enters through one port\\and gets forwarded to the remote\
    \ kubernetes API server port,\nfor the path matching the static path.\n```\n\n\
    ```\nExamples:\n# To proxy all of the kubernetes and nothing else, use:\n\n$ kubectl\
    \ proxy --api-prefix/\n<output_omitted>\n```\n\n+   2. Start the proxy setting\
    \ the API prefix, and put it in the background. You may need to enter to view\
    \ the prompt.\n\n```\nstudent@lfs458-node-ia0a~$ kubectl proxy --api-prefix=/\
    \ & \n[1] 22500\nStarting to serve on 127.0.0.1:8001\n```\n\n+   3. Now use the\
    \ curl command, but point toward the IP and port shown by the proxy. The output\
    \ should be the same as the other, but it may be differently formatted.\n\n```\n\
    student@lfs458-node-ia0a~$ curl http://127.0.0.1:8001/api/\n<output_omitted>\n\
    ```\n\n+   4. Make an API call to retrieve the namespaces. The command did not\
    \ work in the previous section due to permissions, but should work now the proxy\
    \ is making the request on your behalf.\n\n```\nstudent@lfs458-node-ia0a~$ curl\
    \ http://127.0.0.1:8001/api/v1/namespaces\n{\n  \"kind\": \"NamespaceList\",\n\
    \  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"selfLink\": \"/api/v1/namespaces\"\
    ,n    \"resourceVersion\": \"86902\"\n  },\n  <output_omitted>\n```\n\n# 6.3:\
    \ Working with Jobs\n\nWhile API objects are deployed that they can continue to\
    \ be available there are some which we might want to run a particular number of\
    \ times on a regular basis like CronJob"
