    # Exercise 15.1: Working with Helm and Charts


    # Overview


    helm allows for easy deployment of complex configurations. This could be handy
    for a vendor to deploy a multi-part application in a single step. Through the
    use of a Chart, or template file, the required components and their relationships
    are declared. Local agents like Tiller to create objects on your behalf. Effectively
    its orchestration for orchestration.


    There are few ways to install Helm. The newest version may require building from
    source code. We will download a recent, stable version. Once installed we will
    deploy a Chart, which will configure Hadoop on our cluster.


    # Install Helm


    +   1. On the master node use wget to download the compressed tar file. The short
    URL below is for: https://storage.googleapis.com/kubernetes-helm/helm-v2.7.0-linux-amd64.tar.gz


