    <output-committed>\n```\n\n## 6.1. LABS\n\n4. As the job continues to AGE in a\
    \ status state, delete the job.\n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl\
    \ delete jobs.batch sleepy\njob.batch \"sleepy\" deleted\n```\n\n5. Edit the YAML\
