    # Exercise 7.2: Working with DaemonSets


    A DaemonSet is a type of pod which ensures that every node in the cluster has
    a pod running on that node. A Deployment will only ensure that a particular number
    of pods are created, while several on a single node. Using a DaemonSet can be
    helpful for applications that run on each node, for things like monitoring and
    logging in large clusters where hardware might be swapped out. Should a node be
    removed from the DaemonSet would ensure the Pod are collected before removal.
    Starting with Kubernetes v1.12 scheduler handles DaemonSet deployment which means
    we can now configure nodes to have a particular DaemonSet pods.


    This extra step of alone can be useful for products like ceph where storage is
    added or removed, perhaps around a subset of nodes. They allow complex deployments
    when declared resources like memory, CPU or volumes.


    +   1. We begin by creating a file. In this case the kind will be DaemonSet. For
    ease of use we will copy the previously created rs.yaml file and make a couple
    edits. Remove the Replicas: 2 line.


    ```

    student@lfs458-node-1a0a:~$ cp rs.yaml ds.yaml

    ```


    ```

    student@lfs458-node-1a0a:~$ vim ds.yaml

    ...

    kind: DaemonSet


    name: ds-one


    replicas: 2 <<----Remove DaemonSet

    ...

    system: DaemonSet

    ```


    +   2. Create and verify the newly created DaemonSet. There should be one Pod
    per node in the cluster.


