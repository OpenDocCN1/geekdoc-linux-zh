- md: "\n## Create A Job\n\n1. Create a job which will run a container that sleeps\
    \ for three seconds then.\n\n```bash\nstudent@lfs458-node-1a0a~$ vim job.yaml\n\
    apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: sleepy\nspec:\n  template:\n\
    \    spec:\n      containers:\n      - name: resting\n        image: busybox\n\
    \        command: [\"/bin/sleep\"]\n        args: [\"3\"]\n      restartPolicy:\
    \ Never\n```\n\n2. Create the job, then verify the details. The example checks\
    \ showing the job takes three seconds in then again after it has completed. You\
    \ may see different output depending on how fast you type.\n\n```\nstudent@lfs458-node-1a0a~$\
    \ kubectl create -f job.yaml\njob.batch/sleepy created\n```\n\n```\nstudent@lfs458-node-1a0a~$\
    \ kubectl get job\nNAMECOMPLETIONS DURATION AGE\nsleepy 0/1           3s     \
    \      3s\n```\n\n```\nstudent@lfs458-node-1a0a~$ kubectl describe job.sleepy\n\
    Name:\n  sleepy\nNamespace:\n  default\nSelector:\n  controller-id=c2c49125-d0fb-11e8-947a-4210a80002\n\
    Labels:\n  controller-id=c2c49125-d0fb-11e8-947a-4210a80002\n  job-name=sleepy\n\
    Annotations:\n  <none>\nParallelism:\n  1\nCompletions:\n  1\nStart Time:\n  Tue,\
    \ 16 Oct 2018 04:22:50 +0000\nCompleted At:\n  Tue, 16 Oct 2018 04:22:55 +0000\n\
    Duration:\n  5s\nPods Status: 0 Running / 1 Succeeded / 0 Failed\n<output-committed>\n\
    ```\n\n```\nstudent@lfs458-node-1a0a~$ kubectl get jobs\nNAMECOMPLETIONS DURATION\
    \ AGE\nsleepy 1/1           5s           17s\n```\n\n3. View the configuration\
    \ of the job. There are three parameters we can use to affect how the job runs.\
    \ Use --yaml to see these parameters. We can see backoffLimit, completions, and\
    \ parallelism. We'll add all parameters next.\n\n```\nstudent@lfs458-node-1a0a~$\
    \ kubectl get jobs.batch.sleepy -o yaml\n<output-committed>\nuid: c2c3a80d-d0fc-11e8-947a-4210a8000200\n\
