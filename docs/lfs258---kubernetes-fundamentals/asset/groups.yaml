    \ created\nservice \"traefik-ingress-service\" created\n```\n\n9. Now that we\
    \ are a new controller which we need to pass some rules, it knows how to handle\
    \ requests. Note that the host is mentioned in example.com, which is probably\
    \ not our name. We will pass a header when when testing. Also the service name\
    \ needs to match the secondapp label which we find in an early step.\n\n```\n\
    student@lfs458-node-la0a:~$ vim ingress.rule.yaml\napiVersion: extensions/v1\n\
    kind: Ingress\nmetadata:\n  name: ingress-test\n  annotations:\n    kubernetes.io/ingress.class:\
    \ traefik\nspec:\n  rules:\n    - host: www.example.com\n      http:\n       \
    \ paths:\n        - backend:\n            serviceName: secondapp\n           \
    \ servicePort: 80\n          path: /\n```\n\n10. Now ingest the rule into the\
    \ cluster.\n\n```\nstudent@lfs458-node-la0a:~$ kubectl create -f ingress.rule.yaml\n\
    ingress.extensions \"ingress-test\" created\n```\n\n11. We should be able to find\
