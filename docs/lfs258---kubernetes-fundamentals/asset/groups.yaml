    12. 如果要修改你的节点，请使用 `node drain` 来驱逐 pod。某些资源可能无法驱逐，除了一个不会影响后续操作的错误。请注意，错误信息包含了
    `abort` 命令，说明 `drain` 未执行。在节点检查它，运行的容器数量将相同，但会显示一个新的污点（taint），阻止调度器分配新的 pod。


