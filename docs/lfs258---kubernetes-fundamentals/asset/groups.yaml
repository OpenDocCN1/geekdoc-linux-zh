  - "[PAGE 98]\n\n# # Chapter 13\n\n# # Custom Resource Definition\n\n# ## 13.1 Labs\n\
    \n# ### Exercise 13.1: Create a Custom Resource Definition\n\n# ## Overview\n\n\
    ThirdPartyResource is no longer included with the API in v1.8 and its use will\
    \ return a validation error. If you have upgraded from a previous version to Kubernetes\
    \ v1.7, you will need to convert them to CustomResources (CRD). A new resource\
    \ often requires a controller to manage it. Creation of the controller is beyond\
    \ the scope of this course, basically it is a watch-loop comparing a spec file\
    \ to the current state and making changes until the state matches. A good discussion\
    \ of creating a controller can be found here: https://coreos.com/blog/introducing-operators.html.\n\
    \n# ## Create a Custom Resource Definition\n\nWe will make a simple CRD, but without\
    \ any particular action. It will be enough to find the object ingested into the\
    \ API and responding to commands.\n\n+   1. We create a new YAML file.\n\n```\n\
    student@lfs45-node-la0a:~$ vim crd.yaml\n```\n\n```\napiVersion: apiextensions.k8s.io/v1beta1\n\
    kind: CustomResourceDefinition\nmetadata:\nmetadata:\n  name: crontabs.training.lfs45.com\n\
    \  # This name must match names below.\n  # <plural>.<group> syntax\nspec:\n \
    \ scope: Cluster #Could also be Namespaced\n  group: training.lfs45.com\n```"
  - "[PAGE 99]\n\n# CHAPTER 13. CUSTOM RESOURCE DEFINITION\n\n```\nversion: v1\nnames:\n\
    \  kind: CronTab          #Typically CamelCased for resource manifest\n  plural:\
    \ crontabs      #Shown in URL\n  singular: crontab     #Short name for CLI alias\n\
    \  shortNames:\n    - ct               #CLI short name\n```\n\n2. Add the new\
    \ resource to the cluster.\n\n```\nstudent@lfs458-node-1ia0a$ kubectl create -f\
    \ crd.yaml\ncustomresourcedefinition.apiextensions8s.io/crontabs.training.lfs458.com\n\
    created\n```\n\n3. View and describe the resource. The `describe` output is unlike\
    \ other objects we have seen so far.\n\n```\nstudent@lfs458-node-1ia0a$ kubectl\
    \ get crd\nNAME                                            CREATED\ncrontabs.training.lfs458.com\
    \   2018-08-03T05:25:20Z\n```\n\n```\nstudent@lfs458-node-1ia0a$ kubectl describe\
    \ crd crontab<Tab>\nName:              crontabs.training.lfs458.com\nNamespace:\n\
    Labels:            <none>\nAnnotations:       <none>\nAPI Version:       apiextensions.k8s.io/v1\n\
    Kind:               CustomResourceDefinition\n<output_omitted>\n```\n\n4. Now\
    \ that we have an API resource we can create a new type of object. In this case\
    \ it will be a crontab-like image, which does not yet exist, but is used for demonstration.\n\
    \n```\napiVersion: \"training.lfs458.com/v1\"\n  # This is from the group and\
    \ version of new CRD\nkind: CronTab\n  # The kind from the new CRD\nmetadata:\n\
    \  name: new-cron-object\nspec:\n  cronSpec: \"*/5 * * *\"\n  image: some-cron-image\n\
    \  # Does not exist\n```\n\n5. Create the new object and the resource using short\
    \ and long name.\n\n```\nstudent@lfs458-node-1ia0a$ kubectl create -f new-crontab.yaml\n\
    crontab.training.lfs458.com/new-cron-object created\n```\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl get CronTab\nNAME             AGE\nnew-cron-object   22s\n```\n\n```\n\
