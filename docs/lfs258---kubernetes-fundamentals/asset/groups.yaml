    \n## 7.1 实验\n\n### 练习 7.1：使用 ReplicaSets\n\n### 概述\n\n理解和管理容器的状态是 Kubernetes 的核心任务。在本次实验中，我们将首先探索用于管理容器组的\
    \ API 对象。随着 Kubernetes 的成熟，可用对象发生了变化，因此使用的版本将决定哪些对象可用。我们的第一个对象是 ReplicaSet，它不包含\
    \ Deployment 中那些较新的管理功能。Deployment 会替你管理 ReplicaSets。我们还将与另一个名为 DaemonSet 的对象一起，它可以确保在新添加的节点上运行一个容器。\n\
    \n然后，我们将更新容器中的软件，查看修订历史，并回滚到之前的版本。\n\n### 使用 ReplicaSets\n\nReplicaSet 是复制控制器（Replication\
    \ Controller）的下一代产品，其区别仅在于支持的选择器（selectors）。现在使用 ReplicaSet 的唯一理由是你不需要更新容器软件，或者你需要典型流程无法处理的更新编排。\n\
    \n- 1. 查看你当前的 ReplicaSets。如果你在之前的实验结束时删除了资源，在默认命名空间中应该没有任何报告。\n\n- 2. 为简单的 ReplicaSet\
    \ 创建一个 YAML 文件。`apiVersion` 取决于你使用的 Kubernetes 版本。1.8 及更高版本将使用 apps/beta1，然后可能是现在的\
    \ apps/beta2，然后可能是稳定的 apps/v1。我们将使用较旧版本的 nginx，然后在实验稍后将其更新到新版本。\n\n```\nstudent@lfs458-node-1a0a~$\
    \ kubectl get rs\nNo resources found.\n```\n\n```\nstudent@lfs458-node-1a0a~$\
    \ kubectl apply -f yaml\n```\n\n```yaml\napiVersion: extensions/v1beta1\nkind:\
    \ ReplicaSet\nmetadata:\n  name: rs-one\nspec:\n  replicas: 2\n  template:\n \
    \   metadata:\n      labels:\n        system: ReplicaOne\n    spec:\n      containers:\n\
    \      - name: nginx\n        image: nginx:1.7.9\n        ports:\n        - containerPort:\
    \ 80\n```\n\n- 3. 创建 ReplicaSet：\n\n```\nstudent@lfs458-node-104a:~$ kubectl create\
    \ -f rs.yaml\nreplicaset.extensions/rs-one created\n```\n\n- 4. 查看新的 ReplicaSet：\n\
    \n```\nstudent@lfs458-node-104a:~$ kubectl describe rs rs-one\nName:\n  rs-one\n\
    Namespace:\n  default\nSelector:\n  system=ReplicaOne\nLabels:\n  system=ReplicaOne\n\
    Annotations:\n  <>\nReplicas:\n  2 / 2 desired\nPods Status:\n  2 Running / 0\
    \ Waiting / 0 Failed\nPod Template:\n  Labels:\n    system=ReplicaOne\n  Containers:\n\
    \  nginx:\n    Image:\n      nginx:1.7.9\n    Port:\n      80/TCP\n    Environment:\n\
    \      <>\n    Mounts:\n      <>\n  Volumes:\n      <>\nEvents:\n  <>\n```\n\n\
    - 5. 查看 ReplicaSet。从 yaml 文件来看应该有两个 Pod。你可能会看到一个 Completed byyesha，它会被清理。\n\n\
    ```\nstudent@lfs458-node-104a:~$ kubectl get pods\nNAME             READY   STATUS\
    \    AGE\nrs-one-2p99x      1/1     Running   5s\nrs-one-3c6pb      1/1     Running\
    \   5s\n```\n\n- 6. 现在我们删除 ReplicaSet，但不删除 Pod。\n\n```\nstudent@lfs458-node-104a:~$\
    \ kubectl delete rs rs-one --cascade=false\nreplicaset.extensions \"rs-one\" deleted\n\
    ```\n\n查看 ReplicaSet 和 Pods：\n\n```\nstudent@lfs458-node-104a:~$ kubectl describe\
    \ rs rs-one\nError from server (NotFound): replicasets.extensions \"rs-one\" not\
    \ found\n```\n\n```\nstudent@lfs458-node-104a:~$ kubectl get pods\n```\n\n###\
    \ 7.1. 实验\n\n| NAME | STATUS | RESTARTS | AGE |\n| :--- | :--- | :--- | :--- |\n\
    | rs-one-2p9x4 | 1/1 Running | 0 | 7m |\n| rs-one-3c6pb | 1/1 Running | 0 | 7m\
    \ |\n\n- 8. 创建 ReplicaSet，只要我们不更改选择器字段，新的 ReplicaSet 应该获得所有权。Pod 软件无法通过这种方式更新。\n\
    \n```\nstudent@lfs458-node-ia0a:~$ kubectl create -f rs.yaml\nreplicaset.extensions/rs-one\
    \ created\n```\n\n- 9. 查看 ReplicaSet 和 Pods 的年龄：\n\n```\nstudent@lfs458-node-ia0a:~$\
    \ kubectl get rs\nNAME DESIRED CURRENT READY AGE\nrs-one 2 2 4s\n```\n\n```\n\
    student@lfs458-node-ia0a:~$ kubectl get pods\nNAME READY STATUS RESTARTS AGE\n\
    rs-one-2p9x4 1/1 Running 0 8m\nrs-one-3c6pb 1/1 Running 0 8m\n```\n\n- 10. 我们将从其\
    \ ReplicaSet 中添加一个 Pod。首先给 Pod 标记标签。我们将 system-parameter 修改为 IsolatedPod。\n\n\
    ```\nstudent@lfs458-node-ia0a:~$ kubectl edit pod rs-one-3c6pb\n...\nlabels:\n\
    \  system: IsolatedPod # Change from ReplicaOne\n  name: rs-one-3c6pb\n...\n```\n\
    \n- 11. 查看 ReplicaSet 中 pod 的数量。你应该看到两个正在运行。\n\n```\nstudent@lfs458-node-ia0a:~$\
    \ kubectl get rs\nNAME DESIRED CURRENT READY AGE\nrs-one 2 2 4m\n```\n\n- 12.\
