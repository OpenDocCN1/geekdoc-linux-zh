- md: "\n# List of Figures\n\n- 3.1 External Access via Browser ............................................................................................\
    \ 18\n\n## Chapter 1\n## Introduction\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_6_0.png)\n\
    \n## 1.1 Labs\n\n### Exercise 1.1: Configuring the System for sudo\n\nIt is very\
    \ dangerous to run a root shell unless absolutely necessary: a single typo or\
    \ other mistake can cause severe (even fatal) damage.\n\nThe sensible procedure\
    \ is to configure things such that single commands can be run with superuser privilege,\
    \ by using the sudo mechanism. With sudo the user only needs to know their own\
    \ password and never needs to know the root password.\n\nIf you are using a distribution\
    \ such as Ubuntu, you may not need to do this lab to get sudo configured properly\
    \ for the course. However, you should make sure you understand the procedure.\n\
    \nTo check if your system is already configured to let the user account you are\
    \ running sudo, just do a simple command like:\n\n```\n$ sudo ls\n```\n\nYou should\
    \ be prompted for your user password and then the command should execute. If instead,\
    \ you will get an error message you need to execute the following procedure.\n\
    \nLaunch a root shell by typing su and then give the root password, not your user\
    \ password.\n\nOn all recent Linux you should navigate to the /etc/sudo.d subdirectory\
    \ and create a file, usually with the name of the user to whom wishes to grant\
    \ sudo access. However, this convention is not actually necessary as sudo will\
    \ scan all files in this directory as needed. The file can simply contain:\n\n\
    ```\nstudent ALL=(ALL) ALL\n```\n\nif the user is student.\n\nAn older practice\
    \ (which certainly still works) is to add a line at the end of the file /etc/sudoers.\
    \ It is best to do so using the visudo program, which is careful about sure you\
    \ use the right syntax in your edit.\n\nYou probably need to set proper permissions\
    \ on the file by typing:\n\n```\n$ chmod 440 /etc/sudoers.student\n```\n\n(Note\
    \ Linux distributions may require 400 instead of 440 for the permissions.)\n\n\
    After you have done these steps, exit the root shell by typing exit and then try\
    \ to do it again.\n\nThere are many other ways an administrator can configure\
    \ sudo, including specifying only permissions for certain users, limiting searched\
    \ paths etc. The /etc/sudoers file is very well-documented.\n\nHowever, there\
    \ is one more setting we highly recommend you do, even if your system already\
    \ has sudo configured. Most distributions establish a different path for finding\
    \ executables for normal users as compared to root users. In particular the directories\
    \ /sbin and /usr/bin are not searched, since it inherits the PATH of the user,\
    \ not the full root user.\n\nThus, in this course we would have to be constantly\
    \ reminding you of the full path to many system administration utilities; any\
    \ enhancement to security is probably not worth the extra typing and figuring\
    \ out which directories these programs are in. Consequently, we suggest you add\
    \ the following line to the .bashrc file in your home directory:\n\n```\nPATH=$PATH:/usr/sbin:/sbin\n\
    ```\n\nIf you log out and log in again (you don't have to reboot) this will be\
    \ fully effective.\n\n## Chapter 2\n## Basics of Kubernetes\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_8_0.png)\n\
    \n## 2.1 Labs\n\n### Exercise 2.1: View Online Resources\n\n### Visit kubernetes.io\n\
    \nWith such a fast changing project, it is important to keep track of updates.\
    \ The main place to find documentation of the current version https://kubernetes.io/.\n\
    \n- 1. Open a browser and visit the https://kubernetes.io/ website.\n2. In the\
    \ upper right corner, use the drop down to visit the versions available. It will\
    \ say something like v1.2.\n3. Select the top level link for Documentation. The\
    \ links on the left of the page can be helpful in navigation.\n4. As time permits\
    \ navigate around other sub-pages such as SETUP, CONCEPTS, and TASKS to become\
    \ familiar with the layout.\n\n### Track Kubernetes Issues\n\nThere are hundreds,\
    \ perhaps thousands, working on Kubernetes every day. With that many people working\
    \ in parallel there are good resources to see if others are experiencing a similar\
    \ outage. The source code as well as feature and issue tracking are currently\
    \ on github.com.\n\n- 1. To view the main page use your browser to visit https://github.com/kubernetes/kubernetes/\n\
    2. Click on various sub-directories and visit the basic information available.\n\
    3. Update your URL to point to https://github.com/kubernetes/kubernetes/issues.\
    \ You should see a series of issues, feature requests, and support communication.\n\
    - 4. In the search box you probably see some existing text like `is:issue is:open`\
    \ which allows you to filter on the kind of information you would like to see.\
    \ Append the search string to read: `-is:issue is:open label:kind/bug` then press\
    \ enter.\n\n- 5. You should now see bugs in descending date order. Across the\
    \ top of the issues a menu area allows you to view entries by author, labels,\
    \ projects, milestones, assignee as well. Take a moment to view the various other\
    \ selection criteria.\n\n- 6. Some times you may want to exclude a kind of output.\
    \ Update the URL again, but precede the label with a minus sign, like: `-is:issue\
    \ is:open -label:kind/bug`. Now you see everything except bug reports.\n\n- 7.\
    \ Explore the page with the remaining time left.\n\n## Chapter 3\n## Installation\
    \ and Configuration\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_10_0.png)\n\n\
    ## 3.1 Labs\n\n### Exercise 3.1: Install Kubernetes\n\n### Overview\n\nThere are\
    \ several Kubernetes installation tools provided by various vendors. In this lab\
    \ we will learn to use kubeadm. As a community-supported independent tool, it\
    \ is planned to become the primary method to build a Kubernetes cluster.\n\nThe\
    \ labs were written using Ubuntu instances running on Google Cloud Platform (GCP).\
    \ They have been written to be vendor-agnostic so could run on AWS, local hardware,\
    \ or inside of virtualization to give you the most flexibility and options. Each\
    \ platform has different access methods and considerations. As of v1.12.1 the\
    \ minimum (in as barely as possible) size for VirtualBox is 2vCPU/1G memory minimal\
    \ OS for master and 1vCPU/1G memory minimal OS for worker node.\n\nIf you are\
    \ own equipment you will need to disable swap on. There may be other requirements\
    \ which will be shown as warnings or errors when using the kubeadm command. Most\
    \ commands run as a regular user, there are some which require root privilege.\
    \ For example please use sudo access as shown with AWS you will need to use an\
    \ SSH client such as a local terminal or PuTTY if not using Linux or a Mac. You\
    \ can download PuTTY from www.putty.org. You would also require a pem or ppp file\
    \ to access the nodes. Each cloud provider will have a process to download or\
    \ create this file. Attending in-person instructor trained the file will be made\
    \ available during class.\n\nIn this exercise we will install Kubernetes on a\
    \ single node then grow the cluster, adding more compute resources. Both nodes\
    \ use the same size, providing 2 vCPUs and 5g of memory. Smaller nodes could be\
    \ used, but would run slower.\n\nVarious exercises will use YAML files, which\
    \ are included in the text. You are encouraged to write the files when possible,\
    \ as the syntax of YAML has white space indentation requirements that are important\
    \ to learn. An important note, do not use in your YAML files, white space only.\
    \ Indentation.\n\nIf you use a PDF of copy and paste after does not pass the single\
    \ quote correctly? It pastes as a back-quote instead. You will need to modify\
    \ it by hand.\n\nIf you use a PDF of copy and paste...\n\n## CHAPTER 3. INSTALLATION\
    \ AND CONFIGURATION\n\nThe authentication of '35.226.100.87' can't be established.\n\
    ECDSA key fingerprint is SHA256:IZfnbk3YW/qAcXrCDgguWbXC9Ymfk2Wo1e.\nECDSA key\
    \ fingerprint is MD5: dc8:4b:b0:d2:93:c5:08:4a:74:fb:e1:9f.\nThe authenticity\
