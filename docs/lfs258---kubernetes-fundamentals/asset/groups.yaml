    # Chapter 7


    # Managing State With Deployments


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_50_0.png)


    # 7.1 Labs


    # Exercise 7.1: Working with ReplicaSets


    # Overview


    Understanding and managing the state of containers is a core Kubernetes task.
    In this lab we will first explore the API objects used to manage groups of containers.
    The objects available have changed as Kubernetes has matured, so the version in
    use will determine which are available. Our first object will be a ReplicaSet,
    which does not include newer management features with Deployments. A Deployment
    will manage ReplicaSets for you. We will also work with another object called
    a DaemonSet which ensures a container is running on newly added node.


    Then we will update the software in a container, view the revision history, and
    roll-back to a previous version.


    # Working with ReplicaSets


    A ReplicaSet is a next-generation of a Replication Controller, which differs only
    in the selectors supported. The only reason to use a ReplicaSet anymore is if
    you have no need for updating container software or require update orchestration
