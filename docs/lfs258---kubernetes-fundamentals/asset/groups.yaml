- md: "\n# Chapter 7\n\n## Managing State With Deployments\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_50_0.png)\n\
    \n## 7.1 Labs\n\n### Exercise 7.1: Working with ReplicaSets\n\n### Overview\n\n\
    Understanding and managing the state of containers is a core Kubernetes task.\
    \ In this lab we will first explore the API objects used to manage groups of containers.\
    \ The objects available have changed as Kubernetes has matured, so the version\
    \ in use will determine which are available. Our first object will be a ReplicaSet,\
    \ which does not include newer management features with Deployments. A Deployment\
    \ will manage ReplicaSets for you. We will also work with another object called\
    \ a DaemonSet which ensures a container is running on newly added node.\n\nThen\
    \ we will update the software in a container, view the revision history, and roll-back\
    \ to a previous version.\n\n### Working with ReplicaSets\n\nA ReplicaSet is a\
    \ next-generation of a Replication Controller, which differs only in the selectors\
    \ supported. The only reason to use a ReplicaSet anymore is if you have no need\
    \ for updating container software or require update orchestration which won't\
    \ work with the typical process.\n\n- 1. View your current ReplicaSets. If you\
    \ deleted resources at the end of a previous lab, you should have none reported\
    \ in the default namespace.\n\n- 2. Create a YAML file for a simple ReplicaSet.\
    \ The apiVersion depends on the version of Kubernetes you are using. Versions\
    \ 1.8 and beyond will use apps/beta1, then perhaps todays apps/beta2 and then\
    \ probably a stable apps/v1. We will use an older version of nginx then update\
    \ to a newer later in the exercise.\n\n```\nstudent@lfs458-node-1a0a~$ kubectl\
    \ get rs\nNo resources found.\n```\n\n```\nstudent@lfs458-node-1a0a~$ kubectl\
    \ apply -f yaml\n```\n\n```yaml\napiVersion: extensions/v1beta1\nkind: ReplicaSet\n\
    metadata:\n  name: rs-one\nspec:\n  replicas: 2\n  template:\n    metadata:\n\
    \      labels:\n        system: ReplicaOne\n    spec:\n      containers:\n   \
    \   - name: nginx\n        image: nginx:1.7.9\n        ports:\n        - containerPort:\
    \ 80\n```\n\n- 3. Create the ReplicaSet:\n\n```\nstudent@lfs458-node-104a:~$ kubectl\
    \ create -f rs.yaml\nreplicaset.extensions/rs-one created\n```\n\n- 4. View the\
    \ new ReplicaSet:\n\n```\nstudent@lfs458-node-104a:~$ kubectl describe rs rs-one\n\
    Name:\n  rs-one\nNamespace:\n  default\nSelector:\n  system=ReplicaOne\nLabels:\n\
    \  system=ReplicaOne\nAnnotations:\n  <>\nReplicas:\n  2 / 2 desired\nPods Status:\n\
    \  2 Running / 0 Waiting / 0 Failed\nPod Template:\n  Labels:\n    system=ReplicaOne\n\
    \  Containers:\n  nginx:\n    Image:\n      nginx:1.7.9\n    Port:\n      80/TCP\n\
    \    Environment:\n      <>\n    Mounts:\n      <>\n  Volumes:\n      <>\nEvents:\n\
    \  <>\n```\n\n- 5. View the ReplicaSet. From the yaml file there should be two\
    \ Pods. You may see a Completed byyesha which will be cleared out.\n\n```\nstudent@lfs458-node-104a:~$\
    \ kubectl get pods\nNAME             READY   STATUS    AGE\nrs-one-2p99x     \
    \ 1/1     Running   5s\nrs-one-3c6pb      1/1     Running   5s\n```\n\n- 6. Now\
    \ we delete the ReplicaSet, but not the Pods.\n\n```\nstudent@lfs458-node-104a:~$\
    \ kubectl delete rs rs-one --cascade=false\nreplicaset.extensions \"rs-one\" deleted\n\
    ```\n\nView the ReplicaSet and Pods:\n\n```\nstudent@lfs458-node-104a:~$ kubectl\
    \ describe rs rs-one\nError from server (NotFound): replicasets.extensions \"\
    rs-one\" not found\n```\n\n```\nstudent@lfs458-node-104a:~$ kubectl get pods\n\
    ```\n\n### 7.1. LABS\n\n| NAME | STATUS | RESTARTS | AGE |\n| :--- | :--- | :---\
    \ | :--- |\n| rs-one-2p9x4 | 1/1 Running | 0 | 7m |\n| rs-one-3c6pb | 1/1 Running\
    \ | 0 | 7m |\n\n- 8. Create the ReplicaSet as long as we do not change the selector\
    \ field, the new ReplicaSet should take ownership. Pod software cannot be updated\
    \ via this.\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl create -f rs.yaml\nreplicaset.extensions/rs-one\
    \ created\n```\n\n- 9. View the age of the ReplicaSet and the Pods:\n\n```\nstudent@lfs458-node-ia0a:~$\
    \ kubectl get rs\nNAME DESIRED CURRENT READY AGE\nrs-one 2 2 4s\n```\n\n```\n\
    student@lfs458-node-ia0a:~$ kubectl get pods\nNAME READY STATUS RESTARTS AGE\n\
    rs-one-2p9x4 1/1 Running 0 8m\nrs-one-3c6pb 1/1 Running 0 8m\n```\n\n- 10. We\
    \ will add a Pod from its ReplicaSet. Begin by labeling the of a Pod. We will\
    \ change the system-parameter to IsolatedPod.\n\n```\nstudent@lfs458-node-ia0a:~$\
    \ kubectl edit pod rs-one-3c6pb\n...\nlabels:\n  system: IsolatedPod # Change\
    \ from ReplicaOne\n  name: rs-one-3c6pb\n...\n```\n\n- 11. View the number of\
    \ pods in the ReplicaSet. You should see two running.\n\n```\nstudent@lfs458-node-ia0a:~$\
    \ kubectl get rs\nNAME DESIRED CURRENT READY AGE\nrs-one 2 2 4m\n```\n\n- 12.\
    \ View the pods with the label key of system. You should note that there are three,\
    \ one being newer than others. The ReplicaSet made to replace yours, replacing\
    \ the Pod that we created.\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl get pod\
    \ -L system\nNAME READY STATUS RESTARTS AGE SYSTEM\nrs-one-3c6pb 1/1 Running 0\
    \ 10m IsolatedPod\nrs-one-2p9x4 1/1 Running 0 10m ReplicaOne\nrs-one-dq5xd 1/1\
    \ Running 0 30s ReplicaOne\n```\n\n- 13. Delete the ReplicaSet, then any remaining\
    \ pods.\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl delete rs rs-one\nreplicaset.extensions/rs-one\"\
    \ deleted\n\nstudent@lfs458-node-ia0a:~$ kubectl get pods\nNAME READY STATUS RESTARTS\
    \ AGE\nrs-one-3c6pb 1/1 Running 0 14m\nrs-one-dq5xd 0/1 Terminating 0 4m\n```\n\
    \n- 14. In the above example the Pods not finished termination. Wait for a bit\
    \ and check again. There should be no ReplicaSets, but one pod.\n\n```\nstudent@lfs458-node-1a0a:~$\
    \ kubectl get rs\nNo resources found.\n\nstudent@lfs458-node-1a0a:~$ kubectl delete\
    \ po\nNAME READY STATUS RESTARTS AGE\nrs-one-3c6b 1/1 Running 0 16m\n```\n\n-\
    \ 15. Delete the Pod using the label.\n\n```\nstudent@lfs458-node-1a0a:~$ kubectl\
    \ delete po -l system=IsolatedPod\npod \"rs-one-3c6b\" deleted\n```\n\n### Exercise\
    \ 7.2: Working with DaemonSets\n\nA DaemonSet is a type of pod which ensures that\
    \ every node in the cluster has a pod running on that node. A Deployment will\
    \ only ensure that a particular number of pods are created, while several on a\
    \ single node. Using a DaemonSet can be helpful for applications.\n\nThen we will\
    \ update the software in a container, view the revision history, and roll-back\
    \ to a previous version. (Note: This text seems repeated or fragmented in the\
    \ OCR source).\n\n### Exercise 7.3: Rolling Updates and Rollbacks\n\nOne of the\
    \ advantages of DaemonSets is the ability to replace and upgrade container.\n\n\
    - 1. By viewing the current updateStrategy for the DaemonSet.\n\n```\nkubectl\
    \ get ds -A 1 Strategy\nupdateStrategy:\n  type: OnDelete\n```\n\n- 2. Update\
    \ the DaemonSet to use a new version of nginx. This time use the set command instead\
    \ of edit.\n\n```bash\nkubectl set image ds-one nginx:1.8.alpine\ndaemonset.extensions/ds-one\
    \ updated\n```\n\n- 3. Verify that the Image for the Pod is unchanged.\n\n```bash\n\
    kubectl describe ds-one-b1cdv | grep Image:\nImage:1.7.9\n```\n\n- 4. Delete the\
    \ Pod. Wait until the replacement Pod is running and check the version.\n\n```\n\
    kubectl delete pod ds-one-b1cdv pod \"ds-one-b1cdv\" deleted\n```\n\n```\nkubectl\
    \ get pod\nNAME READY STATUS RESTARTS AGE\ns-one-xc86b  1/1 Running   0      19s\n\
    s-one-z31r4  1/1 Running   0      4m8s\n```\n\n- 5. View the image on the old\
    \ Pod. It should show version 1.7.9.\n\n```bash\nkubectl describe ds-one-z31r4\
    \ | grep Image:\nImage:1.7.9\n```\n\n- 6. View the history of the DaemonSet. You\
    \ will see two revisions. The number of revisions is kept in the DaemonSet with\
    \ v.12.1 the history has increased to two, by default.\n\n```\nkubectl rollout\
    \ history ds-one\ndaemonsets \"ds-one\"\nCHANGE-CAUSE\n1    <none>\n2    <none>\n\
    ```\n\n- 7. View the settings for the different versions of the DaemonSet. Image\
    \ should be the only difference between the two outputs.\n\n```\nkubectl rollout\
    \ history ds-one --revision=1\ndaemonsets \"ds-one\" with revision #1\nPod Template:\n\
    Labels:\n  system=DaemonSetOne\nContainers:\n nginx:\n  Image: nginx:1.7.9\n \
    \ Port: 80/TCP\n```\n"
