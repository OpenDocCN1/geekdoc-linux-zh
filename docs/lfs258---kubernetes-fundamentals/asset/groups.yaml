    11. 为了进行维护，我们需要将容器从某个节点移走并防止新容器部署。实现此点的方法之一是 `drain`（驱逐）或 `cordon`（隔离）。目前不会影响
    DaemonSets，我们将在未来详细讨论。通过获取节点列表，你的节点名称将有所不同。


    ```bash

