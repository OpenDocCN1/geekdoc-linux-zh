    \n```nginx-service.yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: nginx-service\n\
    spec:\n  selector:\n    app: nginx\n  ports:\n    - protocol: TCP\n      port:\
    \ 80\n      targetPort: 80\n  type: ClusterIP\n```\n\nCreate the service:\n\n\
