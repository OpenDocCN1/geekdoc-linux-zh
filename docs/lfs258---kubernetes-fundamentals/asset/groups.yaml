    # Chapter 12

    # Logging and Troubleshooting


    ## 12.1 Labs


    ### Exercise 12.1: Review Log File Locations


    ### Overview


    In addition to various logs files and command output, you can use `journalctl`
    to view logs from the node perspective. We will view common locations of log files,
    then a command to view container logs. There are other logging options, such as
    the use of a `sidecar` container dedicated to loading the logs of another container
    in a pod.


    Whole cluster logging is not yet available with Kubernetes. Outside software is
    typically used, such as `Fluentd`, part of `https://fluentd.org/`, which is another
    member project of `CNCF`, like Kubernetes.


    ## Review Log File Locations


    Take a quick look at the following log files and web sites. As server processes
    move from node level to running in containers the logging also moves.


    1. If using a `systemd` based Kubernetes cluster to view the node levels for `kubelet`,
    the local Kubernetes agent. Each node will have different contents as this is
    node specific.

    ```bash

    student@ifs468-node-1ao0$: journalctl -u kubectl | less

    <output_omitted>

    ```

    2. Major Kubernetes processes now run in containers. You can view them from the
    container or the node perspective. Use the `find` command to locate the `kube-apiserver`
    log. Your output will be different, but will be very long. Once you locate the
    files using the `diff` utility to compare them. There should be no difference,
    as they are symbolic links to `/var/log/pods/`. If you follow the links the log
    files are unique.


    ```

    $student8if458-node-10a$: sudo less -f /var/log/containers/kube-apiserver-u16-12-1dc3b8-system-kube-apiserver-edoa7079382cd32c5f48b4619265d1d4b52603d4a.log

    /var/log/containers/kube-apiserver-u16-12-1dc3b8-system-kube-apiserver-edoa4877a4ed2c7f8eed2c7805c7ff3.

    52ef36.log

    student8if458-node-10a$: sudo less /var/log/containers/kube-apiserver-u16-12-1dc3b8-system-kube-apiserver-edoa4877a4ed2c7f8eed2c7805c7ff3.

    <output_ended>

    ```

    3. Take a log of the file.

    4. Search for other log entries in /var/log, for kube-dns, kube-proxy.


    5. If not on a Kubernetes cluster using systemd you can view the files on the
    master node.

    - (a) /var/log/kube-apiserver.log Responsible for API

    - (b) /var/log/kube-scheduler.log Responsible for making decisions

    - (c) /var/log/kube-controller-manager.log Controller that manages replicas

    6. /var/log/containers Various container logs

    7. /var/log/pods/ More files for current Pods.

    8. Worker Nodes (on non-systemd)

    - (a) /var/log/kubelet.log Responsible for running containers on the node

    - (b) /var/log/kube-proxy.log Responsible for service balancing

    9. More reading: https://kubernetes.io/tasks/debug-application-cluster/debug-service/
    and https://kubernetes.io/tasks/debug-application-cluster/determine-pod-failure/


    ## Viewing Logs Output


    Container status can be seen using the kubectl command. If there is no standard
    out, you would not see any output. In addition, the logs would be viewed if the
    container is destroyed.


    1. View the Pods in the cluster. To view Pods in all namespaces:


