    \n## 1.1 Labs\n\n### Exercise 1.1: Configuring the System for sudo\n\nIt is very\
    \ dangerous to run a root shell unless absolutely necessary: a single typo or\
    \ other mistake can cause severe (even fatal) damage.\n\nThe sensible procedure\
    \ is to configure things such that single commands can be run with superuser privilege,\
    \ by using the sudo mechanism. With sudo the user only needs to know their own\
    \ password and never needs to know the root password.\n\nIf you are using a distribution\
    \ such as Ubuntu, you may not need to do this lab to get sudo configured properly\
    \ for the course. However, you should make sure you understand the procedure.\n\
    \nTo check if your system is already configured to let the user account you are\
    \ running sudo, just do a simple command like:\n\n```\n$ sudo ls\n```\n\nYou should\
    \ be prompted for your user password and then the command should execute. If instead,\
    \ you will get an error message you need to execute the following procedure.\n\
    \nLaunch a root shell by typing su and then give the root password, not your user\
    \ password.\n\nOn all recent Linux you should navigate to the /etc/sudo.d subdirectory\
    \ and create a file, usually with the name of the user to whom wishes to grant\
    \ sudo access. However, this convention is not actually necessary as sudo will\
    \ scan all files in this directory as needed. The file can simply contain:\n\n\
    ```\nstudent ALL=(ALL) ALL\n```\n\nif the user is student.\n\nAn older practice\
    \ (which certainly still works) is to add a line at the end of the file /etc/sudoers.\
    \ It is best to do so using the visudo program, which is careful about sure you\
    \ use the right syntax in your edit.\n\nYou probably need to set proper permissions\
    \ on the file by typing:\n\n```\n$ chmod 440 /etc/sudoers.student\n```\n\n(Note\
    \ Linux distributions may require 400 instead of 440 for the permissions.)\n\n\
    After you have done these steps, exit the root shell by typing exit and then try\
    \ to do it again.\n\nThere are many other ways an administrator can configure\
    \ sudo, including specifying only permissions for certain users, limiting searched\
    \ paths etc. The /etc/sudoers file is very well-documented.\n\nHowever, there\
    \ is one more setting we highly recommend you do, even if your system already\
