    \ typically assigned with **labels** to allow persistent access to a resource,\
    \ when front or back end containers are terminated and replaced.\n\n### Deploy\
    \ A New Service\n\n**1. Create a deployment for nginx**\n\nCreate a file named\
    \ `nginx-one.yaml` with the following content:\n\n```nginx-one.yaml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: nginx-one\n  labels:\n    app:\
    \ nginx\nspec:\n  replicas: 2\n  template:\n    metadata:\n      labels:\n   \
