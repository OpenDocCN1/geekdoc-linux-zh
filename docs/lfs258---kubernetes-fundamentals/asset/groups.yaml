    \ would present the traffic, a curl in this case, to the facing interface. Use\
    \ ip to find the IP address of the interface which will use for loadbalancer.\
    \ In this example interface will be ens4, and the IP will be 10.128.0.7.\n\n```\n\
    student@lfs458-node-la0a:~$ ip a\n1: <LOOKBACK,UP, LOWER> mtu 65536 qdisc no state\
    \ UNKNOWN group default qlen 1000\n    link eth0:00:00:00:00:00:00 br ff:ff:ff:ff:ff:ff\n\
    \    inet 127.0.0.1/8 scope host\n        valid_l forever preferred forever\n\
    \    inet ::/128 scope host\n        valid_l forever preferred forever\n2: <BROADCAST,MULTICAST,UP,LOWER>\
    \ mtu 1460 qdisc state UP group default qlen 1000\n    link/ether 42:01:a0:80:00:00\
    \ br ff:ff:ff:ff:ff:ff\n    inet 10.128.0.7/32 br 10.128.0.3 scope global ens4\n\
    \        valid_l forever preferred forever\n<output>\n```\n\n```\nstudent@lfs458-node-la0a:~$\
    \ curl -H \"Host: www.example.com\" http://10.128.0.7/\n<!DOCTYPE html>\n<html>\n\
