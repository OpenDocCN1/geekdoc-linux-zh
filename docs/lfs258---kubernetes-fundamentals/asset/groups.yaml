    \ created\n```\n\n```\nstudent@lfs458-node-1a0a~$ kubectl get jobs.batch\nNAME\
    \ COMPLETIONS DURATION AGE\nsleepy 0/5 5s 5s\n```\n\n7. View the pods that. The\
    \ output may be different depending on the speed of typing.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl get pods\nNAME READY RESTARTS AGE\nsleepy-z25hn 0/1 Completed 0 8s\n\
    sleepy-zd6692 1/1 Running 0 3s\n<output_omitted>\n```\n\n8. Eventually all the\
    \ jobs have completed. Verify then the job.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl get jobs\nNAME COMPLETIONS DURATION AGE\nsleepy 5/5 26s 10m\n```\n\n\
    ```\nstudent@lfs458-node-1a0a~$ kubectl delete jobs.batch sleepy\njob.batch \"\
