    \ vim job.yaml\n<output_omitted>\nmetadata:\n  name: sleepy\nspec:\n  completions:\
    \ 5  #--Add line\n  template:\n    spec:\n      containers:\n        <output_omitted>\n\
    ```\n\n6. Create the job. As you view the job that COMPLETIONS begins as zero\
