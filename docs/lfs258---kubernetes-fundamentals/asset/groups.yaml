    ## 第1章

    ## 引言


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_6_0.png)


    ## 1.1 实验


    ### 练习 1.1：配置系统使用 sudo


    除非绝对必要，否则运行 root shell 是非常危险的：一次拼写错误或其他错误都可能导致严重的（甚至是致命的）损害。


    合理的做法是配置系统，通过使用 `sudo` 机制允许单个命令以超级用户权限运行。通过 `sudo`，用户只需要知道自己的密码，而永远不需要知道 root
    密码。


    如果你使用的是 Ubuntu 等发行版，你可能不需要通过此实验来为课程正确配置 `sudo`。但是，你应该确保自己理解了这一过程。


    要检查系统是否已配置允许你正在运行的用户运行 `sudo`，只需执行一个简单的命令：


    ```

    $ sudo ls

    ```


    系统会提示你输入用户密码，然后命令应该执行。如果如果没有，你会收到一条错误消息，此时你需要执行以下步骤。


    通过输入 `su` 启动 root shell，然后给出 root 密码而不是你的用户密码。


    在所有最近的 Linux 系统中，你都应该导航到 `/etc/sudo.d` 子目录并创建一个文件，文件名通常是想要授予 `sudo` 访问权限的用户名。然而，这种约定并不是必须，因为
    `sudo` 会根据需要扫描此目录下的所有文件。该文件可以简单包含：


    ```

    student ALL=(ALL) ALL

    ```


    如果用户是 `student`。


    一种较旧的做法（显然仍然有效）是在 `/etc/sudoers` 文件的末尾添加一行。最好使用 `visudo` 程序来这样做，它会确保你在编辑使用了正确的语法。


    你可能需要通过输入以下命令对文件设置正确的权限：


    ```

    $ chmod 440 /etc/sudoers.student

    ```


    （注意：Linux 发行版可能要求权限设为 400 而不是 440。）


    完成这些步骤后，输入 `exit` 退出 root shell，然后再次尝试。


    管理员有许多配置 `sudo` 的其他方法，包括仅为某些用户指定权限、限制搜索路径等。`/etc/sudoers` 文件有非常详细的文档。


    然而，我们非常建议你进行另一项设置，即使你的系统已经配置了 `sudo`。大多数发行版为普通用户和 root 用户设置了不同的可执行文件路径。特别是 `/sbin`
    和 `/usr/bin` 目录不会被搜索，因为它继承的是用户的 `PATH`，而不是完整的 root 用户用户路径。


    因此，在课程中，我们必须不断提醒你许多系统管理工具的完整路径；任何安全增强可能都不值得花额外的时间去输入和查找这些程序所在的目录。因此，我们建议你在家目录下的
    `.bashrc` 文件中添加以下行：


    ```

    PATH=$PATH:/usr/sbin:/sbin

    ```


    如果你注销并重新登录（不需要重启），此设置将完全生效。


    ## 第2章

    ## Kubernetes 基础


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_8_0.png)


    ## 2.1 实验


    ### 练习 2.1：查看在线资源


    ### 访问 kubernetes.io


    对于这样一个变化如此迅速的项目，跟踪更新至关重要。查找当前版本文档的主要地方是 https://kubernetes.io/。


    - 1. 打开浏览器访问 https://kubernetes.io/ 网站。

    2. 在右上角，使用下拉菜单访问可用版本。它会显示类似 v1.2 的内容。

    3. 选择“Documentation”（文档）顶层链接。页面左侧的链接有助于导航。

    4. 在时间允许的情况下，浏览其他子页面，如 SETUP（设置）、CONCEPTS（概念）和 TASKS（任务），以熟悉其布局。


    ### 跟踪 Kubernetes 问题（Issues）


    每天有数百、甚至可能数千人正致力于 Kubernetes。由于有这么多人并行工作，你有很好的资源可以查看其他人是否也遇到了类似的停机。源代码以及功能和问题跟踪目前都在
    github.com 上。


    - 1. 要查看主页，使用浏览器访问 https://github.com/kubernetes/kubernetes/

    2. 点击不同的子目录并访问可用的基本信息。

    3. 将你的 URL 指向 https://github.com/kubernetes/kubernetes/issues。你应该看到一系列问题、功能请求和支持交流。

    - 4. 在搜索框中，你可能会看到一些现有文本，如 `is:issue is:open`，这允许你过滤你想要的信息类型。追加搜索字符串读取：`-is:issue
    is:open label:kind/bug` 然后按回车。

    - 5. 你现在应该可以看到按日期倒序排列的 bug。问题顶部的菜单区域允许你按作者、标签、项目、里程碑、分配者查看条目。花点时间查看其他选择标准。

    - 6. 有时你可能想排除某种输出。再次更新 URL，但在 label 前加一个减号，例如：`-is:issue is:open -label:kind/bug`。现在你可以看到除了
    bug 报告以外的所有内容。

    - 7. 利用剩余时间探索该页面。


    ## 第3章

    ## 安装与配置


    ![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_10_0.png)


    ## 3.1 实验


    ### 练习 3.1：安装 Kubernetes


    ### 概述


    不同的供应商提供了几种 Kubernetes 安装工具。在实验中，我们将学习使用 `kubeadm`。作为一个社区支持的独立工具，它计划成为构建 Kubernetes
    集群的主要方法。


    实验是使用运行在 Google Cloud Platform (GCP) 上的 Ubuntu 实例编写的。它们被设计为与供应商无关，因此可以在 AWS、本地硬件或虚拟化内部运行，为你提供最大的灵活性和选择。每个平台都有不同的访问方法和考虑因素。截至
    v1.12.1，VirtualBox 的最小（尽可能小）尺寸是：主节点需要 2vCPU/1G 内存的最小 OS，工作节点需要 1vCPU/1G 内存的最小
    OS。


    如果你拥有自己的设备，你需要禁用交换分区（swap）。可能还有其他要求在使用 `kubeadm` 命令时会以警告或错误的形式显示。大多数命令作为普通用户运行，但有些命令需要
    root 权限。例如，请如 AWS 示例所示使用 `sudo` 权限；如果不使用 Linux 或 Mac，你需要使用如本地终端或 PuTTY 等 SSH 客户端。你可以从
    www.putty.org 下载 PuTTY。你还需要一个 .pem 或 .ppk 文件来访问节点。每个云提供商都有下载或创建此文件的流程。参加现场导师培训的学员将在课程期间获得该文件。


    在练习中，我们将在单节点上安装 Kubernetes，然后扩展集群，添加更多计算资源。两个节点使用相同的大小，提供 2 个 vCPU 和 5G 内存。可以使用较小的节点，但运行速度会较慢。


    各种练习将使用 YAML 文件，这些文件包含在文中。鼓励你尽可能编写文件，因为 YAML 的语法对空格缩进有要求，这是需要学习的。重要提示：在你的 YAML
    文件中不要使用空格，仅使用缩进。


    如果你使用 PDF 复制粘贴后，单引号无法正确通过吗？它会粘贴为反引号。你需要手动修改它。


    如果你使用 PDF 复制粘贴……


