    ## Security\n\n## 16.1 Labs\n\n## Exercise 16.1: Working with TLS\n\n### Overview\n\
    \nWe have learned the flow of access to a cluster with TLS connectivity, then\
    \ authentication followed by authorization, finally an admission control plug-in\
    \ allows advanced features prior to the request being fulfilled. The use of Initializers\
    \ allows the flexibility of a shell-script to dynamically modify the request.\
    \ As security is an important, ongoing concern, there may be multiple configurations\
    \ used depending on the needs of the cluster.\n\nEvery process making API requests\
    \ to the cluster must authenticate or be treated as an anonymous user.\n\n###\
    \ Working with TLS\n\nWhile one have multiple cluster Certificate Authorities\
    \ (CA) by default each cluster uses their own, intended for intracl communication.\
    \ The CA certificate bundle is distributed to each node and as a secret to default\
    \ service accounts. The kubelet is a local agent which ensures containers are\
    \ running and healthy.\n\n- 1. View the kubelet on both the master and secondary\
    \ nodes. The kube-apiserver also shows security information as certificates and\
    \ authorization. As kubelet is a system service we will start looking at that\
    \ output.\n\n```\nstudent@tls468-node-la0:~$ systemctl status kubelet.service\n\
    kubelet.service - The Kubernetes Node Agent\nLoaded: loaded (/lib/systemd/system/kubelet.service;\
    \ enabled; vendor preset: en\nDrop-In: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf\n\
    ```\n\n- 2. If we look at the status output, and follow the cgroup information,\
    \ which is a long line where configuration settings are drawn from, we see where\
    \ the configuration file can be found.\n\n```\nCGroup: /system.slice/kubelet.service\n\
    19523 /usr/bin/kubelet --config=/var/lib/kubelet/config.yaml .\n```\n\nTake a\
    \ look at the settings in the /var/lib/kubelet/config.yaml file. Among other information\
    \ we can see the /etc/kubernetes/pki/ directory is for using the kube-apiserver.\
    \ Near the end of the output it also sets the directory to find other pod files.\n\
    \n```\nstudent@fs88-node-10a$: sudo vi /var/lib/kubelet/config.yaml\naddress:\
    \ 0.0.0.0\napiVersion: kubelet.config.k8s.io/v1beta1\nauthentication:\n  anonymous:\n\
    \    enabled: false\nwebhook:\n  cacheTTL: 2m\n  enabled: true\nx509:\n  client-auth:/etc/kubernetes/pki/ca.crt\n\
    ```\n\nOther agents use the kube-apiserver.\n\n```\nstudent@fs88-node-10a$: sudo\
