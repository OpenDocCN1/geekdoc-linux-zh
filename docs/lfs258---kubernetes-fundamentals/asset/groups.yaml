    indentation requirements that are important to learn. An important note, do not
    use in your YAML files, white space only. Indentation.


    If you use a PDF of copy and paste after does not pass the single quote correctly?
    It pastes as a back-quote instead. You will need to modify it by hand. The files
    have also been made available as a compressed tar file. You can view the resources
    by navigating to this URL:'
  - "[PAGE 11]\n\n# CHAPTER 3. INSTALLATION AND CONFIGURATION\n\nhttps://training.linuxfoundation.org/cm/LFS258\n\
    \nTo login use user: LFTraining and password of: Penguin2014\n\nOnce you have\
    \ the name and link of the config file, which will change as the course updates,\
    \ use **wget** to download the file into your node from the command line then\
    \ expand it like:\n\n```\n$ wget https://training.linuxfoundation.org/cm/LFS258/LFS258_V2018-11-13_SOLUTIONS.tar.bz2\
    \ \\\n  --user=LFTraining --password=Penguin2014\n```\n\n```\n$ tar xvf LFS258.V2018-11-13.SOLUTIONS.tar.bz2\n\
    ```\n\n(Note: depending on your software, if you are cutting and pasting the instructions,\
    \ the underscores may disappear and be replaced by spaces, you may have to edit\
    \ the command line by!)\n\nWhile Ubuntu 18 bonic has become the typical version\
    \ to deploy the Kubernetes repository does not yet have compatible binaries at\
    \ this time of writing. While xen binaries can be used there are many additional\
    \ steps needed to complete the task. **Ubuntu 18** is expected to be available\
    \ by the time Kubernetes v1.1.13 is released.\n\n# Install Kubernetes\n\nLog your\
    \ nodes. In after-instructor leading the node IP addresses will be provided by\
    \ the instructor. You will need to use a `.pem` or `.ppk` key for access, depending\
    \ on if you are using ssh from a terminal or PuTTY. The instructor will provide\
    \ this to you.\n\n+   1. Open a terminal session for your node. For example, connect\
    \ via PuTTY or SSH to the first GCP node. The user name may be different than\
    \ the one shown, `root`. The IP will be in the example different from the one\
    \ you use.\n\n```\n[student@~$] ssh -i LFS258.pem student@35.226.100.87'\nThe\
    \ authentication of '35.226.214.256 (35.226.100.87)' can't be established.\nECDSA\
    \ key fingerprint is SHA256:IZfnbk3YW/qAcXrCDgguWbXC9Ymfk2Wo1e.\nECDSA key fingerprint\
    \ is MD5: dc8:4b:b0:d2:93:c5:08:4a:74:fb:e1:9f\nAre sure you want to continue\
    \ connecting (yes/no)? yes\nWarning: Permanently added to the list of known hosts.\n\
    <output>\n```\n\n+   2. Become root and update the system. Any questions you have\
    \ use the defaults:\n\n```\nroot@lfs258-node-10a:~# sudo -i\nroot@lfs258-node-10a:~#\
    \ apt-get update && apt-get upgrade -y\n<output>\n```\n\n+   3. The main choices\
    \ for a container runtime are **Docker** and **cri-o**. We will use Docker for\
    \ class, as *cri-o* requires a fair amount of effort to enable for Kubernetes.\
    \ *cri-o* is open source the community seems is heading towards its use.\n\n```\n\
    root@lfs258-node-10a:~# apt install -y docker.io\n<output>\n```\n\n+   4. Add\
    \ new nodes for kub. You could also use a tool file or create the file and add\
    \ entry to the main repo for your distribution. We are still using Ubuntu 16.04\
    \ the kubernetes-xenial with the key word main. There are four sections to the\
    \ edit\n\n```\nroot@lfs258-node-10a:~# vi /etc/apt/sources.list.d/kubernetes.list\n\
    deb http://apt.kubernetes.io/ kubernetes-xenial main\n```\n\nLFS258-2018-11-13\
    \  © Copyright the Linux Foundation 2018. All rights reserved.\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_11_0.png)"
- md: "\n## 3.1 LABS\n\n5. Add a GPG key for the packages. The command spans three\
    \ lines. You can omit the backslash when you type. The OK is the expected output,\
    \ not part of the command.\n\n```\nroot@lfs458-node-1a0:~# curl -s \\\nhttps://packages.cloud.google.com/apt/doc/apt-key.gpg\
    \ \\\n  | apt-key add -\nOK\n```\n\n6. Update with new repo, which will download\
    \ new repo information.\n\n```\nroot@lfs458-node-1a0:~# apt-get update\n<output-omitted>\n\
    ```\n\n7. Install the software. There are regular releases the newest of which\
    \ you can get by emitting the equal sign and version information on the command\
    \ line. New history has more than one changes and a good of bug of a few.\n\n\
    ```\nroot@lfs458-node-1a0:~# apt-get install -y \\\nkubeads=1.21.0-0 kubelet=1.21.0-0\
    \ kubeadm=1.21.0-0\n<output-omitted>\n```\n\n8. Deciding which pod network to\
    \ use for Container Networking Interface (CNI) should take into account the expected\
    \ demands on the cluster. There is more than one network per cluster, the CNI-Genus\
    \ project is trying to change this.\n\nThe network may also use container-to-container,\
    \ pod-to-pod, pod-to-service, and external-to-service communications. As Docker\
    \ uses host-networking, the docker2 virtual bridge and veth interfaces would require\
    \ being on one host to communicate.\n\nWe use Calico as a network plugin which\
    \ allows us to use Network Policies in the current. Calico does not deploy DNS\
    \ by default. The 3.3 version of Calico has more than one configuration policy\
    \ with RBAC. Using the configuration files. Once downloaded for the expected IPv4\
    \ range for calico to\n\nA short url for each file, the longer URLs can be found\
    \ here: https://docs.projectcalico.org/v3.3/getting-started/kubernetes/hosted/rbac-kdd.yaml\
    \ and https://docs.projectcalico.org/v3.3/getting-started/kubernetes/installed/hosted/datastore/calico-networking/1.7/calico.yaml\n\
    \n```\nroot@lfs458-node-1a0:~# wget https://tinyurl.com/yb4xburn \\\n-O rbac-kdd.yaml\n\
    root@lfs459-node-1a0:~# wget https://tinyurl.com/y81vc9g \\\n-O calico.yaml\n\
    ```\n\n9. Use to parse the file path. Look for the IPv4 pod expected by the clusters.\
    \ There are many configuration settings in this file. Take a moment to view the\
    \ entire file. The CALICO_IPV4_POOL_CIDR must match the value given by kubeadm\
    \ init in the following step, whatever the value may be.\n\n```\nroot@lfs458-node-1a0:~#\
    \ less calico.yaml\n\n Configure the IP Pool from which Pod IPs will be chosen.\n\
    \  name: CALICO_IPV4_POOL_CIDR\n  value: \"192.168.0.0/16\"\n```\n\n10. Initialize\
    \ the master. Read the output by line. Expect the output to change as the software\
    \ matures. There are end configuration that run as a non-root user. The token\
    \ is mentioned above. This information can be found later with the kubeadm token\
    \ list. This allows you to create a network pod for the cluster, which will be\
    \ our next step. Pass the next command to kubeadm Setting Calico in its configuration\
    \ file, found in the previous step. Please note: the output of some following\
    \ commands which will not be complete. Read the next step before further typing.\n\
    \n```\nroot@lfs458-node-1a0:~# kubeadm init --pod-network-cidr 192.168.0.0/16\n\
    ```\n\n## CHAPTER 3. INSTALLATION AND CONFIGURATION\n\n```\n[init] using Kubernetes\
    \ version: v1.12.1\n[preflight] running pre-flight checks\n[preflight/images]\
    \ Pulling images required for setting up\nKubernetes cluster\n[preflight/images]\
    \ This might take a minute or two, depending\non the speed of your internet connection\n\
    ```\n\n<output-omitted>\n\nYour Kubernetes master has initialized successfully.\n\
    \nTo start your cluster, you need to run the following\na regular user:\n\n```\n\
    mkdir -p $HOME/.kube\nsudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config\n\
    sudo chown $(id -u):$(id -g) $HOME/.kube/config\n```\n\nYou should now deploy\
    \ a pod network to the cluster.\nRun `kubectl apply -f [podnetwork.yaml]` with\
    \ one of the options\nlisted at:\n\nhttps://kubernetes.io/docs/concepts/cluster-administration/addons/\n\
    \nYou can now join any number of machines by running the following\non each node\
    \ as root:\n\n```\nkubectl join 10.128.0.4:6443 --token rdnhok.6b8mb61gesunanh\n\
    --discovery-token=ca-cert-bash\nsha256:66350d154fc0c169b5bb5fd0c54b2764281695e356d879d55e95542f77\n\
    ```\n\n11. As suggested in the directions above we will allow a non-root user\
    \ admin access to the\ncluster. Take a look at the configuration file once it\
    \ is copied and the permissions fixed.\n\n```\nstudent@lfs458-node-10a0:~# exit\n\
    logout\n```\n\n```\nstudent@lfs458-node-10a0:~# sudo cp -i /etc/kubernetes/admin.conf\
    \ $HOME/.kube/config\n```\n\n```\nstudent@lfs458-node-10a0:~# sudo chown $(id\
    \ -u):$(id -g) $HOME/.kube/config\n```\n\n```\nstudent@lfs458-node-10a0:~# less\
    \ .kube/config\n```\n\napiVersion: vi\nclusters:\n  cluster:\n\n<output-omitted>\n\
    \n12. Apply the network plugin to your cluster. Remember to copy the file to the\
    \ current, non-root user directory first.\n\n```\nstudent@lfs458-node-10a0:~#\
    \ kubectl apply -f /root/rbac-kdd.yaml\n```\n\n```\nstudent@lfs458-node-10a0:~#\
    \ kubectl apply -f rbac-kdd.yaml\nclusterrole.rbac.authorization.k8s.io/calico-node\
    \ created\nclusterrolebinding.rbac.authorization.k8s.io/calico-node created\n\
    ```\n\n```\nstudent@lfs458-node-10a0:~# kubectl apply -f /root/calico.yaml\n```\n\
    \n```\nconfigmap/calico-config created\nservice/calico-typedha created\ndeployment.apps/calico-typedha\
    \ created\npodsirubbudget.policy/calico-typedha created\n<output-omitted>\n```\n\
    \n## 3.1. LABS\n\n13. While many objects have short names, `kubectl` command can\
    \ be a lot to. We will enable `bash` auto-completion by adding the settings to\
    \ the current shell. Update the `/.bashrc` to make it persistent.\n\n```\nstudent@lfs48-node-ia0a~$\
    \ source <(kubectl completion bash)\nstudent@lfs48-node-ia0a~$ echo \"source <(kubectl\
    \ completion bash)\" >> ~/.bashrc\n```\n\n14. Test by describing the node. Type\
    \ the first three letters of the command then `Tab`. Auto-completion assumes the\
    \ default. Press the `Tab` multiple times until a unique name.\n\n```\nstudent@lfs48-node-ia0a~$\
    \ kubectl desc<Tab> n<Tab> nc<Tab>\nstudent@lfs48-node-ia0a~$ kubectl get<Tab>\
    \ po<Tab>\n```\n\n## Exercise 2: The Cluster\n\nOpen another terminal and connect\
    \ to a second node. Install Docker and Kubernetes software. These are the many,\
    \ but not all, of the steps we did on the master node.\n\n- Using the same process\
    \ as before connect to the second node. Giving a title or color to the new window\
    \ is a good idea to keep track of the tokens. You can link.\n\n```\nstudent@lfs48-worker~$\
    \ sudo -i\nroot@lfs48-worker~$ apt-get update && apt-upgrade\nroot@lfs48-worker~$\
    \ apt-install -y docker.io\nroot@lfs48-worker~$ vim /etc/apt/sources.list.d/kubernetes.list\n\
    deb http://kubernetes.io kubernetes-xenial mainnroot@lfs48-worker~$ curl -sSL\n\
    https://packages.cloud.google.com/apt/doc/apt-key.gpg |\n apt-key add -\nroot@lfs48-worker~$\
    \ apt-get update\n```\n\n2. Find the IP address of your master. The interface\
    \ name will be different depending on where the node is running. Currently inside\
    \ GCE the primary interface for this node is eth4. Some interfaces may not be\
    \ different. From the output we know master ip is 10.128.0.3.\n\n```\nstudent@lfs48-node-ia0a~$\
    \ ip addr show | grep inet\ninet 10.128.0.32 brd 10.128.0.255 scope global eth4\n\
    inet fe80::4001:ffe8e:2/64 scope link\n```\n\n3. Find the token on the master\
    \ node. The token lasts 24 hours by day. If it has been longer, and now is no\
    \ token you can generate a new one with the sudo kubeadm token create, shown in\
    \ the following command:\n\n```\nstudent@lfs48-node-ia0a~$ sudo kubeadm token\
    \ list\nTOKEN TTL USAGES DESCRIPTION\n27ee64.66ff0631829a2 23h 2017-11-03T13:27:33\n\
    authentication,signing The default bootstrap token generated by 'kubeadm init'...\n\
    ```\n\nLFS258:V.2018-11 © Copyright the Linux Foundation 2018. All rights reserved.\n"
  mdcn: "\n\n## 3.1 实验室\n\n5. 为软件包添加 GPG 密钥。该命令跨越三行。在输入时你可以省略反斜杠。`OK` 是预期的输出，而不是命令的一部分。\n\
    \n```\nroot@lfs458-node-1a0:~# curl -s \\\nhttps://packages.cloud.google.com/apt/doc/apt-key.gpg\
    \ \\\n  | apt-key add -\nOK\n```\n\n6. 使用新仓库更新，这将下载新的仓库信息。\n\n```\nroot@lfs458-node-1a0:~#\
    \ apt-get update\n<输出已省略>\n```\n\n7. 安装软件。这里有定期发布，你可以通过在命令行中输出等号和版本信息来获取最新版本。新的历史记录有多个处更改，并且有少几个良好的错误。\n\
    \n```\nroot@lfs458-node-1a0:~# apt-get install -y \\\nkubeads=1.21.0-0 kubelet=1.21.0-0\
    \ kubeadm=1.21.0-0\n<输出已省略>\n```\n\n8. 决定为容器网络接口 (CNI) 使用哪种 pod 网络，应该考虑集群的预期需求。每个集群有多个网络，CNI-Genus\
    \ 项目正试图改变这一点。\n\n网络可能还使用从容器到容器、pod 到 pod、pod 到服务以及外部到服务的通信。由于 Docker 使用宿主机网络，`docker2`\
    \ 虚拟桥接器和 `veth` 接口需要位于在同一台主机上才能进行通信。\n\n我们使用 Calico 作为网络插件，它允许我们在当前使用网络策略（Network\
    \ Policies）。Calico 默认不部署 DNS。Calico 的 3.3 版本有多个带有 RBAC 的配置策略。使用配置文件。一旦为 calico\
    \ 预期的 IPv4 范围下载后到。\n\n每个文件的短 URL，更长的 URL 可以在此处找到：https://docs.projectcalico.org/v3.3/getting-started/kubernetes/hosted/rbac-kdd.yaml\
    \ 和 https://docs.projectcalico.org/v3.3/getting-started/kubernetes/installed/hosted/datastore/calico-networking/1.7/calico.yaml\n\
    \n```\nroot@lfs458-node-1a0:~# wget https://tinyurl.com/yb4xburn \\\n-O rbac-kdd.yaml\n\
    root@lfs459-node-1a0:~# wget https://tinyurl.com/y81vc9g \\\n-O calico.yaml\n\
    ```\n\n9. 用于解析文件路径。查找集群预期的 IPv4 pod。此文件中有很多配置设置。花点时间查看整个文件。`CALICO_IPV4_POOL_CIDR`\
    \ 必须与下一步中 `kubeadm init` 给出的值匹配，无论该值是什么。\n\n```\nroot@lfs458-node-1a0:~# less\
    \ calico.yaml\n\n 配置从从中选择 Pod IPs 的 IP 池。\n  name: CALICO_IPV4_POOL_CIDR\n  value:\
    \ \"192.168.0.0/16\"\n```\n\n10. 初始化主节点。逐行读取输出。预计输出随着软件的成熟而变化。有以非 root 用户运行的结束配置。token\
    \ 在上面提到。此信息稍后可以通过 `kubeadm token list` 找到。这允许你为集群创建一个网络 pod，这将是我们的下一步。将下一个命令传递给\
    \ `kubeadm`，在上一步找到的配置文件中设置 Calico。请注意：后续某些命令的输出将不完整。在继续输入之前请阅读下一步。\n\n```\nroot@lfs458-node-1a0:~#\
    \ kubeadm init --pod-network-cidr 192.168.0.0/16\n```\n\n## 第 3 章 安装与配置\n\n```\n\
    [init] 正在使用 Kubernetes 版本: v1.12.1\n[preflight] 正在运行预检\n[preflight/images] 正在拉取设置\
    \ Kubernetes 集群所需的镜像\n[preflight/images] 这可能需要一或两分钟，取决于 你的互联网连接速度\n```\n\n<输出已省略>\n\
    \n你的 Kubernetes 主 节点已成功初始化。\n\n要启动你的集群，你需要以普通用户身份运行以下命令：\n\n```\nmkdir -p $HOME/.kube\n\
    sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id\
    \ -g) $HOME/.kube/config\n```\n\n你现在应该向集群部署一个 pod 网络。运行 `kubectl apply -f [podnetwork.yaml]`\
    \ 并使用列在下面的选项之一：\n\nhttps://kubernetes.io/docs/concepts/cluster-administration/addons/\n\
    \n你现在可以通过在每个节点上作为 root 运行以下命令加入任意数量的机器：\n\n```\nkubectl join 10.128.0.4:6443 --token\
    \ rdnhok.6b8mb61gesunanh\n--discovery-token=ca-cert-bash\nsha256:66350d154fc0c169b5bb5fd0c54b2764281695e356d879d55e95542f77\n\
    ```\n\n11. 正如方向中建议的，允许非 root 用户访问集群。在复制后查看文件。\n\n```\nroot@lfs458-node-1a0:~#\
    \ exit\nroot@lfs458-node-1a0:~# sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config\n\
    root@lfs458-node-1a0:~# sudo chown $(id -u):$(id -g) $HOME/.kube/config\n```\n\
    \n```\nroot@lfs458-node-1a0:~# less ~/.bash\n```\n\n12. 将插件应用到集群。一旦复制后，非 root\
    \ 用户访问。\n\n```\nroot@lfs458-node-1a0:~# kubectl apply -f rbac-kdd.yaml\nroot@lfs458-node-1a0:~#\
    \ kubectl apply -f calico.yaml\n```\n\n13. 当 `kubectl` 命令有许多短名称时，我们将通过添加到 `.bashrc`\
    \ 来启用补全。使其持久化。\n\n```bash\nstudent@lfs458-node-1a~$ echo \"source <(kubectl completion)\"\
    \ >> ~/.bashrc\n```\n\n14. 通过描述节点进行测试。输入命令的前三个字母 `Tab`。补全默认。\n\n```bash\nstudent@lfs458-node-1a~$\
    \ source ~/.bashrc\nstudent@lfs458-node-1a~$ kubectl get<Tab>\n```\n\n## 3.1 实验室\n\
    \n（注：此处由于原文重复，已按要求处理）\n\nLFS258:V.2018-11 © Copyright the Linux Foundation 2018.\
    \ All rights reserved.\n\n"
