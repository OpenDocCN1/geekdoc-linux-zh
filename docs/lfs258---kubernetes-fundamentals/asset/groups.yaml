    # 8.1 Labs


    # Exercise 8.1: Deploy A New Service


    # Overview


    **Services** (also called microservices) are objects which declare a policy to
    access a logical set of Pods. They are typically assigned with **labels** to allow
    persistent access to a resource, when front or back end containers are terminated
    and replaced.


    Native applications can use the Endpoints API for access. Non-native applications
    can use a Virtual IP-based bridge to access end pods. `ServiceTypes` Type could
    be:


    +   * **ClusterIP** default - exposes on a cluster-internal IP Only reachable
    within cluster

    * **NodePort** exposes node IP at a static port. A ClusterIP is also automatically
    created.

    * **LoadBalancer** exposes service using cloud providers load balancer. NodePort
    and ClusterIP automatically created.

    * **ExternalName** maps service to contents of `externalName` with a CNAME record.


    We use services as form of decoupling so that any agent or object can be replaced
    without interruption to access from client to back end application.


    # Deploy A New Service


    +   1. Deploy two nginx services using `kubectl` and a new `.yaml` file. We will
    use the v1beta version of the API. The kind should be Deployment and name it with
    nginx. Create two replicas and expose pod 8080. What follows is a well documented
    file. There is no need to include the comments when you create the file. This
    file can also be found among the other examples in the tutorial.


    ```

    student@lfs58-node-iaao0~$ vim nginx-one.yaml

    ```'
