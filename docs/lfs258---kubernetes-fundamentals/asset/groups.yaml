    ## 6.1 Labs\n\n### Exercise 6.1: RESTful API Access\n\n#### Overview\n\nWe will\
    \ continue to explore ways of accessing the control plane of our cluster. In the\
    \ security chapter we will discuss there are several authentication methods, one\
    \ of which is use of a Bearer token. We will work with one then deploy a local\
    \ proxy server for application-level access to the Kubernetes API.\n\n#### RESTful\
    \ API Access\n\nWe use the `curl` command to make API requests to the cluster\
    \ in an insecure manner. Once we know the IP address and port, then the token\
    \ we can retrieve cluster data in RESTful manner. By default most of the information\
    \ is restricted, but changes to authentication policy could allow more access.\n\
    \n- 1. First we need to know the IP and port of a node replica of the API server.\
    \ The system will typically have one running. Use `kubectl config view` to get\
    \ overall cluster configuration, and find the server entry. This will give us\
    \ both the IP and the port.\n\n```\nstudent@e1fa65-node-1a0:~$ kubectl config\
    \ view\napiVersion: v1\nclusters:\n  cluster:\n    certificate-authority-data:\
    \ REDACTED\n    server: https://10.128.0.3:6443\n  name: kubernetes\n<output_omitted>\n\
    ```\n\n- 2. We need to find the bearer token. This is a default token. Look at\
    \ a list of tokens, first all on the cluster, just those in the default namespace.\
    \ There will be a secret for each of the controllers of the cluster.\n\n```\n\
    student@lfs458-node-1a0$: kubectl get secrets --all-namespaces\nNAMESPACE    NAME\
    \                  TYPE\ndefault      default-token-jdqp7  kubernetes.io/service-account-token\n\
    kube-public  default-token-b2pr   kubernetes.io/service-account-token\nkube-system\
    \  attach-token-ck     kubernetes.io/service-account-token\nkube-system  bootstrap-token-wpx6\
    \  kubernetes.io/service-account-token\n\nstudent@lfs458-node-1a0$: kubectl get\
    \ secrets\nNAME  AGE\ndefault      default-token-jdqp7  kubernetes.io/service-account-token\n\
    ```\n\n- 3. Look at the details of the secret. We will need information from the\
    \ output.\n\n```\nstudent@lfs458-node-1a0$: kubectl describe secret default-token-jdqp7\n\
    Namespace: default\nLabels:\n  kubernetes.io/service-account: default\nData:\n\
    \  token: <base64-encoded-data>\n```\n\n- 4. Using your token to copy, or `awk`\
    \ to save the data, from the first to the last, variable named token. Your data\
    \ will be different.\n\n```\nstudent@lfs458-node-1a0$: kubectl describe secret\
    \ default-token-jdqp7 | grep token | cut -d '\n```\n\n- 5. Test to see if you\
    \ get basic API information from your cluster. We will pass the server name and\
    \ port, use the `-k` option to avoid using a cert.\n\n```\nstudent@lfs458-node-1a0$:\
    \ curl http://10.128.0.3:6443/api \\\n--header \"Authorization: Bearer $token\"\
    \ -k\n{\n  \"kind\": \"APIVersion\",\n  \"versions\": [\n    \"v1\"\n  ],\n  \"\
    serverAddress\": [\n    \"clientCID\": \"0.0.0.0/\",\n    \"serverAddress\": \"\
    10.128.0.3:6443\"\n  ]\n}\n<output_omitted>\n```\n\n- 6. Try the same command,\
    \ but to call API `v1`.\n\n```\nstudent@lfs458-node-1a0$: curl http://10.128.0.3:6443/api/v1\
    \ \\\n--header \"Authorization: Bearer $token\" -k\n<output_omitted>\n```\n\n\
    - 7. Try to get a list of namespaces. This should return an error. It shows our\
    \ request is being seen by `system:serviceaccount`, which does not have the RBAC\
    \ authorization to list namespaces in the cluster.\n\n```\nstudent@lfs458-node-1a0$:\
    \ curl https://10.128.0.3:6443/api/v1/namespaces \\\n--header \"Authorization:\
    \ Bearer $token\" -k\n<output_omitted>\n{\"message\": \"namespaces is forbidden:\
    \ User \\\"system:serviceaccount:...}\n<output_omitted>\n```\n\n- 8. Pods also\
    \ make use of included certificates to authenticate the API. The certificates\
    \ are automatically available to a pod under `/var/run/secrets/kubernetes.io/serviceaccount/`.\
    \ We deploy a Pod and view the resources. If you use the token file it is the\
    \ same as the `$token` variable. The `-i` flag creates a terminal session of the\
    \ busybox container. Once the container will not restart and the pod will show\
    \ as:\n\n```\nstudent@lfs458-node-1a0$: kubectl run -i -t busybox --image=busybox\
    \ \\\n--restart=Never\n# ls /var/run/secrets/kubernetes.io/serviceaccount/\n#\
    \ namespace token\n# exit\n```\n\n## 6.2: Using the Proxy\n\nAnother way to interact\
    \ with the API is via a proxy. The proxy can be run from a node or within a Pod\
    \ through the use of a sidecar. In the following steps we will deploy a proxy\
    \ to the loopback address. We will use `curl` to access the API server. If the\
