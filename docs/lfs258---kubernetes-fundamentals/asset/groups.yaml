- md: "\n# 9.1. LABS\n\n```bash\nstudent@lfs458-node-laa0a:~$ cp first.yaml nfs-pod.yaml\n\
    ```\n\n```bash\nstudent@lfs458-node-laa0a:~$ vim nfs-pod.yaml\n```\n\n```yaml\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  annotations:\n    deployment.kubernetes.io/revision:\
    \ \"1\"\n    generation: 1\n  labels:\n    run: nginx\n  name: nginx-nfs\n  namespace:\
    \ default\n  resourceVersion: \"1411\"\nspec:\n  replicas: 1\n  selector:\n  \
    \  matchLabels:\n      run: nginx\n  strategy:\n    rollingUpdate:\n      maxSurge:\
    \ 1\n      maxUnavailable: 1\n    type: RollingUpdate\n  template:\n    metadata:\n\
    \      creationTimestamp: null\n      labels:\n        run: nginx\n    spec:\n\
    \      containers:\n      - image: nginx\n        imagePullPolicy: Always\n  \
    \      name: nginx\n        volumeMounts:\n        - name: nfs-vol\n         \
    \ mountPath: /opt\n        ports:\n        - containerPort: 80\n          protocol:\
    \ TCP\n      resources:\n        terminationMessagePath: /dev/termination-log\n\
    \        terminationMessagePolicy: File\nvolumes:\n- name: nfs-vol\n  persistentVolumeClaim:\n\
    \    claimName: pvc-claim\ndnPolicy: ClusterFirst\n  restartPolicy: Always\nschedulerName:\
    \ default-scheduler\nsecurityContext: {}\n  terminationGracePeriodSeconds: 30\n\
    ```\n\n6. Create the pod using the newly edited file.\n\n```bash\nstudent@lfs458-node-laa0a:~$\
    \ kubectl create -f nfs-pod.yaml\ndeployment.apps/nginx-nfs created\n```\n\n7.\
    \ Look at the details of the pod. You may see the daemon pods running as.\n\n\
    ```bash\nstudent@lfs458-node-1oa0:~$ kubectl get pods\nNAME                  \
    \           STATUS RESTARTS AGE\nnginx-nfs-1054079768-s8g28      Running   1 \
    \     0 3m\n```\n\n```bash\nstudent@lfs458-node-1oa0:~$ kubectl describe pod nginx-nfs-1054079768-s8g28\n\
    Name:               nginx-nfs-1054079768-s8g28\nNamespace:          default\n\
    Node:               ifs458-worker/10.128.0.5\n```\n\n```\n<output_omitted>\nMounts:\n\
    \  /opt from nfs-vol (rw)\n```\n\n```\n<output_omitted>\nVolumes:\n  nfs-vol:\n\
    \    Type:               PersistentVolumeClaim (a reference to a PersistentV...\n\
    \    ClaimName:         pvc-one\n    ReadOnly:           false\n```\n\n8. View\
    \ the status of the PVC. It should show as bound.\n\n```bash\nstudent@lfs458-node-1oa0:~$\
    \ kubectl get pvc\nNAME             STATUS CAPACITY ACCESS MODES STORAGECLASS\
    \ AGE\npvc-one           Bound   pvvol-1  1Gi       RW                    2m\n\
    ```\n\n# Exercise 9.4: Using a ResourceQuota to Limit PVC Count and Usage\n\n\
    The flexibility of cloud-based storage requires limiting consumption among users.\
    \ We will use the ResourceQuota object to limit both the total consumption as\
    \ well as the number of persistent volume claims.\n\n- 1. By beginning the deployment\
    \ we created to use NFS, the pv and the pvc.\n\n```bash\nstudent@lfs458-node-1oa0:~$\
    \ kubectl delete nginx-nfs\ndeployment.apps/\"nginx-nfs\" deleted\n```\n\n```bash\n\
    student@lfs458-node-1oa0:~$ kubectl delete pvc-one\npersistentvolumeclaim \"pvc-one\"\
    \ deleted\n```\n\n```bash\nstudent@lfs458-node-1oa0:~$ kubectl delete pv pvvol-1\n\
    persistentvolume \"pvvol-1\" deleted\n```\n\n- 2. Create a yaml for the ResourceQuota\
    \ object. Set the storage limit to limit claims with a total of 500Mi.\n\n```bash\n\
    student@lfs458-node-1oa0:~$ vim storage-quota.yaml\n```\n\n```yaml\napiVersion:\
    \ v1\nkind: ResourceQuota\nmetadata:\n  name: storagequota\nspec:\n  hard:\n \
    \   persistentvolumeclaims: \"10\"\n    requests.storage: \"500Mi\"\n```\n\n![](img/7b8a27c9e8a5a4b2faa64ee2b38e8e6d_71_0.png)\n\
    \n3. Create a new namespace small. View the namespace information prior to the\
    \ new quota. Either the long name with double dashes --namespace or the nickname\
    \ as work for the resource.\n\n```bash\nstudent@lfs458-node-la0a~$ kubectl create\
    \ namespace small\nnamespace/small created\n```\n\n```bash\nstudent@lfs458-node-la0a~$\
    \ kubectl describe ns small\nName:\n  small\nLabels:\n  <none>\nAnnotations:\n\
    \  <none>\nStatus:\n  Active\n\nNo resource quota.\n```\n\nNo resource limits.\n\
    \n4. Create a new pv and pvc in the small namespace.\n\n```bash\nstudent@lfs458-node-la0a~$\
    \ kubectl create -f pvol.yaml -n small\npersistentvolume/pvvol-1 created\n```\n\
    \n```bash\nstudent@lfs458-node-la0a~$ kubectl create -f pvc.yaml -n small\nppersistentvolumeclaim/pvc-one\
    \ created\n```\n\n5. Create the new resource quota, placing it inside the low-usage\
    \ namespace.\n\n```bash\nstudent@lfs458-node-la0a~$ kubectl create -f storage-quota.yaml\
    \ \\\n  n small\nresourcequota/storage-quota created\n```\n\n6. Verify the small\
    \ namespace has quotas. Compare the output to the same command above.\n\n```bash\n\
    student@lfs458-node-la0a~$ kubectl describe ns small\nName:\n  small\nLabels:\n\
    \  <none>\nAnnotations:\n  <none>\nStatus:\n  Active\n```\n\n| Resource Quotas\
    \ | | storagequota |\n| --- | --- | --- |\n| persistentvolumeclaims | 1 | 10 |\n\
    | requests.storage | 200Mi | 500Mi |\n\nNo resource limits.\n\n7. Remove the namespace\
    \ line from the nfs-pod.yaml file. Should be around line 11 or so. This will allow\
    \ you to pass other namespaces on the command line.\n\n```bash\nstudent@lfs458-node-la0a~$\
    \ vim nfs-pod.yaml\n```\n\n8. Create the container.\n\n```bash\nstudent@lfs458-node-la0a~$\
    \ kubectl create -f nfs-pod.yaml \\\n  n small\ndeployment.apps/nginx-nfs created\n\
    ```\n\n9. Determine if the deployment has a running pod.\n\n# CHAPTER 9. VOLUMES\
    \ AND DATA\n\n```bash\nstudent@lfs458-node-1a0:$ kubectl get deploy --namespace=small\n\
    DESIRED CURRENT UP-TO-DATE AVAILABLE AGE\nnginx-nfs 1 1 0 43s\n```\n\n```bash\n\
    student@lfs458-node-1a0:$ kubectl -n small describe deploy \\\n  nginx-nfs\n<output_omitted>\n\
    ```\n\n- 10. Look to see if the pods are ready.\n\n```bash\nstudent@lfs458-node-1a0:$\
    \ kubectl get po -n small\nNAME READY RESTARTS AGE\nnginx-nfs-1054079768-s8g28\
    \ 1/1 0 3m\n```\n*(Note: The OCR \"STATUS\" was corrected to \"READY\" based on\
    \ standard kubectl output format)*\n\n- 11. Ensure the pod is running and using\
    \ the namespace.\n\n```bash\nstudent@lfs458-node-1a0:$ kubectl describe pod -n\
    \ small\nName:               nginx-nfs-1054079768-s8g28\nNamespace:          default\n\
    Node:               ifs458-worker/10.128.0.5\n```\n\n```\n<output_omitted>\nMounts:\n\
    \  /opt from nfs-vol (rw)\n```\n\n```\n<output_omitted>\nVolumes:\n  nfs-vol:\n\
    \    Type:               PersistentVolumeClaim (a reference to a PersistentV...\n\
    \    ClaimName:         pvc-one\n    ReadOnly:           false\n```\n\n- 12. View\
    \ the status of the PVC.\n\n```bash\nstudent@lfs458-node-1a0:$ kubectl get pvc\
    \ -n small\nNAME             STATUS CAPACITY ACCESS MODES STORAGECLASS AGE\npvc-one\
    \           Bound   pvvol-1  1Gi       RW                    2m\n```\n\n- 13.\
    \ Create a 30MB file in the /opt directory. Note the size.\n\n```bash\nstudent@lfs458-node-1a0:$\
    \ dd if=/dev/zero of=/opt/testfile bs=1M count=30\n```\n\n```\n<output_omitted>\n\
    Resource Quotas:\nstoragequota\n  Hard:\n    persistentvolumeclaims: 10\n    requests.storage:\
    \ 500Mi\n  Current:\n    persistentvolumeclaims: 1\n    requests.storage: 30Mi\n\
    ```\n\n- 14. Now let us illustrate what happens when the deployment is more than\
    \ the quota.\n\n```bash\nstudent@lfs458-node-laa0a: kubectl get deploy -n small\n\
    DESIRED CURRENT UP-TO-DATE AVAILABLE AGE\nnginx-nfs 1 1 0 43s\n```\n\n```bash\n\
    student@lfs458-node-laa0a:~$ kubectl delete -n small nginx-nfs\ndeployment.apps/nginx-nfs\
    \ deleted\n```\n\n- 15. Once the pod is shut down, the resource usage is not counted.\n\
    \n```bash\nstudent@lfs458-node-laa0a:~$ kubectl describe ns small\n<output_omitted>\n\
    ```\n\n- 16. Remove the pvc if you no longer need it.\n\n```bash\nstudent@lfs458-node-laa0a:~$\
    \ kubectl get pvc -n small\nNAME STATUS ACCESS MODES STORAGECLASS AGE\npvc-one\
    \           Bound   pvvol-1  1Gi       RW                    2m\n```\n\n```bash\n\
    student@lfs458-node-laa0a:~$ kubectl delete -n small pvc-one\npersistentvolumeclaim\
