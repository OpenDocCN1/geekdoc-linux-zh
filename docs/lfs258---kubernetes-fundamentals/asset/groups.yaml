    23. Experiment with other subcommands in both contexts. They should match those
    listed in the respective roles.


    # Exercise 16.3: Admission Controllers


    The last stop before a request is sent to the API server is an admission control
    plug-in. They interact with features such as setting parameters like a default
    storage class, checking resource quotas, or security settings. A newer feature
    (v1.7.x) is dynamic controllers which allow new controllers to be ingested or
    configured at runtime.


    +   1. View the current controller settings. Unlike earlier versions of Kubernetes
    the controllers are now compiled into the server, instead of a list of controllers
    to use we can enable disable specific plugins.


    ```

    student@lfs458-node-1oa0:$ sudo grep admission \\n  /etc/kubernetes/manifests/kube-apiserver.yaml\n  --disable-admission-plugins=PersistentVolumeLabel\n  --enable-admission-plugins=NodeRestriction

    ```'
