- md: "\n## Chapter 13\n\n## Custom Resource Definition\n\n### 13.1 Labs\n\n### Exercise\
    \ 13.1: Create a Custom Resource Definition\n\n## Overview\n\nThirdPartyResource\
    \ is no longer included with the API in v1.8 and its use will return a validation\
    \ error. If you have upgraded from a previous version to Kubernetes v1.7, you\
    \ will need to convert them to CustomResources (CRD). A new resource often requires\
    \ a controller to manage it. Creation of the controller is beyond the scope of\
    \ this course, basically it is a watch-loop comparing a spec file to the current\
    \ state and making changes until the state matches. A good discussion of creating\
    \ a controller can be found here: https://coreos.com/blog/introducing-operators.html.\n\
    \n## Create a Custom Resource Definition\n\nWe will make a simple CRD, but without\
    \ any particular action. It will be enough to find the object ingested into the\
    \ API and responding to commands.\n\n- 1. We create a new YAML file.\n\n```\n\
    student@lfs45-node-la0a:~$ vim crd.yaml\n```\n\n```yaml\napiVersion: apiextensions.k8s.io/v1beta1\n\
    kind: CustomResourceDefinition\nmetadata:\n  name: crontabs.training.lfs45.com\n\
    \  # This name must match names below.\n  # <plural>.<group> syntax\nspec:\n \
    \ scope: Cluster #Could also be Namespaced\n  group: training.lfs45.com\n```\n\
    \n- 2. Add the new resource to the cluster.\n\n```yaml\nversion: v1\nnames:\n\
    \  kind: CronTab          #Typically CamelCased for resource manifest\n  plural:\
    \ crontabs      #Shown in URL\n  singular: crontab     #Short name for CLI alias\n\
    \  shortNames:\n    - ct               #CLI short name\n```\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl create -f crd.yaml\ncustomresourcedefinition.apiextensions.k8s.io/crontabs.training.lfs458.com\n\
    created\n```\n\n- 3. View and describe the resource. The `describe` output is\
    \ unlike other objects we have seen so far.\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl get crd\nNAME                                            CREATED\ncrontabs.training.lfs458.com\
    \   2018-08-03T05:25:20Z\n```\n\n```\nstudent@lfs458-node-1ia0a$ kubectl describe\
    \ crd crontab<Tab>\nName:              crontabs.training.lfs458.com\nNamespace:\n\
    Labels:            <none>\nAnnotations:       <none>\nAPI Version:       apiextensions.k8s.io/v1\n\
    Kind:               CustomResourceDefinition\n<output_omitted>\n```\n\n- 4. Now\
    \ that we have an API resource we can create a new type of object. In this case\
    \ it will be a crontab-like image, which does not yet exist, but is used for demonstration.\n\
    \n```yaml\napiVersion: \"training.lfs458.com/v1\"\n  # This is from the group\
    \ and version of new CRD\nkind: CronTab\n  # The kind from the new CRD\nmetadata:\n\
    \  name: new-cron-object\nspec:\n  cronSpec: \"*/5 * * *\"\n  image: some-cron-image\n\
    \  # Does not exist\n```\n\n- 5. Create the new object and the resource using\
    \ short and long name.\n\n```\nstudent@lfs458-node-1ia0a$ kubectl create -f new-crontab.yaml\n\
    crontab.training.lfs458.com/new-cron-object created\n```\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl get CronTab\nNAME             AGE\nnew-cron-object   22s\n```\n\n```\n\
    student@lfs458-node-1ia0a$ kubectl get ct\nNAME             AGE\nnew-cron-object\
    \   29s\n```\n\n```\nstudent@lfs458-node-1ia0a$ kubectl describe ct\n```\n\n###\
    \ 13.1. LABS\n\n```\nName: new-object\nNamespace: <none>\nLabels: <output_omitted>\n\
    Spec:\nCron Spec: */5 * * * *\nImage: some-cron-image\nEvents: <none>\n```\n\n\
    - 6. Clean up the resources we will delete the CRD. This should delete all of\
    \ the endpoints and objects using it as well.\n\n```\nstudent@lfs458-node-la0a:~\
    \ kubectl delete -f crd.yaml\ncustomresourcedefinition.apiextensions.k8s.io\n\"\
    crontabs.training.lfs458.com\" deleted\n```\n\n```\nstudent@lfs458-node-la0a:~\
    \ kubectl get ct\nError from server (NotFound): Unable to list \"crontabs\": the\
    \ server\ncould not find the requested resource\n(get crontabs.training.lfs458.com)\n\
    ```\n\n## Chapter 14\n\n## Kubernetes Federation\n\n### 14.1 Labs\n\nThere is\
    \ no lab to complete for this chapter.\n\n## Chapter 15\n\n## Helm\n\n### 15.1\
    \ Labs\n\n### Exercise 15.1: Working with Helm and Charts\n\n## Overview\n\nhelm\
    \ allows for easy deployment of complex configurations. This could be handy for\
    \ a vendor to deploy a multi-part application in a single step. Through the use\
    \ of a Chart, or template file, the required components and their relationships\
    \ are declared. Local agents like Tiller to create objects on your behalf. Effectively\
    \ its orchestration. There are few ways to install Helm. The newest version may\
    \ require building from source. Once installed we will deploy a Chart, which will\
    \ configure our cluster.\n\n## Install Helm\n\n- 1. On the master node use wget\
    \ to download the compressed file. The URL below is for: https://storage.googleapis.com/kubernetes-helm/helm-v2.7.0-linux-amd64.gz\n\
    \n```\nstudent@lfs458-node-la0a~$ wget https://storage.googleapis.com/kubernetes-helm/helm-v2.7.0-linux-amd64.gz\n\
    [output omitted]\n100%[=================>] 11.6MB/s    0.1s 2018-08-03 05:34:56\
    \ (117 MB/s) saved\n```\n\n- 2. Uncompress and expand the file:\n\n```\nstudent@lfs458-node-la0a~$\
    \ tar -xvf helm-v2.7.0-linux-amd64.gz\nlinux-amd64/\nlinux-amd64/README.md\nlinux-amd64/helm\n\
    linux-amd64/LICENSE\n```\n\n- 3. Copy the helm binary to the `/usr/local/bin/`\
    \ directory so it is usable via the shell path.\n\n```\nstudent@lfs458-node-0a$\
    \ sudo cp linux-amd64/helm /usr/local/bin/\n```\n\n- 4. Due to RBAC configuration\
    \ helm is unable to run in the default namespace. In initialization you could\
    \ create a new namespace. In this we will create a service account.\n\n```\nstudent@lfs458-node-0a$\
    \ kubectl create serviceaccount \\\n    --namespace kube-system tiller\n```\n\n\
    - 5. Bind the serviceaccount to the admin role cluster-admin inside the kube-system\
    \ namespace.\n\n```\nstudent@lfs458-node-0a$ kubectl create clusterbinding \\\n\
    \    --clusterrole=cluster-admin \\\n    --account=cluster-admin \\\n    --serviceaccount=kube-system:tiller\n\
    ```\n\n- 6. Other RBAC issues may be encountered.\n\n```\nstudent@lfs458-node-0a$\
    \ helm init\n```\n\n- 7. Update the tiller-deployment to have the service account.\n\
    \n```\nstudent@lfs458-node-0a$ kubectl -n kube-system patch deployment \\\n  \
    \  tiller-deployment\n```\n\n- 8. Verify the tiller pod is running. Examine the\
    \ logs of the pod. Note that each line of logs contains a tag such as [main],\
    \ [storage].\n\n```\nstudent@lfs458-node-0a$ kubectl get pods --all-namespaces\n\
    kube-system    tiller-deployment-8b97f65c   1/1   30m\n```\n\n```\nstudent@lfs458-node-0a$\
    \ kubectl -n kube-system logs \\\n    tiller-deployment-8b97f65c\n```\n\n- 9.\
    \ View the available sub-charts for helm. As with Kubernetes tools, exploring\
    \ change.\n\n```\nstudent@lfs458-node-0a$ helm help\n```\n\n- 10. View the current\
    \ configuration files, archives and plugins for helm. Return to this directory\
    \ after you have worked with a Chart in the lab.\n\n### 15. LABS\n\n```\nstudent@lfs458-node-0a$\
    \ helm home\n/home/student/.\n```\n\n```\nstudent@lfs458-node-0a$ ls -R /home/student/\n\
    /home/student/:\ncache plugins repository\n/home/student/.helm:\narchive\n```\n\
    \n- 11. Verify helm is installed, also check the version installed.\n\n```\nstudent@lfs458-node-0a$\
    \ helm version\nClient: v2.7.0(GitCommit:08c114f533)\nServer: v2.7.0(GitCommit:08c114f533)\n\
    ```\n\n- 12. Ensure both are upgraded to the most recent stable version.\n\n```\n\
    student@lfs458-node-0a$ helm init --upgrade\n$HELM_HOME has been configured at\
    \ /home/student/.\n```\n\nTiller (The helm server-side component) has been upgraded\
    \ to the current version. Happy Helm!\n\n- 13. A Chart is a collection of containers\
    \ to deploy an application. There is a collection at https://github.com/kubernetes/charts/tree/master/stable,\
    \ provided by vendors, or you can make your own. Take a moment and view the current\
    \ charts. Search for available stable databases.\n\n| NAME | VERSION | DESCRIPTION\
    \ |\n| --- | --- | --- |\n| stable/cockrodb | 2.0.3 | CockroachDB is a scalable,\
    \ survivable database... |\n| stable/bitnami | 3.3.0 | Bitnami is a standards-compliant\
    \ database... |\n| stable/graphgraph | 0.2 | Open source, scalable graph database\
    \ |\n| stable/kubedb | 0.1 | DEPRECATED KubeDB by Apps - Making... |\n| stable/mariadb\
    \ | 5.2.3 | Fast, reliable, and easy to use... |\n\n- 14. We will install the\
    \ mariadb. Take a look at install details https://github.com/kubernetes/charts/tree/master/stable/mariadb-custom-config\
    \ - The debug option will allow a chart to use local. Note the name for deployment,\
    \ which will be illmanned-salamander. The output will typically suggest ways to\
    \ access software. As well we will not persist persistent storage, which would\
    \ typically require us to create an available.\n\n```\nstudent@lfs458-node-0a$\
    \ helm install stable/mariadb \\\n  --set persistence.enabled=false \\\n  --set\
    \ persistence.enabled=false\n```\n"
  mdcn: "\n\n## 第 13 章\n\n## 自定义资源定义 (Custom Resource Definition)\n\n### 13.1 实验\n\
    \n### 练习 13.1：创建一个自定义资源定义\n\n## 概述\n\n`ThirdPartyResource` 不再包含在 v1.8 版本的 API\
    \ 中，使用它将返回验证错误。如果您从之前的版本升级到 Kubernetes v1.7，您将需要将它们转换为自定义资源 (CRD)。新资源通常需要一个控制器（controller）来管理。创建控制器的范围超出了本课程的范围，基本上它是一个监听循环（watch-loop），通过比较\
    \ spec 文件与当前状态并进行更改，直到状态匹配为止。关于创建控制器的良好讨论，可以在此处找到：https://coreos.com/blog/introducing-operators.html。\n\
    \n## 创建自定义资源定义\n\n我们将创建一个简单的 CRD，但不包含任何特定操作。只需找到被摄入 API 并响应命令的对象就足够了。\n\n- 1.\
    \ 我们创建一个新的 YAML 文件。\n\n```\nstudent@lfs45-node-la0a:~$ vim crd.yaml\n```\n\n```yaml\n\
    apiVersion: apiextensions.k8s.io/v1beta1\nkind: CustomResourceDefinition\nmetadata:\n\
    \  name: crontabs.training.lfs45.com\n  # 此名称必须与下面的名称匹配。\n  # <plural>.<group>\
    \ 语法\nspec:\n  scope: Cluster # 也可以是 Namespaced\n  group: training.lfs45.com\n\
    ```\n\n- 2. 将新资源添加到集群中。\n\n```yaml\nversion: v1\nnames:\n  kind: CronTab     \
    \     # 资源清单通常使用大驼峰命名法\n  plural: crontabs      # 在 URL 中显示\n  singular: crontab\
    \     # CLI 别名的短名\n  shortNames:\n    - ct               # CLI 短名\n```\n\n```\n\
    student@lfs458-node-1ia0a$ kubectl create -f crd.yaml\ncustomresourcedefinition.apiextensions.k8s.io/crontabs.training.lfs458.com\n\
    created\n```\n\n- 3. 查看并描述资源。`describe` 的输出与我们目前为止看到的其他对象不同。\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl get crd\nNAME                                            CREATED\ncrontabs.training.lfs458.com\
    \   2018-08-03T05:25:20Z\n```\n\n```\nstudent@lfs458-node-1ia0a$ kubectl describe\
    \ crd crontab<Tab>\nName:              crontabs.training.lfs458.com\nNamespace:\n\
    Labels:            <none>\nAnnotations:       <none>\nAPI Version:       apiextensions.k8s.io/v1\n\
    Kind:               CustomResourceDefinition\n<output_omitted>\n```\n\n- 4. 现在我们有了一个\
    \ API 资源，可以创建一个新类型的对象。在这种情况下，它是一个类似于 crontab 的镜像，它尚不存在，但用于演示。\n\n```yaml\napiVersion:\
    \ \"training.lfs458.com/v1\"\n  # 这来自新 CRD 的组和版本\nkind: CronTab\n  # 来自新 CRD 的\
    \ kind\nmetadata:\n  name: new-cron-object\nspec:\n  cronSpec: \"*/5 * * *\"\n\
    \  image: some-cron-image\n  # 不存在\n```\n\n- 5. 使用短名和长名创建新对象和资源。\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl create -f new-crontab.yaml\ncrontab.training.lfs458.com/new-cron-object\
    \ created\n```\n\n```\nstudent@lfs458-node-1ia0a$ kubectl get CronTab\nNAME  \
    \           AGE\nnew-cron-object   22s\n```\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl get ct\nNAME             AGE\nnew-cron-object   29s\n```\n\n```\nstudent@lfs458-node-1ia0a$\
    \ kubectl describe ct\n```\n\n### 13.1. 实验\n\n```\nName: new-object\nNamespace:\
    \ <none>\nLabels: <output_omitted>\nSpec:\nCron Spec: */5 * * * *\nImage: some-cron-image\n\
    Events: <none>\n```\n\n- 6. 清理资源，我们将删除该 CRD。这应该也会删除所有使用它的端点和对象。\n\n```\nstudent@lfs458-node-la0a:~\
    \ kubectl delete -f crd.yaml\ncustomresourcedefinition.apiextensions.k8s.io\n\"\
    crontabs.training.lfs458.com\" deleted\n```\n\n```\nstudent@lfs458-node-la0a:~\
    \ kubectl get ct\nError from server (NotFound): Unable to list \"crontabs\": the\
    \ server\ncould not find the requested resource\n(get crontabs.training.lfs458.com)\n\
    ```\n\n## 第 14 章\n\n## Kubernetes 联邦 (Federation)\n\n### 14.1 实验\n\n本章没有需要完成的实验。\n\
    \n## 第 15 章\n\n## Helm\n\n### 15.1 实验\n\n### 练习 15.1：使用 Helm 和 Charts\n\n## 概述\n\
    \nHelm 允许轻松部署复杂的配置。这对于供应商单步部署多部分应用程序可能非常方便。通过使用 Chart（或模板文件），可以声明所需的组件及其关系。本地代理（如\
    \ Tiller）会代表你创建对象。实际上是它的编排工具。安装 Helm 的方法有几种。最新版本可能需要从源码编译。安装后，我们将部署一个 Chart，它将配置我们的集群。\n\
    \n## 安装 Helm\n\n- 1. 在主节点上使用 `wget` 下载压缩文件。下面的 URL 用于：https://storage.googleapis.com/kubernetes-helm/helm-v2.7.0-linux-amd64.gz\n\
    \n```\nstudent@lfs458-node-la0a~$ wget https://storage.googleapis.com/kubernetes-helm/helm-v2.7.0-linux-amd64.gz\n\
    [output omitted]\n100%[=================>] 11.6MB/s    0.1s 2018-08-03 05:34:56\
    \ (117 MB/s) saved\n```\n\n- 2. 解压并扩展文件：\n\n```\nstudent@lfs458-node-1ia0a$ tar\
    \ -xvf helm-v2.7.0-linux-amd64.gz\n```\n*(注：此处根据上下文补全了可能的命令 tar -xvf)*\n```\n\
    student@lfs458-node-1ia0a~$ tar -xvf helm-v2.7.0-linux-amd64.gz\nhelm-v2.7.0-linux-amd64/\n\
    ```\n\n- 3. 将二进制文件复制到 `/usr/local/bin`。\n\n```\nstudent@lfs458-node-1ia0a$ sudo\
    \ cp helm-v2.7.0-linux-amd64/helm /usr/local/bin/\n```\n\n- 4. 检查权限。\n\n```\n\
    student@lfs458-node-1ia0a$ ls -l /usr/local/bin/helm\n```\n\n- 5. 初始化 Tiller。\n\
    \n```\nstudent@lfs458-node-1ia0a$ helm init\n```\n\n- 6. 为 kube-system 空间创建服务账户。\n\
    \n```\nstudent@lfs458-node-1ia0a$ kubectl create serviceaccount tiller -n kube-system\n\
    ```\n\n- 7. 为 Tiller 绑定角色。\n\n```\nstudent@lfs458-node-1ia0a$ kubectl create clusterbinding\
    \ tiller-admin \\\n  --role=cluster-admin \\\n  --serviceaccount=kube-system:tiller\n\
