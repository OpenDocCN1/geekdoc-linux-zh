    \n```\nstudent@lfs458-node-ia0a:~$ kubectl get pod -L system\nNAME READY STATUS\
    \ RESTARTS AGE SYSTEM\nrs-one-3c6pb 1/1 Running 0 5m IsolatedPod\nrs-one-2p9x4\
    \ 1/1 Running 0 7m ReplicaOne\nrs-one-3c6pb 1/1 Running 0 7m ReplicaOne\n```\n\
    \n- 13. 删除 ReplicaSet，但保留 Pods。\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl delete\
    \ rs rs-one --cascade=false\nreplicaset.extensions \"rs-one\" deleted\n```\n\n\
    查看 ReplicaSet 和 Pods：\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl describe rs\
    \ rs-one\nError from server (NotFound): replicasets.extensions \"rs-one\" not\
    \ found\n```\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl get pods\n```\n\n- 14.\
    \ 再次查看 ReplicaSet。它看到正在运行的 Pod。\n\n```\nstudent@lfs458-node-ia0a:~$ kubectl get\
    \ pods\nNAME READY STATUS\nAGE\nrs-one-2p9x4 1/1 Running 0 8m\nrs-one-3c6pb 1/1\
    \ Running 0 8m\n```\n\n- 15. 查看 ReplicaSet。 Pods\n```。\n\n```\n\nfs555----0\n\n\
