- md: "\n23. Experiment with other subcommands in both contexts. They should match\
    \ those listed in the respective roles.\n\n# Exercise 16.3: Admission Controllers\n\
    \nThe last stop before a request is sent to the API server is an admission control\
    \ plug-in. They interact with features such as setting parameters like a default\
    \ storage class, checking resource quotas, or security settings. A newer feature\
    \ (v1.7.x) is dynamic controllers which allow new controllers to be ingested or\
    \ configured at runtime.\n\n- 1. View the current controller settings. Unlike\
    \ earlier versions of Kubernetes the controllers are now compiled into the server,\
    \ instead of a list of controllers to use we can enable disable specific plugins.\n\
    \n```bash\nstudent@lfs458-node-1oa0:$ sudo grep admission /etc/kubernetes/manifests/kube-apiserver.yaml\n\
    \  --disable-admission-plugins=PersistentVolumeLabel\n  --enable-admission-plugins=NodeRestriction\n\
    ```\n"
  mdcn: "\n\n23. 在两种环境下尝试其他的子命令。它们应该与各自角色中列出的命令匹配。\n\n# 练习 16.3：准入控制器 (Admission Controllers)\n\
    \n请求发送到 API 服务器之前的最后是准入控制插件。它们与功能交互，例如设置默认存储类、检查资源配额或安全设置。一个较新的特性（v1.7.x）是动态控制器，它允许在运行时摄取或配置新的控制器。\n\
    \n- 1. 查看当前的控制器设置。与早期版本的 Kubernetes 不同，控制器现在被编译到服务器中，我们不再通过控制器列表来使用，而是可以启用或禁用特定的插件。\n\
    \n```bash\nstudent@lfs458-node-1oa0:$ sudo grep admission /etc/kubernetes/manifests/kube-apiserver.yaml\n\
    \  --disable-admission-plugins=PersistentVolumeLabel\n  --enable-admission-plugins=NodeRestriction\n\
    ```\n"
