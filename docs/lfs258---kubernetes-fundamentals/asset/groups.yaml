- md: "\n## Exercise 16.2: Authentication and Authorization\n\nKubernetes clusters\
    \ have types of user service accounts and normal users, but normal users are assumed\
    \ to be managed by an external service. There are no objects to represent them\
    \ and they can be added via an API call, service accounts can be added.\n\nWe\
    \ will use RBAC to configure actions within a namespace for a new contractor,\
    \ Developer Dan will be working on a new project.\n\n- 1. Create two namespaces,\
    \ one for production and the other development.\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ kubectl create ns development\nnamespace \"development\" created\n\nstudent@fs458-node-ia0a~$\
    \ kubectl create ns production\nnamespace \"production\" created\n```\n\n- 2.\
    \ View the cluster context. The context allows you to configure the cluster to\
    \ use, namespace and user for kubectl commands in an easy manner.\n\n```bash\n\
    student@fs458-node-ia0a~$ kubectl config get-contexts\nCURRENT NAME CLUSTER AUTHINFO\n\
    kubernetes@kubernetes kubernetes-admin\n```\n\n- 3. Create a new user DevDan and\
    \ assign a password of lfs458.\n\n```bash\nstudent@fs458-node-ia0a~$ sudo useradd\
    \ -s /bin/bash DevDan\nstudent@fs458-node-ia0a~$ sudo password DevDan\nEnter new\
    \ UNIX password: lfs458\nRetype new UNIX password: lfs458\npassword updated successfully\n\
    ```\n\n- 4. Generate a private key then Certificate Signing Request (CSR) for\
    \ DevDan.\n\n```bash\nstudent@fs458-node-ia0a~$ openssl req -out DevDan.key \\\
    \nGenerating RSA key, 2048 bits modulus\n****\n****\ne is 65537 (0x10001)\n```\n\
    \n```bash\nstudent@fs458-node-ia0a~$ openssl req -key DevDan.key \\\n-out DevDan.csr\
    \ -subj \"CN=DevDan/O=development\"\n```\n\nUsing the newly created request generate\
    \ a self-signed certificate using the x509 protocol. Use the CA keys for the Kubernetes\
    \ cluster and set 1 year expiration. You will need to access the inbound files.\n\
    \n```bash\nstudent@fs458-node-ia0a~$ openssl x509 -req -key DevDan.key \\\n-CA\
    \ /etc/kubernetes/pki/ca.crt \\\n-CAkey /etc/kubernetes/pki/ca.key \\\n-CAcreateserial\
    \ \\\n-days 365\nSignature ok\nsubject=CN=DevDan/O=development\nGetting CA Private\
    \ Key\n```\n\n- 6. Update the access config to reference the new key and certificate.\
    \ Normally we will need to make a safety directory home of a non-root user.\n\n\
    ```bash\nstudent@fs458-node-ia0a~$ kubectl config set-credentials DevDan \\\n\
    --client-certificate=/home/student/DevDan.crt \\\n--client-key=/home/student/DevDan.key\n\
    User \"DevDan\" set.\n```\n\n## 16. LABS\n\n7. View the update to your credentials\
    \ file. Use **diff** to compare against the copy we made earlier.\n\n```bash\n\
    student@e1fs458-node-1a0a:~$ diff cluster-api-config .kube/config\n9a10,14\n \
    \ namespace: development\n  user: DevDan\n  name: DevDan-context\n  context:\n\
    \    cluster: kubernetes\n15a21,25\n  name: DevDan\n  user:\n    az-user-certificate:\
    \ /home/student/DevDan.crt\n    client-key: /home/student/DevDan.key\n```\n\n\
    8. We will now create for this we will need the name of the cluster, namespace\
    \ and CN of the user we set or in previous steps.\n\n```bash\nstudent@e1fs458-node-1a0a:~$\
    \ kubectl config set-context DevDan-context \\\n  --cluster=kubernetes \\\n  --namespace=development\
    \ \\\n  --user=DevDan\nContext \"DevDan-context\" created.\n```\n\n9. Attempt\
    \ to view the Pods inside the DevDan-context. Be aware you will get an error.\n\
    \n```bash\nstudent@e1fs458-node-1a0a:~$ kubectl --context=DevDan-context get pods\n\
    Error from server (Forbidden) is forbidden: user \"DevDan\"\ncannot list pods\
    \ in the namespace \"development\"\n```\n\n10. Verify the context has been properly\
    \ set.\n\n| CURRENT | NAME | CLUSTER | AUTHINFO | NAMESPACE |\n|------|---|---|---|---|\n\
    | DevDan-context | kubernetes | DevDan | | development |\n| * | | admin-admin\
    \ | | |\n\n11. Again check the changes to the cluster access config.\n\n```bash\n\
    student@e1fs458-node-1a0a:~$ diff cluster-api-config .kube/config\n9a10,14\n \
    \ namespace: development\n  user: DevDan\n  name: DevDan-context\n  context:\n\
    \    cluster: kubernetes\n15a21,25\n  name: DevDan\n  user:\n    <output_omitted>\n\
    ```\n\n12. We will now create a YAML file to establish RBAC rules to a particular\
    \ namespace and Role.\n\n```bash\nstudent@lfs458-node-1a0a:~$ vim role-dev.yaml\n\
    kind: Role\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n  namespace:\
    \ developer\n  name: developer\nrules:\n  - apiGroups: [\"\",\"extensions\", \"\
    apps\" ]\n    resources: [\"deployments\", \"replicasets\", \"pods\" ]\n    verbs:\
    \ [\"list\", \"get\", \"watch\", \"create\", \"update\", \"patch\", \"delete\"\
    ]\n  # You can use [\"*\"] for all verbs\n```\n\n13. Create the object. Check\
    \ white space and for typos you encounter errors.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl create -f role-dev.yaml\nrole.rbac.authorization.k8s.io/created\n```\n\
    \n14. Now create a RoleBinding to associate the Role you created with a user.\
    \ Create the file.\n\n```bash\nstudent@lfs458-node-1a0a~$ vim rolebind.yaml\n\
    kind: RoleBinding\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n  name:\
    \ developer-rolebinding\n  namespace: development\nsubjects:\n  - kind: User\n\
    \    name: DevDan\nroleRef:\n  kind: Role\n  name: developer\n  apiGroup: rbac.authorization.k8s.io\n\
    ```\n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl apply -f rolebind.yaml\nrolebinding.rbac.authorization.k8s.io/developer-rolebinding\
    \ created\n```\n\n15. Test the action. This time should work.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl --context=DevDan get pods\nNo resources.\n```\n\n16. Create a new pod,\
    \ verify it, then delete it.\n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl --context=DevDan\
    \ run nginx --image=nginx\ndeployment.apps/nginx created\n\nstudent@lfs458-node-1a0a~$\
    \ kubectl --context=DevDan get pods\nNAME    READY   STATUS    RESTARTS   AGE\n\
    nginx-7c8d  1/1   Running          0s\n\nstudent@lfs458-node-1a0a~$ kubectl --context=DevDan\
    \ delete nginx\ndeployment.apps/nginx deleted\n```\n\n17. Now create a role for\
    \ production. The existing Role will have the ability to view, not create.\n\n\
    ```bash\nstudent@lfs458-node-1a0a~$ vim role-prod.yaml\nkind: Role\napiVersion:\
    \ rbac.authorization.k8s.io/v1\nmetadata:\n  name: dev-prod\n  namespace: production\n\
    rules:\n  - apiGroups: [\"\",\"extensions\", \"apps\" ]\n    resources: [\"deployments\"\
    , \"replicasets\", \"pods\" ]\n    verbs: [\"list\", \"get\", \"watch\"]\n```\n\
    \n18. Create new objects. \n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl apply\
    \ -f role-prod.yaml\nrole.rbac.authorization.k8s.io/dev-prod created\n```\n\n\
    ```bash\nstudent@lfs458-node-1a0a~$ kubectl apply -f rolebind.yaml\nrolebinding.rbac.authorization.k8s.io/production-rolebinding\
    \ created\n```\n\n19. Create the context for production use.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl config set-context ProdDan-context \\\n  --cluster=kubernetes \\\n \
    \ --namespace=production \\\n  --user=DevDan\nContext \"ProdDan-context\" created.\n\
    ```\n\n20. Verify that DevDan can view pods using the new context.\n\n```bash\n\
    student@lfs458-node-1a0a~$ kubectl --context=ProdDan-context get pods\nNo resources\
    \ found.\n```\n\n21. Try to create a pod in production. The developer should be\
    \ Forbidden.\n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl --context=ProdDan-context\
    \ run nginx --image=nginx\nError from server (Forbidden): extensions is forbidden:\
    \ User \"DevDan\"\ncreate deployment extensions in the namespace \"production\"\
    \n```\n\n22. View the details of a role.\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl describe role dev-prod -n production\nName:\n  dev-prod\nLabels:\n \
    \ <none>\nAnnotations:\n  kubernetes.io/last-applied-configuration:\n  {\"apiVersion\"\
    :\"rbac.authorization.k8s.io/v1\", \"kind\": \"Role\",\n  \"metadata\": {\"name\"\
    : \"dev-prod\", \"namespace\": \"production\"},\n  \"rules\":{\n    \"PolicyRule\"\
    :\n    \"Resources\": [\"deployments\", \"replicasets\", \"pods\"],\n    \"Non-Resource\
    \ URLs\": [],\n    \"Names\": [],\n    \"Verbs\": [\"list\", \"get\", \"watch\"\
    ]\n  }]}\n```\n"
  mdcn: "\n\n## 练习 16.2：身份验证与授权\n\nKubernetes 集群有类型的用户服务账户和普通用户，但假设普通用户是由外部服务管理的。没有对象来表示这些普通用户，它们可以通过\
    \ API 调用添加，而服务账户也可以被添加。\n\n我们将使用 RBAC 为新的承包商在命名空间内配置操作，该人员 Developer Dan 将参与一个新项目。\n\
    \n- 1. 创建两个命名空间，一个用于生产环境（production），另一个用于开发环境（development）。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ kubectl create ns development\nnamespace \"development\" created\n\nstudent@fs458-node-ia0a~$\
    \ kubectl create ns production\nnamespace \"production\" created\n```\n\n- 2.\
    \ 查看集群上下文。context 允许你方便地配置 kubectl 命令所使用的集群、命名空间和用户。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ kubectl config get-contexts\nCURRENT NAME CLUSTER AUTHINFO\nkubernetes@kubernetes\
    \ kubernetes-admin\n```\n\n- 3. 创建一个新用户 DevDan 并分配密码 lfs458。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ sudo useradd -s /bin/bash DevDan\nstudent@fs458-node-ia0a~$ sudo password DevDan\n\
    Enter new UNIX password: lfs458\nRetype new UNIX password: lfs458\npassword updated\
    \ successfully\n```\n\n- 4. 为 DevDan 生成私钥然后生成证书签名请求 (CSR)。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ openssl req -out DevDan.key \\\nGenerating RSA key, 2048 bits modulus\n****\n\
    ****\ne is 65537 (0x10001)\n```\n\n```bash\nstudent@fs458-node-ia0a~$ openssl\
    \ req -key DevDan.key \\\n-out DevDan.csr -subj \"CN=DevDan/O=development\"\n\
    ```\n\n使用新创建的请求通过 x509 协议生成自签名证书。使用 Kubernetes 集群的 CA 密钥并设置 1 年有效期。你需要访问输入文件。\n\
    \n```bash\nstudent@fs458-node-ia0a~$ openssl x509 -req -key DevDan.key \\\n-CA\
    \ /etc/kubernetes/pki/ca.crt \\\n-CAkey /etc/kubernetes/pki/ca.key \\\n-CAcreateserial\
    \ \\\n-days 365\nSignature ok\nsubject=CN=DevDan/O=development\nGetting CA Private\
    \ Key\n```\n\n- 6. 更新访问配置以引用新的密钥和证书。通常情况下我们需要为非 root 用户创建一个安全家目录。\n\n```bash\n\
    student@fs458-node-ia0a~$ kubectl config set-credentials DevDan \\\n--client-certificate=/home/student/DevDan.crt\
    \ \\\n--client-key=/home/student/DevDan.key\nUser \"DevDan\" set.\n```\n\n## 16.\
    \ 实验\n\n7. 查看你的凭据文件的更新。使用 **diff** 与我们之前创建的副本进行比较。\n\n```bash\nstudent@e1fs458-node-1a0a:~$\
    \ diff cluster-api-config .kube/config\n9a10,14\n  namespace: development\n  user:\
    \ DevDan\n  name: DevDan-context\n  context:\n    cluster: kubernetes\n15a21,25\n\
    \  name: DevDan\n  user:\n    az-user-certificate: /home/student/DevDan.crt\n\
    \    client-key: /home/student/DevDan.key\n```\n\n8. 我们现在要创建这个，我们需要之前步骤中设置的集群名称、命名空间和用户的\
    \ CN。\n\n```bash\nstudent@e1fs458-node-1a0a:~$ kubectl config set-context DevDan-context\
    \ \\\n  --cluster=kubernetes \\\n  --namespace=development \\\n  --user=DevDan\n\
    Context \"DevDan-context\" created.\n```\n\n9. 尝试查看 DevDan-context 内部的 Pods。注意你会得到一个错误。\n\
    \n```bash\nstudent@e1fs458-node-1a0a:~$ kubectl --context=DevDan-context get pods\n\
    Error from server (Forbidden) is forbidden: user \"DevDan\"\ncannot list pods\
    \ in the namespace \"development\"\n```\n\n10. 验证上下文已正确设置。\n\n| CURRENT | NAME\
    \ | CLUSTER | AUTHINFO | NAMESPACE |\n|------|---|---|---|---|\n| DevDan-context\
    \ | kubernetes | DevDan | | development |\n| * | | admin-admin | | |\n\n11. 再次检查集群访问配置的更改。\n\
    \n```bash\nstudent@e1fs458-node-1a0a:~$ diff cluster-api-config .kube/config\n\
    9a10,14\n  namespace: development\n  user: DevDan\n  name: DevDan-context\n  context:\n\
    \    cluster: kubernetes\n15a21,25\n  name: DevDan\n  user:\n    <output_omitted>\n\
    ```\n\n12. 我们现在将创建一个 YAML 文件，为特定的命名空间和角色建立 RBAC 规则。\n\n```bash\nstudent@lfs458-node-1a0a:~$\
    \ vim role-dev.yaml\nkind: Role\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n\
    \  namespace: developer\n  name: developer\nrules:\n  - apiGroups: [\"\",\"extensions\"\
    , \"apps\" ]\n    resources: [\"deployments\", \"replicasets\", \"pods\" ]\n \
    \   verbs: [\"list\", \"get\", \"watch\", \"create\", \"update\", \"patch\", \"\
    delete\"]\n  # 你可以使用 [\"*\"] 表示所有动词\n```\n\n13. 创建对象。检查空格，如果遇到拼写错误将会产生错误。\n\n\
    ```bash\nstudent@lfs458-node-1a0a~$ kubectl create -f role-dev.yaml\nrole.rbac.authorization.k8s.io/created\n\
    ```\n\n14. 现在创建一个 RoleBinding，将你创建的角色与用户关联。创建该文件。\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ vim rolebind.yaml\nkind: RoleBinding\napiVersion: rbac.authorization.k8s.io/v1\n\
    metadata:\n  name: developer-rolebinding\n  namespace: development\nsubjects:\n\
    \  - kind: User\n    name: DevDan\nroleRef:\n  kind: Role\n  name: developer\n\
    \  apiGroup: rbac.authorization.k8s.io\n```\n\n```bash\nstudent@lfs458-node-1a0a~$\
    \ kubectl apply -f rolebind.yaml\nrolebinding.rbac.authorization.k8s.io/developer-rolebinding\
    \ created\n```\n\n15. 测试该操作。这次应该可以运行。\n\n```bash\nstudent@lfs458-node-1a0a~$ kubectl\
    \ --context=DevDan get pods\nNo resources.\n```\n\n16. 创建一个新的 pod，验证它，然后删除它。\n\
    \n```bash\nstudent@fs458-node-ia0a~$ kubectl --context=DevDan run nginx --image=nginx\n\
    deployment.apps/nginx created\n\nstudent@fs458-node-ia0a~$ kubectl --context=DevDan\
    \ get pods\nNAME    READY   STATUS    RESTARTS   AGE\nnginx-7c8d  1/1   Running\
    \          0s\n\nstudent@fs458-node-ia0a~$ kubectl --context=DevDan delete nginx\n\
    ```\n\n17. 现在为生产生产环境创建一个角色。现有的角色将具有查看权限，而不是创建权限。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ vim role-prod.yaml\nkind: Role\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n\
    \  name: dev-prod\n  namespace: production\nrules:\n  - apiGroups: [\"\",\"extensions\"\
    , \"apps\" ]\n    resources: [\"deployments\", \"replicasets\", \"pods\" ]\n \
    \   verbs: [\"list\", \"get\", \"watch\"]\n```\n\n18. 创建新对象。\n\n```bash\nstudent@fs458-node-ia0a~$\
    \ kubectl apply -f role-prod.yaml\nrole.rbac.authorization.k8s.io/dev-prod created\n\
    ```\n\n```bash\nstudent@fs458-node-ia0a~$ kubectl apply -f rolebind.yaml\nrolebinding.rbac.authorization.k8s.io/production-rolebinding\
    \ created\n```\n\n19. 为生产使用创建上下文。\n\n```bash\nstudent@fs458-node-ia0a~$ kubectl\
    \ config set-context ProdDan-context \\\n  --cluster=kubernetes \\\n  --namespace=production\
    \ \\\n  --user=DevDan\nContext \"ProdDan-context\" created.\n```\n\n20. 验证 DevDan\
    \ 使用新上下文可以查看 pods。\n\n```bash\nstudent@fs458-node-ia0a~$ kubectl --context=ProdDan-context\
    \ get pods\nNo resources found.\n```\n\n21. 尝试在生产环境中创建 pod。开发者应该被拒绝（Forbidden）。\n\
    \n```bash\nstudent@fs458-node-ia0a~$ kubectl --context=ProdDan-context run nginx\
    \ --image=nginx\nError from server (Forbidden): extensions is forbidden: user\
    \ \"DevDan\"\ncreate deployment extensions in the namespace \"production\"\n```\n\
    \n22. 查看角色的详情。\n\n```bash\nstudent@fs458-node-1a0a~$ kubectl describe role dev-prod\
    \ -n production\nName:\n  dev-prod\nLabels:\n  <none>\nAnnotations:\n  kubernetes.io/last-applied-configuration:\n\
    \  {\"apiVersion\":\"rbac.authorization.k8s.io/v1\", \"kind\": \"Role\",\n  \"\
    metadata\": {\"name\": \"dev-prod\", \"namespace\": \"production\"},\n  \"rules\"\
    :{\n    \"PolicyRule\":\n    \"Resources\": [\"deployments\", \"replicasets\"\
    , \"pods\"],\n    \"Non-Resource URLs\": [],\n    \"Names\": [],\n    \"Verbs\"\
    : [\"list\", \"get\", \"watch\"]\n  }]}\n```\n\n"
