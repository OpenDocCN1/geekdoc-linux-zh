  md: "# # COMMUNITY\n\n# ## Get Involved\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_0.png)\n\
    \nLibreOffice's worldwide community – shown here at the LibreOffice Conference\
    \ in 2018 in Albania – promotes free software and open standards.\n\n+   -   *Encouraging\
    \ the translation, documentation, and maintenance of the LibreOffice software\
    \ in one's native language*\n+   -   *Promoting and actively participating in\
    \ the creation and development of open standards and Free Software via open and\
    \ transparent peer-review processes*\n\nAlthough the members of the LibreOffice\
    \ community hail from many different backgrounds, they all value personal choice\
    \ and transparency, which translates practically into wider compatibility, more\
    \ utility, and no end-user lock-in to a single product. They believe that free\
    \ software can provide better quality, higher reliability, increased security,\
    \ and greater flexibility than proprietary alternatives.\n\nThe community behind\
    \ LibreOffice is the heart of the project, without which it would not have the\
    \ resources to continue developing the LibreOffice software. The passion and drive\
    \ that every individual brings to the community results in collaborative development\
    \ that often exceeds the community’s own expectations. With dozens of different\
    \ but essential roles in the project, everyone is invited to join in the work\
    \ and help to make LibreOffice known and accessible to all.\n\nThe TDF statutes,\
    \ developed by the LibreOffice community members, guide the way they work and\
    \ encourage new members to contribute in a way that benefits both the whole community\
    \ as well as themselves. Through the use of copyleft licenses, such as the GNU\
    \ Lesser General Public License, Mozilla Public License, and Creative Commons\
    \ Attribution-ShareAlike License, the community commits to protecting users' rights\
    \ as developers and content creators.\n\n# ## PEOPLE IN THE PROJECT\n\nBefore\
    \ showing how you can get involved in the LibreOffice community, let’s take a\
    \ quick look at the different TDF “bodies.” They all work together to ensure that\
    \ LibreOffice remains strong with continued development. As you get more involved\
    \ in the project, you’ll come across them in one way or another. The TDF bodies\
    \ include:\n\n+   -   The Board of Directors (BoD) is the main administration\
    \ of TDF’s projects and teams. Board members are the foundation’s judicial and\
    \ extra-judicial representatives.\n+   -   The Membership Committee (MC) administers\
    \ membership applications and renewals and oversees election of the BoD.\n\n+\
    \   -   The Board of Trustees (Members) consists of all people actively contributing\
    \ to TDF’s projects. To be acknowledged as a member, you need to meet the criteria\
    \ defined in TDF’s statutes and apply for membership using their application form.\n\
    +   \n+   Additionally, there are some entities, which are not formal TDF bodies,\
    \ that help the BoD further TDF’s projects:\n+   \n+   -   The Engineering Steering\
    \ Committee (ESC) provides technological guidance on strategic matters and hypothetically\
    \ will consist of the community’s best engineers.\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_1.png)\n\
    \nLothar Becker is the BoD Chairman of TDF, the nonprofit entity behind LibreOffice."
