  md: 'ect’s status to see if it makes sense for you to participate in it. Bear in
    mind, though, that not all teams have taken time to list themselves on that page,
    so a missing localization project doesn’t necessarily mean that there is no team.
    You are also advised to check out other pages on the TDF wiki [4] and take a quick
    look at Web-bite, the tool used for translations. If the status of your language
    is still unclear, you should contact the L10n mailing list [5].


    Localizing LibreOffice is not a small task, and it has many levels. The lowest
    level is assuring that Li-breOffice handles your script (if it is not Latin-based)
    correctly. Libre-Office should allow people in your country to work using your
    script, even if its interface is in English or another foreign language. Checking
    for support of your script might be a task that you can do by yourself, but translating
    the entire LibreOffice in-terface into a new language is a much larger task, requiring
    over one man-year. Ideally, several people should be involved.


    For more details on localization, see the LibreOffice Localization website [6].


    # ### GET INVOLVED:

    ### DOCUMENTATION


    The LibreOffice Documentation team is a group of volunteers who strive to provide
    high-quality guides in English (and other languages) for LibreOffice users. You
    can become part of the Doc-umentation team by contributing to one or more of the
    projects. No matter what your experience level, you can make a valuable contribution.
    In this way, you also build up valuable experi-ence for a potential future career
    in technical writing. Examples of current projects include:


    +   - User guides

    +   - FAQs (frequently asked questions)

    +   - Help (inside the application)

    +   - Tutorials and how-tos

    +   - Videos


    Here are some ways you can help:


    +   - Writing: If you are good at organizing information, explaining concepts,
    and writing instructions. You can help most by writing. Ideally you are an experienced
    technical writer and have good English skills. Not neither of those skills are
    requirements, be-cause other people can edit your Eng-lish. If you wish to write
    in another language or help with translations, please contact the relevant native
    language project. See the LibreOffice website for more details [7].

    +   - Reviewing: If you don’t feel confident about your writing skills or your
    level of knowledge about LibreOffice itself, reviewing a help topic or a user
    guide chapter is a great way to start. Read the information while using Lib-reOffice.
    Are the instructions correct? Is anything missing? Are the screen-shots up to
    date? Let the community know what needs fixing or correct it yourself.


    # ## Too Swamped to Surf?


    Our ADMIN Online website offers additional news and technical articles you won’t
    see in our print magazines.


    Subscribe today to our free ADMIN Update newsletter and receive:


    +   - Helpful updates on our best online features

    +   - Timely discounts and special bonuses available only to newsletter readers

    +   - Deep knowledge of the new IT


    bit.ly/HPC-ADMIN-Update'
