    ```

    ```


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_74_1.png)


    If you prefer to click on stuff, read the “Unpacking Zip Files” box: Even though
    unpacking a zip file is simple enough, you might not want the contents to spill
    into your default documents folder, which could happen if you simply double-click
    on the file. Assuming that you have unpacked the archive to a new test folder,
    open that folder in a file manager or change


    (cd) into it in the Bash shell. You will find four XML files, two additional files,
    and three subdirectories. The XML files have the following purposes:


    +   ■ content.xml holds the document’s text contents (Figure 4). I will describe
    this file in detail.


    # UNPACKING ZIP FILES


    Some years ago, unpacking a zip file required the installation of a third-party
    tool on Windows and macOS (then called Mac OS): WinZip and Stuffit Expander were
    some of the standard apps at that time, and only Linux came with unzipping preinstalled.


    +   ■ When you double-click the zip file in Windows, Explorer will display the
    contents without permanently creating new files. Click on Extract All to create
    a new folder with the decompressed files. By default, Explorer creates a new folder
    named like the zip file (without the .zip ending).


    +   ■ On macOS, double-clicking this .zip file might turn it into a .zip.cpgz
    file which is a gz1p-compressed tar archive - not helpful [1]. If this happens
    to you on a Mac, use the command line to decompress. Alternatively, install a
    different archive program: Stuffit Expander [2] is still available.


    +   ■ For Linux, choices depend on your choices for desktop environment and file
    manager. As an example, KDE’s Dolphin offers various options for treating zip
    files. Left-clicking the file will display its contents in the Ark program, while
    a right-click opens the context menu where Extract | Extract archive here, autodetect
    (folder) is the best choice (Figure 3).


    Depending on your unzip tool’s default settings, the unpacked files might appear
    in the same folder that contains the zip file because LibreOffice zip files store
    those files in the top-level directory: In most cases, that is not what you want.
    If your unzip program provides an unpack to subdirectory option (like the one
    mentioned for the Dolphin context menu on Linux/KDE), use that.'
