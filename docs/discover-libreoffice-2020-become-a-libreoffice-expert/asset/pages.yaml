- pgno: 20
  md: '# GETTING STARTED


    LibreOffice Calc


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_20_0.png)


    Figure 1: Calc is a spreadsheet application designed to be compatible with Microsoft
    Excel.


    lists, collections of addresses, calendars, and project schedules. By contrast,
    a data array consists of raw tables of information and functions that help to
    analyze the data, such as totals and averages. Examples of a data array are personal
    or corporate finances or a grade sheet. Sometimes, a data array is used to serve
    as a tutorial, complete with exercises.


    Both lists and data arrays are usually organized by columns. Group similar information
    together on the same worksheet, leaving space for labels – a label is heading
    that describes the information contained in the column or row. Cell formatting,
    such as borders and background, can help to distinguish different types of information
    at a glance. For example, on a teacher’s grade sheet, you might use different
    shades of green to mark the cells that show median and average grades. The more
    colorful, the more easily users will be able to find their way through the information
    – but too much color coding may become so complex that the advantage is lost.
    You may want to start by sketching the approximate layout, but be sure to leave
    space for future growth.


    # DESIGNING A LIST


    A spreadsheet list serves much the same purpose as a table in a text document.
    Primarily, it is a way of making information easier to find than if it was arranged
    in paragraphs. Formatting


    such as fonts, colors, and position help to group the information and to distinguish
    types of information. For example, in a project schedule, each worker on a project
    might be assigned a different color. Once each worker knows their color, they
    can track their tasks and ignore everybody else’s. The project schedule might
    also include a sign-off column, or a color that can be added as each task is completed.
    Since a list generally gives simple information, it generally uses few spreadsheet
    functions, although some simple ones might be added, such as a sum of the hours
    worked for budgeting purposes.


    Figure 2 shows a trip planner I used as an example in my 2016 book Designing with
    LibreOffice [1]. Notice how different kinds of information are grouped together
    by borders, and each one has its own header. Blank cells are used to further separate
    information. On the left side, beneath the summary, different tasks are arranged
    beneath the summary in the order that they have to be done. The rest of the spreadsheet
    is a daily itinerary. The intent is to produce a spreadsheet that can be printed
    out and to which handwritten additions can be added as they arise.


    # DESIGNING DATA ARRAYS


    Data arrays are where Calc really comes into its own. Data arrays can be formatted
    in the same way as lists to organize information. However, unlike most lists,
    data arrays include a number of functions (or formulas, as they are sometimes
    called) for manipulating raw data. Calc includes over 450 functions, many with
    the same names as in MS Excel, so that users can easily switch to Calc. A few
    Calc functions input variables are


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_20_1.png)


    Figure 2: A list-oriented spreadsheet.'
