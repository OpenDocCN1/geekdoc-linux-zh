- pgno: 48
  md: '# GETTING STARTED


    # LibreOffice Math


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_48_0.png)


    Figure 6: When printing formulas, you can tweak all kinds of settings in the Print
    dialog.


    +   - Round Brackets and Square Brackets. These have organizing properties just
    like the Group Brackets, but Math displays them in the preview formula.


    Fences usually appear in pairs. If you enter an opening round or square bracket
    in the command window, the formula editor automatically adds the closing bracket.
    If you want to use a single parentheses without its partner, however, place a
    backslash (\) in front of the character. Math then interprets it as a symbol instead
    of a fence.


    All types of brackets are available in a scalable form, as well. They dwell in
    the section just below the unscaled bracket choices. Scalable brackets automatically
    appear at the required size (Figure 4) and appear with left or right before the
    character in the command window. The command for the formula in Figure 4 is therefore:


    ```

    left( ( a + b ) over c + d right) = e

    ```


    You also can enter scalable brackets individually. Use the keyword none to suppress
    the second parentheses:


    ```

    left brace right none

    ```


    The preview prints a large left curly bracket only and informs Math that the right
    side is meant to be missing.


    # MORE STRUCTURE!


    Group Brackets give structure to formulas, but spaces and line breaks inserted
    by pressing Enter have no influence on the layout. Math simply ignores them, which
    means you can structure long and complicated formulas in the Commands pane with
    spaces and line breaks to make them easier to read without affecting the presentation
    in the preview. Figure 5 shows a matrix formula in the upper Commands pane that
    appears as a long line. The bottom Commands pane shows a far clearer version of
    the same formula with breaks and spaces, and it produces the same results in the
    document (right).


    While creating complicated and long formulas, it is easy to mistype. If you accidentally
    insert a syntax error somewhere, LibreOffice Math will notify you. An inverted,
    dark red question mark in the preview pane indicates that something is wrong.
    Double-click on the question mark to go directly to the matching position in the
    Commands pane. Press F3 to go to the next error or Shift + F3 to go to the previous
    error. At the bottom of the window, additional hints appear, such as Unexpected
    character.


    Explanatory comments that only appear in the Commands pane and not in the document
    are useful, especially in long and complicated formulas. A comment starts with
    double percent signs (% % ). Comments run to the end of a line, so to end a comment,
    press Enter. Some symbols (e.g., * , %, ^ , &, _, |) have special meanings in
    Math. If they need to appear in the formula in the document, you have to use double
    quotes around the characters in the Commands pane.


    # LAST BUT NOT LEAST


    If you decide to print a formula, LibreOffice offers some practical options in
    the LibreOffice Math tab of the Print dialog. For example, you can activate the
    Title checkbox to print the file name at the top. If you check Formula text, the
    program prints the contents of the Commands pane. Optionally, you can use borders
    and print the formula at the original size, fit to the page, or otherwise scaled.
    A preview shows how the results will print (Figure 6).


    If you created your formula directly in the Math module, you can save it as a
    separate object with the *. odf (Open Document Formula) extension by selecting
    File | Save as. If you have embedded a formula object in Writer or Calc, you can
    save the formula together with the text or spreadsheet document, or you can export
    it as a separate object. To export it, right-click the formula and select Save
    Copy as from the context menu.


    Conversely, you can load a finished formula file into a LibreOffice file with
    Insert | Object | Formula. You will now see the Math formula editor again; select
    Tools | Import Formula to import the desired file, which you can then change or
    accept without modification. As soon as you click on the text or table document
    in the upper area, LibreOffice closes the Math window. ###


    # INFO


    +   [1] Math manual: https://documentation. libreoffice.org/assets/ Uploads/Documentation/en/
    GSS-2/PDF/GSS209- GettingStartedWithMath.pdf'
