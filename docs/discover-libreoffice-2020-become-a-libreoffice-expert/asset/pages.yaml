- pgno: 29
  md: '# GETTING STARTED


    LibreOffice Impress


    # CREATING A PHOTO ALBUM


    You can use Impress to create a photo album from a set of images, usually with
    one photo per slide. This photo album can use multimedia sources with graphics
    and images or even collect your latest holiday pictures into a single presentation
    file. To do this, first open an existing or blank presentation, and then choose
    *Insert | Media | Photo Album*. In the Create Photo Album dialog box that appears,
    click *Add* to select your images and browse your file system. Exactly how you
    select multiple images depends on your operating system, but usually you can do
    it by holding the Shift or Ctrl key while clicking.


    After you''ve chosen your images, Impress offers some extra options (see Figure
    2). One of the most important is *Link Images*, which means that the image data
    won''t be copied directly into the presentation, but rather the images will be
    loaded from the file system on demand when you watch the presentation. This saves
    disk space, as you don''t duplicate so much data. However, beware: If you remove
    the image file from your hard drive, the presentation won''t have it either! Click
    *Insert Slides* when you''re done, and you can continue to edit and show the presentation
    as usual.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_29_0.png)


    **Figure 2: When creating a photo album, you can specify how many images should
    appear on each slide.**


    To change the background of a shape or text box, right-click on it and choose
    *Area*, and you''ll see the dialog shown in Figure 4. You also can use this dialog
    to add shadows and set the transparency of objects.


    Want some more shapes and clip art for your presentation? Then check out the Gallery
    (Figure 5), which is located in the sidebar, the second icon from the bottom in
    the right-hand panel. Click this to see a range of things you can add – just click
    and drag them over. As with all other shapes, if you click the shape to highlight
    it, you''ll see green handles that you can click and drag to resize it.


    So, you have your slides, layouts, text boxes, text formatting, shapes, and graphics
    – all the essential tools to create presentations. But there''s one more thing
    to consider: transition effects (i.e., the animations used to move from one slide
    to another). Choose a slide from the left-hand panel, and then choose the *Slide
    Transition* deck from the sidebar on the right (it''s the third icon from the
    top).


    You''ll see a bunch of transitions, along with small images depicting them, in
    the main part of the sidebar. Feel free to explore – just click a transition to
    see how it works. Many transitions have extra options underneath, including the
    duration (in seconds) and additional sound effects. You can also use this part
    of the sidebar to make the presentation move on automatically, after waiting for
    a certain amount of seconds – see the *Advance Slide* options towards the bottom.


    With the basics under your belt, I''ll move on to a few advanced features: workspace
    views, master slides, and the Presenter Console.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_29_1.png)


    **Figure 3: Use the sidebar to choose alternative layouts in the template, with
    extra boxes for text and/or images.**'
