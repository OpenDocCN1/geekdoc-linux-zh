- pgno: 56
  md: '# GET PRODUCTIVE


    effort you make now will be useful for years, and save you countless hours.


    As you produce your template library, make the template names as descriptive as
    possible. A descriptive title will make your templates easier to find. A descriptive
    name also prevents naming conflicts when you transfer the template to another
    computer. Instead of labeling a template `article.ott`, call it something more
    specific, such as `Linux-Pro-Magazine.ott`. You will be glad that you took the
    time to plan intelligently.


    # WAYS TO GET TEMPLATES


    The easiest way to get templates is to download them. Several hundred LibreOffice
    templates are available online [1], and you are sure to find other libraries.
    The disadvantage of downloading, though, is that it takes time to sort through
    the available selections, and the differences between items are not always immediately
    apparent. Probably, too, you will want to modify the downloads to suit your own
    needs and preferences, so downloads may not be as convenient as you originally
    think.


    Microsoft Office templates, which exist in the thousands online, are another useful
    source. However, test those templates display in LibreOffice before using them.
    You may also want to check the licensing for any downloaded templates.


    Technically, using templates available from Microsoft Office outside of Microsoft
    Office is illegal, which probably means that you want to avoid using them for
    professional purposes.


    A more convenient source is available via `File | Wizards`. Since their creation
    can be interactive, the wizards can teach you how to think as you design.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_56_0.png)


    Figure 1: Placeholders and fields are useful for storing structure in a template,
    even if you lack detailed information.


    The disadvantage of this source is that the wizards offer only a limited selection
    of templates, and many are more elaborate than necessary, even if they are perfectly
    usable.


    Sooner or later, though, you will probably need to design one for yourself. Whether
    you are modifying a downloaded template or creating one from scratch, go about
    the task just as you would creating any document.


    Besides the formatting, you might also want to include some content. A brief note
    at the start of the template might explain how to use it. It might also want to
    include a boilerplate – content that doesn''t vary between documents, such as
    a biography or a corporate background.


    If you know the type of information needed in a certain place on the template,
    but not the specific details, you add a placeholder via `Insert | Fields | More
    Fields... | Functions | Placeholder. Other fields, such as Document Information
    or the general user information stored in `Tools | Options | LibreOffice | User
    Data` can also be added to a template, just like any other document (Figure 1).
    Some of these fields, such as Date and Time, can be fixed, inserting the time
    when the field was inserted, or variable, displaying the time when the document
    was opened. The differences from a normal document only start to appear as you
    save your results.


    # REGISTERING TEMPLATES


    Once a regular file is saved, it is ready for use. By comparison, regardless of
    how a template was created, it must be registered with LibreOffice before being
    used, just like a data source, such as an address book or a database.


    You can, of course, save a template from the ordinary file dialog. However, to
    make a template available on your system, you must save it for the first time
    using `File | Templates | Save as Template` (Figure 2). When the dialog opens,
    type a name and select a category to file the template under. These categories
    correspond to the display filters in the Template Manager (see below). You also
    have the option to set the template as the default, the one that is used automatically
    when you open a LibreOffice file unless overridden. If you choose not to assign
    a category, the template displays on the top level of the Template Manager.


    Registering must be done one template at a time from the editing window. If you
    have downloaded a large number of templates, you can register them by using a
    file manager to drop them in one of the directories listed in the Path sections
    of `Tools | Options` or by using the import tool in the Template Manager.


    # WORKING WITH TEMPLATES


    To manage templates, or to start a new document based on a template, select `File
    | New | Templates`. You can also manage templates from `File | Templates | Open
    Templates... | Manage Templates.` In each case, the Template Manager window opens
    (Figure 3). The Template Manager presents a virtual view of all the templates
    in the template


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_56_1.png)


    Figure 2: Templates must be saved in their own dialog before you can use them.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # GET PRODUCTIVE


    # ## LibreOffice Templates


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_57_0.png)


    paths listed in `Tools | Options | Paths`. By default, that means the templates
    in your home directory, although the path might also include a template repository
    available to all users on the system.


    Across the top of the Template Manager are three ways of locating registered templates:
    a search field, a LibreOffice module filter, and a category filter. The bottom
    of the window are tools for managing the view of the editing window and for importing
    and exporting files. To work with a particular template, right-click on it. From
    the right-click menu, you can start a new document based on the selected template,
    set the selected template as the default for its LibreOffice Module, or open the
    template to edit. If you are editing, you can use the regular `File | Save` dialog,
    since the template is already registered.


    You cannot delete templates installed with LibreOffice through an extension or
    for the entire system, although you can delete the extension from `Tools | Extension
    Manager`. However, templates made from the editing window can be deleted – but
    be careful, because the Template Manager does not include confirmation dialogs.
    From within the Template Manager, select the template to delete, and then click
    the Delete button.


    # ### CIRCUMVENTING TEMPLATE LIMITATIONS


    For years, Microsoft Word was notorious for allowing more than one template to
    be applied to a document. "Too often, the result was unrecoverable file corruption.
    When StarOffice, LibreOffice’s first ancestor, was written, mixing templates was
    made impossible to avoid such problems. The only trouble is, users still need
    a convenient way to alter templates and the files associated with them.


    The most convenient way to alter a template and the documents based on it is to
    edit the template by right-clicking on it in the Template Manager. After you have
    saved the revised template, the next time you open an associated file, you are
    given the opportunity to upgrade it (Figure 4). If you upgrade, the association
    between the template and the document continues, and further changes to the template
    will trigger the upgrade dialog. However, if you do not upgrade the document,
    its link with the template is severed – although, somewhat confusedly, the template
    continues to be listed in `File | Properties | General`. You sometimes find an
    extension that is supposed to allow you to change templates, but, like all extensions,
    you use such tools at your own risk. Considering the problems that have existed
    in Microsoft Word for decades, you are probably safest avoiding such tools.


    One way to reattach a document to a template is to open a new document using the
    template and then copy and paste the unattached file into it. Be careful, though,
    to Use Paste and not Paste Special. In some circumstances, a possible solution
    may be to design a new template, carefully using the same style names, and then
    overwrite the original template name. The new template will be treated as a revision
    of the original, so associated files can be updated when each one is opened.


    A temporary solution is to use a Master Document. In the past, Master Documents
    were used to divide long files into divisions small enough to work with limited
    memory. Today, they are still used to allow more than one person to simultaneously
    work on a document. However, what matters here is that a Master Document can use
    a different template than any of its component files – even if only one file is
    involved. To take advantage of this feature, start a new document using the revised
    template and then select `File | Send | Master Document`. Then open the Master
    Document. From the right-click menu, select `Insert | File` to add the document
    from the file manager, and select `Update | All` to apply the Master Document’s
    formatting to it. Close the Master Document without saving, and you will still
    be able to open the document in its original format. Should you decide to keep
    the Master Document’s format, select `Edit` from the right-click menu to open
    the document in an editing window, from which you can save it using the Master
    Document’s template.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_57_1.png)'
