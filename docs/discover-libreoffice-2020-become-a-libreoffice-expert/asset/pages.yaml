- pgno: 15
  md: '# GETTING STARTED


    LibreOffice Writer


    # TOP 10 FEATURES


    Here are the 10 most useful things to do in Writer:


    +   1.  **Headers and Footers:** These are the sections at the start and end of
    each page, and they mostly stay the same across pages, although you can introduce
    changing elements. The most common use case for headers and footers is titles.
    To add text to a header or footer, you first need to create space for them; simply
    click the mouse in the section above or below the main part of the page, and you’ll
    see a blue box. Click it to add space for a header or footer, and the blue box
    will then change into a menu (Figure 3). From here, you can directly add text
    into the header or footer, which will be consistent across all pages, and add
    page numbers and page counts (as you’d typically find in the footer in books).


    +   2.  **Images and Text Boxes:** If you want to use Writer as a desktop-publishing
    tool, then you’ll want to add floating elements onto the page, such as images
    and text boxes. You can find most of these under the *Insert* menu.


    With images, you’ll be prompted to select an image from your computer, which will
    then appear on the page. Click and drag to move it around, or use the blue handles
    on the edges and corners to resize it.


    If you want to change how the image interacts with the surrounding text, right-click
    on it and select the Wrap menu. *Optimal page wrap* is the best choice for images
    to make the text should flow nicely around them.


    Also in this right-click context menu, look at Properties for more options, including
    image borders and exact positioning.


    Text boxes work in a similar way: Click *Insert | Text box*, and then click and
    drag to position it on the page. From there, you can use the handles to drag it
    around and click inside to add text.


    +   3.  **Change Tracking:** This is an essential feature if you’re collaborating
    on a document with others. First, go to *Tools | Options* (or on macOS, *LibreOffice
    | Preferences*). Under *LibreOffice | User Data,*, you can enter your name – this
    isn’t mandatory,


    but it means that your name will be shown alongside changes and comments. This
    helps other people working on the document to see exactly who changed what. Click
    OK, and then under the *Edit* menu, go to the *Track Changes* submenu and make
    sure that *Record and Show* are both enabled.


    Now try typing; you’ll see that your updates to the document are marked with colors
    and underlines. Mouse over a change and a tooltip appears, providing information
    on who made the change and at what time. If someone sends you a document, and
    you want to give some constructive feedback, detailing exactly which changes you
    made, now you know what to do!


    +   4.  **Comments:** Related to the previous feature, this option is important
    for collaboration. Place the cursor inside the line or paragraph where you want
    to leave a comment, and then click *Insert | Comment*. A box will appear on the
    right-hand side of the document (Figure 4), in which you can add some comment
    text. Your name (and the time you made the comment) appears as well. Also, click
    the drop-down icon in the comment box for some extra options (e.g., deleting the
    comment).


    +   5.  **Spell Checking:** Depending on your operating system setup, this may
    be enabled already, but if not, click *Tools | Automatic Spell Checking.* As you’d
    expect from any modern word processor, misspelled text is underlined in red. If
    you’re working with some words that aren’t part of the standard dictionary, but
    you don’t want to keep seeing a "this is wrong" red underline for them, just right-click
    on the word and add it to the dictionary (or ignore it).


    If you’ve installed multiple dictionaries from the LibreOffice website and want
    to change the one that is being used for the spell checking, click on the language
    in the status bar at the bottom. (You can also change on a per-paragraph level
    in *Tools | Language.*) For further language options, go to *Tools | Options,
    Language Settings and Languages* where you can set the default language for all
    documents.


    +   6.  **Page Layout:** You’ve already seen the basic formatting options in the
    toolbar (font, size, bold/italics/underline, colors, etc.), but for broader page
    options, go to *Format | Page* in the menu. Here you can switch between portrait
    and landscape mode, choose different page sizes, adjust margins and borders, or
    even provide background gradients or images under the *Area* tab.


    +   7.  **Navigator:** As your documents increase in complexity, with multiple
    elements, styles, headings, and so on, you might find them more difficult to navigate.
    Fortunately, you can use the handily-named Navigator to help here: click *View
    | Navigator* to enable it, or find it in the sidebar (Figure 5). Click the arrows
    next to the different elements to expand them.


    +   8.  **Special Characters:** If you need to insert a character or symbol that’s
    not available on your keyboard, go to *Insert | Special Character* (there’s


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_15_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_15_1.png)'
