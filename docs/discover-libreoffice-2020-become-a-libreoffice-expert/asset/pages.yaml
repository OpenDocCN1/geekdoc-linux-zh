  md: "# # GET PRODUCTIVE\n## ODF XML\n\nNow every opening or closing tag sits in\
    \ its private array entry.\n\nLines 18-22 perform a loop over all the short lines\
    \ that were generated in the previous step. If a line matches the `</?t:t:(p|span)>`\
    \ pattern, and if, furthermore, the search term occurs in that line, it gets run\
    \ through the highlight() and then displayed in the filename: line format.\n\n\
    # ### TURN A HACK INTO SOFTWARE\n\nEverything so far must be called a hack. There\
    \ is nothing wrong with quickly hacking together a Shell or Python script that\
    \ “does the job,” but attaching XML data structures with simple regular expressions\
    \ does ask for trouble. For example, imagine what might happen if a search term\
    \ was identical with an XML element name: Searching and replacing with some random\
    \ word would introduce syntax errors to the file.\n\n# ### GET PYTHON FOR WINDOWS\n\
    \nIf your Windows installation has neither a Bash shell nor a Python interpreter,\
    \ go to the Python project’s Windows download page [3]. Click on the second entry\
    \ (Latest Python 2 release), and on the next web page, click on the Windows x86-64\
    \ MSI installer link. That will let you download an MSI installer file, which\
    \ you can execute.\n\nIn the installer, choose the installation option for all\
    \ users and accept all defaults; that will create a new folder C:\\Python27. At\
    \ the time of writing, Python 2.7.18 was the current version in the 2.7 branch\
    \ – do not install a 3.x version because Python 3.x uses a new syntax that is\
    \ not compatible with the scripts.\n\nAfter the installation you will need to\
    \ locate the python.exe file and add its folder to the `PATH` variable: only then\
    \ will you be able to launch the Python interpreter (and Python scripts) from\
    \ the command line (cmd.exe). You can run a Google search for “Windows add to\
    \ path” on how to do that. If you accepted the defaults, add `C:\\Python27` to\
    \ the list.\n\nIs there a better way to process XML files? Python developers can\
    \ use the `xml.etree.ElementTree` module [6] and have an XML document properly\
    \ parsed.\nIt works like this:\n\n1. Use the `fromstring` function to convert\
    \ a string into an XML tree structure. The function call returns the root of that\
    \ tree.\n\n2. Use the `findall` method to search the tree (starting at the root)\
    \ for interesting elements, such as `<text:p>` or `<text:span>`.\n\n3. For each\
    \ match, access the contents via its `text` property. Then you could print it,\
    \ modify it, collect statistics data, etc.\n\nThus, a basic code block for achieving\
    \ the goal mentioned in the introduction (replacing the word “Linux” with “Windows”)\
    \ would be this:\n\n```\n```python\nfrom xml.etree import ElementTree as et\n\
    # ... content is a string w/ XML inside\nroot = et.fromstring(content)\nfor x\
    \ in root.findall('.//text:p') \\\n        + root.findall('.//text:span'):\n \
    \   x.text = ?\n    x.text.replace(\"Linux\",\"Windows\")\nnew_content = et.tostring(root)\n\
    ```\n(The `findall` method requires the leading `./` part in the element\n```\n\
    \nnames.) But it turns out that this is too simple: LibreOffice relies heavily\
    \ on the use of XML namespaces, and the XML parser must be made aware of all the\
    \ namespaces that are used in the document.\n\n# ### XML NAMESPACE CRAZINESS\n\
    \nWhat’s a namespace? Each specific XML language (such as the one used in LibreOffice\
    \ documents, the XML used in the RDF format [7], or XHTML [8], which is the XML\
    \ version of HTML, uses its own set of tag and attribute names.\n\nFor example,\
    \ XHTML documents can contain `<head>`, `<body>`, `<title>` (document title),\
    \ `<p>` (paragraph), `<h1>` to `<level 1>`, heading), and many more tags.\n\n\
    ▪ As a second example, the Dublin Core (DC) [9] metadata can be used to describe\
    \ various documents, and they use tags such as `<description>`, `<publisher>`,\
    \ and (again) several others.\n\nNow assume that you want to design a new XML\
    \ language but do not want to reinvent the wheel. You intend your language to\
    \ be a mixture of XHTML and DC. Noting that the `<title>` tag occurs both in HTML\
    \ and in DC, you wonder what to do about this. In order\n\n```\n```python\nns\
    \ = {\n 'office':'urn:oasis:names:tc:opendocument:xmlns:office:1.0',\n 'number':\
    \ 'urn:oasis:names:tc:opendocument:xmlns:number:1.0',\n 'table': 'urn:oasis:names:tc:opendocument:xmlns:table:1.0',\n\
    \ 'x': 'urn:oasis:names:tc:opendocument:xmlns:x:1.0',\n 'draw': 'urn:oasis:names:tc:opendocument:xmlns:draw:1.0',\n\
    \ 'a':'urn:oasis:names:tc:opendocument:xmlns:x:1.0',\n 'link': 'urn:oasis:names:tc:opendocument:xmlns:x:1.0',\n\
    \ 'dc': 'http://purl.org/dc/elements/1.1/',\n 'meta': 'urn:oasis:names:tc:opendocument:xmlns:meta:1.0',\n\
    \ 'rpt': 'urn:oasis:names:tc:opendocument:xmlns:rpt:1.0',\n 'presentation': 'urn:oasis:names:tc:opendocument:xmlns:presentation:1.0',\n\
    \ 'style': 'urn:oasis:names:tc:opendocument:xmlns:style:1.0',\n 'chart': 'urn:oasis:names:tc:opendocument:xmlns:chart:1.0',\n\
    \ 'dt': 'http://www.w3.org/1999/02/22-dcterms/'\n 'form': 'urn:oasis:names:tc:opendocument:xmlns:form:1.0',\n\
    \ 'fo': 'http://www.w3.org/1999/XSL/Format/',\n 'script': 'urn:oasis:names:tc:opendocument:xmlns:script:1.0',\n\
    \ 'openoffice': 'http://openoffice.org/2001/office/',\n 'ooow': 'http://openoffice.org/2001/writer',\n\
    \ 'calc': 'http://openoffice.org/2001/calc',\n 'dom': 'http://www.w3.org/2001/xml-events',\n\
    \ 'xforms': 'http://www.w3.org/2002/xforms',\n 'xsi': 'http://www.w3.org/2001/XMLSchema-instance',\n\
    \ 'xlink': 'http://www.w3.org/1999/xlink',\n 'grddl': 'http://www.w3.org/2003/03/gdata-view#',\n\
    \ 'rdf': 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',\n 'officeooo': 'http://openoffice.org/2009/office',\n\
    \ 'calcext': 'http://openoffice.org/2011/calc:1.0',\n 'drwxooo': 'http://openoffice.org/2010/draw',\n\
    \ 'math': 'http://openoffice.org/2010/math',\n 'loext': 'urn:org:documentfoundation:extension:experimental:office:1.0',\n\
    \ 'smil': 'urn:oasis:names:tc:opendocument:xmlns:x:1.0',\n 'loext1': 'http://openoffice.org/experimental:1.0',\n\
    \ 'css3t': 'http://www.w3.org/TR/css3-text/'\n}\n```\n```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_77_0.png)"
