- pgno: 8
  md: '# # GET STARTED


    # Introducing LibreOffice


    over to it? Why is MS Office still around? There are various reasons for this,
    such as:


    +   ■ Familiarity: Lots of people still aren’t aware that LibreOffice exists.
    The Document Foundation, the non-profit entity behind it, is working to improve
    this through marketing and events, but more needs to be done to spread the word.


    +   ■ Resistance to change: Even when people discover LibreOffice, they’re often
    reticent to change, especially if they’ve already paid for another office suite.
    LibreOffice is familiar but looks and works slightly differently in places, and
    some more conservative users aren’t in a rush to switch over.


    +   ■ Features: LibreOffice has the vast majority of features that everyday users
    need, and indeed even more than MS Office in some areas [3]. But some specific
    workflows designed for MS Office require macros or special feature sets that don’t
    quite match up with LibreOffice. Still, with new LibreOffice releases arriving
    every six months, this changes quickly, and LibreOffice often takes the lead with
    rolling out new features that haven’t appeared in MS Office yet.


    The LibreOffice suite includes several tools, including:


    +   ■ Writer – the word processor (Figure 1)


    +   ■ Calc – the spreadsheet (Figure 2)


    +   ■ Impress – the presentation tool (Figure 3)


    +   ■ Draw – for diagrams, flowcharts, leaflets, etc. (Figure 4)


    +   ■ Base – for databases (Figure 5)


    +   ■ Math – to create formulae


    Over the next few pages, I’ll provide a bit more background on LibreOffice and
    the community behind it, and I’ll show you how to install it. If you’re really
    itching to begin, skip ahead to the installation section – but don’t forget to
    come back here later and discover more about the suite! By learning about its
    history and background, you can help advocate for LibreOffice and spread the word
    to other potential users.


    # ## A QUICK HISTORY


    LibreOffice came to life in 2010, but its history actually goes back many years
    before that. Indeed, to explore


    the origins of what is today called LibreOffice, you have to go back to the 1980s,
    to a program called StarWriter


    (Figure 6). StarWriter was a commercial word processing application, created by
    German programmer Marco


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_8_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_8_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_8_2.png)'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# # GET STARTED


    # Introducing LibreOffice


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_9_0.png)


    Figure 5: Base is LibreOffice’s database front end.


    Börries, and it was made available for the 8-bit and 16-bit home computers at
    the time (such as the Amstrad CPC and PCs running MS-DOS). Over the next few years,
    Börries created a small company called Star Division to oversee the development
    of his program, adding additional tools such as a spreadsheet and drawing program.
    In 1992, StarOffice 1.0 for MS-DOS was released, followed two years later by StarOffice
    2.0, which supported Windows and macOS.


    StarOffice was relatively unknown compared to the mighty MS Office, but it was
    popular enough that new releases were made throughout the 1990s. Then something
    massive happened: Sun Microsystems, a major vendor of high-end servers and workstations,
    bought Star Division for a pretty


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_9_1.png)


    Figure 6: StarWriter is the ancestor of modern LibreOffice (image: MasterH, CC
    BY-SA 3.0, https://tinyurl.com/y7qjb47h).


    impressive $73.5 million. The reason- ing behind this? Many speculated that for
    Sun, which had over 20,000 employees at the time, buying Star Division was a cheaper
    way of equipping all its workers with an office suite than buying MS Office licenses.
    Others spec- ulated that Sun was eager to get more involved in the home/personal
    com- puting space.


    In any case, this suddenly meant that StarOffice had a much bigger company behind
    it – more resources and develop- ers were available to work on it. In 2000, Sun
    released StarOffice 5.2 as a free download for personal use; the suite was also
    provided on many maga- zine cover discs. Microsoft suddenly had a lot more competition,
    and many people found StarOffice more than good enough for their daily tasks.


    Then another major change oc- curred. The Free and Open Source Software move was
    gaining a lot of traction at the time, prom- ising the benefits of software for
    which the source code (the human- readable recipe) is freely available. With open
    source programs, anyone can tinker “under the hood,” make


    improvements, and submit them back to the developers. Open source is a large collaborative
    effort, where the whole world can learn from and make a difference, in contrast
    to closed-source programs like MS Office, where very few people can actually look
    inside it and improve it.


    Sun was observing other open source projects gaining momentum, such as the GNU/Linux
    operating system and the Mozilla web browser (which lives on today in the form
    of Firefox, perhaps the most well-known open source app). In response, Sun decided
    to make the StarOffice code open for everyone to ex- plore in a new project named
    OpenOf- fice. Yes, this meant that the world now had a fully free office suite
    – free as in zero cost, but free as in everyone could study its workings, make
    im- provements, and share them.


    After a couple of years of develop- ment, OpenOffice.org 1.0 was released in 2002.
    It wasn’t the prettiest of re- leases, with a few rough edges and less-than-stellar
    performance, but it was nevertheless a major milestone. Linux users in particular
    were happy to have a fully-featured, open source of- fice suite that was provided
    by default with their operating system. A small update, OpenOffice.org 1.0, followed
    a year later, and then OpenOffice.org 2.0 arrived in 2005 with many perfor- mance
    improvements.


    # ## THE BIRTH OF ODF


    Version 2.0 also used the OpenDocument Format (ODF) [4] as its default format
    (Figure 7). Documents, spreadsheets, and drawings are stored on our com- puter
    as chunks of computer-readable data. At the time, Microsoft documents were stored
    in strange proprietary blobs of complicated, obfuscated data that was very difficult
    for other programs to read.


    ODF was created as an alternative: The data was structured in an open and standardized
    way, built on XML, so that files saved in OpenOffice could easily be opened and
    understood by other programs as well. Users who save their work in ODF format
    can guaran- tee that they’ll be able to read the files in the future, no matter
    tools, regardless of whatever happens to OpenOffice.org. Years later, Microsoft
    created its own pseudo-standard called “OOXML,” and'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'LibreOffice supports it too, while recent releases of MS Office support ODF.)


    Over the following years, Sun and the OpenOffice.org community worked on new releases
    of the software, but there was ongoing concern that a single large company had
    a lot of sway in the project. Some ideas were brought up by the community, such
    as an independent foundation to oversee OpenOffice.org development, but nothing
    came of it.


    Until 2009, that is. That’s when Sun was purchased by Oracle, a vendor of database
    software and other enterprise tools. There was immediate concern amongst the OpenOffice.org
    community, especially volunteers who’d contributed a lot to the project: What
    happens now? Will Oracle care about OpenOffice.org? Is Oracle a friend of free
    and open source software?


    There was much discussion at the time, and then a bunch of community members made
    a big decision in 2010: It was finally time for a completely independent, non-profit
    entity to provide a future for the office suite. This entity was known as The
    Document Foundation (TDF), and the software was called LibreOffice.


    LibreOffice began as a “fork” of the OpenOffice.org project. (Because OpenOffice.org
    was open source, anyone could take the source code and use it to start another
    project.) The vast majority of community members in OpenOffice.org joined the
    LibreOffice project straight away. So LibreOffice was the future of OpenOffice.org
    – it was built with the same source code, but with a new foundation behind it,
    a new brand, and new


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_0.png)


    *Figure 7: OpenDocument is the native format of LibreOffice, and it is a fully
    open and standardized format, ideal for long-term storage of your work.*


    # 10 YEARS OF


    LibreOffice


    The Document Foundation


    LibreOffice was announced in September 2010. Discover what our community and certified
    developers have achieved in 10 years...


    **19 MAJOR RELEASES.**

    New major releases arrive like clockwork, every six months. They include new features,
    bugfixes and compatibility improvements.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_2.png)


    + 200 MILLION USERS


    LibreOffice is used by over 200 million people around the globe. In addition,
    it’s available in over 100 languages, thanks to our localisation communities.


    **NINE CONFERENCES**


    Yearly conferences have taken place in Paris, Berlin, Milan, Bern, Aarhus, Brno,
    Rome, Turana and Almeria. And there are more to come!


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_3.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_4.png)


    **MAJOR DEPLOYMENTS**


    LibreOffice is being used in enterprises and governments around the world. See
    tdf.io/migrations for more details. Professional support is available too.


    **COMMERCIAL ECOSYSTEM**


    Companies offer LibreOffice based products, develop new features, and contribute
    code back to the project, and community.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_5.png)


    Let''s make the next 10 years great too!

    tdf.io/joinus'
