    As an alternative to styles, you might select a color scheme from *Format* | *Spreadsheet
    Themes*. Note, though, that themes are more general than styles, and that styles
    have more functional advantages.


    # THE EVOLVING SPREADSHEET


    When spreadsheets started being used in the early 1980s, function was everything.
    Even formatting touches like text wrap were not included, which meant that long
    pieces of content obscured adjacent cells, often making a spreadsheet unreadable
    at a glance.


    Today, spreadsheets are as functional as ever, although the number of features
    has increased slowly in the last couple of decades. Where spreadsheets have really
    evolved is in the rise of formatting options. Thanks to the influence of information
    designers such as Edward Tufte, spreadsheets have also started emphasizing the
    importance of presentation, highlighting and coloring cells to create visual impressions
    and guides on top of the functionality.


    These visual impressions are not an end in themselves. Should you find yourself
    treating your spreadsheets as works of art rather than as aids to comprehension,
    you will need to reassess your priorities. However, at their best, the combination
    of functionality and visual aids makes spreadsheets more accessible than they
    were 40 years ago. With its use of styles, Calc is well-equipped to meet these
    increasing demands for spreadsheets. ■■■


