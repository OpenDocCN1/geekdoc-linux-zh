  md: '# GETTING STARTED


    LibreOffice Impress


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_1.png)


    > Figure 4: Impress provides a wide range of background options for shapes – such
    as solid colors, gradients, and bitmaps.


    > Figure 5: The Gallery, accessible via the sidebar, provides many extra shapes
    and graphics to pep up your presentations.


    # WORKSPACE VIEWS


    Under the **View** menu, you''ll find various workspace options – each of these
    workspace views is designed to ease the completion of certain tasks. For instance,
    **Normal** is the main view for working with individual slides. Use this view
    to format and design slides and to add text, graphics, and animation effects.


    Then there''s the **Outline** view, which contains all of the presentation slides
    numbered sequentially (Figure 6). **Outline** view shows topic titles, bulleted
    lists, and numbered lists for each slide in the outline format. Only the text
    contained in the default text boxes in each slide is shown, so if your slide includes
    other text boxes or drawing objects, the text in these objects will not be displayed.


    The **Notes** view lets you add notes to a slide. These notes are for your information
    only and are not seen by the audience when the presentation is shown. Meanwhile,
    the **Master Handout** view is for setting up the layout of your slides for printing.
    Click the **Properties** tab in the sidebar, and you can choose to print one,
    two, three, four, six, or nine slides per page in the **Layouts** section. In
    addition, this lets you add custom fields into the header and footer sections,
    such as the current date – click in one of those boxes, and then go to **Insert
    | Field** to see what''s available.


    # MASTER SLIDES


    First, a bit of background: A master slide is one that''s used as the starting
    point for other slides. It''s similar to a page style in Writer, and it controls
    the basic formatting of all slides based on it. A slide show can have more than
    one master slide. Also, master slides have a defined set of characteristics, including
    background colors, graphics, and gradients, as well as other objects (such as
    logos, decorative lines, and so on), headers and footers, placement


    and size of text frames, text format, and so forth.


    Styles control all of a master slide''s characteristics. New slides created using
    a master slide will have styles that are inherited from whichever master slide
    was used. Changing a style in a master slide results in changes to all slides
    based on it. However, you can modify individual slides without affecting the master
    slide itself.


    Master slides have two types of styles associated with them: presentation styles
    and image styles. The prepackaged presentation styles can be modified, but new
    presentation styles cannot be created. With image styles, you can


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_2.png)


    > Figure 6: Use the **Outline** view to focus on the text content and structure
    of your presentation, rather than the graphical aspects.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# LibreOffice Impress


    modify the prepackaged styles and create new image styles as well.

    Presentation styles affect three elements of a slide master: background, background
    objects (such as icons, decorative lines, and text frames), and the text on the
    slide. Text styles are further divided into *Notes*, *Outline 1* through *Outline
    9*, *Subtitle*, and *Title*. The outline styles are used for different levels
    of the outline. For example, *Outline 2* is used for the sub-points of *Outline
    1*, and *Outline 3* is used for the sub-points of *Outline 2*, and so on. Image
    styles are not restricted and can affect many of a slide’s elements. Note that
    text styles exist in both the presentation and image style selections.

    Let’s try it out! Start a new presentation, using the Alizarrin template, and
    add some text to the intro and first slides. Then, go to *View | Master Slide*,
    and you should see something that looks like Figure 7.

    Now try changing the text formatting for the header and other parts of the slide
    (i.e., change to a different font). If you go back to *View | Normal*, you can
    see that the formatting changes have been applied to the slide(s). So you can
    quickly and easily make changes across many (or all) slides at once, which is
    a real timesaver if you have a bunch of existing presentations for your company,
    but need to update them for new branding guidelines.

    To create a new master slide, right-click in a blank area of the Slides panel
    on the left, and choose *New Master*. Modify this master to suit your requirements.
    Note that it’s also recommended that you rename this new master. Right-click on
    the slide in the Slides pane and select *Rename Master* from the context menu.
    When you’re finished with creating the master slide, click *Close Master View*
    on the top toolbar and return to normal slide editing mode.

    Now you can create a new slide and use the sidebar to apply a master slide design
    to it (see Figure 8). Just click the *Master Slides* icon in the right-hand panel,
    and then choose the design from the top.


