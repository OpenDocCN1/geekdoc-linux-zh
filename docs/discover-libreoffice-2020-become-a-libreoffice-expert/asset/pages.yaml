    # BRACKETED


    Fences (parentheses, brackets, braces, vertical lines) are indispensable for building
    formulas. In the left sidebar they have their own entry, Brackets, in the drop-down.
    LibreOffice Math distinguishes between:


    +   - Group Brackets. They enclose related expressions but do not appear in the
    formula.

    +   - Braces. If you type curly brackets in the Commands pane from the keyboard,
    Math will understand them as Group Brackets. Instead, clicking the curly brackets
    icon in the Braces drop-down enters \lbrace and \rbrace in the Commands window
    and a set


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_47_2.png)


