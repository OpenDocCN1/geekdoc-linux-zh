    Wizard, I can quickly make use of these functions without having to memorize the
    calculated structure of the individual functions. For instance, instead of finding
    the total for the student by entering =SUM(E5:E5), listing the range of relevant
    cells by column and row, I simply select the cells by dragging with the mouse.


    not found in Excel and are not used if a spreadsheet that includes them is opened
    in Excel. A specific instance of a function with its unique set of data is known
    as a formula. Each function has its own input variables. Most variables are required,
    but some are optional. All variables can be entered manually from the Formula
    toolbar, which also includes a list of some of the most widely used functions.
    Most people, though, prefer to select a cell to hold the result and then add functions
    from Insert | Function, which opens the Function Wizard (Figure 3). The Function
    Wizard lists all variables, which can be entered manually, or, at times, by dragging
    and dropping cells on the spreadsheet. In addition, the Function Wizard previews
    results so that you can correct the variables before you insert a faulty function
    into the document.


    The Function Wizard is also useful for browsing functions in the left-hand pane.
    Functions are arranged into categories such as Financial, Logical, and Statistical,
    and you can display a single category by entering its first letter. For each function
    and variable, the Function Wizard includes a brief explanation. Another example
    from Designing with LibreOffice, Figure 4 shows an extract from a teacher''s grade
    book. The top half is a list of student''s grades for each assignment and their
    total for the course out of one hundred. The grading scale is in the boxed cells
    on the right. More importantly, some basic statistics are listed below the students''
    grades, generated by the functions Average, Median,


    # USING CALC TOOLS


    In addition to Calc tools, Calc includes a number of other tools that can be used
    with both lists and data arrays. These tools are scattered throughout the menus
    – mostly in Tools and Data – but can be divided into tools that change formatting
    and tools that work with functions to make them more powerful and easier to navigate.
    Tables 1 and 2 describe some of the most useful Calc tools.


