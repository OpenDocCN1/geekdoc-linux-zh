    \ files to a Master Document may sound alarming if you are familiar with past\
    \ versions of Microsoft Word, whose Master Documents were widely said to be in\
    \ one of two conditions: corrupted and about to be corrupted. But while Master\
    \ Documents are more robust, and, while they sometimes crash, they should not\
    \ destroy their component files. Still, just to be safe, make sure that you have\
    \ a current backup.\n\nIf you do not mind ignoring or losing the connection between\
    \ a document and its template, you can partly reformat using *Edit | Paste Special\
    \ | Unformatted Text* on a selection of text from another document. With this\
    \ command, text in the original formatting is inserted using the formatting of\
    \ the paragraph or character style in which it is\n\nplaced. However, objects\
    \ like images or tables are dropped and will have to be copied and pasted individually\
    \ using *Edit | Paste*.\n\nSimilarly, you can import styles from another document\
    \ using *Styles and Formatting | Load Styles*. This choice allows you to select\
    \ both the files and the categories of styles to upload: *Text* (paragraph and\
    \ characters), *Numbering*, *Frame*, and *Pages*. For fullest effect, use imported\
    \ styles with the same names as those in the files and select the *Overwrite*\
    \ box (Figure 5)\n\n# ## BEST PRACTICES\n\nAlthough you can circumvent the restrictions\
    \ on templates if necessary, remember that the restrictions are designed to preserve\
    \ your documents from harm. Generally, the following\n\n+   tics should help you\
    \ to use templates efficiently and without any difficulties:\n+   \n+   * Avoid\
    \ detaching documents from their templates whenever possible. Try not to detach\
    \ the document unless it is only going to be used once, and its maintenance is\
    \ unimportant.\n+   * Change the formatting only on the template.\n+   * Make\
    \ all formatting changes on the template. Then apply the revised template to the\
    \ document.\n+   * Apply changes to a document as soon as they are made in the\
    \ template. That way, you will not have to remember what changed, or wonder if\
    \ you made an accidental change the next time that you open the document.\n\n\
    It can take several hours to design a template. Probably, you will want to make\
    \ some tweaks after working with the template a time or two. However, once a template\
    \ does what you want, it can save you hours and remain useful for years. Discipline\
    \ yourself and work with the template system rather than opting for short-term\
    \ convenience, and templates can be one of your most valuable tools in LibreOffice.\
    \ ■■\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_58_0.png)\n\nFigure 5: Loading\
    \ styles from a template gives the effect of switching templates without actually\
    \ doing so.\n\n# INFO\n\n+   * [1] **LibreOffice templates and extensions for\
    \ downloading:** https://www.libreoffice.org/discover/templates-and-extensions/"
