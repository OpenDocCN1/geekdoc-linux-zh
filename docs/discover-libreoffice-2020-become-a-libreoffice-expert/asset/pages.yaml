  md: '# # COMMUNITY


    # ## Get Involved


    The Advisory Board (AB) provides a forum for organizations that contrib-ute a
    substantial minimum level of financial or other support as determined by the BoD
    to meet with the BoD and provide advice.


    # ### GET INVOLVED: LOCALIZATION


    LibreOffice is available in over 100 languages, but there’s always room for more!
    And as new features are added, these features need to be translated and documented
    in other languages as well. By helping out with localization, you can make LibreOffice
    available to many more people around the world.


    Localizing LibreOffice does not require highly specialized knowledge of programming
    or of open source software. Neither does it require knowledge of a specific operating
    system, such as Linux. You can localize LibreOffice on Microsoft Windows if you
    desire. Once completed, your localized resources can be very easily used to localize
    LibreOffice on other platforms if your language script is supported by those platforms
    – or less easily if this basic support is missing.


    You do need to understand how to download programs and data from the Internet,
    install them, and run them (following detailed instructions). You are also strongly
    advised to subscribe


    to at least one mailing list in which LibreOffice localization is discussed.


    LibreOffice, much like the open source world in general, is a collaborative effort.
    Many people are working as volunteers, so sometimes you need to be polite, patient,
    and – if you really want something – charming and convincing or learn how to do
    it yourself.


    There are a lot of people in the mailing lists who will be happy to help you if
    you ask in the right way.


    To get started, check out the list of LibreOffice language teams [3] to make sure
    that there is not already a localization project for your language. If there is
    one, get in touch with the project contact to find out the proj-


    # ### SUCCESS STORY: Jwtiyar Ali


    > Jwtiyar Ali helps with localizing LibreOffice into Kurdish. TDF asked him about
    his experiences.


    **To start with, tell us a bit about yourself!**


    Hey! I live in the Kurdish region, in the north of Iraq – the city of Sulaymaniyah.
    I have an MSc in Physics, but I love computer science too. Currently I am working
    in the Cement Quality Control Department at a cement factory, as a physicist.


    I do translations for many open source projects such as Ubuntu, Gimp, Firefox,
    etc., leading these translation projects. My hobbies are following new open source
    projects and seeing how they can be more competitive. I also like football, walking,
    and reading Python programming courses in my free time.


    **What are the opportunities and challenges for promoting/using free software
    and LibreOffice in your region?**


    In my country, promoting open source apps and systems is a very big challenge
    because most people – maybe 90% – use proprietary apps, because they don’t hear
    about or know about open source alternatives.


    So we in the team at www.chawg.org decided to make a website to introduce many
    open source projects. We created a wiki platform and a forum for that reason –
    and now we have Facebook groups and pages.


    In my opinion, it’s an opportunity to provide users with more guides, and make
    a comparison between LibreOffice with other apps. Show users what LibreOffice
    can do that others apps


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_93_0.png)


    can’t. Also, show people that LibreOffice can do the same things – or even more
    – with their daily work, and send them articles to educate them about the software.


    **What are you doing in the LibreOffice project right now?**


    I am translating LibreOffice. I hope to see LibreOffice in my language – that
    would be perfect. Also, it would help users to interact with LibreOffice more
    often than before.


    **How did you get involved in LibreOffice, and what was the experience like?**


    My love for open source projects made me engage with LibreOffice and the big community
    behind it. Being in the community made me feel that I wasn’t working in a specific
    part of the world – but people around the world can benefit from what I do. The
    experience was amazing, because I didn’t know beforehand that we have a great
    app like LibreOffice.


    **Anything else you want to add?**


    I want to thank everyone who helped me to join this great community.


    My passion for LibreOffice has no borders, and I hope to see other open source
    projects grow faster than ever.


    The best part of the community is that we all trust in open source and teamwork.


    These days, I am promoting LibreOffice to my colleagues and friends. Also, I help
    them to fix any problems that they may face during installing or when using the
    suite.'
