    ```\n\nAt this point, you can start working on the backup macro. The macro first\
    \ obtains the currently active document and checks to see whether it has already\
    \ been saved. The latter is required to retrieve the path to the document:\n\n\
    ```\n```bash\nThisDoc := ThisComponent\nIf ThisDoc.IsModified = False Then\n \
    \   MsgBox (\"Save the document first!\", 16, \"Attention!\")\n    ) : End\nEnd\
    \ If\n```\n```\n\nNext, the macro saves all unsaved changes in the document:\n\
    \n```\n```bash\nThisDoc.ThisDoc\nIf ThisDoc.IsModified Then\n    ThisDoc.StoreAsURL\
    \ (ThisDoc.URL, Args)\nEnd If\n```\n```\n\nTo construct a command that uploads\
    \ the currently opened document, the macro needs to obtain two things: the document's\
    \ path and name:\n\n```\n```bash\nDocPath := \n    ConvertFromURL (ThisDoc.getURL())\n\
    FileName := Dir (ThisDoc.getURL(), 0)\n```\n```\n\nIf you want the macro to open\
    \ a certain URL in the default browser, you can feed the URL to the shell command\
    \ in a third parameter:\n\n```\n```bash\nSub Main\nShell (\"xdg-open\", 1, \"\
    http://en.wikipedia.org/\")\nEnd Sub\n```\n```\n\nWith a few simple tweaks, you\
    \ can turn the code above into a lookup macro (Listing 1). First, you need to\
    \ add code that obtains the currently selected word (lines 2–3) and then modify\
    \ the Shell command so it points to Wikipedia's query URL followed by the selected\
    \ word (line 4).\n\nTo assign a keyboard shortcut to the created macro, choose\
    \ Tools | Macros | Organize Macros | LibreOffice Basic. In the dialog that opens,\
    \ click the Assign button. A new Customize dialog will pop up (Figure 2).\n\n\
    Click the Keyboard tab and choose a shortcut with an empty slot from the Shortcut\
    \ Keys section. To find the Lookup function you just wrote, look under LibreOffice\
    \ Macros in the Category pane at the bottom of the dialog, and then highlight\
    \ the macro in the Function pane and click the Modify button to assign it.\n\n\
    In the example shown in Figure 2, I assigned Lookup to the Shift + F10 shortcut.\
    \ Now, every time I press Shift + F10, I can look up the word under the cursor\
    \ in the currently opened LibreOffice document.\n\n# BACK UP\n\nAmazon S3 [2]\
    \ offers unlimited storage at unbeatable prices, so it's a perfect service for\
    \ off-site backup. With the use of a little bit of LibreOffice Basic magic and\
    \ the aws Perl script, you can seamlessly back up the currently opened document\
    \ to Amazon S3. Before you start, you must sign up for Amazon S3 and download\
    \ the latest version of the aws script from the project's GitHub repository [3].\n\
    \n```\n```bash\n01 Sub Lookup()\n02     ThisDoc := ThisComponent\n03     LookupWord\
    \ := ThisDoc.CurrentController. getViewCursor()\n04     Shell (\"xdg-open\", 1,\
    \ \"http://en.wikipedia.org/wiki/\" & LookupWord.String)\n05 End Sub\n```\n```\n\
    \nFigure 2: Assigning macros to keyboard shortcuts lets you run them whenever\
    \ you want.\n\n# Listing 1: Word Lookup Macro"
