  md: "# # GET PRODUCTIVE\n\n# ## ODF XML\n\nfindall) call takes an extra argument:\
    \ the second argument is the namespaces dictionary.\n\nLine 27 contains a modification:\
    \ The old text (x.text) is replaced with a new version (x.text.replace(\"Linux\"\
    , \"Windows\")) – this is the place where you can modify the script to do whatever\
    \ you like.\n\nWe did not use the more specific root.findall('.//text:p') + root.findall('.//text:span')\
    \ because it would present the elements in the wrong order (first all the text:p\
    \ and then all the text:span elements).\n\nSince the script filters further for\
    \ the existence of some text (content), it does not matter.\n\n+   4. The last\
    \ step creates a new zip file: the zipfile module is not able to modify existing\
    \ files (which would otherwise be the obvious thing to do: Remove the old /content.xml\
    \ and add the new version to the zip file). Instead I create a new zip file and\
    \ then copy all files from the old to the new zip file, with the exception of\
    \ /content.xml. It is added at the end (in lines 35–36). (The @ keyword enables\
    \ a Python feature that automatically closes the opened file when you leave the\
    \ with block.)\n\nAnd that’s it. With some small changes, you can let the script\
    \ evaluate more command-line arguments and turn it into a universal search and\
    \ replace tool. Create a for loop (like in loggrep.py in Listing 2) to apply your\
    \ changes to several files at once.\n\n# ### DATA IN CALC SHEETS\n\nThe XML for\
    \ a Calc sheet must follow different rules than the XML for a Writer document:\
    \ After all, Calc requires a strict ordering of each sheet into columns and rows.\
    \ Figure 7 shows a fragment of a Calc file’s content.xml, which I have reformatted\
    \ (line breaks and indentation) for better reading.\n\nThere is some redundancy\
    \ in how Calc stores the cell contents. When you enter the number 6 in a cell\
    \ and then format it as a currency cell, the entry will be stored as:\n\n```\n\
    <table:table-cell\noffice:value-type=\"currency\"\noffice:currency=\"USD\"\noffice:value=\"\
    6\"\ncalcext:value-type=\"currency\"\n<text:p>6,00</text:p>\n</table:table-cell>\n\
    ```\n\nActually, this redundancy is helpful: Calc stores the value (6) and formatting\
    \ hints (currency, USD) in attributes of <table:table-cell>, and the content of\
    \ that tag is a <text:p> tag, which holds the readable (formatted) representation\
    \ as it appears when editing.\n\nThe same happens for a formula, such as:\n\n\
    ```\n<table:table-cell\n table:formula=\"of:SUM([.B3;.B4])\"\n office:value-type=\"\
    currency\"\n office:currency=\"USD\"\n office:value=\"11\"\n calcext:value-type=\"\
    currency\"\n<text:p>$11.00</text:p>\n</table:table-cell>\n```\n\nHere, the real\
    \ content (from Calc’s point of view) is the formula, which is stored as of: =SUM([.B3;.B4]).\
    \ However, the text field shows $11.00, because the cell has also formatted as\
    \ US Currency. Modifying Calc cells is beyond the scope of this article (since\
    \ you would have to get the dependencies right), but it is possible: The xml.etree.ElementTree\
    \ module lets you inspect element attributes, too.\n\nSearching a document is\
    \ no problem; loggrep.py shows the matches inside <text:p> tags:\n\n```\n$ ./loggrep.py\
    \ l1 calc-test2.ods\ncalc-test2.ods:t11.00/<text:p>\n```\n\n# ## NOW ROLL YOUR\
    \ OWN\n\nSearch and replace is only one task that you can automate. If you can\
    \ think of some manual edits that you’ve done to LibreOffice files in the past,\
    \ it is likely that you can modify the inspect.py script so that they’ll be done\
    \ automatically the next time.\n\nWhen you try to adapt the Python script to your\
    \ own ideas, you might run into some questions (unless you are already a\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_79_0.png)"
