    # GERMANY – EVENTS AND MEETUPS


    Germany and LibreOffice have a strong connection. StarOffice, the precursor to
    OpenOffice.org (which in turn was the precursor to LibreOffice), was first developed
    in Hamburg in the 1980s. Over the years, many other developers joined the team,
    in and around Hamburg and other parts of Germany. Even today, many years later,
    the German community is active, attending events and holding regular community
    meetups.


    In August 2019, Community members attended FrOSCon in Sankt Augustin, a town just
    outside of Bonn. FrOSCon is one of the largest free and open source software (FOSS)
    conferences in the country, with around 2,000 attendees. Most of the visitors
    know about FOSS already, but some had only learned about it recently and were
    eager to discover more. Gerrit Großkopf, Uwe Altmann, Stefan Unverricht, and I
    (Mike Saunders) had a booth with flyers, stickers, and a computer demonstrating
    LibreOffice 6.3 and LibreOffice Online, the web-based version of the suite [3].
    Many visitors to the booth had no idea that LibreOffice Online existed and were
    eager to try it out on their own infrastructure.


    # CZECH REPUBLIC – FREE SOFTWARE EVENTS


    Members of the Czech LibreOffice community, including Stanislav Horáček, Zdeněk
    Chronek, and Petr Valach, attended two conferences in autumn 2019: LinuxDays in
    October and Open-Alt in November. They had a booth with flyers, stickers, and
    laptops demonstrating the latest LibreOffice version and answered visitors’ questions.


    Topics that visitors brought up included LibreOffice Online, macros, automatic
    updates, handwriting recognition, and the Czech dictionary. Stanislav summarized
    his experiences: “We can really recommend these types of events, as you get feedback
    from both end


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_88_2.png)


    Like LibreOffice, Linux is an operating system that’s free and open source, and
    LibreOffice community members attend Linux events.'
