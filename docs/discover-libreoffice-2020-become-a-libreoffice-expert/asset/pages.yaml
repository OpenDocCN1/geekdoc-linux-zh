  md: '# Getting involved with the LibreOffice community


    # # Everyone Welcome


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_91_0.png)


    Join the LibreOffice community and help to improve the software. You don''t need
    to be a programmer; there are lots of ways to dive in and build your skills! By
    Mike Saunders


    LibreOffice is community-driven and developed software that is a project of the
    nonprofit organization, The Document Foundation (TDF). LibreOffice is developed
    by users who believe in the principles of free and open source software and in
    sharing their work with the world in nonrestrictive ways. At the core of these
    principles are the four essential freedoms and the tenets of TDF''s Next Decade
    Manifesto [1] to which the community commits itself:


    +   - *To eliminate the digital divide in society by giving everyone access to
    office productivity tools free of charge to enable them to participate as full
    citizens in the 21st century*

    +   - *To support the preservation of mother tongues by encouraging people to
    translate, document, support, and promote our office productivity tools in their
    mother tongue*

    +   - *To allowing users of office productivity software to retain the intellectual
    property in the documents they create by use of open document formats and open
    standards*

    +   - *To an open and transparent peer-reviewed software development process where
    technical excellence is valued*


    Similarly, the manifesto rejects:


    +   - *The creeping domination of computer desktops by a single language, forcing
    all people to learn a foreign language before they can express themselves electronically*

    +   - *The ownership of file formats by proprietary software companies – documents
    belong to their creators, not software vendors*

    +   - *A closed software development process where errors can lie hidden and poor
    quality is accepted*


    # ### ESSENTIAL FREEDOMS


    The LibreOffice community believes that users should have the freedom to run,
    copy, distribute, study, change, and improve the software that it distributes.
    While TDF does offer no-cost downloads of the LibreOffice suite of programs, free
    software is first and foremost a matter of liberty, not price. LibreOffice supporters
    campaign for these freedoms because they believe that everyone deserves them.


    Similarly, the community seeks to eliminate the digital divide and empower all
    as full citizens, support the preservation of mother tongues, and avoid proprietary
    software and format lock-in. The LibreOffice community works to attain its goals
    [2] by:


    +   - Providing unfettered access to office productivity tools at no cost'
