    on operating systems that support multiple displays, and only when two displays
    are connected (one may be the lap-top built-in display, for instance).

    To enable the Presenter Console, go to *Tools | Options* (Windows and Linux) or
    *LibreOffice | Preferences* (Mac OS), and then select *LibreOffice Impress* on
