    # ARRANGING OBJECTS


    Objects are placed on your active workspace in the order they were created. The
    first object will be the bottom layer, and each subsequent object will be the
    next layer up from the previous object. To change the order of objects, select
    Arrange from the context menu or the Shape menu (located in the menubar).


    Using the mouse to create and place objects is a quick way to get acceptable results.
    However, sometimes you need more precision. Draw offers a few options for achieving
    this.


    If you still want to use the mouse, you can activate Display grid or Help lines.
    With Display grid, you can snap objects automatically to the page’s grid. If you
    need more customization, Help lines lets you create a non-printing line for alignment.
    To create a help line, place your mouse cursor inside one of the page rulers,
    press your mouse button, and drag the cursor inside your drawing area. Once created,
    you can change the help line’s properties (x- or y-position), so you can even
    place a help line by entering coordinates.


    Since all objects have metric dimensions and a position on the active


