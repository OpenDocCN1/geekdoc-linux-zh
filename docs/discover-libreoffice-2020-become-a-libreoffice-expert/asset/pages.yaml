    # LibreOffice Typography


    fixed (*Height*) or variable (*Autofit height*) as well.


    What’s more, that is just the first tab. Click the *More* button, and you can
    surround the header with a border or separate it from the main text with a signal
    line, while setting the *style*, *thickness*, and *color*, as well as the distance
    between the border or box and the header’s contents. You can even customize a
    shadow to add a 3D effect, although I wouldn’t recommend that feature unless you
    want a retro 1990s look (Figure 2).


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_66_0.png)


    And so it goes for every feature available in *Writer*. Page margins, tables,
    text wraps, tables of contents, and superscript and subscript letters – almost
    every aspect has as much degree of choice as you can imagine. At times, you might
    need some ingenuity to get the exact layout you want, but the actual limitations
    are few. You cannot, for example, create a list style that counts down from 10,
    but adding one manually is a rare and minor inconvenience at best.


    # LINE SPACING, KERNING, AND HYPHENATION


    Writer’s *customization tools* include many features found only in layout programs.
    Like most word processors, *Writer* gives you default spacing between lines that
    are single or double spaced and work reasonably well for many fonts. However,
    for many fonts, this default makes the text appear too light or too dark. When
    that happens, *Writer* gives you the alternative of clicking *Indents & Spacing
    | Line spacing | Fixed* to adjust the line spacing exactly as a professional publisher
    would, in increments of one-hundredth of a point, or 1/720th of an inch (Figure
    3).


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_66_1.png)


    Better yet, if you want complete control over the adjustments, you can create
    a character style that uses *Format | Character | Position | Spacing to* tweak
    the spacing between characters by increments of one-twentieth of a point (i.e.,
    1/720th of an inch). Perfectionists can even create separate character styles
    to be used with different letter combinations.


    The only trouble is, by the time you finish editing and revising, the hyphen-
    ation is no longer the best possible result. Fortunately, if you have a hyphen-
    ation dictionary installed for the language you are using, you can click *Tools
    | Language | Hyphenation* to check a document’s hyphenation, positioning hy- phens
    so they fall exactly where you want them (Figure 6). If a poor hyphen- ation break
    remains, you can either insert a break manually by pressing Ctrl + - (dash) or
    prevent a break by listing a word as never to be hyphenated in *Tools | Options
    | Language Settings |


