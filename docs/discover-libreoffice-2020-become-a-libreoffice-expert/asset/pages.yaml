    ODF is not a single format but a collection of formats for the various file types
    needed in an office productivity suite. See Table 1 for a list of ODF file types
    and file extensions.


    # A SHORT HISTORY OF ODF


    The first meeting to discuss the ODF standard was held on December 16, 2002. ODF
    1.0 specifications were published on May 1, 2005 and then submitted to ISO/IEC
    Joint Technical Committee 1 (JTC1) on November 16, 2005 under a Publicly Available
    Specification (PAS). After a six-month review period, on May 3, 2006, OpenDocument
    unanimously passed its six-month Draft International Standard (DIS) ballot in
    JTC1 (ISO/IEC JTC1/SC34), with broad participation. In 2008, OpenDocument received
    approval in ISO/IEC JTC1/SC34, for release as an ISO and IEC International Standard
    under the name ISO/IEC 26300:2006. ODF 1.2, approved as ISO/IEC 26300:2015


    # STANDARDS AND PSEUDO-STANDARDS


    When software is forced to adapt its format to a dominant product that is not
    based on open standards, the dominant vendor can use this power position to influence
    the market. Often the dominant product becomes a de facto, pseudo-standard that
    has never been vetted or approved but is merely adopted by the market out of necessity.
    Any flaws in the dominant product are then echoed out to the whole industry. For
    instance, the 40-year-old “leap year bug,” which was inherited from Visi-Calc
    and Lotus 1-2-3 and passed to Excel, causes the market-leading spreadsheet to
    incorrectly represent the year 1900 as a leap year, which can cause errors for
    applications that count days or measure time ranges. Developers of other offices
    suites had to replicate the bug for compatibility.


    According to the vendor, the faulty state has to be maintained, even across new
    releases of the product, because fixing it would cause too many problems. So,
    users are encouraged to keep the faulty spreadsheets, because the vendor protects
    its commercial interests in spite of the needs of users who have paid for a software
    license.


