  md: '# GETTING STARTED


    # LibreOffice Writer


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_16_0.png)


    Figure 6: The Formatting Marks option shows you exactly where spaces, tabs, newline
    characters, and new paragraph characters are placed in a document.


    also a toolbar icon for it as well).

    You can search for specific characters or show certain subsets of characters using
    the drop-down list at the top-right of the window. A selection of your most recently
    used special characters is displayed along the bottom of the window.


    +   9. **Autocorrect:** LibreOffice Writer tries to give you a helping hand by
    automatically formatting certain things (such as dates) or making corrections
    to words you have misspelled. If you don’t want this, though, go to *Tools | AutoCorrect
    Options* in the menu. Look at the *Replace* tab in the dialog that appears to
    see what LibreOffice automatically replaces. If you don’t want any of these automatic
    replacements, go to the *Options* tab and uncheck *Use replacement table*. This
    *Options* tab is also the place to disable many other features, such URL recognition,
    correction of two initial capital letters, and so forth.


    +   10. **Formatting Marks:** Sometimes it’s useful to see exactly what LibreOffice
    is doing with your text. For example, you may want to know where exactly there
    are spaces or whether your text is a new paragraph (created with the Enter key)
    or a regular newline (created with Shift + Enter). To see all of this “behind
    the scenes” data, go to *View | Formatting Marks*. Once you’ve selected this,
    you’ll see that “whitespace” – content that isn’t normally printed – is now displayed
    in blue (Figure 6). To disable this feature, simple click it again in the menu.


    # AN INTRO TO STYLES


    As mentioned early on, styles are a key feature of Writer. When you’re working
    on longer documents, they’re absolutely essential for maintaining consistency
    across documents. Plus, they make it easier to make document-wide changes in a
    few clicks. A lot of word processor users manually format paragraphs, words, tables,
    page layouts, and other parts of documents without paying any attention to styles.
    They’re used to writing documents based on individual physical attributes: For
    example, they might specify the font family, font size, and any formatting such
    as bold or italic, on an individual basis, per paragraph or even per word. Manual
    formatting is not ideal.


    A much better option, styles are sets of formats that you can apply to selected
    pages, text, frames, and other elements in your document to quickly change their
    appearance. When you apply a style, it often means applying a whole group of formats
    at the same time.


    So styles are logical attributes (rather than physical attributes used in manual
    formatting). Using styles means that you don’t specifically say “this text should
    be font size 12pt, Sans, bold, right-aligned.” Instead, you use *Title 1*, because
    you have defined the *Title 1* style to have those characteristics. In other words,
    using styles means that you shift the emphasis from what the text (or page, or
    other element) looks like, to what the text is.


    Ultimately, styles help to improve consistency in a document. In addition, they
    also make major formatting changes much easier. For example, you may decide to
    change the indentation of all paragraphs, or change the font of all titles. Doing
    this manually for a long document may require making individual changes in dozens
    of places – a real time sink! In contrast, when you use styles, you only need
    to make a single modification.


    # STYLES IN ACTION


    In Writer, there are various types of styles:


    +   * **Page styles.** These include margins, headers and footers, borders, and
    backgrounds.

    +   * **Paragraph styles.** These control all aspects of a paragraph’s appearance,
    such as text alignment, tab stops, line spacing, and borders; they can include
    character formatting.

    +   * **Character styles.** These affect selected text within a paragraph, such
    as the font and size of text, or bold and italic formats.

    +   * **List styles.** These allow you to select, format, and position numbers
    or bullets in lists.


    To try them out, type some text into a document and look at the *Default Style*
    drop-down list in the top-left corner of the window. Click the list to display
    some of the other built-in styles for Writer, such as headings and titles (Figure
    7).


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_16_1.png)


    Figure 7: Some of the default styles supplied with Writer.'
