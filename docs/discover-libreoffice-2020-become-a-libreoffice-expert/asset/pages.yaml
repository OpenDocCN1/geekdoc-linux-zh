  md: '# GET PRODUCTIVE


    # Hidden Gems of LibreOffice


    # LIBREOFFICE ONLINE


    Something else worth keeping an eye on is LibreOffice Online (see Figure 5). As
    the name suggests, this is a version of the suite that can run inside a web browser,
    with the content being served over the network. LibreOffice Online has been in
    development for a few years, but has recently made major strides forward thanks
    to Collabora, which specializes in long-term supported versions of the suite (e.g.,
    for government and enterprise usage).


    Currently, LibreOffice Online looks and feels very much like the desktop version
    of the suite, but not every single menu item or feature is available - it''s a
    bit trimmed-down in some respects.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_84_0.png)


    But it''s making rapid progress, largely because of Collabora. Because it uses
    the same underlying document layout engine as desktop LibreOffice, Open Docu-
    ment Format (ODF) files should be displayed identically when you''re switching
    between the browser and native app.


    LibreOffice Online can be inte- grated with Nextcloud for a fully FOSS document
    sharing and col- laboration system. It still needs some work, especially in terms
    of performance, but it''s coming on well - you can get access to a demo on Collabora''s
    website [7]. Note that the Document Founda- tion has no plans to provide hosted
    versions of LibreOffice Online, because it would require a vast amount of resources
    [4]. Up- take was quick. Instead, the soft- ware is available for third parties
    to install and run on servers.


    This tells you that “MS Word 97” is the name we should use when apply- ing the
    filter. (It’s also the same as the filename, but without underscores - but it’s
    always worth checking the content of the filter file as well.)


    With this trick, supplying the docu- ment extension followed by the filter name
    in quotes, you have access to a wide range of file formats. If you''re working
    with large collections of legacy documents and need to shift them from one format
    to another, this command can be a godsend. Yes, it’s a bit fiddly having to poke
    into the LibreOffice source code to explore this, but it works. And, if you want
    to contribute back to the suite, an effort to document this would be very welcome
    by the devel-opment team!


    +   - A new Writer Outline folding mode has been added. This adds a button next
    to every heading in your document, which you can click to show/hide the following
    section. This makes it easier to work with large documents.

    +   - A Styles Inspector has been imple- mented, for displaying all the attri-
    butes of Paragraph Styles, Character Styles and manually formatted (direct formatting)
    properties.


    +   - In Impress, new physics based ani- mation capabilities and new anima- tion
    effect presets are included: namely Fall Simulated, Shoot right/ left and return,
    Fall and fade out. Keep an eye on the wiki [6] for the latest details on changes
    and improvements! Also, check out the “LibreOffice Online” box for information
