  md: "# # GETTING STARTED\n\n# ## LibreOffice Base\n\nTo create this, you need to\
    \ open the form for editing again. First click on a field in the main form and\
    \ then on the *More Controls* icon toward the bottom of the left sidebar. By Ctrl-clicking\
    \ *Navigation Bar* in the new controls, a new, Navigation Bar appears in the form\
    \ that contains nearly all the same fields as the Navigation Bar at the bottom\
    \ of the screen.\n\n# ## SEARCHING DATASETS\n\nBase itself has a few search functions\
    \ built in. Unfortunately, these functions are more difficult to manage while\
    \ using a form. To change this, you have to go slightly deeper, where basic knowledge\
    \ of *SQL* code is a must. For general help, you can refer to the download able\
    \ Base manual.\n\nTo begin, create another table in which to save the search term\
    \ with *Tables | Create Table in Design View* and add the fields:\n\n+   ID as\
    \ *Yes/No* [BOOLEAN]  \n+   Search as *Text* [VARCHAR]\n\nRight-click the *ID*\
    \ field to make it the primary key and save the table with the name *Search*.\
    \ Insert \"ID\" = *true* in the first row of the table. This table should only\
    \ save this one data set.\n\nOpen *Queries | Create Query in SQL View*, to enter\
    \ code more quickly than in *Design View*, and type:\n\n```\nSELECT * FROM \"\
    Article\"\nWHERE \"Article\" LIKE COALESCE\n(\n(SELECT \"Search\"\nFROM \"Search\"\
    \nWHERE \"ID\" = TRUE\n), \"Article\")\n```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_0.png)\n\
    \nFigure 9: The Form Navigator shows all the elements of a form.\n\nThe *COALESCE*\
    \ function checks whether *Search* is empty; however, if *TRUE*, *Article* and\
    \ *Article* should always have content and *Article* should always have the same\
    \ as *Article*, this word now shows all *Article* table data. If a word is entered\
    \ in *Search*, only *Article* items that match the entered value are shown. This\
    \ query has to be improved a bit so that also parts of the search entry show results:\n\
    \n```\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE COALESCE\n( '%' ||\n\
    (SELECT \"Search\"\nFROM \"Search\"\nWHERE \"ID\" = TRUE\n) || '%', \"Article\"\
    )\n```\n\nTo test the query, click the *Run Query* icon in the toolbar or press\
    \ *F5*. All the data sets from the *Article* table are shown. The last line displays\
    \ *AutoField* in the *ID* field.\n\nAmend the code to look in the *Search* table\
    \ for an entry with the value *Search* and compare it to the *Article* field in\
    \ the *Article* table:\n\n```\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE\n\
    (\nSELECT \"Search\"\nFROM \"Search\"\nWHERE \"ID\" = TRUE\n)\n```\n\nYou will\
    \ probably not see any values now, because the content of content of *Search*\
    \ of the table *Search* is empty. Amend the code again to:\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_1.png)\n\
    \nFigure 10: Cycle only through the active record – no navigation bar, no new\
    \ rows, ...\n\nBy using *%*, the hits on the search term can now contain any number\
    \ of characters before and after the term. One input can therefore get multiple\
    \ hits. The only downside is that it still distinguishes between lower- and uppercase.\
    \ The following query now allows the entry of text contained somewhere in the\
    \ *Article* field, regardless of upper- and lowercase:\n\n```\nSELECT * FROM \"\
    Article\"\nWHERE LOWER ( \"Article\" ) LIKE COALESCE\n( '%' ||\n(\nSELECT LOWER\
    \ ( \"Search\" )\nFROM \"Search\"\nWHERE \"ID\" = TRUE\n) || '%', \"Article\"\
    )\n```\n\nNow save this query as *qrySearchArticle*, copy the form already created\
    \ under\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_2.png)\n\nFigure 11: Form\
    \ with search function. Nine records were found with content *Meter*."
