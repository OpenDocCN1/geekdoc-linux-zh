  md: '# GET PRODUCTIVE


    LibreOffice Typography


    # Setting type in LibreOffice Writer


    # Typecast


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_65_0.png)


    LibreOffice Writer is a serviceable desktop publisher with more typography features
    than most users imagine. *By Bruce Byfield*


    Y ears ago, Elizabeth Mathias, an employee of Sun Microsystems, told me a story
    about StarOffice, the proprietary program that became OpenOffice.org, and later
    LibreOffice and Apache OpenOffice. According to Mathias, when the Writer module
    was first developed several decades ago, its programmers were told they would
    have to use it to document their work. As a result, they made sure that Writer
    was not simply a word processor, but a layout program as well – to the benefit
    of free software users everywhere. In fact, although not complete, Writer’s features
    are advanced enough that it should hardly be considered a word processor at all.


    Admittedly, the features of Writer often go unnoticed. If you format manually,
    you might be completely unaware of them. Even if you use styles, you might not
    have noticed them fully. In fact, although not complete, Writer’s features are
    advanced enough that it should hardly be considered a word processor at all.


    However, if you want to enhance your document, the tools are waiting. Take, for
    example, the tools for setting up a header in a page style (Figure 1). Once a
    header is turned


    on, you can simply select *Same content left/right* and *Same content on first
    page*, and your header is set up.


    If you want more control, you can give the header separate margins from the main
    text (*Left margin* and *Right margin*); adjust the space between the bottom of
    the heading and the main text, making it fixed (*Spacing*) or variable (*Use dynamic
    spacing*); or make the height of the header


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_65_1.png)


    Figure 1: Almost every aspect of headers in Writer can be customized.'
