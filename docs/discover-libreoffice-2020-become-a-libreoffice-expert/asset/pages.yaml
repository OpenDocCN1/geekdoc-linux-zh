- pgno: 45
  md: '# Working with the formula editor


    # Formulas

    and Formats


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_45_0.png)


    The LibreOffice Math package lets you display simple and complex formulas. *By
    Franz Böhm and Paul Brown*


    The Math formula editor works either as a stand-alone program or from the other
    LibreOffice modules and embeds perfectly formatted formulas into text documents,
    spreadsheets, presentations, and drawings. Math can represent fractions, powers,
    integrals, functions, and even whole systems of equations or matrices.


    To start Math in a separate window, click `File | New | Formula`. To include a
    formula in Writer, Calc, Impress, or Draw, select `Insert | Object | Formula`.
    The formula becomes an embedded object in the document that you can drag and drop
    and scale up or down. Working with the three-pane Math editor is the same in either
    case.


    On the left is a sidebar and at the bottom right a Commands pane, which is normally
    docked but can be separated and re-docked by pressing Ctrl and double-clicking
    on the frame. Above the Commands pane is a preview area that shows the formula
    as it will appear in the document. Clicking `View | Elements` displays helpers
    in a small Elements window that is especially useful for Math beginners, making
    it easier to enter formulas.


    Note that the formula editor does not perform calculations. Math is used exclusively
    for writing and displaying formulas.


    # WORKSPACE


    When you start up Math, the workspace is empty. To begin, select one of the nine
    categories from the sidebar drop-down or from the top two rows of icons in the
    Elements window. The categories include:


    +   - *Unary/Binary Operations*

    +   - *Relations*

    +   - *Set Operations*

    +   - *Functions*

    +   - *Operators*

    +   - *Attributes*

    +   - *Brackets*

    +   - *Formats*

    +   - *Others*


    Lead image © Roman Gorikov. 123RF.com'
