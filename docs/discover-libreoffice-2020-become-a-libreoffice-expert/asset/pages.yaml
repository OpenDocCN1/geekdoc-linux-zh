    # THE ART OF THE PRESENTATION


    Regardless of your opinion of Steve Jobs, there’s no doubt that he was excellent
    at presenting new Apple products. If you’ve never seen any of his presentations
    before, search onto YouTube and do some searching – the original iPhone and MacBook
    Air are two classic examples. Jobs’ presentations weren’t packed with text and
    excessive detail, but instead showed individual features, images of the devices,
    and occasional specs. He elaborated on the slides with his words, and it all came
    together into an impressive presentation.


    Of course, Jobs’ presentation style isn’t appropriate in every situation. Demonstrating
    flashy new gizmos to salivating tech journalists is very different from updating
    your boss on sales or showing some holiday photos to family and friends (see the
    “Creating a Photo Album” box). But here are some general tips to always keep in
    mind:


    +   ■ **Get off to a quick start.** No one likes a long-winded presentation. Instead
    of starting with “In this presentation I’m going to...”, begin immediately with
    an interesting fact, stat, or discovery. This catches your audience’s attention
    straight away and gives them hope that the rest of the presentation will be interesting.


    +   ■ **Keep your focus on the audience.** It’s easy to keep turning around to
    look at your slides, but that only encourages you to read or describe what’s on
    the screen, which adds nothing to the presentation. Look at your audience, and
    get a feel for how they are responding.


    +   ■ **Add anecdotes and stories.** If you’ve ever seen a TED talk, you’ll know
    that they’re full of anecdotes. Sometimes this can seem a bit cheesy, so don’t
    overdo it, but one or two humorous digressions in a presentation help to break
    it up – and wake up anyone who is about to nod off!


    +   ■ **Use the “10-20-30” rule.** Also from an Apple employee, this basically
    says that presentations should generally be no longer than 10 slides, 20 minutes
    in length, and use a font size of 30pt or more.


    +   ■ **Replace text with talk.** If your slide has lots of slides full of text,
    try reducing them to some key points or images, and then tell your audience the
    rest. You’re there, giving the presentation, so make sure you’re adding value!


    for an introduction (or ending), whereas the second is for regular slides with
    text and images.


    So, add some text to the first slide, then select the second slide from the left-hand
    panel, and add some text (and maybe an image) as well. Before you do any more
    work, check out your super quick two-slide presentation! Hit F5 (or go to Slide
    Show | Start) and you’ll see how it works. With the first slide displayed, click
    anywhere on the screen – or press the Space bar – to move on to the second slide.
    After that, the presentation ends. If you accidentally interrupt a presentation
    by pressing the Esc key, you can resume it from the current slide with Shift +
    F5 (or *Slide Show | Start from Current Slide*).*


    # CREATING A NEW PRESENTATION


    So let’s go ahead and make a presentation! For general tips on how to engage your
    audience and shape your presentations for maximum effectiveness, see the box “The
    Art of Presenting.” For now, focus on the software itself.


    Most of the preinstalled templates include two or more variants of a design. For
    instance, in the Allianz template that I chose in Figure 1, you can see two slides
