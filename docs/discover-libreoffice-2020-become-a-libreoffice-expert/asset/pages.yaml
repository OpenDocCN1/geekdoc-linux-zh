  md: '# GET PRODUCTIVE




    # Inspecting the XML Code inside LibreOffice Files


    # Digging Deep


    You may have heard that LibreOffice files “are XML-based” or “use XML,” but when
    you try to open a Writer document in a text editor, you only see a binary blob.
    Learn how to access and modify the hidden XML content using scripts. **By Hans-Georg
    Eber**


    **M**agine that you held a talk at your company’s recycling event last year, and
    you created a presentation and a hand-out to go with your talk – full of references
    to the old year 2018 and the new year 2019. Now you’re asked to do it again, so
    you launch LibreOffice, open the old documents – you want to reuse many of the
    slides – and start searching and replacing.


    Want to skip the manual work? This article shows you how to do it. Granted, there
    is a learning curve. I will be talking about XML, Bash, and Python – three possibly
    new languages (one for data, two for code). At the end, you will be able to search,
    analyze, and modify LibreOffice files automatically.


    For example, Figure 1 shows how all occurrences of “Linux” were replaced with
    “Windows” in an Impress presentation.


    Opening a Writer, Calc, or Impress file in a text editor yields an uninspiring
    collection of seemingly random characters – there’s no intelligible content. But
    once you learn that these files are zip-compressed archives, things start to make
    sense. In order to peek inside such an archive, rename the file (or make a copy)
    so that the file name ends with .zip. Then you can use your favorite archive tool
    (or the command line tool unzip) to unpack the archive, and you will find a whole
    hierarchy of files (Figure 2).


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_73_0.png)


    The most important file is **content.xml**, which sits in the top folder: It contains
    the text or data you entered in the LibreOffice application, and there are also
    links to multimedia elements (typically image files). You can open content.xml
    and the other XML files in a text editor.


    Now, why would you want to inspect the XML code so thoroughly? There’s a multitude
    of practical applications that come to mind. For example, imagine you write a
    document that contains source code listing fragments in some programming language,
    and you would like to have key words highlighted.


    Often, people will choose the quickest approach (that is, take a screenshot of
    a text editor window in which the code is displayed with highlighting enabled,
    and then paste that into the document), but that will prevent copying and pasting
    code from the document. It would be much nicer to simply enter the code verbatim
    and then have it formatted automatically. By looking at (and modifying) the XML
    data, you could do this, but that’s actually an advanced task, since it would
    require generating a new text character style from scratch and adding new nodes
    to the XML tree.


    For this article, I will stick with two standard tasks: searching for key words
    in documents and automatically making small modifications to documents.


    # A “HELLO WORLD” DOCUMENT


    In order to get started, create a Writer document and put just one line of text
    into it: “Hello World.” Do not apply any styles or other formatting, and save
    the document to `hello-world.odt`. Now the'
