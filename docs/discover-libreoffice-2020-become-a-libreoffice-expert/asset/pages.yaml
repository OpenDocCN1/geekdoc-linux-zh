    To add additional text boxes, go to *Insert | Text Box* or press F2. You can then
    click and drag to determine the exact position and size of the text box. Formatting
    text inside these boxes is very straightforward – just use the sidebar’s *Properties*
    deck, and then the *Character* and *Paragraph* decks (if you can’t see the decks,
    click the + parts to change them to +, which makes them visible). Most of the
    options there are the same as in Writer, so you can just carry over your knowledge!


    You can also add shapes: *Insert | Shape* shows you a list of available shapes,
    including lines, arrows, sym-'
