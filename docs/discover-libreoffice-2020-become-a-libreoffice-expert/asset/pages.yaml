  md: "to avoid ambiguity, you can prefix each tag with a namespace identifier. So\
    \ <title> from the XHTML world could become x:title>, and <title> from the DC\
    \ world could become <dc:title>.\n\n```\n\"first\" -> \"one\"  \"second\" -> \"\
    two\"\n```\n\n```\nxmlns:name=\"url\"\n```\n\nThose namespaces have to be declared\
    \ in the header of the XML file. For the XHTML/DC example, this could look as\
    \ follows:\n\nwhich is more flexible. The name <dictionary> makes sense. For example,\
    \ an English-German dictionary might be stored in a Python dictionary as en_de\
    \ = {\"one\": \"eins\", \"two\": \"zwei\", \"three\": \"drei\", ...}, and en_del(\"\
    one\") will return \"eins\".\n\nand then splitting each matching string and stripping\
    \ away the parts which are not needed (the \" signs). 3. In the third step, I\
    \ access the XML element tree, starting at the root element, root.findall(\"//\"\
    , ns) finds all elements (including those without any readable content), but in\
    \ the next line I check the text attribute, which is void (false) if there is\
    \ no text. Note how this\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<myroot\n xmlns:x=\"http://www.w3.org/1999/xhtml\"\n xmlns:dc=\"http://purl.org/dc/terms/\"\
    >\n...\n</myroot>\n```\n```\n\nBuilding the dictionary works by searching for\
    \ the pattern\n\nIt is possible to have one namespace that works without a prefix,\
    \ but in case of LibreOffice documents, every namespace is assigned a prefix.\
    \ Python's xml.etree. ElementTree implementation expects that you use a dictionary\
    \ that translates from prefixes to URLs. Python programs for an early version\
    \ of this article contained a rather long code block that manually created this\
    \ dictionary (Figure 6), because LibreOffice uses 38 different namespaces at once.\
    \ However, since all the information on namespaces is also stored in the root\
    \ element, it makes more sense to parse it and auto-generate the dictionary.\n\
    \n# THE INSPECTOR PROGRAM\n\n# LISTING 3: inspect.py\n\nThat leads to the code\
    \ of inspect.py, shown in Listing 3. This version of the code solves the initial\
    \ problem of changing every occurrence of \"Linux\" with \"Windows,\" and its\
    \ work is split into four steps:\n\n```\n```python\n01  #!/usr/bin/env python\n\
    02\n03  from zipfile import ZipFile, ZIP_DEFLATED\n04  from sys import stdout,\
    \ argv    # command line arguments\n05  from xml.etree import ElementTree as et\n\
    06  from re import findall\n07\n08  filename,outputfilename = argv[1],argv[2]\n\
    09\n10  # Step 1: Read /content.xml inside zip file      # open zip file\n11 \
    \ inZipf = ZipFile(filename, 'r')\n12  content = inZipf.open(\"content.xml\",'r').read()\
    \  # access /content.xml\n13\n14  # Step 2: Build the XML namespace dictionary\n\
    15  ns = {}                                            # {} = empty dictionary\n\
    16  for namespace in findall('xmlns:.*=\".*\"', content):\n17      namespace =\
    \ namespace.split(\".\")[1]          # get rid of \"xmlns:\"\n18      nsurl =\
    \ namespace.split(\"=\")[1]      # cut \" in front/back\n19      nsurl = nsurl[1:-1]\
    \                # add to dictionary AND\n20      ns[namespace] = nsurl      \
    \        # register for ElementTree module\n21      et.register_namespace(namespace,nsurl)\n\
    22\n23  # Step 3: Access the XML tree\n24  root = et.fromstring(content)\n25 \
    \ for x in root.findall(\"//\", ns):\n26      if x.text:                     \
    \          # any text inside?\n27          x.text = x.text.replace(\"Linux\",\"\
    Windows\")  # modify the content\n28\n29  # Step 4: Create output file\n30  with\
    \ ZipFile(outputfilename, \"w\") as outZip:  # open zip file for writing\n31 \
    \     outZip.comment = inZipf.comment          # copy archive comment\n32    \
    \  for file in inZipf.infolist():          # copy all files except/ /content.xml\n\
    33          if file.filename != \"content.xml\":\n34              outZip.writestr(file,\
    \ inZipf.read(file.filename))\n35      with ZipFile(filename, mode=\"a\", compression=ZIP_DEFLATED)\
    \ as outZip:\n36          outZip.writestr(\"content.xml\", et.tostring(root))\
    \  # add new content.xml\n37\n38  # Clean up\n39  inZipf.close()             \
    \                   # not really needed...\n```\n```\n\n+   1.  Read the contents\
    \ of content.xml into a string variable. You have already seen this done in Listing\
    \ 2.\n+   2.  Build the XML namespace dictionary. A dictionary is a variable that\
    \ can be used like an array, but with strings instead of numbers as index values.\
    \ So while an array [\"First entry\", \"Second entry\", \"Third entry\"] stores\
    \ the following mapping:\n\n```\n0 -> \"First entry\"\n1 -> \"Second entry\"\n\
    2 -> \"Third entry\"\n```\n\na dictionary {\"first\":\"one\", \"second\":\"two\"\
    } stores this mapping:"
