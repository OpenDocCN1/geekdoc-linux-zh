    2) and click **Insert** followed by **Close**. Alternatively, you can combine
    the last two steps by double-clicking the character. The associated symbol ends
    up in the **Commands** pane and their names after a percent sign. An uppercase
    letter is spelled out in capitals (e.g., %ALPHA, %BETA, %GAMMA); a lowercase character
    uses only lowercase letters (e.g., %psi, %phi, %theta). For a complete list of
    all Greek letters and markup equivalents, see the Math manual [1].


    As you can see, the Greek special characters appear in the **Commands** pane with
    their names after a percent sign.


    Each category displays a set of operations. If you click one of them, the **Command**
    area displays the corresponding operation, and the **Preview** pane shows the
    formula as it will appear in a document.


    For example, in the sidebar select **Unary/Binary Operations** and click the **Multiplication**
    (**Dot**) symbol. You will now see this text in the **Commands** pane:


    ```

    <>· cdot <>

    Two gray boxes with a dot appear in the **Preview** (Figure 1). When you replace
    the placeholders in the command area (<> ) with numbers or variables such as x
    and y, they appear in the **Preview** instead of the gray squares. The first placeholder
    in the **Commands** pane is already selected after you insert the new formula,
    and you can overwrite it by entering your character. Press F4 to go to the next
    placeholder and Shift+F4 to move back to the previous one. By default, Math updates
    the formula automatically, but you can deactivate the feature with **View** |
    **Auto-Update Display** and update everything manually by pressing F9.


    Clicking **View** | **Toolbars** | **Tools** adds to the toolbar icons that enlarge
    and reduce the view with a mouse click or fill the window optimally. The second
    symbol from the right is a formula cursor that helps you find a certain part of
    a formula in the document or in the **Commands** pane by highlighting a clicked
    area.

    ```


    # GOING GREEK


    Mathematical formulas often contain Greek letters, which you will find under **Tools**
    | **Symbols** or by clicking the rightmost omEGA symbol in the previously mentioned
    **Tools** toolbar. In the **Symbols** dialog you find a character (Figure 2) and
    click **Insert** followed by **Close**. Alternatively, you can combine the last
    two steps by double-clicking the character. The associated symbol ends up in the
    **Commands** pane with their names after a percent sign.


    An uppercase letter is spelled out in capitals (e.g., %ALPHA, %BETA, %GAMMA);
    a lowercase character uses only lowercase letters (e.g., %psi, %phi, %theta).
    For a complete list of all Greek letters and markup equivalents, see the Math
    manual [1].


    From the **Symbols** dialog, you can also change existing symbols or add new ones.


