  md: '![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_0.png)


    Figure 1: A new text document in LibreOffice Writer: Menubar (1), toolbar (2),
    styles (3), sidebar (4), status bar (5), view mode (6), and zoom level (7).


    document. Click and drag the arrow to expand it.


    +   5. Status bar: Shows the page count, word count, language being used (click
    for other languages), and whether the document has been modified.

    +   6. View mode: These icons let you change how the document is viewed (e.g.,
    as single pages, or side-by-side).

    +   7. Zoom level: Click and drag the slider (or use the plus and minus buttons)
    to zoom in and out of your document.


    # CUSTOMIZING THE INTERFACE


    I''m not going to explain what every single toolbar button does here; you can
    explore the buttons by simply mousing over them and then reading the tooltip.
    There are a couple of things to note, though: The undo and redo buttons have drop-down
    lists beside them, so you can choose how many actions to undo/redo in a single
    click (this is often a big time-saver). Similarly, the lists (bulleted and numbered)
    have different styles from which to choose, as well.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_1.png)


    Figure 2: Writer offer three different user interface layouts.


    Figure 1 shows the standard layout, with a menu, two toolbars, the sidebar, and
    a status bar at the bottom. However, the LibreOffice developers don''t think that
    end users should be forced to adopt any specific interface, so they''re packed
    in plenty of flexibility. For instance, go to View | Toolbars in the menu, and
    you can see that many extra toolbars can be enabled or disabled.


    Even better, go to View | User Interface, where you can choose three options (Figure
    2): Standard Toolbar (the default mode), Single Toolbar (useful if you don''t
    have much vertical space on your screen), and Sidebar (a good choice if you''re
    on a super-wide monitor and want to make better use of horizontal space). Try
    them all out to see which works best for your screen size and workflow.


    As mentioned earlier, you can click and grab the arrow handle next to the sidebar
    to resize it. When you have it open, try mousing over the icons on the right-hand
    side of the sidebar to show tooltips. The Properties panel in the Sidebar is context-specific;
    in other words, it changes depending on what you''re doing in a document (editing
    text, manipulating an image, working on a table, etc.). So if you want to perform
    a specific action or modification to an element in your document, but aren''t
    sure where to go, click the element and then open the Properties panel.


    Some additional customization options are available via Tools | Options (on Windows
    and Linux) or LibreOffice | Preferences on macOS. Open the LibreOffice Writer
    section on the left, and then explore the various options underneath.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_2.png)


    Figure 3: Adding static text and page numbers to headers and footers is easy.'
