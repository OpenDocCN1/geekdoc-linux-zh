    for editing by right-clicking and choosing Edit.


    To add a Search input area to the existing form, you need to open the Form Navigator
    (Figure 9). In the dialog that opens, right-click Forms and choose New | Form.
    A new form is then added next to MainForm.


    Open the properties of this form via its context menu. In the Data tab, choose
    Search in the Content drop-down. It is especially important to select Cycle |
    Active record. The remaining settings shown in Figure 10 ensure that the same
    data set, always, is edited and changed.


    Next, select one of the available form fields in MainForm and bring up its Properties
    dialog, and has set in Properties General | Action | Refresh form.


    After closing the new form''s Properties dialog, select MainForm. In the Data
    tab, select Content to type to Query and Content to g rySearchArticle. Next, Ctrl-clicked
    the Push Button icon in the sidebar. This button should appear in MainForm (check
    the Form Navigator). In the button''s Properties dialog in the General tab, choose
    Action | Refresh form. Now, with every click on this button, the form will be
    scanned again.


    In the Form Navigator, select the new form for the Search table again and create
    an input area by choosing the Text Box icon and using the mouse to draw a box.
    Set Data field to Search and Input required to No in the Data tab of the Properties
    dialog for this box. The contents of this text field will now be saved automatically
    when the button in MainForm is clicked (Figure 11).


    If you are happy with the form and do not want to make any design changes, you
    can save it now.


    # CONCLUSION


    At first, creating an internal Firebird database takes a lot more time than creating
    a table in Calc, but once the database is constructed, the data entry is a lot
    more accurate and fast than entering data in a spreadsheet. A further advantage
    is the possibility of generating reports.


    Base also lets you connect to external databases (e.g., MySQL/MariaDB, PostgreSQL,
    e-mail address books, etc.) beyond the Base internal databases. Base then merely
    accesses the tables and provides a graphical user interface.


    Because Base can access so many databases, a basic knowledge of SQL is always
    an advantage. Otherwise, access is limited very quickly to databases that comprise
    a single table and use only the built-in search functions of Base.


