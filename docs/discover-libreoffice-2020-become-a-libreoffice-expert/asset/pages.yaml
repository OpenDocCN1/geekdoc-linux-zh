  md: '# The community behind LibreOffice


    # Global Power


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_87_0.png)


    Who makes LibreOffice? How does everyone work together? And what are they working
    on? Here’s an update on what’s happening in the global LibreOffice community.
    *By Mike Saunders*


    LibreOffice is a worldwide project. Many of the software’s features are implemented
    by certified developers [1] who are working in the LibreOffice ecosystem – such
    as Collabora, CIB, and Red Hat. These companies use and make products based on
    LibreOffice and offer long-term support versions of the suite. But when they make
    improvements to LibreOffice, they also contribute their changes back to the community,
    thanks to the open source license.


    While much of the “grunt work” programming is done by these developers, there
    are also hundreds of people in the wider community who work on other aspects:
    localization (translating the user interface), design, marketing, documentation,
    handling bug reports, and much more. Everyone is welcome to get involved [2] with
    the community and help to improve LibreOffice – meeting new people and building
    skills along the way.


    So, what has the community been doing in the last couple of years to keep LibreOffice
    going from strength to strength? Read on to learn all about their work, and see
    how you can take part as well.


    # ALBANIA – LOCALIZATION SPRINT


    Tirana, Albania’s capital city, was the host of the LibreOffice Conference 2018.
    Since then, the local community has been active in the design, marketing and localization
    projects within LibreOffice. In November 2018, the community had a localization
    sprint, and one of the organizers, Sidorela Uku, described it as follows:


    > “This was the first event I organized for LibreOffice, in collaboration with
    a friend of mine, Marcela Korreshi (our new contributor). The presentation included
    an introduction to LibreOffice and how people can contribute to the project in
    various ways, while the second part was focused on translations. (*In addition,
    I talked about whatcanidoforlibreoffice.org.*) We had 14 people participating
    at the event, and as far as I can see from the translations, there are around
    460 strings translated to review – and around 200 strings translated and reviewed.”


    # BULGARIA – OPENFEST


    OpenFest 2019 took place in Sofia, Bulgaria, on November 2 and 3. Gabriele Ponzio
    from The Document Foundation’s


    Lead Image © Sergey Nivens, 123RF.com'
