  md: '# # GET PRODUCTIVE


    Open Document Format


    # **Open standards keep documents compatible across different applications and
    versions**


    # # Keep It Open


    The Open Document Format standard is an important reason for the success of LibreOffice.
    *By Italo Vignoli and Joe Casad*


    The Open Document Format (ODF) is the native format used for LibreOffice word
    processing files, spreadsheets, charts, and presentations. ODF is an open format
    developed as a standard for office applications. ODF was released by a Technical
    Committee (TC) at the Organization for the Advancement of Structured Information
    Standards (OASIS) consortium in 2005 and approved as an ISO/IEC International
    Standard in 2006 as ISO/IEC 26300:2006.


    At the time ODF was developed, the most popular format for office documents was
    the MS Office format set. At the time, the MS formats were closed and proprietary,
    yet these formats were so common that they became a pseudo-standard for saving,
    sharing, and transmitting document files. (See the box entitled “Standards and
    Pseudo-Standards.”) The widespread use of these proprietary file formats increased
    Microsoft’s power over the market, allowing them to dominate and eliminate competitors.


    Open Document Format evolved from the XML specification for the OpenOffice.org
    office suite, a forerunner to LibreOffice. The OpenOffice developers wanted a
    free and open office format that could compete with Microsoft’s file formats.
    Since then, ODF has become popular throughout the world as a free alternative
    for storing and transmitting document data. Legal issues, and competition from
    other tools, eventually caused Microsoft to bring more openness to their once-hidden
    formats. The Microsoft Office Open XML format (OOXML or MOX) is open enough to
    see and write programs with, but Microsoft continues to maintain some control
    over the standard.


    Open Document Format, on the other hand, is independent of LibreOffice or any
    other software project. The open standard process means that ODF is now supported
    by dozens of other office tools in addition to LibreOffice.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_49_0.png)


    # ### WHAT IS IT?


    A document format describes the structure for data saved in a document file. The
    data inside a modern office doc consists of much more than letters and numbers.
    The document must store information on fonts, character tags, paragraph tags,
    and pagination, as well as headers and footers, footnotes, tables of contents,
    and revision tracking. The format also records information on document encryption,
    digital signatures, and macros. In addition, the format must be resilient, because
    each file will be read and edited multiple times by different applications, including
