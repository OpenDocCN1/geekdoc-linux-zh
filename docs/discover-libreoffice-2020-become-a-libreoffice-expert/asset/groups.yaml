  - '[PAGE 5]


    # On the DVD


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_5_0.png)


    # LIBREOFFICE INSTALLATION FILES


    The DVD attached to this issue includes installation files for setting up the
    full version of LibreOffice on the following systems:


    +   - 64-bit Windows

    +   - 32-bit Windows

    +   - 64-bit macOS

    +   - 64-bit Linux for deb systems

    +   - 64-bit Linux for RPM systems


    Installation packages for the latest version are included in separate files/directories.
    Consult the documentation for your package manager or see “Introducing LibreOffice”
    on page 8 of this issue for more on installing LibreOffice.


    # LOTS MORE!


    As an extra bonus, this DVD also includes a collection of other valuable resources
    to help you extend and learn about LibreOffice. Look inside for:


    +   - **Handbooks** – the complete set of LibreOffice Handbooks with hundreds
    of pages of help and reference in PDF format

    +   - **Extensions** – the top 20 LibreOffice extensions available online, including
    several language dictionaries, spellcheckers, icon and gallery collections, and
    a barcode generator

    +   - **Templates** – 100 + ready-made presentation templates covering all kinds
    of presentation situations

    +   - **Clip Art** – an Openclipart library containing thousands of clip art graphics
    for any occasion

    +   - **Videos** – Take a video tour of new LibreOffice features, and learn about
    the LibreOffice project and personal success stories from top project leaders
    and volunteers


