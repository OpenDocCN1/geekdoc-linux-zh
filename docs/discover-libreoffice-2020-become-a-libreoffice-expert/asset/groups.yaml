    ## 轻松搞定文档格式

    ### 模型文档


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_55_0.png)


    LibreOffice 模板可以帮助你节省文档格式化的时间，从而让你专注于重要的内容。*作者：Bruce Byfield*


    **文档格式化非常耗时。即使你使用了样式，格式化仍然需要花费大量精力——而这些精力本可以用来开发内容。此外，如果有多个人正在处理一系列文档，你也不希望每个人都各自为政地进行格式化，导致结果必然不一致。解决这两个问题的方案是模板——一种用于存储结构和内容以便轻松重复使用的特殊文件。配合样式使用，设计良好的模板可以节省时间，并保持多年有用。**


    LibreOffice 对模板的处理方式与其他文档不同。首先，你可以通过扩展名的第二个字母来区分模板和其他 LibreOffice 文件，因为模板扩展名的第二个字母始终是
    *t*。例如，Writer 模板的扩展名是 *.ott* 而不是通常的 *.odt*，而 Impress 模板的扩展名是 *.otp* 而不是通常的 *.odp*。更重要的是，为了在
    LibreOffice 中工作，模板必须被注册为模板。模板还拥有自己独立的菜单和菜单项，与其他文件使用的菜单是分开的。这些独特的工具旨在防止过去在 Microsoft
    Word 中常见的文件损坏，并且为了追求稳定性，对如何与模板进行交互施加了限制，这些限制很难被规避。


    ## 模板是如何工作的


    与 Microsoft Word 不同，LibreOffice 不在其菜单的任何位置显示默认模板。这一省略消除了因过度编辑默认模板而导致文档损坏的可能性。


    不使用模板而改变 LibreOffice 默认格式的唯一方法是更改 *工具 | 选项 | LibreOffice Writer | 基本字体（西式）* 中的字体设置。诸如页面和列表样式等默认格式无法全局编辑，只能单独编辑。


    然而，你也可以设计一个包含更多格式信息的模板作为默认模板。当你选择 *文件 | 新建* 时，除非你明确选择另一个模板，否则其设置将用于每个文档。


    请注意，LibreOffice 文档中区分了默认模板（内置于 LibreOffice 的那个）和 Default 模板（你选择用于每个文档的那个）。默认模板可以是
    Default 模板，但当另一个模板成为 Default 时，它仍然存在。如果删除了 Default 模板，则会使用内置的默认模板。


    ## 规划和命名模板


    许多人以每个文档都是独一无二的理由而抵制使用模板。然而，这种说法更多是想象力的缺乏，而非其他什么。退一步说，几乎每个人都有设计偏好。例如，可能是喜欢的字体，或者也许是公司颜色。将这些偏好放入你的默认模板中，你就可以立即开始工作，而无需每次都设置格式。你的默认模板也可以成为其他文档的基础。如果你不确定还想创建哪些其他模板，考虑一下你不断创建的是哪种类型的文档，无论是备忘录、信函还是文章。为了唤起你的记忆，请查看
    *文件 | 最近文档*。检查你附在电子邮件中的文件。如果以上方法都无效，请记录你在几周内制作的文档。你现在付出的努力将在未来几年发挥作用，并为你节省无数小时。


    在创建你的模板库时，尽量让模板名称具有描述性。描述性的标题将使你的模板更容易找到。描述性的名称还可以防止将模板传输到另一台计算机时出现命名冲突。不要将模板标记为
    `article.ott`，而是叫它更具体的名字，例如 `Linux-Pro-Magazine.ott`。你会很高兴自己花时间进行了智能规划。


    ## 获取模板的方法


    获取模板最简单的方法是下载它们。在线有数百个 LibreOffice 模板可供下载 [1]，你肯定也能找到其他模板库。不过，下载的缺点是，浏览可用选项需要时间，而且各项之间的差异并不总是显而易见的。可能你也希望修改下载内容以符合自己的需求和偏好，因此下载可能没有你最初想的那么方便。


    在线存在数千个的 Microsoft Office 模板是另一个有用的来源。但是，在使用这些模板之前，请先测试它们在 LibreOffice 中的显示效果。你可能还需要检查任何下载模板的许可证。


    从技术角度来说，在 Microsoft Office 之外使用 Microsoft Office 提供的模板是非法的，这可能意味着你应避免将其用于专业用途。


    一个更便捷的资源可以通过 `文件 | 向导` 获取。由于它们的创建可以是交互式的，因此向导可以在设计过程中教你如何思考。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_56_0.png)


    图 1：即使你缺少详细信息，占位符和字段对于在模板中存储结构也非常有用。


    这个来源的缺点是，向导只提供有限的模板选择，而且许多模板比必要的更复杂，尽管它们完全可用。


    不过，迟早你可能需要为自己设计一个模板。无论是修改下载的模板还是从头创建一个，你都应该像创建任何文档一样去处理这项任务。


    除了格式之外，你可能还希望包含一些内容。模板开头的一段简短说明可以解释如何使用该模板。可能还需要包含样板内容——那些在文档之间不变的内容，例如传记或公司背景。


    如果你知道模板中特定位置所需的信息类型，但不知道具体细节，可以通过 `插入 | 字段 | 更多字段... | 函数 | 占位符` 添加占位符。其他字段，如文档信息或存储在
    `工具 | 选项 | LibreOffice | 用户数据` 中的通用用户信息，也可以像其他文档一样添加到模板中（图 1）。这些字段中的一些，如日期和时间，可以是固定的（插入字段时插入的时间），也可以是可变的（显示打开文档时的时间）。与普通文档的区别只在你保存结果时才开始显现。


    ## 注册模板


    一旦普通文件保存，它就准备好使用了。相比之下，无论模板是如何创建的，在使用之前都必须向 LibreOffice 注册，就像地址簿或数据库等数据源一样。


    当然，你可以从普通文件对话框保存模板。但是，要使模板在你的系统上可用，你必须使用 `文件 | 模板 | 另存为模板` 首次保存它（图 2）。当对话框打开时，输入名称并选择一个类别来归档该模板。这些类别对应于模板管理器中的显示过滤器（见下文）。你还有选项将模板设置为默认模板，即除非被覆盖，否则在打开
    LibreOffice 文件时自动使用的模板。如果你选择不分配类别，该模板将显示在模板管理器的顶层。


    注册必须从编辑窗口一次完成一个模板。如果你下载了大量模板，你可以使用文件管理器将它们拖放到 `工具 | 选项` 中路径部分列出的目录之一中，或者使用模板管理器中的导入工具来注册它们。


    ## 使用模板


    要管理模板，或基于模板启动新文档，请选择 `文件 | 新建 | 模板`。你也可以通过 `文件 | 模板 | 打开模板... | 管理模板` 来管理模板。在这两种情况下，都会打开模板管理器窗口（图
    3）。模板管理器提供了所有模板在模板


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_56_1.png)


    图 2：在使用模板之前，必须在专用对话框中保存它们。


