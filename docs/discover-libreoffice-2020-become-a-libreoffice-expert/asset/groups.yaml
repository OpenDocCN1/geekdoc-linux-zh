    59 PortionEnum=Para.createEnumeration()

    60 While PortionEnum.hasMoreElements

    61 Portion=PortionEnum.nextElement

    62 If Portion.HyperlinkURL <> "" then

    63 Portion.String = "[" + Portion.String +

    64 " (" + Portion.HyperlinkURL + ")"

    65 End If

    66 Wend

    67 End Sub

    ```'
  md: "\n## GET PRODUCTIVE\n\n### LibreOffice Macros\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_60_0.png)\n\
    \nOnce you have the script on your machine, you can make it executable with:\n\
    \n```bash\nchmod +x aws\n```\n\nbefore moving it to the /usr/bin directory.\n\n\
    The next step is to create a new text file and enter your Access Key ID on the\
    \ first line and the Secret Access Key on the second line. Now save the file as\
    \ .awssecret in your home directory and use the aws s3dir command to create a\
    \ new bucket for use with LibreOffice:\n\n```bash\naws s3dir lookup\n```\n\nAt\
    \ this point, you can start working on the backup macro. The macro first obtains\
    \ the currently active document and checks to see whether it has already been\
    \ saved. The latter is required to retrieve the path to the document:\n\n```basic\n\
    ThisDoc := ThisComponent\nIf ThisDoc.IsModified = False Then\n    MsgBox (\"Save\
    \ the document first!\", 16, \"Attention!\")\n    End Sub\nEnd If\n```\n\nNext,\
    \ the macro saves all unsaved changes in the document:\n\n```basic\nThisDoc =\
    \ ThisComponent\nIf ThisDoc.IsModified Then\n    ThisDoc.StoreAsURL(ThisDoc.URL,\
    \ Args)\nEnd If\n```\n\nTo construct a command that uploads the currently opened\
    \ document, the macro needs to obtain two things: the document's path and name:\n\
    \n```basic\nDocPath := ConvertFromURL(ThisDoc.getURL())\nFileName := Dir(ThisDoc.getURL(),\
    \ 0)\n```\n\nIf you want the macro to open a certain URL in the default browser,\
    \ you can feed the URL to the shell command in a third parameter:\n\n```basic\n\
    Sub Main\nShell (\"xdg-open\", 1, \"http://en.wikipedia.org/\")\nEnd Sub\n```\n\
    \nWith a few simple tweaks, you can turn the code above into a lookup macro (Listing\
    \ 1). First, you need to add code that obtains the currently selected word (lines\
    \ 2–3) and then modify the Shell command so it points to Wikipedia's query URL\
    \ followed by the selected word (line 4).\n\nTo assign a keyboard shortcut to\
    \ the created macro, choose Tools | Macros | Organize Macros | LibreOffice Basic.\
    \ In the dialog that opens, click the Assign button. A new Customize dialog will\
    \ pop up (Figure 2).\n\nClick the Keyboard tab and choose a shortcut with an empty\
    \ slot from the Shortcut Keys section. To find the Lookup function you just wrote,\
    \ look under LibreOffice Macros in the Category pane at the bottom of the dialog,\
    \ and then highlight the macro in the Function pane and click the Modify button\
    \ to assign it.\n\nIn the example shown in Figure 2, I assigned Lookup to the\
    \ Shift + F10 shortcut. Now, every time I press Shift + F10, I can look up the\
    \ word under the cursor in the currently opened LibreOffice document.\n\n## BACK\
    \ UP\n\nAmazon S3 [2] offers unlimited storage at unbeatable prices, so it's a\
    \ perfect service for off-site backup. With the use of a little bit of LibreOffice\
    \ Basic magic and the aws Perl script, you can seamlessly back up the currently\
    \ opened document to Amazon S3. Before you start, you must sign up for Amazon\
    \ S3 and download the latest version of the aws script from the project's GitHub\
    \ repository [3].\n\n**Listing 1: Word Lookup Macro**\n\n```basic\n01 Sub Lookup()\n\
    02     ThisDoc := ThisComponent\n03     LookupWord := ThisDoc.CurrentController.getViewCursor()\n\
    04     Shell (\"xdg-open\", 1, \"http://en.wikipedia.org/wiki/\" & LookupWord.String)\n\
    05 End Sub\n```\n\nFigure 2: Assigning macros to keyboard shortcuts lets you run\
    \ them whenever you want.\n\n**Listing 2: Amazon S3 Backup Macro**\n\n```basic\n\
    01 Sub AmazonS3Backup()\n02     Dim Args() As New com.sun.star.beans.PropertyValue\n\
    03     ThisDoc = ThisComponent\n04     If ThisDoc.hasLocation = False Then\n05\
    \         MsgBox (\"You have to save the document first!\", 16, \"Attention!\"\
    )\n06         End Sub\n07     End If\n08     ThisDocURL = ThisDoc.getURL()\n09\
    \     If ThisDoc.IsModified Then\n10         ThisDoc.storeAsURL(ThisDocURL, Args)\n\
    11     End If\n12     DocPath = ConvertFromURL(ThisDoc.getURL())\n13     FileName\
    \ = Dir(ThisDoc.getURL(), 0)\n14     PutCommand = \"s3backup/\" & FileName & \"\
    \ \" & DocPath\n15     Shell(\"aws put \", 1, PutCommand)\n16 End Sub\n```\n\n\
    To upload a file to Amazon S3, you can use the `aws put` command, which has the\
    \ format:\n\n```bash\naws put BUCKET_NAME/foo.txt /path/to/foo.txt\n```\n\nTo\
    \ construct the command that uploads the current LibreOffice document, the macro\
    \ simply inserts the obtained DocPath value in a string, which is then passed\
    \ to the shell routine:\n\n```basic\nPutCommand = \"s3backup/\" & FileName & \"\
    \ \" & DocPath\nShell(\"aws put \", 1, PutCommand)\n```\n\nThat's all there is\
    \ to it. You can see the entire macro in all its beauty in Listing 2.\n\nAlthough\
    \ the backup macro does the job, a few features can still be improved. For example,\
    \ the name of the bucket is specified directly in the macro, which makes it less\
    \ flexible. If you plan to use different buckets for different types of LibreOffice\
    \ documents, you might want to tweak the macro so it uses the InputBox() routine\
    \ to display an input box where you enter the name of the target bucket.\n\n```basic\n\
    BucketName = InputBox(\"Enter bucket name\", \"Bucket name\")\nPutCommand = BucketName\
    \ & \"/\" & Timestamp & \"/\" & FileName & \" \" & DocPath\n```\n\n**Listing 3:\
    \ Timestamping a File Name**\n\n```basic\n01 Timestamp = Format(Year(Now), \"\
    0000\") & _\n02     Format(Month(Now), \"00\") & _\n03     Format(Day(Now), \"\
    00\") & \"-\" & _\n04     Format(Hour(Time), \"00\") & _\n05     Format(Minute(Time),\
    \ \"00\") & _\n06     Format(Second(Time), \"00\")\n07 BucketName = InputBox(\"\
    Enter bucket name\", \"Bucket name\")\n08 PutCommand = BucketName & \"/\" & Timestamp\
    \ & \"/\" & FileName & \" \" & DocPath\n```\n\nIf you want to keep multiple backup\
    \ copies of the current document, you can modify the macro so it attaches a timestamp\
    \ to the file name (Listing 3). The code generates a timestamp in the yyyyMMdd-HHMMSS\
    \ format and prefixes it to the file name.\n\n## SHORTENING URLS\n\nWorking with\
    \ long URLs in Writer documents can be a real nuisance. One way to fix this problem\
    \ is to use shortened URLs. However, instead of manually converting long URLs\
    \ with their short equivalents, you can write a macro that does this donkey job\
    \ for us (Listing 4).\n\n**Listing 4: Shortening a URL**\n\n```basic\n01 Sub ShortenSelectedURL()\n\
    02     ThisDoc = ThisComponent\n03     ThisText = ThisDoc.Text\n04     SelectedURL\
    \ = ThisDoc.CurrentController.getViewCursor()\n05     LongURL = SelectedURL.String\n\
    06     If LongURL = \"\" Then\n07         MsgBox (\"Select URL first.\", 16, \"\
    Error!\")\n08         End Sub\n09     End If\n10     FileName = FreeFile\n11 \
    \    Open \"http://is.gd/gpi.php?longurl=\" & LongURL For Input As #FileName\n\
    12     While Not EOF(FileName)\n13         Line Input #FileName, SingleLine\n\
    14         If SingleLine <> \"\" Then\n15             StringBuffer = SingleLine\n\
    16         End If\n17     Wend\n18     Close FileName\n19     ShortURL = StringBuffer\n\
    20     ThisText.insertString(SelectedURL, ShortURL, True)\n21 End Sub\n```\n\n\
    To perform the URL-shortening operation, the macro relies on the is.gd service,\
    \ which offers a simple HTTP-based API for converting links. The macro first grabs\
    \ the currently selected text fragment containing a long URL and turns it into\
    \ a string. A simple conditional statement then checks whether a selection has\
    \ been made, and it displays an error message and aborts if the selection is empty.\n\
    \nTo obtain the shortened URL, returned by the `is.gd` API call, the macro uses\
    \ a simple trick: It opens a file for input and feeds the obtained result into\
    \ it. The macro then reads the first line in the file and assigns its value to\
    \ the `StringBuffer` variable, which is then assigned to the `ShortURL` variable\
    \ (lines 9–18). Finally, the macro replaces the selected long link with the shortened\
    \ URL that it obtained.\n\n## MARKDOWN FORMATTING\n\nMarkdown is a lightweight\
    \ format popular with developers and users alike, and it is supported by several\
    \ Linux text editors. However, what if you use LibreOffice Writer as your preferred\
    \ writing tool? Although the document processor doesn't support the Markdown format,\
    \ you can easily create a LibreOffice Basic macro that converts Writer documents\
    \ to Markdown-formatted text files.\n\nThe macro in Listing 5 can handle headings,\
    \ bold, italics, and URLs. To perform the formatting operation, the macro relies\
    \ on three functions: The `MarkupHeadingsFunc` function processes headings in\
    \ the currently opened document, `MarkupTextFunc` searches by text attributes\
    \ (i.e., *bold* and *italics*) and performs replacements, and `MarkupURLFunc`\
    \ finds and formats hyperlinks in the document.\n\nThe macro itself can be roughly\
    \ divided into two parts. The first part processes the text body of the document\
    \ and applies Markdown tags to headings, formatted text, and URLs. The second\
    \ part obtains the file name and path of the currently processed document and\
    \ saves it as plain text with the `.md` file extension.\n\nThanks to its modular\
    \ structure, you can easily adapt the macro for use with other markup formats:\
    \ All you have to do is replace the start and end tags in the main part of the\
    \ macro and adjust the `MarkupURLFunc` function (lines 53–67). For example, if\
    \ you want the macro to apply HTML formatting, the relevant parts (lines 4-8,\
    \ 63) of the macro and the function should look like the code in Listing 6.\n\n\
    **Listing 5: Markdown Formatting Macro**\n\n```basic\n01 Sub Markdown()\n02  \
    \   Dim Args(0) As New com.sun.star.beans.PropertyValue\n03     ThisDoc = ThisComponent\n\
    04     MarkupHeadingsFunc(\"Heading 1\", \"#\", \"\")\n05     MarkupHeadingsFunc(\"\
    Heading 2\", \"##\", \"\")\n06     MarkupHeadingsFunc(\"Heading 3\", \"###\",\
    \ \"\")\n07     MarkupTextFunc(\"CharWeight\", com.sun.star.awt.FontWeight.BOLD,\
    \ \"**&**\")\n08     MarkupTextFunc(\"CharPosture\", com.sun.star.awt.FontSlant.ITALIC,\
    \ \"*&*#\")\n09     MarkupURLFunc\n10     If (Not GlobalScope.BasicLibraries.IsLibraryLoaded(\"\
    Tools\")) Then\n11         GlobalScope.BasicLibraries.LoadLibrary(\"Tools\")\n\
    12     End If\n13     DocURL = Dir.getDocumentURL()\n14     DocDir = DirectoryManager.getNameOfPath(DocURL,\
    \ \"/\")\n15     FileName = Left(Dir/DocURL, 0), Len(Dir/DocURL, 0))-4\n16   \
    \  Args(0).Name = \"FileName\"\n17     Args(0).Value = \"Text\"\n18     TextFilePath\
    \ = ConvertToURL(DocDir & \"/\" & FileName & \".md\")\n19     ThisDoc.StoreToURL(TextFilePath,\
    \ Args())\n20 End Sub\n21\n22 Function MarkupHeadingsFunc(StyleName, StartTag,\
    \ EndTag)\n23     ThisDoc = ThisComponent\n24     ThisText = ThisDoc.Text\n25\
    \     ParaEnum = ThisText.createEnumeration()\n26     While ParaEnum.hasMoreElements\n\
    27         Para = ParaEnum.nextElement\n28         PortionEnum = Para.createEnumeration()\n\
    29         While PortionEnum.hasMoreElements\n30             Portion = PortionEnum.nextElement\n\
    31             If Portion.paraStyleName = StyleName then\n32                 Portion.String\
    \ = StartTag + Portion.String + EndTag\n33             End if\n34         Wend\n\
    35     Wend\n36 End Function\n37\n38 Function MarkupTextFunc(SearchAttrName, SearchAttrValue,\
    \ ReplaceStr)\n39     Dim SearchAttributes()\n40     As New com.sun.star.beans.PropertyValue\n\
    41     ThisDoc = ThisComponent\n42     SearchAttributes(0).Name = SearchAttrName\n\
    43     ReplaceObj = ThisDoc.createSearchDescriptor()\n44     ReplaceObj.SearchRegularExpression\
    \ = true\n45     ReplaceObj.searchAll = false\n46     ReplaceObj.SearchAll = true\n\
    47     ReplaceObj.SetSearchAttributes(SearchAttributes)\n48     ReplaceObj.SearchString\
    \ = \"*\"\n49     ReplaceObj.ReplaceString = ReplaceStr\n50     ThisDoc.replaceAll(ReplaceObj)\n\
    51 End Function\n52\n53 Sub MarkupURLFunc\n54     ThisDoc = ThisComponent\n55\
    \     ThisText = ThisDoc.Text\n56     ParaEnum = ThisText.createEnumeration()\n\
    57     While ParaEnum.hasMoreElements\n58         Para = ParaEnum.nextElement\n\
    59         PortionEnum = Para.createEnumeration()\n60         While PortionEnum.hasMoreElements\n\
    61             Portion = PortionEnum.nextElement\n62             If Portion.HyperlinkURL\
    \ <> \"\" then\n63                 Portion.String = \"[\" + Portion.String + \"\
    \ (\" + Portion.HyperlinkURL + \")\"\n64             End If\n65         Wend\n\
    66     Wend\n67 End Sub\n```\n"
  mdcn: "\n\n## 提高工作效率\n\n### LibreOffice 宏\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_60_0.png)\n\
    \n一旦你将脚本放在你的机器上，你可以通过以下方式使其可执行：\n\n```bash\nchmod +x aws\n```\n\n然后再将其移动到 /usr/bin\
    \ 目录。\n\n下一步是创建一个新的文本文件，在第一行输入你的 Access Key ID，在第二行输入 Secret Access Key。现在将文件保存为主目录下的\
    \ .awssecret，并使用 aws s3dir 命令创建一个用于 LibreOffice 的新存储桶：\n\n```bash\naws s3dir lookup\n\
    ```\n\n此时，你可以开始处理备份宏了。该宏首先获取当前活动文档，并检查其是否已保存。后者是为了获取文档的路径：\n\n```basic\nThisDoc\
    \ := ThisComponent\nIf ThisDoc.IsModified = False Then\n    MsgBox (\"Save the\
    \ document first!\", 16, \"Attention!\")\n    End Sub\nEnd If\n```\n\n接下来，该宏保存文档中所有未保存的更改：\n\
    \n```basic\nThisDoc = ThisComponent\nIf ThisDoc.IsModified Then\n    ThisDoc.StoreAsURL(ThisDoc.URL,\
    \ Args)\nEnd If\n```\n\n为了构建上传当前打开文档的命令，宏需要获取两样东西：文档的路径和名称：\n\n```basic\nDocPath\
    \ := ConvertFromURL(ThisDoc.getURL())\nFileName := Dir(ThisDoc.getURL(), 0)\n\
    ```\n\n如果你想让宏在默认浏览器中打开某个 URL，你可以通过第三个参数将 URL 传递给 shell 命令：\n\n```basic\nSub Main\n\
    Shell (\"xdg-open\", 1, \"http://en.wikipedia.org/\")\nEnd Sub\n```\n\n只需稍作调整，你就可以将上述代码变成一个查找宏（列表\
    \ 1）。首先，你需要添加获取当前选中单词的代码（第 2–3 行），然后修改 Shell 命令，使其指向维基百科的查询 URL，后接选中的单词（第 4 行）。\n\
    \n要为创建的宏分配键盘快捷键，请选择“工具” | “宏” | “组织宏” | “LibreOffice Basic”。在弹出的对话框中，点击“分配”按钮。此时会弹出一个新的自定义对话框（图\
    \ 2）。\n\n点击“键盘”标签页，并从“快捷键”部分选择一个空位。要找到你刚写的查找功能，请在对话框底部的类别窗格中查找“LibreOffice 宏”，然后突出显示功能窗格中的宏，点击“修改”按钮以进行分配。\n\
    \n在图 2 所示的示例中，我将 Lookup 分配给 Shift + F10 快捷键。现在，每次我按下 Shift + F10，就可以在当前打开的 LibreOffice\
    \ 文档中查找光标下的单词。\n\n## 备份\n\nAmazon S3 [2] 提供按无可匹敌的价格计费的非限制存储，因此它是异地备份的完美服务。通过一点\
    \ LibreOffice Basic 魔术和 aws Perl 脚本，你可以无缝地将当前打开的文档备份到 Amazon S3。开始之前，你必须注册 Amazon\
    \ S3 并从项目的 GitHub 存储库 [3] 下载最新版本的 aws 脚本。\n\n**列表 1: 单词查找宏**\n\n```basic\n01 Sub\
    \ Lookup()\n02     ThisDoc := ThisComponent\n03     LookupWord := ThisDoc.CurrentController.getViewCursor()\n\
    04     Shell (\"xdg-open\", 1, \"http://en.wikipedia.org/wiki/\" & LookupWord.String)\n\
    05 End Sub\n```\n\n图 2: 将宏分配给键盘快捷键可以让你随时运行它们。\n\n**列表 2: Amazon S3 备份宏**\n\n```basic\n\
    01 Sub AmazonS3Backup()\n02     Dim Args() As New com.sun.star.beans.PropertyValue\n\
    03     ThisDoc = ThisComponent\n04     If ThisDoc.hasLocation = False Then\n05\
    \         MsgBox (\"You have to save the document first!\", 16, \"Attention!\"\
    )\n06         End Sub\n07     End If\n08     ThisDocURL = ThisDoc.getURL()\n09\
    \     If ThisDoc.IsModified Then\n10         ThisDoc.storeAsURL(ThisDocURL, Args)\n\
    11     End If\n12     DocPath = ConvertFromURL(ThisDoc.getURL())\n13     FileName\
    \ = Dir(ThisDoc.getURL(), 0)\n14     PutCommand = \"s3backup/\" & FileName & \"\
    \ \" & DocPath\n15     Shell(\"aws put \", 1, PutCommand)\n16 End Sub\n```\n\n\
    要将文件上传到 Amazon S3，你可以使用 `aws put` 命令，其格式为：\n\n```bash\naws put BUCKET_NAME/foo.txt\
    \ /path/to/foo.txt\n```\n\n为了构建上传当前 LibreOffice 文档的命令，宏只需将获取的 DocPath 值插入字符串中，然后将其传递给\
    \ shell 例程：\n\n```basic\nPutCommand = \"s3backup/\" & FileName & \" \" & DocPath\n\
    Shell(\"aws put \", 1, PutCommand)\n```\n\n这就是一切。你可以从列表 2 中看到完整宏的美貌。\n\n尽管备份宏完成了任务，但仍有几个功能可以改进。例如，存储桶的名称直接在宏中指定，这使其灵活性降低。如果你计划为不同类型的\
    \ LibreOffice 文档使用不同的存储桶，你可能希望调整宏，使其使用 InputBox() 例程显示一个输入框，在其中输入目标存储桶的名称。\n\n\
    ```basic\nBucketName = InputBox(\"Enter bucket name\", \"Bucket name\")\nPutCommand\
    \ = BucketName & \"/\" & Timestamp & \"/\" & FileName & \" \" & DocPath\n```\n\
    \n**列表 3: 给文件名添加时间戳**\n\n```basic\n01 Timestamp = Format(Year(Now), \"0000\")\
    \ & _\n02     Format(Month(Now), \"00\") & _\n03     Format(Day(Now), \"00\")\
    \ & \"-\" & _\n04     Format(Hour(Time), \"00\") & _\n05     Format(Minute(Time),\
    \ \"00\") & _\n06     Format(Second(Time), \"00\")\n07 BucketName = InputBox(\"\
    Enter bucket name\", \"Bucket name\")\n08 PutCommand = BucketName & \"/\" & Timestamp\
    \ & \"/\" & FileName & \" \" & DocPath\n```\n\n如果你想保留当前文档的多个备份副本，你可以修改宏，使其将时间戳附加到文件名（列表\
    \ 3）。该代码生成 yyyyMMdd-HHMMSS 格式的时间戳，并将其作为前缀添加到文件名中。\n\n## 缩短 URL\n\n在 Writer 文档中处理长\
    \ URL 真的非常令人烦恼。解决此问题的一种方法是使用缩短的 URL。然而，与其手动将长 URL 转换为其对应的短 URL，不如编写一个宏为我们做这个笨重的任务（列表\
    \ 4）。\n\n**列表 4: 缩短 URL**\n\n```basic\n01 Sub ShortenSelectedURL()\n02     ThisDoc\
    \ = ThisComponent\n03     ThisText = ThisDoc.Text\n04     SelectedURL = ThisDoc.CurrentController.getViewCursor()\n\
    05     LongURL = SelectedURL.String\n06     If LongURL = \"\" Then\n07       \
    \  MsgBox (\"Select URL first.\", 16, \"Error!\")\n08         End Sub\n09    \
    \ End If\n10     FileName = FreeFile\n11     Open \"http://is.gd/gpi.php?longurl=\"\
    \ & LongURL For Input As #FileName\n12     While Not EOF(FileName)\n13       \
    \  Line Input #FileName, SingleLine\n14         If SingleLine <> \"\" Then\n15\
    \             StringBuffer = SingleLine\n16         End If\n17     Wend\n18  \
    \   Close FileName\n19     ShortURL = StringBuffer\n20     ThisText.insertString(SelectedURL,\
    \ ShortURL, True)\n21 End Sub\n```\n\n为了执行 URL 缩短操作，宏依赖于 is.gd 服务，该服务提供一个简单的基于\
    \ HTTP 的 API 用于转换链接。宏首先获取包含长 URL 的当前选中文本片段并将其转换为字符串。一个简单的条件语句随后检查是否已进行选择，如果选择为空，则显示错误消息并中止。\n\
    \n为了获取由 `is.gd` API 调用返回的缩短 URL，宏使用了一个简单的技巧：它打开一个文件用于输入并将获取的结果传递给它。宏然后读取文件中的第一行，并将其值分配给\
    \ `StringBuffer` 变量，该变量随后被分配给 `ShortURL` 变量（第 9–18 行）。最后，宏将选中的长链接替换为获取的缩短 URL。\n\
    \n## MARKDOWN 格式\n\nMarkdown 是一种受到开发者和用户共同欢迎的轻量级格式，并受到多个 Linux 文本编辑器的支持。但是，如果你首选使用\
    \ LibreOffice Writer 作为写作工具呢？尽管文档处理程序不支持 Markdown 格式，但你可以轻松创建一个 LibreOffice Basic\
    \ 宏，将 Writer 文档转换为 Markdown 格式的文本文件。\n\n列表 5 中的宏可以处理标题、粗体、斜体和 URL。为了执行格式操作，宏依赖于三个函数：`MarkupHeadingsFunc`\
    \ 函数处理当前打开文档中的标题，`MarkupTextFunc` 通过文本属性（即 *粗体* 和 *斜体*）进行搜索并执行替换，`MarkupURLFunc`\
    \ 查找并格式化文档中的超链接。\n\n宏本身可以大致分为两部分。第一部分处理文档的正文，并为标题、格式化文本和 URL 应用 Markdown 标签。第二部分获取当前处理文档的文件名和路径，并将其保存为具有\
    \ `.md` 文件扩展名的纯文本。\n\n得益于其模块化结构，你可以轻松调整宏以用于其他标记格式：你所要做的只是替换宏主要部分中的开始和结束标签，并调整\
    \ `MarkupURLFunc` 函数（第 53–67 行）。例如，如果你想让宏应用 HTML 格式，宏的相关部分（第 4-8 行、63 行）和函数应该看起来像列表\
    \ 6 中的代码。\n\n**列表 5: Markdown 格式化宏**\n\n```basic\n01 Sub Markdown()\n02     Dim\
    \ Args(0) As New com.sun.star.beans.PropertyValue\n03     ThisDoc = ThisComponent\n\
    04     MarkupHeadingsFunc(\"Heading 1\", \"#\", \"\")\n05     MarkupHeadingsFunc(\"\
