    # 入门指南


    # LibreOffice Calc


    ## 条件格式

    如果标准格式无法提供足够的视觉提示，您可以从“格式 | 条件格式”中添加其他提示。条件格式可以让用户一眼识别出总体数据趋势，但不会显示具体数据。例如，您可以使用表情符号，从笑脸到中性脸再到皱眉，来指示单元格内容。或者，可以使用颜色代码来表示数据（图
    7）。


    ### 表 1：选定的格式化工具


    | 工具 | 描述 |

    | :--- | :--- |

    | 右键点击 \| 隐藏列/隐藏行 | 简化显示内容，并减少打印的信息量。请注意，隐藏并不会保护信息。例如，如果您有一个以欧元和美元列出的收入列表，并隐藏了列出欧元收入的列，查看者可能会推断出有一列未显示，因为美元列中的一些条目将是空白的。
    |

    | 数据 \| 组合及大纲 \| 组合 | 在列和行标头中创建一组树状控件，用于展开或折叠显示。如果需要，您可以在组内嵌套其他组。 |

    | 数据 \| 筛选 | 更改列中显示哪些单元格。标准筛选或高级筛选为显示单元格设置条件，高级筛选提供更多选项。然而，对于日常使用来说，最便捷的筛选通常是自动筛选（图
    5）。与标准或高级筛选不同，自动筛选始终显示在工作表上，并且可以包含空白单元格。此外，如有必要，您可以通过自动筛选的右键菜单创建其他类型的筛选。要使用自动筛选，您需要在要筛选的单元格范围的顶部有一个空白单元格。如果将鼠标置于该单元格中，选择“自动筛选”会添加一个下拉列表控件，其中包含筛选选项
    – 这是一种明显的便利。作为导航辅助，请使用单元格控件对单元格范围进行标记。 |

    | 数据 \| 有效性 | 如果多人使用同一个电子表格，或者一个人长期使用它，则非常有用。有效性定义了可以在选定单元格中输入的内容类型和格式，并显示自定义帮助消息，包括无效内容的定义以及如何更正这些内容（图
    6）。 |


    ### 表 2：选定的函数工具


    | 工具 | 描述 |

    | :--- | :--- |

    | 数据 \| 汇总 | 允许您对由标头标记的数据范围（也称为数据数组）执行若干统计函数。您还可以选择汇总在工作表上的显示位置 – 但请确保左侧有空间放置标头。您可能需要添加一列来腾出空间。汇总可以同时处理多达三个数据数组。
    |

    | 工具 \| 侦查 | 用于帮助追踪公式所用数据的一系列实用程序子菜单（图 8）。例如，如果您选择一个包含公式的单元格，“追踪前驱”会绘制线条（轨迹）指向包含公式所用数据的单元格。双击一条线，您将被带到轨迹末端的单元格。相反，“追踪后续”会从当前单元格绘制线条到包含引用当前单元格的公式的单元格。您还可以使用“追踪错误”或“标记无效数据”。完成后，“删除轨迹”将删除这些线条。
    |

    | 工具 \| 单变量求解 | 为函数的变量创建多个值。这些值可以通过下拉列表更改。 |

    | 数据 \| 多重运算 | 为变量创建数据范围，然后使用该变量运行公式。您可以为多个变量输入数据范围，甚至可以输入多个公式。 |

    | 工具 \| 规划求解 | 提供一个对话框，用于一次性为多个单元格输入数值范围。它的运作方式很像单变量求解和多重运算，但允许您同时处理更多的单元格和变量。
    |

    | 数据 \| 数据透视表 \| 插入 | 重新排列数据数组中的数据以呈现新信息。例如，在图 9 中，数据数组显示了按国籍、性别和年龄划分的游客支出。通过使用并遵循在线帮助，您可以重新排列数据以创建图
    10，该图展示了按性别划分的游客消费。根据此表，自认为女性的游客在度假期间花费最多，这一点从图 9 中并不直观。数据透视表在数据更改时不会自动刷新。相反，您必须点击“数据
    \| 数据透视表 \| 刷新”来更新它们。 |


    目前，LibreOffice 尚不支持迷你图，这是条件格式的原始形式 – 一个带有主要数据点标记的小型折线图。但是，您可以使用图表子系统创建一个图表，然后将其缩小，使其适合一个单元格或多个合并单元格。您也可以使用条形图。


