    - [3] LibreOffice 与 MS Office 功能对比: <https://wiki.documentfoundation.org/Feature_Comparison_-MSOffice_LibreOffice>

    - [4] OpenDocument 格式: <http://opendocumentformat.org>

    - [5] 下载 LibreOffice: <https://www.libreoffice.org/download/>

    - [6] 下载 Java: <https://www.java.com/en/download/>

    - [7] 在 Windows 上安装 LibreOffice: <https://www.libreoffice.org/get-help/install-howto/windows/>

    - [8] LibreOffice 问题解答: <https://ask.libreoffice.org>

