    # GET PRODUCTIVE


    LibreOffice Extensions


    # Extending the functionality of LibreOffice


    # Customizing LibreOffice


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_52_0.png)


    **You can extend the power of LibreOffice with over 350 useful extensions.** *By
    Bruce Byfield*


    **E**xtensions are unofficial add-ons to the basic LibreOffice office suite. Some
    make extra resources available, such as images for the Gallery or directories
    for different languages. Others offer alternative dialog windows with additional
    features or different layouts, such as an alternative spellchecker or grammar
    checker. A few even offer new features that will eventually become part of the
    standard installation. Just as with Mozilla Firefox or Gimp, extensions are a
    major reason for LibreOffice’s popularity. Today, over 350 extensions exist.


    Some extensions are a collection of resources, such as replacement icons. Others
    are macros written in LibreOffice’s Basic scripting language or in standard programming
    languages such as Java – and, increasingly these days, Python. This versatility
    means that developers can begin to contribute to LibreOffice without familiarizing
    themselves with the codebase. A finished extension is a standalone piece of code
    that is plugged into the basic code when it is installed.


    # FINDING EXTENSIONS


    LibreOffice maintains a separate website for both templates and extensions [1].
    Developers can create an account on the site for uploading their work, while users
    can use the site to scan for extensions and to see brief descriptions, licensing
    information, and screenshots of extensions. With over 350 extensions – plus many
    updates – finding an extension may take a while, but along the right pane of every
    page are links for viewing the most recent extensions, as well as for browsing
    by categories.


    # INSTALLING EXTENSIONS


    All LibreOffice extensions’ file names end with .OXT. Regardless of whether they
    are resources or programs, the procedure for installing them is the same:


    +   1. Download the extension to your system.

    +   2. Click on *Tools* | *Extension Manager* | *Add* and navigate to the download
    (Figure 1).

    +   3. Select the extension and click *Open*. If the extension is already on your
    system, you are asked whether you want to overwrite it. Click OK to continue.

    +   4. A confirmation dialog asks whether you want to install the extension for
    all users on the system, or only for yourself. To install for all users, you must
    be able to log in as root. Choose one of these two options.

    +   5. You may be asked to accept the license. Read and scroll down to the end
    of the license and click to accept it.

    +   6. Click the *Options* button in the Extension Manager and customize the extension.
    Not all extensions will have options.

    +   7. Close and restart LibreOffice, and the extension is ready for use.'
