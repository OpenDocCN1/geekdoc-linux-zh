    ## USING CELL STYLES

    Calc is unique among spreadsheets in its use of styles – specifically, for cells
    and pages. As in Writer, Calc styles can be based on existing styles to save time
    and provide a unified look. Calc styles can be applied to single or multiple cells,
    an entire column or row, or, by clicking the empty space above row 1 and to the
    left of column A, to the entire worksheet. Press F11 to display and edit styles
    in the Styles & Formatting dialog. If you have used manual (direct) formatting
    already, you should select Format | Clear Direct Formatting to avoid difficulties
    as you apply styles.


    Calc installs with a number of default cell styles. These come with a number of
    predefined settings, mostly for different purposes, such as headings. Other cell
    styles, listed under Status, are intended to mark evaluations of the state of
    your work and can be changed as improvements are added. You may also want to create
    cell styles to mark subtotals or totals of the cells that contain particular functions.
    By contrast, Calc comes with only two page styles, although more can be added
    as needed.


    Cell styles support Fonts and Font Effect settings, and both Cell Style and Page
    Style dialogs have tabs for Borders and Background. Each of these tabs is almost
    identical to those found in other LibreOffice modules, and a variety of fonts,
    borders, and backgrounds is a way to make data arrays distinct from one another
    (Figure 11).


    However, Calc styles do have some tabs that are unavailable elsewhere in LibreOffice.
    In Cell Style, one of the most important is the Numbers tab. Although Calc assumes
    by default that all characters are text to be displayed starting at the left margin
    and all numerals are numbers to be displayed starting at the right margin, you
    can specify the kind of information a cell contains from the Numbers tab. From
    the same tab, you can select formats for information such as the date. The language
    and locale are also on the Numbers tab, because they determine the default formats
    for different types of numbers, including the separator used to make large numbers
    easier to read (Figure 12).


    A second unique tab for cells is Alignment. From the Alignment tab, you can position
    cell entries on an angle, which can save space in headings. Even more importantly,
    you can set text to wrap automatically and to hyphenate, two settings that make
    a worksheet more readable. You might also shrink content to fit cell size, although
    that can be a user-unfriendly choice (Figure 13).


    A third unique tab for cells is Cell Protection. There, you can set whether an
    entire worksheet or just the formulas are protected, or whether to hide a cell
    when printing. These settings are not intended for security so much as protection
    against accidental damage and to reduce clutter.


    Page styles only come into play when a spreadsheet is printed. For convenience,
    you can add headers and footers to each page, using tabs that resemble those in
    Writer Paragraph styles. Probably the most important tab for pages is Sheet, which
    contains options for how the worksheet – which is usually in-


