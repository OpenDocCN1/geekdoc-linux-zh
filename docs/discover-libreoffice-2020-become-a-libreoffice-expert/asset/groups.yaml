    # GET PRODUCTIVE


    Open Document Format


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_51_0.png)


    > Figure 1: To view the contents of an ODF file, give the file name a .zip extension
    and open it with a ZIP archive tool.


    on June 17, 2015, adds accessibility features, RDF-based metadata, a Spreadsheet
    formula description based on OpenFormula, support for digital signatures, and
    some features suggested by the public. Open Document Format 1.3 was approved as
    an OASIS committee specification on January 21, 2020, thus opening the way to
    future implementation of an ODF 1.3 standard, which will include improvements
    to document security.


    # INSIDE ODF


    An ODF file is typically stored and distributed in a ZIP container, which includes
    several XML files and the associated binary content, such as images or other media.
    Each ODF file contains four key embedded XML files: **mimetype**, the table of
    contents for the ZIP container; **meta.xml**, with document-level metadata; **styles.xml**,
    with style definitions for the document; and **content.xml**, with all the document’s
    structured content. ODF provides a flexible container that can embed almost any
    existing digital object and allow it to be used in an office document.


    If you want to see what an ODF file really looks like, start with a LibreOffice
    Writer document and change the .odt extension at the end of the file name to .zip.
    Then use a ZIP archive tool to look inside the container (Figure 1).


    # ODF ADVANTAGES


    The open XML format used with ODF means that software vendors can develop applications
    that are interoperable by design. Open XML-based formats like ODF also allow stricter
    security checks than older binary and pseudo-standard formats. Because of its
    advantages, ODF has been selected by several governments as the standard for document
    exchange within the public administration. The United Kingdom, the Netherlands,
    France, Sweden, and Taiwan are leading with adopting ODF in the public sphere,
    and other governments are exploring ODF as well.


    # ODF FUTURE


    In a world where most documents are exchanged in digital format, an open standard
    should be a priority in schools and all educational institutions. Governments
    need to take a more proactive role in promoting open standards in education and
    the public sphere. Free software organizations are doing as much as they can to
    fill the gap, but the cause of open standards requires active advocacy. The Document
    Foundation has re-launched the ODF Adoption Technical Committee (Figure 2), with
    the support of other Free Software Foundation projects, companies, and public
    administrations. Continued investment in open standards will help protect users
    and developers from the security, interoperability, and efficiency problems associated
    with closed formats. ■■■


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_51_1.png)


    > Figure 2: The OASIS ODF Technical Committee provides information for organizations
    that are considering adopting ODF-based tools.'
