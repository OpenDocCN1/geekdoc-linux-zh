    LibreOffice Calc offers the functionality of Excel with added benefits. *By Bruce
    Byfield*


    **C**alc is LibreOffice’s spreadsheet module. The equivalent of Microsoft Excel,
    Calc is designed to be closely compatible with it. Each Calc worksheet (Figure
    1) is capable of handling 1,024 columns and 1,048,576 rows, more than enough for
    most purposes. If you need more, or find that a spreadsheet crashes on a memory-challenged
    machine, consider creating a database in LibreOffice Base.


    In case you are a complete beginner, spreadsheets like Calc are more or less a
    sophisticated version of the tables found in text documents. In fact, in LibreOffice
    Writer, tables can be set up to use a few simple spreadsheet features. Spreadsheet
    is the name given to a file, and worksheet to the pages within the file. On each
    worksheet, columns are designated by uppercase letters, and rows by Arabic numerals.
    Thus, the first cell on the upper left is A1, an identification that can be used
    to call upon the information it contains when manipulating data.


    The power of spreadsheets lies in the array of features for displaying and manipulating
    data. These features include organizing filters for lists, a full array of functions
    for manipulating all sorts of data, and miscellaneous additional tools. If you
    have used Excel, you can probably become familiar with Calc very quickly. Both
    functions and their names are similar in the two spreadsheet applications, although
    a few are in different locations. Perhaps the greatest difference is that Calc
    uses styles just like LibreOffice Writer: Cell styles for formatting any spreadsheet,
    and page styles for producing a hard-copy version of a spreadsheet. Once defined,
    both of these kinds of styles save you time and allow you to concentrate on data
    entry rather than formatting.


    # PLANNING SPREADSHEETS


    Spreadsheets have a way of growing, which is probably why they are used most often
    online. However, if you take the time to design a spreadsheet template ahead of
    time, you will be able to find your data more easily.


    Begin by designing a generalized default spreadsheet template with personal or
    corporate colors and fonts. Use that template as the basis of additional templates,
    one for each kind of spreadsheet that you use. Often, an important consideration
    is the number of default worksheets in each spreadsheet (*Tools \| Options \|
    LibreOffice Calc \| Defaults*). For example, you might have color-coded sheets
    for different categories of employees. You may also want a separate worksheet
    for the pivot tables (new views of already existing data).


    Most spreadsheets will fall into one of two categories: text-based lists and collections
    of numerical data, or data arrays. Lists are the simplest use of a spreadsheet.
    They include to-do


