    # ### MARKDOWN FORMATTING


    Markdown is a lightweight format popular with developers and users alike.


    and it is supported by several Linux text editors. However, what if you use LibreOffice
    Writer as your preferred writing tool? Although the document processor doesn''t
    support the Markdown format, you can easily create a LibreOffice Basic macro that
    converts Writer documents to Markdown-formatted text files.


    The macro in Listing 5 can handle headings, bold, italics, and URLs. To perform
    the formatting operation, the macro relies on three functions: The `MarkupHeadingsFunc`
    function processes headings in the currently opened document, `MarkupTextFunc`
    searches by text attributes (i.e., *bold* and *italics*) and performs replacements,
    and `MarkupURLFunc` finds and formats hyperlinks in the document.


    The macro itself can be roughly divided into two parts. The first part processes
    the text body of the document and applies Markdown tags to headings, formatted
    text, and URLs. The second part obtains the file name and path of the currently
    processed document and saves it as plain text with the `.md` file extension.


    Thanks to its modular structure, you can easily adapt the macro for use with other
    markup formats: All you have to do is replace the start and end tags in the main
    part of the macro and adjust the `MarkupURLFunc` function (lines 53–67). For example,
    if you want the macro to apply HTML formatting, the relevant parts (lines 4-8,
    63) of the macro and the function should look like the code in Listing 6.


