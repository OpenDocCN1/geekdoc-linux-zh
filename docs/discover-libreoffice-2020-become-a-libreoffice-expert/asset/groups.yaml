    自 2010 年以来，LibreOffice 蒸蒸日上：如今，该套件在全球各地都有大规模部署，例如法国政府拥有 500,000 个安装实例。TDF 估计 LibreOffice
    的用户超过 1 亿，且每年有数百名社区成员聚在一起开会，开发新功能并讨论软件的未来。一些公司应运而生，为该类提供支持和额外功能。而现在，你手中正拿着一本关于它的杂志！


    为了流畅使用，你至少需要 2GB 的空闲硬盘空间和 1GB 的 RAM——因此，过去几年里建造的任何 PC 都应该完全具备能力。对于某些功能，如 Base，需要
    Java [6]，但如果你愿意，也可以在不使用 Java 的情况下使用该类。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_0.png)


    *图 7：OpenDocument 是 LibreOffice 的原生格式，它是一种完全开放和标准化的格式，非常适合长期存储你的工作成果。*


    # 10 年历程


    ## LibreOffice


    ### 文档基金会


    LibreOffice 于 2010 年 9 月宣布发布。探索我们的社区和认证开发者在 10 年里取得的成就……


    **19 个主要版本。**

    新的主要版本如时钟般准时发布，每六个月一次。它们包含新功能、错误修复和兼容性改进。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_2.png)


    **+ 2 亿用户**


    LibreOffice 被全球超过 2 亿人使用。此外，得益于我们的本地化社区，它还支持 100 多种语言。


    **九场会议**


    年度会议已在巴黎、柏林、米兰、伯尔尼、奥胡斯、布尔诺、罗马、土拉纳和阿利坎特举行。未来还有更多会议！


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_3.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_4.png)


    **主要部署**


    LibreOffice 正在全球各地的企业和政府中使用。更多详情请参见 tdf.io/migrations。也可获得专业支持。


    **商业生态系统**


    公司基于 LibreOffice 提供产品，开发新功能，并向项目和社区回馈代码。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_10_5.png)


    让我们也让接下来的 10 年同样精彩！

    tdf.io/joinus


    # 入门指南


    ## 介绍 LibreOffice


    ## 在 Windows 上安装


    - 1. 获取适合你系统的 .msi 安装文件（64 位系统文件名以 win_x64.msi 结尾，32 位系统以 win_x86.msi 结尾）。将文件保存到你的桌面，然后双击它以开始安装过程。

    - 2. 安装向导将会出现，你只需不断点击“下一步”以接受默认选项，这对于日常使用来说是完全没问题的。（如果在过程中出现 *用户账户控制* 对话框，请单击“是”以继续安装。）

    - 3. 安装完成后，点击 *完成*，现在你可以从桌面删除该 .msi 文件了。你崭新发亮的 LibreOffice 安装版本已可在你的程序菜单中找到！


    如果你需要任何帮助，请查看网站上的安装说明 [7]，或者如果你遇到困难，请尝试向 LibreOffice 支持社区提问 [8]。发布消息时，记得包含大量细节（LibreOffice
    版本、操作系统版本以及你看到的任何错误信息）。


    ## macOS


    macOS 版的 LibreOffice 以 .dmg 格式提供，这是一种虚拟磁盘。将 .dmg 文件保存到你的桌面并双击打开。你会看到一个类似图 8 的窗口——点击并拖动
    LibreOffice 图标到你的应用程序文件夹中。（你可能需要输入管理员密码。）然后，你可以直接从 *应用程序* 文件夹启动新软件（或将图标拖到你的程序坞中以便快速访问）。你也可以弹出并删除
    .dmg 文件。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_11_0.png)


    ## Linux


    本期附带的 DVD 上提供了最新版本的 LibreOffice，格式为 .deb 和 RPM 安装包。但我通常建议你直接从你的 Linux 发行版的包管理器安装。这能提供更好的系统整合，并允许将来自动更新。不过，如果你想像从最新的
    .deb 或 RPM 文件安装，请遵循 wiki [9] 上的详细步骤。


    ## 结语


    LibreOffice 是一个先进的办公生产力套件，全球 Windows、macOS 和 Linux 用户均可免费使用。如果你准备好开始创建电子表格、演示文稿和文字处理文档，而不想把钱花在价格过高的工具和复杂的授权场景上，请继续阅读，发现
    LibreOffice 的强大与多用途。■■■


    ## 那么，让我们开始安装吧！


    你可以在随本杂志提供的 DVD 上找到 LibreOffice 的完整版，但你也可以随时从 LibreOffice 网站 [5] 下载。该软件适用于三大主要桌面操作系统——Windows、macOS
    和 Linux，尽管主题和颜色可能因你的系统而异。第一步是查看系统要求：


    - ■ Windows: Microsoft Windows 7 SP1、Windows 8、Windows Server 2012 或 Windows 10

    - ■ Apple macOS（又名 macOS X）: macOS 10.10 (Yosemite) 或更高版本

    - ■ Linux: Linux 内核 3.10 或更高版本


