    ## 使用公式编辑器


    ### 公式和格式


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_45_0.png)


    LibreOffice Math 包允许您显示简单和复杂的公式。*作者为 Franz Böhm 和 Paul Brown*


    Math 公式编辑器可以作为独立程序运行，也可以从其他 LibreOffice 模块调用，并将完美排版的公式嵌入到文本文档、电子表格、演示文稿和绘图中。Math
    可以表示分数、幂、积分、函数，甚至整个方程组或矩阵。


    要在单独窗口中启动 Math，请单击 `File | New | Formula`。要在 Writer、Calc、Impress 或 Draw 中包含公式，请选择
    `Insert | Object | Formula`。该公式将成为文档中嵌入的对象，您可以对其进行拖放以及放大或缩小。无论是在哪种情况下，使用三窗格 Math
    编辑器的方法都是相同的。


    左侧是一个侧边栏，右下角是一个命令窗格。该窗格通常停靠在那里，但可以通过按住 Ctrl 键并双击边框来分离和重新停靠。命令窗格上方是一个预览区域，显示公式在文档中的最终外观。单击
    `View | Elements` 会在一个小的元素窗口中显示辅助工具，这对 Math 初学者特别有用，使输入公式变得更加容易。


    请注意，公式编辑器不执行计算。Math 仅用于编写和显示公式。


    ### 工作区


    当启动 Math 时，工作区是空的。要开始，请从侧边栏的下拉菜单或元素窗口顶部的两行图标中选择九个类别之一。这些类别包括：


    - *一元/二元运算*

    - *关系*

    - *集合运算*

    - *函数*

    - *运算符*

    - *属性*

    - *括号*

    - *格式*

    - *其他*


    主图 © Roman Gorikov. 123RF.com


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_46_0.png)


    ### 入门


    **Tools** | **Symbols** 或点击之前提到的 **Tools** 工具栏中最右侧的 omEGA 符号。在 **Symbols** 对话框中找到字符（图
    2），然后单击 **Insert**，接着单击 **Close**。或者，您可以通过双击该字符来合并最后两步。关联的符号会出现在 **Commands**
    窗格中，其名称前有一个百分号。大写字母以全大写拼写（例如，%ALPHA，%BETA，%GAMMA）；小写字符仅使用小写字母（例如，%psi，%phi，%theta）。有关所有希腊字母和标记等效物的完整列表，请参阅
    Math 手册 [1]。


    如您所见，希腊特殊字符出现在 **Commands** 窗格中，其名称前带有百分号。


    每个类别显示一组操作。如果单击其中一项，**Command** 区域将显示相应的操作，并且 **Preview** 窗格将显示公式在文档中的外观。


    例如，在侧边栏中选择 **Unary/Binary Operations** 并单击 **Multiplication** （**Dot**）符号。您将在
    **Commands** 窗格中看到以下文本：


    ```

    <> · cdot <>

    ```


    **Preview** 中会出现两个带点的灰色方框（图 1）。当您将命令区域中的占位符 (`<>`) 替换为诸如 x 和 y 等数字或变量时，它们将显示在
    **Preview** 中，而不是灰色方块。在插入新公式后，**Commands** 窗格中的第一个占位符已被选中，您可以通过输入字符来覆盖它。按 F4 键转到下一个占位符，按
    Shift+F4 键返回到上一个占位符。默认情况下，Math 会自动更新公式，但您可以通过 **View** | **Auto-Update Display**
    禁用此功能，并按 F9 键手动更新所有内容。


    单击 **View** | **Toolbars** | **Tools** 会在工具栏中添加图标，这些图标可以通过鼠标单击来放大或缩小视图，或以最佳方式填充窗口。从右数第二个符号是一个公式光标，它通过突出显示点击的区域，帮助您找到文档或
    **Commands** 窗格中公式的特定部分。


    ### 希腊字母


    数学公式通常包含希腊字母，您可以在 **Tools** | **Symbols** 中找到，或者通过单击之前提到的 **Tools** 工具栏中最右侧的 omEGA
    符号。在 **Symbols** 对话框中找到字符（图 2），然后单击 **Insert**，接着单击 **Close**。或者，您可以通过双击该字符来合并最后两步。关联的符号会出现在
    **Commands** 窗格中，其名称前带有百分号。


    大写字母以全大写拼写（例如，%ALPHA，%BETA，%GAMMA）；小写字符仅使用小写字母（例如，%psi，%phi，%theta）。有关所有希腊字母和标记等效物的完整列表，请参阅
    Math 手册 [1]。


    从 **Symbols** 对话框，您还可以修改现有符号或添加新符号。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_46_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_47_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_47_1.png)


    图 4：括号的大小可以适应其中的公式。


    图 3：编辑符号对话框允许将现有符号添加到符号集中，或使用常用的特殊字符创建新的符号集。


    您在公式中经常需要的新符号。实现此功能所需的工具可以通过单击编辑按钮找到。例如，如果您想将“相当于”（带帽子的等号）特殊字符添加到特殊符号集中，请从顶部的下拉菜单中选择
    Special，然后单击编辑以调出编辑符号对话框（图 3）。请注意显示的字符集下方的五个下拉菜单。符号字段包含要编辑的字符的名称，最初为 perthousand。从上方字符字段中选择带帽子的等号会将此值更改为
    Ux2259（“相当于”的 Unicode 指定值）。符号集字段包含编辑的符号所在的集合名称，在此情况下为 Special。要将带帽子的等号字符添加到此集合，请单击
    Add。或者，您可以在符号集字段中输入自己选择的名称以创建新集合。


    ### 带括号的


    围栏（括号、方括号、花括号、竖线）对于构建公式是必不可少的。在左侧边栏中，它们在下拉菜单中有自己的条目，即 Brackets。LibreOffice Math
    区分以下类别：


    - 组括号。它们包围相关的表达式，但不出现在公式中。

    - 花括号。如果您从键盘在命令窗格中输入花括号，Math 会将它们理解为组括号。相反，单击 Braces 下拉菜单中的花括号图标会在命令窗口中输入 \lbrace
    和 \rbrace，并在预览窗格中显示一组花括号。

    - 圆括号和方括号。这些像组括号一样具有组织属性，但 Math 会在预览公式中显示它们。


    围栏通常成对出现。如果您在命令窗口中输入开圆括号或方括号，公式编辑器会自动添加闭括号。但是，如果您想使用单个括号而不带其配对项，请在字符前放置一个反斜杠 (\)。Math
    此时会将其解释为符号而不是围栏。


    所有类型的括号也都有可缩放形式。它们位于未缩放括号选项下方的部分中。可缩放括号会自动显示为所需的大小（图 4），并在命令窗口中的字符前显示 left 或 right。因此，图
    4 中公式的命令为：


    ```

    left( ( a + b ) over c + d right) = e

    ```


    您也可以单独输入可缩放括号。使用关键字 none 来抑制第二个括号：


    ```

    left brace right none

    ```


    预览仅打印一个大左花括号，并通知 Math 右侧缺失。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_47_2.png)


    图 5：顶部公式作为长行输入到命令窗口中，没有结构。使用空格和换行创建的相同公式使其更易管理。结果（右侧）是相同的。


    ### 更多结构！


    组括号赋予公式结构，但通过按 Enter 键插入的空格和换行不影响布局。Math 简单地忽略它们，这意味着您可以在命令窗格中使用空格和换行来组织长而复杂的公式，使其更易读，而不影响预览中的呈现。图
    5 显示了上方命令窗格中作为一个长行显示的矩阵公式。下方命令窗格显示了同一公式的更清晰版本，带有断行和空格，并在文档（右侧）中产生相同的结果。


    在创建复杂和长公式时，很容易输错。如果您不小心在某个地方插入语法错误，LibreOffice Math 会通知您。预览窗格中一个倒置的深红色问号表示有问题。双击问号可直接转到命令窗格中对应的位置。按
    F3 转到下一个错误，或按 Shift + F3 转到上一个错误。在窗口底部会出现额外的提示，例如“意外的字符”。


    仅在命令窗格中显示而不显示在文档中的解释性注释非常有用，特别是在长而复杂的公式中。注释以双百分号（% % ）开头。注释一直持续到行尾，所以要结束注释，请按
    Enter。某些符号（例如，`*`，`%`，`^`，`&`，`_`，`|`）在 Math 中具有特殊含义。如果它们需要在文档公式中出现，您必须在命令窗格中在这些字符周围使用双引号。


    ### 最后但同样重要


    如果您决定打印公式，LibreOffice 在打印对话框的 LibreOffice Math 选项卡中提供了一些实用选项。例如，您可以激活标题复选框以在顶部打印文件名。如果勾选公式文本，程序将打印命令窗格的内容。可选地，您可以使用边框并以原始大小打印公式，适应页面，或以其他比例缩放。预览将显示打印结果（图
    6）。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_48_0.png)


    图 6：打印公式时，您可以在打印对话框中调整各种设置。


    如果您直接在 Math 模块中创建了公式，可以通过选择 File | Save as 将其保存为具有 *.odf (Open Document Formula)
    扩展名的独立对象。如果您在 Writer 或 Calc 中嵌入了公式对象，您可以将公式与文本或电子表格文档一起保存，或者将其导出为独立对象。要导出它，请右键单击公式并从上下文菜单中选择保存副本为。


    反之，您可以通过 Insert | Object | Formula 将完成的公式文件加载到 LibreOffice 文件中。此时您将再次看到 Math 公式编辑器；选择
    Tools | Import Formula 以导入所需的文件，然后您可以对其进行修改或原样接受。一旦您单击上方区域的文本或表格文档，LibreOffice
    将关闭 Math 窗口。


    ### 信息


    - [1] Math 手册：https://documentation.libreoffice.org/assets/Uploads/Documentation/en/GSS-2/PDF/GSS209-GettingStartedWithMath.pdf


