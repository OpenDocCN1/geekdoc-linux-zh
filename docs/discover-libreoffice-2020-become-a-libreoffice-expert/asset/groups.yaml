    see a blue box. Click it to add space for a header or footer, and the blue box
    will then change into a menu (Figure 3). From here, you can directly add text
    into the header or footer, which will be consistent across all pages, and add
    page numbers and page counts (as you’d typically find in the footer in books).


    +   2.  **Images and Text Boxes:** If you want to use Writer as a desktop-publishing
    tool, then you’ll want to add floating elements onto the page, such as images
    and text boxes. You can find most of these under the *Insert* menu.


    With images, you’ll be prompted to select an image from your computer, which will
