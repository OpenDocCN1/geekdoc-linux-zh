    # # COMMUNITY


    # ## Get Involved


    # ### OTHER WAYS TO GET INVOLVED


    Those are just two examples of how you can join the community and help to improve
    LibreOffice for millions of users around the world. But there are many more things
    you can do, such as confirming bug reports, helping other users on Ask LibreOffice,
    assisting the design team, and maintaining the project''s infrastructure. To learn
    more, visit whatcanidoforlibreoffice.org. The community looks forward to meeting
    you!


    +   ■ Editing: Sometimes this is called proofreading, although the two are not
    the same. Here you do need good English skills. In addition to correcting errors,
    editors help make the docs more readable.

    +   ■ Research: Writers often don''t have time to make sure existing docs are
    complete and up to date. You can help by reading the forum and mailing lists to
    see what questions users have. Is info missing from the docs or just hard to find?
    Does the community need a new FAQ, a how-to, or a section in a user guide?

    +   ■ Artwork: Help writers by capturing, cropping, and labeling screenshots or
    creating diagrams and other artwork.


    +   ■ Indexing: Other user guides are produced in ODT, PDF, and printed forms.
    Book indexes may begin with automated tools, but they are much improved by human
    input on topics.

    +   ■ Publicity: If you are on any social media, share things you see about LibreOffice
    or its documentation, such as posts on the LibreOffice Facebook page [8] or Twitter
    account (@libreoffice).

    +   ■ Suggestions and wish lists: New ideas are welcome. Is there a better way
    to do something? Discuss your ideas on the mailing list. ▪▪▪


    # ### INFO


    +   [1] TDF Next Decade Manifesto:

    +   https://www.documentfoundation.org/pdf/tdf_manifesto.pdf

    +   [2] LibreOffice goals:

    +   https://www.libreoffice.org/about-us/who-are-we/

    +   [3] Language teams: https://wiki.documentfoundation.org/Language_Teams

    +   [4] Localization groups:

    +   https://wiki.documentfoundation.org/Category:L10n

    +   [5] L10n mailing list: https://wiki.documentfoundation.org/Language/Mailing_List

    +   [6] Localization page:

    +   https://www.libreoffice.org/community/localization/

    +   [7] Native language communities:

    +   https://www.libreoffice.org/community/lnc/

    +   [8] LibreOffice Facebook page:

    +   https://www.facebook.com/libreoffice.org


    # ### SUCCESS STORY: Celia Palacios


    Celia Palacios is active in the LibreOffice Documentation project. Here''s what
    she has to say about her experience.


    **Tell us a bit about yourself!**

    I am a Mexican old-guard user of Linux since 2001. I studied electronic engineering,
    and I have been working with it in field since 1989. I learnt all sorts of Linux
    stuff because I love to learn by myself. In addition, I love to read historical
    detective novels, lots of science fiction, and go to the movies with my husband.

    I love philosophy, symbolism, and many alternative ideas about everything. I also
    like to have long, friendly debates about everybody''s presumptions (or assumptions?).
    I try to be open-minded, especially in these times when everyone''s getting polarized
    in Mexico about our President. I used to be an athletic gal, but now I am a total
    couch potato! Thanks, Netflix!

    **Why did you decide to become a TDF member?**

    Because LibreOffice is one of the leaders in free/libre software, and it is a
    real example of a community with many faces and one heart. And also because people
    in the Spanish LibreOffice Telegram channel are so intelligent, bright, open and
    charming: many of them working truly to help others. That moved me deeply.

    **What are you working on in the LibreOffice project right now?**

    I am helping the Spanish documentation team. I have an idea of asking university
    students to help us finish the first-steps guides. If we succeed, we will have
    an updated introductory guide, which is really needed in Spanish.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_95_0.png)


    Celia Palacios helps out with the Documentation project.


    **Anything else you plan to do in the future?**

    It is too early to answer that without saying “in the regular places.” But it
    is in my plans to update every module''s guide in Spanish. And also some advanced
    guides/tutorials, with practical cases, for Calc and Base, especially to equal
    the outcomes that Microsoft Excel''s Power Business Intelligence is achieving.'
