    \ |\n\n通过这些代码，可以一次性设置高级排版功能并保存在模板中，从而使你的文档拥有专业出版商的排版格式。\n\n### 革命性的完善\n\n近 20\
    \ 年来，LibreOffice 及其前驱软件一直生成足够优秀的副本，导致许多技术出版商使用 LibreOffice 文件进行书籍印刷。不过，仍有少数收尾细节不够完美。\n\
    \n然而，在过去几年中，LibreOffice 增加了这些收尾细节。我可以亲自证明，LibreOffice 可以成功替代 FrameMaker 用于技术手册和小册子。其结果是，一款免费的排版工具，其质量可与任何专业使用的工具相媲美。\n\
    \n**信息**\n\n- 1. 可用标签列表：https://en.wikipedia.org/wiki/List_of_typographic_features#OpenType_typographic_features\n\
    \n# 公共资金\n# 公共代码\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_68_0.png)\n\n使用自由软件现代化公共基础设施\n\
    \n# 提升生产力\n\n# 数字签名\n\n## 使用数字签名\n\n## 安全文档\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_69_0.png)\n\
    \n> 通过添加数字签名，你可以提高文档的安全性。*作者：Bruce Byfield*\n\n数字签名可以验证文档的可靠性。它保证发送者是其所声称的人，并且文档自签署后未被编辑。普通的文件共享可能不需要它，但如果隐私很重要——尤其是在商业或涉及财务事项时——数字签名是保护文件内容的主要方式之一。\n\
    \n最初，数字签名是由第三方证书管理器创建的，它们提供保证文档完整性的证书。LibreOffice 继续将数字签名称为……但是，有些令人困惑的是，它使用相同的术语来指代起相同作用的\
    \ GNU Privacy Guard (GPG) 密钥。GPG [1] 是一种跨平台的加密方法，可以安装在 Linux、macOS 或 Windows 上。尽管第三方服务称其为证书，而\
    \ GPG 称其为密钥，但两者的运作方式类似。两者都包含一个私人证书或密钥和一个公共证书或密钥，接收方必须收到公共证书或密钥才能读取发送的文件。作为发起人，你可以使用证书或密钥读取自己加密的文件。\n\
    \n创建证书或密钥是使用数字签名过程中最耗时的部分。一旦你创建好了，只需将数字签名与文件关联即可，这在 LibreOffice 的任何主要模块中只需几分钟。\n\
    \n## 设置证书\n\n几年前，使用证书机构（CA）非常昂贵。实际上，证书机构超出了普通家庭用户的经济能力。然而，如今，许多免费的证书机构存在。这些免费的证书机构有时缺乏传统证书机构的所有功能，它们签发的证书有时仅在有限时间内有效。例如，Linux\
    \ 基金会 Let’s Encrypt [2] 的证书有效期仅为 90 天，除非特意续期。然而，在许多情况下，这些免费证书对普通用户来说已经足够好。\n\n\
    描述所有主要证书机构的程序篇幅过长，无法在此详述。然而，Let’s Encrypt（图 1）的以下步骤应该与其他证书机构足够相似，以便你根据需要调整：\n\n\
    - 1. 登录并按照步骤生成证书。你将需要为证书命名、指定加密类型、识别要关联证书的 Web 服务器、提供有关你所在位置的详细信息，并选择是否自动续期证书或让它过期。\n\
    - 2. 将证书的 URL 添加到 Web 浏览器的偏好设置中，并设置好使其对文件可用。\n- 3. 通过 *文件* | *数字签名* | *数字签名* ...\
    \ 将证书应用到文件，然后重启 Writer。\n\n你需要密钥的密码短语（图 2）。从同一个对话框窗口中，你可以查看或删除证书，也可以使用它签署文档。\n\
    \n## 使用 GPG\n\nGPG 是一个跨平台加密工具，以各种相似名称可用。将其用于数字证书的优势在于它是免费的，无需注册，并且可以在你选择的时候过期。此外，由于\
    \ GPG 密钥是一个自包含系统，因此无需在 Web 服务器上注册即可使用——尽管你需要单独将公共加密密钥发送给将接收你文件的人。\n\n要使用 GPG 生成密钥，请运行以下命令：\n\
    \n```\ngpg --full-generate-key\n```\n\nGPG 通过五个步骤引导你创建一个密钥：添加你的名字和电子邮件、创建密码短语、选择算法、设置密钥大小以及指定过期日期。如果你对某些可能的选项不确定，只需接受默认值即可。这些默认值并不总是提供最高级别的加密，但在大多数情况下应该足够。如果你想要最高级别的安全性，你可以在遇到选项时随时研究它们（图\
    \ 3）。\n\n最后一步，你应该创建一个吊销证书，以便如果新密钥被泄露，你可以使其失效，运行以下命令：\n\n```\ngpg --armor --output\
    \ revoke.asc \\\n--gen-revoke PUBLIC-KEY-ID\n```\n\n密钥创建完成后，你可以使用以下命令将公共密钥发送给数字签名文件的预期接收者：\n\
    \n```\ngpg --output YOURNAME.gpg \\\n--export KEY-EMAIL\n```\n\n或者作为受保护的纯文本文件，格式如下：\n\
    \n```\ngpg --armor --output YOURNAME.gpg \\\n--export KEY-EMAIL\n```\n\n在 LibreOffice\
    \ 内部，可以通过 *文件* | *数字签名* | *数字签名* ...，导航到密钥所在的目录来选中该密钥。\n\n拥有你公共密钥的文件接收者可以使用以下命令验证文件确实来自你：\n\
    \n```\ngpg --fingerprint KEY-EMAIL\n```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_70_0.png)\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_70_1.png)\n\n```\nbb@nanday:$ gpg --full-generate-key\n\
    \   gpg (GnuPG) 2.1.18; Copyright (C) 2017 Free Software Foundation, Inc.\n  \
    \ This is free software: you are free to change and redistribute it.\n   There\
    \ is NO WARRANTY, to the extent permitted by law.\n\n   Please select what kind\
    \ of key you want:\n    (1) RSA and RSA (default)\n    (2) DSA and Elgamal\n \
    \   (3) DSA (sign only)\n    (4) RSA (sign only)\n   Your selection?\n```\n\n\
    图 3：GPG 密钥是使用证书的现代替代方案。\n\n"
