    ## 隐藏瑰宝


    发现 LibreOffice 中一些鲜为人知的隐藏功能，助你更快、更聪明地工作（还能额外获得极客积分）。*作者：Mike Saunders*


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_81_0.png)


    如果你一直在关注 LibreOffice 自 2010 年从 OpenOffice.org 分支以来的发展，你会知道大量精力都花在了清理源代码上。这使得套件更容易编译，更重要的是，更容易让新的贡献者参与进来。在此过程中，新特性被添加，Microsoft
    Office 的兼容性也得到了改善，但总体来看，多年来其外观和感觉变化不大。


    - 顶部带有两个工具栏的标准布局

    - 单一工具栏模式以节省屏幕空间

    - 带有弹出式侧边栏的单一工具栏以提供额外功能

    - 新的 NotebookBar


    这当然是好事——办公套件用户往往更重视一致性和稳定性，而不是每个版本都出现的全新炫酷小部件。但也有一些改变和新功能确实可以将 LibreOffice 提升到一个新的水平。尽管它们并非开箱即用，但通过一些调整，你可以尝试它们。在本文中，我们将向你展示一些技巧和窍门，利用你可能之前未曾发现的功能，从
    LibreOffice 中获取更多价值。


    此时你可能在想：为什么要有这么多选项？设计团队难道不能专注于一种布局并将其做到完美吗？嗯，那是一种方法，但这可能会疏大部分用户。LibreOffice 设计社区必须让那些希望坚持使用常规工具栏布局的长期用户满意，同时也要吸引那些希望拥有更“现代”设计的新用户。Document
    Foundation 的经费主要依靠最终用户的捐赠，因此让尽可能多的人感到满意是合理的，即使最终结果是一堆界面选项。


    ### 尝试 NOTEBOOKBAR


    近年来，一些 LibreOffice 用户一直在寻求一种更“现代”的用户界面替代方案，以取代常规的工具栏布局。然而，实施这样的改变绝非易事。LibreOffice
    设计社区[1] 必须不断平衡各类用户的需求，有些人喜欢一切保持原样并抵制任何改变，而另一些人则希望软件看起来和感觉起来更像 Microsoft Office。无论设计团队做什么，总有人不满意。这意味着在对
    GUI 进行大规模更改时，需要考虑很多事情，可能会破坏许多工作流程。2016 年 12 月，Document Foundation（LibreOffice
    背后的非营利实体）宣布了 MUFFIN，即“我的用户友好且灵活的界面”[2]。这一概念在 LibreOffice 5.3 中以新的（但可选的！）用户界面布局形式引入：


    如上所述，其中一个选项就是 NotebookBar。它首次在 LibreOffice 5.3 中作为实验性选项出现，然后在 LibreOffice 6.2
    中向所有用户推出（尽管不是默认界面）。NotebookBar 是由设计社区开发的一种“超越工具栏限制”的方法[3]。本质上，它是一个大型工具栏，设计者可以自由利用其空间做任何事情。


    > 正如设计团队所言：“在一张空白画布上，设计者可以在上面放置任何 UI 小部件，包括带或不带标签的常规按钮、用于识别控件组的节标签，或更高级的小部件，如选项卡。他们还能够为按钮定义任何动画，使其作为视觉吸引物，并且拥有一个比经典工具栏更丰富的控件目录供选择。此外，他们可以定义主菜单是否隐藏，或者它是否应采用特定的图标主题。”


