  mdcn: "\n# 入门指南\n\n## LibreOffice Calc\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_24_0.png)\n\
    \n图 12：在“数字”标签页上的选择决定了单元格样式如何读取数据。\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_24_1.png)\n\
    \n图 13：“对齐”标签页改进了单元格内数据的显示效果。\n\n旨在供在线使用的内容可以转移到物理页面上。由于当总列数宽于页面时，这种转移可能会很别扭，因此您还可以选择打印哪些对象。在打印页面上定位对象、图像和图表可能特别困难。最终，您可能更愿意简单地缩小电子表格，尽管眼睛疲劳甚至无法阅读的可能性始终存在（图\
    \ 14）。\n\n作为样式的替代方案，您可以从 *格式* | *电子表格主题* 中选择一个颜色方案。但请注意，主题比样式更通用，而样式具有更多的功能性优势。\n\
    \n# 不断演进的电子表格\n\n电子表格在 20 世纪 80 年代初开始被使用时，功能就是一切。即使是文本换行等格式化功能也不包含在内，这意味着长内容会遮挡相邻单元格，通常使电子表格一眼难以阅读。\n\
    \n如今，电子表格的功能依然强大，尽管在过去几十年中功能数量增长缓慢。电子表格真正发生演进的领域在于格式化选项的兴起。得益于爱德华·塔夫特（Edward Tufte）等信息设计师的影响，电子表格也开始强调展示的重要性，通过高亮和给单元格着色，在功能之上创建视觉印象和指引。\n\
    \n这些视觉印象本身并不是目的。如果您发现自己将电子表格视为艺术品而非理解辅助工具，您将需要重新评估您的优先级。然而，在最佳情况下，功能与视觉辅助的结合使电子表格比\
    \ 40 年前更容易使用。凭借样式的使用，Calc 完全有能力满足这些不断增长的电子表格需求。\n\n> 信息\n\n- [1] 布鲁斯·拜菲尔德（Bruce\
    \ Byfield）。*使用 LibreOffice 进行设计。* 开放文档之友公司（Friends of Open Document, Inc.），2016\
    \ 年\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_24_2.png)\n\n图 14：页面样式对话框提供了将电子表格挤压到物理页面上的选项。\n\
    \n# 通过特刊磨练您的技能！\n\n通过我们的特刊库了解 Shell、LibreOffice、Linux 等更多内容。\n\n*Linux Magazine*\
    \ 团队创建了一系列单卷书籍，让您深入了解您感兴趣的主题。\n\n提供印刷版或数字版\n\n查看完整的库！  \nshop.linuxnewmedia.com\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_26_0.png)\n\n# Impress\n\n## 完美的演示文稿\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_27_0.png)\n\n需要用最新的销售统计数据给老板留下深刻印象吗？或者只是想以引人注目的格式展示一些假日照片？\n\
    \nImpress 是您需要的工具。*作者：迈克·桑德斯（Mike Saunders）*\n\n“PowerPoint”一词已变得与演示文稿同义，即使该文件是用其他程序制作的。演示软件可以追溯到\
    \ 20 世纪 80 年代初，例如 VCN ExecuVision 等工具，允许用户将图像添加到文本中并以幻灯片格式显示。LibreOffice 的演示组件称为\
    \ Impress，它是一个功能极其强大的工具，拥有众多功能和特殊效果。那么让我们深入了解一下吧！\n\n启动 LibreOffice 并选择一个新的 *演示文稿*（或者如果您已经运行该应用程序，请在菜单中选择\
    \ *文件 | 新建 | 文本演示文稿*）。您将看到一系列预装的模板列表，选择一个您喜欢的模板，一个新的 Impress 文档将打开，显示以下功能：\n\n\
    - 1. **工具栏：** 最常用功能只需单击即可到达此处。如果您不确定某个图标的功能，只需将鼠标悬停在图标上即可显示工具提示。您也可以右键点击工具栏并选择\
    \ *可见按钮* 或 *自定义工具栏*，以进行更精细的布局控制。\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_27_1.png)\n\
    \n**图 1：** 一个新的 Impress 文档：工具栏（1）、幻灯片缩略图（2）、幻灯片内容（3）、侧边栏（4）、侧边栏选项（5）、位置和大小（6）以及缩放级别（7）。\n\
    \n# 入门指南\n\n## LibreOffice Impress\n\n- 2. **幻灯片缩略图：** 在这里您可以看到幻灯片的缩小版本，并单击即可在它们之间切换。右键点击幻灯片以对其执行操作（例如，复制或删除），在空白区域右键点击以添加新幻灯片。您也可以点击并拖动以重新排列幻灯片。（注意：此面板可折叠；如果您看不到它，请单击灰色箭头将其打开。）您还可以使用应用命名的幻灯片菜单创建新幻灯片。\n\
    - 3. **幻灯片内容：** 这是您进行大部分工作的地方。在文本框中单击以编辑内容，然后单击文本框周围的灰色区域以显示绿色手柄，您可以使用这些手柄调整幻灯片中文本的大小和位置。使用插入菜单添加图像和额外的文本框。\n\
    - 4. **侧边栏：** 如果您看不到侧边栏，它可能已折叠到右侧，请单击灰色箭头将其打开（或前往 视图 | 侧边栏）。在图 1 中，侧边栏显示不同的幻灯片切换效果。\n\
    - 5. **侧边栏选项：** 侧边栏可以显示许多不同的内容，因此请使用右侧的小图标在它们之间切换（例如，文本属性、动画、有用的剪贴画库等）。\n- 6.\
    \ **位置和大小：** 当您移动或调整对象（如图像或文本框）大小时，检查状态栏以查找确切详情。（您也可以右键点击对象并选择 位置和大小 以精确指定尺寸。）\n\
    - 7. **缩放级别：** 一个快速滑块，允许您更改缩放级别，以便您可以放大查看许多细节，或缩小以查看概览。\n\n# 演示的艺术\n\n无论您对史蒂夫·乔布斯（Steve\
    \ Jobs）持何种看法，毫无疑问他在展示苹果新产品方面非常出色。如果您从未看过他的任何演示，请上 YouTube 搜索一下——最初的 iPhone 和 MacBook\
    \ Air 是两个经典的例子。乔布斯的演示文稿没有塞满文字和过多的细节，而是展示了个别功能、设备图像和偶尔的规格参数。他用语言对幻灯片进行阐述，最终形成了令人印象深刻的演示。\n\
    \n当然，乔布斯的演示风格并不适用于所有情况。向垂涎新技术的记者展示花哨的新奇玩意儿与向老板汇报销售情况或向家人和朋友展示假日照片（参见“创建相册”框）非常不同。但请记住以下一些通用技巧：\n\
    \n- **快速开始。** 没有人喜欢冗长的演示。不要以“在这个演示中我要……”开始，而是立即以一个有趣的事实、统计数据或发现开始。这能立即抓住观众的注意力，并让他们对演示的其余部分充满期待。\n\
    - **将重点放在观众身上。** 很容易一直转身看你的幻灯片，但这只会鼓励你阅读或描述屏幕上的内容，这对演示毫无帮助。看着你的观众，感受他们的反应。\n-\
    \ **添加轶事和故事。** 如果您看过 TED 演讲，您就知道它们充满了轶事。有时这可能显得有些做作，所以不要过度使用，但演示中一两个幽默的插曲有助于打破单调——还能唤醒那些快要睡着的人！\n\
    - **使用“10-20-30”规则。** 这也来自一位苹果员工，基本上是说演示通常不应超过 10 张幻灯片，时长不超过 20 分钟，并使用 30 磅或更大的字体大小。\n\
    - **用谈话替代文本。** 如果您的幻灯片有很多充满文字的页面，请尝试将它们减少为一些要点或图像，然后告诉观众其余内容。您是那里做演示的人，所以确保您在增加价值！\n\
    \n# 创建新演示文稿\n\n那么让我们开始制作演示文稿吧！有关如何吸引观众并为最大效果塑造演示文稿的一般技巧，请参阅“演示的艺术”框。现在，专注于软件本身。\n\
    \n大多数预装模板包含两种或两种以上的设计变体。例如，在我在图 1 中选择的 Allianz 模板中，可以看到左侧自动创建了两个幻灯片：第一个适合介绍（或结尾），而第二个用于常规的文字和图像幻灯片。\n\
    \n因此，在第一张幻灯片中添加一些文本，然后从左侧面板中选择第二张幻灯片，并添加一些文本（也许还有图像）。在进一步工作之前，检查您超快的双幻灯片演示！按 F5（或前往\
    \ 幻灯片放映 | 开始），您将看到它是如何工作的。当第一张幻灯片显示时，单击屏幕上的任意位置 – 或者按空格键 – 以转到第二张幻灯片。之后，演示结束。如果您不小心按了\
    \ Esc 键中断了演示，可以使用 Shift + F5（或 *幻灯片放映 | 从当前幻灯片开始*）从当前幻灯片恢复。\n\n要更改幻灯片布局，请前往侧边栏，单击\
    \ *属性*“卡组”（即部分 – 使用右侧的按钮选择），然后向下滚动到 *布局*。您将在图 3 中看到一组替代设计。\n\n要添加额外的文本框，请前往 *插入\
    \ | 文本框* 或按 F2。然后您可以点击并拖动以确定文本框的确切位置和大小。在这些文本框内格式化文本非常简单 – 只需使用侧边栏的 *属性* 卡组，然后是\
    \ *字符* 和 *段落* 卡组（如果您看不到卡组，点击 + 部件将其更改为 +，使其可见）。那里的大多数选项与 Writer 中相同，所以您可以直接应用您的知识！\n\
    \n您还可以添加形状：*插入 | 形状* 显示可用形状列表，包括线条、箭头、对称\n\n"
