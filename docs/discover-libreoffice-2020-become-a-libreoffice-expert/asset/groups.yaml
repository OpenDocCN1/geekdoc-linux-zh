    ## 入门指南


    ### LibreOffice Impress


    ## 制作相册


    您可以使用 Impress 从一组图像创建相册，通常每页幻灯片放一张照片。这个相册可以使用包含图形和图像的多媒体资源，甚至可以将您最新的假期照片收集到单个演示文稿文件中。为此，首先打开一个现有的或空白的演示文稿，然后选择
    *插入 | 媒体 | 相册*。在出现的创建相册对话框中，点击 *添加* 以选择您的图像并浏览文件系统。具体如何选中多个图像取决于您的操作系统，但通常可以在按住
    Shift 或 Ctrl 键的同时点击来选择。


    选择图像后，Impress 提供了一些额外选项（见图 2）。其中最重要的是 *链接图像*，这意味着图像数据不会直接复制到演示文稿中，而是在观看演示文稿时按需从文件系统加载图像。这样可以节省磁盘空间，因为您不会复制那么多数据。但请注意：如果您从硬盘中移除图像文件，演示文稿中也不会显示它！完成后点击
    *插入幻灯片*，然后您可以继续像往常一样编辑和展示演示文稿。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_29_0.png)


    **图 2：创建相册时，您可以指定每页幻灯片应显示多少张图像。**


    要更改形状或文本框的背景，请右键单击它并选择 *区域*，您将在图 4 中看到显示的对话框。您还可以使用此对话框添加阴影并设置对象的透明度。


    想要为您的演示文稿添加更多形状和剪贴画吗？那就看看库（图 5），它位于侧边栏右侧面板，是自下而上的第二个图标。点击它以查看一系列可添加的内容——只需点击并拖动即可。与其他所有形状一样，如果您点击形状使其高亮，您将看到绿色手柄，可以点击并拖动它们以调整大小。


    现在，您已经拥有了幻灯片、布局、文本框、文本格式、形状和图形——创建演示文稿的所有基本工具。但还有一件事需要考虑：转场效果（即用于从一张幻灯片移动到另一张幻灯片的动画）。从左侧面板选择一个幻灯片，然后从右侧侧边栏选择
    *幻灯片切换* 卡片（它是自顶部向下的第三个图标）。


    您将在侧边栏的主要部分看到许多转场效果，以及展示它们的小图像。请随意探索——只需点击一个转场效果即可查看其工作方式。许多转场效果在下方有额外选项，包括持续时间（以秒为单位）和附加音效。您还可以使用侧边栏的这一部分使演示文稿在等待一定秒数后自动继续——参见底部的
    *切换幻灯片* 选项。


    掌握了基础知识后，我将介绍一些高级功能：工作区视图、母版幻灯片和演讲者控制台。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_29_1.png)


    **图 3：使用侧边栏选择模板中的替代布局，带有额外的文本和/或图像框。**


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_1.png)


    **图 4：Impress 为形状提供了广泛的背景选项——例如纯色、渐变和位图。**


    **图 5：通过侧边栏访问的库提供许多额外的形状和图形，让您的演示文稿更生动。**


    ## 工作区视图


    在 **视图** 菜单下，您会发现各种工作区选项——这些工作区视图中的每一个都旨在简化特定任务的完成。例如，**普通**视图是处理单个幻灯片的主要视图。使用此视图来格式化与设计幻灯片，并添加文本、图形和动画效果。


    然后是 **大纲** 视图，其中按顺序编号包含所有演示文稿幻灯片（图 6）。**大纲** 视图以大纲格式显示每个幻灯片主题标题、项目符号列表和编号列表。只显示包含在每个幻灯片默认文本框中的文本，因此如果您的幻灯片包含其他文本框或绘图对象，这些对象中的文本将不会显示。


    **备注** 视图允许您为幻灯片添加备注。这些备注仅供您参考，在演示文稿展示时观众看不到。同时，**母版讲义** 视图用于设置您幻灯片的打印布局。点击侧边栏中的
    **属性** 标签，您可以选择在 **布局** 部分中每页打印一张、两张、三张、四张、六张或九张幻灯片。此外，这还允许您在页眉和页脚部分添加自定义字段，例如当前日期——在其中一个框中点击，然后前往
    **插入 | 域** 查看可用选项。


    ## 母版幻灯片


    首先，一点背景知识：母版幻灯片是用作其他幻灯片起点的幻灯片。它类似于 Writer 中的页面样式，并控制基于它的所有幻灯片的基本格式。幻灯片放映可以拥有多个母版幻灯片。此外，母版幻灯片具有一组定义的特征，包括背景颜色、图形和渐变，以及其他对象（如徽标、装饰线等），页眉和页脚，文本框的位置和大小，文本格式等等。


    样式控制母版幻灯片的所有特征。使用母版幻灯片创建的新幻灯片将继承所用母版幻灯片的样式。更改母版幻灯片中的样式会导致基于它的所有幻灯片发生变化。但是，您可以修改单个幻灯片而不影响母版幻灯片本身。


    母版幻灯片关联两种类型的样式：演示文稿样式和图像样式。预装的演示文稿样式可以修改，但不能创建新的演示文稿样式。对于图像样式，您可以修改预装样式并创建新的图像样式。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_30_2.png)


    **图 6：使用大纲视图专注于演示文稿的文本内容和结构，而不是图形方面。**


    演示文稿样式影响幻灯片母版的三个元素：背景、背景对象（如图标、装饰线和文本框）以及幻灯片上的文本。文本样式进一步分为 *备注*、*大纲 1* 到 *大纲 9*、*副标题*
    和 *标题*。大纲样式用于大纲的不同级别。例如，*大纲 2* 用于 *大纲 1* 的子点，*大纲 3* 用于 *大纲 2* 的子点，等等。图像样式没有限制，可以影响幻灯片中的许多元素。请注意，文本样式既存在于演示文稿样式选择中，也存在于图像样式选择中。


    让我们试一试！使用 Alizarrin 模板开始新的演示文稿，并在引言和第一页幻灯片中添加一些文本。然后，前往 *视图 | 母版幻灯片*，您应该会看到类似图
    7 的内容。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_31_0.png)


    **图 7：Impress 的母版幻灯片模式：您可以进行影响基于它的所有幻灯片的更改。**


    现在尝试更改幻灯片标题和其他部分的文本格式（即更改为不同的字体）。如果您返回 *视图 | 普通*，您将看到格式更改已应用于幻灯片。因此，您可以快速轻松地同时对许多（或所有）幻灯片进行更改，如果您有许多现有的公司演示文稿但需要根据新的品牌指南更新它们，这将节省大量时间。


    要创建新的母版幻灯片，在左侧幻灯片面板的空白区域右键单击，并选择 *新建母版*。修改此母版以符合您的需求。请注意，建议重命名此新母版。在幻灯片窗格中右键单击幻灯片，并从上下文菜单中选择
    *重命名母版*。完成创建母版幻灯片后，点击顶部工具栏上的 *关闭母版视图* 并返回普通幻灯片编辑模式。


    现在您可以创建新幻灯片并使用侧边栏将母版幻灯片设计应用于它（见图 8）。只需点击右侧面板中的 *母版幻灯片* 图标，然后从顶部选择设计。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_31_1.png)


    **图 8：创建母版幻灯片后，您可以使用侧边栏将其应用于新幻灯片。**


    ## 演讲者控制台


    Impress 包含一个演讲者控制台功能，当连接了额外的演示显示器到计算机时可以使用。此演讲者控制台通过在不同视图下控制幻灯片放映来提供额外的控制，分别显示在您的计算机显示器和观众看到的演示显示器上。您在计算机显示器上看到的视图包括当前幻灯片、下一张幻灯片、任何幻灯片备注以及演示计时器。请注意，演讲者控制台仅在支持多显示器的操作系统上工作，且仅在连接两个显示器时生效（例如其中一个可能是笔记本电脑内置显示器）。


    要启用演讲者控制台，前往 *工具 | 选项*（Windows 和 Linux）或 *LibreOffice | 偏好设置*（Mac OS），然后在左侧选择
    *LibreOffice Impress*，接着选择 *常规*。勾选 *启用演讲者控制台* 按钮并点击确定。现在，当连接外部显示器并开始演示时，您应该在一个屏幕上看到主演示视图，在另一个屏幕上看到演讲者控制台（见图
    9）。（如果不工作，且第二个屏幕只是镜像第一个屏幕，您将需要在操作系统中更改显示器设置。）


    '
