    \nkopano.com/one\nkopano.com/meet\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_1_1.png)\n\
    \n### 办公引擎\n\n开源社区中才华横溢且充满动力的开发人员创建了一系列令人惊叹的免费工具，用于处理世界各地计算机用户过去不得不付费使用的任务：视频编辑器、照片处理器、网络浏览器和开发平台。这个雄心勃勃的系列中的核心是功能强大的\
    \ LibreOffice 办公套件——一套企业级工具集，用于编写和管理文字处理文档、数据库、电子表格、演示文稿以及更多内容。\n\nLibreOffice\
    \ 适用于 Windows、macOS 和 Linux，如果您还没有安装，可以免费下载或从本期附带的 DVD 上安装。LibreOffice 的用户界面非常直观，大多数用户只能看到它的皮毛。他们启动它并学习完成一些常见任务所需的知识。但还有更多！如果您准备好探索其可能性、提高生产力并提升文档质量，这一单卷特辑版将成为您的指南！\n\
    \n继续阅读有关 LibreOffice 套件所有核心工具的教程：Writer、Calc、Impress、Draw、Base 和 Math。您还将找到有关使用\
    \ LibreOffice 扩展、模板和宏的富有洞察力的文章，以及关于高级布局、迁移、数字签名和 XML 脚本的奖励文章。如果您是 LibreOffice\
    \ 的新手，或者准备好将您的 LibreOffice 技能提升到更强大和更高效水平，请来看看！\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_2_0.png)\n\
    \n### LibreOffice\n深入探索全球最棒的免费办公套件\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_3_0.png)\n\
    \n#### 入门指南\n- 8 **介绍 LibreOffice**\n  为什么要为办公生产力套件付费？LibreOffice 完全免费，并且适用于 Windows、macOS\
    \ 和 Linux。\n\n- 14 **LibreOffice Writer**\n  Writer，LibreOffice 的文本处理组件，不仅仅是一个文本编辑器。凭借其强大的样式系统，您可以创建详细而优雅的商务和个人文档。\n\
    \n- 20 **LibreOffice Calc**\n  LibreOffice Calc 提供 Excel 的功能并带来更多好处。\n\n- 28 **LibreOffice\
    \ Impress**\n  需要向老板展示最新的销售统计数据以 impress 他们？还是只想以引人注目的格式展示一些假日照片？Impress 是您需要的神器。\n\
    \n- 34 **LibreOffice Draw**\n  使用 LibreOffice Draw，您可以创建吸引人且信息丰富的基于矢量的绘图。\n\n\
    - 40 **LibreOffice Base**\n  我们将展示如何在 LibreOffice Base 中设置数据库，并使用嵌入在表单中的 SQL 查询进行搜索。\n\
    \n- 46 **LibreOffice Math**\n  LibreOffice Math 包让您能够显示简单和复杂的公式。\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_3_1.png)\n\
    \n#### 服务\n- 3 **欢迎**\n- 6 **DVD**\n- 98 **卷首语**\n\n### LIBREOFFICE 特辑\n\n####\
    \ 提高生产力\n- 50 **开放文档格式**\n  开放文档格式标准是 LibreOffice 成功的重要原因之一。\n\n- 66 **LibreOffice\
    \ 排版**\n  LibreOffice Writer 是一个实用的桌面出版工具，拥有比大多数用户想象得更多的排版功能。\n\n- 53 **LibreOffice\
    \ 扩展**\n  您可以使用超过 350 个实用扩展来增强 LibreOffice 的功能。\n\n- 70 **数字签名**\n  通过添加数字签名，您可以提高文档的安全性。\n\
    \n- 56 **LibreOffice 模板**\n  LibreOffice 模板可以帮助您节省格式化文档的时间，从而让您专注于重要内容。\n\n- 74\
    \ **ODF XML**\n  您可能听说过 LibreOffice 文件“基于 XML”或“使用 XML”，但当您尝试在文本编辑器中打开一个 Writer\
