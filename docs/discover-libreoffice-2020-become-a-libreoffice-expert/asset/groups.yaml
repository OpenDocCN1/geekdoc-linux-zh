    ## Digital Signatures


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_71_0.png)


    Then create a decrypted copy of the file with:


    ```

    gpg --decrypt ENCRYPTED-FILE

    ```


    The file’s text appears in the command line, and an unencrypted version of the
    file appears in the same directory as the encrypted file.


    ## USING DIGITAL SIGNATURES IN PDFS


    Traditionally, PDF files have their own form of security, which consists of two
    passwords: one to view the file and one to edit the file that includes permissions.
    These choices are available from *File | Export As | Export as Pdf…* | *Security*.
    However, they are easily cracked, so much so that only unsophisticated users are
    deterred by them. In fact, if security matters, you should not use them at all.


    Instead, go to *File | Export As | Export as Pdf…* | *Digital Signatures* (Figure
    4). As with other files, you can choose to use a certificate manager or GPG. You
    do not have to fill out the certificate password, since the information is contained
    in the certificate, but doing so is recommended. The other fields (*Location*,
    *Contact Information*, *Reason*, and *Time Stamp Authority*) are also optional.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_71_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_71_2.png)


    A Time Stamp Authority, such as freeTSA.org [3] (Figure 5), is useful in cases
    where the information in the file is time-sensitive, or in cases where you need
    to approve an action before a certain date or time.


    ## RELATED SECURITY OPTIONS


    A digital signature is not the only way to secure a LibreOffice file. For instance,
    from *Insert | Signature Line*, you can add a line for a hard-copy signature to
    be added to the document. While earlier versions of LibreOffice allowed a certificate
    to be used with this feature, LibreOffice 7.0 does not. Consequently, for a digital
    file, this feature does nothing for security or privacy.


    More usefully, when you save for the first time or save a copy using *File | Save
    As*, you can also select boxes to *Save with password* and *Encrypt with GPG key*.
    Both choices will open additional options to set up these added security measures.
    In fact, you might prefer to use *Encrypt with GPG key* rather than using a digital
    signature at all, since encryption by itself should verify the validity of a file.
    However, for a higher level of security, you may want to use both these options,
    as well as a digital signature (Figure 6).


    For many users, digital signatures and these additional features may require familiarizing
    yourself with a number of new concepts. But, contrary to your initial impressions,
    these concepts are not difficult, and some online research and experience should
    soon familiarize you with how they work.


    Once you are comfortable with the basics, digital signatures and related features
    can give you strong security and increased privacy, both of which are badly needed
    given the insecurity of so much of modern computing.


    ## INFO


    - [1] GPG: https://gnupg.org

    - [2] Let’s Encrypt: https://letsencrypt.org

    - [3] Time stamp: https://freetas.org/index_en.php


