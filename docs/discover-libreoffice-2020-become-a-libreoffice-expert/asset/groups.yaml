    ## 开始使用


    LibreOffice Draw


    ### 通用绘图工具


    ### 素描艺术家


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_33_0.png)


    使用 LibreOffice Draw，你可以创建美观且信息丰富的基于矢量的绘图。作者：Thomas Krumbhein


    LibreOffice Draw [1] 是一款免费的基于矢量的数学绘图程序，它帮助你创建从最简单的草图到复杂图表的各种内容。Draw 是一个面向页面、基于对象的程序，其基础是页面，页面开始时是一个空的工作表面，你通过将对象放置在该页面上来创建你的绘图。与
    Writer（基于段落的文字处理器）和 Calc（基于单元格的电子表格）相比，Draw 的空页面提供了更多的自由度。


    Draw 的对象是矢量图形，它们使用由数学向量定义线和曲线。向量根据几何形状描述直线、椭圆和多边形。矢量图形允许你对 Draw 对象进行拉伸、旋转或缩放，而不会损失信息。


    所有对象都具有个别属性。要操作对象属性，你必须首先创建该对象并将其放置在页面的边界内。一旦放置完毕，你可以自由地在这些边界内移动对象。


    Draw 文档可以包含多页，每页可以有不同的图层，每个图层包含不同的对象。因此，最终的 Draw 文档可以是一个复杂的创作，但它基本上是由简单对象编译而成的。一旦你用
    Draw 创建了一个图形，你就可以在其他 LibreOffice 应用程序中使用它而不会遭受任何损失。当你需要重新制作或修改你的图形时，你不需要回到原始的
    Draw 文档。相反，你可以使用 Draw 中最初提供的相同工具，直接在当前的 LibreOffice 应用程序（Writer、Calc 或 Impress）中编辑你的绘图。你还可以将其他
    LibreOffice 程序中创建的对象，如表格、图表和公式，插入到你的 Draw 文档中。


    ### 开始绘图


    选择 *文件* \| *新建* \| *绘图* 以打开一个新的 Draw 文档（图 1）。你会看到活动工作区（中间部分），你在这里创建和操作对象。在工作区的左侧，“页面”窗格显示你文档中所有已创建页面的缩略图。在最左侧，工具栏包含对象创建所需的所有工具。在最右侧，属性侧边栏显示选定对象的属性。你需要同时使用工具栏和属性侧边栏才能充分利用
    Draw。


    当你打开新文档时，你只会看到“页面”窗格中的一个缩略图和一个基于标准页面尺寸的空工作区。要创建你的第一个对象，请通过点击相应的工具栏图标来选择你希望的绘图工具（图
    2）。然后通过左键单击你计划对象的左上角的大致位置来放置对象，按住鼠标按钮，将鼠标移动到对象的右下角目标位置，然后松开按钮。你的对象将以默认属性创建。要修改对象属性，右键单击对象以查看对象外缘上的八个绿色或蓝色小手柄。这些手柄让你可以操作或更改对象的属性。


    至少，每个对象具有以下属性（见图 1 中的属性侧边栏）：


    - **位置**：所有对象都有相对于页面的位置 X 和位置 Y。通常，你的绘图页面的左上角（页面大小减去页边距）是 (0,0)。你的对象也默认使用周围方形的左上角作为其位置。

    - **线条**：所有对象周围都有一条边框线。线条属性通常包括宽度、颜色、样式、边缘和透明度。如果你想要一条不可见的线，请在样式中选择“无”。要创建发丝线（取决于你的打印机，这是最小可打印线），请在宽度中选择
    0.00mm。

    - **区域**：所有对象都有填充属性，但只有当对象是封闭对象时它们才可见，这意味着边框是一条封闭的线，即使该线不可见（参见上文）。简单线条对象也可以具有填充属性，但它们是不可见的。

    - **大小**：所有对象都有自己的大小属性，在宽度和高度方面表现为围绕对象的方形，当你单击对象时可见八个小手柄。你可以使用鼠标并移动单个手柄来操作大小，或者使用属性侧边栏输入宽度和高度值。


    要更改属性，你可以使用属性侧边栏。此外，如果你右键单击对象，上下文菜单将弹出，允许你为每个属性打开单独的对话框；这种方法显示比通过属性侧边栏可用的更多详细属性。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_34_0.png)


    图 1：一个新的 Draw 文档，显示（从左到右）工具栏、页面窗格、活动工作区和属性侧边栏。


    ### 文本


    文本被视为对象的一部分，因此你需要先创建对象才能输入和编辑文本。你将使用文本工具创建一个空框作为你的对象。不幸的是，文本工具已从默认绘图工具栏中移除（图 2）。然而，你可以通过右键单击工具栏标题然后选择文本框来将文本图标放回工具栏。你还可以在标准工具栏（图
    1）中找到替代的文本框工具，或使用键盘快捷键 F2。


    一旦你创建了对象，光标将出现在框的左上角，你就可以开始插入文本。框将显示文本帧的左右边框，并自动换行。如果你插入的文本超过了原始框允许的容量，框将自动向下扩展。


    如果你只想添加一段短文本序列，则不需要先绘制文本框。在这种情况下，只需选择文本框工具，并在你的活动页面上单击你希望文本出现的大致位置即可


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_34_1.png)


    图 2：绘图工具栏提供多种用于创建对象的工具。


    - 选择

    - 线条颜色

    - 填充颜色

    - 线条 - 工具

    - 矩形

    - 椭圆

    - 直线和箭头

    - 曲线

    - 连接线

    - 基本形状

    - 符号

    - 箭头

    - 流程图

    - 标注

    - 星形

    - 3D 对象


