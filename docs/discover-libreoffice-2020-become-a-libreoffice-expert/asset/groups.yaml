    ## 参与其中


    顾问委员会（AB）为那些由董事会（BoD）认定对财务或其他方面作出重大最低限度支持的机构提供了一个论坛，使其能够与董事会会面并提供建议。


    ### 参与：本地化


    LibreOffice 现已支持超过 100 种语言，但总有新的语言可以加入！随着新功能的增加，这些功能也需要翻译并以其他语言进行文档记录。通过协助本地化工作，您可以让世界上更多的人能够使用
    LibreOffice。


    对 LibreOffice 进行本地化不需要具备编程或开源软件的高度专业知识。也不需要具备特定操作系统（如 Linux）的知识。如果您愿意，也可以在 Microsoft
    Windows 上对 LibreOffice 进行本地化。一旦完成，您的本地化资源如果该语言脚本受其他平台支持，则可以非常轻松地用于在其他平台上本地化 LibreOffice
    – 或者如果缺乏这种基本支持，则难度会稍大。


    您需要知道如何从互联网下载程序和数据、安装它们并运行它们（遵循详细指南）。强烈建议您订阅至少一个讨论 LibreOffice 本地化的邮件列表。


    与整个开源世界一样，LibreOffice 是一项协作努力。许多人是志愿者，因此有时您需要礼貌、耐心——如果您真的想要实现某些目标——甚至富有魅力和说服力，或者学会自己动手去做。


    邮件列表中有很多乐于助人的人，只要您以正确的方式提问，他们很乐意为您提供帮助。


    要入门，请查看 LibreOffice 语言团队列表 [3]，以确认您的语言是否尚未有本地化项目。如果有，请联系项目负责人以了解项目状态，看看参与该项目是否适合您。不过请注意，并非所有团队都有时间在该页面上列出自己，因此缺少本地化项目并不一定意味着没有团队。我们还建议您查看
    TDF wiki 上的其他页面 [4]，并快速浏览一下用于翻译的工具 Web-bite。如果您的语言状态仍不明确，您应该联系 L10n 邮件列表 [5]。


    对 LibreOffice 进行本地化并非小事，它有很多层级。最低层级是确保 LibreOffice 正确处理您的文字系统（如果不是基于拉丁文的）。即使其界面是英语或其他外语，LibreOffice
    也应该允许您所在国家的人使用您的文字系统。检查对您文字系统的支持可能是您可以独立完成的任务，但将整个 LibreOffice 界面翻译成新的语言是一项更大的任务，需要超过一个人的工作量（以年计）。理想情况下，应该有多人参与。


    有关本地化的更多详细信息，请参见 LibreOffice 本地化网站 [6]。


    ### 成功案例：Jwiyar Ali


    > Jwiyar Ali 协助将 LibreOffice 本地化为库尔德语。TDF 询问了他的相关体验。


    **首先，请简单介绍一下你自己！**


    嗨！我住在伊拉克北部的库尔德地区——苏莱曼尼耶市。我拥有物理学硕士学位，但我也热爱计算机科学。目前我在一家水泥厂的水泥质量控制部门担任物理学家。


    我负责许多开源项目（如 Ubuntu、Gimp、Firefox 等）的翻译，并领导这些翻译项目。我的爱好是关注新的开源项目，看看它们如何能更具竞争力。我还喜欢足球、散步，以及在空闲时间阅读
    Python 编程课程。


    **在推广/使用自由软件和 LibreOffice 方面，您的地区有哪些机遇和挑战？**


    在我的国家，推广开源应用程序和系统是一个非常大的挑战，因为大多数人——也许 90%——使用专有软件，因为他们听不到或不知道有开源替代品。


    因此，我们在 www.chawg.org 的团队决定创建一个网站来介绍许多开源项目。为此，我们创建了一个 wiki 平台和一个论坛——现在我们还有 Facebook
    群组和个人主页。


    在我看来，这是一个向用户提供更多指南的机会，并让 LibreoOffice 与其他应用程序进行比较。向用户展示 LibreOffice 能做到而其他软件不能做到的事情。此外，向人们展示
    LibreOffice 可以做与他们日常工作中相同——甚至更多——的事情，并向他们发送文章以普及该软件的常识。


    **您目前在 LibreOffice 项目中做什么？**


    我正在翻译 LibreOffice。我希望能在我的语言中看到 LibreOffice——那将是最完美的。此外，这将帮助用户比以前更频繁地与 LibreOffice
    交互。


    **您是如何参与 LibreOffice 的？体验如何？**


    我对开源项目的热爱让我参与到 LibreOffice 及其背后的庞大社区中。在这个社区中，我觉得我不仅仅是在世界某个特定部分工作——而是全世界的人都可能从我所做的事情中受益。体验非常棒，因为事先我不知道我们有像
    LibreOffice 这样伟大的应用程序。


    **您还想补充什么吗？**


    我想感谢所有帮助我加入这个伟大社区的人。


    我对 LibreOffice 的热情没有国界，我希望看到其他开源项目以比以往更快的速度成长。


    社区最好的部分是，我们都相信开源和团队合作。


    这些天，我正在向同事和朋友推广 LibreOffice。我还帮助他们解决在安装或使用软件套件时可能遇到的任何问题。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_93_0.png)


    ### 参与：文档


    LibreOffice 文档团队是一群志愿者，他们致力于为 LibreOffice 用户提供高质量的英文（及其他语言）指南。您可以通过为一个或多个项目做出贡献成为文档团队的一员。无论您的经验水平如何，您都可以做出宝贵的贡献。通过这种方式，您还可以为未来可能的技术写作职业生涯积累宝贵的经验。当前项目的例子包括：


    - 用户指南

    - 常见问题解答 (FAQ)

    - 帮助（应用程序内部）

    - 教程和操作指南

    - 视频


    以下是一些您可以提供帮助的方式：


    - 写作：如果您擅长组织信息、解释概念和编写说明，那么写作是你能提供的最大帮助。理想情况下，您是一位经验丰富的技术写作者并具备良好的英语技能。这两项技能都不是必要条件，因为其他人可以编辑您的英文。如果您希望用其他语言写作或协助翻译，请联系相关的母语项目。有关更多详情，请参阅
    LibreOffice 网站 [7]。

    - 审阅：如果您对自己的写作能力或对 LibreOffice 本身的了解水平没有信心，审阅帮助主题或用户指南章节是一个很好的开始。在使用 LibreOffice
    的同时阅读信息。说明是否正确？是否有遗漏的内容？截图是否最新？告知社区需要修复什么，或者自己进行更正。

    - 编辑：有时这也称为校对，尽管两者并不完全相同。在这里，您确实需要良好的英语技能。除了纠正错误外，编辑还有助于提高文档的可读性。

    - 研究：写作者通常没有时间确保现有文档是完整和最新的。您可以通过阅读论坛和邮件列表来查看用户的问题，从而提供帮助。文档中是否缺少信息，或者只是难以查找？社区是否需要新的常见问题解答、操作指南或用户指南中的章节？

    - 美术：通过捕获、裁剪和标记截图，或创建图表和其他美术作品来帮助写作者。

    - 索引：其他用户指南以 ODT、PDF 和印刷形式制作。书籍索引可能以自动化工具开始，但通过人工对主题的输入可以大大改善。

    - 宣传：如果您在任何社交媒体上，请分享您看到的关于 LibreOffice 或其文档的内容，例如 LibreOffice Facebook 页面 [8]
    或 Twitter 账号 (@libreoffice) 上的帖子。

    - 建议和需求列表：欢迎新想法。是否有更好的方法做某事？在邮件列表上讨论您的想法。 ▪▪▪


    ### 其他参与方式


    这些只是您如何加入社区并帮助改善全球数百万用户使用的 LibreOffice 的两个例子。但还有许多其他事情可以做，例如确认 bug 报告、在 Ask LibreOffice
    上帮助其他用户、协助设计团队以及维护项目的基础设施。要了解更多信息，请访问 whatcanidoforlibreoffice.org。社区期待与您见面！


    ## 太忙没空上网？


    我们的 ADMIN Online 网站提供您在印刷杂志中看不到的额外新闻和技术文章。


    立即订阅我们的免费 ADMIN Update 通讯，即可获得：


    - 关于我们最佳在线功能的有用更新

    - 仅限通讯读者可用的及时折扣和特别赠品

    - 关于新 IT 的深度知识


    bit.ly/HPC-ADMIN-Update


    ### 信息


    - [1] TDF 下一个十年宣言：https://www.documentfoundation.org/pdf/tdf_manifesto.pdf

    - [2] LibreOffice 目标：https://www.libreoffice.org/about-us/who-are-we/

    - [3] 语言团队：https://wiki.documentfoundation.org/Language_Teams

    - [4] 本地化小组：https://wiki.documentfoundation.org/Category:L10n

    - [5] L10n 邮件列表：https://wiki.documentfoundation.org/Language/Mailing_List

    - [6] 本地化页面：https://www.libreoffice.org/community/localization/

    - [7] 母语社区：https://www.libreoffice.org/community/lnc/

    - [8] LibreOffice Facebook 页面：https://www.facebook.com/libreoffice.org


    ### 成功案例：Celia Palacios


    Celia Palacios 活跃于 LibreOffice 文档项目。以下是她对这段经历的看法。


    **请简单介绍一下你自己！**

    我是墨西哥的一名老派 Linux 用户，自 2001 年起开始使用。我学习的是电子工程，自 1989 年以来一直在该领域工作。因为我喜欢自学，所以我学会了各种各样的
    Linux 知识。此外，我喜欢阅读历史推理小说、大量科幻小说，并和我的丈夫一起去看电影。

    我热爱哲学、象征主义以及各种关于一切的非主流观点。我也喜欢就每个人的预设（或假设？）进行长篇友好的辩论。我努力保持思想开放，尤其是在这些时候，当墨西哥人围绕我们的总统越来越两极分化时。我以前是个运动型女孩，但现在我是个彻底的沙发土豆！谢谢，Netflix！


    **你为什么决定成为 TDF 会员？**

    因为 LibreOffice 是自由/开源软件的领导者之一，它是拥有许多面孔和一颗心的社区的真正例子。也因为西班牙语 LibreOffice Telegram
    频道里的人非常聪明、聪明、开放和有魅力：他们中的许多人真心实意地帮助他人。这深深打动了我。


    **您目前在 LibreOffice 项目中做什么？**

    我正在帮助西班牙语文档团队。我有一个想法，是请求大学学生帮助我们完成入门指南。如果我们成功，我们将拥有一份更新的入门指南，这在西班牙语中是真正需要的。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_95_0.png)


    Celia Palacios 在文档项目中提供帮助。


    **未来您还计划做什么？**

    在不提到“在常规地方”的情况下，现在回答这个问题还为时过早。但我计划更新每个模块的西班牙语指南。还有一些针对 Calc 和 Base 的高级指南/教程，包含实际案例，特别是为了达到
    Microsoft Excel 的 Power Business Intelligence 所实现的效果。


    '
