    If you’ve been following the development of LibreOffice since it was forked from
    OpenOffice.org in 2010, you’ll know that a great deal of effort has been put into
    cleaning up the source code. This has made the suite easier to compile, and, more
    importantly, it’s easier for new contributors to get involved. Along the way,
    new features have been added and Microsoft Office compatibility has been improved,
    but by and large, the look and feel haven’t changed very much over the years.


    - The standard layout with two toolbars at the top

    - A single toolbar mode to save screen space

    - A single toolbar with a pop-out sidebar to provide extra functionality

    - The new NotebookBar


    That’s a good thing, of course – office suite users tend to value consistency
    and stability rather than shiny new widgets with every release. But there are
    some changes and new features that could really take LibreOffice up a level. Although
    they aren’t available out of the box, with a bit of tweaking, you can try them
    out. In this article, we’ll show you some tips and tricks to get more out of LibreOffice,
    using features you may not have come across previously.


    You may be thinking at this point: Why so many options? Couldn’t the design team
    just focus on one layout and make it perfect? Well, that would be one approach,
    but it risks alienating a big chunk of users. The LibreOffice design community
    has to keep long-time users (who want to stick with regular toolbar layouts) satisfied,
    while also enticing new users who want a more “modern” design. The Document Foundation
    is financed largely by donations from end users, so it makes sense to keep as
    many as possible happy, even if the end result is a bunch of interface options.


    ### TRY THE NOTEBOOKBAR


    In recent years, some LibreOffice users have been asking for a more “modern” user
    interface alternative to the regular toolbar layout. However, implementing such
    a change is no easy task. The LibreOffice design community [1] has to constantly
    juggle the demands of various types of users, some of whom like things exactly
    as they are and resist any change, and others who want the software to look and
    feel more like Microsoft Office. Whatever the design team does, someone will be
    unhappy. That means lots of things need to be considered when making large-scale
    changes to the GUI, potentially breaking many workflows. In December 2016, The
    Document Foundation (the non-profit entity behind LibreOffice) announced MUFFIN,
    the “My User Friendly and Flexible Interface” [2]. This concept was introduced
    in LibreOffice 5.3 with new (but optional!) user interface layouts:


    One of those options, as mentioned above, is the NotebookBar. This made its first
    appearance in LibreOffice 5.3 as an experimental option and was then rolled out
    for all users (albeit not as the default interface) in LibreOffice 6.2. The NotebookBar
    was developed by the design community as a way to “evolve past the restrictions
    of toolbars” [3]. Essentially, it’s a large toolbar where designers have the freedom
    to do anything they want with the space.


    > To quote the design team: “With a blank canvas, a designer can place any UI
    widget on it, including the usual buttons with or without a label, a section label
    to identify the group of controls, or more advanced widgets like tabs. They also
    have the ability to define any animation for buttons, so they serve as a visual
    attractor, and all together have a larger catalog of controls to choose from that
    couldn’t found in classic toolbars. Furthermore, they can define that the main
    menu can be hidden, or whether it should have a particular icon theme, for instance.”


    What’s especially interesting here is the use of contextual groups. This means
    that some controls and sections of the NotebookBar are disabled when you’re doing
    certain tasks. For example, you probably always want access to buttons for loading
    and saving files and performing undo and redo operations, but you don’t need immediate
    access to cropping and rotation operations unless you’ve clicked on an image.
