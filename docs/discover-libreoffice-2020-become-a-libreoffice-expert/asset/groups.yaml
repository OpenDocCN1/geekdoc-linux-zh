    # 高效工作与

    ## 101 个 Linux 技巧


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_6_0.png)


    通过这本充满灵感的技巧和快捷键合集，提升你的 Linux 技能，专为 Linux 极客打造。


    - 撤销删除的文件

    - 治愈“大写锁”疾病

    - 在 shell 中运行 C 语言单行程序

    - 禁用摄像头和麦克风

    - 还有更多！


    ## 快速入门


    ### 介绍 LibreOffice


    #### 什么是 LibreOffice，以及如何安装？


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_7_0.png)


    为什么要为办公生产力套件付费？LibreOffice 完全免费，并且可以在 Windows、macOS 和 Linux 上运行。


    *作者：迈克·桑德斯（Mike Saunders）*


    一套功能齐全、兼容微软文档且完全免费的办公套件——这样的好事真的存在吗？肯定有什么猫腻吧！嗯，不。没有猫腻。没有隐藏费用。没有任何可疑之处。[LibreOffice](https://www.libreoffice.org)
    [1] 确实是一套完整的办公工具，零成本，它也不通过广告或出售用户数据来盈利。


    它免费的原因很简单：它由一个全球社区开发，由志愿者驱动，他们热衷于高质量的、“对每个人免费”的生产力软件。LibreOffice 的目标是弥合“数字鸿沟”，使强大的工具对每个人可用，无论其收入、地点或语言。事实上，LibreOffice
    的用户界面已被翻译成 100 多种语言，使得在其他软件供应商未涉足的国家中，许多人也能使用该软件。


    现在，这并不意味着所有 LibreOffice 开发者都纯粹出于慈善原因开发该软件。有很多“认证开发者”[2] 的客户在使用 LibreOffice（如公司或地方政府部门），他们受雇提供支持包、修复
    bug 并实现新功能。LibreOffice 本身（并且永远）完全免费，但它仍然支持了一个可行的商业生态系统。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_7_1.png)


    **图 1：** 这里是 Writer，文字处理软件...


    如果 LibreOffice 真的完全免费（是的！）并且兼容 Microsoft Office（确实！），那么为什么全世界没有都转用它？为什么 MS Office
    依然存在？原因有很多，例如：


    - **熟悉度：** 很多人仍然不知道 LibreOffice 的存在。其背后的非营利实体“文档基金会”正在通过营销和活动来改善这一状况，但需要做得更多才能传播其知名度。

    - **对变化的抵触：** 即使人们发现了 LibreOffice，他们往往也不愿意改变，尤其是如果他们已经付费购买了其他办公套件。LibreOffice
    看起来很熟悉，但在某些地方外观和工作方式略有不同，一些更保守的用户不急于切换。

    - **功能：** LibreOffice 拥有日常用户需要的大部分功能，在某些领域甚至比 MS Office 更多 [3]。但一些专为 MS Office
    设计的工作流程需要宏或特殊功能集，这与 LibreOffice 并不完全匹配。不过，随着 LibreOffice 每六个月发布新版本，这种情况变化很快，LibreOffice
    常常在推出尚未在 MS Office 中出现的新功能方面处于领先地位。


    LibreOffice 套件包括几种工具，包括：


    - **Writer** – 文字处理软件（图 1）

    - **Calc** – 电子表格软件（图 2）

    - **Impress** – 演示工具（图 3）

    - **Draw** – 用于图表、流程图、传单等（图 4）

    - **Base** – 用于数据库（图 5）

    - **Math** – 用于创建公式


    在接下来的几页中，我将提供更多关于 LibreOffice 及其背后社区的背景信息，并展示如何安装它。如果你真的迫不及待想开始，可以跳至安装部分 – 但别忘了稍后回来了解更多关于该套件的信息！通过学习其历史和背景，你可以帮助倡导
    LibreOffice 并向其他潜在用户传播。


    ### 简短历史


    LibreOffice 诞生于 2010 年，但其历史实际上可以追溯到更早的许多年前。事实上，要探索今天被称为 LibreOffice 的起源，你必须回到
    1980 年代，一个名为 StarWriter 的程序（图 6）。StarWriter 是一个商业文字处理应用程序，由德国程序员 Marco Börries
    创建，当时它可供 8 位和 16 位家用计算机（如 Amstrad CPC 和运行 MS-DOS 的 PC）使用。在接下来的几年里，Börries 创建了一家名为
    Star Division 的小公司来监督其程序的开发，并增加了电子表格和绘图程序等额外工具。1992 年，StarOffice 1.0 for MS-DOS
    发布，两年后发布了支持 Windows 和 macOS 的 StarOffice 2.0。


    与强大的 MS Office 相比，StarOffice 相对不为人知，但它的普及程度足以在 1990 年代整个十年中发布新版本。然后发生了一件大事：Sun
    Microsystems，一家高端服务器和工作站的主要供应商，以相当惊人的 7350 万美元收购了 Star Division。背后的理由是什么？许多人猜测，对于当时拥有超过
    20,000 名员工的 Sun 来说，收购 Star Division 是比购买 MS Office 许可证更便宜的方式来为其所有员工配备办公套件。另一些人则猜测
    Sun 渴望更多地涉足家用/个人计算领域。


    无论如何，这意味着 StarOffice 背后突然出现了一家更大的公司 – 有更多的资源和开发者可以投入工作。2000 年，Sun 将 StarOffice
    5.2 作为个人使用的免费下载发布；该套件还随许多杂志的封面光盘提供。微软突然面临更多竞争，许多人发现 StarOffice 足以满足他们的日常任务。


    然后另一次重大变化发生了。当时的自由和开源软件运动正在获得大量牵引力，承诺源代码（人类可读的配方）可自由获得的软件的好处。对于开源程序，任何人都可以“深入引擎盖”进行摆弄、改进，并将它们提交回给开发者。开源是一项大规模的协作努力，全世界都可以从中学习并产生影响，这与像
    MS Office 这样的闭源程序形成对比，后者实际上很少有人能查看内部并进行改进。


    Sun 观察到其他开源项目正在获得动力，例如 GNU/Linux 操作系统和 Mozilla 网络浏览器（如今以 Firefox 的形式存在，可能是最著名的开源应用）。作为回应，Sun
    决定在一个名为 OpenOffice 的新项目中向所有人开放 StarOffice 代码。是的，这意味着世界现在拥有一套完全免费的办公套件 – 免费意味着零成本，但免费也意味着每个人都可以研究其工作原理、进行改进并分享。


    经过两年的开发，OpenOffice.org 1.0 于 2002 年发布。它并不是最漂亮的发布版本，有一些粗糙的边缘和不如人意的性能，但它仍然是一个重要的里程碑。Linux
    用户尤其高兴能有一套功能齐全、开源的办公套件，默认随其操作系统提供。一年后，一个小更新版本 OpenOffice.org 1.0 发布，随后 OpenOffice.org
    2.0 于 2005 年到达，带来了许多性能改进。


    ### ODF 的诞生


    2.0 版本还使用开放文档格式（ODF）[4] 作为其默认格式（图 7）。文档、电子表格和图形作为计算机可读数据块存储在我们的计算机上。当时，微软文档存储在奇怪的专有复杂数据块中，这些数据经过混淆，其他程序很难读取。


    ODF 作为一种替代品被创建：数据以开放和标准化的方式结构化，基于 XML，因此以 OpenOffice 保存的文件可以轻易地被其他程序打开和理解。以 ODF
    格式保存工作的用户可以保证未来能够读取这些文件，无论工具如何变化，无论 OpenOffice.org 发生什么。几年后，微软创建了另一个伪标准，称为“OOXML”，并且


