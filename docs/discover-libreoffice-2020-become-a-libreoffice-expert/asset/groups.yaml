    ## 入门指南


    LibreOffice Impress


    ## 导入与导出


    Impress 在处理 PowerPoint 格式演示文稿的导入方面表现出色，尽管在复杂动画和效果方面可能存在某些局限性或差异。如果有人向你发送一份需要你修改的
    Microsoft Office 演示文稿，请让他们以 .pptx 格式而不是 .ppt 格式发送——这是一种文档记录稍多但仍有限制的格式。在一个理想的世界中，所有办公软件都会使用像
    .odp（开放文档演示文稿，即 LibreOffice 所采用的格式）这样完全开放和标准化的格式，但我们还是先梦想一下吧！


    与此同时，Impress 允许你以多种格式保存文件。前往“文件 | 另存为”，查看打开的对话框中的“文件类型”下拉列表——你可以选择 Microsoft 格式、HTML，甚至纯文本。在“文件
    | 导出为”下还有更多选项。在这里，你可以选择将演示文稿保存为 PDF 或 EPUB 格式（后者适合电子书阅读器）。


