  - '[PAGE 2]


    # # Office Engine


    The brilliant and highly motivated developers of the open source community have
    created an amazing menagerie of free tools for doing things that computer users
    around the world used to have to pay for: video editors, photo processors, web
    browsers, and development platforms. The centerpiece of this ambitious collection
    is the versatile LibreOffice office suite – an enterprise-ready toolset for composing
    and managing word-processing documents, databases, spreadsheets, presentations,
    and much more.


    LibreOffice runs on Windows, macOS, and Linux, and, if you don’t already have
    it, you can download it for free or install it from the DVD attached to this issue.
    The LibreOffice user interface is very intuitive, and most users just see the
    edges of it. They start it up and learn what they need to know for a few common
    tasks. But there is so much more! If you’re ready to explore the possibilities,
    get productive, and dial up the quality of your documents, this single-volume
    special edition will serve as your guide!


    Read on for tutorials on all the core tools of the LibreOffice suite: Writer,
    Calc, Impress, Draw, Base, and Math. You’ll also find insightful articles on working
    with LibreOffice extensions, templates, and macros, as well as bonus articles
    on advanced layout, migration, digital signatures, and XML scripting. If you’re
    new to LibreOffice, or if you are ready to take your LibreOffice skills to another
    level of power and efficiency, look inside!


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_2_0.png)'
  - '[PAGE 3]


    # **LibreOffice**


    Dive deep into the world’s greatest free office suite


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_3_0.png)


    # Get Started


    +   8 **Introducing LibreOffice**

    +   Why pay for an office productivity suite? LibreOffice is totally free, and
    it runs on Windows, macOS, and Linux.


    +   14 **LibreOffice Writer**

    +   Writer, LibreOffice’s word-processor component, is more than just a text editor.
    With its powerful styles system, you can build detailed and elegant documents
    for business and personal use.


    +   20 **LibreOffice Calc**

    +   LibreOffice Calc offers the functionality of Excel with added benefits.


    +   28 **LibreOffice Impress**

    +   Need to impress your boss with the latest sales stats? Or just show off some
    holiday photos in an eye-catching format? Impress is the tool you need.


    +   34 **LibreOffice Draw**

    +   With LibreOffice Draw, you can create attractive and informative vector-based
    drawings.


    +   40 **LibreOffice Base**

    +   We show you how to set up a database in LibreOffice Base and search it with
    SQL queries embedded in forms.


    +   46 **LibreOffice Math**

    +   The LibreOffice Math package lets you display simple and complex formulas.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_3_1.png)


