  md: "\n## GETTING STARTED\n### LibreOffice Base\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_0.png)\n\
    \nchange the form directly with the mouse. In the *Data* tab, choose *Input required*\
    \ | No. If this is not chosen, then you must declare an image before saving. The\
    \ changes will take effect by closing the *Properties* dialog.\n\nNow *Ctrl-click*\
    \ the *ID input* field and open the *Properties dialog* via *Control* in the context\
    \ menu. Select *General* | *Read-only* | Yes. The field should also be uniquely\
    \ recognizable, such as by using a different color scheme.\n\nTo display a list\
    \ box for the *Category/ID* input field, *Ctrl-click*, then right-click and choose\
    \ *Replace with* | *List Box* from the context menu. In the *Data* tab of the\
    \ *Properties dialog* for the list box, change *Type of list contents* to *Sql*.\
    \ Clicking the button with the three dots by *List content* (Figure 5) starts\
    \ the SQL command editor, in which you will define the content of the list field.\n\
    \nTo begin, *Add the Category table* in the *Tables* section of the *Add Table*\
    \ or *Query* dialog. A new *Category* box appears with a list of its fields. A\
    \ double-click on the *Category* field turns it into the first query field (field\
    \ 0 in database-speak). A double-click on the *ID* field makes this the second\
    \ query field (Figure 6).\n\nNext, click *Sort* | *ascending* for the *Category*\
    \ field. Closing and saving the SQL command dialog, shows the new SQL query in\
    \ the *List content* drop-down. Now switch to *General* | *Drop-down* | Yes so\
    \ that the list box unfolds downward. Here, you can change the number of fields\
    \ shown, as well.\n\n*Right-clicking* on *PlaceID* in the table control field\
    \ (subform) opens a context menu where you can select *Replace with* | *List Box*.\
    \ Open the *PlaceID* context menu again and start with the *Column* properties.\
    \ As before, the list content should be created in the SQL command query editor,\
    \ where you *Add* the *Place* table. Now, double-click, one after another, *Room*,\
    \ *Cupboard*, *Rack*, and *ID*. For further editing of the query, click the *Switch\
    \ Design View On/Off* icon to view the SQL code (Figure 7):\n\n```sql\nSELECT\
    \ \"Room\", \"Cupboard\", \"Rack\", \"ID\" FROM \"Place\"\n```\n\nThe command\
    \ would display all fields of the table separately in the order shown. A list\
    \ field, however, can only display one field and only save the value of another\
    \ field; therefore, the content of the first three fields has to be combined:\n\
    \n```sql\nSELECT \"Room\" || \"Cupboard\" || \"Rack\", \"ID\" FROM \"Place\"\n\
    ```\n\nNow the *Room*, *Cupboard*, and *Rack* fields are shown one after another\
    \ in one field. On the other hand, the value of *ID* is saved in the form, which\
    \ is not optimal for displaying within a list box.\n\nChanging the SQL command\
    \ to\n\n```sql\nSELECT \"Room\" || ' - ' || \"Cupboard\" || ' - ' || \"Rack\"\
    \ AS \"\", \"ID\" FROM \"Place\" ORDER BY \"\"\n```\n\nseparates *Room*, *Cupboard*,\
    \ and *Rack* fields with spaced dashes and assigns an alias with the `AS` statement,\
    \ which is used to sort the content of the list box. Close and save the SQL command\
    \ editor and the *Properties* box before continuing.\n\nFor the final modification,\
    \ right-click *ArticleID* in the control table and select *Delete column* in the\
    \ context menu. Although the form is now ready to use, the field sizes still need\
    \ to be modified, and you can change the *CategoryID* and *PlaceID* labels, as\
    \ well.\n\nNavigating through the form, searching for data records, and so on\
    \ can take place in the *Navigation Bar* at the bottom of the screen (Figure 8),\
    \ which shows up automatically once data has been entered.\n\nSometimes a separate\
    \ navigation bar next to an input field is desirable.\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_1.png)\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_2.png)\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_3.png)\n\
    \nTo create this, you need to open the form for editing again. First click on\
    \ a field in the main form and then on the *More Controls* icon toward the bottom\
    \ of the left sidebar. By Ctrl-clicking *Navigation Bar* in the new controls,\
    \ a new Navigation Bar appears in the form that contains nearly all the same fields\
    \ as the Navigation Bar at the bottom of the screen.\n\n## SEARCHING DATASETS\n\
    \nBase itself has a few search functions built in. Unfortunately, these functions\
    \ are more difficult to manage while using a form. To change this, you have to\
    \ go slightly deeper, where basic knowledge of *SQL* code is a must. For general\
    \ help, you can refer to the downloadable Base manual.\n\nTo begin, create another\
    \ table in which to save the search term with *Tables | Create Table in Design\
    \ View* and add the fields:\n\n- *ID* as *Yes/No* [BOOLEAN]\n- *Search* as *Text*\
    \ [VARCHAR]\n\nRight-click the *ID* field to make it the primary key and save\
    \ the table with the name *Search*. Insert \"ID\" = *true* in the first row of\
    \ the table. This table should only save this one data set.\n\nOpen *Queries |\
    \ Create Query in SQL View*, to enter code more quickly than in *Design View*,\
    \ and type:\n\n```sql\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE COALESCE\n\
    (\n  (SELECT \"Search\"\n   FROM \"Search\"\n   WHERE \"ID\" = TRUE\n  ), \"Article\"\
    \n)\n```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_0.png)\n\nFigure 9: The\
    \ Form Navigator shows all the elements of a form.\n\nThe *COALESCE* function\
    \ checks whether *Search* is empty; however, if *TRUE*, *Article* and *Article*\
    \ should always have content and *Article* should always have the same as *Article*,\
    \ this word now shows all *Article* table data. If a word is entered in *Search*,\
    \ only *Article* items that match the entered value are shown. This query has\
    \ to be improved a bit so that also parts of the search entry show results:\n\n\
    ```sql\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE COALESCE\n( '%' ||\n\
    \  (SELECT \"Search\"\n   FROM \"Search\"\n   WHERE \"ID\" = TRUE\n  ) || '%',\
    \ \"Article\"\n)\n```\n\nTo test the query, click the *Run Query* icon in the\
    \ toolbar or press *F5*. All the data sets from the *Article* table are shown.\
    \ The last line displays *AutoField* in the *ID* field.\n\nAmend the code to look\
    \ in the *Search* table for an entry with the value *Search* and compare it to\
    \ the *Article* field in the *Article* table:\n\n```sql\nSELECT * FROM \"Article\"\
    \nWHERE \"Article\" LIKE\n(\n  SELECT \"Search\"\n  FROM \"Search\"\n  WHERE \"\
    ID\" = TRUE\n)\n```\n\nYou will probably not see any values now, because the content\
    \ of the *Search* field in the table *Search* is empty. Amend the code again to:\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_1.png)\n\nFigure 10: Cycle only\
    \ through the active record – no navigation bar, no new rows, ...\n\nBy using\
    \ *%*, the hits on the search term can now contain any number of characters before\
    \ and after the term. One input can therefore get multiple hits. The only downside\
    \ is that it still distinguishes between lower- and uppercase. The following query\
    \ now allows the entry of text contained somewhere in the *Article* field, regardless\
    \ of upper- and lowercase:\n\n```sql\nSELECT * FROM \"Article\"\nWHERE LOWER (\
    \ \"Article\" ) LIKE COALESCE\n( '%' ||\n  (\n    SELECT LOWER ( \"Search\" )\n\
    \    FROM \"Search\"\n    WHERE \"ID\" = TRUE\n  ) || '%', \"Article\"\n)\n```\n\
    \nNow save this query as *qrySearchArticle*, copy the form already created under\
    \ Forms, paste the copy as a new form named *ArticleSearch*, and open this new\
    \ form for editing by right-clicking and choosing *Edit*.\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_2.png)\n\
    \nFigure 11: Form with search function. Nine records were found with content *Meter*.\n\
    \nTo add a *Search* input area to the existing form, you need to open the *Form\
    \ Navigator* (Figure 9). In the dialog that opens, right-click *Forms* and choose\
    \ *New | Form*. A new form is then added next to *MainForm*.\n\nOpen the properties\
    \ of this form via its context menu. In the *Data* tab, choose *Search* in the\
    \ *Content* drop-down. It is especially important to select *Cycle | Active record*.\
    \ The remaining settings shown in Figure 10 ensure that the same data set, always,\
    \ is edited and changed.\n\nNext, select one of the available form fields in *MainForm*\
    \ and bring up its *Properties* dialog, and have set in *Properties* | *General*\
    \ | *Action* | *Refresh form*.\n\nAfter closing the new form's *Properties* dialog,\
    \ select *MainForm*. In the *Data* tab, select *Content type* to *Query* and *Content*\
    \ to *qrySearchArticle*. Next, *Ctrl-click* the *Push Button* icon in the sidebar.\
    \ This button should appear in *MainForm* (check the *Form Navigator*). In the\
    \ button's *Properties* dialog in the *General* tab, choose *Action* | *Refresh\
    \ form*. Now, with every click on this button, the form will be scanned again.\n\
    \nIn the *Form Navigator*, select the new form for the *Search* table again and\
    \ create an input area by choosing the *Text Box* icon and using the mouse to\
    \ draw a box. Set *Data field* to *Search* and *Input required* to *No* in the\
    \ *Data* tab of the *Properties* dialog for this box. The contents of this text\
    \ field will now be saved automatically when the button in *MainForm* is clicked\
    \ (Figure 11).\n\nIf you are happy with the form and do not want to make any design\
    \ changes, you can save it now.\n\n## CONCLUSION\n\nAt first, creating an internal\
    \ Firebird database takes a lot more time than creating a table in Calc, but once\
    \ the database is constructed, the data entry is a lot more accurate and fast\
    \ than entering data in a spreadsheet. A further advantage is the possibility\
    \ of generating reports.\n\nBase also lets you connect to external databases (e.g.,\
    \ MySQL/MariaDB, PostgreSQL, e-mail address books, etc.) beyond the Base internal\
    \ databases. Base then merely accesses the tables and provides a graphical user\
    \ interface.\n\nBecause Base can access so many databases, a basic knowledge of\
    \ SQL is always an advantage. Otherwise, access is limited very quickly to databases\
    \ that comprise a single table and use only the built-in search functions of Base.\n\
    \n## INFO\n\n- [1] LibreOffice Getting Started Guide: https://documentation.libreoffice.org/en/getting-started/getting-started-guide/\n\
    - [2] Base Handbook: https://documentation.libreoffice.org/en/documentation/base/\n\
    \n# IT Highlights at a Glance\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_44_0.png)\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_44_1.png)\n\nToo busy to wade through\
    \ press releases and chatty tech news sites? Let us deliver the most relevant\
    \ news, technical articles, and tool tips – straight to your Inbox.\n\n- • Linux\
    \ Update • ADMIN Update • ADMIN HPC\n\nKeep your finger on the pulse of the IT\
    \ industry.\n\n- ADMIN and HPC: bit.ly/HPC-ADMIN-Update\n- Linux Update: bit.ly/Linux-Update\n"
  mdcn: "\n## 入门指南\n### LibreOffice Base\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_0.png)\n\
    \n使用鼠标直接修改表单。在 *Data*（数据）选项卡中，选择 *Input required*（必须输入）| 无。如果未选择此项，则必须在保存之前声明一张图片。关闭\
    \ *Properties*（属性）对话框后，更改将生效。\n\n现在 *Ctrl-单击* *ID input*（ID 输入）字段，并通过上下文菜单中的 *Control*（控件）打开\
    \ *Properties dialog*（属性对话框）。选择 *General*（常规）| *Read-only*（只读）| 是。该字段也应具有唯一标识性，例如通过使用不同的配色方案。\n\
    \n要为 *Category/ID*（类别/ID）输入字段显示列表框，请 *Ctrl-单击*，然后右键单击并从上下文菜单中选择 *Replace with*（替换为）|\
    \ *List Box*（列表框）。在列表框的 *Properties dialog*（属性对话框）的 *Data*（数据）选项卡中，将 *Type of\
    \ list contents*（列表内容类型）更改为 *Sql*。单击 *List content*（列表内容）旁边的三点按钮（图 5）将启动 SQL 命令编辑器，在那里你可以定义列表字段的内容。\n\
    \n首先，在 *Add Table*（添加表）或 *Query*（查询）对话框的 *Tables*（表）部分 *Add the Category table*（添加类别表）。将出现一个新的\
    \ *Category*（类别）框，其中包含其字段列表。双击 *Category* 字段会将其转换为第一个查询字段（数据库术语中的字段 0）。双击 *ID*\
    \ 字段会使其成为第二个查询字段（图 6）。\n\n接下来，为 *Category* 字段单击 *Sort*（排序）| *ascending*（升序）。关闭并保存\
    \ SQL 命令对话框后，将在 *List content*（列表内容）下拉菜单中显示新的 SQL 查询。现在切换到 *General*（常规）| *Drop-down*（下拉）|\
    \ 是，以便列表框向下展开。在这里，你还可以更改显示的字段数量。\n\n*Right-clicking*（右键单击）表格控件字段（子表单）中的 *PlaceID*（位置ID）会打开一个上下文菜单，你可以在其中选择\
    \ *Replace with*（替换为）| *List Box*（列表框）。再次打开 *PlaceID* 上下文菜单，并从 *Column*（列）属性开始。与之前一样，列表内容应在\
    \ SQL 命令查询编辑器中创建，在那里你 *Add*（添加）*Place*（位置）表。现在，依次双击 *Room*（房间）、*Cupboard*（柜子）、*Rack*（货架）和\
    \ *ID*（ID）。若要进一步编辑查询，请单击 *Switch Design View On/Off*（切换设计视图开/关）图标以查看 SQL 代码（图\
    \ 7）：\n\n```sql\nSELECT \"Room\", \"Cupboard\", \"Rack\", \"ID\" FROM \"Place\"\
    \n```\n\n该命令将按所示顺序分别显示表的所有字段。然而，列表字段只能显示一个字段并保存另一个字段的值；因此，前三个字的内容必须组合起来：\n\n```sql\n\
    SELECT \"Room\" || \"Cupboard\" || \"Rack\", \"ID\" FROM \"Place\"\n```\n\n现在，*Room*、*Cupboard*\
    \ 和 *Rack* 字段按顺序显示在一个字段中。另一方面，*ID* 的值保存在表单中，这对于在列表框中显示来说并不是最优的。\n\n将 SQL 命令更改为\n\
    \n```sql\nSELECT \"Room\" || ' - ' || \"Cupboard\" || ' - ' || \"Rack\" AS \"\"\
    , \"ID\" FROM \"Place\" ORDER BY \"\"\n```\n\n使用带空格的破折号分隔 *Room*、*Cupboard* 和\
    \ *Rack* 字段，并使用 `AS` 语句分配别名，该别名用于对列表框的内容进行排序。在继续之前，请关闭并保存 SQL 命令编辑器和 *Properties*（属性）框。\n\
    \n对于最后的修改，在控件表中右键单击 *ArticleID*（文章ID）并选择上下文菜单中的 *Delete column*（删除列）。虽然表单现在已准备就绪，但仍需修改字段大小，你还可以更改\
    \ *CategoryID* 和 *PlaceID* 标签。\n\n在表单中导航、搜索数据记录等操作可以在屏幕底部的 *Navigation Bar*（导航栏）中进行（图\
    \ 8），一旦输入数据，该导航栏会自动显示。\n\n有时，在输入字段旁边单独使用一个导航栏也是可取的。\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_1.png)\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_2.png)\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_42_3.png)\n\
    \n要创建此导航栏，你需要再次打开表单进行编辑。首先单击主表单中的字段，然后单击左侧边栏底部的 *More Controls*（更多控件）图标。通过 Ctrl-单击新控件中的\
    \ *Navigation Bar*（导航栏），表单中会出现一个新的导航栏，其中包含与屏幕底部导航栏几乎相同的字段。\n\n## 搜索数据集\n\nBase\
    \ 本身内置了一些搜索功能。不幸的是，在使用表单时这些功能更难管理。为了改变这一点，你需要深入一点，这就需要具备 *SQL* 代码的基础知识。对于一般性帮助，你可以参考可下载的\
    \ Base 手册。\n\n首先，使用 *Tables | Create Table in Design View*（表 | 在设计视图中创建表）创建另一个表来保存搜索词，并添加字段：\n\
    \n- *ID* 作为 *Yes/No* [BOOLEAN]\n- *Search* 作为 *Text* [VARCHAR]\n\n右键单击 *ID* 字段使其成为主键，并以\
    \ *Search* 的名称保存该表。在表的第一行中插入 \"ID\" = *true*。此表应仅保存这一个数据集。\n\n打开 *Queries | Create\
    \ Query in SQL View*（查询 | 在 SQL 视图中创建查询），以便比在 *Design View*（设计视图）中更快地输入代码，并输入：\n\
    \n```sql\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE COALESCE\n(\n  (SELECT\
    \ \"Search\"\n   FROM \"Search\"\n   WHERE \"ID\" = TRUE\n  ), \"Article\"\n)\n\
    ```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_0.png)\n\n图 9：表单导航器显示了表单的所有元素。\n\
    \n*COALESCE* 函数检查 *Search*（搜索）是否为空；然而，如果为 *TRUE*，*Article* 和 *Article* 总是应该包含内容，并且\
    \ *Article* 应该始终与 *Article* 相同，该关键字现在显示所有 *Article* 表数据。如果在 *Search* 中输入一个单词，则只显示与输入值匹配的\
    \ *Article* 项。需要对此查询稍作改进，以便搜索条目的一部分也能显示结果：\n\n```sql\nSELECT * FROM \"Article\"\
    \nWHERE \"Article\" LIKE COALESCE\n( '%' ||\n  (SELECT \"Search\"\n   FROM \"\
    Search\"\n   WHERE \"ID\" = TRUE\n  ) || '%', \"Article\"\n)\n```\n\n要测试查询，请单击工具栏中的\
    \ *Run Query*（运行查询）图标或按 *F5*。将显示 *Article* 表中的所有数据集。最后一行在 *ID* 字段中显示 *AutoField*（自动字段）。\n\
    \n修改代码以在 *Search* 表中查找值为 *Search* 的条目，并将其与 *Article* 表中的 *Article* 字段进行比较：\n\n\
    ```sql\nSELECT * FROM \"Article\"\nWHERE \"Article\" LIKE\n(\n  SELECT \"Search\"\
    \n  FROM \"Search\"\n  WHERE \"ID\" = TRUE\n)\n```\n\n此时你可能不会看到任何值，因为 *Search*\
    \ 表中的 *Search* 字段内容为空。再次修改代码：\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_1.png)\n\
    \n图 10：仅循环遍历活动记录 – 无导航栏，无新行，...\n\n通过使用 *%*，搜索词的命中结果现在可以在词前后包含任意数量的字符。因此，一次输入可能会获得多个命中结果。唯一的缺点是它仍然区分大写字母和小写字母。以下查询现在允许输入\
    \ *Article* 字段中任意位置包含的文本，无论大小写如何：\n\n```sql\nSELECT * FROM \"Article\"\nWHERE\
    \ LOWER ( \"Article\" ) LIKE COALESCE\n( '%' ||\n  (\n    SELECT LOWER ( \"Search\"\
    \ )\n    FROM \"Search\"\n    WHERE \"ID\" = TRUE\n  ) || '%', \"Article\"\n)\n\
    ```\n\n现在将此查询保存为 *qrySearchArticle*，在表单下复制已创建的表单，粘贴副本作为名为 *ArticleSearch* 的新表单，并通过右键单击选择\
    \ *Edit*（编辑）来打开此新表单进行编辑。\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_43_2.png)\n\
    \n图 11：带有搜索功能的表单。在内容中包含 *Meter* 的情况下找到了九条记录。\n\n要在现有表单中添加 *Search*（搜索）输入区域，你需要打开\
    \ *Form Navigator*（表单导航器）（图 9）。在打开的对话框中，右键单击 *Forms*（表单）并选择 *New | Form*（新建 |\
    \ 表单）。然后将在 *MainForm* 旁边添加一个新表单。\n\n通过其上下文菜单打开此表单的属性。在 *Data*（数据）选项卡中，在 *Content*（内容）下拉菜单中选择\
    \ *Search*。选择 *Cycle | Active record*（循环 | 活动记录）尤为重要。图 10 中显示的其余设置确保始终编辑和更改相同的数据集。\n\
    \n接下来，选择 *MainForm* 中可用的一个表单字段并调出其 *Properties*（属性）对话框，并在 *Properties*（属性）| *General*（常规）|\
    \ *Action*（操作）| *Refresh form*（刷新表单）中设置。\n\n关闭新表单的 *Properties*（属性）对话框后，选择 *MainForm*。在\
    \ *Data*（数据）选项卡中，将 *Content type*（内容类型）选择为 *Query*（查询），将 *Content*（内容）选择为 *qrySearchArticle*。接下来，*Ctrl-单击*\
    \ 侧边栏中的 *Push Button*（按钮）图标。此按钮应出现在 *MainForm* 中（请检查 *Form Navigator*）。在按钮的 *Properties*（属性）对话框的\
    \ *General*（常规）选项卡中，选择 *Action*（操作）| *Refresh form*（刷新表单）。现在，每当你点击此按钮时，表单都会再次进行扫描。\n\
    \n在 *Form Navigator*（表单导航器）中，再次选择 *Search* 表的新表单，并通过选择 *Text Box*（文本框）图标并使用鼠标绘制一个框来创建输入区域。在此框的\
    \ *Properties*（属性）对话框的 *Data*（数据）选项卡中，将 *Data field*（数据字段）设置为 *Search*，将 *Input\
    \ required*（必须输入）设置为 *No*（否）。现在，当点击 *MainForm* 中的按钮时，此文本框的内容将自动保存（图 11）。\n\n如果你对表单满意且不希望进行任何设计更改，现在就可以保存它。\n\
    \n## 结论\n\n起初，创建内部 Firebird 数据库比在 Calc 中创建表花费的时间要多得多，但一旦数据库构建完成，数据输入比在电子表格中输入数据要准确且快速得多。另一个优势是可以生成报告。\n\
    \n除了 Base 内部数据库外，Base 还允许你连接到外部数据库（例如，MySQL/MariaDB、PostgreSQL、电子邮件地址簿等）。此时，Base\
    \ 仅访问表并提供图形用户界面。\n\n由于 Base 可以访问如此多的数据库，具备 SQL 基础知识总是很有优势的。否则，访问将很快局限于仅包含单个表且只使用\
    \ Base 内置搜索功能的数据库。\n\n## 信息\n\n- [1] LibreOffice 入门指南：https://documentation.libreoffice.org/en/getting-started/getting-started-guide/\n\
    - [2] Base 手册：https://documentation.libreoffice.org/en/documentation/base/\n\n\
