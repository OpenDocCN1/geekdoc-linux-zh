    \ end (in lines 35–36). (The @ keyword enables a Python feature that automatically\
    \ closes the opened file when you leave the with block.)\n\nAnd that’s it. With\
    \ some small changes, you can let the script evaluate more command-line arguments\
    \ and turn it into a universal search and replace tool. Create a for loop (like\
    \ in loggrep.py in Listing 2) to apply your changes to several files at once.\n\
    \n# ### DATA IN CALC SHEETS\n\nThe XML for a Calc sheet must follow different\
    \ rules than the XML for a Writer document: After all, Calc requires a strict\
    \ ordering of each sheet into columns and rows. Figure 7 shows a fragment of a\
    \ Calc file’s content.xml, which I have reformatted (line breaks and indentation)\
