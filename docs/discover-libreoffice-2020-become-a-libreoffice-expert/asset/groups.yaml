    \ work is split into four steps:\n\n```\n```python\n01  #!/usr/bin/env python\n\
    02\n03  from zipfile import ZipFile, ZIP_DEFLATED\n04  from sys import stdout,\
    \ argv    # command line arguments\n05  from xml.etree import ElementTree as et\n\
    06  from re import findall\n07\n08  filename,outputfilename = argv[1],argv[2]\n\
    09\n10  # Step 1: Read /content.xml inside zip file      # open zip file\n11 \
    \ inZipf = ZipFile(filename, 'r')\n12  content = inZipf.open(\"content.xml\",'r').read()\
    \  # access /content.xml\n13\n14  # Step 2: Build the XML namespace dictionary\n\
    15  ns = {}                                            # {} = empty dictionary\n\
    16  for namespace in findall('xmlns:.*=\".*\"', content):\n17      namespace =\
    \ namespace.split(\".\")[1]          # get rid of \"xmlns:\"\n18      nsurl =\
    \ namespace.split(\"=\")[1]      # cut \" in front/back\n19      nsurl = nsurl[1:-1]\
    \                # add to dictionary AND\n20      ns[namespace] = nsurl      \
    \        # register for ElementTree module\n21      et.register_namespace(namespace,nsurl)\n\
    22\n23  # Step 3: Access the XML tree\n24  root = et.fromstring(content)\n25 \
