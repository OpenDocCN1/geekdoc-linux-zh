    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_67_2.png)\n\n图 7：在最近的 LibreOffice 版本中，你可以在任何输入字体族的字段中添加代码片段，强制自动使用高级功能。在此示例中，Liberation\
    \ Sans 被设置为使用旧体数字和小号大写字母。\n\n你可以在任何指定字体的字段中通过直接在字体名称后输入小写的代码标签（中间不留空格，见图 7）来强制使用或关闭某项高级功能。例如，:smcp\
    \ 或 :smcp=on 都会自动将小写字母转换为小号大写字母。如果你想关闭小号大写字母的使用，请添加 :smcp=off。可以按顺序添加多个片段，例如 :liga:onum:cpss\
    \ 强制使用标准连字、旧体数字以及大写字母的字符间距。\n\n在某些情况下，只能使用长格式，因为你需要指定一个变量。例如，:frac=1 强制使用带斜杠分隔线的较小分数，而\
