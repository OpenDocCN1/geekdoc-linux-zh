    ## LibreOffice 社区


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_90_0.png)


    Kampabits 经理，“Kampabits 是一个成立于 2010 年的青年组织，它富有创意地利用 ICT 多媒体技术，致力于改善非正式定居点中弱势青年的生活。它还为残障人士创造安全空间，让他们在学习这些热门技能的同时自由表达自我。”


    Kampabits 还开展了一项“科技女性”项目，培训 15 名女性掌握高级编码技能，以便她们在六个月内具备就业能力。该项目专注于那些已具备计算机基础知识的女性。


    Emmanuel 在所有培训中均使用免费和开源软件，包括 LibreOffice、Gimp 以及各种 GNU/Linux 发行版。


    ## 感谢所有人


    正是得益于这个全球社区，LibreOffice 才能在每次版本发布中变得越来越好。如果没有他们，该软件将无法支持如此多的语言，也就无法走进全球各地的学校、政府、企业和家庭。欢迎大家加入社区——详情请参阅下一页！


    ## 2020 年的活动


    您可能已经注意到，我们之前介绍社区活动时，它们都发生在 2019 年。由于 COVID-19，线下活动寥寥无几。这让社区中的许多人感到颇为沮丧，因为他们


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_90_1.png)


    非常享受面对面交流以及在一起饮食聊天的时光。确实，原定于在德国纽伦堡举办的 LibreOffice 大会已改为线上举行。


    不过，这并非世界末日。线上活动也有其优势：任何人都可以轻松参与，而无需长途跋涉。Daniel A. Rodriguez 是一位阿根廷的 LibreOffice
    贡献者，也是 TDF 董事会成员，他谈到了在疫情初期举办的一次线上聚会：


    > “五月份，西班牙语 LibreOffice 社区通过 TDF 的 Jitsi 实例举办了一场线上活动，并在 YouTube 上进行了直播。活动于 UTC
    时间 17:00 开始，持续了近 4 小时。超过 35 人参与了活动，其中多位因在项目中的参与和协作而广受认可会员的存在使大家受益匪浅。来自墨西哥的 Celia
    Palacios 向我们介绍了文档团队的工作，而来自阿兹特克故地的 Mauricio Baeza 则谈到了使用 Python 编写宏的潜力。来自西班牙的 Xisco
    Fausil 解释了如何在开发阶段对软件进行质量控制，另一位西班牙人 Ísmael Fario 则介绍了数据透视表。最后，来自巴西的 Gustavo Pacheco
    谈到了如何成为文档基金会（The Document Foundation）的成员，并邀请所有人申请加入。”


    ## 信息


    - [1] 认证开发者：[https://www.documentfoundation.org/gethelp/developers/](https://www.documentfoundation.org/gethelp/developers/)

    - [2] 参与进来：[https://www.libreoffice.org/community/get-involved/](https://www.libreoffice.org/community/get-involved/)

    - [3] LibreOffice 在线：[https://www.libreoffice.org/download/libreoffice-online/](https://www.libreoffice.org/download/libreoffice-online/)


    ## 作者简介


    Mike Saunders 在文档基金会（The Document Foundation）负责市场营销和社区推广工作。他致力于宣传该软件，并吸引新的贡献者加入项目。


    ## 参与 LibreOffice 社区


    ### # 欢迎所有人


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_91_0.png)


    加入 LibreOffice 社区，协助改进软件。你不需要是程序员；有很多方式可以让你深入其中并提升技能！作者：Mike Saunders


    LibreOffice 是一款由社区驱动开发的软件，是非营利组织文档基金会（TDF）的一个项目。LibreOffice 由那些相信自由和开源软件原则，并愿意以非限制性方式与世界分享其工作成果的用户开发而成。这些原则的核心是四项基本自由以及
    TDF《未来十年宣言》[1] 中的准则，社区对此做出了承诺：


    - *通过免费向每个人提供办公生产力工具，消除社会中的数字鸿沟，使人们能够作为 21 世纪的完整公民参与社会*

    - *通过鼓励人们用母语翻译、记录、支持并推广我们的办公生产力工具，支持母语的保存*

    - *通过使用开放文档格式和开放标准，使办公生产力软件的用户能够保留其创建文档的知识产权*

    - *倡导开放、透明的同行评审软件开发流程，重视技术卓越性*


    同样，该宣言还拒绝了以下观点：


    - *单一编程语言对计算机桌面的逐渐主导，迫使所有人必须学习一门外语才能以电子方式表达自己*

    - *专有软件公司对文件格式的所有权——文档属于其创建者，而非软件供应商*

    - *封闭的软件开发流程，错误可能隐藏其中，低质量被所接受*


    ### 基本自由


    LibreOffice 社区认为，用户应该拥有运行、复制、分发、研究、修改和改进其所分发软件的自由。虽然 TDF 提供 LibreOffice 程序套件的免费下载，但自由软件首先关乎自由，而非价格。LibreOffice
    支持者为此类自由发起宣传，因为他们认为每个人都应享有这些权利。


    同样，该社区致力于消除数字鸿沟，使所有人成为完整公民，支持保存母语，并避免专有软件和格式锁定。LibreOffice 社区通过以下方式实现其目标 [2]：


    - 提供无限制的免费办公生产力工具访问权限


    ### 社区


    #### 参与进来


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_0.png)


    LibreOffice 全球社区——此处展示的是 2018 年在阿尔巴尼亚举行的 LibreOffice 大会——致力于推广自由软件和开放标准。


    - *鼓励用母语翻译、记录和维护 LibreOffice 软件*

    - *通过开放和透明的同行评审流程，积极推广并参与开放标准和自由软件的开发与创建*


    尽管 LibreOffice 社区的成员来自许多不同的背景，但他们都重视个人选择和透明度，这在实践中转化为更广泛的兼容性、更高的实用性，以及用户不被锁定在单一产品上的自由。他们相信，自由软件能够提供比专有替代品更好的质量、更高的可靠性、增强的安全性以及更大的灵活性。


    LibreOffice 背后的社区是该项目的心脏，如果没有它，项目将没有资源继续开发 LibreOffice 软件。每个个体带给社区的激情和动力促成了协作开发，其成果往往超出社区自身的预期。由于项目中存在数十种不同但至关重要的角色，欢迎大家加入工作，帮助让
    LibreOffice 被所有人知晓并易于获取。


    由 LibreOffice 社区成员制定的 TDF 章程指导着他们的工作方式，并鼓励新成员以惠及整个社区及自身的方式做出贡献。通过使用 copyleft 许可证，如
    GNU 宽通用公共许可证（LGPL）、Mozilla 公共许可证（MPL）和知识共享相同方式共享（CC BY-SA）许可证，社区承诺保护用户作为开发者和内容创作者的权利。


    ### 项目人员


    在展示如何参与 LibreOffice 社区之前，让我们快速了解一下 TDF 的各个不同“机构”。它们协同工作，以确保 LibreOffice 在持续开发中保持强劲。随着你更深入地参与该项目，你将以某种方式接触到它们。TDF
    机构包括：


    - 董事会（BoD）是 TDF 项目和团队的主要行政机构。董事会成员是法定的司法和额外司法代表。

    - 会员委员会（MC）管理会员申请和更新，并监督董事会选举。

    - 受托人委员会（成员）由所有积极参与 TDF 项目的人员组成。要获得成员认可，你需要符合 TDF 章程中定义的 criteria，并使用申请表申请会员资格。


    此外，还有一些实体，它们不是正式的 TDF 机构，但帮助董事会推进 TDF 的项目：


    - 工程指导委员会（ESC）就战略性问题提供技术指导，理论上由社区中最优秀的工程师组成。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_1.png)


    Lothar Becker 是 TDF 的董事会主席，TDF 是 LibreOffice 背后的非营利实体。


