    ## 快速入门


    LibreOffice Calc


    # 风格鲜明的电子表格


    # 形式与功能兼备


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_19_0.png)


    LibreOffice Calc 提供了 Excel 的功能，并附带更多优势。*作者：Bruce Byfield*


    **C**alc 是 LibreOffice 的电子表格模块。作为 Microsoft Excel 的对应产品，Calc 旨在与其保持高度的兼容性。每个 Calc
    工作表（图 1）都能处理 1,024 列和 1,048,576 行，对于大多数用途来说绰绰有余。如果你需要更多，或者发现电子表格在内存有限的机器上崩溃，可以考虑在
    LibreOffice Base 中创建数据库。


    如果你是完全的初学者，像 Calc 这样的电子表格或多或少是文本文档中表格的增强版本。实际上，在 LibreOffice Writer 中，表格也可以设置为使用一些简单的电子表格功能。电子表格是对文件的称呼，而工作表则是文件内的页面。在每个工作表中，列由大写字母指定，行由阿拉伯数字指定。因此，左上角的第一个单元格是
    A1，这个标识符可以在操作数据时调出其包含的信息。


    电子表格的强大之处在于用于显示和操作数据的一系列功能。这些功能包括组织列表过滤器、用于处理各种数据的完整函数集，以及杂项额外工具。如果你使用过 Excel，你很可能会很快熟悉
    Calc。两个电子表格应用程序中的函数及其名称都很相似，尽管有些函数位于不同的位置。也许最大的区别在于，Calc 像 LibreOffice Writer
    一样使用样式：单元格样式用于格式化任何电子表格，页面样式用于生成电子表格的纸质版本。一旦定义，这两类样式都能为你节省时间，让你能够专注于数据录入而不是格式化。


    # 规划电子表格


    电子表格有一种逐渐增长的特性，这可能就是它们在线上最常用的原因。然而，如果你花时间预先设计电子表格模板，就能更容易地找到你的数据。


    首先，设计一个通用的默认电子表格模板，使用个人或公司颜色和字体。使用该模板作为其他模板的基础，为每种你使用的电子表格类型各创建一个模板。通常，一个重要考量是每个电子表格中默认工作表的数量（*工具
    \| 选项 \| LibreOffice Calc \| 默认*）。例如，你可能会有为不同类别员工着色的工作表。你可能还希望为数据透视表（对现有数据的新视图）使用单独的工作表。


    大多数电子表格将属于两类之一：基于文本的列表和数字数据集合，或数据数组。列表是电子表格最简单的用途。它们包括待办


    Photo by Modestas Urbonas on Unsplash


    事项列表、地址集合、日历和项目日程。相比之下，数据数组由原始信息表格和帮助分析数据的函数组成，例如总和和平均值。数据数组的例子包括个人或公司财务或成绩单。有时，数据数组被用作教程，包含练习内容。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_20_0.png)


    图 1：Calc 是一款旨在与 Microsoft Excel 兼容的电子表格应用程序。


    列表和数据数组通常按列组织。在同一个工作表上将类似的信息分组，并留空间用于标签——标签是描述列或行中所含信息的标题。单元格格式化，例如边框和背景，可以帮助一眼区分不同类型的信息。例如，在老师的成绩单上，你可能会使用不同深浅的绿色来标记显示中位数和平均分的单元格。颜色越多，用户越容易在信息中导航——但过多的颜色编码可能变得复杂到失去优势。你可能想从草图近似布局开始，但务必为未来的增长留出空间。


    # 设计列表


    电子表格列表与文本文档中的表格作用大致相同。主要来说，它是一种使信息比按段落排列更易于查找的方式。字体、颜色和位置等格式帮助分组信息和区分信息类型。例如，在项目日程中，项目中的每个工作人员可能被分配不同的颜色。一旦每个工作人员知道他们的颜色，他们就可以跟踪自己的任务而忽略其他人的。项目日程还可能包括签字列，或者在每项任务完成时可以添加的颜色。由于列表通常提供简单信息，它通常使用很少的电子表格函数，尽管可以添加一些简单的函数，例如为预算目的计算工作时长的总和。


    图 2 展示了我在我 2016 年的书《Designing with LibreOffice》[1]中用作示例的旅行规划器。注意不同类型的信息如何被边框分组在一起，并且每个部分都有自己独立的标题。空白单元格用于进一步分隔信息。在左侧，摘要下方，不同的任务按执行顺序排列在摘要下方。电子表格的其余部分是每日行程。目的是制作一个可以打印出来，并在出现时添加手写补充的电子表格。


    # 设计数据数组


    数据数组是 Calc 真正发挥优势的地方。数据数组可以像列表一样进行格式化以组织信息。然而，与大多数列表不同，数据数组包含多个用于操作原始数据的函数（或公式，有时也称为）。Calc
    包含超过 450 个函数，许多函数与 MS Excel 中的名称相同，以便用户可以轻松切换到 Calc。一些 Calc 函数的输入变量在 Excel 中找不到，当包含这些函数的电子表格在
    Excel 中打开时，这些函数不会被使用。一个函数及其独特数据集的特定实例被称为公式。每个函数都有自己的一组输入变量。大多数变量是必需的，但有些是可选的。所有变量都可以从公式工具栏手动输入，该工具栏还包括一些最常用函数的列表。不过，大多数人更喜欢选择一个单元格来保存结果，然后通过“插入
    | 函数”添加函数，这会打开函数向导（图 3）。函数向导列出了所有变量，这些变量可以手动输入，或者有时通过拖放电子表格上的单元格输入。此外，函数向导预览结果，以便你能够在将错误函数插入文档之前修正变量。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_20_1.png)


    图 2：列表导向的电子表格。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_21_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_21_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_21_2.png)


    最大值和最小值。这些统计的输入是每个学生的总分，可以通过选择“总计”列中的数字来选择。通过使用函数向导，我可以快速利用这些函数，而无需记住单个函数的计算公式结构。例如，代替通过输入
    =SUM(E5:E5) 来找到学生总分，列出相关单元格的列和行范围，我只需通过鼠标拖动选择单元格。


    函数向导在浏览左侧窗格中的函数时也很有用。函数被安排到金融、逻辑和统计等类别中，你可以通过输入类别的首字母来显示单个类别。对于每个函数和变量，函数向导都包含简要说明。另一个来自《Designing
    with LibreOffice》的例子，图 4 展示了教师成绩册的一个摘录。上半部分是每个学生的每次作业成绩和课程总分（百分制）列表。评分标准在右侧的框选单元格中。更重要的是，一些基本统计量列在学生的成绩下方，由
    Average（平均值）、Median（中位数）等函数生成，


    # 使用 CALC 工具


    除了 Calc 工具，Calc 还包括一些其他工具，可用于列表和数据数组。这些工具分散在菜单的各个角落——主要在“工具”和“数据”中——但可以分为改变格式化的工具和工作与函数相关以使其更强大且更易于导航的工具。表
    1 和表 2 描述了一些最有用的 Calc 工具。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_21_3.png)


