  - "[PAGE 63]\n\n# GET PRODUCTIVE\n\nLibreOffice Macros\n\n# BASE DATABASES\n\nThe\
    \ Base application lets you build rather advanced databases for storing all kinds\
    \ of data, and LibreOffice Basic macros can help you integrate databases with\
    \ other LibreOffice applications. To see how this works in practice, I'll create\
    \ a simple Base database for storing text snippets and then create a macro that\
    \ saves text selections from the current Writer document in the database.\n\n\
    The first order of business is to create a Base database that has a single snippets\
    \ table comprising two fields: *id* (an INTEGER field that acts as the primary\
    \ key), and *snippet* (a VARCHAR text field for storing text snippets). When creating\
    \ the database, tick the Yes, register the database for me check-box to register\
    \ the database as a data source in LibreOffice. Once the database is ready to\
    \ go, you can start working on the macro (Listing 7).\n\nTo establish a connection\
    \ to the database, the macro uses the ConnectToDatabase function (line 5). This\
    \ approach is more flexible because it allows you to establish a connection from\
    \ any other macro when needed. The function (lines 16-30) includes a simple error-handling\
    \ mechanism (line 19) that aborts the macro and displays an error message when\
    \ the macro fails to establish a connection to the database (lines 28-29).\n\n\
    The macro itself performs several actions. First, it initializes the current document\
    \ and obtains the selection. It then establishes a connection to the database\
    \ registered in LibreOffice under the snippets name. Next, the macro uses the\
    \ Join() and Split() routines to sanitize the text selection by properly escaping\
    \ the single quote (') characters, which is necessary to produce valid SQL queries.\
    \ The macro then constructs a SQL query that inserts the text snippet into the\
    \ snippets table.\n\n# LISTING 6: HTML Formatting\n\n```\n...  \n04 MarkupHeadingsFunc(\"\
    Heading 1\", \"<H1>\", \"</H1>\")  \n05 MarkupHeadingsFunc(\"Heading 2\", \"<H2>\"\
    , \"</H2>\")  \n06 MarkupHeadingsFunc(\"Heading 3\", \"<H3>\", \"</H3>\")  \n\
    07 MarkupTextFunc(\"CharWeight\", com.sun.star.awt.FontWeight.BOLD, \"<B>\",\"\
    </B>\")  \n08 MarkupTextFunc(\"CharPosture\", com.sun.star.awt.FontStyle.ITALIC,\
    \ \"<I>\",\"</I>\")  \n...  \n63 Portion.String = \"<A HREF=\"\"\"\" + Portion.HyperlinkURL\
    \ +\"\"\"\"\"\" +  \n                   Portion.String +\"</A>\"  \n...\n```\n\
    \n# LISTING 7: Database Table Macro\n\n```\n01 Sub InsertSnippet()  \n02 Dim Library\
    \ As Object  \n03 ThisDoc=ThisComponent  \n04 TextSnippet=ThisDoc.getCurrentController().getSelection().getByIndex(0).getString()\
    \  \n05 Database=ConnectToDatabase(\"snippets\")  \n06 TextSnippetSanitized =\
    \ Join(Split(TextSnippet, \"'\",\" ''),\"\"\"\")  \n07 SQLQuery=\"INSERT INTO\
    \ \"snippets\" \" + \"(\"snippet\") VALUES \"  \n08 + \"(\"'\" + TextSnippetSanitized\
    \ + \"')\"  \n09 SQLStatement=Database.createStatement()  \n10 Result=SQLStatement.executeQuery\
    \ (SQLQuery)  \n11 Database.close  \n12 Database.dispose()  \n13 MsgBox (\"Text\
    \ snippet has been saved.\",64,\"Result\")  \n14 End Sub  \n15  \n16 Function\
    \ ConnectToDatabase(DBName As String) As Object  \n17 Dim DatabaseOpt() as new\
    \ com.sun.star.beans.PropertyValue  \n18 DBContext=createUnoService(\"com.sun.star.sdb.DatabaseContext\"\
    )  \n19 On Error GoTo ErrEnd1:  \n20 DataSource=DBCttext.getByName (DBName)  \n\
    21 ConnectToDatabase=DataSource.getConnection (\"\",\"\")  \n22 DatabaseFile =\
    \ DataSource.DatabaseDocument  \n23 DatabasePath = DatabaseFile.URL  \n24 DatabaseOpt(0).Name\
    \ = \"Hidden\"  \n25 DatabaseOpt(0).Value = True  \n26 DatabaseFile = StarDesktop.loadComponentFromURL(DatabasePath,\
    \ \"_blank\",0, DatabaseOpt())  \n27 Exit Function  \n28 ErrEnd1:  \n29 MsgBox(\"\
    Failed to establish a database connection.\",16, \"Error\"):End  \n30 End Function\n\
    ```\n\n# FINAL WORD\n\nThese examples are just a few of the things that you can\
    \ do using LibreOffice Basic. Even these relatively simple macros can have several\
    \ building blocks you can easily reuse in your own scripts. Of course, the coding\
    \ fun doesn't have to stop here. Although LibreOffice Basic is not as flexible\
    \ and powerful as many other popular programming languages, it can handle practically\
    \ any LibreOffice-related task you throw at it. So once you've mastered its basics,\
    \ you can unleash the full potential of the LibreOffice productivity suite. ■■■\n\
    \n# INFO\n\n+   * [1] **LibreOffice Shell function:** https://help.libreoffice.org/7.0/en-US/text/basic/shared/03130500.html\n\
    +   * [2] **Amazon S3:** https://aws.amazon.com/s3/\n+   * [3] **AWS Perl script\
    \ on GitHub:** https://github.com/timkay/aws"
