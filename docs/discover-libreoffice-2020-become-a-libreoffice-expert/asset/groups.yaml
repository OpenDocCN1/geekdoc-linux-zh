    ## LibreOffice 模板


    路径列在 `工具 | 选项 | 路径` 中。默认情况下，这意味着你主目录中的模板，尽管路径也可能包括系统上所有用户可用的模板库。


    模板管理器顶部有三种方式可定位已注册的模板：搜索框、LibreOffice 模块过滤器以及类别过滤器。窗口底部是用于管理编辑窗口视图以及导入和导出文件的工具。若要使用特定模板，请右键单击它。从右键菜单中，你可以基于所选模板开始新文档，将所选模板设置为其
    LibreOffice 模块的默认模板，或者打开模板进行编辑。如果你正在编辑，可以使用常规的 `文件 | 保存` 对话框，因为该模板已经注册。


    你无法删除通过扩展或针对整个系统安装的 LibreOffice 模板，尽管你可以从 `工具 | 扩展管理器` 中删除该扩展。但是，从编辑窗口创建的模板可以删除——但要小心，因为模板管理器不包含确认对话框。在模板管理器中，选择要删除的模板，然后点击删除按钮。


    ### 规避模板限制


    多年来，Microsoft Word 以允许向文档应用多个模板而闻名。“这种情况往往导致无法恢复的文件损坏。当编写 StarOffice（LibreOffice
    的第一个前身）时，为了避免此类问题，使得混合模板变得不可能。唯一的麻烦是，用户仍然需要一种方便的方法来修改模板及其关联文件。


    修改模板及其基于该模板的文档最方便的方法是通过在模板管理器中右键单击模板来编辑它。保存修订后的模板后，下次打开关联文件时，你将有机会对其进行升级（图 4）。如果你选择升级，模板与文档之间的关联将继续，对模板的进一步修改将触发升级对话框。然而，如果你不升级文档，它与模板的链接将被切断——尽管有些令人困惑的是，模板仍会列在
    `文件 | 属性 | 常规` 中。你有时会发现一个声称允许你更改模板的扩展，但像所有扩展一样，使用此类工具的风险由你自己承担。考虑到 Microsoft Word
    多年来存在的问题，你最好避免使用此类工具。


    重新将文档附加到模板的一种方法是使用模板打开一个新文档，然后将未附加的文件复制并粘贴到其中。但请注意，使用粘贴而不是选择性粘贴。在某些情况下，可能的解决方案是设计一个新模板，仔细使用相同的样式名称，然后覆盖原始模板名称。新模板将被视为原始模板的修订版，因此当每个关联文件打开时都可以更新。


    临时解决方案是使用主文档。过去，主文档用于将长文件分割成小到足以在有限内存下处理的片段。如今，它们仍被用于允许多个人同时在一个文档上工作。然而，这里重要的是，主文档可以使用与其任何组件文件不同的模板——即使只涉及一个文件。要利用此功能，请使用修订后的模板启动新文档，然后选择
    `文件 | 发送 | 主文档`。然后打开主文档。从右键菜单中，选择 `插入 | 文件` 以从文件管理器添加文档，并选择 `更新 | 全部` 以将主文档的格式应用于该文档。关闭主文档而不保存，你仍然能够以原始格式打开该文档。如果你决定保留主文档的格式，请从右键菜单中选择
    `编辑` 以在编辑窗口中打开文档，然后使用主文档的模板保存它。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_57_1.png)


    如果你对 Microsoft Word 过去的版本有所了解，你可能会觉得将文件托付给主文档的想法令人惊恐，因为据说那些主文档要么已损坏，要么即将损坏。但虽然主文档更强大，并且有时会崩溃，但它们不应破坏其组件文件。尽管如此，为了安全起见，请确保你拥有最新的备份。


    如果你不介意忽略或丢失文档与其模板之间的连接，你可以部分地使用*编辑 | 选择性粘贴 | 无格式文本*来重新格式化从其他文档选中的文本。使用此命令时，原始格式下的文本将使用其所在段落或字符样式的格式插入。但是，图像或表格等对象将被丢弃，必须使用*编辑
    | 粘贴*单独复制和粘贴。


    类似地，你可以使用*样式和格式 | 加载样式*从另一个文档导入样式。此选项允许你选择要上传的文件和样式类别：*文本*（段落和字符）、*编号*、*框架*和*页面*。为了达到最佳效果，使用与文件中相同名称的导入样式，并选中*覆盖*复选框（图
    5）。


    ### 最佳实践


    尽管在必要时你可以规避模板的限制，请记住这些限制旨在保护你的文档免受损害。通常，以下技术应帮助你高效地使用模板且毫无困难：


    - 尽可能避免将文档与其模板分离。除非文档只使用一次且其维护不重要，否则不要尝试分离文档。

    - 仅在模板上更改格式。

    - 在模板上做出所有格式更改。然后将修订后的模板应用于文档。

    - 在模板中做出更改后立即将其应用于文档。这样，你就不必记住更改了什么，也不必怀疑下次打开文档时是否不小心做了更改。


    设计一个模板可能需要几个小时。也许在使用模板一两次后，你会想要做一些调整。然而，一旦模板能做到你想要的，它可以为你节省数小时，并多年来保持有用。约束自己，与模板系统合作，而不是追求短期便利，模板可以是你在
    LibreOffice 中最有价值的工具之一。 ■■


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_58_0.png)


    图 5：从模板加载样式的效果类似于切换模板，而无需实际执行此操作。


