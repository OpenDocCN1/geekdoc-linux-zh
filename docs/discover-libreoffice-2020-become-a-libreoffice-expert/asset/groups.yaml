    ## 提升生产力

    ### 开放文档格式

    #### 开放标准确保文档在不同应用程序和版本之间保持兼容


    ## 保持开放


    开放文档格式标准是 LibreOffice 取得成功的重要原因。*作者：Italo Vignoli 和 Joe Casad*


    开放文档格式 (ODF) 是 LibreOffice 文字处理文件、电子表格、图表和演示文稿所使用的原生格式。ODF 是一种为办公应用程序开发的开放格式标准。ODF
    由组织“结构化信息标准促进组织” (OASIS) 联盟的技术委员会 (TC) 于 2005 年发布，并于 2006 年作为 ISO/IEC 26300:2006
    被批准为 ISO/IEC 国际标准。


    在 ODF 开发时期，最流行的办公文档格式是 MS Office 格式集。当时，MS 格式是封闭且专有的，但由于这些格式非常普遍，它们成为了保存、共享和传输文档文件的准标准。（参见标题为“标准与准标准”的文本框。）这些专有文件格式的广泛使用增强了微软在市场上的影响力，使其能够主导市场并淘汰竞争对手。


    开放文档格式演变自 OpenOffice.org 办公套件的 XML 规范，该套件是 LibreOffice 的前身。OpenOffice 的开发者希望拥有一种自由开放的办公格式，以与微软的文件格式竞争。自那以后，ODF
    已在全世界范围内作为存储和传输文档数据的免费替代方案而广受欢迎。法律问题和来自其他工具的竞争，最终促使微软对其曾经隐藏的格式引入更多的开放性。微软 Office
    Open XML 格式 (OOXML 或 MOX) 具有足够的开放性，可以查看并编写程序，但微软继续保留对该标准的一定控制权。


    另一方面，开放文档格式独立于 LibreOffice 或其他任何软件项目。开放标准流程意味着除了 LibreOffice 之外，ODF 现在已得到数十种其他办公工具的支持。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_49_0.png)


    ### 它是什么？


    文档格式描述了保存在文档文件中的数据结构的描述。现代办公文档内部的数据远不止字母和数字。文档必须存储有关字体、字符标签、段落标签和分页的信息，以及页眉和页脚、脚注、目录和修订跟踪。该格式还记录有关文档加密、数字签名和宏的信息。此外，该格式必须具有弹性，因为每个文件将被不同的应用程序多次读取和编辑，包括未参与创建该文件的应用程序。在过程结束时，文件必须保持其完整性和特征，并且——最重要的是——保证内容独立于应用程序而得以保存。


    ODF 不是单一格式，而是办公生产力套件所需的各种文件类型的格式集合。表 1 列出了 ODF 文件类型和文件扩展名。


    ### ODF 简史


    关于 ODF 标准的第一次会议于 2002 年 12 月 16 日举行。ODF 1.0 规范于 2005 年 5 月 1 日发布，并于 2005 年 11
    月 16 日在公共可用规范 (PAS) 下提交给 ISO/IEC 联合技术委员会 1 (JTC1)。经过六个月的审查期，2006 年 5 月 3 日，OpenDocument
    在 JTC1 (ISO/IEC JTC1/SC34) 中一致通过为期六个月的国际草案标准 (DIS) 投票，参与范围广泛。2008 年，OpenDocument
    获得 ISO/IEC JTC1/SC34 的批准，以 ISO/IEC 26300:2006 的名称作为 ISO 和 IEC 国际标准发布。2015 年 6
    月 17 日批准的 ODF 1.2（ISO/IEC 26300:2015）增加了无障碍功能、基于 RDF 的元数据、基于 OpenFormula 的电子表格公式描述、数字签名支持以及一些由公众建议的功能。开放文档格式
    1.3 于 2020 年 1 月 21 日被批准为 OASIS 委员会规范，从而为未来实施 ODF 1.3 标准铺平了道路，该标准将包括对文档安全的改进。


    ### ODF 内部


    ODF 文件通常存储在 ZIP 容器中，并以此形式分发，其中包括多个 XML 文件和相关二进制内容，如图像或其他媒体。每个 ODF 文件包含四个关键的嵌入式
    XML 文件：**mimetype**，ZIP 容器的内容表；**meta.xml**，包含文档级元数据；**styles.xml**，包含文档的样式定义；以及
    **content.xml**，包含文档的所有结构化内容。ODF 提供了一个灵活的容器，可以嵌入几乎任何现有的数字对象，并允许其在办公文档中使用。


    如果你想看看 ODF 文件的真实样子，可以从一个 LibreOffice Writer 文档开始，将文件名末尾的 .odt 扩展名更改为 .zip。然后使用
    ZIP 归档工具查看容器内部（图 1）。


    ### ODF 的优势


    与 ODF 一起使用的开放 XML 格式意味着软件供应商可以开发按设计具备互操作性 的应用程序。像 ODF 这样的基于开放 XML 的格式也允许比旧的二进制和准标准格式更严格的安全检查。由于其优势，ODF
    已被多个政府选为公共行政部门内文件交换的标准。英国、荷兰、法国、瑞典和台湾在公共领域采用 ODF 方面走在前列，其他政府也在探索 ODF。


    ### ODF 的未来


    在大多数文档以数字格式交换的世界里，开放标准应该是学校和所有教育机构的优先事项。政府需要采取更主动的角色，在教育领域和公共领域推广开放标准。自由软件组织正在尽最大努力填补这一空白，但开放标准的事业需要积极的倡导。文档基金会已重新启动了
    ODF 采用技术委员会（图 2），并得到其他自由软件基金会项目、公司和公共管理机构的支。对开放标准的持续投资将有助于保护用户和开发人员免受与封闭格式相关的安全、互操作性和效率问题。■■■


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_51_1.png)


    ### 标准与准标准


    当软件被迫将其格式适应于一个不基于开放标准的占主导地位的产品时，主导厂商可以利用这种权力地位来影响市场。通常，占主导地位的产品会成为一种事实上的准标准，它从未经过审查或批准，仅仅是由于市场出于必要而采用。主导产品中的任何缺陷都会反映到整个行业中。例如，40
    年前的“闰年 bug”，从 Visi-Calc 和 Lotus 1-2-3 继承而来并传递给 Excel，导致市场领先的电子表格错误地将 1900 年表示为闰年，这可能会导致计算天数或测量时间范围的应用程序出现错误。其他办公套件的开发者不得不复制该
    bug 以确保持兼容性。


    据供应商称，即使在新版本发布中，这种错误状态也必须维持，因为修复它会导致太多问题。因此，建议用户保留存在错误的电子表格，因为供应商不顾已支付软件许可证用户的需要，而保护其商业利益。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_50_0.png)


    **表 1：ODF 文件类型和扩展名**


    | 文件类型 | 扩展名 |

    | :--- | :--- |

    | 文本 | .odt |

    | 电子表格 | .ods |

    | 演示文稿 | .odp |

    | 绘图 | .odg |

    | 图表 | .odc |

    | 公式 | .odf |

    | 图像 | .odi |

    | 数据库 | .odb |


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_51_0.png)


    > **图 1：** 要查看 ODF 文件的内容，请给文件名添加 .zip 扩展名，并使用 ZIP 归档工具打开它。


    > **图 2：** OASIS ODF 技术委员会为考虑采用基于 ODF 工具的组织提供信息。


