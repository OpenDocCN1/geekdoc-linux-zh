    # GET PRODUCTIVE


    ## Hidden Gems of LibreOffice


    Layout | Default. As we speak, the LibreOffice design team is working on updates
    and extensions to the NotebookBar, and it may even become a standard option (i.e.,
    not just experimental) in an upcoming version of the office suite. If you''re
    a big fan of the traditional GUI and the NotebookBar doesn''t float your boat,
    worry not – there are no plans to remove the standard toolbar layout. For more
    information on the NotebookBar, including a roadmap for upcoming releases, see
    the TDF Wiki [4].


    ### COMMAND-LINE TRICKS


    You probably start LibreOffice via your desktop environment or window manager,
    clicking a button to start the suite as a whole or one of its modules (e.g., Writer
    or Calc). But you can run it from the command line as well with some useful extra
    options. First of all, the exact command you will use will depend on your distro
    and how you installed LibreOffice. If you''re using your distro''s own packages,
    you can usually start it with `soffice` (referring to StarOffice), `ooffice`,
    or `libreoffice`. However, if you''ve installed using the packages on LibreOffice''s
    own website, you''ll need to add the version number, such as `libreoffice5.3`.


    To start the suite with Writer being displayed immediately (rather than the Start
    Center), use:


    ```

    soffice --writer

    ```


    For Calc, use `--calc`; for Impress, use `--impress`. These parameters are especially
    useful if you''re creating new launcher buttons in your desktop or window manager.
    For Impress, it''s possible to launch the suite and go straight into a presentation,
    without initially displaying the user interface, like so:


    ```

    soffice --show filename.odp

    ```


    This will switch to full-screen mode immediately, and when the presentation ends,
    LibreOffice will close. This feature is handy if you give a lot of presentations,
    in that you can link them to launchers in your desktop or window and have them
    shown seamlessly in just a couple of clicks (without having to fiddle around in
    the GUI for a few seconds). Another related parameter is `--view`, which shows
    a document in read-only mode – so no editing is allowed.


    If you''ve been unlucky and had LibreOffice crash on you, the next time it''s
    started, it will offer to (try to) recover lost data. You can keep this from happening
    by passing the `--norestore` option. Similarly, if you''re having major problems
    even starting LibreOffice (e.g., due to an issue with extensions, hardware acceleration,
    or your user profile) then you can activate the suite''s safe mode using `--safe-mode`
    or find it in the Help menu. This pops up a dialog box (see Figure 4) from which
    you can disable certain options or even reset to "factory settings" (i.e., like
    a completely fresh installation).


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_83_0.png)


    If you want to print a bunch of files without tediously having to open them all
    up and click Print for each one, do this:


    ```

    soffice -p doc1.odt doc2.odt

    ```


    Note the single dash before `p` here. Supply as many documents as you want; they
    will all be sent to the default printer. If you have multiple printers and want
    to specify one, use the `--pt` option followed by the name of the printer, and
    then the document(s) you want to print.


    One of the biggest time-savers when using LibreOffice from the command line is
    batch conversion of documents. Consider this, for example:


    ```

    soffice --convert-to pdf *.odt

    ```


    That generates PDF versions of all Open Document Format Text (ODT) files in the
    current directory. If you have a bunch of Microsoft Word documents and want to
    convert them to LibreOffice''s native format, use this:


    ```

    soffice --convert-to odt *.docx

    ```


    Now, LibreOffice includes import and export filters for a huge range of file formats,
    and you can use many of these in your batch conversion jobs. Unfortunately, however,
    the documentation listing these formats is lacking – so you have to look in the
    right places. If you want to convert an ODF document created by LibreOffice Writer
    into Microsoft Word 97 format, use the following command:


    ```

    soffice --convert-to doc:"MS Word 97" file.odt

    ```


    But how do you know to use this exact command? The trick is to look at the LibreOffice
    source code tree, and specifically the list of file format filters [5]. On that
    web page, you''ll see a file called `MS_Word_97.xcu` – so you know it has a filter
    for Word 97 files. If you click it, you can see this line toward the top of the
    file, following the first block of comments:


    ```

    <node oor:name="MS Word 97" oor:op="replace">

    ```


    This tells you that “MS Word 97” is the name we should use when applying the filter.
    (It’s also the same as the filename, but without underscores - but it’s always
    worth checking the content of the filter file as well.)


    With this trick, supplying the document extension followed by the filter name
    in quotes, you have access to a wide range of file formats. If you''re working
    with large collections of legacy documents and need to shift them from one format
    to another, this command can be a godsend. Yes, it’s a bit fiddly having to poke
    into the LibreOffice source code to explore this, but it works. And, if you want
    to contribute back to the suite, an effort to document this would be very welcome
    by the development team!


    - A new Writer Outline folding mode has been added. This adds a button next to
    every heading in your document, which you can click to show/hide the following
    section. This makes it easier to work with large documents.

    - A Styles Inspector has been implemented, for displaying all the attributes of
    Paragraph Styles, Character Styles and manually formatted (direct formatting)
    properties.

    - In Impress, new physics based animation capabilities and new animation effect
    presets are included: namely Fall Simulated, Shoot right/left and return, Fall
    and fade out. Keep an eye on the wiki [6] for the latest details on changes and
    improvements! Also, check out the “LibreOffice Online” box for information on
    a browser-enabled version.


    ### LIBREOFFICE ONLINE


    Something else worth keeping an eye on is LibreOffice Online (see Figure 5). As
    the name suggests, this is a version of the suite that can run inside a web browser,
    with the content being served over the network. LibreOffice Online has been in
    development for a few years, but has recently made major strides forward thanks
    to Collabora, which specializes in long-term supported versions of the suite (e.g.,
    for government and enterprise usage).


    Currently, LibreOffice Online looks and feels very much like the desktop version
    of the suite, but not every single menu item or feature is available - it''s a
    bit trimmed-down in some respects.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_84_0.png)


    But it''s making rapid progress, largely because of Collabora. Because it uses
    the same underlying document layout engine as desktop LibreOffice, Open Document
    Format (ODF) files should be displayed identically when you''re switching between
    the browser and native app.


    LibreOffice Online can be integrated with Nextcloud for a fully FOSS document
    sharing and collaboration system. It still needs some work, especially in terms
    of performance, but it''s coming on well - you can get access to a demo on Collabora''s
    website [7]. Note that the Document Foundation has no plans to provide hosted
    versions of LibreOffice Online, because it would require a vast amount of resources
    [4]. Uptake was quick. Instead, the software is available for third parties to
    install and run on servers.


    ### COMING UP IN LIBREOFFICE 7.1


    The LibreOffice community is beavering away on the next release, 7.1, which is
    due to arrive in early February 2021. Various new features are being developed,
    including (but not limited to):


    ### INFO


    - [1] **LibreOffice design community:** http://www.libreoffice.org/community/design/

    - [2] **MUFFIN:** http://blog.documentfoundation.org/blog/2016/12/21/the-document-foundation-announces-the-muffin-a-new-tasty-user-interface-concept-for-libreoffice/

    - [3] The restrictions of toolbars: https://design.blog.documentfoundation.org/2016/12/21/evolving

    - [4] **TDF Wiki:** https://wiki.documentfoundation.org/Development/NotebookBar

    - [5] **File format filters:** https://cgit.freedesktop.org/libreoffice/core/tree/filter/source/config/fragments/filters

    - [6] **LibreOffice Release Notes:** https://wiki.documentfoundation.org/ReleaseNotes/7.1

    - [7] **Collabora demo:** https://www.collaboraoffice.com/collabora_online_demo/

