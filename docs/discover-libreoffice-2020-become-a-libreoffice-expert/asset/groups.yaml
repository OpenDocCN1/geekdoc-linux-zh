    # 创建数据库、查询和表单


    ## 数据大师


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_39_0.png)


    我们将向您展示如何在 LibreOffice Base 中设置数据库，并使用嵌入在表单中的 SQL 查询进行搜索。


    作者：Robert Großkopf、Kerstin Großkopf 和 Joe Casad


    **B**ase 是 LibreOffice 套件中的关系型数据库。数据库是一种工具，可将数据组织成结构化且易于访问的形式。您可能在想：“我以为这正是 LibreOffice
    Calc 电子表格所做的。”如果是这样，您的想法是正确的。数据库和电子表格都以结构化形式存储数据。对于某些类型的问题（例如财务台账），电子表格更为实用。另一方面，数据库专为轻松搜索和数据录入而设计，并且更易于扩展到更大的数据集。


    数据库适用于用户拥有具有相似属性的离散数据对象或记录集合的情况。经典的例子是图书馆卡片目录——一系列具有相似字段集合的相似项目，显示标题、作者、目录号以及书籍的描述。


    Base 提供了创建和管理数据库的易用用户界面。Base 6.1 版正在过渡到 Firebird 数据库引擎。Base 的早期版本使用 HSQL 引擎。您还可以使用
    Base 连接多种不同格式的现有数据库文件。根据 LibreOffice 项目的说法，“LibreOffice Base 原生支持一些平面文件数据库格式，例如
    dBASE 格式。您也可以使用 LibreOffice Base 连接外部关系型数据库，例如 MySQL 或 Oracle 的数据库……”


    Base 用户界面支持多种向导和设计辅助工具，使创建数据库或构建向数据库输入数据的表单变得容易。当您首次启动 Base 时，创建数据库向导会询问您是否想要创建新数据库。图
    1 显示了 Base 主窗口。左侧的图标使创建表、查询、表单和报告变得容易。


    数据库从设计开始。数据库设计包括许多考虑因素，根据数据的性质，这可能是一项复杂的任务。为了本教程的目的，为了在可用空间内最大化信息量，我将描述典型的数据库场景，并带您走一遍设计和构建数据库的步骤，然后设置表单和查询。有关使用
    Base 的更多信息，请参见 LibreOffice 入门指南 [1] 和 Base 手册 [2]。


    ### 设计数据库


    本文中的示例是一个用于存储公司设备清单的简单数据库。表 1 显示了基本的数据库字段。*Article*（物品）是对对象的描述。数据库还包含有关对象所在房间的信息，对象存储的架子或柜子编号，以及对象的类别、该位置的对象数量以及对象数字图像的
    URL。


    | 表 1：数据库字段 | | |

    | :--- | :--- | :--- |

    | **字段名称** | **字段类型** | **描述** |

    | Article | Text [VARCHAR] | 对象描述 |

    | Image | Text [VARCHAR] | 通过其 URL 链接到数据库的对象图像 |

    | Room | Text [VARCHAR] | 房间名称 |

    | Cupboard | Small Integer [SMALLINT] | 柜子编号 |

    | Rack | Small Integer [SMALLINT] | 架子编号 |

    | Number_Needed | Small integer [SMALLINT] | 所需对象的数量 |

    | Category | Text [VARCHAR] | 物品类型（例如，电子产品、光学仪器等） |


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_40_0.png)


    表 1 中的数据都可以驻留在一个表中，但是，如果某些字段多次出现且具有相同的数据，通常将重复出现的数据拆分为单独的表并通过唯一 *ID* 字段（被指定为主键）连接到主表会更有效率（表
    2）。


    一个简单的库存数据库可以使用以下三个表编制：每个 *Article*（物品）最多分配一个 *Category*（类别）和一个 *Place*（位置）（*Room*（房间）、*Cupboard*（柜子）和
    *Rack*（架子））。用数据库术语来说，这被称为多对一 (n:1) 关系，只要某个事物仅被分配一次就足够了。然而，对于本示例数据库，每个物品可以有多个存储选项，*反之亦然*
    – 即多对多 (n:m) 关系。为了确保这种连接，附加表从 *Article* 的 *ID* 和 *Place* 的 *ID*（均为主键）创建一个新的 *ID*，并将
    *Number_Needed* 从 *Article* 表移过来（图 2）。


    | 表 2：数据库表 | | |

    | :--- | :--- | :--- |

    | Article ID | Category ID | Place ID |

    | Article | Category | Room |

    | Image | | Cupboard |

    | Number_Needed | | Rack |


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_40_1.png)


    ### 创建数据库


    现在，在一个内部 Firebird 数据库中逐个创建这些表：


    -   在 LibreOffice 中通过 *文件* | *新建* | *数据库* 启动数据库向导。

    -   选择 *创建新数据库* 单选按钮，并从下拉菜单中选择 *Firebird 嵌入式*。

    -   点击 *完成* 保存一个不需要注册的数据库文件。命名并保存文件后，将打开一个多表窗口；从表部分开始，在任务窗格中，选择 *在设计视图中创建表*。（要获取此功能，您需要
    Java。前往 *工具* | *选项* | *高级* 查看系统上存在的 Java 运行时环境并选择其中一个。）


    应打开一个空白数据库表，您可以在字段名称列中输入字段名称，在字段类型列中输入字段类型。


    所有 *ID* 字段以及与 *ID* 字段连接的所有字段的字段类型应为 *Integer*（整数）。对于每个 *ID*，在字段属性部分将 *AutoValue*（自动值）设置为
    *Yes*（是）（图 3）；这样该字段将自动递增并被设置为表的主键。为此，用左键单击标记第一个主键，按住“Shift”键并标记下一个。


    对于 *Article*（物品）字段，在字段属性下将 *Entry Required*（必填项）设置为 *Yes*（是）。使用其名称保存每个表（例如，*Article*、*Category*
    或 *Place*）。在建立多对多关系的 rel_Article_Place 表中，您需要创建两个主键（见图 2）。


    保存所有表后，打开 *工具 > 关系*，并通过选择和拖动从主键 (*ID*) 到外键来创建连接，如图 2 所示。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_41_0.png)


    *图 3：自动值设置为 Yes 的整数字段自动成为主键。*


    ### 数据录入表单


    直接向表中输入数据在 *Category*（类别）这样的表中工作得相当好，除了自动编号的 *ID* 外只有一个字段。在 *Place*（位置）表中，所有房间、柜子和架子也可以直接填写。另一方面，*Article*（物品）和
    rel_Article_Place 表更难填写，因为两个表都有字段的主键被设置为另一表中的外键。因此，这两个表都是输入表单的良好候选对象。


    要创建表单，点击侧边栏中的 *表单* 并选择 *使用向导创建表单*。带有侧边栏的窗口显示创建表单的八个步骤。


    1.  **字段选择。** 向导打开时，主向导窗口中的下拉菜单中已经选择了 Article 表。所有字段都应显示在主表单中，因此使用双箭头将它们从左边的框（可用字段列表）转移到右边的框（将出现在表单中的字段列表）。

    2.  **设置子表单。** 不幸的是，此步骤目前尚未与新构建的 Firebird 数据库自动配合工作，因此您必须在后续步骤中自行选择表和链接字段。选择 *基于手动选择字段的子表单*。

    3.  **添加子表单字段。** 在下拉菜单中选择 rel_Article_Place 表，并将所有字段移动到最右边的框中。

    4.  **获取联接字段。** 将子表单 (rel_Article_Place 表) 中的 *ArticleID* 字段与主表单 (Article 表) 中的
    *ID* 字段链接。

    5.  **排列控件。** 现在向导帮助您以四种格式之一布局界面。您可以将输入表单保留为表格，以列形式呈现带有左侧或顶部标签的数据输入单元格，或者将表单排列在
    *块 – 标签在上方*。在本示例中，我将主表单显示为顶部带标签的列，并将子表单保留为 *数据表*。现在，*Article* 提到的所有地点都可以出现在表单视图中。

    6.  **设置数据录入。** 保持此步骤不变。

    7.  **应用样式。** 这一步纯属个人品味。如图 4 所示，表单背景设置为 *浅灰色*，边框设置为 *平面*。

    8.  **设置名称。** 表单现在可以使用，但存在许多缺点；因此，输入名称后，选择 *修改表单* 并点击 *完成*。


    现在可以解决以下缺点：


    -   *Image*（图像）字段仅显示到图像的路径，而不显示图像本身。

    -   *ID* 字段是可编辑的（尽管这里不可见）。写入保护应防止修改主键。

    -   *CategoryID* 字段显示外键值（Category 表 ID），而不是 *Category*（类别）值本身。

    -   在表外字段（子表单）中，显示 *PlaceID* 的外键值，而不是 *Place*（位置）表 *ID* 的内容。

    -   由于值已在主表单的 *ID* 字段中显示，因此 *ArticleID* 的显示是不必要的。


    如果表单不可编辑，请右键点击表单名称并选择上下文菜单中的 *编辑* 来关闭然后重新打开表单。字段现在将按照在表格中排列的顺序进行编辑。


    通过 *Ctrl-点击* 选择 *Image* 输入框；然后，*右键点击* 并从上下文菜单中选择 *替换为 > 图像控件*。再次右键点击并选择 *控件* 以打开属性对话框。在
    *常规* 选项卡中，在下拉菜单中点击 *缩放 > 保持比例*，以便图像不会变形。也可以更改字段的大小，或者您可以


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_41_1.png)


    *图 4：退出表单向导后的数据录入表单。*


