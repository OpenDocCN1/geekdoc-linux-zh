    ## 入门指南


    ### LibreOffice Writer


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_16_0.png)


    图 6：格式化标记选项可让你准确查看文档中空格、制表符、换行符和新段落字符的具体位置。


    同时也有一个工具栏图标）。

    你可以使用窗口右上角的下拉列表搜索特定字符或显示某些字符子集。窗口底部会显示你最近使用过的特殊字符选择。


    - **自动更正：** LibreOffice Writer 试图通过自动格式化某些内容（如日期）或更正拼写错误的单词来协助你。但如果你不想要此功能，请前往菜单中的
    *工具 | 自动更正选项*。查看弹出对话框中的 *替换* 选项卡，即可查看 LibreOffice 自动替换的内容。如果不需要这些自动替换，请前往 *选项*
    选项卡并取消勾选 *使用替换表*。这个 *选项* 选项卡也是禁用许多其他功能的地方，例如 URL 识别、双首字母更正等。


    - **格式化标记：** 有时，准确查看 LibreOffice 如何处理文本会很有用。例如，你可能想知道空格的确切位置，或者判断文本是新段落（通过按 Enter
    键创建）还是常规换行（通过按 Shift + Enter 创建）。要查看这些“幕后”数据，请前往 *视图 | 格式化标记*。选择此项后，你会看到通常不打印的“空白”内容现在以蓝色显示（见图
    6）。要禁用此功能，只需在菜单中再次点击该选项即可。


    ## 样式简介


    如前文所述，样式是 Writer 的核心功能。在处理较长文档时，对于保持文档间的一致性至关重要。此外，它们也使得通过几次点击即可进行全文档范围的更改变得更容易。许多文字处理用户手动格式化段落、单词、表格、页面布局以及文档的其他部分，而完全忽略样式。他们习惯于根据单个物理属性撰写文档：例如，他们可能会单独指定字体族、字体大小以及加粗或斜体等格式，针对每个段落甚至每个单词。手动格式化并非理想选择。


    一个更好的选项是样式，即一组你可以应用于文档中选定的页面、文本、框架和其他元素以快速更改其外观的格式集合。应用样式通常意味着同时应用一组格式。


    因此，样式是逻辑属性（而非手动格式化中使用的物理属性）。使用样式意味着你不需要具体说明“此文本应为 12pt 无衬线字体、加粗、右对齐”。相反，你使用 *标题
    1*，因为你已将 *标题 1* 样式定义为具有这些特征。换句话说，使用样式意味着你将重点从文本（或页面、或其他元素）的外观转移到文本本身是什么。


    最终，样式有助于提高文档的一致性。此外，它们还使重大格式更改变得更加容易。例如，你可能决定更改所有段落的缩进，或更改所有标题的字体。对于长文档，手动执行此操作可能需要在几十处进行单独更改——这会浪费大量时间！相比之下，使用样式时，你只需进行一次修改。


    ## 样式的实际应用


    在 Writer 中，有各种类型的样式：


    - **页面样式。** 包括页边距、页眉和页脚、边框和背景。

    - **段落样式。** 这些控制段落外观的所有方面，如文本对齐、制表位、行距和边框；它们可以包含字符格式化。

    - **字符样式。** 这些影响段落中选定的文本，如文本的字体和大小，或加粗和斜体格式。

    - **列表样式。** 这些允许你选择、格式化和定位列表中的编号或项目符号。


    要试用它们，在文档中输入一些文本，并查看窗口左上角的 *默认样式* 下拉列表。点击列表以显示 Writer 的其他一些内置样式，如标题和题头（见图 7）。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_16_1.png)


    图 7：Writer 附带的一些默认样式。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_17_0.png)


    图 8：在侧边栏中，你可以对样式进行额外控制，包括创建新样式的能力。双击样式即可将其应用于文档。


    你现在可以使用这些样式快速更改段落的格式，包括字体大小、字体样式、是否加粗等。每次在文档中使用标题时，你也会发现它在导航器中（如前文所述）——因此在长文档中，这是一种快速导航的好方法。


    但如果你想要对样式进行更多控制，包括创建自己的样式怎么办？这就是实用的侧边栏发挥作用的地方！按前文所述打开它（或前往 视图 | 侧边栏），然后点击右侧的样式图标，你应该会看到类似图
    8 的内容。


    要创建新样式，首先点击侧边栏面板顶部的图标之一来选择你要创建的样式类别（例如段落或字符），然后点击右侧图标的箭头，并从弹出菜单中选择 新建。如果希望新样式与现有样式链接，首先从
    deck 中显示的样式列表中选择该样式，然后右键点击选定的样式并选择 新建。


    给样式命名，它将添加到列表中——然后右键点击它并选择 修改，你会看到有大量的选项可供调整。但不要被其淹没——你不需要更改其中大部分！但花点时间探索一下：你可以选择首字下沉、边框、字体效果、突出显示、缩进等更多内容。


    注意：如果链接样式，并且你稍后更改了基础样式（例如，将字体从衬线体改为无衬线体），所有链接的样式也会随之更改。有时这正是你想要的——但其他时候你不希望更改应用于所有链接样式。定义新样式和修改现有样式所使用的对话框和选项是相同的。


    ## 加载、保存和导出


    LibreOffice 的本地文件格式是开放文档格式，它以 .odt 扩展名保存 Writer 文档（开放文档文本）。这是一种完全开放和标准化的格式，被许多其他程序使用，因此绝对是存储你工作的最佳方式。当然，你可能会遇到（或收到）其他格式的文档，例如
    Microsoft Word 的 .doc 和 .docx。LibreOffice 通常能很好地打开它们，但这些格式的文件通常包含混淆或文档记录不全的数据块，因此
    LibreOffice 在处理它们时往往需要努力。如果 Microsoft Word 用户发给你一个 .doc 或 .docx 文件，而在你的 LibreOffice
    安装中看起来不太对劲，请让他们尝试使用开放文档文本格式重新发送（较新版本的 Microsoft Office 支持该格式）。


    对于保存，LibreOffice 可以导出许多不同格式的数据，包括前述的 .doc 和 .docx。只需前往 文件 | 另存为，然后点击 格式 下拉列表。你甚至可以保存为
    HTML 或纯文本，显然许多格式会消失。类似地，在 文件 | 导出 下，你可以将工作保存为电子书阅读器的 EPUB 格式，或 PDF——如果你发送的文件只需查看或打印而不需要编辑，这是最佳选项。（导出为
    PDF 时，你可以选择混合 PDF 版本，它还嵌入了原始 .odt 文件的副本，以便以后如需编辑。）


    一个实用技巧：如果你经常处理 Microsoft Office 文档并希望默认保存为该格式，请前往菜单中的 工具 | 选项，然后在左侧选择 加载/保存 和
    常规。然后，在右侧，你可以选择 始终保存为 以设置默认格式。


    ## 键盘快捷键


    我可以在本指南中包含一个包含 Writer 中每个键盘快捷键的大型表格，但这些内容已在线可用 [1]。每个人有不同的工作流程和工作量，因此最好的做法是学习对你最有用的一些！进入任何菜单（或右键点击上下文菜单）并查看条目：如果启用了键盘快捷键，你应该能在右侧看到它们（见图
    9）。（如果你的操作系统默认不显示这些，请前往 工具 | 选项 – 或在 macOS 上前往 LibreOffice | 偏好设置 – 然后在左侧选择 视图
    并启用 菜单中的图标 和 上下文菜单中的快捷键。）


    ## 结论


    LibreOffice Writer 提供了格式化文档并通过强大的样式系统进行通用更改的工具。它不仅允许你保持文档（跨文档）的一致性，还使你免于浪费时间手动格式化单个段落（甚至单词）。为了进一步节省时间，请查看“键盘快捷键”框。祝你享受文字处理！


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_17_1.png)


    图 9：制作自己的键盘快捷键列表 – 在你使用的功能旁边的菜单中找到它们。


