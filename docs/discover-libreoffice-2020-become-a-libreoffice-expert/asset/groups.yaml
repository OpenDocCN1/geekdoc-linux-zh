    # GETTING STARTED


    # LibreOffice Calc


    At this time, Li-breOffice does not support spar-klines, the original form of
    condi-tional formatting – a miniature line graph, with the main data points marked.
    However, you can use the charting subsystem to cre-ate a graph and then scale
    it down, so it fits into a cell or several merged ones. You can also use a bar
    graph.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_23_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_23_1.png)


    |

    |---|---|---|

    | | Spent | Country | Gender | Age |

    | $750.41 | Canada | M | 25 |

    | $1,270.89 | USA | F | 46 |

    | $980.13 | USA | M | 32 |

    | $1,412.36 | Canada | F | 25 |

    | $673.19 | Canada | O | 54 |

    | $1,145.93 | USA | O | 35 |



    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_23_2.png)


    # USING CELL STYLES


    Calc is unique among spreadsheets in its use of styles – specifically, for cells
    and pages. As in Writer, Calc styles can be based on existing styles to save time
    and provide a unified look. Calc styles can be applied to single or multiple cells,
    an entire column or row, or, by clicking the empty space above row 1 and to the
    left of column A, to the entire worksheet. Press F11 to display and edit styles
    in the Styles & Formatting dialog. If you have used manual (direct) for-matting
    already, you should select Format | Clear Direct Formatting to avoid difficulties
    as you apply styles.


    Calc installs with a number of de-fault cell styles. These come with a number
    of predefined settings, mostly for different purposes, such as head-ings. Other
    cell styles, listed under Stat-us, are intended to mark evaluations of the state
    of your work and can be changed as improvements are added. You may also want to
    create cell styles to mark subtotals or totals of the cells that contain particular
    functions. By contrast, Calc comes with only two page styles, although more can
    be added as needed.


    Cell styles support Fonts and Font Ef-fect settings, and both Cell Style and Page
    Style dialogs have tabs for Borders and Background. Each of these tabs is almost
    identical to those found in other LibreOffice modules, and a variety of fonts,
    borders, and backgrounds is a way to make data arrays distinct from one another
    (Figure 11).


    However, Calc styles do have some tabs that are unavailable elsewhere in LibreOffice.
    In Cell Style, one of the most important is the Numbers tab. Al-though Calc assumes
    by default that all characters are text to be displayed


    starting at the left margin and all numerals are numbers to be displayed starting
    at the right mar-gin, you can spec-ify the kind of information a cell con-tains
    from the Numbers tab. From the same tab, you can select formats for information
    such as the date. The lan-guage and locale are also on the Num-bers tab, because
    they determine the default formats for different types of numbers, including the
    separator used to make large numbers easier to read (Figure 12).


    A second unique tab for cells is Alignment. From the Alignment tab, you can position
    cell entries on an angle, which can save space in head-ings. Even more importantly,
    you can set text to wrap automatically and to hyphenate, two settings that make
    a worksheet more readable. You might also shrink content to fit cell size, al-though
    that can be a user-unfriendly choice (Figure 13).


    A third unique tab for cells is Cell Pro-tection. There, you can set whether an
    entire worksheet or just the formulas are protected, or whether to hide a cell
    when printing. These settings are not intended for security so much as protec-tion
