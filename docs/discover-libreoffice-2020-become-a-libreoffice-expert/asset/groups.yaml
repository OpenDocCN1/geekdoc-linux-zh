    **Figure 6:** ... and distribute them vertically and horizontally.


    workspace, another option is to enter exact values for object placement via the
    Properties sidebar (Figure 1). You can also use each property’s more detailed
    dialog box via the context menu or the Format menu. By using exact values, you
    can create simple construction drawings with LibreOffice (Figure 4). You can change
    the drawing scale (*Extras | Options | LibreOffice Draw | General*). After creating
    your objects, LibreOffice can add dimension lines. Keep in mind that help lines
    are necessary when working with construction drawings.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_2.png)


    **Figure 7:** Connectors allow you to move one item in an organization chart,
    but still preserve the flow.


    Finally, if you are looking to align a group of objects, Draw can do this for
    you (Figure 5). Select your objects (either by holding the Shift key and right-clicking
    on the desired objects or by drawing a frame around the objects) and then select
    *Align* (from the context menu or the standard toolbar). You can further adjust
    the distribution of objects in a line by selecting *Distribution* (Figure 6).


    # CONNECTORS


    Another nice feature of Draw is connector lines for linking objects together.
    Connectors are gluepoints, located on the object’s border, to connect to another
    object. Once two objects are connected via gluepoints, moving one object also
    moves the connected object. Typical use cases are flow charts or organizational
    charts (Figure 7). Connectors allow you to move a single object while preserving
    the chart’s flow.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_3.png)


    **Figure 8:** Draw offers some cool options, like converting a 2D shape into a
    rotating 3D object.


    # CREATIVE CENTER


    While LibreOffice Draw is not a pixel-oriented paint program like Gimp, it does
    offer some really creative tools. For example, you can convert a 2D shape into
    a 3D rotation object. To generate the 3D object, you first draw the basic shape:
    a flat, half sketch of the desired object (Figure 8). Then, click on this shape
    and select *Shape | Convert To 3-D Rotation object*.


    # PRINTING AND EXPORT


    Printing your drawings is easy. Select your printer, and start the printing job.
    Make sure your document’s page settings match your printer’s requirements. You
    can also export your drawing into popular file formats, like PDF, PNG, or SVG.
    Remember, SVG is a vector-based format, while PNG a pixel-based. Consequently,
    quality will vary in individual cases.


    LibreOffice Draw does have one restriction when it comes to printing files: There
    is no color-separation option (CMYK separation), which is necessary for offset
    printing. If you require CMYK separation, the final product must be reworked with
    a preflight tool, and colors must be changed to the required color profile.


    # CONCLUSION


    With LibreOffice Draw, you have a powerful, vector-based drawing tool to create
    anything from the simplest sketch to complex diagrams. Once you’ve created your
    masterpiece, you can use it in other LibreOffice applications or export it for
    use in third-party applications. ■■■


    # INFO


    +   [1] LibreOffice Draw:

    +   https://www.libreoffice.org/discover/draw/'
