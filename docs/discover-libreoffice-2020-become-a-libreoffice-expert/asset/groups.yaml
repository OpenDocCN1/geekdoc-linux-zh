    \ data.\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_24_1.png)\n\nFigure 13: The\
    \ *Alignment* tab improves the display of data within the cell.\n\nContent intended\
    \ for online use – can be transferred to a physical page. Because this transfer\
    \ can be awkward when the number of total columns is wider than the page, you\
    \ can also choose which objects are printed. Objects, images, and charts can be\
    \ especially difficult to position on the printed page. In the end, you might\
    \ prefer to simply scale down the spreadsheet, although the possibility of eye\
    \ strain or even illegibility is always there (Figure 14).\n\nAs an alternative\
    \ to styles, you might select a color scheme from *Format* | *Spreadsheet Themes*.\
    \ Note, though, that themes are more general than styles, and that styles have\
    \ more functional advantages.\n\n# THE EVOLVING SPREADSHEET\n\nWhen spreadsheets\
    \ started being used in the early 1980s, function was everything. Even formatting\
    \ touches like text wrap were not included, which meant that long pieces of content\
    \ obscured adjacent cells, often making a spreadsheet unreadable at a glance.\n\
    \nToday, spreadsheets are as functional as ever, although the number of features\
    \ has increased slowly in the last couple of decades. Where spreadsheets have\
    \ really evolved is in the rise of formatting options. Thanks to the influence\
    \ of information designers such as Edward Tufte, spreadsheets have also started\
    \ emphasizing the importance of presentation, highlighting and coloring cells\
    \ to create visual impressions and guides on top of the functionality.\n\nThese\
    \ visual impressions are not an end in themselves. Should you find yourself treating\
    \ your spreadsheets as works of art rather than as aids to comprehension, you\
    \ will need to reassess your priorities. However, at their best, the combination\
    \ of functionality and visual aids makes spreadsheets more accessible than they\
    \ were 40 years ago. With its use of styles, Calc is well-equipped to meet these\
    \ increasing demands for spreadsheets.\n\n> INFO\n\n- [1] Byfield, Bruce. *Designing\
    \ with LibreOffice.* Friends of Open Document, Inc., 2016\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_24_2.png)\n\
    \nFigure 14: The Page Style dialog offers options for squeezing a spreadsheet\
    \ onto physical pages.\n\n# Hone your skills with special editions!\n\nGet to\
    \ know Shell, LibreOffice, Linux, and more from our Special Edition library.\n\
    \nThe *Linux Magazine* team has created a series of single volumes that give you\
    \ a deep-dive into the topics you want.\n\nAvailable in print or digital format\n\
    \nCheck out the full library!  \nshop.linuxnewmedia.com\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_26_0.png)\n\
    \n# Impress\n\n## Perfect Presentations\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_27_0.png)\n\
    \nNeed to impress your boss with the latest sales stats? Or just show off some\
    \ holiday photos in an eye-catching format?\n\nImpress is the tool you need. *By\
    \ Mike Saunders*\n\nThe term “PowerPoint” has become synonymous with presentations\
    \ in general, even if the file was made in a different program. Presentation software\
    \ dates back to the early 1980s, with tools such as VCN ExecuVision, which let\
    \ users add images to text and display them in a slideshow format. LibreOffice’s\
    \ presentation component is called Impress, and it’s an immensely versatile tool\
    \ with features and special effects galore. So let’s dive into it!\n\nStart LibreOffice\
    \ and choose a new *Presentation* (or if you’re already running the app, go to\
    \ *File | New | Text Presentation* in the menu). You’ll be presented with a list\
    \ of preinstalled templates, so choose one you like, and a new Impress document\
    \ will open displaying the following features:\n\n- 1. **Toolbar:** Most commonly\
    \ used features are just one click away here. If you’re unsure of what an icon\
    \ does, simply mouse over the icon for a tooltip. You can also right-click on\
    \ the toolbar and choose *Visible Buttons* or *Customize Toolbar* for finer control\
    \ over the layout.\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_27_1.png)\n\n**Figure\
    \ 1:** A new Impress document: toolbar (1), slide thumbnails (2), slide content\
    \ (3), sidebar (4), sidebar options (5), position and size (6), and zoom level\
    \ (7).\n\n# GETTING STARTED\n\n## LibreOffice Impress\n\n- 2. **Slide thumbnails:**\
    \ Here you can see small versions of your slides and switch between them with\
    \ a single click. Right-click on a slide to perform actions on it (e.g., copy\
    \ or delete), and right-click in a blank area to add a new slide. You can also\
    \ click and drag to rearrange slides. (Note: This panel is collapsible; if you\
    \ don’t see it, click the gray arrow to open it.) You can also create new slides\
    \ using the apply named Slide menu.\n- 3. **Slide content:** This is where you\
    \ do most of your work. Click in a text box to edit the contents and then the\
    \ gray area around a box to display green handles, with which you can resize and\
    \ move the items in a slide. Use the Insert menu to add images and additional\
    \ text boxes.\n- 4. **Sidebar:** If you don’t see the sidebar, it’s probably collapsed\
    \ to the right-hand side, so click the gray arrow to open it (or go to View |\
    \ Sidebar). In Figure 1, the sidebar is showing different slide transition effects.\n\
    - 5. **Sidebar options:** The sidebar can show many different things, so use the\
    \ small icons on the right to switch between them (e.g., text properties, animations,\
    \ a gallery of useful clip art, and more).\n- 6. **Position and size:** When you’re\
    \ moving or resizing an object, such as an image or text box, check the status\
    \ bar to find the exact details. (You can also right-click on an object and choose\
    \ Position and Size to specify dimensions exactly.)\n- 7. **Zoom level:** A quick\
    \ slider that lets you change the zoom level, so you can zoom in for lots of detail,\
    \ or zoom out for an overview.\n\n# THE ART OF THE PRESENTATION\n\nRegardless\
    \ of your opinion of Steve Jobs, there’s no doubt that he was excellent at presenting\
    \ new Apple products. If you’ve never seen any of his presentations before, search\
    \ onto YouTube and do some searching – the original iPhone and MacBook Air are\
    \ two classic examples. Jobs’ presentations weren’t packed with text and excessive\
    \ detail, but instead showed individual features, images of the devices, and occasional\
    \ specs. He elaborated on the slides with his words, and it all came together\
    \ into an impressive presentation.\n\nOf course, Jobs’ presentation style isn’t\
    \ appropriate in every situation. Demonstrating flashy new gizmos to salivating\
    \ tech journalists is very different from updating your boss on sales or showing\
    \ some holiday photos to family and friends (see the “Creating a Photo Album”\
    \ box). But here are some general tips to always keep in mind:\n\n- **Get off\
    \ to a quick start.** No one likes a long-winded presentation. Instead of starting\
    \ with “In this presentation I’m going to...”, begin immediately with an interesting\
    \ fact, stat, or discovery. This catches your audience’s attention straight away\
    \ and gives them hope that the rest of the presentation will be interesting.\n\
    - **Keep your focus on the audience.** It’s easy to keep turning around to look\
    \ at your slides, but that only encourages you to read or describe what’s on the\
    \ screen, which adds nothing to the presentation. Look at your audience, and get\
    \ a feel for how they are responding.\n- **Add anecdotes and stories.** If you’ve\
    \ ever seen a TED talk, you’ll know that they’re full of anecdotes. Sometimes\
    \ this can seem a bit cheesy, so don’t overdo it, but one or two humorous digressions\
    \ in a presentation help to break it up – and wake up anyone who is about to nod\
