    Draw 提供了一组预定义的绘图对象，如基本形状、符号、箭头、流程图、对话框和星形。只需从绘图工具栏（图 2）中选择所需的形状，并使用鼠标创建对象即可。之后，您可以更改形状的位置和属性。


    除了绘图工具栏中的预定义形状外，图库（位于“属性”侧边栏中）还提供了大量即开即用的图形（图 3）。您可以轻松地用鼠标拖动和放置单个对象。此外，您还可以通过点击图库中的“新主题”添加自己的类别，并保存自定义对象以备日后使用。


    选定形状后，您可以使用“区域”属性、“透明度和填充”来为您的对象创建美观的效果。


    ## 对象排列


    对象按照创建顺序放置在当前活动工作区中。第一个对象位于底层，随后的每个对象都位于前一个对象的上一层。要更改对象顺序，请从上下文菜单或“形状”菜单（位于菜单栏中）中选择“排列”。


    使用鼠标创建和放置对象是获得可接受结果的快速方法。但是，有时您需要更高的精度。Draw 提供了一些实现精度的选项。


    如果您仍想使用鼠标，可以激活“显示网格”或“参考线”。使用“显示网格”，您可以将对象自动吸附到页面的网格上。如果需要更多自定义，“参考线”允许您创建用于对齐的非打印线条。要创建参考线，请将鼠标光标置于页面标尺之一内，按住鼠标按钮，并将光标拖入绘图区域。创建后，您可以更改参考线的属性（x
    或 y 位置），甚至可以通过输入坐标来放置参考线。


    由于所有对象在活动工作区中都有度量尺寸和位置


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_35_1.png)


    图 4：Draw 中输入精确数值的能力使其适用于简单的施工图纸。


    因此，另一个选项是通过“属性”侧边栏（图 1）输入对象放置的精确数值。您还可以使用上下文菜单或“格式”菜单中每个属性的更详细对话框。通过使用精确数值，您可以使用
    LibreOffice 创建简单的施工图纸（图 4）。您可以更改绘图比例（*扩展 | 选项 | LibreOffice Draw | 常规*）。创建对象后，LibreOffice
    可以添加尺寸线。请记住，在处理施工图纸时，参考线是必要的。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_0.png)


    图 5：Draw 会精确对齐您的对象……


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_1.png)


    图 6：……并垂直和水平分布它们。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_2.png)


    图 7：连接器允许您在组织结构图中移动一个项目，同时保持流程不变。


    最后，如果您希望对齐一组对象，Draw 可以为您完成（图 5）。选中对象（按住 Shift 键并右键点击所需对象，或围绕对象画框），然后选择*对齐*（从上下文菜单或标准工具栏中）。您可以通过选择*分布*（图
    6）进一步调整直线中对象的分布。


    ## 连接器


    Draw 的另一个不错功能是用于连接对象的连接线。连接器是位于对象边框上的胶合点，用于连接到另一个对象。一旦两个对象通过胶合点连接，移动一个对象也会移动连接的另一个对象。典型用例是流程图或组织结构图（图
    7）。连接器允许您在保持图表流程的同时移动单个对象。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_36_3.png)


    图 8：Draw 提供一些很酷的功能，例如将 2D 形状转换为旋转的 3D 对象。


    ## 创意中心


    虽然 LibreOffice Draw 不是像 Gimp 那样的面向像素的绘画程序，但它确实提供一些非常具有创意的工具。例如，您可以将 2D 形状转换为 3D
    旋转对象。要生成 3D 对象，您首先绘制基本形状：所需对象的扁平半草图（图 8）。然后，点击该形状并选择*形状 | 转换为 3-D 旋转对象*。


    ## 打印和导出


    打印您的绘图很简单。选择您的打印机，开始打印任务。确保您的文档页面设置符合打印机的要求。您还可以将绘图导出为流行的文件格式，如 PDF、PNG 或 SVG。请记住，SVG
    是基于矢量的格式，而 PNG 是基于像素的。因此，质量在个别情况下会有所不同。


    LibreOffice Draw 在打印文件方面有一个限制：没有颜色分离选项（CMYK 分离），这是印刷所必需的。如果需要 CMYK 分离，最终产品必须使用印前工具重新处理，并且必须将颜色更改为所需的颜色配置文件。


    ## 结论


    借助 LibreOffice Draw，您拥有一个强大的、基于矢量的绘图工具，可以创建从最简单的草图到复杂图表的一切。一旦您创建了杰作，就可以将其用于其他
    LibreOffice 应用程序，或导出供第三方应用程序使用。■■■


    ## 信息


    - [1] LibreOffice Draw：

    - https://www.libreoffice.org/discover/draw/


