    \ the presentation, so make sure you’re adding value!\n\n# CREATING A NEW PRESENTATION\n\
    \nSo let’s go ahead and make a presentation! For general tips on how to engage\
    \ your audience and shape your presentations for maximum effectiveness, see the\
    \ box “The Art of Presenting.” For now, focus on the software itself.\n\nMost\
    \ of the preinstalled templates include two or more variants of a design. For\
    \ instance, in the Allianz template that I chose in Figure 1, you can see two\
    \ slides were created automatically, on the left-hand side: The first is suitable\
    \ for an introduction (or ending), whereas the second is for regular slides with\
    \ text and images.\n\nSo, add some text to the first slide, then select the second\
    \ slide from the left-hand panel, and add some text (and maybe an image) as well.\
    \ Before you do any more work, check out your super quick two-slide presentation!\
