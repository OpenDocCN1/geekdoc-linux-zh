    # LibreOffice 背后的社区力量


    # 全球影响力


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_87_0.png)


    谁在开发 LibreOffice？大家是如何协作的？他们又在做什么？以下是关于全球 LibreOffice 社区动态的最新报道。*作者：Mike Saunders*


    LibreOffice 是一个全球性的项目。该软件中的许多功能是由认证开发者 [1] 在 LibreOffice 生态系统中实现的——例如 Collabora、CIB
    和 Red Hat。这些公司使用并基于 LibreOffice 开发产品，并支持该套件的长期维护版本。但根据开源许可协议，当他们对 LibreOffice
    进行改进时，也会将更改回馈给社区。


    虽然大量的“基础”编程工作是由这些开发者完成的，但更广泛的社区中还有数百人在其他方面发挥作用：本地化（翻译用户界面）、设计、营销、文档、处理错误报告，等等。欢迎所有人与社区
    [2] 合作，帮助改进 LibreOffice——同时结识新朋友并提升技能。


    那么，在过去几年中，社区做了哪些事情使 LibreOffice 能够不断壮大？请继续阅读全文，了解他们的工作，并查看您如何参与其中。


    ## 阿尔巴尼亚 – 本地化冲刺活动


    阿尔巴尼亚首都地拉那是 2018 年 LibreOffice 大会的举办地。自那以来，当地社区在 LibreOffice 的设计、营销和本地化项目中一直非常活跃。2018
    年 11 月，社区举办了一次本地化冲刺活动，其中一位组织者 Sidorela Uku 如此描述该活动：


    > “这是我为 LibreOffice 组织的第一次活动，与我的朋友 Marcela Korreshi（我们的新贡献者）合作。演示内容介绍了 LibreOffice
    以及人们可以通过多种方式为该项目做出贡献，而第二部分则专注于翻译。（*此外，我谈到了 whatcanidoforlibreoffice.org*）。活动中有
    14 人参加，据我从翻译进度中看到，大约有 460 个字符串需要审核 – 其中大约 200 个字符串已翻译并审核完毕。”


    ## 保加利亚 – OpenFest


    OpenFest 2019 于 11 月 2 日和 3 日在保加利亚索菲亚举行。来自文档基金会（


    主图 © Sergey Nivens, 123RF.com


    # LibreOffice 社区


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_88_0.png)


    阿尔巴尼亚 LibreOffice 社区的 Sidorela Uku 和 Marcela Korreshi 正在主持他们的活动。


    (TDF) 会员委员会的 Gabriele Ponzio 出席了活动（TDF 是 LibreOffice 背后的非营利实体），并发表了以下言论：


    > “我这次出访的目标是创建一个本地 LibreOffice 社区，并有可能增加 TDF 的会员基础，使该国得到更好的代表。我看到许多人都很感兴趣 – 所以我们看看他们是否会在我们的社区中活跃起来。此外，我有机会与来自
    open-SUSE 社区的杰出人士共同使用展位。他们对我非常友好和热情，在很多方面帮助了我，从到机场接机 [up]，到用保加利亚语向展位参观者介绍 LibreOffice，与旁边用英语介绍的人并肩工作。”


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_88_1.png)


    一台笔记本电脑播放关于 LibreOffice 的视频，旁边是在保加利亚活动中分发的传单。


    我们软件的用户，以及其他社区的开发者/爱好者。如果你们国家有类似的活动，请毫不犹豫地参加！”


    ## 德国 – 活动和聚会


    德国和 LibreOffice 有着密切的联系。StarOffice（OpenOffice.org 的前身，而 OpenOffice.org 又是 LibreOffice
    的前身）最早于 1980 年代在汉堡开发。多年来，许多其他开发者加入了团队，分布在汉堡及德国其他地区。即使多年后的今天，德国社区依然活跃，参加各类活动并定期举办社区聚会。


    2019 年 8 月，社区成员参加了在波恩附近圣奥古斯汀镇举行的 FrOSCon。FrOSCon 是该国最大的自由和开源软件 (FOSS) 会议之一，约有
    2,000 名与会者。大多数访客已经了解 FOSS，但有些人最近才听说过，并渴望发现更多。Gerrit Großkopf、Uwe Altmann、Stefan
    Unverricht 和我（Mike Saunders）设立了一个展位，摆放着传单、贴纸和一台演示 LibreOffice 6.3 和 LibreOffice
    Online（该套件的基于 Web 的版本 [3]）的计算机。许多展位访客不知道 LibreOffice Online 的存在，并渴望在自己的基础设施上尝试。


    ## 捷克共和国 – 自由软件活动


    捷克 LibreOffice 社区的成员，包括 Stanislav Horáček、Zdeněk Chronek 和 Petr Valach，参加了 2019
    年秋天的两场会议：10 月的 LinuxDays 和 11 月的 Open-Alt。他们设立了展位，摆放着传单、贴纸和展示最新 LibreOffice 版本的笔记本电脑，并回答了访客的问题。


    访客提出的话题包括 LibreOffice Online、宏、自动更新、手写识别和捷克语词典。Stanislav 总结了他的体验：“我们确实推荐这类活动，因为你可以从最终


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_88_2.png)


    与 LibreOffice 一样，Linux 也是一个自由和开源的操作系统，LibreOffice 社区成员参加 Linux 活动。


