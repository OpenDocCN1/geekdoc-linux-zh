    ## LibreOffice 宏


    ### 使用宏自动化 LibreOffice


    LibreOffice 内置了一种类似 Basic 的脚本语言，可用于自动化重复任务并扩展该套件默认的功能。*作者：Dimitri Popov*


    在熟练手中，LibreOffice Basic 脚本语言可以创造奇迹，但你不需要是编程专家就可以编写简单的，甚至更高级的、执行有用任务的宏。无论你是 Linux
    家庭用户还是 IT 专家，你都可以使用 LibreOffice 套件的内置脚本功能来自动化常规任务。本文提供了一些示例，你可以将其用作自己 LibreOffice
    编码项目的构建模块。


    ### 查找单词


    LibreOffice Basic 宏编辑器可以通过*工具 | 宏 | 编辑宏*访问（图 1）。传统上，编程语言的介绍始于一个简单的示例，显示“Hello
    world!”消息。虽然这很可爱，但并非特别有用，因此我将以一个更实用的示例开始：一个简单的宏，用于在维基百科中查找当前选定的单词。宏的关键元素是内置的*Shell1*函数
    [1]，用于调用外部程序。例如，你可以使用以下代码打开机器上的默认浏览器：


    ```

    Sub Main

    Shell1 ("xdg-open", 1)

    End Sub

    ```


    *Shell1* 函数需要要运行的程序名称（如果应用程序不在包含在 Bash 的 *$PATH* 环境变量中的位置，你可能需要添加路径）。第二个参数是你希望程序如何打开的方式（例如，全屏；最小化、最大化或隐藏的程序窗口；有焦点和无焦点等）。


    作为记录，*xdg-open* 是调用用户首选应用程序来处理给定文件类型或 URL 的最常见方式。例如，运行


    ```

    xdg-open http://<some.url>

    ```


    将在用户首选的 web 浏览器中打开 *http://<some.url>*。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_59_0.png)


    图 1：LibreOffice 宏编辑器。


