    # 提高效率


    ## LibreOffice 的隐藏瑰宝


    布局 | 默认。就在你阅读此文之际，LibreOffice 设计团队正在致力于 NotebookBar 的更新和扩展工作，它甚至可能成为办公套件即将发布版本中的标准选项（即不仅仅是实验性功能）。如果你偏爱传统图形用户界面（GUI），觉得
    NotebookBar 并不适合你，请放心——官方并没有计划移除标准工具栏布局。如需了解关于 NotebookBar 的更多信息（包括即将发布版本的路线图），请访问
    TDF Wiki [4]。


    ### 命令行技巧


    你通常是通过桌面环境或窗口管理器来启动 LibreOffice 的，点击按钮即可启动整个套件或其中一个模块（例如 Writer 或 Calc）。但你也可以从命令行运行它，并附带一些有用的额外选项。首先，你使用的具体命令取决于你的发行版以及安装
    LibreOffice 的方式。如果你使用的是发行版自带的软件包，通常可以使用 `soffice`（源自 StarOffice）、`ooffice` 或 `libreoffice`
    来启动。但是，如果你是通过 LibreOffice 官方网站的软件包安装的，则需要添加版本号，例如 `libreoffice5.3`。


    若要立即显示 Writer 来启动套件（而不是启动中心），请使用：


    ```

    soffice --writer

    ```


    对于 Calc，请使用 `--calc`；对于 Impress，请使用 `--impress`。这些参数在桌面环境或窗口管理器中创建新的启动按钮时特别有用。对于
    Impress，你可以启动套件并直接进入演示文稿，无需最初显示用户界面，操作如下：


    ```

    soffice --show filename.odp

    ```


    这将立即切换到全屏模式，当演示结束时，LibreOffice 将关闭。如果你经常做演示，这个功能非常方便，因为你可以将它们链接到桌面或窗口中的启动器，只需点击几次即可无缝显示（无需在
    GUI 中花费几秒钟进行繁琐操作）。另一个相关参数是 `--view`，它以只读模式显示文档——因此不允许编辑。


    如果你不幸遇到 LibreOffice 崩溃，下次启动时，它将提供（尝试）恢复丢失的数据。你可以通过传递 `--norestore` 选项来防止这种情况发生。同样，如果你在启动
    LibreOffice 时就遇到了重大问题（例如，由于扩展、硬件加速或用户配置文件的问题），你可以使用 `--safe-mode` 或从“帮助”菜单中激活套件的安全模式。这会弹出一个对话框（参见图
    4），你可以禁用某些选项，甚至重置为“出厂设置”（即像全新安装一样）。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_83_0.png)


    如果你想打印一批文件，而不必费事打开每个文件并逐一点击打印，请执行以下操作：


    ```

    soffice -p doc1.odt doc2.odt

    ```


    注意这里 `p` 前面的单个连字符。你可以提供任意数量的文档；它们都将发送到默认打印机。如果你有多个打印机并想指定其中一个，请使用 `--pt` 选项，后跟打印机名称，然后是你想打印的文档。


    在使用命令行操作 LibreOffice 时，最大的省时功能之一是文档批量转换。考虑以下示例：


    ```

    soffice --convert-to pdf *.odt

    ```


    这会在当前目录中生成所有 Open Document Format Text (ODT) 文件的 PDF 版本。如果你有一批 Microsoft Word
    文档，想将它们转换为 LibreOffice 的原生格式，请使用：


    ```

    soffice --convert-to odt *.docx

    ```


    LibreOffice 包含大量文件格式的导入和导出过滤器，你可以在批量转换任务中使用其中的许多格式。不幸的是，列出这些格式的文档并不完善——因此你需要找对地方。如果你想将
    LibreOffice Writer 创建的 ODF 文档转换为 Microsoft Word 97 格式，请使用以下命令：


    ```

    soffice --convert-to doc:"MS Word 97" file.odt

    ```


    但你是怎么知道要使用这个确切命令的呢？诀窍是查看 LibreOffice 源代码树，特别是文件格式过滤器列表 [5]。在该网页上，你会看到一个名为 `MS_Word_97.xcu`
    的文件——因此你知道它有一个针对 Word 97 文件的过滤器。如果你点击它，可以在文件顶部（第一个注释块之后）看到这一行：


    ```

    <node oor:name="MS Word 97" oor:op="replace">

    ```


    这告诉你，“MS Word 97” 是我们应用过滤器时应使用的名称。（这也与文件名相同，只是去掉了下划线——但检查过滤器文件的内容总是值得的。）


    通过这个技巧，通过提供文档扩展名后跟引号内的过滤器名称，你可以访问广泛的文件格式。如果你正在处理大量遗留文档，并需要将它们从一种格式转换为另一种格式，这个命令将是神来之笔。是的，必须深入
    LibreOffice 源代码来探索这一点有点繁琐，但它确实有效。而且，如果你想回馈该套件，开发团队将非常欢迎任何关于此文档记录的努力！


    - 新增 Writer 大纲折叠模式。这会在文档中的每个标题旁边添加一个按钮，你可以点击它以显示/隐藏后续章节。这使得处理大型文档更加容易。

    - 实现了样式检查器，用于显示段落样式、字符样式和手动格式化（直接格式化）属性的所有属性。

    - 在 Impress 中，包含了新的基于物理的动画能力和新的动画效果预设：即模拟下落、向右/左发射并返回、下落并淡出。请关注维基 [6] 以获取关于更改和改进的最新详细信息！此外，请查看“LibreOffice
    Online”方框，了解浏览器版本的信息。


    ### LibreOffice 在线版


    另一件值得关注的事情是 LibreOffice Online（参见图 5）。顾名思义，这是可以在 Web 浏览器中运行的套件版本，内容通过网络传输。LibreOffice
    Online 已经开发了好几年，但最近取得了重大进展，这要归功于 Collabora，该公司专门提供套件的长期支持版本（例如，用于政府和企业用途）。


    目前，LibreOffice Online 的外观和感觉非常像桌面版套件，但并非每个菜单项或功能都可用——在某些方面它略显精简。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_84_0.png)


    但它正在快速进步，很大程度上归功于 Collabora。因为它使用与桌面版 LibreOffice 相同的基础文档布局引擎，所以在浏览器和本地应用之间切换时，Open
    Document Format (ODF) 文件应该显示得完全一致。


    LibreOffice Online 可以与 Nextcloud 集成，打造完全开源（FOSS）的文档共享和协作系统。它仍需一些工作，特别是在性能方面，但进展顺利——你可以在
    Collabora 的网站 [7] 上获取演示版。请注意，Document Foundation 没有计划提供托管版的 LibreOffice Online，因为这需要大量资源
    [4]。采用速度很快。相反，该软件可供第三方在服务器上安装和运行。


    ### LibreOffice 7.1 即将到来


    LibreOffice 社区正在忙于下一个版本 7.1 的开发，该版本预计于 2021 年 2 月初发布。各种新功能正在开发中，包括（但不限于）：


    ### 信息


    - [1] **LibreOffice 设计社区：** http://www.libreoffice.org/community/design/

    - [2] **MUFFIN：** http://blog.documentfoundation.org/blog/2016/12/21/the-document-foundation-announces-the-muffin-a-new-tasty-user-interface-concept-for-libreoffice/

    - [3] 工具栏的限制： https://design.blog.documentfoundation.org/2016/12/21/evolving

    - [4] **TDF Wiki：** https://wiki.documentfoundation.org/Development/NotebookBar

    - [5] **文件格式过滤器：** https://cgit.freedesktop.org/libreoffice/core/tree/filter/source/config/fragments/filters

