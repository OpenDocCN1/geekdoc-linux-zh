    # 提升生产力


    ## LibreOffice 扩展


    ## 扩展 LibreOffice 的功能


    ## 自定义 LibreOffice


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_52_0.png)


    **你可以使用超过 350 个实用扩展来增强 LibreOffice 的功能。** *作者：Bruce Byfield*


    **E**xtensions（扩展）是自由办公套件 LibreOffice 的非官方附加组件。有些扩展提供了额外的资源，例如图库中的图片或不同语言的目录。其他扩展则提供了具有额外功能或不同布局的替代对话框，例如替代的拼写检查器或语法检查器。少数扩展甚至提供了最终将成为标准安装部分的新功能。正如
    Mozilla Firefox 或 Gimp 一样，扩展是 LibreOffice 广受欢迎的主要原因之一。如今，已有超过 350 个扩展。


    一些扩展是资源的集合，例如替换图标。其他扩展则是用 LibreOffice 的 Basic 脚本语言或 Java 等标准编程语言编写的宏——并且如今越来越多地使用
    Python。这种多功能性意味着开发者可以在不深入了解代码库的情况下开始为 LibreOffice 做出贡献。一个完成的扩展是一个独立的代码片段，在安装时会被插入到基本代码中。


    ### 寻找扩展


    LibreOffice 为模板和扩展维护了一个独立的网站 [1]。开发者可以在该网站上创建账户以上传他们的作品，而用户可以使用该网站来搜索扩展，并查看扩展的简要描述、许可信息和截图。由于有超过
    350 个扩展——以及许多更新——找到一个扩展可能需要一些时间，但在每个页面的右侧边栏中都有链接，用于查看最新的扩展，也可以按类别浏览。


    ### 安装扩展


    所有 LibreOffice 扩展的文件名均以 .OXT 结尾。无论它们是资源还是程序，安装它们的步骤都是相同的：


    1.  下载扩展到你的系统。

    2.  点击 *工具* | *扩展管理器* | *添加*，并导航到下载位置（图 1）。

    3.  选择扩展并点击 *打开*。如果扩展已经存在于你的系统上，系统会询问你是否要覆盖它。点击“确定”以继续。

    4.  确认对话框会询问你是否希望为该系统上的所有用户安装扩展，还是仅为你自己安装。要为所有用户安装，你必须能够以 root 身份登录。选择这两个选项之一。

    5.  你可能会被要求接受许可协议。阅读并滚动到许可协议底部，点击接受。

    6.  在扩展管理器中点击 *选项* 按钮，并自定义扩展。并非所有扩展都有选项。

    7.  关闭并重启 LibreOffice，扩展即可使用。


    你可能需要搜索才能在编辑窗口中找到该扩展。像字典这样的资源很可能位于 *工具 | 语言* 中，而图库图片将显示在 *插入 | 媒体 | 图库* 中。其他语言可能位于菜单的某个位置，通常在“工具”菜单的底部。其他扩展可能位于工具栏中，尤其是在左侧。放置扩展没有标准位置，许多扩展开发者也没有说明在哪里可以找到已安装的扩展，因此你有时需要在搜索中发挥创造力。


    ### 多种多样的扩展


    多年来，扩展已成为安装拼写和连字符字典的首选方式。其中，大多数用于 Writer 和 Calc，这是 LibreOffice 中使用最广泛的模块。除非另有说明，大多数扩展将在
    LibreOffice 支持的任何操作系统上运行。


    最有趣的是那些增加或扩展功能的扩展。虽然数量太多无法一一详述，但下面讨论的是最通用的扩展。


    ### 替代查找和替换对话框


    此扩展替换了“编辑”菜单中的标准查找和替换对话框。它增加了以无数种新方式进行搜索的能力，包括书签、注释、交叉引用、图片和文本框。对于那些忍受默认查找和替换功能的用户来说，一个特别重要的增加功能是能够按字符样式而不是设计特征进行搜索。此外，内置的正则表达式使即使是初学者也能轻松进行高级搜索。用户还可以搜索多个段落并同时执行多个搜索。


    替代查找和替换对话框可能需要一些时间才能掌握，但不要让它看似简陋的下拉列表迷惑了你：这是一个早已该成为默认工具的扩展。你写的文档越长，就会越欣赏它（图 2）。


    ### 代码高亮器


    LibreOffice Writer 并不是大多数人的首选编程工具。它有太多分散注意力的功能，而且你必须确保以 *文本* 格式保存。然而，一些用户可能在文章、手册或白皮书中包含代码片段。代码高亮器通过在
    *工具* 菜单中放置一个下拉列表，根据数十种约定高亮显示代码，从而简化了这一任务（图 3）。


    ### 仅复制可见单元格


    在 Calc 电子表格中，你可以隐藏行或列，但如果你复制它们，也会复制隐藏的部分。使用“仅复制可见单元格”，只有可见的单元格会被复制，从而节省了粘贴后的额外步骤。


    ### 导出为图像


    Draw 和 Impress 都包含多个页面或样式。此扩展可一次性将页面生成 JPG、PNG、GIF、BMP 或 TIFF 格式的图像。如果你想在演示演讲后在线发布幻灯片，它特别有用（图
    4）。


    ### MULTIFORMATSAVE-DRAW


    MultiFormatSave-Draw 取代了早期一个名为 MultiFormatSave 的扩展，后者缺乏对 Draw 模块的支持。它很有用，因为在微软主导的世界里，你经常需要以不同格式创建同一文件的多个副本。它支持
    OpenDocument 格式（ODF，LibreOffice 的格式）、传统和现代 Microsoft Office 格式以及 PDF，每种格式都在同一目录中创建。当你保存文档时，你会找到此扩展（图
    5）。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_53_0.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_53_1.png)


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_54_0.png)


    图 3：代码高亮器扩展有助于将代码格式化为在 IDE 中呈现的效果。


    ### 审阅工具栏


    审阅工具栏并没有添加任何新功能。然而，它通过在一个工具栏中收集有用的功能（如跟踪更改、插入注释、编号和突出显示行）使编辑变得更加容易。使用审阅工具栏，所有这些工具只需单击即可使用。


    ### ZOTERO LIBREOFFICE 集成


    Writer 的文献引用工具已严重过时且使用笨拙。此扩展允许你用基于 Web 的工具 Zotero 替换标准工具。它的主要优势之一是允许在所有主要文献样式中轻松格式化。


    ### 注意事项


    这些例子应该让你对可用功能的多样性有一个大致的了解。开始浏览可用的扩展，你经常会发现一些你之前从未意识到自己需要的工具。


    对于用户而言，扩展是自定义 LibreOffice 和添加有用功能的简单方式。然而，你应该记住，有数百个扩展，而且它们并未经过系统性审查。因此，像字典或图库图片这样的资源不太可能比占用硬盘空间造成更大的危害，但其他扩展则具有更大的不确定性。你可以使用点赞或点踩评级作为扩展可靠性的粗略指南，但最终这并不能告诉你有关任何问题的信息。


    同样，没有办法确定扩展一起使用时会发生什么，尤其是当它们影响相同的功能时。使用多个扩展就像服用多种处方药——事先无法确定一个扩展可能会如何与其他扩展相互作用。


    此外，由于 LibreOffice 处于不断开发中，适用于某个版本的扩展可能不适用于另一个版本。不幸的是，虽然每个页面都有一个标签列出兼容性，但并非所有开发者都使用它——而且无论如何，确定扩展是否可用的唯一方法是安装它。如果它不起作用，你可以订阅官方站点的
    RSS 源，以便在新版本发布时得到通知。值得赞扬的是，许多开发者确实努力更新他们的扩展。


    不过，数据丢失的可能性极小，但你应该经常保存和备份以绝对确保安全。此外，如果你只从 LibreOffice 官方扩展站点下载，问题发生的可能性也会降低。但如果你确实遇到问题，你应该能够删除行为异常的扩展，最坏的情况也不过是失去一个喜欢的附加组件或资源。


    要点是，不要让对意外行为的担忧使你望而却步，不敢使用扩展。采取一些基本的预防措施，使用扩展可以极大地改善你的 LibreOffice 体验。最可能发生的最坏情况是，你在从系统中移除扩展之前，花费了一点时间下载和检查它。
    ■■■


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_54_1.png)


    图 4：导出为图像将 Draw 和 Impress 幻灯片转换为图像。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_54_2.png)


    图 5：当你需要同一文件的多种格式时，MultiFormatSave-Draw 可以节省数十次按键。


    ### 信息


    [1] **LibreOffice 扩展**：https://extensions.libreoffice.org/


    LIBREOFFICE 特刊 - 2020 年版本


    55


