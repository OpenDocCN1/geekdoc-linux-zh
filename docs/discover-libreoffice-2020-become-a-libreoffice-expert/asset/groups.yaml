  mdcn: "\n\n## 提升生产力\n### LibreOffice 宏\n\n#### BASE 数据库\n\nBase 应用程序允许你构建相当高级的数据库，用于存储各种数据，而\
    \ LibreOffice Basic 宏可以帮助你将其与其他 LibreOffice 应用程序集成。为了展示其在实践中的工作原理，我将创建一个简单的 Base\
    \ 数据库来存储文本片段，然后创建一个宏，将当前 Writer 文档中的选中文本保存到该数据库中。\n\n首先，我们需要创建一个 Base 数据库，其中包含一个单一的\
    \ snippets（片段）表，由两个字段组成：*id*（一个作为主键的 INTEGER 整型字段），以及 *snippet*（一个用于存储文本片段的 VARCHAR\
    \ 文本字段）。在创建数据库时，请勾选“是，为我注册数据库”复选框，以将该数据库注册为 LibreOffice 中的数据源。一旦数据库准备就绪，你就可以开始编写宏了（清单\
    \ 7）。\n\n为了建立与数据库的连接，宏使用了 ConnectToDatabase 函数（第 5 行）。这种方法更加灵活，因为允许你在需要时从其他任何宏建立连接。该函数（第\
    \ 16-30 行）包含一个简单的错误处理机制（第 19 行），当宏未能建立数据库连接时（第 28-29 行），它会终止宏并显示错误消息。\n\n该宏本身执行了几个操作。首先，它初始化当前文档并获取选区。然后，它建立与在\
    \ LibreOffice 下注册为 snippets 名称的数据库的连接。接下来，宏使用 Join() 和 Split() 例程对文本选区进行清理，正确转义单引号（'）字符，这是生成有效\
    \ SQL 查询所必需的。然后，宏构建一个 SQL 查询，将文本片段插入到 snippets 表中。\n\n#### 清单 6：HTML 格式化\n\n```\n\
    ...  \n04 MarkupHeadingsFunc(\"Heading 1\", \"<H1>\", \"</H1>\")  \n05 MarkupHeadingsFunc(\"\
    Heading 2\", \"<H2>\", \"</H2>\")  \n06 MarkupHeadingsFunc(\"Heading 3\", \"<H3>\"\
    , \"</H3>\")  \n07 MarkupTextFunc(\"CharWeight\", com.sun.star.awt.FontWeight.BOLD,\
