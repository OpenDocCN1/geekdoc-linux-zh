    # Document formatting made easy


    # Model Document


    LibreOffice templates can save you time with formatting your documents, so you
    can focus on the important stuff. *By Bruce Byfield*


    **Formatting documents is time-consuming. Even if you use styles, formatting can
    still take a lot of effort – effort that can be better spent developing content.
    In addition, if more than one person is working on a series of documents, you
    do not want everyone to do their own formatting with inevitably inconsistent results.
    The solution to both these problems is templates – special files for storing both
    structure and content for easy reuse. Used with styles, a well-designed template
    can save time and remain useful for years.**


    LibreOffice handles templates differently from other documents. To start with,
    you can tell a template from another LibreOffice file, because the second letter
    of its extension is always *t*. For example, a Writer template has an *.ott* extension
    rather than the usual *.odt*, while one for Impress has an *.otp* extension instead
    of the usual *.odp*. More importantly, to work within LibreOffice, a template
    must be registered as a template. Templates also have their own menus and menu
    items that are separate from those used by other files. These unique tools are
    designed to prevent the file corruption that used to be common in Microsoft Word
    and, in the pursuit of stability, place limitations on how you can interact with
    templates that can only be circumvented with some difficulty.


    # HOW TEMPLATES WORK


    Unlike Microsoft Word, LibreOffice does not display a default template anywhere
    in its menus. This omission eliminates the possibility of a document being corrupted
    by too much editing of the default template.


    The only way that you can alter LibreOffice’s default formats without using templates
    is to change the font settings in *Tools | Options | LibreOffice Writer | Basic
    Fonts (Western)*. Default formatting, such as page and list styles, cannot be
    edited globally, only individually.


    However, you can also design a template with far more formatting information as
    a default. Its settings will be used for every document when you select *File
    | New*, unless you specifically select another template.


    Note that there is a distinction in LibreOffice documentation between the default
    template (the one built into LibreOffice) and the Default template (the one you
    select to use for every document). The default can be the Default, but it still
    exists when another template becomes Default. If the Default is deleted, the built-in
    default is used instead.


    # PLANNING AND NAMING TEMPLATES


    Many resist using templates on the grounds that each of their documents is unique.
    However, this claim is more a failure of imagination than anything else. If nothing
    else, almost everyone has design preferences. For instance, it may be a favorite
    font or, perhaps, corporate colors. Put these preferences into your default template,
    and you can get to work at once without setting the format each time. Your default
    template can also be the basis of other documents. If you are unsure what other
    templates you might want to create, consider what sorts of documents you are constantly
    creating, whether they are memos, letters, or essays. To jog your memory, have
    a look in *Files | Recent Documents*. Check what files you attach to emails. If
    all else fails, make a note of the documents you produce over several weeks. The'
