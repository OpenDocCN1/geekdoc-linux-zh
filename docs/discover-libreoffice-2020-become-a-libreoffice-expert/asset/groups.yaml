    # ### LibreOffice 社区


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_89_0.png)


    德国和 LibreOffice 有着密切的联系；LibreOffice 的前身 StarOffice 最初在汉堡开发。


    展位上其他常见话题包括 LibreLogo、宏、邮件合并以及套件中的其他功能。有几位访客演示了他们在软件中发现的小 bug，这些对于创建错误报告很有用。除了协助展位工作外，Stefan
    还做了一场关于“LibreOffice Online in EGroupware”的讲座。


