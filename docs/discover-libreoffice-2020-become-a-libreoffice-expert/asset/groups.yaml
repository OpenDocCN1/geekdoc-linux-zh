    ## LibreOffice Community


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_90_0.png)


    Manager at Kampabits, “a youth-based organization founded in 2010 that uses ICT
    multimedia creatively to improve the lives of less privileged youth from the non-formal
    settlements. It also creates safe spaces for persons with disabilities to freely
    express themselves while learning these in-demand skills.”


    Kampabits also runs a Women in Tech project that trains 15 women in advanced coding
    skills to make them employable in a period of six months. This project focuses
    on women who have prior knowledge of computer basics.


    Emmanuel uses free and open source software for all of the training, including
    LibreOffice, Gimp, and various GNU/Linux distributions.


    ## THANKS TO EVERYONE


    It’s thanks to this worldwide community that LibreOffice keeps getting better
    and better with every release. Without them, the software wouldn’t be available
    in so many languages, making its way into schools, governments, businesses, and
    homes around the globe. Everyone is welcome to join the community – see the next
    page for more details about this!


    ## EVENTS IN 2020


    You’ve probably noticed that the community events we’ve covered so far took place
    in 2019. Due to COVID-19, very few events have taken place in-person. This is
    quite frustrating for many people in the community, as they


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_90_1.png)


    really enjoy meeting face-to-face and chatting over food and drink. Indeed, the
    LibreOffice Conference, which was scheduled to take place in Nuremberg, Germany,
    has moved online.


    Still, it’s not the end of the world. Online events have their advantages: Anyone
    can easily take part, without having to travel long distances, for instance. Daniel
    A. Rodriguez, a LibreOffice contributor based in Argentina and TDF Board member,
    talks about an online meetup that took place during the early stages of the pandemic:


    > “In May, the Hispanic LibreOffice community held an online event via TDF’s Jitsi
    instance, and streamed on YouTube. The event started 17:00 UTC and last almost
    4 hours. More that 35 people took part, which benefited from the presence of several
    members who are well-recognised for their participation and collaboration in the
    project. Celia Palacios, from Mexico, told us about the work of the documentation
    team, while Mauricio Baeza, also from the Aztec land, talked about the potential
    of macros using Python. Xisco Fausil, from Spain, explained how quality control
    is applied to software in the development stages, and Ísmael Fario, another Spaniard,
    presented pivot tables. Finally, Gustavo Pacheco, from Brazil, talked about becoming
    a member of The Document Foundation and invited everyone to apply.”


    ## INFO


    - [1] Certified developers: [https://www.documentfoundation.org/gethelp/developers/](https://www.documentfoundation.org/gethelp/developers/)

    - [2] Get involved: [https://www.libreoffice.org/community/get-involved/](https://www.libreoffice.org/community/get-involved/)

    - [3] LibreOffice Online: [https://www.libreoffice.org/download/libreoffice-online/](https://www.libreoffice.org/download/libreoffice-online/)


    ## AUTHOR


    Mike Saunders works in Marketing and Community Outreach at The Document Foundation.
    He helps to spread the word about the software, and bring in new contributors
    to the project.


    ## Getting involved with the LibreOffice community


    ### # Everyone Welcome


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_91_0.png)


    Join the LibreOffice community and help to improve the software. You don''t need
    to be a programmer; there are lots of ways to dive in and build your skills! By
    Mike Saunders


    LibreOffice is community-driven and developed software that is a project of the
    nonprofit organization, The Document Foundation (TDF). LibreOffice is developed
    by users who believe in the principles of free and open source software and in
    sharing their work with the world in nonrestrictive ways. At the core of these
    principles are the four essential freedoms and the tenets of TDF''s Next Decade
    Manifesto [1] to which the community commits itself:


    - *To eliminate the digital divide in society by giving everyone access to office
    productivity tools free of charge to enable them to participate as full citizens
    in the 21st century*

    - *To support the preservation of mother tongues by encouraging people to translate,
    document, support, and promote our office productivity tools in their mother tongue*

    - *To allowing users of office productivity software to retain the intellectual
    property in the documents they create by use of open document formats and open
    standards*

    - *To an open and transparent peer-reviewed software development process where
    technical excellence is valued*


    Similarly, the manifesto rejects:


    - *The creeping domination of computer desktops by a single language, forcing
    all people to learn a foreign language before they can express themselves electronically*

    - *The ownership of file formats by proprietary software companies – documents
    belong to their creators, not software vendors*

    - *A closed software development process where errors can lie hidden and poor
    quality is accepted*


    ### ESSENTIAL FREEDOMS


    The LibreOffice community believes that users should have the freedom to run,
    copy, distribute, study, change, and improve the software that it distributes.
    While TDF does offer no-cost downloads of the LibreOffice suite of programs, free
    software is first and foremost a matter of liberty, not price. LibreOffice supporters
    campaign for these freedoms because they believe that everyone deserves them.


    Similarly, the community seeks to eliminate the digital divide and empower all
    as full citizens, support the preservation of mother tongues, and avoid proprietary
    software and format lock-in. The LibreOffice community works to attain its goals
    [2] by:


    - Providing unfettered access to office productivity tools at no cost


    ### COMMUNITY


    #### Get Involved


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_0.png)


    LibreOffice''s worldwide community – shown here at the LibreOffice Conference
    in 2018 in Albania – promotes free software and open standards.


    - *Encouraging the translation, documentation, and maintenance of the LibreOffice
    software in one''s native language*

    - *Promoting and actively participating in the creation and development of open
    standards and Free Software via open and transparent peer-review processes*


    Although the members of the LibreOffice community hail from many different backgrounds,
    they all value personal choice and transparency, which translates practically
    into wider compatibility, more utility, and no end-user lock-in to a single product.
    They believe that free software can provide better quality, higher reliability,
    increased security, and greater flexibility than proprietary alternatives.


    The community behind LibreOffice is the heart of the project, without which it
    would not have the resources to continue developing the LibreOffice software.
    The passion and drive that every individual brings to the community results in
    collaborative development that often exceeds the community’s own expectations.
    With dozens of different but essential roles in the project, everyone is invited
    to join in the work and help to make LibreOffice known and accessible to all.


    The TDF statutes, developed by the LibreOffice community members, guide the way
    they work and encourage new members to contribute in a way that benefits both
    the whole community as well as themselves. Through the use of copyleft licenses,
    such as the GNU Lesser General Public License, Mozilla Public License, and Creative
    Commons Attribution-ShareAlike License, the community commits to protecting users''
    rights as developers and content creators.


    ### PEOPLE IN THE PROJECT


    Before showing how you can get involved in the LibreOffice community, let’s take
    a quick look at the different TDF “bodies.” They all work together to ensure that
    LibreOffice remains strong with continued development. As you get more involved
    in the project, you’ll come across them in one way or another. The TDF bodies
    include:


    - The Board of Directors (BoD) is the main administration of TDF’s projects and
    teams. Board members are the foundation’s judicial and extra-judicial representatives.

    - The Membership Committee (MC) administers membership applications and renewals
    and oversees election of the BoD.

    - The Board of Trustees (Members) consists of all people actively contributing
    to TDF’s projects. To be acknowledged as a member, you need to meet the criteria
    defined in TDF’s statutes and apply for membership using their application form.


    Additionally, there are some entities, which are not formal TDF bodies, that help
    the BoD further TDF’s projects:


    - The Engineering Steering Committee (ESC) provides technological guidance on
    strategic matters and hypothetically will consist of the community’s best engineers.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_92_1.png)


    Lothar Becker is the BoD Chairman of TDF, the nonprofit entity behind LibreOffice.

