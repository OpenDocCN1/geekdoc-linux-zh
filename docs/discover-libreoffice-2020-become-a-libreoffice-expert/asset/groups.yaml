    - Make all formatting changes on the template. Then apply the revised template
    to the document.

    - Apply changes to a document as soon as they are made in the template. That way,
    you will not have to remember what changed, or wonder if you made an accidental
    change the next time that you open the document.


    It can take several hours to design a template. Probably, you will want to make
    some tweaks after working with the template a time or two. However, once a template
    does what you want, it can save you hours and remain useful for years. Discipline
    yourself and work with the template system rather than opting for short-term convenience,
    and templates can be one of your most valuable tools in LibreOffice. ■■


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_58_0.png)


    Figure 5: Loading styles from a template gives the effect of switching templates
    without actually doing so.


