    ## 使用单元格样式

    在众多电子表格软件中，Calc 在样式使用上是独一无二的 – 具体来说，用于单元格和页面。与 Writer 一样，Calc 样式可以基于现有样式，以节省时间并提供统一的外观。Calc
    样式可以应用于单个或多个单元格、整列或整行，或者通过点击第 1 行上方和 A 列左侧的空白区域，应用于整个工作表。按 F11 以在“样式和格式”对话框中显示和编辑样式。如果您已经使用了手动（直接）格式化，您应该选择“格式
    | 清除直接格式化”，以避免在应用样式时遇到困难。


    Calc 安装时附带了一些默认单元格样式。这些样式包含许多预定义设置，主要用于不同的目的，例如标题。其他单元格样式列在“状态”下，旨在标记对当前工作状态的评价，并随着改进的添加而更改。您可能还希望创建单元格样式来标记包含特定函数的单元格的汇总或总计。相比之下，Calc
    仅附带两种页面样式，但可以根据需要添加更多样式。


    单元格样式支持“字体”和“字体效果”设置，“单元格样式”和“页面样式”对话框均有“边框”和“背景”选项卡。这些选项卡几乎与其他 LibreOffice 模块中的选项卡相同，多样化的字体、边框和背景是区分不同数据数组的一种方法（图
    11）。


    然而，Calc 样式确实包含一些在 LibreOffice 其他地方不可用的选项卡。在“单元格样式”中，最重要的选项卡之一是“数字”选项卡。虽然 Calc
    默认假设所有字符都是从左边距开始的待显示文本，所有数字都是从右边距开始的待显示数字，但您可以从“数字”选项卡指定单元格包含的信息类型。从同一选项卡，您可以选择日期等信息的格式。语言和区域设置也在“数字”选项卡中，因为它们决定不同类型数字的默认格式，包括用于使大数字更易读的十进制分隔符（图
    12）。


    单元格的第二个独特选项卡是“对齐方式”。从“对齐方式”选项卡，您可以按角度定位单元格条目，这可以在标题中节省空间。更重要的是，您可以设置文本自动换行和自动连字符，这两个设置使工作表更易读。您可能还会选择缩小内容以适应单元格大小，尽管这可能是一种对用户不友好的选择（图
    13）。


    单元格的第三个独特选项卡是“单元格保护”。在那里，您可以设置是保护整个工作表还是仅保护公式，或者是否在打印时隐藏单元格。这些设置主要不是为了安全，而是为了防止意外损坏并减少杂乱。


    页面样式仅在打印电子表格时发挥作用。为方便起见，您可以为每一页添加页眉和页脚，使用的选项卡类似于 Writer 段落样式。对于页面来说，最重要的选项卡可能是“工作表”选项卡，其中包含关于工作表如何
