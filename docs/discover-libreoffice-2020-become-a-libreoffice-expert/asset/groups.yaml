    Over the following years, Sun and the OpenOffice.org community worked on new releases
    of the software, but there was ongoing concern that a single large company had
    a lot of sway in the project. Some ideas were brought up by the community, such
    as an independent foundation to oversee OpenOffice.org development, but nothing
    came of it.


