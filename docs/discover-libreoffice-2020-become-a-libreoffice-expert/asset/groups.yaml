    # GET PRODUCTIVE


    # LibreOffice Macros


    # Automating LibreOffice with macros


    # Office Automation


    LibreOffice packs a built-in Basic-like scripting language that can be used to
    automate repetitive tasks and extend the suite’s default functionality. *By Dimitri
    Popov*


    In skilled hands, the LibreOffice Basic scripting language can do wonders, but
    you don’t have to be a programming expert to write simple, or even more advanced,
    macros that perform useful tasks. Whether you are a Linux home user or an IT specialist,
    you can use the built-in scripting powers of the LibreOffice suite to automate
    recurring tasks. This article provides some examples you can use as building blocks
    for your own LibreOffice coding projects.


    # LOOKING UP WORDS


    The LibreOffice Basic macro editor is reachable through *Tools | Macros | Edit
    Macros* (Figure 1). Traditionally, an introduction to a programming language starts
    with a simple example that displays the “Hello world!” message. Although it’s
    cute, it’s not particularly useful, so instead, I’ll start with something more
    practical: a simple macro to look up the currently selected word in Wikipedia.
    The key element of the macro is the built-in *Shell1* function [1], which is used
    to call external programs. For example, you can use the following code to open
    the default browser on your machine:


    ```

    Sub Main

    Shell1 ("xdg-open", 1)

    End Sub

    ```


    The *Shell1* function requires the name of the program to run (you might need
    to add the path if the application is not in a location included in Bash’s *$PATH*
    environment variable). The second parameter is how you want the program to be
    opened (e.g., full-screen; minimized, maximized, or hidden program window; with
    and without focus, etc.).


    For the record, *xdg-open* is the most common way to call the user’s preferred
    application for a given file type or URL. For example, running


    ```

    xdg-open http://<some.url>

    ```


    opens *http://<some.url>* in the user’s preferred web browser.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_59_0.png)


    Figure 1: The LibreOffice macro editor.'
