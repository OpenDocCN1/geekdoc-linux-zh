    # LIBREOFFICE SPECIAL


    # Get Productive


    +   50 **Open Document Format**

    +   The Open Document Format standard is an important reason for the success of
    LibreOffice.


    +   66 **LibreOffice Typography**

    +   LibreOffice Writer is a serviceable desktop publisher with more typography
    features than most users imagine.


    +   53 **LibreOffice Extensions**

    +   You can extend the power of LibreOffice with over 350 useful extensions.


    +   70 **Digital Signatures**

    +   By adding a digital signature, you can boost your document''s security.


    +   56 **LibreOffice Templates**

    +   LibreOffice templates can save you time with formatting your documents, so
    you can focus on the important stuff.


    +   74 **ODF XML**

    +   You may have heard that LibreOffice files “are XML-based” or “use XML,” but
    when you try to open a Writer document in a text editor, you only see a binary
    blob. Learn how to access and modify the hidden XML content using scripts.


    +   60 **LibreOffice Macros**

    +   LibreOffice packs a built-in Basic-like scripting language that can be used
    to automate repetitive tasks and extend the suite’s default functionality.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_4_0.png)


    +   82 **Hidden Gems of LibreOffice**

    +   Discover some hidden and lesser known LibreOffice features.


    # Community


    +   88 **LibreOffice Community**

    +   Who makes LibreOffice? How does everyone work together? And what are they
    working on? Here’s an update on what’s happening in the global LibreOffice community.


    +   92 **Get Involved**

    +   Join the LibreOffice community and help to improve the software. You don’t
    need to be a programmer; there are lots of ways to dive in and build your skills!


