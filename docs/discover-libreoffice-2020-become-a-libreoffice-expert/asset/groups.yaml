    # 入门指南


    LibreOffice 文本


    ## 基于样式的文字处理系统

    ### 样式大师


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_13_0.png)


    Writer 是 LibreOffice 的文字处理组件，它不仅仅是一个文本编辑器。凭借其强大的样式系统，你可以为商务和个人用途构建详细且优雅的文档。文 /
    *Mike Saunders*


    在 20 世纪 80 年代，文字处理器本质上是一个带有一些额外功能的文本编辑器——换句话说，是一个用于处理你文字的工具。然而如今，人们对这类程序的期望要高得多：丰富的版式功能、与其他办公软件的高兼容性，以及组织和导航复杂文档的能力。Writer
    是 LibreOffice 的文字处理器，它是一个功能 exceptionally 强大的工具，其样式系统确实有助于保持文档的一致性——关于这一点稍后会有更多介绍。首先，让我们熟悉一下基础知识！当你启动
    LibreOffice 并选择一个新的 Writer 文档（或者如果你已经运行了该应用程序，请在菜单中转到 *文件 | 新建 | 文本文档*），将会打开一个窗口（图
    1），具有以下功能：


    - 1. **菜单栏：** 你可以从这里访问几乎所有功能。点击、探索，看看 Writer 能做什么！

    - 2. **工具栏：** 提供常用功能的快速访问。点击右侧的箭头以显示更多图标，或者右键点击工具栏以选择显示哪些图标。

    - 3. **样式：** 显示预定义样式的列表，你可以向其中添加更多样式。建议使用样式而不是手动设置每段文字的字体、字号、字符样式等，这是一个好主意。

    - 4. **侧边栏：** LibreOffice 的用户界面非常灵活，侧边栏允许你调整文档各个部分的设置。点击并拖动箭头以展开它。

    - 5. **状态栏：** 显示页数、字数、使用的语言（点击可切换其他语言）以及文档是否已修改。

    - 6. **视图模式：** 这些图标允许你更改文档的查看方式（例如，单页显示或并排显示）。

    - 7. **缩放级别：** 点击并拖动滑块（或使用加减按钮）来放大或缩小文档。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_0.png)


    图 1：LibreOffice Writer 中的新建文本文档：菜单栏 (1)、工具栏 (2)、样式 (3)、侧边栏 (4)、状态栏 (5)、视图模式 (6)
    和缩放级别 (7)。


    # 自定义界面


    我不打算在这里解释每一个工具栏按钮的具体功能；你只需将鼠标悬停在按钮上并阅读提示框即可探索它们。不过，有几点需要注意：撤销和重做按钮旁边有下拉列表，因此你可以选择在单次点击中撤销/重做多少操作（这通常能节省大量时间）。类似地，列表（项目符号列表和编号列表）也有不同的样式可供选择。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_1.png)


    图 2：Writer 提供三种不同的用户界面布局。


    图 1 显示的是标准布局，包含菜单栏、两个工具栏、侧边栏以及底部的状态栏。然而，LibreOffice 开发人员认为不应强制最终用户采用任何特定的界面，因此他们提供了大量的灵活性。例如，在菜单中转到“视图
    | 工具栏”，你可以看到可以启用或禁用许多额外的工具栏。


    更好的是，转到“视图 | 用户界面”，在那里你可以选择三个选项（图 2）：标准工具栏（默认模式）、单一工具栏（如果你屏幕垂直空间有限，这将很有用）和侧边栏（如果你使用的是超宽显示器并希望更好地利用水平空间，这是一个不错的选择）。尝试使用所有选项，看看哪个最适合你的屏幕尺寸和工作流程。


    如前所述，你可以点击并拖动侧边栏旁边的箭头手柄来调整其大小。当你打开侧边栏时，试着将鼠标悬停在侧边栏右侧的图标上以显示提示框。侧边栏中的“属性”面板是特定于上下文的；换句话说，它会根据你在文档中的操作而变化（编辑文本、操作图像、处理表格等）。因此，如果你想对文档中的某个元素执行特定操作或修改，但不确定该去哪里，请点击该元素，然后打开“属性”面板。


    通过“工具 | 选项”（在 Windows 和 Linux 上）或“LibreOffice | 偏好设置”（在 macOS 上）还可以获得一些额外的自定义选项。打开左侧的“LibreOffice
    文本”部分，然后探索下面的各种选项。


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_14_2.png)


    图 3：向页眉和页脚添加静态文本和页码很容易。


    # 十大实用功能


    以下是 Writer 中最有用的 10 项功能：


    - 1. **页眉和页脚：** 这些是每页开头和结尾的部分，通常在页面间保持一致，尽管你可以引入变化的元素。页眉和页脚最常见的用例是标题。要向页眉或页脚添加文本，首先需要为它们创建空间；只需点击主页面部分上方或下方的区域，你就会看到一个蓝色框。点击它以添加页眉或页脚空间，蓝色框随后会变成菜单（图
    3）。从这里，你可以直接在页眉或页脚中添加文本，这些文本将在所有页面中保持一致，并添加页码和页数（通常出现在书籍的页脚中）。


    - 2. **图片和文本框：** 如果你想将 Writer 作为桌面出版工具使用，那么你会想在页面上添加浮动元素，如图片和文本框。你可以在 *插入* 菜单中找到其中大部分功能。


    对于图片，系统会提示你从计算机中选择一张图片，然后该图片会显示在页面上。点击并拖动以移动它，或使用边缘和角上的蓝色手柄调整其大小。


    如果你想更改图片与周围文本的交互方式，请右键点击该图片并选择“环绕”菜单。*最优页面环绕* 是图片的最佳选择，可以让文本很好地围绕其流动。


    在这个右键上下文菜单中，还可以查看“属性”以获取更多选项，包括图片边框和精确位置。


    文本框的工作方式类似：点击 *插入 | 文本框*，然后点击并拖动以在页面上定位。之后，你可以使用手柄拖动它并在其中点击以添加文本。


    - 3. **修订记录：** 如果你与他人合作编辑文档，这是一个基本功能。首先，转到 *工具 | 选项*（或在 macOS 上，*LibreOffice |
    偏好设置*）。在 *LibreOffice | 用户数据* 下，你可以输入你的名字——这不是强制性的，但这意味着你的名字将显示在更改和评论旁边。这有助于其他正在处理文档的人确切知道谁更改了什么。点击“确定”，然后在
    *编辑* 菜单下，转到 *修订记录* 子菜单，确保 *记录和显示* 都已启用。


    现在尝试输入；你会看到你对文档的更新被标记上颜色和下划线。将鼠标悬停在某个更改上，会出现一个提示框，提供有关谁在何时做了哪些更改的信息。如果有人发给你一份文档，你想提供具有建设性的反馈，详细说明你做了哪些更改，现在你知道该怎么做！


    - 4. **评论：** 与上一个功能相关，此选项对于协作非常重要。将光标放置在你想要留下评论的行或段落内，然后点击 *插入 | 评论*。文档右侧会出现一个框（图
    4），你可以从中添加一些评论文本。你的名字（以及你发表评论的时间）也会显示出来。此外，点击评论框中的下拉图标以获取一些额外选项（例如，删除评论）。


    - 5. **拼写检查：** 根据你的操作系统设置，这可能已经启用，如果没有，请点击 *工具 | 自动拼写检查*。正如你期望的现代文字处理器那样，拼写错误的文本会以红色下划线标出。如果你正在处理一些不属于标准词典的单词，但又不希望总是看到表示“这是错误的”红色下划线，只需右键点击该单词并将其添加到词典中（或忽略它）。


    如果你从 LibreOffice 网站安装了多个词典，并想要更改用于拼写检查的词典，请点击状态栏底部的语言。（你也可以在 *工具 | 语言* 中按段落级别进行更改。）要获取更多语言选项，请转到
    *工具 | 选项, 语言设置和语言*，在那里你可以设置所有文档的默认语言。


    - 6. **页面布局：** 你已经在工具栏中看到了基本格式选项（字体、字号、粗体/斜体/下划线、颜色等），但对于更广泛的页面选项，请在菜单中转到 *格式
    | 页面*。在这里，你可以切换纵向和横向模式，选择不同的页面尺寸，调整页边距和边框，甚至在 *区域* 选项卡下提供背景渐变或图片。


    - 7. **导航器：** 随着文档复杂度的增加，包含多个元素、样式、标题等，你可能会发现它们更难导航。幸运的是，你可以使用命名巧妙的导航器来提供帮助：点击
    *视图 | 导航器* 以启用它，或在侧边栏中找到它（图 5）。点击不同元素旁边的箭头以展开它们。


    - 8. **特殊字符：** 如果你需要插入键盘上不可用的字符或符号，请转到 *插入 | 特殊字符*（


