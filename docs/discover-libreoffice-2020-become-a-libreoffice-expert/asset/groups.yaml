    +   9. **Autocorrect:** LibreOffice Writer tries to give you a helping hand by
    automatically formatting certain things (such as dates) or making corrections
    to words you have misspelled. If you don’t want this, though, go to *Tools | AutoCorrect
    Options* in the menu. Look at the *Replace* tab in the dialog that appears to
    see what LibreOffice automatically replaces. If you don’t want any of these automatic
    replacements, go to the *Options* tab and uncheck *Use replacement table*. This
