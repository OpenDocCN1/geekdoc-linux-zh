    # Using Digital Signatures


    # Secure

    Documents


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_69_0.png)


    > By adding a digital signature, you can boost your document''s security. *By
    Bruce Byfield*


    A digital signature verifies a document’s trustworthiness. It guarantees that
    the sender is who they claim to be, and that the document has not been edited
    since it was signed. Ordinary file sharing may not require one, but if privacy
    is important – particularly in business or when financial matters are discussed
    – then a digital signature is one of the main ways to safeguard a file’s contents.


    Originally, a digital signature was created by a third-party certificate manager,
    which offered a certificate guaranteeing the document’s integrity. LibreOffice
    continues to refer to digital signatures as, but, somewhat confusingly, uses the
    same term to refer to a GNU Privacy Guard (GPG) key that serves the same purpose.
    GPG [1] is a cross-platform method of encryption that can be installed on Linux,
    macOS, or Windows. Although a third-party service refers to certificates and GPG
    refers to keys, both operate in a similar manner. Both consist of a private certificate
    or key and a public one that the recipient must be sent in order to read the sent
    files. As the originator, you can use the certificate or key to read your own
    encrypted files.


    Creating either the certificate or the key is the time-consuming part of using
    a digital signature. Once you have created one, it is simply a case of associating
    the digital signature with the file, which is a matter of minutes in any of LibreOffice’s
    main modules.


    # SETTING UP A CERTIFICATE


    A few years ago, using a certificate authority was expensive. Practically speaking,
    certificate authorities were beyond the average home user’s means. However, today,
    many free certificate authorities exist. These free certificate authorities sometimes
    lack all the features of traditional certificate authorities, and the certificates
    they issue are sometimes valid for a limited time. For example, certificates from
    the Linux Foundation’s Let’s Encrypt [2] are only good for 90 days unless deliberately
    renewed. However, in many cases, these free certificates are good enough for the
    average user.


    Describing the procedure for all major certificate authorities would be too lengthy
    to go into here. However, these steps for Let’s Encrypt (Figure 1) should be similar
    enough to those for other certificate authorities for you to adjust as needed:'
  - "[PAGE 70]\n\n# GET PRODUCTIVE\n\n# Digital Signatures\n\n+   1.  Sign in and\
    \ follow the steps to generate a certificate. You will be asked to name the certificate,\
    \ specify the encryption type, identify the web server with which to associate\
    \ the certificate, provide details about your location, and select whether you\
    \ want to renew the certificate automatically or let it expire.\n+   \n+   2.\
    \  Add the certificate's URL in your web browser's preferences and set up and\
    \ make it available for files.\n+   \n+   3.  Apply the certificate to a file\
    \ via *File* | *Digital Signature* | *Digital Signatures* ... , and then restart\
    \ Writer.\n+   \n+       You will need the passphrase for the key (Figure 2).\
    \ From the same\n\ndialog window, you can view or remove a certificate, as well\
    \ as sign a document with it.\n\n# USING GPG\n\nGPG is a cross-platform encryption\
    \ tool that is available under a variety of similar names. Using it for a digital\
    \ certificate has the advantage of being free, requiring no registration, and\
    \ expiring when you choose. In addition, because GPG keys are a self-contained\
    \ system, they do not need to be registered on a web server to be used – although\
    \ you do need to send your public encryption key separately to those who will\
    \ receive your files.\n\nTo generate keys with GPG, run the command:\n\n```\n\
    gpg --full-generate-key\n```\n\nGPG takes you through five steps to create a key:\
    \ adding your name and email, creating a passphrase, choosing the algorithm, setting\
    \ the key size, and assigning an expiration date. If you are unsure about some\
    \ of the possible choices, you can simply accept the defaults. These don't always\
    \ offer the highest level of encryption, but they should be adequate in most cases.\
    \ If you want the highest possible security, you can always research the choices\
    \ as you encounter them (Figure 3).\n\nAs a last step, you should create a revocation\
    \ certificate so that you can make the new key invalid if it is ever compromised\
    \ by running the command:\n\n```\ngpg --armor --output revoke.asc \\\n--gen-revoke\
    \ PUBLIC-KEY-ID\n```\n\nOnce the key is created, you can send out the public key\
    \ to the intended recipients of your digitally signed files with\n\n```\ngpg --output\
    \ YOURNAME.gpg \\\n--export KEY-EMAIL\n```\n\nor as a protected plain text file\
    \ with the format:\n\n```\ngpg --armor --output YOURNAME.gpg \\\n--export KEY-EMAIL\n\
    ```\n\nFrom within LibreOffice, the key can be selected from *Files* | *Digital\
    \ Signature* | *Digital Signature* ... , by navigating to the directory where\
    \ it is located.\n\nRecipients of the file who have your public key can verify\
    \ it is from you with:\n\n```\ngpg --fingerprint KEY-EMAIL\n```\n\n![](img/e39350c3a7c0d527d71b0e4097a0ba66_70_0.png)\n\
    \n![](img/e39350c3a7c0d527d71b0e4097a0ba66_70_1.png)\n\n```\nbb@nanday:$ gpg --full-generate-key\n\
    \   gpg (GnuPG) 2.1.18; Copyright (C) 2017 Free Software Foundation, Inc.\n  \
    \ This is free software: you are free to change and redistribute it.\n   There\
    \ is NO WARRANTY, to the extent permitted by law.\n\n   Please select what kind\
    \ of key you want:\n    (1) RSA and RSA (default)\n    (2) DSA and Elgamal\n \
    \   (3) DSA (sign only)\n    (4) RSA (sign only)\n   Your selection?\n```\n\n\
    Figure 3: GPG keys are a modern alternative to using a certificate."
