    # GET STARTED


    ## Introducing LibreOffice


    ## INSTALLING ON WINDOWS


    - 1. Get the .msi installation file appropriate for your system (file name ending
    in win_x64.msi for 64-bit systems or win_x86.msi for 32-bit systems). Save the
    file onto your desktop, and then double-click it to start the installation process.

    - 2. The installer wizard will appear, and you can simply keep clicking Next to
    accept the default options, which are perfectly fine for everyday use. (If a *User
    Account Control* dialog appears during the process, click Yes to continue the
    installation.)

    - 3. When the installation is complete, click *Finish*, and you can now delete
    the .msi file from your desktop. Your shiny new LibreOffice installation is available
    in your program menu!


    If you need any help, check out the installation instructions on the website [7],
    or if you get stuck, try asking the LibreOffice support community [8]. When posting
    a message, remember to include lots of detail (LibreOffice version, operating
    system version, and any error messages you see).


    ## macOS


    LibreOffice for macOS is provided in .dmg format, which is a virtual disk. Save
    the .dmg file to your desktop and double-click it to open. You’ll see a window
    like the one in Figure 8 – click and drag the LibreOffice icon into your Applications
    folder. (You may be required to enter your administrator password.) You can then
    launch the new software directly from the *Applications* folder (or drag the icon
    into your dock for easy access). You can also eject and delete the .dmg file.


    ![](img/e39350c3a7c0d527d71b0e4097a0ba66_11_0.png)


    ## LINUX


    The latest version of LibreOffice is available in .deb and RPM package formats
    on the DVD enclosed with this issue, but I generally recommend installing it directly
    from your Linux distribution’s package manager. This provides better integration
    with your distro and the possibility of automatic updates in the future. If you
    want to install from the latest .deb or RPM files though, follow the detailed
    steps on the wiki [9].


    ## CONCLUSION


    LibreOffice is a sophisticated office productivity suite that is available at
    no cost to Windows, macOS, and Linux users around the world. If you’re ready to
    start creating spreadsheets, presentations, and word processing documents without
    pooling your money into overpriced tools and complicated licensing scenarios,
    read on to discover the power and versatility of LibreOffice. ■■■


    ## SO LET’S INSTALL IT!


    You’ll find the full version of LibreOffice on the DVD supplied with this magazine,
    but you can also download it at any time from the LibreOffice website [5]. The
    software is available for the three major desktop operating systems - Windows,
    macOS and Linux, although the themes and colors might vary depending on your system.
    The first step is to check out the system requirements:


    - ■ Windows: Microsoft Windows 7 SP1, Windows 8, Windows Server 2012, or Windows
    10

    - ■ Apple macOS (aka macOS X): macOS 10.10 (Yosemite) or higher

    - ■ Linux: Linux kernel 3.10 or higher


