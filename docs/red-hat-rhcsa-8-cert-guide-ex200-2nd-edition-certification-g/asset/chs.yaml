  \ config 7e4d58f0e5 done\nWriting manifest to image destination\nStoring signatures\n\
  \n/docker-entrypoint.sh: /docker-entrypoint.d/ is not empty, will\nattempt to perform\
  \ configuration\n/docker-entrypoint.sh: Looking for shell scripts in\n/docker-entrypoint.d/\n\
  /docker-entrypoint.sh: Launching /docker-entrypoint.d/10-listen-on-\nipv6-by-default.sh\n\
  10-listen-on-ipv6-by-default.sh: Getting the checksum of /etc/nginx/\nconf.d/default.conf\n\
  10-listen-on-ipv6-by-default.sh: Enabled listen on IPv6 in /etc/nginx/\nconf.d/default.conf\n\
  /docker-entrypoint.sh: Launching /docker-entrypoint.d/20-envsubst-\non-templates.sh\n\
  /docker-entrypoint.sh: Configuration complete; ready for start up\n```\n\n如你在示例\
  \ 26-1 所示，在运行容器时，`podman` 首先联系几个容器镜像仓库。在 Docker 镜像仓库中找到 nginx 镜像后，它开始下载（拉取”）镜像。镜像从\
  \ DockerHub 拉取这可能看起来很奇怪，但这是因为 `podman` 仍然使用 Docker 格式的容器镜像。容器镜像通常由多个层组成，这就是为什么你可以看到不同的二进制块（blobs）。当镜像文件在你的本地服务器上可用时，nginx\
  \ 容器就会启动。正如你所注意到的，容器在前台运行。使用 `Ctrl-c` 终止容器。\n\n你通常希望在分离模式下（在后台运行容器）或在你可以访问容器控制台的模式下运行容器。你可以使用\
  \ `podman run -d nginx` 在分离模式下运行容器。当你以分离模式运行时，它实际上像守护进程一样在后台运行。或者，你可以在交互式 TTY 模式下运行容器。在这种模式下，你可以访问容器的\
  \ TTY，并从那里在容器内工作。要在交互式 TTY 模式下启动容器，请使用命令 `podman run -it nginx`。以这种方式启动容器后，你就有 TTY\
  \ 的访问权限，你输入的所有命令都将进入容器，而不是进入主机操作系统。\n\n当你在交互式模式下运行时，有两种方法可以退出：\n\n* 使用 `exit` 退出\
  \ TTY 模式。取决于你如何启动容器，此命令可能会关闭容器。\n* 使用 `ctrl-p`、`ctrl-q` 分离。这种方法确保在所有情况下容器都会以分离模式在后台继续运行。\n\
  \n要获取当前运行容器的概览，你可以使用 `podman ps` 命令。如果你还想查看运行过但现在未活跃的容器，请使用 `podman ps -a`。在示例 26-2\
  \ 中，你可以看到 `podman ps -a` 命令的输出。\n\n**示例 26-2** `podman ps -a` 输出\n\n点击此处查看代码图片\n\
  \n```\nstudent@podman ~]$ podman ps -a\nCONTAINER ID  IMAGE          COMMAND   \
  \ CREATED          STATUS     PORTS          NAMES\n1f6426109d3f  docker.io/   \
