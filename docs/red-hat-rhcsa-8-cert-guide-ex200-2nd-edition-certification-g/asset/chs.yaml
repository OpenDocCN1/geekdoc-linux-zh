  3. `/etc/modprobe.d/somefilename`\n4. `/usr/lib/modprobe.d/somefilename`\n\n## 10.](#appa.xhtml_rquiz16_10)\
  \ 关于更新内核的哪些说法错误的？\n\n1. `yum update kernel` 命令安装新内核而不是更新它。\n2. `yum install kernel`\
  \ 命令安装新内核并保留旧内核。\n3. 内核包应被设置为 `yum` 保护包以确保更新后旧内核仍然可用。\n4. 安装新内核版本后，你必须运行 `grub2-mkconfig`\
  \ 命令修改 GRUB 2 启动菜单，以便显示旧内核和新安装的内核。\n\n### 基础主题\n\n### 理解 Linux 内核的作用\n\nLinux 内核是操作系统的核心。它是从\
  \ Shell 环境操作 Linux 的用户与其计算机硬件之间的层。内核管理从软件接收的 I/O 指令，并将其转换为中央处理器和其他硬件执行的处理指令。内核还负责处理重要的操作系统任务。此类任务的一个示例是调度器，它确保操作系统上启动的所有进程都由\
  \ CPU 处理。\n\n#### 理解内核线程和驱动程序的使用\n\n由内核执行的操作系统任务通过不同的内核线程实现。通过 `ps aux` 等命令可以轻松识别内核线程。内核线程名称列在括号中（参见示例\
  \ 16-1）。\n\n**示例 16-1** 使用 **ps aux** 列出内核线程\n\n点击此处查看代码图像\n\n\n\n\n\n```\n[root@server1\
  \ ~]# ps aux | head -n 20\nUSER   PID %CPU %MEM    VSZ   RSS TTY   STAT  START \
  \ TIME COMMAND\nroot   1   1.8  0.6   52980  6812 ?      Ss   11:44  0:02 /usr/lib/\n\
  systemd/systemd --switched-root --system --deserialize 23\nroot   2   0.0  0.0 \
  \   0    0 ?    S   11:44  0:00  [kthreadd]\nroot   3   0.0  0.0    0    0 ?   \
  \ S   11:44  0:00  [ksoftirqd/0]\nroot   4   0.0  0.0    0    0 ?    S   11:44 \
  \ 0:00  [kworker/0:0]\nroot   5   0.0  0.0    0    0 ?    S<  11:44  0:00  [kworker/0:0H]\n\
  root   6   0.0  0.0    0    0 ?    S   11:44  0:00  [kworker/u128:0]\nroot   7 \
  \  0.1  0.0    0    0 ?    S   11:44  0:00  [migration/0]\nroot   8   0.0  0.0 \
  \   0    0 ?    S   11:44  0:00  [rcu_bh]\nroot   9   0.0  0.0    0    0 ?    S\
  \   11:44  0:00  [rcuob/0]\nroot   10  0.0  0.0    0    0 ?    S   11:44  0:00 \
  \ [rcuob/1]\nroot   11  0.0  0.0    0    0 ?    S   11:44  0:00  [rcuob/2]\nroot\
  \   12  0.0  0.0    0    0 ?    S   11:44  0:00  [rcuob/3]\nroot   13  0.0  0.0\
  \    0    0 ?    S   11:44  0:00  [rcuob/4]\nroot   14  0.0  0.0    0    0 ?   \
  \ S   11:44  0:00  [rcuob/5]\nroot   15  0.0  0.0    0    0 ?    S   11:44  0:00\
  \  [rcuob/6]\nroot   16  0.0  0.0    0    0 ?    S   11:44  0:00  [rcuob/7]\nroot\
  \   17  0.0  0.0    0    0 ?    S   11:44  0:00  [rcuob/8]\nroot   18  0.0  0.0\
  \    0    0 ?    S   11:44  0:00  [rcuob/9]\nroot   19  0.0  0.0    0    0 ?   \
  \ S   11:44  0:00  [rcuob/10]\n```\n\nLinux 内核的另一个重要任务是硬件初始化。为了确保这些硬件可以被使用，Linux\
  \ 内核使用了驱动程序。每个硬件都包含特定的功能，为了使用这些功能，必须加载驱动程序。Linux 内核是模块化的，驱动程序作为内核模块加载，你将在本章稍后的部分了解到更多信息。\n\
  \n在某些情况下，驱动程序的可用性是一个问题，因为硬件制造商并不总是愿意提供可以与 Linux 内核良好集成的开源驱动。这可能导致驱动无法提供硬件提供的全部功能。\n\
  \n如果制造商不愿意提供开源驱动，另一种方案是使用闭源驱动。虽然这使得在 Linux 中使用硬件成为可能，但这并非理想。因为驱动程序在内核空间内执行特权指令，运行不良好的驱动可能会导致整个内核崩溃。如果在使用开源驱动发生这种情况，Linux\
  \ 内核社区可以帮助调试问题并确保问题得到修复。如果在使用闭源驱动发生这种情况，Linux 内核社区就无能为力。但是，专用驱动可能会提供其开源等效程序未包含的功能。\n\
  \n为了方便查看内核是否在使用闭源驱动，使用了“受污染内核”（tainted kernel）的概念。`tainted kernel` 是指包含闭源驱动的内核。受污染内核的概念有助于驱动程序的排障。如果你的\
  \ RHEL 8 内核似乎被污染了，Red Hat 支持可以将其识别为受污染内核，并识别出是哪种驱动导致了污染。要修复这个问题，Red Hat 可能会要求你卸载导致内核受污染的驱动程序。\n\
  \n### 分析内核正在做什么\n\n为了帮助分析内核正在做什么，Linux 操作系统提供了一些工具：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   `dmesg` 实用\n*   `/proc` 文件系统\n*   `uname` 实用\n\n如果你需要关于内核活动的详细信息，要考虑的第一个工具是\
  \ `dmesg`。该工具显示内核环形缓冲区的内容，这是 Linux 内核存储最近消息的内存区域。获取内核环形缓冲区相同信息的另一种方法是 `journalctl\
  \ --dmesg` 命令，它等同于 `journalctl -k`。在示例 16-2 中，你可以看到 `dmesg` 命令的结果。\n\n**使用 dmesg\
  \ 分析内核**\n\n```\n[8.153928] sd 0:0:0:0: Attached scsi generic 0\n[8.154289] sd 0:0:1:0:\
  \ Attached scsi generic 1\n[8.154330] sd 0:0:2:0: Attached scsi generic 2\n[8.154360]\
  \ sd 0:0:3:0: Attached scsi generic 3\n[8.154421] sr 4:0:0:0: Attached scsi generic\
  \ 4\n[8.729016] ip_tables: (C) 2000-2006 Netfilter\n[8.850599] nf_conntrack version\
  \ 0.5.0 (7897 buckets, 31588)\n[8.939613] ip6_tables: (C) 2000-2006 Netfilter\n\
  [9.160092] Ebtables v2.0 registered\n[9.203710] Bridge firewalling\n[9.586603] IPv6:\
  \ ADDRCONF(NETDEV_UP): eno167736: link is not ready\n[9.587520] e1000: eno167736:\
  \ Link is Up 1000 Mbps Duplex, Flow Control: None\n[9.589066] IPv6: ADDRCONF(NETDEV_CHANGE):\
  \ eno167736: link becomes ready\n[10.689365] Rounding down max_sectors from 429497295\
  \ to 429497288\n[11.58870480] Adjusting tsc more than 11% (6940512 vs 6913395)\n\
  [21.76632181] e1000: eno167736: Link is Down\n[21.770391597] e1000: eno167736: Link\
  \ is Up 1000 Mbps Duplex, Flow Control: None\n[21.780434547] e1000: eno167736: Link\
  \ is Down\n```\n\n在 `dmesg` 输出中，显示了所有与内核的消息。每条消息都以时间指示开头，显示记录日志时的秒数。该时间指示相对于内核启动，允许你查看内核启动到特定事件之间经过了多少秒。（注意\
  \ `journalctl -k --dmesg` 命令显示的是时钟时间而不是相对于内核启动的时间。）这个时间指示明确了发生了什么以及何时发生。\n\n另一个信息来源是\
  \ `/proc` 文件系统。`/proc` 文件系统是 Linux 内核的接口，包含了关于服务器运行状态的详细文件。许多性能工具都会挖掘 `/proc` 文件系统以获取信息。\n\
  \n作为管理员，你会发现 `/proc` 中的某些文件是可读的，并包含 CPU、内存、挂载等状态信息。例如，查看 `/proc/meminfo`，它提供了关于每个内存段以及这些内存段中具体发生了什么的详细信息。\n\
  \n最后一个有用信息来源是 `uname` 命令。该命令提供了关于你操作系统的各种信息。例如，输入 `uname -a` 查看所有相关参数的概述，输入 `uname\
  \ -r` 查看当前使用的内核版本。在使用 `hostnamectl status` 命令时也会显示这些有用额外信息（参见示例 16-3）。\n\n### 提示\n\
  \n在某些情况下，你可能需要了解正在使用的 RHEL 版本的特定信息。要获取这些信息，运行 `cat /etc/redhat-release` 命令并查看输出；它将告诉你你使用的是哪个\
  \ Red Hat 版本以及应用了哪个更新级别。\n\n**示例 16-3 获取更多系统信息**\n\n```\n[root@server1 ~]# hostnamectl\
  \ status\n   Static hostname: server1.example.com\n         Icon name: computer-vm\n\
  \           Chassis: vm\n        Machine ID: 5aa095b495ed458d934c54a88078c165\n\
  \           Boot ID: b7273a66ba254358b566639e329c350d\n    Virtualization: vmware\n\
  \  Operating System: Red Hat Enterprise Linux 8.0 (Ootpa)\n       CPE OS Name: cpe:/o:redhat:enterprise_linux:8.0:GA\n\
  \            Kernel: Linux 4.18.0-80.el8.x86_64\n      Architecture: x86-64\n```\n\
  \n\n\n\n\n在早期的 Linux 时代，内核必须编译以包含支持计算机硬件的所有驱动程序。其他特定功能也需要编译到内核中。自 20 世纪 90 年代中期\
  \ Linux 内核 2.0 发布以来，内核不再是编译的，而是模块化的。一个*模块化内核*由一个较小的核心内核组成，并通过在需要时加载的模块提供驱动支持。模块化内核非常高效，因为它们只包含真正需要的模块。\n\
  \n### 提示\n\n内核模块实现特定的内核功能。内核模块用于加载允许与硬件设备进行适当通信的驱动程序，但不限于加载硬件驱动。例如，文件系统支持是以模块形式加载的。其他内核特性也可以作为模块加载。\n\
  \n### 理解硬件初始化\n\n驱动程序的加载是一个自动化过程，大致流程如下：\n\n1. 在启动期间，内核探测可用的硬件。\n2. 检测到硬件组件后，`systemd-udevd`进程负责加载相应的驱动程序并使硬件设备可用。\n\
  3. 为了决定如何初始化设备，`systemd-udevd` 会读取 `/usr/lib/udev/rules.d` 中的规则文件。这些是系统提供的规则文件，不应进行修改。\n\
  4. 在处理系统提供的 udev 规则文件后，`systemd-udevd` 会进入 `/etc/udev/rules.d` 目录读取任何这些自定义规则。\n\
  5. 结果是，所需的内核模块会自动加载，有关内核模块和相关硬件的状态会被写入 sysfs 文件系统，该系统挂载在 `/sys` 目录上。Linux 内核使用这个伪文件系统来跟踪硬件相关的设置。\n\
  \n`systemd-udevd`进程不是一次性进程；它会持续监控新硬件设备的插拔。为了直观了解其工作原理，你可以以 root 身份输入 `udevadm monitor`\
  \ 命令。这会列出在激活新硬件设备时处理的所有事件。例如，如果在该命令运行时插入了一个 USB 设备，你可以清楚地看到正在发生什么。按 Ctrl-C 关闭 `udevadm\
  \ monitor` 输出。\n\n示例 16-4 显示了 `udevadm monitor` 命令的输出。在该命令中，你可以看到硬件提供的功能如何通过内核和\
  \ systemd-udevd 的协作被自动发现。硬件探测的每个阶段都通过在 `/sys` 文件系统中创建一个文件来结束。一旦硬件完全初始化，你也可以看到某些内核模块被加载。\n\
  \n### 注意\n\n尽管了解硬件初始化很有用，但它并不包含在当前的 RHCSA 目标中。\n\n**示例 16-4** `udevadm monitor`\
  \ 命令的输出\n\n点击此处查看代码图像\n\n```\n[root@server2 ~]# udevadm monitor\nmonitor will print\
  \ the received events for:\nUDEV - udev 在规则处理后发送的事件\nKERNEL - 内核 uevent\n\nKERNEL[132406.831270]\
  \ add /devices/pci0000:00/0000:00:11.0/0000:02:\n  04.0/usb1/1-1 (usb)\nKERNEL[132406.974110]\
  \ add /devices/pci0000:00/0000:00:11.0/0000:02:\n  04.0/usb1/1-1/1-1:1.0 (usb)\n\
  UDEV [132406.988182] add /devices/pci0000:00/0000:00:11.0/0000:02:\n  04.0/usb1/1-1\
  \ (usb)\nKERNEL[132406.999249] add /module/usb_storage (module)\nUDEV [132407.001203]\
  \ add /module/usb_storage (module)\nKERNEL[132407.002559] add /devices/pci0000:00/0000:00:11.0/0000:02:\n\
  \  04.0/usb1/1-1/1-1:1.0/host33 (scsi)\nUDEV [132407.002575] add /devices/pci0000:00/0000:00:11.0/0000:02:\n\
  \  04.0/usb1/1-1/1-1:1.0 (usb)\nKERNEL[132407.002583] add /devices/pci0000:00/0000:00:11.0/0000:02:\n\
  \  04.0/usb1/1-1/1-1:1.0/host33/scsi_host/host33 (scsi_host)\nKERNEL[132407.002590]\
  \ add /bus/usb/drivers/usb-storage (drivers)\nUDEV [132407.004479] add /bus/usb/drivers/usb-storage\
  \ (drivers)\nUDEV [132407.005798] add /devices/pci0000:00/0000:00:11.0/0000:02:\n\
  \  04.0/usb1/1-1/1-1:1.0 (scsi)\nUDEV [132407.007385] add /devices/pci0000:00/0000:00:11.0/0000:02:\n\
  \  04.0/usb1/1-1/1-1:1.0/scsi_host/host33 (scsi_host)\nKERNEL[132408.008331] add\
  \ /devices/pci0000:00/0000:00:11.0/0000:02:\n  04.0/usb1/1-1/1-1:1.0 (scsi)\nKERNEL[132408.008355]\
  \ add /devices/pci0000:00/0000:00:11.0/0000:02:\n  04.0/usb1/1-1/1-1:1.0/target33:0:0\
  \ (scsi)\nKERNEL[132409.38130] add /module/fat (module)\nKERNEL[132409.38151] add\
  \ /kernel/slab/fat_cache (slab)\nKERNEL[132409.38158] add /kernel/slab/fat_inode_cache\
  \ (slab)\nKERNEL[132409.38164] add /module/vfat (module)\nUDEV [132409.38590] add\
  \ /module/fat (module)\nUDEV [132409.38507] add /kernel/slab/fat_cache (slab)\n\
  UDEV [132409.38513] add /kernel/slab/fat_inode_cache (slab)\nUDEV [132409.38610]\
  \ add /module/vfat (module)\n```\n\n### 管理内核模块\n\nLinux 内核模块通常为需要它们的设备加载，但在极少数情况下，你必须手动加载相应的内核模块。有一些命令用于手动管理内核模块。表\
  \ 16-2 提供了概述。\n\n加载内核模块的另一种方法是通过 `/etc/modules-load.d` 目录。在该目录中，你可以创建文件来自动加载 systemd-udevd\
  \ 方法未加载的模块。对于应该始终加载的默认模块，该目录在 `/usr/lib/modules-load.d` 有对应。\n\n| 命令 | 用途 |\n| ---\
  \ | --- |\n| `lsmod` | 列出当前加载的内核模块 |\n| `modinfo` | 显示内核模块信息 |\n| `modprobe` | 加载内核模块，包括所有依赖项\
  \ |\n| `modprobe -r` | 根据依赖关系卸载内核模块 |\n\n**表 16-2** Linux 内核模块管理\n\n处理内核模块时的第一个命令是\
  \ `lsmod`。该命令列出了所有正在使用的内核模块，包括使用该特定模块的模块。示例 16-5 显示了 `lsmod` 命令的前十行输出。\n\n**示例 16-5**\
  \ 使用 `lsmod` 列出加载的模块\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# lsmod | head\nModule\
  \                  Size    Used by\nnls_utf8               16384    1\nisofs   \
  \               45056    1\nfuse                  126976    3\nrfcomm          \
  \       90112    6\nxt_CHECKSUM            16384    1\nipt_MASQUERADE         16384\
  \    1\nxt_conntrack           16384    1\nipt_REJECT             16384    1\nnft_counter\
  \            16384    16\n```\n\n### 提示\n\n许多 Linux 命令以不同的列显示输出，并不总是清楚哪列用于显示什么类型的信息。大多数命令在命令输出的第一行都有标题行。因此，如果你在任何命令的输出中不确定看到了什么，可以将命令输出通过到\
  \ `head` 以查看是否有头文件，或者将命令输出通过到 `less`，这允许你轻松翻到命令输出的第一行。\n\n如果你想获取更多关于特定内核模块的信息，可以使用\
  \ `modinfo` 命令。这提供了有关特定内核模块的完整信息，包括两个有趣的部分：alias（别名）和 parms（参数）。模块别名是另一个用于标识该模块的名称。parms\
  \ 行指的是加载模块时可以设置的参数。（在本章稍后的“管理内核模块参数”章节中，你将学习如何处理内核模块参数。）示例 16-6 显示了 `modinfo e1000`\
  \ 命令的部分输出。\n\n\n\n\n\n## 示例 16-6 使用 `modinfo` 显示模块信息\n\n点击此处查看代码图片\n\n```\n[root@server1\
  \ ~]# modinfo e1000\nfilename:       /lib/modules/4.18.0-80.el8.x86_64/kernel/drivers/net/\n\
  \                  ethernet/intel/e1000/e1000.ko.xz\nversion:        7.3.21-k8-NAPI\n\
  license:        GPL\ndescription:    Intel(R) PRO/1000 Network Driver\nauthor: \
  \        Intel Corporation, <linux.nics@intel.com>\nrhelversion:    8.0\nsrcversion:\
  \     A2C44EC5D0B865EE9C972D5\nalias:          pci:v00008086d00002E6Esv*sd*bc*sc*i*\n\
  ...\ndepends:        \nintree:         Y\nname:           e1000\nvermagic:     \
  \  4.18.0-80.el8.x86_64 SMP mod_unload modversions \nsig_id:         PKCS#7\nsigner:\
  \         Red Hat Enterprise Linux kernel signing key\nsig_key:        20:16:97:CB:B1:7E:D5:A0:A7:3C:0B:40:E2:54:80:2D:83:F1:\n\
  \                  72:5A\nsig_hashalgo:   sha256\nsignature:      97:3A:58:F6:4E:B7:F1:CE:44:50:65:5E:84:41:D8:A7:A3:\n\
  \                   A2:2D...\nparm:           TxDescriptors:Number of transmit descriptors\
  \ (array\n                  of int) \n\nparm:           RxDescriptors:Number of\
  \ receive descriptors (array\n                  of int)\nparm:           Speed:Speed\
  \ setting (array of int)\nparm:           Duplex:Duplex setting (array of int)\n\
  parm:           AutoNeg:Advertised auto-negotiation setting (array\n           \
  \       of int)\nparm:           FlowControl:Flow Control setting (array of int)\n\
  parm:           XsumRX:Disable or enable Receive Checksum offload\n            \
  \      (array of int)\nparm:           TxIntDelay:Transmit Interrupt Delay (array\
  \ of int)\nparm:           TxAbsIntDelay:Transmit Absolute Interrupt Delay\n   \
  \               (array of int)\nparm:           RxIntDelay:Receive Interrupt Delay\
  \ (array of int)\nparm:           RxAbsIntDelay:Receive Absolute Interrupt Delay\n\
  \                  (array of int)\nparm:           InterruptThrottleRate:Interrupt\
  \ Throttling Rate\n                  (array of int)\nparm:           SmartPowerDownEnable:Enable\
  \ PHY smart power down\n                  (array of int)\nparm:           copybreak:Maximum\
  \ size of packet that is copied to\n                  a new buffer on receive (uint)\n\
  parm:           debug:Debug level (0=none,...,16=all) (int)\n```\n\n要手动加载和卸载模块，可以使用\
  \ `modprobe` 和 `modprobe -r` 命令。在早期的 Linux 版本中，你可能使用过 `insmod` 和 `rmmod` 命令。不应该再使用它们，因为它们不会加载内核模块依赖项。在练习\
  \ 16-1 中，你将学习如何使用这些命令管理内核模块。\n\n### 检查硬件设备的驱动可用性\n\n在现代 Linux 服务器上，支持许多硬件设备。有时，你可能会发现某些设备没有被正确支持，因为它们的模块当前没有加载。确定你的硬件是否属于这种情况的最佳方法是使用\
  \ `lspci` 命令。如果不带参数使用，它将显示在 PCI 总线上检测到的所有硬件设备。一个非常有用的参数是 `-k`，它会列出用于检测到的 PCI 设备的所有使用的内核模块。示例\
  \ 16-7 显示了 `lspci -k` 命令的示例输出。\n\n## 示例 16-7 检查内核模块可用性\n\n点击此处查看代码图片\n\n```\n[root@server1\
  \ ~]# lspci -k | head\n00:00.0 Host bridge: Intel Corporation 440BX/ZX/DX - 82443BX/ZX/DX\n\
