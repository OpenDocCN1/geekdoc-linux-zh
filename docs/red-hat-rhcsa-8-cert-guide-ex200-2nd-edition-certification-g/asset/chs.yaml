  \n### 管理内核模块参数\n\n有时，你可能想要带有参数加载内核模块。要这样做，首先需要找到要使用的参数。如果你找到了所需的参数，可以手动加载，并在名称后指定值。要使此过程自动化，可以在\
  \ `/etc/modprobe.d/` 创建文件。\n\n### 更新 Linux 内核\n\n有时你需要更新 Linux 内核。当你更新内核时，将安装新版本并作为默认内核。不过，旧版本仍然可用。最后四个内核文件将保存在\
  \ `/boot` 目录中。GRUB 2 引导程序会自动获取该目录中的所有内核。这允许你在启动时选择旧内核版本，如果新安装的内核出现问题非常有用。要安装新版本的内核，可以使用\
  \ `yum upgrade kernel` 命令。`yum install kernel` 命令同样有效。\n\n\n\n\n\n| 表 16-2 | 内核模块管理概述\
