  \ `/etc/hourly|weekly|monthly}`。\n\n**7.** 哪个服务负责执行作业？\n\n1. `cron`\n2. `crontab`\n\
  3. `atd`\n4. `anacron`\n\n**8.** 关于 cron 安全性的哪种说法是正确的？\n\n1. 默认情况下，所有用户都允许通过 cron\
