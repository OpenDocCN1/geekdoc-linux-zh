  \ 时需要哪个选项才能在精简配置（thin-provisioned）VDO 卷上成功创建 XFS 文件系统？\n\n### 章节结束实验\n\n为了完成以下章末实验，你需要一个专用的磁盘设备。在开始之前，请使用\
