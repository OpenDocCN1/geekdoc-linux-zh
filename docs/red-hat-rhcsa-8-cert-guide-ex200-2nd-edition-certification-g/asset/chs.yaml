  \ `systemctl` 操作单元时，下列中哪项不是有效命令？\n\n1. `systemctl unit start`\n2. `systemctl status\
  \ -l unit`\n3. `systemctl mask unit`\n4. `systemctl disable unit`\n\n### 基础主题\n\n\
  ### 理解 Systemd\n\nSystemd 是 Red Hat Enterprise Linux 8 的一部分，负责不仅启动服务，还启动各种其他项目。在本章中，你将学习\
  \ Systemd 是如何组织的，以及哪些项目是从 Systemd 启动的。\n\n通俗地说，你可以说 Systemd 系统和服务管理器是被用来启动东西的。这些东西被称为\
  \ `units`（单元）。单元可以是许多东西。最重要的单元类型之一是服务。通常，服务是提供特定功能并允许外部客户端连接的进程，例如 SSH 服务、Apache\
  \ Web 服务等。除了服务之外，还存在其他单元类型，例如 socket、mount 和 target。要显示可用单元列表，输入 `systemctl -t help`（参见示例\
  \ 11-1）。\n\n![](img/key_topic_icon.jpg)\n\n**示例 11-1** Systemd 中的单元类型\n点击查看代码\n\n\
  ```\n[root@server1]# systemctl -t help\nAvailable unit types:\nservice\ntarget\n\
  mount\ndevice\nautomount\nswap\ntimer\npath\nslice\n```\n\n#### 理解 Systemd 单元位置\n\
  \n与以前管理服务的方法相比，使用 Systemd 的主要优势是它提供了一个统一的接口。单元文件可能出现在三个位置：\n\n* `/usr/lib/systemd/system`\
  \ 包含来自 RPM 包的默认单元文件。你不应直接编辑这些文件。\n* `/etc/systemd/system` 包含编写的自定义单元文件。\n* `/run/systemd/system`\
  \ 包含自动生成的单元文件。\n\n如果单元存在于这些位置的多个地方，`/run` 目录的优先级最高，`/etc/systemd/system` 次之，而 `/usr/lib/systemd/system`\
  \ 最后。\n\n#### 理解 Systemd 服务单元\n\n可能最重要的单元类型是服务单元。它用于启动进程。你可以通过服务单元启动任何类型的进程，包括守护进程和命令。\n\
  \n示例 11-2 显示了一个用于安全 FTP 服务的单元文件 vsftpd.service。\n\n**示例 11-2** 服务单元文件\n点击查看代码\n\n\
  ```\n[Unit]\nDescription=Vsftpd ftp daemon\nAfter=network.target\n\n[Service]\n\
  Type=forking\nExecStart=/usr/sbin/vsftpd /etc/vsftpd.conf\n\n[Install]\nWantedBy=multi-user.target\n\
  ```\n\n你可以从这个单元文件示例看出单元文件相对容易理解。任何 Systemd 服务单元文件由以下部分组成（其他类型的单元具有不同的部分）：\n\n* **Unit\
  \ 部分**：描述单元并定义依赖关系。该部分还包含重要的 `After` 语句以及可选的 `Before` 语句。这些语句定义了单元之间的依赖关系，并且相对于该单元的。`Before`\
  \ 语句表示该单元在指定的单元之前启动。`After` 语句表示该单元在指定的单元之后启动。\n* **Service 部分**：描述如何启动和停止服务并请求状态安装。通常，你可以预期有一个\
  \ `ExecStart` 行，指示如何启动单元，或者有一个 `ExecStop` 行，指示如何停止单元。注意 `Type` 选项，它用于指定进程应如何启动。`forking`\
  \ 类型常用于守护进程，但你也可以使用其他类型，例如 `oneshot`，它将从 Systemd 单元启动任何命令。更多详情请参见 `man 5 systemd.service`。\n\
  * **Install 部分**：指示该单元在哪个 target 中启动。本章稍后的“理解 Systemd Target 单元”部分将解释如何处理 target。\n\
  \n#### 理解 Systemd Mount 单元\n\n\n\n\n\n挂载单元（mount unit）指定了文件系统如何挂载到特定的目录上。示例 11-3\
  \ 显示了一个挂载单元文件 `tmp.mount`。\n\n**示例 11-3** 挂载单元文件\n\n点击此处查看代码图片\n\n```\n[Unit]\n\
  Description=Temporary Directory (/tmp)\nDocumentation=man:hier(7)\nDocumentation=https://www.freedesktop.org/wiki/Software/systemd/\n\
  APIFileSystems\nConditionPathIsSymbolicLink=!/tmp\nDefaultDependencies=no\nConflicts=umount.target\n\
  Before=local-fs.target umount.target\nAfter=swap.target\n\n[Mount]\nWhat=tmpfs\n\
  Where=/tmp\nType=tmpfs\nOptions=mode=1777,atime,nosuid\n```\n\n示例 11-3 中的 `tmp.mount`\
  \ 单元文件显示了其部分中一些有趣的配置选项：\n\n- `[Unit]`：`Conflicts` 语句用于列出不能与此单元一起使用的单元。使用此语句处理互斥的单元。\n\
  - `[Mount]`：此部分精确定义了挂载必须执行的位置。在这里你可以看到通常在任何挂载操作中使用的参数。\n\n### 理解 Systemd Socket\
  \ 单元\n\n另一个值得关注的单元类型是 `socket`。socket 为应用程序与另一个程序之间的通信提供了一种方法。socket 可以被定义为一个文件，也可以被定义为\
  \ Systemd 监听连接的端口。这样一来，服务就不需要持续运行，而是当 socket 上有连接进入时才会启动。每个 socket 都需要一个对应的服务文件。示例\
  \ 11-4 显示了 `cockpit.socket` 的样子；注意该文件需要一个名为 `cockpit.service` 的服务文件。\n\n**示例 11-4**\
  \ Socket 单元\n\n点击此处查看代码图片\n\n```\n[Unit]\nDescription=Cockpit Web Service\nDocumentation=man:cockpit(8)\n\
  Wants=cockpit-motd.service\n\n[Socket]\nListenStream=9090\nExecStartPost=-/usr/share/cockpit/motd/update-motd\
  \ localhost\nExecStartPost=-/bin/ln -sf active.motd /run/cockpit/motd\nExecStopPost=-/bin/ln\
  \ -sf /usr/share/cockpit/motd/inactive.motd /run/cockpit/motd\n\n[Install]\nWantedBy=sockets.target\n\
  ```\n\n示例 11-4 中的重要选项是 `ListenStream`。该选项定义了 Systemd 应该监听的 TCP 端口。socket 也可以为 UDP\
  \ 端口创建，在这种情况下你应该使用 `ListenDatagram` 代替 `ListenStream`。\n\n### 理解 Systemd Target\
  \ 单元\n\n单元文件用于构建服务器上所需的功能。为了能够按照正确的顺序和时机加载它们，你使用特定类型的单元：target 单元（目标单元）。target 单元的简单定义是“一组单元”。某些\
  \ target 用于定义服务器应该启动的状态启动。因此，target 单元类似于 RHEL 早期版本中的运行级别（runlevels）。\n\n其他 target\
  \ 则是一组服务，这不仅易于管理单个单元，而且管理实现功能所需的所有单元。`printer.target` 就是此类 target 的示例；你可以用它轻松地启动或停止所需的所有单元。\n\
  \ntarget 本身对其他 target 有依赖。这些依赖定义在 target 单元中。这种依赖的示例是 `basic.target`。该 target 定义了所有应该始终启动的单元。你可以使用\
  \ `systemctl list-dependencies` 命令概述任何依赖。示例 11-5 显示了 target 单元文件 `multi-user.target`\
  \ 的定义，它定义了 RHEL 服务器的正常运行状态。\n\n**示例 11-5** Target 单元文件\n\n点击此处查看代码图片\n\n```\n[Unit]\n\
  Description=Multi-User System\nDocumentation=man:systemd.special(7)\nRequires=basic.target\n\
  Conflicts=rescue.service rescue.target\nAfter=basic.target rescue.service\nAllowIsolate=yes\n\
  \n[Install]\nAlias=default.target\n```\n\n你可以看到，target 单元本身并不包含很多内容。它只是定义了需要什么，以及不能与哪些服务和\
  \ target 共存。它还通过 `[Unit]` 部分中的 `After` 语句定义了加载顺序。target 文件不包含任何关于应包含的单元的信息；这些信息定义在不同单元文件的\
  \ `[Install]` 部分中。\n\n当管理员使用 `systemctl enable` 命令来确保单元在启动时自动启动时，该单元的 `[Install]`\
  \ 部分将被用于确定该单元应该被添加到哪个 target。\n\n当你将单元添加到 target 时，在底层会在 `/etc/systemd/system` 中的\
  \ target 目录中创建一个符号链接。例如，如果你启用了 `vsftpd` 服务以自动启动，你会发现一个符号链接 `/etc/systemd/system/multi-user.target`。\n\
  \n\n\n\n\n| Disabled | 单元在启动时不会启动。 |\n| Static | 单元无法启用，但可能由另一个单元自动启动。 |\n\n**表\
  \ 11-2** Systemd 状态概览\n\n作为管理员，你经常也需要获取 Systemd 单元文件的当前状态概览。不同的命令（某些在表 11-3 中所示）可以帮助你获取这些信息。\n\
  \n![](img/key_topic_icon.jpg)\n\n| 命令 | 说明 |\n| --- | --- |\n| `systemctl --type=service`\
  \ | 仅显示服务单元 |\n| `systemctl list-units --type=service` | 显示所有活跃的服务单元（与上一个命令的结果相同）\
  \ |\n| `systemctl list-units --type=service --all` | 显示非活跃单元以及活跃的服务单元 |\n| `systemctl\
  \ --failed --type=service` | 显示所有失败的服务 |\n| `systemctl status -l your.service` |\
  \ 显示服务的详细状态信息 |\n\n**表 11-3** `systemctl` 单元概览命令\n\n### 管理依赖关系\n\n通常情况下，有两种管理 Systemd\
  \ 依赖关系的方法：\n\n*   `socket` 和 `path` 等单元类型与服务单元直接相关。访问其中任何一种单元类型将自动触发服务类型。\n*   可以在单元内定义依赖关系，使用\
  \ `Requires`、`Requisite`、`After` 和 `Before` 等关键字。\n\n作为管理员，你可以请求单元依赖关系列表。输入 `systemctl\
  \ list-dependencies` 后跟单元名称以查找它具有哪些依赖项；添加 `--reverse` 可以查找哪些单元是该单元的依赖项。示例 11-7 显示了此命令的示例。\n\
  \n**示例 11-7** 显示单元依赖关系\n\n```\n[root@server1 ~]# systemctl list-dependencies vsftpd\n\
  \  vsftpd.service\n└–system.slice\n└–basic.target\n  ├–alsa-restore.service\n  ├–alsa-state.service\n\
  \  ├–firewalld.service\n  ├–microcode.service\n  ├–rhel-autorelabel-mark.service\n\
  \  ├–rhel-autorelabel.service\n  ├–rhel-configure.service\n  ├–rhel-dmesg.service\n\
  \  ├–rhel-loadmodules.service\n\n  ├–paths.target\n  ├–slices.target\n  │ ├–-.slice\n\
  \  ├–system.slice\n  ├–sockets.target\n  ├–avahi-daemon.socket\n  ├–cups.socket\n\
  \  ├–dbus.socket\n  ├–dm-event.socket\n  ├–iscsid.socket\n  ├–iscsiuio.socket\n\
  \  ├–lvm2-lvmetad.socket\n  ├–rpcbind.socket\n  ├–systemd-initctl.socket\n  ├–systemd-journald.socket\n\
  \  ├–systemd-shutdownd.socket\n  ├–systemd-udevd-control.socket\n  ├–systemd-udevd-kernel.socket\n\
  \  ├–sysinit.target\n  │ ├–dev-hugepages.mount\n    –dev-mqueue.mount\n  ├–dmraid-activation.service\n\
  \  ├–iscsi.service\n```\n\n为了确保准确的依赖管理，你可以在单元的 `[Unit]` 部分使用不同的关键字：\n\n*   `Requires:`:\
  \ 如果加载此单元，此处列出的单元也将加载。如果列出的其他单元之一被去激活，则此单元也将被去激活。\n*   `Requisite:`: 如果此处列出的单元尚未加载，则此单元将失败。\n\
  *   `Wants:`: 此单元希望加载此处列出的单元，但如果列出的单元中任何一个执行失败，此单元也不会失败。\n*   `Before:`: 此单元将在 `Before`\
  \ 指定的单元之前启动。\n*   `After:`: 此单元将在 `After` 指定的单元之后启动。\n\n在接下来的练习 11-2 中，你将学习如何使用这些选项。\n\
  \n### 管理选项\n\n在使用 Systemd 时，你可以使用 `systemctl edit` 来创建一个覆盖文件。这比修改 `/lib/systemd/system/`\
  \ 中的原始单元文件更安全。\n\n要确定某个单元有哪些可用选项，你可以使用 `systemctl show`。该命令会显示单元的所有属性。\n\n\n\n\n\
