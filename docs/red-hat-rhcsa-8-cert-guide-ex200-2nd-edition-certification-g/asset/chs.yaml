  \ Web 服务器并确保它自动启动。\n\n## 附录 A\n\n“我真的这些了吗？”测验和复习题答案\n\n### “我真的知道了吗？”测验答案\n\n###\
  \ 第 1 章\n\n**1.** A. Fedora 是一个实验性/爱好者版本，包含许多组件，这些组件可能进入或不会进入 RHEL 分发版树，也可能进入 RHCSA\
  \ 考试。\n\n**2.** D. 所有 RHEL 软件更新在 CentOS 中同样可用。\n\n**3.** A. 特别是在处理虚拟机时，有一个图形界面（GUI）供你调用将让你感到非常方便。\n\
  \n**4.** C. XFS 被用默认文件系统。当红帽决定使用哪种文件系统作为默认文件系统时，Btrfs 还不足够稳定。\n\n**5.** A. XFS 文件系统的大小无法缩小。\n\
  \n**6.** C. Fedora 项目也试图制作一个稳定的发行版。全球有许多 Fedora 用户将其作为生产环境发行版使用。\n\n**7.** D. “诊断现有安装”（Troubleshoot\
  \ an Existing Installation）在从磁盘启动时可用，而不是在“安装摘要”（Installation Summary）屏幕上。\n\n**8.**\
  \ D. 允许使用不安全的密码；你只需要确认两次即可。\n\n**9.** D. 语言设置可以在安装后更改。这可以通过图形界面中的“设置”（Settings）选项轻松完成。\n\
  \n**10.** B. 即使将 `/var` 放在独立分区上是有意义的，但这并不是默认配置。\n\n### 第 2 章\n\n**1.** B. 你必须先将标准输出重定向到文件，然后使用\
  \ `2>&1` 指定对错误也以相同的方式处理。\n\n**2.** A 和 B. `/etc/profile` 是所有启动登录 shell（login shell）的用户处理的文件。`/etc/bashrc`\
  \ 在启动子 shell 时被处理，并且在启动登录 shell 时也会被包含。\n\n**3.** C. 在 Linux 上，当前目录没有设置在 `PATH`\
  \ 中。\n\n**4.** D. 管道（pipe）用于处理第一个命令的输出，并将其作为第二个命令的输入。\n\n**5.** A. `history -c`\
  \ 命令从历史文件中移除内存中的状态。作为移除 `~/.bash_history` 以确保删除所有历史记录的替代方案，用户可以输入 `history -c`，然后输入\
  \ `history -w`。\n\n**6.** D. Ctrl-X 不是一个有效的历史命令。\n\n**7.** D. 如果已经添加了相应的配置（例如 SSH\
  \ 的主机名），Bash 补全功能对命令、文件和其他名称有效。\n\n**8.** A. 你需要命令 `:%s/old/new/g` 来将所有的 `old` 实例替换为\
  \ `new`。\n\n**9.** D. 语言大小可以在安装后更改。这可以通过图形界面中的“设置”选项轻松完成。\n\n**10.** C. `man -k`\
  \ 命令用于查找所需的关键词。在 RHEL 中，该数据库通过 `mandb` 命令更新。\n\n### 第 3 章\n\n**1.** D. 启动系统所需的程序文件通常存储在\
  \ `/usr` 目录下。在旧的 RHEL 版本中，基本二进制文件系统二进制文件位于 `/bin` 和 `/sbin`，但在现代 RHEL 中，这些目录是 `/usr`\
  \ 的符号链接。\n\n**2.** C. `/var` 目录用于存储可能会增长的文件。\n\n**3.** A. `/etc/` 目录包含了服务器启动时所需的配置文件。将\
  \ `/etc` 放在独立分区上会导致你的服务器无法启动。\n\n**4.** C. `df -h` 命令显示挂载设备以及这些设备当前使用的磁盘空间。`-T`\
  \ 选项有助于识别真实文件系统，因为它显示了文件系统类型。\n\n**5.** C.  `-a` 显示隐藏文件，`-l` 提供详细列表，`-t` 按修改时间排序（默认显示最新文件），`-r`\
