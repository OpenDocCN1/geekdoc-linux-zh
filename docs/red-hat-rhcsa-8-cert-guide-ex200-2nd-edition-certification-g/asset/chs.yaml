  \ Linux 组账户的设置。\n\n### 理解 Linux 组\n\nLinux 用户可以是两种类型组的成员。首先是主组。每个用户必须是主组的成员，且只有一个主组。当你创建文件时，主组将成为这些文件的组所有者。（文件所有权将在第\
  \ 7 章](#ch07.xhtml_ch07) 的“权限管理”中详细讨论）。用户也可以访问其主组有权访问的所有文件。用户的主组成员身份定义在 `/etc/passwd`\
  \ 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n\n\n\n如引言中“如何使用本本书”节所述，你有几种方法可以进行考试准备：章末实验；附录\
  \ B 中的记忆表；第 27 章中的“最终准备”以及实习考试。\n\n### 复习所有关键主题\n\n复习章节最重要的主题，这些主题在页外边框用“关键主题（Key\
  \ Topic）”图标标记。表 6-3 列出了这些关键主题的索引及其所在的页码。\n\n![](img/key_topic_icon.jpg)\n\n| 关键主题元素\
  \ | 描述 | 页码 |\n| --- | --- | --- |\n| 章节 | Linux 上的用户 | 124 |\n| 表 6-2 | 使用提升权限运行任务的方法\
  \ | 125 |\n| 列表 | `/etc/passwd` 中用户账户字段描述 | 128 |\n| 列表 | `/etc/shadow` 中密码属性字段描述\
  \ | 130 |\n| 列表 | 可从 `/etc/login.defs` 设置的重要属性 | 133 |\n| 列表 | 在构建用户环境中起作用的文件 |\
  \ 134 |\n\n**表 6-3** 第 6 章关键主题\n\n## 记忆完成表格和列表\n\n打印附录 B“记忆表”（可在配套网站找到）副本，或至少打印本章章节，并凭记忆完成表格和列表。附录\
  \ C“记忆表答案密钥”包含完成的表格和列表以便你检查工作结果。\n\n## 定义关键术语\n\n定义本章的以下关键术语并在术表中检查你的答案：\n\n* user\n\
  * password\n* GECOS\n* group\n* primary group\n* secondary group\n* privileged user\n\
  * unprivileged user\n* root\n\n### 复习题\n\n接下来的问题旨在帮助测试你对概念、术语以及知识广度的掌握程度。你可以在附录\
  \ A 中找到这些问题的答案。\n\n1. 用户 root 的 UID 是什么？\n\n2. 定义 `sudo` 的配置文件是哪个？\n\n3. 你应该使用哪个命令来修改\
  \ `sudo` 配置？\n\n4. 哪两个文件可以用于定义创建用户时使用的设置？\n\n5. 在 `/etc/passwd` 中你可以创建多少组？\n\n6.\
  \ 如果你想让用户通过 `sudo` 访问所有管理员命令，你应该让该用户成为哪个组的成员？\n\n7. 你应该使用哪个命令来手动修改 `/etc/group`\
  \ 文件？\n\n8. 你可以使用哪两个命令来更改用户密码信息？\n\n9. 存储用户密码的文件名是什么？\n\n10. 存储组账户的文件名是什么？\n\n##\
  \ 章末实验\n\n你现在已经学习了如何设置环境，使用户账户可以登录你的服务器并访问资源。在章末实验中，你将学习如何为用户和组配置环境。\n\n### 实验 6.1\n\
  \n设置满足以下要求的共享组环境：\n\n* 创建两个组：sales 和 account。\n* 创建用户 bob、betty、bill 和 beatrix。确保他们的主组被设置为与用户同名的私有组。\n\
  * 让 bob 和 betty 成为 sales 组的成员，让 bill 和 beatrix 成为 account 组的成员。\n* 设置密码策略，要求用户每\
  \ 90 天更改一次密码。\n\n## 第 7 章\n\n### 权限管理\n\n**本章涵盖了以下主题：**\n\n* 管理文件所有权\n* 基础权限管理\n\
  * 高级权限管理\n* 访问控制列表管理\n* 使用 umask 设置默认权限\n* 用户扩展属性\n\n本章涵盖了以下 RHCSA 目标：\n\n* 列出、设置和更改所有权\n\
  * 创建并设置标准权限\n* 创建和管理访问控制列表\n* 设置默认权限\n* 诊断权限问题\n\n为了访问文件，权限被分配给三个实体。在本章中你将学习如何应用权限。`umask`\
  \ 决定了新文件的权限。访问控制列表（ACL）提供了更细粒度的控制。\n\n### “你掌握了吗？”测试\n\n“你掌握了吗？”测试可以评估你是否应该阅读整章。参见表\
  \ 7-1。\n\n| 基础主题 | 题目 |\n| --- | --- |\n| 管理文件所有权 | 1–3 |\n| 基础权限 | 4 |\n| 高级权限\
  \ | 5 |\n| 访问控制列表 | 6–8 |\n| 使用 umask 设置默认权限 | 9 |\n| 用户扩展属性 | 10 |\n\n1. 用户需要在一个会话中工作，其中创建的所有文件都属于\
  \ sales 组，直到会话结束。哪个命令可以实现这一点？\n\n* `chgrp sales`\n* `setgid sales`\n* `newgrp sales`\n\
  * `setgroup sales`\n\n2. 哪个命令可以让你找到系统中所有属于 linda 的文件？\n\n* `find / -user linda`\n\
  * `find / -uid linda`\n* `ls -l | grep linda`\n* `ls -R | find linda`\n\n3. 哪个命令没有将组设置为\
  \ sales？\n\n* `chgrp sales myfile`\n* `chown .sales myfile`\n* `chgrp myfile sales`\n\
  * `chown :sales myfile`\n\n4. 使用哪个命令允许用户和组所有者读写权限，而对其他人没有任何权限？\n\n* `chown 007 filename`\n\
  * `chmod 077 filename`\n* `chmod 660 filename`\n* `chmod 770 filename`\n\n5. 哪个命令允许你在目录上设置\
  \ SGID 权限？\n\n* `chmod u+s /dir`\n* `chmod g-s /dir`\n* `chmod g+s /dir`\n* `chmod\
  \ 1770 /dir`\n\n6. 你正尝试使用 `setfacl` 命令对 `/data` 目录设置 ACL，但收到了“不支持操作”的消息。下列哪种可能是解释？\n\
  \n* 你的计算机上没有安装 `setfacl` 命令。\n* 你输入命令时出现了错误。\n* 要授予 ACL 的用户或组不存在。\n\n\n\n\n4. 文件系统缺乏\
  \ ACL 支持。\n\n7. 哪个命令允许为 `/data` 目录及其所有子目录下创建的所有新文件授予 `sales` 组的 `rw` 权限？\n\n1. `setfacl\
  \ -m d:g:sales:rw /data`\n2. `setfacl -m d:g:sales:rwx /data`\n3. `setfacl -R -m\
  \ g:sales:rwx /data`\n4. `setfacl -R -m g:sales:rw /data`\n\n8. 假设你想让其他人对所有其他文件具有读取权限，哪个命令能让你确保其他人对\
  \ `/data` 目录下创建的任何新文件都没有访问权限？\n\n1. `setfacl -m d:o::- /data`\n2. `setfacl -m o::-\
  \ /data`\n3. `umask 027 /data`\n4. `umask 027`\n\n9. 以下哪种 umask 设置符合以下要求：\n\n* 授予文件所有者所有权限\n\
  * 授予文件组所有者读取权限\n* 不向其他人授予任何权限\n\n1. 740\n2. 750\n3. 027\n4. 047\n\n10. 哪个命令允许你检查设置在\
  \ `myfile` 上的所有属性。\n\n1. `ls --attr myfile`\n2. `getattr myfile`\n3. `lsattr myfile`\n\
  4. `listattr myfile`\n\n### 基础主题\n\n## 管理文件所有权\n\n在讨论权限之前，你需要理解文件和目录所有权的角色。文件和目录所有权对于处理权限至关重要。在本节中，你首先学习如何查看所有权。然后你将学习如何更改文件和目录的用户和组所有权。\n\
  \n### 显示所有权\n\n在 Linux 上，每个文件和每个目录有两个所有者：用户所有者和组所有者。除此之外，还有一个“其他”（others）实体，它也被认为是确定用户所拥权限的实体。在使用\
  \ `ls -l` 命令列出权限时，用户、组和其他者（ugo）所有者会被合并显示。\n\n这些所有者是在文件或目录创建时设置的。在创建时，创建文件的用户成为用户所有者，该用户的主组成为组所有者。要确定你作为用户是否对某个文件或目录拥有权限，shell\
  \ 会检查所有权。这按以下顺序发生：\n\n1. shell 检查你是否是你想要访问的文件的用户所有者（也称为文件的用户）。如果你是该用户，你将获得为用户设置的权限，且\
  \ shell 不再向下查找。\n2. shell 检查你是否通过用户分配的 ACL 获得了任何权限。如果是这样，这些权限将被分派，且 shell 不再向下查找。\n\
  3. 如果你不是用户所有者且没有通过 ACL 获得权限，shell 会检查你是否是组所有者（组所有者组）的成员，也称为文件的组。如果你是该组的成员，你将以组的权限访问文件，且\
  \ shell 不再向下查找。\n4. 如果你已经到了这里，shell 会检查你是否通过组 ACL 获得了任何权限。如果是这样，这些权限将被应用，且 shell\
  \ 不再向下查找。如果你属于多个通过 ACL 获得权限的组，所有这些权限都将生效。\n5. 如果你既不是用户所有者也不是组所有者，且没有通过 ACL 获得权限，则\
  \ shell 将停止检查。\n\n\n\n\n如果当前用户 linda 想要更改有效主组，她可以使用 `newgrp` 命令，后跟上她想要设置为新有效主组的组名。该组将继续作为有效主组使用，直到用户使用\
  \ `exit` 命令或注销。示例 7-2 演示了用户 linda 如何使用此命令将 sales 设置为她的有效主组。\n\n**示例 7-2** 使用 `newgrp`\
  \ 更改有效主组\n\n点击此处查看代码图像\n\n```\n[lisa@server1 ~]$ groups\nlisa account sales\n[lisa@server1\
  \ ~]$ newgrp sales\n[lisa@server1 ~]$ groups\nsales lisa account\n[lisa@server1\
  \ ~]$ touch file1\n[lisa@server1 ~]$ ls -l\ntotal 0\n-rw-r--r--. 1 lisa sales 0\
  \ Feb 6 10:06 file1\n```\n\n更改有效主组后，用户创建的所有新文件都将以该组作为所有者组。要返回原始的主组设置，请使用 `exit`。\n\
  \n为了使用 `newgrp` 命令，用户必须是该组的成员。或者，可以使用 `gpasswd` 命令为组设置组密码，但这种方法很少使用。如果用户使用了 `newgrp`\
  \ 命令但不是目标组的成员，shell 会提示输入组密码。在输入正确的组密码后，将设置新的有效主组。\n\n### 管理基础权限\n\nLinux 权限系统发明于\
  \ 20 世纪 70 年代。由于当年的计算需求有限，所创建的基础权限系统也相当局限。这套基础权限系统使用了三种可以应用于文件和目录的权限。在本节中，你将学习该系统是如何工作的以及如何修改这些权限。\n\
  \n### 理解读、写和执行权限\n\n这三种基本权限允许用户读取、写入和执行文件。这些权限在应用于文件或目录时效果有所不同。如果应用于文件，读权限赋予了打开文件进行读取的权利。因此，你可以读取其内容，但也意味着你的计算机可以打开该文件对其进行某些操作。例如，需要访问库的程序文件需要对该库的读取权限。由此推导出，读取权限是你处理文件时所需的最基本权限。\n\
  \n如果应用于目录，读允许你列出该目录的内容。你应该意识到，此权限并不允许你读取目录中的文件。Linux 权限系统不具备继承性，读取文件的唯一方法是使用该文件本身的读取权限。然而，为了打开文件进行读取，拥有目录的读权限是非常方便的，否则你将看不到该文件。请注意，即使没有目录的读权限，如果你知道某个同名文件存在，仍然可以打开该文件。这并不方便，也因如此而通常不会这样做。\n\
  \n正如你可能猜到的那样，写权限如果应用于文件，则允许你在文件中写入内容。换句话说，写允许你修改现有文件的内容。但是，它不允许你创建或删除新文件。要实现这一点，你需要在想要创建文件的目录具有写权限。要修改文件的权限，你不需要该文件的权限；你只需要是所有者或\
  \ root（根用户）即可。对于目录，此权限还允许你创建和删除新的子目录。\n\n执行权限是你执行文件时需要的权限。如果你想在该目录中执行任何操作，也需要该目录的执行权限。它永远不会被默认设置，这使得\
  \ Linux 几乎完全免疫于病毒。只有拥有所有权的人才能应用执行权限。\n\n拥有文件的执行权限意味着你被允许运行程序文件，而如果应用于目录，意味着你被允许使用\
  \ `cd` 命令进入该目录。这意味着执行对于目录是一项重要的权限，你会发现它通常作为默认权限应用于目录。没有它，就没办法进入该目录！表 7-2 总结了基础权限的使用。\n\
  \n![](img/key_topic_icon.jpg)\n\n| 权限 | 应用于文件 | 应用于目录 |\n\n| --- | --- | --- |\n\
  | 读 | 打开文件 | 列出目录内容 |\n| 写 | 修改文件内容 | 创建和删除文件 |\n| 执行 | 运行程序文件 | 进入目录 |\n\n**表 7-2**\
  \ 读、写执行权限的使用\n\n#### 应用读、写和执行权限\n\n要应用权限，你需要使用 `chmod` 命令。使用 `chmod` 时，你可以为用户、组和其他人设置权限。你可以以两种模式使用此命令：相对模式和绝对模式。在绝对模式下，使用三个数字来设置基础权限。这三个数字分别应用于用户、组和其他人。表\
  \ 7-3 提供了权限及其数字表示的概述。\n\n![](img/key_topic_icon.jpg)\n\n| 权限 | 数字表示 |\n\n| --- |\
  \ --- |\n| 读 | 4 |\n| 写 | 2 |\n| 执行 | 1 |\n\n**表 7-3** 权限的数字表示\n\n在设置权限时，计算出所需的数值。如果你想对用户设置读、写、执行，对组设置读、执行，对其他人设置读、执行，例如，你使用以下\
  \ `chmod` 命令：\n\n```\nchmod 755 somefile\n```\n\n当你以这种方式使用 `chmod` 时，所有权限将被你设置的权限替换。如果你想相对于当前权限修改权限，可以使用相对模式使用\
  \ `chmod`。在相对模式下，你通过三个指示符来指定操作：\n\n*   首先，指定为谁更改权限。你可以在用户（u）、组（g）和其他（o）之间进行选择。\n\
  *   然后，使用运算符从当前模式中添加或删除权限，或者以绝对方式设置它们。\n*   最后，使用 `r`、`w` 和 `x` 指定你想设置的权限。\n\n在相对模式下更改权限时，你可以省略“为谁”部分为所有实体添加或删除权限。例如，以下为所有用户添加执行权限：\n\
  \n```\nchmod +x somefile\n```\n\n在相对模式下工作时，你也可以使用复杂的命令。例如，以下为组添加写权限并移除其他人的读权限：\n\
  \n```\nchmod g+w,o-r somefile\n```\n\n在练习 7-1 中，你通过为之前创建的组创建目录结构来学习如何使用基础权限。你还为这些目录分配了正确的权限。\n\
  \n提示\n\n使用 `chmod -R o+rx /data` 时，会对 /data 目录及其所有文件设置执行权限。只想对目录设置执行权限而不针对文件，请使用\
  \ `chmod -R o+rX /data`。大写的 `X` 确保除非文件已经为某些实体设置了执行权限，否则文件不会获得执行权限。这使得 `X` 成为处理执行权限更智能的方法；它避免了在不需要的文件上设置该权限。\n\
  \n### 管理高级权限\n\n除了你刚刚读到的基础权限之外，Linux 还有一组高级权限。这些不是你默认设置的权限，但有时可以提供有用的补充以实现更高级场景。在本节中，你将学习它们是什么以及如何设置它们。\n\
  \n#### 理解高级权限\n\n\n\n\n有三种高级权限。第一种是设置用户 ID（`SUID`）权限。在某些特定的情况下，你可能希望将此权限应用于可执行文件。在默认情况下，运行可执行文件的用户将使用其自身的权限运行该文件。对于普通用户来说，这通常意味着对程序的使用受到限制。但在某些情况下，用户在执行特定任务时需要特殊权限。\n\
  \n例如，考虑用户需要更改密码的情况。为了做到这一点，用户需要将他的新密码写入 `/etc/shadow` 文件。然而，对于没有 root 权限的用户来说，该文件是不可写的：\n\
  \n点击此处此处查看代码图片\n\n```\n[root@hnl ~]# ls -l /etc/shadow\n----------. 1 root root\
  \ 1184 Apr 30 16:54 /etc/shadow\n```\n\n`SUID` 权限为这个问题提供了一个解决方案。在 `/usr/bin/passwd`\
  \ 工具上，默认应用了此权限。这意味着用户在更改密码时，临时拥有 root 权限，这允许他向 `/etc/shadow` 文件写入内容。你可以通过 `ls -l`\
  \ 看到 `SUID` 权限，它在通常预期看到用户权限 `x` 的位置显示为 `s`：\n\n点击此处此处查看代码图片\n\n```\n[root@hnl ~]#\
  \ ls -l /usr/bin/passwd\n-rwsr-xr-x. 1 root root 32680 Jan 28 2010 /usr/bin/passwd\n\
  ```\n\n`SUID` 权限看起来很有用（在某些情况下确实如此），但它同时也具有潜在危险。如果应用不当，你可能会无意中交 root 权限。因此，我建议仅极其谨慎地使用，或者更好：完全不要使用。大多数管理员永远不需要使用它；你只会在某些操作系统需要将其设置为默认的文件上看到它。\n\
  \n第二种特殊权限是设置组 ID（`SGID`）。此权限有两个作用。如果应用于可执行文件，它将赋予执行该文件的用户该文件组所有者的权限。因此，`SGID` 可以实现与\
  \ `SUID` 类似的功能。然而，出于此目的，`SGID` 很少被使用。与 `SUID` 权限一样，`SGID` 作为默认设置应用于某些系统文件。\n\n当应用于目录时，`SGID`\
  \ 可能有用，因为你可以用它设置在该目录中创建的文件和子目录的默认组所有者。默认情况下，当用户创建一个文件时，他的有效主组被设置为该文件的组所有者。这并不总是很有用的，特别是因为在红帽企业\
  \ Linux 上，用户的主组被设置为一个与用户名同名的组，且该用户是该组的唯一成员。因此，默认情况下，用户创建的文件将不会与任何其他人共享组。\n\n想象一种情况：用户\
  \ `linda` 和 `lori` 在会计部门工作，并且都是 `account` 组的成员。默认情况下，这些用户都是他们作为唯一成员的私有组的成员。然而，这两个用户也是会计组的成员，但作为次要组设置。\n\
  \n默认情况是，当其中任一个用户创建文件时，主组将成为所有者。因此，默认情况下，`linda` 无法访问 `lori` 创建的文件，反之亦然。然而，如果你创建一个共享组目录（例如\
  \ `/groups/account`）并确保该目录应用了 `SGID` 权限，并且将 `accounting` 组设置为该目录的组所有者，在该目录中创建的所有文件及其所有子目录也将获得\
  \ `accounting` 组作为默认组所有者。出于这个原因，`SGID` 权限是一个在共享组目录上非常有用的权限。\n\n`SGID` 权限在 `ls -l`\
  \ 的输出中显示为 `s`，位置位于你通常找到组执行权限的地方：\n\n点击此处此处查看代码图片\n\n```\n[root@hnl data]# ls -ld\
  \ account\ndrwxr-sr-x. 2 root account 4096 Apr 30 21:28 account\n```\n\n第三种特殊权限是粘滞位（sticky\
  \ bit）。此权限用于在多个用户在同一目录下具有写入权限的环境中保护文件被意外删除。如果应用了粘滞位，用户只有当她是文件的所有者或该文件目录的所有者时才能删除该文件。正因如此，它被作为默认权限应用于\
  \ `/tmp` 目录，在共享组目录上也可能有用。\n\n如果没有粘滞位，如果用户可以在目录中创建文件，她也可以删除该目录中的文件。在共享组环境中，这可能是令人烦恼的。再次想象用户\
  \ `linda` 和 `lori`，他们对 `/data/account` 目录都有写入权限，并且因为是 `accounting` 组的成员而获得这些权限。因此，`linda`\
  \ 可以删除 `lori` 创建的文件，反之亦然。\n\n当你应用粘滞位时，用户只有满足以下任一条件时才能删除文件：\n\n*   用户是文件的所有者。\n*\
  \   用户是文件所在目录的所有者。\n\n当使用 `ls -l` 时，粘滞位显示为 `t`，位于你通常看到其他执行权限的地方：\n\n点击此处此处查看代码图片\n\
  \n```\n[root@hnl data]# ls -ld account\ndrwxr-sr-x. 2 root account 4096 Apr 30 21:28\
  \ account\n```\n\n### 提示\n确保你如何管理这些权限。RHCSA 目标特别提到了你需要能够使用 SGID 来创建共享组。\n\n### 应用高级权限\n\
  要应用 SUID、`SGID` 和粘滞位，你也可以使用 `chmod`。`SUID` 的数值值为 4，`SGID` 的数值值为 2，粘滞位为 1。如果你想应用这些权限，你需要\
  \ `chmod` 的四位参数，其中第一位代表特殊权限。例如，以下行将为目录添加 SGID 权限，并为其他人设置 rx：\n\n```\nchmod 2755\
  \ /somedir\n```\n\n如果在使用绝对模式的 `chmod` 之前查找已设置的权限是不实际的。因此，如果你需要应用任何特殊权限，我建议使用相对模式：\n\
  \n*   对于 SUID，使用 `chmod u+s`。\n*   对于 SGID，使用 `chmod g+s`。\n*   对于粘滞位，使用 `chmod\
  \ +t`，后面跟着你要设置权限的文件或目录名称。\n\n表 7-4 总结了管理特殊权限的所有重要知识。\n\n| 权限 | 数值值 | 相对值 | 在文件上\
  \ | 在目录上 |\n| --- | --- | --- | --- | --- |\n| SUID | 4 | u+s | 用户以文件所有者的权限执行。 |\
  \ 无意义。 |\n| SGID | 2 | g+s | 用户以组所有者的权限执行。 | 目录中的文件获得相同的组所有者。 |\n| 粘滞位 | 1 | +t\
  \ | 无意义。 | 防止用户删除其他用户的文件。 |\n\n### 练习 7-2\n在练习 7-2 中，你使用特殊权限让组成员更容易地共享文件。你分配了设置组位和粘滞位，并看到设置这些位后增加了便于组成员协作的功能。\n\
  \n## 管理 ACL\n上一节讨论的高级权限为 Linux 处理权限的方式增加了有用的功能，但该功能并不允许你在同一个文件上向多个用户或多个组赋予权限。访问控制列表（ACL）提供了此功能。此外，它们还允许管理员以更复杂的方式设置默认权限。\n\
  \n### 理解 ACL\n\n\n\n\n虽然 ACL 子系统为你的服务器增加了强大的功能，但它也有一个缺点：并不是所有工具都支持它。因此，在复制或移动文件时，你可能会丢失\
  \ ACL 设置，而且你的备份软件可能无法备份 ACL 设置。\n\n旧版本的 `tar` 工具不支持与 ACL 配合，这就是为什么引入 `star` 工具的原因。你现在不再需要这个工具了，因为当前版本的\
  \ `tar` 已经支持与 ACL 配合。然而，`star` 工具仍然列在考试目标中。\n\n**提示**\n\n你也可以使用 `getfacl` 来创建 ACL\
  \ 的备份，然后可以使用 `setfacl` 命令进行恢复。要创建备份，请使用 `getfacl -R /directory > file.acls` 命令。要从备份文件恢复设置，请使用\
  \ `setfacl --restore=file.acl` 命令。\n\n尽管如此，某些工具缺乏支持并不一定会成为一个问题。ACL 通常作为一种结构性措施应用于目录，而不是针对单个文件。因此，你不会有大量的\
  \ ACL，而只有几个应用在文件系统中明智位置的 ACL。所以即使你的备份软件不支持 ACL，恢复你正在使用的原始 ACL 也变得相对容易。\n\n#### 为文件系统准备\
  \ ACL\n\n在开始使用 ACL 之前，你可能需要为文件系统支持 ACL 做好准备。因为文件系统元数据需要扩展，文件系统并不总是默认支持 ACL。如果在为文件系统设置\
  \ ACL 时收到“operation not supported”（不支持操作）的消息，则说明你的文件系统可能缺乏 ACL 支持。要修复此，你需要在 `/etc/fstab`\
  \ 文件中添加 `acl` 挂载选项，这样文件系统默认就会带有 ACL 支持进行挂载。请阅读第 14 章“管理存储](#ch14.xhtml_ch14)”，获取更多关于\
  \ `/etc/fstab` 文件以及可以在该文件中使用的选项。\n\n#### 使用 setfacl 和 getfacl 修改和查看 ACL 设置\n\n要设置\
  \ ACL，使用 `setfacl` 命令。要查看当前的 ACL 设置，使用 `getfacl`。`ls -l` 命令不会显示任何现有 ACL；它只会在权限列表后显示一个\
  \ +，这表示 ACL 也适用于该文件。在设置 ACL 之前，使用 `getfacl` 显示当前的 ACL 设置始终是一个好主意。在示例 7-3 中，你可以看到通过\
  \ `ls -l` 显示以及通过 `getfacl` 显示的权限。如果你仔细观察，你会发现显示的信息是完全相同的。\n\n**示例 7-3** 使用 `ls -l`\
  \ 和 `getfacl` 权限\n\n点击此处查看代码图像\n\n```\n[root@server1 /]# ls -ld /dir\ndrwxr-xr-x.\
  \ 2 root root 6 Feb 6 11:28 /dir\n[root@server1 /]# getfacl /dir\ngetfacl: Removing\
  \ leading '/' from absolute path names\n# file: dir\n# owner: root\n# group: root\n\
  user::rwx\ngroup::r-x\nother::r-x\n```\n\n在示例 7-3 的 `getfacl` 命令结果中，你可以看到针对三个不同实体的权限：用户、组和其他。现在让我们让我们添加一个\
  \ ACL，也为 sales 组赋予读取和执行权限。为此使用的命令是 `setfacl -m g:sales:rx /dir`。在该命令中，`-m` 表示需要修改当前的\
  \ ACL 设置。之后，`g:sales:rx` 命令为 sales 组（`g`）设置 ACL 为读取和执行（`rx`）。在示例 7-4\n\n```\n[root@server1\
  \ /]# setfacl -m g:sales:rx /dir\n[root@server1 /]# getfacl /dir\ngetfacl: Removing\
  \ leading '/' from absolute path names\n# file: dir\n# owner: root\n# group: root\n\
  user::rwx\ngroup::r-x\ngroup:sales:r-x\nmask::r-x\nother::r-x\n```\n\n现在你已经了如何设置组\
  \ ACL，理解用户和其他的 ACL 也变得容易。例如，命令 `setfacl -m u:linda:rwx /data` 赋予用户 linda 对 `/data`\
  \ 目录的权限，而不会让她成为所有者也不会更改当前的所有者分配。\n\n`setfacl` 命令有很多可能和选项。其中一个选项特别重要：`-R` 选项。如果使用，该选项会将\
  \ ACL 应用于设置 ACL 时目录中存在的所有文件和子目录。在更改现有目录的 ACL 时，始终使用此选项是一个好习惯。\n\nACL 还允许你剥夺用户的权限。例如，命令\
  \ `setfacl -m u:anna:- /tmp` 会剥夺 anna 的所有权限。\n\n#### 使用默认 ACL\n\nACL 的一个好处是允许你为多个用户或组设置权限。另一个好处是可以通过使用\
  \ ACL 实现继承。通过设置默认 ACL，你决定了所有新创建项目的权限。但请注意，默认 ACL 不会更改现有文件的权限。要更改这些权限，你还需要设置普通 ACL！\n\
  \n**提示**\n\n这一点很重要。如果你想为同一个目录的多个用户或组配置 ACL，你需要设置两次 ACL。首先，使用 `setfacl -R -m` 修改现有文件的\
  \ ACL。然后，使用 `setfacl -m d:` 处理所有将要创建的项目。\n\n要设置默认 ACL，只需在 `-m` 选项后添加 `d`。（顺序很重要！）所以，如果希望\
  \ sales 组对所有创建的内容具有读取和执行权限，请使用 `setfacl -m d:g:sales:rx /data`。\n\n当你使用默认 ACL 时，为其他实体设置\
  \ ACL 也是很有用的。通常这没有意义，因为你可以通过 `chmod` 更改其他权限。但是，你无法使用 `chmod` 为每个新文件指定权限。例如，如果你希望其他人对\
  \ `/data` 中创建的任何内容都不获得权限，请使用 `setfacl -m d:o::- /data`。\n\n在练习 7-3 中，你将通过之前创建的 `/data/account`\
  \ 和 `/data/sales` 目录学习高级权限和 ACL。在之前的练习中，你确保了 sales 组拥有 `/data/sales` 的权限，account\
  \ 组拥有 `/data/account` 的权限。到目前为止，你还没有改进设计，而你将在本练习中这样做。你首先确保 account 组获得 `/data/sales`\
  \ 目录的读取权限，sales 组获得 `/data/account` 目录的读取权限。然后，你设置默认 ACL，以确保所有新文件的权限都正确设置。\n\n###\
  \ 使用 umask 设置默认权限\n\n\n\n\n\n在上一节关于 ACL 的内容中，你学习了如何处理默认 ACL。如果你不使用 ACL，则有一个 shell\
  \ 设置来决定你将获得的默认权限：`umask`。在本节中，你将学习如何使用 `umask` 修改默认权限。\n\n \n\n你可能已经注意到，在创建新文件时，系统会设置某些默认权限。这些权限是由\
  \ `umask` 设置决定的。该 shell 设置在用户登录系统时会应用于所有用户。在 `umask` 设置中，使用一个数值，该数值将从可以自动设置到文件的最大权限值中减去；文件的最大设置为\
  \ 666，目录的最大设置为 777。不过，该规则也存在一些例外情况。你可以在表 7-5 中找到 `umask` 设置的完整概述。\n\n在 `umask` 使用的数字中，与\
  \ `chmod` 命令的数值参数一样，第一个数字代表用户权限，第二个数字代表组权限，最后一个代表为其他人设置的默认权限。022 的默认 `umask` 设置会为你的服务器上创建的所有新文件赋予\
  \ 644 权限，为所有新目录赋予 755 权限。所有 `umask` 数值及其结果的完整概述见表 7-5。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 数值 | 应用于文件 | 应用于目录 |\n\n| --- | --- | --- |\n| 0 | 读和写 | 所有 |\n| 1 | 读和写 | 读和写\
  \ |\n| 2 | 读 | 读和执行 |\n| 3 | 读 | 读 |\n| 4 | 写 | 写和执行 |\n| 5 | 写 | 写 |\n| 6 | 无 |\
  \ 执行 |\n| 7 | 无 | 无 |\n\n**表 7-5** `umask` 数值及其结果\n\n查看 `umask` 设置如何工作的一种简单方法如下：从文件的默认权限（设置为\
  \ 666）开始，减去 `umask` 得到有效权限。对于目录，从其默认权限（设置为 777）开始，并减去 `umask` 得到有效权限。\n\n \n\n更改\
  \ `umask` 设置有两种方法：针对所有用户和针对单个用户。如果你想为所有用户设置 `umask`，必须确保在启动 `/etc/profile` 指示的 shell\
  \ 环境文件时考虑到 `umask` 设置。正确的方法是在 `/etc/profile.d` 目录下创建一个名为 `umask.sh` 的 shell 脚本，并在该脚本中指定你想使用的\
  \ `umask`。如果在文件中更改了 `umask`，它将在你登录服务器后应用于所有用户。\n\n \n\n通过 `/etc/profile` 和相关文件（其应用于所有登录系统的用户）设置\
  \ `umask` 的替代方案，是在单个用户家目录下创建的 `.profile` 文件中更改 `umask` 设置。在此文件中应用的设置仅对单个用户生效；因此，如果你需要更细粒度的控制，这是一个很好的方法。我个人很喜欢这个功能，可以将\
  \ `root` 用户的默认 `umask` 修改为 027，而普通用户则使用默认的 `umask` 022。\n\n### 使用用户扩展属性\n\n \n\n\
  当你处理权限时，用户或组对象与这些对象在文件或目录上拥有的权限之间始终存在一种关系。在 Linux 服务器上保护文件的另一种方法是使用属性。无论访问文件的用户是谁，属性都会起作用。\n\
  \n \n\n与 ACL 类似，对于文件属性，可能需要启用 `user_xattr` 的 `mount` 选项。如果你在处理用户扩展属性时收到“操作不支持”的消息，请确保在\
  \ `/etc/fstab` 文件中设置此 `mount` 选项。\n\n \n\n许多属性都有文档说明。某些属性可用但尚未实现。不要使用它们；它们对你毫无用处。以下是你可以应用的最用的属性：\n\
  \n*   **A**: 此属性确保文件的访问时间不被修改。通常情况下，每当打开文件时，文件的访问时间都必须写入文件的元数据中。这会对性能产生负面影响；因此，对于经常访问的文件，可以使用\
  \ `A` 属性禁用此功能。\n*   **a**: 此属性允许文件被添加但不能被删除。\n*   **c**: 如果你正在使用支持卷级压缩的文件系统，此文件属性可确保该文件在压缩引擎首次激活时被压缩。\n\
  *   **D**: 此属性确保对文件的更改立即写入磁盘，而不是先写入缓存。对于重要的数据库文件，这是一个非常有用的属性，可以确保它们不会在文件缓存和硬盘之间丢失。\n\
  *   **d**: 此属性确保文件在使用 `dump` 工具的备份中不会被备份。\n*   **I**: 此属性为启用的目录启用索引。这允许像 Ext3 这样使用原始文件系统实现更快速的文件访问，因为这些系统没有使用\
  \ B-tree 数据库来快速访问文件。\n*   **i**: 此属性使文件变为不可变。因此，无法对文件进行任何更改，这对于需要额外保护的文件非常有用。\n\
  *   **j**: 此属性确保在 Ext3 文件系统上，文件首先写入日志，然后才写入硬盘上的数据块。\n*   **s**: 此属性在文件被删除后，用 0 覆盖存储该文件的块。这确保了文件在被删除后无法恢复。\n\
  *   **u**: 此属性保存了“未删除”信息。这允许开发一种利用这些信息工作的程序，来救回被删除的文件。\n\n**注意**\n\n \n\n尽管可以使用许多属性，但请注意大多数属性仍然是实验性的，只有当使用了可以处理给定属性的应用程序时，它们才有用。例如，如果没有开发出可以使用该属性来恢复被删除文件的应用程序，那么应用\
  \ `u` 属性是没有意义的。\n\n \n\n如果你想应用属性，可以使用 `chattr` 命令。例如，使用 `chattr +s somefile` 将属性应用到\
  \ `somefile`。需要再次移除属性吗？使用 `chattr -s somefile` 即可将其移除。要获取当前应用的所有属性的概述，请使用 `lsattr`\
  \ 命令。\n\n### 总结\n\n \n\n在本章中，你学习了如何处理权限。你阅读了基础权限、高级权限以及在文件系统中应用 ACL。你还学习了如何使用 `umask`\
  \ 设置默认权限。在章末尾，你学习了如何使用用户扩展属性应用额外的安全级别。\n\n### 考试准备任务\n\n \n\n如引言中“如何使用本书”所示，你有多种准备考试的选择：章末实验、附录\
  \ B 中的记忆表、第 27 章](#ch27.xhtml_ch27)“最后的准备”以及模拟题。\n\n### 回习所有关键主题\n\n \n\n复习章中最重要的主题，这些主题在页面外边留有关键主题图标。表\
  \ 7-6 列出了这些关键主题的索引及其页码。\n\n| 关键主题元素 | 描述 | 页码 |\n\n| --- | --- | --- |\n| 表 7-2\
  \ | 基本权限的使用 | 150 |\n| 表 7-3 | 权限的数值表示 | 151 |\n| 表 7-4 | 特殊权限概述 | 155 |\n| 表 7-5\
  \ | umask 概述 | 161 |\n\n\n\n\n\n**表 7-6** 第 7 章 关键主题\n\n### 记忆完成表格和列表\n\n打印附录 B“记忆表格”（可在配套网站找到）或至少打印本章章节，并根据记忆完成表格和列表。附录\
  \ C“记忆表格答案页”包含已完成的表格和列表以供检查你的答案。\n\n### 定义关键术语\n\n定义本章后续的关键术语，并在术表中检查你的答案：\n\n-\
  \ 所有权\n- 权限\n- 访问控制列表\n- 继承\n- 属性\n\n### 复习题\n\n接下来的问题采用开放式格式，旨在帮助测试你对概念、术语的掌握以及知识的广度。你可以在附录\
  \ A 中找到这些问题的答案。\n\n1. 1. 如何使用 `chown` 将文件的组所有者设置为组？\n2. 2. 哪个命令可以找到所有属于特定用户的文件？\n\
  3. 3. 如何为 `/data` 下的所有文件对所有者和组所有者应用读、写、执行权限，同时不对其他人设置任何权限？\n4. 4. 哪个命令允许你在相对权限模式下，为想要变为可执行的文件添加执行权限？\n\
