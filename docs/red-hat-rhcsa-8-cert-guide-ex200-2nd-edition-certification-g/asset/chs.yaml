  \ `rm` 被别名为 `rm -i` 且你不想对每个文件进行确认，请使用替代方法。\n\n**9.** `tar zcvf /tmp/etchome.tgz\
  \ /etc /home` 创建 /etc 和 /home 的压缩包并将其写入 /tmp/etchome.tgz`。\n\n**10.** `tar xvf /tmp/etchome.tgz\
  \ /etc/passwd` 从 /tmp/etchome.tgz 中提取 /etc/passwd`。\n\n#### 第 4 章\n\n**1.** `ps\
  \ aux | less` 以易浏览的方式显示 `ps aux` 的结果。\n\n**2.** `tail -n 5 ~/samplefile` 显示 ~/samplefile\
  \ 的最后五行。\n\n**3.** `wc ~/samplefile`。你可能使用 `-w` 只显示字数。\n\n**4.** 按 `Ctrl-C` 停止输出。\n\
  \n**5.** `grep -v -e '^#' -e '^;' filename` 排除所有以 # 或 ; 开头的行。\n\n**6.** 使用 `+` 匹配一个或多个前面的字符。\n\
  \n**7.** `grep -i text file` 在文件中同时查找 *text* 和 *TEXT*。\n\n**8.** `grep -B 5 '^PATH'\
  \ filename` 显示所有以 *PATH* 开头的行以及其之前的五行。\n\n**9.** `sed -n 9p ~/samplefile` 显示 ~/samplefile\
  \ 的第 9 行。\n\n**10.** `sed -i 's/user/users/g' ~/samplefile` 将 ~/samplefile 中的单词\
  \ *user* 替换为 *users*。\n\n\n\n\n\n1. 通常情况下，控制台是 Linux 服务器上的主屏幕。\n2. 按 `Ctrl-Alt-F2`\
  \ 从文本登录提示符切换回 GUI 上的当前工作。\n3. `w` 或 `who` 显示所有当前在 Linux 服务器上打开了终端会话的用户。\n4. `/dev/pts/0`\
  \ 是在没有运行 GUI 的服务器上打开的第一个 SSH 会话所使用的设备名称。\n5. `ssh -v` 显示 SSH 在登录时正在执行的详细信息。\n6.\
  \ `ssh -X` 启动一个支持图形化应用的 SSH 会话。\n7. 需要编辑 `~/.ssh/config` 来修改 SSH 客户端设置。\n8. `scp\
  \ /etc/hosts lisa@server2:/tmp` 使用用户名 `lisa` 将 `/etc/hosts` 文件复制到 server2 的 `/tmp`\
  \ 目录。\n9. `~/.ssh/authorized_keys` 存储想要使用基于密钥的登录的远程用户的公钥。\n10. `ssh-keygen` 生成 SSH\
  \ 公钥/私钥对。\n\n## 第 6 章\n\n1. `0` 是用户 `root` 的 UID。\n2. `sudo` 定义在 `/etc/sudoers`\
  \ 中。\n3. 使用 `visudo` 修改 `sudo` 配置。\n4. `/etc/default/useradd` 和 `/etc/login.defs`\
  \ 可定义创建用户时使用的设置。\n5. 无，因为组是在 `/etc/group` 中创建的。\n6. 将用户变为 `wheel` 组员将授予用户通过 `sudo`\
  \ 访问所有管理员命令的。\n7. 使用 `vigr` 手动修改 `/etc/group` 文件。\n8. `passwd` 和 `chage` 可更改用户密码。\n\
  9. `/etc/shadow` 存储用户密码。\n10. `/etc/group` 存储组账户。\n\n## 第 7 章\n\n1. `chown :groupname\
  \ filename` 或 `chown .groupname filename` 设置文件的组所有者。\n2. `find / -user username`\
  \ 查找所有由特定用户拥的文件。\n3. `chmod -R 770 /data` 为 `/data` 下的所有文件赋予用户和组所有者读、写、执行权限，同时不对其他人设置任何权限。\n\
  4. 在相对权限模式下，使用 `chmod +x file` 为你想使其可执行的文件添加执行权限。\n5. 使用 `chmod g+s /directory`\
  \ 确保在目录中创建的所有新文件的组所有者设置为该目录的组组。\n6. `chmod +t /directory` 确保用户只能删除其所有的文件，或删除其所有的目录中的文件。\n\
  7. `setfacl -m g:sales:r` 添加一个 ACL，授予 sales 组成员对当前目录下所有现有文件的读取权限。\n8. 使用命令 `setfacl\
  \ -R -m g:sales:rx /dir` 和 `setfacl -m d:g:sales:rx /dir` 确保 sales 组成员对当前目录及其所有子目录下的所有文件，以及未来在此目录中创建的文件具有读取权限。\n\
  9. 确保 `umask` 的最后一位是 7。\n10. `chattr +i myfile` 确保没有人能意外删除 `myfile`。\n\n## 第 8 章\n\
  \n1. `213.214.215.96` 是 `213.214.215.99` 中的网络地址。\n2. `ip link show` 显示的是链路状态而非 IP\
  \ 地址。\n3. `NetworkManager` 在 RHEL 8 中管理网络配置。\n4. `/etc/hostname` 包含 RHEL 8 中的主机名。\n\
  5. `hostnamectl` 允许你轻松设置主机名。\n6. 在手动更改 `/etc/sysconfig/ifcfg` 文件内容后运行 `nmcli con\
  \ up`。\n7. 修改 `/etc/hosts` 以为特定 IP 地址的主机名解析。\n8. `ip route show` 显示当前的路由配置。\n9.\
  \ `systemctl status NetworkManager` 验证服务的当前状态。\n10. `nmcli con mod \"static\" ipv4.addresses\
  \ \"10.0.0.20/24\" 10.0.0.100` 更改网络连接上的当前 IP 地址和默认网关。\n\n## 第 9 章\n\n1. `createrepo`\
  \ 允许你将包含 RPM 包的目录变为仓库。\n2. 仓库文件中需要包含 `[some-label] name=some-name baseurl=http://server.example.com/repo`\
  \ 行。\n3. `yum repolist` 验证仓库是否可用。\n4. `yum provides useradd` 允许你搜索包含 `useradd` 文件的\
  \ RPM 包。\n5. 使用 `yum group list` 配合 `yum group info \"Security Tools\"` 显示包含安全工具的\
  \ yum 组名称和内容。\n6. `yum module enable php:5.1` 确保所有 PHP 相关的包将使用旧版本 5.1 安装，而不会实际安装任何内容。\n\
  7. `rpm -pq --scripts packagename` 允许你确保下载的 RPM 包不包含危险脚本。\n8. `rpm -qd packagename`\
  \ 显示 RPM 包中的所有文档。\n9. `rpm -qf /path/to/file` 显示某个文件来自哪个 RPM 包。\n10. `repoquery`\
  \ 允许你查询仓库软件。\n\n## 第 10 章\n\n1. `jobs` 提供所有当前 shell 作业概览。\n2. 按 `Ctrl-Z` 并输入 `bg`\
  \ 停止当前 shell 作使其在后台运行。\n3. 按 `Ctrl-C` 取消当前 shell 作业。\n4. 使用 `ps` 和 `kill` 等进程管理工具取消作业。\n\
  5. `ps fax` 显示进程间的父子关系。\n6. 使用 `renice -nn -p PID`，其中 `nn` 是 -1 到 -20 之间的值。注意你需要\
  \ root 权限增加进程优先级。\n7. `killall dd` 停止所有运行进程。\n8. `pkill mycommand` 停止 `mycommand`。\n\
  9. `k` 用于杀死进程。\n10. 运行 `tuned` 服务才能选择性能配置。\n\n## 第 11 章\n\n1. Unit 是 `systemd` 启动的内容。有多种类型，例如服务、挂载、套接等。\n\
  2. 使用 `systemctl list-units` 显示所有加载的服务单元。\n3. 通过使用 `systemctl enable` 命令创建服务的依赖。\n\
  4. 在 `/etc/profile` 中设置 `SYSTEMD_EDITOR` 变量以更改 `systemctl` 的默认编辑器。\n5. `/etc/systemd/system/`\
  \ 包含自定义的 systemd 单元文件。\n6. 包含 `Requires` 以确保单元文件会自动加载另一个单元文件。\n\n\n\n\n\n7. `systemctl\
  \ show httpd` 显示 `httpd.service` 单元可用的配置选项。\n8. `systemctl list-dependencies --reverse`\
  \ 显示特定单元的所有依赖项。\n9. `systemctl status` 输出单元处于死掉（dead）状态并不严重；它仅意味着该服务当前没有运行。\n10.\
  \ 对想要修改的单元使用 `systemctl edit` 会创建一个 systemd 覆盖文件。\n\n## 第 12 章\n\n1. 每两周执行一次的 cron\
  \ 任务被配置为 `/etc/cron.d` 中的特定 cron 文件，或者使用 `crontab -e -u` 用户名将其绑定到用户账户上。\n2. `0 14\
  \ 1,15 * *` 指定了一个每月执行两次的 cron 任务的执行时间，即每月 1 号和 15 号的下午 2 点。\n3. `*/2 * * * *` 指定了每天每两分钟运行一次任务的\
  \ cron 执行时间。\n4. `0 0 19 9 4` 指定了一个在 9 月 19 日以及 9 月的每个周四执行的任务。\n5. `sun`、`0` 和 `7`\
  \ 都指定 cron 任务需要在周日执行。\n6. `crontab -e -u lisa` 允许你为用户 lisa 调度 cron 任务。\n7. 创建 `/etc/cron.deny`\
  \ 文件并确保它包含了用户名 boris。\n8. 在 `/etc/anacrontab` 中指定任务，并确保 anacron 服务正在运行。\n9. `atd`\
  \ 服务必须运行才能调度 at 任务；使用 `systemctl status atd` 进行验证。\n10. 使用 `atq` 查找当前是否有任何计划执行的\
  \ at 任务。\n\n## 第 13 章\n\n1. `/etc/rsyslog.conf` 用于配置 `rsyslogd`。\n2. `/var/log/secure`\
  \ 包含与身份验证验证相关的消息。\n3. 日志文件默认在五周后轮转（当前文件保留一周，旧文件保留四周）。\n4. `logger -p user.notice\
  \ \"some text\"` 从命令行向用户设施（user facility）记录一条消息，使用 notice 优先级。\n5. 在 `/etc/rsyslog.d`\
  \ 中创建一个文件。名称并不重要。为其赋予以下内容：`*.=info /var/log/messages.info`。\n6. 你可以在 `/etc/systemd/journald.conf`\
  \ 中配置 journal 超过其默认的大小限制。\n7. `journalctl -f` 实时滚动显示 journal 中的新消息。\n8. `journalctl\
  \ _PID=1 --since 9:00:00 --until 15:00:00` 显示在上午 9 点到下午 3 点之间为 PID 1 写入的所有 journald\
  \ 消息。\n9. 在配置了持久化日志（persistent journal）的系统上，`journalctl -b` 显示自上次重启以来的 journald\
  \ 消息。\n10. 使 journald 日志持久化需要按顺序执行以下四个命令：\n```\nmkdir /var/log/journal\nchown root:systemd-journal\
  \ /var/log/journal\nchmod 2755 /var/log/journal\nkillall -USR1 systemd-journald\n\
  ```\n\n## 第 14 章\n\n1. `gdisk` 用于创建 GUID 分区。\n2. `fdisk` 用于创建 MBR 分区。\n3. `XFS`\
  \ 是 RHEL 8 默认文件系统。\n4. `/etc/fstab` 用于在启动时自动挂载分区。\n5. `noauto` 挂载选项用于指定启动时不挂载某个文件系统。\n\
  6. `mkswap` 允许你使用适当的文件系统格式化类型 8 的分区。\n7. `mount -a` 允许你在不实际重启的情况下测试启动时自动挂载分区的功能是否有效。\n\
  8. 如果使用 `mkfs` 命令而不指定文件系统，则创建 Ext2 文件系统。\n9. 使用 `mkfs.ext4` 或 `mkfs -t ext4` 格式化\
  \ Ext4 分区。\n10. 使用 `blkid` 查找计算机上所有设备的 UUID。\n\n## 第 15 章\n\n1. 分区类型 8 用于需要在 LVM\
  \ 中使用的 GUID 分区。\n2. `vgcreate vgroup -s 4MiB /dev/sdb` 创建指定的卷组。\n3. `pvs` 显示系统中物理卷的简要摘要以及它们所属的卷组。\n\
  4. 只输入 `vgextend vgroup /dev/sdd`。你不需要磁盘设备上进行任何操作。\n5. 使用 `lvcreate -L 6M -n lvvol1\
  \ vgname`。注意，这只有在你使用 2-MiB 物理范围大小创建了卷组时才有效。\n6. `lvextend -L +100M /dev/vgname/lvvol1`\
  \ 为逻辑卷 lvvol1 增加 100 MB。\n7. `UUID=xxx /stratis1 xfs defaults,x-systemd.requires=stratisd.service\
  \ 0 0`\n8. `stratis pool create mypool /dev/sdd` 创建一个基于块设备 `/dev/sdd` 的 Stratis\
  \ 池。\n9. `vdo create --name=vdo1 --device=/dev/sde --vdoLogicalSize=1T` 创建一个大小为\
  \ 1T 的 VDO 设备。\n10. 使用 `mkfs.xfs` 的 discard 选项 `-k` 在 VDO 精简配置卷上创建 XFS 文件系统。\n\n\
  ## 第 16 章\n\n1. `uname -r` 显示计算机当前的内核版本。\n2. 关于 RHEL 8 安装的当前信息位于 `/etc/redhat-release`。\n\
  3. `lsmod` 显示当前加载的内核模块列表。\n4. `modinfo modulename` 显示内核模块参数。\n5. `modprobe -r` 卸载内核模块。\n\
  6. 使用 `lsmod` Find 哪些其他内核模块需要此内核模块，并先卸载这些模块。注意，这并不总是有效的，特别是当考虑的硬件当前在使用时。\n7. 使用\
  \ `modinfo` 查找支持哪些内核模块参数。\n8. 在 `/etc/modprobe.d` 中创建一个文件并使用语句包含参数。\n9. 在自动加载 cdrom\
  \ 模块的文件包含 `options cdrom debug=1`。\n10. `yum upgrade kernel` 安装新内核。\n\n## 第 17 章\n\
  \n1. 单元（unit）是由 systemd 启动的内容。有多种类型，例如服务、挂载、套字等。\n2. 使用 `systemctl mask` 确保目标不再可以在系统启动时自动启动。\n\
  3. 修改 `/etc/default/grub` 以对 GRUB 2 应用常用更改。\n4. `systemctl --type=service` 显示所有当前加载的服务单元。\n\
  5. 通过使用 `systemctl enable` 为服务创建一个想要（want）。\n6. `systemctl isolate rescue.target`\
  \ 将当前运行目标切换到救援目标。\n\n\n\n\n\n## 7 有两种类型的目标：可以独立运行的目标和不能独立运行的目标。检查目标单元文件以获取更多信息，并确保目标是可隔离的（这意味着它可以独立运行）。\n\
  \n## 8 `systemctl list-dependencies --reverse` 显示哪些其他单元对 systemd 服务有依赖关系。\n\n##\
  \ 9 在 `/etc/default/grub` 中应用 GRUB 2 的更改。\n\n## 10 应用 GRUB 2 配置更改后，运行 `grub2-mkconfig\
  \ > /boot/grub2/grub.cfg`。\n\n## 第 18 章\n\n### 1 按 `e` 进入 GRUB 启动菜单编辑器模式。\n\n###\
  \ 2 `/etc/fstab` 中的错误会导致该文件系统上的 `fsck` 命令无法成功完成。\n\n### 3 在加载内核的 Grub 参数行中传递 `rd.break`，以启动重置\
  \ root 密码的程序。\n\n### 4 从救援系统启动。\n\n### 5 `systemctl list-units` 显示特定的故障排除环境中可用哪些单元。\n\
  \n### 6 在 GRUB 2 启动加载程序中传递 `rd.break`，以开始排除丢失的 root 密码。\n\n### 7 `load_policy -i`\
  \ 加载 SELinux 策略。\n\n### 8 `chcon -t shadow_t /etc/shadow` 确保 SELinux 标签设置正确。\n\n\
  ### 9 `grub2-mkconfig -o /boot/grub2/grub.cfg` 保存应用到 GRUB 2 启动加载器的更改。\n\n### 10\
  \ `systemd.unit=emergency.target` 进入最基础的故障排除模式。\n\n## 第 19 章\n\n### 1 脚本将由父 shell\
  \ 相同的 shell 解释。\n\n### 2 可以使用 `test -z $VAR` 或 `[ -z $VAR ]` 来检查变量 `VAR` 是否没有值。\n\
  \n### 3 使用 `$#` 统计已使用的参数数量。\n\n### 4 使用 `$@` 引用启动脚本时使用的所有参数。\n\n### 5 使用 `read SOMEVAR`\
  \ 在脚本中处理用户输入。\n\n### 6 `[ -f filename ] || echo file does not exist` 确定文件是否存在，如果不存在则执行指定的命令。\n\
  \n### 7 `[ -e filename ]` 可用于确定项目是文件还是目录。\n\n### 8 `for` 语句通常用于评估项目范围。\n\n### 9\
  \ 你不需要；它是 `if` 语句的一部分，该语句用 `fi` 结束。\n\n### 10 在最后一个命令后使用 `;;` 关闭特定项目。\n\n## 第 20\
  \ 章\n\n### 1 使用 `ssh-agent` 和 `ssh-add` 缓存设置在你的私钥上的密码句（passphrase）。\n\n### 2 使用\
  \ `AllowUsers lisa` 禁止 root 登录并仅允许用户 `lisa` 登录到你的服务器。\n\n### 3 两次指定 `Port` 行，以配置你的\
  \ SSH 服务器在两个不同的端口上进行监听。\n\n### 4 主 SSH 配置文件是 `/etc/ssh/sshd_config`。\n\n### 5 密码句将存储在内存中的保护区域。\n\
  \n### 6 `/etc/ssh/ssh_config` 包含所有用户的 SSH 客户端设置。\n\n### 7 管理此功能的 `MaxSessions` 参数默认已设置为\
  \ 10，因此你不需要更改任何内容。\n\n### 8 `semanage port -a -t ssh_port_t -p tcp 2022` 配置 SELinux\
  \ 允许 SSH 绑定到端口 2022。\n\n### 9 `firewall-cmd –add-port 2022/tcp --permanent; firewall-cmd\
  \ --reload` 配置 SSH 服务器上的防火墙，允许进入连接到端口 2022。\n\n### 10 尝试 `UseDNS`。此选项默认启用，使用 DNS\
  \ 获取目标的名称进行验证。\n\n## 第 21 章\n\n### 1 Basic Web Server 软件包组包含有用的 Apache 包。\n\n###\
  \ 2 `systemctl enable --now httpd` 自动启动 `httpd` 服务。\n\n### 3 `/etc/httpd/conf.d`\
  \ 是默认位置，RPM 可以在此处放置 Apache 服务器应该被考虑的配置文件。\n\n### 4 `curl` 允许你从没有提供图形界面的服务器测试 Web\
  \ 服务器。\n\n### 5 `/etc/httpd/conf/httpd.conf` 是默认配置文件。\n\n### 6 `/var/www/html` 用作默认\
  \ Apache 根目录。\n\n### 7 Apache 进程查找 `index.xhtml`。\n\n### 8 使用 `systemctl status\
  \ httpd` 或 `ps aux| grep http` 检查 Apache Web 服务器是否正在运行。\n\n### 9 `/etc/httpd/conf.d`\
  \ 是存储虚拟主机文件的首选位置。\n\n### 10 `ServerRoot` 默认设置为 `/etc/httpd`。\n\n## 第 22 章\n\n###\
  \ 1 `setenforce 0` 临时将 SELinux 置于许可模式（permissive mode）。\n\n### 2 `getenforce -a`\
  \ 或 `semanage boolean -l` 提供所有布尔值（Booleans）的列表。\n\n### 3 使用 `sepolicy man` 命令查看特定服务的\
  \ SELinux 手页。\n\n### 4 安装 `setroubleshoot-server` 以在审计日志中获取易读的 SELinux 日志消息。\n\n\
  ### 5 使用 `semanage fcontext -a -t httpd_sys_content_t \"/web(/.*)\"` 后接 `restorecon`\
  \ 将 `httpd_sys_content_t` 上下文类型应用于目录 `/web`。\n\n### 6 绝对不要！\n\n### 7 修改 `/etc/sysconfig/selinux`\
  \ 以完全禁用 SELinux。\n\n### 8 SELinux 将其所有消息记录在 `/var/log/audit/audit.log` 中。\n\n###\
  \ 9 `man -k _selinux | grep ftp` 显示 FTP 服务可用的上下文类型。\n\n### 10 使用 `setenforce 0`\
  \ 临时将 SELinux 切换到许可模式并重试。\n\n## 第 23 章\n\n### 1 在尝试使用 `firewall-config` 创建防火墙配置之前，`firewalld`\
  \ 应该处于运行状态。\n\n### 2 `firewall-cmd --add-port=2345/udp` 将 UDP 端口 2345 添加到默认区域的防火墙配置中。\n\
  \n### 3 `firewall-cmd --list-all-zones` 列出所有区域的所有墙配置。\n\n### 4 `firewall-cmd --remove-service=vnc-server`\
  \ 从当前防火墙配置中移除 `vnc-server` 服务。\n\n### 5 `--reload` 激活通过 `--permanent` 添加的新配置。\n\n\
  ### 6 `--list-all` 允许你验证新配置已添加到当前区域并现在已激活。\n\n### 7 `firewall-cmd --add-interface=eno1\
  \ --zone=public` 将接口 `eno1` 添加到公共区域。\n\n### 8 新接口将被添加到默认区域。\n\n### 9 `firewall-cmd\
  \ --permanent --add-source=192.168.0.0/24` 将源 IP 地址 192.168.0.0/24 添加到默认区域。\n\n\
  ### 10 `firewall-cmd --get-services` 列出 firewalld 中当前可所有服务。\n\n## 第 24 章\n\n###\
  \ 1 `showmount` 命令还需要在防火墙中开放 `mountd` 和 `rpc.bind` 服务。\n\n\n\n\n\n## 2. `showmount\
  \ -e server1` 显示 server1 上可用的 NFS 挂载。注意，`showmount` 命令无法通过防火墙。\n\n## 3. `mount [-t\
  \ nfs] server1:/share /somewhere` 挂载位于 `server1:/share` 的可用 NFS 共享。\n\n## 4. `smbclient\
  \ -L` 显示特定服务器上的 SMB 挂载。\n\n## 5. 在进行 SMB 挂载之前，在 SMB 客户端上安装 `cifs-utils`。\n\n## 6.\
  \ `mount -t cifs -o guest //server1/data /mnt` 以 guest 权限将 server1 上的 Samba 共享挂载到本地目录\
  \ `/mnt`。\n\n## 7. 要挂载 Samba 导出的文件系统，请在 `/etc/fstab` 中 `cifs` 文件系统类型。\n\n## 8. `auto.master`\
  \ 是自动挂载的主要配置文件。\n\n## 9. `autofs` 实现自动挂载。\n\n## 10. 无。你需要在服务器上打开端口，而不是在客户端上。\n\n\
  ## 第 25 章\n\n## 1. `date -s 16:24` 将系统时间设置为下午 4:24。\n\n## 2. `hwclock --systohc`\
  \ 将硬件时间设为当前系统时间。\n\n## 3. `date -d '@nnnnnnn'` 将 epoch 时间显示为人类可读的时间。\n\n## 4. `hwclock\
  \ --hctosys` 将系统时钟与硬件时间同步。\n\n## 5. `chronyd` 用于在 RHEL 8 上管理 NTP 时间。\n\n## 6. `timedatectl\
  \ set-ntp 1` 允许你在服务器上使用 NTP 时间。\n\n## 7. `/etc/chrony.conf` 包含要使用的 NTP 服务器列表。\n\n\
  ## 8. 使用 `timedatectl list-timezones` 或 `tzselect` 可以列出时区。\n\n## 9. `timedatectl\
  \ set-timezone ZONE` 用于设置当前时区。\n\n## 10. `timedatectl set-time TIME` 用于设置系统时间。\n\
  \n## 第 26 章\n\n## 1. RHEL 8 包含了 `buildah` 用于处理容器镜像。\n\n## 2. 容器环境需要命名空间（namespaces）、`cgroups`\
  \ 和 SELlinux。\n\n## 3. `CRI-o` 是 RHEL 8 容器引擎。\n\n## 4. `/etc/containers/registries.conf`\
  \ 文件定义了当前使用的注册表。\n\n## 5. 在容器镜像中，指定了一个默认命令。当你启动容器时，会执行默认命令。执行默认命令后，容器将停止。在 Ubuntu\
  \ 和 Fedora 等通用系统镜像中，默认命令设置为 `/bin/bash`，因此如果不指定其他内容，容器将立即停止。\n\n## 6. 红帽提供了通用基础镜像（UBI），作为所有基于\
  \ RHEL 的容器产品的基础\n\n## 7. 对镜像使用 `podman inspect` 并查找 `Cmd`。\n\n## 8. 使用 `podman run\
  \ ubuntu cat /etc/os-release` 命令。\n\n## 9. 你需要通过 `sudo podman run -d -p82:80 nginx`\
  \ 将其作为 root 容器运行。接下来，你需要使用 `sudo firewall-cmd --add-port 82/tcp --permanent; sudo\
  \ firewall-cmd --reload` 打开防火墙。\n\n## 10. 使用 `podman generate systemd --name nginx\
  \ --files` 命令。\n\n## 术语表\n\n`PATH` 变量，包含一个目录列表，当用户输入命令时会在这些目录下搜索可执行文件。\n\n`.` 当前目录。可以使用\
  \ `pwd` 请求其值。\n\n`absolute filename` 以 `/` 开头的完整文件名。\n\n`access control list (ACL)`\
  \ 在 Linux 中，访问控制列表允许多个用户拥有权限。\n\n`anacron` 一种确保在系统关机时运行关键任务的服务。\n\n`AND` 一种逻辑构造结构。\n\
  \n`Application profile` 软件包集合。\n\n`Application Stream` 特定的版本。\n\n`archiving` 一个可以备份的系统。\n\
  \n`at` 用于调度未来的任务。\n\n`attribute` 一个可以设置的属性。例如，设置了不可变（immutable）属性的文件无法被删除。\n\n`audit\
  \ log` 位于 `/var/log/audit/audit.log` 的主日志。\n\n`auditd` 运行在 RHEL 上的服务。\n\n`autofs`\
  \ 一个负责自动挂载文件系统的服务。\n\n`automount` 由 `autofs` 启动的过程。\n\n`background process` 在系统上运行且未活动控制控制的进程。\n\
  \n`backup` 重要数据的副本。\n\n`Bash` RedHEL Enterprise Linux 上使用的默认 shell。\n\n`Basic Input\
  \ Output System (BIOS)` 计算机启动时第一个启动的软件。\n\n`binary` 基于位值的数值计数方案。\n\n`boot loader`\
  \ 加载操作系统内核的程序。\n\n`BtrFS` 一种通用的 Linux 文件系统。\n\n`cache` 在内存管理中，存储最近使用的文件的区域。\n\n\
  `capability` 在 Linux 上可以执行的特定任务。\n\n\n\n\n`CentOS` 一种 Linux 发行版，它使用了所有 Red Hat 软件包，但从这些软件包中删除了\
  \ Red Hat 标志，以便免费分发软件。如果没有访问 RHEL，CentOS 是练习 RHCSA 考试的最佳选择。\n\n`certificate` 在 PKI\
  \ 密码学中，包含证书颁发者的公钥。该公钥由证书颁发机构的证书进行签名，从而保证了其可靠性。\n\n`certificate authority (CA)` 一种常用的用于保证\
  \ PKI 证书可靠性的组织。证书颁发机构提供用于签名公钥证书的证书。除了使用常用组织，也可以将自签名证书用于内部目的。\n\n`chrony` 在 Red Hat\
  \ Enterprise Linux 中提供时间同步服务的程序。\n\n`chroot` 一种环境，其中文件系统的部分被呈现为文件系统的根。chroot 被用作安全功能，用于隐藏特定服务不需要的操作系统部分内容。\n\
  \n`CIFS` 参见 Common Internet File System。\n\n`cloud` 一种允许灵活使用托管计算资源的计算平台。\n\n`Common\
  \ Internet File System (CIFS)` 微软服务器消息块 (SMB) 协议的标准版本，用于以与 Windows 服务器和客户端兼容的方式访问共享打印机、文件和目录。CIFS\
  \ 已成为 IT 领域文件共享的事实标准。\n\n`compression` 一种通过分析冗余模式并更高效地存储来减小文件大小的技术。\n\n`conditional\
  \ loop` 在 shell 脚本中，一组仅在满足特定条件时才执行的命令。\n\n`connection (in network card configuration)`\
  \ 与网络接口关联的网络配置参数集。\n\n`connection (in network communication)` 双方之间已初始会话，将一直持续到连接断开为止。\n\
  \n`console` 在 Linux 中，用户进行工作的主终端。它也是一个名为 `/dev/console` 的特定设备。\n\n`container` 一个从镜像启动并包含所有应用程序依赖项的准备就绪的应用程序。\n\
  \n`container engine` 允许你在操作系统上运行容器的代码。\n\n`context` 在 SELinux 中，一种用于定义用户、进程、端口和目录安全属性的标签。这些上下文在\
  \ SELinux 策略中用于定义安全规则。\n\n`context switch` 当 CPU 从执行一个任务切换到执行另一个任务时。\n\n`context\
  \ type` 在 SELinux 中，一种标识用户、进程、端口和进程 SELinux 属性的标签。\n\n`Coordinated Universal Time\
  \ (UTC)` 一种全球统一的时间标准，无论用户处于哪个时区。UTC 大致对应于格林尼治标准时间 (GMT)。\n\n`credentials file` 一个可以从\
  \ `/etc/fstab` 文件自动挂载 CIFS 文件系统的文件。凭据文件存储在安全位置（如 root 用户家目录），包含了用于挂载远程文件系统的用户名和密码。\n\
  \n`CRI-o` RHEL 8 默认容器引擎。读音为 *CRY-o*。\n\n`cron` 一种负责在特定时间重复启动服务的程序。\n\n`cryptography`\
  \ 一种保护数据的技术，通常通过将信息转换为不可读状态，并使用密钥来解密加密数据。密码学不仅用于保护传输中的文件，还用于保护身份验证程序。\n\n### D\n\
  \n`deduplication` 一种存储技术，通过分析要存储在磁盘上的数据并提取重复模式来允许更高效的存储。用于 VDO。另请参见 Virtual Data\
  \ Optimizer (VDO)。\n\n`default route` 默认用于将目的地在外部网络的 IP 数据包转发的路由。\n\n`dependency`\
  \ 通常情况下，一个项目需要另一个项目的情况。依赖关系在 Linux 中存在多个层次。在 RPM 软件包管理中，依赖项是指安装另一个包时必须存在的软件包。在 Systemd\
  \ 中，依赖项是指在加载另一个单元之前必须加载的 Systemd 单元。\n\n`dependency hell` 指在安装包时需要其他包，而这些包本身也可能需要依赖项的情况。依赖地狱问题已通过引入基于仓库的系统得到解决。\n\
  \n`destination` 在 rsyslog 中，日志系统发送日志消息的地方。目的地通常是文件，也可以是输入模块、输出模块、用户或主机。\n\n`device`\
  \ 附加到计算机上以执行特定任务的外围设备。\n\n`device file` 在 `/dev` 目录中创建的、用于表示和与设备交互的文件。\n\n`device\
  \ mapper` Linux 内核中用于与存储设备通信的服务。Device mapper 被 LVM、multipath 以及其他设备使用，但普通硬盘不使用。由\
  \ device mapper 创建的设备文件可以在 `/dev/mapper` 目录中找到。\n\n`directory` 文件系统中的文件夹，可以以组织的方式存储文件。\n\
  \n`disabled mode` SELinux 的完全禁用的模式。\n\n`distribution` 一种带有自己的安装程序或已准备好可用的 Linux\
  \ 版本。由于 Linux 是不同工具和其他组件的集合，Linux 发行版收集了这些工具和其他组件，可能也可能未对其进行增强，并将其分发，使用户无需自行收集所有不同的组件。\n\
  \n`dmesg` 可读取内核环形缓冲器的工具，包含了 Linux 内核生成的日志消息。\n\n`Docker` 一种常用的容器解决方案。Docker 曾是 RHEL\
  \ 8 的默认容器解决方案，但不再受支持，并被 CRI-o/podman 代替。\n\n`dracut` 用于生成 initramfs 的工具，initramfs\
  \ 是 Linux 操作系统的重要部分，包含了启动 Linux 系统所需的驱动程序和其他文件。\n\n`dynamic route` 由自动路由协议管理的网络路由。\n\
  \n### E\n\n`enforcing mode` SELinux 完全运行并应用为特定系统配置的所有限制的模式。\n\n`environment` 用户或进程工作时使用的设置集合。\n\
  \n`epoch time` 在 Linux 中，自纪元以来经过的秒数（对应于 1970 年 1 月 1 日午夜）。某些工具写入纪元时间而非实际时钟时间。\n\n\
  `escaping` 在 shell 环境中，使用特殊语法确保特定字符不被 shell 解释。在屏幕上显示特定字符或确保正则表达式元字符不先被 bash shell\
  \ 解释时，转义可能是必要的。\n\n`export` 在 NFS 中，在 NFS 服务器上共享的允许其他服务器访问的目录。\n\n`Ext2, 3, and\
  \ 4` 三种不同版本的 Ext 文件系统。直到 RHEL 6 为止，Ext4 是默认文件系统。它现在被认为无法满足现代存储需求，因此 RHEL 7 中的 Ext4\
  \ 已被 XFS 替换为默认文件系统。\n\n\n\n\n\n**扩展分区 (extended partition)** 一个在 MBR 磁盘上创建四个以上分区的解决方案。在\
  \ MBR 磁盘上，分区表最多存储四个分区。为了能够超过这个数量，可以将四个分区中的一个创建为扩展分区。在扩展分区内部，可以创建逻辑分区，逻辑分区的运行方式与普通分区，允许系统管理员创建更多分区。\n\
  \n**外部命令 (external command)** 以文件形式存在于磁盘磁盘上的命令。\n\n## F\n\n**设施 (facility)** 在 `rsyslogd`\
  \ 中，日志信息的来源。`rsyslogd` 中定义了数量严格限制的设施。\n\n**Fedora** 由 Red Hat 赞助的自由开源 Linux 发行版。在\
  \ `Fedora` 中，会提供并测试新功能。其中某些功能将包含在 Red Hat Enterprise Linux（红帽企业 Linux）的后续版本中。\n\n\
  **FHS** *参见* 文件系统层级标准。\n\n**文件描述符 (file descriptor)** Linux 进程用于指向其正在使用的文件的指针。\n\
  \n**文件系统 (file system)** 在存储设备上创建的逻辑结构。在 Linux 文件系统中，inodes 用于文件系统管理，实际数据被写入块中。*另见*\
  \ inode。\n\n**文件系统层级标准 (Filesystem Hierarchy Standard (FHS))** 定义哪些 Linux 目录应该用于什么用途的标准。读取\
  \ `man 7 hier` 可查看 FSH 的规范。\n\n**防火墙 (firewall)** 用于过滤网络上数据包的解决方案。防火墙用于确保只有授权的流量可以到达系统。防火墙可以通过\
  \ Linux 内核的 `Netfilter` 功能提供，通常也作为网络设备提供。\n\n**firewalld** 一种现代服务（取代了 `iptables`），用于\
  \ RHEL 7 和 RHEL 8 中基于 Linux 内核防火墙框架实现防火墙功能。\n\n**文件夹 (folder)** 也称为目录（directory），文件系统中的一种结构，用于组织在一起的文件。\n\
  \n**前台进程 (foreground process)** 用户启动的 Linux 进程可以在前台运行，也可以在后台运行。如果一个进程作为前台进程启动，在它完成或移动到后台之前，无法在同一终端中启动其他进程。*另见*\
  \ 后台进程。\n\n**fstab** Linux 上使用的一种配置文件，用于在系统启动时自动挂载文件系统。\n\n## G\n\n**GECOS** `/etc/passwd`\
  \ 文件中的一个字段，可存储 Linux 操作系统上用户的个人数据。GECOS 原代表通用电气综合操作系统监视（General Electric Comprehensive\
  \ Operating Supervisor）。\n\n**全局唯一标识 (global unique ID (GUID))** 一个由部分组成的标识符，这些部分确保了其在全球范围内是唯一的。\n\
  \n**GPT** *参见* GUID 分区表。\n\n**组 (group)** 项目的集合。在用户管理中，组用于同时为多个用户分配权限。在 Linux 中，每个用户都是至少一个组的成员。\n\
  \n**组所有者 (group owner)** 被设置为文件或目录所有者的组。在 Linux 上，每个文件和目录都有一个用户所有和一个组所有者。组所有权在文件创建时设置，除非另有配置，否则将被设置为创建文件用户的主组。\n\
  \n**GRUB** *参见* GRUB 2。\n\n**GRUB 2** 安装在大多数需要启动 Linux 的系统上的引导加载程序。GRUB 2 提供一个启动提示符，可以在其中输入不同的内核启动选项，这在需要排查启动故障时非常有用。\n\
  \n**GUID** *参见* 全局唯一标识。\n\n**GUID 分区表 (GUID Partition Table (GPT))** 一种在硬盘上存储分区的现代解决方案，相对于旧的\
  \ MBR 分区表。在 GUID 分区中，总共可以创建 128 个分区，主分区、扩展分区和逻辑分区之间不再区别。\n\n**gzip** Linux 上用于文件压缩和解压缩的最常用工具之一。\n\
  \n## H\n\n**硬链接 (hard link)** 与 `inode` 关联的名称。inodes 用于存储 Linux 文件。一个 inode 包含了文件的完整管理信息，包括存储文件所在的块。没有至少一个硬链接的文件被视为已删除的文件。为了增加文件的可用性，可以为一个\
  \ inode 创建多个硬链接。\n\n**硬件时间 (hardware time)** 由计算机硬件（通常是 BIOS 时钟）提供的时间。当 Linux 系统启动时，它会根据硬件时间设置软件时间。由于硬件时间通常不准确，大多数\
  \ Linux 系统使用网络时间协议 (NTP) 将系统时间与可靠的时间源同步。\n\n**十六进制 (hexadecimal)** 一种基于 4 字节组的 16\
  \ 进制计数。十六进制数字从 0 到 9，然后是 A 到 F。由于十六进制在计算机技术中高效得多，因此经常被使用。在 IPv6 中，IP 地址以十六进制形式写入。\n\
  \n**虚拟机监控程序 (hypervisor)** 一种创建并运行虚拟机的计算机软件、固件或硬件。在 Linux 中，`KVM` 是常用的虚拟机监控软件。\n\
  \n## I\n\n**镜像 (image)** 启动的只读实例。\n\n**继承 (inheritance)** 在权限管理中，在目录中创建的新文件继承父目录权限设置的情况。\n\
  \n**init** 在 Linux 内核和 `initramfs` 加载后启动的第一个进程。所有其他进程都从 `init` 进程启动。从 RHEL 7 开始，`init`\
  \ 进程已被 `Systemd` 取代。\n\n**initramfs** 初始内存文件系统。包含了系统启动第一阶段所需的驱动程序和其他文件。在红帽企业 Linux\
  \ 上，`initramfs` 在安装期间生成，并可以使用 `dracut` 工具手动重新创建。\n\n**inode** 包含文件完整管理信息的结构。每个 Linux\
  \ 文件都有一个 inode，inode 包含了文件的所有属性，但不包含文件名。\n\n**输入模块 (input module)** `rsyslog` 中的一种模块，允许\
  \ `rsyslog` 从特定源接收日志消息。\n\n**接口 (interface)** 在 Linux 网络中，可以为特定设备激活的配置参数集。一个设备可以存在多个接口配置，但一次只能有一个接口处于激活状态。\n\
  \n**内部命令 (internal command)** Shell 的一部分且在磁盘上不以文件形式存在的命令。\n\n**互联网协议 (Internet Protocol\
  \ (IP))** 计算机用于通信的主要通信协议。互联网协议有两个版本（IPv4 和 IPv6）。除了节点地址，它还定义了路由，使得节点能够相互联系。\n\n\
  **IP** *参见* 互联网协议。\n\n**iptables** 一种在 Linux 操作系统上创建防火墙规则的旧解决方案。它与 `Netfilter` Linux\
  \ 内核功能交互，是早期 RHEL 版本创建软件防火墙的默认解决方案。从 RHEL 7 开始，`iptables` 已被 `firewalld` 取代。\n\n\
  **IPv4** 互联网协议的第 4 版本。它开发于 20 世纪 70 年代，1981 年引入。它通过使用 32 位地址空间允许理论约 40 亿个节点。它仍然是目前最重要的\
  \ IP 版本。\n\n**IPv6** 互联网协议的第 6 版本。它开发于 90 年代，以解决 IPv4 地址短缺问题。它使用 128 位地址空间，允许标识\
  \ 3,4e38 个节点，因此被认为是虚拟无限的地址空间。\n\n**迭代 (iteration)** 在 Shell 脚本中，条件循环处理的其中一次，直到达到预期结果。\n\
  \n\n\n\n\n`job` 在 Linux shell 中，运行在当前终端中的任务。作业可以在前台或后台启动。每个作业也作为一个进程是可见的。\n\n`journalctl`\
  \ Systemd 中负责处理日志消息的部分。\n\n`journald` Systemd 中负责记录已发生事件日志信息的部分。`journald` 的引入确保了无论服务本身如何配置处理待日志信息，都可以对所有服务的信息进行记录。\n\
  \n## K\n\n`kernel`（内核）操作系统的核心组件。它管理来自软件的 I/O 请求并将其转换为计算机硬件的数据处理指令。\n\n`kernel ring\
  \ buffer`（内核环形缓冲区）内存的一个部分，用于存储由内核生成的消息。`dmesg` 命令允许你读取内核环形缓冲区的内容。\n\n`kernel space`（内核空间）预留用于运行特权指令的内存区域。内核空间通常可操作系统内核、内核扩展和大多数设备驱动访问。应用程序通常运行在用户空间中，这确保了故障应用程序不会导致计算机系统崩溃。\n\
  \n`Kernel-based Virtual Machine (KVM)`（基于内核的虚拟机）Linux 内核模块，充当虚拟机管理器，允许直接在 Linux\
  \ 内核之上运行虚拟机。\n\n`key-based login`（基于密钥的登录）在 SSH 中使用公/私钥来证明想要登录的用户身份。基于密钥的登录通常认为比基于密码的登录更安全。\n\
  \n`kill` 可用于向 Linux 进程发送信号的命令。定义了许多信号（见 man 7 signal），但只有少数是常用的，包括 `SIGTERM` 和 `SIGKILL`，两者都用于停止进程。\n\
  \n`Kubernetes` 容器编排的标准，也是 Red Hat OpenShift 的基础。\n\n`KVM` 查看 Kernel-based Virtual\
  \ Machine。\n\n## L\n\n`label`（标签）可以分配给文件系统的名称。使用标签是一个好主意，因为一旦分配了标签，它永远不会更改，这保证了即使设备名称等其他参数发生了变化，文件系统仍然可以挂载。然而，UUID\
  \ 被认为比标签更安全，因为意外产生重复标签的概率远产生重复 UUID 的概率。另见 universally unique ID (UUID)。\n\n`line\
  \ anchor`（行锚点）在正则表达式中，指代行中特定位置的字符。\n\n`linger`（守护）Systemd 的功能，用于在系统启动时而非用户登录时启动\
  \ Systemd 用户单元。\n\n`Linux` 一种类 Unix 操作系统，由一个最初由 Linus Torvalds 开发的内核组成（因此命名为 Linux）。当前的\
  \ Linux 操作系统由一个内核和许多提供完整操作系统的开源工具组成。Linux 以发行版的形式打包。目前，Red Hat Enterprise Linux\
  \ 是使用最广泛的 Linux 发行版之一。\n\n`log rotation`（日志轮转）确保日志文件不会变得过大的服务。根据特定参数（如最大年龄或大小）对日志文件进行监控。一旦达到该参数，日志文件将被关闭并打开一个新的日志文件。旧日志文件将保留一段时间并会被删除，通常在几周后删除。\n\
  \n`logical extent`（逻辑区）LVM 中创建逻辑卷的构建块。它的大小通常为几兆字节，对应于所使用的物理区（physical extents）的大小。\n\
  \n`logical partition`（逻辑分区）在扩展分区中创建的划分。另见 extended partition。\n\n`logical volume`（逻辑卷）在\
  \ LVM 中创建文件系统的实体。逻辑卷在 RHEL 中经常被使用，因为它提供了重要的优势，例如动态调整逻辑卷及其所载文件系统大小的选择。\n\n`Logical\
  \ Volume Manager (LVM)`（逻辑卷管理器）允许处理逻辑卷的软件。\n\n`login shell`（登录 shell）用户登录后直接打开的\
  \ shell。\n\n`LVM` 查看 Logical Volume Manager。\n\n## M\n\n`masquerading`（伪装）一种解决方案，允许从外部网络无法访问的私有\
  \ IP 地址范围通过路由器上暴露的单个公 IP 地址进行访问。\n\n`Master Boot Record (MBR)`（主引导记录）在 BIOS 系统上，主硬盘上的前\
  \ 512 字节。它包含引导加载程序和一个分区表，用于访问该计算机硬盘上的不同分区。\n\n`MBR` 查看 Master Boot Record。\n\n`module`（模块）一段嵌入式代码。Linux\
  \ 上的多个系统（如内核、GRUB 2、rsyslog 等）使用模块。通过模块，Linux 组件可以轻松扩展，且添加功能不需要完全重写软件。\n\n`module\
  \ (in Yum)`（Yum 中的模块）可以作为一个实体进行管理的软件包集合，可以包含软件解决方案的不同版本。\n\n`mount`（挂载）设备与目录之间建立连接。要访问特定存储设备上的文件，需要将该存储设备挂载到目录上。这将指定的目录设置为访问存储设备上文件的接入点。挂载通常由系统管理员组织，终端用户不可见。\n\
  \n`multiplier`（倍数）在正则表达式中，表示引用多个前一个字符的字符。\n\n## N\n\n`namespace`（命名空间）由 Linux 内核创建的隔离环境，允许运行容器。命名空间存在于系统的多个方面，包括挂载、进程、用户。\n\
  \n`netfilter` Linux 内核中实现防火墙的部分。\n\n`netmask`（子网掩码）查看 subnet mask。\n\n`Network Address\
  \ Translation (NAT)`（网络地址转换）查看 masquerading。\n\n`Network File System (NFS)`（网络文件系统）一种常用的\
  \ Unix 解决方案，将物理文件系统导出到网络上的其他主机。其他主机可以在其本地文件系统中挂载导出的 NFS 目录。\n\n`network time`（网络时间）网络上提供的时间。\n\
  \n`Network Time Protocol (NTP)`（网络时间协议）用于为网络中的服务器提供可靠时间的标准。RHEL 8 上的 NTP 由 `chronyd`\
  \ 服务实现。\n\n`NFS` 查看 Network File System。\n\n`nftables` 管理内核防火墙的服务。它是旧版 `iptables`\
  \ 服务的替代品。\n\n`nice` 一种更改 Linux 进程优先级的方法。负的 nice 值会使进程更激进，赋予其更高的优先级（用较低的优先级数字表示）；正的\
  \ nice 值会使进程不那么积极，从而使其优先考虑其他进程。\n\n`NTP` 查看 Network Time Protocol。\n\n## O\n\n`octal`（八进制）一种仅使用\
  \ 0 到 7 数字的计数方案。在使用 `umask` 或 `chmod` 命令处理 Linux 权限时。\n\n`OpenShift` 基于 Kubernetes\
  \ 的 Red Hat 平台，用于容器编排。\n\n`OR`（或）一种逻辑操作，只有在第一个命令无法执行时才会执行第二个命令。\n\n`orchestration`（编排）确保在企业环境中以可扩展和冗余的方式提供容器的技术。\n\
  \n`output module`（输出模块）在 rsyslog 中用于将日志消息发送到特定目的地的模块。输出模块使 rsyslogd 变得灵活，并允许使用 rsyslog\
  \ 原生的日志目的地。\n\n`ownership`（所有权）文件系统权限中，用户拥有的有效权限的基础。每个文件都分配了一个用户所有者组所有者。\n\n## P\n\
  \n\n\n\n\n**package** 用于分发软件的包。包通常包含一个文件的压缩归档和元数据，其中包含了如何安装这些文件的说明。\n\n**package\
  \ group** 一组包，可以使用 `yum groups install` 命令作为一个整体进行安装。\n\n**package group (in Yum)**\
  \ 一组可以通过单个命令安装的软件包。\n\n**pager** 分页器。一种用于逐页浏览文本文件的程序。`less` 实用程序提供了常用的 Linux 分页器之一。\n\
  \n**parent shell** 父 shell。用于启动 shell 脚本或程序的环境。进程或子脚本将继承父 shell 的设置。\n\n**partition**\
  \ 分区。硬盘的子划分，可以在上面创建文件系统并将其挂载到目录结构中。\n\n**passphrase** 短语密码。基本上是一个密码，但应该比密码更长、更安全。\n\
  \n**password** 密码。用于身份验证的令牌。密码是用户可以设置的秘密单词，并将以加密方式存储。\n\n**path** 路径。文件位置的完整引用。\n\
  \n**permissions** 权限。设置文件或目录上的属性，允许用户或组访问这些文件或目录。\n\n**permissive mode** 宽容模式。SELinux\
  \ 的一种模式，不会阻塞任何操作，但所有操作都会记录在审计日志中。这种模式通常用于排除 SELinux 问题。\n\n**physical extent** 物理范围。创建\
  \ LVM 物理卷时使用的物理构建块。通常大小为几兆的倍数。\n\n**physical volume** 物理卷。LVM 配置的基础构建块。物理卷通常对应于分区或整个磁盘设备。\n\
  \n**PID** *参见* 进程标识符。\n\n**pipe** 管道。一种用于将一个命令的输出转发并作为另一个命令的的结构。\n\n**policy** 策略。*参见*\
  \ SELinux 策略。\n\n**port** 端口。进程用于通过网络连接提供该进程访问的数字。\n\n**port forwarding** 端口转发。一种防火墙技术，将从特定端口进入的流量转发到另一个端口（可能位于同一主机或不同的主机）。\n\
  \n**Portable Operating System Interface (POSIX)** 可移植操作系统接口。一种为了维护操作系统之间兼容性而创建的标准。该标准主要适用于\
  \ UNIX，并确保不同版本的 Linux 和 UNIX 之间是兼容的。\n\n**portmapper** 端口映射器。一种需要在提供 RPC 服务的系统中运行的远程过程调用服务。Portmapper\
  \ 使用不对应特定 TCP 或 UDP 端口的动态端口；服务会选择一个 UDP 或 TCP 端口，只要进程活动就会一直使用。当进程重启时，可能会使用不同的端口。它们需要映射到固定的\
  \ UDP 和 TCP 端口，以便为这些端口开放防火墙。NFS 服务的组件仍在使用 portmapper。\n\n**POSIX** *参见* 可移植操作系统接口。\n\
  \n**primary group** 主组。在 `/etc/passwd` 中用户组成员字段中列出的组。每个 Linux 用户都是主组的成员。此外，用户也可以成为从组的成员。\n\
  \n**primary partition** 主分区。在 MBR 中，在主引导记录中可以创建的最多四个分区之一。*另请参阅* 扩展分区。\n\n**priority\
  \ (in process handling)** 优先级（进程处理中）。指定进程的重要性。进程优先级用数字表示（可以使用 `nice` 修改）。优先级数字越低的进程会比优先级数字高的进程先被处理。\n\
  \n**priority (in rsyslog)** 优先级（rsyslog 中）。用于指定记录事件的严重程度。根据严重程度，可以采取特定的操作。\n\n**private\
  \ key** 私钥。在公/私钥加密中，用于生成加密数据的密钥。\n\n**privileged user** 特权用户。*参见* root。\n\n**proc**\
  \ 内核接口。提供访问内核信息和内核可调参数的接口。该接口通过 `/proc` 文件系统可用。\n\n**process** 进程。在 Linux 机器运行的任务。粗来说，一个进程对应一个程序，尽管一个程序可以启动多个进程。\n\
  \n**process identification number (PID)** 进程标识符。一个用于识别 Linux 系统上运行的进程的唯一数字。\n\n\
  **profile** 配置文件。在 tuned 中，一组可以轻松应用的性能设置。\n\n**protocol** 协议。计算中使用的一组规则，例如在计算机网络中建立两台计算机之间的通信。\n\
  \n**Pseudo Root File System** 伪根文件系统。在当前的 NFSv4 版本中，这是一种由 NFS 服务器导出多个共享的解决方案。NFS\
  \ 客户端不是挂载每个单独的共享，而是挂载 NFS 服务器上的根文件系统，从而访问客户端有权访问的所有共享。\n\n**pseudo root mount**\
  \ 伪根挂载。在 NFSv4 中，对根目录系统或未被 NFS 服务器专门导出的其他高级目录的挂载，但它可以访问客户端有权访问的所有导出文件系统。\n\n**public\
  \ key** 公钥。在密码学中，通常由服务器发送给客户端的密钥，以便客户端返回加密数据。\n\n**PV** *参见* 物理卷。\n\n### Q\n**queue**\
  \ 队列。在进程管理中，进程在执行之前等待的地方。\n\n### R\n**real-time clock** 实时钟。安装在计算机主板上的硬件时钟。\n\n\
  **reboot** 重启。停止计算机并重新启动的过程。\n\n**Red Hat Customer Portal** 红帽客户门户。红帽为具有活动订阅的客户提供补丁的平台。为了提供这些补丁和更新，红帽网络提供了此用途所需的仓库。\n\
  \n**Hat Enterprise Linux (RHEL)** 红帽企业 Linux。红帽销售订阅的软件名称。它提供服务器版和桌面版。\n\n**Red Hat\
  \ Package Manager** 红帽软件包管理器。RHEL 上用于软件包和包管理软件的格式名称。RPM 已成为许多其他 Linux 发行版的包管理标准。\n\
  \n**reference clock** 参考钟。在 NTP 时间配置中作为时间源的钟。通常，参考钟是互联网上可靠的钟，也可以是计算机主板上的内部时钟。\n\n\
  **registry** 注册表。启动镜像的位置。\n\n**regular expression** 正则表达式。允许用户以灵活方式搜索文本模式模式。不要与\
  \ Shell 元字符混淆。\n\n**relative filename** 相对文件名。相对于非根目录的文件名。\n\n**Remote Procedure\
  \ Calls (RPC)** 远程过程调用。进程间通信的方法，允许程序在另一个地址空间执行代码。远程过程调用是一种旧协议，因此仍用于网络文件系统。\n\n**repository**\
  \ 仓库。包含可安装包的安装源，以及包含可安装包信息的索引，以便安装程序 Yum 可以比较当前安装的软件包版本与仓库中可用软件包的版本。\n\n**resident\
  \ memory** 驻留内存。程序正在使用的内存页。\n\n**resolver** 解析器。DNS 客户端部分，包含用于联系解析 DNS 查询的 DNS 服务器列表。\n\
  \n**RHEL** *参见* 红帽企业 Linux。\n\n**rich rules** 丰富规则。firewalld 中的规则，允许使用更复杂的语法以便定义更复杂的规则。\n\
  \n\n\n\n\n`root` 用于系统管理任务的特权账户。用户 `root` 拥有所有权限，这意味着权限不适用于用户 `root`，且 root 用户账户在实际上是无限制的。\n\
  \n`root directory` 文件系统层级结构的起始点，记为 `/`。\n\n`RPC` *参见* 远程过程调用。\n\n`RPM` *参见* 红帽软件包管理器。\n\
  \n`RTC` *参见* 实时时钟。\n\n`rsyslogd` 用于记录消息的通用守护进程。\n\n## S\n\n`Samba` 实现 SMB 协议的 Linux\
  \ 服务名称。\n\n`SAN` *参见* 存储区域网络。\n\n`scheduler` Linux 内核的一部分，负责监控可运行进程的队列并为这些进程分配 CPU\
  \ 时间。\n\n`Scientific Linux` 一种基于红帽软件包的 Linux 发行版，这些软件包已删除了红帽标志。对于寻找红帽企业 Linux（RHEL）免费替代方案的人来说，这是一个非常好的选择。\n\
  \n`secondary group` 用户所属的但成员关系未在 `/etc/passwd` 文件中定义的组。当创建新文件时，辅助组不会自动成为这些文件的所有者。\n\
  \n`Secure Shell (SSH)` 允许用户在远程服务器上打开 shell 的解决方案，通过使用公/私钥加密来实现安全性。\n\n`Secure Sockets\
  \ Layer (SSL)` *参见* 传输层安全协议 (TLS)。\n\n`SELinux` 一种 Linux 内核安全模块，提供了一种支持访问控制安全策略的机制。\n\
  \n`SELinux Policy` 用于定义 SELinux 安全性的规则集。\n\n`Server Message Block (SMB)` 一种应用层协议，用于提供对文件、打印机和串口的共享访问，在\
  \ Linux 上通过 Samba 服务器实现。\n\n`services (in firewalld)` 一种允许访问特定进程的防火墙设置配置。\n\n`services\
  \ (in systemd)` 需要启动以提供特定功能的进程。\n\n`share` 一个使用 NFS 或 CIFS 等远程文件系统协议配置了远程访问的目录。\n\
  \n`shebang` 脚本中使用的字符，用于指示应该使用哪个 shell 来执行脚本中的代码。如果没有使用 shebang，脚本代码将由父 shell 解释，在某些情况下可能会导致错误。shebang\
  \ 以 `#` 开头，后面跟着一个 `!` 和 shell 的完整路径，例如 `#!/bin/bash`。\n\n`shell` 可以执行命令的环境。Bash\
  \ 是 Linux 上的默认 shell，但也存在其他 shell。\n\n`shell metacharacters` 诸如 `*`、`?` 和 `[a-z]`\
  \ 等字符，允许用户以灵活的方式引用文件名中的字符。\n\n`signal` 可以可以发送给进程的指令。存在常见的信号，如 `SIGTERM` 和 `SIGKILL`，但\
  \ Linux 内核允许使用共 32 种不同的信号。要向进程发送信号，请使用 `kill` 命令。\n\n`SMB` *参见* 服务器消息块。\n\n`snapshot`\
  \ 文件系统实际状态的“快”。\n\n`software time` *参见* 系统时间。\n\n`source context` 在 SELinux 中，发起操作的进程或用户的上下文。SELinux\
  \ 中的上下文是标识允许操作的标签。SELinux 环境中的一切都有上下文。\n\n`SSH` *参见* 安全外壳。\n\n`standard error (STDERR)`\
  \ 程序发送错误消息的默认位置。\n\n`standard input (STDIN)` 程序获取输入的默认位置。\n\n`standard output (STDOUT)`\
  \ 程序发送常规输出的默认位置。\n\n`static route` 由网络管理员手动定义的路由。\n\n`STDERR` *参见* 标准错误。\n\n`STDIN`\
  \ *参见* 标准输入。\n\n`STDOUT` *参见* 标准输出。\n\n`storage-area network (SAN)` 一种在网络上以块级共享磁盘设备的解决方案。因此，它们可以像\
  \ Linux 系统上的本地磁盘设备一样被使用。iSCSI 和光纤（Fibre Channel）是常见的 SAN 协议。\n\n`Stratis` RHEL 8\
  \ 中新的卷管理文件系统。\n\n`stratum` 在时间同步中，用于表示服务器与权威网络时间源之间的距离。\n\n`subnet mask` IP 网络的逻辑划分。\n\
  \n`subshell` 从另一个 shell 启动的 shell。通常，子 shell 是通过运行 shell 脚本启动的。\n\n`symbolic link`\
  \ 一种特殊文件，以绝对或相对路径的形式引用另一个文件或目录。\n\n`sysfs` 挂载在 `/sys` 目录上的内核接口，用于访问用于管理硬件设置的参数。\n\
  \n`system time` 由操作系统维护的时间。当 Linux 系统启动时，系统时间被设置为当前的硬件时间，而在操作系统运行时，通常使用网络时间协议（NTP）进行同步。\n\
  \n`Systemd` RHEL 上的服务管理器。\n\n## T\n`tainted kernel` 加载了不支持模块的内核。\n\n`tar` 归档工具；用于创建和提取备份的\
  \ Linux 工具。\n\n`target` 在 Systemd 中一组共同管理的单元文件。\n\n`target context` 设置目标对象（如端口、文件或目录）的\
  \ SELinux 上文。\n\n`terminal` 最初用于用户输入命令的屏幕。在现代 Linux 系统上，可以使用伪终端作为替代。伪终端提供了一个输入命令的\
  \ shell 窗口。伪终端的路径为 `/dev/pts/`。\n\n`thin allocation` 在存储中，通过使用智能技术（如去重）为用户提供比实际更多的存储的方法。\n\
  \n`thread` 线程可以作为进程的划分。许多进程是单线程的，这意味着本质上是一个需要服务的实体。在多核或多 CPU 系统中，使用多线程进程是合理的。这样，可以使用不同的核心处理不同的线程，允许进程从多核或多线程环境中受益。\n\
  \n`timestamp` 用于文件、数据库记录和其他类型数据标识最后修改时间的标识符。许多服务依赖时间戳。为了确保基于时间戳系统正常工作，需要配置时间同步。\n\
  \n`time synchronization` 确保多个服务器使用完全相同时间的系统。为了实现时间同步，通常使用网络时间协议（NTP）定义的外部时间服务器。\n\
  \n`timer` 一种 Systemd 单元类型，可以作为 cron 任务的替代，在特定时间运行单元。\n\n`TLS` *参见* 传输层安全协议。\n\n\
  `Transport Layer Security (TLS)` 一种为了确保计算机网络上的安全通信而创建的加密协议。在 TLS 中，使用公私钥并通过证书验证对方。TLS\
  \ 曾被称为 SSL。\n\n`TTY` 一个在 Linux 上提供虚拟终端的程序。每个终端都有一个 TTY 名称，要么是虚拟 TTY 的 tty1-6，要么伪终端的\
  \ /dev/pts/0-nn。\n\n`tuned` RHEL 上的一个服务，允许管理员通过配置文件轻松应用性能设置。\n\n\n\n\n\n`udev` 一个与\
  \ Linux 内核协作以初始化硬件的服务。\n\n`UEFI` *参见* 统一可扩展固件接口。\n\n`umask` 一个八进制值，作为 shell 属性定义默认权限。\n\
  \n`umount` 用于将文件系统从其所挂载的目录中解离的命令。\n\n`Unified Extensible Firmware Interface (UEFI)`\
  \ 在旧版 IBM 兼容计算机上使用的基本输入输出系统（BIOS）的替代品，是计算机启动时运行的第一个程序。UEFI 是位于操作系统和计算机固件之间的中间层。\n\
  \n`unit` 一个由 Systemd 管理的项。存在不同类型的单元，包括服务、路径、挂载和目标单元。\n\n`universally unique ID (UUID)`\
  \ 一个由长随机十六进制数组成的标识符，在全球范围内是唯一的。\n\n`unprivileged user` 一个普通的非 root 用户账户，该账户通过权限应用访问限制。\n\
  \n`user` Linux 中用于提供对特定系统资源访问的实体。用户可以代表人物，但许多服务也有专用的用户账户，这允许服务以该服务所需的特定权限运行。\n\n\
  `user space` 由非 root 权限启动的应用程序可访问的内存区域。\n\n`UTC` *参见* 协调世界时。\n\n`UUID` *参见* universally\
  \ unique ID。\n\n## V\n\n`value` 分配给特定属性、变量或记录的数据。\n\n`variable` 一个包含可以动态更改的特定值的标签。在脚本中，变量经常被用于使脚本具有灵活性。\n\
  \n`VDO` *参见* 虚拟数据优化器。\n\n`VFAT` 用于访问 FAT 文件系统的 Linux 内核驱动程序。FAT 是 Windows 环境中常用的文件系统。Linux\
  \ VFAT 驱动允许使用此文件系统。\n\n`VG` *参见* 卷组。\n\n`Virtual Data Optimizer (VDO)` RHEL 8 中一种新型高级存储解决方案，通过去重压缩数据，因此可以用于存储卷的精简置分配。\n\
  \n`virtual host` 在 Apache Web 服务器中，一组用于标识服务器的配置设置。它之所以被称为虚拟主机，是因为一个 Apache Web 服务器安装可以配置多个虚拟主机，允许管理员在同一个\
  \ Apache 服务器上运行多个网站。\n\n`virtual memory` 可寻内存的总量。虚拟内存被称为*虚拟*内存，是因为它指的并非真实存在的内存。它的唯一目的是确保\
  \ Linux 程序可以设置一个唯一且不被其他程序占用的地址指针。\n\n`volume group` 逻辑卷管理器（LVM）中的抽象层，用于表示由物理卷提供的所有可用存储，可以在这些物理卷上创建逻辑卷。\n\
  \n## W\n\n`want` Systemd 单元文件中的指示，表示该单元应该从特定的 Systemd 目标启动。\n\n`wildcard` 字符 `*`，在\
  \ shell 环境中指代任意数量的字符。\n\n## X\n\n`XFS` 一种由 SGI 在 1993 创建的高性能 64 位文件系统，在 RHEL 8 中用作默认文件系统。\n\
  \n## Y\n\n`Yellowdog Update, Modified` Yum 的全称，Y 是一种元包处理器，在 RHEL 8 中用于从 yum 仓库安装软件包。\n\
  \n`Yum` *参见* Yellowdog Update, Modified。\n\n## Z\n\n`zombie` 一个与其父进程失去联系的进程，无法使用常规工具进行管理。\n\
  \n`zone` 在 firewalld 中，一组或多个与特定的 firewalld 规则关联的网络接口。\n\n## Index\n\n### 符号\n\n\
