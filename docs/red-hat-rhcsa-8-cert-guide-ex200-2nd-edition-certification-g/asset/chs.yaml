  \ 会话。\n\n### 总结\n\n（此处重复重复）\n\n## 第 6 章：用户与组管理\n\n在 Linux 系统上，进程通常被使用。这些进程需要资源。为了确定如何访问这些资源，区分了运行内核模式的进程和运行权限的进程。在后者情况下，用户用户账户不仅为了授予进程权限，还为了让人们能够工作。本章了如何设置设置和组。\n\
  \n本章涵盖了以下主题：\n\n*   不同用户类型\n*   创建和管理用户账户\n*   创建和管理组\n\n本章涵盖了 RHCSA 考试目标：\n\n*\
  \   创建、删除和修改本地用户账户\n*   更改密码并调整用户年龄\n*   创建、删除和修改组及其组成\n*   配置超级用户访问\n\n### “你已经吗？”测试\n\
  \n“你已经吗？”测试允许你评估应该应该阅读整章还是跳转到“考试准备”部分。如果你对答案或对自己知识的评估有疑问，请阅读整章。表 6-1 列出了本章的主要标题以及对应的“你已经吗？”测试题。你可以在\
