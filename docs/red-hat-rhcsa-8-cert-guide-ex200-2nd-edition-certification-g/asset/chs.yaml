  \ 服务并确保启动时自动启动。\n\n14. 创建一个运行 `rsyslog` 容器。该容器应配置为将日志文件持久地写入操作系统的 `/var/log/logcontainer/`。使用与\
  \ `rsyslog` 服务相同的账户运行此容器。\n\n15. 配置此容器，使其作为系统用户服务自动启动。\n\n## RHCSA 模拟考试 B\n\n###\
