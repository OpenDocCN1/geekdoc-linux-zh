  \ never\nMinimum number of days between password change     : 0\nMaximum number\
  \ of days between password change     : 99999\nNumber of days of warning before\
  \ password expir    : 7\n```\n\n## 创建和管理组账户\n\n每个 Linux 用户都至少是一个组的成员。在本节中，你将学习如何管理\
