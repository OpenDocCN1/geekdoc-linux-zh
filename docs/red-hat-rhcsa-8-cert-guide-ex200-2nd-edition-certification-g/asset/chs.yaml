  \n### 基础章节\n\n### 理解 RHEL 8 启动过程\n\n为了修复启动，理解该过程至关重要。以下步骤总结了启动是如何发生的：\n\ngraphics/key_topic.jpg\n\
  \n1. **执行 POST**：机器电源。通过现代扩展固件接口 (UEFI) 或经典的输入输出系统 (BIOS)，执行电源自检 (POST)。\n2. **选择可启动设备**：通过\
  \ UEFI 或 BIOS 选择可启动设备。\n3. **加载引导加载程序**：从可启动设备加载引导加载程序。在 RHEL 中，这通常是 `GRUB 2`。\n\
  4. **加载内核**：内核与 `initramfs` 一起加载。`initramfs` 包含了所有内核模块。\n5. **启动 /sbin/init**：内核加载到内存后，启动第一个进程，但来自\
  \ `initramfs`。这是 `/sbin/init`，它在 RHEL 中链接到 `Systemd`。同时也加载了 `udev` 守护进程来处理硬件初始化。\n\
  6. **处理 init.target**：Systemd 执行来自 `init.target`，准备一个最小环境，其中根文件系统挂载在 `/root`。此时，已加载了足够的内容传递给硬盘上的系统。\n\
  7. **切换到根文件系统**：系统切换到磁盘上的根文件系统，此时可以从磁盘加载 Systemd 进程。\n8. **运行默认目标**：Systemd 查找默认目标并运行其所有单元。在此过程中，会显示登录界面，用户可以身份验证。注意，在所有\
  \ Systemd 单元文件加载之前，可能会出现登录提示。因此，看到登录提示并不意味着你的服务器已经完全正常运行。\n\n在列出的每个阶段，都可能因为配置错误或其他问题发生问题。表\
  \ 18-2 总结了特定阶段是如何配置的，以及出现问题时你可以做什么。\n\n### 提示\n\n故障一直是 RHCSA 考试的一部分。如果你遇到问题，确保你能够识别问题发生在启动过程的哪个阶段，以及你可以如何修复它。\n\
  \n| 启动阶段 | 配置它 | 修复它 |\n| --- | --- | --- |\n\n\n\n\n\n| 加载引导加载程序 | `grub2-install`\
  \ 和对 `/etc/defaults/grub` 的编辑 | 使用 GRUB 启动提示符并编辑 `/etc/defaults/grub`，然后运行 `grub2-mkconfig`。\
  \ |\n| 加载内核 | 修改 GRUB 配置和 `/etc/dracut.conf` | 使用 GRUB 启动提示符并编辑 `/etc/defaults/grub`，然后运行\
  \ `grub2-mkconfig`。 |\n| 启动 `/sbin/init` | 编译进 initramfs | 使用 `init = kernel` 启动参数、`rd.break`\
  \ 内启动参数。 |\n| 处理 `initrd.target` | 编译进 initramfs | 使用 `dracut` 命令。（你通常不需要为此进行故障排查。）\
  \ |\n| 切换到根文件系统 | 修改 `/etc/fstab` 文件 | 对 `/etc/fstab` 文件应用编辑。 |\n| 运行默认目标 | 使用 `systemctl\
  \ set-default` 创建 `/etc/systemd/system/default.target` 符号链接 | 将 `rescue.target`\
  \ 作为内核启动参数启动 |\n\n**表 18-2** 启动阶段配置与故障排除概述\n\n在下一节中，你将学习如何应用此表中描述的不同故障排除技术。\n\n\
  ### 传递内核启动参数\n\n如果你的服务器无法启动，GRUB 启动提示符提供了一种方便的方法，可以在启动过程中传递特定的内核选项。在本节中，你将学习如何访问启动提示符。\n\
  \n#### 访问启动提示符\n\n当服务器启动时，你会短暂看到 GRUB 2 菜单。请迅速，因为它只会持续几秒钟。从此启动菜单，你可以输入 `e` 进入编辑命令的模式，或输入\
  \ `c` 进入 GRUB 命令提示符，如图 18-1 所示。向启动内核传递启动选项。![截图显示了启动菜单。文字显示：“使用上下箭头键更改选择。按 e 编辑选中项或按\
  \ c 进入提示符。”](img/18fig01.jpg)\n\n**图 18-1** 进入 GRUB 启动提示符\n\n在向 GRUB 启动菜单传递 `e`\
  \ 后，你会看到如图 18-2 所示的界面。从该界面，向下滚动找到以 `linux ($root)/vmlinuz` 开头带有许多参数的部分。这是告诉 GRUB\
  \ 如何启动内核的行，默认如下：点击此处查看代码\n\n```\nlinux ($root)/vmlinuz-4.18.0-80.el86_64 root=/dev/mapper/rhel-root\n\
  \  ro kernel=auto resume=/dev/mapper/rhel-swap rd.lvm.lv=rhel/swap rhgb quiet\n\n\
  ![截图显示了各种参数。底部文字显示：“按 control-x 启动，按 control-c 进入提示符或按 escape 返回。按 Tab 列出可能的补全。”](img/18fig02.jpg)\n\
  \n**图 18-2** 在以 linux 开头的行上输入启动参数\n\n为了启动，最好移除该行中的 `rhgb` 和 `quiet` 部分；这些参数会隐藏启动信息，而你通常希望看到启动时发生了什么。在下一节中，你将学习一些可以从\
  \ GRUB 启动提示符进入的故障排除选项。\n\n在输入要使用的启动选项后，按 `Ctrl-X` 使用这些选项启动内核。注意，这些选项仅使用一次，并非持久的。要使它们持久，你必须修改\
  \ `/etc/default/grub` 配置文件的内容，并使用 `grub2-mkconfig -o /boot/grub2/grub.cfg` 应用修改。（有关此过程的更多详细信息，请参考第\
  \ 17 章）。\n\n\n\n#### 启动故障排除目标\n\n如果你在启动服务器时遇到问题，可以在 GRUB 启动提示符输入若干选项：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   `rd.break`：在 initramfs 阶段停止启动过程。如果没有 root 密码，此选项非常有用。恢复丢失 root 密码的完整程序在本章节稍后介绍。\n\
  *   `init=/bin/sh` 或 `init=/bin/bash`：这指定在加载内核和 initrd 后立即启动 shell。这是一个用的选项，但不是最好的选项，因为在某些情况下你会失去控制台访问或丢失其他功能。\n\
  *   `systemd.unit=emergency.target`：进入加载极少数 Systemd 单元的模式。它需要 root 密码。要查看只加载了极少数单元文件，可以输入\
  \ `systemctl list-units` 命令。\n*   `systemd.unit=rescue.target`：启动更多的 Systemd 单元将带进入更完整的运行模式。它确实需要\
  \ root 密码。要查看只加载了极少数单元文件，可以输入 `systemctl list-units` 命令。\n\n在练习 18-1 中，你将学习如何进入\
  \ `rescue.target`。\n\n### 使用救援磁盘\n\n如果你遇到问题时运气不错，你会看到故障排除菜单。Red Hat Linux 的救援镜像位于安装磁盘上。如果你运气稍差，你会看到未启动的系统上有一个闪烁的光标。发生这种情况，你需要一个救援磁盘。\n\
  \n#### 使用救援磁盘恢复系统访问\n\n选择故障排除选项后，你将看到以下选项，如图 18-3 所示：\n\n*   `Install Red Hat Linux\
  \ 8 in Basic Graphics Mode`：此选项将重新安装你的机器。除非你想排查正常安装无法工作的情况，否则不要使用它。通常情况下，你永远不需要使用此选项来排查损坏的安装。\n\
  *   `Rescue Red Hat Linux System`：这是最灵活的救援系统。在练习 18-2 中，你可以详细探索它。使用救援磁盘时应该是首选选项。\n\
  *   `Run a Memory Test`：如果你遇到内存错误，运行此选项。它允许你标记坏内存，以便机器正常启动。\n*   `Boot from Local\
  \ Drive`：如果你无法从硬盘上的 GRUB 启动，先尝试此选项。它提供了一个尝试从硬盘安装的引导程序，因此是侵入性最小的选项。\n\n![截图显示了“故障排除”选项。有\
  \ Install Red Hat Linux 8 in Basic Graphics Mode、Rescue Red Hat Linux System、Run\
  \ a Memory Test、Boot from Local Drive、返回主菜单以及按 Tab 查看菜单项的完整配置选项。](img/18fig03.jpg)\n\
  \n**图 18-3** 从救援磁盘启动\n\n\n\n\n\n# 使用救援盘重新安装 GRUB\n\n你可能需要启动救援盘的常见原因之一是 GRUB 2 引导加载程序损坏。如果发生了这种情况，你可能需要重新安装它。在用救援盘恢复服务器的访问权限后，重新安装\
  \ GRUB 2 并不困难，它包含两个步骤：\n\n* 确保你已经如前所述使用 `chroot` 命令将 `/mnt/sysimage` 目录的内容对你的当前工作环境可用。\n\
  * 使用 `grub2-install` 命令，后跟上你想要重新安装 GRUB 2 的设备名称。因此，在 KVM 虚拟机上，使用的命令是 `grub2-install\
  \ /dev/vda`；而在物理服务器或 VMware 或 Virtual Box 虚拟机上，命令是 `grub2-install /dev/sda`。\n\n\
  ## 使用救援盘重新创建 Initramfs\n\n偶尔，initramfs 镜像也可能会损坏。如果发生这种情况，你的服务器将无法进入正常运行模式。在进入救援环境后修复\
  \ initramfs 镜像，你可以使用 `dracut` 命令。在不带任何参数参数的情况下，该命令会为当前加载的内核创建一个新的 initramfs。\n\n\
  或者，你可以使用带有多个选项的 `dracut` 命令为特定的内核环境创建 initramfs。还有一个名为 `/etc/dracut.conf` 的配置文件，你可以在重新创建\
  \ initramfs 时使用它包含特定选项。`dracut` 的配置分布在不同的位置：\n\n* `/usr/lib/dracut/dracut.conf.d/*.conf`\
  \ 包含系统默认配置文件。\n* `/etc/dracut.conf.d` 包含自定义的 dracut 配置。\n* `/etc/dracut.conf` 作为主配置文件。\n\
  \n示例 18-1 显示了默认 `dracut.conf` 配置文件的示例。\n\n**示例 18-1** `/etc/dracut.conf` 默认内容\n\n\
  点击此处查看代码图像\n\n```\n[root@server1 ~]# cat /etc/dracut.conf\n# 将你的配置放在此处，或放在 /etc/dracut.conf.d\
  \ 中名为 *.conf 的独立文件中\n# 参见 man dracut.conf(5)\n\n# 示例 dracut 配置文件\n\n#logfile=/var/log/dracut.log\n\
  #fileloglvl=6\n\n# 要使用的 dracut 模块精确列表。此处未列出的模块将\n# 不会被包含在。如果你只想添加一些可选模块，请\n# 使用\
  \ add_dracutmodules 选项。\n#dracutmodules+=\"\"\n\n# 要省略的 dracut 模块\n#omit_dracutmodules+=\"\
  \"\n\n# 要添加到默认配置的 dracut 模块\n#add_dracutmodules+=\"\"\n\n# 添加到默认的额外内核模块\n#add_drivers+=\"\
  \"\n\n# 要包含在通用 initramfs 中的内核文件系统模块\n#filesystems+=\"\"\n\n# 仅为启动当前硬件构建 initrd\n\
  #hostonly=\"yes\"\n#\n\n# 安装本地的 /etc/mdadm.conf\n#mdadmconf=\"no\"\n\n# 安装本地的 /etc/lvm/lvm.conf\n\
  #lvmconf=\"no\" \n\n# 要安装的 fsck 工具列表。如果没有指定，则使用模块\n# 硬编码的默认值，当前为：\"umount mount\
  \ /sbin/fsck* xfs_db xfs_check\n# xfs_repair e2fsck jfs_fsck reiserfsck btrfsck\"\
  。安装是\n# 机会性的，因此不存在的工具将直接忽略。\n#fscks=\"\"\n\n# 禁止安装任何 fsck 工具\n#nofscks=\"yes\"\n\
  \n# 默认只读模式挂载 / 和 /usr\n#ro_mnt=\"no\"\n\n# 设置临时文件的目录\n# 默认: /var/tmp\n#tmpdir=/tmp\n\
  ```\n\n**提示**\n\n根据 RHCSA 目标，你在考试中不应该需要处理救援盘。然而，作为一名 Linux 管理员，你应该预料到意料之外的情况，因此确保你能够处理常见以及不常见的故障排除场景是一个好主意。\n\
  \n## 修复常见问题\n\n在像现在这样的一个小章节中，不可能考虑到在处理 Linux 时可能遇到的所有问题。尽管如此，某些问题比其他问题更可能发生。在本节中，你将学习一些更常见的问题。\n\
  \n### 重新安装 GRUB 2\n\n引导加载程序代码不会凭空消失，但偶尔会发生 GRUB 2 引导代码损坏的情况。在这种情况下，你最好知道如何重新安装 GRUB\
  \ 2。具体方法取决于你的服务器是否仍处于启动状态。如果是的话，重新安装 GRUB 2 非常简单。只需输入 `grub2-install` 后跟你想要安装它的设备名称即可。该命令有许多不同的选项可以精调具体要安装的内容，但你可能不需要它们，因为默认情况下，该命令会安装使你的系统再次启动所需的一切。\n\
  \n如果你的机器处于不可启动状态，重新安装 GRUB 2 将变得稍微复杂一些。如果发生这种情况，你首先需要启动救援系统并从救援盘恢复对服务器的访问。（详情请参见练习\
  \ 18-2）。使用 `chroot /mnt/sysimage` 进入环境并运行 `grub2-install`。\n\n### 修复 Initramfs\n\
  \n偶尔，initramfs 镜像也会损坏。如果发生这种情况，你的服务器无法进入正常运行模式。在进入救援环境后修复 initramfs 镜像，你可以使用 `dracut`\
  \ 命令。在不带任何参数的情况下，该命令会为当前加载的内核创建一个新的 initramfs。\n\n或者，你可以使用带有多个选项的 `dracut` 命令为特定的内核环境创建\
  \ initramfs。还有一个名为 `/etc/dracut.conf` 的配置文件，你可以在重新创建 initramfs 时使用它包含特定选项。`dracut`\
  \ 的配置分布在不同的位置：\n\n* `/usr/lib/dracut/dracut.conf.d/*.conf` 包含系统默认配置文件。\n* `/etc/dracut.conf.d`\
  \ 包含自定义的 dracut 配置。\n* `/etc/dracut.conf` 作为主配置文件。\n\n### 从文件系统问题中恢复\n\n如果你对文件系统进行了错误配置，启动过程可能会以“输入\
  \ root 密码进行维护”的消息结束。这条消息是由 `fsck` 命令生成的，它在启动时尝试验证 `/etc/fstab` 中文件系统的完整性。如果 `fsck`\
  \ 失败，则需要手动干预。\n\n\n\n\n\n# 图 18-5 如果你看到这个，通常意味着你有 `/etc/fstab` 问题\n\n## 重置 root\
  \ 密码\n\nLinux 管理员经常遇到的一种场景是 root 密码丢失。如果发生这种情况，你需要重置它。唯一的方法是进入最小化模式（minimal mode），这允许你在不输入密码的情况下登录。请按照以下步骤操作：\n\
  \n![](img/key_topic_icon.jpg)\n\n1.  在系统启动时，显示 GRUB 2 启动菜单时按 `e`。\n\n2.  在加载内核的行中输入\
  \ `rd.break` 作为启动参数，并按 Ctrl-X 使用此选项启动。\n\n3.  现在你将置于启动阶段的末尾，此时 `initramfs` 已加载，且根文件系统挂载到目录\
  \ `/` 之前。\n\n4.  输入 `mount -o remount,rw /sysroot` 以获取系统镜像的读/写权限。\n\n5.  此时，通过输入\
  \ `chroot /sysroot` 将 `/sysroot` 目录的内容设为新的根目录。\n\n6.  现在你可以输入 `passwd` 并为 root 用户设置新密码。\n\
  \n7.  因为在这一极早的启动阶段 SELinux 尚未激活，`/etc/shadow` 的上下文类型会错乱。如果你此时重启，将没有人能够登录。因此，你必须确保上下文类型设置正确。为了做到这一点，此时你应该使用\
  \ `load_policy -i` 加载 SELinux 策略。你可以在第 22 章“管理 SELinux](#ch22.xhtml_ch22)”中找到更多关于\
  \ SELinux 的信息。\n\n8.  现在你可以手动为 `/etc/shadow` 设置正确的上下文类型。输入 `chcon -t shadow_t /etc/shadow`。\n\
  \n9.  重启。现在你可以使用更改后的 root 用户密码登录了。\n\n### 注意\n\n在之前的步骤中，你学习了如何使用 `load_policy -i`\
  \ 和 `chcon` 命令来修复 `/etc/shadow` 文件的标签。另一种（更简单）的方法是创建一个名为 `/.autorelabel` 的文件，这将强制\
  \ SELinux 恢复整个文件系统上设置的标签。\n\n## 恢复对虚拟机的访问\n\n故障排除的一个特殊情况是涉及虚拟机的情况。如果你在虚拟机中遇到问题，且无法使用虚拟机管理器（Virtual\
  \ Machine Manager）或 `virsh console` 访问它，你也无法通过 SSH 连接到它。然而，仍然有一个选项。这里描述的技术有点高级，但因为它某一天可能会帮助你重新建立对丢失的虚拟机的访问，它是值得了解的。\n\
  \n### 提示\n\n这里描述的程序相当复杂，除非你在考试期间犯了严重的失误，否则你不应该应用它。因此，与其背诵这个程序，不如务必非常小心以防止此类问题的发生！\n\
  \n1.  首先，在 KVM 宿主机上打开 root shell。从该宿主机文件开始，使用 `virsh destroy vmname` 确保虚拟机已停止。（使用\
  \ `virsh list` 命令列出的虚拟机名称。）\n\n2.  找到磁盘镜像文件。它通常存储在 `/var/lib/libvirt/images` 目录下。如果你没有在那里找到它，请使用\
  \ `virsh dumpxml vmname | grep \"source file=\"` 来查找源文件的名称：\n\n    点击此处查看代码图像\n\n\
  \    ```\n    [root@lab ~]# virsh dumpxml sander-vm1 | grep \"source file=\"\n \
  \          <source file='/home/sander/lab1.img'/>\n           <source file='/var/lib/libvirt/images/sander-vm1.img'/>\n\
  \    ```\n\n3.  现在你已经知道了虚拟机镜像文件的名称，可以使用 `kpartx -a` 命令将其挂载到宿主机环境。该命令分析虚拟机上的磁盘布局，并创建存储设备，允许你在宿主机文件系统中挂载虚拟机中的设备：\n\
  \n    点击此处查看代码图像\n\n    ```\n    [root@lab ~]# kpartx -av /home/sander/lab1.img\n\
  \    add map loop0p1 (253:5): 0 1024000 linear /dev/loop0 2048\n    add map loop0p2\
  \ (253:6): 0 7362560 linear /dev/loop0 1026048\n    ```\n\n4.  `kpartx` 命令已创建设备，允许你访问虚拟机中的两个分区。如果这是一个典型的\
  \ RHEL 8 设置，第一个分区是 `/boot` 分区，第二个分区通常用于 LVM 逻辑卷。你可以使用 `mount /dev/mapper/loop0p1\
  \ /mnt` 轻松地挂载 `/boot` 分区。\n\n5.  要访问虚拟机第二个分区中存在的逻辑卷，请使用 `pvscan` 命令：\n\n    点击此处查看代码图像\n\
  \n    ```\n    [root@lab mapper]# pvscan\n    --- PV Report ---\n    VG Name:# \
  \    Free  Size  Used\n    /dev/mapper/loop0p1  root   100.00G  20.00G  80.00G\n\
  \    /dev/mapper/loop0p2  data   7.00G   0.00G   7.00G\n    ```\n\n6.  现在你已经知道了虚拟机镜像文件的名称，可以使用\
  \ `kpartx -a` 命令将其挂载到宿主机环境。该命令分析虚拟机上的磁盘布局，并创建存储设备，允许你在宿主机文件系统中挂载虚拟机中的设备：\n\n   \
  \ 点击此处查看代码图像\n\n    ```\n    [root@lab ~]# kpartx -av /home/sander/lab1.img\n  \
  \  add map loop0p1 (253:5): 0 1024000 linear /dev/loop0 2048\n    add map loop0p2\
  \ (253:6): 0 7362560 linear /dev/loop0 1026048\n    ```\n\n7.  `kpartx` 命令已创建设备，允许你访问虚拟机中的两个分区。如果这是一个典型的\
  \ RHEL 8 设置，第一个分区是 `/boot` 分区，第二个分区通常用于 LVM 逻辑卷。你可以使用 `mount /dev/mapper/loop0p1\
  \ /mnt` 轻松地挂载 `/boot` 分区。\n\n8.  要访问虚拟机第二个分区中存在的逻辑卷，请使用 `pvscan` 命令：\n\n    点击此处查看代码图像\n\
  \n    ```\n    [root@lab mapper]# pvscan\n    --- PV Report ---\n    VG Name:# \
  \    Free  Size  Used\n    /dev/mapper/loop0p1  root   100.00G  20.00G  80.00G\n\
  \    /dev/mapper/loop0p2  data   7.00G   0.00G   7.00G\n    ```\n\n9.  完成后，使用 `kpartx\
  \ -d` 卸载分区并移除设备。\n\n\n\n\n打印附录 B“记忆表格”（可在配套网站上找到）或至少打印本章节的内容，并根据记忆完成表格和列表。附录 C“记忆表格答案密钥”包含了完成的表格和列表，用于检查你的工作结果。\n\
  \n### 定义关键术语\n\n定义本章中的以下关键术语，并在术表中检查你的答案：\n\ntarget\n\nGRUB\n\ninitramfs\n\n`dracut`\n\
  \n### 复习题\n\n以下问题旨在帮助你测试对概念、术语以及知识广度的掌握。你可以在附录 A 中找到这些问题的答案。\n\n1. 进入 GRUB 启动菜单编辑器模式需要按哪个键？\n\
  \n2. 在启动过程中，启动程序未完成，服务器改为提示 root 密码。可能的原因是什么？\n\n3. 你想进入故障排除模式，但不知道 root 密码。你会向内核传递哪个参数以进入可以访问机器大部分功能性的模式？\n\
  \n4. 你启动服务器但什么都没有发生。你只看到一个闪烁的光标，仅此而已。排查此问题的第一步是什么？\n\n5. 你想找出特定的故障排除环境中哪些单元（units）。你会使用哪个命令？\n\
  \n6. 你想对丢失的 root 密码进行故障排除。你会向 GRUB 2 引导程序传递哪个参数？\n\n7. 从启动的用于排除 root 用户丢失密码的 shell\
  \ 中，你想加载 SELinux 策略。哪个命令可以让你实现这一操作？\n\n8. 在排查 root 密码时，你需要做什么来确保 SELinux 标签被正确设置？\n\
  \n9. 你已对 GRUB 2 引导程序应用了更改并想要保存。你应该如何操作？\n\n10. 你知道想要进入最简化故障排除模式的机器的 root 密码。你会使用哪个\
  \ GRUB 2 启动参数？\n\n### 章节结束实验\n\n实验 18.1 向你展示如何解决一些常见问题。\n\n### 实验 18.1\n\n1. 重启服务器并在相应的故障排除模式下更改\
  \ root 密码。\n\n2. 在 `/etc/fstab` 中更改一个设备名称，以便在下次重启时该文件系统无法挂载。重启并修复遇到的问题。\n\n3. 使用救援磁盘从救援磁盘以完全故障排除模式启动你的服务器。\n\
  \n4. 重新创建 `initramfs`。\n\n## 第 19 章\n\nBash 脚本简介\n\n本章涵盖了以下主题：\n\n* 理解 Shell 脚本核心元素\n\
  * 使用变量和输入\n* 使用条件循环\n\nShell 脚本本身是一门科学。然而，你并不会在本章中学到与这门科学相关的所有细节。相反，你将学习如何应用基础的\
  \ shell 脚本元素，这允许你编写简单的 shell 脚本并分析 shell 脚本正在发生什么。\n\n### “我已经掌握这些了吗？”测试\n\n“我已经掌握这些了吗？”测试可以让你评估自己是应该仔细阅读整个章节，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请通读整个章节。表\
  \ 19-1 列出了本章的主要标题及其对应的“我已经掌握这些了吗？”测试题题。你可以在附录 A“‘我已经掌握这些了吗？’测试和‘复习题’的答案。”中找到答案。\n\
  \n| 基础主题章节 | 题目 |\n| --- | --- |\n| 理解 Shell 脚本核心元素 | 1–2 |\n| 使用变量和输入 | 3–5 |\n\
  | 使用条件循环 | 6–10 |\n\n**表 19-1** “我已经掌握这些了吗？”章节到题目映射\n\n1. 每一个 Bash shell 脚本应该以哪行开头？\n\
  \n1. `/bin/bash`\n2. `!/bin/bash`\n3. `!#/bin/bash`\n4. `!/bin/bash`\n\n2. 在脚本末尾使用的\
  \ `exit 0` 命令的目的是什么？\n\n1. 它通知父 shell 脚本执行时没有任何问题。\n2. 它确保脚本可以正常停止。\n3. 只有当使用 `for`\
  \ 循环来关闭 `for` 循环结构时才需要。\n4. 它用于终止 `for` 循环。\n\n3. 如何停止脚本以允许用户提供输入？\n\n1. `pause`\n\
  2. `break`\n3. `read`\n4. `stop`\n\n4. 哪行将启动脚本时提供的第一个参数的值存储在变量 `NAME` 中？\n\n1. `NAME\
  \ = $1`\n2. `$1 = NAME`\n3. `NAME = $@`\n4. `NAME=$1`\n\n5. 区分传递到 shell 的不同参数的最佳方法是什么？\n\
  \n1. `$?`\n2. `$#`\n3. `$*`\n4. `$@`\n\n6. 用什么来关闭 `if` 循环？\n\n1. `end`\n2. `exit`\n\
  3. `stop`\n4. `fi`\n\n7. 脚本在某处缺失了什么？\n\n```\nif [ -f $1 ]\nthen\n     echo \"$1\
  \ is a file\"\n..... [ -d $1 ]\nthen\n       echo \"$1 is directory\"\nelse\n  \
  \    echo \"I not know $1 is\"\nfi\n```\n\n1. `else`\n2. `if`\n3. `elif`\n4. `or`\n\
  \n8. 脚本在某处缺失了什么？\n\n```\nfor (( counter=100; counter>1; counter-- ));\n        \
  \  echo $counter\ndone\nexit 0\n```\n\n1. `in`\n2. `do`\n3. `run`\n4. `start`\n\n\
  9. 如果脚本执行不顺利，使用哪个命令向 root 用户发送主题为“error”的消息？\n\n1. `mail error root`\n2. `mail -s\
  \ error root`\n3. `mail -s error root .`\n4. `mail -s error root < .`\n\n10. 在 **case**\
  \ 语句中，包含适用于所有其他情况是一个好主意。以下哪项可以做到这一点？\n\n1. `*)`\n2. `*`\n3. `else`\n4. `or`\n\n\
  ### 基础主题\n\n### Shell 脚本核心元素\n\n基本上，shell 脚本是一系列按顺序执行的命令，其中包含一些可选的脚本逻辑，允许仅在特定条件下执行代码。为了理解复杂的\
  \ shell 脚本，让我们从查看一个非常简单的脚本开始，如示例 19-1](#ch19.xhtml_ch19ex01）所示。\n\n**示例 19-1** 基础脚本\n\
  \n点击此处查看代码图片\n\n```\n#!/bin/bash\n# 这是一个问候世界的脚本\n# 用法: ./hello\n\nclear\necho hello\
  \ world\n\nexit 0\n```\n\n\n\n\n这个基础脚本包含了所有脚本都应该使用的几个元素。首先是 `shebang`。这一行是 `#!/bin/bash`。当从父级\
  \ shell 环境启动一个脚本时，它会打开一个子 shell。在这个子 shell 中，会执行不同的命令。这些命令可以以任何方式被解释，而为了明确它们应该如何被解释，便使用了\
  \ `shebang`。在这种情况下，shebang 明确了该脚本是一个 Bash shell 脚本。也可以指定其他的 shell。例如，如果你的脚本包含 Perl\
  \ 代码，则 shebang 应该是 `#!/usr/bin/perl`。\n\n在脚本开头使用 shebang 是一个良好的习惯；如果省略了它，脚本代码将由父\
  \ shell 中使用的那个 shell 来执行。由于你的脚本也可能被其他用户（例如 `ksh` 的用户）执行，因此使用 shebang 调用 `/bin/bash`\
  \ 作为子 shell 对于避免混淆非常重要。\n\n紧接 shebang 之后，有一部分解释了脚本的内容。在每个脚本中包含几行注释都是一个好主意。在短脚本中，脚本在做什么通常显而易见。如果脚本变得越来越长，并且随着越来越多的人参与脚本的编写和维护，脚本作者的意图往往会变得不再清晰。为了避免出现这种情况，请确保你包含了以\
  \ `#` 开头的注释行。不仅要在脚本的开头包含它们，还要在脚本每个子章节的开头包含它们。如果你在几个月后阅读自己的脚本，且不记得在创建它时具体想做什么，这些注释无疑将非常有帮助！你也可以在行内使用注释。无论\
  \ `#` 使用在什么位置，从 `#` 直到行尾的所有内容都是注释文本。\n\n接下来是脚本的正文部分。在示例 19-1 中，正文只是一个包含顺序执行的几个命令的简单脚本。随着脚本的发展，正文可能会增长。\n\
  \n在脚本的末尾，我包含了 `exit 0` 语句。`exit` 语句告诉父 shell 脚本执行成功。`0` 表示成功，任何其他值都意味着脚本遇到了问题。脚本中最后一条命令的退出状态就是脚本本身的退出状态，除非在脚本末尾使用了\
  \ `exit` 命令。但了解你可以通过 `exit` 来告知父 shell 执行情况是有好处的。要从父 shell 请求最后一条命令的退出状态，请使用 `echo\
  \ $?` 命令。这个请求对于判断某事是否成功以及为什么没有成功很有用。\n\n写完脚本后，确保它是可以执行的。最常用的方法是给它应用执行权限。因此，如果脚本名为\
  \ `hello`，请使用 `chmod +x hello` 使其变为可执行。脚本也可以作为 `bash` 命令的参数来执行，例如。使用 `bash hello`\
  \ 来运行 hello 脚本。如果作为 `bash` 命令的参数启动，则脚本不需要具有执行权限。\n\n你基本上可以将脚本存储在任何喜欢的地方，但如果你要将其存储在未包含在\
  \ `$PATH` 中的位置，需要在脚本名称前面加上 `./` 来执行它。因此，仅输入 `hello` 是不足以运行你的脚本的；请输入 `./hello` 来运行。注意，如果你想从当前目录运行脚本，也需要\
  \ `./`，因为在 Linux 上，当前目录没有包含在 `$PATH` 变量中。将其放在包含在 `$PATH` 变量的标准目录下，如 `/usr/local/bin`。在练习\
  \ 19-1 中，你将应用这些技能并编写一个简单的 shell 脚本。\n\n### 使用变量和输入\n\nLinux Bash 脚本远不仅仅是顺序执行的命令列表。脚本的优点之一是它们可以与变量和输入配合，从而使脚本变得灵活。在这一节中，你将学习如何处理变量和输入。\n\
  \n#### 使用位置参数\n\n在启动脚本时，你可以使用参数。参数（argument）是你在启动脚本时跟在脚本命令后面的任何内容。参数可以用来让脚本更加灵活。以\
  \ `useradd lisa` 命令为例。在这个例子中，命令是 `useradd`，参数 `lisa` 指定了需要执行的操作。在这种情况下，必须创建一个名为\
  \ `lisa` 的用户。在这个例子中，`lisa` 是命令 `useradd` 的参数。在脚本中，第一个参数称为 `$1`，第二个参数称为 `$2`，依此类推。示例\
  \ 19-2 中的脚本展示了如何使用参数。尽管尽管，使用你想使用的任何参数来尝试一下吧！\n\n**示例 19-2** 使用参数的脚本\n\n点击此处查看代码图像\n\
  \n```\n#!/bin/bash\n# 使用几个参数运行此脚本\necho The first argument is $1\necho The second\
  \ argument is $2\necho the third argument is $3\n```\n\n如果你尝试运行示例 19-2 中的示例代码，你可能会注意到它的内容并不完美。如果你在运行脚本时使用三个参数，它将正常工作。如果你在使用脚本时只使用两个参数，第三个\
  \ echo 将失效。如果你使用四个参数，第四个值（存储在 `$4` 中）将永远使用。因此，如果你想使用参数，使用更灵活的方法。示例 19-3 展示了一个使用更灵活方法的脚本。\n\
  \n**示例 19-3** 以灵活方式使用参数的脚本\n\n点击此处查看代码图像\n\n```\n#!/bin/bash\n# 使用几个参数运行此脚本\necho\
  \ you have entered $# arguments\nfor i in $@\ndo\n  echo $i\ndone\nexit 0\n```\n\
  \n在示例 19-3 中，引入了两个与参数相关的项：\n\n*   `$#` 是显示启动脚本时使用了多少参数的计数器。\n*   `$@` 指代所有的所有参数。\n\
  \n要评估启动脚本时使用的参数，你可以使用 `for` 条件循环。在 `for` 条件循环中，只要条件为真，命令就会执行。在这个脚本中，条件是 `for i in\
  \ $@`，意味着“对于每一个参数”。脚本每次循环，`@` 中的一个值就会赋值给变量 `$i`。因此，只要有参数，脚本的主体就会执行。在练习 19-2 中，你可以通过编写使用位置参数的脚本来亲自尝试。\n\
  \n#### 处理变量\n\n![](img/key_topic_icon.jpg)\n\n变量（variable）是用于引用内存中包含特定值的标签。变量可以通过\
  \ `NAME=value` 静态定义，也可以以动态方式定义。动态定义变量有两种方案：\n\n![](img/key_topic_icon.jpg)\n\n*\
  \   在脚本中使用 `read` 命令向运行脚本的用户请求输入。\n*   使用命令替换来使用命令的结果并将该结果赋值给变量。例如，`date +%d-%m-%y`\
  \ 命令显示日-月-年格式的当前日期。要在脚本中将该日期赋值给变量，可以使用 `TODAY=$(date +%d-%m-%y)` 命令。\n\n\n\n\n在命令替换中，你只需要将想要使用的结果的命令括在括号内，并在左括号前加一个美元符号\
  \ `$`。作为这种表示法的替代方案，你也可以使用反引号（backquotes）。因此，`TODAY=`date +%d-%m-%y`` 命令执行的效果完全相同。\n\
  \n在上一节关于位置参数的介绍中，你学习了如何在启动脚本时提供参数。在某些情况下，更高效的方法是在发现缺少某些关键信息时请求这些信息。示例 19-4 中的脚本展示了如何使用\
  \ `read` 来实现这一点。\n\n### 示例 19-4 使用 `read` 命令的脚本\n\n点击此处查看代码图像\n\n```\n#!/bin/bash\n\
  if [ -z $1 ]; then\n         echo enter a name\n         read NAME\nelse\n     \
  \    NAME=$1\nfi\necho you have entered the text $NAME\nexit 0\n```\n\n在示例 19-4\
  \ 中，使用了 `if ... then ... else ... fi` 语句来检查参数 `$1` 是否存在。这是通过使用 `test` 命令实现的，它有两种两种写法：`test`\
  \ 或 `[ ... ]`。在示例 19-4 中，执行 `if [ -z $1 ]` 行是为了检查测试 `-z $1` 是否为真。`-z test` 检查 `$1`\
  \ 是否不存在。换句话说，`if [ -z $1 ]` 行检查 `$1` 是否为空；如果是，则意味着在启动此脚本时没有提供任何参数。如果是如此，将执行 `then`\
  \ 语句之后的命令。请注意，当你使用方括号编写 `test` 命令时，必须在左括号后包含一个空格，在右括号前也包含一个空格；没有这些空格，命令将无法工作。\n\n\
  注意 `then` 语句紧跟在 `test` 命令之后。这是可能的因为使用了分号（`;`）。分号是命令分隔符，可以替代脚本中的换行符。在 `then` 语句中，执行了两个命令：一个在屏幕上显示消息的\
  \ `echo` 命令和一个 `read` 命令。`read` 命令会停止脚本，以便处理用户输入并将其存储在变量 `NAME` 中。因此，`read NAME`\
  \ 行将所有用户输入放入变量 `NAME`，该变量将在脚本稍后使用。\n\n在示例 19-4 中，下部分由 `else` 语句引入。`else` 语句之后的命令在所有其他情况下都会执行，在例例中这意味着“如果提供了参数”。如果是那样，则定义变量\
  \ `NAME` 并将 `$1` 的当前值赋值给它。\n\n注意变量是如何定义的：在变量名之后直接跟着一个等号 `=`，然后是 `$1`。请注意，在定义变量时永远不要使用空格。\n\
  \n然后，`if` 循环通过 `fi` 语句结束。一旦 `if` 循环完成，你就可以确定变量 `NAME` 已经定义并有一个值。脚本的最后一行读取变量 `NAME`\
  \ 的值，并通过 `echo` 命令将该值显示到标准输出（STDOUT）。注意，为了请求变量的当前值，脚本引用变量名时，前面要有一个美元符号 `$`。\n\n\
  在练习 19-3 中，你可以练习处理输入。\n\n### 使用条件循环\n\n正如你已经看到的，你可以在脚本中使用条件循环。这些条件循环只有在特定条件为真时才会执行。在\
  \ Bash 中，通常经常使用以下条件循环：\n\n*   `if … then ... else:` 用于在特定条件为真时执行代码。\n*   `for:`\
  \ 用于对值范围内的每个值执行命令。\n*   `while:` 只要特定条件为真就一直执行代码。\n*   `until:` 用于执行代码，直到特定条件为真为止。\n\
  *   `case:` 用于评估特定值，且预先预期会有有限数量的值。\n\n#### 使用 `if … then … else`\n\n`if ... then\
  \ ... else` 结构常用于评估特定条件。你之前已经在示例 19-4 中看到它的示例。这个条件循环通常与 `test` 命令一起使用，你之前见过用它来检查文件是否存在。该命令还允许你执行许多其他操作，例如比较文件、比较整数等。\n\
  \n**提示**\n查看 `test` 命令的帮助手册页（man page）。\n\n带有 `if` 的基本结构是 `if ... then ... fi`。这种结构评估单个条件，如下例所示：\n\
  \n```\nif [ -z $1 ]\nthen\n       echo no value provided\nfi\n```\n\n在示例 19-4 中，你看到了如何通过在语句中包含\
  \ `else` 来评估两个条件。示例 19-5 展示了如何通过将 `else` 与 `if` 合并缩写为 `elif` 来评估多个条件。如果需要评估许多不同的值，这种结构非常有用。\n\
  \n#### 示例 19-5 使用 `if … then … else` 的脚本\n\n点击此处查看代码图像\n\n```\n#!/bin/bash\n#  目标是找出\
  \ $1 是文件还是目录\nif [ -f $1 ]\nthen\n       echo \"$1 is a file\"\nelif [ -d $1 ]\n\
  then\n       echo \"$1 is a directory\"\nelse\n       echo \"I do not know what\
  \ $1 is\"\nfi\nexit 0\n```\n\n#### 使用 `||` 和 `&&`\n\n与其编写完整的 `if ... then` 语句，你可以使用逻辑运算符\
  \ `||` 和 `&&`。`||` 是逻辑或（OR），只有在语句的第一部分为真时才会执行语句的第二部分；`&&` 是逻辑与（AND），只有在语句的第一部分为真时才会执行语句的第二部分。考虑这两个行代码：\n\
  \n点击此处查看代码图像\n\n```\n[ -z $1 ] && echo no argument provided\nping -c 1 10.0.0.20\
  \ 2>/dev/null || echo node is not available\n```\n\n#### 应用 `for`\n\n`for` 条件为处理数据范围提供了极佳的解决方案。在示例\
  \ 19-6 中，你可以看到第一个使用 `for` 的脚本，只要该范围内还有未处理的值，就会定义并处理该范围。\n\n### 示例 19-6 使用 `for`\
  \ 的脚本\n\n点击此处查看代码图像\n\n```\n#!/bin/bash\n#\nfor (( COUNTER=100; COUNTER>1; COUNTER--\
  \ )); do\n         echo $COUNTER\ndone\nexit 0\n```\n\n`for` 条件语句始终以 `for` 开头，后面跟着需要检查的条件。然后是\
  \ `do`，后面跟的是当条件为真时需要执行的命令，条件语句通过 `done` 结束。\n\n\n\n\n\n在示例 19-6 中，你可以看到条件是一个赋值给变量\
  \ `COUNTER` 的数字范围。变量首先初始化为 100，只要该值大于 1，在每次迭代中就会减 1。只要条件为真，就会使用 `echo` 命令显示 `$COUNTER`\
  \ 变量的值。\n\n示例 19-7 展示了我最喜欢的 `for` 单行命令之一。这次的范围被定义为一系列数字，从 100 开始到 104。\n\n**示例 19-7**\
  \ 使用 `for` 的单行命令\n\n点击此处查看代码图像\n\n```\nfor i in {100..104}; do ping -c 1 192.168.4.$i\
  \ >/dev/null && echo\n192.168.4.$i is up; done\n```\n\n注意范围是如何定义的：你指定第一个数字，后面跟着两个点，并以范围内的最后一个数字结束。通过\
  \ `for i in`，这些数字中的每一个都会被赋值给变量 `i`。对于这些数字中的每一个，都会执行一次 `ping` 命令，其中选项 `-c 1` 确保只发送一个\
  \ ping 请求。\n\n在这个 `ping` 命令中，重要的不是结果，这就是为什么将结果重定向到 `/dev/null` 设备的原因。根据 `ping` 命令的退出状态，`&&`\
  \ 之后的部分将被执行。因此，如果可以到达主机，则会 `echo` 一行表示该主机已在线。\n\n### 理解 while 和 until\n\n虽然你刚刚读到的\
  \ `for` 语句对于处理项目范围很有用，但如果你想监控诸如进程可用性之类的内容，`while` 语句就会有用。在示例 19-8 中，你可以看到如何使用 `while`\
  \ 来监控进程活动。\n\n**示例 19-8** 使用 `while` 监控进程\n\n点击此处查看代码图像\n\n```\n#!/bin/bash\n#\n\
  # usage: monitor <processname>\nwhile ps aux | grep $1 | grep -v grep > ~/output.txt\n\
  do\n      sleep 5\ndone\n\nclear\necho your process has stopped\nlogger $1 is no\
  \ longer present\nmail -s \"process $1 has stopped\" root < .\n```\n\n示例 19-8 中的脚本由两部分组成。第一部分是\
  \ `while` 循环。第二部分是 `while` 循环不再为真时需要执行的所有内容。`while` 循环的核心是 `ps` 命令，它搜索 `$1`。注意 `grep\
  \ -v grep` 的使用，它从结果中排除包含 `grep` 命令的行。请记住，`ps` 命令将包含所有运行中的命令，包括管道到 `ps` 输出的 `grep`\
  \ 命令。这可能会导致误报匹配。`ps aux` 命令的结果被重定向到文件 `~/output.txt`。这使得以后需要时从 `~/output.txt` 读取结果，但默认情况下不会显示。\n\
  \n如果语句评估为真，需要执行的命令将跟在 `while` 语句之后。在这种情况下，命令是 `sleep 5`，它基本上会让脚本暂停 5 秒。只要 `while`\
  \ 命令评估为真，它就会继续运行。如果它不再为真（在这种情况下意味着进程不再可用），它就会停止，并执行 `while` 循环之后的命令。\n\n在 `mail\
  \ -s \"process $1 has stopped\" root < .` 这一行中，使用 RHEL 8 默认的内部邮件处理程序向用户 root 发消息。`mail`\
  \ 命令将主题作为第一个参数，使用 `-s` 选项指定。注意命令末尾的 `< .`。\n\n通常当你在交互模式下使用 `mail` 命令时，它会打开一个编辑器，可以在其中编写消息正文。通过提供一个只包含点的行来关闭此编辑器。在此命令中，点是通过重定向\
  \ STDIN 提供的。这允许在不需要任何进一步用户活动的情况下处理消息。\n\n`while` 的对应物是 `until`，它会开启一个持续到条件为真的迭代。在示例\
  \ 19-9 中，`until` 用于过滤 `users` 命令的输出，以查找 `$1`（这可能是一个用户名）。在此命令为真之前，迭代继续。当在 `users`\
  \ 的输出中找到用户名时，迭代结束，并执行 `until` 循环之后的命令。\n\n**示例 19-9** 使用 `until` 监控用户登录\n\n点击此处查看代码图像\n\
  \n```\n#!/bin/bash\n#\nuntil users | grep $1 > /dev/null\ndo\n    echo $1 is not\
  \ logged in yet\n    sleep 5\ndone\necho $1 is logged in\n```\n\n### 理解 case\n\n\
  `while` 的对应物是 `until`，它会开启一个持续到条件为真的迭代。在示例 19-9 中，`until` 用于过滤 `users` 命令的输出以查找\
  \ `$1`（这可能是一个用户名）。在此命令为真之前，迭代继续。当在 `users` 的输出中找到用户名时，迭代结束，并执行 `until` 循环之后的命令。\n\
  \n`case` 是 `if-elif` 语句的强大替代方案。它允许对变量进行多种模式匹配。\n\n**示例 19-10** 使用 `case` 进行特定评估\n\
  \n点击此处查看代码图像\n\n```\ncase \"$1\" in\n   start)\n           start\n;;\n   stop)\n\
  \           rm -f lockfile\n;;\n   restart)\n           restart\n;;\n   reload)\n\
  \           reload\n;;\n   status)\n           status\n;;\n   *)\n           echo\
  \ \"Usage: $0 {start|stop|reload|status}\"\n           ;;\nesac\n```\n\n`case` 语句是\
  \ `if-elif` 语句的强大替代方案。它允许对变量进行多种模式匹配。\n\n`case` 语句的语法以 `case` 开始，跟着要测试的变量，然后是 `in`。每个模式后面跟着一个右括号\
  \ `)`。匹配后要执行的命令列在其下方，并以双分号 `;;` 终止。整个 `case` 语句以 `esac` 结束。\n\n注意 `case` 中的评估是顺序执行的。一旦完成第一个匹配，`case`\
  \ 语句就不会再评估其他内容。在评估内部可以使用通配符模式。这在 `*` 评估中可以看出，它可以匹配所有内容。但你也可以使用 `start|Start|START)`\
  \ 等评估来匹配不同的大小写。\n\n### Bash 脚本调试\n\n当脚本执行结果不符合预期时，调试脚本是有用的。如果脚本执行结果不符合预期，尝试将其作为\
  \ `bash -x` 命令的参数启动它。该命令会逐行显示脚本正在尝试执行的内容，如果运行失败，还会显示特定的错误。示例 19-11 展示了一个使用 `bash\
  \ -x` 的脚本，一眼就能看出 `grep` 命令不知道它应该执行什么；原因是它缺少要操作的参数。\n\n**示例 19-11** 使用 `bash -x`\
  \ 调试脚本\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# bash -x 319.sh\n+ 1=319\n+ grep\n\
  Usage: grep [OPTION]... PATTERN [FILE]...\nTry 'grep --help' for more information.\n\
  + users\n+ echo is not logged in yet\nis not logged in yet\n+ sleep 5\n```\n\n\n\
  \n在本章中，你学习了如何编写 shell 脚本。你还练习了几个示例，现在已经熟悉了创建成功脚本所需的某些基础元素。\n\n### 考试准备任务\n\n正如引言中“[如何使用本书]”章节部分提到的，你有几种准备考试的方案：章末实验；附录\
  \ B 中的记忆记忆表；第 27 章“[最终准备]”；以及模拟考试。\n\n### 复习所有关键主题\n\n复习本章中最重要的主题，这些主题在页面的外边页用“关键主题”图标标记。表\
