  \    _HOSTNAME=server1.example.com\n    PRIORITY=6\n    _UID=0\n    _GID=0\n   \
  \ _SYSTEMD_SLICE=system.slice\n    _CAP_EFFECTIVE=3fffffffff\n    _TRANSPORT=syslog\n\
