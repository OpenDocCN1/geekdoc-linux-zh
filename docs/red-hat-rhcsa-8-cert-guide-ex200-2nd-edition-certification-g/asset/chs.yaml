  \ 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n**创建组**\n\n使用 `chage` 也可以完成许多可以使用\
  \ `passwd` 完成的任务。例如，使用 `chage -E 2025-12-31 bob` 让用户 bob 的账户在 2025 年 12 月 31 日过期。要查看当前的密码管理设置，请使用\
  \ `chage -l`（参见示例 6-5）。`chage` 命令还具有一个交互式模式；例如，如果你输入 `chage anna`，命令将提示你以交互方式设置你想要设置的所有密码属性。\n\
