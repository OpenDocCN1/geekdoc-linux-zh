  \n\n\n\n\n# 10.](#appa.xhtml_raquiz08_10) 哪个命令允许你更改当前网络连接上的 IP 地址和默认网关？？\n\n###\
  \ 章节末实验\n\n为了完成书中后续章节的练习，建议准备一个至少包含两台服务器的测试环境。为了完成本实验中的练习，请确保你已经安装了第二台服务器。\n\n###\
  \ 实验 8.1\n\n1. 配置第一台服务器使用 FQDN `server1.example.com`。配置第二台服务器使用 `server2.example.com`。\n\
  \n2. 在 `server1.example.com` 上，使用 `nmtui` 并配置你的主网卡通过 DHCP 自动获取 IP 地址。同时将固定 IP 地址设为\
  \ `192.168.4.210`。在 `server2` 上，将固定 IP 地址设为 `192.168.4.220`。\n\n3. 确保从 `server1`\
  \ 可以 `ping` `server2`，反之亦然。\n\n4. 为了允许你访问互联网上的服务器，请确保你的本地 DHCP 服务器提供了默认路由器和 DNS\
  \ 服务器。\n\n# 第二部分\n\n运行系统\n\n## 第 9 章\n\n软件管理\n\n**本章涵盖了以下主题：**\n\n* 使用 `yum` 管理软件包\n\
  * 使用 `yum`\n* 管理软件包模块流（Package Module Streams）\n* 使用 `rpm` 管理软件包\n\n本章涵盖了以下 RHCSA\
  \ 考试目标：\n\n* 从 Red Hat Network、远程仓库或本地文件系统安装和更新软件包\n* 配合软件包模块流（Package Module Streams）工作\n\
  \n管理软件包是 Red Hat Enterprise Linux 适配员的一项重要任务。在本章中，你将学习如何使用 `yum` 工具从命令行管理软件软件包。你还将学习仓库在通过\
  \ `YUM` 进行软件管理时扮演何种角色。接下来，我们将介绍软件包模块流的工作，这是一种解决方案，让你能够在环境中使用特定版本的软件包。在本章的最后部分，你将学习如何使用\
  \ `rpm` 命令管理软件，这对于查询新的和已安装的软件包非常有用。\n\n### “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测验可以让你评估自己是应该仔细读完整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或对自己对这些主题知识的评估有疑问，请通读整个章节。表\
  \ 9-1 列出了本章的主要标题及其对应的“我已经掌握了吗？”测验题。你可以在附录 A 中的‘我已经掌握了吗？测验和‘复习题’答案’”找到答案。\n\n| 基础主题章节\
  \ | 题目 |\n| --- | --- |\n| 使用 `yum` 管理软件包 | 1–4 |\n| 使用 `yum` | 5 |\n| 管理软件包模块流\
  \ | 6–7 |\n| 使用 `rpm` 管理软件包 | 8–10 |\n\n**表 9-1** “我已经掌握了吗？”章节与题目映射表\n\n**1.** 以下哪项用于指示应使用哪些仓库的\
  \ `.repo` 文件*不是*强制性组件？\n\n1. [label]\n2. name=\n3. baseurl=\n4. gpgcheck=\n\n**2.**\
  \ 如果服务器未向 RHN 注册，在 RHEL 上使用哪种安装源？\n\n1. 使用安装介质。\n2. 不使用任何安装源。\n3. 使用基础 RHN 仓库，但不更新。\n\
  4. 你拥有 RHN 仓库的完全访问权限，但你使用的软件不受支持。\n\n**3.** 在 `.repo` 文件中应使用以下哪项来引用本地文件系统中 `/repo`\
  \ 目录下的仓库？\n\n1. `file=/repo`\n2. `baseurl=file://repo`\n3. `baseurl=file:///repo`\n\
  4. `file=http:///repo`\n\n**4.** 关于基于 GPG 的仓库安全性，以下哪项是正确的？\n\n1. 如果仓库中的软件包已签名，你需要将\
  \ GPG 密钥复制到正确的位置。\n2. GPG 软件包签名是强制性的。\n3. GPG 软件包签名防止仓库中的软件包被更改。\n4. 在互联网仓库上建议进行\
  \ GPG 软件包签名，但对于仅供内部使用的本地仓库则不需要。\n\n**5.** 哪个命令允许你搜索包含 `semanage` 文件的软件包？\n\n1. `yum\
  \ search semanage`\n2. `yum search all semanage`\n3. `yum provides semanage`\n4.\
  \ `yum whatprovides */semanage`\n\n**6.** 哪个 yum 模块组件允许你并排使用不同的版本？\n\n1. 应用配置（Application\
  \ profile）\n2. 应用流（Application stream）\n3. 模块版本（Module version）\n\n**7.** 哪个命令允许你安装\
  \ PHP 的开发版本？\n\n1. `yum module install php`\n2. `yum module install php --devel`\n\
  3. `yum module install php/devel`\n4. `yum module install php@devel`\n\n**8.** 使用哪个命令安装已下载的\
  \ RPM 文件？\n\n1. `yum install`\n2. `yum localinstall`\n3. `rpm -ivh`\n4. `rpm -Uvh`\n\
  \n**9.** 哪个命令允许你查找文件所属的软件包？\n\n1. `rpm -ql /my/file`\n2. `rpm -ql /my/file`\n3.\
  \ `rpm -qf /my/file`\n4. `rom -qa /my/file`\n\n**10.** 哪个命令允许你分析下载的 RPM 软件包中是否包含脚本？\n\
  \n1. `rpm -qs packagename.rpm`\n2. `rpm -qp packagename.rpm`\n3. `rpm -qp --scripts\
  \ packagename.rpm`\n4. `rpm -q --scripts packagename.rpm`\n\n### 基础主题\n\n### 使用\
  \ yum 管理软件包\n\nRed Hat Linux 上默认用于管理软件的工具是 `yum`，全称为 Yellowdog Updater, Modified。`yum`\
  \ 设计用于与仓库配合，仓库是可用软件的在线仓库。在本节中，你将学习如何创建和管理仓库，以及根据仓库的内容管理软件包。\n\n注意\n\nRHEL 的软件基于\
  \ Fedora。在 RHEL 8 所基于的 Fedora 版本中，`yum` 最近被 `dnf` 工具取代了。因此，预计 RHEL 8 发布时，`yum` 命令将由\
  \ `dnf` 命令取代。你会发现，在许多请求有关 `yum` 的信息时，会被重定向到 `dnf` 资源。所以实际上你在使用 `dnf`，但 Red Hat 决定将其重命名为\
  \ `yum`。\n\n\n\n\n\n使用 `yum` 的另一个主要优势是处理软件包依赖关系的方式。在 Linux 上（与大多数其他现代操作系统上一样），软件软件包具有依赖关系。这意味着为了安装一个软件包，还必须存在其他软件包。如果不使用存储库（repositories），这意味着必须手动安装这些软件包。\n\
  \n`yum` 存储库系统会自动处理这些依赖关系。如果要安装一个软件包，它将包含所需依赖项的信息。然后，`yum` 命令将在系统配置的存储库中查找并自动获取这些依赖项。如果一切顺利，安装程序只会看到一个简短的依赖列表，将作为安装软件包的依赖被安装。如果你在使用通过\
  \ Red Hat Network (RHN) 提供的存储库的 RHEL，那么没有理由此过程无法运行，安装软件的操作通常会成功。\n\n在安装 RHEL 8 时，系统会要求你注册\
  \ Red Hat Customer Portal（红帽客户门户网站），该网站提供了不同的存储库。注册后，你可以自动安装经 Red Hat 验证的软件软件包。如果你选择在不注册的情况下安装\
  \ RHEL，它将无法连接 Red Hat 存储库，导致你没有任何存储库可用。在这种情况下，你必须自己指定想要使用哪个存储库。如果你使用的是 CentOS，你将获得\
  \ CentOS 存储库的访问且不需要注册。\n\n注意，存储库是特定于操作系统的。因此，如果你在使用 RHEL，你应该只使用 RHEL 存储库。不要尝试例如将\
  \ CentOS 存储库添加到 RHEL 服务器上。如果你想为 RHEL 服务器提供来自 Fedora 项目的额外软件（出于支持考虑，不建议这样做），你可以考虑添加\
  \ EPEL（企业级 Linux 额外软件包）存储库。有关更多信息请参阅 [`fedoraproject.org/wiki/EPEL`](https://fedoraproject.org/wiki/EPEL)。\n\
  \n## 警告\n\n在 RHEL 上添加 EPEL 存储库之前，请确保它不会破坏你当前的支持状态。EPEL 软件包不由 Red Hat 管理，添加它们可能会破坏受支持的\
  \ Red Hat 软件包。\n\n### 注册 Red Hat Enterprise Linux 以获取支持\n\nRed Hat Enterprise Linux\
  \ 是一种受支持的 Linux 操作系统，需要你进行注册。要注册 RHEL，你需要一个有效的权限（entitlement）。该权限与你在 Red Hat Customer\
  \ Portal 上的账户关联。你可以通过购买 RHEL 订阅或加入 Red Hat 开发者计划来获取权限，该计划提供免费的 Red Hat Enterprise\
  \ Developer 订阅。你可以在 [`developers.redhat.com`](https://developers.redhat.com) 注册\
  \ Red Hat 开发者订阅。\n\n获取 Red Hat Enterprise Linux 的有效订阅后，你可以使用 Red Hat Subscription\
  \ Management (RHSM) 工具来管理你的权限。管理权限涉及四个基本任务：\n\n*   **注册 (Register)：** 在注册订阅时，你将其连接到当前的\
  \ Red Hat 账户。结果是 `subscription-manager` 工具可以对系统进行清单管理。如果系统不再使用，也可以取消注销。\n*   **订阅\
  \ (Subscribe)：** 订阅系统使其能够访问订阅权限内的 Red Hat 产品更新。此外，通过订阅，你将获得与你的账户关联的支持级别。\n*   **启用存储库\
  \ (Enable repositories)：** 订阅系统后，你将获得一组默认存储库。某些存储库默认是禁用的，但在订阅系统后可以启用。\n*   **查看和跟踪\
  \ (Review and track)：** 你可以查看并跟踪当前使用的订阅。\n\n### 管理订阅\n\n你可以从 GNOME 图形界面或从命令行管理订阅。`subscription-manager`\
  \ 工具用于从命令行管理订阅。你可以通过以下方式使用它：\n\n*   **注册系统 (Register a system)：** 输入 `subscription-manager\
  \ register` 进行注册。它会提示输入你的 Red Hat 用户名和密码，输入这些信息后，你的 RHEL 服务器将被注册。\n*   **列出可用订阅\
  \ (List available subscriptions)：** 每个账户都可以访问特定的订阅。输入 `subscription-manager list\
  \ --available` 查看你的账户拥有哪些权限。\n*   **自动绑定订阅 (Automatically attach a subscription)：**\
  \ 仅注册服务器不足以访问存储库。使用 `subscription-manager attach --auto` 将你的订阅自动绑定到可用的存储库。\n*  \
  \ **获取概述 (Get an overview)：** 要查看你当前在使用哪些订阅，输入 `subscription-manager --consumed`。\n\
  *   **取消注销 (Unregister)：** 如果你要移除一个系统，请使用 `subscription-manager unregister`。如果你只能访问有限数量的注册系统，注销对于确保不会用完可用许可非常重要。\n\
  \n在注册并绑定订阅后，权限证书会被写入 `/etc/pki` 目录。在 `/etc/pki/product` 中，存储的证书指示了此系统安装了哪些 Red Hat\
  \ 产品。在 `/etc/pki/consumer` 中，存储的证书标识了系统注册的 Red Hat 账户，而 `/etc/pki/entitlement` 目录包含了绑定到此系统的订阅信息。\n\
  \n### 指定要使用的存储库\n\n在大多数情况下，在你的服务器安装完成后，它会配置好一个应该使用的存储库列表。你有时必须告诉服务器应该使用哪些存储库：\n\n\
  *   你想通过存储库分发非默认软件软件包。\n*   你正在没有在在 RHN 上注册的情况下安装 Red Hat Enterprise Linux。\n\n\
  告诉服务器使用哪个存储库并不困难，但了解如何做这一点非常重要（对于 RHCSA 考试也是如此）。\n\n![](img/key_topic_icon.jpg)\n\
  \n**重要！**\n\n为了学习如何操作存储库和软件包，请不要使用提供的存储库。因此，如果你安装了 RHEL，请不要使用 `subscription-manager`\
  \ 注册；如果你安装了 CentOS，请删除 `/etc/yum.repos.d` 中的所有文件。\n\n要告诉服务器使用哪个存储库，你需要在 `/etc/yum.repos.d`\
  \ 中创建一个以 `.repo` 结尾的文件。在该文件中需要以下内容：\n\n*   `[label]` `.repo` 文件可以包含不同的存储库，每个部分以标识特定存储库的标签开头。\n\
  *   `name=`：使用此项指定你想使用的存储库的名称。\n*   `baseurl=`：此选项包含指向特定存储库位置的 URL。\n\n在默认存储库文件中，你可能会在一个文件中发现多个存储库，如\
  \ 示例 9-1 所示。这对于将相关的存储库组合在一个文件中是有用的，并且通常在提供的默认存储库文件中这样做。如果你是自己创建存储库文件，可以为每个存储库创建单独的文件。\n\
  \n示例 9-1 显示了一个基于 CentOS 8 安装的默认存储库的存储库文件。\n\n**示例 9-1** 存储库文件示例\n\n点击查看代码图像\n\n\n\
  \n\n\n```\n[root@server1 yum.repos.d]# cat CentOS-Base.repo\n# CentOS-Base.repo\n\
  #\n# 镜像系统使用客户端的连接 IP 地址以及\n  # 每个镜像的更新状态，以选择已更新且\n  # 在地理位置上靠近客户端的镜像。你应该使用它进行 CentOS\n\
  \  # 更新，\n# 除非你正在手动选择其他镜像。\n#\n# 如果 mirrorlist= 不起作用，作为回退方案，你可以尝试\n  # 使用被注释掉的 baseurl=\
  \ 行。\n#\n#\n\n[base]\nname=CentOS-$releasever - Base\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=\n\
  \  $basearch&repo=os\n#baseurl=http://mirror.centos.org/centos/$releasever/os/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-8\n\n#已发布的更新包\n[updates]\n\
  name=CentOS-$releasever - Updates\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=\n\
  \  $basearch&repo=updates\n#baseurl=http://mirror.centos.org/centos/$releasever/updates/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-8\n\n#可能有用的额外包\n[extras]\n\
  name=CentOS-$releasever - Extras\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=\n\
  \  $basearch&repo=extras\n#baseurl=http://mirror.centos.org/centos/$releasever/extras/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-8\n\n# 扩展现有包功能的额外包\n\
  [centosplus]\nname=CentOS-$releasever - Plus\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=\n\
  \  $basearch&repo=centosplus\n#baseurl=http://mirror.centos.org/centos/$releasever/centosplus/\n\
  \  $basearch/\ngpgcheck=1\nenabled=0\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-8\n\
  ```\n\n在来自 示例 9-1 的仓库配置文件中，你可以看到了一些选项。表 9-2 总结了这些选项。\n\n| 选项 | 解释 |\n| --- | ---\
  \ |\n| `[label]` | 包含在仓库文件中作为标识符使用的标签。 |\n| `name=` | 指定仓库的名称。 |\n| `mirrorlist=`\
  \ | 指向可以获取该服务器镜像服务器信息的 URL。通常仅用于大型在线仓库。 |\n| `baseurl=` | 指向存放 RPM 软件包的基 URL。 |\n\
  | `gpgcheck=` | 如果需要对包进行 GNU 隐私卫 (GPG) 完整性检查，则设置为 1。如果设置为 1，则需要 GPG 密钥。 |\n| `gpgkey=`\
  \ | 指定用于检查包完整性的 GPG 密钥的位置。 |\n\n**表 9-2** .repo 文件中的关键选项\n\n当你创建一个仓库文件时，`baseurl`\
  \ 参数是最重要的，因为它告诉你的服务器去哪里寻找要安装的文件。`baseurl` 的参数是需要从其安装文件的 URL。这通常是一个 HTTP 或 FTP URL，但也可以是基于文件的\
  \ URL。\n\n当你使用 URL 时，包含两个组件。首先，URL 标识了要使用的协议，格式为 `protocol://`，例如 `http://`、`ftp://`\
  \ 或 `file://`。紧随 URL 之后的是该 URL 上的精确位置。这可以是 Web 服务器或 FTP 服务器的名称，包括发现文件所在的的子目录。如果\
  \ URL 是基于文件的，文件系统上的位置也以 `/` 开头。\n\n因此，对于基于文件系统的 URL，`baseurl` 中会有三个斜杠，例如 `baseurl:///repo`，它指向本地文件系统上的\
  \ `/repo` 目录。\n\n### 了解仓库安全\n\n使用仓库允许你透明地从互联网安装软件包。这种能力非常方便，但也涉及安全风险。在安装 RPM 软件包时，你是以\
  \ root 权限执行的，如果 RPM 软件包脚本代码中执行了代码（这很常见），它也将以 root 身份执行。出于此原因，你需要确保能够信任正在尝试安装的软件包。这就是为什么仓库通常使用密钥对包进行签名。这也是为什么在红帽企业级\
  \ Linux 上，只使用通过 RHN 提供的仓库是一个好主意。\n\n为了确保仓库中包的安全，这些包通常用 GPG 密钥签名。这使得检查包自仓库所有者提供以来是否被更改成为可能。用于签名软件包的\
  \ GPG 密钥通常也通过仓库提供。仓库用户可以下载该密钥并将其存储在本地，以便每次从仓库下载包时都能自动执行包签名检查。\n\n如果仓库安全被破坏，入侵者成功黑入仓库服务器并在上面放置了一些假包，GPG\
  \ 密钥签名将无法匹配，从而产生警告。如果你使用经过 GPG 签名的仓库，在第一次接触时，`rpm` 命令会提示。这就是为什么强烈建议在使用仓库时使用 GPG\
  \ 密钥。\n\n> **提示**：对于内部仓库，安全风险并不高。\n\n**示例 9-2** 首次访问仓库时下载 own 密钥\n\n\n\n\n\n创建自己的仓库并不是\
  \ RHCSA 考试的要求，但如果你想测试仓库的设置和使用，了解如何这样做是非常有用的。此外，在完成本书中的练习题时，了解如何设置自己的仓库非常重要，因为你不应该使用在线提供的可用仓库。\n\
  \n设置自己的仓库允许你将自己的 RPM 包放在一个目录中，并将该目录发布为仓库。如果你安装了 RHEL 但没有连接到 RHN（这意味着你没有任何仓库），那么了解如何这样做也很有用。\n\
  \n该过程本身并不复杂。你需要确保在想要用仓库的目录中有所有的 RPM 包，在完成之后，你需要使用 `createrepo` 命令来生成元数据，以便你能够将该目录作为仓库。练习\
  \ 9-1 描述了如何创建你自己的仓库。\n\n**示例 9-3** 使用 `yum repolist` 验证仓库可用性\n\n点击此处查看代码图像\n\n```\n\
  [root@server3 yum.repos.d]# yum repolist\nUpdating Subscription Management repositories.\n\
  Unable to read consumer identity\nThis system is not registered to Red Hat Subscription\
  \ Management.\n  You can use subscription-manager to register.\nAppStream      \
  \                         194 MB/s | 5.3 MB        00:00    \nBaseOS           \
  \                        86 MB/s | 2.2 MB        00:00    \nLast metadata expiration\
  \ check: 0:00:01 ago on Sat 25 May 2019\n  09:20:19 AM EDT.\nrepo id           \
  \             repo name                         status\nAppStream              \
  \        AppStream                         4,672\nBaseOS                       \
  \  BaseOS                            1,658\n```\n\n### 使用 `yum`\n\n此时，你应该已经有了运行中的仓库，是时候开始使用它们了。要使用仓库，你需要\
  \ `yum` 命令。该命令允许你对仓库执行若干项任务。表 9-3 提供了常用 `yum` 任务的概述。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 任务 | 解释 |\n| --- | --- |\n| `search` | 搜索包的精确名称。 |\n| `whatprovides */name`\
  \ | 对包进行深度搜索，以查找包内的特定文件。 |\n| `info` | 提供有关包的更多信息。 |\n| `install` | 安装包。 |\n| `remove`\
  \ | 移除包。 |\n| `list [all | installed]` | 列出所有或已安装的包。 |\n| `group list` | 列出包组。 |\n\
  | `group install` | 安装组中的所有包。 |\n| `update` | 更新指定的包。 |\n| `clean all` | 删除所有存储的元数据。\
  \ |\n\n**表 9-3** 常用 `yum` 任务\n\n#### 使用 `yum` 查找软件包\n\n要用 `yum` 安装包，你首先需要知道包的精确名称。`yum\
  \ search` 命令可以帮助你做到这一点。当你使用 `yum search` 时，它会首先连接在线仓库（这可能需要一分钟），之后会将最新的仓库元数据下载到本地机器。然后，`yum\
  \ search` 会在包名和描述中查找你寻找的字符串。在示例 9-4 中，你可以看到使用 `yum search user` 后的结果。\n\n**示例 9-4**\
  \ `yum search` 示例输出\n\n点击此处查看代码图像\n\n```\n[root@server3 ~]# yum search user\nUpdating\
  \ Subscription Management repositories.\nUnable to read consumer identity\nThis\
  \ system is not registered to Red Hat Subscription Management.\n  You can use subscription-manager\
  \ to register.\nLast metadata expiration check: 0:02:23 ago on Sat 25 May 2019\n\
  \  09:20:19 AM EDT.\n====================  Name & Summary Matched: user ====================\n\
  trousers-lib.x86_64    : TrouSerS libtspi library\ntrousers-lib.i686      : TrouSerS\
  \ libtspi library\ntrousers-lib.x86_64    : TrouSerS libtspi library\ngnome-user-docs.noarch\
  \ : GNOME User Documentation\ngnome-user-docs.noarch : GNOME User Documentation\n\
  xdg-user-dirs.x86_64   : Handles user special directories\nxdg-user-dirs.x86_64\
  \   : Handles user special directories\nutil-linux-user.x86_64 : libuser based util-linux\
  \ utilities\n...\n```\n\n由于 `yum search` 命令只在包名和摘要中查找，它往往无法显示你需要的内容。你通常需要查找包含特定文件的包。为了实现这一点，`yum\
  \ whatprovides` 命令或 `yum provides` 命令将为你提供帮助。（这两个命令在功能上没有区别。）为了明确你正在寻找包含特定文件的包，你需要将文件名指定为\
  \ `*/filename`，或者使用你想要使用的文件的完整路径。例如，如果你需要查找包含特定文件 semanage 的包，请使用 `yum whatprovides\
  \ */semanage`。\n\n#### 获取包的更多信息\n\n在安装包之前，获取一些关于它的信息是个好主意。由于 `yum` 命令设计得非常直观，几乎可以猜出工作原理。只需使用\
  \ `yum info` 后加上包名。在示例 9-5 中，你可以看到 `nmap` 包的情况（顺便说一下，这是一个非常有用的工具）。\n\n**示例 9-5**\
  \ `yum info` 示例输出\n\n点击此处查看代码图像\n\n```\n[root@server3 ~]# yum info nmap\nUpdating\
