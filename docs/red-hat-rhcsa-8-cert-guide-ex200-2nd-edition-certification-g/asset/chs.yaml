  \ `yum install nmap`。当用这种方式使用时，`yum` 命令会请求确认。如果你在输入 `yum install` 命令时确定自己在做什么，大可以使用\
  \ `-y` 选项，它会向 `yum` 通常发出的确认提示传递一个“yes”。示例 9-6 显示了结果的样式。\n\n### 示例 9-6 使用 `yum` 安装软件\n\
