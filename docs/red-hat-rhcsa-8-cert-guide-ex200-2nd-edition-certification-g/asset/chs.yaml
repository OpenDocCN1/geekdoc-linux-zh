  \ 第 27 章：最终准备\n\n恭喜！你读完了这本书，现在是时候准备考试了。本章将帮助你准备考试。在本章中，你将学习更多关于考试流程以及如何注册考试的信息。\n\
  \n### 通用技巧\n\n在本节中，你将获得关于考试的一些通用技巧。你将学习如何验证自己的就绪情况、如何注册考试以及考试期间该做什么。\n\n#### 验证你的就绪情况\n\
  \n只有当你认为准备好可以通过时再注册考试。这本书包含了大量帮助你验证就绪情况的内容。首先，你应该能够回答每章开头的“我已经知道这些了吗？”测验。\n\n####\
  \ 注册考试\n\n参加 RHCSA 考试有两种方式。你可以选择参加教室考试（classroom exam）或参加自助机考试（kiosk exam）。教室考试通常只在周五举行，主要由红帽提供，作为课程结束时的考试。因此，与你同在教室里的大多数人在参加考试前都参加了\
  \ 4 天的课程培训，由于这个原因，教室考试的名额有限。\n\n在很长一段时间内，教室考试是参加考试的唯一方式。现在，红帽也提供了自助机考试。与教室考试不同，自助机考试是以个人形式进行的，你在自助机电脑上完成考试任务。这是一台位于考试中心隔间内的受监控电脑，当你在执行考试任务时，会有多个摄像头对你进行监控。自助机考试的好处是你可以根据自己的时间表安排方便的时间和地点。\n\
  \n\n\n\n\n如果你预约了教室考试，你将收到一份包含考试安排日期和时间的邀请。如果你预约了自助机考试（kiosk exam），你将获得一个兑换码，可以使用它来选择考试地点、时间和日期。\n\
  \n## 考试当天\n\n确保携带适当的身份证明参加考试。要获得考试许可，你需要一个经过批准的政府签 ID。通常，`passport` 或 `driver’s\
  \ license` 即可；你所在的国家可能也接受其他类型的证明。不要忘记携带；如果没有 `ID`，你将不允许参加考试。\n\n此外，确保准时到达。建议在考试预定开始时间前\
  \ 30 分钟到达。如果你迟到，通常会被允许参加考试，但不会获得额外时间。因此，请务必准时到达。\n\n在证明身份后，你将进入考试环境介绍。由于每位受考者都要与\
  \ `Red Hat` 签署保密协议，我无法详细告诉考试环境是什么样的。但我可以告诉你，将有一个由一个或多个服务器组成的环境。还有一份必须执行的任务列表。按步骤完成这些任务，仔细且彻底地阅读所有内容，如果你准备充分，就能通过考试。\n\
  \n## 考试期间\n\n你在考试期间必须处理的任务并不一定是最符合逻辑顺序呈现的。因此，在开始处理第一个任务之前，先阅读所有任务是一个好主意。在阅读所有任务时，你可以决定创建所需配置的最佳顺序。为你自己确定最佳可能的顺序，因为这可能并不显而易见。\n\
  \n你有 2 小时 30 分钟来完成所有考试任务。预计会有大约 17 个任务；你可能会多一点或少一点。\n\n另一个非常重要的提示是仔细阅读，这是一项很多人没有经过良好训练的。`IT\
  \ administrators` 非常擅长扫描网页以检索他们所需的信息。这种技能在考试中对你没有帮助。阅读能力才有帮助。这一点我怎么强调都不为过。我估计所有考试失败的人中\
  \ 40% 是因为他们没有仔细阅读考试题目。（他们只是在扫视。）所以，请让我给你提供一些关于如何阅读考试题目的建议：\n\n*   如果英语不是你的母语，你可以切换题目呈现的语言。也许英文题目对你来说并不清楚，但翻译成另一种语言的题目就很清晰了。因此，如果有疑问，请也阅读翻译版本。\n\
  \n*   由于题目最初是用英文编写——这是默认语言也是大多数考考者的偏好——它们在那种形式下往往是完美的，因为 `Red Hat` 付出了巨大的努力使其变得完美。`Red\
  \ Hat` 必须依靠翻译人员来确保题目翻译正确，因此英文题目的质量是最好的。你可以自由使用翻译后的题目，但你应该将英文题目作为你的主要来源。\n\n*   为了确保你不漏掉任何内容，请为每个问题创建一个任务列表。考试期间你随身带有草稿纸。利用它列出你必须完成的任务短列表，并逐一处理。这种方法有助于你集中在考试题目实际要求的上。\n\
  \n*   完成第一个任务后，检查你的任务列表以确保没有漏掉任何内容。考试期间你随身带有草稿纸。利用它列出你必须完成的任务短列表，并逐一处理。这种方法有助于你集中在考试题目实际要求的上。完成第一个任务后，检查你的任务列表以确保没有漏掉任何内容。考试期间你随身带有草稿纸。利用它列出你必须完成的任务短列表，并逐一处理。这种方法有助于你集中在考试题目实际要求的上。\n\
