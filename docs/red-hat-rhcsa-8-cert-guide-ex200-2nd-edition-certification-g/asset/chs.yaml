  \ |\n\n**表 11-1** “我已经学过这些吗？”章节与问题映射\n\n**1.** 哪个命令显示了系统上当前加载的所有服务单元文件？\n\n1. `systemctl\
  \ --type=service`\n2. `systemctl --type=service --all`\n3. `systemctl --list-services`\n\
  4. `systemctl --show-units | grep services`\n\n**2.** 关于 Systemd wants 的哪个描述是*不*正确的？\n\
  \n1. 你可以使用 `systemctl enable` 命令创建 wants。\n2. 特定 want 所应用的目标（target）与相关的 wants 无关。\n\
  3. Wants 始终在 `/usr/lib/systemd/system` 目录中管理。\n4. 每个服务都清楚其 wants 应该添加到哪个 target\
  \ 中。\n\n**3.** 避免不兼容单元之间发生冲突的最佳解决方案是什么？\n\n1. 无；单元文件已自行定义了它们与哪些单元不兼容。\n2. 使用 `systemctl\
  \ disable` 禁用服务。\n3. 使用 `systemctl unmask` 取消服务的掩蔽（unmask）。\n4. 使用 `systemctl mask`\
  \ 屏蔽服务。\n\n**4.** 下列中哪项不是 Systemd 服务的有效状态？\n\n1. Running(active)\n2. Running(exited)\n\
  3. Running(waiting)\n4. Running(dead)\n\n**5.** 关于 socket 单元，下列哪个描述是*不*正确的？\n\n\
  1. socket 单元需要一个同名的服务单元。\n2. socket 单元可以监听端口，并仅在端口发生活动时激活服务。\n3. socket 单元不能包含应启动的关联二进制文件的名称。\n\
  4. socket 单元可以对路径活动做出反应。\n\n**6.** 下列中哪项不是有效的 Systemd 单元类型？\n\n1. service\n2. udev\n\
  3. mount\n4. socket\n\n**7.** 你想找出哪些其他 Systemd 单元依赖于特定单元。你会使用哪个命令？\n\n1. `systemd\
  \ list-dependencies --reverse`\n2. `systemctl list-dependencies --reverse`\n3. `systemctl\
  \ status my.unit --show-deps`\n4. `systemd status my.unit --show-deps -r`\n\n**8.**\
  \ 如何将 Systemd 使用的默认编辑器更改为 **vim**？\n\n1. `export EDITOR=vim`\n2. `export SYSTEMD_EDITOR=vim`\n\
  3. `export EDITOR=/bin/vim`\n4. `export SYSTEMD_EDITOR=/bin/vim`\n\n**9.** 如果你想确保在依赖项失败时启动过程不会失败，你应该使用以下哪个关键字来定义\
