  \n### 定义关键术语\n\n定义本章中的以下关键术语，并在术表中检查你的答案：\n\nunit\n\nwants\n\ntarget\n\nSystemd\n\
  \ndependencies\n\n### 复习题\n\n以下问题旨在帮助测试你对概念、术语以及知识广度的掌握程度。你可以在附录 A 中找到这些问题的答案。\n\
  \n**1.** 什么是 unit（单元）？\n\n**2.** 应该使用哪个命令来显示所有已加载的 service units？\n\n**3.** 如何为服务创建一个\
  \ want（想要）？\n\n**4.** 如何更改 `systemctl` 的默认编辑器？\n\n**5.** 哪个目录包含自定义的 Systemd unit\
  \ 文件？\n\n**6.** 应该包含什么以确保 unit 文件将自动加载另一个 unit 文件？\n\n**7.** 哪个命令显示 `httpd.service`\
  \ unit 可用的配置选项？\n\n**8.** 哪个命令显示特定 unit 的依赖项？\n\n**9.** 如果 `systemctl status` 显示一个\
  \ unit 处于 dead（已死亡）状态，意味着什么？\n\n**10.** 如何创建一个 Systemd override（覆盖）文件？\n\n### 章末实验\n\
  \n你现在已经学习了如何使用 Systemd。在继续之前，做一个实验是一个好主意，有助于确保你能够应用在本章中获得的技能。\n\n### 实验 11.1\n\n\
  1. 安装 `vsftpd` 和 `httpd` 服务。\n\n2. 将默认 `systemctl` 编辑器设置为 `vim`。\n\n3. 编辑 `httpd.service`\
  \ unit 文件，使得启动 `httpd` 时将始终自动启动 `vsftpd`。编辑 `httpd` 服务，使其在失败后 10 秒内自动重新启动。\n\n##\
  \ 第 12 章\n\n任务调度\n\n**本章涵盖了以下主题：**\n\n* 配置 cron 自动执行循环任务\n\n* 配置 at 调度未来任务\n\n本章涵盖了以下\
  \ RHCSA 考试目标：\n\n* 使用 `at` 和 `cron` 调度任务\n\n在 Linux 服务器上，让某些任务在特定时间运行非常重要。这可以通过使用\
  \ `at` 和 `cron` 服务来实现，这些服务可以配置为运行未来的任务。`at` 服务用于仅执行一次未来的任务，而 `cron` 服务用于定期循环的常规任务。在本章中，你将学习如何配置这两者。\n\
  \n### “我掌握这些了吗？”测验\n\n“我掌握这些了吗？”测验可以让你评估自己是应该彻底通读整个章节，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整章内容。表\
  \ 12-1 列出了本章的主要标题及其相对应的“我掌握这些了吗？”测验题。你可以在附录 A 中的“‘我掌握这些了吗？’测验和‘复习题’答案”找到答案。\n\n\
