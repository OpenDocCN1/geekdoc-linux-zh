  \ profile --set powersave`\n\n### 基础主题\n\n### 进程管理简介\n\n对于 Linux 上发生的一切，都会启动进程。因此，进程管理是管理员必须掌握的核心技能之一。为了高效地工作，你需要知道你正在处理的是什么类型的进程。进程可以分为三类：\n\
  \n* *Shell 作业*是从命令行启动的命令。它们与启动进程时的当前 Shell 相关。Shell 作业也称为*交互式进程*。\n* *守护进程 (daemon)*\
  \ 是提供服务的进程。它们通常在计算机启动时启动，并且（在所有情况下）以 root 权限运行。\n* *内核线程*是 Linux 内核的一部分。你无法使用常用工具管理它们，但对于系统性能监控，关注它们是非常重要的。\n\
  \n启动进程时，可以使用多个线程。线程是由进程启动并在 CPU 服务的任务。线程管理应该在命令内部完成。\n\n### 管理 Shell 作业\n\n当用户输入命令时，就会启动一个\
  \ Shell 作业。如果没有采取特殊措施，该作业将作为前台进程启动，并一直占据启动它的终端直到工作完成。作为 Linux 管理员，你需要知道如何在前台或后台启动\
  \ Shell 作业，以及你可以如何管理这些作业。\n\n#### 在前台和后台运行作业\n\n\n\n\n\n默认情况下，任何执行的命令都会作为前台作业启动。这意味着在命令完成之前，你无法在启动该命令的终端上进行任何操作。对于许多命令来说，这并不重要，因为命令通常需要一些时间才能完成，完成后，它会将控制权返回给启动它的\
  \ shell。有时，在后台启动命令可能会很有用。这对于那些不需要用户交互且需要很长时间才能完成的进程是有意义的。需要用户交互的进程在后台运行时将无法获得这些交互，因此在移动到后台时通常会停滞。你可以采取两种不同的方法在后台运行进程。\n\
  \n### 在后台运行进程\n\n如果你知道某个作业将花费很长时间才能完成，可以在该命令后面加上一个 `&` 来启动它。该命令会立即在后台启动该作业，为从命令行启动其他任务腾出空间。要将上一个后台启动的作业移回前台作业，请使用\
  \ `fg` 命令。该命令会立即且无需进一步询问地将最后一个作业带回前台。如果当前有多个作业在后台运行，你可以通过添加作业 ID（job ID）将某个作业移回前台，如\
  \ `jobs` 命令所示。\n\n有时启动的作业耗时比预测的要长得多。如果发生这种情况，你可以使用 `Ctrl-Z` 临时停止该作业。这不会将作业从内存中移除，只是暂停作业以便对其管理。一旦作业暂停，你可以使用\
  \ `bg` 命令将其作为后台作业继续运行。用于管理 shell 作业的替代键组合是 `Ctrl-C`。此键组合会停止当前作业并将其从内存中移除。\n\n另一个相关的键组合是\
  \ `Ctrl-D`，它向当前作业发送文件结束（EOF）字符。结果是作业停止等待进一步输入，以便完成其当前正在执行的操作。按下 `Ctrl-D` 的结果有时与按下\
  \ `Ctrl-C` 的结果相似，但存在区别。当使用 `Ctrl-C` 时，作业直接被取消，没有任何内容被正确关闭。当使用 `Ctrl-D` 时，作业停止等待进一步输入并随后终止，这通常正是妥善完成任务所需的。\n\
  \n### 管理 shell 作业\n\n当你在前台和后台之间移动作业时，对所有当前作业有一个概览可能会有用。要获取此类概览，请使用 `jobs` 命令。如你在表\
  \ 10-2 所示，该命令提供了所有当前作为后台作业运行的作业概览，包括在后台启动时分配给作业的作业编号。这些作业编号可以作为 `fg` 和 `bg` 命令的参数来执行作业管理任务。在练习\
  \ 10-1 中，你将学习如何从 shell 执行常见的作业管理任务。\n\n![](img/key_topic_icon.jpg)\n\n| 命令 | 用途\
  \ |\n| --- | --- |\n| `&` (用于命令行末尾) | 立即在后台启动该命令。 |\n| `Ctrl-Z` | 临时停止作业以便对其管理。例如，可以将其移到后台。\
  \ |\n| `Ctrl-D` | 停止等待进一步输入并随后终止。 |\n| `Ctrl-C` | 停止当前作业并从内存中移除。 |\n| `bg` | 将暂停的作业作为后台作业继续运行。\
  \ |\n| `fg` | 将最后一个作业带回前台。 |\n| `jobs` | 显示所有当前作为后台作业运行的作业概览。 |\n\n#### 表 10-2 作业概览\n\
  \n#### 父子关系\n当你在前台和后台之间移动作业时，对所有当前作业有一个概览可能会有用。要获取此类概览，请使用 `jobs` 命令。如你在表 10-2 所示，该命令提供了所有当前作为后台作业运行的作业概览，包括在后台启动时分配给作业的作业编号。这些作业编号可以作为\
  \ `fg` 和 `bg` 命令的参数来执行作业管理任务。\n\n\n\n\n获取当前运行进程概览的最常用命令是 `ps`。如果不带任何参数使用，`ps` 命令将仅显示由当前用户启动的进程。你可以使用许多不同的选项来显示不同的进程属性。如果你在寻找活动进程的简要摘要，请使用\
  \ `ps aux`（如你在示例 10-1 中所示）。如果你不仅想查看进程名称，还要查看启动进程的精确命令，请使用 `ps -ef`（参见示例 10-2）。还有其他使用\
  \ `ps` 的替代方法，例如 `ps fax` 命令，它可以显示父进程和子进程之间的层次关系（参见示例 10-3）。\n\n#### 示例 10-2 使用 `ps\
  \ -ef` 查看启动进程的精确命令\n\n点击此处查看代码\n\n```\n[root@server3 ~]# ps -ef\nUID     PID  PPID\
  \  C STIME TTY      TIME    CMD\nroot      1     0  0 08:25 ?      00:00:02  /usr/lib/systemd/systemd\n\
  \                                              --switched-root\n               \
  \                               --system --deserialize\n                       \
  \                       17\n\n...\nroot  34948     2  0 12:16 ?      00:00:00  [kworker/0:1-events]\n\
  root  34971  1030  0 12:17 ?      00:00:00  sshd: root [priv]\nroot  34975 34971\
  \  0 12:17 ?      00:00:00  sshd: root@pts/2\nroot  34976 34975  0 12:17 pts/2 \
  \ 00:00:00  -bash\nroot  35034     1  0 12:17 pts/2  00:00:00  sleep 3600\nroot\
  \  35062     2  0 12:20 ?      00:00:00  [kworker/u256:2]\nroot  35064     2  0\
  \ 12:20 ?      00:00:00  [kworker/0:3-cgroup_\n                                \
  \              destroy]\nroot  35067     2  0 12:20 ?      00:00:00  [kworker/1:2-events_\n\
  \                                              freezable_power_]\nroot  35087  \
  \ 939  0 12:21 ?      00:00:00  sleep 60\nroot  35088 33127  0 12:22 pts/1  00:00:00\
  \  ps -ef\n```\n\n### 注意\n\n对于许多命令，选项需要以连字符（hyphen）开头。对于某些命令，并非如此，使用连字符是可选的。由于历史原因，`ps`\
  \ 命令就是这些命令之一。在早期的 UNIX 时代，有两种主要变：System V 变，在其中选项前使用连字符是强制的；以及 BSD 变，在其中使用连字符是可选的。`ps`\
  \ 命令基于这两种变体，因此某些选项不必以连字符开头。\n\n#### 示例 10-3 使用 `ps fax` 显示进程间的父子关系\n\n点击此处查看代码\n\
  \n```\n[root@server3 ~]# ps fax\n      PID TTY      STAT   TIME  COMMAND\n     \
  \   2 ?        S      0:00  [kthreadd]\n        3 ?        I<     0:00  \\_ [rcu_gp]\n\
  \        4 ?        I<     0:00  \\_ [rcu_par_gp]\n...\n  2460 ?           Ssl \
  \   0:00  \\_ /usr/bin/pulseaudio --daemonize=no\n  2465 ?           Ssl    0:00\
  \  \\_ /usr/bin/dbus-daemon --session\n                                  --address=systemd:\
  \ --nofork\n                                  --nopidfile --systemd-activation --\n\
  \n  2561 ?           Ssl    0:00  \\_ /usr/libexec/at-spi-bus-launcher\n  2566 ?\
  \           Sl     0:00  |   \\_ /usr/bin/dbus-daemon --config-\n              \
  \                    file=/usr/share/defaults/at-spi2/\n                       \
  \           accessibility.conf --nofork\n  2569 ?           Sl     0:00  \\_ /usr/libexec/at-spi2-registryd\n\
  \                                  --use-gnome-session\n  2589 ?           Ssl \
  \   0:00  \\_ /usr/libexec/xdg-permission-store\n  2594 ?           Sl     0:00\
  \  \\_ /usr/libexec/ibus-portal\n  2704 ?           Sl     0:00  \\_ /usr/libexec/ibus-portal\n\
  \                                  --use-gnome-session\n  2589 ?           Ssl \
  \   0:00  \\_ /usr/libexec/xdg-permission-store\n  2594 ?           Sl     0:00\
  \  \\_ /usr/libexec/ibus-portal\n  2704 ?           Sl     0:00  \\_ /usr/libexec/ibus-portal\n\
  ```\n*(注：提供的文本最后部分包含了一些重复/损坏的内容，我已根据指令进行了清理。)*\n\n\n\n让我们来看一下使用 `nice` 和 `renice`\
  \ 的示例。命令 `nice -n 5 dd if=/dev/zero of=/dev/null &` 会启动一个无限的 I/O 密集型任务，但调整了 nice\
  \ 值（niceness），以便为其他进程留出空间。要调整正在运行进程的 nice 值，你需要该进程的 PID。以下两个命令展示了如何使用 `ps aux` 找到上一个示例中\
  \ `dd` 任务的 PID。接下来，你将看到如何使用 `renice` 命令更改该命令的 nice 值：\n\n1. 使用 `ps aux | grep dd`\
  \ 找到刚刚启动的 `dd` 命令的 PID。PID 位于命令输出的第二列。\n2. 使用 `renice -n 10 -p 1234`（假设 `1234` 是你找到的\
  \ PID）。\n\n请注意，普通用户只能降低运行进程的优先级。你必须拥有 root 权限提高进程的优先级。\n\n### 使用 kill、killall 和\
  \ pkill 向进程发送信号\n\n在你开始考虑使用 `kill` 命令或向进程发送其他信号之前，最好了解 Linux 进程之间存在层级关系。每个进程都有一个父进程，只要父进程存活，它就负责它所创建的子进程。在旧版本的\
  \ Linux 中，杀死一个父进程也会杀死它所有的子进程。在 RHEL 8 中，如果你杀死一个父进程，它所有的子进程将变成 systemd 进程的子进程。\n\n\
  Linux 内核允许向进程发送许多信号。使用 `man 7 signals` 可以查看所有可用信号的概述。\n\n![](img/key_topic_icon.jpg)\n\
  \n* 信号 `SIGTERM` (15) 用于请求进程停止。\n* 信号 `SIGKILL` (9) 用于强制进程停止。\n* 信号 `SIGHUP` (1)\
  \ 用于挂起进程。其效果是进程将重新读取其配置文件，这使得在修改进程配置文件文件后使用该信号是很有用的。\n\n要向进程发送信号，你使用 `kill` 命令。最常见的用法是停止一个进程，你可以通过使用\
  \ `kill` 命令后跟进程的 PID 来实现。这会向进程发送 `SIGTERM` 信号，通常会导致进程停止活动并关闭所有打开的文件。\n\n有时 `kill`\
  \ 命令不起作用，因为你想杀死的进程可能会忽略它。在这种情况下，你可以使用 `kill -9` 向进程发送 `SIGKILL` 信号。因为 `SIGKILL`\
  \ 信号无法被忽略，它会强制进程停止，但使用此命令时你也会面临丢失数据的风险。通常情况下，使用 `kill -9` 是一个坏主意：\n\n* 你面临数据丢失的风险。\n\
  * 如果其他进程依赖于你刚刚杀死的进程，你的系统可能会变得不稳定。\n\n提示：使用 `kill -l` 显示可以与 `kill` 一起使用的信号列表。\n\n\
  有一些与 `kill` 相关的命令：`killall` 和 `pkill`。`pkill` 命令稍微更容易用，因为它接受进程名称而不是 PID 作为参数。如果需要同时杀死多个使用相同名称的进程，可以使用\
  \ `killall` 命令。\n\n当 Linux 环境是多进程而非多线程时，使用 `killall` 特别常见。在多进程环境中，服务器启动了多个具有相同名称的命令，很难根据它们各自的独立\
  \ PID 逐一停止这些命令。使用 `killall` 可以让你能够同时终止所有这些进程。\n\n在多线程环境中，使用 `killall` 的冲动较小。因为通常只有一个进程产生多个线程，所有这些线程都会通过停止启动它们的进程来终止。尽管如此，你仍然可以使用\
  \ `killall` 来终止在服务器上启动的许多具有相同名称的进程。在练习 10-2](#ch10.xhtml_ch10exe2) 中，你将使用 `ps`、`nice`、`kill`\
  \ 和相关工具来管理进程。\n\n### 使用 top 管理进程\n\n管理进程的一个便捷工具是 `top`。对于常见的进程管理任务，`top` 非常棒，因为它提供了当前运行的最活跃进程的概述（因此得名为\
  \ `top`）。这让你能够轻松找到可能需要关注的进程。从 `top` 中，你还可以执行常见的进程管理任务，例如调整当前进程的优先级和杀死进程。图 10-1 显示了启动\
  \ `top` 时出现的界面。\n\n![截图显示了启动 \"top\" 时出现的界面。显示的详细信息包括用户数、平均负载、任务、CPU 百分比、MiB 内存和\
  \ MiB 交换空间。还列出了 PID、用户、PR、NI、VIRT、RES、SHR、CPU 百分比、内存百分比以及时间和命令等详情。](img/10fig01.jpg)\n\
  \n**图 10-1** 使用 top 让进程管理变得简单\n\n你可以从 `top` 工具中方便获取的信息之一是进程状态。表 10-3 提供了你可能观察到的不同进程状态的概述。\n\
  \n![](img/key_topic_icon.jpg)\n\n| 状态 | 含义 |\n| :--- | :--- |\n| 运行 (R) | 进程当前处于运行状态。\
  \ |\n| 睡眠 (S) | 进程正在等待事件完成。 |\n| 不中断睡眠 (D) | 处于不可停止的睡眠状态。这通常发生在进程等待 I/O 时。 |\n|\
  \ 停止 (T) | 进程已停止，通常发生在交互 shell。 |\n| 僵尸 (Z) | 进程已停止但未被父进程移除，使其处于不可管理状态。 |\n\n现在你已经知道了如何在命令行中使用\
  \ `kill` 和 `nice` 命令，在 `top` 中使用相同的功能会更简单。从 `top` 中，输入 `k`；`top` 随后提示要发送信号的进程 PID。默认选择最活跃的进程。在你输入\
  \ PID 后，`top` 询问想发送哪个信号。默认使用信号 15 SIGTERM。然而，如果你想坚持一点，可以输入 `9` SIGKILL。现在按回车终止进程。\n\
  \n要在 `top` 中重新调整运行进程，输入 `r`。系统首先提示要重新调整的进程 PID。输入 PID 后，提示你想要使用的 `nice` 值。输入正值降低进程优先级，输入负值提高优先级。\n\
  \n从 `top` 获取的另一个重要参数是平均负载。平均负载表示为处于运行状态 (R) 或阻塞状态 (D) 的进程数。显示过去 1、5 和 15 分钟的平均负载，你可以在\
  \ `top` 屏幕右上角看到当前值。或者，你可以使用 `uptime` 命令显示当前的负载统计信息（参见示例 10-4](#ch10.xhtml_ch10ex04)）。\n\
  \n**示例 10-4** 使用 `uptime` 获取负载信息\n\n点击此处查看代码图像\n\n\n\n\n通常情况下，平均负载（load average）不应高于系统中的\
  \ CPU 核心数。你可以使用 `lscpu` 命令查看系统中的 CPU 核心数。如果较一段时间内的平均负载高于系统中的 CPU 数量，说明你可能存在性能问题。在练习\
  \ 10-3 中，你将调查平均负载统计数据并学习如何管理平均负载。\n\n### 使用 tuned 优化性能\n\n为了从一开始就提供最佳性能，RHEL 8 自带了\
  \ `tuned`。它提供了一个守护进程，用于监控系统活动并提供了一些配置文件（profiles）。在这些配置中，管理员可以自动对系统进行调整，以获得最佳延迟、吞吐量或功耗。\n\
  \n根据已安装系统的属性，在安装时会自动选择一个 `tuned` 配置文件，并且在安装完成后，可以手动更改当前配置。管理员还可以更改 `tuned` 配置文件中的设置。表\
  \ 10-4 给出了默认配置的概览。\n\n| 配置 (Profile) | 用途 |\n| --- | --- |\n| `balanced` | 功耗与性能之间的最佳折中\
  \ |\n| `desktop` | 基于 `balanced` 配置，但针对交互式应用的更好的响应进行了优化 |\n| `latency-performance`\
  \ | 针对最大吞吐量进行了优化 |\n| `network-latency` | 基于 `latency-performance`，但带有额外的选项来降低网络延迟\
  \ |\n| `network-throughput` | 基于 `throughput-performance`，为流媒体内容优化了旧款 CPU |\n| `powersave`\
  \ | 针对最大节电进行了优化 |\n| `throughput-performance` | 针对最大吞吐量进行了优化 |\n| `virtual-guest`\
  \ | 优化 Linux 以作为虚拟机运行 |\n| `virtual-host` | 优化 Linux 作为 KVM 宿主机使用 |\n\n**表 10-4**\
  \ Tuned 配置概览\n\n创建自定义配置相对容易。此外，当你安装特定的软件包时，可能会可能会添加新的配置。因此，你可能会发现服务器上存在一些额外的性能配置。\n\
  \n为了管理性能配置，提供了 `tuned-adm` 命令。它与 `tuned` 守护进程通信，因此在使用它之前，请运行 `systemctl enable --now\
  \ tuned` 来启动 `tuned` 配置。接下来，使用 `tuned-adm active` 查找当前选择了哪个配置。要查看服务器上可用配置的概览，输入\
  \ `tuned-adm list`。要选择另一个配置，输入 `tuned-adm profile profile-name`。`tuned` 服务还可以为你的系统推荐一个\
  \ `tuned` 配置：使用 `tuned-adm recommend`。在练习 10-4 中，你可以练习使用 `tuned`。\n\n### 总结\n\n\
  管理进程是 Linux 系统管理员的一项常见任务。在本章中，你学习了如何查找特定进程以及使用 `nice` 和 `kill` 更改它们的优先级。你还学习了如何使用\
  \ `tuned` 选择最符合你服务器工作负载的性能配置。\n\n### 考试准备任务\n\n如引言中“如何使用本本书”节所示，你有几种准备考试的选择：章末实验；附录\
  \ B 中的记忆表；第 27 章“最终准备”；以及模拟考试。\n\n### 复习所有关键主题\n\n复习章中最重要的主题，这些主题在页外边上用“关键主题”（Key\
