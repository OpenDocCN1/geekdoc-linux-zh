  6. 描述如何使用 `sed` 命令替换文件中的内容。\n\n### 第 5 章\n\n连接 Red Hat Enterprise Linux 8\n\n你已经学习了如何通过本地物理控制台访问系统。在本章中，你将学习如何通过远程连接访问\
  \ Red Hat Enterprise Linux 系统。你将学习使用 Secure Shell (SSH) 来安全地连接到远程系统，使用 `scp` 和 `sftp`\
  \ 在系统之间传输文件，以及使用 SSH 密钥对进行身份验证。\n\n### 什么是 SSH？\n\nSecure Shell (SSH) 是一种加密协议，允许用户在不安全的网络上安全地访问远程网络服务。SSH\
  \ 替代了不安全的远程登录程序如 telnet 和 rsh，因为它提供了加密和身份验证功能。\n\n### SSH 端口\n\nSSH 默认使用端口 22。出于安全考虑，有时管理员会更改默认端口以减少自动化攻击扫描。\n\
  \n### SSH 密钥对\n\nSSH 密钥对提供比密码更安全的身份验证方式。它由一对密钥组成：私钥和公钥。你将私钥保在本地上，并将公钥放在远程服务器上。当你连接时，服务器使用公钥向你挑战，你使用私钥进行响应。\n\
  \n### 生成 SSH 密钥对\n\n使用 `ssh-keygen` 命令生成 SSH 密钥对。\n\n```\nssh-keygen -t rsa -b 4096\n\
  ```\n\n此命令会生成两个文件位于 `~/.ssh/` 目录下：`id_rsa`（私钥，必须保密）和 `id_rsa.pub`（公钥）。\n\n### 传输公密钥到远程服务器\n\
  \n使用 `ssh-copy-id` 命令将你的公钥复制到远程服务器的 `~/.ssh/authorized_keys` 文件。\n\n```\nssh-copy-id\
  \ user@remotehost\n```\n\n### 使用 SSH 连接\n\n使用 `ssh` 命令连接到远程服务器：\n\n```\nssh user@remotehost\n\
  ```\n\n如果你已经配置了密钥对，你将无需输入密码即可登录。\n\n### SSH 配置文件\n\n为了简化连接，你可以使用 `~/.ssh/config`\
  \ 文件来定义 SSH 别名。\n\n```ssh\nHost myserver\n    HostName remotehost.com\n    User\
  \ username\n    Port 2222\n```\n\n配置后，你只需运行 `ssh myserver` 即可连接。\n\n### 使用 SCP 传输文件\n\
  \n`scp` 用于在本地和远程之间拷贝文件。\n\n```\nscp localfile user@remotehost:/path/to/destination/\n\
  ```\n\n从远程服务器下载文件：\n\n```\nscp user@remotehost:/path/to/remotefile /local/path\n\
  ```\n\n### 使用 SFTP\n\n`sftp` 是一个安全文件传输协议，提供了交互界面。\n\n```\nsftp user@remotehost\n\
  ```\n\n在 SFTP 会话中，你可以使用 `get`、`put`、`ls` 和 `rm` 等命令来管理文件。\n\n### SSH 隧道\n\nSSH 隧道允许你将本地端口转发到远程服务器。\n\
  \n```\nssh -L 8080:localhost:80 user@remotehost\n```\n\n这会将本地的 8080 端口转发到远程服务器的\
  \ 80 端口。\n\n### 练习题\n\n1. SSH 是什么？\n2. SSH 默认端口是多少？\n3. SSH 密钥对由哪两部分组成？\n4. 如何生成一个新的\
  \ RSA 密钥对？\n5. 如何将公钥传输到远程服务器？\n6. 如何使用 SSH 连接到远程主机？\n7. `ssh_config` 文件的作用是什么？\n\
  8. 如何使用 SCP 从远程服务器下载一个文件？\n9. 什么是 SFTP？\n10. 什么是 SSH 隧道？\n\n\n\n\n1. 使用 SSH 会话登录\n\
  2. 按 Alt-F2 打开一个新的非图形化登录界面\n3. 在搜索菜单中输入 `terminal` 并打开它\n4. 在非图形化控制台上输入您的用户名和密码\n\
  \n**6.** 有时为了完成某项任务，可能需要重启服务器。以下哪项通常*不是*这类情况之一？\n\n1. 从服务器挂起和内核崩溃（kernel panics）等严重问题中恢复\n\
  2. 应用内核更新\n3. 对当前正在使用的、因此无法重新加载的内核模块应用更改\n4. 对网络配置应用更改\n\n**7.** 关于从 Windows 环境远程访问\
  \ Linux 服务器，以下叙述中哪项是正确的？\n\n1. 在 Windows 上打开 shell 终端并输入 `ssh` 即可远程访问 Linux 服务器。`ssh`\
  \ 命令作为 Windows 操作系统的默认部分已可用。\n2. 如果你想访问运行 `sshd` 进程的 Linux 服务器，请在 Windows 上配置“远程访问”。\n\
  3. 在 Windows 上安装 PuTTY 程序，以便从 Windows 访问 Linux 上的 `sshd` 服务。\n4. 你无法从 Windows 远程访问\
  \ Linux 机器。\n\n**8.** 存储你过去连接过的 SSH 服务器公钥指纹的文件名称是什么？\n\n1. `/etc/ssh/remote_hosts`\n\
  2. `/etc/ssh/known_hosts`\n3. `~/.ssh/remote_hosts`\n4. `~/.ssh/known_hosts`\n\n\
  **9.** 为了允许通过 SSH 会话使用图形化应用程序，你可以在 `/etc/ssh/ssh_config` 文件设置一个参数。使用该参数使得在每次启动 SSH\
