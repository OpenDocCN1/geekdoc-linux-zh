  \n## 第 17 章\n\n管理和理解启动过程\n\n**本章涵盖以下主题：**\n\n* 管理 Systemd 目标\n* 使用 GRUB 2\n\n本章涵盖了以下\
  \ RHCSA 考试目标：\n\n* 配置系统自动启动到特定目标\n* 修改系统启动加载程序\n\n在本章中，你将学习 Red Hat Enterprise Linux\
  \ 上的启动过程是如何组织的。在章章的第一部分，你将学习 Systemd 目标以及你如何使用它们将你的 Linux 系统启动到特定状态。本章的第二部分讨论了 GRUB2\
  \ 以及如何对 GRUB 2 启动加载程序应用更改。故障排除不是本章的主题；它将在第 18 章 “基本故障排除技能](#ch18.xhtml_ch18)”中介绍。\n\
  \n### “我已经熟悉这些了吗？”测试\n\n“我已经熟悉这些了吗？”测试让你评估是应该仔细读完整个章节，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对这些主题知识的自我评估表示怀疑，请阅读整个章节。表\
  \ 17-1 列出了本章的主要标题及其对应的“我已经熟悉这些了吗？”测试题。你可以在附录 A “‘我已经熟悉这些了吗？测试和‘复习题’的答案](#appa.xhtml_appa)”找到答案。\n\
  \n| 基础主题章节 | 问题 |\n| --- | --- |\n| 使用 Systemd | 1–7 |\n| 使用 GRUB 2 | 8–10 |\n\n\
  **表 17-1** “我已经熟悉这些了吗？”章节与问题对应\n\n`1.` 下列哪项是定义目标的最高效方式？\n1. 使用 `systemctl`。\n2.\
  \ 在单元文件中定义目标。\n3. 在 `/usr/` 中创建符号链接。\n4. 在 `/etc/` 中。\n\n`2.` 哪个目标被认为是服务器正常的？\n\
  1. graphical.target\n2. server.target\n3. multi-user.target\n4. default.target\n\
  \n`3.` 下列哪项*不是*目标的示例？\n1. rescue.target\n2. restart.target\n3. multi-user.target\n\
  4. graphical.target\n\n`4.` 在哪里定义启用时启动的目标？\n1. 单元文件\n2. wants 目录\n3. `systemctl.conf`\
  \ 文件\n4. 单元文件的 `[Install]` 部分\n\n`5.` 为了允许目标被隔离，需要在单元文件中有一个特定的语句。下列哪项描述了它？\n1. AllowIsolate\n\
  2. Isolate\n3. SetIsolate\n4. Isolated\n\n`6.` 管理员想要将当前的 multi-user.target 改为 rescue.target。她应该如何做？\n\
  1. 使用 `systemctl isolate rescue.target`\n2. 使用 `systemctl start rescue.target`\n\
  3. 重启系统，并在 GRUB 提示符指定启动 rescue.target\n4. 使用 `systemctl enable rescue.target --now`\n\
  \n`7.` multi-user.target 对应于 System V 级别？\n1. 2\n2. 3\n3. 4\n4. 5\n\n`8.` 你应该在哪个文件中应用\
  \ GRUB2 配置更改？\n1. `/boot/grub/menu.lst`\n2. `/boot/grub2/grub.cfg`\n3. `/etc/sysconfig/grub`\n\
  4. `/etc/default/grub`\n\n`9.` 在应用 GRUB 2 配置后，你需要写入这些更改。下列哪个命令可以为你完成工作？\n1. `grub2\
  \ -o /boot/grub/grub.cfg`\n2. `grub2-mkconfig > /boot/grub2/grub.cfg`\n3. `grub2\
  \ > /boot/grub2/grub.cfg`\n4. `grub2-install > /boot/grub2/grub.cfg`\n\n`10.` 在\
  \ UEFI 系统上生成的 UEFI 配置文件名是什么？\n1. `/boot/efi/redhat/grub.cfg`\n2. `/boot/efi/EFI/redhat/grub.cfg`\n\
  3. `/boot/EFI/grub.cfg`\n4. `/boot/EFI/efi/grub.cfg`\n\n\n\n\n\nSystemd `target`（目标）本质上是一组相互关联的单元（units）。某些目标仅仅如此，别无他；而其他目标可以用于定义系统启动时的状态，因为这些目标具有普通目标不具备的一个特定属性：它们是可以被隔离的（isolatable）。可隔离目标包含了系统启动或更改当前状态所需的所有内容。启动过程中可以使用四种目标：\n\
  \n* `emergency.target`：在此目标中，仅启动极少数的单元，这些单元足以在出现严重问题时修复你的系统。你会发现它非常精简，因为一些重要的单元并没有启动。\n\
  * `rescue.target`：该目标启动运行完全正常的 Linux 系统所需的所有单元，但它不会启动非本质服务。\n* `multi-user.target`：该目标通常用作系统启动的默认目标。它启动完整系统功能所需的所有内容，通常用于服务器。\n\
  * `graphical.target`：该目标也常用。它启动完整功能所需的所有单元，以及图形化界面。\n\n### 操作目标\n\n操作目标似乎很复杂，但其实并非如此。它可以归纳为三个常见任务：\n\
  \n* 添加要自动启动的单元\n* 设置默认目标\n* 运行非默认目标进入故障排除模式\n\n在第 11 章中，你学习了如何使用 `systemctl enable`\
  \ 和 `systemctl disable` 命令向目标添加服务或从目标移除服务。在本章中，你将学习如何设置默认目标以及如何运行非默认目标进入故障排除模式。首先，让我们仔细观察目标的底层工作机制。\n\
  \n![](img/key_topic_icon.jpg)\n\n### 理解目标单元\n\n目标背后有一些配置。这些配置由两部分组成：\n\n* 目标单元文件（target\
  \ unit file）\n* “wants”目录，它包含了在进入特定目标时需要加载的所有单元文件的引用。\n\n目标本身可以对其他目标产生依赖关系，这些关系定义在目标单元文件中。示例\
  \ 17-1 展示了 `multi-user.target` 文件的定义，该文件定义了 RHEL 运行的正常运行状态。\n\n**示例 17-1** `multi-user.target`\
  \ 文件\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# systemctl cat multi-user.target\n\
  # /usr/lib/systemd/system/multi-user.target\n#  SPDX-License-Identifier: LGPL-2.1+\n\
  #\n#  此文件是 systemd 的一部分。\n#\n#  systemd 是自由软件；你可以根据 GNU 语言许可通用公共许可证\n#  （Lesser\
  \ General Public License）的条款分发和/或修改它，\n#  由自由软件基金会发布；许可证的 2.1 版本，\n#  或者\n#  （根据你的选择）任何更高版本。\n\
  \n[Unit]\nDescription=Multi-User System\nDocumentation=man:systemd.special(7)\n\
  Requires=basic.target\nConflicts=rescue.service rescue.target\nAfter=basic.target\
  \ rescue.service rescue.target\nAllowIsolate=yes\n```\n\n你可以看到，目标单元本身并不包含很多内容。它仅仅定义了它需要什么，以及哪些服务和目标不能与之共存。它还通过使用\
  \ `[Unit]` 部分中的 `After` 语句定义了加载顺序。目标文件并不包含任何应包含的单元信息；这些信息在单独的单元文件以及 wants 中（在接下来的“理解\
  \ Wants”部分中解释）。\n\nSystemd 目标看起来有点像 RHEL 旧版本中使用的级别（runlevels），但目标不仅于此。目标是一个单元组，并且存在多个不同的目标。某些目标（例如\
  \ `multi-user.target` 和 `graphical.target`）定义了系统需要进入的特定状态。其他目标只是将一组单元，例如 `nfs.target`\
  \ 和 `printer.target`。这些目标被其他目标（如 `multi-user.target` 或 `graphical.target`）包含。\n\n\
  ### 理解 Wants\n\n理解 `want` 的概念只需要理解英语中的动词 `want`，就像“I want a cookie”（我想要饼饼干）。Systemd\
  \ 中的 `wants` 定义了在启动特定目标时 Systemd 想要哪些单元。当使用 `systemctl enable` 启用 Systemd 单元时会创建\
  \ `want`，这是通过在 `/etc/systemd/system` 目录中创建一个符号链接来实现。在该目录中，你会为每个目标找到一个子目录，其中包含指向要启动的特定服务的符号链接（wants）。\n\
  \n![](img/key_topic_icon.jpg)\n\n### 管理 Systemd 目标\n\n作为管理员，你需要确保在服务器启动时启动所需的的服务。要做到这一点，请使用\
  \ `systemctl enable` 和 `systemctl disable` 命令。你不需要考虑服务必须在哪个特定目标中启动。通过服务单元文件的 `[Install]`\
  \ 部分，服务会自己知道需要在哪些目标中启动，并且当服务被启用时，该目标会自动创建一个 `want`。以下步骤将引导你完成启用服务的步骤：\n\n1. 输入 `yum\
  \ install -y vsftpd`，然后输入 `systemctl status vsftpd`。如果服务尚未启用，`Loaded` 行将显示它目前处于禁用状态（disabled）：\n\
  \n    点击此处查看代码图像\n\n```\n[root@server20 ~]# systemctl status vsftpd\n    vsftpd.service\
  \ - Vsftpd ftp daemon\n        Loaded: loaded (/usr/lib/systemd/system/vsftpd.service;\
  \ disabled)\n        Active: inactive (dead)\n```\n\n2. 输入 `ls /etc/systemd/system/multi-user.target.wants`。你会看到负责启动你机器上不同服务的符号链接。你也可以看到\
  \ `vsftpd.service` 链接并不。\n\n3. 输入 `systemctl enable vsftpd`。该命令显示它正在为 `/usr/lib/systemd/system/vsftpd.service`\
  \ 文件在 `/etc/systemd/system/multi-user.target.wants` 目录中创建一个符号链接。所以基本上，当你启用一个 Systemd\
  \ 单元文件时，后台会创建一个符号链接。\n\n提示\n\n在 RHCSA 考试中，你可能需要配置几个服务。做法是阅读考试题，识别需要启用的服务，并一次性启用它们，以确保它们在重启时会自动启动。这可以防止你因专注于配置服务而完全忘记启用它。\n\
  \n### 隔离目标\n\n正如前面提到的，在 Systemd 机器上有很多个目标。你也知道目标是单元的集合。其中某些目标具有特殊角色，因为它们是可以隔离的。这些也是你可以设置的系统启动后进入的目标。\n\
  \n通过隔离目标，你会启动该目标及其所有的依赖项。只有启用了 `isolate` 选项的目标才能被隔离。我们将在本节稍后探讨 `systemctl isolate`\
  \ 命令。在在此之前，让我们查看你计算机上的默认目标。\n\n要获取当前加载的目标列表，输入 `systemctl --type=target`。你会看到所有当前激活的目标列表。如果你的服务器运行图形界面环境，这将包括安装\
  \ `graphical.target` 所需的所有依赖。然而，此列表仅显示激活的目标，而不是所有目标。输入 `systemctl --type=target\
  \ --all` 以获取你计算机上存在的所有目标的概述。你现在可以看到未激活的目标了（参见示例 17-2）。\n\n**示例 17-2** 显示系统目标\n\n\
  点击此处查看代码图像\n\n\n\n\n\n```\nroot@localhost ~]# systemctl --type=target --all\n  UNIT\
