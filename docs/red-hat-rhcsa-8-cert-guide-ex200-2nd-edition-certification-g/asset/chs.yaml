  4. `:wq`\n\n**10.** 哪个命令允许你查看当前的 at 作？\n\n1. `atrm`\n2. `atlas`\n3. `atq`\n4. `at`\n\
  \n### 基础主题\n\n### 配置 cron 自动执行循环任务\n\n你现在已经学习了如何使用 Systemd。在继续之前，做一个实验是一个好主意，有助于确保你能够应用在本章中获得的技能。\n\
  \n#### 实验 11.1\n\n1. 安装 `vsfd` 和 `httpd` 服务。\n\n2. 将默认 `systemctl` 编辑器设置为 `vim`。\n\
  \n3. 编辑 `httpd.service` unit 文件，使得启动 `httpd` 时将始终自动启动 `vsftpd`。编辑 `httpd` 服务，使其在失败后\
  \ 10 秒内自动重新启动。\n\n#### 管理 crond 服务\n\n在 Linux 服务器上，让某些任务在特定时间运行非常重要。这可以通过使用 `at`\
  \ 和 `cron` 服务来实现，这些服务可以配置为运行未来的任务。`at` 服务用于仅执行一次未来的任务，而 `cron` 服务用于定期循环的常规任务。在本章中，你将学习如何配置这两者。\n\
  \n注意\n\n在 RHEL 8 中，也可以使用 Systemd timer 来调度任务。但是，由于 Systemd timer 未包含在 RHCSA 目标中，因此本章未涵盖它们。\n\
  \ncron 服务由两个主要部分组成。首先是 cron 守护进程 `crond`。该守护进程每分钟检查一次是否有工作要做。其次，这些工作定义在 cron 配置中，它由多个协作的文件组成，在正确的时间为正确的服务提供正确的信息。在本节中，你将学习如何配置\
  \ cron。\n\n#### 管理 cron 服务\n\n`crond` 服务在每个 RHEL 系统上默认启动。需要该服务是因为某些系统任务通过 `crond`\
  \ 运行。其中一个例子是 `logrotate`，这是一个清理日志文件并定期运行的服务，但其他重要的维护过程也会通过 cron 自动启动。\n\n\n\n\n\
  管理 `crond` 服务本身非常简单：它不需要大量的管理。其他服务在更改配置生效时可能需要重新加载或重启，但 `crond` 不需要。`crond` 守护进程每分钟唤醒一次，并检查其配置以查看是否有需要启动的任务。\n\
  \n要监控 cron 服务的当前状态，可以使用 `systemctl status crond -l` 命令。示例 12-1 显示了该命令的输出。\n\n###示例\
  \ 12-1 监控 crond 服务的当前状态\n\n点击此处查看代码图片\n\n```\n[root@server1 ~]# systemctl status\
  \ crond -l\n   crond.service - Command Scheduler\n   Loaded: loaded (/usr/lib/systemd/system/crond.service;\
  \ enabled;\n             vendor preset: enabled)\n   Active: active (running) since\
  \ Sat 2019-06-08 03:34:57 EDT;\n             28min ago\n Main PID: 1101 (crond)\n\
  \    Tasks: 2 (limit: 11363)\n   Memory: 2.3M\n   CGroup: /system.slice/crond.service\n\
  \           ├–1101 /usr/sbin/crond -n\n           └–3600 /usr/sbin/anacron -s\n\n\
  Jun 08 03:34:57 server1.example.com crond[1101]: (CRON) STARTUP\n  (1.5.2)\nJun\
  \ 08 03:34:57 server1.example.com crond[1101]: (CRON) INFO (Syslog\n  will be used\
  \ instead of sendmail>\nJun 08 03:34:57 server1.example.com crond[1101]: (CRON)\
  \ INFO (RANDOM_\n  DELAY will be scaled with factor>\nJun 08 03:34:58 server1.example.com\
  \ crond[1101]: (CRON) INFO (running\n  with inotify support)\nJun 08 04:01:01 server1.example.com\
  \ CROND[3591]: (root) CMD (run-parts\n  /etc/cron.hourly)\nJun 08 04:01:01 server1.example.com\
  \ anacron[3600]: Anacron started on\n  2019-06-08\nJun 08 04:01:01 server1.example.com\
  \ anacron[3600]: Will run job \n  'cron.daily' in 33 min.\nJun 08 04:01:01 server1.example.com\
  \ anacron[3600]: Will run job \n  'cron.weekly' in 53 min.\nJun 08 04:01:01 server1.example.com\
  \ anacron[3600]: Will run job \n  'cron.monthly' in 73 min.\nJun 08 04:01:01 server1.example.com\
  \ anacron[3600]: Jobs will be\n  executed sequentially\n```\n\n`systemctl status\
  \ crond` 命令输出中最重要的部分在开头，它表示 cron 服务已加载并启用。服务已启用（enabled）意味着每当该服务重启时，它将自动启动。命令输出的最后部分显示了当前状态信息。通过\
  \ journald 服务，`systemctl` 命令可以发现 `crond` 服务实际发生的情况。\n\n### 理解 cron 定时\n\n通过 cron\
  \ 调度服务时，你需要精确指定服务需要启动的准确时间。在 crontab 配置中（下一节将进行详细解释），你使用时间字符串来指示任务应何时启动。表 12-2 显示了所使用的时间和日期字段（按指定顺序）。\n\
  \n| 字段 | 值 |\n| --- | --- |\n| minute | 0–59 |\n| hour | 0–23 |\n| day of month\
  \ | 1–31 |\n| month | 1–12（或尽量使用的名称） |\n| day of week | 0–7（星期日为 0 或 7，或尽量避免使用的名称）\
  \ |\n\n**表 12-2** cron 时间和日期字段\n\n在这些任何字段中，你可以使用 `*` 作为通配符来引用任何值。允许使用数字范围、列表和模式。下面列出了一些示例：\n\
  \n*   `11 * * *` 在 11:00 到 11:59 之间的每分钟（这可能不是你想要的）\n*   `0 11 * * 1-5` 仅在工作日的上午\
  \ 11 点执行\n*   `0 7-18 * * 1-5` 在工作日的上午 7 点到下午 6 点之间的每小时整点执行\n*   `0 */2 2 12 5`\
  \ 在 12 月 2 日以及 12 月的每个周五每两小时整点执行\n\n提示：你不需要记住所有这些；`man 5 crontab` 显示了所有可能的构造。\n\n\
  ### 管理 cron 配置\n\ncron 的主配置文件是 `/etc/crontab`，但你不会直接修改此文件。不过，它确实让你方便概述了 cron 中可以使用的不同时间规范。它还设置了通过\
  \ cron 执行的命令所使用的环境变量（参见示例 12-2）。要修改 cron 任务，还有其他可以指定 cron 任务的地方。\n\n**示例 12-2**\
  \ `/etc/crontab` 示例\n\n点击此处查看代码图片\n\n```\n[root@server2 ~]# cat /etc/crontab\nSHELL=/bin/bash\n\
  PATH=/sbin:/bin:/usr/sbin:/usr/bin\nMAILTO=root\n\n# 详情见 man 4 crontabs\n\n# 任务示例\n\
  # -------------------------------------------------------------------\n# minute\
  \  hour  dom  mon  dow  user  command\n# *       *     *     *    *    root  /usr/bin/example\n\
  ``` -------------------------------------------------------------------\n\n调度 cron\
  \ 任务的最后方法是通过以下目录：\n\n*   /etc/cron.hourly\n\n*   /etc/cron.daily\n\n*   /etc/cron.weekly\n\
  \n*   /etc/cron.monthly\n\n\n\n\n\n在这些目录中，你通常会找到从 RPM 软件包文件中放入的脚本（注意：这些不是符合 crontab\
  \ 语法要求的文件）。当打开这些脚本时，请注意其中没有包含任何关于命令执行时间的信息。这是因为执行的确切时间实际上并不重要。唯一重要的是作业每小时、每天、每周或每月启动一次。\n\
  \n## 了解 anacron 的用途\n\n为了确保作业的定期执行，cron 使用了 `anacron` 服务。该服务负责启动每小时、每天、每周和每月的 cron\
  \ 任务，无论具体在什么时间。为了确定如何执行此操作，anacron 使用 `/etc/anacrontab` 文件。示例 12-4 显示了 `/etc/anacrontab`\
  \ 文件的内容，该文件用于指定如何执行 anacron 任务。\n\n**示例 12-4** anacabab 配置\n\n点击此处查看代码图像\n\n```\n\
  [root@server1 spool]# cat /etc/anacrontab\n# /etc/anacrontab: anacron 配置文件\n\n#\
  \ 参见 anacron(8) 和 anacrontab(5) 获取详细信息。\n\nSHELL=/bin/sh\nPATH=/sbin:/bin:/usr/sbin:/usr/bin\n\
  MAILTO=root\n# 在作业基础延迟基础上的最大随机延迟\nRANDOM_DELAY=45\n# 任务仅在以下时间段内启动\nSTART_HOURS_RANGE=3-22\n\
  \n#周期（天）  延迟（分钟）作业标识符  命令\n1        5  cron.daily            nice run-parts  /etc/cron.daily\n\
  7        25 cron.weekly           nice run-parts  /etc/cron.weekly\n@monthly 45\
  \ cron.monthly          nice run-parts  /etc/cron.monthly\n```\n\n在 `/etc/anacrontab`\
  \ 中，要执行的作业位于包含四个字段的行中，如 示例 12-4 所示。第一个字段指定作业执行的频率，以天为单位。第二个字段指定 anacron 在执行作业之前等待多长时间，随后是包含作业标识符的第三个字段。第四个字段指定应执行的命令。\n\
  \n**提示**\n\n虽然了解 anacron 如何工作很有用，但它通常不是一个直接配置的服务。通过 anacron 配置服务的需求已被 `/etc/cron.hourly`、`cron.daily`、`cron.weekly`\
  \ 和 `cron.monthly` 文件取代了。\n\n**注意**\n\n要概览实际调度执行的 cron 任务并不容易。没有单一的命令可以显示所有当前已调度的\
  \ cron 任务。`crontab -l` 命令确实列出了 cron 任务，但仅针对当前用户账户。\n\n## 管理 cron 安全性\n\n默认情况下，所有用户都可以输入\
  \ cron 任务。可以使用 `/etc/cron.allow` 和 `/etc/cron.deny` 配置文件限制哪些用户允许调度 cron 任务。如果 `cron.allow`\
  \ 文件存在，则用户必须列在其中才能使用 cron。如果 `/etc/cron.deny` 文件存在，则用户不能列在其中才能设置 cron 任务。这两个文件不应同时存在于同一个系统上。如果两个文件都不存在，只有\
  \ root 可以使用 cron。\n\n在 练习 12-1 中，你将应用一些 cron 基础并使用不同的机制调度 cron 任务。\n\n## 配置 at 以调度未来任务\n\
  \n虽然 cron 用于调度需要定期执行的作业，但 `atd` 服务则适用于只需要执行一次的服务。在 RHEL 8 上，默认提供了 `atd` 服务，因此所有所需要做的就是调度作业。\n\
  \n要通过 `atd` 服务运行作业，你需要使用 `at` 命令，随后是作业需要执行的时间。这可以是一个特定的时间，例如 `at 14:00`，但也可以是类似的时间指示，如\
  \ `at teatime` 或 `at noon`。在你输入这些内容后，`at` shell 就会打开。从该 shell 中，你可以输入好几条命令，这些命令将在提到的特定时间执行。输入命令后，按\
  \ Ctrl-D 退出 `at` shell。\n\n在用 `at` 调度作业后，你可以使用 `atq` 命令（*q* 代表 *queue* 队列）获取所有当前调度作业的概览。也可以删除当前的\
  \ at 任务。要这样做，请使用 `atrm` 命令，可选地跟接你想要删除的 at 任务编号。在 练习 12-2 中，你将学习如何使用 `at` 来调度作业在特定时间执行。\n\
  \n**提示**\n\n`batch` 命令的作用与 `at` 类似，但稍微复杂一些。使用 `batch` 时，你可以指定仅当系统性能参数允许时才启动作业。通常是当系统负载低于\
  \ 0.8 时。此值在现代多 CPU 系统上有点低，这就是为什么在启动 `atd` 时，可以使用 `-l` 命令行选项手动指定负载值。例如，使用 `atd -l\
  \ 3.0`。\n\n### 总结\n\n在本章，你学习了如何调度未来执行的作业。你还学习了如何配置 cron 重复执行。此外，你了解了 anacron 服务，它用于确保即使在系统未运行期间，`cron.hourly`、`daily`、`weekly`\
  \ 和 `monthly` 中的任务也能被执行。在章节结束时，你学习了如何使用 `at` 服务来调度执行一次的任务。\n\n### 考试准备任务\n\n正如如何使用本书部分提到的，你有几种考试准备选择：章节末实验；附录\
