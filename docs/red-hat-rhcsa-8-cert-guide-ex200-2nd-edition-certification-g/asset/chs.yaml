  \ 为用户 开启留留功能。\n* 使用 `systemctl enable-linger anna` 为用户 开启留留功能。\n* 只使用 `systemctl\
  \ --user enable` 启用容器。\n\n### 基础主题\n\n### 理解容器\n\n在过去的十年中，容器彻底改变了服务的提供方式。不久以前还通过安装物理或虚拟机服务器来提供应用程序访问，而现在通常通过使用容器来实现。但容器到底是什么？让我们从一个简单的概念描述开始：容器只是运行应用程序的一种高级方式。\n\
  \n在服务器上安装应用程序，服务器管理员必须确保不仅安装了应用程序，还安装了应用程序所需的所有其他软件依赖。这包括底层操作系统的正确（支持）版本。容器是一个运行在容器引擎之上的完整包，它是主机操作系统的集成部分。你可以将其与智能手机上的应用程序进行比较：从手机的应用商店获取完整的应用程序包，并从那里安装到手机上。\n\
  \n\n\n\n\n要使用容器，您需要从容器镜像运行容器。这种容器镜像位于容器注册表（container registry）中，它可以类比为托管智能手机应用程序的\
  \ App Store。其结果就是容器，它实际上是容器镜像的可运行实例。\n\n要运行容器，您需要一个包含容器引擎的宿主机操作系统，以及一些用于管理容器的工具。在\
  \ RHEL 的之前的版本中，这些功能是由 `Docker` 支持的。`Docker` 提供了容器引擎以及管理容器的工具。在 RHEL 8 中，红帽公司（Red\
  \ Hat）已用一套新的解决方案取代了 `Docker`：`CRI-o` 是容器引擎，而红帽公司提供了三项主要的工具来管理容器：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   `podman`：核心/主工具，用于启动、停止和管理容器\n*   `buildah`：帮助您创建自定义镜像的专用工具\n*   `skopeo`：用于管理和测试容器镜像的工具\n\
  \n## 容器宿主机要求\n\n有时说容器就是 Linux，这确实如此。容器高度依赖 Linux 内核提供的功能。这些功能包括：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   用于进程隔离的命名空间（Namespaces）\n*   用于资源管理的控制组（Control groups）\n*   用于安全的 `SELinux`\n\
  \n让我们探索这些每一个功能。首先，容器需要命名空间。命名空间为系统资源提供了隔离。为了最好理解命名空间，让我们看看 `chroot` 监狱，这是 20 世纪\
  \ 90 代引入的功能。`chroot` 监狱是一种安全功能，它将目录的内容呈现得 마치系统的根目录。`chroot` 监狱对于安全至关重要。当一个进程被限制在\
  \ `chroot` 监狱的内容内时，没有任何访问操作系统其他部分的风险。\n\n`chroot` 监狱仍然存在，但其功能现在被利用，并成为存储命名空间（storage\
  \ namespace）的一部分。以下是其他命名空间的概述。请注意，未来可能会添加新的命名空间。\n\n*   `Mount`（挂载）：挂载命名空间等于 `chroot`\
  \ 命名空间。目录的内容呈现使得无法访问其他目录。\n*   `Process`（进程）：进程命名空间确保运行在此命名空间中的进程无法访问或连接到其他命名空间中的进程。\n\
  *   `Network`（网络）：网络命名空间可以类比为 `VLAN`。连接到特定网络命名空间的节点看不到其他网络命名空间发生的情况，且只有通过路由器才能与其他命名空间通信。\n\
  *   `User`（用户）：用户命名空间可以用于分离空间之间的用户 ID（UID）和组 ID（GID）。结果是用户账户特定于每个命名空间，在一个命名空间中可用户在另一个命名空间中可能无效。\n\
  *   `Interprocess communication (ipc)`（进程间通信）：进程用于相互连接的方式，这些命名空间确保只能与同一命名空间中的进程建立连接。\n\
  \n运行容器的第二个重要要求是控制组，或 `cgroup`。`Cgroups` 是一种内核功能，能够限制资源访问。默认情况下，进程可以访问的内存量或 CPU 周期数量没有限制。`Cgroups`\
  \ 允许创建限制，使得每个容器对可用资源的访问受到严格限制。\n\n容器的最后一个重要支柱由 `SELinux` 实现。\n\n## RHEL 8 容器\n\n\
  自 2014 年发布以来，`Docker` 一直是领先的解决方案。随着 RHEL 8 的推出，红帽决定停止使用 `Docker` 并提供自己的技术栈，该栈基于\
  \ `CRI-o` 并使用 `podman` 作为主工具。使用 `podman` 的一个重要优势是无根容器（rootless containers）。在 RHEL\
  \ 8 上，无根容器不需要需要 root 权限的守护进程，并且可以绑定到非特权端口。这使得运行容器变得安全得多，但也带来了一些挑战。例如，如果无根容器需要访问基于主机的存储，用户必须是该目录的所有者。\n\
  \n## 容器编排\n\n本章讨论的运行容器解决方案都是关于在单个宿主机上运行独立容器的。如果该宿主机宕机，您将不再拥有任何容器。当使用容器运行执行关键任务的服务时，需要额外的功能。这些功能包括：\n\
  \n*   轻松连接到各种外部存储\n*   对敏感数据的安全访问\n*   解耦，使得特定站点的数据与容器内部的代码严格分离\n*   可扩展性，例如当工作负载增加时，可以添加额外的实例\n\
  *   可用性，确保容器主机的故障不会导致容器不可用\n\n为了实现这些功能，`Kubernetes` 已发展成为行业标准。`Kubernetes` 是开源的，目前它是为容器添加企业级功能唯一关键的解决方案。红帽公司有自己的\
  \ Kubernetes 发行版，称为 `OpenShift`。为了构建基于容器的可扩展、灵活且可靠的基础设施，您应该研究 `Kubernetes` 或 `OpenShift`\
  \ 提供的选项。这些主题在 RHCSA 考试的范围之外，因此不再进行进一步讨论。\n\n### 运行容器\n\n为了熟悉容器，让我们从运行一些容器开始。为了获得访问\
  \ RHEL 8 为运行容器提供的所有工具的完全权限，您应该从安装适当的软件开始。您可以使用 `sudo yum module install container-tools`\
  \ 来执行此操作。安装此软件后，您可以使用 `podman run` 开始运行您的第一个容器，这不需要任何 root 权限。您可以使用带有许多参数的此命令；然而，真正需要的参数是您想要运行的镜像名称。正如我们稍后讨论的，镜像是从容器注册表中获取的。要运行您的第一个容器，请使用命令\
  \ `podman run nginx`。您可以在示例 26-1 中看到运行此命令的结果。\n\n```\npodman run nginx\n```\n\n\n\
  \n\n\n```\n[student@podman ~]$ podman run nginx\nTrying to pull registry.access.redhat.com/nginx...\n\
  \  unsupported: This repo requires terms acceptance and is only\navailable on registry.redhat.io\n\
  Trying to pull registry.redhat.io/nginx...\n  unable to retrieve auth token: invalid\
  \ username/password:\nunauthorized: Please login to the Red Hat Registry using your\
  \ Customer\nPortal credentials. Further instructions can be found here:\nhttps://access.redhat.com/RegistryAuthentication\n\
  Trying to pull docker.io/library/nginx...\nGetting image source signatures\nCopying\
  \ blob d15953c0e0f8 done\nCopying blob 655316c160af done\nCopying blob ebd81fc8c071\
