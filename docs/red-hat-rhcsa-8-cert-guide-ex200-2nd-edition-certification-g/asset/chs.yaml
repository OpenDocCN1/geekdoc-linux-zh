  \ Apache Web 服务器基础知识的原因。\n\n### “我掌握这些了吗？”测验\n\n“我掌握这些了吗？”测验可以让你评估自己是应该彻底阅读整个章节，还是应该直接跳到“考试准备任务”部分。如果你对这些问题的答案或对自己在这些主题上的知识的评估有疑问，请阅读整个章节。表格\
