  \       [    --profile String ]\n        [    --version ]\n\n  Use --longhelp to\
  \ show all options and advanced commands.\n```\n\n#### 创建物理卷\n\n在使用 LVM 工具创建物理卷之前，你需要创建一个被标记为\
  \ LVM 分区类型的分区。这基本上与 第 14 章 中描述的步骤相同，唯一的区别在于是在向磁盘写入更改之前，你需要先更改分区类型。\n\n在 `fdisk`\
  \ 和 `gdisk` 中，你可以使用菜单中的 `t` 来更改类型。如果你使用 MBR 磁盘，分区类型为 `8e`。如果你使用 GUID 磁盘，请使用分区类型\
  \ `8e00`。如果你使用 `parted` 创建分区，你需要在 `parted` 界面内部使用 `set n lvm on` 命令（其中 `n` 是你想要标记供\
  \ LVM 使用的分区编号）。\n\n在创建分区并将其标记为 LVM 分区类型后，你需要使用 `pvcreate` 将其标记为物理卷。这会在分区上写入一些元数据，允许将其用于卷组。整个过程在\
  \ 练习 15-1 中进行了总结，在该练习中你创建一个物理卷。另请 示例 15-2 关于此过程的概述。\n\n### 示例 15-1 `pvcreate` 命令请求帮助\n\
