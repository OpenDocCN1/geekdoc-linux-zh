  \ 保留十个旧日志文件。\n\n# 第 14 章：管理存储\n\n**本章涵盖了以下主题：**\n\n* 理解 MBR 和 GPT 分区\n* 管理分区和文件系统\n\
  * 挂载文件系统\n\n本章涵盖了以下 RHCSA 考试目标：\n\n* 在 MBR 和 GPT 磁盘上列出、创建和删除分区\n* 配置系统通过通用标识符（UUID）或标签启动时挂载文件系统\n\
