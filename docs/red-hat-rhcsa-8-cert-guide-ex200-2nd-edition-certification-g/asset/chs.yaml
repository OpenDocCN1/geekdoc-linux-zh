  \n\n\n\n3. 配置您的系统，自动将安装磁盘的 ISO 循环挂载到 `/repo` 目录。配置您的系统，将此循环挂载的 ISO 作为安装使用的唯一存储库。*不要*使用\
  \ `subscription-manager` 注册您的系统，并移除所有可能存在的外部存储库引用。\n\n4. 在您的第二个硬盘上创建一个 500-MiB 分区，并使用\
  \ `Ext4` 文件系统对其进行格式化。使用标签 `mydata` 将其持久地挂载到目录 `/mydata`。\n\n5. 为新用户设置默认值。用户应在当前密码过期前三天收到警告。此外，新密码的最大生存期应为\
  \ 120 天。\n\n6. 创建用户 `edwin` 和 `santos`，并将它们作为 `livingopensource` 组的次级组成员。同时，创建用户\
  \ `serene` 和 `alex`，并将它们作为 `operations` 组的次级成员。\n\n7. 创建共享组目录 `/groups/livingopensource`\
  \ 和 `/groups/operations`，并确保这些组满足以下要求：\n    * `livingopensource` 组的成员对其目录具有完全访问权限。\n\
  \    * `operations` 组的成员对其目录具有完全访问权限。\n    * 其他人对任何目录均无访问权限。\n    * `alex` 是经理，因此用户\
  \ `alex` 对两个目录中的所有文件具有读取权限，并允许删除两个目录中创建的所有文件。\n\n8. 创建一个 1-GiB 的交换分区并将其持久挂载。\n\n\
  9. 找到所有设置了 `SUID` 权限的文件，并将结果写入文件 `/root/suidfiles`。\n\n10. 创建一个 1-GiB 的 `LVM` 卷组。在此卷组中，创建一个\
  \ 512-MiB 的交换卷并将其持久挂载。\n\n11. 为您的虚拟机添加一个 10-GiB 的磁盘。在该磁盘上创建一个 `Stratis` 池和卷。使用名称\
  \ `stratisvol` 作为卷，并将其持久地挂载到目录 `/stratis`。\n\n12. 安装一个 Web 服务器并配置其监听 8080 端口。\n\n\
  13. 创建一个配置，允许用户 `edwin` 使用 `sudo` 运行所有管理命令。\n\n## 附录 B\n\n### 内存表\n\n#### 第 2 章\n\
