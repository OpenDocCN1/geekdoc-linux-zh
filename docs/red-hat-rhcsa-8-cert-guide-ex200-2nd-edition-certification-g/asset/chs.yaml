  \n1. `network`\n2. `_netdev`\n3. `_network`\n4. `netdev`\n\n 基础主题\n\n### 理解 MBR\
  \ 和 GPT 分区\n\n要使用硬盘，需要分区。某些操作系统将所有内容安装在一个分区中，而 Linux 等操作系统通常在同一块硬盘上有多个分区。使用多个分区是有几个原因的：\n\
  \n* 更容易区分不同类型的数据。\n* 可以使用特定的挂载选项来增强安全性能。\n* 更容易创建备份策略，仅备份操作的相关部分。\n* 如果一个分区意外满了，其他分区仍然可用，你的系统可能不会崩溃。\n\
  \n### 注意\n除了使用多个分区，你还可以使用不同的逻辑卷。逻辑卷将在第 15 章“管理高级存储(ch15.xhtml_ch15)”中介绍。\n\n在 RHEL\
  \ 8 中有两种不同的分区方案。在创建第一个分区之前，你应该理解这些方案并能够确定哪种最适用于特定环境。\n\n#### 理解 MBR 分区方案\n\n当个人电脑在\
  \ 80 世纪初发明时，需要一种系统来定义硬盘布局。该系统被称为主引导记录（MBR）分区方案。在计算机启动时，会加载基本输入输出系统（BIOS）来访问硬件。通过\
  \ BIOS 读取可启动磁盘设备，并在该可启动设备上分配 MBR。MBR 包含了启动计算机的所有内容，包括引导加载程序和分区表。\n\n当硬盘在 80 世纪初首次出现时，用户可以在它们上运行不同的操作系统。这些操作系统包括\
  \ MS-DOS/PC-DOS、PC/IX（IBM 为 8086 开发的 UNIX）、CPM86 和 MPM86。硬盘会被分区，每个操作系统获得磁盘的一部分。其中一个分区会被设置为活动，这意味着\
  \ MBR 引导区中的代码将读取该活动分区的第一个扇区并运行代码。该代码随后加载操作系统的其余部分。这解释了为什么四个分区就被认为是“足够了”。\n\n\n\n\
  \n\nMBR 被定义为计算机硬盘上的前 512 字节。在 MBR 中，存在一个操作系统引导加载程序（例如 `GRUB 2`；参见第 17 章，“管理和理解启动过程](#ch17.xhtml_ch17)”）以及一个分区表。分区表使用的空间较小，仅为\
  \ 64 字节，导致 MBR 中最多只能创建四个分区。由于分区大小数据存储在 32 位值中，并且使用了 512 字节的默认扇区大小，分区使用的最大空间限制为 2\
  \ TiB（这在 20 世纪 80 年代几乎不是问题）。\n\n在 MBR 中，只能创建四个分区。由于许多 PC 操作系统需要四个以上的分区，因此找到了一种突破四个数量限制的解决方案。在\
  \ MBR 中，可以创建一个分区作为扩展分区，这与其他创建的主分区（primary partitions）不同。在扩展分区内部，可以创建多个逻辑分区，从而使 Linux\
  \ 内核能够寻址的总共 15 个分区。\n\n### 理解 GPT 分区的必要性\n\n目前的计算机硬盘已经变得太大，无法通过 MBR 分区寻址。这就是为什么需要新的分区方案的主要原因。这种分区方案就是\
  \ GUID 分区表（GPT）。在使用新的统一可扩展固件接口（UEFI）替代旧 BIOS 系统的计算机上，GPT 分区是寻址磁盘的唯一方法。此外，使用 BIOS\
  \ 而非 UEFI 的旧计算机系统也可以配置 GUID 分区，如果需要寻址大小大于 2 TiB 的磁盘，这是必要的。\n\n使用 GUID 有许多优势：\n\n\
  * 最大分区大小为 8 泽兆字节（ZiB），即 1024 × 1024 × 1024 × 1024 吉兆字节（GiB）。\n* 在 GPT 中，最多可以创建 128\
  \ 个分区。\n* 2-TiB 的限制不再存在。\n* 因为存储分区的可用空间远大于 MBR 使用的 64 字节，因此不再需要区分主分区、扩展分区逻辑分区。\n\
  * GPT 使用 128 位的全局唯一标识（GUID）来识别分区。\n* 默认在磁盘末尾创建 GUID 分区表的备份副本，这消除了 MBR 分区表中存在的单点故障。\n\
  \n### 理解存储测量单位\n\n在谈论存储时，我们使用不同的测量单位。在某些情况下，使用如兆字节（MB）之类的单位。在其他情况下，使用如迈兆字节（MiB）之类的单位。两者之间的区别是，兆字节是\
  \ 1,000 的倍数，而迈兆字节是 1,024 的倍数。在计算机中，讨论 1,024 的倍数是有意义的因为那是计算机寻址项目的方式。然而，很久以前硬件厂商开始将迈兆字节称为兆字节，这造成了混淆。\n\
  \n在计算的早期，这种差异并不重要。千字节（KB）和基千字节（KiB）之间的差异仅为 24 字节。数字增长得，差异就越大。例如，千兆字节（GB）是 1,000\
  \ × 1,000 × 1,000 字节，即 1,000,000,000 字节；而吉兆字节（GiB）是 1,024 × 1,024 × 1,024 字节，总计\
  \ 1,073,741,824 字节，比 1 GB 多了 70 MB。\n\n在当前的 Linux 发行版中，二进制数字（MiB，而非 MB）已成为标准——但要注意某些工具仍然以\
  \ MB 而非 MiB 进行测量。在表 14-2 中，你可以看到所用值的概述。\n\n在过去，KB、MB 等被同时用于十进制和二进制情况；有时它们甚至被混合使用。例如，1-Mbps\
  \ 的线路速度是每秒一百万位。曾经著名的“1.44 MB”软磁盘实际大小为 1,440,000 字节（80 道 × 2 磁头 × 9 扇区 × 512 字节扇区），产生了\
  \ MB 的混合含义：1.44 × (十进制 K) × (二进制 K)。\n\n![](img/key_topic_icon.jpg)\n\n| 符号 | 名称\
  \ | 数值 | 符号 | 名称 | 数值 |\n| --- | --- | --- | --- | --- | --- |\n| KB | 千字节 | 1000¹\
  \ | KiB | 基千字节 | 1024¹ |\n| MB | 兆字节 | 1000² | MiB | 迈兆字节 | 1024² |\n| GB | 千兆字节\
  \ | 1000³ | GiB | 吉兆字节 | 1024³ |\n| TB | 太兆字节 | 1000⁴ | TiB | 基太兆字节 | 1024⁴ |\n\
  | PB | 拍字节 | 1000⁵ | PiB | 拍字节 | 1024⁵ |\n| EB | 艾字节 | 1000⁶ | EiB | 艾字节 | 1024⁶\
  \ |\n| ZB | 泽兆字节 | 1000⁷ | ZiB | 泽泽兆字节 | 102⁴⁷ |\n| YB | 尤兆字节 | 1000⁸ | YiB | 基尤兆字节\
  \ | 102⁴⁸ |\n**表 14-2** 磁盘大小\n\n### 管理分区和文件系统\n\n如上一节所述，可以使用两种不同类型。`fdisk` 工具已经存在很长时间，用于\
  \ MBR。`gdisk` 用于 GPT。对于 MBR 和 GPT，你都需要指定磁盘名称。表 14-3 显示了你工作中常用的设备名称。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 设备名称 |or |\n| --- | --- |\n| /dev/sda | 使用 SCSI 驱动程序的硬盘。在物理服务器上常见，VM 虚拟机中也是如此。\
  \ |\n| /dev/nvme0n1 | NVM Express (NVMe) 接口上的第一块磁盘。NVMe 是一种寻址 SSD 的服务器级方法。注意设备名称结尾，在这种情况下第一块磁盘被称为\
  \ `n1` 而非 `a`。 |\n| /dev/hda | （旧的）IDE 设备类型。在现代计算机上很少见。 |\n| /dev/vda | 使用 virtio\
  \ 磁盘驱动程序的 KVM 虚拟机磁盘。这是 KVM 虚拟机常用的设备类型。 |\n| /dev/xvda | 使用 Xen 虚拟磁盘驱动程序的 Xen 虚拟机磁盘。在安装\
  \ RHEL 虚拟机时会看到它。RHEL 8 不能作为 Xen Hypervisor，但你可能在 Xen Hypervisor 上看到 RHEL 8 虚拟机。\
  \ |\n**表 14-3** 常见设备类型\n\n#### 使用 fdisk 创建 MBR 分区\n\n要创建 MBR 磁盘分区，你必须执行多步骤程序，如练习\
  \ 14-1 所示。\n\n注意 只有当你向已挂载了某些分区的磁盘添加分区时，才会看到“重新读取分区表失败，错误代码 16”的消息。如果你是在一个没有挂载分区的空磁盘上操作，将不会看到这个错误，也不需要使用\
  \ `partprobe` 命令。\n\n#### 在 MBR 上使用扩展和逻辑分区\n\n\n\n\n在在上一个步骤中，你学习了如何添加主分区。如果已经创建了三个分区，那么还有空间可以再创建一个主分区，此之后，分区表就完全填满了。如果你想在\
  \ MBR 磁盘上创建四个以上的分区，就必须创建一个扩展分区。紧接着，你可以在扩展分区内创建逻辑分区。\n\n使用逻辑分区确实允许你突破 MBR 四个分区的限制；但它也有缺点。所有逻辑分区都存在于扩展分区之中。如果扩展分区出现问题，那么存在其中的所有逻辑分区都会出现问题。如果你需要超过四个独立的存储分配单元，可能使用\
  \ LVM 而不是逻辑分区会更好。在练习 14-2 中，你将学习如何对扩展分区和逻辑分区进行分操作。\n\n### 注意\n扩展分区仅用于创建逻辑分区的目的。你不能直接在扩展分区上创建文件系统！\n\
  \n### 提示\n`fdisk` 工具仅在在你输入 `w`（即 `fdisk` 写入命令）时才会将更改写入磁盘。如果你犯了错并想退出，请按 `q` 退出。\n\
  \n在练习 14-2 中，你使用了 `partprobe` 命令将分区表中的更改推送到内核分区表。这通常运行良好，但在某些情况下并不行。如果你在任何时候使用 `partprobe`\
  \ 遇到错误，只需使用 `reboot` 命令重启计算机。如果分区没有正确地写入你的系统，你真的不想继续修改和管理分区，因为你可能冒着在服务器上产生严重问题的的风险。\n\
  \n### 使用 gdisk 创建 GPT 分区\n如果磁盘配置了 GUID 分区表 (GPT)，或者它是一个尚未包含任何内容且大小超过 2 TiB 的新磁盘，你就需要使用\
  \ `gdisk` 工具来创建 GUID 分区。该工具与 `fdisk` 有许多相似之处，但也有一些不同。以下步骤显示了如何在 `gdisk` 中创建分区。\n\
  \n### 警告！\n切勿在已用 `fdisk` 格式化且已包含 `fdisk` 分区的磁盘上使用 `gdisk`。`gdisk` 会检测到存在 MBR，并将其转换为\
  \ GPT（参见下文的代码列表）。这样做之后，你的计算机很可能无法启动！\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# gdisk\
  \ /dev/sda\nGPT fdisk (gdisk) version 1.0.3\n\nPartition table scan:\n  MBR: MBR\
  \ only\n  BSD: not present\n  APM: not present\n  GPT: not present\n\n***********************************************************************\n\
  Found invalid GPT and valid MBR; converting MBR to GPT format in\nmemory. 此操作具有潜在的破坏性！如果你不想将你的\
  \ MBR 分区转换为 GPT 格式，\n请输入 'q' 退出！\n***********************************************************************\n\
  \nCommand (? for help):\n```\n\n为了节省你经历这一过程的麻烦，我验证了它显示的内容。在将 MBR 转换为 GPT 后，你的机器将不再启动。\n\
  \n练习 14-3 展示了如何使用 `gdisk` 创建分区。\n\n### 使用 parted 创建 GPT 分区\n如前所述，除了 `fdisk` 和 `gdisk`\
  \ 之外，还可以使用 `parted` 工具来创建分区。因为它缺乏对高级功能的支持，我重点关注了 `fdisk` 和 `gdisk`，但我想向你快速概述一下使用\
  \ `parted` 操作。\n\n要使用 `parted`，你需要知道它有一个交互式 shell，你可以在其中处理它的不同选项。练习 14-4 将引导你完成完成使用\
  \ `parted` 创建分区的步骤。\n\n### 创建文件系统\n此时，你已经知道如何创建分区了。分区本身并不有用。只有当你决定对它做某些事情时，它才会变得有用。这通常意味着你必须在其之上建立文件系统。在本节中，你将学习如何这样做。\n\
  \nRHEL 8 可以使用不同的文件系统。表 14-4 提供了最常见文件系统的概述。\n\n![](img/key_topic_icon.jpg)\n\n| 文件系统\
  \ | 说明 |\n| --- | --- |\n| XFS | RHEL 8 的默认文件系统。 |\n| Ext4 | RHEL 旧版本的默认文件系统；在 RHEL\
  \ 8 中仍然可用并受支持。 |\n| Ext3 | Ext4 的旧版本。在 RHEL 8 上，不再需要使用 Ext3 了。 |\n| Ext2 | 20 世纪\
  \ 90 年代开发的非常基础的文件系统。在 RHEL 8 上不再需要使用这种文件系统。 |\n| BtrFS | 一种 RHEL 8 不支持的较文件系统。 |\n\
  | NTFS | 与 Windows 兼容的文件系统，RHEL 8 不支持。 |\n| VFAT | 一种提供 Windows 和 Mac 兼容性的文件系统，功能等同于\
  \ FAT32 文件系统。适用于与其他计算机交换数据的 USB 闪存盘，但不适用于服务器。 |\n\n**表 14-4** 文件系统\n\n要使用支持的文件系统之一格式化分区，可以使用\
  \ `mkfs` 命令，并使用 `-t` 指定文件系统。或者，你可以使用系统特定的工具如 `mkfs.ext4` 来格式化 Ext4 文件系统。\n\n###\
  \ 注意\n如果你在不指定文件系统的情况下使用 `mkfs` 将格式化 Ext2 文件系统。这可能不是你想要的，所以不要忘记指定你需要的文件系统。\n\n要使用默认\
  \ XFS 文件系统格式化分区，请使用命令 `mkfs -t xfs`。示例 14-1 显示了该命令的输出。\n\n**示例 14-1** 使用 XFS 格式化文件系统\n\
  \n点击此处查看代码图像\n\n```\n[root@localhost ~]# mkfs -t xfs /dev/sda5\nmeta-data=/dev/sda5\
  \         isize=512    agcount=4, agsize=6400 blks\n           =               \
  \ sectsz=512   sunit=0      swidth=0 blks\nnaming     =version 2       bsize=4096\
  \   blocks=25600, imaxpct=25\n           =                crc=1        finobt=1,\
  \ sparse=1, rmapbt=0\n           =                reflink=1, projid32bit=1\ndata\
  \       ==                ascii-ci=0, ftype=1\nlog        =internal log    bsize=4096\
  \   blocks=1368, version=2\nrealtime   =none            extsz=4096   blocks=0, rtextents=0\n\
  ```\n\n在练习 14-5 中，你在之前创建的 `/dev/sda3` 上创建一个文件系统。\n\n### 修改文件系统属性\n在处理文件系统时，也可以也可以某些属性。文件系统属性取决于你使用的文件系统，因此对不同的文件系统使用不同的属性和工具。\n\
  \n#### 管理 Ext4 文件系统属性\n管理 Ext4 文件系统属性的通用工具是 `tune2fs`。该工具很久以前为 Ext2 文件系统开发，并且也兼容\
  \ Ext3 和 Ext4。当你管理 Ext4 文件系统属性时，`tune2fs -l` 是一个很好的开始命令。示例 14-2 展示了该命令的输出，显示了不同的文件系统属性。\n\
  \n**示例 14-2** 使用 `tune2fs -l` 显示文件系统属性\n\n\n\n\n```\n[root@localhost ~]# tune2fs\
  \ -l /dev/sda3\ntune2fs 1.44.3 (10-July-2018)\nFilesystem volume name:   <none>\n\
  Last mounted on:          <not available>\nFilesystem UUID:          ad8c3cf0-675b-4540-bc9a-4cfe63a90ffa\n\
  Filesystem magic number:  0xEF53\nFilesystem revision #:    1 (dynamic)\nFilesystem\
  \ features:      has_journal ext_attr resize_inode dir_index\n                 \
  \           filetype extent 64bit flex_bg sparse-super\n                       \
  \     large_file huge_file dir_nlink extra_isize\n                            metadata_csum\n\
  Filesystem flags:         signed_directory_hash \nDefault mount options:    user_xattr\
  \ acl\nFilesystem state:         clean\nErrors behavior:          Continue\nFilesystem\
  \ OS type:       Linux\nInode count:              25688\nBlock count:          \
  \    102400\n\nReserved block count:     5120\nFree blocks:              93504\n\
  Free inodes:              25677\nFirst block:              1\nBlock size:      \
  \         1024\nFragment size:            1024\nGroup descriptor size:    64\nReserved\
  \ GDT blocks:      256\nBlocks per group:         8192\nFragments per group:   \
  \   8192\nInodes per group:         1976\nInode blocks per group:   247\nFlex block\
  \ group size:    16\nFilesystem created:       Wed Jun 19 03:29:06 2019\nLast mount\
  \ time:           n/a\nLast write time:           Wed Jun 19 03:29:06 2019\nMount\
  \ count:               0\nMaximum mount count:       -1\nLast checked:         \
  \     Wed Jun 19 03:29:06 2019\nCheck interval:            0 (<none>)\nLifetime\
  \ writes:           4441 kB\nReserved blocks uid:       0 (user root)\nReserved\
  \ blocks gid:       0 (group root)\nFirst inode:               11\nInode size: \
  \               128\nJournal inode:             8\nDefault directory hash:    half_md4\n\
  Directory Hash Seed:       54b529bb-2ef1-4983-ae42-dfdef7ba8797\nJournal backup:\
  \            inode blocks\nChecksum type:             crc32c\nChecksum:        \
  \          0xf36c81e5\n```\n\n如所示，`tune2fs -l` 命令显示了许多文件系统属性。其中一个有趣的属性是文件系统标签，显示为\
  \ `Filesystem volume name`。标签用于为文件系统设置唯一名称，使得即使底层设备名称发生变化，也能以一致的方式挂载文件系统。此外，文件系统特性和默认挂载选项也很有意思。\n\
  \n要更改任何默认文件系统选项，可以使用带有其他参数的 `tune2fs` 命令。这里有一些常用的用法示例：\n\n*   使用 `tune2fs -o` 设置默认文件系统挂载选项。一旦设置到文件系统，在通过\
  \ `/etc/fstab` 挂载时就不需要需要指定该选项。例如，使用 `tune2fs -o acl,user_xattr` 来开启访问控制列表和用户扩展属性。在选项前加上\
  \ `^` 符号可以再次关闭它，如 `tune2fs -o ^acl,user_xattr`。\n\n*   Ext 文件系统还带有可能作为默认开启的文件系统特性。要开启某项文件系统特性，使用\
  \ `tune2fs -O` 后接该特性。要关闭某项特性，在特性名称前加上 `^`。\n\n*   使用 `tune2fs -L` 为文件系统设置标签。正如本章稍后的“挂载文件系统”节所描述的，你可以使用文件系统标签根据名称而非设备名称来挂载文件系统。除了\
  \ `tune2fs -L`，`e2label` 命令也允许你为文件系统设置标签。\n\n### 管理 XFS 文件系统属性\n\nXFS 文件系统是一种完全不同的文件系统，因此也有一套完全不同的工具来管理其属性。它不允许在文件系统元数据中设置文件系统属性。不过，你可以使用\
  \ `xfs_admin` 命令更改一些 XFS 属性。例如，使用 `xfs_admin -L mylabel` 将文件系统标签设置为 `mylabel`。\n\
  \n### 添加交换分区\n\n你 Linux 服务器上的大部分分区都用于常规文件系统。在 Linux 上，交换空间通常分配在磁盘设备上。它可以是一个分区或 LVM\
  \ 逻辑卷（见第 15 章）。在紧急情况下，你甚至可以使用文件来扩展可用的交换空间。\n\n在 Linux 上使用交换空间是改进 Linux 内核内存使用的一种方便方法。当物理内存不足时，最近未使用的内存页可以移动到交换空间，从而为需要访问内存页的程序留出更多内存。由于由于原因，大多数\
  \ Linux 服务器都配置了一定数量的交换空间。尽管如果交换空间开始被密集使用，你可能会遇到麻烦，这就是为什么应该密切监控交换空间的使用。\n\n有时，分配更多的交换空间是有意义的，当发生内存不足时。\n\
  \n### 添加交换文件\n\n如果你没有足够的空间创建新分区或逻辑卷，可以使用交换文件。要添加交换文件，你需要先创建它。使用 `dd if=/dev/zero\
  \ of=/swapfile bs=1M count=100` 命令创建一个 100 MiB 的文件。结果是一个可以配置为交换空间的文件。要这样做，操作方法与分区类似。首先使用\
  \ `mkswap /swapfile` 将文件标记为交换空间，然后使用 `swapon /swapfile` 激活它。\n\n### 挂载文件系统\n\n仅仅创建分区并在上面放置文件系统是不够的。要使用该分区，你还必须挂载它。通过挂载分区，你可以通过特定的目录访问其内容。\n\
  \n挂载分区需要一些信息：\n\n*   **挂载什么**：这是强制性的，指定需要挂载的设备。\n*   **挂载到哪里**：这同样是强制，指定设备应该挂载的目录。\n\
  *   **挂载什么类型的文件系统**：可以选择地指定文件系统类型。大多数情况下这不是必要的。`mount` 命令会检测设备上使用的文件系统并确保使用正确的驱动程序。\n\
  *   **挂载选项**：挂载设备时可以使用许多挂载选项。使用选项是可选的，取决于你对文件系统的需求。\n\n#### 手动挂载文件系统\n\n手动挂载文件系统使用\
  \ `mount` 命令。卸载已挂载的文件系统使用 `umount` 命令。使用这些命令相对简单。例如，要将 `/dev/sda5` 上的文件系统挂载到 `/mnt`\
  \ 目录，请使用以下命令：\n\n```\nmount /dev/sda5 /mnt\n```\n\n要卸载挂载，你可以使用 `umount` 指定设备名称或你想卸载的挂载点名称。因此，以下命令均有效：\n\
  \n```\numount /dev/sda5\numount /mnt\n```\n\n#### 使用设备名称、UUID 或磁盘标签\n\n\n\n\n要挂载设备，你可以使用设备名称，如命令\
  \ `mount /dev/sda5 /mnt` 所示。如果你的服务器位于使用动态存储拓扑的环境中，这并不总是最佳方法。你现在可能拥有一个存储设备 `/dev/sda5`，但在存储拓扑发生变化后，在服务器下次重启后，它可能会变为\
  \ `/dev/sdb5`。这就是为什么在默认的 RHEL 8 安装中，我们使用 UUID 而不是设备名称。\n\n每个文件系统默认都关联着一个 `UUID`——不仅是用于存储文件的文件系统，还包括像交换文件系统（swap）这样的特殊文件系统。你可以使用\
  \ `blkid` 命令来获取系统中当前文件系统的概览以及该文件系统使用的 `UUID`。\n\n在 `UUIDs` 普及之前，文件系统通常配置为通过标签（labels）工作，标签可以使用\
  \ `e2label` 命令或 `xfs_admin -L` 命令进行设置。这在最近的 Linux 版本中已经变得不再常见。如果一个文件系统有标签，`blkid`\
  \ 命令也会显示它，如示例 14-3 所示。\n\n**示例 14-3** 使用 `blkid` 查找当前文件系统的 UUID\n\n点击此处查看代码图像\n\n\
  ```\n[root@server3 ~]# blkid\n/dev/sda1: UUID=\"02305166-840d-4f74-a868-c549b3229e65\"\
  \ TYPE=\"xfs\"\n/dev/sda2: UUID=\"Hasz5q-nZF3-XN94-L2fm-xUwz-3VEq-qVCAYi\"\n   \
  \          TYPE=\"LVM2_member\"\n/dev/sda5: UUID=\"42f419c4-633f-4ed7-b161-519a4dadd3da\"\
  \ TYPE=\"xfs\"\n/dev/mapper/centos-swap: UUID=\"5867ba02-fd89-475c-be56-7922febde43b\"\
  \n                           TYPE=\"swap\"\n/dev/mapper/centos-root: UUID=\"b2022ac4-73c6-4e6b-a52f-703e3e2476b7\"\
  \n                           TYPE=\"xfs\"\n```\n\n要根据 `UUID` 挂载文件系统，你使用 `UUID=nnnnn`\
  \ 而不是设备名称。因此，如果你想根据示例 14-3 中的 UUID 挂载 `/dev/sda5`，命令如下：\n\n点击此处查看代码图像\n\n```\nmount\
  \ UUID=\"42f419c4-633f-4ed7-b161-519a4dadd3da\" /mnt\n```\n\n使用 `UUID` 手动挂载设备并不一定意味着更简单。然而，如果像下一节讨论的那样实现了挂载自动化，那么使用\
  \ UUID 而不是设备名称是有意义的。\n\n要使用标签挂载文件系统，你使用 `mount LABEL=labelname` 命令。例如，使用 `mount\
  \ LABEL=mylabel /mnt` 可以将名为 `mylabel` 的文件系统临时挂载到 `/mnt` 目录。\n\n### 通过 /etc/fstab\
  \ 自动挂载文件系统\n\n通常情况下，你不想手动挂载文件系统。一旦你对它们满意了，让它们自动挂载是一个好主意。实现此点的经典方法是通过 `/etc/fstab`\
  \ 文件。示例 14-4 显示了该文件的示例内容。\n\n**示例 14-4** /etc/fstab 文件示例内容\n\n点击此处查看代码图像\n\n```\n\
  [root@server3 ~]# cat /etc/fstab\n\n#\n# /etc/fstab\n# Created by anaconda on Fri\
  \ Jan 16 10:28:41 2015\n#\n# Accessible filesystems, by reference, are maintained\
  \ under\n  '/dev/disk'\n# See man pages fstab(5), findfs(8), mount(8) and/or blkid(8)\n\
  \  for more info\n#\n/dev/mapper/centos-root /      xfs   defaults  1 1\nUUID=02305166-840d-4f74\
  \ /      xfs   defaults  1 2\n/dev/mapper/centos-swap swap   swap  defaults  0 0\n\
  ```\n\n在 `/etc/fstab` 文件中，一切都指定为自动挂载文件系统。出于此目的，每行有六个字段，如表 14-5 所示。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 字段 | 描述 |\n| --- | --- |\n| 设备 (Device) | 必须挂载的设备。可以使用设备名称、UUID 或标签。 |\n| 挂载点\
  \ (Mount Point) | 需要挂载设备的目录或内核接口。 |\n| 文件系统 (File System) | 文件系统的类型。 |\n| 挂载选项 (Mount\
  \ Options) | 挂载选项。 |\n| Dump 支持 (Dump) | 是否支持 dump 工具进行备份。 |\n| 自动检查 (Automatic\
  \ Check) | 是否在启动时进行自动检查。 |\n\n**表 14-5** /etc/fstab 字段\n\n*(注：此处表格内容根据上下文逻辑推断翻译，原文中已给出字段描述，此处主要为格式对齐)*\n\
