  \ lisa 调度 cron 任务？\n\n**7.** 如何指定用户 boris 永远不允许通过 cron 调度任务？\n\n\n\n\n\n## 8. 你需要确保某个任务每天执行一次，即使执行时服务器临时不可用。你该如何做？\n\
  \n## 9. 调度任务时必须哪个服务正在运行？\n\n## 10. 哪个命令可以让你发现当前是否有任何任务已计划执行？\n\n### 本章末尾实验\n\n在本章末的实验中，你将练习任务和\
  \ cron 任务（定时任务）。\n\n### 实验 12.1\n\n1. 创建一个 cron 任务，在每天晚上 11 点对你计算机上的所有软件进行更新。\n\
  2. 安排你的机器在明天早晨 3 点重启。\n\n# 第 13 章\n\n### 配置日志\n\n**本章涵盖了以下主题：**\n\n* 理解系统日志\n* 配置\
  \ rsyslogd\n* 日志文件轮转\n* 使用 journald\n\n本章涵盖了以下 RHCSA 考试目标：\n\n* 定位和解释系统日志文件日志\n\
  * 保留系统日志\n\n分析日志文件是系统管理员的一项重要任务。如果 Linux 系统出现任何问题，答案通常在日志文件中。在 RHEL 8 中，两个不同的日志系统并排运行，因此知道哪些信息可以在哪里找到非常重要。本章将教你所有相关知识。你将学习如何读取日志文件、如何配置\
  \ `rsyslogd` 和 `journald`，以及如何设置系统日志轮转，以防止磁盘被日志记录过于频繁的服务完全完全占满。\n\n### “我已经掌握了吗？”测验\n\
  \n“我已经掌握了吗？”测验可以让你评估自己是否应该彻底阅读整个章节，还是说可以直接跳到“备考任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节的内容。表\
  \ 13-1 列出了本章的主要标题及其对应的“我已经掌握了吗？”测验问题。你可以在附录 A](#appa.xhtml_appa) 中的“‘我已经掌握了吗？测验和‘复习题’的答案”找到答案。\n\
  \n| 基础主题章节 | 问题 |\n| --- | --- |\n| 理解系统日志 | 1–3 |\n| 配置 rsyslogd | 4–7 |\n| 日志文件轮转\
  \ | 8 |\n| 使用 journald | 9–10 |\n\n**表 13-1** “我已经掌握了吗？”章节与问题映射\n\n## 1. 关于 `journald`\
  \ 的以下陈述哪个*不*正确？\n\n1. `journald` 记录内核消息。\n2. `journald` 将内容写入日志，默认情况下在启动之间不会持久化。\n\
  3. `journald` 是 `rsyslogd` 的替代品。\n4. 从日志中读取文件，你使用 `journalctl` 命令。\n\n## 2. 你应该读取哪个日志来查找与身份验证错误相关的消息？\n\
  \n1. `/var/log/messages`\n2. `/var/log/lastlog`\n3. `/var/log/audit/audit.log`\n\
  4. `/var/log/secure`\n\n## 3. 你应该读取哪个日志来查找与 SELinux 事件相关的信息？\n\n1. `/var/log/messages`\n\
  2. `/var/log/lastlog`\n3. `/var/log/audit/audit.log`\n4. `/var/log/secure`\n\n##\
  \ 4. `rsyslogd` 配置文件的名称是？\n\n1. `/etc/rsyslog.conf`\n2. `/etc/sysconfig/rsyslogd.conf`\n\
  3. `/etc/sysconfig/rsyslog.conf`\n4. `/etc/rsyslog.d/rsyslogd.conf`\n\n## 5. 你需要更改\
  \ `rsyslogd` 服务的启动行为。以下哪项描述了实现此操作的推荐方法？\n\n1. 在主 `rsyslog` 配置文件中包含启动参数。\n2. 在 `/etc/rsyslog.d`\
  \ 目录中创建一个包含式文件并在其中指定所需的参数。\n3. 修改 `/usr/lib/systemd/system` 中的 Systemd 文件以包含所需的启动参数。\n\
  4. 使用 `/etc/sysconfig/rsyslog` 文件中的 `SYSLOGD_OPTIONS` 行并在此处包含启动参数。\n\n## 6. 在 `rsyslog.conf`\
  \ 文件中，以下哪个目标指的是特定的 `rsyslogd` 模块？\n\n1. `-/var/log/maillog`\n2. `/var/log/messages`\n\
  3. `:omusrmsg:*`\n\n## 7. 在 rsyslogd 中，如果你想执行，哪种设施是最佳解决方案？\n\n1. `daemon`\n2. `apache`\n\
  3. `syslog`\n4. `local0`\n\n## 8. 你想最大化 logrotate 的文件大小。你在哪里配置这个？\n\n1. 在 `/etc/logrotate.d`\
  \ 中创建一个文件并指定大小。\n2. 重启机器。\n3. 配置 `logrotate`\n4. 无法做到。\n\n## 9. 哪个目录用于存储日志？\n\n\
  1. `/var/log/journal`\n2. `/run/journal`\n3. `/run/log`\n4. `/run/log/journal`\n\
  \n## 10. 为了让日志持久化，你需要做什么？\n\n1. 创建 `/var/log/journal` 并设置适当权限。\n2. 打开 `/etc/sysconfig/journal`\
  \ 并将 PERSISTENT 设置为 **yes**。\n3. 打开 `/etc/systemd/journald.conf` 并将 PERSISTENT 设置为\
  \ **yes**。\n4. 创建 `/var/log/journal` 并设置适当权限。\n\n### 基础主题\n\n### 理解系统日志\n\n大多数 Linux\
  \ 服务都会将信息写入日志文件。这些信息可以写入不同的目标，并且有多种解决方案来查找相关信息：\n\n* **直接写入**：某些服务直接写入日志文件——甚至是像\
  \ Apache Web 服务器和 Samba 文件服务器。\n* **rsyslogd**：rsyslogd 是 syslog 的增强，syslog 是一个管理日志文件的服务。syslog\
  \ 已经存在了很久。\n* **journald**：随着 Systemd 的引入，也引入了 journald 日志服务 systemd-journal。该服务与\
  \ Systemd 整合，允许管理员在使用 `systemctl status` 命令监控服务状态的同时从日志中读取详细信息。\n\n#### 理解 rsyslogd\
  \ 和 journald 的作用\n\n![](img/key_topic_icon.jpg)\n\n在 RHEL 8 中，journald（由 systemd-journal\
  \ 守护实现）提供了高级日志管理系统。journald 收集内核、整个启动过程以及服务的消息并将其写入事件日志。该事件日志以二进制格式存储，可以使用 `journalctl`\
  \ 命令进行查询。`journalctl` 命令让你能够访问日志消息的深层细节，因为它是 Systemd 的集成部分。\n\n![](img/key_topic_icon.jpg)\n\
  \n由于 journald 写入的日志在重启之间不持久，消息也会被转发到 rsyslogd 服务，该服务将消息写入 `/var/log` 目录下的不同文件。rsyslogd\
  \ 还提供了 journald 不具备的功能，例如集中日志记录和通过模块过滤消息。有许多模块可以增强 rsyslog 日志记录，例如允许将消息存储在数据库中的输出模块。\n\
  \n\n\n\n\n在 RHEL 8 的当前状态下，`journald`并不是 `rsyslog` 的替代品；它只是记录信息的另一种方式。`journald`\
  \ 与 `Systemd` 深度集成；因此，它会记录你的服务器正在执行的所有操作。`rsyslogd` 在此基础上增加了一些功能，特别是负责将日志信息写入特定文件（这些文件在重启之间是持久的），并允许你配置远程日志和日志服务器。\n\
  \n除了 `rsyslogd` 和 `systemd-journald` 之外，还有 `auditd` 服务。该服务提供审计功能，即对特定服务、进程或用户所的操作进行深度追踪。审计的配置超出了\
  \ RHCSA 考试的范围，但你会发现，例如 `SELinux` 会向 `auditd` 服务记录详细信息。\n\n为了获取更多关于运行 RHEL 的机器上发生了什么的信息，管理员必须采取三种方法：\n\
  \n*   监控 `/var/log`目录中由 `rsyslogd` 写入的文件。\n*   使用 `journalctl` 命令从日志中获取更详细的信息。\n\
  *   使用 `systemctl status <unit>` 命令获取 Systemd 单元通过 `journald` 记录的最后重要事件的简短概述。此命令显示服务的状态，以及最后记录的几行日志。示例\
  \ 13-1 显示了该服务记录的一些状态日志消息。\n\n**示例 13-1** 使用 `systemctl status` 显示相关日志信息\n\n点击此处查看代码图像\n\
  \n```\n[root@server1 ~]# systemctl status sshd -l\n   sshd.service - OpenSSH server\
  \ daemon\n   Loaded: loaded (/usr/lib/systemd/system/sshd.service; enabled;\n  \
  \           vendor preset: enabled)\n   Active: active (running) since Sat 2019-06-08\
  \ 03:34:56 EDT;\n             55min ago\n     Docs: man:sshd(8)\n           man:sshd_config(5)\n\
  \ Main PID: 1055 (sshd)\n    Tasks: 1 (limit: 11363)\n   Memory: 5.5M\n   CGroup:\
  \ /system.slice/sshd.service\n           └–1055 /usr/sbin/sshd -D -oCiphers=aes256-gcm@openssh.com,\n\
  \                chacha20-poly1305@openssh.com,ae>\n\nJun 08 03:34:56 server1.example.com\
  \ systemd[1]: Starting OpenSSH\n  server daemon...\nJun 08 03:34:56 server1.example.com\
  \ sshd[1055]: Server listening on\n  0.0.0.0 port 22.\nJun 08 03:34:56 server1.example.com\
  \ sshd[1055]: Server listening on ::\n  port 22.\nJun 08 03:34:56 server1.example.com\
  \ systemd[1]: Started OpenSSH server\n  daemon.\nJun 08 03:57:38 server1.example.com\
  \ sshd[3368]: Accepted password for\n  root from 192.168.4.1 port 5470>\nJun 08\
  \ 03:57:38 server1.example.com sshd[3368]: pam_unix(sshd:\n  session):session opened\
  \ for user root\n```\n\n#### 读取日志文件\n\n除了 `journald` 写入日志并可以使用 `journalctl` 命令读取的消息外，在\
  \ Linux 系统上，你还会在 `/var/log` 目录中找到不同的日志文件。该目录中的大多数文件都由 `rsyslogd` 管理，但某些文件是由特定服务直接创建的。你可以使用\
  \ `less` 等分页器工具读取这些文件。\n\n`/var/log` 目录中文件的确切数量会根据服务器的配置在该服务器上运行的服务而变化。然而，在大多数情况下，某些文件确实存在，作为管理员，你应该知道它们是哪些文件，以及在这些文件中预期什么内容。表\
  \ 13-2 提供了在此目录下创建的一些标准文件的概述。\n\n![](img/key_topic_icon.jpg)\n\n| 日志文件 | 说明 |\n|\
  \ --- | --- |\n| `/var/log/messages` | 包含最常用的日志文件；它是通用日志文件，大多数消息都写入此处。 |\n| `/var/log/dmesg`\
  \ | 包含内核日志消息。 |\n| `/var/log/secure` | 包含认证相关的消息。在此查看服务器上发生了哪些认证错误。 |\n| `/var/log/boot.log`\
  \ | 包含与系统启动相关的消息。 |\n| `/var/log/audit/audit.log` | 包含审计消息。`SELinux` 写入此文件。 |\n\
  | `/var/log/maillog` | 包含邮件相关的消息。 |\n| `/var/log/samba` | 提供 Samba 日志文件。注意 Samba\
  \ 默认不通过 `rsyslog` 管理，而是直接写入 `/var/log` 目录。 |\n| `/var/log/sshd` | 包含与 SSH 服务相关的消息。\
  \ |\n\n#### 理解日志文件\n\n如示例 13-2 所示，每行记录的日志都有特定的元素：\n\n*   **日期和时间：** 每条日志消息都以时间戳开始。为了方便过滤，时间戳采用\
  \ 24 小时制写入。\n*   **主机：** 消息来源的主机。这很重要，因为 `rsyslog` 可以配置为处理远程日志。\n*   **服务或进程名称：**\
  \ 生成消息的服务或进程名称。\n*   **消息内容：** 消息的内容，包含了被记录的精确消息。\n\n若要读取日志文件的内容，你可以使用 `less` 等分页器工具，也可以像下一节描述的那样实时监控日志文件中发生的情况。\n\
  \n\n\n\n在 Linux 上配置服务时，实时查看正在发生的情况可能会有用。例如，你可以同时打开两个终端会话。在一个终端会话中，你配置并测试服务；在另一个终端会话中，你实时查看发生的情况。`tail\
  \ -f <logfile>` 命令会实时显示哪些行被添加到日志文件中。后续章节练习 13-1 展示了一个使用 `tail -f` 的简单示例。当你使用 `tail\
  \ -f` 监控日志文件时，跟踪将一直保持打开，直到你按下 Ctrl-C 将其关闭。\n\n### 使用 logger\n\n大多数服务会自动将信息写入日志文件，或者通过\
  \ `rsyslogd` 写入。`logger` 命令允许用户从命令行或脚本向 rsyslog 写入消息。使用该命令非常简单。只需输入 `logger`，后跟你想要写入日志的消息即可。通过这种方式，`logger`\
  \ 实用程序为从脚本写入消息提供了一个方便的解决方案。这允许你在出现问题时让脚本写入 syslog。\n\n当使用 `logger` 时，你还可以指定要记录的优先级（priority）和设施（facility）。例如，命令\
  \ `logger -p kern.err hello` 会将 `hello` 写入内核设施，并使用错误优先级（在本章稍后部分讨论）。此选项允许你测试特定 rsyslog\
  \ 设施的功能。在练习 13-1 中，你使用 `tail -f` 实时监控日志文件，并使用 `logger` 将日志消息写入日志文件。\n\n#### 配置 rsyslogd\n\
  \n为了确保需要记录的信息被写入你希望找到的地方，你可以通过 `/etc/rsyslog.conf` 文件配置 `rsyslogd` 服务。在此文件中，你可以找到不同的部分，允许你指定信息应该在何时以及如何写入。\n\
  \n#### 理解 rsyslogd 配置文件\n\n与 RHEL 8 许多其他服务一样，`rsyslogd` 的配置并非仅定义在一个配置文件中。`/etc/rsyslog.conf`\
  \ 文件是配置 `rsyslogd` 的中心位置。该文件包含了 `/etc/rsyslog.d` 目录的内容。该目录可以通过在服务器上安装 RPM 包来填充。在寻找特定的日志配置时，请务必始终考虑该目录的内容。\n\
  \n如果启动时需要向 `rsyslogd` 服务传递特定选项，可以通过使用 `/etc/sysconfig/rsyslog` 文件来实现。该文件默认包含一行，内容为\
  \ `SYSLOGD_OPTIONS=\"\"`。在该行上，你可以指定 `rsyslogd` 的启动参数。`SYSLOGD_OPTIONS` 变量包含在启动 `rsyslogd`\
  \ 的 Systemd 配置文件。从理论上，你可以在此文件中更改启动参数，但不建议这样做。（有关 Systemd 配置的更多细节，请参阅第 17 章“管理和理解引导过程”。）\n\
  \n#### 理解 rsyslog.conf 部分\n\n`rsyslog.conf` 文件用于指定记录什么以及记录在哪里。为了实现这一点，你会在 `rsyslog.conf`\
  \ 文件中找到不同的部分：\n\n*   **#### MODULES ####：** `rsyslogd` 是模块化的。包含模块是为了增强 `rsyslogd`\
  \ 支持的功能。\n*   **#### GLOBAL DIRECTIVES ####：**此部分用于指定全局参数，例如辅助文件的写入位置或默认时间戳格式。\n\
  *   **#### RULES ####：** 这是 `rsyslog.conf` 文件中最重要的部分。它包含了指定哪些信息应该记录到哪个目的地的规则。\n\n\
  #### 理解设施、优先级和日志目的地\n\n为了指定将什么信息记录到哪个目的地，`rsyslogd` 使用设施（facilities）、优先级（priorities）和目的地（destinations）：\n\
  \n*   `facility`（设施）指定所记录信息的类别。rsyslogd 使用固定的设施列表，无法扩展。这是为了与旧的 syslog 服务保持向后兼容。\n\
  *   `priority`（优先级）用于定义需要记录的消息的严重程度。当你指定优先级时，默认情况下所有该优先级及更高优先级的消息都会被记录。\n*   `destination`（目的地）定义消息写入的位置。典型的目的地是文件，但\
  \ rsyslog 模块也可以作为目的地，允许通过 rsyslogd 模块进行进一步处理。\n\n示例 13-3 显示了 rsyslog 中的 RULES 部分。\n\
  \n**示例 13-3** rsyslog.conf 中的 RULES 部分\n\n点击此处查看代码图像\n\n```\n#### RULES ####\n\n\
  # 将所有内核消息记录到控制台。\n# 记录太多内容会弄乱屏幕。\n#kern.*                                    /dev/console\n\
  \n# 记录 info 级或以上的任何内容（邮件除外）。\n 不要记录私有的身份验证消息！\n*.info;mail.none;authpriv.none;cron.none\
  \   /var/log/messages\n\n# authpriv 文件有访问限制。\nauthpriv.*                       \
  \          /var/log/secure\n\n# 将所有邮件消息记录在一个地方。\nmail.*                        \
  \             -/var/log/maillog\n\n# 记录 cron 任务\ncron.*                        \
  \             /var/log/cron\n\n# 所有人紧急消息\n*.emerg                              \
  \      /dev/console\n\n# 保存 crit 级的新闻错误。\nuucp,news.crit                       \
  \      /var/log/spool\n```\n\n在示例 13-3 中，你可以看到设施和优先级定义记录的位置。当你指定目的地时，通常使用文件。如果文件名以连字符开头（如\
  \ -/var/log/maillog），日志消息将不会立即提交到文件，而是进行缓冲。也可以使用设备文件，例如 `/dev/console`。如果使用此设备，消息将实时写入。\n\
  \n![key_topic.jpg](img/key_topic.jpg) \n\n| 设施 | 用于 |\n| --- | --- |\n| auth/authpriv\
  \ | 与身份验证相关的消息。 |\n| cron | **crond** 服务生成的消息。 |\n| daemon | 守护程序的通用设施。 |\n| kern\
  \ | 内核消息。 |\n| lpr | 通过旧 lpd 打印系统生成的消息。 |\n| mail | 电子邮件相关消息。 |\n| mark | 用于定期写入标记的特殊设施。\
  \ |\n| news | 由 NNTP 新闻系统生成的消息。 |\n| security | 与 auth/authpriv 相同。不再应使用。 |\n| syslog\
  \ | 由 syslog 系统生成的消息。 |\n| user | 用户空间生成的消息。 |\n| uucp | 由旧 UUCP 系统生成的消息。 |\n| local0-7\
  \ | 由 local0 到 local7 设施配置的服务生成的消息。 |\n\n**表 13-3** rsyslogd 设施\n\nsyslog 设施定义于\
  \ 20 世纪 80 年代，为了向后兼容，无法添加新设施。结果是某些设施仍然存在但用途，而某些在后期出现的服务没有自己的设施。作为解决方案，可以使用两种特定的设施类型。daemon\
  \ 设施是任何守护程序都可以使用的通用设施。\n\n\n\n\n如果没有自带 `rsyslogd` 设施的服务仍然需要将日志消息写入特定的日志文件，则可以将这些服务配置为使用\
  \ `local0` 到 `local7` 的任何一个设施。接下来，你必须配置这些服务以使用这些设施。执行此操作的步骤取决于你正在使用的服务。然后，你需要在 `rsyslog.conf`\
  \ 文件中添加一条规则，将通过该设施传入的消息发送到特定的日志文件。\n\n要确定应该记录什么种类型的消息，你可以在 `rsyslog.conf` 行中使用不同的严重级别（severities）。这些严重级别就是\
  \ syslog 优先级。表 13-4 提供了按升顺序排列的可用优先级概述。\n\n![](img/key_topic_icon.jpg)\n\n| 优先级 |\
  \ 描述 |\n| --- | --- |\n| debug | 调试消息，尽可能提供有关服务运行的信息。 |\n| info | 关于正常运行的信息性消息。\
  \ |\n| notice | 关于可能演变为事项的通知性消息。 |\n| warning / warn | 某些情况并非最优，但尚未构成真正的错误。 |\n\
  | err /error | 发生了非关键错误。 |\n| crit | 发生了严重错误。 |\n| alert | 当服务停止可用时使用的消息。 |\n| emerg/panic\
  \ | 当服务停止可用时生成的消息。 |\n\n### rsyslogd 优先级\n\n当使用特定优先级时，所有该优先级及更高优先级的消息都将根据该规则使用的规范进行记录。如果你需要配置详细的日志记录，将不同优先级的消息发送到不同的文件，可以在优先级前加上等号（`=`）来指定优先级，如下行所示，该行会将所有仅为\
  \ `debug` 优先级的消息写入名为 `/var/log/cron` 的特定文件。行前的 `-` 指定进行缓冲，以便以更高效的方式记录信息。\n\n```\n\
  cron=.debug -var/log/cron\n```\n\n你不需要死记硬背 `rsyslogd` 设施和优先级的名称。它们都列在 `man 5 rsyslog.conf`\
  \ 中。在考试中，你可以访问帮助条页（man pages），因此这些信息可以很容易获取。练习 13-2 展示了如何更改 `rsyslog.conf`。你可以配置\
  \ Apache 服务通过 `syslog` 记录消息，并创建一条将调试消息记录到特定文件的规则。\n\n### 日志文件轮转\n\n为了防止 syslog 消息完全填充系统，你可以对日志消息进行轮转。这意味着当达到某个阈值时，旧日志文件会被关闭并打开一个新的日志文件。`logrotate`\
  \ 工具通过 `crond` 服务定期启动以处理日志文件的轮转。\n\n当日志文件被轮转时，旧日志文件通常会被复制到一个包含轮转日期的文件中。例如，如果 `/var/log/messages`\
  \ 在 2021 年 6 月 8 日轮转，轮转后的文件名将是 `/var/log/messages-20210608`。默认情况下，系统保留四个旧文件。超过该期间的文件将自动从系统中删除。\n\
  \n**警告**：轮转过的日志文件没有存储在任何地方；它们直接消失了。如果你的公司策略要求你能够访问五周以前发生的事件信息，你应该备份日志文件，或者配置一个集中日志服务器，让\
  \ `logrotate` 在那里保留更久的轮转消息。日志轮转的默认设置保存在 `/etc/logrotate.conf` 文件中（参见示例 13-4](#ch13.xhtml_ch13ex04)）。\n\
  \n#### /logrotate.conf 示例内容\n\n```\n# 详情见 \"man logrotate\"\n# 每周轮转日志文件\nweekly\n\
  \n# 保留 4 周的积压\nrotate 4\n\n# 在轮转旧文件后创建（空）日志文件\ncreate\n\n# 使用日期作为轮转文件的后缀\ndateext\n\
  \n# 如果你想压缩日志文件，请取消此注释\ncompress\n\n# RPM 软件包将轮转信息存放在此目录\ninclude /etc/logrotate.d\n\
  \n# 系统特定的日志也可以在此处进行配置\n```\n\n该配置文件中最重要的设置告诉 `logrotate` 每周轮转一次文件并保留该文件的四个旧版本。你可以通过\
  \ `man logrotate` 命令获取有关此文件中其他参数的更多信息。\n\n如果特定文件需要特定设置，你可以在 `/etc/logrotate.d` 中为该文件创建一个配置文件。该特定文件的设置将覆盖\
  \ `/etc/logrotate.conf` 中的默认设置。你会发现该目录下已经存在不同的文件，用于处理某些配置文件。\n\n### 使用 journald\n\
  \n`systemd-journald` 服务将日志消息存储在日志（journal）中，这是一个临时存储在 `/run/log/journal` 中的二进制文件。可以使用\
  \ `journalctl` 命令检查该文件。\n\n#### 使用 journalctl 查找事件\n\n使用 `journalctl` 最简单的方法是直接输入命令。它会显示自你的服务器上次启动以来写入日志的近期事件。该命令的结果显示在\
  \ `less` 分页器中，默认情况下你看到的是日志的开头。因为日志是从服务器启动那一刻开始写入的，所以这了与启动相关的日志消息。如果你想查看最后记录的消息，可以使用\
  \ `journalctl -f`，它会显示消息的最后几行并自动添加新的日志行。你也可以输入 `journalctl` 并使用（大写的）`G` 跳到日志末尾。还要注意搜索选项\
  \ `/` 和 `?` 在 `journalctl` 输出中是有效的。示例 13-5 显示了该命令的部分结果。\n\n```\n-- 日志开始于 Sat 2019-06-08\
  \ 04:45:34 EDT, 于 Sat 2019-06-08 04:56:11 EDT.\nJun 08 04:45:34 server1 kernel:\
  \ Linux version 4.18.0-el8.x86_64 (mockbuild@x86-vm-08)\nJun 08 04:45:34 server1\
  \ kernel: Command line: BOOT=(hd0,msdos1)/vmlinuz-4.18.0-e\nJun 08 04:45:34 server1\
  \ kernel: Disabled fast string\noperations\nJun 08 04:45:34 server1 kernel: x86/fpu:\
  \ Supporting XSAVE\nfeature 0x001: 'x87 floating po\nJun 08 04:45:34 server1 kernel:\
  \ x86/fpu: Supporting XSAVE\nfeature 0x002: 'SSE registers'\nJun 08 04:45:34 server1\
  \ kernel: x86/fpu: Supporting XSAVE\nfeature 0x004: 'AVX registers'\nJun 08 04:45:34\
  \ server1 kernel: x86/fpu: Supporting XSAVE\nfeature 0x008: 'MPX bounds regi\nJun\
  \ 08 04:45:34 server1 kernel: x86/fpu: Supporting XSAVE\nfeature 0x010: 'MPX CSR'\n\
  Jun 08 04:45:34 server1 kernel: x86/fpu: xstate_offset[2]:\n576, xstate_sizes[2]:\
  \  256\nJun 08 04:45:34 server1 kernel: x86/fpu: xstate_offset[3]:\n832, xstate_sizes[3]:\
  \   64\nJun 08 04:45:34 server1 kernel: x86/fpu: xstate_offset[4]:\n896, xstate_sizes[4]:\
  \   64\nJun 08 04:45:34 server1 kernel: x86/fpu: Enabled xstate\nfeatures 0x1f,\
  \ context size is 96\n```\n\n`journalctl` 之所以是一个灵活的命令，是因为它的许多过滤选项允许你显示精确所需的内容。练习\
  \ 13-3 展示了一了一些最有趣的选项。\n\n\n\n\n\n在之前的练习中，你输入了 `journalctl -o verbose` 来显示详细输出。示例\
  \ 13-6 展示了 `verbose` 输出的一个示例。如你所见，它为所有记录的项目提供了详细信息，包括 `PID`、关联的用户和组账户的 ID、关联的命令等。这些详细信息可能帮助你调试特定的\
  \ Systemd 单元。\n\n### 示例 13-6 使用 `journalctl -o verbose` 显示详细日志信息\n\n点击此处查看代码图像\n\
  \n```\n[root@server1 ~]# journalctl _SYSTEMD_UNIT=sshd.service -o verbose\n-- Logs\
  \ begin at Sat 2019-06-08 04:45:34 EDT, end at Sat 2019-06-08\n  05:01:40 EDT. --\n\
  Sat 2019-06-08 04:45:52.633752 EDT s=53e57e2481434e078e8306367dc5645c;\n  i=898;b=f35bb68348284f9ead79c3>\n\
