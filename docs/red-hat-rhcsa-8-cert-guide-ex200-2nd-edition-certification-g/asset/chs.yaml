  \ | 6 |\n| 使用 Automount 挂载远程文件系统 | 7–10 |\n\n**表 24-1** “已经掌握了吗？”章节与问题映射\n\n1. 应该使用哪个命令来列出\
  \ NFS 服务器提供的共享？\n1. `lsmount`\n2. `showmount -e`\n3. `lsexport`\n4. `showexport`\n\
  \n2. 下列哪项不是 NFSv4 的新功能？\n1. 与 Active Directory 集成\n2. Kerberos 安全性\n3. 在 TCP 端口\
  \ 2049 上提供的服务\n4. 根挂载 (root mount)\n\n3. 挂载 NFS 共享需要安装的包名称是什么？\n1. nfs-client\n\
  2. nfs\n3. nfs-utils\n4. nfs\n\n4. 你输入 `showmount -e` 来显示服务器上的挂载情况，但没有得到结果。最可能是以下原因？\n\
  1. NFS 客户端未运行\n2. 你使用的是不存在的 UID\n3. SELinux 未配置\n4. 防火墙未允许\n\n5. 你想登录 SMB 共享。下列哪种语法正确？\n\
  1. `mount -o user1//share`\n2. `mount -o username=user1//share`\n3. `mount user1@//share`\n\
  4. `mount -o username=user1@//share` \n\n6. 使用哪个命令发现 CIFS 共享？\n1. `showmount -e`\n\
  2. `smbmount -L`\n3. `smbclient -L`\n4. `showmount -l`\n\n7. 下列哪项不是配置 automount\
  \ 的必要步骤？\n1. 在 `auto.master` 中确定 automount 目录名称\n2. 在 `/etc` 创建间接文件\n3. 启动并启用 autofs\
  \ 服务\n4. 在本地挂载点设置适当权限\n\n8. 假设你想让 automount 监控的目录名为 `myfiles`，相应配置文件的推荐名称是什么？\n\
  1. `/etc/automount/auto.myfiles`\n2. `/etc/auto.myfiles`\n3. `/etc/myfiles.auto`\n\
  4. 没有推荐名称\n\n9. 下列哪行正确识别了使用 NFS 协议的通配符 automount 配置语法？\n1. `&rw server:/homes/*`\n\
  2. `&rw server:/homes/*`\n3. `*-rw server:/homes/*`\n4. `*rw server:/homes/*`\n\n\
  10. automount 使用的服务名称是什么？\n1. autofs\n2. automount\n3. autofiles\n4. auto\n\n\n\n\
  \n自 20 世纪 90 年代以来，NIS 不再被频繁使用。然而，NFS 仍然是一个非常流行的服务，主要因为它的速度快且易于配置。如果没有 NIS，提供基于用户的安全功能已被移除，这可能让\
  \ NFS 看起来像是一个不安全的解决方案。让我们来看一个例子：假设在 `server1` 上，用户 `linda` 的 UID 为 `1001`。在作为 NFS\
  \ 服务器的 `server2` 上，UID `1001` 被用户 `bob` 占用。在从 `server1` 成功连接到 `server2` 后，`server1`\
  \ 的用户 `linda` 将拥有与用户 `bob` 相同的 `server2` 资源访问权限。这显然是一个不希望的情况。\n\n为了防止这种情况的发生，你应该将\
  \ NFS 与集中式认证服务一起使用。通常使用轻量级目录访问协议 (LDAP) 和 Kerberos 的组合来提供此功能。NFS 与 LDAP 和 Kerberos\
  \ 的配置与集成未包含在 RHCSA 考试范围内，因此此处不再进行介绍。\n\n## RHEL 8 NFS 版本\n\n在 Red Hat Enterprise\
  \ Linux 8 上，NFS 4 是 NFS 的默认版本。如果在挂载 NFS 时，NFS 服务器提供了较早版本的 NFS，客户端将自动回退到该版本。从客户端来看，你也可以通过\
  \ `mount` 选项 `nfsvers=` 强制挂载时使用特定的 NFS 版本。如果你连接的是只提供 NFS 3 的服务器或设备，这种技术可能证明非常有用。幸运的是，这种类型的服务器或设备现在已越来越罕见了。\n\
  \n## 设置 NFS\n\n设置 NFS 服务器不是 RHCSA 考试的一部分。但是，为了练习你的 NFS 技能，建立你自己的 NFS 测试服务器是有用的。要实现这一点，你需要完成以下任务：\n\
  \n1. 创建一个你想要共享的本地目录。\n2. 编辑 `/etc/exports` 文件以定义 NFS 共享。\n3. 启动 NFS 服务器。\n4. 配置防火墙允许入的\
  \ NFS 流量。\n\n`练习 24-1` 将引导你完成这些步骤。\n\n## 挂载 NFS 共享\n\n要挂载 NFS 共享，你首先需要找到共享的名称。这些信息可以由管理员提供，但也可以自己发现。要发现哪些共享是可用的，你有多种选择：\n\
  \n* 如果服务器上使用了 NFSv4，可以使用根挂载（root mount）。这意味着你只需要挂载 NFS 服务器的根目录，在挂载点下你只会看到你有权的共享。\n\
  * 使用 `showmount -e nfsserver` 命令查找哪些共享是可用的。\n\n### 警告\n\n`showmount` 命令在防火墙后的 NFSv4\
  \ 服务器上可能会有问题。原因是 `showmount` 依赖于 `portmapper` 服务，该服务在建立连接时使用随机 UDP 端口，而 `firewalld\
  \ nfs` 服务仅开启端口 `2049`，这不允许 portmapper 流量。如果防火墙设置正确，还需要将 `mountd` 和 `rpc-bind` 服务添加到防火墙中。很有可能服务器上的共享已设置正确，但由于\
  \ `showmount` 无法通过防火墙导致看不到它们。如果你怀疑情况如此，请像 `练习 24-2` 所示那样使用 NFS 根挂载，或者直接尝试挂载 NFS\
  \ 共享。\n\n## 使用 CIFS 服务\n\n20 世纪 90 年代，微软发布了其服务器消息块 (SMB) 协议的技术规范。该协议是 Windows 环境中创建的所有共享的基础。发布这些规范导致了\
  \ Samba 项目的启动。该项目的目标是在 SMB 之上提供 SMB 服务。Samba Samba Samba Samba Samba Samba Samba\
  \ Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba\
  \ Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba Samba\
  \ Samba 20 世纪 90 年代，微软发布了其 Server Message Block (SMB) 协议的技术规范。该协议是 Windows 环境中创建的所有共享的基础。Samba\
  \ 已成为跨操作系统共享文件的事实标准解决方案。它现在通常被称为 CIFS（通用网络文件系统）。\n\n### 发现 CIFS 共享\n\n在挂载 CIFS 共享之前，你需要确保客户端安装了\
  \ `cifs-utils` 软件包。`smbclient` 命令可以发现哪些共享是可用的（如果遇到名称解析问题，可以使用 IP 地址代替名称）。`smbclient`\
  \ 命令会提示输入 Samba 密码。在不需要密码的情况下（如 `练习 24-1` 所示），使用 `smbclient` 命令可以列出共享。\n\n### 挂载\
  \ Samba 共享\n\n要挂载 Samba 共享，你可以使用 `mount` 命令。你可以使用 `-t cifs` 选项指定挂载的是 Samba 共享，但即使没有此选项，由于\
  \ `mount` 命令足够智能，它也能自动识别。如果共享允许访客访问，你可以指定 `-o guest` 选项以访客身份进行验证。或者，使用 `-o username=guest`\
  \ 选项来实现相同的目的。完整的 `mount` 命令如下：\n\n`此处查看代码示例`\n\n\n\n\n\n对于 RHCSA 考试，你不需要配置 Samba\
  \ 服务器。为了让你能够在自己的环境中练习 Samba，练习 24-3 将引导你完成设置 Samba 服务器所需的步骤。请在另一台名为 `server2.example.com`\
  \ 的独立服务器上执行这些步骤。请确保通过使用 `/etc/hosts` 设置了主机名解析，以便 `server1.example.com` 能够通过主机名访问该服务器。\n\
  \n在练习 24-4 中，你将学习如何从命令行发现并挂载 Samba 共享。\n\n## 通过 `fstab` 挂载远程文件系统\n\n现在你已经学会了如何从命令行手动挂载\
  \ `NFS` 和 `SMB` 文件系统。如果一个文件系统需要持久存在，则你需要使用不同的解决方案。挂载可以通过使用 `/etc/fstab` 文件或使用 `autofs`\
  \ 服务来实现自动挂载。在本节中，你将学习如何通过 `/etc/fstab` 进行挂载。如果你需要远程文件系统永久可用，这是一个方便的解决方案。\n\n###\
  \ 通过 `fstab` 挂载 NFS 共享\n\n正如你在前面的章节中学到的，`/etc/fstab` 文件用于挂载服务器重启时需要自动挂载的文件系统。只有\
  \ `root` 用户可以向此配置文件添加挂载项，从而为所有用户提供共享。`/etc/fstab` 文件也可以用于挂载 `NFS` 文件系统以及 `Samba`。要通过\
  \ `/etc/fstab` 挂载 `NFS` 文件系统，请确保包含以下行：\n\n点击此此处查看代码图片\n\n```\nserver1:/share /nfs/mount/point\
  \ nfs  sync  0 0\n```\n\n在通过 `fstab` 进行 `NFS` 挂载时，你有几个选项需要考虑：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   在第一列中，你需要指定服务器和共享名称。在服务器名称后使用冒号，以标识该挂载项为 `NFS` 共享。\n*   第二列是你想要执行挂载的文件系统；这与普通挂载没有区别。\n\
  *   第三列包含 `NFS` 文件系统类型。\n*   第四列用于指定挂载选项，包括 `sync` 选项。这确保了修改的文件立即提交到远程文件系统，而不是先放在写入缓冲区中（这会增加数据丢失的风险）。\n\
  *   第五列包含零，表示不请求通过 `dump` 工具进行备份支持。\n*   第六列也包含一个零，表示在启动时不需要对该文件系统执行 `fsck` 来检查文件系统的完整性。文件系统的完整性需要在服务器上进行检查，而不是在客户端检查。\n\
  \n### 通过 `fstab` 挂载 Samba 共享\n\n当通过 `/etc/fstab` 挂载 `Samba` 文件系统时，你需要考虑一个特定的挑战：你需要指定执行挂载所需的用户凭据。在\
  \ `NFS` 共享上，这一步是不必要的，因为访问共享文件系统的用户默认使用自己的凭据。在通过 `/etc/fstab` 挂载 `Samba` 共享时，这些用户凭据通常通过\
  \ `username=` 和 `password=` 挂载选项指定，但将这些明文放在 `/etc/fstab` 文件中并不是一个好主意。以下行显示了你如何自动挂载在练习\
  \ 24-3 中创建的文件系统：\n\n点击此此处查看代码图片\n\n```\n//server2/sambashare /sambamount  cifs username=linda,\n\
  password=password  0 0\n```\n\n## 使用 Automount 挂载远程文件系统\n\n作为使用 `/etc/fstab` 的替代方案，你可以配置\
  \ `automount` 来自动挂载共享。`automount` 可用于 `SMB` 以及 `NFS` 挂载，主要的区别在于通过 `automount` 挂载是按需触发的，而不是默认的。因此，使用\
  \ `automount` 可以确保不会挂载并不需要的文件系统。\n\n### 理解 Automount\n\n`automount` 由 `autofs` 服务实现，该服务在尝试访问共享时负责挂载它。这意味着它是按需挂载的，不需要永久挂载。使用\
  \ `automount` 的一个重要优点是它完全在用户空间中运行，并且与通过 `mount` 命令创建的挂载不同，它不需要 root 权限。\n\n### 在\
  \ Automount 中定义挂载\n\n在 `automount` 中，挂载通过两个步骤的过程来定义。首先，你需要编辑主配置文件 `/etc/auto.master`。在该目录中，你识别挂载点（例如\
  \ `/nfsdata`）。接下来，在同一行中，你识别辅助文件的名称，因为所有的后续配置都在辅助文件中进行。你创建的行可能如下：\n\n```\n/nfsdata\
  \    /etc/auto.nfsdata\n```\n\n在辅助文件中，你将将在挂载点目录中创建的子目录名称作为相对文件名放入。例如，你以 `files`\
  \ 开头，以挂载 `/nfsdata/files`。在子目录名称之后，你指定 `NFS` 挂载选项，以及访问 NFS 共享的服务器和共享名称。该行可能如下：\n\
  \n```\nfiles   -rw    server2:/nfsdata\n```\n\n### 为 NFS 配置 Automount\n\n配置 `automount`\
  \ 是多步骤的过程。为了展示它是如何工作的，练习 24-5 列出了所有步骤。\n\n### 在 Automount 中使用通配符\n\n在练习 24-5 中，你学习了如何基于固定目录名称执行自动挂载。在某些情况下，这并不有用，使用动态目录名称会更好。例如，家目录就是这种情况。\n\
  \n对于家目录，一个非常有用的解决方案是在当特定用户登录时自动挂载其家目录。例如，如果用户 `linda` 登录，她获得 `/linda` 的访问权限；当 `anna`\
  \ 登录时，她获得 `/anna` 的访问权限。要创建一个通配符挂载，你将使用类似 `* -home/**` 的行。在该行中，`*` 代表本地挂载点（代表任何内容），而\
  \ `&` 代表远程服务器上的匹配项。\n\n显然，你也可以选择导出 `/home` 目录并仅挂载 `/home` 目录，但这增加了用户 `anna` 访问用户\
  \ `linda` 家目录的风险。出于这个原因，使用通配符挂载是一个更整洁的解决方案，如练习 24-6 所示。\n\n### 总结\n\n在本章中，你学习了如何挂载远程文件系统以及如何配置\
  \ `automount`。你首先学习了如何从命令行手动挂载 `NFS` 或 `SMB` 文件系统。然后你学习了如何通过 `/etc/fstab` 或 `automount`\
  \ 将这些挂载自动化。在本章的最后一部分节中，你学习了如何设置 `FTP` 服务器以允许匿名文件上传。\n\n### 考试准备任务\n\n正如引言中“如何使用此书”节所示，你有几种准备考试的选择：章末实验、附录\
