  - 验证网络配置\n- 使用 `nmtui` 和 `nmcli` 管理网络配置\n- 设置主机名和名称解析\n\n本章涵盖了以下 RHCSA 考试目标：\n\n\
  - 配置 IPv4 和 IPv6 地址\n- 配置主机名解析\n\n网络是现代服务器上最重要的项目之一。在 RHEL 8 上，网络由 `NetworkManager`\
  \ 服务管理，随着 RHEL 7 的发布，引入了一些全新的工具来帮助管理网络。\n\n### 你准备好了吗？测验\n\n“你准备好了吗？”测验可以帮助评估你对本章内容的掌握程度。\n\
  \n\n\n\n3. `nmcli con add con-name \"static\" ifname eth0 type ethernet ipv4 10.0.0.10/24\
  \ gw4 10.0.0.1`\n\n4. `nmcli con add con-name \"static\" ifname eth0 autoconnect\
  \ no type ethernet ip4 10.0.0.10/24 gw4 10.0.0.1`\n\n**9.** 下列哪一项*不是*推荐的指定使用的 DNS\
  \ 服务器的方法？\n\n1. 编辑 `/etc/resolv.conf`。\n2. 在 `/etc/sysconfig/network-scripts/ifcfg-<ID>`\
  \ 中设置 DNS 选项。\n3. 使用 `nmcli` 设置 DNS 服务器名称。\n4. 使用 `nmtui` 设置 DNS 服务器名称。\n\n**10.**\
  \ 你会在哪个配置文件中设置主机名？\n\n1. `/etc/sysconfig/network`\n2. `/etc/sysconfig/hostname`\n\
  3. `/etc/hostname`\n4. `/etc/defaults/hostname`\n\n### 基础主题\n\n### 网络基础\n\n为了在服务器上建立网络，你的服务器在网络上需要一个唯一的地址。为了这个目的，使用了互联网协议（IP）地址。目前，有两个版本的\
  \ IP 地址是相关的：\n\n![](img/key_topic_icon.jpg)\n\n* **IPv4 地址：** 这些地址基于 32 位地址，由四个八字节组成，用点分隔，例如\
  \ `192.168.10.100`。\n* **IPv6 地址：** 这些地址基于 128 位地址，用八组十六进制数写成，每组 16 位，并用冒号分隔。一个\
  \ IPv6 地址看起来可能像 `fe80:badb:abe01:45bc:34ad:1313:6723:8798`。\n\n在本章中，你将学习如何使用 IPv4\
  \ 地址。IPv6 地址将仅进行简要描述。\n\n#### IP 地址\n\n最初，IP 地址被分配给计算机和路由器。现在，许多其他设备也需要 IP 地址进行通信，例如智能手机、工业设备以及几乎所有连接到互联网的设备。本章用*节点*（node）一词指代所有这些设备。你也会偶尔遇到*主机*（host）一词。主机通常是指在网络提供服务的服务器。\n\
  \n为了让计算机之间更容易通信，每个 IP 地址都属于一个特定的网络，为了与另一个网络上的计算机通信，则使用路由器。路由器是一种机器（通常是为该目的创建的专用硬件），它将网络连接在一起。\n\
  \n要在互联网上进行通信，每台计算机都需要一个全球唯一的 IP 地址。这些地址是稀缺的；理论上只有四十亿 IP 地址，这不足以为地球上的每个设备提供 IP 地址。IPv6\
  \ 是解决该问题的最终解决方案，因为 IPv6 中可以创建大量的 IP 地址。然而，由于许多网络仍在使用 IPv4，因此存在另一种解决方案：私有网络地址。\n\n\
  私有网络地址仅供内部网络使用的地址。某些特定的 IP 网络地址已为此目的进行了预留：\n\n![](img/key_topic_icon.jpg)\n\n* `10.0.0.0/8`（单个\
  \ A 类网络）\n* `172.16.0.0/12`（16 个 B 类网络）\n* `192.168.0.0/16`（256 个 C 类网络）\n\n当使用私有地址时，使用这些地址的节点无法直接访问互联网，互联网上的节点也无法访问它们。因为这不方便，连接私有网络和互联网的路由器上常用网络地址转换（NAT）。在\
  \ NAT 中，节点使用私有 IP 地址，但在访问互联网时，此私有 IP 地址会被替换为 NAT 路由器的 IP 地址。因此，互联网上的节点认为它们正在与 NAT\
  \ 路由器通信，而不是与单个主机通信。\n\nNAT 路由器反过来使用表格来跟踪网络中当前存在的所有连接。基于此表，NAT 路由器帮助具有私有 IP 地址的计算机连接到互联网上的主机。NAT\
  \ 的使用非常常见；它被嵌入在大多数用于家庭和小型企业网络的路由器中，这些路由器将网络中的计算机和其他设备连接到互联网。\n\n#### IPv6 地址\n\n\
  让我们来看一个有效的 IPv6 地址，例如 `02fb:0000:0000:0000:90ff:fe23:8998:1234`。在这个地址中，你可以看到出现了一长串零。为了让\
  \ IPv6 地址更具可读性，你可以用 `::` 替换范围零。此外，如果 IPv6 地址以前导零开头，你可以省略它。因此，之前提到的 IPv6 地址可以重写为\
  \ `2fb::90ff:fe23:8998:1234`。\n\n#### 网络掩码\n\n为了知道计算机属于哪个网络，每个 IP 地址都会使用子网掩码。子网掩码定义了网络地址的哪部分表示网络，哪部分表示节点。子网掩码可以使用无类网域间路由（CIDR）表示法写入，这表示子网掩码中的位数，或者用经典表示法，并且它们始终与网络地址一起指定。示例包括\
  \ `192.168.10.100/24`（CIDR 表示法），表示使用了 24 位的网络地址，以及 `192.168.10.100/255.255.255.0`（经典表示法），它们的意思完全相同。\n\
  \n通常，网络掩码使用多个字节。在使用 `192.168.10.100/24` 的示例中，前三个字节（`192.168.10` 部分）形成网络部分，最后一个字节（数字\
  \ `100`）是该网络上的主机部分。\n\n在讨论网络地址时，你使用 4 字节数，其中节点地址被设置为 `0`。因此在 `192.168.10.100/24`\
  \ 的示例中，网络地址是 `192.168.10.0`。在 IPv4 网络中，总有一个广播地址。\n\n#### 二进制表示法\n\n由于 IPv4 地址有限，现代\
  \ IPv4 使用变长掩码。这些是如 `212.209.113/27` 的网络掩码。当将子网掩码应用于 IP 地址时，你可以看到该字节的前 3 位属于网络，因此如果写出二进制形式会更清晰：\n\
  \n**IP 地址：**\n点击此处查看\n```\n212.209.113.33 = 11010100.11010101.01110101.0010001\n\
  ```\n\n**子网掩码：**\n点击此处查看\n```\n/27 = 11111111.11111111.11111111.11100000\n```\n\n\
  因此，基于这些信息，如果你再次考虑 IP 地址 `212.209.113.33/27`，你可以看到它属于网络 `212.209.113.32/27`，在该网络中广播地址（IP\
  \ 地址的节点部分设置为 1）为 `212.209.113.63`；因此，使用 /27 子网掩码每个网络可以有 30 个节点。你会得到 32 个 IP 地址，但其中两个是网络地址和广播地址，不能作为主机\
  \ IP 地址。\n\n表 8-2 提供了概述。\n\n| 二进制值 | 十进制值 |\n| --- | --- |\n| `00000000` | `0` |\n\
  | `00100000` | `32` |\n| `01000000` | `64` |\n| `01100000` | `96` |\n| `10000000`\
  \ | `128` |\n| `10100000` | `160` |\n| `11000000` | `192` |\n| `11100000` | `224`\
  \ |\n\n**表 8-2** 二进制-十进制转换概述\n\n考试提示\n\n\n\n\n你不需要在 RHCSA 考试进行这种计算，但它有助于理解 IP 网络寻址的工作原理。\n\
  \n## MAC 地址\n\nIP 地址是允许节点与互联网上任何其他节点通信的地址。然而，它们并不是唯一使用的地址。每个网卡都有一个 12 字节的 MAC 地址。MAC\
  \ 地址用于本地网络（即本地物理网络或本地局域网，一直到遇到的第一个路由器为止）；它们不能用于不同网络节点之间的通信。尽管如此，MAC 地址非常重要，因为它们帮助计算机找到\
  \ IP 地址所属的特定网卡。\n\nMAC 地址的一个示例是 `00:0c:29:7d:9b:17`。注意每个 MAC 地址由两部分组成：前 6 个字节是供应商\
  \ ID（Vendor ID），后 6 个字节是唯一的节点 ID（Node ID）。供应商 ID 是经过注册的，通过使用注册过的供应商 ID，可以分配唯一的 MAC\
  \ 地址。\n\n## 协议与端口\n\n在上一节中，你学习了如何使用 IP 地址来识别单个节点。在这些节点上，你通常会运行一些服务，例如 Web 服务器或 FTP\
  \ 服务器。为了识别这些服务，使用了端口地址。每个服务都有特定的端口地址，例如用于超文本传输协议（HTTP）的端口 80 或用于安全外壳（SSH）服务器的端口\
  \ 22。在网络通信中，发送方和接收方都使用端口地址。因此，网络通信涉及目的端口地址和源端口地址。\n\n由于并非所有服务都以相似的方式进行，IP 地址和端口地址之间使用了特定的协议，例如传输控制协议（TCP）、用户数据报协议（UDP）或互联网控制消息协议（ICMP）。每个协议都有特定的属性：当网络通信必须可靠且必须保证交付时，通常使用\
  \ TCP；当必须快速且不需要保证交付时，则使用 UDP。\n\n## 管理网络地址和接口\n\n作为 Linux 服务器管理员，你需要管理网络地址和网络接口。网络地址可以通过两种方式分配：\n\
  \n![](img/key_topic_icon.jpg)\n\n* **固定 IP 地址：** 适用于始终需要以相同 IP 地址提供的服务器。\n* **动态分配的\
  \ IP 地址：** 适用于终端用户的设备以及云环境中的实例。要动态分配 IP 地址，你通常会使用动态主机配置协议（DHCP）服务器。\n\n长期以来，Linux\
  \ 中的网卡拥有默认名称，例如 `eth0`、`eth1` 和 `eth2`。这种命名是基于网卡的检测顺序分配的。因此，`eth0` 是第一个被检测到的网卡，`eth1`\
  \ 是第二个，依此类推。这在节点仅有一个或两个网卡的环境中运行良好良好。然而，如果一个节点有多个需要动态添加和删除的网卡，这种方法就没那么好用了，因为非常难以识别哪块物理网卡在使用哪个名称。\n\
  \n在 RHEL 8 中，网卡的默认名称基于固件、设备拓扑结构和设备类型。这导致网卡名称始终包含以下部分：\n\n* 以太网接口以 `en` 开头，WLAN 接口以\
  \ `wl` 开头，WWAN 接口以 `ww` 开头。\n* 名称的后续代表适配器的类型。`o` 用于板载（onboard），`s` 用于热插槽（hotplug\
  \ slot），`p` 用于 PCI 位置。管理员还可以使用 `x` 创建基于网卡 MAC 地址的设备名称。\n* 随后是一个数字，用于表示索引、ID 或端口。\n\
  * 如果无法确定固定名称，则使用如 `eth0` 这样的传统名称。\n\n基于这些信息，可以使用如 `eno16777734` 的设备名称，它代表板载以太网设备及其唯一的索引号。\n\
  \n除了这种默认设备命名外，网卡还可以根据 BIOS 设备名称进行命名。在这种命名方案中，可以使用如 `em1`（嵌入式网卡 1）或 `p4p1`（即 PCI\
  \ 插槽 4，端口 1）等名称。要使用这种命名，必须安装 `biosdevname` 包。\n\n## 验证网络配置\n\n在学习如何设置网络之前，你需要知道如何验证当前的网络信息。在本节中，你将学习如何这样做，并学习如何检查以下网络项目：\n\
  \n* IP 地址和子网掩码\n* 路由\n* 端口和服务的可用性\n\n### 验证网络地址配置\n\n要验证网络地址的配置，你需要使用 `ip` 实用程序。`ip`\
  \ 工具是一个现代工具，可以考虑最近引入的高级网络功能。通过 `ip` 工具，可以监控内核的许多方面：\n\n* 使用 `ip addr` 配置并监控网络地址。\n\
  * 使用 `ip route` 配置并监控路由信息。\n* 使用 `ip link` 配置并监控网络链路状态。\n\n除了这些项目，`ip` 工具还可以管理网络的许多其他方面，但你不需要在\
  \ RHCSA 考试中了解它们。\n\n**警告**\n\n在早期的 Linux 版本和一些其他类 Unix 操作系统中，`ifconfig` 工具过去和现在仍用于验证网络配置。不要在现代\
  \ Linux 发行版中使用此工具。由于 Linux 已经成为云计算中的重要参与者，网络为了匹配云计算需求已经发生了巨大演变，Linux 网络中添加了许多新功能。使用\
  \ `ifconfig` 工具，你无法管理这些概念。即使 `ifconfig` 在某些操作系统（如 Apple OS）上仍然是默认，你也永远不要使用它。\n\n\
  要显示当前的网络设置，可以使用 `ip addr show` 命令（缩写为 `ip s` 甚至 `ip a`）。`ip` 命令相对智能，不需要你输入完整的选项。\n\
  \n`ip addr show` 命令的结果类似于示例 8-1。\n\n**示例 8-1 使用 ip addr 监控当前配置**\n\n```\n[root@server1\
  \ ~]# ip addr show\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state\
  \ UNKNOWN\n   group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    inet 127.0.0.1/8 scope host\n       valid_lft forever preferred_ft forever\n\
  \    inet6 ::1/128 scope host \n       valid_lft forever preferred_ft forever\n\
  2: ens33: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel\n   state UP\
  \ group default qlen 1000\n    link/ether 00:0c:29:50:9e:c9 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 192.168.4.210/24 brd 192.168.4.255 scope global dynamic\n      noprefixroute\
  \ ens33\n       valid_lft 1370sec preferred_ft 1370sec\n    inet6 fe80::959:3b1a:9607:8928/64\
  \ scope link noprefixroute \n       valid_lft forever preferred_ft forever\n```\n\
  \n在该命令的结果中，你看到了计算机所有网络接口的列表。你通常会看到至少两个接口，但在特定配置下，会有更多接口。在示例 8-1 中，显示了两个接口：回环接口 lo\
  \ 和板载以太网卡 ens33。\n\n该命令显示了其当前状态的以下项目：\n\n\n\n\n\n*   **当前状态：** 这一行最重要的部分是文本状态 `UP`，它表示该网卡目前处于启用可用状态。\n\
  \n*   **MAC 地址配置：** 这是为每个网卡设置的唯一 MAC 地址。你可以看到 MAC 地址本身（`00:0c:29:50:9e:c9`）以及相应的广播地址。\n\
  \n*   **IPv4 配置：** 这一行显示了当前设置的 IP 地址以及使用的子网掩码。你还可以看到用于此网络配置的广播地址。请注意，在某些接口上你可能会发现多个\
  \ IPv4 地址。\n\n*   **IPv6 配置：** 这一行显示了当前的 IPv6 地址及其配置。即使你没有配置任何内容，每个接口会自动获得一个 IPv6\
  \ 地址，该地址仅用于局域网通信。\n\n如果你只对网络接口的链路状态感兴趣，可以使用 `ip link show` 命令。该命令（你可以在示例 8-2 中查看输出）重复了\
  \ `ip addr show` 命令的链路状态信息。如果你添加了选项 `-s`，还可以查看当前的链路统计，其中提供了数据包传输和接收的信息，以及数据包传输期间错误的概述。\n\
  \n**示例 8-2** `ip link show` 输出\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# ip -s link\
  \ show\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\n  mode\
  \ DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    RX: bytes  packets  errors  dropped overrun mcast   \n    0          0    \
  \    0       0       0       0       \n    TX: bytes  packets  errors  dropped carrier\
  \ collsns \n    0          0        0       0       0       0       \n2: ens33:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel\n  state UP mode DEFAULT\
  \ group default qlen 1000\n    link/ether 00:0c:29:50:9e:c9 brd ff:ff:ff:ff:ff:ff\n\
  \    RX: bytes  packets  errors  dropped overrun mcast   \n    143349     564  \
  \    0       0       0       0       \n    TX: bytes  packets  errors  dropped carrier\
  \ collsns \n    133129     541      0       0       0       0\n```\n\n如果 `ip link\
  \ show` 命令显示的当前链路状态为 `down`，你可以使用 `ip link set` 临时将其启用，后面跟着 `dev devicename` 和 `up`（例如，`ip\
  \ link set dev ens33 up`）。\n\n在练习 8-1 中，你将学习如何使用 `ip` 工具和其他工具管理和监控网络。\n\n#### 验证路由\n\
  \n网络配置的一个重要方面是路由。在每个需要与其他网络上的节点通信的网络中，路由都是的一项要求。每个网络至少设置了一个默认路由器（也称为默认网关），你可以使用\
  \ `ip route show` 命令查看使用哪个路由器作为默认路由器（参见示例 8-3）。你始终应该进行一次快速检查，以验证路由器是否设置正确：默认路由器必须始终与网卡正在使用的本地\
  \ IP 地址处于同一网络上。\n\n**示例 8-3** `ip route show` 输出\n\n点击此处查看代码图像\n\n```\n[root@server1\
  \ ~]# ip route show\ndefault via 192.168.4.2 dev ens33 proto dhcp metric 100 \n\
  192.168.4.0/24 dev ens33 proto kernel scope link src 192.168.4.210\n   metric 100\
  \ \n192.168.122.0/24 dev virbr0 proto kernel scope link src 192.168.122.1\n   linkdown\n\
  ```\n\n在示例 8-3 中，最重要的部分是第一行。它显示默认路由通过（“via”）IP 地址 `192.168.4.2`，并显示必须使用网络接口 `ens33`\
  \ 来访问该 IP 地址。该行显示此默认路由是由 DHCP 服务器分配的。指标值（metric）用于当同一目的地有多个可用路由时。在这种情况下，将使用指标值最低的路由。这在路由器设备上很重要，但在不是路由器的计算机上，指标值并不真正重要。\n\
  \n接下来，你可以看到标识本地连接网络的行。当你启动系统时，每个本地网络都会添加一个条目，在本例中，这适用于网络 `192.168.4.0` 和 `192.168.122.0`。这些路由是自动生成的，不需要进行手动管理。\n\
  \n#### 验证端口和服务的可用性\n\n网络问题可能与本地 IP 地址和路由器设置有关，也可能与你的服务器或远程服务器上不可用的端口有关。要验证服务器上端口的可用性，你可以使用\
  \ `netstat` 命令或提供相同功能的较新的 `ss` 命令。练习 8-2 显示了如何验证网络设置。通过输入 `ss -lt`，你可以看到本地系统上所有监听\
  \ TCP 端口（参见示例 8-4）。\n\n**示例 8-4** 使用 `ss -lt` 显示本地系统上的所有监听端口\n\n点击此处查看代码图像\n\n```\n\
  [root@server1 ~]# ss -lt\nState      Recv-Q      Send-Q         Local Address:Port\
  \         Peer\nAddress:Port      \nLISTEN     0           32             192.168.122.1:domain\
  \            \n0.0.0.0:* \nLISTEN     0           128                  0.0.0.0:ssh\
  \               \n0.0.0.0:* \nLISTEN     0           5                  127.0.0.1:domain\
  \            \n127.0.0.1:\n```\n```\n\n注意端口在何处监听。某些端口仅在 IPv4 回环地址 `127.0.0.1` 或\
  \ IPv6 回环地址 `::1` 上监听，这意味着它们在本地可访问，无法从外部机器访问。其他端口监听在 `*` 上，代表所有 IPv4 地址，或者监听在 `:::`\
  \ 上，代表所有 IPv6 地址上的所有端口。\n\n### 使用 nmtui 和 nmcli 配置网络配置\n\n正如本章前面提到的，RHEL 8 网络由 NetworkManager\
  \ 服务管理。你使用 `systemctl status NetworkManager` 命令来验证其当前状态。当 NetworkManager 启动时，它会读取网卡配置脚本，这些脚本位于\
  \ `/etc/sysconfig/network-scripts`，并且名称以 `ifcfg` 开头，后跟网卡名称。\n\n在 RHEL 8 中进行网络配置时，你应该知道设备和连接的区别：\n\
  \n*   设备（device）是网络接口卡。\n*   连接（connection）是设备上使用的配置。\n\n在 RHEL 8 中，你可以为设备创建多个连接。这在移动计算机上是有意义的，例如，区分区分连接家庭网络的设置和用于连接公司网络的设置。在设备上切换连接在终端用户计算机上常见，但在服务器上并不常见。要管理你想分配给设备的网络连接，你可以使用\
  \ `nmtui` 命令或 `nmcli` 命令。\n\n**考试提示**\n\n红帽希望你了解如何使用 `nmcli`。然而，这个命令并不非常易用，而且在考试中你最终需要为网络设备配置适当的设置。因此，在\
  \ RHCSA 考试中，完全可以使用 `nmtui` 文本用户界面命令；使用该命令会让你的工作变得容易得多。\n\n#### 修改网络配置所需的权限\n\n\n\
  \n\n显然，root 用户可以对当前网络进行修改。然而，如果普通用户登录到本地控制台，该用户同样能够更改网络配置。只要用户使用系统键盘进入图形控制台或文本控制台，就会被授予这些权限。这是因为用户被认为应该能够将其本地系统到网络。请注意，使用\
  \ `ssh` 连接到服务器的普通用户是不允许更改网络配置的。要检查您当前的权限，请使用 `nmcli gen permissions` 命令，如图 8-1 所示。\n\
  \n![截图显示了带有用户当前权限的控制台](img/08fig01.jpg)\n\n**图 8-1** 验证更改网络配置的当前权限\n\n### 使用 nmcli\
  \ 配置网络\n\n在本章较早些时候，你学习了如何使用 `ip` 来验证网络配置。你还应用了 `ip addr add` 命令来在网络接口上临时设置 IP 地址。然而，你使用\
  \ `ip` 命令执行的所有操作都是非持久化的。如果你想让配置具有持久性，请使用 `nmtui` 或 `nmcli`。\n\n良好的开始是使用 `nmcli`\
  \ 显示所有连接。这会显示激活和未激活的连接。你可以轻松地看出区别，因为未激活的当前没有分配给设备（参见示例 8-5）。\n\n**示例 8-5** 显示当前连接状态\n\
  \n点击此处查看代码\n\n```\n[root@server1 ~]# nmcli con show\nNAME    UUID              \
  \                       TYPE           DEVICE \nens33   db6f53bd-654e-45dd-97ef-224514f8050a\
  \     ethernet       ens33\n```\n\n找到连接名称后，你可以使用 `nmcli con show` 加上连接名称来查看连接的所有属性。注意，此命令显示了许多属性。示例\
  \ 8-6\n\n\n\n\n```\n[root@server1 ~]# nmcli con show ens33\nconnection.id:     \
  \                        ens33\nconnection.uuid:                           db6f53bd-654e-45dd-97ef-\n\
