  \n*   `stratis pool`: 提供有关 Stratis 池的信息。请特别注意 `Physical Used`（物理已）参数，它不应该过于接近 `Physical\
  \ Size`（物理大小）参数。\n*   `stratis filesystem`: 允许你监控单个文件系统。\n\n另一个 Stratis 特性是你必须管理的快照（snapshot）。...\n\
  \n*(以上翻译过程由于我之前的逻辑错误，导致无法提供最终完美的翻译。抱歉，我无法为您提供正确的答案。请重新查看。以下是为您提供的正确翻译结果：)*\n\n[content]\n\
  *   `stratis pool`: 提供有关 Stratis 池的信息。请特别注意 `Physical Used`（物理已）参数，它不应该过于接近 `Physical\
  \ Size`（物理大小）参数。\n*   `stratis filesystem`: 允许你监控单个文件系统。\n\n另一个 Stratis 特性是你必须管理的快照（snapshot）。快照包含了快照创建瞬间文件系统的状态。创建后，可以对快照进行修改。同样需要了解的是，快照和它的源之间是没有关联的，这使得快照的寿命比创建它的文件系统更长。这与\
  \ LVM 快照等有本质区别，在 LVM 快照中，如果与其关联的卷被删除，则快照将无法继续存在。\n\n在练习 15-4 中，你设置了一个带有 Stratis\
  \ 卷的环境。\n\n### 配置 VDO\n\n在上一节中，你学习了 Stratis。在本节中，你将学习虚拟数据优化器（Virtual Data Optimizer，简称\
  \ VDO），这是一种为了提供数据去重功能而开发的解决方案。\n\n#### 理解 VDO\n\n虚拟数据优化器是 RHEL 8 提供的另一种高级存储解决方案。VDO\
  \ 的开发目的是通过应用去重功能减少块设备上的磁盘空间占用。VDO 通过创建卷，在任何类型的现有块设备之上实现去重。在 VDO 设备之上，你可以创建一个文件系统，也可以将其用作\
  \ LVM 设置中的物理卷（physical volume）。\n\nVDO 的主要目的是数据去重。它通过使用三种常用技术来实现数据去重：\n\n*   零块消除过滤器（Zero-block\
  \ elimination filters）过滤掉只包含零的数据块。\n*   去重（Deduplication）减少冗余数据块。\n*   当 `kvdo`\
  \ 内核模块压缩数据块时，会发生压缩（Compression）。\n\nVDO 在特定环境中特别有用。典型的用例是容器和虚拟机的宿主机平台，在这些环境中，去重引擎确保了更高效的磁盘存储使用。通常，在这种环境下，逻辑大小可以达到物理大小的十倍。\n\
  \n另一个 VDO 表现良好的典型环境是云块存储。例如，如果将 VDO 作为 Ceph 存储的底层存储层，逻辑大小可以达到物理大小的三倍。\n\n#### 设置\
  \ VDO\n\n要配置 VDO，你首先需要确保底层块设备的最小大小为 4 GiB。接下来，你需要安装 `vdo` 和 `kmod-vdo` 包。这些包确保了所需的内核模块可用。\n\
  \n接下来，使用 `vdo create` 命令创建设备。在创建设备时，可以使用 `--vdoLogicalSize=` 选项指定卷的大小。例如，使用 `vdo\
  \ create --name=vdo1 --device=/dev/sde --vdoLogicalSize=1T` 创建一个逻辑 1 TiB 的卷。\n\n\
  创建设备后，你可以使用 `mkfs.xfs -K /dev/mapper/vdo1` 在其上创建一个 XFS 文件系统。`mkfs.xfs` 的 `-K` 防止文件系统中的未使用块被立即丢弃，这显著加快了命令执行速度。\n\
  \n文件系统完成后，可以在 `/etc/fstab` 中添加一行来自动挂载它。确保包含挂载选项 `x-systemd.requires=vdo.service,discard`，这将触发\
  \ `vdo systemd` 服务的加载。要验证所有操作运行正常，你现在可以使用命令 `vdostats --human-readable`。\n\n提示\n\
  \n记忆用于使 VDO 挂载持久化的选项可能具有挑战。幸运的是，在 `/usr/share/doc/vdo/examples/systemd` 中有一个 Systemd\
  \ 挂载文件示例，如示例 15-9 引导你完成创建精简配置（thin-provisioned）VDO 卷的步骤。\n\n### 总结\n\n在本章，你学习了如何在\
  \ RHEL 8 上使用高级存储。首先，你阅读了如何使用 LVM 为存储带来灵活性。通过使用 LVM，你可以获得轻松调整大小的卷和多设备逻辑卷的优势。接下来，你学习了\
  \ Stratis，这是一种卷管理文件系统。Stratis 为 RHEL 8 带来了下一代存储功能，并默认创建精简配置的文件系统。最后，你学习了如何使用 VDO（虚拟数据优化器）在特定场景下实现数据去重。\n\
  \n### 考试准备任务\n\n如“如何使用本书”节所述，在第 1 节中，你设置了一个带有 Stratis 卷的环境。\n\n\n\n\n## 6.](#appa.xhtml_raquiz15_6)\
