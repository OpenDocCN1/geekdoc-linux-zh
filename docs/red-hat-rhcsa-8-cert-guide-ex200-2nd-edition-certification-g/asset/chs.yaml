  3. `-d`\n4. `-D`\n\n### 基础主题\n\n### 理解 LVM\n\n在 Linux 服务的早期时代，存储是通过在磁盘上创建分区来处理的。尽管这种方法可行，但存在一些缺点，最重要的一点是磁盘缺乏活性。这就是引入逻辑卷管理器（Logical\
  \ Volume Manager）的原因。虽然无法动态扩展磁盘空间不足的分区，但在使用 LVM 时这是可以实现的。LVM 还提供了许多其他优势，你将在本章中学习。\n\
  \n#### LVM 架构\n\n在 LVM 架构中，可以区分出几个层。在最底层，使用的是存储设备。这些设备可以是任何存储设备，例如完整的磁盘、分区、存储区域网络（SAN）上的逻辑单元（LUN），以及现代存储拓扑中实现的任何其他设备。在本章中，你将学习如何使用分区作为物理卷，这是推荐的做法。通过使用分区而不是整个磁盘设备，其他工具很容易识别出块设备上已经配置了某些存储，这减少了发生配置错误的可能性。\n\
  \n存储设备需要被标记为物理卷，这样它们在 LVM 环境中才可用，并且让尝试访问逻辑卷的其他实用程序可以使用。作为物理卷的存储设备可以添加到卷组中，卷组是所有可用存储的抽象。“抽象”意味着卷组不是固定的，而是可以根据需要调整大小，这使得在逻辑卷磁盘空间不足时，在卷组层面添加更多空间成为可能。这个想法非常简单：如果逻辑卷的磁盘空间用尽了，你就从卷组中获取可用磁盘空间。如果卷组中没有可用磁盘空间，你只需通过添加物理卷来增加空间。\n\
  \n卷组之上是逻辑卷。逻辑卷不直接作用于磁盘，而是从卷组的可用磁盘空间获取磁盘空间。这意味着一个逻辑卷可能由来自多个物理卷的可用存储组成，这为存储配置增加了一个重要的额外灵活性。\n\
  \n**注意**\n\n避免逻辑卷跨越多个物理卷是一个好主意；如果其中一个物理卷损坏，LVM 文件系统上的所有文件将变得无法访问。\n\n实际的文件系统是在逻辑卷上创建的。因为逻辑卷的大小上是灵活的，这使得文件系统也具有灵活性。如果文件系统的磁盘空间不足，扩展文件系统是相对容易的，或者在文件系统允许的情况下缩小它。请注意，为了在调整逻辑卷大小时同时调整文件系统大小，文件系统必须提供相应的支持。\n\
  \n图 15-1 提供了 LVM 架构的概述。\n\n![](img/key_topic_icon.jpg)![显示了 LVM 架构的图。它由底层的磁盘组成。这引向下一层的卷组，卷组再引向逻辑卷。图中指示逻辑卷可以调整大小。逻辑卷引向文件系统。](img/15fig01.jpg)\n\
  \n**图 15-1** LVM 架构概述\n\n#### LVM 特性\n\nLVM 之所以优秀有几个原因。最重要的法是 LVM 为管理存储提供了一个灵活的解决方案。卷不再受限于物理硬盘的限制。如果需要额外的存储空间，可以通过添加新的物理卷来轻松扩展卷组，从而为逻辑卷添加磁盘空间。缩小逻辑卷的大小也是可能的，但前提是创建在逻辑卷上的文件系统支持该功能。\n\
  \n管理员喜欢使用 LVM 的另一个重要原因是它对快照（snapshots）的支持。*快照*保留了逻辑卷当前的状态，可以恢复到之前的状态，或在逻辑卷打开时对文件系统进行备份。\n\
  \nLVM 快照是将描述当前状态的逻辑卷管理数据（元数据）复制到快照卷创建的。只要没有变化，就可以通过快照访问原始块。当块被修改时，包含之前状态的块会被复制到快照卷，因此快照卷会增长。使用这种方法确保了通过访问\
  \ LVM 快照卷，可以访问创建快照时的确切状态。由于快照会在原始卷文件更改时增长，因此在计划快照时，你应该确保有足够的磁盘空间。此外，快照应该是暂时的：一旦快照完成了任务，就可以删除。\n\
  \n使用 LVM 逻辑卷的第三个重要优势是可以轻松更换故障硬件。如果硬盘故障，可以在卷组内部移动数据（通过 `pvmove` 命令），然后从卷组移除故障磁盘，并动态添加新硬盘，而无需逻辑卷中断。\n\
  \n### 创建 LVM 逻辑卷\n\n创建 LVM 逻辑卷涉及创建 LVM 架构中的三个层。你首先将物理设备（如磁盘或分区）转换为物理卷（PV）；然后你需要创建卷组（VG）并将\
  \ PV 分配给它。最后一步是创建逻辑卷（LV）本身。在本节，你将学习有关创建这三个层的内容。\n\n创建 LVM 逻辑卷有多种工具。本章重点关注使用命令行工具。它们相对容易使用，并且在所有环境中可用（无论你是否运行了图形界面）。\n\
  \n提示\n\n\n\n\n\n你完全不需要为了 RHCSA 考试记忆本章中讨论的命令。你真正需要记住的是 `pv`、`vg` 和 `lv`。打开命令行，输入\
  \ `pv` 并按两次 Tab 键。这将会显示所有以 `pv` 开头的命令，这些命令都是用于管理物理卷的。找到你需要的命令后，使用 `--help` 选项运行该命令。这会显示一个用法摘要，列出了创建你所需的元素时必须执行的所有操作。示例\
  \ 15-1 显示了 `pvcreate --help` 命令的一个示例（将在下一个小节中进行解释）。\n\n### 示例 15-1 为 `pvcreate`\
  \ 命令请求帮助\n\n点击此处查看代码图像\n\n```\n[root@control ~]# pvcreate --help\n  pvcreate - Initialize\
