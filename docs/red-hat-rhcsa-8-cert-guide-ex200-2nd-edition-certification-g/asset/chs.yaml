  # 进程管理\n\n**本章涵盖了以下主题：**\n\n* 进程管理简介\n* 管理 Shell 作业\n* 使用常用的命令行工具管理进程\n* 使用 `top`\
  \ 管理进程\n* 使用 `tuned` 优化性能\n\n本章涵盖以下 RHCSA 考试目标：\n\n* 识别 CPU/内存密集型进程并杀死进程\n* 调整进程调度\n\
  \n进程管理是 Linux 管理员的一项重要任务。在本章中，你将学习从服务器日常运行的角度管理进程所需的知识。你将学习如何处理 Shell 作和通用进程。你还将学习使用\
  \ `tuned` 进行系统性能优化。\n\n### “我已经熟悉这些了吗？”测试\n\n“我已经熟悉这些了吗？”测试可以让你评估自己应该仔细阅读整个章节，还是跳转到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
