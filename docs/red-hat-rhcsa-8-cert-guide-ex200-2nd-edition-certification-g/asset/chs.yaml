  本章涵盖了以下 RHCSA 目标：\n\n* 在 RHEL 上管理容器\n\n容器彻底改变了数据中心。在不久以前，服务还直接运行在服务器系统之上，而现在服务通常以容器的形式提供。Red\
  \ Hat Linux 8 包含了一个完整的运行平台。在本章中将学习如何与它们一起。\n\n### “我已经学会了吗？”测试\n\n“我已经学会了吗？”测试可以让你评估自己是应该仔细阅读本章，还是直接跳到“考试准备”部分。如果你对这些问题的答案或对这些主题的自我评估有疑问，请阅读整个章节。表\
