  \n### 基础主题\n\n### 理解本地时间\n\n当 Linux 服务器启动时，会读取硬件时钟（也称为实时时钟）。该时钟通常位于计算机硬件中，它定义的时间被称为硬件时间。通常，它是主板上的一个集成电路，只要主板电池或电源为其供电，就能持续运行。系统从硬件时钟获取初始时间设置。\n\
  \nLinux 服务器上的硬件时钟时间通常设置为协调世界时 (UTC)。UTC 是全球范围内统一的时间，并根据 UTC 计算出当前的本地时间。（在本章稍后的部分你将学习它是如何工作的。）\n\
  \n*系统时间*由操作系统维护。一旦系统启动，系统时钟与硬件时钟完全独立。因此，当更改系统时间时，新的系统时间不会自动同步到硬件时钟。\n\n操作系统维护的系统时间采用\
  \ UTC。在服务器上的应用程序将系统时间转换为本地时间。本地时间是当前时区的实际时间。在本地时间中考虑了夏令时 (DST)，使其始终显示准确的时间。表 25-2\
  \ 概述了在 Linux 时间中起的不同概念。\n\n| 概念 | 解释 |\n| --- | --- |\n| 硬件时钟 | 位于计算机系统主板上的硬件时钟\
  \ |\n\n\n\n\n\n| 实时时钟 | 与硬件时钟相同 |\n| --- | --- |\n| 系统时间 | 由操作系统维护的时间 |\n| 软件时钟\
  \ | 与系统时间相似 |\n| 协调世界时 (UTC) | 全球标准时间 |\n| 夏令时 | 当发生夏令时变化时自动更改时间的计算 |\n| 本地时间 |\
  \ 与当前时区对应的时间 |\n\n**表 25-2** 理解 Linux 时间\n\n### 使用网络时间协议 (NTP)\n\n正如你所学到的，当前系统时间基于硬件时钟。此硬件时钟通常是计算机主板的一部分，它可能是不可靠的。由于其潜在的不可靠性，使用来自更可靠源的时间是一个好主意。通常情况下，有两种解决方案。\n\
  \n一种方案是购买更可靠的硬件时钟。例如，直接连接到计算机的非常精确的原子钟。当使用这种非常可靠的时钟时，可以保证系统时间的准确性提高。使用外部硬件时钟是保证数据中心时间的常用解决方案，即使暂时无法用于时间同步的外部网络连接也是如此。\n\
  \n另一种更常见的解决方案是配置你的服务器使用网络时间协议 (NTP)。NTP 是一种通过互联网上的 NTP 服务器提供的维护系统时间的方法。为服务器提供准确时间是一项简单的解决方案，因为大多数服务器本身都连接到互联网。\n\
  \n要确定应该使用哪个互联网 NTP 服务器，使用了“层级 (stratum)”的概念。层级定义了 NTP 时间源的可靠性，层级越低，越可靠。通常，互联网时间服务器使用层级\
  \ 1 或 2。在配置本地时间服务器时，你可以使用较高的层级数字将本地时间服务器配置为备份，但当互联网时间可用时，它永远不会被使用。\n\n这是一个良好的实践，例如，在具有非常可靠硬件时钟的本地时间服务器上设置层级\
  \ 5，在不不太可靠的本地时间服务器上设置层级 8。每个使用 NTP 时间的节点上的本地时钟可以使用层级 10 的设置。这使得服务器在没有外部连接时仍具有同步的时间。层级\
  \ 15 用于那些希望表示自己不应被用于时间同步的时钟。\n\n![](img/key_topic_icon.jpg)\n\n如果服务器已经连接到互联网，在 RHEL\
  \ 8 上设置服务器使用 NTP 时间是非常简单的。如果是这样，`/etc/chrony.conf` 文件中配置了一组应该连接的互联网标准 NTP 服务器列表。管理员需要做的仅仅是使用\
  \ `timedatectl set-ntp 1` 开启 NTP。\n\n### 在 Red Hat Enterprise Linux 上管理时间\n\n在 Red\
  \ Hat Enterprise Linux 上管理时间涉及不同的命令。表 25-3 提供了概述。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 命令 | 简短描述 |\n| --- | --- |\n| `date` | 管理本地时间 |\n| `hwclock` | 管理硬件时间 |\n| `timedatectl`\
  \ | 开发用于管理 RHEL 8 上所有时间方面 |\n\n**表 25-3** 与 RHEL 8 时间管理相关的命令\n\n![](img/key_topic_icon.jpg)\n\
  \n在 Linux 系统上，时间被计算为 Unix 时间 (epoch time) 的偏移量。*Epoch 时间*是自 UTC 区域的 1970 年 1 月 1\
  \ 日以来的秒数。在某些日志（例如 `/var/log/audit/audit.log`）中，你会发现 Epoch 时间的时间戳，而不是人类可读的时间。要将此类\
  \ Epoch 时间戳转换为人类可读的时间，你可以使用 `--date` 选项，后跟以 @ 开头的 Epoch 字符串：\n\n```\ndate --date\
  \ '@1420987251'\n```\n\n使用 Epoch 时间在 Linux 上也产生了一个潜在的时间问题。在 32 位系统上，预留用于时间表示的字段可以计数的秒数将在\
  \ 2037 年超过。（如果你使用的是 32 位内核，尝试将时间设置为 2050 年的某个时候；它将无法工作。）然而，64 位系统可以访问一直到 22 世纪遥远的时间。\n\
  \n#### 使用 date\n\n`date` 命令允许你管理系统时间。你也可以用它显示不同格式的当前时间。这里列出了 `date` 的一些常用用法示例：\n\
  \n* `date:` 显示当前系统时间\n* `date +%d-%m-%y:` 显示当前的系统日期、月份和年份\n* `date -s 16:03:` 将当前时间设置为下午\
  \ 4 点后 3 分钟\n\n#### 使用 hwclock\n\n`date` 命令允许你设置和显示当前系统时间。使用 `date` 命令不会更改你系统上的硬件时间。要管理硬件时间，你可以使用\
  \ `hwclock` 命令。`hwclock` 命令有很多选项，其中一些特别值得关注：\n\n* `hwclock --systohc:` 将当前系统时间同步到硬件时钟\n\
  * `hwclock --hctosys:` 将当前硬件时间同步到系统时钟\n\n#### 使用 timedatectl\n\nRHEL 7 中引入的新命令 `timedatectl`\
  \ 允许你管理时间的许多方面。如 示例 25-1 所示，在不带任何参数使用时，此命令会显示有关当前时间的详细信息。它还显示你所在的时区，以及关于 NTP 和夏令时使用的信息。\n\
  \n**示例 25-1** 使用 `timedatectl` 获取时间的详细信息\n\n```\n[root@server1 ~]# timedatectl\n\
  \                Local time: Mon 2019-06-10 08:27:57 EDT\n            Universal\
  \ time: Mon 2019-06-10 12:27:57 UTC\n                  RTC time: Mon 2019-06-10\
  \ 12:27:57\n                 Time zone: America/New_York (EDT, -0400)\n System clock\
  \ synchronized: yes\n               NTP service: active\n           RTC in local\
  \ TZ: no\n```\n\n`timedatectl` 命令配合执行时间操作的命令工作。表 25-4 提供了相关命令的概述。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 命令 | 解释 |\n| --- | --- |\n| `status` 显示时间设置 |\n| `set-time TIME` 设置当前时间 |\n\
  | `set-timezone ZONE` 设置当前时区 |\n| `list-timezone` 显示所有时区的列表 |\n| `set-local-rtc\
  \ [0|1]` 控制 RTC（通常称为硬件时钟）是否为本地时间 |\n| `set-ntp [0|1]` 控制 NTP 是否启用 |\n\n**表 25-4**\
  \ `timedatectl` 命令概述\n\n`timedatectl` 命令被开发为管理 RHEL 7 时间的通用解决方案。它包含一些通过其他命令提供的功能，但该命令的目的是最终取代其他用于管理时间时间和日期设置的命令。当使用\
  \ `timedatectl` 开启 NTP 时间时，它会与 `chronyd` 进程通信。练习 25-1 将引导你完成管理 RHEL 8 服务器时间的一些常用选项。\n\
  \n**示例 25-2** 监控当前时间同步状态\n\n\n\n\n\n```\n[root@server1 ~]# systemctl status -l chronyd\n\
  \    chronyd.service - NTP client/server\n    Loaded: loaded (/usr/lib/systemd/system/chronyd.service;\
  \ enabled;\n              vendor preset: enabled)\n    Active: active (running)\
  \ since Mon 2019-06-10 05:22:30 EDT;\n              3h 8min ago\n      Docs: man:chronyd(8)\n\
  \            man:chrony.conf(5)\n  Main PID: 1062 (chronyd)\n     Tasks: 1 (limit:\
  \ 11365)\n    Memory: 1.5M\n    CGroup: /system.slice/chronyd.service\n        \
  \    └–1062 /usr/sbin/chronyd \n\nJun 10 07:21:04 server1.example.com chronyd[1062]:\
  \ Selected source\n  5.200.6.34\nJun 10 07:28:40 server1.example.com chronyd[1062]:\
  \ Selected source\n  213.154.236.182\nJun 10 07:28:42 server1.example.com chronyd[1062]:\
  \ Source\n  149.210.142.45 replaced with 195.242.98.57\nJun 10 07:43:51 server1.example.com\
  \ chronyd[1062]: Selected source\n  5.200.6.34\nJun 10 07:53:35 server1.example.com\
  \ chronyd[1062]: Selected source\n  195.242.98.57\nJun 10 08:16:24 server1.example.com\
  \ chronyd[1062]: Forward time jump\n  detected!\nJun 10 08:16:24 server1.example.com\
  \ chronyd[1062]: Can't synchronise:\n  no selectable sources\nJun 10 08:20:44 server1.example.com\
  \ chronyd[1062]: Selected source\n  213.154.236.182\nJun 10 08:22:57 server1.example.com\
  \ chronyd[1062]: Source 195.242.98.57 replaced with\n  195.191.113.251\nJun 10 08:25:05\
  \ server1.example.com chronyd[1062]: Selected source\n  5.200.6.34\n```\n\n## 管理时区设置\n\
  \n在 Linux 服务器之间，时间通常使用 UTC 进行通信。这允许跨不同时区的服务器使用相同的时间设置，从而使得大型机构中的时间管理变得简单得多。然而，为了方便终端用户，还必须设置本地时间。要做到这一点，你需要选择适当的时区。\n\
  \n在 Red Hat Enterprise Linux 8 上，你有三种方法来设置正确的本地时区：\n\n*   进入 `/usr/share/zoneinfo`\
  \ 目录，你可以在那里找到不同的子目录，其中包含每个定义的时区的文件。若要在服务器上设置本地时区，可以创建一个名为 `/etc/localtime` 的符号链接，指向相关的时区文件。例如，如果你想将本地时间设置为洛杉矶时间，请使用\
  \ `ln -sf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime`。\n\n*   使用 `tzselect`\
  \ 工具。该工具会启动如 示例 25-3 所示的界面，从中可以选择合适的区域和语言设置。\n\n*   使用 `timedatectl` 设置时区信息。\n\n\
