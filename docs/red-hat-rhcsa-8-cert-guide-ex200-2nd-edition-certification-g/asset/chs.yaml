  \ |\n| 不同用户类型 | 1–2 |\n| 创建和管理用户账户 | 3–6 |\n| 创建和管理组 | 7–10 |\n\n**表 6-1** “你已经吗？”章节与题目映射\n\
  \n1.  1. 关于特权用户（root）的哪个说法是正确的？\n    *   特权用户是访问 Linux 系统的用户。\n    *   没有权限的特权用户什么都不能做。\n\
  \    *   特权用户不受任何限制。\n    *   在每台服务器上，必须在安装服务器时手动创建一个特权用户。\n2.  2. 在 RHEL 8 服务器的默认安装中，用户通常需要属于哪个组才能使用\
  \ `sudo` 运行所有管理命令？\n    *   admin\n    *   root\n    *   sys\n    *   wheel\n\n\n\
  \n\n\n### 3. 用户有多种以 root 权限运行任务的方法。以下哪项不是其中？\n\n1. `sudo`\n2. `runas`\n3. `su`\n\
  4. PolicyKit\n\n### 4. 以下哪一个文件用于存储用户加密密码的哈希值？\n\n1. `/etc/passwd`\n2. `/etc/shadow`\n\
  3. `/etc/users`\n4. `/etc/secure`\n\n### 5. 你应该修改哪个配置文件来设置所有新用户主目录的默认？\n\n1. `/etc/login.defaults`\n\
  2. `/etc/login.defs`\n3. `/etc/default/useradd`\n4. `/etc/default/login.defs`\n\n\
  ### 6. 哪个命令允许你获取密码属性（如密码过期）的信息？\n\n1. `chage -l`\n2. `usermod --show`\n3. `passwd\
  \ -l`\n4. `chage --show`\n\n### 7. 用户启动登录 shell 时，以下哪个文件不会被处理？\n\n1. `/etc/profile`\n\
  2. `/etc/.profile`\n3. `~/.bashrc`\n4. `~/.bash_profile`\n\n### 8. 哪个实用程序可以直接通过相应的配置文件编辑组组成关系？\n\
  \n1. `vigr`\n2. `vipw`\n3. `vipasswd`\n4. `usermod`\n\n### 9. 哪个命令可以列出用户所属的所有组？\n\
  \n1. `userlist`\n2. `grouplist`\n3. `id`\n4. `groups`\n\n### 10. 你可以做什么来确保除了 root\
  \ 用户外，临时没有用户可以登录？\n\n1. 将默认 shell 设置为 `/usr/sbin/nologin`\n2. 将默认 shell 设置为 `/bin/false`\n\
  3. 创建名为 `/etc/nologin` 的文件\n4. 创建名为 `/etc/nologin.txt` 的文件\n\n### 基础主题\n\n## 理解不同的用户类型\n\
  \n在本章，你将学习如何创建和管理用户账户。在深入用户管理的细节之前，你将学习用户在 Linux 环境中的用法。\n\n![](img/key_topic_icon.jpg)\n\
  \n### Linux 用户\n\n在 Linux 上，有两种看待系统安全的方法。有特权用户和非特权用户。默认的特权用户是 `root`。该账户对 Linux\
  \ 服务器上的所有内容具有完全访问权限，并允许在系统空间不受限制地工作。root 用户用于执行系统管理任务，并且仅应此类此。对于所有其他任务，应使用非特权用户账户。\n\
  \n要获取用户账户信息，你可以使用 `id` 命令。在命令行中使用此命令时，你可以看到当前用户的详细信息。你也可以对其他用户账户使用它来获取这些账户的详细信息。[示例\
  \ 6-1] 显示了命令输出的一个示例。\n\n**示例 6-1** 使用 `id` 获取更多用户信息\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]# id linda\nuid=1001(linda) gid=1001(linda) groups=1001(linda)\n```\n\n### 以\
  \ root 身份工作\n\n在所有 Linux 系统中，默认都有一个 `root` 用户，也称为超级用户。该账户用于管理 Linux，没有任何限制。例如，root\
  \ 可以在系统上创建其他用户账户。对于某些任务，需要 root 权限。一些示例包括安装软件、管理用户以及在磁盘设备上创建分区。通常，所有涉及直接访问设备的任务都需要\
  \ root 权限。\n\n由于 root 账户对管理 Linux 环境非常有用，有些人习惯于直接以 root 身份登录。这样做是不建议的，特别是当你登录图形界面时。当你在图形环境中以\
  \ root 登录时，执行的所有任务都将以 root 身份运行，这涉及到不必要的安全风险。因此，你应该使用[表 6-2]中描述的替代方法之一。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 方法 | 说明 |\n| --- | --- |\n| `su` | 以不同用户打开子 shell，优点是命令仅在子 shell 中以 root 身份执行\
  \ |\n| `sudo` | 允许你设置环境，使特定任务以管理权限执行 |\n| PolicyKit | 允许你设置以管理权限运行图形实用程序 |\n\n**表\
  \ 6-2** 使用提升权限运行任务的方法\n\n### 使用 su\n\n从终端窗口，你可以使用 `su` 命令启动一个你拥有另一个身份的子 shell。为了执行管理任务，例如，你可以用普通账户登录并输入\
  \ `su` 打开 root shell。这样做的好处是 root 权限仅在子 shell 中使用。\n\n如果你只输入 `su`，系统会提示输入密码。输入之后例如：\n\
  \n```\n[linda@localhost ~]$ su\nPassword:\n[root@localhost]#\n```\n\n**提示**\n使用\
  \ `su -` 比 `su` 好。当使用 `-` 时，启动的是登录 shell；如果不使用 `-`，某些变量可能不会设置。因此，你最好使用 `su -`。\n\
  \n### 使用 sudo\n\n如果非 root 用户需要执行特定的管理任务，该用户不需要 root 权限；相反，系统管理员可以配置 `sudo` 给该用户管理权限。然后用户通过以\
  \ `sudo` 开头命令（并输入密码）来执行任务。因此，与其以 root 用户身份使用 `useradd` 等命令，你可以使用普通用户账户并输入 `sudo\
  \ useradd`。这种方法显然更安全，因为你只在运行此特定命令时才能像拥有管理员权限一样。\n\n在安装过程中创建 Linux 用户时，你可以选择向该用户授予管理权限。如果你选择这样做，该用户将能够使用\
  \ `sudo` 使用所有管理命令。安装后也可以通过让用户成为 wheel 组的成员来设置 `sudo` 权限。要非常简单的方法实现这一点，请使用这个简单的两步程序：\n\
  \n1. 使用 `usermod -aG wheel user` 将管理用户账户变为 wheel 组成员。\n2. 输入 `visudo` 并确保包含 `%wheel\
  \ ALL=(ALL) ALL` 这一行。\n\n除了这种赋予用户访问所有管理命令的方法外，你还可以使用 `visudo` 编辑 `/etc/sudoers`\
  \ 配置文件并仅允许用户访问特定命令。例如，如果你在该文件中包含 `linda ALL=/usr/bin/useradd, /usr/bin/passwd` 这一行，将允许用户\
  \ linda 以管理权限运行 `useradd` 和 `passwd` 命令。\n\n\n\n\n\n大多数具有图形用户界面的管理程序使用 `PolicyKit`\
  \ 来通过 root 用户身份验证。如果一个不是 `wheel` 组成员的普通用户访问此类应用程序，将会被提示进行身份验证。如果 `wheel` 组成员的用户打开\
  \ `PolicyKit` 应用程序，他必须输入自己的密码。对于 RHCSA 考试，你不需要了解 `PolicyKit` 的细节。如果你感兴趣，可以查看 `pkexec`\
  \ 和 `polkit` 命令的帮助文档（man pages）以获取更多详情。\n\n在练习 6-1 中，你将练习切换用户账户。\n\n## 管理用户账户\n\n\
  现在你已经知道了如何以管理员或非管理员身份执行任务，现在是时候学习如何在 Linux 上管理用户账户了。在本节中，你将学习涉及的相关内容。\n\n### 系统账户和普通账户\n\
  \n典型的 Linux 环境有两种用户账户。**普通用户账户**适用于需要在服务器上工作且对该服务器资源有有限访问权限的人员。这些用户账户通常有一个密码，用于向系统验证用户身份。此外还有服务器提供的服务使用的**系统账户**。两种类型的用户账户都具有共同属性，存储在\
  \ `/etc/passwd` 和 `/etc/shadow` 文件中。示例 6-2 显示了 `/etc/passwd`文件的部分内容。\n\n**示例 6-2**\
  \ `/etc/passwd` 用户配置文件的部分内容\n\n点击此处查看代码\n\n```\nntp:x:38:38::/etc/ntp:/sbin/nologin\n\
  chrony:x:994:993::/var/lib/chrony:/sbin/nologin\nabrt:x:173:173::/etc/abrt:/sbin/nologin\n\
  pulse:x:171:171:PulseAudio System Daemon:/var/run/pulse:/sbin/nologin\ngdm:x:42:42::/var/lib/gdm:/sbin/nologin\n\
  gnome-initial-setup:x:993:991::/run/gnome-initial-setup/:/sbin/nologin\npostfix:x:89:89::/var/spool/postfix:/sbin/nologin\n\
  sshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nologin\ntcpdump:x:72:72::/:/sbin/nologin\n\
  user:x:1000:1000:user:/home/user:/bin/bash\n```\n\n注意\n\n在许多 Linux 服务器上，几乎没有用户账户是被人类使用的。许多\
  \ Linux 服务器是为了运行特定服务而安装的，如果人们与该服务交互，将在服务内部进行身份验证。\n\n正如在示例 6-2 所示，要定义用户账户，`/etc/passwd`\
  \ 中使用了不同的字段。这些字段之间用冒号分隔。以下是这些字段的摘要，以及它们用途的简短描述。\n\n- **Username (用户名)**：这是用户的唯一标识名称。用户名对于匹配用户与其密码至关重要，密码单独存储在\
  \ `/etc/shadow` 中。在 Linux 上，用户名中不能有空格，通常建议使用小字母指定用户名。\n- **Password (密码)**：在过去，`/etc/passwd`\
  \ 的第二个字段被用于存储用户的哈希密码。由于 `/etc/passwd` 文件对所有用户可读，这构成了安全威胁，因此在当前系统中，哈希密码被存储在 `/etc/shadow`\
  \ 中。\n- **UID (用户 ID)**：每个用户都有一个唯一的 ID (`UID`)。这是一个决定用户可以做什么的数字 ID。`UID` 0 留给 root。较低的\
  \ `UID`（通常到 999）用于系统账户，较高的 `UID`（默认从 1000 开始）留给需要连接到服务器的人。创建普通用户账户的 `UID` 范围在 `/etc/login.defs`\
  \ 中设置。\n- **GID (组 ID)**：在 Linux 上，每个用户至少是一个组的成员。这个组被称为“主组”（primary group），正如后文讨论，它在权限管理中起着核心作用。用户可以是额外组的成员，这些组在\
  \ `/etc/group` 文件中管理。\n- **Comment (注释)**：`Comment` 字段用于为用户账户添加注释。该字段是可选的，但可用于描述用户账户的用途。某些工具（如\
  \ `finger`）可以从此字段获取信息。该字段也被称为 `GECOS` 字段，代表“通用综合操作系统”（General Comprehensive Operating\
  \ System），在 20 世纪 70 年代具有识别作业特定用途。\n- **Directory (目录)**：这是用户登录后所在的初始目录，也称为“家目录”（home\
  \ directory）。如果账户由人员使用，这里就是人员存储文件和程序的地方。对于系统用户账户，这是服务可以存储所需文件的环境。\n- **Shell (外壳)**：这是用户成功连接到服务器后启动的程序。对于大多数用户来说，这将是\
  \ `/bin/bash`，即 Linux 的默认 shell。对于系统账户，这通常是 `/sbin/nologin`。为了确保用户在更改密码后无法立即改回原始密码，可以创建一个\
  \ `/sbin/nologin` 文件，如果设置了该文件用户将无法登录。\n\n密码的属性在 `/etc/passwd` 中存储，密码的属性部分在 `/etc/passwd`\
  \ 中讨论过。只有以 root 运行的进程可以访问。密码的属性存储在 `/etc/shadow` 中。示例 6-3 显示了 `/etc/shadow` 的内容。\n\
  \n**示例 6-3** `/etc/shadow` 示例\n\n点击此处查看代码\n\n```\n[root@localhost ~]# tail -n 10\
  \ /etc/shadow\n``` (抱歉，原文示例中代码块似乎有截断或错误，根据上下文我重新对齐了格式)\n```\n[root@localhost ~]#\
  \ tail -n 10 /etc/shadow\nntp:!!:16420\nchrony:!!:16420\nabrt:!!:16420\npulse:!!:16420\n\
  gdm:!!:16420\ngnome-initial-setup:!!:16420\npostfix:!!:16420\nsshd:!!:16420\ntcpdump:!!:16420\n\
  user:$6$3VZb1djo6FfyZo$/Trg7Q.3foIsYfBm6Uxx3We/MAuHn8HboBZzpaMD8gfm.ML9LnuaT7CbwVXx31:16420:0:99999:7:::\n\
  ```\n\n\n\n*   **密码过期前警告用户的天数：** 此字段用于在即将需要强制更改密码时提醒用户。请注意示例 6-3 中的最后一行，它被设置为 7\
  \ 天，这是默认值（即使密码有效期设置为 99,999 天也是如此）。\n*   **密码过期后账户禁用的天数：** 使用此字段来强制更改密码。密码过期后，用户将无法再次登录。当账户达到最长有效期后，账户将被锁定。此字段允许设置一个宽限期，用户可以在宽限期内更改密码，但仅限于登录过程中。此字段以天为单位设置，默认未设置。\n\
  *   **自 1970 年 1 月 1 日以来账户禁用的天数：** 管理员可以设置此字段以在特定日期禁用账户。这通常是比删除账户更好的方法，因为账户的所有关联属性和文件将保留，但该账户将不再用于在您的服务器上进行身份验证。注意，此字段没有默认值。\n\
  *   **预留字段，曾为了“备后之用”而添加：** 此字段在很久以前就被预留了；它可能永远不会被使用。大多数密码属性可以使用 `passwd` 或 `chage`\
  \ 命令进行管理，这些命令将在本书的稍后部分讨论。\n\n### 创建用户\n\n在 Linux 服务器上创建用户有多种解决方案。首先，你可以使用 `vipw`\
  \ 命令直接在编辑器中编辑 `/etc/passwd` 和 `/etc/shadow` 配置文件的内容（但存在由于错误可能导致任何人都无法登录的风险）。另一种选择是使用\
  \ `useradd`，这是你应该在创建用户时使用的工具。要删除用户，可以使用 `userdel` 命令。使用 `userdel -r` 可以删除用户及其完整的用户环境。\n\
  \n### 修改配置文件\n\n通过修改配置文件创建用户账户只需在 `/etc/passwd` 中添加一行，在 `/etc/shadow` 中再添加一行，在其中定义用户账户及其所有属性。尽管如此，并不推荐这种创建用户的方法。如果你犯了错，可能会破坏文件的一致性，并导致任何人都无法登录。此外，如果一个管理员试图直接修改文件内容，而另一位管理员想用某些工具写入修改内容，你可能会遇到锁定问题。\n\
  \n如果你坚持直接修改配置文件，应该使用 `vipw`。该命令会在你的配置文件上打开编辑器界面，更重要的是，它会对配置文件设置适当的锁以防止损坏。然而，它*不会*检查语法，因此请确保你自己在做什么，因为即使只是写错一个字母，也可能严重破坏你的服务器。如果你想使用此工具修改\
  \ `/etc/shadow` 文件，请使用 `vipw -s`。要编辑定义组的 `/etc/group` 文件内容，你可以使用名为 `vigr` 的类似命令。\n\
  \n### 注意\n\n知道 `vipw` 和 `vigr` 的存在是一件好事，但最好不要使用这些工具或任何直接打开用户和组配置文件的工具。相反，请使用 `useradd`\
  \ 和 `groupmod` 等工具。\n\n### 使用 useradd\n\n`useradd` 工具可能是 Linux 上管理用户最常用的工具。它允许你通过使用许多参数从命令行添加用户账户。例如，使用命令\
  \ `useradd -m -u 1201 -G sales,ops linda` 来创建一个用户 linda，该用户是次要组 sales 和 ops 的成员，UID\
  \ 为 1201，并为该用户账户添加了家目录。（次要组将在本书稍后部分的“理解 Linux 组”章节中解释。）\n\n### 家目录\n\n所有普通用户都将有一个家目录。`CREATE_HOME`\
  \ 决定了在创建新用户时是否创建家目录。对于普通用户，家目录是存放个人文件的地方。作为管理员，在安装软件包时，通常需要家目录相关的设置。`login.defs`\
  \ 包含了这些设置。在创建用户时，家目录的内容会被复制。默认的骨架目录是 `/etc/skel`，它包含在创建家目录时会被复制的文件。\n\n在设置用户环境时，**PASS_MAX_DAYS**、**PASS_MIN_DAYS**\
  \ 和 **PASS_WARN_AGE** 定义了创建新用户时的默认密码过期属性。\n\n### 管理用户属性\n\n对于更改用户属性，与创建用户时使用的规则相同。你可以使用\
  \ `vipw` 直接在配置文件中工作，或者使用命令行工具。\n\n修改用户属性的最终命令行工具是 `usermod`。它可以修改 `/etc/passwd`\
  \ 和 `/etc/shadow` 中的所有属性，例如管理组成关系。它唯一不擅长的任务是设置密码。虽然 `usermod` 有一个 `-p` 选项可以“使用加密密码”，但它要求你在添加用户之前完成密码加密。如果你作为\
  \ root 想更改密码，应该使用 `passwd` 命令。\n\n#### 用户管理默认配置文件\n\n当你使用 `useradd` 等工具时，会假设某些默认值。这些默认值设置在两个配置文件中：`/etc/login.defs`\
  \ 和 `/etc/default/useradd`。示例 6-4 显示了 /etc/default/useradd 的内容。\n\n**示例 6-4** /etc/default/useradd\
  \ 中的 useradd \n\n```\n[root@localhost skel]# cat /etc/default/useradd\n# useradd\
  \ defaults file\nGROUP=100\nHOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\n\
  SKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n```\n\n如示例 6-4 所示，`/etc/default/useradd`\
  \ 文件包含了 useradd 时应用的一些默认值。\n\n在 `/etc/login.defs` 中，设置了与登录相关的多个变量。该文件被不同的命令调用，并与为新用户设置适当的环境有关。以下是可以从\
  \ `/etc/login.defs` 设置的一些重要属性：\n\n![](img/key_topic_icon.jpg)\n\n*   **MOTD_FILE：**\
  \ 定义了作为“每日消息”的文件。在该文件中，你可以包含在用户成功登录服务器后显示的消息。\n*   **ENV_PATH：** 定义了 `$PATH` 变量，即登录后应该搜索可执行文件的目录列表。\n\
  *   **PASS_MAX_DAYS**、**PASS_MIN_DAYS** 和 **PASS_WARN_AGE：** 定义了创建新用户时的默认密码过期属性。\n\
  *   **UID_MIN：** 指明创建新用户时使用的第一个 UID。\n*   **CREATE_HOME：** 指明是否为新用户创建家目录。\n\n\n\n\
  \n你已经学习了可以在 `/etc/shadow` 中设置的密码属性。你可以使用两个命令来更改用户的这些属性：`chage` 和 `passwd`。这两个命令非常直观，只要你知道各个选项的用途。例如，命令\
  \ `passwd -n 30 -w 3 -x 90 linda` 会为用户 linda 设置密码的最小使用期为 30 天，并在 90 天后过期，同时在过期前\
  \ 3 天生成警告。\n\n许多可以使用 `passwd` 完成的任务也可以通过 `chage` 完成。例如，使用 `chage -E 2025-12-31 bob`\
  \ 让用户 bob 的账户在 2025 年 12 月 31 日过期。要查看当前的密码管理设置，请使用 `chage -l`（参见示例 6-5）。`chage`\
  \ 命令还具有一个交互式模式；例如，如果你输入 `chage anna`，命令将提示你以交互方式设置你想要设置的所有密码属性。\n\n**示例 6-5** 使用\
  \ `chage –l` 显示密码过期信息\n\n点击此处查看代码图像\n\n```\nlinux:~ # chage -l linda\nLast password\
  \ change                               : Apr 11, 2020\nPassword expires        \
  \                           : never\nPassword inactive                         \
  \         : never\nAccount expires                                    : never\n\
  Minimum number of days between password change     : 0\nMaximum number of days between\
  \ password change     : 99999\nNumber of days of warning before password expir \
  \   : 7\n```\n\n## 创建用户环境\n\n当用户登录时，会创建一个环境。该环境由一些决定用户工作方式的变量组成。其中一个变量是 `$PATH`，它定义了用户在输入命令时应该搜索的目录列表。\n\
  \n为了构建用户环境，几个文件起着作用：\n\n![](img/key_topic_icon.jpg)\n\n*   `/etc/profile`:用于在启动登录\
  \ shell 时为所有用户设置默认设置\n*   `/etc/bashrc`:用于在启动子 shell 时为所有用户定义默认值\n*   `~/.profile`:启动登录\
  \ shell 时应用于特定用户的特定设置\n*   `~/.bashrc`:启动子 shell 时应用于特定用户的特定设置\n\n当你登录时，这些文件按此顺序被读取，这些文件中定义的变量和其他设置将被应用。如果一个变量或设置出现在多个文件中，则以最后一个文件为准。\n\
  \n在练习 6-2 中，你应用了通用解决方案来创建用户账户。\n\n## 创建和管理组账户\n\n每个 Linux 用户都至少是一个组的成员。在本节中，你将学习如何管理\
  \ Linux 组账户的设置。\n\n### 理解 Linux 组\n\nLinux 用户可以是两种类型组的成员。首先是主组（primary group）。每个用户必须是主组的成员，且只有一个主组。当你创建文件时，主组将成为这些文件的组所有者。（文件所有权将在第\
  \ 7 章](#ch07.xhtml_ch07) 的“权限管理”中详细讨论）。用户也可以访问其主组有权访问的所有文件。用户的主组身份定义在 `/etc/passwd`\
  \ 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组（secondary groups）的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n除了强制的主组外，用户还可以是一个或多个辅助组的成员。用户除了主组外，还可以是辅助组的成员。辅助组对于访问文件非常重要。如果用户所属的组有权访问特定文件，则用户将获得访问权限。用户的主组成员身份定义在\
  \ `/etc/passwd` 中；组本身存储在 `/etc/group` 配置文件中。\n\n**创建组**\n\n使用 `chage` 也可以完成许多可以使用\
  \ `passwd` 完成的任务。例如，使用 `chage -E 2025-12-31 bob` 让用户 bob 的账户在 2025 年 12 月 31 日过期。要查看当前的密码管理设置，请使用\
  \ `chage -l`（参见示例 6-5）。`chage` 命令还具有一个交互式模式；例如，如果你输入 `chage anna`，命令将提示你以交互方式设置你想要设置的所有密码属性。\n\
  \n**示例 6-5** 使用 `chage –l` 显示密码过期信息\n\n点击此处查看代码图像\n\n```\nlinux:~ # chage -l linda\n\
