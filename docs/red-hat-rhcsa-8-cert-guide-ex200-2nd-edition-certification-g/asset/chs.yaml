  \             nginx:latest\n```\n\n在 `podman ps` 命令的输出中，你会看到不同的列。表 26-2 总结了这些列的。\n\
  \n| 列 | 用途 |\n| --- | --- |\n| CONTAINER_ID | 自动生成的容器 ID；通常用于为该容器创建的文件名。 |\n| IMAGE\
  \ | 用于此容器的镜像的完整仓库引用。 |\n| COMMAND | 启动的命令。 |\n| CREATED | 容器创建的时间。 |\n| STATUS |\
  \ 当前状态。 |\n| PORTS | 如果适用，为此容器配置的端口。 |\n| NAMES | 容器名称。 |\n\n**表 26-2** `podman\
  \ ps` 输出列\n\n在练习 26-1 中你可以练习容器和基础管理。\n\n### 使用容器镜像\n\n每个容器的基础是容器镜像。容器是镜像的运行实例，其中添加了可写层。为了成功处理镜像，你需要了解如何访问容器仓库以及如何从中找到合适的镜像。镜像是以\
  \ Docker 格式创建的。Docker 格式已成为定义容器镜像的标准，这就是为什么你可以无缝运行容器镜像。\n\n#### 使用仓库\n\n容器镜像通常从容器仓库获取，这些仓库在\
  \ `/etc/containers/registries.conf` 文件中指定。运行无 root 容器的用户可以创建 `~/.config/containers/registries.conf`。在冲突情况下，用户特定的设置将覆盖通用文件的设置。\n\
  \n在 `registries.conf` 文件中默认使用了三个仓库。前两个是提供许可软件的 Red Hat 仓库。你需要你的 Red Hat 凭据访问这些仓库。对于第三个仓库，使用的是\
  \ Docker 仓库。Docker 托管了最大的容器仓库，将 Docker 仓库作为最后一个仓库将增加找到所需镜像的机会。\n\n在 `registries.conf`\
  \ 文件中，你会发现三个重要的部分：\n\n![](img/key_topic_icon.jpg)\n\n* `[registries.search]` 列出了默认使用的仓库。当你搜索镜像时，将按照指定的顺序使用仓库。\n\
  * `[registries.insecure]` 可用于添加未 TLS 密钥安全的仓库。\n* `[registries.block]` 可用于排除其他地方指定的仓库。在用户\
  \ registries.conf 文件中使用 `[registries.block]` 非常有用，可以禁用对 /etc/containers/registries.conf\
  \ 中特定仓库的访问。\n\n要查看当前使用了哪些仓库，可以使用 `podman info` 命令。除了使用的仓库信息外，该命令还显示了关于当前环境的其他有用信息。示例\
