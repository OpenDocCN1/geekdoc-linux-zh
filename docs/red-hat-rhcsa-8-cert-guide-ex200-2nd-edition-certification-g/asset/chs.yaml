  \ TCP/IP 指纹识别（远程主机操作系统识别）。Nmap 还提供了灵活的目标和端口指定、伪装扫描、TCP 序列可预测性特征、反向 identd 扫描等功能。除了经典的命令行\
  \ nmap 可执行文件外，Nmap 套件还包含一个灵活的数据传输、重定向和调试工具（netcat 工具 ncat）、一个用于比较扫描结果的工具（ndiff）以及一个包生成和响应分析工具（nping）。\n\
