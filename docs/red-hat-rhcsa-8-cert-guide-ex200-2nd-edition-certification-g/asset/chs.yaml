  \ KVM 软件包，还需要所有的支持包（如 `qemu`、`libvirt` 以及客户端包）。或者在将服务器配置为 Web 服务器时，在很多情况下，你还需要安装\
  \ `PHP` 等额外的软件包。\n\n为了方便管理特定功能，你可以使用软件包组（package groups）而不是特定的软件包。软件包组定义在存储库中，而\
  \ `yum` 提供了用于这些组组命令。要查看所有当前组的概述，请使用 `yum groups list`。其输出如示例 9-10 所示。\n\n提示\n\n\
  命令的名称是 `yum groups`，但存在别名，确保 `yum group` 甚至 `yum groupinstall` 等命令也能正常工作。因此，你可以使用这些命令中的任何一个。\n\
