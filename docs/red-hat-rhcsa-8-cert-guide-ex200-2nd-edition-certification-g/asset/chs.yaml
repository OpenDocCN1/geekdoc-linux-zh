  \ listening on 0.0.0.0 port 22.\n    _PID=1211\n    _COMM=sshd\n\n    _EXE=/usr/sbin/sshd\n\
  \    _CMDLINE=/usr/sbin/sshd -D -oCiphers=aes256-gcm@openssh.com,\n       chacha20-poly1305@openssh.com,aes256->\n\
  \    _SELINUX_CONTEXT=system_u:system_r:sshd_t:s0-s0:c0.c1023\n    _SYSTEMD_CGROUP=/system.slice/sshd.service\n\
  \    _SYSTEMD_UNIT=sshd.service\n    _SYSTEMD_INVOCATION_ID=728a7dfecd7d436387dcd6e319c208c7\n\
  \    _SOURCE_REALTIME_TIMESTAMP=1559983552633752\nSat 2019-06-08 04:45:52.634696\
  \ EDT [s=53e57e2481434e078e8306367dc5645c;\n  i=899;b=f35bb68348284f9ead79c3>\n\
  \    _BOOT_ID=f35bb68348284f9ead79c3c6750adfa1\nlines 1-26\n```\n\n### 持久化 Systemd\
  \ Journal\n\n默认情况下，日志存储在文件 `/run/log/journal` 中。整个 `/run` 目录仅用于当前进程的状态信息，这意味着日志在系统重启时会被清除。若要让日志在系统重启之间保持持久化，你应该确保存在\
  \ `/var/log/journal` 目录。\n\n永久存储日志需要在 `/etc/systemd/journal.conf` 中设置 `Storage=auto`\
  \ 参数。该参数可以有不同的取值：\n\n* `Storage=auto`：如果目录 `/var/log/journal` 存在，则日志将写入磁盘。\n* `Storage=volatile`：日志将仅存储在\
  \ `/run/log/journal` 目录中。\n* `Storage=persistent`：日志将存储在磁盘的 `/var/log/journal` 目录下。如果该目录不存在，它将自动创建。\n\
  * `Storage=none`：不会存储任何数据，但转发到其他目标（如内核日志缓冲区或 syslog）仍然有效。\n\n即使日志被写入 `/var/log/journal`\
  \ 中的永久文件，也不意味着日志会被永久保存。日志内置了日志轮转（log rotation）机制，每月使用一次。此外，日志的大小限制为其所在文件系统大小的 10%，如果文件系统剩余空间小于\
  \ 15%，它将停止增长。如果发生这种情况，日志中最旧的消息将被自动丢弃，为新消息腾出空间。要更改这些设置，你可以修改 `/etc/systemd/journald.conf`\
  \ 文件，如[示例 13-7 所示（以及你可以设置的其他参数）。\n\n### 示例 13-7 通过 `/etc/systemd/journal.conf` 设置\
  \ journald 参数\n\n点击此处查看代码图像\n\n```\n[Journal]\n#Storage=auto\n#Compress=yes\n#Seal=yes\n\
  #SplitMode=uid\n#SyncInterval=5m\n#RateLimitSec=30s\n#RateLimitBurst=1000\n#SystemMaxUse=\n\
  #SystemKeepFree=\n#SystemMaxFiles=100\n#RuntimeMaxUse=\n#RuntimeKeepFree=\n#RuntimeMaxFiles=100\n\
  #RetentionSec=month\n#ForwardSyslog=no\n#ForwardToMsg=no\n#ForwardToConsole=no\n\
  #ForwardToWall=yes\n#TTYPath=/dev/console\n#MaxLevel=debug\n```\n\n使 journald 持久化并不困难。练习\
  \ 13-4 显示了如何操作。\n\n### 总结\n\n在本章中，你学习了如何配置日志。你了解 RHEL 8 如何使用 `rsyslogd` 和 `journald`\
