  7.  7. Apache 进程默认查找哪个文件？\n8.  8. 哪个命令允许你查看 Apache Web 服务器是否正在运行？\n9.  9. 存储虚拟主机配置的哪个位置更好？\n\
  10. 10. 主配置文件中的文件名相对于 `ServerRoot` 的。`ServerRoot` 默认设置为哪个目录？\n\n## 章末实验\n\n在本章末实验中，你安装并配置一个基础\
  \ Apache 服务器。\n\n### 实验 21.1\n\n1.  安装运行基础 Web 服务器所需的软件包。确保 Web 服务器进程在你的服务器重启时自动启动。不要使用虚拟服务器。\n\
  2.  使用 `curl` 确保 Web 服务器显示“Welcome to my web server.” 的默认页面。\n3.  输入 `yum install\
  \ httpd-manual` 安装 Apache 文档。\n4.  使用浏览器测试访问 `/manual` 页面。\n\n\n\n\n\n从安全的角度来看，有趣的是，这台服务器的安全设置并没有任何真正的问题。所有权限的设置都很恰当，而且\
  \ `httpd` 用户像 Linux 服务器上的任何其他用户一样，确实权限在 `/var/tmp` 以及 `/tmp` 中创建文件。那么，防止此类问题的良好解决方案是什么呢？\n\
  \n当然，你可以认为 Web 服务器的管理员本该做得更好，并应该监控服务器上脚本的执行情况。但并不是 Linux 服务器的正常使用方式。Linux 服务器管理员并不一定对运行在\
  \ Linux 服务器上的所有应用程序的内部原理有深入的了解，而应用程序管理员对 Linux 的了解也不够深入，不足以确保此类事件绝不会发生。\n\n另一种解决方案是应用更深层次的安全措施。例如，如果通过使用\
  \ `noexec` 挂载选项取消了从 `/tmp` 和 `/var/tmp` 目录运行程序文件的权限，这种特定情况就可以被避免。但即使这种方法对特定情况下有效，它并不是一个防止应用程序执行其不该执行操作的良好整体安全解决方案。基本上，Linux\
  \ 只需要一个覆盖所有设置的默认安全解决方案。\n\n这就是发明 SELinux 的原因。SELinux 为 Linux 服务器提供了强制访问控制（Mandatory\
  \ Access Control），其中除非被专门允许，否则所有的系统调用都会被拒绝。本章解释了如何使用 SELinux 来确保你的服务器上永远不会发生严重的安全事件。\n\
  \n### 提示\n无论如何，请确保在考试结束时 SELinux 在你的服务器上运行。如果没有运行，它将让你损失很多分！\n\n### “我真的知道这些了吗？”测验\n\
  \n“我真的知道这些了吗？”测验让你评估自己是应该仔细阅读整个章节，还是应该跳到“考试准备任务”部分。如果你对这些问题的答案或对你自己对主题知识的评估有疑问，请阅读整个章节。表\
  \ 22-1 列出了本章的主要标题及其对应的“我真的知道这些了吗？”测验问题。你可以在附录 A“我真的知道这些了吗？”测验和复习题答案”（appa.xhtml_appa）中找到答案。\n\
  \n| 基础主题章节 | 题目 |\n| --- | --- |\n| 理解 SELinux 工作模式 | 1–2 |\n| 理解上下文设置和策略 | 3–6\
  \ |\n| 恢复默认文件上下文 | 7 |\n| 使用布尔设置修改 SELinux 设置 | 8 |\n| 诊断和处理 SELinux 策略违规 | 9–10\
  \ |\n\n**表 22-1** “我真的知道这些了吗？”章节到题映射\n\n**1.** 下列哪项不是有效的 SELinux 模式？\n1. Enforcing（强制）\n\
  2. Permissive（宽容）\n3. Disabled（禁用）\n4. Enabled（启用）\n\n**2.** 下列哪些命令可以让你看到当前的 SELinux\
  \ 模式？（选择两个）\n1. `sestatus`\n2. `lsmode`\n3. `semode`\n4. `getenforce`\n\n**3.**\
  \ 上下文标签（context label）中的以下项对 SELinux 系统管理任务最重要的是？\n1. Type（类型）\n2. User（用户）\n3.\
  \ Role（角色）\n4. Mission（任务）\n\n**4.** SELinux 安全*不能*应用于以下的哪项？\n1. Users（用户）\n2. Files（文件）\n\
  3. Ports（端口）\n4. 可以应用于上述所有项\n\n**5.** 哪个命令行开关与许多命令配合使用以显示 SELinux 相关信息？\n1. `-S`\n\
  2. `-X`\n3. `-Z`\n4. `-D`\n\n**6.** 应该使用以下哪个命令将 `/web` 目录的上下文类型设置为 `httpd_sys_content_t`？\n\
  1. `chcon -t httpd_sys_content_t /web`\n2. `semanage -t httpd_sys_content_t \"/web(/.*)?\"\
  `\n3. `semanage fcontext -t httpd_sys_content_t \"/web(/.*)?\"`\n4. `semanage fcontext\
  \ -a -t httpd_sys_content_t \"/web(/.*)?\"`\n\n**7.** 你必须运行哪个命令以确保在将文件移动到另一个位置后具有适当的\
  \ SELinux 上下文？\n1. `reboot`\n2. `restorecon /new/filename`\n3. `chcon`\n4. `restorecon\
  \ -R /etc/selinux -v`\n\n**8.** 哪个命令允许你更改布尔值（Boolean）使其在重启后依然？\n1. `chcon boolean\
  \ -P`\n2. `setsebool -P`\n3. `setsebool`\n4. `semanage boolean`\n\n**9.** 哪个文件包含了你故障排除所需的所有信息？\n\
  1. `/var/log/audit/audit.log`\n2. `/var/log/selinux/audit.log`\n3. `/var/log/messages`\n\
  4. `/var/log/selinux`\n\n**10.** 你想在日志文件中 `grep` SELinux 信息。你应该使用以下哪个字符串？\n1. `selinux`\n\
  2. `deny`\n3. `violation`\n4. `avc`\n\n### 基础主题\n\n### 理解 SELinux 工作模式\n\n如果 SELinux\
  \ 已启用且没有进行其他配置，所有的系统调用都会被拒绝。为了精确允许某些操作，使用了上下文标签（context labels）。表 22-2（appb.xhtml_ch2202）总结了最重要的部分。\n\
  \n| 元素 | 用途 |\n| --- | --- |\n| 策略 (Policy) | 定义源访问目标的规则集合。 |\n| 源域 (Source domain)\
  \ | 尝试访问某些东西。通常是用户或进程。 |\n| 目标域 (Target domain) | 源尝试访问的东西。通常是文件或端口。 |\n| 上下文 (Context)\
  \ | 用于分类对象的安全标签。 |\n| 规则 (Rule) | 策略的特定部分，决定源是否有权访问。 |\n| 标签 (Labels) | 与上下文标签相同，用于确定源是否访问目标。\
  \ |\n\n**表 22-2** SELinux 核心元素\n\n在 Linux 系统上，你可以选择启用或禁用 SELinux。当启用 SELinux 时，内核对\
  \ SELinux 的支持加载，某些感知 SELinux 的应用程序会改变其行为，因为启用了 SELinux 的系统使用了特定的库。如果 SELinux 被禁用，则不会发生任何\
  \ SELinux 活动。在 SELinux 启用和禁用模式之间切换需要重启系统。原因是 SELinux 是与 Linux 内核深度交织的功能。\n\n如果系统上的\
  \ SELinux 已启用，你可以选择让 SELinux 强制模式（forcing）或宽容模式（missive）。在强制模式下，SELinux 完全运行并执行策略中所有的\
  \ SELinux 规则。如果 SELinux 处于宽容模式，所有的 SELinux 相关活动都会被记录，但不会阻止访问。这使得 SELinux 宽容模式成为故障排除的极佳模式。宽容模式也是一种很好的方法，通过分析写入\
  \ `/var/log/audit/audit.log` 的信息从 SELinux 视角查看结果。这有助于构建新的、更高效的策略。\n\n要在启动时设置默认 SELinux\
  \ 模式，请使用文件 `/etc/sysconfig/selinux`。示例 22-1（ch22.xhtml_ch22ex01）显示该文件的内容。\n\n**示例\
  \ 22-1** `/etc/sysconfig/selinux` 内容\n\n点击查看代码图像\n\n\n\n\n\n```\n[root@server1 ~]#\
  \ cat /etc/sysconfig/selinux\n\n# 此文件控制系统上 SELinux 的状态。\n# SELINUX= 可以取以下三个值之一：\n\
  #      enforcing - 强制执行 SELinux 安全策略。\n#      permissive - SELinux 打印警告而不是强制执行。\n\
  #       disabled - 不加载任何 SELinux 策略。\nSELINUX=enforcing\n# SELINUXTYPE= 可以取以下两个值之一：\n\
  #      targeted - 目标进程受保护。\n#      minimum - 对目标策略进行修改。仅对选定的进程进行保护。\n#      mls\
  \ - 多级安全保护。\nSELINUXTYPE=targeted\n```\n\n如你所见，在这个在启动时读取的文件中，你可以选择将 SELinux 置于 enforcing（强制）、permissive（宽容）或\
  \ disabled（禁用）模式。\n\n在当前已启用 SELinux 的服务器上，你可以使用 `getenforce` 命令查看 SELinux 当前是处于\
  \ enforcing 模式还是 permissive 模式。若要在 permissive 模式和 enforcing 模式之间切换，可以使用 `setenforce`。命令\
  \ `setenforce 0` 临时将 SELinux 置于 permissive 模式，而 `setenforce 1` 则将 SELinux 临时置于 enforcing\
  \ 模式。要持久更改默认模式，你需要将其写入 `/etc/sysconfig/selinux`。\n\n另一个有命令是 `sestatus`。如果配合选项 `-v`\
  \ 使用，该命令会显示服务器上 SELinux 当前状态的详细信息。示例 22-2 显示了 `sestatus -v` 命令的输出。它不仅向你显示 SELinux\
  \ 的哪些部分已启用，还显示当前加载的策略版本以及系统某些关键部分的上下文标签（context labels）。\n\n**示例 22-2** 使用 `sestatus\
  \ -v` 获取当前保护状态的详细信息\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# sestatus -v\nSELinux\
  \ status:                enabled\nSELinuxfs mount:               /sys/fs/selinux\n\
  SELinux root directory:        etc/selinux\nLoaded policy name:            targeted\n\
  Current mode:                  enforcing\nMode from config file:         enforcing\n\
  Policy MLS status:             enabled\nPolicy deny_unknown status:    allowed\n\
  Memory protection checking:    actual (secure)\nMax kernel policy version:     31\n\
  \nProcess contexts:\nCurrent context:               unconfined_u:unconfined_r:unconfined_\n\
  \                                 t:s0-s0:c0.c1023\nInit context:              \
  \    system_u:system_r:init_t:s0\n/usr/sbin/sshd                 system_u:system_r:sshd_t:s0-s0:c0.123\n\
  \nFile contexts:\nControlling terminal:          unconfined_u:object_r:user_devpts_t:s0\n\
  /etc/passwd                    system_u:object_r:passwd_file_t:s0\n/etc/shadow \
  \                   system_u:object_r:shadow_t:s0\n/bin/bash                   \
  \   system_u:object_r:shell_exec_t:s0\n/bin/login                     system_u:object_r:login_exec_t:s0\n\
  /bin/sh                        system_u:object_r:bin_t:s0 ->\n                 \
  \                system_u:object_r:shell_exec_t:s0\n/sbin/agetty               \
  \    system_u:object_r:getty_exec_t:s0\n/sbin/init                     system_u:object_r:bin_t:s0\
  \ ->\n                                 system_u:object_r:init_exec_t:s0\n/usr/sbin/sshd\
  \                 system_u:object_r:sshd_exec_t:s0\n```\n\n在 练习 22-1 中，你将练习这些不同的模式。\n\
  \n### 提示\n无论你做什么，都不要在考试中更改 `/etc/sysconfig/selinux` 文件的内容。你的考试系统必须配置为 SELinux enforcing\
  \ 模式。要排查 SELinux 问题，你可以通过使用 `setenforce 0` 将其置于 permissive 模式。在这种模式下，你可以排查任何 SELinux\
  \ 问题，但至少你可以确保在重启后你的服务器是以启用 SELinux 的模式启动的，这是你通过考试的必要要求。\n\n请注意，在真实的 Red Hat 服务器上，SELinux\
  \ 有时会被设置为禁用。将 SELinux 置于禁用模式无疑会让管理员运行应用程序变得更容易。但也会降低服务器的安全性。通常情况下，系统管理员的无知是 SELinux\
  \ 被设置为禁用的唯一原因。如果应用程序供应商告诉你只有在禁用 SELinux 的情况下才支持该程序，这仅仅意味着该应用供应商对 SELinux 一无所知。\n\
  \n如果你的服务器直接被互联网的用户访问，那么完全强制的系统尤其为重要。如果你的服务器无法从互联网直接访问且处于安全的内部网络中，那么启用 SELinux 并非绝对必要（但我仍然建议始终保持在\
  \ enforcing 模式）。然而，在 RHCSA 考试中，你必须确保 SELinux 已启用并充分保护了你的服务器。\n\n### 备注\n服务器上经常禁用\
  \ SELinux 要是因为管理员的懒惰，或者是因为不知道如何处理它的应用供应商指示管理员禁用了它。在许多情况下，即使是不熟悉 SELinux 的应用程序在启用了\
  \ SELinux 的服务器上也可以完全运行。只是需要花一点精力确定需要创建的额外策略规则。\n\n### 理解上下文设置与策略\n上下文设置（Context\
  \ settings）是 SELinux 操作的重要部分。上下文是应用于不同对象的标签：\n\n![](img/key_topic_icon.jpg)\n\n\
  *   文件和目录\n*   端口\n*   进程\n*   用户\n\n上下文标签定义了对象的性质，SELinux 规则的创建是为了匹配源对象的上下文标签到目标对象的上下文标签。因此，设置正确的上下文标签是系统管理员的一项重要技能。你将在本章后面学习如何操作。\n\
  \n注意管理 SELinux 上文标签是使用 SELinux 安全系统的关键技能，尽管它没有列在 RHCSA 考试目标中。尽管如此，我将为你详细解释上下文标签的工作原理，因为上下文标签的不匹配会产生很多\
  \ SELinux 相关的问题。\n\n#### 监控当前上下文标签\n要查看上一个列表中对象的当前上下文设置，许多命令都支持 `-Z` 选项。在 示例 22-3\
  \ 中，你看到 `ls -Z` 如何显示 `/` 文件系统中某些目录的上下文设置。其他命令也支持 `-Z` 选项来显示当前的上下文标签设置。例如例如 `ps Zaux`\
  \ 显示所有进程列表及其它们的上下文标签，或者 `ss -Ztul` 显示所有网络端口以及每个端口关联的当前上下文标签。\n\n**示例 22-3** 使用 `ls\
  \ -Z` 显示文件的上下文标签\n\n\n\n\n\n```\n[root@server1 /]# ls -Z\n       system_u:object_r:bin_t:s0\
  \ bin    unconfined_u:object_r:\n                                           default_t:s0\
  \ repo\n       system_u:object_r:boot_t:s0 boot  system_u:object_r:admin_\n    \
  \                                       home_t:s0 root\n     system_u:object_r:device_t:s0\
  \ dev   system_u:object_r:var_\n                                           run_t:s0\
  \ run\n       system_u:object_r:etc_t:s0 etc    system_u:object_r:bin_t:\n     \
  \                                      s0 sbin\n  system_u:object_r:unlabeled_t:s0\
  \ files system_u:object_r:var_t:\n                                           s0\
  \ srv\n  system_u:object_r:home_root_t:s0 home  system_u:object_r:root_t:\n    \
  \                                       s0 stratis\n       system_u:object_r:lib_t:s0\
  \ lib    system_u:object_r:unlabeled_\n                                        \
  \   t:s0 stratis1\n       system_u:object_r:lib_t:s0 lib64  system_u:object_r:sysfs_t:\n\
  \                                           s0 sys\n       system_u:object_r:mnt_t:s0\
  \ media  system_u:object_r:tmp_t:\n                                           s0\
  \ tmp\n       system_u:object_r:mnt_t:s0 mnt    system_u:object_r:usr_t:\n     \
  \                                      s0 usr\n       system_u:object_r:usr_t:s0\
  \ opt    system_u:object_r:var_t:\n                                           s0\
  \ var\n      system_u:object_r:proc_t:s0 proc   system_u:object_r:\n           \
  \                                unlabeled_t:s0 vdo1\n```\n\n每个上下文标签始终由三个不同的部分组成：\n\
  \n![](img/key_topic_icon.jpg)\n\n- **用户（User）**：可以通过上下文标签中的 `u` 来识别；在示例 22-3 中的大多数目录上，它设置为\
  \ `system_u`。SELinux 用户与 Linux 用户不同，它们在 RHCSA 中并不重要。\n- **角色（Role）**：可以通过上下文标签中的\
  \ `_r` 来识别。在示例 22-3 中，大多数对象都被标记为 `object_r` 角色。在高级 SELinux 管理中，可以为特定的 SELinux 用户分配特定\
  \ SELinux 角色的权限。对于 RHCSA 考试，你不需要知道如何配置角色。\n- **类型（Type）**：类型上下文可以通过上下文标签中的 `_t`\
  \ 来识别。在示例 22-3 中，你可以看到 `/` 文件系统中的目录应用了多种上下文类型。请确保你了解如何处理上下文类型，因为这正是 RHCSA 考试要求你掌握的内容。\n\
  \n### 提示\n为了确保你专注于 RHCSA 考试中真正重要的部分，你只需要处理上下文类型即可。你可以安全地忽略上下文标签中的用户和角色部分。\n\n###\
  \ 设置上下文类型\n作为管理员，你需要知道如何设置上下文类型。你可以在文件、目录和其他对象（如网络端口）上设置这些上下文类型。让我们先关注这项任务。\n\n\
  你可以使用两个命令来设置上下文类型：\n\n- `semanage`：这是你想使用的命令。`semanage` 命令将新上下文写入 SELinux 策略中，然后从策略应用到文件系统。\n\
  - `chcon`：此命令仅用于特定情况，通常应避免使用。`chcon` 命令将新上下文写入文件系统而不是策略中。所有通过 `chcon` 应用的内容在文件系统重新标记标签、或从策略中恢复原始上下文到文件系统时，都会被覆盖。**不要**使用此命令！\n\
  \n### 注意事项\n你可能想知道，既然你不应该使用 `chcon`，我为什么还要费心提一下它？嗯，你经常会在文档中看到提到 `chcon` 命令，这可能会给你一种它是一个有用命令的印象。其实并不是，因为如果文件系统重新标记标签，所有通过\
  \ `chcon` 应用的更改都会丢失。如果你是 SELinux 新手，文件系统的重新标记标签操作可能会让你措手不及，如果你不小心在通过 `chcon` 应用了\
  \ SELinux 上文的文件系统上发生了重新标记，你将会通过考试。所以，我重复：*不要*使用它。\n\n### 提示\n默认可能没有安装 `semanage`。幸运的是，你可以输入\
  \ `yum whatprovides */semanage` 来找到包含 `semanage` 的 RPM 包并安装它。不要背诵所有相关 RPM 的名称；只需记住\
  \ `yum whatprovides` 即可。它可以找到你需要的任何 RPM。有关 `yum` 命令的使用和软件包管理的更多信息，请参阅第 9 章“管理软件”。\n\
  \n要使用 `semanage` 设置上下文，你首先需要找到合适的上下文（在下一节“查找你需要的上下文类型”中将深入介绍）。找到合适上下文的简单方法是查看已存在项的默认上下文设置。例如，如果你想更改\
  \ Web 服务器的上下文，输入 `ls -Z /var/www` 查看上下文设置：\n\n点击此处查看代码图像\n\n```\n[root@server1 /]#\
  \ ls -Z /var/www\ndrwxr-xr-x. root root system_u:object_r:httpd_sys_script_exec_t:s0\n\
  \  cgi-bin\ndrwxr-xr-x. root root system_u:object_r:httpd_sys_content_t:s0 html\n\
  ```\n\n你可以看到，`/var/www/html` 上的上下文设置设置为 `httpd_sys_content_t`。（提醒一下，我们只查看上下文类型，因为用户和角色仅供高级使用。）要为任何你想让\
  \ Apache 访问的新目录设置此上下文类型，请使用以下命令：\n\n点击此处查看代码图像\n\n```\nsemanage fcontext -a -t httpd_sys_content_t\
  \ \"/web(/.*)?\"\n```\n\n在此命令中，选项 `-a` 用于添加上下文。然后你使用 `-t` 更改上下文类型（而不是用户和角色）。命令的最后部分是一个正则表达式，用于引用目录\
  \ `/mydir` 及其下方可能存在的任何内容。然而，这样设置上下文是不够的，因为你只将其写入策略而不是文件系统。要完成该命令，你需要将策略设置应用到文件系统，如下：\n\
  \n```\nrestorecon -R -v /mydir\n```\n\n你将看到新上下文现在已应用，允许 httpd 进程访问该目录。\n\n### 提示\n\
  `semanage` 命令并不是最容易记忆的。幸运的是，它有一些优秀的帮助手册（man pages）。输入 `man semanage` 并使用 `G` 跳到手册的最底部。你现在会看到“参见”（See\
  \ Also）部分，其中提到了管理文件上下文的 `semanage-fcontext`。使用 `man semanage-fcontext` 打开此手册，输入\
  \ `/examples`，你将看到一些准确提到了你所需要知识的示例（参见示例 22-4）。\n\n**示例 22-4** 手册中的 `semanage` `fcontext`\
  \ 使用示例\n\n点击此处查看代码图像\n\n```\nEXAMPLE\n      记得在设置文件上下文后运行 restorecon\n      为 /web\
  \ 下的所有所有内容添加文件上下文\n      # semanage fcontext -a -t httpd_sys_content_t \"/web(/.*)?\"\
  \n      # restorecon -R -v /web\n\n      在设置文件上下文时将 /home1 替换为 /home\n      # semanage\
  \ fcontext -a -e /home /home1\n      # restorecon -R -v /home1\n\n      对于顶级目录下的家目录，例如\n\
  \        /disk6/home,\n      执行以下命令。\n      # semanage fcontext -a -t home_root_t\
  \ \"/disk6\"\n      # semanage fcontext -a -e /home /disk6/home\n      # restorecon\
  \ -R -v /disk6\n\nSEE ALSO\n      selinux (8), semanage (8)\n\nAUTHOR\n      此手册由\
  \ Daniel Walsh <dwalsh@redhat.com> 编写\n\n                                   20130617\
  \      semanage-fcontext(8)\n```\n\n\n\n\n现在是练习时间。在练习 22-2 中，你将学习如何更改 Apache Web\
  \ 服务器的文档根，并以正确的方式标记新的文档根。\n\n### 寻找所需的上下文类型\n\n设置 SELinux 上下文的挑战性部分之一是找到你所需的上下文。粗略有三种方法：\n\
  \n* 查看默认环境。\n* 读取配置文件。\n* 使用 `man -k _selinux` 查找适用于服务的 SELinux 专用手册页（man pages）。\n\
  \n获取所需 SELinux 信息最强大的方法是使用 `man -k _selinux`，它会在手册页数据库中搜索名称或描述中包含 `_selinux` 的内容。然而，在\
  \ RHEL 8 上，默认并没有安装这些手册页。要安装它们，你需要安装 `policycoreutils-devel` 包，之后可以使用命令 `sepolicy\
  \ manpage -a -p /usr/share/man/man8` 来安装 SELinux 手册页。练习 22-3 将引导你完成安装特定应用程序 SELinux\
  \ 手册页所需的步骤。\n\n**提示**\n\n练习 22-3 展示了一项基本技能。请确保在考试之前掌握了此操作流程。\n\n### 恢复默认文件上下文\n\n\
  在上一节中，你学习了如何使用 `semanage` 应用上下文类型。你还使用 `restorecon` 将策略中的上下文设置应用到文件系统。`restorecon`\
  \ 命令是一个非常有用的命令，因为策略中已经为你计算机上的大多数文件和目录定义了默认设置。如果应用了错误的上下文设置，只需输入 `restorecon` 即可从策略中重新应用到文件系统。\n\
  \n这样使用 `restorecon` 对于修复新文件很有很有。在解释如何操作之前，让我们来看看新的上下文设置是如何应用的：\n\n![](img/key_topic_icon.jpg)\n\
  \n* 如果创建了新文件，它将继承父目录的上下文设置。\n* 如果将文件复制到目录，这被视为新文件，因此它将继承父目录的上下文设置。\n* 如果移动了文件，或者在保留属性的情况下复制（使用\
  \ `cp -a`），则将应用文件的原始上下文设置。\n\n这三种情况中的最后一种很容易通过使用 `restorecon` 修复。练习 22-4 模拟了这个问题，你将使用\
  \ `restorecon` 来修复它。\n\n也可以对整个文件系统进行重新标记。这样做会将策略中定义的所有上下文设置应用到文件系统。由于策略应该始终领先并包含正确的上下文设置，因此重新标记文件系统可能是一个好主意。要重新标记文件系统，可以使用命令\
  \ `restorecon -Rv /**` 或创建一个名为 `/.autorelabel` 的文件。当服务器下次重启时，文件系统将自动进行重新标记。一旦文件系统完成重新标记，`/.autorelabel`\
  \ 文件将被删除。\n\n重新标记操作有时会自发生。如果你在排除服务器故障时，以禁用 SELinux 的模式启动了服务器，并且对文件系统应用了修改，SELinux\
  \ 将检测到文件系统在没有 SELinux 监控的情况下发生了变化。这将导致整个文件系统的自动重新标记。请注意，在大文件系统上，重新标记文件系统可能会花费大量时间。\n\
  \n### 使用布尔设置修改 SELinux 设置\n\n在 SELinux 策略中，有很多规则。其中某些规则允许特定活动，而另一些规则拒绝该活动。更改规则并不容易，这就是为什么提供了\
  \ SELinux 布尔值（Booleans）以便于更改规则的行为。\n\n布尔值的一个示例是 `ftpd_anon_write`，它默认被设置为关闭（off）。这意味着即使你配置了\
  \ FTP 服务器允许匿名写入，该布尔值仍然会拒绝它，匿名用户无法上传任何文件。如果服务配置文件中的参数设置与布尔值之间存在冲突，布尔值始终具有优先级。但布尔值很容易更改。\n\
  \n要获取系统上的布尔值列表，输入 `getsebool -a`。如果你正在寻找为特定服务设置的布尔值，使用 `grep` 过滤结果。在示例 22-5 中，你可以看到如何使用该命令显示匹配\
  \ FTP 的当前布尔值。\n\n显示当前布尔设置的另一种方法是使用 `semanage boolean -l` 命令。该命令提供了更多细节，因为它显示了当前的布尔设置和默认的布尔设置。\n\
  \n**示例 22-5** 显示布尔设置\n\n点击此处查看代码图像\n\n```\nroot@server1 ~]# getsebool -a | grep\
  \ ftp\nftp_home_dir --> off\nftpd_anon_write --> off\nftpd_connect_all_unreserved\
  \ --> off\nftpd_connect_db --> off\nftpd_full_access --> off\nftpd_use_cifs -->\
  \ off\nftpd_use_fusefs --> off\nftpd_use_nfs --> off\nftpd_use_passive_mode -->\
  \ off\nhttpd_can_connect_ftp --> off\nhttpd_enable_ftp_server --> off\nsftpd_anon_write\
  \ --> off\nsftpd_enable_homirs --> off\nsftpd_full_access --> off\nsftpd_write_ssh_home\
  \ --> off\ntftp_anon_write --> off\ntftp_home_dir --> off\n```\n\n要更改布尔值，可以使用 `setsebool`。例如，你想切换\
  \ `ftpd_anon_write` 布尔值以允许匿名写入，可以使用 `setsebool ftpd_anon_write on`。这更改了布尔值的运行时值，但没有永久更改。要永久更改布尔值，使用\
  \ `setsebool -P`。请注意这需要更长时间，因为部分策略需要重新编译以应用修改。在练习 22-5 中，你应用这些命令来查看布尔值的工作。\n\n###\
  \ 诊断和解决 SELinux 策略违反\n\n配置带有 SELin 的系统可能是一项挑战性任务。为了更容易理解正在发生什么，SELinux 会记录它所做的一切。获取日志的主要来源是审计日志，位于\
  \ `/var/log/audit/audit.log`。SELinux 消息在审计日志中带有 `type=AVC` 标记。因此，要查看 SELinux 在做什么，可以使用命令\
  \ `grep AVC /var/log/audit/audit.log`。如果记录了 SELinux 消息，该命令将显示如示例 22-6 所示的结果。\n\n\
  **示例 22-6** 从 audit.log 获取 SELinux 消息\n\n点击此处查看代码图像\n\n\n\n\n\n```\n[root@server1\
  \ ~]# grep AVC /var/log/audit/audit.log | grep http\ntype=AVC msg=audit(1559986797.093:185):\
  \ avc:  denied  { getattr }\n  for  pid=32939 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986797.093:186):\
  \ avc:  denied  { getattr }\n  for  pid=32939 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986815.360:188):\
  \ avc:  denied  { getattr }\n  for  pid=32939 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986815.360:189):\
  \ avc:  denied  { getattr }\n  for  pid=32939 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986883.549:192):\
  \ avc:  denied  { getattr }\n  for  pid=33214 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986883.550:193):\
  \ avc:  denied  { getattr }\n  for  pid=33214 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=0\ntype=AVC msg=audit(1559986927.406:197):\
  \ avc:  denied  { getattr }\n  for  pid=33214 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=1\ntype=AVC msg=audit(1559986927.406:198):\
  \ avc:  denied  { read } for\n  pid=33214 comm=\"httpd\" name=\"index.xhtml\" dev=\"\
  dm-0\" ino=35321780 sco\n  ntext=system_u:system_r:httpd_t:s0 tcontext=unconfined_u:object_r:\n\
  \  default_t:s0 tclass=file permissive=1\ntype=AVC msg=audit(1559986927.406:198):\
  \ avc:  denied  { open }\n  for  pid=33214 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=1\ntype=AVC msg=audit(1559986927.406:199):\
  \ avc:  denied  { map }\n  for  pid=33214 comm=\"httpd\" path=\"/web/index.xhtml\"\
  \ dev=\"dm-0\"\n  ino=35321780 scontext=system_u:system_r:httpd_t:s0 tcontext=\n\
  \  unconfined_u:object_r:default_t:s0 tclass=file permissive=1\n```\n\nAt first\
  \ sight, SELinux messages look complicated. If you look a bit closer, though, they\
  \ are not hard to understand. The useful thing about `sealert` is that it tries\
  \ to analyze what happened and, based on the analysis, suggests what you need to\
  \ fix. The not-so-useful part is that in some cases (as was the case in this example),\
  \ hundreds of possible context types are shown, and the administrator has to choose\
  \ the right one.\n\nWhen working with `sealert`, you can see that different plugins\
  \ are called, and every plugin has a confidence score. If, as in the example in\
  \ Example 22-6, one plugin has an 83.8 percent confidence score, while the other\
  \ has only a 17.1 percent confidence score, it may be obvious that the former approach\
  \ is what you should choose.\n\n**Tip**: If you are not sure what SELinux is trying\
  \ to tell you, install the `setroubleshoot-server` package and analyze what `sealert`\
  \ shows.\n\n#### Preparing for SELinux Coverage on the Exam\n\nIf this is the first\
  \ time you’ve read about SELinux, you may find it overwhelming. That’s natural,\
  \ because SELinux is rather overwhelming. In this chapter I’ve tried to give you\
  \ a rather complete overview of how SELinux works. Fortunately, you don’t have to\
  \ know all of this material for the RHCSA exam.\n\n\n\n\n\n在当前的 RHCSA 考试规范中，没有任何关于服务配置的内容。SELinux\
  \ 主要用于配置服务安全，但在 RHCSA 8 考试中，你不需要安装和保护任何 Web、FTP 或文件服务。剩余的任务是以下内容，你最好在考试前确保已经很好地掌握了它们：\n\
  \n*   通过编辑 `/etc/sysconfig/selinux` 确保 SELinux 已启用并处于强制执行（enforcing）模式。\n*   使用\
  \ `restorecon` 为文件或目录重新应用正确的上下文（context）。\n*   使用 `sealert` 故障排除 SELinux 无法工作的原因。\n\
  *   确保你了解如何排除 SELinux 端口相关的问题。\n\n### 总结\n本章提供了 SELinux 的 RHCSA 级别介绍。你学习了为什么出于安全考虑需要\
  \ SELinux，以及 SELinux 如何使用上下文作为主要特性来应用安全策略。你还学习了如何设置默认 SELinux 模式，以及在出现问题时如何进行分析。\n\
  \n### 考试准备任务\n如引言中“如何使用本书”节所示，你有几种准备考试的选择：章末实验；附录 B 中的记忆表；第 27 章“最终准备”；以及模拟考试。\n\
  \n### 复习所有关键主题\n复习本章中最重要的主题，这些主题在页外边上用“关键主题”图标标记。表 22-3 列出了这些关键主题的参考列表及其对应的页码。\n\
