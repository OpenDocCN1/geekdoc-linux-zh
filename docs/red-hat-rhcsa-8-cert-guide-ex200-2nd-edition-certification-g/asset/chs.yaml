  \ SSH 连接时遇到长时间超时，可以使用哪个设置？\n\n---\n\n### 基础主题\n\n#### 配置基础 Apache 服务器\n\n配置一个基础\
  \ Apache 服务器并不难。它由几个简单的步骤组成：\n\n**步骤 1.**** 安装必要的软件。\n**步骤 2.**** 识别主配置文件。\n**步骤\
  \ 3.**** 创建 Web 服务器内容。\n\n#### 安装必要的软件\n\nApache 服务器通过不同的软件软件包提供。基础包是 `httpd`；该包包含了运行一个基础\
  \ Web 服务器所需的所有内容。还有一些额外的软件包。你可以使用 `yum search http` 获取完整概述，并可以使用 `yum module install\
  \ httpd` 安装基础包和常见的额外模块。\n\n#### 识别主配置文件\n\n\n\n\n\nApache Web 服务器的配置通过不同的配置文件进行。本章后文“理解\
  \ Apache 配置文件”部分提供了这些文件组织方式的概述。主要的 Apache 配置文件是 `/etc/httpd/conf/httpd.conf`。在本节中，指定了许多参数。设置基本\
  \ Web 服务器时最需要理解的参数是 `DocumentRoot`。该参数指定了 Apache Web 服务器查找其内容的默认位置。\n\n另一个重要的配置参数是\
  \ `ServerRoot`。它定义了 Apache 查找其配置文件的默认目录。默认情况下，`/etc/httpd` 目录用于此目的，但也可以使用替代目录。`httpd.conf`\
  \ 文件引用了许多其他配置文件，其中一部分如示例 21-1 所示。使用额外的配置文件使得应用程序能够安装 RPM 软件包中的插拔文件，这些文件将由 Apache\
  \ 服务器包含进来。所有这些配置文件的名称都相对于 `ServerRoot` `/etc/httpd`。\n\n**示例 21-1** `/etc/httpd/conf/httpd.conf`\
  \ 配置文件的部分内容\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# grep -v '#' /etc/httpd/conf/httpd.conf\
  \ \n\nServerRoot \"/etc/httpd\"\n\nListen 80\n\nInclude conf.modules.d/*.conf\n\n\
  User apache\nGroup apache\n\nServerAdmin root@localhost\n\n<Directory />\n    AllowOverride\
  \ none\n    Require all denied\n</Directory>\n\nDocumentRoot \"/var/www/html\"\n\
  \n<Directory \"/var/www\">\n    AllowOverride None\n    Require all granted\n</Directory>\n\
  \n<Directory \"/var/www/html\">\n    Options Indexes FollowSymLinks\n\n    AllowOverride\
  \ None\n\n    Require all granted\n</Directory>\n\n<IfModule dir_module>\n    DirectoryIndex\
  \ index.xhtml\n</IfModule>\n\n<Files \".ht*\">\n    Require all denied\n</Files>\
  \ \n\nErrorLog \"logs/error_log\"\n\nLogLevel warn\n\n<IfModule log_config_module>\n\
  \    LogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%\n     \
  \ {User-Agent}i\\\"\" combined\n    LogFormat \"%h %l %u %t \\\"%r\\\" %>s %b\"\
  \ common\n\n    <IfModule logio_module>\n      LogFormat \"%h %l %u %t \\\"%r\\\"\
  \ %>s %b \\\"%{Referer}i\\\" \\\"%\n        {User-Agent}i\\\" %I %O\" combinedio\n\
  \    </IfModule>\n\n    CustomLog \"logs/access_log\" combined\n</IfModule>\n\n\
  <IfModule alias_module>\n\n    ScriptAlias /cgi-bin/ \"/var/www/cgi-bin/\"\n\n</IfModule>\n\
  \n<Directory \"/var/www/cgi-bin\">\n    AllowOverride None\n    Options None\n \
  \   Require all granted\n</Directory>\n\n<IfModule mime_module>\n    TypesConfig\
  \ /etc/mime.types\n\n    AddType application/x-compress .Z\n    AddType application/x-gzip\
  \ .gz .tgz\n\n    AddType text/html .shtml\n    AddOutputFilter INCLUDES .shtml\n\
  </IfModule>\n\nAddDefaultCharset UTF-8\n\n<IfModule mime_magic_module>\n    MIMEMagicFile\
  \ conf/magic\n</IfModule>\n\nEnableSendfile on\nIncludeOptional conf.d/*.conf\n\
  ```\n\n### 创建 Web 服务器内容\n\n在确定了 Web 服务器的 `DocumentRoot` 后，你就掌握了配置基本 Web 服务器所需的所有知识。Apache\
  \ Web 服务器默认查找名为 `index.xhtml` 的文件，并向使用浏览器访问 Web 服务器的客户端展示该文档的内容。只需为该文件配置非常基本的内容即可，比如像“Welcome\
  \ to my web server”这样的一行就可以。\n\n要测试 Web 服务器，你可以启动浏览器。RHEL 8 的所有图形化安装默认安装了 Firefox\
  \ 浏览器。如果你的服务器没有运行图形界面，请使用 `yum install curl` 从命令行与 Apache 操作。\n\n在练习 21-1 中，你将学习如何设置一个基本的\
  \ Apache Web 服务器——并不复杂，足以让你开始运行并测试 Web 服务器的功能。\n\n**示例 21-2** 使用 `systemctl status`\
  \ 验证 Apache Web 服务器的可用性\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# systemctl status\
  \ httpd\n   httpd.service - The Apache HTTP Server\n   Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ enabled;\n     vendor preset: disabled)\n   Active: active (running) since Fri\
  \ 2019-07-05 03:06:02 EDT; 2s ago\n     Docs: man:httpd.service(8)\n Main PID: 4540\
  \ (httpd)\n   Status: \"Started, listening on: port 443, port 80\"\n    Tasks: 213\
  \ (limit: 11222)\n   Memory: 24.2M\n   CGroup: /system.slice/httpd.service\n   \
  \        ├–4540 /usr/sbin/httpd -DFOREGROUND\n           ├–4542 /usr/sbin/httpd\n\
  ```\n\n### 理解 Apache 配置文件\n\nApache 的默认安装在 `/etc/httpd` 中创建了一个相对复杂的树。示例 21-1 显示了该目录的内容。你首先注意到存在三个指向日志、模块和运行目录的符号链接。创建这些是为了允许\
  \ Apache 在 chroot 环境中启动。\n\n![](img/key_topic_icon.jpg)\n\nchroot 环境提供了一个伪根目录。它是文件系统中的一个目录，呈现为在\
  \ chroot 环境中运行的进程的根目录。这样做是为了安全考虑：运行在 chroot 环境中的进程只能访问该 chroot 环境中的文件，这降低了当入侵者成功利用\
  \ Web 服务器身份获取登录 shell 并尝试遍历文件系统以执行未经授权的操作时，发生安全事件的风险。\n\nApache 服务器的主要配置文件位于 `/etc/httpd/conf`\
  \ 目录。首先，有一个 `httpd.conf` 文件，它包含了最重要的配置参数。此外，还有一个名为 `magic` 的文件。该文件被浏览器用于解释如何显示 Web\
  \ 服务器的内容。它确保了 Web 服务器内容在不同的浏览器中都能正确显示。\n\n`/etc/httpd/conf.d` 目录包含包含 Apache 配置中的文件。文件通过\
  \ `httpd.conf` 文件中的 `Include conf.d/*.conf` 行被引入。该目录可以被包含 Apache 插拔文件的 RPM 软件包使用。\n\
  \n\n\n\n最后一个配置目录是 `/etc/httpd/conf.modules.d`。Apache 是一个模块化的 Web 服务器。因此，通过添加启用许多不同功能的额外模块，可以轻松扩展\
  \ Apache Web 服务器的功能。如果使用了模块，它们可以使用自己的特定于模块的文件，这些文件会被放置在 `/etc/httpd/conf.modules.d`\
  \ 目录中。再次，这种方法的目的是保持 `/etc/httpd/conf.d/httpd.conf` 中的配置尽可能整洁，并确保在更新 Apache 通用配置时，模块特定的配置不会被覆盖。\n\
  \n## 创建 Apache 虚拟主机\n\n许多公司托管了多个网站。幸运的是，你不需要为每个想要运行的网站都安装一个新的 Apache 服务器。Apache\
  \ 可以配置为与虚拟主机协同工作。虚拟主机是为唯一主机名创建的独立 Apache 配置文件或部分。当你使用虚拟主机时，访问该主机的程序大致如下：\n\n1. \
  \ 客户端启动到特定虚拟主机的会话，通常是通过启动浏览器并输入客户端想要使用的网站 URL。\n2.  DNS 帮助解析虚拟主机的 IP 地址，该地址是能够托管不同虚拟主机的\
  \ Apache 服务器 IP 地址。\n3.  Apache 进程接收其托管的所有虚拟主机的请求。\n4.  Apache 进程读取每个请求的 HTTP 头部以分析该请求需要转发到哪个虚拟主机。\n\
  5.  Apache 读取特定的虚拟主机配置文件，以找到该特定虚拟主机使用的哪个文档根（document root）。\n6.  请求被转发到该特定文档根中相应的内容文件。\n\
  \n当你使用虚拟主机时，有几点需要注意：\n\n![](img/key_topic_icon.jpg)\n\n*   如果你的 Apache 服务器配置了虚拟主机，则它托管的所有服务器都应该由虚拟主机处理。为了对所有定向到此主机但没有特定虚拟主机文件的\
  \ HTTP 请求创建一个全捕获（catch-all）条目，你可以为 `default_:80` 创建一个虚拟主机。如果你不这样做，通过 DNS 域名解析成功到达你的服务器但未找到匹配虚拟主机的的数据包将发送到\
  \ Apache 进程首先找到的配置的虚拟主机。这将导致不可预知的结果。\n*   基于名称的虚拟主机是最常见的解决方案。在这种解决方案中，虚拟主机使用不同的名称但相同的\
  \ IP 地址。\n*   基于 IP 的虚拟主机较常见，但如果必须将 Web 服务器的名称解析为唯一的 IP 地址，则需要它们。基于 IP 的虚拟主机确实在同一台机器上需要多个\
  \ IP 地址，并在 Apache 服务器使用 TLS 保护连接的配置中很常见。\n\n配置虚拟主机不是 RHCSA 的目标，但作为 Linux 管理员，了解如何配置它们是有用的。因此，请参考\
  \ 练习 21-2。\n\n### 总结\n\n在本章中，你学习了 Apache 基础知识。本章的信息帮助你配置一个基础 Apache Web 服务器，这有助于测试后续章节中涵盖的高级主题，如防火墙配置或\
  \ SELinux 配置。\n\n### 考试准备任务\n\n如引言中的“如何使用此本书”节所示，你为考试准备有几种选择选择：章末实验；附录 B 中的记忆对照表；第\
