  \           (Pre)        \n  getty.target             loaded    active   active\
  \ Login Prompts\n\n graphical graphical.target          loaded    active   active\
  \ Graphical\n                                                       Interface\n\
  \  initrd-fs.target         loaded    inactive dead   Initrd File\n            \
  \                                           Systems\n  initrd-root-device.targetloaded\
  \    inactive dead   Initrd Root\n                                             \
  \          Device\n  initrd-root-fs.target    loaded    inactive dead   Initrd Root\
  \ File\n                                                       System      \n  initrd-switch-root.targetloaded\
  \    inactive dead   Switch Root\n  initrd.target            loaded    inactive\
  \ dead   Initrd Default\n                                                      \
  \ Target        \n  local-fs-pre.target      loaded    active   active Local File\n\
  \                                                       Systems (Pre)     \n  local-fs.target\
  \          loaded    active   active Local File\n                              \
  \                         Systems           \n  multi-user.target        loaded\
  \    active   active Multi-User\n                                              \
  \         System\n  network-online.target    loaded    active   active Network is\n\
  \                                                       Online            \n  network-pre.target\
  \       loaded    active   active Network (Pre)\n  network.target           loaded\
  \    active   active Network\n  nfs-client.target        loaded    active   active\
  \ NFS client\n                                                       services  \
  \        \n  nss-lookup.target        loaded  inactive dead     Host and Network\n\
  \                                                       Name Lookups\n  nss-user-lookup.target\
  \   loaded    active   active User and Group\n                                 \
  \                      Name Lookups  \n  paths.target             loaded    active\
  \   active Paths\n  remote-fs-pre.target     loaded    active   active Remote File\n\
  \                                                       Systems (Pre)\n  remote-fs.target\
  \         loaded    active   active Remote File\n                              \
  \                         Systems\n  rescue.target            loaded    inactive\
  \ dead   Rescue Mode\n  rpc_pipefs.target        loaded    active   active rpc_pipefs.\n\
  \                                                       target\n  rpcbind.target\
  \           loaded    active   active RPC Port Mapper\n  shutdown.target       \
  \   loaded    inactive dead   Shutdown\n  slices.target            loaded    active\
  \   active Slices\n  sockets.target           loaded    active   active Sockets\n\
  \  sound.target             loaded    active   active Sound Card\n  sshd-keygen.target\
  \       loaded    active   active sshd-keygen.\n                               \
  \                        target\n  swap.target              loaded    active   active\
  \ Swap\n  sysinit.target           loaded    active   active System\n          \
  \                                             Initialization\n```\n\n在你系统中的目标（targets）中，有几个起着重要作用，因为它们可以通过启动（隔离）来确定服务器启动时的状态。这些目标也可以被设置为默认目标。这些目标也大致对应于早期版本\
  \ RHEL 中使用的运行级别（runlevels）。这些目标如下：\n\n| `poweroff.target` | runlevel 0 |\n| `rescue.target`\
  \ | runlevel 1 |\n| `multi-user.target` | runlevel 3 |\n| `graphical.target` | runlevel\
  \ 5 |\n| `reboot.target` | runlevel 6 |\n\n如果你查看这些每个目标的内容，还会发现它们包含了 `AllowIsolate=yes`\
  \ 这一行。这意味着你可以使用 `systemctl isolate` 命令将计算机当前的状态切换到这些目标中的任一个。练习 17-1 将向你展示如何进行操作。\n\
  \n![](img/key_topic_icon.jpg)\n\n### 设置默认目标\n\n设置默认目标是一个简单的程序，可以从命令行完成。输入 `systemctl\
  \ get-default` 查看当前的默认目标，并使用 `systemctl set-default` 设置所需的默认目标。\n\n要将 `graphical.target`\
  \ 设置为默认目标，你需要确保已安装所需的软件包。如果并非如此，你可以使用 `yum group list` 命令显示所有 RPM 软件包组的列表。“server\
  \ with gui”和“GNOME Desktop”软件包组都适用。使用 `yum group install \"server with gui\"` 在尚未安装\
  \ GUI 软件包的服务器上安装所有 GUI 包。\n\n### 与 GRUB 2 工作\n\nGRUB 2 引导程序是启动 Linux 服务器需要良好运行的首要条件。作为管理员，你有时需要对\
  \ GRUB 2 引导程序配置进行修改。本节解释了如何操作。RHEL 8 的启动过程将在第 18 章 中进行更详细的讨论，那里包含了故障排除主题。\n\n####\
  \ 理解 GRUB 2\n\nGRUB 2 引导程序确保你可以启动 Linux。GRUB 2 安装在服务器硬盘的引导扇区，并配置为加载 Linux 内核和 initramfs：\n\
  \n![](img/key_topic_icon.jpg)\n\n- 内核是操作系统的核心，允许用户与服务器安装的硬件进行交互。\n- `initramfs`\
  \ 包含了启动服务器所需的驱动程序。它包含一个在启动期间挂载的微文件系统。其中包含了启动过程中所需的内核模块（例如访问磁盘的 LVM 模块）。\n\n通常情况下，GRUB\
  \ 2 运行良好不需要怎么维护。但在某些情况下，你可能需要更改其配置。要对 GRUB 2 配置应用更改，起点是 `/etc/default/grub` 文件，它告诉\
  \ GRUB 要做什么以及如何做。示例 17-3 显示了 RHEL 8 默认设置下的该文件内容。\n\n![](img/key_topic_icon.jpg)\n\
  \n示例 17-3：/etc/default/grub 文件\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]# cat /etc/default/grub\
  \ \nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"$(sed 's, release .*$,,g' /etc/system-release)\"\
  \nGRUB_DEFAULT=saved\nGRUB_DISABLE_SUBMENU=true\nGRUB_TERMINAL_OUTPUT=\"console\"\
  \nGRUB_CMDLINE_LINUX=\"crashkernel=auto resume=/dev/mapper/rhel-swap rd.lvm.lv=rhel/root\n\
  rd.lvm.lv=rhel/swap rhgb quiet\"\nGRUB_DISABLE_RECOVERY=\"true\"\nGRUB_ENABLE_BLSCFG=true\n\
  ```\n\n如所示，`/etc/default/grub` 文件的信息不多。它配置的最重要部分是 `GRUB_CMDLINE_LINUX` 选项。这一行包含了服务器内核的启动参数。\n\
  \n提示：对于 RHCSA 考试，请确保你理解 `/etc/default/grub` 文件的内容。无论如何，那是 GRUB 2 配置中最重要的部分。\n\n\n\
  \n\n\n除了 `/etc/default/grub` 中的配置外，`/etc/grub.d` 中还有几个配置文件。在这些文件中，你会发现一些相当复杂的 shell\
  \ 代码，它们告诉 GRUB 需要加载什么内容以及如何加载。你通常不需要修改这些文件。如果你想在启动时具备选择不同内核的能力，也不需要修改任何内容。GRUB 2\
  \ 会自动捕获新内核并自动将其添加到启动菜单中，因此无需手动添加。\n\n### 理解 GRUB 2 配置文件\n\n根据之前提到的配置文件，系统会创建一个主配置文件。如果你的系统是\
  \ BIOS 系统，该文件名为 `/boot/grub2/grub.cfg`。在 UEFI 系统上，该文件会被写入到 RHEL 的 `/boot/efi/EFI/redhat`\
  \ 或 CentOS 的 `/boot/efi/EFI/centos`。在对 GRUB 2 配置进行修改后，你需要重新生成相关的配置文件，这就是为什么你应该知道适用于你系统架构的文件名。*请不要*手动编辑它，因为该文件是自动生成的。\n\
  \n### 修改默认 GRUB 2 启动选项\n\n要对 GRUB 2 启动加载程序应用修改，`/etc/default/grub` 文件是你的入口。该文件中最重要的行行是\
  \ `GRUB_CMDLINE_LINUX`，它定义了 Linux 内核如何启动。在这一行中，你可以对 GRUB 2 配置应用永久修复。某些可能需要移除的选项是\
  \ `rhgb` 和 `quiet`。这些选项告诉内核在启动时隐藏所有输出。这对于为终端用户隐藏混乱的信息很有帮助，但如果你是服务器管理员，你可能只想移除这些选项。\n\
  \n**提示**\n\n在考试中，你希望立即知道某些操作运行是否顺利。为了实现这一点，移除 `rhgb` 和 `quiet` 启动选项是一个好主意。没有了这些选项，你就不需要猜测为什么服务器重启后需要花费很长时间；你将能够看到过程。\n\
  \n另一个有趣的参数是 `GRUB_TIMEOUT`。它定义了服务器在继续自动启动之前，等待你访问 GRUB 2 启动菜单的时间。如果你的服务器运行在物理硬件上，通过\
  \ BIOS 检查需要很长时间，那么稍微增加这个时间可能会很有用。\n\n在使用 GRUB 2 期间，你需要了解一些内核启动参数。参数有很多，其中大多数你可能永远用不到，但知道在哪里可以找到它们是很有好的。输入\
  \ `man 7 bootparam` 可以查看手册页，其中包含了对启动内核时可能使用的所有启动参数的精彩描述。\n\n要将修改后的配置写入适当的文件，你需要使用\
  \ `grub2-mkconfig` 命令并将其输出重定向到相应的配置文件。在 BIOS 系统上，命令为 `grub2-mkconfig -o /boot/grub2/grub.cfg`，在\
  \ UEFI 系统上，命令为 `grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg`。\n\n在练习 17-2 中，你将学习如何对\
  \ GRUB 2 配置应用修改并将其写入 `/boot/grub2/grub.cfg` 配置文件。\n\n**提示**\n\n你应该知道如何对 GRUB 配置应用更改，但你也应该知道，默认的\
  \ GRUB 2 配置对于几乎所有计算机来说都运行得良好。因此，你可能根本不需要应用任何更改！\n\n### 总结\n\n在本章中，你学习了如何使用 Systemd\
  \ 和 GRUB 2 让你的服务器在启动过程结束时处于你所期望的精确状态。你还学习了 Systemd 是如何组织的，以及如何使用目标（targets）配置自动启动。最后，你阅读了如何对默认\
  \ GRUB 2 启动加载程序应用更改。在下一章中，你将学习如何排除启动过程故障并修复常见问题。\n\n### 考试准备任务\n\n正如引言中“如何使用本书”部分提到的，你有多种考试准备选择：章末实验；附录\
  \ B 中的记忆表；第 27 章“最终准备”；以及模拟考试。\n\n### 复习所有关键主题\n\n复习章节中最重要的主题，这些主题在页面外边页用“关键主题”图标标记。表\
  \ 17-2 列出了这些关键主题的参考及其所在的页码。\n\n| 关键主题元素 | 描述 | 页码 |\n| --- | --- | --- |\n| 章节 |\
  \ 理解目标单元 | 389 |\n| 章节 | 管理 Systemd 目标 | 390 |\n| 练习 17-1 | 隔离目标 | 393 |\n| 列表 |\
  \ 内核和 initramfs 色的解释 | 394 |\n| 练习 17-2 | 对 GRUB 2 应用修改 | 396 |\n\n\n\n\n\n*   手动启动系统到不同的目标\n\
  *   中断启动过程以访问系统\n\n在第 17 章“管理和理解启动过程”中，你已经学习了 RHEL 8 服务器如何启动，以及引导加载程序 `GRUB 2` 和\
  \ `Systemd` 在该过程中扮演什么角色。在本章中，你将学习在服务器启动出现常见问题时可以做什么。本章介绍了一些通用方法，帮助修复启动过程中可能发生的一些常见问题。务必熟掌握本章中讨论的话题；它们某一天可能会救你的（职业）命！\n\
