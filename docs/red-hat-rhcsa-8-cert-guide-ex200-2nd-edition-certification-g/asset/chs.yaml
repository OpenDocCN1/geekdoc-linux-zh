  \          localdomain\nDHCP4.OPTION[1]:                           localdomain\n\
  DHCP4.OPTION[2]:                           domain_name = 192.168.4.2\nDHCP4.OPTION[3]:\
  \                           expiry = 1558780229\nDHCP4.OPTION[4]:              \
  \             ip_address = 192.168.4.210\nDHCP4.OPTION[5]:                     \
  \      requested_dhcp_server\n                                             identifier\
  \ = 1\nDHCP4.OPTION[6]:                           requested_domain_name = 1\nDHCP4.OPTION[7]:\
  \                           requested_domain_name\n                            \
  \                 servers = 1\nDHCP4.OPTION[8]:                           requested_domain_search\
  \ = 1\nDHCP4.OPTION[9]:                           requested_host_name = 1\nDHCP4.OPTION[10]:\
  \                          requested_interface_mtu = 1\nDHCP4.OPTION[11]:      \
  \                    requested_ms_classless\n                                  \
  \           static_routes = 1\nDHCP4.OPTION[12]:                          requested_nis_domain\
  \ = 1\nDHCP4.OPTION[13]:                          requested_nis_servers = 1\nDHCP4.OPTION[14]:\
  \                          requested_ntp_servers = 1\nDHCP4.OPTION[15]:        \
  \                  requested_rfc3442_classless\n                               \
  \              static_routes = 1\nDHCP4.OPTION[16]:                          requested_routers\
  \ = 1\nDHCP4.OPTION[17]:                          requested_static_routes = 1\n\
  DHCP4.OPTION[18]:                          requested_subnet_mask = 1\nDHCP4.OPTION[19]:\
  \                          requested_time_offset = 1\nDHCP4.OPTION[20]:        \
  \                  requested_wpad = 1\nDHCP4.OPTION[21]:                       \
  \   routers = 192.168.4.2\nDHCP4.OPTION[22]:                          subnet_mask\
  \ = 255.255.255.0\nIP6.ADDRESS[1]:                            fe80::959:3b1a:9607:8928/64\n\
  IP6.GATEWAY:                               --\nIP6.ROUTE[1]:                   \
  \           dst = fe80::/64, nh = ::,\n                                        \
  \     mt = 100\nIP6.ROUTE[2]:                              dst = ff00::/8, nh =\
  \ ::,\n                                             mt = 256, table=255\n```\n\n\
  \n\n\n要确切了解这些设置的具体作用，请执行 `man 5 nm-settings`。你也可以使用 `nmcli` 显示当前配置的设备概述以及这些设备的状态。例如，输入\
  \ `nmcli dev status` 命令可以显示所有设备列表，并使用 `nmcli dev show <devicename>` 显示特定设备的设置。\n\
  \n### 提示\n使用 `nmcli` 似乎很困难。其实并非如此，因为它提供了出色的命令行补全功能——只需确保已安装 `bash-completion` 软件包即可。尝试输入\
  \ `nmcli`，但不要按回车！相反，按两次 Tab 键——你将看到 `nmcli` 此时刻期望的所有可用选项。选择一个选项，例如 `connection`，再次按两次\
  \ Tab 键。使用这种方法可以帮助你组合长命令，而无需记忆任何内容！\n\n在练习 8-3 中，你将学习如何使用 `nmcli` 命令创建连接并在连接之间切换。\n\
  \n在此练习中，你使用 `nmcli con add` 创建了网络连接。你也可以通过 `nmcli con mod` 修改当前连接的属性。\n\n在练习 8-4\
  \ 中，你将学习如何使用 `nmcli` 修改连接参数。\n\n这就是你在 RHCSA 考试中关于 `nmcli` 需要了解的所有内容。正如你所注意到的，`nmcli`\
  \ 是一个功能丰富的命令。该命令的准确语法很难记忆。幸运的是，有一个包含示例的优秀帮助页（man page）。输入 `man nmcli-examples` 显示此帮助页；你会发现，如果能找到这个帮助页，几乎可以用\
  \ `nmcli` 做任何事情。此外，不要忘记在操作 `nmcli` 时使用 Tab 补全。\n\n### 使用 nmtui 配置网络\n如果你不喜欢 `nmcli`\
  \ 命令行复杂的语法，你可能会喜欢 `nmtui`。这是一个文本用户界面，允许你轻松创建网络连接。图 8-2 显示了 `nmtui` 界面的样子。\n\n![显示了\
  \ Network Manager TUI 界面的截图。](img/08fig02.jpg)\n\n**图 8-2** `nmtui` 界面\n\n`nmtui`\
  \ 界面由三个菜单选项组成：\n\n*   **编辑连接 (Edit a Connection)：** 使用此选项创建新连接或编辑现有连接。\n*   **激活连接\
  \ (Activate a Connection)：** 使用此（重新）激活连接。\n*   **设置系统主机名 (Set System Hostname)：**\
  \ 使用此设置计算机的主机名。\n\n编辑连接选项提供了处理网络连接时可能需要的几乎所有功能。它确实允许你完成 RHCSA 考试所需的任何操作。你可以用它添加任何类型的连接——不仅是以太网连接，还支持高级连接类型，如网络桥接和组网络驱动程序。\n\
  \n当你选择“编辑连接”选项时，你将进入一个丰富的界面，允许你编辑网络连接的大多数属性。编辑连接后，你需要禁用它并重新激活。这应该是自动完成的，但事实并非如此。\n\
  \n### 提示\n如果你喜欢图形用户界面 (GUI) 工具，那么你很幸运。使用 `nm-connection-editor` 代替 `nmtui`，但要准备好该界面提供的选项\
  \ set 相对有限。它不包含高级选项，例如创建网络桥接和管理网络接口的选项。然而，它提供了管理网络连接地址配置所需的所有内容。使用 `nm-connection-editor`\
  \ 命令或使用图形界面中的应用组件启动它。图 8-3 显示了默认界面的样子。\n\n![显示了 Network Manager TUI 界面的截图。](img/08fig02.jpg)\n\
  \n### 处理网络配置文件\n#### 处理配置文件\n你创建的每一个连接都存储在 `/etc/sysconfig/network-scripts` 目录下的配置文件中。文件名以\
  \ `ifcfg-` 开头，随后是网络接口的名称。在示例 8-7 中，你可以看到此类配置的内容。\n\n**示例 8-7** `ifcfg` 配置示例\n\n\
  点击此处查看代码图像\n\n```\n[root@server1]# cat /etc/sysconfig/network-scripts/ifcfg-ens33\n\
  TYPE=\"Ethernet\"\nPROXY_METHOD=\"none\"\nBROWSER_ONLY=\"no\"\nBOOTPROTO=\"dhcp\"\
  \nDEFROUTE=\"yes\"\nIPV4_FAILURE=\"no\"\nIPV6INIT=\"yes\"\nIPV6_AUTOCF=\"yes\"\n\
  IPV6_DEFROUTE=\"yes\"\nIPV6_FAILURE=\"no\"\nIPV6_ADDR_GEN=\"stable\"\nNAME=\"ens33\"\
  \nUUID=\"db6f53bd-654e-4dd5-224514f805a\"\nONBOOT=\"yes\"\n```\n\n如果你不喜欢通过 `nmcli`\
  \ 或 `nmtui` 修改网络配置，可以直接编辑此配置文件。在对文件修改后，使用 `nmcli con up` 命令激活新配置。\n\n### 提示\n你可以在一个网络连接中同时设置固定\
  \ IP 地址和动态 IP 地址。要做到这一点，请将配置文件中的 `BOOTPROTO` 选项设置为 `dhcp`，同时指定 IP 地址和网络前缀。你也可以通过\
  \ `nmtui` 工具进行此操作；只需确保在 `nmtui` 中将 IPv4 配置设置为自动（而不是手动）并同样指定 IP 地址即可。我建议你在使用本本书的测试配置中这样做，因为这允许你在内部使用静态网络地址的同时，通过动态配置访问互联网并从仓库安装软件。\n\
  \n### 设置主机名和域名解析\n为了与其他主机通信，会使用主机名。作为管理员，你必须知道如何设置主机名。你还需要确保通过设置主机名解析，主机能够根据主机名联系。在本节中，你将学习如何操作。\n\
  \n#### 主机名\n由于主机名用于访问服务器及其提供的服务，因此知道如何设置系统主机名很重要。主机名通常由不同的部分组成。这些是主机名和主机所在的 DNS\
  \ 域。这两个部分共同构成了完全限定域名 (FQDN)，它看起来像 `server1.example.com`。良好的做法始终指定 FQDN 而不仅仅是主机名，因为\
  \ FQDN 在互联网上提供了唯一标识。更改主机名有多种方法：\n\n*   使用 `nmtui` 并选择更改主机名。\n*   使用 `hostnamectl`。\n\
  *   编辑配置文件 `/etc/hostname`。\n\n使用 `hostnamectl` 配置主机名，可以使用类似 `hostnamectl set-hostname\
  \ myhost.example.com` 的命令。设置主机名后，可以使用 `hostnamectl status` 显示当前主机名。示例 8-8 显示此命令的输出。\n\
  \n**示例 8-8** 显示当前主机名配置\n\n点击此处查看代码图像\n\n```\n[root@server1]# hostnamectl status\n\
  \   Static hostname : server1.example.com\n         Icon name : computer-vm\n  \
  \         Chassis : vm\n        Machine ID : 5aa095b495ed458d934c54a88078c165\n\
  \           Boot ID : 5fdef4be9cab48c59873af505d778761\n    Virtualization : vmware\n\
  \  Operating System : Red Hat Enterprise Linux 8.0 (Ootpa)\n       CPE OS Name :\
  \ cpe:/o:redhat:enterprise_linux:8.0:GA\n           Kernel  : Linux 4.18.0-80.el8.x86_64\n\
  \      Architecture : x86-64\n```\n\n使用 `hostnamectl status` 时，你不仅可以看到关于主机名的信息，还能看到关于\
  \ Linux 内核、虚拟化类型以及更多信息。\n\n或者，你可以使用 `nmtui` 界面设置主机名。图 8-4 显示了可以执行此操作的屏幕。\n\n\n\n\
  \n\n![显示了 nmtui 界面中“设置主机名”屏幕的截图。它包含一个输入主机名的字段。主机名设置为“server1.example.com”。底部的两个选项是“取消(cancel)”和“确定(ok)”。](img/08fig04.jpg)\n\
  \n**图 8-4** 使用 `nmtui` 修改主机名\n\n设置主机名解析，你通常使用 DNS。配置 DNS 服务器不是 RHCSA 的目标，但你需要知道如何配置你的服务器使用现有的\
  \ DNS 服务器进行主机名解析。除了 DNS 之外，你可以在 `/etc/hosts` 文件中配置主机名解析。示例 8-9 显示了 `/etc/hosts`\
  \ 文件的内容。\n\n**示例 8-9** `/etc/hosts` 示例\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# cat\
  \ /etc/hosts\n127.0.0.1    localhost localhost.localdomain localhost4 localhost4.\n\
  \  localdomain4\n::1          localhost localhost.localdomain localhost6 localhost6.\n\
  \  localdomain6\n```\n\n所有在 `/etc/hosts` 中设置的主机–IP 地址定义将在使用 DNS 中的主机名之前应用。这在 `/etc/nsswitch.conf`\
  \ 的 hosts 行中被配置为默认值，其默认内容如下：\n\n```\nhosts: files dns myhostname\n```\n\n设置 `/etc/hosts`\
  \ 文件非常简单；只需确保它至少包含两列。第一列是特定主机的 IP 地址，第二列指定主机名。主机名可以作为短名（如 `server1`）或 FQDN 提供。在\
  \ FQDN 中，主机名以及完整的 DNS 名称都被包含在，例如 `server1.example.com`。\n\n如果一个主机有多个名称（例如短名和完全限定\
  \ DNS 名称），你可以在 `/etc/hosts` 中同时指定这两个两个。在这种情况下，第二列必须包含 FQDN，第三列可以包含别名。示例 8-10 显示了一个主机名配置示例。\n\
  \n**示例 8-10** `/etc/hosts` 配置示例\n\n点击此处查看代码图像\n\n```\n[root@server2 ~]# cat /etc/hosts\n\
  127.0.0.1    localhost localhost.localdomain localhost4 localhost4.\n  localdomain4\n\
  ::1          localhost localhost.localdomain localhost6 localhost6.\n  localdomain6\n\
  10.0.0.10     server1.example.com server1\n10.0.0.20     server2.example.com server2\n\
  ```\n\n## DNS 名称解析\n\n如果你想与互联网上的其他主机通信，仅使用 `/etc/hosts` 文件是不够的。你也应该使用 DNS。要指定使用哪个\
  \ DNS 服务器，请如所述使用 `nmcli` 或 `nmtui` 设置 DNS 服务器。NetworkManager 配置将 DNS 信息存储在网络连接的配置文件中（位于\
  \ `/etc/sysconfig/network-scripts`），并从那里推送到 `/etc/resolv.conf` 文件，该文件用于 DNS 名称服务器解析。不要直接编辑\
  \ `/etc/resolv.conf`，因为在下次重启 NetworkManager 时它将会被覆盖。\n\n建议始终设置至少两个要连接的 DNS 名称服务器。如果第一个名称服务器没有响应，则将连接第二个名称服务器。要指定你想使用的\
  \ DNS 名称服务器，你有几种不同的选项：\n\n*   使用 `nmtui` 设置 DNS 名称服务器。图 8-5 显示了你可以执行此操作的界面。\n\n\
  \    ![从 nmtui 界面设置 DNS 服务器的插图。(graphics/08fig05.jpg)\n\n    **图 8-5** 从 `nmtui`\
  \ 界面设置 DNS 服务器\n\n*   在 `/etc/sysconfig/network-scripts` 中的 `ifcfg` 网络连接配置文件设置 `DNS1`\
  \ 和 `DNS2` 参数。\n\n*   使用配置为分配 DNS 名称服务器地址的 DHCP 服务器。\n\n*   使用 `nmcli con mod <connection-id>\
  \ [+]ipv4.dns <ip-of-dns>`。\n\n注意，如果你的计算机配置为从 DHCP 服务器获取网络配置，则 DNS 服务器也会通过 DHCP\
  \ 服务器设置。如果你不希望发生这种情况，你有两个选项：\n\n*   编辑 `ifcfg` 配置文件以包含选项 `PEERDNS=no`。\n\n*   使用\
  \ `nmcli con mod <con-name> ipv4.ignore-auto-dns yes`。\n\n要验证主机名解析，你可以使用 `getent\
  \ hosts <servername>` 命令。该命令会在 `/etc/hosts` 和 DNS 中搜索以解析指定的主机名。\n\n### 考试提示\n\n\
  *不要*直接在 `/etc/resolv.conf` 中指定 DNS 服务器。它们会在 NetworkManager（重）启动时被覆盖。\n\n### 总结\n\
  \n在本章中，你学习了如何在 RHEL 8 中配置网络。首先，你学习了如何使用 IP 协议连接计算机，然后学习了使用哪些技术来使主机之间的服务可用。接下来，你\
  \ 学习了如何通过网络配置验证网络配置。\n\n### 考试准备\n\n在本章中，你学习了如何在 RHEL 8 中配置网络。首先，你学习了如何使用 IP 协议连接计算机，然后学习了使用哪些技术来使主机之间的服务可用。接下来，你学习了如何通过网络配置验证网络配置。\n\
