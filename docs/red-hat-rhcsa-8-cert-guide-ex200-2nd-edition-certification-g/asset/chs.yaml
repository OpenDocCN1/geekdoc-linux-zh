  ### 定义关键术语\n定义本章中的以下关键术语，并在术表中检查你的答案：\n\n*   策略 (policy)\n*   强制执行 (enforcing)\n\
  *   许可 (permissive)\n*   上下文 (context)\n*   上下文类型 (context type)\n*   源上下文 (source\
  \ context)\n*   目标上下文 (target context)\n*   审计日志 (audit log)\n\n### 复习题\n以下问题旨在帮助测试你对概念、术语以及知识广度的理解。你可以在附录\
  \ A 中找到这些问题的答案。\n\n1. 你想临时将 SELinux 设置为许可（permissive）模式。你使用哪个命令？\n2. 你需要所有可用布尔值（Booleans）列表。你使用哪个命令？\n\
  3. 你没有看到任何特定服务的 SELinux 手册页。你需要应用什么解决方案？\n4. 为了在审计日志中获得易读的 SELinux 日志消息，你需要安装哪个包？\n\
  5. 你需要运行哪些命令将 `httpd_sys_content_t` 上下文类型应用到目录 `/web` 上？\n6. 你会在什么情况下使用 `chcon`\
  \ 命令？\n7. 如果你想完全禁用 SELinux，你需要更改哪个文件？\n8. SELinux 将所有消息记录在何处？\n9. 你不知道 ftp 服务提供哪些可上下文类型。哪条命令可以让你获取更具体的信息？\n\
  10. 你的服务运行不符合预期，你想知道这是由于 SELinux 还是其他原因？\n\n### 章末实验\n你现在已经学习了 SELinux 是如何工作的。为了练习，请执行以下章末实验：\n\
  \n1.  通过 `/etc/sysconfig/selinux` 修改 SELinux 模式。\n2.  使用 `restorecon` 为文件或目录重新应用正确的上下文。\n\
  3.  使用 `sealert` 排除 SELinux 无法工作的原因。\n4.  排除 SELinux 端口相关问题。\n5.  使用 `chcon` 修改文件上下文。\n\
  6.  将 `httpd_sys_content_t` 上下文类型应用到目录 `/web` 上。\n7.  通过编辑配置文件禁用 SELinux。\n8.  检查审计日志中的消息。\n\
  9.  识别 ftp 服务的上下文类型。\n\n\n\n\n\n## 6. 以下哪个选项显示了将端口持久添加到当前 Firewalld 配置的正确语法？\n\n\
  1. `firewall-cmd --addport=2022/tcp --permanent`\n2. `firewall-cmd --add-port=2022/tcp\
  \ --permanent`\n3. `firewall-cmd --addport=2022/tcp --persistent`\n4. `firewall-cmd\
  \ --add port=2022/tcp --persistent`\n\n## 7. 对于一个处于需要最小防火墙保护网络上的接口（因为同一网络上的其他所有计算机都是信任的），你应该使用哪个区域（zone）？\n\
  \n1. Trusted（信任）\n2. Home（家庭）\n3. Work（工作）\n4. Private（私有）\n\n## 8. 关于配合 `firewall-cmd`\
  \ 使用 `--permanent` 命令行选项，以下描述正确？\n\n1. 使用 `--permanent` 添加的配置会立即激活，并在（重新）启动 Firewalld\
  \ 后自动激活。\n2. 使用 `--permanent` 添加的配置会立即激活。\n3. 使用 `--permanent` 添加的配置不会立即激活，只有通过使用\
  \ `systemctl restart firewalld` 才能激活。\n4. 要激活使用 `--permanent` 选项添加的配置，你需要使用 `firewall-cmd\
  \ --reload` 重新加载防火墙配置。\n\n## 9. 哪个命令允许你获取所有区域当前防火墙配置的概览？\n\n1. `firewall-cmd --show-current`\n\
  2. `firewall-cmd --list-all`\n3. `firewall-cmd --list-current`\n4. `firewall-cmd\
  \ --show-all`\n\n## 10. 关于 `firewall-config` GUI 工具，以下哪个描述*不是*正确的？\n\n1. 在 `firewall-config`\
  \ 中创建的所有配置都会自动激活并持久存储。\n2. `firewall-config` 工具提供了一个易于使用的界面，用于向区域添加端口。\n3. 在默认屏幕上，`firewall-config`\
  \ 显示所有区域。\n4. `firewall-config` 连接到 Firewalld 服务。如果该服务未运行，你在使用 `firewall-config`\
  \ 时可能会遇到问题。\n\n### 基础主题\n\n### 理解 Linux 防火墙\n\n![](img/key_topic_icon.jpg)\n\n你可以使用防火墙来限制进入服务器或离开服务器的流量。防火墙功能是通过\
  \ Linux 内核中的 netfilter 子系统实现的。Netfilter 允许内核模块检查每个入站、出站或转发的数据包，并通过允许或阻塞此类数据包来采取操作。因此，内核防火墙允许对入站数据包、出站数据包以及当\
  \ RHEL 服务器提供路由功能时从一个接口跨越到另一个接口的数据包进行检查。\n\n#### 理解之前的解决方案\n\n为了与 netfilter 交互，可以使用不同的解决方案。在早期的\
  \ Red Hat Enterprise Linux（红帽企业 Linux）版本中，`iptables` 是配置 netfilter 数据包过滤的默认解决方案。该解决方案通过命令行工具\
  \ `iptables` 工作，该工具提供了一种定义防火墙规则的高级且详细的方法，但由于 `iptables` 命令的语法复杂且规则顺序可能变得相对复杂，对于偶尔管理的管理员来说也具有挑战性。\n\
  \nRed Hat Enterprise Linux 8 不再提供 `iptables` 服务。它被 `nftables` 取代，这是一种更新的解决方案，提供了比\
  \ `iptables` 提供的更高级的选项。`nftables` 命令行工具提供了一个高级接口，可以直接将规则写入到 `nftables` 中。\n\n####\
  \ 理解 Firewalld\n\n![](img/key_topic_icon.jpg)\n\n在 Red Hat Enterprise Linux 7 中，引入了一种新的防火墙解决方案：Firewalld\
  \ 是一个系统服务，可以使用不同的接口配置防火墙规则。管理员可以在 Firewalld 环境中管理规则，但更重要的是，应用程序可以使用 DBus 消息系统请求打开端口，这意味着不需要系统管理员执行任何直接操作的情况下即可添加或删除规则，这允许应用程序从用户空间处理防火墙。\n\
  \nFirewalld 是作为一种管理 Linux 防火墙的全新解决方案而开发的。它使用 Firewalld 服务来管理 netfilter 防火墙配置。\n\n\
  #### 理解 Firewalld 区域\n\nFirewalld 通过与区域（zones）协作使防火墙管理变得更简单。一个*区域*是规则的集合，应用于匹配特定源地址或网络接口的入站数据包。默认情况下，Firewalld\
  \ 只对入站数据包生效，且不对出站数据包进行过滤。\n\n![](img/key_topic_icon.jpg)\n\n区域的使用对于具有多个接口的服务器来说尤为重要。在这些服务器上，区域允许管理员轻松地分配一组特定的规则。在仅有一个网络接口的服务器上，你可能只需要一个区域，即默认区域。进入系统的每个数据包都会对其源地址进行分析，并根据该源地址由\
  \ Firewalld 分析该数据包是否属于某个特定区域。如果不是，则使用入站网络接口的区域。如果没有可用的特定区域，数据包将由默认区域的设置进行处理。\n\n\
  Firewalld 与一些默认区域一起。[表 23-2] 描述了这些默认区域。\n\n![](img/key_topic_icon.jpg)\n\n| 区域名称\
  \ | 默认设置 |\n| --- | --- |\n| block | 入站网络连接被“icmp-host-prohibited”消息拒绝。只允许在该系统上发起的网络连接。\
  \ |\n| dmz | 用于非军事化区内的计算机。仅接受选定的入站连接，并允许对内部网络进行有限访问。 |\n| drop | 任何入站数据包被丢弃且不进行回复。\
  \ |\n| external | 用于开启了掩装（网络地址转换 [NAT]）的外部网络，特别用于路由器。仅接受选定的入站连接。 |\n| home | 用于家庭网络。同一网络上的大多数计算机都是信任的，且仅接受选定的入站连接。\
  \ |\n| internal | 用于内部网络。同一网络上的大多数计算机都是信任的，且仅接受选定的入站连接。 |\n| public | 用于公共区域。同一网络中的其他计算机不受信任，并接受有限的连接。这是所有新创建网络接口的默认区域。\
  \ |\n| trusted | 接受所有网络连接。 |\n| work | 用于工作区域。同一网络上的大多数计算机都是信任的，且仅接受选定的入站连接。 |\n\
  \n**表 23-2** Firewalld 默认区域\n\n![](img/key_topic_icon.jpg)\n\n#### 理解 Firewalld\
  \ 服务\n\n在使用 Firewalld 时，第二个关键元素是服务（service）。请注意，Firewalld 中的服务*不等同于* SystemD 中的服务；Firewalld\
  \ 服务指定了防火墙中哪些流量应该被接受为入站和出站流量。它通常包括要打开的端口，以及应该加载的支持内核模块。在 Firewalld 中，定义了一些默认服务，这允许管理员轻松地允许或拒绝对服务器特定端口的访问。\n\
  \n要获取计算机上所有可用服务的列表，你可以使用命令 `firewall-cmd --get-services`（参见示例 23-1）。\n\n**示例 23-1**\
  \ 使用 `firewall-cmd --get-services` 获取所有可用服务列表\n\n[点击此处查看代码图片]\n\n\n\n\n\n```\n[root@server1\
  \ ~]# firewall-cmd --get-services\nRH-Satellite-6 amanda-client amanda-k5-client\
  \ amqp amqps apcupsd\n  audit bacula bacula-client bgp bitcoin bitcoin-rpc bitcoin-testnet\n\
  \  bitcoin-testnet-rpc ceph ceph-mon cfengine cockpit condor-collector\n  ctdb dhcp\
  \ dhcpv6 dhcpv6-client distcc dns docker-registry docker-\n  swarm dropbox-lansync\
  \ elasticsearch etcd-client etcd-server finger\n  freeipa-ldap freeipa-ldaps freeipa-replication\
  \ freeipa-trust ftp\n  ganglia-client ganglia-master git gre high-availability http\
  \ https \n  imap imaps ipp ipp-client ipsec irc ircs iscsi-target isns jenkins\n\
  \  kadmin kerberos kibana klogin kpasswd kprop kshell ldap ldaps\n  libvirt libvirt-tls\
  \ lightning-network llmnr managesieve matrix mdns\n  minidlna mongodb mosh mountd\
  \ mqtt mqtt-tls ms-wbt mssql murmur\n  mysql nfs nfs3 nmea-0183 nrpe ntp nut openvpn\
  \ ovirt-imageio ovirt-\n  storageconsole ovirt-vmconsole plex pmcd pmproxy pmwebapi\
  \ pmwebapis\n  pop3 pop3s postgresql privoxy proxy-dhcp ptp pulseaudio puppetmaster\n\
  \  quassel radius redis rpc-bind rsh rsyncd rtsp salt-master samba\n  samba-client\
  \ samba-dc sane sip sips slp smtp smtp-submission smtps\n  snmp snmptrap spideroak-lansync\
  \ squid ssh steam-streaming svdrp svn\n  syncthing syncthing-gui synergy syslog\
  \ syslog-tls telnet tftp tftp-\n  client tinc tor-socks transmission-client upnp-client\
  \ vdsm vnc-\n  server wbem-http wbem-https wsman wsmans xdmcp xmpp-bosh xmpp-client\n\
  \  xmpp-local xmpp-server zabbix-agent zabbix-server\n```\n\n本质上，在使用 Firewalld 时，关键在于将正确的服务添加到正确的区域（zones）中。在特殊情况下，可以使用更特定的设置来增强配置。在下一节中，你将学习可以使用哪些工具来实现此。\n\
  \n每个服务的背后都是一个 XML 配置文件。这些 XML 文件可以很容易修改。默认（RPM 安装的）XML 文件存储在 `/usr/lib/firewalld/services`\
  \ 中。自定义 XML 文件可以添加到 `/etc/firewalld/services` 目录，并在重启 Firewalld 服务后被自动加载。\n\n示例\
  \ 23-2 显示了服务文件的内容格式。\n\n**示例 23-2** `ftp.xml` 服务文件的内容\n\n点击此处查看代码图像\n\n```\n[root@server1\
  \ services]# cat ftp.xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<service>\n\
  \  <short>FTP</short>\n  <description>FTP 是一种用于远程文件传输的协议。\n  如果你计划让你的 FTP\n  服务器公开可用，请启用此选项。你需要安装\
  \ vsftpd\n  软件包才能使此\n  选项生效。</description>\n  <port protocol=\"tcp\" port=\"21\"\
  />\n  <module name=\"nf_conntrack_ftp\"/>\n</service>\n```\n\n## 使用 Firewalld\n\n\
  在本节中，你将学习如何使用 Firewalld 命令行工具 `firewall-cmd` 来配置防火墙。Firewalld 服务还提供了该工具的 GUI 版本\
  \ `firewall-config`，但 RHCSA 考试目标仅列出了 `firewall-cmd`，因此本节重点关注从命令行操作。这个易于访问的工具可以实现简单的配置。\n\
  \n在使用这两个工具中的任一个时，请注意修改的具体位置。这两个工具都作用于配置的内存状态，同时也作用于磁盘上的配置状态（永久状态）。在使用其中任一个工具时，请确保在继续之前将更改提交到磁盘。\n\
  \n`firewall-cmd` 工具是一个易于访问的工具，允许管理员更改防火墙的运行时配置并将此配置写入磁盘。在学习此多功能命令的所有可用选项之前，在练习 23-1\
  \ 中，你将学习 `firewall-cmd` 提供的一些最重要选项。\n\n**提示**：在考试中，尽可能使用服务。只有当没有服务包含你想打开的端口时，才使用特定端口。\n\
  \n在上一个练习中，你处理了区域和务，并学习了如何将服务和端口添加到默认区域。你应该尽可能使用服务；添加单个端口不是推荐的做法。`firewall-cmd` 接口提供了更多选项。表\
  \ 23-3 描述了一些最重要的命令行选项。\n\n![](img/key_topic_icon.jpg)\n\n| firewall-cmd 选项 | 解释\
  \ |\n| --- | --- |\n| `--get-zones` | 列出所有可用区域 |\n| `--get-default-zone` | 显示当前设置为默认区域的区域\
  \ |\n| `--set-default-zone=<ZONE>` | 更改默认区域 |\n| `--get-services` | 显示所有可用服务 |\n\
  | `--list-services` | 显示所有运行的服务 |\n| `--add-service=<service-name>` | 添加服务 |\n|\
  \ `--remove-service=<service-name>` | 移除服务\n| `--list-all` | 显示所有内容 |\n| `--add-port=<port/protocol>`\
  \ | 添加端口 |\n| `--remove-port=<port/protocol>` | 移除端口 |\n| `--add-interface=<interface>`\
  \ | 添加接口 |\n| `--remove-interface=<interface>` | 移除接口 |\n| `--add-source=<ip/mask>`\
  \ | 添加源 |\n| `--remove-source=<ip/mask>` | 移除源 |\n| `--permanent` | 将配置写入磁盘 |\n\
  | `--reload` | 重新加载磁盘配置 |\n\n**表 23-3** `firewall-cmd` 选项\n\n### 总结\n\n在本章中，你学习了如何使用\
