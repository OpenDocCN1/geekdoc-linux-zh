  \        [ -h|--help ]\n        [ -q|--quiet ]\n        [ -v|--verbose ]\n     \
  \   [ -y|--yes ]\n        [ -t|--test ]\n        [    --commandprofile String ]\n\
  \        [    --config String ]\n        [    --driverloaded y|n ]\n        [  \
