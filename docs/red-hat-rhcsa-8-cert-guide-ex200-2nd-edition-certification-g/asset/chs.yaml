  \ \"true\"\n    Using metacopy: \"false\"\n  ImageStore:\n    number: 2\n  RunRoot:\
  \ /run/user/1000\n  VolumePath: /home/student/.local/share/containers/storage/volumes\n\
  ```\n\n### 注意事项\n\n容器化环境中发生的大部分工作都在开放容器标准（OCI）中进行了标准化。目前，所有涉及容器的公司都在努力让其容器符合 OCI\
  \ 标准。正因如此，你可以在 podman 环境中无缝使用 Docker 镜像。\n\n### 查找镜像\n\n要查找可用镜像，你可以使用 `podman search`\
  \ 命令。如果你还需要访问来自红帽存储库（Red Hat registries）的镜像，你需要先登录，因为红帽存储库仅对拥有有效 Red Hat 账户的用户开放。使用\
  \ `podman login` 输入你当前的 Red Hat 用户名和密码，这将获得访问这些仓库的权限。要登录仓库，你需要指定想要登录的特定仓库名称。例如，使用\
  \ `podman login registry.access.redhat.com` 登录该特定仓库，并使用 `podman login registry.redhat.io`\
  \ 登录以使用 registry.redhat.io 仓库中的镜像。\n\n在启用对红帽存储库的访问后，使用 `podman search` 查找你需要的镜像。示例\
  \ 26-4 显示了 `podman search` 的部分结果。\n\n```\nINDEX      NAME                  DESCRIPTION\
  \                     STARS   OFFICIAL   AUTOMATED\ndocker.io/library/alpine:latest\
  \  Alpine Linux                     1500    true      false\ndocker.io/library/ubuntu:latest\
  \   Ubuntu                           8000    true      false\ndocker.io/library/centos:latest\
  \   CentOS                           3000    true      false\ndocker.io/library/fedora:latest\
  \   Fedora                           2000    true      false\ndocker.io/library/debian:latest\
  \   Debian                           4000    true      false\ndocker.io/library/rocky:latest\
  \    Rocky Linux                      1500    true      false\ndocker.io/library/nginx:latest\
  \    Nginx                           6000    true      false\ndocker.io/library/redis:latest\
  \    Redis                            5000    true      false\ndocker.io/library/python:latest\
  \  Python                           7000    true      false\ndocker.io/library/node:latest\
  \    Node.js                          4500    true      false\n```\n\n在 `podman\
  \ search` 的输出中，使用了不同的字段来描述镜像。表 26-3 提供了概述。\n\n| 字段 | 说明 |\n| --- | --- |\n| INDEX\
  \ | 镜像所在的仓库名称。 |\n| NAME | 镜像的完整名称。 |\n| DESCRIPTION | 详细描述。使用 `--trunc` 查看完整描述。\
  \ |\n| STARS | 社区点赞数。 |\n| OFFICIAL | 表示该镜像是否由官方提供。 |\n| AUTOMATED | 表示该镜像是否为自动构建。\
  \ |\n\n**表 26-3 podman search 输出字段**\n\n你可能会发现某些情况下 `podman search` 会产生大量结果。为了过滤结果，你可以使用\
  \ `--filter` 选项。例如，使用 `podman search --filter official=true alpine` 仅查看官方 镜像，或者使用\
  \ `podman search --filter stars=5 alpine` 显示至少有 5 星的 alpine 镜像。\n\n#### Tips\n\n\
  在查找镜像时，请搜索红帽的镜像。UBI 代表通用基础镜像（Universal Base Image），它是红帽所有产品的基础。\n\n### 检查镜像\n\n\
  由于镜像是由开源社区提供的，在使用它们之前获取更多信息是重要的。最好的方法是使用 `skopeo inspect` 命令。使用 `skopeo` 检查镜像的优势在于直接从仓库进行检查，无需先拉取镜像。\n\
  \n或者，你可以检查本地镜像。要这样做，请使用 `podman inspect`。该命令仅适用于本地系统上的镜像，但提供的输出比 `skopeo inspect`\
  \ 更详细。使用 `podman images` 获取本地镜像列表，并使用 `podman pull` 先获取镜像。示例 26-5 显示了 `podman inspect`\
  \ 命令的部分结果。\n\n```\n[\n  {\n    \"Id\": \"sha256:83d1672171717171717171717171717171717171717171717171717171717171\"\
  ,\n    \"RepoTags\": [\n      \"alpine:latest\"\n    ],\n    \"Size\": 52428800\n\
  \  }\n]\n```\n\n**示例 26-5 使用 podman inspect 验证镜像内容**\n\n\n\n\n\n```bash\nstudent@podman\
  \ ~]$ podman inspect busybox\n[\n    {\n        \"Id\": \"6858809bf669cc5da7cb6af83d0fae838284d12e1be0182f92f6bd96559873e3\"\
  ,\n        \"Digest\": \"sha256:d366a4665ab44f0648d7a00ae3fae139d55e32f9712c67accd604bb55df9d05a\"\
  ,\n        \"RepoTags\": [\n            \"docker.io/library/busybox:latest\"\n \
  \       ],\n        \"RepoDigests\": [\n            \"docker.io/library/busybox@sha256:2ca5e69e244d2da7368f708ea3ad0653c3ce7aaccd0b8823d11b0d5de956002\"\
  ,\n            \"docker.io/library/busybox@sha256:d366a4665ab44f0648d7a00ae3fae139d55e32f9712c67accd604bb55df9d05a\"\
  \n        ], \n        \"Parent\": \"\",\n        \"Comment\": \"\",\n        \"\
  Created\": \"2020-09-09T01:38:02.334927351Z\",\n        \"Config\": {\n        \
  \    \"Env\": [\n                \"PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/bin:/sbin:/bin\"\
  \n            ],\n            \"Cmd\": [\n                \"sh\"\n            ]\n\
  \        },\n        \"Version\": \"18.09.7\",\n        \"Author\": \"\",\n    \
  \    \"Architecture\": \"amd64\",\n        \"Os\": \"linux\",\n        \"Size\"\
  : 1454611,\n        \"VirtualSize\": 1454611,\n        \"GraphDriver\": {\n    \
  \        \"Name\": \"overlay\",\n            \"Data\": {\n                \"UpperDir\"\
  : \"/home/student/.local/share/containers/storage/overlay/be8b8b42328a15af9dd6af4cba85821aad30adde28d249d1ea03c74690530d1c/diff\"\
  ,\n                \"WorkDir\": \"/home/student/.local/share/containers/storage/overlay/be8b8b42328a15af9dd6af4cba85821aad30adde28d249d1ea03c74690530d1c/work\"\
  \n            }\n        },\n        \"RootFS\": {\n            \"Type\": \"layers\"\
  ,\n            \"Layers\": [\n                \"sha256:be8b8b42328a15af9dd6af4cba85821aad30adde28d249d1ea03c74690530d1c\"\
  \n            ]\n        },\n        \"Labels\": null,\n        \"Annotations\"\
  : {},\n        \"ManifestType\": \"application/vnd.docker.distribution.manifest.v2+json\"\
  ,\n        \"User\": \"\",\n        \"History\": [\n            {\n            \
  \    \"created\": \"2020-09-09T01:38:02.18459328Z\",\n                \"created_by\"\
  : \"/bin/sh -c #(nop) ADD file:72be520892d0a903df801c6425de761264d7c1bc7984d5cf285d778147826586\
  \ in / \"\n            },\n            {\n                \"created\": \"2020-09-09T01:38:02.334927351Z\"\
  ,\n                \"created_by\": \"/bin/sh -c #(nop)  CMD [\\\"sh\\\"]\",\n  \
  \              \"empty_layer\": true\n            }\n        ]\n    }\n]\n```\n\n\
  当你使用 `podman inspect` 时，你应该关注的最有价值的信息是命令 (`Cmd`)。这是镜像在作为容器启动时默认运行的命令。请记住：容器只是启动应用程序的一种高级方式，而\
  \ `Cmd` 行将告诉你是运行的是哪一个应用程序。\n\n**提示**\n\n要运行容器，你可以使用 `podman run`。该命令会先拉取镜像，将其存储在本地系统中，然后运行容器。你也可以先使用\
  \ `podman pull` 存储镜像而不运行它，在拉取镜像之后，你仍然可以运行它。这种第二种方法更安全，因为它允许你在运行镜像之前检查其包含的内容。\n\n\
  ### 执行镜像清理\n\n对于你启动过的每一个容器，镜像都会被下载并存储在本地。为了防止你的系统被占满，你可能需要定期进行一些清理工作。要移除容器镜像，请使用\
  \ `podman rm`（注：此处原文可能笔误，通常移除镜像使用 `podman rmi`，此处按原文翻译）。\n\n### 管理容器\n\n停止容器后，它仍然存在于本地系统中。这种可用性非常方便，因为它允许你重新启动，并保留已在可写层中进行的修改。但是，如果你频繁启动和停止容器且不需要保留容器文件，请使用\
  \ `podman rm` 来移除这些容器文件。或者，使用 `podman run --rm` 来运行容器，该命令确保在运行结束后自动清理容器文件。\n\n####\
  \ 管理容器状态\n\n要查看容器状态，请使用 `podman ps`。管理运行中的容器：\n\n* `podman stop` 向容器发送 `SIGTERM`\
  \ 信号。如果 10 秒后没有结果，将发送 `SIGKILL` 命令。\n* `podman kill` 立即发送 `SIGKILL` 命令。在大多数情况下，这是必要的，因为\
  \ `podman stop` 也会发送 `SIGKILL`。\n* `podman restart` 重启正在运行的容器。\n* `podman start`\
  \ 启动未运行的容器。\n\n#### 在容器内运行命令\n\n当容器启动时，它会执行容器入口命令。这是容器镜像中指定的默认启动命令。在某些情况下，你可能还需要在容器内运行其他命令。为此，你可以使用\
  \ `podman exec` 命令。这允许你在容器内运行第二个命令，前提是该命令存在于命名空间的容器文件系统中。\n\n在运行命令时，你可以将其作为一次性命令运行。在这种情况下，命令输出将写入\
  \ STDOUT。你也可以在交互 TTY 模式下使用 `podman exec` 在容器内运行多个命令。例如，你可以使用 `podman exec mycontainer\
  \ uname -r` 运行命令并将输出写入 STDOUT，或者使用 `podman exec -it mycontainer /bin/bash` 在容器内打开一个\
  \ Bash Shell 并从那里运行多个命令。\n\n#### 管理容器端口\n\n\n\n\n\n`podman` 中的无根容器（Rootless containers）在没有网络地址的情况下运行，因为无根容器没有足够的权限来分配网络地址。为了让容器运行的服务可以从外部访问，你需要配置端口转发，即使用容器主机上的一个端口来访问容器应用程序中的端口。请注意，由于你运行的是无根容器，你只能指定主机上的非特权端口：端口\
  \ 1–1024 仅供 root 用户访问。\n\n### 提示\n\n如果你确实想运行一个具有 IP 地址并可以绑定到特权端口的容器，你需要运行一个根容器（root\
  \ container）。使用 `sudo podman run ...` 来运行 root 容器。如果你运行了 root 容器，还需要使用 `sudo podman\
  \ ps` 来验证它正在运行。root 容器运行在 root 用户命名空间中，因此普通用户无法访问或看到它。反之亦然：如果你输入 `sudo podman ps`，你只会看到\
  \ root 容器，而看不到用户启动的无根容器。\n\n要运行带有端口转发的容器，向 `podman run` 命令中添加 `-p` 选项。使用 `podman\
  \ run --name nginxport -d -p 8080:80 nginx` 来运行 nginx 镜像作为容器，并使 nginx 进程在主机端口 8080\
  \ 上可访问，该端口将转发到 nginx 提供服务的标准 http 端口 80。之后，别忘记使用 `sudo firewall-cmd --add-port 8080/tcp\
  \ --permanent; sudo firewall-cmd --reload` 来在防火墙中也打开该端口！在主机端口上暴露 Web 服务器容器后，你可以使用\
  \ `curl localhost:8080` 来验证访问情况。练习 26-4 将引导你完成这一过程。\n\n### 容器环境变量的管理\n\n许多容器可以在不提供任何额外信息的情况下启动。某些容器需要进一步指定其工作方式。这些信息通常通过环境变量传递。一个广为人知的例子是，你必须传递环境变量才能成功运行\
  \ mariadb 容器。\n\n如果一个容器需要环境变量来完成工作，有几种方法可以找出这一点：\n\n![](img/key_topic_icon.jpg)\n\
  \n*   直接在不带任何环境变量的情况下运行容器。它会立即停止，主程序将生成错误消息。对你的容器使用 `podman logs` 来读取日志，以获取有关何出错的信息。\n\
  *   使用 `podman inspect` 查看容器镜像中是否存在 `usage` 行，该行会告诉你如何运行容器。\n\n在你找到如何运行容器后，使用 `-e`\
  \ 选项指定环境变量并运行它。例如，运行一个 mariadb 实例，可以使用 `podman run -d -e MYSQL_ROOT_PASSWORD=password\
  \ -e MYSQL_USER=anna -e MYSQL_PASSWORD=password -e MYSQL_DATABASE=mydb -p 3306:3306\
  \ mariadb`。练习 26-5 将引导你完成使用环境变量运行容器的过程。\n\n### 容器存储的管理\n\n当从镜像启动容器时，系统会为容器添加一个可写层（writable\
  \ layer）。可写层是瞬态的：对容器镜像的修改会被写入可写层，但当容器被删除时，应用在容器中的所有修改也会被删除。因此，如果你在容器中运行应用程序并希望确保修改被持久存储，你需要添加持久化存储。\n\
  \n要为 Podman 容器添加持久化存储，你需要将主机操作系统上的一个目录绑定挂载（bind-mount）到容器中。绑定挂载是一种特定的挂载类型，挂载的是目录而不是块设备。这样做确保主机操作系统上目录的内容在容器内是可以访问的。因此，当文件在容器内写入绑定挂载的目录时，它们也会提交到主机操作系统，从而确保数据在容器生命周期结束后可用。对于更高级的存储，你应该使用编排解决方案。当你使用\
  \ OpenShift 或 Kubernetes 时，可以很容易地向容器暴露不同类型的云和数据中心存储。\n\n要从容器访问主机目录，需要对其进行准备：\n\n\
  ![](img/key_topic_icon.jpg)\n\n*   主机目录对于运行容器的用户账户必须必须是可写的。\n*   必须将适当的 SELinux\
  \ 上文标签设置为 `container_file_t`。\n\n显然，`container_file_t` 上文标签可以由具有管理员权限的用户手动设置，命令为\
  \ `semanage fcontext -a -t container_file_t \"/hostdir(/.*)?\"; restorecon`。它也可以自动设置，但只有当运行容器的用户是该目录的所有者时才有效。仅有用户对目录的写权限是不够的！\n\
  \n要挂载卷，你使用 `--volume host_dir:container_dir` 命令。如果运行容器的用户是所有者，或者容器是 root 容器，可以使用\
  \ `--volume host_dir:container_dir:Z` 作为自动设置 SELinux 上文的替代方案。因此，为了确保以数据库文件存储在主机操作系统的方式启动\
  \ mariadb 数据库，你使用 `podman run -d --name mydb -v /home/$(id -un)/dbfiles:/var/lib/mysql:Z\
  \ -e MYSQL_USER=user -e MYSQL_PASSWORD=password -e MYSQL_DATABASE=mydatabase registry.redhat.io/rhel8/mariadb-103。练习\
  \ 26-6 你可以练习使用存储运行容器。\n\n### 作为 systemd 服务运行容器\n\n随着容器越来越多成为启动服务的方式，需要一种方法来自动启动它们。当你使用\
  \ Kubernetes 或 OpenShift 进行编排时，这很容易：编排平台会确保容器启动，除非你认为不需要这种行为。在运行无根容器的独立平台上，需要 systemd\
  \ 来自动启动容器。\n\n在 systemd 中，可以使用 root 权限轻松启动和启用服务，如 `systemctl enable --now myservice.service`。如果没有\
  \ root 权限，你需要使用 `systemctl --user`。`--user` 选项允许用户空间空间运行常用的 systemd 命令。这适用于任何不需要\
  \ root 权限的服务；例如，使用 `systemctl --user start myservice.service` 启动 myservice。\n\n\
  默认情况下，使用 `systemctl --user` 时服务只会在用户会话启动时自动启动。为了定义这种异常，可以使用 `loginctl` 会话管理器，它是\
  \ systemd 为特定用户账户启用“留存”（linger）的解决方案。如果你使用 `loginctl enable-linger myuser`，将为该用户启用此功能。启用后，systemd\
  \ 服务将在系统启动时启动，而不仅仅是用户登录时。\n\n下一步是生成 systemd 单元来启动容器。显然，你可以自己编写这些文件，也可以使用 `podman\
  \ generate systemd --name mycontainer --files` 生成。注意，此容器文件必须生成在 `~/.config/systemd/user/`\
  \ 目录下，因此在运行 `podman generate` 命令之前，你必须创建该目录并切换到该目录。\n\n`podman generate systemd`\
  \ 命令假设已经创建了名为 mycontainer 的容器，并将生成一个可以使用 `systemctl --user enable container-mycontainer.service`\
  \ 启用的单元文件。在示例 26-6 中你可以看到这样的单元文件。\n\n**示例 26-6** Podman 自动生成的容器服务文件\n\n点击查看代码图像\n\
  \n\n\n\n```\n# container-mynginx.service\n# autogenerated by Podman 1.9.3\n# Thu\
  \ Sep 24 16:00:53 CEST 2020\n\n[Unit]\nDescription=Podman container-mynginx.service\n\
  Documentation=man:podman-generate-systemd(1)\nWants=network.target\nAfter=network-online.target\n\
  \n[Service]\nEnvironment=PODMAN_SYSTEMD_UNIT=%n\nRestart=on-failure \n\nExecStart=/usr/bin/podman\
  \ start mynginx\nExecStop=/usr/bin/podman stop -t 10 mynginx\nPIDFile=/run/user/1001/containers/overlay-containers/554ead617fd692884f\n\
  cd8dbcd38c3f53727d91f84be8d9785c503f71136df1f9/userdata/conmon.pid\nKillMode=none\n\
  23\n~z\n[Install]\nWantedBy=multi-user.target\n```\n\n不过这里有一个小问题：在启用 systemd 用户服务之前，你必须确保服务单元文件中的\
  \ `WantedBy` 行已更改。默认情况下，它的内容是 `WantedBy=multi-user.target`。然而，systemd 用户环境并不具备 `multiuser.target`，因此这一行应该更改为\
  \ `WantedBy=default.target`。\n\n在练习 26-7 中，你可以练习使用 Podman 自动生成的 systemd 单元文件。\n\n\
  ### 考试准备任务\n\n正如引言中的“[如何使用本书”章节部分提到的，你有几种准备考试的方案：章节末的实验；附录 B 中的记忆表；第 27 章“[最终准备]”以及模拟考试。\n\
  \n### 复习所有核心知识点\n\n回顾章节中最重要的主题，这些主题在页码外边页用“核心知识点”图标标记。表 26-4 列出了这些核心知识点的索引及其对应的页码。\n\
  \n![](img/key_topic_icon.jpg)\n\n| 核心知识点元素 | 描述 | 页码 |\n\n| --- | --- | --- |\n\
  | 列表 | 管理容器的三个主要工具 | 546 |\n| 列表 | 容器所需的 Linux 内核特性 | 546 |\n| 列表 | `registries.conf`\
  \ 设置 | 553 |\n| 列表 | 管理容器状态的命令 | 561 |\n| 列表 | 查找使用的变量信息 | 564 |\n| 列表 | 准备主机存储\
  \ | 565 |\n\n**表 26-4** 第 26 章 核心知识点\n\n### 记忆完成表格和列表\n\n本章中没有记忆表或列表。\n\n### 定义核心术语\n\
  \n定义本章中的以下核心术语并在词表中检查你的答案：\n\ncontainer\ncontainer engine\nCRI-o\nDocker\nimage\n\
  Kubernetes\nlinger\nnamespace\nOpenShift\norchestration\nregistry\n\n### 复习题\n\n\
  接下来的问题旨在帮助你测试自己的知识。你可以在附录 A 中找到这些问题的答案。\n\n1. 启动的 `container` 名称什么什么？\n2. 需要哪三个\
  \ `Linux` 特性？\n3. 该 `container engine` 的名称是什么？\n4. 使用了哪些 `registries`？\n5. 启动 `container`\
  \ 后发生了什么？\n6. Red Hat 提供的 `container` 名称是什么？\n7. 你如何调度 `container`？\n8. `/etc/os-release`\
  \ 的内容是什么？\n9. 使用什么命令来生成 `container`？\n10. `systemd` 文件的名称是什么？\n\n### 章节实验\n\n到此时，你应该已经熟悉\
  \ `container`。你现在可以完成章节末的实验了。\n\n1. 确保你拥有 `container`。\n2. 下载 `container`。\n3. 使用以下命令启动\
