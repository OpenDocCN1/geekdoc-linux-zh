  \ `-15`。观察差异。\n3. 杀死你刚刚启动的所有 `dd` 进程。\n4. 确保 `tuned` 已安装并激活，设置 `throughput-performance`\
  \ 配置。\n\n\n\n\n\n“我已经学过这些吗？”测验可以让你评估自己是应该仔细阅读整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或对你自己对主题知识的评估有疑问，请阅读整个章节。表\
