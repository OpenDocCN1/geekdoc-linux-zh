  \ commands.\n```\n\n### 示例 15-5 使用 `lsblk` 查看存储概述\n\n```\n[root@control ~]# lsblk\n\
  NAME          MAJ:MIN RM  SIZE TYPE MOUNTPOINT\nsda             8:0    0   20G disk\
  \ \n├-sda1         8:1    0    1G part /boot\n└-sda2         8:2    0  19G part\
  \ lvm\nsdc             8:34   0   20G disk \n└-sdc1         8:35   0 1023M part\
  \ lvm\n```\n\n\n\n\n\n# 卷组 (Volume Groups)\n\n在创建卷组时，会使用物理区（physical extent）。物理区大小定义了用于创建逻辑卷的构建块的大小。逻辑卷的大小始终是物理区大小的倍数。如果你需要创建巨大的逻辑卷，使用较大的物理区大小会更有效。如果你不指定任何内容，则将使用\
  \ 4.00 MiB 的默认区大小。物理区大小始终被指定为 2 MiB 的倍数，最大大小为 128 MiB。使用 `vgcreate -s` 选项来指定你想要使用的物理区大小。\n\
  \n### 注意\n\n在使用 LVM 时，有一个 `physical`（物理）区大小需要考虑。这是在 LVM 配置中使用的基本构建块的大小。当你使用 ext4\
  \ 文件系统时，使用的是 `logical`（逻辑）区（extent）。LVM 上的区大小与文件系统上使用的区大小完全没有关系。\n\n创建卷组后，你可以使用\
  \ `vgs` 命令获取卷组的简要摘要，或使用 `vgdisplay` 命令获取更多信息。示例 15-6 显示了 `vgdisplay` 命令输出的示例。\n\n\
  **示例 15-6** 显示当前卷组属性\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# vgdisplay\n...\n  ---\
  \ Volume group ---\n  VG Name                vgdata\n  System ID             \n\
  \  Format                 lvm2\n  Metadata Areas         1\n  Metadata Sequence\
  \ No   2\n  VG Access              read/write\n  VG Status              resizable\n\
  \  MAX LV                 0\n  Cur LV                 1\n  Open LV             \
  \   0\n  Max PV                 0\n  Cur PV                 1\n  Act PV        \
  \         1\n  VG Size                1020.00 MiB\n  PE Size                4.00\
  \ MiB\n  Total PE               255\n  Alloc PE / Size        127 / 508.00 MiB\n\
  \  Free  PE / Size        128 / 512.00 MiB\n  VG UUID                b68TU5-UPQv-xQRB-7Djx-SuZf-agDb-vAujYD\n\
  ```\n\n## 创建逻辑卷和文件系统\n\n现在卷组已经创建完成，你可以开始从它创建逻辑卷了。此过程比创建物理卷或卷组稍微复杂一点，因为有更多的选项需要选择。在创建逻辑卷时，你必须指定卷名称和大小。\n\
  \n卷的大小可以使用 `-L` 选项指定为绝对值。例如，使用 `-L 5G` 创建一个大小为 5-GiB 的 LVM 卷。或者，你可以使用 `-l` 选项使用相对大小。例如，使用\
  \ `-l 50%FREE` 使用所有可用磁盘空间的一半。你还需要指定逻辑卷所属的卷组名称，并且可选（但强烈建议）你可以使用 `-n` 指定逻辑卷的名称。例如，使用\
  \ `lvcreate -n lvvol1 -L 100M vgdata` 创建一个名为 lvvol1 的逻辑卷并将其添加到 vgdata 卷组中。一旦创建了逻辑卷，你就可以\
  \ `mkfs` 工具在其创建一个文件系统。\n\n## 理解 LVM 设备命名\n\n现在逻辑卷已经创建完成，你就可以开始使用它了。要做到这一点，你需要知道设备名称。LVM\
  \ 卷设备名称可以通过多种方式寻址。简单的方法是将设备寻址为 `/dev/vgname/lvname`。例如，如果你创建了一个名为 lvdata 的卷，它从 vgdata\
  \ 卷组获取可用磁盘空间，那么设备名称将是 `/dev/vgdata/lvdata`，这实际上是到设备映射（device mapper）名称的符号链接（将在下一步解释）。\n\
  \n为 LVM 卷命名时，另一个系统起了作用：设备映射。设备映射（简称为 `dm`）是 Linux 内核用于访问设备的通用接口。设备映射被多种设备类型使用，例如\
  \ LVM 卷，但也用于软件 RAID 和高级网络设备（如多路径设备）。\n\n设备映射设备在检测时生成，并使用类似 `/dev/dm-0` 和 `/dev/dm-1`\
  \ 的无意义名称。为了方便访问这些设备，设备映射在 `/dev/mapper` 目录下创建了指向这些无意义设备名的符号链接。符号链接遵循 `/dev/mapper/vgname-lvname`\
  \ 的命名结构。\n\n因此，设备 `/dev/vgdata/lvdata` 也称为 `/dev/mapper/vgdata-lvdata`。在使用 LVM 逻辑卷时，你可以使用这两种设备名称之一。示例\
  \ 15-7 显示了设备映射提供的不同 LVM 设备名称概述。在练习 15-2 中，你将学习如何创建卷组和逻辑卷。\n\n**示例 15-7** LVM 设备名称概述\n\
  \n点击此处查看代码图像\n\n```\n[root@server1 ~]# \\ls /dev/vgdata/lvdata\n...\n[root@server1\
  \ ~]# \\ls /dev/mapper/vgdata-lvdata\n```\n\n## 调整 LVM 卷的大小\n\n使用 LVM 的主要优势之一是 LVM\
  \ 卷很容易调整大小，这在磁盘空间不足时非常有用。如果使用的是 XFS 文件系统，卷可以增大但不能缩小。Ext4 等文件系统支持减小文件系统大小。你只能在离线状态下缩小\
  \ Ext4 文件系统，这意味着在调整大小之前需要卸载它。在本节中，你将学习如何增大 LVM 卷的大小。要增大逻辑卷的大小，卷卷组中有可用磁盘空间，因此我们先处理这个问题。\n\
  \n### 调整卷组的大小\n\nLVM 灵活性最重要的特征之一在于，调整卷组以及使用磁盘空间的逻辑卷的大小非常简单。`vgextend` 命令用于向卷组添加存储，而\
  \ `vgreduce` 命令用于从卷组中移除物理卷（这会导致一些额外的复杂性）。对于 RHCSA 考试，你需要知道如何扩展卷组中的可用存储。此过程相对简单：\n\
  \n1.  确保有一个物理卷或设备可以添加到卷组中。\n2.  使用 `vgextend` 扩展卷组。新的磁盘空间将立即显示在卷组中。\n\n扩展卷组后，你可以使用\
  \ `vgs` 命令验证是否已将物理卷添加到卷组。在示例 15-8 中，你可以看到 vgdata VG 包含两个物理卷。\n\n\n\n\n\n# 示例 15-8\
  \ 使用 `vgs` 验证 VG 调整大小操作\n\n点击此处查看图像\n\n```\n[root@server1 ~]# vgs\n  VG      #PV\
  \  #LV  #SN   Attr     VSize      VFree  \n  centos    1    2    0   wz--n-   <19.00g\
  \    0 \n  vgdata    2    1    0   wz--n-   1020.00m   512.00m\n```\n\n## 调整逻辑卷和文件系统\n\
  \n就像卷组可以使用 `vgextend` 命令扩展一样，逻辑卷可以使用 `lvextend` 命令进行扩展。该命令有一个非常有用的选项 `-r`，可以同时扩展逻辑卷上的文件系统；建议使用此选项，而不是使用分别扩展逻辑卷和在逻辑卷上扩展文件系统的备选方法。如果文件系统正在增大，大多数文件系统调整大小的操作都可以在线完成，而无需卸载文件系统。\n\
  \n要增大逻辑卷的大小，请使用 `lvextend` 或 `lvresize`，后跟 `-r` 选项来调整其使用的文件系统的大小。然后指定你希望调整后的卷的大小。这样做最简单且直观的方法是使用\
  \ `-L` 后跟 `+` 号以及你想增加的磁盘空间量，例如 `lvresize -L +1G -r /dev/vgdata/lvdata`。调整逻辑卷的另一种方法是使用\
  \ `-l` 选项。该选项后跟随添加到逻辑卷的区（extents）数量，或者是卷组中将使用的区的绝对值或相对百分比。例如，你可以使用以下命令来调整逻辑卷：\n\n\
  *   `lvresize -r -l 75%VG /dev/vgdata/lvdata` 这将调整逻辑卷，使其占用卷组总磁盘空间的 75%。\n*   `lvresize\
  \ -r -l +75%VG /dev/vgdata/lvdata` 这尝试将卷组总大小的 75% 添加到逻辑卷中。（注意这与上一个命令的区别。）\n*   `lvresize\
  \ -r -l +75%FREE /dev/vgdata/lvdata` 这将所有可用磁盘空间的 75% 添加到逻辑卷。\n*   `lvresize -r -l\
  \ 75%FREE /dev/vgdata/lvdata` 这将调整逻辑卷，使其总大小等于可用磁盘空间量的 75%。（注意这与上一个命令的区别。）\n\n逻辑区（logical\
  \ extent）是创建逻辑卷时使用的逻辑构建块，它映射到物理区（physical extent），物理区的大小可以在创建卷组时指定。所有的调整大小操作都必须匹配完整的逻辑区。你有时会发现调整的大小会被向上或向下取整到逻辑区的大小。你也可以通过在使用\
  \ `lvresize` 命令时使用 `-l` 选项直接指定需要添加或删除的逻辑区数量。\n\n如你所见，调整逻辑卷有许多选项，你需要小心使用正确的选项，因为很容易出错！在练习\
  \ 15-3 中，你将学习如何调整逻辑卷以及其上层使用的文件系统的大小。\n\n**注意**\n\nXFS 文件系统的大小不能减小，只能增大。如果你需要一个可以缩小大小的文件系统，请使用\
  \ Ext4 而不是 XFS。\n\n## 配置 Stratis\n\n在 RHEL 8 中，Red Hat 添加了两种高级存储类型：Stratis 和 VDO。Stratis\
  \ 是一种卷管理文件系统，它引入了以前的 RHEL 版本中不具备的高级存储功能：\n\n*   **精简置备（Thin provisioning）：** 此功能允许\
  \ Stratis 文件向用户呈现比其实际占用大得多的空间。这在许多环境中非常有用，例如虚拟桌面，其中每个用户可能看到总共 20 GiB 的可用存储，尽管实际上为每个用户分配的要少得多。\n\
  *   **快照（Snapshots）：** Stratis 快照允许用户对文件系统的当前状态拍摄“照片”。此快照可以轻松恢复到文件系统的之前的状态，回滚已做的任何更改。\n\
  *   **缓存层（Cache tier）：** 缓存层是 Ceph 存储的一个功能，确保数据在物理上更靠近 Ceph 客户端，从而提高数据访问速度。\n* \
  \  **编程 API（Programmatic API）：** 编程 API 确保可以通过 API 访问方便地配置和修改存储。这在云环境中特别有趣，直接从云原生应用程序设置存储是非常实用的。\n\
  *   **监控与修复（Monitoring and repair）：** 旧的文件系统需要如 `fsck` 等工具来验证文件系统的完整性，而 Stratis\
  \ 具有内置功能来监控文件系统的健康并在必要时进行修复。\n\n### 理解 Stratis 架构\n\nStratis 架构的最低底层是池（pool）。从功能角度来看，Stratis\
  \ 池类似于 LVM 卷组。`pool` 代表所有可用存储，并由一个或多个存储设备组成，在 Stratis 环境中，这些存储设备被称为 `blockdev`。这些块设备在底层可能没有经过精简置备。从\
  \ Stratis 池中创建 XFS 文件系统。请注意，Stratis 仅支持 XFS，并且 Stratis 为每个池创建一个 `/dev/stratis/poolname`。\n\
  \n### 创建 Stratis 存储\n\n创建 Stratis 卷是一个多步骤的过程。本节提供概述，接下来的练习 15-4 将指导操作。在开始之前，请确保用于\
  \ Stratis 的块设备至少有 1 GiB。\n\n1.  使用 `yum` 安装 Stratis 软件，安装 `stratis-cli` 和 `stratisd`\
  \ 软件包。\n2.  启动并启用用户空间守护进程，使用 `systemctl enable --now stratisd`。\n3.  一旦守护进程运行，使用\
  \ `stratis pool create` 命令创建要使用的池。例如，使用 `stratis pool create mypool /dev/sdd` 创建基于\
  \ `/dev/sdd` 的池。你可以之后添加块设备，使用 `stratis pool add-data poolname blockdevname`，例如 `stratis\
  \ pool add-data mypool /dev/sde`。\n4.  创建池后，使用 `stratis fs create poolname fsname`\
  \ 添加文件系统。\n5.  使用 `stratis fs list` 命令验证是否创建成功。\n6.  创建文件系统后，你可以挂载它。在 `/etc/fstab`\
  \ 中挂载 Stratis 文件系统时，*必须*使用 UUID；不支持设备名称。此外，在 `/etc/fstab` 中挂载 Stratis 卷时，包含挂载选项\
  \ `x-systemd.requires=stratisd.service`，以确保 Systemd 等待 stratisd 服务加载后再激活此设备。\n\n\
  ### 管理 Stratis\n\n创建 Stratis 文件系统后，你可以执行若干不同的管理任务。首先，你可以使用 `stratis pool add-data`\
  \ 动态扩展池。此外，你需要使用 Stratis 专用工具监控 Stratis 卷，因为传统的 Linux 工具无法处理精简置备卷。可用命令如下：\n\n* \
  \  `stratis blockdev`: 显示所有用于 Stratis 的块设备的信息。\n\n\n\n\n\n*   `stratis pool`: 提供有关\
  \ Stratis 池的信息。请特别注意 `Physical Used`（物理已）参数，它不应该过于接近 `Physical Size`（物理大小）参数。\n\
  *   `stratis filesystem`: 允许你监控单个文件系统。\n\n你必须管理的另一个 Stratis 特性是快照（snapshot）。快照包含了快照创建瞬间文件系统的状态。在创建后，可以对快照进行修改。同样需要了解的是，快照和它的源之间是没有关联的，这使得快照的寿命比创建它的文件系统更长。这与\
  \ LVM 快照等有本质区别，在 LVM 快照中，如果与其关联的卷被删除，则快照将无法继续存在。\n\n在练习 15-4 中，你设置了一个带有 Stratis\
  \ 卷的环境。\n\n### 配置 VDO\n\n在上一节中，你学习了 Stratis。在本节中，你将学习虚拟数据优化器（Virtual Data Optimizer，简称\
  \ VDO），这是一种为了提供数据去重功能而开发的解决方案。\n\n#### 理解 VDO\n\n虚拟数据优化器是 RHEL 8 提供的另一种高级存储解决方案。VDO\
  \ 的开发目的是通过应用去重功能减少块设备上的磁盘空间占用。VDO 通过创建卷，在任何类型的现有块设备之上实现去重。在 VDO 设备之上，你可以创建一个文件系统，也可以将其用作\
  \ LVM 设置中的物理卷（physical volume）。\n\nVDO 的主要目的是数据去重。它通过使用三种常用技术来实现数据去重：\n\n*   零块消除过滤器（Zero-block\
  \ elimination filters）过滤掉只包含零的数据块。\n*   去重（Deduplication）减少冗余数据块。\n*   当*** `kvdo`\
  \ 内核模块压缩数据块时，会发生压缩（Compression）。\n\nVDO 在特定环境中特别有用。典型的用例是容器和虚拟机的宿主机平台，在这些环境中，去重引擎确保了更高效的磁盘存储使用。通常，在这种环境下，逻辑大小可以达到物理大小的十倍。\n\
  \n另一个 VDO 表现良好的典型环境是云块存储。例如，如果将 VDO 作为 Ceph 存储的底层存储层，逻辑大小可以达到物理大小的三倍。\n\n#### 设置\
  \ VDO\n\n要配置 VDO，你首先需要确保底层块设备的最小大小为 4 GiB。接下来，你需要安装 `vdo` 和 `kmod-vdo` 包。这些包确保了所需的内核模块可用。\n\
  \n接下来，使用 `vdo create` 命令创建设备。在创建设备时，可以使用 `--vdoLogicalSize=` 选项指定卷的大小。例如，使用 `vdo\
  \ create --name=vdo1 --device=/dev/sde --vdoLogicalSize=1T` 创建一个逻辑 TiB 的卷。\n\n创建设备后，你可以使用\
  \ `mkfs.xfs -K /dev/mapper/vdo1` 在其上创建一个 XFS 文件系统。`mkfs.xfs` 的 `-K` 防止文件系统中的未使用块被立即丢弃，这显著加快了命令执行速度。\n\
  \n文件系统完成后，可以在 `/etc/fstab` 中添加一行来自动挂载它。确保包含挂载选项 `x-systemd.requires=vdo.service,discard`，这将触发\
  \ `vdo systemd` 服务的加载。要验证所有操作运行正常，你现在可以使用命令 `vdostats --human-readable`。\n\n提示\n\
  \n记忆用于使 VDO 挂载持久化的选项可能具有挑战。幸运的是，在 `/usr/share/doc/vdo/examples/systemd` 中有一个 Systemd\
  \ 挂载文件示例，如示例 15-9\n\n```\n[Unit]\nDescription = Mount filesystem that lives on VDO\n\
  name = VDO.mount\nRequires = vdo.service systemd-remount-fs.service\nAfter = multi-user.target\n\
  Conflicts = umount.target\n[Mount]\nWhat = /dev/mapper/my_vdo\nWhere = /VDO\nType\
  \ = xfs\nOptions = discard\n\n[Install]\nWantedBy = multi-user.target\n[root@localhost\
  \ systemd]# pwd\n/usr/share/doc/vdo/examples/systemd\n```\n\n练习 15-5 引导你完成创建精简配置（thin-provisioned）VDO\
  \ 卷的步骤。\n\n### 总结\n\n在本章，你学习了如何在 RHEL 8 上使用高级存储。首先，你阅读了如何使用 LVM 为存储带来灵活性。通过使用 LVM，你可以获得轻松调整大小的卷和多设备逻辑卷的优势。接下来，你学习了\
  \ Stratis，这是一种卷管理文件系统。Stratis 为 RHEL 8 带来了下一代存储功能，并默认创建精简配置的文件系统。最后，你学习了如何使用 VDO（虚拟数据优化器）在特定场景下实现数据去重。\n\
