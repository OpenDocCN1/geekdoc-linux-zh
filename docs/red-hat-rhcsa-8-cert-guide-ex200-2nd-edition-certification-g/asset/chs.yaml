  \n### 实验 23.1\n\n1. 创建一个防火墙配置，允许访问服务器上可能运行的内核：\n    * web\n    * ftp\n    * ssh\n\
  2. 确保该配置是持久的，并在服务器重启后能够激活。\n\n## 第 24 章：访问网络存储\n\n**本章涵盖了以下主题：**\n\n* 使用 NFS 服务\n\
  * 使用 CIFS 服务\n* 通过 fstab 挂载远程文件系统\n* 使用 Automount 挂载远程文件系统\n\n本章涵盖了以下 RHCSA 考试目标：\n\
  \n* 使用 NFS 挂载和卸挂载网络文件系统\n\nRHCSA 考试要求你了解如何访问网络存储。这涉及不同的主题。在本章中，我们将讨论访问通过 CIFS 和\
  \ NFS 提供的网络存储。你将学习如何通过 `fstab` 文件挂载网络存储，以及如何使用 automount 自动挂载这些存储。\n\n### “我已经掌握了吗？”测验\n\
  \n“我已经掌握了吗？”测验可以帮助你评估应该仔细通读本章，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题的知识掌握评估有疑问，请通读整个章节。表\
  \ 24-1 列出了本章的主要标题及其对应的“已经掌握了吗？”测验题。你可以在附录 A“‘已经掌握了吗？测验和‘复习题’答案。”中找到答案。\n\n| 基础主题章节\
