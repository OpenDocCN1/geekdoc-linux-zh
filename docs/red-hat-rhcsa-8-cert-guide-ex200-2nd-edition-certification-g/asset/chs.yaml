  \n1. 安装一个符合以下要求的 `RHEL 8` 或 `CentOS 8` 虚拟机：\n    * 2 GB 内存\n    * 20 GB 磁盘空间，使用默认分区\n\
  \    * 一个额外的 20 GB 磁盘，且未安装任何分区\n    * 带有 GUI 安装模式的服务器\n\n2. 创建用户 `student` 且密码为\
