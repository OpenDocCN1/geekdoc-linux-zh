  \ (后台)\n* foreground (前台)\n* nice\n* kill\n* signal (信号)\n* PID\n* thread (线程)\n\
  * tuned\n* profile (配置)\n* zombie (僵尸进程)\n\n### 复习题\n\n后续问题旨在帮助你测试对概念、术语以及知识面的掌握。你可以在附录\
  \ A 中找到这些问题的答案。\n\n1. 哪个命令提供了所有当前 shell 作业的概览？\n2. 如何停止当前的 shell 作业以便在后台继续运行？\n\
  3. 你可以使用什么按键组合来取消当前的 shell 作业？\n4. 用户要求你取消他启动的一个作业。你无法访问该用户当前所在的 shell。你如何仍然取消该作业？\n\
  5. 哪个命令可以查看进程间的父子关系？\n6. 哪个命令可以将 PID 1234 的优先级提高？\n7. 在你的系统上运行着 20 个 `dd` 进程。停止它们最简单的方法是什么？\n\
  8. 哪个命令可以停止名为 `mycommand` 的命令？\n9. 在 `top` 中使用哪个命令来杀死进程？\n10. 选择最符合你系统需求的配置需要什么？\n\
  \n### 章末实验\n\n在章末实验中，你将应用一些重要的进程管理任务。使用你认为方便的工具完成这些实验。\n\n### 实验 10.1\n\n1. 以后台作业的形式启动三次命令\
