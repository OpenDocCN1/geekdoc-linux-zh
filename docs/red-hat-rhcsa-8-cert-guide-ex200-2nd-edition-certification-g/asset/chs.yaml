  #### 更新软件包\n\n使用 `yum` 仓库的主要优势之一是仓库使得更新软件包变得简单。仓库的维护者负责将更新后的软件包复制到仓库中。仓库中的索引始终包含仓库中软件包的当前版本。在本地机器上，也有一个数据库提供了正在使用的软件包的当前版本。当你使用\
  \ `yum update` 命令时，会将已安装软件包的当前版本与仓库中这些软件包的版本进行比较。如示例 9-9 所示，`yum`接下来会显示可更新软件包的概述。从该概述中，输入\
  \ `y` 安装更新。\n\n注意，在更新软件包时，软件包的旧版本会被新版本的软件包所取代。这里有一个例外，即内核软件包。即使你使用 `yum update kernel`\
  \ 命令，内核软件包也不会更新，但新内核将安装在旧内核旁边，这样在启动时你可以选择想要使用的内核。如果新内核由于硬件兼容性问题无法工作，这就会非常有用。在这种情况下，你可以中断\
  \ GRUB 2 启动过程（详见第 17 章“管理和理解启动过程”）以启动旧内核。\n\n\n\n\n\n```\n[root@server1 ~]# yum\
