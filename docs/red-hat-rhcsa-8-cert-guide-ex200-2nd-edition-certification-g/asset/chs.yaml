  \ `yum module enable perl:5.24` 来启用该特定版本。\n\n在开始使用特定模块之前，启用模块流并不是强制的。如果你只是使用 `yum\
  \ module install` 从模块安装软件包，则将安装默认模块流中的软件包。你还可以在应用程序流（application stream）版本之间切换。例如，如果你现在正在使用\
  \ `php:7.1` 并想切换到 `php:7.2`，只需输入 `yum module install php:7.2`。这将禁用旧流并启用新流。执行此操作后，为了确保模块本身未包含的所有依赖包也得到更新，你应该输入\
  \ `yum distro-sync` 来完成该过程。\n\n在练习 9-3 中，你可以练习在 RHEL 8 中操作 Yum 模块。\n\n## 使用 rpm\
  \ 管理软件包\n\n从以前开始，仓库（repositories）并不存在，在下载软件包后使用 `rpm` 命令安装包文件。这种方法行得通，但有一个主要问题：*依赖地狱（dependency\
  \ hell）*。因为 RPM 软件包一直关注特定功能，为了安装特定的软件，通常需要一组 RPM 软件包。因此，用户在尝试安装 RPM 软件包时经常会遇到“缺少依赖项”的错误，这意味着为了安装选定的包，需要先安装其他包。有时需要安装整个链的依赖项才能获得所需的功能。这使得操作\
  \ RPM 软件包变得并不是一种愉快的体验。\n\n在现代的 RHEL 系统上，使用了仓库，并使用 `yum` 安装软件包。`yum` 命令考虑所有的软件包依赖关系，并尝试在当前可用仓库中查找它们。在配置为从\
  \ RHN 获取更新的 RHEL 系统，或在使用一致仓库的 CentOS 系统上，结果是现在的软件包安装没有问题，且不再需要使用 `rpm` 命令进行软件安装。\n\
  \n即使在下载了 RPM 软件包文件，你也不再需要使用 `rpm -Uvh packagename` 命令来安装它（即使它仍然有效）。一个更好的替代方案是 `yum\
  \ install packagename`，它会安装软件包并同时考虑仓库以自动解决依赖关系。（在 RHEL 的早期版本中，使用 `yum localinstall`\
  \ 命令来执行此操作；在 RHEL 8 中，`yum localinstall` 已废弃。）这并不意味着 `rpm` 命令已完全没用处了。你仍然可以使用它来查询\
  \ RPM 软件包。\n\n### 提示\n在你的系统中，维护着两个软件包数据库：YUM 数据库和 RPM 数据库。当你通过 `yum` 安装软件包时，首先更新\
  \ YUM 数据库，然后将更新后的信息同步到 RPM 数据库。如果你使用 `rpm` 命令安装软件包，更新将只会写入 RPM 数据库，而不会更新到 YUM 数据库，这就是不再使用\
  \ `rpm` 命令安装软件软件包的一个重要原因。\n\n### 理解 RPM 文件名\n当你直接操作 RPM 软件包时，理解 RPM 文件名的组成是有意义的。一个典型的\
  \ RPM 文件名类似于 `autofs-5.0.7-40.el7.x86_64.rpm`。这个名字由几个部分组成：\n\n*   `autofs`:实际软件包的名称。\n\
  *   `5.0.7`:软件包的版本。这通常对应于软件包创建者发布时的包名称。\n*   `-40`:软件包的子版本（subversion）。\n*   `el7`:创建此软件包针对的\
  \ Red Hat 版本。\n*   `x86_64`:创建此软件包针对的平台（32 位或 64 位）。\n\n### 查询 RPM 数据库\n`rpm` 命令允许你获取关于软件包的大量信息。使用\
  \ RPM 查询是查找软件如何配置和使用的非常实用的方法。从开始，你可以使用 `rpm -qa` 命令。像 `yum list installed` 一样，该命令显示机器上安装的所有软件列表。在执行命令上使用\
  \ `grep` 来查找特定的软件包名称。对 RPM 软件包执行查询时，只需要名称而不需要版本信息。\n\n找到你想要获取更多信息的软件包后，你可以从一些通用查询开始以查找包的内容。在以下示例中，假设你正在对\
  \ nmap RPM 软件包进行查询。从开始，输入 `rpm -qi nmap` 获取软件包的描述。这将对已安装的软件包执行查询，并查询软件包数据库以获取详细信息。\n\
  \n下一步是使用 `rpm -ql nmap`，它显示包中所有文件的列表。对于某些软件包，结果可能是一个很长的文件名列表，并没有特别用。要获取更特定的信息，使用\
  \ `rpm -qd nmap` 显示软件包可用的所有文档，或使用 `rpm -qc nmap` 显示包中所有的配置文件。\n\n使用 RPM 查询确实可以帮助找到关于软件包更有用的信息。你只需要知道特定文件所属的\
  \ RPM 软件包名称。要找到这一点，请使用 `rpm -qf` 后加上你要查找的具体文件名。例如，使用 `rpm -qf /bin/ls` 来查找 `ls`\
  \ 命令所属 RPM 软件包名称。在接下来的练习 9-4 中，你将看到像这样使用 RPM 查询是有多有用的。\n\n### 查询 RPM 软件包文件\n\n\n\
  \n\nRPM 查询默认在 RPM 数据库上进行，你查询的是已安装的 RPM 软件包。在实际安装 RPM 软件包之前，对其包文件进行查询有时是有意义的。要执行此操作，你需要在查询中添加\
  \ `-p` 选项，因为如果不加 `-p` 选项，你查询的是数据库而不是软件包文件。此外，查询软件包文件时，你需要引用完整的文件名，包括版本号以及在查询 RPM\
  \ 数据库时不需要的其他信息。例如，`rpm -qp --scripts httpd-2.4.6-19.el7.centos.x86_64.rpm` 命令会查询特定的\
  \ RPM 文件以查看其是否包含脚本。\n\n一个需要特别注意的查询选项是 `--scripts`，它查询 RPM 软件包或包文件以查看其包含哪些脚本（如果有的话）。该选项与\
  \ `-p` 选项结合使用时尤为重要，可以帮助你确定要安装的软件包文件是否包含任何脚本。\n\n当你安装 RPM 软件包时，是以 root 身份执行的。在从未知来源安装\
  \ RPM 软件包之前，你需要确保它不包含任何恶意脚本。如果你不这样做，就有可能在不知情的情况下在计算机上安装恶意软件。\n\n表 9-5 描述了最重要的 RPM\
  \ 查询选项。\n\n![](img/key_topic_icon.jpg)\n\n| 命令 | 用途 |\n| --- | --- |\n| `rpm -qf`\
  \ | 使用文件名作为参数查找文件所属的特定 RPM 软件包。 |\n| `rpm -ql` | 使用 RPM 数据库提供 RPM 软件包中的文件列表。 |\n\
  | `rpm -qi` | 使用 RPM 数据库提供软件包信息（等同于 `yum info`）。 |\n| `rpm -qd` | 使用 RPM 数据库显示软件包中所有可用文档。\
  \ |\n| `rpm -qc` | 使用 RPM 数据库显示软件包中所有可用配置文件。 |\n| `rpm -q --scripts` | 使用 RPM 数据库显示软件包中使用的脚本。这与\
  \ `-p` 选项结合使用时特别有用。 |\n| `rpm -qp <pkg>` | `-p` 选项与之前列出的所有选项一起使用，查询单个 RPM 软件包文件而不是\
  \ RPM 软件包数据库。安装前使用此选项有助于你在安装前确定软件包的实际内容。 |\n| `rpm -qR` | 显示特定软件包的依赖关系。 |\n| `rpm\
  \ -V` | 显示特定软件包自安装以来哪些部分发生了更改。 |\n| `rpm -Va` | 验证所有已安装的软件包，并显示软件包自安装以来哪些部分发生了更改。这是软件包完整性检查的一种简单方便的方法。\
  \ |\n| `rpm -qa` | 列出此服务器上安装的所有软件包。 |\n\n**表 9-5** 常用 RPM 查询命令\n\n## 使用 repoquery\n\
  \n虽然 `rpm -qp` 提供了安装前查询软件包的有用工具，但该命令存在一个小问题：它只对 RPM 软件包文件有效，不能直接从存储库查询文件。如果你想在安装之前查询存储库中的软件包，你需要\
  \ `repoquery`。此二进制文件默认没有安装，因此请确保安装了 `yum-utils` RPM 软件包以使用它。\n\n`repoquery` 命令与\
  \ `rpm -q` 命令非常相似，并使用了许多类似的选项。只是缺少了一个重要的选项：`--scripts`。一个简单的解决方案是确保只使用受信任的存储库，以防止安装包含危险脚本代码的软件。\n\
  \n如果你需要彻底分析 RPM 软件包在安装时的操作，可以将其下载到你的机器上，这将允许你对软件包使用 `rpm -qp --scripts` 命令。要将软件包从存储库下载到本地目录，可以使用来自\
  \ `yum-utils` 软件包的 `yumdownloader` 命令。\n\n现在你已经学习了所有的 RPM 查询选项，你可以在练习 9-4 中练习这些新学的技能，以获取更多关于你\
  \ RHEL 系统上安装软件的信息。\n\n提示：处理 RPM 查询是 RHCSA 考试中某项非常有价值的技能。如果你知道如何处理查询，就能找到所有的配置文件和文档。\n\
  \n### 总结\n\n在本章中，你学习了如何在 Red Hat Enterprise Linux 上操作软件。你学习了如何使用 `yum` 管理来自存储库的软件包。你还学习了如何使用\
  \ `rpm` 命令对系统上的软件包进行查询。确保你熟练掌握了这些核心技能；它们是在 Red Hat Enterprise Linux 上完成工作的关键。\n\n\
