  \n要从机器上删除软件包，请使用 `yum remove` 命令。该命令也会进行依赖分析，这意味着它不仅会删除选定的软件包，还会删除所有依赖于它的软件包。这有时会导致一个很长的待删除软件包列表。为了避免不必要的意外，你不应该在使用\
  \ `yum remove` 时配合 `-y` 选项。\n\n### 注意\n某些软件包受保护的。因此，你无法轻易删除它们。如果 `yum remove` 遇到受保护的软件包，它将拒绝删除它们。\n\
  \n#### 显示软件包列表\n\n在使用 `yum` 时，你也可以使用 `yum list` 命令来显示软件包列表。在不带参数使用时，`yum list` 会显示所有可用软件包的列表，包括它们安装自哪个仓库。你可以看到表\
  \ 9-2 中列出的仓库名称以及 `@anaconda` 仓库。如果显示了仓库名称，则该软件包在该特定仓库中可用。如果列出了 `@anaconda`，则该软件包已安装在该系统上。示例\
  \ 9-7 显示了 `yum list` 命令的部分输出。\n\n### 示例 9-7 `yum list` 命令的部分输出\n\n点击此处查看代码图像\n\n\
