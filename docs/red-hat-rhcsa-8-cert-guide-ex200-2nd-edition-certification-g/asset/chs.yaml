  \ yes`\n4. `Xclient yes`\n\n**10.** 关于基于密钥的 SSH 身份验证，以下叙述哪项是正确的？\n\n1. 创建密钥对后，你需要将私钥拷贝到远程服务器。\n\
  2. 使用 `scp` 将公钥拷贝到远程服务器。\n3. 使用 `ssh-copy-id` 将公钥拷贝到远程服务器。\n4. 在服务器上使用 `ssh-keygen`\
  \ 生成一个与客户端密钥匹配的密钥对。\n\n### 基础主题\n\n## 在本地控制台上操作\n\n你已经学习了如何通过图形化控制台登录 Linux。在本节中，你将学习关于在图形化\
  \ Linux 控制台或基于文本的 Linux 控制台上工作时所拥有的可能性。\n\n![](img/key_topic_icon.jpg)\n\n进入细节之前，强调\
  \ *console*（控制台）和 *terminal*（终端）这两个词的区别是有意义的。在本书中，我遵循常见的观点，将控制台视为用户所观察的环境。这意味着控制台基本上就是当你看着电脑屏幕时看到的内容。\n\
  \n终端是在控制台上打开的一个环境，它提供对文本 shell 的访问，shell 是一个用于输入命令的命令行环境。在运行图形化控制台时，可以通过窗口提供终端，但它也可以作为文本控制台中你唯一看到的内容被打开。这意味着在文本环境中，*console*\
  \ 和 *terminal* 这两个词在很大程度上是对等的。而在图形化环境中，它们并不是。可以这样想：你可以在一个控制台上打开多个终端，但你不能在一个终端中打开多个控制台。\n\
  \n### 登录本地控制台\n\n大致来说，有两种方法让 Linux 服务器识别你的身份。有时你只需要坐在 Linux 控制台上，从显示的登录提示处交互式登录。在其他情况下，会建立远程连接。本章的第二部分关于从远程会话登录；而在这一部分，你将学习如何在本地控制台上工作。\n\
  \n如果 Linux 服务器带有图形化环境启动（所谓的图形化目标），你会看到一个登录提示，上面可以输入用户名和一个输入密码的字段。不过，许多 Linux 服务器完全不使用图形化环境，而仅显示基于文本的控制台，如图\
  \ 5-1 所示。\n\n![截图显示了 Linux 服务器文本控制台上显示的登录提示符。控制台已好接收“server1 login:”的输入](img/05fig01.jpg)\n\
  \n**图 5-1** 从文本控制台登录\n\n要从文本控制台登录，你需要知道应该使用哪个用户账户。`root` 用户始终可用，但使用该账户执行你的工作通常不是一个好主意；`root`\
  \ 用户访问系统没有任何限制，因此可能会造成巨大破坏。一个小错误就可能产生巨大影响。通常，以本地定义的用户之一登录是更好的主意，这样做有很多原因，包括：\n\n\
  * 以这种方式登录将让你更难犯致命错误。\n* 在很多情况下，你根本不需要 root 权限。\n* 如果你只允许普通用户访问而不允许 root 访问，这将迫你更加小心。\n\
  * 如果你确实需要 root 权限，可以使用 `su -` 命令打开 root shell。\n* 使用 `sudo` 配置特定任务。\n\n### 在图形化环境中切换终端\n\
  \n当你在图形化环境中工作时，可以很容易打开多个环境，例如终端窗口。在图形界面的左上方点击“活动”（Activities），在出现的搜索栏中输入 `term`，这将呈现一个打开终端的图标。由于终端是作为子\
  \ shell 打开的，你不需要再次登录每个终端，并将获得与最初登录图形化环境相同的用户账户（见图 5-2）。\n\n![截图显示了图形化环境中的登录界面。左上角的活动标签被选中。窗口由一个搜索栏组成。在这里输入了单词“term”。搜索栏下方显示了一个终端的图标](img/05fig02.jpg)\n\
  \n**图 5-2** 从图形化环境使用不同的终端\n\n在图形化环境中工作非常方便。作为管理员，你可以打开多个终端窗口，并在每个终端窗口中使用 `su -`\
  \ 命令打开一个可以以不同用户身份工作的 shell。这允许你轻松测试功能并立即看到测试结果。\n\n### 在非图形化环境中处理多个终端\n\n在上一节中，你学习了如何在图形化环境中处理多个终端。这相对比较简单，因为你只需要打开一个新的终端窗口。在非图形化环境中，你只有一个可用的终端界面，这使得在不同的用户\
  \ shell 环境中工作变得有些困难。\n\n\n\n\n\n为了提供可以在同一服务器上从多个控制台工作的选项，Linux 使用了*虚拟终端*(virtual\
  \ terminal）的概念。此功能允许你同时从同一个控制台打开六个不同的终端窗口，并使用键序列在它们之间切换。要打开这些终端窗口，你可以使用 `Alt-F1`\
  \ 到 `Alt-F6` 键序列。可用的虚拟终端包括：\n\n*   `F1`：访问 GNOME 显示管理器 (GDM) 图形登录\n*   `F2`：访问当前的图形控制台\n\
  *   `F3`：返回当前的图形会话\n*   `F4–F6`：访问非图形控制台\n\n### 提示\n`chvt` 命令提供了比使用 `Alt`-Function\
  \ 键序列更方便的替代方案。该命令允许你直接从当前环境切换到不同的虚拟环境。如果你现在处于图形控制台，请打开终端并输入 `chvt 4`。这会带你进入虚拟终端\
  \ 3 的登录提示符。使用 `chvt 3` 命令切回图形环境，或使用 `chvt 1` 切回图形登录提示符。\n\n在这些虚拟控制台中，第一个被用默认控制台。它通常被称为*虚拟控制台\
  \ tty1*(virtual console tty1)，在 `/dev` 目录中有一个对应的设备文件，名为 `/dev/tty1`。其他虚拟控制台也有相应的设备文件，编号为\
  \ `/dev/tty1` 到 `/dev/tty6`。\n\n当你在图形环境中工作时，也可以打开不同的虚拟控制台。由于 `Alt` 键与功能键的组合在图形环境中通常已经具有含义，因此你需要使用\
  \ `Ctrl-Alt-Function` 键。所以，不要在图形环境下使用 `Alt-F4` 来打开 `/dev/tty4`，而应使用 `Ctrl-Alt-F4`。要返回图形控制台，你可以使用\
  \ `Alt-F3` 键序列。`Alt-F6` 和 `Ctrl-Alt-F6` 键序列本质上是相同的。从 GUI 切换到文本环境时，使用 `Ctrl` 键是非常关重要的。从文本环境返回\
  \ GUI 环境时，使用 `Ctrl` 键是可选的。\n\n### 注意\n在很久以前，人们使用大型中央计算机，并连接了许多哑终端（dumb terminal）设备。这些哑终端设备仅由显示器和键盘组成。从每一个这样的哑终端设备中，都可以启动到操作系统的控制台会话。在现代\
  \ Linux 服务器上，没有连接哑终端。它们已被上一节中描述的虚拟终端所取代。\n\n#### 理解伪终端设备\nLinux 环境中使用的每个终端都有一个关联的设备文件。你刚刚了解到，在非图形环境下启动的终端通常通过设备\
  \ `/dev/tty1` 到 `/dev/tty6` 进行引用。\n\n对于从图形环境启动的终端窗口，会启动伪终端（pseudo terminals）。这些伪终端使用\
  \ `/dev/pts` 目录中的数字进行引用。因此，从图形环境启动的第一个终端窗口显示为 `/dev/pts/1`，第二个窗口显示为 `/dev/pts/2`，依此类推。在练习\
  \ 5-2 中，你将学习如何处理这些伪终端设备，并查看哪个用户在哪个伪终端上活跃。\n\n### 注意\n在早期的 Linux 版本中，伪终端被视为 `pty`\
  \ 设备。这些类型的终端现在已被废弃，并被如前所述的 `pts` 终端类型取代。\n\n此时，你已经学会了如何操作控制台、终端、虚拟终端和伪终端。在本章稍后的“使用\
  \ SSH 和相关工具”部分中，你将使用 SSH 为你的服务器打开终端会话。这些会话也会显示为伪终端。\n\n#### 系统的启动、重启和关机\n作为 Linux\
  \ 服务器的管理员，你有时必须重启 Linux 服务器。重启服务器并不是经常性需求，但它可以让你的工作变得简单得多，因为它会确保运行在服务器上的所有进程和任务都重新读取了它们的配置并已正确初始化。\n\
  \n### 提示\n重启 Linux 服务器是 RHCSA 考试中的一项重要任务。在服务器重启后，你配置的所有内容都应该仍然正常工作。因此，确保你在考试期间至少重启一次，并在对服务器配置进行关键修改后也重启。如果对对服务器配置进行关键修改后你的服务器无法重启，至少你知道该去哪里寻找修复问题。\n\
  \n对于真正非常熟悉 Linux 的管理员来说，重启服务器很少是必要的。经验丰富的管理员通常可以触发正确的参数来强制进程重新读取其配置。尽管如此，在某些情况下，即使是经验丰富的\
  \ Linux 管理员也必须重启：\n\n*   从服务器挂起和内核恐慌（kernel panic）等严重问题中恢复\n*   应用内核更新\n*   对当前正在且因此无法重新加载的内核模块应用更改\n\
  \n当服务器重启时，所有正在运行的进程都需要正常关闭。如果服务器只是通过拔掉电源插头来停止，通常会丢失大量数据。原因是，写入数据的进程通常不会直接将这些数据写入磁盘，而是将其存储在内存缓冲区（缓存）中，当操作系统认为方便时再提交到磁盘。\n\
  \n要执行适当的重启，你必须通知 `Systemd` 进程。`Systemd` 进程是服务器启动时启动的进程，它负责直接或间接地管理所有其他进程。因此，在系统重启或停机时，`Systemd`\
  \ 进程需要确保所有进程都停止。为了让这一点发生，你可以使用命令：\n\n*   `systemctl reboot` 或 `reboot`\n*   `systemctl\
  \ halt` 或 `halt`\n*   `systemctl poweroff` 或 `poweroff`\n\n在停止机器时，你可以使用 `systemctl\
  \ halt` 命令或 `systemctl poweroff` 命令。这两个命令之间的区别是，`systemctl poweroff` 命令与机器的电源管理进行通信以关闭机器电源。这在\
  \ `systemctl halt` 时通常不会发生。\n\n### 注意\n使用上述描述的方法通常会重启或停止你的机器。在某些情况下，这些命令可能无效。如果是这样，还有一种紧急重置选项。如果机器无法物理访问，使用该选项可能非常有用。为了强制机器重置，作为\
  \ root 用户你可以输入：\n```\necho b > /proc/sysrq-trigger\n```\n此命令会立即重置机器而不保存任何内容。\n\n\
  #### 使用 SSH 远程系统\n\n在现代 Linux 发行版中，Secure Shell 是通过网络访问其他机器的常用方法。在 SSH 中，使用了加密技术来确保你连接到预期的服务器。此外，流量在传输过程中是加密的。\n\
  \n\n\n\n\n要使用 SSH 访问服务器，您需要两个组件。在要访问的远程服务器上，`sshd` 服务必须正在运行并在 22 端口提供服务，且该端口不应被防火墙拦截。安装后，红帽企业版\
  \ Linux 会自动启动 `sshd` 进程，并且默认情况下，它不会被防火墙拦截。\n\n如果 SSH 端口是打开的，您可以使用从命令行执行 `ssh` 命令来访问它。`ssh`\
  \ 命令默认尝试连接到服务器上 22 端口的 `sshd` 进程。如果您配置了 `sshd` 进程在不同的端口提供服务，请使用 `ssh -p` 后紧跟您想要连接的端口号。\n\
  \n`ssh` 命令在所有 Linux 发行版中都可用，Apple Mac 计算机上也可以，您可以在 Mac 终端中启动它。\n\n如果您使用的是没有 Windows\
  \ Linux 子系统（WSL）的 Windows 版本，则 `ssh` 命令并不是 Windows 操作系统的原生部分。如果您想从 Windows 计算机通过\
  \ SSH 访问 Linux 服务器，您需要在 Windows 上安装像 PuTTY 这样的 SSH 客户端。通过 PuTTY，可以与 Linux 机器建立不同类型的远程会话。Windows\
  \ 上还有其他 SSH 客户端，例如 MobaXterm、KiTTY、mRemoteNG、Bitvise 和 Xshell。\n\n从 Linux 终端访问另一台\
  \ Linux 机器相对简单。只需输入 `ssh` 后跟另一台 Linux 机器的名称。连接后，如果使用默认配置，将提示您输入密码。这是与您当前用户名同名的账户的密码，但该账户需要在远程机器上存在。\n\
  \n当远程连接到 Linux 服务器时，SSH 客户端尝试以您在本地机器上当前登录的用户账户身份进行。如果您想使用不同的用户账户进行连接，可以在命令行中使用 `user@server`\
  \ 格式指定该用户的名称。例如，如果您想以用户 root 的身份到远程服务器建立 SSH 会话，请输入 `ssh root@remoteserver`。指定用户账户的另一种方法是使用\
  \ `-l username` 选项。因此，`ssh remoteserver -l root` 也会尝试到远程服务器建立一个 root 会话。在练习 5-3\
  \ 中，您将学习如何使用 SSH 登录远程服务器。\n\n**示例 5-1** 首次登录远程服务器时显示的安全性消息\n\n点击此处查看代码图像\n\n```\n\
  [root@server1 ~]# ssh 192.168.4.220 -l root\nThe authenticity of host '192.168.4.220\
  \ (<no hostip for proxy\ncommand>)' can't be established.\nECDSA key fingerprint\
  \ is 35:64:36:f8:ac:4f:8a:94:aa:6e:4b:85:ed:76:0a:eb.\nAre you sure you want to\
  \ continue connecting (yes/no)?\n```\n\n### 注意\n\n在某些情况下，使用 `ssh` 访问服务器可能会很慢。如果您想知道为什么，请配合\
  \ `ssh` 命令使用 `-v` 选项。这将以详详细模式启动 SSH，并显示所有连接到的各个组件。通过这样做，您可能会发现服务器运行缓慢的指示。\n\n示例\
  \ 5-1 中的安全消息显示是因为之前从未连接过远程服务器，因此没有方法验证远程服务器的身份。当您连接到远程服务器时，就会显示此消息。\n\n\n\n\n\n\
  `sftp` 命令提供了一种安全传输文件的替代方案。`scp` 命令提供的界面与 `cp` 命令非常相似，而 `sftp` 命令提供了一个类似于 FTP 的界面。由于即使是现代\
  \ FTP 服务器在传输密码和其他敏感数据时，仍会在不使用加密的情况下进行传输，因此 `sftp` 应该被视为一种替代方案。\n\n在使用 `sftp` 时，你会向远程服务器打开一个\
  \ FTP 客户端会话，远程服务器的唯一要求是它必须运行 `sshd` 进程。在 FTP 客户端会话中，你可以使用典型的 FTP 客户端选项，例如使用 `put`\
  \ 上传文件或 `get` 下载文件。\n\n注意，在操作 `sftp` 时，本地目录非常重要，即使在打开 FTP 会话后你只能看到服务器上的远程目录。当你使用\
  \ `get` 命令下载文件时，文件将存储在当前本地目录中；而当你使用 `put` 上传文件时，系统将在本地目录中搜索该文件。练习 5-4 将引导你学习使用 `sftp`\
  \ 命令以及接下来将讨论的 `rsync` 命令。\n\n### 使用 rsync 同步文件\n\n`rsync` 命令使用 SSH 在远程目录和本地目录之间同步文件。同步文件的优势在于只需要考虑差异部分。例如，如果你同步一个\
  \ 100-MiB 的文件，自上次同步以来只有几个区块发生了更改，那么只有更改的区块会被同步。这种方法也被增量同步（delta sync）。\n\n当你使用 `rsync`\
  \ 命令时，有多个选项可用。表 5-3 提供了概述。\n\n| 选项 | 用途 |\n| --- | --- |\n| `-r` | 同步整个目录树 |\n|\
  \ `-l` | 同时同步符号链接 |\n| `-p` | 保留符号链接 |\n| `-n` | 仅运行，不实际同步任何内容 |\n| `-a` | 使用归档模式，确保整个子目录树和所有文件属性都将同步\
  \ |\n| `-A` | 使用归档模式，并额外同步 ACL |\n| `-X` | 同时同步 SELinux 上文 |\n\n**表 5-3** 常用 `rsync`\
  \ 选项\n\n#### 为 SSH 配置基于密钥的身份验证\n\n如果在互联网上使用 SSH，允许密码登录可能不是一个好主意。为了让 SSH 更安全，它始终会尝试是否可以使用公钥/私钥进行登录。只有在不可行的情况下，才会使用密码登录。要启用基于密钥的登录，你需要做的就是创建一个密钥对；其他所有内容已经默认组织好了。\n\
  \n在使用基于公钥/私钥的身份验证时，想要连接到服务器的用户生成一对公私钥。私钥需要保持私密，且永远不会分发。公钥存储在 SSH 服务器上目标用户的家目录下的\
  \ `.ssh/authorized_keys` 文件中。\n\n在使用密钥对进行身份验证时，用户生成一个派自私钥的哈希值。该哈希值被发送到服务器，如果服务器上证明它与存储的公钥匹配，则用户通过身份验证。\n\
  \n#### 使用短语还是不？\n\n在创建公钥/私钥对时，系统会提示你输入短语。如果你想要获得最大的安全性，应该输入短语。每当你使用私钥对远程主机进行身份验证时，系统都会提示输入该短语。这非常安全，但不怎么方便。为了创建一个允许最大便利性的配置，你可以只需按两次回车键来确认你不想设置短语。这是在受信任环境中服务器之间身份验证的典型配置，在这种环境中根本无法外部访问。\n\
  \n要创建密钥对，请使用 `ssh-keygen` 命令。接下来使用 `ssh-copy-id` 命令将公钥复制到目标服务器。在练习 5-5](#ch05.xhtml_ch05exe5)\
  \ 中，你将创建一个公钥/私钥对以登录 `server2` 主机。（如果没有可用远程主机，可以使用 `localhost` 作为替代方案来验证此过程。）\n\n\
  将公钥复制到远程主机后，它将被写入该主机上的 `~/.ssh/authorized_keys` 文件。注意，如果多个用户使用密钥登录该特定账户，`authorized_keys`\
  \ 文件可能包含许多公钥。请确保永远不要覆盖它，因为这将擦掉其他用户使用的所有密钥！\n\n#### 使用 screen 命令\n\n你不需要为了 RHCSA\
  \ 考试了解 `screen` 命令，但你在工作中应该了解它，因为它允许你即使在没有图形会话的情况下也能打开多个终端会话。它还允许与其他用户共享会话，并连接到和分离远程终端会话。在使用\
  \ `screen` 之前，你需要安装它。执行此操作，首先使用 `yum install -y epel-release` 添加 epel 仓库。接着，输入 `yum\
  \ install -y screen`。然后输入 `screen` 打开一个 screen 会话。在 screen 会话中，你可以启动任何喜欢的命令。\n\n\
  `screen` 命令在从 SSH 会话中使用时特别有用。你可以从 screen 会话启动一个耗时很长的任务，分离它并在稍后重新连接。该命令会继续运行。要使用\
  \ `screen`，遵循此步骤：\n\n1. 打开 SSH 会话。\n2. 从 SSH 会话中输入 `screen` 打开一个 screen 会话。\n3.\
  \ 在 screen 会话中启动你想要运行的任务。\n4. 使用序列 `Ctrl+A, D` 分离 screen 会话。并在你准备好返回时，启动 SSH 会话。\n\
  5. 使用 `screen -r` 连接到 screen 会话。\n\n在使用 `screen` 时，你是在运行一个特定的应用程序。在程序内部你可以执行命令。要使用这些\
  \ screen 命令，先按 `Ctrl+A` 然后输入 `?`。这将显示所有命令。要记住的一个重要命令是 `Ctrl+A, /`，这将关闭 screen 会话。确保移除你需要的\
  \ screen 会话；否则它们将在下次重启服务器之前一直运行！\n\n如果你在尝试连接到 screen 会话时收到有多个 screen 会话的消息，你需要更具体一些。要查看正在运行的\
  \ screen 会话，使用 `screen -ls` 命令。在示例 5-2](#ch05.xhtml_ch05ex02)中，你可以看到如何使用 `screen`\
  \ 命令显示分离状态的 screen 会话，以及 `screen -r` 命令提供的可用 screen 会话列表，你可以通过将 screen 会话编号添加到 `screen\
  \ -r` 命令来选择你想连接的会话。\n\n**示例 5-2** 选择正确的 `screen` 会话\n\n点击此处查看代码图像\n\n```\n[sander@lab\
  \ ~]$ screen\n[detached from 30500.pts-0.lab]\n[sander@lab ~]$ screen\n[detached\
  \ from 30532.pts-0.lab]\n[sander@lab ~]$ screen -r\nThere are several suitable screens\
  \ on:\n          30532.pts-0.lab (Detached)\n          30500.pts-0.lab (Detached)\n\
  Type \"screen [-d] -r [pid.]tty.host\" to resume one of them.\n[sander@lab ~]$ screen\
  \ -r 30500\n```\n\n\n\n\n\n你还可以使用 `screen` 与同一会话中的其他用户协作。要实现这一点，请遵循以下步骤：\n\n1. \
