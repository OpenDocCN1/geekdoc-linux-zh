  \ 并退出。\n\n# 第四部分\n\n管理网络服务\n\n## 第 20 章\n\n配置 SSH\n\n本章涵盖了以下主题：\n\n* 加固 SSH 服务器\n\
  * 使用其他常用的 sshd 选项\n* 配置带密码保护的密钥认证\n\n本章涵盖了以下 RHCSA 考试目标：\n\n* 配置 SSH 的密钥认证\n\nSecure\
  \ Shell (SSH) 是系统管理员使用的最重要的工具之一。在第 5 章 中，你学习了如何使用 SSH。本章涵盖了以下 RHCSA 考试目标：\n\n* 配置\
  \ SSH 的密钥认证\n\n\n\n\n1. 将密码语复制到 `~/.ssh/passphrase` 文件。\n2. 运行 `ssh-add /bin/bash`\
  \ 然后运行 `ssh-agent`。\n3. 运行 `ssh-agent /bin/bash` 然后运行 `ssh-add`。\n4. 这是可能的；你必须每次创建连接时都必须输入密码语。\n\
  \n## 10. MaxSessions 选项可以调整同时打开的最大会话数。它的默认值是多少？\n\n1. 10\n2. 25\n3. 100\n4. 1000\n\
  \n### 基础主题\n\n### SSH 服务器强化\n\nSSH 是一种重要且方便的解决方案，帮助你建立到服务器的远程连接。它也是一种危险的解决方案。如果你的\
  \ SSH 服务器可以直接从互联网可见，你可以确定，早晚会有入侵者尝试连接到你的服务器，并意图造成破坏。\n\n针对 SSH 服务器的字典攻击非常常见。攻击者利用\
  \ SSH 服务器通常在端口 22 上提供服务以及每台 Linux 服务器都有一个 root 账户的特性。基于这些信息，攻击者只需通过猜测密码就能尝试以 root\
  \ 身份登录。如果密码的复杂性有限，且没有采取额外的安全措施，早晚入侵者就能连接上。幸运的是，你可以采取一些措施来保护 SSH 服务器免受此类攻击：\n\n*\
  \ 禁用 root 登录\n* 禁用密码登录\n* 为 SSH 配置非默认端口进行监听\n* 仅允许特定用户登录 SSH\n\n在接下来的章节中，你将学习更改这些选项所涉及的内容。\n\
  \n### 限制 root 访问\n\nSSH 服务器默认启用 root 登录是最大的安全问题。禁用 root 登录很容易；你只需要修改 `/etc/ssh/sshd_config`\
  \ 中的 `PermitRootLogin` 参数并重新加载或重启服务即可。重启后，验证你是否确实无法再次以 root 身份登录。\n\n**提示**\n\n\
  某些服务会自动获取其配置文件的更改。大多数服务在执行 `systemctl reload servicename` 命令后获取更改，而其他服务仅在执行 `systemctl\
  \ restart servicename` 命令后才会获取更改。为了避免在考试中浪费时间，你应该在所有情况下都使用 `systemctl restart servicename`。至少你可以确保服务将加载其新配置。\n\
  \n在禁用 root 登录后，你必须使用 `ssh user@servername` 或 `ssh -l user servername` 指定你想要用于登录的用户名。如果你不指定用户名，它将使用尝试打开\
  \ SSH 会话的客户端上的当前用户名。\n\n### 配置替代端口\n\nLinux 服务器上的许多安全问题都始于攻击者发起的端口扫描。扫描所有 65,535\
  \ 个可能监听的端口需要大量时间，但大多数端口扫描只关注已知端口，而 SSH 端口 22 始终位于这些之中。不要低估端口扫描的风险。\n\n为了防止端口扫描，你可以配置你的\
  \ SSH 服务器监听另一个端口。默认情况下，`sshd_config` 包含 `Port 22` 一行，告诉 SSH 监听特权端口 22。要让 SSH 监听另一个端口，你必须将端口\
  \ 22 更改为其他。可以使用不同的端口。你可以选择使用像 2022 这样完全随机的端口，但将 SSH 配置为监听端口 443 也很方便。\n\n端口 443\
  \ 默认分配给使用传输层安全协议 (TLS) 提供加密的 Web 服务器。如果想要访问 SSH 服务器的用户通常位于只允许流量通过 80 和 443 端口的代理之后，那么配置\
  \ SSH 监听端口 443 可能是有意义的。但你应该意识到，这样做之后端口 443 将无法再被你的 Web 服务器使用；一个端口一次只能分配给一个服务！所以只在你不计划运行启用\
  \ TLS 的 Web 服务器的机器上这样做！\n\n**提示**\n\n为了避免在远程连接时更改 SSH 监听端口后被锁在服务器之外，打开两个 SSH 服务器会话是一个好主意。使用一个会话应用更改并测试，使用另一个会话保持当前的连接选项。重启\
  \ SSH 服务器后，活动会话不会断开（除非你未能成功重启 SSH 服务器）。\n\n### 修改 SELinux 以允许端口更改更改更改 端口后，你还需要配置\
  \ SELinux 以允许此更改。网络端口带有 SELinux 安全标签，以防止服务访问它们不应该访问的端口。要允许服务连接到非默认端口，你需要使用 `semanage\
  \ port` 来更改目标端口的标签。在这样做之前，最好检查该端口是否已经标记。你可以通过使用 `semanage port -l` 命令来实现此。\n\n如果端口尚未设置安全标签，请使用\
  \ `-a` 为端口添加标签。如果已设置安全标签，请使用 `-m` 修改当前的安全标签。例如，使用命令 `semanage port -a -t ssh_port_t\
  \ -p tcp 2022` 为端口 2022 标记以便 sshd 访问。如果你想重新标记一个已被其他服务使用的端口，你必须使用 `semanage port\
  \ -m` 修改当前的端口分配。例如，当你想让 SSH 能够绑定到端口 443 时就需要这样做。\n\n### 限制用户访问\n\n你可以通过浏览 `sshd_config`\
  \ 文件找到许多 sshd 选项。最有趣的选项之一是 `AllowUsers`。该选项接受一个由空格分隔的列表，包含所有允许通过 SSH 的用户。注意这是一个强大的选项，将登录限制在这些用户中。如果\
  \ root 用户仍需要直接登录，你必须将 root 也包含在列表中。\n\n当你使用此参数时，考虑你想要允许或拒绝访问的用户名是有意义的。在脚本化的破解攻击中，入侵者通常还会尝试\
  \ admin、Administrator 和 jsmith 等常用用户名。通过选择不常用的用户名可以轻松增加一层安全。关于 `AllowUsers` 参数，请注意以下几点：\n\
  \n* 默认情况下，`AllowUsers` 选项没有出现在 `/etc/ssh/sshd_config` 文件中。\n* `AllowUsers` 选项是 `PermitRootLogin`\
  \ 更好的选项，因为它比拒绝 root 登录更具限制性。\n* 如果 `AllowUsers` 选项没有指定 root，你可以在作为普通用户建立连接后通过 `su\
  \ -` 变成 root。\n\n一个看起来很有前景但具有误导性的参数是 `MaxAuthTries`。你可能认为此选项在达到最大失败登录尝试数后锁定 SSH\
  \ 登录提示。这种功能在连接到本地服务器时（如果需要，可以轻松更改配置）非常有用，但在具有互联网访问的 SSH 服务器上，它是一个相当危险的选项，使其易于对服务器实施拒绝服务攻击。入侵者只需运行一个尝试作为特定用户登录的脚本即可阻止该用户访问一段时间。这就是为什么\
  \ `MaxAuthTries` 并没有像你可能认为的那样工作。它只是在指定的成功登录尝试数的一半之后开始记录失败登录尝试。\n\n\n\n\n\n尽管如此，`MaxAuthTries`\
  \ 选项仍然很有用。对于分析与你的 SSH 服务器相关的安全事件，了解用户不小心输错一或两次密码并不有趣。只有在出现多次失败尝试后，情况才会变得有趣。尝试次数越高，入侵者试图进入的可能性就越大。SSH\
  \ 将有关登录失败尝试的日志信息写入 `AUTHPRIV` syslog 设施。默认情况下，该设施被配置为将登录失败信息写入 `/var/log/secure`。\n\
  \n在练习 20-1 中，你将应用目前讨论过的常用 SSH 选项。\n\n## 使用其他实用的 sshd 选项\n\n除了安全相关的选项外，还有一些实用的杂项选项，你可以用来优化\
  \ SSH 性能。在接下来的两个节中，你将介绍其中一些最重要的选项。\n\n### 会话选项\n\n首先是 `GSSAPIAuthentication` 选项，在\
  \ RHEL 8 上它默认被设置为 `yes`（这与 man 页面上的描述相反）。该选项在使用了 Kerberos 认证的环境中很有用。如果你的环境中没有 Kerberos，你最好将其关闭，因为开启此功能会减慢认证过程。\n\
  \n下一个有趣的选项是 `UseDNS`。该选项默认开启，并指示 SSH 服务器查找远程主机名，并通过 DNS 检查远程主机解析出的主机名是否映射回相同的 IP\
  \ 地址。虽然该选项在安全方面具有一些优势，但它也会带来显著的性能损失。如果客户端连接很慢，请确保将其设置为 `no`，以完全关闭客户端主机名验证。\n\n第三个会话相关的选项是\
  \ `MaxSessions`。该选项指定了从一个 IP 地址同时打开的最大会话数。如果你预计多个用户使用同一个 IP 地址登录到你的 SSH 服务器，你可能需要将此选项增加到默认值\
  \ `10` 以上。\n\n### 连接保活选项\n\n总的来说，TCP 连接是一种相对稀缺的资源，这就是为什么一段时间未使用的连接通常会超时。你可以使用几个选项让不活跃的连接保持更长时间。\n\
  \n`TCPKeepAlive` 选项用于监控客户端是否仍然可用。使用此选项（默认开启）可以确保对于任何一段时间内未活跃的机器，连接都会被释放。然而，如果单独使用它，可能会导致未使用的连接也被释放，这就是为什么使用\
  \ `ClientAliveInterval` 选项很有意义的原因。该选项设置了一个间隔（以秒为单位），如果没有检测到活动，服务器将向客户端发送数据包。`ClientAliveCountMax`\
  \ 参数指定了应该发送多少此类包。例如，如果 `ClientAliveInterval` 设置为 `30`，且 `ClientAliveCountMax` 设置为\
  \ `10`，则不活跃的连接将保持大约五分钟。将此设置为你希望保持不活跃连接开启的时间是一个好主意。\n\n`ClientAliveInterval` 和 `ClientAliveCountMax`\
  \ 选项只能在服务器上指定。这些选项也有对应的客户端等选项。如果你无法更改 SSH 服务器的配置，请使用 `ServerAliveInterval` 和 `ServerAliveCountMax`\
  \ 选项从客户端机器发起连接保活流量。如果这些选项需要适用于该机器上的所有用户，则设置在 `/etc/ssh/ssh_config` 文件中；如果适用于单个用户，则设置在\
  \ `~/.ssh/config` 中。\n\n表 20-2 提供了最实用 SSH 选项的概述。\n\n![](img/key_topic_icon.jpg)\n\
  \n| 选项 | 用途 |\n| --- | --- |\n| Port | 定义 TCP 监听端口。 |\n| PermitRootLogin | 指明允许或不允许\
  \ root 登录。 |\n| MaxAuthTries | 指定认证尝试的最大次数。达到该数字的一半后，失败信息将写入 syslog。 |\n| MaxSessions\
  \ | 指明从一个 IP 地址可以打开的最大会话数。 |\n| AllowUsers | 指定允许连接到服务器的用户列表，用户之间用空格分隔。 |\n| PasswordAuthentication\
  \ | 指定是否允许密码认证。该选项默认开启。 |\n| GSSAPIAuthentication | 指明是否需要通过 GSSAPI 进行认证。用于基于 Kerberos\
  \ 的认证。 |\n| TCPKeepAlive | 指定是否清理不活跃的 TCP 连接。 |\n| ClientAliveInterval | 指定向客户端发送数据包的间隔（以秒为单位），以判断客户端是否仍然活跃。\
  \ |\n| ClientAliveCountMax | 指定需要发送的客户端存活包数量。 |\n| UseDNS | 如果开启，则使用 DNS 名称查找将传入的\
  \ IP 地址与名称匹配。 |\n| ServerAliveInterval | 指定客户端向服务器发送数据包以保持连接活跃的间隔（以秒为单位）。 |\n| ServerAliveCountMax\
  \ | 指定客户端向服务器发送以保持连接活跃的包的最大数量。 |\n\n**表 20-2** 最实用的 sshd 配置选项\n\n## 使用短语配置基于密钥的认证\n\
  \n默认情况下，RHEL 8 SSH 服务器允许密码认证。如果使用了公/私钥对（如第 5 章 所示），则会优先使用该密钥对。如果你只想允许基于公/私钥的认证并完全禁用密码认证，请将\
  \ `PasswordAuthentication` 选项设置为 `no`。\n\n当使用公/私钥时，可以使用短语（passphrase）。使用短语会让密钥对更强大。入侵者不仅必须获取私钥，而且当他获取时还必须知道短语。这就是为什么在使用公/私钥建立客户端/服务器连接时，建议使用短语。如果没有进一步配置，使用短语意味着用户每次创建连接时都必须输入短语，这将是不方便的。\n\
  \n为了让使用短语变得不那么复杂，你可以为会话缓存短语。为了做到，你需要 `ssh-agent` 和 `ssh-add` 命令。假设公/私钥已经创建，这是一个简单的三步过程：\n\
  \n**步骤 1.** 输入 `ssh-agent /bash` 来启动当前 (Bash) shell 的代理程序。\n\n**步骤 2.** 输入 `ssh-add`\
  \ 为当前用户的私钥添加短语。现在密钥已缓存。\n\n**步骤 3.** 连接到远程服务器。注意，不再需要输入短语了。\n\n此过程需要对所有创建的新会话重复执行。\n\
  \n### 总结\n\n在本章中，你学习了如何使用高级选项配置 SSH 服务器。你还学习了如何设置 sshd 安全选项，以及如何设置有助于长时间连接的特定客户端选项。\n\
