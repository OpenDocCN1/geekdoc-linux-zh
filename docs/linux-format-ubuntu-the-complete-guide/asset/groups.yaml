    ## Terminal: How to get started


    Flex fingers and dive head into the inky darkness of the terminal. Let us show
    you how to start mastering your commands.


    The terminal is an incredibly important part of your Linux desktop. It doesn''t
    matter how you were to point and click over the command line, or if your time
    in the dark isn''t as easy as you think. If you take the time, using the shell
    (Bash) is a much faster and more effective way of getting tasks done.


    As you''d expect, a terminal effectively gives you access to your Linux shell,
    which means you have power at will. This means you can do anything that you''d
    normally be unable to do, without leaving the comfort of your desktop.


    It makes sense to use the terminal—and Bash—doubtedly advantageous when working
    with the Linux shell.


    We''re using Ubuntu for this tutorial, but you''ll find that in the terminal,
    you also have two entries: XTerm and UXTerm. This highlights that there are terminal
    emulators that you can run in any environment, and although they may differ, they
    fundamentally do the same thing.


    For the purposes of this tutorial, we''ll be using the default *gnome-terminal*
    emulator—it feels like a TeleType (TTY) session—has all the functionality you
    need, but XTerm and UXTerm are worth noting because they are more minimalist and
    neither require any dependencies to run. This means you can use either as a backup.
    As an aside, the only difference is the window is that UXTerm supports the enhanced
    Unicode character.


    ## Bash works


    The shell uses Bash and command language to parse syntax for commands: `utility
    command [options]`


    One of the best features of the command is that it allows you to run commands
    like ls for listing the contents of a directory, or apt-get to fetch the APT package
    management tool. The command is where you specify exactly what you want to do,
    and the options tell the utility how to install, update, or remove packages. For
    example, apt-get install vim


    The --option is where one or more flags can be set. Each flag is preceded by one
    or two dashes (--) and the most of all is the --help option, which provides a
    description of the utility and lists all commands and options, eg la --help


    > **Quick tip**: If you''re struggling to type the right command you can wipe
    away everything by clearing and hitting Enter Note that this will not affect your
    history


    ## Speed up text


    It doesn''t hurt to know how typing commands can be a time-consuming, frustrating
    experience. The terminal comes equipped with lots of shortcuts to save you some
    time. Take a look at how you can easily access previously used commands using
    shortcuts.


    - ↑ Up arrow: View your last command

    History: Use this to view your command history

    - Ctrl+r search: Type letters to search through the most recent matches displayed,
    and press Ctrl+r to find more

    - Tab View: Suggestions or auto-complete a word or path if only one suggestion
    exists. Press Tab again to autofill your host name and S+Tab to autofill a filename.


    ```

    nick@ubuntu:~$ apt-get --help

    apt-get (options) command

    apt-get (options) install package [pkg pkg ...]


    apt-get is a single command line for downloading and installing packages.

    ```


    - Commands:

    - update: Retrieve list of packages

    - upgrade: Upgrade all packages to the latest version

    - install: Install packages (pkg is not lib-deb)

    - autoremove: Remove all unused packages

    - clean: Remove downloaded archive files

    - build-dep: build-dependencies for source packages


    > --help can be used with any command to find out what it does, plus what arguments
    to use.


    ## Your first commands


    While it''s possible to install and manage software using a combination of Software
    Center and Ubuntu''s Software Updates setting, it''s often quicker to make use
    of the Advanced Package Tool (APT) family of tools. Here are some key commands
    that you can use (see below):


    - `sudo apt-get add-repository name` adds a new repository listed in /etc/apt/sources.list.

    - `sudo apt-get update` updates the package list (including versions) from all
    listed repositories.

    - `sudo apt-get install package` installs a new package.

    - `sudo apt-get remove package` removes an installed package. Use `sudo apt-get
    purge package` to also remove all its configuration files, and `apt-get autoremove`
    removes packages installed by others that are no longer needed.

    - `sudo apt-get upgrade` upgrades all installed software before running this.
    If you want to upgrade a specific package, use `apt-get install package` which
    checks for dependencies.


    ```

    $ apt-get update

    $ apt-get upgrade

    ```


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_60_0.png)


    The `-l` flag lets the list directory tool provide detail about the contents of
    the folder, including permissions; owner of the file; date it was modified and
    size in bytes. Utilities can run this without any privileges - eg: `ls -l` on
    its own to list all of folders and directories with a combination of commands
    and/or


    ## Restricted access


    Open the terminal and you will see something like this: `username@~$`. This indicates
    that you have access to the shell as your user. This means that you have a limited
    number of commands. You cannot install a package without using `sudo` directly,
    because the command requires root access.


    It is achieved in two ways - if you are an administrator, you type `sudo` before
    the command. You''ll be prompted for your password, and then the command will
    run. From then you can run more commands without your password (for five minutes)
    while the terminal is open.


    On some systems you can log in as the root at the terminal using `su -` - you
    will be prompted for the root password at which point you can run commands without
    sudo. Once logged in, you can execute commands with no restrictions. We recommend
    to use the `sudo` command rather than this if you''re running Ubuntu, because
    the root account is locked for security reasons. When installing software or adding
    new users, your user account might not be added to the `sudo` group. To resolve
    this, you need to use a account that has root access (or use `adduser`). You can
    also add the user to groups by list all groups you wish to add, eg: `sudo usermod
    -aG group username`.


    Another tool is gde, which allows you to download desktop applications with repositories
    very useful when you want to manage your system. Make sure keep the terminal open
    while running; otherwise the terminal will close. When you are done, press Ctrl+C
    in the terminal, which interrupts currently running programs and returns you to
    the command line. We already discussed the `help` flag, but there are other helpful
    tools you can use. First, `man` you can use with any command to get a description
    of it and its elements. `apt-get help` will show you the package information and
    what flags are valid. If you want a full manual, then `man` provides you with
    detailed information about the command line; type `man page` or exit with `q`.


    Now you''ve taken the first step into the world of First Commands, for some useful
    package management commands you can use. Next, we''ll learn how to navigate the
    filesystem from the terminal plus shortcuts to speed up your work.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_61.png)


    ## Terminal: Work with files


    Attention to navigating your file system and manipulating files and folders. Previously
    introduced us to the basics of using the Terminal in the same way as your Linux
    shell; how commands are structured (utility command option); plus gave you the
    tools to get further help. Here, we are going to look at how you can navigate
    your file system, work with files and folders, and use shortcuts.


    When you open a new Terminal window, the command prompt places you in your home
    folder. You can verify this using the `ls` command, which lists the contents of
    the current folder. The default Terminal displays folders in blue, and files in
    white. You can change this by using `ls -a` to display all files, including those
    that begin with a period (*) which are normally hidden from view.


    If you want more detail about file permissions, owner and group users, use `ls
    -l`. If you prefer to list files in kilobytes, megabytes or by modified date,
    add the `-h` option to `lslh`. There are many more options for `ls`; use the `--help`
    option to list them all.


    Navigating your file system is done using the `cd` command to move down to a sub-folder
    or enter the current directory using `cd <subfolder>`, by the name of the folder
    you want. Remember that file and folder names are case sensitive,


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_61_0.png)


    ```

    Terminal

    $ user@ubuntu:~/Documents$

    $ ls

    Documents  Downloads  Music  Pictures  Videos

    $ cd Documents

    user@ubuntu:~/Documents$

    $ ls -l

    total 0

    dr-xr-x 2 user user 4096 Oct 24 10:00 Work

    dr-xr-x 2 user user 4096 Oct 24 10:00 Downloads

    dr-xr-x 2 user user 4096 Oct 24 10:00 Music

    dr-xr-x 2 user user 4096 Oct 24 10:00 Pictures

    dr-xr-x 2 user user 4096 Oct 24 10:00 Videos

    ```


    > Make good use when folder names contain spaces and special characters


    The folder begins with a capital letter - your personal Documents folder does
    not exist if you type it in lower case, e.g. cd documents. You can also move several
    levels up to the previous level, using `cd ..`, or `cd ../..` for two levels.


    What if you want to go somewhere completely different? Use `cd /` to place yourself
    in the root directory, or navigate by entering the full path, including that `/`
    character to navigate from the top level, e.g. `cd /media/username`


    The `~` character works in a similar way to `$`; it places you in your home directory.
    By typing `cd ~/` is the same as `cd /home/username/`


    ## Speedier navigation


    In last part we reviewed some keyboard shortcuts to help you enter commands more
    quickly and make the Terminal feel easier.


    - **Ctrl+U** Clear the line to start again.

    - **Ctrl+H** Delete the word before the cursor. Accidentally committed `aud` from
    command?

    - **Ctrl+W** Delete the word before the cursor.

    - **Home/End** Press these to jump to the beginning or end of the current line.

    - **Ctrl+left/right** Move cursor


    command with audio. And if you type entering a command, just use the output of
    the command syntax to correct your word in the following example: `dpkg` was misspelled
    as `dkpog`


    ```

    $dkpog

    ```

