    \ 是标准值，Ubuntu 应该自动检测最佳速率。如果你的显示器支持高达 144Hz 的速率，你可能想根据制造商在此处选择。查看和更改刷新率简单的方法是从\
    \ Ubuntu 软件中心安装 `config-plugins`。安装后，点击图标打开它。\n\n"
