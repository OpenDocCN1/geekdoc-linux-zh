    ## Linux 应用


    ### 社交：与朋友互动


    将你的社交网络账户集成到 Ubuntu 中。


    Ubuntu 上的 Firefox 浏览器可以访问任何数量的社交网络，但你可能会发现从桌面访问它们更加方便。Ubuntu 桌面与 Google Drive
    良好地集成。Flickr 和 Facebook 将融合你的在线和离线数据。要开始使用，点击屏幕左角的“搜索”并输入“在线账户”（Online Accounts）。点击账户图标可以有关与计算机上所有应用程序兼容的账户。


    Flickr 是一个由雅虎提供的图像托管服务，类似于 Picasa。任何人都可以无需账户即可访问上传到网站的照片和视频，但必须注册才能分享他们自己的内容。


    如果你有电子邮件地址，就可以立即登录 Flickr。在“在线账户”列表中点击“添加账户”以显示 Facebook。然后会在 Flickr 上，你将


    一旦登录后，它的工作方式与 Google 相册相同。只需点击图标并输入你的搜索词即可。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_47_0.png)


    ### 集成


    可以双击 Google 账户链接来配置你的账户。输入你的用户名和密码。你将被邀请授权访问你的 Google 账户。


    一旦你完成，在线账户窗口将列出可以与你的账户集成的应用程序。它们默认将开启。最流行的之一是 Google 相册。你可以使用搜索图标查找 Picasa（现为
    Google 相册）中的照片。照片将显示存储在你的 Google Drive 中的内容。


    如果你有任何其他账户，例如 Ubuntu 中的“日历”应用程序也会自动导入它们。花一点时间检查它们是否显示正确。该应用程序是双向的，Ubuntu 的任何一个或多个部分也将集成你的在线日历。


    ### 桌面通知


    某些账户（如 Gmail、Twitter 和 Facebook）支持推送通知，当你打开它们的网页时，会显示一个小弹出窗口。例如，在 Facebook 上，你会在桌面上收到通知。


    如果 Facebook 中项可用但尚未实现，如果你想为少数网络账户、推文或电子邮件设置弹出窗口，请尝试在 Ubuntu 中安装 Chrome 浏览器。Ubuntu
    软件中心默认安装了 Chrome。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_47_1.png)


    ### 即时消息


    Ubuntu 软件中心提供了许多应用程序，可以连接到 AOL Messenger 或 Google Hangouts 等即时账户，而无需访问每个网站。


    以前 Ubuntu 带有 Empathy-instant 消息应用，但在系统的最新版本中已弃用。它非常容易打开。使用你的网络浏览器并访问


    ```

    https://ubuntu.com/software 然后然后点击 Ubuntu 软件中心中标记的红色按钮。将打开一个新窗口，点击“打开链接”开始安装。

    ```


    一旦 Empathy 打开，点击“账户设置”进入“在线账户”窗口。然后你将看到有


    > 点击“登录”以登录你的账户。你可以控制哪些特定的应用程序与你的桌面集成。


    ### Linux 格式：Ubuntu


    ### 设置 Skype


    由于 Skype 由微软提供且不发布其源代码，因此你不会在 Ubuntu 软件中心找到它。


    最新版本发布于 2014 年。Skype 开发者正尝试将此版本添加到稍后的发布版本中。该版本仍处于实验阶段，并且有很多许多错误。如果 Skype 对你很重要，你可以通过安装它并提供反馈来提供帮助。


    访问 https://skype.com 查看是否有适用于你的 Ubuntu 的版本。点击你的发行版并下载。Ubuntu 会询问你是否想用软件安装程序打开该文件。


    有许多视频会议程序作为 Skype 的替代方案


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_48_0.png)


    列出的是官方 Skype 客户端，而不是 Gmixer 和 Pulse 等，这两者都通过软件中心安装。


    打开 Ubuntu 软件中心搜索并安装 Skype。在搜索栏中输入 Skype 来启动它。


    Linux 版 Skype 以 Alpha deb 包的形式提供。该程序能够联系 Windows 和 Mac 电脑上的 Skype 用户，但无法联系没有使用从主页提供的官方
    Linux 客户端的人。


    - 选择 Ubuntu 12.04 安装官方版 Skype 4.3 Linux。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_48_1.png)


    如果你没有其他浏览器的页面，可能需要使用 Chromium 来使用设置。


    > 快速提示

    在线账户通过 Thunderbird 以及你的 Gmail 和 Facebook 账户提供支持。点击“添加账户”并从下拉菜单中链接 Facebook 以设置你的账户。


    Pidgin 和 empathy 都不支持 Facebook 消息。这是因为自 2015 年 4 月起，Facebook 支持开放 XMPP（消息和存在协议）添加了第三方来连接其聊天服务。你仍然可以在
    Thunderbird 中配置你的账户。


    **https://messenger.com/**


    大多数 Linux 消息程序允许你聊天（如 Jabber），它使用全球各地的服务器进行自由相互消息。访问 **jabber.org** 获取有关注册账户的更多信息和提示。


    如果你正在使用程序来管理你的消息或对话，而没有适用于 Ubuntu 版本，请先检查网站确保有 Skype 的链接版本。


    如果没有你偏好的下载应用程序，你可能可以通过浏览器访问它。例如，WhatsApp 可以在 Firefox 浏览器中通过 https://whatsapp.com
    使用，并扫描手机上的代码。


    - 当有人与你互动时，点击“允许”在桌面上显示通知。


    对于 Messenger 选项。Empathy 易于使用，但如果你遇到困难，在 GNOME wiki 上有大量支持：https://wiki.gnome.org/Empathy。


    虽然 Ubuntu 中安装了 Empathy，但由于它处理许多不同类型的消息协议，并不容易理解。


    想要支持多个账户并控制其消息的用户，Pidgin 是一个多功能客户端，支持 AOL Messenger、Yahoo、ICQ、MS Messenger、Google
    Talk、Bounce 协议等许多程序。


    要安装 Pidgin，访问 https://wiki.ubuntu.com/Pidgin 并按照说明设置你的账户。


    首次运行时，Pidgin 会为你提供各种账户供你设置。选择配置并设置账户。


    Pidgin 支持从一个账户到另一个账户，并有多种插件。Pidgin 和 empathy 都不支持 Facebook 消息。这是因为自 2015 年 4 月起，Facebook
    支持开放 XMPP（消息和存在协议）添加了第三方来连接其聊天服务。你仍然可以在 Thunderbird 中配置你的账户。


    '
