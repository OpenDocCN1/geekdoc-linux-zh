    ## Gimp key features


    Filters

    The Filters menu has a hoard of tools for everything from adding blur to cartoon
    filters.


    Tools

    The tools are a standard photo editing kitbag. Everything you''d expect is here.


    Options

    Beneath the tools you''ll find a full array of customisation options for tweaking
    their use.


    Layers

    The layers act much as the same as Photoshop. You can split an image, add extra
    layers and edit them here.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_0.png)


    You''ll notice three markers on the graph: one at either end and one in the middle.
    A well-exposed shot will show the readings all along the tonal range, depending
    on the contrast captured. If it''s underexposed, however, the readings will be
    shifted up at the left hand of the graph with a flatline towards the right.


    The best way to correct this is to drag the marker towards the right towards the
    area where the tonal values kick in, reducing the range of the image and increasing
    the values that have readings.


    If you''re lucky, this will brighten the picture without destroying it. The midpoint
    will also automatically adjust; it should retain a good contrast too, merely changing
    the brightness would wash out.


    As that is not enough, this single tool can also act to correct the "white balance"
    of your picture. If you''ve taken a photo indoors, you might have captured a yellow
    cast from the overhead lights. To remove this, you can use one of the pipe picker
    symbols in the same Levels dialog. From left to right, they allow you to select
    the black, grey and white point of an image. Gimp will work out what the others
    should look like from there.


    The white point is the easiest to use - click it then or in a detail you know
    should be close to pure white. Teeth or eyes are as good as clothes or tablecloths.
    This will also adjust the whole image to something more natural looking.


    And don''t worry if you don''t get it right first time. Just click on another
    part of the image or the Reset button will let you go again.


    That''s really scratching the surface of what Gimp can do. In the basic toolbox
    you can import images, draw paths, rotate or edit text. The only way to learn
    more is to try it out.


    ## Quick tip


    for quick photos there are tons of online photo editors; firefox browser is just
    as well as in other browsers, pixlr.com is the best known and great for quickly
    fixing red eye etc.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_1.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_2.png)


    Gimp''s Unsharp Mask is the best at picking up detail in images as Photoshop''s.


    ## Openshot: Start video editing


    Easy home video editing becomes simple with backtracking using the Openshot open-source
    video editing palette.


    If you believed that switching to Ubuntu Linux means giving up the ability to
    create videos, rest assured nothing could be further from the truth. The Openshot
    Video Editor available from the Ubuntu Software Centre can be mastered in a few
    minutes but allows you to create high-quality videos.


    Although Openshot is free, it means it is the only video editor that will work
    well in Ubuntu; it is simple to pick up, but having features balanced between
    ensure you create a professional-looking video.


    In this tutorial we will explain how to import video and audio and export them
    as a video.


    In order to proceed, you will need to use your computer to import video files
    onto the timeline. Once your machine is ready, click on the Software Centre and
    search for ''Openshot''. Click ''Install'' to download the program.


    Your first step when launching Openshot should be to create a new project. Click
    the New Project button at the top left or hold Ctrl+N. A window will appear allowing
    you to type in the project name and choose where to store the project files in
    your home.


    At this stage no need to worry about the video settings except Project As which
    can be changed later. Choose ''Save Project'' to create a project file detailing
    all the media you have imported using the file extension .openshot. This is not
    a video file and cannot be played in a player.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_39_0.png)


    > Background music has been imported to Track 1, a cat video is on Track 2. The
    original audio has been muted.


    It''s simply a way for you to save your work as you go in Openshot. Next, click
    a single video clip at the bottom right to select. Click the green icon to begin
    placing it on the timeline. In the example, select multiple clips by holding Ctrl
    and clicking on each clip. Click the Add button to the right to import the media
    files and they will appear in the ''Files'' window at the top of the timeline.


    Once your machine is ready, the next step is to drag the items into the ''timeline''.
    This is fairly easy as the timeline is displayed along the top and you can move
    them anywhere. If you want one clip to be playing after 3 seconds and another
    after 8 seconds you can change this by sliding the blue bar at the left edge accordingly.


    ## Tracks, and timelines


    You will notice two tracks displayed where you can place your content. You don''t
    have to use more than one track, but if you want to use more advanced features
    tracks and backgrounds it is simple to divert a clip to each clip. Click the green
    + icon above the timeline to add more tracks if you want.


    If you have to add a track, just drag an audio file into the timeline. Simply
    click the track you want to play, then click the loudspeaker icon on the left
    side of the timeline to mute the audio.


    If you also want to add a video title, to do this, hold Ctrl + T to open the Title
    menu. Then click the menu start ''New Title'' to set the text. The title will
    appear in the Files window and can then be dropped onto the timeline where you
    need it.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_39_1.png)


    | Project Name | My talking cat |

    | --- | --- |

    | Project Folder | Openshot |

    | Width | 1280 |

    | Height | 720 |

    | Frame Rate | 29.97 |

    | Audio | No |

    | Progressive | No |


    ## OpenShot Slideshows


    If you wish to create a video from a series of photos, place them in a folder
    and make sure they are sequential. Most digital cameras will do this for you.
    Use the ''Import'' button to load all images. Press Ctrl+A to select all and right
    click them. Choose Import.


    The ''Transition'' section allows you to choose a transition between photos. This
    saves you time and trouble of inserting transitions individually, but naturally
    it will be the same kind of professional-looking Blend for every photo.


    By default the ordered numbers will be added as i1 and then i2 and so on. You
    can change the order in the ''Timeline'' section. Click ''Add'' when you are done.


    At this point you may want to add an audio track for music. Slideshows are exported
    as video in the format by clicking the ''Export'' button at the top and you''re
    done.


    - Use the arrows on the left to change the order of the pictures.


    Sometimes you may only want to create a video with clips from a larger recording,
    for instance to play slideshow at a wedding. The Razor tool can be activated by
    clicking the scissors at the top of the timeline. Once you are done the cursor
    will change to a picture of a razor with a blue dashed line.


    Left click with the mouse to split your video into parts.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_40_0.png)


    ## Effects and transitions


    If you wish to create a video from a series of photos, place them in a folder
    and make sure they are sequential. Most digital cameras will do this for you.
    Use the ''Import'' button to load all images. Press Ctrl+A to select all and right
    click them. Choose Import.


    The ''Transition'' section allows you to choose a transition between photos. This
    saves you time and trouble of inserting transitions individually, but naturally
    it will be the same kind of professional-looking Blend for every photo.


