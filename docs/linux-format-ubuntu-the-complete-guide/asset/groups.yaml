    # Installing Ubuntu


    You''ve got to try it to love it, but you''ll get to feel its power.


    Uttering the phrase "Installing Linux" will send a shiver down the spine of most
    humans, but it''s not as terrifying as you fear. Don''t get zealous; it''s still
    possible to wipe out your existing OS by the wrong bunch, and you''ll spend a
    couple of hours trying to de-install through Ubuntu before installing it.


    Running the live environment on a virtual machine will give you a handle on the
    ''new'' feel of free software. There are a couple of hoops to jump through before
    we get you there.


    2.5GB disk image (ISO) file which you can write to a DVD using the software of
    your choice (example, Toast on macOS, CDBurnerXP on Windows, Brasero on Linux).
    We know many PCs and most laptops have optical drives nowadays, but that''s okay
    – the image can be written to a USB drive which will probably be faster and certainly
    better than booting from DVD. There are programs like Unetbootin that can automatically
    download and set up in all kinds of ways, but we prefer to keep things simple:
    use the cross-platform Etcher. Grab it from https://etcher.io, start it, plug
    in a USB drive (make sure there''s nothing precious on it) and you...


    ## Using the image

    ## “We know that most laptops don''t have optical drives, but that''s okay – the
    image can be written to a USB stick.”


    You''ll need to figure out how to make your PC boot from USB or optical media
    before you enter Ubuntu. You have two options: one is to open any provided Boot
    Menu – not all of them use – the keys used, F9, Del and F12, older/BIOS-based
    systems F8, UEFI systems by F1. You need to slowly tap the key just after switching
    to the system. Select the CD-ROM/optical drive and press Enter. If you''re good
    to go!


    If no menu appears the other option is to select the order of boot devices in
    the BIOS/UEFI settings. A message should appear during the system start asking
    which key to press. Just as with the boot menu pressing Del (the most common),
    F1, F2.


    Download Ubuntu and install whatever operating system you''re comfortable with.
    Fire up your browser and head to https://www.ubuntu.com/desktop/ and press the
    Download button. If you''re feeling charitable you can also make a donation to
    Canonical and help us out. This is optional. We recommend making a cup of tea
    while the download completes. You should now have a we...


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_17_0.png)


    ## Installing a VirtualBox


    ### Get VirtualBox

    Head to www.virtualbox.org and download VirtualBox 6 for your operating system.
    Install it and make sure you''ll have at least 8GB of free disk space to store
    the Ubuntu ISO file. You will also need the Ubuntu ISO file from https://www.ubuntu.com/desktop/download.
    Once installed click the New button and call it Ubuntu.


    ### Create a machine

    Choose Ubuntu and the bits should match the ISO you downloaded, then click Next.
    If you have enough RAM you can leave all the default settings, apart from the
    hard drive size. 8GB is quite enough, but we''d suggest at least 32GB if you can.
    Finish and click start to get going.


    ### Starting virtual Ubuntu

    A prompt will ask you for a disk – locate the Ubuntu ISO file and click Start.
    Ubuntu will start up, and once you''ve loaded the ISO use it to properly install
    it in the virtual machine. For extended use, in the virtual machine settings under
