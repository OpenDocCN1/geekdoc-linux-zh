    ## Ubuntu 设置


    在 Ubuntu 桌面面上点击“设置”可以让你自定义你的电脑。


    | 外观 | 亮度与锁定 | 显示器 |

    | --- | --- | --- |

    | Ubuntu 是一个非常有吸引力的操作系统，但如果你想调整它的外观并使用你自己的桌面作为背景，请点击此处更改其外观。 | 如果你想节省能量并在不使用电脑时关闭电源，请点击此处关闭屏幕。解锁电脑需要输入密码。
    | 这可以允许你更改 Ubuntu 的分辨率以更好地适应你的屏幕。如果你有多个显示器，你还可以从此界面选择它们显示 Ubuntu 的顺序。 |


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_26_0.png)


    | 系统设置 |

    | --- |

    | 个人账户 |

    | 外观 | 亮度与锁定 | 语言支持 | 账户 | 安全与隐私 | 文本输入 |

    | 硬件 |

    | 蓝牙 | 颜色 | 显示器 | 键盘 | 鼠标与触摸板 | 网络 | 电源 |

