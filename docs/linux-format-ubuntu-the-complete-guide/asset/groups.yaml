  mdcn: "\n\n## 显示：设置你的所有屏幕\n\n配置显示器选项的基础设置，如分辨率、视觉效果、屏幕保护程序等。\n\nUbuntu 的设计初衷是易于设置，其显示设置提供了用户友好的体验。然而，如果你想优化\
    \ Ubuntu，应先点击“搜索”（Search）并进入“外观”（Appearance）。在这里，你可以从各种内置桌面背景中进行选择。如果你从网上下载了自己的背景图，也可以使用它。只需将图像放置在“图片”（Pictures）文件夹中，然后从“外观”的下拉菜单中点击“壁纸”（Wallpaper）来更改你的选择。\n\
    \n你可以在这里做的另一个调整是更改系统外观主题。将窗口主题更改为较亮的“光芒”（radiance）。你也可以选择“高对比度”（High Contrast）主题，这对于视障用户可能有用。使用标记为“启动器图标大小”（Launcher\
    \ Icon Size）的滑块来增加启动栏的大小。\n\n## Ubuntu 屏幕\n\n某些版本的 Ubuntu 不带有新的屏幕保护程序。显示器将在一段时间后关闭。你也可以通过进入“系统设置”（System\
    \ Settings） > 亮度与锁定”（Brightness and Lock）来更改这些设置。\n\n屏幕在不活动五分钟后将变暗以节省能量。\n\n>\
    \ 默认情况下，Ubuntu 会循环播放屏幕保护程序；如果你愿意，可以只选择一个，这意味着当你回到电脑时，在需要输入密码访问桌面时你可能需要手动切换。\n\n\
    大多数现代显示器和电视都是 LCD 屏幕，如果屏幕长时间空白，它们不会出现旧式 CRT 屏幕保护程序烧屏的问题。\n\n如果你更倾向于在机器上看到比空白屏幕更烦人的东西，可以通过安装此程序来移除它。首先点击并搜索“终端”（Terminal）应用程序。按照以下顺序移除屏幕保护程序：\n\
    \n```bash\napt-get remove-screensaver\nscreensaver xscreensaver-data\n```\n\n\
    系统会要求你输入密码以确认你想删除它。先执行此操作。接下来输入 Y 确认你想要删除此程序。这只需要几分钟。现在你输入以下命令来安装具有多种可选屏幕保护程序的新屏幕保护程序：\n\
    \n```bash\napt-get install xscreensaver xscreensaver-data\nscreensaver-gl\n```\n\
    \n按一次 Y 并等待文本滚动。点击按钮，新的屏幕保护程序将启动。\n你将在窗口左侧的框中看到各种不同的屏幕保护程序。可以随意滚动它们并点击“预览”（Preview）按钮查看它们的样式。你可以从下拉菜单中看到，默认设置是\
    \ Ubuntu 随机循环播放可用屏幕保护程序，如果你愿意，可以选择一个屏幕保护程序，或者完全关闭它。\n\n![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_0.png)\n\
    \n![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_1.png)\n\n![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_2.png)\n\
    \n- 使用该应用程序更改你的壁纸和主题。\n\n## 多显示器\n\n## 系统设置\n\n要在你的设备上监控显示器，首先连接到它并登录 Ubuntu 桌面。点击状态栏并选择“显示”（Displays）。点击你的次要显示器并使用拨动开关将其打开或关闭。如果你点击“显示”图标后看不到显示器，一旦你的次要显示器启用，可以随时将其拖动到你选择的位置。你可能需要标识当前的显示器。如果你在进行演示时希望它们显示相同的内容，也可以选择“镜像显示”（Mirror\
    \ Displays）。如果显示器的能力不同，这可能会限制你的分辨率选项。我们默认在每个显示器上启用启动器。如果你喜欢，点击“所有显示器”（All Displays）来显示主显示器。禁用“禁用边缘”（Disable\
    \ edges）功能，该功能防止你将鼠标移动到另一个显示器。当你的鼠标到达一个屏幕的边缘时，需要额外的推力才能移动到另一个屏幕。默认是开启的；如果你想关闭它，请点击拨动开关。\n\
    \n![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_0.png)\n\n- 多显示器！\n\n在关闭屏幕保护程序时，勾选锁定密码旁边的复选框。如果你想调整电源设置，请检查“高级”（Advanced）选项卡并勾选“电源管理”（Power\
    \ Management），或在一段时间后关闭显示。\n\n## 分辨率与旋转\n\n分辨率显示是显示器上可以显示的像素简单数字，以宽度和高度表示，例如 1024x768。Ubuntu\
    \ 会尝试检测显示器的最佳分辨率，但如果显示器太小，你可以更改它。\n点击“显示”（Display）按钮，这将允许你更改显示的各个方面，包括分辨率。点击菜单按你的意愿将屏幕向左或向右移动。菜单下方你可以更改屏幕设置的旋转。你还可以使用滑块调整任务栏的大小。需更多帮助请参考“多显示器”：\n\
    \n![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_1.png)\n\n刷新率是衡量你显示器的简单数字。对于普通显示器，60Hz\
    \ 是标准值，Ubuntu 应该自动检测最佳速率。如果你的显示器支持高达 144Hz 的速率，你可能想根据制造商在此处选择。查看和更改刷新率简单的方法是从\
    \ Ubuntu 软件中心安装 `config-plugins`。安装后，点击图标打开它。\n\n![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_2)\n\
