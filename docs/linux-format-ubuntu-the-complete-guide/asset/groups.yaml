    shell out for a drive replacement, or starting from scratch with a fresh Ubuntu
    and new-found love of backing up your system. As your drive shows up, select it
    from the left-hand menu where you can find the partition table to check its health
    via SMART. Don''t panic if the drive is dead on least, focus your next check on
    the partitions yourself. Most tools recommend a quick check, but you can manually
    perform this check using GParted, which is both robust.


    GParted enables you to see how your partitions are arranged, and reveals which
    one is the best. Right-click and view Mount if marked out. Check to schedule a
    check using the tool. If you click for repair and attempt to recover data, stop
    as soon as you click, but the partition isn''t mounted. Also give it some time
    it needs to complete—this could take hours or days in some extreme cases, and
    could almost certainly corrupt the partition. Make sure the check is run on all
    partitions on the drive.


