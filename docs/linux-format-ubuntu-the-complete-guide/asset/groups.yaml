    # Get started


    # # What is Ubuntu?


    It''s an operating system, it''s computer freedom, its gateway to open source
    and a community that shares software for everyone to use.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_9_0.png)


    Ubuntu versions

    Like most software, Ubuntu has released versions and code names. If you''ve never
    come across Ubuntu before these can be a bit odd, unusual and confusing so let
    us explain. The company that develops Ubuntu releases twice a year and it increases
    the version number by one. The releases are April (04) and October (10), so 19.04
    was released in April 2019. The release after was 19.10 in 2019.


    Each normal release gets months of support. Every two years there is a Long Term
    Support (LTS) release that lasts years. The current is 19.04 LTS, the last was
    18.04 LTS. If you want something more stable, we suggest picking one of these
    releases. To add to the quickness, every release gets an interesting name, after
    a cipher for each release. Recent names are:


    +   - 16.04 Xenial Yandex

    - 16.10 Katty Yak

    - 16.04 Zesty Zaps

    - 17.04 Artful Aard

