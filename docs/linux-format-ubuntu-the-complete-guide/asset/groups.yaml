    ## Working with files and folders


    You can now list directories and navigate your file system, but what about moving
    and copying files? You''ll find a range of different commands, and the tricks
    you''ve learned in all will help you in wherever you go.


    Let''s start by copying with `cp` and moving with `mv` files. The same options
    apply to both. The basic syntax is: `cp [options] [source] [destination]` and
    `mv [options] [source] [destination]`.


    This creates a copy of the file with the same name. To move the file to a different
    location and rename it, use `mv source ~/.Documents/source_backup`. To create
    a copy of the file with a new name, simply use `cp source source_new_name`.


    and the file is moved or renamed as needed. What if there''s already a file named
    `source_backup`? It will be overwritten unless you use the `-i` flag, so make
    sure you''re sure you want to overwrite it by adding `-i` to the end of the command
    line.


    You can also copy folders using `cp -r` to include the recursive content. The
    folder is copied with all its attributes and is correctly arranged in the original
    locations of the parent folder: `cp -r source ~/.Documents/source_backup/`


    Use `rm` to delete a single file, eg. `rm file`. The `rm` command deletes folders
    but only empty ones. If you want to delete a folder and all its contents, use
    `rm -rf folder`.


    You can create new folders with `mkdir` — simply type `mkdir`, replacing folder
    with your folder name. Use the `touch` command to create an empty file, such as
    `touch config`.


    Wildcards are used to speed up searches in commands, like the asterisk (*) and
    can be applied to multiple files at once-


    Two characters are very useful when you are navigating: the single question mark
    (?) and brackets []. This works fine for any one folder beginning with Doc, but
    if there are two (say Documents and Documents_old), use `cd Documents*`. To avoid
    this, use `cd [Documents]*` (unless you have a folder called Collectors and Documents).


    You can also use the `~` to get around this, eg. `cd ~/Documents`. This refers
    to your home directory and will be replaced by the following character (in this
    instance the space).


    We finish off by mentioning characters that allow you to run multiple commands
    on a single line. Use `&` to run a command in the background, and `&&` to run
    the second command only if the first command completed successfully.


    ```bash

    sudo apt-update && sudo apt-get-upgrade

    ```


    If you wanted the second command to run regardless of the first, use `;`. If you
    want to use the second command to run after the first restart of the system, use
    `|`.


    ```bash

    sudo apt-get update; sudo apt-get remove firefox

    ```


