    # Get started


    # What is Ubuntu?


    It''s an operating system, it''s a community that shares software for everyone
    to use.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_9_0.png)


    Ubuntu versions

    Like most software, Ubuntu has versions and code names. The company that develops
    Ubuntu releases twice a year and it increases the version number by one. The releases
    are April (04) and October (10), so 19.04 was released in April 2019.


    Each normal release gets months of support. Every two years there is a Long Term
    Support (LTS) release that lasts years. The current is 19.04 LTS, the last was
    18.04 LTS. If you want something more stable, we suggest picking one of these.
    To add to the quickness, every release gets an interesting name, after a cipher
    for each release. Recent names are:


    - 16.04 Xenial Yandex

    - 16.10 Katty Yak

    - 16.04 Zesty Zaps

    - 17.04 Artful Aard

    - 18.04 Bionic Beaver

    - 18.10 Cosmic Cutlefish

    - 19.04 Disco Dingo

    - 19.10 Erin Ermine


    If we say Windows or macOS what you think If we say Ubuntu, you are left blank?
    Ubuntu The Complete Guide, it''s more than you''ve picked up this Linux Format:
    it''s possibly you''ve heard of Linux, and you''ve have to be used to Linux. If
    we say Ubuntu and open software freedom, let''s get to pick up with it all about.


    So is Linux? What is Ubuntu? And how does the concept of open source software


    work? If you''ve seen the penguin fellow hanging around various pages and on the
    cover of Linux his name is Tux. He is the mascot of the world-famous open source
    called Linux. It''s the control software at the heart of most operating systems,
    such as Android and Ubuntu, and it''s used in hundreds of operating systems, one
    of the most popular is Linux. Just as Windows and macOS have their kernel, and
    Apple''s macOS has it so Ubuntu has Linux.


    While Linux has developed since 1993, Ubuntu first appeared in 2004, and thanks
    to its easy-approach philosophy and short development cycle, it rapidly became
    the most popular open source Linux operating system in the world. Ubuntu is an
    operating system, just like Windows and macOS, it''s also easier than other Linux
    in the world, like a distribution, also distro.


