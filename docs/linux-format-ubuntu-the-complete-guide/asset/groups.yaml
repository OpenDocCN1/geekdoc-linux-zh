    ## Gimp 主要功能


    ### 滤镜

    滤镜菜单包含了大量的工具，涵盖从添加模糊到卡通滤镜的所有功能。


    ### 工具

    这些工具是一套标准的照片编辑工具包。你所预期的一切这里都有。


    ### 选项

    在工具下方，你会找到系列自定义选项，用于微调它们的使用。


    ### 图层

    图层的作用与 Photoshop 非常相似。你可以在这里分割图像、添加额外图层并对其进行编辑。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_0.png)


    你会注意到图表上有三个标记：两端各一个，中间一个。曝光良好的照片在整个色调范围内都会显示出读数，具体取决于所捕获的对比度。然而，如果曝光不足，读数将向图表的左侧偏移，并在右侧呈现为一条直线。


    纠正此问题的最佳方法是将标记向右拖动到色调值开始的区域，从而缩小图像的范围并增加具有读数的数值。


    如果你运气好，这将点亮图片而不破坏它。中点也会自动调整；它应该也能保持良好的对比度，仅仅改变亮度会导致画面发白。


    由于这还不够，这个单项工具还可以纠正照片的“白平衡”。如果你在室内拍摄，可能会捕捉到来自顶部的灯光的黄色色调。要消除这一点，你可以使用同一个“色阶”对话框中的一个吸管器符号。从左到右，它们允许你选择图像的黑点、灰和白点。Gimp
    将据此推算出其他点应该是什么样的。


    白点是最容易使用的——点击它，或者点击你认为应该是纯白色的细节处。牙齿或眼睛和衣服或桌布一样都可以。这会将整个图像调整得看起来更自然。


    不要担心第一次没做对。只需点击图像的另一个部分，或点击“重置”按钮即可重新来。


    这仅仅是 Gimp 功能的冰山一角。在基础工具箱中，你可以导入图像、绘制路径、旋转或编辑文本。学习更多内容的唯一方法就是尝试。


    ## 小贴士


    对于快速拍摄的照片，有许多在线照片编辑器；firefox 浏览器与其他浏览器一样好用，pixlr.com 是最知名的，非常适合快速修复红眼等。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_1.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_38_2.png)


    Gimp 的锐化掩码在捕捉图像细节方面与 Photoshop 一样出色。


