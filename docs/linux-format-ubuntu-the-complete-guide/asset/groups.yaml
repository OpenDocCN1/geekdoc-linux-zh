    # Linux 应用


    ## 常见的 Windows 程序


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_0.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_1.png)


    ## Gtkpod (Apple iTunes)


    拥有 iPhone 或 iPod 吗？你可能担心无法在 Linux 上使用 iTunes，无法与设备同步音乐，但别担心，Gtkpod 可以帮助你管理你的 iPhone
    和 iPod 库。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_2.png)


    ## Amarok (媒体播放器)


    你只是用媒体播放器来听音乐吗？那么你可能需要 Amarok 来帮助你组织和管理计算机上的数字音乐收藏。它还可以帮助你导入和编辑 MP3 文件。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_3.png)


    ## Evince 查看器 (Acro reader)


    PDF 是今天最流行的文件类型之一。如果 Linux 没有 Adobe Reader，你也不会被落下。Evince 文档查看器更快、更轻量，并且可以完成 Adobe
    软件的所有功能。它在许多 Linux 发行版中都是默认安装。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_4.png)


    ## K3b (CD/DVD 刻录机)


    如果你使用 Windows 资源或 Nero Burning 等第三方程序刻录数据 CD 和 DVD，那么 K3b 是一个极佳的替代方案，它同样能胜任，而且它是完全免费的。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_5.png)


    ## OpenShot (电影制作)


    对于所有的初学者——不要担心缺少 Windows Movie Maker 或 Sony Vegas，因为 OpenShot 是一款多功能且强大的视频编辑器，将帮助你使用
    Linux 转换家庭电影。


    ## F-Spot (图像查看器)


    对于组织照片、标记、进行轻量编辑以及与世界分享，F-Spot 是 Windows 图像查看器的完美替代品。对于努力捕捉无缝细节的硬盘摄影师来说，它是理想的程序。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_5.png)


    # Linux 应用


    ## Rhythmbox：播放媒体


    让你的音乐从播放器和扬声器中响起来，然后再看一些视频，这都是 Ubuntu 的常便饭！


    还记得那些必须买带有内置收音机的 CD 播放器，或者买磁带来听音乐的日子吗？你并不孤单。当可以在手机上携带全世界的歌曲，并无线地向电视或互联网流传输音频时，你为什么还会发明那种东西呢？


    我们在桌面桌面上永远需要一个好的音乐播放器。无论是在工作时享受音乐或网络电台，还是在旅行时看电影，无论你在何处，数字媒体都应该是享受的。


    幸运的是，Ubuntu 拥有你所需的所有工具。如果你是从 Windows 转过来的，有一个关键调整需要做。Windows 操作系统使用 Windows Media
    Player，它是来自回源（如硬盘或 USB 闪存）——网络驱动器的音乐和视频播放的枢纽。Ubuntu 视频和音乐播放有单独的应用程序。


    对于音乐，Rhythmbox 允许你管理音频媒体、从各种源流传输并直接将 CD 刻录到驱动器。例如，Rhythmbox 在 Ubuntu 启动器中以 Rhythmbox
    的名称出现。


    # 使用 Rhythmbox


    在音频方面，Rhythmbox 功能完全可以满足你的需求。它可以从本地库播放音乐、刻录 CD、自动为数字文件添加专辑封面、购买歌曲，并从另一台 PC 或网络存储设备流传输。然而，Rhythmbox
    有一点重要的事情你需要记住。默认情况下，Ubuntu 不包含解码 MP3 格式的代码，因为 MP3 代码的许多部分仍受专利保护。MP3 分发版无需支付许可费用即可使用。


    对于视频，只需查看 Ubuntu 软件中心并搜索“Rhythmbox Extended”。如果没有安装，点击此处并下载到你的 PC 直到完成。


    安装完成后，第一次使用它时，你希望指向你存储歌曲的地方以建立你的音乐库。打开“编辑”菜单，然后选择“首选项”，如果音乐库存在，则将 Rhythmbox 指向它，然后点击顶栏库按钮中的新文件！现在，你库中的任何歌曲和专辑将出现在
    Rhythmbox 中，你可以通过 Rhythmbox 刻录 CD、购买或从本地播放器添加音乐，它将保存到同一个物理位置。


    你有这些选项来选择刻录音乐的格式和质量，以及自动生成的收藏夹中你喜欢的命名约定。


    一旦你开始播放某些音乐流，Rhythmbox 的主视图非常直观（见下文）。你会注意到左侧的列相当稀疏，有一些选择音乐、播客（关于）或网络电台的基本库选项。你还可以看到播放菜单中进入的内容。


    要添加像这样的额外选项，你需要访问“插件”菜单，点击“工具”即可找到它。


    Rhythmbox 带有一些默认禁用的额外功能。在此菜单中，你可以开启如 Last Fm 滚动和 Jamendo 音乐商店等额外内容，但你可以轻松获得更多。


    必须安装的一个核心插件是 Gr 套件，它将允许你从网络上的其他计算机和库流传输。如果尚未安装，打开软件中心并搜索 grillo-plugins，然后安装。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_35_0.png)


    - 小提示：对于在线音乐，可以添加到 Ubuntu 浏览器的 Spotify 客户端是 Firefox：如果你使用 Firefox，可以安装 firefox-netflix，或者使用
    Firefox 中的用户插件。

    - > 可能是 Ubuntu 最好的视频播放器，VLC 安装了音乐。


    # 探索 Rhythmbox 界面


    ### 专辑封面

    Rhythmbox 会自动从网上抓取专辑封面，但你可能需要设置插件。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_36.png)


    ### 库

    你可以选择本地库、UPNP 共享或播客。


    ### 添加源

    加号按钮允许你为你的硬盘、URL 或共享部分添加源。


    ### 播放队列

    这列出了你正在播放的内容。


    ### 艺术家列表

    左侧是艺术家列表，右侧是专辑列表。


    启用 Rhythmbox 插件部分将导致网络上的库出现在左侧菜单中。


