    # # Sound: Tweak your audio


    Explore Ubuntu''s sound settings as well as how to connect external speakers and
    make everything sound perfectly.


    In this section we will explore how sound is managed in Ubuntu and how to connect
    external speakers and microphones. We will also discuss suitable programs for
    recording and playing back audio as well as troubleshoot issues.

    Ubuntu''s sound is managed by a program server which sits between your various
    programs and sound hardware. PulseAudio is known as sound hardware capable of
    mixing several together or playing to multiple devices at once.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_79_0.png)


    For most users volume works out of the box after installing Ubuntu if you wish
    to connect external speakers or adjust settings for individuals you may need to
    access Sound Settings.

    Volume is adjusted in Ubuntu by clicking on the sound icon in the menu bar to
    move the volume switch to the left or the right. If you do not see the Open Settings
    menu use the search bar to find Sound Settings.

    Some keyboards also have volume controls. Hold the Fn key before pressing the
    volume keys to adjust the volume.

    The sound settings also allow you to choose your output device. Simply click on
    the left hand of the window. If you use earphones or speakers a form will simply
    display settings.

    Depending on the speaker setup, you may have this opportunity to adjust the various
    settings for speakers. The sound sliders which they have are fairly self explanatory
    allowing you to adjust the balance, fade and underneath.


    # ## Volume and playback


    > > As the Output tab you can choose your device from the pane on the left hand
    side. Adjust the volume using the slider switch.


    The Applications tab in Sound Settings is extremely useful as it allows you to
    adjust the volume for individual programs. If you are listening to music CD while
    using the browser, you may want not to hear the commentary from news videos, so
    you can mute the web browser.


    # ## Input devices


    Settings for devices like USB microphones or webcams with internal connections
    can be accessed from the Input tab in Sound Settings. In the same way as for the
    speakers input devices via USB will be listed. Simply click with your mouse to
    mute recording moving forward.


    Take some time to look at the Settings for Microphone. It is helpful to see how
    volume will change the sensitivity. It is simply displayed in the Input level
    bar.


    At the bottom of the Sound Settings, you can choose Show Volume Level in the Menu
    Bar. This is ticked for any reason to be able to access sound settings easily
    in future.


    If you need to record short audio clips with music, use Sound Recorder from the
    Ubuntu Software Centre. It is very basic but you will need to record and play
    back short clips.

    If you need more featured audio recorder e.g. for recording podcasts or filming
    your recordings, consider downloading Audacity. This has many features. Visit
    www.ubuntu.com/package/acity/ and click the red button APT install the installation.
    Ubuntu''s bundled music player is Rhythmbox. It has all the basic functions of


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_79_1.png)


    +   * Quick tip

    * If you are playing music through the Firefox browser, you can click on sound
    in open tabs by clicking the loudspeaker icon beside the small ''X''.

    n* Once the Sound Settings menu is open, click Sound to find a launcher that will
    provide placeholders for each of your speakers left front and right.'
