    如果你从未用过音频文件的波形形式，编辑起来其实很简单。每个轨道的中间，即 y 轴上的点，代表静音。如果音频有一部分是长长的直线，说明录音中该部分是空白的。轨道显示为轨道一侧的尖峰。


    到这里，你有两个应该学习的快捷键。第一个是空格键，它从当前标记处开始播放音频（回放）。按 Ctrl 键停止，然后滚动鼠标滚轮来放大或缩小波形。如果你放大，你可以看到轨道两侧看起来像三角形和弦的东西；`1`
    实际上是长条图表在线条上下快速移动。


