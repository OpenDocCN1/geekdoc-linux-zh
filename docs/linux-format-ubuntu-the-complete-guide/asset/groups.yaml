    > To see a list of music players click the Software Center and click audio categories:
    New Players. If you are happy with Rhythmbox check the Getting Started at https://ubuntu.com/community/Rhythmbox.


    # Sound troubleshooting


    If you are unable to hear sound on your machine, it''s important to find exactly
    where the issue lies.


    # RestrictedFormats


    If you set up Ubuntu you were given the option to download these formats. If you
    didn''t have the time, you can do so by opening the Terminal on Ubuntu and running
    the command:


    ```

    sudo apt-get install restricted-extras

    ```


    Press enter to confirm the command, then to y to confirm that you want to install.
    After you will be able to play all restricted files, installing using the Ubuntu
    Software


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_80_2.png)


    This media player is capable of playing any video or audio format.


    If sound is not working, at first check the correct output device and the volume
    is set. If everything is in order, you may need to adjust the sound for your particular
    output device.


    Open Terminal on the machine and run the command alsamixer. This will display
    the level of your devices and allow you to control the level of each. Use the
    left/right keys to move the volume levels up and down and mute the channels when
    you''re not using them. Ubuntu will befriend your speakers now.


    In order to find your sound settings finish opening the PulseAudio configuration
    tool. It''s not easy on the eye but you can control many different settings like
    Ports and latency.


    If you have a connected bluetooth headset or speakers (Pairing Bluetooth Speakers),
    pair them with another to make sure your computer see the discovery is enabled.


    If it fails you reset your sound settings to default by opening the Terminal application
    and ending the following command:


    ```

    amixer -rm --config pulse/pulseaudio

    ```


    For more depth troubleshooting sound in Ubuntu visit https://ubuntu.com/community/SoundTroubleshootingProcedure.


    > If you''re unsure if the sound is working, check all files. All & codecs are
    available in /usr/share/audio/sound-/Front. You will hear a voice saying Front.


    # Drives: Access flash and optical media


    Your Linux is not an island. Here''s how to access both flash and optical media
    using Ubuntu''s built-in tools.


    Linux handles drives differently to Windows, so if you''ve migrated from Windows
    PC, we recommend you acquaint yourself with how drives are treated equally and
    accessible. The good news is - once you''re over the initial shock - the transition
    isn''t that big. And once you''ve understood how things work, you can go to learn
    more about removable media, using USB flash storage as CD and DVD.


    searching for ''exfat''. Install ''exfat-fuse'' followed by ''exfat-utils'' if
    you''re running Ubuntu 64-bit, or choose the 38 labeled versions if you''re running
    the 32-bit. If you don''t know what you''re running, go to System Settings ->
    Details and examine the OS type to find out. Full read/write mount for any exfat
    drive will be enabled.


    # Working with USB drives


    Ubuntu is more than happy to work with USB storage of any nature - hard and flash
    drives are treated equally well.


    USB drives are recognised in the same way as hard drives - Open Disks to identify
    the drive, format or change its label for you.


    Just plug in, and it will be formatted using a supported system. Ubuntu has built-in
    support for FAT32 and NTFS as well as its own file system - ext4 - which you can
    use like any other.


    Large drives - typically TB or larger - are formatted in the exfat format. Support
    for exfat is not included in Ubuntu, but you can get it by opening the Software
    Center. Once plugged in, the Nautilus file manager will show your mount point
    in <media>/username or <media>/<dev> where <label> is the name you gave it when
    the partition was created. Until then the drive stays there. When you''ve finished
    with the drive and want to remove it, click the button next to the drive in Nautilus
    to unmount it. If you need to remove a drive from a Terminal, use the umount command:


    ```

    umount /dev/sdb1

    umount /media/RPI

    ```


    By using the umount command, you can remove multiple drives at once. For example,
    umount a partitioned drive, allowing you to remove the drive even if it''s partitioned.
    mount a specific volume or part of it using its mountpoint as


    # Read-only mode


    Sometimes you might want to use a USB drive in read-only mode, so data can''t
    be written to the drive. Default Ubuntu will mount any supported file system in
    read/write mode. The trick is to use the mount command with special flag (-r)
    to mount the selected volume, then remount it in read-only mode – this means you
    can physically remove the drive without worrying data loss.


    If you can find a drive using the -a command you can use the -r flag instead on
    each mounted volume to read-only mode. CD and DVD drives have different hardware
    requirements. First, they''re identified as (/dev/sr0, /dev/sr1). You''ll also
    see them as read-only by default, if the drive itself is a burner.


    # Optical drives


    How you interact with discs depends on it. If the disc is recognized, it''s mounted
    in the folder /media/user, making it accessible through the Terminal as well as
    Nautilus. If it''s a data disc, it should open in Nautilus, allowing you to browse
    and access its contents.


    Other types – multipartition and writable discs – are handled differently. A pop-up
    window will appear when you insert a disc in Windows. Windows will ask if you
    want to open an application, which varies based on the type of disc you''ve inserted,
    and then offer you options for opening the disc in File manager.


    Your choice depends on what''s installed - Ubuntu comes with four apps that can
    do this: Rhythmbox (playing and recording audio CDs; watching DVD movies), DVD
    Creator (creating data discs, burning CDs and DVDs), and DVD burning, DVD copier.


    By default, Ubuntu cannot playback restricted formats, including encrypted DVDs.
    To play commercial DVDs, you will need the libdvdcss from the Software Centre
    – once installed, you''ll be able to play them, as well as third-party tools,
    including VLC Media Player.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_82_0.png)


    > Rhythmbox can extract audio from your CDs as well as play them back to you.


    # Burn discs


    Insert a disc, and you will be prompted to open DVD/CD Creator. This creates a
    mirror of the files onto the disc – Nautilus you can then give your disc a title
    and click ‘Burn to disc’ to start. Brasero is a powerful tool for burning discs.
    When launched (or you open the disc from the Dash) you can then select your project;
    you can create an audio CD, disc disc or DVD/DVD; there are also options for copying
    discs to a disc or burning image files (ISO, TOC and CIE). There''s also a built-in
    editor (Tools) for designing and printing a cover for a rugged CD jacket, plus
    you can easily erase errors by selecting them.


    > Quick tip

    nYou can also access MMC/SD cards in Linux. If the card is plugged directly into
    a slot (or you use it using a USB adapter), it will be identified using Disks
    in the same way as other media.


    Brasero is just one of many ways to drag and drop the files you want to add to
    your disc in the correct order. There are plenty of other burning tools too –
    to create a DVD video with menus and tryDVD, for example, or check out K3 for
    more general-purpose alternative.


    # Exploring Brasero


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_82_1.png)


    - Access order projects

    Choose File > Make a copy of your project before you''re ready to burn it. You
    can then return to it for further editing.


    - Project type

    Brasero allows you to burn kinds of audio, video, and data plus from image files
    and copy one disc to another.


    - File and folders

    These buttons allow you to add and remove files from your project, plus other
    context-sensitive tweaks while creating new folders for data.


    - File list

    Review the list of files, tracks or videos that you plan to burn – media tracks
    can be dragged and change their order.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_82_2.png)


    - Choose media

    Click this dropdown menu to switch between available drives or maybe a disc. A
    handy guide tells you how much free space is left.


    - Burn disc

    Once you''re ready, click the Burn button. It will speed, plus tweaks options
    like leaving the disc open. You can even burn enough copies if needed.

