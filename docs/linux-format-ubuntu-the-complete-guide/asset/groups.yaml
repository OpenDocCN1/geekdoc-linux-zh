    # System settings


    ## Hardware: Graphics card


    Let''s take a long look at the advantages and disadvantages of switching graphics
    cards and what actually entails. One of the most confusing aspects of switching
    from Windows to Ubuntu is how drivers - in particular graphics cards work. When
    you install Ubuntu on your PC, you will notice it appears to need the drivers
    for graphics to work perfectly, and indeed this is the case in many of these matters.
    They are designed to work just, which means that while these drivers aren''t interested
    (with the exception of games) in providing you with performance, word processing
    and editing items are perfectly adequate, but if you have a modern graphics card,
    and want to take full advantage of its capabilities - you''ll need to install
    these dedicated drivers provided by the manufacturers.


    This second set of drivers - with the exception of drivers for graphics - are
    closed source, which means while they''re still there to install, you''re having
    to rely on the manufacturer for support. If you''re using Ubuntu drivers are updated
    through Ubuntu tools, so you''ll need to update regularly with your system. Closed
    source - or proprietary - drivers rely on the manufacturer for updates to be delivered.
    The manufacturer may provide this functionality within the drivers themselves,
    or you may have to check the website to see if new drivers have been released.


    ## What''s available


    The major graphics cards manufacturers - Intel, NVIDIA and AMD/ATI - all provide
    their own Ubuntu drivers. If you plan to upgrade to the closed-source graphics,
    the first thing you need to do is identify your graphics card - particularly if
    you have no idea what it is. Select Settings, you''ll see a graphics section,
    but you won''t need to restart. Instead, open a Terminal window and type:


    ```

    lspci -k

    ```


    This list will list both manufacturer and model, which you''ll need in order to
    determine if a proprietary driver is available for your card.


    ## NVIDIA and AMD


    If you have NVIDIA or AMD graphics, then the quickest to check if a proprietary
    driver is available is opening System Settings, selecting ''Software & Updates''
    and checking the Additional Drivers tab. If it is compatible, you''ll see a short
    delay - a list of alternative drivers. Choose the one marked ''proprietary'',
    and then click ''Apply''. When the process completes, reboot your PC.


