    # ## Gtkpod (Apple iTunes)


    Got an iPhone or iPod? You might be worried that you can''t get iTunes on Linux,
    you won''t be able to sync your music with your device, but never fear, Gtkpod
    can help manage your iPhone and iPod library.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_2.png)


    # ## Amarok (Media Player)


    Do you use Media Player to just listen to music? Then you''ll want Amarok to help
    you organize and manage your digital music collection on your computer. It can
    also help you import and edit your MP3 files.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_3.png)


    # ## Evince Viewer (Acrobat reader)


    PDF is one of the most popular file types today. If Linux doesn''t have Adobe
    Reader, you''re not left out. Evince Document Viewer is faster, lighter and does
    everything Adobe''s software can. It''s also installed by default on many Linux
    distros.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_4.png)


    # ## K3b (CD/DVD writer)


    If you use Windows Explorer or a third-party program like Nero Burning to burn
    CDs and DVDs with your own data, then K3b is an excellent alternative that does
    the job as well, and once again it''s completely free.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_5.png)


    # ## OpenShot (Movie Maker)


    For any beginners out there – don''t worry about the lack of Windows Movie Maker
    or Sony Vegas and, because OpenShot is a versatile and powerful video editor that
    will help transform your home movies using Linux.


    # ## F-Spot (Image Viewer)


    For organising photos, tagging them, making light edits and sharing them with
    the world, F-Spot is the perfect replacement for Windows Image Viewer. It is the
    ideal program for photographers with hard drives battling to seize the seamless
    details.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_34_5.png)'
