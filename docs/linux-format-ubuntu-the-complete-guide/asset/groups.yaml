    **备份**

    这允许你为 Ubuntu 设置备份文件和设置的计划。当出现问题并你需要将机器恢复到之前的可用版本时，这非常有用。


    **电源**

    如果你在笔记本电脑上安装了 Ubuntu，那么电源设置至关重要，因为它们可以帮助你在未插电源时保护电池寿命和设备。


    **用户账户**

    如果你与其他人共享 Ubuntu 电脑，你可以为每个人创建额外的账户，让他们继续使用 Ubuntu 而不会弄乱你自己的设置。它还能让他们的文件和文件夹与你分开。


    ## 桌面


    我们将介绍如何让你的 Ubuntu 桌面焕然一新，并调整其设置以更好地适应你的工作方式，使其成为你的专属。


    ### 小贴士


    如果你不喜欢启动器（Launcher），可以使用 Ubuntu 抽屉（Ubuntu Dock）。要找到该工具，选择“应用程序”，选择“Stash”来将其隐藏并让它运行在屏幕底部。


    Unity 桌面与许多 Linux 桌面有截然不同之处，因为它没有尝试模仿带有任务栏和开始菜单的标准 Windows 界面。尽管如此，它有很多常见元素使其变得相当上手。


    至于你会进行什么种类型的调整，你无疑会想抛弃默认设置。其中一些调整可以通过 Ubuntu 自身的设置进行，但如果你发现它的限制太死，我们将教你如何让它更符合你的喜好。


    最显而易见的自定义方法是更改背景壁纸并更改其他桌面元素的颜色（如窗口和菜单）。进入“设置 > 外观”，你会看到用于控制颜色主题的 14 张图像（你可以通过点击
    + - 删除来添加自己的图片），以确保图片正是你想要的样式。你也可以点击“壁纸”下拉菜单选择纯色或渐变色，并先选择效果类型。


    你还会看到一个更改窗口和菜单栏主题及颜色的下拉菜单。有三个预设：选择其中一个将立即更新为你选择的主题。选择相对有限，但好消息是，通过使用外观（Unity Tool），这个强大的工具允许你执行此操作，并应用
    Ubuntu 设置不支持的其他自定义功能。


    你可以在网上找到很多其他的，一个很好的访问地方是 www.ubuntu.com。它需要注册来领取和下载主题，但大多数都是免费的，只需选择你喜欢的并添加到表中即可。完成后，点击包含主题文件的压缩包链接，你可以点击将其下载到“下载”文件夹中。


    压缩包的内容需要提取到 `/usr/share/themes` 文件夹——这需要高权限，因此打开终端并输入以下命令：


    ```

    $ sudo extract filename.tar.gz

    ```


    如果文件是 tar.gz ，请使用：


    ```

    $ sudo tar -xf filename.tar.gz /usr/share/themes

    ```


    如果你下载的是 zip 文件，请使用以下命令：


    ```

    $ sudo unzip filename.zip /usr/share/themes

    ```


    在两种情况下，请将 ''filename'' 替换为实际文件名。打开 Unity Tool 并选择：


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_27_0.png)


    将杂乱的窗口分散到四个（或更多）虚拟桌面上，以便于管理。


    ## Unity Tweak Tool


    如果你想将桌面自定义提升到新水平，请打开软件中心并搜索“unity tweak”。这个强大的应用程序让你对 Unity 的外观和行为有更强大的控制力。


    安装后，它与“设置”工具非常相似，一组选项分为不同的部分。选择“启动器（Launcher）”，你将看到“设置 > 外观”下的所有选项。你可以添加上面更多的项目（除顶部栏外）。选择“搜索栏”来同时调整桌面的外观和行为。你还可以更改“面板（Panel）”选项卡的外观，使其变为半透明，并选择元素出现在屏幕右上角。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_27_1.png)


    有一个专门用于窗口管理器的区域——选择“窗口吸附（Window snapping）”来确定当吸附到尺寸或角落时的行为。


    将杂乱的窗口分散到四个（或更多）虚拟桌面上，以便于管理。


    '
