  mdcn: '

    # 系统设置


    无论是准备更换硬盘，还是从安装纯净版 Ubuntu 从头开始，并开始爱上对系统进行备份。当你的驱动器出现时，从左侧菜单中选择它，可以在那里找到分区表并通过
    SMART 检查其健康状况。如果硬盘已经损坏，也不要慌，将下一次检查重点放在分区本身。大多数工具建议进行快速检查，但你可以使用 GParted 手动执行此检查，它是非常可靠的。


    GParted 让你看到分区的排列情况，并揭示哪一个是最好的。如果标记了标记，右键点击并查看“挂载”（Mount）。使用该工具安排检查。如果你点击“修复”并尝试恢复数据，请在点击后立即停止，如果分区尚未挂载。此外，请给它一些时间来完成——在某些极端情况下，这可能需要几小时或几天时间，并且几乎会损坏分区。确保对驱动器上的所有分区都运行检查。


    在大多数情况下，硬盘并没有损坏或无法修复；运行这些测试应该确保你至少能让 GParted 工作。


    | 恢复菜单（文件系统状态：只读） | |

    | --- | --- |

    | clean | 尝试释放可用空间 |

    | fsck | 在 fsck 中运行 |

    | failssext | 在安全模式下运行 |

    | fdisk | 检查并修复分区 |

    | network | 启用网络 |

    | root | 启动到 root（提示符） |


    Ubuntu 恢复模式让你在 Grub 工作正常时尝试各种修复方法，但有时 Ubuntu 并不希望这样做。


    # Grub 故障排除


    如果你发现 Grub 工作正常，但在尝试加载 Linux 时遇到问题，尝试通过按 Esc 键（或在某个点按 Shift）切换到详细模式。如果这没有帮助，记下：按住
    Shift 键调出 Grub 菜单并选择选项，然后选择“恢复模式”（root），这将引导你进入一个最小化环境，且文件系统以只读模式加载。如果成功，在几条滚动消息后，你将看到恢复菜单，提供以下选项：


    这些选项非常直观——如果你的硬盘满了，可以使用 clean 选项，而 fsck 可用于检查根文件系统。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_91_0.png)


    系统日志是故障信息的的重要来源——你可以通过磁盘的文件管理器或 shell 检查 /var/log 目录。使用 `dmesg` 命令查找特定条目。


    图形桌面可能无法工作——这基本上绕过了显卡驱动程序的问题，或者为你提供一个图形模式来排查问题。


    针对损坏的文件，这可以清除许多错误，特别是当你的 PC 崩溃且无法启动磁盘时。这里不使用 Grub——使用磁盘-启动工具中的恢复工具进入此选择，你将进行哪些更改。


    使用网络启用 root，并通过 root 选项进入 shell 提示符，允许你从那里修复问题，然后使用命令 `-mount rw /` 将文件系统挂载为读/写模式。


    你可以在启动过程中向 Ubuntu 传递临时参数，这在某些情况下会有帮助。在选择 Grub 操作系统，按 E 键编辑内核文件。删除以 `linux` 开头的行并添加参数。每个参数之间用空格分隔。


    当你满意时，将它们添加到此处——换句话说，它们将在下次启动时修复问题，这样你可以找到有效的解决方案，然后——如有必要——通过编辑 `/etc/fstab`
    文件使其持久化。


    你还可以使用 Boot-Repair 工具向 CD 环境传递参数以添加内核选项，这包含 15 个参数。


    # 进行安全备份


    虽然这听起来很奇怪，但在尝试进行安全备份之前，你应该尝试在故障前对驱动器进行备份——这意味着如果硬盘故障，你可以回滚到它最初主控的状态。


    如果你不确定并需要定期备份系统，你可以始终简单地一次一次回滚。如果你的主文件夹与 Linux 安装在同一个分区上（Ubuntu 安装的通常如此），


    你需要制作备份——使用 USB 连接的硬盘——并使用一个可以获取系统完整镜像的工具。Ubuntu 和 Boot-Repair 工具的 Live CD 中包含的磁盘镜像工具提供了你所需的备份，但容量至少要与你的硬盘一样——最好更大。


    复杂流程的最后一步是 Redo Backup & Recovery。你需要带有该软件的 CD 或 USB 盘来运行它。它提供了一个易于遵循的指南界面。如果你在
    www.redobackup.com 使用它——或者在选项覆盖中使用：


    | 备份 | 步骤 2：选择要保存的分区 | |

    | --- | --- |

    | 硬盘的所有分区 | 仅想要保存的硬盘分区 |

    | /dev/sda1 (512 MB) | /dev/sda1 (512 MB) |

    | /dev/sda2 (15 GB) | /dev/sda2 (15 GB) |

    | /dev/sda3 (450 GB) | /dev/sda3 (450 GB) |


    Redo Backup & Recovery 提供了最简单的方法来对整个硬盘进行安全备份。


    # 系统设置


    可以帮助故障排除。这些示例包括 `acpi=off`，它禁用了已知会导致内存报告或系统冻结的 ACPI。


    # 安装


    如果你进入选择菜单，将看到一个新选项：Install Ubuntu（安装 Ubuntu）。此选项用于在主文件夹上重新安装 Ubuntu，但关键设置可能会丢失。你可能还会看到允许编辑
