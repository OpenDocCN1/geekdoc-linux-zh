    # 安装 Ubuntu


    只有亲身体验才会爱上它，但你将感受到它的力量。


    说出“安装 Linux”这个词会让大多数人脊背发凉，但它并没有像你想象的那么可怕。不要过度紧张；如果操作不当，你仍然可能会抹除你现有的操作系统，而且你会在安装
    Ubuntu 之前，花几个小时时间尝试通过 Ubuntu 卸载掉错误的系统。


    你需要一个 2.5GB 的磁盘镜像 (ISO) 文件，你可以使用任选的软件将其写入 DVD（例如：macOS 上的 Toast、Windows 上的 CDBurnerXP、Linux
    上的 Brasero）。我们知道现在很多电脑和大多数笔记本电脑都有光驱器，但这没关系——镜像可以写入 USB 闪盘中，这可能速度更快，而且肯定优于从 DVD
    启动。有像 Unetbootin 这样的程序可以自动下载并以各种方式进行设置，但我们更倾向于保持简单：使用跨平台的 Etcher。从 https://etcher.io
    下载它，启动它，插入 USB 闪盘（确保里面没有重要数据），然后你就……


    ## 使用镜像

    ## “我们知道大多数笔记本电脑没有光驱器，但这没关系——镜像可以写入 USB 闪盘中。”


    在进入 Ubuntu 之前，你需要弄清楚如何让电脑从 USB 或光介质启动。你有两个选项：一个是打开任何提供的启动菜单（Boot Menu）——并非所有都支持——使用的键有
    F9、Del 和 F12；旧式/基于 BIOS 的系统使用 F8，UEFI 系统使用 F1。你需要在切换到系统后缓慢敲击该键。选择 CD-ROM/光驱器并按回车。如果你准备好了，就可以！


    如果没有出现菜单，另一个选项是在 BIOS/UEFI 设置中选择启动设备顺序。系统启动期间会显示一条消息，询问按哪个键。就像启动菜单一样，按下 Del（最常见）、F1、F2。


    下载 Ubuntu 并安装任何你熟悉的操作系统。打开浏览器并访问 https://www.ubuntu.com/desktop/ 并点击“下载”按钮。如果你觉得很大方，也可以向
    Canonical 捐款来帮助我们。这是可选自愿的。我们建议在下载完成时泡杯茶。你现在应该有一个我们……


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_17_0.png)


    ## 安装 VirtualBox


    ### 获取 VirtualBox

    访问 www.virtualbox.org 并下载适用于你操作系统的 VirtualBox 6。安装它，并确保你有至少 8GB 的空闲磁盘空间来存储 Ubuntu
    ISO 文件。你还需要从 https://www.ubuntu.com/desktop/download 获取 Ubuntu ISO 文件。安装完成后，点击“新建
    (New)”按钮并将其命名为 Ubuntu。


    ### 创建虚拟机

    选择 Ubuntu，位宽应与你下载的 ISO 匹配，然后点击“下一步”。如果你有足够的内存，除了硬盘大小外，可以保留所有默认设置。8GB 足够了，但如果你可以的话，我们建议至少
    32GB。完成并点击“启动”开始。


    ### 启动虚拟 Ubuntu

    提示会要求你选择磁盘——找到 Ubuntu ISO 文件并点击“启动”。Ubuntu 将启动，一旦你加载了 ISO，就使用它在虚拟机中正确安装。为了长期使用，在虚拟机设置的“显示”下，你将启用
    3D 加速；16MB Esc 或某个“特殊”维护键可以进入 BIOS，找到“启动设备”菜单并确保 DVD/光驱器位于列表首位。保存并重启！你可以无风险地探索安装，为了获得最高性能，可以使用方便的六步指南将
    Ubuntu 安装到你的硬盘或 SSD；如果你有多个设备，我们建议按照第一、二步将 Ubuntu 安装到自己的设备，而不是 Windows 分区。一切运行良好，而且可以复制那些步骤，你接触了足够久，知道事情并不总是如所愿的那样。在继续之前备份任何重要数据。如果你有空硬盘，选择它并在第四步中使用“彻底安装
    Ubuntu (radical install)”选项。非常简单。如果你想稳妥起见，另一个选项是使用 Oracle 的 VirtualBox 和下方的指南将
    Ubuntu 安装到虚拟机。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_0.png)


    点击 BIOS F8


    - 现代 UEFI 界面应该会让更改启动设备变得容易。它甚至允许你截图，坦率说这简直是魔法。


    # 在 Windows 下安装 Ubuntu


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_1.png)

    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_2.png)


    ### 留出空间

    为了为 Ubuntu 安装创建一个空分区，你需要压缩现有的 Windows 分区。在 Windows 中打开“磁盘管理”工具，你的主分区通常分配为 C 盘。然后右键点击并从弹出菜单中选择“压缩卷
    (Shrink Volume)”。


    ### 缩小 Windows

    弹出收缩对话框，显示总容量。


    ### 更新和插件

    在电脑启动后，通过此界面查看可用的复选框：第一个从互联网获取可用更新，另一个是插件。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_3.png)

    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_4.png)

    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_18_5.png)


    ### 使用剩余空间

    在标记为安装的屏幕


    # 桌面深度解析

    这里是关于 Ubuntu 的快速指南。


    从 Windows 或 macOS 转过来，起初可能会很困惑。但别担心，你很快就会习惯。


    标准安装包含了你所需的一切，并尽量避免你不需要的东西。这节省了大约一半的空间。


    以后你想添加一个或多个应用程序，最简单的方法是通过软件中心（看起来像橙色的那个）。使用 Gnome Tweaks 工具，它允许你自定义桌面的外观和行为。根据你的喜好，这可能不存在，或者在你第一次点击此视图时显示已安装应用程序的网格。


    > > 如果你无法禁用 Firefox，可以学习将其包含在这个 插件内。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_19_1.png)


    ## 获取 Gnome...


    - 1 活动 (Activities) 点击（或按下 Super 键）将启动活动视图。非常有帮助，它显示了运行中的程序。


    - 2 搜索 (Search) 在活动视图中开始输入（无需点击框）即可搜索应用、文档等更多。


    - 3 日历和通知 点击此处可以控制音乐、查看所有通知（如果你有预约）或激活勿打扰模式。


    - 4 状态菜单 网络设置（包括 VPN）、音量控制和应用程序指示可以在这里找到。底部的按钮会启动所有重要的设置。


    - 5 应用程序菜单 点击此处可以打开/查看常用的应用程序。你可以通过菜单底部的选择器使用已安装应用程序。


    - 6 停靠 (Dock) 从这里启动你喜欢的应用程序。右键点击运行中的应用程序（带有圆点）可以将其添加到程序坞以便方便访问。


