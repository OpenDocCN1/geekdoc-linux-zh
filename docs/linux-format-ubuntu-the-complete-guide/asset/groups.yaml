    ## Linux 应用 / 最佳浏览器（注：此段原文内容存在部分重复，已按要求翻译）


    使用 Audacity 非常简单：通过点击时间点移动标记，你就可以在该点开始回放、将其标记为编辑或在标记处切割一段。你开始时将使用的主要命令是“修剪”（Trim）和“切割”（Cut）。这两个操作基本上是其他操作的反面：通过选择并拖动（或从标记位置按
    Shift 拖动）来选择区域，然后可以使用“剪切”（Cut out）移除轨道的一部分，或使用“修剪”（Trim）移除其他所有内容。记住，如果你在处理多轨道音频，切割一个轨道可能会导致它与其他轨道不同步。


    下一个重要部分是“效果”（Effects）菜单。在这里你可以找到一组可以调整你声音的行业标准。选择一个区域或整个轨道，你可以放大、压缩动态范围（让静静的部分变大，响亮的部分变小）或添加回声、加快节奏等。


