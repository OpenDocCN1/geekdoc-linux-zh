    # Thunderbird:

    Email made easy


    Set up your own free email client and keep your messages and contacts safe at
    hand rather than losing them in the cloud.


    Email is one of the internet''s oldest technologies. It outdates the web, it outdates
    instant messaging and it even outdates the internet''s predecessor. Arpanet, MIT,
    so often the innovator in those started using software called Mailbox and SMsgMg
    to leave messages. We believe email was introduced to route mail to specific computers
    during the development of Arpanet in the early 70s; by 1974 the US was a military
    hero, and by 1978 75% of all Arpanet traffic was email. You could easily receive
    credit to email for an account. This was a closed-system technology that the protocol
    couldn''t talk to.


    We spend money on having at least one email address, and if you''ve been around
    a while you probably have. Most emails have some kind of web interface for accessing
    your inbox and sending new messages. But is having your internet connection the
    best way to manage your mail? Say if your inbox, stored entirely online, will
    be completely inaccessible. No matter how many old messages to remind you of this,
    this is not appropriate.


    Security should be a concern. How do you trust your web provider not to sniff
    your messages?


    What happens if your email provider goes bust, or a hacker forces their way in
    and changes your password? These, and many other reasons, why does it make sense
