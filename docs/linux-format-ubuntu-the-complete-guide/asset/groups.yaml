    如果你的连接完全无法工作，你可以采取一些简单的步骤来解决问题。如果你之前使用过无线网络，首先检查它是否也连接到了 VPN。确保以太网和 WiFi 都已启用。你也可以使用网络管理器检查连接到正确的无线网络。只需点击任务栏上的图标并确保你的
    VPN 热点旁边有一个勾选。此操作可能会被不安全的 WiFi 网络阻挡。


    如果你使用 USB 设备进行无线连接，尝试拔掉它并插入另一个端口来重置它，因为许多电脑具有组合端口可以执行此操作。


    如果你通过网络访问文件夹并使用用户名和密码（通过 Samba 共享服务器），你可能需要文件夹或文件具有写入权限。这些选项需要在联网的机器上启用。


    在 Ubuntu 上，使用“高级共享设置”（Advanced sharing settings）。按照 https://support.ubuntu.com/community/en/HT20445
    上的应用支持步骤操作，以获得无需提示密码的读写文件的权限。注意，Ubuntu 没有密码文件，因为在执行网站上的后续步骤时，使用 SMB 非常重要。


    > 你需要网络名称和用户凭据供用户连接


    打开网络管理器，在搜索栏中输入 networks，然后点击左侧的 VPN 选项卡（如果你有多个无线设备，且其中一个未被选中，请点击它将其标记为热点）。你将看到一个警告，询问你是否要创建热点。


    WiFi 热点使用 WEP 进行安全，这对于敏感数据被认为是不安全的，因此在作为 WiFi 热点使用之前，请确保你不在该机器上。


    ## 编辑连接


    Ubuntu 支持多种网络连接，如蓝牙、DHCP 和 VPN。如果你不知道如何使用它们，或者如何添加连接，点击右侧的网络图标查看所有可用网络。点击“添加”（Add）按钮。如果你想连接到
    VPN，有几种类型。默认情况下 Ubuntu 支持 PPTP（点隧道协议）。通过以下方式添加连接，你可以运行：


    ```

    sudo apt-get install network-manager-openvpn-network

    ```


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_84_1.png)


    连接后，重启电脑。选择你的连接类型，然后点击连接。


    如果你想连接到 VPN，有几种类型。默认情况下 Ubuntu 支持 PPTP（点隧道协议）。通过以下方式添加连接，你可以运行：


    ```

    sudo apt-get install network-manager-openvpn-network

    ```


    连接后，重启电脑。选择你的连接类型，然后点击连接。


    如果你想连接到 VPN，有几种类型。默认情况下 Ubuntu 支持 PPTP（点隧道协议）。通过以下方式添加连接，你可以运行：


    ```

    sudo apt-get install network-manager-openvpn-network

    ```


    连接后，重启电脑。选择你的连接类型，然后点击连接。


