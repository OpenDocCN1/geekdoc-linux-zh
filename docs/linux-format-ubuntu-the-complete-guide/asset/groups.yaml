    ## Displays: Set all your screens


    The basics of configuring your monitor options such as resolution, visual effects,
    savers and more.


    Ubuntu is designed to be easy to set up and settings for your display make for
    a user-friendly experience. However if you wish to optimise Ubuntu, you should
    first click on Search and go to Appearance. Here you can choose from various built-in
    desktop backgrounds. If you have downloaded your own background from the internet,
    you can also use this. Simply place your image in Pictures folder and from the
    drop down in Appearance, click Wallpaper to change your choice.


    Another tweak you can make here is to change your theme as the system appears.
    Change windows theme to the lighter radiance. You can also choose the High Contrast
    theme which might be useful for impaired users. Use the slider marked Launcher
    Icon Size to increase the size in your launch bar.


    ## Ubuntu Screens


    More versions of Ubuntu don''t come with new screensavers built in. The monitor
    will switch off after certain length of time. You can also change these by going
    to System Settings > Brightness and Lock.


    The screen will dim to save power after five minutes of inactivity.


    > By default Ubuntu will cycle through screensavers; you can choose only one if
    you wish, that means when you return to your machine you may cycle when you need
    to pass your password to access your desktop.


    Most modern monitors and televisions are LCDs and do not suffer from the problems
    of old CRT screensavers getting burned into a screen if it has been blank for
    a long time.


    If you prefer to see something more annoying on your machine than a blank screen
    you can remove it by installing this. First click and search for the Terminal
    application. Removing the screensaver in the following order:


    ```bash

    apt-get remove-screensaver

    screensaver xscreensaver-data

    ```


    You will be asked to enter your password to confirm that you want to remove it.
    Do this once first. Next type Y to confirm that you wish to remove this program.
    This will only take a few minutes. Now you type the following command to install
    the new screensaver with a colorful selection of savers:


    ```bash

    apt-get install xscreensaver xscreensaver-data

    screensaver-gl

    ```


    Hit Y once and wait for the text to scroll past. Click the button and then the
    new screensaver will launch.

    You will see a variety of different screensavers in the box on the left side of
    the window. Feel free to scroll them and click the Preview button to see what
    they would look like. As you will see from the Dropdown Menu the default setting
    is Ubuntu cycle through the available screensavers randomly, you have the option
    to choose one screensaver once or never to turn off if you wish.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_0.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_1.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_77_2.png)


    - Use the application to change your Wallpaper and Theme.


    ## Multiple Monitors


    ## System settings


    To monitor monitor with your device, first of all connect to it and log in to
    the Ubuntu Desktop. Click on the status bar and select Displays. Click your secondary
    monitor and use the rocker switch to turn it on or off. If you are unable to see
    your monitor by clicking the Displays icon Once your secondary monitor is enabled
    feel free to drag it to the position of your choice. You may have to identify
    with your current display. You may also choose to Mirror Displays if you prefer
    to show them the same content if you are giving a presentation. This may limit
    your resolution options if the displays have different capabilities. We default
    the Launcher on every display. Click All Displays to show a primary monitor if
    you prefer. Disable edges feature which prevents you from moving your mouse onto
    the other monitor. When your mouse reaches the edge of one screen it will need
    an extra push to move to the other. By default this is switched on; hit the rocker
    switch if you want to turn it off.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_0.png)


    - Multiple displays!


    Click the checkbox next to lock the password when dismissing the screensaver.
    If you want to tune your power settings check the Advanced tab and check Power
    Management or switch off your display after a certain amount.


    ## Resolution and Rotation


    The resolution display is the simple number of pixels that can be displayed on
    your monitor, expressed with width and height 1024x768. Ubuntu will try to detect
    the best resolution for monitor but you may change this if the display is too
    small.

    Click the Display button and this will allow you to change various aspects of
    your display including the resolution. Click the menu to move the screens as you
    wish them to the left or right. Below the menu you can change rotation of the
    screen setup. You can also use the slider to adjust the size of task bars. See
    Multiple Monitors for more help:


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_1.png)


    The refresh rate is the simple number your monitors are measured. For normal displays
    a value of 60Hz is standard and Ubuntu should automatically detect the optimal
    rate. If your monitor supports rates up to 144Hz you may want to select it here
    by the manufacturer. The easiest way to view and change refresh rate is to install
    config-plugins from the Ubuntu Software Centre Once installed click the icon to
    open it.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_2.png)


    ## Visual Effects


    As mentioned the config-plugins is an advanced tool and allows you to do more
    than just refresh rate. It also governs visual effects, windows and more.


    > The Wobbly Windows effect is not enabled by default unless you choose it directly
    to enable the effects. It''s not necessary to have this but it can make your desktop
    look and feel better. To explore the full range of options run your terminal and
    execute the following command:


    ```bash

    sudo apt install desktop-plugins-extra

    ```


    Once installation is complete open config-plugins Manager and check the options
    on the left side. If certain effects are already enabled such as windows feel
    free to experiment with the effects:


    ## Displaying


    As stunning as the effects they will place a greater strain on your graphics which
    can be an issue for older computers. The aforementioned Ubuntu tweak has a handy
    button for resetting your settings to default. You can also use config-plugins
    to disable effects effectively.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_78_3.png)


    - You have 30 seconds to set an incompatible screen


    If you are having issues with graphics overloads switching to a variant of Ubuntu
    that uses LXDE (Lightweight Desktop Environment) is a much simpler desktop and
    needs less resources. See ubuntu.net for information.


    ## Sound: Tweak your audio


    Explore Ubuntu''s sound settings as well as how to connect external speakers and
    make everything sound perfectly.


    In this section we will explore how sound is managed in Ubuntu and how to connect
    external speakers and microphones. We will also discuss suitable programs for
    recording and playing back audio as well as troubleshoot issues. Ubuntu''s sound
    is managed by a program server which sits between your various programs and sound
    hardware. PulseAudio is known as sound hardware capable of mixing several together
    or playing to multiple devices at once.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_79_0.png)


    For most users volume works out of the box after installing Ubuntu if you wish
    to connect external speakers or adjust settings for individuals you may need to
    access Sound Settings.

    Volume is adjusted in Ubuntu by clicking on the sound icon in the menu bar to
    move the volume switch to the left or the right. If you do not see the Settings
    menu use the search bar to find Sound Settings.

    Some keyboards also have volume controls. Hold the Fn key before pressing the
    volume keys to adjust the volume.

    The sound settings also allow you to choose your output device. Simply click on
    the left hand of the window. If you use earphones or speakers a form will simply
    display settings.

    Depending on the speaker setup you may have this opportunity to adjust the various
    settings for speakers. The sound sliders which they have are fairly self explanatory
    allowing you to adjust the balance, fade and underneath.


    ## Volume and playback


    > As the Output tab you can choose your device from the pane on the left hand
    side. Adjust the volume using the slider switch.


    The Applications tab in Sound Settings is extremely useful as it allows you to
    adjust the volume for individual programs. If you are listening to music while
    using the browser, you may want not to hear the commentary from news videos, so
    you can mute the web browser.


    ## Input devices


    Settings for devices like USB microphones or webcams with internal connections
    can be accessed from the Input tab in Sound Settings. In the same way as for the
    speakers input devices via USB will be listed. Simply click with your mouse to
    mute recording moving forward.


    Take some time to look at the Settings for Microphone. It is helpful to see how
    volume will change the sensitivity. It is simply displayed in the Input level
    bar.


    At the bottom of the Sound Settings, you can choose Show Volume Level in the Menu
    Bar. This is ticked for any reason to be able to access sound settings easily
    in future.


    If you need to record short audio clips with music, use Sound Recorder from the
    Ubuntu Software Centre. It is very basic but you will need to record and play
    back short clips.

    If you need more featured audio recorder e.g. for recording podcasts or filming
    your recordings, consider downloading Audacity. This has many features. Visit
    www.ubuntu.com/package/acity/ and click the red button APT install the installation.
    Ubuntu''s bundled music player is Rhythmbox. It has all the basic functions of


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_79_1.png)


    - Quick tip

    - If you are playing music through the Firefox browser, you can click on sound
    in open tabs by clicking the loudspeaker icon beside the small ''X''.

    - Once the Sound Settings menu is open, click Sound to find a launcher that will
    provide placeholders for each of your speakers left front and right.

