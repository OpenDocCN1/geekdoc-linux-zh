    # 帮助：如何解决问题


    某些功能无法运行？哪里坏了？或者有什么让你感到困惑？Linux 社区可以为你提供一些自助帮助。


    开源软件和 Linux 是由开发软件的人、编写和维护我们使用的文档的人共同组成的，这些人以及更多人聚在一起形成了一个围绕软件的社区。这通常包括常见问题解答、软件的标准文档、社交网络账户等。这意味着，如果你在使用标准功能时遇到问题、某些功能不符合你的要求，或者你想建议新功能，都有特定的地方和方法可以实现，并且每种方法都有说明。


    当然，没有人喜欢总是要求改变的人，在开源领域更是如此。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_93_0.png) 并不是人们不想帮助，而是如果问题已经有了答案，或者你从未查看过是否已经报告过错误，或者你追求的细节是别人会先指出的而不是直接提供帮助。


    # 使用 Ubuntu


    我们的首要求助点是关于如何使用 Ubuntu。如果你在本指南中发现很多帮助提示，我们建议关注我们在所有 Ubuntu 商店以及 http://bit.ly/LXFS
    销售的《Ubuntu Made》指南。Ubuntu 提供了基础帮助、帮助 键以及“帮助中心”（help to common）。


    这提供了一个基础指南，帮助你浏览 Ubuntu 的程序和部分，以及如何绕过和修复常见问题。如果你在使用 Ubuntu 时遇到问题，这应该是首选求助途径。如果你在使用
    Ubuntu 内的特定程序时遇到问题，你应该关注每个应用程序提供的帮助。


    Ubuntu 内置的帮助是在使用任何程序时按下 F1，然后“帮助 > 内容”菜单将包含 Ubuntu 提供的所有内容。这是你在使用单个程序时需要使用的。使用
    Ubuntu 工具时的一项新帮助元素是 YouTube，这是一种现代趋势，许多人发现很容易跟随，那里有关于 Ubuntu 和 Linux 各方面的指南和导师教程。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_93_1.png)


    - 难以确定问题哪里出了问题？尝试内置的


    # 终端帮助


    我们将查看终端，如果你打算更多地使用 Linux 并想为此做好准备，你现在就必须学会如何使用它。事实是，你的终端将由他人提供的行所填充，所以你应该学习它。通过这一点，获取终端的帮助非常简单，无论系统多么复杂，我们现在都会解释如何使用它们。


    在使用任何命令时，`<command name> --help` 适用于 Linux 命令。它是对命令作用的简单说明、它预期的基本输入以及你可以使用的选项列表，且每个选项都有术语化的解释。


    如果输出文本太多，可以通过类似 `less` 的命令处理输出，以便你更方便地滚动文本。你可以通过输入 `<command> --help` 配合 `less`
    列表来实现。


    要对主命令进行更详细的解释，只需输入 `<command name> --man` 即可显示帮助手册，你可以用它获取更多帮助。使用许多交互式程序可以提供使用终端的入门指南，这包括你每天需要的基础命令。


    寻找帮助的另一种方法是使用 `info <command>` 终端选项，它对命令的作用、你可以使用的内容以及各种选项提供了更详细的文字描述。


    ```bash

    $ ls -l

    ```

    列出当前目录下的所有文件。


    ```bash

    $ ls -a

    ```

    列出所有文件，包括隐藏文件。


    ```bash

    $ ls -la

    ```

    以长格式格式列出所有文件，包括隐藏文件。


    - 对初学者来说很难使用，但终端内有大量的帮助。


    94 | Linux 展示：Ubuntu


    # # 搜索帮助


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_94_0.png)


    ## 关键词


    使用最少的单词，坚持与你的问题最相关的词。


    ## 仅搜索标题


    我们建议只搜索标题，这有助于极大缩小返回帖子的数量。


    ## 在论坛中搜索


    另一种专注于搜索的有效方法是仅包含相关的论坛。


    当然，当你转向在线时，第一站应该是 [https://help.ubuntu.com/community](https://help.ubuntu.com/community)
    帮助，在那里你会找到发现过的所有内容的在线版本。顶部的社区帮助链接将带你进入一个由社区贡献者维护的更有帮助的区域。


    此首页提供了其他资源列表，帮助你找到指向不同在线论坛的链接。


    AskUbuntu 是一个让人们提问并获得回答的网络系统。它可以帮助你的优质答案获得推广以获得早期曝光，但在你发布问题后，请搜索一下你的问题是否已经有了回答。


    如果你需要找到无法直接访问的网站链接，我们有基于网络的 IRC 系统，例如 [https://webchat.ubuntu.net](https://webchat.ubuntu.net)，你可以在那里加入
    #ubuntu 频道，可能会在那里找到愿意回答你问题的人。


    另一个可以提供支持的区域是 Ubuntu 论坛或其他资源中的修复问题数据库。Ubuntu 论坛已经运行了 12 年多。


    '
