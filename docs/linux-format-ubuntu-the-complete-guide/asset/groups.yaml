    ## Ubuntu 看起来是什么样的？


    桌面搜索

    此系统搜索是您查找和访问更多程序和其他文件的方式。你可以进行过滤，甚至进行在线搜索。


    启动器（Launcher）

    启动器贯穿整个桌面，并运行当前中的程序。你可以添加和删除项目，并调整图标大小。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_10_0.png)


    设置

    你可以通过这个实用的系统轻松地访问大多数系统设置。


    文件

    仍然可以通过文件管理器系统访问文件和文件夹。文件系统比 Windows 更复杂；请留在主文件夹。


    ### 桌面

    就像 PC 桌面一样，Ubuntu 也是。你可以随心保持整洁或混乱——就像 Windows 或 macOS 一样——并选择你自己的桌面。


    在你的 PC 上工作和运行 Linux 的软件，它提供了 Ubuntu 软件，此外还有 Firefox 浏览器、LibreOffice 办公套件、Gimp
    绘图应用等。它是一个发行版，将软件包和丰富的软件库整合在了一起。


    这之所以可能，是因为开源软件：Linux 内核基于此开发，Ubuntu 发行版基于此创建，而开源包含了所有免费发布的程序。


    开源是软件自由的关键；这意味着我们应该自由地使用计算机，而不依赖于任何单一供应商或来源出版者。这初看起来是一个复杂的概念，特别是如果你习惯了微软和苹果处理问题的方式，但你可以摆脱任何限制并开始按照你想要的方式使用计算机。它本应有的样子——这真的非常令人兴奋。


    随着时间的推移，当你开始使用 Ubuntu 时，你会发现如何进行调整。如果你已经在运行 Windows 系统，如果你确实有一个 Windows 系统，你有两个选择：抹除重装，或者在
    Windows 旁边双系统安装 Ubuntu，同时保持你的文件完好。如果你的系统有空间，后者更好，而且可能可能是 Linux 新用者的最佳选择。


    一旦你运行起来，Ubuntu 让你能够访问成千上万的免费开源软件。你本可以为 Windows 或 macOS 购买的任何产品的许多功能都能实现，许多功能甚至超越了它们。你还会发现你所需的软件范围（更多信息请参阅第
    34 页），并涵盖了编程、数学、物理、引擎等各个领域。


    最后，重要的是记住 Ubuntu 并不是唯一的 Linux。还有许多其他发行版供你实验，尝试几个不同的选项以找到最适合你的一个。我们今天在这里使用的是专为桌面系统、互联网服务器、服务器网络、嵌入式物联网设备、平板电脑等定制的系统。所以你还在等什么？


    > 这是一个复杂的概念，但你可以摆脱任何限制


    ## 开始使用


    ### Ubuntu：快速安装指南


    Linux 并不不可怕也不难。老实说，你能在 4 分钟内运行起来吗？谁会骗你呢？别回答……


    老实说，现代 Linux 比任何最近发布的 Windows 版本都更容易安装、速度更快且麻烦更少。事实确实如此。不需要折腾密钥，不需要担心或翻找那张安装 CD
    或 USB 盘。Linux 的美之处在于，如果你有光驱驱动器并能在几分钟内说服你的 PC 从 Linux 启动，任何人都可以下载并立即开始使用。你甚至不需要安装任何东西！Linux
    技术免费易用的许可意味着它可以直接从 CD 或 DVD 运行。它不像你希望的工作那么快，但它是快速尝试任何东西的理想方式。只要是关于安装或尝试其他任何事情。


    也许你想要更多一点的？如果你尝试过 Ubuntu 并发现它不适合你，那么很容易找到另一个适合你的 Linux 发行版。自动缩小 Windows 来安装 Linux
    也可以同样简单。如果这听起来太复杂，为什么不使用虚拟机呢？我们可以在 Windows 上像这样一样运行 Ubuntu。Linux 的另一个优势是它完全不需要
    Windows 那样的空间。内存空间大约 7GB，但对于尝试来说，10GB 已经足够。


    ## 运行 Linux 的简单方法


    如果你对 Linux 不感兴趣，那么你可能不想破坏 Windows 或 Mac。Linux 足够灵活，可以以多种方式运行：此外，在大多数其他操作系统之上，以及在大多数硬件上，甚至包括
    USB 盘或 DVD。


    从 DVD 启动是运行 Linux 和 Ubuntu 最简单最快的方法。在这里，运行 Ubuntu 只需要花几秒钟，不过这可能会变得更简单。如果你的系统没有自动运行
    DVD，请按快捷键打开启动菜单，从中选择 Ubuntu 启动。


