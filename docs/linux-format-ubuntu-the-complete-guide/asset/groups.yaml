    # Linux apps


    # Rhythmbox: Playing media


    Get your music blasting from players and speakers-oriented, then watch some videos
    too, it''s all in a day''s work for Ubuntu!


    Remember the days when you had to buy CD players with built-in radios, or cassette
    tapes for listening to your music? You''re not alone. When it''s possible to carry
    a world''s worth of tunes on your phone, and stream audio to your TV or internet
    wirelessly, why would you ever invent such things?


    We''ll always need a good music player on their desktop. Whether it is to enjoy
    music or internet radio while you work, or to watch a movie while travelling,
    digital media should be enjoyable wherever you are.


    And fortunately Ubuntu has all the tools you need. If you''re coming from Windows,
    there is one key adjustment you have to make. Windows operating system uses Windows
    Media Player, which is a hub for both music and video playback from a back source
    - like a hard drive or USB key - a networked drive. Ubuntu has separate applications
    for video and music playback.


    For music, Rhythmbox, which allows you to manage audio media, stream from various
    sources and rip CDs directly to your drive. For example, Rhythmbox appears in
    the Ubuntu launcher under the name Rhythmbox.


    # Living in Rhythmbox


    As far as audio goes, Rhythmbox is fully functional to do you need. It can be
    used to play music from a local library,


    rip CDs, add album art to digital files automatically, purchase songs and stream
    from another PC or network attached storage. Rhythmbox, however; there''s one
    important thing you need to keep in mind. By default, Ubuntu doesn''t include
    the code to decode MP3 format because many parts of the MP3 code are still protected
    by patents. MP3 distributions are available to use without paying for a license
    fee.


    For video, just look up the Ubuntu Software Centre and search for ''Rhythmbox
    Extended''. If it''s not installed, click there and download it to your PC until
    you are left alone.


    Once installed, the first time you use it you''ll want to point the place where
    you keep your songs stored in order to build your music library. Open the Edit
    menu, then Preferences, then point Rhythmbox to your music library if it exists,
    then click the button in the top bar


    library for new files! Now any songs and albums in your library will appear in
    Rhythmbox, and you can rip a CD purchase through Rhythmbox or add music from a
    local player it will be saved to the same physical place.


    You''ve got these options to select the format and quality for ripping music,
    also for the naming convention you prefer in favorites that are automatically
    generated.


    Once you''ve started some music stream, the main view of Rhythmbox is fairly straightforward
    (see about below). You''ll notice the column on left is pretty sparse with some
    basic library options for selecting music, podcasts (about) or internet stations.
    You can also see what''s coming in the play menu.


    To adding extra options like this, you''ll need to visit the Plugins menu, which
    you''ll find if you click on Tools


    Rhythmbox comes with extra features which are disabled by default. In this menu
    you can turn extra things like Last Fm scrolling and the Jamendo music store,
    but you can get more with ease.


    The one essential plugin to install is the Gr suite, which will enable you to
    stream from other computers and libraries on your network. If it isn''t already
    installed, open the Software Centre and search for grillo-plugins, then install


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_35_0.png)


