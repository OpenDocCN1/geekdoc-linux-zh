    # System settings


    # Hardware:

    Graphics

    card drivers


    Let''s take a long look, hard at the advantages and disadvantages of switching
    graphics cards and what actually entails.


    One of the most confusing aspects of switching from Windows to Ubuntu is how drivers
    - and in particular graphics cards drivers work. When you install Ubuntu on your
    PC, you will notice it appears to need install the drivers for graphics to work
    perfectly, and indeed this is the case in many of these matters.


    They are designed to work just, which means that while these drivers aren''t interested
    (with the exception of games) in providing you with edge performance, word processing
    and editing items are perfectly adequate, but if you have a modern graphics card,
    and want to take full advantage of its capabilities - for gaming you''ll need
    to install these dedicated drivers provided by the manufacturers.


    This second set of drivers - with the exception of drivers for graphics - are
    closed source, which means while they''re still there to install, you''re having
    to rely on the manufacturer for support. If you''re using Ubuntu drivers are updated
    through Ubuntu open tools, so you''ll need to update regularly with your system.


    Closed source - or proprietary - drivers rely on the manufacturer for updates
    to be delivered. The manufacturer may provide this functionality within the drivers
    themselves, or you may have to check the website to see if new drivers have been
    released.


    # What''s available


    The major graphics cards manufacturers - Intel, NVIDIA and AMD/ATI - all provide
    their own Ubuntu drivers. If you plan to upgrade to the closed-source graphics
    drivers, the first thing you need to do is identify your graphics card - particularly
    if you have no idea what it is. Select Settings, you''ll see a graphics section,
    but you won''t need to restart. Instead, open a Terminal window and type:


    ```

    lspci -k

    ```


    This list will list both manufacturer and model, which you''ll need in order to
    determine if a proprietary driver is available for your card.


    # NVIDIA and AMD


    If you have NVIDIA or AMD graphics, then the quickest to check if a proprietary
    driver is available is opening System Settings, selecting ''Software & Updates''
    and checking the Additional Drivers tab. If it is compatible, you''ll see a short
    delay - a list of alternative drivers. Choose the one marked ''proprietary'',
    and then click ''Apply''. When the process completes, reboot your PC.


    Don''t be surprised if your card isn''t listed - then it''s unlikely to be supported.
    AMD''s support goes back to 2010 and the HD 5000 series, while NVIDIA cards dates
    back to the time with GeForce 4000 series. At first, you''ll see that NVIDIA doesn''t
    provide any proprietary drivers for older graphics cards - see www.object/index.html
    - but they don''t work with Ubuntu 15.04.


    If your card is an older model, then you''re stuck with the open-source drivers
    - Nouveau for NVIDIA cards, and Radeon for AMD cards. Don''t be too disheartened,


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_85_0.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_85_1.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_85_2.png)


    tip

    To find out about your graphics card - including its availability - simply open
    a terminal and type the following: grep reader


    * Intel graphics are open source, unless provided by NVIDIA and AMD, so to be
    installed manually.


