    # # Introducing the Ubuntu desktop


    Ubuntu''s desktop might seem a little alien to new users, but it''s very easy
    to get used to.


    Like Windows, the desktop of Ubuntu is where you''ll spend most of your time.
    It is where you can open your programs and interact with them, and you can also
    customize your desktop with wallpapers. While the Ubuntu and Windows desktop share
    things in common, there are many differences between them. Once you find that
    the Ubuntu desktop is not just easy to use, but it has loads of features that
    will make you feel quite at home without Microsoft''s way.


    When you first load up the Ubuntu desktop, you''ll see the Launcher, which runs
    down the left-hand side of the screen. This is where you access all your favourite
    apps. Pre-installed apps like the Firefox web browser and LibreOffice are also
    here and you can add other programs by searching and dragging them onto the Launcher.


    To search for files, programs or on your PC, you need Dash, which can be opened
