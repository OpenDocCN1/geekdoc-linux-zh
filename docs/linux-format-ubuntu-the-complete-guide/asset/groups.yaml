    # Hirsute Hippo


    It may not be paired with full of eye-catching new features, but Ubuntu 21.04
    features plenty of improvements.


    Wayland may be the headlines, but it''s by no means the only feature that''s arrived
    in Ubuntu 21.04. Several other features for the project, such as the PipeWire
    for audio and video and JACK, will greatly improve your ability to share screen
    where you want. This is a replacement for pulseaudio containerised Flatpak applications
    also being tested with Wayland''s tighter security requirements.


    In practical terms, its primary function is to restore the ability to share both
    screen and your desktop with compatible applications such as OBS Studio and Discord.
    It will also improve support in sandboxed applications as those installed through
    Flatpak.


    One interesting choice in Ubuntu 21.04 is the one to stick with GNOME 3.38 (or
    more). This means that the desktop remains a familiar one, despite the release
    of GNOME 40. As a result, no desktop changes as such as controversial horizontal
    workflows have been implemented in this time, although Monitor has been updated
    with GNOME 40. There are also some subtle changes to the desktop''s approach,
    as a shift up to 3.38.5.


    Using the Dark Theme by default UI elements in the menu bar, including status
    menus and Calendar tool. In addition, look out for some small, but pleasing updates
    to the Nautilus File Manager, including icons with red rounded corners.


    # Desktop improvements


    One major change that could make your life simpler is the incorporation of a new
    extension that finally handles drag and drop interactions between desktop and
    applications (such as the file manager). Take a trip to Power where you should
    find - assuming your configuration has proper kernel support - that you can now
    switch between light and dark power and saver. This feature is clearly aimed at
    laptop users, with the only downside being that yours won''t resolve a memory.


    - One minor tweaks all menu items - including the Calendar - switch to the new
    Dark Theme by default.


    Programs, Firefox and LibreOffice have also been updated to the latest version
    of release - LibreOffice is now up to 7.2.


    # Security improvements


    There are some welcome updates in Ubuntu 21.04 of highlighting. Users'' Home folders
    have been made private. This means that users can no longer browse the other users''
    home folders without their permissions being granted.


    If you''re planning on installing Ubuntu 21.04 from scratch on another machine,
    you''ll be glad to know that a fatal now exists in one of the official kernels
    which you choose for your system without having updated. Look out for the option
    during the installation process.


    The built-in network now nftables allows as back-end firewall. Use the friendly
    ufw frontend to manage the firewall and command line should show no difference
    in functionality. The main advantages of nftables over iptables are that it''s
    much faster when dealing with pre-defined tables or chains, making it fully configurable,
    and should be easier to use with new protocols.


    Finally, UEFI Secure Boot has been improved to support - a necessary consequence
    of the recent BootHole vulnerabilities discovered. The desktop also gains support
    for smart authentication, which can be used in place of passwords for logging
    in.


    The kernel has also been upgraded to 5.11 (Ubuntu 21.10) with kernel 5.8, and
    in addition to further security you will also benefit from the hardware support
    and performance improvements. Notable examples included


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_23_0.png)


    # Get started


    thanks to another better memory management, fsync performance improvements for
    ext4 and btrfs filesystems, and support for the latest graphics technologies such
    as Intel Arc and AMD VDNA.


