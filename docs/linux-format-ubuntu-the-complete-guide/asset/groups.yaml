    # 鬃毛河马 (Hirsute Hippo)


    虽然可能没有伴随着大量引人注目的新功能，但 Ubuntu 21.04 包含了许多改进。


    Wayland 可能是新闻头条的焦点，但它绝不是 Ubuntu 21.04 带来的唯一特性。该项目的其他几个功能，如用于音频和视频的 PipeWire 以及
    JACK，将极大地提高你在任何地方共享屏幕的能力。这是对 pulseaudio 容器化 Flatpak 应用程序的替代方案，且这些程序正在针对 Wayland
    更为严苛的安全性要求进行测试。


    在实际操作中，它的主要功能是恢复与 OBS Studio 和 Discord 等兼容应用共享屏幕和桌面的能力。它还将改进对沙箱化应用程序（如通过 Flatpak
    安装的程序）的支持。


    Ubuntu 21.04 的一个非常有趣的选择是坚持使用 GNOME 3.38（或更高版本）。这意味着尽管 GNOME 40 已经发布，但桌面仍然是一个熟悉的界面。因此，在此期间没有实施诸如引起争议的水平工作流等桌面层面的变化，尽管
    Monitor 已经随 GNOME 40 更新了更新。此外，桌面处理方式也有一些细微的变化，即升级到了 3.38.5。


    菜单栏中默认使用了“深色主题”UI 元素，包括状态菜单和日历工具。此外，请关注 Nautilus 文件管理器的一些微小但令人愉悦的更新，包括带有红色圆角的图标。


    # 桌面改进


    一个可能让你的生活更简单的重大变化是引入了一个新扩展，它终于处理了桌面与应用程序（如文件管理器）之间的拖放交互。前往“电源”设置，你应该会发现——假设你的配置具有正确的内核支持——你现在可以在亮色和深色电源以及节能模式之间切换。这一功能显然针对笔记本电脑用户，唯一的缺点是它无法解决你的内存问题。


    - 一个小幅调整：所有菜单项（包括日历）默认切换到新的深色主题。


    程序、Firefox 和 LibreOffice 也已更新到最新的发布版本——LibreOffice 现在已更新至 7.2。


    # 安全改进


    Ubuntu 21.04 有一些值得欢迎的亮点更新。用户的家目录已设设置为私有。这意味着用户在没有获得许可的情况下，无法再浏览其他用户的家目录。


    如果你计划在另一机器上从头安装 Ubuntu 21.04，你会很高兴地知道，在你为系统选择的尚未更新的官方内核中，现在存在一个致命漏洞。在安装过程中请留意该选项。


    内置的网络 nftables 现在允许作为后端防火墙。使用友好的 ufw 前端来管理防火墙，命令行在功能上应该没有区别。nftables 相比 iptables
    的主要优势是它在处理预定义表或链时速度快得多，使其具有完全可配置性，并且在使用新协议时应该更容易用。


    最后，UEFI 安全启动（Secure Boot）已得到改进以支持最近发现的 BootHole 漏洞的必要结果。桌面还获得了对智能认证的支持，可以用于替代密码登录。


    内核已升级到 5.11（Ubuntu 21.10）并使用了 5.8 内核，除了进一步的安全性外，你还将从硬件支持和性能改进中受益。著名的示例包括


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_23_0.png)


    # 开始使用


    得益于另一个更好的内存管理、ext4 和 btrfs 文件系统的 fsync 性能改进，以及对 Intel Arc 和 AMD VDNA 等最新图形技术的支持。


    # 开发者与变更


    在 Ubuntu 21.04 中，Canonical 专注于大型企业用户，并强调了新的微软优先 Active Directory 集成以及对 Microsoft
    SQL Server 的支持，这些功能也已回意味着 Ubuntu 20.04.2 LTS。


