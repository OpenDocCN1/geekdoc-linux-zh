    # POP3 vs IMAP


    接收电子邮件有两种方式：POP3（邮局传输协议）和 IMAP（互联网消息提访问协议）。POP 将消息下载到你的计算机，并（通常）从服务器上删除原始邮件。这是一种经典方法，适用于使用单台设备或对安全有要求的用户；如果邮件从服务器上消失了，你就可以随意处理它们。但在多台机器上使用
    POP 也有很大的缺点——它是一种单向传输，设备之间没有同步，因此你无法知道哪些消息是你已经读过或回复过的，你的各个系统之间也不会不会保持一致。


    IMAP 是一种双向协议，如果你有多个设备，这也许是更好的选择。它能确保阅读状态和消息删除会在你的所有设备上同步。你可以在多台机器上使用同一个账户，并同时使用网页邮箱和
    Thunderbird，从而保持内容同步。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_50_0.png)


    由于你现在需要决定为账户选择 POP3 还是 IMAP —— 请查看框以获取每种方法的详细信息 —— 请点击“完成（Done）”。你可能需要在完成窗口中授权所有的电子邮件账户，但只需要操作一次。


    你已经阅读了消息。在这里，你可以选择仅查看该账户的图片、来自特定地址或域名的所有消息，或者进入主“内容偏好（Content Preferences）”部分关闭此功能。


    在创建账户时，你可能会发现即使你使用了电子邮件账户，Thunderbird 初始也没有对应的地址。在 Thunderbird 中手动设置你的电子邮件账户（导入）是完成此任务的唯一方法。这个过程需要一些精力，但并不困难。


    # 双重人格


    Thunderbird 的默认布局在左侧显示电子邮件账户，右侧显示主消息区域。顶部窗格包含收件箱的内容，底部窗格包含消息详情。点击收件箱中的电子邮件即可选中它。如果
    Thunderbird 没有从服务器上删除消息（这可能需要一些时间），并且你使用的是 IMAP，则视图将按日期顺序显示消息。你也可以通过点击顶部的列标题快速对消息进行排序。


    点击消息，你将在主窗口的底部面板看到它。如果字体太小，只需将鼠标悬停在两个窗格之间的分割线上，向外拉一下即可腾出更多空间。如果还是不够用？双击消息，它将在顶部的标签页中打开，允许你轻松回到之前的位置。更多选项可以在屏幕顶部的“视图（View）”菜单中找到。


    # 在书中


    当你拥有消息账户时，你将会在窗口顶部看到使用所有功能（回复、全部回复、转发等），它们都整齐地排列在顶部，你还可以点击“写信（Write）”按钮来回复新邮件。


    如果封邮件中嵌入了来自互联网的图片，你至少会看到一个带有“偏好（Preferences）”按钮的横条。Thunderbird 正在限制这些图片，因为与旧邮件不同，用户可以使用图片来获取有关你账户的信息，等等。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_50_1.png)


    > 小贴士：你可以通过“编辑（Edit） > 设置（Settings）”菜单设置签名，将其添加到所有邮件的底部。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_50_2.png)


    你想处理品牌偏好吗？请自行研究。


    - 使用偏好按钮来更改你在邮件中看到的图片 —— 你可以设置得非常具体。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_51_0.png)


