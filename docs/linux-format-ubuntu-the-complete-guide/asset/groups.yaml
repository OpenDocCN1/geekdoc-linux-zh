    Library

    From you can select local libraries, UPNP shares, radio or podcasts.


    Add a source

    The plus and minus buttons let you to add a source for you: a folder on your hard
    drive, a URL or a shared archive


    Play queue

    This lists you what''s up and coming on your play.


    Artist list

    On the left is the artist list, and on the right albums in the main track list.


    Base package from. Enabling this in the Rhythmbox Plugins section should result
    in shared libraries over your network popping up in the left-hand menu.


    # Totem-ic


    While Rhythmbox is reasonably well, Totem-the player is not. It''s fine for playing
    back video select directly from file, but as a library manager it doesn''t really
    cut. You can add videos to one, but there''s no option to hold a folder of videos
    or automatically detect UPNP servers on your network.


    Totem allows you to open up any video from the Unity launcher and click the Channel
    icon at the top of the screen, you''ll get a selection of videos the latest trailer
    movies from Apple. You can add more from the Plugins menu.


