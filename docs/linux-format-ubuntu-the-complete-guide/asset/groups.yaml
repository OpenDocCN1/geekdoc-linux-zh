    ### Reading Repositories


    If you have used Microsoft Windows, you may be used to downloading individual
    programs from various websites to install your new applications. This can be tricky
    and also not very safe, given that anyone can write a program that contains malicious
    code. For an in-depth explanation of what repositories are, and how Ubuntu works,
    visit help.ubuntu.com/ they contain sets of packages. They make your life easier
    as thousands of programs are available and so don''t have to search for it around
    the internet. Some OS like Kali might take this step further and have a package
    manager (the Software Centre) which shows available programs with a description
    to help you decide what you need. One is used by Ubuntu in the tab of Software
    and Updates window opened. The first repository contains all software created
    by Canonical – the developers. The others are used to provide free software which
    is maintained by the community. This is the reason that for updates today do not
    come at once, as different programs are maintained by different developers.


    ## Mastering Backups


    Users who use regular versions of Ubuntu are released in April and October each
    year they receive bug fixes and security updates from Ubuntu for only nine months
    beginning from the date of release. Newer versions of software or features are
    not supported. One solution is to use an LTS version of Ubuntu for those who do
    not want to upgrade at all; the backups offers a third way, allowing many versions
    of software applications to be used without breaking your system. There is a risk
    they may clash with a new feature or program that you want supported. You should
    be able to use backups by checking the checkbox to Unsupported Updates in the
    tab of Software and Updates.


    There are few situations where using backups is better than upgrading to the next
