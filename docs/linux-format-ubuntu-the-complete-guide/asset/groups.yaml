    # Linux 应用


    ## Audacity: 音频编辑


    通过这款 Linux 顶级的免费音频编辑器，拼接、切割和消除噪音都将轻而易得。


    虽然 Linux 在桌面环境方面拥有极高声誉，但鲜为人知的是，许多用户也将 Linux 用于他们的创意工作站。例如，在终端音频制作方面，全球有许多稳定且专业的录音室使用它进行母带处理和音乐制作。


    对于 Ubuntu 来说，首选的“软件”是 Audacity：实际上，Audacity 是所有平台基础音频编辑的英雄级应用。它非常好。在 Ubuntu 中，你可以在“软件中心”通过搜索其名称找到它，因此只需点击并输入密码即可安装。


    > **快速贴士**

    > 如果你正尝试删除音频中的噪声，而且如果你只看跨越零线的波形文件，Audacity 会在产生音频咔哒声的地方编辑波形。你应该记住，可以隔离背景噪声以使编辑听起来更自然。


    Ubuntu 级别的音频编辑程序包括 Ubuntu 软件中心中的 Audacity 和 Ardour，它们非常值得尝试，以了解你操作系统的全部潜力。两者都有良好的开源社区。


    ## 深入了解


    在开始之前，值得指出 Audacity 和 Ardour 都是顶级音频工作站（DAW）。它们拥有软件形式的完整录音室，具有虚拟混音、WAV 文件、MIDI
    序列器等功能。但 Ardour 在 Linux 上需要付费数百万，而 Audacity 是免费的。Audacity 支持多种输入设备。


    与上述 DAWs 相比，Audacity 的外观要简单得多。在 Ubuntu 中，它有单轨道空间和一系列前向编辑工具。Audacity 包含了专业用户准备轨道所需的所有功能。


    在 Audacity 中你需要做的第一件事是导入音乐，但在那之前，你会学会如何完美操作。通过播放音乐（覆盖音频轨道），你可以处理几乎任何流行格式，如 MP3，你需要从
    Ubuntu 软件中心安装“受限扩展包”（Restricted Extrema）。这将为 Linux 免费添加媒体文件的解码器。


    对于初学者来说，这些工具有些令人生畏。它们每个都有多个窗口并充满了术语。如果你不是要为你的最新作品进行六路混音和弦四奏配谱，而只是……


    将音乐导入编辑窗口有两种方法。在“文件”（File）菜单下，你会看到“打开”（Open）和“导入”（Import）。将音频文件拖入 Audacity 或将其丢入以作为新项目打开。如果你选择导入，它将作为新轨道添加到你当前正在工作的项目中。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_41_0.png)


    如果你从未用过音频文件的波形形式，编辑起来其实很简单。每个轨道的中间，即 y 轴上的点，代表静音。如果音频有一部分是长长的直线，说明录音中该部分是空白的。轨道显示为轨道一侧的尖峰。


    到这里，你有两个应该学习的快捷键。第一个是空格键，它从当前标记处开始播放音频（回放）。按 Ctrl 键停止，然后滚动鼠标滚轮来放大或缩小波形。如果你放大，你可以看到轨道两侧看起来像三角形和弦的东西；`1`
    实际上是长条图表在线条上下快速移动。


    - 如果你需要无缝地删除音频段落，请在它跨越零线的地方放大并切割。


    ## 全部的 Audacity 功能！


    ### 回放控制

    简单的回放控制让你能够听到正在编辑的轨道。确保在开始前按了“停止”（Stop）。


    ### 轨道控制

    你可以在这里静音轨道或更改左右声道的平衡。


    ### 麦克风输入

    你可以直接从麦克风录制到 Audacity —— 调整电以获得良好的峰值。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_42_0.png)


    使用 Audacity 非常简单：通过点击时间点移动标记，你就可以在该点开始回放、将其标记为编辑或在标记处切割一段。你开始时将使用的主要命令是“修剪”（Trim）和“切割”（Cut）。这两个操作基本上是其他操作的反面：通过选择并拖动（或从标记位置按
    Shift 拖动）来选择区域，然后可以使用“剪切”（Cut out）移除轨道的一部分，或使用“修剪”（Trim）移除其他所有内容。记住，如果你在处理多轨道音频，切割一个轨道可能会导致它与其他轨道不同步。


    下一个重要部分是“效果”（Effects）菜单。在这里你可以找到一组可以调整你声音的行业标准。选择一个区域或整个轨道，你可以放大、压缩动态范围（让静静的部分变大，响亮的部分变小）或添加回声、加快节奏等。


    有许多过滤器未进行详细描述，简单来说，许多软件都是那些在录音室用于人声的软件的版本。一旦你修剪了轨道，效果允许你将项目导出为未压缩的 WAV、Ogg Vorbis，甚至甚至是
    MP3。


    ### 绘制工具

    铅笔图标是绘制工具，它允许你对波形进行手动编辑。


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_42_1.png)


    > **快速贴士**

    > 如果你想删除音频中的噪声，而且如果你只看跨越零线的波形文件，Audacity 会在产生音频咔哒声的地方编辑波形。你应该记住，可以隔离背景噪声以使编辑听起来更自然。


    ## 深入了解（注：此段原文内容存在部分重复，已按要求翻译）


    在开始之前，值得指出 Audacity 和 Ardour 都是顶级音频工作站（DAW）。它们拥有软件形式的完整录音室，具有虚拟混音、WAV 文件、MIDI
    序列器等功能。但 Ardour 在 Linux 上需要付费，而 Audacity 是免费的。Audacity 支持多种输入设备。


    与上述 DAWs 相比，Audacity 的外观要简单得多。在 Ubuntu 中，它有单轨道空间和一系列前向编辑工具。Audacity 包含了专业用户准备轨道所需的所有功能。


    在 Audacity 中你需要做的第一件事是导入音乐，但在那之前，你会学会如何完美操作。通过播放音乐（覆盖音频轨道），你可以处理几乎任何流行格式，如 MP3，你需要从
    Ubuntu 软件中心安装“受限扩展包”。这将为 Linux 免费添加媒体文件的解码器。


