    # Steam: Play games on Linux


    Linux is no fun! You can enjoy games and these days that''s not just years old,
    but same-day release big-AAA releases.


    Linux is great for work. Linux is great for servers. Linux is great for PCs. No
    one says Linux is great for gaming, or do they? Go back just four years to 2012
    and it''s true. About the most fun you could have with Linux was recompiling the
    kernel to patch the latest heap-exploit. Then Steam arrived, released in late
    2012 the biggest gaming platform launched on Linux and gaming was never the same
    again.


    Several years on and Linux now offers over 2,000 titles on Steam, a number that
    continues to grow steadily with over 500 titles being added during 2016 alone,
    including big-name titles like Mad Max, Deus Ex2, Rocket League, Life is Strange
    and the new Tomb Raider. We''ll take a look at how you can safely install games
    on Linux and get gaming as easy as possible.


    Before we start we should know that there is not only plethora of choice when
    it comes to gaming, it''s easier than ever to get started. Valve''s storefront
    has its own simple install and running games is an incredibly simple process.
    is not the only game store for Linux; Old Games (www.gog.com) is another service
    that also works for Linux. It offers a mix of classic games (that have been compatible
    with modern systems), new games and has no DRM. Another online store that you
    have to find and give to www.humblebundle.com and offers a wide range of DRM-free
    games.


    # Careful now


    Do not install Steam via Valve website. Valve in the correct way does offer an
    install on Steam, this will appear to install but to required dependencies. It
    also doesn''t provide any error messages to help you work out. The correct way
    is to install Steam from Ubuntu maintained repositories. If you show it, tells
    it is really easy. You might wonder why you can''t find Steam in the official
    store, due to the cutting-edge nature of Ubuntu, no packages are found here. So
    we have to return to the traditional method.


    Use the Dash (top-left) icon and click the Terminal to open interface. Type the
    line below, press Enter and enter your password:

    `sudo apt install steam`


    You''ll get a stream of text indicating packages that need to be installed and
    a final line along the lines, type ''Y'' to accept to continue, you need to get
    224MB of archives. After that operation, more text will scroll by, which is installing
    all of packages. A dialog will appear, press Tab to highlight YES and press Enter.
    Select AGREE to continue. Steam is now installed, you can type Steam and press
    return in the Terminal to launch it.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_45_0.png)


    > Bring your Steam library with, any Linux games will appear as if magic the Dash,
