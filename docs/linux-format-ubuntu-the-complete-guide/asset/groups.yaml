    # Pairing Bluetooth speakers


    Ubuntu can connect audio wirelessly to most Bluetooth speakers. If so, in addition
    to connect compatible speakers your computer must support Bluetooth. Use the search
    bar to search for Bluetooth if you are unsure if your machine supports it. If
    it isn''t supported consider buying a Bluetooth adapter.


    Fortunately there are a small number of USB devices you can plug in to provide
    Bluetooth support. For a list of compatible Bluetooth USB adapters click here.


    The device used for this (screenshot) was a Micro 10cm USB adapter purchased from
    Argos for £39.99 which worked out of the box on a machine running Ubuntu Lubuntu.


    Once Bluetooth is switched on, follow the manufacturer''s instructions to put
    speakers into Discovery mode so they can be detected by your computer.


    Launch the Bluetooth application from the search bar and make sure the switches
    at the top of the window are set on to activate and make your computer discoverable.


    Click the + at the bottom of the left to search for your bluetooth device or speakers.
    Click to highlight when it appears in the list. Once at the bottom a message will
    appear saying the device has been successfully set up.


    Click the volume icon to open Settings. See that your Bluetooth device is listed
    as a device in the Output tab. Select it to start playing sound over Bluetooth.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_80_0.png)


