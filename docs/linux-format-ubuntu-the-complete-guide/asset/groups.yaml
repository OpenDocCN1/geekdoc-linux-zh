    # Install a printer driver tarball package


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_64_2.png)


    # 1 Obtain & extract installer


    Browse to your manufacturer''s website and locate the driver for your Linux distro,
    which may be packaged as a tar.gz.


    Save the tar.gz file to your Downloads folder, then find it and Choose ''Extract
    here''. Once that''s done, the extracted folder contains a script file install.sh.


    Right-click on it and choose ''Properties'' to make a note of its location.


    # 2 Start installation


    Now you''ll need to open a terminal and type in cd <path>. You''ll need to replace
    <path> with the path located under the file you found in its Properties. Then
    run the following command and press Enter, followed by your root password when
    prompted: sudo bash install.sh. After a short pause you will see an installer
    wizard pop.


    # 3 Follow install guide


    You''ll need to work through the Linux wizard and make sure that you use your
    username to access the printer. The wizard will show you, you may then be prompted
    for your password. Follow the wizard to set it up, entering name, description
    and location if, before going ahead and setting the printer to finish the process:


