    # POP3 vs IMAP


    There are two ways to receive email: POP3 (Post Office Protocol) and IMAP (Internet
    Message Access Protocol). POP downloads messages to your computer and (usually)
    deletes the originals from the server. It''s a classic method, and for those using
    a single machine or with a security-conscious benefit; if the messages are gone
    from the server, you can play with them. But there are big disadvantages when
    it comes to using POP on multiple machines - it''s a one-way transaction, with
    no synchronisation between them, so you won''t know which of the messages you
    have read or replied to, and your systems won''t match.


    IMAP is a two-way protocol, and perhaps the better choice if you have multiple
    devices. It offers that read status and message deletions will match all your
    devices. You can use the same account on multiple machines and use webmail and
    Thunderbird at the same time which keeps things synchronized.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_50_0.png)


    Because you now choose whether to use POP3 or IMAP with your account - see the
    box for more details on each method - hit Done. You may have to authorize all
    your email account in a finish window, but you only have to do this once.


    You''ve read the message. Here you can choose to view images in just that account,
    for all messages from address or domain, or head to the main Content Preferences
    section where you can switch off this feature.


