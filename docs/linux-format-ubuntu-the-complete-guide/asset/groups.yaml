    in the hard drive are organized. MBR, which stands for Master Boot Record, deffrs
    to the information stored in the first partition of the hard drive that identifies
    where an operating system is located so that it can be loaded into the computer.
    GPT stands for Global Partition Table.


    GPT, which is GUID Partition Table, is similar to MBR in that it stores partition
    information for the hard drive. This information includes the boundaries of each
    partition and which one is primary and bootable. MBR, which was first introduced
    in 1983, can only handle up to two terabytes in size and can support up to four
    partitions. Replacing MBR with GPT allows for partitions that are far larger and
    for a nearly unlimited number of partitions. If you have the GRUB/bootloader,
    which handles the OS booting between Linux and Windows, note that you can only
    get a GPT on a UEFI-based system.


