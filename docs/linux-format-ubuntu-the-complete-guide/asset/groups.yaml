    # # OpenShot Slideshows


    If you wish to create a video from a series of photos, place them in a folder
    and make sure they are sequentially. Most digital cameras will do this for you.
    Use the ''Import'' button to load all images. Press Ctrl+A to select all and right
    click them. Choose Import.


    The ''Transition'' section allows you to choose a transition between photos. This
    saves you time and trouble of inserting transitions individually, but naturally
    it will be the same kind of professional-looking Blend for every photo.


    By default the ordered numbers will be added as i1 and then i2 and so on. You
    can change the order in the ''Timeline'' section. Click ''Add'' when you are done.


    At this point you may want to add an audio track for music. Slideshows are exported
    as video in the format by clicking the ''Export'' button at the top and you''re
    done.


    +   * Use the arrows on the left to change the order of the pictures.


    Sometimes you may only want to create a video with clips from a larger recorder,
    for instance to play slideshow at a wedding. The Razor tool can be activated by
    clicking the scissors at the top of the timeline. Once you are done the cursor
    will change to a picture of a razor with a blue dashed line.


    Left click with the mouse to split your video into parts. You can then right-click
    on individual clips or choose ''Remove'' to delete all of them. If you want to
    move snipped clips around, click on the ''Arrow Tool'' to move the clips either
    on the timeline or in the window.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_40_0.png)


    # # Effects and transitions


    OpenShot contains built-in video effects to enhance transitions. Simply right-click
    on the clip in question and select ''Properties''. Select the effect and the ''+''
    button on the left to add the effect to your clip.


    A preview of your video clip will display on the left side. Click the play button
    to see what your wanted effect will look like before making changes. Click ''Apply''
    to render the effect to the clip. This places a small star on all video clips
    that have been enhanced with effects. You can remove them at any time by going
    into the properties window, highlighting the effect with your mouse and pressing
    delete.


    While you are in the Properties window, take time to explore the other tabs like
    ''Search'' and ''Layout'' to see where it''s possible to find the settings for
    each clip. If you wish to spend your time editing your video to music or change
    the speed without using the razor tool, click ''Apply'' when you are done.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_40_1.png)


    Transitions are particularly useful for moving between images or video clips in
    a style. Click the ''Transitions'' tab at the top left to see all the various
    effects and drag one onto the timeline. It can be helpful to use transitions of
    order to avoid overlapping clips. If you wish to set the settings for a transition,
    click and select ''Properties''. You will be able to specify a new position, length,
    and duration for your transition.


    > Quick tip

    If you have different types of music you want to use to navigate them. Click the
    ''Audio'' tab and ''Audio'' button to show only that type.


    +   * Click the ''Transitions'' tab to drag and drop video clips or photos. Right
    click on a selection and select ''Properties'' to finish you.


    # # Exporting video


    You can use the built-in button on video to export the project to your satisfaction.
    Once you are satisfied, use the timeline and use the scroll bar to play and if
    you need to examine a specific section. Once you are satisfied, click the ''Export
    Video'' button at the top of the window. Specify a format for your video and choose
    a location on your Desktop. When choosing a profile you want to share the video
    online choose ''Web''. You can then find the settings for individual videos click
    the ''Export'' button when done. The file will appear in your chosen folder once
    the progress bar is complete.


    # # Further Reading


    This guide only covers the surface of the power of OpenShot. For more information
    on additional features visit the official manual at https://openshots.com/help/linux/.
    For help for friendly users and to see stunning examples of videos created in
    OpenShot head or go to the forum at https://openshots.com/forum/


    +   * Use the button in the ''Clip Properties'' menu to experiment with different
    effects. Don''t be afraid to explore the other tabs if you need to modify'
