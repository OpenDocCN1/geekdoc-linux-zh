    # Tweak Boot-repair tools


    ### Main options

    The first tab offers an option button for backing up your partition table and
    sort - click this to copy your thing. It is where you can reinstall GRUB restore
    the MBR and choose which order to de- GRUB. If you think your system is corrupt,
    click ''Repair files'' to have it checked and fixed.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_92_2.png)


    # Grub location


    This tab allows you to specify which GRUB to boot in a multi-boot setup. You can
    also choose which partition to get it from /home if you wish - typically this
    is only on encrypted partitions, drives with LVM enabled or some older PCs. The
    final partition which drive it is set (sda) (by default).


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_92_3.png)


    # Grub options


    This section offers options for making Grub updated to its latest version. There
    are three specific free offers offered. You can also add new kernels to the Grub-menu,
    or purge previous kernels before reinstalling the last. You may even see an option
    allowing you to edit the Grub configuration file.


    # Other tweaks


    If the MBR options are not greyed out, you get to restore your MBR from a backup
    and choose which partition gets booted from it. The final Other options offer
    an opportunity for repairing Windows files (in most cases) and provides options
    for setting your summary of settings for online entry.


