    and the bottom pane contains the details of the message. Clicking on an email
    in the inbox will select it. If Thunderbird doesn''t delete the message from the
    server (this could take a while), and if you used IMAP the view displays messages
    in date order; with the order. You can also quickly sort your messages by clicking
    the column headers at the top


    Click on a message and you''ll see it in the bottom pane of the main window. If
