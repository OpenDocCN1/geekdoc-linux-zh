    # Printer classes


    CUPS allows you to group multiple printers into classes. This is mainly aimed
    at networks of users who want to share a limited number of printers. With hierarchy
    added printers being prioritized before being assigned to a class, it ensures
    availability, so if only one person is printing they''ll always access the first
    printer, or if we are printing at the same time, the first printer gets the preferred
    status and the second gets the next available.


    done, open System Settings -> Printers and click the ''...'' button next to Add
    and select ''Class'':


    You''ll be prompted to provide a name, description and location in terms of a
    class printer, but it''s better to try it first – e.g. ''Study'' or something
    similar. Once done, click ''Forward'' to add existing printers to the class –
    to remind them in order of preference. Once done, you can set the class as your
    default in place of a single printer – right-click its entry and choose ''Set
    As Default'' and make use of your scanner. In particular – when using multiple
    scanners – you can choose any one for a good will. It''s thanks to built-in support
    for SANE (Scanner Access Now Easy), which provides all the tools to scan in Linux.


    With this mind, it defines out how you want your printers classed: do you want
    the fastest ones available, or do you want to try and steer people towards a high-quality
    printer such as laser?


    If you''re trying to extract text from a document, use CUPS''s tools for controlling
    page scan and select columns before you attempt to maintain the chances of success
    – such as OCR extraction.


    So if you''re lucky plug in the USB port and use Simple to see if it detects it.
    If it does, you''re in business – skip to the next step; if it doesn''t – don''t
    panic. Search for Linux drivers with your manufacturer.


    # What connection type?


    If you''re setting up a printer, then you''ll have a choice of connections when
    setting up your printer. But what are the different protocols, and which should
    you choose if you have no choice?


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_65_4.png)


    The simplest protocol is referred to as HPPD. It is usually used when no other
    connection is possible, but its simplicity limits any kind of flexibility. If
    there''s no queue management then you can''t print jobs unless they are all at
    once. There''s also no way to discover ink and toner levels over time.


    Next is CUPS, which supports Line Printer (also called JetDirect) or IP Printer.
    These methods implement queue management, and can tell the difference between
    different types of data, such as RAW or PostScript. There''s well a web setup
    menu now, and you can''t query the ink or toner (which may be provided airways)
    and print your printer''s status.


    The final protocol – IPP is the most common and stands for Internet Printing Protocol
    and it is the best for managing both jobs and queues. It''s the preferred method
    of communication as you can get more feedback from the printer and will more control
    over it to bidirectional nature.


