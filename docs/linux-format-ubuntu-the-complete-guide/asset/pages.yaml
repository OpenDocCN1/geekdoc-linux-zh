  md: '# # Gimp: Editing photographs


    Think you need professionals to do a job? Think again: Linux includes the best
    free photo editor.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_37_0.png)


    > > Quick tip

    > Those who like to shoot in RAW on their cameras, there are excellent options
    for processing them on Linux. A fully open source RAW editor you will find in
    the repositories: AfterShot Pro, a well-supported contributor.


    Here is one name which dominates digital editing all around the world. Adobe,
    and more specifically its Photoshop application, has been popular for so long
    that now to "Photoshop" a picture is the same as becoming a verb. To "Google"
    for internet search or "Hoover" for vacuuming.


    The bad news is that the vast majority of Adobe products are not available on
    Linux systems. *Photoshop* certainly isn''t never will be.


    Is there a working area that is as not ideal for photographers or those who like
    to tweak and delete snaps before sharing them with the world? Of course it isn''t.


    # ## Get your Gimp


    We''d wager that everyone in Windows would prefer a working area when using Photoshop.
    It''s an expensive piece of software and there are so many features to learn.
    One of the best, which is available on Linux and Windows, is the wonderful GNU
    Image Manipulation Program


    Gimp is astonishing powerful, so much that it is as rich as Photoshop and certainly
    as capable of almost every task. It''s installed by default in Ubuntu, but you
    don''t have to find it in the Software Centre.


    When you start using Gimp it can be intimidating. This is a professional piece
    of software designed to be used by professionals.


    But not be put off, it''s easy to get a grasp of the basics.


    The first thing you''ll notice is not one but three windows have appeared on your
    desktop. In the classic layout, you''ll find the menus in a thin window on left,
    the canvas in the middle and the controls, color channels and brushes on the right.


    It can be tricky at first to work in three windows simultaneously, and it''s easier
    to display everything in one Window if that is putting you out. So go to Windows
    and stick to the box. This is what you may be more comfortable with.


    If you can bear with it, we''d strongly advise to separate windows for all the
    reasons. It allows you to create a working area that''s exactly customised for
    you, and if you have more than one monitor you can monitor the tools on one screen
    with the full width on another.


    # ## Colour correction


    Gimp is a powerful piece of software. It includes tools for cutting parts of an
    image, creating layers, class masks and brushes loaded by art extras for removing
    horizons from a image and a wide range of filters and plug-ins—support plus support
    for more— retouching and publishing online.


    To get started, there''s an exercise in brightening an underexposed photo. First,
    you''ll need to get your photo into Gimp. A quick note—Gimp does not support cameras
    directly, so you have to convert your image to JPG, TIFF or PNG file.


    Now you can pick it up by dragging it from the Browser or importing it into the
    workspace if Gimp is already running. You can also open an image using the File
    menu if you need.


    Our underexposed image is a little dark, but we''re not going to increase the
    brightness. That would be cruel and leaving you with a flat, washed out looking
    out. We want to keep shadows and preserve as much detail as possible without leaving
    the image looking out.


    The way to do this is to click on Color and select Levels. This is the tool that
    professionals use to correct exposure. What you can see is a histogram that describes
    the "range" of your image. The left side of the histogram represents the amount
    of pixels in dark areas of the shot, and the right side light.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_37_1.png)


    > > The Levels dialogue is the first part of call for fixing.'
