    # Customise the Launcher


    Install an app from the Software Centre, and its icon will automatically be pinned
    to the Launcher. Other icons will appear temporarily when an application is running;
    disappear when the app is closed – you can make them permanent by right-clicking
    the app icon and choosing ‘Lock to Launcher’. Unlocked icons can be removed by
    right-clicking and choosing ‘Unlock from Launcher’


    You can rearrange icons by clicking and dragging them around the Launcher to their
    desired location – or use the other icons to move it home. Go to it to reset all.


    If you find the desktop crowded, open Settings via the Launcher. Start by changing
    the size of icons on the Launcher using the ‘Launcher icon size – fit to more,
    or decrease the size. Choose to follow the dock behaviour and click the ‘Auto-hide’
    switch to make it vanish, only when you drag the mouse over the left-hand edge
    of the desktop – use the ‘Use reveal’ switch to tweak how the Launcher will pop
    up, or click the ‘Show icons’ button if you prefer to select the appearance ribbon
    button. Click the ‘Add show’ icon to the launcher box if you’d like to clear the
    clutter with a single click (it works magic! Settings are restored on the first
    click, then click again to bring them back);


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_28_0.png)


    # Virtual desktops


    If you have three or more apps open, your desktop can start to feel a little crowded.
    It is worth to keep things really neat and tidy. When you need to look at Ubuntu’s
    workspaces features, virtual desktops are useful; you can drag and drop windows
    between them to free up space on individual desktops or group related applications
    together. You can also chat and share screens for work with more teams.


    To explore workspaces, go to Settings > Behaviour and click ‘Enable workspaces’
    and a new button will appear on the dock. Use the shortcut (Alt + S) keys to switch
    between one workspace to another them, then click the desktop you wish to jump
    to. The Launcher remains in place across all desktops, so you can use it to access
    anything again with this switch.


    The beauty of workspaces is that the Launcher remains consistent across all desktops,
    so you can easily switch apps between different desktops by clicking the app


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_28_1.png)


    in the Launcher – Ubuntu will magically switch to your correct desktop. You can
    also move around using the [Ctrl + Alt] keys and press the cursor keys to move
    around a mural of all desktops to guide the windows to where you want.


    > Give your desktop radical makeover by applying a new theme to it along with
    Ubuntu Unity Team features


    Four desktops should be enough for most, but you can increase this number if you’re
    the type of person who has many apps open at once. When you invoke the workspaces
    view, you will see all the desktops arranged in a square. To expand the number
    of available virtual desktops, use the Unity Team Tool ‘Workspace Settings’ under
    ‘Window’ to increase the number of desktops by adding extra rows or columns to
    the workspace manager.


    # And there’s more...


    One of Ubuntu’s tricks is that controls – as minimizing, maximising or closing
    the window – aren on the desktop itself, but appear in the bar at the top of the
    screen when you roll the mouse over it, with an application. If you’d rather the
    controls provided in the in-app bar instead, go to Settings > Appearance > Behaviour
    tabs and click the ‘Always show titlebars’ switch to make them visible.


    If you have two or more displays set up, go over to Settings > Screen Display
    to configure how they work – you can choose to mirror displays or (more likely)
    extend the screen between displays. Then set the desired placement for your physical
    location (the left-hand display sits on the left, for example). Most controls
    (on by detail) refer to whether or not to make windows by dragging them to the
    edge of the screen – if you don’t like behaviour, click the switch off


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_28_2.png)


    # Scale your display


    If you''re using a high-DPI display such as a 4k, you’ll need to tweak settings
    to make the display comfortable to read. By going to Settings > Screen Display
    and experimenting with the Scale for menu and title bars to make the menu and
    title bars readable.


    Now go back to All Settings and select Universal Access. Click the ‘Large Text’
    switch to Switch to Accessibility and scale up your Launcher icons using the ‘Launcher
    icon size’ slider. Finally, for you cursor, check the Unity Tool and use ‘Large
    fonts’ in the Sections of the text.


