    Details and examine the OS type to find out. Full read/write mount for any exfat
    drive will be enabled.


    # Working with USB drives


    Ubuntu is more than happy to work with USB storage of any nature - hard and flash
    drives are treated equally well.


    USB drives are recognised in the same way as hard drives - Open Disks to identify
    the drive, format or change its label for you.


    Just plug in, and it will be formatted using a supported file system. Ubuntu has
    built-in support for FAT32 and NTFS file systems as well as its own ext-based
    file system - ext4 - which you can use like any other.


    Select the partition you want to mount. It''s usually something like /dev/sdb1
    or /dev/sdc1 depending on how many hard drives you have. Unlike permanently attached
    drives, these identifiers change every time you plug in or unplug a drive, on
    some basis.


    Large drives - typically TB or larger - are formatted in the exfat format. For
    support for exfat is not included in Ubuntu, but you can get it by opening the
    Software Centre and


    Always verify the drive in Disks before performing any task that might cause you
    to identify or lose data.


    Once plugged in, the Nautilus file manager will show your mount point in <media>/username/<label>
    or <media>/<dev> where <label> is the name you gave it when the partition was
    created. Until then the drive stays there.


    When you''ve finished with the drive and want to remove it, click the button next
    to the drive name in Nautilus to unmount it. If you need to remove a drive from
    a Terminal, use the umount command.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_81_0.png)


    Verify that your USB or DVD drive is capable of doing what you want by trying
    to insert then remove.


    > PRISON_BREAK_SEASON_1_COMPLETE


    You have inserted a Video DVD. Choose what application to launch.


    Select how to ''PRISON_BREAK_SEASON_1_COMPLETE'' and perform to do this in the
    future for other media of type ''Video DVD''.


    +   - Always perform this action


    ```

    umount /dev/sdb1

    umount /media/nmedia/RPI0

    ```


    By using the umount command, you can remove multiple drives at once. For example,
    umount a partitioned drive, allowing you to remove the drive even if it''s partitioned.
    Pmount a specific volume or part of it using its mountpoint as the


