  md: '# System settings


    can help troubleshooting. Examples of these include acpi=off, which disables the
    ACPI known to cause memory reports or system freezes on PCs, and nomodes, which
    prevents Ubuntu to only loading drivers the X has been loaded, and not. These
    parameters can be passed to your rescue disc, in case you''re having problems
    getting working with the initial boot menu. For more information, please do an
    search for the parameter or visit http://wiki.org/KernelParameters for a list.


    If things look particularly bleak, then you may have luck reinstalling Ubuntu
    over the top of it! Boot from the Live CD and continue. When you get to the ''Install
    Ubuntu'' type you will be presented with a new option, pre-selected by default:
    Reinstall Ubuntu... This option rebuilds Ubuntu without losing your home folder
    or files, which means not your documents and other files are preserved, but key
    settings and many programs may be lost too. If you choose it in boot menu instead,
    you won''t lose any other operating systems.


    # Repair Install


    If you want to try this from the GRUB menu - if your kernel has been upgraded,
    you could try booting using an older version of the kernel from the Advanced options
    under GRUB. If you see each version of the kernel - list the previous version
    if you believe your problem is linked to the latest kernel. If this works, you
    can make the version you''ve used permanent by editing the GRUB configuration
    file - simplest way to do this is using the GRUB-repair tool.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_92_0.png)


