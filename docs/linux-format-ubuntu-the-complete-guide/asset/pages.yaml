    for all messages from address or domain, or head to the main Content Preferences
    section where you can switch off this feature.


    When you''re creating an account, you''ll probably discover that Thunderbird doesn''t
    have an address to start with, even if you use your email account. Manually setting
    up your email account in Thunderbird (Import) is the only way to get the thing
