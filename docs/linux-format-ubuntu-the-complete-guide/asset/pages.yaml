  md: '# # Scan and print:

    How to start


    Let’s run through some tips to get your printers and scanners up and running using
    systems and tools like CUPS, SANE and XSANE.


    There''s almost mandatory to have a printer and scanner set up in Linux for your
    PC, but it can be a little tricky. Don''t worry, though; with the right drivers
    and tools you can quickly get things up and running. Two core tools are built
    into most Linux distributions (distros) that help simplify the process: CUPS for
    printers and SANE for scanners. CUPS allows you to interface with your printer
    and SANE provides everything you need to preview and detect images. We''ll be
    focusing on these for this tutorial, coupled with some tools that make it easier
    to go into the terminal you need to tweak.


    Once installed, Click the ''Add'' button to see if your printer is visible and
    supported. If your printer is connected via USB, but not showing up - as is likely
    - then you’ll first need to locate suitable drivers for it. Start by looking for
    Linux drivers on the web; you may need to find a package for your exact distro
    (including version number) will be supplied, but don''t panic: if it''s not successful,
    we successfully installed a Deb B2550dn all-in-one printer in Ubuntu 14.04 LTS
    using a driver that was only promoted in the repository.


    With other operating systems, you can usually plug and play your printer - the
    drivers will either be pre-installed or you''ll have to download a driver, or
    insert a disc. As simple in Linux, it is fact that with the right procedure you
    shouldn''t have to spend hours setting things up.


    If you''re lucky, the driver may be supplied in a package, which in case downloading
    and double-clicking will launch the setup wizard. If your driver is provided as
    a tarball extension, it might contain a shell script (.sh), in which case the
    step-by-step guide will show you how to get it up and running. Once done, re-open
    the CUPS editor under System Settings and your new printer should be visible.


    # Network setup


    +   * Network printers can often be set up without having drivers to download


    If you''re using a network printer, you''ll need to set it up without having to
    search first. Click ''Add'', expand ''Network Printer'' and wait for click. After
    a moment any detected printers should show up in the list. You can click on one
    to see its connection protocols. Or click ''Connection Type'', which will show
    a page of options where you can choose which one to select. If IP is not available,
    otherwise choose IP or DHCP.


    CUPS might be pre-installed with versions of Ubuntu - you can access it from System
    Settings by clicking CUPS. If it''s not installed, search through the "Software
    Center'''' (search for "printer") or via the terminal using sudo apt-get install
    cups.


    The good news is you don''t need to start your printer when your manufacturer''s
    website is installed. If you''re lucky, the driver may already be in place, particularly
    if your model is a model, in which case you may only need to open the CUPS editor.


    If you''re happy to use the options offered by CUPS, click ''Find'' and look for
    drivers, then selecting your manufacturer and model. If one is found, you can
    choose from three choices: select a provided PDF file or search for a driver to
    download. Start by selecting your printer manufacturer to see if an match is found.
    If not, try again - you may need to search for your printer name on the web search,
    as it might be limited.


    You can also use a PostScript Printer (PDF) file if your printer is a PostScript
    model and you can select your printer name from the list with the word "PDF".
    Then use CUPS with the description capabilities available.


    If all else fails, don''t worry: ''Select printer from database'', and then click
    that specific: ''Generic'' and click ''Forward: Generic PCL driver


