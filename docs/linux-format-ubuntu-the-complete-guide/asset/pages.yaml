  md: '# Twelve Linux replacements for


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_0.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_1.png)


    # Libre Office (MS Office)


    Don''t worry about missing Microsoft Office when you jump to Linux, because Libre
    Office does everything Microsoft''s office suite can, but it''s less bloated,
    without having the annoying Ribbon interface, and best of all, it''s completely
    free.


    # GIMP (Photoshop/Paint)


    If you''re a photo and image editor, GIMP should definitely be on your list of
    apps to download. It''s simple to replace Microsoft Paint, and also has enough
    depth to replace Photoshop for your money.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_2.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_3.png)


    # Audacity (Audio editor)


    If you edit and music creation are your thing, Audacity is an excellent replacement
    for professional tools like Cubase and Sibelius. If you''re not particularly talented,
    Audacity is handy for editing voice-overs and other sound files.


    # Firefox (Internet Explorer)


    You won''t find Internet Explorer on Linux (which some would say is a good thing),
    but the web browser defaults by many versions of Firefox, which is faster, more
    secure and allows you to install add-ons to improve its functionality.


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_4.png)


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_33_5.png)


    # Thunderbird (Outlook)


    Do you use to manage your emails in Windows? You''ll want to install Thunderbird,
    which is an incredibly versatile desktop email client. Like Firefox (they are
    both created by the same company), you can install add-ons to tailor it to your
    needs.


    # VLC (Media Player)


    If you use Media Player or a third-party application like CyberLink PowerDVD,
    you can use VLC to play all your media-playing files. It''s more flexible than
    WMP and can play a huge variety of media files, and unlike PowerDVD, it''s completely
    free.'
