  md: '# # System settings


    # # The Boot process


    When you power your system''s boot, control is initially given to your PC''s EFI
    or BIOS, which starts its components, performs basic diagnostics and tests to
    find a bootable device, which is the first hard drive.


    list of choices you see in the boot menu. Each entry identifies the drive partition
    and file that contains the Linux kernel, RAM disk used to execute the kernel.
    Each entry can also contain additional parameters needed.


    The order of boots for the Master Boot Record (MBR) or the drive with which the
    boot begins, determines which stage loader loads, reading a file (e.g., grub.cfg)
    and starts the operating system from it.


    Control is passed to the boot menu, which attempts to load the root system. This
    is a safe mechanism, and if you fail a kernel, or things go wrong, if it succeeds,
    you can use GRUB (or other bootloader) to go where you want, a part. It might
    fail if you get into a shell, but then you can restart to start other services
    and eventually bring you back to the login screen.


    You need your rescue device for diagnostics, which is located either in the MBR
    or the drive itself.


    Once GRUB loads, it reads a message file, which contains


    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_90_0.png)


