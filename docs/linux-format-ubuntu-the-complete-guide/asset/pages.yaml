    ![](img/2a0e46ba4cbaf6f127699f072feb68b0_12_2.png)


    +   ### 1 Get VirtualBox

    Head to www.virtualbox.org and download VirtualBox 6 for your operating system,
    be that Windows or macOS. Install it and you will need around 20GB of drive space
    for it. You will also need the Ubuntu ISO file from www.ubuntu.com. Once installed,
    start it, click the ''New'' button and call it Ubuntu.


    +   ### 2 Create a machine

    Choose Ubuntu and the bits should match the ISO you downloaded, click ''Next''.
    Then Memory I recommend 2048MB, but if you have an 8GB PC 4096 is enough. You
    can choose to create a virtual disk now or dynamic hard disk later. The default
    is 8GB, Finish and click Start to get it started.


    +   ### 3 Starting virtual Ubuntu

    A prompt will appear asking for a disc, choose the Ubuntu ISO file and click ''Start''.
    Ubuntu will start, once you''re free to try Ubuntu or use the install icon to
    install Ubuntu onto the virtual disk. For extended use in the virtual machine''s
    settings, you will need to enable 3D acceleration.


    If you want to keep using the virtual version of Ubuntu ensure it provides better
    scenarios like desktop integration, copy-paste and seamless dragging from the
    virtual machine to Ubuntu. To run this in VirtualBox, once the optical disc select
    Devices > Insert Guest Additions CD... What is this? After installing, a new window
    would open if you want to run the disc, click ''Run'' and allow the software to
    install, then you can restart.


    This will work for you using a write tool, like Unetbootin. This can be helpful
    if your device doesn''t have an optical drive and you want to run the downloaded
    disc. Visit http://www.unetbootin.com/download/


