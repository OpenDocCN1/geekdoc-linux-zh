  md: '# # Backup Folder: Don''t lose your data


    Anymone who has worked in Tech Support will tell you that the most heartbreaking
    calls come from people who have lost data due to a computer error or failure.
    Ubuntu saves you so you can have peace of mind.


    Before proceed, it is best to buy an external hard drive that you will use for
    backing up. While the backup Deja Dup is used to delete older files in backups
    when newer to save space, try to get a large hard drive as possible to have more
    versions available.


    Remember that extras helps protect your data from physical damage like fire, as
    well as software errors. Try to keep your data in a separate location on the hard
    side of the window when carrying out backups.


    # ## Backup Basics


    Click the search bar and type "backups" to launch the backup manager. You will
    see Ubuntu asks to install software before using backups. Click Install. You will
    need to enter your password to confirm you install


    Once this is complete, the Backup manager will tell you that you have no scheduled
    and you should enable automatic backups or click Backup Now.


    First clicks on Folder to save the data on the left side of the window. Your default
    Folder is selected. This contains your Documents, Pictures, Downloads, Music and
