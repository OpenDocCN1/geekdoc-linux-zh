    ## NFS Client


    ### Ubuntu and Debian Server


    To install the NFS server on Ubuntu and Debian use the `apt-get install` command.


    ```bash

    sudo apt-get install nfs-kernel-server

    ```


    ### Fedora Server


    To install the NFS server on Fedora use the `dnf install` command.


    ```bash

    sudo dnf install nfs-utils --best

    ```


    ## Firewalls


    If your Linux system has a host based firewall installed and running you will
    have to open up the port for `NFS`, TCP and UDP port 2049, inbound in order to
    allow incoming connections. There are security risks with running any protocol
    such as `NFS` on a Linux system so make sure that you have the system properly
    configured and placed in the network before opening a port on the firewall.


    The following subsections will be covered in this section:


    - *Ubuntu and Debian*

    - *Fedora*


    ## Ubuntu and Debian


    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall
    configurations, however the firewall is not configured by default. To open TCP
    and UDP port 2049 using the following command:


    ```bash

    sudo ufw allow in nfs

    ```


    ## Fedora


    Fedora uses firewalld to control basic firewall configurations and the firewall
    is configured by default. To open TCP and UDP port 2049 using the following commands:


    ```bash

    firewall-cmd --permanent --add-service=nfs

    firewall-cmd --reload

    ```


    ### /etc/exports


    Following the installation of the server /etc/exports file needs to be edited
    to add directories that you want to make available via NFS.


    ```bash

    sudo vi /etc/exports

    ```


    The syntax for entries in the exports file are as follows:


    directoryhosts(options)


    The directory is the local directory that you want to share.


    The hosts are hosts that should be allowed to access the share. You can use an
    IP address, network ID, hostname, or * which means all hosts.


    The options control the permissions for the share. The following are the common
    options:


    - ro - Read only access

    - rw - Read and write access

    - no_root_squash - Allows the root user from the client to have root permission
    on the server.

    - no_subtree_check - disables the verifications of directory subtrees if an entire
    volume is shared to speed up access time.

    - sync - Prevents data corruption


    The following are examples of shares in the /etc/exports file:


    Share the /home directory with any IP address and provide Read and Write permissions:


    ```bash

    /home *(rw)

    ```


    Share the /home directory with IP address 192.168.1.3 and provide Read only permissions:


    ```bash

    /home 192.168.1.3(ro)

    ```


    Share the /home directory with IP address 19.168.1.3 (Read and Write) and 192.168.1.4
    (Read Only) and allows root to have permissions:


    ```bash

    /home 192.168.1.3(rw,no_root_squash) 192.168.1.4(ro,no_root_squash)

    ```


    Once you edit the /etc/exports file you must restart the nfs service:


    For Ubuntu and Debian:


    ```bash

    sudo systemctl restart nfs-kernel-server.service

    ```


    For Fedora:


    ```bash

    sudo systemctl restart nfs-server.service

    ```


    ## NFS Client


    In order to connect from a Linux system to an NFS server the system must have
    an NFS client and the user using the client must have a matching username and
    password on the server.


    - Ubuntu and Debian

    - Fedora

    - mount


    ### Ubuntu and Debian


    To install the NFS client on Ubuntu and Debian use the apt-get install command.


    ```bash

    sudo apt-get install nfs-common

    ```


    ### Fedora


    To install the NFS client on Fedora use *dnf install* command.


    ```bash

    sudo dnf install nfs-utils --best

    ```


    ### mount


    In order to access *NFS* shares on an *NFS* server you must mount the share to
    a local directory that is empty.


    To make an empty directory use the *mkdir* command:


    ```bash

    mkdir ~/mydir

    ```


    To mount the share in the empty directory, use the *mount* command. The syntax
    is as follows:


    ```bash

    sudo mount ip_address:share_name local_directory

    ```


    In the example below the *mount* command is used to mount the */home* folder on
    the *NFS* server with the IP address 192.168.56.163 and *mount* it in the local
    folder *myfolder*.


    ```bash

    matt@matt-laptop:~$ sudo mount 192.168.56.163:~/myfolder

    [sudo] password for matt: ***********

    matt@matt-laptop:~$ cd myfolder

    matt@matt-laptop:~/myfolder$ ls

    matt

    ```


    To mount the share automatically during boot add the share information to the
    /etc/fstab file:


    192.168.56.163:/home ~/myfolder nfs rw 00


