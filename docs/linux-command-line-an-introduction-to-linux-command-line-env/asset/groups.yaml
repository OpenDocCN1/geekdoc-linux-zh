    ```


    If you want to get rid of the entire array, you can do that by unsetting it.


    ```

    aka@localhost ~]$ unset myworld[*]

    aka@localhost ~]$ echo ${myworld[*]}

    ```


    Variable arrays are not portable to other shell environments, that’s why they
    are not the foremost option to be used with Linux operating system users.


    ## Chapter 3. Using the Terminal And Virtual Consoles


    Before you do anything from the command line, you have to first actually access
    the command line interface. When you boot up Ubuntu or Linux Mint or another Linux
    distribution with a graphical interface, you might wonder how to even get to the
    command line. In this chapter, we''ll discuss how to reach the command-line interface
    both from a GUI-based Linux distribution and a CLI-based one. We''ll also show
    you how to have multiple command-line windows open at once, whether in the GUI
    or in a pure CLI environment.


    ## ACCESSING THE COMMAND LINE FROM A CLI-BASED DISTRIBUTION


    Some Linux distributions, such as Ubuntu Server, do not include a GUI. For such
    distributions, getting to the command line isn''t hard. You simply boot up the
    computer or server, and the system goes to the logon prompt. Enter your username
    and password, and you will log into the system and arrive at the command line
    prompt, also known as a terminal session. The term terminal dates back to the
    days when UNIX ran on large mainframes accessed via remote terminals.


    Sometimes you might see a blank screen on a CLI Linux machine that''s powered
    up. This is no cause for panic – to save power, the system is usually configured
    to power off the screen after a set interval of inactivity. Simply tap the space
    bar to awaken the display once more.


    ## ACCESSING THE COMMAND LINE FROM A GUI-BASED DISTRIBUTION


    Accessing the command line from a GUI-based Linux distribution is a little trickier.
    By default, a GUI-based distribution boots into the graphical interface. Even
    within the GUI, it''s simple to access a command prompt. There are two common
    ways of doing so.


    The first and most common is an application called a terminal emulator. As the
    name implies, a terminal emulator recreates the command line environment, but
    within a window of your GUI. You can access the full range of Linux commands from
    the terminal emulator application, but you can still use the benefits of the GUI
    - the mouse, the menu bar, and copying & pasting. (Copy & paste is particularly
    useful, since you can copy and paste complex and lengthy commands into the terminal
    emulator without the hassle of typing.)


    Almost all desktop Linux distributions include a terminal emulator application.
    You can usually launch it by going to the Applications menu, then to the Accessories
    category, and finally by clicking on the Terminal icon. If your distribution comes
    with a quick-launch bar (like Ubuntu’s Unity Launcher), very often the icon for
    the terminal emulator is pinned to the launcher.


    The second way to access the command line in a Linux GUI is through what’s called
    a virtual console. We’ll discuss virtual consoles in this chapter, but first we’ll
    describe how to open multiple terminal windows.


    ## OPENING MULTIPLE TERMINAL WINDOWS IN THE GUI


    One nice feature of working with the terminal emulator application in the GUI
    is the ability to open multiple terminal windows. There are several advantages
    to running multiple terminal windows – if you run a command that displays real-time
    output (like the top monitoring command), you can open a new window to execute
    additional commands. Or if you''re running a command that take a long time to
    process, like copying several gigabytes of files, you can open a new window and
    run another command while the first finishes working.


    Most terminal emulator applications support opening a new terminal window. To
    do so, you usually go to the File menu and select either New Window or New Terminal.
    A new terminal window will open up.


    If you don''t want to clutter up your desktop with a bunch of windows, most terminal
    applications now offer tabs, like the Mozilla Firefox and Google web browsers
    allow you to open new tabs for different web pages. If you open new tabs in the
    terminal emulator, a row of tabs will appear below the menu bar, each containing
    a separate terminal session. Usually, you can open new tabs by going to the File
    menu and clicking on New Tab.


    Obviously a graphical terminal application will not work in the command line environment.
    It is nonetheless possible to run multiple terminal windows from the command line
    using virtual consoles, which we will discuss in the next session.


    ## VIRTUAL CONSOLES


    A virtual console is, essentially, a second connection to the same computer. Remember
    that Linux was based upon UNIX, and most early early UNIX machines were massive
    mainframe computers. To connect to those mainframes, users employed remote consoles
    or dumb terminals. Because UNIX was a multi-user operating system, multiple users
    could log into the mainframe at the same time from different consoles.


    Virtual consoles are a legacy of those mainframes. Most Linux versions support
    a maximum of seven virtual consoles, software consoles built into the operating
    system that mimic the function of those old dumb terminals. Basically, a user
    can log into the operating system using one of those virtual consoles, and then
    a second user could switch to a different virtual console and log in, leaving
    the first user''s session unaffected (though they would, course, have to share
    the keyboard and mouse).


    As we mentioned, Linux supports seven virtual consoles. To switch between virtual
    consoles, press the CTRL-ALT-FUNCTION# keys simultaneously. So to switch to virtual
    console one, you would hit CTRL-ALT-F1, switch to virtual console 2, CTRL-ALT-F2,
    and so forth. When you switch to a new virtual console, you''ll see a standard
    prompt to log in. You (or another user) can then log into the virtual console
    without affecting your original session.


    If you have a version of Linux running a GUI, you can also use virtual consoles.
    By default, the GUI runs in virtual console seven (CTRL-ALT-F7). You can switch
    to any of the other six virtual consoles. When you are finished, you can return
    to the GUI by hitting CTRL-ALT-F7.


    ## Chapter 4. More to know about Files


    I''m sure that you are eager and keen to get stuck into more commands and begin
    doing some actual playing around the system. We need to cover some theories first
    before we get into that. When you begin to play around with the system you are
    able to understand why it is behaving in such a way and you can also be able to
    learn the commands further.


    ## Everything is a file


    The first thing that we need to know is that everything is a file. For example,
    a text file is a file, your keyboard is a file, a directory is a file and even
    a monitor is a file.


    ## Linux is an Extensionless System


    A file extension is usually a set of 2 – 4 characters subsequent to the end of
    the file, which determines the type of file it is.


    Common extension includes:


    - File.exe – an executable program or file

    - File.txt – a plain text file.


    ## File [path]


    ## Case Sensitivity


    Many people who are new to learning Linux struggle with one specific problem –
    while many other systems, such as Windows, don’t pay attention to the case of
    a character in file reference, Linux does. Thanks to this feature, it’s possible
    to have multiple files or directories than have the same name, letters in different
    cases.

