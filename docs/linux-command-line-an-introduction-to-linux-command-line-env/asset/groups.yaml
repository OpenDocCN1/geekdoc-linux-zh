    # Testing Your DNS Server


    As we mentioned above, if your DNS server stops responding, you can have all sorts
    of network problems. When it''s working right, you will forget that it''s there.
    But it goes bad, everything grinds to a halt. Without it, you can''t type addresses
    into the address bar of your web browser, or use any network resources that depend
    upon DNS.


    To diagnose your DNS server, you can use a command called nslookup. The nslookup
    command provides the IP address of your current DNS server, and also runs a test
    lookup against the server to see if it is functioning. For example, if you wanted
    to determine if your DNS server was operational, you would do so with this command:


    ```

    nslookup distrowatch

    ```


    The output would look something like this:


    ![](img/12fa978ca0d488232e696056d63d8bb6_41_0.png)


    The first two lines list the DNS server your computer is using. In this case,
    we are using a DNS server with an IP address of 192.168.2.1. The second group
    of lines shows the result of the lookup preformed – the IP address'
  - '[PAGE 42]


    of distrowwatch.org. In this case, you can see that distrowwatch.org has an IP
    address of 66.180.174.35. Since nslookup successfully returned an IP address for
    distrowwatch.org, you know that your DNS server is functioning correctly.


    # Testing Connectivity


    If you’ve ever had to repair a computer (or even used one, for matter), you know
    that network and Internet connection problems are a depressingly common occurrence.
    Fortunately, the command line’s tools are useful for obtaining valuable information
    about any network problems.


    The first and most commonly used network-diagnostic command is the ping command.
    The ping command stands for Packet Internet Groper, and it relies upon the ICMP
    protocol, the Internet Control Message Protocol. Basically, the PING command sends
    a packet to a network destination, such as a server or another PC, and if the
    destination is active, it sends back an acknowledgment packet. For instance, if
    you wanted to ping the PC at the IP address of 192.168.1.2, you would use this
    command:


    ```

    ping 10.10.11.254

    ```


    If 10.10.11.254 is up, the ping command will generate an output like this:'
  - '[PAGE 43]


    ![](img/12fa978ca0d488232e696056d63d8bb6_43_0.png)


    The ping command will continue pinging the target until you hit CTRL-C to cancel
    the command.


    The command also has a few command options you can use to alter its performance.
    The -c option tells ping to send a set number of packets and then stop. For example,
    if you only wanted to ping 192.168.1.2 six times, you would use this command:


    ```

    ping -c 6 192.168.1.2

    ```


    Note that the ping command will not always work, even if a remote destination
    has an active network connection. This is because some operating systems by default
    block ICMP traffic. However, enough devices do permit'
  - '[PAGE 44]


    ICMP traffic to make PING a useful diagnostic tool.


    # Tracing Paths


    Sometimes your network connection is active, but you can’t access a particular
    destination. In this case, the traceroute command becomes useful. The traceroute
    command maps the network route from your computer to the destination, and sends
    every device in the path an ICMP packet. You can then see which devices in the
    path are not responding, and then hopefully determine a solution. For instance,
    to trace the path to 10.10.11.254, you would use traceroute like this:


    ```

    traceroute 10.10.11.254

    ```


    The output will look something like this, with one line for each hop (another
    device in the chain) to the destination:'
  - '[PAGE 45]


    ![](img/12fa978ca0d488232e696056d63d8bb6_45_0.png)


    The traceroute command by default runs up to thirty hops.'
