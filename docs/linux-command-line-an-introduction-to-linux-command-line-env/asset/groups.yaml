    Connecting to a server


    To connect to an FTP server from the CLI use the ftp command followed by either
    the IP address or hostname of the server. In the example below ftp command is
    used to connect to the IP Address 192.168.10.10.


    ```

    matt@matt-laptop:~$ ftp 192.168.10.10

