    ## Running Processes in the Foreground and Background


    Up to this point all the commands have been executing in the foreground. When
    a command, process, or program is running in the foreground shell prompt will
    not be displayed until exits. For long running programs it is convenient to send
    them to the background. Processes that backgrounded still execute and perform
    their task, however they do not block you from entering further commands at the
    shell prompt. To background a process, place an ampersand (&) at the end of the
    command.


    & - Start command in the background.

    - Ctrl-c - Kill the foreground process.

    - Ctrl-z - Suspend the foreground process.

    - bg [%num] - Background a suspended process.

    - fg [%num] - Foreground a background process.

    - kill [%num] - Kill a process by job number or PID.

    - jobs [%num] - List jobs.


    ```

    $ /long-running-program &

    [1] 22686

    $ ps -p 22686

    PID TTY TIME CMD

    22686 pts/1 00:00:00 long-running-program

    $ jobs

    [1]+ Running ./long-running-program

    $ fg

    ./long-running-program

    ```


    When a command backgrounded two numbers are displayed. The number in brackets
    is the job number and can be referred to with the percent sign. The second number
    is the PID. Here is what it looks to start multiple processes in the background:


    ```

    $ /long-running-program &

    [1] 22703

    ```

    ```

    $ /long-running-program &

    [2] 22705

    $ /long-running-program &

    [3] 22707

    $ /long-running-program &

    [4] 22709

    $ jobs

    + [1] Done /long-running-program

    [2] Done /long-running-program

    [3]- Running /long-running-program &

    [4]+ Running /long-running-program &

    ```


    The plus sign (+) in the jobs output represents the current job while the minus
    sign (-) represents the previous job. The current job is considered to be the
    last job that was stopped while it was in the foreground or the last job started
    in the background. The current job can be referred to by % or %+. If no job information
    is supplied to the fg or bg commands, the current job is operated upon. The previous
    job can be referred by %-.


    You will notice that jobs 1 and 2 are reported as done. The shell does not interrupt
    your current command line, but will report job statuses before a new prompt is
    displayed. For example, if you start a program in the background a prompt is returned.
    The shell will not report the status of the job until a new prompt is displayed.
    You can request a new prompt be displayed by simply hitting Enter.


    To bring a job back to the foreground, type the name of the job or use the fg
    command. To foreground the current job execute %%, %+, fg %%, fg %+, or fg %num.
    To foreground job number 3, execute %3 or fg %3.


    ```

    $ jobs

    [3]- Running /long-running-program &

    [4]+ Running /long-running-program &

    $ fg %3

    ./long-running-program

    ```


    To pause or suspend a job that is running in the foreground, type Ctrl-z. Once
    a job is suspended it can be resumed in the foreground or background. To background
    a suspended job type the name of the job followed by an ampersand or bg followed
    by the job name.


    ```

    $ jobs

    [1] Running /long-running-program &

    [2]- Running /long-running-program &

    [3]+ Running /another-program &

    $ fg

    ./another-program

    ^Z

    [3]+ Stopped /another-program

    $ jobs

    [1] Running /long-running-program &

    [2]- Running /long-running-program &

    [3]+ Stopped /another-program

    $ bg %3

    [3]+ /another-program &

    $ jobs

    [1] Running /long-running-program &

    [2]- Running /long-running-program &

    [3]+ Running /another-program &

    ```

    $


    You can stop or kill a background job using the kill command. For example, to
    kill job number 1 execute kill %1. To kill a job that is running in the foreground,
    type Ctrl-c.


    - $ jobs

    [1] Running /long-running-program &

    [2]- Running /long-running-program &

    [3]+ Running /another-program &

    $ kill %1

    [1] Terminated /long-running-program

    $ jobs

    [2]- Running /long-running-program &

    [3]+ Running /another-program &

    $ fg %2

