    ## Firewalls


    If your Linux system has a host based firewall installed and running you will
    have to open up the port for `NFS`, TCP and UDP port 2049, inbound in order to
    allow incoming connections. There are security risks with running any protocol
    such as `NFS` on a Linux system so make sure that you have the system properly
    configured and placed in the network before opening a port on the firewall.


    The following subsections will be covered in this section:


    - *Ubuntu and Debian*

    - *Fedora*


    ## Ubuntu and Debian


    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall
    configurations, however the firewall is not configured by default. To open TCP
    and UDP port 2049 using the following command:


    ```bash

    sudo ufw allow in nfs

    ```


    ## Fedora


    Fedora uses firewalld to control basic firewall configurations and the firewall
    is configured by default. To open TCP and UDP port 2049 using the following commands:


    ```bash

    firewall-cmd --permanent --add-service=nfs

    firewall-cmd --reload

    ```


