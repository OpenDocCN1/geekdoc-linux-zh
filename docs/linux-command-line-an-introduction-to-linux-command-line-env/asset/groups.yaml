    of other users online. If you are an operator of an internet host that shares
    data to others, you definitely will want to use your computer''s Internet services,
    such as file transfer protocol (FTP). However, these servers always have a vulnerability
    that criminal hackers may possibly exploit. For this reason, you will want to
    take extra precaution in order to lessen the risk of being attacked. At the same
    time, you will also want to protect your network from users outside your network,
    especially as you communicate with other computers through the web.


    # Ensuring Password Security in Linux


    Unix passwords are historically stored in a file named /etc/passwd, which can
    be read by any user. For example, the file entry for /etc/passwd for a computer''s
    root user may


    `root:t6Z7NWDK1K8sU:0:0:root:/root:/bin/bash`


    appear like this:


    You will notice that colons separate the fields in this file, with the second
    field displaying the user’s password in an encrypted form. For the system to verify
    whether an entered user password is valid, the program that uses the password
    encrypts the entry and then compares the result with the encrypted text that was
    stored in the /etc/passwd file. If the entries match, then the user can use the
    program.


    However, any hacker can easily decrypt passwords using a dictionary attack – a
    type of decrypting method by trying out possible combinations in an encrypted
    password to find out the plaintext equivalent. If you have access to the /etc/passwd
    file, then you are only a few steps away from being able to crack a password.
    If you are not an authorized user of the computer that you are trying to hack,
    then you can make use of possible vulnerabilities in the target''s web services,
    such as the FTP and mailing services, in order to infiltrate and get the file
    that you want.


