    ## 第 3 章：使用终端和虚拟控制


    在从命令行执行任何操作之前，你必须首先实际访问命令行界面。当你启动 Ubuntu、Linux Mint 或另一个带有图形界面的 Linux 发行版时，你可能会好奇该如何进入命令行。在本章中，我们将讨论如何从基于
    GUI 的 Linux 发行版和基于 CLI 的发行版进入命令行界面。我们还将向你展示如何同时打开多个命令行窗口，无论是在 GUI 还是纯 CLI 环境下。


    ## 从基于 CLI 的发行版中访问命令行


    某些 Linux 发行版（如 Ubuntu Server）不包含 GUI。对于此类发行版，进入命令行并不困难。你只需要启动计算机或服务器，系统就会进入登录提示符。输入你的用户名和密码，你将登录系统并到达命令行提示符，也称为终端会话。“终端”（terminal）一词可以追溯到
    UNIX 运行在通过远程终端访问的大型主机上的时代。


    有时，你可能会在已启动的 CLI Linux 机器上看到空白屏幕。这并不引起恐慌——为了节电，系统通常配置为在空闲一段时间后关闭屏幕。只需按下空格键即可再次唤醒显示器。


    ## 从基于 GUI 的发行版中访问命令行


    从基于 GUI 的 Linux 发行版访问命令行稍微复杂一点。默认情况下，基于 GUI 的发行版启动到图形界面。即使在 GUI 内部，访问命令行提示符也很简单。有两种常用方法。


    第一种最常见的方法是使用名为终端模拟器（terminal emulator）的应用程序。顾其名，终端模拟器在你的 GUI 窗口内重建命令行环境。你可以从终端模拟器应用程序访问全范围的
    Linux 命令，但你仍然可以使用 GUI 的优点——鼠标、菜单栏以及复制与粘贴。（复制与粘贴特别有用，因为你可以将复杂冗长的命令复制并粘贴到终端模拟器中，而无需忍受输入的麻烦。）


    几乎所有的桌面 Linux 发行版都包含一个终端模拟器应用程序。你通常可以通过“应用程序”菜单，然后进入“附件”类别，最后点击“终端”图标来启动它。如果你的发行版带有快速启动栏（如
    Ubuntu 的 Unity 启动器），终端模拟器的图标通常会固定在启动器上。


    在 Linux GUI 中访问命令行的第二种方法是通过虚拟控制台。


