    the operating system more secure, which include the following:


    # Shadow Passwords


    Leaving passwords in locations that are easily accessible is bad security, even
    though these passwords are encrypted. For this reason, Linux no longer makes it
    a practice to store passwords in /etc/passwd file, which everyone access – passwords
    are now stored in a shadow password file, which is named /etc/shadow, that only
    the root user can access.


