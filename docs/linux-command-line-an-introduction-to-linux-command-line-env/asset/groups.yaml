    # Chapter 11. I/O Direction


    Almost all of the Linux commands that you will encounter have a common feature
    – they are all received from your system’s standard input (your keyboard, for
    example), and then written to the standard output (your computer monitor). The
    standard error device receives any error messages that you may get. In Linux,
    these devices are called the following:


    +   - stdin – standard input

    - stdout – standard output

    - stderr – standard error


    These are also called streams, which define how inputs and outputs are distributed
    in a Linux environment.


    Commands get the necessary input that they need from files, and in turn, they
    sent their outputs to another line. This entire process has a rather highfalutin
    name, called the I/O (input/output) redirection.


    # Redirecting Streams


    If you want Linux to redirect the commands for these streams, you will need to
    enter a command that will do so. What happens is that Linux will write the output
    to a particular file. If the file does not exist, your operating system will create
    a file with the name that you included in your command.


    Note: If you use a command with a single bracket, the command will overwrite the
    contents of the existing destination.


    Here is a table of the most common I/O redirection commands:


    Image source: Linux All-in-One for Dummies


    When you interact with the Linux terminal, your computer recognizes your input
    devices, such as your mouse and keyboard, to be the ones that should be transmitting
    commands. The standard output and error, on the other hand,'
  - '[PAGE 129]


    are displayed on your screen as a text displayed in a terminal.


    What do you get when you manage to change the input and the output directions
    of your commands? Being able to do so allows you to make more complex tasks in
    your operating system. For example, if you are trying to manage your files or
    when you use Linux for software development, being able to manipulate I/O streams
    will allow you to become more efficient.


    # Getting Your Input from a File


    If you need a command to take instructions from a particular file, you can instruct
    Linux to make use of that particular file as the standard input instead of your
    keyboard. For example, key in the command:


