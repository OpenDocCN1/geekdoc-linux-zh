    \n# CONCLUSION\n\n# Introduction\n\nLinux is the name for the kernel of an operating\
    \ system that is based on the UNIX principles. The name is derived from the first\
    \ name of its Finnish inventor, Linus Torvalds, and follows the methodology used\
    \ by other UNIX-based systems (the last letter is an x). Today, Linux is developed\
    \ and maintained by thousands of people around the world.\n\nThe kernel of an\
    \ operating system is its heart. It is required for communication between the\
    \ hardware of your computer and you, the user. An operating system is a collection\
    \ of different software components: a kernel, various tools and the accompanying\
    \ libraries. It is a software that extends the basic operating system of your\
    \ computer, known as the BIOS.\n\n## 1.1 From UNIX to Linux\n\nThe history of\
