    ## 测试你的 DNS 服务器


    如上文所述，如果你的 DNS 服务器停止响应，你可能会遇到各种网络问题。当它工作正常时，你甚至会忘记它的存在。但一旦它出现故障，一切都会陷入停滞。没有它，你无法在网络浏览器的地址栏中输入地址，也无法使用任何依赖
    DNS 的网络资源。


    要诊断你的 DNS 服务器，你可以使用名为 `nslookup` 的命令。`nslookup` 命令可以提供你当前 DNS 服务器的 IP 地址，并对该服务器运行测试查找以检查其是否运行正常。例如，如果你想确定
    DNS 服务器是否正在运行，可以使用此命令：


    ```

    nslookup distrowatch

    ```


    输出结果类似于所示：


    ![](img/12fa978ca0d488232e696056d63d8bb6_41_0.png)


    前两行列出了你的电脑正在使用的 DNS 服务器。在这种情况下，我们正在使用 IP 地址为 `192.168.2.1` 的 DNS 服务器。第二组行显示了查找结果——`distrowwatch.org`
    的 IP 地址。在这种情况下，你可以看到 `distrowwatch.org` 的 IP 地址为 `66.180.174.35`。由于 `nslookup`
    成功返回了 `distrowwatch.org` 的 IP 地址，你就知道你的 DNS 服务器运行正常。


    ## 测试连接性


    如果你曾经修理过电脑（或者用用过），你就知道网络和互联网连接问题是非常令人沮丧的常见现象。幸运的是，命令行工具对于获取任何网络问题的有用信息。


    第一个且最常用的网络诊断命令是 `ping` 命令。`ping` 代表“Packet Internet Groper”（数据报文分组者），它依赖于 ICMP
    协议（互联网控制消息协议）。基本上，PING 命令向网络目标（如服务器或另一台 PC）发送数据包，如果目标处于激活状态，它会回一个确认包。例如，如果你想 ping
    IP 地址为 `192.168.1.2` 的电脑，可以使用此命令：


    ```

    ping 10.10.11.254

    ```


    如果 `10.10.11.254` 处于在线，`ping` 命令将生成如下输出：


    ![](img/12fa978ca0d488232e696056d63d8bb6_43_0.png)


    `ping` 命令将持续 ping 目标，直到你按下 CTRL-C 取消命令。


    该命令还有几个可以使用来更改其性能的选项。`-c` 选项告诉 `ping` 发送指定数量的数据包然后停止。例如，如果你只想 ping `192.168.1.2`
    六次，可以使用此命令：


    ```

    ping -c 6 192.168.1.2

    ```


    注意，`ping` 命令并不总是奏的，即使远程目标具有活跃的网络连接。这是因为某些操作系统默认会阻止 ICMP 流量。然而，有足够的设备允许 ICMP 流量，这使得
    PING 成为一个实用的诊断工具。


    ## 追踪路径


    有时你的网络连接是激活的，但你却无法访问特定的目标。在这种情况下，`traceroute` 命令就变得很有用。`traceroute` 命令会映射从你的电脑到目的地的网络路由，并向路径中的每个设备发送
    ICMP 数据包。你随后可以看到路径中哪些设备没有响应，并希望此确定解决方案。例如，要追踪到 `10.10.11.254` 的路径，你可以这样使用 `traceroute`：


    ```

    traceroute 10.10.11.254

    ```


    输出结果类似于所示，每一行代表通往目的地的每一跳（hop，即链中的另一个设备）：


    ![](img/12fa978ca0d488232e696056d63d8bb6_45_0.png)


    `traceroute` 命令默认运行三十跳。


    ## 第 6 章 启动与关机


    ### 概述


    本章涵盖了用于启动和关机 Unix、Linux 和 BSD 系统的命令。它还提供了流行平台特定服务控制命令的概述。


    ### 本节涵盖的命令：


    - shutdown

    关机系统。


    - poweroff

    关闭系统电源。


    - reboot

    重启系统。


    - halt

    停止系统。


    - telinit

    更改运行级别（runlevel）。


    - runlevel

    显示之前的和当前的运行级别。


    - service

    管理 Linux 系统上的服务。


    - sysv-rc-conf

    显示并编辑 Linux 运行级别配置。


    - chkconfig

    在基于 Red Hat Linux 的系统上显示并编辑运行级别配置。


    - rc-update

    在 Gentoo Linux 系统上显示并编辑运行级别配置。


    - rc-status

    显示 Gentoo Linux 系统上的服务状态。


    - stopsrc/startsrc

    在 AIX 系统上停止/启动服务。


    - lssrc

    显示 AIX 系统上的服务状态。


    - svcs

    显示 Solaris 系统上的服务状态。


    - svcadm

    在 Solaris 系统上启动/停止服务。


    ### 本节使用的术语表：


    **Init (INITialization，初始化)**

    一个控制 Unix、Linux 和 BSD 系统启动（又初始化）的程序。


    **Runlevel（运行级别）**

    一组在系统启动期间（或由 init 命令调用时）加载的程序。


    **Service（服务）**

    一个提供 Web 服务器、DNS 服务器、电子邮件服务器等服务的系统程序。


    **shutdown（关机）**

    用途：关机系统。

    语法：`shutdown [OPTIONS] [TIME] [MESSAGE]`


    # shutdown now

    广播消息（来自 root）：

    系统正在立即关机！

    * 停止服务 [ OK ]

    * 终止进程 [ OK ]

    ...

    系统现在将停止。


    shutdown 命令的输出


    `shutdown` 命令用于关机本地系统。有几种不同的关机类型：halt、poweroff 和 reboot。


    注意：`shutdown` 命令的用法在各种 Unix、Linux 和 BSD 平台之间有所不同。本页示例适用于 Linux 系统。


    当执行 `shutdown` 命令时，会向所有登录系统的用户发送警告。可以在时间参数之后指定可选消息，如下例所示。


    # shutdown 2 保存你的工作并退出！

    广播消息（来自 root）：

    系统将在 2 分钟后关机！

    保存你的工作并退出！


    shutdown 命令的广播消息


    常用用法：


    - shutdown now

    立即关机。


    - shutdown [MIN]

    等待指定的分钟数后关机。


    - shutdown [HH:MM]

    在指定时间关机（24小时制）。


    - shutdown -r now

    重启系统。


    - shutdown -H now

    停止系统。


    - shutdown -P now

    关闭系统电源。


    - poweroff

    用途：关闭系统电源。


    语法：`poweroff`


    ```

    # poweroff

    广播消息（来自 root）：

    系统正在立即关机！

    * 停止服务 [ OK ]

    * 终止进程 [ OK ]

    ...

    系统现在将关闭。

    ```


    poweroff 命令的输出


    `poweroff` 命令将立即关机并关闭系统电源。它本质上是 `shutdown -P now` 的快捷方式。`poweroff` 命令存在于所有 Linux发行版以及某些
    BSD 和 Unix 系统。


    注意：要查看系统是否支持 `poweroff` 命令，请输入 `whereis poweroff`。


    警告：`poweroff` 命令不提供缓冲，执行时会立即关闭系统。


    常用用法：


    - poweroff

    关机并关闭电源。


    - reboot

    用途：重启系统。


    语法：`reboot`


    ```

    # reboot

    广播消息（来自 root）：

    系统正在立即重启！

    * 停止服务 [ OK ]

    * 终止进程 [ OK ]

    ...

    系统现在将重启。

    ```


    reboot 命令的输出


    `reboot` 命令用于优雅地重启系统。它本质上是 `shutdown -r now` 的快捷方式。在命令行执行 `reboot` 将立即重启系统，如上例所示。


    警告：`reboot` 命令不提供缓冲，执行时会立即重启系统。


