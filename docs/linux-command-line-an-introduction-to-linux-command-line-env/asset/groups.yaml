    five

    ```


    你可以看到构建变量数组是多简单。你可以使用特殊命令提取数组中的每个值。现在尝试以下操作来提取出整个数组。


    ```

    [aka@localhost ~]$ echo ${myworld[*]}

    one two three four five

    ```


    此之外，你还可以从数组中取消某个特定的值。


