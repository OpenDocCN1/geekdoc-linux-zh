    file contains. Because you used the < sign, you have managed to redirect the standard
    input, making Linux think that the stdin is the /etc/passwd file instead of your
    keyboard.


    # Sending Your Command Output to Another File


    If you want to have a record of a command’s output and save it as a file, you
    need to change the stdout to a file. For example, type the following command after
    changing into your home directory:


    Using this command will allow you to search all the files that contains the text
    typedef, and then saves the results in a file named typedef.out. The > sign redirects
    the standard output into the file that you indicated. Also note that the above
    command showed one bash feature: when an asterisk is used, you are essentially
    asking Linux to include all the files in the indicated directory, which in this
    case, all the files that are in the directory /usr/include.


    Tip: You can append or add an output to the end of an existing file rather than
    having to create another file to save your output, you can use the >>'
- md: '

    sign. Take note of this format:


