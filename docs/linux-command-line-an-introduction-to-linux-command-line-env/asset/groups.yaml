    ## 结论


    在当今时代，有千上万个理由你应该学习 Linux。即使你还没有准备好从当前的操作系统切换到基于 Linux 的系统，学习它们的运作也是一种有用的技能。最近的一项调查发现，雇主更倾向于雇佣通
    Linux 发行版的人，因为这表明你具有灵活性且多才多艺。在许多情况下，使用基于 Linux 的系统更为合适。


    Linux 社区也是另一个应该吸引你的点。那里有很多 Linux 用户乐于提供帮助。在大多数情况下，你遇到的任何问题可能在论坛中得到解决。所以，花点时间，注册账号并通过对话了解更多关于
    Linux 世界发生的事情。当你最终成为高级用户时，通过帮助他人来回馈社区。这正是 Linux 社区变得伟大并成为强大力量的原因。


    我们可以列举许多你应该使用 Linux 的理由，但最重要的一点是你拥有实验和尝试新事的自由。命令行赋予了你巨大的力量去理解和控制计算机如何工作、自由软件存储库、多桌面功能、硬件支持、在任何计算机上使用
    Linux、安全性以及与其他系统的互操作性。所有这些理由以及更多理由使得学习并精通 Linux 至关重要。


    如果你想要一个与 Windows 不同、更安全且在许多情况下比 Windows 更好的系统，Linux 终究是你的选择，因为你可以用它做很多事情，并且有许多自定义选项可以尝试，包括更改系统的某些方面。在这一方面，它不像像
    Windows 那样受限，这也是为什么许多人与其他系统相比时切换到 Linux 的原因。关于 Linux，你应该采取的下一步就是亲身尝试。


