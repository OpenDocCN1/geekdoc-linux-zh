    \n## UNIX Variants\n\nThe concept of UNIX became and the the and the the and the\
    \ the and the the and the-- with its variants:\n- NetBSD\n- OpenBSD\n- FreeBSD.\
    \ Today, Linux is the most popular free among developers.\n\n## The UNIX Philosophy\n\
    \nUNIX is designed with a number of principles. These cover portability, multi-tasking\
    \ and multi-user orientation. Furthermore, it is based on network connectivity.\
    \ The idea is to use one tool per task. In order to achieve more complex goals,\
    \ you would combine several tools into a chain. The following example combines\
    \ the two commands ‘ls’ and ‘wc’ by means of pipe to be able to count the number\
    \ of Python files in the current directory.\n\n```\n$ ls *.py | wc -l\n```\n\n\
    We will explain these commands and their usage in more detail later on.\n\n##\
    \ 1.2 A Brief History of Linux\n\nSimilar to UNIX, the Linux operating system\
    \ has different roots and is based on the work of quite a few masterminds. Among\
    \ others, this includes Richard M. Stallman, Andrew S. Tanenbaum and Linus Torvalds.\n\
    \nRichard M. Stallman, a hacker and developer at MIT, is the first president of\
    \ the Free Software Foundation (FSF), and the father of the GNU project. GNU abbreviates\
    \ the slogan GNU is Not UNIX. The goal of the project was to develop a free UNIX\
    \ operating system. Until the beginning of the 1990s a collection of tools was\
    \ available, but the kernel was missing. The next step for Linux came from Andrew\
    \ S. Tanenbaum. At that time, he was a professor at the University of Amsterdam.\
    \ For his students he developed Minix, an operating system for educational purposes\
    \ to demonstrate and understand the UNIX principles. As he pointed out, Minix\
    \ was not intended to be used in practice.\n\nLinus Torvalds, a Finish student\
    \ at the University of Helsinki, was a user of Minix and quite unhappy with its\
    \ boundaries. In 1990 he began to develop a new operating system based on the\
    \ ideas of Minix, the UNIX principles, and the POSIX standard. His motivation\
    \ was to have his own system that was understandable, and maximized to the boundaries\
    \ of the hardware. He also wanted to have fun, and had no commercial intent in\
    \ mind. The entire story behind Linux is described in his autobiographical book\
    \ titled Just for Fun.\n"
