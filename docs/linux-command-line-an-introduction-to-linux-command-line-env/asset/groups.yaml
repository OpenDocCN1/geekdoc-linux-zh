    \ Passwords)\n- PAM\n- 配置默认权限\n- 注意设置用户 ID 的权限\n\n# 结语\n\n# 引言\n\nLinux 是基于 UNIX\
    \ 原则的操作系统内核名称。该名字源于其芬兰发明者林纳斯·托瓦兹（Linus Torvalds）的首名，并遵循了其他基于 UNIX 的系统的方法论（最后一个字母是\
    \ x）。今天，Linux 由全球数千名人员开发和维护。\n\n操作系统的内核是它的心脏。它是计算机硬件与你（用户）之间通信所必需。操作系统是不同软件组件的集合：内核、各种工具以及附带库。它是扩展计算机基础操作系统（即\
    \ BIOS）的软件。\n\n## 1.1 从 UNIX 到 Linux\n\nLinux 的历史可以追溯到 20 世纪 90 代。为了理解 UNIX 背后的故事，我们还要简要回顾二战后的计算机早期阶段。\n\
    \n那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。那时，计算机占据了整栋楼，从机械组件到电子组件的转变正在进行。\n\
    \n## UNIX 变体\n\nUNIX 的概念演变为并带有其变体：\n- NetBSD\n- OpenBSD\n- FreeBSD。今天，Linux 是开发者中最受欢迎的免费系统。\n\
    \n## UNIX 哲学\n\nUNIX 的设计遵循若干原则。这些原则涵盖了可移植性、多任务和多用户导向。此外，它基于网络连接。其核心思想是每个任务使用一个工具。为了实现更复杂的目标，你会将多个工具组合成链。下面的示例通过管道组合了命令\
    \ `ls` 和 `wc`，用于计算 Python 文件的数量。\n\n```\n$ ls *.py | wc -l\n```\n\n我们将在以后详细解释这些命令及其用法。\n\
    \n## 1.2 Linux 简史\n\n与 UNIX 类似，Linux 操作系统有不同的起源，并基于许多位大师的作品。其中包括理查德·斯尔曼、安德烈斯·托瓦纳兹和林纳斯·托瓦兹。\n\
    \n理查德·斯尔曼是 MIT 的一名黑客和开发者，自由软件基金会（FSF）的第一任主席，也是 GNU 项目之父。GNU 的缩写是“GNU 不是 UNIX”。该的目标旨在开发一个自由的\
    \ UNIX 操作系统。直到 20 世纪 90 年初，已经有一系列工具可用，但缺少内核。Linux 的下一步进展来自安德烈斯·托瓦纳兹。当时，他是阿姆斯特丹大学的教授。他为学生开发了\
    \ Minix，一个用于教学、演示和理解 UNIX 原则的操作系统。正如他指出的，Minix 并非用于实践。\n\n林纳斯·托瓦兹是赫尔辛基大学的一名芬兰学生，他是\
    \ Minix 的用户并对其限制感到非常不满。1990 年，他开始开发一种基于 Minix 理念、UNIX 原则和 POSIX 标准的新操作系统。他的动力是拥有一个自己能理解且最大限度利用硬件边界的系统。他也想玩玩，并没有商业意图。Linux\
    \ 背后的整个故事都在他的自传书籍《乐趣》（Just for Fun）中描述。\n\n"
