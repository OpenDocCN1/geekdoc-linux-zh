    # Introduction


    Linux is the name for the kernel of an operating system that is based on the UNIX
    principles. The name is derived from the first name of its Finnish inventor, Linus
    Torvalds, and follows the methodology used by other UNIX-based systems (the last
    letter is an x). Today, Linux is developed and maintained by thousands of people
    around the world.


    The kernel of an operating system is its heart. It is required for communication
    between the hardware of your computer and you, the user. An operating system is
    a collection of different software components: a kernel, various tools and the
    accompanying libraries. It is a software that extends the basic operating system
    of your computer, known as the BIOS.


    1.1 From UNIX to Linux


    The history of Linux can be traced back to the 1990s. In order to understand the
    story behind UNIX, we also have to look back briefly at the early days of computing
    after the 2nd World War.


    At that time computing machines filled entire buildings and the transformation
    from mechanical to electronic components, like microprocessors and the usage of
    multi-layer circuits, was underway. Moreover, in the 1960s and 1970s hardware
    and software components were quite expensive and not standardized. Various vendor-specific
    platforms existed and each of them had their own interface, protocols to transfer
    and exchange data, as well as operating system. The communication between these
    single computing devices required specific knowledge and the understanding of
    its protocols. The development of UNIX was an aim to circumvent these obstacles
    and to simplify the usage of computing devices on a larger scale.


    UNIX'
  - '[PAGE 7]


    # UNIX Variants


    The concept of UNIX became licensed to several companies that developed and maintained
    their own variant of UNIX. This included Solaris/SUN OS (SUN Microsystems, nowadays
    owned by Oracle, AIX (IBM), Scenix (Siemens), SCO UNIX, Xenix (Microsoft), as
    well as HP-UX (Hewlett-Packard), NEXTSTEP, Mac OS (Apple) and Android (Google).


    Open-source implementations comprised of the Berkeley System Distribution (BSD)
    with its variants: NetBSD, OpenBSD, and FreeBSD. Today, Linux is the most popular
    free software among open source developers. There is also a strong commercial
    support for the systems mentioned above.


    # The UNIX Philosophy


    UNIX is designed with a number of strict principles in mind. These cover portability,
    multi-tasking and multi-user orientation in combination with a time-sharing approach.
    Furthermore, it is based on network connectivity following the TCP/IP scheme.


    The original development was done in the C programming language that resulted
    in independence from a hardware platform. Delivered with a selection of development
    tools and libraries, it allows you to easily extend it to your specific needs.
    It is simple, but has a powerful ability to automate tasks that supports complex
    but maintainable scripts.


    Similar to a toolbox, UNIX consists of a variety of tools. Each of them having
    a specific purpose and being designed exactly for that. The idea is to use one
    tool per task. In order to achieve more complex goals, you would combine several
    tools into a chain. The following example combines the two commands ‘ls’ and ‘wc’
    by means of a pipe to be able to count the number of Python files in the current
    directory.


    ```

    $ ls *.py | wc -l

    ```'
  - '[PAGE 8]


    6

    $


    We will explain these commands and their usage in more detail later on in the
    guide.


    # 1.2 A Brief History of Linux


    Similar to UNIX, the Linux operating system has different roots and is based on
    the work of quite a few masterminds. Among others, this includes Richard M. Stallman,
    Andrew S. Tanenbaum and Linus Torvalds.


    Richard M. Stallman, a hacker and developer at MIT, is the first president of
    the Free Software Foundation (FSF), and the father of the GNU project. GNU abbreviates
    the slogan GNU is Not UNIX. The goal of the project was to develop a free UNIX
    operating system. Until the beginning of the 1990s a collection of tools was available,
    but the kernel was missing. The entire software was published under the GNU Public
    License (GPL) around 1983.


    The next step for Linux came from Andrew S. Tanenbaum. At that time, he was a
    professor at the University of Amsterdam. For his students he developed Minix,
    an operating system for educational purposes to demonstrate and understand the
    UNIX principles. As he pointed out, Minix was not intended to be used in practice.


    Linus Torvalds, a Finish student at the University of Helsinki, was a user of
    Minix and quite unhappy with its boundaries. In 1990 he began to develop a new
    operating system based on the ideas of Minix, the UNIX principles, and the POSIX
    standard. His motivation was to have his own system that was understandable, and
    maximized to the boundaries of the hardware. He also wanted to have fun, and had
    no commercial intent in mind. The entire story behind Linux is described in his
    autobiographical book titled Just for Fun.'
- md: '

    Today, Linus Torvalds oversees the development of the Linux kernel.


    To make Linux attractive to the outside world it needed a nice logo. Based on
    a competition for mascots, a large number of proposals were handed in. Larry Ewing
    sent in his idea for a penguin as seen on the cover of this book, and his proposal
    won. Designed with a cheeky smile and a well-fed body this penguin, named Tux,
    represents the image of a happy and satisfied user.


    ## 1.3 Linux Range of Use


    Originally designed for Intel-based systems, Linux runs on a variety of platforms
    today. Among others this includes the ARM architectures (named arm and arm64),
    Motorola/Freescale''s 68k architecture (m68k), Intel x86 (i386 and amd64), IBM
    s390 (s390), PowerPC (powerpc) and SPARC (sparc).


    Right from the beginning Linux focused on server systems. It is in constant use
    as a web server, file server, mail and news server, internet gateway, wireless
    router and firewall. Used as a computing unit, it helped to render video sequences
    and entire films such as Titanic, Shrek and Toy Story. Furthermore, Linux is in
    use in automotive products, aeronautics, military, logistics and the engineering
    environment. Since 2006, Linux servers run all world’s stock exchanges. It also
    runs almost all search engines.


    Over the last decade Linux also conquered the desktop. Due to its high flexibility
    and stability, it works as a reliable setup for text processing, graphic design,
    desktop publishing, calculations in spreadsheets, communication (email, chat,
    audio, and video) as well as user interfaces for your phone and television.


    ## 1.4 Linux Certifications


    The widespread use of Linux has increased the demand for engineers and users who
    know exactly what they are doing. At this point a certification for Linux becomes
    advantageous. These certifications can be divided into programs that are general
    (not specific to a distribution) and focused (specific to a Linux distribution).
    The lists below give an overview of the primary certifications that currently
    exist.


    ## Chapter 1. Using the Linux


    If you are reading this book, you either have Linux and need some help learning
    how to use it, or you are thinking about getting Linux. For those who are still
    “on the fence” about making the switch to this operating system, this section
    should help you decide.


    One problem with technology fanatics is that they can be very biased — almost
    like sports fans. If you were to speak with someone who loves Linux, and has been
    using it for years, they might paint a very positive picture of it. In addition,
    they would probably tell you that the other operating systems are junk. However,
    someone loves Mac OS or Windows might inform you that Linux is junk, and that
    you shouldn’t bother to use it.


    Many people seem to believe that Linux is overly complicated, and that only truly
    dedicated tech-lovers could ever hope to figure out how to use it. That is untrue,
    and if you are worried that Linux is hard to use, leave those thoughts behind.
    There are versions of Linux that many believe are more user-friendly than anything
    else available.


    Now, with an open mind, take a look at some of the top reasons why you should
    choose to use Linux:


    - It is free. This is probably one of the biggest reasons for many people to choose
    anything. Of course, your computer probably came with an operating system already,
    and that would make this a minor factor. Have you thought about updates in the
    future? It will cost money to upgrade to the latest operating systems, in most
    situations. On the other hand, Linux is free and it will almost certainly be free
    long into the future.


    - Great with slow computers. Many people choose to install Linux on older, slower
    computers. If you are still using an old PC from 10 years ago, the chances are
    that it will run a new operating system well. Many people are happy running the
    operating system that came with their old computer. However, in time, these stops
    being supported, making them very insecure, and almost impossible to use in any
    productive way. There are some versions of Linux that are specifically designed
    to run on low-end hardware, so you can get more out of your old PC. But keep in
    mind that not all versions of Linux will run well on slower hardware.


    - Greater security. If you have been online much in your life, you are probably
    painfully aware of computer viruses. Even if you do have an antivirus on other
    computers, there is still a chance that your system will be corrupted. Linux users
    do not have to worry about computer viruses. In fact, you will not even need to
    install an antivirus on a computer running Linux.


    - Easy to use. Back in the early days of Linux, it certainly was a complicated
    system to use. However, that was some time ago, and things have greatly changed.
    Many people think that Linux is only for the truly “nerdy”, who know a lot about
    computers. That is far from the truth these days, and many versions of Linux are
    simple, with attractive interfaces, and lots of automation.


    - No need to find drivers. When you use a new piece of hardware, you will generally
    need a driver. This is a piece of software that tells your computer how to use
    your new piece of hardware, like a new printer, for example. With Linux, practically
    everything is plug-and-play. Just make sure your hardware is all supported, as
    mentioned earlier in this chapter.


    - The software repository. Think of this like the Linux “app store”. You don’t
    need to look around online, or worry about installing things manually, because
    Linux has you covered. In addition, software that you find in the repository will
    be compatible with your version of Linux, safe to use, and always updated automatically.


    - Updates are painless. Updates are often the bane of people’s computer using.
    If you have ever tried to use your computer, only to find that an automatic update
    has taken over — you will appreciate the ease of Linux updates. They are simply
    installed in the background, quickly and easily. You will not need to wait to
    shut down your computer either.


    - Attractive GUI. The GUIs (Graphical User Interfaces) of some versions of Linux
    are just beautiful. These include Unity, Gnome, and KDE, to name just a few. In
    comparison, Windows — and even Mac OS — can seem boring and even ugly. In addition
    to this, it’s possible to customize just how your interface looks, in many ways.


    If you are happy with your current operating system, you might have no good reasons
    to change over. However, if there are things that regularly bother you, it might
    be time to take a closer look at swapping to Linux.


    ## Chapter 2. Linux Environment Variables


    When talking about the bash shell, it is relevant to know about its features like
    the environment variables. These variables come handy in storing information about
    a particular shell session as well as the environment in which you have been working.
    With the help of these variables, you can feed information in the memory which
    can be accessed through running a script or simply by running a program.


    ### Global Variables


    This is simple to learn. These are the variables that can be accessed globally.
    In simple words, you can access them at any phase of the program. When you have
    declared a variable, it is fed into the memory of the system while you run the
    program. You can offer alterations in any function that may affect the entire
    program. Global variables are always displayed in capital letters.


    ```

    $aka@localhost ~$ printenv

    ```


    You have had a full list of global environment variables. Most of them are set
    during the login process. If you want to track down values of individual variables,
    you can do that with the help of echo command. Just don’t forget to add the $
    sign before the variable to get its value. Let’s look at the syntax.


    ```

    $aka@localhost ~$ echo $PWD

    ```


    ```

    /root

    ```


    ```

    $aka@localhost ~$

    ```


