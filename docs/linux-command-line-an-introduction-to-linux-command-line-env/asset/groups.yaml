    ## Passive Mode


    The FTP protocol can run in two modes, active or passive. Active mode uses two
    TCP ports, 20 and 21, and passive mode uses just TCP port 21. Most servers today
    run in passive mode but most FTP clients assume active mode by default. To make
    sure you are using the proper mode you must set the FTP client to passive mode
    using the passive command as in the example below:


    ```

    ftp> passive

    Passive mode on.

    ftp>

    ```


