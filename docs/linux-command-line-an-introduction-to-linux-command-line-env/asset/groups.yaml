    # Looking Out for Permissions to Set User ID


    There is a permission setting that can be seen as threatening to security,'
  - '[PAGE 170]


    which is called setuid or suid (set user ID). This permission setting applies
    to files that you can run, or executable files. When the setuid/suid permission
    is allowed, a file is executed under the owner''s user ID. In short, if the suid
    permission is on and the file is owned by the root user, the targeted program
    will view the root user to be the one running the file and not check on who ran
    the program in reality. This also means that the permission for suid will allow
    the program to do more functions than the owner intends all the other users to
    perform. It also helps to note that if the said program that contains the suid
    permission has some security vulnerabilities, criminal hackers can create more
    havoc through these programs.


    To find all enabled suid permissions, you can use the find command like this:


    ```

    find / -type f -perm +4000

    /bin/su

    /bin/ping

    /bin/eject

    /bin/mount

    /bin/ping6

    /bin/umount

    /opt/kde4/bin/fileshares

    /opt/kde4/bin/artswrapper

    /opt/kde4/bin/kcheckpass

    ```


