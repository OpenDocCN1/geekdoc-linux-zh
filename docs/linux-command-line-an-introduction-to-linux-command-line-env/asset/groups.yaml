    # Chapter 1. Using the Linux


    If you are reading this book, you either have Linux and need some help learning
    how to use it, or you are thinking about getting Linux. For those who are still
    “on the fence” about making the switch to this operating system, this section
    should help you decide.


    One problem with technology fanatics is that they can be very biased — almost
    like sports fans. If you were to speak with someone who loves Linux, and has been
    using it for years, they might paint a very positive picture of it. In addition,
    they would probably tell you that the other operating systems are junk. However,
    someone loves Mac OS or Windows might inform you that Linux is junk, and that
    you shouldn’t bother to use it.


    Many people seem to believe that Linux is overly complicated, and that only truly
    dedicated tech-lovers could ever hope to figure out how to use it. That is untrue,
    and if you are worried that Linux is hard to use, leave those thoughts behind.
    There are versions of Linux that many believe are more user-friendly than anything
    else available.


    Now, with an open mind, take a look at some of the top reasons why you should
    choose to use Linux:


    +   - It is free. This is probably one of the biggest reasons for many people
    to choose anything. Of course, your computer probably came with an operating system
    already, and that would make this a minor factor. Have you thought about updates
    in the future? It will cost money to upgrade to the'
  - '[PAGE 12]


    latest operating systems, in most situations. On the other hand, Linux is free
    and it will almost certainly be free long into the future.


    +   **Great with slow computers.** Many people choose to install Linux on older,
    slower computers. If you are still using an old PC from 10 years ago, the chances
    are that it will run a new operating system well. Many people are happy running
    the operating system that came with their old computer. However, in time, these
    stops being supported, making them very insecure, and almost impossible to use
    in any productive way. There are some versions of Linux that are specifically
    designed to run on low-end hardware, so you can get more out of your old PC. But
    keep in mind that not all versions of Linux will run well on slower hardware.


    +   **Greater security.** If you have been online much in your life, you are probably
    painfully aware of computer viruses. Even if you do have an antivirus on other
    computers, there is still a chance that your system will be corrupted. Linux users
    do not have to worry about computer viruses. In fact, you will not even need to
    install an antivirus on a computer running Linux.


    +   **Easy to use.** Back in the early days of Linux, it certainly was a complicated
    system to use. However, that was some time ago, and things have greatly changed.
    Many people think that Linux is only for the truly “nerdy”, who know a lot about
    computers. That is far from the truth these days, and many versions of Linux are
    simple, with attractive interfaces, and lots of automation.


    +   **No need to find drivers.** When you use a new piece of hardware, you will
    generally need a driver. This is a piece of software that tells your computer
    how to use your new piece of hardware, like a new printer, for example. With Linux,
    practically everything is plug-and-play. Just make sure your hardware is all supported,
    as mentioned earlier in this chapter.'
  - '[PAGE 13]


    +   **The software repository.** Think of this like the Linux “app store”. You
    don’t need to look around online, or worry about installing things manually, because
    Linux has you covered. In addition, software that you find in the repository will
    be compatible with your version of Linux, safe to use, and always updated automatically.


    +   **Updates are painless.** Updates are often the bane of people’s computer
    using. If you have ever tried to use your computer, only to find that an automatic
    update has taken over — you will appreciate the ease of Linux updates. They are
    simply installed in the background, quickly and easily. You will not need to wait
    to shut down your computer either.


    +   **Attractive GUI.** The GUIs (Graphical User Interfaces) of some versions
    of Linux are just beautiful. These include Unity, Gnome, and KDE, to name just
    a few. In comparison, Windows — and even Mac OS — can seem boring and even ugly.
    In addition to this, it’s possible to customize just how your interface looks,
    in many ways.


    If you are happy with your current operating system, you might have no good reasons
    to change over. However, if there are things that regularly bother you, it might
    be time to take a closer look at swapping to Linux.'
