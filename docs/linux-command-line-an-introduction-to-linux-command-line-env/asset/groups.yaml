    # Chapter 10. Sharing files commands


    When working in a network environment it is important to be able to share files
    between users and systems. Linux has multiple ways to share file between Linux,
    Windows, and Mac systems.


    +   * FTP

    * SFTP

    * HTTP/HTTPS

    * NFS

    * Samba


    FTP


    The FTP protocol is a quick and easy way to share files on the Internet or a network
    but is also insecure. The FTP protocol passes the username and password in clear
    text which can be captured by anyone able to capture traffic between the client
    and the FTP server. Due to security concerns, you should only use FTP to share
    files that do not need to be secured.


    On most Linux system you will need to install an FTP server if you want to makes
    files available via FTP. If you have to use FTP, make sure that the server you
    install the FTP server does not perform any critical function on the network.
    You should also not put an FTP server on your internal network that allows connections
    from outside the network or the Internet. If you need to share files with the
    Internet, your FTP server should be in the Demilitarized Zone (DMZ) on the firewall.


    # FTP Server install Ubuntu and Debian'
