    will prepare small text files. For example, if you want Linux to store all the
    things that you are writing and only stop when you type in ZZ and press enter,
    you can use this command:


    This means that your computer will be recording all the things that you are typing
    in your keyboard and will only stop when you press ZZ and Enter.


    # Saving Errors in Files


    There are situations wherein you enter a command and then Linux returns with several
    lines of error messages. These error messages may scroll too fast that you cannot
    figure out what really is going. When this happens, you have the option of saving
    these error messages in a file in order to know what really happened in the command
    by changing the standard error to a file that you can find later.


    Type in the following command in a terminal:


    This will look through your entire computer system for files that are named COPYING
    and will then save all the error to a file named finderr. The command 2> allows
    you to redirect the standard error to a file.


    # Pipes


    Type this command in the terminal:


    ```

    ls | less

    ```


    This command will pipe the data coming from ls, and then send it to the less command.
    The ls command is supposed to display the contents of a directory across numerous
    rows. When you pipe it to the less command, the directory entries are instead
    placed on a different line.


    # Filters


    Commands that change the output and the piped redirection are called filters.
    They are also standard commands on Linux that you can use without having to use
    pipes. Here are some of the filter commands that you can use on the terminal:


    - grep – gives results that matches a text that corresponds to a string pattern
    that is sent to grep command

    - tr – finds one string and then replaces it with another one

    - find – displays files that has names that match arguments that are sent to the
    find command

    - tee – redirects the standard input to one/multiple files and the standard output

    - wc – counts lines, characters, and words


    # Chapter 12. Commands for compressing and decompressing files


    To create a compress file with the tar extension that has the name file.tar


    ```bash

    tar cf file.tar files

    tar CF file.tar file1.c file2.cpp

    ```


    To unpack the file


    ```bash

    tar xf file.tar

    ```


    To create a compressed file by the Gzip program


    ```bash

    tar czf file.tar.gz files

    tar CZF file.tar.gz file1.c file2.cpp

    ```


    To decompress the file created by Gzip


    ```bash

    tar xzf file.tar.gz

    ```


    To create a file compressed by the Bzip2 program


    ```bash

    tar cjf file.tar.bz2 files

    tar CJF file.tar.bz2 file1.c file2.cpp

    ```


    To decompress the file created by Gzip


    ```bash

    tar xjf file.tar.bz2

    ```


    # Chapter 13. Wildcards in Linux


    There are numerous wildcards in Linux. Let’s examine them.


    ### The “* wildcard


    This is used to match one or more characters in a specified file. When you want
    to know the list of files in the current directory whose name start with the letter
    “f”, run the following command:


    ```bash

    ls f*

    ```


    The above command is demonstrated in the figure shown below:


    From the figure shown, it is clear that I have only two files whose name start
    with the letter “f” in the above directory. You can also use the wildcard to find
    out the files whose name end with a certain pattern. For example:


    To know all the files whose name end with ...me, run the following command:


    ```bash

    ls *me

    ```


    On my computer, the above command gives the following output:


    From the above figure it is very clear that only one file in the directory obeys
    the pattern specified.


    ### The “?” wildcard


    In Linux the above wildcard is used to match exactly one character. Run the the
    following command:


    ```bash

    ls f?

    ```


    The above command gives the following output in my computer:


    ### Getting Help


    It is also possible to get help in Linux. If you want to know more about a certain
    command, you can consult the manual files. To find out more about the command
    “ls”, run the following command:


    ```bash

    man ls

    ```


    The above command will tell you more about the “ls” command and the options associated
    with it. If you want a short description of the command, run the following command:


    ```bash

    whatis ls

    ```


    With the above command, the options associated with the command “ls” will not
    be displayed, so use it only when you are not interested in the options.


    If you are not sure how to write a certain command in Linux, use the command “apropos”
    to get help. For example:


    To find out the exact name of the “copy” command, type the following:


    ```bash

    apropos copy

    ```


    # Chapter 14. Advanced Linux Navigation commands


    ## Changing Directories and Finding Files


    So, to find any particular file that you want to edit, you must first learn how
    to get to the folder or directory where that particular file is located. Again,
    to change directories, all you need to do is use of the `cd` command just like
    in Windows. The syntax to change directory is:


    ```bash

    $ cd <name of folder>

    ```


    Now, there is more to this command than meets the eye. Remember, Linux is exceptionally
    literal when it comes to the interpretation of commands syntaxes. Again, let us
    make use of the diagram below:


    If for example you are in the `var` directory/folder and you want to go to the
    `abc` folder, all you need to do is type:


    ```bash

    $ cd abc

    ```


    Now, if for example you are in the `var` folder and you want to go to the `etc`
    folder, just typing in `$ cd etc` from within `var` will not work. Because then
    Linux will think that you want to go to the `etc` folder that is within the `var`
    folder, which does not exist.


    What you must do is is type the command below:


    ```bash

    $ cd /etc

    ```


    Take note of the forward slash before the name of the directory that you want
    to go to. This forward slash will tell Linux to first go to the `root` directory
    and then find the `etc` folder or directory. Now, Linux will now be able to successfully
    bring you to the `etc` folder since it is able to locate it in the `root` directory.


    Now, consider the example diagram above. Let us say that you are in the `var`
    directory and you want to go to the `abc` folder, all you need to do is type:


    ```bash

