    MYFILE1.txt Myfile1.txt myfile1.TXT


    Docs/myfile1.txt


    Docs/myfile1.txt: ERROR: cannot open ‘fil1.txt’ (No such file or directory)


    In Linux, all of these are interpreted as completely separate files.


    It’s important to be aware of case sensitivity while working with command line
    options. For example, in the command line the two options ''s'' and ''S'' perform
    completely different actions - it’s common to read an option in upper case, enter
    it in lower case, and then wonder why your input doesn’t return the expected output.


    # Name Spaces


    While it is possible to incorporate spaces in perfectly valid file and directory
    names, it’s important to be careful with them. Spaces in a command line signify
    separate items - that’s how we can know what a program name is and identify each
    argument in the command line. For example, if the goal was to move into a director
    called ‘My Photos,’ the following command would not work properly:


    ls -l Docs


    MYFILE1.txt Myfile1.txt myfile1.TXT My Photos


    cd My Photos


    bash: cd: Happyday: No such file or directory


    In this example, ‘My Photos’ is interpreted as two separate arguments in the command
    line. The first argument specifies the directory into which cd moves. In order
    to make this work properly, you can use one of two valid options.


    # Quotation Marks


    First, you can surround an entire item with quotation marks. Single or double
    quotation marks are both acceptable, though slightly different in ways that will
    be addressed later. Anything within a set of quotation marks will be interpreted
    as an individual item.


    cd ‘My Photos’


    pwd


    /home/mike/Docs/My Photos


    # Escape Characters


    You can also define an item with a space in it by using an escape character, also
    known as a backslash ( \). The backslash nullifies the meaning of the character
    directly following it.


    cd Happyday\ Pictures


    pwd


    /home/mike/Docs/My Photos


    You can see above that the space between ‘Happyday’ and ‘Pictures,’ which would
    normally have a special meaning (separating into unique command line arguments).
    Thanks to the backslash, the special meaning is ignored by the argument.


    # Hidden Files and Directories


    The mechanism to specify whether a file or directory is hidden is very elegant
    in Linux. By beginning a file or directory’s name with a ''.'' (full stop), it
    will be interpreted as hidden - it doesn’t require any sort of command or action.
    There are several reasons for a file or directory to be hidden. For example, a
    user’s configuration files (stored in the home directory) are generally hidden
    in order to declutter the space for the user’s everyday tasks.


    ls -l Docs


    MYFILE1.txt Myfile1.txt myfile1.TXT


    ls -a Docs


    ... MYFILE1.txt Myfile1.txt myfile1.TXT .hidden .file.txt


    ...


    # The tar command


    The tar command is used very often because it is simple and efficient. It backs
    up files, including the file tree.


    # Backup


    ```

    tar -cvf Filename.tar Files

    ```


    - c: creation of archive

    - v: Verbose chat mode: displays what is done

    - f: indicates that the following parameter is the name of the archive


    Example:


    | tar -cvf /media/your_media/archive.tar | /home/user01/Documents/ |

    | :--- | :--- |


    Backup with compression


    ```

    tar -cvzf archive.tar.gz Files

    ```


    Example:


    | tar | -cvzf | /media/your_media/archive.tar.gz |

    | /home/user01/Documents/ |

    | :--- | |


    z: add Gzip compression.


    Show the contents of the archive


    ```

    tar -tvf archive.tar

    ```


    - t: show the contents of the archive


    Restoration


    NB: Do not forget to place in the folder (/) by the command (cd /)


    ```

    tar -xvf archive.tar Files

    ```


    - x: extracting all the files from the archive.


    ```

    tar -xvf /media/your_media/archive.tar

    or

    tar -xzvf /media/your_media/archive.tar.gz

    ```


    # Chapter 5. Networking commands


    This chapter will show you how to perform networking tasks from the command line.
    You''ll learn how to find your computer''s IP address and MAC address, how to
    test connectivity, and how to find if your computer''s DNS server is functioning
    properly.


    # Finding Your IP Address


    It''s actually a lot easier to find your IP address from the command line than
    from the GUI in most Linux distributions. Simply type this command at the prompt:


    ```

    ifconfig

    ```


    The ifconfig command will generate an output that looks something like this:


    ![](img/12fa978ca0d488232e696056d63d8bb6_36_0.png)


    There''s quite a bit of information here, but most of it is useful. The eth0 refers
    to the first Ethernet connection on your system. The indel addr displays your
    system''s IP address, while Mask shows the subnet mask. HWaddr shows your Ethernet
    adapter''s MAC (Media Access Control) address, which is (theoretically) unique
    to each adapter. (Some wireless networks require you to supply your MAC address
    before allowing your system to connect.)


    You can pipe the output from the ifconfig command to grep to quickly find the
    specific item you want. Let''s say you just want to find the IP address:


    ```

    ifconfig | grep inet

    ```


    This time, the output will look like this, and you can quickly pick your IP address
    from the mix:


    ![](img/12fa978ca0d488232e696056d63d8bb6_37_0.png)


    Likewise, you can quickly find your computer''s MAC address with ifconfig and
    grep. (A MAC address stands for Media Access Control, and is a hard-wired address
    that is theoretically unique to each network adapter).


    ```

    ifconfig | grep HWaddr

    ```


    You can easily pick out your MAC address from the output:


    ![](img/12fa978ca0d488232e696056d63d8bb6_38_0.png)


    # Finding Your Default Gateway


    The ifconfig command generates lots of useful output, but it does not include
    the address of your default gateway. To do so, you can use the ip command with
    the route option:


    ```

    ip route

    ```


    The command will generate an output that looks something like this:


    ![](img/12fa978ca0d488232e696056d63d8bb6_39_0.png)


    Look for the line that begins default via. Your system''s default gateway will
    be 192.168.2.1.


    # Obtaining an IP Address


    Most of the time, your Linux system will receive an IP address from a DHCP server.


    DHCP stands for Dynamic Host Configuration Protocol, and is a kind of server that
    assigns an IP address to a client when it connects. Configuring each individual
    computer with an IP address by hand is time-consuming and error prone; if one
    or more computers receive the same IP address, they won''t be able to connect
    due to address conflict. DHCP takes the guesswork out of the process. When a computer
    plugs into an Ethernet network (or connects to a wireless network), it sends out
    a request for a DHCP server. If there''s a DHCP server on the network, it supplies
    the computer with an IP address, and the DHCP server ensures that no two receive
    the the IP address.


    Most of the time, when you plug into a new network, you''ll receive a DHCP address
    automatically. If you don''t, however, try this command:


    ```

    dhclient

    ```


    Note that you will need to run dhclient as root, whether logged in as root or
    borrowing root via sudo.


    This will manually tell your system to search for a DHCP server and accept an
    address. If this command doesn''t work, that means either the network you''re
    using doesn''t have a functioning DHCP server, or that something is blocking the
    DHCP server from communicating with your computer.


    # Releasing an IP Address


    DHCP addresses come with a lease, which means the amount of time your computer
    is allowed to keep the address. Usually, your computer will contact the DHCP server
    at the halfway point before the lease expires, and ask for permission to keep
    it, which the DHCP server almost grants.


    Sometimes you want to release a leased address early - like if your network''s
    DHCP server changes, or if your computer refuses to release its IP address. You
    can do this with the dhclient command and the -r option:


    ```

    dhclient -r

    ```


    This releases your IP address, and you can then use dhclient to contact a DHCP
    server to receive a new one.

