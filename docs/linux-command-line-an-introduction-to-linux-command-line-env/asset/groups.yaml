    # Making, Deleting, Moving, Copying, Renaming


    Now we need to talk about making, deleting, moving, copying, and renaming files
    and folders in Linux. The first thing that we are going to do is talk about creating
    a folder. It is pretty straightforward. All you do is type:


    ```bash

    $ sudo mkdir <name of directory/folder>

    ```


    That is *sudo*, followed by a space, and then the *mkdir* parameter, another space,
    and then the name of the folder or directory that you want to make. As you can
    probably already guess, *mkdir* stands for "make directory."


    Keep in mind that you do not put the full path of the directory, this command
    will simply create that directory or folder inside the directory that you are
    currently in.


    For example, let us say you are in the *var* directory and you want to create
    a *Notes* folder inside the *etc* directory. If you type:


    ```bash

    $ sudo mkdir /etc/Notes

    ```


    This command will just create the *Notes* folder in the *var* directory. To create
    the *Notes* folder in the *etc* directory from within *var*, you must type in
    the full path just like the one below:


    ```bash

    $ sudo mkdir /etc/Notes

    ```


    This way, Linux will go to the *root* directory first, and then into the *etc*
    directory, and within the *etc* directory create a *Notes* folder. Typing in the
    full file path will ensure that no matter where you are in the file system, you
    would be able to create the folder in the right location. That is all you need
    to do to create a folder or directory in Linux.


    Deleting files or folders is just as simple. What you do is the command below:


    ```bash

    $ sudo rm <file or folder name>

    ```


    That is sudo, a space, followed by the letters rm, another space, and finally
    the name of the file or folder that you want to delete. As you may have already
    guessed, rm stands for remove. Let us say for example you want to delete a file
    named Notes. All you need to do is type:


    ```bash

    $ sudo rm Notes

    ```


    Deleting folders is a little different, however. You actually still follow the
    syntax as when you are deleting a file. The only difference is that you have to
    add the -R argument at the end of the command when deleting folders. The argument
    -R stands for recursive. By using the recursive argument, you are basically telling
    Linux to do the same task to the contents of the folder.


    Let us say you want to delete the www folder that has three files in it. To do
    this, you just type:


    ```bash

    $ sudo rm -R

    ```


    This command will not only delete the folder itself, but also the three files
    that are inside it. If you do not put a recursive argument at the end of a delete
    folder command, Linux will not be able to execute it successfully, since you cannot
    delete a folder without deleting the contents as well. The only time you would
    be able to delete a folder successfully without the recursive argument is when
    the folder is empty to begin with.


    In Linux, there is no command to rename files and folders per se. Instead of rename,
    we have the move command in Linux. Let us say for example you have a file named
    file1, and you want to change the name to file2. To do that you have to type the
    command syntax below:


    ```bash

    $ sudo mv <name of old file> <name of new file>

    ```


    That is sudo, a space, followed by the letters mv, another space, the name of
    the original file, another space again, and then followed by the name of the new
    file. So again, going back to our example, if you want to change the name file1
    to file2, you have to type:


    ```bash

    $ sudo mv file1 file2

    ```


    This command will change the name of file1 to file2. It is still technically renaming
    a file. But in Linux, we use the term `move`. Now, how about moving a file from
    folder to folder? Well, the syntax still applies. However, instead of just typing
    the name of the files and folders, you must indicate the full path.


    Let''s say you want to move a file named file1 inside the var folder to the etc
    directory. To do this, you must type the command below:


    ```bash

    $ sudo mv /etc/var/file1 /etc/file1

    ```


    That is sudo, a space, followed by the letters mv for move, another space, the
    exact file path of the source file, another space, and lastly followed by the
    exact file path to the destination. It is as simple as that.


    Copying is another important task in Linux. A lot of times, especially if you
    are dealing with a configuration file, it is essential that you make a backup
    file before you start messing around with the original file. Otherwise, if you
    mess up the original file, you may end up damaging the program that file is associated
    with.


    To copy files in Linux, all you have to do is:


    ```bash

    $ sudo cp <name of the file> <name of the copied file>

    ```


    That is sudo, a space, followed by the letters cp for copy, another space, the
    name of the file you want to make a copy of, another space, and finally the name
    of the duplicate file. So, let us say you want to make a copy of a file named
    file10. All you need to do is type:


    ```bash

    $ sudo cp file10 file10.bak

    ```


    Here, file10.bak is the name of the duplicate file of file10. As you can see,
    it is easy to make copies of files in Linux.


    # Mounting Drives


    The last big thing that you have to understand in order to navigate Linux is mounting
