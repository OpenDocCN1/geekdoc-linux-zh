    # Chapter 16. Making Linux More Secure


    There are a lot of reasons that you need to protect your computer from other users,
    but the bottom line is that you do not want any user to delete or modify your
    system files. If you are handling a network of computers, you will also do not
    want any user to inadvertently or purposely change anything in their system that
    may cause the entire system to be compromised.


    As there is also a good chance that you will be connecting your Linux computer
    to the internet, you will need to ensure that you are always able to establish
    a secure connection and that you have done all the steps to protect your computer
    from unwanted access. In this chapter, you will learn how to create layers of
    security in order to prevent other users from denying access to your computer,
    stealing information, or destroying your data.


    # Why Worry About Security


    Your internet connection makes your computer an entry point for a lot of security
    issues, simply because you allow your system to be accessible to hundreds of millions
    of other users online. If you are an operator of an internet host that shares
    data to others, you definitely will want to use your computer''s Internet services,
    such as file transfer protocol (FTP). However, these servers always have a vulnerability
    that criminal hackers may possibly exploit. For this reason, you will want to
    take extra precaution in order to lessen the risk of being attacked. At the same
    time, you will also want to protect your network from users outside your network,
    especially as you communicate with other computers through the web.


    # Ensuring Password Security in Linux


    Unix passwords are historically stored in a file named /etc/passwd, which can
    be read by any user. For example, the file entry for /etc/passwd for a computer''s
    root user may


    `root:t6Z7NWDK1K8sU:0:0:root:/root:/bin/bash`


    appear like this:


    You will notice that colons separate the fields in this file, with the second
    field displaying the user’s password in an encrypted form. For the system to verify
    whether an entered user password is valid, the program that uses the password
    encrypts the entry and then compares the result with the encrypted text that was
    stored in the /etc/passwd file. If the entries match, then the user can use the
    program.


    However, any hacker can easily decrypt passwords using a dictionary attack – a
    type of decrypting method by trying out possible combinations in an encrypted
    password to find out the plaintext equivalent. If you have access to the /etc/passwd
    file, then you are only a few steps away from being able to crack a password.
    If you are not an authorized user of the computer that you are trying to hack,
    then you can make use of possible vulnerabilities in the target''s web services,
    such as the FTP and mailing services, in order to infiltrate and get the file
    that you want.


    It is a good thing that Linux has made several improvements when it comes to making
    the operating system more secure, which include the following:


    # Shadow Passwords


    Leaving passwords in locations that are easily accessible is bad security, even
    though these passwords are encrypted. For this reason, Linux no longer makes it
    a practice to store passwords in /etc/passwd file, which everyone access – passwords
    are now stored in a shadow password file, which is named /etc/shadow, that only
    the root user can access.


    ```

    root:x:0:root:/root:/bin/bash

    ```


    In Linux, the etc/passwd file looks like this:


    Take note that the second field does not show an encrypted password; instead,
    it shows a single character x. The x in this field is your shadow password, and
    the true encrypted root:$1$AAAAni/yN$uSHbzUpy9Cgfool1Bf0tS0:11077:0:9999:7:-1:134540356
    password is stored in the file /etc/shadow, which looks like this:


    You will notice that the fields in the file are still separated by colons, wherein
    the first two fields represent the username and the encrypted password, respectively.
    The remaining fields, on the other hand, control the expiration of your password.
    This means that you do not need to change or even decrypt the password stored
    in this file. Instead, you can change the expiration date of your password using
    the change command.


    You can see a user’s password expiration date as a root user by using the following


    ```

    chage -l root

    ```


