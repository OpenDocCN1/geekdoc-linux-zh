    ## Chapter 7. Linux shell programming


    In Linux, it is very easy to create shell scripts. With shell programming, we
    can group multiple commands in a chain and execute them to obtain the desired
    output. Let’s begin by writing the first script. Open your editor of choice; I
    am using the vi editor. Add the following shell program to the file:


    ```bash

    #!/bin/bash

    echo "Hello World"

    ```


    The above is an example of a shell program. Save the file and give it the name
    hello.sh. Note that we have used the .sh extension to imply that it is a shell
    program. Now, the next step is to make the script executable. This can be achieved
    as follows:


    Open the command prompt and type the following command:


    ```bash

    chmod 744 hello.sh

    ```


    After running the above command, an executable of the file hello.sh will be created;
    chmod stands for change mode. 744 refers to the permissions and we have used this
    to add an execute permission to the file. Since we have made the program executable,
    we now need to execute it.


    This can be achieved by running the following command on the terminal:


    ```bash

    ./hello.sh

    ```


    After running the above command, the following output will be observed on the
    standard output:


    ```

    ubuntu@ubuntu-desktop~$$ chmod 744 hello.sh

    ubuntu@ubuntu-desktop~$ ./hello.sh

    Hello World

    ```


    The command outputs a text saying "Hello World". Remember that this is the text
    that we command the echo command to output.


    #!/bin/bash is called the shebang and is used to precede shell programs.


    To add comments to your program, precede them with a pound sign (#).


    Consider the shell program shown below:


    ```bash

    #!/bin/bash

    ```


    ```bash

    echo "Hey USER"

    ```


    echo "Hello, i am" $USER "The following are the processes running currently",


    ```bash

    echo "List of running processes:"

    ```


    ps


    You can write and run the program. The following output will be observed after
    running the program:


    ```

    ubuntu

    Hello, i am ubuntu The following are the processes running currently

    list of running processes:

    PID TTY      TIME CMD

    1468 S/0      00:00 bash

    1928 ps/0    00:00 list.sh

    1929 ps/0    00:00 ps

    ```


    As shown in the above figure, the program outputs your name. It also shows the
    list of processes that are currently running on your system.


    Now, let''s write a more interactive program. Write the code shown below and run
    it:


    ```bash

    #!/bin/bash

    echo "Enter your name"

    read name;

    echo "welcome Mr./Mrs. $name ";

    echo "Thanks Mr./Mrs. $name. You have provided us with your names";


    echo "------------------------------------------------------------------"

    echo "Mr./Mrs. $name, good bye friend"

    ```

