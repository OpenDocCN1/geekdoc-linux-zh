    ## 防火墙


    如果您的 Linux 系统安装并运行了基于主机的防火墙，您将需要开放 `NFS` 的 TCP 和 UDP 端口 2049 入站以允许入站连接。在 Linux
    系统上运行任何如 `NFS` 的协议都存在安全风险，因此在在防火墙上开放端口之前，请确保系统已妥善配置并放置在网络中。


