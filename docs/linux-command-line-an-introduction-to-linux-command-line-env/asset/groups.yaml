    你可以将变量用作数组。数组的有趣之处在于它们能够存储多个值，你可以通过这些值来引用一个完整的数组。你只需要在括号中用空格列出多个值，就可以简单地将多个值挤到一个变量中。让我们试一下。


    ```

    [aka@localhost ~]$ myworld=(one two three four five)

    aka@localhost ~]$ echo $myworld

    one

