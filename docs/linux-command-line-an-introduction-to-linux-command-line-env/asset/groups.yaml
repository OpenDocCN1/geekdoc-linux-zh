    ## Ubuntu and Debian


    Ubuntu 和 Debian 使用不复杂的防火墙 (UFW) 来控制基本的防火墙配置，但防火墙默认未配置。要使用以下命令打开 TCP 和 UDP 端口 2049：


    ```bash

    sudo ufw allow in nfs

    ```


    ## Fedora


    Fedora 使用 firewalld 控制基本的防火墙配置，且防火墙默认已配置。要使用以下命令打开 TCP 和 UDP 端口 2049：


    ```bash

