    ## Users


    In Linux systems, computer users can be segregated into different types, depending
    on how they use system resources. Here are the three types of Linux users:


    - People who run lots of small processes. A good example for this would be inexperienced
    Linux users.

    - People who run several (but complex) processes. Examples for this type are people
    running emulators, calculations, and simulations.

    - People who run few processes that require lots of CPU time (e.g. game developers).


    As you can see, system requirements differ for each type of user. Also, it is
    extremely difficult to meet the needs of all the users in a network. If you belong
    to a multiuser network, it is beneficial (and entertaining) to identify the habits
    of your fellow users. This technique will help you to maximize the available system
    resources.


    ## Visual Tools


    For graphical environments, you have a wide-range of options in terms of monitoring
    tools. Here’s a screenshot of a tool called Gnome System Monitor. This tool can
    find and show information about active tasks. Also, it can monitor system resources.


    Most Linux systems have some useful icons (e.g. monitors for load, disk, memory,
    etc.) that you may install onto your taskbar.


    ## Listing Processes and Displaying Information


    To display the currently running processes use the ps command. If no options are
    specified, ps displays the processes associated with your current session. To
    see every process including ones that are not owned by you, use ps -e. To see
    processes running by a specific user, use ps -u username.


    ps - Display process status.


    Common ps options:


    - -e - Everything, all processes.

    - -f - Full format listing.

    - -u username - Display processes running as username.

    - -p pid - Display process information for pid. A PID is a process ID.


    Common ps commands:


    - ps -e - Display all processes.

    - ps -ef - Display all processes.

    - ps -eH - Display a process tree.

    - ps -e --forest - Display a process tree.

    - ps -u username - Display processes running as username.


