    # Project 14B: Using XMMS Skins


    One of the fun things about XMMS, if you''re into that sort of thing, is that
    it allows you to change its appearance by using customized skins. The default
    skin for XMMS in Xandros is called 7947-plastik, and it or more less follows the
    default theme of the rest of the system. There are, however, several other XMMS
    skins bundled with your system, examples of which are shown in Figure 14-15.


    ![](img/855e727a697c289d306bb0e488065e20_285_0.png)


