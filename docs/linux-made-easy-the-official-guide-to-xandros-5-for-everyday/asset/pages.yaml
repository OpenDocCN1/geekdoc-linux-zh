  md: '# # 9


    # ## MAKING LASTING IMPRESSIONS

    ### Setting Up and Using Your Printer


    ![](img/855e727a697c289d306bb0e488065e20_167_0.png)


    When personal computers first appeared, people began talking about the dawn of
    the age of the paperless office, but what actually came to pass is quite different.
    Because of the PC''s desktop-publishing capabilities and the continual decline
    in the prices of increasingly capable printer hardware, more printing (and paper
    use) is going on now than ever before. Whether it be for preparing school or business
    reports, printing out high-resolution copies of images from one''s digital camera,
    creating uniquely personalized business cards, or even producing colorful CD or
    DVD labels and jewel-case inserts, people are printing more than ever. Unless
    the only thing you use your computer for is playing games, listening to MP3s,
    or stopping doors on hot, windy days, you will no doubt want to hook up your machine
    to a printer.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Is My Printer Supported?


    Setting up a printer to work with your new system is actually a very easy task,
    but you do have to make sure that your printer is supported. Fortunately, printer
    support in the Linux world is much, better than it once was. In general, support
    for Epson and Hewlett-Packard inkjet printers is pretty good, while support for
    other makers and other printer types is a bit spottier, though implying.


    If you really want to make sure your printer is ready for Linux, probably the
    best thing to do is go to www.linuxprinting.org. On that site, you can check out
    the online database to see if your printer is currently supported, and if, to
    what degree. Listings for supported printers also include information on what
    drivers, the little utility applications that basically tell your printer what
    to do, are best for your purposes. If you''re thinking of buying a printer, there
    is also a page of suggested makes and models.


    # Project 9A: Setting Up Your Printer


    Before you can off and start printing, you will first need to set up your printer.
    To do this, you will need to connect your printer to the computer and then power
    on the printer. If you connect your printer to your computer''s parallel port
    rather than its USB port, you will first have to turn off the computer before
    connecting the cable. Once you have made the connection, turn on your printer,
    and then restart your computer. Of course, if your printer was already connected
    and powered up when you booted into your system, you can skip this step.


    After your printer is hooked up, powered up, and ready to go, setting it up is
    merely a matter of following these steps:


    +   1. Open a Xros File Manager window, and then click Printers in the left pane
    of that window.


    +   2. The right pane of the window should be empty, except for the window title,
    Printers, and a link, Add printer, as you can see in Figure 9-1. Click the Add
    printer link.


    +   3. The Add Printer Wizard (Figure 9-2) will now appear. In the first page
    of the wizard, select Local printer (the usual setup in home environments) or
    Network printer (if you are using a printer connected to your network but not
    directly to your computer, as is often the case in office environments), and then
    click Next.


    NOTE You can also bring up the Add Printer Wizard via the Control Center, if you
    prefer, by clicking Peripheral Devices in the left pane of the Control Center
    window and then clicking Printers in the list of subcategories that appears below.
    When the Printers module appears in the right pane of the window, click the Add
    button, which will bring up the wizard.'
  merge: -1
