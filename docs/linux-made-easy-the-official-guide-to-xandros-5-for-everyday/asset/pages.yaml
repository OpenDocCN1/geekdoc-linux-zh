    ![](img/855e727a697c289d306bb0e488065e20_184_0.png)


    **Figure 9-21:** Selecting your new virtual printer in the Print dialog window


    Within a few seconds, you will have a grayscale printout of that page in your
    hands. Pretty cool, no? You can go ahead and try out HiRes now, if you like, but
