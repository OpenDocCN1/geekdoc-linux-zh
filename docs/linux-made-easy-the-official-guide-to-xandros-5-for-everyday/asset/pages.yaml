- img_proc: true
  md: 'If you were in Japan, that logo would read 2 NTSC, while if you were in Britain,
    it would be 2 PAL. The number within the logo represents the region for which
    the DVD is encoded. There are six regions, with the United States, U.S. territories,
    and Canada forming Region 1, Europe, the Middle East, South Africa, and Greenland
    making up Region 2.


    This is very important, because DVDs encoded for one region are not playable in
    machines manufactured for use in another. Thus, if you buy a DVD in the United
    States and try to play it on a DVD player in Japan, it won''t work, despite both
    countries using the NTSC standard. If you buy a DVD in Britain (Region 2) and
    try to play it on a machine in Japan (also Region 2), it also won''t work, this
    time because of the different television standards (PAL versus NTSC).


    When it comes to playing DVDs on your computer, however, things are quite different,
    in television standards are mostly irrelevant. Regional encodings are also irrelevant
    in some ways. If you burn a disc on the DVD burner, or you play a DVD that someone
    else burned on theirs, regional encodings are not involved. However, if you buy
    and play a DVD movie on that drive, the relevancy of regional encodings comes
    back


    When you buy a computer with a built-in DVD drive, or when you use an external
    DVD drive, that drive is usually set up to play DVDs encoded for the region in
    which you bought your machine. Unlike the DVD players you hook up to your TV,
    however, or connected to your computer allow you to play DVDs of any regional
    encoding.


    This generous feature is limited, however, and this is where you need to be careful.
    Depending on the manufacturer of your drive, you will be able to switch back and
    forth between DVDs of differing regional encodings only four or five times. After
    that, the drive, usually without working, will be locked into the regional encoding
    of the disc you were playing for the final switch... forever. This is unrelated
    to your operating system—it is strictly a hardware matter.


    There is one exception to this region-lock rule. DVDs labeled Region Free or ALL
    (sometimes不愿意 labeled as Region 0) can be played on any DVD player in any region
    and do not register as a regional encoding switch when you plop one of them in
    your computer''s DVD drive. If you therefore play a Region 1 DVD, followed by
    a Region Free DVD, and then play another Region 1 DVD after that, there will be
    no change, in your drive''s view, as to the number of times you have switched
    enc.


    If you are curious as to the why of this odd regional-encoding system, it is all
    based on marketing. The Hollywood studios came up with this system because theatrical
    releases of their films often lag the home releases (DVDs and videos) in the United
    States. By locking American and Canadian home releases with regional encodings,
    they can thus be assured that people in other countries will have to wait for
    the films to be released in theaters to see them. In addition, limiting sales
    of American and Canadian discs to their respective domestic markets, the studios
    can then command higher prices when selling distribution rights to foreign distributors.


    Couch Potatoes 281'
