  md: '# 7


    # CONTROL FREAKS


    Getting Things the Way You Want via the Xandros Control Center


    ![](img/855e727a697c289d306bb0e488065e20_121_0.png)


    The Launch menu and the Xandros File Manager, which were introduced in Chapter
    3 and Chapter 5, respectively, are two of the three most important parts of your
    system. It is now time to meet the third member of what is your system''s troika
    of power: the Xandros Control Center, which you may already have used when you
    set up your connection in Chapter 4.


    You have already worked with several of your system''s settings windows in previous
    chapters, such as when you learned to change your desktop wallpaper. The Control
    Center provides you with a centralized location from which you can gain access
    to such settings windows. You can thus think of the Control Center itself as a
    kind of settings browser.


    While that may rightfully sound quite useful to you, it also probably comes as
    rather boring. But the Control Center is much cooler than that, as it allows you
    to do things such as add users, install fonts, and even change the look of your
    application windows and controls.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'The capabilities of the Control Center are truly great, to cover each and every
    thing it can would take up a lot of space, of limited interest to some people,
    and possibly provide a rather dull read to boot. That being the case, I will limit
    myself to introducing those areas most likely to be of interest or to use you.


    # # Using the Control Center


    To run the Control Center, just go to the **Launch** menu and select **Control
    Center**. The Control Center window (Figure 7-1) will then appear.


    ![](img/855e727a697c289d306bb0e488065e20_122_0.png)


    *Figure 7-1: The Control Center window*


    The window is divided into two panes: browsing (on the left) and display (on the
    right). To use the Control Center, click the + next to one of the headings in
    the left pane; the various subcategories for that heading will appear directly
    underneath the heading.


    When you click any of the subcategories, the information or settings options will
    appear in the right pane. You can go ahead and have a look through things now,
    if you like. You''ll be able to get some hands-on experience using some of them
    in the following projects and sections.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Project 7A: Adding Users


    When you installed Xandros, you set up a user account for yourself. However, as
    mentioned in Chapter 2, you can also add additional user accounts to your system.
    Doing this allows each user to log in to his or her own account where their files
    are separate from everyone''s. This is where they can change any settings and
    customize things whatever they want without affecting anyone.


    If you, for example, want to have a picture of the Green Bay Packers for your
    desktop wallpaper, and your daughter wants one of the Smashing Pumpkins, there
    is no problem—you will both have your own desktop environment to work in that
    can be as gaudy, simple, or macho as you like. It''s almost as if each user has
    his or her own computer.


    # 7A-1: Creating Additional User Accounts


    Even if you are the only person using your computer, you might want to go ahead
    and follow along with this project so that you get the hang of how things work.
    Creating a new account also allows you to follow along with the customizations
    you will be performing in Projects 7B through 7D affecting your own user environment—just
    in case things get a bit too gaudy for your personal tastes.


    To add a new user to your system, here''s what you need to do:


    +   1. Click System Administration in the left pane of the Control Center window,
    and in the subcategories that appear directly beneath that heading, click User
    Manager.


    When the User Manager options appear in the right pane of the Control Center window
    (Figure 7-2), you will notice that almost everything is grayed out, and that there
    is a red line surrounding the message at the top of the pane telling you that
    the User Manager module can be performed only by the system administrator—in other
    words, the person who knows the root password you created during the installation
    of your system.


    +   2. Assuming you are the possessor of the root password, click the Administrator
    button at the bottom of the window, type the root password when prompted to do
    so, and then click OK.


    The entire right pane will now be surrounded by a red line. This means that you
    are now in administrator (root) mode—at least in the Control Center.'
  merge: -1
