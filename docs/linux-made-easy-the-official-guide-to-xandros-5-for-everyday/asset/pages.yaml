    folder, you will need to go to the View menu in Xandros File Manager and select
    Show Hidden Files. If you are going to accessing the XMMS Skins folder often,
    this would be a good time to use XFM''s bookmark function, so as to navigate back
    to the folder easier in the future.


    From there on, it''s a simple drag-and-drop procedure. Just drag the downloaded
    skin files directly into the Skins folder inside .xmms, and that next time you
    open the XMMS Skin selector, your new skins will be waiting in the list.


    # Project 14C: XMMS Plug-ins


    XMMS not only allows you to change its looks through the use of skins, but it
    also allows you to add functions to the player through the use of plug-ins. Many
    of these plug-ins are already bundled with your system, while still are others
    available from Xandros Networks. There is a variety of such plug-ins, and they
    range in function from visualization modules (which provide you with animated
    graphical representations of the song you happen to be playing) to timer functions
    (which allow you to have XMMS start up and shut down, like an alarm clock, when
    you want).


    # 14C-1: What You''ve Got


