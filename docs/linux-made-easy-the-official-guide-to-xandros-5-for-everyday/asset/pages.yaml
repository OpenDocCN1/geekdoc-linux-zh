  md: '# 7D-2: Changing Control Styles


    Okay, so now that you''ve changed your window borders, the next step is to change
    the control styles. This will change the looks of the various scroll bars, buttons,
    menus, and bevels that make up the bulk of an application or system environment.


    > NOTE Changes to the control-style themes will be fully realized only in KDE-based
    applications, which fortunately includes your system itself. There will be little
    or no difference in the appearances of certain applications, as as OpenOffice
    or RealPlayer.


    To bring about the change, here''s what you have to do:


    +   1. Click Style beneath the Display heading within the left pane of the Control
    window. The Style module will appear in the right pane of the window, as you can
    see in Figure 7-11.


    ![](img/855e727a697c289d306bb0e488065e20_134_0.png)


    Figure 7-11: Changing control styles via the Control Center below the words Widget
    Style and immediately


    +   2. Click the drop-down menu beneath the Widget Style and immediately Keramik.


    +   3. Once you have made the selection, click Apply, and the changes will immediately
    take effect. The results can be seen in Figure 7-12.


    # 7D-3: Doing a Bit of Coloring


