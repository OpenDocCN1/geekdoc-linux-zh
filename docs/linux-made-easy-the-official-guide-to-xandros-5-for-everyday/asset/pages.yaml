  md: '# 8


    # THE KEYS TO THE GATES OF OZ, OR THE GATES OF XANDROS ANYWAY


    Expanding and Updating Your System via Xandros Networks


    ![](img/855e727a697c289d306bb0e488065e20_143_0.png)


    I mentioned in Chapter 1 that the first time I ever heard of Xandros was from
    a friend who described the system as “cool.”


    Well, when I first gave Xandros a try, I thought it was really good and, more
    importantly, incredibly easy to use—easier, in fact, than Windows. The word “cool,”
    however, didn’t immediately pop into my mind. That is, until I first used Xandros
    Networks.


    What is Xandros Networks? Well, it is sort of a combination of things—a simple-to-use
    application (Figure 8-1) and a set of online repositories that houses an amazing
    array of applications and related files. The Xandros Networks (XN) application
    acts as an interface via which you can access those repositories and then easily
    download and install whatever you find of interest there. Now, I admit that what
    I’ve just described, on its own, might not initially sound all impressive, but
    if you have a better understanding of what it is normally like to install an application
    in Linux, however, you will see why Xandros Networks is nothing short of a godsend.'
  merge: -1
