    who have built up a career expertise with such applications has founded a profitable
    career based on his or her abilities in that. Still, in all many cases, spreadsheets
    go unused and forgotten, taking up valuable disk space and serving as much purpose
    as a pack of dried cherries tucked inside one of your running shoes. Hmmm. . .
    .


    The reason for this neglect is very often that users (rather than users, in this
    case) just can''t seem to find any practical reason to use a spreadsheet. This
