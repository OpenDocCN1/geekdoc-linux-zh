- img_proc: true
  md: '# If Things Don''t Go According to Plan


    If things do not work out for you (for example, if the wizard doesn''t recognize
    your printer), keep your cool and try doing the following:


    +   1. Right-click the Printer icon that just recently appeared in the Xandros
    File Manager window, and select Delete in the pop-up menu.

    2. The printer icon should now be gone. If it is, restart your computer, keeping
    the printer connected and powered on.

    3. Once your system is back up and running, try adding the printer again.


    If that doesn''t work out, try checking Xandros Networks (with the Debian Unsupported
    Site selected) to see if there is a special driver available for your printer,
    or check the Xandros FAQs (http://xandros.com) or User Forums for help or advice.
    You might want to double-check with www.linuxprinting.org, if you haven''t already
    done so, to see if there is anything they have to say about your particular printer.


    If everything seemed to go fine except for the printout quality of the page you
    made at the end of the last step of the setup wizard, try using a different driver.
    To do this, follow these steps:


    +   1. Right-click the icon for your printer in the Xandros File Manager window,
    and select Properties in the pop-up menu.

    2. When the Properties window appears, click the Change button.

    3. In the Change Printer Model window that appears (Figure 9-9), select one of
    the other driver options listed in the Driver drop-down menu, and select OK in
    that window and OK in the Properties.

    4. Try printing out another document.


    ![](img/855e727a697c289d306bb0e488065e20_173_0.png)


    Figure 9-9: Changing drivers for your printer'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Using Your Printer


    Now that your printer is set up, you will no doubt want to start printing. This
    is easy task and not much different from how it works in the Windows and Mac worlds.


    You should be aware, however, that there are two different print dialog windows
    that might appear when you set out to print. Which of these will appear depends
    on the application you happen to be using. Most applications utilize the KDE-based
    print dialog window (kprint), while OpenOffice uses its own. The look and options
    of the KDE-based dialog window will vary somewhat, depending on the application
    you are using at time.


    # Changing Printer Settings


    As you print various things, it is inevitable that, for one reason or another,
    you will want to change your printer settings. For example, let''s say that you
    are running low on ink and want keep everything in black or shades of gray for
    a while. Or you may want to print a particular photo at a higher resolution than
    the default setting of your current printer driver. Or you may want to print a
    page horizontally rather than vertically.


    Doing all this is pretty straightforward.


    # Changing the Print Range and Number of Copies for Your Document


    If you are working with a multipage document, your system will automatically print
    out the whole shebang when you go about printing. This is all fine and dandy,
    but what if you want to print out only the first three pages of the document?
    Or if you want to print out only the page you are currently looking at? Well,
    none of these possibilities poses any problem, because you can easily print out
    what you want via the Print dialog window.


    To get started, just select **Print** from the **File** menu in the application
    you are using. The Print window (Figure 9-10) will appear.


    To print a specific range of pages, check the radio button for **Range**, then
    enter the range of pages you want to print. For example, if you want print pages
    7 through 13 of your document, you would type **7-13**. If you want to print out
    just pages 7, 12, 13, and 20, you would type **7,12,13,20**. If you want to print
    out just page 3, you would type **3** or **3-3**. If you want to print out the
    page you are currently viewing, click anywhere in that page before opening the
    Print window, and then check **Current.**


    > **NOTE** This option is available only in applications that actually separate
    your document into pages. In the case of a web page, for example, where the document
    itself is actually a long single page, the option will not be available, even
    though it will print out several pages.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_175_0.png)


    Figure-9-10: a kprint dialog window


    # # Other Options


    There are also a few other options available to you from the print dialog window.
    If, for example, you want to print out only odd or even pages, you can select
    the appropriate option from the Page set option near the bottom-left corner of
    the window. If you want to print out more than one copy of the document, or parts
    thereof, select the desired number of copies in the box next to word Copies.


    When selecting this option, you also have the option of having the copies collated,
    meaning that they are printed in ordered sets. For instance, if you set the number
    of copies at 3, the pages would print out 1,2,3 and 1,2,3 and 1,2,3. This is the
    default arrangement, so there is nothing you to do if you leave this setup. If
    you would prefer that the copies print out in 1,1,1 and 2,2,2 and 3,3,3 order,
    you can do so by unchecking the box next the word Collated. You can also have
    the pages print out in reverse order, regardless of the number of copies you''ve
    selected, by checking Reverse.


    If you are printing an OpenOffice.org document, most of these options will also
    be available to you, and there will be an additional option available: Selection
    (Figure-9-11).


    The Selection option allows you to print out the text you may have highlighted
    in the document before bringing up the Print dialog window.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_176_0.png)


    Figure 9-11: An OpenOffice.org Print dialog window


    # Changing Paper Orientation and Size Settings


    To change the size or orientation of the page you are printing, select Print from
    the File menu in the application you are using, and then click the Properties
    button in the Print dialog window that appears. You will see a Configuration window
    (Figure 9-12).


    ![](img/855e727a697c289d306bb0e488065e20_176_1.png)


    Figure 9-12: Changing paper orientation and size settings


    Once in the new window, you can change the orientation of your page from Portrait
    (vertical) to Landscape (horizontal) by clicking the appropriate button beneath
    the word Orientation. To change paper sizes, make the appropriate choice from
    the menu beneath the phrase Paper size. If you would also like to reverse the
    printing order of your document, that is, printing from the last page to the first
    rather than the other way around, click the Last to first button under the Print
    Order heading. Once you have made your choices, click OK. If you would like to
    use these settings for all your future documents, click Save before clicking OK.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'These options are available to you when printing an OpenOffice.org document
    by clicking the Properties button in the OpenOffice.org Print window.


    When the Properties window appears (Figure 9-13), you will notice that you can
    also choose to print out the document at a smaller size by adjusting the percentage
    numbers in the Scale box.


    ![](img/855e727a697c289d306bb0e488065e20_177_0.png)


    Figure 9-13: Changing paper size, orientation, and scale in OpenOffice.org


    Okay, now let''s say that you want to print out a copy of one of the photos you
    downloaded to your hard disk from a digital camera. You may want your photo to
    come out at as high resolution as possible. Or maybe you just want to print out
    a cheap and quick copy of the document you are working on without spending too
    much time or ink. Well, you can do either of these things easily by changing your
    printer''s resolution and settings.


    To do this, open the Configuration window, as you just learned to do in the previous
    section, and click the Options tab.


    Once in the Options tab, click the + symbol next to General, and then click Print
    Mode when it appears beneath it. After doing this, the various printout options
    available for your printer will appear in the right pane of the tab window (Figure
    9-14). These options mainly consist of color, print quality, and paper settings,
    and they are usually grouped in sets. In case you are not too familiar with such
    printer settings, I will provide you with a brief introduction now.


    Color settings should be fairly easy to figure out, as the name indicates what
    it does. Black + Color, for example, allows you to print in both color and black-and-white.
    Grayscale, on the other hand, allows you to print in black-and-white, such as
    a typical text document, and every shade of gray in between, would be the case
    when printing a black-and-white photo. To vary the print quality of your document,
    you adjust the dpi, or dots per inch, the better the print quality. The Draft
    mode option also has an impact on print quality, because if you choose it,'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'the document is printed more quickly. What you gain in terms of speed, however,
    will probably cost you a bit in terms of print quality. If you are using an old
    or lower-quality inkjet printer, however, you may actually find your printed output
    crisper and cleaner than in regular printing mode, but a bit of trial and error
    should show you what best on your printer. To actually select the color and resolution
    mode you would like to use, if you want to print a copy of any of your digital
    images, in the case of my printer, the option dpi setting for Black + Cartridge
    reads “120 dpi, Photo, Black + Color Cartr., Photo Paper.” If you just want to
    print a quick grayscale copy of a document, even one that contains color images,
    select the lowest dpi Grayscale option available for your printer. In mine, for
    example, it is “300 dpi, Draft, Grayscale, Black + Color Cartr.”. Once you have
    made your selections, click OK.


    ![](img/855e727a697c289d306bb0e488065e20_178_0.png)


    Figure 9-14: Changing your printer''s color and resolution settings


    To adjust these settings when printing an OpenOffice.org document, click the Properties
    button in the OpenOffice.org Print dialog. When the Properties window appears,
    click the Device tab, and then click Printout Mode in the left pane of that tab.


    You can then select from the various options available for your printer in the
    right pane (Figure 9-15).


    # Previewing Pages Before Printing


    It is often a good idea to see exactly what is going to be printed before actually
    doing the deed itself. This is very easy to do by going to the File menu of the
    document you want to print and selecting Print Preview (Page Preview in OpenOffice.org
    documents). The page will then appear in a separate window, in pretty much the
    state in which it will be printed. This is very handy when printing web pages
    (Figure 9-16), as it allows you to see how a lengthy single web page will be divided
    for printing.


    152 Chapter 9'
  merge: -1
