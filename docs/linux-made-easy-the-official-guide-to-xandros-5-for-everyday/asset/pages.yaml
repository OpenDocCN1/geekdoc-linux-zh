  md: '(.mov). As if that weren''t enough, it even allows you to listen to the various
    types of audio files we''ve already covered in Chapter 14.


    ![](img/855e727a697c289d306bb0e488065e20_302_0.png)


    Figure 15-1: Media Player


    You may notice when you run Media Player for the first time that there will be
    no volume controller in the player window that appears on your screen, unlike
    that in Figure 15-1. If you would like your player to display the controller too,
    go to the **Settings** menu and select **Show Volume Control.


    # Playing a Video in Media Player


    To run Media Player, go to the **Launch** menu and select **Applications > Multimedia
    > Media Player**. When the player window appears, you can play a file by going
    to the **File** menu and selecting **Open**. A file selection window will appear,
    and in that window you navigate to and select the file you want to play. Once
    you''ve made your selection, click **Open**, and the file will begin playing in
    a new video playback.


    You can then, if you like, enlarge the viewing size of the Media Player window
    by dragging one of the bottom corners of the player window until it is as big
    as you want it to be.


    # The Media Player Playlist


    Each time you play a new file in Media Player, whether it be audio or video, it
    is automatically added to a playlist. Thus, when the file you have just finished
    playing, the one you viewed or listened to, even if it was weeks ago that you
    did so, it will automatically play. Depending on how you look at the world, this
    can be considered a rather fancy feature ... or not. If you happen to take a negative
    view of this default setup, you can configure Media Player so that it will automatically
    clear the playlist each time you open a new file, making it function a bit more
    like XMMS.


    To make this change, just follow these steps:


    +   Go to the Media Player **Settings** menu and select **Configure Media Player.


    +   In the Preferences window that appears (Figure 15-2), check the box next to
    the words **Clear playlist after opening a file**, and then click the **Apply**
    button to complete the process.


    +   Normally, you would now click **OK**, after which the Preferences window would
    close, but I''ll ask you to hold off on that for a moment.'
