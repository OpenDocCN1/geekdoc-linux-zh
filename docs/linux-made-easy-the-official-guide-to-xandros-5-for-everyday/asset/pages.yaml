  md: '# 1


    # WELCOME TO THE WORLD OF LINUX . . . À LA XANDROS


    ![](img/855e727a697c289d306bb0e488065e20_29_0.png)


    The first time Xandros ever came into my active consciousness was when I received
    an email from a compu-friend of mine who wrote, “You know what''s cool? Xandros!”
    I was a bit surprised at first, as I found it rather difficult to fathom how a
    seemingly sensible person would find “cool” about a movie in which a giant head
    floats around spurting pseudo-philosophical ramblings at a heavily sideburned
    and primit clad Sean Connery. After a brief moment of reflection, however, I realized
    that my friend had not not, as I had initially feared, totally wigged, but rather
    that I had been mistakenlyically thinking about the 1974 film Zandaz. Quite fortunately
    for all involved (including you), Xandros is something completely different—an
    extremely easy to install and use variation of the Linux operating system.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# # What Is Linux?


    You already know of, and have probably used, at least one of the many operating
    systems that exist today. Operating systems such as Windows, DOS, and Mac OS all
    enable the otherwise hopeless hodgep of electronics that is your computer to do
    what you want it to.


    Linux is another operating system; however, it is quite different from those others,
    both in terms of its capabilities and its heritage. Linux was not created by a
    corporation or by some corporate wannabes to make money. It was instead created
    by a Finnish-Swedish computer enthusiast, Linus Torvalds, who wanted to create
    a better Unix-like system that would work on home computers, particularly him.
    Rather than keeping his creation to himself, Torvalds opened it up to the world,
    so to speak, the system was expanded and improved upon by compugeeks around the
    globe who worked to make the system much better and more powerful.


    # # Why Should I Use Linux?


    People use Linux for many different reasons. For many, it is a matter of power,
    stability, or even personal philosophy. However, for many others, cras it may
    seem, it is a matter of money. Just think for a moment what it costs to get started
    with another operating system. Go to wherever it is that you go to buy software
    and a walk down the list in your head of all the things you want to buy and how
    much each costs: an office suite, a game or two, and maybe a graphics program
    with which to make your digital photos look better (and perhaps yourself in the
    process). Now do the math.


    After you pick yourself off the floor, you will understand that we are talking
    big bucks here. On the other hand, for the price of this book, or a tad more if
    you opt for more flexibility, you will have all of the things wanted and more
    in the Linux world. Despite the worries that many people have, making the move
    to Linux not only means savings for you, but more computing versatility—you will
    not be hamstrung at some point the way because you do not have this or program
    when you need it most—you''ll have it all from the get-go!


    You might counter with the fact that there are a lot of free applications out
    for other operating systems, but c''mon, let''s face it, these are often rather
    limited in terms of their capabilities. The programs with a little more oomp are
    mostly shareware, and most shareware these programs days are limited in some way,
    or you can only use them for a month or less unless you are willing to pay for
    them. Sure, their costs are relatively low, but $25 here and $35 there eventually
    add up to a considerable chunk of change. In addition, at least in my experience,
    many of those programs are not that great.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# # Is It All Just About Money?


    While money is important to the average user, it is certainly not the only reason
    for taking the Linux plunge; there are a variety of other reasons as well. As
    I mentioned before, Linux is noted for its stability. Try running your system
    for a month without restarting occasionally and see what happens. Linux has been
    known to run for over a year without a hitch or a decrease in performance.


    In addition, Linux is infinitely customizable; you can get your system to look
    and act the way you want it to without being wizarded to death. And then there
    are the applications that come with or are available for most Linux distributions.
    In addition to being a wide variety of them, most are well up to industry snuff,
    with some, such as Evolution and the GIMP, being sources of envy for those outside
    the Linux world.


    # # What Is a Distribution?


    An operating system consists of a lot of files that perform a lot of different
    functions. And because there is no Linux Corporation to package and distribute
    the files that make Linux, the task of getting Linux onto your working order,
    along with the applications that you are likely to want, has fallen to a varied
    group of entities—companies, universities, user groups, and private individuals.
    The Linux system and application collections they create are called *distributions*,
    or *distros*. You could bypass such distros and try to collect everything you
    need to set up a system all on your own, but you would undoubtedly lose your mind
    in the process. Most people, even the geekiest, opt for the distro.


    There are a large number of distros, such as Red Hat, Mandrake, SuSE, Damn Small
    Linux, and Debian, to provide a few well-known examples. Some are geared to specific
    audiences, such as businesses, educators, gamers, students, programmers, system
    administrators, and specific language users. What makes each distro the specific
    software that is bundled with the Linux kernel and other convenience features,
    such as the installer and system configuration tools. Some distros are especially
    appropriate for home users due to their ease of installation, and Xandros is undoubtedly
    a leader in this area.


    # # So Why Choose Xandros?


    With many distros out there, you may wonder if Xandros is the one for you. As
    I''ve already mentioned, different distros are geared to the needs and likes of
    different users. All things considered, it is pretty fair to say that if you are
    looking for a Linux distro that you can essentially get down to using without
    any geeking around, then Xandros is a perfect choice for you.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'All that said, let me point out a few things that make Xandros an attractive
    alternative for anyone thinking of moving over to the world of Linux.


    # Ease of Installation


    When installing Xandros, you won''t be asked a single question that will even
    give you the chance for a screw-up. You''ve got to edit that to foolproof (in
    the most literal sense). Xandros''s four-step installation process is the unrivaled
    champion in the ease-of-installation department.


    # Hardware Compatibility


    Xandros is particularly adept at handling more problematic hardware configurations.
    In addition, Xandros arguably provides the easiest-handling of peripheral devices
    such as scanners and flash memory units.


    # Debian-Based


    Xandros is based on the Debian distribution, one of the most popular Linux distributions.
    As a result, there are probably more applications available for Debian than any
    other distro. Most of these work with Xandros and can easily be found and installed
    via the Xandros Networks application that comes with every Xandros edition.


    # Xandros Networks


    The Xandros Networks application makes finding and installing applications (and
    there are lots of them) unbelievably simple and even enjoyable task.


    # Good Level of Windows Friendliness


    Xandros is configured to work as comfortably as possible with the world of Windows.
    Not only does it allow you to easily browse Windows machines connected to whatever
    network you happen to be on, but it also allows you to easily make a machine Windows-Linux
    dual-boot, permitting you to have both systems installed on your hard disk at
    the same time. To help with the setup, it can even create and resize partitions
    for you, and as you will find out in the next section, you can run numerous Windows
    applications and plug-ins if you upgrade to the Deluxe Edition of Xandros.


    # The Different Flavors of Xandros


    Xandros, like many other distros, comes in free and pay (for-sale) versions. The
    free version, such as the one bundled with this, is called the Open Circulation
    Edition. It comes with a large number of programs, including the Microsoft Office-compatible
    OpenOffice.org office suite. It lacks a few of the bells and whistles found on
    the for-sale editions, such as unlimited CD burning speeds (Open Circulation provides
    only a maximum 2X burn speed) and the ability to burn DVDs (Open Circulation doesn''t'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'handle DVD burning), but it is still a fully functional and completely satisfactory
    operating system. And you can install applications that are comparable to most
    of those it lacks for free.


    The for-sale editions can be classified into home and business categories; given
    the target audience of this book, I will only cover the home category.

    The Standard Edition provides you with unlimited burning speed and 30 days of
    technical support via email. The Deluxe Edition adds to the mix 30 days of tech
    support and two additional CDs containing a variety of extra applications. It''s
    an ideal choice for slow internet connections who want everything set up. The
    Deluxe Edition also comes bundled with CodeWeavers'' CrossOffice, which allows
    you to run numerous, though not all, Windows applications, such as MS Office,
    and Skype and Windows Media Player. That be very valuable to you depending on
    how important it is to run Windows applications. A new addition to the Xandros
    is Xandros Surface Linux, which is geared toward the hardcore web surfer. It is
    pretty much the same as the Home Edition, but it also comes with anti-virus software,
    the Internet telephony application, Skype, and a Platronics headset.


    # Hardware Compatibility


    Well, now that I''ve covered all of this background business, let''s get the ball
    rolling and prepare to install. It is pretty to say that Xandros will run on most
    modern computers. Of course, this statement comes with a major caveat: you never
    know if all is well until you are up and running, and because there are so many
    minor parts to and peripherals for your machine, it is difficult to say whether
    or not part will cooperate with your installation.


    If you are going to buy a new machine on to run Linux, then it is reasonable to
    check things out first, but if you are going to install it on the machine you
    have, I recommend just diving in. Being the reckless character that I am, am searching
    the Web to see if out it works or not seems a bit of a nuisance to me. You can
    spend hours poking around and still end up being sure. You might also be misled
    into thinking that Xandros won''t work on your machine when it actually will.
    You can find out by just trying to install it. If it works, it works; if it doesn,
    it doesn''t. Assuming you have the system discs for whatever OS you were using
    before, you will have nothing but a little time.


    If my damn-the-torpedos approach isn''t really your story, and you would prefer
    search the Web to see if hardware is supported by Linux in general, you can, of
    course, do this, but you need to know what kind of hardware you have. To be able
    to find out anything of value, you should least know what motherboard, processor
    (CPU), and monitor you have. Identifying your CPU and monitor should be easy enough,
    but the motherboard may require a bit more searching. If you have no documentation
    that clearly states what kind of motherboard you have, then just open up the case
    of'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'computer and look at your board, which is a giant green (sometimes brown)

    circuit board into which just about everything in your machine is connected.

    You needn''t worry about damaging something you don''t need to

    touch anything (so don''t). You may need a flashlight to find it, but the model

    ame and number should be stamped somewhere, either in the middle

    of the board or around the edges. Mine, for example, says quite clearly "AOpen
    MX46-533V". You should be looking for similar

    information.


    Once you have that information, you can do a variety of things that check

    out your motherboard''s compatibility with Xandros. First of all, you can

    check the Xandros hardware compatibility search page at http://support

    .xandros.com/hcl-search.php, though its database lists only a portion of the

    hardware that is actually compatible with the system. Alternatively, search the

    Xandros support forums at http://forums.xandros.com or post an inquiry

    asking anyone if such-hardware will work with Xandros.

    This works for other hardware too. You just write that you are a newbie\and want
    to know if anyone has had any experience with Xandros with the

    board (or other hardware ) in question. You will probably get quite a few

    responses, because Linux users are usually rather evangelical and try to draw

    in new users. You can also do a Yahoo or Google search, typing in your mother-board''s
    make and model plus the word Linux or Xandros.


    # Hardware Requirements


    All worries about compatibility aside, the following are the basic hardware requirements:


    +   - Intel Pentium 2-4 or Celeron processor, or any AMD K6/II/III, Duron,

    Athlon, or Athlon XP/MP processor

    - A minimum of 1.5 GB of hard disk space (Xandros recommends 3 GB),

    for my, having at least 10 GB would be best

    - Sufficient memory (RAM)


    Now that we''re on the subject of RAM, I have a bit to say. The official specs

    tell you that you need a minimum of 64 megabytes (MB) of RAM to run

    Xandros (though 128 MB is recommended to run it comfortably). However,

    tway I see things is that no matter what OS you are dealing with, whether

    Windows or Macintosh or Linux, whatever they tell you is enough memory is'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'sure to be too little, and when you have too memory, no matter what system
    you are running, well . . weird things just seem to keep on happening. Applications
    seem to take years to open, or don''t open at all; menus take forever to render
    their icons; freezes and general system meltdowns just happen much more often.


    My basic rule of thumb, regardless of the OS, is that you need the recommended
    (not the minimum) memory plus at least 128 MB. This gives your system (and you)
    a bit of elbow room, and in most cases your computer seems to move a tad quicker.
    After all, it is quite a waste to have a pretty speedy CPU and yet be able to
    appreciate it because its hands are tied by a lack of memory. That''s like trying
    to jumping jacks in a broom closet. Not that many people jumping jacks anymore
    or ever have a broom closet, for that matter.


    The bottom line is this: ignore what the official says about how much RAM you
    need and just put in more. You won''t regret it. Fortunately, Xandros'' recommended
    128 MB, plus my 256 MB, comes well within the recommended additional 128 MB that
    most new systems come with these days.


    And if you don''t fall into that 256 MB category? Well, memory is relatively cheap
    these days, so I say just go for it. Since you''re saving money on applications
    by installing Xandros, you should have enough extra cash to buy enough RAM to
    make your life easier.


    # Where Do I Go from Here?


    Now that you know more about the world of Linux in general and Xandros in particular,
    it''s time to get down to it. Turn off that DVD of Dawson''s Creek season 4 that
    you''ve been watching (I''ll save you the suspense—Joey and Pacey do break up
    at the end), strap yourself down in front of that computer, clip on your spurs,
    and go straight to the next chapter. Of course, if you''ve already taken the plunge
    and have Xandros installed on your machine, then you should head straight over
    to Chapter 3 to get started.'
