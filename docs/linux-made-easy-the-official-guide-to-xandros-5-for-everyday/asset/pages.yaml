  md: '# #3


    # AN ALTERNATIVE BLUE WORLD


    Getting to Know the Xandros Desktop


    ![](img/855e727a697c289d306bb0e488065e20_53_0.png)


    Now that Xandros is installed, you will perform a simple, one-step process whenever
    you turn your computer on. This process will then deliver you to your new desktop.


    After soon powering up, you will be greeted by the Xandros boot loader screen.
    From this screen you can choose to boot up in Xandros by simply pressing the ENTER
    key, or more simply, by just waiting a few seconds, which will have the same effect.
    If you created a dual-boot setup, you can use your cursor keys to scroll through
    the various options and select Windows, press ENTER, and then boot up in that
    operating system instead. Of course, if you are going to use this book, you won''t
    want to choose this option now.


    > NOTE If you at some point want to boot Windows and you see more than one entry
    for it, choose the first entry. If you get some sort of error message and Windows
    does not start, reboot and try the next Windows entry.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'Assuming that you do indeed want to follow along with me here, are thus forging
    the Windows boot option for the time being, the only thing you have to do next
    is wait a few somewhat lengthy seconds for the login screen to appear.


    The login screen consists of a tiny window at the center of an empty blue screen.
    In that window, you will see the username you chose during the installation process
    just above an empty box in which you need to type the user password (not the root
    password) that you also entered during the installation process. Once you have
    entered your user password, click OK or press ENTER to proceed. If you are the
    only person using your computer, and thus find the login step a needless chore,
    don''t fret. I will show you how to bypass it in Chapter 7. For now, just bear
    with me.


    # Welcome to Xandros''s KDE Desktop


    A relatively short while after logging in, you will arrive at your new desktop,
    which you can see in Figure 3-1. The graphical desktop that Xandros uses is KDE,
    which is one of the most popular desktop environments in the world of Linux.


    ![](img/855e727a697c289d306bb0e488065e20_54_0.png)


    Figure 3-1: The Xandros desktop


    You can see that the desktop isn''t all that different from what you might be
    used in a Windows environment. But don''t be completely fooled; despite the similarities,
    things are different enough to be interesting. There are three main elements that
    you will probably notice off the bat: the desktop icons, the Panel at the bottom
    of the screen, and the Launch button at the far left corner of the Panel. I will
    focus on these elements in this chapter.'
  merge: -1
  pgno: 54
- img_proc: true
