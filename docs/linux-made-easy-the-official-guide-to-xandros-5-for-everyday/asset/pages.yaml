  md: '# Adding or Modifying Tags to Your MP3 and Ogg Files


    As you have probably noticed, when you play a piece of music in XMMS or other
    audio players (such as in iTunes or on iPod), the song and album titles and artist''s
    name are displayed in the player window. If you have ever used iTunes in Windows
    or Mac OS, you will have noticed that such audio files are grouped by genre. The
    data in each file provides this and other information is called an ID3 tag, or
    to keep things simple, tag.


    As mentioned earlier in the chapter, if you rip a tune from a CD while not connected
    to the Internet, or if the album or song you are ripping is not included in the
    online CD database, this information will not be added to your MP3 or Ogg file.
    Frankly, you can add or alter this information. To do this in XMMS, select one
    of the songs in the Playlist window by clicking it once. Then, click but not release,
    the Misc button in the Playlist window, select Info and then release the mouse
    button. A File Info for the song you have selected will appear (Figure 14-24).


    ![](img/855e727a697c289d306bb0e488065e20_292_0.png)


    Figure 14-24: Editing the tags of your audio files


    To alter or supply any information within the tag, just input the data in the
    appropriate box, or in the case of genre information, select the appropriate from
    the drop-down menu next to the word Genre. When you have finished, click Save;
    the information you added or altered will be added to the tag of the audio file.


    # EasyTAG


    If you have a lot of MP3s and Ogg files that need major tag revisions, a handy
    program you might want to add to your repertoire is EasyTAG (Figure 14-25), essentially
    a tag editor on steroids. You can easily download and install EasyTAG using Xandros
    Networks. Just make sure Debian unsupported repository is enabled, type easytag,
    and then press ENTER to locate the file.'
  merge: -1
  pgno: 292
- img_proc: true
