  md: 'It''s simple to burn an ISO to disc using the Xandros File Manager.


    +   1. Double-click the ISO on your hard disk, which you will be able to recognize
    by its .iso extension. A Create Disc window (like that in Figure 6-7) will appear.
    After that, the process is exactly the same as for burning CDs.


    +   2. Click OK in the Create Disc window. Two windows will now appear. Place
    a blank CD in your drive, and then, after the indicator on your drive stops flashing,
    click OK in the second window.


    After that, the burning process will begin, with its progress shown in the remaining
    window. Once the process is complete, your newly burned disc will be ejected from
    the drive automatically.


    # USB Storage Devices


    Universal Bus (or USB) devices, recognizable by their narrow rectangular connector
    plugs (Figure 6-11), can be plugged and unplugged while your computer is running
    (called hot plugging). These devices include not only the USB printers, scanners,
    and digital cameras with which you are probably already familiar but also a number
    of USB storage devices that you can use to back up or transport your data.


    ![](img/855e727a697c289d306bb0e488065e20_118_0.png)


    Figure 6-11: A USB connector plug and USB ports


    These USB storage devices include external hard disks, flash memory card readers,
    and the tiny, finger-sized devices known as flash drives (Figure 6-12). These
    simple flash drives are quite popular today, and deservedly so, because they are
    quite inexpensive; extremely handy when you need to transfer fairly large, but
    not gigantic, amounts of data from computer to computer (from work to home, for
    example); and pretty safe in terms of Linux compatibility.


    # Accessing Your USB Storage Devices


    To work with your USB storage device, plug it into one of the USB ports on your
    computer. The XFM window will appear, displaying the contents of that device.
    An icon for the device, removable Disk, will also appear in the left pane of the
    window (Figure 6-13). If you see only a single folder with a name partition1,
    or something to that effect, double-click to access your files.


    Once you finish with your device, unply it by clicking the Removable Disk icon
    in the file tree in the left pane and then the words Erect disc in the'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'right pane. The contents of the right pane will change, and the light on your
    device will do a bit of rapid flashing. Once the flashing stops, it''s safe to
    physically unplug the device from your machine.


    ![](img/855e727a697c289d306bb0e488065e20_119_0.png)


    Figure 6-12: USB storage devices


    NOTE Removing your device before the LED stops flashing can result in your losing
    data if Linux was saving information to it when you unplugged it. If your device
    doesn''t happen to have an indicator light, just wait for a few seconds (slightly
    longer if you copied rather large files to it) before unplugging it.


    ![](img/855e727a697c289d306bb0e488065e20_119_1.png)


    Figure 6-13: XFM displays the contents of your USB storage device'
