    that comes bundled with your Xandros system. To get started, run Screen Capture
    by going to the Launch menu and selecting Applications ► Graphics ► Screen Capture.


    # 16B-1: Taking Full-Screen Screenshots


    Taking a full-screen screenshot with Screen Capture is extremely easy. In fact,
    each time you run Screen Capture, it automatically takes a screenshot of your
    entire desktop and anything that happens to be open at the time it starts. After
    that, once it is up and running, you all have to select Full Screen in the drop-down
    menu button next to the words Capture mode, and click New Snapshot (Figure 16-31).


    ![](img/855e727a697c289d306bb0e488065e20_339_0.png)


    Figure 16-31: Taking a full-screen screenshot with Screen Capture


    Screen Capture will then take a shot of everything that is visible on your screen,
    except your mouse cursor and Screen Capture itself.


    # 16B-2: Taking Screenshots of a Single Window


    If all you want a screenshot of a single window, select Window Under Cursor in
    the Capture mode menu, and then click New Snapshot, after which Screen Capture
    will hide itself, as it always does at this point. Now, click anywhere on the
    window you want to capture, and Screen Capture will immediately take a shot of
    it.


    NOTE If you would like to take a screenshot of a window without its window borders,
    un the box next to the words Include window decorations directly below the words
    Snapshot delay in the Screen Capture window.'
