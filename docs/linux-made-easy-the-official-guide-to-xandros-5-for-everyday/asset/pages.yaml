  md: '# 12


    # # KEEPING TABS ON YOURSELF

    Working with Your PDA


    ![](img/855e727a697c289d306bb0e488065e20_217_0.png)


    When Apple Computer released the first personal digital assistant (PDA), the Newton
    MessagePad, back in 1993, then-CEO John Scully saw it as the wave of the future.
    As things turned out, Scully was right; PDAs (often called *handhelds*) eventually
    became as popular as chocolates on Valentine''s Day. Only problem was that it
    wasn''t the Newton that put PDAs on the map in terms of popularity. Although decidedly
    cool, the *ahead-of-its-time*, overpriced, initially underpowered, and definitely
    not-yet-ready-for-prime-time Newtons were outshone by the smaller, cheaper, and
    arguably easier-to-use Palm Pilots (see comparison in Figure 12-1). Yes, eventually
    it was a-chicken-in-every-pot-and-a-PalmPilot-every-pocket sort of world, with
    the Newton, despite having improved significantly through time, ultimately going
    the way of the pet rock and the Betamax (yup, it had one of those).


    Other makers would soon join in the PDA boom by producing their own units, many
    of which are still being marketed today. These included series such as the Zaurus
    from Sharp, the CLIE from Sony, and the Visor'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'from Handspring. The PalmPilot, however, remains the king of the hill in the
    world of PDAs.


    ![](img/855e727a697c289d306bb0e488065e20_218_0.png)


    Figure 12-1: An Apple Newton MessagePad and a PalmPilot


    # Can I Use My PDA with Xandros?


    A friend of mine, who was thinking of switching over to Linux, recently said that
    one of the things holding him back was the fact that he wouldn''t be able to use
    his PalmPilot if he were to make the switch. His reasoning was logical enough,
    as each PDA today comes with software that you can install on your computer to
    allow you to synchronize the data on your PDA with that your computer. Such software
    disks contain Windows and usually Macintosh versions of the software, but nothing
    for Linux.


    No, software, no go, right?


    Well, as I pointed out to my friend, that''s just the way it always is with Linux.
    No matter what hardware you buy, there is almost never a Linux version of the
    software for device included. Instead, and fortunately, everything you need to
    run the device is usually contained within the Linux distribution itself. This
    is the case with Xandros when it comes to PDAs. Xandros allows you to work out
    of the box, so to speak, with many Palm OS-based PDA models and series including


    +   * Handspring Visor and Treo

    * Sony CLI

    * Samsung SCH 1300

    * Garmin iQue 3600

    * Palm M Series

    * Palm 1705

    * Palm Tungsten

    * Palm Zire'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Project 12A: Setting Up Xandros to Work with Your PDA


    The key to setting up your system to work with your PDA is an application called
    Palm Pilot Tool. It doesn''t matter if your device is not a PalmPilot; as long
    as it is one of the models listed in the previous section (and that list could
    be larger by the time you read this), it will work. To get started, run the Palm
    Pilot Tool by heading over to the Launch Utilities menu and selecting Applications
    ▸ Palm Pilot Tool.


    The first time you do this, a window will appear telling you that the application
    (also known as KPilot) is not yet configured for use (Figure 12-2). Click the
    Use Wizard to move on to configuring it.


    ![](img/855e727a697c289d306bb0e488065e20_219_0.png)


    At this point, the first page of the rather plain-looking configuration wizard
    will appear. Setting up your system to work with your PDA is actually a very simple
    procedure. Just follow these steps:


    +   1. Before you do anything else, connect your PDA to your computer and power
    up the device.

    2. Once your PDA is attached and powered up, you''ll have to teach your system
    to find the device. You can easily do this by clicking the Automatically Detect
    Handheld & User Name button in the first page of the wizard (Figure 12-3).


    ![](img/855e727a697c289d306bb0e488065e20_219_1.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: '+   3. A small window will appear telling you to place your PDA in its cradle
    and press the HotSync button. Your PDA is already attached to the computer, either
    by cradle or direct USB connection, so you have already fulfilled the first of
    the directives.


    +   4. To fulfill the second directive in the message, press the **HotSync** button
    on your PDA''s cradle, or if you prefer, just not have a cradle, use your stylus
    to tap the **HotSync** icon on your PDA''s home page (left side of Figure 12-4),
    and then tap the **HotSync** icon again in the following (right side of Figure
    12-4). Once you have done that, click the **Continue** button in the wizard''s
    message window.


    ![](img/855e727a697c289d306bb0e488065e20_220_0.png)


    +   5. The configuration wizard will then search your machine for a connected
    device, showing the progress of its search in a new window until it finds one.
    Once it does, click **OK** in that window (Figure 12-5).


    ![](img/855e727a697c289d306bb0e488065e20_220_1.png)


    +   6. You will now find yourself back at the window where you started, but this
    time around, the information in the two text boxes will have been completed, reflecting
    the results of your search (Figure 12-6). Click **Next** to proceed.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_221_0.png)


    **Figure 12-6:** Hardware and user settings for your PDA displayed in the configuration
    wizard window


    7. In the final page of the wizard (Figure 12-7), you are asked to choose the
    application you want to use for syncing purposes. Accept the default by clicking
    **Finish**.


    ![](img/855e727a697c289d306bb0e488065e20_221_1.png)


    **Figure 12-7:** The final page of the configuration wizard


    8. A small window will appear telling you that the process is complete. Click
    **OK** to close the window.

    The Palm Pilot Tool application will then appear, and it will try to sync with
    your PDA. At this point, however your PDA will already have given up trying to
    sync, so go back to your PDA and tap the **HotSync** button with your stylus.
    The synchronization process will begin again, during which time the Palm Pilot
    Tool will show, in the right pane of the window, a log of what''s going on (Figure
    12-8).'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'When the process is complete, you will see the words HotSync Completed near
    the end of the log file. There will also probably be another string of messages
    after saying that the Pilot device does not exist. You can ignore this last set
    of lines, as it is just the log of the Palm Pilot Tool going another go at syncing
    while your PDA itself is already done any more syncing for you. You can also go
    ahead and disconnect it.


    ![](img/855e727a697c289d306bb0e488065e20_222_0.png)


    Figure 12-8: The Palm Pilot Tool shows a log of the HotSync process


    # Synching Forever After


    Once you have to set your PDA to work with Xandros, you can perform a HotSync
    at any time, using the steps you have learned. To make these steps easier to follow
    for future reference, I''ll rehash and streamline them at here:


    +   1. Connect your PDA to the computer.

    2. Power up your PDA.

    3. Run the Palm Pilot Tool by going to the Launch menu and selecting Applications
    ▸ Palm Pilot Tool.

    4. Press the HotSync button on your PDA''s cradle or tap the HotSync icon on your
    PDA''s home screen and then again in the screen.


    If for any reason your PDA and computer don''t sync, quit the Palm Pilot Tool
    (and its Panel app), power down the PDA itself, and start over.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Personal Information Manager—Contact


    The Palm Pilot Tool is a handy application, but its real purpose is syncing. To
    add, edit, or delete data to later sync with your PDA, you should use the various
    KDE applications that are conduits to the categories of information on your PDA.
    This application group consists of Address Book, Organizer, KNotes, and (if your
    PDA does email) KMail.


    Of course, using this application and that to check one thing or another can be
    quite the proverbial pain. Rather than bother with all those bits and pieces,
    you can use the Personal Information Manager application, also known as Contact,
    instead.


    Contact (12-9) acts as a centralized viewing and editing interface for the other
    modules and also to one of the email applications on your system, KMail (which
    won''t be covering because Thunderbird is so much better). It''s pretty good-looking
    to boot.


    ![](img/855e727a697c289d306bb0e488065e20_223_0.png)


    Figure 12-9: Personal Information Manager (Contact) in Xandros


    As you will see, Contact provides you with a Summary of all the important information
    you have stored on your PDA or computer (yes, you can use Contact without having
    a PDA). It also warns you when birthdays and anniversaries are fast approaching,
    and it tells you the weather conditions in as many cities as you set it up to,
    show weather information is supplied by your Xandros system, not your PDA.


    You can easily navigate to the various application to input and examine data by
    clicking the icons in the left pane of the window.


    # Setting Up the Contact Summary View Page


    Contact lets you customize the contents of your Summary view. To add or remove
    categories from page, go to the Settings menu and Configure Summary View.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'The Configure window for the Summary View page (Figure 12-10) consists of two
    panes: a right pane, which shows the items that can actually appear in the Summary
    View page, and a left pane, when clicked, allows you to configure some of the
    displayed items. To add an item to the Summary View page, check the box next to
    the item you want to add. Conversely, you can delete an item from the Summary
    View page want by unchecking the appropriate box.


    ![](img/855e727a697c289d306bb0e488065e20_224_0.png)


    Figure 12-10: Configuring the Summary View page


    I should mention at this point that one of the checked items in Figure 12-10,
    Contacts, may seem a bit bewildering, as it doesn''t seem to appear in the actual
    Summary View page.

    This was entirely the case for me. As I later discovered, however, Contact information
    is in fact displayed in that page of Birthdays and anniversaries, as this information
    is stored in the Address Book module, from which Contact information is gathered.
    This is the only information from the Address Book module that is displayed in
    the Summary View page.


    # Adjusting the Address Book Summary Display Settings


    If you click the second icon in the left pane of the Summary View Configure window
    (Address Book Summary), you can adjust some of the basic settings for the Contacts,
    or Address Book, display module. Basically, you have very few options here: whether
    or not to show birthdays/or anniversaries and how many days in advance these events
    should be displayed.


    # Adjusting the Schedule Summary Display Settings


    To adjust the settings for the Schedule module of the Summary View page, click
    the Schedule icon in the left pane of the Configure window. From the settings
    that appear in the right pane of the window, you can decide how'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'many of schedule information should be displayed on the Summary View page,
    and which Todos, all or just those for today, should be displayed in the Todos
    section of that page.


    # Setting Up the Weather Summary Display


    If you click the Weather Service icon in the left pane of the Configure window,
    you can set up the cities you want in the Weather section of your Summary View
    page. You can do this via the right pane of the window by clicking the various
    + symbols in the subpane until you reach the location you would like to add. Once
    you have found that location, click it to select it, and then click the Add button.


    For example, if you wanted to add Karachi to your list of weather stations, you
    would click + Asia ► Pakistan ► Karachi. You can, of course, add as many locations
    as you want to show up on the Summary page.


    ![](img/855e727a697c289d306bb0e488065e20_225_0.png)


    Figure 12-11: Adding locations to the Weather summary display


    # Using the Various Application Modules That Appear in Kontakt


    As I mentioned in the previous section, Contact is really just a centralized environment
    from which you can view and edit data in a manner of other stand-alone applications,
    each of which can be started on one via the Launch menu. The Address Book, for
    example, can be opened by selecting Applications ► Accessories ► Address Book.
    Because Contact allows you to conveniently use all of these applications in one
    place, however, I will focus on using these applications via that framework.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'The data in the various application modules in Contact are all synced with
    that you have on your PDA. When you input data into your PDA and perform a HotSync,
    the data on your PDA will be copied to the respective application modules in Contact.
    Conversely, when you input or edit data in one of Contact''s application modules
    and perform a HotSync, data or changes will be copied to your PDA. All very handy.


    This does not mean, however, that you have to have a PDA in order to use these
    modules. You will be happy to use any of them quite handy without ever joining
    the handheld fray.


    To view, edit or add data to your address book, click the Contacts icon in the
    left pane of the Personal Information Manager (Contact) window.


    When the Contacts modules appear in the right pane of the window


    ![](img/855e727a697c289d306bb0e488065e20_226_0.png)


    Figure 12-12: Using the Contacts module


    To add new entry to the address book, click the first icon in the horizontal bar
    below the menu bar, and select New Contact from the File menu.


    An Edit Contact window (Figure 12-13) will appear when you can input all the data
    you have. If you like to input birthday or anniversary information that it will
    appear in the Summary View page, click the Details tab, and then, once in that
    tab, enter the information in the appropriate boxes. When inputting birthday,
    be sure to input the date (9-28-1958, for example), rather than the birthday (9-28).


    If you would like to edit the information for a contact already in double-click
    that contact''s name from the list in the main page of the module, and the Edit
    Contact window for that will appear. Whether creating a new contact or editing
    the information for an existing contact, once you are finished, click the OK button.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_227_0.png)


    # # Todo List


    The Todo List (Figure 12-14), as its name implies, is a simple list of reminders
    for things that you need to do. You can open the Todo List module by clicking
    the **Todo List** icon in the left pane of the Kontakt window.


