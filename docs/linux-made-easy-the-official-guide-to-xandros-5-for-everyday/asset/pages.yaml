    # # Drop Caps


    A pretty cool feature that can add some oomp to your documents is Drop Caps. Drop
    Caps takes the first letter of the first word of a paragraph and blows it up so
    that its height equals the first word of two or three lines of your document.
    You can see an example in the document shown in Figure 17-1.


    On an aesthetic note, having a drop cap at the beginning of every paragraph within
    your document really lessens the overall effect and instead makes things look
    a bit over.


    That said, it is easiest in the long run to add a drop cap to your first paragraph
    after you have already typed in second. If not, every paragraph you write after
    the first will automatically begin with a drop cap.


    Here are the steps required to add a drop cap to your document:


    +   1. Start out by clicking once anywhere within your first paragraph.

    2. Next, go to the Format window and select Paragraph.

    3. When the Paragraph window opens (Figure 17-9), click on the Drop Caps tab.

    4. In that tab, check the box to Display drop caps. If you like, then go on to
    around with the other settings, though the defaults should be fine.

    5. When finished, click the OK button, and the drop cap will be added to your
    document.'
