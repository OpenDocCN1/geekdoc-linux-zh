    After you click the Install Selected Applications button, the installation process
    will be exactly the same as the process you performed in Project 8A. The only
    difference will be that the window shows what you are about to download and install
    (like that in Figure 8-7) will now show all of the applications you are about
    to install, rather than just one.


    # # Uninstalling Applications via Xandros Networks


    Xandros Networks not only allows you to install files and applications, but also
    allows you to remove them. For example, let''s say that you installed Lines in
    the previous project, but don''t really think you''ll ever be using it. Well,
    no sweat, because you can remove it as easily as you installed it in the first
    place. Here''s how you go about it:


    +   1. In the text box to the Search button, type the name of the application
    you want to remove. If you remove Lines, for example, you would type **lines**.

    2. Once you have typed the name of the application you want to remove, click **Search**.
    A list of packages matching, to some degree, the item you have entered will then
    appear in the top part of the right pane of the Xandros Networks window (Figure
    8-13).

    3. Locate the item you want to remove, and then click **Remove**.


    After that, it is all pretty much the same process that you followed installing
    the application, so I won''t go through the steps again here. When the process
    is done, however, you can go back to the **Launch** menu to look for the application.
    Unless you did something terribly odd, the application will be gone.'
