  md: 'As you will no doubt notice, in the results (shown in the left side of Figure
    16-9), your now properly skewed image will have some unsightly white areas at
    its top-left and bottom-right sides.


    ![](img/855e727a697c289d306bb0e488065e20_322_0.png)


    **Figure 16-9:** An image skewed in Paint, before and after cropping


    To get rid of these unwanted white spaces, crop the image so as to eliminate those
