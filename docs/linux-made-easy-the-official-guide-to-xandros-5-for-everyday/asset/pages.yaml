  md: '# 17C-3: Designing Your Business Cards


    For learning purposes, we will be creating a rather elaborate, some might say
    gaudy, business card that includes a graphic, a shape, a line, and two or three
    different fonts. Of course, when you create one of your own, you might prefer
    something bit calmer, but as I said, this is for learning purposes.


    # Phase One: Adding an Image to Your Card


    To start out, you will add an image to your card. You can choose anything you
    want—a photo, a line drawing, or whatever you come up with. To insert the image
    into the design grid, here''s what you need to do:


    +   - Click the image button, which is the sixth item in the second row of buttons
    (with a little house on it).

    - Next, click your mouse button at one of the corners where your graphic will
    actually be situated, and then drag your mouse until the area you would like to
    fill with that image is covered in a checkerboard-patterned rectangle, like the
    one you see in Figure 17-29.


    ![](img/855e727a697c289d306bb0e488065e20_371_0.png)


    +   - Now insert the image by clicking the Browse button in the right pane of
    the window and navigating to and selecting your image (by clicking once) in the
    Load image window that appears.

    - Once you have made your selection, click the OK button. Your image will then
    appear within the previously checked rectangle within the design grid.'
