  md: '# 16


    # # DOING THE LEFT BANK

    Working with Graphics Applications


    ![](img/855e727a697c289d306bb0e488065e20_315_0.png)


    Now that you have gotten a taste of Xandros’s audio and video capabilities, let’s
    round out this more artistic side of things by focusing on its graphical capabilities.
    You have already learned to download and view images from your digital camera
    and how to add yet other images via your scanner, but Xandros doesn’t force you
    to leave things at that. With the graphics applications that come bundled with
    your Xandros system, and others available via Xandros Networks, you can go on
    to enhance and manipulate those images or create totally different ones of your
    own. In addition, you will be able to take screenshots of your desktop and other
    application windows. Basically, if you want to get graphical, the Xandros system
    comes with the tools that allow you to do so.


    # Paint


    Bundled with your system is perhaps the simplest of graphics applications—Paint
    (also known as KolourPaint). When you run Paint (Launch > Applications > Graphics
    > Paint), you will notice that in terms of how you use it with Windows.'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'and how it functions, it is very similar to the Paint program that comes with
    Windows systems (Figure 16-1).


    Paint is equipped with all of the basic tools (brush, pencil, fills, eraser, shapes,
    and so on) to allow you to create simple images, though not particularly sophisticated
    or complex ones. This lack of sophistication is one of the reasons that Paint
    goes largely overlooked by most users. But as the saying goes, you can''t judge
    a book by its cover, and Paint has a lot to offer benefit beneath the surface
    than first appearances might seem to indicate.


    ![](img/855e727a697c289d306bb0e488065e20_316_0.png)


    Figure 16-1: Paint—a seemingly simple, but actually surprisingly capable, application


    # Changing Image File Formats in Paint


    Graphics files come in a variety of types. The images from your digital camera,
    for example, are usually JPEG (.jpg), which along with GIF (.gif) is the most
    common file type for images used on web pages. There are, of course, still others.
    Sometimes you may need to convert an image from one file type to another, for
    example, when you are preparing an image to use on a web page of your own. Paint
    is capable of performing many of these conversions, though not all of them. However,
    since Paint can read images in the most common graphic formats (.gif, .jpg, .bmp,
    .png, .pcx, .ico, .tif) and can write files in many of the formats most likely
    to be of interest to you (.bmp, .jpg, .png), it can prove to be quite useful when
    performing such conversions.


    Let''s say that you have a .bmp image that you would like to use in a new home
    page you are working on. In this case, you want to convert the .bmp image to a
    web-friendly .jpg image. Here''s what you would do:


    +   1. Open the .bmp image in Paint by going to the File menu and selecting Open.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '+   2. Without anything else, go to the File menu again and select Save As.


    +   3. When the Save Image As window appears (Figure 16-2), select JPEG image
    from the drop-down menu next to Filter.


    ![](img/855e727a697c289d306bb0e488065e20_317_0.png)


    Figure 16-2: Changing the file format of an image in Paint


    +   4. If you want to reduce the time it will take to load the picture on your
    web page, decrease the quality of the picture by using the slider bar next to
    the word Quality (this slider will appear in the Save Image As window you have
    selected JPEG image in the drop-down menu). The trade-off between image quality
    and load time is something you will have to come to terms with yourself, but a
    bit of trial and error should provide you with a happy medium.


    +   5. Once finished, click Save, and that''s all there is to it.


    # Resizing Your Images in Paint


    You have no doubt yourself with images that are just a tad bigger than you would
    like them to be, especially if you have one of today''s multimillion-megapixel
    digital cameras. There are many applications that allow you to shrink images down
    to size, so to speak, to make them easier and lighter to use in emails, web pages,
    and whatever you have in mind. Using Paint for this purpose is especially handy.
    To reduce the size of image, open it in Paint (File > Open), and then follow these
    steps:


    +   1. Select Resize/Scale in the Image menu.


    +   2. In the Resize/Scale window that appears (Figure 16-3), click the Scale
    button. If you are resizing a line drawing, you might want to try Smooth Scale
    instead in order to reduce the jaggedness of the lines. If you''re not sure which
    to use, try first, undo your work once you''ve had a look, and then start over
    and try the other.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '3. In the same window, check the box next to Keep aspect ratio. This retains
    the ratio between the width and height of the image, so that you don''t end up
    with a peculiar-looking stretched-out result.


    ![](img/855e727a697c289d306bb0e488065e20_318_0.png)


    Figure 16-3: Shrinking an image down to size in Paint


    4. Finally, in either of the boxes next to the word *Percent*, set the percentage
    of reduction you would like to perform.


    5. When you have finished, click the OK button, and the results will be seen immediately
    in the main window.


    6. If the size of the resized image is what you were hoping for, go to the File
    menu, select Save As, and save the file with a name, retaining a full-sized copy
    of the original, which is always a good idea. If you would instead like to have
    a second go at things, so as to make the image bit smaller or larger, go to the
    Edit menu, select Undo: Scale, and then start again from step 1.


    # Cropping an Image in Paint


    Sometimes, the problem you have with an image is not its size (or not only its
    size) but rather what you want to see in the image is too small. For example,
    let''s say that the only things you are really concerned with the image in Figure
    16-4 are the horse and buggy.


    That being the case, you could crop the photo to include that portion of the image.
    Here''s how you go about it:


    +   1. Use the rectangular selection tool (the top-right icon in the tool panel
    at the left of the window in Figure 16-4), and then select the portion of the
    image you want to crop. Once you have done that, a dashed line will appear surrounding
    portion of the image.


    +   2. Next, go to the Selection menu, and select Set as Image (Crop).'
  merge: -1
  pgno: 318
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_319_0.png)


    **Figure 16-4:** The focus of your image lost in superfluous details


    The image will now appear in the main window reduced to the area you selected
    in step 1 (Figure 16-5).


    ![](img/855e727a697c289d306bb0e488065e20_319_1.png)


    **Figure 16-5:** Cropping an image in Paint


