- img_proc: true
  md: 'only teach the reader how to do something, but also provide him or her with
    the chance to put morsels of knowledge into practice in the form of exercises.
    I have therefore included several exercises, or projects, in this book where appropriate
    to give readers opportunities to apply their knowledge. This book will serve as
    a reference text and will provide a dynamic learning experience, that you can
    learn by doing, as they say.


    The projects throughout this book have a secondary purpose as well: by working
    through them, you will properly configure and round out your Xandros system so
    that it can do anything you want. By the time you finish this book, your system
    will have all the bases covered. If that is not enough to satisfy you, you will
    be happy to know that you have access to even more—an unbelievably greater amount
    more—via Xandros Networks, where you will find free applications than you will
    probably ever need... but more on that in Chapter 8.


    # How to Use This Book


    It is possible, of course, to use this book as a reference text that you only
    consult when you have a problem to solve, but would negate the basic concept behind
    its design. Instead, I recommend that you go through the entire book chapter by
    chapter, doing the projects along the way. This will give you a much broader understanding
    of how things are done (and of how you get things done), and it will reduce the
    chance for anxiety, confusion, and over again, mistakes.


    It is best to read this book and complete its projects when you are relaxed and
    have time to spare. Nothing makes things go worse than doing things in a rush.
    And keep in mind that Linux and the projects in this book are fun, not just work
    exercises. The whole point of the Linux world, in opinion, is that it offers all
    kinds of fun. Go ahead and enjoy it.


    # About the Conventions Used in This Book


    There are only a few minor points noting about the conventions I have used in
    the book. I have put in bold words for items within your system that you need
    to click or directly manipulate in any way, such as buttons, tabs, menus, files,
    or folders, and also any text that I ask you to input. In Chapter 20, I use monospace
    font for any text that appears in the Console window. Anyway of that I wish to
    call your attention to, but not actually click or directly select, I have set
    in italics, which I use when first mentioning a window or application within the
    text. I have also opted to use the more suggestive term folder instead of directory—no
    doubt the legality of my many years as a Mac user.


    # About the CD in This Book


    The CD that comes with this book contains a full working copy of Xandros Open
    Circulation Edition. This is a full working Linux system that contains most, if
    not all, of the applications that an average home user will need'
