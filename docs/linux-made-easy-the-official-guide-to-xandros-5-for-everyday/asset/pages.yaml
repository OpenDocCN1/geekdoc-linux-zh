  md: '# Phase Three: Adding Subtext to Your Banner


    Now that you have your image and banner text in place, let''s add some subtext
    to that banner. This could be a message or a slogan that would have meaning in
    relation to the content of the banner text. For example, if your banner consists
    of your name, the subtext could be something like Nice Guy Extraordinary.


    Anyway, go about this the same way you added the banner text, but this time around
    a slightly more modest and less-heavy font in a different color and in a smaller
    font size. Then center the subtext directly beneath the banner text.


    # Phase Four: Adding a Line Beneath Your Banner


    Before moving on adding your address, phone number, and email address, you might
    want to differentiate the banner area of the card by adding a horizontal line
    beneath the two banner elements (the banner text and subtext). Here''s what you
    need to do to get about it:


    +   Click the line tool button (that''s the fourth button in the second row of
    icons).


    +   Next, click below the left end of your banner area and drag your mouse straight
    across the screen until you reach the other end, upon you release the mouse button.


    +   Finally, go to the right pane of the window and select a preferably bright,
    color for the line (red is nice). Once you''ve done all that, your card should
    look like a variant that shown in Figure 17-31.


    ![](img/855e727a697c289d306bb0e488065e20_373_0.png)


    Figure 17-31: Adding a line to your business card


