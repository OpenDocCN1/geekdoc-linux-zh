  md: '# PROXY SETTINGS


    ![](img/855e727a697c289d306bb0e488065e20_447_0.png)


    If your Internet provider or network has you behind a firewall, you will not be
    able to access Internet content, such as web pages and broadcast streams, unless
    you input the proxy server settings given to you by the service provider or network
    administrator. The method of inputting these settings, however, varies slightly
    from application to application. Although most KDE apps, such as the Panel Weather
    applet and Kdict, utilize the proxy settings you input for the system as a whole
    in the Xandros Control-Center, instructions for inputting both system-wide and
    application-specific settings are provided here.


    The information you need in order to input your proxy settings usually consists
    of a URL and a port number. The proxy preferences window provides separate input
    boxes for these two components of the proxy address. In cases where there is only
    one box for the information, write the two components together, separated by a
    colon, as in the example proxy.crazyfish.se:3128. Some providers or network administrators
    may also'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'require you to use your username and password in your proxy settings, be sure
    to check the proxy information provided to you before entering your settings.


    # Control Center—System-wide Proxy Settings


    As I noted, many applications gather their proxy information from your system-wide
    settings in the Control Center. These include Instant Messaging (Kopete), Media
    Player (Noatun), Online Dictionary (Kdict), Xandros Manager, and even Xandros
    Networks. To get these settings, follow these steps:


    +   Go to the Launch menu and select Control Center.

    Click the + symbol next to File Manager, and then click Proxy in the list that
    appears.

    In the Proxy module in the right pane of the window (Figure 1), select the appropriate
    choice per the the instructions of your Internet provider or network administrator.


    ![](img/855e727a697c289d306bb0e488065e20_448_0.png)


    Figure 1: The Proxy module in the Control Center


    +   If you are choosing either Use proxy environment variables or Manually specify
    the proxy settings, click Setup for that. Input the appropriate settings in the
    window that appears (Figure 2), and then click OK, after which window will close.


    +   Once you have finished, click Apply, and quit the Control Center.'
