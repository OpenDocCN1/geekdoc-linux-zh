    calling at local rates." In case, you’re wondering, Skype is available not only
    for Linux but also for Windows and Mac OS, meaning that just about anyone you
    know with a computer can use it.


    NOTE Skype was not bundled with earlier releases of Xandros Standard or Deluxe
    Editions V3. So, if you are a user of one of those and would like to get down
