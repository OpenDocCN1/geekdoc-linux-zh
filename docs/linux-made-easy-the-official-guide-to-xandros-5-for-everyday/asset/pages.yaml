    line, in case you''re wondering, indicates the path to a shell, in this case the
    Tk shell.


    +   4. Now, in the second line, change /usr/local/games/briscola/ to /usr/local/share/games/briscola/,
    which is where you are going to be placing the briscola folder so that all of
    the users on your computer can play it.


    +   5. Once you have done this, go to the Text Editor File menu and select Save.


    +   6. Quit Text Editor.


    # 20B-4: Moving the Briscola Folder to a Global Location


    If you were to leave the briscola folder where it is now (in your Home Folder),
    you would only be able to play the game. To make it available to others who user
    accounts on your machine, you need to copy it to a global location. Since global
    locations are all in root territory, you will first have to become root before
    you do any copying. Here''s what to do:


    +   1. Open a Console window (if one isn''t open already), and become root by
    typing su and pressing ENTER.


    +   2. When prompted for your root password, type it in and press ENTER.


    +   3. Copy the briscola folder to its new locations by typing cp -r briscola
    /usr/local/share/games/. Then press ENTER.


    +   4. Exit root by typing exit and pressing ENTER.


    # 20B-5: Running Briscola


    You can now run Briscola (and double-check your work) by doing the following:


    +   1. In the Console, move into the newly located briscola folder by typing cd
    /usr/local/share/games/briscola and pressing ENTER.


    +   2. Now run Briscola by typing ./briscola.tk and pressing ENTER.


    > NOTE In case you are wondering (there is no briscola.tk command), your system
    doesn''t know what to do with your input. The ./ that you used in step 2 tells
    your system to run the script you have signified after the slash (briscola.tk).'
