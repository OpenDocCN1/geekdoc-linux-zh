  md: '# 17B-3: Adding Text and Image Fields


    Now that you have your title banner set up, it''s time to add some content to
    your newsletter. You will be setting up your page so that it will have two columns,
    with an image at the top of the right Column. To do this, just follow these steps:


    +   1. Create a new text box on the left side of the page beneath your title banner.
    Start at the left margin, about an eighth of an inch below your banner area, and
    then drag your mouse until the box reaches the margin line of the page. The column
    should cover just under 50 percent of the page in terms of width.

    2. Now type whatever you want in this column, differentiating between titles and
    body by means of font size and style.

    3. When you are finished, click anywhere else on the page to deselect your text
    box.

    4. Next, add an image to the right side of the page, much as you did with Writer,
    by going to the Insert menu and selecting Graphics.

    5. Once you have inserted the graphic, resize it (again, much as you did in Writer)
    so that it will fit within the area for the right column, again at just under
    50 percent of the page in width. Remember to hold down the SHIFT key as you do
    this in order to retain the height-to-width aspect ratio of the image.

    6. When you''ve finished, click anywhere within the page to deselect the image.

    7. Finally, add a text box beneath the image, and type whatever information you
    want in it.

    8. Now click in any open space within the page to deselect that text box, and
    you will have the makings of a newsletter, something like that in Figure 17-27.


    If you would like now to move on and create a second page for your newsletter,
    you can add a page by going to the Insert menu and selecting Slide, which is Draw
    parlance for page.'
