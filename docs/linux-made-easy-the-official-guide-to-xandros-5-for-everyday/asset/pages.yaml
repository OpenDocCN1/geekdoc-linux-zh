  md: '# Project 10B: Getting a Grip on Resolutions


    If all this talk scanning versus printing resolutions has left you feeling as
    if you are locked inside a Dali painting, then you might want to join in this
    little hands-on-experiment. Once you have completed it, you should have a better
    idea of how resolutions translate into reality and work best with your printer.
    As a bonus, you''ll also get a little experience working with the OpenOffice.org
    application. To follow along, you will need one clear snapshot (preferably with
    at least one large object, as a portrait) and, naturally enough, a scanner and
    a printer.


    +   1. Scan your image at four different resolutions: 76, 150, 300, and 600 ppi.
    If your scanner cannot handle resolutions as high as 600 ppi, you can skip that
    one. Save the files that result as ex76.png, ex150.png, ex300.png, and ex600.png.
    Of course you can name the files anything you want, but using my suggestions will
    make it easier for you to follow along.

    2. Open Xandros File Manager window, and navigate to the folder where you saved
    the images.

    3. Select the files you''ve just scanned by holding down your CTRL key and then
    clicking each file individually. When you are finished, the files will be highlighted.

    4. Now right-click any of the four files, and in the pop-up menu that appears,
    select Cut. The files will not immediately disappear at that point, don''t worry.

    5. Navigate to your Home folder, and right-click any open space. In the pop-up
    menu that appears, select Paste. The four files will then appear (and, incidentally,
    disappear from the source folder).

    6. Run OpenOffice.org Draw by going to the Launch menu and selecting Applications
    ► OfficeOffice.org Drawing Editor.

    7. Go to the Insert menu in OpenOffice.org Draw, and select Graphics. An Insert
    Graphics window will then appear.

    8. In that window, navigate to your Home folder by clicking the Home button (as
    shown in Figure 10-12).


    ![](img/855e727a697c289d306bb0e488065e20_196_0.png)


    Figure 10-12: Navigating to your Home folder in the OpenOffice.org Insert Graphics
    window


    +   9. In the list within that window, locate and select the first file you scanned,
    by clicking on its name. The filename then should be highlighted like that in
    ex76.png, in Figure 10-13. If so, click the Open button, after which the image
    will appear at its full size in OpenOffice.org Draw.'
