  md: 'You may already have noticed that when you leave your computer running unused
    and untouched for five minutes or so, the screen will go black, though it will
    return to life when you move your mouse or tap on your keyboard. This is not some
    glitch in your system causing your machine to act up—it is your screen saver snapping
    into place. Of course, usually when you think of a screen saver, you think of
    pretty pictures or geometric patterns dancing about your screen, so the idea of
    a blank-screen screen saver might come as quite out of the quiet.


    Fortunately, this blank-screen screen saver is just one of the many screen saver
    modules available to you on your system. There are actually close to a hundred
    different screen saver modules for you to choose from, including the perennial
    말미, Flying Toasters.


    To access and select these modules, click Screen Saver beneath the Display heading
    in the left pane of the Control Center window.

    You will now be able to try the various screen saver modules available to you
    in the right pane of the window (Figure 7-16) by selecting the module and then
    clicking Test. A sample will then appear in the small monitor at the right side
    of the window. When you find a module that you would like to use, click the Apply
    button.


    ![](img/855e727a697c289d306bb0e488065e20_138_0.png)


    Figure 7-16: Selecting screen saver modules


    You can also decide when you want your screen saver to kick in by adjusting the
    Start Automatically settings, the default setting for which is five minutes of
    nonuse. Many screen saver modules also allow you to configure them individually,
    but the nature of the configuration options depends on the module in question.
    For example, in the case of Flying Toasters, you


    112 Chapter 7'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'can choose the animation speed, the number of toasters, the number of slices
    of flying toast, and even the look of the toasters themselves.


    To make changes of this sort, select the module in question, and then click Setup.
    A configuration window (Figure 7-17) will then appear. Once you have set up the
    way you like, click the OK button in that window and then the Apply button in
    the Control Center window.


    ![](img/855e727a697c289d306bb0e488065e20_139_0.png)


    # Enabling Auto-Login


    I mentioned earlier in the book that it is possible to set up your system so that
    you won''t have to type your user password when you log in and every time you
    start your machine. If you are the only one using your machine, and you are in
    an environment where no one else has access to your machine, this might not be
    a bad idea.

    If you want to set up this way, here''s all you to do:


    +   Click System Administration in the left pane of the Control Center window.

    In the subcategories that appear below System Administration, click Login Manager.

    When the Login Manager module appears in the right pane of the window, click the
    Administrator button at the bottom of the window, type your root password when
    prompted to do so, and then click OK in that password window.

    Once in root mode, click the Convenience tab in the right pane of the Control
    Center window.

    In page, check Enable auto-login. Your window should look something like mine
    in Figure 7-18.

    If everything in your window looks hunky-dory, click Apply, and the deal will
    be sealed. Good-bye, login password!'
