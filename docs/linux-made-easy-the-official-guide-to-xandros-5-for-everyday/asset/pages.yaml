    CLICKA X=565 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="xmms"

    </GROUP>

    ```


    # Figure 20: changes made to the New TuxBar theme file


    Next, on New TuxBar at the bottom of your screen, and select Reload Theme to allow
    your changes to take effect. After that, give it all a try by clicking the various
    icons with the TuxBar (except for those you haven''t installed, of course).'
