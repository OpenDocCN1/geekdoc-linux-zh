  md: '# 4


    # AN UNTAGLED WEB

    Setting Up Your Internet Connection


    ![](img/855e727a697c289d306bb0e488065e20_71_0.png)


    These days, average home-computer users spend more time at their computers surfing
    the Web and writing email messages than doing just about anything else. Even if
    you''re not much of a surfer, there are still numerous other applications that
    aren''t really Internet applications per se but still make use of the Internet
    in some way in order to gather data. The Panel Weather applet, when accessing
    weather data, and Xandros File Manager, when gathering song and album information
    while ripping and encoding audio files, are good examples.


    That said, having a computer that isn''t hooked up to the Internet is like buying
    a new Maserati and then refusing to take it out of the garage.


    # Connections


    To get connected to the Internet, you must have the right hardware. There are
    a number of possibilities in this area, including high-speed local area networks
    (LANs), cable modems, and ADSL connections from phone companies.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Most computers also have an internal 56 Kbps modem or can be connected to external
    dial-up modems for slower connections over regular phone lines. Depending on what
    you''ve got, setting things up on your system should prove a cinch in the case
    of LAN connections and cable modems. It might be slightly of a challenge in the
    case of dial-up connections.


    # High-Speed Connections


    If you have a high-speed Internet connection from your cable television company,
    or if you are connected to the Net by a local area network (LAN) at your office,
    you are really in luck, because these setups are probably the easiest to deal
    with. Most likely, all you have to do is connect the Ethernet cable from the wall
    (if you are using a LAN), or from your cable modem, to the port of the network
    card on your machine. After that, once you start up your machine you should be
    ready to go. If you have a high-speed connection from your phone company (ADSL),
    you will have to follow pretty much the procedure as for a dial-up modem, as explained
    later in the chapter.


    In case you''re not sure an Ethernet cable looks like, it is a round cable, one-eighth
    of an inch thick, with a plug at the end that looks like an oversized phone plug,
    as you can see in Figure 4-1.


    ![](img/855e727a697c289d306bb0e488065e20_72_0.png)


    Figure 4-1: Standard telephone and Ethernet connectors compared


    If you have a problem getting online, and you are trying to connect to the Net
    via a LAN or cable modem, the problem could very likely be that your network card
    is not supported by your system. This is relatively rare, but fortunately, easily
    remedied (by replacing it).


    The problem could also be that your network or service provider does not automatically
    assign addresses via DHCP (Dynamic Host Configuration Protocol). DHCP is a mean
    by which your Internet provider can automatically (dynamically) provide your system
    with the configuration information it needs in to connect to the Internet. If
    your provider does not utilize DHCP, you will have to get the necessary information
    about settings from the network administrator or service provider and enter them
    yourself.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Setting Up a Cable or Ethernet Connection for Providers Not Utilizing DHCP


    To input your cable or Ethernet settings yourself, run the Control Center (Launch
    Control Center), and click Network in the left pane of the Control window when
    it appears. In the list of subcategories that appears below, click Network Connection.
    When the Network Connection module appears in the right pane of the window, click
    the Administrator button, and type your root password when prompted to do so.


    The right pane of the Control Center will be outlined in red, and everything within
    it will be active, meaning that you can alter its contents. Click the Interfaces
    tab, and in the new tab, make sure Enable Network is selected, click Specify Static
    Address, and input the appropriate addresses as instructed by your network administrator
    or Internet provider (Figure 4-2). When you are, click Apply, and then close the
    Control window.


    ![](img/855e727a697c289d306bb0e488065e20_73_0.png)


    Figure 4-2: Manually inputting network IP settings


    NOTE If you are wondering what IP and DNS are all about, you can simply think
    of them in this way: the DNS translates the easy-to-remember URLs that you have
    come to know, such as www.yahoo.com, into numerical, or IP, addresses that the
    Internet can understand. The address http://www.yahoo.com becomes http://216.109.118.68.
    You can type the numerical version into your browser later to see for yourself.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Internal Dial-up Modems


    Many, if not most, of you are still using dial-up Internet connections, which
    means that you need to have a traditional dial-up modem to reach beyond your box
    to the outside world. These modems, in case you''ve forgotten, are those wonderful
    machines that whistle, chime, screech, and spin when you dial up your Internet
    provider. I suppose you could think of them as telephones in need of a good burp.


    The biggest drawback dealing with modems in Linux is that very few modems are
    supported. On the positive side of things, once you find a modem that works, it
    is relatively easy to set up. The main reason behind this compatibility problem
    that most built-in modems are software dependent, and the software they depend
    on is part of, or designed for, Windows. Such modems are thus called Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmodems
    so that they work with Linux systems. Though support for the wide variety of Winmod
    modems out is still patchy, the Xandros Connection Wizard does a pretty good job
    trying to get yours working. If you are not sure what kind of modem you have installed,
    my advice would be to go through the Internet connection setup process to see
    or not your modem works with Xandros. If it doesn''t, replace the modem with one
    that is known to work, preferably a true-hardware modem. Hardware modems, in case
    you are not familiar with the term, or modems are not software dependent and thus
    work with whatever system you happen to use. You can think of them as telephones
    without a headset.


    Probably the best way to find which modems do with Xandros is to check out the
    Xandros hardware-compatibility database (http://support xandros.com/hclv3) or
    go to Xandros User Forums (http://forums xandros.com) and ask for suggestions.
    The US Robotics models 56K V9 56 PC Card Modem (PC card slot, for laptops) are
    both true-hardware modems that are easily available and said to work. You can
    check the US Robotics site (usmr.com) for more information on these modems.


    **WARNING** When purchasing a modem, beware of generic, no-name internal modems
    that say they are Linux-compatible. Check out the Internet first to verify such
    a claim. Sometimes such modems are only compatible after you do all sorts of dreadful
    things to your system that even a hardcore geek wouldn''t want to bother with.
    A little Tux icon on the box doesn''t necessarily mean that the modem is Linux-friendly.


    # External Dial-up Modems


    If you find that the dial-up modem does not work with your Xandros system, the
    best solution is to buy an external serial modem. An external modem in a box outside
    your computer, and it connects to the serial port in the back of the computer,
    which is the one that looks like a'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'hole with little prongs in it (see Figure 4-3). Because the modem doesn''t
    use your operating system to operate, it does not tie up system resources while
    it''s busy, which may result in a possible pick up in computer speed.


    ![](img/855e727a697c289d306bb0e488065e20_75_0.png)


    **Figure 4-3:** Serial port and connector


    Most external serial modems should work with your system, or at least that is
    what most people will tell you. If you are worried and looking for a sure thing,
    Zoom Telephonics (www.zoom.com) makes an external modem that is compatible with
    Linux, and they say so on their site. The US Robots 56K V.92 External Faxmodem
    is also said to work, though I haven''t tried out this model myself.


    If you find another model that you think will do the trick, before you commit
    to it by slamming down the case, do a Yahoo or Google search for that modem''s
    make and number, along with the word "Linux," and see what results you get. Of
    course, you can also try out one of the Linux forums and ask about the modem make
    and model. There are a lot of people in the same boat as you, so you are sure
    to get plenty of opinions and advice.


    # Setting Up a Dial-up or ADSL Connection


    If you are going to use an external modem (ADSL or dial-up), first power down
    your computer, connect the modem to the computer and then restart your computer.
    Once your computer is up and running, you will have to set things up so that your
    modem can communicate with your Internet provider. This is pretty easy to, and
    through this process you can also make sure that your modem, especially in the
    case of dial-up modems, actually works with your system.


    To do this, you will use the Xandros Connection Wizard, which you can access by
    going to the Launch menu and selecting Applications ► Internet ► Connection Wizard.
    The steps of the wizard are pretty much self-explanatory, but I will point out
    a couple of steps that might be puzzling or at least unfamiliar to you.


    The first page of the wizard (Figure 4-4) is quite simple, because it asks you
    what type of connection you are trying to configure. You can configure a connection
    for more than one type of device, so for example, if you have a laptop computer
    that you haul back and forth between home and work, this might be of great interest
    to you. Just be sure to configure the connection'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'for the type of device you are connected to at the time, and then run the wizard
    again later when you are connected to the other device. Once you have made your
    selection, click Next.


    ![](img/855e727a697c289d306bb0e488065e20_76_0.png)


    Figure 4-4: The Xandros Connection Wizard


    The next page of the wizard (Figure 4-5) is another area that might be unfamiliar
    to you. In this page, you will be asked which users will be allowed to use the
    connection service you are configuring. If you are the only person using your
    computer, or if you want everyone who is using your computer to access the Internet,
    accept the default All users. If you want to allow yourself, but nobody else,
    Internet access, select User. If you want to allow some users to have access and
    others not (such as for your spouse, and oldest kids, but not the real young ''),
    select Group (group you can set the details later). Once you have made your selection,
    click Next.

    If you are trying to set things up using a Winmod, the wizard warrants a special
    mention (if you''re not working with a Winmod, you won''t see this page). The
    Connection Wizard will check to see what kind of modem you have connected to your
    machine. It will display the results of search in the next page of the wizard,
    next to the word Device (Figure 4-6). You can just click Next unless you also
    see a list of drivers in the bottom pane of the wizard window (next to the word
    Driver). If you see drivers listed, select one of them (and just take a guess
    if you are not sure which one to use), then click the Load button. In this case,
    the wizard will tell you in a pop-up window. Then you can click OK to close that
    window. If it doesn''t work, go back and try one of the other drivers. Once you
    find a combo that works, click Next. If nothing works . . well, it''s time to
    do some shopping.


