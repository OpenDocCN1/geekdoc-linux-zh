  md: "# # The Xandros File Manager as an Internet Application?\n\nYou may be surprised\
    \ to discover that you actually have another web browser bundled with your system,\
    \ and you will probably be even more surprised by it is, the Xandros File Manager\
    \ (XFM) that you learned to use in Chapters 5 and 6 can also act as a web browser.\
    \ If you find this hard to believe, go ahead and try it out yourself. Just type\
    \ a URL in the Address box, press ENTER, and then you have it (Figure 13-17).\n\
    \n![](img/855e727a697c289d306bb0e488065e20_250_0.png)\n\n*Figure 13-17: The Xandros\
    \ File Manager as a web browser*\n\nNow, I showed that XFM's role as a web browser\
    \ also has its limitations, especially in regard to the availability of plug-ins,\
    \ but it can come handy for quick views of a certain page or for performing quick\
    \ searches, and so on. Play around with it, and see what you think. It should\
    \ be pretty intuitive in terms of usage, so I won't bog you down with redundant\
    \ details.\n\n# ## Project 13A: Email with Thunderbird\n\nThere are two email\
    \ clients that come bundled with your Xandros system, but the one that is all\
    \ the rage these days is Mozilla.org's Thunderbird.\n Thunderbird, in terms of\
    \ look and feel, is extremely similar to Windows' Outlook Expression, as you can\
    \ see in Figure 13-18, but it's actually much better. One of the reasons for this\
    \ claim is that Thunderbird isn's susceptible to the myriad of viruses that perpetuate\
    \ the Windows world via the Outlook and Outlook Expression address books. It also\
    \ has a built-in junk-mail filter that helps you cope with that most unwelcome\
    \ variety of mail-spam. Like Firefox, Thunderbird also allows you to expand your\
    \ versatility through the installation of various extensions. And if you want\
    \ to dress it all up a bit, you can change its appearance though the use of skins.\
    \ All very cool!"
  merge: -1
  pgno: 250
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_251_0.png)


    Thunderbird was not bundled with earlier releases of Xandos Standard or Deluxe
    Editions V3, if you are a Thunderbird-less user of those releases and would like
    to down-load and install Thunderbird, you can easily do so via Xandos Networks.


    # 13A-1: Setting Up an Email Account in Thunderbird


    When you first run Thunderbird, you will be presented with an Account Wizard (Figure
    13-19), with which you can easily set your email account.

    Here are the steps to do that:


    +   1. In the first page of the wizard, select **Email account**, and click **Next**.

    2. In the second page of the wizard, type the name you would like to appear in
    the Form of your email messages (in *Your Name*) and your email address (in *Email
    Address box*). Once you''ve finished, click **Next**.

    3. In the third page of the wizard, select the type of account you are creating,
    **POP** or **IMAP** (most accounts are POP, but if you want to be sure, ask your
    Internet provider). Then type the name of the incoming server and outgoing server
    in the appropriate boxes. This information should also have been supplied by your
    Internet provider; if you don''t have it, give them a call. When you have finished,
    click **Next**.


    In case you were wondering, a POP account is a traditional email account which
    new email is downloaded from your provider''s mail server and onto your computer.
    The mail is automatically removed from the server when you download it and there
    exists only on your computer, from which you can read it at any time. In IMAP
    accounts,'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'the mail resides on the server, and your computer thus acts only as a viewer
    of sorts. The advantage of this is that you can access and see all of your mail
    from any computer that connects to the mail server. On the negative side, if your
    provider''s mail server is down for any reason, you cannot read any of your mail.


    ![](img/855e727a697c289d306bb0e488065e20_252_0.png)


    Figure 13-19: The Thunderbird Account Wizard


    +   4. In the next page, use the username for your mail account as instructed
    by your Internet Provider. This is generally not the same as the username you
    use when logging into your system. It could be as simple as your last name or
    something more complex in appearance, such as MyCleverEmailName@MyInternetProvider.com.
    Click Next when finished.


    +   5. In the page of the wizard, name your account. This name can be whatever
    you want it to be, but it should be a meaningful way of differentiating your account
    from any others you use now or in the future. A good choice is to use your name
    and that of your provider. Thus, for example, if your name is Jack, and your provider
    is telepathy.com, you might type Jack''s Telepathy Mail. Once you''ve named your
    account, click Next.


    +   6. In the final page of the wizard, you will be shown a rundown of everything
    you have typed so far. If everything looks right, click Finish.

    7. If you set up an IMAP account, you will then be immediately queried for your
    mail password. If you set up a POP account, this won''t happen until you click
    the Get Mail button in the main Thunderbird window. Whatever your particular case
    might be, once queried, type your mail password (per your provider''s instruction),
    and then click OK.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 13A-2: Sending and Receiving Attachments in Thunderbird


    One question I am often asked by compu-novices and casual compu-users is how to
    deal with email attachments. Attachments


    Attachments are a very convenient way of sending such files to others, unfortunately,
    they are also a common way of spreading viruses. Although, as a Linux user, you
    are pretty safe from the viruses that are out there in the world today, a bit
    of caution is always a good thing. That, before moving on to the subject of dealing
    with attachments, let me first lay down basic rules you should follow when dealing
    with them, regardless of what happen to you to be using.

    Here they are:


    +   - Don''t open or save attachments if you don''t know the sender.


    +   - Don''t open or save anything that ends in .pif, .scr, or .exe, as these
    are the most common forms in which viruses are masked and sort. There should be
    little reason for sending these to anyone who knows these kinds of files anyway.


    +   - If you do receive attachments of this sort (.pif, .scr, or .exe) from senders
    you know, don''t assume that person is deliberately sending you. As I mentioned
    earlier, many viruses spread by searching through Windows'' Outlook address books
    and then mailing copies to all of the contacts listed therein. A person''s computer
    might thus be sending out hundreds of virus-infected emails without the attachments
    from someone you know, so if you receive email with such attachments let them
    know; their system might be infected. Of course, such files are created to infect
    Windows systems, they shouldn''t do yours any harm, but it is best to avoid them.


    +   - Don''t open or save anything of which you do not recognize the file extension.
    Most files you should receive are in familiar extensions, such as .jpg, .png,
    .gif, .xxw, .swe, .doc, .xls, .mp3, and .ogg. Again, even if you recognize the
    extension, don''t open or save the attachment if you don''t recognize the extension
    because virus authors are finding new ways to worm their creations into your system,
    via .jpg files.


    +   - If you receive an email attachment from someone you know, but it, the email
    itself, seems suspicious, check with the sender before opening or saving the attachment
    as to make sure that the sender did indeed intend to send it.


    +   - Always be suspicious of files attached to mail forwarded to you. Check with
    the sender first before opening or saving the attachment, and even then be wary.
    After all, even though you don''t know who forwarded the attachment to you, you
    can''t be sure where it came from in the first place.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'If the title of an email contains the word "virus", even if it is from-one
    you know, then it is probably best to be suspicious of it also. After all, even
    if a message titled "Help, I think I''ve got a virus!" is legit, it would indicate
    that the sender''s system is infected, right?


    Now, if I''ve hopefully instilled a useful level of paranoia in you, let''s get
    on dealing with legitimate, nonviral attachments, starting with opening and saving
    those that you receive.


    # Opening and Saving Received Attachments


    When you receive an attachment, you''ll know because the title of the mail will
    have a small paper-clip icon next to it (Figure 13-20).


    ![](img/855e727a697c289d306bb0e488065e20_254_0.png)


    Figure 13-20: Thunder birds let you know you have received an attachment


    In addition, a small box will appear at the bottom of the email message in an
    Attachments box, displaying the name of that attachment, as you can also see in
    Figure 13-21. If the attachment is a graphics file, such as a digital photo, the
    image will also appear within the email message area.


    You have two ways to deal with the attachment, both of which involve right-clicking
    the filename in the Attachments box at the bottom of the window. When you do this,
    a pop-up menu will appear, and from that you can select either Open, which a window
    will appear asking you application to use in order to open the attachment, or
    Save As, which is the preferred method. When you select Save As in the pop-up
    menu, the attachment will be saved to your hard disk, from which you can do it
    as you see fit. Of course, if the attachment is a picture, you can just view it
    in the message area and leave it at if you have no interest in saving it for future
    viewing or use.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Sending Attachments


    If you want to send your attachment, simply click the Attach button in the Compose
    window for the email message you are writing, and then navigate to and select
    the file you want to attach in the Attach File window that appears. If you would
    like to attach more than one file, you could do so by holding down the CTRL key
    and then selecting each of the files you want to attach (Figure 13-1).


    ![](img/855e727a697c289d306bb0e488065e20_255_0.png)


    Figure 13-21: Sending email attachments in Thunderbird


    When you have finished making your selections, release the CTRL key (if you were
    selecting more than one file), click the Open button, and then it will be attached
    to your email message. Once you send that mail, your job will be done.


    # 13A-3: Dealing with Spam in Thunderbird


    Well, if you are anything like the millions of other users in the world today,
    you are probably deluged every week with hundreds of uninvited and unwanted email
    messages announcing that you qualify for a mortgage, offering low-cost prescription
    drugs, telling you that you can get an online degree, or wherever you may find
    singles in area. such as the wonders of the greatest nuisance foisted upon society
    since the heyday of telemarketers: spam.


    Fortunately, Thunderbird reduces the annoying effects of spam by means of its
    Junk Mail Controls feature. Thunderbird''s Junk Mail Controls feature is essentially
    an adaptive filter that to determine which of your email messages are spam. At
    first, it is none too clever and marks many a message as junk, leaving some junk
    messages as is. You will know'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'when Thunderbird has marked a message as junk by the trash icon in place next
    to the sender''s name in the list of email messages within the window (Figure
    13-22).


    | Rena Gill | 01/01/2005 09:47 PM |

    | Latisha Gunter | 01/01/2005 09:50 PM |

    | Everett Naquin | 01/01/2005 09:53 PM |

    | Daniel | 01/01/2005 10:22 PM |

    | Secret Admirer | 01/01/2005 10:24 PM |

    | Harry | 01/01/2005 10:07 PM |

    | Rickie | 01/01/2005 11:04 PM |

    | Cancun Vacation | 01/01/2005 11:30 PM |

    | Bonnie | 01/01/2005 11:44 PM |

    | Reyes Rubin | 01/02/2005 12:16 AM |


    Figure 13-22: Marking or unmarking messages as junk


    If Thunderbird has made a mistake, you can correct it by clicking the icon when
    a message is not junk or by clicking the small dot icon if the message should
    be marked as junk (also seen in Figure 13-23). Through time, Thunderbird learns
    what is junk and what is not (hence the adaptive I mentioned), eventually getting
    right most of the time. When you are satisfied that Thunderbird is getting things
    right of the time, you can set up the Junk Mail Controls to automatically route
    any incoming mail deemed to be in a special Junk folder.


    You can set it to automatically reroute such mail to the Junk folder by going
    to the Tools menu and selecting Junk Mail Controls. When the Junk Mail Controls
    appears (Figure 13-24), click the box to Move incoming messages determined to
    be junk to:


    ![](img/855e727a697c289d306bb0e488065e20_256_0.png)


    Figure 13-23: Setting up Thunderbird to automate the junk-mail-handling process


    230 Chapter 13'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'The other settings should already be correct, so just click the OK button,
    and your world, at least the world of your inbox, will become a much happier and
    less-cluttered place.


    Of course, spam from new sources will arrive from time to time, so you might still
    have to mark certain items as junk. When you do, from this point on however, these
    messages will be automatically moved to the Junk folder. It is also a good idea
    to check the Junk folder before trashing its contents—just to make sure that no
    messages are inadvertently placed there.


    # 13A-4: Using Folders in Thunderbird


    When you receive a lot of mail from a particular sender, it can be useful to set
    up a folder for that sender. This is especially handy if you happen to subscribe
    to one or more mailing lists, whose string of messages can quickly fill up your
    inbox. Just go to the File menu and select New ► Folder. After that, a small window
    will appear in which you type a name for the folder and then click OK. The folder
    will then appear in the left pane of the Thunderbird window. Once the folder is
    in place, you can simply drag the email that falls under the category you''ve
    created into it.


    A easier way to do this is by typing the name of the sender or group in question
    the search box near the top-right corner of the window. Once you do that, the
    messages will appear in your list of messages below (13-24).


    ![](img/855e727a697c289d306bb0e488065e20_257_0.png)


    > Figure 13-24: Finding and moving mail of a certain type in Thunderbird


    If you then click one of the messages in the list, and Choose Select All in the
    Edit menu, you can easily select all of these messages in one. Dragging them to
    the new folder then becomes a much easier chore, as all you have to do is click
    any one of the new-highlighted messages and drag the whole into your new folder.


    # 13A-5: Creating a Message Filter in Thunderbird


    If you would like to automate things so that certain messages are automatically
    loaded to your new, or another folder, in the future, you can create a message
    filter. To do this, start by going to the Tools menu and'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'selecting Message Filters. Once the Message Filters window appears, click the
    New button, which will bring up the Filter Rules window, shown in Figure 13-25.


    In that window, here''s what you have to do:


    +   1. In the uppermost text box, give your new filter name.

    2. In the same window, choose a surefire way to distinguish the messages that
    you would like to be automatically loaded into the folder upon arrival. For example,
    let''s say you created a folder for one of the mailing lists to which you belong.
    The subject lines of most mailing-list messages are preceded by the name of the
    list in brackets, such as [Music Lovers] or [Faye Wong List]. Since this is consistent
    for all mail from the list and is not likely to appear in any of other mail emails,
    it would be a good candidate for this purpose. Being the case, in the top pane
    of the Filter Rules window you would select contains in the second, and then in
    the adjacent box type the bracketed name of the list.

    3. In the bottom pane of the window, select Move to folder, and then, via the
    drop-down menu in the middle of the pane, select the folder to which you want
    the mail. In this example, you would select the folder you created in Project
    13A-4.

    4. Your Filter Rules would then look something like that in Figure 13-25. If so,
    click OK. The Filter Rules window will then close, and your new filter will appear
    in the list of filters within the Message Filters window, which you can then close.
    Now all of the mail you receive in the future from person or group specified in
    your new message filter rule will be automatically rerouted to that folder.


    ![](img/855e727a697c289d306bb0e488065e20_258_0.png)


    Figure 13-25: Setting email filter rules in Thunderbird'
  merge: -1
