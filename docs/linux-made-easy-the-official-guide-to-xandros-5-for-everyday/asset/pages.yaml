    box!) While you might worry that this is a needlessly geeky thing to buy, you
    will appreciate it in the long run, since it makes Skype seem all the more natural
    and thus fun. In addition, if you and the person with you are speaking not at
    least use headphones, you will be driven stark raving mad because your voice will
    bounce back to you as a delayed echo through your contact’s mike and vice versa.
    Trust me, the number-one problem beginning Skype users have is echo, and the reason
    for the problem is the same: one or both of the parties are not using headphones.'
