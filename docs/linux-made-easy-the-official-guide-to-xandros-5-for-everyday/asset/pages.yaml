    ![](img/855e727a697c289d306bb0e488065e20_245_0.png)


    Figure 13-11: Telling Firefox where to create your new Live Bookmark


    +   6. Once you''ve made your decision, click Add to finish the job.


    # Managing Bookmarks


    Anyone who does a lot of web surfing ends up with numerous bookmarks for their
    favorite sites. Over time, however, you end up with so many that they become somewhat
    hard to manage. Perhaps you would find it helpful to group some of them together,
    or maybe you want to rename some that they are easier to recognize, or maybe you
    would just like to delete some altogether. Well, you can do all of this via the
    Bookmarks Manager (Figure 13-12). To get started, open the Bookmarks Manager by
    going to the Bookmarks menu and selecting Manage Bookmarks.


    ![](img/855e727a697c289d306bb0e488065e20_245_1.png)


    Figure 13-12: Organizing bookmarks via the Firefox Bookmarks Manager'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Grouping Bookmarks Together


    You can group bookmarks of a common theme together by creating a new folder and
    placing all of the relevant bookmarks within it. For example, let''s say that
    you do a lot of online shopping and thus have numerous bookmarks for the sites
    with you do business. In that case, you could create a new folder called Shopping
    and drag all of your shopping sites into it.

    Here''s how to do it:


    +   1. Click the New Folder button.

    2. When the Properties window for the new folder appears, type Shopping in the
    Name box, and click OK.

    3. Press the CTRL key, and then click each of the bookmarks related to online
    shopping in the right pane of the Bookmarks Manager window.

    4. Release the CTRL key, and then click—but don''t release—any of the highlighted
    bookmarks in the right pane. Once you have done, drag the bookmarks to the new
    Shopping folder in the left pane. Now you can release the mouse button.

    5. If you go to the Bookmarks menu in the Firefox window and select the Shopping
    folder in the left pane, you will see all of your shopping sites neatly arranged
    in a pop-up submenu (Figure 13-13).


    ![](img/855e727a697c289d306bb0e488065e20_246_0.png)


    Figure 13-13: Grouping related bookmarks together in their folder'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Moving a Bookmark or Group of Bookmarks to the Bookmarks Toolbar


    Sometimes, when you use a particular bookmark quite frequently, it is more convenient
    to have it located in the Bookmarks Toolbar menu. In this way, your bookmark is
    always visible to you and thus only one click away whenever you need it—no scrolling
    and searching through long menus.


    To add a bookmark to the Bookmarks Toolbar, find the bookmark you want to relocate
    in the right pane of the Bookmarks Manager window, and drag it to the Bookmarks
    Toolbar folder in the left pane. A even easier way of going things is to click
    it at the very end of the URL for the page you''re viewing, drag it to the Bookmarks
    Toolbar, and then release the mouse button. The bookmark will immediately appear
    in the toolbar.


    # Renaming a Bookmark or Bookmarks Folder


    Occasionally one of your bookmarks might be so named that it is impossible to
    find when you are looking for it. For example, my bookmark for Town and Country
    Real Estate appears merely as HomePage, which is pretty useless as is. To change
    this state of affairs, or any like it, find and click the file you want to rename
    in the right pane of the Bookmarks Manager window, or a folder in either pane,
    and then click the Rename button. You can then type the new name for the bookmark
    or folder in the Name box of the Properties window.


    # Deleting a Bookmark


    When a bookmark is no longer of use to, and just there wastes space, you can easily
    delete it by clicking it to select it, and then clicking the Delete button.


    # Saving and Transfering a Copy of Your Bookmarks


    Friends often ask me how they can save and transfer their bookmarks from one computer
    to another. Fortunately, this is easy to do once you know how. First, save the
    bookmarks on the original machine by going to Firefox''s File menu, selecting
    Export, and in the Export bookmark file, giving your collection of bookmarks a
    meaningful name in the File name box, as bookmarks.html. Just be sure to keep
    the .html extension when you do renaming. Once have done that, your bookmarks
    will be saved as an HTML file, the same format as a web page.


    After you have saved your bookmarks, transfer the HTML file to the other machine
    by floppy, flash drive, or whatever you prefer. Once it is in the other machine''s
    Home folder, open Firefox on that machine and then its Bookmarks Manager. Select
    Import from the Manager''s File menu. In the window that appears, select From
    and click Next. You will then see an Import bookmark file window, and in that
    window, find your bookmark file. Click on it once to select it, and then click
    Open. Your old bookmarks will be nicely in place on your other computer.'
  merge: -1
