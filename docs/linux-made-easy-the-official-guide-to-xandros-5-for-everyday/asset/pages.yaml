    and to see how the command line can give you access to other programs available
    via Xandros Networks, why not give this project a try. The program you will be
    installing in this project is a simple, yet traditional, Italian card game called
    Briscola (see Figure 20-5).


    ![](img/855e727a697c289d306bb0e488065e20_438_0.png)


    Figure 20-5: Briscola


    # 20B-1: Getting the Briscola Files


