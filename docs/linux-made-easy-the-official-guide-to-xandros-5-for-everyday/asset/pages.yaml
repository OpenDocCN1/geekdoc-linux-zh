    \ Korea: SECAM (Sequential Couleur Avec Memo), found in\nFrance, former French\
    \ colonies, and former European East-block countries;\nPAL (Phase Alternating\
    \ Line), used almost everywhere else. There are also\nvariations of each of these,\
    \ some of which are incompatible with tech-\nnology at the time the various standards\
    \ were adopted and, as with so many\nother things in life, politics. SECAM, for\
    \ example, was essentially created to\nprotect French industry, while it was commonly\
    \ adopted in the former East-\nbloc countries to discourage citizens of those\
    \ countries from viewing Western\ntelevision broadcasts.\n\n# ### DVD Regional\
    \ Encodings\n\nThe other thing to remember when dealing with DVDs is regional\n\
    encodings. You may have noticed that many of the DVDs you buy there\na small logo\
    \ on the back of the package that looks like a globe with a number\nin the middle\
    \ of it. If you are in the United States or Canada, the number will\nbe, usually\
    \ with the television standard written underneath, which would be\nNTSC in this\
    \ case (Figure 15-5).\n\n![](img/855e727a697c289d306bb0e488065e20_306_0.png)\n\
    \nFigure 15-5: Examples of regional encoding labels on DVD packages"
