    in Chapter 8 . . except at the very end. Unlike the installation process for most
    other applications from Xandros Networks, the one for TV Time will include a few
    configuration steps before the process is complete.


    ![](img/855e727a697c289d306bb0e488065e20_312_0.png)


    Figure 15-11: A TV tuner card


    After the download and installation progress bars reach 100 percent and disappear,
    you will be asked three simple bits of information in the same Updating System
    window. Don''t worry too much about making a mistake, because you can change these
    settings at any time after the application is installed. The three steps are as
    follows:


    +   1. Select the default television standard for your location (Figure 15-12).
    As I explained in the previous section on playing DVDs, different countries use
    different broadcast standards. Therefore, what you type at this stage depends
    on where you live. If you live in the United States or Canada, type 1 for NTSC.
    If you live in France, type 2 for SECAM, and if you live somewhere in the rest
    of Europe, Australia, or New Zealand, type 3 for PAL. If you happen to live in
    Japan, as I do at'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'the present time, type **7** for NTSC-JP. Once you have entered the appropriate
    choice, click the **Enter** button in the XN window (or just press **ENTER on
    your keyboard**).


    +   2. Select the default frequency table. The choices in this step are quite
    simple. If you receive your television signal via cable, type **1**; if you receive
    it by antenna, type **2**. Once you have done that, click **Enter** or press ENTER
    on your keyboard.


    +   3. Do you wish to make `/usr/bin/vtime` setuid root? Just accept the default
    (no) to avoid having to deal with root privileges by clicking **Enter** or pressing
    the ENTER key.


    Once you have completed these three steps, the word **Done** will appear in the
    main pane of the XN window. You can then click the **Close** button.


    ![](img/855e727a697c289d306bb0e488065e20_313_0.png)


    # **Running TV Time**


    Now that the installation is complete, you can run TV Time by going to the **Launch**
    menu and selecting **Applications ▸ Multimedia ▸ TV Time**. TV Time will open
    as a simple, blackened, menu-less window. The first time you run it, there will
    also be a configuration menu displayed at the middle of the screen; however, since
    you will have already performed the basic configuration during the installation
    process, you can go ahead and close this by clicking **Exit**.


    > NOTE If you want to change your settings in the future, you can bring up the
    settings menu at any time by right-clicking anywhere in the *TV Time* window.'
