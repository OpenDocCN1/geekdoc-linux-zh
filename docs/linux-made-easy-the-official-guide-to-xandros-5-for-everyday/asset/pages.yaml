    # Phase Six: Wrapping Things Up


    Once you have everything positioned where you want it, it is time to save the
    image, and what you should do in two different formats. First, save a copy in
    the native GIMP format so that you can retain all the layers as is, allowing you
    to add or remove images in the future. To do this, follow these steps:


    +   1. Go to the File menu and select Save As.


    +   2. When the Save Image window appears, type a title for your image, and add
    the extension .xcf at the end. For example, I''ll be saving mine as WilmingtonWallpaper.xcf.


    +   3. Once you''ve done that, click the OK button to complete the process desktop
    wallpaper. Next, you will save the image in PNG format for actual use as your
    desktop wallpaper. Before you do this, however, you must merge all of your layers
    together into one, because PNG cannot handle layers.


    +   4. Go to the Image menu and select Merge Visible Layers.


    +   5. When the Merge Layers window appears, click OK.


    +   6. Now save the image as a .png file by selecting Save As in the File menu.


    +   7. Change the extension at the end of the filename to .png (or giving the
    image yet another name with the .png extension).


    +   8. When you have finished typing in the filename, click OK.


    +   9. When the Save as PNG window appears, just click the OK button, and the
    job will be done.


    You can close all of your still-open GIMP windows and quit the GIMP.


