  md: '# 16B-3: Taking Screenshots of a Single Menu or of an Open Menu Within a Window


    So far, so good, but what if you want to take a screenshot of a single menu or
    an open menu within a window? Well, this is where the Snapshot function comes
    into play. Until now, have been using Screen Capture without a delay, as the words
    No delay in the Snapshot delay box indicate (Figure 16-31).


    To take a screenshot of an open menu, select Window Under Cursor in the Capture
    mode menu, change the delay to something like 4 or 5 seconds, and then click the
    New Snapshot button. Once you have done that, rush over to the menu you want a
    shot of, click it (then release your mouse button), and leave the cursor in anywhere
    within that menu. After the 4 or 5 seconds are up, Screen Capture will take a
    shot of that menu.


    If you would like a shot of that menu within its window, the process is almost
    the same. This time, however, once the menu is open, move the cursor outside the
    menu area, so that it is somewhere in the window area. Leave it there until the
    4 to 5 seconds are up, and you will have taken a shot like that in Figure 16-32.


    ![](img/855e727a697c289d306bb0e488065e20_340_0.png)


    Figure 16-32: Taking a shot of an open menu within a window


    # 16B-4: Taking Screenshots of a Region


    Screen Capture, like the application Grab in Mac OS X, also allows you to take
    screenshots of a region. As you can see in Figure 16-33, a region can include
    any part of the desktop, a window combination of windows, or whatever.


    To do this, select Region in the Capture mode combination, and then click New
    Snapshot. Unlike what happens when you take a full-screen or single-window screenshot,
    however, Screen Capture will not immediately take the shot this time around. Instead,
    you must first select the region you''d to capture.'
