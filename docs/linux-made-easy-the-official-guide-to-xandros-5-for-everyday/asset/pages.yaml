    # Using Xandros Networks to Install Applications from CD (Deluxe and Business
    Edition Users Only)


    If you happen to have purchased the Xandros Deluxe or Business Editions, a good
    number of the applications available from the sources we mentioned thus far are
    included with your Xandros system on the Application Disc that view the contents
    of this and install the applications on it, slip the CD into your drive, and then
    go to the Edit menu in the X application and select Set Application Sources. When
    the Application Sources window appear, check either CD-ROM drive 1 or CD-ROM drive
    2, depending on how many drives you have and which you''ve placed the CD in, and
    then uncheck all other items in that window. When done, click OK, and you''ll
    be right to start browsing.'
