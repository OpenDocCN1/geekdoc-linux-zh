    # # Taking the Plunge—Installing Xandros


    Now that we''ve got all the background information down, let''s get on with and
    install Xandros on your machine. Fortunely, for installing Xandros is amazingly
    simple, and you would probably be able to do all on your own without any coaching
    from me. Still, since you forked the cash for this book, you might well let me
    be your copilot here guide you along so you can feel a bit more confident about
    what you are doing. In all, the whole process, depending on the power of your
    hardware, making it faster (and think easier) than Windows XP or Mac OS installation.
    And keep in mind that XP and OS X are only installing the operating system and
    just a few bundled applications. In a Xandros installation, you are installing
    not only the operating system itself, but most of the applications you will most
    likely need to use. You will then be getting a lot done in one swoop.


    One more thing before we start. Some people approach installing a system with
    a great deal of trepidation. The process makes them nervous, as if the house were
    going to go up in smoke during the process. Well, the house may go up in smoke,
    but not because of the installation process. As long as you have backed up your
    data, you will be OK. If you screw the installation the first time out, just start
    over again. No harm done, as you have nothing to harm, just make sure that you
    give yourself more time than you need for the process. Don''t start installing
    one hour before you have to be at work, or before you have to meet your friend.
    Rushing people do weird things. Make things easy on yourself by giving yourself
    plenty of time . . . and by backing up any data you mourn the loss of. That said,
    let''s get to it!


    # ## Project 2B: The Installation Process


    If you are going to set up your machine so that Xandros is your only operating
    system, go directly to Step 2. If, you are going to set up your machine to run
    both Xandros and Windows (dual boot), start with Step 1.'
