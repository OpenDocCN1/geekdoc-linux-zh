    suite, which is a viable and very capable contender in this last-man (or person)-standing
    arena. To make all the better, the three main components of OpenOffice.org''s
    office suite (Writer, Calc, and Impression) are also compatible with their Microsoft
    Office equivalents (Word, Excel, and'
