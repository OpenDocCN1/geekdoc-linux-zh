    # # Those of You Suffering Separation Anxiety


    If you are having trouble weaning yourself away from Windows completely, there
    is good news for you in the form of CrossOffice, a 30-day trial version which
    comes with the Open Circulation (the one in this book) and Surfind Editions of
    Xandros V3. If you want the full version, it can be had by upgrading to Xandros
    V3 Deluxe or Business Editions or can be purchased and downloaded via Xandros
    Networks.


    So what is it? CrossOver Office is an application that allows you to run Microsoft
    Office and a number of other Windows applications and web browser plugins from
    within Xandros even if you do not have a dual-boot Window/Xandros setup. To see
    which Windows applications and plug-ins are compatible with CrossOffice (and what
    degree they work), go to the CodeWeavers compatibility page at www.codeweavers.com/site/compatibility/browse
    and have a look.


    # ## Using CrossOver Office


    CrossOver Office usually runs invisibly in the background every time you run a
    Windows application in Xandros. The only times you actually needed to deal with
    it are when you run it for the first time and when you actually install Windows
    apps. To set up the first time around, go to the **Launch menu** and select **Applications**
    > **CrossOver** > **Office Setup.**'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'A very simple setup wizard will appear. Just click Next in the first screen
    of the wizard, Next in the second page, and Finish in the third. After that, you
    will see the usual setup window (Figure 17-36), from which you can install applications
    from setup files on your hard disk or Windows application CDs.


    ![](img/855e727a697c289d306bb0e488065e20_378_0.png)


    Figure 17-36: The CrossOver Office Setup window


    You can also use CrossOver to download and install various plugins that are normally
    not available in Linux (see Figure 17-37). To do so, just click the Install button
    and then in the Install Software window that appears, select the plug-in you want
    to install (QuickTime, Media Player, and Shockwave are the ones most want). Click
    Next, and then follow the remaining steps in the installation wizard.


    ![](img/855e727a697c289d306bb0e488065e20_378_1.png)


    Figure 17-37: Installing web browser plug-ins via CrossOver'
