  md: '# 19


    # KIDS’ STUFF

    Applications for Children


    ![](img/855e727a697c289d306bb0e488065e20_405_0.png)


    Given Linux''s well-earned, though no-longer-accurate, reputation as an operating
    system for geeks, you would probably be totally surprised if you were to find
    any Linux applications out there for for children. Well, start spitting out your
    oohs and wows, because Linux does indeed have offerings for the little ones. After
    all, even geeks have children.


    While there probably aren''t as many of these kids'' apps out there for Linux
    as there are for Windows or Mac OS, there are still enough to give your little
    ones just cause to demand the right to man your keyboard once in a while. Oh,
    and let you get the wrong impression, the somewhat-limited number of these applications
    is no indicator of their quality. Some are nicely designed and fun to play around
    with that they have become popular enough to warrant being ported over to the
    Windows and Mac OS worlds.


    Unfortunately, none of these applications comes bundled with your Xandros system,
    but don''t let that discourage you, because almost all of the ones I will be discussing
    in this chapter are available from Xandros Networks.'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'And what about those aren''t? Well, you will have to download them yourself,
    but you will still use the Xandros Networks application to install them, so, either
    way, will be quite easy at your end.


    # Potato Guy


    Let''s get started with an application that is probably quite familiar to you
    in its non-digital form—Potato Guy (Figure 19-1).


    Yes, Potato Guy is the computer equivalent of the old Mr. Potato Head game that
    you may have played with as a kid. In case you have a slightly deprived childhood,
    and thus not know Mr. Potato Head (or just dont remember him), the idea is simple:
    take an otherwise-normal everyday tuber, alboit with arms and legs; stick a hat,
    nose, eyes, mouth, or whatever else you want on it; and end up with a spud you
    can call your bud, like that in Figure 19-1.


    ![](img/855e727a697c289d306bb0e488065e20_406_0.png)


    **Figure 19-1: Potato Guy**


    Potato Guy has a few other differences from the Mr. Potato Head you played around
    in your day, as this digital version even talks. Stick a nose on your tuberfreund,
    and you will hear "nose." Kind of cool. If potatoes aren''t your thing, or at
    least your kids'' thing, you can opt for an aquarium motif for the Linux penguin,
    Tux, himself (Figure 19-2).


    # Installing and Running Potato Guy


    To download and install Potato Guy, run Xandros Networks, type **potato guy**
    in the text box at the top of the window, and click **Search**. After that, just
    click **Install** next to *Potato Guy* in the results that appear below. You can
    then run Potato Guy from the **Launch** menu by selecting **Applications** > **Games**
    > **For Kids** > **Potato Guy.**'
  merge: -1
  pgno: 406
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_407_0.png)


    Figure 19-2: Tux offers a respite from potatoes in Potato Guy


    # Tux Paint


    Now let''s move on to what is perhaps the most successful and popular Linux application
    for children—Tux Paint (Figure 19-3).


    Tux Paint is a cute and colorful paint program that allows your children (or anyone
    else''s, for that matter) to tap into their artistic side by creating their own
    works of art, simple as they may turn out to be.


    ![](img/855e727a697c289d306bb0e488065e20_407_1.png)


    Figure 19-3: Tux Paint


    Click to start drawing a line. Let go to complete it.'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'The collection of tools in Tux Paint is pretty much like that in most paint
    programs (brush, line, shapes, eraser, and so on). But there are also special
    features as the Magic button, which allows your children to alter whatever they''ve
    painted in rather sophisticated ways (blur, fade, dip, mirror); and the Stamp
    button, which functions like a rubber stamp, allowing the kids to pop down various
    images (fish, birds, plants, and even Euros), name a few anywhere they like within
    their creation. There are no menus in Tux Paint, so all the kids have to select
    a click is the appropriate button with the mouse, making everything very easy
    to deal with. To make things all the more appealing, there are sound effects that
    ring out every time the brush (or other tool) hits the canvas. In fact, it is
    so entertaining that you might end up playing around Tux Paint for a while yourself.


    # Installing and Running Tux Paint


    As with all of the applications I''ll cover in this chapter, Tux Paint can be
    easily installed via Xandros Networks. Just type to tuxpaint in the text box click
    Install to tuxpaint in the results that appear below. All three items listed in
    the results will be installed, which is what you want, believe me. After that
    . . well, you know the drill by. Once Tux Paint is installed, you can run it by
    going to the Launch menu and selecting Applications ► Graphics ► Tux Paint.


    # Using Tux Paint


    Using Tux Paint should be quite straightforward, since everything is controlled
    by large buttons that are easy for kids to manipulate. Remember that when they
    click one of the tool buttons on the left side of the window, the option on the
    right will change, showing the various options available for the tool they''ve
    selected.


    Your kids can also save what they have created by clicking the Save button, and
    their creations will be automatically saved to a special directory without any
    potentially baffling file-system navigation.


    To open one of their saved creations that they can proudly show them off to, all
    they need to do is click the Open button, and all of their saved files will appear
    as thumbnails within the Tux Paint window (Figure 19-4).


    # Letter Order Game


    Letter Order Game (Figure 19-5), also known as KMessedWords, is a simple and very
    traditional game that is essentially what both of its names imply.


    Your child is presented with a group of scrambled letters from which he then tries
    to figure out the correct word.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_409_0.png)


    Figure 19-4: Saved files are easily accessed from within the Tux Paint window


    ![](img/855e727a697c289d306bb0e488065e20_409_1.png)


    Figure 19-5: Letter Order Game


    # Installing and Running Letter Order Game


    You can get Letter Order Game via Click **letter order game** in the text box
    at the top of the X window and clicking **Search**. Click **Install** next to
    *Letter Order Game* in the results below, and then follow the usual drill for
    installing applications via Xand Networks that you learned in Chapter 8. Then
    you can run Letter Order Game by going to the **Launch** menu and selecting **Applications**
    > **Education** > **Language** > **Letter Order Game.


    # Playing Letter Order Game


    When the Letter Order Game window appears, you can start playing by selecting
    your level (*Easy* is the default) and then clicking the **Randomize** button.'
  merge: -1
  pgno: 409
- img_proc: true
  md: 'A messed-up word will appear in the main part of the window (as shown in Figure
    19-5); then, in the Your guess box at the bottom of the window, you type your
    guess as to what those letters actually represent.


    Click the Try button, and if you have typed in the word correctly, a window will
    pop up congratulating you on spelling the word correctly (left side of Figure
    19-6).


    ![](img/855e727a697c289d306bb0e488065e20_410_0.png)


    Figure 19-6: Letter Order Game tells you whether your guess is correct (left)
    or incorrect (right)


    You can then click the Play Again button in that window to go on to the next word.
    If your guess was incorrect, you will see a different window telling you that
    you missed (right side of Figure 19-6). Click the OK button in that window, and
    you get another crack at solving the puzzle. If you finally give up, click the
    Randomize button again, and you will get a new word to work with.


    # Hangman Game


    Hangman Game, as its name implies, is a computerized version of most traditional
    word games, Hangman. On the off chance that you''re not familiar with the game,
    I''ll give you a brief description. When you start a game, a series of lines representing
    the letters in a word appears at the bottom of the game window. You try to guess
    what goes in the blanks. If your guess is right, all the instances of that letter
    will appear in the appropriate blanks. Each time a letter guess isn''t in the
    word, construction of the noose and the person hanging from it will proceed, piece-by-piece
    and limb-by-limb. The object is to guess the word before getting hung.


    Despite the essentially innocent nature of the game, as a parent might not want
    your child playing a game that uses a gallows and noose as its motif. Well, let''s
    just say that in those cases where your child does lose a game, the hangman figure
    will at least not be the noose but rather hanging onto it by its hand (Figure
    19-7).'
  merge: -1
  pgno: 410
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_411_0.png)


    **19-7.** *Here’s what your children will see if they lose a game of Hangman*


    The message that appears at that point, however, does say, "You are dead," so
    I don’t really know what to tell you. At any rate, have a look at the results
    of a losing round in Figure 19-7 to see what you think, and then decide for yourself.


    # **Installing and Running Hangman Game**


    Hangman Game is available from Xandros Networks, so just type **hangman** in the
    text box, click **Search**, click **Install** next to *hangman game* in the results,
    and then follow the usual process you learned in Chapter 8. After the installation
    is complete, you can play Hangman Game by going to the **Launch** menu and selecting
    **Applications** > **Education** > **Language** > **Hangman Game.**.


    # **Playing Hangman Game**


    Playing Hangman Game is quite simple. Just type the letter you want to offer up
    a guess, and then press ENTER. If the letter is a part of the word in question,
    it will appear at the bottom of the screen. If the letter is not part of the word,
    it will appear in the *Misses* list at the top-left corner of the playing area,
    and construction of the gallows will begin.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# Tux Typing


    While we''re still on the topic of word and letter games, let''s move on to Tux
    Typing (Figure 19-8), commonly referred to as Tux Type, a close relative of Tux
    Paint.


    ![](img/855e727a697c289d306bb0e488065e20_412_0.png)


    Figure 19-8: Tux Type


    Tux Type is a very attractive and well-featured typing-tutor application, complete
    with music and sound effects that even you can enjoy. There are two different
    typing games in Tux Type: one called Key Cascade, where you type out the letters
    you see plastered on the falling fish so that Tux can eat them (the fish), and
    one called Word Cascade, where you do the same thing to falling words. Both of
    the games in Tux Type have three levels of difficulty, so they could be used by
    children of different ages—even kids in their mid-forties.


    # Installing Tux Type


    To install Tux Type, run the Xandros Networks application, type xandros-tuxtype
    in the text box, and click Search. The list of results will be empty at first,
    but you will be instructed to click Expert under Search Results, so that (at the
    bottom of the left pane). When xandros-tuxtype appears in the right pane, click
    Install, and then follow the usual drill.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Running Tux Type


    You can run Tux Type from the **Launch** menu by selecting Applications ▶ **Education**
    **Tools** ▶ **Tux Typing**, but before you actually run it, be aware of the fact
    that Tux Type is set up by default to run in full-screen mode. If you would prefer
    to have the game appear in its own window, or if your computer is hostile to full-screen
    applications, as some are, go to the **Launch** menu and select **Run Command**.
    When the Run Command window appears, type tuxtype-w, and press ENTER.


    # Creating a Menu Launcher for Tux Type in Window Mode


    If you would always like to use Tux Type in window mode, it would behoove you
    to create a menu launcher that will allow you to do that more easily. Just follow
    these steps:


    +   Go to the **Launch** menu and select **Applications** ▶ **System** ▶ **Menu
    Editor.**


    +   When the Editor window appears, click the + symbol next to *Education*, and
    then click the + symbol to *Tools*.


    +   When the subcategories appear under *Tools*, click **Tux Typing** (it should
    be the only entry there)


    You would think at this point that the only thing you would have to add is -w
    flag to the current Tux Type launcher. Unfortunately, given the parameters I have
    set for this mode, that is not possible because the game was installed in root
    mode, as are all games installed via Xandros Networks. What you will have to do
    instead is create a totally new launcher, paired with the original launcher, will
    give you the freedom to play the game in whichever mode you please.


    +   With **Tux Typing** selected in the left pane of the Menu Editor, go to the
    **File** menu and select **New Item**.


    +   When the New Item window appears, type **TuxType (Window Mode)**, and then
    click **OK**.


    +   In the right pane of the Menu Editor window, **tuxtype-w** in the *Command*
    box, and then click the icon square to the right of the *Name* and *Description*
    boxes.


    +   When the Select icon window appears, scroll down and select **tux**.


    +   Once you''ve done that, click **OK** in the Select Icon window to close it.


    +   Your Menu Editor window should now look like mine in Figure 19-9. Assuming
    it does, go to the **File** menu and select **Save**. You can then quit the Menu
    Editor.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_414_0.png)


    Figure 19-9: Setting up a window-mode menu launcher for Tux Type


    # Using Tux Type


    When the Tux Typing window first appears, it will be opened to its menu screen
    (Figure 19-10).


    ![](img/855e727a697c289d306bb0e488065e20_414_1.png)


    Figure 19-10: The opening menu screen in Tux Typing'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'In that screen, you can use your mouse to select the game you want, and then
    you will be presented with a choice of skill levels. Once you select one of those,
    the game begins.


    The game is all about typing. See a fish with a w on it? Press w on your keyboard
    to type Tux over he can gulp it up. When you successfully complete a level, Tux
    will congratulate you (as in Figure 19-11), and when you don''t, you''ll be told
    so as well. That''s just all about there is to it.


    ![](img/855e727a697c289d306bb0e488065e20_415_0.png)


    Figure 19-11: Tux Typing congratulates you when you successfully complete a level


    # MathWar


    Now that we''ve covered quite a number of graphical and lexical applications,
    let''s move over to the mathematical side of things by introducing MathWar (Figure
    19-12).


    MathWar is a simple mathematics tutor that pops out simple math problems which
    you, or preferably your child, input the answers. The time in which you have to
    answer is set at 10 seconds (though you can adjust this in this either direction),
    and questions are divided among three operators: addition, subtraction, and multiplication
    (no division). You can adjust the percentage of questions for each operator so
    that, for example, 20 percent of the questions would involve multiplication, 30
    percent division, and 50 percent subtraction, you cannot configure the level of
    difficulty. Sorry.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_416_0.png)


    Figure 19-12: MathWar


    # # Installing and Running MathWar


    To get MathWar via Xandros Networks, type **mathwar** in the text box at the top
    of the XN window, click **Search**, click **Install** next to *MathWar* in the
    results, and then follow the usual drill for installing applications via Xandros
    Networks. You can run MathWar by going to the **Launch** menu and selecting **Applications**
    ▶ **Education** ▶ **Mathematics** ▶ **MathWar**.


    # # Playing MathWar


    When the MathWar window appears, go to the **File** menu and select **New Game**.
    A simple problem will appear, and your job is to get the correct answer within
    the time allotted and click **Submit**. A small timer at the bottom-right corner
    of the screen will show you how much time you have left for each question. If
    you do not answer within the allotted time, either you will be told that time
    is up and provided with the correct answer (an instant miss) or the computer will
    offer up its own solution, and you will then be asked whether you think the computer
    is correct. Make the right choice and you will get points; make the wrong choice
    and the computer gets points. All quite fair and simple.


    # # Changing MathWar’s Settings


    As mentioned, you can change any of MathWar’s settings. This is done by going
    to the **Settings** menu and selecting **Preferences**. In MathWar''s preferences
    window (Figure 19-13), you can adjust the number of rounds and the number of seconds
    per round (in the *General* tab), decide what percentage of the time the computer
    will offer up an answer of its own when you can''t'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'up with one yourself (in the Computer Player tab), and determine the percentage
    of questions that will be based on each of the three operators available (in the
    Operators tab).


    ![](img/855e727a697c289d306bb0e488065e20_417_0.png)


    Figure 19-13: Changing MathWar''s settings


    # # LPairs


    The next application we will be dealing with is a memory matching game by the
    name of LPairs (Figure 19-14).


    ![](img/855e727a697c289d306bb0e488065e20_417_1.png)


    Figure 19-14: LPairs—a pure and simple memory matching game


    The images shown in LPairs are not of a particularly childish variety, so the
    game shouldn''t be offensive to older kids or even adults. You might end up with
    a broader audience for this game than is the case with most of the other applications
    in this chapter. Still, it is really simple in concept, so the the little ones
    should find it fun too.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Downloading, Installing, and Running LPairs


    You can download and install LPairs via Xandros Networks by first making sure
    that the Debian Unsupported Site repository is enabled and then typing **LPairs**
    in the text box at the top of the window. Click the **Search** button, and then
    click **Install** next to LPairs in the pane below. Once the installation is complete,
    you can run LPairs via the *Run Command* window. Just type **lpairs** and then
    click **Run.**


    # Playing and Configuring LPairs


    When you run LPairs, it will open right into its main, and only, menu (Figure
    19-15).


    ![](img/855e727a697c289d306bb0e488065e20_418_0.png)


    **Figure 19-15:** The main menu screen in LPairs


    The options within the menu are few, and basically all you have to do is click
    any item for it to take effect. For example, to choose the number of tiles in
    the game, click **Cards** as many times as it takes to come up with the number
    of tiles you would like. Your choices are (tiles-per-row-row format) 4x4, 5x4,
    6x4, 6x5, and 8x5. Once you have gone through the other items and made your choices
    and are ready to play the game, just click **Start Game.**


    The game will start up with all of the tiles facing, which means they will all
    appear blank. To get started, just click a tile and it will flip over, revealing
    the image on its reverse side. Then click another tile to see if you can match
    the first. Once you match a pair of tiles, both will disappear, and you simply
    keep up that process until all the tiles are gone. If you want to return to the
    main menu, you can do so at any time by pressing the ESC key.'
