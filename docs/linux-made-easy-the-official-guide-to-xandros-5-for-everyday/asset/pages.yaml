  md: "# Project 7D: Changing the Look of Your System\n\nYou've just seen how you\
    \ can have a bit of fun with your system by changing the fonts it uses for everyday\
    \ system-related display tasks. Of course, when it comes to fonts, the choices\
    \ you make are not just based on your individual sense of aesthetics; you also\
    \ have to consider readability. Some fonts look really cool, to be sure, but if\
    \ you can't read anything when you use those fonts, there isn't much point bothering\
    \ them. When it comes to customizing the components that give your system its\
    \ distinctive look, however, you can really let loose and get wild.\n\nWhile it\
    \ is possible to customize the looks of both Windows and Macintosh OS X, in my\
    \ opinion the options available to you are actually quite limited. In Xandros,\
    \ and most other Linux distros, you can happily and freely go berserk. In Xandros,\
    \ not only can you change the colors of the various components of your system,\
    \ but you can also change the window decorations and control themes to such an\
    \ extent that you won't be able to recognize your system by the time you've finished.\n\
    \n# 7D-1: Changing Window Borders\n\nThe most immediately gratifying graphical\
    \ customization you can make is to the window borders that surround the various\
    \ system and application windows you use every day. It is also one of the easiest\
    \ things you can do. Just follow along with these steps:\n\n+   - Click **Display**\
    \ in the pane of the Control Center window.\n- Click in the list of subcategories\
    \ that appear, click **Window Decorations**.\n- As you can see in Figure 7-9,\
    \ the module display consists of a sample of the window decoration currently selected\
    \ (astastik is the default), and directly above that, a drop-down menu button\
    \ that you can use to browse and select from among the various window decorations.\n\
    - Click that drop-down menu and select **Keramik**, which, although not one of\
    \ my personal favorites, is pretty popular in the Linux world in general and (if\
    \ nothing else than that) strikingly different.\n Once you've made the selection,\
    \ a sample of the Keramik window decoration will appear in the right pane of the\
    \ Control Center window along with the various options available for that decoration\
    \ below it. If you then click the **Apply** button, the border of the Control\
    \ Center itself will be . . . well, Keramikized (Figure 7-10)."
