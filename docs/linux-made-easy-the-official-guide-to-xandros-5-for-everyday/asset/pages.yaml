  md: '# 14


    # # EAR CANDY

    nXandros Does Audio


    ![](img/855e727a697c289d306bb0e488065e20_271_0.png)


    It''s now time to move on to the audio side of things in our Xandros workout.
    In Chapter 6, you learned about Kscd, your system''s default CD player, but in
    this chapter you will find out even more about your system''s other musical talents.
    You will learn how to rip CDs and create MP3 and Ogg files (which have the .mp3
    and .ogg filename extensions, respectively), to change the tags of such files,
    and how to play them. You''ll also learn how to play the different varieties of
    Internet broadcast streams.


    # ## Audio Formats


    Before we start off on our discussion of how to work with audio files in Xandros,
    it is probably best to first discuss the various formats in which audio data can
    be stored on your computer, as this is essential information. The facto audio
    file standards in the computer world for the longest time have been WAV (created
    by Microsoft/IBM and using the .wav extension), AU (from Sun/Unix and using the
    .au extension), and AIFF (from Apple). All of'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'these are un formats, so files saved in these formats are therefore exceeding
    large, with an average WAV file of CD-quality music weighing in at 10 MB per minute
    of music. To put that in perspective, back in 1988 my first Macintosh had a 40
    MB hard disk—more space than I would ever need, I thought at the time, but not
    enough to store a WAV file of Nirvana''s "Come as You Are."


    As computers evolved into the multimedia machines they are today, became clear
    that something was going to be done about disk-saving audio files. Audio-compression
    formats were then developed. To simplify things a bit, these compression formats
    work by cutting out the portions of the audio signal that the human is less likely
    to notice if gone—sort of a dog-whistle approach. The most widely known and embraced
    of these audio-compression formats is MP3 (.mp3). Audio files encoded in MP3 format
    can end up being as little as one-twelfth of the original audio (.cd) file without
    any noticeable loss in quality.


    Another audio-compression format was developed Ogg Vorbis (.ogg). Ogg Vorbis is
    a product of the open-source community, and, unlike MP3, which has always been
    used under the shadow of yet-to-be-exercised patent rights, it has free of patent
    and licensing worries from the get-because of, and that it was equal to or, as
    many contend, better than MP3 in terms of quality and performance, Ogg Vorbis
    has become the darling of the Linux community and de facto audio-compression format.


    # The Xandros File Manager as an Audio App?


    In Chapters 5, 6, and 13 you learned about many things you can do with the Xandros
    File Manager. With XFM, you can work with your files, burn CDs, browse through
    your digital images, and even view web pages. But XFM can also function to some
    degree as an audio application. Xandros File Manager won''t play your audio files
    for you, but it will allow you to rip (copy) files from audio CDs and save those
    files as (uncompressed). It can also encode them (convert them to) Ogg files for
    your own use. After you complete Project 14A, you will also be able to encode
    tracks as MP3s


    Xandros File Manager''s DVD-Writer will also allow you to take those files you''ve
    ripped and then burn (record) them onto recordable or audio CDs that can be played
    on any standard audio CD player. This allows you to create compilations of your
    favorite songs and put them on your living room or car stereo without worry over
    or not those players are .mp3- or .ogg-compatible.


    # Using Xandros File Manager to Rip and Encode Audio Files


    You will find that ripping the tracks from a CD and encoding them in the Ogg or
    MP3 file format is quite simple. Since XFM will first search the CDDB online database
    for album, artist, and song title information for the'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'CD you are ripping, it is best to be connected to the Internet when doing so
    if you want that information encoded in the final MP3 or OGG files. Other than
    that, all you have to do is follow these steps:


    +   1. Insert an audio CD in your disk drive. Kscd will appear and begin playing
    the songs on it.


    +   2. Because you have inserted the CD for the purpose of ripping it, not listing
    it, quit Kscd and its Panel applet.


    +   3. Next, open a Xandros File Manager window and click the CD-RW and DVD-ROM
    icon in the file tree in the left pane of the window. The contents of the CD will
    appear in the right pane of the window (Figure 14-1), though this might take a
    bit more time than it does for data CDs. Just be patient and stay at the little
    paper airplane that will float back and forth in the right pane as Xandros File
    Manager handles the disc.


    ![](img/855e727a697c289d306bb0e488065e20_273_0.png)


    Figure 14-1: The tracks of an audio CD displayed in a Xandros File manager


    Once the tracks on the CD appear, you are ready to roll. What you do at this point,
    depends on how many of the tracks you want to rip and encode.


    +   4. If you want to convert only a single track, drag that track to a folder
    of your choice in the file tree in the left pane—your My Music folder would be
    an appropriate location. If you want to convert more than one track, hold down
    the CTRL key, and select the target files by clicking each of them.


    +   5. Once youve finished selecting the files, release the CTRL key, click, but
    don''t release, any one of the files you''ve selected, and then drag them all
    in unison to the destination folder.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'When you have done this, Xandros File Manager will begin copying the files
    from the CD to your hard drive. Again, this will take longer than you may have
    gotten used when copying files from a data disc, but there are larger files, after
    all. Do not be too concerned about the progress window; it sometimes seems to
    give rather odd readings during this process. At some time during the process,
    another window will appear, asking how you''d like to save the files.


    As you can see in Figure 14-2, the choices listed are WAV, CDA, OGG, and MP3,
    although the MP3 option will not be selectable until you''ve installed MP3 encoding
    software in Project 14A. Unless you choose OGG or MP3, you would pretty much be
    defeating the purpose of ripping and encoding your audio tracks, so stick with
    one of those compressed formats. If you also want to use the files on your Windows
    side or on your Mac, it is probably best to go with MP3.


    ![](img/855e727a697c289d306bb0e488065e20_274_0.png)


    Figure 14-2: Telling Xandros File Manager what to do with your audio files


    +   2. Once you have made your selection, click OK. Xandros File Manager will
    then move on to the encoding process, and when it is done, the window will close
    automatically. The compressed files will now reside on your computer.


    # Get Started Organizing Your Now-Compressed Audio Files


    Once the rip-and-encode process is complete, you should organize your files so
    that in the future you''ll know what is what. The standard way of doing this is
    to create a new folder in your Music folder named after the artist who performed
    the tracks you just ripped. Inside that folder, create another folder with the
    title of the album from which you ripped the tracks. For example, if you ripped
    songs from Molly Bancroft''s Get Closer album, you would create a Bancroft folder
    and a Get Closer folder within that. Of course, in the future, if you were to
    rip and encode songs from a different album by the same artist, you would create
    a new folder for that album within the original folder you''ve already created
    for the artist and move all of the newly ripped files into it.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'If your encoded tracks are not named with the actual songs titles, because
    you weren''t connected to the Internet when you ripped the tracks or because the
    album you ripped wasn''t listed in the CDDB online database, it is probably also
    a good idea, though not a necessity, to go on and rename the them with their appropriate
    titles. For example, in the case of Molly Bancroft''s Mouth.Get Closer, the filename
    Track 6.mp3 was renamed Fumpy Little Mouth.mp3, and so on.


    In this case, if you would like artist and track names to appear when playing
    the files in an audio player, you will also need to input each track''s tag information.
    This is a bit tedious when dealing with many files in one go, but it is easy.
    You will learn how to do it in the XMMS section of this chapter.


    # Settings


    If you would like to adjust Xandros File Manager''s encoding settings for Ogg
    files, you can do so by going to the Launch menu and selecting Control Panel When
    the Control window opens, click the + symbol next to Sound & Multimedia, and then
    click Audio CDs. You can then get to encoding settings by clicking the Ogg Vorbis
    Encoder in the tab pane of that window (Figure 14-3).


    ![](img/855e727a697c289d306bb0e488065e20_275_0.png)


    > Figure 14-3: Changing the encoding settings for Xandros File Manager


    In this case you can select the bit rate, which allows you to control the sound
    quality of the final encoded file The rule to remember is that the higher the
    bit rate, the better the sound quality. If you are short on disk space, you should
    also be aware that higher bit rates take up more disk space, so you will need
    to define your priorities in terms of sound and space. The most common choices
    are 128 kbps, 160 kbps, and 192 kbps though the default, 128 kbps, should provide
    more acceptable sound quality if disk space is of great concern.'
