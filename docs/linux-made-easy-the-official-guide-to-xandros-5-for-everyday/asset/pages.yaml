  md: '# Printing to PDF


    A very handy feature in Xandros is the ability to print or save documents to PDF
    (Portable Document Format) is a file format developed by Adobe that allows you
    to create documents that cannot be altered by others and can be easily read regardless
    of what word processor program or operating system another person is using. All
    the recipient of a PDF file needs in order to view that document is a copy of
    Adobe Acrobat Reader or any other PDF reader. PDF files are also usually smaller
    and can be more easily and quickly sent as email attachments. A 5.5 MB OpenOffice.org
    document of mine shrunk down to 770 KB when I printed it to PDF. It''s also a
    great way to save web pages, as the whole page, graphics and all, becomes one
    single, easily transferable file. In all, in this ability to create PDF files
    is a very cool feature that you would have to pay a pretty penny for in the Windows.


    Printing a file to PDF is really simple. Just open the file you want to PDF-ize,
    and select Print in the File menu of the application for that document.


    In the Print dialog that then appears, click the drop-down button where your printer
    is listed and select Print to File (PDF), as shown in Figure 9-17. The default
    name of the file will be print.pdf, if you want to change that to something more
    meaningful, you can do so in the box next to the words Output file. Just change
    the text immediately before the .pdf extension, not the path before. For example,
    you might change /home/your_username/print.pdf to /home/your_username/saturnvuehp.pdf,
    and so.


    You can do the same with OpenOffice.org documents, though the process is slightly
    different; there, the Print to File (PDF) option becomes Export.


    ![](img/855e727a697c289d306bb0e488065e20_180_0.png)


    Figure 9-17: Printing a file to PDF'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'For an OpenOffice.org document, open the document you want to save as PDF,
    and then click the small button in the OpenOffice.org window that looks like a
    red and white Adobe Acrobat logo (see Figure 9-18 if you''re not sure what one
    looks like). After that, an Export window will appear in which you can name the
    file. Once you have done that, click Export.


    ![](img/855e727a697c289d306bb0e488065e20_181_0.png)


    Figure 9-18: Exporting an OpenOffice.org document as a PDF


    # Project 9B: Adding Another Printer (Even If You Don''t Have One)


    Because most computers have one parallel port (also called a printer port) and
    at two or more USB ports, there is no reason that you can''t have more than one
    printer attached to your machine. You might want to do this, if you have a black-and-white
    laser printer that you use for your more serious or official documents or an inkjet
    printer that you use for printing outputs and other fun stuff. Adding the extra
    printer would be no different from adding the first. Just go back to Project 9A
    and repeat the steps.


    After the second computer is set up, you can tell which computer to use when printing
    a given document by clicking the drop-down menu button that shows your default
    printer''s name, just as you did when printing to PDF. Then select the printer
    you want to use from the list, because both printers will show up.


    If you find that you would prefer using the new printer of the time, while using
    the original when needed, you can make the newbie default printer for your system.
    You can do this by opening the Xandros File Manager and clicking Printers in the
    left pane. In the right pane, right-click the printer you would like to set as
    the default printer for your system, and select Set as Default in the pop-menu.
    You will have to have the original printer as the default again, just repeat the
    process for that printer.


    # 9B-1: Adding Your Virtual Printers


    Now, you don''t actually have to have another printer in order to add another
    printer. This might sound a bit breezy on my part, but it is true. Let me explain
    why you might want to do this. The default setting for most printers is Normal
    mode, which is usually a medium resolution using both black-and-white and color
    cartridges. This is fine for most people most of the time, and thus is the reason
    it is called Normal. Well, if you''re what most likely like to print things out
    quickly in draft-quality black-and-white, and when you''re not doing that, you
    are printing high-resolution photos? Normal mode is useless to you in this case.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'The perfect solution for your state of affairs, in this imaginary world I am
    painting, is to add your printer two more times, with each printer set up to print
    at the resolutions you prefer. You would thus have three printers in the eyes
    of your system, but only one actually sitting on your desk. Pretty cool idea,
    if you ask me.


    How do you do this? Well, exactly as you did the first time around. Just go through
    the printer setup process as you did before, making all the same choices. The
    only difference is that time around, on the second page of the wizard. In the
    first time you did this, you just accepted the accepted hardware name of the printer,
    but this time you will have to give each of your two new virtual printers a new
    and meaningful name. (Be aware that printer names cannot have any space in Linux;
    if you just have to have space, use an underscore (_) instead.) For example, you
    might call your printer quick black-and-white draft-mode printer "Drafty," while
    you could call your photo-printing printer "HiRes." Also, you might skip printing
    a test copy in the last page of the wizard, because you won''t have things up
    exactly the way you want at that point. Anyway, once you have finished setting
    up your two virtual printers, you can go ahead and do the fine-tuning.


    # 9B-2: Fine-Tuning Your Virtual Printers


    Now that you have added your new trusty workhorses, Drafty and HiRes, it is time
    to set each of them out so that their output matches your names. When you do this,
    open the Control Center, and select Peripheral Devices Printers. When the Printers
    module appears in the right pane of the window, it should look something like
    in Figure 9-19.


    ![](img/855e727a697c289d306bb0e488065e20_182_0.png)


    156 Chapter 9'
  merge: -1
  pgno: 182
- img_proc: true
