- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_232_0.png)


    Figure 12-21: A third-party PDA spreadsheet application and solitaire game


    To install an application for use with a Palm OS-based device, you must first
    download it from the Internet to your computer. There are many sites with freeware,
    shareware, and for-sale applications for Palm OS-based devices, such as www.freepalm.com.
    Files from such sites are usually prepared as ZIP archives, once you download
    them, you must first unzip or extract, using one of the methods you learned in
    Chapter 5. After that, you can easily install the applications, or other files,
    on your PDA using the Palm Pilot Tool.


    To do this, follow these steps:


    +   1. Run the Palm Pilot Tool (**Launch > Applications > Utilities > Palm Pilot
    Tool**).

    n2. Click the list item in the left pane of the Palm Pilot Tool window, **File
    Installer**.

    3. Next, click the **Add File** button in the right pane of the window, and the
    Open window that appears, locate and select your file.

    4. Once you''ve done that, click the **Open** button, after which the Open window
    will close. The file you selected will appear in the right pane of the Palm Pilot
    Tool window (Figure 12-22). You can also add additional files before syncing with
    your PDA.


    Once all the files you want to install are visible in the Palm Pilot Tool window,
    you can install them by performing a HotSync with your PDA, as you learned to
    do earlier in the Chapter. When the process is complete, the files will no longer
    be visible in the Palm Pilot Tool window.


    You should note that applications for Palm OS-based devices end with .prc extension,
    while the database files required by some applications end in .pdb, which is the
    same extension used for text documents prepared in the PalmDOC format. Before
    installing, it is always a good idea to check the contents of the ZIP file for
    the application you are planning to install see if there is a README file included.
    The README file should tell you what files to install on your PDA in order to
    ensure that the application runs as it should.'
  merge: -1
