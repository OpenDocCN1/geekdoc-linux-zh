  md: '# Figure 19: launcher commands in the New TuxBar theme file


    These lines basically tell TuxBar what applications launch when a certain region
    within the bar is clicked. The changes you make will all are to the word that
    is surrounded by quotation marks at the very end of each line; these are the application
    commands. Just follow these steps:


    +   1. In the top line, replace konsole (the command console) with owriter (OpenOffice.Writer).

    2. If you are using Mozilla instead of Firefox as your web browser, replace firefox
    in the second line with mozilla; otherwise, leave this line as is.

    3. In the third line, change sylphed to thunderbird, or if you''re a Standard
    or Deluxe user, replace mozilla -mail (the second option for Standard and Deluxe
    Edition users who don''t plan on installing Thunderbird).

    4. In the fourth line, replace conqueror with XandrosFileManager$HOME.

    5. In five line, change ajunta to kopete.


    > Leave the command in the sixth line, as is, because you will be installing and
    using this application later on the book.


    +   6. In the next line, replace kontrol with XandrosNetworks.

    7. Finally, change kfind in the last line to xmms.


    Once you have made changes, things should look like the lines in Figure 20. If
    you do, save the file (File Save), and then quit Editor. If you don''t, go back
    and make the necessary changes before saving the file.


    ```

    <GROUP>

    CLICKA X=0 Y=0 W=50 H=90 SENSOR-PROGRAM ONCLICK="konsole"

    CLICKA X=110 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="firefox"

    CLICKA X=174 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="sylphed"

    CLICKA X=240 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="XandrosFileManager $HOME"

    CLICKA X=304 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="thunderbird"

    CLICKA X=368 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="gimp"

    CLICKA X=438 Y=38 W=50 H=90 SENSOR-PROGRAM ONCLICK="ajunta"

