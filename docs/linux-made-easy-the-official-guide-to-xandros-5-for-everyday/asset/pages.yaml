    Be aware that the disc you''ve created is not a standard commercial album, it
    won''t be listed in the freedb.org database. Kscd therefore cannot gather and
    track information for your disc - a small price to pay, as they say.


    # Project 14A: Adding MP3 Encoding Support to Xandros


    As you have learned, you can rip audio files from CD and encode them in Ogg Vorbis
    format using either the Xandros File Manager DVD-Writer or other applications
    that I will discuss shortly. You already know Xandros does not come with MP3 encoding
    support; however, as a personal user, you can install yourself in the form of
    an application called LAME. Of course, LAME is not included in the Xandros distribution
    itself due to licensing over MP3, it is only logical that it is not available
    via the Xandros Networks repositories. You will have to download LAME from outside
    sources and install it via the Xandros Networks application. Here are the very
    simple steps:


    +   1. Open your web browser, and go to http://users.rise.anu.edu/~konrad/lame.


    +   2. When that page appears, look for and download the file LAME-3_91-j2386.deb.
    Don''t use the newer 3.92 version, as it might not work with your system. There
    may be still newer versions available by the time you read this, but the file
    I''ve listed here; I can''t guarantee any others.


    +   3. Once the download is complete, run Xandros Networks, and in the File menu
    select Install Deb File.


    +   4. In the Browse for Package window that appears, locate the LAME file you''ve
    just downloaded, select it (by clicking on once), and then click the Open button.


    +   5. Click the Install button in that window.


    +   6. You will be prompted for your root password, so type it, and then click
    OK. Xandros Networks will then install the file showing its progress in a separate
    window.'
