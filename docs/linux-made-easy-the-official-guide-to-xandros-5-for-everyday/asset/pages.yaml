  md: '# Project 18A: Getting a Little Adventurous with Njam


    Now that you''ve gotten a taste of the games that come bundled with your system,
    and some of those available via Xandros Networks, it''s time to move on and have
    a bit of adventure. There are other games available on the Internet that are not
    specifically designed for use with Xandros—or even available via Xandros Networks—but
    will still run on your system. These are not guaranteed or supported by Xandros,
    so if anything goes wrong, you are on your own. That said, you might feel a bit
    easier knowing that the game that I am covering in this project is not actually
    installed per se, so there is no chance of conflict or breaking your system. I
    can vouch for myself, as I have used this game on my system without any problems
    arising, so you should be fine.

    The game you will be installing is called Njam (Figure 18-13).


    ![](img/855e727a697c289d306bb0e488065e20_393_0.png)


    Figure 18-13: A new take on an old theme: Njam


    Njam is basically a clone of Pac-Man, that most popular of computer and arcade
    games in days of yore. Of course, with its 3-D graphics, cooler music, and new
    twists and turns, Njam is in many ways more to play, or at least different enough
    to make it a bit fresh to any player who spent his or fair share of quarters playing
    the original old'' days of dark and noisy video arcades.


    By the way, if you are wondering what Njam means, it is Serbian for yummy, which
    seems quite appropriate given that the whole concept of the game is to eat as
    much as you can. I suppose you think of it as a non caloric, no-carb way to pig
    out. Atkins Diet followers take note.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# 18A-1: Downloading and Extracting Njam


    To get Njam, follow these steps:


    +   1. Go to http://njam.sourceforge.net, and click the Linux binary link.

    2. On the next page that appears, click any one of the files in the Download column.
    Selecting the file from the location geographically closest to you will probably
    provide you with the fastest download time, though it doesn''t always work out
    that way.

    3. Once you have chosen a site to download Njam, another page will appear, but
    you won''t need to click anything there; the download should automatically begin.
    When you will know it is, because your web browser will pop up a window asking
    you what to do with the file.

    4. In that window, select Save to Disk, and then click OK. When the download is
    complete, you must extract the tarball, as you learned to in Chapter 5. Once you
    have done that, you will have a new folder with a name like Njam-1.21-i386 (the
    version number on yours might be higher if the application has been updated in
    the time after this book was released).

    5. Right-click that folder, and select Rename in the pop-up menu. Then go ahead
    and change the name to njam. This will make it easier to handle in the future.


    # 18A-2: Installing Njam’s Dependencies


    Now you are ready to play Njam . . . just about. As stated on the Njam site, Njam
    has certain dependencies that must be met in order for it to run.


    These consist of libsdl-image, libsdl-mixer, and libsdl-net. As you already know,
    when you install an application via Xandros Networks, any dependencies that application
    requires are automatically downloaded and installed at the same time. This time,
    however, since you downloaded Njam without using Xandros Networks, you will have
    to find and install its dependencies.


    Luckily for you, all of these are available via Xandros Networks, as they are
    required by many other applications. If you''ve already installed Frozen-Bubble,
    libsdl-mixer and libsdl-image will have been installed on your system, making
    that the only file you need to install is libsdl-net.


    To install the files upon which Njam depends, run the Xandros Networks application,
    and then type sdl (that''s a lowercase l, not the number 1) in the text box to
    the Search button. Then click the Search button, and a list of files containing
    sdl will appear in the bottom half of the right pane of the X window (Figure 18-14).


    In that list, locate the three files I just mentioned, and install each of them
    using the method you learned in Chapter 8. If the file has the word Remove next
    to it, then you know that the file is already installed.'
  merge: -1
  pgno: 394
