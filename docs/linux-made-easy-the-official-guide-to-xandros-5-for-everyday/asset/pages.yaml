    # Playing Around with Effects in Paint


    Paint allows you to modify your images in still other ways via its Image Effects
    window **(Image) ► More Effects**. When that window first opens, you will see
    the aerial brightness and contrast settings controls, which are very useful for
    that purpose. However, there is a bit more lurking behind your window''s skin
    ... actually within its Effect menu, to be exact. By clicking the drop-down menu
    button next to the word *Effect*, you can see still other options available to
    you.


    These effects include Emboss, an example of which is shown in Figure 16-10; Flatten
    allows you to reduce the image to two colors of your choosing for very psychedelic
    results; *Invert*, *Reduce Colors*, which allows you to lower the number of colors
    in the image or change it to grayscale; and *Soften and Sharpen*, which allows
    you to do exactly what its names imply.


    You might not be familiar with many of these functions, so go ahead and play around
    with them. Just remember that, regardless of what you do while experimenting with
    these various effects, no permanent damage will be done to your image unless you
    select **Save** from the **File** menu. That said,'
  merge: -1
  pgno: 322
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_323_0.png)


    Figure 16-10: Embosing an image via Paint''s More Image Effects window


    # # Project 16A: Getting Arty with the GIMP


    Well, if Paint isn''t enough to satisfy your budding artistic urges, and you are
    aching for a bit more excitement, then it''s time to go for the GIMP (Figure 16-11).


    The GIMP, often compared very favorably to Adobe''s Photoshop (albeit without
    that application''s exorbitant cost), is a graphics application that allows you
    to create original images and, more important, retouch or completely doctor image
    files, such as those from your digital camera. Want to put some color in yours,
    you say? Or how getting rid of red-eye that makes you look like one of the ghoulish
    characters out of an episode of *Buffy the Vampire Slayer* The GIMP lets you not
    only do these things but others, such as airbrush out unwanted shadows (or even
    facial blemishes), give your image a canvas texture, change a photo into an oil
    painting, or even add a pepper or a pointing hand here and there.


    Just in case you''re wondering, GIMP stands for *GNU Image Manipulation Program*
    (and GNU), the organization that promotes the development of Linux and related
    free software, is a recursive acronym for *GNU''s Not Unix*.


    Doing the Left Bank 297'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 16A-1: Downloading and Installing the GIMP


    Although the GIMP does not come bundled with Xandros system, it is available via
    Xandros Networks. To get it, run Xandros Networks, type gimp in the search box
    near the top of the window, and then click the Search button. When the results
    of your search appear in the pane, click Install next to GIMP Image Editor (it
    should be the only entry in the list), and then follow the usual drill for installing
    files via Xandros Networks.


    ![](img/855e727a697c289d306bb0e488065e20_324_0.png)


    Figure 16-11: The Gimp


    # 16A-2: Running the GIMP


    Once you have downloaded and installed the GIMP, you can run it by going to the
    Launch menu and selecting Applications ► Graphics ► GIMP Editor. The very first
    time you do this, you will be presented with the GIMP User Installation Wizard
    (Figure 16-12), but working through it is strictly a no-brainer, as all you have
    to do is Continue in each screen of the window until it is finished.


    # 16A-3: Familiarizing Yourself with the GIMP''s Interface


    As you saw in Figure 16-11, the GIMP is a multi-window application. It first opens
    as a set of two راحت palette-like windows and then adds others as you open images
    or other tools. While this approach works out well, it can be somewhat disconcerting
    at first. Basically, the left window is the main GIMP window, which is divided
    into two sections, shown separately in Figure 16-13.'
  merge: -1
  pgno: 324
