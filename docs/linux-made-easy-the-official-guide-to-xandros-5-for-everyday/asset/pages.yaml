  md: '# More Panel Fun


    In addition to the basic customization you''ve just done in the previous project,
    you can do a lot to change the Panel''s behavior. Most of these options are available
    by right-clicking any open space in the Panel and selecting **Configure Panel**,
    to bring up the Control Center Settings window (see Figure 3-11).


    ![](img/855e727a697c289d306bb0e488065e20_65_0.png)


    **Figure 3-11:** Changing Panel properties in the Control Center Settings window


    From this window, you can change the position of the Panel, alter its size, change
    its color, or make (but not the launchers on) invisible, though this won''t look
    particularly attractive. You can also set the Panel so that it will automatically
    disappear when you are not using it and reappear when you bring your mouse cursor
    into the area where the Panel normally resides. If you like the zooming in Mac
    OS X''s Dock, don''t feel left out; you can even get the icons in your Panel to
    do the same. (In fact, if you really want to get them carried away Mac-ifying
    your desktop, you''ll find out how to do it in Chapter 8.) Anyway, don''t be afraid
    to play around and give things a try—that''s half the fun!


    # The Launch Menu


    At the far corner of your screen is the Launch button. You can access about everything
    there is to access in your system from here. In a sense, the Launch menu is very
    much like the Start menu in a Windows system. When'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'you click the Main menu icon, all of the applications and utilities available
    to you are exposed (Figure 3-12).


    ![](img/855e727a697c289d306bb0e488065e20_66_0.png)


    Figure 3-12: The Launch menu


    As you can see, the menu is broken up into three sections, each of which is clearly
    labeled. The uppermost of these sections, Most Used Applications, is dynamic in
    its contents change to what you use most often. Because you will not have used
    applications other than the First Wizard when you first open the Launch menu,
    that should be the only application listed there at that time. The items in the
    other two sections (All Applications and Actions) are primarily static, which
    means the items listed there will remain the same unless you install a new application,
    in which case a launcher for that application is added to the menu.


    You will find, that some applications do not automatically add a launcher to the
    menu once installed. In such cases, you can run the launcher-less applications
    by selecting the Command item in the menu and by typing in the command for that
    application (as discussed in Chapter 8). Alternatively, you can use the Menu Editor
    application (discussed in Chapter 18) to add a launcher to the menu which is manually,
    is useful if the application is one you use frequently. You can also use the Menu
    Editor to customize the menu to your liking.


    What each item listed in the All Applications and Actions sections does either
    be self-evident (such as Help, Find, and Recent Documents) or will be discussed
    elsewhere in the book. Being that the case, I will not delve any further into
    these things at point.


    # Virtual Desktops


    All of the major components of the desktop have been covered, and it is now to
    discuss a rather unique and convenient feature in Linux: virtual desktops. And
    this the best way to understand what this virtual-desktop business is all about
    is to give it a try.


    In your KDE Panel, click the Weather applet, the Calculator launcher, and the
    Xandros File Manager launcher. You will then have three windows open in your present
    desktop, or workspace. Now look at the Virtual Desktops applet'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'on your Panel. The left half of the icon should be blue; this is your present
    workspace. Click the right half of the icon, the green half, and all your open
    windows suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your other windows are still open and running in the previous desktop. In this
    second desktop, you can open something else: go to the Launch menu and select
    Applications ► Cards ► Solitaire. The Solitaire card will soon appear.


    You now have windows in two different desktops, and you can switch back and forth
    between them. To do so, just go to the Virtual Desktop Applet in your Panel and
    click the left box, which will take you to your original desktop. Once you''ve
    done that, you can click the right box to go back to your game desktop.


    As you imagine, this feature has potential benefits for you, in addition to helping
    you avoid clutter. Imagine that you are at working up some long document in OpenOffice
    Writer. You get a bit tired and decide to go off a bit by playing Tetris for a
    while. To do this, switch to another desktop where you open and play the game.
    A later, when you notice your boss making the rounds of the office, you simply
    switch back to the first desktop so that you look busy when he walks by and says,
    “Keeping yourself busy, Boys?”


    # Shutting Down


    Well, now you know your desktop environment so well, you may feel like calling
    it a day and shutting down your machine. To do so, just go to the Launch menu
    and select Logout. A small window will appear with three buttons to choose from:
    Logout (default), Shutdown, and Restart. Click Shutdown, and the shutdown process
    will begin.


    When it is all done, the system will you-screen that it is safe to turn off your
    computer. Usually, the system will turn the computer off automatically after a
    few seconds. On few machines, the system cannot power down your machine. You will
    know if this is so in your case because the message telling you that it is safe
    to turn off your computer will just sit there.. . . forever. If you see those
    words on the screen and nothing else happening for 15 seconds or so, then just
    power down the machine manually by pressing the Power button. It is completely
    safe to do so at point.


    # Getting Out of a Jam


    At this point, you''re pretty much introduced to your desktop. Now is probably
    a good time to arm you with some information that will help you get out of any
    jams you might get into as you progress through the rest of the book and get further
    into working with your Xandros. You probably'
