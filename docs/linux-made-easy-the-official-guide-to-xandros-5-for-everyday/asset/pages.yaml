    # 14B-3: Installing Your New Skins


    Once you have downloaded some new skins, you will have to make them available
    to XMMS by putting them in the right place on your system. You won''t unzip them,
    though; you can use them as is, which saves you some minor grief. At this stage
    of the game, it is most easily done by putting them in the .skins folder under
    your Home folder.


