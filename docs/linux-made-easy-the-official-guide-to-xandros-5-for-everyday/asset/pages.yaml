  md: '# # Firefox Popup Manager


    Firefox also has a handy feature called the **Popup Manager**, which blocks those
    appearing pop-up windows that appear when visiting sites. When you come to a web
    page that shoots out one of those windows, Firefox will display a banner across
    the top of the page, telling you that it has a pop-up window from opening (Figure
    13-7).


    ![](img/855e727a697c289d306bb0e488065e20_242_0.png)


    Figure 13-7: Firefox lets you know when it has blocked a pop-up window


    It will also display a small icon with an X in the bottom-right corner of the
    window (also shown in Figure 13-7). If you click either of these, a pop-up menu
    will appear, from which you can tell Firefox to allow pop-ups from that site or
    to let you view the particular pop-up window in question. Of course, if you are
    happy with the ways they are and want to leave the pop-up blocked, you can simply
    proceed as normal. You can close the top message (*Firefox prevented this site...*)
    by clicking the red square with a white X in it. Needless to say, this is an extremely
    useful, effective, and welcome feature.


    # ## LiveBookmarks in Firefox


    Another cool feature in Firefox is **Live Bookmarks**. Live Bookmarks are essentially
    bookmarked collections of frequently updated items, such as for news headlines
    or blogs (*Latest Headlines*), configured for BBC news, in its Bookmarks Toolbar,
    which is the bottom-most toolbar of the three located at the top of the window.
    Every time you click bookmark button, a list of the most recent news headlines
    from BBC will appear in a drop-down menu, and clicking one of the links in that
    menu will bring you to the page for that particular story (Figure 13-8).'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Adding Your Own Live Bookmarks


    You can, of course, add your own Live Bookmarks to Firefox for your favorite feeds
    or logs. Most of the URLs for updated feeds usually contain rss somewhere in the
    address and in .xml or .rdf, though you might not always be able to see this ending.
    For example, the URL for Yahoo News is http://news.yahoo.com/rss/topstories, the
    URL for a Live Bookmark is http://news.yahoo.com/rss/topstories. To provide another
    example, view Television Without Pity (a site that keeps you up-to-date with your
    favorite TV shows) in your web browser, you would type www.televisionwithoutpity.com,
    while you would use www.televisionwithoutpity.com/rss.xml in order to set up a
    Live Bookmark for the site.


    If you paste either the Live Bookmark into your web browser, you will get a page
    of code that will most likely be of little meaning to you. These URLs are instead
    used when setting up LiveBookmarks and are not intended for typical browsing.


    If you want to add a Live Bookmark for one of these feeds, here''s what you should
    do, and I''ll use Yahoo News as my example:


    +   - Go to the Bookmarks menu, and select Manage Bookmarks.


    ![](img/855e727a697c289d306bb0e488065e20_243_0.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: '2. In the Bookmarks Manager window that appears, go to the File menu and select
    New Live Bookmark.


    3. When the Properties window for the new Live Bookmark appears, type Yahoo! News
    in the Name box and http://rss.news.yahoo.com/rss/topstories in the Feed Location
    box. Your Properties window should look much like that in Figure 13-9. If so,
    click OK.


    ![](img/855e727a697c289d306bb0e488065e20_244_0.png)


    Figure 13-9: Setting up a Live Bookmark of your own


    # Finding Feeds for Live Bookmarks


    Well this is very cool, but you are probably wondering where you can find feeds
    that match your personal interests. A good place to start is a site Feededer.
    By going to Feedester''s Feedfinder page (http://feedfinder.feedester.com), you
    can type a keyword for the area you are interested in, and you will be presented
    with a list of results showing all of the available feeds that are relevant to
    your topic area.


    To show you what to do then, let''s use Chinese pop star Faye Wong as an example.
    If you want to search for someone or something else, feel free to make appropriate
    substitutions if you are going to follow along. Anyway, here''s what to do:


    +   1. Go to http://feedfinder.com.


    +   2. Type Faye Wong in the Feedfinder search box, and then click the Find Feeds
    button.


    +   3. In the page of results appears, click one of the links that sounds the
    most appropriate to you. When that page appears, there will be a small orange
    icon in the bottom-right corner of the window (Figure 13-10). The icon''s appearance
    will vary according to the theme you are using.


    ![](img/855e727a697c289d306bb0e488065e20_244_1.png)


    Figure 13-10: Firefox lets you know when you can create a Live Bookmark for a
    site'
  merge: -1
  pgno: 244
- img_proc: true
  md: '4. If the page seems to be what you are looking for, click that orange icon,
    and select Subscribe to... in the pop-up menu.


    5. In the Add Bookmark window, select the location where you would like the bookmark
    to appear. If you want it to appear in the Bookmarks window, accept the default
    location (Bookmarks), but if you want it to appear in the Bookmarks Toolbar, change
