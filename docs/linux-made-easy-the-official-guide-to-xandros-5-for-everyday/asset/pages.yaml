    ![](img/855e727a697c289d306bb0e488065e20_332_0.png)


    Figure 16-23: The New Layer button


    Before moving on, it is probably a good idea at this point to explain how layers
    work. In the case of our wallpaper project, the easiest way to envision this is
    to think of your background image as a painting on paper. On top of that, you
    are adding layers of plastic (the layers) upon which you will draw other elements.
    If you don''t like what you''ve added on one sheet, you can simply throw the sheet
    into the trash, and your other sheets will remain as they were, untouched and
    intact. You can, of course, add more sheets to add each other items. Every step
    is thus protected from any slip-ups you might make in the next step. All very
    useful and convenient.


    If this explanation comes as somewhat obtuse, perhaps it will help you put it
    into the context of what we are going to do in this project.


    If you take a look at Figure 16-24, you will see that you will be adding two layers
    for each-image you add to your background image, one for the paste-image itself
    and for its shadow. That means that you will actually be adding eight different
    layers (assuming you are adding four paste-images) in total. Well, all that said,
    let''s get back to work.


    +   3. Now that you have added an empty layer to your background image, click
    that image, and then select Paste in the Edit menu (remember, we copied the image
    just before step 1). Your first paste-image will then appear within the background
