  md: 'times as you like, to browse through the skins available. Once you have found
    a skin that you like, use the down cursor key to select Back, and then press ENTER.
    That''s all there is to it.


    ![](img/855e727a697c289d306bb0e488065e20_400_0.png)


    Figure 18-20: Njam skins


    # Finding Out More About Njam


    If you would like to learn a bit more from the Njam project page (http://njam.sourceforge.net/doc.html).
    In addition to the basic overview of the rules that I have provided, you will
    learn a bit more about the characteristics of the various elements within the
    game and how to use the level editor to create your own new playing levels.


    # Project 18B: A Final Bit of Fun with Fish Fillets—the Next Generation


    Fish Fillets—the Next Generation, or Fish NG to keep it simple, (Figure 18-21)
    a wonderful port of the Windows puzzle game Fish Fillets.


    ![](img/855e727a697c289d306bb0e488065e20_400_1.png)


    Figure 18-21: Fish Fillets—the Next Generation


    Basically, the whole point of the game is to give two hypersensitive, and sometimes
    witty, fish through a rather intriguing underwater labyrinth without getting the
    fish pulverized by the various obstacles that might inadvertently cause them crashing
    down on their sweet little heads. Fillets NG is very easy'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'on the eyes with its attractive graphics (boy, those jars of marmalade look
    tasty!), and with its great background music, it is equally kind on your ears.


    # Downloading, Installing, and Running Fillets NG


    Fish Fillets—the Next Generation can be easily downloaded and installed via Xandros
    Networks. Be warned, however, that it is a very heavy download (over 60 MB), so
    if you are using a dial-up connection to the Internet, you might want to hold
    off on getting it until the middle of the night while you are asleep the download
    will take hours. To get it, run Xandros Networks, but first make sure the Debian
    Unsupported repository is enabled. Then type fillets in the text box at the top
    of the window. Click Search, and then, the list of results appears in the pane
    below, Click Install next to fillets-ng.


    Again, just as was the case with Njam, you will have to run Fillets NG via the
    Run Command. To do that, go to the Launch menu and select Run Command. In the
    Run Command window, select fillets and click Run.


    # Creating a Menu Launcher for Fillets NG


    Since typing a command to run Fillets NG can get to a bit of nuisance if you end
    up playing the game often, you would not want to create a menu launcher for it
    you did for Njam. Fortunately, the process is essentially identical. Quit Fillets
    NG by clicking Exit in the game window, and then follow the same procedure you
    did for Njam. This time, however, make the new entry Fillets NG, and then type
    the following additional information:


    > Comment: An underwater puzzle maze

    Command: fillets


    For the icon, choose bluefish (which looks something like the blue fish in Fillets),
    and then go to the File menu, select Save, and then quit the Menu Editor. After
    that, you can easily run Fillets NG by going to the Launch menu and selecting
    Applications ► Games ► Arcade ► Fillets NG.


    # Running Fillets


    The first thing you should see upon running Fillets NG is the menu screen, from
    which you can choose among the Credits, the (as of this writing) still-under-construction
    Intro, the various game Options, and the level you want to start wandering through.


    The level selections are made by clicking on the shiny balls in the path at the
    middle of the screen (Figure 18-22), though you will be able to select only the
    first level the first time, and after then you will be able to choose from among
    those levels you have already completed. In other words, you cannot just bypass
    levels and jump ahead. To return to the menu screen, just press the ESC key at
    any time.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_402_0.png)


    Your job when playing Fillets is to get the two fish safely through each room
    of the labyrinth in order to move on to the next room. There are more than 70
    rooms in all. The movement of the fish is handled by the keyboard via the cursor
    keys. You can switch between fish by pressing the spacebar. You can also control
    the fish using your mouse. To move a fish, click it with your left mouse button
    and drag it. To have the fish push objects, click the fish with the right mouse
    button and drag it. You can return to the opening screen at any time by pressing
    ESC.


    Moving through each room is not as simple a task as it might seem because there
    are a variety of impediments to make things more challenging, a number of which
    you can see in the second room shown in Figure 18-23. The most important of these
    is the fragility of the fish themselves, which whatever drops directly on them
    or on anything they are supporting on their backs. Push a punny snail off a cup
    and onto a saucer on the big fish''s back, and sayonara big fish. The likelihood
    of such cascades of pesticide is increased by the fact that there are a number
    of potentially unstable obstacles that the fish have to move from place to place
    within a given room. In some levels, there might also be other living creatures
    that appear, but they do not have anything to do with solving the puzzle and are
    essentially nontoxic to the fish. They are only there, as the author of the game
    puts it, "make the game more lively."


    As far as moving objects is concerned, neither fish has a problem with lifting.
    Lowering such objects is another matter entirely, as trying to do so will turn
    either fish involved with the task into picking from an alley cat''s trash can.
    Pushing objects is less of a problem, only the big fish can bud the heavier or
    larger items. The small fish does more of a finesse job, pushing the smaller objects
    around (cups, snails, shells, and the like) in order to clear the way for the
    bigger fish to push his or her (I''m not sure which) muscle to work. Of course,
    pushing some objects can cause others to fall, so be careful.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_403_0.png)


    Figure 18-23: Even more impediments await in the second and subsequent rooms of
    Fillets NG


    It is also important to remember that the fish can push only objects that are
    supported, or will be supported, by other objects, or the other fish, upon completion
    of the push. This does not include pushing an object directly onto another fish,
    since this is is not possible. It is possible, to push an object onto another
    object that is already supported by the other fish. Support of most objects can
    also be transferred from one fish to the other fish from beneath that object.
    Figure 18-24, taken from the Fillets help files, shows some of the various moves
    that the fish can and cannot perform.


    ![](img/855e727a697c289d306bb0e488065e20_403_1.png)


    Figure 18-24: Some permitted and prohibited moves in Fillets NG'
  merge: -1
