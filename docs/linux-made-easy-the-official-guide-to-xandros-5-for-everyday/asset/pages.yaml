    # Converting Color Images to Grayscale in Paint


    Paint also allows you to easily convert color images into black-and-white grayscale
    images, you should want to do so for whatever reason. To make the transformation,
    just go to the Image menu and select Reduce to Grayscale. You can then go to the
    File menu and select Save As to save the newly transformed image with a new name.


    # Rotating Images in Paint


    Paint also allows you to rotate or skew pictures that are incorrectly oriented.
    To rotate an image, just go to the Image menu and select Rotate.


    When the Rotate window appears (Figure 6-6), select Counter-clockwise or Clockwise
    (depending on the direction in which you want to rotate the image), and then select
    the number of degrees you want to rotate the image. Once finished, click OK.


    ![](img/855e727a697c289d306bb0e488065e20_320_0.png)


    Figure 6-6: Rotating an image in Paint


    # Skewing Images in Paint


    Sometimes the angles of objects in your pictures may be so off as to be almost
    annoying. If you look at the image in the left of Figure 6-7, you can see that
    the lighthouse tower is severely skewed.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_321_0.png)


    **Figure 16-7:** Michigan''s Tawas Lighthouse in need of some corrective skewing


    If you like, you can correct this in Paint, though the building to the tower will
    then look a bit off as a result. It all depends on what matters most to you.


    Anyway, to skew an image in Paint, first open the image, and then select **Skew**
