  md: '# More on Security


    Since I''ve just discussed protecting yourself from email-borne viruses in the
    previous section, it is worth mentioning at this point that there are some other
    security features available in various editions of Xandros to help you from other
    network/Internet-related dangers. In addition to the ability to encrypt Home folders,
    which I mentioned in Chapter 7, the Xandros Surfside Linux and Business Editions
    have built-in antivirus software (though viruses are not just a problem in Linux
    world), while the Deluxe, Surfside Linux, and Business Editions have a firewall
    configuration wizard (Launch ► Applications ► Internet ► Firewall Wizard), which
    helps you set up a personal firewall to ward off online intruders. This is especially
    useful for those with an always-on network or Internet connection.


    # Project 13B: Instant Messaging (Kopete)


    If you are of instant messaging, you''ll be glad to know that Xandros is ready
    to serve your needs with its Instant Messaging, also known as Kopete. It doesn''t
    matter whether you usually use MSN/Windows Instant Messenger, Yahoo Messenger,
    AOL Instant Messenger (AIM), or ICQ; Kopete can handle them. In fact, it can handle
    all of them at the same time, a really big plus.


    Now some of you might not know what instant messaging is, so I''ll fill you in
    before going on. Basically, instant messaging is a service provided by a number
    of companies (such as I''ve just mentioned) that allows you to communicate with
    your friends or acquaintances online via text messages. Once you create an account,
    you add contacts of people you know who also have accounts of their own. Then,
    you''re ready to go. When any of your contacts are online, Kopete will alert you,
    while their instant messaging software will also let your contacts know you are
    online. Now you can call one another via real-time messages. The typed conversation
    that and your contacts have is displayed in a separate window.


    As you can see in Figure 13-26, the conversation looks like a script. In short,
    it''s sort like talking on the phone, but instead of talking you''re typing. All
    very fun and handy.


    # 13B-1: Setting Up Kopete


    You can run Kopete by going to the Launch menu and selecting Applications ► Instant
    Messaging. The first time out, bring up its Configure window, in which you can
    set up an account for each of the services with you are registered. If you aren''t
    already registered with a messaging service, you will also be able to create one.
    Get started by clicking the New button, and Kopete''s Add Account Wizard will
    appear (Figure 13-27).'
  merge: -1
  pgno: 259
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_260_0.png)


    Figure 13-26: Kopete displays a running transcript of your real-time text conversation


