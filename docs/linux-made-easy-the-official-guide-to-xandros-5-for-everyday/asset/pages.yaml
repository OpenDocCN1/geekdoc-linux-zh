    # Internet Telephony with Skype


    If your significant other is living in Madrid, and there are in Grand Rapids spending
    so much money on international phone bills that you can''t afford to hop on a
    flight and the ol'' face-to-face, eh? Well, you might just be the perfect candidate
    for a new application called *Skype*, shown in Figure 13-34.


    # What Is Skype?


    Skype is an application that allows you to talk to your friends, family, and whoever
    you want via the Internet, just as if you were using a telephone. Of course, in
    order to use Skype, the party you want to speak with must also be using Skype
    and online, which may seem like a big drawback. However, when you give Skype a
    try and hear how good it sounds, get a feel for how well it works, and realize
    how little it costs (it costs nothing), you won''t be worrying about such minor
    matters any longer.'
