  md: '# More No-Nonsense Books from


    # NO STARCH PRESS


    ![](img/855e727a697c289d306bb0e488065e20_492_0.png)


    # STEAL THIS COMPUTER BOOK 3


    What They Won''t Tell You About the Internet


    by WALLACE WANG


    An offset, non-technical book that explores what hackers do, how they it, and
    how readers can protect themselves. Thoroughly updated, this edition adds coverage
    of rootkits, spyware, web hubs, identity theft, hacktivism, wireless hacking (wardriving),
    biometrics, and firewalls.


    MAY 2003, 384 PP., $24.95 ($37.95 CAN)


    ISBN 1-59327-000-3


    ![](img/855e727a697c289d306bb0e488065e20_492_1.png)


    # STEAL THIS FILE SHARING BOOK


    What They Won''t Tell You About File Sharing


    by WALLACE WANG


    Steal This File Sharing Book peels back the mystery file sharing networks such
    as Kazaza, Morpheus, and Usenet, showing how they work and how to use them wisely,
    and revealing potential dangers lurking on file sharing networks, including viruses,
    spyware, and lawsuits, and how to avoid them. Includes coverage of the ongoing
    battle between software, video, and music pirates and the industries trying to
    stop them.


    NOVEMBER 2004, 296 PP., $19.95 ($27.95 CAN)


    ISBN 1-59327-050-X


    ![](img/855e727a697c289d306bb0e488065e20_492_2.png)


    # HOW LINUX WORKS


    What Every Superuser Should Know


    by BRIAN WARD


    Shows the Linux system functions so that system administrators can devise their
    own solutions to problems. Readers will find coverage of devices, disks, filesystems,
    and the kernel; how Linux boots; essential system files, servers, and utilities;
    network configuration and services; shell scripts; development tools; compiling
    software from source code; maintaining the kernel; configuring and manipulating
    peripherals; printing; backups; sharing files with Samba; network file transfer;
    buying hardware for Linux; and user environments.


    MAY 2004, 368 PP., $37.95 ($55.95 CAN)


    ISBN 1-59327-035-6'
