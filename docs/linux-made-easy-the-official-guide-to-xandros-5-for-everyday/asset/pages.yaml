    # Phase Five: Configuring New TuxBar


    Well, some of you may be using a screen size and resolution different from what
    New TuxBar is set up for. As a result, you will be able to see only the top half
    of New TuxBar when it appears. If so, you will have to configure the theme. Configuring
    SuperKaramba themes is a bit different than what you might be used to, but it
    is relatively easy. All are nothing more than text files.


    To configure the New TuxBar theme so that you can see all of it (remember, you
    don''t have to do this if you can see it (all already)), just follow these steps:


    +   1. Right-click anywhere on what you can see of the New TuxBar. Then select
    Edit ► Theme in the pop-up menu. The Text Editor will then appear, opened to the
    TuxBar file.


    +   2. In the fifth line of file, change H=100 to H=150.


    +   3. Now save the file (File Save), but leave Text Editor open for now because
    you will be using it in a moment.


    +   4. Now, right-click on the New TuxBar again, but, this time select Reload
    theme in the pop-up menu. Within a second or two, you will be able to see all
    of New TuxBar.


    # Phase Six: A More Configuring


    Now that all the New TuxBar is visible, you can probably figure out that is is
    supposed to look and behave like the Dock in Mac OS X, assuming you know how the
    Dock in Mac OS X is supposed to work. If not, take my word for it. it''s not quite
    versatile as the Dock, which really acts as a set of application launchers. With
    New TuxBar, however, is that the programs it is configured to launch are not exactly
    what you as Xandros user are most likely to be dealing with. No problem, however,
    because you can set it up to whatever applications you want.


    To configure New TuxBar so that it will launch Xandros-relevant applications,
    you will have to go back to the still-open Text Editor window and make some more
    changes in the file that you edited a short while ago. The changes will be to
    all those listed together below the line <GROUP> X=0 Y=0, as you can see in Figure
    8-19.'
