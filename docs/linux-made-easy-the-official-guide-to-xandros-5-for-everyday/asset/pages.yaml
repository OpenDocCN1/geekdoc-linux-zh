  md: '# 15


    # COUCH POTATOES


    Xandros Does Video


    ![](img/855e727a697c289d306bb0e488065e20_301_0.png)


    Now that we''ve covered much of what Xandros can do in terms of audio, let''s
    turn our attention to what is arguably the second most important of its talents
    in our CNN/MTV-era world: video. Xandros is quite capable in terms of video playback,
    allowing you to view video files you download from the Internet or from your digital
    movie camera or watch Internet video streams, video CDs (VCDs), and unencrypted
    DVDs. If you have a TV tuner card, it even lets you watch television right there
    on your computer screen.


    # Media Player (Noatun)


    The simplest of players in the Xandros video repertoire is Media Player (Figure
    15-1), also known as Noatun.


    Media Player doesn''t look like much at first glance, but it is a capable beastie
    that allows you to play video files in a number of formats, including MPG, AVI
    (such as those from your digital movie camera), and QuickTime *'
