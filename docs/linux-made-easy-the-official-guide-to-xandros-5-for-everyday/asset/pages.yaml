    # ## 20-2: Running Risk


    You can run Risk without any further work. To get going, open a new Console window
    and do the following:


    +   1. Move your Console into the Risk folder by typing **cd Risk** and pressing
    ENTER.

    2. Then type **java -jar Risk.jar** (be sure to place a space between java and
    -jar) and press ENTER. Risk will appear, and you can start playing.


    ![](img/855e727a697c289d306bb0e488065e20_445_0.png)


    Here''s what you just did in that last line: the first part of the command string,
    java, calls the Java Runtime Environment into action; the -jar flag after that
    tells Java that you are going to be running a jar file; and the last part is the
    actual file you are going to run, Risk.jar. In the future, if you choose to run
    other Java-based applications, just follow the same pattern:

    java -jar application_name.jar.'
