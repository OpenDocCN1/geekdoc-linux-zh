  md: 'If you check that box (by clicking in it), you can then browse for other applications
    to install. When you find another one, click the checkbox for that one, and repeat
    the process for each additional application you would like to install. Finally,
    when you have finished checking boxes, click the **Install Selected Applications**
    button (Figure 8-12) just below the **Settings** menu or select the same item
    from the **File** menu.


    ![](img/855e727a697c289d306bb0e488065e20_150_0.png)


