  md: '# An Untethered Connection—Wireless


    The great thing about laptop computers when they first came out was that they
    freed people from their desks. People could do whatever they needed or wanted
    to do on their computer wherever they wanted. As a cross-legged-on-the-floor kind
    of guy, it was really great for me, as I could plow my laptop right there on the
    floor in front of the TV, and then sit there and gaming while playing *Wall Street*
    for the unteenth time on my VCR. Yes, everything was great, but then came WiFi.
    Laptops suddenly became tethered to telephone lines and Ethernet cables.


    Fortunately, laptops have been unleashed as the computer world goes wireless.
    With the right wireless hardware, you can now use your computer anywhere you can
    catch a wave, to speak. Whether you happen to be at your breakfast table, on your
    backyard deck, in the library of your university, or at your local Starbucks,
    you can now go online without having to physically hook up your computer to anything.


    # I Need to Go Wireless?


    Whether or not you should join the fray and wireless is primarily a question of
    personal choice or individual needs. For example, if you don''t have a laptop,
    you will have a hard time of it, as Linux support for desktop wireless hardware
    is not really ready for prime time. If, the other hand, you have a laptop that
    you would like to plow down on the dining room table and during dinner (married
    readers beware), or while sitting in the Santa Fe depart San Diego waiting for
    your train to L.A., or while in your hotel room looking for things to do during
    your vacation in Seattle, or while sitting on your front porch taking in a bit
    of sun, then why not go for it? Whether you are ready to commit, still considering,
    or just plain curious, read on.


    # Wi-Fi


    To get up in the wireless world, you should first be aware of the three wireless
    protocols commonly use in world today: 802.11a, 802.11b, and 802.11g, which are
    collectively referred to as Wi-Fi (*wireless fidelity*). In case you are wondering,
    a protocol is basically a data-transmission format that has been generally agreed
    upon, in this case by the IEEE (Institute of Electrical and Electronics Engineers).
    Of these three 802.11 protocols, average home users need only concern themselves
    with 802.11b and 802.11g, because the hardware for these protocols is considerably
    less expensive than for 802.11a, which is primarily used in large office environments.


    The faster of the two protocols is 802.11g, which has a transmission speed of
    54 Mbps, the 802.11b''s is 11 Mps. Linux support for 802.11g wireless cards, however,
    is still developmental at best, which means that you would had better stick to
    the 802.11b protocol when selecting a wireless card. Although this may sound like
    an undesirable limitation, it is pretty much'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'irrelevant in the real-world scheme of things because the speed of your Internet
    connexion is still most likely to be slower than the capabilities of your 802.11b
    hardware, . . .


    First of all, the 802.11b protocol is still more commonly used than the 802.11g.
    Most public wireless-access areas (hot spots), as airports, university campuses,
    and hotels, use the 802.11b protocol. Even if the 802.11g protocol is used in
    such places, or if someone in your family has a 802.11g-based system and running
    in your house, you can still connect to the Net with your 802.11b network card,
    because the two protocols are compatible, which means you can use a 802.11b with
    a 802.11g WAP and vice versa (not for the 802.11a, however).


    Finally, the somewhat lower speed of the 802.11b devices will most likely matter
    little to you you are forking out an awful of money to your Internet provider
    each month for some extreme bandwidth. the average transmission speed of most
    cable Internet connections is less than the 11 Mbps of 802.11b, so don''t feel
    too much. Just remember that a traditional dial-up telephone modem has a maximum
    transmission speed of 56 Kbps, or 56 *thousand* bits per second, though such speeds
    are rarely achieved in reality; 11 Mbps is 11 *million* bits per second. That
    is plenty for the average motel.


    # Hardware


    To create your own home Wi-Fi setup, you need at least two pieces of hardware:
    a wireless access point (WAP) and a wireless network interface card (NIC) that
    goes inside your computer, both of which you can see in Figure 4-10. These two
    devices act like a pair of transceivers, communicating with each other via radio
    signals rather than over a wired connection. The WAP transmits data it receives
    from the Internet source device (such as your cable or ADSL modem) to the computer
    and receives data transmitted by the NIC''s inside the computer. The NIC, for
    its part, receives transmitted data from the WAP and transmits data from the computer
    back to the WAP.


    ![](img/855e727a697c289d306bb0e488065e20_81_0.png)


    Figure 4-10: All you need for a Wi-Fi setup—an access point and a network interface
    card'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'The basic differences between a wired and wireless Internet connection setup
    can be seen in Figure 4-11. In the typical wired setup, a cable from your high-speed
    Internet source device is directly connected to your computer by an Ethernet cable.
    If you are using a cable modem, for example, you would have an Ethernet cable
    going from your cable modem directly into the Ethernet port of your computer.
    It''s very straightforward and simple. In a Wi-Fi setup, you are basically replacing
    that direct-Ethernet cable connection with radio signals. The Ethernet cable from
    your Internet source device is in this case directly connected to the wireless
    access point, rather than to your computer.


    ![](img/855e727a697c289d306bb0e488065e20_82_0.png)


    Figure 4-11: Wired and wireless Internet connections compared


    What is connected to your computer is the wireless NIC. This is most frequently
    a PC card that you plug into one of the PCMCIA ports on your laptop (or into a
    special adapter on desktops). The NIC and access point then communicate with each
    other via radio waves rather than a hard-wire connection—a sort of virtual wire,
    if you like.


    # Wireless Access Points


    If you want to set up a wireless system in your home or office, then the first
    thing you will need to get is a WAP. Fortunately, Linux is not really much of
    an issue in this department, because the access point doesn''t physically interface
    with your computer. In addition, the 802.11b and 802.11g protocols are compatible
    with each other, it doesn''t really matter what type of access point you use.
    This is not to say that you don''t need pay attention to what you are getting,
    because there is one type of wireless access point you want to avoid.


    While whatever wireless access point you use should work right out of the box
    without the need for any special settings, there are a number of settings that
    you might want to consider, especially for reasons of security. You can usually
    input or change such settings by opening a web browser and then'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'typing in the IP address of the wireless access point, which is generally printed
    somewhere in the user''s manual. Once you do this, a web page will appear in which
    you can change or input the various settings available. You do not need to be
    connected to the Internet when doing this, as these settings pages are actually
    embedded within WAP itself.


    Unfortunately (for Linux users, anyway), there are a few WAPs that require you
    to use Internet Explorer to handle browser-based settings. Because a Linux version
    of Internet Explorer does not exist, you will find yourself unless you have a
    Mac or Windows machine elsewhere in the house to complete the job. Or yet it is
    the fact that some machines do not support browser-based settings at all. Instead,
    they require you to install special Windows software to do the job. When selecting
    hardware for your wireless setup, it is obviously best to stay clear of WAPs of
    this kind.


    # Wireless Network Interface Cards


    The other piece of hardware you will need for your wireless setup is a wireless
    NIC, which is actually the hardware you will need if you just want to go when
    you are outside of your home. Because these cards plug directly into your system,
    you must find and use a card that is Linux-compatible. Xros comes with several
    wireless drivers built in, so if you use a card that is compatible with one of
    those, you will have smooth sailing.


    Most NICs are PC cards that pop into the PCMCIA slot at the side of your laptop
    computer (Figure 4-12). However, there are also NICs that plug into one of your
    machine''s USB ports or one of PCI slots. Unfortunately, Linux support is still
    pretty limited to NICs of the PC card variety, though there are other Linux wireless
    drivers available for those other NICs.


    ![](img/855e727a697c289d306bb0e488065e20_83_0.png)


    Figure 4-12: A two-card PCMCIA slot


    I don''t really recommend going this non-PCMCIA NIC route, because doing so is
    not the simple slip-in-the-CD-and-double-click procedure that it can be in other
    systems. Adding a driver to Linux usually involves moving around the Linux kernel
    itself, which is a cumbersome and daunting process, especially for a beginner.
    Most drivers eventually make their way into future releases of the Linux kernel,
    so for now I would recommend sticking to hardware that is supported by the drivers
    that are included in your Xanthros distro.


    If you already have an NIC, you can just try out to see if it works by going through
    the set-up steps in the following section. If you are going to go out and buy
    an NIC, or are thinking of doing so, and do not want to waste your hard-earned
    cash experimenting, you will want to check things out more


    An Untangled 57'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'thoroughly. Before getting started, you should first check out the Xandros
    hardware compatibility database (http://support.xandros.com/hclv3) or the Xandros
    User Forums (http://forums.xandros.com/), where you can also ask for suggestions.


    # Setting Up Your Wireless Card


    Setting up a Linux-compatible wireless PC card is actually relatively simple.
    It is probably best, not essential, to first physically connect your WAP to your
    Internet source and then turn the WAP. Once it is up and running, plug your wireless
    NIC into the PCMCIA slot on your computer. Any LEDs on the card might light up
    at this time. If not, they will do so after you finish configuring the card.


    Once your card is inserted into the machine, it is time to configure the system
    with the card, which is all very easy. First open the Control Center via the launch
    menu, and then, once it opens, click the + symbol next to Network. In the subcategories
    that appear, click Network Connection. The Network Connection module will appear
    in the right pane of the window. Click the Administrator button in that pane,
    type your root password when prompted to do so, and then, when the module reloads,
    click the Interfaces tab.


    Once in the Interfaces tab, make sure that eth0 (Wireless Device) is selected
    in the drop-down menu next to the words Interface (Figure 4-13). After that, enable
    Network, and then Use dynamic address (DHCP) or Specify static address (and input
    the appropriate settings), according to what your provider requires. When you
    are done with all, click the Apply button. Your NIC should then be active and
    ready for action, so you can close the Control Center window now.


    ![](img/855e727a697c289d306bb0e488065e20_84_0.png)


    Figure 4-13: Setting up your wireless card'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Releasing and Renewing Your Wireless Connection


    There will be times when you want to turn your wireless card off, such as when
    you use your laptop on an airplane, or when you just want to flush the IP address
    in your Network settings (release) and update the settings with the IP address
    of a new network (renew), such as when you move your desktop from one wireless
    hotspot to another without rebooting your computer.


    This last point might seem a bit mysterious to you, so I will explain things briefly
    at this point. When you boot up your computer, your wireless card (NIC) performs
    a scan of available networks (WAPs) in order to see which one it can connect to.
    Once it finds a network, it gathers an IP address from that network via DHCP in
    order to allow you to access the Internet. Utilizing release and renew allows
    you to change WAPs without rebooting your computer or when your machine, whatever
    reason, just can''t seem to do on its own.


    To off your wireless card or release the current IP address in your network settings,
    just follow these steps:


    +   1. Go to the Launch menu and select Control Center.

    2. Click the + icon next to Network, and then click Network Connection.

    3. When the Network Connection module appears in the right side of the Control
    Center window, click the Administrator button, type your root password when prompted
    to do so, and then click OK.

    4. Click the Interfaces tab.

    5. Once in that tab, uncheck the Enable Network box, and then click Apply.

    6. Click OK in the warning window that then appears to complete the process.


    The boxes in the DHCP part of the window will now be empty, meaning that you have
    successfully released your settings and deactivated your card. If you would like
    to reactivate your card later on, or if you would just like to refresh the IP
    address settings now, you basically do a variation on the same theme: check the
    Enable box, click the Apply button, and then click OK in the warning window.


    You can also release and renew your IP address by following steps 1–4, and then
    clicking the Release button. Once the boxes in the DHCP part of the window are
    empty, click the Renew button. When a new IP address appears in the DHCP part
    of the window, click the Apply button, and then click OK in the warning window
    that then appears.'
  merge: -1
