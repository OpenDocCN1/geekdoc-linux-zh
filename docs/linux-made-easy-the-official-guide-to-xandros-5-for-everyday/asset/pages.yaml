  pgno: 151
- img_proc: true
  md: 'By enabling Expert View, you will be able to access yet another bundle of applications
    available to you via Xandros Networks, some of which can be rather interesting.
    In addition, once you''ve worked your way down to the next project, you will discover
    that Expert View is your key to an awesome gold mine of other applications available
    to you.


    In this project, you''ll get the chance to work with XN by installing a utterly
    useless, yet nonetheless, little application called kodo, which is an odometer
    for your mouse. C''mon, haven''t you wondered how many miles of desktop travel
    you''ve covered? Anyway, here are the steps:


    +   1. Enable Expert View by going to the Settings and selecting Expert View.

    2. After a few seconds, a string of new categories will appear under the New Applications
    heading. If that heading happens to be closed, you can see the heading but not
    the items beneath it, first click the + symbol to the left of that heading. Once
    the categories are visible, click Games.

    3. In the top half of the right pane in the XN window, scroll down until you find
    kodo. When you do, click it, and a description will appear below.

    4. Scroll down to the bottom of the explanation at the bottom of the right pane
    and click Installodo.


    Once you have completed these steps, the rest of the process is the same as the
    process you performed in Project 8A, so if you''ve forgotten, you can have a look
    back at instructions in that section. After kodo is installed, you can give it
    a whirl, quite literally, by going to the Launch menu and selecting Applications
    ► Games ► Toys ► Mouse Odometer.


    Soon thereafter, kodo will appear at one of the corners of your desktop (Figure
    8-15). And when you want to quit kodo, just click it, with either mouse button,
    and select Quit from the pop-up menu.


    ![](img/855e727a697c289d306bb0e488065e20_152_0.png)


    Figure 8-15: A desktop mouse odometer—kodo


    # Project 8C: Accessing Even More Applications and Having a Bit of Fun


    In the previous project, I let you in on an-overlooked little secret—Xandros Networks
    not only allows you to install the applications that appeared in the various categories
    listed in the left pane of its window (both in Standard and Expert Views), but
    it also gives you access to a whole slew of other applications—applications not
    directly supported or guaranteed by Xandros, but applications that should work
    fine on your system. These are the applications'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'from what Xandros refers to the Debian Unsupported Site. It is this cornucopia
    of easily accessible applications, and the ease with which you can find and install
    them, that make the cool of XN get downright, to resurrect a term I was loathe
    to use in its day. Ah, but I was so much older than . . .


    # 8C-1: Enabling the Debian Unsupported Site Repository


    To get started, you must first enable the Debian Unsupported Site repository,
    which you can do by following these two simple steps:


    +   1. Go to the Edit menu and select Set Application Sources.

    2. When the Set Application Sources window appears, check Debian Unsupported Site,
    and then click OK.


    The Xandros Networks application will then have access to the new repository to
    see what is there. Because of the great size of that repository, this may take
    some time. Be a bit patient, because when it''s done, you''ll be ready for some
    real exploratory excitement.


    # 8C-2: Browsing Through the New Offerings


    Once Xandros Networks has finished its reading of the online repository files,
    it will have to look at what is offered. Click the New Applications button in
    the main Xandros Networks window and have a look around. I am sure you will be
    overwhelmed by all there is to see.


    > Expert View must be enabled in order for you to do this.


