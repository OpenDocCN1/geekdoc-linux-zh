  md: '# Project 17D: Installing a Windows Application via CrossOver Office


    To show how you can install a Windows application via CrossOver Office, I will
    use an example of a text editor called NoteTab Light (Figure 17-38). A text editor,
    if you are wondering, is something like a word processor after liposuction—it
    allows you to type in your text but it doesn''t, in its purest form, any formatting.
    That means no fonts, no font sizes, no colors, and so on; and all of that means
    when typing and scrolling.


    ![](img/855e727a697c289d306bb0e488065e20_379_0.png)


    Figure 17-38: A Windows application, NoteTab Light, running in Xandros


    Although your Xandros distro also has a text editor of its own (Text Editor),
    it is worth to try out NoteTab Light as it is a different in the way it is set
    up. If nothing else, it is a quick download and will give you the chance to have
    some hands-on, no-cost experience installing a Windows application via OpenOffice.
    That said, go ahead and give it a try.


    # 17D-1: Downloading NoteTab Light


    To get NoteTab, go to notetab.com, and click the EXE Package button under the
    NoteTab Light 4.9 heading (the version number might be higher by the time you
    read this). Once the download is complete, the file NoteTab-Setup.exe will appear
    in your Home folder (or wherever else you happened to save it) with a CrossOver
    Office icon (Figure 17-39).


    ![](img/855e727a697c289d306bb0e488065e20_379_1.png)


    Figure 17-39: Windows .exe files appear with CrossOver Office icons'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# 17D-2: Installing NoteTab Light


    To install NoteTab Light, just follow these steps (this is essentially the same
    procedure as installing all other Windows applications):


    +   1. Double-click the NoteTab Light Setup file in your Home folder. If you are
    using the demo version of CrossOver Office, a warning will appear telling you
    how many days you have left on your trial period. Just click OK to continue.

    2. A window will then appear asking if you want to install NoteTab Light (Figure
    17-40). Click Yes.


    ![](img/855e727a697c289d306bb0e488065e20_380_0.png)


    Figure 17-40: CrossOver Office checks with you before installing NoteTab Light


    +   3. Another window will then most likely appear telling you that an access
    violation has occurred. Just click OK.

    4. The NoteTab Light Setup Wizard will appear (Figure 17-41). Click Next to continue.


    ![](img/855e727a697c289d306bb0e488065e20_380_1.png)


    Figure 17-41: The first page of the NoteTab Light Setup Wizard


    +   5. In the next page of the wizard, select I accept the agreement, and then
    click Next.


    NOTE The actual area in this license agreement window will be blank.


    +   6. In the next page of the wizard, accept the default installation directory
    by clicking Next. This directory is actually a fake Windows directory in your
    Linux partition—not the real Windows partition in a dual-boot setup.'
