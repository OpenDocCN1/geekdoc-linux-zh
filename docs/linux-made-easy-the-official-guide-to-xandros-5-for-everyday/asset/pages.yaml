    \ and\nrecording standards and regional encodings.\n\n# ### Television Broadcast\
    \ and Regional Standards\n\nWhether you are talking TV, video, or DVD, television\
    \ standards are,\nwhether you know it or not, of concern to you. Have you ever\
    \ anxiously\nplooded the video tape you got in the mail from a friend or relative\
    \ back in\nBrazil or Poland into your VCR, only to find that you couldn't view\
