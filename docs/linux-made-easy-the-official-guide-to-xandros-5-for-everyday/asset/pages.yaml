    # 18A-3: Running Njam


    Once the three dependency files are installed, the only thing you really have
    to do is run Njam. Because there is no menu launcher for you, however, you will
    have to run it via the Run Command. Once the window appears, type /home/yourusername/njam
    -w in the Command box in that window (being sure to place your username in the
    appropriate spot within the string). After you''ve done that, click Run, and Njam
    will start.


    In you''re wondering, that -w flag (you''ll learn a bit more about flags in Chapter
    20) causes Njam to open in a window (hence the w) rather than in full-screen mode.
    This is important, since running Njam in full-screen mode (without the -w flag)
    might cause some machines to freeze and then log out, which isn''t something you
    would normally have to happen. No damage if it does, of course, because all you
    have to do in that case is log in again, and why bother, right?


    # 18A-4: Creating a Menu Launcher for Njam


    Rather than typing in a command and every time you want to run Njam, you might
    like to create a menu launcher for it to make things a tad more convenient. You
    can also use the same process to add menu launchers for any other applications
    you need, so it is indeed worth having a go.


    Here are the steps for creating a menu launcher for Njam:


    +   1. Close the still-open Njam window by pressing the ESC key.


    +   2. Next, go to the Launch menu and select Applications ► System Menu Editor.


    +   3. When the Njam Editor appears, click the + symbol next to Games and then
    the + symbol next to Arcade.


