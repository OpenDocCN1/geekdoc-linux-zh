  md: 'of the script to point to the directory where the various Briscola files are
    located. To perform the adjustments as instructed in the README file, just follow
    these steps:


    +   1. Open a Console window and find the Tk shell, called Wish, by typing locate
    wish; press ENTER and then note on a piece of paper the location given.


    +   2. Now right-click the briscola.tk file itself in the briscola folder, and
