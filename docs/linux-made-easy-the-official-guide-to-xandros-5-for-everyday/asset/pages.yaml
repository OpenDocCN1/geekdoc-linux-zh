  md: '# 19A-2: Installing KGeography


    After KGeography is successfully downloaded, you can install it by running the
    Xandros Networks application and selecting Install DEB File in the File menu.
    In the Browse for Packages window that appears, locate and select the kge deb
    package by clicking it once. Then click the Open button in that window, and the
    installation process will begin.


    # 19A-3: Running and Using KGeography


    KGeography will create its own world launcher, so you can easily run it via the
    Launch menu by selecting Applications > Education > Miscellaneous > KGeography.
    Once KGeography appears, you can choose from various worlds by going to the File
    menu and selecting Open. From the that appears (Figure 19-17) you can select Africa,
    Europe, France, Germany, North and Central America, Spain, or USA.


    ![](img/855e727a697c289d306bb0e488065e20_420_0.png)


    Figure 19-17: Choosing the region to study in KGeography


    Once you have made your selection, you have a number of options to choose from.
    On the left side of the KGeography window is the following list of buttons.


    Browse the map


    This is not a quiz rather a way for you to familiarize yourself with the countries
    or states in the map selected. Clicking on a country or state reveals its name
    and capital (Figure 19-18).


    Click division in the map


    In this quiz, you are told in the left pane to click on a specific state or country.


    > NOTE In KGeography, division stands for a political division.


    Guess division from its capital


    In this quiz, you are given a sentence to complete, such as “Hanover the capital
    of...,” and then given four answers to choose from.'
