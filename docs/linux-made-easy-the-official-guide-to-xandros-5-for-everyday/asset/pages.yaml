  md: '![](img/855e727a697c289d306bb0e488065e20_326_0.png)


    **Figure 16-14:** The top and bottom halves of the GIMP''s Layers, Channels, Paths
    window


    The bottom half, unlike that of the left window, has no relation to the top; it
    is merely where you select from the various brush styles, patterns, and gradients
    available in the GIMP, regardless of whether or not you have selected a tool that
    can utilize such options.


    Finally, we come to the matter of menus. In most applications, the main menu selections
    are available via the menu bar in the main program. In the GIMP, however, the
    menu bar provides only three entries, and the options within those are quite limited.
    The main options in the GIMP are instead to be found in the menu bar of each image
    window, as you can see in Figure 16-15. This is where you will be able to, among
    other things, save, add effects to, and resize your image.


    ![](img/855e727a697c289d306bb0e488065e20_326_1.png)


    **Figure 16-15:** GIMP menu bars in the main and an image window


    # 16A-4: Putting It All Together (and Learning a Bit More) by Creating a Custom
    Desktop Wallpaper


    I could describe and explain all of the GIMP''s various tools, filters, and other
    features, but to cover them one-by-one would fill up an entire book. Given the
    many other topics that must be covered within the confines of these covers, however,
    I just can''t do that. What I can do is give you a chance to play around with
    what GIMP has in store and in the process create something that might actually
    be of some use. What I have in mind is a custom-made desktop wallpaper.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'So that you will know what sort of images you will need to complete this project,
    let me first describe what the final creation will look like. Basically, we are
    going to take a main background image, such as a landscape or cityscape, and add
    snapshots of people on top of it. For example, let''s say that you took a family
    trip to Walt Disney World last summer. In this case, you would use a landscape
    shot of Disney World, preferably with lots of open top space (aka sky), and then
    add snapshots of each person who went on the trip. course, you can add pictures
    of your favorite film stars if that''s what you want to do. It''s all up to you.
    Just make sure that you have a background image that has a lot of top space. For
    pasting purposes, four snapshots should do nicely. It''s also nice if you can
    choose two vertical and two horizontal shots, for maximum effect.


    For my part, I will be using the photo of Wilmington, North Carolina, that I took
    last summer (shown back in Figure 11-17) and, to paste on top of that, some photos
    of friends I visited at that time (Figure 16-16).


    ![](img/855e727a697c289d306bb0e488065e20_327_0.png)


    ![](img/855e727a697c289d306bb0e488065e20_327_1.png)


    Figure 16-16: Examples of photos to be used in a custom desktop wallpaper (excluding
    the background image)


    Once you have selected your pictures


    # Phase One: Cropping


    The first thing you may (or may not) have to crop all or some of the images you
    will be pasting onto the background image. Since these images will be much smaller
    than the background, you will want the content of'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'images to be clear ... and big. That being the case, if the person you are
    going to be focusing on a particular image is dwarfed by his or her surroundings,
    you''ll need to crop.


    The image on the left side of Figure 16-17 is a good example, where my friend
    is barely visible, while his house clearly is. Since it is my friend whom I wanted
    to add to my wallpaper, not his house, I had to do some cropping.


    ![](img/855e727a697c289d306bb0e488065e20_328_0.png)


    ![](img/855e727a697c289d306bb0e488065e20_328_1.png)


    Figure 16-17: An image before and after cropping


    To crop the image to about the size I wanted, as seen on the right side of Figure
    16-17, I clicked the cropping tool (second row, last tool in Figure 16-13) and
    then, with that tool, outlined the area I wanted to crop, as seen in Figure 16-18.
    When finished, I clicked the Crop button, and the job was done.


    ![](img/855e727a697c289d306bb0e488065e20_328_2.png)


    Figure 16-18: Cropping an image in the GIMP


    302 Chapter 16'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Phase Two: Resizing


    Once you''ve cropped any images in need, the next thing you have to do is resize
    the photos so that they all pretty much have the same dimensions and that they
    will appear at an appropriate size in contrast to the much bigger background image.
    Here are the steps:


    +   1. Determine the size of the background image by clicking the window for that
    image and selecting Image ► Canvas Size.

    2. When the Canvas Size window appears (Figure 16-19), note the larger of the
    two numbers near the top of the window, whether it be Height or Width. In the
    case of Figure 16-19, note the dimensions of the image as displayed near the top
    of the Canvas Size window (1986 × 1452 pixels in this case).


    ![](img/855e727a697c289d306bb0e488065e20_329_0.png)


    Figure 16-19: Determining the size of an image


    +   3. The size of the vertical images you paste onto the background image should
    be approximately one-fourth the height of the background, so once you know the
    height of your background image, do the math. In my case, the ideal size would
    be around 360 pixels (4 × 360 = 1440); yours will most likely be slightly different.

    4. It is probably helpful, not absolutely necessary at this point, to view all
    of your images at their full size. This avoids confusion in terms of perception.
    You can tell the size at which you are viewing an image by looking at the little
    bar, where it will sit, at the very end of the title, 100% or 37% (see Figure
    16-18). You want them all to be showing at 100%, so look for any that aren''t,
    click them (one-by-one, of course), and then select Zoom ► 1:1 (100%) in the View
    menu. When you have done this for each of the photos in question, you are ready
    to move and resize the images.


    +   5. Choose one of the vertical paste-on images by clicking it or its window,
    and select Scale Image in the Image menu.


    When the Scale Image window appears, adjust the number for the Height box in the
    top half of the window so that matches the number you'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'determined to be appropriate in your case. Don''t worry about the width, as
    the height-to-width ratio will be retained automatically.


    +   6 When finished, click OK, and then repeat the process for the other vertical
    image.


    Next, move on to the horizontal paste-on images. The process for these is the
    same, but this time, after the Scale Image window appears, adjust the number of
    pixels in the New Width box so that it is the same number of pixels as you used
    for the height of the vertical images. Doing this will make the horizontal images
    as wide as the vertical images, which will produce a better-looking final product.
    Anyway, once you have done that, click OK, and move on and do the same for the
    remaining paste-image.


    # Phase Three: Turning Your Background Image into a Work of Art


    Okay, now that you''ve gotten everything right, it''s time to start playing with
    filters and effects. The first thing you''re going to do is turn your background
    image into an oil painting. Although this sounds like a rather spectacular thing
    to do, it is incredibly simple. Just follow these steps:


    +   1 Go to the Filters menu of your background image and select Artistic Oilify


    +   2. Once the Oilify window appears, click the OK button, after which a progress
    bar starts moving to the right at the very bottom of the background-image window,
    signaling the progress of the oilification process. Once it is complete, you will
    notice the changes.


    If you would like to look a bit more oilified, go to the Edit menu, select the
    Undo, and repeat the Oilify steps. However, this time around, the Oilify window
    appears (Figure 16-20), click the box next to Use Intensity Algorithm, and increase
    the number of the Mask Size in order to increase the effect. In case you''re wondering,
    the Intensity Algorithm helps retain the colors and detail of your original image,
    while the Mask Size refers to the brush size of the oilied image—higher number
    strokes produce larger strokes looking results.


