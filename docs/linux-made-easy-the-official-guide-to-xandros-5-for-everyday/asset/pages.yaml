  md: '# # 5


    # ## THERE''S NO PLACE LIKE HOME


    Working with Your Files in the Xandros File Manager


    ![](img/855e727a697c289d306bb0e488065e20_87_0.png)


    Double-click your ruby slippers and you may well end up in some dust bowl of a
    town in Kansas, where some nasty old lady is trying to have your dog sent to the
    pound—and in a wicker basket, no less! Double-click the Home icon on your desktop,
    however, and you will find yourself looking at the Xandros File Manager—a much
    happier place to be, all things considered. The Xandros File Manager (commonly
    referred to as XFM on Xandros user group forums) is arguably the most important
    part of your system. It allows you to access your files; view your digital images;
    browse other computers connected to your network; copy files to and from your
    Windows partition (if you have one); browse the contents of CDs, floppies, and
    other removable storage devices; burn CDs or DVDs; and even rip and encode music
    from audio CDs. Because the capabilities of this jack-of-all-trades are so great,
    I will will be covering most of its features in this chapter and the next, while
    mentioning yet other features elsewhere throughout the book.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Navigation


    When you launch the Xandros File Manager, double-clicking the Home folder on your
    desktop or single-clicking the XFM launcher on the Panel, will open up to your
    Home folder (Figure 5-1).


    ![](img/855e727a697c289d306bb0e488065e20_88_0.png)


    Figure 5-1: The Xandros File Manager


    At this point in the game, the only two things you will find there are two icons:
    Desktop and My Documents. Double-clicking the Desktop icon will show all the files
    and launchers you have happened to locate, at which this point should be the five
    desktop launchers we discussed in Chapter 3. Double-clicking the My Documents
    folder, on the other hand, will reveal the three folders that Xandros has already
    set up for you there: My Music, My Pictures, and My Videos.


    # Two Navigation Methods


    Xandros provides you with two methods of navigating through your files: using
    the XFM navigation buttons and using the XFM tree.


    # Navigating via the XFM Navigation Buttons


    Once you''ve done some digging around in your various folders, you can move back
    and forth between them using the three XFM navigation (arrow) buttons below the
    Address bar (Figure 5-2). The left and right arrow buttons are very much like
    those you would use in a web browser—the left arrow takes you back to the folder
    or file you were just viewing, while the right arrow takes you back to whatever
    you just left. The up arrow, on the other hand, brings you one folder per click.
    If this'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'doesn''t seem clear to you at this point, give it a try later on when you have
    more files and folders with which to play around. You''ll get the hang of it soon
    enough.


    ![](img/855e727a697c289d306bb0e488065e20_89_0.png)


    Figure 5-2: The Navigation buttons in XFM


    To get double-click access to the other options available to you from the Xandros
    File Manager, such as your Windows partition or a CD or DVD, you can just click
    the arrow button up in My Home folder, or click once on the My Linux button in
    the left pane of the XFM window. The various devices and options will then appear
    in the right pane (Figure 5-3). We will be covering these items later on or in
    the next chapter, so just hold off fiddling with these for now.


    ![](img/855e727a697c289d306bb0e488065e20_89_1.png)


    Figure 5-3: Accessing it in the Xandros File Manager window


    # Navigating via the XFM File Tree


    One of the most obvious things you''ll notice in a Xandros File Manager window
    is the presence of a file tree, which appears in the left pane of the XFM window,
    which would be quite familiar if you''re coming over from a Windows environment.
    You can use this file tree to navigate through your file system rather than using
    the double-click/arrow-button method I just described. Clicking any of the icons
    in the file tree will reveal the contents of that folder, network, or device in
    the right-hand pane. You can also view the subfolders within that tree by clicking
    the + symbol next to any item. Obviously, if there is nothing within that item,
    nothing will appear.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'To look for yourself, click the + symbol next to My Home, and then click the
    + symbol next to the My Documents folder, which appears after that. Beneath the
    My Documents folder in the file tree you see the three subfolders of Xandros have
    already set up for you: My Music, Pictures, and My Videos. At this point, you
    probably won''t have any files in any of these folders, but if you do ... say,
    some photos in the My Pictures ... clicking that folder would reveal (in the pane
    on the right) the image files you have stored there, as you can see in Figure
    5-4.


    ![](img/855e727a697c289d306bb0e488065e20_90_0.png)


    Figure 5-4: Viewing the contents of a folder via the file tree in XFM


    # # Bookmarks Within XFM


    Another very handy feature of XFM is that lets you create bookmarks. You are no
    doubt familiar with creating bookmarks for web pages that you frequent, but why
    not earth want to create bookmarks within your file system? Imagine that you have
    a folder that you often need to use but it takes an excessive number of mouse
    clicks to reach. To reduce the risk of repetitive strain injury (RSI) and the
    risk of developing carpal tunnel syndrome (CTS), you can reduce the number of
    clicks needed to get the bookmark by navigating to that folder, and then, in the
    Bookmarks menu of XFM window, selecting Add Bookmark. After that, whenever you
    want to get back to that well-buried folder, you can just click the Bookmarks
    menu, and that folder will be right there waiting for you on the.


    For example, let''s say you want to deal with a group of images you''ve downloaded
    from your digital camera to your hard disk. The photos are in the Summer in Wilmington
    folder within the My Albums folder, which is located within Your Pictures folder,
    which is located in your'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'My Documents folder. That''s a lot of clicking. By clicking your way to that
    folder once and by bookmarking it, getting to it in the future will be a mere-click
    endeavor via the Bookmarks menu (Figure 5-5). You''ll be saving your weary up
    to six clicks every time you want to go to that folder.


    ![](img/855e727a697c289d306bb0e488065e20_91_0.png)


    Figure 5-5: Using the XFM Bookmarks menu


    # Creating Folders and Renaming Files in XFM and on the Desktop


    Two of the most common file-related procedures in any system, creating folders
    and renaming files, are easily performed in the Xandros File Manager. To create
    a folder in XFM, right-click any open space in the right pane of the XFM window,
    and then select New Folder in the pop-up menu.


    To rename a file in XFM, right-click the file and select Rename in the pop-up
    menu. The filename below the file will be highlighted. You can then rename the
    file and press ENTER to complete the process or click any open space within the
    window to retain the original file extension (.doc,.png -.jpg, and so on) when
    you rename a file.


    To create a folder or rename a file on the desktop, the procedures are essentially
    the same as for XFM. To create a folder, right-click directly on any open space
    on the desktop, and then select New Folder in the pop-up menu. To rename a file,
    right-click the file, select Rename in the pop-up menu, type the new name, and
    then press ENTER or click any open space on the desktop. You can also rename a
    file by clicking the file once to select it and then pressing the F2 key.


    # Copying and Moving Files in XFM


    Copying and moving files within the Xandros File Manager is a pretty straightforward
    endeavor, although it might be slightly different from what you are used to in
    your previous operating system. In most other operating systems, dragging a file
    and dropping it in a new location moves the file to that new location. In XFM,
    however, that drag-and-drop procedure copies the file, thus leaving you with two
    copies of the file, in a different location.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Copying a File


    Keeping that warning in mind, you basically know how to copy a file: click the
    file, and keeping the mouse button depressed, drag the file to wherever you want
    to create the copy. You can drag it to a folder within the right pane or to a
    folder within the file tree in the left pane. Once the mouse cursor is over the
    destination folder, that folder will be highlighted. It is then safe to release
    the mouse button. A window will appear (for a very short time in the case of small
    files) that indicates the progress of the copying process. When that window is
    gone, the copying is complete.


    # Moving a File


    Moving a file is almost exactly the same process I have just described, except
    that you need to use the right mouse button instead of the left one. To move a
    file, right-click the file you want to move, and drag it to the target folder
    in either pane of the XFM window. Once the target folder is highlighted, release
    the mouse button. A small pop-up menu will then appear (Figure 5-6).


    ![](img/855e727a697c289d306bb0e488065e20_92_0.png)


    Figure 5-6: Moving files in XFM


    In mean, move your cursor (without holding down either mouse button) over Move
    Here, in order to select that option, and click once with your left mouse button.
    A progress window will appear for a brief time until the process is complete.


    # Copying and Moving Files on the Desktop


    You can also save files to your desktop, as you could with your previous operating
    system, but there''s more than one way to do so:


    +   To copy a file from the desktop to the Xandros File Manager, while you are
    holding down the mouse button, drag the file from the desktop, and then drop it
    in the right pane of the window by releasing the mouse button. If you would like
    to copy the file to a folder other than the one open in the right pane, you can
    drop the file directly on the target folder in either the right pane or the file
    tree in the left pane. If your XFM is minimized, you can still drag the file from
    the desktop, hover the cursor over the XFM entry in the taskbar and wait for the
    window to appear in the foreground.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '+   - To move a file from the desktop to XFM, first copy it to XFM, and then
    drag the original file to the trashcan.


    +   - To copy or move a file from XFM to the desktop or to a folder on the desktop,
    hold the left mouse button and drag the file to the desktop and release the file.
    A pop-up menu appears (Figure 5-7). Select **Move Here** to move the file or **Copy
    Here** to copy it. When you have made your choice, click the *left mouse button*.


    +   - To move or copy a file from the desktop to a folder on the desktop, drag
    and drop the file using the left mouse button.


    ![](img/855e727a697c289d306bb0e488065e20_93_0.png)


    Figure 5-7: Pop-up menu when copying and moving files from XFM to the desktop


    # Another Way to Copy and Move Files


    You can also copy or move files by cutting and pasting them in XFM or on the desktop.
    To do so, right-click the file that you want to copy or move, and in the pop-up
    menu, select **Copy** (to copy the file) or **Cut** (to cut the file from its
    present location and move it to a new location). Then left-click your selection.
    Drag the file to where you want to copy or move the file, right-click the mouse,
    and in the pop-up menu, select **Paste**. Finally, click the left mouse button,
    and you''re finished.


    # Creating a Desktop Link to a File in XFM


    Rather than copying or moving a file from XFM to your desktop, you can create
    a link (or shortcut) to the file. To access the file, you would double-click that
    link.


    To create a link on your desktop to a file within XFM, drag the file to where
    you want to create the link using the left or right mouse button, and release
    the mouse button. In the pop-up menu that appears, select **Link Here**, and then
    click the left mouse button.


    # Extracting and Creating Archived Files in XFM


    In addition to its many other capabilities, the Xaxos File Manager allows you
    to easily open and create archived files without installing additional software.
    If you''ve ever dealt with a ZIP file in Windows or a StuffIt (.sit) file in Mac
    OS, you have experience with archived (also referred to as *compressed*) files.
    Basically, when you compress, you are taking a single file, or often, a group
    of files and shrinking them to a size that takes up less disk space. This is very
    useful when trying to squeeze as much as you can onto a floppy disk or a CD, or
    when trying to send files over the Internet. Most applications you downloaded
    from the Internet come in this fashion.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'Most archived files in the Linux world are created with some variation of the
    Tar program. The archives created in that format are often referred to as tarballs
    and usually end with the extension .tgz. Of course, Linux can also create and
    extract ZIP archives, as the compression format used for a particular archive
    usually reflects the system or for which it was created.


    # Extracting an Archived File


    There are a couple of ways to extract the contents of an archived file, but the
    easiest is to double-click the archived file, right-click the folder you find
    within, and then select Copy in the pop-up menu. After that, navigate to wherever
    you want to place the folder, right-click any open space in that window, and then
    select Paste in the pop-up menu.


    If the files within the archive are not already in a folder of theirs, you will
    have to create a folder for them first, using the more conventional methods learned
    earlier in this chapter. Once you''ve done that, select all of files within the
    archived file, right-click one of them, and then select Copy in the pop-up menu.
    After that, navigate to the new folder you''ve created for your new files, right-click
    any open space in that window, and then select Paste in the pop-up menu.


    # Creating Your Own Compressed Files


    Now that you know how to extract the various types of compressed formats out there,
    you probably also know how to create your own. As a general rule of thumb, the
    format you choose to use should reflect the system of the person who will ultimately
    be opening the archive. That said, if you are creating archives for Windows users,
    use ZIP; for Linux or Mac users, use TGZ.


    # Creating a Tarball (TGZ File)


    How about if you want to create your own tarball in XFM? No problem; just follow
    these steps:


    +   If you want to place multiple files in the same folder, create a new folder,
    name it appropriately, and then place all the files you want to add to the archive
    into that folder.(If you want to archive only a single file, you can omit this
    folder-creation and file-moving step.)


    +   Next, right-click the folder (or the single file) from within XFM, and then
    select Create TGZ Archive in the pop-up menu.


    +   The archive will automatically have the name of the folder or single file
    you clicked, plus the extension .tgz. In a matter of seconds (slightly longer
    for bigger archives), the new archive will appear next to the folder that you
    just moments before right-clicked, and your mission will be complete.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Creating a ZIP File


    The procedure for creating a ZIP archive is essentially the same as that for creating
    a tarball: create a new folder, copy or move all the files you want to place in
    that folder, right-click the folder, and select **Add to ZIP Archive** in the
    pop-up menu. Once you have completed these steps, *Add to Zip Archive* window
    (Figure 5-8) will appear with the name of the folder you''re creating as the name
    of the soon-to-be-created ZIP file. Assuming name will do, all you have to do
    is click **OK**, and the process will be complete within a few seconds—maybe less.
    If, however, you remember you forgot to add a file to the archive, you can choose
    to add it at this point (before clicking **OK**).


    ![](img/855e727a697c289d306bb0e488065e20_95_0.png)


    Figure 5-8: Creating a ZIP archive


    To add a file to your under-construction ZIP archive, click the **Add** button
    in the bottom half of the Add to Zip Archive window. Another window, *Add files
    or folders*, will then appear, and from there you can choose other files to add.
    Once you have found the file you want to add, select it and then click **Open**.
    The file you chose will appear in the list at the bottom of the Add to Zip Archive
    window. To add another file, repeat this procedure again. Once you have finished
    adding files, click **OK**.


    What if you want to add files after the ZIP archive is already created? Well,
    just treat the archive like a regular folder and do a copy-and-paste routine.
    Here''s what you would do, step-by-step:


    +   1. Select the file (or files) you want to add to an existing ZIP archive,
    right-click it (or them), and then select **Copy** in the pop-up menu.

    2. Next, double-click the ZIP archive you will be adding to.

    3. When the window for that archive opens, right-click any open space within that
    window, and then select **Paste** in the pop-up menu.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Xandros File Manager as an Image Viewer


    Another one of the things about XFM is that it can act as a sort of picture viewer
    and preview. If you click on any graphics file, a thumbnail of that file will
    appear in the left side of the right pane of the XFM window, as you can see in
    Figure 5-9.


    ![](img/855e727a697c289d306bb0e488065e20_96_0.png)


    Figure 5-9: Viewing a thumbnail of an image file in an XFM window


    You can also have your graphics files appear as thumbnails, rather than icons
    (as seen in Figure 5-10), by going to the View menu and selecting Thumbnails.
    This lets you see your graphics files without having to use any other special
    imaging software. Admitted, this feature is no longer unique in the world of operating
    systems, but it is handy nonetheless. What is more unique to Xandros, as you will
    learn shortly, is that functionality works for text files too.


    When you double-click a thumbnail of an image in XFM, it will appear at a larger
    size in the right pane of the XFM window (Figure 5-11). At the same time, a set
    of controls will appear with which you can browse through your images at an enlarged
    size, rotate, adjust the level of magnification, or even run an in-window slideshow.
    This is very cool, especially for a mere file manager.'
  merge: -1
  pgno: 96
