  md: '# Phase Three: Extracting the Theme Tarballs


    The themes you''ve just downloaded are all in the form of compressed tarballs,
    before you use them, you will have to extract each one using the methods you learned
    in Chapter 5. Once you extract them, it would be a good idea to create a special
    folder in which to place them and all other themes you download in the future;
    KarambaThemes would be a fitting name for that folder. After creating the folder,
    move the folders for the three themes into.


    # Phase Four: Running SuperKaramba


    Okay, so now that you have all of what you need in place, it is time to give SuperKaramba
    a try. As is the case with a good many of the applications you install from the
    Debian Unsupported Site repository, there will be no launcher for SuperKaramba
    in the Launch menu. This being so, you will have to run it via the Run Command
    (Launch Run Command). In that window, type superkaramba, and then click Run.


    Once SuperKaramba''s welcome window appears (Figure 8-17), one of the themes you''ve
    downloaded by doing (I''ll start with karamopt, it''s probably best that you do
    one:


    +   1. Click Open, which will bring you the Open Themes window.


    +   2. In that window, navigate to and double-click once on the KarambaThemes
    folder. You should be able to see the Karamopt, ChromeClock, and NewTubar folders.


    +   3. Double-click the Karamopt folder, and then click once on the karamopt.theme
    file therein. Karamopt will appear on your desktop.


    In case you''re wondering what Karamopt is, it is a system monitor that shows
    how much memory each of the active processes at work in your system is using up.
    Look at it for a while, enjoy its intrinsic beauty, and then once you get bored
    with it, move on and open Chrome Clock. You can open Chrome Clock in this way:


    +   1. Right-click the Karamopt applet, and in the pop-up menu, select new theme.
    The Open Themes window will open up to the Karamopt folder.


    +   2. Navigate back to the KarambaThemes folder and then to the ChromeClock folder
    within it. Once, double-click that folder.


    +   3. Inside that folder, click ChromeClock.theme, and then click Open.


    Once you finished oozing and ahing over how beautiful time can be, move on to
    opening the NewTubar bar. Before doing that, it is probably best to move Karamopt
    and Chrome Clock so that they are from the bottom of the screen. To do this, right-click
    each of them, and then select Toggle locked position in the pop-up menu.'
