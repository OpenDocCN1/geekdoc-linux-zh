    ![](img/855e727a697c289d306bb0e488065e20_294_1.png)


    Figure 14-27: The RealPlayer Setup Assistant


    There are only four steps in the wizard, and all are as simple, requiring you
    to do little more than click a single button. Here are the steps of the wizard:


    +   1. **Welcome:** Just click Forward.

    2. **Release Notes:** Just click Forward.

