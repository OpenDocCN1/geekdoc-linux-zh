  md: '# 9. Installation Summary In the final installation screen (Figure 2-11), the
    Installation Wizard shows what it is going to install, where it is going to install,
    what it is going to do with what is already on your hard disk, and a few other
    details. Pay special attention to the top line, *Install method*, to make sure
    that it matches what you are hoping for. In the case of a Windows-partition resizing,
    it should say: *Resize Windows partition*. If everything looks as it should, click
    the **Finish** button.


    ![](img/855e727a697c289d306bb0e488065e20_48_0.png)


    Figure-2-11: A last-minute check before beginning the actual installation


    If you are creating a dual-boot setup, the Xandros installer will begin resizing
    your Windows partition and then create and format partitions to install. If you
    are creating a Xandros-only setup, the installer will skip the resizing process
    and begin to create format partitions. In either case, when it is done getting
    your hard disk ready, the installer will begin the process of installing the Xandros
    system and its bundled applications. You can now sit back and rest for a while.
    Rather than sitting around fretting, why not get back to *Dawson''s Creek* DVD
    that I told you to turn off in Chapter 1, or go downstairs and take your dog Sputnik
    for a short walk—30 minutes should be more than enough in most cases.


    Once the process is complete, Xandros will tell you so in a small pop-up window.
    Click the **Exit** button in that window. Xandros will soon eject the install
    CD automatically and tell you in a full-screen message to remove the install CD
    (and floppy disk, if you needed one). After removing the disks, press **ENTER**
    (as also instructed to do on-screen) to restart your machine.'
