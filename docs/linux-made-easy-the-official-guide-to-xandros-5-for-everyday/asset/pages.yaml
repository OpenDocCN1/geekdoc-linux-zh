  md: '# 11


    # BECAUSE MEMORY SOMETIMES FAILS TO SERVE


    Digital Cameras


    ![](img/855e727a697c289d306bb0e488065e20_199_0.png)


    Digital cameras have been around for far less time than scanners, and yet the
    number of people owning them, as well as the cross section of people using them,
    is far greater. Seems that just about everyone these days, from Grandma to the
    kid next door, is snapping up memories of his or her world with a digital camera.


    Fortunately, support for digital cameras in the world of Linux is significantly
    better than for scanners. In fact, it is probably safe to say that if you have
    a digital camera, it will most likely work with Linux. Even if your particular
    model is so old or so new or so obscure a make that it doesn''t, you can still
    get these photos into your computer by removing the storage medium in that camera,
    popping it into a media reader connected to your computer, and then loading the
    image files that way into your computer (as covered in Chapter 6). As you can
    see, one way or another, you will be able to use your camera with Linux.


    The backend, the essentially hidden part of your system that provides digital
    camera support in Linux, is the gPhoto2 digital camera library. The gPhoto2'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'digital camera library is included in your Xandros system, and at present,
    it supports hundreds of cameras. If you are curious to see whether or not your
    camera is supported, go to the gPhoto project page at gphoto.org.


    Scroll down the page, and click the link that announces specific number of cameras.
    As this chapter was written, the number went 400 cameras to 500. There''s no telling
    how many will be shown when you read this.


    On that page, you will find a complete list of all the cameras supported by gPhoto2.
    If your camera isn''t on the list, it most likely means (as page points out) that
    your camera is so old that there is little demand for support for it or it is
    so new that there hasn''t been enough time to develop specific support for it.
    Remember, however, that just because your camera isn''t on the list doesn''t mean
    it won''t work. I''ve already pointed out, chances that it will it.


    gPhoto2 is constantly being updated, so if your camera isn''t on the list, now
    it could very well be there in the future. Using Xandros Networks now and to check
    for updates should keep you up-to-date as possible.


    # Project 11-1: Working with Your Digital Camera


    All things told, working with images from your digital camera will prove a much
    easier, and arguably more enjoyable, task than dealing with the scanner. All you
    have to do started is plug the smaller end of the USB connector that came with
    your camera (which most likely looks like in Figure 11-1) into the camera, and
    then plug the other end, which has a standard USB connector, into one of your
    computer''s USB ports. Once you''ve done that, you''re ready to follow along.
    Oh, and leave your camera''s power off for now.


    ![](img/855e727a697c289d306bb0e488065e20_200_0.png)


    Figure 11-1: Connecting the USB connector to your camera'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 11A-1: Telling Digikam Where to Store Your Images


    Now that your camera and computer are tethered to each other, let''s get on the
    main task at hand: downloading the images from your camera to your computer''s
    hard disk. The first thing you need to do is run the application that handles
    basic digital camera tasks in Xandros—Digikam. To run Digikam, go to the Launch
    menu and select Applications > Graphics > Digital Camera. The first time you run
    Digikam, a window will appear asking you where you want Digikam to create the
    My Albums folder it would use to store your downloaded images (Figure 11-2).


    ![](img/855e727a697c289d306bb0e488065e20_201_0.png)


    Figure 11-2: Digikam asks you where you want to store your images


    A good place to store your digital images would be in the My Pictures folder that
    Xandros automatically sets up for you within your My Documents folder. To tell
    Digikam to use that folder, here''s what you need to do:


    +   1. Click the Select button, and a Select Folder window will appear.

    2. In that window, locate the My Pictures folder in the tree file in the right
    pane of the window by clicking the + symbol next to the My Documents folder, and
    then click directly on the My Pictures folder.

    3. The folder will then be highlighted in blue, thus looking like the folder shown
    in Figure 11-3. When the folder is highlighted, click OK.

    4. You will be back at the original window, which will indicate the path to the
    folder you selected. Click OK, and the main Digikam window will appear.


    # 11A-2: Getting Digikam to Recognize Your Camera


    Now that Digikam knows where to store your images, let''s move on to the even
    more important job of setting it up so that it knows what kind of camera you have.'
