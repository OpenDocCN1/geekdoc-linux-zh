    # Playing DVDs and VCDs


    Your Xandros system also allows you to play DVDs; however, due to licensing concerns,
    playback is limited to unencrypted discs. Unfortunately, this rules out a vast
    majority of the DVDs you buy or rent at your local video shop, leaving you with
    a rather limited choice of movies that you can play on your computer. Of course,
    DVDs created on personal computers (such as the DVD that people create these days
    with applications as iDVD on the Mac) pose no problem.


    # DVD Encryption


    You may be wondering at this point what encrypted DVDs are, why they are encrypted,
    and why you can''t play them, so I will fill you in. Commercial DVDs are almost
    encrypted with CSS (Content Scramble System). The main purpose for playing DVDs
    with CSS is supposed to prevent piracy. CSS, however, does a bit more than that,
    as it is also used to enforce regional encodings (monore on in the next section)
    and to prevent you from skipping through, among other things, FBI warnings that
    appear when you first play a DVD.


    In order for a device, such as your stand-alone DVD deck beneath your TV or the
    playback software on your computer, to play an encrypted DVD, it has to have a
    CSS decryption key. This is available to any company that wants to include it,
    but in order for company to do so legally, it has to pay for right. Most Linux
    distros, as Xandros, do not include the key because, among many reasons, they
    would have to pass on the costs to you if they did. When you buy Mac OS or most
    DVD playback software for Windows, on the other hand, you are in paying for that
    key—a hidden cost of sorts.


    # So I Can''t Play My Hollywood Blockbusters in Linux?


    Now you may think that this lack of encrypted DVD playback in Linux is a major
    stumbling block, but that is not actually the case. You can add the CSS'
