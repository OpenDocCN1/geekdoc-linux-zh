    Figure 14-25: Modifying audio-file-tag with EasyTag


    # # Listening to Internet Broadcast Streams


    One of the coolest features of the Internet is streaming media, which are live
    or recorded, audio or video, Internet broadcasts. Broadcasts can come in a variety
    of streaming formats, which are basically compression formats that allow the data
    to move across the Internet at as small a size as possible. Unfortunately, Linux
    cannot yet deal with the two most common of these streaming formats, Windows Media
    Player and Apple’s QuickTime, at least in any simple way, that they can download
    files in those formats. Fortunately, there are other media-streaming formats available
    on the Internet, such as RealMedia. In addition, since streaming-media formats
    are essentially space-saving compression formats, it is only natural that MP3
    and Ogg Vorbis, both audio-compression formats themselves, have also come to be
    used as streaming-media formats for Internet broadcasts.


    # # Project 14: Real Player 10


    RealPlayer (Figure 14-6) is one of the most popular media players in the computer
    world. Fortunately, it not only comes in Windows and Mac OS versions, but it is
    also available for Linux. RealMedia streams, specifically geared for use with
    RealPlayer, are widely available and provided by many mainstream broadcasters,
    both local and international.


    # ## 14D-1: Setting Up RealPlayer


    To get started, you first need to set up RealPlayer 10. To do this, go to the
    Launch menu and select Applications Multimedia RealPlayer 10. After you do this,
    the RealPlayer Setup Assistant will appear (Figure 14-27).'
  merge: -1
