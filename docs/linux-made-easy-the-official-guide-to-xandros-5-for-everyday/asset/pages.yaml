  md: '# 3A-2: Setting Up a Desktop Slideshow


    A very cool feature in KDE is the ability to have your desktop wallpapers automatically
    change every few minutes (or even seconds). This feature, like available in Mac
    OS X Panther, will come in handy once you''ve finished Chapter 11 and have downloaded
    images from your digital camera, because your desktop can become a dynamic photo
    album that you can view all the time you are working at your computer—all fun
    and pleasant, unless, of course, your computer is loaded with pictures of your
    ex. Oops!


    To set things, open the configuration window as you did in 3A-1 (right-click the
    desktop and select *Properties*), and then select *Slide Show* in the Background
    section of that window. The *Setup* button will become active, so Slide Show window
    (Figure 3-5) appears.


    ![](img/855e727a697c289d306bb0e488065e20_58_0.png)


    Figure 3-5: Setting up a desktop slideshow


    To start setting up your desktop slideshow, you first need to decide which pictures
    to include. These can consist of your own images, wallpapers you have downloaded,
    the wallpapers that come with your Xandros system, or any combination thereof.
    To get started selecting, click **Add**. Once you''ve done this, the Select Wallpaper
    window (which you saw in Figure 3-3) will appear. Find an image to add to your
    slideshow, and click **OK**. The image you selected will then appear in the big
    box in the Setup Show window. You can now go on and repeat the process for all
    the other images you want to add.


    In the setup window, you can also decide how often you want your desktop images
    to change by adjusting the numbers in the box next to the words *Change picture
    after*. You can also set the order in which an image will appear by selecting
    it and clicking the **Move Up** or **Move Down** buttons at the right side of
    the window. If you prefer, you can also have the images appear randomly by selecting
    the box next to the words *Show pictures in random order*.


    # The Panel


    Now that we''ve covered all there is about the main part of the desktop, let''s
    move on to the next major desktop component, the Panel (Figure 3-6), which is
    located at the very bottom of your screen. You will notice that the'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Panel holds a number of items. Some of these are program launchers that allow
    you to start up a program with a single mouse click, while others are utilities
    of one sort or another. To fill in you on what each of these items is for, I''ll
    give you the blow-by-blows here, covering the items from left to right.


    ![](img/855e727a697c289d306bb0e488065e20_59_0.png)


    Figure 3-6: The Panel


    # Launch


    Clicking this brings up the Launch menu, which is the access point for the majority
    of your applications and for your preferences, settings, and other configuration
    tools. I will discuss this a bit more near the end of the chapter.


    # Thunderbird


    Your email application, which is Mozilla''s latest answer to Outlook Express.
    (Looks like an envelope being held by a blue thunderbird.)


    # Firefox


    Your web browser. Essentially, it''s Netscape with a difference or two. (Looks
    like an orange fox wrapped around the earth.)


    # Xandros File Manager


    This launcher is a one-click alternative to the Home icon on your desktop. Clicking
    it launches a Xandros File Manager window, opened to your Home folder. From that
    folder, you can access your files, view the contents of other drives, or mount
    other computers on your network. (Likes a small file cabinet.)


    # Help


    Provides information on using the various features and applications of your Xandros
    system. It is not the same as the First Start Guide on your desktop. (Likes like
    a life preserver.)


    # Show Desktop


    Clicking this hides all windows, allowing you to see the desktop itself. Very,
    very handy. (Looks like a pencil and sheet of paper on a blue square.)


    # The Taskbar


    The taskbar is essentially invisible if you do not have any windows open. When
    you have windows open, rectangular icons for each window appear here, just as
    they do in Windows.


    # Pager/Virtual Desktops


    An application that allows you to switch between virtual desktops (I discuss this
    in Chapter 4). (Likes like a pair of squares, one blue and one green, labelled
    1 and 2.)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# KLaptor


    An application that appears if you''re using a laptop computer. It allows you
    to check the status of your batteries and adjust relevant settings. (Looks like
    an electrical plug next to a battery.)


    # Sound Mixer


    A control that allows you to adjust the overall volume of your system. (Looks
    like a small speaker.)


    # Xandros Update


    An application that periodically checks with Xandros Networks for the availability
    of system updates. (Looks like a small globe, most likely with an exclamation
    mark in a small square.)


    # Lock/Logout


    A pair of buttons with you can log out (right button—looks like a power button)
    or lock your screen (left button—looks like a lock). Locking your screen is a
    handy means of keeping other people''s noses out of your business while you sneak
    away from your desk to get a cup of coffee. When you click the Lock Screen, Xandros
    will run a screen saver (or just black your screen if no saver is selected). To
    use your system, just move the mouse or press any key and Xandros will prompt
    you for your user password. Once you input the password, the screen saver will
    disappear, and you can get back to work or whatever else you were doing.


    # Switch User (not shown)


    This button, which shows two people standing, appears only on systems whose video
    card drivers support it. It allows you to switch between user sessions without
    having to quit running applications. A sort of logout without really logging out.


    # Clock


    The obligatory and ubiquitous desktop clock and calendar.


    # Hide/Show Panel


    Click this button to hide or show the Panel. (Looks like a small arrow.)


    # Project 3B: Customizing the Panel


    The Panel is not a static thing. You can add launchers (program shortcuts or aliases),
    utilities, and even amusements to make it do almost anything you want to, within
    limits, of course. In the various stages of this project, you will customize your
    Panel to make it convenient for you as you make your way through the rest of this
    book. You are of, free to change any of the customizations I ask you to make,
    or to just pick those that are of interest to you, but I''d suggest performing
    at least a few of them so that you get a feel for them.


    Each of the following subprojects is very simple. Most are point-and-click procedures
    that you should be able to handle without any difficulty.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 3B-1: Deleting Launcher from the Panel


    Deleting items from the Panel is a very simple procedure. A good candidate to
    work with is the Help Center launcher, because it also appears in the Launch menu
    and is an extra copy. Freeing up Panel space will make room for other items to
    your liking that you may want to add.

    To delete the Help Center launcher, here is all you have to do:


    +   1. Right-click the Help Center launcher in the Panel.

    2. From the pop-up menu, select Remove Help Button.


    # 3B-2: Adding a Launcher to the Panel


    Now that you have an empty space left behind from where the Help button used to
    be, fill it in with something useful. A good candidate would be the Calculator,
    which everyone needs to use at one time or another.

    Here’s how to add the launcher:


    +   1. Right-click the open space left behind after removing the Help button.

    2. From the pop-up menu, select Add Application Button > Applications > Accessories
    > Calculator.


    # 3B-3: Adding a Menu to the Panel


    You can add menus to the Panel as well as application launchers. A good choice
    would be the OpenOffice.org menu, because most people use these applications frequently.

    Here’s what to do add the menu:


    +   1. Right-click the open space to the right of the Calculator launcher you’ve
    just added.

    2. From the pop-up menu, select Add Application Button > Applications > OpenOffice.org
    > Add This Menu. Be sure to select Add This Menu in the very last submenu that
    appears, as shown in Figure 3-7.


    ![](img/855e727a697c289d306bb0e488065e20_61_0.png)


    Figure 3-7: Adding the OpenOffice.org menu to the Panel'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 3B-4: Moving Items Within the Panel


    When the OpenOffice.org menu button that you added to the Panel in subproject
    3-3 appears, it will most likely be located far from the other application launchers
    that are at the left side of the Panel. Having the menu over there with the others
    would be the most logical arrangement, so in this part of our project we are going
    to do some moving.


    Here''s what you do to move the menu button:


    +   1. Right-click the OpenOffice.org menu button (or any other Panel item you
    want to move that won''t move by dragging alone).

    2. From the pop-up menu, select Move OpenOffice.org (or whatever the name of the
    item you are trying to move).

    3. Your cursor will now look like an arrowhead-tipped cross. Without holding down
    either button, move the mouse to the location where you would like to place the
    menu button—in this case, just to the right of the Calculator launcher. The menu
    button will follow along.

    4. When the menu button is where you want it to be, click the left mouse button,
    and you''ll be done.


    # 3B-5: Adding a Quick Browser for Your Home Folder to the Panel


    In addition to application launchers and menus, you can also add Special Buttons
    to the Panel. The Launch and Show desktop buttons are examples of these Special
    Buttons. A very handy Special Button you might want to consider is a Quick Browser.
    A Quick Browser allows you to view the contents of any folder you specify, in
    menu form, from the Panel. A logical and convenient choice for this project would
    be a Quick Browser for your Home folder, an example of which you can see in Figure
    3-8.


    Here''s what you need to do to add a Quick Browser for your Home folder:


    +   1. Right-click any open space in the Panel.

    2. In the pop-up menu, select Add ► Special Button ► Quick Browser.

    3. The Quick Browser Configuration window will now appear. The path in the text
    next to the Path will be /home/your_username (mine, for example, /home/rg). Click
    OK.


    # 3B-6: Adding a Weather Monitor to the Panel


    In addition to application launchers and menus, you can also add miniprograms
    (called applets) to the Panel. Each of these applets performs a specific function,
    usually adding a bit of convenience to your desktop in the process. The applets
    at your immediate disposal include an in-panel-configuration tool, a dictionary
    lookup box (discussed in Chapter 13), and the Clock, which is already present
    in the Panel by default. The most popular applets, however, is the weather monitor,
    called KWeather.'
