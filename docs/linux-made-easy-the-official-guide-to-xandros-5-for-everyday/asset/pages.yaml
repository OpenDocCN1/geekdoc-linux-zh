  md: '# Finding Out More About Fish Fillets—the Next Generation


    If you would like to find out more about Fillets NG and game-playing rules, go
    to the project site http://fillets.sourceforge.net, and click the How to Play
    link at the left side of the page for more details. You can also access the same
    information right on your computer by digging through the data folder placed within
    the Fillets folder. Just double-click the folder within data, the html folder
    within that, and finally detailed rules for playing the game will appear in your
    web browser. You do not have to be online if you take this approach.


    # Even More Games In Store


    In addition to the games I have mentioned thus far in this chapter, there are
    still many more available via Xandros Networks (Debian Unsupported Site repository).
    These include clones of old arcade classics as Burgerspace (run around making
    hamburgers while avoiding the roaming weennies) and Pingus (Figure 18-25), in
    which you must try to save the hundreds of cute penguins that appear on-screen
    from falling over cliffs and so on. Blobwars and Tuxpack are more games that might
    be worth checking out if you are a arcade game lover.


    ![](img/855e727a697c289d306bb0e488065e20_404_0.png)


    Figure 18-25: Pingus


    If arcade games aren''t really your cup of tea, you might want to try Flight Gear,
    a very attractive flight simulator (fgts is the command you need in order to run
    it), GNU/Chess or 3D Chess (run command=3Dc) if you''re a chess lover, or even
    the Xshogi/GNUshogi combo (yes, you need to install all of them; run command =
    xshogi or Coban if you are a fan of the Japanese board game shogi and go. They
    are, of course, many, many others. Enjoy the search.


    Chapter 18'
  merge: -1
