    # Changing Your dial-up Connection Settings from Pulse to Tone Dialing


    There are two ways in which telephones transmit the numbers you dial when

    you try to call someone. The most common these days is tone dialing, which

    transmits the phone number you dial by means of tones. When you frequently

    dial a certain number, you have probably noticed that the number seems to

    a distinct tune, which in fact it does. You might even have caught a

    mismatial at times when dialing a number because the phone for that

    number sounded wrong.


    The other, increasingly less common, phone number transmission pro-

    col is pulsing, which transmits the phone number you dial by means of

    pulse, one pulse for a 1, two pulses for a 2, and so on. If you have pulse dialing

    on your line, you will probably know it, because you can hear the pulses, or

    licks, when you dial.


    When you set up an Internet dial-up connection via the Connection

    Wizard, which are automatically set up for tone dialing. If you happen to

    have a line that requires pulse dialing, you will have to make a simple modi-

    dification. To do this, open the Connect to the Internet window (Launch

    Applications > Internet > Connect to the Internet), and then click the Properties

    button. When the Properties window appears, then click the Protocol and

    Hardware tab, and then click the Properties button in that.


    In that Properties window, click the Commands tab, and then click directly

    on the word ATDT (to the right of Dial). The area directly surrounding the

    word will transform into a text-input box, as you can see in Figure 4-8.

    In that box, change the current entry, ATDT, to ATDP (the last letter in

    "ATDT" is E for tone or P for pulse), and then click OK in both of

    the open windows. After that, you''ll be ready to go.


    # Connecting and Disconnecting Dial-up Connections


    To connected to the Internet via your dial-up connection, go to the

    Launch menu and select Applications > Internet > Connect to the Internet.

    After double-checking that your modem is (if it is an external modem),'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'click Connect when the Connect to the Internet window appears. A small window,
    Figure 4-9, will then appear and show you what''s going on while your modem goes
    through its dreadful routine of spitting, hissing, churning noises until you are
    finally up, running, and to surf. You will know that you have established an Internet
    connection when your Connect to the Internet window automatically minimizes. It
    will continue to be accessible in the Panel.


    ![](img/855e727a697c289d306bb0e488065e20_79_0.png)


    Figure 4-8: Changing your dial-up connection settings from tone to pulse dialing


    ![](img/855e727a697c289d306bb0e488065e20_79_1.png)


    Figure 4-9: The Connect to the Internet window shows what''s going on as it tries
    to connect


    Once you are done surfing around, you can disconnect from the Internet quite easily
    by clicking on the minimized Connect to the Internet window in the Panel and then,
    when the window bloats back up to its original size, clicking Disconnect. You
    can then click Quit in the Connect to Internet window to finish things off.


