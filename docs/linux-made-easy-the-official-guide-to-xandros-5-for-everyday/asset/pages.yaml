  md: '# #6


    # ## PORTS OF CALL

    Working with Floppies, CDs, DVDs, and Other Removable Media


    ![](img/855e727a697c289d306bb0e488065e20_107_0.png)


    While the multi-gigabyte hard drives that almost all computers have today allow
    you to store what seems like an infinite number of files, there may be times when
    you want to back up those files or give them to others. In fact, many of the files
    you have on your hard disk are not files you created on your computer, such as
    word processing files, but actually came from outside sources. After all, you
    probably have a good many digital photos you''ve received from friends or email
    attachments; word processing or spreadsheet documents that you unfortunately received
    from work (also most likely by email); and PDF files, fonts, and even applications
    that you''ve downloaded from the Internet.


    While most file transfers these days are done via the Internet, it was not too
    long ago that the main way to transport files from computer was by floppy disk,
    which was also how many average users went about backing up their hard disks.
    Needless to say, this was a much slower and more cumbersome way of going about
    things. Still, despite our newfound love of digital spontaneity, hard storage
    media types have not'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'gone the way of the dodo, great auk, and Carolina parakeet. In fact, not only
    do they continue to be used, but the range of removable storage media available
    to us has actually expanded to include Zip disks, DVDs, and, more recently, USB
    hard disks, flash drives, and memory readers.


    Given the diverse ways in which people use their computers today, being able to
    use these various forms of hard storage media has become more or less essential.
    Whether it be for importing photos from your camera, listening to music and watching
    movies on your computer, or just backing up the valuable items you have stored
    on your hard disk, you will eventually have to deal with at least some of the
    various forms of hard media available in the computer world today.


    Fortunately, the Xandros File Manager makes this quite as easy as a sort of sorts
    (the hinge of this title—a stretch, I know), from which you can easily load and
    unload data to the various media that drop anchor at your machine. Whether you
    insert floppy disks, CDs, or DVDs in their respective drives or connect any other
    storage device to your USB ports, you will be able to access these media via the
    Xandros File Manager.


    # # Floppies


    When the original Macintosh computer came out, one of the coolest things about
    it was that it used 3.5-inch floppy disks (also known as floppies). At the time,
    I thought that those disks, with their hard casing and sliding doors protecting
    the media itself, were the incarnation of high-tech cool. Times of change, of
    course, and there are fewer and fewer people using these days.


    The reason for this change is simple: files have just gotten too big for floppies.
    The audio, video, and image files are gigantic. You''d be lucky, for example,
    to find more than three digital photos on one floppy disk. Compared to CDs, Zip
    disks, memory cards, and the like, floppy are are too slow. You would practically
    feed the cat, make a cup of coffee, and read the first three pages of the newspaper
    in the time it takes to write a good number of files to a floppy. That''s an exaggeration,
    but floppies are slow when compared to the alternatives.


    Despite being small and slow, they are still used by a dwindling number of people
    who have no other way of transferring files to removable media, or who just to
    hand over one or two small word processing documents to another person who can
    read no other type of media. You may be one of these people, or you may have to
    send files to or receive them from someone in this situation.


    # # Writing to and Copying from Disk


    Using floppies on your system is easy enough: just insert the floppy into your
    drive, open XFM, and then click the Floppy icon near the file tree in the left
    pane of the window. The contents of the floppy will appear in the right pane.
    To copy, add, or remove files to or from the floppy, use the'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'various methods I described in Chapter 5, and immediately the data will be
    written to (or removed from) the disk. When you have finished, eject the floppy
    manually.


    **NOTE** When you remove a floppy from the drive, the files displayed in the right
    pane of the XFM window remain. This is a temporary state of affairs, however,
    don''t worry. Just click any other folder in the file tree until the contents
    of that folder are displayed in the right pane. After that, just click the Floppy
    icon in the file tree again, and the files previously displayed there will be
    gone.


    # Formatting Floppies


    Before you can actually write anything to a disk, that disk must be formatted.
    This is true of any kind of storage media—your hard disk, CDs, storage cards in
    your digital camera, or floppy disks—though it is sometimes done before you bought
    the media. By formatting a disk, your system (or you request) lays down a sort
    map on the disk that specifies where data can be stored.


    **NOTE** Because there are, and have been, many operating systems, there are many
    such formats for floppy disks. Linux can read both Linux-native ext2 formatted
    disks and Windows/DOS FAT disks. It can also create each format.


    Most floppy disks these days are sold preformatted in DOS format, so you probably
    don''t have to worry much about this; however, if you need to format an unformatted
    floppy disk, or an already used one from which to erase all the data, the process
    is simple.


    +   1. Insert the floppy into its drive, and open the Xandros File Manager. Click
    the **Floppy** icon in the file tree of that window, and then click the words
    **Format Floppy** at the left side of the right pane of the window. A Floppy Disk
    Formatter window should appear, as shown in Figure 6-1.


    ![](img/855e727a697c289d306bb0e488065e20_109_0.png)


    Figure 6-1: Formatting a floppy disk'
  merge: -1
  pgno: 109
- img_proc: true
  md: '+   2. In this window, you can specify the density, or capacity, of the floppy
    (1.44 MB or 720 KB), the file system type (ext2 or FAT), and the name for the
    disk. Once you have done so, begin formatting the floppy by clicking the Format
    button.


    +   3. A small window will appear asking if you sure you want to proceed. Click
    Continue and the formatting process will begin, with its progress indicated at
    the bottom of the Floppy Disk Formatter window.


    +   4. When the process is complete, another window will appear telling you so.
    Just click OK in that window, and the process will be complete.


    # Reading Data CDs or DVDs


    To read a CD or DVD with data on it (images, files, or programs) rather than music,
    play the disc in your CD or DVD drive. A Xandros File Manager window would automatically
    open and display the contents of the disc. You can then copy the files on the
    CD or DVD to your hard disk using the copy-and-paste or drag-and-drop methods
    described in Chapter 5.


    > NOTE As I mentioned in Chapter 5, any file that you copy from CD or DVD to your
    hard disk will be write-protected, so you will have to change its permissions
    if you want to alter it. To do so, right-click the file, select Properties in
    the pop-up window, and click the Permissions tab in the Properties window and
    change the permissions.


    When you have finished copying files from the CD or DVD, you can eject it by right-clicking
    the icon that says DVD-ROM or CD-RW and selecting Eject Disk in the pop-up menu.


    # Playing Music CDs


    To play a music CD, insert it into your drive; the Kscd player (shown in Figure
    6-2) should open automatically and begin playing it. You should also see a small
    applet in the Panel that looks like a small CD with a pair of quarter notes on
    it (also shown in Figure 6-2), which you can use to hide or show the player and
    control its basic functions. If you are connected to the Internet and playing
    a commercial audio CD, Kscd will only query an online database (freedb.org) in
    order to gather album and track titles, which will then display in the player
    window.


    When you have finished playing your CD, you can eject it by clicking the Eject
    button in the player window or by right-clicking the Panel applet and selecting
    Eject in the pop-up menu.


    > NOTE Closing the Kscd player window does not also close the Panel applet. To
    do so, right-click the applet, and select Quit in the pop-up menu. Doing this
    without first closing the player window will accomplish both tasks in one step.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_111_0.png)


    # # Playing DVD and VCD Videos


    If you have a DVD drive, Xandros can also play unencrypted DVDs via its bundled
    video playback software, Xine (Figure 6-3). Xine can also play VCDs (video compact
    discs), which are movies recorded on specially formatted CDs that can be played
    in DVD or VCD drives. VCDs are inferior to DVDs in terms of image quality, but
    they are much cheaper. Because they are popular mainly in China (especially Hong
    Kong) and a few other countries, however, you might not come across many of them
    unless you happen to love more obscure Chinese movies or Canto-pop karaoke. Still,
    if you do run across any, you will be pleased to know that you can play them.


    ![](img/855e727a697c289d306bb0e488065e20_111_1.png)'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'Because Xine is covered separately in Chapter 14, I won''t mention any more
    about it here. If you just can''t wait to watch your copy of A Red Detachment
    of Women though, feel free to jump ahead; otherwise, just hang there for now.


    # CD-RW Drives


    These days, it seems that almost all computers have built-in CD-RW (CD-rewritable)
    drives. They work just like CD-ROM drives in that they allow you to read data
    or play music from CDs. They also allow you to burn data to blank CDs. If you
    don''t have a CD-RW drive in your machine, I would strongly recommend you getting
    one. Drives for desktop machines are relatively cheap ($40 or less) and are easily
    installed.


    If your storage needs are greater than what can be handled by a CD, consider installing
    a DVD burner, in addition to reading and burning CDs can also read and burn DVDs,
    which have upwards of seven times the capacity of CDs.


    # Burning Data CDs and DVDs


    Burning data CDs and DVDs is easily handled in the Xandros File Manager''s DVD
    Writer (or CD Writer, depending on what kind of drive you have). In fact, burning
    these discs in Xandros is probably an easier, or at least straightforward, process
    than it is in other operating systems or even many other Linux distributions.


    > NOTE One limitation of the Xandros Open Circulation Edition (the one that comes
    with this book) is that it limits you to 2X CD burning speed and does not allow
    DVD burning. The DVD Writer in the file tree in the left pane of the XFM window
    will then be captioned CD Writer if you happen to have a DVD burner installed
    on your machine. You can have full-speed CD and DVD burning by upgrading to any
    other version of Xandros.


    # Setting Up the Files You Want to Burn to a CD or DVD


    Your first step is to select the files you want to burn to disc. The files you
    gather together for this purpose are referred to as a Project.


    To start with your project, open XFM and click the DVD Writer or CD Writer (depending
    on the hardware you happen to have) icon in the left pane of the window. The disc-burning
    options will appear in the right pane of the XFM window (Figure 6-4).


    Click Create data disc. The right pane of the window should look like the right
    side of Figure 6-5. Next, drag or paste the files you want to burn to that pane.'
