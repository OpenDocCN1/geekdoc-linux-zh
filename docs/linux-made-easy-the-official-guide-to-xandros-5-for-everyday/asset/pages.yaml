  md: '# Project 19A: KGeography


    It just wouldn''t be right for me to finish up a chapter on applications for children
    without including one that concerned geography. After all


    Nevertheless, KGeography is a pretty cool application that drills your children
    not only on map identification and U.S. and world capitals but also on the flags
    of the many nations of our modern world (Figure 19-16).


    ![](img/855e727a697c289d306bb0e488065e20_419_0.png)


    Figure 19-16: Learning the flags of the world with KGeography


    Who knows, maybe your child is a budding geographer or vexillologist—a seldom-known
    word for someone who studies flags. KGeography will help her find out.


    KGeography is not available from any of the Xandros Networks repositories, so
    you will have to download it on your own. However, because it comes in the form
    of a Debian package (.deb file), it can be installed by means of the Xandros Networks
    application. Note that Xandros does not support or guarantee applications you
    install this, so don''t go screaming to them if anything goes wrong. I have used
    KGeography on my system, found no problems, so you should be alright. Still, if
    anything goes wrong in your case, don''t come screaming to me either. You are
    strictly on your own in regard to any screaming you wish to do, should it come
    to that.


    # 19A-1: Downloading KGeography


    You can download KGeography by clicking the Debian – KGeography 0.3 link on the
    project home page at http://kge.berlios.org/download.html. When the list of available
    downloads appears on the next page, click the kgeography_0.2-1_i386.deb link (version
    0.3 doesn''t actually seem to work), and the download will begin.'
