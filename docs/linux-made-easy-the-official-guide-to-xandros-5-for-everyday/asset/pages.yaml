  md: '# Controls


    For a single-player game, the Pac-Man-esque chomper, as I call it, is controlled
    by your keyboard cursor keys. When one of your chompers dies, you can get back
    into the action by pressing the SPACEBAR. When your last chomper dies, the stats
    page will automatically appear, showing your points for the game. If you then
    press the SPACEBAR, you can type in your name to include it in the high-scores
    list (assuming your score is high enough to make it). After that, you will be
    back at the main menu screen, from which you can decide what to do.


    While you can quit Njam by selecting Exit in the menu screen and pressing ENTER,
    you can also accomplish the same thing by pressing the ESC key as many times as
    needed, the number of presses necessary depending on the screen you are in at
    the time, until the game closes.


    # Game Modes


    As you can see in the Njam menu (Figure 18-19), there are essentially four game
    modes to choose from: single-player, two-player cooperative, two-player duel,
    and two-player network duel. While you can easily figure out what single-player
    mode is all about, you may be wondering what the difference between a two-player
    cooperative game and a two-player duel. I will fill you in so as not to leave
    you in the dark.


    Both the cooperative games and the duels are played with two players at one keyboard
    operating two chompers. The first player controls his or her yellow chomper with
    the cursor keys, while the second player operates his or green chomper with the
    R, D, F, and G keys. As long as neither player is extremely broad-shouldered,
    this arrangement should work well enough, and the close physical proximity of
    players could even work out to be quite advantageous in some circumstances, if
    you catch your drift.


    The duels are simple enough to understand: one player tries to beat the other
    by winning four games. A game is won by getting the most points, which, with two
    players maneuvering the same keyboard, can be quite exciting (with out the unethical
    use of elbows, though). Cooperative games, on the other hand, are quite a different
    thing, though equally simple to understand. They are essentially the same as single-player
    games, albeit with two players (and two chompers) working together to get the
    same job done. Something to be learned in that, I suppose.


    # Skins


    A nice feature of Njam is the fact that it allows you to change the look of the
    various game elements using the use of skins, which are alternative sets (like
    the themes for your web browser, Firefox) that give Njam a new appearance.


    These skins, shown in Figure 18-20, can be selected by going to the opening menu.
    In that screen, just use your cursor keys to move down to Options, and then press
    ENTER. This will bring you to the Options menu, where you will again use your
    cursor keys to move down to Skin.'
  merge: -1
  pgno: 399
