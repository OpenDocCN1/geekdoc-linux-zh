- img_proc: true
  md: '# Configuring User Accounts


    In Project 7A, you learned how to set up additional user accounts, a pretty easy
    endeavor, all there are, however, a few settings you can apply to these user accounts
    that might be of interest to you. In order to access these features, you must
    first open the User Accounts module by clicking System Administration in the left
    pane of the Control Center window, and then clicking User Manager. When the User
    Manager module appears in the right pane of the window, click the Administrator
    button at the bottom of the window, and then supply your root password when prompted
    to do so. You will then be ready to perform either of the changes I will now describe.


    # Setting Login Availability


    One of these settings that you might find handy is limiting the time and/or days
    that a user can log in to the system. For example, let''s say you don''t want
    your kids playing around with the computer when you are at work or when they should
    be doing their homework . . . playing outside to get some exercise.


    To set things up in this way, just follow these steps:


    +   1. Select the username of the user for whom you wish to limit access in the
    User Manager module (by clicking on that user''s name once), and then click Properties.


    Figure 7: Enabling auto-login


    ![](img/855e727a697c289d306bb0e488065e20_140_0.png)


    114 Chapter 7'
  merge: -1
  pgno: 140
- img_proc: true
  md: '2. In the User Properties window that appears, click the Account tab.

    3. Once in that tab, click the checkbox next to the words Only allow user to login
    between.

    4. Now set the times and days that you want in the question to have access to
    your computer. When done, your window should look something like that in Figure
    7-19.


    ![](img/855e727a697c289d306bb0e488065e20_141_0.png)


    **Figure 7-19:** Changing user-access privileges


    5. Once you have finished, click OK to close that window, and then click Apply
    in the Control Center window.


    # Locking an Account


    You can also lock an account, prohibiting a given user from accessing your computer
    until you wish to allow them to use it again. For example, you might want to make
    sure that your daughter finishes that essay is due next week, and so until you
    don''t want her to be playing around on the Internet. You can block her account
    from the same Account tab mentioned in the previous section. Click her username
    before opening the User Properties window, and then click the checkbox next to
    the words Lock User Account. Of course, when you are ready to provide access again,
    just uncheck the box, and all will be back to normal.


    # Dual-Booters: Changing the Default Operating System on Boot-Up


    If you have a Xandros/Windows dual-boot setup, you no doubt already know when
    you start up your machine, you are given the choice of operating system to boot
    up. The default system in such a setup is Xandros, which means that if you make
    no choice at the time, your machine will automatically-boot up into Xandros, but
    you will have to use your cursor and ENTER keys to select Windows.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'If you would prefer to have Windows as the default boot-up system, you can
    do so in the Control Center window by following these steps:


    +   1. Click **System Administration** in the left pane of the Control Center
    window.


    +   2. In the subcategories that appear below System Administration, select **Boot
    Manager.**


    +   3. When the Boot Manager module appears in the right pane of the window, click
    the **Administrator** button at the bottom of the window, type your root password
    when prompted to do so, and then click **OK** in that password window.


    +   4. Once in root mode, click the drop-down menu button next to *Default operating
    system* (the button itself will be showing the version of Xandros you are using,
    such as Xandros Desktop 3.0.1 OC), and then select the version of Windows you
    are using in the drop-down menu


    ![](img/855e727a697c289d306bb0e488065e20_142_0.png)


    **Figure 7-20:** Changing the default operating system in dual-boot setups


    +   5. If you would also like to decrease the default auto boot-up time (the time
    before the system automatically boots up when you are doing nothing—the default
    is 30), adjust the numbers in the box to the right of the words *Automatically
    start default operating system after.*


    +   6. Once you have finished making the changes, click the **Apply** button,
    and then quit the Control Center.


    The next time you start up your machine, you will, as usual, see the boot-up screen;
    however, if you do not manually select Xandros at that time, your machine will
    automatically boot up into Windows.'
