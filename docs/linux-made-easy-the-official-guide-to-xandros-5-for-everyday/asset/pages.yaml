  md: '# Project 3A: Changing Your Desktop Wallpaper


    The background of your Xandros desktop is decorated with a rather hand-image with
    the look of cool-blue brushed steel. If so inclined, you can replace that background
    image, often somewhat peculiarly referred to as a wallpaper with any picture of
    your choice. You can choose one of the other wallpapers that come with your Xandros
    system or a photo you''ve downloaded from your digital camera.


    You can also download desktop wallpapers from the Internet. Check http://art.gnome.org
    and kde-look.org have lots of wallpapers available, as many other sites. If you
    are interested in cars, many of the major automobile manufacturers (Ford Canada
    and Saturn, for example) have wallpapers of their latest models available for
    download. Many music and film star fans are free with wallpapers too.


    # 3A-1: Changing Wallpapers


    To change the wallpaper on your desktop, start out by right-clicking any open
    space on the desktop and selecting Properties in the pop-up menu then appears.
    A configuration window will appear.


    To choose one of the wallpapers that bundles with your system, click the drop-down
    menu button next to the word Picture in the Background section of the window (the
    button itself will say XandrosBlue the first time around). A menu will appear
    that lists all of the wallpapers available for you to choose from (Figure 3-2).
    Select one, then click Apply. The wallpaper selected then appears on your desktop.
    Give this a try with a few of the other wallpapers in the list until you find
    one that suits your fancy. When done, press OK.


    ![](img/855e727a697c289d306bb0e488065e20_56_0.png)


    Figure 3-2: Changing desktop wallpapers


    30 Chapter 3'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'If you would like to use one of your own photos instead, as I do on my own
    desktop (Figure 3-3), or a wallpaper you downloaded yourself, the process is slightly
    different. Rather than clicking the drop-down menu button next to the word Picture
    in the configuration window, click the little button with a picture of a half-opened
    folder. A Select Wallpaper window (Figure 3-3) will appear.


    ![](img/855e727a697c289d306bb0e488065e20_57_0.png)


    Figure 3-3: Choosing an image of your own as your desktop wallpaper


    In this window, click Home in the left pane of the window, and then find the image
    you want to use in the right pane. Once you have located, select it by clicking
    it, and then click OK. The Select Wallpaper window will then close, leaving you
    with the original configuration window (Figure 3-2). In that window, click Apply.
    The image you selects is now displayed on the desktop (Figure 3-4). If you are
    satisfied with the results, click OK; if not, try again.


    ![](img/855e727a697c289d306bb0e488065e20_57_1.png)


    Figure 3-4: Your own image (my own, in this case) displayed on the desktop'
