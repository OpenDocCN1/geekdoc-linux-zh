    **Figure 11-11:** Viewing your images at an enlarged size


    To see the image at a yet greater size, either click the maximize button in the
    three-button cluster located at the top-right corner of the window—it’s one in
    the middle—or just tug one of the corners of the window with your mouse until
    it is the size you want. The image will then automatically enlarge. You can also
    easily see the other pictures in your album via window by clicking the left or
    right arrow just beneath the menu bar.


    # Project 11B: Fine-Tuning Your Images


    Digikam is fairly versatile little program that not only lets you download and
    display your images but also allows you to fine-tune them. With Digikam you can
    rotate, resize, crop, and sharpen your images; adjust their brightness and contrast;
    and reduce-edge, although the flash units in most digital cameras today might
    eliminate the need for this feature. Digikam also allows you to transform your
    color photos into black-and-white or, for a taste of faux nostalgia, sepia tones.
    All very cool, assuming you go for that kind of stuff. If you do, most of these
    manipulation features can be found in the Fix, Transform, and Filter menus of
    Digikam’s enlarged-windows that we discussed in Project 11A-4.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'If you''re curious about how to perform some of these basic digital darkroom
    transformations but don''t know where to start, here is a project that can give
    you some hands-on experience. I''ll be covering the most common of these: rotation,
    cropping, and brightness and contrast adjustments.


    # 11B-1: Rotating Your Images


    The basic transformation you can perform, and at some point it is one that almost
    everyone needs, is rotation. After all, viewing an upright image sideways is a
    pretty annoying thing to do, all things considered. Fortunately, rotating an image
    is very easy. Here are the steps:


    +   1. In the main Digikam window, double-click an image that you want to rotate.


    +   2. After the image appears in its own window, go to the Transform menu and
    select Rotate.


    +   3. In the menu that pops out, select the number of degrees to rotate the image
    (90° if the image is lying on its left side, 180° if the image is upside down,
    or 270° if the image is lying on its right side). Once you release the mouse button,
    the image will have rotated to the correct orientation, as you can see in the
    before-and-after images in Figure 12.


    ![](img/855e727a697c289d306bb0e488065e20_208_0.png)


    Figure 11-12: Sample image before and after rotation


    +   4. Once you have finished, go to the File menu and select Save. If you prefer
    to keep a copy of the original in its unrotated state, select Save As instead,
    and then give the file a new name—but be sure to keep the original file extension.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 11B-2: Free Rotation


    In some cases, the problem with your image is not that it is sideways rather than
    upright (or vice versa), but rather that it looks somewhat cockeyeed—a common
    problem with photos I take. Figure 11-13 is a good example: an off-kilter horizon,
    which really ruins what is an otherwise okay picture.


    ![](img/855e727a697c289d306bb0e488065e20_209_0.png)


    Figure 11-13: An otherwise fine image spoiled by an off-kilter photographer


    To salvage this shot from the uninvited-criticism bin, we can use Digikam’s free-rotation
    feature. If you have a similarly affected image, follow these steps to get things
    on an even keel:


    As with all editing procedures, first double-click the target image in order to
    open it in its own window.


    +   Once the window opens, goes to the Transform menu and select Free rotation
    in the drop-down menu. A small window, Rotate Image (Figure 11-14), will then
    appear.


    ![](img/855e727a697c289d306bb0e488065e20_209_1.png)


    Figure 11-14: Free rotation settings


    +   In that window, use the slider or the tiny up down arrow buttons to adjust
    the number of degrees you want to rotate the image (negative numbers rotate the
    image to the left, and positive numbers rotate to the right).


    +   Once you have selected your settings, click OK and the image will, after a
    second or so, rotate.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '5. If the results are not to your satisfaction, go to the File menu, select
    Revert to get things back to the way they were originally, and then rotating the
    picture again. As you can see, a little trial and error will most likely be necessary.


    6. Once the image is what you want it, go to the File menu and select Save or
    Save As, depending on whether or not you want to keep a copy of the original.
    Your image, allowing for differences in subject matter, should then look something
    like mine in Figure 11-15.


    ![](img/855e727a697c289d306bb0e488065e20_210_0.png)


    Figure 11-15: An off-kilter image rescued through free rotation


    # 11B-3: Cropping


    After looking at the image you''ve rotated, or the example in Figure 11-15, you
    will realize that your image will have a lot of weird, unsightly, and decidedly-off
    black space at its edges. Needless to say, unless you are having it there of a
    rather unique sense of aesthetics, that black space will have to go. For this
    chore you will need to do some cropping.

    To crop an image in Digikam, follow these steps:


    +   1. Place your mouse cursor in one of the corners of your image (avoiding the
    black space), press the mouse button, and drag the cursor until it reaches the
    diagonally opposite corner and you have created a rectangle within the picture
    portion of the image.


    +   2. When you have finished, release the mouse button, and then everything outside
    of the rectangle will darken, as you can see in Figure 11-16.

    The bright area within the rectangle is what will be left of your image when you
    have finished the cropping process, while the darkened area outside the rectangle
    is what will be cropped. That being the case, if you have any black space remaining
    that still needs to be removed, try'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'selecting the cropping area again. Just click anywhere in the image to deselect
    the area you''ve already selected, and then select the rectangular area you want
    again. This is also a good chance to do some after-the-fact adjustments in terms
    of composition.


    ![](img/855e727a697c289d306bb0e488065e20_211_0.png)


    **Figure 11-16:** Selecting the area to crop


    Once the area you have selected is the way you want it to be, you are ready to
    take your digital scissors to your image and crop it.


    +   3. Go back to the **Transform** menu and select **Crop**. The image will almost
    immediately be reduced to the area you selected. My own results can be seen in
    Figure 11-17. Yours should be somewhat similar.


    ![](img/855e727a697c289d306bb0e488065e20_211_1.png)


    **Figure 11-17:** The improved final product after rotation and cropping


    +   4. If you are satisfied with the results, go to the **File** menu and select
    **Save** or **Save As**. If you still aren''t satisfied with what you''ve done,
    select **Revert** in the **File** menu and start over again.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# 11B-4: Brightness and Contrast


    Let''s wrap up our experiment by playing around with the brightness and contrast
    settings. You surely have taken many a picture that was either overexposed (too
    bright) or even more likely, underexposed (too dark). In the film-camera world,
    a trip to your local photo processor (with fingers crossed and a bit of luck)
    is the only way to deal with this problem after the fact. Fortunately, it is much
    easier to correct the problem with your digital images. To follow along with this
    part of the experiment, select an overexposed or an underexposed image that you''d
    like to improve. For my part, I''ll be working with the image in Figure 11-18.


    ![](img/855e727a697c289d306bb0e488065e20_212_0.png)


    Figure 11-18: Dealing with an underexposed image


    To correct the brightness of your digital image, here''s all you have to do:


    +   1. Double-click the image that you want to fix.

    2. Once the image opens up in its own window, go to the Fix menu and select Brightness/Contrast/Gamma.

    3. In the new window that appears, adjust the brightness and contrast of your
    picture by moving the appropriate slider (Figure 11-19).

    4. Once things are to your liking, click the OK button, and the changes will be
    visible in the original image window.

    5. If you are satisfied, save your changes by going to the File menu, and . .
    well, you know the drill by now.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_213_0.png)


    Figure 11-19: Adjusting the brightness and contrast of your image


    # # Tags


    Now that we''ve covered the basics of using Digikam with your camera and images,
    let''s wrap things up with an introduction to one more of Digikam''s interesting
    features: *tags*. In Project 11A, you set up Digikam to organize your images into
    albums, which are essentially folders in which your images are physically stored.
    Digikam, however, offers another way to organize things, in the form of tags,
    which are essentially category indicators that allow you to view certain groups
    of pictures together without having to move them physically on your hard disk.


    As an example, let''s say that you have a daughter (let''s call her "Colleen")
    whose pictures you have scattered throughout your various albums. By creating
    a "Colleen" tag and assigning that to each picture you have of her, you would
    then be able forever after, with just one or two clicks of the mouse, to see all
    of her pictures at the same time, though the location of those images on your
    hard disk would not have changed.


    You can also assign more than one tag to any picture, thus allowing a picture
    to appear in different category groupings. For example, you might want to include
    your pictures of Colleen with pictures of other members of the family by further
    assigning those pictures of her an additional "tag"'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Creating a Tag


    When you create a tag, you are actually creating a new category that you can assign
    to your photos. The default tags in Digikam are Events, People, and Places, which
    might be a bit too generic for your tastes or needs.

    to create your tag, follow these steps:


    +   1. From the Digikam main window, go to the Tag menu and select Tag. A new
    window will appear (Figure 11-20).


    ![](img/855e727a697c289d306bb0e488065e20_214_0.png)


    Figure 11-20: Creating your own tag


    +   2. In that window, name your tag by typing the appropriate text in the Title
    box.


    +   3. To give your tag an icon, click the blank square button next to the words
    Set icon.


    +   4. In the icon browser that appears, select an icon of your choice, and then
    click OK.


    +   5. The icon you choose will now appear in the Create Tag window. Assuming
    it does, click the OK button in that window to complete the process.


    # Assigning Tags to Your Photos


    Once you''ve created a tag or two of yours, you will have to assign them to your
    photos before you can reap any results or benefits. Here''s how to do it:


    +   1. Right-click a photo to which you want to assign a tag, and in the pop-up
    menu that appears select Assign Tag. Another submenu will then appear displaying
    the three default tags that come with Digikam and whatever tags you''ve created
    on your own, as you can see in Figure 11-21.


    +   2. To complete the task, select the tag you want to assign to the photo, and
    you are finished. Now repeat the process for any other photos you want to add
    to the same tag group.'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'Figure 11-21: Assigning a tag to your photo


    # # Viewing Your Images by Tagged Groupings


    Okay, so you have finished assigning tags to your photos and want to see the results.
    To do this, go to the left pane of the main Digikam window and click on the small
    black arrow next to the word *Tags.*


    A list of existing tags will appear. When you click any of these tags, the images
    with that tag will appear in the right pane of the window (Figure 11-22). Of course,
    no images will appear if you haven''t assigned the tag you clicked to any of your
    photos.


    ![](img/855e727a697c289d306bb0e488065e20_215_0.png)


    Figure 11-22: Viewing your images by tagged groupings'
  merge: -1
  pgno: 215
- img_proc: true
