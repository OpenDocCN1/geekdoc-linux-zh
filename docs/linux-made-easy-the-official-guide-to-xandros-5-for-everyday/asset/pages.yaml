  md: '# 18


    # TIME TO UNWIND


    Gaming


    ![](img/855e727a697c289d306bb0e488065e20_383_0.png)


    Many a person is loath to admit it, but games are a big attraction to almost every-one
    at the helm of a personal computer. Even those who deny being gamers often find
    themselves caught in the act of rapping off a quick round of solitaire between
    work projects. The popularity of games is even suggested by the fact that most
    Linux distributions come bundled with more games than any other type of application.
    Xandros, for example, with 11 games, and many others are available via Xandros
    Networks.


    Of course, unlike most other applications, games are tied to the user''s personality,
    and not everyone takes a fancy to the same game or even genre of game. For example,
    many people, especially in or from the Windows world, continue to love the game
    Minesweeper (Figure 18-1), while it is pure snoerville for me. although there
    are already many games included in your system, there are probably only two or
    three that will actually ever get played more than once or twice.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_384_0.png)


    **Figure 18-1:** Minesweeper


    Things being what they are, gamers and neo-gamers alike seem to be in a perpetual
    search for new games that will satisfy whatever it is that their gameplay side
    finds enticing. This no doubt explains why stores are so often filled with games
    for the Windows market. Fortunately for Linux users, while there are many games
    for sale, there are even more games that can be downloaded from the Internet for
    free, many of which are available via Xandros Networks.


    # **Taking Stock of What You’ve Got**


    As I already mentioned, your Xandros system comes bundled with 11 different games.
    A quick look through the **Launch** menu (**Applications ► Games**) will show
    that these are broken into four different categories: *Arcade, Board, Cards,*
    and *Strategy*. If you installed the mouse odometer, *kodo*, in Chapter 8, there
    will also be another category—*Toys*. Most of these games are variations on other
    well-known games that you may have played in the past and require no explanation.
    The only two exceptions are *Miniature Golf* (also known as *Kolf*) and *Atomic.


    # **Miniature Golf**


    Miniature Golf (Figure 18-2), as its name implies, is a miniature simulation-game.


    You can play it with any number of additional players, or you can have a run at
    the course solo, if you prefer. Conceptually, the game is easy to play, but setting
    it up stump you a bit the first time out.


    To start playing Miniature Golf, go to the **Game** menu and, a New Game window
    (Figure 18-3) will appear.


    The game is set up by default for two players, but you can add more players by
    clicking the **New Player** button. Once you have whatever number of players you’d
    like, name each of the players by typing their name or initials in the text boxes
    that say *Player 1*, *Player 2*, and if you would like to play the game alone,
    type your name or initials in the box that says *Player 1*, and then click the
    **Remove** button to the right of *Player 2*'
  merge: -1
  pgno: 384
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_385_0.png)


    Figure 18-2: Miniature Golf


    ![](img/855e727a697c289d306bb0e488065e20_385_1.png)


    Figure 18-3: Choosing the number of players for Miniature Golf


    Once you have chosen the number of players, you have to go on and pick your course,
    since the default is an essentially unplayable Create New. Here''s what you need
    to do:


    +   1. Click **Course** in the left pane of the New Game window.

    2. Select the course you want from the list in the right half of the window (Figure
    18-4).

    3. Finally, click the **OK** button, and you''ll be ready for action.


    Once you begin playing, it should all be simple enough to figure out, as it is
    pretty much the same as a regular game of miniature golf—just stroke your ball
    through the whole course, dealing with mounds, bumpers, traps, and ponds along
    the way, while trying to do so with few strokes as'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'possible. Just remember that the power of your stroke is determined by the
    duration of your mouse click—the longer you hold down the mouse button, the stronger
    your stroke will be.


    ![](img/855e727a697c289d306bb0e488065e20_386_0.png)


    **Figure 18-4:** Selecting the course you want to play in Miniature Golf


    # Atomic


    (Figure 18-5) is a fun (perhaps even somewhat educational) puzzle-like game that
    can be quite frustrating, depending on how you look at things.


    ![](img/855e727a697c289d306bb0e488065e20_386_1.png)


    **Figure 18-5:** Atoms made fun: Atomic


    The idea is quite simple: assemble the scattered atoms in the main playing area
    in the left half of the window so that they match the example of the assembled
    chemical molecule shown in the right half of the window. Yes, that’s right, even
    if you don’t know anything about atoms or chemicals, you can'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'follow along because you have an example right there in front of you, knowing
    how things should go together is the easy part. Actually putting them together,
    . . . well, that''s the challenge.


    If you prefer things a bit more complex, you can spice things up by building capsaicin
    or caffeine after fiddling around with the likes of water or methane. To do this,
    just use the scroll bar or arrow buttons above the preview window in the right
    side of the window (Figure 18-6), and select the molecule that suits your tastes.


    ![](img/855e727a697c289d306bb0e488065e20_387_0.png)


    Figure 18-6: Choosing your atoms in Atomic


    # Expanding Your Game Collection via Xandros Networks


    If you are quite the gamer and not satisfied by what you have already in your
    Games menu, as I mentioned earlier, expand your gaming repertoire via Xandros
    Networks. There are a number of games available via Standard and Expert modes,
    with Xandros Networks. You can download the very popular Tux Racer (Figure 18-7)
    from the Shop for free, though you will need to have an accelerated graphics card
    if you want to run that particular game happily, since it''s painfully slow if
    you don''t.


    How do you know whether you have an accelerated graphics card? Well, the easiest
    way to find out is to go through the documentation that came with your computer.
    If you don''t have that, or if you can''t find the answer within the docs, just
    go ahead and install Tux Racer, see how it goes. If it runs at a seemingly normal
    game speed, you''ll know you have an accelerated graphics card, while if it runs
    in molasses mode, then you''ll know you don''t (or at least don''t have one that
    is compatible with the game).'
  merge: -1
  pgno: 387
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_388_0.png)


    Figure 18-7: Tux Racer


    If you happen to find that things are just too sluggish to deal with, there''s
    no need to worry, as no harm has been done to your system. Just try to get your
    mouse down to the **Quit** button, and exit the game by clicking it. After that,
    you can remove the game from your system via the Xandros Networks application.


    There are a far greater number of games available from XN that do not require
    you to have an accelerated graphics card. These include various clones of familiar
    games, such as *Tetris: Same Game*, the freeware classic from Japan; *Battleship*,
    and the German card game, *Lieutenant Skat*, which comes bundled with most other
    Linux distros. For my part, I will be focusing on two other games that may not
    be particularly familiar to you, if at all, but loads of fun and classics in their
    own right: *Frozen-Bubble*


    # Frozen-Bubble


    Frozen-Bubble (Figure 18-8) is a classic, and although it has been ported over
    for use in the Windows and Mac worlds, its roots and soul are pure Linux.


    The objective of Frozen-Bubble is simple: shoot down all the bubbles in a screen
    in order to move on to the next. While this may sound so as to border being boring,
    that is not the case. And of all, you can live eternally in the world of Frozen-Bubble
    because you cannot die; every screen you fail to clear the first time around will
    repeat over and over and again until you get it right. Pretty cool (the life-eternal
    bit, at least), you have to admit.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_389_0.png)


    Figure 18-8: Frozen-Bubble—a Linux classic


    #  Installing Frozen-Bubble


    To get Frozen-Bubble, just run Xandros Networks, type frozen-bubble in the search
    box, and then click Search. After that click Install next to Frozen-Bubble, and
    you''ll be on your way.


    # Running and Playing Frozen-Bubble


    Once you''ve installed Frozen-Bubble, you can run it by going to the Launch menu
    and selecting Applications > Games > Arcade > Frozen-Bubble. The game will appear
    in a window, which will be black until it finishes loading, after which you will
    see the main-screen screen for the game (Figure 18-9). You cannot use your mouse
    in Frozen-Bubble, so navigate through the choices with your up and down cursor
    keys, and then press ENTER to make your selection. The default setup is one-player
    window mode with sound on, so if that sounds fine enough for you, just press ENTER
    straightaway to get started.


    # Game Play in Frozen-Bubble


    As mentioned, the idea of the game is to shoot down all the bubbles in the screen
    or move to the next screen. You shoot the bubbles with more bubbles, and you must
    hit a group of two or more bubbles of the same color with another of the same
    color in order to bring them all down. Once the bottom-most bubble makes contact
    with the bottom of playing area, all the bubbles will freeze (hence the game''s
    name), and you will have to start the level over and over again. Remember, you
    can play any level over and over until you get it right, with no penalties for
    your persistence.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_390_0.png)


    Figure 18-9: The main-menu screen in Frozen-Bubble


    # Controls


    Since you cannot use your mouse in Frozen-Bubble, you need to use your left and
    right cursor keys to aim the bubble you are going to shoot, and then use the up
    cursor to actually shoot it. When you are finished playing the game, usually when
    you are worn out, just press the ESC key, which will bring you to the High Scores
    screen, where you can record your high scores by entering your initials and then
    hitting ENTER. Hit the ESC key again, and you will be back at the options screen;
    hit ESC one more time, and Frozen-Bubble will close itself completely.


    # The King of Solitaire Games: PySol


    Well, now that we''ve installed one classic Linux game, let''s jump right over
    to another, and this one has to be considered the king of solitaire games—PySol.
    PySol includes just every solitaire game known on your part of the earth and then,
    providing you with over 200 different games. These include poker-based solitaire
    games, such as ShuffleIt and Poker Square, solitaire games played with Japanese
    Hanafuda cards (as shown in Figure 18-10), such as Matsukiri and Onnso, card puzzles,
    such as Pegged and Hanoy, and card-based memory games, such as Concentration and
    Memory 24. In all of an, an''s incredibly cool and eclectic collection!


    # Installing PySol


    To install PySol, run the Xandros Networks application, type pysol in the search
    box, and then click the Search button. After that, click Expert View in the bottom-left
    corner of the window, beneath the words Search Results.'
