    # Why Are My Scanned Images So Big?


    This is a point that seems to confuse a lot of people, so I''ll talk about it
    a bit. One of the first areas of confusion is that there is a general blurring
    of how the terms ppi (pixels per inch) and dpi (dots per inch) are used. Most
    applications use these terms interchangeably, and yet they aren''t really the
    same thing. To make things simple, when you are talking about images on your screen,
    you are talking about pixels (the little dots that make up your screen image)
    per inch, and when you are talking about printer resolution, you are talking about
    dots (of ink) per inch.


    Your computer screen in general has a resolution of 76 ppi, while most modern
    inkjet and laser printers have a resolution range of 300 to 1200 dpi, sometimes
    even more. This means that a photo scanned at 76 ppi that looks fine on your screen
    ends up looking lame when you print it out. On the other hand, when you scan a
    picture at 300 ppi, the image will look much better in your print but will seem
    gigantic on your screen, as the resolution of your image is more than three times
    that of your computer’s screen resolution. The result is that your computer can
    accommodate the higher resolution of the image only by displaying that image at
    three times its original size.


    ![](img/855e727a697c289d306bb0e488065e20_194_0.png)


    Figure 10-11: Same image scanned at three different resolutions'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'As an example, have a look at Figure 10-11, where you can see the identical
    image scanned at three different resolutions: 76 ppi, 150 ppi, and 300 ppi. As
    you can see, the 76 ppi image at the far left (measuring 132 × 156 mm—about the
    size of the hardcopy itself) is the smallest, while the other images are proportionally
    bigger (265 × 313 mm for the 150 ppi image and 550 × 627 mm for the 300 ppi image).


    # # So What Resolution Should I Use When Scanning?


    What resolution you use when scanning really depends on a variety of factors,
    the most important of which is what you plan to do with the image when you''re
    finished. When I look at Figure 10-12 on my computer screen, the smallest image
    looks best, the middle image looks okay, and the largest looks a bit odd, not
    as sharp as the other two. Basically, when scanning images for display on a computer,
    on web pages for instance, it is probably best to stick with a ppi similar to
    typical screen resolutions or slightly larger (76 to 150 ppi).


    When it comes to printing, a whole new set of considerations comes into play.
    First of all, there are the limitations of your scanner, different models having
    different maximum resolutions. The resolution of your printer itself is also,
    naturally enough, a major consideration. The type of printer you have, since laser
    printers and inkjets have different characteristics; laser printers will produce
    better-quality images than inkjet printers, inkjet output will be more affected
    by the type of paper used than a laser printer. In either case, there is always
    the question of the printing resolution you ultimately select. Of course, the
    printed output is not going to suffer if you scan your images at higher resolutions
    than those at which you plan to print them out, but you will end up with lots
    of files taking up too much disk space. The higher the resolution of a scanned
    image, the greater the file size in terms of disk space. If this is of concern
    to you being cavalier with your use of disk space, you can follow these very general
    guidelines:


    +   - If you are using a laser printer, scan at the resolution at which you are
    going to print.

    - If you are using an inkjet printer with regular paper, scan at about 65 percent
    of your target printout resolution, around 195 ppi for a 300 dpi print.

    - If you are going to use an inkjet printer with photo-quality paper, scan at
    about 80 percent of your target printout resolution, about 240 ppi for 300 dpi.


    Needless to say, these are just suggestions to get started. What works best for
    you and your particular scanner/printer setup may be slightly different. That
    said, it''s worth doing the fact that works better than a bit of experimentation
    and trial and error. In this case, you can''t really go wrong. Just give yourself
    some time, don''t get frustrated, and, most important, don''t wait until desperately
    need to scan something before trying things out—stay ahead of the game.


    Flatbed Memories 169'
