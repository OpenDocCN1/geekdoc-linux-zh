    fiddlers to quickly pick up the nyckelharpa, as the fingers are the same - leading
    to some to call it ''fiddleharpa''. Mechanically, it''s difficult to make a tangent
    on the 4th row short enough to produce good tone - it gets too long and gives
    to


    ![](img/855e727a697c289d306bb0e488065e20_241_0.png)


    **Figure 13-5:** Performing in-page searches in Firefox


    In that you can type whatever word you want to find, and as you are typing, and
    without pressing any key or clicking another button, Firefox will identify and
    highlight (in green) the first instance of that word within the document.


    Another cool feature in the search bar is its highlight function. If you click
    the Highlight button in the lower search bar after typing in the word you''re
    searching for, all instances of that word within the entire page will be highlighted
    in yellow (Figure 13-6).


    ![](img/855e727a697c289d306bb0e488065e20_241_1.png)


    In the 1960s and 1970s, there were a few people (Tord Johansson, Erik Olsson,
    Karl Svenski) who developed 4-row nyckelharpas. These are essentially of two different
    kinds. Olsson and Svenski added a 4th row of keys, stopping the low C4 string
    on a modern chromatic scale. Johansson and his followers have inverted the rows
    of the keys, so that the highest string is by the 4th row of keys, and the lowest
    by the top row of keys (right picture). They also tune the 4 strings the same
    as a traditional instrument. This makes it easier for fiddlers to quickly pick
    up the nyckelharpa, as the fingers are the same - leading to some to call it ''Fiddleharpa'',
    Mechanically, it''s difficult to make a tangent on the 4th row short enough to
    produce good tone - it gets too long and too much. Johansson solved this problem
    by placing 2 rows under the strings, and despite these innovations, the modern
    chromatic harpa was the dominant instrument used in 1955, 30 years after that.
    Perhaps 5% of the nyckelharpa players in Sweden today play the 4-row harpa.


    **Figure 13-6:** Firefox can highlight every instance of the word you''re searching
    for with a single click of your mouse.


    When you want to de-highlight the words, simply click the **Highlight** button
    again, and voilà!


