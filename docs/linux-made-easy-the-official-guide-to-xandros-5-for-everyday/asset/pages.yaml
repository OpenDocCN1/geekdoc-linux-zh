    # ## Headers, Footers, and Page Numbering


    Adding page numbers to your document is an easy enough to do, and yet many people
    still go about the process manually, by typing in the number at the bottom of
    each page. There is a much easier and more automatic way of doing this, by means
    of headers and/or footers.


    Headers and footers, in case you don''t already know, are text fields at the top
    (header) or bottom (footer) of your page that hold a value of elements you would
    like to appear on every one of your pages. These elements consist of the title,
    the author''s name, the date, and so on. They are handy because you need to input
    the text only once, after which it will appear automatically on every page in
    the document.


    Within the headers and/or footers, you can also place other fields, such as the
    one used for displaying page numbers. The page number field is extremely handy
    in that it is dynamic. By that I mean that it will automatically show the correct
    page number for each page. Thus, it will read 1 on the first page, 2 on the second
    page, 3 on the third page, and so on.

    Here are the steps:


    +   1. From within your document, go to the Insert menu, and select Header Default
    if you would like the page number to appear at the top of your pages or Footer
    if you would like it to appear at the bottom. Once you do this, a small empty
    field will appear at either the top or bottom of each page in your document.

    2. Your cursor should already be in your header or footer, but if it''s not, click
    in whichever of the two you are working on as to place the cursor there.

    3. Next, go to the Insert menu again, but by this time select Field Page Number,
    after which all of the pages in your document will be automatically paginated.
    You can use the justification buttons (left, center, right) in the menu bar to
    place the page number where you would like it.


