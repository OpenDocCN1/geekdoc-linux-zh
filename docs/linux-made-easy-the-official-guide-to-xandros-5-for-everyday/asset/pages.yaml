  md: '# INTRODUCTION


    # Who Is This Book For?


    If you are standing in the aisle of your local bookstore reading this right now,
    you may well be wondering who this book is for. If you also happen to see my previous
    book, Linux for Non-Geeks, on the same shelf (oh, lucky me), you might also be
    wondering what the difference between the books. So to clear things up, I will
    try to answer both of these questions now. Linux Made Easy was written with the
    average computer user in mind, is one who, through years of working with Windows,
    has been tired, weary, or broke. Such a person would like to try something different
    and doesn''t really care what it is as long as it will work, and work well, on
    or her present machine.


    In a sense, you could say that this book is for Steve, my friend fourth grade
    back in Los Angeles. Not too long after my first book came out, he called me to
    say that he had bought a copy. Unfortunately, he said that he wasn''t really going
    to try it out because he wasn''t all interested in getting into Linux. Not that
    he had anything against Linux, of course; it was just the main thing he really
    cared about was getting out of Windows. He only wanted to be able to hook up his
    PDA, send email to his friends, use the Web, and whip up a few documents and presentations
    when necessary—without having to really get all into it. It didn''t matter whether
    it was Linux or Dogmata Fortuita Professional OS v5 (no, that does not exist),
    as long as it was cheap, easy, and able. To him, Linux still seemed too much trouble
    at the time.'
  merge: -1
  pgno: 23
- img_proc: true
