- img_proc: true
  md: 'After that, what appears in the window is between you and the video output
    device you have connected to your card, or if you have a TV tuner card, the tuner
    card itself. TV Time itself is nothing more than a software version of a video
    monitor.


    # Getting Your Own Video Capture or TV Tuner Card


    If the idea of watching videos or television on your computer screen as you tend
    to your other business sounds attractive to you, you might consider buying a video
    capture or TV tuner card for yourself, assuming you don''t already have one. These
    cards are rather inexpensive (some are less than $50 via mail-order outlets),
    so it is all quite doable. That said, you should also be aware that support for
    such cards in Linux is rather limited, so it is important to check around before
    parting with your money. Checking the Xandros User Forums for postings in that
    regard, or directly asking for advice, is probably a very wise thing to do.'
