    # TV Time


    Many computer users have video capture or TV tuner cards installed in one of the
    PCI slots within their computers. These cards allow you to take video output from
    an external source, such as a VCR, and display that output in a separate window
    on your computer screen—a sort of monitor-within-a monitor arrangement.


    TV tuner cards, an example of which is shown in Figure 15-11, actually mini-TV
    tuners connected to an antenna or cable television source, allow you to watch
    live television and change channels in the same monitor-within-monitor setup.
    Some even come with remote controllers. Like video capture cards, they also allow
    you to display output from your VCR or other video sources on your computer screen.
    Xandros, the application that provides the onscreen monitor for displaying the
    video output from these devices is called TV Time.'
