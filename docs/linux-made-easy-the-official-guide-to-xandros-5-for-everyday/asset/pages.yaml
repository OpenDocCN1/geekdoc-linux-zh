    # 17C-1: Downloading, Installing, and Running gLabels


    You can get gLabels, but you must first be sure that you have selected Debian
    Unsupported Site in the Application Sources list (Edit Set Application Sources).
    Then just type glabels in the text box at the top of the window, and click the
    Search button. When the results of your search appear in the panel below, click
    Install next to glabels, which should be the only item listed, and then follow
    the usual procedures for installing files via Xandros Networks.


    Once gLabels is installed, you can run it by going to the Launch menu and selecting
    Applications Office gLabels Label Designer. If it doesn''t happen to be yet (it
    will be the next time you start up your system), run it via the Run Command instead
    (Launch Run Command), by typing glabels and then clicking Run.


    # 17C-2: Setting Up Your Business Card


    To started with your card project, click the New button, and the New Label or
    Card window will appear (Figure 17-28).


    ![](img/855e727a697c289d306bb0e488065e20_370_0.png)


    Figure 17-28: Selecting paper size and card or label stock in gLabels


    In that window, first select the paper size of the card stock you will be using
    (the default is US Letter), and then select the brand and type of the card itself.
    The choices are listed with description and product number, so you should have
    no problems. Once you have made your selection, click the OK button, and a design
    grid will appear in the main window.'
