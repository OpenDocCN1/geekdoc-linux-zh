    # # Registering with Xandros Networks, and Why It Won''t Hurt You to Do So


    If you want to get even more out of Xandros Networks, it is worth yours to register.
    Now, I know registering seems like a big bother, but it''s not. Really. registering
    with Xandros Networks is easy and doesn''t require any credit card information,
    if you''re concerned about that.


    What do you get for your efforts if you do register? Well, the least you will
    have access to a few other choice that you can download and install for free.
    Nothing wrong with that, right? Of course, once you do register with Xandros Networks,
    you can also later purchase membership, which allows you to download a host of
    other cool stuff; purchase other commercial applications, such as CrossOver Office;
    or upgrade to the Deluxe Edition of Xandros, with which you can get the full shebang.
    Of course, these purchase options are strictly up to you—nobody is going to be
    knocking at your door (or inbox) demanding that you do.


    Anyway, once you are ready to register, here is how to go about it:


    +   1. Click the + symbol next to Shop in the left pane of the Xandros Networks
    window.


    +   2. When the list of categories appears below Shop, click My Account.


    +   3. A Sign In page will appear in the right pane of the window. Click Continue
    in the New Customer section to finish.

    AWallet wizard will appear (Figure 8-24).

    KWallet has no relation to Xandros Networks; it is a part of your system that
    allows you to store passwords and other information safely in an encrypted file.
    I am sort of paranoid about saving passwords on my computer, except for accounts
    that really house little information about me, such as forums. If you want to
    skip on KWallet, Cancel. If you want to go ahead with it, click Next in this window
    and finish the very simple two-page wizard before moving on.'
