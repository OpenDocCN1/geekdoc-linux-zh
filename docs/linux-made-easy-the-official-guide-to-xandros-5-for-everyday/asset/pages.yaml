    considering the data I asked you to input. Well, unexpected things occasionally
    happen and memories do sometimes fail, so it''s always good to be able to make
    allowances for such unforeseen occurrences. For example, let''s say that after
    updating your spreadsheet you suddenly remember that you get a bit of money each
    month from your one-a-week tutoring sessions at the local junior college and,
    very important, that you forgot to include food and entertainment expenses in
    your list of expenditures. Now, because you have space for these items you can
    set your formula to automatically include them, making an adjustment is hardly
    a problem.


    Give it a try and see what I mean, by adding one new source of income under the
    Income heading and two expenditures under the Expenditures heading. After you
    type in the amounts for these new items, the totals in your various formula fields
    will automatically change to account for the new entries. Pretty cool, don''t
    you think?


    # 17A-4: Doing a Little More Math


    Now that you know your monthly worth, let''s get back to the business of car yours.
    To figure out how many months it will take before you''ve saved up for your $40,000
    SAAB 9-7X, click in a cell away from everything you''ve just typed, such as cell
    F4, and type in a new formula. What you want to include in this formula is the
    total price of your new car, minus the $9,000 estimated trade-in for your present
    one, divided by 70 percent of your monthly leftover cash, which is the amount
    you want to put toward the purchase of your new wheels. You would thus start by
    typing =(40000-9000)/. What you typed so far is the cost of the car, minus the
    trade-in amount, divided by . . . well, that comes next.


    Now click cell B22, press the asterisk (*), which is the symbol used to represent
    multiplication. Type .70 (for seventy percent) and a close, or right, parenthesis.
    Your formula should now be like =(40000-9000)/(B22, .70), or (cost, minus trade-in)
    divided by (monthly savings times 70 percent). Now press ENTER to see how many
    months you have to wait.


    Since cell B22, which is included in your formula, is in currency format, your
    result in cell F4 will also be in that format. After, your spreadsheet doesn''t
    know what you are driving at (or, in our case, what are driving in?). If this
    bothers you, right-click in that cell, and then select Format Cells in the pop-up
    menu.'
