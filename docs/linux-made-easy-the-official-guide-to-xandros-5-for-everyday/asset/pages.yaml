- img_proc: true
  md: '# Multiple Selections


    A definitely off-overlooked feature of OpenOffice Writer is its ability to allow
    multiple selections. You are no doubt already familiar with the fact that you
    can change the font, font size, or font style of an individual word, sentence,
    or paragraph by highlighting (or selecting or blocking), if either of those terms
    is what you use to describe this action) particular element within your document
    and then performing the desired change. But what if you have several elements
    scattered throughout your document that you want to change in the same way? Well,
    this is where multiple selections come in hand.


    Let''s say that you are writing a piece on cinema and would like to italicize
    all of the film titles within your document. To perform the changes in one free
    swoop, hold down the CTRL key, and highlight each of the titles within your document.
    Your document would then look something like that in Figure 17-2.


    Once you have selected all the relevant bits of text, click the italics button,
    and all your highlighted titles will be italicized.


    This feature can prove very handy when changing the line spacing of several noncontiguous
