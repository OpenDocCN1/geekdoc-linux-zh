  md: '# Creating an Audio CD with Xandros File Manager


    As I already mentioned, another cool feature of the Xandros File Manager’s DVD/CD-Writer
    is that it allows you to use your Ogg and MP3 files to create (for your personal)
    standard audio CDs that can be played on standard audio CD player.


    The process for doing this is essentially the same as for creating CDs, albeit
    with just one minor exception. Here are the steps:


    +   1. Open a Xandros File Manager window, and then click the DVD-Writer or CD-Writer
    icon (depending on the hardware you have) to have in the file tree at the left
    side of the window.


    +   2. Next, click Create music CD in the right pane of the window (Figure 14-4).


    ![](img/855e727a697c289d306bb0e488065e20_276_0.png)


    Figure 14-4: Creating an audio CD in XFM


    +   3. Copy the MP3 and Ogg files you want to include on your CD (and yes, you
    can mix both file types) to the right pane of the window until you have about
    14 songs.


    +   4. Once you’ve done, click the words Write files to disc, after which the
    usual warning you about running programs while burning discs will appear.


    +   5. Click OK to follow that bit of sound advice.


    +   6. After the Create Disc window appears, click OK. The DVD-Writer will then
    check to see if you have a blank disc in your drive, and if you don’t, it will
    request that you insert one.'
  merge: -1
