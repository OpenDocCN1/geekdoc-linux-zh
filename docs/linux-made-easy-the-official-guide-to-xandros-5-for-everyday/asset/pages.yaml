  md: 'If you would like to see an image at a size beyond the constraints of the right
    pane of the XFM window, you can do so by right-clicking the thumbnail of the image
    in question and selecting **Open With ► Image Viewer** in the pop-up menu. The
    image will then appear in its own window, as you can see in Figure 5-12. In Image
    Viewer (also called KView), not do you have all the viewing options you do when
    viewing images in an XFM window, but you can also have your images fill the entire
    screen by selecting **Full Screen Mode** in the Settings menu and then selecting
    **Fit Image to Window** in the View menu. To get back to normal, just go to the
    **Settings** menu again and select **Exit Full Screen.**


    ![](img/855e727a697c289d306bb0e488065e20_98_0.png)


    Figure 5-12: Viewing an image in its own window


    # Using XFM to View Text and PDF Files


    In addition to letting you view graphics, the Xanders File Manager allows you
    to read the contents of text files (those saved with a .txt format), again without
    the need for any other software. If, for example, you have some notes that you
    jotted down and saved as a text file, you can simply double-click the file''s
    icon in the right pane of the XFM, and the file''s contents will be displayed
    in the XFM window. XFM can even do the same for PDF files, acting as a simple
    PDF viewer. Just clicking a text or PDF file will give you a small preview of
    that document in the left-hand side of'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'the XFM window, as is the case with graphics files. Of course, you can always
    opt to read a PDF file in a window of its own by right-clicking the PDF file you
    want to view and selecting Open With ► Acrobat Reader in the pop-up menu (Figure
    5-13), or if Acrobat doesn''t seem to do the trick, Open With ► Script Viewer.
    Text files can be read in a simple fashion by selecting Open With ► Text Editor.


    ![](img/855e727a697c289d306bb0e488065e20_99_0.png)


    Figure 5-13: Viewing a PDF file in Acrobat Reader


    # # Changing File and Folder Permissions Within XFM


    You will find, as you make your way along in the Linux world, that occasionally
    you come across a system that will not allow you to alter. When you open up a
    file in the appropriate application, the title bar will show Read Only, when you
    try to save the file, you will get a Permission denied message. Messages of this
    type are telling you that the file is write-protected, meaning that you do not
    have permission to alter the file. In likelihood, the only time you will encounter
    this situation in Xandros is when you copy files from a CD to your hard disk or
    when you copy files from your Windows partition to your Linux partition. This
    is another way that Linux tries to protect you from harming your system, though
    in case of copied CD files, it may not be clear to you how it''s protecting you.


    If you want to alter a file or gain access to a folder that is write-protected,
    it is possible to do so in an XFM window as long as you are the owner of that
    file or folder. To change file or folder permissions, right-click the file or
    folder in question and select Properties from the pop-up menu.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Once the Properties window opens, click the Permissions tab, and you will see
    who the owner of the file or folder is and what you are allowed or not to do with
    it (see Figure 5-14).


    ![](img/855e727a697c289d306bb0e488065e20_100_0.png)


    Figure 5-14: Changing permissions in an XFM Properties window


    As you can see in Figure 5-14, permissions can be granted or denied to the owner
    of the file or folder (you), to a specified group, or to others (everyone else).
    These permissions are:


    +   - Read Permission to view the contents of a file or folder

    - Write Permission to alter the contents of a file or folder

    - Execute Permission to run a program or script


    In general, you needn''t worry all that much about setting permissions for your
    own files, because you are really the only one who has access to your user account.
    The main exception to this is when you transfer files from a CD to your hard disk.
    In this case, the files likely will be-protected, meaning that you cannot alter
    the files until you change their permissions.


    If you are dealing with a write-protected folder or file, you can change the file''s
    permissions to allow you to alter it by clicking the checkbox under the word Write
    in the Owner row. Once you have finished, click OK and you''ll be free to do what
    you like with that file.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Using XFM with Your Windows Partition (for Dual-Booters Only)


    If you set up a dual-boot system when you installed Xandros, you can also get
    read-only access to the files in your Windows partition, but not the programs,
    via the Xandros File Manager. To do so, follow these steps:


    +   Click the C icon in the file tree in the left pane of the XFM window (or whatever
    drive contains the files you want). The contents of your Windows C drive should
    appear on the right-hand side of the right pane of the XFM window (Figure 5-15).


    NOTE You will only have read access to the partition (see the left-hand side of
    the XFM window, which tells you this), which means you can copy files from, but
    not to, the Windows partition. Although this may seem a bit inconvenient, it is
    best in the long run, because it protects the integrity of your Windows system
    and can help to prevent any problems from occurring the next time you decide to
    boot up in Gatesway.


    ![](img/855e727a697c289d306bb0e488065e20_101_0.png)


    NOTE Assuming your files are stored, as most people''s, in your Windows My Documents
    folder, you can access them by double-clicking the Documents and Settings folder.


    +   Once the contents of that folder appear in the right pane, look for the folder
    with your Windows username (mine says rg) and then double-click that folder.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '3. Finally, double-click the My Documents folder that appears in the right
    pane, inside which you should be able to find all of your files. If you happen
    to have saved some files to your Windows desktop would double-click the Desktop
    folder instead of My Documents.


    NOTE Creating a bookmark in XFM for this My Documents or Desktop folder might
    be a pretty convenient thing to do now that you know.


    # # Dealing with Your Network in XFM


    If your computer is connected to a local network, as is often the case with office
    computers, you can also browse the computers connected to that network, and assuming
    you have permission from your network administrator to do so, you can also read
    and write access to the files located there.


    # ## Browsing Your Network


    If you are on a network, the chances are good that it is a Windows network, or
    at least acting like one, to start browsing, click the Windows Network icon in
    the file tree in the left pane of the XFM window. A window may pop up at that
    point asking for your Windows password. If it does, just click Cancel, and after
    a bit of searching, the workgroups located on the network (one of which will be
    your workgroup,) will appear in the right pane. If nothing appears after a few
    seconds, try clicking the NFS Network icon in the file tree.


    ![](img/855e727a697c289d306bb0e488065e20_102_0.png)


    **Figure 5-16:** Network workgroups shown in an XFM window'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Once the workgroups appear, double-click the workgroup that you belong to;
    the various computers belonging to network will then appear (Figure 5-17). Search
    through the list until you find the host computer that you have permission to
    log on (ask your network administrator if you''re not sure), and then double-click
    the icon for that computer.


    # Mounting a Network Share


    At this point, a small window will appear asking your username and asking for
    your password. Be aware that the username and password you chose for Xandros system
    may be different from those for your network. My Xandros username for example
    is rg, while my username for office network is grant. My passwords are also different,
    but I''ll keep that information to myself. At any rate, your situation may be
    similar to mine, be sure to input the appropriate information. Once you have done
    so, click the OK button.


    ![](img/855e727a697c289d306bb0e488065e20_103_0.png)


    Figure 5-17: Browsing through the computers connected to your network


    You should be able to see the contents of the host computer in the right pane
    of the XFM window. Look for the folder with your network username (or any other
    folder you have permission to use), and then double-click if you just want to
    see what''s inside. If you want to access the folder for file-writing or copying
    tasks, click once to select it, and then click the Mount this share link on the
    left side of the right pane of the XFM window.

    A new window, Mount Share, will now appear. In this window, you will see three
    boxes: Share to, Mount point, and Connect. The information in the first and last
    of these three boxes is information regarding the network; the network needs to
    knows what you are trying to mount and who you happen to be. The middle box, however,
    contains information for your own computer. The Mount point box tells your system
    where in file system it should display the files on your network share, or folder.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'This may sound a bit confusing, but I will try to simplify a bit. Your Xandros
    system, like all other Linux distributions, sees the world as a series of files
    and folders. To display the files on your network share, it needs a folder in
    to do so. Again, this is no different from what happens when you insert a CD or
    floppy into your computer—computer mounts the disk and displays its contents in
    a folder, which, unbeknownst to you, is located on your hard disk at /mnt/cdrom0,
    or in the case of a floppy, at /mnt/fd0. Of course, you needn''t worry about these
    details.


    What you do need to worry (or at least think) about, however, is where on your
    disk you want your system to place the folder it will use to mount your network
    share or shares. The default location in the Mount Network Share window is /home/Xandros_username/share_name,
    which is fine enough. I would personally recommend creating an intermediary folder
    of sorts, however if you have more than one share you are going to be mounting.
    To do this, change the text in the Mount Point box to read /home/Xandros_username/Network_Shares/share_name
    (of course, substituting your username for the Xandros_username in that string).
    Your window should then look something like Figure 5-18.


    ![](img/855e727a697c289d306bb0e488065e20_104_0.png)


    **Figure 5-18:** Creating a folder with which to mount your network share


    Whether or not you take this extra step is strictly up to you, because whatever
    folder you create for this purpose will appear in your Home folder, I think you
    will eventually appreciate the lack of confusion that this extra folder will bring
    about. Either way you decide to go, once you are ready, click **OK.**


    At this point, because you do not already have a network shares folder or with
    your network username, another small window, somewhat frightening Error, will
    now pop up asking if you want to create the folders in question. You do, click
    **OK.**'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Accessing the Files on Your Mounted Network Share


    You can now access the files within your network share by going to the newly created
    folder within your Home folder. Remember that the files in that folder are only
    displayed and accessible there; they are not actually present on your hard disk,
    so if you use your computer while not connected to the network, the folders will
    be empty.

    Anyway, assuming you have read write permissions from your network administrator,
    you will not only be to copy files from your network share but also copy files
    to that share. In addition, you can actually work with files directly on your
    share as if they were right on your hard disk. Say, for example, that you have
    an OpenOffice.org document on your share. Say, if you could, double-click that
    file, make whatever changes you want to make, and save it—all without the document
    ever sitting on your hard disk.


    # Future Network Logins


    Once you have set up, you will not have to go through this laborious process again.
    Every time you start up your machine, your system will attempt to automatically
    mount your network share. Shortly after the Xandros desktop appears on your screen,
    two windows will appear—one informing you that your system is attempting to restore
    your network connection and another asking you for your network password (Figure
    5-19). If you want to mount your network share, type your password, and then click
    OK. You can then view your network files in the folder you created in your Home
    folder (Network_Shares/network_username).


    ![](img/855e727a697c289d306bb0e488065e20_105_0.png)


    Figure 5-19: Typing in your password during subsequent logins


    If you rather not mount your network share at that time, you can click Cancel
    instead. This will bring up yet another window asking if you would like to permanently
    remove a given share from your list of automatically connected network shares.
    If you need to mount your network share only occasionally, or if you are using
    a notebook computer that you move from work to home and back, it is a good idea
    to do click Yes. If, on the other hand, if you prefer to be prompted every time
    you boot up, click No. Either way, you can still mount your network share whenever
    you want to, using the method I described earlier.'
  merge: -1
  pgno: 105
