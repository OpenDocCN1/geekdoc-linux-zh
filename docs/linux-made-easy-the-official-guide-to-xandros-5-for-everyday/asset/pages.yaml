  md: '# Project 2C: Post-installation Steps


    When your computer restarts itself, you will be greeted by the boot loader screen,
    where you will see a list of startup options. If you''ve set up a dual-boot machine,
    use your arrow keys to move down to the Windows XP (or other Windows version)
    entry in that list. Press ENTER, and Windows will start up like it did before
    you installed Xandros. For the time you want to boot up in Xandros, just accept
    the default startup option, Xandros Desktop 3.0, by (or wait a few seconds) and
    Xandros will start up automatically. Naturally, if you choose to set up a Xandros-only
    machine, the Windows login screen will not be available.


    After a short while, the login screen will appear. In that screen, your username
    is the one shown in the login window next to the words User name. If it is not,
    click the button at the right side of the User name box, and select your username.
    Next, type your password, and then click the Login button. The Xandros First-Run
    Wizard will soon appear to take you through the exceedingly simple post-installation
    process. Fortunately, there is really little to do here than click the Next button
    a few times, but I''ll walk you through things anyway. Oh, and if you are worried
    about making a mistake or missing out on something, don''t—you can run the wizard
    again later at any time. Here are the steps for the wizard:


    +   1. Welcome/Mouse Configuration Select Right hand or Left hand, and then click
    Next (Figure 2-12).


    ![](img/855e727a697c289d306bb0e488065e20_49_0.png)


    +   2. Regional Settings Set the appropriate locale and keyboard layout, and then
    click Next (Figure 2-13).'
