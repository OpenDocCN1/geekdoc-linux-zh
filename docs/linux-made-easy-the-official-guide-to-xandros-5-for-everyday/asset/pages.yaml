  md: '# 13B-2: Adding Contacts to Kopete


    Although you are now set up and logged in, you really can’t do anything until
    you add some contacts to Kopete. If you want to be able to communicate with these
    contacts by Kopete, they must have accounts with one of the same messaging services
    as you. To add such contacts, go to the File menu and select Add Contact, after
    which an Add Contact Wizard will appear (Figure 13-30). To help you in following
    along with the wizard, I’ll spell out the steps here:


    +   1. In the first page of the wizard, just click Next.

    2. In the top of the next page of the wizard (Figure 13-31), type the name of
    the contact as you would like it to appear in the Kopete window.


    ![](img/855e727a697c289d306bb0e488065e20_262_0.png)


    Figure 13-30: Adding messaging contacts in Kopete


    +   3. Next, you must decide which group you want to add your contact. The default
    group is Top Level (also shown in Figure 13-31), so click the box to that group,
    and then click Next.

    4. In the next page of the wizard, check the box next to the messaging service
    to which your contact belongs. If, for example, the contact uses Yahoo, check
    the box next to that service, and then click Next. Note that those services for
    which you have set up your accounts will appear in this list, so if your contact
    is registered with a different messaging service, you will have to register for
    the same service yourself and then set a Kopete account for it.

    5. In the next page, type the username or email address under which contact is
    registered with his or her messaging service. Of course, you will have to get
    this information from the person in question. Once finished, click Next.

    6. In the final page of the wizard, just click Finish.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_263_0.png)


    Figure 13-31: Naming your contact in the Kopete Add Contact Wizard


    Your new contact will then appear in the main Kopete window, though you will not
    be able to see that contact''s online status until you receive his or her online
    approval. This is usually requested, and hopefully given, the first time you try
