  md: 'Windows or Mac OS isn''t clear, both of those operating systems have the built-in
    capacity to allow their users to do the same. Still, web pages related to those
    systems do not seem to be anywhere as well endowed in the screenshot department.


    Now that you are a Xandros user, there is no reason that you too cannot join in
