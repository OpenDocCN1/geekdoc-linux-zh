  md: '# # Canceling a Print Job


    To wrap up this chapter on printing, let''s cover a problem that at one time or
    another happens to all of us. You wanted to print just one page of a 57-page document,
    but by accident you started printing the whole thing. What can you do to save
    your ink and 56 sheets of paper?


    Fortunately, the solution is outrageously simple. Just open a Xandros File Manager,
    if one isn''t already open, and click **Printers** in the left pane of that window.


    In the right pane, right-click the printer currently handling your job, and select
    **Purge** in the pop-up menu (Figure 9-22). The page currently printing will probably
    print out to completion, but the printing will stop after that.


    ![](img/855e727a697c289d306bb0e488065e20_185_0.png)


    Figure 9-22: Canceling a print job'
  merge: -1
