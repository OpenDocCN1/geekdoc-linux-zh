  md: '# 10


    # # FLATBED MEMORIES

    Working with Your Scanner


    ![](img/855e727a697c289d306bb0e488065e20_187_0.png)


    Scanners are both extremely useful and about as cheap as a peripheral device as
    you can get. They allow you to take either images or pages of text and input them
    in digital form into your computer in much the same way as you duplicate a document
    on a copy machine. However, even as digital cameras are rapidly overtaking traditional
    film cameras as the photographic device of choice for the masses, the number of
    people using scanners to transfer their non-digital images into digital form is
    slowly decreasing. Despite this trend, scanners are not in immediate danger of
    extinction because there are more images around than those you take yourself.


    Even though scanners have been around for a relatively long time, support for
    them in Linux is still a bit patchy. Fortunately, this is changing for the better
    with every new Linux release. The backend, the essentially hidden part of your
    system that handles scanner recognition and support in Linux, is called Sane.
    If you are wondering whether Linux will be able to recognize your scanner, or
    if you are trying to figure out what type of scanner to buy, you will probably
    want to go to the Sane website, www.sane-project.org/sane-mfgs.html.'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'There will be able to see if your scanner is supported or to get tips

    to what scanner to buy. As I have mentioned before, you can also try out the Xandros
    User Forums (http://forums.xandros.com) and ask for Xandros-

    specific recommendations there.


    # Project 10A: Scanning


    For those of you who have a scanner, now is the time to get a feel for how to

    use it with Xandros by following along with this project. To get started, make

    sure your scanner is plugged into your computer and turned on.

    After that, here''s what you have to do:


    +   1. Go to the **Launch** menu and select **Applications > Graphics > Scanner**.
    This will launch the scanning application known as *Kooka*.

    2. The Kooka window (Figure 10-1) tells you which scanning devices have connected
    to your machine and asks you to pick one. Assuming you have only one, just click
    **OK**.


    ![](img/855e727a697c289d306bb0e488065e20_188_0.png)


    Figure 10-1: The Kooka window


    > NOTE If the scanner you are using is the only one you are likely to connect
    to your machine in the near future, then go ahead and check the box next to the
    words Do not ask on startup, always use this device, which will allow you to bypass
    this phase of the startup in the future. If you happen to add, or switch, scanners
    in the future, you will be able to make the appropriate changes in the Kooka Preferences
    window at that. Once you click OK, the main Kooka window will appear.


    Now that Kooka is up and running, scanning. The first thing we''ll do is perform
    a preview scan. This is a quick, low-resolution scan, which allows you to see
    a thumbnail, a small version of the image you will be working with.


    +   3. Choose a photo you would like to scan, place it on the scanner bed, and
    then close the cover.

    4. Click the **Preview Scan** button in the main Kooka window, after which a small
    window (Figure 10-2) will appear showing you the progress of the scan.'
  merge: -1
