- img_proc: true
  md: '# 20B-6: Removing the Briscola Folder Within Your Home Folder


    Assuming that Briscola ran without problems from its new global location, you
    can trash the briscola folder that is still in your Home folder. Of course, you
    can do this by simply dragging it Trash, but to get some command practice, do
    it via the command Console.


    +   1. Quit Briscola.

    2. In the Console, type `cd` and press ENTER to get the Console back into your
    Home folder.

    3. Remove the briscola folder by typing `rm -r briscola` and pressing ENTER.

    4. Quit the Console by typing exit and pressing ENTER.


    # 20B-7: Creating a Desktop Shortcut for Briscola


    The method of running Briscola that you''ve just used well enough, but it can
    get quite a pain in the posterior to open a Briscola window and type a couple
    of commands every time you want to play a few tricks of game. To make things easier
    on yourself in the future, it would be a good idea to create a desktop shortcut
    that you can then simply double-click anytime you want to have a hand at the cards,
    so to speak.

    If you are interested, here''s what you need to do:


    +   1. Right-click any open space on the desktop, and select Create New ▶ Shortcut
    in the pop-up menu. A Create Shortcut Wizard will appear.

    2. In the first page of the wizard, select Program and then click Next.

    3. In the box that appears next to the Browse button in the next page of the wizard,
    type `/usr/local/share/games/briscola/briscola.tk`, as shown in Figure 20-7. When
    finished, click Next.

    4. In the final page of the wizard, change the name of the shortcut to Briscola,
    and then click Finish.

    You will now have a new shortcut for Briscola on your desktop; however, as the
    icon is, graphically speaking, rather dull, you might want to change it to something
    more colorful.

    5. Right-click the Briscola shortcut on the desktop, and select Properties in
    the pop-up menu.

    6. In the Properties window, click the icon button just below the General tab.
    This will bring up the Select icon window.

    7. In that window, scroll around until you find an icon to your liking—the icon
    of two playing cards in the `package...` section would be an appropriate choice.

    8. Click once on the icon you''ve chosen once to select it, and then click OK

    9. Finally, click OK in the Properties window to wrap things up.'
