    # OpenOffice.org Writer


    When it comes to office suites, the application that gets the most used by many
    great users is the word processor.


    In Microsoft''s suite, you are talking Word, however when it comes to OpenOffice.org''s
    suite, we''re talking Writer, which is one of the three OpenOffice.org applications
    I will be discussing in this chapter.


    As you see in Figure 17-1, Writer is laid out like other word processors and is
    thus straightforward in terms of use. Said, I won''t be going into an undue amount
    of explanation here since most folks know how even seasoned users tend to overlook,
    features that I will be focusing in this section. Again, covering all the features
    in Writer would fill up an entire tome, I will limit my discussion to those features
    I have personally found to be of great use and those about which I am frequently
    asked.


    # Adjusting Line Spacing


    The single question I am most frequently asked is answer: "How do I adjust the
    line spacing in my document? All you have to adjust the line spacing in a paragraph,
    say from single-to-double-spacing, is to right-click in the paragraph in question
    and select Line Spacing Double (or whatever other spacing you prefer) in the pop-up
    menu that appears. If you do this when you start writing your document, subsequent
    paragraphs will follow suit in terms of line spacing.


    If you want to change the line spacing for an entire multipager paragraph you
    already written, go to the Edit menu and choose Select All before doing your right-clicking.
    If you would like to change the line spacing for several noncontiguous paragraphs
    in an already written document, you can change each of them, one-by-one, in the
    way I first described or go on the next section to find out how to bring about
    your changes most easily.'
