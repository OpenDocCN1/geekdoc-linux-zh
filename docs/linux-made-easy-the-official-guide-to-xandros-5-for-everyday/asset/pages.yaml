    # # Alternative Ripping and Encoding Application—RipperX


    Although Xandros File Manager’s ripping and encoding capability is very handy,
    it is not without some minor drawbacks. The fact that it does not create artist
    and album folders or track names can, in the end, mean more work for you, especially
    if you are doing a lot of ripping. There are, however, a couple of other applications
    available from Xandros Networks that do all of these chores for you in one swoop,
    making the process easier and quicker. My favorite of these is called riX.


    RipperX is an alternative ripping-and-encoding application that gathers from the
    Internet artist, album, and track information for the album you are ripping. It
    rips and encodes the tracks of that album in Ogg or MP3 format and places the
    encoded files in the artist and album folders on your hard disk. It is extremely
    easy to use and configure. Best of all, it’s pretty quick.


    # ## Installing RipperX


    To install RipperX, just run Xandros Networks, and make sure that the Debian unsupported
    site repository is enabled in the Set Application window (Edit > Set Application
    Sources). After doing that, type ripperx in the text box next to the Search button,
    and then click Search or RipperX will then appear in the list of results below
    (it will probably be the only item listed). Now click Install, and then follow
    the remaining simple installation steps learned in Chapter 8.


    # ## Using RipperX


    To use ripperX, just follow these steps:


    +   1. Insert an audio CD in your disk drive, and then quit Kscd and its Panel
    applet once they appear.


    +   2. Go to the Launch menu, and select Run Command.


    +   3. In the Run Command window, type ripperx, and then click Run.


    +   4. When the ripperX window appears the first time, a small window, "Wanna
    create . . ." will appear asking if you want to create a config file (Figure 14-5).
    You do, so click Yes.'
