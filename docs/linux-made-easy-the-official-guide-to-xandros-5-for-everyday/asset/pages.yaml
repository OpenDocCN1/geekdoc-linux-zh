  md: '# Dealing with Rewritable Discs


    CD-RW and DVD-RW (rewritable) discs are pretty much like their CD-R and DVD-R
    counterparts, except that they can be erased and then written again. They are
    also quite a bit expensive. Also, if you are interested in copying or creating
    a music CD, CD-RW discs cannot be played in the majority of standard audio CD
    players, such as in your home or car.


    Using rewritable discs is like working with standard-once CDs and DVDs. If the
    disc is blank, there is no difference in the process at all, which makes things
    simple. If, however, you want to reuse a rewritable disc that already has data
    on it, you must first erase, or blank.


    To blank a disc:


    +   1. Insert the disc in the drive, and click the XFM window appears, **DVD Writer**
    or **CD Writer** (whichever is appropriate in your case) in the file tree in the
    left window pane.


    +   2. From the list of choices that appears in the right pane, click **Blank
    disc**. A new window, *Blank Disc* (Figure 6-9), should appear.


    ![](img/855e727a697c289d306bb0e488065e20_116_0.png)


    **Figure 6-9:** Blanking a CD-RW disc


    +   3. To blank the disc, click **OK** in the Blank Disc window. Another window
    will appear indicating the progress of your blanking. When the disc has been blanked,
    it will be ejected automatically. Click **Done** in the progress window when the
    process is complete. You can then go on to use the newly blanked disc as if it
    were new.


    # Duplicating Audio and Data Discs


    Here''s how to duplicate audio and data CDs:


    +   1. To get started, open XFM and click the **DVD Writer** or **CD Writer**
    icon in the left pane.


    +   2. Next, click **Copy disc** in the right pane. When you see a window telling
    you to close all other running applications before burning data to disc, close
    them if you want to, and then click **OK**.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '+   3. A Copy Disc window should open, followed by another window telling you
    to insert the source you want to copy. That means that you should insert the disc
    you want to copy. Go ahead and insert it. Once your drive lights flashing, click
    OK.


    +   4. Click OK in the next, you''ll be asked to check the destination media (the
    blank disc). I don''t do it, but click Check if you will; otherwise, click Skip.
    The copying process should begin, with the progress in a separate window.


    +   5. When the copy phase of the process is complete, your disc will be ejected
    automatically, and a small window (bottom of Figure 6-10) will appear that asks
    you to insert a blank disc.


    At this point in the process, the progress bars in the Copy Disc window will not
    indicate 100 percent progress (also shown in Figure 6-10). This''s because they
    indicate the total progress of both the copy and burning processes, so don''t
    worry.


    +   6. Insert the disc as requested, and then click OK. The burning phases of
    the process will begin. When it finishes, your disc will be ejected automatically,
    and you can then go ahead and close the Copy Disc window by clicking the Done
    button in that window.


    ![](img/855e727a697c289d306bb0e488065e20_117_0.png)


    Figure 6-10: DVD Writer asks you to insert a blank disc midway in the disc-copy
    process


    # # Burning ISO Images to Disc


    When you download Xandros or other Linux distributions from the Internet, you
    usually download them as one or more disc images, commonly referred to as ISOs.
    An ISO is an image of a CD, which means that it is the CD minus the media itself.
    To put it another way, if CDs had soul, the ISO would be the soul of a CD; take
    the CD''s metal and plastic, and the remaining data would be an ISO. After downloading
    an ISO, you burn it onto a blank CD in order to give the image back its body,
    so to speak, and in the process create a working install disc.'
  merge: -1
