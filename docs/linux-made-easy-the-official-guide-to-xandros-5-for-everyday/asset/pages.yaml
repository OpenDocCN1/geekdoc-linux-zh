    # Playing DVDs in Xine


    Actually playing a DVD in Xine is very straightforward. Just place a DVD in your
    drive and, after the LED on the drive stops blinking, press the DVD button in
    the Xine controller window. The DVD will then start playing in the playback window.
    That''s basically it.


    # Using Xine to Play VCDs


    Xine can also play video CDss, which are better known as VCDs. As I mentioned
    in Chapter 6, VCDS are recorded on CD rather than DVD blanks. Because of the limited
    capacity of CD media, an average commercial film comes from two discs. Playing
    these discs, however, is little different from playing DVDs. Just place the VCD
    in your drive, wait for the drive''s LED to stop blinking, and then click the
    VCD button in the Xine controller window. If that doesn''t work, click the VCDO
    button instead.


    Oh, and in case you''re wondering, VCDs do not have regional encodings.


