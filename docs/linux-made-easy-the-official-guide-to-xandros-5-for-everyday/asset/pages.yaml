  md: '# 13


    # SURF''S UP

    Internet Applications


    ![](img/855e727a697c289d306bb0e488065e20_237_0.png)


    Now that you''ve gotten your computer hooked up and online (we did it in Chapter
    4), let''s take a look at the various software tools you can use to take advantage
    of the situation. Xandros comes with a wide variety of Internet-oriented applications,
    with which you will be able to browse the Web, send and receive email, pass instant
    messages back and forth among your friends, and even make long-distance phone
    calls cost-free.


    # Surfing the Web with Firefox


    The web browser that comes bundled with Version 3 of Xandros Open Circulation
    (OC), Surfside, and later releases of all other editions is the new and highly
    popular offering from Mozilla.org called Firefox. Firefox is making great inroads
    not only in the Linux world but the Windows and Mac worlds as well. In addition
    to being faster than the other popular browsers out there today, Firefox includes
    such features as tabbed browsing, pop-up window blocking,'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'spyware prevention, and Live Bookmarks. Together, all of these help to make
    Firefox a really pleasurable browser to use. As Forbes Magazine put it, Firefox
    is “better than Internet Explorer by leaps and bounds.” Can’t beat that, eh?


    NOTE Firefox was not bundled with earlier releases of Xandros, Deluxe, or Business
    Editions V3. If you are using any of those earlier releases but would like to
    join the fray, take advantage of Firefox''s new features, and follow along with
    the rest of this book, then download and install Firefox now via Xandros Networks.


    # Tabbed Browsing in Firefox


    One of Firefox’s nicest features is what is known as tabbed browsing. Tabbed browsing
    is not unique to Firefox, I admit, as it is a legacy carryover from its stable
    predecessor, the Mozilla browser—not to be confused with Mozilla.org, which is
    the creator of the two.


    Tabbed browsing is also available, albeit in somewhat hidden form, in Apple’s
    Safari browser and is now available for Microsoft Internet Explorer as an add-on,
    even though the MS people for years insisted it a feature in which their users
    were not particularly interested.


    So what is tabbed browsing? Well, when you click a link in a web page, the new
    page opens in the same window as the one you were on. In some pages, links are
    coded so that the new page opens in a separate window, or you may occasionally
    opt for opening a link in a new window by right-clicking the link and selecting
    the Open Link in New Window option. This can be very useful; once you have more
    than a few windows open at once, gets hard to find what you’re looking for in
    them. It can also slow down a bit on more challenged hardware systems as well.


    This is where the tabbed browsing feature comes in. To see how it works, and to
    give Firefox’s built-in search function a try at the same time, let’s try it out
    here and now.


    Open Firefox by clicking the Firefox launcher on the Panel (or the Launch menu,
    by selecting Applications > Internet > Mozilla Firefox), and type nyckelharpa
    next to the Google logo in the text box at the top-right corner of the window
    (Figure 13-1).


    ![](img/855e727a697c289d306bb0e488065e20_238_0.png)


    Figure 13-1: Firefox’s built-in Google search box


    Once you’ve typed that in, press ENTER, after which the results of your search
    will appear in a familiar Google search results


    In that page, right-click the top link (ANA: The American Nyckelharpa Association),
    and in the pop-up menu, select Open Link in New Tab (see Figure 13-2). If it’s
    not the first link, just read down the search results until you come to it. You
    won’t have to look far.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/855e727a697c289d306bb0e488065e20_239_0.png)


    After you have done this, the new page will appear in a new tab, and your original
    page of Google''s search results will still be there, ready and waiting in the
    other tab (see Figure 13-3).


    Figure 13-2: Opening a link in a new tab in Firefox


    ![](img/855e727a697c289d306bb0e488065e20_239_1.png)


    Figure 13-3: A link opened in a new tab in Firefox


    I am pretty confident in saying that, once you get used to this feature, you will
    never miss your browser.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'By the way, if you aren''t all that keen on right-clicking and fiddling around
    with drop-down menus every time you want to take advantage of Firefox''s tabbed
    browsing function by opening a link in a new tab, you can achieve the same thing
    by clicking the link in question with both mouse buttons in unison.


    # More on Firefox’s Built-in Search Feature


    In the previous section, you performed a Google search using Firefox''s built-in
    Internet search feature. Well, Google is not the only engine you can use by means
    of this feature. In fact, if you click the tiny arrow next to the Google logo
    in that search box, you will see a whole list of other sites from which you can
    perform searches (Figure 13-4).


    ![](img/855e727a697c289d306bb0e488065e20_240_0.png)


    > Figure 13-4: Firefox allows you to search for more than just websites


    As you will notice, these sites include the traditional search engines, such as
    Google and Yahoo, as well as such sites as Amazon.com, eBay, and Dictionary.com.
    You can search not only for information or other websites via this handy feature,
    but also for books, guides, and even the meaning of words.


    You will also notice an Add Engines item at the bottom of this menu. If you select
    that, you will be directed to a page from which you can easily add other engines.
    These include the ever-so-useful Wikipedia, Ask Jeeves, and IMDB (Internet Movie
    Database). You can add any of these (the many others available from that) to your
    search box by clicking the link for the plug-in that interests you. A small window
    will appear. In that window, you click OK, and the plug-in for that search engine
    will be immediately added to your list.


    # In-page Searches


    Sometimes you might want to search for a particular word within a certain page.
    To do this in Firefox, go to the Edit menu and select Find in This Page, or press
    the CTRL and F in unison.'
