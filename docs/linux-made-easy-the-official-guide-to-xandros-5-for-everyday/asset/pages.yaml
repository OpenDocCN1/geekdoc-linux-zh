  md: '6. Finally, in the last page of the wizard (Figure 9-6), you will be asked
    if you would like to print a test page, which isn''t a bad idea in order to immediately
    that everything has gone according to plan. To do so, just select **Yes**, and
    then click **Finish**. The wizard will disappear, and your printer will begin
    to print a test page almost immediately. If you take a look at Xandros File Manager
    window, you will find a new icon for your printer in that previously empty window.
    The icon will have a big red mark on it, indicating that it is the default printer
    for your system.


    ![](img/855e727a697c289d306bb0e488065e20_171_0.png)


    Figure 9-6: The Add Printer Wizard asks if you want to print a test page before
    wrapping up


    While your printer is at work, you will see two new items on your desktop: a Print
    Jobs window, and on the Panel, a Print Jobs toggle that looks like a small printer,
    both of which you can see in Figure 9-7. The Print Jobs window shows you what
    document is currently being printed and what other documents are queued to print
    after that. When nothing is printing or queued up for that purpose, the white
    area of the window will be blank. Clicking the toggle in the Panel acts to either
    hide or show the Print Jobs window.


    ![](img/855e727a697c289d306bb0e488065e20_171_1.png)


    Figure 9-7: The Print Jobs window and Panel toggle'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'NOTE These two items do not appear when printing OpenOffice.org documents.


    # Hewlett-Packard Printers


    As I already mentioned, if you are trying to set up a Hewlett-Packard printer,
    especially multifunction models or those connected to your computer via its USB
    port, you will see a small window after clicking the Next in the second page of
    the wizard. The window will tell you that your printer may work better with the
    HPOJ (the initials stand for HP Jet) driver, as was shown in 9-4.


    Because your system probably knows best, click OK in that window, and then click
    the Cancel button in the wizard window. After doing that, go ahead and install
    the driver using Xandros Networks. Just type hpoj in the text box next to the
    Search button in the X window. Then install the driver, listed as the HP Multifunction
    Printer Driver, using the procedure you learned in Chapter 8. If the driver is
    installed, go to step 1 of your project and start over again.


    This time around, however, when you click the Next button in the second page of
    the wizard, another window will appear asking you whether or would not like to
    use the HPOJ driver (Figure 9-8).


    ![](img/855e727a697c289d306bb0e488065e20_172_0.png)


    Figure 9-8: Telling the wizard to use the HPOJ driver (HP printer users only)


    Unless you went the trouble of installing it just for kicks, click Yes. The window
    will disappear, and you can then go on step 3 of the printer setup procedures
    I described in Project 9A.


    By the way, don''t be surprised by the fact that you do not see the HPOJ driver
    listed in the choices on the third page of the wizard; the HPOJ driver is what
    is called a low-level driver, whose purpose is to provide added functionality
    to your printer, such as the ability to read memory cards from your digital camera
    or scan images. It works in conjunction with other drivers for the actual business
    of printing.


    If you have a show-me sort of personality and want proof that HPOJ driver is fact
    installed, you can easily do so via the Xandros Networks that you learned to use
    in Chapter 8. Just type hpoj in the text box at the top of the X window, click
    Search, and then search for the driver in the list of results provided in the
    pane below. If the word Remove appears to the right of the driver in the list,
    you know it has been installed correctly. If the word Install appears instead,
    you will know that the driver was not correctly installed. In that case, just
    click the Install link to perform the installation.


    146 Chapter 9'
  merge: -1
