    # # Project 19B: Creating a Kid-Friendly (and Kid-Safe) User Account


    So now you''ve installed a heap of applications for your little ones, but you
    still don''t feel quite safe leaving them alone at helm of your computer. What
    if they screw something? What if they start viewing web pages that might corrupt
    their tender minds? And what if they dump some of your files? The list of possible
    nightmares goes on and on.


    The simple answer is to create a special user account just for them and then customize
    it so that they can do only what you want them to. Sound interesting? Here''s
    how to do it:


    +   1. Create a new user account for your children via the Control Center, as
    you learned to do in Chapter 7.

    2. Run Xandros Networks, type eyes in the text box, and then click Search. Once
    the results are displayed, click to install Eyes. After you''ve completed the
    installation, quit Xandros Networks. We''ll get back to Eyes in a moment.

    3. Log out of your own user account, and then log in to the new account you''ve
    created for your children.


    Now comes the dramatic stuff:


    +   4. Change the desktop wallpaper, as you learned to do in Chapter 3, to something
    that might make your children feel at home—a picture of Tucker, the family dog,
    or maybe a scanned image of one of your children''s drawings.

    5. Remove all of the desktop icons except for the Trash. Don''t worry, the icons
    are all just links, not the real thing, so no harm done.'
  merge: -1
  pgno: 422
