  md: '# Converting Text Documents to PalmDOC Format


    As I mentioned in the previous section, you can also install text documents (ending
    in .txt), such as letters, reports, and even books, on your PDA. If you want to
    install a document that is not in text format, you must first save it as text.
    For example, if wanted to install a really important email message you received
    from a colleague, you would first right-click the email message in your email
    application, select **Save As** in the pop-up menu, and then save it as yourfilename.txt.


    Once you have the text file you want to install, you are just about to install
    it. However, you must convert the document to PalmDOC format in order to use it
    on your PDA. Your Xandros system comes with a special utility to do just that:
    *Palm Document Converter* (Figure 12-23). To run Palm Document Converter, go to
    the **Launch** menu and select **Applications > Palm Document Converter**.


    ![](img/855e727a697c289d306bb0e488065e20_233_0.png)


    ![](img/855e727a697c289d306bb0e488065e20_233_1.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'To use the Palm Document Converter, here''s what you need to do:


    +   1. Click the icon to the right side of the text box next to the words *Text
    file*.

    2. In the add file window that then appears, navigate to and select the text file
    you want to convert. Once you''ve done that, click **OK**, after the window will
    close, and the path to the text file will appear in the previously empty text
    box.

    3. Next, type in the path and a filename for the converted file you are about
    to save in the bottom text box. Be sure to add the extension .pdb to the end of
    the file. For example, if you would like to convert a text file called RalstyMessage.txt
    to a PalmDOC format by the same name and have it in your Home folder, you would
    type */home/your_username/RalstyMessage.pdb*. Your window should then look like
    this in Figure 12-24.

    4. Once everything looks right, click the **Convert Text to PalmDOC** button,
    shortly after which a small window will appear telling you that the conversion
    was successful.


    ![](img/855e727a697c289d306bb0e488065e20_234_0.png)


    **Figure 12-24:** Text file ready for conversion to PalmDOC format


    +   5. Finally, that message window by clicking **OK**, and then close the Palm
    Document Converter window by clicking **Close**. Now you can install the new .pdb
    file on your PDA using the installation method you learned in the previous section
    of this chapter.'
