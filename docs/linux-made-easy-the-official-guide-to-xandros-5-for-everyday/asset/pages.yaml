  md: '![](img/855e727a697c289d306bb0e488065e20_442_0.png)


    Figure 20-7: Creating a desktop shortcut for Briscola


    # Playing Briscola


    As I already mentioned, Briscola is about as easy a card game as there is. Briscola
    is a trick-taking game, which means that you put out a card, and then your opponent
    puts out a card, and the one who puts out the higher-value card wins the hand,
    or *trick*, for which points are awarded on the basis of the cards involved in
    that trick. The winner of the trick then goes to *lead* the next trick, meaning
    the winner puts out his or her card for the next time. When all the cards are
    played, the points for each player are tallied, and the player with the most points
    wins. It''s all much simpler than it is to describe.


    # The Cards and Their Rankings


    Like many other Italian and Spanish games, Briscola is played with a 40-card deck,
    consisting of the following cards: K, Q, J, 7, 6, 5, 4, 3, 2, and the Ace. Traditionally,
    it is played with either French-suited cards (hearts, diamonds, clubs, and spades)
    or Italian-suited cards (swords, coins, batons, and chalices), usually dependent
    upon the region in which it is played. In the software version you have just installed,
    you will be playing with French-suited cards with images and patterns in the regional
    style of Tuscany.


    Unlike most card games you are probably familiar with, the ranking and point values
    of the cards in Briscola are somewhat different, as you can see in the following
    chart.


    416 Chapter 20'
  merge: -1
  pgno: 442
- img_proc: true
  md: '| Ranking of Cards | Point Value |

    |---|---|

    | Ace | 11 |

    | Three | 10 |

    | King | 4 |

    | Queen | 3 |

    | Jack | 2 |

    | 7 | 0 |

    | 4 | 0 |

    | 2 | 0 |


    While this ranking arrangement might seem odd, it is actually fairly commonly
    used in card games from the southern and Catholic regions of central Europe. With
    that bit of information in mind, it should be pretty easy enough to fathom, taking
    a religious view, that God (Ace) and the Holy Trinity (3) rank higher than the
    divine-rightowed royals (K, Q, J) and their decidedly mortal subjects (7, 4, 2).
    The ranks are quite sensible, albeit slightly ironic.


    # Game Play in Briscola


    Once Briscola starts up, it will deal three cards to each player. It will take
    the seventh card and place it face up under the down-failing pile of undead cards,
    known as the stock or talon. Seventh card is called the Briscola (from which the
    game gets its name), and it determines the trump suit for that particular game.
    This means that any card of the suit as the Briscola will beat any card of any
    other suit, even one of higher ranking. Of course, when you play a trump card
    against another trump card, the normal rankings of the cards come back into play.


    It is important to note at this point that unlike other trick-tricking games,
    you are neither required to follow the suit of the card led in Briscola nor to
    beat it you can. This means that if your opponent plays a club card, you can play
    a card of any suit you like, even if you have a card that can beat it, depending
    on your strategy for ultimately winning the game.


    It is a good idea to go to the Options menu before starting and select Show Score.
    This will allow you to know how you''re doing as you play. After that, and since
    your computer is always kind enough to allow you to lead, you can begin by clicking
    the card you want to put into play. The computer will then play its card (Figure
    20-8).


    Once you''ve assessed the situation, click one of the blank spaces in your hand,
    and the points for that trick will be displayed in the Box (if you won the trick)
    or the Me (if the computer won the trick). Of course, if the trick involved only
    the 7, 4 or 2 cards, no points will appear, as those cards have no point value.'
  merge: -1
