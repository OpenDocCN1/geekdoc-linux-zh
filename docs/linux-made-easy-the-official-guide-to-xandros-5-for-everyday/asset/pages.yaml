  md: '# 2


    # METAMORPHOSIS

    Installing Xandros on Your Machine


    ![](img/855e727a697c289d306bb0e488065e20_37_0.png)


    If you have already installed Xandros on your machine, you can skip right over
    this chapter and go on to the next one. If, however, your machine is still Xandros-free
    and you are ready and raring to change that state of affairs, then you had better
    stay right where you are and read on. In this chapter, I will review everything
    you need to do before I guide you through the installation steps to get Xandros
    up and happily running on your machine.


    NOTE If you are computerless at the moment or are contemplating buying a new machine,
    you might want to just forgo this whole chapter on installation and go out and
    buy a machine with Xandros preinstalled Information about the availability of
    such machines is given on the Xandros site at http://www.xandros.com/partners/oempscs.html.
    As for the rest of you... read on!'
