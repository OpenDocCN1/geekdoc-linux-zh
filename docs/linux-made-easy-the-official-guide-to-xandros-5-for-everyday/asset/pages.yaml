    Caution: Applications installed from sources other than Xandros may cause your
    system or other applications to stop working.


    Figure 8-1: The Xandros Networks application


    When you install an application in Linux, that application usually requires that
    you install one or more other files that it needs in order to function. These
    files are dependencies, and some dependencies have dependencies of their own.
    And, need I say that of those dependencies have dependencies of their own. Chasing
    down, installing, and getting all different parts to work correctly on your own
    can be a time-consuming and sometimes frustrating experience. This recurring dependency
    chase is often referred to as dependency hell, and rightfully so.


    This is where the “cool” comes into play. When you use Xandros Networks to download
    and install an application, XN downloads and installs all of the dependencies
    required in order for the application to run. So you don’t have to do any chasing
    of this or that file, and you can be pretty sure whatever you download will, in
    fact, run—and run it as is supposed to.


    Impressed yet?


    If you still aren’t convinced, think about this: almost 98 percent of the applications
    available via Xandros are free. Sure, you don’t get the pretty boxes and shiny
    shrink-wrap that you do when you buy a Windows application at the local computer
    store, but, . . . I said free! How can you not love that, cheap?


    118 Chapter 8'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'And what about that other 2 percent that aren’t free, you ask? Well, most of
    those apps are commercial offerings that you would have to pay for anyway, when
    they are downloaded and installed via Xandros Networks, you can be sure that they
    work on your system. These include applications as CrossOver Office, which allows
    you to run certain Windows applications (such as MS Office) on your Xandros system,
    or popular games such as Quake 3 and Return to Castle Wolfstein.


    # Xandros Networks First Time Out


    Well, let’s stop talking about what Xandros Networks is and instead put it into
    action. To run X, double-click the Xandros Networks on the desktop, or use the
    Launch menu and select Xandros Networks. (Xandros Networks is an Internet application,
    so you will have to be connected to the Internet when doing this.) After a few
    seconds, the Xandros application will appear, and the first time out, it will
    go through a series of steps that are most hands-off for you.


    The first thing Xandros has to do, and it will do every time you start it, is
    inventory of what is already in your system, providing it with a database that
    it can check in when you download applications. This allows Xandros Networks to
    know just what it needs (and doesn’t need!) to download in order to make your
    application work. During this time, you will see a Progress Update window (Figure
    8-2), which will automatically disappear when the process is finished.


    ![](img/855e727a697c289d306bb0e488065e20_145_0.png)


    Figure 8-2: Xandros Networks indicates its progress as it takes inventory of your
    system


    In the next phase, Xandros Networks has to check out its online repositories to
    see what is available for you.

    In the small window that appears (Figure 8-3) asking for your permission to do
    so, click OK, and the process will be hands-off from there on.


    ![](img/855e727a697c289d306bb0e488065e20_145_1.png)


    Figure 8-3: Xandros Networks asks for your permission to do an online search of
    available packages'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'Oh, and in case you''re worried about mysterious things being down-loaded to
    your hard disk, don''t be. XN will be downloading only lists and descriptions
    of what is available on its repositories, not the applications or files themselves.


    Xandros Networks will show you what it''s doing in the Progress Update window,
    which will look like the window shown in Figure 8-4 during the package-list download
    phase.


    ![](img/855e727a697c289d306bb0e488065e20_146_0.png)


    **Figure 8-4:** Xandros Networks lets you know that it''s up to it you downloads
    package lists from its online repositories


    When the package lists are downloaded, you will once again see the mercurial slide
    of the progress bar in the same window (see Figure 8-2) while Xandros Networks
    rebuilds its package database. When the process is complete, the Progress Update
    window will disappear, and the various blank parts of the Xandros Networks window
    will fill in, finally looking like what you saw in Figure 8-1.


    # Project 8A: Taking Xandros Networks Out for a Spin


