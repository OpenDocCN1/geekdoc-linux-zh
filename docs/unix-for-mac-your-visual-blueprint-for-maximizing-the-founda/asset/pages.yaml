  md: '# ARRANGE TEXT IN COLUMNS


    You can create neatly arranged columns of text by using the column command. It
    is easier to read long lists if they appear in multiple columns, as this allows
    you to see more of a file in the Terminal. The column command arranges your text
    into columns, based on the width of your Terminal. The syntax of the column command
    is:


    The maximum width of the lines in the input field determines the width of each
    column. For example, if your Terminal window is 80 characters across and the maximum
    width of all lines within it is 21, you can have three columns. You cannot have
    four columns, as they would exceed the width of the Terminal. If the longest line
    in the file is 50 characters, then you can have only one column, because you cannot
    have columns of 50 characters each within an 80-character Terminal.


    ```

    column filename

    ```


    You can also provide a list to the column command from another command by piping
    the output to the column; for example, if you want to make columns from the output
    of grep, you can type the following:


    ```

    grep ''pattern'' | column

    ```


    The column command arranges the items in the list vertically in columns. The second
    item appears after the first, and so on until you reach the bottom of the first
    column. The list then continues at the top of the second column. If you want columns
    to run horizontally then you can use the -x option with the column command.


