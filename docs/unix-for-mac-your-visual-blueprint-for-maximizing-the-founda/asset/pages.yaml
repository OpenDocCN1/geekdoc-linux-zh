  md: '# Extra


    To ensure that sendmail does not read its configuration file from NetInfo, you
    may need to type the following commands found in the /etc/mail/README


    ```

    niutil -create /locations/sendmail

    niutil -createprop /locations/sendmail

    sendmail.cf /etc/mail/sendmail.cf

    ```


    These commands tell sendmail, whenever it tries to look at NetInfo, to look instead
    at /etc/mail/sendmail.cf.


    If you encounter errors that you cannot write file types, you must open permissions
    on the /var/spool/mqueue and /var/spool/clientqueue directories. You can do this
    with the command chmod 777 /var/spool/*mqueue. These directories are used to temporarily
    store the details and content of e-mail messages before they are delivered.


    If you have trouble starting or running sendmail, you can check your /var/log/system.log
    for messages that may pertain to the problem. If you see an error message that
    the file from /etc/mail/access.db does not exist, you can create this file from
    /etc/aliases using the command makemap. The file contains lines such as test:
    user is a real username.


