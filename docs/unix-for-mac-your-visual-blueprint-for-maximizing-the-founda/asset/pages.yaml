  md: '# READ E-MAIL WITH PINE


    You can read your e-mail with pine. Pine is not difficult after you get used the
    pine commands and how pine organize your e-mail. To start pine, you can type pine
    on the command line. When you access your inbox, read and delete messages, and
    compose send e-mail.


    You can then open your inbox or another folder. The up- and down-arrow keys move
    between messages. You can display a message by pressing Return. To return to the
    message index, you can type the letter i. You can mark a message for deletion
    by detting the letter d when that message is highlighted. This pine deletes if
    you change your mind, you can un-delete the message by moving back to it and typing
    the letter u.


    The first screen of data that you see when you start pine is an upper-level menu
    that allows you to ask for help, compose a message, view your message in current
    folder, list your folders, update your address book, or quit pine. You can access
    each of these options by typing a single-command such as C to compose a message.
    This screen is called the main menu. The default focus in the main menu is to
    list your folders: if you simply press Return, pine lists


    While these one-command menus may seem cryptic at first, pine provides a list
    of the most common commands at the bottom of the screen. You can return to the
    main menu by pressing the < key one or more times. You can get help at the main
    menu by pressing the ? key. To quit pine, you can type q.


