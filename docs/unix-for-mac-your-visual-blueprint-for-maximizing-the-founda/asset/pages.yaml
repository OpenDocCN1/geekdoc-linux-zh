  md: '# SET YOUR PATH


    You can change the directories where the shell searches for commands by setting
    your path variable. Changing your path is necessary if you install any new command-line
    software on your computer.


    The default path includes /bin, /sbin, /usr/bin, and /usr/sbin because they are
    where Mac OS stores the programs that come with it. If you add new programs, you
    may install them into other directories such as /usr/local/bin, /usr/local/sbin,
    or /sw/bin. If you do not change your path, then the only way to run those programs
    is to type the full pathname before each one, as in /usr/local/bin/your filename.


    You can set your path by typing a list of pathnames in a set command. Because
    you are providing a list, you should use parentheses indent each item. For example:


    ```

    set path = (/bin /sbin /usr/bin /usr/sbin)

    ```


    This command immediately updates your path as well as the PATH environment variable.
    When you type the filename, it locates any executables in the new path; you can
    use the command to confirm this.


    If you already have a long path value, it may be difficult to retype or copy-paste
    the current path value. Instead, you can add new directories to your path by typing:


    ```

    set path = ($path /new-directory)

    ```


    $path tells you to insert the current value of the path variable before setting
    the value. You type the pathname of the new directory after $path to append it.


    Because path is a variable, any value that you set while only the terminal window
    is open. To make the changes to your path permanent, you can set the command in
    your .zshrc file.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_99_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_99_1.png)


    # SET PATH TO DIRECTORY LIST


    # APPEND TO YOUR PATH


    +   Type set path = and a space.


    +   Type a list of directories within parentheses and press Return.

    - The shell sets your path to the directory list.


    +   Type set path = and a space.


    +   Type a left parenthesis, Spath, and a space.

    - The shell adds the new directories to your path.


