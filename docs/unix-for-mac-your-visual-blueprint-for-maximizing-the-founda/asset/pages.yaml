  md: '# DELETE A DIRECTORY


    You can remove directories by using the rmdir command. One such command for this
    is to remove empty directories that make it harder to locate files you actually
    need.


    While you use the rm command to delete normal files, you cannot use it to delete
    directories. This is a safety measure to prevent you from accidentally deleting
    a directory that might contain or important files. To delete a directory, you
    must use the rmdir command.


    The argument given to the rmdir command is the name of the directory, that you
    want to remove. If the directory is empty, then the command removes it. If the
    directory is not empty, then a message appears, stating that you cannot remove
    the directory.


    In such a case you go into the directory and remove any existing files using the
    rm command, or


    subdirectories using the rmdir command. You can now remove the directory. Sometimes
    apparently directories contain hidden files — such as .DS_Store, which is a Mac
    OS X system file — and you need to remove them with the -f flag and remove them
    before removing the directory.


    While you are not allowed to remove the current directory using the rmdir command,
    you may remove it individually. If you are in the subdirectory of your home directory,
    you can use rmdir -f. However, this is not generally a good idea, because you
    can end stuck in an unresponsive-directory where you cannot even use the ls command
    to list the directories. You can use the cd command, with no arguments, to return
    to your Home.


    ```

    Terminal File Edit Scrollback Font Window Help

    ---------------------------------------------------

    $ [0] user is -f

    Books/  Movies:

    Class Assignments/  Music:

    Desktop/  Note To.Mom.doc

    Pictures/  Pictures:

    Library/  Sites:

    Magazine/  to-my.dog.log

    $ rmdir -f Magazines

    ```


    ```

    Terminal File Edit Scrollback Font Window Help

    ---------------------------------------------------

    $ [0] user is -f

    Books/  Movies:

    Class Assignments/  Music:

    Desktop/  Note To.Mom.doc

