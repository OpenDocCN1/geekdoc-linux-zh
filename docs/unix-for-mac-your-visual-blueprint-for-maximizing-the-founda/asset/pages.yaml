  md: '# MOVEMENT WITHIN VI


    You can use single keystroke commands to move through a file in the editor. One
    feature that distinguishes the vi editor from the other visual editors is the
    concept of modes. The vi editor is always in one of two states, Command mode or
    Input mode. Command mode allows you to use keystroke commands to delete lines,
    move or save files. Input modes allow you to type text at the location of the
    cursor. While in Command mode, any keystroke change to Input mode.


    To move within a document in vi, the application must be in Command mode. The
    vi editor offers many ways to navigate the content of a file, some of which appear
    on the facing page. The easiest way is to use the arrow keys to move the cursor,
    as in Pico. You can also use the letters h, j, k, and l to move the cursor around
    onscreen.


    The Command-mode keystrokes in the vi editor are usually complex as unlike the
    Pico editor, they are typed without holding down the Control key. However, the
    keystroke commands are case sensitive, which means a is a different command than
    A. You need to use the Shift key, to create the uppercase letters.


    The command in vi is much like the find command when you type a forward slash
    / and enter the word or phrase you are seeking, the vi editor automatically moves
    the cursor to the next occurrence of that text. If you type a question mark ?
    instead of a forward slash, the search occurs backwards in the file from your
    current position.


    # MOVEMENT WITHIN VI


