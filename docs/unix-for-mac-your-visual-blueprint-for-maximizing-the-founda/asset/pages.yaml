  md: "# DEVELOP UNIX APPLICATIONS 18\n\n# Extra\n\nWhenever you develop an application\
    \ using multiple source files, you can build a Makefile to define the dependency\
    \ relationships between files. If you have ever installed any applications from\
    \ source code, you have probably used a Makefile to orchestrate the compilation\
    \ process.\n\nWith a simple program like hello.c, a Makefile is unnecessary. However,\
    \ when you are compiling tools like fetchmail, the Makefile ensures that you compile\
    \ all of the proper files and that you create the final executable fetchmail.\
    \ You can also write Makefiles to include installation and cleanup instructions.\
    \ This allows the user to use `make install` and `make clean` commands to install\
    \ an application and remove object files. When you use a Makefile, you do not\
    \ need to type commands such as `make hello.c`. The make command uses the Makefile\
    \ in your current directory. With the following Makefile, you only need to type\
    \ make to compile hello.c. Be careful to use tabs after the : and before gcc.\n\
    \nExample:\n```makefile\nhello: hello.c\n\tgcc hello.c -o hello\n\n```\n\nMakefiles\
    \ allow you to control the compilation and installation processes. If someone\
    \ else is installing your application, you can give the installer files and a\
    \ Makefile, to ensure their installation is successful.\n\n| Terminal File Edit\
    \ Scrollback Font Window Help |\n|---|---|---|---|---|---|---||\n| [ferro:-~/project_X]\
    \ user% make hello Hp2 | | | | | | | |\n| cc -o hello.c hello.c | | | | | | |\
    \ | |\n| gcc hello.c -o hello | | | | | | | |\n| [ferro:-~/project_X] user% |\
    \ | | | | | | | |\n\n| Terminal File Edit Scrollback Font Window Help |\n|---|---|---|---|---|---|---||\n\
    | [ferro:-project_X] user% make hello Hp2 | | | | | | | |\n| cc -o hello.c hello.c\
    \ | | | | | | | |\n| gcc hello.c -o hello | | | | | | | |\n| [ferro:-project_X]\
    \ user% /hello Hp2 | | | | | | | |\n| [ferro:-project_X] user% | | | | | | | |\n\
    \n+   - Type make hello and press Return.\n\n+   - Make calls gcc to compile your\
    \ program.\n\n+   - Type /hello and press Return.\n\n+   - Your program runs."
