  md: '# SERVE WEB PAGES WITH APACHE


    # Extra


    You can mix PHP and HTML easily in a single file. When you do so, enclose each
    of your PHP statements in a pair of PHP tags, as in the sample below:


    Basic comparison operators include all those listed in the table below.


    Example:

    ```<?php $season="summer"; ?>

    We are now accepting reservations for our

    <?php print $season; ?>

    Call 1-800-PUN-VACS today.


    This code segment assigns a value to $season and uses this to customize the content
    of the remainder of the display. In a similar manner to Perl, PHP allows you to
    create simple data types, like $season, and arrays in you can use by a variable
    name and an index, such as $season[1].


    | OPERATOR | DESCRIPTION |

    |---|---|

    | != | Not equal |

    | == | Equal |

    | = | Assignment |

    | * | Multiplication |

    | / | Division |

    | + | Addition |

    | - | Subtraction |

    | && | Concatenation |

