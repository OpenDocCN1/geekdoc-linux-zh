  md: '# EXTEND SCRIPTS WITH SED


    The sed command allows you to modify the input or output of a Unix command or
    the content of a file without having to use a text editor. Sed is a special editor
    that can change the contents of files or the output of other commands. It can
    change lines of a file into which you pipe text and out of modified files. The
    shape of the pipe, representing a set of editing commands that you specify, determines
    what text changes and how they change.


    the command sed "s/a/z/g" changes every occurrence of the letter a in its input
    to the letter z in its output.


    If you want to change a number of strings at the same time, create a file containing
    all of your substitutions. The command sed -f infile > output looks for a series
    of requests in the file subs, applies these changes while processing the file
    infile, and writes the changed text to output.


