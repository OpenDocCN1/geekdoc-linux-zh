  md: '# UNIX WEB FILES


    You can download files with very little effort by using the curl command. The
    most obvious way to download a Web page is to type the URL in your browser''s
    Address bar or use the Save As feature, this is not necessarily the easiest or
    most efficient method. UNIX includes a line tool called curl - for downloading
    web pages. Curl works with a number of protocols, including HTTP, HTTPS, FTP,
    GOP, DICT, TELNET, LDAP, and more.


    Not only does curl allow you to download Web pages on the command line, but it
    also allows you to download files using curl commands in a script. In fact, you
    can download and install files in a completely unattended fashion. The syntax
    of the curl command is flexible enough to allow you to access multiple pages or
    sites with a single command.


    To use curl, you type curl followed by any of the options that you want to specify
    and the URL string. A command such as curl -O http://www.sandrich.com/index.html
    opens the file from the specified site to your current directory using the same
    filename. With the -o the curl command downloads the file to your screen and presents
    you with HTML.


    Curl allows you to copy more than Web pages. You can also use it to download binary
    files, including image files and software. In fact, the command is so powerful
    that Unix tools designed to locate and download applications from the Internet
    often use curl to download the data. You can use wildcards to expand the strings
    to match within the search. By using *.[a,b,c].com, for example, for the three
    systems - www.a.com, www.b.com, and www.c.com.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_161_0.png)


