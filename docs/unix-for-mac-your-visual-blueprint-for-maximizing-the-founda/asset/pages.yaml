  md: '# UNIX FOR MAC


    # LIST ACTIVE PROCESSES


    You can use the ps command to find out what processes are running on your system
    or to find the process ID for a job that you want to kill. To kill a process by
    its process ID, you obviously know its process ID. Unfortunately, Unix systems
    provide a command that gives information about running processes, including the
    process IDs.


    You can also use the ps command to display a list of all processes that are running
    on your system. Depending on the arguments that you provide, this list can include
    information about the time each process started and what each started.


    The ps command by itself displays a list of the commands you are running. To list
    system commands and the commands that other users are issuing, you add ps -aux
    command shows all processes running on the system and provides details on each
    one.


    The ps -a command lists all users'' processes. You will see some of these processes,
    while others start when the system boots.


    The ps -u command adds information such as when each process started, as well
    as how much CPU and memory each process is using.


    The ps -x command adds processes that are not associated with a particular terminal
    window, which are the processes started before you logged in.


    The most commonly used command for Mac OS X is ps -aux, which combines the most
    useful command options.


    By using the ps command followed by a vertical bar, commonly referred to in Unix
    as a pipe, you can restrict the output that it returns to your specific interests.
    ps -aux grep init displays the process and other processes that contain this name
    in yours.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_115_0.png)


