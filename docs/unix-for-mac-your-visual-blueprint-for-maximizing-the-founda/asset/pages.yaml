    Nov 18 15:13 dog.jpg |

    | | 1 staff 0 Nov 15 18:07 to.txt | | 1 staff 0 Nov 15 18:07 to.txt |

    | ([ -])user | | | | | | | | | | | | |


    # MATCH A GLOB PATTERN


    +   1 Type a command that takes a filename as an argument.


    +   2 Type a wildcard pattern that matches the files you want to select.


    +   The shell executes your command on the files specified by the wildcard pattern.


    # USE CARETS TO SELECT UNMATCHED FILES


    +   1 Type a command that takes a filename as an argument.


    +   2 ^ followed by the wildcard pattern matching the files you do not want to
    select.


    +   The shell executes your command on the current directory, except for those
    specified by the wildcard pattern.


