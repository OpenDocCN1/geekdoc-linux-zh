  md: "# ADD SIMPLE STYLES TO YOUR WEB SITE\n\nYou can add simple styles to give your\
    \ Web pages a more interesting and uniform look. The Cascading Style Sheet (CSS)\
    \ allows you to define styles within or independent of your Web pages, and apply\
    \ these styles to your Web pages in conjunction with HTML formatting.\n\nYou can\
    \ also define in one centralized file, or external sheet, the formatting and layout\
    \ for multiple Web pages. This approach allows you to apply consistent styles\
    \ without having to recreate them in every page. In addition, if you need to make\
    \ a change in the overall style of your Web site, you only have to edit that one\
    \ file.\n\nA style is a rule that associates display properties – such as both\
    \ and blue – with a particular HTML tag. The simplest way to define an internal\
    \ style is to insert the style directly into your document. For example, to specify\
    \ that a single heading is both bold and blue, you can:\n\nTo create a style sheet,\
    \ you must create a file that contains the style definitions that you want to\
    \ use. Identify this file with the extension .css. A CSS file contains style definitions\
    \ such as the following:\n\n```\n<h2 style=\"color:blue; font-weight:bold;\\>Birth\
    \ Until Now</h2>\n```\n\n```\nh2(font-weight:bold; color:blue);\n```\n\nThis style\
    \ only applies to the text between the <h2> and </h2> tags.\n\nYou can then use\
    \ a link or @import command to use your cascading style sheet in your Web pages.\n\
    \nTo force all of <h2> level headings to be bold and blue, you can change the\
