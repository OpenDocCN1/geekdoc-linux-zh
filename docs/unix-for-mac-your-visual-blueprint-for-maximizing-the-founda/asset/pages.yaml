  md: '# RENAME A FILE


    You can change the name of a file with the mv command. In Aqua, renaming files
    and moving files are two different functions. You move a file in Aqua by dragging
    it to a new location, and rename it by clicking the name field of the file and
    typing a new name. However, when you are simply moving the file to a new place
    in the file system; even if you are within the same directory, you are moving
    the file to a new name.


    To avoid this problem, you can use the -i option with the mv command. If moving
    your file will overwrite another file, the shell asks you to confirm that you
    want to proceed. If you do, you can type f for yes, or any other key for no. To
    be safe, you should make a habit of using the -i option. You can also set a shell
    alias to automatically use the -i option with the mv command.


    However, if you move a file to another that already exists, you will overwrite
    that file. This is not a good practice unless you are certain that you will overwrite
    the second.


    You can use the mv command to move a file from location to another. When you move
    a file with a command such as file /directory, the resulting file is the original
    name, but resides in a different directory. It is only when you move a file to
    a new location and filename that you rename it.


