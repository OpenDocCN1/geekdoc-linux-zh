    # Extra


    If you use output redirection to save the output of the diff command into a file,
    the result is a diff file. You can use a diff file to record changes between files.
    For example, you may update a Web page by saving a copy of the HTML text document
    and then changing a few lines. You can use the diff command to determine what
    changes you made, and save the results in a diff file.


    The patch application uses a diff file to update an original file with the changes
    made to the diff file. This is useful if you are compiling new applications from
    updated source code. You can also use the patch application to update a configuration
    file or any other text file. The syntax for the patch command is


    ```

    patch original-file-diff-file

    ```


    The original file, without the patches, is saved as original-file.


    You can use the output of the diff command with the ed command, a command that
    lets you edit text. To make the output of the diff command into an instruction
