  md: '# TRANSFER FILES


    You can often obtain needed files and applications from other systems. You can
    move files between your system and others using ftp. Approximately as old as telnet,
    the ftp command has been enabling Unix users to upload and download files for
    decades. The usage is fairly simple, although ftp servers provide a wide range
    of commands.


    In its simplest form, ftp allows you to log on to a system, upload files using
    the put command, download files using the get command, and move around the directory
    structure on the remote system. You can transfer data in binary mode or ASCII
    mode. ASCII mode is designed for text files, and ftp translates between Unix and
    DOS systems. Binary mode is designed for software, image files, and other types
    of files that use non-printable characters that might interfere with the transfer.


    One popular form of ftp is called anonymous ftp. When using anonymous ftp, you
    type your username and e-mail address or character as password. Anonymous ftp
    allows people who do not have accounts on a system to upload or download files.
    For example, set a drop box for your customers to upload error logs so you can
    analyze the problems they are having with software you do sell. Many choose anonymous
    ftp. Like Apple, that provide documentation and software tools to their customers
    so using anonymous ftp.


    You should cd into the directory where you want downloaded files stored before
    you start your ftp session. Like telnet, ftp is not enabled as a service on Mac
    OS when you first installing the operating system.


