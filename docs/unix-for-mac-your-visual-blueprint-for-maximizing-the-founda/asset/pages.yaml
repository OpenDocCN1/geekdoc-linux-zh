  md: '# MANAGE THE PRINT QUEUE


    You can use the lpq command to examine your print queue and cancel print requests.
    This command also lists jobs that are waiting in the queue. As the printer handles
    each print request, the job disappears from the queue and the next job in line
    starts printing. The cancel command cancels a selected print job, removing it
    from the queue and leaving the remaining jobs to be printed.


    Some users request a printout of a document several times in a row before checking
    to see if the reason that it does not print is there is no paper. When this happens,
    it is a good idea to cancel all but one of these print jobs. Other users may print
    a document in the wrong format and end up printing pile of paper that they cannot
    use. Canceling these jobs can save both time and paper.


    You have numerous reasons to examine a print queue and to cancel jobs. For example,
    if you are waiting a long time for a printout, you can check the queue to see
    what other jobs are being printed. If the printer has been out of paper for a
    while, you can view where your print job is in the queue, and decide whether to
    cancel the job.


    To submit a job from the command line, you can use the lpr command to send the
    file you want to print to the printer. Applications, such as Photoshop, also submit
    print jobs and these also appear in your print queue. You can view all of the
    pending print requests using lpq, where the print requests are generated by applications
    or the lpr command regardless of who submitted each request.


    # MANAGE THE PRINT QUEUE


