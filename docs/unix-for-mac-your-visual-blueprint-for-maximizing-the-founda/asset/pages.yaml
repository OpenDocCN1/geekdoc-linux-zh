    | Library]cat - to-do.txt |


    ```


    ```


    # VIEW TEXT FILES


    Type the name of a text file and return.


    The shell displays the contents of the file.


    +   - Type cat and a space.


    +   - Type the name of a binary file and press Return.


    +   - This is an example of a Meta-Control-T character.


