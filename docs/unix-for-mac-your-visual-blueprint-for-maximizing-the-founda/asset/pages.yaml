  md: '# FITTING INTO THE INTERNET


    # SERVE WEB PAGES WITH APACHE


    Web servers depend on the Domain Name System (DNS) to function, just like other
    Internet services. When you type a URL as http://www.dragonflyditch.com, you are
    simultaneously specifying a number of things. You are designating that HTTP is
    the protocol — the limited language that describes communications between client
    and server — used to communicate with the server. This is the primary protocol
    used by the Web, but not the only


    one. By typing dragonflyditch.com, you are identifying a particular server and
    relying on the services of DNS to translate this textual name into an IP address
    so that the DNS can use the IP of address to locate and communicate with that
    server. By typing nothing, you are indicating that you want to communicate with
    the server running on the default port for web server port 80 and you are ensuring
    that you want the home page or default document for the site.


    # APACHE CONFIGURATION


    The configuration on the server end determines which directory on the server contains
    the documents and files available for viewing. For Apache, this directory is called
    the document root. On a properly configured web server, visitors can view or download
    files outside of this directory.


    The configuration on the server end also determines which file server transfers
    to you when you type www://dragonflyditch.com in the URL name. Whenever


    entering a URL that does not contain a filename, Apache looks through a list of
    default documents for one that matches a document in the requested directory.
    If the document list contains index.html and index.jsp, and the document contains
    neither of these files, Apache returns to one of two: an error code or a directory
    listing. The service depends on whether directory browsing is enabled.


    # BEHIND THE SCENES


    While a GET / request may appear to be a very modest service, retrieval of the
    home page for most web sites results in a number of requests as each frame and
    image contained in the file is subsequently requested. Until your browser obtains
    all the parts of a page from the server, the Web page is incomplete.


    While the early Web, Web servers delivered static pages to their clients. Web
    servers today often offer custom pages. For example, they may offer forms for
    you to fill out whose contents are posted, or to the server for additional processing,
    or they may call on encryption services to hide sensitive data from prying eyes
    as the data transfers to the server for processing.


    While the protocol that the Web uses to move files and data back and forth is
    itself simple, with a handful of commands such as GET and POST, the communications
    between client and server often include a list of additional information, the
    headers that you send with your requests. By the use of these headers, clients
    and servers can compare notes on what of them is capable of. For example, a Web
    server does not save a file in a format that your browser understands. When multiple
    sites are supported on a system, and identified by their names — such as dragonflyditch.com
    — the server knows which site you are requesting because the name is included
    in the headers.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_240_0.png)'
