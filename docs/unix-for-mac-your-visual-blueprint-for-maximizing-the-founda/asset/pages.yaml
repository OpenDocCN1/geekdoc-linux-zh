  md: '# RUN A DATABASE ON MAC OS X (CONTINUED)


    While it might not be immediately obvious, a database is form of server – a process
    that supplies information to clients. After a database is created with createddb,
    initiated with initdb, and populated with tables, the database is ready to start
    answering queries. Most databases run all the time whether or not anyone is using
    them.


    After a database is created with createddb, initiated with initdb, and populated
    with tables, the database is ready to start answering queries. Most databases
    run all the time whether or not anyone is using them.


    When you start a psql command and connect to a database, you are acting as a client
    of the database. You can select data from tables by searching for certain values
    and restricting what you can see from these tables as columns well.


    PostgreSQL like most modern databases, is a relational database. That term implies
    that all data are stored in a uniform manner – unlike tables, in which elements
    have parent/child relationships, relational databases have no such relationships.
    Instead, data of all kinds is stored in tables and all records are accessed in
    the same manner.


    The basic query command is select, a query that selects from contacts, phone is
    a column in a named table contacts. If you select from contacts where code equals
    to 415, you are listing contacts in San Francisco. In this case, you are asking
    to view one particular column from rows in the table of contacts.


    While SQL, the standard language used for relational databases, is not exactly
    free-flowing English, it is still easy to use and understand. The command select
    phone from contacts where code=415; is as close to following English syntax comes.


    SQL also allows you to insert data into tables with insert, remove data from tables
    with delete, modify data in tables with update and sort data with order by.


    # RUN A DATABASE ON MAC OS X (CONTINUED)


