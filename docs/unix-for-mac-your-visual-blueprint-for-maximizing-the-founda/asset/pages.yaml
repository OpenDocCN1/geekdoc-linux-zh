  md: '# CHECK DISK USAGE


    You can use the df and du commands to determine how much space is available on
    your disks and how much space is used, respectively. The df command tells you
    how much disk space is allocated, used, and when you use the df -k argument, space
    appears in kilobytes instead of 512-byte blocks.


    One of the columns in the df output is Capacity. This shows how much room you
    have in your file system leaves as a percentage of the overall space available.
    Most Unix system administrators try to keep file systems at less than 90 percent
    capacity because they perform better when there is adequate free.


    You can use the du command to determine how much space a particular directory
    uses. This command can help you track down files that consume a lot of space in


    system is running out of space. For example, if you cd into a particular directory
    and use the command du -sk, you receive a list of the contents of that directory
    sorted in size order. This is very helpful if you want to know where most of the
    disk is being consumed.


    You can use the df -k command to see how much space remains on your disk. When
    a file system approaches full capacity, the responsiveness of the system decreases,
    although any file system that is less than 90 percent is not a reason for concern.
    At the same time, any file system jumps in size in a short amount of time may
    do so. The rate at which a file system is growing suggests how you will run out
    of space.


