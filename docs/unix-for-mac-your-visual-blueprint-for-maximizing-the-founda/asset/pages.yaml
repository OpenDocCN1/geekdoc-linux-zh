  md: '# SAVE A FILE WITH VI


    When you finish editing a file with the vi editor you save your work. It is a
    good practice to use the save command any time you make changes that you do not
    want to lose. To save the current file, you can type :w and return. vi saves the
    file to your hard drive and any changes you make permanent. The vi editor displays
    the file, the number of lines, and the number of characters in the file after
    you use.


    You may name your text file whatever you like, but for compatibility with Aqua
    applications, you should append text files with the file extension .txt. However,
    if you are creating a specific type of text file, such as an HTML file, a Cascading
    Style Sheets, or an XML sets file, you must save it with the appropriate extension
    as .html, .css, or .xml.


    You can save the file with a different name by typing a filename before returning.
    For example, to save the file as my-update.txt, you can type :wmy-update.txt and
    press return. To exit without specifying a filename, you must remember to save
    with a new name, or vi saves it in the /tmp directory with an arbitrary name as
    vi.XXXXp.


    To exit the vi editor, you can type the quit command as :q; you can combine the
    :w and :q together as :wq, which saves the file and exits the vi editor, returning
    you to the shell. If you have made changes but do not want to save them, you can
    exit vi by appending an exclamation point (!) to :q.


