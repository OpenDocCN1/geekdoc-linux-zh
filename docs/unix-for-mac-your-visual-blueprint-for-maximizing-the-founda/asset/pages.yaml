  md: '# DEVELOP PYTHON APPLICATIONS


    You can develop Python applications on your Mac OS X system. Python installs with
    the Mac OS X Developer tools as out=/usr/bin/python. The command which prints
    this path; if it does not, you must check your PATH variable and install it.


    Python is an interpreted, interactive, object-oriented programming language. Unlike
    C programs which you compile, and Java programs which you run on top of a virtual
    machine, Python programs are more like Perl scripts. However, the object orientation
    of Python gives programs a distinctly different character.


    Even if you are not already familiar with object-oriented programming, you can
    write useful Python scripts. However, to make full use of the language, you must
    develop an understanding of object-oriented programming. In many fact, people
    consider such languages as Python to


    be transitional languages, because they allow you to write programs while you
    are only beginning to grasp the concepts of object-oriented programming.


    Languages like C and scripting languages like Perl are procedural languages. This
    means that portions of code are organized into functional elements called procedures
    or subroutines that you use in the remainder of the code. Object-oriented languages
    work differently in they define objects and then a set of operations that you
    can perform on them. You refer to these as methods.


    Where Perl prints to a file using a command as print $filename processed; Python
    uses test out_file.write("Hello\n"); While, on the surface, these commands may
    not seem different, the implementation and coding method are radically different,
    and you encounter these differences as


