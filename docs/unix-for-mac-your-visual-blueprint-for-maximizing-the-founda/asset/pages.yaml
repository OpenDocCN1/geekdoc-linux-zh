  md: '# DESKTOPS


    While you will probably install only one version of X Windows on your system,
    the choice of which window manager and desktop to use up to two. Two of the more
    popular desktops are GNOME and KDE, both of which are popular with the Linux community
    and increasingly available for Mac OS using XQuartz project, which refers to X
    Windows on Mac OS, is a good source of information and software.


    You also have a choice of what clients to run on your server. The xterm client
    is a terminal tool much like the


    Terminal application on your Mac OS X Aqua desktop, except that xterm runs on
    an Xserver. Similarly, xclock is an X Clock. While these tools are fairly basic
    and part of every X Windows implementations, they do not limit what of an installation
    of X Windows can do for you. Many powerful applications, such as OpenOffice, an
    office tool much like Microsoft Office, and the Gimp, a sophisticated image-editing
    tool, are available to you free if you install X Windows.


    # HISTORY OF X WINDOWS


    The X Windows System was originally developed at MIT with support from DEC. It
    was originally meant to provide a distributed hardware-independent user interface
    for the Athena project. The software reached


    version 11, sometimes referred to as X11, before a general interest had developed.
    Control of X11 has been since taken over by the X Consortium which now maintains
    the standard.


    # DISPLAY AND THE XHOST COMMAND


    When using X Windows, your display has an address that is associated with the
    environment variable DISPLAY. If you print the value of this by typing echo $DISPLAY
    in a Terminal window running on X server, you will notice that the display will
    be set to 0.0 or something like it. While this address may seem to have no significance,
    it actually refers to the server associated with the first X server on your system.
    The address of your display from the perspective of another system on your network
    will be ferro@0.0 if your hostname was ferro.


    Run the xhost command on the X server to give permission to the remote system
    to view your screen.


    The xhost command can be run in such a way that it only allows a specific client
    or so that any can write to its display. It is generally more secure to restrict
    access to your screen, of course, depends on your position with respect to the
    security of the network to which you are connected.


    When you are generating a display on one system and sending it to another, you
    will need to do this:


    +   1) Set your DISPLAY variable on the system where the client is running; this
    is the system generating the display.


    To send out from an X client to the X server running on ferro, you would set DISPLAY=ferro@0.0
    and xhost + on ferro to allow any system to update your display. Enter a specific
    hostname instead of the plus sign (+) if you want to restrict this access.'
