  md: '# INSTALL AND USE INTERNET APPLICATIONS


    # Extra


    Messages that you move to other folders are stored in files in your mail directory.
    For example, if your username is sbob and your home directory is /Users/sbob,
    your mail folders are stored in /Users/sbob. Each file represents one of your
    mail folders, and pine stores as a standard UNIX mail file. Messages begin with
    the string From:, followed by the e-mail address of the sender, and a date/time
    stamp.


    To add a signature to the messages you send with pine, you can create a .signature
    file in your Home directory. pine reads the contents of this file and appends
    your signature to the bottom of every message you compose. You can create a signature
    file using any text editor or on your command line.


    Example:


    ```

    echo "Fred T. User, Minstrel" >> .signature

    ```


    If you copy a mail file to your mail directory or remove one, pine accommodates
    and lists the new set of folders. This pine does not maintain any internal representation
    of your mail folders. it simply looks at the files in your mail directory and
    displays them to you as a series of individual messages.


