  md: '# SHUT DOWN AND RESTART THE COMPUTER


    You can shut down or restart a Mac OS system from the command line instead of
    the Aqua interface if you have access privilege. This is useful if you are not
    sitting at the keyboard. The command to shut down Mac OS is `shutdown`. Although
    not the only way to shut down, it is effective. Using the shutdown command allows
    you to send warning messages to users still logged into the system that you are
    shutting down. This gives them time to finish what they are doing and log off.


    You can also specify a warning message that appears to users. You can tell users
    that, although the system will be shutting down, it will be available again at
    a specified time. For example, the `shutdown +15 ferro` might be used for emergency
    service, `please log off` allows users to finish what they are doing, while letting
    them know that the system will be down for a bit of time.


    You can specify the time at which the system shuts down by entering a time in
    the `ymmddhh` format, or by entering a number, such as `+15`, to specify that
    the system shuts down in 15 minutes.


    The halt and reboot commands do not provide users with a grace period to complete
    their work, but terminate processes before the shutdown. Both commands allow for
    a `-f` argument, which changes the way they run. For example, both of these commands
    shut down without terminating processes.


    # SHUT DOWN AND RESTART THE COMPUTER


