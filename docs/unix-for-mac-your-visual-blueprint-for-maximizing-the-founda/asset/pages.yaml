    SHELL VARIABLES


    +   1 Type set and press Return.


    +   The shell displays all shell variables.


    This is an example of a Shell variable with no value.


    This is an example of a Shell variable with a value.


    # SET SHELL VARIABLE


    +   1 Type set and a space.


    +   2 Type a variable name and press Return.


    +   The variable is set but has no value.'
