  md: '# MANAGE FINK WITH FINCOMMANDER


    You can download software using FinkCommander, a graphical interface that works
    with Fink.


    FinkCommander provides a GUI front to the Fink software package management tool.
    Using this front, you can select the software to install and initiate the installation
    by picking the software from a list of available packages. Fink provides a variety
    of information on each of the packages.


    While using Fink, you can pick and choose which items by selecting or deselecting
    them from the Menu View. Latest is the most recent available version. The version
    that is installed on your system. Binary is the most recent stable version. Unstable
    is the most unstable version. Status is the status of your registration — current
    or outdated. Category is the software category, as base, database, or


    game. Description is a description of the tool. Maintainer is the name of the
    person who maintains the tool.


    You can also filter the list by selecting a column, such as Name, from the menu
    in the toolbar. When you select a column, you can then type your in the text field
    to the right. For example, you can list the available games by selecting Category
    and typing things into the text field. You can find any column by clicking the
    top of the column.


    When you download software, you can watch the progress of your download in the
    bottom window of the screen. FinkCommander allows you to provide positive or negative
    feedback to the manager of a package by selecting the green for positive or red
