  md: '# COMBINE UNIX AND AQUA


    # # Extra


    Two other commands work with resource forks to ensure that the Mac OS Finder has
    access to metadata. These commands are the CpMac and MyMac commands. CpMac is
    a version of cp that copies files with resource forks, and MyMac is a version
    of mv that moves files while preserving resource forks.


    The CpMac and MyMac commands are not automatically installed on all Mac OS X computers,
    but are on the Mac OS X Developer Tools CD-ROM. For more information on installing
    the Developer Tools, see Chapter 12.


    The executable files for CpMac and MyMac are stored in the /Developer/Tools directory.
    If you have not added that directory to your shell''s path, you will have to type
    the full pathname to use these commands.


    Example:


    ```

    [--]user du -s cat-pics/

    48744 cat-pics-/

    [--]user cp -r cat-pics/ cat-pics-cp

    [--]user du -s cat-pics-cp

    39782 cat-pics-cp

    [--]user /developer/Tools/CpMac -r cat-pics/ cat-pics-MyMac

    [--]user du -s cat-pics-MyMac

    48744

    ```


