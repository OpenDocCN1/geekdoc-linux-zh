    $number. Following the foreach command, you can enter whatever you want to execute
    for each $number. You terminate your loop by entering the word end on a line by
    itself.


    For some tasks, the number of times you want to loop through a set of commands
    depends on the value of a certain variable or some other condition. For example,
    if you want to write a script that adds two numbers, you write it so that it adds
    until the person running the script stops numbers. In this case, you use a while
    loop. A while loop continues executing as long as the specified test condition
