  md: '# SUSPEND THE CURRENT PROCESS


    You can suspend a process to regain control of the command line, and from that
    point, kill the process, move it into the background, or leave it suspended until
    you are ready to restart. Just as almost everything that makes up a Unix system
    is a file, almost everything that a command is a process. The shell responds to
    your command by forking a new process. Each command you enter is a process. When
    you ask what system processes are currently running, that too is a process. Unix
    makes little distinction between files, applications, and personal files; it makes
    little between system processes and the commands you enter in a terminal window.
    The activity of the system is implemented as a series of processes.


    and suspend them if you have sufficient privileges. You can also move processes
    to the background so that you can issue other commands.


    Every process has a process ID — a unique identifier that the system assigns.
    While you enter a command in your shell, shell is an active process. When you
    press return, the command that you entered starts running, and your shell is suspended
    until that process completes.


    You can suspend a process by pressing Control + Z. When you suspend a process,
    it cannot run. It does not access files, accumulate run time, or task the CPU.
    A suspended process is also referred to as a stopped job.


    Unlike some operating systems, Unix systems like Mac OS allow you to get a list
    of information about the processes that are running on your system. In fact, you
    can start, stop,


    # SUSPEND THE CURRENT PROCESS


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_107_0.png)


    # RUN SEQUENTIAL COMMANDS


    +   In a Terminal window, type the command find /usr-name ps -print and press
    Return.


    +   The command starts looking for a file named ps.


    +   Type date and press Return.


    +   The system ignores the date command, storing it in a queue, until the find
    command finishes.


    +   The find command generates a lot of output.'
