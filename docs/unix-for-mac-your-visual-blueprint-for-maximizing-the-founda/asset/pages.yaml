  md: '# SEND E-MAIL FROM UNIX


    You can create and send messages from the command line in Mac OS X, as you can
    with most UNIX systems. You do not need to open up a mail client. The easiest
    and fastest way to do this is by using the echo command to create a message and
    then piping the message to the mail command. For example, you can type the message
    on the command line and add it to the inbox of user shs.


    Your recipient can read your message in a variety of ways. If they are a command
    line user like you, they may opt to use the mail command by typing mail on a line
    by itself. As messages appear, they can read them one at a time or delete them
    without reading them. If they want to respond, they can do that, too. The mail
    command includes the arguments freely and for delete. In the case of multiple
    e-mails, selects the message number and presses Return. If your system is set
    up with a mail client, you may prefer to open your mailbox using one of these
    tools.


    echo do not forget we have a lunch date today | mail -s "lunch" shs


    If you want to send a longer message, you can run the mail command - for example,
    mail -s shs - and then type your subject line and message. When you are finished
    typing your message, enter a period (.) on a line by itself, and the system sends


    # SEND E-MAIL FROM UNIX


    | Terminal File Edit Scrollback Font Window Help | Terminal File Edit Scrollback
    Font Window Help |

    |---|---|---|---|---|---|---|---|n| [ferro:-]mail]user echo "Can you read this?"
    mail -s "test" user | [ferro:-]user echo "Can you read this?" mail -s "test" user
    |

    | [ferro:-]mail]user | Subject today''s meeting |

    | | I will arrive to meet you this afternoon. Please tell jokes until I get there.
    I everyone needs to be in a good mood |

    | | Thanks |

    | | EDT |

    | [ferro:-]user | |


    # SEND A MESSAGE


    +   1 Type echo "Can you read this?" followed by a space.


    +   2 Type mail -s "test" followed by a space.


    +   3 Type your username, and press Return.


    +   4 Type mail followed by a space and the name of a user, and press Return.


    +   5 Type a subject line at the prompt, and press Return.


    +   6 Type your message, and press Return.


    +   7 Type a dot (.) on a line by itself, and press Return.


    The mail system delivers your message.'
