  md: '# UNIX MAC


    # SET ENVIRONMENT VARIABLES


    You can change values that applications inherit by setting environment variables.
    Environment variables are similar to shell variables. Any command that the shell
    can access environmental variable settings; environment variables represent the
    environment in which you run. Depending on the command, the shell may or may not
    use an environment variable to affect the execution of the command.


    The variable, unlike the set command, the setenv command requires no sign equal.
    You should type environment variable names in all capital letters to distinguish
    them from shell variables.


    If you set a value in less, the less command uses the EDITOR environment variable,
    so that you edit the file that displays. To set an environment variable, you use
    the setenv command:


    You can get a list of the current environment variables and their values by typing
    the printenv command. If you compare this to the shell variables viewed by typing
    set, you can see that there is some duplication. Pairs of variables such as HOME,
    TERM, and SHLV/SHLVL have the same names and values. This duplication allows the
    values to be accessed by the shell as well as by commands within the environment
    of the shell; pairs automatically link so that one changes the other.


    ```

    setenv VARIABLE ''value''

    ```


    The first example sets a value without a variable, that with a null value, and
    the second example gives a value to


    If you need to unset an environment variable, you can use the unsetenv command.
    Your environment variables last only as long as the terminal window is open, unless
    defined in your tcshrc.


