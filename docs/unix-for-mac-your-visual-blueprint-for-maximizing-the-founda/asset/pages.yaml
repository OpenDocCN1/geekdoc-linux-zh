  md: '# # INSTALL PINE


    Pine is a text-based e-mail program that has been in use on UNIX systems for many
    years. You can install pine on your Mac OS system using Fink or FinkCommander.
    Otherwise, you can download pine from https://www.washington.edu/pine. You can
    then uncompress and install the installation file as is described in Chapter 12.


    The first time you run pine, it creates a configuration file in your Home directory
    called pincerc. This file allows you to modify a number of configuration parameters,
    such as your name appears in messages you send. Like most UNIX configuration files,
    any line starting with a # is comment.


    To create the application, you can use build os. This command takes the place
    of the normal make command and builds a binary for your Mac OS X. When the process
    is finished, you have a directory containing programs that you can copy to other
    locations on your system. You can refer to the README for directions that may
    pertain to your system.


    To make use easy, ensure that it is on your search path. This allows you to start
    pine by typing pine on the command line. You can verify that pine is on your search
    path by typing pine. This command returns the full path to the pine executable.


    Some other tools that are combined with pine are useful if you set up as a mail
    server. The imap, ipop2, and ipop3 are servers that allow mail clients to download
    e-mail. These tools support IMAP, POP2, and POP3 protocols, respectively.


