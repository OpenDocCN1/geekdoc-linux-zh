  md: '# INSTALL CGI SCRIPTS


    You can install Common Gateway Interface, CGI, scripts to make your Web site interactive.
    CGIs enable your Web pages to exchange information with other programs running
    on your system. Many CGI programs collect information from your Web site, usually
    through a form, and pass that to a program which processes the data. Other CGI
    programs simply collect data and display it.


    You must set CGI programs to be executable before you run them from your Web site.
    This means that they must execute permission so that anyone can execute them.
    You can add Execute permission using the `chmod a+x` command.


    You can find many CGI programs on the Web and install them on your system. Many
    programs include counters that increment each time a new client visits your site,
    and forms that allow your visitors to sign a guest book.


    Programmers usually write CGIs in Perl, because Perl is one of the most versatile
    and popular programming languages. You can however, write CGIs using many different
    languages.


    There are many Web sites from which you can download pre-existing CGI scripts.
    You can also create your own CGI scripts; there are many books and Web sites that
    teach you what you need to know to code in Perl and to build effective CGIs. Your
    visual blueprint for building Perl scripts is by Paul Whitehead, Wiley Publishing.
    You can also find a Web tutorial at www.cgi101.com/class/


    To use CGIs on your Web site, you must enable them in your http.conf file, and
    you must store them in the proper directory. CGIs normally run in the cgi-binary
    directory, most likely /sw/apache/cgi-bin on your system.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_253_0.png)


