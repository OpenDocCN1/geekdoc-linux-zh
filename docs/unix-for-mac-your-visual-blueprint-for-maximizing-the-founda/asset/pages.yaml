- img_proc: true
  md: '# RUN A PROCESS IN THE BACKGROUND


    Running a command as a background process allows you to continue running commands
    while the process runs suspended; a process running in the background does not
    continue. When you run a command in the Terminal application, the output from
    the command appears on screen. When it finishes, other commands can run. When
    the background process finishes, your command prompt returns.


    Unix allows you to run commands in the foreground or in the background. Unlike
    commands in the foreground, commands run as background processes allow you to
    enter additional commands. Your shell continues prompting and you can continue
    entering commands.


    The simplest way to run a command in the background is to start it in the background.
    You can run a command in the background by adding the ampersand (&) to the end
    of the command line. For example, if you find


    command, type an ampersand at the end of the line, and press Return, the find
    command continues processing and writes to your screen as it locates files that
    meet your search criteria. At the same time, you have control of the command line
    and can issue other commands while the find command continues to run.


    Like suspended processes, jobs that run in the background have both a job number
    and a process ID. Both suspended processes appear in the listing when you use
    the jobs command. The important difference between a suspended process and a background
    process is that a background process continues to run while a suspended process
    is inactive.


    Running commands as background processes allows you to get more work done in a
    single Terminal window. If you press Control + D to exit while there are background
    processes, the system issues a warning.


    # RUN A PROCESS IN THE BACKGROUND


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_111_0.png)


    +   - Type find /-name fg -print & and press Return.

    - A message displays that your find command cannot search some directories.

    - The job number and process ID of the background process appears.


    +   - Type date and press Return.

    - The find command continues running in the background, while you enter the date
    command and get your output.'
