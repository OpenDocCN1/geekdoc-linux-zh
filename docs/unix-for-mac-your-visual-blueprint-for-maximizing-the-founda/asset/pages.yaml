    +   * Using system administration commands

    * Installing and using Internet applications

    * Running the X Window System

    * Developing new Unix applications


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_353_0.png)


    # COMPILE A PROGRAM WITH CCC


    You can compile any code written from source with any compiler, but most users
    find it easier to use ccc, which is the GNU command used to compile C programs.
    In this example, we will compile a simple program called hello.c. To compile the
    program, type the following command in the terminal: ccc hello.c -o hello. This
    compiles the code and creates an executable file named hello.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_353_1.png)


