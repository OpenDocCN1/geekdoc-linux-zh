    # MONITOR THE TOP PROCESSES


    You can use the top command to find out which processes are using the most resources
    on your system. Knowledge is especially useful when your system is running slowly.
    Although processes appear to be running simultaneously, actually takes turns using
    the CPU. This sharing happens at an extremely rapid rate, but you can view some
    process details using commands as ps and top.


    While the ps command allows you to view important statistics related to processes
    – such as how much memory they are using – the ps output display is somewhat related.
    To examine processes to determine how much demand they are placing on the system,
    the tool is more appropriate. The top command orders its output to display the
    tasks using the bulk of CPU time available at top. The columns in the top output
    are similar to those


    the ps command displays. In addition, the top command provides useful information
    about processes in general and system performance.


    The information included in the output for each process includes the process ID
    (PID), the simple command without arguments, and the percentage of CPU usage.
    It also includes information on threads and memory sizes.


    Some of the information top command displays you a lot about system performance.
    For example, if a system is not more 90 percent idle, you know that the system
    is not running more than it can and you can assume that performance is good. Another
    good indicator of performance is the system load. The top command has numerous
    options that you can use to interpret its behavior. For more information on these
    options, type top and return.


