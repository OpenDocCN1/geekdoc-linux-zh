  md: '# EDIT .TCSHCR FILE


    You can save the commands to set your prompt, aliases, shell variables, your environment
    variables, and your path so that time you open Terminal, your shell is configured
    to your preferences.


    You can also use the example tcsh files that are located in the /usr/share/tcsh/examples
    directory on your computer. You can add a line at the very beginning of your .tcshrc
    as follows:


    You save these commands in a special file called .tcshrc that you create in your
    Home directory. The dot, or underscore, at the beginning of the name indicates
    that it normally hides from the Mac OS X Finder and from the ls command, although
    you can still see it with the -a option. It is common for Unix programs, such
    as the tcsh, to store their configuration settings in an invisible file in your
    Home directory. These files persist for a period and after a reboot.


    ```

    source /usr/share/tcsh/examples/rc

    ```


    The source command tells the shell to read the commands from a text file and run
    them as if they are entered directly into your Terminal program. As a result,
    the commands in your .tcshrc file are executed upon starting, run the commands
    in the /usr/share/tcsh/examples/rc file. For more information, you can use /usr/share/tcsh/examples/README
    to store your aliases, variables, and environment variables in separate files
    as described in the README file, although it is acceptable to set them all within
    your .tcshrc file.


    The tcsh executes all commands in your .tcshrc when you open a Terminal window
    or start a shell. To create your .tcshrc file, use any text editor like Pico,
    vi, or emacs, and enter one command per line.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_100_0.png)


    +   - Type cd –

    This takes you to your Home directory.


    +   - Type .tcshrc and press Return. The text editor opens the file for editing.


    +   - Type the commands to set your preferences. Save the file, and exit the editor.


    +   - When you start a new Terminal, the shell executes the commands in the .tcshrc
    file.


    +   - Type the name of a text editor command and a space.'
