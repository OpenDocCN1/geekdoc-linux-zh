  md: "# # EXTRACT TEXT FROM A FILE\n\nYou can find and display lines within a text\
    \ file that match a pattern with the grep command.\nThe **grep** command searches\
    \ through a file to find lines that match a regular expression. Regular expressions,\
    \ or regexes, are commonly used to match patterns. Regular expressions are more\
    \ powerful and flexible than normal glob patterns and can match a variety of patterns;\
    \ you can combine them to form complex expressions.\n\naround your regular expression\
    \ with the grep command.\n\nOptions for the grep command include -i, which makes\
    \ **grep** consider upper- and lowercase letters the same for matching purposes;\
    \ -v, which inverts the search and lines that do not match; and -l, which does\
    \ not display but lists the name of files whose contain the regular expression\
    \ pattern.\n\nThe syntax for the grep command is:\n\n```\ngrep `pattern` filename\n\
    ```\n\nYou do not need to enclose the regular expression in single quotes. However,\
    \ if you do not use the single quotes, the shell interprets the pattern as a glob\
    \ pattern and matches it against files in the current directory. For this reason,\
    \ it is a good practice to use single quotes\n\nA simple useful example of the\
    \ grep command is that it can help you with crossword puzzles or crossword games\
    \ such as Scrabble. Using the list of English words in dict, you can display all\
    \ lines matching a specific pattern. For example, if the first letter in a word\
    \ is k, the third is n, and you do not know the result, you can use this command\
    \ to display all possible matches as you show:\n\n```\ngrep -i 'k.n.k$' /usr/share/dict/words\n\
    ```\n\n# ## EXTRACT TEXT A FILE\n\n| Terminal | File | Edit | Scrollback | Font\
    \ | Window | Help |\n| --- | --- | --- | --- | --- | --- | --- |\n| [---] user\
    \ used this text list | | | | | | |\n Monday: nothing planned | | | | | | |\n\
    \ Tuesday: work out at the gym | | | | | | |\n Wednesday: class in the evening\
    \ | | | | | | |\n Thursday: writers group | | | | | | |\n Friday: work out at\
    \ the gym |-\n [---] grep `pattern` day that is_work.txt | | | | | | |\n Monday:\
    \ nothing planned | | | | | | |\n Tuesday: work out at the gym | | | | | | |\n\
    \ Wednesday: class in the evening | | | | | | |\n Thursday: writers group | |\
    \ | | | | |\n Friday: nothing planned | | | | | | |\n [---] user | | | | | | |\n\
    \n| Terminal | File | Edit | Scrollback | Font | Window | Help |\n| --- | ---\
    \ | --- | --- | --- | --- | --- |\n| [---] user | grep -i 'k.n.k$' /usr/share/dict/words\
    \ | | | | | | |\n kang | | | | | | |\n kond | | | | | | |\n keno | | | | | | |\n\
    \ kedo | | | | | | |\n kino | | | | | | |\n kind | | | | | | |\n kink | | | |\
    \ | | |\n kiona | | | | | | |\n kona | | | | | | |\n kung | | | | | | |\n kunh\
    \ | | | | | | |\n [---] user% | | | | | | | |\n\n# ## EXTRACT TEXT THE GREP COMMAND\n\
    \n# ## CHEAT ON CROSSWORD PUZZLES\n\n+   - **1** Type grep and a space.\n- **2**\
