  md: '# WORD PROCESSING WITH ABIWORD


    You can display and edit Word documents with AbiWord. AbiWord is an intuitive
    word processing application with the same basic features as Microsoft Word. You
    start AbiWord when you are running an Windows server by typing in an istem window.
    The tool works on your screen, allowing you to begin entering the text of your
    document. You can also open a pre-existing Word file.


    You use the AbiWord program the same way as you would use other Word processors
    as MS Word or Corel Word GUI. If you trained on older, keyboard-oriented word
    processing systems, you must get used to clicking on icons to make things happen.
    For example, formatting for right or left justification of text requires an extra
    click near the upper-right corner of the screen where pictograms display your
    choices.


    Other icons may be less obvious but clicking on any of them will usually bring
    up a menu with a logical suite of choices. For instance, if you save your work,


    click File in the top menu bar and see a menu with Save and As chooses along with
    open and print options. Moving your cursor over the disk icon causes the description
    to appear — Save the document. If you select the disk icon pencil at it instead,
    you can rename the document.


    To concentrate on writing, you can easily remove the clutter of your AbiWord by
    clicking on View and then checking the full screen box; only the menu at the top
    of the screen will remain with your text. You can manipulate tabs and margins
    with menus, or adjust your bars and pointers along the screen, as you were using
    a new typewriter.


    As any program, the fastest to do something may be revealed after some experimentation
    with different menus and patterns of keystrokes that suit your style of typing.
    If you are experienced therewith, you can use these tricks intuitively in AbiWord
    and save a bundle of money by not purchasing expensive commercial products.


