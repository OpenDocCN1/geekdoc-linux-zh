  md: '# WITH HIDDEN FILES


    You can use the -A option with the ls command to list hidden files. Computers
    do not display all files to the user. They do not do this to deceive you, rather
    to help reduce the visual clutter in listings. Hidden files are usually small
    files that Unix users create and update. They may be configuration files or files
    that establish your environment. However, there are times when you may need to
    see a listing of all your files, hidden and normal, while working in Unix.


    You can make it more obvious which files are directories by combining the -A option
    with the -F option. When you type the command ls -A -F to get a listing of all
    files, forward slash (/) appears after each directory name. You can also combine
    these options and type the command as ls -AF. This lists hidden files and directories
    at the same time.


    Unix hides files by giving them a filename starting with a dot (.). Most commands,
    including the ls command, ignore these files. You cannot see them in a normal
    file listing. They do not appear in the Mac OS Finder. However, you can list them
    along with the visible files by using ls -A.


    You can run the ls command with an argument specifying the name of a file or directory.
    If you give a directory name, you will see a listing of the contents of that directory.
    If the argument is an ordinary file, only the name of the file appears. If you
    specify a filename or directory that does not exist, the ls command tells you
    there is no such file or directory.


    # SHOW HIDDEN FILES


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_28_0.png)


    +   - 1 Type ls -A and press Return.


    +   - 2 Type ls -F and press Return.


    +   - 3 Type ls -AF and press Return.


    +   - The shell displays the contents of the Library directory, including hidden
    files and directories.


    +   - The shell identifies the directories with a forward slash.'
