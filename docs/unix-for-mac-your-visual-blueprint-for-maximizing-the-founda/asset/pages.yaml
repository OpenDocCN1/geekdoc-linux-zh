    \ The ifconfig — interface configuration — command provides information on the\
    \ network interfaces established on your system. This information shows whether\
    \ addresses are assigned to each network interface is operational. The ifconfig\
    \ command also displays the subnet mask associated with your network connection.\
    \ This is critical for proper functioning on the local network and for improving\
