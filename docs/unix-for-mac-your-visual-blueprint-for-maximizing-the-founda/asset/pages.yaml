  md: '# VIEW TEXT FILES


    You can display the content of text files with the cat command. The name cat is
    short for concatenate, which means to join several things into one. However, the
    cat command has additional functions beyond concatenation, one of which is to
    display files on-screen. You can display any file by typing this command:


    ```

    cat filename

    ```


    The screen displays the full contents of the file. If the file is longer than
    one screen, your Terminal window scrolls to display the file.


    The two types of files you can display using the cat command are text and binary
    files. A text file consists of ordinary letters, numbers, spaces, punctuation,
    collectively known as plain text. If you are using a word processing and save
    the file as text, you are creating a text file.


    The other type of file that the cat command can display is a binary file. Binary
    files contain special characters that you cannot print, because computer codes
    for these characters do not correspond to any printable symbols. The executable
    files and programs compiled from code are often binary files, as they are proprietary
    data formats such as Microsoft Word documents.


    If you use the cat command to display a binary file, the best that you can expect
    is gibberish in your Terminal window. The worst result is that it resets the format
    of your Terminal window, meaning your prompt and any letters you type appear as
    gibberish.


    To display the contents of a binary file safely, use the -v option with the cat
    command. which displays non-printable characters by showing a caret (^) control
    characters, and M-Meta characters.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_51_0.png)


    # VIEW TEXT FILES


    | Terminal File Edit Scrollback Font Window Help |

