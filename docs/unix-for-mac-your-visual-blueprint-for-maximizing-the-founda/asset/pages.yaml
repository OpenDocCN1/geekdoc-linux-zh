    You can use the df command to check the total disk usage of your computer. Like
    du, df measures sizes in 512-character blocks, but you can use the -k option to
    make the results easier to read. The df -k command lists all file systems on your
    computer, and gives you a percentage indicating how full your disk is.


    Example:


