  md: '# COMPRESS LARGE FILES


    You can greatly reduce the size of a file by compressing it — down to a sixth
    or less of its original size when you use a good compression tool. Compression
    is a good solution for managing your disk space without sacrificing files that
    you may need later.


    For most files, gzip is one of the best tools available. It is quick and effective,
    reducing files to a fraction of their original size. It is also available on many
    systems, allowing you to move your compressed files to another system. To compress
    a file, you can type gzip followed by the name of the file. The gzip command creates
    a new file with the gz extension appended to the end of the filename. For example,
    when you type compress /var/log/system.log the resulting file is system.log.gz.
    Unlike Windows, Unix does not care how many extensions a file has.


    The other command that you can use to compress a file is called compress. The
    compress command compresses a file using a different algorithm than gzip. It also
    uses a different extension. Files compressed with the compress command take on
    the extension .Z.


    The gzip and zip tools are members of the GNU tools that many Unix systems use
    whether they are included in the distribution or added later. These commands are
    a standard distribution of Mac OS X.


    Both the gzip and the compress command use filenames to determine whether a file
    is already compressed. It is possible to compress a file again after renaming
    it, but the subsequent gain is small, and the likelihood of confusion is high.


    # COMPRESS LARGE FILES


