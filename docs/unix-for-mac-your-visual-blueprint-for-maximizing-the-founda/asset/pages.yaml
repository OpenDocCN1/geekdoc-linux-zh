  md: '# CREATE A STRUCTURED WEB PAGE


    You can create a structured Web page by inserting HTML tags in the proper sequence.
    While you can build a very simple Web page with almost no formatting commands,
    you can add to the functionality of your web page by creating some additional
    structure.


    One quite important rule is to keep in mind that when you use tags, such as `<b>`
    and `<i>`, you should use them in conjunction with other tags — such as `<li>`
    and `</li>` — in a way that one set of tags fully encapsulates the other. For
    example, to create a list item that is bold, you should type `<li><b>Last one
    to leave must turn off the coffee pot!</b></li>`. While this rule is not strictly
    enforced for all tags, it is generally a good rule to follow.


    A well-formed Web page has an overall structure that identifies the major portions
    of the page and follows this order of encapsulation: The outermost tags are `<html>`
    and `</html>`. Within these tags, you may have a section that starts with `<head>`
    and ends with `</head>`. Following the title between `<title>` and `</title>`,
    you may have a body that starts with `<body>` and ends with `</body>`, which contains
    images and links within the body section. The major sections of a web page follow
    a pattern as follows: `<html><head><title></title></head></body>`. Between these
    major tags that provide the overall structure to your Web page, you insert the
    headings, links, and text that define the content as well as the look of your
    Web page.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_249_0.png)


