  md: '# Extra


    The file mode indicates the file type and permissions. The first character is
    a d for a directory, or a dash for a normal file. The other nine letters are read
    in sets of three. The first set represents the permissions for the file owner,
    the middle set represents access by anyone in the file''s group, and the last
    set is for all other users.


    The first letter in each set, r, controls read access for the set of users. The
    second letter, w, controls write access. The last letter, x, designates execution
    access or, mode for directory access. In the mode field indicate that the corresponding
    execution permission is not set for the associated set. For example, rw- indicates
    that the users can read and write, but not execute the file.


    Example:

    drwx-xr-x 5 user staff 170 Nov 4 13:49


    This directory can be read by the owner, the members of the group staff, and anyone
    else using the computer. Only the owner can write to the directory; however, anyone
    can move from this directory.


