  md: '# WORK WITH PROCESSES


    # Extra


    You can only restart a process that has been suspended. You cannot restart a process
    that has run to completion or a process you have terminated. Each process has
    a life of its own. Even if you run the same command seven times in a row, each
    running is an independent process.


    You can restart processes by bringing them back into the foreground, and they
    will continue running as if they had not been suspended. You can also restart
    processes by sending them to the background and continuing entering commands from
    the shell from which these processes were run.


    If you press Control + D to exit a shell in which you have suspended processes,
    the shell alerts you to the suspended processes. The message "There are suspended
    jobs" appears. This warning ensures that you do not forget commands that wanted.
    You can still exit the shell by pressing Control + D. If you exit the Terminal
    window by clicking the red button, no alert appears. The suspended processes are
    quietly killed when you close the window.


