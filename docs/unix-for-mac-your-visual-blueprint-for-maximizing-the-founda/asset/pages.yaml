  md: '# WORK WITH TEXT


    # Extra


    You can also set the tail command to display any new lines added to the end of
    a file, by using the -f option.

    The Mac OS operating system maintains a number of files known as log files. These
    files record system activity, much of it is invisible to the user, which you can
    use to diagnose problems or monitor processes. New lines are regularly appended
    to log files. You can find most of the most important system logs in the /var/log
    directory.

    You can monitor these log files by using the tail -f command. To stop monitoring
    these files, press Control + C.


