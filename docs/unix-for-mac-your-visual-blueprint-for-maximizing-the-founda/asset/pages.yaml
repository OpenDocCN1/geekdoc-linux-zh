  md: '# Apply It


    You can write scripts that are easier to understand and maintain by adding comments
    that explain the complicated commands and describe how the script works. Comments
    are lines in scripts that the system ignores when it runs the script. Comments
    serve the function of explaining your script to others who read it so that complex
    commands are easier to understand and other users do not have to read the entire
    script to know what it is supposed to do.


    To turn a line of text in a script into a comment, insert a pound sign (#) in
    the first column. The shell ignores it when it runs the script, so you can place
    anything you like in a comment. You can also add comments to the end of a line
    of code by adding # at the end of the Unix command and before the text of your
    comment. Always place at least one space or tab before the #.


    While it is a good idea to include some comments in a script to explain what the
    script does, you do not need to comment every line of code. Inserting one or two
    lines of comments at the beginning of a script is useful. Placing a comment on
    every other line is distracting. When you run this script, the shell ignores the
    comments.


