  md: '# SET UP YOUR DOCUMENT DIRECTORY


    You can build a site using a single directory, or organize your Web pages using
    series of directories. The document directory or root that you set up for your
    web server holds, all the files that are part of your site. These files all in
    the directory that you assign to the DirectoryRoot directive, or you, insert files
    into a series of directories to make them easier to manage. For example, you may
    want to keep images in separate directories from your HTML files. Many people
    find it distressing to have hundreds of files in a single directory.


    The single point of entry for most visitors to your site is the page that you
    use as your default directory, assigned to the DirectoryIndex directive in your
    configuration file. Called index.html by default, this is the document that your
    server sends to visitors whenever they type your URL into their browsers.


    If your default document contains references to other files, such as image files,
    the links in your document must correspond to the directory structure you create.
    For example, if you refer to an image mylogo.gif that resides in the directory
    within your document, you must refer to this as images/mylogo.gif.


    Your default document, index.html, not only has relevance to your document root,
    but also plays a role in every directory that you create. Any time visitor to
    a URL ending in a directory name, your server sends back a document from that
    directory. If it does not find one, it returns a directory list or an error, depending
    on whether you have disabled directory listing.


