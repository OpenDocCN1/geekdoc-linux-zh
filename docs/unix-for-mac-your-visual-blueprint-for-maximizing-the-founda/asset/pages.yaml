  md: '# BACK UP YOUR FILES


    You can safeguard your work and protect your system by backing up your files.
    Maintaining a set of backups is always a good idea. Mac OS X cannot prevent a
    user from removing a file or a set of files that they may still need. There are,
    however, quite few tools that you can use to back up your files.


    Some Unix commands as cp and dd allow you to make copies of files. Long-time Unix
    users may have a habit of copying important files before editing the originals,
    in case they need to restore them and start over again.


    Other Unix commands allow you to create archives of important files. This is a
    great way to save all of the files associated with the project in a single file.
    The tar commands work well for this purpose.


    Most Unix systems use the dump command for regular system backups, although you
    may need to dump to a remote drive to use this command. The dump command can back
    up a complete file system or select only those that have changed since the last
    backup. This method of backing up is an incremental backup.


    While dump is a good Unix command, the Mac OS X can only back up an entire file
    system, or only works with Unix file systems (UFS). If your Mac OS is an older
    version than Mac OS 9 or earlier, you might consider downloading the hifspax software
    available from homepage.mac.com/howardoick. This software works well with data
    and resource forks and provides a command-line interface.


