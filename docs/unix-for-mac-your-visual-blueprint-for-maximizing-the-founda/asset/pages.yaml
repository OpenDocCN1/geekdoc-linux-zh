    This is known as piping, and is an alternative way to use standard input instead
    of displaying on-screen using a file, the standard output from one becomes the
    standard input for another. The second command runs using the first command, and
    produces its own output, which you can then display, redirect to a file, or pipe
    to another command.


    command. Some commands do not automatically read standard input. For those commands,
    you must read the manual pages, but the most common way is to indicate that a
    command should read standard input is to use a single dash (-) as an argument.


    Piping is redirecting a output to a file and then applying a second command to
    that file, but cuts out the middle. For example:


    This technique gets its name from a special character called the vertical pipe
    (|). On keyboards, you create this character by holding the shift key and typing
    a backslash (\). The syntax for a pipe command looks like this:


