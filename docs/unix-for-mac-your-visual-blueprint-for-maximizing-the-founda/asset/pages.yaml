  md: '# UNIX FOR MAC


    # FIND UNIX APPLICATIONS ON THE WEB


    You can download software in one of two forms: as precompiled binaries that you
    can run after an installation process, or as source code that you compile before
    you run it. The easiest way to get new tools for your Mac OS X is to find precompiled
    binaries. While many sources of precompiled binaries exist on the Web, you can
    only use that are built specifically to run on Mac OS X.


    When you download a tool from the Apple site, the Download Manager appears, allowing
    you to monitor the progress of your downloads. At this point, you can continue
    downloading, although you must remember not to shut down your network if you are
    on a dial-up line.


    The advantages of using source code are first, that you can study the source code
    and determine exactly how a tool works, and second that you can modify the code
    for your purposes.


    There are several sites that provide Mac OS precompiled binaries. For example,
    you can obtain a precompiled binary for Fink, a sophisticated package manager
    for Mac OS, from www.sourceforge.org. Other useful tools include www.monilla.org,
    www.entropy.ch/macos, and XFree86 from apple.com. An office suite that rivals
    Microsoft Office will be officially released by the time you read these words.


    As you might expect, one of the best sources of precompiled tools for Mac OS X
    is Apple Computer. In fact, to facilitate your access to their software tools,
    Apple has included the Mac OS X option in the Apple drop-down menu on your desktop,
    which takes your browser to their comprehensive download site.


