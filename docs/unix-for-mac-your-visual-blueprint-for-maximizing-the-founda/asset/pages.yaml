  md: '# WORK WITH DIRECTORIES


    # Extra


    You can move through the file system using the directory stack. The stack is a
    list of directories of which the shell keeps track. You can list the stack by
    typing dirs.


    To change to a new directory and add it to the directory stack, use the command
    pushd pathname. This command adds a new pathname to the stack, and prints the
    stack. You can use the directory stack by typing popd to remove the top directory
    from the stack and change to the next one, or by typing pushd -- no arguments
    -- to swap the two stack entries and change to the new top directory. The directory
    stack is very useful if you are going to be switching between several directories
    in the same shell window.


    Example:

    [ferro:~/Documents] user pushd /usr/lib

    /usr/lib ~/Documents

    [ferro:~/usr/lib] kynn pushd /etc

    /etc /usr/lib ~/Documents

    [ferro:/etc] kynn popd

    /usr/lib ~/Documents

    [ferro:~/Documents] kynn


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_42_0.png)


    RETURN TO THE PREVIOUS DIRECTORY

    Repeat steps 2 and 3 to move to a new directory.


    5 Type cd - and press Return.

    Your current directory changes back to the previous directory.


    RETURN TO YOUR HOME DIRECTORY

    6 Type cd and press Return.

    Your current directory changes to your Home directory.'
  merge: -1
  pgno: 42
