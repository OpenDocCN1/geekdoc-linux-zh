  md: '# FIND FILES BY NAME


    You can locate files by their names or other criteria by the find command. This
    command tends to be faster than the Mac OS Sherlock application, especially those
    that are used by the system or otherwise hidden from the Finder.


    which you are looking. The argument -print tells the find command to display the
    location of the file.


    The find command is a complex and very powerful utility that lets you run many
    different types of searches and perform a variety of actions on the files that
    it finds. However, the most common use for the find command is simply to locate
    files with a certain name and print out their location.


    You can also give a wildcard pattern instead of a filename, and the find command
    lists all files that match pattern. When you use wildcard patterns in this way
    you need to enclose them in quotation marks. For example, if you save a Word document
    but do not keep track of what folder you save it in, you can use the find command
    to locate all the doc in your Documents directory:


    ```

    find ~/Documents -name "*.doc" -print

    ```


    The syntax for find command is:


    This displays a list of all files matching the pattern. When you want to see a
    file list listing of the pathname for the files found, you can replace the print
    with the command.


    find -name filename -print


    The first parameter, pathname is the directory where you want to search. The pathname
    is the name of the file for


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_39_0.png)


    # LOCATE FILES BY NAME


    +   - Type find and a space.


    +   - Type -name and a space.


    +   - Type -print and press Return.


    +   - Type filename.


    +   - Type the pathname of a directory and a space.


    +   - The shell executes the find command and prints the file location.'
  merge: -1
