  md: '# INSTALL LIBRARIES


    You can install system libraries for your personal use or for software applications.
    While Mac OS X is an extremely versatile operating system, there are numerous
    libraries that you can download to increase the functionality of your system.
    Tools that you download and install often need some of these.


    You install libraries in the same manner as other software that are usually single
    binary files. When you place these files in the correct locations on various routes,
    other software can use them by making calls to various routines. For example,
    if you install a library for displaying images in the PNG format, you do not have
    to build these routines into your code. Instead, you can use the libraries in
    your code and compile your software to dynamically load the libraries when you
    need them.


    System libraries are stored in /usr/lib. By convention, third-party libraries
    reside in /usr/local/lib. You should be careful to install these libraries in
    the appropriate directories so that the applications need them can find them.


    When you install libraries on your Mac OS system, acquaint yourself with an environment
    variable DYLD_LIBRARY_PATH. This variable is essential in helping your executables
    to load the libraries they need. If all of your libraries are not installed in
    /usr/lib, you must add a list of directories in which libraries are stored to
    the DYLD_LIBRARY_PATH variable. You can assign this variable a colon-separated
    list of all directories containing libraries. For tsh users, you can insert a
    command, such as setenv DYLD_LIBRARY_PATH=/usr/local/lib:/lib , to add these two
    directories to the locations where the dynamic linker


    searches for libraries. You can read the man page for DYLD to learn more about
    how the dynamic linker uses DYLD_LIBRARY_PATH as a search path for libraries.


    You can download many libraries by launching the FindCommander utility, selecting
    Category from the menu in the toolbar, or typing libs in the text field: FindCommander
    displays a list of libraries that it can install for you.


    When you install software through the traditional configure-make-make install
    process, you may have an opportunity to install libraries as you wish. This is,
    although the basic-make-install process may install binaries in /sw/bin or /usr/local/bin,
    it may fail to install necessary libraries. Read the README and INSTALL to determine
    if there is an optional install-lib step that takes care of this.


    The table on the next page provides descriptions for a variety of libraries that
    you can install on your Mac OS X system. While incomplete, this list contains
    many of the most useful libraries that you are likely to find. Like other applications
    libraries undergoes changes as developers build and test new versions.


    Just as there are many locations from which you can download open source software,
    there are many places where you can find references to any library you need by
    using a search engine such as Google.'
