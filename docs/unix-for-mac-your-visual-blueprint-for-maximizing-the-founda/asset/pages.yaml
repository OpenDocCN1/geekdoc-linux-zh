  md: '# # ACCESS DATABASES FROM PHP


    You can access data in your databases from PHP and include this information in
    your Web pages. The setup required to provide information stored in a postgres
    database on a Web page is not intuitive, but it provides this functionality when
    you have the proper tools.


    You need to install PostgreSQL on your server to use a Web server that supports
    PHP — for example, installation of Apache supports PHP dynamically and statically.
    Additionally, your PHP build must support with-pgsql parameter. For a web site
    to use PostgreSQL commands, the database must be managed.


    When you are sure that you have these prerequisites, you can create a Web page
    that incorporates information from your database. The first step is to identify
    the database that you are using, as follows:


    ```

    ?

    $host = "localhost"

    $user = "postgres"

    $pass = "dbacct"

    $db = "testdb";

    ```


    You can now open a connection to the database with a command such as $connect(host=$host
    dbname=$db user=$user password=$pass); You can then determine if your connection
    is successful by testing the $connect value.


    Next, you can create the query that you want to run for example, $query = "select
    * from table"; and execute it with a command such as $result = pg_query($connect,
    $query) or die(''query failed: $query''); The result command stores the data that
    you have fetched in SQL.


    You can now decide how to process and display the data that the command returns
    from the database.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_325_0.png)


    # ACCESS DATABASES FROM PHP


