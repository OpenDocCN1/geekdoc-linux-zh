  md: '# SYSTEM ADMINISTRATION COMMANDS


    # Extra


    To initiate a restoration from a dump, use the restore -ivf command followed by
    the name of your backup device or dump file. Use cd to move between directories,
    followed by the name of a file to select it for restoration, and extract when
    you are ready to begin restoring the files.


    You can use the restore command to restore files from the backup that you create
    with the dump command. The restore command can restore an entire file system,
    although you usually only need to restore a single file or set of files from your
    backup. In this case you can use the interactive mode of the restore command to
    navigate the backed-up files. You can then select files that you want to restore
    and initiate their restoration. The restored files appear in a subdirectory of
    the directory where you run the restore command.


    On Mac X systems, the dump command can only back up an entire system. Because
    you are probably working with a single partition, it requires a large-capacity
    device to create a backup. The dump command can write to the tape drive on a remote
    system if you configure the remote system to allow this.


