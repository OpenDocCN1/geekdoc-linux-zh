  md: '# OPEN A FILE WITH VI


    You can use the vi editor to edit text files. The vi editor is more powerful than
    Pico and can perform many more text-editing functions. The name is short for visual;
    vi is a visual editor because you can edit files-screen as you see them, as opposed
    to using the command line as with sed, a stream editor. To begin, you can type
    vi at the command prompt with an optional argument:


    a sample filename with the full path would be /tmp/vi.Y8pi7R because vi stores
    temporary files in the /tmp directory.


    vi-name


    If you do not specify a filename, vi creates a temporary file for you and opens
    that file for editing. The name of the temporary file consists of a seemingly
    random series of characters and numbers:


    When vi displays a file, lines that are longer than the width of the terminal
    screen continue on the next line. The vi editor breaks lines at the edge of the
    screen, which means that the first half of a word appears at the end of one line,
    with the other half on the next line. The word is still intact and whole; vi simply
    displays this for your editing purposes.


    The vi editor automatically uses the full terminal. If there are additional lines
    on the screen that vi does not to display the file, a tilde (-) appears at the
    beginning of each of these lines. These are not part of your file; they simply
    indicate the end of the content.


