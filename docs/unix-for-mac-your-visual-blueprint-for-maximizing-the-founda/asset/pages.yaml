  md: '# Extra


    While the nidump and niload commands are relatively straightforward, the niutil
    command has a number of options, each of which is like a separate command. These
    options include

    -create, -destroy, -createprop,

    -appendprop, -mergeprop, -insertval,

    -destroyprop, -destroyval, -renameprop,

    -read, and -list.


    Netinfo uses terminology that is different from that of the system. For example,
    not only Netinfo maintains formats in place of files, but it also has directories
    in place of properties and rights in place of fields. If you use the niutil command
    to create a new user record, you can use the niutil -create command, which creates
    a new directory. You can then set the values associated with the full name of
    the user, their Home directory, and so on, by using the niutil -createprop command.


    Although Netinfo works well, you should consider making your changes with a carefully
    written and well-tested script, and not attempt to enter all of the necessary
    netinfo commands manually. Read the pages for niload, nidump, and netutil to learn
    more about how you can use these commands.


