  md: '# CHANGE YOUR SHELL


    # CUSTOMIZE YOUR SHELL


    You can change your default shell from tcsh to bash or zsh, so that the Terminal
    program automatically starts with your preferred shell. You may never need to
    change your shell; the tcsh is a very useful and user-friendly shell. Like those
    from Linux background, and many people like to learn more about the different
    shells, use ''Work with the Bourne-Again Shell'' and ''Work with the Z Shell''
    in this chapter.


    After you update the master password file, you need to enter the changes into
    the Netinfo database. Netinfo is a database maintained by Mac OS X for many things
    related to the operation of your computer. To make your shell change effective
    in Netinfo, type the following command exactly as it appears here:


    Changing your shell is a two-step process. The first step is to use the chpass
    command to change your shell record in the master password file. You can update
    this file, if it is located at the pathname /etc/master.passwd, by typing the
    following:


    ```

    chpass -s /path/to/shell

    ```


    ```

    sudo cat /etc/master.passwd | sudo niload -m password /

    ```


    This example uses the sudo command to allow you access to files and permissions
    you would not be able to change. For this, you must make sure that you do not
    make a mistake typing the command. After you press the Return key, you see a prompt
    asking you to enter your password and press Return.


    For example, chpass -s /bin/zsh makes your default shell the Z shell, and chpass
    -s /bin/bash changes your default shell to the Bourne-again shell.


    # CHANGE YOUR SHELL


    | Terminal File Edit Scrollback Font Window Help |

    |---|---|---|---|---|---||

    | Terminal - type8 | | Terminal - type8 | |

    | [chpass-] user chpass -s /bin/zsh |

    | chpass: rebuilding the database. |

    | chpass: done |

    | chpass: /etc/master.passwd unchanged |

    | [chpass-] user sudo cat /etc/master.passwd sudo niload -m password / |

    | [chpass-] user |


    +   1. Type chpass -s and a space

    2. Type the full pathname to a shell and press Return.

    3. Type the command to update the Netinfo database and press Return.

    4. Enter your password and press Return.


    This command updates the Netinfo database, and changes your shell.'
