  md: '# WRITE A CGI SCRIPT


    You can write a CGI script to create a Web page that interacts with your visitors.
    The term CGI identifies a class of script that allows Web pages to interact with
    the system on which it is running. Most scripts are written in Perl. This is because
    versatility of Perl makes a good language to use on the Web. The basic function
    of a CGI script is to process and then prepare the output in HTML format so that
    it can display in a Web page.


    The CGI module uses functions to generate HTML code. These include header and
    start_html — functions that create the HTML header — tags as <html> and <body>,
    which you need to format an HTML page.


    Other functions include h1, hr, and end_html. As you see, these codes resemble
    HTML code. A command as print_h1("My Life in 50 Words or Less") takes the place
    of a print command containing the beginning and ending tags for heading 1 text.


    To use the CGI module installed on your system, you can use the Perl command CGI;
    this command loads the CGI module into your script. For most CGI scripts, you
    will amend this command by specifying that you want to use the most command functions.
    The altered command then becomes CGI qw(:standard); This allows you to access
    HTML, form generation, and CGI functions.


    You can use CGI scripts to build pages that contain dynamic text, because you
    can use Perl commands to gather information from the system or vary the contents
    of the page in other ways. You can also build CGI scripts that create a form allowing
    the user to enter text, and then process that text.


    # WRITE A CGI SCRIPT


