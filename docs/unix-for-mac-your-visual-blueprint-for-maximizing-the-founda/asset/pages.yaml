  md: '# SYSTEM ADMINISTRATION COMMANDS


    # Extra


    Most software that you download from FTP sites is compressed to reduce both the
    storage requirements on the server and the time required to download the file.
    You can determine the type of compression by looking at the file extensions. Files
    that end in .Z have been compressed with the compress command, while those that
    end in .gz have been compressed with gzip. You may also see files ending such
    as .zip, .tar, and .tgz.


    | FILE EXTENSION | DESCRIPTION |

    | --- | --- |

    | ZIP | Files ending in .zip ZIP files. |

    | TAR | Files ending in tar are tape archive or TAR files. |

    | TARZ/TGZ | Files ending in .tar or .tgz are TAR files that have also been compressed
    with the compress command. |


