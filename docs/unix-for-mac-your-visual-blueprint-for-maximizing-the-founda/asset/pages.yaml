  md: '# SHOW FILE ATTRIBUTES


    You can show the attributes of each file, including the owner, permissions, and
    file size, by using the -ls command. Each file or directory has attributes that
    control who owns it and what it can access. All files have an owner, who is usually
    the user who created the file. For example, if you are the owner of the files
    in your Home directory you can also associate a file with a certain group; groups
    are collections of users to whom you can grant access as privilege.


    When you type the -ls command, you will see one line for each file in the current
    directory, appearing in columns. The first column looks like a series of dashes
    and randomly letters such as d, r, and x. The next column shows the number of
    other files or


    directories that reference that file. These references, also called links, include
    the directory containing the file itself, so each file has at least one reference.
    For directories, the reference represents the number of files within each directory.
    The third and fourth columns show the size of in characters or bytes. The fifth
    column shows the date and time the file was last modified. The sixth column shows
    the name of the file.


    If you want to examine an individual file, you can use the filename as an argument
    to the -ls -1 command. Using the -ls -1 command lists the contents of the directory,
    although you can use the -d option to request the attributes of the directory.


