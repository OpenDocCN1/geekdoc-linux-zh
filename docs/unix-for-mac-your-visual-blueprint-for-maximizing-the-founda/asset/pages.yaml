  md: '# UNIX FOR MAC


    # CHANGE THE CURRENT DIRECTORY


    You can change your current directory by using the `cd` command. Each shell window
    operates in a specific location within the file structure, and you can view this
    location by typing the `pwd` command. The `pwd` command is shorthand for print
    (working) directory. The current working directory is the directory from which
    relative paths are default in which files are found or saved.


    If you type `cd`, it returns you to your Home directory. If you provide the `cd`
    command with a pathname argument, either relative or full, you change to that
    directory. You can change your directory to any directory that grants you access
    permissions. This allows you to explore nearly all of the directories on your
    hard drive, with the exception of a few system directories that are protected.


    When your current directory changes, your prompt changes as well, to reflect the
    new location. Your prompt displays the names of up to three directories above
    your current location, or if you are close to the root directory. For example,
    if you are in the directory `/usr/share/tsh/` on a computer named user, your prompt
    looks like this:


    ```

    [ferro:share/tsh/examples] user%$

    ```


    You can use wildcards and filename completion with the `cd` command; it accepts
    directory names such as `cd ..` to go up one directory level, and `cd -user` to
    change to the Home directory of the user. You can also use the `cd -` command
    to return to the last directory which you were working.


    # CHANGE THE CURRENT DIRECTORY


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_41_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_41_1.png)


    # DETERMINE YOUR WORKING DIRECTORY


    The shell shows your current location.


    # CHANGE TO A DIFFERENT DIRECTORY


    +   - Type a new directory name and press Return.


    +   - Type pwd and press Return.


    +   - Type cd and a space.


    +   - Your current directory changes to the new location.


    30'
