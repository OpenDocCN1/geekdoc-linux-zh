  md: "# CREATE SYMBOLIC LINKS\n\nYou can simplify the navigation of your file system\
    \ by creating symbolic links. A symbolic link is a special file that acts as a\
    \ pointer or shortcut to another file or directory at any location in the system.\n\
    \nBy creating a symbolic link to a long or difficult pathname, you can move to\
    \ the directory by typing cd followed by the name of the link. If you want to\
    \ create a shortcut for moving into or listing the contents of the directory /Applications/Utilities,\
    \ you can use the command -s /Applications/Utilities. The full pathname specifies\
    \ where you want your link to point, while the -s argument fills in the command\
    \ that you want to create a symbolic link.\n\nAfter you type this command and\
    \ press Return, you can type commands such as ls utils or cd utils. If you only\
    \ specify the file or directory that you want to point to when typing the ln -s\
    \ command, the link receives the same name as the original file.\n\nIf you share\
    \ a set of files with other users, and those files are not stored in your home\
    \ directories, you can use symbolic links to simplify the process and share files.\
    \ If you do not include the -s argument, a hard link will be created instead.\
    \ A hard link is a special copy of a file, in that it is a reference to the original\
    \ file. Though it looks like a file that is completely independent of the original\
    \ file, it is the original file's reference; any changes to the new file reference\
    \ are reflected in the original link.\n\n# CREATE SYMBOLIC LINKS\n\n```\nTerminal\
