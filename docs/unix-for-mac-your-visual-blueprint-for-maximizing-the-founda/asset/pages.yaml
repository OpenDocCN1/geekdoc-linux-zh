  md: '# STOP APACHE


    You can stop the Apache server at any time. To stop Apache, you can use the apachectl
    script with a stop argument. This stops all of the Apache processes. Both the
    stop and start commands are arguments to the script that you use to Apache to
    control the operation. This script can also be used to restart Apache. The restart
    command shuts down and restarts Apache, while the status command tells you whether
    Apache is running.


    Before you attempt to stop Apache, you may first want to confirm that it is running.
    You can do this in one of two ways. You can use the apachectl script with a status
    argument; however, this technique only works if you have lyn installed. You can
    also run the command ps -aux to view the process. If you run this command, you
    must be careful not to mistake your grep command for an Apache process.


    When you stop Apache, you terminate the server process. The server is no longer
    listening on the port assigned to HTTP, and clients who continue requesting service
    receive a message indicating that their browser has encountered a DNS error, or
    that it cannot find the server. This indicates that the client is not finding
    a responsive response on the HTTP port.


    You can also determine whether the HTTP port is listening for client requests.
    If Apache is not running, processes should be listening for connections on port
    80. You can perform this test with the netstat command. netstat -a | grep http
    returns a LISTEN message when Apache is running. The output looks like this:


    ```

    tcp64 0 0 *.http.* LISTEN

    ```


