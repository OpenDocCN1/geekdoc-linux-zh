  md: '# CHATTING ON IRC


    You can chat with a person when you know their screen name. A screen name enables
    you to find someone on IRC and determine whether the person is online. When you
    know the screen name of another user, you can add the user to your buddy list,
    thereby making it easier for you to open a chat session with that friend.


    When you first open iChat, your buddy list appears and you can determine which
    of your buddies are available to chat. You can add buddies to your list by selecting
    the Buddy option from the Buddies menu. When you select this option, a form that
    you will fill out with information on the new buddy, screen name of the buddy.
    You can also use this form to keep track of the e-mail address of your buddy.


    After you select a buddy, you can invite that to chat with you by right-clicking
    the buddy from your buddy list and clicking Invite to Chat.


    Because you may not always be in the mood to chat, you can alter your status to
    control whether others can initiate a chat session with you. When you start iChat,
    you are listed as Available. You can change this status to tell your buddies,
    or you can even create a custom status to tell your buddies when you are too busy
    to chat.


    When you engage in a chat, you can exchange dialog in a chat window. For example,
    if you start a chat with someone from your buddy list or select New Chat with
    Person from the File menu, a dialog window opens in which your dialog with the
    other person appears with proper annotation so that you can easily see what each
    of youℙ typing.


    # CHATTING ON IRC


