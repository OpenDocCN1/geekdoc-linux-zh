  md: '# INSPECT SYSTEM LOGS


    You can learn about system operations errors by inspecting your system logs for
    error messages and various anomalies. System logs, stored in /var/log, record
    the activities of many system services as e-mail and printing. You will find these
    files to be valuable as they can be an important source of information when system
    problems arise.


    up. This configuration file tells syslog to write each type of log message. By
    using the services of syslog, errors do not have to do their own logging. The
    syslog configuration file, /etc/syslogd.conf, provides you with an opportunity
    to change which logs are written or to deactivate types of logging. By modifying
    the logging configuration file for syslog and the daemon to check for changes.
    Do not edit the default /etc/syslogd.conf unless you want to separate particular
    messages or stop collecting them altogether.


    The most important messages about your current logs appear in a log file called
    console.log. You can view these messages using the Console tool, available in
    /Applications/Utilities. The scrollable window allows you to read the messages
    that accumulate upon your log. These messages include authentication failures
    and mounting problems.


    A system daemon manages most system log files. Like numerous other daemons, the
    syslog daemon, syslog, has a configuration file that it reads when it starts


    If you keep the Console open while you work, you will see these messages display
    as the daemon generates them. This is a good troubleshooting technique as it informs
    you of problems immediately and reminds you to check your logs.


    # INSPECT SYSTEM LOGS


