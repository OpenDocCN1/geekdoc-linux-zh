  md: '# INTRODUCTION TO HTML


    You can create Web pages using the most basic HTML markup code. While you can
    use the HTML language to create extremely complex and extensive Web pages, you
    can also create attractive and functional pages by inserting a few simple HTML
    tags into your documents. These tags allow you to insert images, builds, and insert
    links to change the font of selected text, making it bold or turning it into a
    heading that stands out. They allow you to insert links on your site to other
    Web sites. You can also mark selected text as preformatted so that Apache does
    not wrap the lines together.


    Most HTML tags come in pairs. That is, there is an open tag as well as a close
    tag. For example, if you want to underline a phrase in your document, you indicate
    the text you want to underline by inserting `<u>` to indicate the underlining
    should start, and `</u>` where it should end.


    In some cases, you do not require tags to format the text you want to change,
    but it is considered good form to use them. For example, if you mark the beginning
    of a paragraph by inserting `<p>`, you should also mark the end of the paragraph
    with `</p>`. Similarly, list items begin with `<li>` and end with `</li>`.


    To insert an image into your Web page, you can use the `<img src=...>` command.
    In the simplest form, this command provides the location of an image file that
    you want to display within your Web page. However, you can use size and align
    attributes to control the size and placing of the image.


    To add a link to another page or Web site, you can insert a command such as `<a
    href="http://www.idyllmtn.com">click here/</a>`.


