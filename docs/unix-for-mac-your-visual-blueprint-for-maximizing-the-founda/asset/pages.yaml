    may give you additional features, better security, or improved performance.


    You compile Apache with the standard set of tools for compiling open source software.
    You generally start with a zipped file heavily downloaded from apache.org. You
    then need to unzip it with zip, and untar the resulting file with tar x. After
    your installation is complete, you have a directory containing all the files needed
    for configuring and compiling the new version of Apache.


    During this stage of preparing for compilation, information about your system
    is being collected and analyzed a Makefile is being prepared that guides the compilation
    process on your Mac OS X system. Keep in mind that the Apache distribution was
    built so that it can compile on many different types of systems. Therefore this
    configuration step is critical to the compilation on your particular operating
    system.


    After the configuration operation is complete, you can begin the actual compilation
    using the make command. The make command starts by reading the Makefile that was
    created and using it to drive the compilation. The use of a simple C source code
    file means this make process completes many programs and brings a small number
    of programs, in the httpd process that represents the Web server you have installed.


    After moving into the Apache source directory with the cd command, you run the
    script that is included with the distribution. This takes several minutes to


