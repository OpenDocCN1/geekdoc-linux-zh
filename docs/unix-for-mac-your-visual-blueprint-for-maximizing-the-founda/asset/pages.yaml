    When you compile Apache from the compressed tar you download from www.apache.org,
    there are several steps you must follow. First, you must uncompress the file,
    extract the contents. You must then run the configure command to prepare your
    Makefile, execute the make command to read the Makefile, and call gcc to compile
    each piece of code and create your executables. After this, you run make install
    to place the binaries and associated configuration files in the directories from
    which you want to run them, and then run make clean to remove intermediate files.
    While this process involves a number of steps, these become second nature after
    you build several applications this way.


    It is always a good idea to read the included README before you begin the compilation
    process. These files often contain instructions that make the building process
    easier. For example, you may run through all the steps of the building process
    for Apache without realizing that adding a prefix such as -prefix=/sw/apache to
    your configure command tells Apache to install as /sw/apache/httpd and to look
    for configuration files in /sw/apache.


