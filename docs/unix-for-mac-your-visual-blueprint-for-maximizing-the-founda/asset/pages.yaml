    When you want to run your script through a series of files, numbers, or other
    values, you can use a looping. To ensure that your script runs correctly, add
    a line to the top of your script with #! followed immediately by the full pathname
    for the particular script. A script written to run in tsh should start with #!/bin/tcsh.


    For tsch, you can use the foreach command to loop through a set of values. The
    command foreach (4 5 6) runs three times, for each one of the


