    You can make your troubleshooting easier by reducing the complexity of your commands,
    like many networking commands, ping relies on the services of DNS to resolve domain
    names If you are having trouble reaching your DNS server, ping and traceroute
    commands will be affected. If you have no name resolution you are troubleshooting
    a network connection, use ping and traceroute with an IP address instead of a
    domain name. Of course, this only works if you know the IP addresses for the system
    you want to reach.


    Similarly, commands as netstat usually run faster if they are not required to
    look up IP addresses and translate port addresses into names. You can turn off
