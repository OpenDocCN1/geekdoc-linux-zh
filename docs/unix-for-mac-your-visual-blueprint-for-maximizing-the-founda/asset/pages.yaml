  md: '# Apply It


    You can use `osascript` to announce the new directory each time you use the `cd`
    command. It uses the special `tcsh` shell script `cwdcmd`, a command executed
    each time you change the current working directory.


    +   - Create a directory for storing scripts, such as `~/Library/osascript`.


    +   - Create a shell script in the directory named `say-dir.csh`, containing the
    following: `osascript -e ''tell Application to say New Dir: $cwd*''`


    +   - Add an alias command to your `.tcsh` file that sets the `cwdcmd` alias as
    `alias cwdcmd ''source ~/Library/osascript/say-dir.sh''`


    +   - You can type `source ~/.tcsh` to run your .tcsh file and add this alias,
    or you can type the alias command (in step 3) to set the alias for your current
    terminal.


    When you change to a new directory, the `cwdcmd` alias executes. The source command
    reads in the shell and runs it, calling the `osascript` command. The value of
    the current working directory is stored in the shell variable `$cwd`, and the
    new directory is announced because the value is used in the Applescript `say`
    command.


    There is one hitch to using this: you will change directories slowly because the
    `cd` command will not end until the path is spoken.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_142_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_142_1.png)


    # RUN AN APPLESCRIPT FILE


    +   - Create a text file containing your Applescript, using a text editor.


    +   - Type `osascript` and a space.


    +   - Type the name of the script and press Return.


    The `osascript` command executes the Applescript file.'
