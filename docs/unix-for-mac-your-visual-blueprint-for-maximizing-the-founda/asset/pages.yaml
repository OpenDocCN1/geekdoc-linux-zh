  md: '# UNIX FOR MAC


    # USING NETINFO


    You can explore and modify the contents of your NetInfo database. Netinfo is a
    service that replaces the simply formatted text files that were once exclusively
    in Unix to store information about users, and so on. The Early systems used all
    user information in the /etc/passwd file, and information in the local system
    and others in /etc/hosts. With some additional files, also stored in /etc, the
    records determined who could log on and what systems the system could support.


    account in the /etc/passwd file, you are not likely to find it. The system does
    not use these files; instead NetInfo Therefore, learning to browse the NetInfo
    information base and making changes is essential for understanding and monitoring
    your system.


    In the past, new lines were added to the /etc/passwd file as new users created.
    New hosts were added to the /etc/hosts file that the systems could communicate.
    Today, we use information and lookup services such as NetInfo, NIS, and LDAP on
    many systems to replace the simple text files.


    The most important NetInfo commands are nidump, nilaut, and niutl. The nidump
    command displays the NetInfo contents. The command nidump passwd displays the
    entries that were stored in the /etc/passwd file on Unix systems.


    NetInfo is a lookup service or database that contains many\NetInfo is a lookup
    service or database that contains many types of information. In fact, if you look
    for


