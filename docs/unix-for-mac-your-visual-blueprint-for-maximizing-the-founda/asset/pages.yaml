  md: '# WORK WITH TEXT


    # Extra


    If you redirect output to an existing file, you overwrite that file with the new
    text output. This can be dangerous, because indiscriminately overwriting files
    can lead to loss of data.


    You can instruct the shell to prevent output redirection from overwriting existing
    files by typing the command noclobber. The shell prints an error message saying
    that the destination file exists, and the command does not execute.


    If you have the noclobber command set up and you need to overwrite an existing
    file, you can type an explanation point (!), or after the greater-than symbol.
    This causes the redirection to occur even if the file exists.


    Example:


    ```

    [ferro:]] head /var/log/system.log > log

    [ferro:]] set noclobber

    [ferro:]] tail /var/log/system.log > log

    log: File exists

    [ferro:]] tail /var/log/system.log > log

    [ferro:]] user

    ```


