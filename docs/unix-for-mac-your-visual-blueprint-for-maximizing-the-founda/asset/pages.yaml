  md: '# CHECK ANOTHER COMPUTER IS REACHABLE


    You can check whether a remote system is reachable using the ping command, and
    trace routes using traceroute. Whenever you have trouble making a connection to
    a system, you can test the connection using ping — a simple command that sends
    a request in form of a packet to the remote system, requesting a reply; that the
    sound sonar makes when locating an address.


    connection. If your system receives a reply for every request, you probably have
    a good connection.


    Another useful command for testing network connections is traceroute. The traceroute
    command attempts to time the connection between your system and each successive
    router in the route to the target host. The result is a list of each hop, along
    with reports how long it took to reach each one. This timing information can help
    interpret the quality of the connection.


    If the remote system is running and capable of replying, it responds to the request
    with an echo. Ping requests until you press Ctrl+C. It displays a summary of the
    responses, including how long each round trip took. This tells you whether you
    were able to reach the remote system and indicates the quality of the


    Both ping and traceroute rely on a protocol called the Internet Control Message
    Protocol (ICMP) which is sometimes blocked on routers. If you run ping or traceroute
    on a system the results may show that the system is unreachable, but you may be
    able to reach it with a telnet or ssh.


    # CHECK ANOTHER COMPUTER IS REACHABLE


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_153_0.png)


    ```

    $ [[ferro.shell]] users ping www.apple.com

