  md: '# EXIT THE TERMINAL WINDOW


    When you are using Unix shell commands, you can exit your shell and close the
    Terminal window, or terminate the Terminal application. To do this, simply click
    the red Close button in the upper left-hand corner of Terminal window. Alternatively,
    you can choose Window from the Terminal menu or Quit from the Terminal. However,
    these are not necessarily the best ways to shut down a window.


    For this reason, it is best to use the exit command to leave a shell in a window.
    The exit command ends the shell, but leaves the Terminal open. After you quit
    the shell, you can close the window manually by clicking the red Close button
    in the upper left-hand corner of Terminal window. You can change this behavior
    in the settings for Terminal by setting the windows to close automatically when
    the shell ends.


    This is because Unix shell commands can continue to run in a Terminal window even
    if they do not appear on the screen, or seem to do nothing. When you close the
    window, you terminate the application that started those commands and as a result,
    you often terminate the commands as well.


    If you close a window without exiting the shell, you probably do not do any harm
    to it while commands are running. The Terminal application tries to prevent this
    by warning you if you close a window that contains a running command. You can
    continue closing the window, or cancel the window closure.


