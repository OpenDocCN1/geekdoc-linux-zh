  md: '# UNIX FOR MAC


    # # INTRODUCTION TO UNIX


    You can get full use out of your Mac OS X computer by learning the ins and outs
    of the Unix operating system. Even though you may not know it, Unix exists every
    time you turn on your Mac OS X computer, because at the core, Mac OS X is Unix.


    For most users, the Unix foundation for Mac OS X operates behind the scenes; they
    may Mac OS X for years without needing to directly access the Unix features described
    in this book. However, by understanding and using Unix, you can take full advantage
    of the power of Mac OS X.


    # ## THE HISTORY OF UNIX


    The original version of UNIX was created in the 1960s in the Bell Labs of AT&T,
    by researchers who developed a multi-user operating system for large mainframe
    computers. The role of an operating system like Unix is to provide basic functions
    such as running programs,


    saving data, and sending output to a monitor or other device. On your Apple computer,
    these functions are provided by the Mac OS X system, a direct descendant of the
    original operating system.


    # ## BSD Unix System


    From AT&T, the Unix system to research universities, that quickly adopted it.
    The University of California, Berkeley, was one of the earliest adopters and developers
    of Unix. The staff and students at Berkeley added many more features to this everevolving
    system. The updated Berkeley


    version of Unix was known as Berkeley Software Distribution (BSD), and it forms
    a major branch of the operating system family tree. The BSD tree must be an apple,
    because the most recent fruit is Mac OS X, which is based on the Unix system from
    Berkeley.


    # ## Free Operating Systems and Applications


    The most famous open-source software is the free operating system as Linux. A
    young, Finnish developer namedus Torvalds created Linux to run on Intel-like PCs,
    as well as other hardware. In addition to Linux, there are several versions of
    BSD Unix, as Free BSD, Open BSD, and Net BSD. Mac OS X is a cousin to these free
    operating systems, but is not itself free


    Computer programs begin as source code, written in a computer language by programmers.
    They are transformed into applications that you can run through a process called
    compiling, which translates the source code into commands that a computer can
    understand.


    You do not need the source code to run the program. However, if you have access
    to the source code, you can recreate the application, or change the application
    by modifying the source code. Many commercial companies do not make their source
    code public because if they did, nobody would buy their software. Other groups
    make their source code freely available to the public; this is known as open source.


    The largest collection of open-source applications comes from the GNU project,
    developed by the Free Software Foundation. GNU is an acronym for GNU''s Not Unix,
    and that, is self-referential. Many of the Unix applications that you run are
    based on GNU code.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# MAC OS X AND UNIX


    Up to and including Mac OS 9, the Apple operating system was not based on Unix.
    There was no Unix code at the core of Mac OS 9 or earlier systems; instead, used
    an operating system that was developed within Apple Computer.


    # Darwin


    When it was time to create the next version of Mac OS, Apple chose to base it
    on a BSD foundation, modified for the specific needs of Apple. This version of
    BSD was called Darwin. Darwin consists of the Unix kernel, which runs and manages
    all the shells of the operating system, along with associated programs and files
    that make it work. Darwin is open and available on the Web from http://developer.apple.com/darwin/;
    you will probably need to use it.


    Not all Mac OS X operating system is open; for example, the programs used to create
    the Mac OS X desktop and windows, known collectively as Aqua, are not available
    for free and are only distributed as compiled applications.


    # Shell Commands


    The original programs that ran Unix were not graphical; windows, drop-down menus,
    desktops, and the point-and-click capabilities of the mouse came later. Early
    versions were mostly text-based, taking input from the keyboard and displaying
    on screen, or sometimes on a printer. This meant that all Unix programs were text-based,
    and responded to keystrokes. Users used the operating system through commands
    to provide an application.


    The operating systems of today can handle graphics with ease, but underneath the
    graphical windows, text still reigns supreme. Your Mac OS X computer is no exception.
    In Mac OS X, you enter shell commands through an application named Terminal.


    # Aqua


    Each time you run Mac OS X on your computer, you are running Aqua. Aqua is the
    graphical user interface system that gives your Macintosh the distinctive look
    and feel of Mac OS X — the main menu at the top, the Dock, the desktop, the upper
    left corner of each window. The Aqua interface allows for point-and-click to applications.
    In fact, Aqua is a graphical that runs atop the Mac OS X foundation of Unix; Aqua
    starts automatically to provide you with the familiar Mac OS X interface, designed
    for both keyboard and mouse.


    # X Window System


    The Window System is another graphical user interface system that is used on Mac
    OS X. Although it does not come with standards running; however, both the letter
    X, are not related — the X in Window System comes from a successor to earlier
    window-based system named W, and in Mac OS, of course, for the Roman ten.


    Because the X Window System is used on many other computers, including Linux,
    BSD, and Solaris machines, there are many of applications written for the X Window
    System and free. You can run X Window System applications on your Mac OS X by
    installing an application called an X server, which gives you access to a wide
    variety of X Window System software.'
  merge: -1
