  md: '# SYSTEM ADMINISTRATION COMMANDS


    # Extra


    The log file that gathers the most information on Mac OS X systems is system.log.
    The system writes many routine messages to this file, and the system.log file
    is routinely rotated. Older system.log files are renamed system.log.0, and so
    on, and are compressed with gunzip to save space. At any point, you may have a
    number of these files available to you to help track down a problem. Any log file
    has thousands of records — far too many for you to read the file from top to bottom.
    Using commands like grep and awk to extract some of this data can make the log
    data much easier. You might consider writing scripts that check for certain types
    of errors in your log files and report the findings to you. You can check the
    /etc/syslog.conf file to see particular types of messages written.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_186_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_186_1.png)


    +   The Applications folder appears in a Finder window.


    +   Scroll down until the Utilities icon is visible.


