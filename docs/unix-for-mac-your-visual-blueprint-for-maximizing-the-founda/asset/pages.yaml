  md: '# START THE TERMINAL APPLICATION


    You can use the Mac OS Terminal application to enter Unix shell commands and run
    Unix applications. The name of the Terminal application refers back to the physical
    devices that were connected to Unix mainframes. Each terminal consisted of a keyboard
    for input and a screen for text output. The Terminal provides this function, allowing
    you to enter your commands through the keyboard and view the output in the Terminal.


