  md: '# EDIT A FILE WITH PICO


    You can edit text in the Pico editor, performing basic tasks such as finding specific
    text or saving a file. Pico is based on the text-editing functions of the Pine
    email program, a shell application allows you to compose, send, and re-mail. You
    can learn more about installing and using the E-mail program in Chapter 13.


    The Pico text editor has several command-line options that you can use when starting
    the editor. The -f option activates the function keys, although you should note
    that only the first four keys, F1 through F4, work in Mac OS. The -v option opens
    a file in read-only mode, which means that you cannot make changes to the file.


    If you edit a file with long lines, Pico does not automatically wrap the lines
    of text to fit the size of the window. Pico shows a sign ($) at the right side
    of the window for each line that extends the width of the window. You can view
    these lines by moving the cursor or down with the arrow keys, and then using the
    right and left arrows to move through the line.


    The most used Pico commands are those that find and modify text, save a file,
    and then allow you to exit the editor. For example, to search for a phrase, or
    to save the content. At saving it asks if it is writing an output file, so you
    can use the Control + O to save your file. If you do not save the file, Pico asks
    you whether you want to save the file.


    # EDIT A FILE WITH PICO


