  md: '# INSTALL AND USE INTERNET APPLICATIONS


    # Extra


    While the mail command is useful, UNIX users today prefer to use more versatile
    tools for sending and receiving e-mail. The simple mail command, after all, cannot
    properly display e-mail that arrives in HTML format or allow you to fetch and
    attach attachments. The mail command was created long ago and attachments were
    used in e-mail.


    The mail command is also very helpful for use within scripts. For example, if
    you write a script to routinely check disk space, you may want the script to send
    the result of the disk check to you via e-mail. You can use a line of code such
    as -k "disk usage" user@domain.com in a script that runs once a day through cron
    to remind yourself to look at your disk space.


    Even so, the mail command continues to provide a service. For example, simple
    e-mail messages from the command line can help you determine whether a mail server
    is working.


    Mail files, typically thought of as invoices, are stored in /var/mail/. Each user
    on the system with pending mail would have a single file in that directory. The
    index user would be /var/mail/user.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_230_0.png)


