  md: '# CONNECT TO THE INTERNET


    Internet is a loose connection of systems and networks that span the globe. This
    supernetwork makes it possible for people in New Jersey to send email to people
    in Ethiopia, for those in California to find their Pennsylvania grandmother''s
    recipes on the Web, and for people to chat and find meaningful relationships with
    people they may never meet face to.


    If your Macintosh is a home-based system, you will probably hook up to the network
    using a dial-up or DSL connection. If your Macintosh is on your desk at work,
    you will probably hook up to network wiring that is installed throughout your
    building. After you are connected, you can use all the services of the Internet
    from your clients, such as telnet and ftp, to web and surf.


    Connecting Mac OS X to the Internet is relatively easy. You can establish dial-up,
    digital subscriber (DSL), and local area network (LAN) connections, depending
    on your resources and circumstances.


    Unix systems were built to be networked. In fact, the first Unix systems and the
    first efforts to connect systems from different locations on the first internetworks
    started as contemporaries. Mac OS X is no exception. Mac OS X networking — a collection
    of protocols called Transmission Control Protocol/Internet Protocol (TCP/IP) —
    namely.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_145_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_145_1.png)


    +   The System Preferences window opens.


    +   Your dial-up connection is established.


    +   Select Network under Internet & Network.'
