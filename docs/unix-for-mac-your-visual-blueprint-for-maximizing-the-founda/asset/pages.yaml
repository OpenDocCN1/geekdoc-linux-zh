  md: '# WRITE SQL COMMANDS


    You can use SQL commands to your PostgreSQL database. To use all the features
    of your database software, you need to learn how of SQL commands. In particular,
    you need to learn how to create tables, insert and remove records from these tables,
    and run queries to extract information from these tables.


    You define each column in the table as a particular type. Most of these types
    are character fields of a specified length. After you define a table, you can
    add records to it. You can do this one record at a time, or you can build a table
    from a flat text file. To add a single record, you identify the type that you
    want to assign to each column in the table. For example you may insert text into
    values: ''Paul Whiteand and Eric Kramer'', for building Pearl scripts, ''Wiley
    visual blueprint Publishing'',2000,''0-7645-3478-5''; paying particular attention
    to the semicolon at the end.


    The command for creating a table is create table. When you define a table, you
    need to specify the number of columns you want to add. For example, the SQL command
    for adding a book to the database may look like this:


    +   - author varchar(32),

    title varchar(64),

    publisher varchar(16),

    ISBN int,

    varchar(13)


    You can list the contents of the books in its entirety with the command select
    * from books; or you can select some of the records by running a select statement
    with a where clause. For the titles of the books in your table that were published
    in the year 2000, you can type select list books from pububey=2000:


