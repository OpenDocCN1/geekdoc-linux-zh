  md: '# # READ FILES WITH PERL


    You can read any number of files from a Perl script. There are also a number of
    ways to read files in Perl, the most straightforward being to use the open command
    with the name of the file as an argument. For example, to open the file myfile.txt,
    you can use the open command (INFILE, "myfile.txt"); this command opens the file
    and associates it with the file handle. You can use the name of the file by using
    a command such as $myfile="/Users/user/myfile.txt"; and then open the file with
    an open command such as (INFILE, $myfile); If you assign the filename at the beginning
    of the script, your script is easier to modify.


    You can also open a file explicitly for reading by using a < symbol within your
    open command. For example, you can use the command (INFILE, "<myfile.txt").


    is good practice if you want to ensure that the files that you read are preserved,
    as it opens the file only for reading, and disallows any write operations.


    Just as the < symbol indicates that a command is opening a file for reading, the
    > symbol indicates that a command is opening a file for writing. Using the > symbol
    indicates that a command is opening a file for appending. In other words, you
    write from the end of the file, preserving the contents of the file.


    To be sure that your scripts do not malfunction when input files do not exist
    or are unreachable, you can add an or clause to your open command: open(INFILE,
    "myfile.txt") or "Cannot open myfile.txt for reading" displays the cautionary
    message if the file is unreachable, and exits the script.


    # READ FILES WITH PERL


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_269_0.png)


    +   1 Type pico read1 and press Return.


    +   2 Type #usr/bin/perl -w and press Return.


