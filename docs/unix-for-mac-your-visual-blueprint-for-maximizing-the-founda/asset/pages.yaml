  md: '# RECALL YOUR COMMAND HISTORY


    You can list the commands that you have typed before using the history command.
    You can also use special characters to repeat or edit commands that you have already
    typed.


    The history command lists the commands you have typed since opening this Terminal
    window, along with the time each command was run. The history command lists the
    100 most recent commands, provided that you have typed more than 100 commands
    into the current Terminal window.


    You can repeat commands or portions of commands using the history recall built
    into the shell. You do this by typing an exclamation point (!), or bang, followed
    by a special code that indicates information from your history you want to recall.
    There are a number of different codes you can use, specifically being two exclamation
    points (!!): this repeats the last command you


    If you type an exclamation point and some letters, the shell searches through
    the most recent command beginning with those letters, and repeats that command.
    In both cases, the shell displays the recalled command immediately before executing
    it. A list of other history codes appears on the following.


    You can also edit the previous line by using a caret (^). This is a method to
    correct a mistake you may have made, or to change a command so that it applies
    to different files. You use the caret as:


    ```

    ^old-text^new-text

    ```


    The command is repeated, with the old-text replaced by new-text. For example,
    if you have typed cd /usr/share and want to correct yourself, you can type cd^sh=share
    and press Return.


    # RECALL MY COMMAND HISTORY


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_101_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_101_1.png)


    # LIST COMMAND HISTORY


    +   - The shell lists all the commands you have typed into the current Terminal
    window.


    +   - Type history and press Return.


    # REPEAT THE LAST COMMAND


    +   - The shell displays the previous command.


    +   - Type !! andrae press Return.


    +   - The shell executes the previous command.'
