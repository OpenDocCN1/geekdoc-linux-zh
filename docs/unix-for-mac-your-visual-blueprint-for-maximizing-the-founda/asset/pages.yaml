  md: '# PRINT TEXT ON A PRINTER


    You can print a file on your printer using the lpr command. You can format and
    print a file on a PostScript printer with the encript command. The lpr, or line
    printer, command sends text directly to your printer. The printer simply outputs
    the lines, in the order it receives them. The syntax for the lpr command is


    If you try to print a non-text binary file, two things may happen: If the binary
    file is in a format known to the printing system, such as a JPEG image file, it
    prints on your printer. However, if it is an unknown file format, or an executable
    binary file, it may not print at all.


    ```

    lpr filename

    ```


    The lpr command also prints text that is piped from the standard output of another
    command:


    You can also use the encript command, which converts your text to PostScript.
    PostScript is a computer language understood by many printers; you should check
    your printer to see if it understands PostScript. If it does, you can use the
    encript command to create a printer text.


    ```

    another command | lpr

    ```


    If you do not connect a printer to your computer, the lpr command does not work,
    and you receive an error message.


    The encrypt command produces better output than the lpr command, because PostScript
    lets you use special effects. For example, you can place a large, diagonal message,
    such as Top Secret, in light gray under your text. This is known as an underlay,
    and is set by the --underlay= option of the encript command.


    # PRINT TEXT ON A PRINTER


