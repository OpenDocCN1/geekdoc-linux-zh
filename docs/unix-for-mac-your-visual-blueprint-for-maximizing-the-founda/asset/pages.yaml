  md: '# DESIGNATE FILES BY PATHNAME


    You can include a pathname to indicate a location outside of your current directory
    when you give a filename as an argument to a command such as cp. The file system
    of your Mac OS computer is set up as a


    hierarchy of folders containing files and other folders. Each of these folders
    corresponds to a directory. You can view the folders in the Mac OS X Finder application,
    or access them as directories through the Unix shell.


    # USING PATHNAMES


    A pathname specifies the place where you can find a file, just as an address tells
    you to find someone in the physical world. For example, one might describe your
    current location by saying that is on the Earth, in the country known as the United
    States of America, in the state of California, in the city of Orange, within the
    city of Fullerton, on Willow Avenue, in building number 110, on the Garden Level,
    in suite G-1, in the back office, at the desk of Kynn.


    the Users directory, in the Documents subdirectory of the kynn directory, and
    that it has the filename Chapter 02.doc. You can write that pathname as /Users/kynn/Documents/Chapter
    02.doc.


    A file, on the other hand, might say that it is on a hard drive, in the Users
    directory, in the kynn subdirectory


    When writing the pathname, you must separate each directory name with a forward
    slash (/). If the pathname contains a space, you must enclose it in quotation
    marks to refer to it in Unix.


    # Relative and Full Pathnames


    The desk of Kynn is in an office that also contains the directory of Laura. If
    you want to describe the location of Laura, you say out everything starting with
    the planet file. This is a location relative to the directory belonging to Kynn.
    You do not need to specify a pathname if you are already in the same directory.
    For example, if you are working in the /Users/kynn directory and you want to copy
    the Chapter 02.doc file described above, you do not need to type the pathname:


    The start of the Unix file system is the root directory, and you indicate it by
    an initial slash (/). A pathname beginning with a forward slash is therefore a
    full pathname, and is only relative to the root directory. Starting the pathname
    with the root directory is like starting with the planet file when telling someone
    where you are; the root directory corresponds to the Earth. Use full pathnames
    to reference files that are outside of the directory in which you are currently
    working. For example, to copy a file in


    ```

    [ferro]:~ user cp Documents/Chapter 02.doc" backup-ch2.doc

    ```


    This creates a copy of the file with the new name backup-ch2.doc. Note that this
    is in the /Users/kynn directory, not in the Documents directory.


    ```

    [ferro]:~ user cp /usr/share/dict/usernames-name-list.txt

    ```


    # Aliases for Special Pathnames


    Three pathnames refer to special directories. The alias (.) refers to the current
    directory in which you are working. The alias dot-dot (..) refers to the parent
    directory — directory which contains the current


    directory, the tilde (~) refers to your Home directory, where you store your personal
    files. If you give the name of another user immediately after the tilde, it refers
    to the Home directory of that user.'
