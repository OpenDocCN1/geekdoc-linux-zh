  md: '# CONFIGURE SENDMAIL


    You can configure sendmail on your Mac OS X system. Sendmail is a mail server;
    it can listen for e-mail requests from other systems. Sendmail configuration is
    one of the most difficult tasks in Unix administration. The software is complicated
    and its initial deployment on Mac OS X brings along additional problems that must
    be resolved. However, with a little care and some insight, you can manage it easily
    and with a mail server that behaves properly.


    Some of the difficulties related to sendmail on Mac OS X are due to a conflict
    between the way Mac OS X and sendmail deal with directory permissions. Where sendmail
    wants to be user root, Mac OS X is far more lenient about directories it can use
    only to support privileged users like creating root-owned directories. If you
    try to start sendmail using the default configuration, sendmail will fail at world
    writable directories.


    The easiest way to resolve the conflict between sendmail''s cautious character
    and the lenient directory permissions of Mac OS X is to modify DontBlameSendmail
    in sendmail configuration file. This name refers to the fact that the developers
    of sendmail do not want you to reduce its level of security. Modifying the setting,
    however, allows sendmail to start and not reduce your system security.


    Sendmail''s configuration file is stored in /etc/mail and is called sendmail.cf.
    You should always use care in editing this file as the lines are difficult to
    understand and easy to mistype. However, it is not especially difficult to generate
    a new sendmail configuration file and the tools you need to do so are already
    on your system.


    # CONFIGURE SENDMAIL


    | Terminal File Edit Edit Scrollback Font Window Help |

    |---|---|---|---|---|---|---||

    | | | | | | | |


    ```

    [ferro:-] user$ sudo vi /etc/mail/sendmail.cf

