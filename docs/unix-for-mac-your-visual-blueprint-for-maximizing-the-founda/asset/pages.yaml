  md: '# INSTALL AN IRC CLIENT


    You can install an Internet Relay Chat (IRC) client on Mac OS X, IRC, or clients
    that allow you to participate in interactive dialog with other people on the forum.
    Unlike email where many days may elapse between when you send a message and the
    recipient reads the message, chat dialog is immediate. You chat with people who
    are active chat clients.


    Chat tools, as AOL Instant Messenger (AIM), are based on the IRC protocol. It
    relays your message between servers. If you do not have chat on your Mac OS X
    system or if you want to upgrade your chat client, you can use the Get Mac OS
    Software option on your menu. From there, you can scroll down to find the AOL
    Instant Messenger


    whatever chat you decide to use, you probably want to keep it in the Dock so you
    can start it up by clicking the icon. You can use any chat client, however, you
    need to register a screen name. If you use .Mac screen name, or if you are already
    an AOL Instant Messenger user, you can use that screen name. Otherwise, you need
