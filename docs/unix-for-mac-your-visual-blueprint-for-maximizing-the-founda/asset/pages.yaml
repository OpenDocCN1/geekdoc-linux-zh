  md: '# Apply It


    You can change the permissions for an entire directory and its contents, including
    your Home directory, by using the -R option with the chmod command. The -R option
    dictates that be changed recursively, which means that the changes apply to all
    files in that directory or in subdirectories.


    For example, if you want to make your Home directory readable only by you and
    not by other users of your computer, use the chmod -R command.


    # TYPE THIS:


    ```

    [ferro--] user chmod -R go rx-

    [ferro--] user ls -l

    ```


