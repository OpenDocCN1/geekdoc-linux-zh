  md: '# SELECT FILES USING WILDCDS


    You can use wildcard characters to avoid having to type out the full name of each
    file you want to work with in Unix. This saves time but also lets you refer to
    multiple files with similar names in a single command.


    Unix wildcards are also called glob-patterns, the use of these wildcards is known
    as globbing in Unix. You can use these wildcards whenever you give a filename
    argument to a shell.


    The asterisk (*) matches any sequence of zero or more characters in a filename.
    The question mark (?) matches any single character. Characters in brackets ([])
    match any single character within that range. Keep in mind that letters are case-sensitive,
    [a-m], the letter D is not because it is not lowercase between a and m.


    A caret (^) at the start of a pattern or range of characters indicates that the
    pattern should select those characters that do not match the given pattern. For
    example, if you want to use the * command on all directories and files use the
    -r option to remove all files beginning with doc, followed by three entries, and
    ending in .doc, you can type rm -Documents???.doc. You should always use the -i
    option with rm if you want to avoid deleting the wrong files. A reckless rm *
    strong directory can remove the contents of the directory.


    Hidden files are resistant to being identified through wildcards. The command
    ls *, for example, does not list them while ls .* lists hidden files.


    # SELECT FILES USING WILDCDS


    | Terminal File Edit Scrollback Font Window Help | Terminal File Edit Scrollback
    Font Window Help |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

