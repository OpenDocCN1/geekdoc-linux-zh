  md: '# CREATE A SIMPLE TEXT FILE


    You can create a text file using the cat command and redirecting the output to
    a file. If you type and press Return, the cat command appears to do nothing, but
    your prompt does not return. When you type something else and press Return, you
    just see whatever you typed back at you. This means that the cat command enters
    your content. You are building a virtual file that exists for the execution of
    the command. As long as you continue to type, you are adding content to virtual
    file.


    make simple text files. Output redirection means that you save the results of
    a command to a file instead of displaying them on-screen. To redirect the output
    of the cat command, you can type:


    ```

    cat > filename

    ```


    To indicate that you are finished entering text into the cat command, you must
    indicate the end of your virtual file. You can do this by pressing Return and
    then pressing Control + D.


    This creates a new file called filename.txt. For better compatibility with the
    Mac OS Finder, you may want to name a file with the extension .txt. This allows
    you to double-click the icon for the file and open it in the TextEdit application.


    The contents of the new file are whatever you type after pressing Return. The
    file can contain multiple lines; just press Return at the end of each line. When
    you are, you can press Control + D to create the file.


    By itself, the ability to type text and see it on-screen is not particularly useful.
    However, you can combine the cat command with output redirection


    # CREATE A SIMPLE TEXT FILE


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_52_0.png)


    +   - Type cat and a space.

    - Type a greater-than symbol and a space.


    +   - Type the name of the file you want to create, and press Return.


    +   - Type the text you want the file to contain.


    +   - The cat command creates a file containing the text you typed.


    +   - Press Return.'
