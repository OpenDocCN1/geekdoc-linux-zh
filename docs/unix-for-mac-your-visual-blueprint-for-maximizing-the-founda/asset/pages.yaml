  md: '# RUN APPLESCRIPT FROM THE SHELL


    You can run AppleScript commands or files from the command line, letting you access
    and control other Mac OS. AppleScript is a simple but powerful programming language
    built into Mac OS X. It is relatively easy to read and understand because it uses
    a syntax similar to English. For example, to display the Finder a pop-up dialog
    box, you can use the following AppleScript:


    The first version runs an ascript language; you do not need to set the script-file
    executable. If you omit the script-file argument, the ascript command reads lines
    of script from the standard input.


    The second version of the command executes and a single line of script that is
    specified on the command line. You can include -e arguments if you want to execute
    more than one line of script at the same time.


    ```

    tell Application "Finder" to display dialog

    "Good morning",

    ```


    The AppleScript language follows the Open Scripting Architecture (OSA) standard,
    making it an OSA. For a full list of OSA languages installed on your computer,
    you can type the osalang command. To execute scripts in OSA languages from the
    command line, there are two ways to do this:


    ```

    osascript-file

    osascript -e ''one line of script''

    ```


    You use the AppleScript language in many more ways than shown here. You can use
    AppleScript to control Mac OS X applications. To learn more about the AppleScript
    language, www.apple.com/applescript for Apple''s Web site.


