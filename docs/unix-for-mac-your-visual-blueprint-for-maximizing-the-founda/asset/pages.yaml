  md: '# WRITE PHP APPLICATIONS


    You can develop PHP applications in your Web site. PHP is a relatively new language
    that integrates easily with the Apache server. When you write code in PHP, you
    can dramatically reduce the time that it takes for you to develop Web applications.
    In order to use PHP, your Apache binary must support it.


    You must always enclose PHP scripts between two PHP tags. The tag pairs can be
    in one of several forms, such as <?php ?> or <??php ?>; although some programmers
    use <?php and ?>.


    To understand the similarities between PHP and HTML, you have only once to look
    at some sample code. For example, to print a variable on a Web page, PHP mimics
    the style of HTML while using special tags only to HTML.


    PHP uses many commands, including printing, looping, if commands, arrays, and
    if you are already familiar with HTML, you will grasp the fundamentals of PHP
    quite easily.


    PHP is a server-side scripting language. This means that the interpreter is installed
    and configured on the server before it is used. No special client-side setup is
    required. The language features features from Perl, Java, and C, most people who
    have programmed in any of these will feel home with PHP.


    ```

    <html>

    <head><title>Latest Counts</title></head>

    <body><?php echo $count<br>; ?></body>

    </html>

    ```


    PHP files do not need to be executable, and the output appears indistinguishable
    from HTML.


    All text to be written to the screen must be enclosed in double-quotes and all
    commands will end in a semicolon. Pages containing PHP commands should be saved
    with the extension .php.


    # WRITE PHP APPLICATIONS


