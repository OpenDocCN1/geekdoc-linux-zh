  md: '# FETCH E-MAIL FROM OTHER SERVERS


    You can fetch e-mail from remote servers using the fetchmail tool. Fetchmail is
    a retrieval and forwarding tool that supports all the import protocols for retrieving
    mail from email servers. These include the most popular - POP3 and IMAP - as well
    as others of peers: RPOP, RPOP, AFOP, ETR, and OMDAR.


    that only the individual user can read this file. In fact, fetchmail warns you
    if the permissions on the file are not set to 710. This means that the owner can
    read, write, and execute permission, while the group has only execute permission,
    and no one else can access the file.


    Like many tools, fetchmail uses a configuration file, .fetchmail, to store information
    about your accounts. You can add lines to your .fetchmail file:


    ```

    poll mail.mailserver.org protocol POP3 user

    nick password wormx name

    ```


    In this example, nick is the username for the remote account, while john is the
    local user. The server you check for downloadable e-mail is called .mailserver.org.
    As you can see, the password appears in clear text. For this reason, you must
    set permissions on the .fetchmail file so


    Storing the password in the file saves you from having to enter it each time you
    use fetchmail. This also allows fetchmail to automatically run through cron for
    daily or more frequent downloads.


    Your system must be running fetchmail to work properly. Fetchmail works by transferring
    the mail to the smtp server on your local system. If you are not sending mail,
    you can use .fetchmail file to process inbound by making it like this:


    ```

    poll mail.mailserver.org protocol POP3 user

    nick password wormx name "/usr/bin/fetchmail -d"

    ```


