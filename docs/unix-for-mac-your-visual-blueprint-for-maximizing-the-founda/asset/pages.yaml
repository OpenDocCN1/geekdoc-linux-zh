  md: '# UNIX FOR MAC


    # INTRODUCTION TO APACHE


    pache is the most popular Web server on the Internet today. Accounting for roughly
    60 percent of Web servers and probably 80 percent of the available Web-server
    books, Apache is one of the open source products that has become a part of the
    foundation of the Internet. It is well used, well understood, and well implemented.


    # HOW WEB SERVER WORKS


    The purpose of the Apache Web service is to listen for requests from Web browsers
    and serve the pages requested. Like any important Internet service, Apache runs
    on a dedicated port. This is not dedicated to Apache, but to the HTTP protocol
    that Apache and browsers use to communicate with each other.


    When a Web server receives a request, it looks at certain configuration variables
    to determine which page it should send back to the client. For Apache servers,
    that page is usually called index.html, though with the prevalence of Java and
    other tools on the Web, it may just be a static page. If it is a static HTML file,
    the server transfers it to the client immediately. Many other types of pages are
    created after the request arrives on the server, with information read from cookies
    on the computer of the client or stored on the server. This information allows
    customized pages to be created for each user. In any case, when the page is ready,
    it is sent to the client. This happens in a matter of seconds even when the server
    is halfway around the world.


    After you install and run a Web service, curious visitors may type your URL into
    their Web browsers and perhaps your site has to output a variety of types, on
    address such as www.dragonfly.com into a Web browser, the address is first passed
    to a DNS server for translation. Then, a request is made to port 80 on the remote
    system. This request is essentially GET / a request for the home page or default
    document on your site.


    # FREE AND CONFIGURABLE


    Apache is popular because it is free to any user, although this is not the only
    reason. Apache is also extensible through a collection of modules and can be customized
    for an intended use. You can add or remove modules at build time, so the resulting
    binary contains only the features that you need. Apache also supports


    all of the features that might expect in a Web server. Configuring Apache for
    name-based virtual servers, where multiple sites run on the same machine while
    appearing to be independent, is easy. Configuring security and tuning the server
    for expected traffic are also simple processes.


    228'
