  md: '# INTRODUCTION TO THE X WINDOW SYSTEM


    You can install and use the X Window System to enhance the capabilities of your
    Mac OS system. The X Window is a windowing system that facilitates the sharing
    of windows on a network. For example, you can run an application on one system
    and send the display of that application to another system.


    In addition, if you install X Windows on your Mac OS system, you can take advantage
    of numerous tools that were specifically built to work on the system. X is a windowing
    system that works through the cooperation of separate components. The native windowing
    system on Mac OS X is called Aqua.


    # FULL SCREEN VERSUS ROOTLESS


    The X Window System, often referred to as X Windows or X, can run in one of two
    modes. The first is full-screen mode. In full-screen mode, the X window server
    takes over your desktop, replacing Aqua.


    The second is called rootless mode. In rootless mode, the X windows live side
    by side with your Aqua tools rather than taking over the screen.


    # WHICH X IS WHICH?


    There are several versions of X Windows that you can run on Mac OS X. XDarwin
    is a port of the XFree8 software and is free. You can also get an XI1 implementation
    from Apple that is also based on XFree8 and is a relative newcomer to the X scene.
    There is a commercial


    Window System implementation called XTools available from Tenon. All X servers
    perform the same function and support the X protocol. Given the significant efforts,
    installing an X server on your Mac OS X system should not be difficult.


    # SERVERS AND CLIENTS


    In the world of X Windows, the terms server and client take on new meanings. The
    X server is your display — the screen in front of you that you can think of as
    windows — environment in which your applications run. The client is any application
    that produces output for the server to display. Another important player in the
    world of X is the window manager. A window manager, such as twm or Enlightenment,
    adds a layer of control to your desktop and stylistic elements to your windows.
    Desktops attempt to provide a more complete interface to the


    system and generally provide a suite of integrated tools and applications.

    Many desktop environments support X Windows natively. This is true, for example
    of the common desktop environment (CDE) on Solaris, and GNOME and KDE on Linux
    systems. Aqua does provide support for X Windows without adding software such
    as XFree8 any more than Microsoft Windows does. For these systems, you may acquire
    and install X server software separately.'
