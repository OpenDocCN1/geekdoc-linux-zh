    Before you can use a Perl module in your script, you must load it with the use
    command. The command use diagnostics: loads the module diagnostics.pm from /System/Library/Perl
    directory. The command Net::Telnet: loads /System/Library/Perl/Net/Telnet.pm.


    You can build your own Perl modules. If you develop Perl code that may be used
    in many scripts or by many users, you may want to turn the reusable code into
    a module and install it into the /System/Library/directory.


    You must use the package command to create Perl modules, and you must organize
    them as subroutines, and name them with the file extension .pm. Construction of
