  md: '# SET SHELL VARIABLES


    You can affect the way your shell functions by setting shell variables. A shell
    variable can either have a value or it has no value — in which case the value
    is null. You can think of variables as simple-or-off switches. If the switch is
    on. If the variable is not set, the switch is off.


    A shell variable with a value, on the other hand, acts like a blank line on an
    application that you can fill with correct information. If you are applying for
    a job, for example, there is a line Named on the application where you fill in
    your name, and another labeled E-mail where you write your e-address.


    To set a variable, use the following command:


    ```

    set variable

    set variable = ''value''

    ```


    The first example sets the variable without giving it a value; it simply sets
    the switch to on. The second example sets the variable to a value, like filling
    in a blank on a job.


    If you type set by itself, you see the list of your current shell variables. The
    shell automatically sets many of them when you start up the Terminal or when you
    type commands. In addition to these, you can set a number of other variables that
    affect how shell works. See the table below on the facing page.


    Shell variables normally last as long as the terminal is open, although you can
    use the unset command to get rid of shell variables beforehand. To make your settings
    permanent, edit ".~tcshrc" file in this chapter.


    | Terminal File Edit Scrollback Font Window Help |

    | --- | --- | --- | --- | --- | --- |

    | Terminal — typa | |

    | [ferro:]~userset naaclober |

    | [ferro:]~user set |

