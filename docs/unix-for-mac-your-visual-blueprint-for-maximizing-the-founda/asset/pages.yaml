  md: '# GET STARTED WITH UNIX


    # USING SHELL COMMANDS


    # Executable Files


    Most commands that you enter on the command line are requests to run a program
    of some kind. The command may be a compiled program originally written in a language
    such as C++ and now saved on disk as a binary file. To run, a file must be executable.
    *Executable* refers to a script written in Perl, or it may be a shell script.
    Setting shell variables, repeating commands, and moving through the file structure.


    The shell locates the executable by searching through the set of locations on
    your hard drive called *path*. The path is a list of folders, also called directories.
    If you type the name of an executable within one of those folders and press Return,
    you are running that file as a shell application. By default, your path contains
    a reasonable set of directories, you can add other file locations.


    # Built-In Commands


    Some of the commands you type are built directly into the shell application and
    do not exist as separate files. These functions include starting and stopping
    commands, setting shell variables, repeating commands, and moving through the
    file structure.


    You use the *which* command to determine whether a command is built-in or an executable
    file.


    You can get a full list of the shell built-in commands by typing the command builtins
    at the shell prompt. The *which* command is quite useful the *which* command tells
    you whether a command is a built-in command or an executable file; if it is an
    executable file, the shell lists the location of that file.


    # TYPE THIS:


    ```

    [darwin~] which w

    ```


    # RESULT:


    ```

    /usr/bin/w

    ```


    You can see from this output that w is an executable file stored in the location
    /usr/bin/w.


    # TYPE THIS:


    ```

    [darwin~] user% which

    ```


    # RESULT:


    ```

    which: shell built-in command.

    ```


    This output tells you that the *which* command is built directly into the shell
    application.'
