  md: '# INSTALL DEVELOPER TOOLS (CONTINUED)


    While many of the tools on the developers CD are intended for Java development,
    there is also a large set of tools to help you build applications in other languages.
    The version of gcc that is included is a compiler for C, C++, and Objective-C
    applications. The gcc pre-processor and cpp tools are preprocessors. The latter
    works with C++ and Objective-C.


    libtool creates both dynamic and static libraries and is used by gcc as needed.


    The developer tools also provide CVS, a tool for maintaining source code that
    you maintain with the GNU Foundation. CVS allows you to create any particular
    version of an application and CVS also allows multiple developers to work on the
    same code without the danger of overwriting each''s. Code is checked in and checked
    out so only one person can change it at a time. You can determine differences
    between multiple versions of the same code and merge code as needed to facilitate
    incorporating changes from more than one individual.


    The as is the system assembler, gdb is a debugger from the GNU Foundation that
    is well known in the industry. The developer tools provide a debugging guide as
    well as a quick reference to get started.


    1d is the static linker. It combines object files into binary files such as those
    that make applications and shared libraries.


    ldd is the dynamic link editor. This tool is used by applications that load libraries
    as needed, rather than incorporating them as is the case when libraries are linked
