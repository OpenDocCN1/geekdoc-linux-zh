  md: "# Extra\n\nOne of the advantages of using Perl over other scripting languages\
    \ is that it allows you to read and write number of files at the same time. For\
    \ each file you want to use, you type an open command, specify the filename, indicate\
    \ whether you are opening the file for reading, writing, appending, assigning\
    \ a file handle and writing records to the file. When you are done, you type a\
    \ close or an unlink command.\n\nFor readability, your file handles should be\
    \ meaningful. If you use a temporary file, calling it TMP or TMP1 makes it clear\
    \ to anyone reading your code that you do not intend to preserve the file. If\
    \ you use temporary files, you must always remember to unlink them when you are\
    \ done; otherwise, your script may not run the next time you try to run it because\
    \ it may not open a file that already exists. In addition, scripts that leave\
