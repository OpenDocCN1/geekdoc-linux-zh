  md: "# START A NEW SHELL\n\nYou can start another shell by typing the pathname of\
    \ the shell. running commands in a sub-shell can preserve your shell settings\
    \ or allow you to use a different program.\n\nEach time you start a new shell,\
    \ it executes the commands stored in your .tshrc file or the appropriate default\
    \ for the shell if it is not tsch and gives you a new prompt. Most variables are\
    \ set to their initial default values, environment variables remain set with any\
    \ values they have in the original shell.\n\nWhen the new shell starts up, it\
    \ has a clean command history. If you type history, you see a very short list\
    \ that does any of the commands executed in the original shell. Likewise, after\
    \ you exit the new shell, the command history for that shell does not appear in\
    \ the history of the original shell. You only see the command to start the new\
    \ shell.\n\nIf you are done using a new shell, you can close it by typing the\
    \ exit command. This returns you to your original shell. If you changed your current\
    \ directory in the new shell, find yourself back in the original directory when\
    \ the new shell exits.\n\nMacOS comes with three shells installed. The tsch shell\
    \ is the default, and the one that this book assumes you are using. The Bourne-shell,\
    \ known as bash, is a popular alternative to it. The Z shell, offers many customization\
    \ opportunities for Unix power users. The pathnames for these shells, respectively,\
    \ are /bin/tn, /bin/bash and /bin/zsh. For more information about the bash and\
    \ zsh shells, see \"Work with the Bourne-shell\" and \"Work with the Z Shell\"\
