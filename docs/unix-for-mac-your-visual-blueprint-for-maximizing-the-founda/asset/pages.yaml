  md: '# WORK WITH INTERNET COMMANDS


    Apply

    Unix systems, especially those that are servers, generally have established connections
    at any point in time. At each end of a connection, a system is communicating via
    a port. Port is an address associated with a service requester on the client end
    and on the server end. Enable enable software with Microsoft''s Internet Explorer
    to communicate with a service such as Apache.


    Network connections are based on TCP. TCP is one of the primary protocols making
    up TCP/IP and the one that most network tools use. Network connections run through
    a series of states starting from the initial connection request and ending with
    its closure. Ports listen for requests. When a client request arrives, the client
    and server exchange information and a connection is established.


    The netstat command allows you to view which systems are communicating and which
    ports they are using in the process.


    Information provided by netstat -a command includes the names or addresses of
    the servers at both ends of each connection as well as the port or service address
    that is being used. Viewing netstat output can help you determine how many connections
    your system is supporting and how well it is performing under the load.


    TYPE THIS:


    ```

    [-ferro-] netstat -a | grep ESTABLISHED

    ```


    +   * The screen displays a list of established connections.


