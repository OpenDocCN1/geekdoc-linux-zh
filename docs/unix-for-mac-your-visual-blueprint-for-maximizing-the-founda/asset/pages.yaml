  md: '# VIEW TEST FILES AS PAGES


    You can display long files one screen at a time using the less command. If you
    try to view a long file with the cat command, it quickly scrolls your Terminal
    window, and you must use the scroll bars to go back. The less command is an example
    of a pager command, a program that displays one page at a time.


    If you try to use the less command on a binary file with unprintable characters,
    the less command warns you and asks if you want to continue. You can type y, for
    yes, and press Return, or simply press Return to cancel the less command.


    You have already used the less command if you have used the man command; when
    you type man, you read a manual page by viewing it you would with the less command.


    The less command displays a screen at a time, and waits for you to finish reading
    before continuing. When you are ready to move ahead in the file, you can press
    the Spacebar.


    You can also search the file for a specific text by typing a forward slash (/)
    and then the text you want to find. This moves you ahead in the file to the next
    place that appears.


    The name of the less command makes sense when you know the history of pager commands
    in Unix. The original command for displaying a page at a time was named more,
    while waiting for you to read the page, it printed the terminal window. The less
    command was named as a natural successor to the more command, because it could
    do more than the more command could.


    # VIEW TEST FILES AS PAGES


