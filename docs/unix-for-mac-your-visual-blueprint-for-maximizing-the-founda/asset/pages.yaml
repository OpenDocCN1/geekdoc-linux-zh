  md: '# HOW TO USE THIS BOOK


    Unix for Mac: Your visual blueprint to maximizing the foundation of Mac OS X uses
    straightforward examples to teach you how to get the most out of your Mac OS X
    system by using Unix capabilities.


    To get the most out of this book, you should read each chapter in order from beginning
    to end. Each chapter introduces ideas and builds on the knowledge learned in previous
    chapters. After you become familiar with Unix for Mac, you can use this book as
    an informative desktop reference.


    Bold


    Indicates information that must be typed by you.


    Italics


    Indicates a new term being introduced.


    # Apply It


    An Apply section usually contains a segment of code that takes the lesson you
    just learned one step further. Apply sections offer more information and pointers
    that can be used to enhance the functionality of your code.


    # Who This Book Is For


    If you are looking for a resource that will help you learn to maximize the Unix
    underpinnings of Mac OS X, Unix for Mac: Your visual blueprint to maximizing the
    foundation of Mac OS X is the book for you.


    No prior experience with operating systems is required, but familiarity with Unix
    or Mac is asset.


    # Extra


    An Extra section provides additional information about the task you accomplished.
    Extra sections often contain interesting tips and useful tricks to working with
    Mac OS X easier and more efficient.


    # What You Need To Use This Book


    To perform the tasks in this book, you need a power PC Mac OS X v10.2, or higher.


    # The Organization Of This Book


    Unix for Mac: Your visual blueprint to maximizing the foundation of Mac OS X contains
    18 chapters.


    A number of typographic and layout styles have been used throughout UNIX for Mac:
    Your visual blueprint to maximizing the foundation of Mac OS X to distinguish
    different types of information.


    The first chapter, "Get Started with Unix," introduces you to the features that
    are built directly into the operating system and constitute the foundation on
    which all Mac OS applications run. You can access this foundation by using the
    terminal application.


    Chapter 2, "Work with Files," illustrates how the Unix shell enables you to move
    through the file system and access parts of your hard drive that are unavailable
    through the Finder.


    # Courier Font


    Indicates the use of Unix commands, scripting commands such as shell or Perl commands,
    source code such as C or Java commands, and HTML.'
