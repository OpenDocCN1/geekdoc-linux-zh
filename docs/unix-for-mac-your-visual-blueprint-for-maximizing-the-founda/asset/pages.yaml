  md: '# CHANGE FILE PERMISSIONS


    You can change the permissions on files you own, allowing you to grant or withhold
    permission to others to read, write, or execute your files. There are two parameters
    for the chmod command, the first being the new mode, and the second being the
    file you want to change. You specify the mode by indicating which change affects,
    whether that change should be added, removed, and what kind of permissions you
    want to set.


    one set of users by combining the designators together, such as, to indicate users
    in the file group and users not in the file group, while omitting the file owner.


    You can mark permission changes with a plus symbol (+) to add permissions, a minus
    symbol (-) to remove them, or an equal symbol (=) to set them. The possible permissions
    are the same as those with the ls -l for read access, w for write access, and
    x for execute access.


    Unix lets you define the users that you may change affects: u, for the owner of
    the file, or g, for users in the file group, o for others — a, for all users.
    You can designate more than


    You can make more than one change at a time to give a file by listing them with
    commas, as separators. For example, to set the file to be readable, writable,
    and executable by those in the file group, and by those outside of the group,
    you can chmod u+rwx,g+xr example.


