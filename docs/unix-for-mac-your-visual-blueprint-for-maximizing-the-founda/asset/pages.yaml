  md: '# CONFIGURE APACHE


    You can configure Apache according to your specifications. Configuration parameters
    for Apache reside in a single configuration file, and you can configure changes
    by editing this file. This file is called httpd.conf, it contains a great deal
    of explanatory text to simplify the process of configuring your server. In fact,
    if you want to set up a Web page quickly, you can simply install your custom Web
    pages in the default document directory and start Apache with the `apachectl`
    start command.


    The default location for Web pages is the httpdocs directory in your Apache directory
    — for example, /sw/apache/httpdocs. When you install Apache, the installer puts
    a small set of files into this directory as a placeholder for your intended content.
    If you start Apache and visit your Web site without doing anything else, you will
    see these documents. The logs directory stores files that contain requests to
    your site, including information on the client each visit and from what system.
    Configuration containing all-important httpd.conf file, is called —/sw/apache/conf.


    # APACHE DIRECTIVES


    Configuration commands in Apache are called directives. The basic form of a directive
    is the directive followed by the value Apache assigns, such as User. Each directive
    controls some aspect of how Web server runs. While there are several possible
    changes, you are likely to make many changes in your default configuration file.
    If you are, you can access a complete list of Apache directives by visiting www.apache.org.
    The set of available directives depends in, on the version of Apache you are running.


    If you do not set these two variables correctly, your Web server will not work
    as intended.


    The ServerRoot is the directory in which configuration and log files reside. If
    your ServerRoot is /sw/apache, then configuration files reside in /sw/apache/conf,
    and your logs reside in /sw/apache/logs. Your Apache binary is likely to reside
    there as well, in /sw/apache/bin.


    The most critical directives are DocumentRoot and DocumentIndex. The DocumentRoot
    directive tells your Apache server where to retrieve pages when requests arrive
    from clients. The DocumentIndex is a list of files that your server files to look
    for when a client does not include a filename in


    There are many other critical directives, if not all of them, default to very
    reasonable and secure settings. There are two forms of Apache directives: simple
    directives and block directives. Simple directives set a value setting, such as
    the port the server runs on. Block directives group other directives into a set,
    such as the settings you want to apply to a virtual server.


    # BUILT-IN APACHE SERVER


    OS X has a built-in Apache server that you can configure and run without having
    to download and compile it from source code. To start it, you can click System
    Preferences — Sharing. When the Sharing panel opens, you can select Personal Web
    Sharing, and then click Start. If you open a Web browser and type http://127.0.0.1
    in the URL field you will see test pages.


    that uses Apache, the location of your default configuration file. The location
    of this file appears in a line that reads -D SERVER_CONFIG_FILE="/etc/http/httpd.conf"


    The built-in Apache server is identified on a system as /usr/bin/httpd. If you
    type /usr/bin/httpd -V, a list appears which contains information about the settings


    You can use the command grep LoadModule /etc/http/httpd.conf to find any modules
    that are enabled. For example, cgi_module appears in the output of the grep command,
    indicating that CGIs are enabled. It is a good practice to store CGIs that you
    develop in the /Library/WebServer/CGI-Executables


