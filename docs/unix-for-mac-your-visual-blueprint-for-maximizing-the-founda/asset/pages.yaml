  md: '# WORK WITH INTERNET COMMANDS


    # Extra


    Connecting to the Internet allows you to take advantage of a wealth of information
    and services. Understanding the basics of how this connection works will make
    it easier for you to report on and resolve problems when they occur.


    For dial-up accounts, you generally do not need to be concerned about the IP address,
    subnet mask, DNS server, or default router that your system will use. Although
    this information is critical to your network connection, your Internet service
    provider (ISP) assigns it to you when connect. If your Macintosh is attached to
    a local area network, you may use a static IP address — or one that a DHCP server
    assigns when you boot your system.


    Regardless of how this information is assigned, your system requires a unique
    IP address to identify it as a member of a network, a subnet mask to allow the
    system to determine the extent of the local network, a default router to direct
    remote connections, and a DNS server to allow you to locate systems by name.


