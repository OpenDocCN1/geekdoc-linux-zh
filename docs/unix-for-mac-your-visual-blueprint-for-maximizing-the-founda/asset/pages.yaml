  md: '# INSTALL APPLICATION PACKAGES


    You can install an application package on Mac OS quite easily. This is because
    a package is a specially formatted application file that is designed for easy
    installation. To you know that a file is prepared for easy installation on your
    system, the Finder uses an icon that looks like an opened folder.


    Mac OS X also includes an install command, which allows you to move binary files
    to a chosen location from you want to run them. You can specifically avoid overwriting
    earlier versions of the software if you use a -b option with the install command.
    With a -o option, you can specify who owns the application when it moves to there.
    You can use a -g option allows you to specify the group. You can use a -d option
    to create missing default mode of the file, restricting access as needed.


    To install an application package, you can simply double-click the icon for the
    package in the Finder. This initiates a process that walks you through each step
    in the installation. Mac asked you to enter your password to authenticate yourself
    as a privileged user and select the disk for installation. You can monitor the
    progress of the installation by watching the progress bar. When the installation
    is complete, a message informs you that the installation was successful. You install
    all software packages in this manner.


    While downloading and installing software is relatively easy, managing it can
    be more challenging. Mac OS X does not place restrictions where you install software,
    so you should maintain and enforce a convention to prevent your system from becoming
    disorganized.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_201_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_201_1.png)




    +   1 Download an application package from the Web.

    2 Click the application package icon to view the contents of the folder.

    3 Double-click the package icon.

    4 A window opens, displaying the contents of the folder.

    5 Type your password into the Password or phrase field.

    6 Click OK.

    7 Click Continue until you reach the License Agreement.'
