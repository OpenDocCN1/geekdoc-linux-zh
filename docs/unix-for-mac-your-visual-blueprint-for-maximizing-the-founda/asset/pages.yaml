  md: '# CREATE A SIMPLE WEB SITE


    You can create a simple Web site in less than an hour. After you install Apache
    on your system, you can create a Web site using a text editor to enter text and
    few formatting commands, and by copying files as you need.


    Static pages contain special formatting commands in a language called HTML, along
    with the text or content of your pages. For example, if you create a Web site
    that you can call Life Story in 50 Words or Less, you can enter your title and
    text to insert the commands necessary to display the content as you want it to
    appear.


    If you type multiple paragraphs into your document without HTML formatting, the
    text that appears in a browser looks like one long paragraph. To break it into
    separate paragraphs, you must insert an HTML tag, <p>, between paragraphs.


    Web pages must have the extension .html or .htm, and must start with a tag, <html>
    that identifies the content as HTML. Most formatting commands in HTML have both
    an opening and closing tag. For example, you can start a Web page by typing the
    opening tag <html> and end with </html>. All closing tags in HTML follow the convention
    of starting with a forward slash (/).


    The simplest Web page, therefore, starts with <html> contains text, and <p> markers
    to identify paragraph breaks, and ends with </html>. A document as simple as this
    can constitute a Web site. There is no requirement that you insert images or links
    that point to other sites, or other pages in your own Web site.


