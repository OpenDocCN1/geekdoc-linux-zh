  md: '# SET COMMAND ALIASES


    You can save time and reduce typing by setting short aliases for long commands.
    You can use the alias command to define and list aliases. To create a new alias,
    you can use a short-alias command'':


    ```

    alias short-alias ''longer command''

    ```


    One commonly used alias is ls -1, which most Unix users define with the following
    command:


    ```

    alias ll ''ls -1''

    ```


    This alias allows you to use ll as a command and have it execute the ls -1 command,
    which shows a long list. You can insert additional arguments, such as a directory,
    after the ll command just as you would with the original ls -1 command.


    You can also redefine existing commands as aliases. For example, if you are afraid
    that you may mistakenly delete an important file because you do not remember to
    use the -i option with rm command, you can set an alias as follows:


    ```

    alias rm ''rm -i''

    ```


    As a result, all of your rm commands automatically include the -i option.


    If you redefine a command, such as the rm command, using an alias, and you want
    to use the original version, you can do so by typing a backslash (\ before the
    command name. This bypasses aliases and invokes an executable program in your
    path or a shell built-in.


    To list all of your aliases, type alias without any arguments. If you need to
    remove an alias, you can use the unalias command.


    Like other settings, your aliases remain as long as your Terminal window is open.
    You can make your aliases permanent by saving them in ~/.zshrc. See "Edit .zshrc
    File in this chapter.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_93_0.png)


    # SET COMMAND ALIASES


    +   1 Type alias and a space.


    +   2 Type a short alias.


    +   3 Type a long command in single quotes and press Return.


    +   4 Type the short alias with any appropriate arguments and press Return.


    +   The shell executes the long command.


    82'
