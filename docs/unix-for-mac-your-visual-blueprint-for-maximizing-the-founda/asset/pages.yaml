  md: "# MOVE FILES INTO A DIRECTORY\n\nYou can move files into or out of a directory\
    \ using the mv command. This is the same as dragging a file in Finder to a new\
    \ folder location. The mv command can rename a directory that does not exist it\
    \ renames a file, and it can also move the location of a file or directory within\
    \ the file system. You can use the mv command to move a file, or directory, by\
    \ typing a command like this:\n\n```\nmv file location\n```\n\nThe argument location\
    \ must be a directory. Either this directory exists and is owned by you, or you\
    \ must have permission to write files in it. If you type the name of a directory\
    \ that does not exist, an error file will be renamed to the second name you typed.\
    \ This can also happen if you mistype the name of the directory.\n\nYou can move\
    \ multiple files using the mv command, however, they must all go into the same\
    \ directory. To do this, you can simply type each filename and specify the destination\
    \ as the final argument, as follows:\n\n```\nmv fileOne fileTwo fileThree andSoOn\
    \ location\n```\n\nThis command moves all of the files that you list to the location\
    \ you specify. If that location does not exist as a directory, an error message\
    \ appears, and the command does not execute.\n\nUsing the -i option with the mv\
    \ command can prevent you from accidentally overwriting files when you move them.\n\
    \n# MOVE FILES INTO A DIRECTORY\n\n![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_47_0.png)\n\
