  md: '# ACCESS THE AQUA CLIPBOARD


    You can copy and paste with the Aqua clipboard the copy and pbpaste commands.
    Mac OS X keeps temporary data in a special memory known as the clipboard or paste
    buffer. When you use the Copy function of an application, whatever you copy replaces
    the contents of the clipboard. When you paste the contents into the document.
    The Copy and Paste functions are listed in the application''s edit menu. You can
    also use the shortcuts Command+C and Command+V.


    The pbcopy command reads text and places it into the Aqua clipboard buffer. You
    can use this command to read a file''s contents into the clipboard by using input
    redirection from a file or by piping it from another command to the pbcopy command.


    ```

    pbcopy < filename

    shell-command | pbcopy

    ```


    This action stores the contents of the file or the output of the command in the
    paste buffer, and you can paste it into other applications, such as TextEdit or
    Mail.


    If you have copied text from another application, you can access the paste buffer''s
    contents using the pbpaste command. This command sends the contents of the clipboard
    to the paste output, where you can redirect it to a file or pipe to another command.


    ```

    pbpaste > filename

    pbpaste | shell-command

    ```


    Typing pbpaste displays the current contents of the paste buffer. If you have
    forgotten what is on your clipboard, this is an easy way to check.


