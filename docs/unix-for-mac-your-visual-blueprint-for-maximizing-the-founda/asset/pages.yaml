  md: '# INSTALL PERL MODULES (CONTINUED)


    You can install Perl modules to increase your productivity as a Perl programmer.
    There are many Perl modules that you can download and install to increase the
    sophistication of your Perl scripts. Each Perl module contains a number of routines
    that are relevant to a particular type of processing. For example, the CGI module
    reduces the code that you must produce to create CGI scripts. Modules are free,
    and you can modify them, if needed, to suit your application. Modules contributed
    by others are useful enough to be generally valuable. If you are new or a beginner
    Perl programmer, you might consider contributing modules that develop to the Perl
    community.


    You might sometimes acquire Perl modules in the form of a gzipped TAR file. In
    this case, the process of installing looks like the process of compiling one


    source software from the same kind of file. However, because Perl is not compiled,
    the make step will not result in a compilation. The steps for installing a Perl
    module as a tar.gz file are:


    ```

    gzip <module-name.tar.gz>

    t xf <module-name.tar>

    cd <module-name>

    perl Makefile.Pl

    make

    test

    make install

    ```


    Some Perl modules will require other modules to be installed before they can be
    used. When a module that you are trying to install has a prerequisite, you will
    get a message when you try the perl Makefile.PL command.


