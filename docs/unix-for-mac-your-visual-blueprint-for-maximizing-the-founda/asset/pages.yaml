  md: '# LOG ON TO ANOTHER COMPUTER


    You can take advantage of accounts and applications on other systems. You can
    log on to a remote system using telnet or login. Unix systems, such as Mac OS
    X, provide several ways to log on to other systems. The most you are using is
    a called telnet that has been longer than the Internet. Telnet establishes a terminal-like
    connection to another system or network. Once connected, it asks for a username
    and password and logs you on.


    Another tool for logging on remote systems is login. This tool is much like telnet,
    but less common. You are likely to find it only on Unix systems, and even then,
    it may be disabled. The login command requires that you log on with the same username
    unless you add the -l argument to the end of the command.


    Most telnet servers give you the option of logging on with the username you are
    using on your local system, but you are free to enter a different username at
    the prompt. You end a terminal session by logging out. For most systems, you can
    press Control + D or type the command logoff to exit.


    To use any of these tools, you must have an account on the remote system. If you
    do not have a account on another system, however, you can try telnet or login
    by logging on on your Mac OS X. The system will only work if you have Enable Remote
    Access to Your Computer" later in this chapter.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_155_0.png)


    # USING TELNET


    Note: You must be connected to the Internet for this task.


    +   1 In the terminal window, type telnet followed by a space.


    +   2 Type the domain name of a system on which you have a shell account.


    Note: type telnet localhost if you do not have a remote system account.


    +   3 type your username and password at the prompts.


    +   4 Type who am i and press if the remote system is a Unix host.


    +   The screen displays your logon on the list of logged on users.'
