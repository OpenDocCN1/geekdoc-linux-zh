  md: '# UNIX FOR MAC


    # # COPY APPLE RESOURCE FORKS


    You can copy a file and its resource fork using the cp command. Mac OS uses resource
    forks to store additional information about the file. A resource fork is a hidden
    file that contains another document. When you use Aqua applications, resource
    forks are created but kept invisible to both the Mac OS Finder and the Unix shell.
    To copy resource forks in your current directory, type this:


    ```

    [ferra:-] user% ls -l ~/rsrc

    ```


    You see that your files are shadowed by smaller files of the same name with .rsrc
    appended. Each of these files contains encoded information about the file and
    other types of metadata. Aqua applications use this information, Unix shell ignores
    it.


    The cp command does not normally copy resource forks because they are invisible
    to most shell commands. If you copy a file or directory with cp, your copy does
    not have a resource fork, resource fork size is not included in the disk usage
    provided by the du command; your copy may not appear to be the same size as the
    original.


    The ditto command is another way to copy files and directories and it contains
    everything so you do not need to include an -r option as you would with cp. You
    do need to use -rsrcfork:


    ```

    [ferra:-] user% ditto -rsrcfork original copy

    ```


    This action produces a copy with the resource forks preserved.


    | COPY FILE RESOURCE | | Terminal File Edit Scrollback Font Window Help | Fri
    12 00 PM | Terminal File Edit Scrollback Font Window Help | Fri 12 00 PM |

