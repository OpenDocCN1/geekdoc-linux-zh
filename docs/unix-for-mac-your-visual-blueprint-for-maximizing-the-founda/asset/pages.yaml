  md: '# REDIRECT TEXT TO A FILE


    You can save the text output of any shell command by redirecting the output to
    a file. Unix commands normally display their output in the Terminal window, immediately
    after you type the command. With redirection, you can change the destination of
    the standard output; it does not have to appear in the Terminal.


    information at any given time. For example, if you want to record your disk usage
    on a certain date, you can type command `du -s > du-2003-03-05`.


    When you redirect text, the shell does not print any special messages on-screen;
    as you complete the command, you only see the prompt. You can use other commands,
    such as `cat`, `grep`, or `head`, to examine the file you created.


    To save the output of arguments to a file, you can use a greater-than symbol (>):


    ```

    command and arguments > output-file

    ```


    For example, to save the output from `grep ''Apple''` changes.txt to a file named
    changes.txt, you can use this command:


    ```

    grep ''Apple'' CHANGES.txt > apple-changes.txt

    ```


    You can use the grep command to record the output of a command for processing,
    such as editing or printing the file. It is also an effective way of making a
    record of


    You can combine output redirection with the `cat` to create a new file from two
    or more files. You do this using the following command:


    ```

    cat filename1 filename2 filename3 > composite-file

    ```


