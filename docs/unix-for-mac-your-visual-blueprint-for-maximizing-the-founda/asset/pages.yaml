  md: '# # COPY A DIRECTORY


    You can use the cp command to make a copy of a directory by using the -R option.
    Individual files can be copied using the cp command with no options, and as with
    the mv command, you can give a list of files and a destination directory to copy
    any number of files into the same directory:


    However, if you try to copy a directory as you would copy a file, you see an error
    message because directories are not normal files:


    ```

    cp fileOne fileTwoAndSoOn location

    ```


    ```

    [error:-] user cp Documents "Backup of Docs": Documents is a directory (not copied).

    ```


    You can use wildcards to copy files. For example, to copy all of .doc files into
    your Documents directory, type cp *.doc ~Documents


    When you copy into a directory, the new versions of each file will overwrite existing
    ones. You must use the -R option, which tells the cp command to copy the directory
    and its contents to the new location. To create a copy of the Documents, you can
    type cp -R Documents "Backup of Docs".


    This will copy the directory at once, creating the new directory and duplicating
    all of the files. The names of the original files will be the same, although the
    directory names will be different.


    | Terminal | File | Edit | Scrollback | Font | Window | Help |

    |---|---|---|---|---|---|---|n| [error:-] user $ls -F | Library/ | Public/ | |

    | Books/ | Movies/ | |

    | ClassAssignments/ | Desktop/ | |

    n| [error:-] user $ls -F Sites | | |

    | Images/ | ... csin24hours.com... ... uniformac.com/ | |

    | [error:-] user $cp -R Sites | Archives 2002-11-20 | |

    | index.html | | |


    | Terminal | File | Edit | Scrollback | Font | Window | Help |

    |---|---|---|---|---|---|---|n| [error:-] user $ls -F | Music/ | Public/ | |

    | Books/ | Pictures/ | |

    | ClassAssignments/ | Desktop/ | |

    | Documents/ | | |

    | [error:-] user $ls -F Sites | | |

    | Images/ | ... csin24hours.com... ... uniformac.com/ | |

    | [error:-] user $cp -R Sites | Archives 2002-11-20 | |

    | index.html | | |


    +   1. Type cp -R and a space.

    2. Type the name of the original directory and a space.

    3. Type the name of the new copy of the directory and press Return.

    4. Type ls -F and a space followed by the name of the original directory, press
    Return.

    5. Repeat the step ls -F command in step 4 to check the contents of the new directory.

    6. The new directory is a duplicate of the original directory.'
