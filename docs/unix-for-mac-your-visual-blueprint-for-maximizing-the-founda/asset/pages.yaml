  md: '# WORK WITH FILES


    # DELETE A FILE


    You can use the rm command to delete files you no want to keep. When you delete
    a file using the Mac OS Finder in Aqua, the Finder does not immediately delete
    the file, but stores it in the Trash. However, when you delete a file using the
    rm command, the deletion is instantaneous which means if you accidentally delete
    a file from the shell, you cannot recover it by dragging it back out of the Trash.


    As with cp and my commands, deleting files is dangerous because people can make
    mistakes. You can use the -i option to tell the rm command to confirm that you
    want to delete a file, you can type y for yes, and press Return. If you do not,
    you can press any other key or skip the Return.


    By default, the rm command only removes ordinary files, although you can remove
    an empty directory with the rmdir command; for a directory containing files, you
    can use the rm -r command. You cannot remove directories unless you have write
    permission to the files. However, there is no special access permission required
    to delete a file.


    It is possible to delete a file whose name begins with a dash, such as -foo or
    -bar. These are extremely hard to remove, because the rm command will interpret
    the filenames as options, since options begin with dashes. In this situation,
    you can use the -- (a double-dash). This means that the command does not check
    the rest of the line for options, making your last flag.


