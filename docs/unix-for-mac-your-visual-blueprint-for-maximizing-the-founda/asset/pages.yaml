  md: "# INSTALL WGET\n\nYou can install Wget, an automatic Web-site retriever. Wget\
    \ is a handy tool for downloading a Web site in order to back it up for safekeeping,\
    \ or to move it to another host. The best feature of Wget is that you do not have\
    \ to download pages one at a time; the recursive nature of the tool allows you\
    \ to download an entire site with a single command.\n\nYou can download Wget using\
    \ Fink. When you type the command find list | wget, Fink tells you that the package\
    \ is available and that it is not installed on your system. The current version\
    \ of Wget is 1.8.2. To start the downloading using Fink, you type the command\
    \ install wget. Fink then runs the curl command to download the Wget installation\
    \ file. Fink manages the uncompression, extraction, and installation of the Wget\
    \ files onto your system.\n\nBecause Fink installs software into the /sw directory,\
    \ Wget installs as /sw/bin/wget. After you complete the installation, you can\
    \ type which wget and have this pathname returned to you. If not, you must update\
    \ your search path to include /sw/bin by editing your ~/.tshrc file in your Home\
    \ directory.\n\nFink installs man pages in /sw/share/man. If you type man wget\
    \ and get the response no manual for wget, you can add this directory to your\
    \ MANPATH by setting MANPATH in your ~/.tshrc file.\n\nTo make the changes to\
    \ your search path and your MANPATH permanent, you should update these paths in\
    \ ~/.tshrc. Keeping these paths up to date with the applications you have installed\
    \ will save you a lot of trouble in the end.\n\n![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_219_0.png)\n\
    \n```\nTerminal File Edit Scrollback Font Window Help\nTerminal File Edit Scrollback\
    \ Font Window Help\n[fink - user] find list | grep wget\n[fink - user] 1.8.2.1\
    \ Automatic Web-site retriever\nwget ssl 1.8.2.1 Automatic Web-site retriever,\
    \ with SSL support\n[fink - user] \n[fink - user] find install wget\nReading page\
    \ info.\nInformation about 769 packages received in 5 seconds\npkg version 1.8.2\n\
    pkg wget 1.8.2\nThe following package will be installed or updated:\nwget -F -O\
    \ http://ftp.gnu.org/pub/wget/wget-1.8.2.tar.gz\n```\n\n+   - Type find list followed\
    \ by a space.\n- Fink displays the information it has on Wget.\n- Type sudo find\
    \ install wget and press Return.\n- Fink immediately starts the download of Wget."
