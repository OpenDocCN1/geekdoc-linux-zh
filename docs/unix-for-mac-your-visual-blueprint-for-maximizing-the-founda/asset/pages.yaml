  md: '# READ THE UNIX MANUAL


    You can read the Unix manual pages by using the man command. These pages give
    you a basic summary of how to use a specific Unix command as well as detailed
    information on the types of parameters you can use with that.


    The simplest way to get information about a command is to use mancommand. If there
    is a manual page for that command, most manual pages are long, only the first
    screen of information displays in your Terminal; to continue to the next screen,
    you can press Spacebar. To continue pressing Spacebar for each screen of information
    until you have read the entire manual.


    A manual page lists the name of the command, and in parentheses, the section number
    of the manual where you can find that command. Some commands or terms other


    in several sections, and you can select from among them by including the section
    number before the term. After the name of the command, a synopsis of the syntax
    for the command appears. Parameters in brackets are optional, but if you use them,
    you must replace the underlined words with an appropriate value or format when
    you type the command.


    A manual page also includes a description of the command and often provides examples
    of how you can use it. Related commands also appear along with section numbers,
    and any files that relate to the command, such as configuration files, are shown.
    Extra trivia, such as the history of the command or known bugs, may also appear.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_23_0.png)


    | man(1) | General Commands Manual |

    |---|---|n| NAME | who are users and what they are doing |

    | SYNOPSIS | **man** [-m] (core) [-h] (system) |

    | DESCRIPTION | The utility provides a summary of the current activity on the
    system, including each one is used. The first lines display the current time of
    day, the host name, the users logged into the system, and the load averages. Load
    averages gives the number of jobs in the run queue averaged over 1 and 15 minutes.

    The fields out are the user''s login name, the name of the user is on, the host
    from the user logged in, the time the user logged since the last thing typed,
    and the name and arguments of the current process.

    The options are as follows: -h Suppress the heading


    # TYPE THE MAN COMMAND


    Type the name of a command and press Return.


    At the terminal prompt, type man and a space.


