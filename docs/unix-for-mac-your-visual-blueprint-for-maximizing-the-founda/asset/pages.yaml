  md: "# # SEND E-MAIL WITH PINE\n\nYou can compose and send e-mail with pine. To\
    \ compose a message in pine, you can type c while in the main menu. This moves\
    \ you into a simple text-editor in which you pre-inserts message parts such as\
    \ the To and Subject tags. You can move around this form by arrow keys, inserting\
    \ your recipient and your message text.\n\nAs you type your message, the form\
    \ area for the text grows larger to accommodate your message. To insert a file\
    \ into your message, you can press Ctrl + R. Pine then asks you to enter the name\
    \ of the file that you want to insert into your message. You must supply the name\
    \ of the text file, including the pathname if it is not located in your Home directory.\n\
    \nPine allows you to add carbon copy (cc) recipients to your messages and to include\
    \ attachments. To add an attachment, you can type the name of the file, along\
    \ with the pathname if it is in a sub-, in the Attachmt line. Pine attaches the\
    \ file to the message when you send it. You can add attachments by pressing Ctrl\
    \ + j.\n\nTo change the format of your message to a richer header, you can press\
    \ Control + R. This adds additional fields to your message header, such as Bcc\
    \ and Newsgroups. If you have defined a directory, the contents of your signature\
    \ file appear at the bottom of your message text.\n\nWhen you are ready to send\
    \ your message, you can press Control + X. Pine asks if you want to send your\
