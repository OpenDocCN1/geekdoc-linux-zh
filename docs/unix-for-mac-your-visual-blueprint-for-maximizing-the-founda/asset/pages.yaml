  md: '# RESTART A PROCESS


    You can save some time by restarting a suspended process. Instead of running the
    job again, you can pick up where you left off when you suspended the process.
    In addition, restarting a suspended process frees resources tied up by that process.


    All processes that run, suspended, or not associated with the particular shell
    in which they started. If you started a single process in each of two terminal
    windows, each of these processes will have the same name. At the same time, each
    of these processes will also have a unique process ID. Where each job number is
    related to the parent shell and its parent shell, each process is related to the
    entire system. This means that you can refer to it by process job number in the
    shell in which it was started.


    Job numbers are always small numbers like 1 or 4. While you can accumulate a large
    number of suspended jobs if you work at it, in practice this is never done. Process
    IDs are usually large numbers like 325 or 734. The system assigns these numbers
    in fashion, reusing them. If you need a process running today with the process
    you might not see this number used again for months. Process numbers that are
    small like 1 or 69 are assigned to system tasks.


    To restart a suspended process, use the fg (foreground) command. If only one suspended
    process is in your current shell, that process restarts. If there are several
    suspended processes, the most recently suspended will restart. To restart a particular
    suspended process, enter the fg command followed by its job number.


