  md: '# CHANGE FILE OWNERSHIP


    You can change ownership of a file so that someone else can change the contents
    of the file. The chown command reassign ownership of a file to a new user. This
    command can only be run by root or by a privileged user with sudo command. The
    syntax of the chown command is chown, but you can change both the owner and the
    group associated with a file if you specify both at once. To do this, you enter
    the username of the new user and the group separated by a colon. A command like
    horace:groupmyapp.java, for example, changes the owner to horace and the group
    for the file myapp.java.


    A similar command chgrp changes the group associated with a file or set of files.
    If you need to share a set of files with a group of other users, you can add these
    users to the group associated with the file. In general, changing the group for
    the file is easier.


    The chgrp command has a similar syntax to chown. If you type chgrp devmyapp.java,
    then anyone in the development team obtains group access to the file. If members
    of the group can write to the file. Like chown, chgrp can be run recursively with
    the -R option.


    Like many commands, you can use chown to work on an entire directory if you add
    an argument to the command recursively. A chown command that starts with -R is
    run against all files in the directory that you supply.


