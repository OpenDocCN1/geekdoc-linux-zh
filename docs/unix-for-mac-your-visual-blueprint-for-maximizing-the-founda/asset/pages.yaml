  md: '# SCHEDULE SCRIPTS TO

    RUN AUTOMATICALLY


    Use the cron command to schedule the execution of commands and scripts. Cron makes
    use of files called crontab that specify what commands and scripts are to be run.
    All crontab files have the following format:


    min day-of-week command-to-run


    The first field represents the minutes, and the second represents the hours. If
    you want to run a script at 2:15 pm every day, enter 15 for these fields and month
    fields means January-*. The day-of-week field must be a number between 0 and 6,
    Sunday is 6, Monday is 1, and so on.


    Time fields can contain a string of comma-separated values or an asterisk (*).
    An asterisk indicates that every possible value for the field is valid. The day-of-week
    field, for example, * tells cron to run the command every day of the week. Typing
    0,30 in the minutes field tells cron to run the command on the hour and half hour.
    You can also specify values to tell cron to run the command every ten minutes.


    A job scheduled to run via cron only runs if all of the timing criteria are met.
    For example, the line 5 17 * * 5 /users/user/bin/send_weekly runs the send_weekly
    script every Friday at 5:05 pm.


    To schedule jobs to run automatically, use the cron -e command and add a line
    for each command or script you want to schedule.


    # SCHEDULE SCRIPTS TO RUN


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_131_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_131_1.png)


    +   1 Start the Pico editor to create a file named check_space.

    2 Type #bin/tsh and press return twice.

    3 Type set when date +%H:%M and press return.


    +   4 Type set diskspace = /usr/bin/du -sk $USER and press return, then type echo
    $diskspace >> $USER/duog.

    5 Save your file, and exit Pico.


    +   6 Type crontab -e and press Return.'
