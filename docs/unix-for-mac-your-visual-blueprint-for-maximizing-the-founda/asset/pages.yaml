  md: '# # UNIX FOR MAC

    # MANAGE SOFTWARE

    INSTALLATION WITH FINK


    You can manage the installation of the software on your system using a software
    management utility known as Fink. Fink is a versatile tool that allows you to
    download, extract, compile, install, update, and remove software from your system,
    with minimal effort. It works with software that is configured as a package. A
    package is a special format that contains binary files along with code patches
    that you may need to facilitate installation and subsequent management of the
    installed software.


    Fink is not included in Mac OS X, but you can download it from www.sourceforge.org.
    You can visit www.fink.sourceforge.net/download to find links and instructions
    on how to obtain it.


    Fink is a type of tool called the Advanced Package Tool or APT from Debian. Fink
    allows you to install a package from source code or from binary files, depending
    on what is available. Binary files come in a format known as .deb packages.


    Fink maintains a database that allows you to locate packages. It downloads the
    packages using curl and proceeds to install your new software while giving progress
    updates on-screen.


    After installing Fink on your system, it is easy to use. The command list displays
    a list of available software packages. Those that are installed on your system
    appear with a lowercase i in the leftmost column. To install an you can use the
    install command followed by the name of the package you want to install.


    Fink is intuitive to solve dependencies, and does not install a package if you
    have not installed prerequisite software. It also does not remove software if
    other packages on your system.


