  md: '# SORTING TEXT


    You can sort lines of text by using the sort command. You can eliminate duplicate
    lines in sorted text by using the uniq command. Sorted text is easier to read,
    especially when you are comparing values or locating a specific word in it. The
    sort command makes it easy to do this automatically rather than manually.


    You can instruct the sort command to use alphabetical order instead of character
    order with the -f option. This sorts blue to come before Yellow, the letter b
    comes before Y. All numbers are ignored.


    You can control the sort command by using options, based on the type of list you
    want to sort. By default, the sort uses character order. This seems sensible at
    first, except that computers sort uppercase and lowercase letters in a random
    manner. Actually, the alphabet includes the letters A through Z, then the lowercase
    letters a through z. So word Yellow comes before blue, because all capital letters
    come before lowercase letters.


    Neither way of sorting works well with numbers. Numbers with 1 come first, then
    numbers with 2, and so on. So the number 111 comes before the number 28, 111 starts
    with 1 and 28 starts with 2. To sort normally, you can use the -n option with
    the sort command, which sorts numbers correctly.


    A similar command to the sort is the uniq. The uniq command takes sorted lines
    of text, either as a command line argument or from standard input, and removes
    lines that are duplicates. The command displays all lines that are unique.


    ```

    Terminal - tsh

    [-] sort this-week.txt

    Monday

    nothing planned

    Tuesday

    work at the gym

    Wednesday

    class in the evening

    Thursday

    group

    Friday

    nothing planned

    [-] sort this-week.txt

    work at the gym

    class in the evening

    Friday

    nothing planned

    Monday

    nothing planned

    Tuesday

    work at the gym

    Wednesday

    class in the evening

    [-] user

    ```


