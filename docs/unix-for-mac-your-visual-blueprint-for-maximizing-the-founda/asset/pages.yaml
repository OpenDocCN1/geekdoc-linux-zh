  md: '# WORK WITH THE Z SHELL


    if you are an advanced user, you can write functions that perform shell tasks
    in the highly configurable Z shell. If you are new to Unix, this may be much more
    than you need.


    variables in zsh — by using the command setopt, and you can set and export environment
    variables as you would in bash. Instead of running the contents of the .zshrc
    when a shell starts, the z shell executes commands in the .zshrc file in your
    Home directory. Aliases in the z shell will be set using the following syntax,
    which differs from the requirement of the z shell by the equal sign:


    The differences between shells are most apparent when you are writing shell scripts,
    as scripts use the advanced features of the shell. The Z shell uses a number of
    functions that you can define in order to override or change default behavior.


    ```

    alias short-alias=''command and options''

    ```


    The Z shell was created to be compatible with another early shell known as the
    Korn shell, or ksh. If you are going to be using your shell a great deal and want
    to become familiar with shell customization, the Z shell may be a good choice
    for you.


