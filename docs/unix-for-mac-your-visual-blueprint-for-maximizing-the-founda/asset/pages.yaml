  md: '# WORK WITH INTERNET COMMANDS


    # Extra


    Files responsible for the configuration of a Unix system, Mac OS X included, are
    always set up that only the root is able to make changes. This is important to
    system security because it ensures only trusted users can modify the configuration
    of a system. As a system manager, you have two choices when you need to change
    a configuration file. You can switch to the root account with sudo si - set you
    as root with root''s environment. Alternatively, you can use the sudo command
    to run the command that only root can execute.


    Whenever you use the sudo command, you are prompted to enter your password to
    ensure that you are the user entrusted with sudo privileges and not someone who
    just walked up to your Terminal window. If you enter another command shortly after,
    you do not have to enter your password again. The sudo command includes a timer
    that allows you to work for five minutes before asking for your password again.


    You must be set as a system administrator or listed in the /etc/sudoers file to
    use sudo.


