    difficult to keep track of where you have installed your software and what software
    you have installed. The situation is exacerbated when you frequently download
    new tools and utilities.


    While you can manually manage your software, you have another option for making
    the software easier to find and use: You can update your search path to include
    all directories into which you install software.


    You can update your search path by editing your default shell configuration file.
    If your default shell is defined in the Mac OS X, your .tshrc file in the root
