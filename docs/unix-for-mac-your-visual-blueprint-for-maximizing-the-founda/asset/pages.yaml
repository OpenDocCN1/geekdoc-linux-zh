  md: '# SHELL COMMAND CONCEPTS


    shell commands in Unix are often cryptic sets of letters strong, apparently at
    random. To the uninitiated, they can appear arbitrary, but there are some general
    concepts that hold them together.


    First, the shell interprets the command line you have typed and breaks it down
    into its constituent parts. Second, the shell uses those parts to determine whether
    a built-in command or an executable program should be run, and then passes the
    appropriate parameters to the command or executable.


    Shell commands execute as soon as you type them and press the Return key. Each
    consists of two steps:


    # ANATOMY OF A SHELL COMMAND


    Each command is composed of specific parts, including the command name, options,
    and arguments. These parts tell the shell command to execute, how command should
    be executed, and what other information should be passed to the command. You can
    better understand how Unix reads commands by looking at the following example:


    ```

    grep -i -C2 --line-number "Mac OS X"

    Documents/to-do.txt

    ```


    This command illustrates all of the components that a shell command, and illustrates
    how to use multword arguments by employing quotes.


    # Simple Command Name


    # Arguments


    The shell breaks down your command into words separated by spaces, and then interprets
    the commands one at a time. The first word in the command is grep, and so, the
    shell executes to the `grep` command.


    After the options in the command line, you can add arguments in the form of filenames
    or text. The shell passes these arguments along to the command that you are executing,
    and gets the information such as what file or where to store the results of the
    command when it is done. In the example above, the two arguments are "Mac OS X"
    and Documents/to-do.txt. The first argument of the `grep` command, "Mac OS X",
    is a specific piece of text that you find in a file, and the second, is the name
    of the file.


    To save typing, Unix commands have traditionally very short words. Some are not
    pronounceable words in English, such as `ls`, `cd`, or `grep`. The word grep is
    pronounced, but it has no meaning in English. It is actually an acronym for global
    regular expression. That may not help you much, but for now, it is to say that
    the `grep` command lets you search for text in a file.


    # Escaping Arguments


    # Options


    You can type a number of options after the command name; these are strings starting
    with a hyphen or dash; you use these options to force Unix to change their behavior.
    Each command has a unique set of options that you can use, and the meanings of
    these vary from command to command. For example, with `grep -i` it matches text
    without regard for case, while with `grep -i` it tells the shell to ask the user
    to confirm each file.


    The quotation marks around three words "Mac OS X" tell the shell to treat them
    as one argument rather than three. If the quotation marks are not used, the command
    line tells grep to look for the words OS, X, and Documents/to-do.txt. You need
    to use quotation marks whenever you need multiple arguments or filenames in your
    Unix commands. Or, you can type a backslash (\ before each space; this tells the
    shell not to treat the space as a word separator.


    Many options are single letters, but some are a single letter and a value, such
    as -c2, which stands for the option -c and the numeric value. Longer options are
    often set off with two hyphens, as --line-number.'
