  md: '# DEVELOP C AND C++ APPLICATIONS


    You can develop applications in C and C++ on your Mac OS X system. Developing
    applications in C or related languages, such as C++, depends largely on your ability
    as a programmer, although the Mac OS environment offers excellent support for
    your development efforts. The gcc compiler accompanies the Mac OS X developer
    tools the default compiler for C, C+, Objective-C, and Objective-C++.


    Before you begin in any of the programming languages on Mac OS X, you should update
    your PATH to include /usr/share/man. This ensures that the man pages for the developer
    tools are available to you. If you use the line setenv PATH=/usr/share/man/local/man/usr/share/man/your.tcshrc,
    this file and other pages appear when you use the man command.


    You should use the text editor to configure your source code. Many developers
    prefer editors because they can configure


    them to properly indent source code. However, you should use the text editor that
    allows you to work most effectively.


    After typing your source, you can compile it using gcc or make command, which
    manages the compilation process. The make command only compiles a program if the
    associated binary code is older than the source code. In other words, it only
    recompiles the source code. If you have an application of multiple source files,
    you must make the relationship between those files clear. make calls gcc to compile
    programs.


    make works with many different programming languages, although it is most used
    with C. In fact, make is not limited to compiling source. You can read the man
    page to learn about this versatile command.


    # DEVELOP C AND C++ APPLICATIONS


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_311_0.png)


    +   1 Type vi hello.c and press Return.


    +   2 Press I and type #include <stdio.h>, then press Return twice.


    > The include command adds the standard IO header file to your program.


    +   3 Type main() { and press Return, then use the Tab key and printf("Hello,
    World!"); and press Return again.


    +   4 Type J and press Esc, then type :wq


    +   vi saves your source code.


