  md: '# WORK WITH PROCESSES


    You can use the kill command to send signals to running processes. The kill command
    is for terminating a process. Although many people talk about the kill command
    as if its sole function were to terminate processes, this is not the case. In
    fact, the kill command''s real function is to send short messages called signals
    to running processes to control the behavior of these processes. The default kill
    command — the command without an argument — sends a signal that asks the process
    to terminate. Systems people often refer to the default signal as SIGHUP,


    # Apply It


    as a SIGTERM. Another common signal, for hang up, is most used to tell a running
    process that it should go back and re-read its configuration file. Many system
    processes remain unaware that their configuration files have changed unless you
    send this signal to them. Another often-used signal is SIGKILL, a signal used
    to terminate a process that is not terminated with SIGTERM.


    # TYPE THIS:


    ```

    [kill -] user man kill

    [control]-

