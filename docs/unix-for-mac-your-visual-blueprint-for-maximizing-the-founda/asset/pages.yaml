  md: '# INSTALL THE LYNX BROWSER


    You can install the Lynx Web browser on your Mac OS system. Lynx is a text-based
    Web browser that is useful for troubleshooting Web connections and accessing files
    and information from the Web, especially when you are limited to a text-only environment,
    such as a telnet or ssh connection. Lynx does not install with the Mac OS distribution,
    but you can download it using Fring Free.


    You can use Lynx to browse the Web as you would Internet Explorer and Netscape
    Navigator. To start Lynx, you can type lynx followed by the URL that you want
    to visit.


    You can click links, even though they appear as text, or move around the site.
    You can use the arrow keys on your keyboard, the spacebar, or any number of single-letter
    commands. The third line from the bottom of the screen suggests you what you may
    want to go next. Type enter or press space for the next page. To move forward
    in the document, you can press the spacebar, and move backward you can type the
    letter b. As a text-only browser, Lynx seems strange at first, but you may find
    it handy, and sometimes indispensable. The name Lynx is a homonym for links.


    While Lynx does not fill your screen with dancing frogs and pop-up ads, the simplicity
    of this tool gives you a definite advantage because it is fast. Lynx recognizes
    graphics and links, it displays only the textual equivalents. For example, in
    a place of a link, you use [Link Name] or (Image Name), as in [company_logo.gtit].


