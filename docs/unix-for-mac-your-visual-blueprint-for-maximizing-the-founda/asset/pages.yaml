    The built-in Apache server also initializes personal Web sites for your users.
    For example, the personal Web site for the user Smith, is defined to reside in
    /Users/Smith/Sites/index.html. You can find the access and error logs for the
    built-in Apache server in /var/log/httpd file.


    # APACHE DIRECTIVES


    The directives in the table below are some of the most critical in setting up
    your Web site in the way that you want it to work. Not, if not, all of these reside
    in your httpd.conf, though some appear in comment lines.


    | Option | Description |

    | --- | --- |

    | Options | Specifies options, such as whether directory browsing is enabled |

    | <Directory name> and </Directory> | Block directive for handling a specific
    directory |

    | DirectoryIndex | Lists default documents, like index.html |

    | DocumentRoot | Specifies directory where Web pages reside |

    | ErrorLog | Specifies log directory relative to ServerRoot |

    | HostnameLookups | Specifies whether reverse lookups should be performed |

    | KeepAlive | Determines whether sessions extend beyond the first request |

    | Listen | Specifies port that server listens on, usually port 80 |

    | LogFormat | Defines content of the log file |

    | LogLevel | Determines what level errors should be logged |

    | MaxClients | Sets a limit on the number of simultaneous connections |

    | ScriptAlias | Connects a virtual name as /cgi-bin/ with an actually directory
    |

    | ServerAdmin | Provides an email address of Web site admin |

    | ServerRoot | Identifies directory containing your Web pages |

    | StartServers | Determines how many server processes run when the server starts
    |

    | StartThreads | Determines how many threads a single process can make |

    | Timeout | Limits time an inactive session is maintained |

    | User nobody | Specifies userid under which Web processes run |

    | UserDir | Identifies directory that is used for personal Web sites |

    | <VirtualHost pattern> ... </VirtualHost> | Block directive for virtual hosts
    |'
