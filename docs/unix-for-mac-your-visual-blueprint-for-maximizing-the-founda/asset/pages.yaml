  md: '# DOWNLOAD WEB SITES WITH WGET


    You can download an individual Wget page or an entire Web site with Wget. Wget
    is an extremely fast command-line tool that retrieves files from Web sites using
    HTTP and FTP. You can download an entire site by using a single type of line.


    Wget works well even on slow and troublesome connections, and if you are using
    a slow dial-up line, you can start the download and let it run. In all likelihood,
    it will run to completion with no monitoring or other attention. Wget runs in
    the background, making it ideal to tool up a Web site.


    To start a download, all you have to do is wget followed by a URL. For example,
    the command wget http://www.dragonflyitch.com downloads the Dragon Fly itch com;
    you will see this document in your browser if you use the same URL.


    If you use the recursive option, you can download all of the Web pages and image
    files from the site. It is a good idea to download sites only if you know how
    many files you are downloading and how large they are; they consume all of your
    free disk space. Wget creates a directory with the same name as the URL from which
    you are downloading, so if you are downloading from multiple sites, Wget drops
    the files from each site into separate directories to avoid confusion.


    The Wget tool includes many options, such as setting your username and password
    for access, limiting the depth of your retrieval, and determining whether Wget
    overwrites downloaded files. You can read the Wget page to learn more about this.


