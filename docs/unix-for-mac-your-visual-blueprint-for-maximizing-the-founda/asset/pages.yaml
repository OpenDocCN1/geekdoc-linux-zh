  md: '# MANAGE MAC OS X


    # SYSTEM ADMINISTRATION COMMANDS


    Mac OS X is not only different from Mac OS 9 and earlier versions of Mac OS, it
    is also different from other versions of Unix. For example, the root user on a
    Mac OS X system is disabled by default. This means you cannot simply adopt the
    root privileges and run commands that are not allowed to run as a normal user.
    Instead, you need to either preface these commands with the word sudo, or you
    need to activate the root account.


    You also need to know the basic file system layout — where the system stores files
    — and you must also know whether you pay attention to the files you find in the
    /etc directory — the normal configuration directory on Unix systems.


    The table below contains a list of the most important Mac OS commands for system
    administrators.


    | COMMAND | MOST COMMON USE | COMMAND | MOST COMMON USE |

    |---|---|---|---|

    | apropos | Find related commands. | man | Present the manual page for a system
    command. |

    | chown | Change the owner and, optionally, the group of a file. | mount | Attach
    a file to the system. |

    | compress | Compress a file. | netstat | Look at routing tables, network connections,
    or network statistics. |

    | crontab -e | Edit a cron file. | news | Create a new file. |

    | crontab -l | List cron jobs. | nidump | Display network information from Netinfo.
    |

    | df | Display free and used disk space. | riport | Print tables from Netinfo.
    |

    | du | Display disk space usage. | nlookup | Look up DNS information. |

    | dump | Dump a file to a backup device or a file. | passwd | Change the password
    for a user. |

    | fastboot | Reboot the system without a disk check. | ping | Test the connection
    to a system by asking for a reply. |

    | fdisk | Examine or change DOS partitioning information. | ps | Display information
    on running processes. |

    | file | Determine the type of a file. | reboot | Shut down and reboot the system.
    |

    | find | Find files using particular criteria. | shutdown | Shut down the system
    gracefully. |

    | fsck | Check the integrity of a file. | shutdown -r now | Shut down and reboot
    a system immediately. |

    | gunzip | Unzip a file zipped with gzip. | strings | Display the strings in a
    binary file. |

    | gzip | Compress a file. | tar | Create a archive or read from one. |

    | halt | Shut down a system immediately. | top | Display statistics on the most
    demanding processes. |

    | ifconfig | Display or change network interface information. | touch | Update
    the last changed on a file or create an empty file. |

    | kill | Send a signal to a process, possibly terminating it. | um | Unmount a
    file system which is currently mounted. |

    | ln | Create a symbolic hard link to a file. | uncompress | Uncompress a file
    compressed with the compress command. |

    | lpq | Display a printer queue. | | |'
