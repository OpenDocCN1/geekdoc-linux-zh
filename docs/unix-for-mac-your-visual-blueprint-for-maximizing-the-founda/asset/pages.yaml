  md: '# SELECT FILES USING COMPLETION


    You can easily specify filename by using command completion, which is a special
    function built into the shell. To use filename completion, you must type the first
    part of the filename and then press the Tab key. If there is a file that matches
    the complete line and press Return, the shell fills in the full filename for you.


    To see the results of an ambiguous match, you can press Control + D after the
    beep. Alternatively, you can type set autolist, which instructs your shell to
    list the remaining choice whenever file completion fails. This is a good command
    to save in your .bashrc, which ensures that this feature is set every time you
    type a Terminal. Similarly, you can turn off autolist with unset autolist.


    If no file matches the filename, the shell program emits a beep, indicating that
    there is not a match. If more than one file matches, the shell program fills as
    much as it can and emits a beep, waiting for you to enter more text to differentiate
    between the files that match the pattern and differ. At this point, you can either
    type more of the command line and press Return, or enough of the command line
    to uniquely identify the file you want to access, and then press again.


    You can combine filename completion with full or relative pathnames as well; if
    you type a partial pathname and press Tab, the shell lists the options within
    that path filename completion can save you a lot of typing and as making it less
    likely that you mistype any characters.


    # SELECT FILES USING COMPLETION


    | Terminal File Edit Scrollback Font Window Help |

    |---|---|---|---|---|---||

    | | Terminal -- tty1 |

    | [[ -:-]: user set autolist |

    | [[ -:-]: user is -ld G |

    | Desktop/ Documents/ |

    | [[ -:-]: user is -ld Desktop/

    | draws------ 6 user set 204 Nov 18 16:34 Desktop/

    | [[ -:-]: userk |


    +   - Type set autolist.

    - Type a shell command that takes a filename as an argument.

    - Type the first few letters of the filename and press the Tab key.

    - A list of possible matches appears.

    - Type enough letters to make an unambiguous match.

    - Press the Tab key again.

    - The shell completes the filename.

    - The shell executes the command.'
