  md: '# LOOK UP DOMAIN INFORMATION


    You can gather quite a bit of information about a domain using the nslookup or
    whois commands. These commands provide information that can be helpful if you
    want to know how to reach someone for a domain. Such information can also be useful
    in troubleshooting.


    The primary function of DNS is to translate IP addresses in exchange for fully
    qualified domain names as www.apple.com. The secondary function is to return fully
    qualified domain names in exchange for IP addresses. These are the only most obvious
    services that DNS provides to the systems that you service around the clock and
    around the globe. DNS also provides other useful functions. For example, DNS maintains
    and provides information about a domain and its registration.


    You can retrieve information about a domain by requesting the statement of authority
    (SOA) record with the nslookup command. The SOA record contains a statement about


    server''s zone of authority — what information it can vouch for and usually provides
    a point of contact. It also contains the serial and information about when zone
    expires.


    The DNS mail exchanger (MX) record identifies the mail servers for the domain.
    These records determine which systems are connected when another system needs
    to deliver e-mail to an address at that domain. You can also get this information
    using the nslookup command.


    The whois command looks up information in the Network Information Center (NIC)
    database. This includes the registry and the name servers responsible for registration.
    If you are curious about a domain that has a name similar or you want to determine
    whether you can buy it, the whois command will provide you with some basic information.


    # LOOK UP DOMAIN INFORMATION


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_149_0.png)


    ```

    [-] user%whois apple.com _

    ```


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_149_1.png)


    ```

    ++ Last update of whois database: Thu, 2 Jan 2003 05:11:45 UTC <<

    The Registry database contains ONLY COM, NET, ORG, EDU domains and registrars.

    ```


    ```

    [-:screenshots] whois _

    ```


    You must be connected to the Internet for this task.


    +   Type whois followed by a space.


    +   The screen displays the NIC information for the specified domain.'
