  md: '# EDIT TEXT WITH VI


    You can edit text files with the multiline editing capabilities of the vi editor.
    In Command mode, you activate the command line for editing purposes by typing
    a colon (:). There are many useful commands that you can learn about, including
    the editor that provides you information from the vi by typing n or consulting
    online references or books about the vi editor.


    To replace text, you can use the substitute by typing s.. When you type commands
    that begin with a colon (: they appear on the bottom line of the Terminal. vi
    can edit the command after you type the full command and press Return.


    There are many ways you can use the :s command, including:


    ```

    :s/old/new/

    :s/old/new/g

    :%/old/new/g

    ```


    The first instance replaces a single occurrence of old with the new line. The
    second instance adds the g, which stands for global. This means that it replaces
    all occurrences of old with new on that line, and not just the first occurrence.
    The third instance includes a range option, %, which tells vi to replace all instances
    of the word throughout the entire file.


    To join two lines of text onto one line, you can use the editing command J This
    removes the line break at the end of the line and joins it to the next. When you
    edit the text in your file, vi does not save your changes until you edit the command
    to do so.


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_83_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_83_1.png)


    # FIND AND REPLACE TEXT


    +   1 Type :

    * The cursor moves to the bottom of the screen following a colon.


    +   2 Type % and the original word or phrase you want to replace.


    +   3 Type a forward slash and the new word or phrase.


    +   4 Type another forward slash, the letter g, and press Return.


    +   The vi editor globally replaces the text with the replacement text.'
