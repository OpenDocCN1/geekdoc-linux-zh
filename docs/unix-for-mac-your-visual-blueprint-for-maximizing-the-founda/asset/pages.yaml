  md: '# CREATE CLICKABLE SHELL SCRIPTS


    You can make shell scripts that you can run double-clicking the icons in the Mac
    OS X Finder. A script is clickable if the name of the script file ends with suffix
    .command.


    Ordinary shell scripts are not clickable. Double-clicking a shell script''s icon
    opens it in a text editor instead of running it. To make it clickable, you can
    make the script by using the chmod command and giving it a name ending in .command


    When you double-click the icon of a .command file, the terminal program opens
    a new window and executes the command in that window. For example, if you want
    to run the top program in a shell window, you can write a script like this:


    ```

