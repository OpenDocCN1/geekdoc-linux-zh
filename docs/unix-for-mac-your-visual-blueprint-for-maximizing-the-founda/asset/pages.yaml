  md: '# RUN A PERL SCRIPT


    You can run a Perl script by using it as an argument to the Perl interpreter,
    or by making executable. After you create a Perl script, you can instruct Perl
    to interpret and execute the script, for example, by typing myscript.pl. This
    is the simplest way to run a script, but not the most convenient. Most users prefer
    to run scripts though they are new commands, and without having to know anything
    about the language in which they are written. Thus, they may not want to type
    perl before the line


    For the convenience of users, and to avoid errors that may generate if you type
    the name of the script on a line by itself, you can insert a line at the top of
    the script that identifies your file to the shell as a Perl script, and you can
    make the script executable. To run this line as the


    shebang, and the syntax for this line is # followed by the name of the interpreter.
    For a Perl script, you can type /usr/bin/perl.


    If you make your Perl script executable without the shebang, the system cannot
    determine what tool to run the script, and it attempts to run the commands using
    your script. This action generates a number of errors, as tcosh does not include
    a print command. If you mistype the shebang line, your system cannot find the
    interpreter and issues an error such as "not found: myscript.pl"


    You force yourself to use rules that are more restrictive in your Perl code using
    strict: to the top of your scripts. While adding this to your script may generate
    warnings messages, these messages may help you avoid potential errors in your
    code.


