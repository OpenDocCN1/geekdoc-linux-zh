    # Extra


    To operate well, Fink needs to work with the most recent data possible. If you
    install Fink and fail to update the inventory of available software, your installation
    of Fink becomes out of date and unable to recognize new releases of packages.


    You can also use dselect to install software. This tool comes from the Debian
    Linux community and provides a text-based interface. The dselect tool guides you
    through the process of choosing the access method you want to use, updating the
    list of available packages, requesting the packages you want to install, configuring
    packages which are not configured, and removing unwanted software. The tool opens
    with the following.


    Update the list and descriptions of packages Fink uses to find and install software,
