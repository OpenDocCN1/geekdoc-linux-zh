  md: '# COMPARE TEXT FILES


    You can compare two files using the diff command, which shows the differences
    between the files. You can compare three files using the diff3 command. You use
    the diff command if you want to compare two versions of the same file to see which
    file has changed. The syntax for the diff command is:


    diff first-file second-file


    The output from the diff command consists of those lines that are not the same
    in both files. If the files are identical, the diff command prints nothing; you
    only see the command prompt again.


    If there are differences, the diff command reports them in the following manner:
    the first line indicates the line numbers between each file, with a single letter
    between the range or of lines. The letter tells whether an addition was made,
    a line was deleted, or a line was changed. The versions from each file then appear,
    by a less-than symbol for lines in the first file, and a greater-than symbol for
    lines in the second file.


    You can also use the diff command to compare non-text binary files; however, the
    diff command does not print the actual differences between them, because these
    are likely to be non-printable characters. Instead, diff returns to prompt if
    the files are identical, or prints a message saying that the binary files differ
    from each other.


    The diff only compares two files. If you need to compare three files, you can
    use the diff command. Note that there is no diff command.


