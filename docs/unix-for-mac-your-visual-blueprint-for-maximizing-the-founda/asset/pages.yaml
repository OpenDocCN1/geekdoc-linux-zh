    | COMPILE A PROGRAM WITH MAKE | | |

    |---|---|---|

    | Make is a program tool used to automate the building and compilation of programs.
    It is widely used for building C and C++ programs. Make works by reading a file
    called Makefile, which contains instructions on how to build the program. | |
    |

    | A typical Makefile consists of several targets. Each target has a name, a set
    of dependencies, and a set of commands to be executed to build the target. | |
    |

    | The following is an example of a simple Makefile for a C program named hello.
    | | |

    | hello: hello.o |

    \tgcc -o hello hello.o | | |

    | hello.o: hello.c |

    \tgcc -c hello.c -o hello.o | | |


