  md: '# CREATE SPREADSETS IN GNUMERIC


    You can use Gnumeric for simple calculations to complex numerical analysis. Gnumeric
    is a free spreadsheet released under the GNU Public License. It has all the features
    that you would expect in a quality spreadsheet application, with a built-in menu,
    support for graphs, an extensive range of functions, cell formatting, and printing.
    It has a powerful set of tools that allows you to import and export with Excel
    and others.


    where A2:A20 defines a range of cells. If you are not used to spreadsheets, you
    will have to get accustomed to this nomenclature. The columns in the spreadsheet
    are labeled A, B, C, and so on while the rows are numbered 1, 2, 3, and so on.
    A2 is the cell defined by the second row in the first column.


    To start Gnumeric, you can type Gnumeric in an term window. The tool will open
    with an empty spreadsheet. Entering data is as simple as clicking and typing text
    or a number. To enter a formula, you start by typing = and then you enter the
    formula, such as cos(100) or sum(A2:A20)


    You can also select data by holding down your mouse button and sliding over it.
    This often simplifies the process. Gnumeric, like most modern spreadsheets, will
    allow you to copy and paste a formula, adjusting the cell addresses in the process.
    If you use A2:A20 and then copy your formula A21 to B21, the new formula will
    sum B2:B20. If you are familiar with a spreadsheet application, you will probably
    be comfortable at using Gnumeric.


