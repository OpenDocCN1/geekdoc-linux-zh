  md: '# # CREATE DIRECTORY


    You can use the mkdir command to create new directories. Directories are useful
    for organizing your files into a logical structure. When you create a directory
    in the Unix shell, you can access it through the Mac OS X as a folder; when you
    create a folder in the OS X with a space, you can access it as a directory in
    the Unix shell.


    The arguments you give to the mkdir command affect how new directories are created.
    If you create a directory with a space in the name, you must enclose it in quotation
    marks, unless you want to create several directories at once.


    To create a directory, you need to write permissions for the current directory
    or the directory in which you are creating the new directory. If you want to


    create the directory /usr/local/resp, you must have write access to the /usr/local
    directory. You can change your working directory to the /usr/local directory using
    the cd command and type mkdir resp, as well as type mkdir /usr/local/resp from
    any current directory.


    When you give a pathname, relative or full, the intervening directories must exist.
    If they do not, you will receive an error message and the directory is not created.
    You can create any new directories by using the -p option. For example, to create
    the directory ~/Documents/by-date/2003/03, your command creates the by-date and
    2003 directories as well as the directory if they do not exist — presumably, the
    Documents directory already exists in your Home directory.


    # CREATE A DIRECTORY


