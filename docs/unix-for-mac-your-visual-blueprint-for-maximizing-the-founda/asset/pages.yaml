  md: '# Extra


    The table below lists some of the most useful history codes. You can use these
    history substitutions anywhere in your command line. For example, if you have
    just moved a series of files with the mv command and you want to change their
    file permissions, you can chmod +!! to use the chmod command on the arguments
    supplied to the mv that you have executed.


    | HISTORY CODE | MEANING |

    | --- | --- |

    | !! | The previous command. |

    | !!* | The argument of the previous command. |

    | !^ | The first argument of the previous command. |

    | !$ | The last argument of the previous command. |

    | !text | The last command beginning with text. |

    | !? | The last command containing text. |

    | !?number | The command number from the history command. |

    | !-3 | The three commands ago. |


