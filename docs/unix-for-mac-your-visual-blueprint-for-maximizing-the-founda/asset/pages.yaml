  md: '# INSTALL UNIX APPLICATIONS


    # Extra


    You can use the tar command to extract a single file or directory from an archive
    instead of the entire contents. For example, you may want to first read the license
    agreement and README file before proceeding to extract the remaining contents
    from the archive.


    To extract a single file from a TAR file, add the name of that file to the end
    of the tar command. The command -xvf drawfigs.tar README extracts only inside
    the README file. If you are extracting a file from a directory inside the TAR
    file, be careful to type the directory name exactly as they appear in the file
    listed by the tar -tvf command. For example, if you want to extract as tmpls/template1.tmp,
    type the command tar xvf drawfigs.tar tmpls/template1..


    If you want to change some part of the pathname for the extracted files while
    you are extracting them, you can use the -s option. For example, if you want to
    change the tmpls directory to orig_impls during the extraction, you can type -s
    /impls/orig_tmpl/ -xvf drawfigs.tar.


