  md: '# KILL A PROCESS


    You can use the kill command to stop a running or suspended process. By halting
    a command that you mistyped, you can avoid wasting system resources or performing
    a process that you did not intend to run.


    Stopping a process that is running on a Unix system is calling it. To kill a running
    process, you use the kill command followed by the process ID of the process. For
    example, kill 1234 will kill the process with ID 1234. To kill a suspended process,
    you use the kill command followed by the job ID. For example, kill %2 will kill
    the second suspended process.


    After you kill a process, you cannot restart it. You can run the same command,
    but this action starts a new process.


    You can kill a process by name. The variant of the kill command used for this
    purpose is killall. It will kill all commands, even


    if they are running in other Terminal windows. When you issue the killall command,
    the system looks for commands that are running.


    As a non-root user, you can only kill processes that you have started. As a root
    user, however, you can kill any process on the system. Unix provides little protection
    from making mistakes that can bring your system down. One of the root users can
    be tempted to enter kill 1 when they mean to kill %1. The intention is to kill
    a suspended process. Typing the command without a % process known as init will
    likely crash your system. For this reason, disciplined system administrators avoid
    using the root account when there is no other way to accomplish


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_113_0.png)


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_113_1.png)


    # KILL A PROCESS


    # KILL A PROCESS BY JOB NUMBER


    +   - Type kill followed by a job ID number, as with %2, and press Return.


    +   - The suspended process terminates.


    # KILL A PROCESS BY PROCESS ID


    +   - Type ps and press Return.


    +   - Type kill followed by a ID from the list displayed and press Return.


    +   - The suspended process terminates.


    102'
