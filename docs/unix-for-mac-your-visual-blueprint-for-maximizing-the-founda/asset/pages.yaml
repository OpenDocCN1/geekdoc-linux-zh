  md: '# Extra


    DNS records include those defined in the table below.


    | RECORD TYPE | FUNCTION |

    | A | Maps a domain name to an IP address |

    | CNAME | Provides an alternate name or alias for a system |

    | PTR | Maps an IP address to a domain name |

    | MX | Identifies a mail exchanger for a domain |

    | SOA | Provides information about the domain as a whole |


    There is not necessarily a one-to-one correspondence between fully qualified domain
    names and IP addresses. A single qualified domain name can resolve into multiple
    IP addresses. This indicates that connections to these systems are being distributed
    in a way that each system in the set is reporting to a share of the overall traffic.


    A simple system may have virtually any number of fully qualified domain names,
    and this is, often the case with ISPs that provide Web site support for hundreds
    or thousands of customers. For this work, each of these names resolve to the same
    IP address.


