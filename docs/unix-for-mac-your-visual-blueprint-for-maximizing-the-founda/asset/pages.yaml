    \ any other system. While Mac OS systems make it easy for you to log on to browse\
    \ Web sites and download files, they do not allow others to log on to your system\
    \ or access files on the command line. If you want to use this type of access,\
    \ you have to enable it by modifying your system's configuration.\n\nmore information).\
    \ Alternatively, you can configure the service to start whenever a request arrives.\
    \ In this latter case, another process lists requests on behalf of the service\
    \ and starts as it needed. The decision of which method to use depends on the\
    \ particular service. Web servers, such as Apache's httpd, are better run at all\
    \ the time. This provides better Web performance. Services such as ftp and telnet\
    \ are used only now and are better on an as-needed access through the /inetd.conf\
    \ file.\n\nThere are two basic ways to provide a network service on your Mac OS\
    \ system. You can start the service - for example, start a Web server by typing\
    \ the name of the server process. These services are designed to run in the background\
    \ and continue running until you shut your system down or kill them. See Chapter\
