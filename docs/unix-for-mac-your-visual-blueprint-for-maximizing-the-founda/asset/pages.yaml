  md: '# UNIX FOR MAC


    # INSTALL APACHE MODULES


    You can download and install additional Apache modules to expand the capabilities
    of your Apache server. The default Apache installation sets up very adequate and
    responsive Web server, the default set of modules that are included may not meet
    all of yours. You can obtain a list of the modules that your installation of Apache
    already supports by typing httpd -l.


    To upgrade your Apache server you must download the new modules. If your Apache
    installation includes the mod_ module, you can install additional modules without
    recompiling Apache. The mod_ module provides Apache with support for dynamic shared
    objects (DSO). This means that you can use an external module without changing
    Apache. DSO modules load when Apache starts.


    After you compile a module into a DSO, you can use the LoadModule command that
    is part of the mod_so module in your httpd.conf file. This causes the module to
    load when you start restart Apache. The exact line that you enter depends on the
    module that you are installing. The instructions that you obtain for the module,
    often in a file called README or INSTALL, tell you which line to enter.


    To build a module for your Apache binary, you must download the module, install
    the files into the directory for your Apache, and recompile. Apache depends on
    the version that you are installing. Read the README and INSTALL files for Apache
    and the module that you need.


    Fortunately, the Apache Web site offers a list of modules with a description of
    each one. This information helps you to find a module that can add the functionality
    you require.


    # INSTALL APACHE MODULES


