  md: '# VIEW PORTIONS OF A TEXT FILE


    You can display a portion of a text file using the head and tail commands. To
    understand how the head and tail commands work, it is useful to visualize a text
    file as if it were being chopped into head, and body. The head displays the portion
    of the text file containing its head, and the tail displays the tail of the file.
    You can give additional options to both to indicate where the body of the file
    you want to cut.


    ```

    head -linenumber filename

    tail -linenumber filename

    ```


    For example, type head -3 /usr/share/dict/words to see the first three lines of
    the file /usr/share/dict/words. Several Unix programs use this text file as a
    source of English words, so it makes a good example for text commands.


    Tailing -3 /usr/share/dict/words shows you the last three lines of this file.
    You can also use the tail command to start a number of lines from the beginning
    of the file by including a plus symbol:


    ```

    tail +linenumber filename

    ```


    Without any options, the head command shows the first ten lines of a specified
    file and the tail command shows the last ten lines. If the file has ten or fewer
    lines, the whole file displays.


    You can change the number of lines that display in the following way:


    | Terminal File Edit Scrollback Font Window Help |

    |---|---|---|---|---|---||

