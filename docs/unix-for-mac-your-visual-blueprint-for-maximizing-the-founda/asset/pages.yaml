    open source program that allows you to analyze Web traffic based on records stored
    in your log files. Analog can produce as many as 32 different reports. For example,
    it can provide you charts that highlight heavy traffic times—for instance, times
    of the day or days of the week. It can also show you which of your files visitors
    most frequently, where visitors are coming from when they follow links to your
    Web site.


