    are different, the systems are not on the same network. The default router is
    a system on the local network that forwards communications to remote systems –
    systems not on the local network.


    A local area network, for example, include all of the IP addresses between 128.2.10.1
    and 128.2.10.254. When a network, such as 128.2.10.13 functions like a street
    address.


    A subnet mask is a value of the form 255.255.255.0 which numerically marks the
