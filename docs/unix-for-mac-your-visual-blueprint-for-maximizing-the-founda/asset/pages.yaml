  md: '# OPEN A FILE WITH EMACS


    You can use the emacs editor to edit text files. emacs is a very complex program
    that can do everything from editing simple text files to downloading and displaying
    Web sites.


    Among Unix users, there is a friendly rivalry between users of vi and users of
    emacs. This book gives greater coverage to vi because it is less complex than
    emacs. However, if you do not find vi to your liking or prefer to use a very flexible
    and adaptable text editor, the emacs editor is an excellent choice.


    As with Pico, you can use the arrow keys to move around, and you can edit text
    directly.


    You can execute commands in emacs by using either the Control or Meta key. When
    you type a character with the Control key, this means the prefix C- in emacs terminology;
    that you type with the Meta key corresponds to the prefix M-. For example, search
    for text, press Ctrl + 5 (C-s), and to move to the end of a file, press Alt +
    > (M->). Keep in mind that the prefix C- means you hold down the Control key by
    pressing another key, and M- means you hold down and then release the Esc key
    before typing the following key. Use the Esc key instead of the Meta key because
    Apple keyboards do not have a Meta key.


    The basic functions of the emacs editor are easy to use. To open a file, you can
    simply name the file as an argument, as with other editors. Unlike vi, emacs does
