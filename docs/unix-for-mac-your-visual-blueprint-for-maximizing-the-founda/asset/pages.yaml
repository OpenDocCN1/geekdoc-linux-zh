  md: '# CONFIGURE SENDMAIL (CONTINUED)


    To modify DontBlameSendmail, you would do one of two things. One, you would need
    to edit the sendmail.cf and try sending mail again. The line #DontBlameSendmail=safe
    is changed to 0DontBlameSendmail=group


    You went to edit this file. The lines of interest are all lumped together at the
    bottom. After the first line starting with the word define, you should add a line
    that defines(''CONFONT_BLAME_SENDMAIL'', ''Group

    ablerPathSafe''). Then, save file.


    Another way is to generate an entirely new configuration file. While this might
    make you a lot more work, the file that you need to generate a new configuration
    is far more approachable than sendmail.cf. In addition, you can also use some
    other options to your configuration.


    The next thing you need to run is to use the specifications that you just edited
    into a new configuration file. That would look like this: ../m4 /cf/m4 yourdomain.mc
    = /tmp/sendmail.cf. That you back up your current configuration file in /tmp and
    install your new configuration file in its place. Then you start sendmail.


    To start the process of creating a new configuration file, you will make a copy
    of the default configuration file. To find this file, you will move into /usr/share/sendmail/cf
    directory. The default file is called generic-darwin.mc, you can replace it with
    your domain name if you have one. The basic idea is to prepare the original for
    safekeeping.


    To ensure sendmail starts up every time your system is booted, you need to modify
    /etc/host.conf. This file plays a critical role in starting services. You will
    change


    > MAILSERVER=NO-- to MAILSERVER=YES-


    ```

    [ferro--) cd /usr/share/sendmail/cf

    [ferro--) sudo cp generic-darwin.mc yourdomain.mc

    Password:

    [ferro--) vi yourdomain.mc

    ```


