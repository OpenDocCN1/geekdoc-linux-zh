  md: '# DEVELOP RUBY APPLICATIONS


    You can can quickly develop object-oriented applications in Ruby. Like Python,
    Ruby is an object-oriented scripting tool that installs with the Mac OS developer
    tools. In fact, there is considerable debate about which of the two is the better
    language.


    The interpreter is /usr/bin/ruby, and the syntax is relatively easy to use and
    learn, like Perl. The language is extensible. Smalltalk, a programming language
    that is object-oriented. For example, in Ruby, you can use the command 3.times
    `print "Hello, World!"` to print "Hello, World!"


    Because the language has accomplish a lot with just a few lines of code, some
    of these types include match and replace commands that are similar to commands
    you can use in Perl. For example, the


    command string.gsub(/this.*/, "that") replaces this with that. If you do not find
    a built-in type that meets your needs, you can define your own using the `def`
    command.


    Because Ruby is interpreted, you can run scripts by using them as arguments to
    the interpreter - such as ruby HelloWorld.rb or by including the shebang line
    in your script and making the script executable. ruby -v tells which version of
    Ruby you are using.


    Print commands in Ruby look like print in Perl or C, but do not require the use
    of a semicolon at the end of the line. New lines are represented with \n. While
    file extensions are not critical on Unix systems, Ruby scripts are generally given
    the file extension .rb to indicate that they are programs.


