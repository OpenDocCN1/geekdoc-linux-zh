  md: '# UNIX FOR MAC


    # USING OPEN SOURCE SOFTWARE


    You can download, install, and use open source software to great advantage. Open
    source software is free, and is developed and tested by most people in the industry.
    The intention of open source licensing is to encourage collaboration and innovation
    while shifting the focus of control from large companies to users.


    even though they are selling software that is essentially free. Commercial success
    and open source software are not incompatible with each other. In fact, Mac OS
    X is built on an open source foundation, a core operating system known as Darwin.


    The development of Linux has been very important to the Open Source movement,
    open source development has also brought tools that are critical to the Internet
    such as BIND, send, and Apache.


    The Source movement is dedicated to quality and practice. The basic idea behind
    open source is that, with the have of hundreds of people proving and investing,
    the quality of the software improves. In addition, no individual or company can
    leverage that development towards goals that are against the interests of the
    overall population of users.


