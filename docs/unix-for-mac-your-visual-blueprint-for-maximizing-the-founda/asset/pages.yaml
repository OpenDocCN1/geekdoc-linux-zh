  md: '# UNIX FOR MAC


    # LIST FILES


    When you are using the Unix shell, everything is represented by a file within
    the file-based structure. The file structure is composed of directories, which
    are special types of files that can contain other files. In addition, type files
    are also called executable files—with the exception of some commands built directly
    into the application. In fact, your shell is an executable file.


    If you are familiar with the Mac OS operating system, you are also familiar with
    the file-structure—everything is stored in folders. The folders of the Apple interface
    are folders and directories are interchangeable. The term directory has roots
    in Unix, while folder comes from the Mac OS graphical interface.


    Each file has a unique name. These names can contain letters, numbers, symbols,
    and even spaces, however, if


    your filename contains spaces or punctuation symbols beyond a period, underscore,
    or dash, you then need to place quotation marks around filename when you specify
    it in a command line.


    When you start a Terminal, the shell opens in a specific directory known as your
    Home directory. This is unique to each user on your computer, and Unix uses your
    Home directory to store files, which you create using various programs.


    The command ls shows the contents of the current directory in which you are working.
    You can use the option -F after the  ls command to add an additional marker to
    identify each type of file. A forward slash (/) after a filename indicates a directory
    and an asterisk (*) indicates an executable.


    # LIST FILES


