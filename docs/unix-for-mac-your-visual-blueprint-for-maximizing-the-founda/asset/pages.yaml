    # Extra


    You can set any variables you want, as long as their names start with a letter
    and contain only letters, numbers, and the underscore symbol. However, these variables
    only affect the shell if their name corresponds to the list of special variables
    understood by the shell. Some of the most useful special variables appear in the
    table below.


