  md: '# Extra


    In addition to searching by name or wildcard pattern, you can also search by other
    qualities of the file, such as the last time the file was changed, the owner of
    the file, or the permissions of the file. You can control the search with the
    arguments you include after the pathname of the directory.


    | ARGUMENT | SEARCHES FOR |

    | --- | --- |

    | -group groupname | Files belonging to a certain group. |

    | -iname filename | Like ~name, but matches regardless of case. |

    | -mmin minutes | Files modified within a certain number of minutes. |

    | -mtime days | Files modified within a certain number of days. |

    | -perm charmode | Files that have specific permissions set. |

    | -size charsc | Files that are an exact size in characters. |


    ![](img/8d9b2c31cb5ebc6571f0b2dfd7c634cf_40_0.png)


    # FIND FILES BY PATTERN


    +   1 Type find and a space.

    2 Type the pathname of a directory and a space.


    +   3 Type -name and a space.

    4 Type a wildcard pattern in quotes.


    +   5 Type -print and press Return.

    The shell executes the find command and prints the file location for each file
    matching the wildcard pattern.'
