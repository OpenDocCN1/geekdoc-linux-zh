  md: '# WHAT''S ON THE CD-ROM


    The CD-ROM included in this book contains many useful files and programs. Before
    installing any of the programs on the disk, make sure that you do not have a newer
    version of the program already installed on your computer. For information installing


    different versions of the same program, contact the program''s manufacturer. For
    the latest and greatest information, please refer to the ReadMe file located at
    the root level of the CD-ROM as well as the manufacturer''s Web site.


    # SYSTEM REQUIREMENTS


    To use the contents of the CD-ROM, your computer must have the following hardware
    and software:


    Chimera

    For Os X, and Windows/Open Source. Chimera is a browser for Jaguar, Mac X v10.2.
    From the Mozilla Organization,www.org/projects/chimera.


    For Macintosh:


    +   - Mac OS v10.2 or higher with a 400 MHz or faster CPU

    - At least 256MB of total RAM installed on your computer; for best performance,
    we recommend at least 512MB

    - A network card

    - A CD-ROM drive


    Fink

    For Mac OS Free/Open Source. Fink enables Mac OS to import and fix open source
    Unix software. From The Fink Project, http://fink.sourceforge.net.


    # GIMP


    For Unix, Mac OS, and Windows. GNU Free/Open Source and Binary. Requires Windows.
    The GIMP is the GNU Image Manipulation Program for photo retouching, image composition
    and image authoring. From GNOME, www.gimp.org.


    # ACROBAT VERSION


    The CD-ROM contains an e-version of this book that you can view and search using
    Adobe Acrobat Reader. The program cannot print pages or copy text from the Acrobat
    files. The CD- Acrobat includes an evaluation version of Acrobat Reader.


    # GNOME Core


    For Unix and Linux. Freeware/Open Source. Requires Windows. GNOME Core contains
    the components needed to run the GNOME desktop environment. From GNOME, www.gnome.org.


    # INSTALLING AND USING THE SOFTWARE


    For your convenience, the software titles appearing on the CD- are listed alphabetically.
    Some software provided on this CD may require additional components for installation.
    See the ReadMe file and links on the CD for additional information.


    GnuCash

    For Mac OS X and Windows. GNU Free/Open Source. GnuCash is a finance software
    that enables you to manage your bank accounts, stocks, income, and expenses, and
    more. From The GnuCash Project, www.gnucash.org.


    # AbiWord


    For Unix, Linux, and Windows. GNU Freeware/Open Source. Requires Windows. AbiWord
    is a cross-platform word processing program that enables you to perform the same
    task as Microsoft Word. From AbiSource/o SourceGear Corporation, www.absource.com.


    # KDEbase


    For Unix, Linux, and Solaris. Freeware/Open Source. Requires Windows. KDEbase
    contains the applications that are used with the kde desktop environment. From
    The KDE Project, www.kde.org.


    # Acrobat Reader


    For Macintosh and Windows. Freeware. Adobe Acrobat allows you to view the online
    version of this book. For more information on using Acrobat Reader, see the section
    "Using the E-version of the Book" in this Appendix. From Adobe Systems, www.adobe.com.


    # KDElibs


    For Unix systems. Freeware/Open Source. Requires Windows. KDElibs contains libraries
    needed by the Desktop Environment. From The KDE Project, www.kde.org.'
