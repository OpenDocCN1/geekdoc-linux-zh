  md: "# DETERMINE DIRECTORY SIZE\n\nYou can use the du command to display the size\
    \ and contents of a directory. The du command stands for disk usage, and it tells\
    \ you how much space each file or directory uses on your hard drive. This information\
    \ is also available from the Finder using Get Info menu. When you use the -s -1\
    \ command, you get the size of the directory itself just for other files. The\
    \ value does not represent the size of the contents of the directory; it represents\
    \ the size of every entry, a list of the files stored in the directory. To obtain\
    \ the size of the directory, including subdirectories, you can use the du command.\n\
    \ndirectories or files. Additionally, the space used by all subdirectories also\
    \ appears, along with subdirectories of subdirectories. This can make the output\
    \ of the du command quite extensive and hard to read; if you want a single answer\
    \ to summarize the size of a directory, you can use the -s with the du command.\n\
    \nWhen the du command displays sizes for files and directories, it measures these\
    \ sizes in blocks: a block on a Unix file system represents 512 bytes. This is\
    \ an easy number for computers to work with but somewhat difficult for humans\
    \ to grasp. You can use the -k to make the du command list sizes in kilobytes,\
    \ which are units of 1,024 bytes.\n\nIf you type du alone, it gives a listing\
    \ of disk usage in the current working directory; if you give one or more directories,\
    \ you see the space taken up by each of them\n\n# DETERMINE DIRECTORY SIZE\n\n\
