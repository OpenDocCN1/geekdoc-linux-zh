  md: '# OPEN A FILE WITH PICO


    You can edit text files with Pico, a basic and easy-to-use editor. The function
    of a text editor is to enable you to open, and save plain-text files. Mac OS X
    provides several text editors for this purpose. Text editors are less complex
    than word processors; they do not allow you to select fonts, layouts, or other
    factors that affect the look of the printed page.


    You can use the Pico editor by typing pico at the command prompt, along with an
    optional filename as an argument. If the filename argument exists and is a text
    file, Pico opens the file for editing; if it does not exist, you start with a
    blank file.


    The list of commands appears at the bottom of the screen. A caret (*) means a
    letter that you need to hold down the Control key while typing a key. For example,
    the ^X stands for Control + X.


    Three editors come with Mac OS X are Pico, vi, and emacs. Although they accomplish
    the same basic task of editing text, each has its own strengths and limitations.
    Pico is the simplest to use, because all commands appear on-screen, and are not
    many to learn. Because of its simplicity, Pico is a good choice for new users
    of the Mac X shell as well as experienced users who need to do simple text editing.


    You can use your keyboard to easily move around a Pico document. Use the arrow
    keys to move to the position you want to insert text, and then start typing. Use
    the delete key to erase text to the left of the cursor.


