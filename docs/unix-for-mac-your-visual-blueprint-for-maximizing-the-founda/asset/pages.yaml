  md: '# INSTALL TAR ARCHIVES


    You can install software from a tape archive, TAR file, by using the tar command
    with a -x argument. The -x argument instructs the command to extract from a specified
    file. You also use the tar command to create these archives, for example, in preparing
    applications for distribution. Many users use the tar command to prepare archives
    of important files. You add a -f argument, making the command -xf, if you want
    to specify the file in the command and a -v argument, making the command tar -xvf,
    if you want to list the files as you extract them.


    You can use the tar -vf command to examine the contents of a TAR file. For example,
    to extract from a file called drawfigs.tar, you can type tar -vf drawfigs.tar.
    If the filenames appear start with a /, the tar command attempts to extract the
    file with the path, starting at i/. Otherwise, tar extracts the commands into
    your directory.


    To ensure that the TAR file is intact, it is always a good idea to examine the
    contents of the TAR file before you extract it. If you download a TAR file before
    using binary mode, you may end up with a file that is corrupt. Checking the contents
    also tells you the software installs when you extract it. Most TAR files install
    in the directory where you are when you issue the tar command.


    The command for extracting files from an archive named drawfigs.tar is type tar
    -xvf drawfigs.tar. The -v argument of the command stands for verbose. When you
    use this option, the tar command displays each filename as it extracts it.


