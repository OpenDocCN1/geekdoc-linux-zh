    $ symbol represents variable names, even when you first declare them and assign
    a value. More importantly, Perl allows you to build subroutines, variables and
    return values like most compiled languages. Perl also has sophisticated handling.


    greater than another, or looking for a number in a string, you can ask if a line
    of text contains an e-mail address or a date/time stamp by describing these items
    as patterns.


    Although the use of regular expressions can make Perl difficult to interpret at
    first, when you become more familiar with the symbols, you can begin to appreciate
    the succinct form of the language.


    However, the feature that distinguishes Perl from other languages is the versatility
    of regular expressions. If you use regular expressions from working in one of
    the Shells, you may be amazed by the versatility of the Perl language. For example,
    you can use regular expressions in Perl to do fuzzy matching. fuzzy matching,
    instead of asking which one number is


