  md: '# INTRODUCTION TO SYSTEM ADMINISTRATION


    You can effectively administer a Mac OS system by learning some basic commands.
    Unix administration is a complex job, but Mac OS X provides many tools for making
    the job manageable.


    # SYSTEM ADMINISTRATOR


    The basic responsibilities of any Unix system administrator are to keep the system
    running smoothly and to ensure that important data and configuration files are
    preserved. To administer a Mac OS system, you need to understand the fundamentals
    of file systems, know how to set up accounts, recognize when the system is having
    problems, and be prepared to manage applications and disk space.


    system crashes or if someone mistakenly deletes the wrong files from their account.
    System administrators manage accounts for other users. They establish an account
    for each user and ensure that the user can use the tools and applications they
    need.


    Users in large companies can often rely on help from a user support team. If you
    are using Mac OS X at home or in your small business, you are probably responsible
    for managing the system yourself; in effect, you are your own system administrator.


    System administrators routinely back up the systems they manage. This allows them
    to restore files if the


    # ACCESS PRIVILEGES


    Critical to the role of a system administrator is the concept of privilege. In
    order to install applications and modify configuration files, you need to have
    access to the root superuser'' account or to be a privileged user. A normal user
    on a Unix system can only work on files in their home directory.


    belonging to any user, modify any configuration file, and shut down the system
    or reboot it from the command line.


    While the privileges assigned to the root user are most significant when a Mac
    OS X system is managed by one person and used by many, the use of the root account
    is important even on systems where root and user are one and the same person.


    The root user has virtually unrestricted access to the system. As a result, the
    root user can modify files'
