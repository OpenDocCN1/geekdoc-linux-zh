  md: "# WORK WITH PROCESSES\n\n# Extra\n\nOn a multiprocessing system such as Unix,\
    \ many processes appear to be running at the same time. They are actually running\
    \ in quick succession taking turns using the system's CPU and memory. The system\
    \ tracks the resources that each process requires and restores the process environment\
    \ needed each time a process gets its turn to run. At almost any instant, most\
    \ processes are waiting for some resource, whether that resource is a response\
    \ from the user, data from the disk, or simply a turn at the processor.\n\nProcesses\
    \ change state while they are running. Process states include running, sleeping,\
    \ stopped, and terminated.\n\nWhen you suspend a process, you essentially put\
    \ it on hold so that you can run other commands. Similar to putting a caller on\
    \ hold, suspending a process means that no progress is made as long as that process\
    \ is suspended. The process is stopped, awaiting your instruction to start again\
    \ or to release all of its resources.\n\nYou can open a second terminal window\
