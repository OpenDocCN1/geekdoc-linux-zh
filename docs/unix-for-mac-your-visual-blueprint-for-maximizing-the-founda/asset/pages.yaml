  md: '# ACCESS ANOTHER COMPUTER SECURELY


    You can log on to a remote system more securely than with telnet using ssh. The
    telnet, login, and ftp commands have a long-recognized vulnerability. Each of
    these commands transmits usernames and passwords in clear text. Anyone situated
    along the network path between you and the system you are logging on is capable
    of “sniffing” packets – capturing network traffic including login information
    and your account. For this reason, secure tools have been created that provide
    remote login access and file transfer without exposing password and your account.
    Using a process known as encryption decipherable.


    ssh server such as sshd. for some ssh connections, will log on with username/password
    pairs. Others may be provided with a digital certificate. If your username is
    not the same on both systems, you may use the -l option.


    From a user’s point of view, using ssh in telnet or login makes little difference.
    The process and the result are nearly the same, if the user logs on with a username
    and password. The encryption and decryption are transparent. When digital certificates
    are installed on the client and server of connection, the process of logging may
    be simplified further. However, the login only works on systems that have the
    certificates installed.


    To use ssh in telnet or login, you need to have access to an ssh command or a
    tool that uses ssh, and the server that you connect to must have


    Similarly, you can use sftp in ftp to transfer files. When you use sftp, the files
