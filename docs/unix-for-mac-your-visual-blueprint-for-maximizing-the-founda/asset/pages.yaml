  md: '# SET YOUR PROMPT


    You can change your command line prompt by setting special shell variables. Changing
    your prompt lets you customize the information that the prompt displays to suit
    your needs.


    The prompt lets know that you are entering text into the shell, rather than a
    program. When it reappears, it tells you that the last command finished executing.
    You can set your shell prompt to contain whatever information you like using the
    following command:


    ```

    set prompt = ''prompt formatting sequence''

    ```


    A prompt formatting sequence is a series of letters, symbols, and special characters
    that serves as your prompt. A list of the most useful prompt formatting codes
    appears on the lacing page.


    The default prompt is set to the name of the computer, the partial path, and your
    username. This is useful on a


    multi-user system, or if you frequently log on remotely to other computers. However,
    many users are only on one computer at a time — the one they are sitting in front
    of — and only as a single user. If this is true for you, you may want to set your
    prompt to the, the number of commands entered, or the full path.


    In addition to the shell prompt, you can set other prompts. You use the prompt2
    setting if you want to end a command line with a backslash (\), indicating that
    the current command continues on the next line. You see the prompt if you have
    misspelled commands. You see the prompt message on the right side of the window
    for every command.


    Prompt settings only last as long as the Terminal window in which they are open.
    To make them permanent, see "Edit .zshrc File" in this chapter.


    | Terminal | File | Edit | Scrollback | Font | Window | Help |

    | --- | --- | --- | --- | --- | --- | --- |

