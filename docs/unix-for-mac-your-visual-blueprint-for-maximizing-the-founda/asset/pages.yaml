  md: '# BROWSE THE WEB WITH LYNX


    You can browse the Web with Lynx. At first, Lynx may appear to be a browser of
    limited capability, but as you become familiar with Lynx, you find how useful
    it is to quickly retrieve information from the Web; in less time than it normally
    takes to start Internet Explorer, Lynx has your site on your screen.


    You can follow links, search for text, and download pages in a similar manner
    to a normal browser. The difference is that, instead of clicking links that hide
    under images or display as underlined text, you move around with simple keystrokes.
    The currently active link appears highlighted. For example, the colors reverse
    so you see a black background if the rest of your screen is black on white.


    With Lynx you can use single-letter commands to navigate the Web. For occasional
    browsing, you only need a few basic navigational commands, but if you want to
    learn the more advanced browsing capabilities of Lynx, you can use the Lynx help
    facility to learn each of these one-letter commands. You can type lynx -help on
    the command line. You can also get help on Lynx by typing the letter / then open
    the Lynx User''s Guide by pressing Enter or your preferred key and then bring
    up a list of the stroke commands.


    If you find yourself stuck at any point or change your mind while waiting for
    a sluggish site to respond, you can type z to stop the current request. This command
    acts just like clicking the Stop button in Internet Explorer.


    # BROWSE THE WEB WITH LYNX


