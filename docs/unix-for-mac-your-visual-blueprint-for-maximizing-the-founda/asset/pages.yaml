  md: '# Extra


    You can cut-and-paste text in vi using the deletion keystroke commands and the
    p command. When you delete text, it is not completely lost; instead, it stores
    it in a paste buffer. You can think of this as a container that holds the most
    recently deleted text.


    You can paste the contents of the paste buffer into the current location of the
    cursor by typing the letter p. For example, to move a line by typing dd and move
    to the new location in the file: Type the letter p, and vi inserts the deleted
    line into the new location.


    You can copy text into the paste buffer without deleting it by using the y command,
    which stands for yank. With deletion commands, you must follow the y with a movement
    command that indicates how many lines you want to yank, or you can type yy to
    yank the current line.


    To yank or delete a number of lines, you can precede the y or d keystrokes with
    a number. For example, to yank 12 lines, including the current one, 12yy.




