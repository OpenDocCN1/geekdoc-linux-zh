  md: '# UNIX FOR MAC


    # COPY A FILE


    You can copy files with the cp command. This command allows you to save backups
    of important files or keep old versions of files while you edit. Making copies
    of important files before editing them is a good practice it assures that you
    can go back to the original.


    If copy-file is an existing directory, the copy will be placed in that directory
    and will be named the same as the original-file.


    To copy a file, use two arguments to the cp command: the first is the name of
    the original file, and the second is the name of the new. You do not have to overwrite
    the original file to copy it, but you must have permission to read it. You also
    need write permission in the directory where you make the copy. Your cp command
    should look like


    Copying a file can be dangerous if the file already exists with the same name
    you specify for. In such a case, write over the existing file with the new copy.
    The cp command does not automatically warn you, but it copies the file, assuming
    that you want to overwrite the existing file.


    To ensure that you do not accidentally overwrite a file, use the -i option with
    the cp command, so that it asks you to confirm that you want to overwrite the
    existing file. If you do, you can type y and press Return; if you not, you can
    press any key to cancel the process.


    ```

    cp original-file copy-file

    ```


