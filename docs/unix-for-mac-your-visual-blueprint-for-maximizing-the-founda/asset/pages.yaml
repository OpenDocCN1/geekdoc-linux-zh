    +   1 Type !!

    2 Type the first few letters of a previous command and press Return.


    # CORRECT A MISTAKE IN THE LAST COMMAND


    +   3 Type ^ and the corrected portion of the command.


    +   1 Mistype a command and press Return.

    2 Type ^ and the mistyped portion of the command.


    +   4 The shell executes the last command with the correction in place.'
