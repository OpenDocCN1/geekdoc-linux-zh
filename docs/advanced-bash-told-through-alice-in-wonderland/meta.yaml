    In bash, you can create an array variable by declaring and setting it as follows:


    ```

    my_array=("apple" "banana" "cherry")

    ```


    This creates an array named my_array with three elements: "apple", "banana", and
    "cherry". Note that the elements of the array are enclosed in parentheses and
    separated by spaces.


    # Accessing array elements


    To access an element of an array, you can use its index. In bash, array indices
    start at zero. To access the third element ("cherry") of the my_array array, you
    would use the following syntax:'
