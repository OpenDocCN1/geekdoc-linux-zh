    ```

    grep "Alice" file.txt

    ```


    这个命令运行良好，但它并不是最好的，

    因为它只匹配精确的单词，没有任何灵活性。

    使用正则表达式，你可以做得更多，

    让我们试试这个，看看效果：


    ```

    grep -E ''\b(Al)lice\b'' file.txt

