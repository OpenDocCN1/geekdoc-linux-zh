    the system. This is useful for managing multiple user accounts on a network or
    system.


    ```

    # Backing up all files in a directory with Bash

    tar -czvf backup.tar.gz /path/to/directory

    ```


    This command creates a compressed backup file of all files in a directory. The
    tar command is used to create the backup, while "czvf" specifies that the backup
    should be compressed and archived, and "backup.tar.gz" specifies the name of the
    backup file.


    ```

    # Monitoring system performance with Bash

    top

    ```


