  md: '# Regular Expressions


    We also saw Alice learning about regular expressions, which are a powerful way
    to search for patterns in text. Regular expressions are a language for describing
    patterns in strings, and they can be used in many different programming languages,
    including Bash.


    Here’s an example of a regular expression that matches any string that starts
    with “cat” and ends with “hat”


    ```

    ^cat.*hat$

    ```


    In the story, Alice used regular expressions to search and replace text, extract
