    ## Chapter 3: Command Line History and Editing


    Alice found herself once again lost in the strange and wondrous world of Bash.
    This time, she stumbled upon a curious group of creatures who were huddled around
    a computer screen, typing away furiously.


    As she approached the group, Alice recognized the Mad Hatter and the March Hare-looking
