    接着，我们向爱丽丝介绍了 `for` 和 `while` 循环，

    以及使用 `declare` 定义数组，这样她就能有风格地存储数据。

    然后是 Bash 函数的介绍，通过 `function` 即可轻松编写，

    这是一组你可以带着十足干劲地反复使用的命令。

