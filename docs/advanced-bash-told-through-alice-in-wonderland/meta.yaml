    # ## The Need for Conditional Statements


    Have you ever wondered how programs make decisions? Perhaps you have encountered
    a situation where the program needed to perform an action based on some input
    or data? This is where Conditional Statements come in handy.


    A Conditional Statement is a statement that performs an action based on whether
    a particular condition is true or false. Advanced Bash provides several different
    Conditional Statements that can be used to control the flow of your script, and
    make decisions based on user input, system output, or other factors.'
  - "[PAGE 36]\n\n# If Statements\n\nOne of the most commonly used Conditional Statements\
