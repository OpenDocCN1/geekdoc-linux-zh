- img_proc: true
  md: 'mv my_file.txt my_folder/


    The most important command in file management is chmod. The chmod command is used
    to change the permissions of a file or directory. Every file or directory in Linux
    has three sets of permissions - one set for the owner, one set for the group,
    and one set for others. These permissions can be read (r), write (w), or execute
    (x).


    To give the owner of a file read, write, and execute permissions, Alice can use
    the following command:


    ```

    chmod 700 my_file.txt

    ```


    Here, 7 represents read (4) plus write (2) plus execute (1) permissions for the
    owner. Ø means no permission for the group and others. Similarly, to give the
    owner and group read and execute permissions, and others no permission, Alice
    can use the following command:


    ```

    chmod 750 my_file.txt

    ```


    Here, 5 represents read (4) plus execute (1) permission for the group. If Alice
    wants to change the ownership of a file to user "alice" and group "users", she
    can use the chown and chgrp commands, respectively. For example:


    ```

    chown alice my_file.txt

    chgrp users my_file.txt

    ```


    With these commands, Alice can now create, delete, and manage files and directories
    with great ease. And with the art of file permissions, she can protect her files
    from strangers, and ensure that they''re worthwhile.'
