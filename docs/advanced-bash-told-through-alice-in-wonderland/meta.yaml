    ## 第 2 章：高级 Bash 中的 Shell 变量与环境变量


    哦，我们将看到变量，在这个关于 Shell 变量和环境的章节中，我们将学习它们是什么，

    它们如何工作，以及它们为什么对 Shell 的运行如此重要。


