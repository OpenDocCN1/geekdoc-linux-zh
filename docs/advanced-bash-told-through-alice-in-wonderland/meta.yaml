    ```

    touch my_file.txt

    ```


    If Alice wants to delete a file, she can use the rm command. The rm command is
    used to remove files or directories. To delete a file named “my_file.txt”, Alice
    can use the following command:


    ```

    rm my_file.txt

    ```


    If Alice wants to rename, copy, or move a file, she can use the mv command. The
