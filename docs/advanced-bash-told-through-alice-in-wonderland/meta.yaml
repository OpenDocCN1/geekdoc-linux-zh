- img_proc: true
  md: "# If Statements\n\nOne of the most commonly used Conditional Statements in\
    \ Advanced Bash is the if statement. The if statement allows you to check whether\
    \ a certain condition is true or false, and perform a particular action based\
    \ on the result.\n\nHere's an example of how an if statement works:\n\n```\nif\
    \ [ $var -gt 10 ]\nthen\n  echo \"The variable is greater than 10\"\nfi\n```\n\
    \nIn this example, the script checks the value of the variable var. If the value\
    \ is greater than 10, it prints “The variable is greater than 10” to the console.\n\
    \n# Else and Elif Statements\n\nIn some cases, you may want to perform a different\
    \ action if the condition in the if statement is false. This is where the else\
    \ statement comes in.\n\nHere's how an if-else statement works:\n\n```\nif [ $var\
    \ -gt 10 ]\nthen\n  echo \"The variable is greater than 10\"\nelse\n  echo \"\
    The variable is less than or equal to 10\"\nfi\n```"
