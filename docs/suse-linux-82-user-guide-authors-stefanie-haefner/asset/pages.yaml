    dialog. ''Edit'' opens a dialog in which to edit sound cards already configured.
    ''Finish'' saves the current settings and completes the sound configuration. If
    YoST is unable to autodetect your sound card, press ''Add Sound Card'' in ''Sound
    Configuration'' to open a dialog in which to select a sound card and module.


    # Setup


    With ''Quick Automatic Setup'', you will not be required to go through any of
    the further configuration steps and no sound test is performed. The sound card
