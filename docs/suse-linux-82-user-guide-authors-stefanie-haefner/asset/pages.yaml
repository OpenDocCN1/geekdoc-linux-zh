  md: '# # Starting YaAST


    The ‘K’ menu and the ‘SuSE’ menu (the icons at the bottom left on the KDE panel)
    offer several ways to access YaAST: via the ‘Control Center’, via ‘SuSE’➔ ‘Administration’
    ➔ ‘Configuration’, and via ‘Preferences’.


    In the K menu, you can directly select the needed configuration module. At start-up,
    YaAST first opens a small dialog in which to enter the password for the root user
    (the system administrator). The configuration is performed as root user because
    only root can modify Linux system files.


    You can also start YaAST from the command line, but this is a bit more complicated.
    In the shell, change to the user root with suc (enter the root password) and execute
    yast2. After you terminate YaAST, then use the command exit to change from the
    root user to the normal user.


    To change the language of YaAST and your entire system, select ‘System’ ➔ ‘Select
    Language’ in the YaAST Control Center. Choose a language, exit the Yaast2 Control
    Center, log out from your computer, then log in again and restart YaST.


    # # YaST Control Center


    When you start YaAST in the graphical mode, the YaAST Control Center, as shown
    in Figure 4.1 on the facing page, opens first. In the left frame, see the categories
    ‘Software’, ‘Hardware’, ‘Network Devices’, ‘Network Services’, ‘Security & Users’,
    ‘System’, and ‘Miscellaneous’. If you click one of icons, the respective contents
    are listed on the right-hand side. For example, if you select ‘Hardware’, then
    click ‘Sound’ to the right, a configuration dialog opens for the sound card. The
    configuration of the individual items usually comprises several steps. Press ‘Next’
    to proceed to the following step.


    The left frame displays a help text for the respective topic, explaining the entries
    required. After the necessary specifications have been made, complete the procedure
    by pressing ‘Finish’ in the last configuration dialog. The configuration is saved.


    # # Software


    # Change Installation Source


    The installation source is the medium containing the software to install. Inall
    from CD or DVD (the usual approach), from a network server, or from'
