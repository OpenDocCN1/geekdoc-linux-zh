  md: 'These guidelines can help develop a partitioning scheme for your system:


    **Under 500 MB:** A swap partition and a root partition ( /).


    **Between 500 MB and 4 GB:** A small boot partition located within the first cylinders
    (/boot, at least 8 MB or 1 cylinder) to hold the kernel and the boot loader. Also
    create a swap partition of approximately 256 MB then you reserve the rest for
    the root partition (/).


    **For more than 4 GB:** Boot (/boot), swap, root (250 MB), home directories (/home)
    with about 200 MB for each user, and the rest for programs and data (/usr). You
    may also reserve one extra partition for each of /opt and var.


    Some commercial programs install their data in /opt. If necessary, create a separate
    partition for /opt or make the root partition large enough. KDE and GNOME are
    also installed in /opt.


    > Tip

    Things should be fine if your partitioning setup is similar to that proposed by
    YaST. This is usually a small partition for /boot at the beginning of the hard
    disk (about 10 MB, or 1 cylinder on a large hard disk), a swap partition (between
    128 and 256 MB), and the rest for /.


    # Partitioning with YaST


    When you select the partitioning item in the suggestion window for the first time,
    YaST displays a dialog listing the partition settings as currently proposed. Accept
    these current settings without change or change them before continuing. Alternatively,
    discard all the settings and start from scratch.


    Nothing in the partitioning setup is changed if you select ''Accept Suggested
    Partitioning Setup''. If you select ''Change Suggested Partitioning Setup'', the
    ''Expert Partner'' allows you to tweak the partition setup in every detail. This
    dialog is explained in Expert Partitioning with YaST on the facing page. The original
    setup as proposed by YaST is offered as a starting point.


    If you select ''Custom partitioning setup'', a dialog, like in Figure 3 on page
    24, opens in which to select a hard disk from on your system. SUSE Linux will
    be installed on the disk selected in this dialog.


    The next step is to determine whether the entire disk should be used (''Use entire
    disk'') or whether to use any existing partitions, if available, for the'
