  md: '# Evolution: An E-Mail and Calendar Program


    Evolution is a groupware suite created by Ximian. It offers regular e-mail features
    along with extended features like task lists and a calendar. Use Evolution to
    make appointments with other users through the calendar features or just to check
    and sort your e-mail. It also provides a complete address book, including the
    ability to send your contact information as a vCard to others.


    +   Starting Evolution . . . . . . . . . . . . . . . . . . . . . . . . . . . 222

    The Evolution Window . . . . . . . . . . . . . . . . . . . . . . . . . . . 223

    Mail . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 225

    Calendar . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 229

    Contacts . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 230

    Using the Address Book in Evolution . . . . . . . . . . . . . . . . . . . 230

    For More Information . . . . . . . . . . . . . . . . . . . . . . . . . . . 231'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# # Starting Evolution


    Evolution is not included in the default SuSE installations. To install Evolution,
    use YaST to install package evolution and all dependent packages automatically
    selected by YaST.


    Evolution is a Gnome application. However, with the required libraries installed,
    it can be used from any window manager. To start Evolution from GNOME, select
    ''Programs'' → ''Applications'' → ''Evolution''. It select ''Next'' → ''Internet''
    → ''Evolution''. It can also be started from the SuSE menu under ''Tools'' → ''Evolution''.
    From a terminal, Evolution can be started with evolution &


    # ## Evolution Setup Assistant


    When started for the first time, Evolution opens a configuration tool to assist
    in initial setup. If it does not open automatically, access it from the Inbox
    view with ''Tools'' → ''Mail Settings...'' then clicking ''Add'' in the ''Accounts''
    tab. Click ''Next'' to use the assistant. Enter your name and e-mail address in
    the appropriate fields. If you have multiple e-mail addresses, use your preferred
    address here. Additional addresses can be configured later. Click ''Next''.


    Select the appropriate incoming mail format for this address from the ''Server
    Type'' drop-down box. ''POP'' is the most common format for downloading from a
    remote server. ''IMAP'' works with mail folders on a special server. Obtain this
    information from your ISP or server administrator. Complete the other relevant
    fields displayed when the server type is selected. Click ''Next'' when finished.


    The next set of information to enter is about mail delivery. This will be used
    for all the e-mail addresses configured. For outgoing mail on the local system,
    select ''Sendmail''. For a remote server, select ''SMTP''. Get the details from
    your ISP or server administrator. For SMTP, complete the other fields displayed
    after selection. Click ''Next'' when finished.


