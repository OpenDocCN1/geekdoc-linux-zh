    To create a link on the desktop to an existing folder or file, open it in Nautilus
    (double-click your home icon then navigate to the correct location). Right-click
    the item to which link and select ‘Make Link’. Drag the link from the Nautilus
    window and drop it onto the desktop.


    # Navigating in Nautilus


    Nautilus navigation is similar to most existing web browsers. To open a new window,
    right-click an empty space on the desktop and select ‘New Window’. The default
    opening location for Nautilus is your home directory. This can be changed.


    The default window layout is shown in Figure 7.2 on the facing page. The toolbar
    has icons for going forward and back, a directory level, stopping, reloading,
    and returning to the home page. The path to the displayed directory or file is
