    # Selected KDE Applications


    KDE offers many applications. Because of limited space, only a few applications
    are described here in detail. The selection in the list that follows by no means
    indicates a comparison of quality.


    # Hard Disk Management


    Both kdf and kwikdisk help mount or unmount data media available on your system
    quickly and easily.

    kwik is an applet, so it can be integrated into the panel. When you rightclick
    the icon, a menu opens with which to mount or unmount the respective data media.
    For a graphical overview, select ''Start KDiskFree''.nkdf and KDiskFree show an
    overview of your data media obtained from the /etc/fstab file, similar to the
    df command. The window includes the medium icon, the type, the size, the mount
    point, the available disk space, percentage of occupied disk space, and a graphical
    representation.'
