  md: '# Keyboard


    In this dialog, make special settings for your keyboard. You can also configure
    the blinking of the cursor here.


    # Keyboard Shortcuts


    It is possible to control a wide range of window manager functions with the keyboard.
    The default setup includes many reasonable keyboard shortcuts. To check the shortcuts
    or modify them to your preferences, use this dialog. Two schemes are available:
    ''Default'' and ''Emacs''. The Emacs scheme can be very convenient for emacs users.
    Either scheme can be modified to your needs. To enter a new shortcut, select the
    one to change. Press the keys to use for this function in the future.


    # Metacity Setup


    This configuration tool only applies if you are using the Metacity window manager.
    This window manager is the default in SuSE Linux. Select a theme from the list.
    It will be used immediately, so you can see how it will look if used. To use a
    font other than that in the ''Font Preferences'' dialog, uncheck the ''Use Default
    Font'' check box and select the desired font. With ''Focus Selector'', set how
    windows are given focus. ''Click'' gives focus only when a window is clicked.
    Both ''Mouse'' and ''Sloppy'' give focus when the mouse loses focus when the cursor
    leaves the window onto a window. Select how many workspaces to use with the ''Workspace
    Selector''.


    # Mouse


    Use the ''Buttons'' tab to configure your mouse for left-handed or right-handed
    use. Also set the ''Double-click Delay''. Under ''Cursor'', configure the display
    of the mouse cursor and optionally set for an animated highlight around the cursor
    when $C_{THH}$ is pressed. ''Motion'' contains settings for mouse acceleration
    and sensitivity and a threshold distance for dragging an item.


    # Network


    If you use a proxy for accessing the web, configure its setup here. This will
    then be applied to all GConf-compliant applications.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Sound


    Under ‘General’, select to enable or disable the sound server on start-up. If
    the sound server is enabled, optionally enable ‘Sounds for events’. Use the list
    under ‘Sound events’ to configure individual sounds for events in compatible applications.


    # Theme


    This selection controls the Gtk+ theme used in compatible applications. The Gtk+
    theme selects the controls used in applications, including buttons, check boxes,
    and radio buttons. The titlebar and window borders are controlled by the window
    manager theme, set with the appropriate window manager configuration tool.


    # Toolbars & Menus


    Use this to control the appearance and functioning of toolbars and menus. Select
    how text and icons are used in the toolbars, whether or not toolbars can be moved,
    and if menu items can have icons.


    # Panels


    GNOME panels are easy to configure, add, and remove. A panel can be used to provide
    menus, applets, and launchers. Applets are small applications providing useful
    functionalities. Launchers are icons used to start a program. Drawers are like
    a subpanel that can contain other panel objects. To access panel controls, right-click
    an existing panel in an empty space to open the panel menu. If you right-click
    an existing launcher or applet, only the menu for that item is opened.


    # Configuring Panels


    If available, use ‘Properties’ from the panel menu to make panel-specific settings.
    The settings available vary based on the panel type. The ‘Hiding’ settings are
    available which removes the panel from view when it is not being used. The panel
    is retrieved when the mouse moves to the panel location. Hide buttons enable the
    user to collapse and expand the panel as desired. The ‘Background’ tab has settings
    for the background color or image of the panel'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Creating a Panel


    GNOME offers five types of panels menu, edge, corner, sliding, and float-ing.
    The menu panel is the panel at the top of the screen with the menu and clock in.
    Edge panels are full-length panels placed along one of the edges of the screen.
    Corner panels are short panels that can be positioned in the ends or middle of
    an edge. Sliding panels are short panels that can be mid-clicked and dragged to
    the desired position along any edge. Floating panels can be mid-clicked and dragged
    anywhere on the screen.


    To create a new panel, right-click an existing panel and select ‘Create Panel’.
    Select the desired panel type. Right-click the new panel to configure it or add
    items. Mid-click and drag to move it.


    # Adding Items


    Add something to a panel, right-click an empty space and select ‘Add to Panel’.
    Available applets are listed by category in the submenus. Launch-ers can be added
    manually or from the menu. Select the item to add. If you select ‘Launcher’, a
    dialog opens. Enter a specific and generic name for the item. Also enter a comment
    if desired. For ‘Command’, enter the command used to start the program, such as
    xchat. If the application should be run in a terminal, select the ‘Run in Terminal’
    check box. Click ‘No Icon’ to select an icon for the application. Things under
    ‘Advanced’ are not required.


    # Rearranging Panel Items


    Things like applets, launchers, and drawers can be rearranged. Just drag items
    into place or right-click the item and select ‘Move’. Items can be dragged from
    one panel to another. Remove items by right-clicking and se-lecting ‘Remove from
    Panel’.


    # Removing Panels


    To remove a panel, right-click and select ‘Delete this panel...’. When a panel
    is deleted, all items in the panel and all configuration settings are lost. If
    you want items in the panel to be available in a different panel, move them to
    another panel before deleting the panel.


    # Nautilus


    Nautilus is the GNOME2 file manager and viewer. It also supplies the icons on
    the desktop. For GNOME2, Nautilus has undergone extensive changes'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'and select drastically improved its speed. If you have tried Nautilus before
    and disliked it, you may want to give it another chance provided here is just
    a brief overview of the basic functionality of Nautilus. Refer to the internal
    help for more information.


    # Controlling Your Desktop


    The default configuration provides several useful icons on the desktop. Double-click
    the desktop icon to start the application or open the folder in Nautilus. To make
    changes to the icon, such as rename it, right-click the icon and select the appropriate
    option from the menu. Use ‘Properties’ to select a different icon or make other
    changes. ‘Rename’ can be used to simply rename an icon. To delete the icon that
    launches a program, just throw it into the trash. Use caution doing the same with
    icons representing folders or data. If the icon is a folder or file, the actual
    data is deleted. If the icon is a link to a directory or file, only the link will
    be deleted.


    If you right-click an empty space on the desktop, a menu of options opens. To
