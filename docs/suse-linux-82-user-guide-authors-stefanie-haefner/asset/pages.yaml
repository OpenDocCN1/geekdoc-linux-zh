    # Troubleshooting


    If there is some kind of error in the communication between the computer and the
    printer, the printer may no longer be able to interpret data correctly. This can
    cause the output to be garbled and use large amounts of paper.


    +   1. To stop printing, take out all paper or open the printer trays.

    2. As the print job will be removed from the printer queue only after hav-been
    sent completely to the printer, it will usually be there. Even a reboot will not
    remove it. To delete the print job, use a tool like kprinter. Instructions for
    managing print jobs from the command line are provided in the Administration Guide.

    3. It is possible that some data is still transmitted to the printer even though
    the printer job has been deleted from the queue. To stop all pro-cess still using
    the printer device, use the fuser command. For a printer connected to the first
    parallel port, enter:


    ```

    earth:~ # fuser -k /dev/lp0

    ```


    To achieve the same for a USB printer, enter:


    ```

    earth:~ # fuser -k /dev/usb/lp0

    ```


    +   4. Do a complete reset of the printer by switching it off. Wait a few sec-onds
    before putting the paper back into the trays and switching the device back on.
    The printer should be ready to accept new jobs.


    # More Information


    Details about the Linux printing systems are provided in the Chapter Printer Operation
    in the Administration Guide, which should already be installed on your system.
    To read the manual, start SuSE Help then click Administra-tion Guide. The PDF
