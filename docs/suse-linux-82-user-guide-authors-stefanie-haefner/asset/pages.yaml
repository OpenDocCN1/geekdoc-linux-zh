- img_proc: true
  md: '# Burning CDs


    The detected writer is displayed under ''Device'' in the burning dialog. Set the
    burning speed in ''Burning Speed''.


    The following options are offered here:


    +   - ''Simulate writing'' — This function can be used to check if your system
    is able to keep pace with the requirements of the current writing speed. The writing
    is performed with the laser activated to deactivate the system.


    +   - ''Writing on the fly'' — Burns the desired data without first creating an
    image file. Do not use this function if the system performance of your computer
    is limited.


    > An image file — also known as ISO image is a file containing the entire CD contents
    that is subsequently written to the CD exactly as it contains.


    +   - ''Only create image'' — Creates only one image file. Write it to a CD later.
    For this purpose, use ''Tools'' → Write Iso Image''.


    +   - ''Delete at once'' — Delete the image file after the CD is written.


    +   - ''Disc at once'' — The CD is burned without interruption. This is recommended
    for audio CDs (see below).


    +   - Use BURN-PROOF — If your writer supports this function, activate it to prevent
    interruption of the data flow. The button is deactivated if this function is not
    supported.


    Under the ''Settings'' tab, enter information about the CD, such as a name. This
    is optional.


    ''Multisession'' displays several options required for writing CDs with multiple
    data or audio tracks.


    The ''Advanced'' tab is used for the file name Joliet entries. To achieve a high
    level of compatibility, make sure ''Generate Joliet entries'' is marked.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_283_0.png)


    # # Creating an Audio CD


    Basically, there are no significant differences between creating an audio CD and
    creating a data CD. Select ''File'' -> ''New Audio Project''. Copy the individual
    audio tracks to the project folder with drag and drop. The audio data must be
    in MP3, WAV, or Ogg Vorbis format.


    Set the sequence of the tracks in the project folder by shifting them with drag
    and drop.


    The dialog for burning an audio CD is not very different from the dialog for burning
    a data CD. However, the option ''DiscAtOnce'' and the ''TrackAtOnce'' mode bear
    greater importance. The ''TrackAtOnce'' mode inserts a silent break of two seconds
    after each track.


    # # Copying a CD


    Select ''Copy CD'' from the toolbar. In the following dialog, specify settings
    for the reading and writing device (Figure 17.3 on the facing page). The options
    introduced above are also available here. An additional function allows you to
    create several copies of the CD.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_284_0.png)


    Figure 17.3: The CD Copying Dialog of K3b


    # # For More Information


    Apart from the two main functions described above, K3b offers other functions
    that are not described here. This includes the creation of DVD copies, reading
    audio data in WAV format, rewriting CDs, or the integrated audio player. A detailed
    description of all available program features is available at http://k3b.sourceforge.net.'
