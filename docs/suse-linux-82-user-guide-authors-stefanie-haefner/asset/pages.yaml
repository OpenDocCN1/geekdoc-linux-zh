  md: '# Welcome


    SuSE Linux is an easy-to-install Linux distribution. In the past few releases,
    the installation and configuration tool YoST has undergone serious development.
    Install with just a few clicks or choose to customize aspects of the installation
    to your specific needs. Both the quick install method and the customized method
    are explained in this manual. Also find information to help new Linux users get
    started.


    Configuration is also easy with YoST. Aspects of configuration, such as hardware
    administration and Internet access, are the topic of the second part of the manual.
    It also discusses configuration of the desktop environments KDE and GNOME.


    SuSE Linux includes a range of applications. Some of these are introduced in the
    third section. OpenOffice.org, which has replaced StarOffice as the standard office
    package in the distribution, is described extensively. Multimedia and graphics
    applications, such as those used for scanning and modifying images and playing
    sound files, are also introduced. Chapters discussing web browsers and e-mail
    programs can help you choose your ideal tools for the Internet.


    SuSE also addresses your needs for more information and support in the final section.
    Find information about installation support and online help. Also get answers
    to frequently asked questions and, in the glossary, definitions of important terms.'
  merge: -1
  pgno: 18
