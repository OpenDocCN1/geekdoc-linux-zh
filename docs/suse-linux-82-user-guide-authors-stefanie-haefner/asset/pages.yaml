  md: '# Configuring KMail


    Mail folder is added to your home directory when running KMail for the first time.
    This folder contains the initial mail directories (inbox, outbox, sent, and trash).
    Use ‘Settings’ → ‘Configure KMail...’ to enter the information needed for KMail
    to send and receive your messages.


    # Defining Your User Identity


    The settings in ‘Identity’ are organized into three tabs — ‘General’, ‘Advanced’,
    and ‘Signature’. To create a new identity profile, select ‘New...’ and enter a
    name for the profile in the dialog that


    Clicking ‘OK’ opens a new dialog box in which to set a few more options. Name,
    organization, and e-mail address can be entered and modified in the ‘General’
    tab. The ‘Advanced’ tab is provided for entering an OpenPGP key, a possible BCC
    or reply-to address, and the location for e-mail storage. ‘Signature’ allows the
    definition of a signature footer to every message. This still requires the switching
    ‘activate signature’. Choose the signature should be read from a file, taken from
    the input box, or inserted from some application output.


    Confirm your profile settings with ‘OK’. Select one of defined identities when
    writing an e-mail. This allows the handling of more than one e-mail address.


    # Setting up Network Connections


    The settings in the ‘Network’ icon tell KMail how to receive and send e-mails.
    There are two tabs, one for sending and for receiving messages.

    Many of these vary depending on the system and network where your mail server
    is located. If you are unsure about the settings or items to select, consult your
    Internet provider or system administrator.


    Sending Create outgoing mail boxes under the ‘Send’ tab. ‘Add’ gives the choice
    of either SMTP or sendmail. For most purposes, select SMTP here. After making
    this selection, a window appears in which to enter SMTP server data, as ‘Name’,
    ‘Server’, and, if needed, the required authorization. A preprocessing command
    that is run before the sending of each message can be entered in the corresponding
    field.


    Security settings are under the ‘Security’ tab. Specify your preferred encryption
    method here. If uncertain about which to choose, click ‘Test'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'server capacity''. The corresponding settings are then tested and applied.


    Everything regarding receiving e-mails can be found under the ''Receiving'' tab.
    Under ''Add'' select the desired format: local (Mbox format), POP3, IMAP, or local
    (mailird format). POP3 is usually used when accessing remote servers.


    After making your selection, a window appears in which to enter the POP3 server
    data. Give it a unique name. Enter the values provided by your Internet Service
    Provider or your system administrator in the corresponding fields. The fields
    that need to be filled out are here ''User'', ''Server'', and ''Password''.


    The ''Extras'' tab offers several methods of encryption and authorization. If
    you are uncertain about which options your server provides, try ''Test server
    capacities''.


    # Changing the Appearance of KMail


    ''Appearance'' adjusts KMail to your preferences. Use ''Fonts'' to configure the
    fonts for the various displays, like the message text, first-level quoted text,
    and so on. Activate ''Use custom fonts'' before configuring it.


    To customize the colors, activate ''Use custom colors'' in the ''Colors'' tab.
    Double-clicking an entry opens a dialog box with a color picker.


    The ''Layout'' tab offers options for splitting the KMail window and for displaying
    a MIME tree. A MIME tree shows all the attachments to a message. It also has options
    for general settings, like customizing the date display and message grouping.


    ''Profiles'' is responsible for the administration of default appearance presets.
    Some standard profiles are provided already, like for users who prefer high contrast
    or for purists.


    # Caution


    Selecting a profile overwrites the current layout settings.'
  merge: -1
