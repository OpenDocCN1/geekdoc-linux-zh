  md: '# KMail — The KDE Mail Application


    KMail is the KDE mail application. In addition to the usual features, like sending
    and receiving e-mail and multiple mail protocols, it offers several custom-definable
    filters for sorting e-mails into individual folders. This is useful for separating
    important business correspondence from less important e-mails from mailing lists,
    for example. Mails can be either read at leisure or briefly skimmed over and safely
    deleted.


    +   Configuring KMail . . . . . . . . . . . . . . . . . . . . . . . . 208

