  md: '# # Migrating to Linux


    This chapter is intended mainly for people coming from other operating systems
    who are about to use Linux for the first time. The text is organized as a list
    of questions and answers to talk about the most important doubts and issues arising
    when first using Linux.


    At the end of this manual, find a glossary explaining important concepts and a
    list of frequently asked questions about SuSE Linux. Both of them are a good complement
    to the present chapter.


    The answers are based on a standard installation of SuSE Linux. If you have already
    customized your system, the answers still apply, but take into account the changed
    settings.


    +   Important Requirements . . . . . . . . . . . . . . . . . . . . . 2

    Working with Linux . . . . . . . . . . . . . . . . . . . . . . 2

    Files, Folders, and Directories . . . . . . . . . . . . . . . . . . 4

    Passwords, Users, and root . . . . . . . . . . . . . . . . . . . . . . 5

    Mounting, Shell, and Other Topics . . . . . . . . . . . . . . . . . 7'
