    # Sysconfig Editor


    The directory /etc/sysconfig contains the files with the most important settings
    for SuSE Linux (formerly centrally administered in the file /etc/rc.config). The
    sysconfig editor displays all settings in a transparent form. The values can be
    modified and saved to the individual configuration files. Generally, manual editing
    is not necessary, because the files are automatically adapted when a package is
    installed or a service is configured.


    > > Caution: Do not edit the files in /etc/sysconfig if you do not know exactly
    what you are doing, as this could be very detrimental to the operability of your
    system.


    More information is provided in the Administration Guide under The Boot Concept.


    # Time Zone Selection


    The time zone was already set during the installation, but you can make changes
    here. Click your country or region in the list and select ''Local time'' or ''GMT''
    (Greenwich Mean Time). ''GMT'' is often used in Linux systems. Machines with additional
    operating systems, such as Microsoft Windows, mostly use the local time.


    # Language Selection


    Here, select the language for your Linux system. The language can be changed at
    any time. The language selected in YaST applies to the entire system, including
    YaST and the desktop environment KDE 3.'
