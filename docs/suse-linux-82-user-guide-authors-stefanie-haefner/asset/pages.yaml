    ''File'' → ''AutoPilot'' → ''Document Converter...''. Choose the file format to
    convert. Various StarOffice and Microsoft Office formats are available for selection.
    Then click ''Next'' and specify where OpenOffice.org should look for documents
    to convert and in which directory the converted files should be placed. Also review
    the other settings on this page.


    > Note

    Documents from a Windows partition are usually in a subdirectory of /windows/


    Click ''Next'' to proceed to a summary. Here, check your entries again. Click
    ''Convert'' to start the conversion procedure.


    # Making and Changing Settings


    All global settings can be accessed under ''Tools'' → ''Options''. A window as
    shown in Figure 9.2. The left side shows the various settings arranged in a tree
    structure.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_188_0.png)


