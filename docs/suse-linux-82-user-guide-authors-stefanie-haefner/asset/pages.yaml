- img_proc: true
  md: '> > Caution

    > If you delete Windows, all data will be lost beyond recovery as soon as the
    formatting starts.


    # Caution


    To shrink the Windows partition, interrupt the installation for now and boot into
    Windows first to prepare the partition from there. Although this step is not strictly
    required, it speeds up the resizing process and also makes it safer.

    In Windows, first run scandisk to make sure the FAT partition is free of lost
    file fragments and crosslinks, which are not that uncommon under Windows. After
    that, run defrag to move files to the beginning of the partition. This will make
    the resizing faster.


    > > Note

    > If you have optimized virtual memory settings for Windows in such a way that
    a contiguous swap file is used with the same initial (minimum) and maximum size
    limit, consider another step. With these Windows settings, the resizing might
    have the effect that the swap file is split into many small parts scattered over
    the FAT partition. Also, the entire swap file would need to be moved during the
    resizing, which makes the process rather slow. It is therefore useful to unset
    these Windows optimizations for the time being and reenable after the resizing
    has been completed.


    # Note


    When you have performed these preparations and arrive at the Linux partitioning
    setup again, select ''Shrink Windows Partition''. After a quick check of the partition,
    YoST opens a new dialog with a suggestion for the resizing of the Windows partition.

    The first bar graph shows how much disk space is currently occupied by Windows
    and how much space is still available. The second bar graph shows how the space
    would be distributed after the resizing, according to YoST''s current proposal
    (Figure 3.10 on the next page). Accept the proposed settings or use the slider
    to change the partition sizing (within certain limits).

    When you leave this dialog by selecting ''Next'', the settings are stored and
    you are returned to the previous dialog. The resizing takes place — shortly before
    the disk formatting.'
  merge: -1
