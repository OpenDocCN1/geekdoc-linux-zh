    If you cannot hear anything, increase the volume. Press ‘Continue’ to com-\plete
    the sound configuration. The volume will be saved.


    # Sound Configuration


    Use ‘Delete’ to remove a sound card. Existing entries of configured sound

    cards are deactivated in the file /etc/modules.conf. Click ‘Options’ to

    en a dialog in which to customize the sound module manually. In

    ‘Volume’, configure the individual settings for the input and output of each

    sound card. ‘Next’ saves the new values and ‘Back’ resets to the default-

    figuration. Under ‘Add Sound Card...’, configure additional sound cards. If

    Syst does not detect a sound card, you are directed to ‘Configure a Sound Card’

    ‘Manual Sound

    Card Selection’ automatically.


    If you use a Creative Soundblaster Live or AWE sound card, automatically

    copy SF2 sound fonts to your hard disk from the original Soundblaster driver

    CD-ROM with ‘Install Sound Fonts’. The sound fonts will be saved in the

    directory /usr/share/sfbank/creative/.


    The start-up of ALSA when booting the machine can be enabled or disabled

    with ‘Start ALSA’. For playback of MIDI files, activate ‘Start Sequencer’. This

    way, the sound modules required for sequencer support will be loaded along

