    # Configuration with YaST2


    To set up a printer, go to the ''Hardware'' item in the YaST Control Center then
    select ''Printer''. This will open the printer configuration window in which the
    detected devices are listed in the upper part. The lower part lists any queues
    that have been configured so far. If your printer was not detected, restart the
    autodetection. If it fails again, select ''Configure'' to configure the printer
    manually. Not every printer can be configured for both printing systems. Certain
    configurations are only supported by either CUPS or LPRng and lfilter. YaST will
    inform you about this whenever necessary.


    # Note


    > In SuSE Linux, the default printing system is CUPS, but you can switch from
    CUPS → LPRng and back at any time. To do so, select ''Change'' → ''Advanced''
    in the YaST printer configuration module. Then select either printing system and
    configure it.


    # Automatic Configuration


    YaST configures the printer automatically if these requirements are met:


    +   1. The parallel or USB port can be set up automatically in the correct way
    and the connected printer can be autodetected.


    +   2. The ID string of the printer, as supplied to YaST during hardware autodetection,
    is included in the printer database. As this ID may differ from the actual name
    of the model, you may need to select the model manually.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'To make sure everything works properly, each configuration should be checked
    with the print test function of YaST. The YaST test page also provides important
    information about the configuration selected.


    # Manual Configuration


    If one of the requirements for automatic configuration is not met or if you want
    a custom setup, configure the printer manually.


    Depending on how successful the autodetection is and how much information about
    the printer model is found in the database, YaST may be able to determine the
    right settings automatically or at least make a reasonable selection.


    The following parameters must be configured:


    Hardware Connection (Port) The configuration of the hardware connection depends
    on whether YaST has been able to find the printer during autodetection.


    +   - If YaST is able to detect the printer model automatically, it can be assumed
    that the printer connection works on the hardware level and no settings need to
    be changed in this respect.

    - If YaST is unable to autodetect the printer model, there may be some problem
    on the hardware level and some manual intervention is required to configure the
    connection. To learn about the steps involved in this, refer to the Administration
    Guide.


    Name of the Queue The queue name is used when issuing print commands. The name
    should be relatively short and consist of lowercase letters and possibly numbers
    only.


    Ghostscript Driver or Printer Language (Printer Model) The Ghostscript driver
    and the printer language depend on your printer model. YaST lets you select a
    predefined configuration suitable for your model. Selecting a manufacturer and
    a model basically means selecting a printer language and a Ghostscript driver
    suitable for this language with some default settings for the driver. These settings
    may then be changed in an additional dialog as needed.


    For-PostScript models, all printer-specific data is produced by the Ghostscript
    driver. The driver configuration — both choosing the right driver and the correct
    options for it — is the single most important factor determining the output quality.
    The settings made at this point affect the printout on a queue-by-queue basis.'
  merge: -1
  pgno: 79
