    Unless otherwise specified, applications can be started from the ‘SuSE Menus’
    under ‘Multimedia’ → ‘Sound’.


    # Mixers


    Mixers are a convenient way of controlling the volume and balance of the computer’s
    sound output and input. The main differences in the various mixers are the interfaces.
    Select one that meets your needs with which you are comfortable working. Other
    mixers are available. Most programs in the ‘Multimedia’ ▶ ‘Sound’ menu with ‘mix’
    in the name are mixer applications.


    > Tip

    Generally, it is advisable to open a mixer application prior to opening sound
    applications. Use the mixer to test and adjust the control settings for the input
    and output of the sound card. Some sound cards may not allow simultaneous access
    from multiple applications. If a sound application freezes, this may be the cause.


