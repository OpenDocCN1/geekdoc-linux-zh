  md: 'File Close the Control Center with ‘Quit’


    ’View’ Select the appearance of the Control Center. In ‘Mode’, decide whether
    to work with a structured ‘Tree View’ or with a simple ‘Icon View’. The ‘Icon
    Size’ of the latter can then be specified.


    ’Help’ In this menu entry, view the help pages of the Control Center via ‘Contents’
    or use ‘What is this?’ to obtain information about a symbol or input field selected
    with the mouse. Additionally, you can write a ‘Bug Reporting …’ to the program
    author. Additional information about KDE and the Control Center is available under
    the respective entries.


    If you are unsure what a particular setting does, consult the tool tips by pressing
    Shift+F1 then clicking the element in question. This opens a corresponding help
    text.


    # Peripheral Devices


    Digital Cameras This module allows configuration of the support for digital cameras.
