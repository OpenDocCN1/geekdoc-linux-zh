    Others prefer moving their complete forearm.


    +   - An alternative to the mouse is a tracksuit. Here, you move a ball inside
    a casing to control the mouse pointer. In contrast to the mouse, the trackball
    reduces the movements in the hand and arm area.


    # Links and Literature


