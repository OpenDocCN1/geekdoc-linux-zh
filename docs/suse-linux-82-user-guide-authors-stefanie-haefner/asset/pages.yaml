  md: '# Important Requirements


    +   - How much hard disk space do I need? What will happen to my Windows?

    Naturally, a Linux installation requires an amount of hard disk space. About 1.5
    GB of free space is required for a standard installation. 400 MB may be sufficient
    for a minimum system. SuSE Linux can be installed as the only operating system
    on the computer. However, it can also share the hard disks with other operating
    systems. In this case, it needs at least one free partition.


    If you have installed Windows and there are several partitions (drive C: and other
    hard disk drives), theoretically you can install SuSE Linux on one of the additional
    partitions. If the partition in which to install Linux contains data, first save
    it to another partition.


    If your previous system consisted of a single partition that occupies the entire
    hard disk, SuSE Linux can easily and easily resize it, provided it is a “FAT”
    file system (FAT or FAT32), which is the case with Windows 95, 98, and ME. If
    your Windows (NT, 2000, or XP) uses a partition with an NTFS file system, this
    partition cannot be resized by SuSE.


    If Windows XP was preinstalled using the NTFS file system, but you have the installation
    CDs, you can reinstall Windows XP and select “FAT32” as file system for XP. This
    causes the hard disk to be formatted with the FAT file system, which can easily
    be resized during the Linux installation.


    > Note

    A FAT32 partition must be smaller than 32 GB.


    Instructions for partitioning hard disks and resizing your Windows system are
    provided in Resizing a Windows Partition on page 27.


    # Working with Linux


    +   - Are programs for Linux that I can use to read my old files created under
    Windows?


    For the most part, you can continue to use your old files under Linux. Standard
    programs, such as OpenOffice.org and The GIMP, can handle most of the file formats
    you have used so far, whether they are documents, pictures or other graphics,
    or video or audio data. SuSE Linux'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'comes with a suitable application for all of these and lets you work with

    your old files without difficulty.


    +   - Where can I get applications for Linux?

    SuSE Linux comes with the programs and applications for daily

    work. Just click the SuSE menu at the bottom left of your KDE desktop then

    find out about them. Many programs are available.


    +   - Why can''t I simply switch off my computer?

    You should not simply switch a computer off. It is important to shut

    downown properly. Shutting the computer down properly avoids data losses.

    Simply switching a running system off is like a knock-out. A second user

    may using your computer by way of a network connection. If you simply

    switch the system off, you will also endanger the other user has

    not yet saved. The same also applies to your data. However, if you log out

    and shut down properly, you can be sure that all data is saved.


    +   - How do I format a floppy disk for Linux?

    The easiest way to do this is with the KDE floppy formatter. To start this

    tool, click the SuSE menu at the bottom left of your desktop then select

    ‘System’→‘Tools’→‘Floppy’. Choose between FAT format (used for

    DOS and Windows) and Linux''s own ext2 file system. You could

    use mtools. More information is available in mtools on page 310.


    +   - Where can I find a description of the included software and how can I get
    help

    for the many programs help button come with SuSE Linux?

    Click the SuSE help button. A window opens on your desktop from which

    access the SuSE Help System and find answers to all your questions.


    +   - What is a virtual desktop?

    You may run into a situation where you have to have so many windows

    open that things get a little disorganized. Under Linux, this problem can

    easily be avoided: Look at the panel to find the numbered icons of

    available virtual desktops, which represent different spaces you can

    open and arrange windows.


    Then switch between virtual desktops at any moment to access the

    windows.


    +   - Where is the file manager?

    Try Konqueror, which is not a file manager, but also a web browser,

    viewer application, and more. Konqueror is the KDE program of choice

    for anything related to file management.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Files, Folders, and Directories


    +   - What happened to drive C?:

    Drives are storage media, such as a floppy disk, a CD-ROM, or a hard disk. You
    have probably come to know these under the names A:, C:, D:; and so on. Unlike
    Windows, however, Linux incorporates all drives directly into the system''s directory
    structure. The result is that drives are not accessed using names like C; but
    using folders (names of storage areas) to tell the user where data is located.


    +   - What is root?

    The root directory is identified by a slash (''/''). The Linux file system normally
    holds a directory tree that starts at a / and is subdivided into many branches.
    These subdirectories have names like home, (a subdirectory for personal files
    of users) or bin (which contains binary files — mostly programs). The place where
    the entire directory originates is called the "root directory". From this point,
    access all the subdirectories. Theoretically, it would be possible to call the
    root directory by a name, but it is historically known as /. Each directory or
    folder will also have a slash in front of it. Each such folder could, in turn,
    be used as the root of another, separate file system.


    +   - Where are things located in the file system?

    Linux has a number of standard directories. The most important of them are explained
    below. For a more complete overview, see Figure 21.1 on page 303.


    /home


    This is where the home directories of individual users are located. Your home
    directory contains all your data, personal configuration files, and anything else
    to which you should have access. The majority of this data is readable for other
    users but can only be changed by the owner. This default setting can be changed
    at any time. To learn more about this, read File System Permissions on page 311.


    /root


    The home directory of the administrator root.


    /usr (Unix System Resources)


    Many programs are stored under this directory together with help files, documentation,
    and other important data.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# /bin and /sbin (executable files)


    These directories hold many programs closely related to the operating system itself,
    which are needed early in the boot procedure.


    # /opt (optional software)


    Commercial software and very big packages not forming part of the system itself
    go into this directory. This includes things like KDE, Netscape, Mozilla, and
    some others.


    # /etc (configuration directory)


    Files related to the system configuration are stored in this folder. This includes
    things like the setup information for your Internet access, the boot configuration,
    and the configuration of individual programs, such as backup routines.


    # /boot (directory for system boot files)


    This is the place where any files and programs needed for booting are stored,
    such as the Linux kernel.


    Others


    In addition to that, there are other folders containing information about the
    system and the devices connected to: /lib and /usr/lib (libraries), /var (variable
    data), /proc (processes), /media (removable storage media like the floppy and
    CD-ROM), /dev (all connected devices, such as printers, hard disks, and the keyboard).
    More information is available in Files and Directories on page 303.


    # Passwords, Users, and root


    +   - Why do I need a password?


    The password is the key to your home directory. Unlike other operating systems,
    Linux is a true multiuser system: files and settings of different users are managed
    while keeping them separate and those different users can access the system at
    the same time. If you imagine your machine had two keyboards and two screens,
    you could use it alongside another user without getting in each other''s way.


    Linux distributes system resources between active users in an intelligent way,
    so if that other keyboard and screen were located in another room (because they
    are connected to the system through a network), you probably would not even notice
    that there is another user at work.


    Each user has a private directory — the home directory. The home directory is
    used for all personal data as well as for personal configuration settings'
  merge: -1
  pgno: 26
