- img_proc: true
  md: 'The developers'' goal was to make paperless information management possible
    for computer users. Electronic documents of a visionary paperless office theoretically
    have several advantages. These range from easy e-mail sending to space-saving
    archiving of larger amounts of data.


    Viewed globally, the PDF format is only one of the many possible core image formats
    for text. Acrobat Reader is a viewer for this format. The program and the file
    format have several useful features. Figure 10.1 shows the displaying the help
    document.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_205_0.png)


    Figure 10.1: Adobe Acrobat Reader


    The PDF format has been highly optimized for its intended use and portable documents.
    Acrobat Reader takes full advantage of all PDF features. It is available for Macintosh
    and Windows as well as Unix and Linux. This provides users with a standard interface
    to go with their standard documents, giving standardized viewing and printing.
    Acrobat Reader can be integrated in Netscape for the benefit of a plug-in (a special
    program that performs services for another program). When you click a PDF file
    on the web,'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Acrobat Reader is started automatically and opens the selected document is
    displayed.


    PDF documents can contain links and bookmarks pointing to other parts of a document
    or to other documents. These are displayed in a separate window to the left of
    the text when the ‘Bookmarks’ tab is active. They are also shown in the text.
    Clicking a link immediately opens the appropriate page. PDF files can also contain
    preview images, often called thumbnails. These miniature images, which represent
    one entire page, are also displayed in the left window. Thumbnails provide a quick
    overview of the document and can be used to locate specific sections or passages.


    # Note


    With Acrobat Reader, PDF documents cannot be created, only viewed. Unfortunately,
    Adobe provides Acrobat (the full text processing application) for Windows and
    Macintosh. In SuSE Linux, you can use various programs to create your PDF documents.
    For example, ps2pdf is a widely-used utility for generating PDF files from PostScript.


    # Note


    # Opening a PDF File


    Start Acrobat Reader with ‘SuSE Menu’ → ‘Office’ → ‘Viewer’ → ‘Acrobat Reader’.
    Alternatively, start Acrobat Reader with a terminal with acrooread. Open a file
    in Acrobat Reader with ‘File’ → ‘Open’, [Ctrl+O], or of the respective icon.


    If you click any file with the .pdf extension in the KDE file manager and have
    the basic SuSE Linux system, the file is opened in KGhostView instead of Acrobat
    Reader. Because PDF files are based on the Postscript, KGhostView can display
    and print them. However, KGview lacks the link and search functionality of Acrobat
    Reader. Manually configure KDE to be done with the ‘File Associations’ dialog,
    shown in Figure 10.1 on the preceding page, accessed from ‘Settings’ → ‘Configure
    Konqueror’. In the tree, for the extension pdf under ‘application’. In Application
    Preference Order’, move ‘Acrobat Reader’ to the top. Following a restart of the
    file manager, PDF files should automatically be opened with Acrobat Reader.


    SuSE Linux – User Guide'
  merge: -1
  pgno: 206
