  md: '# # Step One: The Start Screen


    Turn on your computer and all connected hardware components and immediately insert
    CD 1 or boot the DVD in the respective drive. In the start screen, select an installation
    mode or boot an installed operating system. Following the successful installation,
    the CD only needs to be inserted in the drive occasionally to install additional
    software. As the CD can be forgotten in the drive, the option to boot the installed
    system is preselected. For installation, use the arrow keys to select ''Installation''.
    If your computer does not boot from CD 1 or the DVD, read


    Boot Screen on page 15.


    # # Step Two: Accept Suggestions


    Then SuSE system assistant starts. First, select the language for your system.
    The language setting is automatically adopted for the keyboard layout. Then YoST
    checks your system. If you already installed a SuSE Linux version on your computer,
    the next dialog asks whether to install SuSE Linux from scratch or perform an
    update of your previous system.


    If Linux was not installed on your computer previously or if you select ''New
    installation'', YoST checks all your hardware and list the result in the ''suggestion
    dialog,'' shown in Figure 2.1 on the facing page. This dialog also displays the
    partitioning suggestion Linux for the first time, (possibly Windows will be resized)
    and the selected installation type. If installing Linux for the first time, you
    should accept these suggestions, which are usually suitable. The following messages
    and suggestions are displayed after the system check:


    **Mode** ''New installation'' is the default value here.


    **Keyboard** The keyboard layout defaults to the selected language. This can easily
    be changed.


    **Mouse** The detected mouse type suggests a partitioning. If Windows 9x or ME
    (FAT32 file system) exists on the hard disk, the resizing rate is indicated.


    **Software** A default system with office applications is preset.


    **Booting** Determines where SuSE Linux installs the boot manager. The Master
    Boot Record (MBR) of the first hard disk is the default setting.'
  merge: -1
