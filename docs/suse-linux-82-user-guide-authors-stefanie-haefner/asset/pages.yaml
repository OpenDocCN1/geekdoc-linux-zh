  md: '# IDE DMA Mode


    This module enables you to activate and deactivate the DMA mode for your IDE hard
    disks and your IDE CD/DVD drives in the installed system. This module does not
    have any function for SCSI devices. DMA modes can substantially increase the performance
    and data transfer speed in your system. During the installation, the current SuSE
    Linux kernel automatically activates DMA for hard disks but not for CD drives,
    because default DMA activation caused problems with CD drives. The DMA module
    to decide whether to activate DMA for your drives. If the drive supports the DMA
    mode smoothly, the data transfer rate of your CD drive can be increased by activating
    DMA.


    > Note

    > DMA (Direct Memory Access) means that your data can be transferred to the RAM,
    bypassing the processor control.


