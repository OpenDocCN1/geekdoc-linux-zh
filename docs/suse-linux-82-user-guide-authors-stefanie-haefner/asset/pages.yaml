- img_proc: true
  md: 'only recommended for expert users. The None option completely activates the
    recording of messages. It only play the welcome message then hangs up.


    ‘PIN’ Enter a personal identification number (PIN) for remote access. A numerical
    code of arbitrary length can be entered here. If it is entered during playback
    of the welcome message, the user is taken to the remote access menu. The remote
    access feature is disabled if the field is left empty.


    ‘OK’ accepts the changes. ‘Cancel’ closes the dialog box without applying any
    changes.


    # Usage


    # General Notes about Reception


    The development of CAPISuite heavily relied on using already existing capabilities
    of Linux. This is why the delivery of incoming faxes and voice messages is handled
    by the internal Linux mail system instead of proprietary applications and protocols.


    This requires the configuration of a mail client for receiving local messages
    for each user of CAPISuite. For details, read the respective chapters about the
    mail program or the documentation provided with the application.


    # Fax Operation


    No further instructions are necessary here for the reception of faxes. As soon
    as a fax is received for a number assigned to a user, the document is stored in
    the system and delivered to the user as an e-mail with a PDF attachment. PDF is
    a common exchange format for documents and can be read by any operating system
    with the Adobe Acrobat Reader. The user can then open, and print the document
    as needed.


    Each received document is also stored on the hard disk in /var/spool/capisuite/users/<username>/received/.
    This directory is accessed if anything goes wrong during delivery of an e-mail
    was accidentally deleted. More information can be found in the CAPISuite documentation
    at /usr/share/doc/packages/capisuite/manual/index.html.'
