    image appears at the cursor position. Activate the image (shown by the eight squares
    surrounding the image). Now, select ''Graphics...'' in the context menu. The dialog
    offers various settings, such as wrapping and borders.


    To modify the size of the image, click it to activate it. Click one of the ''handles'',
    keep it pressed, and drag in the desired direction. A dashed frame shows the new
    dimensions. Release to scale the image.


    To change the position of the image instead of its size, click the image and keep
    the mouse button pressed. Move the image to the desired position. Release the
    mouse button.


    # Spreadsheets with Calc


    Calc is the spreadsheet application in OpenOffice.org. Use this program for your
    private accounts or business calculations. Calc can be started from Writer by
    clicking ''File'' → ''New'' → ''Spreadsheet''.


    At start-up, Calc presents an empty spreadsheet divided into rows and columns.
    The rows are numbered from top to bottom and the columns are lettered from left
    to right. ''Cells'' are located at the intersection of a row and a column. Each
    cell has a unique address. For example, the address B3 refers to the cell located
    in the second column (B) and the third row. This is also indicated at the top
    left next to the entry line.


    Possible contents for cells include numbers, text, dates, times, currencies, and
    formulas. A cell may be active or inactive. There can be only one active cell
    at a time. The active cell has a thick black frame. Move the activation with the
    cursor keys or by clicking another cell with the mouse. An active cell can be
    edited.


