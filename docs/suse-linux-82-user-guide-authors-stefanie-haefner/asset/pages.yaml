- img_proc: true
  md: '# Windows and Saving this Configuration


    To customize the overview of files and directories, Konqueror offers several views.
    See Figure 11.2 on the facing page for examples.


    Konqueror can divide the window horizontally or vertically. To do this, just click,
    in the ''Window'' menu, ''Split View Left/Right'' or ''Split View Top/Bottom''.
    The active display shows a green dot in the status bar.


    You can even activate a terminal. If the check in front of ''Show Terminal Emulator''
    is activated, a window is opened in which to enter and run commands as usual.
    This makes it easy to combine both preferences — graphical and command-line oriented
    — in one window.


    Once you have assembled a display, save under ''Window'' -> ''Configure View Profiles...''
    Give your profile name with which to load it in the future. In addition, if the
    window size should be saved. If the space is too small, move your Konqueror window
    to its own desktop and choose ''Fullscreen Mode''.


    # Tabbed Browsing


    Konqueror has inherited another characteristic from Mozilla: tabbed browsing.
    The advantage of tabs is that you have only one Konqueror window with several
    subareas, such as pages or a view of your file system. To create a tab, select
    ''Window'' -> ''New Subwindow''. Right-clicking the tab opens a pop-up menu. In
    this menu, decide what to do with the tab: create a new one, duplicate an existing
    one, separate one (which will appear in a separate window), or close one or all
    tabs.


    # Konqueror as a File Manager


    # Navigating in Konqueror


    As a file manager, Konqueror enables navigation through various directory levels
    with ease. Enter your home directory in the URL entry line, for example, or click
    the icon with the house.


    Switch directories or open files with the mouse as usual. A single-click is usually
    sufficient for changing directories or opening files. You can also move around
    in Konqueror using the arrow keys. Use any of the arrow keys to highlight an item
    (the background of the selected icon is shown in a different color). Pressing
    ↵ opens the file or changes to the directory.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'To select a number of files, press (Alt). To return to the previous directory,
    click the left arrow in the toolbar.


    # Navigating with the Sidebar


    Konqueror offers a sidebar. This is a window that can be displayed or hidden in
    Konqueror, providing several options: display your bookmarks, recently visited
    URLs, home directory, and much more. Activate the sidebar via ''Windows'' → ''Display
    extended sidebar'' or press (F9).


    # Deleting Files and Directories


    In KDE, there are two methods to delete files and directories. Each method has
    different advantages. In the first method, the files are moved to the Trash directory
    when you choose ''Edit'' → ''Delete''. They are stored and can be retrieved from
    the trash when it is emptied. Of all the deleting methods, this is the safest.
    Delete the contents of the trash by right-clicking the trash icon on the desktop.
    In the pop-up menu that appears, choose ''Empty Trash Bin''.


    The second method deletes the file by marking the file system objects as ''free''.
    These deleted files can only be restored with special tools, if at all.


    # Selecting Several Files


    To select several files in Konqueror, drag a frame around the files required.
    Click a free area in the window, keep the mouse button pressed, and move the mouse.
    A dotted frame surrounds the selected files and the background color changes.
    Add individual files to the selection by clicking while keeping (Ctrl) pressed.


    Now, release the mouse button and start the desired action (copy, move, delete,
    etc.). For a more exact selection, such as all PNG files, choose ''Edit'' → ''Select''.
    In the dialog box that appears, enter an expression like *.png. Now all PNG files
    in the currently displayed directory will be selected. To add additional files
    to your selection, open the dialog box again and repeat the individual steps.


    # Finding Files


    To search for files, go to ''Extras'' → ''Find file...''. Specify the name or
    pattern along the path and click ''Find''. Konqueror will search the specified
    directory and show the results below. Conduct a more precise search'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'by selecting ''Date Range'' (from when to when) or ''Advanced'' (type, text,
    or size). The program can be run separately by pressing Alt + F2 and entering
    ''kfind''.


    # Renaming Files


    To rename files, right-click the respective file. A pop-up window opens. Select
    ''Rename''. Give your file a new name and complete this action with Enter.


    # Using Filters


    If your directories show more files than desired, try using filters. Filters can
    limit the display to just the files needed. To do this, select ''Extras'' -> ''View
    Filter''. It lists the recognized file types. If you click an entry, this file
    type is displayed in the Konqueror window. With ''Use multiple filters'', designate
    several filters. To view all files, select ''Reset''.


    # Browsing Compressed Files


    Konqueror has another interesting feature: it can browse compressed files. If
    you have a tar.gz file, click it and Konqueror shows the contents as if it were
    a directory.


    You can also copy individual files from it. Copying files into an archive is not
    yet supported, but this feature may be included in one of the next versions. If
    the input field in the URL begins with tar:/ or zip:/ this indicates that you
    are surfing a compressed file.


    # Converting Audio CDs


    Using audiocd:, Konqueror can be used to convert the contents of audio CDs to
    various formats and save them to the hard disk. The exact procedure is described
    in Reading Audio CDs on page 251.


    # Creating an Image Gallery


    If a directory contains an extensive collection of images, it might be difficult
    to keep track. Konqueror can help you by creating an HTML file with thumbnail
    images. Observe the respective directory in Konqueror and select ''Extras'' ->
    ''Create Image Gallery''. A window opens in which to specify the background and
    foreground colors, the title, and where to save it. Launch


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_218_0.png)'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'the action by clicking ''Ok''. By default, a file called index.html is created.
    Open it with Konqueror to see your images displayed in thumbnail format in a clear
    overview.


    # Pop-up Menus with the Right Mouse Button


    If you have a directory displayed in an open Konqueror window, open a pop-up menu
    with the right mouse button at any time. Depending on the file type, you can start
    various actions here. If you click a file or directory, entries appear as in the
    ''Edit'' menu.


    # Konqueror as a Web Browser


    Konqueror is more than a file manager. It is also an effective web browser.


    # Opening Web Pages


    Simply enter a web address in the URL line, for example, www.suse.de. Konqueror
    displays the address. You do not even need to write the protocol (http://) at
    the beginning, as it is recognized automatically by the program. This feature
    only works properly with web addresses, however. For FTP services, you must enter
    ftp:// at the beginning of the entry line.


    # Saving Web Pages and Graphics — Web Archives


    As in other browsers, you can save web pages. To do this, select ''Address'' →
    ''Save as…'' and provide a name for your HTML file. However, this will not save
    any images. To archive an entire web page, including the images, select ''Extras''
    → ''Archive Web Page''. Konqueror suggests a file name that you usually accept.
    The file name ends with .war, the suffix for web archives. To view the saved web
    archive later, simply click the respective file and the web page is displayed
    in Konqueror along with its images.


    # Enhanced Web Browsing (Internet Keywords)


    Searching the web using Konqueror is very practical. Konqueror defines a number
    of search engines for you, all with a specific shortcut. Search for'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'a certain topic on the Internet, enter the shortcut and the keyword, separated
    by a colon. The relevant page containing the search results is displayed. You
    can also define your own shortcuts. Simply select ''Settings'' → ''Config-Konqueror''
    → ''Web Shortcuts''. A dialog appears in which to define your own abbreviations.


    # Translating Web Pages


    Konqueror cannot translate web pages directly, but requires an external source.
    To translate a web page, enter the address then select ''Tools'' → ''Translate
    Web Page''. A dialog opens in which to choose the source language and the target
    language. After the selection has been made, it will take a few seconds until
    the translated page appears.


    # Bookmarks


    If you frequently visit certain pages, it is often a hassle to type in the same
    address repeatedly. Konqueror helps you set up a bookmark list. For this, use
    the ''Bookmark'' menu. Save all your bookmarks, from web pages to directory links,
    to your local hard disk.


    To create a new bookmark in Konqueror, click ''Bookmarks'' → ''Add Bookmark''.
    If you have already added some bookmarks, you will also see them in this menu.
    It is recommended to arrange your collection by subjects, hierarchically. ''New
    Directory'' creates folders in which bookmarks can be grouped. Open the bookmark
    editor by selecting ''Bookmarks'' → Edit Bookmarks... Using this program, organize,
    rearrange, and delete bookmarks.


    If you are using Netscape or Mozilla as additional browsers, you do not need to
    set up your bookmark folders again. The bookmark editor includes ''File'' → ''Import
    Netscape Bookmarks'' with which to integrate your Netscape and Mozilla bookmarks
    into your current collection. The reverse is also possible via ''Export as Netscape
    Bookmark''.


    Change your bookmarks by right-clicking the entry. A pop-up menu appears in which
    to select the desired action (cut, copy, delete, etc.). When you achieve the desired
    results, save it with ''File'' → ''Save''.


    To save your bookmark list and have instant access to it, make your bookmarks
    visible in Konqueror. Select ''Settings'' → ''Show Bookmark Toolbar''. A bookmark
    panel is automatically displayed in the current Konqueror window.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Java and JavaScript


    Do not confuse these two languages. Java is an object-oriented, platform-independent
    programming language from Sun Microsystems. It is frequently used for small programs
    (applets), which are executed over the Internet for things like online banking,
    chatting, and electronic shopping systems. JavaScript is an interpreted scripting
    language mainly used for the dynamic structuring of web pages (e.g., for menus
    and other effects). Konqueror enables the activation or deactivation of these
    two languages. This is even possible for specific domains, which means that the
    access can be permitted for some hosts and blocked for others.


    > Note

    For applets to run correctly, at least a “Java Runtime Environment” must be installed.
    The minimum solution can be found in the package javarunt package. If you need
    to compile Java source code, install the Java Development Kit (package java) instead.


    If you have high system security requirements, completely deactivate Java and
    JavaScript. Unfortunately, some web pages require JavaScript.


    # Proxies


    If your provider allows access to a proxy server, enter it for KDE. The advantage
    is that your pages may be available faster if users access them simultaneously.


    In ‘Settings’→ ‘Configure Konqueror...'', select ‘Proxy Server’. Enter the proxy
    for HTTP and FTP along with their respective ports. Under ‘No proxy for:’, exclude
    specific servers. Normally, enter localhost here or the name of your Linux computer.


    # Konqueror as File Viewer


    In Konqueror, view different files as well as directories and web pages. If you
    click a text file, for example, the program belonging to this will not be started.
    Instead, the text will be “embedded” into the Konqueror window.


    To edit the files, start the corresponding program separately. Right-click the
    file type. A pop-up menu is displayed. Use ‘Open with’ to start other programs
    that can handle this file type for editing.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# For More Information


    More information about Konqueror can be found on its home page at http: //www.konqueror.org.'
  merge: -1
