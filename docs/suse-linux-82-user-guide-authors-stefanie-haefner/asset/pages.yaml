  md: '# Profile Manager (SCPM)


    The SCPM (System Configuration Profile Management) module offers the possibility
    to create, manage, and switch between entire individual system configurations.
    This is especially useful for mobile computers that are used in different locations
    (in different networks) and by different users. Nevertheless, this feature is
    useful for stationary machines, as it enables the use of various hardware components
    or test configurations. Although the module with the accompanying help is easy
    to use, the configuration of profiles is a task that should be performed by experts
    or system administrators. For more information about SCPM basics and handling,
    refer to the respective sections in the Administration Guide.


    # Restore


    The restore module (Figure 4.27 on the next page) enables you to restore your
    system from a backup archive. Follow the instructions in YaST. Press ''Next''
    to proceed to the individual dialogues. First, specify where the archives are
    located (removable media, local hard disks, or network file systems). As you continue,
    a description and the contents of the individual archives is displayed, so you
    can decide what to restore from the archives.


    Additionally, there are two dialogs for uninstalling packages that were added
    since the last backup and for the renewed installation of packages that were deleted
    since the last backup. These two steps enable you to restore the exact system
    state at the time of the last backup.


    > As this module normally installs, replaces, or uninstalls many packages and
    files, you should use it only if you have experience with backups, as otherwise
    you may lose data.


    # Runlevel Editor


    The Runlevels in SuSE Linux


    SuSE Linux can be operated in several runlevels. By default, the system boots
    to runlevel 5, which offers multiuser mode, network access, and the graphical
    user interface (X Window System). The other runlevels offer multiuser mode with
    network but without X (runlevel 3), multiuser mode without network (runlevel 2),
    single-user mode (runlevel 1 and S), system halt (runlevel 0), and system reboot
    (runlevel 6).'
  merge: -1
  pgno: 123
