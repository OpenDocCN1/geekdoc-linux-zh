  md: '# # Multimedia Applications in Linux


    Linux offers a wide range of sound applications in various states of development.
    Because of the variety of applications and their unusual names, it can be difficult
    to determine what an application does and to find the application that suits a
    particular purpose. The following is an overview of the vast range of applications
    for the various tasks in multimedia. Some of the more powerful applications included
    in the Su Linux distribution are described in more detail here.


    Many of these applications are not included in the default installation. Use YaST
    to install the corresponding packages.


    +   Mixers . . . . . . . . . . . . . . . . . . . . . . . . . . . . 246

    Players . . . . . . . . . . . . . . . . . . . . . . . . . . . . 248

