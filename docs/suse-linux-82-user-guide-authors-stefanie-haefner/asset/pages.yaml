  md: '# KInternet — Connecting to the Internet


    For surfing the Internet or sending and receiving e-mail, either a modem, ethernet,
    or ISDN card needs to be connected to a computer and be properly configured with
    Suisse Linux. This is done with the help of the installation and configuration
    tool YaST. When the device has been properly configured, the application KInternet
    is used to control the dial-up Internet connection.

    KDE loads KInternet at start-up. The application independently evaluates whether
    an Internet connection can be established. If so, the application icon automatically
    appears in the lower right corner of the KDE panel in the form of a connector
    plug. The following is a list of the symbols and their meaning:


    +   - Currently not connected to the Internet.


    +   - Making a connection.


    +   - The connection has been established.


    +   - Not currently connected to the Internet. A connection will be attempted
    when requests are made that require one.


    +   - Data is being transferred either to or from the Internet.


    Right-clicking the KInternet icon opens a menu with which to configure the application.
    To set up the access details for an Internet service provider, go to ''Settings...''→Configure
    with YaST. Enter the root password when requested. Choose the corresponding configuration
    entry within YaST (modem, ISDN, network or DSL) and a list of the most common
    providers appears for selection.


    # Frequently Asked Questions and Answers


    +   - How can I access a CD or DVD?

    An icon is located on your KDE desktop with an image of a CD. Insert your CD or
    DVD in your drive and left-click the icon. The CD will be mounted and its contents
    displayed in your Konqueror window.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   - There isn’t a CD icon on my desktop. How do I create one?


    Right-click the desktop. Select ‘Create new...'' → ‘CD-ROM Device’. A window opens.
    Under ‘General’, rename the icon on the desktop. Enter the device name of your
    CD or DVD drive under ‘Device’


    +   - Can I put the panel somewhere else?

    Yes, of course. Left-click a free space in the panel and drag it to any other
    edge. After you have released the mouse button, the panel will be placed there.


    +   - I want another panel. Is that possible?

    Yes, right-click an open space in the already existing panel. Select ‘Add’ → ‘Extension’
    → ‘External Taskbar’. A taskbar opens. Add files and directories there with the
    help of Konqueror. Alternatively, rightclick the panel and select the corresponding
    items under ‘Add’


    +   - How can I add programs and other items to the panel?

    For this, there are two options:


    +   1. Right-click a free space in the panel. A pop-up menu appears. Select ‘Add’
    → ‘Button’ and you see the entries as they appear in the K menu. Add your preferred
    item to the control panel by clicking ‘Add’ this menu. Also select the desired
    program directly by clicking it. In both cases, the corresponding icon appears
    in the control panel.


    +   2. Programs and folders can be added by selecting them straight from Konqueror
    with the left mouse button and, keeping the mouse button pressed, dropping the
    object into the panel and releasing the mouse.


    +   - I want to find out about my system. Where can I find this information?

    There are two options. Press the key combination `Alt` + `F2` and enter the command
    `ksysguard`. A window opens. Use the “sensor browser” on the left-hand side to
    click individual monitoring modules and drag them to the main window. Other possibility
    is to use the Control Center. All the resources and devices associated with your
    computer are located under ‘Information’


    +   - How can I display PostScript or PDF files?

    In KDE, the program KHotview serves this purpose. DVI, PostScript, and PDF Viewers
    on page 117 provides more details about this program.'
