  md: '# KDE — The Desktop


    The K Desktop Environment (KDE for short) is the standard desktop for SuSE Linux.
    All information for optimizing your work with your desktop system can be found
    here. This chapter shows the graphical elements, summarizes some of the applications,
    and introduces KDE Internet connections.


    +   The History of KDE . . . . . . . . . . . . . . . . . . . . . . . . 112

    The First Start-Up . . . . . . . . . . . . . . . . . . . . . . . . . . 112

