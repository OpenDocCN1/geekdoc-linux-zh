  md: '# Configuring the LDAP Access


    In the left menu window, click ''Contacts'' or select the folder with this name
    from ''Local Folders''. From the menu bar, select ''Tools'' • ''Addressbook Sources...''.
    A new window opens, displaying the address books already configured.


    To add a new source or a new server, select ''Add''. To edit or delete an existing
    link, select ''Edit'' or ''Delete''. Then click ''Add'' to open a new dialog for
    entering the data required for configuring the address book.


    The following fields must be filled to access, for example, a SuSE Linux Openexchange
