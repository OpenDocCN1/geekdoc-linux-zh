  md: '# Writing Mail


    Click ‘New Message’ to compose a new message. Replying or forwarding a message
    opens the same basic editor. Next to ‘From’, select from which account to send
    the message. In the recipient fields, enter an e-mail address or part of a name
    or address in your address book. If Evolution can match what you enter to something
    in the address book, Evolution displays a list from which to select. Click the
    desired contact or continue entry if no match. To select directly from the address
    book, click ''To'' or ''CC'' instead. Evolution can send regular e-mail or HTML
    e-mail. Use the toolbar to format HTML mail. Click ‘Attach’ or ‘Insert’→Attachment
    to send a file along with the message. To protect your e-mail with PGP, make appropriate
    selections from the ‘Security’ menu.


    To send your message, click ‘Send’. If not ready to send it immediately, make
    another selection under ‘File’. For example, save the message as a draft or send
    it later.


    # Folders


    It is often convenient to sort e-mails into a variety of folders. Evolution also
    offers folders. To view your folder tree, select ‘View’ → ‘Folder Bar’. If you
    are accessing mail over IMAP, the IMAP folders will also be shown in this view,
    for POP and most other formats, your folders are stored locally, sorted under
    ‘Local Folders’. Your ‘Contacts’, ‘Calendar’, and ‘Tasks’ are also treated as
    folders in this view, but should not be used for filing-mail.


    Several folders are included by default. ‘Inbox’ is where new messages fetched
    from a server are initially placed. ‘Sent’ is used for saving copies of mail you
    send. ‘Outbox’ is temporary storage for mail that has not yet been sent. is useful
    for working offline or if the outgoing mail server is temporarily unreachable.
    ‘Drafts’ is used for saving unfinished e-messages. ‘Trash’ is temporary storage
    for deleted items. Configure automatic emptying of that folder under ‘Tools’→‘Mail
    Settings....


    New folders can be created under ‘Local Folders’ or as subfolders of existing
    folders. Create as a complex folder hierarchy as desired. To create a new folder
    while in ‘Inbox’ view, select ‘File’→‘Folder’→‘New Folder’. In the dialog that
    opens, enter a name. Also select the folder for which the new folder will be a
    sub. Leave the ‘Folder Type’ as ‘Mail’ for a new mail storage folder. Click ‘OK’
    to create the new folder.


    To move a message into a folder, select the message to move. Right-click to open
    the context menu. Select ‘Move to...’ and, in the dialog that'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'opens the destination folder. Click ''OK'' to move the message. The message
    header in the original folder will be shown with a line through it, meaning it
    is marked for deletion in that folder. The message is stored in the new folder.
    Messages can be copied in a similar manner.


    Manually moving a number of messages into different folders can be time-consuming.
    Filters can be used to automate this procedure.


    # Filters


    Evolution has a number of options available for filtering. Filters can be used
    to move a message into a specific folder or to delete a message. Messages can
    also be moved directly to the trash with a filter. There are two options for creating
    a new filter: creating a filter from scratch or creating a filter based on a message
    to filter. The latter is extremely useful for filtering messages to a mailing
    list.


    # Creating a Filter from Scratch


    Select ''Tools'' → ''Filters''. This dialog lists your existing filters, which
    can be edited, and allows for deletion or addition. Click ''Add'' to create a
    new filter.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_248_0.png)


    Figure 14.2: Creating a Filter


    Enter a name for the new filter in ''Rule Name''. Select the criteria to use for
    the filter. Options include sender, recipients, source account, subject, date,
    and status. The drop-box showing ''Contains'' provides a variety of options,'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'such as "contains," "is," and "is not." Select the appropriate condition. Enter
    the text for which to search. Click ''Add criterion'' to add more filter criteria.
    Use ''Execute actions'' to determine if all or some of the criteria must be met
    to apply the filter.


    In the lower part of the window, determine the action to be taken when the filter
    criteria are met. Messages can, for example, be moved or copied to a folder or
    assigned a special color. When moving or copying, select the destination folder
    by clicking. In the folder list that appears, select the folder. Use ''New'' to
    create a new folder. Click ''OK'' when the correct filter is selected. When finished
    creating the filter, click ''OK''.


    # Creating a Filter from a Message


    Select the message on which to base the filter. Right-click and select ''Create
    Rule From Message''. Select the filter option desired. This opens the filter creation
    dialog with the correct criteria already selected. Add additional criteria if
    desired. Select the appropriate filter action. Click ''OK'' when finished.


    # Applying Filters


    Filters are applied in the order listed in the dialog under ''Tools'' → ''Filters''.
    Change the order by highlighting a filter and clicking ''Up'' or ''Down''. Click
    ''OK'' to close the filter dialog when finished.


    Filters are applied to all new mail messages. They will not be applied to mail
    already in your folders. To apply filters to messages already received, highlight
    the desired messages then select ''Actions'' → ''Apply Filters''.


    # VFolders


    Evolution offers unique VFolders. A VFolder is a virtual folder that displays
    messages based on search or filter criteria. Rather than moving the messages into
    a folder, messages shown in a virtual folder remain in their original folder.
    Actions taken occur to the message in the original folder.


    VForders are useful means of reading new mail in one place after it has been sorted
    into a number of different directories with filters. For example, a VFolder could
    be created to search all your folders forunread.


    To create a new VFolder, select ''Tools'' → ''Virtual Folder...''. In the dialog,
    click ''Add''. VFolders can also be created from a message as with filters. Right-click,
    select ''Create Rule from Message'', then select the correct VFolder criteria.'
