  md: '# Overview of the Programs


    OpenOffice.org consists of several programs that can interact. The programs are
    described in Table . The main focus here is on Writer and Calc. The other applications
    are only covered briefly. For more information, use the online help described
    in Getting Help on this page.


    +   - Powerful text processing application

    - Spreadsheet application with a utility for generating charts

    - Drawing application for creating vector graphics

    - Math Application for generating mathematical formulas

    - Application for creating presentations


    Table 9.1: Available Programs in OpenOffice.org


    # Getting Started with OpenOffice.org


    Get help for OpenOffice.org at any time in the ''Help'' menu. To get thoroughly
    acquainted with a topic, use ''Help'' → ''Contents''. Help provides information
    about the OpenOffice.org components such as Writer, Calc, and Impress. The ''Help
    Agent'' attempts to offer help information relevant to your current task. It updates
    its window when you perform different actions in OpenOffice.org and provides helpful
    hints. To use it, activate ''Help'' → ''Help Agent''. ''Tips'' or ''Extended Tips''
    display a help text when you point to an icon with the mouse. The text displayed
    by ''Extended Tips'' is more detailed. At the outset, ''Tips'' and ''Extended
    Tips'' (both located in the ''Help'' menu) are very useful. When familiar with
    OpenOffice.org, easily deactivate them.


    > TipnIf you are not sure whether the features are active or not, click the ''Help''
    menu. Checked menu items are activated.'
