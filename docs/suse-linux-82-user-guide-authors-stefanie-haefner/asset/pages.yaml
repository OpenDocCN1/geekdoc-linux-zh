  md: '# Mail Encryption with PGP or GnuPG


    The following section, which is mainly intended for newcomers, briefly describes
    the encryption of messages with KMail.


    You can encrypt your e-mails handled by KMail. This does not mean, however, that
    the attachments will be encrypted. This must be taken care of in advance with
    a shell command or one of the other tools. Before you implement PGP or GnuPG in
    KMail, the respective application must be installed and configured correctly.
    For details, refer to the man page for the man page for (man ) or the man page
    for (man ).


    # Requirements for PGP and GnuPG


    KMail assumes that your PGP binary is called ppg. If you use GnuPG, KMail will
    expect a binary file named gpg. First, generate a key pair for your identity.
    This must be done in the command line (use ppg -kg or gpg --gen-key). KMail currently
    does not offer support for generating a PGP or GnuPG key. The identity, your name
    and your e-mail address, for example, JohnDoe<john@example.com>, and your password
    are required for the interaction between KMail and PGP and GnuPG.


    # KMail Settings


    Open the KMail settings dialog with ''Settings'' → ''Configure KMail''. Click
    ''Security'' → ''OpenPGP''. Specify the application to use for this purpose in
    ''Select encryption program''. The option ''Automatic recognition'' is usually
    chosen.


    Under the ''OpenPGP'' tab, there are the following additional options:


    +   - Keep passphrase in memory: If this option is disabled, KMail will ask for
    your password whenever you sign a message (before sending it) or when you decrypt
    a (received) message. If you enable this option, KMail will only ask you twice
    for your password then keep it in the memory. It will not be written to the hard
    disk. However, remember that a user with the respective permissions (e.g., root)
    might be able to read your password from the memory.


    +   - Always encrypt to self: If this option is disabled and you want to send
    an encrypted e-mail, you will not be able to read this message yourself once it
    has been created and encrypted. Enable this option'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'when you still want to be able to read your encrypted messages your-

    elf. You can read the pure text of the message in the Sent folder.


    +   - ''Show ciphered/signed text after composing'': Enable this option to

    have the text displayed after it is encrypted or signed.


    +   - ''Always verify the encryption key'': If you click this option, you will
    be

    asked each time which key to use for signing and encoding.


    Once the preferences have been set, click ''Identities'' (left border). Select
    the\identity with which encrypted or signed messages should be sent and choose

    ''Change''. Select the ''Advanced'' tab in the open dialog box. Clicking

    ''Change'' for the ''OpenPGP key'' entry displays a selection box from which

    t keys can be chosen. The encryption system is now ready. Confirm with

    ''OK''.


    The public key must be made available to recipients of a signed message to

    en them to verify its authenticity and also needs to be publicly accessible

    en enable others to send encrypted messages to the owner of the key. Public

    keys can be stored on a public PGP key server, such as www.pgp.net.


    # Signing Messages


    Create your messages as usual. Before sending the message, click the corre-

    sponding (second to last) in the toolbar of the window or choose ''Op-

    tions'' → ''sign message''. The message can then be sent. To sign it, KMail

    must know your PGP password. However, if you have already provided

    t password, KMail will sign the message without requesting any further

    information. The results of the PGP signing process can be reviewed in the

    SentMessages folder (or in the out if you did not use ''Send now'').

    There, your e-mail will be marked with the notice that it was signed by

    you.


    # Sending Public Keys


    Create a message for the person who should receive your public key. Choose

    ''Attach Public Key'' in the ''Attach'' menu. The mail can then be sent. There

    is no guarantee that the recipient of a signed message will receive the cor-

    rect key. It is possible that the mail is intercepted on the way to the recipient

    d gets signed with another key. Therefore, the recipient should check the

    attached key by comparing the finger print with a previously received value.

    Further information on this can be found in the PGP and GnuPG documenta-

    tion.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Decoding Encrypted Messages


    In KMail, you only need to select the message. Enter your password when prompted.
    KMail will attempt to decrypt the message if it was encrypted with your public
    key and display it in clear text. If not, you will not be able to read the e-mail.
    KMail saves the e-mails as encrypted messages to prevent anyone from reading them
    without your password.


    # Receiving a Public Key


    You can receive a public key as attachment, over FTP, or on a floppy disk. Before
    using it to encrypt an e-mail, check the key (look over the fingerprint or look
    for a reliable signature).


    Then you can add the key to your public key ring by entering the command `pgp
    -ka (filename)` or `gpg --import (filename)` in a command line. If the key does
    not have a trustworthy signature, you will not be able to use it to encrypt in
    KMail (use `pgp -ks (identity)`).


    # Using Other People''s Public Keys — Encoding Your Own Messages


    To send an encrypted message to a recipient whose public key you have received,
    simply write the message in the ''Create Message'' window. Before sending the
    message, click the red key icon in the window''s toolbar. Now, the message can
    be sent. If KMail cannot find a key for the recipient, a list with all the available
    keys is shown. Select the appropriate one from the list or abort the process.
    KMail also informs you if errors occur during the encryption process. You cannot
    read encrypted mails if you did not click ''Encrypt self'' in the ‘Security’ tab.


    # For More Information


    More information can be found on KMail''s web site at http://kmail.kde.org.'
  merge: -1
