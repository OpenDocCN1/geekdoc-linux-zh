  md: '# Operation of the Answering Machine


    If e-mail answering has been turned off, voice messages left on the answering
    machine are sent as an e-mail to the recipient associated with the incoming phone
    number. This means that the operation of the answering machine does not require
    any additional description. All incoming messages can be comfortably viewed and
    opened with the e-mail client. The incoming messages are additionally stored in
    /var/spool/capisuite/users/<username>/received/ for backup reasons.


    The recording of the personal welcome message is performed directly over the remote
    access feature of the answering machine.


    To access your answering machine remotely, call your associated number from any
    telephone. Enter the previously-defined PIN during the welcome message playback.
    Wait a few seconds if you mistype your PIN then try again after the beep. Shortly
    after having correctly entered the PIN, the answering machine gives you the number
    of stored messages. You then have the choice of recording a new welcome message
    or listening to your stored messages. Follow the instructions given.


    The following table provides a brief overview of the menu items for the remote
    access of messages. It is recommended to carry a copy of it if you use the remote
    access frequently. The commands can be entered at any time during the playback
    of the messages. This means that an excessively long voice message can be skipped
    easily.


    | Key | Function |

    | 1 | delete current message |

    | 4 | skip to the next message |

    | 5 | skip to the previous message |

    | 6 | replay current message |


    Table 15.1: Commands for Message Playback'
  merge: -1
