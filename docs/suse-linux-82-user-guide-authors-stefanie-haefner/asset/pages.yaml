  md: '# GNOME Mixer Applet


    If you use GNOME, this applet provides a convenient volume control that can be
    integrated into a panel. To add it to a panel, right-click then select ‘Panel’
    → ‘Add to Panel’ → ‘Applet’ → ‘Multimedia’ → ‘Mixer’


    # Players


    Linux offers a variety of programs for playing audio CDs and the various music
    formats available, including MP3, OGG, and WAV files. Where possible, the supported
    formats of the players are listed.


    # kscd — Audio CD Player


    kscd is an easy-to-use audio CD player. It can be accessed from the ‘SuSE menu’
    under ‘Multimedia’ → ‘Multimedia’ → ‘CD’ → ‘KsCD’. Access the configuration menu
    by clicking the tool icon. kscd can be configured to search an online CDDB server
    for the name and track formats of a CD.


    # The WorkMan Audio CD Player


    WorkMan offers a simple, handy, user interface with an abundance of functions.
    It is ideal for anyone who prefers to run a CD player without the KDE


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_269_0.png)'
