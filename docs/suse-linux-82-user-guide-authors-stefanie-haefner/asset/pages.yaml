  md: '# E-Mail Communication


    The configuration module allows you to adapt your mail settings if you send your
    mail with sendmail, postfix, or the SMTP server of your provider. Retrieve your
    mail via SMTP and the fetchmail program, for which you can also enter the details
    of the POP3 server or IMAP server of your provider.


    You can also use a mail program of your choice, such as KMail or Evolution, to
    set your POP and SMTP access data as usual (to receive mail with POP3 and send
    mail with SMTP). In this case, you do not need this module.


    # Connection Type


    If you want to specify your mail settings with Yoast, the desired type of connection
    to the Internet must be specified in the first dialog of the e-mail configuration
    module. Choose one of the following options:


    +   * ‘Permanent’ Select this option if you have a dedicated line to the Internet.
    Your machine will be online permanently, so no dial-up is required. If your system
    is part of a local network with a central e-mail server for the e-mail communication,
    you should also select this option to ensure permanent access to your e-mail messages.


    +   * ‘Dial-up’ This item is relevant for all users who have a computer at home,
    are not located in a network, and establish dial-up connections with the Internet
    occasionally via modem, DSL, or ISDN.


    +   * No connection If you do not have access to the Internet and are not located
    in a network, you cannot send or receive e-mail.


    Furthermore, you can activate virus scanning for your incoming e-mail with AMAVIS
    by activating the respective box. The package is installed automatically as soon
    as you activate the mail filtering feature. In the following dialogs, specify
    the outgoing mail server (usually the SMTP server of your provider) and the parameters
    for incoming mail. If you use a dial-up connection, you can specify diverse POP
    or IMAP servers for mail reception by various users. By means of this dialog,
    you can also assign aliases, implement masquerading, or set up virtual domains.
    Click ‘Finish’ to exit the mail configuration.


