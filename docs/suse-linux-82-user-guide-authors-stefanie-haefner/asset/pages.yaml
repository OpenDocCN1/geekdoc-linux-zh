- img_proc: true
  md: 'This is usually the most sensible mode. After all settings are adjusted, press
    ‘Preview Scan’ to scan the image preview. Subsequently, a small version of the
    image will appear in the preview window.


    # # The Final Scan


    If you selected ‘User defined’ for the scanning size, use the mouse to highlight
    the rectangular area to scan. The selected area is marked with dotted borders.


    To generate the final image, select the scanning mode and the resolution. Depending
    on the model, you will be offered additional options such as gamma values, contrast,
    and brightness.


    Select the format in which to create the image. To generate future scans in the
    same format without confirmation, mark ‘Don’t ask again’ then ‘OK’. Reconfigure
    this under ‘Settings’ → ‘Configure Kooka’ → ‘Image Saving’’


    The image appears in full size in the image window to the right. The size shown
    varies depending on the scanning area and resolution selected. If you selected
    a higher resolution, you will probably only see part of the image displayed to
    the right. In the right-hand window, scale the displayed area to your preferences.


    # # The Menus


    The toolbar functions can be found under the ‘File’ and ‘Image’ menus. Modify
    Kooka settings under ‘Settings’ → ‘Configure Kooka’. Under ‘Tool Views’, display
    or hide the individual windows.


    Under ‘File’, find ‘Print...’, which opens a print assistant, and ‘Quit’. The
    option ‘Open image in graphic application’ is located under ‘Image’. A description
    of these menu items follows.


    Open image in graphic application


    +   - Select an application for viewing the scanned image using a file browser
    or a command line. GIMP is very useful for this purpose, but it is not included
    in the default package selection.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Character Recognition (OCR) image...


    Opens the window for optical character recognition (OCR). If you have gocr installed,
    the path /usr/bin/gocr should be specified in the path line. This application
    then allows you to start the character recognition for the preview image or for
    the selection highlighted in the preview.


    # OCR on selection...


    Opens the character recognition window for the area marked in the final scan.
    See Character Recognition with gocr.


    # Scale to Width


    Use this option to scale the image in the main image display to fit the width
    of the window.


    # Scale to Height


    Scales the image to the full height of the image display.


    # Original Size


    Resets the image in the display to its original scanned size.


    > Note\ Access more possibilities for scaling the image display by right-clicking
    the image. The options include the three options previously mentioned along with
    options for enlarging it to your own specifications. You can also do the same
    in the preview window.


    # Create from selection


    If you did not accurately select the area for the image in the small preview window,
    use this tool to crop your image permanently by marking a selection in the large
    image display to the right then clicking the tool. See the results to the right.


    # Mirror image vertically


    Flips the image vertically.


    # Mirror image horizontally


    Flips the image horizontally.


    # Mirror image both directions


    Flips the image vertically and horizontally at the same time.


    # Rotate image clockwise


    Rotates the image clockwise by 90°.'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'Rotate image counterclockwise:

    Rotates the image counterclockwise by 90°.


    Rotate 180 degrees

    Rotates the image by 180°


    # Save


    Saving images in Kooka is somewhat different from methods to which you may be
    accustomed. Clicking the ‘Gallery’ tab in the upper left window shows a small
    file browser depicting the gallery. It shows the content of the directory ~/.kde/share/apps/ScanImages.


    This is where all scanned images are initially saved as files. ScanImages is the
    only directory that exists when you first start Kooka. Subfolders can be created
    by right-clicking this main folder. The selected folder (highlighted in blue)
    is the first location where scanned images are saved. The images will be named
    in the format kscan_0001, kscan_0002, etc., and assigned consecutive numbers.


    To save the image, click the name. Now, give it a new name and assign the correct
    ending — the format in which the image was scanned. If you specify the wrong ending,
    receive an error message notifying that the ending does not correspond to the
    format in which the image was scanned. Currently Kooka does not support “on-the-fly”
    conversion.


    If you do not want to manage your images under ~/.kde/share/apps/ScanImages/,
    save your images to another location. To do this, right-click the name of the
    image and select ‘Save’. Then enter the path. You can also close or permanently
    delete the image. External images you have not saved yourself can be added to
    the gallery using Konqueror’s drag and drop feature. Start Konqueror (the earth
    symbol in your KDE bar), to go to the directory containing the images to add to
    your gallery, simply drag them with the mouse and drop them in the Kooka gallery
    directory.


    # Character Recognition with gocr


    As mentioned above, you need to install gocr. Once this is done, scan a preview
    of your document using either gray or color mode. You can also scan in binary
    mode.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'The preview window, mark the area of the text to recognize. Choose binary mode
    for the final scan then scan with ‘Final Scan’.


    Click the second icon from the left inside the toolbar, ‘Character recognition
    image...'', or select this menu item from the ‘Image’ menu. For the first try,
    do not modify the default settings in the OCR window that opens (Figure 19.2).
    These settings suit most users’ needs. Now click ‘Start character recognition’.
    A window like that in Figure 19.3 on the following page shows the results of the
    character recognition. The quality largely depends on that of the document.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_298_0.png)


    Figure 19.2: the gocr Window


    If you only want to submit part of the text or image after the final scan in binary
    mode, mark your selection in the image display to the right. Then click the third
    button from the right in the toolbar or select ‘Image’ → ‘Character recognition
    on selection’. Proceed as described in the previous paragraph.


    # Some Kooka Tips


    Kooka is very easy to use, scanning can be very tricky, especially with scanners
    featuring numerous setting options or when trying to scan low-quality documents.
    As a beginner, expect to do some experimenting until the results meet your satisfaction.
    A perfect color printout of your favorite picture requires time and practice.'
  merge: -1
