  md: '# Troubleshooting


    Your scanner may not have been detected for one of the following reasons:


    +   - The scanner is not supported. Check http://sdb.suse.de/en/ for a list of
    devices compatible with Linux.


    +   - Your SCSI controller was not installed correctly.


    +   - There are termination problems with your SCSI port.


    +   - Your SCSI cable is not too long.


    +   - Your scanner has a SCSI Light Controller that is not supported by Linux.


    +   - Your scanner is defective.


    > Caution

    SCSI scanners should not be connected or disconnected when the the system is running.
    Shut the system down first.

    Caution


    For more information about scanning, refer to Kooka — The Scanning Application
    on page 271.


