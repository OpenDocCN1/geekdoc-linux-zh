- img_proc: true
  md: '# Configuring The GIMP


    GIMP provides some simple setting options for fast and efficient work. Explore
    ''File'' → ''Preferences'' to see the range of options available. Once you are
    more familiar with GIMP, experiment with the various settings. Refer to the internal
    help system for advice.


    An important setting is the multilevel ''Undo'', to use your last actions. To
    use it, ''Edit'' → ''Undo'' in the context menu or press (Ctrl) + Z. It is important
    to set how many levels of changes GIMP should save. Set this in the ''Environment''
    category of the ''Preferences'' dialog mentioned previously.


    If you memorize the keyboard shortcuts, GIMP is much easier to work with. Change
    the shortcuts to your required required menu item and keep the mouse button pressed.
    Type the required key combination it is immediately assigned. Avoid repeating
    shortcuts, as that is possible and will confuse the program.


    > Tip


    Many functions or tool settings have their own windows that you can open and close
    as needed. On a larger screen, leave frequently needed dialog windows open without
    any problem.


    > Tip


    Tearoff menus are another outstanding feature of GIMP. Whenever a menu shows a
    dotted line on top, click this line, detaching the menu from the larger context
    menu. The menu is displayed on your desktop in its own window.


    # Layers


    Layers are crucial to using GIMP effectively. They allow you to arrange image
    contents and more easily modify your image. To store layer information when saving
    a file, in GIMP''s native format, .XCF. As well as preserving layer information,
    it also saves GIMP features such as the location of guides.


    To understand how layers work, imagine an image created from a stack of transparent
    sheets. Different parts of the image are drawn on different sheets. The stack
    can be rearranged, changing which pieces are on. Individual or groups of layers
    can shift position, moving sections of the image to other locations. New sheets
    can be added and others set aside. This is very much how the layers work in GIMP.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'By drawing parts of your image on separate layers, you can manipulate, change,
    or delete those parts without damaging the other parts of the image. Using separate
    layers for text is the most common usage, but the possibilities are much more
    extensive.


    GIMP includes a layer manager. Access it via ''Layers'' → ''Layers, Channels &
    Paths'' in the context menu then under the ''Layers'' tab in the dialog that opens
    (see Figure 20.5). Here you can create, copy, and delete layers or anchor a layer
    in the background image. In addition, the eye icon in the layer manager can be
    used to make layers invisible without losing their information. The icon with
    four arrows indicates linked layers. Layers showing this will be moved as a group.


    Under the ''Channels'' tab, view the three color channels red, green, and blue
    individually or in any combination. The ''Paths'' tab provides information about
    paths which have been drawn with the Bezier selection tool.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_317_0.png)


    > Figure 20.5: Layers, Channels, and Paths Dialog


    # Image Modes


    GIMP has three basic image modes RGB, grayscale, and indexed. RGB is the main
    color mode usually used in GIMP. Grayscale is for black, white, and'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'gray images. Indexed is used almost exclusively for converting images to the
    GIF file format. There are a few things to remember when working with image modes:


    +   - Only RGB mode has all the filters available. Most, however, are available
    in grayscale mode. To run filters on an indexed image, convert to RGB first.


    +   - Convert to indexed only right before saving to image formats that require
    it, such as GIF. Never work with an indexed mode.


    +   - Regardless of any color used on a grayscale image, the color will be desaturated
    and applied in a shade of gray.


    +   - Study the internal help system for more information about image modes.


    # Introduction to Image Manipulation


    The following sections provide tips for working with your own images. This only
    introduces a small part of the things possible in GIMP.


    # Preparing Photographs for Printing


    You have, for example, an image of your kids and want to produce a perfect printout
    on your color printer. Unfortunately, the first printout was not what you expected.
    The colors were quite bleak and there is a point in the image which is quite dark.


    There is a fundamental problem when printing color images. Color and contrast
    of the image as seen on screen does not correspond to what comes out of your printer.
    The images on screen are often richer in contrast and more brilliant. In official
    systems are all components adjusted in such a way that screen representation and
    print output match to a high degree. To improve an image, the following manipulations
    are recommended.


    Before you start, create a backup copy of your image. Once you have saved your
    manipulation, you can no longer recreate the original state. Although these corrections
    can be made using ''Image'' → ''Colors'' → ''Brightness-Contrast'', better results
    are obtained through the Levels dialog found in the context menu ''Image'' → ''Colors''
    → ''Levels''.


    SUSE Linux - User Guide 297'
  merge: -1
  pgno: 318
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_319_0.png)


    # Figure 20.6: The Levels Dialog


    The Levels Dialog shows how the color values and colors are spread throughout
    the image (see Figure 20.6). By adjusting the end sliders to the black areas begin
    and end, you redistribute them over the entire range of values. This means that
    somewhere in the image will become completely black, somewhere will be completely
    white, and the rest of the range will be spread accordingly. Usually, clicking
    ‘Auto’ gives acceptable results, but sometimes manual adjustment is needed. To
    adjust manually, drag the sliders to where the black area in the graph begins
    and ends. Do this in each of the channels (select from the drop-down box showing
    Value as default). This should correct both brightness and contrast problems.


    Occasionally, you may need to sharpen the whole image to obtain a good quality
    printout. During sharpening, edges and color transitions are enhanced. Right-click
    and, in the context menu select ‘Filters’ → ‘Enhance’ → ‘Sharpen’. Watch the effect
    in the small preview window and even undo it with (Ctrl) + 2.


    To make individual images brighter or darker, use the ‘Dodge or Burn’ tool from
    the toolbox. For the best results, select a brush tip with a diffuse border in
    the brush selection dialog.


    Finally, cut the image size with the ‘Crop or resize’ tool and print it out.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Special Effects


    In the context menu, many different manipulation tools are available under ''Filter''
    or ''Script-Fu''. These include some easy-to-apply effects. Usually, clicking
    the filter in the menu opens an option box with which to control the effects of
    such filters. Refer to the internal help system for descriptions of filters.


    # Inserting Text


    You can easily integrate text into your images with GIMP. First determine the
    text color with the aid of the color selection icon in the toolbox. Then activate
    text with the T icon and click it. A dialog box in Figure 20.7 opens in to specify
    your text and the font settings. Depending on which fonts are available on your
    system, specify a font family in the first selection column. The second column
    determines style and weight (medium, bold, or italic) and the third column sets
    the type size. Click ''OK'' to add the text to your image. As long as dotted lines
    surround your lettering, you can move the text. However, once the text is anchored
    in your image, you can only remove it with ''Undo'' as long as you have not saved
    the image. Put text on its own layer for easy modifications.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_320_0.png)


    Figure 20.7: Entering Text


    In the option box of the text tool, select between a single line of text and a
    text window with several lines and text alignment. When you activate'
  merge: -1
  pgno: 320
- img_proc: true
  md: '‘Use Dynamic Text’ button, a click inside the image opens an option box in
    which to enter and align multiline text.


    # Retouching Images


    The most suitable tool for this purpose is the clone tool. It is represented by
    a rubber stamp in the tool window. Since we have already explained earlier how
    this tool functions, some brief hints are sufficient here:


    +   - Set the brush to a medium size with a diffuse border area.

    - Work on an enlarged representation of your image.

    - Open a second view of the image with ‘View’ → ‘New View’ and zoom to 1:1 to
    see how the changes look.

    - Save your work from time to time under a different file name. If you do not
    like one of your modifications, revert to a previous stage.


    Retouching may take some time because you often need to change brushes and redefine
    the image section to copy. Working with the clone tool requires some experience.


    # For More Information


    There is a very good GIMP web site at http://www.gimp.org. There, find and download
    documentation, plug-ins, and more. Also, ‘Important Links’ offers an impressive
    collection of links for GIMP.'
