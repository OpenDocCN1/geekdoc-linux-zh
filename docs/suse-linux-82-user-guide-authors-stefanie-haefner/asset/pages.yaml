  md: '# # Using KMail


    # ## Main Window


    The main window appears when KMail is started. It is divided into three sections
    in its default setting.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_231_0.png)


    Figure 13.1: Main Window in KMail after Start-Up


    +   - Folder area (left)

    This section contains a list of your mail folders (also known as mail boxes).
    The columns next to the folder name indicate the total number of messages and
    how many are still unread. Select folders by simply clicking them. The messages
    they contain then appear in the top right frame. The total number of messages
    is also displayed in the status bar at the bottom of the application window.


    +   - Header area (right)

    In this window, the header information (from left to right: subject, sender, and
    time of reception) is listed for messages in the currently selected folder. Clicking
    the header selects the message, which is then displayed in the message window.
    The messages can be sorted by clicking the desired column (subject, sender, date,
    etc.).


    +   - Message area (below)

    The header and contents of the currently selected message are displayed in this
    frame. Attachments are depicted as icons at the lower'
