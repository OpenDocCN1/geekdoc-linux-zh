  md: '# DSL


    Your network card can be properly configured to configure ADSL access. With YaST,
    you can only set up connections based on the Point-to-Point-over-Ether protocol
    (PPPoE). The DHCP protocol is not used for the automatic assignment of IP addresses.
    Therefore, you should not use ‘Automatic ad-dress setup (with DHCP). Instead,
    use a static ‘dummy IP address’ like 192.168.22.1. In ‘Subnet mask’, use 255.255.255.0.
    For a stand-alone system, be certain that you do not make any entries in the ‘Default
    gateway’ field. The values for the ‘IP address’ of your machine and ‘Subnet mask’
    are only placeholders. They do not have anything to do with setting up a connection
    with ADSL. They are only required for activating the network card.


    In this screen, enter the user ID, the personal password, and the ethernet card
    to which your modem is connected (usually eth0). The recommended ‘Idle time’ is
    60 seconds to terminate the connection automatically if no data transfer has occurred.
    Click ‘Finish’ to finish the procedure. To use ‘Dial-on-demand’ (see page 80)
    if you have a stand-alone system, you must enter a name server. Most providers
    support dynamic DNS assignment, so a current IP address is forwarded to the name
    server each time the connection is set up. However, a suitable dummy server IP
    must be entered in this dialog, for example, 192.168.22.99. If you do not receive
    a dynamic name server assignment, enter the IP addresses of the name servers of
    your provider.


    Proceed for T-DSL (German Telecom) as you would for ADSL. To configure your T-DSL,
    you will need the following data: attachment identification, Online number, user
    ID, and your personal password. This information can be obtained from your T-DSL
    login sheet.


    # ISDN


    If your ISDN card is successfully autodetected, a dialog appears in which to make
    your ‘Selection of ISDN protocol’. ‘Euro-ISDN (EDSS1)’ is the standard (this refers
    to scenario 1 and 2 below) in Europe. ‘ITR6’ is a protocol used by older and larger
    phone systems (refer to scenario 2b below). ‘NI1’ is the standard in the USA.
    If this automatic detection fails, choose the correct ISDN card and specify the
    ISDN protocol. Furthermore, enter area code and country code of your location
    for the ISDN connection, e.g., +44 208. Enter the prefix for external calls if
    necessary. Then confirm your settings with ‘OK’.


    The interface is configured in the following dialog. Theoretically, you can configure
    several interfaces. However, this is usually not necessary for home'
