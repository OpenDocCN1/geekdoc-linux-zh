    # ## Creating a Boot, Rescue, or Module Disk


    With this YaST module, easily create boot disks, rescue disks, and module disks.
    These floppy disks are helpful if the boot configuration of your system is damaged.
    The rescue disk is especially necessary if the file system of the root partition
    is damaged. In this case, you might also need the module disk with various drivers
    to be able to access the system (e.g., to access a RAID system).


    ‘Standard boot disk’ Use this option to create a standard boot disk with'
