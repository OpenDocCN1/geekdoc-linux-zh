  md: '# Message Folders


    Message folders serve as an organizing tool for your messages. By default, all
    the message folders are stored in the Mail folder in your home directory. The
    Inbox, Outbox, SentMessages, and Trash folders are created when KMail is first
    run. These folders have the following functions:


    +   - Inbox: New messages are stored here (unless a filter has been defined).

    - Outbox: Messages to send are stored here.

    - Sent: Copies of all e-mails are sent here.

    - Trash: Stores deleted e-mails.


    If the standard folders, though sufficient for the needs of the casual user, are
    not sufficient for organizing your e-mail, create additional folders. Select ''Folder''
    → ''Create'' to add a new folder. In the dialog that opens, enter a name for the
    new folder (see Figure 13.3 on page 219). To create a subfolder, select the prospective
    parent folder (in the drop-down menu labeled ''Belongs to:''). In this window,
    specify the folder type, any mailing lists belonging to it, and an expiration
    date (the period after which the e-mails are marked for deletion).


    # Moving Messages


    To move messages from one folder to another, highlight the message to move then
    press (M) or click ''Message'' → ''Move to...''. In the list of folders that appear,
    select the folder to move your messages. Messages can also be moved from the upper
    window into the left window panel by dragging and dropping the message into the
    appropriate folder.


    To remove all messages from a folder, click ''Folder'' → ''Empty''. All the messages
    located in the folder are then moved to Trash. The messages are not permanently
    deleted until you actually empty the trash.


    # The Address Book


    The address book stores frequently used e-mail addresses. Access it from ''File''
    menu, with the open book icon in the main window, or in the ''New Message'' window.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Create a new entry with ''File'' → ''New contact...''. A window opens with
    a form for entering the personal contact data in the ''General'' tab. Most entries
    are self-explanatory.


    The ''View'' menu allows creation of custom views of the contacts. The view is
    the default setting. ''Add view'' opens a dialog in which to name the view. ''View
    type'' has options for whether the contacts should be displayed as icons, in a
    table, or as cards. ''OK'' continues to the next dialog box in which to select
    the fields to include in the custom view. Filters and preferences can be set in
    the corresponding items. ''OK'' activates the newly created view.


    # Filters


    It can be difficult to keep track of all messages. Filters enable automatic processing
    of incoming messages and manual processing of selected messages in a folder. To
    filter selected messages to a specific folder, highlight the messages and enter
    Ctrl+ShiftJ to activate already existing filter rules or select ''Message'' →
    ''Create Filter'' to create a new one. In doing so, all existing filter rules
    are applied to this message. There is no way to use only particular filters for
    one given message.


    # Filter Rules


    A filter consists of one or several filter rules and filter actions. A filter
    can select messages according to criteria such as the sender, content, or recipient.
    The respective filter action can perform tasks such as moving, deleting, marking,
    or forwarding these messages.


    # Examples of Filters


    Assume, for instance, you are subscribed to the KDE user list kde-user@kde-mailinglists.kde.org.
    Whenever a message from the mailing list arrives, the mail is moved into another
    folder. The following steps are necessary for creating this filter.


    +   Add a new folder as described in Message Folders on the page before. Assign
    a name such as kde-user.'
