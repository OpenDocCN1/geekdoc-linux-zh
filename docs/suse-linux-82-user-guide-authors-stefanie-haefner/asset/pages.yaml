  md: '# Ergonomics in the Workplace


    This chapter is a short discussion of the ergonomic issues involved in the layout
    of computer workplaces. This text should not be seen as a substitute for studying
    the respective standards. No citations from these are included here and footnotes
    with references to other literature are completely omitted to preserve readability.
    It attempts to summarize the latest research findings in a short and concise manner,
    however, much will remain unmentioned. The items referred to in each section are
    mostly gathered from German literature and are almost always based on regulations
    and policies in the Federal Republic of Germany. This information is still useful
    in designing an ergonomic work area.


    +   The Working Environment . . . . . . . . . . . 152

    Office Equipment . . . . . . . . . . . . . . . . . . 157

    Links and Literature . . . . . . . . . . . . . . . . . . 161'
  merge: -1
