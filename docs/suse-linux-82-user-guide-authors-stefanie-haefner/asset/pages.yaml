    #  Attachments


    One of the following methods for attaching files to messages is recommended:


    +   * Click the paper clip icon and select the file to attach.

    * Use the mouse to drag a file from the desktop or another folder into the ''New
    Message'' window.

    * Select one of the options in the ''Attach'' menu.


