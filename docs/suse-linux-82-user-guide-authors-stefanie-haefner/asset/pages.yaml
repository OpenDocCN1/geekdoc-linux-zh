    which you can boot an installed system. This disk is also needed for starting
    the rescue system.


    **Rescue disk** This disk contains a special environment that allows you to perform
    maintenance tasks in your installed system, such as checking and repairing file
    system and updating the boot loader.


    To start the rescue system, boot with the standard boot disk and select ‘Manual
    Installation’, ‘Start Installation/System’, and ‘Rescue System’. You will be prompted
    to insert the rescue disk. If your system was configured to use special drivers
    (such as RAID or USB), you might need to load the respective modules from a module
    disk.


    **Module disks** Module disks contain additional system drivers. The standard
    kernel only supports IDE drives. If the drives in your system are connected to
    special controllers (such as SCSI), load the needed drivers from a module disk.


    +   * USB modules

    This floppy disk contains the USB modules you might need if USB drives are connected.

    * IDE, RAID, and SCSI modules'
