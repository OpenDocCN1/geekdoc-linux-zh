  md: '# KDE and SuSE Menu Structure


    The SuSE KDE packages include two menus: the normal K menu and the extended SuSE
    menu. The K menu is the “traditional” menu, which only contains KDE applications.
    The arrangement of the SuSE menu is a little different. This menu is set by default
    at the first start-up. The SuSE menu contains all KDE programs and more. For example,
    you can start all installed GNOME and X applications from here. The menu is sorted
    into the categories: development, games, graphics, Internet, multimedia, office
    programs, settings, system, and tools. Also find entries for the SuSE help system,
    the Control Center, and so on.


    Switch from one menu to another in the Control Center ‘Look&Feel’ → ‘Menu settings’.
    Here, also integrate additional menus for the start panel, such as the task menu
    or the administrator menu. These offer a presorted listing of frequently used
    applications. Basically, all KDE applications are accessible from the K menu as
    well as from the SuSE menu. Decide for which menu structure you prefer.


    # The Applets: Miniprograms


    The panel also provides space for applets, which can be embedded there. For instance,
    display the time of day. Figure 5.2 shows, from left to right, switch, quickstarter,
    system monitor, eyes, newsticker, the system section of the panel, and clock.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_136_0.png)


    Next to every applet is a small arrow that opens a menu. The applet can be moved
    or deleted. The menu can also be used to open a settings dialog if one exists
    for that program. To add similar useful applications, right-click an open space
    and select ‘Add’ → ‘Applet’.


    # The Taskbar


    The taskbar helps to quickly and easily jump between open applications. Sort the
    applications to desktops or group respective windows together. Select ‘Look&Feel’
    → ‘Taskbar’ in the Control Center and select the different options settings.


    # The Switchboard


    KDE provides multiple desktops. Configure up to sixteen “virtual desktops” to
    which you can easily assign specific names.'
  merge: -1
