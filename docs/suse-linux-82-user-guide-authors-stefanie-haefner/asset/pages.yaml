    # Mounting, Shell, and Other Topics


    +   - How do I read my media (CDs, floppy disks, ZIP, etc.) with Linux?

    In KDE, click the icon (CD, floppy disk, or ZIP) to open a window with the corresponding
    content. KDE actually mount in the background to bind the selected medium to your
    system. Because the medium is mounted, it needs to be unmounted before it can
    be ejected.


    Why is this necessary?

    This might seem a Linux oddity at first, but it is actually quite practical. To
    a Linux file system, it does not matter what kind of medium is mounted in: whether
    it is a floppy, a DVD, a hard disk, or a ZIP disk. By mounting them, they are
    registered with the system. On a system available to many users, this is important,
    because several users and several programs can access the same directory at the
    same time.


    Imagine that someone came to your office and exchanged the drawers in your desk
    because he needed to work for an hour. When you come back after a while, you cannot
    find that draft contract must be ready'
