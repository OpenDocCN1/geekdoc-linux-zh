  md: '# Starting Your System from the CD-ROM


    Insert the first SuSE Linux CD or the DVD into the drive. Then reboot the computer
    to start the installation program from the medium to the drive.


    # Possible Problems When Starting from the CD/DVD


    If your computer does not boot from CD, there may be several causes:


    +   - The CD-ROM drive is not able to read the boot image on the first CD. In
    this case, use CD 2 to boot the system. CD 2 contains a conventional 2.88 MB boot
    image, which can be read even by older drivers.


    +   - The boot sequence as set in the computer''s BIOS is not correct. Information
    about changing the BIOS settings are provided in the documentation of your motherboard,
    and in the following paragraphs.


    The BIOS is a small set of software routines to activate the basic functions of
    a computer. The BIOS is provided by motherboard manufacturers and is specially
    made to work with the features of the board.


    Normally, the BIOS setup can only be accessed at a specific time — when the machine
    is booting. During this initialization phase, the machine performs a number of
    diagnostic hardware tests. One of them is a memory counter, recognizable from
    the memory counter. Try to catch this moment when the counter appears and for
    a line telling you about the key that must be pressed to enter the BIOS setup.
    This line is usually below the counter or somewhere at the bottom. Usually the
    key to be pressed is either `Del`, `F1`, or `Esc`. Press this key to enter the
    BIOS setup.


    To boot the sequence in an AWARD BIOS, look for the ''BIOS FEATURES SETUP'' entry.
    Other manufacturers may have a different name for this, as ''ADVANCED CMOS SETUP''.
    When you have found the entry, select it and confirm with `Enter`


    In the screen that appears, look for a subset called ''BOOT SEQUENCE''. The boot
    sequence will often be set to something like C, A or C. In the former case, the
    machine first searches the hard disk (C) then the floppy drive (A) to find a bootable
    medium. You should be able to change the settings by pressing `Page Up` or `Page
    Down` until the sequence is A, CDROM, C.


    You can leave the BIOS setup screen by pressing `Esc`. To save the changes, select
    ''SAVE & EXIT SETUP'' or press `F10`. To confirm that your settings should be
    saved, press `Y`.'
