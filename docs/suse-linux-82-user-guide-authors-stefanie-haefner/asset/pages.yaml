  md: '# Changing Ownership Permissions


    Other important commands to control the ownership and permissions of the file
    system''s components are chown (change owner) and chgrp (change group). The command
    chown can be used to transfer ownership of a file to another user. However, only
    root is permitted to perform this change.


    Suppose that the file Roadmap from the example 2 on page 312 should no longer
    belong to tux, but to the user geeko. The command root should execute is:


    chgrp is also fairly self-explanatory — it changes the group ownership of the
    file. However, the owner of the file must be a member of the new group. In this
    way, the user tux from page 311 can switch the group owning the file ProjectData
    to project4, as long as he is a member of this new group, entering


    ```

    newbie@earth:~ ~ chgrp project4 ProjectData

    ```


    # The Setuid Bit


    In certain situations, the access permissions may be too restrictive. Therefore,
    Linux has additional settings that enable the temporary change of the current
    user and group identity for a specific action.


    For example, the cdrecord program normally requires root permissions to access
    the writer for CDs (or DVDs). Thus, a normal user would not be able to create
    CDs, as it would be too dangerous to grant all users direct access to all devices.


    A possible solution to this problem is the “setuid mechanism”. setuid (set user
    ID) is a special file attribute that instructs the system to execute programs
    accordingly under a specific user ID. Consider the cdrecord command:


    Set the setuid bit with the command chmod:


    The following command assigns the cdrecord program to the group users: The following
    access permissions are granted:


    By means of the setuid bit, all users belonging to the group users will be able
    to use the program. In effect, this means that the program is executed as root.'
