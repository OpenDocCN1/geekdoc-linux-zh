  md: '# Good Lighting for Productive Work


    Generally speaking, workplace lighting does not come close to the intensity of
    light outdoors. This difference is unnoticed unnoticed because the human faculty
    of perception is very flexible. The influence of lighting conditions on our own
    efficiency is often underestimated. If the light is too bright, you cannot see
    what is on the screen. If it is too dark, sharpness of vision decreases. The wrong
    lighting overrains the visual system and, eventually, causes symptoms of fatigue
    and stress.


    It is assumed that a combination of general lighting and individual lighting is
    best. For the workstation at home, the combination of a high-powered ceiling lamp
    (500 watts, preferably with a dimmer) and one or two workplace lamps is recommended.
    The fluorescent lamps usually found in offices for general lighting should be
    supplemented by individual workstation lamps. The lighting should, not be too
    intense and individually adjustable. Stark contrasts should be avoided. Be careful
    with strong desk lamps. Good illumination is, unfortunately, very expensive and
    the minimum requirements of lighting can also be fulfilled with cheaper illumination
    layers.


    +   - It is important that you are exposed to daylight. A view outside is important.


    +   - General lighting is considered pleasant if it is not below 250 lx (usually
    500 lx is required, 1000 lx for an open plan office).


    +   - 500–750 lx should be emitted by the individual workstation lighting. However,
    individual lamps are often problematic. If they are too strong, the contrast to
    the general lighting is too great. Harmonic, soft transitions are considered more
    pleasant.


    +   - The lighting should not flicker. In the case of worn-out fluorescent lamps,
    a flickering can sometimes be be noticed from the corner of the eye.


    +   - Avoid dark shadows.


    +   - Ceiling lights should emit light diagonally from above. Lighting strips
    should be set perpendicular to the screen table. The line of sight at the screen
    table thus run parallel to the lighting strips.


    +   - Whether the lighting is considered to be pleasant depends on the color temperature
    and light color of the lamp type. Warm white or neutral white is recommended.'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'The light requirement depends not only on the working task, but also on age:
    older people need more light. The fact that older people-have only a small lamp
    in their homes has nothing to do with their light requirement, but rather with
    the fact that they want to save electricity.


    A screen workstation near daylight requires optimum shielding against direct and
    reflex glare, especially when the line of sight is directly out the window or
    at a 45 degree angle to it. The built-in antiglare facilities should be variable.
    Under no circumstances should artificial illumination cause reflex glare on the
    screen.


    # Optimum Climate


    The room climate determines our well-being to a great extent. Problems arise often
    if it is too cold, too warm, drafty, or too dry. Low humidity can lead to burning
    eyes, dry mucous membranes, skin irritations, and increased susceptibility to
    colds. Things get complicated when people work in the same room accommodated to
    different base temperatures. For your well-being, it is important to observe the
    recommended basic values for temperature and humidity and avoid strong air movement.
    The working material itself should not contribute to the increase of temperature.


    +   - For activities in a sitting position or simple work, a room temperature
    of 20 to 22°C is recommended. In summer, the temperature should be 26°C at the
    most. This value should only be exceeded for a short time when the outdoor temperature
    is higher.


    +   - A lot of equipment, as well as people, emit heat and influence room air
    conditions. This should be reduced as much as possible.


    +   - The air humidity should be between 40 (sometimes 50) and 65 percent and
    should be checked. This value is especially affected by heating systems.


    +   - Draft (possibly from open windows and doors or air conditioning) should
    not exceed 0.1 to 0.15 m/s. Draft on individual parts of the body should be avoided.


    +   - An air conditioner should be individually adjustable. It should be serviced
    regularly.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '+   The windows should be able to be opened and have sunshades to avoid glare
    effects. Sunlight can increase the room temperature considerably. Sunshades attached
    to the outside of the building provide the best protection.


    +   Plants can improve room conditions and are therefore recommended in all cases.
    They increase the relative humidity and filter pollutants from the air.


    # Too Much Noise Causes Stress


    Noise is a physically powerful stress factor. Although it is often played down,
    too much noise makes you ill. Apart from health impairments, such as deafening
    hearing, vegetative disorders, and psychic changes, noise affects our efficiency
    by impairing our ability to concentrate. Furthermore, can reduce working motivation.
    The fact that proper noise abatement can possibly cost a lot of money is also
    problematic.


    A working environment improves efficiency. Work at terminal workstations is often
    characterized as “mental activity”. Therefore the maximum load value for scientific
    work or programming is 55 dB (A). The dB (A) represent a weighted evaluation of
    the acoustic pressure. The A-filter curve resembles human perception. An increase
    of the sound level by 10 dB (A) is normally perceived as a duplication of volume.


    +   Because mainly mental work is done at terminal workstations, quiet working
    materials should be used from the start.


    +   The maximum limiting value for office work is 55 dB (A). With especially high
    mental demands or necessary communication of language, as low as 35–45 dB (A)
    is required. This is the case, for instance, for specialized work, scientific
    work, or programming.


    +   Furthermore, the evaluation level of a maximum of 55 dB (A) is important.
    If 70 dB (A) is measured for a quarter of an hour, the noise in the remaining
    time should be less than or equal to 55 dB (A).


    +   Workstations can be equipped with partitions, sound-absorbing floors, appropriately
    wallpapered walls, curtains, and other sound-reducing features.


    +   Loud working equipment, such as matrix printers, should be installed in sound-absorbing
    cases. The permissible noise levels for office equipment are determined in the
    DIN standards.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '- An air conditioner should not increase the normal noise level.


    - Strain caused by excessive noise can also be reduced by an organizational restructuring
    of work.


    # # Office Equipment


    # ## Buying a Screen


    If you already have poor sharpness of vision, low-quality screens can make things
    even worse. Apart from eye problems, tenseness, fatigue, and many other disorders
    can be caused.


    The latest technological developments are triton, black-matrix, screens and TFT
    flat screens. Unfortunately, flat screens are still relatively expensive. There
    are extensive standards that regulate the readability of the depicted information.
    When buying a screen, it is recommended to study the extensive standards to avoid
    a wrong purchase. One thing is certain: a good screen is usually expensive. The
    normal tube screens do not last forever. They only retain their focus and contrast
    for a few years.


    +   - All depicted characters must be sharply defined and clearly legible up to
    the edges of the screen. A positive representation (dark characters on a light
    background, such as in a book) is recommended.


    +   - As the depicted characters must be large enough, a 17-inch monitor is recommended,
    at least for graphical user interfaces (like KDE). For the processing of CAD,
    layout, and graphics, it should be 21 inches.


    +   - It is especially important that the screen does not flicker. In concrete,
    the minimum sync frequency with 15-inch monitors should be at least 73 Hz. However,
    85 Hz is recommended. For larger screens, such as 21-inch, 100 Hz is a good value.


    +   - Luminosity and contrast should be variable. The focus of the characters
    should not differ with adjustments of brightness or contrast.


    +   - The image should be free from distortion and show no color errors.


    +   - To avoid reflex glare, a good antirelective coating of the screen surface
    is recommended.


    +   - The screen should be rotatable and inclinable. A vertical adjustment is
    recommended.'
  merge: -1
  pgno: 178
- img_proc: true
  md: "+   Colors make the displayed information easier to comprehend. However, the\
    \ display of colors can also be straining for the eyes because different colors\
    \ are refracted differently by the lenses. For red colors, people are farsighted,\
    \ but for blue people are nearsighted. Older screens often have convergence errors\
    \ — the three beams of the screen tube are no longer aligned precisely, so colored\
    \ borders appear around letters, for example.\n\n+   Electromagnetic radiation\
    \ emitting from the screen should be kept to a minimum.\n\n+   \n\n# Screen Location\n\
    \nA screen put in the wrong place leads to a cramped posture at work, which can\
