    +   28. My computer crashed. Can I just press the button without risking any-thing?


    If your computer no longer reacts to your mouse or keyboard, this does not necessarily
    mean that your whole system has crashed. Possibly one program is blocking the
    mouse or the keyboard, but all other programs are still running. If your machine
    can be accessed remotely (serial terminal, network), log in elsewhere and abort
    the respective program with killall (programname). If this does not work, killall
    -9 (programname).


    If this is not possible, try switching to another console using (Ctrl + Alt) +
    (F2) to kill the faulty process from there. If the computer does not respond to
    any of the keys and network intervention is not possible, wait at least ten seconds
    before pressing reset to make sure there is no hard disk activity.


    +   29. How can I switch from a virtual text console to the graphical user interface?


    By default, there are six virtual text consoles that can be accessed with (Ctrl
    + Alt) + (F6). Press (Alt + F7) to go to the graphical user interface.'
