  md: '# # Typographical Conventions


    The following typographic conventions are used in this book:


    | Example | Meaning |

    | --- | --- |

    | YaST | programs |

    | /etc/passwd | files or directories |

    | (placeholder) | replace the character string placeholder (including the angle
    brackets) with the actual value |

    | PATH | an environment variable called PATH |

    | 192.168.1.2 | the value of a variable |

    | ls | commands |

    | user | users |

    | earth:~ # ls | enter the command ls in the shell of the user root in his home
    directory on the host “Earth” |

    | newbie@earth:~ > ls | enter the command ls in the shell of the user newbie in
    his home directory on the host “Earth” |

    | C:\> fdisk | at the DOS prompt, enter the command fdisk this key; keys to press
    sequentially separated by spaces |

    | Ctrl + Alt + Del | keys to press simultaneously connected with a ‘+’ |

    | "Permission denied" | system messages |

    | ‘System update’ | menu item or button text ‘System update’ |

    | #boot | reference to an entry in the glossary in the appendix |'
