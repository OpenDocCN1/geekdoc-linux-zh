- img_proc: true
  md: '# Caution


    Setting the setuid bit for a program makes your computer more vulnerable to attacks.
    Only do this in exceptional cases when you know the program will run under the
    ID under which it was saved, and are aware of the potential risks.


    # Caution


    # The Setgid Bit


    The setuid attribute applies to users. However, there is also an equivalent property
    for groups – the setgid attribute. A program for which this attribute was set
    will run under the group ID under which it was saved, no matter which user starts
    it.


    Therefore, in a directory with the setgid bit, all newly created files and subdirectories
    will be assigned to the group to which the directory belongs.

    To set the setgid bit, use the command:


    ```

    earth:~# # chmod g+s /test

    ```


    Subsequently, the access permissions appear as follows:


    ```

    earth:-# # ls -ld /test

    drwxrwxrxr-- 2 root archive 48 Nov 19 17:12 backup

    ```


    # The Sticky Bit


    Apart from the setuid and setgid bits, there is the “sticky bit”. It makes a difference
    whether it belongs to an executable program or a directory. If it belongs to a
    program, a file marked in this way will be loaded to the RAM to avoid getting
    it from the hard disk each time it is used. Nowadays, this attribute is used rarely,
    as modern hard disks are fast enough.

    If this attribute is assigned to a directory, it will prevent users from deleting
    each other''s files. Typical examples include the /tmp and /var/tmp directories:


    ```

    earth:~# # ls -dl /tmp

    drwxrwxrwt 2 root root 1160 2002-11-19 17:15 /tmp

    ```'
  merge: -1
  pgno: 336
