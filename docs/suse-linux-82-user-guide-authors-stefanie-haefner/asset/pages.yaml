  md: '# Creating Texts without the AutoPilot


    Create a new text document by simply clicking ''File'' → ''New'' → ''Text Document''.
    You can now start writing. When opening a new document, a sidebar (the object
    bar) is displayed below the standard function bar. Use these buttons to format
    your text. Documents can also be formatted with the Stylist, described in Working
    with the Stylist on page 170.


    # Selecting Text


    To select text, click and hold at the beginning of the desired range and move
    the cursor to the end of the range. Selected text appears inverted. After selecting
    the desired text, release the mouse button. Clicking the right mouse button opens
    a context menu.


    The context menu allows the modification of the font type, the font style, and
    other settings. Undesired changes can be undone immediately.


    The Navigator only displays lots of information about the content of a document
    but also allows for precise navigation to various locations within the document.
    As an example, the Navigator in Writer provides a quick overview of the available
    chapters. It also provides information about included images. Figure 9.4 on the
    next page shows the Navigator in Writer.


    The content of the Navigator varies depending on the type of the document. Open
    it by clicking ''Navigator'' in the ''Edit'' menu.


    # Working with the Stylist


    The Stylist enables you to format texts comfortably and quickly. Open or close
    it at any time by ''Format'' → ''Stylist'' or by pressing (F11). Figure 9.5 on
    page 172 shows the dialog window of the Stylist.


    A style is a designated assignment of predefined formatting, such as paragraph
    indents, text style, text color, and font size.


    > Tip

    If the box in the lower part of the Stylist is set to ''Automatic'', OpenOffice
    tries to ''guess'' which styles could be useful for the current context. If ''All''
    is set, all styles of this group are listed.


    Text can be hard-formatted or soft-formatted:'
  merge: -1
  pgno: 191
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_192_0.png)


    Figure 9.4: The Navigator in Writer


    **Hard formatting** A text attribute is *directly* assigned to a text area. It
    is called hard because it is *hard work* to change.


    This procedure is only useful for short texts (short letters, articles, and the
    like), but it is a quick and intuitive method.


    **Soft Formatting** The text is not formatted directly, but is assigned a style,
    a change of the style automatically results in an update of the text to which
    it is assigned.


    This approach is useful for larger texts (theses, books, and the like). Although
    not as intuitive, it is very effective and fast if the formatting is changed extensively.
    It provides a substantial advantage for trying layouts.


    The Stylist offers various styles for diverse formatting needs:


    **Paragraph Styles** Indents, spacing, hyphenation, tabs, alignment, fonts, initials


    **Character Styles** Font, font size, language


    **Frame Styles** Position, anchoring, frame'
