    can be found in File Commands on page 323


    +   2. I cannot get my CD out of the drive. What should I do?


    First, unmount the CD. This is done with the unmount command. More information
    about this can be found in File Commands on page 323. In KDE, just right-click
    the CD-ROM Icon and select ''Unmount Drive''. If YaST is running on your computer,
    exit it.


    +   3. How can I find how much space is available in Linux?


    With the df -hT command. See System Commands on page 323.


    +   4. Can I copy and paste in Linux?


    Yes, this is possible. To copy and paste in the text mode, you must have gvim
    running. In the X Window System and in the text mode, highlight the text block
    by clicking and dragging with the left mouse button then insert by clicking with
    the middle mouse button. The right mouse button has a special function in most
    programs and applications.


    +   5. Do I need to be afraid of a virus in Linux?


    In Linux, there have been no serious viruses found. Also, viruses can cause any
    serious damage if they are not activated by root. The only scanners available
    in Linux serve to send e-mails for Windows viruses (if Linux is being used as
    a router or server).


    +   6. Do I need to compile a kernel myself?


    No, this is unnecessary. The kernel has become so large that there are about eight
    hundred options to consider during the configuration. Because it is almost impossible
    to master all possible configurations and their effects, it is strongly discouraged
    for inexperienced users to recompile the kernel. Do so only at your own risk.
    In cases of custom compiled kernels, SuSE cannot provide any installation support.


    +   17. Where can I see the system messages? In a terminal window, follow the
    following command as root: tail -f /var/log/messages'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'Additional interesting programs relating to this one are top, procinfo, and
    xosview.


    Use the command

    view the boot messages.


    +   18. I cannot log in to my computer with telnet. I always get the answer "Login-incorrect".


    You are probably trying to log in as root. For security reasons, this is not possible
    via telnet by default.


    With YAST2, set up a normal user account. Log with this user name. Then change
    to the user root with su. It is much better and safer, however to use the program
    ssh instead of telnet. The ssh program uses encoded, secure connections.


    +   19. How do I connect to the Internet in Linux?


    KInternet — Connecting to the Internet on page 121 provides information about
    this.


    +   20. I found a bug in SuSE Linux. Where should I report it?


    First, ascertain whether it is actually a bug in the program or just an error
    in operation or faulty configuration settings. Read the documentation in /usr/share/doc/packages
    and /usr/share/doc/howto. The bug may have been discovered. Check in the support
    database at http://sdb.suse.de/sdb/en/html/. Enter a keyword or work your way
    forward or backward via the "History" link. If it really is a bug, send a description
    of it by e-mail to feedback@suse.de.


    +   21. How can I install applications?


    Applications included in the SuSE Linux CDs are best installed with YAST2.


    +   22. I "only" have an application in source code. How can I install it?


    Some-how is required with some applications. Find more information in a good Linux
    book.


    Briefly, decompress the archive with tar xvzf name.tar.gz, read the README files,
    and follow the instructions. Usually, the following command sequence needs to
    be executed:

    ./configure;make;make install. We cannot offer any installation support for the
    phases of compilation or for self-compiled programs.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# 23. Is my hardware supported?


    It is best to refer to the component database at http:

    ://hardwedb.suse.de


    //hardwedb.suse.de or http://cdb.suse.de.

    less /usr/share/doc/howto/en/Hardware-HOWTO.gz can also

    provide some information.


    # 24. How can I defragment my hard disk?


    Linux has an intelligent file system. This file system defragment-

    superfluous, because it prevents fragments from occurring. Your

    partitions should not be more than ninety percent used. Use df -h to

    view information about used and available hard disk space.


    # 25. What is meant by partitioning?


    Partitioning means dividing the hard disk into individual sections.

    Windows and MacOS are also located in their own partitions. For the

    default configuration, SuSE Linux requires at least two partitions (one

    for Linux itself and one swap partition for the virtual main memory).


    # 26. How much space do I need for Linux?


    This depends on how many and which packages you want to install.

    A standard installation with office applications requires about 1 GB. 2

    GB is recommended if you need space for your own data as well.

    install just about everything, you need 3 GB to 6 GB, depending on the

    version.


    # 27. I need more space for Linux. How can I add another hard disk?


    To make more space available, integrate a new hard disk or parts of

    (i.e., partitions) into your Linux system at any time. For example, if

