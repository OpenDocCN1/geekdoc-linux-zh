  md: 'command line tool capisitefax is available for the sending of faxes. It accepts
    one or more target fax numbers and one or more documents in the PostScript format.
    This format is generated by virtually all Linux applications when printing to
    a file.


    capisitefax accepts the following parameters:


    +   - -h or --help Returns a short summary of valid parameters.

    - -d <number> or --dialing=<number> This parameter declares the target number
    to which the fax should be sent.

    - -q or --quiet capisitefax usually generates a few informative messages. This
    option suppresses this and only allows the display of possible error messages.


    The following command would send the two documents document1.ps and document2.ps
    to the target number 089123456:


    ```

    capisitefax -d 089123456 document1.ps document2.ps

    ```


    capisitefax converts the documents into the correct format and stores them with
    a description file in a special folder from which they are fetched and sent by
    CAPISuite. This is why there could be a short delay between running the command
    and the actual sending. The user receives an e-mail once the fax has been successfully
    sent or when a set of attempts have failed.


    Faxes can be comfortably sent from any KDE application with the assistance of
    the KDEFax utility. KDEFax should be configured in the following way for:


    +   - KDEFax. This can be done, for instance, by pressing (Alt + F2) and entering
    kdeprintfax.

    - Select ‘Settings’ → ‘Configure KDEFax’.

    - Click the ‘System’ icon in the left pane.

    - Because capisitefax is predominantly compatible with the HylaFAX suite, select
    ‘Use HylaFAX system’ here.

    - Alter the command line entry to /usr/bin/capisitefax -d %number %files.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_263_0.png)


    Figure 15.5: Configuring CAPISuite in KDEPrintFax


    +   - Finish the configuration by clicking ''OK'' and closing KDEPrintFax.


    The option ''Send to Fax'' is then available in the ''Print'' menu of any KDE
    application. Selecting it starts KDEPrintFax, which requests the target phone
    number and sends the fax.


    Non-KDE applications can also use this function if they allow the manual setting
    of the printing command. The commonly used `lpr` should then be replaced with
    `kprinter`, which makes the KDE printing menu appear along with its faxing capability.


    > > Caution

    capisuitefax does not support the complete set of HylaFAX features. This means
    that advanced features, like the resolution setting, are currently silently ignored.'
