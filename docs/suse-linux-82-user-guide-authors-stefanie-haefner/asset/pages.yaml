  md: '# The Web Browser Galeon


    Recently, the widely-used web browser has been transformed into a real “jack of
    all trades”. The fact that today’s Internet applications feature such depth in
    integration and are heavily integrated into their corresponding desktop environments
    is almost taken for granted. Users of outdated machines soon feel the effects
    of this development. All-around browsers are often memory-eaters, sluggish in
    their operation, and occupy thirty megabytes of the hard disk.


    That is why the idea behind Galeon is to devote itself just to one assignment:
    the web and only the web. Galeon implements the speedy “Gecko” engine of the Mozilla
    browser and integrates this into a slick, extremely functional user interface.
    The application loads quicky and is one of the fastest browsers available.


