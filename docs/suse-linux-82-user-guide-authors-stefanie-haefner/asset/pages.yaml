  md: '# NFS Client and NFS Server


    You need these two tools only if you are located in a network. In this case, you
    have the possibility to operate a file server that can be accessed by members
    of your network. On this file server, make programs, files, or storage space available
    for users. Use the ''NFS Server'' module to set up your computer as an NFS server
    and to determine which directories to export for the network users. The NFS server
    should be set up by an expert. To configure an NFS server, refer to the brief
    instructions in the Administration Guide under Linux in the Network: NFS.


    Subsequently, any user (with the needed permissions) can mount these directories
    in his own file tree. The easiest way to do this is by means of the ''NFS Client''
    module, in which the user merely needs to enter the host name of the computer
    acting as NFS server and the mount point on his computer. To do this, select ''Add''
    in the first dialog and enter the data source (see Figure 4.20).


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_110_0.png)


    Figure 4.20: Configuration of NFS Clients


    # Routing


    This tool is only needed if you are located in a local network or are connected
    to the Internet by way of a network card, as is the case with DSL. As indicated
    in DSL on page 84, for DSL the gateway data is only needed to configure the network
    card correctly. However, the entries are dummies that do not have any function.
    The value is important only if you are located in a local network and use your
    own computer as gateway (the gateway to the Internet).'
  merge: -1
  pgno: 110
