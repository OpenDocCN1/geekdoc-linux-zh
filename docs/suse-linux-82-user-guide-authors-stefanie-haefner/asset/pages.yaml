    # # Mouse


    If YaST did not detect your mouse type automatically, press Tab several times
    until ''Mouse'' is selected. Then use Space to open the dialog in which to set
    the mouse type. This dialog is shown in Figure 3.5 on page 21.


    To select the mouse type, use Up and Down. Consult the mouse documentation for
    information about the mouse type. After selecting a mouse type, use the key combination
    Alt+1 to test whether the device works correctly without selecting it permanently.
    If the mouse does not behave as expected, use the keyboard to select another type
    and test again. Use Tab and Enter to make the current selection permanent.


    # # Partitioning


    In most cases, YaST proposes a reasonable partitioning scheme that can be accepted
    without change. If desired, modify this scheme to meet your needs or create a
    new one.


    # # Partition Types


    Every hard disk has a partition table with space for four entries. Each entry
    in the partition table can be a primary partition or an extended partition. Only
    one'
  merge: -1
  pgno: 40
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_41_0.png)


    Figure 3.4: Suggestion Window


    extended partition entry is allowed, however.


    Primary partitions consist of a continuous range of cylinders (physical disk areas)
    assigned to a particular operating system. Using primary partitions, we could
    not set up more than four partitions per hard disk. More do not fit in the partition
    table.


    This is why extended partitions are used. Extended partitions are also continuous
    ranges of disk cylinders, but an extended partition may itself be subdivided into
    logical partitions. Logical partitions do not require entries in the partition
    table. In other words, an extended partition is a container for logical partitions.


    If you need more than four partitions, create an extended partition. This extended
    partition should span the entire remaining free cylinder range. Create multiple
    logical partitions within the extended partition. The maximum number of logical
    partitions is fifteen on SCSI disks and 63 on (E)IDE disks.


    It does not matter which type of partitions are used for Linux. Primary and logical
    partitions both work fine.'
