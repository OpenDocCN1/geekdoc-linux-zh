    to provide a reminder before your appointment under the ''Reminder'' tab. If the
    appointment occurs regularly, set that under ''Recurrence''. Click ''Save and
    Close'' after all settings are made. The new appointment will be shown in your
    calendar.


    # Scheduling a Meeting


    To schedule a meeting with other people, click ''New Appointment'' then select
    ''Actions'' -> ''Schedule Meeting''. Enter information like for an appointment.
    Under ''Meeting'', add attendees. For those in ''Contacts'', click ''Invite Others...''
    and select attendees from the dialog. When finished, click ''Save and Close''.
    The attendees will be sent an en-mail about the scheduled meeting.


    This system can also be used to schedule a time that fits all attendees or to
    reserve resources. For more information about using the scheduling functions,
    refer to the internal help.


    # Adding Tasks


    Evolution can be used to keep track of a list of things to do. To add a new task
    to your list, click ''New Task''. Enter summary information, your due and start
    dates, and a description. Enter task status and other information under ''Details''.
    Click ''Save and Close'' to add the task to your list. Double-click the task to
    reopen the dialog and make changes or mark it completed.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Contacts


    # Adding Contacts


    Along with the name and e-mail address, Evolution can store other address and
    contact information about a person. To quickly add the name and e-mail address
    of someone who has sent you an e-mail, right-click the underlined address in the
    message preview. Select ''Add to Contacts''. To enter more information, click
    ''Edit Full''. Otherwise, click ''OK''. If you have selected ''Edit Full'', click
    ''Save and Close'' when finished.


    To enter a completely new contact, click ''New Contact'' in the ''Contacts'' view.
    Enter all desired contact information. Click ''Save and Close'' when finished.


    # Making a List


    If you frequently send messages to the same group of people, make this easier
    by creating a list. Click ''New List'' when in ''Contacts'' view. Enter a name
    for the list. Add addresses by typing the address in the box then clicking ''Add''
    or dragging contacts from the Evolution Contacts view and dropping them in the
    box. Toggle ''Hide addresses'' to select whether or not the recipients you can
    see has received the message. Click ''Save and Close'' when finished. The list
    is now one of your contacts and will appear in the composition window after the
    first few letters are typed.


    # Sharing Contacts


    To send contact information from your address book to another Evolution user,
    right-click the contact to forward. Select ''Forward Contact''. This sends the
    contact ''card'' as an attachment in an e-mail. Compose and send this message
    as usual.


    To add a contact you have been sent, view the contact inline. Click ''Save in
    addressbook'' to add the complete contact card to your address book.


    # Using the Address Book in Evolution


    By means of the LDAP protocol, Evolution can access public address books, such
    as those used by SuSE Linux Openexchange Server or Microsoft Exchange. Evolution
    offers full access to these address books. It can read them and add new entries.'
  merge: -1
