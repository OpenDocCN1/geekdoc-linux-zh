  md: '# Users and Access Permissions


    Since its inception in the early 1990s, Linux has been developed as a multiuser
    system. Any number of users can work on it simultaneously. This resulted in some
    notable distinctions from the Microsoft end-user Windows operating systems.


    The most important distinguishing feature is the necessity for users to log in
    to the system before starting a session at their workstation. Each user has a
    user name with corresponding password. This differentiation of users guarantees
    that unauthorized users cannot see files for they have no permission. Larger changes
    to the system, such as installing new programs, are also usually impossible or
    restricted for normal users. Only the root user, or “Superuser”, has the unrestricted
    capacity to make changes to the system and with unlimited access to all files.
    Those who use this concept wisely, only logging in with full root access when
    necessary, can cut back the risk of unintended loss of data. Because under normal
    circumstances only the super user can delete system files or format hard disks,
    the threat from the “Trojan effect” or from accidentally entering destructive
    commands can be significantly reduced.


    # File System Permissions


    Basically, every file in a Linux file system belongs to a user and a group. Both
    of these proprietary groups and all others can be authorized to write, read, or
    execute these files.


    A group, in this case, can be defined as a set of connected users with certain
    collective rights. For example, call a group working on a certain project3. Every
    user in a Linux system is a member of at least one proprietary group, normally
    users. There can be as many groups in a system as needed, but only root is able
    to add groups. Every user can find out, with the command groups, of which he is
    a member.


    # File Access


    Look at how permissions are organized. Initially, concentrate on files only. Permission
    information can be displayed with the command ls -l. The output could read like
    this:


    ```

    -rw-r---- 1 tux project3 14197 Jun 21 15:03 Roadmap

    ```


    Output 1: Sample Output Showing File Permissions'
