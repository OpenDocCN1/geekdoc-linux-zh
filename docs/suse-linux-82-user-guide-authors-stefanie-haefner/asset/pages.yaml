- img_proc: true
  md: '# A more effect


    Figure 19.3: Character Recognition Results


    # Hardware


    Your scanning equipment and PC are probably far removed from those of a professional
    graphic design agency. Unfortunately, price is also a factor in the performance
    of these devices. Good hardware is required for successful and convenient scanning.
    36-bit scanners provide richer colors and gray scales than 24-bit scanners. SCSI
    scanners and, more recently, an increasing number of USB scanners are supported
    by SANE in Linux. Because of their overall better quality, purchasing a SCSI device
    is recommended. The configuration of a USB scanner with YoST2 has become really
    simple.


    Some companies offer Linux drivers for parallel port scanners. However, the functionality
    and quality is quietly unknown. If using a SCSI scanner, you need a controller
    for it. Most SCSI scanners are sold together with a simple controller card of
    minimal functionality. Refer to the web pages of the SANE project before buying
    a scanner to check the development status of the available-drivers.


    Large images — manipulated or in their original format — may, under certain circumstances,
    require extensive memory space. Therefore, your computer should have at least
    64 MB RAM, preferably 128 MB or more. The faster the CPU, the quicker your data
    can be processed. However, you do not need a high-end device. A middle-of-the-road
    one should do for house-use. For an adequate display of the images on your desktop,
    you will also need a graphics card capable of depicting the right color depth
    in high resolutions.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Resolutions


    A scanner resolution of 75 to 100 ppi is sufficient for scanning a simple photograph
    and viewing it on your screen. Screens usually have a default resolution of 75
    dpi. A higher ppi value for scanning only uses more storage space without enhancing
    the screen display.


    If you are not yet sure how to use your image later or if you want to create an
    image file, scan with a resolution of 150 ppi. A higher resolution often leads
    to immense memory consumption. There may be times when you would want to scan
    a section of an image with a higher resolution, but this is not needed for normal
    photographs. Most graphics applications can save an image with lower resolution
    if needed.


    To scan an image at a ratio of 1:1 for a printout, it is generally recommended
    to set the scanner resolution to 1.6-2 times the printer resolution generally
    recommended. A normal laser printer usually produces 75 lpi. If you have a printout
    of this type, you should set 120 to 150 ppi for scanning according to this multiplication
    factor. To generate images for display on the Internet, the default resolution
    of 75 dpi is sufficient.


    To print your enlargements, you will need an extremely high dpi setting. When
    making the enlargement, the scanner resolution should be multiplied by the magnification
    factor. Doing this, you will quickly approach the interpolated resolution range.
    Using the example above, a five-fold magnification would require ppi settings
    of 750 or more. As scanners usually cannot reach such high physical dpi values,
    the values are calculated by the software.


    > Note The printer resolution is usually stated in dpi ("dots per inch"), the
    halftone resolution of the printer in lpi ("lines per inch"), and the scanner
    resolution in ppi ("pixels per inch").


    # Adjusting Brightness and Contrast


    The desktop display does not necessarily reflect the actual print results. It
    is only an approximation. It is generally recommended to set slightly higher brightness
    and contrast values for a black-white or color printout. You do not have to specify
    these values when scanning unless you want to print the scanned image directly.
    Otherwise, wait to make these settings later in The GIMP.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Strange Patterns in the Image


    When scanning documents from print (books, magazines, newspapers), the individual
    pixels that comprise the image may produce a “Moiré pattern”. Kooka cannot remove
    this pattern. In The GIMP, find a filter for removing the Moiré pattern under
    ‘Filter’ → ‘Enhance’ → ‘Despeckle’. It works at the cost of a certain degree of
    clarity.


    > Tip If your scan produces a repeating pattern, try rotating the document five
    to ten degrees and scanning it again. Later, reset the image to its original orientation
    in The GIMP. Often, this gives better results than using the enhancement filter
    to despeckle.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Graphics with The GIMP


    GIMP (GNU Image Manipulation Program) is a very powerful program for the processing
    of pixel graphics. GIMP is the first choice for retouching or modifying photographs
    and other image files. Once you are familiar enough with the program, you will
    even be able to create entire images from scratch. An average user, however, will
    not need all of the powerful functions of GIMP. It can even be used for free-style
    painting. All tools, such as brush, pencil, or airbrush, are available (see Figure
    20.1 on the next page). Frequent users of these features should definitely consider
    acquiring a graphics tablet.


    +   Image Processing and Graphics Formats . . . . . . . . . . . . 283

    Using The GIMP . . . . . . . . . . . . . . . . . . . . . 284

    Working With The GIMP . . . . . . . . . . . . . . . . . . . . 291

    Introduction to Image Manipulation . . . . . . . . . . . . 297

    For More Information . . . . . . . . . . . . . . . . . . . . . . . . . 300'
  merge: -1
  pgno: 302
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_303_0.png)


    # Figure 20.1: The GIMP Toolbox: The Default Window


    Taking into account the power and performance of GIMP and the prices for commercial
    ''professional'' graphics programs, it soon becomes evident that the GNU Image
    Manipulation Program is a phenomenal gift to the Linux community. As with so many
    Linux programs, GIMP is under constant development.


    This introduction cannot cover the whole range of features. The "official GIMP
    manual" has 924 pages and is available on the Internet at http://manual.gimp.org.
    Unfortunately, some of its descriptions and illustrations are outdated, because
    GIMP has undergone extensive development since the manual was written. The internal
    help system, still under development, also provides valuable assistance to the
    new user.


    > Note


    The version included in this distribution and discussed in this manual is the
    most recent release of the stable 1.2 series. The unstable GIMP 1.3 series is
    not intended for regular users. It is only intended for those involved in developing
    GIMP itself.


    > Note'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Image Processing and Graphics Formats


    # Pixel Images


    GIMP has been designed for processing pixel graphics. These images consist of
    small blocks of color that together create the entire image. A full-screen image
    on a monitor of 800×600 resolution has exactly that number of pixels. It contains
    480,000 individual pixels. Considering this, it is not surprising that image files
    are generally quite bulky. In addition to the coordinates of each pixel, the color
    information is stored. With images of 800×600 pixels, it is easy to get more than
    one MB of data. From the outset, therefore, much time and energy has been invested
    in developing compression procedures that squeeze the amount of information together.
    Some well-known graphics files for pixel images include:


    # XCF


    The native GIMP format. It supports the layer technique discussed later and other
    specific GIMP functions. If you have created an image using the GIMP-specific
    settings and save it in a different file format, information is lost.


    A format without compression used by Microsoft Windows. An advantage of this format
    is that graphics can be loaded and saved very quickly, but this positive aspect
    is outweighed by the file size.


    # GIF


    The "Graphics Interchange Format" has been specially developed for data transfer
    on the Internet and has special features to support this. For licensing reasons,
    many programs are no longer able to support this format. One special feature of
    GIF is the animated Gif, a GIF file in which several images are stored. In an
    Internet browser, these images are displayed so quickly one after the other that
    the impression of a moving image is created. GIF, despite its limitations, is
    popular predominantly because it allows transparency.


    The "Portable Network Graphics" is a popular replacement for the GIF format. It
    can generate the same quality of compressed files with loss of information and
    is freely available. It allows a better form of transparency, but is not yet fully
    supported by all Internet browsers.


    This format is used by the Adobe Photoshop application and supports the multilayer
    technique.


    The "Tagged Image File Format" is yet another method of saving files in the professional
    area. It is particularly popular in the printing business.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'JPEG The compression method of the “Joint Photographic Experts Group” allows
    a highly efficient reduction of image files. Depending on the compression factor,
    image information is lost. Nevertheless, it is an ideal file format for images
    on the Internet.


    > > Tip

    Always save an XCF version of images you create. This makes future modifications
    much easier.


    # Vector Graphics


    Unlike pixel graphics, vector graphics do not store information on all individual
    pixels. Instead they store information on how image points, lines, or areas are
    grouped together. A line that runs horizontally across the screen, representing
    a total of 800 pixels, only needs four information units: the coordinates of the
    starting point, the end point, information that these two points are connected
    by a line, and, possibly, the color of the line. With four coordinates and four
    lines connecting them, you can easily create a rectangle. The fact that this rectangle
    is filled with a specific color basically just one more information unit. In this
    way, even complex images can be represented with relatively little basic information.
    The drawing application of OpenOffice.org, for example, uses this format.


    # Using The GIMP


    # Starting The GIMP


    By default, GIMP is included in the standard installation of SuSE Linux. Start
    GIMP with ‘SuSE’ → ‘Multimedia’ → ‘Graphics’ → ‘GIMP’ or by typing gimp in a command
    line. When GIMP is newly installed, some postinstallation procedures are conducted
    when it is first started for a user. The left button in the bottom part of dialog
    box that is the ‘Install’ button. Click this button then, in the following dialog
    box, click ‘Continue’. GIMP is then correctly installed and set up


    Since many files need to be loaded when it first starts, GIMP takes some time
    to load. By default, a window is displayed after each start showing the ‘Tip of
    the Day’. If desired, deactivate it by unchecking the ‘Show tip next time’ on
    the left.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# The Toolbox


    Initially, GIMP appears on screen in a rather unspectacular way. It opens a relatively
    small window containing the toolbox. The buttons of this window are the main functions
    needed for powerful image manipulation. The following is a description of the
    icons and their functions.


    GIMP toolbox window can be subdivided into three parts: the menu bar with the
    ''File'', ''Xtns'' (Extensions), and ''Help'' menus; the tool icons; the color,
    pattern, and brush selection icons.


    # The Menu Bar


    The menu bar can be seen in Figure 20.1 on page 282. Use ''File'' for creating
    new graphics file, loading an existing image with the file manager, creating screenshots
    (screenshots are images of your screen), setting basic options, and accessing
    the most recently processed files. The main items under the ''Xtns'' menu are
    Modules, Plug-ins additional programs linked into GIMP that implement a specific
    graphical functionality, Scripts, and GIMP web pages. The ''Help'' menu contains
    various ways of accessing help information.


    # The Tool Icons


    Each graphic in the toolbox represents a specific function. The toolbox can be
    resized both in width and height. Overall, a distinction can be made between three
    or function areas.


    # Selection Tools


    In processing, you will want to process either the whole image or a specific section
    of it. GIMP needs to know which area the following actions should be applied.
    Several selection tools will help define a specific area. Once a selection has
    been made, it can be processed without affecting other parts of the image. Selection
    areas can also be increased or decreased in size with the aid of Shift (additive
    selection) and Ctrl (subtractive selection). The cursor changes to show a plus
    or a minus sign.


    # Transform Tools


    These functions are used to modify selections. Many functions are available, including
    crop, flip, and transform.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Paint Tools


    The paint tools represent pencil, paintbrush, airbrush, pen, and finger (smudge)
    and try to emulate their real-world properties on the PC.


    A fourth functional area to be classed with these three areas might include the
    color, fill, and brush options, which specify the paint color or the tip of the
    painting tool.


    # Tip


    One click on a tool icon activates the tool. A double-click opens an additional
    window with the option settings for the specific tool.


    # The Selection Tools


    +   Rectangular select is the simplest selection tool. By keeping the left button
    pressed and dragging the mouse at the same time, a rectangular area is marked.
    When you release the mouse button, a frame indicates the selected area. If you
    press Shift after you begin drawing the selection, only perfect squares can be
    selected.


    +   This tool works like rectangular select, except it selects a circular or elliptical
    area. It is used in the same way, except pressing Shift after you begin limits
    the selection to perfect circles.


    +   This is the first usable tool for photographs. The lasso allows a free-hand
    selection of an irregular shape. Press the left mouse button and follow the shape
    as required. When you release the button, the start point and end point are joined
    with a straight line. An accurate selection is difficult, so working with an enlarged
    image is recommended.


    +   The magic wand fuzzy selection tool selects an image area through similarity
    of adjacent pixels. If the default settings are not suitable, change the threshold
    value in the option box or combine several selections using Shift. The magic wand
    is ideal for selecting irregular areas of similar color.


    +   With a bit of effort, the Bezier Curves tool allows you to capture specific
    areas or objects of an image. With the aid of anchor points'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'with magnifier clicks, draw clean, curved lines. One advantage of this technique
    is that you can change the selection with the aid of control points. Once you
    have marked the area required, just click inside it and it will be selected. This
    tool requires some practice to master, but is invaluable for more advanced work.
    Selections made with this tool can also be saved and manipulated with the ‘Paths’
    tab of the Layers, Channels, and Paths dialog.


    +   - As you click, Intelligent Scissors tries to draw a selection along color
    or brightness edges. Sometimes it works quite well. Modify the settings in the
    option box.


    # Transformation Tools


    +   - When Move is activated, grab and move your selection with the mouse.


    The magnifier is not a true transformation tool because it only zooms the screen
    representation in or out. The image itself is not changed. To use the zoom out
    function, which reduces the image on the screen by a certain percentage, press
    and hold Ctrl while clicking with the mouse. For a true enlargement of your image,
    open the context menu with a right-click in your image and select ‘Image’ → ‘Scale
    Image’. In the dialog box that opens, change the height and width of the image
    by percentages or by pixel values.


    +   - Crop and resize your image. For an aesthetically pleasant impression for
    landscape photographs, for example, it is recommended to assign the sky one-third
    and the landscape two-thirds of the image height. Using the mouse, click and drag
    to open a rectangle. A click inside this rectangle crops the surrounding area.
    You can always undo this immediately by Ctrl + Z. Take your time to experiment
    with this tool. You can also change the size of the rectangle. Resize the section
    by grabbing and moving the top left or bottom right corners. The whole rectangle
    can be moved by grabbing and moving the bottom left or top corners.


    +   - This hides a multitude of functionalities that might confuse a beginner.
    Either process the whole image by clicking the tool icon first then the image
    or a portion by first making a selection then clicking the tool icon.'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'Four functions are available: rotate the image or the changes around an arbitrary
    rotation point, enlarge or reduce (Scaling), convert a rectangle into a trapezoid
    (Shearing), or distort the perspective of an area. The default setting is Rotation.
    Other functions can be specified in the option box opened by double-clicking the
    tool icon.


    A simple tool that flips (mirrors) the selected area horizontally or vertically.


    Once you have modified your whole image or a selection with the aid of a transformation
    tool, reconnect this floating selection to the image. Prior to this integration,
    you can still modify the result of your transformations. There are several possibilities
    for integrating the changes into the image. Use the anchor layer keyboard shortcut
    (Ctrl) + (H), click in the image somewhere outside the selection, or choose a
    different selection tool and apply it.


    # Paint Tools


    The first few tools in the list are somewhat different from the other paint tools.
    They are included in this section, however, because they are used to add colors
    or text rather than modify it. The main paint tools provided by GIMP have particular
    properties in the real world that are emulated the program. Set the appropriate
    options to simulate various pencils or to adjust the paintbrush to your personal
    requirements. In the option boxes of the paint tools, find the slider ''Opacity''.
    This is used to set the opacity of the color employed. With the ''Mode'' drop-down
    box, specify how painted lines or surfaces should be integrated into the image.
    Depending on the tool, the different modes have different effects.


    The T stands for text input. In GIMP, text input is done in two ways and many
    options are available. Double-click the tool to open the option box. By activating
    or deactivating the ''Use Dynamic Text'' button, select multiline text input with
    alignment or single line text input. A click in the image with the T tool activated
    opens the corresponding dialog box in which to enter text and select font, size,
    and other param


    # Caution


    If you do not save the text in a separate layer, you will later be unable to modify
    it because it is integrated into your image in pixel form. See Section Layers
    on page 295 for more information.


    # Caution'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'GIMP provides a relatively simple text tool. Many text effects, such as shadows
    or gradients, must theoretically be input by hand. In practice, however, ''Script-Fu''
    and the ''Filters'' submenu provide many automatic modification procedures, which
    have, in part, been specifically designed for use with text.


    +   The color picker allows a controlled selection of a color from your image
    and transfers it to the color selection box. When you click a specific color in
    the image with the color picker tool, this color is selected. With it, quickly
    find, for example, a specific skin tone needed to retouch a photograph.


    +   With the paint bucket, fill a selected area with color. Instead it can also
    fill with a pattern. Prior to the filling action, activate ''Pattern Fill''. Everything
    in the selection is then painted over the selected settings.


    +   The icon represents a color or grayscale gradient. GIMP has several predefined
    gradients to use to fill the selected area. This tool is relatively complicated
    and requires some practice, especially if you want to overlay an image with transparent
    color gradients.


    +   The pencil is a painting tool with which every user is familiar. With the
    virtual pencil as a real pencil draw free-hand lines. The type of line width and
    shape of the brush icon pencil point is selected with the brush dialog. Either
    double-click the ''File'' → ''Dialogs'' → ''Brushes'' in the bottom right corner
    of the toolbox or select points are available that do not actually exist in the
    real world. Make your pencil extra-fine or extra-thick or select one of the special
    shapes.


    +   The paintbrush draws with a softer, more liquid effect than the pencil. In
    the appropriate option box, set a fade out (the intensity slowly diminishes while
    painting) or a gradient (selection via the gradient settings options). When the
    fade out is activated, release the paintbrush and begin again to apply more color.


    +   The eraser erases. It also uneraser. The brush selection also sets the shape
    of the eraser.


    +   The airbrush allows you to work in the same way as with a real airbrush. Change
    the ''Pressure'' and use the many different brush settings.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'This tool is ideal for use with a pressure-sensitive graphics tablet.


    The clone tool (the icon represents a rubber stamp) is the ultimate instrument
    for photo retouching. It can be used to specify parts of images that are then
    cloned. In practice, this means that you specify precisely which part of the image
    to copy where and in what form. This has relatively little to do with the ‘Cut’
    and ‘Paste’ functions. It uses the paint functionality, allowing you to set shape
    and opacity of your imaginary rubber stamp.


    Things become interesting, for example, if you have an old photograph with white
    stains. Activate the Clone tool and, if needed, its option box. Keep Shift held
    down and click the image area to use for the copy. Then release the mouse button
    and place the cursor on the damaged area. The image area marked in the first step
    of the procedure is inserted. When you move your mouse upwards, the area being
    copied moves upwards, too. The point is marked by a crosshair. Depending on the
    brush settings, a small or a large radius is copied, and depending on the tool
    settings, copying is carried out in a translucent or opaque manner. You will need
    this frequently to retouch photographs. You can, for example, eliminate unwanted
    text from scanned images or even blemishes from portraits.


    The Convolver tool (the icon shows a drop of water) is used for precise manual
    blurring or sharpening of image parts. Which of the two actions is active in the
    option box. The brush selection determines size and borders of the manipulation
    area. Blurring lays a kind of haze over the image or, as using a drop of water
    on a color palette, bleeds the “painted” areas. Sharpening is the opposite. The
    program attempts to increase the contrast and make a ne separation of edges. Sharpening
    works well if you later look at your image from a distance. It also means a loss
    of information, however. Seen from very close up, the images look extremely pixellated.


    The pen can be used not only for drawing, but also for calligraphy. Writing well,
    however, can only be achieved with the aid of graphics tablet. In the tool settings,
    adapt the shape of the pen to your own requirements.


    The tool icon that looks like a pin is, in reality, a thin wooden stick with a
    glued-on opaque cardboard circle. Such an instrument is needed'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'in a photographic laboratory for the perfect exposure of a manual copy. Since
    only a small part of the negatives (or positives) is exposed perfectly, this instrument
    is moved over the areas that would otherwise become too dark while the paper is
    being exposed. Thus, the exposure of specific problem areas can be adjusted individually.
    The opposite is a piece of cardboard with a little hole in for postexposure. Both
    functions are fulfilled by the GIMP tool. Dodge (make lighter) individual image
    areas or burn (make darker) them. To create soft borders, use a diffuse brush.


    The finger shown in this tool moves over the color just applied to the paper and
    smudges it. This can be used to create very interesting effects.


    With the calipers, measure distances and angles. In the associated option box,
    activate the ‘Use Info Window’ button.


    # Color, Brush, Pattern, and Gradient Selection


    The selected colors, brush, pattern, and gradient are shown in your toolbox. The
    color selection functions are on the left. On the right are the currently active
    brush shape , the active pattern , and the active gradient . A click on each of
    these opens a dialog window for individual configuration.


    # Working with The GIMP


    # Opening Images


    You have, for example, stored a scanned image or an image from the Internet on
    your hard disk and want to work on it GIMP. Click ‘File’ → ‘Open’ or (Ctrl + O)
    to open GIMP file manager dialog, shown in Figure 20.2 of the following page.


    On the left-hand side, change to a different directory by double-clicking. On
    the right-hand side, the files are listed. The file list is sorted alphabetically.
    Individual sorting by file type or date is not possible. A handy feature is the
    small integrated preview window. If GIMP recognizes the file format, it shows
    a thumbnail picture of the currently selected file. Double-click the file name
    or click ‘OK’ to open the image.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_313_0.png)


    Figure 20.2: Load Images


    For convenience, GIMP works with an image in a separate image window completely
    independent of the window containing the tool icons. You can move the image window
    around on your screen and, if needed, change its size and zoom settings independently.


    # Creating a New Image


    To create a new image, select ''File'' → ''New'' or press (Ctrl) + (N). A dialog
    box opens in which to specify several image attributes (see Figure 20.3 on the
    next page). The most important ones are width and height, usually represented
    in pixels, image type, and fill type. If you specify a width of 800 and a height
    of 600 pixels and your screen resolution is the same value, you can use your painted
    image later as a full-size background image. In the ''Fill Type'' selection area,
    select the type of fill to use in the new image: the current foreground or background
    color, white, or transparent. By default, transparent areas are rendered with
    gray checks.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Saving Images


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_314_0.png)


    Save with the mouse or Ctrl+S. When using the mouse, right-click inside the image
    to open the context menu of the image. To save your image, activate File -> ''Save''.
    If you have already assigned a name to the image, it is saved under that name.
    If not, GIMP file manager opens and lets you specify the required file name and
    path. With ''Determine file type'', specify which image format GIMP should use
    for saving. Use a correct file extension. In theory, it is no problem to save
    a GIF file with a .TIF extension. If the file type is set to ''By Extension'',
    GIMP saves in the file type identified by the file extension in the file name.


    # Printing Images


    To print your images, open the context menu with the right mouse button. With
    ''File'' -> ''Print'', open the print dialog. Select the correct print queue


    Figure 20.3: Creating a New Image'
  merge: -1
  pgno: 314
- img_proc: true
  md: '(printer), media size (default “Letter”), orientation (auto, portrait, landscape),
    and output type (black-and-white or color). Use a raw queue because GIMP-Print
    produces printer-specific data. Scale the image and spec-ify position on the page.
    With the ‘Print’ button, send the print job to the printer.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_315_0.png)


