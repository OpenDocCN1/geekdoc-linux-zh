  md: '# The SuSE Linux FAQ


    We, we answer the most Frequently Asked Questions.


    +   1. I am the only person using my computer. Why do I always need to log in?

    Linux is a multiuser system. Giving a user name and a password is necessary so
    any SuSE Linux matters are concerned. Only log in as root to make changes to your
    system (installing software or changing configuration). For everyday use, create
    a regular user. This prevents accidental damage to the installation.


    +   2. Where can I get more information about SuSE Linux?

    Find information mainly in the included manuals, as far as the installation and
    any SuSE-specific matters are concerned. You can also install the package suselinux-adminguide_en
    to read the Administration Guide as a PDF document (see /usr/share/doc/packages/suselinux-adminguide_en).
    Documentation for individual programs can be found in /usr/share/doc/packages.
    Instructions on a variety of topics are provided by the HOWTOs, which are found
    in /usr/share/doc/howto/en. To read a HOWTO, use a command like:


    +   3. Where can I get special tips or help?

    Enter the path /usr/share/doc/sdb/en/html.index.html in Konqueror. View the SuSE
    Support Database, which includes numerous tips and help entries. If the path does
    not exist, first install the packages sdb and sdb_en. On the Internet, find the
    most recent version at http://sdb.suse.de/sdb/en/html/.


    +   4. How can I enter commands in KDE?'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'Click ''K'' → ''Tools'' → ''Terminal''. Alternatively, press (Alt) + (F2) then
    enable xterm to open a terminal window in which to enter commands. In KDE, you
    can also click the icon with the screen and the seashell in the desktop panel,
    which opens a konsole, a more sophisticated terminal (as compared to xterm).


    +   5. I cannot find many programs in KDE.


    You can start all programs from a terminal window, such as xterm (see above),
    by entering the program name and pressing Enter.


    +   6. What is a mirror? Why should I not get these things from ftp.suse.com?


    Because there are many users who need to retrieve things from the server at the
    same time, it would be overburden quickly if everyone used the same server. There
    are a number of other FTP servers that contain a duplicate of the SuSE server.
    A server such as this is called a ''mirror''. Access geographically near you —
    in the same country or by nearby area — so it is quicker to download. Find a list
    of mirrors at http://www.suse.de/en/support/download/index.


    +   7. I cannot find any .exe files. Where are all the applications?


    In Linux, executable files normally do not have file extensions. Programs are
    located in /usr/bin and /usr/X1R6/bin.


    +   8. How can I recognize executable files?


    Using the command ls -1, see all the executable files in the directory in red.
    Also recognize them by the ''x'' in the first column.


    ```

    -xr-xr-xr-x  1 root  root  64412 Jul 23 15:23 /usr/ftp

    ```


    +   9. I want to remove Linux. How does this work?


    With fdisk, the Linux partitions are deleted. You might need to run fdisk in Linux.
    Afterwards, boot from the MS-DOS disk and run fdisk /MBR in DOS or Windows.


    +   10. I need farewell, masquerading, mail, and a web server. Will your installation
    support help me with this?


    No, the installation support will assist you in getting Linux up and running.
    For concerns extending beyond this, there are good books available at your local
    book store and documentation in /usr/share/doc/packages, /usr/share/doc/'
