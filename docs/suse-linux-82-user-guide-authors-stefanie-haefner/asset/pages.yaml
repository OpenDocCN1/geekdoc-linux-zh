  md: '# Access Control Lists


    The traditional permission concept for Linux file system objects, such as files
    or directories, can be expanded by means of ACLs (Access Control Lists). They
    allow the assignment of permissions to individual users or groups other than the
    original owner or owning group of a file system.


    Files or directories bearing extended permissions reveal themselves after the
    execution of a simple ls -l command:


    ```

    earth:~# # ls -l

    -rw-r--+ 1 tux projekt3 517 2003-01-08 18:12 Roadmap

    ```


    The output of ls does not reveal much of a change compared to a file without an
    ACL. Roadmap is owned by tux who belongs to the group projekt3. tux holds both
    write and read access to this file and his as well as all other users read access.
    The only difference that discerns this file from one without an ACL is the additional
    + in the first column holding the permission bits.


    Details about the ACL is revealed by executing getfacl Roadmap:


    ```

    earth:~ # getfacl Roadmap


    \ file: Roadmap

    # owner: tux

    # group: projekt3

    user:rw-

    user:jane:r--      # effective: r--

    group::r--

    group:django:rw-- # effective: r--

    mask:r---

    other:---

    ```


    The first three lines of the output do not hold any information not available
    with ls -l. These lines only state file name, owner, and owning group. Lines 4
    to 9 hold the ACL entries. Conventional permissions represent a subset of those
    possible when using ACLs. Our example ACL grants read and write access to the
    owner of the file as well as to a user jane (lines 4 and 5). The conventional
    concept has been expanded allowing access to an extra user. The same applies to
    the handling of group access. The owning group holds read permissions (line 6)
    and the group django holds read'
  merge: -1
  pgno: 337
