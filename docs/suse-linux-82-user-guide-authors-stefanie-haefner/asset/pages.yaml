  md: '# # Quick Installation


    In the best case, a few clicks are sufficient to install SuSE Linux on your computer.
    If no Linux system was installed on your computer previously, your hard disk is
    automatically partitioned, an installed Windows system (95, 98, or ME) is resized,
    a software selection is installed, and your hardware is configured automatically.
    If you do not like the suggestions of the system assistant YaST or have special
    requirements for your system, change the individual installation suggestions manually
    as described in User-Defined Installation on page 13.


    +   - Step One: The Start Screen . . . . . . . . . . . . . 10

    - Step Two: Accept Suggestions . . . . . . . . . . . . . 10

    - Step Three: Installation . . . . . . . . . . . . . . . . . . 12

    - Configuration . . . . . . . . . . . . . . . . . . . . 12'
