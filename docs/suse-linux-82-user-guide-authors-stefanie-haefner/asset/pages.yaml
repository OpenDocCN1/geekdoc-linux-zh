  md: '# Adobe Acrobat Readern— The PDF Viewer


    The Acrobat Reader from Adobe is a program for viewing and printing PDF files
    (Portable Document Format). Acrobat Reader can be used as a stand-alone application
    or as a Netscape plug-in. The comfortable user interface allows quick and easy
    navigation even in complex documents. In Linux, the program is called acroread
    and is included in the standard installation.


    +   Opening a PDF File . . . . . . . . . . . . . . . . . . . . . . . . . . . 185

    The Acrobat Window . . . . . . . . . . . . . . . . . . . . . . . . . . . 186

    Readability . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 187

    Navigating Documents . . . . . . . . . . . . . . . . . . . . . . . . . 187

    Finding Specific Information . . . . . . . . . . . . . . . . . . . . . . 188

    Printing . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 188

    Help . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 188

    Opening PDF files in Netscape . . . . . . . . . . . . . . . . . . . . 189'
  merge: -1
