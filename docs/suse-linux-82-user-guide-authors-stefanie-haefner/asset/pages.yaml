  md: '# The Most Important Linux Commands


    This section gives insight into the most important commands of your SuSE Linux
    system. Along with the individual commands, parameters are listed and, where appropriate,
    a typical sample application is introduced.


    To learn more about the various commands, it is usually possible to get additional
    information with the man program followed by the name of the command, for example,
    `man 1`.


    In these manual pages, move up and down with `PgUp` and `PgDn` and move between
    the beginning and the end of a document with `Home` and `End`. End this viewing
    by pressing `Q`. Learn more about the man command itself with man.


    There are many more commands than listed in this chapter. For information about
    other commands or more detailed information, we recommend the O''Reilly publication
    *Man in a Nutshell*. In the following overview, the individual command elements
    are written in different typefaces.


    +   - actual command is always presented as `command`. Without this, nothing can
    function.


    +   - Options without the respective program cannot function are printed in *italics*.


    +   - Further details, like file names, which must be passed to a command for
    correct functioning, are written in the Courier font.


    +   - Specifications or parameters that are not required are placed in `[brackets]`.


    Adjust possible specifications to your needs. It makes no sense to write `ls file(s)`,
    if no file name file(s)` actually exists. You can usually combine several parameters
    simply by writing `ls -la` instead of `ls -a`.'
