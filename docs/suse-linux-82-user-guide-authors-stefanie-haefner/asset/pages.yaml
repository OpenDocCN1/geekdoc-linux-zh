  md: '# Restore module


    Restore module can restore your system from backup archive.


    # Archive selection


    Archive can be read from:


    +   - Local file

    - Archive file name.


    Archive is already available in the system or on mounted file system.


    +   - Network (NFS)

    - IP address or name of NFS server:


    Backup archive can be read from network using NFS.


    The archive is on a removable device or on an unmounted file system. The device
    can be selected from a list or you can enter the device (e.g., dev/sdb) not listed.


    +   - Removable device

    - Archive file name:


    If you select Select file, the device will be mounted and you can select the file
    from a dialog.


    Note: If you have multiple runlevels, select the first runlevel.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_124_0.png)


    The various runlevels are useful if problems are encountered in connection with
    a particular service (X or network) in a higher runlevel. In this case, the system
    can be booted to a lower runlevel to repair the service. Moreover, many servers
    operate without a graphical user interface and must be booted in a runlevel without
    X, such as runlevel 3.


    Home users only need the standard runlevel (5). However, if the graphical user
    interface freezes at any time, you can restart the X Window by switching to a
    text console with Ctrl + Alt + F1, logging in as root, and booting to runlevel
    3 with the command init 3. This shuts down your X Window system, leaving you with
    a text console. To restart the graphical system, enter 5.


    # Setting the Runlevel in YaST


    In a default installation, runlevel 5 is selected. To start a different runlevel
    when the system is booted, change the default runlevel here. ''Runlevel properties''
    allows you to determine which services are started in which runlevel.'
