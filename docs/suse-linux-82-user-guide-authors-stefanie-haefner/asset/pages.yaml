  md: '# The First Launch


    Following the first program launch, the K3b setup assistant appears. Root permission
    is required to set up the program, so enter the root password. Follow the procedure
    of the setup assistant, which usually makes all assignments automatically. In
    the fourth point of the setup assistant, you can manually assign the mount point
    and the entries in the file /etc/fstab. If you do not know anything about this
    file, do not modify anything. In step five, define the users authorized to create
    their own CDs. Enter at least one CD. completes the setup. The program is now
    ready for use.


    # Creating a Data CD


    Creating a data CD is easy. Select ''File'' → ''New Project'' → ''New Data project''.
    As shown in Figure 17.1, a tab displaying a folder for your new data project appears
    at the bottom left. Drag and drop the desired directories or individual files
    to the project folder. Select ''Burn'' from the toolbar. A dialog with four tabs
    offering options for writing the CD is displayed. See Figure 17.2 on page 26.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_281_0.png)


    Figure 17.1: Creating a New Data CD'
