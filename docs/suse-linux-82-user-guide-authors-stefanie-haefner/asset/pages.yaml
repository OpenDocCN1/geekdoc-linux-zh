    # Viewing, Decompressing, and Creating Archives with Ark


    To save space on the hard disk, use a “packer” that shrinks files and directories
    to a fraction of their original size. Ark is a convenient program for managing
    these archives. It supports a number of common formats, such as zip, tar.gz, tar.bz2,
    lha, rar, and 200.


    To start the program, press (Alt) + (F2) and enter ark. If you already have compressed
    files, you can move these from a Konquerer window to the ark window. ark will
    display the contents of the archive. You can achieve the same by selecting ‘File’
    → ‘Open’.


    Once the archive has been opened, you can perform various actions. ‘Action’ offers
    a number of options, such as adding files or directories, deleting, extracting,
    viewing, editing, or opening with another program.'
