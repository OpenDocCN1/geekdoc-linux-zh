    # root Password


    root is the name of the superuser, the administrator of the system. Unlike regular
    users, who may or may not have permission to do certain things on the system,
    root has unlimited power to do anything: changing the system configuration, installing
    programs, and setting up new hardware. If users get their passwords or have other
    problems with the system, root can help. The root account should only be used
    for system administration, maintenance, and repair. Logging in as root for daily
    work is rather risky: a single mistake could lead to many system files being irretrievably
    lost.


    Figure 3.13 on the facing page shows the relevant dialog. For verification purposes,
    the password for root must be entered twice. Do not forget the root password.
    It cannot be retrieved later.


    > Caution

    The user root has all the permissions needed to make changes to the system. To
    carry out such tasks, the root password is required. You cannot carry out any
    administrative tasks without this password.


