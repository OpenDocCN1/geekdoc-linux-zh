- img_proc: true
  md: '# The Working Environment


    If ergonomics specialists examined the home workstations of computer users systematically,
    they would find many problems. Unfortunately, no standard has yet prevented individual
    users from buying so-called "special computer tables". The low-priced metal-tube
    frames with "practical rollers" (little stability), "ergonomically retractable
    keyboard tray" (no wrist pad), "integrated PC case holder and printer with paper
    shelf" (little stacking space and sometimes little legroom), and "swiveling mouse
    pad (unstable and insufficient working space), and "good view of the screen" (close,
    too high) allow you to use a computer for a short time only. They should not be
    used at professional workstations as they hardly meet any criteria of the corresponding
    standards. You will not find much of this kind of computer furniture in professional
    computer equipment catalogs, because manufacturers indirectly keep an eye on the
    employees'' health by observing the minimum standards of computer workstations.
    Even these minimum standards should be improved.


    # The Right Desk


    A table at the wrong height strains arm and back muscles. The resulting cramped
    posture especially strains the spine. Too little leg room can force an unnatural
    body posture and cause disorders to the blood supply.


    Choosing the right table is very easy. It should be as wide and deep as possible.
    An individual adjustment of the table height would be optimal. Working tables
    at which you can change between sitting and standing by turning the table into
    a writing stand, often just at the push of a button, is a luxury, but changing
    between a sitting and standing position brings relief.


    +   - The flexible arrangement of working materials requires a table top of at
    160 x 80 cm.


    +   - Workstations made of several interlinked boards are recommended.


    +   - Tables that cannot be vertically adjusted must be 72 cm high. Tables that
    are vertically adjustable must be between 68 and 76 cm high.


    +   - Even more width is needed for certain working tasks, such as CAD workstations.
    When changing between screen work and other kinds of work, at least 200 cm is
    required.


    +   - There should be at least 60 cm leg room. Previous experience has shown,
    however, that this leg room is often too little.'
  merge: -1
  pgno: 173
- img_proc: true
  md: "+   ■ When using large screens, tables should be 100 or even 120 cm deep.\n\
    ■ The table surface should not be in bright colors and should have minimal reflection.\
    \ A lot of office furniture is available in a subdued grey only.\n\n# Sitting\
    \ Correctly on the Right Working Chair\n in a working chair makes you sit in the\
    \ same posture for a long time, unlike in an easy chair where you can move around\
    \ easily. Constant sitting in the wrong position, such as bending forward or twisting\
    \ to the side, can harm the respiratory and digestive organs. This leads to premature\
    \ fatigue, circulatory disturbances, and backache resulting from overstraining\
    \ the spine and the vertebrae disks. In extreme cases, years of sitting in the\
    \ wrong position can lead to muscular and skeletal illnesses.\n\nCorrect sitting\
    \ means a frequent change of posture. Different parts of the body are then constantly\
    \ being used. Basically, it is a question of the correct adjustment. The height\
    \ of your working chair is best when your forearms lying on the table are at right\
    \ angles. You should be able to place your feet completely on the floor and your\
    \ thighs and lower legs should also be at right angles. Gymnastic balls and balancing\
    \ chairs offer an alternative to conventional seating arrangements.\n\nUnfortunately,\
    \ a good chair, constructed according to ergonomic criteria, is relatively expensive,\
    \ but the investment in your health is worth it. Important features of a good\
    \ chair include:\n\n+   ■ a backrest reaching to the shoulder blades and with\
    \ an adjustable kinetic resistance\n■ support for the lumbar spinal column\n■\
    \ a seat that is also adjustable and can be tilted forwards or backwards\n■ automatic\
    \ regulation of backrest and seat to retain an ideal angle\n■ springs that softly\
    \ cushion the weight when sitting down\n■ stability provided with the help of\
    \ at least five feet with rollers that are restrained when you stand\n■ adjustable\
    \ height of the seat (according to standards, 42 to 53 cm) and backrest\n■ individual\
    \ adjustment of arm rests, if there are any (luxury)\n■ a footrest if your feet\
    \ do not reach the floor"
  merge: -1
