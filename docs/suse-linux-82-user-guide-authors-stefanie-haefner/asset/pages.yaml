- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_260_0.png)


    Figure 15.4: Answering Machine: User Preferences


    numbers as the answering machine has an automatic fax recognition feature. Separate
    multiple numbers, commas.


    **‘Response Time’** This value defined in seconds determines after how much time
    the answering machine should answer an incoming call. A value can be selected
    from the list or entered.


    **‘Duration’** Determines the maximum recording time for the answering machine
    — the maximum duration of a recorded incoming call in seconds. This value is usually
    of secondary importance because recording is usually terminated by the caller
    hanging up. It is advisable to set this value to a sensible amount of time, such
