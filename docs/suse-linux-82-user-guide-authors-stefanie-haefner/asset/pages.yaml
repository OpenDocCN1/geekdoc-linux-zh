  md: '# # Starting Konqueror


    Konqueror can be started in several ways. In KDE, click the house icon in the
    panel to the start Konqueror. Alternatively, press the key combination (Alt+F2)
    and enter konqueror. Figure 11.1 shows a Konqueror window.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_213_0.png)


    Figure 11.1: The Konqueror Window


    # # The Konqueror Window


    The Konqueror window is divided into several parts. The title bar is the strip
    at the top of the window. It displays the path of the current directory, document,
    or web page.


    Below the title bar is the menu bar. Depending on whether Konqueror is running
    as a web browser or as a file manager, you can only select certain items. The
    toolbar shows icons frequently needed for navigation in Konqueror. If you leave
    the mouse cursor over an icon for a few seconds, a small help text appears.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'Beneath the toolbar is an entry line in which to enter URLs. A URL is a general
    address for one of many different objects. These locations can be on the Internet
    or a local hard disk. Enter a URL and press Enter.


    A URL consists of a transmission protocol and an address. The most common protocols
    are:


    ```

    http web pages

    file local files

    ftp files on an ftp server

    smb shares on a Samba computer

    man man pages

    info info pages

    tar compressed files in tar format

    audioc audio CDs in Konqueror

    floppy browse floppies

    ```


    There are number of other protocols. Valid URLs are, for example, http: //www.sude.de
    and file://localhost/opt/kde2 or, in abbreviated form, file:/opt/kde2.


    > Tip


    Clicking the x icon (located left of the input box) deletes the contents of the
    box.


    > Tip


    To return to previous entries, click the down arrow on the right end of the box.
    Select the desired entry. You can also have a bookmark panel displayed. ‘Settings’
    → ‘Display bookmark toolbar activates or deactivates this.


    Below the URL line is the main window. It displays the contents of directories,
    web pages, or documents. This window can be split in two, if two documents or
    web pages need to be displayed at the same time.


    If you divided the window (see Different Display Modes), a status line is available
    for each view. A small LED on the left side indicates the active view.


    # Konqueror Basics


    # Help


    There are several options to get help for Konqueror. The usual way is to select
    ‘Help’ → ‘Konqueror Manual’ from the menu. The KDE help center'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'starts and displays the full documentation for Konqueror plus references to

    further sources of information.


    There are many ways of getting help in Konqueror. Normally, select ''Help''

    → ''Konqueror manual''. The KDE help system starts, showing documentation

    for Konqueror with numerous additional references. For information about

    an icon, just hover the mouse over it. For more information, press Shift+

    FI choose ''Help'' → ''What''s This?'' then click the icon. A small window

    opens more detailed information. Left-click to close again.


    # Different Display Modes


    In ''View'' → ''View Mode'', select the icon view, multicolumn view (the file

    name appears to the left of the icon), tree view, detailed list view, or text

    view. Figure 11.2 shows, from left to right, icon view, tree view, multicolumn

    view.


    At first glance, the tree view and the detailed list view both look the same.

    You can, however, examine the directories more closely by enabling the tree

    view — several directories can be opened at the same time. The tree view is

    doted by a ''+'' or ''-'' before the folder name. The detailed list view does

    not provide this option. It is used to navigate quickly across directory.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_215_0.png)


