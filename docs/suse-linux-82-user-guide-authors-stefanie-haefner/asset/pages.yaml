- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_161_0.png)


    # # Changing to GNOME2


    Although the core GNOME2 desktop has been released, the changeover for applications
    is somewhat more time consuming. SuSE Linux 8.1 includes GNOME2 applications as
    much as possible. When the application has not yet been updated to the newer environment,
    the most recent GNOME 1.4 version is included.


    These applications can be easily used in GNOME2, but do not offer the configuration
    integration provided by GNOME2 applications. Unfortunately, applets created for
    GNOME 1.4 are not compatible with the GNOME2 panels. As many applications and
    applets as possible are included in the distribution. To find additional GNOME2
    packages, refer frequently to http://www.suse.com for updates.


    For more information about changes between GNOME and GNOME2, refer to the release
    notes at http://www.gnome.org/start/2.0/reasenotes.html. These notes provide specific
    information about changes in the GNOME-desktop from the developers themselves.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Starting GNOME session


    A GNOME session is available from the graphical display managers included in SuSE
    Linux. It can also be started with startx gnome2. A reasonable default configuration
    is included for both regular users and the root user. It is also possible for
    the system administrator to modify this configuration or provide additional options.


    # GNOME2 and Window Managers


    As well as GNOME2, a window manager must be used. The window manager controls
    how windows are drawn on the desktop. GNOME2 offers two window managers: Metacity
    and Sawfish2. Sawfish2 is a port of the Sawfish window manager commonly used with
    earlier GNOME versions. Metacity is a new window manager designed with GNOME2
    in mind. It is lighter and faster than Sawfish and offers simplified configuration.
    Metacity is now the default GNOME2 window manager in SuSE Linux.


    # Help


    GNOME2 includes extensive help and documentation. Yelp, the GNOME help browser,
    also provides easy access to other documentation on your system, like man pages.
    Access the help by selecting ''Help'' from the menu. Many configuration dialogs
    and applications also offer help from menus or buttons.


    # Configuring GNOME


    If the default configuration does not suit your needs, it can be modified extensively.


    # GConf


    GNOME2 offers a new configuration method. The intention is to simplify and unify
    configuration in programs. For example, instead of changing the font in each application,
    you can change the font once and it will be applied to all applications compatible
    with GConf. GConf can also be used by system administrators to make configuration
    layouts.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'useful for administrators and experienced users. The basic functionality of
    GConf is offered by the ‘Desktop Preferences’ and the individual application’s
    configuration dialogs.


    # Desktop Preferences


    If this is your first start, try the ‘Start Here’ icon on the desktop then select
    ‘Desktop Preferences’. If this icon is not available, open Nautilus, the default
    GNOME file manager and viewer, by right-clicking the desktop and selecting ‘New
    Window’. Under ‘Location:'', enter preferences://. Double-click the icon to access
    the dialog. The configuration options available here can also be opened from the
    menu.


    # Accessibility


    GNOME2 is intended to be highly accessible for people with disabilities. Special
    accessibility options, such as keyboard controls, are in this folder.


    # Advanced


    The ‘Advanced’ folder contains more complication configuration dialogs. Use them
    for selecting what applications are for different file types, controlling access
    to a CD database, and other things. The subfolder ‘Sawfish’ contains the configuration
    for the Sawfish2 window manager. Unless you have specifically selected to use
    Sawfish, ignore this configuration and the ‘Metacity Setup’ dialog described below.


    The ‘Preferred Applications’ dialog is very useful. Use it to select your default
    web browser and text editor.


    # Background


    Your GNOME background can be a picture or just a gradient. To select a picture,
    drag and drop one from a Nautilus window or click the ‘Picture’ image to open
    a file browser. Select how the options are displayed under ‘Picture Options’.
    Use ‘No Picture’ if you do not want a picture. Under ‘Background Style’ and ‘Color’,
    set the color background used with ‘No Picture’ or before the picture.


    # Font


    Select your ‘Standard Application Font’ and ‘Desktop Font’. Click the listed font
    to open a selection dialog. The ‘Standard Application Font’ applies to all applications
    compatible with GNOME2 configuration.'
  merge: -1
