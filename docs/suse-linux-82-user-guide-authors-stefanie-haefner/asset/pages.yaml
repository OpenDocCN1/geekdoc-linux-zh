    # # With Galeon on the Internet


    Galeon’s most essential navigation tools can be found in the first toolbar. ‘Next’
    and ‘Back’ offer the feature of flipping through Internet sites, just as in other
    browsers. To the right of those two buttons is ‘Reload’, which updates the contents
    of a site. ‘Cancel’, which stops a connection or transfer from taking place, follows.
    A useful function is zoom, usually scaled to 100% a 1:1 display of the document.
    To the right of it, both the up and the down arrows can be used to set the zoom
    levels in intervals of time. Enter Internet (URLs) addresses in the following
    entry box. To the far right is the GNOME foot, which if the icon is animated,
    Galeon is working and transferring data.


    # # Optimized for the Web


    Galeon is primarily designed to make surfing the Internet as convenient as possible.
    In the default configuration, Galeon presents a second toolbar, enabling quick
    access to the popular Google search engine as well as its news'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'and image search function. It can also offer access to an online dictionary
    and use the "bookmarklets". This is made possible by small JavaScript functions
    built into Galeon. You can, for example, find out how current a page you is, or
    allow the Internet site to slowly scroll down the screen. This provides a lot
    of practical functionality.


    # Efficient Surfing with Tabs


    Galeon can display multiple WWW documents in a single application window. Though
    such procedure is often more practical than opening a new window for each Internet
    document. To open a link in a web site in the form of a new tab, right-click that
    link. Select ''Open in new tab'' in the emerging pop-up menu. Now, Galeon will
    divide its application window into "index cards", so you can maintain easy access
    to the documents. Create a fresh own tab by clicking ''File'' → ''Open New Tab''.


    # Settings and Controls


    All characteristic of other web browsers can also be accessed via ''Settings''
    → ''Preferences''. With this dialog''s user-friendly layout, the key selection
    options are quite self-explanatory. Galeon''s appearance can also be changed with
    these options.


    Galeon features built-in password management and cookie controls. It also has
    options that specify the web sites from which images may be downloaded. All these
    options can be accessed through a single dialog via ''Tools'' → ''Cookies'' →
    ''View Cookies''.


    After the brief period of initial adjustment, you will find that Galeon is optimized
    for its single important task. The breathtaking speed of the Mozilla HTML engine
    does its part as well!


    # For More Information


    For more information see the Galeon http://galeon.sourceforge.net and GNOME home
    page http://www.gnome.org.'
