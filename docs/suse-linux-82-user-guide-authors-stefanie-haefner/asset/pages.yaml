    refer to the manual page of fdisk with man fdisk.

    (d) Format the partition with mke2fs /dev/hdb1.

    (e) Enter the following commands:


    Check thoroughly to see whether all the data has been copied.

    Afterwards, you can move the old directory and add a new one

