    look and feel.


    # GNOME CD Player Applet


    This is a simple applet that can be added to a GNOME panel. It can be added by
    right-clicking the panel and selecting ''Panel'' → ''Add to Panel'' → ''Applet''
    → ''Multimedia'' → ''CD Player''.


    # XMMS — An MP3, WAV, OGG, and Stream Player


    XMMS is a full-blown audio player with robust jitter resistance. The application
    is easy to use. The button for displaying the options menu is somewhat hard to
    find — it is located in the upper left corner or the program window. Select the
    output plug-in module with ''Options'' → ''Preferences'' → ''Audio I/O Plugins''.
    The aTS sound server can be configured here if the xmms-kde package is installed.


    > Note


    XMMS redirects its output automatically to the ''Disk Writer Plugin'' when it
    does not find a configured sound card. The played files are written to the hard
    disk as WAV files in this case. The time display then runs faster than when playing
    the output through a sound card.


    > Note


    Various visualization plug-ins can be started through ''Options'' → ''Preferences''
    → ''Visualization Plugins''.


    There are five buttons with different letters on them. Find them below the menu
    button. These buttons allow quick access to additional menus, dialog boxes, and
    configurations. The Playlist can be opened with the ''PL'' button and the equalizer
    is activated with the ''EQ'' button.'
