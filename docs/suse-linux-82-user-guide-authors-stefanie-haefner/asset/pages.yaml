  md: '# Creating Presentations with the AutoPilot


    If you have difficulties putting your ideas on “virtual paper”, try using the
    AutoPilot. Select ‘File’ → ‘AutoPilot’ → ‘Presentation...’. With the AutoPilot,
    define the basic structure of your presentation in three brief steps. Configure
    backgrounds, the output medium, and various effects. Also import information from
    an existing presentation with the help of the assistants.

    After you have terminated the AutoPilot with ‘Create’, Imp offers a number of
    templates for the page layout. Select one that suits your purposes and enter a
    title for the first page. Click ‘OK’ to generate the first page of the newly created
    presentation.


    To complete your presentation, enter headers and titles. With ‘Presentation’ →
    ‘Slide Show’, view the presentation immediately. Advance page by page by pressing
    the left mouse button. Exit presentation mode with (Esc)

    Turn to the help system of OpenOffice.org for information about the range of modification
    options.


    # Adding a Slide


    To add a slide to your presentation, use ‘Slide’ → ‘Insert’. A dialog window opens
    as in Figure 9.12.


