  md: '# Hardware


    New hardware must first be installed or connected as specified by the vendor.
    Switch on external devices, such as the printer or the modem, and start the respective
    YaST module. Most devices are automatically detected by YaST and the technical
    data is displayed. If the automatic detection fails, YaST offers a list of devices
    (model, vendor, etc.) from which to select the suitable device. Consult the documentation
    enclosed with your hardware for information.


    > > Note

    Use caution with model designations. If your model is not included in the device
    list, try a model with a similar designation. However, in some cases the model
    must match exactly, as similar designations do not always indicate compatibility.


    # CD-ROM Drives


    Within the scope of the installation, all detected CD-ROM drives are integrated
    in the installed system by means of entries in the file /etc/fstab and the respective
    subdirectories are created in /media. This YaST module can be used to integrate
    additional drives in the system.


    When the module is started, a list of all detected drives is displayed. Mark your
    new drive using the check box at the beginning of the line and complete the integration
    with ''Finish''. The new drive is integrated in the system and can be used.


    # Printer


    # Linux Printing Basics


    A Linux system manages printers through printer queues. Before any data is printed,
    it is sent to a printer queue for temporary storage. From there, it is retrieved
    by a printer spooler, which sends it to the printer device in the required order.


    However, for the most part this data is not available in a form that can be processed
    by the printer. A graphical image, for instance, first needs to be converted into
    a format the printer can understand. This conversion into a printer language is
    achieved with a printer filter, a program called by the printer spooler to translate
    data as needed, so the printer can handle it.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Some ASCII Printer Languages


    +   - ASCII text

    Every normal printer should at least be able to print out ASCII text directly.
    However, there are devices that cannot print ASCII text directly, but are able
    to handle one of the other standard printer languages mentioned below.


    +   - PostScript

    PostScript is the established printer language on Unix and Linux systems. Many
    programs produce PostScript output that can be directly printed by a PostScript
    printer.


    +   - PCL3, PCL4, PCL5e, PCL6, ESC/P, ESC/P2, and ESC/P raster

    If PostScript is not available, the print filter can use the Ghostscript to convert
    PostScript data into one of these other standard printer languages. Ghostscript
    uses different drivers for different printers make use of specific features, such
    as color settings, offered by the various models as much as possible.


    # Processing a Print Job


    +   1. The user or an application generates a new print job.

    2. The print data is temporarily stored in the print queue. The print spooler
    sends it from there to the printer filter.

    3. Now the print filter performs the following steps:

    (a) The print data is converted into PostScript, if not in PostScript already.
    ASCII text, for example, is normally converted into PostScript by the filter program
    a2ps.

    (c) If necessary, the PostScript data is converted to another printer language:

    - If the printer is a PostScript model, the PostScript data is sent directly to
    the printer.

    - If the printer is not a PostScript model, Ghostscript uses a driver suitable
    for the respective printer to generate the printer-specific data that is subsequently
    sent to the printer.

    4. After the entire print job has been sent to the printer, the print spooler
    removes the print job from the print queue.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Available Printing Systems


    SuSE Linux supports two different printing systems:

    LPRng and lpdfilter This is a traditional printing system that consists of the
    print spooler LPRng and the printer filter lpdfilter. The entire configuration
    of this printing system is left to the system administrator. Regular users can
    only choose between the different print queues that have already ready set. To
    allow users to choose between different options for a given printer, a number
    of print queues must be defined, each with a different printer configuration.


    CUPS By contrast, the CUPS printing system allows users to set different options
    for each print job and the configuration of printer queues is not entirely predefined
    by the system administrator. Rather, printer options are stored in a PPD (PostScript
    printer description) file for each queue.


    Because of conflicts between these two printing systems, you cannot have both
    of them installed at the same time.

    For more information about CUPS, see http://www.cups.org/ and the Administration
    Guide.


    # Print Queues


    In most cases, more than one print queue is required for the following reasons:


    +   - Different printer devices must be addressed through different print queues.

    - The printer filter can be configured differently for each print queue. Having
    different queues for one printer, it can be operated with a different set of options.
    However, this is not required when using the CUPS printing system, because CUPS
    allows users to set options individually for each print job.


    One standard queue is sufficient for plain black-and-white printers, such as most
    laser printers, but color ink jet printers usually require at least two queues
    (configurations):


    +   - A standard "lp" configuration for quick and inexpensive black-and-white
    printouts. An lp queue should always be defined, because this is also the traditional
    name of the default queue.

    - A color queue for color printing.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Supported Printers


    Because most Linux printer drivers are not written by the maker of the hardware,
    it is crucial that the printer can be driven through one of the generally known
    languages. Normal printers understand at least one of these common languages.
    In the case of a GDI printer, however, the manufacturer has built a device that
    relies on its own special control sequences. Many inexpensive jet models belonging
    to this group. Such a printer only runs "out of the box" under the versions of
    the operating systems for which the manufacturer has included a driver. As the
    device cannot be operated through one of the standard languages, it cannot be
    used with Linux or can only be used with difficulties.


    Nevertheless, a number of these printers are supported by SuSE Linux. However,
    their use is often rather problematic and some features might not be available
    at all, for example, the printer could be limited to low resolution monochrome
    printing. The following list includes the GDI models that can be directly configured
    with YoST. Because SuSE does not test GDI printers, there is no guarantee that
    the list is correct.


    +   * HL 720/730/820/1020/1040, MFC 4650/6550MC/9050, and compatible models

    * HP DeskJet 710/712/720/722/820/1000 and compatible models

    * Lexmark 1000/1020/1100/2030/2050/2070/3200/5000/5700/7000/7200, Z11/42/43/51/52,
    and compatible models: Linux drivers from Lexmark are available at http://www.lexmark.com/printers/linuxdrivers.html.

    * Oki Okipage 4w/4w+/6w/8wLite/8z/400w and compatible models

    * Samsung ML-200/210/1000/1010/1020/1200/1210/1220/4500/5080/6040 and compatible
    models


    To our knowledge, the following GDI printers are not supported by SuSE Linux.
    This list is by no means complete.


    +   * DCP-1000, MP-21C, WL-660

    * Canon BJC 5000/5100/8000/8500, LBP 460/600/660/800, MultiPass L6000

    * Epson AcLaC C1000, EPL 5500W/5700L/5800L'
  merge: -1
