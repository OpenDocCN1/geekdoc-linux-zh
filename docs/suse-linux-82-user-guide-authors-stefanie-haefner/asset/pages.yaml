  md: '# Inserting Graphics


    Graphics can be inserted, as described in the preceding section, with the vertical
    toolbar (second icon from the left). Alternatively, select ''Insert'' → ''Graphics...''
    → ''From file...''.


    A dialog window opens. Select the desired file. If you click ''Preview'', the
