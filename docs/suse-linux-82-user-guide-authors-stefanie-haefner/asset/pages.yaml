  md: '# Tasks


    Tasks’ provides a list of tasks. Use the toolbar to add tasks. Search the tasks
    with the search bar.


    # Contacts


    This view shows all the addresses in your address book. To locate a particular
    address, use the search bar or click the button to the right displaying the first
    letter of the contact’s last name. Add contacts or lists with the toolbar.


    # Mail


    To configure the mail settings in Evolution, switch to the ‘Inbox’ view with the
    ‘Shortcuts’. Select ‘Tools’ → ‘Mail Settings...''


    # Configuring Accounts


    Evolution is capable of fetching mail from multiple mail accounts. The account
    from which to send can be selected when composing a message. To edit an account,
    select the account and click ‘Edit’. To add a new account, click ‘Add’. This opens
    the configuration assistant described under Evolution Setup Assistant on page
    222. Delete a current account by selecting it then clicking ‘Delete’


    To make an account the default account when sending mail, select the desired account
    then hit ‘Default’. To disable fetching mail from an account, select the account
    and click ‘Disable’. A disabled account can still be used as the address for sending,
    but that account will not be checked for incoming mail. Reactivate the account
    with ‘Enable’.


    # Other Settings


    Use ‘Display’ to select or disable the quote highlight color or after how long
    a message is marked as read after opening. Also make settings regarding how images
    in HTML mail messages are treated.


    Use ‘Composer’ to make settings for your mail composer. ‘Other’ contains settings
    for PGP, character encoding, and other functions.'
