    for each service. By default, the master service that manages the individual-ual
    services (inetd or xinetd) is not started.


    When this module starts, choose which of the two services to configure. The selected
    daemon can be started with a standard selection of network services or you can
    ''Add'', ''Delete'', or ''Edit'' services to compose your own selection of services.


    # Caution


    This is an expert tool. Only make modifications if you are familiar with network
