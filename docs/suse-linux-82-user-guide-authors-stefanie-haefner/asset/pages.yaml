    # Configuring the Answering Machine


    The provided standard scripts also offer a comfortable multiuser answering machine.
    This can be configured with the YaST ‘Answering Machine’ module in the ‘Network
    Devices’ group.


    Similar to the fax configuration, there is a list with the already configured
