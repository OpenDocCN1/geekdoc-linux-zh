  md: '# # Illustrations of the SuSE 8.2 Distributions


    # ## Personal Edition


    The illustration for the Personal Edition shows a surface constructed by Werner
    Boy in 1901, which represents an immersion of the real projective plane in the
    three-dimensional real space. The image was calculated with the help of the surf
    application (see http://surf.sourceforge.net), using the following equation:


    ```

    $36xy^4+36x^2z^4+36x^4z-243x^4y^2-243x^2y^4+36x^4y^2+72x^2zy^2$

    $-48\sqrt{2}z^3y^2+72\sqrt{2}y^2z^3-90y^4z^2-16y^2z^2-16z^2x^2-90z^2x^4$

    $-81y^6-24z^5-32z^4+64/9z^3-180y^2z^2x^2$

    $-24\sqrt{2}zx^3+48\sqrt{2}y^3z^2-144\sqrt{2}yz^2x^2-324\sqrt{2}y^4x^3$

    $-216\sqrt{2}zx^3+108\sqrt{2}zx^5+144\sqrt{2}x^2z^3=0$

    ```


    Refer to http://www.OliverLabs.net/suse/ for more information. The surf file used
    for drawing the image is available for download.


    # ## Professional Edition


    The illustration for the Professional Edition is a quintic surface with four higher-order
    double points. To be able to draw the projective equation


    ```

    $(x+z)^2(y^3+w^3)+(y+w)(x^3+z^3)$$

    $(8yzw+8xzw+8xyw)(y+w)(x+z)$

    $+4y^2w^2(x+z)+4x^2z^2(y+w)=0$

    ```


    of the tetrahedron-symmetrical surface with the surf application (see http:////surf.sourceforge.net),
    the tetrahedral coordinates


    ```

    $x''=z-1+\sqrt{2}x, y''=z-1-\sqrt{2}x, z''=(-z+1+\sqrt{2}y), w''=(-z+1-\sqrt{2}y)$

    ```


    were used. Refer to http://www.OliverLabs.net/suse/ for more information. The
    surf file used for drawing the image is available for download.'
