  md: '> Tip

    Use (F6) to turn the link window off and on. (F7) and (F8) tell the program to
    show or hide the menu and toolbar, respectively. (Ctrl) + (F) opens the search
    dialog.


    # Finding Specific Information


    Acrobat Reader has an easy to use search function for finding text strings. To
    use it, click the icon with the binoculars or select ''Edit'' -> ''Find''. Enter
    a search string in the dialog then click ''Find''. Acrobat Reader displays the
    first match found in the document. To find the next match, click ''Find Again''.


    # Printing


    In the printer menu, the following options are important:


    **Printer selection:** With ''Printer command'', specify the print queue. 1pr
    is the default.


    **Reverse printing:** Use this to print the document last page first.


    **Enlargement of the pages:** Use ''Fit to page'' if the page size of the document
    is larger or smaller than the paper.


    # Help


    Clicking ''Help'' opens a PDF file with a detailed help text. Use Acrobat''s search,
    link, and scrolling functions to find the information needed.'
