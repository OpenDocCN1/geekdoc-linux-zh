  md: '# Configuring a Sound Card


    If multiple sound cards were detected, select your preferred sound card under
    ''List of Automatically Recognized...''. Continue to ''Setup'' with ''Next''.
    If the sound card was not autodetected, select ''Select from List'' and, with
    ''Next'', proceed to ''Manual Sound Card Selection''.


    # Manual Sound Card Selection


    If your sound card was not autodetected, a list of sound card drivers and models
    are shown from which to choose. With ''All'', see the entire list of sound cards.


    Refer to your sound card documentation for the information required. A reference
    list of sound cards supported by ALSA as their corresponding sound modules is
    available in /usr/share/doc/packages/alsa/cards.txt and at http://www.alsa-project.org/~char126/goemon/.
    After making your selection, click ''Next'' to return to ''Setup''.


    # TV and Radio Cards


    After starting and initializing this YaST module, the TV and Radio Cards'' dialog
    appears. If your card was autodetected, it is shown in the list at the top. In
    this case, highlight the line with the mouse then select ''Configure''.


    If your card was not detected, select ''Other (not recognized)''. If you press
    ''Configure'', continue to the manual selection in which to select your card from
    the manufacturer and model lists.


    If you have already configured TV or radio cards, modify existing configurations
    with ''Change''. In this case, a dialog presents a list of all configured cards.
    Select a card and start the manual configuration with ''Edit''.


    During the automatic hardware detection, YaST attempts to assign the correct tuner
    to your card. If you are not sure, simply keep the setting ''Default (recognized)''
    and check whether it works. If you are not able to set all channels, this might
    be due to a failure of the automatic detection of the tuner type. In this case,
    click ''Select Tuner'' and highlight the correct tuner type in the list.


    If you are familiar with the technical details, you can use the expert dialog
    to specify settings for a TV or radio card. A kernel module and its parameters
    can be selected in this dialog. Also check all parameters of your TV card driver.
    To do this, select the respective parameters and enter the new value in the parameter
    line. Confirm the new values with ''Apply'' or restore the default values with
    ''Reset''.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'The dialog TV and Radio Cards, Audio'' enables you to connect your TV or radio
    card with the installed sound card. You must use a cable to connect the output
    of the TV or radio card with the external audio input of the sound card. This
    only works if the sound card is already configured and the external input is active.
    If you have not yet configured your sound card, select ''Configure Sound Card''
    to go to the respective dialog (see Sound on page 75. If your TV or radio card
    has loudspeaker jacks, you can also connect the loudspeakers directly without
    configuring the sound card. There are also TV cards without any function, which
    do not require an audio configuration (e.g., for CCD cameras).


    # Network Devices


    # Basic Information about Internet Access


    This section explains a number of important terms in connection with Internet
    access, briefly introducing their aim and function.

    All machines connected to the Internet form a large network in which various operating
    systems run with different hardware. The Internet uses a standard communication
    protocol that can be understood regardless of the hardware or software used. This
    is made by means of the Internet Protocol (IP) together with the Transmission
    Control Protocol (TCP), the User Datagram Protocol (UDP), and the Internet Control
    Message Protocol (ICMP). These protocols comprise the common “language” used by
    all machines on the Internet. The abbreviation for this is TCP/IP.


    Every machine on the Internet has an ID number — the IP address. It can only be
    addressed by TCP/IP with this number. Normally, a machine also has a text name.
    The Domain Name System (DNS) is responsible for converting the IP address to a
    text name. This particular service is offered by name servers. A machine or an
    application offering a service is called a server (for example, DNS server) and
    a machine or application using a service is called a client.


    Under TCP/IP, there are various standardized protocols for forwarding the appropriate
    TCP/IP data transfers to the given transmission method. For network connections
    via a network card, the ethernet protocol is used. For modem and ISDN telephone
    connections, it is the Point-to-Point Protocol (PPP). For ADSL and T-DSL connections,
    the Point-to-Point over Ethernet Protocol (PPPoE) is used.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'To establish an Internet connection, the ethernet, PPP, or PPPoE connection
    between your host and a host of the Internet provider must be established first,
    followed by the TCP/IP connection.


    On top of TCP/IP, there are various standardized protocols for proper data transfer
    to the application.


    +   - The HyperText Transfer Protocol (HTTP) serves for the transfer of web sites
    in HyperText Markup Language (HTML) format.

    - The Simple Mail Transfer Protocol (SMTP) is responsible for sending e-mails
    to another machine and the Post Office Protocol (POP3) for downloading e-mails
    from a mail server.

    - The File Transfer Protocol (FTP) is used to transfer files.


    For several application programs, such as a web browser and an e-mail program,
    to use the same Internet connection at the same time, separate TCP/IP connections
    are used for each application. Large amounts of TCP/IP data are also divided into
    small packets, so HTTP packets from the web browser can be sent over its TCP/IP
    connection while alternating with SMTP or POP3 packet transfers from the e-mail
    program via other TCP/IP connections. Because several applications are using the
    same Internet connection, the IP address, which only identifies the machine, is
    not sufficient. A port number is needed to sort out which TCP/IP data belong to
    which application. These standard services are usually provided on servers at
    the following port numbers:


    +   - DNS on port 53

    - HTTP on port 80

    - SMTP on port 25 and POP3 on port 110

    - FTP on port 20 and 21


    The client can only use services if it addresses the correct port number on the
    server.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Information about the Internet Dial-Up


    If you activate ''Dial on demand'' or ''Automatic dial-up'' in the YoAST modules,
    the Internet connection is established automatically whenever necessary, for example,
    when an external URL is entered in the browser or when e-mail is sent and retrieved.
    ''Dial on demand'' or ''automatic'' is only advisable if you have a flat rate
    for Internet Access. With ''manual'', the computer only establishes connection
    to the Internet when you want it to do so. Background processes, such as retrieval
    of e-mail in regular intervals, frequently establish connections to the Internet,
    which can be expensive.


    # Network Card


    When the YoAST module is started, see an overview of the network configuration.
    The top part of the dialog lists all network cards that were autodetected or manually
    configured. If your card was detected correctly when the system was booted, the
    name of the card appears here. Devices that were not recognized are listed as
    ''Other (not detected)''. The lower part of the screen lists configured devices
    including the network type and the address. You can configure- new network cards
    or modify the configuration of a configured device.


    # Manual Configuration of the Network Card


    Make the following basic settings to configure a network card that was not recognized


    Network interface Specify the network type and the device number.


    Support for Wireless Connections If you are located in a wireless LAN and your
    network card supports this connection type, activate ''Wireless Device''. Press
    ''Wireless settings'' to enter the dialog in which to configure the operating
    mode, network name (ESSID), network ID (NWID), encryption key, and nickname. Press
    ''OK'' to finish the configuration of your card.


    Kernel Module and Selection of the Network Card If your network card is a PCMIA
    or USB device, activate the respective check boxes and exit the dialog with ''Next''.
    If not, select the network card model ''Select from list''. YoAST automatically
    selects a suitable kernel module. Exit this dialog with ''Next''.'
  merge: -1
  pgno: 101
