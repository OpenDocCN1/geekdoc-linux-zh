  md: '# 19

    Kooka — The Scanning Application


    Kooka is a graphical scanning application combining the simplicity of operating
    xscanimage with the functional breadth of XSane, incorporating the easy and user-friendly
    operation common in KDE applications. Kooka is a KDE application with integrated
    SANE system libraries. The SANE package must be installed to use Kooka. This chapter
    consists of two parts. The first part includes a short description of the Kooka
    application. The second part outlines some general scanning tips.


    +   Start Window . . . . . . . . . . . . . . . . . . . . . . 272

    The Preview . . . . . . . . . . . . . . . . . . . . . 272

    The Final Scan . . . . . . . . . . . . . . . . . . . . . 274

    The Menus . . . . . . . . . . . . . . . . . . . . . 274

    Save . . . . . . . . . . . . . . . . . . . . . . . 276

    Character Recognition with gocr . . . . . . . . . . 276

    Some Scanning Tips . . . . . . . . . . . . . . . . . . . . 277'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'Refer to http://www.mostang.com/sane for information about which scanners are
    supported and the status of driver development. Check this before purchasing a
    scanner, if possible.


    # Start Window


    Start Kooka from a console with the command kooka. If desired, create a link to
    the application on your KDE desktop. When Kooka starts, it first opens a two-frame
    window with a menu bar and a toolbar. Optionally, include an additional window
    with a thumbnail view of an image directory. Use the mouse to enlarge or reduce
    the windows as needed. If desired, separate an individual window entirely from
    the Kooka window and move it to a location of your choice above the desktop. To
    move the windows, click the thin line above the respective window and drag it
    with the mouse. Rearrange windows as desired. If a window is placed centrally
    over another window, both windows have the same size, are superimposed, and can
    be selected with tabs.


    Use tabs to toggle between the preview window and the gallery view. The latter
    is a small file browser that assists in saving scanned images. For more information
    about the tabs ''Gallery'' and ''Preview'', see Save on page 276.


    Use the scanner-dependent part of your window to modify scanner-specific settings.
    At the bottom, the two buttons for generating a preview and for starting the final
    scan. The scanned image appears in the large window to the right (''Image''),
    which is the only window that cannot be moved. The last window is for thumbnail
    display of the respective directory of the gallery.


    For sake of better understanding, these sections assume the gallery and the preview
    window are located at the top left and the scanner settings at the bottom left.
    The image viewer and thumbnail view are to the right.


    # The Preview


    Figure 19.1 on the facing page diplays the preview window at the top left and
    the size and orientation settings next to it. By pressing ''Preview Scan'' (bottom
    left), the image in the scanner is scanned and appears in the preview window.
    This preview scan does not generate a file. ''Final Scan'' activates the actual
    scanning process to create a file, but use it after it the appropriate settings.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_294_0.png)


    Find information regarding the size and memory requirements of your image in the
    upper left section under the document''s size and orientation information. Use
    the preview window to define the scanning range and for adjusting the gamma value,
    brightness, and contrast. Do not assume that the printout will look exactly like
    the preview display. Correctly adjusting the monitor, scanner, and printer is
    a difficult procedure.


    # Scanning the Preview


    Before scanning a preview, set the mode for generating the preview in the window
    containing the scanner settings (bottom left in our example). ''Color'' and ''Gray''
    are self-explanatory. ''Binary'' means that only black and white are used, without
    any gray tones. This option only makes sense for the preview if only pure text
    or black-and-white graphics are involved. It is required to perform a final scan
    of an image or text for text recognition purposes (see The Final Scan). The resolution
    and other settings in the window below especially affect the final scan.


    Scan size and orientation can also be defined in the upper left section, if ''Preview''
    is selected. The size is given below in both mm and KB or MB. If select ''User
    defined'' as your scan size, you cannot choose the orientation. Mark the display
    window after the preview scan to scan.'
  merge: -1
