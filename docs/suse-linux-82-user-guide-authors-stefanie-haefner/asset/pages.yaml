  md: 'In the YaST Control Center, go to ''System'' and start the ''Boot Loader Configuration''
    module. This opens a window in which the current boot configuration is displayed
    and can be changed. The table listing the configuration data (white background),
    Under ''Ch.'' (to the left), are flags mark whenever an option has been changed.
    These options are listed in the center column. The current values or settings
    are listed in the column to the right. To add an option, click ''Add''. To change
    the value of an existing option, click ''Edit''. If you do not want to use an
    existing option at all, select it then click ''Delete''.


    Selecting an option and clicking ''Edit'' opens a dialog in which to change the
    settings according to your needs. Leave the dialog and confirm any changes by
    clicking ''OK''. Back in the main window, select other options and repeat these
    steps to change them. However, the available options themselves differ according
    the type of boot loader used. The following list explains some of the options
    of GRUB boot loader:


    **Boot Loader Type:** Use this to switch between GRUB and LILO. The dialog opened
    lets you specify the way in which this change should be performed. For instance,
    specify that a current GRUB configuration should be converted into a similar LILO
    configuration. However, some settings may be lost, because LILO has no equivalent
    for them. You can also create a new configuration from scratch or generate a configuration
    that may then be changed as needed.


    The following two options are not available when SuSE Linux is being installed,
    but only after the installation, at which point you may also tell the module to
    read in the existing configuration as stored on the hard disk. This reloads the
    configuration of the previous boot loader and is useful if you want to switch
    back to the original setup for reason. This possibility only exists as long as
    you do not close the boot loader module.


    **Location of the Boot Loader:** Use this dialog to define where the boot loader
    should be installed: in the master boot record (MBR), in the boot sector of the
    boot partition, in the boot sector of the root partition, or on a floppy. Use
    ''Others'' to specify a custom boot sector as the location of the boot loader.


    **Hard Disk Sequence:** If your computer has more than one hard disk, specify
    the boot sequence of the disks as defined in the BIOS setup of the machine.


    **Default Entry:** This option lets you specify which kernel or operating system
    to boot by default, if no active selection is made in the boot menu'
