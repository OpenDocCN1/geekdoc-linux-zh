  md: '# GNOME — The Desktop


    With the recent release of GNOME2, GNOME provides an amazingly fast option for
    the Linux desktop. This speed is offered without sacrificing features or convenience.
    GNOME (GNU Network Object Model Environment) is an effective desktop as well as
    a flexible and sophisticated developer''s environment. It was developed to make
    the user interface more uniform, streamlining the various aspects of the look
    and feel. As well as components for managing the windows, additional components
    can share data with each other, featuring a uniform operating concept and help
    system. Modularization allows reusable program elements to be integrated into
    other applications so the wheel does not have to be reinvented for each individual
    scenario.


    This chapter focuses on how to work with GNOME and how to customize the environment
    and applications. It also provides an overview of some of the core applications.


    +   Changing to GNOME2 . . . . . . . . . . . . . . . . . . . . . . . . . 140

    Starting GNOME2 . . . . . . . . . . . . . . . . . . . . . . . . . 141

    Help . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 141

    Configuring GNOME . . . . . . . . . . . . . . . . . . . . . . . . . 141

    Nautilus . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 145

    Useful GNOME Applets and Applications . . . . . . . . . . . . . 148

    For More Information . . . . . . . . . . . . . . . . . . . . . . . . . . 150'
  merge: -1
