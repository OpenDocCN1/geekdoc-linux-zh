  md: '# ISDN Telecommunication


    In the times of Internet and e-mail, traditional communication forms, like the
    telephone and fax, have virtually no significance. The new communication package
    CAPISuite offers an ISDN-based solution for a computer-supported answering machine
    and fax handler.


    The following chapter intends to explain the workings of CAPISuite in more detail.
    This is followed by a description of its installation with YaST and a short introduction
    to the usage of the system.


    +   CAPISuite Basics . . . . . . . . . . . . . . . . . . . . . . . 234

    Configuration . . . . . . . . . . . . . . . . . . . . . . . 234

    Usage . . . . . . . . . . . . . . . . . . . . . . . 240'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# CAPISuite Basics


    CAPISuite is a daemon (a program that runs in the background) that provides basic
    telecommunication functions. The current version especially offers functions for
    telephone and fax connections.


    This means that the system supports, for instance, the initiation and termination
    of incoming and outgoing fax and voice connections. Fax and audio files can then
    be sent and received over these connections. Some special functions, the switching
    of a phone connection to a fax connections and the processing of DTMF (Dual Tone
    Multi Frequency — common touch phone tones), are supported.


    The system, however, does not constitute a complete application suite for the
    completion of certain tasks, like an answering machine. The actual application
    is written in the Python scripting language (a language well suited for beginners)
    and can thus be freely adjusted to the current requirements. CAPISuite merely
    processes the provided scripts and executes the commands listed. This allows the
    creation of flexible solutions from a simple answering machine up to a small call
    center (for which the system is still lacking a few features).


    The CAPISuite package provides some predefined scripts that offer a multiuser
    answering machine and a fax solution. In more detail about the system and instructions
    on writing custom scripts can be found in /usr/share/doc/packages/capisuite/manual/index.html
    after installation and on the web site of the project (http://www.capisuite.de/).


    # Configuration


    CAPISuite accesses the CAPI programming interface for ISDN hardware. Because this
    has only recently made available for Linux, suitable drivers are not yet available
    for all common ISDN adapters. They are however available for the very common ISDN
    adapters of the manufacturer AVR and can comfortably be installed and configured
    with YaST.


    A simple test for the operational status of the CAPI drivers is the execution
    of the capinfo command as the root user.The driver is installed correctly if the
    command returns detailed information about capability of the ISDN adapter. CAPISuite
    can then be installed and used.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'The capuisite package must be installed with the YaST software installation
    module to be able to configure CAPISuite. More information on installing software
    is provided in the respective section of the YaST chapter.


    > It was not yet determined by print deadline whether could be included in the
    Personal Edition. This package is, in any case, available for download on the
    SuSE Internet servers. A corresponding installation instruction is published on
    the web site of the CAPISuite project at http://www.capuisite.de/.


    # Caution


    After installation, YaST offers two modules for the configuration of the fax and
    answering machine functionality.


    # Configuring Fax Services


    The YaST module from the ''Network Devices'' group contains a form with a user
    list and buttons for the processing of list entries. The list contains all the
    users already configured for the fax system. The CAPISuite scripts used here are
    multiuser-capable and allow each user to send and receive faxes indyently. The
    target number of an incoming call determines which user receives the fax. The
    list of this module is, of course, empty when it is started for the first time.


    If various users want to receive faxes with CAPISuite, it must be ensured that
    the associated phone numbers are all different and that all these numbers are
    also associated with the line to which the ISDN adapter is connected. This is
    of importance if you concurrently use an ISDN PBX.


    > Use exclusively the answering machine module if you intend to receive both faxes
    and normal calls, because this offers an integrated recognition and reception
    module for faxes. See Configuring the Answering Machine on page 237.


    # Tip


    Existing entries can be edited or deleted and new entries can be created with
    the assistance of the icons grouped below the list. A dialog box appears for entering
    the following data when creating a new entry or modifying an existing one:'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'The fax system for one or more users can be set up in dialog. Each user must
    have at least one unique fax number configured. Please refer to the telecommunication
    chapter in the manuals for further details.


    When adding or editing a user, a dialog will be shown with the following fields:


    +   **User:** The system user who wants to receive or send fax calls.

    **Faxnumbers:** One or more fax numbers (delimited by commas) which belonging
    (only) to user. The first number is used as owner number when sending faxes.

    **StationID:** The fax station ID used by the fax protocol. Normally set to the
    external number in international format, e.G. +49 123456.


    # Fax machine configuration


    User table


    | User | Faxnumbers | StationID | Action |

    |---|---|---|---|


    | Add | Edit | Delete |


    | Back | Abort | Finish |


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_257_0.png)


    ‘User’ Select the user of the system for the fax functionality should be activated.
    This user account then receives incoming faxes and status reports.


    ‘Fax Numbers’ This field must contain at least one phone number associated with
    the user for fax reception. The input of various numbers separated by commas is
    also possible. All faxes sent to these numbers are sent to the user as e-mails.
    The first number in the list is used for the identification of outgoing faxes.


    ‘StationID’ The fax protocol uses an ID transmitted during handshaking for identification,
    which should normally contain the phone number of the fax device in international
    notation. An example for a valid StationID is +49 89 123456 for the fax number
    123456 in Munich in Germany. The maximum length of this entry is twenty digits.
    Valid characters are numerical digits, spaces, and the + symbol as prefix to the
    international country code.


    ‘Header’ This field can contain an arbitrary text to use as a header for sent'
  merge: -1
  pgno: 257
