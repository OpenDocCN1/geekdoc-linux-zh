  md: 'As the standard kernel only supports normal IDE drives, you will need this
    module disk if you use special IDE controllers. Furthermore, all RAID and SCSI
    modules are provided on this disk.


    +   - Network modules

    If you need access to a network, load the suitable driver module for your network
    card from this floppy disk.


    +   - PCMC, CDROM (non-ATAPI), FireWire, and file systems

    This floppy disk contains all PCMC modules used especially for laptop computers.
    Furthermore, the modules for FireWire and some less common file systems are available
    here. Older CDROM drives that do not comply with the ATAPI standard can also be
    operated with drivers from this floppy disk.


    To load drivers from a module disk to the rescue system, select ''Kernel modules
    (hardware drivers)'' and the desired module category (SCSI, ethernet, etc.). You
    will be prompted to insert the respective module disk and click ''Next''. You
    will be listed the desired module listed. Watch the system messages carefully:
    ''Loading <module-name> failed'' indicates that the hardware could not be recognized
    by the module. Some older drivers require specific parameters to be able to address
    the hardware correctly. In this case, refer to the documentation of your hardware.


    To create one of the above-mentioned floppy disks, select the respective option
    and click ''Next''. You will be asked to insert a floppy disk. If you click ''Next''
    again, the content will be written to the floppy disk.


    # Boot Loader Configuration with YaST


    This YaST module greatly simplifies the configuration of the boot loader. However,
    you should not experiment with this module unless you understand the concepts
    behind it. Read the corresponding parts of the Administration Guide before changing
    the boot loader configuration. The following discussion is focused on GRUB, the
    default boot loader of SuSE Linux.


    > Note

    Do not change the boot method from a running system unless you really know what
    is going on behind the scenes.'
