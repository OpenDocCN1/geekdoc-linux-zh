  md: '# Note


    If you partition manually, you have to create a swap partition. The swap partition
    is used to free the main memory from data that is not used at the present moment.
    This keeps the main memory free for the most frequently-used important data.


    Note


    # Resizing a Windows Partition


    If your partition setup includes a hard disk that also has a Windows FAT partition,
    YoST offers either to delete or shrink it. Using this option allows you to install
    SuSE Linux on a disk where the current setup does not provide enough space for
    another operating system. This is commonly the case on computers with only one
    partition that covers the entire hard disk. This setup is sometimes found on computers
    where Windows comes preinstalled.


    The following discussion is based on the assumption that your Windows system is
    installed on a FAT partition (FAT or FAT 32). If YoST sees that there is not enough
    space on the selected hard disk, but space could be made available by deleting
    or shrinking a Windows partition, it presents a dialog in which to choose one
    of these two options.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_48_0.png)


    If you select ''Delete Windows completely'', the Windows partition is marked for
    deletion to use the space for the installation of SuSE Linux.'
