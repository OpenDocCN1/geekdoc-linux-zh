    mask for your network. The preset value for the subnet mask should

    meet the requirements of a typical home network.


    Exit this dialog with ‘Next’ or configure the host name, name server, and

    routing (see Host Name and DNS on page 28 and Routing on page 89).


    # Cable Modem


    In some countries (US, Austria), Internet access via cable modems has be-

    come relatively widespread. The cable subscriber gets a modem-like device

    from the ISP, which is connected to the TV cable network on one side and'
