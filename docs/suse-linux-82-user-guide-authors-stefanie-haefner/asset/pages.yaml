  md: '# Working with the Shell


    Graphical user interfaces are increasingly becoming important for Linux, but using
    the mouse is not always the best way to perform daily tasks. The command line
    readily provides high flexibility and efficiency. The first part of this chapter
    provides an introduction to the Bash shell. It is followed by an explanation of
    the user permissions concept in Linux and a list of the most important commands.
    The chapter closes with a description of the vi text editor.


