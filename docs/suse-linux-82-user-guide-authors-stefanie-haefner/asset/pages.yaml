    +   - Who is root?


    Root is one of several users on your Linux system, a multiuser system. However,
    root is a very special user in that it is the most powerful one on your machine
    and consequently the one that requires the greatest degree of responsibility.
    Like a building manager for a building, root is responsible for the entire Linux
    system, making sure that it runs reliably, the infrastructure works, that all
    programs are up to date, and that none of the “occupants” transgress the rights
    of others. Again like building manager, root owns the master key for the entire
    Linux system, enabling this user to change things that are not possible for normal
    users. Also, root has access to the main directory / and all its subdirectories.
    For all reasons, this user is called root.


    > Make it rule to only log in root on your system if this is really required for
    the job. Examples for this are the creation of a new user account or the installation
    of programs. In general, the system will explicitly prompt you to enter the root
    password (the master key) if a particular action requires it.


    +   - Why can I read some files but cannot delete them?


    You do not have the necessary permissions. After reading the password that you
    have entered, the system will not only know your home directory, but also the
    permissions you have as a user — the things you allowed to do and those you are
    not. For instance, you have the permissions to read most of the files in /etc,
    but changing them would require the permissions of the system administrator. Directories
    with files affecting the security and stability of the system are read-only for
    normal users or are completely inaccessible to them.


    In your home directory, however, it is entirely up to you to decide which files
    should be hidden from other users or who are shared. To set this in Konqueror,
    right-click the file then select ‘Properties’.


    +   - How can I add or remove users?


    New users must be created by root. Always log in as root to perform tasks related
