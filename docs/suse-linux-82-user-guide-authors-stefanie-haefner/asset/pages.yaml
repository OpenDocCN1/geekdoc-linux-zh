    office suite is not allowed to use this name. For this reason, it is called ''OpenOffice.org''.


    # Note


    # Recent Changes


    Many comments and suggestions for improvement have reached us ever since OpenOffice.org
    replaced StarOffice as the most important office suite of the SuSE Linux 8.1.
    We have taken your criticism and feedback seriously and substantially improved
    the comprehensive one office suite since regarding stability, comfort, and speed.
    Here is a summary of only the more important improvements:


    +   - SuSE again provides the state of the art of OpenOffice.org development.
    The new version 1.0.2 of the package eliminates a few bugs of the previous version
    and provides much more stable working environment. A detailed account of the changes
    can be found on the web site of the OpenOffice.org project at http://www.openoffice.org/dev_docs/source/1.0.2/release_notes_1.0.2.html.
    Patches additionally integrated by SuSE ensure even more stability and user comfort.


    +   - With SuSE Linux 8.2, the OpenOffice.org kickstarter is offered for the first
    time in the OpenOffice-Quickstarter package. This works with OpenOffice.org even
    more comfortable and faster. See The OpenOffice Quickstarter on the current page.


    +   - The installation process of the most comprehensive office suite of the SuSE
    distribution was greatly simplified. The application no longer needs to be installed
    individually after the main SuSE package installation. This process now runs automatically
    in the background when the application is first started. One click and OpenOffice.org
    runs.


    # The OpenOffice Quickstarter


    The Quickstarter provides a series of useful additional functions for OpenOffice.org.
