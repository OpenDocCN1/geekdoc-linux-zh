  md: '# Digital Cameras and Linux


    A wide range of digital cameras can currently be used with Linux. One of the best
    programs supporting these devices is gphoto2. gPhoto 2.0 is a com-mand line program,
    called a “back-end library”. It is compatible with several

    graphical interfaces (the “front-ends”), including gtKam, Konqueror, Kamera,

    and GnoCam. The use of gtKam and Konqueror is discussed in this chapter.


    +   Connecting to the Camera . . . . . . . . . . . . . . . . 266

    Installation and Preparation . . . . . . . . . . . . . . . . 266

    Using Konqueror . . . . . . . . . . . . . . . . . . 266

    Using gtKam . . . . . . . . . . . . . . . . . . . . . . 267

    For More Information . . . . . . . . . . . . . . . . . 268'
  merge: -1
  pgno: 286
- img_proc: true
  md: '> > TipnA full list of supported cameras is available at http://www.gphoto.org/cameras.html.
    If gphoto2 is installed, obtain the list with the command gphoto2 --list-cameras.

    gphoto2 --help provides information about the available commands in the command-line
    interface.


    # # Connecting to the Camera


    The fastest and most convenient connection between the digital camera and the
    computer is USB. This requires USB support both in the camera and in the computer.
    The default SuSE kernel provides this support, provided your computer has a USB
    port. An appropriate connecting cable is also required.


    > > NoteUsing the USB connection can quickly drain your camera''s batteries. Consider
    using a power adapter.


    To use it, simply connect the camera to the USB port. Turn the camera on.


    # # Installation and Preparation


    Use YaST to install the gtkam package. The other required packages will be selected
    automatically. For more information on installing packages like YaST, refer to
    Install and Remove Software on page 47.


    # # Using Konqueror


    For KDE users, accessing a digital camera through Konqueror provides a familiar
    and easy access. Connect your camera to the USB port. A camera icon should appear
    on the desktop. Double-click this icon to open the camera in Konqueror. The camera
    can also be accessed by entering the URL camera:/ in Konqueror. Navigate through
    the camera''s directory structure'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'until the files with the command shown. Use the usual Konqueror file management
    features to copy the files as desired. More information about using Konqueror
    is available in Konqueror — The KDE File Manager and Web Browser on page 191.


    # Using gtKam


    gtKam is compatible with all window managers. It is a fast and simple graphical
    interface for downloading and deleting pictures from the digital camera. To adjust
    or edit your pictures, use The GIMP as described in Graphics with The GIMP on
    page 281.


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_288_0.png)


    Figure 18.1: The Main Window of gtKam


    Connect your camera to the appropriate port and turn it on. Start gtKam with the
    command gtKam & . From the menus, select ''Camera'' → ‘Select Camera...’. In the
    dialog, select the camera model or use ''Detect''. Select the appropriate port
    if not detected.


    The main gtKam window is divided into three sections the menu and toolbars, the
    left pane with index settings and camera and directory selection, and the right
    pane for displaying an index listing with or without thumbnails. The icons in
    the toolbar provide the main functions needed. The icon saves the selected images.
    The trash icon deletes them. The icon with the arrows reloads the image displayed
    in the right pane. The icon with the paper and pencil opens the camera configuration
    options. The door icon exits the program.


    Your camera should be listed in the left pane. Use the plus sign (''+'') to expand
    the tree display of the directory structure. Your exact direc-'
  merge: -1
