    # # Required Disk Space


    The amount of hard disk space needed depends on the intended use of the system.
    Less space limits what applications can be installed. The following hints give
    us some guidelines for space requirements:


    **Minimal system**: 180 MB. No graphical interface (X Window System) is installed,
    which means only console applications can be used. Also, only a very basic selection
    of software is installed.


    **Minimal system with graphical interface**: 500 MB. This includes X and some
    applications.


    **Graphical system with modern applications**: between 1 GB and 2 GB. This includes
    recent versions of graphical desktops, namely KDE and GNOME, and also provides
    sufficient space for the bigger application packages such as OpenOffice.org, Netscape,
    or Mozilla.


    **For downloading lots of movies and music with Linux**: 2 GB


    **Both items**: 3 GB


    Burning CDs and the items listed above: 4 GB'
