    > Caution


    # Security and Users


    A basic aspect of Linux is its multiuser capability. Consequently, several users
    can work independently on the same Linux system. Each user has a user account
    identified by a login name and a personal password for logging in to the system.
    All users have their own home directories where personal files and configurations
    are stored.


    # User Administration


    Use the check boxes to decide whether to edit users or groups.

