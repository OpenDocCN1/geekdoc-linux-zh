  md: 'Problems during the installation are rare, but may occur with older hardware
    that is not well optimized with regard to certain functions. Often such difficulties
    are related to power management features or to disk drives not coping well with
    DMA modes. As the system cannot be scanned for such problems beforehand, they
    may sporadically interfere with the installation. If you cannot complete the installation
    because of such problems, reboot and select ‘Installation — Safe Settings’ from
    the boot screen. In this installation mode, some of the more modern hardware functions
    are skipped, which usually prevents the problems. These are the individual options
    of the boot screen and the actions triggered by them:


    +   - Boot Installed OS: Boots the system installed on the hard disk (the system
    normally booted when the machine is powered on).

    - Installation: The “normal” installation mode.

    - Installation — Safe Settings: The DMA mode (for CD-ROM drives) and any unsafe
    power management functions are disabled. Experts can also use the command line
    to enter or change kernel parameters.

    - Installation — APIC Enabled: This may be needed for newer machines with support
    for APIC (Advanced Programmable Interrupt Controller) if the normal installation
    mode fails.

    - Manual Installation: If the automatic loading of drivers is causing problems
    with the installation, you can perform the installation “manually”. In a manual
    installation, drivers must be loaded by hand as needed. However, this will not
    work if you use a USB keyboard on your machine.

    - Rescue System: If you are unable to boot into your installed Linux system for
    some reason, you can boot the computer from the DVD or CD then select this item.
    This starts a “rescue system”—a minimal Linux system without any graphical user
    interface, which can be used by experts to access disk partitions to repair the
    errors.

    - Memory Test: This tests the memory (RAM) of your machine by writing chunks to
    it before reading them back. This is repeated in an endless loop, because memory
    corruption often shows up sporadically, so many read and write cycles might be
    necessary to detect it. If you suspect that your computer’s memory might be defective,
    start this test and let it run for several hours. If no errors are detected after
    a longer time period, safely assume that the memory is intact. Terminate the test
    by rebooting.'
  merge: -1
