  md: 'A few seconds after starting the installation, SuSE Linux loads a minimal Linux
    system, which takes control and performs the installation. A number of messages
    and copyright notices are displayed then, at the end of the loading process, the
    YaST installation program is started. After a few more seconds, the screen should
    display the graphical interface that will guide you through the installation.


    # # YaST Takes Over


    Now YaST starts for the installation of SuSE Linux. The YaST screens have a common
    format. All buttons, entry fields, and lists can be accessed with the mouse. If
    your mouse pointer does not move, the mouse has not been correctly detected. In
    this case, you must use the keyboard for navigation.


    # # Selecting a Language


    The language to use for SuSE Linux and YaST. English is the default setting for
    the international distribution. If your mouse does not work, navigate with the
    arrow keys until the desired language is selected. After this, press Tab until
    ‘Next’ is highlighted. Then press Enter to confirm your language selection.


    # # Installation Mode


    If you already have another version of SuSE Linux installed on your computer,
    select whether to perform ‘New Installation’ or to ‘Update an Existing System’.
    There is also an option for booting an existing operating system. If you did not
    install SuSE Linux before, only a new installation is possible. After selecting
    an option, click ‘Next’ to continue. See Figure 3.3 on page 19.


    This section only describes the steps after selecting ‘New Installation’. Detailed
    instructions for a system update are available in System Update on page 51.


    # # Installation Suggestions


    After hardware detection, the suggestion window, shown in Figure 3.4 on page 20,
