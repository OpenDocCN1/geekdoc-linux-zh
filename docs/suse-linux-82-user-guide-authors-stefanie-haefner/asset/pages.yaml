    Press ‘Next’ to download a list of all available patches (if you selected ‘Manual
    Update’). Subsequently, the software installation module (see Section Install
    and Remove Software on the next page) starts, listing all available patches. Select
    the packages for installation or simply accept the suggested patches already marked
    for installation.


    First, all packages are downloaded from the server then installed on your machine.
    If errors occur, they are displayed in a window. In this case, you can skip the
    respective patches. Some patches open an information window before they are installed,
    allowing you to install or skip the package. Following the successful installation
    of all patches, a summary is displayed. Click ‘Close’ to exit the overview and
    ‘Finish’ to exit the YOU menu. Subsequently, SuConfig is executed.


    # Patch CD Update


    The Patch CD Update is for “SuSE Linux Enterprise Server” customers. Patches are
    installed from CD instead of downloaded from an FTP server.'
