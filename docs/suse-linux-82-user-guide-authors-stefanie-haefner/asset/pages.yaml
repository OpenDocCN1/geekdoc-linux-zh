  md: '# Step Three: Installation


    Start the installation with the current settings by clicking ''Yes'' in the green
    window displayed by YaaST. Depending on the performance of your computer, the
    complete installation of your system with about 350 program packages takes approximately
    fifteen minutes.


    # Configuration


    Following the installation, specify some important settings before starting using
    SuSE Linux. Detailed instructions are available in Finishing the Installation
    on page 33. First, set a password for the system administrator (user root).This
    special user is always configured by YaaST and is needed for system maintenance
    tasks.


    > > CautionnRemember the root password as you can only modify the system or install
    programs using the root identity.


    If a network card or other communication hardware (such as a modem or ISDN card)
    is found during the installation, these can now be configured and a connection
    can be established with the Internet or a local network (LAN). This enables use
    of various services during the remaining part of the procedure. For example, if
    you configure an Internet connection, you will be able to perform an online update
    immediately. In this way, you can include the latest updates for your system.
    If you establish a connection with a local network, you can configure a name service
    such as NIS. YaaST assumes that you will not manage any local users on your system.
    This is usually the case with commercial workstations, whose owners are centrally
    configured (e.g., on a department server). If you do not configure a name service,
    you can set up local users intended for normal operations on the system. An additional
    overview displays the detected screen, graphics card, and other hardware components
    (printer, sound card, etc.). If necessary, change settings, as the suggested resolution
    or the color depth. Refer to Hardware Configuration on page 40. Some of the dialogs
    for the configuration of the additional hardware are searchable for connected
    devices. However, these settings do not need to be specified at this stage. You
    can also skip this and do it later on. After the completion of this last step,
    your newly installed system is booted and you can start using it.'
