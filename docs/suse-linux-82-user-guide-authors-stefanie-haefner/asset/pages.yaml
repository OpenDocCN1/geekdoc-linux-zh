- img_proc: true
  md: '# The History of KDE


    The story of KDE sounds like a modern fairy tale. A frustrated computer science
    student from Tübingen, Germany, was tired of the lack of uniformity of previous
    Unix and Linux desktops. For this reason, he developed the popular graphical user
    interface for the X Window System: KDE. In those days, Matthias Etrich would never
    have guessed his appeal in a newsgroup would start. He looked for some volunteers
    for his project “Environment” (KDE) and met a lively reaction. Soon, the first
    executable version was compiled and KDE became more popular. Improvements, bringing
    the KDE project to a critical mass and allowing it to take off on its own. Hundreds
    of programmers all over the world are involved in improving KDE.


    # The First Start-Up


    When you start KDE for the first time, the welcome dialog appears on the screen.
    In the first step, this dialog presents some information about SuSE. In the next
    step, arrange the global look and feel of KDE by activating or deactivating a
    number of features (preview function, magnification of icons, etc.). Save your
    settings with ‘Finish’. Start the program manually by pressing Alt+F2 and entering
    SuSEgreeter.


    # Help


    > >When the mouse pointer is held over a button, text field, or control element,
    a “tooltip”, if available for the item, appears. The tooltip is a brief help text
    describing the item. If you need more information about a graphical element, press
    Shift+F1 and click it. If a help text exists, a frame displaying a more extensive
    help text is displayed. Additional information in HTML format can be accessed
    with ‘Help’→Help on...’. The text is displayed in Conqueror.


    Advanced users who need information for a Linux command can use the man and info
    pages. These can also be viewed in KDE. Simply press Alt+F2 and enter info: to
    get an overview of all info pages. To view a specific command, directly enter
    info:cv. This also applies to man pages, with the only difference that you have
    to replace info with man.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Operating KDE


    In KDE, there are various ways to change the configuration and open files and
    applications. The KDE desktop, the menu bar, title, window, and control panels
    are available for this purpose. These various options are introduced in the following
    subsections.


    # The KDE Desktop


    The desktop is the central hub in KDE. On start-up, see various icons on the desktop,
    enabling you to access CD-ROM, floppy, or hard disk drives, save files, and insert
    links to directories and files. Actually, the desktop is merely a folder on your
    hard disk. It is located in your home directory under KDE. KDE displays all files
    placed here on the desktop. System Administration on page 137 shows how to change
    the path.


    # The Menu Bar


    If desired, place a menu bar at the top of the screen. To do this, the KDE Control
    Center (Alt + F2 and enter kcontrol) and select ‘Look & Feel > Style’. On the
    ‘Miscellaneous’ tab, activate ‘Menubar’ at the top of the screen in the style
    of MacOS and click ‘Apply’. Following the activation, a menu appears at the top
    of the screen. Depending on which program is active, the menu bar changes.


    Enter the KDE desktop menu by clicking a free space on the desktop. The desktop
    menu allows you to log out, create new directories and files, manage your bookmarks
    and desktops, arrange the windows, and get help.


    # The Title Bar


    The title bar is at the area of a window containing its name and various icons,
    depending on the window decoration. The ‘KDE2 default’ decoration, for example,
    has the following title bar layout: the window panel menu, the ‘pushpin’ symbol,
    the respective window name, and the minimizing, enlarging, and closing symbols.
    Sometimes, a question mark may appear before the minimizing, the “What’s This?”
    symbol. Figure 5.1 on the next page shows the structure of the title bar.


    Obtain more functions by right-clicking the title bar. A pop-up menu opens in
    which to configure the current window or create settings for the layout of all
    the windows. The pop-up menu contains the following items:'
  merge: -1
  pgno: 134
- img_proc: true
  md: '![](img/9648518d7b4e8a8b6d624b0deeddc4f7_135_0.png)


    ''Move'' The window follows the movement of the mouse until dropped by left-clicking.


    ''Size'' Change the horizontal and vertical dimensions of the window by moving
    them with the mouse. Confirm with a left click.


    ''Minimize'' Minimize the current window. The application remains open, but its
    window disappears from the desktop and only appears as an icon in the task bar.
    To reopen the window, click the icon in the taskbar.


    ''Maximize'' Max the current window. The application now occupies the entire screen.
    By clicking it again, restore the window to its original size.


    ''Shade'' The current window is reduced to just a title bar.


    ''Always on Top'' The current window remains visible on your desktop until you
    deactivate this function or close the window.


    ''Store Settings'' Saves your specifications.


    ''To desktop'' By selecting from the submenu, move the window to another desktop.


    ''Settings...'' Specify the properties and decoration in the window that opens.


    ''Close'' Close the current window.


    # The Panel


    After starting KDE, the panel appears on the lower margin (default setting). It
    contains the SuSE menu and various quick-start icons for frequently-used applications,
    such as a terminal, the file and web browser Konqueror, and others. Several "applets",
    introduced in The Applets: Miniprograms on the facing page, are also available.'
