  md: '# AccessX


    If you do not use a mouse on your computer, start SoX2 and activate AccessX. The
    mouse pointer can now be controlled with the keys on the number pad as follows:


    +   - Button 1 corresponds to the key ⊌

    This key activates the left mouse button.


    +   - Button 2 corresponds to the key ⊠

    This key activates the middle mouse button.


    +   - Button 3 corresponds to the key ⊌

    This key activates the right mouse button.


    +   - A Click is emulated with the key ⟄

    This key equals a click of the previously activated mouse button. If no mouse
    button was activated, the left mouse button is used.


    +   - Double Click equals the key ⊼

    This works like the key ⟄, except that it invokes a double click.


    +   - Button Lock equals the key ⓪

    This works like the key ⟄, except that it keeps the button pressed.


    +   - Button Release equals the key ⊓

    This works like a mouse click invoked by the key ⓪.


    +   - Arrow up and left works like the key ⟉

    The mouse pointer moves up and left.


    +   - Arrow up acts like the key ⑧

    The mouse pointer moves up in a straight line.


    +   - Arrow up and right acts like the key ⟉

    The mouse pointer moves up and right.


    +   - Left arrow works as the key ⊴

    The mouse pointer moves to the left.


    +   - Right arrow corresponds to the key ⊦

    The mouse pointer moves to the right.


    +   - Down arrow corresponds to the key ②

    The mouse pointer moves down.


    +   - Down arrow corresponds to the key ②

    The mouse pointer moves down in a straight line.'
