  md: '# KDE Control Center


    The KDE Control Center to configure KDE according to your needs. Because an explanation
    of all individual options would would exceed the scope of this chapter, the following
    sections only focus on the general framework and a brief overview.


    The KDE Control Center can be accessed directly via the panel icon or in the K
    Menu or SuSE menu under ''Control Center''. The window shown in figure 6.1 helps


    ![](img/9648518d7b4e8a8b6d624b0deeddc4f7_147_0.png)


    Figure 6.1: The KDE Control Center


    The Control Center is divided into a menu bar and left and right panels. The left
    panel shows a list of configuration modules. After clicking a menu, the related
    modules in the right panel display some information. Clicking the module again
    starts the settings dialog in the panel to the right. Below it, there are are
    usually up to four buttons:


    +   ‘Help’ View a short help text


    +   ‘Use default settings’ Restores the default settings


    +   ‘Apply’ Confirm changes


    +   ‘Reset’ Revert changes


    The menu bar of the control center is structured as follows:'
  merge: -1
  pgno: 147
