    When you exit the module with ‘Save and Exit’, the settings are saved and applied
    to the configuration modules ‘Install and Remove Software’, ‘System Update’, and
    ‘Boot and Kernel Configuration’. This module also offers the possibility to proceed
    with ‘Install’ to install or remove packages.


    # YaST Online Update


    The YaST Online Update (YOU) enables the installation of important upgrades and
    improvements. The respective patches are made available for download on the SuSE
    FTP server. Under ‘Installation Source’, select the server. Activate ‘Manual Update’
    to install only certain patches. Deactivate this option to install all available
    update patches.


    If you activate ‘Download All Patches Again’, all patches, installable packages,
    and descriptions are downloaded from the server. If this box is not activated,
    you will merely receive the patches that are not yet installed on your system.


    Use ‘Configure Fully Automatic Update’ to set up a cron job that checks for updates
    and patches on a regular basis.'
