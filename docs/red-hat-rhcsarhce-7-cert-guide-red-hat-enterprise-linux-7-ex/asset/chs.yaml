  \ SMTP 服务器 (#ch38.html_ch38)\n# 第 39 章 配置 SSH (#ch39.html_ch39)\n# 第 40 章 管理时间同步\
  \ (#ch40.html_ch40)\n\n## 第 25 章 配置外部身份验证与授权\n\n本章涵盖了以下主题：\n\n![Image](img/squf.jpg)\
  \ 理解远程认证\n![Image](img/squf.jpg) 理解 Kerberos 基础\n![Image](img/squf.jpg) 配置带有 Kerberos\
  \ 授权的 LDAP 认证\n![Image](img/squf.jpg) 使用 IPA 服务器或 Active Directory\n\n本章涵盖了以下 RHCE\
  \ 考试目标：\n\n![Image](img/squf.jpg) 配置系统使用 Kerberos 进行身份验证\n\n如果你有许多服务器需要管理，你可能不想在每台服务器上都设置用户账户。在这种情况下，为服务器配置外部身份验证和授权是有意义的。本章将教你如何配置服务器使用轻量目录访问协议\
  \ (LDAP) 或 Kerberos 来实现此目的。\n\n### “我已经掌握了吗？”自测\n\n“我已经掌握了吗？”自测可以让你评估自己是否应该彻底阅读整个章节，还是应该直接跳到“考试准备任务”部分。如果你对这些问题的答案有疑问，或者对自己对这些主题的知识评估没有把握，请阅读整个章节。表\
  \ 25.1 列出了本章的主要标题及其对应的“我已经掌握了吗？”自测问题。你可以在附录 A，“‘我已经掌握了吗？自测和‘复习题’的答案](#app01.html_app01)”中找到答案。\n\
  \n![Image](img/25tab01.jpg)\n\n**表 25.1** “我已经掌握了吗？”章节与问题映射表\n\n**1.** 关于 Kerberos\
  \ 认证的描述哪哪是不正确的？\n\n**a.** 用户在向服务器身份验证后接收到一个 Kerberos 票据。该票据随后使用用户密码进行解密并发送回 KDC\
  \ 服务器。\n\n**b.** 为了身份验证，会将用户密码发送到 KDC，KDC 检查密码并据此发放认证票据。\n\n**c.** 每次访问 Kerberos\
  \ 服务时都会使用 Kerberos 票据。\n\n**d.** Kerberos 密码用作对称密钥来加密和解密 Kerberos 票据。\n\n**2.**\
  \ 一个 Kerberos 实体名称（principal name）通常包含三个部分。以下哪项不包含其中？\n\n**a.** 主体（Primary）\n\n\
  **b.** 域（Domain）\n\n**c.** 实例（Instance）\n\n**d.** 领域（Realm）\n\n**3.** Kerberos 启用的服务需要将密码存储在文件中，以便它们自动启动。如果使用默认名称，以下哪个文件将用于此目的？\n\
  \n**a.** `/etc/krb5.keytab`\n\n**b.** `/etc/krb5.conf`\n\n**c.** `/etc/krb.principal`\n\
  \n**d.** `/etc/krbpasswd`\n\n**4.** 下列哪个服务不用于账户信息存储？\n\n**a.** LDAP\n\n**b.** NIS\n\
  \n**c.** `/etc/passwd`\n\n**d.** Kerberos\n\n**5.** 下列哪项通常不被用作运行在 RHEL 7 上的远程认证相关服务？\n\
  \n**a.** OpenLDAP\n\n**b.** Kerberos\n\n**c.** NIS\n\n**d.** IdM\n\n**6.** 你可以使用哪个配置文件来指定应使用\
  \ sssd 服务作为身份验证后端服务？\n\n**a.** `/etc/authconfig.conf`\n\n**b.** `/etc/sssd/authconfig.conf`\n\
  \n**c.** `/etc/sysconfig/authconfig`\n\n**d.** `/etc/sssd/sssd.conf`\n\n**7.** LDAP\
  \ 客户端在何处查找连接 LDAP 服务器所需的 CA 证书？\n\n**a.** `/etc/ldap.conf`\n\n**b.** `/etc/ldap/certs`\n\
  \n**c.** `/etc/ldap/cacerts`\n\n**d.** `/etc/openldap/cacerts`\n\n**8.** 在 `/etc/sysconfig/authconfig`\
  \ 中，以下哪个变量不是设置使用 sssd 后端身份验证所必需？\n\n**a.** `USESSSDAUTH`\n\n**b.** `USESSSD`\n\n\
  **c.** `USEPAMACCESS`\n\n**d.** `FORCELEGACY`\n\n**9.** 你在一个没有带有身份验证设置的 `/etc/sssd/sssd.conf`\
  \ 文件的服务器上。你会在哪个文件中找到告诉服务器在 LDAP 上身份验证的设置？\n\n**a.** `/etc/ldap.conf`\n\n**b.** `/etc/openldap/openldap.conf`\n\
  \n**c.** `/etc/krb5.conf`\n\n**d.** `/etc/nslcd.conf`\n\n**10.** 哪个命令允许你从命令行加入 AD\
  \ 域？\n\n**a.** `join`\n\n**b.** `ipa-client-install`\n\n**c.** `realm`\n\n**d.**\
  \ `adjoin`\n\n### 基础主题\n\n#### 理解远程认证\n\n默认情况下，身份验证和安全是在本地处理的。当用户输入用户名和密码时，这些将与\
  \ `/etc/passwd` 和 `/etc/shadow` 中的用户进行对比。如果你处理的是单台或或几台服务器，这种方式运行良好。但如果你有许多 Linux\
  \ 服务器，情况就不同了。在这种情况下，使用集中的身份管理服务器是有意义的。有了这样的身份管理服务器，用户就可以使用单点登录 (SSO) 选项。这意味着用户只需验证一次身份，在验证后即可接收一个可以自动用于验证其他服务的票据或\
  \ Cookie。\n\n一个集中的身份管理系统通常至少提供两种服务：\n\n![Image](img/squf.jpg) **账户信息：** 这是诸如用户名、主目录位置等信息。它是在\
  \ Linux 系统上识别用户的信息。通常，使用轻量目录访问协议 (LDAP) 来提供账户信息。\n\n![Image](img/squf.jpg) **认证信息：**\
  \ 这是验证用户确实如其所称身份所需的的信息。这可以通过使用存储在 LDAP 服务器上的加密密码，或通过使用 Kerberos 等认证协议来实现。\n\n表 25.2\
  \ 提供了身份管理系统提供的服务以及实现这些服务的服务器概述。\n\n![Image](img/key_topic.jpg)![Image](img/25tab02.jpg)\n\
  \n**表 25.2** 账户信息与认证服务\n\n在 RHEL 7 上，通常涉及三个服务来设置集中账户信息和认证：\n\n![Image](img/squf.jpg)\
  \ **LDAP:** LDAP 从从层次目录服务器（如 X.500 目录服务器）获取信息的协议。目前，Linux 通过多个项目可用，例如 OpenLDAP 和\
  \ 389，后者供 FreeIPA 使用。\n\n![Image](img/squf.jpg) **Kerberos:** Kerberos 作为服务可用，可以在\
  \ LDAP 目录服务器之上用于授权。\n\n![Image](img/squf.jpg) **身份管理：** 红帽身份管理 (IdM) 基于 FreeIPA\
  \ 项目。IdM 的开发是为了提供一种设置 LDAP/Kerberos 服务器的简单解决方案。它还包含一个域名系统 (DNS) 服务器，以及一个网络时间协议 (NTP)\
  \ 时间服务器。如果你使用 IdM，你就不需要单独配置 LDAP 和 Kerberos 服务器了。\n\n\n\n\n\n为了连接这些服务，红帽（Red Hat）提供了不同的解决方案。为了满足\
  \ RHCSA 和 RHCE 的目标，你必须能够连接到 LDAP 服务器并通过 Kerberos 处理授权。你可以使用 IPA 客户端或 LDAP/Kerberos\
  \ 客户端来实现这一点。配置 IPA 客户端并不是 RHCSA/RHCE 的目标。因如此，在本章中，你将学习如何使用 RHEL 7 上提供的通用 LDAP 客户端来配置身份验证。“配置带有\
  \ Kerberos 授权的 LDAP 身份验证](#ch25.html_ch25lev2sec3)”节解释了如何进行操作。在进入该节之前，让我们先讨论一些 Kerberos\
  \ 的基础知识。\n\n# 了解 Kerberos 基础\n\n作为 RHCE 目标之一，你必须配置 Kerberos 身份验证。在查看软件配置选项之前，让我们先看看\
  \ Kerberos 是如何组织的。\n\n## 了解 Kerberos 身份验证\n\nKerberos 是一种为安全网络登录设计的身份验证协议，用户在访问新服务时无需重新身份验证。此外，该服务的设计旨在尽可能地减少用户密码在网络上传输的时间（这使其容易受到攻击）。Kerberos\
  \ 身份验证基于名为 `tickets`（票据）的凭据。这些票据通过加密保护。票据被作为跨网络传输密码的替代方案。网络上传输的是票据而不是密码，而这些票据使用用户密码进行加密。\n\
  \n在 Kerberos 中，票据由中央密钥服务器颁发，称为密钥分发中心 (KDC)。Kerberos 使用“领域”（realm）”，它由所有使用相同 KDC\
  \ 获取票据的主机组成；因此，领域就像一组主机。Kerberos 领域可以与 Windows 域或 LDAP 后缀相比较。默认情况下，使用全大写的 Kerberos\
  \ 站点 DNS 域名作为 Kerberos 领域名称。因此，对于居住在 example.com 的主机，领域名称为 EXAMPLE.COM。\n\nKerberos\
  \ 不仅用于用户身份验证。运行在主机上的应用程序也可以使用 Kerberos 进行安全访问。此类主机被称为应用服务器。每个应用服务器和每台服务器在 Kerberos\
  \ 中都有一个身份，并关联有一个密码。KDC (密钥分发中心) 知道所有用户和服务器的密码。在本书后面的部分，你将学习如何将网络文件系统 (NFS) 和 Samba\
  \ 配置为 Kerberos 应用程序。\n\n当用户登录时，用户（在本地）输入其密码。登录程序随后将用户名转换为 Kerberos 主体 (principal)\
  \ 名称。然后，登录程序将请求发送到 KDC 身份验证服务，该服务将返回该主体的票据授予票 (ticket granting ticket)。\n\n接收到登录请求后，KDC\
  \ 生成一个秘密会话密钥，作为票据授予票 (TGT)。它保留一份，并使用用户密码作为加密密钥对第二份进行加密。加密副本被发送回登录程序。\n\n接收到加密副本后，登录程序尝试使用用户输入的密码对其进行解密。如果成功，则用户通过了身份验证，并获得了一个当前的\
  \ TGT。根据该当前的 TGT，用户也可以在启用 Kerberos 的网络服务上进行身份验证。由于此时的 TGT 是有效的，用户无需再次输入密码，这真的让 Kerberos\
  \ 变成了一个 SSO（单点登录）系统。\n\n在连接启用 Kerberos 的服务时，时间戳起着重要作用。这就是为什么在 Kerberos 环境中，所有服务器之间的时间同步至关重要。偏差超过几分钟可能会导致身份验证问题。\n\
  \n## 了解 Kerberos 主体\n\n为了识别 Kerberos 身份验证中的参与者，用户和网络服务使用主体（principal）。主体名称的格式为 `primary/instance@REALM`，其中实例部分是可选的。主体名称的示例是\
  \ `nfs/server1.example.com@EXAMPLE.COM`。在此名称中，使用了以下部分：\n\n![Image](img/squf.jpg)\
  \ nfs 是主体。\n\n![Image](img/squf.jpg) server1.example.com 是该主体所属的主机名称。\n\n![Image](img/squf.jpg)\
  \ EXAMPLE.COM 指的是主体所属的领域。\n\n在服务名称中，通常会使用主体名称的三个部分。但对于用户名则并非如此。在用户名中，实例部分通常会被省略；例如，一个常见的\
  \ Kerberos 用户名是 `lisa@EXAMPLE.COM`。\n\n用户和服务都拥有 Kerberos 主体。服务通常将其密码存储在 keytab 文件中，允许服务器在没有人工干预的情况下登录\
  \ Kerberos。如果服务器托管了 Kerberos 服务，它通常会有 `/etc/krb5.keytab` 文件，其中包含该服务器上所有服务主体的名称以及密码。keytab\
  \ 文件名可以不同，但通常应以 `.keytab` 结尾。\n\n***\n\n提示\n\n即使它 intended 不是一个可读的文件，你也可以使用 `strings`\
  \ 命令查看 keytab 文件的内容。列表 25.1 显示了命令 `strings /etc/krb5.keytab` 的结果。\n\n# 配置带有 Kerberos\
  \ 授权的 LDAP 身份验证\n\n在本节中，你将学习如何配置带有 Kerberos 授权的 LDAP 身份验证。第一个小节解释了此过程中涉及哪些工具和配置文件。第二个小节讨论了两个重要的后端服务：nslcd\
  \ 和 sssd。在第三个小节中，你将学习如何实际设置外部身份验证。\n\n***\n\n提示\n\n本节的信息涵盖了 RHCE 考试目标。在第 6 章“用户和组管理”中，你可以阅读如何配置服务器以对仅使用\
  \ LDAP 密码的 LDAP 服务器进行身份验证。\n\n***\n\nRHEL 7 提供 authconfig 工具来配置带有可选 Kerberos 授权的\
  \ LDAP 身份验证。authconfig 工具有三个版本：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ **authconfig** 一种命令行工具，允许管理员通过命令行选项设置身份验证。**authconfig** 命令会很长，但它们的优点是容易被编写成脚本。列表\
  \ 25.2 显示了你可以配合 **authconfig** 使用的一些命令行开关，并展示了该工具实际上是多么强大，它提供了选项来指定身份验证过程中任何重要的项。\n\
  \n![Image](img/squf.jpg) **authconfig-tui** 一种菜单驱动的交互式界面，使设置身份验证变得简单一些。\n\n\n\n\n\
  ![Image](img/squf.jpg) `authconfig-gtk` 这是一个用于设置身份验证的图形化界面。该工具不是 RHEL 典型安装的一部分。要使用它，请确保已安装\
  \ `authconfig-gtk` 软件包。\n\n**列表 25.2** `authconfig` 命令行选项部分列表\n\n点击此处查看代码图像\n\n\
  * *\n\n```\n[root@server1 ~]# authconfig --help\n\nUsage: authconfig [options] {--update|--updateall|--test|--probe|--\n\
  \nrestorebackup <name>|--savebackup <name>|--restorelastbackup}\n\nOptions:\n\n\
  \    -h,  --help               显示此帮助信息并退出\n    --enableshadow, --useshadow  默认启用影子密码\n\
