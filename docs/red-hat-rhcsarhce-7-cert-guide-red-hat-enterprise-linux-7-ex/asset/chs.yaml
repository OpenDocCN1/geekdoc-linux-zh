  **b. mail -s error root**\n\n**c. mail -s error root .**\n\n**d. mail -s error root\
  \ < .**\n\n**[10].** 在 `case` 语句中，包含一个适用于所有其他情况的行是一个好主意。以下哪一个选项可以做到这一点？\n\n**a.\
  \ *)**\n\n**b. *****\n\n**c. else**\n\n**d. or**\n\n### 基础主题\n\n## 理解 Shell 脚本的核心元素\n\
  \n基本上，一个 Shell 脚本是一系列按顺序执行的命令列表，其中包含一些脚本逻辑，允许代码仅在特定条件下执行。要理解复杂的 Shell 脚本，从一些基础脚本开始是一个好主意。列表\
  \ 31.1 显示了一个非常基础的脚本。\n\n**列表 31.1** 基础脚本示例\n\n点击此处查看代码图像\n\n```bash\n#!/bin/bash\n\
  \n#\n\n# 这是一个向世界问好的脚本\n# 使用方法: ./hello\n\nclear\n\necho hello world\n\nexit 0\n\
  ```\n\n这个基础脚本包含了在所有脚本中应该使用的几个元素。首先，有一个 shebang。这一行是 `#!/bin/bash`。当脚本从父 shell 环境启动时，它会打开一个子\
  \ shell。在这个子 shell 中，会执行不同的命令。这些命令可以以任何方式被解释，为了清楚地说明它们应该如何被解释，因此使用了 shebang。在这种情况下，shebang\
  \ 清楚地表明该脚本是一个 bash shell 脚本。也可以指定其他 shell 脚本。例如，如果你的脚本包含 Perl 代码，shebang 应该是 `#!/usr/bin/perl`。以\
  \ shebang 开始一个脚本是一个良好的习惯；如果省略了它，脚本代码将由父 shell 中使用的 shell 执行。\n\n紧接 shebang 之后，有一部分解释了脚本的主题。在每个脚本中包含几行注释都是一个好主意。在短脚本中，脚本的主题通常是显而易见的。如果脚本变得越来越长，随着越来越多的人参与编写和维护脚本，脚本编写者的意图往往会变得不那么清晰。为了避免这种情况，请确保你包含了以\
  \ `#` 开头的注释行。不要只把它们放在脚本的开头，还要 放在脚本中每个子章节的开头。如果你在几个月后阅读你的脚本，这绝对会有帮助！你也可以在行内使用注释。无论使用在哪个位置，从\
  \ `#` 直到行尾的所有内容都是注释。\n\n然后，是脚本的正文。在列表 31.1 的示例脚本中，它只是一个包含几个按顺序执行命令的简单脚本。你会发现，随着脚本的发展，正文可能会变得更大。\n\
  \n在脚本的末尾，我包含了 `exit 0` 语句。`exit` 语句告诉父 shell 脚本是否成功。脚本中最后一个命令的退出状态就是脚本本身的退出状态，除非在脚本末尾使用了\
  \ `exit 0` 命令。但这样做是好的。\n\n\n\n\n为了评估启动此脚本时使用的参数，使用了一个带有 `for` 的条件循环。在带有 `for` 的条件循环中，只要条件为真，命令就会执行。在当前脚本中，条件是\
  \ `for i in “$@”`，它的意思是“对于每一个参数”。脚本每通过一次循环，`$@` 变量中的一个值就会被赋值给变量 `$i`。因此，只要有参数，脚本的主体就会被执行。`for`\
  \ 循环的主体始终以 `do` 开始并以 `done` 结束，在这两个词之间，列出了需要执行的命令。因此，列表 31.3 中的示例脚本将使用 `echo` 来显示每个参数的值，并在没有更多可用参数时停止。在练习\
  \ 31.2 中，你可以亲手尝试一下。\n\n***\n\n## 练习 31.2 使用位置参数\n\n在本次练习中，你将学习如何编写一个与位置参数工作的脚本。\n\
  \n1. 打开编辑器创建文件 `ex312a`，并将列表 31.2 中的内容复制到该文件中。\n2. 保存文件并使其具有可执行性。\n3. 运行命令 `./ex312a\
  \ a b c`。你看到有三行内容输出。\n4. 运行命令 `./ex312a a b c d e f`。你看到仍然只有三行输出。\n5. 打开编辑器创建文件\
  \ `ex312`，并将列表 31.3 中的内容复制到该文件中。\n6. 保存文件并使其具有可执行性。\n7. 运行命令 `./ex312 a b c`。你看到有三行输出。\n\
  8. 在不带参数的情况下运行命令 `./ex312`。你看到它没有任何输出。\n\n***\n\n### 使用变量\n\n![Image](img/key_topic.jpg)\n\
  \n变量是一个标签，用于引用内存中包含特定值的特定位置。可以使用 `NAME=value` 静态定义变量，也可以以动态方式定义。动态定义变量有两种解决方案：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) 在脚本中使用 `read` 来向运行脚本的用户请求输入\n\
  \n![Image](img/squf.jpg) 使用命令替换来使用命令的结果并赋值给变量。例如，`date +%d-%m-%y` 命令以日-月-年的格式显示当前日期。要将其赋值给脚本，你可以使用\
  \ `TODAY=$(date +%d-%m-%y)`。在命令替换中，你只需要将想要使用的命令结果放在美元符号 `$` 和大括号 `{}` 之间即可。\n\n\
  在之前关于位置参数的节中，你已经学习了如何在启动脚本时提供参数。在某些情况下，当发现某些关键信息缺失时，请求信息可能更高效。列表 31.4 中的脚本展示了如何这样做。\n\
  \n#### 列表 31.4 使用 `read` 命令的脚本示例\n\n点击此处查看代码图像\n\n***\n\n```bash\n#!/bin/bash\n\n\
  if [ -z $1 ]; then\n          echo enter a name\n          read NAME\nelse\n   \
  \       NAME=$1\nfi\n\necho you have entered the text $NAME\n\nexit 0\n```\n\n***\n\
  \n在列表 31.4 的示例脚本中，使用了 `if ... then ... else ... fi` 语句来检查参数 `$1` 是否存在。这是通过使用 `test`\
  \ 完成的（`test` 本身就是一个命令）。`test` 命令有两种书写方式：`test` 或 `[ ... ]`。在列表 31.4 中，执行 `if [ -z\
  \ $1 ] ...` 这一行是为了检查测试 `-z $1` 是否为真。`-z test` 检查 `$1` 是否不存在。换句话说，`if [ -z $1 ]`\
  \ 这一行检查 `$1` 是否为空，这意味着在启动此脚本时没有提供任何参数。如果是如此，则执行 `then` 语句之后的命令。注意，当使用方括号编写 `test`\
  \ 命令时，在左括号之后和右括号之前必须使用空格，如果没有空格，命令将无法工作。\n\n注意 `then` 语句紧跟在测试之后。这是因为使用了分号（`;`）。分号是一个命令分隔符，可以替换脚本中的换行符。在\
  \ `then` 语句中，执行了两个命令：一个用于在屏幕上显示消息的 `echo` 命令，以及 `read` 命令。\n\n`read` 命令会停止脚本，以便处理用户输入并存储在变量\
  \ `NAME` 中。因此，`read NAME` 将所有用户输入放入变量 `NAME` 中，该变量将在脚本稍后中使用。\n\n在列表 31.4 的示例脚本中，下一部分由\
  \ `else` 引入。\n\n\n\n\n\n在列表 31.4 中，你已经看到了如何评估两个条件，包括语句中的一个 `else`。列表 31.5 展示了如何评估多个条件，将\
  \ `else` 与 `if` 合并为 `elif`。如果需要检查许多不同的值，这种方法非常有用。注意在此示例列表中，也使用了多个测试命令。\n\n**列表 31.5**\
  \ 使用 `if then else` 的示例\n\n点击此处查看代码图像\n\n```bash\n#!/bin/bash\n\n# 使用一个参数运行此脚本\n\
  # 目标是找出参数是文件还是目录\nif [ -f $1 ]\nthen\n  echo \"$1 is a file\"\nelif [ -d $1 ]\n\
  then\n  echo \"$1 is a directory\"\nelse\n  echo \"I do not know what \\$1 is\"\n\
  fi\nexit 0\n```\n\n### `||` 和 `&&`\n\n与其编写完整的 `if ... then` 语句，你可以使用逻辑运算符 `||` 和\
  \ `&&`。`||` 是逻辑或，只有在语句的第一部分为假时才会执行语句的第二部分；`&&` 是逻辑与，只有在语句的第一部分为真时才会执行语句的第二部分。考虑这两个行命令：\n\
  \n```bash\n[ -z $1 ] && echo no argument provided\nping -c 1 10.0.0.20>/dev/null\
  \ || echo node is not available\n```\n\n在第一个示例中，执行了一个测试来检查 `$1` 是否为空。如果该测试为真（基本上意味着命令以代码\
  \ 0 退出），则执行第二个命令。在第二个示例中，使用 `ping` 命令来检查主机的可用性。此示例使用了逻辑或，以便在 `ping` 命令执行失败时输出文本“node\
  \ is not available”。你经常发现，人们并不使用完整编写的 `if then` 语句，而是使用 `&&` 和 `||` 结构。在练习 31.4\
  \ 中，你可以练习 `if then else`，可以使用 `if ... then ..else` 或者 `&&` 和 `||`。\n\n#### `if ...\
  \ then ... else`\n\n在这一项练习中，你将编写一个检查 Apache 服务器可用性的脚本。\n\n1. 启动编辑器并创建一个名为 `file`\
  \ 的脚本。\n2. 将列表 31.5 中的内容复制到此脚本中。\n3. 使用它运行几次测试，例如 `./file /etc/hosts`、`./file /usr`、`./file\
  \ nonexistent`。\n\n#### 应用 `for`\n\n`for` 条件为处理数据范围提供了极佳的解决方案。在列表 31.6 中，你可以看到 `for`\
  \ 的第一个示例，其中定义了一个范围，只要该范围内还有未处理的值，就会进行处理。\n\n**列表 31.6** 使用 `for` 的示例\n\n```bash\n\
  #!/bin/bash\nfor (( COUNTER=100; COUNTER>1; COUNTER-- )); do\n  echo $COUNTER\n\
  done\nexit 0\n```\n\n`for` 条件语句始终以 `for` 开始，后面紧跟需要检查的条件。然后是 `do`，后面是当条件为真时需要执行的命令，条件语句以\
  \ `done` 结束。在列表 31.6 的示例中，你可以看到条件是一个赋值给变量 `COUNTER` 的数字范围。该变量首先被初始化为 100，只要该值大于\
  \ 1，在每次迭代中就会减 1。只要条件为真，就会使用 `echo` 命令显示 `$COUNTER` 变量的值。\n\n在列表 31.7 中，你可以看到我最喜欢的几个\
  \ `for` 单行命令之一。这次范围被定义为一系列数字，从 100 开始到 104。\n\n**列表 31.7** 使用 `for` 的单行命令示例\n\n\
  ```bash\nfor i in {100..104}; do\n  ping -c 1 192.168.4.$i >dev/null && echo 192.168.4.$i\
  \ is up\ndone\n```\n\n注意范围是如何定义的：你首先指定第一个数字，后面跟着两个点，并以范围内的最后一个数字结束。通过 `for i in`，这些数字中的每一个都被赋值给变量\
  \ `i`。对于这些数字中的每一个，都会执行一次 `ping` 命令，其中选项 `-c 1` 确保发送一个 ping 请求。在这个 `ping` 命令中，重要的不是结果本身，这就是为什么结果被重定向到\
  \ `/dev/null` 设备。根据 `ping` 命令的退出状态，将执行 `&&` 后面的部分。因此，如果可以访问主机，就会输出一行内容表示它处于在线状态。\n\
  \n### 理解 `while` 和 `until`\n\n你刚刚读过的 `for` 语句适用于处理项目范围，而如果你想监控某些内容（例如进程的可用性），`while`\
  \ 语句则很有用。`while` 的对应物是 `until`，它会持续迭代直到某个特定条件为真。在列表 31.8 中，你可以看到如何使用 `while` 来监控进程活动。\n\
  \n**列表 31.8** 使用 `while` 监控进程\n\n```bash\n#!/bin/bash\n# 用法：monitor <processname>\n\
  while ps aux | grep $1 | grep -v grep > /dev/tty11\ndo\n  sleep 5\ndone\nclear\n\
  echo your process has stopped\nlogger $1 is no longer present\nmail -s \"process\
  \ $1 has stopped\" root < .\n```\n\n列表 31.8 包含两个部分。首先是 `while` 循环。其次是 `while` 循环不再为真时需要执行的所有内容。`while`\
  \ 循环的核心是 `ps` 命令，通过 `grep` 查找 `$1`。注意 `grep -v grep` 的用法，它从结果中排除包含 `grep` 命令的行。`ps\
  \ aux` 命令的结果被重定向到 `/dev/tty11`。这使得以后可以从 tty11 读取结果，但默认情况下不会显示。`while` 语句之后是当语句为真时需要执行的命令。在这种情况下，命令是\
  \ `sleep 5`，它基本上会让脚本暂停 5 秒。只要 `while` 命令的结果为真，它就会持续运行。如果结果不再为真（在这种情况下意味着进程不再可用），它就会停止并执行\
  \ `while` 循环之后的命令。\n\n\n\n\n\n`while` 的对应物是 `until`，其示例见列表 31.9。`until` 开启一个循环，一直持续到条件为真。在列表\
  \ 31.9 中，它被用于过滤 `users` 命令的输出，查找是否存在 `$1`（通常是一个用户名）。在 own 命令为真之前，循环会持续。当在 `users`\
  \ 命令的输出中找到用户名时，循环结束，并执行 `until` 循环之后的命令。\n\n**列表 31.9** 使用 `until` 监控用户登录\n\n点击此处查看代码图像\n\
  \n* * *\n\n```bash\n#!/bin/bash\n\n#\n\nuntil users | grep $1 > /dev/null\ndo\n\
  \    echo $1 is not logged in yet\n    sleep 5\ndone\n\necho $1 has just logged\
  \ in\nmail -s \"$1 has just logged in\" root < .\n```\n* * *\n\n### 理解 case\n\n\
  `case` 是重要的迭代循环中的最后一种。`case` 语句用于评估多个预期的值。`case` 语句在 Linux 启动脚本中特别重要，在之前的 RHEL 版本中，这些脚本被用于启动服务。在\
  \ `case` 语句中，你定义每一个预期的特定参数，后面跟着使用了该参数时需要执行的命令。在列表 31.10 中，你可以看到在 RHEL 6 上启动几乎任何服务的\
  \ `case` 语句蓝图。\n\n**列表 31.10** 使用 `case` 评估特定情况\n\n点击此处查看代码图像\n\n* * *\n\n```bash\n\
  case \"$1\" in\n  start)\n          start;;\n  stop)\n          rm -f $lockfile\n\
  \          stop;;\n  restart)\n          restart;;\n  reload)\n          reload;;\n\
  \  status)\n          status\n          ;;\n  *)\n          echo \"Usage: $0 (start|stop|restart|reload|status)\"\
  \n          ;;\nesac\n```\n* * *\n\n`case` 语句有几个特殊之处。首先，通用语法是 `case *item-to-evaluate*\
  \ in`。接着是所有需要评估的可能值的列表。每个项目都以 `)` 结尾。然后是如果使用了特定参数时需要执行的命令列表。命令列表以双分号 `;;` 结束。这个\
  \ `;;` 可以直接跟在最后一个命令后面，也可以单独占一行。还要注意，`*)` 指的是之前未指定的所有其他选项。它是一个“捕获”语句。`case` 迭代循环通过\
  \ `esac` 语句关闭。\n\n注意 `case` 中的评估是按顺序执行的。当匹配到第一个项时，`case` 语句将不再评估其他任何内容。在评估过程中，可以使用类似于通配符的模式。这在\
  \ `*)` 评估中可见，它可以匹配所有内容。但你也可以使用诸如 `start|Start|START)` 这样的评估来匹配不同的情况。\n\n### Bash\
  \ Shell 脚本调试\n\n当脚本执行结果与你预期的那样时，进行一些调试非常有用。如果脚本没有按预期运行，尝试将其作为 `bash -x` 命令的参数来启动。这会逐行显示脚本正尝试执行的操作，并在无法工作时显示错误。列表\
  \ 31.11 使用 `bash -x` 进行调试\n\n点击此处查看代码图像\n\n\n\n\n\n\n“我已经学会这些了吗？”测验可以让你评估自己是否应该彻彻阅读整个章节，还是直接跳转到“备考任务”部分。如果你对这些问题的答案或对你对这些主题知识的评估有疑问，请通读整个章节。表\
  \ 32.1 列出了本章的主要标题及其对应的“我已经学会这些了吗？”测验问题。你可以在附录 A“‘我已经学会这些了吗？测验和‘复习题’答案](#app01.html_app01)”中找到答案。\n\
  \n![Image](img/32tab01.jpg)\n\n**表 32.1** “我已经学会这些了吗？”章节与问题映射表\n\n**1.** 当使用 `firewalld`\
  \ 服务管理防火墙时，有两个服务永远不应该在你的服务器上运行。当你使用 `firewalld` 时，哪些服务不应该运行？\n\n**a.** `iptables`\n\
  \n**b.** `ebtables`\n\n**c.** `ip6tables`\n\n**d.** `network`\n\n**2.** 下列哪个不能使用\
  \ `firewalld` 富规则（rich rules）配置？\n\n**a.** 日志\n**b.** 基于一个特定 IP 地址而不是分配给区域的所有 IP\
  \ 地址进行过滤\n**c.** 自定义端口分配\n**d.** 速率限制\n\n**3.** 在 `firewalld` 配置中，你可以使用不同的构建块。这些构建块按照特定的顺序处理，并如如下列表所示。哪个答案列出了它们的正确顺序？\n\
  \n**1.** 拒绝规则\n**2.** 日志规则\n**3.** 直接规则（Direct rules）\n**4.** 允许规则\n**5.** 端口转发和伪装规则\n\
  \n**a.** 3, 5, 2, 4, 1\n**b.** 5, 3, 2, 4, 1\n**c.** 3, 5, 4, 1, 2\n**d.** 2, 1,\
  \ 5, 3, 4\n\n**4.** 哪个 man 页包含关于 `firewalld` 富规则语法的示例？\n\n**a.** (1) `firewall-cmd`\n\
  **b.** (5) `firewalld.conf`\n**c.** (5) `firewalld.richlanguage`\n**d.** (5) `firwalld.zones`\n\
  \n**5.** 下列哪个显示了添加阻止一个特定 IP 地址访问的富规则的正确语法？\n\n**a.** `firewall-cmd --zone=dmz --add-rich-rule='rule\
  \ family=ipv4 source address=10.0.0.100/32 reject’`\n**b.** `firewall-cmd --zone=dmz\
  \ --add-rich-rule='rule family=ip4 source address=10.0.0.100/32 reject’`\n**c.**\
  \ `firewall-cmd --zone=dmz --add-rich-rule='family=ipv4 source address=10.0.0.100/32\
  \ reject’`\n**d.** `firewall-cmd --zone=dmz --add-rich-rule='rule family=ipv4 source=10.0.0.100/32\
  \ reject’`\n\n**6.** 下列哪个显示了向 syslog 写入日志信息的正确语法，其中所有日志消息都以 **SSH ATTEMPT** 为前缀，日志优先级设置为\
  \ **notice**，且每分钟记录两个包？\n\n**a.** `firewall-cmd --zone=dmz --add-rich-rule='rule\
  \ service name=“ssh” log prefix=“SSH ATTEMPT:” level=“notice” limit value=“2/m”\
  \ accept`\n**b.** `firewall-cmd --zone=dmz --add-rich-rule='rule service name=“ssh”\
  \ log prefix=“SSH ATTEMPT:” facility=“notice” limit=“2/m” accept`\n**c.** `firewall-cmd\
  \ --zone=dmz --add-rich-rule='rule service name=“ssh” log prefix=“SSH ATTEMPT:”\
  \ level=“notice” limit=“2/m” accept`\n**d.** `firewall-cmd --zone=dmz --add-rich-rule='rule\
  \ service name=“ssh” log prefix=“SSH ATTEMPT:” facility=“notice” limit value=“2/m”\
  \ accept`\n\n**7.** 关于端口转发的哪个陈述是正确的？\n\n**a.** 配置端口转发必须使用富规则。\n**b.** 端口转发只能在路由器上配置。\n\
  **c.** 要配置到另一个主机的端口转发，必须为返回数据包配置伪装（masquerading）。\n**d.** 配置端口转发，必须在 `firewall-cmd`\
  \ 中使用 `--add-port` 选项。\n\n**8.** 下列哪个显示了伪装的正确语法？\n\n**a.** `firewall-cmd --zone=dmz\
  \ --add-rich-rule='rule family=ipv4 source address=10.0.0.100/32 reject’`\n**b.**\
  \ `firewal-cmd --zone=dmz --add-rich-rule='rule family=ip4 source address=10.0.0.100/32\
  \ reject’`\n**c.** `firewall-cmd --zone=dmz --add-rich-rule='family=ipv4 source\
  \ address=10.0.0.100/32 reject’`\n**d.** `firewall-cmd --zone=dmz --add-rich-rule='rule\
  \ family=ipv4 source=10.0.0.100/32 reject’`\n\n**9.** 关于伪装的哪个陈述是正确的？\n\n**a.** 伪装必须在公共区域上配置。\n\
  **b.** 伪装也可以针对 IPv6 进行配置。\n**c.** 伪装需要为外部网卡设置公网 IP 地址。\n**d.** 伪装需要将主机配置为路由器。\n\n\
  **10.** 下列哪个是伪装的典型位置？\n\n**a.** `/etc/system`\n**b.** `/usr/lib/system`\n**c.**\
  \ `/var/systemd`\n**d.** `/root/systemd`\n\n### 基础主题\n\n* *\n\n如果你对这些问题的答案或对你对这些主题知识的评估有疑问，请通读整个章节。表\
  \ 32.1 列出了本章的主要标题及其对应的“我已经学会这些了吗？”测验问题。你可以在附录 A“‘我已经学会这些了吗？测验和‘复习题’答案](#app01.html_app01)”中找到答案。\n\
  \n### 排除 ipt 服务\n\n* *\n\n当使用 `firewalld` 服务管理防火墙时，有两个服务永远不应该在你的服务器上运行。当你使用 `firewalld`\
  \ 时，哪些服务不应该运行？\n\nSystemd 提供了一个很好的解决方案来确保不需要的服务启动：你可以使用 `systemctl mask` 来排除它们。\n\
  \n要排除所有基于 iptables 的服务从不启动，输入 `for i in iptables ip6tables ebtables; do systemctl\
  \ mask $i; done`。此命令会创建一个符号链接。以下示例显示了这种情况：\n\n```\n[root@localhost ~]# for i in\
  \ iptables ip6tables ebtables; do\n systemctl mask $i; done\n\nln -s '/dev/null'\
  \ '/etc/systemd/system/iptables.service'\n```\n\n注意，这是禁用服务的优雅方法。`/etc/systemd/system`\
  \ 中的文件具有更高的优先级。\n\n通过将 `/etc/systemd/system` 中的相关 iptables 服务脚本链接到 `/dev/null`，它们永远启动，但你可以通过删除这些符号链接或使用命令\
  \ `for i in iptables ip6tables ebtables; do systemctl unmask $i; done` 重新启用它们。\n\
  \n* *\n\n注意：`ebtables` 服务用于管理 Linux 软件桥上的防火墙。\n\n* *\n\n提示：如果你非常熟悉 iptables，可以在考试中使用\
  \ iptables。因为 `firewalld` 是红帽采取的防火墙配置的新方向，在本章中，你将学习如何使用 `firewalld` 配置防火墙。\n\n\n\
  \n\n\n在第 22 章中，你学习了如何向 firewalld 区域中添加服务文件。firewalld 带有许多默认服务，不要将其与 systemd 服务混淆，后者是完全不同的东西。你可以使用\
  \ `firewall-cmd --get-services` 列出这些服务。该命令显示所有的 firewalld 服务，它们以 XML 文件的存储在 `/usr/lib/firewalld/services`\
  \ 和 `/etc/firewalld/services` 目录下。\n\n**提示**\n\n在 RHEL 7 上，许多服务（如 `systemd`、`firewalld`、`modprobe`\
  \ 等）具有不应被修改的默认配置文件。这些默认配置文件存储在 `/usr/lib` 目录中。永远不要更改它们，因为当提供配置文件的 RPM 包更新时，它们可能会被覆盖。自定义配置文件应该存储在\
  \ `/etc` 目录下，firewalld 也是如此，它将自定义配置文件存储在 `/etc/firewalld`。这些自定义文件的名称可能与 `/usr/lib/firewalld`\
  \ 中的默认文件相同，但始终具有更高优先级。这不仅适用于 firewalld，也适用于所有以这种方式存储服务文件的服务。\n\n在某些情况下，你需要向防火墙配置中添加默认未包含的端口。如果是这样，你可以使用\
  \ `firewall-cmd` 命令的 `--add-port` 选项，你也可以创建一个服务配置文件作为替代。在练习 32.1 中，你将学习如何创建一个自定义服务文件，允许通过端口\
  \ 2022 访问 ssh 服务。\n\n**注意**\n\nfirewalld 服务与 systemd 服务没有关系。firewalld 服务的唯一目的是开放防火墙中的一个端口；它不会启动进程，也不会更改由\
  \ systemd 服务管理的进程配置。请注意，在练习 32.1 中，你只创建了 firewalld 服务，而没有修改进程配置。因此，在练习结束时，将没有服务在\
  \ 2022 端口上监听！（当然，你可以自由地重新配置你的 ssh 服务以在 2022 端口提供服务。）\n\n**注意**\n\n在接下来的练习中，你将通过编辑\
  \ XML 代码来创建一个服务文件。作为替代，你可以使用 `firewall-cmd --new-service` 执行此操作。更多信息请参阅 `man firewall-cmd`。\n\
  \n## 练习 32.1 创建自定义 Firewalld 服务\n\n**1.** 因为基于现有服务文件创建新服务文件要简单得多，请使用命令 `cp /usr/lib/firewalld/services/ssh.xml\
  \ /etc/firewalld/services`。\n\n**2.** 使用编辑器打开 `/etc/firewalld/services/ssh` 文件。它应该显示如下内容（参见列表\
  \ 32.1）。\n\n**列表 32.1** Firewalld ssh 服务文件内容\n\n点击此处查看代码图像\n\n```bash\n[root@localhost\
  \ services]# cat ssh.xml\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<service>\n\
  \  <short>SSH</short>\n  <description>Secure Shell (SSH) 是一种用于登录远程机器并执行命令的协议。它提供了安全的加密通信。如果你计划通过防火墙的接口通过\
  \ SSH 远程访问你的机器，请启用此选项。你需要安装 openssh-server 包，此选项才有用。</description>\n  <port protocol=\"\
  tcp\" port=\"22\"/>\n</service>\n```\n\n**3.** 在服务文件中，将设置为 22 的端口更改为新端口（2022）。\n\
  \n**4.** 修改描述设置，显示这是一个修改过的服务文件。\n\n**5.** 保存更改到磁盘并使用 `mv /etc/firewalld/services/ssh\
  \ /etc/firewalld/services/ssh-custom`。\n\n**6.** 输入 `firewall-cmd --get-services`。注意，你还没有看到列出新的服务文件。\n\
  \n**7.** 输入 `firewall-cmd --reload` 并重复 `firewall-cmd --get-services`。你现在会看到列出的新服务文件。\n\
  \n**8.** 输入 `firewall-cmd --add-service ssh-custom --permanent`，然后执行 `firewall-cmd\
  \ --reload`。\n\n**9.** 输入 `firewall-cmd --list-services`。你将看到新服务文件已添加到默认区域。\n\n\
  **10.** 注意，这个练习展示了如何创建防火墙服务。要让该进程在新端口上可用，还必须修改进程配置。请阅读第 39 章“管理 SSH”，获取有关如何处理 ssh\
  \ 服务的更多详情。\n\n### 配置 Firewalld 丰富规则 (Rich Rules)\n\n到目前为止，你一直在使用 firewalld 服务。虽然方便，但\
  \ firewalld 服务提供的选项有时有点有限。这就是为什么 firewalld 还提供了允许流量通过的替代解决方案。目前有两种解决方案：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 直接规则（Direct rules）允许管理员向防火墙配置中添加详细的手写代码规则。它们提供了高级功能，但较难管理。它们使用的语法非常像\
  \ iptables 语法，允许管理员以类似 iptables 的方式与 firewalld 工作。对于 RHCE 考试，你不需要知道如何创建直接规则。\n\n\
  ![Image](img/squf.jpg) 丰富规则（Rich rules）为管理员提供了一种易于使用的表达式语言，用于定义无法使用默认 firewalld\
  \ 语法创建自定义规则。\n\n**提示**\n\n不要在直接规则上浪费时间；在 RHCE 考试中，你只需要知道如何配置丰富规则。\n\n#### 丰富规则语法\n\
  \n丰富规则用于创建允许/拒绝规则，但带有高级选项，例如：\n\n![Image](img/squf.jpg) 日志配置\n\n![Image](img/squf.jpg)\
  \ 端口转发\n\n![Image](img/squf.jpg) 伪装\n\n![Image](img/squf.jpg) 速率限制\n\n![Image](img/squf.jpg)\
  \ 为特定区域允许/拒绝连接\n\n丰富规则的基本语法如下：\n\n![Image](img/squf.jpg) 规则\n\n![Image](img/squf.jpg)\
  \ [source] [destination]\n\n![Image](img/squf.jpg) {service|port|protocol|icmp-block|masquerade|forward-port}\n\
  \n![Image](img/squf.jpg) [log] [audit]\n\n![Image](img/squf.jpg) [accept|reject|drop]\n\
  \n**提示**\n\n在尝试记忆丰富规则语法之前，请查看 `man 5 firewalld.richlanguage`。该手册包含了一些创建丰富规则的良好示例，这将帮助你在参加考试时轻松地找到正确的语法。\n\
  \n#### 排序\n\n在使用丰富规则时，很容易创建冲突规则。例如，你可能拒绝访问整个网络，但想允许访问该网络中的一个特定节点。因为可能会创建冲突规则，所以在使用丰富规则时，排序也变得重要。区域内的基本排序规则如下：\n\
  \n**1.** 直接规则\n\n**2.** 端口转发和伪装规则\n\n**3.** 日志规则\n\n**4.** 允许规则\n\n**5.** 拒绝规则\n\
  \n通常，不匹配任何规则的规则将被拒绝，但这取决于默认区域的配置。例如，如果使用了信任区域（trusted zone），未匹配任何内容的数据包将被允许。\n\n\
  ##### 管理丰富规则\n\n在使用丰富规则时有四种基本操作。表格 32.2 描述了这些操作。\n\n![Image](img/key_topic.jpg)![Image](img/32tab02.jpg)\n\
  \n**表格 32.2** 丰富规则基本操作\n\n**提示**\n\n为了更方便地测试丰富规则，你可以带超时时间将丰富规则添加到运行时配置中。一旦超时时间过去，丰富规则将自动删除。这确保了你在丰富规则配置出现错误后不会被锁在外面，这在远程服务器上配置防火墙时非常有用。要为丰富规则添加超时时间，请在\
  \ `firewall-cmd` 规则末尾添加 `--timeout=XX`。\n\n\n\n\n为了帮助你学习丰富的富规则（rich rules）语法，练习\
  \ 32.2 将引导你完成向区域添加一些富规则的操作。请注意，没有任何规则被设置为 `--permanent`，因为此项练习仅用于演示富规则的工作机制。\n\n\
  ***\n\n## 练习 32.2 使用富规则\n\n1. 从 root shell 中，输入 `firewall-cmd --zone=dmz --add-rich-rule=\
  \ ‘rule family=ipv4 source address=10.0.0.100/32 reject’ --timeout=60`。\n\n2. 输入\
  \ `firewall-cmd --list-all --zone=dmz` 以验证规则已成功添加。\n\n3. 现在输入 `firewall-cmd --add-rich-rule='rule\
  \ service name=http log limit value=3/m accept’ --zone=dmz`。\n\n4. 再次输入 `firewall-cmd\
  \ --list-all --zone=dmz` 以验证新规则已成功添加。同时请注意，你在练习第 1 步中添加的规则现在已经消失了。\n\n5. 输入 `firewall-cmd\
  \ --add-rich-rule='rule protocol value=icmp accept’ --zone=dmz`。此规则允许所有进入非军事化区（DMZ）的互联网控制消息协议（ICMP）流量。\n\
  \n6. 输入 `firewall-cmd --add-rich-rule='rule family=ipv4 source address=10.0.0.0/24\
  \ port port=7900-7905 protocol=tcp accept’ --zone=dmz`。\n\n7. 使用 `firewall-cmd --list-all\
  \ --zone=dmz` 验证所有富规则已成功添加。\n\n***\n\n### 使用富规则日志\n\n在练习 32.2 的命令中，你看到为发送到 `hpptd`\
  \ 服务的规则添加日志行，限制为每分钟三次。在富规则中，你可以更具体地指定应该记录什么以及如何记录。你还可以添加日志前缀和级别选项。日志前缀用于向 syslog\
  \ 写入消息，而级别决定了日志级别（在不同的日志系统中被称为 `priority`）。以下是此类富规则的示例：\n\n点击此处查看代码\n\n```\nfirewall-cmd\
  \ --zone=dmz --add-rich-rule='rule service name=\"ssh\" log\n  prefix=\"SSH ATTEMPT:\
  \ \" level=\"notice\" limit value=\"3/m\" accept\n```\n\n***\n\n### 提示\n\n通过从控制台而非安全\
  \ Shell（SSH）创建所有防火墙配置，可以避免考试中配置防火墙时出现问题。如果你操作错误，至少不会丢失连接。\n\n***\n\n### 配置网络地址转换\n\
  \n网络地址转换 (NAT) 是 firewalld 的常用功能。要使用 NAT，需要将 RHEL 7 机器配置为路由器。因此，它至少需要两个网络接口并将一个接口的数据包转发到另一个接口。要将服务器配置为路由器，请确保设置\
  \ sysctl 调优参数 `net.ipv4.ip_forward = 1`。更多关于如何执行此操作的信息请参阅第 28 章“系统优化基础”。\n\n当数据包在\
  \ NAT 配置中从一个接口转发到另一个接口时，数据包头会被修改。NAT 有两种：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ 在伪装中，内部网络节点的 IP 地址会被 NAT 路由器的 IP 地址更改。目的是确保私有网络上的主机可以在互联网上通信，但无法被直接访问。\n\n![Image](img/squf.jpg)\
  \ 在端口转发中，NAT 路由器将所有指向 NAT 路由器公共端口的流量重定向到私有网络上的另一个端口（通常是另一个主机）。端口转发使私有网络上的服务在互联网可用，即使它们未运行直接连接互联网的主机上。\n\
  \n### 配置伪装\n\n伪装是一种应用于 IPv4 网络的常用技术。firewallld 不能在 IPv6 中使用伪装。在伪装中，私有网络主机的 IP 地址被\
  \ NAT 路由器的公 IP 地址替换。然后 NAT 路由器将数据包转发到其在互联网上的目的地。在此过程中，NAT 路由器还会更改传出包的源端口地址。当来自互联网主机的响应返回时，NAT\
  \ 路由器将使用发送响应的端口地址将数据包转发到数据包原始的主机。\n\n要为特定区域的主机配置伪装，请使用以下命令：\n\n点击此处查看代码\n\n```\n\
  firewall-cmd --permanent --zone=<ZONE> --add-masquerade\n```\n\n此命令对来自该特定区域所有主机的包进行伪装。如果你需要对哪些包被伪装进行更精确的控制，可以添加仅匹配来自特定源地址数据包的富规则：\n\
  \n点击此处查看代码\n\n```\nfirewall-cmd --permanent --zone=<ZONE> --add-rich-rule='rule\n\
  \  family=ipv4 source address=10.0.0.0/24 masquerade'\n```\n\nIP 伪装可以从命令行配置。你也可以从\
  \ firewall-config 界面创建基础伪装配置。在 firewall-config 中执行此操作，只需指定区域并点击`伪装` 标签。然后点击`Masquerade\
  \ Zone`选项以启用它。图 32.1 显示了该界面。\n\n![Image](img/32fig01.jpg)\n\n**图 32.1** 从 firewall-config\
  \ 界面启用伪装。\n\n### 配置端口转发\n\n端口转发是使私有网络服务在 NAT 路由器的公共端口上用的极佳方法。所有指向特定端口的数据包都将转发到私有主机。当配置了端口转发时，你还需要处理反方向的数据包。为了让私有网络上的主机向公共网络上的原始源发送数据包，必须也配置伪装。因此，在配置端口转发时，需要两个配置：\n\
  \n![Image](img/squf.jpg) 需要端口转发使私有主机上的服务可用。\n\n![Image](img/squf.jpg) 除非在本地主机上使用\
  \ NAT，否则需要伪装才能从这些私有网络上的主机发回响应。\n\n要配置端口转发，你需要 `--add-forward-port` 选项，随后是源和目的端口配置。例如，如果你想将所有进入\
  \ NAT 路由器 2022 端口的数据包转发到内部主机 10.0.0.10 上的 SSH 进程，你需要以下命令：\n\n点击此处查看代码\n\n```\nfirewall-cmd\
  \ --permanent --zone=public --add-forward-port=port=2022:proto=tcp:toport=22:toaddr=10.0.0.10\n\
  ```\n\n不要忘记，要使此生效，必须在公共区域的接口上也配置伪装。在练习 32.3 中，你将练习端口转发配置。\n\n***\n\n## 练习 32.3 配置端口转发\n\
  \n为了完成此练习，你需要两台服务器。在 server1 上配置端口转发，server2 用于测试。*不要*进行持久化配置；它们可能会干扰你在后续章节练习中需要完成的任务。\n\
  \n1. 在 server1 上，输入 `firewall-cmd --add-forward-port=port=4404:proto:tcp:toport=22:toaddr=<YOUR-IP-ADDRESS>`。\n\
  \n2. 从 server2 上，使用 `ssh -p 4044 server1` 验证现在也可以通过端口 4044 访问 ssh 服务。注意，由于这是同一主机的配置，因此不需要额外的伪装规则。\n\
  \n***\n\n\n\n\n与伪装（masquerading）类似，你可以通过 `firewall-config` 实用程序轻松地配置端口转发。要执行此操作，请选择你想要应用的区域并点击\
  \ `端口转发` 标签页。这将打开你在图 32.2 中看到的界面。在此界面中，首先选择源协议和端口。然后指定目标地址。选择“本地转发（Local Forwarding）”以将指定端口上的入站流量转发到同一主机上的另一个端口。如果你想将流量转发到另一台机器上的端口，请使用“转发到另一个端口（Forward\
  \ to Another Port）”。如果尚未启用伪装，界面会提示并询问你是否也启用伪装。对此问题回答 `Yes`，因为如果没有伪装，发往转发端口的数据包的响应将无法发送给请求源者。\n\
  \n![Image](img/32fig02.jpg)\n\n**图 32.2** 从 `firewall-config` 接口配置端口转发。\n\n在使用 `firewall-config`\
  \ 创建防火墙配置时，不要忘记选择 `Permanent`（永久）选项。\n\n#### 总结\n\n在本章中，你学习了高级防火墙配置。你阅读了关于如何使用富规则（rich\
  \ rules），这些规则允许你更具体地指定想要允许或不允许哪些类型的流量。你还阅读了关于 NAT 以及该技术如何用于配置 IP 伪装和配置端口转发。\n\n\
  ### 考试准备任务\n\n### 复习所有核心主题\n\n复习本章中最重要的主题，这些主题在页外边缘处用核心主题（Key Topic）图标标记。表 32.3\
