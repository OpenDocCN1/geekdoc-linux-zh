  \n6. 你想关闭从 `journald` 发送到 `rsyslogd` 的消息功能。如何操作？\n\na. 在 `rsyslog.conf` 中关闭 `imuxsock`\
  \ 模块。\nb. 在 `rsyslog.conf` 中关闭 `imjournal` 模块。\nc. 在 `/etc/systemd/journald.conf`\
  \ 中设置 `ForwardToSyslog=no`。\nd. 在 `/etc/systemd/journald.conf` 中设置 `UseSyslog=no`。\n\
  \n7. 下列哪项*不是*使用中央日志服务器的典型优势？\n\na. 使用远程日志服务器时，你不需要本地运行 `rsyslogd`。\nb. 存储在远程日志服务器上的消息不再会被入侵者访问。\n\
  c. 在远程日志服务器上，可以配置 `logrotate` 以保留长时间的消息。\nd. 在远程日志服务器上，可以分配大量的磁盘空间来存储日志文件。\n\n8.\
  \ 用于日志服务器之间通信的默认端口是什么？\n\na. 514\nb. 524\nc. 1024\nd. 1514\n\n9. 使用 UDP 而不是 TCP\
  \ 向远程日志服务器发送消息的有效理由是什么？\n\na. 通过使用 UDP 可以显著减少网络带宽的使用。\nb. UDP 比 TCP 更安全。\nc. 使用\
  \ UDP 确保你的日志服务器还能接收来自仅支持 UDP 的旧版服务器或设备的消息。\nd. UDP 不需要加载 `rsyslog.conf` 中加载额外的模块。\n\
  \n10. 除了在日志服务器的 `rsyslog.conf` 中加载 `imtcp` 模块外，还需要哪个配置行允许通过 TCP 接收？\n\na. `$ModLoad\
  \ imtcp`\nb. `$InputModule imtcp`\nc. `@imtcp`\nd. `imtcp`\n\n### 基础知识\n\n#### 理解\
  \ rsyslogd 模块\n\n在第 13 章中，你学习了如何在 `rsyslogd` 中配置规则，这允许你根据之前配置的设施和优先级将消息发送到特定目的地。在本节中，你将学习\
  \ `rsyslogd` 中使用的另一个功能：模块。模块使 `rsyslogd` 可扩展，并允许你包含默认未包含的功能。\n\n在 `rsyslogd` 中，可以使用不同类型的模块：\n\
  \n![Image](img/squf.jpg) 输入模块：这些模块用于指定 `rsyslogd` 从哪里接收消息。\n\n![Image](img/squf.jpg)\
  \ 输出模块：这些模块。默认情况下，日志消息被发送到 `/etc/rsyslog.conf` 指定的目的地。通过使用输出模块，可以将消息发送到其他地方，例如数据库或日志。\n\
  \n\n\n\n输出模块（Output modules）用于向默认目标添加额外的目标。在原始设计中，可以使用目的数量是有限的，例如，不支持写入数据库。为了让 `rsyslogd`\
  \ 为其他日志目标打开，可以使用输出模块。一个实用的输出模块示例是 `mysql` 数据库模块，它允许将消息直接写入数据库。另一个输出模块示例是 `usrmsg`，它允许\
  \ `syslog` 将消息写给用户。\n\n## 在 rsyslog 配置中使用模块\n\n由于你是 `rsyslog` 的管理员，你应该对如何使用模块有一个通用的理解。让我们来看一个示例，该示例使用了\
  \ `imfile`（输入模块文件）模块来监控输入文件并将新事件写入 `rsyslogd`（请参见列表 29.1）。\n\n**列表 29.1** 使用 `imfile`\
  \ 模块\n\n点击此处查看代码图片\n\n```\n$ModLoad imfile\n$InputFileName /var/log/httpd/access_log\n\
  $InputFileTag apache-access:\n$InputFileStateFile state-apache-access\n$InputRunFileMonitor\n\
  $InputFileFacility local1\n$InputFileSeverity info\n$InputFilePollInterval 30\n\
  ```\n\n在列表 29.1 中，使用了几个参数。表 29.2 提供了这些参数及其用处的概述。\n\n![Image](img/key_topic.jpg)![Image](img/29tab02.jpg)\n\
  \n**表 29.2** `imfile` 模块参数概述\n\n另一个经常与 `rsyslog` 一起使用的常用模块是 `ommysql` 模块，这是一个输出模块，可以将日志消息写入\
  \ MySQL 或 MariaDB 数据库。`createDB.sql` 文件（默认安装在 `/usr/share/doc/rsyslog` 目录）确保了 `mysql`\
  \ 数据库中可用所有正确的设置。由于你是 rsyslog 管理员，你只需要在 `rsyslog` 中配置输出模块即可。它看起来如下所示。\n\n点击此处查看代码图片\n\
  \n```\n$ModLoad ommysql\n*.*      :ommysql:myservername,rsyslog,dbuser,password\n\
  ```\n\n如你所见，向 MySQL 发送日志消息并不复杂。你只需要加载输出模块 `ommysql` 并添加一行将所有所有优先级的消息发送到 `ommysql`\
  \ 模块即可，该模块在第二行中配置。在执行此操作时，需要指定不同的参数，正如第二个示例行所示：\n\n![Image](img/squf.jpg) 数据库服务器名称\n\
  ![Image](img/squf.jpg) 数据库名称\n![Image](img/squf.jpg) 用于连接数据库的用户名\n![Image](img/squf.jpg)\
  \ 该用户使用的密码\n\n确保为配置文件设置了适当的所有者和权限；否则全世界都能读取数据库的用户名和密码！\n\n## 将 journald 连接到 rsyslog\n\
  \n默认情况下，`journald` 将消息发送到 `rsyslogd`。在本节中，你将学习如何配置此连接，这允许你根据需求对其进行进一步调优。\n\njournal\
  \ 默认向 syslog 发送消息。有两部分配置负责此。首先，文件 `/etc/systemd/journald.conf` 包含 `ForwardToSyslog`\
  \ 行，其默认值设置为 `yes`。列表 29.2 显示了该文件的内容。然后，`rsyslog.conf` 包含了接收来自 journal 消息所需的配置。\n\
  \n**列表 29.2** 使用 `/etc/systemd/journald.conf` 将信息转发到 rsyslog\n\n点击此处查看代码图片\n\n```\n\
  [root@server2 ~]# cat /etc/systemd/journald.conf\n\n#  此文件是 systemd 的一部分。\n#\n#\
  \  systemd 是自由软件；你可以根据自由软件基金会通用公共许可证\n#  (GNU Lesser General Public License) 的条款重新分发和/或修改它\n\
  #  由自由软件基金会发布；许可证的 2.1 版本或\n#  (根据你的选择)任何后续版本。\n#\n# 详情请参阅 journald.conf(5)\n[Journal]\n\
  #Storage=auto\n#Compress=yes\n#Seal=yes\n#SplitMode=login\n#SyncIntervalSec=5m\n\
  #RateLimitInterval=30s\n#RateLimitBurst=1000\n#SystemMaxUse=\n#SystemKeepFree=\n\
  #SystemMaxFileSize=\n#RuntimeMaxUse=\n#RuntimeKeepFree=\n#RuntimeMaxFileSize=\n\
  #MaxRetentionSec=\n#MaxFileSec=1month\n#ForwardToSyslog=yes\n#ForwardToKMsg=no\n\
  #ForwardToConsole=no\n#TTYPath=/dev/console\n#MaxLevelStore=debug\n#MaxLevelSyslog=debug\n\
  #MaxLevelKMsg=notice\n#MaxLevelConsole=info\n```\n\n接收 journal 消息的第一种解决方案是通过 `imuxsock`\
  \ 模块。这种方法通过 UNIX 套接字接收消息现在已过时，并被 `imjournal` 模块取代。在 `rsyslog.conf` 中，需要两行来正确处理：\n\
  \n点击此处查看代码图片\n\n```\n$OmitLocalLogging on\n$IMJournalStateFile journal.state\n```\n\
  \n第一行禁用了通过 `imuxsock` 接收。第二行定义了 `imjournal` 使用的状态文件名称。\n\n## 配置远程日志\n\n有几个理由说明配置远程日志是合理的。在本节中，你将学习为什么要使用日志服务器。你还将学习如何设置\
  \ `rsyslog` 将消息发送到远程日志服务器，以及如何配置 `rsyslog` 接收来自远程服务器的消息。\n\n### 理解远程日志服务器的性\n\n\
  使用中央日志服务器有几个理由：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) 除非入侵者也破解了远程服务器，否则存储在远程服务器上的消息无法被访问。\n\
  \n![Image](img/squf.jpg) 在远程服务器上可以留更多空间来存储日志，使得 `logrotate` 可以保留比默认的 5 周更长的消息。\n\
  \n![Image](img/squf.jpg) 在远程服务器上可以分配大量的磁盘空间来存储日志文件。\n\n![Image](img/squf.jpg) 在一个服务器上检查日志文件比连接到多个服务器来分析信息要容易得多。\n\
  \n除了配置远程日志的安全考量外，`logrotate` 是另一个重要理由。默认情况下，`logrotate` 每周滚动日志文件，并保留最后 4 周的压缩消息文件。因此，如果你需要\
  \ 5 周前发生的事件信息，`logrotate` 已经将它们删除了。如果你使用日志服务器，你可以配置日志服务器保留更长时间的消息。\n\n使用远程日志的另一个重要原因是安全。如果你的服务器被黑了，黑客可能想做的第一件事就是清除痕迹。如果日志文件存储在受攻击的服务器上，这是可以实现的。当消息被写入远程日志服务器时，就会变得困难得多，因为该服务器也要被破解。\n\
  \n### 配置远程日志\n\n配置远程日志涉及两个部分。你需要打开远程日志服务器以接收日志文件，并告诉本地服务器将消息发送到远程日志服务器。设置远程日志服务器可以总结为如下：\n\
  \n![Image](img/squf.jpg) 使用 `imudp` 或 `imtcp` `rsyslogd` 输入模块配置 `rsyslog` 接收来自远程服务器的消息。\n\
  \n![Image](img/squf.jpg) 配置防火墙允许来自 514 端口的入流量。\n\n![Image](img/squf.jpg) 在客户端服务器上添加规则将消息发送到远程日志服务器。\n\
  \n\n\n\n设置远程日志服务器的详细步骤在练习 29.1 中描述。\n\n### 提示\n单独设置一个远程日志服务器并不困难。挑战在于细节，例如正确设置防火墙，以允许远程日志服务器也能接收日志消息。在\
  \ RHCE 考试中，良好的做法是先阅读所有问题，在读完问题后，设置防火墙以允许服务器上所有需要的端口的网络流量。\n\n## 练习 29.1 设置远程日志记录\n\
  \n在本次练习中，你将配置 `server2` 以接收来自远程 `rsyslogd` 进程的消息。你将在 `server1` 上定义 `rsyslogd` 配置以将消息转发到\
  \ `server2`，并在 `server2` 上打开一个允许接收日志文件消息的防火墙端口。\n\n1. 在 `server2` 上打开一个 root shell。然后，打开配置文件\
  \ `/etc/rsyslog.conf`。\n\n2. 在 `rsyslog.conf` 中启用以下两行，以启用 TCP 端口 `514` 上的日志接收：\n\
  \n```\n$ModLoad imtcp\n$InputTCPServerRun 514\n```\n\n3. 关闭配置文件并输入 `systemctl restart\
  \ rsyslogd` 来重启 `rsyslogd` 服务。这允许日志服务器上的 `rsyslogd` 进程接收来自其他机器的消息。\n\n4. 继续在 `server2`\
  \ 上，使用以下两行打开防火墙接受 TCP 端口 `514` 的消息：\n\n```bash\nfirewall-cmd --add-port=514/tcp\n\
  firewall-cmd --add-port=514/tcp --permanent\n```\n\n5. 在 `server1` 上打开一个 root shell，滚动到配置文件的末尾。在这里，你会发现下面的示例配置行：\n\
  \n```bash\n#*.* @@remote-host:514\n```\n\n此行显示了如何配置服务器将消息转发到远程服务器。将此行改为如下内容，以便将消息转发到\
  \ `server2` 上的 `rsyslogd`：\n\n```bash\n*.*      @@server2.example.com:514\n```\n\
  \n6. 使用 `systemctl restart rsyslogd` 重启 `rsyslogd` 进程并开始向远程服务器记录日志。\n\n在设置远程日志服务器时，你可以启用通过\
  \ TCP 和 UDP 的日志接收。由于 UDP 是无连接协议，无法保证消息的送达。这是倾向于使用 TCP 处理日志的重要原因。但是，如果你想设置一个可以从旧版\
  \ syslog 兼容设备接收日志消息的服务器，你也应该启用 UDP 日志接收。正如你在练习 29.1 中看到的，启用日志接收非常简单；已经存在通过 TCP 或\
  \ UDP 接收日志的示例行。你只需要删除行前的井号即可：\n\n```bash\n# Provides UDP syslog reception\n#$ModLoad\
  \ imudp\n#$UDPServerRun 514\n\n# Provides TCP syslog reception\n#$ModLoad imtcp\n\
  #$InputTCPServerRun 514\n```\n\n要向日志服务器发送消息，你可以使用 `/etc/rsyslog.conf` 末尾附近的示例行。在这一行中，你使用单个\
  \ `@` 通过 UDP 发送日志，使用双 `@` 通过 TCP 发送日志。请注意，默认情况下，通过所有设施（facilities）生成所有优先级（priorities）的消息都会发送到远程服务器；你可以根据需要进行更改。例如，使用以下行通过\
  \ TCP 将优先级为错误（error）及以上的消息发送到远程日志服务器 `log.example.com`：\n\n```bash\n*.err      @@log.example.com\n\
  ```\n\n#### 总结\n在本章中，你学习了如何配置高级 `rsyslog` 特性。你学习了如何在 `rsyslogd` 中使用模块，如何将 `journald`\
  \ 连接到 `rsyslogd`，以及如何设置远程日志记录。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n复习本章最重要的主题，这些主题在页外边距处用关键主题（Key\
  \ Topic）图标标记。表 29.3 列出了这些关键主题的参考以及它们所在的页码。\n\n![Image](img/29tab03.jpg)\n\n**表 29.3**\
  \ 第 29 章关键主题\n\n#### 凭记忆完成表格和列表\n打印附录 B“记忆表格”（位于光盘中）或至少打印本章的章节，并凭记忆完成表格和列表。附录 C“记忆表格答案对照”同样位于光盘中，包含了完成的表格和列表以便你检查工作。\n\
  \n#### 定义关键术语\n定义本章的关键术语：\n\ninput\n\noutput\n\njournald\n\n#### 复习题\n1. 1 在设置远程日志服务器时，哪些行可以启用\
