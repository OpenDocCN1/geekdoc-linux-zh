  d. `uname -k`\n\n# 5.** 帮助内核正确初始化硬件设备的进程名称是什么？**\n\na. `systemd-udevd`\nb. `hwinit`\n\
  c. `udev`\nd. `udevd`\n\n# 6.** 系统在何处查找初始化新硬件设备的默认规则？**\n\na. `/etc/udev/rules.d`\n\
  b. `/usr/lib/udev/rules.d`\nc. `/usr/lib/udev.d/rules`\nd. `/etc/udev.d/rules`\n\
  \n# 7.** 你应该使用哪个命令卸载内核模块，包括其所有依赖项？**\n\na. `rmmod`\nb. `insmod -r`\nc. `modprobe\
  \ -r`\nd. `modprobe`\n\n# 8.** 哪个命令可以让你查看服务器硬件是否已加载了适当的内核模块？**\n\na. `lsmod`\nb.\
  \ `modprobe -l`\nc. `lspci -k`\nd. `lspci`\n\n# 9.** 在何处指定内核模块参数使其持久化？**\n\na. `/etc/modules.conf`\n\
  b. `/etc/modprobe.conf`\nc. `/etc/modprobe.d/somefilename`\nd. `/usr/lib/modprobe.d/somefilename`\n\
  \n# 10.** 关于更新内核的哪些陈述是不正确的？**\n\na. `yum update kernel` 命令将安装新内核而不是更新它。\nb. `yum\
  \ install kernel` 命令将安装新内核并保留旧内核。\nc. 内核包应该被设置为 yum 保护保护包（yum protected package），以确保在更新后旧内核仍然可用。\n\
  d. 安装新内核版本后，你必须运行 `grub2-mkconfig` 命令来修改 GRUB 2 启动菜单，以便显示旧内核和新安装的内核。\n\n### 基础主题\n\
  \n### 理解 Linux 内核的作用\n\nLinux 内核是操作系统的核心。它是处于 shell 环境下操作 Linux 的用户与用户运行计算机硬件之间的层。内核通过管理从软件接收的\
  \ I/O 指令，并将其转换为由计算机中央处理器和其他硬件执行的处理指令来实现的。内核还负责处理基本的操作系统任务。此类任务的一个示例是调度器，它确保在操作系统上启动的进程由\
  \ CPU 处理。\n\n### 理解内核线程和驱动程序的使用\n\n内核执行操作系统任务由不同的内核线程实现。内核线程可以通过 `ps aux` 等命令轻松识别。内核线程名称列在方括号之间（参见\
  \ 列表 16.1）。\n\n**列表 16.1** 使用 `ps aux` 列出内核线程\n\n点击此处查看代码图像\n\n* *\n\n```\n[root@server1\
