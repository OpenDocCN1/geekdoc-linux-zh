  \n### 基础主题\n\n#### 理解 Linux 防火墙\n\n![Image](img/key_topic.jpg)\n\n你可以使用防火墙来限制进入服务器或离开服务器的流量。防火墙是通过\
  \ Linux 内核中的 netfilter 子系统实现的。Netfilter 允许内核模块检查每个入站、出站或转发的数据包，并通过允许或阻塞该数据包来采取操作。因此，如果\
  \ RHEL 服务器提供路由功能，内核防火墙允许对入站包、出站包以及从一个接口传输到另一个接口的数据包进行检查。\n\n##### 理解之前的解决方案\n\n\
  为了与 netfilter 交互，可以使用不同的解决方案。在早期的 Red Hat Enterprise Linux 版本中，`iptables` 是配置 netfilter\
  \ 数据包过滤的默认解决方案。该解决方案通过命令行工具 `iptables` 工作，该工具提供了一种定义防火墙规则的复杂且详细的方法，但由于 `iptables`\
  \ 命令的语法复杂且排序规则可能变得相对复杂，对于偶尔进行维护的管理员来说也具有挑战性。Red Hat Enterprise Linux 7 仍然提供 `iptables`\
  \ 服务。不过，并不建议将其作为默认服务，而且它不能在同时使用 `firewalld` 的服务器上使用。\n\n##### 理解 Firewalld\n\n![Image](img/key_topic.jpg)\n\
  \n在 Red Hat Enterprise Linux 7 中引入了一种新方法：Firewalld 是一种可以使用不同接口配置防火墙规则的系统服务。管理员可以在\
  \ firewalld 环境中管理规则，但更重要的是应用程序可以使用 DBus 消息系统请求端口，这意味着无需系统管理员的任何直接操作即可添加或删除规则。\n\n\
  Firewalld 是作为一种管理 Linux 防火墙的全新完整解决方案开发的。它使用 `firewalld` 服务来管理 netfilter 防火墙配置。`firewalld`\
  \ 服务与 `iptables` 服务兼容。千万不要在同一系统上使用 `firewalld` 和 `iptables`；它们是互斥的。\n\n***\n\n提示\n\
  \nRHCSA 目标并没有定义你应该使用哪种工具来创建防火墙规则。它只是提到你应该能够使用 `iptables`、`firewall-config` 或 `firewall-cmd`\
  \ 创建防火墙规则。因此，你并不需要精通每一个工具；你只需要能够使用最适合你的工具来配置防火墙即可。\n\n***\n\n##### 理解 Firewalld\
  \ 区域\n\n![Image](img/key_topic.jpg)\n\nFirewalld 通过与区域 工作来使防火墙管理变得更容易。区域是应用于匹配特定源地址或网络接口的入站数据包的规则集。Firewalld\
  \ 默认仅对入站数据包生效，不对出站数据包进行过滤。\n\n区域的使用对于具有多个接口的服务器特别重要。在这些服务器上，区域允许管理员轻松分配特定的规则。对于只有一个网络接口的服务器，你可能只需要一个区域，即默认区域。进入系统的每个数据包都会根据其源地址进行分析，并根据该源地址由\
  \ firewalld 分析数据包是否属于特定区域。如果不是如此，则使用入站网络接口的区域。如果没有特定的可用区域，数据包将由默认区域的设置进行处理。\n\n\
  Firewalld 与一些默认区域配合。表 22.2 描述了这些默认区域。\n\n![Image](img/key_topic.jpg)![Image](img/22tab02.jpg)\n\
  \n**表 22.2** Firewalld 默认区域\n\n##### 理解 Firewalld 服务\n\n![Image](img/key_topic.jpg)\n\
  \n在使用 firewalld 时，第二个关键元素是服务。注意，firewalld 中的服务与 systemd 中的服务并不相同。在 firewalld 中，定义了一些默认服务，允许管理员轻松地允许或拒绝对服务器上特定端口的访问。\n\
  \n每个服务的背后都是一个配置文件，解释了涉及哪些 UDP 或 TCP 端口，如果需要，必须加载哪些内核模块。要获取计算机上所有可用服务的列表，你可以使用命令\
  \ `firewall-cmd --get-services`。（参见列表 22.1）。\n\n***\n\n提示\n\n你可以在第 32 章中找到关于 firewalld\
  \ 服务配置的更深入的信息。\n\n***\n\n**列表 22.1** 使用 `firewall-cmd --get-services` 获取所有可用服务列表\n\
  \n点击此处查看代码图片\n\n***\n\n```\n[root@localhost sssd]# firewall-cmd --get-services\n\
  \namanda-client bacula bacula-client dhcp dhcpv6 dhcpv6-client dns ftp\n\nhigh-availability\
  \ http https imaps ipp ipp-client ipsec kerberos\n\nkpasswd ldap ldaps libvirt libvirt-tls\
  \ mdns mountd ms-wbt mysql nfs ntp\n\nopenvpn pmcd pmproxy pmwebapi pmwebapis pop3s\
  \ postgresql proxy-dhcp\n\nradius rpc-bind samba samba-client smtp ssh telnet tftp\
  \ tftp-client\n\ntransmission-client vnc-server wbem-https\n```\n\n***\n\n本质上，在使用\
  \ firewalld 时，关键在于将正确的服务添加到正确的区域中。在特殊情况下，可以使用更具体的设置来增强配置。在接下来的章节中，你将学习为了该目的你可以使用哪些工具。\n\
  \n服务文件存储在目录 `/usr/lib/firewalld/services` 或 `/etc/firewalld/services` 中。列表 22.2\
  \ 显示了服务文件的内容。\n\n**列表 22.2** ftp 服务文件的内容\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server1\
  \ services]# cat ftp.xml\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<service>\n\
  \  <short>FTP</short>\n  <description>FTP 是一种用于远程文件传输的协议。如果你\n计划将你的 FTP\n服务器向公共开放，请启用此选项。你需要安装\
  \ vsftpd\n包才能使此\n选项发挥作用。</description>\n  <port protocol=\"tcp\" port=\"21\"/>\n\
  \  <module name=\"nf_conntrack_ftp\"/>\n</service>\n```\n\n***\n\n#### 使用 Firewalld\n\
  \n在接下来的章节中，你将学习如何使用 firewalld 配置防火墙。为此目的有两个工具可用：命令行工具 `firewall-cmd`；以及具有图形界面的 `firewall-config`\
  \ 工具。将精力放在 `firewall-cmd` 工具上是一个好主意。这个易访问的工具可以实现复杂的配置。如果你更倾向于使用图形化的 `firewall-config`\
  \ 工具，这也是可以的。你可以使用图形化工具完成任何你使用命令行工具可以做的事情。\n\n\n\n\n\n在使用其中任一工具时，请注意修改的具体发生位置。这两个工具都不仅处理内存中的配置状态，还可以处理磁盘上的配置状态（持久化状态）。在使用其中任一工具时，请确保在继续后续操作之前将更改提交到磁盘。\n\
  \n### 提示\n在使用 `firewalld` 时，请确保不会有人意外使用 `iptables` 来配置防火墙。使用 `iptables` 会严重扰乱你的防火墙配置，特别是当已经加载了\
  \ `firewalld` 服务的系统中又加载了 `iptables` 服务时。为了确保这种情况永远不会发生，请使用 `systemctl mask iptables`\
  \ 命令。该命令可确保 `iptables` 服务不会意外启动。\n\n### 使用 Firewall-cmd\n`firewall-cmd` 工具是一个易于使用的工具，允许管理员更改防火墙的运行时配置并将此配置写入磁盘。在学习该多功能命令可用的所有选项之前，在练习\
  \ 22.1 中，你将使用 `firewall-cmd` 的一些最重要的选项。\n\n### 练习 22.1 使用 Firewall-cmd 管理防火墙\n\n\
  **1.** 打开一个 root 终端。输入 `firewall-cmd --get-default-zone`。这会显示当前的默认区域。你将看到当前的默认区域，它默认被设置为\
  \ `public`。\n\n**2.** 要查看哪些区域可用，输入 `firewall-cmd --get-zones`。\n\n**3.** 现在使用 `firewall-cmd\
  \ --get-services` 显示你的服务器上可用的服务。注意，`firewall-cmd --get` 选项显示了你服务器上可用的内容。\n\n**4.**\
  \ 要查看当前区域中有哪些可用服务，输入 `firewall-cmd --list-services`。你将看到一个短列表，其中包含动态主机配置协议（DHCP）客户端以及安全外壳（SSH）。\n\
  \n**5.** 现在输入 `firewall-cmd --list-all`。查看输出并将其结果与 `firewall-cmd --list-all --zone=public`\
  \ 的结果进行比较。这两个命令都显示了当前防火墙配置的完整概览，如列表 22.3 所示。注意，你看到的不仅是该区域中配置的区域和服务；你还看到了关于接口和更高级项目的信息。\n\
  \n**列表 22.3** 显示当前防火墙配置\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# firewall-cmd --list-all\n\
  \npublic (default, active)\n\n  interfaces: eno16777736\n  sources:\n  services:\
  \ dhcpv6-client ssh\n  ports:\n  masquerade: no\n  forward-ports:\n  icmp-blocks:\n\
  \  rich rules:\n```\n\n**6.** 输入 `firewall-cmd --add-service=vnc-server` 将 VNC 服务器添加到防火墙配置中。使用\
  \ `firewall-cmd --list-all` 进行验证。\n\n**7.** 输入 `systemctl restart firewalld` 并重复执行\
  \ `firewall-cmd --list-all`。注意 vnc-server 服务已不再列在列表中。\n\n**8.** 再次添加 vnc-server\
  \ 服务，但这次使其持久化，使用 `firewall-cmd --add-service vnc-server --permanent`。\n\n**9.**\
  \ 再次输入 `firewall-cmd --list-all` 进行验证。你会发现 VNC 服务器未列在列表中。已添加到磁盘配置的服务不会自动添加到运行时配置中。输入\
  \ `firewall-cmd --reload` 将磁盘配置重新加载到运行时配置中。\n\n**10.** 输入 `firewall-cmd --addport=2022/tcp\
  \ --permanent`，然后执行 `firewall-cmd --reload`。使用 `firewall-cmd --list-all` 进行验证。你将看到一个端口已添加到\
  \ firewalld 配置中。\n\n### 提示\n在考试中，请尽可能地使用服务。只有在没有服务包含你想要打开的端口时，才使用特定端口。\n\n在之前的练习中，你处理了区域和服务和服务，并学习了如何向默认区域添加服务和端口。`firewall-cmd`\
  \ 接口提供了更多选项。表 22.3 描述了一些最重要的命令行选项。\n\n![Image](img/key_topic.jpg)![Image](img/22tab03.jpg)\n\
  \n**表 22.3** 常见的 `firewall-cmd` 选项\n\n### 使用 Firewall-config\n如果你想让防火墙配置变得非常简单，可以使用\
  \ GUI 工具 `firewall-config`。\n\n### 注意\n要使用此工具，你需要更新你的服务器。在启动它之前输入 `yum update -y`。如果没有更新，你将无法启动它。如果启动\
  \ `firewall-config` 仍遇到问题，请尝试使用 `systemctl restart firewalld`（重新）启动 `firewalld`\
  \ 服务。这通常可以解决连接问题。\n\n在启动 `firewall-config` 后，你将看到图 22.1 所示的界面。在此界面中，你可以轻松访问防火墙配置所需的大多数功能。\n\
  \n![Image](img/22fig01.jpg)\n\n**图 22.1** `firewall-config` 启动屏幕。\n\n在使用 `firewall-config`\
  \ 时，注意窗口顶部的配置下拉框非常重要的。默认情况下，你进行的所有配置都会被添加到运行时。这将使配置立即生效，但在重启之间不会持久化。在使用 `firewall-config`\
  \ 时，选择 `Permanent`（持久性）选项是一个好主意。这将允许添加的配置被写入配置以实现持久化。\n\n在 `firewall-config` 工具中，提供了不同的界面。默认界面允许你将服务添加到特定区域，但也有标签允许你添加端口、端口转发和许多其他高级配置选项。如果你想在防火墙中打开一个特定端口（例如，没有对应服务的端口），你只需激活\
  \ `Ports` 标签并点击 `Add` 来指定所需的特定端口信息（参见图 22.2）。\n\n![Image](img/22fig02.jpg)\n\n**图\
  \ 22.2** 向防火墙中添加特定端口。\n\n`firewall-config` 中的另一个实用用界面通过 `Services` 标签提供。在此标签页上，你可以定义服务文件中应该包含哪些内容。每个服务都可以配置为包含端口和协议、通过\
  \ `Modules` 标签指定特定的内核模块，你甚至可以添加特定的目标（即允许此服务的 IP 地址）。例如，查看 `ftp` 服务，它不仅打开了 tcp 21\
  \ 端口，还添加了 `nf_conntrack_ftp` 内核模块，该模块用于允许被动 FTP 流量通过防火墙（参见图 22.3）。\n\n![Image](img/22fig03.jpg)\n\
  \n**图 22.3** 使用 `firewall-config` 配置服务。\n\n练习 22.2 介绍了 `firewall-config` 中最常见的配置步骤。\n\
  \n### 练习 22.2 使用 Firewall-config\n\n**1.** 打开终端并输入命令 `firewall-config` 以启动 `firewall-config`\
  \ GUI 界面。或者，你也可以从图形界面的 `Applications > Sundry > Firewall` 菜单访问它。\n\n**2.** 点击配置选项旁边的\
  \ `Runtime` 单词。打开下拉列表并选择 `Permanent`。这将使应用的所有修改变为持久化。\n\n**3.** 选择 `public` 区域，并至少点击\
  \ `http` 和 `ssh` 服务以启用它们。\n\n**4.** 选择 `Ports` 标签，并在此标签页点击 `Add`。输入端口 `2022` 和协议\
  \ `tcp` 并点击 OK 将它们添加到列表。\n\n**5.** 激活 `Services` 标签并选择 `Kerberos` 服务。注意它显示了协议和端口，但没有特定的模块或目标。对\
  \ `ftp` 服务执行相同的操作，注意它也包含一个内核模块。\n\n\n\n\n\n6. 点击右上角的 `X` 关闭 `firewall-config` 实用程序。\n\
  \n7. 在终端窗口中输入 `firewall-cmd --list-all`。注意，你刚刚做的更改尚未生效。这是因为你将它们配置为了永久更改，而不是运行时更改。\n\
  \n8. 输入 `firewall-cmd --reload` 并再次输入 `firewall-cmd --list-all`。你会发现更改现在已经生效了。\n\
  \n***\n\n正如你在浏览界面时看到的，`firewall-config` 是一个完整的工具。它只有一个缺点：需要图形化环境。因此，你可能更好地关注命令行界面\
  \ `firewall-cmd`，它易于使用且没有任何特殊要求。\n\n#### 总结\n\n在本章中，你学习了如何设置一个基础防火墙环境，其中 `firewalld`\
  \ 服务被被添加到 `firewalld` 区域（zones）中，以允许访问计算机上的特定服务。你还学习了如何使用 `firewall-cmd` 命令行工具或\
  \ `firewall-config` 图形界面来设置基础防火墙。本章讨论的话题涵盖了 RHCSA 的所有目标。Firewalld 配置也是 RHCE 的主题。你可以阅读\
  \ 第 32 章 来了解 RHCE 级别的目标。\n\n### 考试准备任务\n\n### 关键主题\n\n回顾本章中最重要的主题，这些主题在页面外边页用“关键主题”图标标记。表\
  \ 22.4 列出了这些关键主题的参考及其所在的页码。\n\n![Image](img/22tab04.jpg)\n\n**表 22.4** 第 22 章 关键主题\n\
  \n#### 定义关键术语\n\n定义本章中的以下关键术语，并在词表中检查你的答案：\n\nfirewall\n\nnetfilter\n\niptables\n\
  \nfirewalld\n\nzones\n\nservices\n\n#### 记忆完成表格和列表\n\n打印 附录 B “记忆表格”（位于光盘中）或至少打印本章章节，并根据记忆完成表格和列表。同样位于光盘上的\
  \ 附录 C “记忆表格答案”包含了完成的表格和列表供你检查工作。\n\n#### 复习题\n\n1. **1.** 在尝试使用 `firewall-config`\
  \ 创建防火墙配置之前，哪个服务应该是运行状态？\n\n2. **2.** 哪个命令向默认区域（default zone）的防火墙配置添加 UDP 端口 2355？\n\
  \n3. **3.** 哪个命令允许你列出所有区域的所有防火墙配置？\n\n4. **4.** 哪个命令允许你从当前防火墙配置中移除 vnc-server 服务？\n\
  \n5. **5.** 哪个 `firewall-cmd` 命令允许你激活使用 `--permanent` 选项添加的新配置？\n\n6. **6.** 哪个\
  \ `firewall-cmd` 选项允许你验证新配置已添加到当前区域并正处于激活状态？\n\n7. **7.** 哪个命令允许你将接口 `eno1` 添加到公共区域（public\
  \ zone）？\n\n8. **8.** 如果在未指定区域的情况下向防火墙配置添加新接口，它会被添加到哪个区域？\n\n9. **9.** 哪个命令允许你将源\
  \ IP 地址 192.168.0.0/24 添加到默认区域？\n\n10. **10.** 哪个命令允许你列出 `firewalld` 中当前可用的所有服务？\n\
  \n### 章末实验\n\n你现在已经学习了如何在 Red Hat Enterprise Linux 7 服务器上操作 `firewalld`。请通过完成以下章末实验来确保掌握了这些技能。\n\
  \n1. 创建一个防火墙配置，允许访问你的服务器上可能运行的以下服务：\n\n![Image](img/squf.jpg) web\n\n![Image](img/squf.jpg)\
  \ ftp\n\n![Image](img/squf.jpg) ssh\n\n2. 确保配置是持久的，并在服务器重启后将被激活。\n\n## 第 23 章：配置远程挂载和\
  \ FTP\n\n**本章涵盖以下主题：**\n\n![Image](img/squf.jpg) 挂载 NFS 共享\n\n![Image](img/squf.jpg)\
  \ 挂载 SMB 文件系统\n\n![Image](img/squf.jpg) 通过 fstab 挂载远程文件系统\n\n![Image](img/squf.jpg)\
  \ 使用 Automount 挂载远程文件系统\n\n![Image](img/squf.jpg) 配置 FTP 服务器\n\n**本章涵盖以下 RHCSA 考试目标：**\n\
  \n![Image](img/squf.jpg) 挂载 CIFS 和 NFS 网络文件系统\n\n本章专注于某些一直处于 RHCSA 和 RHCE 考试目标列表次要主题。由于某种原因，在编写时，在本章讨论的所有主题中，只有挂载\
  \ CIFS 和 NFS 网络文件系统被列在目标中。让我们假设你也希望这些挂载也能自动发生，这就是为什么我也讨论了如何通过 `fstab` 和 automount\
  \ 设置自动挂载。为了保险起见，你也可以阅读如何配置 FTP 服务器（仅仅因为某人甚至不知道如何设置 FTP 服务器就能成为 RHCSA 或 RHCE，这看起来似乎很奇怪）。\n\
  \n### “我已经知道这些了吗？”测验\n\n“我已经知道这些了吗？”测验让你评估自己应该彻底阅读整个章节内容，还是跳转到“考试准备任务”部分。如果你对这些问题的答案或自己对这些主题知识的评估有疑问，请阅读整章。表\
  \ 23.1 列出了本章的主要标题及其对应的“我已经知道这些了吗？”测验问题。你可以在 附录 A “[‘我已经知道这些了吗?’测验和‘复习题’答案]找到答案。\n\
  \n![Image](img/23tab01.jpg)\n\n**表 23.1** “我已经知道这些了吗？”章节对应问题\n\n1. **1.** 你想启用一个\
  \ NFS 共享，其中对文件的所有访问都是匿的。你应该使用以下哪个安全选项？\n\na. 你不需要指定任何内容；默认设置基于对文件的匿名访问。\nb. none\n\
  c. sys\nd. krb5\n\n2. **2.** 你需要配置一个启用 Kerberos 的 NFS 挂载。以下哪项不是实现此要求？\n\na. 将 keytab\
  \ 文件复制到 `/etc/krb5.keytab`\nb. 启动 `nfs-secure` 服务\nc. 在挂载中使用 `sec=krb5`（或 `krb5i`\
  \ 或 `krb5p`）挂载选项\nd. 在客户端上启用 Kerberos 服务\n\n3. **3.** 你想使用启用 Kerberos 的 NFS 挂载。你应该使用以下哪个挂载选项来保证消息在传输过程中没有被篡改？不需要加密内容。\n\
  \na. krb5\nb. krb5i\nc. krb5p\nd. krb5ip\n\n4. **4.** 你输入命令 `showmount -e` 来显示 NFS\
  \ 服务器上的可用挂载，但没有结果。以下哪项最可能是解释？\n\na. NFS 客户端软件未运行。\nb. 你使用的 UID 在服务器上不存在。\nc. SELinux\
  \ 配置不当。\nd. 防火墙不允许 showmount 流量。\n\n5. **5.** 你想登录 SMB 共享。以下哪个命令显示了执行此操作的正确语法？\n\
  \n```\nmount -o username=sambauser1 //server/share /somewhere\n```\n\n\n\n\n\n`b.\
  \ mount -o uname=sambauser1 //server/share /somewhere`\n\n`c. mount sambauser1@//server/share\
  \ /somewhere`\n\n`d. mount -o username=sambauser1@//server/share /somewhere`\n\n\
  ### [6]. 通过 fstab 配置自动挂载 SMB 共享时，关于认证的以下陈述哪是正确的？\n\na. 你需要指定用户名；在共享挂载期间，你将看到密码提示。\n\
  \nb. 你只能通过在 `/etc/fstab` 中使用 mount 选项来指定用户名和密码。\n\nc. 你不需要在 fstab 中指定用户名或密码；访问共享时系统会提示你输入这些信息。\n\
  \nd. 挂载共享时使用凭据文件（credentials file）是指定用户名和密码的安全方法。\n\n### [7]. 配置自动挂载（automount）时，以下哪一项不是必要步骤？\n\
  \na. 在 `/etc/auto.master.d` 中创建一个主映射文件。\n\nb. 在主映射文件中，指定自动挂载目录和包含所需配置的自动挂载文件名称。\n\
  \nc. 在自动挂载文件中，指定远程文件系统必须挂载的子目录名称、挂载选项以及远程文件系统的名称。\n\nd. 在本地挂载点上设置适当权限。\n\n### [8].\
  \ 关于自动挂载中的直接挂载（direct mounts），以下陈述哪项*不是*正确的？\n\na. 直接挂载是在已存在的目录上进行挂载。\n\nb. 直接挂载只能由\
  \ root 用户执行。\n\nc. 直接挂载和间接挂载（indirect mount）使用的挂载选项没有区别。\n\nd. 直接文件（direct file）包含主映射文件中已存在目录的名称。\n\
  \n### [9]. 设置匿名 FTP 投放箱（drop box）时，以下哪项不是要求？\n\na. 设置 `ftpd_allow_anon_upload` 布尔值。\n\
  \nb. 从共享目录中移除 Linux 文件系统的读取权限。\n\nc. 创建一个匿名用户。\n\nd. 将 SELinux 上文类型设置为 `public_content_rw_t`。\n\
  \n### [10]. 在 `/etc/auto.something` 文件中应该使用哪一行来挂载服务器 lab 上的 lab 目录上名为 data 的 CIFS\
  \ 共享？\n\na. `lab -fstype=cifs,credentials=/root/creds ://lab/data`\n\nb. `lab -fstype=smb,credentials=/root/creds\
  \ //lab/data`\n\nc. `lab -fstype=cifs,credentials=/root/creds //lab:/data`\n\nd.\
  \ `lab -fstype=smb,credentials=/root/creds ://lab/data`\n\n### 基础主题\n\n#### 挂载 NFS\
  \ 共享\n\n在之前的章节中，你学习了如何处理本地文件系统并将其挂载到文件系统结构中。在本章中，你将学习如何处理网络文件系统。经典的网络文件系统是 NFS（全称为\
  \ Network File System）。它是 Sun 在 20 世纪 80 年代为 UNIX 开发的一种协议，并且一直适用于 Linux。它的目的是将远程文件系统挂载到本地文件系统层次结构中。\n\
  \nNFS 共享由 NFS 服务器导出。共享的格式为 `servername:/sharename`。因此，如果服务器 labipa.example.com 共享了\
  \ `/data` 目录，那么 NFS 客户端可以将其挂载为 `labipa.example.com:/data`。在这种情况下，临时将共享挂载到 `/mnt`\
  \ 目录的完整命令是 `mount labipa.example.com:/data /mnt`。\n\n在 Red Hat Enterprise Linux\
  \ 7 上，NFS 4 是默认 NFS 版本。此 NFS 版本提供了一种名为*伪根挂载（pseudo root mount）*的功能。用示例来解释最为合适。假设\
  \ NFS 服务器 labipa.example.com 导出了三个不同的目录：`/data`、`/srv` 和 `/home`。进一步假设你对这三个目录都有权限。如果是这样，你可以单独挂载这三个目录。然而，伪根挂载允许你挂载\
  \ NFS 服务器上的根目录，从而访问所有三个导出的共享。执行伪根挂载的命令是 `mount labipa.example.com:/ /mnt`。因此，即使根目录没有被专门共享，你也可以挂载它。在练习\
  \ 23.1 中，你将学习如何在 NFS 4 中使用伪根挂载。\n\n##### 了解 NFS 安全性选项\n\n默认情况下，NFS 的安全性是有限的。在 NFS\
  \ 共享上，安全性根据想要访问共享的主机名被允许或拒绝。如果主机名被允许，则 NFS 客户端的用户就可以挂载并访问该共享。当客户端访问 NFS 共享时，NFS\
  \ 服务器默认将客户端用户的 UID 映射到 NFS 服务器上的相同 UID。这可能会导致意料之外的结果。\n\n例如，如果 NFS 服务器上的用户 linda\
  \ 的 UID 为 505，而客户端上的用户 bob 的 UID 也是 505，那么 bob 将以 UID 505 的身份访问 NFS 共享，而该 UID 在服务器上映射到\
  \ linda 的 UID。因此，bob 将拥有访问 linda 在服务器上有权访问的所有文件的权限。\n\n为了防止在用 NFS 启用用户访问文件时发生意外情况，使用中心机制来处理认证是一个好主意。这可以是轻量级目录访问协议（LDAP）服务器，例如\
  \ Red Hat Enterprise Linux 7 仓库中提供的 FreeIPA 服务。如果所有参与 NFS 配置的服务器都使用同一个 LDAP 服务器，你就可以确定避免了\
  \ UID 映射问题。\n\n要指定如何处理安全性，在挂载时可以使用使用 `sec=*` 方法挂载选项来使用不同的安全性选项。表 23.2 总结了默认的安全性选项。\n\
  \n![Image](img/key_topic.jpg)![Image](img/23tab02.jpg)\n\n**表 23.2** 默认 NFS 安全性选项\n\
  \n##### 了解 Kerberos 要求\n\n配置 Kerberos 挂载需要一些额外的服务：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 一个名为 `/etc/krb5.keytab` 的 keytab 文件。这是一个包含 NFS 客户端用于加入\
  \ Kerberos 环境的客户端凭据的文件。该 keytab 需要为客户端进行配置，并包含主机主体（host principal）、NFS 主体（NFS principal），或者最好两者都有。\n\
  \n![Image](img/squf.jpg) `nfs-secure` 服务必须在客户端上运行。\n\n有关设置启用 Kerberos 的 NFS 环境的更多细节，请参见第\
  \ 36 章。\n\n* * *\n\n提示\n\n创建 Kerberos 主体（principals）和 keytabs 不是 RHCSA 和 RHCE 考试目标。如果你需要在考试中设置启用\
  \ Kerberos 的 NFS 共享，Red Hat 将为你提供 keytab 文件的位置。因此，你只需要将其下载到适当的位置。要启用 Kerberos 挂载，你只需要知道如何在挂载时添加\
  \ `sec=krb5[ip]` 选项并确保 `nfs-secure` 服务已启动。\n\n* * *\n\n##### RHEL 7 NFS 支持\n\n在\
  \ Red Hat Enterprise Linux 7 上，NFS 4 是默认的 NFS 版本。如果在进行 NFS 挂载时 NFS 服务器提供了之前的 NFS\
  \ 版本，客户端将回退到该版本。从客户端，你也可以通过使用 `nfsvers=` 挂载选项强制挂载时使用特定的 NFS 版本。这在连接仅提供 NFS 3 的服务器或设备时可能有用。\n\
  \n##### 挂载 NFS 共享\n\n要挂载 NFS 共享，首先需要找到共享的名称。这些信息可以由管理员提供，但也可以自己发现。要发现哪些共享可用，你有多种选择：\n\
  \n![Image](img/squf.jpg) 如果服务器上使用了 NFSv4，可以使用根挂载。这意味着你只需要挂载 NFS 服务器的根目录，在挂载点下，你只会看到你有权访问的共享。\n\
  \n![Image](img/squf.jpg) 使用 `netstat -an | grep your.nfs.server.ip:port` 验证挂载的可用性。\n\
  \n\n\n\n\n![Image](img/squf.jpg) 使用 `showmount -e nfsserver` 命令来查找哪些可用共享。\n\n* *\
  \ *\n\n### 警告\n\n`showmount` 命令在位于防火墙后的 NFSv4 服务器可能会出现问题。这是因为 `showmount` 依赖于 portmapper\
  \ 服务，该服务在连接时使用随机 UDP 端口，而 `firewalld nfs` 服务仅开启 2049 端口，这不允许 `portmapper` 流量。如果防火墙设置正确，则还需要将\
  \ `mountd` 和 `rpc-bind` 服务添加到防火墙中。很有可能服务器上的共享已配置正确，但由于 `showmount` 无法通过防火墙，你看不到它们。如果你怀疑是如此，请使用练习\
  \ 23.1 中解释的 NFS 根挂载，或者直接尝试挂载 NFS 共享。\n\n* * *\n\n* * *\n\n### 练习 23.1 挂载 NFS 共享\n\
  \n此练习假设存在 NFS 服务器。建议使用 [`www.rhatcert.com`](http://www.rhatcert.com)提供的免费实验环境。该环境包含一个名为\
  \ `labipa` 的服务器，其配置为提供 NFS、Samba 和 LDAP 服务。设置此实验环境的详细信息请参见附录 D。\n\n**1.** 在 server1\
  \ 上，使用 `yum install -y nfs-utils` 安装包含 `showmount` 工具的 RPM 包。\n\n**2.** 输入 `showmount\
  \ -e 192.168.122.200`。注意你收到了一个“port mapper failure - Unable to receive: errno 113\
  \ (No route to host)”错误。\n\n**3.** 以 root 身份登录 `labipa` 机器。使用 `ssh root@192.168.122.200`。输入\
  \ `systemctl stop firewalld` 并重复本练习的第 2 步。注意你现在可以访问了。再次输入 `systemctl start firewalld`\
  \ 启用防火墙。\n\n**4.** 在 server1 上，输入 `mount 192.168.122.200:/ /mnt`。（注意命令中斜线之间的空格。）这执行了所有\
  \ NFS 共享的 NFSv4 伪根挂载。\n\n**5.** 输入 `mount | grep 122` 以验证挂载是否成功。\n\n**6.** 仍在 server1\
  \ 上，使用 `ls /mnt`。这显示了子目录 `data` 和 `home`，它们对应于 `labipa` 服务器提供的挂载。\n\n* * *\n\n####\
  \ 挂载 SMB 文件系统\n\n为了确保不同操作系统之间文件交换的最佳兼容性，Samba 是一种常见的解决方案。在 Red Hat Enterprise Linux\
  \ 上，你可以配置 Samba 服务器，使用服务器消息块 (SMB) 或 通用互联网文件系统 (CIFS) 协议为客户端提供访问这些共享。在第 38 章“设置\
  \ SMTP 服务器”中，你可以读到如何设置此类 Samba 服务器。你还可以将 Red Hat Enterprise Linux 设置为提供 SMB 或 CIFS\
  \ 共享的服务器的客户端，允许 Red Hat 服务器直接访问 Windows 共享。在本节中，你将学习如何挂载远程 SMB 文件系统。此过程适用于挂载从任何平台提供的兼容\
  \ SMB 的共享，因此适用于 Windows 共享和 Linux 共享。\n\n* * *\n\n### 注意\n\n在谈论基于 SMB 的服务时使用了不同的术语。Windows\
  \ 服务器提供的标准协议被称为服务器消息块（SMB）协议。Linux 上的此协议由 Samba 服务器实现。CIFS 是 SMB 的变体，SMB 和 CIFS\
  \ 互替使用是非常常见的。\n\n* * *\n\n### 发现 SMB 共享\n\n在挂载 SMB 共享之前，请确保客户端已安装了 `cifs-utils`\
  \ 和 `samba-client` RPM 包。此外，你需要使用 `firewall-cmd --add-service samba-client --permanent;\
  \ firewall-cmd --reload` 将 `samba-client` 服务添加到客户端的防火墙配置中。安装完成后，你可以使用 `smbclient\
  \ -L` 命令发现可用的 SMB 共享。\n\n`smbclient` 命令会询问当前用户的密码。这是因为 `smbclient` 是一个非常通用的工具，允许你列出共享，还可以登录到远程服务器上的\
  \ Samba 共享并从远程服务器获取文件。然而，列出共享不需要凭据。所以，当命令询问密码时，你只需按**回车**。或者，你可以使用 `smbclient` 的\
  \ `-Uusername` 选项使用有效的 Samba 用户账户进行身份验证。你将在第 38 章中阅读更多相关内容。列表 23.1 显示了 `smbclient\
  \ -L` 命令的结果。\n\n**列表 23.1** 发现 SMB 共享\n\n点击此处查看代码图像\n\n* * *\n\n```\n[root@localhost\
  \ ~]# smbclient -L 192.168.122.201\n\nEnter root's password:\n\nAnonymous login\
  \ successful\n\nDomain=[MYGROUP] OS=[Unix] Server=[Samba 4.1.1]\n\n      Sharename\
  \      Type      Comment\n      ---------      ----      -------\n      data   \
  \        Disk      Demo data directory\n      homedirs       Disk      LDAP user\
  \ home directories\n      IPC$           IPC       IPC Service (Samba Server Version\n\
  4.1.1)\nAnonymous login successful\n\nDomain=[MYGROUP] OS=[Unix] Server=[Samba 4.1.1]\n\
  \      Server               Comment\n      ---------              Comment\n    \
  \  labipa               Samba 4.1.1)\n```\n\n\n\n要挂载 SMB 共享，你可以使用 `mount` 命令。你可以使用\
  \ `-t cifs` 选项来指定挂载目标为 SMB 共享，但即使没有此选项它也能工作，因为 `mount` 命令足够智能，能够自动发现你想要连接的是 SMB\
  \ 共享。如果共享允许访客访问（guest access），你可以指定 `-o guest` 选项以访客用户身份验证，无需密码。或者，使用 `-o user=guest`\
  \ 选项来实现相同的目的。完整的 `mount` 命令如下：\n\n点击此处查看代码图像\n\n```\nmount -t cifs -o user=guest\
  \ //192.168.122.200/data /mnt\n```\n\n该命令将 `192.168.122.200` 上的 `/data` 共享挂载到本地的\
  \ `/mnt` 目录。请注意，你可以访问共享中的文件，但无法向其中写入任何文件，因为你是以访客用户的身份验证的，而该用户对共享具有有限的访问权限。\n\n###\
  \ 验证 SMB 共享的身份\n\n在上一节中，你学习了如何使用访客凭据挂载共享。如果你想对该共享进行某些操作，你应该以有效的 Samba 用户身份进行验证。这是一个具有连接\
  \ Samba 共享所需的凭据的特定用户账户。（普通的 Linux 用户无法做到这一点。）为了此目的，必须创建一个 Samba 用户，如 第 38 节 中讨论的那样。\n\
  \n要指定你想使用的 Samba 用户名，可以添加 `-o username=someone` 挂载选项：\n\n点击此处查看代码图像\n\n```\nmount\
  \ -o username=sambauser1 //server/share /somewhere\n```\n\n当你执行此操作时，`mount` 命令会提示输入密码。在练习\
  \ 23.2 中，你将学习如何从命令行发现并挂载 Samba 共享。\n\n***\n\n### 练习 23.2 发现和挂载 SMB 共享\n\n本练习假设你正在使用\
  \ [`www.rhatcert.com`](http://www.rhatcert.com) 提供的测试环境。\n\n**1.** 登录到 `server1`\
  \ 并打开 root shell；挂载操作需要以 root 用户身份执行。\n\n**2.** 输入 `yum install -y cifs-utils samba-client`\
  \ 安装所需的 RPM 软件包。\n\n**3.** 输入 `smbclient -L 192.168.122.200` 列出 labipa 服务器上可用的共享。\n\
  \n**4.** 输入 `mount -t cifs -o guest //192.168.122.200/data /mnt` 以访客身份将 `/data`\
  \ 共享挂载到 `/mnt` 目录。\n\n**5.** 输入 `mount` 验证挂载是否成功。\n\n***\n\n### 通过图形界面访问 Samba 共享\n\
  \n在准备 RHCSA 考试时，专注于从命令行访问 Samba 共享是一个好主意。不过，也有其他选项。你也可以从 Linux 服务器上的 GNOME 3 图形界面访问\
  \ Samba 共享。要完成这一点，请执行以下步骤：\n\n**1.** 从图形界面，点击 `Places（位置） > Browse Network（浏览网络）`。如果\
  \ Samba 命名服务已配置并被防火墙允许，你将看到列出的 Samba 服务器。\n\n**2.** 或者，选择 `Network（网络） > Connect\
  \ to Server（连接到服务器）` 并添加服务器名称以及共享名称。你需要按照 `smb://servername/sharename` 的格式进行操作，例如\
  \ `smb://ipa.example.com/data`（参见图 23.1）。\n\n![Image](img/23fig01.jpg)\n\n**图 23.1**\
  \ 输入你想连接的共享名称。\n\n**3.** 现在你会看到一个窗口，需要在其中输入你想用于验证的用户凭据（参见图 23.2）。验证成功后，共享将添加到图形界面。如果你想断开连接，请点击\
  \ `Eject（弹出）` 按钮。\n\n![Image](img/23fig02.jpg)\n\n**图 23.2** 输入用户凭据\n\n\n\n\npassword=secret\n\
  \ndomain=mydomain\n\n***\n\n### 提示\n凭据文件的布局在 `man mount.cifs` 中描述。\n\n***\n\n当从命令行挂载时使用凭据文件，你可以包含\
  \ `-o credentials=filename` 选项，如下：\n\n点击此处查看代码图像\n\n```bash\nmount -t cifs -o credentials=/root/creds\
  \ //server1/data /mnt/data\n```\n\n要在 `/etc/fstab` 文件中实现相同的操作，需要在 `/etc/fstab` 中包含以下行：\n\
  \n点击此处查看代码图像\n\n```\n//server1/data      /mnt/data cifs      _netdev,, x-systemd.automount,credentials=/root/creds\
  \     0 0\n```\n\n***\n\n### 提示\n你可以在第 38 章中找到关于高级挂载选项的更多信息。\n\n***\n\n## 使用自动挂载（Automount）挂载远程文件系统\n\
  \n作为使用 `/etc/fstab` 的替代方案，你可以配置自动挂载来自动挂载共享。自动挂载也可用于 SMB 和 NFS 挂载，其主要的区别在于通过自动挂载进行的挂载是按需的，而不是默认的。因此，使用自动挂载可以确保不会挂载并不需要的的文件系统。\n\
  \n### 理解自动挂载\n\n自动挂载是由 `autofs` 服务实现的，该服务在尝试访问共享时负责挂载。这意味着它是按需挂载的，而不需要永久挂载。使用自动挂载的一个重要优势是它完全在用户空间运行，而且与通过\
  \ `mount` 命令进行的挂载不同，它不需要 root 权限。\n\n***\n\n### 提示\n在之前的 RHEL 版本中，使用 `auto.master`\
  \ 文件来定义自动挂载的文件系统。在 RHEL 7 中，你可以使用 `/etc/auto.master.d` 目录下的片段文件作为替代。不过，你仍然可以使用旧方法。\n\
  \n***\n\n要配置自动挂载，必须安装 `autofs` 软件包。安装后，需要在 `/etc/auto.master.d` 目录下创建一个主映射文件（master-map\
  \ file）。该文件的名称并不重要，但它需要以 `autofs` 结尾。在主映射文件中，指定了由 `autofs` 服务监控的目录。该文件引用了第二个文件，该文件包含了执行自动挂载的设置。在练习\
  \ 23.3 中，你将亲自创建此配置。\n\n使用自动挂载时，可以使用两种不同的自动挂载映射：\n\n![图像](img/squf.jpg) 间接映射（indirect\
  \ map）包含一个由自动挂载创建的目录。间接挂载允许在不需要重启 `autofs` 服务的情况下进行更改，使其完全可以从用户空间访问。\n\n![图像](img/squf.jpg)\
  \ 直接文件（direct file）不涉及目录的创建，它必须在自动挂载挂载（远程）文件系统之前存在。\n\n### 为 NFS 配置自动挂载\n\n配置自动挂载解决方案是一个复杂的步骤。为了展示它是如何工作的，练习\
  \ 23.3](#ch23.html_ch23exer03)列出了所有涉及的步骤。按照此练习中的步骤操作，亲手观察如何配置自动挂载。\n\n***\n\n###\
  \ 练习 23.3 配置直接和间接映射以挂载 NFS 共享\n\n此练习在 `server1` 上进行。它使用了通过 labipa 服务器提供的 NFS 共享。\n\
  \n**1.** 输入 `yum install -y autofs` 安装 `autofs` 软件包。\n\n**2.** 创建主映射文件，其中包含后续指令，告诉\
  \ `autofs` 服务如何自动挂载远程文件系统。输入 `vim /etc/auto.master.d/demo.autofs` 创建并打开该文件。\n\n\
  **3.** 通过添加以下行为间接映射挂载添加主映射条目：\n\n```\n/shares    /etc/auto.demo\n```\n\n这使用 `/shares`\
  \ 目录作为所有间接挂载的起点。`auto.demo` 文件被引用为进一步完成自动挂载的指令的文件。\n\n**4.** 在同一个文件中，包含以下用于直接映射挂载点的行：\n\
  \n```\n/-          /etc/auto.direct\n```\n\n在主映射文件中，直接挂载 始终以 `/-` 作为直接挂载的起点。关于如何执行挂载的进一步指令在\
  \ `auto.direct` 文件中。注意，这些辅助文件的名称并不重要。唯一的要求是它们必须在指定的路径中创建。\n\n**5.** 在间接挂载文件 `auto.demo`\
  \ 中，包含以下行，使用 `rw` 和 `sync` NFS 挂载选项将 `labipa:/data` 挂载到目录 `/shares/data` 上：\n\n\
  点击此处查看代码图像\n\n```\ndata      -rw,sync  labipa:/data\n```\n\n注意第一个字段作为相对目录名包含挂载点的名称，随后是挂载选项，然后是服务器和共享的名称。注意，在这种间接挂载中，`/shares`\
  \ 目录及其数据将在指定文件系统挂载的时刻由自动挂载自动创建。\n\n**6.** 现在在文件 `/etc/auto.direct` 中创建直接挂载配置。给该文件以下内容：\n\
  \n点击此处查看代码图像\n\n```\n/mnt      -rw,sync labipa:/home\n```\n\n注意，在直接挂载中，用挂载点的目录在执行自动挂载之前应该已经存在。\n\
  \n**7.** 输入 `systemctl enable autofs; systemctl start autofs` 启动 `autofs` 服务。\n\n\
  **8.** 此时，你可以测试自动挂载。输入 `cd /shares`。这应该自动在 `/shares/data` 挂载 `labipa:/data` 共享。现在输入\
  \ `cd /mnt`。这应该自动将 `labipa:/home` 共享挂载到 `/mnt` 目录。\n\n***\n\n### 在自动挂载中使用通配符\n\n\
  在练习 23.3](#ch23.html_ch23exer03)中，你学习了如何根据固定目录执行自动挂载。在某些情况下，这并不很有用，使用动态目录名称更好。例如，自动挂载家目录的情况。\n\
  \n考虑 `labipa:/home` 目录，它包含多个用户家目录。当用户登录系统时，你可能希望在 `labipa` 上挂载对应的家目录。为了实现这一目标，你使用以下配置：\n\
  \n**1.** 为了配置将家目录挂载到 `/home/guests` 的间接挂载，创建主映射文件 `/etc/auto.master.d/home.autofs`\
  \ 并给它以下内容：\n\n点击此处查看代码图像\n\n```\n/home/guests    /etc/auto.homes\n```\n\n**2.**\
  \ 创建 `/etc/auto.homes` 文件并给它以下内容：\n\n点击此处查看代码图像\n\n```\n*      rw,sync  labipa:/home/ldap/&\n\
  ```\n\n**3.** 使用 `systemctl restart autofs` 重启 `autofs` 服务。\n\n应用此过程，你可以确保如果本地家目录位置设置为\
  \ `/home/guests/$USER` 的用户登录，将从 `labipa` 上的 `/home/ldap/$USER` 目录自动挂载对应的子目录。\n\n\
  \n\n\n\n如果你以前在旧版本的 RHEL 中用过 automount，你可能直接在 `/etc/auto.master` 中配置了该过程的第一步。这种方法仍然可行，这意味着你不需要像在练习\
  \ 23.3 中描述的那样在 `/etc/auto.master.d` 中创建主映射条目，而是可以直接在 `auto.master` 文件中放入 `/shares\
  \ -rw,sync labipa:/data` 行。这种解决方案仍然有效，但已弃用。在 RHEL 7 上，`auto.master` 文件被视为 RPM 的一部分，在你的服务器上更新\
  \ RPM 时它可能会被覆盖。因此，更倾向于使用练习 23.3 中描述的方法，正如在该练习中所示；配置中系统管理的部分与用户管理的部分被清晰地隔离开来。\n\n\
  **提示**\n如果你认为在 `/etc/auto.master.d` 中创建主映射条目的新方法太复杂，欢迎使用旧方法。考试中唯一重要的是你的解决方案能够运行；你如何实现这一点并不真正重要。\n\
  \n## 使用 Automount 挂载 SMB 共享\n\n使用 automount 挂载 SMB 共享的过程与上一节描述的 automount 挂载 NFS\
  \ 共享的过程相似。有几点需要考虑：\n\n![图像](img/squf.jpg) 如果你想使用密码文件，请确保在挂载选项中包含该文件的绝对路径（例如 `/root/filename.cre`）。\n\
  \n![图像](img/squf.jpg) 挂载的共享名称应以冒号(:)开头。所有在 automount 中挂载且名称以 / 开头的设备都应该前面加一个冒号。\n\
  \n## 配置 FTP 服务器\n\nFTP 一直是 Linux 环境中的常用服务。它不再属于 RHCSA 或 RHCE 的目标范围。然而，由于每个系统管理员都应该至少知道如何配置\
  \ FTP 服务器，在练习 23.4 中，你将学习如何配置 FTP 服务器并将其设置为匿名投递箱，用户可以向其中放入文件，但在放入之后就无法再次读取它们。\n\n\
  **注意**\n在本练习中，我将仅带你完成将 FTP 服务器设置为匿名用户投递箱的过程。如果你以后想在真实的服务器上执行此操作，请确保将 FTP 服务器文档根放在专用存储设备上，或使用配额（quota）来最大化投递箱中可以存储的数据。\n\
  \n## 练习 23.4 配置 FTP 匿名投递箱\n\n1. 在 server1 上，输入 `yum install -y vsftpd`。\n2. FTP\
  \ 服务器使用 `/var/ftp` 目录作为默认文档根。在此目录下，使用 `mkdir /var/ftp/uploads` 创建名为 `uploads` 的子目录。输入\
  \ `chmod 0730 /var/ftp/uploads` 设置正确的权限，并使用 `chgrp ftp /var/ftp/uploads` 将组所有者设置为\
  \ `ftp` 。在匿名投递箱上，用户可以写文件但不能读取它们。\n3. 用编辑器打开文件 `/etc/vsftpd/vsftpd.conf` 并确保它包含以下参数。不要更改其他内容：\n\
  ```\nanon_upload_enable=YES\nanon_mkdir_write_enable=YES\nanon_mask = 077\nchown_uploads\
  \ = yes\nchown_username = root\n```\n4. 输入 `systemctl enable vsftpd; systemctl start\
  \ vsftpd` 以启用并启动 FTP 服务器。\n5. 输入 `firewall-cmd --add-service ftp --permanent` 然后跟上\
  \ `firewall-cmd --reload`。\n6. 从 server2 上，输入 `yum install -y lftp` 安装 `lftp` 命令行客户端。\n\
  7. 输入 `lftp server1` 并输入 `ls`。你会看到 pub 和 uploads 目录。\n8. 输入 `put /etc/hosts`。你会失败。\n\
  9. 输入 `grep AVC /var/log/audit/audit.log`。你将看到一条表示此操作被拒绝的消息。\n10. 输入 `semanage fcontext\
  \ -a -t public_content_rw_t “/var/ftp/uploads(/.*)?”` 然后执行 `restorecon -Rv /var/ftp/uploads`\
  \ 并再次尝试第 7 和第 8 步。你仍然会失败。\n\n**提示**\n如果尚未安装 `semanage` 命令，第 10 步将失败。你不需要学习长长的所有所需\
  \ RPM 包列表。正如第 11 章中讨论的样，“管理软件”，使用 `yum whatprovides */semanage` 来找到你需要安装以便使用此命令的\
  \ RPM 名称。\n11. 输入 `getsebool -a | grep ftp`。你会看到 `ftpd_anon_write` 布尔值，目前它是关闭的。\n\
  12. 输入 `setsebool -P ftpd_anon_write on` 开启该布尔值。\n13. 再次尝试上传文件。现在你成功了并创建一个匿名用户文件上传投递箱。\n\
  \n#### 总结\n\n在本章中，你学习了如何挂载远程文件系统以及如何设置 FTP 服务器。你首先学习了如何手动挂载 NFS 或 SMB 文件系统。\n\n\
