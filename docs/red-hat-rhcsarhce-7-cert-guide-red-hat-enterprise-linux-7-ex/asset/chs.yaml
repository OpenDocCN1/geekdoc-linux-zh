  \ SELinux 上文标签以允许 Apache 工作。该布尔值的名称是什么？\n\n**a.** `http_restricted`\n**b.** `http_confined`\n\
  **c.** `httpd_unified`\n**d.** `httpd_secure`\n\n### [5] 哪种工具允许你为设置 TLS 安全 Apache\
  \ Web 服务器生成 TLS 证书和密钥？\n\n**a.** `genkey`\n**b.** `openssl`\n**c.** `createkey`\n\
  **d.** `sslkey`\n\n### [6] TLS 私钥存储的默认目录是？\n\n**a.** `/etc/ssl/certs/servername.key`\n\
