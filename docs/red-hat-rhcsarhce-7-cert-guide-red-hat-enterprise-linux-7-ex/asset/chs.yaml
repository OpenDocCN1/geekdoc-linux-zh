  \ IPv6 地址，在最后一部分，你学习了如何在 RHEL 7 上配置自定义路由。\n\n### “我已经掌握这些了吗？”测验\n\n\n\n\n\n“我已经掌握了这些内容吗？”测试可以让你评估自己是应该仔细阅读整个章节，还是直接跳到“考试备习任务”部分。如果你对这些问题的答案或对你自己对这些主题知识水平的评估有疑问，请阅读整个章节。表\
