  \ Linux 机器上的特定服务时，你通常需要多个不同的软件包。例如，如果你想让你的机器成为虚拟化宿主机，你需要 KVM 软件包，还需要所有支持包，如 `qemu`、`libvirt`\
  \ 以及客户端包。或者在将服务器配置为 Web 服务器时，许多情况下你还需要安装如 `PHP` 等额外的软件包。\n\n为了方便管理特定功能，你可以使用软件包组\
  \ 而不是特定的软件包来完成工作。软件包组定义在仓库中，`yum` 提供了组管理命令来处理这些组。要查看所有当前组的概览，请使用 `yum groups list`。它显示的输出如列表\
