  ```\n\n## 使用图形工具管理时间\n\n如果你的服务器配置了图形界面，你可以使用图形工具来管理时间。请按照以下步骤操作：\n\n1. 在图形显示器上，点击右上角显示的当前时间。\n\
  2. 在打开的屏幕上，点击**日期与时间设置**（Date & Time Settings）。\n3. 打开一个新窗口。要访问允许更改时间的选项，请点击**解锁**（Unlock）。\n\
  4. 从你现在看到的屏幕，你可以切换网络时间的开启，并更改当前时区设置以及当前时间。\n\n或者，你也可以使用 `system-config-date` 命令启动管理时间的图形化工具。\n\
