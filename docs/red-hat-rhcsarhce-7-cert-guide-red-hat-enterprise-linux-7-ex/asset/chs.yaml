  \n\n\n\n\n要安装 Samba 服务包和客户端工具，请确保安装了以下 RPM 包：\n\n![Image](img/key_topic.jpg)\n\n\
  ![Image](img/squf.jpg) **samba:** 包含 Samba 守护进程及相关的配置文件\n\n![Image](img/squf.jpg)\
  \ **cifs-utils:** 包含 Samba 客户端包，包括你挂载远程 SMB 共享所需的命令。\n\n![Image](img/squf.jpg) **samba-client:**\
  \ 包含设置 Samba 共享所需的某些实用程序。\n\n你可以通过执行 `yum install smba cifs-utils samba-client`\
  \ 来完成此操作。\n\n### 在 Linux 上准备共享目录\n\n要配置服务器与 Samba 服务器共享目录，你首先需要设置 Linux 部分的配置。当用户向\
  \ Samba 服务器进行身份验证时，将使用一个 Samba 用户账户，但该 Samba 用户账户会映射到一个 Linux 用户账户，且该用户账户需要访问权限。\n\
  \n因此，你必须创建一个目录并为该目录设置适当的权限。你可以通过多种方式实现：简单的方法，即直接对共享目录设置权限模式 777；或者更复杂的方法，即设置具有组所有者的目录以及该组成员访问该目录所需的权限。你也可以使用访问控制列表（ACLs；参见第\
  \ 7 章，“配置权限””）对共享目录进行更复杂的访问控制。\n\n***\n\n提示\n\n通常在考试中，要求你执行非常特定的配置，而且安全是一个重要主题。准备好创建仅供特定用户访问的\
  \ Samba 共享。因此，如果你想在 Linux 文件系统上将权限模式设置为 777，请确保你知道如何在共享级别收紧安全性。\n\n***\n\n### 配置\
  \ /etc/samba/smb.conf\n\nSamba 配置本身的主部分位于 `/etc/samba/smb.conf` 文件中。该文件包含两个部分。第一部分是\
  \ `[global]` 段，其中定义了 Samba 服务的通用属性。第二部分包含共享定义，其中定义了特定特定的设置。还可以启用两个特殊的共享：\n\n![Image](img/squf.jpg)\
  \ `[homes]` 包含通过 Samba 共享的主目录的访问默认值。\n\n![Image](img/squf.jpg) `[printers]` 用于访问通过\
  \ CUPS 打印系统共享的打印机。\n\n列表 37.1 显示了如何在默认的 smb.conf 文件中定义这些共享。\n\n**列表 37.1** `[homes]`\
  \ 和 `[printer]` 共享的定义\n\n点击此处查看代码图像\n\n***\n\n```\n[homes]\n      comment = Home\
  \ Directories\n      browseable = no\n      writable = yes\n;      valid users =\
  \ %S\n;      valid users = MYDOMAIN\\%S\n[printers]\n      comment = All Printers\n\
  \      path = /var/spool/samba\n      browseable = no\n      guest ok = no\n   \
  \   writable = no\n      printable = yes\n```\n\n***\n\n### 理解 [global] 段\n\n在 `[global]`\
  \ 段中，你定义了基础 Samba 参数。表 37.2 总结了这些参数中一些重要的内容。\n\n![Image](img/key_topic.jpg)![Image](img/37tab02.jpg)\n\
  \n**表 37.2** Samba 全局参数\n\n在浏览 smb.conf 文件的内容时，你会发现许多其他配置参数。其中许多参数是旧的且不再需要。如浏览器控制选项和名称解析选项主要用于确保与\
  \ Windows 2000 之前的 Windows 环境兼容性。\n\n### 创建共享\n\n要创建一个目录共享，你需要在 smb.conf 文件的末尾附近添加一个段。共享名称放在括号中，后面紧跟进一步定义共享的指令。表\
  \ 37.3 列出了一些常见的共享选项。\n\n![Image](img/key_topic.jpg)![Image](img/37tab03.jpg)\n\n\
  **表 37.3** 常见目录共享选项\n\n一个经常引起困惑的话题是如何启用 Samba 共享的写权限。以下列表总结了其核心点：\n\n![Image](img/squf.jpg)\
  \ 在任何情况下，对 Linux 文件系统没有写权限的用户都不会对共享拥有写权限。\n\n![Image](img/squf.jpg) 将 `read only`\
  \ 设置为 no 与将 `writable` 设置为 yes 的效果相同。\n\n![Image](img/squf.jpg)\n\n***\n\n提示\n\n\
  在测试共享之前，使用 `testparm` 命令。它会告诉你 smb.conf 中是否存在任何语法错误。尽管，它不会测试逻辑错误。\n\n*** *\n\n###\
  \ 使用 Samba 用户\n\n当使用 `security = user` 设置时，你需要创建两个账户以启用共享访问。通常，在服务器上，你只有需要访问它的 Samba\
  \ 专用用户（除了用于管理的本地 root 用户外）。这些仅限 Samba 的用户是不登录终端的。要创建 Samba 用户，请完成以下步骤：\n\n![Image](img/key_topic.jpg)\n\
  \n**1.** 创建 Linux 用户（如果不存在），使用 `useradd -s /sbin/nologin lara`。\n\n**2.** 添加 Samba\
  \ 用户，使用 `smbpasswd -a lara`。在提示时输入两次密码。\n\n注意，如果在没有 `-a` 选项的情况下使用 `smbpasswd` 命令，该命令尝试更改现有\
  \ Samba 用户的密码。因此，请确保使用 `-a` 选项创建新用户。\n\n***\n\n提示\n\n另一个管理 Samba 账户的工具是 `pdbedit`。该命令有很多选项用于添加\
  \ Samba 账户和 Samba 特定属性。如果你正在寻找指定登录时间的选项，或者添加机器账户，`pdbedit` 是一个很好的工具。对于考试，你不需要知道如何使用它。你可能会喜欢\
  \ `-L` 选项，它可以列出服务器上所有现有 Samba 用户。\n\n***\n\n### 练习 37.1 配置 Samba 服务器\n\n在练习 37.1\
  \ 中，你将在目前学的所有知识应用于一个创建共享并供某些用户使用的练习。\n\n请在该练习中的所有任务在 server1 上执行。server2 用于后续练习中访问此\
  \ Samba 共享。\n\n**1.** 打开 root shell。\n\n**2.** 确保已安装所有所需的 RPM 包：`yum install -y\
  \ samba samba-client cifs-utils`。\n\n**3.** 创建四个将作为 Samba 用户的 Linux 用户：`for i in\
  \ bill melissa lara lisa; do useradd -s /sbin/nologin $i; done`。\n\n\n\n\n4. 将 Linux\
  \ 用户添加到 `sambagroup` 组。使用 `groupadd sambagroup` 创建 Linux 组，并使用 `for i in bill melissa\
  \ lara; do usermod -aG sambagroup $i; done` 将三个 Linux 用户（但*不是*用户 `lisa!`）成为该组组成员。\n\
  \n5. 同样创建 Samba 用户：`for i in bill melissa lara lisa; do smbpasswd -a $i; done`。在提示密码时，输入密码\
  \ `password`。\n\n6. 在 Linux 文件系统上创建共享目录：`mkdir -p /data/sambashare`。\n\n7. 设置共享目录的\
  \ Linux 权限：执行 `chgrp sambagroup /data/sambashare`，然后执行 `chmod g=rwx /data/sambashare`。\n\
  \n8. 使用编辑器打开配置文件 `/etc/samba/smb.conf`，将 `workgroup` 参数更改为 `workgroup = mysamba`。\n\
  \n9. 添加共享部分并确保其看起来如下：\n\n```\n[sambashare]\ncomment = My Samba Share\npath = /data/sambashare\n\
  write list = @sambagroup\n```\n\n10. 输入 `testparm` 以验证你在 `smb.conf` 文件中没有任何语法错误。\n\
  \n11. 使用 `systemctl start smb` 后面接 `systemctl enable smb` 来启动并启用 Samba 守护。\n\n12.\
  \ 通过输入 `smbclient -L` 验证共享可用。\n\n13. 使用 `setenforce 0` 和 `systemctl stop firewalld`\
  \ 临时关闭 SELinux 和 firewalld —— 我们稍后会关注 SELinux。\n\n14. 从 server2，使用 `mount -o username=lara\
  \ //localhost/sambashare /mnt` 访问共享。你应该应该能够访问该共享。\n\n***\n\n**提示**\n\n在考试中配置 Samba\
  \ 的巨大挑战在于有太多需要考虑的事情。如果它运行不符合预期，很难找到具体的故障原因。为了让故障排除变得简单一点，最好临时使用 `setenforce 0` 和\
  \ `systemctl stop firewalld` 关闭 firewalld 和 selinux。*永远不要*永久关闭这些服务；如果你这样做了并在考试结束时忘记再次开启，你将通过考试。此外，在完成特定任务后立即开启这些服务也是一个好主意，这样你可以验证你的配置在\
  \ firewalld 开启的情况下也能工作，并且 SELinux 已启用并功能正常。\n\n***\n\n### 安全防护 Samba\n\n在上一节中，你临时关闭了\
  \ firewalld 和 SELinux，这让你能够专注于 Samba 配置。在考试结束时，你必须确保防火墙和 SELinux 均已启用。此外，你必须能够在\
  \ Samba 共享上配置 Kerberos 认证。本节将向你展示如何进行操作。\n\n### Samba 相关的 SELinux 参数\n\n如果你不配置 SELinux，Samba\
  \ 共享访问将无法。在处理 Samba 时，需要考虑一些 SELinux 上下文类型和布尔值（Booleans）。这些总结在 表 37.4 中。\n\n![Image](img/key_topic.jpg)![Image](img/37tab04.jpg)\n\
  \n**表 37.4** Samba 相关的 SELinux 设置\n\n表 37.4 中的前三项是上下文设置。要应用它们，使用 `semanage fcontext\
  \ -a -t samba_share_t \"/data/sambashare(/.*)?\"` 并使用 `restorecon -Rv /data/sambashare`\
  \ 应用上下文设置。关于布尔值，要将 `smbd_anon_write` 布尔值永久设置为 1，请使用 `setsebool -P smbd_anon_write\
  \ 1`。\n\n### Samba 防火墙\n\n在配置 SELinux 允许 Samba 流量后，你还需要打开防火墙。正如你在前面的章节中学到的，为 Samba\
  \ 流量打开防火墙很容易的。在 firewalld 中，有一个 Samba 服务。你可以在 列表 37.2 中查看其内容。\n\n**列表 37.2** Firewalld\
  \ Samba 服务\n\n点击此处查看代码图像\n\n***\n\n```\n[root@localhost services]# cat samba.xml\n\
  \n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<service>\n  <short>Samba</short>\n\
  \  <description>此选项允许你访问并参与 Windows 文件和打印机共享网络。你需要安装 samba 包才能使此选项产生作用。</description>\n\
  \  <port protocol=\"udp\" port=\"137\"/>\n  <port protocol=\"udp\" port=\"138\"\
  />\n  <port protocol=\"tcp\" port=\"139\"/>\n  <port protocol=\"tcp\" port=\"445\"\
  />\n  <module name=\"nf_conntrack_netbios_ns\"/>\n</service>\n```\n\n***\n\n如你所示，该服务在防火墙中打开了不同的端口。它还加载了\
  \ `nf_conntrack_netbios_ns` 模块，这有助于 NetBIOS 流量。在 firewalld 中，有一个 Samba 服务。你可以在 列表\
  \ 37.2 中查看其内容。\n\n为了配置 SELinux 允许 Samba 流量，你还需要打开防火墙。正如你在前面的章节中学到的，为 Samba 流量打开防火墙很容易的。\n\
  \n\n\n\n\n3 `host/server1.example.com@EXAMPLE.COM`\n3 `host/server1.example.com@EXAMPLE.COM`\n\
  3 `host/server1.example.com@EXAMPLE.COM`\n1 `cifs/server1.example.com@EXAMPLE.COM`\n\
  1 `cifs/server1.example.com@EXAMPLE.COM`\n1 `cifs/server1.example.com@EXAMPLE.COM`\n\
  1 `cifs/server1.example.com@EXAMPLE.COM`\n1 `cifs/server1.example.com@EXAMPLE.COM`\n\
  1 `cifs/server1.example.com@EXAMPLE.COM`\n\n此时，server1 已经拥有了正确的 keytab 文件。\n\n###\
  \ 配置 Samba 使用 keytab 文件\n\n在考试中，Red Hat 可能会提供 keytab 文件。你可能需要从中央服务器下载它并复制到 `/etc/krb5.keytab`\
  \ 文件中。在操作过程中，你不需要执行此操作，因为你刚刚创建了自己的 keytab 文件：\n\n1. 将 `/etc/krb5.keytab` 文件的权限模式设置为\
  \ 600，并确保其所有者和所属组均为 root。\n2. 在 `/etc/samba/smb.conf` 文件中，添加以下章节：\n\n```\nsecurity\
  \ = ADS\nrealm = KERBEROS_REALM\nencrypt passwords = yes\nkerberos method = secrets\
  \ and keytab\npassword server = ipa.example.com\n```\n\n3. 添加完成后后，输入 `systemctl\
  \ restart smb` 重启 Samba 服务。\n4. 要添加新的 Samba 用户，你必须在 IDM 服务器中添加；更多详情请参阅 附录 D，“设置身份管理”。添加这些用户后，从任何启用\
  \ Kerberos 的客户端输入并以下命令进行测试：\n\n```\nkinit username\nsmbclient -k -L //sambaserver\n\
  ```\n\n这应该显示出现在 Samba 用户可以使用的活动共享列表。\n\n#### 访问 SMB 共享\n\n用户有多种方法从 Linux 计算机访问 SMB\
  \ 共享。这允许用户连接到其他 SMB 服务器（包括 Windows 文件服务器）提供的共享，同时也允许管理员为 Linux 服务器上的所有用户预先配置到 SMB\
  \ 共享的连接。在本节中，你将学习从 Linux 连接到 SMB 共享的不同选项。\n\n##### 发现 Samba 共享\n\n在连接到 Samba 共享之前，列出\
  \ Samba 服务器上可用的 Samba 共享是一个好主意。为了这一点，你可以使用 `smbclient -L` 命令，后跟提供 Samba 服务的主机名称。该命令的示例位于\
  \ 列表 37.4，其中从 localhost 请求了共享列表。请注意，`smbclient -L` 命令会提示 root 密码；你可以通过直接按回键来忽略它。查看哪些共享是用的不需要凭据。\n\
  \n**列表 37.4** 列出可用共享\n\n```\n[root@localhost ~]# smbclient -L //localhost\nEnter\
  \ root's password:\n\nAnonymous login successful\nDomain=[MYGROUP] OS=[Unix] Server=[Samba\
  \ 4.1.1]\n         Sharename      Type      Comment\n         ---------      ----\
  \      -------\n         sambagroup     Disk      My Samba Share\n         IPC$\
  \           IPC       IPC Service (Samba Server Version 4.1.1)\nAnonymous login\
  \ successful\nDomain=[MYGROUP] OS=[Unix] Server=[Samba 4.1.1]\n               Server\
  \                   Comment\n               ---------                   -------\n\
  \               Workgroup\n```\n\n*(注：提供的文本包含重复章节，此处遵循下方的逻辑结构)*\n\n#### 访问 SMB 共享\n\
  \n用户有多种方法从 Linux 计算机访问 SMB 共享。这允许用户连接到其他 SMB 服务器（包括 Windows 文件服务器）提供的共享，同时也允许管理员为\
  \ Linux 服务器上的所有用户预先配置到 SMB 共享的连接。在本节中，你将学习从 Linux 连接到 SMB 共享的不同选项。\n\n##### 发现 Samba\
  \ 共享\n\n在连接到 Samba 共享之前，列出 Samba 服务器上可用的 Samba 共享是一个好主意。为了这一点，你可以使用 `smbclient -L`\
  \ 命令，后跟提供 Samba 服务的主机名称。该命令的示例位于 列表 37.4，其中从 localhost 请求了共享列表。请注意，`smbclient -L`\
  \ 命令会提示 root 密码；你可以通过直接按回键来忽略它。查看哪些共享是可用的不需要凭据。\n\n**列表 37.4** 列出可用共享\n\n```\n[root@localhost\
  \ ~]# smbclient -L //localhost\nEnter root's password:\n\nAnonymous login successful\n\
  Domain=[MYGROUP] OS=[Unix] Server=[Samba 4.1.1]\n         Sharename      Type  \
  \    Comment\n         ---------      ----      -------\n         sambagroup   \
  \  Disk      My Samba Share\n         IPC$           IPC       IPC Service (Samba\
  \ Server Version 4.1.1)\nAnonymous login successful\nDomain=[MYGROUP] OS=[Unix]\
  \ Server=[Samba 4.1.1]\n               Server                   Comment\n      \
  \         ---------                   -------\n               Workgroup\n```\n\n\
  #### 访问 SMB 共享\n\n用户有多种方法从 Linux 计算机访问 SMB 共享。这允许用户连接到其他 SMB 服务器（包括 Windows 文件服务器）提供的共享，同时也允许管理员为\
  \ Linux 服务器上的所有用户预先配置到 SMB 共享的连接。在本节中，你将学习从 Linux 连接到 SMB 共享的不同选项。\n\n##### 发现 Samba\
  \ 共享\n\n在连接到 Samba 共享之前，列出 Samba 服务器上可用的 Samba 共享是一个好主意。为了这一点，你可以使用 `smbclient -L`\
  \ 命令，后跟提供 Samba 服务的主机名称。该命令的示例位于 列表 37.4，其中从 localhost 请求了共享列表。请注意，`smbclient -L`\
  \ 命令会提示 root 密码；你可以通过直接按回键来忽略它。查看哪些共享是可用的不需要凭据。\n\n#### 挂载 Samba 共享\n\n访问 SMB 共享的最常见方法将其挂载到本地目录。为了这一点，需要\
  \ `cifs-utils` 软件包。在挂载 Samba 共享时，必须指定用户名和密码。\n\n**提示**：确保已安装 `cifs-utils` 软件包。\n\
  \n##### 练习 37.3 挂载 SMB 文件系统\n\n开始此练习之前，确保你有访问 server1 的权限。\n\n1. 在 server2 上，使用\
  \ `yum install cifs-utils` 安装软件包。\n2. 使用 `mkdir /mnt/lara` 创建挂载点。\n3. 使用 `smbclient\
  \ -L //server1` 验证 Samba 共享可用。在提示时，输入密码。\n4. 使用 `mount -u username=lara //server1/sambashare\
  \ /mnt/lara` 挂载共享。使用 `touch lara1` 验证你可以写入文件。\n5. 使用 `umount /mnt/lara` 卸载挂载。\n\
  6. 在 `/root/smbusers` 创建凭据文件，内容如下：\n```\nusername=lara\npassword=password\n```\n\
  7. 在 `/etc/fstab` 中添加以下行：\n```\n//server1/sambashare  /mnt/lara  cifs  credentials=/root/smbusers,_netdev\
  \  0 0\n```\n8. 输入 `mount -a`。现在 Samba 共享应该会自动挂载。\n\n##### 多用户 Samba 挂载\n\n在 RHEL\
  \ 7 中，你可以使用 `multiuser` 挂载选项创建多用户 Samba 挂载。管理员作为最小权限用户挂载 Samba 共享。用户可以在当前会话中添加自己的\
  \ SMB 用户名和密码，将其权限提升到自己的级别。\n\n要挂载多用户，你需要一个具有最小权限的 SMB 用户。使用 `multiuser` 选项和 `sec=ntlmssp`\
  \ 选项以该用户身份挂载 Samba 共享，例如：`mount -o multiuser,sec=ntlmssp,username=minimal //server/sambashare\
  \ /mnt/multiuser`。然后，作为想要访问的用户，使用 `cifscreds` 命令连接共享。\n\n`cifscreds` 命令有四个重要的选项，如表\
  \ 37.5 所示。\n\n\n\n\n\n如果 root 用户使用具有最小权限的用户账户挂载了 SMB 共享，用户可以使用 `cifscreds` 将其用户名添加到当前会话中。默认情况下，使用当前用户名。如果需要，可以使用\
  \ `-u username` 选项使用另一个用户名。因此，如果当前用户 `lara` 已经登录，请使用 `cifscreds add server1`。然后，输入用户\
  \ `lara` 的密码。现在，`lara` 就可以访问多用户挂载的 Samba 共享，她将拥有分配给其账户的所有该共享权限。在练习 37.5 中，你将学习如何执行多用户\
  \ Samba 挂载。\n\n***\n\n# 练习 37.5 配置多用户 SMB 挂载\n\n在本次练习中，你将继续完成在之前的实验中创建的设置。\n\n1.\
  \ 在 `server2` 上打开一个 root shell。输入 `mkdir /mnt/multiuser` 为多用户挂载创建挂载点。\n\n2. 创建一个凭据文件以自动挂载多用户共享。使用文件名\
  \ `/root/smb-multiuser` 并确保其包含以下内容：\n\n   ```\n   username=lisa\n   password=password\n\
  \   ```\n\n3. 在 `/etc/fstab` 中添加以下行，以便在服务器启动时执行基础多用户挂载：\n\n   点击此处查看代码图像\n\n   ```\n\
  \   //server1/sambashare      /mnt/multiuser      cifs\n   credentials=root/smb-multiuser,multiuser,sec=ntlmssp\
  \      0 0\n   ```\n\n4. 从 `/etc/fstab` 中移除所有其他 Samba 挂载。\n\n5. 输入 `mount /mnt/multiuser`\
  \ 验证多用户挂载是否正确加载。\n\n6. 尝试使用 `touch file1` 向 `/mnt/multiuser` 写入文件。由于用户 `lisa` 对该共享没有写权限，此命令将失败。\n\
  \n7. 仍在 `server2` 上，以用户 `lara` 的身份打开终端会话。\n\n8. 输入 `cifscreds add server1` 并输入 Samba\
  \ 用户 `lara` 的密码。\n\n9. 向 Samba 共享写入文件。注意该共享现在是可读/写访问的。\n\n***\n\n## 通过 automount\
  \ 挂载 Samba 共享\n\n在某些情况下，通过 `autofs` 挂载 Samba 共享是非常有用的。正如之前讨论过的，有不同的方法允许你使用自动挂载。你可以通过\
  \ `autofs` 服务或 `systemd` 自动挂载单元使用它。在本节中，我们重点关注 `autofs` 自动挂载。\n\n与任何自动挂载配置一样，首先你需要创建一个\
  \ `/etc/auto.master` 文件。在 `auto.master` 文件中，你引用需要监控的目录以及用于监控它的文件。例如，如果你想为自动挂载启用\
  \ Samba 主目录，请为其提供以下内容：\n\n   点击此处查看代码图像\n\n   ```\n   /home/guests      /etc/auto.guests\n\
  \   ```\n\n然后，你需要创建文件 `/etc/auto.guests`。要通过此文件挂载主目录，从 `*` 开始，这意味着“在 `/home/guests`\
  \ 中访问的任何目录”。然后你需要指定挂载选项。对于 `CIFS` 挂载，它类似于：\n\n   点击此处查看代码图像\n\n   ```\n   -fstype=cifs,username=ldap,password=password\
  \ //server1.example.com/homes\n   ```\n\n（注意，这些都在同一行。）同时确保将权限模式设置为 `400`，以便非 root\
  \ 用户无法看到用户名和密码。注意你也可以像之前的那样将其配置为多用户挂载。创建此配置后，重启 `autofs` 服务，你应该能够通过自动挂载挂载 Samba\
