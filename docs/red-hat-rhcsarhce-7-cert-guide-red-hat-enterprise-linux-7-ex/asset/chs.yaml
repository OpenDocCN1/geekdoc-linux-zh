  Is this ok [y/N]:\n```\n\n### 创建你自己的仓库\n这不是 RHCSA 或 RHCE 的硬性要求，但如果你想设置并使用仓库，那么了解如何创建自己的仓库是有用的。这允许你将自己的\
  \ RPM 包放在一个目录中，并将该目录发布为仓库。该操作本身并不困难：你需要将所有的 RPM 软件包复制到想要用作仓库的目录中，然后使用 `createrepo`\
  \ 命令生成元数据，从而让你能够使用该目录。\n\n#### 练习 1.1 创建你自己的仓库\n在此练习中，你将学习如何创建自己的仓库。要完成此练习，你需要访问\
  \ CentOS 安装磁盘或 ISO 文件。\n\n1. 在虚拟机中插入安装磁盘。它会被挂载到目录 `/run/media/user/CentOS 7 x86_64/`。或者，你也可以\
  \ `mount -o loop /path/to/centos.iso /mnt` 手动将 ISO 挂载到 `/mnt` 目录。\n2. 输入 `mkdir\
  \ /repo` 创建一个用作仓库的目录。\n3. 如果你想创建一个包含所有必需文件的完整仓库，输入 `cp $MOUNTPATH/* repo`。（将 `$MOUNTPATH`\
  \ 替换为挂载安装磁盘的目录名称。）如果你不需要完整仓库，可以从安装磁盘复制几个文件到 /repo 目录。\n4. 输入 `yum install -y createrepo`\
  \ 以确保已安装 `createrepo` 软件包。\n5. 输入 `createrepo /repo`。这将生成仓库元数据，允许你使用你自己的仓库。\n6.\
  \ 现在既然你已经创建了自己的仓库，不妨开始使用它。在 `/etc/yum.repos.d` 目录中创建一个名为 `my.repo` 的文件。确保该文件包含以下内容：\n\
  ```\n[myrepo]\nname=myrepo\nbaseurl=file:///repo\n```\n7. 输入 `yum repolist` 验证新创建仓库的可用性。它应该显示\
  \ myrepo 仓库的名称以及通过该仓库提供的软件包数量。\n\n**提示：** 在练习 1.1 中，你通过挂载安装磁盘的 ISO 文件来从中复制文件。获取仓库文件的另一种方便方法是使用\
  \ `yumdownloader` 实用程序。该实用程序允许你直接从仓库下载单个软件包到当前目录。例如，输入 `yumdownloader nmap` 将 nmap\
  \ RPM 包下载到当前目录。\n\n#### 列表 11.3 使用 yum repolist 验证仓库的可用性\n```\n[root@server1 Packages]#\
  \ yum repolist\nLoaded plugins: fastestmirror, langpacks\nmyrepo               \
  \     | 2.9 kB    00:00\nmyrepo/primary_db        |  77 kB    00:00\nLoading mirror\
  \ speeds from cached hostfile\n  * base: mirror.nl.leaseweb.net\n  * extras: mirror.nl.leaseweb.net\n\
  \  * updates: mirror.nl.leaseweb.net\nrepo id                  repo name\nbase \
  \                    CentOS-7 Base\nextras                   CentOS-7 Extras\nupdates\
  \                  CentOS-7 Updates\n```\n\n\n\n\n\n在安装软件包之前，获取有关软件包的更多信息是一个好主意。由于\
  \ `yum` 命令的设计非常直观，你几乎可以猜出它的工作原理。只需使用 `yum info` 后加上软件包的名称即可。在列表 11.5 中，你可以看到 `nmap`\
  \ 软件包的显示（顺便说一下，这是一个非常有用的工具）。它是一个网络嗅探器，允许你找到其他主机上开放的端口。只需使用 `nmap 192.168.122.100`\
  \ 来尝试一下，但请注意，某些网络管理员确实不喜欢 `nmap`，并可能将其视为敌意攻击。\n\n**列表 11.5** `yum info nmap` 的示例输出\n\
