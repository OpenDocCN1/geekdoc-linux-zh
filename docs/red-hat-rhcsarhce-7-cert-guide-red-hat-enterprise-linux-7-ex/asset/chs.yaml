  \ 存储组账户的文件是什么？\n\n### 章末实验\n\n你现在学习了如何创建一个允许用户账户登录你的服务器并访问资源的环境。在两个章末实验中，你学习了如何配置用户和组的环境以及\
  \ LDAP 身份验证。\n\n#### 实验 6.1\n\n**1.** 设置满足以下要求的共享环境：\n\n![Image](img/sqf.jpg) 创建两个组：sales\
  \ 和 account。\n\n![Image](img/sqf.jpg) 创建用户 bob、betty、bill 和 beatrix。确保它们的主组被设置为与用户同名的私有组。\n\
