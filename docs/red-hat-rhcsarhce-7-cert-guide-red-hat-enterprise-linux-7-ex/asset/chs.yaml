  ![Image](img/squf.jpg) 为组授予权限。\n\n**a.** 740**\n\n**b.** 750**\n\n**c.** 027**\n\
  \n**d.** 047**\n\n**10.** 下列哪个命令可以让你检查设置在 myfile 上的所有属性？\n\n**a. `get myfile`**\n\
  \n**b. `ls myfile`**\n\n**c. `listattr myfile`**\n\n**d. `attr myfile`**\n\n###\
  \ 基础主题\n\n#### 管理所有权\n在讨论权限之前，你必须了解所有所有权。在 Linux 上，每个文件和目录有两个所有者：一个用户和一个组。这些所有者是在创建时设置的。创建文件的用户成为所有者，主组成为该组。\n\
  \n##### 显示所有权\n要查看当前的分配，你可以使用 `ls -l` 命令。在表 7.1 中，你可以看到 `/home` 下的目录的所有权。\n\n```\n\
  root@server1 home]# ls -l\ntotal 8\ndrwxr-xr-x 3 bob bob 96 Feb 6 10:13 bob\ndrwxr-xr-x\
  \ 3 caroline caroline 96 Feb 6 10:13 caroline\ndrwxr-xr-x 3 fozia fozia 96 Feb 6\
  \ 10:13 fozia\ndrwxr-xr-x 5 lisa lisa 120 Feb 6 10:12 lisa\ndrwxr-xr-x 14 user user\
  \ 440 Feb 5 10:35 user\n```\n\n使用 `ls`，你可以显示给定目录下文件的所有权。有时获取系统中所有由特定用户或组所有的文件列表可能是很有用的。为了实现这一点，你可以使用\
  \ `find`。`find` 参数 `-user` 可用于此。例如，以下命令显示所有由用户 linda 拥的文件：\n\n```\nfind / -user\
  \ linda\n```\n\n你也可以使用 `find` 搜索由特定组所有的文件。例如，以下命令搜索所有属于 users 组的文件：\n\n```bash\n\
  find / -group users\n```\n\n##### 更改用户所有权\n要更改文件或目录的所有者，你需要使用 `chown` 命令。语法为 `chown\
  \ [OPTIONS] USER FILE`。例如，将 `myfile` 的所有者更改为 `sales`，可以使用：\n\n```bash\nchown sales\
  \ myfile\n```\n\n\n\n\n要应用适当的权限，首先要考虑的是所有权。为了实现这一点，可以使用 `chown` 命令。该命令的语法并不难：\n\n\
  ```\nchown who what\n```\n\n例如，以下命令将文件 `account` 的所有权更改为用户 `linda`：\n\n```bash\n\
  chown linda account\n```\n\n`chown` 命令有几个选项，其中一个特别有用：`-R`。你可能猜得出它的作用，因为这个选项也适用于许多其他命令。它允许你递归地设置所有权，从而允许你设置当前目录及其下目录下所有内容的所有权。以下命令将\
  \ `/home` 目录及其所有内容的所有权更改为用户 `linda`：\n\n```bash\nchown -R linda /home\n```\n\n###\
  \ 更改组所有权\n\n实际上有两种更改组所有权的方法。你可以使用 `chown` 来实现，但一个名为 `chgrp` 的特定命令也可以完成这项工作。如果你想使用\
  \ `chown` 命令，可以在组名前面加上 `.` 或 `:`。以下命令将目录 `/home/account` 的组所有者更改为组 `account`：\n\n\
  ```bash\nchown .account /home/account\n```\n\n你可以使用 `chown` 以多种方式更改用户和/或组所有权，概述如下：\n\
  \n![Image](img/squf.jpg) `chown lisa myfile` 将用户 `lisa` 设置为 `myfile` 的所有者\n\n![Image](img/squf.jpg)\
  \ `chown lisa.sales myfile` 将用户 `lisa` 设置为 `myfile` 的用户所有者并将组 `sales` 设置为组所有者\n\n\
  ![Image](img/squf.jpg) `chown lisa:sales myfile` 将用户 `lisa` 设置为 `myfile` 的用户所有者并将组\
  \ `sales` 设置为组所有者\n\n![Image](img/squf.jpg) `chown .sales myfile` 将组 `sales` 设置为\
  \ `myfile` 的组所有者，而不更改用户所有者\n\n![Image](img/squf.jpg) `chown :sales myfile` 将组 `sales`\
  \ 设置为 `myfile` 的组所有者，而不更改用户所有者\n\n你也可以使用 `chgrp` 命令来更改组所有权。考虑以下示例，你可以使用 `chgrp`\
  \ 将目录 `/home/account` 的组所有权设置为组 `account`：\n\n```bash\nchgrp account /home/account\n\
  ```\n\n与 `chown` 类似，你也可以在使用 `chgrp` 时使用 `-R` 选项来递归地更改组所有权。\n\n### 理解默认所有权\n\n你可能注意到，当用户创建文件时，会应用默认所有权。创建文件的用户会自动成为用户所有者，该用户的主组将自动成为组所有者。通常，这是在\
  \ `/etc/passwd` 文件中设置为用户主组的组。然而，如果用户是多个组的成员，他可以更改有效的主组。\n\n要显示当前有效的主组，用户可以使用 `groups`\
  \ 命令：\n\n点击此处查看代码图像\n\n```bash\n[root@server1 ~]# groups lisa\nlisa : lisa account\
  \ sales\n```\n\n如果当前用户 `linda` 想要更改有效的主组，她可以使用 `newgrp` 命令，后跟上她想要设置为新有效主组的组名。该组将继续被用有效主组，直到用户使用\
  \ `exit` 命令或注销。列表 7.2 显示了用户 `linda` 如何使用此命令将 `sales` 设置为她的有效主组。\n\n**列表 7.2** 使用\
  \ `newgrp` 更改有效主组\n\n点击此处查看代码图像\n\n```bash\n[lisa@server1 ~]$ groups\nlisa account\
  \ sales\n[lisa@server1 ~]$ newgrp sales\n[lisa@server1 ~]$ groups\nsales lisa account\n\
  [lisa@server1 ~]$ touch file1\n[lisa@server1 ~]$ ls -l\ntotal 0\n-rw-r--r--. 1 lisa\
  \ sales 0 Feb  6 10:06 file1\n```\n\n更改有效主组后，用户创建的所有新文件将以此组作为其组所有者。要返回原始主组设置，请使用\
  \ `exit`。\n\n为了能够使用 `newgrp` 命令，用户必须是该组的成员。或者，可以使用 `gpasswd` 命令设置组密码。如果用户使用 `newgrp`\
  \ 命令但不是目标组的成员，shell 会提示输入组密码。在输入正确的组密码后，将设置新的有效主组。\n\n### 管理基础权限\n\nLinux 权限系统发明于\
  \ 20 世纪 70 代。由于当年的计算需求有限，创建的基础权限系统相当有限。这个基础权限系统使用三种可以应用于文件和目录的权限。在本节中，你将学习系统是如何工作的以及如何修改这些权限。\n\
  \n### 理解读、写和执行权限\n\n这三种基本权限允许你读取、写入和执行文件。这些权限在应用于文件或目录时效果不同。如果应用于文件，读权限赋予你打开文件进行读取的权利。因此，你可以读取其内容，但也意味着你的计算机可以打开它。\n\
  \n\n\n\n```\nchmod 755 /somefile\n```\n\n当你以这种方式使用 `chmod` 时，所有当前权限都将被你设置的权限替换。如果你想相对于当前权限来修改权限，可以使用相对模式下的\
  \ `chmod`。在相对模式下使用 `chmod` 时，你通过三个指标来指定你想要执行的操作：\n\n![Image](img/squf.jpg) 第一，你指定你想为谁更改权限。为了做到这一点，你可以在用户\
  \ (`u`)、组 (`g`) 和其他用户 (`o`) 之间进行进行选择。\n\n![Image](img/squf.jpg) 其次，你使用操作符从当前模式中添加或删除权限，或者以绝对的方式设置它们。\n\
  \n![Image](img/squf.jpg) 最后，你使用 `r`、`w` 和 `x` 来指定你想要设置的权限。\n\n在相对模式下更改权限时，你可以省略“针对谁”部分，为所有实体添加或删除权限。例如，以下命令为所有用户添加执行权限：\n\
  \n```bash\nchmod +x somefile\n```\n\n在相对模式下工作时，你也可以使用更复杂的命令。例如，以下命令为组添加写权限并移除其他用户的读权限：\n\
  \n```bash\nchmod g+w,o-r somefile\n```\n\n***\n\n### 提示\n\n在使用 `chmod -R o+rx /data`\
  \ 时，你为 `/data` 目录下的所有目录和文件设置了执行权限。如果只想对目录设置执行权限而不影响文件，请使用 `chmod -R o+rX /data`。大写的\
  \ `X` 确保除非文件已经为某些实体设置了执行权限，否则文件不会获得执行权限。这使得 `X` 是处理执行权限更智能的方法；它会避免在不需要的文件上设置该权限。\n\
  \n***\n\n### 练习 7.1 管理基础权限在此练习中，你为你之前创建的组创建一个目录结构。你还将为这些目录分配正确的权限。\n\n1. 从 root\
  \ shell，输入 `mkdir -p /data/sales /data/account`。\n\n2. 在设置权限之前，使用 `chown linda.sales\
  \ /data/sales` 和 `chown linda.account /data/account` 更改这些目录的所有者。\n\n3. 设置权限允许用户和组所有者向这些目录写入文件，并拒绝所有其他人的访问：`chmod\
  \ 770 /data/sales`，接着执行 `chmod 770 /data/account`。\n\n4. 使用 `su - lisa` 变成 lisa\
  \ 并进入目录 `/data/account`。使用 `touch emptyfile` 在此目录下创建一个文件。此操作有效吗？\n\n5. 仍然以 lisa\
  \ 的身份，使用 `cd /data/sales` 并使用 `touch emptyfile` 在此目录下创建一个文件。此操作有效吗？\n\n***\n\n####\
  \ 管理高级权限\n\n除了刚刚读到的基础权限外，Linux 还有一组高级权限。这些不是你默认会设置的权限，但它们有时会提供非常有用的补充。在本节中，你将学习它们是什么以及如何设置它们。\n\
  \n#### 理解高级权限\n\n有三种高级权限。第一个是设置用户 ID (SUID) 权限。在某些非常特殊的情况下，你可能希望将此权限应用到可执行文件。默认情况下，运行可执行文件的用户将以自己的权限运行该文件。对于普通用户，这通常意味着对程序的使用受到限制。但在某些情况下，用户仅为了特定任务的执行就需要特殊权限。\n\
  \n例如，考虑用户需要更改密码的情况。为了做到这一点，用户需要将他的新密码写入 `/etc/shadow` 文件。然而，对于没有 root 权限的用户来说，该文件是不可写的：\n\
  \n点击此处查看代码图片\n\n```bash\nroot@hnl ~]# ls -l /etc/shadow\n----------. 1 root root\
  \ 1184 Apr 30 16:54 /etc/shadow\n```\n\nSUID 权限为这个问题提供了解决方案。在 `/usr/bin/passwd`\
  \ 工具上，默认应用了此权限。这使得用户在更改密码时，临时拥有 root 权限，从而允许他写入 `/etc/shadow` 文件。你可以通过 `ls -l` 看到\
  \ SUID 权限，它在通常预期看到用户权限的 `x` 的位置显示为 `s`：\n\n点击此处查看代码图片\n\n```bash\nroot@hnl ~]# ls\
  \ -l /usr/bin/passwd\n-rwsr-xr-x. 1 root root 32680 Jan 28  2010 /usr/bin/passwd\n\
  ```\n\nSUID 权限看起来很有用（在某些情况下确实如此），但同时也具有潜在的危险性。如果应用错误，你可能会无意中赋予 root 权限。因此，我建议仅在极其谨慎的情况下使用它。大多数管理员永远不需要使用它；你只会在操作系统需要将其设置为默认值的某些文件上看到它。\n\
  \n第二个特殊权限是设置组 ID (SGID)。此权限有两个效果。如果应用在可执行文件上，它赋予执行该文件的用户以该文件组所有者的权限。因此，SGID 可以完成与\
  \ SUID 类似的事情。然而，出于此目的，SGID 很少被使用。与 SUID 一样，SGID 被应用于操作系统需要将其设置为默认值的文件。\n\n当应用到目录时，SGID\
  \ 可能会很有用，因为你可以使用它来设置创建的文件和子目录的组所有权。这并不总是非常有用，特别是对于是该组唯一成员的用户。默认情况下，当用户创建文件时，其有效组被设置为该组。在共享组环境中，默认情况下，用户创建的文件将与其所属的组共享。\n\
  \n想象一下 linda 和 lisa 都在会计部工作并且都是会计组的成员的情况。默认情况下，这些用户是他们私人组的唯一成员。然而，他们也是会计组的成员。\n\n\
  如果没有粘滞位（sticky bit），如果一个用户可以在某个目录中创建文件，他也可以删除该目录中的文件。在共享组环境中，这可能会令人困扰。再次想象 linda\
  \ 和 lisa。如果没有粘滞位，默认情况是当这些用户中的一个创建一个文件时，该组成为所有者。因此，默认情况下 linda 无法删除 lisa 创建的文件，反之亦然。然而，如果你创建一个共享组目录（例如\
  \ `/groups/account`）并确保该目录应用了 SGID 权限，并将会计组设置为该目录的组所有者，在该目录下创建的所有文件及其子目录都将获得会计组作为默认组所有者。由于由于原因，SGID\
  \ 权限是共享组上是非常用的权限。\n\nSGID 权限在 `ls -l` 的输出中显示为 `s`，位于你通常找到组执行权限的位置：\n\n点击此处查看代码图片\n\
  \n```bash\nroot@hnl data]# ls -ld account\ndrwxr-sr-x. 2 root account 4096 Apr 30\
  \ 21:28 account\n```\n\n第三种特殊权限是粘滞位（sticky bit）。此权限对于在多个用户在同一目录中具有写入权限的环境中防止文件被意外删除有用。如果应用了粘滞位，用户只有当他是文件的所有者或包含该文件的目录的所有者时才能删除该文件。由于由于原因，它被默认应用于\
  \ `/tmp` 目录，在共享组网上也可能有用。\n\n当你应用粘滞位时，用户只有在满足以下任一条件时才能删除文件：\n\n\n\n\n\n![Image](img/squf.jpg)\
  \ 用户是文件的所有者。\n\n![Image](img/squf.jpg) 用户是文件所在目录的所有者。\n\n当使用 `ls -l` 时，你可以在通常查看其他用户执行权限的位置看到\
  \ `t`，表示粘滞位（sticky bit）：\n\n点击此处查看代码图片\n\n```\n[root@hnl data]# ls -ld account/\n\
  drwxr-sr-t. 2 root account 4096 Apr 30 21:28 account/\n```\n\n* * *\n\n### 提示\n\n\
  请确保你了解如何管理这些高级权限。RHCSA 目标特别提到，你需要能够使用 set GID 来创建一个共享组目录。\n\n* * *\n\n### 应用高级权限\n\
  \n要应用 SUID、SGID 和粘滞位，同样可以使用 `chmod`。SUID 的数值值为 4，SGID 的数值值为 2，而粘滞位的数值值为 1。如果你想应用这些权限，需要为\
  \ `chmod` 添加一个四位参数，其中第一位数字指的是特殊权限。例如，以下行将为目录添加 SGID 权限，并为用户设置 rwx，为组和其他用户设置 rx：\n\
  \n```\nchmod 2755 /somedir\n```\n\n如果在以绝对模式下使用 `chmod` 之前必须查找当前设置的权限，那是相当不实际的。（因为如果不这样做，你会有覆盖权限的风险）。因此，如果你需要应用任何特殊权限，我建议使用相对模式：\n\
  \n![Image](img/squf.jpg) 对于 SUID，使用 `chmod u+s`。\n\n![Image](img/squf.jpg) 对于 SGID，使用\
  \ `chmod g+s`。\n\n![Image](img/squf.jpg) 对于粘滞位，使用 `chmod +t`，随后加上你想要设置权限的文件或目录名称。\n\
  \n表 7.4 总结了管理特殊权限需要了解的所有知识。\n\n![Image](img/key_topic.jpg)![Image](img/07tab04.jpg)\n\
  \n**表 7.4** 使用 SUID、SGID 和粘滞位\n\n* * *\n\n### 练习 7.2 使用特殊权限\n\n在此练习中，你将使用特殊权限让组内成员更容易在共享组目录中共享文件。你将分配设置组\
  \ ID（setGID）位以及粘滞位，并发现设置这些位后，增加了一些功能，使得组成员更容易协作工作。\n\n**1.** 打开一个终端，你的用户身份为 linda。\n\
  \n**2.** 使用 `cd /data/sales` 进入 sales 目录。使用 `touch linda1` 和 `touch linda2` 创建两个由\
  \ linda 为所有者的文件。\n\n**3.** 使用 `su - lisa` 将当前用户身份切换为用户 lisa，她也是 sales 组的成员。\n\n\
  **4.** 使用 `cd /data/sales` 并在该目录下执行 `ls -l`。你会看到两个由用户 linda 创建的文件，它们的所有所有者是 linda\
  \ 组。使用 `rm -f linda*`。这将删除两个文件。\n\n**5.** 使用命令 `touch lisa1` 和 `touch lisa2` 创建两个由用户\
  \ lisa 拥的文件。\n\n**6.** 使用 `su -` 将你的当前权限提升到 root 级。\n\n**7.** 使用 `chmod g+s,o+t\
  \ /data/sales` 为共享组目录设置组 ID 位和粘滞位。\n\n**8.** 使用 `su - linda`。首先使用 `touch linda3`\
  \ 和 `touch linda4`。你现在应该发现你创建的两个文件属于 sales 组，而该组是 `/data/sales` 目录的所有组。\n\n**9.**\
  \ 使用 `rm -rf lisa*`。粘滞位阻止了用户 linda 删除这些文件，因为你不是这些文件的所有者。注意，如果用户 linda 是 `/data/sales`\
  \ 的目录所有者，她仍然可以删除这些文件！\n\n* * *\n\n### 管理 ACL\n\n即使上一节讨论的高级权限为 Linux 的权限工作机制增加了有用功能，但它并不允许你对同一个文件给多一个用户或多个组设置权限。访问控制列表（ACL）提供了这一功能。此外，它们还允许管理员以一种复杂的方式设置默认权限，使得不同目录设置的权限可以有所不同。\n\
  \n#### 理解 ACL\n\n虽然 ACL 子系统为你的服务器增加了强大的功能，但存在一个缺点：并不是所有的实用程序都支持它。因此，在复制或移动文件时可能会丢失\
  \ ACL 设置，你的备份软件可能无法备份 ACL 设置。\n\n`tar` 实用程序不支持 ACL。为了确保在备份时不会丢失 ACL 设置，请使用 `star`\
  \ 代替 `tar`。`star` 的选项与 `tar` 完全相同，它只是增加了对 ACL 设置的支持。\n\n* * *\n\n### 提示\n\n你也可以使用\
  \ `getfacl` 创建 ACL 备份，并通过 `setfacl` 命令进行恢复。创建备份使用 `getfacl -R /directory > file.acls`。从备份文件恢复设置使用\
  \ `setfacl --restore=file.acl`。\n\n* * *\n\n虽然某些工具不支持，但这并不是大问题。ACL 经常被应用于目录作为一种结构性措施。\n\
  \n#### 为文件系统准备 ACL\n\n虽然某些工具不支持，但这并不是大问题。ACL 经常被应用于目录作为一种结构性措施。要使用 ACL，你可能需要准备你的文件系统。如果你收到“不支持的操作”的消息，可能需要使用\
  \ `acl` 选项挂载文件系统。\n\n\n\n\n\n## group: root\n\n`user::rwx`\n\n`group::r-x`\n\n`group:sales:r-x`\n\
  \n`mask::r-x`\n\n`other::r-x`\n\n\n\n现在你已经理解了如何设置组 ACL，那么理解用户和其他人的 ACL 也变得简单了。例如，命令\
  \ `setfacl -m u:linda:rwx /data` 赋予用户 `linda` 拥有对 `/data` 目录的权限，但不会让她成为所有者，也不会更改当前的所有者分配。\n\
  \n`setfacl` 命令有许多种可能的用法和选项。其中一个选项 `-R` 特别重要。如果使用该选项，它将对你设置 ACL 的目标目录中当前存在的所有文件和子目录进行\
  \ ACL 设置。在更改现有目录的 ACL 时，始终使用此选项是一个好主意。\n\n## 使用默认 ACL (Default ACLs)\n\n使用 ACL 的一个好处是，你可以为目录的多个用户或组赋予权限。另一个好处是，你可以通过使用默认\
  \ ACL 来启用继承。通过设置默认 ACL，你将决定在目录中创建的所有新项目将设置的权限。但请注意，默认 ACL 不更改现有文件和子目录的权限。要同时更改这些权限，你还需要添加普通\
  \ ACL！\n\n**提示**\n\n这一点很重要。如果你想使用 ACL 为同一个目录配置多个用户或组的访问权限，你必须设置两次 ACL。首先，使用 `setfacl\
  \ -R -m` 修改当前文件的 ACL。然后，使用 `setfacl -m d:` 来处理所有也将将创建的新项目。\n\n\n\n要设置默认 ACL，你只需要在选项\
  \ `-m` 之后添加选项 `d`（顺序很重要！）。因此，如果你想让组 `sales` 对 `/data` 目录中以后创建的所有内容都具有读取和执行权限，请使用\
  \ `setfacl -m d:g:sales:rx /data`。\n\n在使用默认 ACL 时，为其他人设置 ACL 也会很有用。通常情况下这没什么意义，因为你也可以通过\
  \ `chmod` 更改其他人的权限。然而，你无法使用 `chmod` 为以后可能创建的每一个新文件指定应给其他人的权限。例如，如果你不想让其他人对 `/data`\
  \ 中创建的任何内容获得任何权限，请使用 `setfacl -m d:o::- /data`。\n\n**提示**\n\nACL 和普通权限并不总是整合得很好。如果你对一个目录应用了默认\
  \ ACL，之后向该目录添加了项目并下次尝试更改普通权限，可能会出现问题。应用到普通权限的更改将无法很好反映在 ACL 概述中。为了避免问题，请先设置普通权限，然后再设置默认\
  \ ACL（在此之后，尽量不要再次更改它们）。\n\n \n\n## 练习 7.3 使用 ACL 管理高级权限\n\n在本次练习中，你对之前创建的 `/data/account`\
  \ 和 `/data/sales` 目录进行进一步操作。在早期的练习中，你确保了 `sales` 组拥有 `/data/sales` 的权限，并且 `account`\
  \ 组拥有 `/data/account` 的权限。到目前为止，你还没有升级设计，而你将在本次练习中完成这一点。首先，确保 `account` 组获得 `/data/sales`\
  \ 目录的读取权限，`sales` 组获得 `/data/account` 目录的读取权限。然后，你设置默认 ACL，以确保所有新文件的权限对所有新项目都正确设置。\n\
  \n1. 打开 root 终端。\n\n2. 使用 `setfacl -m g:account:rx /data/sales` 和 `setfacl -m g:sales:rx\
  \ /data/account`。\n\n3. 使用 `getfacl` 验证权限已按照你的预期进行设置。\n\n4. 使用 `setfacl -m d:g:account:rwx,g:sales:rx\
  \ /data/sales` 为 `sales` 目录设置默认 ACL。\n\n5. 使用 `setfacl -m d:g:sales:rwx,g:account:rx\
  \ /data/account` 为 `/data/account` 目录添加默认 ACL。\n\n6. 通过在 `/data/sales` 中添加新文件来验证\
  \ ACL 设置是否生效。使用 `touch /data/sales/newfile` 并使用 `getfacl /data/sales/newfile` 检查当前的权限分配。\n\
  \n \n\n## 使用 umask 设置默认权限\n\n在关于 ACL 的章节中，你学习了如何使用默认 ACL。如果你不使用 ACL，有一个 shell 设置决定了你将获得的默认权限：即\
  \ umask。在本节中，你将学习如何使用 `umask` 修改默认权限。\n\n你可能已经注意到，在创建新文件时会设置某些默认权限。这些权限是由 `umask`\
  \ 设置的。此 shell 设置在用户登录系统时应用到所有用户。在 `umask` 设置中，使用一个数值从可以自动设置文件的最大权限中减去该值；文件的最大设置为\
  \ `666`，目录的最大设置为 `777`。然而，该规则存在某些例外。你可以在 表 7.5 中找到 `umask` 设置的完整概述。\n\n![Image](img/key_topic.jpg)![Image](img/07tab05)\n\
  \n**表 7.5 umask 数值及其结果**\n\nACL 和普通权限并不总是整合得很好。如果你对一个目录应用了默认 ACL，之后向该目录添加了项目并下次尝试更改普通权限，可能会出现问题。应用到普通权限的更改将无法很好反映在\
  \ ACL 概述中。为了避免问题，请先设置普通权限，然后再设置默认 ACL（在此之后，尽量不要再次更改它们）。\n\n \n\n## 使用用户扩展属性 (User\
  \ Extended Attributes)\n\n当你处理权限时，用户或组对象与它们对文件或目录的权限之间始终存在关系。保护 Linux 服务器文件的另一种安全方法是使用属性。属性无论访问文件的用户如何都会起作用。\n\
  \n就像 ACL 一样，文件属性可能需要启用一个挂载选项。这就是 `user_xattr` 选项。如果你在处理用户扩展属性时遇到操作不支持的消息，请确保在 `/etc/fstab`\
  \ 中设置了此挂载选项。\n\n许多属性都有文档记录。某些属性可用但尚未实现。不要使用它们；它们无法带给你任何好处。以下是你可以应用的最常用的属性：\n\n\n\
  \n\n\n![Image](img/squf.jpg) `A` 此属性确保文件的访问时间不被修改。通常情况下，每当打开文件时，文件的访问时间都必须写入文件的元数据中。这会对性能产生负面影响；因此，对于经常访问的文件，可以使用\
  \ `A` 属性来禁用此功能。\n\n![Image](img/squf.jpg) `a` 此属性允许文件被添加到目录中，但不能被从目录移除。\n\n![Image](img/squf.jpg)\
  \ `c` 如果你正在使用支持卷级压缩的文件系统，此文件属性可确保在压缩引擎首次激活时对该文件进行压缩。\n\n![Image](img/squf.jpg) `D`\
  \ 此属性确保文件的更改立即写入磁盘，而不是先写入缓存。这对于重要的数据库文件来说，这是一个非常有用的属性，可以确保数据不会在文件缓存和硬硬盘之间丢失。\n\n\
  ![Image](img/squf.jpg) `d` 此属性确保文件在使用 dump 工具的备份中不会被备份。\n\n![Image](img/squf.jpg)\
  \ `I` 此属性为为其启用的目录开启索引。这可以为像 Ext3 这样不使用 B-tree 数据库快速访问文件的原始文件系统提供更快的文件访问。\n\n![Image](img/squf.jpg)\
  \ `i` 此属性使文件变为不可变。因此，无法对文件进行任何更改，这对于需要额外保护的文件来说非常有用。\n\n![Image](img/squf.jpg) `j`\
  \ 此属性确保在 ext3 文件系统上，文件首先写入日志，只有之后才写入硬盘上的数据块。\n\n![Image](img/squf.jpg) `s` 在文件删除后，用\
  \ 0 覆盖存储该文件的数据块。这确保了文件在被删除后无法被恢复。\n\n![Image](img/squf.jpg) `u` 此属性保存未删除信息。这允许开发一种实用程序，利用这些信息来救回已删除的文件。\n\
  \n***\n\n### 注意事项\n\n尽管有很多属性可以使用，但请注意，大多数属性仍然是实验性的，只有当使用了能够处理给定属性的应用程序时，它们才有用。例如，如果没有开发出可以使用此\
  \ `u` 属性恢复已删除文件的应用程序，那么应用 `u` 属性是没有意义的。\n\n***\n\n如果你想应用属性，可以使用 `chattr` 命令。例如，使用\
  \ `chattr +s somefile` 将属性应用到 somefile。需要再次移除属性吗？那么使用 `chattr -s somefile` 即可将其移除。要获取当前应用的所有属性的概览，请使用\
  \ `lsattr` 命令。\n\n#### 总结\n\n在本章中，你学习了如何操作权限。你阅读了三种基本权限、高级权限以及如何在文件系统上应用 ACL（访问控制列表）。你还学习了如何使用\
  \ `umask` 设置来应用默认权限。在本章的末尾，你学习了如何使用用户扩展属性来应用额外的文件系统安全层。\n\n### 考试准备任务\n\n#### 回顾所有关键主题\n\
