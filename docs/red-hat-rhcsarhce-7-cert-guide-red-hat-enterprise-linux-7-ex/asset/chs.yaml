  \n#### 进程管理简介\n\n对于 Linux 服务器上发生的一切事情，进程 都是启动的。因此，进程管理是管理员必须掌握的关键技能之一。为了高效地做到这一点，了解你正在处理什么种类型的进程非常重要![Image](img/squf.jpg)\
  \ Shell 作业是从命令行启动的命令。它们与启动它们的 shell 相关。守护进程 (daemons) 是提供服务的进程。它们通常在计算机启动时启动，并且并非在所有情况下都以\
  \ root 权限运行。当进程启动时，它可以使用多个线程。线程是进程启动的任务，专门的 CPU 可以处理它。线程管理应该在命令行中进行。\n\n#### 管理\
  \ Shell 作业\n\n当用户输入命令时，会启动一个 shell 作业。如果没有采取特殊措施，该作业将作为前台](#gloss01.html_98) 进程启动，占据它启动的终端，直到完成工作。作为\
  \ Linux 管理员，你需要知道如何在前台或后台启动 shell 作业。\n\n##### 在前台和后台运行作业\n\n默认情况下，任何执行的命令都作为前台作业启动。对于许多命令来说，这并不重要，因为命令通常需要一段时间才能完成，之后它会将访问权返回给它的\
  \ shell。有时，在后台启动命令可能是非常有用的。这对于不需要用户交互的进程是合理的。需要用户交互的进程在后台运行时无法获得这些交互，因此在被移动到后台时通常会停滞。你可以通过两种不同的方法在后台运行进程。\n\
  \n如果你知道某个作业需要很长时间才能完成，可以在它后面加一个 `&`。这会让该作业立即在后台启动，为从命令行启动其他任务腾出空间。要将上一个在后台启动的作业移回前台，请使用\
  \ `fg` 命令。该命令会立即且没有任何进一步提问地将最后一个作业带回前台。\n\n\n\n\n\n有时启动的任务耗时可能比预测的要（很多）得多。如果发生这种情况，你可以使用\
  \ `Ctrl+Z` 临时停止任务。这并不会从内存中移除该任务；它只是暂停任务以便对其进行管理。一旦暂停，可以使用 `bg` 命令将其作为后台任务继续运行。你可以用于管理\
  \ shell 任务的替代按键序列是 `Ctrl+C`。这会停止当前任务并将其从内存中移除。\n\n另一个相关的组合键是 `Ctrl+D`，它向当前任务发送文件结束符（EOF）字符。结果是任务将停止等待进一步输入，以便完成它当前正在的操作。发送\
  \ `Ctrl+D` 的结果有时与发送 `Ctrl+C` 的结果非常相似，但存在区别。当使用 `Ctrl+C` 时，任务直接被取消，没有任何内容能被正常关闭。当使用\
  \ `Ctrl+D` 时，任务停止等待进一步输入，这通常正是以妥的方式完成任务所需要的。\n\n## 管理 shell 任务\n\n在任务的前台和后台之间移动任务时，拥有所有当前任务的概览可能会很有用。要获取此类概览，请使用\
  \ `jobs` 命令。如表 9.2 (ch09.html_ch09tab02) 所示，该命令提供了所有当前作为后台运行的任务的概览，包括在后台启动任务时分配给任务的任务号。这些任务号可以作为\
  \ `fg` 和 `bg` 命令的参数来执行任务管理操作。在练习 9.1 (ch09.html_ch09exer01) 中，你将学习如何从 shell 执行常见的任务管理操作。\n\
  \n![Image](img/key_topic.jpg)![Image](img/09tab02.jpg)\n\n**表 9.2** 任务管理概览\n\n*\
  \ * *\n\n* *\n\n练习 9.1 管理任务\n\n在此练习中，你将应用刚刚学命令来管理从当前 shell 启动的任务。\n\n1. 打开一个 root\
  \ shell 并输入以下命令：\n\n点击此处查看代码图像\n\n```\nsleep 3600 &\ndd if=/dev/zero of=/dev/null\
  \ &\nsleep 7200\n```\n\n2. 因为你在启动最后一个命令时在命令后没有加 `&`，所以必须等待 2 小时才能重新获得 shell 的控制。输入\
  \ `Ctrl+Z` 停止它。\n\n3. 输入 `jobs`。你会看到刚刚启动三个任务。前两个处于 Running（运行）状态，最后一个任务目前处于 Stopped（停止）状态。\n\
  \n4. 输入 `bg 3` 在后台继续运行任务 3。注意，因为它是作为最后一个任务启动的，所以你并不真的需要添加数字 3。\n\n5. 输入 `fg 1` 将任务\
  \ 1 移动到前台。\n\n6. 输入 `Ctrl+C` 取消 1 号任务，并使用 `jobs` 确认它已消失。\n\n7. 使用相同的方法取消任务 2 和 3。\n\
  \n8. 在你的服务器上打开第二个终端。\n\n9. 从该第二个终端，输入 `dd if=/dev/zero of=/dev/null &`。\n\n10. 输入\
  \ `exit` 关闭第二个终端。\n\n11. 从另一个终端启动 `top`。你会发现 `dd` 任务仍在运行。在 `top` 中，使用 `k` 杀死 dd\
  \ 任务。\n\n* * *\n\n* * *\n\n注意\n\n你在本节中学习了如何管理交互式 shell 任务。注意，所有这些任务也是进程。作为启动任务的用户，你也可以管理它。在下一节中，你将学习如何使用进程管理来管理由其他用户启动的任务。\n\
  \n* * *\n\n## 管理父子关系\n\n从 shell 启动进程时，它就成为该 shell 的子进程。在进程管理中，进程之间的父子关系非常重要。需要父进程来管理子进程。因此，当\
  \ shell 停止时，所有从该 shell 启动的进程都会终止。这提供了一种终止不再需要的进程的简单方法。\n\n在后台启动的进程不会在其父 shell 时被杀死。要杀死这些进程，你需要使用本章稍后描述的\
  \ `kill` 命令。\n\n* * *\n\n注意\n\n在 bash shell 的早期版本中，后台进程在启动它们的 shell 终止时也会被杀死。为了防止这种情况，可以在进程前加上\
  \ `nohup` 命令来启动。在 RHEL 7 中，不再需要为此目的使用 `nohup`。\n\n* * *\n\n### 使用常用的命令行工具进行进程管理\n\
  \n在 Linux 服务器上，通常有许多进程在运行。在普通的服务器或桌面电脑上，通常有超过一百个活跃进程。由于有这么多活跃进程，可能会出现问题。如果发生这种情况，了解如何停止非交互式进程，或者如何调整这些进程的优先级以为其他进程释放更多系统资源将是非常好的。\n\
  \n### 理解进程和线程\n\nLinux 上的任务通常作为进程启动。一个进程可以启动多个工作线程。使用线程是有意义的，因为如果进程非常忙，线程可以由机器上不同的\
  \ CPU 或 CPU 核心处理。作为 Linux 管理员，你不能管理单个线程；但你可以管理进程。必须由多线程应用程序的程序员来定义线程之间如何相互关联。\n\n\
  在讨论不同的进程管理方法之前，最好知道 Linux 有两种类型的后台进程。其中一种是内核线程，每个内核线程都有自己的进程 ID（PID）。在管理进程时，很容易识别出内核线程，因为它们的名称位于方括号\
  \ `[]` 中。列表 9.1 (ch09.html_ch09ex01) 显示了 `ps aux` 输出的几个进程，在其中你可以看到一些内核线程。\n\n作为管理员，重要的是知道内核线程是无法管理的。你无法调整它们的优先级；除非关掉整台机器，否则无法杀死它们。\n\
  \n**列表 9.1** 使用 `ps aux` 显示内核线程\n\n点击此处查看代码图像\n\n```\n[root@server]# ps aux | head\n\
  USER       PID %CPU %MEM    VIZ TTY      START   TIME COMMAND\nroot         1  0.0\
