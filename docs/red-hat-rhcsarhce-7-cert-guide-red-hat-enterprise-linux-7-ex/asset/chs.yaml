  : [\n            {\n              \"attributes\": {\n                \"data_timeout\"\
  : 3,\n                \"data_timeout_retries\": 5,\n                \"default_er\"\
  : 0,\n                \"n_response_timeout\": 30,\n                \"n_timeout\"\
  : 15,\n                \"random_datain_pdu_offsets\": 0,\n                \"random_datain_seq_offsets\"\
  : 0,\n                \"random_r2t_offsets\": 0\n              },\n            \
  \  \"mapped_luns\": [\n                {\n                  \"index\": 2,\n    \
  \              \"tpg_lun\": 2,\n                  \"write_protect\": false\n   \
  \             },\n                {\n                  \"index\": 1,\n         \
  \         \"tpg_lun\": 1,\n                  \"write_protect\": false\n        \
  \        },\n                {\n                  \"index\": 0,\n              \
  \    \"tpg_lun\": 0,\n                  \"write_protect\": false\n             \
  \   }\n              ]\n            }\n          ],\n          \"wn\": \"iqn.2015-04.com.server2\"\
  \n        }\n      ]\n    }\n  ]\n}\n```\n\n\n\n\n既然 iSCSI 目标端已经配置完成，你需要确保可以通过防火墙访问，并且该服务会自动启动。首先，输入\
  \ `systemctl enable target; systemctl start target`。要打开防火墙中的 3260 端口，请输入 `firewall-cmd\
  \ --add-port=3260/tcp --permanent; firewall-cmd --reload`。运行 iSCSI 目标端不需要进一步的操作。你可以在练习\
  \ 26.2 中练习这些命令。\n\n***\n\n## 练习 26.2 完成 iSCSI 目标端配置\n\n1. 在 server1 上，输入 `systemctl\
  \ start target` 然后输入 `systemctl enable target`。\n\n2. 输入 `systemctl status target`\
  \ 并验证目标端当前处于激活状态（active），且状态设置为启用（enabled）（参见列表 26.2）。\n\n**列表 26.2** 确保服务处于激活并启用状态\n\
  \n点击此处查看代码图像\n\n***\n\n```\n[root@server1 ~]# systemctl enable target; systemctl\
  \ start target\n\nln -s '/usr/lib/systemd/system/target.service' '/etc/systemd/system/\n\
  \    multi-user.target.wants/target.service'\n\n[root@server1 ~]# systemctl status\
  \ target\n\ntarget.service - Restore LIO kernel target configuration\n\n    Loaded:\
  \ loaded (/usr/lib/systemd/system/target.service; enabled)\n    Active: active (exited)\
  \ since Sun 2014-11-09 05:24:24 EST;\n    2min 20s ago\n    Process: 45549 ExecStart=/usr/bin/targetctl\
  \ restore (code=exited,\n    status=0/SUCCESS)\n    Main PID: 45549 (code=exited,\
  \ status=0/SUCCESS)\nNov 09 05:24:24 server1.example.com systemd[1]: Started Restore\
  \ LIO\n  kernel target configuration.\n```\n\n***\n\n3. 使用 `firewall-cmd --add-port=3260/tcp\
  \ --permanent` 打开防火墙，然后执行 `firewall-cmd --reload`。\n\n4. 输入 `firewall-cmd --list-all`\
  \ 验证防火墙配置。结果应该像列表 26.3 所示。\n\n**列表 26.3** 验证防火墙配置\n\n点击此处查看代码图像\n\n***\n\n```\n\
  [root@server1 ~]# firewall-cmd --list-all\n\npublic (default, active)\n  interfaces:\
  \ eno16777736\n  sources:\n  services: dhcpv6-client ssh\n  ports: 3260/tcp\n  masquerade:\
  \ no\n  forward-ports:\n  icmp-blocks:\n  rich rules:\n```\n\n***\n\n***\n\n## 设置\
  \ iSCSI 启动器 (Initiator)\n\n现在 iSCSI 目标服务器已经配置并运行，你可以进入下一步配置 iSCSI 启动器。你可以将其视为 iSCSI\
  \ 客户端，因为它将请求访问 iSCSI 目标服务器提供的存储。要做到此，你需要经过以下步骤：\n\n1. 设置 iSCSI initiatorname。\n\
  2. 使用 `iscsiadm` 发现可用的目标。\n3. 使用 `iscsiadm` 登录目标。\n\n### 设置 iSCSI initiatorname\n\
  \n对 iSCSI 目标的访问基于 initiatorname。initiatorname 在安装了 `iscsi-initiator-utils` RPM 软件包的\
  \ iSCSI 节点上进行配置。initiatorname 存储在文件 `/etc/iscsi/initiatorname.iscsi` 中。\n\n在安装 `iscsi-initiator-utils`\
  \ 包后，你的节点将拥有一个基于 Red Hat IQN 并用作 UUID 号的默认 initiatorname。它看起来可能像 `InitiatorName=iqn.1994-05.com.redhat:76f76a97c56e224\\\
  .`。使用这个默认 initiatorname 没有问题，除非它难以易读。这就是为什么你可能考虑使用一个更易读的 initiatorname，例如 `iqn.2015-04.com.example:server1`。\n\
  \n在手动设置 initiatorname 时，请确保遵守语法限制。`Initiatornames` 必须以 `iqn` 开头，后跟四位数的年份，然后是两位数的月份和你的域名的反向\
  \ DNS 名称，最后是启动器的唯一标识符。\n\n更改 iSCSI initiatorname 后，不要忘记使用 `systemctl restart iscsid`\
  \ 重启 `iscsid` 服务！\n\n***\n\n**提示**：注意 iSCSI 启动器需要两个服务。`iscsid` 服务是访问所有相关配置文件的主服务。`iscsi`\
  \ 服务是建立 iSCSI 连接的服务。\n\n***\n\n### 执行发现 (Discovery)\n\n要连接到 iSCSI SAN，首先要探索哪些可用可用。`iscsiadm`\
  \ 命令有不同的模式，在发现模式下，该命令会显示可用的连接。在使用 iSCSI 发现时，你需要三个不同的参数：\n\n![Image](img/squf.jpg)\
  \ `--type sendtargets` 这告诉发现模式如何找到 iSCSI 目标。在某些配置中，可以配置 iSNS 服务来简化发现，但设置 iSNS 并不是\
  \ RHCE 的要求。因此，你将使用 `--type sendtargets` 找到你需要的目标。\n\n![Image](img/squf.jpg) `--portal`\
  \ 此参数告诉 `iscsiadm` 命令要向哪个 IP 地址和端口执行发现。你可以使用 IP 地址或节点名称作为参数，并且可以可选指定端口。如果未指定端口，则使用默认端口\
  \ 3260。\n\n![Image](img/squf.jpg) `--discover` 此参数告诉 `iscsid` 服务执行发现。\n\n使用这些命令参数，你可以通过以下命令执行\
  \ iSCSI 发现：\n\n点击此处查看代码图像\n\n```\niscsiadm --mode discovery --type sendtargets --portal\
  \ 192.168.4.210 --discover\n```\n\n注意，除了 `--mode discovery` 选项外，你也可以使用 `--mode discoverydb`。这种发现模式使用数据库并允许使用一些额外的命令。对于\
  \ RHCE 目标，你可以认为 `discovery` 和 `discoverydb` 模式在程度上是等同的。\n\n成功发现后，你可以使用 `-P` 选项请求有关所发现目标的更多信息。此选项可用于任何\
  \ iscsiadm 模式，它将显示有关当前模式的详情。在所有模式下，都支持打印级别 0 和 1。在某些模式下，你可以进一步显示更多额外的信息。列表 26.4\
  \ 显示了 `iscsiadm --mode discovery -P 1` 命令的结果。\n\n**列表 26.4** 显示 iSCSI 发现详情\n\n点击此处查看代码图像\n\
  \n***\n\n```\n[root@server2 ~]# iscsiadm --mode discovery -P 1\n\nSENDTARGETS:\n\
  DiscoveryAddress: 192.168.4.210,3260\nTarget: iqn.2014-11.com.example.target1\n\
  \    Portal: 192.168.4.210:3260,1\n    Iface Name: default\niSNS:\nNo targets found.\n\
  STATIC:\nNo targets found.\nFIRMWARE:\nNo targets found.\n\n[root@server2 ~]# man\
  \ iscsiadm\n[root@server2 ~]# iscsiadm --mode discovery -P 1\n\nSENDTARGETS:\nDiscoveryAddress:\
  \ 192.168.4.210,3260\nTarget: iqn.2014-11.com.example.target1\n    Portal: 192.168.4.210:3260,1\n\
  \    Iface Name: default\niSNS:\nNo targets found.\nSTATIC:\nNo targets found.\n\
  FIRMWARE:\nNo targets found.\n```\n\n***\n\n#### 建立连接\n\n根据执行 iSCSI 发现时找到名称，并假设你正确设置了\
  \ initiatorname，你现在可以登录 iSCSI 目标并建立实际连接。要做到此，请使用如下所示的命令：\n\n点击此处查看代码图像\n\n```\n\
  iscsiadm --mode node --targetname iqn.2014-11.com.exaple:target1 --portal 192.168.4.21-:3260\
  \ --login\n```\n\n在此命令中，使用了几个选项：\n\n![Image](img/squf.jpg) `--mode node` 此指定 iscsiadm\
  \ 进入“node”模式。这是可以与目标建立实际连接的模式。\n\n![Image](img/squf.jpg) `--targetname` 此指定在使用 iSCSI\
  \ 发现过程时发现的目标名称。\n\n![Image](img/squf.jpg) `--portal` 这是目标监听的 IP 地址和端口。\n\n![Image](img/squf.jpg)\
  \ `--login` 此对目标进行身份验证，并存储凭据以确保在重启后能够重新建立连接。\n\n\n\n\n\n登录后，将建立与 iSCSI 目标的会话。可以使用\
  \ `-P` 选项监控会话和节点连接。使用 `iscsiadm --mode node -P 1` 查看节点连接详情，并使用 `iscsiadm --mode\
  \ session -P [1-3]` 获取当前 iSCSI 会话的信息（参见显示列表 26.5）。\n\n**显示列表 26.5** 列出 iSCSI 节点和会话信息\n\
  \n点击此处此处查看代码图像\n\n* * *\n\n```\n[root@server2 ~]# iscsiadm --mode node -P 1\n\n\
