  \ `p` 显示概览，让你验证这是否真的是你想使用的。\n\n点击此处查看代码图像\n\n```bash\nCommand (? for help): p\n\
  Disk /dev/vdb: 2097152 sectors, 1024.0 MiB\n```\n\n\n\n\n\n逻辑扇区大小：512 字节\n\n磁盘标识符\
  \ (GUID)：`870DF067-6735-482E-83CE-5123E20509E0`\n\n分区表最多包含 128 个条目\n\n第一个可用扇区为 34，最后一个可用扇区为\
  \ 2097118\n\n分区将在 2048 扇区边界对\n\n总可用空间为 1892285 扇区 (924.0 MiB)\n\n| 编号 | 起 (扇区) |\
  \ 结束 (扇区) | 大小 | 代码 | 名称 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | 2048\
  \ | 206847 | 100.0 MiB | 8300 | Linux 文件系统 |\n\n**7.** 如果你对当前的分区满意，按 `w` 将更改写入磁盘并提交。系统会给出一个警告，随后新的分区表将被写入\
  \ GUID 分区表。\n\n点击此处查看代码图像\n\n命令 (? 需帮助)：`w`\n\n最终检查完成。准备写入 GPT 数据。这将覆盖现有的分区！！\n\n\
  你想要继续吗？(Y/N): y\n\nOK；正在向 `/dev/vdb` 写入新的 GUID 分区表 (GPT)。\n\n操作已成功完成。\n\n**8.**\
  \ 如果在此处你收到指示分区表正在使用的错误消息，请输入 `partprobe` 来更新内核分区表。\n\n***\n\n### 创建文件系统\n\n到此时，你已经学会了如何创建分区。分区本身并没有什么用。只有当你决定对其进行某些操作时，它才会变得有用。这通常意味着你必须在其上方建立一个文件系统。在本节中，你将学习如何这样做。\n\
  \nRHEL 7 可以使用不同的文件系统。表 14.4 提供了最常用文件系统的概述。\n\n![Image](img/key_topic.jpg)![Image](img/14tab04.jpg)\n\
  \n**表 14.4** 文件系统概述\n\n要使用支持的文件系统之一格式化分区，可以使用 `mkfs` 命令，并使用 `-t` 选项指定需要使用的特定文件系统。或者，可以使用特定文件系统的工具，例如使用\
  \ `mkfs.ext4` 格式化 Ext4 文件系统。\n\n***\n\n### 注意\n\n如果你在使用 `mkfs` 且没有进一步指定要格式化的文件系统，则将格式化\
  \ Ext2 文件系统。这可能不是你想要使用的，所以请不要忘记指定想要使用的文件系统。\n\n***\n\n要使用默认的 XFS 文件系统格式化分区，可以使用\
  \ `mkfs -t xfs` 命令。列表 14.1 显示此命令的输出。\n\n**列表 14.1** 使用 XFS 格式化文件系统\n\n点击此处查看代码图像\n\
  \n***\n\n```\n[root@server3 ~]# mkfs -t xfs /dev/vda5\n\nmeta-data=/dev/vda5   \
  \           isize=256    agcount=4, agsize=6400 blks\n            =            \
  \               sectsz=512   attr=2, projid32bit=1\n            =              \
  \             crc=0\ndata      =                           bsize=4096   blocks=25600,\
  \ imaxpct=25\n            =                           sunit=0   swidth=0 blks\n\
  naming    =version 2      bsize=4096    ascii-ci=0 ftype=0\nlog       =internal\
  \ lo            bsize=4096    blocks=853, version=2\n            =             \
  \              sectsz=512   sunit=0 blks, lazy-count=1\nrealtime =none         \
  \     extsz=4096    blocks=0, rtextents=0\n```\n\n***\n\n### 练习 14.4 创建文件系统\n\n\
  在 练习 14.1 中，你创建了一个分区 `/dev/vda3`。在本练习中，你用 XFS 文件系统对其进行格式化。注意，此练习只有一个步骤！\n\n**1.**\
  \ 从 root shell 中，输入 `mkfs.xfs /dev/vda3`。\n\n***\n\n### 更改文件系统属性\n\n在处理文件系统时，也可以管理某些属性。文件系统属性取决于你正在使用的文件系统，因此对于不同的文件系统，你需要使用不同的属性和工具。\n\
  \n#### 管理 Ext4 文件系统属性\n\n管理 Ext4 文件系统属性的通用工具是 `tune2fs`。该工具在很久以前为 Ext2 文件系统开发，并且兼容\
  \ Ext3 和 Ext4。在管理 Ext4 文件系统属性时，`tune2fs -l` 命令是一个很好的起点命令。列表 14.2 显示了该命令的输出，其中显示了不同的文件系统属性：\n\
  \n**列表 14.2** 显示文件系统属性\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server3 ~]# tune2fs -l\
  \ /dev/sdb\n\nFilesystem type: ext4\nLast mounted on: 28-Dec-2013\nLast checked:\
  \ 28-Dec-2013\nVolume name: none\nUUID: bf3e804-f7c6-4028-89ed-79c2bb47133\nMagic\
  \ number: 0x53\nFilesystem features: has_journal ext_inode dir_index user_attr\n\
  Filesystem state: clean\nErrors: none\nFilesystem OS: ext4\nInode count: 25688\n\
  Block count: 512000\nFree blocks: 435504\nFree inodes: 25677\nFirst block: 2048\n\
  Block size: 4096\nGroup descriptor size: 64\nInode size: 256\nBlocks per group:\
  \ 32768\nInodes per group: 16384\nGroups count: 16\nFree groups: 8\nUsed groups:\
  \ 8\nFiles count: 0\nMount count: 0\nLast mount time: 0\nLast write time: 0\nLast\
  \ check time: 0\nFilesystem time: 0\nReserved blocks: 5%\nAverage free space: 0\n\
  ```\n\n\n\nXFS 文件系统是一个完全不同的文件系统，因此它也有一套完全不同的工具来管理其属性。它不允许你从文件系统元数据中设置文件系统属性。不过，你可以使用\
  \ `xfs_admin` 命令更改某些 XFS 属性。例如，使用 `xfs_admin -L mylabel` 将文件系统标签设置为 mylabel。\n\n\
  ### 添加交换分区 (Swap Partitions)\n\n你 Linux 服务器上的大部分分区都用于常规文件系统。在 Linux 上，交换空间通常也分配在磁盘设备上。这可以是一个分区，也可以是一个\
  \ LVM 逻辑卷（在第 15 章中讨论）。在紧急情况下，你甚至可以使用文件来扩展可用的交换空间。\n\n在 Linux 上使用交换是改进 Linux 内核内存使用的一种方便方法。当物理内存不足时，最近未使用的内存页可以移动到交换空间，从而为需要访问内存页的程序释放出更多内存。因此，大多数\
  \ Linux 服务器都配置了某种数量的交换空间。但如果交换开始被密集使用，你可能会遇到麻烦，这就是为什么应该密切监控交换空间的使用。\n\n有时分配更多的交换空间是有意义的。当发生内存不足时，在某些情况下可以通过分配更多交换空间来缓解这种不足。（参见第\
  \ 24 章，“配置时间服务”获取更多关于系统性能优化的信息。）这是通过一个步骤实现的：首先创建一个具有交换分区类型的分区，然后将该分区格式化为交换空间。以下步骤描述了如何操作。\n\
  \n***\n\n#### 练习 14.5 创建交换分区\n\n**1.** 使用 `fdisk /dev/vda` 在 fdisk 中打开你的磁盘。（如果你使用的是带有\
  \ GUID 分区表的磁盘，请使用 `gdisk`。）\n\n**2.** 按 `n` 添加新分区。指定起始和结束扇区以及大小。\n\n**3.** 输入 `t`\
  \ 更改分区类型。如果你使用 fdisk，使用分区类型 82。如果你使用 gdisk，使用分区类型 8200。**\n\n**4.** 使用 `mkswap`\
  \ 将分区格式化为交换空间。例如，如果你刚刚创建的分区是 `/dev/vda6`，请使用 `mkswap /dev/vda6`。\n\n**5.** 输入 `free\
  \ -m`。你会看到当前分配的交换空间大小。\n\n**6.** 使用 `swapon` 开启新分配的交换空间。例如，如果你刚刚创建的交换设备是 `/dev/vda6`，使用\
  \ `swapon /dev/vda6` 来激活交换空间。\n\n**7.** 输入 `free -m`。你会看到新的交换空间已添加到你的服务器中。\n\n***\n\
  \n### 添加交换文件 (Swap Files)\n\n如果你没有空闲磁盘空间来创建交换分区，且急需添加交换空间，也可以使用交换文件。从性能角度来看，使用交换文件代替分区或逻辑卷等交换设备并没有太大区别，而且它可能帮助你及时解决紧急需求。\n\
  \n要添加交换文件，你首先需要创建该文件。`dd if=/dev/zero of=/swapfile bs=1M count=100` 命令将从 `/dev/zero`\
  \ 设备（产生 0）向 `/swapfile` 文件添加 100 个大小为 1 Mebibyte 的块。结果是一个 100 MiB 的文件，它可以被配置为交换空间。要这样做，你可以遵循与交换分区相同的步骤。首先使用\
  \ `mkswap /swapfile` 将该文件标记为交换文件，之后可以使用 `swapon /swapfile` 激活它。\n\n### 挂载文件系统 (Mounting\
  \ File Systems)\n\n仅仅创建一个分区并在上面放置文件系统是不够开始使用的。要使用一个分区，你必须挂载它。通过挂载分区（或者更好是挂载其上的文件系统），你可以通过特定的目录访问其内容。\n\
  \n挂载文件系统需要一些信息：\n\n![Image](img/squf.jpg) **挂载什么：** 此信息是强制性的，指定了需要挂载的设备名称。\n\n![Image](img/squf.jpg)\
  \ **挂载到哪里：** 这也是强制性信息，指定了设备应该挂载的目录。\n\n![Image](img/squf.jpg) **挂载什么文件系统：** 可选，你可以指定文件系统类型。在大多数情况下，这是必要的。`mount`\
  \ 命令将检测设备上使用了什么文件系统，并确保使用正确的驱动程序。\n\n![Image](img/squf.jpg) **挂载选项：** 挂载设备时可以使用许多挂载选项。使用选项是可选的，取决于你对文件系统的需求。\n\
  \n#### 手动挂载文件系统\n\n要手动挂载文件系统，使用 `mount` 命令。要断开已挂载的文件系统，使用 `umount` 命令。使用这些命令相对简单。要将\
  \ `/dev/vda5` 上的文件系统挂载到目录 `/mnt`，使用以下命令：\n\n```\nmount /dev/vda5 /mnt\n```\n\n要断开挂载，可以使用\
  \ `umount` 并指定设备名称或你想断开的挂载点名称。因此，以下两个命令均有效：\n\n```\numount /dev/vda5\numount /mnt\n\
  ```\n\n#### 使用设备名称、UUID 或磁盘标签\n\n挂载设备时可以使用设备名称，例如命令 `/dev/vda5\\`。如果你的服务器用在使用了动态存储拓扑的环境中，这并不总是最佳方法。你现在可能有一个存储设备\
  \ `/dev/sda5`，在存储拓扑发生变化后，在下次重启服务器后它可能变为 `/dev/sdb5`。这就是为什么在默认的 RHEL 7 安装中使用 UUID\
  \ 而不是设备名称。\n\n每个文件系统默认都关联有一个 UUID，不仅仅是用于存储文件的文件系统，还包括像交换文件系统这样的特殊文件系统。你可以使用 `blkid`\
  \ 命令来获取系统中当前文件系统的概述以及该文件系统使用的 UUID。\n\n**列表 14.3** 使用 `blkid` 查找当前文件系统的 UUID\n\n\
  点击此处查看代码图像\n\n***\n\n```\n[root@server3 ~]# blkid\n\n/dev/vda1: UUID=\"02305166-840d-4f74-a868-c549b3229e65\"\
  \ TYPE=\"xfs\"\n/dev/vda2: UUID=\"Hasz5q-nZF3-XN94-L2fm-xUwz-3VEq-qVCAYi\" TYPE=\"\
  LVM2_member\"\n/dev/vda5: UUID=\"42f419c4-633f-4ed7-b161-519a4dadd3da\" TYPE=\"\
  xfs\"\n/dev/mapper/centos-swap: UUID=\"5867ba02-fd89-475c-be56-7922febde43b\" TYPE=\"\
  swap\"\n/dev/mapper/centos-root: UUID=\"b2022ac4-73c6-4e6b-a52f-703e3e2476b7\" TYPE=\"\
  xfs\"\n```\n\n***\n\n在 UUID 流行之前，文件系统经常被配置为使用标签工作，可以使用 `e2label` 或 `xfs_admin -L`\
  \ 命令设置标签。这在较新的 Linux 版本中已变得不常见。如果文件系统有标签，`blkid` 命令也会显示它。\n\n要根据 UUID 挂载文件系统，你使用\
  \ `UUID=nnnnn` 而不是设备名称。因此，如果你想根据列表 14.3 基于其 UUID 挂载 `/dev/vda5`，命令变为如下：\n\n```\n\
  mount UUID=\"42f419c4-633f-4ed7-b161-519a4dadd3da\" /mnt\n```\n\n使用 UUID 手动挂载设备并不一定更容易。然而，如果如下一节所示挂载是自动的，那么使用\
  \ UUID 而不是设备名称是有意义的。\n\n要使用标签挂载文件系统，你使用 `mount LABEL=labelname` 命令。例如，使用 `mount\
  \ LABEL=mylabel /mnt` 临时将名为 mylabel 的文件系统挂载到 `/mnt` 目录。\n\n### 通过 /etc/fstab 自动挂载文件系统\n\
  \n通常情况下，你不希望手动挂载文件系统。一旦你对它们满意，让它们自动挂载是一个明智的选择。实现此点的经典方法是通过 `/etc/fstab` 文件。列表 14.4\
  \ 显示了该文件的示例内容。\n\n\n\n\n\n## 列表 14.4  `/etc/fstab` 文件内容\n\n点击此处查看代码图像\n\n***\n\n\
  ```\n[root@server3 ~]# cat /etc/fstab\n\n#\n\n# /etc/fstab\n\n# Created by anaconda\
  \ on Fri Jan 16 10:28:41 2015\n\n#\n\n# Accessible filesystems, by reference, are\
  \ maintained under '/dev/disk'\n# See man pages fstab(5), findfs(8), mount(8) and/or\
  \ blkid(8) for more info\n\n#\n\n/dev/mapper/centos-root /          xfs      defaults\
  \        1 1\n\nUUID=02305166-840d-4f74 /          xfs      defaults        1 2\n\
  \n/dev/mapper/centos-swap swap      swap      defaults        0 0\n```\n\n***\n\n\
  在 `/etc/fstab` 文件中，所有内容都用于自动挂载文件系统。为了这一目的，每行都有六个字段，如表 14.5 所示。\n\n![Image](img/key_topic.jpg)![Image](img/14tab05.jpg)\n\
  \n### 表 14.5 `/etc/fstab` 字段\n\n根据之前对 `mount` 命令的讨论，你应该没有问题地理解 `/etc/fstab` 中的设备、挂载点和文件系统字段。注意，在挂载点，并不是所有的文件系统都使用目录名称。某些系统设备（如\
  \ `swap`）不挂载到目录，而是挂载在内核接口上。使用内核接口时很容易识别；它的名称不以 `/` 开头（并且在你的服务器文件系统中不存在）。\n\n挂载选项字段定义了可以使用的特定挂载选项。如果不需要特定选项，此行将仅读取“defaults”。为了提供特定功能，可以在这里指定大量的挂载选项。表\
  \ 14.6 给出了一些常用挂载选项的概述。\n\n![Image](img/key_topic.jpg)![Image](img/14tab06.jpg)\n\
  \n### 表 14.6 常用挂载选项\n\n`/etc/fstab` 的第五列指定了对 `dump` 工具的支持。这是一个为了创建文件系统备份而开发的工具。良好的做法是为所有实际文件系统指定\
  \ `1` 以开启此功能，并为所有系统挂载点指定 `0` 以关闭此功能。\n\n最后一列表示在启动时是否需要检查文件系统的完整性。如果你完全不想检查文件系统，请放入\
  \ `0`；如果这是需要在任何其他操作之前检查的根文件系统，请放入 `1`；如果这是启动时需要检查的非根文件系统，请放入 `2`。\n\n***\n\n###\
  \ 警告\n\n如果通过 `/etc/fstab` 标记了自动文件系统检查，且某些因素阻止了文件系统的正确检查，你的系统将停止启动并提示“enter root\
  \ password to enter maintenance mode（输入 root 密码进入维护模式）”。防止这种情况发生，你可以选择在启动时禁用自动检查。请参第\
  \ 19 章“排除启动故障”，获取有关如何修复此特定情况的更多信息。\n\n***\n\n***\n\n### 练习 14.6 通过 `/etc/fstab`\
  \ 挂载分区\n\n在本次练习中，你将挂载在之前的练习中创建的 XFS 格式分区 `/dev/vda5`。\n\n1. 在 root shell 中，输入 `blkid`。使用鼠标复制\
  \ `/dev/vda5` 的 `UUID=\"nnnn\"` 部分。\n2. 输入 `mkdir -p /mounts/data` 为此分区创建一个挂载点。\n\
  3. 用编辑器打开 `/etc/fstab` 并添加以下行：\n\n点击此处查看代码图像\n\n```\nUUID=\"nnnn\"      /mounts/data\
  \      xfs      defaults  1 2\n```\n4. 在尝试重新启动时自动挂载之前，测试一下配置是一个好主意。输入 `mount -a`。这会挂载\
  \ `/etc/fstab` 中指定的所有且尚未挂载的内容。\n5. 输入 `df -h` 验证分区是否已正确挂载。\n\n***\n\n#### 总结\n\n\
  在本重要的章节中，你学习了如何在 RHEL 7 上处理分区和文件系统。你学习了如何为 MBR 和 GPT 磁盘创建分区，以及如何在分区上层建立文件系统。你还学习了如何通过\
  \ `/etc/fstab` 手动和自动地挂载这些分区。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n复习章节中最重要的主题，这些主题在页面外边页用“关键主题”图标标记。表\
  \ 14.7 列出了这些关键主题的索引及其所在的页码。\n\n![Image](img/14tab07.jpg)\n\n### 表 14.7 第 14 章 关键主题\n\
