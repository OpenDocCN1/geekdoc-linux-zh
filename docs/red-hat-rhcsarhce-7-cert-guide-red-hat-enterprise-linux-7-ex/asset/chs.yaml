  \n首先，你需要安装 MariaDB 并应用基本设置。在本节中，你将学习如何通过安装软件、加固它以及修改数据库文件 `/etc/my.cnf`。。注意 MariaDB\
  \ 的许多组件引用了 `MySQL`。这是正常的，因为 MariaDB 是 `MySQL` 数据库的派生物。\n\n要安装 MariaDB，请完成以下步骤：\n\
  \n1. 在想要安装软件的服务器上运行 `yum install mariadb mariadb-server mariadb-test -y`。\n\n2.\
  \ 输入 `systemctl start mariadb` 然后跟上 `systemctl enable mariadb` 以启动并启用数据库服务。\n\n\
  3. 使用 `systemctl status mariadb` 验证 mariadb 是否正在运行。这应该显示当前状态，包括最近记录的日志。列表 35.1 显示了它的具体样子。\n\
