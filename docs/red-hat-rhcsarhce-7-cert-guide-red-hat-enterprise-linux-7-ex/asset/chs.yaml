  \ 21:30`\nd. `date 2130`\n\n7 哪个命令能将时间戳（epoch time）转换为人类可读时间？\n\na. `date --@`\n\
  b. `date --d`\nc. `date --t`\nd. `date --u`\n\n8 哪个命令允许你监控硬件时钟和系统时钟之间的差异？\n\na.\
  \ `tail -f /var/lib/time/drift`\nb. `date -h`\nc. `hwclock -c`\nd. `hwclock -d`\n\
  \n9 哪个命令允许你显示包括本地时间、硬件时间和所在时区的当前信息？\n\na. `timedatectl --all`\nb. `timedatectl --tz`\n\
  c. `timedatectl -ht`\nd. `timedatectl`\n\n10 哪个命令启动用于管理时间的图形化工具？\n\na. `timedatectl`\n\
  b. `system-config-time`\nc. `timedatectl-gtk`\nd. `system-config-date`\n\n### 基础主题\n\
  \n 理解本地时间\n\n![Image](img/key_topic.jpg)\n\n当 Linux 服务器启动时，会读取硬件时钟（也称为实时时钟）。该时钟通常位于计算机硬件中。通常，它是主板上的集成电路，完全独立于操作系统的当前状态，并且在计算机关闭时继续运行。系统从硬件时钟获取初始时间设置。\n\
  \nLinux 服务器硬件时钟上的时间通常设置为协调世界时（UTC 是全球范围内都相同的时间）。\n\n![Image](img/key_topic.jpg)\n\
  \n系统时间是由操作系统维护的时间。一旦系统启动，系统时钟完全独立于硬件时钟。因此，当更改系统时间时，硬件时钟不会自动改变。运行在服务器上的应用程序会将系统时间转换为本地时间。本地时间是当前时区的实际时间。本地时间中考虑了夏令时\
  \ (DST)。表 24.2 概述了在 Linux 时间中起作用的不同概念。\n\n![Image](img/key_topic.jpg)\n\n 使用网络时间协议\n\
  \n如你所学，当前系统时间是基于硬件时钟的。这个硬件时钟通常是主板的一部分，它可能是不可靠的。由于其不可靠性，最好使用来自更可靠源的时间。通常来说，有两种解决方案。\n\
  \n一种方案是购买更可靠的硬件时钟。例如，直接连接到你计算机的非常精确的原子钟。当使用这种可靠的时钟时，就能保证系统时间的准确性。使用外部硬件时钟是保证数据中心时间有效的常用解决方案，即使暂时无法连接到外部网络也是如此。\n\
  \n另一种更常见的解决方案是配置你的服务器使用网络时间协议 (NTP)。NTP 是一种通过互联网上的 NTP 服务器提供的维护系统时间的方法。为服务器提供准确时间是一种简单解决方案，因为大多数服务器都连接到互联网。\n\
  \n如果服务器已经连接到互联网，在 RHEL 7 上设置 NTP 时间是非常简单的。在这种情况下，`/etc/chrony.conf` 文件已经配置了标准的互联网\
  \ NTP 服务器列表。管理员只需要通过 `timedatectl set-ntp 1` 开启 NTP 即可。在第 40 章“管理时间同步”中，你可以阅读更多关于\
  \ RHCE 要求使用 NTP 设置时间同步的内容。\n\n#### 在红帽企业级 Linux 上管理时间\n\n在红帽企业级 Linux 上管理时间涉及不同的命令。表\
  \ 24.3 提供了概述。\n\n\n\n\n\n![Image](img/key_topic.jpg)![Image](img/24tab03.jpg)\n\n\
  ## 表 24.3 与 RHEL 7 时间管理相关的命令\n\n![Image](img/key_topic.jpg)\n\n在 Linux 系统中，时间被计算为\
  \ Unix 时间 (epoch time)的偏移量。Unix 时间是指自 UTC 时间 1970 年 1 月 1 日以来的秒数。在某些日志（例如 `/var/log/audit/audit.log`）中，你会发现使用的是\
  \ Unix 时间戳而非可读时间。要将此类 Unix 时间戳转换为可读时间，可以使用 `--date` 选项，后跟以 `@` 开头的 字符串：\n\n```\n\
  date --date '@1420987251'\n```\n\nUnix 时间的使用在 Linux 上也产生了一个潜在的时间问题。在 32 位系统上，用于时间表示的字段所能计数的秒数将在\
  \ 2037 年耗尽。（如果你使用的是 32 位内核，请尝试将时间设置为 2050 年的某个时刻；它将无法工作。）64 位系统可以处理一直到 22 世纪遥远的时间。\n\
  \n### 使用 date\n\n`date` 命令允许你管理系统时间。你也可以用它以不同的格式显示当前时间。这里列出了 `date` 的一些常用用法示例：\n\
  \n![Image](img/squf.jpg) `date` 显示当前系统时间\n\n![Image](img/squf.jpg) `date +%d-%m-%y`\
  \ 显示当前的系统日期、月份和年份\n\n![Image](img/squf.jpg) `date -s 16:03` 将当前时间设置为下午 4 点过 3 分\n\
  \n### 使用 hwclock\n\n`date` 命令允许你设置和显示当前系统时间。使用 `date` 命令不会改变你系统上使用的硬件时间。要管理硬件时间，你可以使用\
  \ `hwclock` 命令。`hwclock` 命令有许多选项，其中一些特别值得关注：\n\n![Image](img/squf.jpg) `hwclock\
  \ -c` 显示硬件时间与系统时间之间的差异。该命令的输出每 10 秒刷新一次。列表 24.1 显示了该命令的输出。\n\n![Image](img/squf.jpg)\
  \ `hwclock --systohc` 将当前系统时间同步到硬件时钟。\n\n![Image](img/squf.jpg) `hwclock --hctosys`\
  \ 将当前硬件时间同步到系统时钟。\n\n**列表 24.1** 硬件与系统时间差异监控\n\n点击此处查看代码\n\n```\n[root@server1 ~]#\
  \ hwclock -c\n\nhw-time      system-time          freq-offset-ppm   tick\n1428584002\
  \  1428584002.01018\n1428584012  1428584012.33019      2000      22\n1428584022\
  \  1428584022.05953      2197      22\n1428584032  1428584032.08372      2418  \
  \    24\n1428584042  1428584042.11683      2517      25\n```\n\n### 使用 timedatectl\n\
  \nRHEL 7 中新增的允许你管理许多时间方面的新命令是 `timedatectl`。如列表 24.2 所示，在不带任何参数使用时，该命令会显示有关当前时间和日期的详细信息。它还会显示你系统所在的时区，以及关于网络时间的使用信息和夏令时(DST)的使用信息。\n\
  \n**列表 24.2** 使用 `timedatectl` 获取当前时间的详细信息\n\n点击此处查看代码\n\n```\n[root@localhost ~]#\
  \ timedatectl\n  Local time: Sun 2015-01-11 10:02:41 EST\n  Universal time: Sun\
  \ 2015-01-11 15:02:41 UTC\n  RTC time: Sun 2015-01-11 15:02:51\n  Timezone: America/New_York\
  \ (EST, -0500)\n  NTP enabled: n/a\nNTP synchronized: no\nRTC in local TZ: no\n\
  DST active: no\nLast DST change: DST ended at\n              Sun 2014-11-02 01:59:59\
  \ EDT\n              Sun 2014-11-02 01:00:00 EST\nNext DST change: DST begins (the\
  \ clock jumps one hour forward) at\n              Sun 2015-03-08 01:59:59 EST\n\
  \              Sun 2015-03-08 03:00:00 EDT\n```\n\n`timedatectl` 命令与其他命令配合以执行时间操作。表\
  \ 24.4 提供了相关命令的概述。\n\n![Image](img/key_topic.jpg)![Image](img/24tab04.jpg)\n\n**表\
  \ 24.4 timedatectl** 命令概述\n\n`timedatectl` 命令被开发为管理 RHEL 7 时间的通用解决方案。它提供了一些通过其他命令实现的功能，但该命令的目的是最终将取代其他用于管理时间、日期设置的命令。当使用\
  \ `timedatectl` 开启 NTP 时间时，它会与 `chronyd`进程通信。在第 40 章中，你将学习更多关于如何使用 chrony 管理 NTP\
  \ 时间。练习 24.1 将引导你了解一些在 RHEL 7 服务器上管理时间的常用选项。\n\n**提示**\n\n在 RHEL 7 上，chrony 是管理网络时间的默认解决方案。不过，仍然可以通过\
  \ `ntpd` 实现 NTP。如果你有需要 `ntpd` 的服务，可以自由使用它，但你应该意识到，在这种情况下……\n\n\n\n\n\n```\nJan 11\
  \ 10:20:15 localhost.localdomain systemd[1]: Started NTP client/server.\nJan 11\
  \ 10:20:20 localhost.localdomain chronyd[13937]: Selected source 178.21.23.127\n\
  Jan 11 10:20:20 localhost.localdomain chronyd[13937]: System clock wrong by 11.256802\
  \ seconds, adjustment started\nJan 11 10:20:31 localhost.localdomain chronyd[13937]:\
  \ System clock was stepped by 11.257 seconds\nJan 11 10:20:33 localhost.localdomain\
  \ chronyd[13937]: Selected source 87.195.109.207\n```\n\n## 管理时区设置\n\n在 Linux 服务器之间，时间通常通过\
  \ UTC 进通信。这允许不同时区的服务器都使用相同的时间设置，使得大型机构的时间管理变得简单得多。然而，为了方便终端用户，也必须设置本地时间。要做到这一点，需要选择适当的时区。\n\
  \n在 Red Hat Enterprise Linux 7 上，你有四种方法来设置正确的本地时区：\n\n![Image](img/squf.jpg) 使用本章下一节将过的\
  \ `system-config-date` 工具。\n\n![Image](img/squf.jpg) 进入 `/usr/share/zoneinfo` 目录。在此目录下，你会发现不同的子目录，其中包含每个定义的时区的文件。要设置服务器的本地时区，你可以创建一个名为\
  \ `/etc/localtime` 的符号链接，指向相关的时区文件。例如，如果你想将本地时间设置为洛杉矶时间，可以使用 `ln -sf /usr/share/zoneinfo/America/Los_Angeles\
  \ /etc/localtime`。\n\n![Image](img/squf.jpg) 使用 `tzselect` 工具。该工具会启动列表 24.4 所示的界面，从中可以选择合适的区域和语言区域（locale）。\n\
  \n![Image](img/squf.jpg) 使用 `timedatectl` 设置时区信息。\n\n**列表 24.4** 使用 `tzselect` 选择时区\n\
  \n点击此处查看代码图像\n\n```\n[root@server1 ~]# tzselect\nPlease identify a location so that\
  \ time zone rules can be set correctly.\nPlease select a continent or ocean.\n1)\
  \ Africa\n2) Americas\n3) Antarctica\n4) Arctic Ocean\n5) Asia\n6) Atlantic Ocean\n\
  7) Australia\n8) Europe\n9) Indian Ocean\n10) Pacific Ocean\n11) none - I want to\
  \ specify the time zone using the Posix TZ format.\n? 2\nPlease select a country.\n\
  1) Anguilla 2) Antigua & Barbuda 3) Argentina 4) Aruba 5) Bahamas 6) Barbados 7)\
  \ Belize 8) Bolivia 9) Brazil 10) Canada 11) Caribbean Netherlands 12) Cayman Islands\
  \ 13) Chile 14) Colombia 15) Costa Rica 16) Cuba 17) Curacao 18) Dominica 19) Dominican\
  \ Republic 20) Ecuador 21) El Salvador 22) French Guiana 23) Greenland 24) Grenada\
  \ 25) Guadeloupe 26) Guatemala 27) Guyana 28) Haiti 29) Honduras 30) Jamaica 31)\
  \ Martinique 32) Mexico 33) Montserrat 34) Nicaragua 35) Panama 36) Paraguay 37)\
  \ Peru 38) Puerto Rico 39) St Barthelemy 40) St Kitts & Nevis 41) St Lucia 42) St\
