  \ -n\nroot      900      1     0 May14 ?           00:00:00 /usr/bin/python -Es\
  \ /usr/sbin/firewalld --nofork --nopid\navahi     902      1     0 May14 ?     \
  \      00:00:00 avahi-daemon: running [server2.local]\nlibstor+  903      1    \
  \ 0 May14 ?           00:00:00 /usr/bin/lsmd -d\nroot      905      1     0 May14\
  \ ?           00:02:14 /usr/bin/vmtoolsd\nroot      908      1     0 May14 ?   \
  \        00:00:00 /usr/sbin/rsyslogd -n\nroot      910      1     0 May14 ?    \
  \       00:00:00 /usr/sbin/abrtd -d -s\nroot      911      1     0 May14 ?     \
  \      00:00:00 /usr/bin/abrt-watch-log -F BUG: WARNING: at WARNING: CPU: INFO:\
  \ possible recursive locking det\navahi     912      902  0 May14 ?           00:00:00\
  \ avahi-daemon: chroot helper\n```\n\n* * *\n\n注意：对于某些命令，在选项前使用连字符是可选的。但某些命令并非如此。`ps`\
  \ 命令就是其中之一。这种情况有一个历史原因：命令源于旧的 BSD 变体，在那个版本中，指定命令行选项时在前面不加 `-` 是常见的。\n\n#### 列表 9.3\
  \ 使用 `ps` 显示父子关系\n\n点击此处查看图片\n\n```\n[root@server2 ~]# ps\nPID TTY     STAT    \
  \      TIME COMMAND\n1603 ?      Ss           00:00 /usr/sbin/sshd -D\n3595 ?  \
