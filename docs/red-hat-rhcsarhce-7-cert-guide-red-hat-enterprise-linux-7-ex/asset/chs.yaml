  \ 7 虚拟化\n\n![Image](img/squf.jpg) 将你的服务器成为 KVM 宿主机\n\n![Image](img/squf.jpg) 管理虚拟机\n\
  \n**本章涵盖了以下 RHCSA 考试目标：**\n\n![Image](img/squf.jpg) 访问虚拟机的控制台\n\n![Image](img/squf.jpg)\
  \ 启动和停止虚拟机\n\n![Image](img/squf.jpg) 配置物理机托管虚拟机客\n\n![Image](img/squf.jpg) 将红帽企业\
  \ Linux 系统安装为虚拟机客\n\n![Image](img/squf.jpg) 配置系统在启动时启动虚拟机\n\n要成为 RHCSA，你必须能够操作虚拟机（VM）。在本章中，你将学习\
  \ RHEL 7 提供了哪些虚拟化选项。你还学学习了如何将你的服务器设置为 KVM 宿主机以及如何管理虚拟机。\n\n### “我已经认识这些了吗？”测验\n\n\
  “我已经认识这些了吗？”测验可以让你评估自己是否应该仔细阅读整个章节内容，还是跳转到`考试准备任务`部分。如果你对这些问题的答案有疑问，请仔细阅读本章。\n\n\
  \n\n\nRHEL 7 提供了多种虚拟化解决方案。不过，默认的虚拟化解决方案是 KVM (内核虚拟机)）。KVM 包含在 Linux 内核中，该方案提供了基于管理程序的虚拟化支持。这意味着你不需要运行一个特定的程序来托管虚拟机；相反，虚拟化支持是在操作系统内核内部的。\n\
  \n并不是每台 RHEL 7 服务器默认都支持 KVM 虚拟化；你必须在本章稍后描述的，在符合最低要求的服务器上单独安装它。KVM 虚拟化仅支持 64 位计算机架构。\n\
  \n如果你已经习惯于使用桌面级虚拟化解决方案（例如 VMware Workstation 或 Oracle Virtual Box），你需要注意桌面级虚拟化与基于管理程序的虚拟化之间的一个区别。在桌面级虚拟化中，虚拟机是由虚拟化应用程序提供的。因此，如果你关闭了虚拟化应用程序，运行其中的虚拟机也会随之关闭。\n\
  \n在 KVM 管理程序虚拟化中，虚拟机直接运行在 Linux 内核之上。因此，你默认不会有一个正在运行以支持虚拟机的应用程序，你可能甚至不会注意到虚拟机正在你的服务器上运行。\n\
  \n### 理解 QEMU\n\n在安装红帽企业 Linux 7 服务器作为 KVM 管理程序主机时，你也会自动安装一些 QEMU 组件。QEMU（快速模拟器）是一种开源软件，最初是为了通过二进制模拟提供硬件虚拟化而创建的。QEMU\
  \ 可以独立使用，也可以与 KVM 配合使用以近原生速度运行虚拟机。KVM 管理程序主机上的某些重要部分并非由 KVM 直接提供，而是从 QEMU 项目集成的。一个例子是虚拟机镜像文件的磁盘格式，但许多其他部分也来自\
  \ QEMU。\n\n### 红帽在 KVM 之外的产品\n\n红帽的产品范围远不止于单个管理程序上的 KVM。红帽在其产品组合中还有红帽企业虚拟化 (RHEV)\
  \ 产品。该解决方案的开发是为了与 VMware vSphere 环境竞争。它提供了一个基础设施级服务器，由多个管理程序节点组成，并从一个中央 RHEV 管理器节点进行管理，该节点上的\
  \ Web 用户界面使得管理复杂环境变得简单。\n\n红帽还投入了大量精力成为主要的云提供商。红帽是 OpenStack 云项目的重要贡献者，并提供了基于 OpenStack\
  \ 自己的云解决方案。在该解决方案中，也提供了 KVM 虚拟化。\n\n### 理解 Libvirtd 的作用\n\n要访问通过 KVM 虚拟机，你需要使用 libvirtd。Libvirtd\
  \ 是一个位于虚拟化层与管理员用于访问虚拟机的应用程序之间的进程。没有 libvirtd，你就无法管理虚拟机。虚拟机的管理选项还通过配置文件 `/etc/libvirt/libvirtd.conf`\
  \ 进行配置。在此文件中，你可以设置一些高级参数。例如，你可以打开一个 TCP 端口，允许你连接到运行在另一个主机上的 libvirt 进程。这非常方便，因为在多主机环境中，它允许你管理不仅运行在你服务器上的虚拟机，还运行在其他主机上的虚拟机。\n\
  \n虽然直接远程连接到 libvirtd 的方法运行良好且对于安装软件软件包较少的管理程序来说非常方便，但你也可以从 `virt-manager` 使用安全 Shell\
  \ (SSH) 连接到远程 libvirtd 进程。\n\n如果你在访问虚拟机时遇到问题，libvirtd 是首要嫌疑对象，你至少应该通过 `systemctl\
  \ status -l libvirtd` 命令确保它正在运行。在列表 10.1 中，你可以看到此命令如何显示 libvirtd 正在运行；该命令还显示了关于进程最近活动的信息。\n\
  \n**列表 10.1** 使用 `systemctl status -l libvirtd` 获取 libvirtd 进程状态的详情\n\n点击此处查看代码图像\n\
