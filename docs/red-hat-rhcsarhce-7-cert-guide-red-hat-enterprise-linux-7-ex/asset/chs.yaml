  \ 创建和编辑文本文件\n\n自从 UNIX 早期以来，处理文本文件一直是管理员的一项重要技能。即使在如 Red Hat Enterprise Linux 7\
  \ 这样的现代 Linux 版本上，处理文本文件仍然是一项重要技能。通过应用正确的工具，你将轻松找到所需的信息。本章就是关于这些工具的。确保你良好掌握了它们，因为对这些工具的深入了解确实会让你的\
  \ Linux 管理员工作变得很多。同时，也会增加你通过 RHCSA 测试的几率。\n\n### “我学会了吗？”测验\n\n“我学会了吗？”测验可以让你评估自己应该彻底阅读整个章节内容，还是跳到“考试准备任务”部分。如果你对这些问题的答案或自己对这些主题知识的评估有疑问，请阅读整章内容。表\
  \ 4.1 列出了本章中的主要标题及其对应的“我学会了吗？”测验题。你可以在附录 A 中找到答案。附录 A“我学会了吗？”\n\n![Image](img/04tab1.jpg)\
  \ **表 4.1** 我学会了吗？\n\n**1.** 如果你正在寻找配置文件，你会去哪个目录？\n\n**2.** 哪个命令可以允许你显示当前目录内容的列表，且最新的文件排在最前面？\n\
  \n**3.** 哪个命令可以允许你将文件 `myfile` 重命名为你的 `file`？\n\n**4.** 哪个命令可以允许你删除整个目录结构，包括其所有内容？\n\
