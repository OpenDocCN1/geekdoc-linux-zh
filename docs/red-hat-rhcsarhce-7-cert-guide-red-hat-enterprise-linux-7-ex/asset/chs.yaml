  \ 启动提示符处输入了一个内核参数。哪个键可以让你进入该参数启动？\n   a. ZZ\n   b. Ctrl+X\n   c. Esc\n   d. Enter\n\
  \n3. **3.** initramfs 似乎有故障且无法初始化 LVM 卷。你应该检查哪个配置文件来查看使用的选项？\n   a. `/etc/dracut.d/dracut.conf`\n\
  \   b. `/etc/dracut.conf`\n   c. `/etc/sysconfig/dracut`\n   d. `/etc/mkinitrd.conf`\n\
