  \n#### 将你的服务器配置为 KVM 主机\n\n在本节中，你将学习将服务器配置为 KVM 主机所需的条件。你首先将学习执行此操作的要求。然后将学习如何安装所需的\
  \ KVM 软件软件包。在本节的最后部分，你将学习如何增强网络以支持虚拟机网络。\n\n##### 检查要求\n\n在开始将 RHEL 服务器配置为管理程序主机之前，请验证支持情况。启动\
  \ KVM 管理程序后端服务实际上只有两个要求：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/sqf.jpg)\
  \ 你必须使用 64 位 CPU 架构。\n\n![Image](img/sqf.jpg) 你的 CPU 必须支持硬件虚拟化。\n\n验证你正在运行 64 位架构并不困难；只需输入\
  \ `arch` 来显示当前使用的架构。如果正常，你将看到显示 `x86_64` 架构。或者，你也可以使用 `uname -i` 命令，它也会显示使用的内核类型。\n\
  \n检查 CPU 是否支持虚拟化功能可能会稍微复杂一些。首先，你需要确保在计算机的 BIOS 中开启了虚拟化支持。完成后，你可以使用命令 `cat /proc/cpuinfo`。在该命令的输出中（参见列表\
  \ 10.2），在 Intel CPU 上你应该看到 `vmx`，在 AMD CPU 上你应该看到 `svm`。\n\n**列表 10.2** /proc/cpuinfo\
  \ 的部分内容\n\n```\nprocessor       : 1\nvendor_id      : GenuineIntel\ncpu family \
  \    : 6\n```\n\n\n\n\n```\nmodel: 58\nmodel name: Intel(R) Core(TM) i7-3740QM CPU\
  \ @ 2.70GHz\nstepping: 9\nmicrocode: 0x15\ncpu MHz: 2693.276\ncache size: 6144 KB\n\
  physical id: 2\nsiblings: 1\ncore id: 0\ncpu cores: 1\napicid: 2\ninitial apicid:\
  \ 2\nfpu: yes\nfpu_exception: yes\ncpuid level: 13\nwp: yes\nflags: fpu vme de pse\
  \ tsc msr pae mce cx8 apic sep mtrr pge mca cmov pat pse36 clflush dts mmx fxsr\
  \ sse sse2 ss syscall nx rdtscp lm constant_tsc arch_perfmon pebs bts nopl xtopology\
  \ tsc_reliable nonstop_tsc aperfmperf eagerfpu pni pclmulqdq vmx ssse3 cx16 pcid\
  \ sse4_1 sse4_2 x2apic popcnt aes xsave avx f16c rdrand hypervisor lahf_lm ida arat\
  \ epb xsaveopt pln pts dtherm tpr_shadow vnmi ept vpid fsgsbase smep\nbogomips:\
  \ 5386.55\nclflush size: 64\ncache_alignment: 64\naddress sizes: 40 bits physical,\
  \ 48 bits virtual\npower\n```\n\n# 安装 KVM 软件\n\n在确认你符合所有硬件要求后，可以安装虚拟化软件。最方便的方法是使用\
  \ `yum groupinstall \"Virtualization Host\"`。该命令会安装设置虚拟化主机环境所需的所有内容。\n\n另一个重要的考虑因素是存储的可用性。当你安装虚拟机时，它需要创建一个虚拟磁盘。该虚拟磁盘默认存储在\
  \ `/var/lib/libvirt/images` 目录下的镜像文件中。在开始安装之前，请确保你想要安装虚拟机的分区中有足够的可用磁盘空间。\n\n###\
  \ 注意事项\n\n作为使用磁盘镜像文件的替代方案，你可能更倾向于使用 LVM 逻辑卷作为存储后端。这提供了一些优势，例如可以使用 LVM 快照功能轻松地创建备份。由于这个原因，LVM\
  \ 经常用作生产 KVM 服务器的存储后端。对于 RHCSA 和 RHCE 考试，你不需要知道如何设置。\n\n在 练习 10.1 中，你将学习如何将服务器配置为\
  \ KVM 安装主机。\n\n## 练习 10.1 将服务器配置为 KVM 虚拟机主机\n\n在此练习中，你将把服务器配置为 KVM 虚拟机主机。为了获得最佳性能，在物理服务器上执行此练习效果最好。出于学习目的，你也可以将\
  \ KVM 或 VMware 虚拟机设置为虚拟机主机。这会使你在虚拟化中使用虚拟化，这对性能是有利的，但至少可以让你看到它的工作原理。要实现这一点，请在你的虚拟化检查中检查\
  \ CPU 特性并确保已启用虚拟机选项。目前，KVM 和 VMware 支持嵌套虚拟化（虚拟机中的虚拟机主机）。VirtualBox 不支持这种类型。\n\n\
  1. 在你想要作为虚拟机主机的服务器上，输入 `arch` 以验证你正在使用 64 位架构。\n2. 接下来输入 `cat /proc/cpuinfo | egrep\
  \ 'svm|vmx'` 并读取 CPU 部分，查看 `vmx` 或 `svm` 是否列为标志之一。\n3. 输入 `yum groupinstall \"Virtualization\
  \ Host\"` 安装使你的服务器成为虚拟化主机所需的所有内容。\n\n### 理解 KVM 主机\n\n在主机上安装虚拟化软件后，网络也会发生变化。在主机上，会创建一个虚拟桥接。这个虚拟桥接像一个嵌入式交换机，用于将主机上的另一个网络接口连接到不同的虚拟机。\n\
  \n在网络上进行通信时，虚拟机通过其（虚拟）网络接口发送数据包，该接口通常命名为 `eth0`。在虚拟机主机级别，此网络由 `vnet` 接口表示。第一个启动的虚拟机获得\
  \ `vnet0`，第二个启动的机器获得 `vnet1`，以此此类推。\n\n这些 `vnet` 接口随后连接到虚拟桥接。虚拟桥接本身连接到你主机上的物理网络接口。要获取虚拟网络的概览，可以使用命令\
  \ `brctl show`。该命令的输出可以在列表 10.3 中查看，它显示了桥接名称、分配给桥接的唯一 ID、显示是否启用桥接协议 STP（生成树协议）的指示器以及所有连接到桥接的接口。\n\
  \n**列表 10.3 使用 brctl show 显示桥接配置**\n\n点击此处查看图像\n\n```\n[root@lab ~]# brctl show\n\
  \    bridge name      bridge id               STP enabled      interfaces\n    virbr0\
  \          8000.fe5400414535 yes            vnet0 vnet1\n                      \
  \                      vnet2                                                   \
  \            vnet3\n```\n\n注意，在 Red Hat Enterprise Linux 7 上，有两种不同的方法来管理网络桥接。在安装\
  \ RHEL 作为 KVM 主机时，会自动创建一个名为 `virbr0` 的桥接接口。或者，你可以使用 NetworkManager 相关工具手动配置桥接。为了方便设置虚拟网络，建议在配置服务器作为\
  \ KVM 主机时安装桥接。\n\n## 管理虚拟机\n\n安装所需的软件包后，你可以开始创建和管理虚拟机。在本节中，你将学习如何操作。\n\n### 安装虚拟机\n\
  \n在练习 10.2 中，你将学习如何使用虚拟机管理器安装虚拟机。练习结束后，将有一个小节解释写入磁盘的虚拟机配置位置。\n\n## 练习 10.2 安装虚拟机\n\
  \n在此练习中，你将学习如何安装虚拟机。在开始练习之前，请确保可以使用包含 RHEL 或 CentOS 7 的安装磁盘。最简单的方法是将物理光盘插入 KVM 主机的光驱中。如果不可，其次方案是将安装磁盘的\
  \ ISO 拷贝到虚拟机主机并使用。\n\n1. 打开 root shell。在 root shell 中 `lsmod | grep kvm`。你正在寻找 `kvm`\
  \ 和 `kvm_intel` 模块（如果是 AMD 平台则为 `kvm_amd`）。如果这些模块当前未加载，输入 `modprobe kvm` 来加载它们。\n\
  2. 输入 `systemctl status libvirtd`。此命令检查 `libvirtd` 服务是否已加载。如果是，则正常。如果没有，输入 `systemctl\
  \ start libvirtd` 启动服务。\n3. 输入 `df -h` 验证可用磁盘空间。\n4. 输入 `virt-manager &` 启动虚拟机管理器。\n\
  5. 在虚拟机管理器中，点击**创建新虚拟机**。这会打开新虚拟机向导的第 1 步窗口（参见图 10.1）。\n6. 在向导的第 2 步中，你需要指定查找安装磁盘的源，以及你想要安装的操作系统和操作系统版本。确保使用与图\
  \ 10.2 相同的设置。\n\n\n\n\n\n### 7. 接下来，你需要指定想要分配给虚拟机（VM）的内存数量以及 CPU 核心数。当然，你在宿主机上至少需要拥有所分配的资源。对于最小化安装，请使用\
  \ `512 MB RAM` 和 `1 CPU`（参见图 10.3）。\n\n![Image](img/10fig03.jpg)\n\n**图 10.3** 输入虚拟机属性。\n\
  \n### 8. 现在输入你想要创建的虚拟磁盘的属性。对于基础安装，建议至少使用 `2GB`（参见图 10.4）。\n\n![Image](img/10fig04.jpg)\n\
  \n**图 10.4** 输入虚拟磁盘大小。\n\n* * *\n\n**提示**\n\n如果你可用的磁盘空间有限，只需按照现有的可用磁盘空间创建虚拟机。你不需要完成整个安装过程（因此，你不需要完成安装通常所需的全部磁盘空间）。关键在于你知道如何在虚拟机管理器（Virtual\
  \ Machine Manager）中执行这些步骤。（你已经知道如何安装 RHEL 7 了。）\n\n* * *\n\n### 9. 在此阶段，你已经输入了所有用于虚拟机的属性。你现在可以点击\
  \ `Finish` 将虚拟机设置写入磁盘并开始安装过程。注意，你并不需要完成安装过程。在本书后的章节中，你不再需要将此处安装的虚拟机用于任何其他用途。\n\n\
  在此过程中，你定义了虚拟机将使用的虚拟硬件设置。现在可以开始安装了。虚拟机设置本身已写入一个存储在 `/etc/libvirtd/qemu` 目录下的 XML\
  \ 配置文件中。列表 10.4 显示了刚刚创建的文件的部分内容。\n\n* * *\n\n**列表 10.4** 验证虚拟机配置 XML 代码\n\n点击此处查看代码图像\n\
  \n* * *\n\n```\n[root@server1 qemu]# cat vmthin1.xml\n\n<!--\n\nWARNING: 这是一个自动生成的文件。对其进行的更改可能会被\n\
  覆盖并丢失。对此 xml 配置的更改应使用：\n\n  virsh edit vmthin1\n\n或其他使用 libvirt API 的应用程序。\n\n-->\n\
  \n<domain type='qemu'>\n  <name>vmthin1</name>\n  <uuid>61d74270-548b-4176-b34a-73faf7b421d8</uuid>\n\
  \  <memory unit='KiB'>524288</memory>\n  <currentMemory unit='KiB'>524288</currentMemory>\n\
  \  <vcpu placement='static'>1</vcpu>\n  <os>\n    <type arch='x86_64' machine='pc-i440fx-rhel7.0.0'>hvm</type>\n\
  \    <boot dev='hd'/>\n  </os>\n  <features>\n    <acpi/>\n    <apic/>\n    <pae/>\n\
  \  </features>\n  <clock offset='utc'/>\n  <on_poweroff>destroy</on_poweroff>\n\
  \  <on_reboot>restart</on_reboot>\n  <on_crash>restart</on_crash>\n  <devices>\n\
  \    <emulator>/usr/libexec/qemu-kvm</emulator>\n    <disk type='block' device='disk'>\n\
  \      <driver name='qemu' type='raw' cache='none' io='native'/>\n      <source\
  \ dev='/dev/vgthin/lvthin1'/>\n      <target dev='hda' bus='ide'/>\n      <address\
  \ type='drive' controller='0' bus='0' target='0' unit='0'/>\n    </disk>\n    <disk\
  \ type='block' device='cdrom'>\n      <driver name='qemu' type='raw'/>\n      <target\
  \ dev='hdc' bus='ide'/>\n      <readonly/>\n      <address type='drive' controller='0'\
  \ bus='1' target='0' unit='0'/>\n    </disk>\n  </devices>\n</domain>\n```\n\n*\
  \ * *\n\n由于虚拟硬件设置在配置文件中很容易访问……\n\n\n\n\n\n作为管理员，你偶尔需要更改虚拟机（VM）的属性。最简单的方法是通过“虚拟机管理器”（Virtual\
  \ Machine Manager）。要在虚拟机管理器中访问属性，你必须先打开虚拟机。虚拟机不需要启动，只需打开即可。打开后，点击类似灯泡的图标即可打开图 10.6\
  \ 所示的界面。\n\n![Image](img/10fig06.jpg)\n\n**图 10.6** 通过虚拟机管理器访问虚拟机属性。\n\n如你所见，虚拟机管理器属性界面提供了许多可用选项。其中许多选项是一目自明的的。通过此界面可以访问的一些常用配置任务如下：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) 要添加新硬件，点击窗口左下角的 `Add Hardware`（添加硬件）按钮。这将打开一个界面，你可以在其中选择要添加的硬件设备及其额外属性。\n\
  \n![Image](img/squf.jpg) 点击 `Performance`（性能）选项显示关于虚拟机使用的性能图表。\n\n![Image](img/squf.jpg)\
  \ 点击 `Memory`（内存）选项来增加或减少分配给虚拟机的内存大小。\n\n![Image](img/squf.jpg) 点击 `Boot Options`（启动选项）启用\
  \ Autostart（自启动）。这将在主机启动时启动虚拟机。\n\n![Image](img/squf.jpg) 在 Boot Options 界面，你还可以找到\
  \ `Boot Device Order`（启动设备顺序）。选择它以指定虚拟机中设备用于启动的顺序。\n\n### 从命令行管理虚拟机\n\nRHEL 提供了一个多功能的命令行界面，允许直接从命令行管理虚拟机。你可以使用带有许多不同参数的\
  \ `virsh` 命令来执行特定任务。你也可以直接输入 `virsh` 打开一个命令行界面，并在其中直接输入特定命令。表 10.2 显示了一些最常用的 `virsh`\
  \ 命令。\n\n![Image](img/key_topic.jpg)![Image](img/10tab02.jpg)\n\n**表 10.2 virsh**\
  \ 命令界面\n\n使用 `virsh` 命令时，你通常需要指定虚拟机名称。另一种方法是使用虚拟机 ID。使用 `virsh list` 获取虚拟机 ID 的概览。你将看到所有当前活跃的虚拟机\
  \ 列表（参见列表 10.6）。\n\n**列表 10.6** 生成活动虚拟机列表\n\n点击此处查看代码图像\n\n* * *\n\n```\n[root@lab\
  \ ~]# virsh list\n\n Id   Name                             State\n-----------------------------------------------\n\
  \ 3      dan-vm1                          running\n 4      dan-vm2             \
  \             running\n 6      sander-vm1                      running\n 7     \
  \ sander-vm2                      running\n 8      sander-ipa                  \
  \    running\n 10     vm1-rhel6-svv                    running\n 12     vm2-rhel6-svv\
  \                    running\n 16     sander-server1                   running\n\
  \ 18     dan-labipa                      running\n```\n* * *\n\n### 从 Top 监控虚拟机活动\n\
  \n在 Linux 上，你可以使用 `top` 工具来监控进程活动。正如本章前面提到的，从运行它的宿主机角度来看，虚拟机就像任何其他进程一样。这意味着虚拟机像其他其他进程一样使用资源。在\
  \ `top` 工具中，使用了一个有趣的参数来显示此类活动；CPU 利用行中的 `st` 参数表示虚拟机从虚拟机程序中“偷取”的 CPU 时间百分比。宿主机上的虚拟机本身在\
  \ `top` 中显示为单个进程。\n\n因此，在主机上使用 `top` 可以让你看到虚拟机相对于该机器上运行的其他进程的忙程度。你无法通过从主机上使用 `top`\
  \ 查看虚拟机内部发生了什么，但你必须通过虚拟机内部的适当工具完成这一点。图 10.7 显示了运行不同虚拟机的 KVM 主机上的 `top`。每个虚拟机在 `top`\
  \ 中都显示为单个进程。\n\n![Image](img/10fig07.jpg)\n\n**图 10.7** KVM 主机上的 top。\n\n\n\n\n\n\
  管理软件包是 Red Hat Enterprise Linux 区域管理员的一项重要任务。在本章中，你将学习如何使用 `yum` 工具从命令行管理软件包。你还学习了仓库在通过\
  \ `yum` 进行软件管理时起着什么作用。在本章的第二部分中，你将学习如何使用 `rpm` 命令管理软件，这对于查询新的软件包和已安装的软件包特别为重要。\n\
  \n## “我已经掌握这些了吗？”测试题\n\n“我已经掌握这些了吗？”自测题可以让你评估自己应该通彻阅读整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的自测有疑问，请阅读整个章节。表\
