  \n**a.** LVM 逻辑卷\n**b.** 具体的单个 RPM 包\n**c.** Firewalld 服务\n**d.** 以上所有\n\n### 基础主题\n\
  \n### 设置安装服务器\n\n在这一章中，你将学习如何设置安装服务器。如果你需要安装多个 Red Hat Enterprise Linux 实例，这将非常有用。使用安装服务器意味着你可以避免通过向每台物理服务器插入\
  \ DVD 来进行安装。相反，你将通过网络安装新服务器。此外，它允许你安装没有光驱驱动器的服务器（例如刀片服务器）。\n\n设置安装服务器涉及不同的步骤。\n\n\
  ![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) 首先，你需要让安装文件可用。为了做到这一点，你需要配置一个网络服务器。可以是\
  \ NFS、FTP 或 HTTP 服务器。\n\n![Image](img/squf.jpg) 接着，你需要向需要安装的客户端交付启动镜像。对于全自动网络安装，你需要设置\
  \ PXE 启动，通过与 DHCP 服务器协作为你的客户端提供启动镜像。\n\n![Image](img/squf.jpg) 作为设置安装服务器的最后一步，你创建一个\
  \ Kickstart 文件。这是一个包含安装服务器所需的所有设置的答案文件，也是设置完全自动安装的最后一步。Kickstart 文件可以通过安装服务器提供以实现全自动安装，但也可以在\
  \ USB 设备上提供。\n\n#### 将网络服务器配置为安装服务器\n\n设置安装服务器的第一步是将网络服务器配置为安装服务器。这涉及到将整个安装 DVD\
  \ 复制到网络服务器的共享中，使安装服务器成为在线存储库。之后，你可以使用客户端计算机访问安装文件。设置完成后，进行测试。你从普通的安装 DVD 或镜像启动并引用网络路径。一旦安装服务器完全启动，该程序将有用得多，因为启动镜像将由\
  \ TFTP 服务器提供。由于还没有 TFTP 服务器，你不得不使用安装 DVD。练习 20.1 将引导你完成这一过程。\n\n***\n\n### 练习 20.1\
  \ 设置网络服务器\n\n在本次练习中，你通过将安装所需的所有文件复制到 HTTP 服务器提供的目录中来设置网络服务器。完成后，你从虚拟机开始测试安装。要完成此练习，你需要你在第\
  \ 17 章“配置基础 Apache 服务器](#ch17.html_ch17)”中创建的 account.example.com 虚拟 Apache 服务器。\n\
  \n1.** 将 Red Hat Enterprise Linux 安装 DVD 插入服务器的光驱，并导航到安装磁盘上的 `Packages` 目录。\n\n\
  2.** 使用 `mkdir /www/docs/account.example.com/install` 在 Apache 文档根目录下为 account.example.com\
  \ 创建一个子目录。\n\n3.** 从挂载 Red Hat Enterprise Linux 安装 DVD 的目录，使用 `cp -R * /www/docs/account.example.com/install`\
  \ 将 DVD 上的所有文件复制到 Web 服务器文档根目录下的安装目录下。\n\n4.** 修改 `/etc/httpd/conf.d/account.example.com`\
  \ 中 server1 虚拟主机的配置文件，并确保它包含 `Options Indexes` 行。如果没有此行，虚拟主机只有在目录包含 `index.html`\
  \ 文件时才会显示目录内容。\n\n5.** 使用 `service httpd restart` 重启 Apache Web 服务器。\n\n6.** 启动浏览器并访问\
  \ `http://account.example.com/install`。你现在应该可以看到安装 DVD 的内容。\n\n7.** 启动虚拟机管理器（Virtual\
  \ Machine Manager）并创建一个新的虚拟机。将虚拟机命名为 `testnetinstall`，并在询问如何安装操作系统时选择“网络安装”。\n\n\
  **8.** 当被询问安装 URL 时，输入 `http://account.example.com/install`（并验证该 URL 可以解析）。安装现在应该开始了。\n\
  \n\n\n\n\n# 9. 现在，你可以中断安装程序并删除虚拟机了。你现在已经看到安装服务器正在运行，现在是时候进入流程的下一个阶段了。\n\n## 为 PXE\
  \ 启动设置 TFTP 和 DHCP 服务器\n\n![Image](img/key_topic.jpg)\n\n现在你已经设置好了网络安装服务器，是时候配置\
  \ PXE 启动了。这允许你通过服务器的网卡启动你想要安装的服务器。（通常情况下，你需要更改默认启动顺序，或者在启动时按某个键来激活 PXE 启动。）PXE 服务器将分发一个启动镜像，想要安装的服务器将使用该镜像来启动初始阶段阶段。\n\
  \n这涉及到两个步骤：你需要安装 TFTP 服务器并让它为 PXE 客户端提供启动镜像；你还需要配置 DHCP 来与 TFTP 服务器通信，以便为 PXE 客户端提供启动镜像。\n\
  \n### 注意\n在本节中，你将学习如何设置一个基于网络的安装服务器，该服务器还可以向客户端分发启动镜像。作为一种替代方案，你可以选择设置一个更简单的环境，即需要安装的客户端从本地启动镜像启动，然后从中引用网络安装服务器上的安装文件。为此，Red\
  \ Hat 在 RHN 上提供了 `boot.iso` 镜像。\n\n### 安装 TFTP 服务器\n安装的第一部分非常简单：你需要使用 `yum -y install\
  \ tftp-server` 安装 `tftp-server` 包。`tftpd` 服务由 `xinetd` 服务管理，为了告诉 `xinetd` 允许访问 TFTP，你需要打开\
  \ `/etc/xinetd.d/tftp` 文件（参见列表 20.1\n\n```bash\n[root@server1 ~]# cat /etc/xinetd.d/tftp\n\
  \n# default: off\n# description: The tftp server serves files using the trivial\
  \ file\n# transfer \\\n#      protocol.  The tftp protocol is often used to boot\
  \ diskless \\\n#      workstations, download configuration files to network-aware\n\
  #      printers, \\\n#      and to start the installation process for some operating\n\
  #      systems.\nservice tftp\n{\n       socket_type      = dgram\n       protocol\
  \        = udp\n       wait            = yes\n       user            = root\n  \
  \     server          = /usr/sbin/in.ftpd\n       server_args     = -s /var/lib/tftp\n\
  \       disable         = no\n       per_source      = 1\n       cps           \
  \  = 100 2\n       flags           = IPv4\n}\n```\n\n此时，简易文件传输协议 (TFTP) 服务器已运行。你现在必须配置动态主机协议\
  \ (DHCP) 来与 TFTP 服务器通信，以分发镜像。\n\n### 为 PXE 启动配置 DHCP\n在安装服务器上，没有 DHCP 服务器 TFTP 服务器无法存在。在进行\
  \ PXE 启动时，DHCP 服务器第一个响应，提供所有所需的 IP 相关配置以及将使用的 DHCP 服务器信息。因此，你现在必须安装 DHCP 服务器。使用\
  \ `yum install -y dhcp`。然后你必须创建一个子网并修改 DHCP 配置，使其能够向 PXE 客户端分发启动镜像。要做到这一点，请确保在 `dhcpd.conf`\
  \ 中包含以下内容（参见列表 20.2\n\n```text\nsubnet 192.168.1.0 netmask 255.255.255.0 {\n   option\
  \ routers 192.168.1.1 ;\n   range 192.168.1.200 192.168.1.250 ;\n   next-server\
  \ 192.168.1.70;\n   filename \"pxelinux/pxelinux.0\";\n}\n```\n\n在 DHCP 文件中，指定了一个子网。这是\
  \ PXE 服务器应该提供其服务的子网。在大多数配置中，这将是一个专用网络，这是一个好主意，因为你不希望执行 PXE 启动的工作站意外地安装了 Red Enterprise\
  \ Linux。如果你想在一个同样在使用依赖 PXE 启动的客户端的网络上提供基于 PXE 的安装服务，建议定义一个 `class` 语句来定义哪些机器允许使用\
  \ PXE 启动，哪些机器不允许。\n\n### 提示\n在考试中，不进一步规定哪些机器应该使用 PXE 服务器以及哪些不应该将不是问题。反正，你也不会有任何依赖\
  \ PXE 启动才能启动的内容。\n\n在子网定义中，`next-server` 语句提供了配置了 TFTP 的服务器 IP 地址。即使它在提供 DHCP 的同一台服务器上，你仍然应该指定\
  \ `next-server` IP 地址。`filename` 语句定义了应提供执行 PXE 启动的工作站的文件。注意，此文件名是相对于 TFTP 文件中定义的\
  \ TFTP 服务器根目录的。\n\n### 创建 TFTP PXE 服务器内容\n你现在已经准备好了具有适当设置的 DHCP 服务器，但到为止它还没有提供任何内容。本节描述了如何创建将通过\
  \ DHCP 提供的 TFTP PXE 服务器内容。\n\nPXE 服务器的作用是向执行 PXE 启动的客户端交付镜像。事实上，它取代了通常由 GRUB 2 和启动目录内容执行的任务，并在网络上提供引导加载程序。因此，为了配置\
  \ PXE 服务器，你需要将启动服务器所需的所有内容复制到 `/var/lib/tftpboot/pxelinux` 。你还需要创建一个执行通常由 `grub.conf`\
  \ 文件处理的任务的 PXE 启动文件。在练习 20.2 中，将所有所需内容复制到 TFTP 服务器根目录。\n\n`default` 文件在 PXE 启动配置中起着特殊作用。该文件包含所有\
  \ PXE 客户端的启动信息。如果你创建一个名为 `default` 的文件，将被所有允许进行 PXE 启动的客户端使用。你也可以通过在文件名中使用 IP 地址来为特定主机创建配置文件。但有一个限制；它必须是十六进制表示的\
  \ IP 地址。为了帮助你解决这一点，执行 PXE 启动的主机在启动时会在控制台上始终显示其十六进制 IP 地址。\n\n\n\n\n或者，你也可以自己计算十六进制\
  \ IP 地址。如果是这样的话，请确保为目标主机 IP 地址的四个部分计算十六进制值；你计算机上的计算器可以帮助你。例如，如果 IP 地址为 `192.168.0.200`，则十六进制值为\
  \ `C0.A8.0.C8`。因此，如果你创建一个名为 `C0A80C8` 的文件，该文件将仅被特定主机读取。对于你的 RHCSA 考试准备，你确实不需要做到那种程度。只需确保你提供一个可以被所有执行\
  \ PXE 启动的主机的默认配置即可。\n\n***\n\n## 练习 20.2 为 PXE 启动配置 TFTP 服务器\n\n要设置 TFTP 服务器，你需要配置\
  \ DHCP 服务器和 TFTP 服务器。请注意，网络上 DHCP 服务器的配置可能会导致冲突（注：此处原文为 \"cause problems\", 意为“引起问题”）。一个额外的复杂因素是\
  \ KVM 虚拟网络环境可能已经运行了一个 DHCP 服务器。因此，你不能使用将配置的 DHCP 服务器为虚拟机提供服务。为了确保本次练习成功，请确保你的 Red\
  \ Hat Enterprise Linux 服务器已断开网络，并仅连接到一台能够执行 PXE 启动的 PC。每个现代 PC 都应该能够进行 PXE 启动。你不需要为此目的重新安装你正在使用的电脑。你只需要测试它可以进行\
  \ PXE 启动即可。\n\n1. 使用 `yum install -y tftpserver` 安装 TFTP 服务器。由于 TFTP 由 `xinetd`\
  \ 管理，请使用 `systemctl enable xinetd` 使 `xinetd` 自动启动。\n\n2. 使用编辑器打开配置文件 `/etc/xinetd.d/tftp`，并将行\
  \ `disabled = yes` 改为 `disabled = no`。\n\n3. 如果尚未安装，请安装 DHCP 服务器。打开配置文件 `/etc/dhcp/dhcpd.conf`，并填入\
  \ Listing 20.2 中的内容。确保你使用的 IP 地址范围与网络上使用的 IP 配置匹配。\n\n4. 从 RHEL 安装光盘的 `Packages`\
  \ 目录将 `syslinux<version>.rpm` 复制到 `/tmp`。你需要从中提取文件 `pxelinux.0`，这是设置 PXE 启动环境的关键文件。要提取\
  \ RPM 文件，请使用 `cd /tmp` 进入 `/tmp` 目录，然后从那里使用 `rpm2cpio syslinux<version>.rpm | cpio\
  \ -idmv` 来提取该文件。\n\n***\n\n### 注意\n\n你也可以用更简单的方法执行此部分程序：只需安装 `syslinux` 包，并在安装后按照此处的描述将文件复制到正确的位置。\n\
  \n***\n\n5. 将 `/usr/share/syslinx/pxelinux.0` 文件复制到 `/var/lib/tftpboot/pxelinux`。\n\
  \n6. 使用 `mkdir /var/lib/tftpboot/pxelinux/pxelinux.cfg` 创建用于存储 pxelinux 配置文件的目录。\n\
  \n7. 在 `/var/lib/tftpboot/pxelinux/pxelinux.cfg` 中创建一个名为 `default` 的文件，其中包含以下行：\n\
  \n点击此处查看代码图像\n\n```text\ndefault Linux\nprompt 1\ntimeout 10\ndisplay boot.msg\n\
  label Linux\n          menu label ^Install RHEL\n          menu default\n      \
  \    kernel vmlinuz\n          append initrd=initrd.img\n```\n\n8. 如果你想在进行 PXE 启动时使用启动图像文件，将\
  \ `/boot/grub/splash.xpm.gz` 文件复制到 `/var/lib/tftptboot/pxelinux/`。\n\n9. 在 Red Hat\
  \ 安装光盘的 `images/pxeboot` 目录中，你可以找到 `vmlinuz` 和 `initrd.img` 文件。将它们复制到目录 `/var/lib/tftpboot/pxelinux/`。\n\
  \n10. 使用 `systemctl restart dhcpd` 和 `systemctl restart xinetd` 来（重）启动所需的服务。\n\n\
  11. 在服务器上，使用 `tail -f /var/log/messages` 跟踪发生的情况。将一台电脑直接连接到服务器，并从该电脑在启动菜单中选择 PXE\
  \ 启动。你会看到电脑开始进行 PXE 启动并加载你为它准备的安装镜像。\n\n12. 如果你想继续安装，当安装程序询问哪种介质包含安装介质时，选择 URL。然后，输入你在\
  \ 练习 20.1 中创建的 Web 服务器安装镜像的 URL：`http://account.example.com/install`。\n\n13. 最后，你需要通过以下四个指令指示防火启用流量：\n\
  \n点击此处查看代码图像\n\n```bash\nfirewall-cmd --permanent --add-service=dhcp\nfirewall-cmd\
  \ --permanent --add-service=tftp\nfirewall-cmd --permanent --add-service=http\n\
  firewall-cmd --reload\n```\n\n***\n\n在 练习 20.2 中，你设置了一个 PXE 服务器来启动安装。你可以使用同一个服务器添加一些额外的部分。例如，一个很有用的部分是救援系统，添加一个允许你从本地磁盘启动的部分也可能很有用。Listing\
  \ 20.3 中默认文件的示例内容显示了如何这样做。\n\n如果你在 PXE 菜单中添加更多选项，那么增加超时时间以允许用户做出选择也是有意义的。在 Listing\
  \ 20.3 中，这是通过使用 `timeout 600` 值实现的。但注意，如果你想像下一节所述的那样使用 Kickstart 文件进行自动化安装并使用 PXE\
  \ 服务器，这通常不是你想要的。\n\n### Listing 20.3 在 PXE 启动菜单中添加更多选项\n\n点击此处查看代码图像\n\n***\n\n\
  ```text\ndefault Linux\nprompt 1\ntimeout 600\ndisplay boot.msg\nlabel Linux\n \
  \         menu label ^Install RHEL\n          menu default\n          kernel vmlinuz\n\
  \          append initrd=initrd.img\nlabel Rescue\n          menu label ^Rescue\
  \ system\n          kernel vmlinuz\n          append initrd=initrd.img rescue\n\
  label Local\n          menu label Boot from ^local drive\nlocalboot 0xffff\n```\n\
  \n***\n\n#### 创建 Kickstart 文件\n\n你现在创建了一个环境，其中安装服务器所需的所有内容在另一台服务器上可用。因此，你不再需要使用光盘来执行安装。Red\
  \ Hat 为这一挑战提供了一个极佳方案：Kickstart 文件。在本节中，你将学习如何使用 Kickstart 文件进行完全自动安装，以及如何优化 Kickstart\
  \ 文件以适应你的需求。\n\n##### 使用 Kickstart 文件执行自动安装\n\n当安装 Red Hat 系统时，会在根用户的家目录下创建一个名为\
  \ `anaconda-ks.cfg` 的文件。该文件包含了安装计算机时使用的大部分设置。如果你想尝试自动 Kickstart 安装，这是一个很好的起点。\n\n\
  要指定使用 Kickstart 文件安装服务器，你需要告诉安装程序在哪里可以找到该文件。如果你想从本地 Red Hat 安装光盘进行安装，请在安装时添加 `ks=`\
  \ 参数。作为该参数的参数，添加文件的完整链接。例如，如果你将 Kickstart 文件复制到 `account.example.com` Web 服务器的文档根目录下，请在从\
  \ DVD 安装时添加以下行：\n\n![Image](img/key_topic.jpg)\n\n点击此处查看代码图像\n\n```text\nks=http://account.example.com/anaconda-ks.cfg\n\
  ```\n\n要在从 TFTP 服务器进行自动安装时使用 Kickstart 文件，你需要将 Kickstart 文件添加到 TFTP 默认文件中启动安装的章节。在这种情况下，你需要安装服务器的章节看起来如下：\n\
  \n点击此处查看代码图像\n\n```text\nlabel Linux\n          menu label ^Install RHEL\n     \
  \     menu default\n          kernel vmlinuz\n          append initrd=initrd.img\
  \ \\\n          ks=http://account.example.com/anaconda-ks.cfg\n```\n\n\n\n\n在此文件中，请确保菜单标签的标题以\
  \ `^` 开头，这将标识为菜单标签标题。同时，确保 `append` 行仅占一行，且以 `append` 开头并以 Kickstart 文件的 URL 结尾。\n\
  \n在使用虚拟机管理器（Virtual Machine Manager）安装虚拟机时，你也可以使用 Kickstart 文件。在练习 20.3 中，你将学习如何在没有\
  \ PXE 启动的情况下进行网络安装，并配置此安装使用 `anaconda-ks.cfg` 文件。\n\n# 练习 20.3 使用 Kickstart 文件进行虚拟机网络安装\n\
  \n在本次练习中，你将使用 Kickstart 文件对虚拟机进行网络安装。你将使用在练习 20.1 中创建的网络安装服务器。该网络服务器不仅用于访问安装文件，还用于提供\
  \ Kickstart 文件的访问。\n\n### 注意事项\n\n在此练习中，你使用的是安装服务器的 DNS 名称。如果安装失败并显示消息“无法检索 `http://account.example.com/install/images/install.img`”，那是因为\
  \ 无法解析 `account.example.com`。请改用安装服务器的 IP 地址。\n\n1. 在安装服务器上，将 `anaconda-ks.cfg`\
  \ 文件从 `/root` 目录复制到 `/www/docs/account.example.com` 目录。你可以直接将其复制到根目录。复制文件后，将权限设置为模式\
  \ `644`；否则 Apache 用户将无法读取。\n\n2. 启动虚拟机管理器并点击“创建虚拟机”按钮。为虚拟机输入名称，并选择“网络安装”（Network\
  \ Install）。\n\n3. 在“创建新虚拟机”向导的第二个屏幕中，输入 Web 服务器安装目录的 URL：[`account.example.com/install`](http://account.example.com/install)。打开\
  \ URL 选项并输入以下 Kickstart URL：`http://account.example.com/anaconda-ks.cfg`（参见图 20.1](#ch20.html_ch20fig01)）。\n\
  \n![Image](img/20fig01.jpg)\n\n**图 20.1** 指定使用 Kickstart 文件所需的选项。\n\n4. 接受“创建新虚拟机”向导中其余窗口中的所有默认选项，这将开始安装。在过程开始时，你会看到消息“正在检索\
  \ `anaconda-ks.cfg`”。如果该消息消失且你没有看到错误消息，说明 Kickstart 文件已正确加载。\n\n5. 在 Kickstart 文件加载后停止安装。该\
  \ Kickstart 文件并不是为虚拟机设计的，因此它仍然会询问很多问题。（本次练习的唯一目的是为了展示包含 Kickstart 文件实际上是可行的。）停止安装后，从虚拟机管理器中移除该\
  \ Kickstart 文件。\n\n## 使用 system-config-kickstart 修改 Kickstart 文件\n\n在在上一个练习中，你根据服务器安装完成后创建的\
  \ Kickstart 文件启动了 Kickstart 安装。你可能注意到仍然被提问了许多问题。这是因为你的 Kickstart 文件并不符合你尝试安装的虚拟机的硬件。在许多情况下，你需要微调\
  \ Kickstart 配置文件。要做到这一点，你可以使用 `system-config-kickstart` 图形界面（参见图 20.2](#ch20.html_ch20fig02)）。\n\
  \n![Image](img/20fig02.jpg)\n\n**图 20.2** 使用 `system-config-kickstart` 创建或调整 Kickstart\
  \ 文件。\n\n使用 `system-config-kickstart`，你可以创建新的 Kickstart 文件，也可以读取现有的 Kickstart 文件并进行所有所需的修改，而无需担心可能导致\
  \ Kickstart 文件失败的语法错误风险。\n\n### 注意事项\n\n在 RHEL 较早版本中，提供了许多 `system-config` 工具来使\
  \ RHEL 配置变得简单。在 RHEL 7 中，操作系统本身经过了重大修订，大多数 `system-config` 工具已被取代。`system-config-kickstart`\
  \ 实用程序是少数剩余的工具之一。如果你用过以前版本的 RHEL，你会发现它的界面看起来仍然非常像 RHEL 6 的安装界面，只是其中一些项目发生了变化。你还会发现，许多新功能（特别是\
  \ RHEL 7 中特有的新功能）在此界面中是不被支持的。例如，你无法通过 `system-config-kickstart` 创建 `firewalld` 配置；无法使用该工具配置\
  \ `LVM` 或安装单个 `RPM` 软件包。\n\n在“基本配置”（Basic Configuration）选项下，你可以找到服务器将要安装的基本选项，如键盘和时区。在这里，你还会找到设置根密码的界面。在“安装方法”（Installation\
  \ Method）下，你可以找到（以及其他内容）安装源。对于网络安装，你需要选择网络安装服务器的类型以及在该服务器使用的目录。在图 20.3](#ch20.html_ch20fig03)中，你可以看到你在练习\
  \ 20.1 中创建的安装服务器的样子。\n\n![Image](img/20fig03.jpg)\n\n**图 20.3** 指定网络安装源。\n\n在“引导加载程序选项”（Boot\
  \ Loader Options）下，你可以指定想要安装新的引导加载程序以及想将其安装在何。如果在启动时需要特定的内核参数，也可以在这里指定它们。一个重要的选项是“分区信息”（Partition\
  \ Information）（参见图 20.4](#ch20.html_ch20fig04)）。在这里，你可以告诉 Kickstart 你想在服务器上创建哪些分区。遗憾的是，界面不允许你创建逻辑卷。因此，如果你需要这些卷，就需要手动添加，这将在下一节中解释。\n\
  \n![Image](img/20fig04.jpg)\n\n**图 20.4** 创建分区。\n\n“网络配置”（Network Configuration）选项默认为空。如果你想让服务器使用网络，需要使用“添加网络设备”（Add\
  \ Network Device）选项指定设备名称以及你希望设备如何获取网络配置。“身份验证”（Authentication）选项提供了选项卡来指定外部验证服务，如\
  \ `NIS`、`LDAP`、`Kerberos` 等。如果你不指定其中任何项，则使用通过 `/etc/passwd` 的本地验证机制，这对于许多服务器来说是可以的。\n\
  \n如果你不喜欢 SELinux 和防火墙，请激活“防火墙配置”（Firewall Configuration）选项。SELinux 默认开启（在大多数情况下是好事），而防火墙默认关闭。如果你的服务器直接连接到互联网，请开启它并选择你允许的所有信任服务。在“显示配置”（Display\
  \ Configuration）选项上，你可以告诉安装程序服务器是否应该安装图形环境。\n\n一个有趣的选项是“软件包选择”（Package Selection）。该选项允许你选择软件包而不是单个软件包。如果你需要单个软件包，则需要创建手动配置。最后，“安装前脚本”（Pre-Installation\
  \ Script）和“安装后脚本”（Post-Installation Script）选项允许你向安装过程中添加脚本，以便在安装服务器时执行特定任务。\n\n\
  ## 手动修改 Kickstart 文件\n\n某些修改无法通过图形界面对 Kickstart 文件进行。幸运的是，Kickstart 文件是一个 ASCII\
  \ 文本文件，可以轻松编辑。通过手动修改，你可以配置诸如 `LVM` 逻辑卷或单个软件包等无法通过 `system-config-kickstart` 完成的任务。在列表\
  \ 20.4 中，你可以看到服务器安装时生成的 `anaconda-ks.cfg` 内容。研究这个文件非常有趣，因为它展示了所有无法通过图形界面完成的操作示例。\n\
  \n\n\n\n\n## 列表 20.4 `anaconda-ks.cfg`文件的内容\n\n点击此处查看代码图像\n\n```bash\n[root@server1\
  \ ~]# cat anaconda-ks.cfg\n\n#version=RHEL7\n\n# 系统授权信息\nauth --enableshadow --passalgo=sha512\n\
  \n# 使用 CDROM 安装媒体\ncdrom\n\n# 在首次启动时运行 Setup Agent\nfirstboot --enable\n\nignoredisk\
  \ --only-use=sda\n\n# 键盘布局\nkeyboard --vckeymap=us --xlayouts='us'\n\n# 系统语言\nlang\
  \ en_US.UTF-8\n\n# 网络信息\nnetwork  --bootproto=dhcp --device=eno16777736 --ipv6=auto\
  \ --activate\nnetwork  --hostname=localhost.localdomain\n\n# Root 密码\nrootpw --iscrypted\
  \ $6$w.otIj7Fjqpr4Gmy$Uwo6TCHDf8TzI98nyy3zagSi6HVrs4Ur\n8JI7J90.q5PtYi236k0Zo4rQp4kDyOY8zXS1dMbJadMNvSQ9Ul9SS1\n\
  \n# 系统时区\ntimezone America/New_York --isUtc\n\nuser --name=user\npassword=$6$CwZOJIdBeiVJmte0$cYFoDfuucuIzSOeS3FIQvhxl1T02mrfeo\n\
  BCAvybP9719/HN9qY7ZtWVJ5iKXdKTBgbFz8o3gBCAIKI4j4HrQD. --iscrypted\n--gecos=\"user\"\
  \n\n# X Window 系统配置信息\nxconfig  --startxonboot\n\n# 系统引导加载程序配置\nbootloader --location=mbr\
  \ --boot-drive=sda\nautopart --type=lvm\n\n# 分区清除信息\nclearpart --none --initlabel\n\
  \n%packages\n@base\n@core\n@desktop-debugging\n@dial-up\n@fonts\n@gnome-desktop\n\
  @guest-agents\n@guest-desktop-agents\n@input-methods\n@internet-browser\n@multimedia\n\
  @print-client\n@x11\n%end\n```\n\n`anaconda-ks.cfg` 文件以一些通用设置开头。需要关注的第一行是网络行。如你所示，它包含了设备名称\
  \ `--device eno16777736`。该设备名称与创建该文件的服务器特定硬件配置有关，它在许多硬件平台上可能无法工作。因此，最好将其替换为 `--device\
  \ eth0`。\n\n下一个感兴趣的参数是包含 root 密码的行。如所示，它包含了安装此服务器时使用的加密版 root 密码。如果你希望安装过程提示输入 root\
  \ 密码，可以完全删除此行；安装程序无法直接从 Kickstart 文件获取的所有内容都将通过提示输入。\n\n在这个示例 Kickstart 文件中，你可以看到使用\
  \ `autopart --type=lvm` 选项自动对磁盘分区。然后，指定了要使用的存储库。这可能也是需要更改的参数。`--baseurl` 参数包含一个指向你想要使用的安装\
  \ URL 的链接。例如，可以读取 `--baseurl=http://account.example.com/install` 来指代一个 http 安装服务器。\n\
  \n在下一节中，指定了要安装的软件包。所有以 `@` 开头的内容（例如 `@base`）均指 RPM 软件包组。可以通过直接提及软件包名称来专门添加单个软件包。\n\
  \n### 提示\n如果你没有遇到任何错误，但服务器似乎停滞或不提供安装文件，你可以切换到正在安装的服务器上的其他虚拟终端，检查是否显示了任何错误信息。要这样做，你可以使用\
  \ `Ctrl+Alt-F2` 到 `Ctrl+Alt-F7` 键组合。要返回图形安装界面，请使用 `Ctrl+Alt-F1`。\n\n#### 总结\n在本章中，你学习了如何设置安装服务器。你学习了典型的安装服务器由几个不同的部分组成。首先，你需要在网上提供可用的安装文件，在本章中是通过使用\
  \ Web 服务器完成的。然后，你需要一种机制来交付引导镜像。你学习了如何为此目的配置 `DHCP` 和 `TFTP`。最后，对于全自动安装，你需要答案文件。该答案文件由\
  \ `Kickstart` 提供。将所有这些结合在一起，你就可以使用一个功能完整的安装服务器。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\
