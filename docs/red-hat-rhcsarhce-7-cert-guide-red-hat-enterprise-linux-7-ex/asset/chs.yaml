  \                       --\nipv4.never-default:                        no\nipv4.may-fail:\
  \                            yes\nipv6.method:                             auto\n\
  ipv6.dns:\nipv6.dns-search:\nipv6.addresses:\nipv6.routes:\nipv6.ignore-auto-routes:\
  \                  no\nipv6.ignore-auto-dns:                    no\nipv6.never-default:\
  \                        no\nipv6.may-fail:                            yes\nipv6.ip6-privacy:\
  \                         -1 (unknown)\n```\n\n\n\n\n\n在此练习中，你使用 `nmcli con add`\
  \ 创建了网络连接。你也可以通过 `nmcli con mod` 修改当前连接的属性。在练习 8.4 中，你将使用 `nmcli` 修改某些连接参数。\n\n\
  * *\n\n* *\n\n# 练习 8.4 使用 nmcli 修改连接参数\n\n**1.** 使用 `nmcli con mod “static” connection\
  \ autoconnect no` 确保静态连接不会自动连接。\n\n**2.** 使用 `nmcli con mod “static” ipv4.dns 10.0.0.10`\
  \ 为静态连接添加一个 DHCP 服务器。注意，在添加网络连接时你使用的是 `ip4`，但在修改现有连接的参数时，你通常会使用 `ipv4`。这并不是输入错误，而是命令中的一种不一致性。\n\
  \n**3.** 若要为相同参数添加第二个项目，请使用 `+` 号。通过使用 `nmcli con mod “static” + ipv4.dns 8.8.8.8`\
  \ 添加第二个 DNS 服务器来测试此操作。\n\n**4.** 使用 `nmcli con mod`，你也可以更改现有 IP 地址等参数。尝试使用 `nmcli\
  \ con mod “static” ipv4.addresses “10.0.0.20/24” 10.0.0.100` 来测试。\n\n**5.** 若要添加第二个\
  \ IP 地址，再次使用 `+` 号：`nmcli con mod “static” +ipv4.addresses 10.20.30.40/16`。\n\n\
  **6.** 修改连接属性后，你需要激活它们。要做到这一点，你可以使用 `nmcli con up “static”`。\n\n* *\n\n这就是 RHCSA\
  \ 所需关于 `nmcli` 的全部内容。你喜欢它吗？可能不喜欢。该命令的精确语法可能很难记忆。幸运的是，有一个包含示例的优秀 man 页。输入 `man nmcli-examples`\
  \ 显示该帮助页；你会发现，如果你能找到这个帮助页，你就可以用 `nmcli` 做任何事情。\n\n## 使用 nmtui 配置网络\n\n如果你不喜欢 `nmcli`\
  \ 命令行复杂的语法，你可能会喜欢 `nmtui`。这是一个文本用户界面，允许你轻松创建网络连接。图 8.1 显示了 `nmtui` 界面的样子。\n\n![Image](img/08fig01.jpg)\n\
  \n**图 8.1** `nmtui` 界面。\n\n`nmtui` 界面由三个菜单选项组成：\n\n![Image](img/squf.jpg) **编辑连接：**\
  \ 使用此选项创建连接或编辑现有连接。\n\n![Image](img/squf.jpg) **激活连接：** 使用此（重新）激活连接。\n\n![Image](img/squf.jpg)\
  \ **设置系统主机名：** 使用此项设置你计算机的主机名。\n\n“编辑连接”选项提供了几乎你在处理网络连接时可能需要的所有功能。它确实允许你完成 RHCSA\
  \ 考试中需要执行的任何操作。你可以用它添加任何类型的连接。不仅支持以太网连接，还支持网络桥接和组网络驱动程序等高级连接类型。\n\n当你选择“编辑连接”选项时，你将获得一个丰富的界面，允许你编辑网络连接的大多数属性。编辑连接后，你需要先禁用它再重新激活它。这应该自动生效，但事实情况并非如此。\n\
  \n* *\n\n### 提示\n\n如果你喜欢图形用户界面 (GUI) 工具，那么你很幸运。使用 `nm-connection-editor` 代替 `nmtui`，但要准备好该界面提供的选项相对有限。它不包含高级选项，例如创建网络组网接口和管理网络桥接接口的选项。然而，它提供了管理网络连接上地址配置所需的所有功能。使用\
  \ `nm-connection-editor` 命令启动它，或通过 GNOME 图形界面中的应用插件启动它。图 8.2 显示了该工具默认界的样子。\n\n![Image](img/08fig02.jpg)\n\
  \n**图 8.2** `nm-connection-editor` 界面。\n\n* *\n\n## 处理网络配置文件\n\n你创建的每个连接都存储在 `/etc/sysconfig/network-scripts`\
  \ 目录下的配置文件中。文件名以 `ifcfg-` 开头，随后是网络接口的名称。在列表 8.7 中，你可以看到此类配置文件的样子。\n\n**列表 8.7**\
  \ `ifcfg` 配置文件示例\n\n点击此处查看代码图片\n\n* *\n\n```\n[root@server2 network-scripts]# cat\
  \ ifcfg-eno16777736\n\nTYPE=\"Ethernet\"\nBOOTPROTO=none\nDEFROUTE=\"yes\"\nIPV4_FAILURE_FATAL=\"\
  no\"\nIPV6INIT=\"yes\"\nIPV6_AUTOCONF=\"yes\"\nIPV6_DEFROUTE=\"yes\"\nIPV6_FAILURE_FATAL=\"\
  no\"\nNAME=eno16777736\nUUID=\"3b2a6a84-ea82-45d1-a82-45d176777736\"\nONBOOT=\"\
  yes\"\nIPADDR=192.168.4.20\nPREFIX=24\nGATEWAY=192.168.4.100\nDNS1=8.8.8.8\nDNS2=8.8.4.4\n\
  ```\n\n```8...7. *\n```\n\n* *\n\n### 提示\n\n使用 `hostnamecli` 配置主机名，你可以使用 `hostname\
  \ like set-hostname`。在修改文件后，使用 `nmcli reload` 激活更改。\n\n* *\n\n### 设置主机名和域名解析\n\n\
  为了与其他主机通信，使用了主机名。设置主机名解析以确保主机根据主机名联系另一个主机。在本节中。\n\n### 主机名\n\n由于主机名用于访问服务器及其提供的服务，因此了解系统主机名非常重要。主机名通常由部分组成。这些是主机名和主机所在的域名。这两个部分组成了完全限定域名\
  \ (FQDN)，看起来像 server.example.com。始终指定 FQDN 而不仅仅是主机名是一个良好的习惯。更改主机名有几种方法：\n\n1. 使用\
  \ `nmtui` 并选择**更改主机名**。\n2. 使用 `hostnamectl set-hostname`。\n3. 编辑 `/etc/hostname`\
  \ 的内容。\n\n使用 `hostnamectl` 配置主机名，你可以使用类似 `hostnamectl set-hostname myhost.example.com`\
  \ 的命令。设置主机名后，你可以使用 `hostnamectl status` 显示当前主机名。列表 8.8 显示了该命令的输出。\n\n```\n[root@server2\
  \ ~]# hostnamectl status\n  Static hostname: server2.example.com\n       Icon name:\
  \ computer\n       Chassis: n/a\n       Machine ID: 708ab34cdfca45d908224e0b37a8bf6\n\
  \       Boot ID: 9fa3baf6fe46420aaa44c324a76f40b2\n\n  Virtualization: vmware\n\
  \  Operating System: CentOS Linux 7 (Core)\n  CPE OS Name: cpe:/o:centos:centos:7\n\
  \  Kernel: Linux 3.10.0-123.el7.x86_64\n  Architecture: x86_64\n```\n\n* *\n\n`hostnamectl`\
  \ 命令是 RHEL 7 中的新命令。使用 `hostnamectl status` 时，你不仅可以看到关于主机名的信息，还能看到关于 Linux 内核、虚拟化类型等信息。\n\
  \n\n\n或者，你也可以使用 `nmtui` 接口设置主机名。图 8.3 显示了执行此项操作的屏幕。\n\n![Image](img/08fig03.jpg)\n\
  \n**图 8.3** 使用 `nmtui` 修改主机名。\n\n要设置主机名解析，通常使用 `DNS`。配置 `DNS` 并不是 RHCSA 的目标。除了 `DNS`\
  \ 之外，你可以在 `/etc/hosts` 文件中配置主机名。列表 8.9 显示了 `/etc/hosts` 文件的内容。\n\n**列表 8.9** `/etc/hosts`\
  \ 示例\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server1 ~]# cat /etc/hosts\n\n127.0.0.1\
  \   localhost localhost.localdomain localhost4\n::1         localhost.localdomain\
  \ localhost6\n```\n\n在 `/etc/hosts` 中设置的所有主机名 -IP 地址定义将在使用 `DNS` 中的主机名之前应用。这在 `/etc/nss.conf`\
  \ 的 `hosts` 行中被配置为默认，其默认如下：\n\n```\nhosts: dns\n```\n\n设置 `/etc/hosts` 文件非常简单；只需确保它至少包含两列。第一列是特定主机的\
  \ IP 地址，第二列指定主机名。主机名可以以短名称（如 `server1`）或 `FQDN`（完全限定域名）的形式提供。在 `FQDN` 中，包含了主机名和完整的\
  \ `DNS` 名称，例如 `server1.example.com`。\n\n如果一个主机有多个名称（例如短名称和完全限定域名），你可以在 `/etc/hosts`\
  \ 中指定这两个名称。在这种情况下，第二列必须包含 `FQDN`，第三列可以包含别名。列表 8.10 显示了一个主机名示例。\n\n**列表 8.10** `/etc/hosts`\
  \ 配置示例\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server2 ~]# cat /etc/hosts\n\n127.0.0.1\
  \   localhost.localdomain localhost4\n::1         localhost.localdomain localhost6\n\
  10.0.0.10  server1.example.com\n10.0.0.20  server2.example.com\n```\n\n### DNS 解析\n\
  \n如果你想与 Internet 上的其他主机通信，仅使用 `/etc/hosts` 文件是不够的。你还应该使用 DNS。要指定应使用哪个 `DNS` 服务器，请通过\
  \ `NetworkManager` 设置 `DNS` 服务器。`NetworkManager` 的配置将 `DNS` 信息存储在网络连接的配置文件中（位于 `/etc/sysconfig/network-scripts`），并从那里将配置推送到\
  \ `/etc/resolv.conf` 文件，该文件用于 `DNS` 名称解析。\n\n建议始终设置至少两个可连接的 `DNS` 名称服务器。如果第一个名称服务器没有响应，将联系第二个名称服务器。这就是为什么你想使用第二个名称服务器。如果第一个名称服务器超时或无法访问，则使用第二个服务器。要指定你想使用的哪些\
  \ `DNS` 名称服务器，你有几种选择：\n\n![Image](img/squf.jpg) 使用 `nmtui` 设置 `DNS` 名称服务器。图 8.4\
  \ 显示了你可以执行此操作的接口。\n\n![Image](img/08fig04.jpg)\n\n**图 8.4** 从 `nmtui` 接口设置 `DNS`\
  \ 服务器\n\n![Image](img/squf.jpg) 在 `/etc/sysconfig/network-scripts` 的 `ifcfg` 网络连接文件中设置\
  \ `DNS1` 和 `DNS2`。\n\n![Image](img/squf.jpg) 使用配置为分配 `DNS` 名称服务器地址的 `DHCP` 服务器。\n\
  \n![Image](img/squf.jpg) 使用 `nmcli con mod <connection-id> ipv4.dns <ip-of-dns>`。\n\
  \n注意，如果你的计算机配置为从 `DHCP` 服务器获取网络配置，则 `DNS` 服务器也会通过 `DHCP` 服务器设置。如果你不希望发生这种情况，你有两个：\n\
  \n![Image](img/squf.jpg) 编辑 `ifcfg` 配置文件以包含选项 `PEERDNS=no`。\n\n![Image](img/squf.jpg)\
  \ 使用 `nmcli con mod <con-name> ipv4.ignore-auto-dns yes`。\n\n要验证主机名解析，你可以使用 `getent\
  \ hosts <servername>` 命令。该命令会在 `/etc/hosts` 和 `DNS` 中搜索以解析指定的主机名。\n\n***\n\n###\
  \ 考试提示\n\n不要直接在 `/etc/resolv.conf` 中指定 `DNS` 服务器。它们会被 `NetworkManager` 覆盖。\n\n***\n\
  \n#### 总结\n\n在本章中，你学习了如何在 RHEL 7 中配置网络。首先，你学习了如何使用 IP 协议连接计算机，然后学习了使用哪些技术使主机之间的服务变得可用。接下来，你学习了如何使用\
  \ `ip` 工具及相关工具验证网络配置。在本章的最后部分，你学习了如何使用 `nmcli` 或 `nmtui` 工具永久地设置 IP 地址和其他主机配置。\n\
