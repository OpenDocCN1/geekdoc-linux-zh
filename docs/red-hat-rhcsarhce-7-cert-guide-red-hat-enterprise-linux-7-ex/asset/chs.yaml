  \ 单元并形成最终的运行环境。\n\n本章的第二部分讨论了 `GRUB2` 以及如何将更改应用于 GRUB 2 引导加载程序。故障排除不是本章的主题；它包含在第\
  \ 19 章“启动过程故障排除”中。\n\n### “我已经掌握这些了吗？”测试\n\n“我已经掌握这些了吗？”测试允许你评估自己是否应该透彻阅读整个章节，还是跳转到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
