  **d. `yum list all`**\n\n**7.** 哪个命令允许你找到回滚通过 `yum` 发出的命令所需的 yum ID 号？\n\n**a. `yum\
  \ show all`**\n**b. `yum show recent`**\n**c. `yum show history`**\n**d. `yum history`**\n\
