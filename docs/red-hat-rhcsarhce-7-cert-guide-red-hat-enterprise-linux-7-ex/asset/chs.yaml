  \ iSCSI 磁盘可以自动挂载。在本节中，你将学习如何操作。\n\n#### 练习 26.3 建立 iSCSI 连接并持久化\n在配置 iSCSI 连接后，你需要确保它在重启后能够自动恢复。你还需要确保\
  \ iSCSI 磁盘可以自动挂载。在本节中，你将学习如何操作。\n\n#### 练习 26.3 建立 iSCSI 连接并持久化\n1. 在服务器 2 上，打开\
  \ root 终端并输入 `yum -y iscsi-initiator-utils lsscsi` 以安装练习所需的软件。\n2. 输入 `iscsiadm\
  \ --mode discovery --type sendtargets --portal 192.168.4.210 --discover`。这将返回你在上一个练习中配置的\
  \ iSCSI 目标。\n3. 接下来，输入 `iscsiadm --mode node --targetname iqn.2014-11.com.example:target1\
  \ --portal 192.168.4.210:3260 --login`。\n4. iSCSI 设备现在应该是可用。输入 `lsscsi` 显示它们。你应该看到三个\
  \ LIO 设备。使用 `iscsiadm -m session -P3` 也可以显示所有磁盘。\n5. 在第一个 iSCSI 设备上（在本练习中假设它是 `/dev/sdb`，但根据你的服务器配置，可能是不同的设备），输入\
  \ `mkfs.xfs /dev/sdb`。\n6. 使用 `blkid /dev/sdb` 获取你刚刚创建的 XFS 文件系统的设置 UUID。\n7. 为\
  \ iSCSI 磁盘创建一个挂载点，使用 `mkdir /mnt/iscsi`。\n8. 输入 `vim /etc/fstab` 在编辑器中打开 `/etc/fstab`\
  \ 文件，并添加如下行。（请确保将 UUID 替换为在本练习第 6 步中找到的 UUID。）\n\n点击此处查看代码图像\n\n```\nUUID=XXXXXXXX-XXXX-XXXX-XXXXXX\
  \ /mnt/iscsi  xfs  netdev  0 2\n```\n\n9. 输入 `mount -a`。这将挂载 iSCSI 磁盘。在不带任何参数的情况下输入\
  \ `mount` 进行验证。\n\n\n\n\n正如你在本章中所看到的，设置 iSCSI 配置是一项复杂的任务，可能会出现许多问题。因此，当 iSCSI 连接无法工作时，进行一些故障排除可能会很有。以下提示：\n\
  \n![Image](img/squf.jpg) 在 target 上，使用 `systemctl status target` 验证其运行状态。\n\n![Image](img/squf.jpg)\
  \ 在 initiator 上，使用 `systemctl status iscsi` 验证 `isdir` 进程。\n\n![Image](img/squf.jpg)\
  \ 在 target 上，输入 `targetcli` 然后输入 `ls` 来验证配置。\n\n![Image](img/squf.jpg) 在 initiator\
  \ 上，使用 `iscsiad -m session -P 3` 获取关于 iSCSI 磁盘的当前信息。使用 `grep attached` 查看哪些设备已连接。\n\
  \n![Image](img/squf.jpg) 如果你收到“iSCSI login failed due to authorization”的消息，请检查你是否更改了\
  \ `/etc/iscsi/initiatorname`。此外，确保你已经重启了 `isdir` 进程。\n\n#### 总结\n\n在本章中，你学习了如何设置\
  \ iSCSI SAN。本章的第一部分解释了如何使用 iSCSI target 软件配置 SAN。在第二部分中，你学习了如何配置 iSCSI initiator\
  \ 连接到 iSCSI SAN。你还学习了当它不按预期工作时可以做什么。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n回顾本章中用页边\
