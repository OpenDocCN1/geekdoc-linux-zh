  \n**10.** TFTP 服务器的默认主目录是什么？\n\n### 章节末实验\n在章节末实验中，你将设置一个由 HTTP 安装源、DHCP 服务器和 Kickstart\
  \ 文件组成的安装服务器。为了成功完成此练习，在一个没有运行的 DHCP 服务器的网络中进行工作是重要的。\n\n#### 实验 20.1\n**1.** 设置一个\
  \ HTTP 安装服务器，以提供对安装文件的访问。\n**2.** 配置 DHCP 和 TFTP，以便为需要安装的客户端提供引导镜像。\n**3.** 创建一个\
  \ Kickstart 文件，提供基本安装的所有设置。使用最小安装模式，但请确保至少满足以下要求：\n- 将 `/home` 放在单独分区或逻辑卷上。\n- 同时安装\
  \ `nmap` 软件包。\n**4.** 使用你刚刚创建的安装服务器安装虚拟机。\n\n\n\n\n\n![Image](img/squf.jpg) 使用布尔设置修改系统\
  \ SELinux 设置\n\n![Image](img/squf.jpg) 诊断并解决常规 SELinux 策略违规\n\n从 Linux 早期开始，文件权限一直是保护\
  \ Linux 系统的标准方法。在某些情况下，仅靠文件权限不足以确保服务器的安全。让我们来看一个例子：\n\n*某天早上，我发现我的服务器被黑客入侵了。入侵者通过我\
  \ Web 服务器上的一个漏洞脚本突破了防御，并以 `httpd` 用户身份获得了 shell 访问。利用这些文件访问权限，他创建了数千个小型 PHP 脚本，并参与了大规模的\
  \ DDoS 攻击。*\n\n从安全的角度来看，有趣的是这台服务器的安全设置并没有问题。所有权限都设置得恰当，而且 `httpd` 用户像 Linux 服务器上的任何其他用户一样，确实拥有在\
  \ `/var/tmp` 以及 `/tmp` 中创建文件的权限。那么，防止此类问题的良好解决方案是什么呢？\n\n当然，你可能会认为 Web 服务器的管理员本应该做得更好，并应该监控服务器上脚本在做什么。但并不是\
  \ Linux 服务器的正常使用方式。Linux 服务器管理员并不知道运行在服务器上的所有应用程序，而应用程序管理员对 Linux 的了解也不足以以确保此类事件绝不会发生。\n\
  \n另一个解决方案是应用进一步的安全措施。例如，如果通过使用 `noexec` 挂载选项取消从 `/tmp` 和 `/var/tmp` 目录运行程序文件的权限，这种特定情况就可以被避免。但即使对于这种特定情况有效，它并不是一个防止应用程序执行不应执行的操作的良好整体安全解决方案。\n\
  \n这就是发明 SELinux 的原因。SELinux 为 Linux 服务器提供了强制访问控制（mandatory access control），除非被专门允许，否则每个系统调用都会被拒绝。本章将解释如何使用\
  \ SELinux 来确保你的服务器上永远不会发生严重的安全事件。\n\n***\n\n**提示**\n\n无论如何，请务必确保在考试结束时 SELinux 在你的服务器上正在运行。如果没有它在运行，你将损失许多分！\n\
