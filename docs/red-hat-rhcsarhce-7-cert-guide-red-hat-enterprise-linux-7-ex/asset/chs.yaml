  \ `sysctl` 命令将设置写入 sysctl 配置参数，而不更新配置文件？\n\na. `sysctl -w`\n\nb. `sysctl -p`\n\n\
  c. `sysctl -n`\n\nd. `sysctl -v`\n\n### 基础主题\n\n## 理解系统优化的基础\n\nLinux 内核提供了一个复杂的框架，使你的服务器能够以最佳方式运行。默认情况下，它是针对平均工作负载调优的。在许多服务器上，平均工作负载并不够用，这就是为什么提供了一些高级的\
  \ Linux 调优参数。\n\n通过对 Linux 调优参数进行修改，你可以极大提高服务器的性能。不过，这其中存在风险。调整服务器导致性能变差而不是变好也是相对容易的。这就是为什么\
  \ Linux 性能调优应该由清楚自己在做什么的专家来完成。要精通 Linux 性能调优，需要的远比 RHCE 书中的一个章节要多得多。这就是为什么红帽在 RHCA\
  \ 课程中专门设立了一整门课程。在本章中，你将学习 Linux 性能调优的最基础知识。\n\n即使在本章中我们只涵盖性能调优基础知识，但开始讨论一些通用指南也是好的（这为了防止你变得过于热情，以免在以后导致事故）。\n\
  \n首先，性能调优涉及大量的研究。你已经在本书的早期读过相关内容。在进行研究后，你可以静地开始优化性能。不过，需要遵循一些规则：\n\n![Image](img/squf.jpg)\
  \ **1:** 永远不要在生产服务器上尝试任何设置。使用测试系统进行试验，并仅将你验证过的设置应用到生产服务器。\n\n![Image](img/squf.jpg)\
  \ **2:** 一次更改一个设置并进行彻底测试。良好的测试通常意味着将相同的测试重复三次。如果在进行三次测试后仍然看到显著的改进，你就知道这次修改是有效的。\n\
  \n![Image](img/squf.jpg) **3:** 在开始之前制定计划。过多的性能优化是在没有良好计划的情况下发生的，导致管理员并没有在真正改进性能，而是在随机更改设置，希望从中产生什么好结果。\n\
  \n如果你准备好按照这些规则行事，就可以继续阅读下一节。\n\n## 理解 /proc 文件系统\n\nLinux 性能调优的关键在于 `/proc` 文件系统。该文件系统提供了\
  \ Linux 内核的接口，可以用于分析内核的当前状态并对不同的设置进行修改。在接下来的章节中，你将学习如何从 `/proc` 文件系统中获取性能优化信息，以及如何通过它优化性能。\n\
  \n***\n\n注意\n\n许多（如果不是所有）系统实用程序（包括 `lscpu`、`uname`、`top`、`ps`、`lsmod` 等）都是从 `/proc`\
  \ 文件系统获取它们显示的信息。因此，如果你不喜欢频繁读取 `/proc` 文件系统，只需找到合适的工具即可。\n\n***\n\n### 使用 /proc 分析性能\n\
  \n`/proc` 文件系统包含许多文件，提供了有关 Linux 服务器当前性能状态的信息。你在上一节中学到的大多数性能分析实用程序都是从 `/proc` 文件系统获取信息的。表\
  \ 28.2 提供了重要性能相关文件的概述。\n\n![Image](img/key_topic.jpg)![Image](img/28tab02.jpg)\n\
  \n**表 28.2** `/proc` 性能相关文件\n\n除了 表 28.2 中提到的配置文件外，还有进程 ID (PID) 目录。每个在 Linux 上运行的进程都有一个唯一的\
  \ `PID`，且每个进程都构建了自己的环境。虽然不易于阅读，但可以通过 `PID` 目录访问该环境。在这些目录中，你会找到包含内存使用详细信息的 `status`\
  \ 文件，或者提供进程所用所有环境变量概述的 `environ` 文件。显示列表 28.1 显示了 `status` 文件的内容可能的样子。注意，它包含了无法通过任何其他方式轻松显示的信息，包括与该特定进程相关的上下文切换次数。\n\
  \n**显示列表 28.1** 通过 PID 目录分析进程分配的内存状态\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server2\
