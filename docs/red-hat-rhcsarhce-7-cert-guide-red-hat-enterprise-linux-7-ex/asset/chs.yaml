  \ undo 14`。在练习 11.2 中，你将应用之前讨论过的一些常用的 `yum` 命令。\n\n## 练习 11.2 使用 yum 进行软件包管理\n\n\
  在此练习中，你将使用 `yum` 执行常见的软件包管理任务。\n\n1. 输入 `yum repolist` 显示系统正在使用的存储库列表。\n2. 输入 `yum\
  \ search xeyes`。这不会产生任何匹配结果。\n3. 输入 `yum provides */xeyes`。该命令显示 `xorg-x11-apps-<version>`\
  \ 软件包包含此文件。\n4. 使用 `yum install -y xorg-x11-apps` 安装此软件包。根据你当前的配置，你可能会发现还需要安装许多依赖项。\n\
  5. 输入 `yum list xorg-x11-apps`。你会看到该软件包被列为已安装。\n6. 输入 `yum history` 并注意你上次使用的 `yum`\
  \ 命令的编号。\n7. 输入 `yum history undo <nn>`（其中 `<nn>` 替换为第 6 步中找到的数字）。这将撤销上次操作，从而删除你刚刚安装的软件包。\n\
  8. 重复 `yum list xorg-x11-apps` 命令。该软件包现在被列为可用，但未已安装。\n\n## 使用 rpm 管理软件软件包\n\n很久以前，并不存在存储库，在下载软件包文件后，使用\
  \ `rpm` 命令来安装这些文件。这种方法虽然行得通，但存在一个重大问题：依赖地狱。由于 RPM 软件包一直关注特定功能，为了安装特定的软件，通常需要一组 RPM\
  \ 软件包。因此，当用户尝试安装 RPM 软件包时，经常会发出“缺少依赖项”的提示信息，这意味着为了安装选定的软件包，必须先安装其他软件包。\n\n有时甚至需要安装整个依赖链才能获得所需的功能。这并不能让处理\
  \ RPM 软件包成为一种愉悦的体验。\n\n在现代的 RHEL 系统上，使用了存储库，并使用 `yum` 安装软件包。`yum` 命令会考虑所有的软件包依赖关系，并尝试在当前用的存储库中查找它们。在配置为从\
  \ RHN 网络更新的 RHEL 系统上，或在使用一致存储库的 CentOS 系统上，结果是现在的软件包安装已经没有问题，不再需要使用 `rpm` 命令进行软件安装。\n\
  \n即使在下载了 RPM 软件包文件，你也不再需要使用 `rpm -Uvh packagename` 命令来安装它（尽管它仍然有效）。一个更好的替代方案是 `yum\
  \ install packagename`，它在安装软件包的同时还会考虑存储库以自动解决依赖关系。（在 RHEL 的早期版本中，使用 `yum localinstall`\
  \ 命令执行此操作；在 RHEL 7 中，`yum localinstall` 已被弃用。）这并不意味着 `rpm` 命令完全没用了。你仍然可以使用它来查询 RPM\
  \ 软件包。\n\n### 提示\n\n在你的系统中，维护着两个软件包数据库：yum 数据库和 rpm 数据库。当你通过 `yum` 安装软件包时，首先会更新\
  \ yum 数据库，然后将更新的信息同步到 rpm 数据库。如果你使用 `rpm` 命令安装软件包，更新将只会写入 rpm 数据库，而不会更新到 yum 数据库，这就是不再停止使用\
  \ `rpm` 命令安装软件软件包的重要原因。\n\n### 理解 RPM 文件名\n\n在直接处理 RPM 软件包时，理解 RPM 文件名的组成是有意义的。一个典型的\
  \ RPM 文件名看起来像 `autofs-5.0.7-40.el7.x86_64.rpm`。这个名称由几个部分组成：\n\n- **autofs:** 实际软件包的名称。\n\
  - **5.0.7:** 软件包的版本。这通常对应于软件包创建者发布的软件包名称。\n- **-40:** 软件包的子版本（修订版本）。\n- **el7:**\
  \ 创建此软件包的 Red Hat 版本。\n- **x86_64:** 创建此软件包的平台（32 位或 64 位）。\n\n### 查询 RPM 数据库\n\n\
  `rpm` 命令允许你获取关于软件包的大量信息。使用 RPM 查询是发现软件如何配置和使用的一种非常有用的方法。首先，你可以使用 `rpm -qa` 命令。与\
  \ `yum list installed` 类似，它会显示机器上已安装的所有软件列表。对该命令使用 `grep` 来查找特定的包名。要对 RPM 软件包进行查询，你只需要名称而不需要版本信息。\n\
  \n在找到想要更多信息的软件包后，你可以从一些通用查询开始，找出软件包中包含的内容。在接后的示例中，假设你正在对 nmap RPM 软件包使用 RPM 查询。首先，输入\
  \ `rpm -qi nmap` 获取软件包的描述。\n\n下一步是使用 `rpm -ql nmap`，它会显示软件包中包含的所有文件列表。对于某些软件包，结果可能是一份很长的文件名列表，并不特别。要获取更具体的信息，请使用\
  \ `rpm -qd nmap`，它会显示该软件包的所有文档，或使用 `rpm -qc nmap`，它会显示软件包中所有的配置文件。\n\n使用 RPM 查询可以非常有帮助获取有关软件包的更有用的信息。你只需要知道特定文件属于哪个\
  \ RPM 软件包。要查找这一点，请使用 `rpm -qf` 加上你要查找的文件。例如，使用 `rpm -qf /bin/ls` 来查找 `ls` 命令所属的\
  \ RPM 软件包。在练习 11.3 中，你将看到以这种方式使用 RPM 查询是非常有用的。\n\n### 查询 RPM 软件包文件\n\nRPM 查询默认用于\
  \ rpm 数据库，你查询的是已安装的 RPM。有时在安装 RPM 之前进行查询是有意义的。这样做，你需要在查询中添加 `-p` 选项，因为没有 `-p` 选项，查询的就是数据库而不是软件包文件。此外，在查询软件包文件时，你需要完整的文件名，包括版本号和其他所有信息，而这些在查询\
  \ RPM 数据库时是不需要的。\n\n一个需要特别注意的查询选项是 `--scripts`。该选项查询 RPM 软件包以查看包含哪些脚本（如果有）。该选项在与\
  \ `-p` 选项结合时特别重要，用于检查你将安装的软件包是否包含任何脚本。\n\n当你安装 RPM 软件包时，你是以 root 身份执行的。在安装未知来源的\
  \ RPM 软件包之前，你真的需要确保它不包含任何恶意脚本。如果你不这样做，就有可能在不知情的情况下在电脑上安装恶意软件。\n\n表 11.5 描述了最重要的\
  \ RPM 查询选项。\n\n### 使用 repoquery\n\n\n\n\n\n虽然 `rpm -qp` 提供了安装前查询软件包的实用工具，但该命令存在一个小问题：它仅对\
  \ RPM 软件包文件有效，无法直接从存储库查询文件。如果你想在安装之前查询存储库中的软件包，你需要 `repoquery`。该二进制文件默认未安装，因此请确保安装了\
  \ `yum-utils` RPM 包以使用它。\n\n`repoquery` 命令与 `rpm -q` 命令非常相似，并使用了许多相似的选项。只是缺少了一个重要的选项：`--script`\
  \ 选项。简单的解决方案是确保你只使用受信任的存储库，以防止安装包含危险脚本代码的软件。\n\n如果你需要彻底分析 RPM 软件包在安装时在做什么，可以将其下载到本地机器，这样你就可以对包使用\
  \ `rpm -qp --scripts` 命令。要将软件包从存储库下载到本地目录，可以使用 `yumdownloader` 命令，它来自 `yum-utils`\
  \ 软件包。\n\n现在你已经学习了所有的 RPM 查询选项，你可以在练习 11.3 中练习这些新掌握的技能。\n\n***\n\n## 练习 11.3 使用\
  \ RPM 查询\n\n在此练习中，你将学习如何使用 RPM 查询来获取有关 RHEL 系统上安装的软件的新信息。\n\n**1.** 输入 `which dnsmasq`。此命令给出\
  \ `dnsmasq` 命令的完整路径名。\n\n**2.** 输入 `rpm -qf $(which dnsmasq)`。这将对 `which dnsmasq`\
  \ 命令的结果执行 RPM 文件查询；你可以在第 31 章“Bash Shell 脚本简介”中学习更多此类技术。\n\n**3.** 现在你已经知道 `dnsmasq`\
  \ 二进制文件来自 `dnsmasq` 软件包，使用 `rpm -qi dnsmasq` 显示更多关于该软件包的信息。\n\n**4.** `rpm -qi`\
  \ 显示的信息很有用，但它没有提供开始使用包中软件所需的细节。使用 `rpm -ql dnsmasq` 显示包中所有文件的列表。\n\n**5.** 使用 `rpm\
  \ -qd dnsmasq` 显示可用的文档。注意，此命令显示有一个手册页（man page），但在 `/usr/share/doc/dnsmasq-version`\
  \ 目录中还有 `doc.html` 和 `setup.html` 文件。用浏览器打开这些文件以获取有关 `dnsmasq 使用的更多信息。\n\n**6.**\
  \ 输入 `rpm -qc dnsmasq` 查看 `dnsmasq` 使用了哪些配置文件。\n\n**7.** 安装后这看起来意义不大，但了解软件包安装时执行了哪些脚本总是是好的。使用\
  \ `rpm -q --scripts dnsmasq` 显示可以从此 RPM 执行的脚本代码。\n\n***\n\n***\n\n### 提示\n\n处理 RPM\
  \ 查询在 RHCSA 和 RHCE 考试中是一项非常有价值的技能。如果你知道如何处理查询，就可以找到所有相关的配置文件和文档。\n\n***\n\n####\
  \ 总结\n\n在本章中，你学习了如何在 Red Hat Enterprise Linux 上处理软件。你学习了如何使用 `yum` 管理来自存储库的软件软件包。你还学习了如何使用\
  \ `rpm` 命令对系统上的软件包进行查询。确保你熟练掌握这些基础性技能；它们是在 Red Hat Enterprise Linux 上完成工作的关键。\n\n\
