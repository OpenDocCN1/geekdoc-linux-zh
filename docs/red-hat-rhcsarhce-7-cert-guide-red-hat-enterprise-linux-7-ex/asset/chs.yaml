  \n\n\n\n![Image](img/squf.jpg)\n#### 模块 (MODULES)\nrsyslogd 是模块化的。包含模块是为了增强 rsyslogd\
  \ 支持的功能。有关 rsyslogd 模块的更多信息，请参阅第 29 章“配置高级日志功能”。\n\n![Image](img/squf.jpg)\n####\
  \ 全局指令 (GLOBAL DIRECTIVES)\n此部分用于指定全局参数，例如辅助文件的写入位置或默认的时间戳格式。\n\n![Image](img/squf.jpg)\n\
  #### 规则 (RULES)\n这是 `rsyslog.conf` 文件中最重要的部分。它包含了指定哪些信息应该记录到哪个目的地的规则。\n\n##### 理解设施、优先级和日志目的地\n\
  \n为了指定哪些信息应该记录到哪个目的地，rsyslogd 使用了设施（facilities）、优先级（priorities）和目的地（destinations）：\n\
  \n![Image](img/squf.jpg) `设施` 指定了被记录信息的类别。Rsyslogd 使用固定的设施列表，该列表无法扩展。这是为了与旧的 syslog\
  \ 服务保持向后兼容。\n\n![Image](img/squf.jpg) `优先级` 用于定义需要记录的消息的严重。在指定优先级时，默认情况下，所有该优先级及更高优先级的消息都会被记录。\n\
  \n![Image](img/squf.jpg) `目的地` 定义了消息应该写入的位置。典型的目的地是文件，但也可以使用 rsyslog 模块作为目的地，以便允许通过\
  \ rsyslogd 模块进行进一步处理。\n\n列表 13.3 显示了 rsyslog 中 RULES 部分的示例。\n\n**列表 13.3** rsyslog\
  \ 中 RULES 部分的示例\n\n点击此处查看代码图片\n\n***\n\n#### RULES (规则)\n\n```bash\n# 将所有内核消息记录到控制台。\n\
  \n# 记录太多内容会弄乱屏幕。\n#kern.*                                       /dev/console\n\n\
  # 记录任何（邮件外）为 info 或更高级别的信息。\n# 不要记录私有的认证消息！\n*.info;mail.none;authpriv.none;cron.none\
  \    /var/log/messages\n\n# authpriv 文件有访问限制。\nauthpriv.*                      \
  \            /var/log/secure\n\n# 将所有邮件消息记录在一个地方。\nmail.*                      \
  \                -/var/log/maillog\n\n# 记录 cron 内容\ncron.*                     \
  \                 /var/log/cron\ncron.*                                      /var/log/maillog\n\
  \n# 所有人都会接收紧急消息\n*.emerg                                     :omusrmsg\n\n# 将 crit\
  \ 及更高级别的最新错误保存到特殊文件中。\nuucp,news.crit                              /var/log/spool\n\
  ```\n\n***\n\n在列表 13.3 中，你可以看到如何使用不同的设施和优先级来定义可以记录信息的位置。可用的设施和优先级是固定的，无法添加。表 13.3\
  \ 显示了哪些设施是可用的，表 13.4 显示了所有优先级的列表。\n\n![Image](img/key_topic.jpg)![Image](img/13tab03.jpg)\n\
  **表 13.3** rsyslogd 设施\n\n指定目的地时，通常使用文件。如果文件名以连字符开头（例如 `-var/log/maillog`），则日志消息不会立即提交文件，而是会被缓冲以提高写入效率。也可以使用设备文件，例如\
  \ `/dev/console`。如果使用此设备，消息将实时写入控制台。在现代服务器上，这通常没有意义，因为管理员通常进行远程日志记录，无法看到服务器控制台上正在发生什么。\n\
  \n为了增强 rsyslogd 的功能，可以使用模块对消息进行进一步处理。如果需要，可以将模块名指定为 `:modulename:`。在第 29 章中，你将学习更多关于\
  \ rsyslog 模块配置的知识。\n\nsyslog 设施定义于 20 世纪 80 年，为了保证向后兼容，不能添加新的设施。结果是某些设施仍然存在，但基本上已经没有作用了，而某些在后期阶段变得相关的服务并没有它们自己的设施。作为解决方案，可以使用两种特定的设施类型。`daemon`\
  \ 设施是一个通用设施，可以被任何守护进程使用。此外，可以使用 `local0` 到 `local7` 设施。\n\n如果某些服务虽然没有自己的 rsyslogd\
  \ 设施，但仍然将日志消息写入特定的日志文件，可以将这些服务配置为使用 `local0` 到 `local7` 设施中的任何一个。接下来，你必须配置这些服务也使用这些设施。执行此操作的程序取决于你正在使用的服务。然后，你需要在\
  \ `rsyslog.conf` 文件中添加一条规则，将通过该设施传入的消息发送到特定的日志文件。练习 13.2 显示了如何这样做。\n\n要确定应该记录哪些类型的消息，可以查看哪些严重性是可用的。表\
  \ 13.4 提供了优先级的概述。\n\n![Image](img/key_topic.jpg)![Image](img/13tab03.jpg)\n**表 13.4**\
