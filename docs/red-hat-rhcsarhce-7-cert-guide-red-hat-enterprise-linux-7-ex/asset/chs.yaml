  \na. `systemd list-dependencies -r`\nb. `systemctl list-dependencies -r`\nc. `systemd\
  \ status my.unit --show-deps`\nd. `systemctl status my.unit --show-deps`\n\n8..\
  \ 你应该应用 GRUB 2 更改的文件名称是什么？\n\na. `/boot/grub/menu.lst`\nb. `/boot/grub2/grub.cfg`\n\
  c. `/etc/sysconfig/grub`\nd. `/etc/default/grub`\n\n9.. 应用 GRUB 2 更改后，你需要写入这些更改。下列哪个命令可以做到？\n\
  \na. `grub2 -o /boot/grub/grub.cfg`\nb. `grub2-mkconfig > /boot/grub2/grub.cfg`\n\
  c. `grub2 > /boot/grub2/grub.cfg`\nd. `grub2-install > /boot/grub2/grub.cfg`\n\n\
  10.. 在 `systemctl` 操作单元时，下列哪个不是有效命令？\n\na. `systemctl start`\nb. `systemctl status\
  \ -l`\nc. `systemctl mask`\nd. `systemctl disable`\n\n### 基础主题\n\n#### 与 Systemd\
  \ 一起工作\n\nsystemd 是 Red Hat Enterprise Linux 7 中负责启动各种内容的新服务。systemd 不仅仅启动服务，其他项目也从\
  \ systemd 启动。\n\n##### 理解 systemd\n\n通俗地描述，systemd 系统和服务管理器用于启动各种内容。这些内容被称为*单元 (units*。单元可以是许多东西。最重要的单元类型之一是服务。通常，服务提供特定功能并允许外部客户端连接的进程。要显示可用单元列表，输入\
  \ `systemctl -t help`（参见列表 18.1）。\n\n![Image](img/key_topic.jpg)\n\n**列表 18.1**\
  \ Systemd 中的单元类型\n\n点击此处查看代码图片\n\n```\n[root@server1 ~]# systemctl -t help\n\n可用单元类型:\n\
  \nservice\nsocket\ntarget\ndevice\nmount\nautomount\nsnapshot\ntimer\nswap\npath\n\
  slice\nscope\n```\n\n* * *\n\n* * *\n\n提示\n\n\n\n\n\n对于 RHCSA，你需要了解如何操作服务（services）。其他的单元类型并不重要。\n\
  \n***\n\n### 理解服务单元（Service Units）\n\n与 Red Hat 之前用于管理服务的方法相比，使用 `systemd` 的主要优势是它提供了一个统一的接口来启动单元（units）。该接口在单元文件中定义。系统默认单元文件位于\
  \ `/usr/lib/systemd/system`。特定系统的修改（覆盖默认值）位于 `/etc/systemd/system`。此外，自动生成的运行时配置存储在\
  \ `/run/systemd/system` 中。列表 18.2 给出了 `vsftpd.service` 单元文件的示例。\n\n**列表 18.2** Vsftpd\
  \ 单元文件示例\n\n点击此处查看代码图像\n\n```\n[Unit]\n\nDescription=Vsftpd ftp daemon\n\nAfter=network.target\n\
  \n[Service]\n\nType=forking\n\nExecStart=/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n\
  \n[Install]\n\nWantedBy=multi-user.target\n```\n\n***\n\n从这个单元文件示例中，你可以看到它是很容易理解的。任何\
  \ `systemd` 服务单元文件都包含三个部分。（你会在其他类型的单元文件中不同的部分。）\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) `[Unit]` 部分，它描述了单元并定义了依赖关系。该部分还包含重要的 `After` 语句，以及可选的 `Before`\
  \ 语句。这些语句定义了不同单元之间的依赖关系。`Before` 语句关系到在该单元之后启动的另一个单元。`after` 单元（after unit）指的是在当前单元启动之前需要启动的单元。\n\
  \n![Image](img/squf.jpg) `[Service]` 部分，其中包含了如何启动、停止服务以及请求状态安装的描述。通常，你可以预期有一个 `ExecStart`\
  \ 行，它指示如何启动单元，或者有一个 `ExecStop` 行，它指示如何停止该单元。\n\n![Image](img/squf.jpg) `[Install]`\
  \ 部分，其中处理了需求（wants）。你将在下一节“理解目标单元 (Target Units)”中读到更多内容。\n\n列表 18.3 显示了另一个单元文件示例。这次是\
  \ `tmp.mount` 单元。\n\n**列表 18.3** 挂载单元文件示例\n\n点击此处查看代码图像\n\n```\n[Unit]\n\nDescription=Temporary\
  \ Directory\n\nDocumentation=man:hier(7)\n\nDocumentation=http://www.freedesktop.org/wiki/Software/systemd/\n\
  \n  APIFileSystems\n\nDefaultDependencies=no\n\nConflicts=umount.target\n\nBefore=local-fs.target\
  \ umount.target\n\n[Mount]\n\nWhat=tmpfs\n\nWhere=/tmp\n\nType=tmpfs\n\nOptions=mode=1777,strictatime\n\
  \n# 使 'systemctl enable tmp.mount' 生效\n\n[Install]\n\nWantedBy=local-fs.target\n\
  ```\n\n***\n\n列表 18.3 中的 `tmp.mount` 单元文件显示了一些有趣的额外信息。在 `Unit` 部分，你可以看到 `Conflicts`\
  \ 语句。它用于列出不能与此单元一起使用的单元。用它处理互斥的单元。接下来是 `Mount` 部分，它专门针对此类单元类型，并定义了挂载必须在何处执行。你会认通常在任何\
  \ `mount` 命令中使用的参数。最后是 `WantedBy` 部分，它定义了单元必须在何启动。\n\n另一个值得关注的单元类型是 `socket`（套接字）。socket\
  \ 为应用程序之间的通信创建了一种方法。某些服务在启动时会创建自己的 socket，而另一些服务需要 socket 单元文件为它们创建 socket。反之亦然：每个\
  \ socket 都需要相应的服务文件。列表 18.4 中的 socket 文件示例展示了这在 `virtlockd` 中是如何实现的，`virtlockd`\
  \ 是一个跟踪虚拟机活动的的 systemd socket。\n\n**列表 18.4** Socket 单元文件示例\n\n点击此处查看代码图像\n\n```\n\
  [root@server202 system]# cat virtlockd.socket\n\n[Unit]\n\nDescription=Virtual machine\
  \ lock manager socket\n\n[Socket]\n\nListenStream=/var/run/libvirt/virtlockd-sock\n\
  \n[Install]\n\nWantedBy=multi-user.target\n```\n\n***\n\n在处理 `systemd` 单元文件时，你可能会被大量的选项所淹没。每个单元文件都可以用不同的选项进行配置。要确定特定单元可用哪些选项，请使用\
  \ `systemctl show` 命令。例如，`systemctl show sshd` 命令显示了可以在 `sshd.service` 单元中配置的所有\
  \ systemd 选项，包括它们当前的默认值。列表 18.5 显示了此命令的输出。\n\n**列表 18.5** 使用 `systemctl show` 显示可用选项\n\
  \n点击此处查看代码图像\n\n```\nId=sshd.service\n\nNames=sshd.service\n\nRequires=basic.target\n\
  \nWants=sshd-keygen.service\n\nWantedBy=multi-user.target\n\nConsistsOf=sshd-keygen.service\n\
  \nConflicts=shutdown.target\n\nConflictedBy=shutdown.socket\n\nAfter=network.target\
  \ sshd-keygen.service\n\nBefore=shutdown.target multi-user.target\n\nDescription=OpenSSH\
  \ server\n\nLoadState=loaded\n\nActiveState=active\n\nSubState=running\n\nFragmentPath=/usr/lib/systemd/system/sshd.service\n\
  \nUnitFileState=enabled\n```\n\n***\n\n### 理解目标单元（Target Units）\n\n![Image](img/key_topic.jpg)\n\
  \n单元文件用于构建你的服务器所需的功能。为了能够以正确的顺序在正确的时刻加载它们，使用了一种特定的单元类型：目标单元（target unit）。目标单元的简单定义是“一组单元”。某些目标被用作旧运行级别（run\
  \ levels）的对应物，以前的版本用于定义服务器启动的状态。目标超越了这一点。理解目标的良好起点是将它们视为一组单元。目标本身可以与其他目标有依赖关系，这些关系在目标单元中定义。让我们看看列表\
  \ 18.6，其中你可以看到 `multi-user.target` 的定义，它定义了 RHEL 服务器的标准运行状态。\n\n**列表 18.6** Multi-user.target\
  \ 文件\n\n点击此处查看代码图像\n\n```\n[root@server202 system]# cat multi-user.target\n\n...\n\
  \n[Unit]\n\nDescription=Multi-User System\n\nDocumentation=man:systemd.special(7)\n\
  \nRequires=basic.target\n\nConflicts=rescue.service rescue.target\n\nAfter=basic.target\
  \ rescue.service rescue.target\n\nAllowIsolate=yes\n\n[Install]\n\nAlias=default.target\n\
  ```\n\n***\n\n你可以看到目标单元本身并不包含很多。它只是定义了需要什么以及哪些服务和目标不能共存。它通过 `Unit` 部分中的 `After`\
  \ 语句定义了加载顺序。你可以看到在 `Install` 部分它被定义为 `default.target`，因此这是服务器默认启动的内容。目标文件不包含任何关于应包含单元的信息；这些信息在单个单元文件以及\
  \ wants 中（在接下来的章节“理解 Wants”中解释）。\n\n\n\n\n\n即使 systemd target 看起来有点像旧的运行级别（run levels），但它不仅仅于此。target\
  \ 是一个单元（units）组，存在多个不同的 target。某些 target（例如 `multi-user.target` 和 `graphical.target`）定义了系统需要进入特定状态。其他\
  \ target 则仅将一组单元组合在一起，例如 `nfs.target` 和 `printer.target`。这些 target 会被其他 target（如\
  \ multi-user 或 graphical targets）包含进来。\n\n### 理解 Wants（想要关系）\n\n为了理解 want 的概念，让我们从英语中的动词\
  \ `want` 看起，比如“I want a cookie”（我想要一块饼干）。systemd 中的 wants 定义了 systemd 在启动特定 target\
  \ 时“想要”启动哪些 units。Wants 在 systemd 被启用（enabled）时被创建，这是通过在 `/etc/systemd/system` 目录下创建符号链接来实现。在该目录中，你会为每个\
  \ target 找到一个子目录，其中包含指向要启动的特定服务的 wants 符号链接。\n\n### 通过 Systemd 管理单元\n\n作为管理员，你需要管理\
  \ systemd 。这从启动和停止单元开始。你使用 `systemctl` 命令执行这些操作。在练习 18.1 中，你将学习启动、停止和管理一个单元。当你配置好一个单元可以无问题地启动后，你需要确保它在重启后能够自动重启。你通过启用（enable）或禁用（disable）该单元来实现这一点。\n\
  \n***\n\n提示：记住所有可以用于 `systemctl` 命令的不同参数可能看起来很难，但你不需要这样做。相反，只需输入 `systemctl` 并按两次\
  \ `Tab` 键使用命令自动补全。这将显示所有可用命令。\n\n***\n\n![Image](img/key_topic.jpg)\n\n***\n\n###\
  \ 练习 18.1 使用 systemctl 管理单元\n\n**1.** 输入 `yum -y install vsftpd` 来安装 Very Secure\
  \ FTP 服务。\n\n**2.** 输入 `systemctl start vsftpd`。这会激活你机器上的 FTP 服务器。\n\n**3.** 输入\
  \ `systemctl status vsftpd`。你将得到如列表 18.7 所示的输出，并看到 `vsftpd` 服务目前正在运行。你还可以在 `Loaded`\
  \ 行中看到它目前是禁用的（disabled），这意味着它在系统重启时不会被激活。\n\n**4.** 输入 `systemctl enable vsftpd`。这会在\
  \ multi-user target 的 wants 目录下创建一个符号链接，以确保服务在重启后恢复。\n\n**5.** 再次输入 `systemctl status\
  \ vsftpd`。你现在会看到单元文件已从禁用（disabled）变为启用（enabled）。\n\n***\n\n**列表 18.7** 使用 `systemctl\
  \ status` 请求当前单元状态\n\n[点击此处查看代码]\n\n***\n\n```\n[root@server202 system]# systemctl\
  \ status vsftpd\n\nvsftpd.service - Vsftpd ftp daemon\n\n    Loaded: loaded (/usr/lib/systemd/system/vsftpd.service;\
  \ disabled)\n    Active: active (running) since Sun 2014-09-28 08:42:59 EDT; 2s\
  \ ago\n  Process: 34468 ExecStart=/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n\n(code=exited,\
  \ status=0/SUCCESS)\n  Main PID: 34469 (vsftpd)\n    CGroup: /system.slice/vsftpd.service\n\
  \             ![Image](img/common1.jpg)34469 /usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf\n\
  \nSep 28 08:42:59 server202.example.com systemd[1]: Starting Vsftpd ftp\ndaemon...\n\
  Sep 28 08:42:59 server202.example.com systemd[1]: Started Vsftpd ftp\ndaemon.\n\
  Hint: Some lines were ellipsized, use -l to show in full.\n```\n\n***\n\n当如列表 18.6\
  \ 所示请求 systemd 单元的当前状态时，你可以看到它的各种信息。表 18.2 显示了在使用 `systemctl status` 命令时可以从单元文件中获取的不同类型的信息：\n\
