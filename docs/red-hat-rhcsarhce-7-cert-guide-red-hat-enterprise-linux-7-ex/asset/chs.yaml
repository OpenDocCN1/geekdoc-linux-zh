  - tftp\n- installation server\n- Kickstart\n- anaconda\n\n#### 复习题\n**1.** 安装 RHEL\
  \ 服务器后创建的默认 Kickstart 文件的名称是什么？\n\n**2.** 用于生成 Kickstart 文件的工具名称是什么？\n\n**3.** 使用\
  \ `system-config-kickstart` 无法配置哪三个功能？\n\n**4.** 你想使用安装磁盘和位于 [`server.example.com/kickstart.cfg`](http://server.example.com/kickstart.cfg)\
  \ 的 Kickstart 文件来安装服务器。你如何告诉安装程序使用该文件？\n\n**5.** 创建全自动安装环境需要安装哪些服务？\n\n**6.** 安装\
  \ TFTP 服务器后，必须必须启用并启动哪个服务以访问 TFTP 服务器？\n\n**7.** 当你创建 PXE 引导服务器时，引导菜单必须在一个文件中创建。该文件的名称是什么？\n\
