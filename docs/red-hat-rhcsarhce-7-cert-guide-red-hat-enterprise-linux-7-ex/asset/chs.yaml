  \ 在你的系统上，当前正在运行着 20 个 `dd` 进程。停止所有这些进程的最简单方法是什么？\n\n**8.** 哪个命令允许你停止名为 `mycommand`\
  \ 的命令？\n\n**9.** 你在 `top` 中使用哪个命令来杀死一个进程？\n\n**10.** 你将如何以合理的高优先级启动一个命令，同时又不会面临其他进程没有更多可用资源的风险？\n\
