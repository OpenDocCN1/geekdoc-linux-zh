  ##### 练习 13.2 修改 rsyslog.conf 规则\n\n在此练习中，你学习如何修改 `rsyslog.conf`。你配置 Apache 服务通过\
  \ syslog 记录，并创建了一条规则将调试消息记录到特定文件。\n\n**1.** 默认情况下，Apache 服务不通过 syslog 记录，而是保留自己的日志记录。你将改变这一点。首先，执行\
  \ `yum install -y httpd` 来安装 Apache 服务。\n\n**2.** 安装 Apache 服务后，打开其配置文件 `/etc/http/conf/httpd.conf`\
  \ 并添加以下行：\n\n```bash\nErrorLog  syslog:local1\n```\n\n**3.** 执行 `systemctl restart\
  \ httpd`。\n\n**4.** 现在在 `rsyslog.conf` 文件中创建一行，将接收到的来自 `local1` 设施（现在由 httpd 服务使用）的消息发送到\
  \ `/var/log/httpd-error.log` 文件。为了实现这一点，包含以下行：\n\n```bash\nlocal1:error    -/var/log/httpd-error.log\n\
  ```\n\n**5.** 使用 `systemctl restart httpd` 让 rsyslogd 重新加载配置。\n\n**6.** 所有 Apache\
  \ 错误消息现在都将写入 `httpd-error.log` 文件。\n\n**7.** 从 Firefox 浏览器中，访问 `http://localhost/nowhere`。由于你尝试访问的页面不存在，这将记录在\
  \ Apache 错误日志中。\n\n\n\n\n**8.** 现在，让我们创建一个插件文件，将调试消息也记录到特定的文件中。要执行此操作，输入 `echo “*.debug\
  \ /var/log/messages/messages-debug” > /etc/rsyslogd/debug.conf`。\n\n**9.** 再次，使用\
  \ `systemctl restart rsyslogd` 重启 rsyslogd。\n\n10.** 使用命令 `tail -f /var/log/messages-debug`\
  \ 对新创建的文件进行追踪。\n\n11.** 输入 `logger -p daemon.debug “Daemon Debug Message”`。你将看到调试消息流过。\n\
  \n12.** 使用 `Ctrl+C` 关闭调试日志文件。\n\n***\n\n### 日志轮转 (Rotating Log Files)\n\n为了防止 syslog\
  \ 消息完全填满系统，可以对日志消息进行轮转。这意味着当达到某个阈值时，旧的日志文件会被关闭并打开一个新的日志文件。`logrotate` 工具会通过 `crond`\
  \ 服务定期启动，以处理日志文件的轮转。\n\n当日志文件被轮转时，旧的日志文件通常会被复制到一个包含轮转日期的文件中。例如，如果 `/var/log/messages`\
  \ 在 2015 年 1 月 17 日轮转，则轮转后的将将 `/var/log/messages-20150115`。默认情况下，系统会保留四个旧日志文件。超过该时期的文件将自动从系统中删除。\n\
  \n***\n\n### 警告\n\n轮转过的日志文件没有存储在任何地方；它们直接消失了。如果你的公司策略要求你能够访问 5 周以前发生的事件信息，你应该采取措施。你可以选择备份日志文件，或者配置一个集中日志服务器，其中\
  \ `logrotate` 会保留更长时间的轮转后的消息。在第 29 章中，你可以阅读如何这样做。\n\n***\n\n日志轮转的默认设置保留在 `/etc/logrotate.conf`\
  \ 文件中（参见列表 13.4）。\n\n**列表 13.4** `/etc/logrotate.conf` 示例内容\n\n点击此处查看代码图片\n\n***\n\
  \n```\n# see \"man logrotate\" for details\n\n# 每周轮转日志文件\n\nweekly\n\n# 保留 4 周的备份\n\
  rotate 4\n\n# 在轮转旧文件后创建新的（空）日志文件\n\ncreate\n\n# 使用日期作为轮转文件的后缀\ndateext\n\n# 如果你想压缩日志文件，请取消此行的注释\n\
  #compress\n\n# RPM 软件包将日志轮转信息存入此目录\ninclude /etc/logrotate.d\n\n# 没有包拥有 wtmp 和 btmp\
  \ -- 我们在这里对它们进行轮转\n/var/log/wtmp {\n    monthly\n    create 0664 root utmp\n   \
  \ minsize 1M\n    rotate 1\n}\n/var/log/btmp {\n    missingok\n    monthly\n   \
  \ create 0600 root utmp\n    rotate 1\n}\n```\n\n***\n\n此配置文件中最重要的设置告诉 `logrotate`\
  \ 每周轮转一次文件并保留文件的四个旧版本。你可以通过 `man logrotate` 命令获取有关此文件中其他参数的更多信息。\n\n如果特定文件需要特定的设置，你可以在\
  \ `/etc/logrotate.d` 中为该文件创建一个配置文件。该特定文件的设置将覆盖 `/etc/logrotate.conf` 中的默认设置。\n\n\
  ### 使用 journald 工作\n\n`systemd-journald` 服务将日志消息存储在 journal（日志）中，这是一个存储在文件 `/run/log/journal`\
  \ 文件中的二进制文件。可以使用 `journalctl` 命令检查此文件。\n\n#### 使用 journalctl 查找事件\n\n使用 `journalctl`\
  \ 最简单的方法是直接输入命令。它会向你显示服务器上次启动以来写入日志的最近事件。注意，此命令的结果显示在 `less` 分页器中，默认情况下你将看到日志的开头。因为日志是从服务器启动的那一刻开始写入的，所以显示的是与启动相关的日志消息。如果你想查看最后记录的消息，可以使用\
  \ `journalctl -f`，它会显示消息的最后几行，并且新的日志行会自动添加。你也可以输入 `journalctl` 并使用大写的 `G` 跳到日志末尾。另外请注意，搜索选项\
  \ `/` 和 `?` 在 `journalctl` 的输出中有效。列表 13.5 显示了此命令的部分结果。\n\n**列表 13.5** 查看 journald\
