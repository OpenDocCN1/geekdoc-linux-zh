  \ not need to know about them for the RHCSA exam.\n\n***\n\n### Warning\n\nIn earlier\
  \ Linux versions, and some other UNIX-like operating systems, the `ifconfig` utility\
  \ was and is used for validating network configuration. Do not use this utility\
  \ on modern Linux distributions. Because Linux has become an important player in\
  \ cloud computing, networking has evolved a lot to match cloud computing requirements,\
  \ and many new features have been added to Linux networking. With the `ifconfig`\
  \ utility, you cannot manage or validate these concepts.\n\n***\n\nTo show current\
  \ network settings, you can use the `ip addr show` command (which can be abbreviated\
  \ as `ip a s` or even as `ip a`). The `ip` command is relatively smart and does\
  \ not always require you to type the complete option.\n\nThe result of the `ip addr\
  \ show` command looks as in Listing 8.1\n\n**Listing 8.1** Monitoring Current Network\
  \ Configuration with `ip addr show`\n\nClick here to view code image\n\n```bash\n\
  [root@server2 ~]# ip a\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ state UNKNOWN\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n   \
  \ inet 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_lft forever\n\
  \    inet6 ::1/128 scope host\n        valid_lft forever preferred_lft forever\n\
  2: eno16777736: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\n    pfifo_fast\
  \ state UP qlen 1000\n    link/ether 00:0c:29:b8:8c:eb brd ff:ff:ff:ff:ff:ff\n \
  \   inet 192.168.4.220/24 brd 192.168.4.255 scope global eno16777736\n        valid_lft\
  \ forever preferred_lft forever\n    inet6 fe80::20c:29ff:feb8:8ceb/64 scope link\n\
  \        valid_lft forever preferred_lft forever\n```\n\nIn the result of this command,\
  \ you see a listing of all network interfaces in your computer. You’ll normally\
  \ see at least two interfaces, but on specific configurations, there can be many\
  \ more interfaces. In Listing 8.1, two interfaces are shown: the loopback interface\
  \ `lo`, and the onboard Ethernet card `eno167777736`. The important part of the\
  \ output of the command is for the onboard Ethernet card. The command shows the\
  \ following items about its current status:\n\n![Image](img/squf.jpg) **Current\
  \ state:** The most important part of this line is the text `state UP`, which shows\
  \ that this network card is currently up and available.\n\n![Image](img/squf.jpg)\
  \ **MAC address configuration:** This is the unique MAC address that is set for\
  \ every network card. You can see the MAC address itself (`00:0c:29:b8:8c:eb`),\
  \ as well as the corresponding broadcast address.\n\n![Image](img/squf.jpg) **IPv4\
  \ configuration:** This line shows the IP address that is currently set, as well\
  \ as the subnet mask that is used. You can also see the broadcast address that is\
  \ used for this network configuration.\n\n![Image](img/squf.jpg) **IPv6 configuration:**\
  \ this line shows the current IPv6 address and its configuration.\n\nIf you are\
  \ just interested in the link state of the network interfaces, you can use the `ip\
  \ link show` command. This command (of which you can see the output in Listing 8.2)\
  \ repeats the link state information of the `ip addr show` command.\n\n**Listing\
  \ 8.2** `ip link show` Output\n\nClick here to view code image\n\n```bash\n[root@server2\
  \ ~]# ip link show\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state\
  \ UNKNOWN default\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n2:\
  \ eno16777736: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\n    pfifo_fast\
  \ state UP qlen 1000\n```\n[/content]\n\n要验证网络地址的配置，你需要使用 `ip` 工具。`ip` 工具是一个现代化的工具，可以考虑最近引入的高级网络功能。通过\
  \ `ip` 工具，可以监控网络等许多方面：\n\n![Image](img/squf.jpg) 使用 `ip addr` 配置和监控网络地址\n\n![Image](img/squf.jpg)\
  \ 使用 `ip route` 配置和监控路由信息\n\n![Image](img/squf.jpg) 使用 `ip link` 配置和监控网络链路状态\n\n\
  除了这些项目外，`ip` 工具还还可以管理网络的许多其他方面，但在参加 RHCSA 考试时，你不需要了解它们。\n\n***\n\n### 警告 (Warning)\n\
  \n在较早的 Linux 版本以及其他一些 UNIX 类操作系统中，`ifconfig` 工具过去和现在一直被用于验证网络配置。请勿在现代 Linux 发行版上使用此工具。由于\
  \ Linux 已经成为云计算领域的一个重要参与者，网络技术已经发生了巨大的演变以匹配云计算的需求，并且 Linux 网络中添加了许多新功能。使用 `ifconfig`\
  \ 工具，你无法管理或验证这些概念。\n\n***\n\n要显示当前网络设置，你可以使用 `ip addr show` 命令（可以缩写为 `ip a s` 甚至是\
  \ `ip a`）。`ip` 命令相对智能，并不总是要求你输入完整的选项。\n\n`ip addr show` 命令的结果如 列出 8.1 所示：\n\n**列表\
  \ 8.1** 使用 `ip addr show` 监控当前网络配置\n\n点击此处查看代码图像\n\n```bash\n[root@server2 ~]# ip\
  \ a\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\n   \
  \ link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope\
  \ host lo\n        valid_lft forever preferred_lft forever\n    inet6 ::1/128 scope\
  \ host\n        valid_lft forever preferred_lft forever\n2: eno16777736: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc\n    pfifo_fast state UP qlen 1000\n    link/ether 00:0c:29:b8:8c:eb\
  \ brd ff:ff:ff:ff:ff:ff\n    inet 192.168.4.220/24 brd 192.168.4.255 scope global\
  \ eno16777736\n        valid_lft forever preferred_lft forever\n    inet6 fe80::20c:29ff:feb8:8ceb/64\
  \ scope link\n        valid_lft forever preferred_lft forever\n```\n\n在该命令的输出中，你将看到计算机中所有网络接口的列表。你通常会看到至少两个接口，但在特定配置下，可能会有更多接口。在\
  \ 列出 8.1 中显示了两个接口：回环接口 `lo` 和板载以太网卡 `eno167777736`。命令输出的重要部分是关于板载以太卡的。命令显示了关于其当前状态的以下项目：\n\
  \n![Image](img/squf.jpg) **当前状态：** 这一行最重要的部分是文本 `state UP`，它显示该网卡目前处于开启可用状态。\n\n\
  ![Image](img/squf.jpg) **MAC 地址配置：** 这是为每个网卡设置的唯一 MAC 地址。你可以看到 MAC 地址本身（`00:0c:29:b8:8c:eb`）以及相应的广播地址。\n\
  \n![Image](img/squf.jpg) **IPv4 配置：** 这一行显示了当前设置的 IP 地址以及使用的子网掩码。你还可以看到用于此网络配置的广播地址。\n\
  \n![Image](img/squf.jpg) **IPv6 配置：** 这一行显示了当前的 IPv6 地址及其配置。\n\n如果你只对网络接口的链路状态感兴趣，你可以使用\
  \ `ip link show` 命令。该命令（你可以在 列出 8.2 中看到输出）重复了 `ip addr show` 命令的链路状态信息。\n\n**列表\
  \ 8.2** `ip link show` 输出\n\n点击此处查看代码图像\n\n```bash\n[root@server2 ~]# ip link show\n\
  1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN default\n  \
  \  link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n2: eno16777736: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc\n    pfifo_fast state UP qlen 1000\n``` (注：由于用户提供的文本中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行了去重处理，仅保留了逻辑内容的翻译)​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​​​​​。​​​​​。​​​。​​​​​​​​​​​​​​​。​。​。​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​