  \ cron 上，某些任务\n\n####进行自动化。。表 12.1\n\n#### 管理 cron。\n\n在 Linux 系统上，某些任务必须定期进行自动化处理。一种方案是为每个进程配置一个特定进程的解决方案来处理周期性任务，但这样处理这些任务的效率并不高。这就是为什么在\
  \ Linux 上，`cron`（_gloss01.html_gloss_50）服务被用作一种通用服务，在特定时间自动运行进程。\n\ncron 服务由两个主要部分组成。首先是\
  \ cron 守护进程 `crond`。该守护进程每分钟检查一次是否有工作要做。这些工作定义在 cron 配置中，该配置由 cron 配置组成。\n\n####\
  \ 理解 cron\n\n当通过 cron 调度服务时，你需要精确指定服务何时启动。在 crontab 配置中（在下一节中详细解释），你使用时间字符串来指示任务何时应该启动。表\
  \ 12.2 显示了所使用的时间日期字段（按指定顺序）\n\n\n\ncron 的主配置文件是 `/etc/crontab`，但你不会直接修改这个文件。尽管如此，它为你提供了\
  \ cron 中可以使用的不同时间规范的方便概览。它还设置了通过 cron 执行的命令所使用的环境变量（请参见 列表 12.2）。要修改 cron 任务，还有其他地方可以指定\
  \ cron 任务。\n\n**列表 12.2** `/etc/crontab` 示例内容\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server2\
  \ ~]# cat /etc/crontab\n\nSHELL=/bin/bash\nPATH=/sbin:/bin:/usr/sbin:/usr/bin\n\
  MAILTO=root\n\n# 详情请参见 man 4 crontabs\n\n# 任务定义示例：\n\n# .---------------- minute\
  \ (0 - 59)\n# |  .------------- hour (0 - 23)\n# |  |  .---------- day of month\
  \ (1 - 31)\n# |  |  |  |  .------- month (1 - 12) OR jan,feb,mar,apr ...\n# |  |\
  \  |  |  |  .---- day of week (0 - 6) (Sunday=0 or 7) OR\nsun,mon,tue,wed,thu,fri,sat\n\
  # |  |  |  |  |  |\n# * *  *  *  *  * user-name  command to be executed\n* * *\n\
  ```\n\n![Image](img/key_topic.jpg)\n\n与其修改 `/etc/crontab`，可以使用不同的 cron 配置文件\n\n\
  ![Image](img/squf.jpg) `/etc/cron.d` 中的 cron 文件\n\n![Image](img/squf.jpg) `/etc/cron.hourly`、`cron.daily`、`cron.weekly`\
  \ 和 `cron.monthly` 中的脚本\n\n![Image](img/squf.jpg) 使用 `crontab -e` 创建的用户特定文件\n\n\
  在本节中，你将获得这些位置的概览。\n\n***\n\n### 注意事项\n\n如果你想实验 cron 的工作原理，你应该为任务的执行留出足够的时间。`crond`\
  \ 服务每分钟读取一次其配置，之后新任务就可以安排在下一分钟执行。因此，如果你想确保你的任务尽可能快执行，请在保存 cron 配置的时刻与执行时间之间留出 3\
  \ 分钟的安全裕量。\n\n***\n\n首先，可以为特定用户启动 cron 任务。要创建用户特定的 cron 任务，请在登录该用户后输入 `crontab -e`，或者以\
  \ root 身份输入 `crontab -e -u username`。\n\n当你使用 `crontab -e` 时，`vi` 编辑器会打开并创建一个临时文件。在你编辑\
  \ cron 配置后，临时文件会被移动到 `/var/spool/cron` 目录下的最终位置。在该目录中，会为每个用户创建一个文件。永远不应直接编辑这些文件！**当文件被\
  \ `crontab -e` 保存时，它会自动激活。\n\n虽然在早期可以直接修改 `/etc/crontab` 文件，但在 RHEL 7 中你不再需要这样做了。如果你想添加未绑定特定用户账户的\
  \ cron 任务（由于该原因，除非另有指定，否则默认将以 root 身份执行），请将它们添加到 `/etc/cron.d` 目录。只需在该目录中放入一个文件（具体名称并不重要），并确保它符合典型\
  \ cron 任务的语法。在 列表 12.3 中，你可以看到 `/etc/cron.d/unbound-anchor` cron 配置文件的示例（该文件是在安装\
  \ unbound 域名系统 [DNS] 服务器时插入到 `/etc/cron.d` 目录的）。\n\n**列表 12.3** `/etc/cron.d` 中的示例\
  \ cron 任务\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server1 cron.d]# cat unbound-anchor\n\
  \n# 查看 DNSSEC 根密钥是否轮换，如果是则检查信任\n# 并更新\n10 3 1 * * unbound /usr/sbin/unbound-anchor\
  \ -a /var/lib/unbound/root.\nanchor -c /etc/unbound/icannbundle.pem\n```\n\n***\n\
  \n此示例文件包含三个元素。首先是时间指示，它规定命令在每月第一日的凌晨 3:10 开始。然后，配置指示命令必须以 `unbound` 用户身份启动。最后部分是需要启动的实际命令，带有某些特定特定参数，并显示了如何使用该命令。\n\
  \n调度 cron 任务的最后方式是通过以下目录：\n\n![Image](img/squf.jpg) `/etc/cron.hourly`\n\n![Image](img/squf.jpg)\
  \ `/etc/cron.daily`\n\n![Image](img/squf.jpg) `/etc/cron.weekly`\n\n![Image](img/squf.jpg)\
  \ `/etc/cron.monthly`\n\n在这些目录中，你通常会找到放在那里的脚本。\n\n### 理解 anacron 的用途\n\n为了确保每小时、每天、每周和每月任务的执行，`anacron`\
  \ 负责处理。要确定如何操作，`anacron` 使用 `/etc/anontab` 文件。列表 12.4 显示了 `/etc/anontab` 的内容。\n\n\
  **列表 12.4** `anontab` 配置\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server1 spool]# cat\
  \ /etc/anontab\n\n# /etc/anontab: anacron 配置\n# 详情请参见 anacron(8) 和 anontab(5)。\n\
  SHELL=/bin/bash\nPATH=/sbin:/bin:/usr/sbin:/usr/bin\nMAILTO=root\n\n# 任务将在以下小时内启动\n\
  START_HOURS=3-22\n\n#周期（天）延迟（分钟）任务标识\n1               30                hourly\n\
  7               60                weekly\n31              15               monthly\n\
  ```\n\n要执行的任务由三个字段指定。第一个字段指定执行频率，第二列指定 `anacron` 在执行任务前等待多久，而最后部分是命令。\n\n**提示**\n\
  \n了解 `anacron` 如何工作很有用，但它通常不是一个直接配置的服务。通过 `anacron` 配置服务的需要被 `/etc/cron.hourly`、`cron.daily`、`cron.weekly`\
  \ 和 `cron.monthly` 文件消除了。\n\n***\n\n### 注意事项\n\n很难获取已调度的 cron 任务概览。没有单一命令可以显示所有任务。`crontab\
  \ -l` 命令可以列出任务但仅对于当前用户。\n\n***\n\n### 管理 cron 安全\n\n默认情况下，所有用户都可以进入 cron。通过使用 `/etc/cron.allow`\
  \ 和 `/etc/cron.deny` 配置文件，可以限制哪些用户允许调度 cron 任务。如果 cron.allow 文件存在，用户必须在列表中才能使用 cron。如果\
  \ `/etc/cron.deny` 文件存在，用户不在列表中才能设置 cron 任务。\n\n在 练习 12.1 中，你将学习如何通过 cron 运行。\n\n\
  ***\n\n### 练习 12.1 通过 cron 运行任务\n\n在此练习中，你将应用 cron 的基础知识。你将不同的机制调度 cron 任务。\n\n\
  **1.** 打开 root shell。输入 `cat /etc/crontab` 获取 `/etc/crontab` 配置内容的印象。\n\n**2.**\
  \ 输入 `crontab -e`。这将打开一个默认使用 `vi` 作为编辑器的界面。添加以下行：\n\n点击此处查看代码图片\n\n```\n0 2 * *\
  \ 1-5 logger message from root\n```\n\n**3.** 使用 `vi` 命令 `:wq!` 关闭编辑会并保存更改。\n\n\
  **4.** 使用 `cd /etc/cron.hourly`。在该目录下，创建一个名为 `eachhour` 的脚本文件，包含以下行：\n\n\n\n\n\n\
  点击此处查看代码图像\n\n`logger` 此消息写入于 $(date)\n\n**5.** 使用 `chmod +x eachhour` 使脚本具有可执行权限；如果你未能将其设置为可执行，它将无法工作。\n\
  \n**6.** 现在进入 `/etc/crond.d` 目录，并在该目录下创建一个名为 `eachhour` 的文件。将以下内容放入文件中：\n\n点击此处查看代码图像\n\
  \n```\n11 * * * *  root  logger This message is written from /etc/cron.d\n```\n\n\
  **7.** 保存配置文件的修改并开始下一节的内容。（为了获得最佳效果，请在几小时后执行此练习的最后部分。）\n\n**8.** 几小时后，输入 `grep written\
  \ /var/log/messages` 并读取已写入的消息，以验证 cron 操作是否正确。\n\n* * *\n\n### 配置 at 来调度未来任务\n\n\
  虽然 `cron` 用于调度需要定期执行的任务，但 `atd` 服务适用于只需要执行一次的服务。在 RHEL 7 上，`atd` 服务默认可用，因此唯一需要做的就是调度任务。\n\
  \n要通过 `atd` 服务运行任务，你需要使用 `at` 命令，后跟任务需要执行的时间。这可以是一个特定时间，例如 `at 14:00`，但也可以是一个时间指示，如\
  \ `at teatime` 或 `at noon`。输入这些内容后，`at` shell 会打开。从该 shell 中，你可以输入几条命令，这些命令将在指定的特定时间执行。输入命令后，使用\
  \ `Ctrl+D` 退出 `at` shell。\n\n使用 `at` 调度任务后，你可以使用 `atq` 命令（`q` 代表队列 queue）获取当前所有已调度任务的概述。你也可以删除当前的\
  \ `at` 任务。要这样做，请使用 `atrm` 命令，可选后跟你想要删除的 `at` 任务编号。在`练习 12.2` 中，你将学习如何使用 `at` 来调度任务在特定时间执行。\n\
  \n* * *\n\n### 提示\n\n`batch` 命令的作用类似于 `at`，但它更复杂一些。使用 `batch` 时，你可以指定只有当系统性能参数允许时才启动任务。通常，当系统负载低于\
  \ 0.8 时即可。在现代多 CPU 系统上，这个值有点低了，这就是为什么在启动 `atd` 时，可以使用 `-l` 命令行选项手动指定负载值。例如，使用 `atd\
  \ -l 3.0` 以确保当系统负载高于 3.0 时不启动批任务。\n\n* * *\n\n* * *\n\n### 练习 12.2 使用 at 调度任务\n\n\
  在此练习中，你将学习如何使用 `atd` 服务调度任务。\n\n**1.** 输入 `systemctl status atd`。在以 `Loaded:` 开头的行中，此命令应向你显示服务当前已加载并启用，这意味着它已准备好接收任务。\n\
  \n**2.** 输入 `at 15:00`（或替换为任何接近你执行此练习时的时间）。\n\n**3.** 输入 `logger message from at`。使用\
  \ `Ctrl+D` 关闭 `at` shell。\n\n**4.** 输入 `atq` 以验证任务是否已调度。\n\n* * *\n\n#### 总结\n\n\
