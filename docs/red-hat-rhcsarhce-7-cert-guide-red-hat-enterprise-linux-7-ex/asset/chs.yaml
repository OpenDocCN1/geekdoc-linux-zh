  \ `nfsnobody`。\n\n**5.** 应该在防火墙中开放哪个端口，以允许访问 NFSv4 服务器？\n\n**a.** `2049`\n\n**b.**\
  \ 必须在服务器的 `/etc/sysconfig/nfs` 中指定的动态端口\n\n**c.** `2048` 和 Kerberos 端口 `416`\n\n\
