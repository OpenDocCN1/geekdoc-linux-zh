  \ Anchors)\n\n在现代 DNS 配置中，使用 DNSSEC 非常重要。并不是所有的 DNS 域名都完全配置了 DNSSEC，如果这些域名没有使用 `domain-insecure`\
  \ 参数配置排除 DNSSEC 安全检查，则可能会产生问题。对于这些域名，可以使用信任锚点来替代该域名的完整信任链。\n\n要获取域名的信任锚点，你需要在该域名上使用命令\
  \ `dig +dnssec DNSKEY yourdomain.com`。将该命令的完整输出作为 `unbound.conf` 中 `trust-anchor`\
  \ 参数的参数。如果输出中显示多个密钥，你只需要使用其中一个即可。列表 34.2 显示了 `dig +dnssec DNSKEY` 命令的示例输出。\n\n**列表\
