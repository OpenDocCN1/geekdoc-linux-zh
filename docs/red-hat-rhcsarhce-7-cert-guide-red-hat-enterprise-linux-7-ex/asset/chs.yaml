  **b.** `/etc/krb5.conf`\n\n**c.** `/etc/nfs`\n\n**d.** `/etc/kerberos.keytab`\n\n\
  ### 基础知识\n\n#### 配置 Basicv4 服务器\n\nNFS（网络文件系统）提供共享访问，这使得它非常流行。因为它是一个简单且开销很小的协议，NFS\
  \ 仍然被用于以下情况：\n\n即使 NFS 是一个非常老的协议，它也经历了许多发展，并且开发仍在继续。在 NFS 中，由 NFS 服务器提供 exports，并且\
  \ NFS 客户端挂载本地系统。这也是 NFS 高效的原因。\n\n在本节中，您将学习如何安装基础 NFS 服务器。\n\n##### 配置 NFSv4 服务器\n\
  \n在 Hat Enterprise Linux 7 上，NFS 4 是使用的默认版本。该版本与早期版本相比提供了一些有趣的改进：\n\n**伪根挂载：** 多个\
  \ NFS 共享的客户端不再需要挂载每一个，而是可以根挂载。因此，客户端可以挂载 NFS 服务器上的根目录，从而访问导出给客户端的所有共享。\n\n**Kerberos](#gloss01.html_gloss_141)\
  \ 安全：** NFS 设计之仅使用基于主机的安全。一旦主机通过身份验证，基于用户的限制就非常有限。引入 Kerberos 安全是为了增加加密，也是为了在验证用户的\
  \ Kerberos 凭据后才允许访问。\n\n**简化防火墙：** 在旧版本的 NFS 中，使用了 `rpc.portmap` 进程。该进程在随机端口上为 NFS\
  \ 进程提供服务。这使得通过防火墙提供 NFS 共享变得困难。NFSv4 提供了简化防火墙，在防火墙中开放 TCP 端口 `2049` 以允许访问所有 NFS\
  \ 进程，并开放端口 `111` 以及 `20049` 以实现完全访问。\n\n**向后兼容**\n\n即使 NFSv4 与早期版本相比提供了有趣的改进，向后兼容也是可用的。这对于支持仅支持旧版本的\
  \ NFS 客户端可能有用。\n\n\n\n\n\n要创建一个导出项，`/etc/exports` 文件必须包含被导出的目录名称、导出到的 NFS 客户端名称以及用于创建导出项的配置选项。此导出定义可以在\
  \ `/etc/exports` 文件中创建，也可以在 `/etc/exports.d` 目录下以以 `.exports` 结尾的文件形式创建。一个导出行可能如下所示：\n\
  \n点击此处查看代码图像\n\n```\n/srv/nfsexport   vm[1-10].example.com(rw,no_root_squash)\n\
  ```\n\n要定义哪些主机可以访问该共享，你可以在导出定义的第二部分引用这些主机。在这个示例中，访问权限被授予了 `vm1` 到 `vm10` 主机。其他常用的方法还包括使用\
  \ `*` 表示所有主机、特定的主机名、特定的 IP 地址以及如 `10.50.0.0/16` 等完整的网络地址。\n\n在创建导出项时，可以使用特定的导出选项，包括以下内容：\n\
  \n![Image](img/squf.jpg) `ro` 共享项以只读方式导出，这确保无论用户对共享项拥有什么权限，都无法创建或修改文件。\n\n![Image](img/squf.jpg)\
  \ `rw` 共享项以读/写方式导出，这允许写入，但前提是用户在被导出目录的 Linux 文件系统中也具有写权限。\n\n![Image](img/squf.jpg)\
  \ `no_root_squash` 默认情况下，root 用户会被映射为 NFS 服务器上的 `nfsnobody` 用户。这确保了从 NFS 客户端以 root\
  \ 身份登录的用户在 NFS 服务器上具有最小权限。如果你想赋予来自 NFS 客户端的 root 用户完全访问权限，请使用 `no_root_squash` 选项。请注意，这是一个非常不安全的选项。\n\
  \n要创建一个 NFSv4 导出，请遵循以下步骤：\n\n1. 使用 `systemctl start nfs-server` 启动 NFS 服务器。\n2.\
  \ 使用 `systemctl enable nfs-server` 确保它在启动机时自动启动。\n3. 输入 `mkdir /srv/nfsexport` 创建需要共享的目录。\n\
  4. 将以下行添加到 `/etc/exports`：\n```\n/srv/nfsexport  server2(rw)\n```\n5. 输入 `exportfs\
  \ -r` 使 `/etc/exports` 中的所有更改生效。\n6. 使用 `firewall-cmd --permanent --add-service=nfs;\
  \ firewall-cmd –reload` 打开防火墙。\n\n### 访问 NFS 共享\n\n现在你已经已经在服务器上创建了 NFS 共享，是时候访问它了。这相对简单；你只需要将\
  \ NFS 共享挂载到 NFS 客户端的本地文件系统中。挂载 NFS 共享不需要特殊操作。只需使用 `mount nfsserver:/sharename /mountpoint`\
  \ 结构的命令来创建挂载。挂载项现在将集成到本地文件系统中。\n\n### 使用 showmount 测试客户端访问\n\n![Image](img/key_topic.jpg)\n\
  \n要测试挂载是否可用，可以使用 `showmount` 命令。命令 `showmount -e hostname` 显示 `hostname` 上所有可用的挂载。该命令运行良好且非常有帮助，但有一个限制：如果只开放了\
  \ 2049 端口，它无法通过防火墙。如果 NFS 服务器上的防火墙配置为允许 NFS 流量进入，它仍然会拦截 `showmount` 命令。因此，如果你想测试\
  \ NFS 共享的可用性，请确保临时禁用 NFS 服务器上的防火墙。\n\n在较早版本的 RHEL 中，这是测试访问 NFSv4 服务器的唯一方法。在 RHEL\
  \ 7 中，如果防火墙中开放了 20049 和 111 端口，你就可以访问 NFS 服务器。你可以使用以下命令实现这一点：\n\n点击此处查看代码图像\n\n\
  ```\nfirewall-cmd --add-service rpc-bind --permanent\nfirewall-cmd --add-service\
  \ mountd --permanent\nfirewall-cmd --reload\n```\n\n* * *\n\n**提示**\n\n如果你不知道 `showmount`\
  \ 在防火墙方面存在问题，可能会在考试中浪费宝贵的时间。你不妨临时关闭防火墙来测试 NFS 共享的可用性。如果防火墙仅开放了 2049 端口，你的共享项就可以正常工作。\n\
  \n* * *\n\n### 使 NFS 挂载持久化\n\n如果你希望挂载项在系统启动时自动创建，请确保也将将以下行添加到 `/etc/fstab` 中：\n\n\
  点击此处查看代码图像\n\n```\nnfsserver:/sharename            /mountpoint        nfs      _netdev  \
  \ 0 0\n```\n\n![Image](img/key_topic.jpg)\n\n`_netdev` 挂载选项用于告诉 `mount` 命令临时跳过使用此挂载选项的文件系统，直到网络完全启动。在\
  \ RHEL 7 上，此挂载选项已过时，并被 `remote` 取代。\n\n\n\n\n8. 在 `server1` 上，输入 `systemctl stop\
  \ firewalld`。\n\n9. 重复步骤 7。注意此时 `showmount` 命令可以正常工作。\n\n10. 使用 `firewall-cmd --permanent\
  \ --add-service mountd --add-service rpc-bind; firewall-cmd --reload` 为 `server1`\
  \ 防火墙添加 `rpc-bind` 和 `mountd` 防火墙服务，并再次尝试步骤 7。现在可以。\n\n11. 在 `server2` 上，输入 `mkdir\
  \ /mnt/nfs; mount server1:/srv/nfsexport /mnt/nfs`。\n\n12. 输入 `mount` 以验证 NFS 共享已正确挂载。\n\
  \n13. 仍在 `server2` 上，打开 `/etc/fstab` 文件并添加以下行以实现持久挂载：\n\n点击此处查看代码\n\n```\nserver1.example.com:/srv/nfsexport\
  \  /mnt/nfs  nfs  _netdev  0 0\n```\n\n14. 输入 `systemctl status remote-fs.target`\
  \ 并验证该 systemd 单元是否已启用。\n\n15. 重启 `server2` 并验证挂载是否自动激活。\n\n***\n\n### 提示\n在前面的练习中，你学习了如何通过\
  \ `/etc/fstab` 使挂载持久化。这如果你在 RHCE 考试中被要求创建此类挂载，这仍然是你应该采用的方法，同样也是红帽官方推荐的方法。\n\n***\n\
  \n你也可以通过 systemd 创建挂载。要创建此类挂载，创建一个反映挂载点名称的 systemd 挂载单元文件（mount unit file）非常重要。为了自动挂载\
  \ `/mnt/nfs`，systemd 文件的名称必须为 `/etc/systemd/system/mnt-nfs.mount`，并且需要如列表 36.1 所示的内容。\n\
  \n**列表 36.1** 通过 systemd 创建挂载\n\n点击此处查看代码\n\n***\n\n```\n[root@server2 ~]# cat /etc/systemd/system/mnt-nfs.mount\n\
  \n#  此文件是 systemd 的一部分。\n#\n#  systemd is free software; you can redistribute it\
  \ and/or modify it\n#  under the terms of the GNU Lesser General Public License\
  \ as\n#published by\n#  the Free Software Foundation; either version 2.1 of the\
  \ License, or\n#  (at your option) any later version.\n[Unit]\nDescription=nfs mount\
  \ on server1\nAfter=nfs.target\nRequires=nfs.target\n\n[Mount]\nWhat=server1.example.com:/nfsexport\n\
  Where=/mnt/nfs\nType=nfs\nOptions=\n# 使 'systemctl enable mnt-nfs.mount'生效：\n[Install]\n\
  WantedBy=multi-user.target\n```\n\n***\n\n接下来，输入 `systemd enable nfs.target` 和 `systemd\
  \ enable mnt-nfs.mount`。如果你之前通过 `/etc/fstab` 配置了挂载，请删除 `/etc/fstab` 中通过其挂载该共享的行。重启计算机以确保此挂载已启动。\n\
  \n#### 配置 NFS Kerberos 认证\n\nNFS 设计之初并未考虑安全性。默认情况下，只能根据 IP 地址或域名系统（DNS）名称强制执行访问控制，而这很容易被伪造。如果你想使其变得安全，需要使用外部提供的安全功能。在\
  \ RHEL 7 中，Kerberos 为 NFS 增加了额外的系列安全功能。要为 NFS 共享添加安全性，在 `/exports` 中定义共享时需要添加 `sec=*method`\
  \ 选项。可用以下安全方法：\n\n![图片](img/key_topic.jpg)\n\n![图片](img/squf.jpg) `none`：允许匿名访问文件。所有访问都基于\
  \ NFS 服务器上 `nobody` 用户权限。因此，你必须确保该用户对文件和目录具有适当的权限。如果用户还需要写权限，你需要确保 `nfsd_anon_write`\
  \ SELinux 布尔值（Boolean）处于激活状态。注意，你不应该这样做，因为这将授予任何用户以写权限访问共享的权限。\n\n![图片](img/squf.jpg)\
  \ `sys`：这是默认的安全选项，用户对文件的访问基于 `UID` 和 `GID` 值。来自 NFS 客户端的 `UID` 将映射到 NFS 服务器上的相同\
  \ `UID`（即使与该 `UID` 关联的用户名不匹配）。\n\n![图片](img/squf.jpg) `krb5`：NFS 客户端（指的是机器而非用户）使用\
  \ Kerberos `keytab` 文件证明其身份。要访问 NFS 共享中的文件，用户还需要初始化 Kerberos 设置；否则不允许访问文件。这意味着用户的认证会话需要是\
  \ Kerberos 的，如果不是这样，用户必须使用 `kinit` 发起会话。\n\n![图片](img/squf.jpg) `krb5i`：与 `krb5`\
  \ 相同，但增加了密码学保证，以确保请求中的数据未被篡改。\n\n![图片](img/squf.jpg) `krb5p`：与 `krb5i` 相同，但还对服务器和客户端之间的所有请求添加了加密。\n\
  \n***\n\n### 提示\n在上述练习中，你学习了如何通过 `/etc/fstab` 使挂载持久化。如果你在 RHCE 考试中被要求创建此类挂载，这仍然是你应该采用的方法，同样也是红帽官方推荐的方法。\n\
  \n*(注：由于提供的原文在后半部分存在乱码和重复内容，译文已根据“不要重复输出原文”的原则进行了清理)*\n\n\n\n\n2 host/server1.example.com@EXAMPLE.COM\n\
  2 host/server1.example.com@EXAMPLE.COM\n2 host/server1.example.com@EXAMPLE.COM\n\
  2 host/server1.example.com@EXAMPLE.COM\n2 host/server1.example.com@EXAMPLE.COM\n\
  1 nfs/server1.example.com@EXAMPLE.COM\n1 nfs/server1.example.com@EXAMPLE.COM\n1\
  \ nfs/server1.example.com@EXAMPLE.COM\n1 nfs/server1.example.com@EXAMPLE.COM\n1\
  \ nfs/server1.example.com@EXAMPLE.COM\n1 nfs/server1.example.com@EXAMPLE.COM\n\n\
  ### 提示\n创建 Kerberos keytab 和主体*不是*考试题目标。这意味着你将获得一个 keytab 文件，其中包含了该服务在添加 Kerberos\
  \ 安全功能后运行所需的所有 Kerberos 主体，你可以安全地假设该 keytab 文件是没问题的。练习 36.2 对考试中可能出现的情况提供了良好的解释。\n\
  \n### 练习 36.2 配置 Kerberos 化 NFS 服务器\n本练习的配置非常严格。在练习中，你将使用三台不同的机器。`server1.example.com`\
  \ 将配置为 NFS 服务器，`server2.example.com` 将配置为 NFS 客户端，你需要访问 `labipa.example.com`，它被配置为\
  \ IPA 服务器，并在练习中用作 Kerberos 服务器。请参阅书中前面的“实验室设置说明”获取有关设置此环境的具体指令。为了方便起见，我的网站上提供了 `labipa.example.com`\
  \ 的 VMware 工作站镜像，[`www.rhatcert.com`](http://www.rhatcert.com)。在附录 D 的“设置身份管理”中，你将找到如何设置与本章描述环境匹配的\
  \ IPA 服务器的说明。本练习还假设你有一个名为 `lisa` 的 Kerberos 用户。有关创建此类 Kerberos 用户的更多细节，请参阅附录 D。最后，你需要确保\
  \ `server2` 上的已配置远程登录，如第 25 章所示。\n\n1. 在 IPA 服务器 `labipa.example.com` 上，配置了一个 FTP\
  \ 共享。在此共享中，你将找到 `server1.keytab` 和 `server2.keytab` 文件，它们包含了设置此环境所需的所有主体。将 `server1.keytab`\
  \ 下载到 `server1:/etc/krb5.keytab`，并将 `server2.keytab` 安装到 `server2:/etc/krb5.keytab`。\n\
  2. 在两台服务器上，使用 `restorecon -v /etc/krb5.keytab` 确保 SELinux 标签已设置。\n3. 在 NFS 服务器 `server1`\
  \ 上，输入 `systemctl status nfs-server` 以验证你在练习 36 中启用的 `nfs-server` 服务是否确实在运行中。\n\
  4. 在 NFS 服务器 `server1` 上，输入 `mkdir /srv/secureshare` 创建一个要共享的目录。使用 `semanage fcontext\
  \ -a -t nfs_t \"/srv/secureshare.*\"` 设置 SELinux 标签，并使用 `restorecon -R /srv/secureshare`。输入\
  \ `chown lisa /srv/secureshare` 使 `lisa` 成为该共享的所有者。\n5. 使用编辑器打开 `/etc/exports` 文件并赋予以下内容：\n\
  ```\n/srv/secureshare sec=krb5,rw\n```\n6. 输入 `exportfs -rv` 导出新创建的共享。\n7. 输入 `showmount\
  \ -e localhost` 验证共享的可用。\n8. 现在 NFS 服务器 `server1` 配置完成，你可以将 `server2` 配置为 NFS 客户端。\n\
  9. 在 `server2` 上，输入 `mkdir -p /mnt/securenfs` 创建一个供 NFS 服务器使用的挂载点。\n10. 手动挂载 NFS\
  \ 共享，使用 `mount -o sec=krb5 server1.example.com:/srv/secureshare /mnt/securenfs`。\n\
  11. 输入 `su - lisa` 以 `lisa` 身份访问共享。\n12. 使用 `kinit lisa` 确保 `lisa` 已建立 Kerberos\
  \ 会话。\n13. 输入 `touch lisa` 在共享中创建一个文件。你应该被允许执行此操作。\n\n#### 注意：\n在 RHEL 7.1 上编写此练习时，一种配置导致我在执行挂载命令时导致\
  \ `nfs-utils` 包崩溃。在另一个测试环境中它是正常工作的。我认为 RHEL 7.1 的软件是不稳定的，希望这会在 `nfs-utils` 包的后续更新中得到修复。\n\
  \n 理解 NFSv4 SELinux 透明性\n默认情况下，NFS 客户端上的所有 NFS 挂载都有 `nfs_t` SELinux 上文类型，无论服务器上设置了什么上下文。（当然，你需要设置一个允许\
  \ NFS 服务器访问共享的上下文。）更改此点的一种方法是使用 `context=` 挂载选项，如 `mount -o context=\"system_u,object_r:public_content_rw_t:s0\"\
  \ server1:/srv/nfs /mnt/nfs` 所示。\n\n#### 启用 NFS SELinux 透明性\n1.在 NFS 服务器上，你已经导出了\
  \ `/srv/nfs` 目录并为其提供了 `public_content_rw_t` NFS 上文标签。\n2.在客户端的 `/mnt/nfs` 目录上挂载共享，使用\
  \ `mount server1.example.com:/srv/nfs /mnt/nfs`。\n3.检查当前上下文：`ls -Zd /mnt/nfs`。你会看到它设置为\
  \ `nfs_t`。\n4.回到 `server1`，打开文件 `/etc/sysconfig/nfs` 并赋予以下内容：\n```\nRPCNFSDARGS=\"\
  -V 4.2\"\n```\n5.输入 `systemctl restart nfs-server; systemctl restart nfs-secure-server`\
  \ 使更改生效。\n6.在客户端上，输入 `mount -o v4.2 server1.example.com:/srv/nfs /mnt/nfs`。\n7.在\
  \ `server1` 上，使用 `touch /nfs/myfile` 并使用 `ls -Z` 检查其安全标签。\n8.在 `server2` 上，使用 `ls\
  \ -Z` 验证上下文。你会发现客户端继承了服务器的设置。\n\n\n\n\nRPC\n\n#### 复习题\n\n- **1.** 包含 NFS 共享的配置文件的名称是什么？\n\
  - **2.** 在 NFS 客户端上必须启动哪些服务以启用挂载来自 NFS 服务器的 Kerberos 认证的共享？\n- **3.** 在 NFS 服务器上必须启动哪些服务以提供\
  \ Kerberos 安全性护护？\n- **4.** 防火墙中需要开放哪些端口以允许对 NFS 服务器的完全访问？\n- **5.** 你想创建一个 NFS\
  \ 共享，让 Web 服务器也能读取文档。不需要写入权限。哪种 SELinux 上下文标签允许你将访问权限设置得尽可能紧密？\n- **6.** 在 `/etc/fstab`\
  \ 中必须使用哪个选项来确保在重启时可以自动挂载 NFS 共享？\n- **7.** 你想为一个仅支持对共享进行最轻量 Kerberos 保护的环境设置 NFS\
  \ 服务器。在导出时你应该使用哪种 `sec=` 选项？\n- **8.** 你的 NFS 服务器无法访问与 NFS 客户端相同的用户账户。推荐使用哪种方法设置安全性？\n\
  - **9.** 在 NFS 服务器上需要修改哪个文件，以允许 SELinux 上下文类型对客户端透明？\n- **10.** 哪个版本的 NFS 能够让设置在服务器上设置的\
  \ SELinux 上下文类型对 NFS 客户端同样是透明的？\n\n### 章末实验\n\n现在你已经读了这一章，你应该能够设置一个 NFS 服务器并将其完全集成到工作环境中。这正是你在实验\
  \ 36.1 中需要做的。\n\n#### 实验 36.1\n\n**1.** 在 `server1` 上创建一个名为 `/secureshare` 的 NFS\
  \ 共享。确保它仅能使用最大的 Kerberos 安全性进行挂载。在 `server2` 上创建一个配置，在重启时自动将该共享挂载到目录 `/mnt/secure`。\n\
  \n## 第 37 章：配置 Samba 文件服务\n\n**本章将涵盖以下主题题：**\n\n![Image](img/squf.jpg) 设置 SMB 文件共享\n\
  \n![Image](img/squf.jpg) 保护 Samba 安全性\n\n![Image](img/squf.jpg) 访问 SMB 共享\n\n**本章涵盖了以下\
  \ RHCE 考试目标：**\n\n![Image](img/squf.jpg) 为特定客户端提供网络共享\n\n![Image](img/squf.jpg)\
  \ 提供适用于小组协作的网络共享\n\n![Image](img/squf.jpg) 使用 Kerberos 认证对共享目录的访问\n\n在许多网络中，Windows\
  \ 客户端越来越多地用于访问运行在 Linux 上的的服务。为了允许这些客户端使用原生文件访问协议访问文件共享，你可以在 Linux 上配置 Samba 服务。Samba\
  \ 使用服务器消息块（SMB）协议来提供共享访问。在本节中，你将学习如何为此类文件访问设置 Samba 服务器。你还将学习如何从 Linux 计算机访问 SMB\
  \ 文件共享。\n\n### “我已经掌握这些了吗？”测验\n\n“我已经掌握这些了吗？”测验可以让你评估自己应该是仔细通读整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或你对这些主题知识的自我评估有疑问，请通读整个章节。表\
  \ 37.1 列出了本章的主要标题及其对应的“我已经掌握这些了吗？”测验问题。你可以在 附录 A，“‘我已经掌握这些了吗？测验和‘复习题’的答案](#app01.html_app01)”中找到答案。\n\
