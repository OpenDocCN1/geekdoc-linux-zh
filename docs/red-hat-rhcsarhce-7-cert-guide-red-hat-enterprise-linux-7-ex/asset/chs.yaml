  \n**表 18.3** Systemctl 单元概述命令\n\n### 管理依赖关系\n\n在许多情况下，systemctl 单元具有依赖关系。某些单元将作为其他单元的依赖启动，请求某个特定单元的事件可能会触发另一个单元的启动。例如\
  \ `cups.service` 服务。该服务可以独立启动，但也可以通过 `cups.path` 和 `cups.socket` 单元的活动启动，这可能会触发服务的再次启动。作为管理员，你可以请求单元依赖关系列表。输入\
  \ `systemctl list-dependencies` 后跟单元名称以查找它具有哪些依赖，并添加 `--reverse` 来查找哪些单元依赖于此单元。列表\
  \ 18.8 显示了该命令的示例。\n\n**列表 18.8** 显示单元依赖关系\n\n[点击此处查看代码]\n\n***\n\n```\n[root@server1\
