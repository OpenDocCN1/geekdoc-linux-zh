  \ 终端并输入 `ip addr show`。这会显示当前的网络配置。注意所使用的 IPv4 地址。注意所使用的网络设备名称；你将在稍后的练习中需要到这些名称。\n\
  \n# 2. 输入 `ip route show` 以验证路由配置。\n\n# 3. 如果你的电脑连接了互联网，现在可以使用 `ping` 命令来验证到互联网的连接是否正常。例如，输入\
  \ `ping -c 4 8.8.8.8`，向 IP 地址 `8.8.8.8` 发送四个数据包。如果你的连接运行正常，你应该会收到“echo reply”。\n\
