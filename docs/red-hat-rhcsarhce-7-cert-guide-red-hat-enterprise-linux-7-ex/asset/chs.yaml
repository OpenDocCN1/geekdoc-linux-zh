  \ ping 请求。\n\n## 第 29 章 配置高级日志功能\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg) 理解\
  \ rsyslogd 模块\n\n![Image](img/squf.jpg) 将 journald 连接到 rsyslog\n\n![Image](img/squf.jpg)\
  \ 配置远程日志\n\n**本章涵盖了以下 RHCE 考试目标：**\n\n![Image](img/squf.jpg) 配置远程日志\n\n在第 13 章“配置日志”中，你学习了日志文件管理和分析的基础。作为\
  \ RHCE，你还需要了解一些高级配置。在本章中，你学习如何操作 `rsyslogd` 中的模块。你还将学习 `rsyslogd` 与 `journald](#gloss01.html_gloss_138)`\
  \ 之间的集成是如何组织的，以及如何配置远程日志。\n\n### “我已经掌握这些了吗？”测验\n\n“我已经掌握这些了吗？”测验可以让你评估自己应该彻底阅读整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或自己对这些主题知识的评估有疑问，请阅读整个章节。表\
