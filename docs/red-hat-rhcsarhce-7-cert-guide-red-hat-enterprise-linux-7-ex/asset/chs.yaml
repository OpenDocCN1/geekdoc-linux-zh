  \n**表 11.2** .repo 文件中的关键选项\n\n创建仓库文件时，`baseurl` 参数是最重要的，因为它告诉服务器去哪里找到要安装的文件。`baseurl`\
  \ 的参数是需要从中安装文件的 URL。这通常是一个 HTTP 或 FTP URL，但也可以是基于文件的 URL。\n\n使用 URL 时，会使用两个组件。首先，URI\
  \ 标识要使用的协议，其格式为 `protocol://`，例如 `http://`、`ftp://` 或 `file://`。紧随 URI 之后的是该 URL\
  \ 上的精确位置。这可以是 Web 服务器或 FTP 服务器的名称，包括文件所在的子目录。如果 URL 是基于文件的，文件系统上的位置也以 `/` 开头。因此，对于基于文件系统的\
  \ URL，`baseurl` 中会有三个斜杠，例如 `baseurl:///repo`，它指向 `/repo` 目录。\n\n在 Listing 11.1 的仓库配置文件中，可以看到使用了一些选项。Table\
