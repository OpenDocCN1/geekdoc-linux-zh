  \ `dd` 进程的 shell 及其 PID。\n\n***\n\n### 使用 top 管理进程\n\n一个方便的进程管理工具是 `top`。该工具在第 27\
  \ 章中有详细描述。对于常见的进程管理任务，top 非常好，因为它提供了当前活动进程的概述（因此得名 top）。这让你能够轻松找到需要关注的进程。图 9.1 显示了启动\
  \ top 时出现的界面。\n\n![Image](img/09fig01.jpg)\n\n**图 9.1** 使用 top 使管理变得简单。\n\n从 top\
  \ 中方便获得的信息之一是进程状态。表 9.3 提供了可能观察到的不同进程状态的概述。\n\n既然如何在命令行中使用 `kill` 和 `nice` 命令，在\
  \ top 中使用相同的功能会更简单。在 top 中，输入 `k`。top 然后会提示要发送信号的进程 PID。默认选择最活跃的进程。在你输入 PID 后，top\
  \ 询问你想发送哪个信号。默认使用信号 15 SIGTERM。然而，如果你想再坚持一下，可以输入 9 SIGKILL。现在按**回车**键终止进程。\n\n要从\
  \ top 中重置运行中的进程，输入 `r`。首先会被提示要重置的进程 PID。输入 PID 后，会被提示要使用的 nice 值。输入正值以增加进程优先级，输入负值以降低优先级。\n\
  \n#### 总结\n\n进程管理是 Linux 系统管理员的一项常见任务。在本章中，你学习了如何查找特定进程以及如何使用 nice 和 kill 更改它们的优先级。有关进程监控的更多高级信息，请参见第\
  \ 27 章。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n\n\n复习本章最重要的主题，这些主题在页外边缘用 `Key Topic`\
