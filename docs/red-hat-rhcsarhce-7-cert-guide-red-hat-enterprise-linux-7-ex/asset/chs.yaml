  \n**a. `unbound dump_cache`**\n\n**b. `systemctl dump unbound`**\n\n**c. `unbound-control\
  \ --dump`**\n\n**d. `unbound-control dump_cache`**\n\n**10.** 如果请求的 DNS 名称无法找到，你预计会在\
  \ `dig` 的输出中看到哪种消息？\n\n**a. ERROR**\n\n**b. DOMAIN_NOT_FOUND**\n\n**c. NXDOMAIN**\n\
  \n**d. SRVFAIL**\n\n### 基础主题\n\n### 理解 DNS\n\n![Image](img/key_topic.jpg)\n\n域名系统（DNS）是一种层次化的命名系统，用于获取有关网络计算机和其他资源的信息。该层次化结构按域组织，域中包含资源记录，这些记录存储了\
  \ DNS 层次结构中主机和其他资源的信息。在现代网络环境中，DNS 包含的内容远不止是主机与 IP 地址之间的映射。在 Kerberos 环境中，它还用于存储网络中可用服务的信息。\n\
  \n### DNS 层次结构\n\nDNS 层次结构的顶端是根域（`.`）。根域之下是顶级域名（TLD）。这些顶级域名包括如 `com`、`net`、`org`\
  \ 等许多域（特别是最近默认顶级域已经扩展了新的域名）。全球每个受认可的国家也有各自对应的顶级域名，例如代表中国的 `cn`、印度的 `in` 和德国的 `de`。在顶级域内部，个人和组织可以注册自己的域。DNS\
  \ 域的完整名称始终包含通往顶级域的路径（在某些特定情况下，它还会在路径末尾包含一个点，以指代 DNS 根域）。此类域名的示例是 `redhat.com` 或\
  \ `rhatcert.com`。（注意，域名以点结尾是为了指代根域。）\n\n> **注意**\n> 在应用程序中，在 DNS 名称末尾包含点并不并不常见。在\
  \ DNS 配置中，区分这种差异至关重要。名称 `rhatcert.com` 可能被解释为存在于当前 DNS 域中，而名称 `rhatcert.com.` 则位置非常具体，毫无疑问地指代存在于\
  \ DNS 根域中的域。\n\n在这些二级域中，二级域的所有者可以自由地如何以最有效的方式组织资源记录，只要他同时也负责根据添加的任何资源记录更新 DNS 数据库即可。将资源记录直接关联到二级域是很常见的，这产生了如\
  \ `www.rhatcert.com` 或 `ftp.redhat.com` 等名称，但在许多情况下会额外添加一层子域名。\n\n### DNS 术语\n\n\
  在处理 DNS 时，使用正确的术语非常重要。在配置服务时需要这些术语，对术语的误解可能会导致 DNS 配置错误。某些术语为常见：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) **域:** 以共同名称结尾的资源记录集合。一个域可以包含子域名。\n\n![Image](img/squf.jpg)\
  \ **顶级域名:** DNS 名称中最高级的层次结构，包含如 `.com`、`.org.`、ISO 3166-1 两位字母国家代码域名，以及后期添加的 `.aero`、`.bank`\
  \ 等（参见 http://data.iana.org/TLD/tlds-alpha-by-domain.txt）。\n\n![Image](img/squf.jpg)\
  \ **子域名:** 作为另一个域内部分支的域，例如 `com` 之中的 `rhatcert` 或 `co.uk` 之中的 `redhat`。\n\n![Image](img/squf.jpg)\
  \ **名称服务器:** 负责区域记录的服务器。为了冗余目的，通常会有多个名称服务器可用。\n\n![Image](img/squf.jpg) **资源记录:**\
  \ 包含特定类型数据库记录。\n\n![Image](img/squf.jpg) **区域:** 指被委托给子域的域。基本上，区域是指 DNS 树中负责名称服务器的分支。\n\
  \n### 理解 DNS 查询\n\n每个连接到互联网的计算机和其他设备都配置了 DNS 解析器。DNS 解析器通常包含到三个名称服务器的 IP 地址。如果第一个不可用，则联系第二个，然后是第三个。如果\
  \ DNS DNS 服务器，则使用它。\n\n在 Linux 系统上，DNS 解析器位于配置文件 `/etc/resolv.conf`，在 Red Hat 上由\
  \ NetworkManager 管理，不应直接编辑；使用 `nmcli` 或 `nmtui` 设置网络中的 DNS 服务器。当你向 DNS 服务器请求数据时，可能会得到三种答案。在所有这些情况下，“权威的（authoritative）”一词都至关重要。答案的状态显示在\
  \ `dig` 等工具的输出中（参见 34.1）。在 34.1 的命令输出中，`AUTHORITY: 13` 部分显示联系了少于 13 个不同的名称服务器来验证答案的权威性。\n\
  \n权威答案来自负责某个区域及其记录的名称服务器：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ **本地权威数据:** 由负责请求数据的 DNS 服务器提供的答案。这意味着该答案位于本地区域的资源记录中。\n\n![Image](img/squf.jpg)\
  \ **通过递归获取远程非权威数据:** 如果 DNS 服务器无法从其数据库或缓存提供答案，它将通过递归联系互联网上的相应 DNS 服务器。DNS 递归 是一个过程，首先联系根域名称服务器以查找所需的顶级域名。然后，联系顶级域名\
  \ DNS 服务器以查找请求的子域名称服务器。通常，子域名称服务器将发送请求的数据。在收到答案后，发起请求的 DNS 服务器会将答案存储在其缓存中，随后将答案发送给最初来自请求的客户端。\n\
  \n\n\n\n\n![Image](img/squf.jpg) **本地缓存非权威性数据：** 一旦 DNS 服务器构建了包含许多记录的缓存，就可以直接从缓存中提供答案。这使得递归过程变得不再必要，从而加快了处理速度。记录在缓存中保存的时间不是无限的，而是由生存时间\
  \ (TTL) 决定的。一旦 TTL 过期，缓存条目将失效，当再次请求相同的数据时，DNS 服务器需要重新启动递归过程。\n\n### 注意事项\n不同的协议都使用生存时间（TTL）。在\
  \ DNS 中，TTL 指的是答案在缓存中可以保留的时间长度。在 IPv4 堆栈中，TTL 指的是 IPv4 数据包在被认为无法传输之前可以经过的路由器数量。\n\
  \n### 列表 34.1 使用 `dig` 验证答案的权威性\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# dig rhatcert.com\n\
  \n; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1 <<>> rhatcert.com\n\n;; global options:\
  \ +cmd\n\n;; Got answer:\n\n;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id:\
  \ 43963\n\n;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 13, ADDITIONAL: 1\n\
  \n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:; udp: 4096\n\n;; QUESTION SECTION:\n\
  ;rhatcert.com.              IN      A\n\n;; ANSWER SECTION:\nrhatcert.com.     \
  \       21599      IN      A      213.124.112.43\n;; AUTHORITY SECTION:\n.     \
  \          6184      IN      NS      f.root-servers.net.\n.               6184 \
  \     IN      NS      m.root-servers.net.\n.               6184      IN      NS\
  \      l.root-servers.net.\n.               6184      IN      NS      c.root-servers.net.\n\
  .               6184      IN      NS      k.root-servers.net.\n.               6184\
  \      IN      NS      e.root-servers.net.\n.               6184      IN      NS\
  \      b.root-servers.net.\n.               6184      IN      NS      a.root-servers.net.\n\
  .               6184      IN      NS      i.root-servers.net.\n.               6184\
  \      IN      NS      d.root-servers.net.\n.               6184      IN      NS\
  \      h.root-servers.net.\n.               6184      IN      NS      j.root-servers.net.\n\
  .               6184      IN      NS      g.root-servers.net.\nQuery time: 108 msec\n\
  SERVER: 192.168.4.200#53(192.168.4.200)\nWHEN: Sun May 17 10:27:35 EDT 2015\nMSG\
  \ SIZE rcvd: 68\n```\n\n### 理解资源记录\nDNS 资源记录是 DNS 区域中的条目，包含了所请求的信息。每条资源记录包含四种类型的数据：\n\
  \n**类型（Type）：** 这是此资源记录中信息的种类。例如 `A` 资源记录，用于将主机名映射到 IP 地址。\n\n**数据（Data）：** 存储在此记录中的特定数据。\n\
  \n**类（Class）：** 理论上，可以使用不同的资源记录类。在 DNS 中，TTL 指的是答案在缓存中可以保留的时间。在 IPv4 堆栈中，TTL 指的是\
  \ IPv4 数据包在被认为无法传输之前可以经过的路由器数量。\n\n**生存时间（TTL）：** **本地缓存非权威性数据：** 一旦 DNS 服务器构建了包含许多记录的缓存，就可以直接从缓存中提供答案。这使得递归过程变得不再必要，从而加快了处理速度。记录在缓存中保存的时间不是无限的，而是由生存时间\
  \ (TTL) 决定的。一旦 TTL 过期，缓存条目将失效，当再次请求相同的数据时，DNS 服务器需要重新启动递归过程。\n\n### 注意事项\n不同的协议都使用生存时间（TTL）。在\
  \ DNS 中，TTL 指的是答案在缓存中可以保留的时间长度。在 IPv4 堆栈中，TTL 指的是 IPv4 数据包在被认为无法传输之前可以经过的路由器数量。\n\
