  \ /etc/httpd/htpasswd lisa`\n**b.** `htpasswd -c /etc/httpd/htpasswd lisa`\n**c.**\
  \ `htpasswd2 /etc/httpd/htpasswd lisa`\n**d.** `htpasswd -c /etc/httpd/htpasswd\
  \ lisa`\n\n### 基础主题\n\n## 复习 Apache 基础\n在第 17 章中，你学习了基础 Apache 配置。在本节中，我们将复习你需要熟悉的最重要的\
  \ Apache 设置。你首先将学习如何设置基本的 Apache 参数，然后概述与 SELinux 相关的必要的设置。\n\n### 必要的 Apache 参数\n\
  为了能够讨论重要参数（在 Apache 文档中称为指令），列表 33.1 概述了 `/etc/httpd/conf/httpd.conf` 文件中最重要的配置。（注意，为了关注基本参数，配置的部分已被移除）。\n\
  \n**列表 33.1 核心 httpd.conf 配置设置**\n\n```\nroot@server1 ~ cat /tmp/httpd.conf\nServerRoot\
  \ \"/etc/httpd\"\nListen 80\nInclude conf.modules.d/*.conf\nUser apache\nGroup apache\n\
  ServerAdmin root@localhost\n<Directory />\n  AllowOverride none\n  Require all denied\n\
  </Directory>\nDocumentRoot \"/var/www/html\"\n<Directory \"/var/www\">\n  AllowOverride\
  \ None\n  # Allow open access:\n  Require all granted\n</Directory>\n# 进一步放宽对默认根的访问:\n\
  <Directory \"/var/www/html\">\n  Options FollowSymLinks\n  AllowOverride None\n\
  \  Require all granted\n</Directory>\n<IfModule dir_module>\n  DirectoryIndex index.html\n\
  </IfModule>\n<Files \".ht*\">\n  Require all denied\n</Files>\nErrorLog \"logs/error_log\"\
  \nLogLevel warn\n<IfModule alias_module>\n  ScriptAlias /cgi-bin/ \"/var/www/cgi-bin/\"\
  \n</IfModule>\n<Directory \"/var/www/cgi-bin\">\n  AllowOverride None\n  Options\
  \ None\n  Require all granted\n</Directory>\nInclude conf.d/*.conf\n```\n\n表 33.2\
  \ 提供了列表 33.1 代码中最重要的设置的概述。\n\n**表 33.2 httpd.conf 核心配置参数**\n\n### 复习 Apache SELinux\
  \ 相关设置\nApache Web 服务器存在许多与 SELinux 相关的安全设置。这是因为它是最脆弱的服务器之一，也是 Linux 上使用最多的服务器之一。它经常使用脚本来允许生成内容。由于这些脚本，存在更高的安全风险。为了降低这些风险，存在不同的\
  \ Apache 相关的 SELinux 安全上文和布尔值。表 33.3 总结了最重要的 Apache 相关的 SELinux 设置。\n\n**表 33.3\
  \ Apache 相关的 SELinux 设置**\n\n### 配置 DocumentRoot 的写入权限\n默认情况下，只有 root 用户对 DocumentRoot\
  \ 有写入权限。如果你有一组 Web 开发者也需要向 DocumentRoot 写入文件，那么你需要采取额外的措施。存在两种常见的解决方案：\n\n1. 配置文件系统访问控制列表（ACL；见第\
  \ 7 章“配置权限”），授予 Web 开发者组成员对该目录的所有必要权限。\n2. 将 DocumentRoot 的组所有者设置为 Web 开发者，并在目录上设置粘滞位（sticky\
  \ bit）权限，以便将添加到目录的新项的默认文件所有者设置为组所有者。\n\n要设置允许 webdev 组成员对 DocumentRoot 写入权限的 ACL，可以使用以下命令：\n\
  \n```\nsetfacl -R -m g:webdev:rwX /var/www/html\nsetfacl -R -m d:g:webdev:rwx /var/www/html\n\
  ```\n\n注意，在这些第一个命令中，使用了大写的 `X`，仅对目录设置执行权限而不对文件设置。\n\n# 练习 33.1 增强虚拟服务器配置\n在练习 17.2\
  \ 中，你配置了两个虚拟服务器：account.example.com 和 sales.example.com。在那个练习中，你关闭了 SELinux。在本练习中，你继续处理练习\
  \ 17.2 中创建的配置。如果你不再拥有该配置，你应该通过执行练习 17.2 描述的步骤开始此练习。在练习开始时，虚拟服务器应该是可用的。\n\n1. 打开\
  \ root shell 并输入 `getenforce` 以请求当前的 SELinux 状态。如果未设置为 Enforcing，请使用 `setenforce\
  \ Enforcing` 开启 SELinux。同时确保 `/etc/sysconfig/selinux` 文件中的默认 SELinux 状态设置为 enforcing。\n\
  2. 使用 `elinks http://sales.example.com`。你不应该获得虚拟 Web 服务器的访问。这是预期，因为尚未应用正确的 SELinux\
  \ 设置。\n3. 使用 `semanage fcontext -a -t httpd_sys_content_t \"/www/docs(/.*)?\"` 为服务器使用的自定义\
  \ SELinux 文档根设置正确的上下文类型。\n4. 输入 `restorecon -Rv /www/docs` 将刚刚设置的上下文应用于文件系统。\n5.\
  \ 使用 `groupadd webdev` 创建一个 Web 开发者组。\n\n\n\n\n\n## 6. 使用以下两条命令设置 ACL，以确保 `webdev`\
  \ 组的成员对虚拟用户的文档根目录（document root）具有访问权限：\n\n点击此处此处查看代码图片\n\n```\nsetfacl -R -m g:webdev:rwX\
  \ /www/docs\nsetfacl -R -m d:g:webdev:rwx /www/docs\n```\n\n### 7. 使用 `elinks http://sales.example.com`\
  \ 验证对销售虚拟 Web 服务器的访问。你现在应该可以访问了。\n\n### 8. 输入 `usermod -aG webdev lisa`。\n\n###\
  \ 9. 使用 `su - lisa` 切换到 lisa，并使用 `touch /www/docs/sales/lisa.html` 验证对 `/www/docs/sales`\
  \ 目录的写权限。\n\n***\n\n提示\n本次练习中应用的操作非常重要，在考试中你必须确保自己也能应用它。请注意 `man 8 semanage-fcontext`\
  \ 结尾的“Examples（示例）”部分有一个非常好的例子。\n\n***\n\n#### 配置 TLS 安全\n\n默认情况下，Web 服务器的身份是不经验证的。这使得你的\
  \ Web 服务器容易受到中间人攻击，即他人冒充你的 Web 服务器的身份。如果需要额外的安全防护，可以为服务器配置传输层安全（TLS）。在本节中，你将学习如何操作。使用\
  \ TLS 加密后，Web 服务器将配置公/私钥证书 以保证 Web 服务器的身份。使用这些密钥不仅可以验证服务器身份，还可以发送加密数据，从而在传输过程中保持不可读。\n\
  \n***\n\n提示\nApache 的高级主题看起来很复杂，在某种程度上也确实如此。然而，本章讨论的所有内容都有良好的配置示例。安装 `httpd-manual`\
  \ RPM 包，安装后，通过 `http://localhost/manual` 访问完整的 Apache 手册。建议在章的每个练习中都使用此手册，这样你就能熟悉其内容，而不会在查找特定项目时浪费过多时间。\n\
  \n***\n\n##### 理解 TLS 安全\n\nTLS 是 SSL（安全套接层）的继承者。它的主要目的是允许客户端验证服务器的身份。为了实现这一点，使用了证书。证书包含了服务器身份和服务器的公钥。客户端使用证书向服务器发送加密数据。\n\
  \n为了保证证书的真实性，它通常由证书颁发机构（CA）签名。CA 是一个签署了证书的外部信任第三方。与证书相关的是服务器的私钥。使用公钥加密的数据只能用私钥 解密。\n\
  \nTLS 连接的建立如下：\n\n1. 客户端使用 `ClientHello` 消息发起连接。该消息包含了客户端支持的加密协议和密码套列表。\n\n2. 服务器用\
  \ `ServerHello` 消息响应，指示其支持的加密密码套。服务器还会发送服务器证书，其中包含公钥、通用服务器信息（如完全限定域名 (FQDN))以及来自\
  \ CA 的签名。\n\n3. 客户端通过检查所提供的信息是否与请求匹配，以及验证所有签名来验证服务器证书。\n\n4. 如果证书通过验证，客户端创建一个会话密钥。该会话密钥用服务器的公钥加密并发送回服务器。\n\
  \n5. 服务器解密会话密钥，之后可以使用它可以加密解密客户端和服务器之间传输的所有数据。\n\n##### 配置 Apache 使用 TLS 证书\n\n要配置\
  \ Apache 使用 TLS 证书，必须完成三个步骤：\n\n1. 必须获取证书。\n2. 必须安装所需的 Apache TLS 模块。\n3. 必须配置 Apache（虚拟）主机使用证书。\n\
  \n以下步骤描述了如何应用这些步骤为 `sales.example.com` 服务器创建证书：\n\n1. 输入 `yum install crypto-utils\
  \ mod_ssl` 安装所需的包。\n2. 输入 `genkey sales.example.com`。这会打开 `genkey` 工具，它会告诉你密钥和证书将存储在何处（参见图\
  \ 33.1](#ch33.html_ch33fig01)）。从第一个界面，选择 **Next（下一步）**。\n\n![Image](img/33fig01.jpg)\n\
  \n**图 33.1** 使用 `genkey` 创建证书。\n\n3. 在第二步中，需要指定密钥尺寸。尺寸越大安全性越高但速度越慢。建议接受 2048 位的默认值。只有在特殊情况下，使用更安全的密钥才有意义。\n\
  4. 选择密钥大小后，会生成一些随机位。这需要一些时间。你可以通过在你正在工作的服务器上进行一些随机活动（如移动鼠标）或运行命令 `rngd -r /dev/urandom`\
  \ 来为你创建熵从而缩短所需时间。\n5. 生成证书和密钥后，你可以配置带有 TLS 的虚拟主机。使用 TLS 配置虚拟主机与配置普通主机没有太大区别，你有一些额外的参数需要处理。一个很好的起点是\
  \ `/etc/httpd/conf.d/ssl.conf` 文件（参见列表 33.2](#ch33.html_lis02)）。\n\n**列表 33.2**\
  \ `/etc/httpd/conf.d/ssl.conf` 内容\n\n```\n[root@server2]# grep -v '^#' /etc/httpd/conf.d/ssl.conf\n\
  \nListen 443 https\n\nSSLPassPhraseDialog exec:/usr/libexec/httpd-ssl-pass\n\nSSLSessionCache\
  \ shm:/run/httpd/sslcache\n\nSSLSessionTimeout  300\n\nSSLRandomSeed startup:/dev/urandom\n\
  \nSSLRandomSeed connect builtin\n\nSSLryptoDevice builtin\n\n<VirtualHost _default_:443>\n\
  \nSSLEngine on\n\nSSLProtocol all -SSLv2\n\nSSLCipherSuite HIGH:MEDIUM:!NULL:!MD5\n\
  \nSSLCertificateFile /etc/pki/tls/certs/localhost.crt\n\nSSLCertificateKeyFile /etc/pki/tls/private/localhost.key\n\
  \n<Files ~ \"\\.(cgi|shtml|phtml|php?)$\">\n\n    SSLOptions +StdEnvVars\n</Files>\n\
  \n<Directory \"/var/www/cgi-bin\">\n\n    SSLOptions +StdEnvVars\n</Directory>\n\
  \nBrowserMatch \"MSIE [2-5]\" \\\n          keepalive ssl-unclean-shutdown \\\n\
  \          downgrade-1.0 force-response-1.0\n\nCustomLog logs/ssl_request_log \\\
  \n          \"%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \\\"%r\\\" %b\"\n</VirtualHost>\n\
  ```\n\n***\n\n6. 配置虚拟主机，首先将 `VirtualHost _default_:443` 行更改为 `VirtualHost *:443`。然后，更改\
  \ `ServerName` 以匹配你将使用的服务器名称。\n7. 修改 `ServerName` 后，你需要更改 `SSLCertificateFile` 和\
  \ `SSLCertificateKeyFile` 以匹配你刚刚创建的文件。\n8. 如果你想将所有通过普通 HTTP 端口 80 进入的流量重定向到 TLS\
  \ 安全主机，在你之前创建的 `/etc/httpd/conf.d/sales.example.com.conf` 定义中包含以下块：\n\n点击此处查看代码图片\n\
  \n```\n<VirtualHost *:80>\n    ServerName sales.example.com\n    RewriteEngine on\n\
  \    RewriteRule ^(/.*)$  https://%{HTTP_HOST}$1\n          [redirect=301]\n</VirtualHost>\n\
  ```\n\n9. 重启 httpd 服务，使用 `systemctl start httpd.service`，并确保它已启用，即使用 `systemctl\
  \ enable httpd.service`。\n\n\n\n\n\n设置一个使用 TLS 增强安全性的 Web 服务器似乎很困难。其实并非如此。一旦你获取了公钥/私钥对，只需要配置\
  \ `SSLCertificateFile` 和 `SSLCertificateKeyFile` 指令，告诉 Apache 这些文件所在的位置即可。你不需要记住任何特定的语法细节，因为你需要的所有内容都在使用\
  \ TLS 时需要安装的 `mod_ssl` 软件包中。\n\n***\n\n## 部署 CGI 应用\n\n目前没有多少网站只提供静态内容。大多数 Web 服务器都以某种方式使用脚本来提供动态生成内容的访问。这使得\
  \ Web 服务器能够显示用户所需的确切内容，并以用户所使用的浏览器可以解释的方式进行呈现。大多数现代 Web 服务器都在使用某种 CGI 应用。提供动态内容有多种方法，这里讨论了其中。\n\
  \n### 使用通用网关接口\n\n通用网关接口 (CGI) 是提供动态内容的最老方法之一。当访问 CGI 资源时，Apache 服务器会将该资源作为程序执行，并使用该进程的输出。使用\
  \ CGI 的优势是它非常灵活；它没有定义生成动态内容需要哪种脚本语言。因此，可以使用 Perl 脚本，也可以使用编译后的 C 程序或 Java 可执行文件。\n\
  \n要提供 CGI 内容，存在一些要求：\n\n![Image](img/squf.jpg) 必须存在 `ScriptAlias ScriptAlias /cgi-bin/\
  \ \"/var/www/cgi-bin/\"`。（当然，它可以更改为指向文件系统上的任何其他目录。）\n\n![Image](img/squf.jpg) `ScriptAlias`\
  \ 目录（即存储脚本的目录）必须提供 `httpd_sys_script_exec_t` SELinux 上下文类型。\n\n### 提供动态 PHP 内容\n\
  \nPHP 脚本经常用于 Apache 环境。可以使用 CGI 包含 PHP 脚本，但更好的方法是安装 `mod_php` Apache 模块，它可以启用内部\
  \ PHP 解释器，效率要高得多。安装 `mod_php` 会添加配置文件 `/etc/httpd/conf.d/php.conf`，其中包含几行允许 PHP\
  \ 脚本执行的配置（参见列表 33.3）。\n\n**列表 33.3** `/etc/httpd/conf.d/php.conf` 内容\n\n点击此处查看代码图像\n\
  \n***\n\n```\n[root@server2 conf.d]# grep -v '^#' php.conf\n\n<FilesMatch \\.php$>\n\
  \    SetHandler application/x-httpd-php\n</FilesMatch>\n\nAddType text/html .php\n\
  \nDirectoryIndex index.php\n\nphp_value session.save_handler \"files\"\n\nphp_value\
  \ session.save_path    \"/var/lib/php/session\"\n```\n\n***\n\n此配置文件确保任何具有 `.php`\
  \ 扩展的文件都会被 `httpd` 服务器执行，这为允许 PHP 脚本执行提供了一个非常简单的解决方案。\n\n### 使用动态 Python 内容\n\n\
  与 PHP 脚本一样，Python 脚本也可以两种方式执行。它们可以作为 CGI 脚本包含，或者使用 Web 服务器网关接口 (WSGI)。该接口提供了一个新指令。\n\
  \n1. 安装 `mod_wsgi`。\n2. 在虚拟主机中添加 `WSGIAlias`。它接受两个参数，第一个参数指向别名，第二个参数指向 Python 脚本。因此，该行可能如下：\n\
  ```\nWSGIAlias /webapp /opt/webapp.py\n```\n3. 确保设置了 `httpd_sys_content_t`。\n\n\
  ### 连接数据库\n\n大多数 Web 服务器需要存储和获取数据。MariaDB 通常用于此。当数据库在同一主机时，不需要额外的配置。如果数据库是远程的，你必须确保启用了\
  \ `httpd_can_connect`。配置数据库 显示如何设置 MariaDB。\n\n不要等到考试才发现 `httpd-manual` 提供的内容。现在就做；考试时你没有时间了。\n\
  \n***\n\n## 配置私有目录\n\n某些 Web 服务器需要安全保护并仅允许授权用户访问。为了实现这一点，你需要创建 Web 服务器用户并在配置中添加所有必要的元素。\n\
  \n第一次添加 Web 服务器用户时，使用 `htpasswd -c /etc/httpd/htpasswd username`。对于所有后续用户，*不要*使用\
  \ `-c` 选项；它每次使用时都会创建一个新文件并覆盖旧文件！此外注意，用户将以明文形式写入配置文件，请确保将其存储在安全位置。\n\n在创建一个或多个 Apache\
  \ 用户后，你需要在虚拟主机配置中包含此块：\n\n```\n<Directory /var/www/html/secret>\n    AuthType Basic\n\
  \    AuthName \"secret files\"\n    AuthUserFile /etc/httpd/htpasswd\n    Require\
  \ user valid-user\n</Directory>\n```\n\n\n\n\nApache 访问限制也可以针对组访问进行配置。这种方法与配置基于用户的访问限制非常相似。以下步骤总结了如何设置基于组的\
  \ Apache 访问限制：\n\n1. 创建一个包含组信息的文件。你可以在想要限制访问的目录下创建一个名为 `.htgroup` 的文件，你也可以在通用位置（如\
  \ `/etc/httpd/htgroup`）创建一个特定的组文件。\n\n2. 在 `htgroup` 文件中，定义组名和成员用户。格式如下行所示：\n\n\
  ```\nsales: lisa bob linda jamie\n```\n\n3. 在目录规格中，像如下行所示使用 `AuthGroupFile` 和 `Require`\
  \ 指令：\n\n点击此处查看代码图像\n\n```\nAuthGroupFile /etc/httpd/htgroup\nRequire group sales\n\
  ```\n\n4. 确保已根据本节较早部分介绍所阐述的那样，使用 `htpasswd` 命令创建了该组的成员。请记住，如果你不想覆盖任何当前存在的 `htpasswd`\
  \ 文件，则在使用 `htpasswd` 命令时*不应该*使用 `-c` 选项。\n\n![Image](img/key_topic.jpg)![Image](img/33tab04.jpg)\n\
  \n**表 33.4** Apache 访问限制常用的选项。\n\n#### 总结\n\n在本章中，你学习了如何处理高级 Apache 配置。你复习了设置 Apache\
  \ 虚拟主机技能，并学习了如何应用正确的 SELinux 设置。之后，你学习了如何管理 TLS 设置、配置动态 Web 应用程序访问，以及仅针对身份验证的用户或组配置访问。\n\
