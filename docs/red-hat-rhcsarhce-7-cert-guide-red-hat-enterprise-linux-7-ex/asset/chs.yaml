  \ server.\n```\n\n**列表 35.1** 使用 `systemctl`  Mariadb 状态\n\n安装 MariaDB 后，最好对其进行加固。为了实现这一点，请运行\
  \ `mysql_secure_installation` 命令。这将应用一些安全设置。这里列出了所问的问题，以及每个问题的简短解释。列表 35.2 显示了命令的输出，其中所有问题均以粗体显示：\n\
  \n**输入 root 当前密码（按回车表示无）：** 如前所述，如果数据库 root 用户已有密码，请在此输入。如果没有，直接按 `Enter` 继续。\n\n\
  **设置 root 密码？[Y/n]:** 回 `y` 设置 root 密码并输入两次你想使用的密码。\n\n**移除匿名用户？[Y/n]:** 回 `y` 移除数据库中默认存在的匿名用户。\n\
  \n**禁止 root 登录？[Y/n]:** 回 `y` 以确保 root 用户仅可以本地登录。对于想要远程访问的 root 用户，仍然可以先通过安全壳 (SSH)\
  \ 连接到服务器。\n\n**移除测试数据库及其的访问权限？[Y/n]:** 安装时会创建一个测试数据库。出于安全考虑，移除此测试数据库是个好主意，但因为本章的目的是学习与数据库交互，你应该对这个问题回答\
  \ `n`。\n\n**现在刷新权限表吗？[Y/n]:** 回 `y` 保存并应用你所做的更改。\n\n**列表 35.2** 运行 `mysql_secure_installation`\n\
  \n\n\n\n它们。这仅用于测试，并让安装过程更顺畅。在移动到生产环境之前，你应该删除它们。\n\n删除匿名用户？[Y/n] y\n... 成功！\n\n通常情况下，root\
  \ 只应该被允许从 'localhost' 连接。这确保了有人无法从网络猜出 root 密码。\n\n允许远程登录 root？[Y/n] y\n... 成功！\n\
  \n默认情况下，MariaDB 附带有一个名为 'test' 的数据库，任何人都可以访问。这同样仅用于测试，在移动到生产环境之前应该删除。\n\n删除 test\
  \ 数据库及其访问权限？[Y/n] n\n... 跳过。\n\n重新加载权限表将确保目前为止进行的所有更改都会立即生效。\n\n现在重新加载权限表吗？[Y/n]\
  \ y\n... 成功！\n\n清理中...\n\n全部完成！如果你已经完成了上述所有步骤，你的 MariaDB 安装现在应该是安全的。\n\n感谢使用 MariaDB！\n\
  \n***\n\nMariaDB 既可以仅在本地使用，也可以通过网络访问。两者各有优势。如果 MariaDB 可以通过网络访问，则很容易设置服务栈，其中数据库运行在某一台服务器上，而相关服务运行在其他地方。这为数据库提供了可能的最高性能，由于数据库可以通过网络访问，这也增加了出现故障的风险。如果你想最大限地提高安全性，请考虑完全关闭网络访问。这意味着使用该数据库的所有服务都位于同一台服务器上。\n\
  \n要确定 MariaDB 是否将使用网络，你将修改 `/etc/my.cnf` 配置文件（MariaDB 的主配置文件）中的几个参数。列表 35.3 显示了该文件的示例内容。\n\
  \n**列表 35.3** My.cnf 示例内容\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server1 ~]# cat /etc/my.cnf\n\
  \n[mysqld]\ndatadir=/var/lib/mysql\nsocket=/var/lib/mysql/mysql.sock\n\n# 建议禁用符号链接以防止各种安全风险\n\
  symbolic-links=0\n\n# 使用 systemd 时，用户和组设置将被忽略。\n# 如果你需要在不同的用户或组下运行 mysqld，\n# 请根据\
  \ http://fedoraproject.org/wiki/Systemd 中的指令\n# 为 mariadb 自定义 systemd 单元\n\n[mysqld_safe]\n\
  log-error=/var/log/mariadb/mariadb.log\npid-file=/var/run/mariadb/mariadb.pid\n\n\
  #\n# 包含目录下的所有文件\n#\n!includedir /etc/my.cnf.d\n```\n\n***\n\n在 `[mysqld]` 部分，你可以设置许多参数，包括以下：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) **bind-address** 数据库服务监听的地址。如果你想启用通过所有\
  \ IP 地址（IPv4 以及 IPv6）访问，请设置为 `::`，或者留空以启用通过 IPv4 访问。或者，你可以指定数据库应绑定的特定接口的 IP 地址。\n\
  \n![Image](img/squf.jpg) **skip-networking** 设置为 1 以禁用所有网络。在这种情况下，与其他进程的通信将通过 socket\
  \ 进行，默认 `/var/lib/mysql/mysql.sock`。当你使用这种方法时，客户端软件也需要通过 socket 访问数据库，而不能使用 localhost\
  \ 进行数据库访问。\n\n![Image](img/squf.jpg) **port** 指定用于 TCP/IP 连接的监听端口。有关你可以配置的设置的信息，请查看\
  \ `/usr/libexec/mysqld --verbose` 的输出。\n\n如果需要远程访问数据库，则需要打开防火墙。MariaDB 使用 `firewalld`\
  \ 服务，位于 `/usr/lib/firewalld/services/mysql.xml`，可以使用以下两个命令使用标准端口 3306 轻松打开防火墙：\n\
  \n```\nfirewall-cmd --permanent --add-service=mysql\nfirewall-cmd --reload\n```\n\
  \n在练习 35.1 中，你将学习如何安装 MariaDB。\n\n***\n\n### 练习 35.1 安装 MariaDB\n\n在练习 35.1 中，你执行\
  \ MariaDB 的基础安装。你禁用了网络访问并应用了安全设置。然后你验证某些默认数据库是否可用。\n\n1. 输入 `yum install -y mariadb\
  \ mariadb-server` 安装数据库软件。\n2 使用 `systemctl start mariadb; systemctl enable mariadb`\
  \ 启动并启用 mariadb 软件。\n3. 使用 `ss -tulpen | grep mysql` 验证 mariadb 正在监听。你应该看到一个 `mysqld`\
  \ 进程正在监听端口 3306。\n4. 通过向 `/etc/my.cnf` 中添加 `skip_networking=1` 行来禁用网络，并使用 `systemctl\
  \ restart mariadb` 重启 mariadb。\n5. 使用 `mysql_secure_installation` 开始保护 mariadb。为数据库\
  \ root 用户设置密码为 `password`，禁用 root 访问并删除测试数据库和任何匿名用户。\n6. 输入 `mysql -u root -p` 以\
  \ root 身份登录数据库，数据库会提示输入密码。\n7. 以 root 身份登录数据库，让数据库提示输入密码。在 MariaDB 提示符下输入 `show\
  \ databases;` 查看可用的数据库。结果应如列表 35.4 所示（见下文）。8 输入 `exit;` 退出 MariaDB 交互式 shell。\n\n\
  ***\n\n**列表 35.4** 登录 root 后输入 `show databases;` 查看可用的数据库\n\n点击此处查看代码图像\n\n***\n\
  \n```\nMariaDB [(none)]> show databases;\n+--------------------+\n| Database   \
  \        |\n+--------------------+\n| information_schema |\n| mysql            \
  \ |\n| performance_schema |\n+--------------------+\n4 rows in set (0.00 sec)\n\
  ```\n\n\n\n\n### 5. 输入 `SHOW TABLES;`，这将显示许多表，其中包含名为 user 的表。\n\n### 6. 输入 `describe\
  \ user;` 以获取用户表中的记录名称。这提供了一个详细的描述，如你在列表 35.5 中所示。它会告诉你表中有哪些记录或字段，字段中期望的是什么类型的数据，并提供有关表内容的更多属性。\n\
  \n#### 列表 35.5 显示表内容\n点击此处查看代码图像\n\n```\nMariaDB [mysql]> describe user;\n\n+-----------------+--------------------+------+-----+---------+-------+\n\
  | Field           | Type               | Null | Key | Default | Extra |\n+-----------------+--------------------+------+-----+---------+-------+\n\
  | Host            | char(60)          | NO   | PRI |         |         |\n| User\
  \            | char(16)          | NO   | PRI |         |         |\n| Password\
  \        | ch                 | NO   |     |         |         |\n...          \
  \     |                    |      |     |         |         |\n| max_connections\
  \ | int(11) unsigned | NO   |     | 0       |         |\n| max_user_connect| int(11)\
  \           | NO   |     | 0       |         |\n| plugin          | char(64)   \
  \       | NO   |     |         |         |\n| authent_string  | text           \
  \    | NO   |     | NULL    |         |\n+-----------------+------------------------+-----+---------+-------+\n\
  42 rows in set (0.00 sec)\n```\n\n在 MariaDB 以及 MySQL 中，你将使用结构化查询语言 (`SQL`) 来操作数据库中的数据。基本命令允许你进行创建、读取、更新和删除。这些命令也称为\
  \ CRUD 操作：**创建 (create)**、**选择 (select)**、**更新 (update)** 和**删除 (delete)**。在向数据库插入数据之前，你需要至少创建一个表。使用\
  \ `CREATE TABLE` 来执行此操作，随后是你想要添加的表名，例如 `CREATE TABLE addressbook(name VARCHAR(40),\
  \ street VARCHAR(40));`。在定义表时，除了要存储在表中的数据类型外，你还定义了想要添加到表中的记录。在这个示例中，这只是 `VARCHAR`\
  \ 类型，它允许你存储 40 字节的可变数据。\n\n如果你正在处理一个已经定义的数据库，或者如果你需要验证你刚刚创建的内容，你需要找出表的属性有哪些。使用 `DESCRIBE`\
  \ 来执行此操作，例如执行 `DESCRIBE addressbook;`。这会给出一个类似于列表 35.6 的结果，它首先显示如何创建表，然后显示如何获取存储在表中的字段信息。\n\
  \n#### 列表 35.6 请求表内容\n点击此处查看代码图像\n\n```\nMariaDB [addressbook]> CREATE TABLE addressbook(name\
  \ VARCHAR(40),street VARCHAR(40));\nQuery OK, 0 rows affected (0.00 sec)\n\nMariaDB\
  \ [addressbook]> DESCRIBE addressbook;\n+--------+-------------------+------+------+-------+\n\
  | Field  | Type        | Null | Key | Default | Extra |\n+--------+-------------------+------+------+-------+\n\
  | name   | varchar(40) | YES  |     |         |       |\n| street | varchar(40)\
  \ | YES |     |         |       |\n+--------+-------------------+------+------+-------+\n\
  2 rows in set (0 sec)\n```\n\n在你找到创建表中数据需要哪些字段后，可以使用 `INSERT` 命令来添加它们：`INSERT INTO\
  \ addressbook (name,street) VALUES ('linda jones','state street');`。在这个命令中，你首先引用需要添加数据的表名，列出你想要输入的特定属性值。注意，将值放在单引号之间是至关重要的。如果没有这些引号，命令将无法运行。要验证插入数据的命令已生效，使用\
  \ `SELECT * from addressbook;`。\n\n要删除数据，使用 `DELETE` 命令，例如 `DELETE FROM addressbook\
  \ WHERE name ='lucy';`。注意，在这个命令中，不要忘记 `WHERE` 部分。如果你忽略了它，表中的所有记录都将被擦除。同样注意在该命令中（如任何其他命令一样），你需要指定要应用哪个表。\n\
  \n要更改数据，使用 `UPDATE` 命令：`UPDATE addressbook SET street='main street' WHERE name='linda\
  \ jones';`。注意，在这个命令中，你需要使用 `WHERE` 语句告诉 MariaDB 要使用哪条记录，并使用 `SET` 命令指定你想要更改的属性及其新值。\n\
  \n要读取记录，使用 `SELECT` 命令：`SELECT name,street FROM addressbook;`。或者，你可以选择使用 `*` 来显示所有属性：`SELECT\
  \ * FROM addressbook;`。\n\n\n\n\n在处理权限时，更改权限后重新加载所有权限非常重要。要执行此操作，请使用 `FLUSH PRIVILEGES;`\
  \ 命令。要显示分配特定用户的权限，可以使用 `SHOW GRANTS FOR user@host;`。\n\n在练习 35.2 中，你将创建一个简单的数据库并对其进行用户权限操作。\n\
