  \n**a. `chown 007 filename`**\n\n**b. `chmod 077 filename`**\n\n**c. `chmod 660\
  \ filename`**\n\n**d. `chmod 770 filename`**\n\n**5.** 哪个命令可以让你在目录上设置 SGID 权限？\n\
  \n**a. `chmod u+s /dir`**\n\n**b. `chmod g-s /dir`**\n\n**c. `chmod g+s /dir`**\n\
