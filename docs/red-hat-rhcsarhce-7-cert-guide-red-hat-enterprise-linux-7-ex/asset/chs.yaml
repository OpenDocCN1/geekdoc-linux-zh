  \n**b.** 使用 `echo 1 > /proc/sys/net/ipv4/ip_forward` 来启用内核级 IP 转发。\n\n**c.** 确保\
  \ radvd 服务已启动以路由数据包。\n\n**d.** ... 如何在 RHEL 7 主机的接口上启用数据包转发？\n\n*(注：由于用户提供的原文文本在第\
  \ 10 题后出现了重复和截断，翻译文已根据原文逻辑进行了对应处理)*\n\n\n\n\n通过这种方式创建绑定接口（bond）后，相关的配置文件也会被创建。使用这些命令创建绑定接口后，你可以使用\
  \ `nmcli dev show mybond0` 显示其当前状态。该命令的结果如列表 30.2 所示。\n\n**列表 30.2** 验证绑定设备的状态\n\
  \n点击查看代码图像\n\n```\n[root@server1 ~]# nmcli dev show mybond0\n\nGENERAL.DEVICE: \
  \                        mybond0\nGENERAL.TYPE:                           bond\n\
  GENERAL.HWADDR:                         DE:8A:A4:7E:DC:05\nGENERAL.MTU:        \
  \                    1500\nGENERAL.STATE:                          70 (connecting\
  \ (getting IP\nconfiguration))\nGENERAL.CONNECTION:                     bond-mybond0\n\
  GENERAL.CON-PATH:                       /org/freedesktop/NetworkManager/ActiveConnection/2\n\
  ```\n\n此时，你需要为想要在绑定设备上使用的 IP 地址创建配置。要做到这一点，请使用 `nmcli con mod bond-mybond0 ipv4.addresses\
  \ 192.168.4.210/24`。然后，使用 `nmcli con up bond-mybond0` 启用连接，你就拥有了一个可以工作的绑定接口。\n\n\
  你到为止的工作结果将保存到 `/etc/sysconfig/network-scripts` 目录中，你现在应该会看到三个不同的配置文件：\n\n![Image](img/squf.jpg)\
  \ ifcfg-bond-mybond0\n![Image](img/squf.jpg) ifcfg-bond-slave-eno16777736\n![Image](img/squf.jpg)\
  \ ifcfg-bond-slave-eno33554992\n\n如果你仍然看到引用物理网卡上使用的旧连接的配置文件（例如 `ifcfg-eno16777736`），你可以安全地删除它。在列表\
  \ 30.3 中，你可以看到绑定配置文件的内容，而列表 30.4 显示了其中一个绑定从接口文件的内容。\n\n**列表 30.3** 验证 bond0 配置文件的内容\n\
  \n点击查看代码图像\n\n```\n[root@server1 network-scripts]# cat ifcfg-bond-mybond0\nDEVICE=mybond0\n\
  TYPE=Bond\nBONDING_MASTER=yes\nBOOTPROTO=none\nDEFROUTE=yes\nIPV4_FAILURE_FATAL=no\n\
  IPV6INIT=yes\nIPV6_AUTOCONF=yes\nIPV6_DEFROUTE=yes\nIPV6_FAILURE_FATAL=no\nNAME=bond-mybond0\n\
  UUID=98e61443-cd2a-4eb6-9a9f-c652d95c22fa\nONBOOT=yes\nBONDING_OPTS=mode=active-backup\n\
  IPADDR=192.168.4.210\nPREFIX=24\nIPV6_PEERDNS=yes\nIPV6_PEERROUTES=yes\n```\n\n\
  **列表 30.4** 验证绑定-从接口配置文件的内容\n\n点击查看代码图像\n\n```\n[root@server1 network-scripts]#\
  \ cat ifcfg-bond-slave-eno16777736\nTYPE=Ethernet\nNAME=bond-slave-eno16777736\n\
  UUID=7621cc16-86eb-408a-afbf-3ca4d56c1752\nDEVICE=eno16777736\nONBOOT=yes\nMASTER=mybond0\n\
  SLAVE=yes\n```\n\n在运行中的绑定连接上，你可以通过 `/proc/net/bonding` 接口验证当前状态，其中会为添加到配置中的每个绑定连接创建一个配置文件。通过此文件，你可以轻松地看到接口的当前状态，包括正在使用的\
  \ MAC 地址和接口的当前状态。列表 30.5 显示了该文件的可能内容。\n\n**列表 30.5** 通过 /proc 监控绑定连接的当前状态\n\n点击查看代码图像\n\
  \n```\n[root@server1 ~]# cat /proc/net/bonding/mybond0\nEthernet Channel Bonding\
  \ Driver: v3.7.1 (April 27, 2011)\nBonding Mode: fault-tolerance (active-backup)\n\
  Primary Slave: None\nCurrently Active Slave: eno33554992\nMII Status: up\nMII Polling\
  \ Interval (ms): 100\nUp Delay (ms): 0\nDown Delay (ms): 0\nSlave Interface: eno33554992\n\
  MII Status: up\nSpeed: 1000 Mbps\nDuplex: full\nLink Failure Count: 0\nPermanent\
  \ HW addr: 00:0c:29:46:f0\n```\n\n\n\n\n请注意，通过此命令你已经分配了一个 `IPv4` 地址配置，但该配置尚未生效。此时，启动它并没有太大意义，因为还没有将网络设备分配到该团队接口（team\
  \ interface）。要实现这一点，请使用 `nmcli con add type team-slave ifname <DEVICE> master <TEAM>`\
  \ 命令。在该命令中，你需要将 `<DEVICE>` 部分替换为你想要添加的网络设备名称，并将 `<TEAM>` 部分替换为你刚刚创建的团队接口名称。因此，以下命令将两个网络设备添加到团队接口中：\n\
  \n点击此处此处查看代码图片\n\n```\nnmcli con add type team-slave ifname eno167777736 master\
  \ team0\nnmcli con add type team-slave ifname eno33554960 master team0\n```\n\n\
  完成此操作后，你就可以启动 `team0` 接口：\n\n```\nnmcli con up team0\n```\n\nListing 30.6 显示了目前为止发布的所有命令摘要。\n\
  \n**Listing 30.6** 创建团队接口命令概览\n\n点击此处此处查看代码图片\n\n* * *\n\n```\n1  nmcli con add\
  \ type team con-name team0 config '{ \"runner\": {\"name\":\n\"loadbalance\"}}'\n\
  2  nmcli con show\n3  nmci con mod team0 ipv4.addresses 192.168.4.220/24\n4  ip\
  \ a\n5  nmcli con add type team-slave ifname eno16777736 master team0\n6  nmcli\
  \ con add type team-slave ifname eno33554960 master team0\n7  nmcli con up team0\n\
  8  ip a\n```\n* * *\n\n要监控 `team0` 接口的可用性，你可以使用 `nmcli con show` 命令。或者，你可以使用 `teamdctl`\
  \ 命令查询 `teamd` 用户空间进程。注意，该命令使用的是团队设备的名称，而不是团队接口名称。使用 `ip addr show` 获取当前使用的设备名称概览。Listing\
  \ 30.7 显示了该命令的输出。\n\n**Listing 30.7** 使用 `teamdctl` 监控团队接口配置\n\n点击此处此处查看代码图片\n\n\
  * * *\n\n```\n[root@localhost ~]# teamdctl team0 state\nsetup:\n  runner: loadbalance\n\
  ports:\n  eno33554960\n    link watches:\n      link summary: up\n      instance[link_watch_0]:\n\
  \        name: ethtool\n        link: up\n  eno16777736\n    link watches:\n   \
  \   link summary: up\n      instance[link_watch_0]:\n        name: ethtool\n   \
  \     link: up\n```\n* * *\n\n### 深入了解团队配置\n\n团队配置存储在三个不同层级的文件中。层次结构的顶端是 Listing\
  \ 30.8 所示的团队接口文件。\n\n* * *\n\n**注意**\n\n你可以直接修改 `/etc/sysconfig/network-scripts`\
  \ 下配置文件的内容。修改后，使用 `nmcli con reload` 让 NetworkManager 读取配置变更。\n\n* * *\n\n**Listing\
  \ 30.8** 团队接口文件内容\n\n点击此处此处查看代码图片\n\n* * *\n\n```\n[root@localhost network-scripts]#\
  \ cat ifcfg-team0\nDEVICE=nm-team\nTEAM_CONFIG=\"{ \\\"runner\\\": {\\\"name\\\"\
  : \\\"loadbalance\\\"}}\"\nDEVICETYPE=Team\nBOOTPROTO=dhcp\nDEFROUTE=yes\nIPV4_FAILURE_FATAL=no\n\
  IPV6INIT=yes\nIPV6_AUTOCONF=yes\nIPV6_DEFROUTE=yes\nIPV6_FAILURE_FATAL=no\nNAME=team0\n\
  UUID=679b70f9-1445-4e25-9f66-93b358974627\nONBOOT=yes\nIPADDR0=192.168.4.220\nPREFIX0=24\n\
  PEERDNS=yes\nPEERROUTES=yes\nIPV6_PEERDNS=yes\nIPV6_PEERROUTES=yes\n```\n* * *\n\
  \n如你所示，该文件的内容与普通网络配置文件非常相似，区别在于它包含一个 `TEAM_CONFIG` 。团队接口本身不包含任何关于分配给它的各个接口的信息。\n\
  \n第二层级配置文件用于团队从设备（team slave）。Listing 30.9 显示了该文件的典型内容。\n\n**Listing 30.9** 团队从设备配置\n\
  \n点击此处此处查看代码图片\n\n* * *\n\n```\n[root@localhost network-scripts]# cat ifcfg-team-slave-eno16777736\n\
  BOOTPROTO=none\nDEFROUTE=yes\nPEERDNS=yes\nPEERROUTES=yes\nIPV4_FAILURE_FATAL=no\n\
  IPV6INIT=yes\nIPV6_AUTOCONF=yes\nIPV6_DEFROUTE=yes\nIPV6_PEERDNS=yes\nIPV6_PEERROUTES=yes\n\
  IPV6_FAILURE_FATAL=no\nNAME=team-slave-eno1677736\nUUID=6ffc4eff-adde-474b-8ddc-1e6de1c5b5\n\
  DEVICE=eno1677736\nONBOOT=yes\nTEAM_MASTER=679b70f9-1445-4e25-9f66-93b358974627\n\
  DEVICETYPE=TeamPort\n```\n* * *可以看到，有两个特定的团队配置行。`TEAM_MASTER` 行包含了主设备的 `UUID`，`DEVICETYPE`\
  \ 行标识设备类型为团队设备。在该文件中，`DEVICE` 行标识了接口连接的设备。\n\n第三层由设备文件组成（参见 Listing 30.10）。这只是普通的设备文件内容，无法看出该设备关联了团队接口。与普通设备文件唯一的区别是\
  \ `ONBOOT` 参数被设置为 `no`。这是因为该设备不是作为独立设备管理的，而是通过团队驱动程序管理的。\n\n**Listing 30.10** 团队成员设备配置\n\
  \n点击此处此处查看代码图片\n\n* * *\n\n```\n[root@localhost network-scripts]# cat ifcfg-team0\n\
  677736\nHWADDR=00:0C:29:88:D5:53\nTYPE=Ethernet\nBOOTPROTO=dhcp\nDEFROUTE=yes\n\
  PEERDNS=yes\nPEERROUTES=yes\nIPV4_FAILURE_FATAL=no\nIPV6INIT=yes\nIPV6_AUTOCONF=yes\n\
  IPV6_DEFROUTE=yes\nIPV6_FAILURE_FATAL=no\nNAME=team0\nUUID=e94fe839-6fdf-4fc5-bf33-3c2a190\n\
  ONBOOT=no\n```\n\n\n\n\n\n13. 高亮你刚刚创建的团队连接。选择“Deactivate”（禁用）。再次高亮它，现在选择“Activate”（激活）。有时，这可能会导致程序挂死。如果发生这种情况，请直接重启。）\n\
  \n14. 输入 `teamdctl team0 state view` 来验证你新团队连接的当前状态。\n\n15. 再次启动 `nmtui`，并选择“Edit\
  \ a Connection”（编辑连接）。选择你刚刚创建的团队连接并向下滚动到 IPv4 配置选项。将此选项设置为“Manual”（手动）并输入 IP 地址\
  \ `192.168.4.220/24`。保存配置并重启你的虚拟机。你现在应该能够在指定的 IP 地址上建立网络连接了。\n\n***\n\n在 练习 30.1\
  \ 中，你学习了如何创建一个组队网络连接。正如你所看到的，创建此类连接涉及许多步骤。该过程看起来可能很复杂，但它可以归纳为五个基本步骤，应该按照特定的顺序应用它们：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) 注意本地设备名称。\n\n![Image](img/squf.jpg)\
  \ 将本地接口设置为*不*自动启动。\n\n![Image](img/squf.jpg) 在本地接口上禁用 IP 配置，并在团队连接上启用它。\n\n![Image](img/squf.jpg)\
  \ 创建团队设备，并指定名称。\n\n![Image](img/squf.jpg) 根据其名称添加设备类型。\n\n### 网络组网的故障排除\n\n正如你之前读过的，团队接口由多个网络端口组成。在排除网络团队接口的故障时，你必须记住以下特殊性：\n\
  \n![Image](img/squf.jpg) 当其中一个端口接口启动时，团队接口就会启动，但这不会启动所有其他端口接口。\n\n![Image](img/squf.jpg)\
  \ 启动团队接口不会自动启动端口接口。\n\n![Image](img/squf.jpg) 停止团队接口会停止涉及的端口接口。\n\n![Image](img/squf.jpg)\
  \ 静态 IP 连接可以在没有任何端口激活状态的团队接口上启动。\n\n![Image](img/squf.jpg) DHCP 连接只有在端口可用时才能启动。\n\
  \n用于调试组网的实用工具是 `teamnl`。例如，输入 `teamnl team0 ports` 查看团队设备中的端口及其当前状态。另一个有用的 `teamnl`\
  \ 命令是 `teamnl team0 options`，它列出当前为团队接口设置的选项。列表 30.1 显示此命令的结果所示。\n\n列表 30.1 转储组网选项\n\
  \n```\n[root@localhost ~]# teamnl team0 options\n  queue_id (eno3354960) 0\n  priority\
  \ (eno3354960) 0\n  user_link_enabled (eno3354960) false\n  user_linkup (eno3354960)\
  \ true\n  enabled (eno3354960) true\n  queue_id (eno1677736) 0\n  priority (eno1677736)\
  \ 0\n  user_link_enabled (eno1677736) false\n  user_linkup (eno1677736) true\n \
  \ enabled (eno1677736) true\n  mcast_rejoin_interval 0\n  mcast_rejoin_count 0\n\
  \  notify_peers_interval 0\n  notify_peers_count 0\n  mode roundrobin\n```\n\n你还可以转储团队接口中设备的配置。要这样做，使用\
  \ `teamdctl team0 config dump`。这会以驱动程序使用的 JSON 格式转储配置。当配置变得复杂时，你可以将此命令的输出重定向到文件中，以便轻松应用到其他配置中。列表\
  \ 30.12 显示了 `teamdctl team0 config dump` 命令的输出。\n\n列表 30.12 以 JSON 格式转储配置\n\n```\n\
  [root@localhost ~]# teamdctl team0 config dump\n{\n  \"device\": \"team0\",\n  \"\
  ports\": {\n    \"eno1677736\": {\n      \"link_watch\": {\n        \"name\": \"\
  ethtool\"\n      }\n    },\n    \"eno3354960\": {\n      \"link_watch\": {\n   \
  \     \"name\": \"ethtool\"\n      }\n    }\n  },\n  \"runner\": {\n    \"name\"\
  : \"roundrobin\"\n  }\n}\n```\n\n#### 配置 IPv6 地址\n\n多年来，专家一直告诉世界，IPv4 地址几乎已经分配完毕，管理员需要开始考虑替代方案。看来，由于有了网络地址转换\
  \ (NAT) 等高级网络解决方案，公司未来仍可以使用其基于 IPv4 的 IT 基础设施运行很长一段时间。尽管如此，IPv4 地址短缺是一个事实，每位管理员都至少应该具备一些关于\
  \ IPv6 工作的知识。\n\n##### 理解 IPv6 地址\n\n在 IPv4 地址中，使用 32 位来配置网络地址。这使得理论上最多有约 40 亿个唯一的网络地址。由于目前可用的\
