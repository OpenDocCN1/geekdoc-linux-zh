  c. 1 EB\nd. 1 EiB\n\n3. 通常用于创建 Linux 分区的类型是什么？\n\na. 81\nb. 82\nc. 83\nd. 8e\n\n\
  4. 你预计在 KVM 虚拟机看到的默认磁盘设备名称是什么？\n\na. `/dev/sda`\nb. `/dev/hda`\nc. `/dev/vda`\n\
  d. `/dev/xvda`\n\n5. 下列哪个说法错误？\n\na. 要在 MBR 磁盘上使用 `gdisk`。\nb. `fdisk` 也也提供了管理 GPT\
