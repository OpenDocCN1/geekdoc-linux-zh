  \n\n\n\n\n# 1.** 导致内核污染（tainted kernel）的原因是什么？**\n\na. 不提供开源驱动的内核驱动程序\nb. 为不同的操作系统开发但移植到\
  \ Linux 的驱动程序\nc. 运行失败的驱动程序\nd. 不支持的驱动程序。\n\n# 2.** 显示自启动以来内核事件的命令名称是什么？**\n\na.\
  \ `logger`\nb. `dmesg`\nc. `klogd`\nd. `journald`\n\n# 3.** 哪个命令可以让你找到正在使用的内核实际版本？**\n\
  \na. `uname -r`\nb. `uname -v`\nc. `procinfo -k`\nd. `procinfo -l`\n\n# 4.** 哪个命令显示你当前正在使用的\
