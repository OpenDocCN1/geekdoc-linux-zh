  \ 管理和操作目录\n\n为了组织文件，Linux 使用目录（也称为文件夹）。\n\n使用 `..` 来移除你刚刚进入的目录。`rmdir` 命令允许你删除目录，但它只在目录为空时才起作用。\n\
  \n***\n\n### 练习 3.2 操作目录\n\n在本练习中，你将学习如何操作目录。\n\n1. 使用用户名打开目录。\n2. 输入 `pwd` 查看当前目录。\n\
  3. 输入 `cd /` 切换到根目录。\n4. 输入 `cd` 回到临时目录。\n... `cd` 回到......................... `pwd`\
  \ 查看当前目录。\n5. 输入 `ls` 列出目录中的文件。\n6. 输入 `ls -a` 查看所有文件，包括隐藏文件。\n7. 输入 `ls -l` 查看文件详情。\n\
  8. 输入 `mkdir directory` 创建新目录。\n9. 输入 `cd directory` 进入新目录。\n10. 输入 `cd ..` 返回父目录。\n\
  11. 输入 `mv file1 file2` 重命名文件。\n12. 输入 `mv file1 directory` 移动文件。\n13. 输入 `cp file1\
  \ directory` 复制文件。\n14. 输入 `rm file` 删除文件。\n15. 输入 `rmdir directory` 删除空目录。\n16.\
  \ 输入 `rm -rf directory` 删除目录及其内容。\n\n***\n\n### 练习 3.3 操作文件\n\n在本练习中，你将学习如何操作文件。\n\
  \n1. 使用用户名打开目录。\n2. 输入 `pwd` 查看当前目录。\n3. 输入 `cd /` 切换到根目录。\n4. 输入 `cd` 回到主目录。\n\
  5. 输入 `ls` 列出目录中的文件。\n6. 输入 `ls -a` 查看所有文件，包括隐藏文件。\n7. 输入 `ls -l` 查看文件详情。\n8. 输入\
  \ `mkdir directory` 创建新目录。\n9. 输入 `cd directory` 进入新目录。\n10. 输入 `cd ..` 返回父目录。\n\
  11. 输入 `mv file1 file2` 重命名文件。\n12. 输入 `mv file1 directory` 移动文件。\n13. 输入 `cp file1\
  \ directory` 复制文件。\n14. 输入 `rm file` 删除文件。\n15. 输入 `rmdir directory` 删除空目录。\n16.\
  \ 输入 `rm -rf directory` 删除目录及其内容。\n\n***\n\n### 练习 3.4 使用绝对和相对路径名\n\n在本练习中，你将学习如何使用绝对和相对路径名。\n\
  \n1. 使用用户名打开目录。\n2. 输入 `pwd` 查看当前目录。\n3. 输入 `cd /` 切换到根目录。\n4. 输入 `cd` 回到主目录。\n\
  5. 输入 `ls` 列出目录中的文件。\n6. 输入 `ls -a` 查看所有文件，包括隐藏文件。\n7. 输入 `ls -l` 查看文件详情。\n8. 输入\
  \ `mkdir directory` 创建新目录。\n9. 输入 `cd directory` 进入新目录。\n10. 输入 `cd ..` 返回父目录。\n\
  11. 输入 `mv file1 file2` 重命名文件。\n12. 输入 `mv file1 directory` 移动文件。\n13. 输入 `cp file1\
  \ directory` 复制文件。\n14. 输入 `rm file` 删除文件。\n15. 输入 `rmdir directory` 删除空目录。\n16.\
  \ 输入 `rm -rf directory` 删除目录及其内容。\n\n***\n\n### 练习 3.5 使用通配符\n\n在本练习中，你将学习如何使用通配符。\n\
  \n1. 使用用户名打开目录。\n2. 输入 `pwd` 查看当前目录。\n3. 输入 `cd /` 切换到根目录。\n4. 输入 `cd` 回到主目录。\n\
  5. 输入 `ls` 列出目录中的文件。\n6. 输入 `ls -a` 查看所有文件，包括隐藏文件。\n7. 输入 `ls -l` 查看文件详情。\n8. 输入\
  \ `mkdir directory` 创建新目录。\n9. 输入 `cd directory` 进入新目录。\n10. 输入 `cd ..` 返回父目录。\n\
  11. 输入 `mv file1 file2` 重命名文件。\n12. 输入 `mv file1 directory` 移动文件。\n13. 输入 `cp file1\
  \ directory` 复制文件。\n14. 输入 `rm file` 删除文件。\n15. 输入 `rmdir directory` 删除空目录。\n16.\
  \ 输入 `rm -rf directory` 删除目录及其内容。\n\n\n\n\n![Image](img/squf.jpg) 如果当前目录设置为 `/home/lisa`，你也可以使用\
  \ `cp file1 ../lara`。在这个命令中，目标文件的名称使用了 `..`，这意味着返回上一级。`..` 后面跟着 `/lara`，因此目标文件的完整名称将被解释为“返回上一级”（即你位于\
  \ `/home`），然后从那里寻找 `/lara` 子目录。\n\n* *\n\n### 提示\n\n如果你是刚开始接触 Linux，理解相对文件名并不总是那么容易。不过有一个简单的替代办法：只需确保你始终使用绝对路径。虽然输入字符较多，但它更简单，让你犯错更少。\n\
  \n* *\n\n在第 2 章 的“使用基本工具”中，你学习了如何使用 Tab 补全来完成命令。使用 Tab 补全让处理长命令变得容易得多。Tab 补全同样适用于文件名。如果你有一个长文件名，如\
  \ `my-long-file-name`，尝试输入 `my-` 并按下 `Tab` 键。如果当前目录下只有一个文件以 `my-` 开头，该文件名将自动补全。如果有多个以\
  \ `my-` 开头的文件，你必须按两次 `Tab` 键来查看所有可用文件名的列表。\n\n### 列出文件和目录\n\n在处理文件和目录时，如果能够显示当前目录的内容将非常有用。为此，你可以使用\
  \ `ls` 命令。如果不带任何参数使用，`ls` 会显示当前目录的内容。一些常用的参数可以让 `ls` 的工作更轻松。表 3.4 提供了概述。\n\n![Image](img/key_topic.jpg)![Image](img/03tab04.jpg)\n\
  \n**表 3.4 ls** 常用命令行选项\n\n* *\n\n### 提示\n\nLinux 上的隐藏文件是以点开头命名的文件。尝试以下操作：`touch\
  \ .hidden`。接下来，输入 `ls`。你将看不到它。然后输入 `ls -a`。你就能看到它了。\n\n* *\n\n使用 `ls` 和 `ls -l`\
  \ 时，你会发现文件是有颜色区分的。不同文件类型使用不同颜色有助于区分不同的文件。不过，不要过度关注它们，因为所使用的颜色是变量设置的结果，这在其他 Linux\
  \ Shell 或其他 Linux 服务器上可能会不同。\n\n### 复制文件\n\n为了组织服务器上的文件，你经常需要复制文件。`cp` 命令可以帮助你实现这一点。复制单个文件并不困难：只需使用\
  \ `cp /path/to/file /path/to/destination`。例如，要将文件 `/etc/hosts` 复制到 `/tmp` 目录，可以使用\
  \ `cp /etc/hosts /tmp`。这会将 `hosts` 文件写入 `/tmp`。\n\n通过 `cp` 命令，你还可以复制整个子目录及其包含的所有内容。为此，请使用\
  \ `-R` 选项，它代表递归（recursive）（你在许多其他 Linux 命令中也会看到 `-R` 选项）。例如，要将 `/etc` 目录及其所有内容复制到\
  \ `/tmp` 目录，可以使用命令 `cp -R /etc /tmp`。\n\n在使用 `cp` 命令时，需要考虑文件的权限和其他属性。如果没有额外的选项，你可能会面临权限未复制的风险。如果你想保留当前权限，请使用\
  \ `-a` 选项，它让 `cp` 以归档模式运行。此选项确保在复制时保留权限和所有其他文件属性。因此，要将主目录及其所有内容的精确状态复制到 `/tmp` 目录，请使用\
  \ `cp -a ~ /tmp`。\n\n使用 `cp` 时的一个特殊情况是隐藏文件。默认情况下，隐藏文件不会被复制。处理隐藏文件也有三种解决方案：\n\n![Image](img/squf.jpg)\
  \ `cp /somedir/.* /tmp` 这会将所有以点开头的文件（即隐藏文件）复制到 `/tmp`。对于 `/somedir` 中以点开头的目录会报错，因为没有使用\
  \ `-R` 选项。\n\n![Image](img/squf.jpg) `cp -a /somedir/ .` 这会将整个 `/somedir` 目录及其内容复制到当前目录。结果是在当前目录下创建一个\
  \ `somedir` 的子目录。\n\n![Image](img/squf.jpg) `cp -a /somedir/. .` 这会将所有文件（包括普通文件和隐藏文件）复制到当前目录。\n\
  \n### 移动文件\n\n要移动文件，使用 `mv` 命令。该命令将文件从当前位置移除并放入新位置。你也可以用它来重命名文件（实际上，这无非复制并删除原始文件）。让我们看一些示例：\n\
  \n![Image](img/squf.jpg) `mv myfile /tmp` 将文件 `myfile` 从当前目录移动到 `/tmp`。\n\n![Image](img/squf.jpg)\
  \ `mkdir somefiles; mv somefiles /tmp` 这先创建一个名为 `somefiles` 的目录，然后将该目录移动到 `/tmp`。注意，如果目录包含文件，这种方法同样有效。\n\
  \n![Image](img/squf.jpg) `mv myfile mynewfile` 将文件 `myfile` 重命名为文件 `mynewfile`。\n\
  \n### 删除文件\n\n（注：原文此后存在大量重复的“移动文件”示例和“删除文件”标题，翻译已根据逻辑进行清理）\n\n\n\nLinux 在 inode（索引节点）中存储关于文件的管理数据。Linux\
  \ 上的每个文件都有一个 inode，inode 中存储了关于文件的重要信息：\n\n![Image](img/squf.jpg) 存储文件内容的数据块\n\n\
  ![Image](img/squf.jpg) 创建、访问和修改日期\n\n![Image](img/squf.jpg) 权限\n\n![Image](img/squf.jpg)\
  \ 文件所有者\n\n只有一项重要信息没有存储在 inode 中：即名称。名称存储在目录中，每个文件名都知道需要指向哪个 inode 来访问进一步的文件信息。有趣的是，inode\
  \ 并不知道自己拥有哪个名称；它只知道与该 inode 关联的有多少个名称。这些名称被称为硬链接（hard links）。\n\n当你创建一个文件时，你会给它起一个名字。从基本上，这个名字就是一个硬链接。在\
  \ Linux 文件系统中，可以为同一个文件创建多个硬链接。这非常有用，因为这让你能够从多个不同的位置访问该文件。不过，硬链接也有一些限制：\n\n![Image](img/squf.jpg)\
  \ 硬链接必须存在于同一设备上。\n\n![Image](img/squf.jpg) 你不能为目录创建硬链接。\n\n![Image](img/squf.jpg)\
  \ 原始文件的拥别名的数量。当最后一个名称被删除时，内容也会被删除。\n\n硬链接的优点在于，第一个硬链接和第二个硬链接之间没有区别。它们都只是硬链接，如果某个文件曾经存在的第一个硬链接被删除，不会影响其他仍然存在的硬链接。Linux\
  \ 操作系统在许多位置使用链接来使文件更易访问。\n\n### 理解符号链接\n\n符号链接（symbolic link，也称为软链接 soft link）并不直接链接到\
  \ inode，而是指向文件的名称。这使得符号链接变得灵活得多，但也存在一些缺点。符号链接的优点是它们可以链接其他设备上的文件，也可以链接目录。主要的缺点是，当原始文件被删除时，符号链接将失效并无法再次工作。\n\
  \n图 3.2 给出了 inode、硬链接和符号链接之间关系的示意性概述。\n\n![Image](img/03fig02.jpg)\n\n**图 3.2**\
  \ 链接与 inode 概述。\n\n### 创建链接\n\n使用 `ln` 命令创建链接。它使用的参数顺序与 `cp` 和 `mv` 相同；首先指定源名称，然后是目标名称。如果你想创建一个符号链接，请使用\
  \ `-s` 选项，然后指定源和目标文件或目录。然而，有一个重要的限制：为了能够创建硬链接，你必须是你想要链接的项的所有者。这是 RHEL 7 中引入的一项新安全限制。\n\
  \n表 3.5 显示了一些示例。\n\n![Image](img/key_topic.jpg)![Image](img/03tab05.jpg)\n\n**表\
  \ 3.5 ln** 使用示例\n\n`ls` 命令将揭示一个文件是否为链接：\n\n![Image](img/squf.jpg) 在 `ls -l` 命令的输出中，如果文件是符号链接，第一个字符是\
  \ `l`。\n\n![Image](img/squf.jpg) 如果文件是符号链接，`ls -l` 的输出会在文件名之后显示它所链接的项名称。\n\n![Image](img/squf.jpg)\
  \ 如果文件是硬链接，`ls -l` 显示硬链接计数器。在 列表 3.4 的输出中，这是位于 hosts 文件的 `root root` 之前的数字 3。\n\n\
  **列表 3.4** 使用 `ls -l` 显示链接属性\n\n点击此处查看代码图像\n\n```\n[root@localhost tmp]# \\ls -l\n\
  \ntotal 3\n\nlrwxrwxrwx. 1 root root   5 Jan 19 04:38 home -> /home\n-rw-r--r--.\
  \ 3 root root 158 Jun  7  2013 hosts\n```\n\n注意\n\n在 列表 3.4 中，使用的命令是 `\\ls -l` 而不是\
  \ `ls -l`。`ls` 命令默认是一个别名（alias），它负责在显示 `ls` 输出时使用不同的颜色；命令前的 `\\` 会导致不使用该别名。\n\n\
  ### 删除链接\n\n删除链接可能是危险的。为了让你了解原因，让我们考虑以下步骤：\n\n1. 在你的主目录下创建一个名为 `test` 的目录：`mkdir\
  \ ~/test`。\n2. 从 `/etc` 将所有以 a, b, c, d, 或 e 开头的文件复制到此目录：`cp /etc/[a-e]* ~/test`。\n\
  3. 使用不带参数的 `cd` 确保你在主目录中。\n4. 输入 `ln -s test link`。\n5. 使用 `rm link`。这会删除该链接。（*不要*对链接使用\
  \ `rm -rf`）。\n\n\n\n\n要创建一个归档，你可以使用 `tar -cf archivename.tar /files-you-want-to-archive`\
  \ 命令。如果你想查看操作过程，请同时使用 `-v` 选项。要将文件放入归档，你至少需要对该文件具有读取权限。使用 root 用户执行 `tar -cvf /root/homes.tar\
  \ /home`，可以将 `/home` 目录及其所有子内容写入 `/root` 目录下的 `homes.tar` 文件。注意所使用的选项；这些选项的顺序非常重要。\n\
  \n最初，`tar` 在选项前并不使用连字符（`-`）。现代的 `tar` 实现与其他所有 Linux 程序一样使用了该连字符，但为了向下兼容，它们仍然允许不带连字符的旧用法。有关相关选项的完整概述，请参见表\
  \ 3.4。\n\n在使用 `tar` 管理归档时，也可以向现有归档添加文件或更新归档。要向归档添加文件，你需使用 `-r` 选项。例如，使用 `tar -rvf\
  \ /root/homes.tar /etc/hosts` 将 `/etc/hosts` 文件添加到归档。\n\n要更新当前存在的归档文件，你可以使用 `-u`\
  \ 选项。因此，使用 `tar -uvf /root/homes.tar /home` 将 `/home` 中所有文件的较新版本写入归档。\n\n### 监控和提取\
  \ Tar 文件\n\n在提取文件之前，最好先了解可能预期的内容。可以使用 `-t` 选项来查找。例如，输入 `tar -tvf /root/homes.tar`\
  \ 来查看 tar 归档的内容。\n\n***\n\n**提示**\n\n创建归档文件时使用如 `.tar` 或 `.tgz` 等扩展名是一个良好的习惯，这样可以被轻松识别，但并不是每个人都这样做。如果你认为一个文件是\
  \ tar 归档但又不确定，可以使用 `file` 命令。例如，如果你输入 `file somefile`，`file` 命令会分析其内容并在命令行上显示该文件的类型。\n\
  \n***\n\n要提取归档的内容，请使用 `tar -cvf /archivename`。这会在当前目录下提取归档。这意味着如果你在输入 `tar -xvf\
  \ /root/homes.tar` 时位于 `/root` 目录，且该文件包含一个目录 `/home`，那么在提取后你将拥有一个新目录 `/root/home`，其中包含文件的全部内容。这可能不是你想要实现的结果。有两种解决方案可以将提取的内容直接放在你想要存放的地方：\n\
  \n![Image](img/squf.jpg) 在提取归档文件之前，`cd` 到你想要提取文件的目录。\n\n![Image](img/squf.jpg) 使用\
  \ `-C /targetdir` 选项指定你想要提取文件的目标目录。例如，如果你想将文件 `/root/homes.tar` 的内容放在 `/tmp` 目录，可以使用\
  \ `tar -xvf homes.tar -C /tmp`。\n\n***\n\n**注意**\n\nRHCSA 目标提到你需要了解如何配合 `star` 工作。`star`\
  \ 工具的设计目的是为了支持归档非默认文件属性，例如访问控制列表（参见第 7 章，“权限管理”）或 SELinux 文件上下文（参见第 21 章，“管理 SELinux”）。在当前的发行版本中，`tar`\
  \ 也提供了此功能，因此不再真正需要使用 `star` 了。\n\n***\n\n除了提取整个归档文件外，还可以从归档中提取单个文件。这样做请使用 `tar -xvf\
  \ /archivename.tar /file-you-want-to-extract`。例如，如果你的归档 `etc.tar` 包含你想提取的文件 `/etc/hosts`，请使用\
  \ `tar -xvf /root/etc.tar /etc/hosts`。\n\n### 使用压缩\n\n许多文件包含大量冗余。压缩程序允许通过消除这些冗余使文件占用更少的磁盘空间。在目前你看到的所有\
  \ `tar` 命令示例中，没有任何一个字节被压缩过。最初，在创建归档后，必须使用单独压缩工具进行压缩，例如 `gzip` 或 `bzip2`。在创建 `home.tar`\
  \ 后，你可以使用 `gzip home.tar` 对其进行压缩。`gzip` 会用其压缩版本 `home.tar.gz` 替换 `home.tar`，后者占的空间要少得多。\n\
  \n作为使用 `gzip` 的替代方案，你可以使用 `bzip2` 工具。最初，`bzip2` 使用更高效的加密算法，导致文件尺寸更小，但目前与 `gzip`\
  \ 工具的结果相比几乎没有区别了。\n\n要解压缩用 `gzip` 或 `bzip2` 压缩的文件，你可以使用 `gunzip` 和 `bunzip2` 工具；将在练习\
  \ 3.5 中处理该命令的一些示例。\n\n作为从命令行使用这些工具的替代方案，你在使用 `tar` 创建归档时可以包含 `-z` (gzip) 或 `-j`\
  \ (bzip2) 选项。这将立即压缩文件大小。在提取时不需要使用这些选项。`tar` 工具将识别压缩内容并自动为你解压缩。在练习 3.5 中，你将应用新学的\
  \ tar 技能。表 3.6 最重要的 tar 选项的概述。\n\n![Image](img/key_topic.jpg)![Image](img/03tab06.jpg)\n\
  \n**表 3.6** tar 选项概述\n\n***\n\n### 练习 3.5 使用 tar\n\n在此练习中，你将使用 `tar` 命令管理归档。\n\n\
  **1.** 在你的服务器上打开一个 root shell。通过登录，root 用户的家目录将成为当前目录，因此在此练习中使用的所有相对文件名都指向 `/root/`。\n\
