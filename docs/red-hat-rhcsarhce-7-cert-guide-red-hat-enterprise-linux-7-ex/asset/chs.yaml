  \ addr show`。除了已使用的 IP 地址外，你还将看到新设置的 IP 地址。\n\n# 6. 输入 `ifconfig`。注意你没有看到新设置的 IP\
  \ 地址（`ifconfig` 没有可以显示它的选项）。这就是为什么你不应该再使用 `ifconfig` 的示例之一。\n\n# 7. 输入 `ss -tul`。你现在将看到服务器上所有监听的\
  \ UDP 和 TCP 端口列表。\n\n## 配置网络\n\n如本章早期所述，RHEL 7 上的网络由 `NetworkManager` 服务管理。你可以使用\
  \ `systemctl status NetworkManager` 来验证其状态。当 `NetworkManager` 启动时，它会读取 `/etc/sysconfig/network-scripts`\
  \ 中的网络配置脚本，这些脚本以 `ifcfg` 开头，后面跟着网卡的名称。\n\n在 RHEL 7 中处理网络配置时，你应该了解设备和连接的区别：\n\n![Image](img/jpg)\
  \ 设备是一个网络接口。![Image](img/jpg) 连接是用于设备上的配置信息。\n\n在 RHEL 7 中，你可以为一个设备创建多个连接。这在移动电脑上是有意义的，可以区分连接家庭网络时使用的设置和连接公司网络所需的设置。在用户电脑上切换设备连接是常见操作。要管理你想要分配给设备的网络连接，请使用\
  \ `nmui` 或 `nmcli`。\n\n### 考试提示\n\n红帽希望你了解如何使用 `nmcli`。然而，这个命令并不那么容易使用，而且考试结束时，你需要用适当的设置配置网络设备。因此，在\
  \ RHCSA 考试中，使用 `nmui` 是完全可以的；这会让你的工作变得得多。\n\n## 使用 nmcli 配置网络\n\n在本章早些时候，你学习了如何使用\
  \ `ip` 验证网络配置。你还应用了 `ip addr add` 在网络接口上临时设置 IP 地址。你使用 `ip` 命令进行的所有操作都是非持久的。如果你想让配置持久化，请使用\
  \ `nmui` 或 `nmcli`。\n\n良好的开始是使用 `nmcli` 显示所有连接。这会显示激活和非激活连接。你可以很容易看出区别，因为非激活连接当前没有分配给设备（参见列表\
  \ 8.5）。\n\n### 列表 8.5 显示当前状态\n\n点击此处查看代码图像\n\n```\nroot@server2]# nmcli con show\n\
