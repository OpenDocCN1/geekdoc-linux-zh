  d. 创建 `/var/log/journal` 文件并设置适当的权限。\n\n### 基础主题\n\n#### 理解系统日志\n\nLinux 服务器上使用的大多数服务都会将信息写入日志文件。这些信息可以被写入不同的目标，并且在系统日志中查找相关信息有多种解决方案。服务至少可以使用三种不同的方法来写入日志信息：\n\
  \n**直接写入：** 某些服务直接将日志信息写入日志文件，甚至包括像 Apache Web 服务器和 Samba 文件服务器这样的一些重要服务。\n\n**rsyslogd：**\
  \ `rsyslogd` 是 `syslogd` 的增强，`syslogd` 是一个负责管理集中日志文件的服务。`syslogd` 已经存在很久。\n\n**journald：**\
  \ 随着 `systemd` 的引入，日志服务 `systemd-journald` 也被引入。该服务与 `systemd` 紧密集成，允许管理员在使用 `systemctl\
  \ status` 命令监控服务状态的同时，从日志中读取详细信息。\n\n##### 理解 rsyslogd 和 journald 的角色\n\n在 RHEL\
  \ 7 上，`journald`（由 `systemd-journald` 守护进程实现）提供高级的日志管理系统。`journald` 收集来自内核、整个启动过程以及服务的消息，并将这些消息写入事件日志中。该事件日志以二进制格式存储，可以使用\
  \ `journalctl` 命令进行查询。\n\n由于 `journald` 与 `systemd` 紧密集成，它允许管理员在使用 `systemctl status`\
  \ 命令监控服务状态的同时，从日志中读取详细信息。\n\n`rsyslogd` 是 `syslogd` 的增强，`syslogd` 是一个负责管理集中日志文件的服务。`syslogd`\
