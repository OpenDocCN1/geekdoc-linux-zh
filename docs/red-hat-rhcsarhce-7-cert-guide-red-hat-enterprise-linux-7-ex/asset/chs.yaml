  \ LVM             a500 FreeBSD disklabel    a501 FreeBSD boot\na502 FreeBSD swap\
  \      a0a503 FreeBSD UFS           a504 FreeBSD ZFS\na505 FreeBSD Vinum/RAID  a580\
  \ Midnight BSD data  a581 Midnight BSD boot\na582 Midnight BSD swap  a583 Midnight\
