  \ `/tmp/etchome.tgz`？\n\n**10.** 你如何从上一步中创建的 `/tmp/etchome.tgz` 提取出 `/etc/passwd`\
  \ 文件？\n\n### 基础主题\n\n#### 使用常用的文本文件相关工具\n\n在我们开始讨论查找包含特定文本的文本文件的最佳方法之前，让我们看看如何高效地显示文本文件。表\
  \ 4.2 提供了用于此目的常用命令的概述。\n\n![Image](img/key_topic.jpg)![Image](img/04tab2.jpg)\n\n\
  **表 4.2** 管理文本文件内容的常用工具\n\n\n\n\n\n除了对文本文件使用这些命令外，它们在管道（pipes）中使用也可能证明非常有用。例如，你可以使用命令\
  \ `less /etc/passwd` 来用 `less` 分页器 打开 `/etc/passwd` 文件的内容，你也可以使用命令 `ps aux | less`，将命令\
  \ `ps aux` 的输出发送到分页器 `less` 以于阅读。\n\n### 以少胜多 (Doing More with Less)\n\n在很多情况下，作为\
  \ Linux 管理员，你需要读取文本文件的内容。`less` 工具提供了一种方便的方法。若要在 `less` 中打开文本文件的内容，只需输入 `less` 后跟你想查看的文件名，例如\
  \ `less /etc/passwd`。\n\n在 `less` 中，你可以使用键盘上的 `PageUp` 和 `PageDown` 键来浏览文件内容。看够了吗？那么你可以按\
  \ `q` 退出 `less`。同样非常有用的是，你可以使用 `/sometext` 进行正向搜索、`?sometext` 进行反向搜索在 `less` 中轻松搜索特定内容。使用\
  \ `n` 重复上一次搜索。\n\n如果你觉得这听起来很熟悉，那确实如此。你在 `vim` 和 `man` 中见过类似的行为。这是因为所有这些命令都基于相同的代码。\n\
  \n***\n\n注意\n\n从以前以前，`less` 的开发是因为它比为了逐页查看文件内容的经典 UNIX 工具提供了更多功能。因此，这个理念是“以少胜多”。开发者们并不喜欢那样，于是他们也增强了更多功能。结果是\
  \ `more` 和 `less` 都提供了许多相似的功能，使用这些工具中的某一个已经不再重要了。不过，有一个显著的区别，那就是 `more` 工具在到达文件末尾就会结束。为了防止这种行为，你可以使用\
  \ `-p` 选项启动 `more`。在练习 4.1 中，将应用一些基础的 `less` 技能。\n\n***\n\n### 练习 4.1 应用基础 Less\
  \ \n\n在本练习中，你将通过处理文件内容和命令输出应用一些基础的 `less` 技能。\n\n1. 在终端输入 `less /etc/passwd`。这会在\
  \ `less` 分页器中打开 `/etc/passwd` 文件。\n2. 输入 `G` 跳到文件的最后一行。\n3. 输入 `/root` 查找文本 `root`。你会发现所有\
  \ `root` 文本出现的地方都被高亮了。\n4. 输入 `q` 退出 `less`。\n5. 输入 `ps aux | less`。这会将 `ps aux`\
  \ 命令的输出（显示所有进程列表）发送到 `less`。浏览列表。\n6. 按 `q` 退出 `less`。\n\n***\n\n### 使用 cat 显示文件内容\n\
  \n`less` 工具用于读取长文本文件。如果一个文本文件并不长，你可能使用 `cat` 更好。这个工具直接将文本文件的内容转储到启动它的终端上。如果文本文件很短，这非常方便。然而，如果文本文件很长，你会看到所有内容在屏幕上滚动，而只显示能够适应终端屏幕的行。使用\
  \ `cat` 非常简单。只需输入 `cat` 后跟你想查看的文件名。例如，使用 `cat /etc/passwd` 在你的电脑屏幕上显示该文件的内容。\n\n\
  ***\n\n提示\n\n`cat` 工具从头到尾将文件内容转储到屏幕上，这意味着对于一个长文件，你只会看到文件的最后几行。如果你对前面的行感兴趣，可以使用 `tac`\
  \ 工具，它给出 `cat` 的反转结果。\n\n***\n\n### 使用 head 和 tail 显示文件的第一行或最后一行\n\n如果一个文本文件包含大量信息，对输出进行一些过滤会很有。你可以使用\
  \ `head` 和 `tail` 工具来实现。在文本文件上使用 `head` 默认会显示该文件的前 10 行。在文本文件上使用 `tail` 默认显示最后 10\
  \ 行。你可以通过添加 `-n` 后跟你想查看的数字来调整显示的行数。因此，`tail -n 5 /etc/passwd` 显示 `/etc/passwd` 文件的最后五行。\n\
  \n***\n\n提示\n\n在旧版本的 `head` 和 `tail` 中，你必须使用 `-n` 选项来指定你想查看的行数。在这两个工具当前的版本中，你也可以省略\
  \ `-n` 选项。因此，`tail -5 /etc/passwd` 或 `tail -n 5 /etc/passwd` 提供的结果完全相同。\n\n***\n\
  \n你可以配合 `tail` 使用的另一个有用选项是 `-f`。该选项首先显示你指定的文件的最后 10 行，但当新行被文件时，它会刷新显示。这对于监控日志文件非常方便。命令\
  \ `tail -f /var/log/messages` 是一个常用命令，用于实时显示写入主日志文件 `/var/log/messages` 的消息。\n\n\
  结合 `tail` 和 `head` 时，你也可以做一些智能操作。例如，假设你想查看 `/etc/passwd` 文件的第 11 行。这样做使用 `head -n\
  \ 11 /etc/passwd | tail -n 1`。管道之前的命令显示文件的前 11 行。结果被发送到管道，并在结果上使用 `tail -n 1`，导致只显示第\
  \ 11 行。在练习 4.2 中，你将应用一些基础的 `head` 和 `tail` 操作。\n\n***\n\n### 练习 4.2 使用基础 head 和\
  \ tail 操作\n\n在本练习中，你学习如何使用 `head` 和 `tail` 获取你完全想要。\n\n1. 输入 `tail -f /var/log/messages`。你会看到\
  \ `/var/log/messages` 的最后几行正在显示。文件不会自动关闭。\n2. 输入 `Ctrl+C` 退出之前的命令。\n3. 输入 `head\
  \ -n 5 /etc/passwd` 显示 `/etc/passwd`的前五行。\n4. 输入 `tail -n 2 /etc/passwd` 显示 `/etc/passwd`\
  \ 的最后两行。\n5. 输入 `head -n 5 /etc/passwd | tail -n 1` 显示 `/etc/passwd` 的第五行。\n\n***\n\
  \n### 使用 cut 过滤特定列\n\n在处理文本文件时，过滤特定字段可能很有。假设你需要查看 `/etc/passwd` 文件中的所有用户。在该文件中，定义了多个字段，其中第一个包含用户名。要过滤特定字段，`cut`\
  \ 命令很有用。要这样做，使用 `-d` 选项指定字段分隔符，后跟 `-f` 以及你想过滤的特定字段编号。因此，如果你想过滤 `/etc/passwd` 文件的第一个字段，完整命令是\
  \ `cut -d : -f 1 /etc/passwd`。你可以在列表 4.1 中看到结果。\n\n**列表 4.1** 使用 **cut** 过滤字段\n\n\
  点击此处查看图像\n\n***\n\n```bash\n[root@localhost ~]# cut -f 1 -d : /etc/passwd\nroot\n\
  bin\ndaemon\nadm\nlp\nsync\nshutdown\nhalt\n...\n```\n\n***\n\n### 使用 sort 排序文件内容和输出\n\
  \n另一个用于文本文件的有用命令是 `sort`。正如你可能猜到的，这个命令对文本进行排序。例如，如果你输入 `sort /etc/passwd`，内容将按字母排序。你也可以对命令的输出使用\
  \ `sort` 命令，例如 `cut -f 1 -d : /etc/passwd | sort`，这会对 `/etc/passwd` 文件中的第一列进行排序。\n\
  \n默认情况下，`sort` 命令按字母排序。在某些情况下，这并不方便，因为需要排序的内容可能是数字或其他格式。`sort` 命令提供了不同的选项来帮助排序这些特定类型的数据。例如，输入\
  \ `cut -f 2 -d : /etc/passwd | sort -n` 按数字顺序对 `/etc/passwd` 文件的第二个字段进行排序。反向排序也很有用；如果你使用命令\
  \ `du -h | sort -rn`，你会得到一个按大小排序的文件列表，最大的文件排在最前面。\n\n\n\n\n\n你也可以使用 `sort` 命令并指定你想要排序的列。例如，使用\
  \ `sort -k3 -t : /etc/passwd` 命令，该命令使用字段分隔符 `:` 对 `/etc/passwd` 文件的第三列进行排序。\n\n\
  你可能还会喜欢这种选项：对文件的特定列或命令的输出进行排序。例如 `ps aux` 命令，它提供了 Linux 服务器上最繁忙进程的概览。（代码列表 4.2 显示了该命令的部分输出。）\n\
  \n**代码列表 4.2** 命令 `ps aux`提供了 Linux 服务器上最繁忙进程的概览\n\n点击此处查看代码图片\n\n***\n\n```\n[root@localhost\
  \ ~]# ps aux | tail -n 10\n\npostfix    1350  0.0  0.7  91872  3848 ?       S  \
  \    Jan24   0:00 qmgr -l\n      -t unix -u\nroot      2162  0.0  0.3 115348  1928\
  \ tty1    Ss+  Jan24   0:00 -bash\npostfix    5131  0.0  0.7  91804  3832 ?    \
  \   S      12:10   0:00 pickup\n      -l -t unix -u\nroot      5132  0.0  0.0  \
  \     0       0 ?       S      12:10   0:00\n      [kworker/0:1]\nroot      5146\
  \  0.0  0.9 133596  4868 ?       Ss   12:12   0:00 sshd:\n      root@pts/0\nroot\
  \      5150  0.0  0.3 115352  1940 pts/0   Ss   12:12   0:00 -bash\nroot      5204\
  \  0.0  0.0       0       0 ?       S   12:20   0:00\n      [kworker/0:2]\nroot\
  \      5211  0.0  0.0       0       0 ?       S      12:26   0:00\n      [kworker/0:0]\n\
  root      5212  0.0  0.2 123356  1320 pts/0   R+   12:26   0:00 ps aux\nroot   \
  \   5213  0.0  0.1 107928   672 pts/0   R+   12:26   0:00 tail\n      -n 10\n```\n\
  \n***\n\n要直接根据第三列对该命令的输出进行排序，可以使用命令 `ps aux | sort -k3`。\n\n### 使用 `wc` 统计行、单词和字符\n\
  \n在处理文本文件时，你有时会得到大量的输出。在决定特定情况下哪种方法最好之前，你可能想对正在处理的文本量有一个大致的概念。在这种情况下，`wc` 命令非常有用。在输出中，该命令会提供三个不同的结果：行数、单词数和字符数。\n\
  \n例如，考虑 `ps aux` 命令。以 root 身份执行时，该命令会列出服务器上运行的所有进程列表。统计精确进程数量的一种解决方案是将 `ps aux`\
  \ 的输出通过管道交给 `wc`，如 `ps aux | wc`。你可以在代码列表 4.3 中查看命令的结果。在代码列表 4.3 的结果中，你可以看到总行数为\
  \ 90 行，命令输出中有 1,045 个单词和 7,583 个字符。\n\n**代码列表 4.3** 使用 `wc` 统计行数、单词数和字符\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]# ps aux | wc\n90 1045 7583\n```\n\n\n\n\n\n如果你确切知道要查找多少个前一个字符，你也可以指定一个数字，例如\
  \ `re\\{2\\}d`，它会匹配 red 也会匹配 reed。另一个有用的需要的正则表达式是 `?`，它匹配前一个字符的零次或一次。表 4.3 提供了最重要正则表达式的概述。\n\
  \n![Image](img/key_topic.jpg)![Image](img/04tab03.jpg)\n\n**表 4.3** 最重要的正则表达式\n\n\
  让我们来看一个来自 man 页面 `semanage-fcontext` 的正则表达式示例，它与 SELinux 的管理有关（参见第 21 章，“管理 SELinux”）。示例行包含以下正则表达式：\n\
  \n`\"/web(/.*)?\"`\n\n在这个正则表达式中，引用了文本 `*/web`。这个字符串后面可以紧跟正则表达式 `(/.*)?`，这意味着零次或一次\
  \ `(/.*)`，实际上意味着它后面可以是什么都没有，也可以是 `(/.*)`。`(/.*)` 指一个斜杠，后面可以跟任意数量的字符。换句话说，该正则表达式指的是文本\
  \ `*/web`，其后面可能跟有任何字符。\n\n### 使用 grep 分析文本\n\n处理正则表达式的终极工具是 grep，它的意思是“通用正则表达式解析器”。你已经看到的很多例子都是基于\
  \ `grep` 命令的。`grep` 命令有几个非常有用的选项可以使其更高效。表 4.4 描述了一些最实用的选项。\n\n![Image](img/key_topic.jpg)![Image](img/04tab04.jpg)\n\
  \n**表 4.4** 最实用的 `grep` 选项\n\n在练习 4.3 中，你将通过这些 `grep` 选项完成一些示例。\n\n* * *\n\n###\
  \ 练习 4.3 常用的 grep 选项\n\n在此练习中，你将练习常用的 grep 选项。\n\n**1.** 输入 `grep ‘^#’ /etc/sysconfig/sshd`。这显示文件\
  \ `/etc/sysconfig/sshd` 包含许多以注释符号 # 开头的行。\n\n**2.** 要查看真正重要的配置行，输入 `grep -v ‘^#’\
  \ /etc/sysconfig/sshd`。这只显示不以 # 开头的行。\n\n**3.** 现在输入 `grep -v ‘^#’ /etc/sysconfig/sshd\
  \ -B 5`。这显示不以 # 号开头的行，同时也显示了该行之前的五行，这很有用，因为在这些行中，你通常会找到关于如何使用特定参数的注释。然而，你也会看到许多空行被显示出来。\n\
  \n**4.** 输入 `grep -v -e ‘^#’ -e ‘^$’ /etc/sysconfig/sshd`。这排除了所有的空行和以 # 开头的行。\n\n\
  * * *\n\n### 使用其他用的文本处理工具\n\ngrep 实用是一个强大的工具，允许你处理正则表达式。不过，它并不是唯一的工具。还有一些更强大的工具，如\
  \ `awk` 和 `sed`。这两个工具都极其丰富，值得专门写一本书。作为 21 世纪的 Linux 管理员，你不再需要成为使用这些工具的专家。然而，了解如何使用这些工具执行一些常见任务是有意义的。最实用的用例总结在以下示例中：\n\
  \n点击此处查看代码图片\n\n```bash\nawk -F : '{ print $4 }' /etc/passwd\n```\n\n此命令显示 `/etc/passwd`\
  \ 的第四行。也可以通过 `cut` 工具完成，但 `awk` 工具在区分文件命令输出中的字段方面更为成功。底线是，如果 `cut` 不起，你应该尝试 `awk`\
  \ 工具。\n\n你也可以使用 `awk` 工具完成你可能习惯使用 grep 处理的任务。考虑以下示例：\n\n点击此处查看代码图片\n\n```bash\n\
  awk -F : '/user/ { print $4 }' /etc/passwd\n```\n\n此命令在 `/etc/passwd` 文件中搜索文本 `user`，并将打印任何匹配行的第四个字段：\n\
  \n```bash\nsed -n 5p /etc/passwd\n```\n\n在这个示例中，使用了“流编辑器” `sed` 来打印 `/etc/passwd`\
  \ 文件的第五行。`sed` 工具是一个从文本文件中过滤文本的非常强大的工具（类似于 grep），但它的好处在于还允许你对文本文件进行修改，如下例所示：\n\n\
  点击此处查看代码图片\n\n```bash\nsed -i s/old-text/new-text/g ~/myfile\n```\n\n在这个示例中，使用 `sed`\
  \ 工具在 `~/myfile` 中搜索文本 `old-text`，并将所有出现的地方将其替换为文本 `new-text`。请注意，`sed` 的默认行为是将输出写入\
  \ STDOUT，但 `-i` 选项将把结果直接写入文件。在使用此命令之前，确保你清楚自己在做什么，因为撤销这种方式应用的文件修改可能是困难的。\n\n\n\n\
  \n\n**7.** 哪一个 `grep` 命令可以让你在文件中同时看到 *text*（小写）和 *TEXT*（大写）？\n\n**8.** 哪一个 `grep`\
  \ 命令可以让你显示所有以 *PATH* 开头的行，以及该行之前的五行？\n\n**9.**  de，你使用哪一个 `sed` 命令来显示 `~/samplefile`\
  \ 中的第 9 行？\n\n**10.** 哪一个命令可以让你将 `~/samplefile` 中的单词 *user* 替换为单词 *users*？\n\n###\
  \ 章末实验（Labs）\n\n在这些章末实验中，你将使用一些最主要的文本处理工具。\n\n#### 实验 4.1\n\n**1.** 描述两种显示 `/etc/passwd`\
  \ 文件中第 5 行的方法？\n\n**2.** 你将如何在服务器上找到所有包含当前 IP 地址的文本文件？你需要使用正则表达式来完成操作吗？\n\n**3.**\
  \ 你刚刚使用了 `sed` 命令将所有出现的文本 *Administrator* 替换为 *root*。你的 Windows 员非常不喜欢这样做。你该如何撤销？\n\
  \n**4.** 假设在 `ps aux` 命令中，第五行包含关于内存利用率的信息，你将如何处理该命令的输出，使得内存利用率最高的进程出现在结果列表的最前面？\n\
  \n**5.** 哪一个命令可以过滤 `ps aux` 输出的第 6 列？\n\n**6.** 你如何删除文件 `~/myfile` 中的第 6 行？\n\n\
  ## 第 5 章：连接到 Red Hat Enterprise Linux 7\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg)\
