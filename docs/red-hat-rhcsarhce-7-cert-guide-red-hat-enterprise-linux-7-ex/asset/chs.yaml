  \ 24 章 配置时间服务\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg) 理解本地时间\n\n![Image](img/squf.jpg)\
  \ 使用网络时间协议\n\n![Image](img/squf.jpg) 在红帽企业级 Linux 上管理时间\n\n![Image](img/squf.jpg)\
  \ 使用图形化工具管理时间\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\n![Image](img/squf.jpg) 配置系统使用时间服务\n\n\
  通过 Linux 服务器提供的服务越来越多，这些服务依赖于服务器时间的正确配置。想想如数据库同步、Kerberos 身份验证等服务。在本章中，你将学习如何在 Linux\
  \ 服务器上配置时间。\n\n### “我已经掌握这些了吗？”测验\n\n“我已经掌握这些了吗？”测验可以帮助你评估是否应该彻底读完本章，还是直接跳到“考试准备任务”部分。如果你对答案有疑问，或者对这些主题的掌握程度不足，请阅读全文。表\
