  \n## 管理内核模块\n\n许多 Linux 命令的输出包含不同的列，并不总是清楚哪一列代表什么。大多数命令的输出都有表头。因此，如果你对某个命令的输出不确定，可以通过\
  \ `head` 命令查看表头，或者将命令输出通过到 `less`，以便你翻页查看第一行。\n\n内核模块概述\n\n内核模块是自动加载的，你可以通过在 `/etc/modules-load.d`\
  \ 目录下创建文件来自动加载内核模块。使用 `lsmod` 命令可以列出已加载的内核模块。\n\n```\n[root@server1 udev]# lsmod\
  \ | head\nModule                  Size  Used by\nipt_MASQU             12880\nxt_CHECKS\
  \             12549\nip6t_rpfilter            12546\ntarget_core_psci         18810\n\
  target_core_file         18030\ntarget_core_iblock       18177\niscsi_target_mod\
  \         27873\n```\n\n如果你想获取特定内核模块的更多信息，可以使用 `modinfo` 命令。它提供了关于特定模块的完整信息，包括两个有趣的部分：`alias`\
  \ 和 `parms`。模块别名是该模块的另一种名称。`parms` 行指的是加载模块时可以设置的参数。（在本章后面的“管理内核参数”部分中，你将学习如何处理内核参数。）列表\
  \ 16.6 显示了 `modinfo e1000` 命令的部分输出。\n\n```\n[root@server1 udev]# modinfo e1000\n\
  filename:/lib/modules/3.10.0-123.el7.x86_64/kernel/drivers/net/ethernet/intel/e1000/e1000.ko\n\
  version:       7.3.21-k8-NAPI\nlicense:       GPL\ndescription:   Intel(R) PRO1000\
  \ Network Driver\nauthor:        Intel Corporation, <linux@intel.com>\nvermag: \
  \      3.10.0-123.el7.x86_64 SMP x86_64\nsig_key:       SHA256\nsig_hash:      none\n\
  sig_loader:    none\nsigner:        \ndepends:       \nalias:         pci:v0000:00:00:0.0\n\
  parms:         TxDescriptors=1024 RxDescriptors=1024 Speed=0 Duplex=0 AutoNeg=1\
  \ FlowControl=0 XsumRX=1 InterruptThrottleRate=0 SmartPowerDownEnable=0 copybreak=4096\
  \ debug=0\n```\n\n\n\n\n\n5. 输入 `modprobe -r xfs` 尝试卸载 `xfs` 内核模块。注意，你会收到一个错误信息，因为该内核模块正在使用中。\n\
  \n***\n\n### 检查硬件设备的驱动可用性\n\n在现代 Linux 服务器上，支持许多硬件设备。尽管如此，你可能会发现某些设备没有得到良好支持。要确定你的硬件是否存在这种情况，最理想的方法是使用\
  \ `lspci` 命令。如果不带参数使用，它将显示在 PCI 总线上检测到的所有硬件设备。一个非常有用的参数是 `-k`，它会列出所有用于检测到的 PCI 设备的内核模块。列表\
