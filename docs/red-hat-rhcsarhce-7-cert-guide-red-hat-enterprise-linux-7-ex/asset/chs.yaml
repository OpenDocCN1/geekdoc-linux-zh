  ... (其余文本遵循相同模式) ...\n\n# 附录 D. 设置身份管理\n\n为了准备 RHCSA 和 RHCE 考试，你需要使用一台提供轻量级目录协议\
  \ (LDAP) 和 Kerberos 服务的服务器。这些服务的配置本身并不是考点；但使用红帽身份管理 (IdM) 解决方案来实现并不困难，该方案实现了第 6\
  \ 章“用户和组管理”、第 24 章“配置时间”以及第 35 章“配置 MariaDB 数据库”中描述的服务。\n\n### 警告\n\nFreeIPA 与许多其他服务冲突。因此，请确保使用一台尚未安装任何服务的干净虚拟机。\n\
  \n## 执行基础安装\n\n为了创建书中多个练习所需的 IPA 服务器，请安装一台符合以下要求的虚拟机：\n\n![Image](img/sqf.jpg) 确保你的服务器有\
  \ 2 GB 内存 10 GB 可用磁盘空间。\n\n![Image](img/sqf.jpg) 使用红帽企业 Linux 7 或 CentOS 7。\n\n\
  ![Image](img/sqf.jpg) 名称设为 ipa.example.com。\n\n![Image](img/sqf.jpg) IP 地址设置为 192.168.122.200，默认网关设置为\
  \ 192.168.122.1，DNS 临时设置为 8.8.8.8。（稍后需要更改。）\n\n![Image](img/sqf.jpg) 选择图形界面安装模式。\n\
  \n![Image](img/sqf.jpg) 关闭 SELinux。\n\n### 安装 FreeIPA\n\n安装 FreeIPA，请按照以下步骤操作：\n\
  \n**1.** 打开 root shell 并输入 `yum -y install ipa-server bind-dyndb-ldap`。\n\n\n\n\n\
  2. 运行 `ipa-server-install --setup-dns` 来启动 IPA 服务器安装程序。（输入 `ipa-server --help` 可查看所有选项的列表。）\n\
  \n**提示**：还有一个 `ipa-dns-install` 命令。如果你在没有先配置 DNS 的情况下配置了 FreeIPA，后来决定更改并添加 DNS 支持，则此命令非常有用。\n\
  \n3. 当系统询问你是否要配置集成 DNS (BIND) 时，回答 `yes`。\n\n4. 安装程序现在会告诉你它发现了一个现有的 BIND 配置，并询问是否要覆盖它。对此问题回答\
  \ `yes`。\n\n5. 此时，安装程序应该检测到已设置的主机名并提示主机名，根据之前的指令，主机名应设置为 `ipa.example.com`。如果安装程序显示其他任何内容，请立即使用\
  \ `Ctrl+C` 停止安装，并使用 `hostnamectl set-hostname ipa.example.com` 设置主机名。如果主机名没有正确设置，你不应该继续安装\
  \ IPA！\n\n6. 此时，安装程序会要求你确认 DNS 域名，该域名应设置为 `example.com`。如果一切顺利，DNS 名称已在此过程的早期被正确识别。按\
  \ `Enter` 确认。\n\n7. 此时，安装程序应该要求你确认 Kerberos 领域名 `EXAMPLE.COM`。如果没有提示，说明你没有在 `/etc/hosts`\
  \ 中创建允许解析此主机名的行。如果是这样，请停止配置脚本并将该行添加到 `/etc/hosts` 中。添加后，你可以重新启动此脚本以完成所有配置步骤。通过按\
  \ `Enter` 确认 Kerberos 领域名 `EXAMPLE.COM`。\n\n8. 安装程序现在提示输入目录管理器（Directory Manager）密码。由于你正在为课程/测试环境设置\
  \ IPA 服务器，我建议使用密码 `password`。\n\n9. 为目录管理器（这是一个 LDAP 管理账户）设置密码后，你还需要为 IPA 员用户设置一个密码。你通常使用该账户来完成所有\
  \ IPA 管理任务。也将此密码设置为 `password`。\n\n10. 此时，系统会提示你你是否要为 DNS 转发器设置 IP 地址。将所有无法在本地解析的\
  \ DNS 请求转发到外部 DNS 服务器是一个好主意，但你并非必须这样做。输入你的外部 DNS 服务器的 IP 地址，或常用的外部 DNS 服务器（如 `8.8.8.8`），并按\
  \ `Enter`。\n\n11. 安装程序再次提示 DNS 转发器的 IP 地址。这是因为可以配置多个 DNS 转发器。在此处不输入其他内容直接按 `Enter`。\n\
  \n12. 现在询问你是否要配置 (DNS) 反向区域。为了实现完整功能，这样做非常重要。按 `Enter` 接受默认建议并开始配置。这将允许你不仅将主机名解析为\
  \ IP 地址，还能将 IP 地址解析为主机名。\n\n13. 现在提示你指定反向区域名。根据之前的指令，它应设置为 `122.168.192.in-addr.arpa`。（反向区域名包含\
  \ IP 地址的网络部分，但反过来，后面跟着固定部分 `in-addr.arpa`）。按 `Enter` 接受。\n\n14. 你将看到所有安装设置的摘要。检查看起来是否正常。如果是，输入\
  \ `yes` 并按 `Enter` 开始安装。去喝杯咖啡吧；这需要几分钟时间才能完成。成功完成后，安装程序将显示以下消息：\n\nSetup complete\n\
  Next steps:\nYou must make sure these network ports are open:\nTCP Ports:\n  - `80`,\
  \ `443`: HTTP/HTTPS\n  - `389`, `636`: LDAP/LDAPS\n  - `88`, `464`: kerberos\n \
  \ - `53`: bind\nUDP Ports:\n  - `88`, `464`: kerberos\n  - `53`: bind\n  - `123`:\
  \ ntp\n\n你现在可以使用命令 `kinit admin` 获取 Kerberos 票据。此票据将允许你使用 IPA 工具（例如 `ipa user-add`）和\
  \ Web 。务必备份存储在 `/root/cacert.p12` 中的 CA 证书。创建副本时需要此文件。该文件的密码是目录管理器密码。\n\n15. 此时，你需要完成安装。首先，你需要打开防火墙，以允许访问\
  \ FreeIPA 提供的所有服务。通过输入以下命令执行：\n```bash\nfor i in http https ldaps kerberos dns ntp;\
  \ do firewall-cmd --permanent --add-service $i; done\n```\n接下来输入 `firewall-cmd --reload`\
  \ 重新加载配置。\n\n16. 现在你可以使用 `kinit admin` 获取 Kerberos 管理员的 Kerberos 票据。输入为该用户设置的密码\
  \ `password`，即可建立 Kerberos 会话。\n\n17. 输入 `klist` 验证 Kerberos 票据的内容。你会发现你的会话有效期为\
  \ 24 小时。这完成了设置的主要部分。你现在有了一个运行良好的 IPA 服务，提供 LDAP、Kerberos、DNS 和时间服务。注意，时间服务是通过使用\
  \ `ntp` 服务提供的，而不是你将在书中将学习的 `chronyd` 服务。从功能角度来看，这并不重要。\n\n### 为用户身份验证准备你的 IPA 服务器\n\
  \n现在你已经有了一个功能正常的 IPA 服务器，是时候为实验做准备了，在实验中你需要使用 LDAP 或 Kerberos 凭据在 IPA 服务器上进行身份验证。这包括创建一个\
  \ FTP 服务器以使证书和 keytab 文件可用：\n\n1. 使用 `yum install -y vsftpd` 安装 vsftpd FTP 服务器。\n\
  2. 输入 `systemctl enable vsftpd; systemctl start vsftpd` 启用并启动 FTP 服务。\n3. 从 root\
  \ shell，输入 `cp ~/cacert.p12 /var/ftp/pub` 将 IPA 服务器的 CA 证书复制到 FTP 站点。这确保了用户需要进行身份验证的练习可以使用该证书。\n\
  4. 输入 `firewall-cmd --permanent --add-service ftp; firewall-cmd --reload`。\n5. 输入\
  \ `klist` 查看你是否处于 Kerberos 会话。如果不是，输入 `kinit admin`。\n6. 现在你已经在 IPA 服务器上通过身份验证，输入\
  \ `ipa user-add lisa`。输入 `lisa` 为名，输入 `jones` 为姓。你会看到用户 lisa 已添加到 IPA 服务器中。重复此过程创建用户\
  \ `linda thomsen`。\n7. 为两个用户设置 IPA 密码。使用 `ipa passwd lisa; ipa passwd linda` 执行此操作。为两个用户都输入密码\
  \ `password`。\n\n你的 IPA 服务器现在已准备好进行本书第 6 章和第 24 章的所有练习。\n\n### 为 Kerberos 版 NFS\
  \ 准备你的 IPA 服务器\n\n为了给第 36 章“配置 NFS”的实验做准备，你需要为要在 `server1` 上创建的 NFS 服务器创建 Kerberos\
  \ 主体。在为 NFS 服务器创建 Kerberos 凭据后，你需要让它们在 NFS 服务器上可用。要做到这一点，在此过程中你需要 `server1` 和 `server2`\
  \ 的访问权限（它们将在第 36 章中使用）。\n\n1. 开始，你需要在 IPA 服务器上创建 DNS 记录。从 `ipa.example.com` 启动 Firefox\
  \ 并进入 `httpd://labipa.example.com`。在证书警告处，点击 `I Understand the Risks and Add Exception`。接下来，点击\
  \ `Confirm Security Exception`。你现在将看到 IPA 登录窗口。从此窗口，输入用户名 `admin` 和密码 `password`\
  \ 进行身份验证。\n\n\n\n\n## 2. 在继续之前，你需要为主主机准备 DNS 记录。你可能不需要这样做，但万一你没有 DNS 资源记录，可以通过以下方法创建它们。点击\
  \ `Hosts` 链接，然后从那里点击 `Add`。输入主机 `server1`，验证 DNS 区域已设置为 `example.com`，并输入 IP 地址\
  \ `192.168.122.210`。对 `server2.example.com` 重复此过程，IP 地址为 `192.168.122.220`。现在你拥有测试环境中所有主机的\
  \ DNS 记录和反向 DNS 记录。\n\n## 3. 你现在需要将 NFS 服务器 `server1.example.com` 加入 IPA Kerberos\
  \ 领域。在 NFS 服务器上打开一个 root shell 并输入 `yum install -y ipa-client`。后续所有步骤也需要在 `server1`\
  \ 上执行。\n\n## 4. 使用 `nmtui` 将 DNS 服务器的 IP 地址设置为 `192.168.122.200`。输入 `systemctl restart\
  \ NetworkManager`。这会将使用的名称服务器设置为 `192.168.122.200`，这对后续步骤的成功至关重要。\n\n## 5. 输入 `ipa-client-install\
  \ --mkhomedir --enable-dns-updates --force-ntpd`。当询问哪个用户有权注册计算机时，输入 `admin`；当提示\
  \ `admin@EXAMPLE.COM` 的密码时，输入 `password`。程序完成后将提示客户端配置已完成。\n\n## 6. 仍在 `ipa.example.com`\
  \ 上，为将安装在 `server1` 上的 NFS 服务器创建服务主体（service principals）。输入 `ipa service-add`，当被询问主体名称时，输入\
  \ `nfs/server1.example.com`。这将返回以下信息。\n\n点击此处查看代码图像\n\n```\n[root@ipa ~]# ipa service-add\n\
  \nPrincipal: nfs/server1.example.com\n\n---------------------------------------------------\n\
  \nAdded service \"nfs/server1.example.com@EXAMPLE.COM\"\n\n---------------------------------------------------\n\
  \n  Principal: nfs/server1.example.com@EXAMPLE.COM\n\n  Managed by: server1.example.com\n\
  ```\n\n## 7. 在 `server1` 上输入 `klist -k`。你会看到你有一个主机主体（host principal），这是 Kerberos\
  \ 的单点登录和主机身份验证所需的。\n\n## 8. 在 `server1` 上，输入 `ipa-getkeytab -s ipa.example.com -p\
  \ nfs/server1.example.com -k /etc/krb5.keytab`。\n\n## 9. 使用 `kinit -k nfs/server1.example.com`\
  \ 后接 `klist` 来验证你现在在 `server1` 上拥有 NFS 主体。\n\n## 10. 在 `server2` 上，重复此过程的第 6 步将客户端加入\
  \ IPA 领域。接下来，从客户端输入 `ipa-getkeytab -s ipa.example.com -k /etc/krb5.keytab -p host/server2.example.com@EXAMPLE.COM`。使用\
  \ `scp /etc/krb5.keytab ipa.example.com:/var/ftp/pub/server2.keytab` 将 keytab 从\
  \ `server2` 拷贝到 IPA 服务器。\n\n## 附录 E 学习计划\n\n![Image](img/etab01.jpg)![Image](img/etab01a.jpg)![Image](img/etab01b.jpg)![Image](img/etab01c.jpg)![Image](img/etab01d.jpg)![Image](img/etab01e.jpg)![Image](img/etab01f.jpg)![Image](img/etab01g.jpg)![Image](img/etab01h.jpg)![Image](img/etab01i.jpg)![Image](img/etab01j.jpg)![Image](img/etab01k.jpg)![Image](img/etab01l.jpg)![Image](img/etab01m.jpg)![Image](img/etab01n.jpg)![Image](img/etab01o.jpg)![Image](img/etab02.jpg)![Image](img/etab02a.jpg)![Image](img/etab02b.jpg)![Image](img/etab02c.jpg)![Image](img/etab02d.jpg)![Image](img/etab02e.jpg)![Image](img/etab02f.jpg)![Image](img/etab02g.jpg)![Image](img/etab02h.jpg)![Image](img/etab02i.jpg)![Image](img/etab02j.jpg)![Image](img/etab02k.jpg)![Image](img/etab02l.jpg)\n\
  \n## 术语表\n\n`$PATH` 当作为变量使用时，它包含用户输入命令时搜索可执行文件的目录列表。\n\n. 当前目录。可以使用 `pwd` 命令获取其值。\n\
  \n### A\n\n**绝对文件名 (Absolute filename)** 完整且以根目录名称开始的文件，包括到当前文件或目录的所有目录。\n\n**访问控制列表\
  \ (Access control list)** Linux 权限中的，一种允许管理员定义哪些用户或系统程序可以访问对象的系统。\n\n**Anaconda**\
  \ 红帽企业 Linux 及其相关发行版的安装程序。\n\n**Anacron** 用于运行因计算机关机而错过的 cron 任务的工具。\n\n**AND**\
  \ 仅当两个操作数均为真时才返回真的逻辑运算符。\n\n**应用程序服务器 (Application server)** 为网络客户端运行应用程序的服务器。\n\
  \n**存档 (Archiving)** 将文件收集并压缩成单个文件（存档）的过程。\n\n**at** 用于调度在特定时间运行一次命令的命令。\n\n**属性\
  \ (Attribute)** 文件或目录的属性，决定其行为，例如只读或隐藏。\n\n**auditd** 内核审计守护进程，记录安全相关的系统事件。\n\n\
  **审计日志 (Audit log)** 位于 `/var/log/audit/audit.log` 包含审计记录的文件。\n\n**autofs** 根据需要自动挂载和卸载文件系统的服务。\n\
  \n**自动挂载 (Automount)** 自动挂载文件系统的过程。\n\n### B\n\n**后台 (Background)** 不附加终端会话运行的进程。\n\
  \n**备份 (Backup)** 在原始数据丢失时用于恢复的数据副本。\n\n**Bash** 大多数 Linux 发行版默认的命令行 shell。\n\n\
  **基本输入输出系统 (Basic Input Output System)** 在旧 PC 启动过程中初始化硬件的固件。\n\n**二进制 (Binary)**\
  \ 仅使用数字 0 和 1 的计数系统。\n\n**BIOS** *参见* [Basic Input Output System]。\n\n**绑定 (Bonding)**\
  \ 将多个网络接口合并为单个逻辑链路以实现容错和性能的技术。\n\n**引导加载程序 (Bootloader)** 在启动期间将操作系统加载到内存中的程序。\n\
  \n**Btrfs** 一种支持快照和写复制功能的现代 Linux 文件系统。\n\n**缓冲区 (Buffers)** 在数据在两个位置之间移动时临时存储数据的内存区域。\n\
  \n\n\n\n\n### 缓存 (Cache)\n在内存管理中，缓存指的是存储最近使用的文件的内存区域。缓存是加速服务器读取速度的重要机制。\n\n### 权限\
  \ (Capability)\n权限是在 Linux 上可以执行的特定任务。root 用户拥有所有权限；而普通用户仅拥有有限的权限集。\n\n### CentOS\n\
  一种 Linux 发行版，它 使用了所有的红帽（Red Hat）软件包，但从这些包中删除了红帽标志，以便免费分发。对于无法访问 RHEL 但想要 RHCSA 和\
  \ RHCE 考试的人来说，CentOS 是最佳选择。\n\n### 证书 (Certificate)\n在 PKI 密码学中，证书包含颁发者的公钥。该公钥由证书颁发机构的证书签名，从而保证其可靠性。\n\
  \n### 证书颁发机构 (Certificate authority)\n一种用于保证 PKI 证书可靠性的常用机构。证书颁发机构提供用于签名公钥证书的证书。除了使用常用机构，也可以将自签名证书用于内部目的。\n\
  \n### CGI\n参见通用网关接口。\n\n### chrony\n红帽企业 Linux 中提供的时间同步服务的新版本。\n\n### chroot\nchroot\
  \ 环境是一个将文件系统的一部分呈现为伪根目录（root）的环境。chroot 被用作一种安全功能，用于隐藏特定服务不需要的操作系统部分内容。\n\n### CIFS\n\
  参见通用互联网文件系统。\n\n### 云 (Cloud)\n一种允许灵活使用托管计算资源的计算平台。\n\n### 列 (Column)\n在关系型数据库中，列由来自不同记录的相似字段组成。列可对数据库或表中的数据进行排序。\n\
  \n### 通用网关接口 (Common Gateway Interface)\n一种使用某些脚本技术生成动态网页的标准。CGI 未定义必须使用哪些特定的脚本技术。\n\
  \n### 通用互联网文件系统 (Common Internet File System)\n微软服务器消息块（SMB）协议的标准化版本，用于以兼容 Windows\
  \ 服务器和客户端的方式访问共享打印机、文件和目录。CIFS 已成为 IT 文件共享的事实标准。\n\n### 压缩 (Compression)\n一种通过分析冗余模式并更高效地存储它们来减小文件大小的技术。\n\
  \n### 条件循环 (Conditional loop)\n在 shell 脚本中，一组仅在满足特定条件时执行的命令。\n\n### 连接 (Connection)\n\
  在网卡配置中：一组与网络接口关联的网络配置参数。\n在网络通信中：双方之间已初始化的会话，一直持续到连接断开为止。\n\n### 控制台 (Console)\n\
  在 Linux 中，控制台是用户工作的主要终端。它也是一个名为 `/dev/console` 的特定设备。\n\n### 上下文 (Context)\n在 SELinux\
  \ 中，上下文是用于定义用户、进程、端口和目录的安全属性的标签。这些规则在 SELinux 策略中用于定义安全规则。\n\n### 上下文切换 (Context\
  \ switch)\n当 CPU 从执行一个任务切换到执行另一个任务时，就会发生上下文切换。\n\n### 切换 (context switches)\n当 CPU\
  \ 在任务之间切换时，发生上下文切换。\n\n### 上文类型 (Context type)\n在 SELinux 中，上下文类型用作标识用户、进程、端口和 SELinux\
  \ 属性的标签。\n\n### 创建、读取、更新和删除 (Create, read, update, and delete)\n在关系型数据库（以及持久性存储）中，创建、读取、更新和删除是四个基本操作。在\
  \ MariaDB 数据库中，通过使用 `INSERT`、`SELECT`、`UPDATE` 和 `DELETE` 命令实现 CRUD。CRUD 是通用的，也出现在其他协议中。例如，在\
  \ HTTP 中，CRUD 通过 `POST`、`GET`、`PUT` 和 `DELETE` 命令实现。\n\n### 凭证文件 (Credentials file)\n\
  一种可以在 `/etc/fstab` 文件中自动挂载 CIFS 文件系统的文件。凭证文件存储在安全的地方（如 root 用户的家目录），包含用于挂载远程文件系统的用户名和密码。\n\
  \n### Cron\n负责在特定时间重复启动服务的程序。\n\n### CRUD\n参见创建、读取、更新和删除。\n\n### CRUD 操作 (CRUD operations)\n\
  在 SQL 数据库环境中使用的基本操作集。CRUD 指创建、读取、更新和删除。\n\n### 密码学 (Cryptography)\n一种用于保护数据的技术。这通常通过将信息转换为不可读状态来实现，使用密钥来解密加密后的数据。密码学不仅用于保护传输中的文件，还可以用于保护验证程序。\n\
  \n### D\n### 数据库 (Database)\n在关系型数据库中，用于存储数据的多个表集合。\n\n### 十进制 (Decimal)\n一种基于数字\
  \ 0 到 9 的计数方案。这种计数法对人类来说易于使用，但在计算机环境中并不容易，因此通常使用备用的二进制、八进制和十六进制计数法。\n\n### 默认路由\
  \ (Default route)\n默认用于将目的地为外部网络的 IP 数据包转发的路由器。\n\n### 依赖关系 (Dependency)\n通用：一个项目需要另一个项目的情况。依赖关系在\
  \ Linux 中存在于多个级别。在 RPM 软件包管理中，依赖项是指安装另一个包时必须存在的软件包。在 systemd 中，依赖项是在加载另一个单元之前必须加载的\
  \ systemd 单元。\n\n### 依赖地狱 (Dependency hell)\n指为了安装某个包需要其他包，而这些包本身也需要依赖的情况。依赖地狱问题通过引入基于仓库的系统得到了解决。\n\
  \n### 目标 (Destination)\n在 rsyslog 中，指定将日志消息发送到日志系统的目标。目标通常是文件，也可以是输入模块、输出模块、用户或主机。\n\
  \n### 设备 (Device)\n连接到计算机以执行特定任务的外围设备。\n\n### 设备文件 (Device file)\n在 `/dev` 目录中创建的文件，用于表示和与设备交互。\n\
  \n### 设备映射器 (Device mapper)\nLinux 内核用于与存储设备通信的内核。Device Mapper 被 LVM、multipath\
  \ 以及其他设备使用，但不被普通硬盘使用。由 device mapper 创建的设备文件可以在 `/dev/mapper` 目录下找到。\n\n### DHCP\n\
  参见动态主机配置协议 (Dynamic Host Configuration Protocol)。\n\n### 指令 (Directive)\nApache\
  \ 配置中参数的名称。\n\n### 直接挂载 (Direct mount)\n在 automount 中，指在自动挂载之前已经存在的目录上执行自动挂载。直接挂载始终以\
  \ `` 作为挂载的起点，且只能由 root 用户创建。\n\n### 目录 (Directory)\n文件系统中的文件夹，可以组织的方式存储文件。\n\n###\
  \ 发行版 (Distribution)\n一种自带安装程序或已即可使用的 Linux 版本。由于 Linux 是不同工具和其他组件的集合，Linux 发行版收集了这些工具和其他组件，可能也可能对其进行增强，并进行分发，使用户无需自己收集所有不同的组件。\n\
  \n### dmesg\n一种用于读取内核环形缓冲器的工具，其中包含了由 Linux 内核生成的日志消息。\n\n### DNS\n参见域名系统 (Domain\
  \ Name System)。\n\n### DNSSEC\n一种用于保护 DNS 的系统。在 DNSSEC 中，使用密钥来保证所联系服务器的真实性。\n\n\n\
  \n\n\n`DocumentRoot` 在 Apache 中，`DocumentRoot` 定义了 Apache Web 服务器查找将提供给 Apache 客户端文档的位置。\n\
  \n`Domain` 域名系统定义了域层级结构。在这个层次结构中，域是一个分支对象，通过如 `example.com` 这样的全球唯一名称进行标识。在域内部，通常会创建叶节点对象以全局唯一的方式标识资源。\n\
  \n`Domain Name System` 域名系统是一种将计算机名称转换为 IP 地址并反之亦的系统。在 `DNS` 中，使用了多个域层级，类似于文件系统中的目录结构。\n\
  \n`dracut` 一个用于生成 `initramfs` 的工具，`initramfs` 是 Linux 操作系统的重要部分，包含了启动 Linux 系统所需的驱动程序和其他关键文件。\n\
  \n`Dynamic Host Configuration Protocol` 一种经常由服务器实现的协议，负责为客户端提供 IP 地址和其他相关配置。使用 `DHCP`\
  \ 使得在计算机网络中使用系统成为，而无需为所有系统配置所需的 IP 地址配置和相关参数。\n\n`Dynamic route` 一由自动路由协议管理的网络路由。\n\
  \n## E\n\n`EFI` *参见* 可扩展固件接口。\n\n`Enforcing` SELinux 模式，此时 SELinux 完全运行并应用了为特定系统配置的所有限制。\n\
  \n`Environment` 用户或进程用于执行任务的设置集合。\n\n`Epoch time` 在 Linux 中，`epoch` 对应于 1970 年 1\
  \ 月 1 日午夜。Linux 时间计算为自 `epoch` 以来经过的秒数。这个秒数被称为 `epoch time`（纪时间）。某些工具使用 `epoch time`\
  \ 代替实际时钟时间。\n\n`Escaping` 在 shell 环境中，转义确保特定字符不被 shell 解释。为了在屏幕上显示特定字符，或确保正则表达式的元字符不先被\
  \ `bash` shell 解释，转义可能是必要的。\n\n`Export` 在 `NFS` 中，指在 `NFS` 服务器上共享的目录，以允许其他服务器进行访问。\n\
  \n`Ext2, 3, and 4` 三种不同版本的 `Ext` 文件系统。在 Red Hat Enterprise Linux 6 之前，`Ext4` 是默认文件系统。现在它被认为无法满足现代存储需求，这就是为什么\
  \ `RHEL 7` 中的 `Ext4` 已被 `XFS` 替换为默认文件系统。\n\n`Extensible Firmware Interface` 基本输入输出系统（BIOS）的替代品，用于旧的\
  \ IBM 兼容计算机，作为计算机启动时运行的程序。`EFI` 是操作系统和计算机固件之间的层。\n\n`Extended partition` 在 `MBR`\
  \ 磁盘上，分区表最多可以存储四个分区。为了超过这个数字，可以将这四个分区中的一个创建为`扩展分区`。在`扩展分区` 内可以创建逻辑分区，其运行方式与普通分区一样，允许系统管理员创建更多分区。\n\
  \n`External command` 以文件形式存在磁盘上的命令。\n\n## F\n\n`Facility` 在 `rsyslogd` 中日志信息的来源。`rsyslogd`\
  \ 定义了数量严格限制的设施（facilities）。\n\n`Fedora` 由 Red Hat 赞助的开源 Linux 发行版。在 `Fedora` 中，提供并测试新功能。其中一些功能将包含在\
  \ Red Hat Enterprise Linux 的后续版本中。\n\n`Fiber Channel` 一种可用于 `SAN` 环境的存储基础设施。它的竞争对手是\
  \ `iSCSI`。\n\n`Field` 在关系数据库中，字段用于组成记录。字段通常是一个键/值对。记录由多个字段组成。\n\n`File descriptor`\
  \ Linux 进程用于引用该进程正在使用的文件的指针。\n\n`File system` 在存储设备上创建的逻辑结构。在 Linux 文件系统中，`inodes`\
  \ 用于文件系统管理，而实际数据被写入块（blocks）。\n\n`File System Hierarchy` 一个定义了哪些 Linux 目录应该用于什么用途的标准。查阅\
  \ `man 7 hier` 可获取 `FSH` 的规范。\n\n`Firewall` 一种可用于过滤网络数据包的解决方案。防火墙用于确保只有授权的流量可以到达系统。防火墙可以通过\
  \ Linux 内核的 `Netfilter` 功能提供，但通常也作为网络设备提供。\n\n`firewalld` `RHEL 7` 中使用的现代服务，用于基于\
  \ Linux 内核防火墙框架实现防火墙。\n\n`Flush` 在电子邮件中，可以刷新邮件队列（flush）。在文件系统中，刷新（flushing）是指将文件直接写入磁盘。\n\
  \n`Folder` 文件夹，也称为目录，是文件系统中的用于组织相关文件的结构。\n\n`Foreground` 由用户启动的 Linux 进程可以以前台或后台方式启动。如果一个进程作为前台进程启动，在它完成或移动到后台之前，无法在同一个终端中启动其他进程。\n\
  \n`FQDN` *参见* 完全限定域名。\n\n`FSH` *参见* 文件系统层级。\n\n`fstab` 在 Linux 上用于在系统启动时挂载文件系统的配置文件。\n\
  \n`Fully domain name` 在 `DNS` 中，完全限定域名 (`FQDN`) 是一个完整的主名，包括主机所在的域和子域。`Server1.example.com`\
  \ 是一个 `FQDN` 示例。\n\n## G\n\n`GECOS` `GECOS` 最初代表 General Electric Comprehensive\
  \ Supervisor（通用电气综合主管）。在 Linux 中，它仍保留为 `/etc/passwd` 文件中的 `gecos` 字段，该字段可以存储有关用户的个人数据。\n\
  \n`Global unique ID` 一个由部分组成的标识号，确保其是全球唯一的。\n\n`GPT` *参见* GUID 分区表。\n\n`Group` 项目的集合。在用户管理中，组用于同时向多个用户分配权限。在\
  \ Linux 中，每个用户都是至少一个组的成员。\n\n`Group owner` 在 Linux 上，每个文件和目录都有用户所有者组所有者。组所有权在创建文件时设置，除非另有配置，否则设置为创建文件的用户的主组。\n\
  \n`GRUB` *参见* GRUB 2。\n\n`GRUB 2` 安装在大多数需要启动 Linux 的系统上的引导程序。`GRUB 2` 提供一个启动提示符，从中可以不同的内核启动选项，这对于需要排查启动过程非常有用。\n\
  \n`GUID` *参见* 全局唯一标识。\n\n`GUID partition table` GUID 分区表是一种在硬盘上存储分区的现代解决方案，相对于较旧的\
  \ `MBR` 分区表。在 `GUID 分区` 中，共可以创建 128 个分区，且主分区、扩展分区和逻辑分区没有区别。\n\n`gzip` Linux 上用于文件压缩和解压缩的最常用的工具之一。\n\
  \n\n\n\n\n# 硬链接 存储 Linux 文件时使用了 inode（索引节点）。inode 包含了文件的完整管理信息，包括存储文件所在的块。硬链接是与该\
  \ inode 关联的名称。没有至少一个硬链接的文件被视为已删除的文件。为了增加文件的可访问性，可以为同一个 inode 创建多个硬链接。\n\n# 硬件时间\
  \ 硬件时间是由计算机硬件（通常是 BIOS 时钟）提供的时间。当 Linux 系统启动时，它会根据硬件时间设置软件时间。由于硬件时间通常不准确，大多数 Linux\
  \ 系统使用网络时间协议（NTP）来将系统时间与可靠的时间源进行同步。\n\n# HBA 参阅 主机总线适配器。\n\n# 十六进制 一种基于 4 字节组的 16\
  \ 计数系统。十六进制数从 0 到 9 开始，随后是 A 到 F。由于其在计算机技术中效率更高，因此经常使用十六进制。在 IPv6 中，IP 地址以十六进制形式写入。\n\
  \n# 主机总线适配器 一种连接计算机到网络和存储设备的接口卡。最常见的是，主机总线适配器指的是连接计算机到存储网络的设备。\n\n# 虚拟机监控程序 一种创建和运行虚拟机的计算机软件、固件或硬件。在\
  \ Linux 中，`KVM` 被常用的虚拟机监控软件。\n\n## I\n\n# 间接挂载 在自动挂载（automount）中，指由 automount 完全自动执行的挂载。挂载文件系统的目录将由\
  \ automount 创建。间接挂载可以完全从用户空间发生，这意味着不需要直接的内核交互或 root 权限。\n\n# 继承 在权限管理中，继承是指在目录中创建的新文件继承其父目录的权限设置的情况。\n\
  \n# init 在 Linux 内核和 `initramfs` 加载后启动的第一个进程。所有其他进程都是从 `init` 进程启动的。在 RHEL 7 中，`init`\
  \ 进程已被 `systemd` 代替。\n\n# 发起者 在 iSCSI 中，发起者是 iSCSI 客户端。它是想要访问 iSCSI 目标系统提供的共享存储的系统。\n\
  \n# Initramfs 初始内存文件系统。`initramfs` 包含了 Linux 系统启动阶段所需的驱动程序和其他文件。在红帽企业 Linux 上，`initramfs`\
  \ 在安装期间生成，并可以使用 `dracut` 工具手动重建。\n\n# Inode 文件的管理信息。每个 Linux 文件都有一个 `inode`，`inode`\
  \ 包含了文件的所有属性，但不包含文件名。\n\n# 输入模块 在 rsyslog 中，一种允许 rsyslog 从特定源接收日志消息的模块。\n\n# 安装服务器\
  \ 一个可以用于简化 Linux 安装的服务器。在 RHEL 语文中，它通常由一个存储库、一个 DHCP 服务器、一个 TFTP 服务器，以及一个包含如何执行自动安装说明的\
  \ Kickstart 文件组成。\n\n# 接口 在 Linux 网络中，接口是能够为特定设备激活的配置参数集。一个设备可以存在多个接口配置，但一个设备在同一时间只能有一个接口处于激活状态。\n\
  \n# 内部命令 属于 shell 部分且在磁盘上不以文件形式存在的命令。\n\n# 互联网协议 计算机用于通信的主要通信协议。互联网协议有两个版本（IPv4\
  \ 和 IPv6）。除了节点地址之外，它还定义了路由，使得节点能够相互接触。\n\n# IPv4 互联网协议的第 4 版本。仍然是正在使用的最重要的 IP 版本。\n\
  \n# IP 参阅 互联网协议。\n\n# IPv6 互联网协议的第 6 版本，用于跨互联网路由数据包。\n\n# iptables 一种在 Linux 操作系统上创建防火墙规则的解决方案。`iptables`\
  \ 与 Netfilter Linux 内核防火墙功能交互，它是早期红帽企业 Linux 创建软件防火墙的默认解决方案。在红帽企业 Linux 7 中，它已被\
  \ `firewalld` 代替。\n\n# iSCSI 一种存储协议，将 SCSI 存储协议命令封装在 IP 包中。这使得通过网络提供 SCSI 设备访问成为可能。\n\
  \n# iSCSI 目标 通过提供共享块设备的访问来提供 SAN 功能的服务。\n\n# 迭代 在 shell 脚本中，迭代是指条件循环处理多次中的一次，直到达到预期结果。\n\
  \n## J\n\n# 作业 在 Linux shell 中，作业是在当前终端中运行的任务。作业可以在前台和后台启动。每个作业也以进程的形式可见。\n\n# journald\
  \ systemd 的一部分，负责处理有关发生事件的日志信息。`journald` 的引入确保所有服务的信息都可以被记录，无论服务本身如何配置来处理要记录的信息。\n\
  \n# journalctl systemd 中负责记录日志消息的部分。\n\n## K\n\n# KDC 参阅 密钥发行中心。\n\n# Kerberos 一种基于票据（tickets）的计算机网络认证协议，允许通过非安全网络通信的节点和用户证明其身份。它提供双向认证，并在\
  \ Linux 上用于用户和服务的身份验证。\n\n# 内核 操作系统的核心组件。它管理来自软件的 I/O 请求并将其转换为计算机硬件的数据处理指令。\n\n\
  # 内核环形缓冲区 内存中的一部分，存储内核生成的的消息。`dmesg` 命令允许你读取内核环形缓冲区的内容。\n\n# 内核空间 为特权指令预留的内存部分。内核空间通常可操作系统内核、内核扩展和大多数设备程序访问。应用程序通常运行在用户空间，这确保了故障应用程序导致计算机系统崩溃。\n\
  \n# 内核虚拟机 充当虚拟机监控程序的 Linux 内核模块，使得直接在 Linux 内核之上运行虚拟机成为可能。\n\n# 密钥登录 在 SSH 中，密钥登录使用公钥/私钥来证明想要登录的用户身份。密钥登录通常被认为比密码登录更安全。\n\
  \n# 密钥发行中心 Kerberos 配置的一部分，负责向已证明授权特定服务的用户分发 Kerberos 票据。\n\n# Keytab keytab 文件供\
  \ kerberos 环境中的服务使用。keytab 包含了服务名称以及服务器用于身份验证目的所需的凭据。\n\n# Kickstart 用于自动安装的系统。\n\
  \n# kill `kill` 是一条可以向 Linux 进程发送信号的命令。定义了许多信号（见 man 7 signal），但只有少数常用，包括 `SIGTERM`\
  \ 和 `SIGKILL`，它们都用于停止进程。\n\n# KVM 参阅 内核虚拟机。\n\n## L\n\n# 标签 标签是一个可以分配给文件系统的名称。使用标签是一个好主意，因为一旦分配，标签将永远改变，这保证了即使设备名称等其他参数发生变化，文件系统仍然可以挂载。然而，UUID\
  \ 被认为比标签安全，因为意外重复标签的概率远高于重复 UUID 的概率。\n\n\n\n\n\n`LDAP` *参见* 轻量目录访问协议。\n\n`Libvirt`\
  \ 一种用于管理虚拟化的开源 API、守护进程和管理工具。RHEL 7 上的 `Libvirt` 由 `libvirtd` 实现，用于管理 KVM 虚拟机。\n\
  \n`Lightweight Directory Access Protocol`（轻量目录访问协议）最初是一种用于从 X.500 目录（类似于地址簿）获取信息的协议。在现代计算环境中，`LDAP`\
  \ 也是提供集中化信息的服务，可用于登录或其他目的。\n\n`Line anchors`（行锚）在正则表达式中指代行中特定位置的字符。\n\n`Linux` 一种类\
  \ Unix 操作系统，由一个最初由 Linus Torvalds 开发的内核组成（因此名为 `Linux`）。当前的 Linux 操作系统由内核和许多提供完整操作系统的开源工具组成。`Linux`\
  \ 以发行版的形式打包。目前，红帽企业级 Linux（Red Hat Enterprise Linux）是是最常用的 Linux 发行版之一。\n\n`LIO`\
  \ 在 iSCSI 中，实现 iSCSI 目标的解决方案，由目标服务实现。\n\n`Log rotation`（日志轮转）一种确保日志文件不会过大的服务。根据特定参数（如最大年龄或大小）对日志文件进行监控。一旦达到此参数，日志文件将被关闭并打开一个新的日志文件。旧日志文件将保留一段时间并会被删除，通常在几周后删除。\n\
  \n`Logical backup`（逻辑备份）一种包含数据结构但不包含包含数据的实际文件的备份。通常来说，逻辑备份更容易制作，但需要访问功能程序，而物理备份则不需要。\n\
  \n`Logical extent`（逻辑区）逻辑区是 LVM 中用于创建逻辑卷的构建块。它的它的大小通常为几兆字节，对应于所使用的物理区的大小。\n\n`Logical\
  \ partition`（逻辑分区）在扩展分区中创建的分区。更多细节请*参见* 扩展分区。\n\n`Logical unit`（逻辑单元）在 iSCSI 中，`LUN`（逻辑单元）是通过\
  \ iSCSI 共享的项。它提供了对后端存储的访问。\n\n`Logical volume`（逻辑卷）在 LVM 中，逻辑卷是创建文件系统的实体。逻辑卷经常用于\
  \ RHEL，因为它们提供了重要的优势，例如动态调整逻辑卷及其托管的文件系统大小的选择。\n\n`Logical volume manager`（逻辑卷管理器）允许与逻辑卷一起工作的软件。\n\
  \n`Login shell`（登录 shell）在用户登录后直接打开的 shell。\n\n`LUN` *参见* 逻辑单元。\n\n`LV` *参见* 逻辑卷。\n\
  \n`LVM` *参见* 逻辑卷管理器。\n\n### M\n\n`Mail queue`（邮件队列）在电子邮件中，必须发送的消息将放在邮件队列中。从那里，消息将由一个发送消息的过程拾取。通过使用邮件队列，可以同时处理许多消息。\n\
  \n`Masquerading`（伪装）在防火墙中，伪装是指私有网络上的计算机使用路由器的公 IP 地址连接到互联网上的计算机。互联网上的计算机只会看到公 IP\
  \ 地址，因此无法直接连接到私有网络上的计算机。伪装使得许多计算机共享一个公 IP 地址，同时也是一项安全功能。\n\n`Master Boot Record`（主引导记录）在\
  \ BIOS 系统上，主引导记录是主硬盘上的前 512 字节。它包含引导加载程序和分区表，可以访问该计算机硬盘上的不同分区。\n\n`MBR` *参见* 主引导记录。\n\
  \n`MDA` *参见* 消息投递代理。\n\n`Message delivery agent`（消息投递代理）电子邮件解决方案中负责在正确位置投递消息的部分。\n\
  \n`Message transfer agent`（消息传输代理）电子邮件解决方案中负责将消息发送给预期接收者的部分。在接收端，`MTA` 负责从发送端 `MTA`\
  \ 处接收消息。\n\n`Message user agent`（消息用户代理）电子邮件解决方案中用户用于访问和接收消息的部分。\n\n`Module`（模块）一段插件式代码。Linux\
  \ 上的多个系统（如内核、`GRUB 2`、`rsyslog` 等）使用模块。通过模块，可以轻松地扩展 Linux 组件，且添加功能不需要完全重写软件。\n\n\
  `Mount`（挂载）要访问特定存储设备上的文件，需要将存储设备挂载到目录上。这会将指定的目录设为访问存储设备上文件的接入点。挂载通常由系统管理员组织，对终端用户可见。\n\
  \n`Mount map file`（挂载映射文件）在 automount 中，定义了需要挂载的文件系统并将其映射到挂载点的文件。\n\n`MTA` *参见*\
  \ 消息传输代理。\n\n`MUA` *参见* 消息用户代理。\n\n`Multipath`（多路径）在 SAN 环境中，为访问存储设备提供冗余至关重要。结果是同一个存储设备可能会被看到两次，导致客户端不知道需要连接到哪个存储设备。为了解决这个问题，可以使用多路径驱动程序。该驱动程序将呈现一个统一的多路径设备。\n\
  \n`Multipliers`（倍数）在正则表达式中，指代引用前一个字符的多个字符。\n\n### N\n\n`Name server`（域名服务器）在 DNS\
  \ 中，名称服务器是配置了一个数据库，该数据库包含了回答 DNS 查询的资源记录。\n\n`NAT`（网络地址转换）也称为伪装，参见 伪装。\n\n`Netfilter`\
  \ Linux 内核中实现防火墙部分。\n\n`Netmask`（子网掩码）*参见* 子网掩码。\n\n`Network Address Translation`（网络地址转换）*参见*\
  \ 伪装。\n\n`Network File System`（网络文件系统）`Network File System` 是一种常用的 Unix 解决方案，将物理文件系统导出到网络上的其他主机。其他主机可以在其本地系统中挂载导出的\
  \ NFS 目录。\n\n`Network Information System`（网络信息系统）遗留系统，用于在 Linux 上提供存储用户、组、主机等信息的集中数据库。\n\
  \n`Network time`（网络时间）网络上提供的时间。\n\n`Network Time Protocol`（网络时间协议）一种用于为网络服务器提供可靠时间的标准。RHEL\
  \ 7 上的 `NTP` 由 `chronyd` 服务实现。\n\n`NFS` *参见* 网络文件系统。\n\n`nice` 一种更改 Linux 进程优先级的方法。负的\
  \ nice 值会使进程更具侵略性，赋予更高的优先级（用较低的优先级数字表示！）；正的 nice 值会使进程不那么急切，从而给其他进程优先。\n\n`NIS`\
  \ *参见* 网络信息系统。\n\n`nslcd` 用于 LDAP 客户端的遗留后端服务。\n\n`NTP` *参见* 网络时间协议。\n\n`Null client`（空客户端）在电子邮件中，指运行着如\
  \ `Postfix` 等 SMTP 服务的邮件客户端，但其仅配置为允许客户端发送出站消息。接收入站消息还需要额外的服务。\n\n### O\n\n`Octal`（八进制）一种仅使用\
  \ 0 到 7 数字的计数法。当使用 `umask` 或 `chmod` 命令处理 Linux 权限时使用。\n\n\n\n\n\n`OpenStack`: 一种开源云解决方案，正迅速成为云计算领域的事实标准，并提供基础设施即服务。\n\
  \n`OR`: 一种逻辑操作，其中只有当第一个命令无法执行时，才会执行第二个命令。\n\n`Output module`（输出模块）：在 `rsyslog` 中，用于将日志消息发送到特定目的地的模块。输出模块使\
  \ `rsyslogd` 变得灵活，并允许使用 `rsyslog` 原生不支持的日志目的地。\n\n`Ownership`（所有权）：在文件权限中，用户拥有的有效权限基于所有权。每个文件都有一个分配的用户和一个组。\n\
  \n## P\n\n`Package`（包）：用于分发软件的束。包通常包含文件的压缩存档和元数据，其中包含了有关如何安装这些文件的指令。\n\n`Package\
  \ group`（包组）：一组可以使用 `yum groups install` 命令作为整体安装的包。\n\n`Package groups`（软件包组）：在\
  \ `yum` 中，一组可以通过单个命令安装的软件包。\n\n`Pager`（分页器）：一种可用于逐页浏览文本文件的程序。`less` 工具是 Linux 中常用的分页器之一。\n\
  \n`Parent shell`（父 shell）：启动 shell 脚本或程序的环境。进程或子脚本将继承自父 shell 的设置。\n\n`Partition`（分区）：硬盘的子划分，可以在上面创建文件系统并将其挂载到目录结构中。\n\
  \n`Password`（密码）：用于身份验证的令牌。密码是用户可以设置的秘密单词，并将以加密方式存储。\n\n`Passphrase`（口令）：基本上是密码，但它比密码更长且更安全。\n\
  \n`Path`（路径）：文件位置的完整引用。\n\n`Permissions`（权限）：可以设置在文件或目录上的属性，允许用户或组访问这些文件或目录。\n\n\
  `Permissive`（宽松模式）：`SELinux` 中的一种模式，在该模式下没有任何操作被阻止，但所有操作都会记录在审计日志中。这种模式通常用于排除 `SELinux`\
  \ 问题。\n\n`Physical backup`（物理备份）：将包含实际数据的文件写入备份的备份。物理备份比逻辑备份更创建，但同时它们更可靠。\n\n`Physical\
  \ extent`（物理区范围）：在创建 `LVM` 物理卷时使用的物理构建块。通常的大小为几兆字节。\n\n`Physical volume`（物理卷）：`LVM`\
  \ 配置的基础构建块。物理卷通常对应于分区或整个磁盘设备。\n\n`PID`: *参见* 进程标识号。\n\n`Pipe`（管道）：一种用于将一个命令的输出转发并用作另一个命令输入的的结构。\n\
  \n`Policy`（策略）：*参见* SELinux 策略。\n\n`Port`（端口）：进程用于通过网络连接提供对该进程访问的数字。\n\n`Portable\
  \ Operating System Interface`（可移植操作系统接口）：一种为了维护操作系统之间兼容性而创建的标准。该标准主要适用于 UNIX，并保证不同版本的\
  \ Linux 和 UNIX 之间是兼容的。\n\n`Port forwarding`（端口转发）：一种防火墙技术，将进入特定端口的流量转发到另一个端口，该端口可能在同一主机上，也可能在不同的主机上。\n\
  \n`Portmap`：`portmapper` 是一种需要在提供 `RPC` 服务的系统上运行的远程过程调用服务。`Portmapper` 使用不对应特定 `TCP`\
  \ 或 `UDP` 端口的动态端口；只要进程处于活动状态，服务就会选择一个 `UDP` 或 `TCP` 端口进行使用。重启时，可能会使用不同的端口。它们需要映射到固定的\
  \ `UDP` 和 `TCP` 端口，以便为这些端口打开防火墙。`Portmapper` 仍被 `NFS` 服务组件使用。\n\n`Portal`（门户）：在\
  \ `iSCSI` 中，门户是 `iSCSI` 目标服务的 IP 地址和端口。\n\n`POSIX`: *参见* 可移植操作系统接口。\n\n`Primary`（主）：在\
  \ `DNS` 中，负责 `DNS` 数据库中资源记录的主 DNS 服务器。\n\n`Primary group`（主组）：每个 Linux 用户都是主组的成员。当你创建文件时，主组被分配为该文件的组所有。\n\
  \n`Primary partition`（主分区）：在 `MBR` 中，主引导记录中可以创建的最四个分区之一。*参见* 扩展分区。\n\n`Principal\
  \ In`（主体）：在 `Kerberos` 中，指可以使用 `Kerberos` 凭据进行识别和验证的实体。\n\n`Priority`（优先级）：在 `rsyslog`\
  \ 中，用于指定日志事件的严重性。根据严重性，可以采取特定的操作。\n\n`Priority`（优先级）：在进程处理中，指定进程重要性。进程优先级用数字表示（可以使用\
  \ `nice` 修改）。优先级数字低的进程将比优先级数字高的进程先被处理。\n\n`Private key`（私钥）：在公/私钥加密中，用于生成加密数据的密钥。\n\
  \n`Privileged user`（特权用户）：*参见* root。\n\n`Proc`：提供内核信息和内核可调内容的内核接口。该接口通过 `/proc`\
  \ 文件系统可用。\n\n```\n/proc\n/proc 文件系统。\n```\n\n`Process`（进程）：在 Linux 机器上运行的任务。粗来说，进程对应于一个程序，尽管一个程序可以启动多个进程。\n\
  \n`Process identification number`（进程标识号）：用于识别 Linux 系统上运行的进程的唯一数字。\n\n`Protocol`（协议）：计算中使用的一组规则，例如在计算机网络中建立两台计算机之间的通信。\n\
  \n`Pseudo Root File System`（伪根文件系统）：在 `NFSv4` 中，指由 `NFS` 服务器导出多个共享的解决方案。与其挂载每个单独的共享，不如\
  \ `NFS` 客户端挂载 NFS 服务器上的根文件系统，从而可以访问其有权的所有共享。\n\n`Pseudo root mount`（伪根挂载）：在 `NFSv4`\
  \ 中，对根目录系统或未被 `NFS` 服务器专门导出的高级目录的挂载，但它可以访问客户端权限的所有导出文件系统。\n\n`Public key`（公钥）：在密码学中，通常由服务器发送给客户端的密钥，以便客户端返回加密数据。\n\
  \n`PV`: *参见* 物理卷。\n\n## Q\n\n`Queue`（队列）：在进程管理中，队列用于进程执行前进行等待。\n\n## R\n\n`Realm`（领域）：`Kerberos`\
  \ 中的认证域。\n\n`Real Time Clock`（实时时钟）：安装在计算机主板上的硬件时。\n\n`Reboot`（重启）：停止计算机并重新启动的过程。\n\
  \n`Record`（记录）：在关系数据库中，记录是字段的集合，共同用于存储数据库中一个对象的数据。\n\n`Recursion`（递归）：在 `DNS` 中，当一个名称服务器无法解析\
  \ DNS 请求并需要将请求转发给另一个名称服务器时发生递归。在文件系统中，递归指的是包含子目录的内容，例如：\n\n```\nls -R\n```\n\n`Red\
  \ Hat Enterprise Linux`（红帽企业 Linux）：红帽销售订阅的软件名称。它提供服务器版和桌面版。\n\n`Red Hat Network`（红帽网络）：红帽提供的为具有活动订阅的客户提供补丁的平台。为了提供这些补丁和更新，红帽网络提供了为此目的所需的仓库。\n\
  \n`Red Hat Package Manager`（红帽包管理器）：用于 `RHEL` 软件包和包管理软件的包格式。`RPM` 也成为许多其他 Linux\
  \ 发行版包管理的标准。\n\n`Redirect`（重定向）：将某物发送到别处的方法。主要用于 `DNS`。\n\n\n\n\n**参考时钟** 在 NTP\
  \ 时间配置中用作时间源的时钟。通常，参考时钟是互联网上高度可靠的时钟，但也可以是计算机主板上的内部时钟。\n\n**正则表达式** 允许用户以灵活方式搜索文本模式的搜索模式。不要与\
  \ shell 的元字符混淆。\n\n**相对文件名** 相对于非根目录的目录名。\n\n**中继主机** 在电子邮件传输中，中继主机是消息转发到的主机。使用中继主机是为了防止所有客户端都必须自己发送消息。使用中继主机的优点是更容易进行安全防护，因为安全工作可以集中在一个或少数几个主机上。\n\
  \n**远程过程调用** 一种进程间通信方法，允许程序在另一个地址空间中执行代码。远程过程调用是一种旧协议，因此仍用于网络文件系统（NFS）。\n\n**存储库**\
  \ 包含可安装软件包和索引的安装源，索引包含有关可安装软件包的信息，以便安装程序 `yum` 可以将当前安装的软件包版本与存储库中可用的版本进行比较。\n\n\
  **驻留内存** 程序正在使用的内存页。\n\n**解析器** DNS 客户端部分，包含一个用于解析 DNS 查询的 DNS 服务器列表。\n\n**资源记录**\
  \ DNS 数据库中的条目。存在多种类型的资源记录，其中地址（A）资源记录负责将名称翻译为 IP 地址。\n\n**RHEL** 参见 红帽企业 Linux。\n\
  \n**RHN** 参见 红帽网络。\n\n**富规则** firewalld 中的规则，允许使用更复杂的语法，以便定义更复杂的规则。\n\n**root**\
  \ 用于系统管理任务的特权用户账户。用户 `root` 拥有所有权限，这意味着权限不适用于用户 `root`，这意味着 root 用户账户几乎是无限制的。\n\n\
  **根目录** 文件系统分级结构的起始点，记为 `/`。\n\n**RPC** 参见 远程过程调用。\n\n**RPM** 参见 红帽软件包管理器。\n\n**RTC**\
  \ 参见 实时时钟。\n\n**运行器 (Runner)** 在网络组组中，指用于通过网络组配置中的不同接口发送数据包的协议。\n\n**运行器 (Runners)**\
  \ 用于设置组聚合网络接口的协议规范。\n\n**rsyslogd** 记录消息的通用守护进程。\n\n### S\n\n**Samba** 实现 SMB 协议的\
  \ Linux 服务名称。\n\n**SAN** 存储区域网络，一种在网络上以块级别共享磁盘设备的解决方案。因此，它们可以像 Linux 系统上的本地磁盘设备一样使用。iSCSI\
  \ 和光纤是常见的 SAN 协议。\n\n**调度器** Linux 内核的一部分，负责监控可运行进程队列并为这些进程分配 CPU 时间。\n\n**Scientific\
  \ Linux** 一种基于红帽软件包的 Linux 发行版，但移除了红帽标志。对于寻找免费红帽企业 Linux 替代品的人来说，这是一个非常好的选择。\n\n\
  **附加组** 用户所属但其成员关系未在 `/etc/passwd` 文件中定义的组。在创建新文件时，附加组不会自动成为这些文件的所有者。\n\n**安全 Shell\
  \ (SSH)** 一种允许用户在远程服务器上打开 shell 的解决方案，通过公钥/私钥加密来实现安全性。\n\n**安全套接层 (SSL)** 参见 传输层安全\n\
  \n**SELinux** 一种 Linux 内核安全模块，提供支持访问控制安全策略的机制。\n\n**服务器消息块 (SMB)** 一种用于提供文件、打印机和串口共享访问的应用程序协议，在\
  \ Linux 上由 Samba 服务器实现。\n\n**ServerRoot** 在 Apache 中，指预期存放服务器配置文件的位置。\n\n**服务 (Services)**\
  \ 在 systemd 中：需要启动以提供特定功能的进程。\n在 firewalld 中：用于允许访问特定进程的防火墙设置配置。\n\n**共享 (Share)**\
  \ 使用 NFS 或 CIFS 等远程文件系统协议配置远程访问的目录。\n\n**Shebang** 用于脚本，指示应使用哪个 shell 来执行器脚本中的代码。如果不使用\
  \ shebang，脚本代码将由父 shell 解释，这在某些情况下会导致错误。shebang 以 `#` 开头，后跟着 `!` 和 shell 的完整路径，例如\
  \ `#!/bin/bash`。\n\n**shell** 可以执行命令的环境。Bash 是 Linux 上的默认 shell，但也存在其他 shell。\n\n\
  **shell 元字符** 诸如 `*`、`?` 和 `[a-z]` 等字符，允许用户以灵活的方式引用文件名中的字符。\n\n**信号 (Signal)** 可以发送给进程的指令。存在常见的信号，如\
  \ `SIGTERM` 和 `SIGKILL`，但 Linux 内核允许使用共 32 种不同信号。要向进程发送信号可以使用 `kill` 命令。\n\n**SMB**\
  \ 参见 服务器消息块。\n\n**快照 (Snapshot)** 文件系统实际状态的“照片”。\n\n**软件时间** 参见 系统时间。\n\n**源上下文**\
  \ 在 SELinux 中，上下文是标识允许操作的标签。SELinux 环境中的一切事物都有上下文。源上下文是发起操作的进程或用户的上下文。\n\n**SQL**\
  \ 参见 结构化查询语言。\n\n**SSH** 参见 安全 Shell。\n\n**SSH 隧道** 一种使用 SSH 创建安全连接的技术，可用于安全地发送数据。\n\
  \n**SSL** 参见 安全套接层。\n\n**sssd** 用于通过 LDAP、Kerberos、Active Directory 等不同类型协议进行远程登录的现代后端服务。\n\
  \n**标准错误 (stderr)** 程序向其发送错误消息的默认位置。\n\n**标准输入 (stdin)** 程序获取输入内容的默认位置。\n\n**标准输出\
  \ (stdout)** 程序向其发送常规输出的默认位置。\n\n**静态路由** 由网络管理员手动定义的路由。\n\n**STDERR** 参见 标准错误。\n\
  \n**STDIN** 参见 标准输入。\n\n**STDOUT** 参见 标准输出。\n\n**存储后端** 在 iSCSI 中，存储后端是用于 LUN 后的\
  \ iSCSI 目标存储设备，为 iSCSI 启动器提供共享块设备的访问。\n\n**层级 (Stratum)** 在时间同步中，stratum 用于表示服务器与权威互联网时间源之间的距离。\n\
  \n**结构化查询语言** 用作请求数据库数据的通用接口语言。\n\n**子域名** 在 DNS 中，子域名是任何域的子划分。在域名 example.com 中，example\
  \ 是顶级域名 .com 的子域名。\n\n**子网掩码** IP 网络的逻辑划分。\n\n**子 shell (Subshell)** 从其他 shell 启动的\
  \ shell。通常，通过运行 shell 脚本启动一个子 shell。\n\n**交换活跃性 (Swappiness)** Linux 内核将内存页从物理内存移动到交换区域的意愿。Swappiness\
  \ 设置为 `/proc/sys/vm` 目录下的参数，可以通过修改它来调整交换行为。\n\n\n\n\n\n**Symbolic link（符号链接）**：一种特殊文件，以绝对路径或相对路径的形式引用另一个文件或目录。\n\
  \n**Sysctl**：系统启动时使用的服务，允许自动设置内核调优或手动设置内核调优，并显示当前正在使用的参数。\n\n**sysctl**：用于加载 Linux\
  \ 内核调优的服务。\n\n**Sysfs**：挂载在 `/sys` 目录上的内核接口，用于访问管理硬件设置的参数。\n\n**Systemd**：RHEL 7\
  \ 上的管理器。`Systemd` 是内核加载后启动的第一个进程，负责启动 Linux 系统上的所有其他进程和服务。\n\n**System time（系统时间）**：操作系统维护的时间。当\
  \ Linux 系统启动时，系统时间被设置为当前硬件时间，而在操作系统运行期间，通常使用网络时间协议（NTP）进行同步。\n\n### T\n\n**Table（表）**：在关系型数据库中，一组可以作为独立实体存在并与其他表相关联的数据。\n\
  \n**Tainted kernel（污染内核）**：加载了不支持的内核模块的内核。\n\n**tar**：带归档器（Tape Archiver）；用于创建和提取备份的默认\
  \ Linux 实用程序。\n\n**Target（in iSCSI）**：参见 iSCSI target。\n\n**Target（in systemd）**：一组可以一起管理的单元文件集合。\n\
  \n**Target context（目标上下文）**：设置在目标对象（如端口、文件或目录）上的 SELinux 上文。\n\n**Teaming（网聚合）**：在网络中，指一种允许多个网络接口加入汇干网络接口的技术。网络网聚合用于提高性能和增加冗余性。\n\
  \n**Terminal（终端）**：最初是指用户用于输入命令的屏幕。在现代 Linux 系统上，可以使用伪终端（pseudo terminals）作为替代。伪终端提供了一个\
  \ shell 窗口，用户可以在其中输入需要执行的命令。\n\n**TFTP**：参见 Trivial File Transfer Protocol（简单文件传输协议）。\n\
  \n**TGT**：参见 Ticket Granting Ticket（票票）。\n\n**Thread（线程）**：线程可以作为进程的划分。许多进程是单线程的，这意味着它基本上是一个需要服务的单一实体。在多核或多\
  \ CPU 计算机系统中，使用多线程进程是有意义的。如果是这样，可以使用不同的核心来处理不同的线程，从而使进程受益于多核或多线程环境。\n\n**Ticket\
  \ Granting Ticket（票票）**：在 Kerberos 环境中，Ticket Granting Ticket 是一个小型加密标识文件，Kerberos\
  \ 用户或服务可以使用它来获取 Kerberos 环境中服务的访问。\n\n**Time stamp（时间戳）**：一种可用于文件、数据库记录和其他类型数据上的标识符，用于识别最后修改应用的时间。许多服务依赖于时间戳。为了确保基于时间戳的系统正常工作，需要配置时间同步。\n\
  \n**Time synchronization（时间同步）**：一种确保多台服务器使用相同时间的系统。为了实现时间同步，通常会使用网络时间协议（NTP）定义的外部时间服务器。\n\
  \n**Time To Live（存活时间）**：在 IP 流量中，Time To Live 定义了数据包在丢弃之前必须保持存活的时间。Time To Live\
  \ 以最大路由器数量表示。在 DNS 中，Time To Live 指 DNS 信息在再次请求之前允许保留在缓存中的最大时间。\n\n**TLS**：参见 Transport\
  \ Layer Security（传输层安全）。\n\n**Top Level Domain（顶级域名）**：在域名系统中，顶级域名识别 DNS 域名的最高层级。最初，可用的顶级域名数量有限（如\
  \ .com、.org 和 .net），但这一数量最近得到了扩展。\n\n**Transport Layer Security（传输层安全）**：一种创建用于确保计算机网络上通信安全的加密协议。在\
  \ TLS 中， 使用了公钥和私钥，并通过证书对对方进行身份验证。\n\n**Trivial File Transfer Protocol（简单文件传输协议）**：用于安装服务器和其他环境的服务。需要安装的服务器将通过\
  \ PXE 启动从网卡启动。DHCP 服务器通过提供 IP 地址首先响应此 PXE 启动。然后，DH 服务器将请求重定向到 `TFTP` 服务器，该服务器将提供启动镜像。\n\
  \n**TTL**：参见 Time To Live（存活时间）。\n\n**TTY**：在 Linux 上提供虚拟终端的程序。每个终端都有一个 TTY 名称，虚拟\
  \ TTY 为 `tty1-6`，伪终端为 `/dev/pts/0-nn`。\n\n### U\n\n**udev**：与 Linux 内核协同工作初始化硬件的服务。\n\
  \n**UEFI**：参见 Extensible Firmware Interface（可扩展固件接口）。\n\n**umask**：作为 shell 属性定义默认权限的八进制值。\n\
  \n**umount**：用于将文件系统从其挂载的目录解离的命令。\n\n**Unbound**：RHEL 7 上的 DNS 服务，可以作为仅缓存 DNS 服务器。\n\
  \n**Unit（单元）**：在 `systemd` 中，指由 `systemd` 管理的项目。存在不同类型的单元，包括服务、路径、挂载和目标单元。\n\n**Universal\
  \ time coordinated（协调世界时）**：一种全球统一的时间标准，无论用户处于哪个时区。协调世界时大致对应格林尼治标准时间。\n\n**Universal\
  \ Unique ID（通用唯一标识符）**：一种由长随机十六进制数组成的标识符，具有全局唯一性。\n\n**Umount**：执行以将存储设备从其挂载目录解离的过程。\n\
  \n**Unprivileged user（无权限用户）**：普通非 root 用户账户，应用权限设置的访问限制。\n\n**Upstart**：RHEL 6\
  \ 用于在系统初始化期间启动服务的系统。\n\n**User（用户）**：Linux 上用于提供特定系统访问的实体。用户可以代表人员，但许多服务也有专用的用户账户，允许服务以该服务所需的特定权限运行。\n\
  \n**Userspace（用户空间）**：非 root 权限启动的应用程序可访问的内存区域。\n\n**UTC**：参见 Universal time coordinated（协调世界时）。\n\
  \n**UUID**：参见 Universal unique ID（通用唯一标识符）。\n\n### V\n\n**Value（值）**：分配给特定属性、变量或记录的数据。\n\
  \n**Variable（变量）**：包含动态特定值的标签。在脚本中，变量经常用于增加脚本的灵活性。\n\n**Vfat**：用于访问 FAT 文件系统的 Linux\
  \ 内核驱动程序。FAT 是 Windows 环境中常用的文件系统。Linux Vfat 驱动允许使用此文件系统。\n\n**VG**：参见 volume group（卷组）。\n\
  \n**virbr**：参见 virtual bridge（虚拟桥接）。\n\n**Virsh**：允许管理 KVM 虚拟机及其环境的 shell 接口。\n\n\
  **Virtual bridge（虚拟桥接）**：一种软件桥接（类似于网络交换机），主要用于虚拟环境，允许多个主机访问同一个网络接口。\n\n**Virtual\
  \ host（虚拟主机）**：在 Apache Web 服务器中，虚拟主机是用于标识 Web 服务器的配置设置集合。之所以被称为虚拟主机，是因为一个 Apache\
  \ Web 服务器可以配置多个虚拟主机，允许管理员在了一个 Apache 服务器上运行多个网站。\n\n\n\n\n\n# 虚拟内存\n可寻址内存的总量。虚拟内存被称为`虚拟`内存，是因为它不是指真实存在的内存。它的唯一目的是确保\
  \ Linux 程序可以设置一个唯一且未被其他程序占用的地址指针。\n\n# 卷组\n逻辑卷管理器（LVM）中的抽象层，用于表示由物理卷提供的所有可用存储，并从这些卷创建逻辑卷。\n\
  \n## W\n\n**Want** 用于指示 systemd 单元文件其应该从某个特定的 systemd target 启动。\n\n**Wants** 定义特定\
  \ systemd target 中需要的 systemd 单元。\n\n**Web Server Gateway Interface**（Web 服务器网关接口）一种用于\
  \ Python 语言的 Web 服务器与 Web 服务器应用程序或框架之间统一接口的规范。\n\n**Wildcard**（通配符）字符 `*`，在 shell\
  \ 环境中指代任意数量的任何字符。\n\n**WSGI** *参见* Web Server Gateway Interface。\n\n## X\n\n**XFS**\
  \ 一种由 SGI 在 1993 年创建的高性能 64 位文件系统，在 RHEL 7 中用作默认文件系统。\n\n**Xinetd** Internet Superservice（Internet\
  \ 超服务）。这是一种用于监听其他托管服务入站连接的服务。当这些托管服务被需要时，`xinetd` 会启动它们，并在不再需要时将其关闭。\n\n## Y\n\n\
  **Yellowdog Update Manager** 在 RHEL 7 中用于从 `yum` 仓库安装软件包的元包处理器。\n\n**Yum** *参见*\
  \ Yellowdog Update Manager。\n\n## Z\n\n**Zone**（区域）在 firewalld 中，区域是一个或多个网络接口的集合，特定的\
  \ firewalld 规则与这些接口关联。\n\n## 配套内容文件在哪里？\n\n**注册此数字版本的**\n\n**Red Hat RHCSA/RHCE\
