  ```\n\n\n\n\n1. 使用 `ps aux | grep dd` 来找到你刚刚启动的 `dd` 命令的 PID。PID 位于命令输出的第二列。\n\n\
  2. 使用 `renice -n 10 -p 1234`（假设 `1234` 是你找到的 PID）。\n\n注意，普通用户只能降低运行进程的优先级。你必须拥有\
  \ root 权限才能提高进程的优先级。\n\n#### 使用 `kill`、`killall` 和 `pkill` 向进程发送信号\n\n在考虑使用 `kill`\
  \ 命令或向进程发送其他 信号 之前，最好了解 Linux 进程之间存在层级关系。每个进程都有一个父进程，只要父进程存运行，它就负责它所创建的子进程。这在进程终止时尤为重要，因为必须由父进程来清理子进程使用的资源。当你对仍有活跃子进程的父进程使用\
  \ `kill` 时，由于该原因，你不仅会杀死该父进程，还会杀死它所有当前活跃的子进程。\n\n***\n\n注意\n\n随着时间的推移，开发了许多用于进程监控和管理的不同工具。如果你喜爱的工具没有在这里提到，我深表歉意。然而，尝试了解所有可用工具并没有真正意义，因为许多工具提供了可以相当的功能。\n\
  \n***\n\nLinux 内核允许向进程发送许多信号。使用 `man 7 signals` 可以获得可用信号的完整概述。\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 信号 `SIGTERM` (15) 用于请求进程停止。\n\n![Image](img/squf.jpg) 信号\
  \ `SIGKILL` (9) 用于强制进程停止。\n\n![Image](img/squf.jpg) `SIGHUP` (1) 信号用于挂起进程。其效果是进程将重新读取其配置文件，这使得它在修改进程配置文件后使用该信号是非常有用的。\n\
  \n要向进程发送信号，可以使用 `kill` 命令。最常见的用法是停止一个进程，你可以通过使用 `kill` 命令后进程的 PID 来实现。这会向进程发送 `SIGTERM`\
  \ 信号，通常会导致进程停止活动。\n\n有时 `kill` 命令不起作用，因为你想杀死的进程正在忙。在这种情况下，你可以使用 `kill -9` 向进程发送\
  \ `SIGKILL` 信号。因为 `SIGKILL` 信号无法被忽略，它会强制进程停止，但你在使用此命令时也面临丢失数据的风险。通常情况下，使用 `kill\
  \ -9` 是一个坏主意：\n\n![Image](img/squf.jpg) 你面临着丢失数据的风险。\n\n![Image](img/squf.jpg) 如果其他进程依赖于你刚刚杀死的进程，你的系统可能会变得不稳定。\n\
  \n***\n\n提示\n\n使用 `kill -l` 显示可以与 `kill` 使用的信号列表。\n\n***\n\n有一些与 `kill` 相关的命令：`killall`\
  \ 和 `pkill`。`pkill` 命令稍微简单一点，因为它接受进程的名称而不是 PID 作为参数。如果你需要同时杀死多个使用相同名称的进程，可以使用 `killall`\
  \ 命令。\n\n当 Linux 环境是多进程而非多线程时，使用 `killall` 特别常见。在服务器启动了多个具有相同名称命令的多进程环境中，很难根据每个单独的\
  \ PID 逐一停止这些命令。使用 `killall` 可以让你同时终止所有这些进程。\n\n***\n\n注意\n\n回到 20 90 年在 Linux 上使用\
  \ Netscape 浏览器时，启动了许多（许多！）netscape 进程。使用 `killall netscape` 一次杀死它们是非常高效的。\n\n***\n\
  \n在多线程环境中，使用 `killall` 的欲望较小。因为通常只有一个进程产生多个线程，所有这些线程都会通过停止启动它们的进程而被终止。不过，你仍然可以使用\
  \ `killall` 来终止服务器上启动的许多同名进程。在 练习 9.2 中，你将练习刚刚学到的命令。\n\n***\n\n### 练习 9.2 从命令行管理进程\n\
  \n在此练习中，你将学习如何使用 `ps`、`nice`、`kill` 和相关工具来管理进程。\n\n1. 打开 root shell。从该 shell 中输入\
  \ `dd if=/dev/zero of=/dev/null &`。重复此命令三次。\n\n2. 输入 `ps aux | grep dd`。这会显示所有包含\
  \ `dd` 字母的输出行；你看到的不仅仅是 `dd` 进程，但这并不真的重要。你刚刚启动的进程列在最后。\n\n3. 使用其中一个 `dd` 进程的 PID\
  \ 来调整 niceness，使用 `renice -n 5 <PID>`。注意，在 top 中你无法轻松地获取进程及其当前优先级的概述。\n\n4. 输入 `ps\
  \ fax | grep -B5 dd`。`-B5` 选项显示匹配的行，包括之前的五行。因为 `ps fax` 显示了进程间的层级关系，你还应该找到启动所有 `dd`\
  \ 进程的 shell 及其 PID。\n\n5. 使用其中一个 `dd` 进程的 PID 调整 niceness，使用 `renice -n 5 <PID>`。注意，在\
  \ top 中你无法轻松地获取进程及其当前优先级的概述。\n\n6. 输入 `ps fax | grep -B5 dd`。`-B5` 选项显示匹配的行，包括之前的五行。因为\
  \ `ps fax` 显示了进程间的层级关系，你还应该找到启动所有 `dd` 进程的 shell 及其 PID。\n\n7. 使用其中一个 `dd` 进程的 PID\
  \ 调整 niceness，使用 `renice -n 5 <PID>`。注意，在 top 中你无法轻松地获取进程及其当前优先级的概述。\n\n8. 输入 `ps\
  \ fax | grep -B5 dd`。`-B5` 选项显示匹配的行，包括之前的五行。因为 `ps fax` 显示了进程间的层级关系，你还应该找到启动所有 `dd`\
  \ 进程的 shell 及其 PID。\n\n9. 使用其中一个 `dd` 进程的 PID 调整 niceness，使用 `renice -n 5 <PID>`。注意，在\
  \ top 中你无法轻松地获取进程及其当前优先级的概述。\n\n10. 输入 `ps fax | grep -B5 dd`。`-B5` 选项显示匹配的行，包括之前的五行。因为\
