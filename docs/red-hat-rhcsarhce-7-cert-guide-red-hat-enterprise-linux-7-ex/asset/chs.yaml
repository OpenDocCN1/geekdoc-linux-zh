  **c. `rpm -ivh`**\n**d. `rpm -Uvh`**\n\n**9.** 哪个命令允许你找到特定文件属于哪个 RPM？\n\n**a. `rpm\
  \ -ql /bin/file`**\n**b. `rpm -qlf /bin/file`**\n**c. `rpm -qf /bin/file`**\n**d.\
  \ `rom -qa /bin/file`**\n\n**10.** 哪个命令允许你分析刚下载的 RPM 软件包文件中是否存在脚本？\n\n**a. `rpm\
  \ -qs packagename.rpm`**\n**b. `rpm -qps packagename.rpm`**\n**c. `rpm -qp --scripts\
  \ packagename.rpm`**\n**d. `rpm -q --scripts packagename.rpm`**\n\n### 基础主题\n\n\
  ### 使用 yum 管理软件软件包\n\nRed Hat Enterprise Linux 上用于管理软件软件包的默认工具是 `yum`，它代表 Yellowdog\
  \ update manager（黄狗更新管理器）。`yum` 设计初衷是与仓库（repositories）配合工作，仓库是可用软件软件包的在线堆栈库（depots）。在本节中，你将学习如何创建和管理仓库，以及如何根据仓库的内容管理软件包。\n\
  \n### 理解仓库的作用\n\nRed Hat Enterprise Linux 上的软件以 RPM (Red Hat Package Manager) 格式提供。这是一种存档软件包并提供软件包元数据的特定格式。\n\
  \n在 Red Hat Enterprise Linux 上处理软件时，仓库起着关键作用。使用仓库使保持服务器最新变得简单：仓库维护者在仓库中发布更新的软件包，结果是每当你使用\
  \ `yum`（本章稍后讨论）安装软件时，会自动使用软件的最新版本。\n\n使用 `yum` 的另一个主要优势是处理软件包依赖的方式。在 Linux 上（与大多数其他现代操作系统一样），软件软件包具有依赖关系。这意味着为了安装一个软件包，必须存在其他软件包。如果不使用仓库，这意味着这些软件包必须手动安装。\n\
  \n`yum` 仓库系统会自动处理这些依赖关系。如果要安装某个软件包，它将包含所需依赖的信息。然后 `yum` 命令会在系统配置的仓库中查找这些依赖。如果一切顺利，安装程序将看到要安装软件包的依赖)。从\
  \ RHN 提供了不同的仓库。注册 RHN 后，你可以自动安装经过红帽验证的软件。如果你使用的是 CentOS，你可以获得 CentOS 仓库。但是，如果你在没有注册密钥的情况下安装\
  \ Red Hat Enterprise Linux，它无法与 RHN 仓库通信，导致没有任何仓库。情况下，你必须自己指定想要使用的仓库。\n\n注意，仓库特定于操作系统。因此，如果你在使用\
  \ RHEL，应该只使用 RHEL 仓库。不要尝试将 CentOS 仓库添加到 RHEL 服务器。如果你想为 RHEL 服务器提供来自 Fedora 项目的额外软件（出于支持考虑这样做），可以考虑添加\
  \ EPEL（企业级额外软件包）仓库。更多信息请参见 [`fedoraproject.org/wiki/EPEL`](https://fedoraproject.org/wiki/EPEL)。\n\
  \n> **警告**\n> 不要在 RHEL 上安装 EPEL 仓库；这样做会破坏你的支持。\n\n### 指定要使用的仓库\n\n在大多数情况下，服务器安装完成后，它会配置好应该使用的仓库列表。你有时需要告诉服务器应该使用哪些仓库：\n\
  \n![Image](img/squf.jpg) 你想通过仓库分发非默认软件包。\n\n![Image](img/squf.jpg) 你在没有在 RHN 注册的情况下安装\
  \ Red Hat Enterprise Linux。\n\n告诉服务器使用哪个仓库并不困难，但你必须知道如何这样做（对于 RHCSA 和 RHCE 考试也是如此）。\n\
  \n\n\n\n\n![Image](img/key_topic.jpg)\n\n要告诉服务器使用哪个软件仓库，你需要创建一个以 `.repo` 结尾的文件。在该文件中，你需要包含以下内容：\n\
  \n![Image](img/squf.jpg) **[label]** `.repo` 文件可以包含不同的仓库，每个部分以一个标识特定仓库的标签（label）开头。\n\
  \n![Image](img/squf.jpg) **name=** 用此来指定你想要使用的仓库的名称。\n\n![Image](img/squf.jpg) **baseurl=**\
  \ 包含指向特定仓库位置的 URL。\n\n![Image](img/squf.jpg) 在默认提供的仓库文件中，你可能会在一个文件中文件中找到多个仓库，如 Listing\
  \ 11.1 所示。这对于将属于一起的仓库分组在一个文件中非常有用，而且通常在默认提供的仓库文件中会这样做。如果你是自己创建仓库文件，可以自由地为每个仓库创建单独的文件。\n\
  \n* *\n\n### 提示\n\nRHEL 7 没有易于使用的图形用户界面 (GUI) 工具来方便你创建自己的仓库文件。因此，你必须确保自己知道如何操作，以防出现相关的考试题。为了帮助这一点，请输入\
  \ `man yum.conf` 并搜索“example.”。这会显示一个包含仓库文件中应存在的这些最小要素的示例。\n\n* *\n\nListing 11.1\
