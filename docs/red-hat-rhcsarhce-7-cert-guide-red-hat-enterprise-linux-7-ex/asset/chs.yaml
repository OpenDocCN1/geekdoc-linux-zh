  \ 实用程序之前，确保文件 `/etc/sysconfig/authconfig` 包含以下参数。这些参数强制使用 `SSSD` 进行身份验证。`FORCELEGACY`\
  \ 参数指向 `nslcd`。通过将其设置为 `no`，你可以关闭 `nslcd` 的使用：\n\n![Image](img/squf.jpg) `USESSSD=yes`\n\
  \n![Image](img/squf.jpg) `FORCELEGACY=no`\n\n![Image](img/squf.jpg) `USESSSDAUTH=yes`\n\
  \n### 设置外部认证\n\n要设置外部认证，你可以使用 `authconfig-tui` 或 `authconfig-gtk` 实用程序。在本节中，你将学习如何使用\
  \ `authconfig-tui` 创建配置。练习 25.1 将引导你完成设置配置所涉及的不同部分。\n\n### 练习 25.1 设置外部认证\n\n在本次练习中，你为\
  \ `labipa.example.com` 服务器上的 `server1` 设置外部认证。此练习假设你正在使用附录 D 中“设置身份管理”描述的 `labipa`\
  \ 服务器，或者你正在使用从 [`www.rhatcert.com`](http://www.rhatcert.com) 下载的实验室虚拟机 (VM)。练习中的所有步骤都在\
  \ `server1` 上执行。\n\n1. 使用 `ping labipa.example.com` 验证你是否可以通过名称访问 `labipa.example.com`\
  \ 服务器。如果不起，请在继续之前修复：通过在 DNS 中包含将 `labipa.example.com` 解析到其主机名的条目，或者使用 `labipa` 服务器提供的\
  \ DNS 服务器。\n\n2. 输入 `yum install -y sssd sssd-tools nss-pam-ldapd`。\n\n3. 输入 `mkdir\
  \ /etc/openldap/cacerts`。\n\n4. 使用 `scp labipa.example.com:/root/cacert.p12 /etc/openldap/cacerts`\
  \ 将证书从 IPA 服务器复制到你的本地服务器。\n\n5. 输入 `vim /etc/sysconfig/authconfig`。确保该文件包含以下配置选项：\n\
  \n```\nUSESSSDAUTH=yes\nUSESSSD=yes\nFORCELEGACY=no\n```\n\n6. 以 root 身份启动 `authconfig-tui`。在\
  \ User Information 中，选择 `Cache Information`、`Use LDAP`，并在 Authentication 下，选择 `Use\
  \ LDAP Authentication`。\n\n7. 在 LDAP Settings 屏幕中，选择 `Use TLS` 并指定以下内容：\n\n点击此处查看代码图像\n\
  \n服务器 (Server): labipa.example.com\nBase DN: dc=example,dc=com\n\n8. 打开 `/etc/sssd/sssd.conf`\
  \ 文件并添加以下行，这将仍然使用 TLS 加密会话，但会放宽对证书的完整性检查。这在使用自签名证书的环境中（如此设置所示）非常有用，但在使用从外部证书机构获取证书时通常是不需要的：\n\
  \n```\nldap_tls_reqcert = never\n```\n\n9. 输入 `systemctl restart sssd` 以重启 `sssd`\
  \ 服务。\n\n10. 从 shell 输入 `su - lisa`。你现在应该看到消息“cannot change to /home/lisa: No such\
  \ file or directory”，这是正常的，因为我们没有配置任何主目录自动挂载。\n\n11. 输入 `id`。这将显示你当前以用户 `lisa` 的身份登录。\n\
  \n### 提示\n由于使用的身份认证后端实际上取决于你使用的服务器上安装的软件，在考试中请确保你知道如何处理 `nslcd` 以及 `sssd`。请阅读第 6\
  \ 章 的最后一节以获取有关这两个服务配置的更多细节。\n\n按照练习 25.1 中的描述配置 LDAP 认证后，你现在也可以启用 Kerberos 授权。最简单的方法是再次运行\
  \ `authconfig-tui`。练习 25.2 介绍了该过程。\n\n### 练习 25.2 配置 Kerberos 授权\n\n本次练习接练习 25.1，只有在成功完成练习\
  \ 25.1 后才能完成。\n\n1. 在 `server1` 上，打开 root shell 并启动 `authconfig-tui`。\n\n2. 输入 `yum\
  \ install -y pam_krb5 krb5-workstation` 以安装为所有支持 Kerberos 的应用程序添加支持的 RPM 包。\n\n\
  3. 在认证 Configuration 屏幕上，在 Authentication 下，选择 `Use Kerberos` 以启用 Kerberos 授权。\n\
  \n4. 在 LDAP Settings 屏幕上，不要更改任何；你已经在上一个练习中配置好了。\n\n5. 在 Kerberos Settings 屏幕中，输入以下参数：\n\
  \n点击此处查看代码图像\n\n域 (Realm): EXAMPLE.COM\nKDC: labipa.example.com\n管理服务器 (Admin Server):\
  \ labipa.example.com\n\n或者，你可以勾选 `Use DNS to Resolve Hosts to Realms` 和 `Use DNS\
  \ to Locate KDCs for Realms` 来自动填充这些字段。此选项将使用 Kerberos 在 DNS 中创建的用于在 DNS 中注册服务的\
  \ SRV 资源记录，并使查找这些服务的信息变得容易。\n\n6. 当回到 shell 提示符时，以 root 身份输入 `kinit -k`。这验证了主机可以进行认证，并显示\
  \ Kerberos 认证配置是正确的。\n\n7. 现在你知道主机可以进行认证，输入 `kinit lisa`。输入用户 `lisa` 的密码。这证明 Kerberos\
  \ 认证工作正常。\n\n此时，基于 `sssd` 服务，外部认证应该已经工作了。因此，`/etc/sssd/sssd.conf` 文件应该创建。在此文件中，你将找到通过\
  \ `authconfig` 实用程序输入的所有配置设置。列表 25.3 显示文件的内容：\n\n点击此处查看代码图像\n\n```\n[sssd]\nservices\
  \ = nss, pam, ssh\nconfig_file_version = 2\ndomains = example.com\n\n[domain/example.com]\n\
  cache_credentials = True\nkrb5_store_password_if_offline = True\nipa_domain = example.com\n\
  id_provider = ipa\nauth_provider = ipa\naccess_provider = ipa\nipa_hostname = server1.example.com\n\
  chpass_provider = ipa\nipa_server = _srv_, ipa.example.com\nldap_tls_cacert = /etc/ipa/ca.crt\n\
  \n[nss]\n[pam]\n[sudo]\n[autofs]\n[ssh]\n[pac]\n```\n\n\n\n\n在本章中，你学习了如何为服务器配置外部身份验证。你学习了认证（authentication）与授权（authorization）之间的区别，并学习了哪些后端服务可以用于设置这两种功能。你还学习了如何配置服务器使用\
  \ `sssd` 或 `nslcd` 进行认证和授权。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n复习本章最重要的主题，这些主题在页面的外侧边缘用“关键主题（Key\
  \ Topic）”图标标记。表 25.3 列出了这些关键主题的索引以及它们各自所在的页码。\n\n![Image](img/25tab03.jpg)\n\n**表\
  \ 25.3** 第 25 章 关键主题\n\n#### 根据记忆完成表格和列表\n\n打印附录 B“记忆表格”（在光盘中找到）或至少打印本章对应的章节，并根据记忆完成表格和列表。附录\
  \ C“记忆表格答案对照”同样在光盘中，包含了已完成的表格和列表供你检查工作。\n\n#### 定义关键术语\n\n定义本章的以下关键术语并在词表中检查你的答案：\n\
  \nLDAP\n\nNIS\n\nKerberos\n\nRealm\n\nKDC\n\nTGT\n\nprimary\n\nprincipal\n\nkeytab\n\
  \napplication server\n\nsssd\n\nnslcd\n\n#### 复习题\n\n**1.** 如果你正在寻找一个能够设置外部身份验证的图形化工具，你会使用哪个命令？\n\
  \n**2.** 你预计在 `/etc/sssd/sssd.conf` 文件中找到认证。该文件不存在，但你的服务器仍然可以对 LDAP 服务器进行认证。最可能的解释是什么？\n\
  \n**3.** 你的服务器正在使用 `sssd`，你在日志中看到消息显示 LDAP CA 证书导致了错误。解决此问题的简单方法是什么？\n\n**4.** 在运行\
  \ `authconfig` 工具之前，你需要修改哪个配置文件以确保使用 `sssd` 作为认证后端？\n\n**5.** 哪个命令允许你将服务器注册到 AD\
  \ 域 `mydomain.example.com`？\n\n**6.** 你会在哪个文件中查找当前的 Kerberos 客户端配置设置？\n\n**7.**\
  \ 哪个命令允许你从命令行始一个 Kerberos 会话？\n\n**8.** 你会检查哪个文件以确保客户端工具正在使用 `sssd` 认证后端服务？\n\n\
  **9.** 哪个文件包含 LDAP 客户端的配置？\n\n**10.** 哪个文件包含使用 Kerberos 服务的登录凭据？\n\n### 章节末实验\n\n\
  #### 实验 25.1\n\n1. 配置 `server1` 使用 `nslcd` 认证后端服务进行 LDAP 认证和 Kerberos 授权。\n\n2.\
  \ 配置 `server2` 使用 `sssd` 认证后端服务进行 LDAP 认证和 Kerberos 授权。\n\n3. 通过登录 LDAP 用户 `lisa`\
  \ 验证两台服务器均正常工作。使用 `kinit` 验证凭据。\n\n## 第 26 章 配置 iSCSI SAN\n\n**本章涵盖了以下主题：**\n\n\
  ![Image](img/squf.jpg) 理解 iSCSI\n\n![Image](img/squf.jpg) 设置 iSCSI 目标\n\n![Image](img/squf.jpg)\
  \ 设置 iSCSI 启动器\n\n![Image](img/squf.jpg) iSCSI 故障排除\n\n**本章涵盖了以下 RHCE 考试目标：**\n\n\
  ![Image](img/squf.jpg) 将系统配置为 iSCSI 目标 或启动器，并持久挂载 iSCSI 目标\n\n在本章中，你学习了理解 iSCSI\
  \ 并在设置 iSCSI 目标 和设置 iSCSI 启动器 之后进行 iSCSI 故障排除。\n\n将系统配置为 iSCSI 目标 或启动器，并持久地挂载 iSCSI\
  \ 目标，是这些 RHCE 考试目标之一。\n\n在过去，每台计算机都有自己的硬盘。在服务器之间共享文件只能通过网络文件系统（NFS）等协议实现。在现代数据环境中，使用存储区域网络\
  \ (SAN) 来分离存储变得越来越常见。SAN 提供共享块设备。另一种常见的共享存储方案是 NAS。通常 SAN 快且更具灵活性。某些 SAN 设备也提供 NAS\
  \ 访问，以便存储管理员选择其所需的方案。\n\n在类可用集群中，节点可以同时访问共享存储。如果多个计算机同时向同一个 `XFS` 文件系统写入数据将会出现问题。\n\
  \n在集群环境中使用 SAN 存储需要支持 `GFS2` 等文件系统。配置此类文件系统超出了 RCSA 或 RHCE 考试的要求，因此本章未涉及。\n\n###\
  \ 提示\n\n### \n\n### “你已经掌握了吗？”测验\n\n“你已经掌握了吗？”测验可以让你评估自己是应该阅读整章，还是跳转到“考试准备任务”部分。如果你对这些问题的答案或对这些主题知识的自我评估有疑问，请阅读整章。表\
  \ 26.1 列出了本章的主要标题及其对应的“你已经掌握了吗？”测验问题。你可以在附录 A““你已经掌握了吗？”测验和复习题的答案”中找到答案。\n\n![Image](img/26tab01.jpg)\n\
  \n**表 26.1** “你已经掌握了吗？”章节与问题映射\n\n**1.** 关于 SAN 存储的下列陈述中正确的是？\n\na. SAN 上的存储可以在节点之间共享，无需采取任何额外措施。\n\
  \nb. 访问 SAN 存储需要光纤基础设施。\n\nc. 为了允许不同的服务器同时共享访问 SAN 卷，需要一种特殊的文件系统。\n\nd. 配置 SAN 存储需要配置\
  \ iSCSI 启动器。\n\n\n\n\n\n## 2. 下列哪项*不能*通过 `iSCSI` 目标作为 SAN 存储进行共享？\n\n**a.** 一个文件\n\
  **b.** 一个磁盘\n**c.** 一个 `LVM` 卷\n**d.** 以上所有项都可以共享。\n\n## 3. 关于 `iSCSI` 网络拓扑，以下哪种陈述是正确的？\n\
  \n**a.** 你至少需要一个 100Mb 的网络。\n**b.** `iSCSI` 流量不能与其他网络流量混合。\n**c.** 为了配置冗余拓扑，建议创建多多路径配置。\n\
  **d.** `iSCSI` SAN 解决方案仅支持光纤介质。\n\n## 4. 下列哪项是通过 `iSCSI` 目标共享的后端存储的名称？\n\n**a.**\
  \ `LUN`\n**b.** `ACL`\n**c.** `IQN`\n**d.** 后端存储 (Backend storage)\n\n## 5. 你用于配置\
  \ `LIO` `iSCSI` 目标的工具名称是什么？\n\n**a.** `lioconfig`\n**b.** `iscsiadm`\n**c.** `targetcli`\n\
  **d.** `ietadm`\n\n## 6. 在设置 `LIO` `iSCSI` 目标时，需要执行不同的步骤。下列命令中哪个第一个？\n\n**a.** `create\
  \ iqn.2014-11.com.example:target`\n**b.** `tg1/acls/ create iqn.2014-11.com.example:server1`\n\
  **c.** `fileio/ create file /root/diskfile1 1G`\n**d.** `luns/ create /backstores/block/block1`\n\
  \n## 7. `iSCSI` 目标服务器上必须开启哪个防火墙端口以访问共享存储设备？\n\n**a.** 3128\n**b.** 2160\n**c.**\
  \ 3260\n**d.** 3821\n\n## 8. 你在处配置 `iSCSI` 启动器名称？\n\n**a.** `/etc/iscsi/iscsid.conf`\n\
  **b.** `/etc/iscsi/iscsi-initiator.conf`\n**c.** `/etc/iscsi/initiatorname.iscsi`\n\
  **d.** `/etc/initiatorname.conf`\n\n## 9. 关于 `iSCSI` 启动器发现，以下哪种陈述*不*正确？\n\n**a.**\
  \ 如果你已经知道 `initiatorname`，则不需要执行发现。\n**b.** `isicsi` 发现的结果存储在 `/var/lib/iscsi` 中。\n\
  **c.** 发现结果是持久化存储的。\n**d.** `iSCSI` 发现过程显示 `iSCSI` 目标的 `IQN`。\n\n## 10. 下列哪个命令显示了获取关于当前会话尽可能详细详细的正确语法？\n\
  \n**a.** `iscsiadm -m session -P 3`\n**b.** `iscsiadm --mode -P 1`\n**c.** `iscsiadm\
  \ --mode node -P 2`\n**d.** `iscsiadm --mode session -P 4`\n\n### 基础主题\n\n为了执行本章描述的任务，你需要两台服务器：一台配置为\
  \ `iSCSI` SAN，另一台配置为访问 SAN 共享存储设备的节点。在本章的练习中，使用了两台服务器：\n\n![Image](img/squf.jpg)\
  \ Server1 是 `iSCSI` 目标。在这台服务器上，你需要的磁盘空间来设置一个 `LVM` 卷和一个文件。100MB 足够设置这些内容。\n\n![Image](img/squf.jpg)\
  \ Server2 是 `iSCSI` 启动器。在这台服务器上，你需要配置为访问 SAN 共享存储设备的节点。\n\n## 理解 iSCSI\n\n在本节中，你将学习\
  \ `iSCSI` 目标如何提供性能，并了解 `iSCSI` 与硬件的关系。\n\n## 比较解决方案\n\n在设置 SAN 时，你需要了解不同的拓扑结构。为了配置冗余拓扑，建议创建多路径配置。虽然在\
  \ `iSCSI` SAN 解决方案中，仅支持光纤介质。\n\n## iSCSI 架构\n\n在 `iSCSI` 架构中，`iSCSI` 目标是提供共享存储访问的服务器。\n\
  \n\n\n\n在设置 iSCSI SAN 时，你通常希望使用专用的网络架构。这意味着在 SAN 网络上，你只希望有 SAN 网络流量而不包含其他流量。在该网络上，你可能还希望设置冗余，以确保当主\
  \ SAN 交换机故障时，冗余路径可用。每个 iSCSI 启动器都应该有一个到 iSCSI 目标的备连接，这样如果其中一个连接完全断开，另一个连接就可以接管。\n\
  \n使用冗余网络连接时，iSCSI 启动器会看到两次 SAN 设备，分别通过通往 SAN 的两条不同路径。这可能导致同一个共享磁盘设备也被呈现两次。为了确保在具有冗余路径的此类设置下\
  \ SAN 设备被正确寻址，应将 iSCSI 启动器配置运行 multipath 驱动程序。该驱动提供了一个启动器可以通信的接口，该接口设置为冗余模式，并将确保即使通往\
  \ SAN 的某路径完全断开，到存储的连接也能继续。图 26.1 提供了典型 iSCSI SAN 架构的概述。\n\n![Image](img/26fig01.jpg)\n\
  \n**图 26.1** iSCSI SAN 示意概述。\n\n## iSCSI SAN 术语\n\n在 Red Hat Enterprise Linux 7\
  \ 上使用 iSCSI 时，你需要熟悉一些特定术语。表 26.2 介绍了相关的术语。\n\n![Image](img/key_topic.jpg)![Image](img/26tab02.jpg)\n\
  \n**表 26.2** iSCSI 术语\n\n## 设置 iSCSI Target\n\n在不同的 Linux 版本中，使用了不同的 iSCSI 目标包。在\
  \ Red Hat Enterprise Linux 7 中使用了 LIO（Linux I/O）目标。自 Linux 内核 2.6.38 以来，LIO 是标准的\
  \ iSCSI 目标解决方案，因为它在 OpenStack 云中拥有原生支持，已成为一种极具吸引力的存储解决方案，迅速取代了许多 Linux 发行版中的替代 iSCSI\
  \ 目标解决方案。管理 LIO 目标的默认接口是 `targetcli` 命令。该命令使用了熟悉的 Linux 命令，如 `cd`、`ls`、`pwd` 和 `set`\
  \ 来配置目标。\n\n`targetcli` 命令被开发为一个非常直观的命令。与其一起工作就像在目录结构中工作，需要在不同的目录中创建项。它具有出色的命令补全功能以及非常好帮助函数，这使得操作\
  \ iSCSI 目标变得非常直观。\n\n使用 `targetcli` 工具时，你将通过以下步骤来设置目标：\n\n![Image](img/key_topic.jpg)\n\
  \n1. 创建后端存储设备。\n2. 创建 IQN 和默认目标门户组 (TGP)。\n3. 为 TPG 配置一个或多个 ACL。\n4. 创建 LUN 以提供对后端存储设备的访问。\n\
  5. 创建一个门户 (portal)，以提供一个 iSCSI 启动器可以连接的网络接口。\n6. 验证并提交配置。\n\n练习 26.1 将引导你完成使用 `targetcli`\
  \ 设置 iSCSI 目标的步骤。\n\n### 练习 26.1 使用 targetcli 工具设置目标\n\n在此练习中，你将在 server1 上设置一个\
  \ iSCSI 目标。此练习假设在 server1 上你有一个名为 `vgsan` 的 LVM 卷组。在卷组内，你需要空磁盘空间来允许创建两个 LVM 逻辑卷。\n\
  \n1. 在 server1 上打开一个 root shell。输入 `vgs` 以验证 LVM 卷组的名称和可用磁盘空间。如果你没有可用磁盘空间的卷组，应先创建一个卷组。\n\
  2. 输入 `lvcreate -L 200M -n lvsan1 /dev/vgsan` 和 `lvcreate -L 200M -n lvsan2 /dev/vgsan`，为设置\
  \ iSCSI 目标提供所需的后端存储。\n3. 输入 `yum -y install targetcli`。\n4. 输入 `targetcli`。这会打开\
  \ `targetcli` 接口，看起来类似于 shell 提示符。输入 `ls` 显示默认接口（见图 26.2）。\n\n![Image](img/26fig02.jpg)\n\
  \n**图 26.2** targetcli 接口。\n\n5. 设置 iSCSI 目标的第一步是配置后备。输入 `cd /backstores` 进入 targetcli\
  \ 的 backstores 分支，这允许你指定将使用哪个后端存储。\n6. 输入 `block/ create block1 /dev/vgsan/lvsan1`。这把你之前创建的\
  \ LVM 逻辑卷分配为 iSCSI 目标的后端存储。通过输入 `block/ create block2 /dev/vgsan/lvsan2` 对 lvsan2\
  \ 重复。注意命令的工作方式；它以 `block/` 开始，带你进入 `/block` 目录的内容，从那里发布 `create` 命令。还要注意，尽管你使用了\
  \ `create` 命令，但它并没有真正创建后端存储设备；它是将已存在的存储设备分配为后端存储。\n7. 现在让我们也创建一个基于文件的块设备：`fileio/\
  \ create file1 /root/diskfile1 100M`。该命令创建了一个大小为 100 MiB 的稀疏文件并将其分配为后端存储设备。\n8.\
  \ 此时，输入 `ls` 获取当前配置的概述。它应该看起来像图 26.3，向你显示两个块设备和一个基于文件的存储设备。\n\n![Image](img/26fig03.jpg)\n\
  \n**图 26.3** 块后备概述。\n\n9. 现在块后备已经处理好了，你可以开始配置你的 iSCSI 目标的唯一标识符——iSCSI IQN，这将创建默认的\
  \ TGP。要开始，使用 `cd /iscsi/` 进入配置的 iscsi 分支。\n10. 现在输入 `create iqn.2015-04.com.example:target`\
  \ 来创建 IQN。注意 IQN 的名称以年份-月份（YY-MM）开头，随后是反向域名。确保你遵循此命名标准；否则无法创建。\n\n> **提示**: 注意 IQN\
  \ 的命名标准非常严格。例如如果你将月份指定为一位而不是两位，你将收到“WWN 无效”的消息，创建将失败！\n\n11. 输入 `ls`。这显示 iscsi 分支的内容，你现在可以看到你刚刚创建的\
  \ IQN，以及在创建 IQN 时自动创建的 tpg1（见图 26.4）。\n\n![Image](img/26fig04.jpg)\n\n**图 26.4**\
  \ iscsi 概述。\n\n12. 此时，你可以在 TPG 中创建一个 ACL。记住，访问 iSCSI 目标还需要创建 ACL，因为没有 ACL，任何 iSCSI\
  \ 启动器将被拒绝访问。你创建的任何新 LUN 将映射到与 TPG 关联的每个 ACL 上。这是因为默认开启了 `auto_add_mapped_luns` 功能。要创建\
  \ ACL，首先进入刚刚创建的 IQN。输入 `cd iqn.[Tab]`。注意在 `cd` 命令中你使用了 Tab 键进行命令行补全。\n13. 现在输入 `tpg1/acls/\
  \ create iqn.2015-04.com.example:server1`，这创建一个允许 server1 访问你刚刚创建的 IQN 的节点 ACL。在此命令中，使用了\
  \ iSCSI 启动器服务器上 `/etc/iscsi/initiatorname.iscsi` 中的启动器名称。完成此过程后，确保启动器上的此文件内容与之匹配。（更多细节请参见本章稍后的“设置启动器名称”章节。）如果需要，对所有需要访问此\
  \ iSCSI 目标的其他 iSCSI 启动器重复此命令。\n14. 现在你已经创建了 ACL，需要创建 LUN。需要 LUN 将块设备与特定的 TPG 关联起来。要执行此操作，请输入以下命令：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```\ntpg1/luns/ create /backstores/block/block1\n```\n\n\
  ```\ntpg1/luns/ create /backstores/block/block2\n```\n\n```\ntpg1/luns/ create /backstores/fileio/file1\n\
  ```\n\n***\n\n> **提示**\n\n在创建 LUN 时，你可以指定额外的参数。例如，在 `tpg1/luns/` 上文中文中输入 `create\
  \ lun=10 storage_object=/backstores/block/block1` 将 LUN  10 分配给指定的后端存储设备。\n\n***\n\
  \n### 15. 输入 `ls` 来验证你目前创建的内容。结果应该如图 26.5 所示。\n\n![Image](img/26fig05.jpg)\n\n**图\
  \ 26.5** 在创建 LUN 时，配置的 ACL 会自动获得权限。\n\n### 16. 此时，你可以创建端口。这会将 iSCSI 配置连接到 iSCSI\
  \ 目标服务器上的特定 IP 地址。为了使其生效，你需要确保 iSCSI 目标位于固定 IP 地址。如果该 IP 地址为 `192.168.4.210`，则使用的命令为\
  \ `tpg1/portals/ create 192.168.4.210`。注意，只有当你希望 iSCSI 目标仅在特定 IP 地址上提供服务时才需要此步骤。如果你不创建端口，将使用绑定到\
  \ IP 地址 `0.0.0.0` 的默认端口，它代表服务器上所有的 IP 地址。\n\n### 17. 配置已完成。使用 `cd /` 返回配置树根目录并输入\
  \ `ls` 获取配置的完整概览。它应该如图 26.6 所示。现在你可以输入 `exit` 关闭配置界面。这会自动写入配置文件。\n\n![Image](img/26fig06.jpg)\n\
  \n**图 26.6** 验证配置。\n\n***\n\n此时，iSCSI 目标配置已写入，但目标尚未运行。配置被写入文件 `/etc/target/saveconfig.json`。这是一个\
  \ Java JSON 格式的文件，并不是为了直接编辑的。在你保存配置时，iSCSI 目标服务也会自动启动并在指定端口 IP 地址的端口 `3260` 上监听。列表\
  \ 26.1 显示了 JSON 文件的部分内容。\n\n**列表 26.1** 存储在 saveconfig.json 文件中的 iSCSI 目标配置\n\n\
