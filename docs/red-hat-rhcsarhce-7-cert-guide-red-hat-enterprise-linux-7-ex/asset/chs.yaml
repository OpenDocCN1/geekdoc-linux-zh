  \n![Image](img/14tab01.jpg)\n\n**表 14.1** “我掌握这些了吗？”章节与问题映射\n\n1. 下列不是使用 GUID 分区表而非使用\
  \ MBR 分区表的优点？\n\na. 访问目录的速度更快。\nb. 分区可以寻址 8 ZiB 的总容量。\nc. 使用 GUID 分区，会自动创建分区表的备份副本。\n\
