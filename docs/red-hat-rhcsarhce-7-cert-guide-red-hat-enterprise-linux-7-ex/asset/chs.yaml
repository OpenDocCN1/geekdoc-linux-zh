  \n## 第 17 章 配置基础 Apache 服务器\n\n本章涵盖了以下主题：\n\n![Image](img/squf.jpg) 配置基础 Apache\
  \ 服务器\n\n![Image](img/squf.jpg) 理解 Apache 配置文件\n\n![Image](img/squf.jpg) 创建 Apache\
  \ 虚拟主机\n\n本章涵盖了以下 RHCSA 考试目标：\n\n![Image](img/squf.jpg) 没有 RHCSA 考试目标直接与 Apache\
  \ 关\n\n这是此书中唯一一个讨论了未列在 RHCSA 目标中的主题的章节。然而，对于红帽服务器管理员来说，了解如何处理 Apache Web 服务器是非常重要的。在随后的章节中，你将学习如何配置\
  \ SELinux 和安装服务器。如果不知道如何处理 Apache Web 服务，这些主题将很难理解。此外，在第 18 章“管理和理解启动过程”中，你将学习如何在\
  \ RHEL 7 环境中处理服务。了解如何配置像 Apache Web 服务这样的常用服务无疑对这有所帮助。这就是为什么本章解释了 Apache Web 服务器的基础知识。关于\
  \ Apache 服务的更多深入信息，你可以阅读第 33 章“管理高级 Apache 服务”。\n\n### “我掌握这些了吗？”测验\n\n“我掌握这些了吗？”测验可以让你评估自己是应该彻底读完整个章节，还是跳到“考试备习任务”部分。如果你对这些问题的答案或你对这些主题知识的自我评估有疑问，请通读整个章节。表\
  \ 17.1 列出了本章的主要标题以及它们对应的“我掌握这些了吗？”测验问题。你可以在附录 A“‘我掌握这些了吗？’测验和‘复习题’的答案”中找到答案。\n\n\
  ![Image](img/17tab01.jpg)\n\n**表 17.1** “我掌握这些了吗？”章节与问题映射\n\n## 1. 哪个命令安装配置 Apache\
  \ Web 服务器所需的软件包？\n\n\n\na. `yum install httpd`\nb. `yum install web-server`\nc.\
  \ `yum install apache`\nd. `yum install apache2`\n\n## 2. 主 Apache 配置文件的名称是什么？\n\
  \n\n\na. `/etc/httpd/conf/httpd.conf`\nb. `/etc/httpd/httpd.conf`\nc. `/etc/apache2/apache.conf`\n\
  d. `/etc/httpd/default-server.conf`\n\n## 3. Apache 配置文件中的哪个参数用于指定 Apache 从何处提供文档？\n\
  \na. `ServerRoot`\nb. `ServerDocuments`\nc. `DocumentRoot`\nd. `DocumentIndex`\n\
  \n## 4. 主 Apache 配置文件中的哪个参数定义了 Apache 进程查找配置文件的位置？\n\na. `ServerRoot`\nb. `ServerDocuments`\n\
  c. `DocumentRoot`\nd. `DocumentIndex`\n\n## 5. 哪个目录包含主 Apache 配置文件？\n\na. `/etc/httpd`\n\
  b. `/etc/htttpd/conf`\nc. `/etc/httpd/conf.d`\nd. `/etc/httpd/conf.modules.d`\n\n\
  ## 6. 哪个目录包含不同 Apache 模块的配置文件？\n\na. `/etc/httpd`\nb. `/etc/htttpd/conf`\nc. `/etc/httpd/conf.d`\n\
  d. `/etc/httpd/conf.modules.d`\n\n## 7. 哪个目录用于存放从 RPM 安装的配置文件？\n\na. `/etc/httpd`\n\
  b. `/etc/htttpd/conf`\nc. `/etc/httpd/conf.d`\nd. `/etc/httpd/conf.modules.d`\n\n\
  ## 8. 哪种虚拟主机类型允许你在同一个 IP 地址上运行多个虚拟主机？\n\na. `NameBased`\nb. `IPBased`\nc. `ConfigurationBased`\n\
  d. `Default`\n\n## 9. 哪行用于开始定义监听当前服务器上所有 IP 地址 80 端口的虚拟主机？\n\na. `<VirtualHost *:80>`\n\
  b. `<VirtualHost *>`\nc. `<NameHost *:80`\nd. `<NameHost *>`\n\n## 10. 关于虚拟主机的陈述中哪一个是不正确的？\n\
  \na. 当通过 httpd 进程提供虚拟主机时，默认配置不再起。\nb. 虚拟主机的名称必须通过 `/etc/hosts` 或 DNS 解析。\nc. 要使用虚拟主机，必须安装\
  \ `mod_virt` 软件包。\nd. 虚拟主机配置可以在 `httpd.conf` 中指定。\n\n### 基础主题\n\n#### 配置基础 Apache\
  \ 服务器\n\n配置基础 Apache 服务器并不难。它由几个简单的步骤组成：\n\n1. 安装所需的软件。\n2. 识别主配置文件。\n3. 创建一些 Web\
  \ 服务器内容。\n\n##### 安装所需的软件\n\nApache 服务器通过一些不同的软件包提供。基础包是 `httpd`；此包包含了运行但基础的 Web\
  \ 服务器所需的所有内容。还有一些额外的包，如。要获取完整概述，你可以使用 `yum search http` 命令并使用 `yum install httpd`\
  \ 安装基础包。\n\n注意，`yum search http` 命令提供了许多软件包。这是因为 Apache Web 服务器是模块化的，不同的模块通过额外的\
  \ yum 软件包提供。\n\n除了使用单独的软件包，你还可以使用 yum 组。`yum groups list` 命令提供了可用 yum 组的概述，Basic\
  \ Web Server 组提供了安装 Apache Web 服务器及其核心所需的所有内容。使用 `yum groups install “Basic Web\
  \ Server” 进行安装。\n\n##### 识别主配置文件\n\nApache 服务器的配置涉及不同的配置文件。本章后面的“理解 Apache 配置文件”节提供了这些文件组织方式的概述。主\
  \ Apache 配置文件是 `/etc/httpd/conf/httpd.conf`。在该节中，指定了许多参数。设置基础 Web 服务器时最重要的参数是 `DocumentRoot`。该参数指定了\
  \ Apache Web 服务器查找其内容的默认位置。\n\n\n\n\n\n另一个重要的配置参数是 `ServerRoot`。它定义了 Apache 查找配置文件的默认目录。默认情况下使用\
  \ `/etc/httpd` 目录用于此目的，但也可以使用备用目录。你会发现 `httpd.conf` 中引用了许多其他配置文件。使用额外的配置文件使得应用程序可以安装从\
  \ RPM 软件包中由 Apache 服务器包含的插拔式文件。这些配置文件的名称都是相对于 `ServerRoot` `/etc/httpd` 的。\n\n列表\
  \ 17.1 显示了 `httpd.conf` 配置文件的部分内容。\n\n**列表 17.1** `/etc/httpd/conf/httpd.conf` 配置文件的部分内容\n\
  \n点击此处查看代码图像\n\n***\n\n```bash\nroot@server1 ~]# cat /etc/httpd/conf/httpd.conf\
  \ | grep -v '#'\n\nServerRoot \"/etc/httpd\"\n\nListen 80\n\nInclude conf.modules.d/*.conf\n\
  \nUser apache\n\nGroup apache\n\nServerAdmin root@localhost\n\n<Directory />\n \
  \   AllowOverride none\n    Require all denied\n</Directory>\n\nDocumentRoot \"\
  /web\"\n\n<Directory \"/var/www\">\n    AllowOverride None\n    Require all granted\n\
  </Directory>\n\n<Directory \"/web\">\n    Options Indexes FollowSymLinks\n    AllowOverride\
  \ None\n    Require all granted\n</Directory>\n\n<IfModule dir_module>\n    DirectoryIndex\
  \ index.html\n</IfModule>\n\n<Files \".ht*\">\n    Require all denied\n</Files>\n\
  \nErrorLog \"logs/error_log\"\n\nLogLevel warn\n\n<IfModule log_config_module>\n\
  \    LogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-\n\
  \      Agent}i\\\"\" combined\n    LogFormat \"%h %l %u %t \\\"%r\\\" %>s %b\" common\n\
  \    <IfModule logio_module>\n        LogFormat \"%h %l %u %t \\\"%r\\\" %>s %b\
  \ \\\"%{Referer}i\\\" \\\"%{User-\n          Agent}i\\\" %I %O\" combinedio\n  \
  \  </IfModule>\n    CustomLog \"logs/access_log\" combined\n</IfModule>\n\n<IfModule\
  \ alias_module>\n    ScriptAlias /cgi-bin/ \"/var/www/cgi-bin/\"\n</IfModule>\n\n\
  <Directory \"/var/www/cgi-bin\">\n    AllowOverride None\n    Options None\n   \
  \ Require all granted\n</Directory>\n\n<IfModule mime_module>\n    TypesConfig /etc/mime.types\n\
  \    AddType application/x-compress .Z\n    AddType application/x-gzip .gz .tgz\n\
  \    AddType text/html .shtml\n    AddOutputFilter INCLUDES .shtml\n</IfModule>\n\
  \nAddDefaultCharset UTF-8\n\n<IfModule mime_magic_module>\n    MIMEMagicFile conf/magic\n\
  </IfModule>\n\nEnableSendfile on\n\nIncludeOptional conf.d/*.conf\n```\n\n***\n\n\
  #### 创建 Web 服务器内容\n\n识别 Web 服务器的 `DocumentRoot` 后，你就掌握了配置基础 Web 服务器所需的所有信息。Apache\
  \ Web 服务器默认查找名为 `index.html` 的文件，并向使用浏览器访问 Web 服务器的客户端展示该文档的内容。只需为该文件配置非常基础的内容即可；只需一行“Welcome\
  \ to my web server”即可。\n\n要测试 Web 服务器，你可以启动浏览器。RHEL 7 的所有图形化安装默认都安装了 Firefox 浏览器。如果你的服务器没有运行图形界面，请使用\
  \ `yum install elinks` 安装基于文本的 elinks 浏览器。该浏览器不允许你加载复杂的网页，但它允许你验证 Web 服务器的正常工作。图\
  \ 17.1 显示了 elinks 界面的样例。在练习 17.1 中，你将学习如何设置基础 Web 服务器。\n\n![Image](img/17fig01.jpg)\n\
  \n**图 17.1** 使用 elinks 从纯文本控制台测试网页。\n\n***\n\n#### 练习 17.1 设置基础 Web 服务器\n\n在此项练习中，你将学习如何设置基础的\
  \ Apache Web 服务器。没有什么复杂的，仅足够让你开始运行并测试 Web 服务器的功能。\n\n1. 输入 `yum groups install “Basic\
  \ Web Server”。这会安装 `httpd` 软件包以及一些最常用的额外软件包。\n2. 使用编辑器打开 Apache 主配置文件，查找以 `DocumentRoot`\
  \ 开头的行。这确定了 Apache 服务器查找其服务内容的位置。确认其已设置为 `/var/www/html`。\n3. 在 `/var/www/html`\
  \ 目录下，创建一个名为 `index.html` 的文件。在该文件中，输入“Welcome to my web server”。\n4. 要启动并启用 Web\
  \ 服务器，输入 `systemctl start httpd; systemctl enable httpd`。这会启动 Web 服务器并确保它在重启服务器后自动启动。使用\
  \ `systemctl status httpd` 检查 Web 服务器是否正在运行。在列表 17.2 中，你可以看到该命令的结果。\n5. 输入 `yum\
  \ install elinks` 安装 elinks 文本浏览器。输入 `elinks http://localhost` 连接到 Web 服务器并验证其运行正常。\n\
  \n***\n\n#### 列表 17.2 使用 `systemctl` 验证 Web 服务器的可用性\n\n点击此处查看代码图像\n\n***\n\n```bash\n\
  root@server2 ~]# systemctl status httpd\n\nhttpd.service - The Apache HTTP\n   Loaded:\
  \ loaded (/lib/systemd/system/httpd.service; disabled)\n   Active: active (running)\
  \ since Sat 2015-05-16 04:27:49 PDT; 1s\n   Main PID: 42997 (httpd)\n      Status:\
  \ \"Processing requests...\"\n   CGroup: system.slice/httpd\nMay 16 04:27:49 server2.com\
  \ systemd[1]: Started The Apache HTTP Server.\n```\n\n***\n\n#### 理解 Apache \n\n\
  Web 服务器的默认安装会在 `/etc/httpd` 中创建一个相对复杂的配置树。列表 17.3 显示了该目录的默认内容。注意，如果安装了额外软件，你的服务器上的目录内容可能有所不同。\n\
  \n**列表 17.3** `/etc/httpd` 的默认内容\n\n点击此处查看代码图像\n\n***\n\n```bash\nroot@server1 httpd]#\
  \ \\ls -l\n\ntotal 8\n\ndrwxr-xr-x. 2 root 35 Feb 23 03:12 conf\ndrwxr-xr-x. 2 root\
  \ 4096 Feb 25 12:41 conf.d\ndrwxr-xr-x. 2 root 4096 Feb 25 12:41 conf.modules.d\n\
  lrwxrwxrwx. 1 root root 19 Feb 17 13:26 logs -> ../../var/log/httpd\nlrwxrwxrwx.\
  \ 1 root root 29 Feb 17 13:26 modules -> ../../usr/lib64/\nhttpd/modules\nlrwxrwxrwx.\
  \ 1 root root 10 Feb 17 13:26 run -> /run/httpd\n```\n\n***\n\n你首先注意到的是指向日志、模块和运行目录的三个符号链接。这些创建是为了允许\
  \ Apache 在 chroot 环境中启动。\n\n![Image](img/key_topic.jpg)\n\nchroot 环境提供了一个虚拟根目录。这是文件系统中的一个目录，被呈现为在\
  \ chroot 环境中运行进程的根目录。这样做是为了安全：在 chroot 环境中运行的进程只能访问该环境中的文件，这降低了当入侵者成功利用 Web 服务器身份获取登录\
  \ Shell 并尝试遍历文件系统进行未经授权的操作时发生安全事件的风险。\n\n\n\n\n\nApache 服务器的主要配置文件位于 `/etc/httpd/conf`\
  \ 目录。首先，有一个 `httpd.conf` 文件，它包含了最重要的配置参数。此外，还有一个名为 `magic` 的文件。该文件被浏览器用于解释如何解析 Web\
  \ 服务器的内容。它确保了 Web 服务器的内容在不同的浏览器中都能正确显示。\n\n`/etc/httpd/conf.d` 目录包含包含在 Apache 配置中的文件。这是通过\
  \ `httpd.conf` 文件中的 `Include conf.modules.d/*.conf` 这一行实现的。该目录可以被包含 Apache 插件文件的\
  \ RPM 软件包使用。与 `ServerRoot` 的情况类似，这种方法使得在不更改 `/etc/httpd/conf/httpd.conf` 文件内容的情况下，添加定义不同网页的配置文件成为可能。\n\
  \n最后一个配置目录是 `/etc/httpd/conf.modules.d`。Apache 是一个模块化的 Web 服务器。因此，可以通过添加启用许多不同功能的额外模块来扩展\
  \ Apache 服务器的功能。如果使用了模块，它们可以使用自己的特定模块的配置文件，这些文件会被放置在 `/etc/httpd/conf.modules.d`\
  \ 目录中。再次，这种方法的目的是尽可能保持 `/etc/httpd/conf.d/httpd.conf` 中的配置整洁，并确保在更新 Apache 通用配置时不会覆盖模块特定的配置。\n\
  \n## 创建 Apache 虚拟主机\n\n许多公司托管了多个网站。幸运的是，没有必要为你每个想要运行的网站安装一个新的 Apache 服务器。Apache\
  \ 可以配置为与虚拟主机协同工作。虚拟主机是为唯一主机名创建的特定 Apache 配置。在使用虚拟主机时，访问主机的程序大致如下：\n\n1. 客户端启动特定虚拟主机的会，通常是通过启动浏览器并输入客户端想要使用的网站\
  \ URL。\n2. DNS 帮助解析虚拟主机的 IP 地址，该地址是能够托管不同虚拟主机的 Apache 服务器 IP。\n3. Apache 进程接收其所托管的所有虚拟主机的请求。\n\
  4. Apache 进程读取 HTTP 头以分析此请求需要转发到哪个虚拟主机。\n5. Apache 读取特定的虚拟主机配置文件，以找到该特定虚拟主机使用的文档根（document\
  \ root）。\n6. 请求被转发到该文档根中相应的内容文件。\n\n在使用虚拟主机时，有几点需要注意：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 如果你的 Apache 服务器配置了虚拟主机，则它托管的所有服务器都应该由虚拟主机处理。为了给所有指向此主机但没有特定虚拟主机文件的\
  \ HTTP 请求创建一个默认捕获项，你可以为 `default_:80` 创建一个虚拟主机。\n\n![Image](img/squf.jpg) 基于名的虚拟主机是最常见的解决方案。在这种解决方案中，虚拟主机使用不同的名称但相同的\
  \ IP 地址。\n\n![Image](img/squf.jpg) 基于 IP 的虚拟主机不太常见，但如果必须将 Web 服务器名称解析为唯一的 IP 地址，则需要它们。基于\
  \ IP 的虚拟主机确实需要在同一机器上有多个 IP 地址，并在 Apache 服务器使用 TLS 安全连接的配置中很常见。\n\n**提示**\n配置虚拟主机不是\
  \ RHCSA 的目标，但了解如何配置它们仍然是有用的。如果你正在准备 RHCE 考试，你绝对需要知道如何配置虚拟主机。练习 17.2 将引导你完成该过程。如果你只对\
  \ RHCSA 考试相关的内容感兴趣，欢迎跳过此练习。\n\n## 练习 17.2 安装 Apache 虚拟主机\n\n在此练习中，你创建两个虚拟主机。为了帮助你设置虚拟主机，你首先设置名称解析，之后再创建虚拟主机配置。由于还没有讨论\
  \ SELinux，你将临时关闭 SELinux。\n\n**注意**\n我稍后会告诉你，你不应该永远关闭 SELinux。这一次，我对这条重要的安全规则破了例。为了专注于\
  \ Apache Web 服务器上需要做的工作，只关注 Apache 而不同时配置 SELinux 会更简单。\n\n1. 在 `server1` 和 `server2`\
  \ 上，使用编辑器打开 `/etc/hosts` 文件并添加两行，以便将你要创建的虚拟主机名称解析到虚拟机的 IP 地址：\n\n点击此处查看代码图像\n\n\
  ```\n192.168.122.210     server1.example.com          server1\n192.168.122.220 \
  \    server2.example.com          server2\n192.168.122.210     account.example.com\
  \         account\n12.168.122.210      sales.example.com           sales\n```\n\n\
  2. 在 `server1` 上，打开 root shell 并将以下内容添加到 `/etc/httpd/conf/httpd.conf` 文件中。（你可以保留所有其他设置。）\n\
  \n点击此处查看代码图像\n\n```xml\n<Directory/www/docs>\n          Required all granted\n \
  \         AllowOverride None\n</Directory>\n```\n\n3. 在 `server1` 上，打开 root shell\
  \ 并在 `/etc/httpd/conf.d` 目录下创建一个名为 `account.example.com.conf` 的配置文件。给该文件提供以下内容：\n\
  \n点击此处查看代码图像\n\n```xml\n<VirtualHost *:80>\n          ServerAdmin webmaster@account.example.com\n\
  \          DocumentRoot /www/docs/account.example.com\n          ServerName account.example.com\n\
  \          ErrorLog logs/account/example.com-error_log\n          CustomLog logs/account/example.com-access_log\
  \ common\n</VirtualHost>\n```\n\n4. 关闭配置文件，并在 root shell 中使用 `mkdir -p /www/docs/account.example.com`。\n\
  \n5. 在 account 文档根中创建一个名为 `index.html` 的文件，并确保其内容为“Welcome to account.”。\n6. 使用\
  \ `setenforce 0` 临时关闭 SELinux。\n\n7. 使用 `systemctl restart httpd` 重启 Apache Web\
  \ 服务器。\n8. 使用 `elinks http://account.example.com`。你现在应该看到 account 欢迎页。（你可能需要使用 `yum\
  \ install -y elinks` 来安装 elinks。）\n9. 回到 root shell，将 `/etc/httpd/conf.d/account.example.com.conf`\
  \ 文件复制到名为 `/etc/httpd/conf.d/sales.example.com.conf` 的文件中。\n10. 用 vi 打开 `sales.example.com.conf`\
  \ 文件，并使用 vi 命令 `:%s/account/sales/g`。这将把所有的 account 替换为文本 sales。\n11. 创建 `/www/docs/sales.example.com`\
  \ 文档根，并在其中创建一个文件 `index.html`，包含文本“Welcome to the sales server.”。\n12. 重启 `httpd`\
  \ 并验证 account 和 sales 服务器均可访问。\n\n#### 总结\n在本章中，你学习了 Apache 基础知识。本章的信息帮助你配置基础 Apache\
  \ Web 服务器，有助于测试书中后续章节介绍的防火墙配置或 SELinux 配置等高级主题。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\
