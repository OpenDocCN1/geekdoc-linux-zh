  \n#### 实验 19.1\n1. 重启服务器并在相应的故障排除模式下更改 root 密码。\n2. 在 `/etc/fstab` 中更改一个设备名称，以便在下次重启时无法挂载该文件系统。重启并修复你遇到的问题。\n\
  3. 使用救援光盘从救援盘以完全故障排除模式启动你的服务器。\n4. 重新创建 `initramfs`。\n\n## 第 20 章 使用 Kickstart\n\
  \n**本章涵盖了以下主题：**\n\n![Image](img/19tab03.jpg) 设置安装服务器\n![Image](img/19tab03.jpg)\
  \ 为 PXE 启动设置 TFTP 和 DHCP 服务器\n![Image](img/19tab03.jpg) 创建 Kickstart 文件\n\n**本章涵盖了以下\
  \ RHCSA 考试目标：**\n\n使用 Kickstart 自动安装 Red Hat Enterprise Linux\n\n在本章中，你学习了如何使用 Kickstart\
  \ 自动安装 RHEL 7。Kickstart 本身很容易理解和配置：它是安装程序使用的配置文件，用于指定具体如何执行安装（这也是 RHCSA 目标所指的）。\n\
  \n\n\n\n\n在一个仍然通过光盘进行安装的环境中使用 Kickstart 并不十分有用，这就是为什么在这一章中，你将学习如何设置一个完整的环境：其中，一个安装服务器提供所用存储库的访问，并配置\
  \ PXE 启动服务器以提供用于启动全自动安装的启动镜像的访问。这可能远超 RHCSA 的目标，但至少它能为你提供有用的信息，你可以利用这些信息来搭建全自动安装环境。\n\
