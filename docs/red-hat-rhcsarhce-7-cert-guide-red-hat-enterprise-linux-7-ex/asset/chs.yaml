  \ `/manual` Web 页面。\n\n## 第 18 章 管理和理解启动过程\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg)\
  \ 与 Systemd 一起工作\n\n![Image](img/squf.jpg) 与 GRUB 2 一起工作\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\
