  To verify the configuration of the network address, you need to use the `ip` utility.\
  \ The `ip` utility is a modern utility that can consider advanced networking features\
  \ that have been introduced recently. With the `ip` utility, many aspects of networking\
  \ can be monitored:\n\n![Image](img/squf.jpg) Use `ip addr` to configure and monitor\
  \ network addresses\n\n![Image](img/squf.jpg) Use `ip route` to configure and monitor\
  \ routing information\n\n![Image](img/squf.jpg) Use `ip link` to configure and monitor\
  \ network link state\n\nApart from these items, the `ip` utility can manage many\
  \ other aspects of networking, but you do not need to know about them for the RHCSA\
  \ exam.\n\n***\n\n### Warning\n\nIn earlier Linux versions, and some other UNIX-like\
  \ operating systems, the `ifconfig` utility was and is used for validating network\
  \ configuration. Do not use this utility on modern Linux distributions. Because\
  \ Linux has become an important player in cloud computing, networking has evolved\
  \ a lot to match cloud computing requirements, and many new features have been added\
  \ to Linux networking. With the `ifconfig` utility, you cannot manage or validate\
  \ these concepts.\n\n***\n\nTo show current network settings, you can use the `ip\
  \ addr show` command (which can be abbreviated as `ip a s` or even as `ip a`). The\
  \ `ip` command is relatively smart and does not always require you to type the complete\
  \ option.\n\nThe result of the `ip addr show` command looks as in Listing 8.1\n\n\
  **Listing 8.1** Monitoring Current Network Configuration with `ip addr show`\n\n\
  Click here to view code image\n\n```bash\n[root@server2 ~]# ip a\n\n1: lo: <BACKBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN\n    link/loopback 00:00:00:00:00:00 brd\
  \ 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n        valid_lft forever\
  \ preferred_lft forever\n    inet6 ::1/128 scope host\n        valid_lft forever\
  \ preferred_lft forever\n2: eno16777736: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500\
  \ qdisc\n    pfifo_fast state UP qlen 1000\n    link/ether 00:0c:29:b8:8c:eb brd\
  \ ff:ff:ff:ff:ff:ff\n    inet 192.168.4.220/24 brd 192.168.4.255 scope global eno16777736\n\
  \        valid_lft forever preferred_lft forever\n    inet6 fe80::20c:29ff:feb8:8ceb/64\
  \ scope link\n        valid_lft forever preferred_lft forever\n```\n\nIn the result\
  \ of this command, you see a listing of all network interfaces in your computer.\
  \ You’ll normally see at least two interfaces, but on specific configurations, there\
  \ can be many more interfaces. In Listing 8.1, two interfaces are shown: the loopback\
  \ interface `lo`, and the onboard Ethernet card `eno167777736`. The important part\
  \ of the output of the command is for the onboard Ethernet card. The command shows\
  \ the following items about its current status:\n\n![Image](img/squf.jpg) **Current\
  \ state:** The most important part of this line is the text `state UP`, which shows\
  \ that this network card is currently up and available.\n\n![Image](img/squf.jpg)\
  \ **MAC address configuration:** This is the unique MAC address that is set for\
  \ every network card. You can see the MAC address itself (`00:0c:29:b8:8c:eb`),\
  \ as well as the corresponding broadcast address.\n\n![Image](img/squf.jpg) **IPv4\
  \ configuration:** This line shows the IP address that is currently set, as well\
  \ as the subnet mask that is used. You can also see the broadcast address that is\
  \ used for this network configuration.\n\n![Image](img/squf.jpg) **IPv6 configuration:**\
  \ this line shows the current IPv6 address and its configuration.\n\nIf you are\
  \ just interested in the link state of the network interfaces, you can use the `ip\
