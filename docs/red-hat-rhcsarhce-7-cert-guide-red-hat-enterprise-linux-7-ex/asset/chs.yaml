  **d.** `nmcli`\n\n### 基础主题\n\n#### 网络基础\n网络是现代服务器上最基本的项目之一。在 RHEL 7 中，网络由 `NetworkManager`\
  \ 服务管理，并且随着 RHEL 7 的发布，引入了一些完全全新的工具来帮助管理网络。如果你已经在之前的 RHEL 版本中处理过网络相关工作，你将会注意到网络配置在\
  \ RHEL 7 中发生了巨大变化，并且某些在较早版本中作为默认的方法将不再可用。\n\n为了建立网络，每个节点都需要一个地址。在本章中，我们使用 IPv4 地址。通常，我们使用像\
  \ 192.168.4.17/26、192.168.4.94/26、192.168.4.97/26 或 192.168.4.120/26 这样的 IP 地址。为了建立网络，通常使用了路由器。\n\
  \n![Image](img/08tab01.jpg)\n\n**表 8.1** “我已经掌握这些内容了吗？”章节与习题映射\n\n#### IP 地址\n为了连接互联网，每台计算机都需要一个地址。因为\
  \ IP 地址是稀缺的，理论上只有几十亿个，这不足以为每个设备提供地址。IPv6 是该问题的终极解决方案，因为可以创建大量的地址。尽管许多网络仍在使用 IPv4，但还有另一种解决方案：私有地址。\n\
  \n私有地址是供内部网络使用的地址。为了这个目的，创建了一些 IP 网络地址：\n\n![Image](img/08tab01.jpg)\n\n![Image](img/08tab01.jpg)\
  \ 10.0.0.0/8 (单个 A 类网络)\n\n![Image](img/08tab01.jpg) 172.16.0.0/12 (16 个 B 类网络)\n\
  \n![Image](img/08tab01.jpg) 192.168.0.0/16 (C 类网络)\n\n当使用私有地址时，使用这些地址的节点无法访问互联网，互联网上的节点也无法轻松访问它们。因为这不方便，经常使用网络地址转换（NAT）。在\
  \ NAT 中，节点使用私有 IP 地址，但在访问互联网时，该私有 IP 地址会被替换为 NAT 路由器的地址。因此，互联网上的节点认为它们正在与 NAT 路由器通信，而不是单个主机。\n\
  \nNAT 路由器本身使用表来跟踪所有现有连接。NAT 使用非常常见；它嵌入在大多数家庭和小企业网络路由器中，将网络中的计算机和其他设备连接到互联网。\n\n\
  #### IPv6 地址\nIPv6 地址可能像 `fe80::225:90ff:fe23:899`。在 IPv6 地址中，某些组件可能包含前零。多个 `0000`\
  \ 序列可以写为 `::`，正如你在这个 IPv6 地址示例所示。通过使用 IPv6 地址，可以对大量节点进行编号，这就是为什么 IPv6 地址正在慢慢引入到当前网络配置中。\n\
  \n##### 子网掩码\n\n\n\n\n\n为了确定计算机属于哪个网络，会使用子网掩码。子网掩码定义了网络地址中哪部分表示网络，哪部分表示节点。网络掩码可以使用无分类域间网域路由\
  \ (`CIDR`) 表示法写入，也可以使用经典表示法，并且它们总是需要与网络地址一起指定。例如 `192.168.10.100/24`，表示使用了 24 位的网络地址；而\
  \ `192.168.10.100/255.255.255.0` 则表示完全相同的意思。\n\n通常，网络掩码使用多个字节。在示例 `192.168.10.100/24`\
  \ 的示例中，前三个字节（即 `192.168.10` 部分）形成网络部分，最后部分（数字 `100`）是该网络上的主机部分。\n\n在谈到网络地址时，你同样使用一个\
  \ 4 字节数字，其中节点地址设置为 `0`。因此，在 `192.168.10.100/24` 的示例中，网络地址是 `192.168.10.0`。在 `IPv4`\
  \ 网络中也始终有一个广播地址。这是一个可以用于标识网络中所有节点的地址。在广播地址中，所有节点位都设置为 `1`，如果指的是整个字节，则十进制数字为 `255`。因此，在地址\
  \ `192.168.10.100/24` 的示例中，广播地址是 `192.168.10.255`。\n\n### 二进制表示法\n\n由于 `IPv4` 地址的数量有限，现代\
  \ `IPv4` 网络使用了变长网络掩码。这些是如 `212.209.113.33/27` 这样的网络掩码。在变长子网掩码中，只有字节的一部分被用于标识节点，另一部分用于标识网络。在子网掩码\
  \ `/27` 中，最后一个字节的前 `3` 位用于标识网络，后 `5` 位用于标识节点。如果你用二进制表示法写下地址，这一点会变得更加清晰：\n\n**IP\
  \ 地址：**\n\n点击此处查看代码图像\n\n```\n212.209.113.33 = 11010100.11010001.00001010.00100001\n\
  ```\n\n**子网掩码：**\n\n点击此处查看代码图像\n\n```\n/27 = 11111111.11111111.11111111.11100000\n\
  ```\n\n当将子网掩码应用到 IP 地址时，你可以看到 IP 地址的前 `3` 位属于网络，因此网络是 `0010000`。如果你使用二进制计算器，な可以看到它对应于十进制\
  \ IP 地址 `32`。使用 `/27` 子网掩码允许创建多个网络。`表 8.2` 提供了概述。\n\n![Image](img/key_topic.jpg)![Image](img/08tab02.jpg)\n\
  \n**表 8.2 二进制-十进制转换**\n\n所以，如果你根据这些信息再次考虑 IP 地址 `212.209.113.33/27`，你可以看到它属于网络 `212.209.113`，并且在该网络中的广播地址（其\
  \ IP 地址的节点部分设置为所有 `1`）是 `212.209.113.63`，因此使用 `/27` 子网掩码可以对址节点。你会得到 `32` 个 IP 地址，但其中两个是网络地址和广播地址，不能作为主机地址。在\
  \ RHCSA 考试中不需要进行这种计算，但它有助于理解 IP 址的工作原理。\n\n### MAC 地址\n\nIP 地址是允许节点通信到互联网上任何其他节点的地址。然而，它们并不是唯一使用的地址。每个网卡也有一个地址，被称为\
  \ `MAC` 地址。`MAC` 地址用于本地网络（即本地电缆或本地无线局域网，直到遇到第一个路由器）；它们不能用于不同网络之间的通信。它们帮助找到 IP 地址所所属的特定网卡。\n\
  \n### 协议和端口\n\nIP 地址用于标识节点，这很有用，但标识节点并不是全部。节点之所以有用，是因为它们在网络上提供特定的服务，例如 Web 服务器或邮件服务器。为了识别这些服务，使用了地址。每个服务都有特定的端口，例如用于超文本传输协议\
  \ (`HTTP`) 的 `80` 端口，或用于安全外壳 (`SSH`) 的 `22` 端口，在网络通信中，发送者和接收者使用端口地址。因此，网络通信中涉及目的端口地址和源端口地址。\n\
  \n由于并不是所有服务都以类似的方式标识，在 IP 地址和端口地址之间使用了特定的 `协议`。\n\n#### 管理地址和接口\n\n作为 Linux 管理员，你需要管理网络地址和接口。网络地址可以通过两种方式分配：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/08tab02.jpg) 这种方式适用于：\n\n![Image](img/squf.jpg)\
  \ **固定 IP 地址：** 适用于始终需要可用的服务器。\n\n![Image](img/squf.jpg) **动态分配 IP 地址：** 适用于云环境中的实例。要动态分配\
  \ IP 地址，通常使用动态主机配置协议 (`DHCP`) 服务器。\n\n在长期以来，Linux 中的网卡一直拥有默认，如 `eth0`、`eth1` 和 `eth2`。这种命名是根据网卡的检测顺序的。因此，`eth0`\
  \ 是第一个检测到的网卡，`eth1` 是第二个，依此类推。这在节点只有两个网卡的情况下运行良好。\n\n在 RHEL 7 中，网卡的默认名称基于固件、设备拓扑和设备类型。这导致网络名称由以下部分组成：\n\
  \n![Image](img/squf.jpg) 以太网接口以 `en` 开始，无线局域网接口以 `wl` 开始，WWAN 接口以 `ww` 开始。\n\n这种命名中，名称的下一部分代表适配器的类型。`o`\
  \ 用于板载，`s` 用于热插槽，`p` 用于 PCI 位置。管理员也可以使用 `x` 根据网卡的 `MAC` 地址创建设备名称。\n\n![Image](img/squf.jpg)\
  \ 随后是一个数字，用于表示索引、ID 或端口。\n\n![Image](img/squf.jpg) 如果无法确定固定名称，则使用传统名称如 `eth0`。\n\
  \n根据这些信息，可以使用如 `eno1677734` 这样的设备名称，它代表具有唯一索引的板载以太网设备。\n\n除了这种默认设备命名，网卡也可以基于 BIOS\
  \ 设备命名。在这种命名中，名称如 `em1`（嵌入网卡 1）或 `p4p1`（即 PCI 插槽 4，端口 1）。使用这种命名必须安装 `biosdevname`\
