  \ GRUB 启动提示符中移除哪些启动选项？（选两个）\n   a. `rhgb`\n   b. `logo`\n   c. `quiet`\n   d. `silent`\n\
  \n6. **6.** 你想进入尽可能少服务的最小化排查模式。你应该使用哪个启动参数？\n   a. `systemd.unit=break.target`\n\
  \   b. `systemd.unit=emergency.target`\n   c. `systemd.unit=rescue.target`\n   d.\
  \ `1`\n\n7. **7.** 以下哪些情况只能通过使用救援磁盘解决？\n   a. 内核停止加载。\n   b. initramfs 停止加载。\n \
  \  c. 永远进入 GRUB 2 启动提示符。\n   d. 提示输入维护模式的 root 密码。\n\n8. **8.** 你进入了故障模式，且磁盘是只读的。你应该怎么办？\n\
  \   a. 重启故障模式并向内核传递 `rw` 启动选项。\n   b. 使用 `rd.break` 启动参数手动进入 initramfs 模式。\n   c.\
  \ 使用 `mount -o remount,rw /`\n   d. 使用 `mount /`\n\n9. **9.** 你的服务器在启动时仅显示闪烁的光标。没有\
  \ GRUB 2 菜单。解决此问题的第一步是什么？\n\n\n\n\n\na. 从救援磁盘尝试从本地磁盘启动的选项。\n\nb. 启动救援环境并重新安装 GRUB。\n\
  \nc. 启动救援环境并重新创建 initramfs。\n\nd. 使用 `rd.break` 启动参数。\n\n[10]. 在恢复虚拟机的访问权限时，你需要让镜像文件存储设备可用。假设镜像文件的名称为\
  \ `/home/user/lab1.img`，以下哪个命令可以实现此操作？\n\na. `partx -ax /home/user/lab1.img`\nb.\
  \ `kpartx -ax /home/user/lab1.img`\nc. `kpartx -av /home/user/lab1.img`\nd. `partx\
  \ -av /home/user/lab1.img`\n\n### 基础主题\n\n## 理解 RHEL 7 启动过程\n\n要修复启动问题，充分理解启动过程非常重要。如果在启动过程中出现问题，你需要能够判断问题发生在启动过程的哪个阶段，以便选择合适的工具来修复问题。\n\
  \n以下步骤总结了 Linux 启动过程是如何发生的。\n\n![Image](img/key_topic.jpg)\n\n1. **执行自检 (POST)：**\
  \ 开启电源。从系统固件（可以是现代的统一扩展固件接口 `UEFI` 或经典的基本输入输出系统 `BIOS`）执行上电自检 (POST)，并初始化启动系统所需的硬件。\n\
  2. **选择启动设备：** 从 UEFI 启动固件或主引导记录 (MBR) 定可启动设备。\n3. **加载引导程序：** 从可启动设备中找到引导程序。在 Red\
  \ Hat 上，这通常是 GRUB 2。\n4. **加载内核：** 引导程序可能会向用户显示启动菜单，或者可以配置为自动启动默认操作系统。要加载 Linux，内核将与\
  \ `initramfs` 一起加载。`initramfs` 包含了启动所需的所有硬件内核模块，以及继续进入下一个启动阶段所需的初始脚本。在 RHEL 7 上，`initramfs`\
  \ 包含一个完整的操作系统（可能用于故障排除目的）。\n5. **启动 /sbin/init：** 一旦内核加载到内存中，就会加载第一个进程，但仍然来自 `initramfs`。这是\
  \ `/sbin/init` 进程，它在 Red Hat 上链接到 `systemd`。还会加载 `udev` 守护进程以处理进一步的硬件初始化。这一切仍然是从\
  \ `initramfs` 镜像进行的。\n6. **处理 initrd.target：** `systemd` 进程执行 `initrd.target` 中的所有单元，这准备出一个最小操作系统环境，并将磁盘上的根文件系统挂载到\
  \ `/sysroot` 目录。此时，已经加载了足够的信息传递给写入硬盘的系统安装。\n7. **切换到根文件系统：** 系统切换到磁盘上的根文件系统，此时可以从磁盘加载\
  \ systemd 进程。\n8. **运行默认目标：** `systemd` 寻找要执行的默认目标并运行所有的单元。在此过程中，显示登录界面，用户可以进行身份验证。注意，登录提示可以在所有\
  \ systemd 单元文件加载之前出现。因此，看到登录提示并不意味着你的服务器已完全运行。\n\n在列出的每个阶段中，都可能因为配置错误或其他问题发生故障。表\
  \ 19.2 总结了特定阶段在何处配置以及当出现问题时你可以做什么。\n\n![Image](img/key_topic.jpg)![Image](img/19tab02.jpg)\n\
  \n**表 19.2 启动阶段配置与故障排除**\n\n> 故障排除一直是 RHCSA 考试的一部分。如果你遇到问题，请确保你能够识别它发生在启动过程的哪个阶段，并在下一节中了解如何修复它以应用不同的故障排除技术。\n\
  \n## 传递内核启动参数\n\n如果你的服务器没有正常启动，GRUB 启动提示符提供了一种方便的方法停止启动过程并在启动时向内核传递特定选项。在本节中，你将学习如何访问提示符以及如何向内核传递特定参数。\n\
  \n### 访问启动提示符\n\n当服务器启动时，你会简短看到 GRUB 2 菜单。动作要快，因为它只会持续几秒。从此启动菜单，你可以输入 `e` 进入可以编辑命令的模式，或输入\
  \ `c` 进入完整的 GRUB 命令提示符。要向启动的内核传递启动选项，请使用 `e`。\n\n![Image](img/19fig01.jpg)\n**图\
  \ 19.1 进入 GRUB 启动提示符。**\n\n在 GRUB 菜单中按下 `e` 后，你将看到界面。从该界面，向下滚动找到以 `linux16 /vmlinuz`\
  \ 开头并跟着大量参数的章节。这一行告诉 GRUB 如何启动内核，默认情况下它看起来像这样：\n\n```\nlinux16 /vmlinuz-0-rescue-5dea8df1a3b4cb5947ddb6c78a6773f\
  \ root=UUID=432d640e-3339-45fa-a66d-89da9c869550 ro rd.lvm.lv=centos/ swap vconsole.font=latarcyheb-sun16\
  \ rd.lvm.lv=centos/root crashkernel=auto vconsole.keymap=us rhgb quiet\n```\n\n\
  ![Image](img/19fig02.jpg)\n**图 19.2 在以 linux16 开头的行上输入启动参数。**\n\n首先，从这一行中移除 `rhgb`\
  \ 和 `quiet` 部分是一个好主；这些参数会为你隐藏启动信息，而你通常希望看到启动期间发生了什么。在下一节中，你将学习可以从 GRUB 启动提示符中输入的某些故障排除选项。\n\
  \n输入你想要使用的启动选项后，按 `Ctrl+X` 使用这些选项启动内核。注意，这些选项仅使用一次且不具有持久性。要使它们持久化，你必须修改 `/etc/default/grub`\
  \ 配置文件的内容并使用 `grub2-mkconfig -o /boot/grub2/grub.cfg` 应用修改。\n\n### 启动故障排除目标\n\n\
  当你遇到麻烦时，有几个可以在 GRUB 启动提示符上输入的选项：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ `rd.break`：这在仍处于 `initramfs` 阶段时停止启动过程。如果你没有 root 密码，此选项非常有用。恢复丢失 root 密码的完整步骤将在本章稍后介绍。\n\
  \n![Image](img/squf.jpg) `init=/bin/sh` 或 `init=/bin/bash`：指定在加载内核和 `initrd` 之后立即启动\
  \ shell。这是一个用的选项，但不是最好的选项，因为在某些情况下你会丢失控制台访问或错过其他功能。\n\n![Image](img/squf.jpg) `systemd.unit=emergency.target`：进入一个极简模式，其中加载了最少的\
  \ systemd 单元。它需要 root 密码。要看到只加载了极少数的单元文件，你可以运行 `systemctl list-units` 命令。\n\n![Image](img/squf.jpg)\
  \ `systemd.unit=rescue.target`：这启动更多的 systemd 单元以带你进入更完整的运行模式。它确实需要 root 密码。要看到只加载了极少数的单元文件，你可以运行\
  \ `systemctl list-units` 命令。\n\n在练习 19.1 中，你将学习如何进入 `rescue.target` 模式。列出的其他模式将在后续章节中讨论。\n\
  \n\n\n\n\n# 1. （重新）启动你的计算机。当 GRUB 菜单显示时，选择菜单中的第一行并按 `e`。\n\n# 2. 滚动到以 `linux16 /vmlinuz`\
  \ 开头的行。在该行末尾输入 `systemd.unit=rescue.target`。同时从该行中删除 `rhgb quit` 选项。\n\n# 3. 在提示输入\
  \ root 密码时输入。\n\n# 4. 输入 `systemctl list-units`。这将显示所有当前加载的单元文件。你可以看到基础系统环境已经加载。\n\
  \n# 5. 输入 `systemctl show-environment`。这将显示当前的 shell 环境变量。\n\n# 6. 输入 `systemctl\
  \ reboot` 重启机器。\n\n# 7. 当 GRUB 菜单显示时，再次按 `e` 进入编辑器模式。在加载内核的行末尾输入 `systemd.unit=emergency.target`。\n\
  \n# 8. 在提示时，输入 root 密码登录。\n\n# 9. 成功登录后，输入 `systemctl list-units`。注意加载的单元文件数量已减少到最少。\n\
  \n***\n\n## 使用救援磁盘\n\n如果你在遇到问题时运气不错，你仍然可以从硬盘启动。如果你运气稍差，只会会在完全无法启动的系统上看到闪烁的光标。如果发生这种情况，你需要一个救援磁盘。Red\
  \ Hat Enterprise Linux 的默认救援镜像位于安装磁盘上。从安装磁盘启动时，你将看到一个 Troubleshooting（故障排除）菜单项。选择此项以获取修复机器所需的选项（参见图\
  \ 19.3）。\n\n![Image](img/19fig03.jpg)\n\n**图 19.3** 从救援磁盘启动。\n\n### 使用救援磁盘恢复系统访问\n\
  \n在选择故障排除选项后，你会发现显示了一些特定的选项：\n\n![Image](img/squf.jpg) **在基本图形模式下安装 Red Hat 7：**\
  \ 此选项将重新安装你的机器。除非你想排排除正常安装无法工作且需要基本图形模式的情况，否则请勿使用它。通常情况下，你不应该需要使用此选项来排故障损坏的安装。\n\
  \n![Image](img/squf.jpg) **救援 Red Hat 系统：** 这是最灵活的救援系统。在练习 19.2 中，你可以详细探索它。这是使用救援磁盘时的首选选项。\n\
  \n![Image](img/squf.jpg) **运行内存测试：** 如果遇到内存错误，请运行此选项。它允许你标记坏内存颗粒，以便机器能够正常启动。\n\n\
  ![Image](img/squf.jpg) **从本地驱动器启动：** 如果你无法从硬盘上的 GRUB 启动，请尝试此选项。它提供了一个尝试从机器硬盘安装的引导程序，因此是侵入性最小的选项。\n\
  \n启动救援系统后，你通常需要对磁盘上的安装启用完全访问。通常，救援磁盘会检测你的安装并将其挂载到 `/mnt/sysimage` 目录。为了修复配置文件及其默认位置的访问（使其在磁盘上可用），使用\
  \ `chroot /mnt/sysimage` 命令将该目录的内容变为你的实际工作环境。如果你不使用 `chroot` 命令，许多工具将无法工作，因为如果它们写入配置文件，将是救援磁盘上存在的版本（因此它是只读的）。使用\
  \ `chroot` 命令可确保所有对配置文件的路径引用都是正确的。\n\n在练习 19.2 中，你将学习如何使用“救援 Red Hat 系统”选项来排除不再启动的系统的故障。\n\
  \n***\n\n## 练习 19.2 使用救援选项\n\n1. 从安装磁盘重启服务器。选择 **Troubleshooting** 菜单项。\n\n2. 从\
  \ Troubleshooting 菜单中，选择 **Rescue a Red Hat System**。这会提示你按 **Enter** 开始安装。不要担心：此选项不会覆盖你当前的配置；它只是加载了一个救援系统。\n\
  \n3. 救援系统现在提示你它将尝试寻找已安装的系统并将其挂载到 `/mnt/sysimage`。按 **Enter** 接受（参见图 19.4）。\n\n![Image](img/19fig04.jpg)\n\
  **图 19.4** 救援系统提示。\n\n4. 登录后，使用 `chroot /mnt/sysimage` 将该目录的内容变为你的实际工作环境。\n\n5.\
  \ 使用 `systemctl list-units` 验证已加载的单元。\n\n6. 输入 `systemctl reboot` 完成。\n\n***\n\n\
  ## 使用救援磁盘重新安装 GRUB\n\n你需要启动救援磁盘的常见原因之一是 GRUB 2 损坏了。在恢复系统访问后，重新安装 GRUB 包含两个步骤：\n\n\
  ![Image](img/squf.jpg) **步骤 1：重新安装 GRUB 配置。**\n\n```bash\ngrub2mkconfig -o /boot/grub2/grub.cfg\n\
  ```\n\n![Image](img/squf.jpg) **步骤 2：重新安装 GRUB 引导代码。**\n\n```bash\ngrub2-install\
  \ /dev/sda\n```\n\n## 使用救援磁盘重新创建 Initramfs\n\n偶尔，initramfs 镜像也可能会损坏。在进入环境后修复 initramfs，请使用\
  \ `dracut` 命令。`dracut` 配置分布在不同位置：\n\n- `/usr/lib/dracut/conf.d/*.conf` 包含系统默认。\n\
  - `/etc/dracut.conf.d/*.conf` 包含自定义 dracut 文件。\n- `/etc/dracut.conf` 用作主配置文件。\n\n\
  列表 19.1 显示了默认 `dracut.conf` 文件的示例。\n\n```\nroot@server1 ~]# cat /etc/dracut.conf\n\
  # 将你的配置放在此处或放在名为 *.conf 的单独文件中\n# 在 /etc/dracut.conf.d/ 中\n# 查看 man dracut.conf(5)\n\
  # 示例 dracut 配置文件\n#logfile=/var/log/dracut.log\n#fileloglvl=6\n# 要使用的 dracut 模块精确列表。如果没有指定，则模块的\n\
  # 硬编码\n```\n\n\n\n\n\n# 使用默认值，当前为：\"umount mount /sbin/fsck* xfs_db xfs_check\"\n\
  \n# xfs_repair e2fsck jfs_fsck reiserfsck btrfsck\"。安装是机会性的，因此不存在的工具将被忽略。\n# `fscks=\"\
  \"`\n\n# 阻止安装任何 fsck 工具\n# `nofscks=\"yes\"`\n\n# 默认将 / 和 /usr 挂载为只读\n# `ro_mnt=\"\
  no\"`\n\n# 设置临时文件的目录\n# 默认: /var/tmp\n# `tmpdir=/tmp`\n\n* * *\n* * *\n\n### 提示\n\
  根据红帽的考试目标，你在考试中不应该需要使用救援盘工作。然而，作为一名 RHCSA 也是一名 RHCE，你应该做好应对意料之外的准备，因此确保你能够处理常见以及一些不太常见的故障排除场景是一个好主意。\n\
  \n* * *\n\n## 修复常见问题\n\n在像这样较小的章节中，并不可能考虑到在操作 Linux 时可能遇到的所有问题。尽管如此，某些问题比其他问题更容易发生。在本节中，你将学习一些更常见的问题。\n\
  \n### 重新安装 GRUB 2\n\n引导加载程序代码不会凭空消失，但偶尔会发生 GRUB 2 引导代码损坏的情况。在这种情况下，你最好知道如何重新安装 GRUB\
  \ 2。具体方法取决于你的服务器是否仍处于启动状态。如果是，重新安装 GRUB 2 相当简单。只需输入 `grub2-install` 后面跟上你想要安装的设备名称即可。该命令有许多不同的选项可以精调具体要安装的内容，但你可能不需要它们，因为默认情况下，该命令会安装让你的系统再次启动的所有内容。\n\
  \n如果你的机器处于不可启动状态，情况就会变得复杂一些。如果发生这种情况，你首先需要启动救援系统，并从救援系统恢复对服务器的访问。（具体操作的精确步骤请参阅 练习\
  \ 19.2）。在将服务器的文件系统挂载到 `/mnt/sysimage` 并使用 `chroot /mnt/sysimage` 将挂载的系统映像变为你的根映像后，操作就像之前描述的样简单：只需运行\
  \ `grub2-install` 将 GRUB 2 安装到目标安装设备。因此，如果你在 KVM 虚拟机，运行 `grub2-install /dev/vda`；如果你在物理磁盘上，运行\
  \ `grub2-install /dev/sda`。\n\n### 修复 Initramfs\n\n在少数情况下，可能会发生 initramfs 损坏的情况。如果你仔细分析启动过程，你将会发现\
  \ initramfs 出了问题，因为你永远看不到根文件系统被挂载到根目录上，也看不到任何 systemd 单元启动。如果你怀疑 initramfs 出了问题，重新创建它是很容易的。要使用所有默认设置重新创建（这在大多数情况下都是没问题的），你只需运行\
  \ `dracut --force` 命令即可。（如果没有 `--force`，该命令将拒绝覆盖你现有的 initramfs。）\n\n运行 `dracut`\
  \ 命令时，你可以使用 `/etc/dracut.conf` 配置文件来指定写入 initramfs 的具体内容。在该文件中，你可以看到诸如 `lvmconf=\"\
  no\"` 之类的选项，可以用于开启或关闭特定功能。使用这些选项来确保你的 initramfs 包含所需的功能。\n\n### 从文件系统问题中恢复\n\n如果你对文件系统挂载进行了错误配置，启动过程可能直接以“Give\
  \ root password for maintenance.”消息结束。此此消息特别是由 `fsck` 命令生成的，该命令在启动时会尝试验证 `/etc/fstab`\
  \ 中文件系统的完整性。如果 `fsck` 失败，则需要人工干预，这在启动期间可能会导致此消息。确保你自己在这种情况发生时知道该做什么！\n\n* * *\n\n\
  ### 提示\n确保你非常熟悉这个主题。与文件系统相关的主题在 RHCSA 目标中权重很大，你可能需要创建分区和/或逻辑卷，并将它们放入 `/etc/fstab`\
  \ 中进行自动挂载。这使得出现问题的可能性也增加，如果这种情况在考试中发生，你最好确保自己知道如何修复它！\n\n* * *\n\n如果引用了一个不存在的设备，或者用于挂载设备的\
  \ UUID 存在错误，例如，systemd 会先等待设备是否会自动回来。如果没有发生这种情况，它会给出“Give root password for maintenance”的消息（参见图\
  \ 19.5）。如果发生这种情况，你务必首先输入 root 密码。然后你可以按照建议输入 `journalctl -xb`，以查看提供错误信息的相关消息是否已写入日志。如果问题是文件系统方面的，输入\
  \ `mount -o remount,rw /` 以确保根文件系统以读写方式挂载，并分析 `/etc/fstab` 文件中的错误并修复它。\n\n![Image](img/19fig05.jpg)\n\
  \n**图 19.5** 如果你看到这个，通常说明你有 /etc/fstab 问题。\n\n### 重置 root 密码\n\nLinux 员的一个常见场景是\
  \ root 密码丢失了。如果发生这种情况，你需要重置它。唯一的方法是进入最小模式启动，这允许你在不输入密码的情况下登录。按照以下步骤执行此操作：\n\n![Image](img/key_topic.jpg)\n\
  \n**1.** 系统启动时，当显示 GRUB 2 引导菜单时按 `e`。\n\n**2.** 在加载内核的行输入 `rd.break` 作为启动参数，并按 `Ctrl+X`\
  \ 使用此选项启动。\n\n**3.** 现在你将落在启动阶段的末尾，此时 initramfs 已加载，且在根文件系统挂载到目录 `/` 之前。\n\n**4.**\
  \ 输入 `mount -o remount,rw /sysroot` 以获得系统映像的读写访问。\n\n**5.** 此时，通过输入 `chroot /sysroot`\
  \ 将 `/sysimage` 目录的内容变为你的新根目录。\n\n**6.** 现在你可以输入 `passwd` 并为 root 用户设置新密码。\n\n**7.**\
  \ 因为在这一特定的启动阶段 SELinux 尚未激活，/etc/shadow 的上下文类型会被搞乱。如果你在此处重启，将没有人能够登录。因此你必须确保上下文类型被正确设置。为了做到这一点，此时你应该使用\
  \ `load_policy -i` 加载 SELinux 策略。\n\n**8.** 现在你可以手动为 /etc/shadow 设置正确的上下文类型。为此，请输入\
  \ `chcon -t shadow_t /etc/shadow`。\n\n**9.** 重启。你现在可以使用更改后的 root 用户密码登录了。\n\n* *\
  \ *\n\n### 注意\n在前面的步骤中，你学习了如何使用 `load_policy -i` 和 `chcon` 命令来纠正 /etc/shadow 文件的标签。另一种（更简单）的方法是创建一个名为\
  \ /.autorelabel 的文件，这将强制 SELinux 恢复设置在整个文件系统上的标签。\n\n*\n\n#### 恢复对虚拟机的访问\n\n故障排除的一个特殊情况是涉及虚拟机的情况。如果你在虚拟机中遇到问题，并且无法按照第\
  \ 10 章“使用虚拟机”中描述的方法通过 Virtual Machine Manager 或 `virsh console` 访问，那么你也无法通过 SSH\
  \ 连接到它。然而，仍然有一个选项。这里描述的技术比较高级，但因为它以后可能帮助你恢复本会丢失的虚拟机的访问，所以它是值得了解的。\n\n* *\n\n###\
  \ 提示\n这里描述的过程相对复杂，除非你在考试中严重失误，否则你不需要应用它。因此，与其背诵这个过程，不如非常小心地防止此类问题的发生！\n\n\n\n\n\n\
  1.  首先，在 KVM 宿主机上打开一个 root shell。在该宿主机文件上，使用 `virsh destroy vmname` 确保虚拟机已停止。（请使用\
  \ `virsh list` 命令列出的虚拟机名称。）\n\n2.  找到磁盘镜像文件。它通常存储在 `/var/lib/libvirt/images` 目录下。如果在该\
  \ particular 处没有找到，请使用 `virsh dumpxml vmname | grep “source file=”` 来查找源文件的名称：\n\
  \n点击此处查看图像\n\n```\n[root@lab ~]# virsh dumpxml sander-vm1 | grep \"source file=\"\
  \n\n      <source file='/home/sander/lab1.img'/>\n\n      <source file='/var/lib/libvirt/images/sander-vm1.img'/>\n\
  ```\n\n3.  现在你已经知道了虚拟机镜像文件的名称，可以使用 `kpartx -a` 命令将其挂载到宿主机环境中。该命令分析虚拟机的磁盘布局，并创建存储设备，允许你在宿主机文件系统中挂载虚拟机中的设备：\n\
  \n点击此处查看图像\n\n```\n[root@lab ~]# kpartx -av /home/sander/lab1.img\n\nadd map loop0p1\
  \ (253:5): 0 1024000 linear /dev/loop0 2048\n\nadd map loop0p2 (253:6): 0 7362560\
  \ linear /dev/loop0 1026048\n```\n\n4.  `kpartx` 命令已创建设备，使你能够访问虚拟机中的两个分区。如果这是一个典型的\
  \ RHEL 7 设置，第一个分区是 `/boot` 分区，第二个分区通常用于 LVM 逻辑卷。你可以通过 `mount /dev/mapper/loop0p1\
  \ /mnt` 轻松地挂载 `/boot` 分区。\n\n5.  若要访问虚拟机第二个分区中存在的逻辑卷，请使用 `pvscan` 命令：\n\n点击此处查看图像\n\
  \n```\n[root@lab mapper]# pvscan /dev/mapper/loop0p2\n\n  PV /dev/sda3         \
  \ VG centos   lvm2 [48.83 GiB / 0 free]\n\n  PV /dev/sda4          VG centos   lvm2\
  \ [50.00 GiB / 20.00 GiB free]\n\n  PV /dev/sda5          VG vglvm    lvm2 [347.32\
  \ GiB / 329.32 GiB free]\n\n  PV /dev/mapper/loop0p2  VG centosvm lvm2 [3.51 GiB\
  \ / 0 free]\n\nTotal: 449.65 GiB / use: 449.65 GiB / VG: 0\n```\n\n6.  你现在已经激活了虚拟机内的\
  \ LVM 设置。如果你输入 `lvs` 命令，也应该显示逻辑卷，但处于未激活状态。要激活它们，请对虚拟机磁盘镜像中找到卷组使用 `vgchange` 命令。因此，对于本次考试，输入\
  \ `vgchange -a centosvm` 来激活所有逻辑卷。完成后，你也可以挂载它们以直接访问虚拟机中的所有文件，并修复阻止虚拟机启动的所有问题。\n\n\
  警告：除非虚拟机内部使用的 LVM 卷组名称与宿主机相同，否则此过程运行良好。通常情况下不会发生这种情况，因为 VG 名称默认与主机名相同（而你希望主机名是唯一的）。但是，如果\
  \ VG 名称不唯一，你就有混淆它们并在错误的卷上操作的风险。\n\n7.  在修复了虚拟机中的所有问题后，首先需要卸载所有文件系统。接下来，你需要使用 `kpartx\
  \ -dv /home/sander/lab1.img` 命令移除根据虚拟机镜像文件内容创建的设备文件。（确保使用计算机上实际使用的镜像文件文件名。）\n\n\
  #### 总结\n在本章中，你学习了如何对 Red Hat Enterprise Linux 7 启动过程进行故障排除。你大致了解了服务器启动时发生了什么，以及在哪些点可以进行干预以修复错误。你还学习了在特定情况下该如何操作。确保你熟悉这些步骤；你可能会在考试中遇到它们。\n\
