  \ 网络共享的访问\n\n网络文件系统 (NFS) 是一种非常古老的协议，它的发明目的是为了方便在 Linux 宿主机之间共享文件。然而，NFS 多年来一直在发展，它仍然是一个非常重要的协议，经常用于在\
  \ Linux 和 UNIX 机器之间共享文件。在本章中，你将学习如何在 NFS 服务器上创建 NFS 共享，并从 NFS 客户端挂载该共享。你还学习了如何持久化地创建这种挂载。\n\
  \n### “我已经掌握了吗？”测验\n\n\n\n\n“我已经掌握这些了吗？”测验允许您评估自己是应该仔细阅读整个章节，还是直接跳转到“考试准备任务”部分。如果您对这些问题的答案或对自己对主题知识的评估有疑问，请通读整个章节。表\
