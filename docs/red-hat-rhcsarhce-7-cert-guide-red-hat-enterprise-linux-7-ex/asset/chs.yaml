  \ 位用于创建地址。\n\n### 理解 IPv6 地址\n\n专家多年来一直告诉世界，IPv4 地址几乎已经分配完毕，管理员需要开始考虑替代方案。看来，由于有了网络地址转换\
  \ (NAT) 等高级网络解决方案，公司未来仍可以使用基于 IPv4 的 IT 基础设施运行很长一段时间。尽管如此，IPv4 地址短缺是一个事实，每位管理员都至少应该具备关于\
  \ IPv6 工作的知识。\n\n在 IPv4 地址中，使用了 32 位来配置网络地址。这允许理论上最多有约 40 亿个唯一的网络地址。由于目前可用的 IPv4\
  \ 地址数量已经耗尽，在设计 IPv6 时，总共预留了 128 位用于创建地址。\n\n为了让 IPv6 地址易于管理，IPv6 地址的标准表示法是 十六进制\
  \ 数字，其范围从 0 到 f。因为十六进制数字并不易读，IPv6 地址由 16 位组组成，如下例所示：\n\nfe80:0000:0000:0000:0000:000:0000:0001\n\
  \n为了更容易读，开头的 0 不需要写入，长字符串的 0 可以汇总为 ::。因此，之前的示例地址可以重写为：\n\nfe80::10:29ff:fe4:714a\n\
  \n由于 IPv6 地址的可用范围巨大，IPv6 使用标准的子网掩码 /64。因此，对于每个子网，有 64 位用于主机。如果组织需要分配特定的子网，应该请求较短的网络前，例如\
  \ /48，这将留下 16 位用于子网分配。\n\n在 IPv6 中，一些特定的 IP 地址和地址范围被留用。表 30.4 提供了概览。\n\n![Image](img/key_topic.jpg)![Image](img/30tab4.jpg)\n\
  \n表格 30.4 常见 IPv6 地址和网络\n\n一种特定的 IPv6 地址是链路本地地址。这是一个不可路由的地址，自动分配给 IPv6 接口。链路本地地址是根据网络前\
  \ fe80::/64 加上网卡上的 MAC 地址自动创建的，在 MAC 地址部分的中间插入了 ffe。因此，如果 MAC 地址是 02:0c:29:04:71:4a，那么链路本地地址将是\
  \ fe80::20x:29ff:fe4:714a/64。\n\n如果你只需要用于内部的 IPv6 地址，并希望确保这些地址不会被外部网络上的任何人（无意或故意）访问，请考虑使用唯一本地地址。与\
  \ IPv4 中的私有地址一样，只有在使用了网络地址转换 (NAT) 时，这些地址才能连接到互联网上的节点。\n\n在 IPv6 中，不再有广播了。因此，组播在\
  \ IPv6 中的作用比在 IPv4 中大得多。一个重要的组播地址是 ff02::1，它是所有节点的链路本地地址。如果你 ping 此地址，流量将发送到特定链路上的所有节点。为了避免混淆，在使用此地址时需要添加你想要使用的接口，因此你使用\
  \ `ping6 ff02::1%eth0` 来 ping 连接到 eth0 接口的本地网络上的节点。\n\n##### 管理 IPv6 地址配置\n\n\n\n\
  \n\nIPv6 地址可以手动分配或通过 DHCP 分配。当你使用 DHCP 时，IPv6 主机使用多播地址 `ff02::1` 通过端口 `547/UDP`，该端口属于\
  \ all-dhcp-servers 链路本地多播组。`DHCPv6` 服务器向客户端的端口 `546` 发送响应，为其提供 IPv6 地址。\n\n作为使用\
  \ DHCP 的替代方案，IPv6 还支持无状态地址自动配置（SLAAC）。使用 `SLAAC` 时，主机通过一个链路本地地址 `fe80::/64` 启动其接口。然后，它向\
  \ `ff02::2` 发送路由器请求，该地址是 all-routers 链路本地多播组。该链路上的 IPv6 路由器将使用链路本地地址带上网络前缀进行回复。随后，主机在其\
  \ MAC 地址后后添加 fffe 填充，以创建一个唯一的 IPv6 地址。\n\n提供 IPv6 地址的第三种方法是通过手动配置。当使用此方法时，无法使用以下节点部分：\n\
  \n![Image](img/squf.jpg) 全 0 标识符 `0000:0000:0000:0000`，被链路上的所有路由器用作子网路由器任播地址\n\n\
  ![Image](img/squf.jpg) 标识符 `fdff:ffff:ffff:ff80` 到 `fdff:ffff:ffff:ffff`\n\n要分配\
  \ IPv6 地址，可以使用 `nmtui` 和 `nmcli` 工具。大多数命令的工作方式与 IPv4 的配置类似。让我们来看一些 `nmcli` 示例：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) `nmcli con add con-name\
  \ eno16777736 type ethernet ifname eno16777736 ip6 2001:db8:0:1::100/64 gw6 2001:db8:0:1::1\
  \ ip4 192.168.4.122/24 gw4 192.168.4.2` 该命令同时为接口添加 IPv4 和 IPv6 地址配置。\n\n![Image](img/squf.jpg)\
  \ `nmcli con show eno16777736 | grep ipv6` 该命令显示 `eno16777736`  IP 配置，仅过滤出与 IPv6\
  \ 相关的信息（参见列表 30.13）。\n\n**列表 30.13** 显示接口的 IPv6 信息\n\n点击此处查看代码图像\n\n* * *\n\n```\n\
  [sander@lab ~]$ nmcli con show eno1 | grep ipv6\n\nipv6.method: auto\nipv6.dns:\n\
  ipv6.dns-search:\nipv6.addresses:\nipv6.routes:\nipv6.ignore-auto-routes: no\nipv6.ignore-auto-dns:\
  \ no\nipv6.never-default: no\nipv6.may-fail: yes\nipv6.ip6-privacy: (unknown)\n\
  ipv6.dhcp-hostname: --\n```\n\n* * *\n\n![Image](img/squf.jpg) `nmcli con mod eno16777736\
  \ ipv6.address \"2001:db8:0::1\"` 该命令修改静态分配的 IPv6 地址。\n\n![Image](img/squf.jpg)\
  \ `nmcli con mod eno16777736 +ipv6.dns 2001:4860:4860::8888` 该命令将 DNS 服务器添加到当前的\
  \ DNS 列表中。注意 `+` 的使用，它会向当前配置添加一个值。\n\n在设置 IP 地址后，你可以使用 `ip addr show` 和 `ip route\
  \ show` 等常用工具进行验证。这些命令显示了 IPv4 和 IPv6 的配置。若只想监控 IPv6 配置，可以在 `ip` 命令上使用 `-6` 参数。因此，`ip\
  \ -6 addr show` 显示 IPv6 地址，而 `ip -6 route show` 仅显示 IPv6 路由。\n\n### 排查 IPv6 故障\n\
  \n要排查 IPv6，你可以可以使用可以使用命令。首先是 `ping6` 命令，它可以用于 ping IPv6 地址。例如，使用 `ping6 2001:db8:0::1`\
  \ 来 ping 特定地址，或使用 `ping6 ff02::%eth0` 来 ping 连接到 `eth0` 链路上的所有多播地址。\n\n要分析 IPv6\
  \ 网络中的路由信息，请使用 `tracepath6` 命令。该命令显示了当前节点与目标节点之间的所有跳数。关于正在使用的端口和服务的信息，你可以使用 `ss`\
  \ 或 `netstat` 命令，它们默认会显示与 IPv6 相关的信息。在练习 30.2 中，你将学习如何在 RHEL 7 上操作 IPv6。\n\n###\
  \ 练习 30.2 使用 IPv6 地址\n\n在本次练习中，你将操作 IPv6 地址。要完成此练习，请使用 `server1` 和 `server2` 机器。建议不要使用上一个练习中带有\
  \ teaming 接口的服务器，因为这会让配置变得稍微复杂。\n\n1. 在 `server1` 上，打开 root shell 并输入命令 `nmcli con\
  \ show`。注意服务器上使用的网络连接名称。在本次练习中，我假设名称为 `eno16777736`；请根据你的配置进行替换。\n2. 输入 `ip addr\
  \ show eno16777736` 并注意当前的 IPv6 配置。\n3. 输入 `nmcli con show eno16777736 | grep -i\
  \ ipv6`。这显示了你接口的当前配置。\n4. 使用 `nmcli con mod eno16777736 ipv6.addresses 'fdff:fe2a:badb:abe::1/64'`\
  \ 为接口分配 ipv6 地址 `fdff:fe2a:badb:abe::1`。\n5. 使用 `nmcli con mod eno16777736 ipv6.method\
  \ manual` 将 IP 配置设置为静态 IP 地址。\n6. 重启接口，使用 `nmcli con down eno16777736; nmcli con\
  \ up eno16777736`。\n7. 使用 `ip addr show dev eno1677736` 验证当前的 IPv6 配置。\n8. 在 `server2`\
  \ 上重复此过程，分配地址 `fdff:fe2a:badb:abe::64`。\n9. 从 `server2` 执行 `ping6 fdff:fe2a:badb:abe::1`\
  \ 以验证可以到达 `server1`。\n10. 输入 `ip -6 route` 显示 IPv6 路由表。\n11. 使用 `ping6 ff02::1%eno1677736`\
  \ ping 链路本地地址，以验证连通的。\n\n#### 路由 IP 流量\n\n在具有多个网络接口的 RHEL 7 系统上，你可能需要配置路由。要这样做，首先必须启用路由。然后，可以创建自定义路由来指定数据去向。\n\
  \n### 启用路由\n\n每个 RHEL 7 系统都可以配置为路由器。前提是存在多个网络设备。要配置服务器，首先必须将 `/proc/sys/ipv4/ip_forward`\
  \ 中的值设置为 `1`。这可以通过手动 `echo 1 > /proc/sys/ipv4/ip_forward` 完成。为了使配置持久化，需要在 `/etc/sysctl.d`\
  \ 中创建一个文件。你可以自由选择要创建的文件名，但必须以 `.conf` 结尾。此外，确保它包含以下内容：\n\n```\nnet.ipv4.ip_forward\
  \ = 1\n```\n\n重启服务器后，此命令将使设置生效。\n\n### 配置自定义路由\n\n在大多数服务器上，设置唯一路由是默认网关。它指定了处理所有流量的路由器\
  \ IP 地址。`ip route show` 命令显示默认路由当前设置为哪个 IP 地址（参见列表 30.14）。\n\n\n\n\n\n配置自定义路由的最简单方法是使用图形化的\
  \ NetworkManager 工具或 `nmtui` 文本驱动工具。使用此工具，你可以通过输入网络地址、相关的子掩码、需要处理的网关以及与该路由相关的跃来指定自定义路由。\n\
  \n结果被写入名为 `/etc/sysconfig/network-scripts/route-interface` 的文件中。列表 30.15 显示了该文件的示例内容。\n\
  \n**列表 30.15** 路由配置文件的示例内容\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server2 network-scripts]#\
  \ cat route-eno16777736\nADDRESS0=10.0.0.0\nNETMASK0=255.255.255.0\nGATEWAY0=192.168.4.1\n\
  METRIC0=10\n```\n\n***\n\n#### 总结\n\n在本章中，你学习了如何配置高级网络功能。在本章的第一部分，你学习了如何启用网络链路聚合。你学习了如何使用\
  \ `teaming` 和 `bonding` 来实现此目标。你了解到 `teaming` 是 RHEL 以前版本中使用 `bond` 驱动程序的现代替代方案，它允许将网络设备组合到一个接口，以提供更高的冗余性、吞吐量或两者兼顾。本章的第二部分展示了如何配置\
  \ IPv6 地址，在本章的最后部分，你学习了如何在 RHEL 7 上配置自定义路由。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n回顾章节中最重要的主题，这些主题在页外边已用“关键主题”图标标记出。表\
