  **d. `at`****\n\n### 基础知识点\n\n#### 配置 cron 以自动化周期性任务\n\n在 Linux 系统上，某些任务必须定期进行自动化处理。一种方案是为每个进程配置一个特定进程的解决方案来处理周期性任务，但这样处理这些任务的效率并不高。这就是为什么在\
  \ Linux 上，`cron`（_gloss01.html_gloss_50) 服务被用作一种通用服务，在特定时间自动运行进程。\n\ncron 服务由两个主要部分组成。首先是\
  \ cron 守护进程 `crond`。该守护进程每分钟检查一次是否有工作要做。这些工作定义在 cron 配置中，该配置由 cron 配置组成。\n\n####\
