  \ USA\n\n\n\n\n\n\n\n\n\n\n\n\n\n***\n\n现在你已经输入了 `mount` 和 `df` 命令，让我们仔细观察一下列表 3.1\
  \ 中 `df -h` 命令的输出。\n\n`df` 的输出显示为七列\n\n![Image](img/squf.jpg) **Filesystem:** 与所用磁盘设备交互的设备文件名称。输出中的真实设备以\
  \ `/dev` 开头（这指向存储设备文件的目录）。你还可以看到几个 `tmpfs` 设备。这些是用于在 RAM 中创建临时文件系统的内核设备。\n\n![Image](img/squf.jpg)\
  \ **Type:** 所用文件系统的类型。\n\n![Image](img/squf.jpg) **Size:** 挂载设备的大小。\n\n![Image](img/squf.jpg)\
  \ **Used:** 设备正在使用的磁盘空间量。\n\n![Image](img/squf.jpg) **Avail:** 未使用的磁盘空间量。\n\n![Image](img/squf.jpg)\
  \ **Use%:** 设备当前正在占用的百分比。\n\n![Image](img/squf.jpg) **Mounted on:** 设备当前挂载的目录。\n\
