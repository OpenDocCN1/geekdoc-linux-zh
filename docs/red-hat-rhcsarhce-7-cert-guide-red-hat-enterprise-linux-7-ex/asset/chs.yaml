  ***\n\n### 保留 systemd Journal\n\n在前面的练习中，你输入了 `journalctl -o verbose` 来显示详细输出。[列表\
  \ 13.6 显示了 `verbose` 输出的一个示例。你可以看到这为所有已记录的项目提供了详细信息，包括 PID、关联的用户和组账户的 ID、关联的命令等。\n\
  \n默认情况下，日志存储在 `/run` 中，这意味着它在重启时会被清除。要让日志持久化，你必须配置 `systemd-journald`。打开 `/etc/systemd/journald.conf`\
  \ 并设置 `Storage=persistent` 选项。这确保日志被保存到 `/var/log/journal`。\n\n配置文件后，你应该使用 `killall\
  \ -USR1 systemd-journald` 重启服务。要进行验证，请使用 `journalctl -b` 检查日志。\n\n\n\n\n4. 哪条命令允许你使用\
  \ `notice` 优先级从命令行向用户设施（user facility）记录消息？\n\n5. 你会添加哪一行来将所有优先级为 `info` 的消息写入 `/var/log/messages.info`\
  \ 文件？\n\n6. 哪个配置文件允许你让日志（journal）的增长超过其默认的大小限制？\n\n7. 哪条命令允许你实时查看滚动的日志中的新消息？\n\n\
  8. 哪条命令允许你查看在上午 9:00 到下午 3:00 之间为 `PID` `1` 写入的所有 journald 消息？\n\n9. 在配置了持久性日志（persistent\
  \ journal）的系统上，哪条命令允许你查看自上次重启以来的 journald 消息？\n\n10. 哪个过程允许你让 journald 日具有持久性？\n\
  \n### 章末实验\n\n你现在已经学习了如何在 Red Hat Enterprise Linux 7 上处理日志记录，并知道了如何配置 `rsyslogd`\
  \ 和 `journald`。你现在可以完成章末实验以巩固这些新学到的技能。\n\n#### 实验 13.1\n\n1. 配置日志在系统重启后仍保持持久化。\n\
  2. 创建一个配置文件，将所有优先级为 `info` 的消息写入 `/var/log/messages.info` 文件。\n3. 配置 `logrotate`\
  \ 保留 10 个旧版本的日志文件。\n\n## 第 14 章 管理分区\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg)\
  \ 理解 MBR 和 GPT 分区\n\n![Image](img/squf.jpg) 管理分区和文件系统\n\n![Image](img/squf.jpg)\
  \ 挂载文件系统\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\n![Image](img/squf.jpg) 在 MBR 和 GPT 磁盘上列出、创建、删除分区\n\
  \n![Image](img/squf.jpg) 配置系统通过通用唯一标识符 (UUID) 或标签在启动时挂载文件系统\n\n![Image](img/squf.jpg)\
  \ 添加新分区和逻辑卷，并以非破坏性方式交换交换分区\n\n![Image](img/squf.jpg) 创建、挂载、卸载和使用 vfat、`Ext4` 和 `xfs`\
  \ 文件系统\n\n处理存储是 Linux 管理员的一项重要任务。在本章中，你将获得第一组基本的存储技能。你将学习如何创建和管理分区，使用所需的文件系统对它们进行格式化，并挂载这些文件系统。\n\
  \n### “我掌握这些了吗？”测试\n\n“我掌握这些了吗？”测试允许你评估是否应该仔细阅读整个章章节，还是跳转到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整章内容。表\
