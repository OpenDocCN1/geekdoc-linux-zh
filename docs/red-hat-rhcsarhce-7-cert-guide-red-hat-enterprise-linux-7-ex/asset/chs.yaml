  \ `ssh-copy-id` 将公钥复制到远程服务器。d.** 在服务器上使用 `ssh-keygen` 生成与客户端密钥匹配的密钥对。\n\n\n\n\n\
  粗略来说，有两种方法可以让你连接到 Linux 服务器。有时，你只需要坐在 Linux 控制台前，从显示的登录提示符进行交互式登录。在其他情况下，会建立远程连接。本章的第二部分关于如何从远程会话登录；在这一部分，你将学习如何在本地控制台进行工作。\n\
  \n如果 Linux 服务器带有图形化环境（所谓的图形目标）启动，你将看到一个登录提示符，可以在其中输入用户名和密码。然而，许多 Linux 服务器根本不使用图形化环境，而是仅显示文本控制台，如图\
  \ 5.1\n\n**图 5.1** 从文本控制台登录。\n\n要从文本控制台登录，你需要知道应该使用哪个用户账户。`root` 用户始终始终可用，但使用该账户进行工作通常不是一个好主意；`root`\
  \ 用户访问系统没有任何限制，因此可能会造成巨大的破坏。一个小错误就可能产生巨大的影响。通常，登录为本地定义的用户之一是更好的主意，这样做有很多原因，包括以下几点：\n\
  \n![Image](img/squf.jpg) 这将使得犯严重错误变得困难。\n\n![Image](img/squf.jpg) 在很多情况下，你根本不需要\
  \ root 权限。\n\n![Image](img/squf.jpg) 如果你只允许普通用户访问而不允许 root 访问，这将迫使攻击者猜测三个不同的东西：该特定用户的名称、该用户的密码以及\
  \ root 密码。\n\n![Image](img/squf.jpg) 如果你确实需要 root 权限，可以从本地用户环境使用 `su -` 命令打开一个 root\
  \ shell。这只会打开一个 root shell，而在你当前会话的所有其他部分中，你仍然是一个普通用户。\n\n![Image](img/squf.jpg)\
  \ 使用 `sudo` 为为特定用户配置特定的管理任务。更多信息请参阅第 6 章“用户和组管理”。\n\n### 在图形化环境环境中切换终端\n\n在图形化环境中工作时，打开几个不同的工作环境是相对容易的。只需右键点击图形桌面并选择“在终端中打开”（Open\
  \ in Terminal）。这将作为当前环境的子壳打开几个终端窗口。由于所有这些终端都是作为子壳打开的，你不需要再次登录每个终端，并将以最初登录图形化环境时使用的用户账户访问（见图\
  \ 5.2）。\n\n![Image](img/05fig02.jpg)\n\n**图 5.2** 从图形化环境中使用不同的终端窗口。\n\n在图形化环境中工作非常方便。作为管理员，你可以打开几个终端窗口，并在每个终端窗口中使用\
  \ `su -` 命令打开一个可以让你以不同用户身份进行工作的 shell。这允许你轻松地测试功能并立即看到这些测试的结果。练习 5.1 将引导你完成一个常见场景，你可以在其中执行此操作，并看到从一个终端窗口进行测试同时从另一个终端窗口进行监控是多么方便。\n\
  \n***\n\n#### 练习 5.1 同时在多个终端窗口工作\n\n在本次练习中，你将学习管理员如何从同时在多个终端窗口工作从中受益。\n\n**1.**\
  \ 启动计算机并确保从显示的图形化登录窗口以非 root 用户账户登录。你应该有一个名为 `user` 密码为 `password` 的本地用户供此目的使用。\n\
  \n**2.** 在图形桌面的空白处右键点击，并从下拉菜单中选择“在终端中打开”（Open in Terminal）。\n\n**3.** 重复步骤 2，以便你拥有两个同时打开的终端窗口。\n\
  \n**4.** 从其中一个终端窗口输入命令 `su -` 并输入 root 用户的密码。然后输入 `tail -f /var/log/secure`。这将打开对\
  \ `/var/log/secure` 文件的跟踪，你可以在其中实时监控安全事件。\n\n**5.** 从另一个终端窗口输入 `su -`。当询问密码时，通常输入用户\
  \ `root` 的密码。输入输入一个错误的密码。\n\n**6.** 现在查看仍在运行 `/var/log/secure` 跟踪的终端。你会发现一条错误信息已写入该文件。\n\
  \n**7.** 使用 `Ctrl+C` 键序列关闭对 `/var/log/secure` 文件的 `tail -f` 会话。\n\n***\n\n### 在非图形化环境中使用多个终端\n\
  \n在上一节中，你学习了如何在图形化环境中使用多个终端工作。这相对容易，因为你只需要打开一个新的终端窗口。在非图形化环境中，你只有一个可用的终端界面，这使得在不同的用户\
  \ shell 环境中工作变得有些困难。\n\n为了提供一种允许从同一台服务器的多个控制台工作的选项，Linux 使用了虚拟终端（virtual terminal）的概念。此功能允许你同时从同一个控制台打开六个不同的终端窗口。要打开这些终端窗口，可以使用键序列\
  \ `Alt+F1` 到 `Alt+F6`。\n\n***\n\n### 提示\n\n使用 Alt+Function 快捷键的方便替代方案是 `chvt` 命令。该命令允许你从当前环境切换到虚拟环境。如果你现在位于图形环境，打开终端并输入\
  \ `chvt 3`。这将带你进入虚拟终端 3。使用 `chvt 1` 回到图形环境。\n\n***\n\n在这些虚拟终端中，第一个是作为默认控制台使用的。它被称为虚拟终端\
  \ `tty1`，并且在 `/dev` 目录下有一个对应的设备文件，名为 `/dev/tty1`。其他虚拟终端也有对应的设备文件，编号为 `/dev/tty1`\
  \ 到 `/dev/tty6`。\n\n在图形化环境中工作时，也可以打开不同的虚拟终端。因为 Alt 键和功能键的组合在图形化环境中通常具有含义，你需要使用 `Ctrl+Alt+Function\
  \ key`。因此，不要在图形环境中使用 `Alt+F2` 打开 `/dev/tty2`，而是使用 `Ctrl+Alt+F2`。返回图形控制台可以使用 `Alt+F1`\
  \ 键序列。`Alt+F6` 和 `Ctrl+Alt+F6` 键序列本质上是相同的。只是从文本环境到图形环境时，使用 Ctrl 键是必要的。\n\n***\n\n\
  ### 理解伪终端设备\n\nLinux 环境中使用的每个终端都与一个设备文件相关联。你刚刚学习了在非图形化环境中启动的终端通常通过 `/dev/tty1` 到\
  \ `/dev/tty6` 设备进行引用。\n\n\n\n\n对于从图形界面启动的终端窗口，会启动伪终端（pseudo terminals）。这些伪终端通过 `/dev/pts`\
  \ 目录下的数字进行引用。因此，从图形界面启动的第一个终端窗口显示为 `/dev/pts/1`，第二个终端窗口为 `/dev/pts/2`，依此类推。在练习 5.2\
  \ 中，你将学习如何操作这些伪终端设备，并查看哪个用户在哪个伪终端上处于活跃状态。\n\n### 注意事项\n在较早的 Linux 版本中，伪终端被视为 `pty`\
  \ 设备。这些类型的终端现在已废弃，并被如前文所述的 `pts` 终端类型所取代。\n\n### 练习 5.2 使用伪终端\n在此练习中，你将学习如何操作伪终端。你还将学习如何获取有关特定伪接口上用户活动的更多信息。\n\
  \n1. 使用非根用户账户登录图形控制台。\n2. 在桌面上点击右键，并选择“在终端中打开”。\n3. 在终端窗口中输入 `w`。这将提供所有当前登录用户的概述。注意提到用户所在的\
  \ tty 的列，其中你会看到 `:0` 代表控制台，`pts/0` 代表终端窗口。\n4. 再次在桌面上点击右键并选择“在终端中打开”。输入 `su -` 变为根用户。\n\
  5. 输入 `w` 再次显示所有当前登录用户的概述。注意，根终端也显示为由非根用户拥有。\n\n此时，你已经学会了如何操作控制台、终端、虚拟终端和伪终端。在本文章稍后的“[使用\
  \ SSH 和相关工具”节中，你将使用 SSH 为服务器打开终端会话。这些会话也会显示为伪终端。\n\n### 启动、重启和关机系统\n作为 Linux 服务器的管理员，你偶尔需要重启\
  \ Linux 服务器。重启服务器并不是一个频繁的需求，但它可以让你的工作变得简单得多，因为这将确保服务器上运行的所有进程和任务都重新读取了它们的配置并进行了正确的初始化。\n\
  \n### 提示\n重启 Linux 服务器是 RHCSA 以及 RHCE 考试中的一项重要任务。在服务器重启后，你配置的所有内容应该仍然正常工作。因此，请确保在考试期间至少重启一次，并在对服务器配置进行关键修改后也重启。如果你的服务器在应用服务器配置的关键修改后无法再次重启，至少你知道该去哪里寻找修复问题。\n\
  \n对于真正彻底熟悉 Linux 的管理员来说，重启服务器是极少必要的。经验丰富的管理员通常可以触发正确的参数来强制进程重新读取其配置。然而，在某些情况下，即使是经验丰富的\
  \ Linux 管理员也必须重启：\n\n1.![Image](img/key_topic.jpg)\n![Image](img/squf.jpg) 从服务器挂起和内核崩溃等严重问题中恢复\n\
  ![Image](img/squf.jpg) 应用内核更新\n![Image](img/squf.jpg) 对正在使用且因此无法轻易重新加载的内核模块应用更改\n\
  \n当服务器被重启时，所有正在运行的进程都需要正常关闭。如果直接通过拔掉电源来停止服务器，通常会丢失大量数据。这是因为写入数据的进程通常不会直接将这些数据写入磁盘，而是将其存储在内存缓冲区中，当操作系统认为方便时再将其提交到磁盘。\n\
  \n要执行适当的重启，必须通知 systemd 进程。`systemd`进程是服务器启动时启动的进程，负责直接或间接地管理所有其他进程。因此，在系统重启或停止时，`systemd`进程需要确保停止所有进程。要告诉\
  \ `systemd`进程执行此操作，可以使用几个命令：\n\n```\nsystemctl reboot or reboot\nsystemctl halt\
  \ or halt\nsystemctl poweroff or poweroff\n```\n\n停止机器时可以使用 `systemctl halt` 或 `systemctl\
  \ poweroff` 命令。这两个命令的区别在于 `systemctl poweroff` 命令会与机器上的电源管理通信以关闭电源。在使用 `systemctl\
  \ halt` 时，通常不会发生这种情况。\n\n### 注意事项\n使用上述方法通常会重启或停止你的机器。在某些情况下，这些命令可能不起。如果是如此，还有一种紧急重置选项。如果无法物理接触机器，使用此选项可能非常有用。要强制机器重置，你可以输入\
  \ `echo b > /proc/sysrq-trigger`。此命令会立即重置机器而不保存任何内容。请注意，只有在没有其他选项时才使用此命令！\n\n###\
  \ 使用 SSH 和相关工具\n在本文章之前的节中，你学习了在能够直接访问服务器控制台的情况下访问终端。许多管理员维护的是无法物理接触的服务器。为了管理这些服务器，通常使用\
  \ Secure Shell (SSH)。在这一节中，你将学习如何使用 SSH。\n\n在现代 Linux 发行版中，Secure Shell 是通过网络访问其他机器的常用方法。在\
  \ SSH 中，使用密码学 来确保你可以确定连接到了预期的服务器。此外，流量在传输过程中是加密的。\n\n### 使用 SSH 访问远程系统\n要使用 SSH\
  \ 访问服务器需要两个组件。在你想要访问的远程服务器上，`sshd` 服务必须运行并在 22 端口提供服务，且不应被防火墙拦截。如果 SSH 端口开启，你可以从命令行使用\
  \ `ssh` 命令进行访问。`ssh` 命令默认尝试连接服务器 22 端口上的 ssh 进程。如果你配置 `sshd` 进程在不同的端口提供服务，请使用 `ssh\
  \ -p` 后跟要连接的端口号。\n\n`ssh` 命令在所有 Linux 发行版中可用，在 Apple Macintosh 计算机上同样可用，可以在 Apple\
  \ Macintosh 终端中启动。\n\n`ssh` 命令并不是 Windows 操作系统的原生部分。如果你想从 Windows 通过 SSH 访问 Linux\
  \ 服务器，需要在 Windows 上安装如 PuTTY 等 SSH 客户端。通过 PuTTY 可以与 Linux 机器建立各种远程会话。\n\n从 Linux\
  \ 终端访问另一台 Linux 机器相对简单。只需输入 `ssh` 后跟另一台 Linux 机器名称。如果使用默认配置，连接后将提示输入密码。\n\n\n\n\n\
  \n当远程连接到 Linux 服务器时，SSH 客户端会尝试以你当前在本地机器上登录的用户账户身份进行。如果你想使用不同的用户账户进行连接，可以在命令行中以 `user@server`\
  \ 格式指定该用户的名称。例如，如果你想以 root 用户身份到远程服务器建立 SSH 会话，请输入 `ssh root@remoteserver`。指定用户账户的另一种方法是使用\
  \ `-l username` 选项。因此，`ssh remoteserver -l root` 也会尝试在远程服务器建立 root 会话。在练习 5.3 中，你将学习如何使用\
  \ SSH 登录。\n\n### 练习 5.3 使用 SSH 登录到远程服务器\n\n在本练习中，你将使用 SSH 登录到远程服务器。本练习假设远程服务器是可用且可访问的。在练习中，`server1`\
  \ 被用作本地服务器，而 `server2` 是应该是 SSH 进程的远程服务器。如果你无法访问远程服务器来执行练习中的步骤，你也可以将 `server2` 替换为\
  \ `localhost`。显而易见，这样做你将不会登录到远程服务器，但你仍然在使用 `ssh` 命令连接到 `sshd` 进程。\n\n1. 在 `server2`\
  \ 上打开一个 root shell。输入 `systemctl status sshd`。这应该向你显示 `sshd` 进程正在运行。\n\n2. 为了避免任何与防火墙相关的问题，输入\
  \ `systemctl stop firewalld`。（在第 22 章“配置防火墙””中，你将学习如何配置防火墙以允许 SSH 流量）。\n\n3. 输入\
  \ `ip a | grep ‘inet ‘`。（注意 `inet` 和结束引号之间的空格。）注意你服务器当前正在使用的 IPv4 地址。在练习的其余部分，假设\
  \ `server2` 使用的 IP 地址为 `192.168.122.220`。将该地址替换为你在此处找到的地址。\n\n4. 在 `server1` 上以非特权用户身份打开\
  \ shell。\n\n5. 在 `server1` 上，输入 `ssh 192.168.122.220 -l root`。这将连接到 `server2` 上的\
  \ `sshd` 进程并打开一个 root shell。\n\n6. 在提示密码之前，你会看到一条消息，表示主机 `192.168.122.220` 的真实性无法建立（参见列表\
  \ 5.1）。显示此消息是因为你连接的主机在你当前主机上尚未知，这可能涉及安全风险。输入 `yes` 继续。\n\n7. 提示时，输入 root 密码。输入后，你现在已登录到\
  \ `server2`。\n\n8. 输入 `w`。注意你刚刚打开的 SSH 会话显示为另一个伪终端会话。\n\n9. 输入 `exit` 关闭 SSH 会话。\n\
  \n### 列表 5.1 第一次登录到远程服务器时，你会看到安全消息\n\n点击此处查看代码图像\n\n```\n[root@server1 ~]# ssh 192.168.4.220\
  \ -l root\n\nThe authenticity of host '192.168.4.220 (<no hostip for proxy\ncommand>)\
  \ can't be established.\n\nECDSA key fingerprint is 35:64:36:f8:ac:4f:8a:94:aa:6e:4b:85:ed:76:0a:\n\
  eb.\n\nAre you sure you want to continue connecting (yes/no)?\n```\n\n### 注意\n\n\
  在某些情况下，使用 `ssh` 访问服务器可能会很。如果你想知道为什么，请在 `ssh` 命令上使用 `-v` 选项。这将启动详细模式下的 SSH 并显示所有所连接的各个组件。通过这种方式，你可能会获得关于你的服务器变慢的指示。\n\
  \n你已经注意到，在使用 SSH 连接到远程服务器时显示了安全消息。这是因为以前从未连接过远程服务器，因此没有办法验证远程服务器的身份。在连接到远程服务器后，一个公钥指纹将存储在\
  \ `~/.ssh/known_hosts` 文件中。\n\n下次连接到同一台服务器时，该指纹将与远程服务器发送的用于初始化连接的加密密钥进行比对。如果指纹匹配，你将不再看到此消息。\n\
  \n在某些情况下，远程主机密钥指纹与本地存储的密钥指纹不匹配。这是一个潜在的危险情况。你可能没有连接到目标服务器，而是连接到了恶作者的服务器。然而，如果你连接到一个以前连接过的\
  \ IP 地址，但该 IP 地址现在被不同的服务器使用，也会发生这种情况。在这种情况下，你只需要从客户端计算机的 `~/.ssh/known_hosts` 文件中删除密钥指纹即可。\n\
  \n#### 在 SSH 环境中使用图形应用程序 在从 SSH 会话中，默认情况下你无法启动图形应用程序。这是出于安全考虑；远程主机不能启动图形应用程序。要实现这一点，有两个要求：\n\
  \n- 客户端上必须运行着 X 服务器。\n- 远程主机必须允许显示应用程序。\n\n通过 SSH 启动图形应用程序的最简单方法是在 `ssh` 命令中添加 `-X`\
  \ 选项。因此，如果你想启动图形应用程序，请使用 `ssh -X linda@server2`。\n\n作为管理员，你还可以创建一个允许“X 转发”的系统级配置。为此，打开配置文件\
  \ `/etc/ssh/ssh_config` 并确保它包含以下行：\n\n```\nForwardX11 yes\n```\n\n下次你使用 `ssh` 命令时，默认可以使用\
  \ X 转发。\n\n#### 在系统之间安全地传输文件\n\n如果主机运行 `sshd` 服务，该服务也可以用于在系统之间安全地传输文件。为此，你可以使用 `scp`\
  \ 命令。该命令与用于复制本地文件的 `cp` 命令非常相似，但它包含一个允许与远程主机工作的选项。你可以使用 `scp` 将文件和目录复制到远程主机。例如，将\
  \ `/etc/hosts` 文件通过当前用户账户到 `server2` 的 `/tmp` 目录，使用以下命令：\n\n```\nscp /etc/hosts\
  \ server2:/tmp\n```\n\n如果你想以 root 用户身份连接到 `server2` 将 `/etc/passwd` 文件复制到你的家目录，使用以下命令：\n\
  \n```\nscp root@server2:/etc/passwd ~\n```\n\n你还可以使用 `scp` 复制整个目录结构。要这样做，请使用 `-r`\
  \ 命令，如下所示：\n\n```\nscp -r server2:/etc/ /tmp\n```\n\n注意 `scp` 命令也可以配置为连接到非默认 SSH\
  \ 端口。这有点令人困惑，但要在 `scp` 命令中执行此，你需要 `-P` 选项并跟上想要连接的端口号。注意 `ssh` 使用小写的 `-p` 来指定它需要连接的端口；`scp`\
  \ 命令使用大写的 `-P`。\n\n\n\n\n\n作为使用 `scp` 在服务器之间拷贝文件的另一种替代方案，你可能对 `rsync` 命令感兴趣。`rsync`\
  \ 的基本用法与 `scp` ，它也使用 `sshd` 服务来安全地复制文件。然而，`rsync` 提供了高级选项，允许你根据增量同步（delta sync）同步文件和目录。这意味着只同步差异部分，这使其成为保持主机之间之间文件和目录一致的非常高效的解决方案。\n\
  \n## 为 SSH 配置基于密钥的认证\n\n如果在互联网上使用 SSH，允许密码登录可能不是一个好主意。为了让 SSH 更安全，它总是首先尝试是否可以使用公钥/私钥进行登录。只有在无法密钥登录的情况下，才会使用密码登录。要启用密钥登录，你唯一需要做的就是创建一个密钥对。\n\
  \n在使用基于公钥/私钥的认证时，想要连接到服务器的用户生成一对公钥/私钥。私钥需要保持私密，且永远不会分发。公钥存储在 SSH 服务器上目标用户的家目录下。\n\
  \n使用密钥对进行认证时，用户生成一个派自私钥的哈希值。该哈希被发送到服务器，如果服务器上证明它与存储的公钥匹配，则用户通过认证。\n\n## 使用密码还是不用？\n\
  \n在创建公钥/私钥对时，系统会提示你输入密码（passphrase）。如果你想获得最大的安全性，应该输入密码。每当你使用私钥对远程主机进行认证时，都会提示你输入该密码。这非常安全，但不方便。为了创建一个允许最大便利性的配置，你可以只需按两次\
  \ `Enter` 键确认你不设置密码。这是在信任环境中（环境中无法外部访问）服务器之间认证的典型配置。在第 39 章中，你将学习如何使用密码创建 SSH 密钥。\n\
  \n要创建密钥对，请使用 `ssh-keygen` 命令。接下来使用 `ssh-copy-id` 命令将公钥复制到目标服务器。在练习 5.4 中，你将学习如何操作。\n\
  \n## 练习 5.4 使用公钥/私钥连接到远程服务器\n\n在此练习中，你将创建一个公钥/私钥对以登录 `server2` 主机。如果没有可用的远程主机，可以使用\
  \ `localhost` 作为替代方案来验证该流程。\n\n1. 在 `server1` 上，打开一个 root shell。\n2. 输入 `ssh-keygen`。当询问是否要使用密码时，按\
  \ `Enter` 使用无密码设置。\n3. 当询问存储（私钥）密钥的文件名时，接受默认文件名 `~/.ssh/id_rsa`。\n4. 当被要求输入密码时，按两次\
  \ `Enter`。\n5. 私钥现在被写入到 `~/.ssh/id_rsa` 文件，公钥被写入 `~/.ssh/id_rsa.pub` 文件。\n6. 使用\
  \ `ssh-copy-id server2` 将你刚刚创建的公钥复制到 `server2`。然后你会被要求最后一次输入远程服务器的密码。\n7. 复制公钥后，验证其是否确实可以用于认证。要做到这一点，输入\
  \ `ssh server2`。你现在应该可以在无需输入远程用户账户密码的情况下通过认证。\n\n将公钥复制到远程主机后，它会被写入该主机上的 `~/.ssh/authorized_keys`\
  \ 文件。请注意，如果有多个用户使用密钥登录特定账户，`authorized_keys` 文件可能包含许多公钥。请确保永远不要覆盖它，因为这将擦掉其他用户使用的所有密钥！\n\
  \n## 使用 screen 命令\n\n对于 RHCSA 或 RHCE，你并不需要了解它，但 `screen` 命令是一个非常有用的命令，它允许你开启多个终端会话，即使你不在图形会话中。它不仅允许你运行多个终端，还允许与其他共享会话，或者连接和分离远程终端会话。在使用\
  \ `screen` 之前，你需要安装它。要执行此，请使用 `yum install -y screen` 命令。然后输入 `screen` 打开一个 screen\
  \ 会话。从 screen 会话中，你可以启动任何你喜欢的命令。\n\n`screen` 命令在从 SSH 会话中使用时特别有用。你可以在 screen 会话中启动一个耗时较长的任务，然后分离它，稍后重新连接。即使你回家并关闭电脑，命令也会继续运行。第二天，你可以轻松地重新连接\
  \ screen 会话以完成任务。要做到这一点，只需遵循简单的程序：\n\n1. 打开一个 SSH 会话。\n2. 从 SSH 会话中输入 `screen` 打开一个\
  \ screen 会话。\n3. 启动你想启动的任何任务并保持运行。\n4. 使用 `Ctrl+a, d` 键序列从 screen 会话中分离并退出 SSH 会话。\n\
  5. 当你准备好重新连接时，再次启动 SSH 会话。至关重要的是你必须使用之前相同的用户账户。\n6. 使用 `screen -r` 重新连接到 screen\
  \ 会话。\n\n将公钥拷贝到远程主机后，它会被写入该主机上的 `~/.ssh/authorized_keys` 文件。\n\n如果在尝试连接到 screen\
  \ 会话时，提示有多个 screen 会话正在运行，你需要更具体的指令。要查看正在运行的会话，使用 `screen -ls`。该命令显示所有可用的会话。要记住的命令是\
  \ `Ctrl+a, /`，这将关闭会话。\n\n**列表 5.2** 选择正确的 screen 会话\n\n点击此处查看代码图像\n\n```bash\n[sander@lab\
  \ ~]$ screen\n[detached from 30500.pts-0.lab]\n[sander@lab ~]$ screen\n[detached\
  \ from 30532.pts-0.lab]\n[sander@lab ~]$ screen -r\n这里有几个合适的 screen:\n         \
  \ 30532.pts-0.lab    (Detached)\n          30500.pts-0.lab    (Detached)\n输入 \"\
  screen [-d] -r [pid.]tty.host\" 来恢复其中一个。\n[sander@lab ~]$ screen -r 30500\n```\n\
  \n你还可以使用 screen 与其他用户共享同一会话。要这样做，请按照以下步骤操作：\n\n1. 确保两个用户都使用 SSH 连接到要协作的系统。两个用户在使用\
  \ SSH 连接时必须使用相同的用户账户。\n2. 一个用户需要使用 `screen` 命令启动一个 screen 会话。\n3. 另一个用户只需使用 `screen\
  \ -x` 连接到该会话。\n\n\n\n\n[content]\n\n在本章中，你学习了如何连接到 Red Hat Enterprise Linux 7。你学习了控制台（consoles）、终端（terminals）和\
  \ shell（shells）之间的区别，并学习了如何在本地以及远程上设置终端会话。你还学习了如何使用 `SSH` 连接到远程服务器，以及如何在服务器之间安全地复制文件。在本章的末尾，你学习了如何使用\
  \ `screen` 工具在会话中启动任务，并可以在以后分离（detach）它后再重新连接（reattach）。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\
  复习本章中最重要的主题，这些主题在页外边框用“关键主题”（Key Topic）图标标记。表 5.3 列出了这些关键主题及其对应的页码。\n\n![Image](img/05tab03.jpg)\n\
  \n**表 5.3** 第 5 章的关键主题\n\n#### 定义关键术语\n定义本章中的以下关键术语，并在术语表中检查你的答案：\n\nconsole\nterminal\n\
  tty\nlogin shell\nsubshell\nreboot\nsystemd\nkey-based login\npublic key\nprivate\
  \ key\n\n#### 复习题\n**1.** 什么是控制台（console）？\n\n**2.** 在一个当前运行着图形界面的服务器上，你处于一个基于文本的登录提示符。你使用哪个按键序列切换回图形界面？\n\
  \n**3.** 哪个命令可以显示所有当前在 Linux 服务器打开打开终端会话的用户？\n\n**4.** 在一个没有运行 GUI 的服务器上，你预计用于第一个打开到该服务器的\
  \ `SSH` 会话将使用的设备名称是什么？\n\n**5.** 使用哪个命令可以获取登录时 `SSH` 正在执行的详细信息？\n\n**6.** 如何启动一个支持图形应用程序的\
  \ `SSH` 会话？\n\n**7.** 修改 `SSH` 客户端设置需要编辑的配置文件名称是什么？\n\n**8.** 如何使用用户名 `lisa` 将 `/etc/hosts`\
  \ 文件复制到 server2 上的 `/tmp` 目录？\n\n**9.** 对于想要使用密钥认证登录到此机器的远程用户，存储其公钥的文件名称是什么？\n\n\
  **10.** 哪个命令允许你生成一对 `ssh` 公钥/私钥？\n\n### 章末实验\n章末实验帮助你练习在整个章节中中学到的知识。第一个实验关于如何从本地连接到\
  \ RHEL 7，第二个实验关于如何使用 `SSH` 登录到远程服务器。\n\n#### 实验 5.1\n**1.** 登录到 server1 上的本地控制台。确保\
  \ server1 *不再* 显示图形界面，而只是一个基于文本的登录提示符。在该环境中登录并激活 `tty6`。从 `tty6` 切换回图形界面，并使用正确的按键序列进入图形界面。\n\
  \n**2.** 设置基于 `SSH` 的认证。从 server2 开始，使用 `SSH` 连接到 server1。确保 `SSH` 会话支持图形应用程序。同时设置密钥认证，以便在连接到远程服务器时无需输入密码。\n\
  \n## 第 6 章 用户和用户组管理\n\n**本章涵盖了以下主题：**\n\n![Image](img/squf.jpg) 创建和管理用户账户\n![Image](img/squf.jpg)\
  \ 创建和管理组账户\n![Image](img/squf.jpg) 通过外部认证服务器登录\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\n![Image](img/squf.jpg)\
  \ 创建、删除和修改本地用户账户\n![Image](img/squf.jpg) 修改密码并调整本地用户账户的密码有效期\n![Image](img/squf.jpg)\
  \ 创建、删除和修改本地组及组组成\n![Image](img/squf.jpg) 配置系统使用现有的认证服务来获取用户和组信息\n\n在 Linux 系统上……\n\
  \n\n\n\n## 10. 在针对 LDAP 服务器设置身份验证时，你需要指定不同的项目。以下哪项*不属于*它们的一部分？\n\n**a.** Base DN\n\
  \n**b.** LDAP URI\n\n**c.** TLS 证书\n\n**d.** 管理员名称\n\n### 基础主题\n\n##不同的用户类型\n\n\
  在本章中，你将学习如何创建和管理用户账户。在深入用户管理的细节之前，你将先学习用户在 Linux 环境中是如何使用的。\n\n### Linux 用户\n\n\
  ![Image](img/key_topic.jpg)\n\n在 Linux 上，有两种看待系统安全的方法。有特权用户，也有非特权用户。默认的特权用户是 root。该账户对\
  \ Linux 服务器上的所有内容具有完全访问权限，并允许在系统空间中无限制地工作。root 用户旨在执行系统管理任务，且仅用于此类任务。对于所有其他任务，应使用非特权用户账户。\n\
  \n要获取用户账户的信息，你可以使用 `id` 命令。在命令行中使用此命令时，你可以看到当前用户的详细信息。你也可以对其他用户账户使用它来获取这些账户的详细信息。列表\
  \ 6.1 显示了命令输出的一个示例。\n\n**列表 6.1** 使用 `id` 获取更多用户信息\n\n点击此处查看代码图像\n\n* * *\n\n```\n\
  [root@localhost ~]# id linda\nuid=1001(linda) gid=1001(linda) groups=1001(linda)\n\
  ```\n\n* * *\n\n### 以 root 身份工作\n\n在所有 Linux 系统上，默认都有 root 用户，也称为超级用户（superuser）。该账户用于管理\
  \ Linux。例如，root 可以在系统上创建其他用户账户。某些任务需要 root 权限，示例包括安装软件、管理用户以及在磁盘设备上创建分区。通常来说，所有涉及直接访问设备的任务都需要\
  \ root 权限。\n\n由于 root 账户对管理 Linux 环境非常有用，有些人习惯了直接以 root 身份登录。但不建议这样做，特别是当你登录图形界面时。当你以\
  \ root 身份登录图形界面时，所有执行的任务都将以 root 身份运行，这涉及不必要的安全风险。因此，你应该使用以下备选方法之一。表 6.2 提供了这些方法的概述。\n\
  \n![Image](img/key_topic.jpg)![Image](img/06tab02.jpg)\n\n**表 6.2** 使用提升权限运行任务的方法\n\
  \n### 使用 su\n\n`su` 命令允许用户打开终端窗口，并在该终端启动一个用户拥有另一个身份的子 shell（sub shell）。例如，为了执行管理任务，你可以用普通用户账户登录并输入\
  \ `su` 来打开 root shell。这样做的好处是，只有在 root shell 中才会使用 root 特权。\n\n如果只输入命令 `su`，则隐含用户名为\
  \ root。但 `su` 也可以用于以另一个用户的身份运行任务。例如，输入 `su linda` 以用户 linda 的身份打开一个子 shell。当作为普通用户使用\
  \ `su` 时，系统会提示输入密码，在输入密码后你就获得了目标用户的凭据：\n\n```\n[linda@localhost ~]$ su\nPassword:\n\
  [root@localhost linda]#\n```\n\n使用 `su` 时，会启动一个子 shell。这是一个你可以以目标用户账户工作的环境，但该用户账户的环境尚未设置。如果你需要完全访问目标用户账户的整个环境，可以使用\
  \ `su -` 启动一个登录 shell（login shell）。如果你启动了登录 shell，组成用户环境的所有脚本将被处理，这使得你的工作环境与登录该用户时的环境完全相同。\n\
  \n* * *\n\n提示\n\n使用 `su -` 比使用 `su` 好。使用 `-` 时会启动登录 shell，如果不使用 `-`，某些变量可能无法正确设置。因此，你最好直接使用\
  \ `su -`。\n\n* * *\n\n### sudo\n\n非特权用户可以使用 root 用户账户，可以通过 `sudo` 配置在特定任务上使用管理员权限。配置\
  \ `sudo` 后，普通用户将拥有 sudo 权限，在使用这些权限时，他们将使用 `sudo` 启动命令。因此，你不再以 root 用户身份使用 `useradd`\
  \ 等命令，而是使用普通用户账户并输入 `sudo useradd`。这绝对更安全，因为你只有在运行此特定命令时才能表现出管理员权限。\n\n在安装过程中创建\
  \ Linux 用户时，你可以选择授予该特定用户管理员权限。如果你选择这样做，该用户将能够使用 `sudo` 使用所有管理员命令。在安装后设置 sudo 权限也是可能的。要非常方便地实现，你需要完成一个简单的两步程序：\n\
  \n**1.** 使用 `usermod -aG wheel user` 使管理用户账户变为 wheel 组的成员。\n\n**2.** 输入 `visudo`\
  \ 并确保包含 `%wheel ALL=(ALL) ALL` 这一行。\n\n### PolicyKit\n\n大多数管理程序使用 PolicyKit 来验证\
  \ root 身份。如果组成员的普通用户访问此类应用程序，将会被提示输入密码。\n\n**练习 6.1 切换账户**\n\n1. 以非特权用户登录系统。\n2.\
  \ 输入 `whoami` 查看你正在使用哪个用户账户。同样输入 `id`，注意你获得了更多详细信息。\n3. 输入 `su`。在提示密码时，输入 root 密码。再次输入\
  \ `id`。你会发现现在是 root。\n4. 输入 `visudo` 并确保包含 `%wheel ALL=(ALL) ALL` 这一行。\n5. 输入 `useradd\
  \ -G wheel lisa` 创建一个该组成员的用户 lisa。\n6. 输入 `id lisa` 验证她已添加到该组。\n7. 通过输入 `passwd\
  \ lisa` 为 lisa 设置密码。输入两次密码。\n8. 注销并以 lisa 登录。\n9. 输入 `sudo useradd lori`。在被询问时输入密码。你会注意到用户\
  \ lori 将创建。\n\n* * *\n\n#### 管理用户账户\n\n现在你已经知道了如何以管理员或非管理员身份执行任务，现在是时候学习如何在 Linux\
  \ 上管理用户账户了。在本节中，你将学习涉及的内容。\n\n### 系统账户和普通账户\n\n在典型的 Linux 环境中存在两种用户账户。一种是需要在服务器上工作且对服务器资源拥有有限访问权限的用户账户。这些用户账户通常有一个用于验证用户身份的密码。还有用于服务器提供的服务的系统账户。两种用户账户共享共同属性，这些属性存储在\
  \ `/etc/passwd` 和 `/etc/shadow` 文件中。列表 6.2 显示了 `/etc/passwd` 文件的内容。\n\n**列表 6.2**\
  \ /etc/passwd 用户配置文件部分内容\n\n```\nntp:x:38:38::/etc/ntp:/sbin/nologin\nchrony:x:994:993::/var/lib/chrony:/sbin/nologin\n\
  abrt:x:173:173::/etc/abrt:/sbin/nologin\n```\n\n\n\n\n\n```\npulse:x:171:171:PulseAudio\
  \ System Daemon:/var/run/pulse:/sbin/nologin\n\ngdm:x:42:42::/var/lib/gdm:/sbin/nologin\n\
  \ngnome-initial-setup:x:993:991::/run/gnome-initial-setup/:/sbin/nologin\n\npostfix:x:89:89::/var/spool/postfix:/sbin/nologin\n\
  \nsshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nologin\n\ntcpdump:x:72:72::/:/sbin/nologin\n\
  \nuser:x:1000:1000:user:/home/user:/bin/bash\n```\n\n* * *\n* * *\n\n## Note**\n\
  \n在许多 Linux 服务器上，没有供人类使用的用户账户。许多 Linux 服务器的安装目的是运行特定的服务，如果人们与该服务交互，他们将在服务内部进行身份验证。\n\
  \n* * *\n\n如你所见，为了定义用户账户，`/etc/passwd` 中使用了不同的字段。这些字段之间用冒号分隔。下面是这些字段的总结，随后是它们用途的简短描述。\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) **用户名：** 这是用户的唯一名称。用户名对于将用户与其密码相匹配至关重要，密码单独存储在\
  \ `/etc/shadow` 中（见下文）。在 Linux 上，用户名中不能包含空格。\n\n![Image](img/squf.jpg) **密码：** 在过去，`/etc/passwd`\
  \ 的第二个字段被用于存储用户的密码哈希值。由于 `/etc/passwd` 文件对所有用户都是可的，这构成了安全威胁。因此，在当前的 Linux 系统中，密码哈希值被存储在\
  \ `/etc/shadow` 中（将在下一节讨论）。\n\n![Image](img/squf.jpg) **UID：** 每个用户都有一个唯一的用户 ID（`UID`）。这是一个数字\
  \ ID。正是这个 `UID` 决定了用户可以做什么。当为用户设置权限时，`UID` 存储在文件元数据中（而不是用户名中）。`UID` 0 留给 root，即不受限制的用户账户。较低的\
  \ `UIDs`（通常到 999）用于系统账户，较高的 `UIDs`（默认从 1000 开始）留给需要连接到服务器的用户。用于创建普通用户账户的 `UID` 范围在\
  \ `/etc/login.defs` 中设置。\n\n![Image](img/squf.jpg) **GID：** 在 Linux 上，每个用户至少都是一个组的成员。该组被称为\
  \ `主组`（primary group），该组在权限管理中起着核心作用，将在本章稍后讨论。\n\n![Image](img/squf.jpg) **注释字段：**\
  \ 如你所猜的，注释字段用于为用户账户添加注释。该字段是可选的，但可以用来描述创建用户账户的用途。某些工具（例如已过时的 `finger` 工具）可以从该字段中获取信息。该字段也被称为\
  \ `GECOS` 字段，代表通用电气综合操作系统（General Electric Comprehensive Operating System），在 20\
  \ 世纪 70 年代初，当通用电气还是重要的服务器制造商时，它有一个特定的用途，用于识别作业。\n\n![Image](img/squf.jpg) **目录：**\
  \ 这是用户登录后所处的初始目录，也被称为 `主目录`（home directory）。如果用户账户由人类使用，这里就是该用户存储个人文件和程序的地方。对于系统用户账户，这是服务在运行时存储其所需文件的环境。\n\
  \n![Image](img/squf.jpg) **Shell：** 这是用户成功连接到服务器后启动的程序。对于大多数用户来说，这将是 `/bin/bash`，即默认的\
  \ Linux shell。对于系统用户账户，它通常是一个像 `/sbin/nologin` 这样的 shell。`/sbin/nologin` 命令是一个特定的命令，用于静默地拒绝用户的访问（以确保如果入侵者意外登录服务器，他们无法获得任何\
  \ shell 访问权限）。你可以创建一个名为 `/etc/nologin.txt` 的文件，其中包含的消息将在以 `/sbin/nologin` 为 shell\
  \ 的用户尝试登录时显示。\n\n用户属性的属性存储在 `/etc/passwd` 中（我们刚刚讨论了该文件）。用户属性的属性配置的另一部分在 `/etc/shadow`\
  \ 中。该文件中的设置用于定义密码的有效性。`/etc/shadow` 的典型特征是除了超级用户 root 和以 root 权限运行的进程（例如服务器上的身份验证机制）之外，没有人有权限访问它，这是合理的，因为它包含了连接系统所需的所有信息。[列表\
  \ 6.3] 显示了 `/etc/shadow`内容的示例。\n\n**列表 6.3** `/etc/shadow` 示例内容\n\n点击此处查看代码图像\n\n\
  * * *\n\n```\n[root@localhost ~]# tail -n 10 /etc/shadow\n\nntp:!!:16420::::::\n\
  \nchrony:!!:16420::::::\n\npulse:x:171:171:PulseAudio System Daemon:/var/run/pulse:/sbin/nologin\n\
  \ngdm:x:42:42::/var/lib/gdm:/sbin/nologin\n\ngnome-initial-setup:x:993:991::/run/gnome-initial-setup/:/sbin/nologin\n\
  \npostfix:x:89:89::/var/spool/postfix:/sbin/nologin\n\nsshd:x:74:74:Privilege-separated\
  \ SSH:/var/empty/sshd:/sbin/nologin\n\ntcpdump:x:72:72::/:/sbin/nologin\n\nuser:x:1000:1000:user:/home/user:/bin/bash\n\
  ```\n\n* * *\n\n以下字段定义在 `/etc/shadow` 中：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ **登录名：** 注意 `/etc/shadow` 不包含 UID，只有用户名。\n\n![Image](img/squf.jpg) **加密密码：** 该字段包含了存储密码所需的所有信息。\n\
  \n![Image](img/squf.jpg) **自 1970 年 1 月 1 日以来密码更改的天数：** Linux 许多事物都引用此日期，也称为 epoch。\n\
  \n![Image](img/squf.jpg) **密码可以更改的天数：** 这允许系统管理员使用更严格的密码策略，即在更改密码后立即再次更改。通常该字段被设置为\
  \ 0。\n\n![Image](img/squf.jpg) **密码后必须更改的天数：** 该字段包含了密码的最有效期限。\n\n![Image](img/squf.jpg)\
  \ **密码过期前警告用户的天数：** 该字段用于在强制更改密码临近时警告用户。注意默认值设置为 7 天（即使密码有效期设置为 9999 天！）。\n\n![Image](img/squf.jpg)\
  \ **密码过期后账户禁用的天数：** 管理员可以设置此字段来禁用账户。这通常是删除账户更好的方法，因为账户的所有关联属性和文件将被保留，但它将不再用于在服务器上进行身份验证。\n\
  \n![Image](img/squf.jpg) **一个预留字段，曾为了“未来使用”而添加：** 那是很以前了，可能永远不会被使用。\n\n大多数密码属性可以使用\
  \ `passwd` 或 `chage` 命令进行管理，这些命令在本章稍后讨论。\n\n### 创建用户\n\n在 Linux 服务器上创建用户有许多解决方案。首先，你可以直接编辑\
  \ `/etc/passwd` 和 `/etc/shadow` 文件（但这可能会导致错误，使人都无法登录；所以最好不要这样做）。还有 `useradd`。`useradd`\
  \ 是你在创建用户时应该使用的工具。要删除用户，可以使用 `userdel` 命令。使用 `userdel -r` 删除用户，包括整个用户环境。\n\n###\
  \ 修改配置文件\n\n\n\n\n要添加用户账户，只需在 `/etc/passwd` 中添加一行，并在 `/etc/shadow` 中添加另一行，这两个文件定义了用户账户及其所有属性。然而，并不建议这样做。由于操作失误，你可能会破坏文件的一致性，导致任何人都完全无法登录。此外，当一个管理员尝试直接修改文件内容，而另一位管理员想用某些工具写入修改时，你可能会遇到锁定问题。\n\
  \n如果你坚持要直接修改配置文件，应该使用 `vipw`。该命令会在你的配置文件上打开编辑器界面，更重要的是，它会在配置文件上设置适当的锁以防止损坏。然而，它*并不会*检查语法，因此请确保你清楚自己在做什么，因为即使只是一个拼写错误，也也可能严重搞乱你的服务器。如果你想使用此工具修改\
  \ `/etc/shadow` 文件，请使用 `vipw -s`。要编辑定义组的 `/etc/group` 文件内容，则存在一个名为 `vigr` 的类似命令。\n\
  \n### 注意\n\n知道 `vipw` 和 `vigr` 的存在是一件好事，但最好不要使用这些工具或任何直接打开用户和组配置文件的程序。相反，请使用 `useradd`\
  \ 和 `groupmod` 等工具。\n\n### 使用 useradd\n\n`useradd` 实用可能是 Linux 上管理用户最常用的工具。它允许你通过使用许多参数从命令行添加用户账户。例如，使用命令\
  \ `useradd -m -u 1201 -G sales,ops linda` 来创建一个名为 `linda` 的用户，她是 `sales` 和 `ops`\
  \ 组的成员，UID 为 `1201`，并同时为该用户账户添加主目录。\n\n### 主目录\n\n所有普通用户将有一个主目录。对于个人来说，主目录是存储个人文件的目录。对于系统账户，主目录通常包含服务账户的工作环境。\n\
  \n作为管理员，你通常不会更改系统账户的主目录相关设置，因为它们在安装相关软件包时，是由 RPM 安装后脚本自动创建的。如果你有需要用户账户的人，你可能想要管理一下主目录的内容。\n\
  \n如果在创建用户账户时告诉服务器同时添加主目录（例如通过使用 `useradd -m`），则“骨架”目录的内容会被复制到用户主目录。骨架目录是 `/etc/skel`，它包含了在创建目录创建时复制到用户主目录的文件。这些文件也将获得适当的权限，以确保新用户可以使用并访问它们。\n\
  \n默认情况下，骨架目录主要包含决定用户环境如何设置的配置文件。如果你的环境中需要在所有用户的主目录中存在某些特定文件，你可以通过将这些文件添加到骨架目录来解决这个问题。\n\
  \n### 管理用户属性\n\n更改用户属性的规则与创建用户账户的规则相同。你可以使用 `vipw` 直接在配置文件中操作，也可以使用命令行工具。\n\n修改用户属性的终极命令行工具是\
  \ `usermod`。它可以用于设置存储在 `/etc/passwd` 和 `/etc/shadow` 中的所有用户属性，并可以完成一些额外任务，如管理组组成关系。它有一项任务它执行得并不好：设置密码。虽然\
  \ `usermod` 有一个选项 `-p` 提示“对新密码使用加密密码”，但它要求你在添加用户账户之前完成密码加密。这并没让它变得特别有用。如果你以 root\
  \ 身份更改用户密码，最好使用 `passwd` 命令。\n\n### 用户管理默认值的配置文件\n\n在使用如 `useradd` 等工具时，会假设某些默认值。这些默认值设置在两个配置文件中：`/etc/login.defs`\
  \ 和 `/etc/default/useradd`。[列表 6.4] 显示了 `/etc/default/useradd` 的内容。\n\n**列表 6.4**\
  \ /etc/default/useradd 中的 useradd 默认值\n\n点击此处查看代码\n\n```\n[root@localhost skel]#\
  \ cat /etc/default/useradd\n\n## useradd defaults file\nGROUP=100\nHOME=/home\n\
  INACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n```\n\
  \n如[列表 6.4]所示，`/etc/default/useradd` 文件包含了在使用 `useradd` 时应用的一些默认值。\n\n在 `/etc/login.defs`\
  \ 文件中，设置了不同的登录相关变量。该文件被不同的命令使用，与为新用户设置适当的环境有关。以下是可以从 `/etc/login.defs` 设置的一些最重要的属性列表：\n\
  \n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg) **MOTD_FILE:** 定义用作“每日消息”的文件。在该文件中，你可以包含在用户成功登录服务器后显示的消息。\n\
  \n![Image](img/squf.jpg) **ENV_PATH:** 定义 `$PATH` 变量，即登录后应该搜索可执行执行文件的目录列表。\n\n![Image](img/squf.jpg)\
  \ **PASS_MAX_DAYS, PASS_MIN_DAYS**, 和 **PASS_WARN_AGE:** 定义创建新用户时的默认密码过期属性。\n\n\
  ![Image](img/squf.jpg) **UID_MIN:** 创建新用户时使用的第一个 UID。\n\n![Image](img/squf.jpg)\
  \ **CREATE_HOME:** 表示是否为新用户创建主目录。\n\n![Image](img/squf.jpg) **USERGROUPS_ENAB:**\
  \ 设置为 yes 可为所有新用户创建一个私有组。这意味着新用户将拥有一个与用户名同名的组作为默认组。如果设置为 no，则所有用户都成为 users 组的成员。\n\
  \n### 管理密码属性\n\n你已经学习了可以在 `/etc/shadow` 中设置的密码属性。你可以使用两个命令来更改用户的这些属性：`chage` 和 `passwd`。这些命令非常直观。例如，命令\
  \ `passwd -n 30 -w 3 -x 90 linda` 设置用户 `linda` 的密码，最小使用期为 30 天，在 90 天后过期，并在到期前 3\
  \ 天生成警告。\n\n许多可以通过 `passwd` 完成的任务也可以用 `chage` 完成。例如，使用 `chage -E 2015-12-31 bob`\
  \ 让用户 `bob` 的账户在 2015 年 12 月 31 日过期。要查看当前密码设置，请使用 `chage -l`（见列表 6.5）。\n\n**列表 6.5**\
  \ 使用 chage -l 显示过期信息\n\n```\nlinux:~ # chage -l linda\nLast password change:   \
  \      Apr 11, 2015\nPassword expires:             Jul 10, 2015\nPassword inactive:\
  \            never\nAccount expires:             never\n密码更改之间的最小天数: 30\n密码更改之间的最大天数:\
  \ 90\n密码过期前的警告天数: 3\n```\n\n### 创建用户环境\n\n当用户登录时，会创建一个环境。该环境由决定用户环境如何使用的变量组成。例如，其中变量就是\
  \ `$PATH`，它定义了用户输入命令时应该搜索的可执行文件目录列表。\n\n为了构建用户环境，有几个文件起着作用：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) **/etc/profile:** 用于在启动登录 shell 时为所有用户设置默认。\n\n![Image](img/squf.jpg)\
  \ **/etc/bashrc:** 用于在启动子 shell 时为所有用户定义默认值。\n\n\n\n\n![Image](img/squf.jpg) `~/.profile:`:\
  \ 在启动登录 shell 时应用到单个用户的特定设置。\n\n![Image](img/squf.jpg) `~/.bashrc:`: 在启动子 shell\
  \ 时应用到单个用户的特定设置。\n\n在登录时，这些文件按照此顺序被读取，在这些文件中定义的变量和其他设置将生效。如果一个变量或设置在多个文件中出现，则以最后一次为准。\n\
  \n* *\n\n## 练习 6.2 创建用户账户\n\n在练习中，你将应用常用解决方案来创建用户账户。\n\n**1.** 输入 `vim /etc/login.defs`\
  \ 打开配置文件 `/etc/login.defs`，并在开始创建日志之前更改一些参数。寻找 `CREATE_HOME` 参数并确保它被设置为“yes”。还将将\
  \ `USERGROUPS_ENAB` 参数设置为“no”，这使得新用户被添加到与用户名同名的组中，而不会被添加到其他组。\n\n**2.** 使用 `cd /etc/skel`\
  \ 进入 `/etc/skel` 目录。输入 `mkdir Pictures` 和 `mkdir Documents` 为所有用户的家目录添加两个默认目录。还更改\
  \ `.bashrc` 文件的内容，包含 `export EDITOR=/usr/bin/vim` 行，这为需要修改文本文件的工具设置默认编辑器。\n\n**3.**\
  \ 输入 `useradd linda` 为用户 linda 创建账户。然后，输入 `id linda` 验证 linda 是否是名为 linda 的组的成员且仅是该组。同时验证\
  \ linda 的家目录下是否已创建了 `Pictures` 和 `Documents` 目录。\n\n**4.** 使用 `passwd linda` 为你创建的用户设置密码。使用密码\
  \ `password`。\n\n**5.** 输入 `passwd -n 30 -w 3 -x 90 linda` 来更改密码属性。这将密码在 90 天后过期（`-x\
  \ 90`）。在过期前 3 天，用户将收到警告（`-w 3`），并且在更改之前必须至少使用 30 天（`-n 30`）。\n\n**6.** 使用 `for i\
  \ in lisa lori bob; do useradd $i; done` 创建更多用户：lisa, lori 和 bob。\n\n**7.** 使用 `grep\
  \ lori /etc/passwd /etc/shadow /etc/group`。这显示了在三个关键文件中都创建的用户 lori，并确认它们已正确设置。\n\
  \n* *\n\n## 创建和管理组账户\n\n每个 Linux 用户都必须至少是一个组的成员。在本节中，你将学习如何管理 Linux 组账户的设置。\n\n\
  ## 理解 Linux 组\n\nLinux 用户可以是两种不同组的成员。首先是主组。每个用户都必须是主组的成员，且只有一个主组。在创建文件时，主组成为这些文件的组所有者。（文件所有权将在第\
  \ 7 章“权限管理”中详细讨论）。用户也可以访问其主组有权访问的所有文件。用户的主组组成关系定义在 `/etc/passwd` 中；组本身存储在 `/etc/group`\
  \ 文件中。\n\n除了强制性的主组外，用户还可以是一个或多个辅助组的成员。辅助组对于访问文件至关重要。如果用户所属的组对特定文件有权限，则用户也将获得这些文件的访问权限。处理辅助组非常重要，特别是在\
  \ Linux 被用文件服务器的环境中，允许不同部门的工作人员相互共享文件。\n\n### 创建组\n\n与创建用户一样，创建组也有不同的选项。可以使用 `vigr`\
  \ 或命令行实用工具 `groupadd` 直接修改组配置文件。\n\n### 使用 vigr 创建组\n\n通过 `vigr` 命令，你可以直接在 `/etc/group`\
  \ 配置文件上打开编辑器界面。在该文件中，每个组由四个字段定义（见列表 6.6）。\n\n**列表 6.6** 示例 /etc/group 内容\n\n点击此处查看代码图片\n\
  \n* *\n\n```\nkvm:x:36:qemu\nqemu:x:107:\nlibstoragemgmt:x:994:\nrpc:x:32:\nrpcuser:x:29:\n\
  \"/etc/group.edit\" 65L, 870C\n```\n\n* *\n\n以下字段被用于 `/etc/group`：\n\n![Image](img/squf.jpg)\
  \ **组名：** 正如字段名称所示，它包含了组名。\n\n![Image](img/squf.jpg) **组密码：** 一个几乎不再使用的功能。想要临时加入该组的用户可以使用组密码，以便允许访问该组有权访问的文件。\n\
  \n![Image](img/squf.jpg) **组 ID：** 唯一的数字组标识符。\n\n![Image](img/squf.jpg) **成员：**\
  \ 在这里你可以找到作为辅助组组成该组的用户名。注意，它不会显示作为主组组成该组的用户。\n\n### 使用 groupadd 创建组\n\n另一种创建组的方法是使用\
  \ `groupadd`。该命令易于使用。使用 `groupadd` 后加上你想要添加的组名即可。有一些高级选项，其中 `-g` 允许你在创建组时指定组 ID。\n\
  \n### 管理组属性\n\n要管理组属性，可以使用 `groupmod`。你可以使用此命令更改组的名称或组 ID，但它不允许添加成员。如前所述，`usermod`\
  \ 将用户添加到组。\n\n* *\n\n**提示**\n\n由于定义在两个不同的地方，很难找出用户属于哪些组。一个方便的命令是 `groupems`。例如，使用命令\
  \ `groupems -g sales -l` 查看该组的成员。这显示了作为辅助组组成该组的用户，同时也显示了作为主组组成的用户。\n\n## 练习 6.3\
  \ 操作组\n\n在此练习中，你将创建两个组并将一些用户加入其中。\n\n1.** 输入 `groupadd sales` 然后是 `groupadd account`\
  \ 创建名为 sales 和 account 的组。\n\n2.** 使用 `usermod` 将 linda 和 lisa 添加到 sales 组，将 lori\
  \ 和 bob 添加到 account 组：\n\n```\nusermod -aG sales linda\nusermod -aG sales lisa\n\
  usermod -aG account lori\nusermod -aG account bob\n```\n\n3.** 输入 `id linda` 验证用户\
  \ linda 已正确添加到 sales 组。命令结果显示 linda 被分配到 gid=100(users)。这是她的主组。通过 groups 参数，她作为辅助组成的所有组都被列出：\n\
  \n点击此处查看代码图片\n\n```\nlinux:~ # id linda\nuid=1000(linda) gid=100(users) groups=1000(sales),100(users)\n\
  ```\n\n* *\n\n## 通过外部认证服务登录\n\n当用户输入登录名和密码时，这些通常会在本地服务器上进行检查。如果你的环境中使用了许多服务器，这种方法并不是最优的，你可能会受益于一个帮助管理用户和组的集中式服务。为了提供此类集中认证服务，LDAP\
  \ 是一种常用解决方案。\n\n### 理解 LDAP\n\n轻量级目录访问协议 (LDAP) 是作为从 X.500 目录服务获取信息的协议。该服务最初作为地址录开发。目前，LDAP\
  \ 已进一步发展为一种可以作为集中认证服务的工具。\n\n\n\n\n\nLDAP 是一种开放标准，许多目录服务使用 LDAP 作为其访问协议。一些常见的 LDAP\
  \ 解决方案包括 OpenLDAP，或集成在红帽身份管理（Red Hat Identity Management）解决方案中的 LDAP 服务器，该方案也称为\
  \ FreeIPA。对于 RHCSA 考试，你不需要知道如何自己搭建 LDAP 服务器，但你确实需要能够配置一个用于 LDAP 认证的客户端。\n\nLDAP\
  \ 目录服务器以层次、分布式和复制的方式进行组织：\n\n![Image](img/squf.jpg) LDAP 是分层的；它的结构类似于 DNS，使用域（在\
  \ LDAP 中称为容器，containers）来以符合逻辑的方式组织叶子节点对象（如用户）。\n\n![Image](img/squf.jpg) LDAP 是分布式的，因为整个数据库不需要在单台服务器上可用。LDAP\
  \ 层次结构中的不同容器可以分布在多个服务器上，以确保信息在需要的地方可用。为了在 LDAP 目录中分发信息，目录树被划分为不同的部分。\n\n![Image](img/squf.jpg)\
  \ LDAP 是可复制的；可以为其中一个分区创建多个副本。\n\n在图 6.1 中，你可以看到 LDAP 目录的示意概览。这是一个匹配 DNS 域名 rhatcert.com\
  \ 的虚拟 LDAP 环境。该 LDAP 环境跨越两个地理区域：SFO 和 AMS。由于 SFO 的用户登录或访问 AMS 资源的情况并不经常发生，因此目录树被分为两部分，一个用于\
  \ SFO 地区，另一个用于 AMS 地区。每个地理区域的每台服务器都将知道访问另一个分区中的信息；由于需要访问远程服务器，速度会慢一些。\n\n![Image](img/06fig01.jpg)\n\
  \n**图 6.1** LDAP 示意概览。\n\n为了提高可访问性和容错能力，每个地理区域都有两个不同的服务器。在每台服务器上都存储了分区的副本。这允许工作负载在服务器之间负载均衡，同时也提供了容错能力。当用户连接到\
  \ LDAP 时，他们需要指定要访问的特定服务器。\n\n![Image](img/key_topic.jpg)\n\n图 6.1 还显示了用户位于 LDAP\
  \ 中的两个特定容器中。启用 LDAP 访问时，用户需要指定使用哪个容器作为其基础环境。这被称为 `base context`（基上下文）。基上下文的名称始终写为包含完整路径的名称（完全限定名称，DN）。该名称包含类型指示符和逗号来分隔不同的部分。因此，包含用户的两个容器是\
  \ `dc=sfo,dc=rhatcert,dc=com` 和 `dc=ams,dc=rhatcert,dc=com`。\n\n访问 LDAP 服务器时，安全性至关重要。为了确保基础安全性，使用了传输层安全\
  \ (TLS) 证书。这些证书确保了 LDAP 用户正在认证的服务器经过了验证，并确保用户凭据在网络上传输时是安全的。\n\n在 LDAP 服务器上进行认证，有两种选项：\n\
  \n![Image](img/squf.jpg) 密码认证\n\n![Image](img/squf.jpg) Kerberos 认证\n\n要通过 RHCSA\
  \ 考试，你必须能够设置基于密码的 LDAP 认证。Kerberos 认证属于 RHCE 的要求，并涵盖在第 24 章“配置时间服务”中。\n\n### 使认证平台可用\n\
  \n对于 RHCSA 考试，你不需要知道如何设置 LDAP 服务器。你只需要知道如何配置你的服务器以在已存在的外部 LDAP 服务器上进行认证。如果你想测试是否能成功在外部服务器上进行认证，你需要一个\
  \ LDAP 服务器。\n\n配置 LDAP 认证平台简单的方法是安装红帽身份管理服务器。在附录 D“设置身份管理”中，你可以阅读到如何操作。此外，可以在 [`www.rhatcert.com`](http://www.rhatcert.com)\
  \ 下载预配置的服务器。确保已注册。注册后，你就可以访问一个包含 FreeIPA 服务器的完全配置好的环境。你在压缩文件中可以找到一个包含虚拟机文件的 readme\
  \ 文件，其中解释了如何设置此环境。\n\n为 配置 RHEL 7 进行 LDAP 认证\n\n要为 RHEL 7 设置 LDAP 认证，你需要创建一个配置文件，说明使用哪个\
  \ LDAP 服务器、使用哪种 TLS 证书以及应该使用 LDAP 中的哪个容器作为基 LDAP URL。为了指定所有内容，可以使用三种不同的工具：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) `authconfig`: 一个命令行工具，你必须通过命令行选项来指定所有你想做的事。\n\n![Image](img/squf.jpg)\
  \ `authconfig-tui`: 一个菜单驱动的文本界面，允许从列表中选择选项。\n\n![Image](img/squf.jpg) `authconfig-gtk`:\
  \ 一个带有图形界面的工具，因此仅在图形环境下使用。\n\n取决于你使用的工具，会配置不同的认证后端。使用 `authconfig-tui` 时配置的是 `nslcd`。使用\
  \ `authconfig-gtk` 时使用的是 `sssd`。\n\n#### Tip\n如果你在配置任何内容之前安装了 `sshd`，你会发现自己使用的是\
  \ `sssd` 而不是 `nslcd`。这就是为什么在后续章节中要同时学习它们。\n\n#### 管理 nslcd\n当你使用 `authconfig-tui`\
  \ 时，你的服务器上配置了 `nslcd` 服务。该服务确保你的系统在本地用户之外查找 LDAP。`nslcd` 服务使用名为 `/etc/nslcd.conf`\
  \ 的配置文件。在该文件中，你可以找到连接 LDAP 所需的所有设置。在列表 6.7 中，你可以看到该文件的内容。\n\n**列表 6.7** `nslcd.conf`\
  \ 中的 LDAP 连接参数\n\n点击此处查看代码\n\n```\n[root@localhost ~]# cat /etc/nslcd.conf | grep\
  \ -v ^# | grep ^[a-Z]\nuid nslcd\ngid ldap\nuri ldap://ipa.example.com\nbase dc=example,dc=com\n\
  tls_reqcert never\nssl start_tls\ntls_cacert /etc/openldap/cacerts\n```\n\n\n\n\n\
  在确保已安装 `sssd` 服务后，如果你使用 `authconfig-gtk` 初始化了与 LDAP 服务器的连接，该配置将写入 `sssd`。在这种情况下，`sssd`\
  \ 服务将与本地身份验证程序集成，并将所有验证请求重定向到 LDAP。\n\n使用 `sssd` 时，你应该通过 `systemctl status sssd`\
  \ 检查该服务是否正在运行。如果是，你可以检查 `/etc/sss/sssd.conf` 中的配置。通常情况下，不需要直接修改 `/etc/sssd/sssd.conf`\
  \ 中的配置，因为它是由 `authconfig-gtk` 写入的，但为了验证目的，你可能仍然想查看。你可以在此文件中找到所有与 LDAP 相关的配置行。\n\n\
  ***\n\n**提示**\n\n在考试中，请准备好同时使用 `nslcd` 和 `sssd`。对两者都做好准备可以确保你不会因为不知道正在发生什么而遇到麻烦。考试期间重点关注的工具是\
  \ `authconfig-tui`，因为它不需要许多资源和额外的程序即可运行。\n\n***\n\n***\n\n**注意**\n\n当你使用 `authconfig-tui`\
  \ 时，`/etc/sysconfig/authconfig` 中的变量 `FORCELEGACY=yes` 会被设置。这将使用 `nslcd` 而不是 `sssd`。\n\
  \n***\n\n***\n\n**提示**\n\n另阅第 25 章“配置外部身份验证与授权](#ch25.html_ch25)”获取更多关于设置外部身份验证的信息。\n\
  \n***\n\n***\n\n### 练习 6.4 连接到外部 LDAP 服务器\n\n本练习假设你已经安装了 FreeIPA 提供的 LDAP 服务器。该服务器的设置见附录\
  \ D。或者，也可以从 [`rhatcert.com`](http://rhatcert.com) 下载完整的实验环境。请确保已注册。实验环境仅供注册用户免费下载。此处描述的所有任务都在你的测试服务器上执行：\n\
  \n**1.** 在你的服务器上设置主机名解析，以便通过名称使用 LDAP 服务器。在本次练习中，IP 地址 `192.168.122.200` 用于 LDAP\
  \ 服务器。请根据你使用的设置进行更改，并在 `/etc/hosts` 文件中输入以下行：\n\n点击此处查看代码图像\n\n```\n192.168.122.200\
  \      ipa.example.com\n```\n\n**2.** 输入 `yum groupinstall -y “Directory Client”。\n\
  \n**3.** 输入 `scp ipa.example.com:/root/cacert.p12/etc/openldap/cacerts`。\n\n**4.**\
  \ 以 root 身份输入 `authconfig-tui`。在现在打开的文本用户界面中，在 User Information（用户信息）下选择 `Use LDAP`，在\
  \ Authentication（身份验证）下选择 `Use LDAP Authentication`。不要取消任何默认选中的选项（参见图 6.2）。\n\n\
  ![Image](img/06fig02.jpg)\n\n**图 6.2** 使用 `authconfig-tui` 配置身份验证。\n\n**5.** 在下一个屏幕中，系统会提示你是否应该使用\
  \ TLS，参见图 6.3。选择 `Use TLS`，然后输入服务器 URL `ldap://ipa.example.com`。确保 base DN 设置为 `dc=example,dc=com`。然后点击\
  \ OK 继续。\n\n![Image](img/06fig03.jpg)\n\n**图 6.3** 配置 TLS 设置。\n\n**6.** 你现在会看到一条消息，指示将签署\
  \ LDAP 服务器公钥证书的 CA 证书复制到 `/etc/openldap/cacerts`。你已经在练习的步骤 3 中完成了此操作，因此此处操作。\n\n\
  **7.** 打开 `/etc/nslcd.conf` 文件并确保它包含 `tls_reqcert never` 行。使用 `systemctl restart\
  \ nslcd` 重启 `nslcd` 服务。\n\n**8.** 使用 `su - lara` 验证你现在是否可以访问 IPA 服务器上的用户。在 IPA 服务器上，创建了一个名为\
  \ `lara` 的用户。你注意到你正以该用户登录，但也会收到一个警告，提示无法设置目录。目前，你可以忽略该警告。\n\n***\n\n#### 总结\n\n\
  在本章中，你学习了如何创建用户和组。你学习了使用哪些配置文件来存储用户和组，并学习了这些文件中使用了哪些属性。你还学习了可以使用哪些工具来管理用户和组账户。\n\
