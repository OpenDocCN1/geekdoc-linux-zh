  \n\n\n\n\n### 3. 设置一个 SMTP 服务器。所有在 `server1` 上发送的消息都应该中继到 `server2`。同时将 `server2`\
  \ 设置为中继服务器。\n\n### 4. 在 `server2` 上，创建 `sales` 和 `account` 组。创建两个用户 `marcha` 和 `marion`（为\
  \ `sales` 组的成员），以及 `suzan` 和 `cindy`（为 `account` 组的成员）。将所有用户的密码设置为 `password`。\n\
  \n### 5. 在 `server1` 上配置一个 Samba 服务器。该服务器应该共享 `/srv/samba/sales` 和 `/srv/samba/account`\
  \ 目录。`sales` 共享仅允许 `sales` 组的成员访问；`account` 共享仅允许 `account` 组的成员访问。将 `/etc` 目录中所有以字母\
  \ `s` 开头的文件复制到 `/srv/samba/sales`，并将 `/etc` 目录中所有以字母 `A` 开头的文件复制到 `/srv/samba/account`。\n\
  \n### 6. 在 `server2` 上，配置 `automount` 以挂载上一步中配置的 Samba 共享。这些共享应该挂载到 `/mnt/sales`\
  \ 和 `/mnt/account`，但仅在用户访问这些挂载点时才挂载。\n\n### 7. 编写一个名为 `testscript` 的脚本。启动时，脚本应该检查在脚本启动时是否提供了参数“test”。如果没有提供，脚本应变为交互模式并请求用户输入一些随机文本。\n\
  \n### 8. 创建一个小型 MariaDB 数据库。数据库名称应为 `addresses`，每条记录应有两个字段：`name` 和 `city`。输入一些记录：\n\
  \n```\nname           city\nflorence      lyon\njulia         san francisco\n```\n\
  \n### 9. 创建数据库的逻辑备份并将其写入名为 `/root/addresses.bck` 的文件中。\n\n### 10. 设置远程日志。所有在 `server1`\
  \ 上生成的日志消息都应该存储在 `server1` 本地，但同时也应仅通过 TCP 转发到 `server2`。\n\n## 索引\n\n### 符号\n\n\
