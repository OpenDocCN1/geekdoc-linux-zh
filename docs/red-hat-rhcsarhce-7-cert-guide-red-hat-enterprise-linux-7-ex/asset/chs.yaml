  \ 0.0  0000     000 ?        S<   Feb 05   0:00 [kworker/0:H]\nroot         7  0.0\
  \  0.0  0000     000 ?        S    Feb 05   0:00 [migration/0]\nroot         8 \
  \ 0.0  0.0  0000     000 ?        S    Feb 05   0:00 [rcu_bh]\nroot         9  0.0\
  \  0.0  0000     000 ?        S    Feb 05   0:00 [rcuob/0]\nroot        10  0.0\
  \  0.0  0000     000 ?        S    Feb 05   0:00 [rcuob/1]\nroot        11  0.0\
  \  0.0  0000     000 ?        S    Feb 05   0:00 [rcuob/2]\n```\n\n* * *\n\n#####\
  \ 使用 ps 获取进程信息\n\n\n\n\n\n获取当前运行进程概览的最常用命令是 `ps`。如果在不带任何参数的情况下使用 `ps` 命令，仅显示由当前用户启动的进程。你可以使用许多不同的选项来显示不同的进程属性。如果你正在寻找活动进程的简要摘要，请使用\
  \ `ps aux`（如你在列表 9.1 中所示）。如果你不仅在寻找进程名称，还寻找启动该进程的精确命令，请使用 `ps -ef`。`ps` 也有其他使用方法，例如\
  \ `ps fax` 命令，它可以显示父进程和子进程之间的层级关系（参见列表 9.2\n\n* * *\n\n```\n[root@server2 ~]# ps\
  \ -ef\n\nUID      PID      PPID  C STIME TTY           TIME CMD\nroot      874 \
