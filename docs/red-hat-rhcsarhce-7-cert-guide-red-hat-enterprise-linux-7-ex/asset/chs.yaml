  \n![Image](img/24tab01.jpg)\n\n**表 24.1 “我已经掌握这些了吗？”章节与问题映射**\n\n1 系统启动时，最初从哪里获取系统时间？\n\
  \na. NTP\nb. 软件时间\nc. 硬件时钟\nd. 网络时间\n\n2 关于本地时间，以下哪个说法*不是*正确的？\n\na. 本地时间是当前时区的时间。\n\
  b. 本地时间考虑了夏令时 (DST)。\nc. 系统时间通常对应于本地时间。\nd. 硬件时间通常对应本地时间。\n\n3 RHEL 7 中设置本地时间的推荐命令是？\n\
  \na. `hwclock`\nb. `tz`\nc. `date`\nd. `timedatectl`\n\n4 对于未连接到其他服务器但需要尽可能准确时间的服务器，你推荐使用哪种时钟类型？\n\
  \na. RTC\nb. UTC\nc. 原子时钟\nd. NTP\n\n5 RHEL 7 中哪一个配置文件包含了应该连接的 NTP 服务器默认列表？\n\n\
  a. `/etc/ntp/ntp.conf`\nb. `/etc/ntp.conf`\nc. `/etc/chrony/chronyd.conf`\nd. `/etc/chrony.conf`\n\
