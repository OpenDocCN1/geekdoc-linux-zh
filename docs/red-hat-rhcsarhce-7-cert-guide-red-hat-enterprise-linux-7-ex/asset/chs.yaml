  \ `sar` 显示昨天在上午 11 点到下午 2 点之间运行的进程的交换统计。\n\n## 第 28 章 操作系统优化基础\n\n**本章涵盖了以下主题：**\n\
  \n![Image](img/squf.jpg) 理解系统优化基础\n\n![Image](img/squf.jpg) 理解 /proc 文件系统\n\n本章涵盖了以下主题：\n\
