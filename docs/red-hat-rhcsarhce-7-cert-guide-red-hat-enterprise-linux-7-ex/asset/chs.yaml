  **c.** `en`\n**d.** `audit`\n\n### 基础主题\n\n#### 理解 SELinux 工作原理和模式\n\n在 Linux 系统上，你可以选择启用或禁用\
  \ SELinux。当启用 SELinux 时，内核对 SELinux 的支持会被加载，感知 SELinux 的应用程序会改变行为。如果禁用了 SELinux，则不会发生\
  \ SELinux 活动。在 SELinux 启用和禁用之间切换需要重启系统。\n\n如果系统上的 SELinux 已启用，你可以选择让 SELinux 处于\
  \ enforcing 模式或 permissive 模式。在强制模式下，SELinux 完全运行并执行所有 SELinux 规则。如果 SELinux 处于宽容模式，所有\
  \ SELinux 相关活动会被记录，但不会阻止访问。这使得 SELinux 宽容模式成为故障排除的绝模式。宽容模式也是进行操作并从 SELinux 视角查看结果的好方法。这有助于构建新的、更高效的策略。\n\
  \n要在启动时设置默认 SELinux 模式，请使用文件 `/etc/sysconfig/selinux`。列表 21.1 显示了该文件的内容。\n\n**列表\
  \ 21.1** `/etc/sysconfig/selinux`文件的内容\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server1\
  \ ~]# cat /etc/sysconfig/selinux\n\n# 此文件控制系统上 SELinux 的状态。\n# SELINUX= 可以取以下三个值之一：\n\
  #   enforcing - 强制 SELinux 安全策略。\n#   permissive - SELinux 打印警告而非强制。\n#   disabled\
  \ - 不加载 SELinux 策略。\n\nSELINUX=enforcing\n\n# SELINUXTYPE= 可以取以下两个值之一：\n#   targeted\
  \ - 目标进程受到保护，\n```\n\n\n\n\n\n# minimum - 针对目标策略的修改。仅对选定的进程进行保护。\n\n# mls - 多级安全保护。\n\
  \n`SELINUXTYPE=targeted`\n\n如你所见，在系统启动时读取的这个文件中，你可以选择将 SELinux 置于强制（enforcing）、许可（permissive）或禁用（disabled）模式。\n\
  \n在当前已启用 SELinux 的服务器上，你可以使用 `getenforce` 命令查看其当前是处于强制模式还是许可模式。要在许可模式和强制模式之间切换，你可以使用\
  \ `setenforce`。命令 `setenforce 0` 将 SELinux 置于许可模式，而 `setenforce 1` 则将 SELinux 置于强制模式。\n\
  \n另一个有命令是 `sestatus`。如果配合选项 `-v` 使用，该命令会显示服务器上 SELinux 当前状态的详细信息。列表 21.2 显示了 `sestatus\
  \ -v` 命令的输出。它不仅向你显示 SELinux 的哪些部分已启用，还显示了当前加载的策略版本，以及系统某些关键部分的上下文标签（context labels）。\n\
  \n**列表 21.2** 使用 `sestatus -v` 获取当前保护状态的详细信息\n\n点击此处查看代码图像\n\n```bash\n[root@server1\
  \ log]# sestatus -v\n\nSELinux status:               enabled\nSELinuxfs mount: \
  \             /sys/fs/selinux\nSELinux root directory:       /etc/selinux\nLoaded\
  \ policy name:           targeted\nCurrent mode:                 enforcing\nMode\
  \ from config file:       enforcing\nPolicy MLS status:            enabled\nPolicy\
  \ deny_unknown status:   allowed\nMax kernel policy version:    28\nProcess contexts:\n\
  Current context:\nunconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\nInit context:\
  \                 system_u:system_r:init_t:s0\n/usr/sbin/sshd                system_u:system_r:sshd_t:s0-s0:c0.c1023\n\
  File contexts:\nControlling terminal:         unconfined_u:object_r:user_devpts_t:s0\n\
  /etc/passwd                   system_u:object_r:passwd_file_t:s0\n/etc/shadow  \
  \                 system_u:object_r:shadow_t:s0\n/bin/bash                     system_u:object_r:shell_exec_t:s0\n\
  /bin/login                    system_u:object_r:login_exec_t:s0\n/bin/sh       \
  \               system_u:object_r:bin_t:s0 -> system_u:object_r:shell_exec_t:s0\n\
  /sbin/agetty                  system_u:object_r:getty_exec_t:s0\n/sbin/init    \
  \                system_u:object_r:bin_t:s0 -> system_u:object_r:init_exec_t:s0\n\
  /usr/sbin/sshd                system_u:object_r:sshd_exec_t:s0\n```\n\n在练习 21.1\
  \ 中，你将练习操作这些不同的模式。\n\n## 练习 21.1 操作 SELinux 模式\n\n**1.** 在你的服务器上打开一个根控制台并输入 `getenforce`。你通常会看到\
  \ SELinux 处于强制模式。\n\n**2.** 输入 `setenforce 0` 再次输入 `getenforce`。现在 SELinux 切换到了许可模式。\n\
  \n**3.** 使用编辑器打开 `/etc/sysconfig/selinux` 文件并更改 `SELINUX=disabled` 这一行。重启你的服务器。\n\
  \n**4.** 重启后，登录到根 shell 并输入 `getenforce`。你会发现 SELinux 现在处于禁用状态。\n\n**5.** 尝试使用命令\
  \ `setenforce 1`。你会看到消息“setenforce: SELinux is disabled.”。在不重启的情况下，你无法在禁用模式和强制模式之间切换。\n\
  \n**6.** 再次打开 `/etc/sysconfig/selinux` 文件，将行 `SELINUX=disabled` 改回 `SELINUX=enforcing`。重启你的系统。\n\
  \n**7.** 重启后，输入 `sestatus -v` 并读取有关 SELinux 的当前状态。\n\n### 提示\n无论你做什么，都不要更改 `/etc/sysconfig/selinux`\
  \ 的内容。你的考试必须配置为强制模式下的 SELinux。为了排查 SELinux 问题，你可以使用 `setenforce 0` 将其临时设置为许可模式。在这种模式下，你可以排查任何\
  \ SELinux 问题，但至少你可以确保重启服务器后，它是以启用 SELinux 的模式启动的，这是考试的必要要求。\n\n注意，在真实的 Red Hat 服务器上，SELinux\
  \ 有时会被设置为禁用。将 SELinux 置于禁用模式确实让管理员更容易运行应用程序。然而，它也降低了安全性。如果你的服务器允许用户直接从互联网访问，那么完全强制系统尤为重要。但是，在\
  \ RHCSA 和 RHCE 考试中，你必须确保 SELinux 已启用并充分保护了你的服务器。\n\n### 备注\nSELinux 在服务器上经常被禁用，因为应用供应商不知道如何处理它。在许多情况下，即使是不知如何与\
  \ SELinux 工作的应用程序也可以在启用了 SELinux 的服务器上正常运行。只是在使用启用 SELinux 的系统时，需要多花一点精力来研究策略中的额外规则。\n\
  \n#### 理解上下文设置和策略\n上下文设置是 SELinux 操作的重要组成部分。上下文（context） 是一个可以应用于不同元素的标签：\n- 文件和目录\n\
  - 端口\n- 用户\n\n上下文标签定义了项的性质，SELinux 规则的创建是为了匹配源对象的上下文标签与目标对象的上下文标签。因此，设置正确的标签对于系统管理员来说是一项非常重要的技能。在本章的稍后部分学习如何操作。\n\
  \n##### 监控上下文标签\n要查看这些对象当前的上下文设置，许多命令提供了 `-Z` 选项。列表 21.3 显示了 `ls -Z` 如何显示某些目录的上下文设置。其他命令也支持\
  \ `-Z` 选项来显示上下文标签设置。例如 `ps aux` 可以显示包括其上下文标签在内的进程列表，或者 `netstat -tulpen` 可以显示所有网络端口以及与每个端口关联的当前上下文标签。\n\
  \n**列表 21.3** 使用 `ls -Z` 显示上下文标签\n\n```bash\n[root@server1 /]# ls -Z\nlrwxrwxrwx.\
  \ root root system_u:object_r:bin_t:s0      bin -> usr/bin\ndr-xr-xr-x. root root\
  \ system_u:object_r:boot_t:s0     boot\ndrwxr-xr-x  root ?                     \
  \       dev\ndrwxr-xr-x. root root system_u:object_r:etc_t:s0      etc\ndrwxr-xr-x.\
  \ root root system_u:object_r:home_root_t:s0 home\nlrwxrwxrwx. root root system_u:object_r:lib_t:s0\
  \      lib -> usr/lib\nlrwxrwxrwx. root root system_u:object_r:lib_t:s0      lib64\
  \ -> usr/lib64\ndrwxr-xr-x. root root system_u:object_r:mnt_t:s0     media\ndrwxr-xr-x.\
  \ root root system_u:object_r:mnt_t:s0     mnt\ndrwxr-xr-x. root root system_u:object_r:usr_t:s0\
  \      opt\ndr-xr-xr-x  root ?                            proc\ndr-xr-x---. root\
  \ root system_u:object_r:admin_home_t:s0 root\ndrwxr-xr-x  root ?              \
  \              run\nlrwxrwxrwx. root root system_u:object_r:bin_t:s0      sbin ->\
  \ usr/sbin\ndrwxr-xr-x. root root system_u:object_r:var_t:s0      srv\ndrwxr-xr-x\
  \  root ?                            sys\ndrwxrwxrwt. root root system_u:object_r:tmp_t:s0\
  \     tmp\ndrwxr-xr-x. root root system_u:object_r:usr_t:s0      usr\n```\n点击此处查看代码图像\n\
  \n\n\n\n\n```\ndrwxr-xr-x. root root system_u:object_r:var_t:s0     var\n\ndrwxr-xr-x.\
  \ root root unconfined_u:object_r:httpd_sys_content_t:s0 web\n```\n\n## 上下文标签结构\n\
  \n每个上下文标签始终由三个不同的部分组成：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ **用户 (User):** 用户可以通过上下文标签中的 `u` 来识别用户；在列表 21.3 中的大多数目录中，它被设置为 `system_u`。SELinux\
  \ 用户与 Linux 用户不同，它们在 RHCSA 或 RHCE 考试中并不重要。\n\n![Image](img/squf.jpg) **角色 (Role):**\
  \ 角色可以通过上下文标签中的 `_r` 来识别。在列表 21.3 中，大多数对象都被标记为 `object_r` 角色。在高级 SELinux 管理中，可以为特定的\
  \ SELinux 用户分配特定的 SELinux 角色权限。对于 RHCSA 和 RHCE 考试，你不需要知道如何配置这些。\n\n![Image](img/squf.jpg)\
  \ **类型 (Type):** 类型上下文可以通过上下文标签中的 `_t` 来识别。在列表 21.3 中，你可以看到在 `/` 文件系统中的目录应用了多种上下文类型。请确保你了解如何处理上下文类型，因为这是考试的核心内容。\n\
  \n### 提示\n为了确保你关注的是真正重要的部分，在 RHCSA 以及 RHCE 考试中，你只需要处理上下文类型。你可以安全地忽略上下文标签中的用户和角色部分。\n\
  \n## 设置上下文类型\n\n作为管理员，了解如何设置上下文类型是非常重要的。你可以在文件和目录上（RHCSA 要求）以及网络端口等其他对象（RHCE 要求）上设置这些上下文类型。由于在文件上设置上下文类型是你\
  \ RHCSA 真正需要掌握的，让我们先关注这项任务。\n\n你可以使用两个命令来设置上下文类型：\n\n![Image](img/squf.jpg) **semanage:**\
  \ 这是你想要使用的命令。`semanage` 命令会将新上下文写入 SELinux 策略中，并将其应用到文件系统。\n\n![Image](img/squf.jpg)\
  \ **chcon:** 此命令仅用于特定情况，通常应该避免使用。`chcon` 命令会将新上下文写入文件系统，而不是策略中。所有通过 `chcon` 应用的内容在文件系统重新打标签或从策略中恢复原始上下文到文件系统时，都会被覆盖。*不要*使用此命令！\n\
  \n### 注意事项\n你可能想知道，既然我不应该使用它，为什么我还要提到它。嗯，你经常会在文档中仍然看到对 `chcon` 命令的引用，这可能会给你一种它是一个有用命令的印象。它并不是有用，因为如果你的文件系统被重新打标签，所有通过\
  \ `chcon` 应用的更改都会丢失。如果你是 SELinux 新手，文件系统重新打标签的操作可能会让你措手不及，而且如果你不小心在已经使用 `chcon`\
  \ 应用了 SELinux 上下文的文件系统上重新打标签，你将会通过考试。所以，我重复一遍：*不要*使用它。\n\n### 提示\n`semanage` 命令默认没有安装。幸运的是有\
  \ `yum whatprovides`。输入 `yum whatprovides */semanage` 来找到包含 `semanage` 的 RPM，然后安装它。不要背诵所有相关\
  \ RPM 的名称；只需记住 `yum whatprovides`。它会找到你需要的任何 RPM。关于 `yum` 命令的使用和包管理的更多信息，请参阅第 11\
  \ 章，“管理软件](#ch11.html_ch11)”。\n\n使用 `semanage` 设置上下文之前，首先需要找到合适的上下文（下一节将深入探讨“查找你需要的上下文类型”）。找到合适上下文的简单方法是查看已存在项目的默认上下文设置。例如，如果你想更改\
  \ Web 服务器的上下文，输入 `ls -Z /var/www` 查看上下文设置：\n\n点击此处查看代码图像\n\n```\n[root@server1 /]#\
  \ ls -Z /var/www\n\ndrwxr-xr-x. root root system_u:object_r:httpd_sys_script_exec_t:s0\n\
  \    cgi-bin\ndrwxr-xr-x. root root system_u:object_r:httpd_sys_content_t:s0 html\n\
  ```\n\n如所示，`/var/www/html` 上的上下文被设置为 `httpd_sys_content_t`。（我们只查看上下文类型，因为用户和角色仅供高级使用）。要为任何你想让\
  \ Apache Web 服务器访问的新目录设置此上下文类型，请使用以下命令：\n\n```\nsemanage fcontext -a -t httpd_sys_content_t\
  \ \"/mydir(/.*)?\"\n```\n\n在此命令中，选项 `-a` 用于添加上下文类型。这是你你手动创建的所有目录都需要执行的操作。然后，你使用\
  \ `-t` 来更改上下文类型（而不是用户和角色）。命令的最后部分是一个正则表达式，用于引用 `/mydir` 及其下方的任何内容。\n\n然而，这样设置上下文是不够的，因为你只将其写入策略而非文件系统。为了完成该命令，你现在需要按照以下方式将策略应用到文件系统：\n\
  \n```\nrestorecon -R -v /mydir\n```\n\n你会看到新上下文已应用，允许 httpd 进程访问该目录。\n\n### 提示\n\
  `semanage` 命令并不是最容易记忆的。幸运的是，它有非常优秀的手册页。输入 `man semanage` 并使用 `G` 跳转到手册末尾。现在你会看到“参见”部分，其中提到了\
  \ `semanage-context`。使用 `man semanage-context` 打开此手册，输入 `examples`，你将看到一些提到你所所需的示例。\n\
  \n\n\n\n\n7. 输入 `elinks http://localhost`。你将看到默认的 Red Hat 网页，而不是你刚刚创建的 `index.html`\
  \ 文件的内容。\n\n8. 输入 `setenforce 0` 将 SELinux 切换到允许模式**permissive mode**）。\n\n9. 重复第\
  \ 7 步。你现在可以访问你的自定义网页了，这证明了 SELinux 之前确实在拦截访问。\n\n10. 输入 `semanage fcontext -a -t\
  \ httpd_sys_content_t “/web(/.*)?”` 将新的上下文标签应用到 `/web`。\n\n11. 输入 `restorecon -R\
  \ -v /web`。`-v`（详细模式，verbose）选项确保你能看到正在发生什么，并且你将看到新的上下文被应用到 `/web`。\n\n12. 使用 `setenforce\
  \ 1` 将 SELinux 恢复为强制模式**enforcing mode**）。\n\n13. 输入 `elinks http://localhost`。你现在可以访问你的自定义网页了。\n\
  \n***\n\n### 查找你需要的上下文类型\n\n设置 SELinux 上下文的挑战性部分之一是找到你需要的上下文。大致有三种方法：\n\n![Image](img/squf.jpg)\
  \ 查看默认环境\n\n![Image](img/squf.jpg) 读取配置文件\n\n![Image](img/squf.jpg) 使用 `man -k _selinux`\
  \ 查找适用于你服务的 SELinux 专用 man 页面\n\n获取你所需的 SELinux 信息最强大的方法是使用 `man -k _selinux`，它会在\
  \ man 页面数据库中搜索名称或描述中包含 `_selinux` 的 man 页面。然而，在 RHEL 7 上，这些 man 页面默认并没有安装的。如需安装它们，你需要安装\
  \ `policycoreutils-devel` 包，之后你可以使用命令 `sepolicy manpage -a -p /usr/share/man/man8`\
  \ 来安装 SELinux man 页面。练习 21.3 将引导你完成应用特定特定 SELinux man 页面所需的步骤。\n\n***\n\n#### 提示\
  \ Tip\n\n练习 21.3 展示了一项核心技能。请在参加考试之前确保你已经掌握了这一流程。\n\n***\n\n### 练习 21.3 安装 SELinux\
  \ 专用 man 页面\n\n1. 输入 `man -k _selinux`。你可能只会看到一两个 man 页面。\n\n2. 输入 `yum whatprovides\
  \ */sepolicy`。这会向你显示包含 `sepolicy` 二进制文件的 名称，即 `policycoreutils-devel`。\n\n3. 输入\
  \ `yum -y install policycoreutils-devel` 安装此包。\n\n4. 输入 `sepolicy manpage -a -p\
  \ /usr/share/man/man8` 安装 man 页面。\n\n5. 输入 `man -k _selinux`。你现在还没有看到任何变化。\n\n6.\
  \ 输入 `mandb` 更新包含所有已安装 man 页面名称和描述的数据库。\n\n7. 一旦 `mandb` 命令完成（这可能需要几分钟），输入 `man\
  \ -k _selinux`。你现在将看到一长串 man 页面滚动出现。\n\n8. 输入 `man -k _selinux | grep http` 来查找记录\
  \ `httpd` 服务 SELinux 设置的 man 页面并滚动阅读。注意，这是你可以在 `httpd` 服务上使用 SELinux 执行的所有操作的完整列表。\n\
  \n***\n\n#### 恢复默认文件上下文\n\n在上一节中，你学习了如何使用 `semanage` 应用上下文类型。你还使用 `restorecon` 将策略中的上下文设置应用到文件系统。`restorecon`\
  \ 命令是一个非常有用的命令，因为在策略中，对你计算机上的大多数文件和目录定义了默认设置。如果应用了错误的上下文设置，你只需要输入 `restorecon` 即可从策略重新应用到文件系统。\n\
  \n像这样使用 `restorecon` 对于修复新文件的问题非常有用。在解释如何操作之前，让我们先来看看是如何应用新的上下文设置的：\n\n![Image](img/key_topic.jpg)\n\
