  \n**14.** 输入 `exit` 退出。\n\n***\n\n\n\n为了高效地使用快照，请确保 `/var/lib/mysql` 位于一个专用的逻辑卷上。如果不是这样，备份可能会变得不必要的大。在本次练习中，假设情况是如此的，且\
  \ mariadb 数据库位于 `/dev/vgdata/lvmariadb` 上。\n\n***\n\n**3.** 使用 `vgs vgname` 验证托管数据库卷的卷组内是否仍留有未分配的磁盘空间。\n\
  \n**4.** 此时，你需要临时冻结数据库，以便在创建快照时无法进行任何修改。要执行此操作，使用 `mysql -u root -p` 以 root 身份连接数据库，并输入\
  \ `FLUSH TABLES WITH READ LOCK;`。**不要**关闭此会话，因为这将移除锁！\n\n**5.** 在*另一个*终端会话中，创建 LSTM\
  \ 快照。以下命令假设卷组名称为 `vgdata`，托管数据库的 LVM 卷名称为 `lvmariadb`：`lvcreate -L 2G -s -n lvmariadb-snapshot\
  \ /dev/vgdata/lvmariadb`。确保快照大小足够容纳备份。\n\n**6.** 回到 MariaDB 会话并输入 `UNLOCK TABLES;`\
  \ 以移除锁。\n\n**7.** 回到另一个会话并挂载快照：`mkdir /mnt/snapshot; mount -o nouuid /dev/vgdata/lvmariadb-snapshot\
  \ /mnt/snapshot`。\n\n**8.** 使用 `tar -cvf /root/mariadb.tar /mnt/snapshot/lib/mysql`\
  \ 创建备份。\n\n**9.** 成功创建备份后，你需要卸载并删除快照：`umount /mnt/snapshot; lvremove /dev/vgdata/lvmariadb-snapshot`。\n\
  \n***\n\n恢复备份取决于你拥有哪种备份。要恢复逻辑备份，使用类似 `mysql -u root -p videos < /root/videos-db.dump`\
  \ 的命令。要恢复物理备份，必须必须停止 mariadb 服务，之后可以使用 tar 恢复备份：\n\n**1. `systemctl stop mariadb`**\n\
  \n**2. `rm -rf /var/lib/mysql/`**\n\n**3. `tar xvf /root/mariadb.tar -C /**`**\n\
  \n在恢复备份之前，务必验证归档文件的内容！\n\n#### 总结\n\n在本章中，你学习了 MariaDB 数据库的基础知识。你学习了如何创建一个包含不同表和记录的简单数据库，并学习了如何对该数据库进行基本的查询操作。你还学习了如何为数据库创建用户，以及如何创建物理和逻辑备份。\n\
