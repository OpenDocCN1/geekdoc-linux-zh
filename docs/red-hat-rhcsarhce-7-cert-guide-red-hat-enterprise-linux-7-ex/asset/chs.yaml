  if [ -f $1 ]\nthen\n    echo \"$1 is a file\"\n..... [ -d $1 ]\nthen\n    echo \"\
  $1 is a directory\"\nelse\n    echo \"I do not know what $1 is\"\nfi\n```\na. `else`\n\
  b. `if`\nc. `elif`\nd. `or`\n\n**8.** 你预期哪个文件会包含 `eno1` 接口的路由配置？\n\n\n\n\n\n```bash\n\
  for (( counter=100; counter>1; counter-- )); .......\n    echo $counter\ndone\n\n\
  exit 0\n```\n\n**a. in**\n\n**b. do**\n\n**c. run**\n\n**d. start**\n\n**[9].**\
