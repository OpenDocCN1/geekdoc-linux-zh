  \ DNS 出现问题，你可以使用 `dig` 命令在客户端计算机上分析问题。unbound 缓存了这些记录。如果 DNS 问题与缓存有关，`dig` 命令可能会提供有用的信息。\n\
  \n### 倾储和更改 unbound 缓存\n\nunbound 服务缓存了 DNS 记录。在某些情况下，这些记录可能会过时。如果你在 unbound 缓存中发现了过时的记录，可以使用\
  \ `unbound-control flush somehost` 来刷新。或者，你可以刷新整个区域。\n\n要倾储缓存内容，请使用 `unbound-control\
  \ dump > cache.txt`。在对 `cache.txt` 文件进行修改后，使用 `unbound-control load < cache.txt`。\n\
  \n### 使用 dig\n\n如果 DNS 不工作，你可以在客户端上使用 `dig` 命令来分析问题。`dig` 命令提供了许多关于如何获取信息的选项。在最基本的用法中，你可以使用\
  \ `dig` 测试特定域名是否可以解析。要这样做，可以输入 `dig rhatcert.com`。它显示了你在列表 34.3](#ch34.html_ch34lis03)\
  \ 中看到的结果。\n\n**列表 34.3** 使用 `dig` 分析 DNS 数据\n\n点击此处查看代码\n\n```\n[root@server ~]#\
  \ dig rhatcert.com\n\n; <<>> DiG 9.9.4-RedHat-9.9.4-14.el7 <<>> rhatcert.com\n;;\
  \ global options: +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode: QUERY, status: NOERROR,\
  \ id: 37234\n;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL:\
  \ 1\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:; udp: 1400\n;; QUESTION SECTION:\n\
  ;rhatcert.com.              IN      A\n;; ANSWER SECTION:\n\nrhatcert.com.     \
  \       86400   IN      A       213.124.112.43\n\n;; Query time: 36 msec\n;; SERVER:\
  \ 212.54.35.25#53(212.54.35.25)\n;; WHEN: Wed Jan 07 13:20:09 CET 2015\n;; MSG SIZE\
  \  rcvd: 57\n```\n\n\n\n\n在查询部分（question section）中，`dig` 显示了原始查询的内容。在本例中，它是针对域名\
  \ `rhatcert.com` 的 IN 类型的 A 资源记录。答案部分（answer section）提供了收到的实际答案信息，在本例中，它显示该域名可以通过\
  \ IP 地址 `213.124.112.43` 访问。最后，四行显示了查询详情的摘要。\n\n使用 `dig` 你还可以请求关于 DNS 域名的特定信息。例如，使用\
  \ `dig MX rhatcert.com` 查找为请求域名配置的邮件交换，或使用 `dig NS rhatcert.com` 查找该域名的负责名称服务器。`dig`\
  \ 的另一个非常实用的例子是 `dig -x 213.124.112.43`。该命令可以向你显示 DNS 中为请求 IP 地址 配置的名称。\n\n同样非常有用的是\
  \ `dig` 可查询特定的 DNS 服务器。例如，使用 `dig @server1.example.com MX rhatcert.com` 专门从 `server1.example.com`\
  \ 请求 `rhatcert.com` 的邮件交换服务器。\n\n### 分析客户端问题\n\n如果由于某种原因 `dig` 没有提供你预期的答案，你需要进行一些基础的故障排除。通常情况下，以下步骤将帮助你\
  \ DNS 未按预期工作的原因：\n\n1. 使用 `cat /etc/resolv.conf` 验证 DNS 解析器的内容。\n2. 如果 `resolv.conf`\
  \ 的内容看起来正确，尝试 ping 提到的名称服务器。如果名称服务器有响应，请确保你没有在名称服务器地址上出错。你可能使用了一个根本不是名称服务器的服务器。\n\
  3. 如果 `/etc/resolv.conf` 中的信息错误，使用 `nmcli` 验证 NetworkManager 信息，查看设置了哪些 DNS 名称服务器。不要手动修改\
  \ `/etc/resolv.conf` 的内容；这些信息是由 NetworkManager 管理的。\n\n#### 总结\n\n在本章中，你学习了如何设置\
  \ DNS。本章开头介绍了 DNS 的工作原理以及 DNS 中使用了哪些组件。接下来，你学习了如何将 unbound 服务配置为 DNS 名称服务器。在章节末尾，你学习了如何使用\
  \ `dig` 验证 DNS 问题，以及如何检查当前 DNS 解析器的工作情况以确保 DNS 运行正常。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\
