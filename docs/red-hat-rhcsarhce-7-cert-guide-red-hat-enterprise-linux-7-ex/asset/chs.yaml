  \ 以后台任务启动命令 `dd if=/dev/zero of=/dev/null` 三次。\n\n**2.** 使用 `nice` 值 `-5` 提高其中一个命令的优先级。再次更改同一进程的优先级，这次使用值\
  \ `-15`。观察差异。\n\n**3.** 杀死你刚刚启动的所有 `dd` 进程。\n\n## 第 10 章。使用虚拟机\n\n**本章涵盖了以下主题：**\n\
