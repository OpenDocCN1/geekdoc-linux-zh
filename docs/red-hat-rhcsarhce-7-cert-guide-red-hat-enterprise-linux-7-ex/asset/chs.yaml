  \ GPT 分区。\n\n6. RHEL7 中默认使用哪种文件系统？\n\na. `Ext4`\nb. `XFS`\nc. btrfs\nd. `Ext3`\n\
  \n7. 哪条命令允许你找到服务器上的 UUID？\n\na. `mount`\nb. `df -h`\nc. `lsblk`\nd. `blkid`\n\n\
  8. 在 `/etc/fstab` 的列中填写什么来根据 ID 挂载文件系统？\n\na. `42f19c-633f-ed7-b1619da`\nb. `/dev/42f19c-633f-ed7-b1619da`\n\
  c. `UUID=42f19c-633f-ed7-b1619da`\nd. `ID=42f19c-633f-ed7-b1619da`\n\n10. 在 `/etc/fstab`\
  \ 中使用哪种挂载选项来指定只有网络可用后才能挂载文件系统？\n\na. `network`\nb. `_netdev`\nc. `_network`\nd.\
  \ `netdev`\n\n\n\n\n当硬盘在 20 世纪 80 年代初首次出现时，你可以在它们上运行不同的操作系统。其中一些包括 `MS-DOS/PC-DOS`、`PC/IX`（IBM\
  \ 为 8086 PC 设计的 UNIX）、`CPM86` 和 `MPM86`。磁盘会被分区，以便你安装的每个操作系统都能获得磁盘的一部分。其中一个分区会被设置为“活动（active）”分区，这意味着\
  \ `MBR` 引导扇区中的代码将读取该活动分区的第一扇区并运行该代码。该代码随后会加载操作系统的其余部分。这解释了为什么四个分区就被认为“足够”了。某些操作系统（如\
  \ SCO Xenix 和 SCO Unix）在专用的 UNIX 分区中具有另一层分区（在 SCO 的情况下，称为 `divisions`），并有它们自己的分区程序（SCO：`divvy`）。\n\
  \n`MBR` 被定义为计算机硬盘上的前 `512` 字节，在 `MBR` 中存在一个操作系统启动引导加载程序（例如 GRUB 2；参见第 18 章“管理和理解引导过程””）以及一个分区表。用于分区表的大小相对较小，仅为\
  \ `64` 字节，导致在 `MBR` 中不能创建超过四个分区。由于分区大小数据存储在 32 位值中，且使用 `512` 字节的默认扇区大小，单个分区可使用的最大大小被限制为\
  \ `2 TiB`（在 20 世纪 80 年代初这不是问题）。\n\n在 `MBR` 中只能创建四个分区。由于许多 PC 操作系统需要四个以上的分区，因此找到了一种超越四个数量限制的方法。在\
  \ `MBR` 中，可以创建一个分区作为扩展分区，这与其他被创建为主分区的分区不同。在扩展分区内，可以创建若干个逻辑分区，以达到 Linux 内核可以寻址的共\
  \ 15 个分区。\n\n### 理解 GPT 分区的必要性\n\n当前的计算机硬盘已经变得太大，无法通过 `MBR` 分区进行寻址。这就是为什么需要新的分区方案。这种分区方案是\
  \ GUID 分区表 (GPT)分区方案。在使用新的统一扩展固件接口（UEFI）替代旧 BIOS 系统的计算机上，GPT 分区是寻址磁盘的唯一方法。此外，使用\
  \ BIOS 而非 GPT 的旧计算机系统也可以配置 GUID 分区。\n\n使用 GUID 有许多优势：\n\n![Image](img/squf.jpg)\
  \ 最大分区大小为 `8` 泽兆字节 (ZiB)，即 `1024 * 1024 * 1024 * 1024` 吉兆字节 (GiB)。\n\n![Image](img/squf.jpg)\
  \ 在 GPT 中，最多可以创建 `128` 个分区。\n\n![Image](img/squf.jpg) `2 TiB` 的限制不再存在。\n\n![Image](img/squf.jpg)\
  \ 因为用于存储分区的空间远大于 MBR 中使用的 `64` 字节，所以不再需要区分主分区、扩展分区和逻辑分区。\n\n![Image](img/squf.jpg)\
  \ GPT 使用 128 位的全局唯一标识 (GUID) 来识别分区。\n\n![Image](img/squf.jpg) 默认在磁盘末尾创建一个 GUID 分区表的备份副本，这消除了\
  \ MBR 分区表存在的单点故障问题。\n\n### 理解存储测量单位\n\n在谈论存储时，会使用不同的测量单位。在某些情况下，会使用兆字节 (MB) 等单位。在其他情况下，会使用二进制兆字节\
  \ (MiB) 等单位。两者之间的区别是，兆字节是 `1,000` 的倍数，而二进制兆字节是 `1,024` 的倍数。在计算机中，讨论 `1,024` 的倍数是有意义，因为这是计算机寻址项目的方式。然而，很久以前硬件厂商开始谈论兆字节时，就产生了误解。\n\
  \n在计算早期，这种差异并不重要。在千字节 (KB) 和千兆字节 (KiB) 之间，仅差 `24` 字节。数字越大，差异就越大。例如，一个千字节是 `1,000\
  \ * 1,000 * 1,000` 字节，即 `1,000,000,000` 字节；而一个吉兆字节是 `1,024 x 1,024 * 1,024` 字节，总计\
  \ `1,073,741,824` 字节，比 `1GB` 大 `70MB`。\n\n在当前的 Linux 发行版中，二进制数字（MiB，而非 MB）已成为标准。在表\
  \ 14.2 中，你可以看到所使用值的概述。\n\n![Image](img/key_topic.jpg)![Image](img/14tab02.jpg)\n\
  \n**表 14.2** 磁盘大小规格\n\n在过去，KB、MB 等在十进制和二进制情况下均被使用；有时它们甚至混合使用。例如，`1Mbps` 速率是每秒一百万位。曾经著名的“1.44MB”软磁盘实际大小为\
  \ `1,440,000` 字节（80 道 * 2 磁头 * 9 扇 * `512` 字节扇区），创建了 MB 的混合含义：`1.44 * (十进制 K) *\
  \ (二进制 K)`。\n\n#### 管理分区和文件系统\n\n如前一节所述，RHEL 7 上可以使用两种不同类型的分区。为了匹配不同的分区类型，还有两种分区工具。`fdisk`\
  \ 工具已存在很长时间，用于创建 MBR 分区。`gdisk` 工具用于创建 GPT 分区。在接下来的子节中，你将学习如何使用这两者。\n\n对于 MBR 和\
  \ GPT 分区，你都需要指定磁盘设备名称作为参数。表 14.3 显示了你在 RHEL7 上处理的最常见的磁盘设备名称：\n\n![Image](img/key_topic.jpg)![Image](img/14tab03.jpg)\n\
  \n**表 14.3** 常见磁盘设备类型\n\n如你在表 14.3 中看到的，所有的磁盘设备名称都以字母 `a` 结尾。这是因为它是发现的第一个磁盘。例如，第二个\
  \ 磁盘将名为 `/dev/sdb`。如果安装了许多磁盘，你可以拥有到 `/dev/sdz`。在 `/dev/sdz` 之后，内核继续创建类似 `/dev/sdaa`\
  \ 和 `/dev/sdab` 的设备。\n\n### 使用 fdisk 创建分区\n\n要创建 MBR 分区，你需要执行多个步骤。在实验 14.1 中，你将学习如何操作。\n\
  \n* *\n\n实验 14.1 使用 fdisk 创建分区\n\n本实验设计用于使用包含未分区空间的 RHEL/CentOS 安装。如果你没有这样的安装程序，可以使用演示环境中的第二个磁盘设备。这可以是通过虚拟机程序添加的虚拟磁盘，也可以是物理安装时使用的\
  \ USB 闪盘。在这种情况下，请确保将实验中的设备名称替换为匹配硬件的设备名称。\n\n* *\n\n提示\n\n在章节结束的实验中，你必须再次创建分区。如果那时能从干净的安装开始，将简单得多。以下两个步骤可以帮助你轻松恢复到尚未创建任何分区的系统。\n\
  \n* *\n\n1. 输入 `dd if=/dev/vda of=/root/diskfile bs=1M count=1`。（如果你的磁盘是 `/dev/sda`\
  \ 而不是 `/dev/vda`，请相应更改磁盘名称。）使用此命令允许你创建一个兆字节原始块的备份并写入文件 `/root/diskfile`。该文件允许你轻松恢复到实验开始时的状态。\n\
  \n2. 输入 `cp /etc/fstab /root/fstab` 同样为 `/etc/fstab` 文件制作备份。\n\n此时你已经准备好开始实验了。\n\
  \n\n\n\n**1.** 打开一个 root shell 并运行 `fdisk` 命令。该命令需要你想要创建分区的磁盘设备名称作为参数。在练习中，我将使用\
  \ `/dev/vda`。请根据你的硬件情况进行更改。\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]# fdisk /dev/vda\n\
  \nWelcome to fdisk (util-linux 2.23.2).\n\n更改将仅保留在内存中，直到你决定写入它们。在执行 `write` 命令之前务要小心。\n\
  ```\n\n**2.** 在进行任何操作之前，检查可用的磁盘空间是一个好习惯。按下 `p` 查看当前磁盘分配的概览。\n\n点击此处查看代码图片\n\n```\n\
  Command (m for help): p\n\nDisk /dev/vda: 6442 MB, 6442450944 bytes, 12582912 sectors\n\
  \nUnits = sectors of 1 * 512 = 512 bytes\n\nSector size (logical/physical): 512\
  \ bytes / 512 bytes\n\nI/O size (minimum/optimal): 512 bytes / 512 bytes\n\nDisk\
  \ label type: dos\n\nDisk identifier: 0x000a056b\n\n    Device Boot  Start     \
  \      End      Blocks    Id  System\n/dev/vda1   *      2048       514047     \
  \ 256000   83  Linux\n/dev/vda2        514048      8984575   4235264   8e  Linux\
  \ LVM\n```\n\n在该命令的输出中，请特别注意扇区的总数和当前使用的最后一个扇区（在上述命令输出中已**加粗**显示）。如果最后一个分区没有在最后一个扇区结束，则你有可用空间来创建新分区。\n\
  \n**3.** 输入 `n` 添加一个新分区。\n\n点击此处查看代码图片\n\n```\nCommand (m for help): n\n\nPartition\
  \ type:\n\n   p   primary (2 primary, 0 extended, 2 free)\n\n   e   extended\n\n\
  Select (default p):\n```\n\n**4.** 假设你有一个 `/dev/vda1` 和一个 `/dev/vda2` 分区且没有其他分区，选择\
  \ `p` 创建主分区。接受现在建议的分区编号。\n\n**5.** 指定磁盘上新分区开始的第一个扇区。默认会建议第一个可用扇区，按 `Enter` 接受。\n\
  \n**6.** 指定分区结束的最后一个扇区。默认会建议磁盘上可用的最后一个扇区。如果你使用它，在练习结束后你将没有剩余空间来创建额外的分区或逻辑卷，因此你应该使用另一个最后一个扇区。要使用另一个最后一个扇区，你可以执行以下操作：\n\
  \n- 输入你想使用的最后一个扇区的编号。\n- 输入 `+number` 创建指定扇区数量的分区。\n- 输入 `+number(K,M,G)` 指定你想分配给分区的容量（KiB、MiB\
  \ 或 GiB）。\n- 输入 `+100M` 使此分区为 100 MiB。\n\n```\nPartition number (3,4, default 3):\n\
  First sector (8984576-12582911, default 8984576):\nUsing default value 8984576\n\
  Last sector, +sectors or +size{K,M,G} (8984576-12582911): +100M\nPartition 3 of\
  \ type Linux and of size 100 MiB is set\n```\n\n在你输入分区的结束边界后，`fdisk` 将显示确认信息。\n\n\
  **7.** 此时你可以定义分区类型。默认使用 Linux 分区类型。如果你想让分区变为其他类型，请使用 `t` 进行更改。常见的分区类型包括：\n\n- `82`:\
  \ Linux swap\n- `83`: Linux\n- `e`: Linux LVM\n\n按下 `Enter` 接受默认的 Linux 分区类型 `83`。\n\
  \n**8.** 如果你对修改满意，按下 `w` 将它们写入磁盘并退出 `fdisk`。如果你在已经在使用的磁盘上创建了分区，现在会看到以下消息：\n\n点击此处查看代码图片\n\
  \n```\nCommand (m for help): w\nThe partition table has been altered!\nCalling ioctl()\
  \ to re-read partition table.\nWARNING: Re-reading the partition table failed with\
  \ error 16: Device or resource busy.\nThe kernel still uses the old table. The new\
  \ table will be used at the next reboot or you run `partprobe` or `kpartx`.\nSyncing\
  \ disks.\n[root@localhost ~]#\n```\n\n**9.** 此消息表明分区已添加到分区表中，但内存中的内核分区表未能更新。你可以通过比较\
  \ `fdisk -l /dev/vda` 的输出与命令 `cat /proc/partitions` 的输出来说此，后者显示了内核分区表。\n\n**10.**\
  \ 输入 `partprobe /dev/vda` 将更改写入内核分区表。现在分区已添加，你可以按照“创建文件系统”节中的描述在其上创建文件系统。\n\n注意：只有当你向已经挂载了某些分区的磁盘上添加分区时，才会看到“re-reading\
  \ the partition table failed with error 16”的消息。如果你正在一个没有任何挂载分区的新磁盘上工作，将不会看到此错误，也不需要使用\
  \ `partprobe` 命令。\n\n##### 在 MBR 上使用扩展和逻辑分区\n\n在之前的步骤中，你学习了如何添加主分区。如果已经创建了三个分区，则还有空间再建立一个主分区，之后分区表就会完全填满。如果你想在\
  \ MBR 磁盘上超过四个分区的限制，必须创建一个扩展分区。随后，你可以在扩展分区内创建逻辑分区。\n\n使用逻辑分区允许你突破 MBR 四个分区的限制；尽管这也有缺点。所有逻辑分区都存在扩展分区内部。\n\
  \n练习 14.2 创建逻辑分区\n\n**1.** 要创建逻辑分区，当 `fdisk` 提示你想创建哪种分区类型时，输入 `e`。\n\n点击此处查看代码图片\n\
  \n```\nCommand (m for help): n\nPartition type:\n   p   primary (3 primary, 0 extended,\
  \ 1 free)\n   e   extended\n\nSelect (default p):\n```\n\n**2.** 如果扩展分区是你写入 MBR\
  \ 的第四个分区，它也将将是允许添加的最后一个分区。因此，它应该填充电脑硬盘的剩余空间。按 `Enter` 接受默认的第一个扇区，并在 `fdisk` 提示最后一个扇区时再次按\
  \ `Enter`。\n\n点击此处查看代码图片\n\n```\nUsing default response e\nSelected partition 4\n\
  First sector (9184576-12582911, default 9184576):\nUsing default value 9184576\n\
  Last sector, +sectors or +size{K,M,G} (9184576-12582911):\n11001\nPartition 4 of\
  \ type Extended and of size 1.6 GiB is set\n```\n\n**3.** 现在扩展分区已经创建，你可以在其中创建逻辑分区。在\
  \ fdisk 界面中，再次按下 `n`。工具将提示所有主分区已在使用，并默认建议添加编号为 5 的逻辑分区。\n\n点击此处查看代码图片\n\n```\nCommand\
  \ (m for help): n\nAll primary partitions are in use\nAdding logical partition 5\n\
  ```\n\n**4.** 按 `Enter` 接受默认的第一个扇区。询问最后一个扇区时，输入 `+100M`（或你想使用的任何大小）。\n\n\n\n\n\n\
  使用默认值 9191424\n\n最后一个扇区，`+sectors` 或 `+size{K,M,G}` (9191424-12582911, 默认 12582911):\
  \ `+100M`\n\n设置类型为 Linux 且大小为 100 MiB 的第 5 分\n\n命令 (m 帮助):\n\n**5.** 现在逻辑分区已经创建，输入\
  \ `w` 将更改写入磁盘并退出 `fdisk`。要完成此过程，输入 `partprobe` 更新内核分区表。新分区现在已就绪可用。\n\n***\n\n###\
  \ 提示\n\n`fdisk` 实用程序在您输入 `w` 时才会将更改写入磁盘，`w` 是 `fdisk` 的写入命令。如果你操作失误并想退出，请按 `q` 退出。\n\
  \n***\n\n***\n\n在练习 14.2 中，你已使用 `partprobe` 命令将分区表的更改推送到内核分区表。这通常会运行良好，但在某些情况下并不奏效。如果在任何时候使用\
  \ `partprobe` 时遇到错误，请直接使用 `reboot` 命令重启电脑。如果分区没有正确写入你的系统，你真的不应该继续修改和管理分区，因为你可能会冒着在服务器上产生严重问题的风险。\n\
  \n### 使用 gdisk 创建 GPT 分区\n\n如果磁盘配置了 GUID 分区表 (GPT)，或者它是一个块尚未包含任何内容且大小超过 2 TiB 的新磁盘，则需要使用\
  \ `gdisk` 实用程序来创建分区。该实用程序与 `fdisk` 有许多相似之处，但也有一些不同。以下步骤显示了如何在 `gdisk` 中创建分区。\n\n\
  ***\n\n### 注意事项\n\n`fdisk` 也对管理 GPT 分区提供了一些支持。在编写本文时，`fdisk` 中的 GPT 支持还不稳定。因此，建议在\
  \ GPT 分区上使用 `gdisk`，在 MBR 分区上使用 `fdisk`。\n\n***\n\n***\n\n### 警告！\n\n切勿在已用 `fdisk`\
  \ 格式化且已包含 `fdisk` 分区的磁盘上使用 `gdisk`。`gdisk` 会检测到存在 MBR 并将其转换为 GPT（见下代码列表）。执行此操作后，你的电脑很可能无法启动！\n\
  \n点击此处查看代码图像\n\n```bash\n[root@localhost ~]# gdisk /dev/vda\n\nGPT fdisk (gdisk)\
  \ version 0.8.6\nPartition table scan:\n  MBR: MBR only\n  BSD: not present\n  APM:\
  \ not present\n  GPT: not present\n***************************************************************\n\
  发现无效的 GPT 和有效的 MBR；正在将 MBR 转换为 GPT 格式。\n此操作具有潜在破坏性！如果不想将你的 MBR 分区转换为 GPT 格式，\n请输入\
  \ 'q' 退出！\n***************************************************************\nCommand\
  \ (? for help):\n```\n\n为了省你经历这一切的麻烦，我已经验证了它的功能确实如描述所示。在将 MBR 转换为 GPT 后，你的机器将不再启动。\n\
  \n***\n\n现在让我们来看看如何使用 `gdisk` 创建分区。\n\n***\n\n### 练习 14.3 使用 gdisk 创建 GPT 分区\n\n\
  要应用此练习中的步骤，你需要一个新的磁盘设备。*不要*使用包含你想保留的数据磁盘，因为此练习将删除该磁盘上的所有数据。如果你在虚拟机上进行此练习，可以通过虚拟化软件添加新磁盘。如果你在物理机上操作，可以使用\
  \ USB 闪盘作为此练习的磁盘设备。注意，此练习在从 BIOS 启动而非 EFI 启动的电脑上运行完美，你只需要一个专用磁盘设备。\n\n**1.** 要使用\
  \ `gdisk` 创建分区，输入 `gdisk /dev/vdb`。（将 `/dev/vdb` 替换为你电脑上使用的实际设备名称。）`gdisk` 将尝试检测磁盘当前的布局，如果没有检测到任何内容，它将创建\
  \ GPT 分区表和关联的磁盘布局。\n\n点击此处查看代码图像\n\n```bash\n[root@localhost ~]# gdisk /dev/vdb\n\
  \nGPT fdisk (gdisk) version 0.8.6\nPartition table scan:\n  MBR: not present\n \
  \ BSD: not present\n  APM: not present\n  GPT: not present\nCreating new GPT entries.\n\
  Command (? for help):\n```\n\n**2.** 输入 `n` 进入新新分区。你可以选择 1 到 128 之间的任何分区编号，但接受建议的默认分区编号是明智的。\n\
  \n点击此处查看代码图像\n\n```bash\nCommand (? for help): n\nPartition number (1-128, default\
  \ 1):\n```\n\n**3.** 现在你被要求输入第一个扇区。默认情况下，将使用磁盘上可用的第一个扇区，但你也可以指定偏移量。这完全没有意义，所以只需按\
  \ `Enter` 接受建议的默认第一个扇区。\n\n点击此处查看代码图像\n\n```bash\nFirst sector (34-2097118, default\
  \ = 2048) or {+-}size{KMGTP}:\n```\n\n**4.** 当被询问最后一个扇区时，默认会建议磁盘上可用的最后一个扇区（这将创建一个填充整个硬盘的分区）。你可以指定不同的最后一个扇区，或使用\
  \ `+`、大小以及 KMGTP 来指定磁盘大小。因此，要创建一个 2 TiB 的磁盘分区，请使用 `+2TiB`。\n\n点击此处查看代码图像\n\n```bash\n\
  Last sector (2048-2097118, default = 2097118) or {+-}size{KMGTP}:\n+100M\n```\n\n\
  **5.** 现在你被要求设置分区类型。如果你什么都不做，分区类型将设置为 8300，即 Linux 文件系统分区。也有其他选项可用。你可以按 `l` 显示分区类型列表。\n\
  \n点击此处查看代码图像\n\n```text\nCurrent type is 'Linux filesystem'\nHex code or GUID (L\
