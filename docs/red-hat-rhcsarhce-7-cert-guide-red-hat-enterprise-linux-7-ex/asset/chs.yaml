  \ LDAP 服务器，或者按照本书附录 D 所述设置 服务器。配置 LDAP 登录后，尝试作为 LDAP 用户登录。rhatcert.com 的 LDAP 服务器预配置了\
  \ linda、lisa 和 lara 用户，你可以使用它们进行测试。\n\n\n\n\n\n![Image](img/squf.jpg) 管理基础权限\n\n\
  ![Image](img/squf.jpg) 管理高级权限\n\n![Image](img/sq.jpg) 管理 ACL\n\n![Image](img/squf.jpg)\
  \ 使用 umask 设置默认权限\n\n![Image](img/squf.jpg) 操作用户扩展属性\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\
  \n![Image](img/squf.jpg) 列出、设置和更改标准的 UGO/rwx 权限\n\n![Image](img/squf.jpg) 为协作创建并配置\
  \ set-GID 目录\n\n![Image](img/squf.jpg) 创建和管理访问控制列表\n\n![Image](img/squf.jpg) 诊断并修复文件权限问题\n\
  \n在 Linux 中，使用权限来访问文件。这些权限分配给三个实体：文件所有者、组所有者和其他实体（即除上述之外的所有）。在本章中，你将学习如何应用权限。本章从基本分区的概述开始，然后讨论特殊权限和访问控制列表\
  \ (ACLs)。在本章结束处，将涵盖如何通过 `umask` 设置默认权限，以及管理用户扩展属性。\n\n### “我了解这些了吗？”测验\n\n“我了解这些了吗？”测验可以让你评估自己应该是彻彻底读完整个章节，还是跳到“**考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
