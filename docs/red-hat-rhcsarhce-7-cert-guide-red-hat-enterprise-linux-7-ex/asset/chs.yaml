  \  00000000,00000000,00000000,00000000,00000000,0000\n0000,00000000,00000000,00000000,00000000,00000000\n\
  ,00000000,00000000,00000000,00000000,00000000,00000000,00000000,000\n00000,00000000,00000000,0000000\n\
  0,00000000,00000000,00000000,00000000,00000000,00000000,00000000,00\n000000,00000000,00000001\n\
  mems_allowed_list:      0\nvoluntary_ctxt_switches:   1477\nnonvoluntary_ctxt_switches:\
  \     1\n```\n\n***\n\n### 使用 /proc/sys 调优性能\n\n`/proc` 文件系统包含许多文件，提供了有关 Linux 服务器当前性能状态的信息。你在上一节中学到的大多数性能分析实用程序都是从\
  \ `/proc` 文件系统获取信息的。表 28.3 提供了概述。\n\n![Image](img/key_topic.jpg)![Image](img/28tab02.jpg)\n\
  \n**表 28.3** `/proc/sys` 可调优目录\n\n（）\n\n要优化 Linux 系统，`/proc/sys` 目录包含许多参数。只有在完全理解背后的子系统时，才应该更改大多数参数。由于如此，在本章中你处理的是一些并不显眼的参数。优化\
  \ Linux 服务器是红帽认证架构（RHCA）课程中独立的一门课程主题。\n\n更改参数有两种方法：\n\n![Image](img/squf.jpg) 使用\
  \ `echo` 将新参数写入内核调优文件。\n\n![Image](img/squf.jpg) 使用 `sysctl -w` 将参数写入内核调优。\n\n在优化\
  \ Linux 内核时，你应该始终首先以非持久的方式将参数写入 `/proc/sys` 文件系统。然后测试其是否有效。在确认正常后，你可以将其持久化，如下一节所示。在练习\
  \ 28.1 中，你将学习如何临时更改内核维护的主机名。使用 `hostnamectl` 对主机名进行持久更改。\n\n\n\n\n\n在本练习中，你将临时更改\
  \ `/proc` 文件系统中的一项设置。\n\n1. 打开一个 root shell 并输入命令 `uname -a`。这显示了为该机器设置的当前主机名。\n\
  \n2. 输入 `cat /proc/sys/kernel/hostname`。这显示相同的主机名。\n\n3. 输入 `echo something.example.com\
  \ > /proc/sys/kernel/hostname`。这会将新的主机名写入内核设置，但不会使其持久化。\n\n4. 输入 `uname -a`。你会发现通过\
  \ `uname -a` 显示的主机名也发生了变化。\n\n5. 重启你的服务器以恢复默认设置。\n\n***\n\n### 使用 sysctl 自动化系统优化参数\n\
  \n要持久化地更改内核设置，你需要将它们写入 `sysctl`。`sysctl`是一项服务，它会读取并在系统启动时应用几个配置文件。在本节中，你将学习如何使用\
  \ `sysctl`。\n\n在启动过程中，会启动 `systemd-sysctl` 服务。该服务会读取 `sysctl` 配置。这些配置通过不同的文件提供：\n\
  \n![Image](img/squf.jpg) `/etc/sysctl.conf` 是默认配置文件。在 RHEL 7 上，不应再使用此文件。\n\n![Image](img/squf.jpg)\
  \ `/usr/lib/sysctl.d` 目录用于默认优化选项。该目录的内容旨在通过 RPM 管理，而不是手动管理，因此请勿对其进行任何更改。\n\n![Image](img/squf.jpg)\
  \ `/etc/sysctl.d` 目录用于自定义选项。如果你有任何修改，应该在这里完成。\n\n你放入 `sysctl` 配置文件的参数与 `/proc/sys`\
  \ 文件系统的内容直接相关。`sysctl` 调优参数（tunables）是与 `/proc/sys` 目录文件名，但使用点而不是斜杠作为目录分隔符。因此，文件\
  \ `/proc/sys/vm/swappiness` 在 `sysctl` 中被称为 `vm.swappiness`。\n\n要了解所有可用的调优参数，可以使用\
  \ `sysctl -a` 命令。该命令列出所有可用的调优参数。它提供了一种查找特定参数的简方法，特别是结合 `grep` 或通过管道传给 `less` 时。找到想要设置的调优参数后，需要将其放入\
  \ `sysctl` 配置文件中。列表 28.2 显示了 `sysctl -a` 命令的部分输出。\n\n**列表 28.2** 使用 `sysctl -a`\
  \ 分析 sysctl 参数\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server2 ~]# sysctl -a | head -15\n\
  \nabi.vsyscall32 = 1\ncrypto.fips_enabled = 0\ndebug.exception-trace = 1\ndebug.kprobes-optimization\
  \ = 1\ndev.cdrom.autoclose = 1\ndev.cdrom.autoeject = 0\ndev.cdrom.check_media =\
  \ 0\ndev.cdrom.debug = 0\ndev.cdrom.info = CD-ROM information, Id: cdrom.c 3.20\
  \ 2003/12/17\ndev.cdrom.info =\ndev.cdrom.info = drive name:           sr0\ndev.cdrom.info\
  \ = drive speed:           1\ndev.cdrom.info = drive # of slots:     1\ndev.cdrom.info\
  \ = Can close tray:           1\ndev.cdrom.info = Can open tray:           1\n```\n\
  \n***\n\n所有调优参数的默认位置是目录 `/etc/sysctl.d`。在此目录中，你应该创建一个以 `.conf` 结尾命名的文件。在该文件中，你将放入调优参数以及你想为其设置的值。在输入这些内容的行中，你首先输入调优参数名称，然后是一个空格，接着是\
  \ `=` 号，然后是另一个空格和预期的值。\n\n你不应该在 `/etc/sysctl.conf` 文件或 `/usr/lib/sysctl.d` 目录中放置任何内容；这两个位置都被认为是由系统管理的。\n\
  \n`sysctl` 命令还提供了一些实用的选项。表格 28.4 提供了概述。在练习 28.2 中，你将学习如何应用某些选项。\n\n![Image](img/key_topic.jpg)![Image](img/28tab04.jpg)\n\
  \n**表格 28.4** `sysctl` 命令行选项\n\n***\n\n### 练习 28.2 通过 sysctl 修改内核调优参数\n\n在本练习中，你将学习如何应用\
  \ `sysctl` 选项。此练习的目的不是教你如何优化服务器，而是向你展示 `sysctl` 是如何工作的。\n\n1. 输入 `ping localhost`。你应该收到\
  \ localhost 的响应。\n\n2. 输入 `sysctl -a | grep icmp`。这显示所有 `sysctl` 调优参数并过滤出名称中包含 `icmp`\
  \ 的参数。它包含了 `net.ipv4.icmp_echo_ignore_all` 参数，该参数可以忽略所有的 ping 请求。\n\n3. 输入 `echo\
  \ 1 > /proc/sys/net/ipv4/icmp_echo_ignore_all`。这临时将调优参数的值设置为 1，告诉你的服务器不要对任何 ping\
  \ 包做出反应。\n\n4. 输入 `ping localhost` 以验证 ping 不再有效。\n\n5. 使用 `sysctl -w \"net.ipv4.icmp_echo_ignore_all=0\"\
  ` 并再次执行 `ping localhost`。它现在应该可以再次工作。\n\n6. 重启并测试。你会发现该设置并不是持久的。\n\n7. 使用编辑器创建文件\
  \ `/etc/sysctl.d/ping.conf` 并赋予该文件以下内容：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.icmp_echo_ignore_all\
  \ = 1\n```\n\n8. 重启并测试。\n\n***\n\n**提示：** 优化系统性能是一门科学；`/proc` 文件系统是一个强大的工具。\n\n\
  ***\n\n![Image](img/key_topic.jpg)![Image](img/28tab04.jpg)\n\n**表格 28.5** 最实用的调优参数\n\
