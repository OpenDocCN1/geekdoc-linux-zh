  \n#### 定义关键术语\n\n定义本章的以下关键术语并在词表中检查你的答案：\n\n- unit\n- wants\n- target\n- systemd\n\
  - dependencies\n- initramfs\n- kernel\n- boot loader\n- GRUB\n\n#### 复习题\n\n1. **1.**\
  \ 什么是 unit（单元）？\n2. **2.** 哪个命令可以让你确保某个 target（目标）在系统启动时不再具备自动启动条件？\n3. **3.** 你应该修改哪个配置文件来对\
  \ GRUB 2 应用常见更改？\n4. **4.** 应该使用哪个命令来显示所有当前加载的服务单元（service units）？\n5. **5.** 如何为一个服务创建一个\
  \ want（想要）？\n6. **6.** 如何将当前的运行 target 切换到 rescue target（救援目标）？\n7. **7.** 为什么会出现某个目标无法被隔离（isolated）的消息？\n\
  8. **8.** 你想关闭一个 systemd 服务，但在那之前，你想知道还有哪些单元对该服务有依赖（dependencies）。你会使用哪个命令？\n9.\
  \ **9.** 应用于 GRUB 2 更改的 GRUB 2 文件名是什么？\n10. **10.** 在对 GRUB 2 配置应用更改后，应该运行哪个命令？\n\
  \n### 章末实验\n\n你现在已经学习了如何操作 systemd 单元和 GRUB 2 引导程序。在继续之前，做一些实验是一个很好的主意，可以帮助你确保能够应用在本章中学的技能。\n\
  \n#### 实验 18.1\n\n确保 `firewalld` 服务在启动时启动。同时确保 `iptables` 服务永远不会同时启动。\n\n#### 实验\
  \ 18.2\n\n更改你的 GRUB 2 启动配置，以便在启动时能看到启动信息。\n\n## 第 19 章 启动过程的排查\n\n**本章涵盖了以下主题：**\n\
  \n![Image](img/squf.jpg) 理解 RHEL 7 启动过程\n![Image](img/squf.jpg) 传递内核启动参数\n![Image](img/squf.jpg)\
  \ 使用救援磁盘\n![Image](img/squf.jpg) 修复常见问题\n![Image](img/squf.jpg) 恢复对虚拟机的访问\n\n**本章涵盖了以下\
  \ RHCSA 考试目标：**\n\n![Image](img/squf.jpg) 手动将系统引导到不同的 target\n![Image](img/squf.jpg)\
  \ 中断启动过程以获取系统访问\n\n在前一章中，你学习了 RHEL 7 服务器是如何启动的，以及引导程序 `GRUB 2` 和 `systemd` 在其中扮演什么角色。在本章中，你学习了在启动服务器时发生常见问题时可以做什么。本章教授了帮助修复启动过程中可能发生的一些常见问题的通用方法。请确保良好掌握本章讨论的主题；它们某一天可能会救你的（职业）命！\n\
  \n### “我了解这些了吗？”测验\n\n“我了解这些了吗？”测验可以让你评估是应该仔细读完整章，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整章内容。表\
  \ 19.1 列出了本章的主要标题及其对应的“我了解这些了吗？”测验题。你可以在 附录 A “‘我了解这些了吗？测验和‘复习题’的答案”中找到答案。\n\n![Image](img/19tab01.jpg)\n\
  \n**表 19.1** “我了解这些了吗？”章节与题目映射\n\n1. **1.** 在 Red Hat Enterprise Linux 7 启动过程中，以下哪个在前？\n\
