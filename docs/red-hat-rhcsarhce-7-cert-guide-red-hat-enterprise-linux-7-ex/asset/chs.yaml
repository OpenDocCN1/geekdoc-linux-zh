  @anaconda\n\n## 可用软件包\nkernel.x86_64\n\n### 更新软件包\n\n使用 yum 仓库的主要优势之一是仓库使得更新软件包变得非常简单。仓库维护者会将更新后的软件包复制到仓库中。仓库中的索引始终包含仓库中软件包的当前版本。在本地机器上，也有一个数据库记录了正在使用的软件包的当前版本。使用\
  \ `yum update` 命令时，会将已安装软件包的当前版本与仓库中这些软件包的版本进行比较。如列表 11.9 所示，`yum` 将将显示可更新软件包的概览。从该概览中输入\
  \ `y`即可安装更新。\n\n请注意，在更新软件包时，旧版本的包会被新版本的包替换。有一个例外，就是内核包（kernel）。即使你使用 `yum update\
  \ kernel` 命令，内核包也不会被更新，而是将新内核安装在旧内核旁边，这样在启动时你可以选择想要使用的内核。这非常有用，因为你可能会发现由于硬件兼容性问题新内核无法运行。在这种情况下，你可以在\
  \ GRUB 2 启动提示符处干预（更多详情请参见第 18 章，“管理和理解启动过程](#ch18.html_ch18)”）来启动旧内核。\n\n**列表 11.9**\
  \ 使用 `yum update`\n\n点击此处查看代码图像\n\n```\nsystemd-sys x86_64 208-11.el7_0.6 updates\
  \ 36 k\ntuned noarch 2.3.0-11.el7_0.3 updates 145 k\ntzdata noarch 2015a-1.el7_0\
  \ updates 432 k\nwpa_supplicant x86_64 1:2.0-13.el7_0 updates 801 k\nyum-plugin-fastestmirror\
