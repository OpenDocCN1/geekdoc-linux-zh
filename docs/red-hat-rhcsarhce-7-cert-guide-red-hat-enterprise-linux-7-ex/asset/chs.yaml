  \ Apple HFS/HFS+     af01 Apple RAID          af02 Apple recovery\naf03 Apple label\
  \        af04 AppleTV             be00 Solaris Core\ned00 Sony system partition\
  \ ef00 EFI System    ef01 MBR partitionscheme\nef02 BIOS boot partition fb00 VMWare\
  \ VMFS      fb01 VMWare reserved\nfc00 VMWare crash p fd00 Linux RAID\n```\n\n注意这些类型与\
