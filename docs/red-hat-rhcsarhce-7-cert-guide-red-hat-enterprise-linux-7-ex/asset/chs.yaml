  \ 为 SSH 配置基于密钥的认证\n\n你已经学习了如何从图形环境登录 Linux。在本章中，你将学习其他访问 Linux Shell 并开始工作的方法。你将学习如何从本地控制台工作，以及使用\
  \ Secure Shell (SSH) 连接到 Linux。你还学习了如何在这些环境中执行一些基本任务。\n\n### “我已经学会了吗？”测验\n\n“我已经学会了吗？”测验可以让你评估自己应该彻底阅读整个章节内容，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己在这些主题知识的评估有疑问，请阅读整个章节内容。表\
