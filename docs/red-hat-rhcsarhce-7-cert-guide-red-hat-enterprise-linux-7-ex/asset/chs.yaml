  ***\n\n除了依赖关系外，某些单元与其他单元存在冲突（conflicts）。这些示例包括：\n\n![Image](img/squf.jpg) 无法一起加载的挂载和卸载单元\n\
  \n![Image](img/squf.jpg) network 和 NetworkManager 服务\n\n![Image](img/squf.jpg) iptables\
  \ 和 firewalld 服务\n\n![Image](img/squf.jpg) cronyd 和 ntpd 服务\n\n\n\n\n\n如果单元与其他单元存在冲突，这将在单元文件中描述。作为管理员，你还可以确保这些冲突的单元永远不会在同一系统上同时被加载。要做到这一点，你可以使用\
  \ `systemctl mask` 命令，它基本上使一个单元不再是启动的候选。按照以下步骤可以了解它是如何运行的：\n\n**1.** 打开 root 终端并输入\
  \ `systemctl status firewalld`。接着输入 `systemctl status iptables`。如果其中一个服务处于活动状态（active），请不要在下一步中再次加载它。\n\
  \n**2.** 输入 `systemctl start firewalld` 和 `systemctl start iptables` 来加载这两个服务。你会发现\
  \ `iptables` 拒绝启动；这是因为 `firewalld` 服务已经激活了。\n\n**3.** 输入 `cat /usr/lib/systemd/system/firewalld.service`。注意\
  \ `conflicts` 设置。输入 `cat /usr/lib/systemd/system/iptables.service`。注意该单元没有 `conflicts`\
  \ 行。\n\n**4.** 使用 `systemctl stop firewalld` 随后使用 `systemctl stop iptables` 卸载两个服务。注意，其实没有必要停止\
  \ `iptables` 服务，因为它的加载失败了，但我们确实需要在继续之前确保它完全没有加载。\n\n**5.** 输入 `systemctl mask iptables`\
  \ 并观察发生了什么：为 `/etc/systemd/system/iptables.service` 创建了一个指向 `/dev/null` 的符号链接（如下方的命令示例输出所示）。由于\
  \ `/etc/systemd` 中的单元文件优先级高于 `/usr/lib/systemd` 中的文件，这使得意外启动 `iptables` 服务变得不可能：\n\
  \n点击查看代码图片\n\n```\n[root@server202 system]# systemctl mask iptables\n\nln -s '/dev/null'\
  \ '/etc/systemd/system/iptables.service'\n```\n\n**6.** 输入 `systemctl start iptables`。你会看到一条错误信息，指示该服务已被屏蔽（masked），由于该原因无法启动。\n\
  \n**7.** 输入 `systemctl enable iptables`。注意没有显示错误信息，看起来运行正常。使用 `systemctl reboot`（或直接使用\
  \ `reboot`）重启你的服务器。\n\n**8.** 重启后，输入 `systemctl status -l iptables`。你会发现它处于非活动（inactive），且加载状态显示为\
  \ masked：\n\n点击查看代码图片\n\n```\n[root@server202 ~]# systemctl status -l iptables\n\
  \niptables.service\n\n    Loaded: masked (/dev/null)\n    Active: inactive (dead)\n\
  ```\n\n### 管理 Systemd Targets\n\n![Image](img/key_topic.jpg)\n\n作为管理员，你需要确保在服务器启动时启动所需的服务。要做到这一点，请使用\
  \ `systemctl enable` 和 `systemctl disable` 命令。你不需要考虑服务需要在哪个特定的 target（目标）中启动。服务会自动知道需要在哪些\
  \ target 中启动，并在该 target 中自动创建一个请求（want）。以下步骤将引导你完成启用服务的步骤：\n\n**1.** 输入 `systemctl\
  \ status vsftpd`。如果该服务尚未启用，Loaded 行将显示它目前处于禁用状态（disabled）：\n\n点击查看代码图片\n\n```\n\
  [root@server202 ~]# systemctl status vsftpd\n\nvsftpd.service - Vsftpd ftp daemon\n\
  \    Loaded: loaded (/usr/lib/systemd/system/vsftpd.service;\n    disabled)\n  \
  \  Active: inactive (dead)\n```\n\n**2.** 输入 `ls /etc/systemd/system/multi-user.target.wants`。你会看到负责启动你机器上不同服务的符号链接。你还可以发现\
  \ `vsftpd.service` 链接并不存在。\n\n**3.** 输入 `systemctl enable vsftpd`。该命令显示它正在为文件 `/usr/lib/systemd/system/vsftpd.service`\
  \ 创建一个指向目录 `/etc/systemd/system/multi-user.target.wants` 的符号链接。因此，基本上，当你启用一个 systemd\
  \ 单元文件时，后台会创建一个符号链接。\n\n***\n\n**提示 (Tip)**\n\n在 RHCSA 和 RHCE 考试中，你可能需要配置几个服务。建议阅读考试题，识别出需要启用的服务，并一次性启用它们，以确保它们在重启时会自动启动。这可以防止你因专注于配置服务而完全忘记启用它。\n\
  \n***\n\n### 隔离 Targets (Isolating Targets)\n\n正如已经讨论过的，在 systemd 机器上有几个 target。你也知道\
  \ target 是单元的集合。其中某些 target 具有特殊作用，因为它们可以被隔离。通过隔离一个 target，你将启动该 target 及其所有依赖项。并不是所有\
  \ target 都可以被隔离，只有启用了 isolate 选项的 target 才可以。我们将稍后探索 `systemctl isolate` 命令。在此之前，让我们看看计算机上的默认\
  \ target。\n\n要获取当前加载的所有 target 列表，请输入 `systemctl --type=target`。然而，此列表没有显示所有 target，只显示激活的\
  \ target。输入 `systemctl --type=target --all` 查看所有存在的 target 概述。这些 target 大致对应于早期\
  \ RHEL 版本中的运行级别（run levels）：\n\n![Image](img/sqf.jpg) poweroff.target - runlevel\
  \ 0\n![Image](img/sqf.jpg) rescue.target - runlevel 1\n![Image](img/sqf.jpg) multi-user.target\
  \ - runlevel 3\n![Image](img/sqf.jpg) graphical.target - runlevel 5\n![Image](img/sqf.jpg)\
  \ reboot.target - runlevel 6\n\n如果你查看这些 target 每一个的内容，还会发现它们包含了 `Isolate=yes`。这意味着你可以使用\
  \ `systemctl isolate` 命令将计算机的当前状态切换到这些 target 之一。练习 18.2 向你展示了如何这样做。\n\n![Image](img/key_topic.jpg)\n\
  \n***\n\n**练习 18.2 隔离 Targets**\n\n**1.** 从 root 终端进入目录 `/usr/lib/systemd/system`。输入\
  \ `grep Isolate *.target`。这将显示所有允许隔离的 target 列表。\n\n**2.** 输入 `systemctl isolate\
  \ rescue.target`。这将你的计算机切换到 `rescue.target`。你需要在服务器的控制台上输入 root 密码进行登录。\n\n**3.**\
  \ 输入 `systemctl isolate reboot.target`。这将重启你的计算机。\n\n***\n\n\n\n\nGRUB 2 引导加载程序确保你能够启动\
  \ Linux。GRUB 2 安装在服务器硬盘的引导扇区，并被配置为加载 Linux 内核 和 initramfs：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 内核是操作系统的核心，允许用户与服务器安装的硬件进行交互。\n\n![Image](img/squf.jpg)\
  \ initramfs 包含了启动服务器所需的驱动程序。它包含一个在启动过程中挂载的微文件系统。其中包含了在启动剩余过程中所需的内核模块（例如，访问默认不支持的磁盘所需的\
  \ LVM 模块和 SCSI 模块）。\n\n通常情况下，GRUB 2 工作运行良好，不需要太多的维护。然而在某些情况下，你可能需要更改它的配置。要对 GRUB\
  \ 2 配置应用更改，起点是 `/etc/default/grub` 文件。在该文件中，你会找到告诉 GRUB 应该做什么以及如何做的选项。列表 18.9 显示了使用\
  \ CentOS 7 默认设置安装后该文件的内容。\n\n**列表 18.9** `/etc/default/grub`文件的内容\n\n![Image](img/key_topic.jpg)\n\
  \n点击此处查看代码图片\n\n* * *\n\n```bash\n[root@server202 grub.d]# cat /etc/default/grub\n\
  \nGRUB_TIMEOUT=5\n\nGRUB_DISTRIBUTOR=\"$(sed 's, release .*$,,g' /etc/system-release)\"\
  \n\nGRUB_DEFAULT=saved\n\nGRUB_DISABLE_SUBMENU=true\n\nGRUB_TERMINAL_OUTPUT=\"console\"\
  \n\nGRUB_CMDLINE_LINUX=\"rd.lvm.lv=centos/swap vconsole.font=latarcyrheb-sun16 rd.lvm.lv=centos/root\
  \ crashkernel=auto vconsole.keymap=us rhgb quiet\"\n\nGRUB_DISABLE_RECOVERY=\"true\"\
  \n```\n\n* * *\n\n正如你所看到的，`/etc/default/grub` 文件并没有太多信息。它配置的最重要部分是 `GRUB_CMDLINE_LINUX`\
  \ 选项。这一行包含了服务器上内核的启动参数。\n\n* * *\n\n提示\n\n对于 RHCSA 考试，请确保你理解 `/etc/default/grub`\
  \ 文件的内容。无论如何这都是 GRUB 2 配置中最重要的部分。\n\n* * *\n\n除了 `/etc/default/grub` 中的配置外，`/etc/grub.d`\
  \ 中还有几个配置文件。在这些文件中，你会发现相当复杂的 Shell 代码，告诉 GRUB 加载什么以及如何加载。你通常不需要修改它。如果你想在启动时能够选择不同的内核，你也不需要修改任何内容。GRUB\
  \ 2 会自动获取新内核并自动将其添加到启动菜单，因此不需要手动添加。\n\n根据上述提到的配置文件，会创建主配置文件 `/boot/grub2/grub.cfg`。即使它看起来像是一个可以手动修改的配置文件，你也永远不应该这样做，因为它会在某个时候被覆盖。这种情况会在更新内核后发生。例如，更新内核的\
  \ RPM 包将运行一个安装后脚本来重新生成内核。在下一节中，你将学习如何更改 GRUB 2 配置。\n\n如果你进入 GRUB 2 引导提示符以添加内核启动参数，将显示\
  \ `/boot/grub2/grub.cfg` 文件的内容。在这里，你可以添加一次性的启动选项。列表 18.10 显示了 `grub.cfg` 文件中负责加载\
  \ Linux 内的相关的相关。在此列表中，你看到文件中负责加载默认内核的部分。注意以 `linux16` 开头的行；此行指定了所有的内核启动参数。\n\n**列表\
  \ 18.10** `/boot/grub2/grub.cfg` 配置文件的部分内容\n\n点击此处查看代码图片\n\n* * *\n\n```text\nmenuentry\
  \ 'CentOS Linux (3.10.0-229.1.2.el7.x86_64) 7 (Core)' --class centos --class gnu-linux\
  \ --class gnu --class os --unrestricted\n$menuentry_id_option 'gnulinux-3.10.0-123.el7.x86_64-advanced-50faa2a1-01d3-430b-8114-4a98daf5bdb9'\
  \ {\n      load_video\n      set gfxpayload=keep\n      insmod gzio\n      insmod\
  \ part_gpt\n      set root=(hd0,2)\n      insmod ext2\n      set rootfs=root=(hd0,2)\n\
  \      linux16 /vmlinuz-3.10.0-229.1.2.el7.x86_64 rd.lvm.lv=centos/swap vconsole.font=latarcyrheb-sun16\
  \ rd.lvm.lv=centos/root crashkernel=auto vconsole.keymap=us rhgb quiet\n      initrd1\
  \ /initramfs-3.10.0-229.1.2.el7.x86_64\n}\n```\n\n\n\n\n\n3. 从命令行，输入 `grub2-mkconfig\
  \ > /boot/grub2/grub.cfg` 将更改写入 GRUB 2。（注意，除了使用重定向符号 `>` 将更改写入 `grub.cfg` 文件外，你也可以使用\
  \ `-o` 参数。两种方法的结果相同。）\n\n4. 重启并验证在启动过程中你是否看到滚动的启动信息。\n\n***\n\n#### 总结\n\n在本章中，你学习了如何使用\
  \ `systemd` 和 `GRUB 2` 使你的服务器在启动过程结束时处于你期望的精确状态。你还学习了 `systemd` 的组织结构，以及如何使用 `targets`\
  \ 配置单元以自动启动。你还阅读了如何对默认的 `GRUB 2` 引导程序应用更改。在下一章中，你将学习如何排查启动过程并修复一些常见问题。\n\n### 考试准备任务\n\
  \n#### 复习所有关键主题\n\n回顾本章最重要的主题，这些主题在页面外边页用“关键主题”图标标记。表 18.4 列出了这些关键主题的参考以及它们所在的页码。\n\
