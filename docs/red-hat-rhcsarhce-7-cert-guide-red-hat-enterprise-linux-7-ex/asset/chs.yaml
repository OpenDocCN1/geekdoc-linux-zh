  \ man 页面名称和描述的数据库。\n\n7. 一旦 `mandb` 命令完成（这可能需要几分钟），输入 `man -k _selinux`。你现在将看到一长串\
  \ man 页面滚动出现。\n\n8. 输入 `man -k _selinux | grep http` 来查找记录 `httpd` 服务 SELinux 设置的\
  \ man 页面并滚动阅读。注意，这是你可以在 `httpd` 服务上使用 SELinux 执行的所有操作的完整列表。\n\n***\n\n#### 恢复默认文件上下文\n\
  \n在上一节中，你学习了如何使用 `semanage` 应用上下文类型。你还使用 `restorecon` 将策略中的上下文设置应用到文件系统。`restorecon`\
  \ 命令是一个非常有用的命令，因为在策略中，对你计算机上的大多数文件和目录定义了默认设置。如果应用了错误的上下文设置，你只需要输入 `restorecon` 即可从策略重新应用到文件系统。\n\
  \n像这样使用 `restorecon` 对于修复新文件的问题非常有用。在解释如何做它之前，让我们先来看看是如何应用新的上下文设置的：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/squf.jpg) 如果创建一个新文件，它将继承父目录的上下文设置。\n\n![Image](img/squf.jpg) 如果将文件复制到目录，这被视为一个新文件，因此它会继承父目录的上下文设置。\n\
  \n![Image](img/squf.jpg) 如果移动文件，或在保留其属性的同时复制（通过使用 `cp -a`），则应用文件的原始上下文设置。\n\n这三种情况中的后一种特别可以通过使用\
  \ `restorecon` 轻松修复。在练习 21.4 中，我们模拟了这个问题，并你使用 `restorecon` 修复了它。\n\n也可以重新应用上下文设置。在策略中，对你计算机上的大多数文件和目录定义了默认设置。如果应用了错误的上下文设置，你只需要输入\
  \ `restorecon` 即可从策略重新应用到文件系统。\n\n（注：由于原文后续部分存在大量重复，此处译文已剔除重复内容并保留核心逻辑。）\n\n\n\n\
  \n`ftpd_use_fusefs` --> off\n`ftpd_use_nfs` --> off\n`ftpd_use_passive_mode` -->\
  \ off\n`httpd_can_connect_ftp` --> off\n`httpd_enable_ftp_server` --> off\n`sftpd_anon_write`\
  \ --> off\n`sftpd_enable_homedirs` --> off\n`sftpd_full_access` --> off\n`sftpd_write_ssh_home`\
  \ --> off\n`tftp_anon_write` --> off\n`tftp_home_dir` --> off\n\n***\n\n要更改布尔值，你可以使用\
  \ `setsebool`。例如，如果你想切换 `ftpd_anon_write` 布尔值以允许写入，可以使用 `setsebool ftpd_anon_write\
  \ on`。这会改变布尔值的运行时值，但不会永久更改。要对布尔值应用永久更改，请使用 `setsebool -P`。注意这需要更长时间，因为策略的部分内容需要重新编译以应用修改。在练习\
  \ 21.5 中，你将应用这些命令查看布尔值是如何工作的。\n\n***\n\n### 练习 21.5 使用 SELinux 布尔值\n\n1. 从 root\
  \ shell 中，输入 `getsebool -a | grep ftp`。你会看到 `ftpd_anon_write` 布尔值，其当前值为 off。\n2.\
  \ 输入 `setsebool ftpd_anon_write on`。这会更改运行时的值。\n3. 输入 `getsebool ftpd_anon_write`。它显示布尔值为\
  \ on。\n4. 输入 `semanage boolean -l | grep ftpd_anon`。注意，此命令显示运行时配置设置为 on，但永久设置仍为\
  \ off。\n5. 使用 `setsebool -P ftpd_anon_write on` 将布尔值的运行时和默认设置都切换为 on。\n6. 重复 `semanage\
  \ boolean -l | grep ftpd_anon`。注意它现在被设置为 on, on。\n\n***\n\n### 诊断和解决 SELinux 策略违规问题\n\
  \n配置 SELinux 的系统是一项具有挑战性的任务。为了更容易理解正在发生什么，SELinux 会记录它所做的一切操作。获取日志信息的主要来源是审计日志，位于\
  \ `/var/log/audit/audit.log`。SELinux 消息带有 `type=AVC` 记录在审计日志中。因此，要查看 SELinux 在做什么，可以使用命令\
  \ `grep AVC /var/log/audit/audit.log`。如果记录了 SELinux 消息，该命令将显示如列表 21.6 所示的结果。\n\n\
  **列表 21.6** 从 Audit.log 获取 SELinux 消息\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server1\
  \ audit]# grep AVC audit.log\n\ntype=USER_AVC msg=audit(1414933364.949:11): pid=1\
  \ uid=0 auid=4294967295\nses=4294967295\nsubj=system_u:system_r:init_t:s0 msg='avc:\
  \  received setenforce notice\n(enforcing=0)\nexe=\"/usr/lib/systemd/systemd\" sauid=0\
  \ hostname=? addr=? terminal=?'\ntype=AVC msg=audit(1414933365.304:13): avc:  denied\
  \  { read } for\npid=1330 comm=\"alsactl\"\nname=\"asound.state\" dev=\"dm-1\" ino=72731037\
  \ scontext=system_u:system-\nr:alsa_t:s0-s0:c0.c1023\ntcontext=system_u:object_r:file_t:s0\
  \ tclass=file\ntype=AVC msg=audit(1414933365.304:13): avc:  denied  { open } for\n\
  pid=1330 comm=\"alsactl\"\npath=\"/var/lib/alsa/asound.state\" dev=\"dm-1\" ino=72731037\
  \ scontext=\nsystem_u:system_r:alsa_t:\ns0-s0:c0.c1023 tcontext=system_u:object_r:file_t:s0\
  \ tclass=file\ntype=AVC msg=audit(1414933365.304:14): avc:  denied  { getattr }\
  \ for\npid=1330 comm=\"alsactl\"\npath=\"/var/lib/alsa/asound.state\" dev=\"dm-1\"\
  \ ino=72731037 scontext=\nsystem_u:system_r:alsa_t:\ns0-s0:c0.c1023 tcontext=system_u:object_r:file_t:s0\
  \ tclass=file\n```\n\n***\n\n乍看之下，SELinux 日志消息看起来很复杂。但是，如果你仔细观察，它们并没有那么难理解。让我们仔细查看日志文件的最后一行：\n\
  \n点击此处查看代码图像\n\n```\ntype=AVC msg=audit(1414933365.304:14): avc:  denied  { getattr\
  \ } for\npid=1330\ncomm=\"alsactl\" path=\"/var/lib/alsa/asound.state\" dev=\"dm-1\"\
  \nino=72731037\nscontext=system_u:system_r:alsa_t:s0-s0:c0.c1023 tcontext=system_u:obj\n\
  ect_r:file_t:s0\ntclass=file\n```\n\n这一行中第一个相关部分是文本 `avc: denies { gettattr }`（注意：原文为\
  \ `gettattr`，但根据语境指的是 `getattr`）。这意味着一个 `getattr` 请求被拒绝了，因此某些进程尝试读取文件的属性但被拒绝了。紧接这条消息，我们可以看到\
  \ `comm=alsactl`，这意味着 `alsactl` 是该进程。\n\n（后续为重复性说明文字，已根据要求提取核心内容）\n\n\n\n\n本章提供了关于\
