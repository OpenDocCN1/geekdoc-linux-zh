  \ SMB 共享，用户可以使用 `cifscreds` 将其用户名添加到当前会话中。默认情况下，使用当前用户名。如果需要，可以使用 `-u username`\
  \ 选项使用另一个用户名。因此，如果当前用户 `lara` 已登录，请使用 `cifscreds add server1`。然后，输入用户 `lara` 的密码。现在`lara`\
  \ 就可以访问多用户挂载的 Samba 共享，她将拥有分配给其账户的所有该共享权限。在练习 37.5 中，你将学习如何执行多用户 Samba 挂载。\n\n***\n\
  \n# 练习 37.5 配置多用户 SMB 挂载\n\n在本次练习中，你将继续完成在之前的实验中创建的设置。\n\n1. 在 `server2` 上打开一个 root\
  \ shell。输入 `mkdir /mnt/multiuser` 为多用户挂载创建挂载点。\n\n2. 创建一个凭据文件以自动挂载多用户共享。使用文件名 `/root/smb-multiuser`\
  \ 并确保其包含以下内容：\n\n   ```\n   username=lisa\n   password=password\n   ```\n\n3. 在\
  \ `/etc/fstab` 中添加以下行，以便在服务器启动时执行基础多用户挂载：\n\n   点击此处查看代码图像\n\n   ```\n   //server1/sambashare\
  \      /mnt/multiuser      cifs\n   credentials=root/smb-multiuser,multiuser,sec=ntlmssp\
  \      0 0\n   ```\n\n4. 从 `/etc/fstab` 中移除所有其他 Samba 挂载。\n\n5. 输入 `mount /mnt/multiuser`\
  \ 验证多用户挂载是否正确加载。\n\n6. 尝试使用 `touch file1` 向 `/mnt/multiuser` 写入文件。由于用户 `lisa` 对该共享没有写权限，此命令将失败。\n\
  \n7. 仍在 `server2` 上，以用户 `lara` 的身份打开终端会话。\n\n8. 输入 `cifscreds add server1` 并输入 Samba\
  \ 用户 `lara` 的密码。\n\n9. 向 Samba 共享写入文件。注意该共享现在是可读/写访问的。\n\n***\n\n## 通过 automount\
  \ 挂载 Samba 共享\n\n在某些情况下，通过 `autofs` 挂载 Samba 共享是非常有用的。正如之前讨论过的，有不同的方法允许你使用自动挂载。你可以通过\
  \ `autofs` 服务或 `systemd` 自动挂载单元使用它。在本节中，我们重点关注 `autofs` 自动挂载。\n\n与任何自动挂载配置一样，首先你需要创建一个\
  \ `/etc/auto.master` 文件。在 `auto.master` 文件中，你引用需要监控的目录以及用于监控它的文件。例如，如果你想为自动挂载启用\
  \ Samba 主目录，请为其提供以下内容：\n\n   点击此处查看代码图像\n\n   ```\n   /home/guests      /etc/auto.guests\n\
  \   ```\n\n然后，你需要创建文件 `/etc/auto.guests`。要通过此文件挂载主目录，从 `*` 开始，意味着“在 `/home/guests`\
  \ 中访问的任何目录”。然后你需要指定挂载选项。对于 `CIFS` 挂载，它类似于：\n\n   点击此处查看代码图像\n\n   ```\n   -fstype=cifs,username=ldap,password=password\
  \ //server1.example.com/homes\n   ```\n\n（注意，这些都在同一行。）同时确保将权限模式设置为 `400`，以便非 root\
  \ 用户无法看到用户名和密码。注意你也可以像之前的那样将其配置为多用户挂载。创建此配置后，重启 `autofs` 服务，你应该应该能够通过自动挂载挂载 Samba\
  \ 主目录。在练习 37.6 中，你将学习如何自动挂载 `//server1/sambash`。\n\n***\n\n## 练习 37.6 通过 automount\
  \ 挂载 Samba 共享\n\n在本次练习中，你将学习如何通过自动挂载挂载简单的 Samba 共享。为了简单起见，使用了固定的用户名和密码。你使用了之前练习中创建的\
  \ `//server1/sambash`。\n\n1. 在 `server2` 上，打开一个 root shell。\n2. 打开 `/etc/auto.master`\
  \ 文件并添加以下行：\n\n   点击此处查看代码图像\n\n   ```\n   /srv/samba      /etc/auto.samba\n   ```\n\
  \n3. 创建名为 `/etc/auto.samba` 的文件并赋予以下内容：\n\n   点击此处查看代码图像\n\n   ```\n   sambash -fstype=cifs,username=lara,password=password\
  \ //server1/sambash\n   ```\n\n4. 使用 `chmod 400 /etc/auto.samba` 确保除了 root 之外无人可以读取凭据文件中的用户名和密码。\n\
  5. 使用 `systemctl autofs restart` 重启 `autofs` 服务。\n6. 仍在 `server2` 上，通过 `cd /srv/sambash`\
  \ 访问 Samba 共享。输入 `mount` 验证挂载。\n\n***\n\n#### 总结\n\n在本章中，你学习了如何通过自动挂载挂载简单的 Samba\
  \ 共享...通过自动挂载挂载 Samba 共享。\n\n\n\n\n\n![Image](img/squf.jpg) 销售共享目录应允许销售组的所有成员具有写访问权限，并对账户组成员具有只读访问权限。其他用户不应访问此共享目录。\n\
  \n![Image](img/squf.jpg) 共享账户应允许账户组的所有成员具有写访问权限，并对账户组成员具有只读访问权限。其他用户不应访问此共享账户。\n\
  \n2. 配置防火墙和 SELinux 以获得 Samba 共享的完全访问权限。\n\n3. 在 `server2` 上，为这两个共享都配置多用户共享。创建一个对这两个共享都具有最小权限的\
  \ Samba 用户账户。配置 `/etc/fstab` 以自动挂载这些共享。\n\n4. 通过以每个组成员的身份访问共享，测试多用户挂载的工作情况。验证对共享的读取和写入权限。\n\
  \n## 第 38 章。设置 SMTP 服务器\n\n本章涵盖了以下主题：\n\n![Image](img/squf.jpg) 理解邮件基础\n\n![Image](img/squf.jpg)\
  \ 配置 Postfix 参数\n\n![Image](img/squf.jpg) 验证正常的邮件配置\n\n本章涵盖了以下 RHCE 考试目标：\n\n![Image](img/squf.jpg)\
  \ 配置系统将所有邮件转发到中央邮件服务器\n\n邮件处理是许多 Linux 服务器上需要执行的一项任务，无论它们提供的是哪种特定服务。在很多情况下，这些服务通常需要发送邮件。这就是为什么作为\
  \ RHCE，你需要能够配置服务器将邮件转发到中央邮件服务器。在本章中，你将学习如何实现这一点。\n\n### 我已经掌握这些了吗？测验\n\n“我已经掌握这些了吗？”测验可以让你评估自己应该透彻阅读整个章节，还是直接跳到“考试准备任务”部分。如果你对这些问题的答案或你对这些主题知识的自评有疑问，请阅读整个章节。表\
  \ 38.1 列出了本章中的主要标题及其对应的“我已经掌握这些了吗？”测验问题。你可以在 附录 A，“‘我已经掌握这些了吗？测验和‘复习题’的答案](#app01.html_app01)”中找到答案。\n\
  \n![Image](img/38tab01.jpg)\n\n**表 38.1** “我已经掌握这些了吗？”章节与问题映射\n\n**1.** 下列哪个参数允许你指定\
  \ Postfix 邮件服务器应该在哪个网卡上监听传入的连接？\n\n**a.** `inet_interfaces`\n\n**b.** `myorigin`\n\
  \n**c.** `relayhost`\n\n**d.** `mynetworks`\n\n**2.** 下列哪个 Postfix 参数允许你指定邮件应该转发到哪里？\n\
  \n**a.** `inet_protocols`\n\n**b.** `relayhost`\n\n**c.** `mydestination`\n\n**d.**\
  \ `mynetworks`\n\n**3.** 下列哪个邮件处理角色描述了配置中负责与收件者的邮件服务器通信的部分？\n\n**a.** MUA\n**b.**\
  \ MSA\n**c.** MTA\n**d.** MDA\n\n**4.** 最重要的 Postfix 配置文件的名称是？\n\n**a.** `/etc/postfix/postfix.conf`\n\
  \n**b.** `/etc/postfix/master.cf`\n**c.** `/etc/postfix/main.cf`\n\n**d.** `/etc/postfix/config.cf`\n\
  \n**5.** 下列哪个*不是* Postfix 进程？\n\n**a.** qmgr\n**b.** pickup\n**c.** postfix\n**d.**\
  \ sendmail\n\n**6.** 在修复了无法到达邮件服务器的问题后，你注意到邮件没有立即发送。使用哪个命令可以将队列中的邮件立即发送？\n\n**a.**\
  \ mailmaster\n**b.** post\n**c.** qqueue\n**d.** sendmail\n\n**7.** 哪个日志文件包含关于交付成功或失败的详细信息？\n\
  \n**a.** `/var/log/maillog`\n**b.** `/var/log/messages`\n**c.** `/var/log/mail`\n\
  **d.** `/var/log/log`\n\n**8.** 哪个命令允许你修改 Postfix 参数？\n\n**a.** postfix\n**b.**\
  \ postconf\n**c.** postman\n**d.** sendmail-f\n\n**9.** 在发送邮件时，你注意到 Postfix 邮件服务器没有接受。你应该更改哪个参数启用它？\n\
  \n**a.** `inet_interfaces`\n**b.** `myorigin`\n**c.** `mydestination`\n**d.** `inet_protocols`\n\
  \n**10.** 你想测试空客户端是否可以成功发送邮件。下列哪个反映了从命令行向 root 发邮件？\n\n**a.** `mail -s root <`\n\
  **b.** `mail -s root.`\n**c.** `mail -s root>`\n**d.** `mail`\n\n### 基础知识\n\n####\
  \ 理解邮件基础\n\n在设置邮件处理环境时，有助于正在发生的情况。在本节中，你将学习参与者可以扮演的角色。你还将更多了解邮件本身。\n\n##### 邮件处理中的角色\n\
  \n在邮件处理中，参与者可以担任不同的角色：\n\n![Image](img/key_topic.jpg)\n\n![Image](img/squf.jpg)\
  \ **MTA.** MTA 是邮件传输代理。这是从邮件服务器到邮件服务器的部分。MTA 使用简单邮件传输协议 (SMTP) 向其他服务器发送邮件。为了找到用于此目的的服务器，使用了\
  \ MX 记录。互联网邮件通信仅发生在 MTA 服务器之间。\n\n![Image](img/squf.jpg) **MDA.** 当 MTA 接收到针对本地用户的邮件时，邮件会被传递给邮件交付代理\
  \ (MDA)。MDA 的最终目标是将邮件递送到用户的信箱中；可以使用不同的程序来实现此目的。如果什么都没有配置，邮件将递送到邮件进入的服务器上本地 Linux\
  \ 用户的信箱。在 RHEL 7 上，此 MDA 的默认位置是 `/var/spool/mail/$USER`，例如 `/var/spool/mail/linda`。\n\
  \n![Image](img/squf.jpg) **MUA.** 当用户想要发送或读取邮件时，使用的是邮件用户代理 (MUA)。这通常是用户使用的程序，例如命令行邮件客户端；Mutt、Pine\
  \ 或 Elm 提供的文本用户界面；或者 Evolution 或 Thunderbird 等图形客户端。\n\n另一个重要的角色是运行空客户端的机器。此类无法接收任何消息，但具有向其他主机发送邮件所需的所有配置。典型的终端工作站配置为空客户端。在空客户端上，这通常通过使用中继主机\
  \ 实现。RHCE 目标要求你能够配置空客户端。\n\n##### 邮件传输过程\n\n\n\n\n\n每台 `RHEL` 服务器默认都运行着一个邮件服务器进程。该进程由\
  \ `Postfix` 邮件服务器启动。在默认配置下，只要邮件服务器域名的域名系统系统（DNS）配置正确，该邮件服务器进程就可以向互联网上的其他邮件服务器发送消息。通常情况下，如果邮件服务器的\
  \ IP 地址可以解析回该服务器所属的域名，则该邮件服务器就可以向互联网上的其他 MTA 发送消息。不过，默认邮件服务器进程无法接收消息。\n\n要发送电子邮件，客户端应用程序（如\
  \ `Mutt` 或 `Evolution`）会与发出的邮件服务器通信。该邮件服务器将主机中继到最终目的地。为了实现这一点，邮件服务器查看 `/etc/nsswitch.conf`\
  \ 文件以确定首先去哪里进行名称查找。然后它将使用 `/etc/hosts` 文件或 `DNS` 来查找目标域的 `MX` 记录。例如，如果你向 `mail@sandervanvugt.com`\
  \ 发送邮件，你的 MTA 就会查找 `sandervanvugt.com` 的 `MX` 记录。该 `MX` 记录标识了正确的邮件服务器，如果目标邮件服务器配置为接收传入消息，它最终会将消息投递到端用户的邮箱中。\n\
  \n发出的邮件服务器可能配置为要求内部客户端进行身份验证。对于 `RHCE` 考试，你不需要设置客户端认证，`my_network` 参数除外，该参数允许你指定发出的邮件服务器接受哪些网络的客户端。\n\
  \n接收端邮件服务器默认将消息投递到接收用户的邮箱中，该邮箱位于 `/var/spool/mail/$USER`。如果接收者是一个用户，可以使用 `Mutt`\
  \ 等命令行客户端访问消息，你甚至可以使用文本文件查看器查看文件内容。例如，使用 `cat /var/spool/mail/linda` 来查看邮件池中是否有给用户\
  \ `linda` 的邮件。在许多现代电子邮件解决方案中，客户端并不直接访问处理传入邮件的服务器上的 shell，而是使用一个额外的服务来实现此目的。通常，`Dovecot`\
  \ 或 `Cyrus` 服务提供用户访问邮箱的功能，并添加了诸如使用邮局协议 (`POP`）下载消息或通过互联网消息组访问协议 (`IMAP`）在线访问邮箱等功能。\n\
  \n图 38.1 说明了电子邮件处理过程中发生的情况。\n\n![Image](img/38fig01.jpg)\n\n**图 38.1** 邮件传输过程概述。\n\
  \n在图 38.1 中，`server1.example.com` 上的控制用户想向 `user2@example.org` 发送消息。为了传递此消息，将执行以下步骤：\n\
  \n1. `user1@server1.example.com` 使用邮件客户端编写消息。\n2. 用户发送消息，由本地 `Postfix` 进程进一步处理。\n\
  3. 本地 `Postfix` 进程被配置为空客户端（null client），并将消息中继到作为中继主机的 `smtp.example.com`。\n4. `smtp.example.com`\
  \ 执行 `DNS` `MX` 记录查找，发现 `server2.example.org` 配置为处理 `example.org` 的传入。\n5. 消息被转发到\
  \ `server2.example.org`。\n6. `server2.example.org` 将消息投递到用户的本地邮箱中，该邮箱位于 `/var/spool/mail/$USER`。\n\
  7. 用户使用配置为通过 `IMAP` 的 `MUA` 从本地邮箱中获取消息。\n\n### RHEL 7 上的邮件服务器解决方案\n\n在 Linux 上，有多种邮件服务器解决方案。过去，`Sendmail`\
  \ 邮件服务是最常见的 Linux 邮件服务器。然而，它非常复杂，且使用的语法难以理解。尽管很复杂，`Sendmail` 成为 Linux 邮件处理的标准。`Postfix`\
  \ 的开发是为了兼容 `Sendmail` 但更易配置。\n\n在 `RHEL 7` 上，使用 `Postfix` 作为邮件服务。`Postfix` 由不同的进程组成，每个进程负责特定的任务。这些进程由\
  \ `Postfix` 主服务引导，主服务读取 `/etc/postfix/master.cf` 配置文件来确定哪些服务用于特定任务。这种方法使得 `Postfix`\
  \ 具有模块化和插拔性；如果需要，很容易将一个特定服务替换另一个。`Postfix` 进程的一些示例列在表 38.2 中，列表 38.1 显示了 `/etc/postfix/master.cf`\
  \ 配置文件的部分内容。\n\n![Image](img/key_topic.jpg)![Image](img/38tab02.jpg)\n\n**表 38.2**\
  \ Postfix 服务器进程概述\n\n***\n\n提示\n\n你不需要死记所有 `Postfix` 进程的名字。不过，如果你能在阅读日志时识别出 `Postfix`\
  \ 进程以理解为什么消息无法发送，那是有帮助的。\n\n***\n\n**列表 38.1** /etc/postfix/master.cf 配置文件的部分列表\n\
  \n点击此处查看代码图片\n\n***\n\n```\n[root@server1 postfix]# head -n 20 master.cf\n```\n\n\
  ```\n#\n\n# Postfix master process\n```\n\n\n\n\n```\naddress_verify_cache_cleanup_interval\
  \ = 12h\naddress_verify_default_transport = $default_transport\naddress_verify_local_transport\
  \ = $local_transport\naddress_verify_map = btree:$data_directory/verify_cache\n\
  address_verify_negative_cache = yes\naddress_verify_negative_expire_time = 3d\n\
  address_verify_negative_refresh_time = 3h\naddress_verify_poll_count = ${stress?1}${stress:3}\n\
  address_verify_poll_delay = 3s\naddress_verify_positive_expire_time = 31d\naddress_verify_positive_refresh_time\
  \ = 7d\naddress_verify_relay_transport = $relay_transport\naddress_verify_relayhost\
  \ = $relayhost\naddress_verify_sender = $double_bounce_sender\naddress_verify_sender_dependent_default_transport_maps\
  \ = $sender_dependent_default_transport_maps\naddress_verify_sender_dependent_relayhost_maps\
  \ = $sender_dependent_relayhost_maps\naddress_verify_sender_ttl = 0s\n```\n\n###\
  \ 核心参数理解\n\n在 Postfix 配置中有许多参数。对于设置一个可以将邮件转发到中央邮件服务器的环境来说，只有少数几个是真正重要的。在考试时，请确保你了解所有这些参数。表\
  \ 38.3![Image](img/38tab03.jpg)\n\n**表 38.3** 核心 Postfix 参数\n\n要考虑的第一个参数是 `inet_interfaces`。默认情况下，它设置为\
  \ `loopback only`（仅限环回）。如果你的邮件服务器只需要发送外发邮件，那么这样做没有问题（当 Postfix 运行在具有 null 角色的机器上时，通常是如此），但如果你想为服务器配置接收邮件，则必须指定\
  \ Postfix 进程监听的 IP 地址或地址，例如 `inet_interfaces = 10.0.0.1, localhost`。\n\n`myorigin`\
  \ 参数用于重写邮件的源地址。如果 server1.example.com 用户 linda 发送了消息，默认设置会使消息看起来来自 linda@server1.example.com。在收件人地址中跳过主机部分是常见的，这样消息就来自\
  \ linda@example.com。（邮件收件者通常不在乎邮件最初是从哪个服务器发送的。）为了实现这一点，可以使用变量。`myorigin` 参数默认设置为\
  \ `$myhostname`。将其更改为 `$mydomain`，这样域名部分将只显示在邮件头中。\n\n![Image](img/key_topic.jpg)\n\
  \n配置中非常重要的部分是 `relayhost`（中继主机）设置。中继主机通常是一个中央邮件服务器，它配置了更高级的安全设置，并负责将邮件发送到互联网上的其他\
  \ SMTP 主机。随着加强邮件相关安全的尝试，使用中继主机已变得越来越普遍。\n\n要将所有消息转发到中央中继主机，在此处指定该主机名称。默认行为是 Postfix\
  \ 将对你指定的内容进行 DNS MX 记录查找。如果你只指定主机名，请将其放在方括号之间，以便不进行 DNS 查找。\n\n`mydestination` 参数对于接收消息很重要，而不是对于发送消息。在此列出的域名的邮件地址将被投递到本地邮箱。你需要使用\
  \ `mydestination` 参数配置你的 Postfix 服务器，以便它知道它负责的所有域名称。特别是当你的邮件服务器托管了几个不同的邮件域时，你需要这样做。请确保包含你的邮件服务器接收邮件的所有域的域名。\n\
  \n`local_transport` 参数也用于接收邮件的服务器。它可以用于指定本地目的地的名称，以进一步处理消息。例如，你可以使用它在邮件投递到用户邮箱之前由垃圾邮件过滤器进行处理。根据当前的\
  \ RHCE 规范，你不需要配置此参数。\n\n如果你正在建立自己的测试环境，则 `inet_protocols` 参数是关键的。默认情况下，Postfix 使用\
  \ IPv6。这意味着对所使用的主机名（如 relayhost）的 DNS 查找也将通过 IPv6 进行。如果你有一个 DNS 服务器没有配置为 IPv6，则邮件投递将失败。解决此问题的简单方法是仅使用\
  \ IPv4。要做到这一点，请确保设置 `inet_protocols = ipv4`。如果你的邮件服务器用于 DNS 可用并设置为处理 IPv4 以及 IPv6\
  \ 流量的环境，则你不需要更改此参数。\n\n最后，`mynetworks` 参数用于指定逗号分隔的 IP 地址和网络列表，这些网络允许向你的服务器中继消息。这是防止滥用的一种基本保护，在固定网络中，只接受来自自身网络的主机，其他所有消息将不再被处理。虽然使用此参数增加了你服务器的安全性，但它并没有让移动用户变得更方便。连接到未知\
  \ WiFi 网络的用户将必须使用该特定 WiFi 网络提供的邮件服务器，因为你的邮件服务器会拒绝他们。如果你想使用此设置来加强安全，可以考虑添加虚拟专用网络\
  \ (VPN) 安全，确保用户始终来自熟悉的网络。\n\n### 配置 Postfix 用于中继邮件\n\n要配置你想要使用的邮件服务器参数，你可以直接编辑 `/etc/postfix/main.cf`\
  \ 的内容，或使用 `postconf` 命令。如果不带任何参数，`postconf` 命令将列出 Postfix 使用的所有参数。如果你对输出使用 `grep`，你就可以轻松地找到需要的设置。你也可以通过使用\
  \ `-e` 参数后跟设置来使用 `postconf` 修改。38.1 展示了如何操作。\n\n**提示：** RHCE 目标要求你能够配置 Postfix 中继到另一台服务器。因此，请确保你能处理练习\
  \ 38.1 中描述的任务。\n\n#### 练习 38.1 使用 postconf 修改 Postfix 参数\n\n1. 在 server1 上，打开 root\
  \ shell 并输入 `postconf`。你将看到当前 Postfix 设置的长列表。\n2. 输入 `postconf myorigin`。这显示 `myorigin`\
  \ 设置的当前值。\n3. 输入 `postconf mdomain` 以验证 `mydomain` 参数的当前值。\n4. 输入 `postconf -e ‘myorigin\
  \ = $mydomain’` 来更改 `myorigin` 参数的值。\n5. 重复命令 `postconf myorigin`。注意目前还没有变化。\n6.\
  \ 输入 `postfix check`。这检查 `/etc/postfix/main.cf` 文件的内容并在有问题时报警（在使用新配置之前始终是一个明智的选择）。\n\
  7. 重载 Postfix，使用 `systemctl reload postfix`，并重复第 5 步。你会看到设置已经更改。\n8. 输入 `postconf\
  \ -n`。这显示所有与默认值不同的参数。\n\n**提示：** 阅读 `man 5 postconf` 以获取所有 816 个 Postfix 参数的完整概述和解释。在处理\
  \ RHCE Postfix 相关的任务时，请确保记住这个帮助页面。\n\n\n\n\n现在你已经了解了如何更改 Postfix 的设置，让我们来看如何在所谓的“空客户端（null\
  \ client）”配置中配置 Postfix。如前所述，这种配置是指用户可以在空客户端上运行邮件客户端，空客户端被配置为将邮件消息转发到中继主机，但本地的 Postfix\
  \ 服务不接受任何入站邮件。注意，这种配置似乎与 RHCE 关于 Postfix 配置的目标完全匹配。在练习 38.2 中，你将把 `server1` 设置为空客户端，并将\
  \ `server2` 设置为接收传入消息的服务器。\n\n***\n\n### 练习 38.2 配置 Postfix 空客户端设置\n\n注意，在本次练习中，你配置了两台服务器。在\
  \ `server1` 上执行的任务展示了如何设置空客户端。在 `server2` 上，你配置了一个确实接收传入消息的邮件服务器。这超出了 RHCE 的目标，但了解如何这样做对于你建立一个可以运行的邮件配置非常有帮助。要执行此练习，你需要使用\
  \ DNS 服务。你可以使用 [`www.rhatcert.com`](http://www.rhatcert.com) 提供的 IPA 服务器虚拟机 (VM)，或者根据附录\
  \ D 中“设置身份管理”的说明构建你自己的 IPA 服务器。\n\n1. 在 `server1` 上打开一个 root shell。\n2. 使用 `host\
  \ server2` 验证你是否可以解析 `server2`。`host` 命令应该返回 `server2` 当前正在使用的 IP 地址。\n3. 输入 `postconf\
  \ -e ‘relayhost=[server2.example.com]’` 将消息转发到 `server2`。\n4. 使用 `postconf -e ‘inet_interfaces=loopback-only’`\
  \ 确保你的服务器只能中继从该服务器发送的消息。\n5. 输入 `postconf mynetworks` 以验证只有源自回环 IP 地址的消息才会被接受。\n\
  6. 输入 `postconf -e ‘mydestination=’`。这确保了 `server1`  Postfix 没有目标地址。\n7. 使用 `postconf\
  \ -e ‘inet_protocols=ipv4’` 禁用 IPv6。\n8. 输入 `postconf -e ‘mydomain=example.com’`\
  \ 更改每条发送消息的来源。\n9. 输入 `systemctl reload postfix` 重启 `server1` 上的 Postfix 服务器。\n\
  10. 在 `server2` 上，使用以下命令使服务器能够接收 `server1` 转发的消息：\n\n```\npostconf -e 'inet_interfaces=all'\n\
  postconf -e 'mydestination = example.com,server2.example.com'\npostconf -e 'inet_protocols\
  \ = ipv4'\n```\n\n11. 在 `server2` 上，输入 `firewall-cmd --add-service smtp --permanent`\
  \ 然后跟上 `firewall-cmd --reload` 将 SMTP 服务添加到防火墙。\n12. 在 `server1` 上，输入 `mail -s test1\
  \ root@server2.example.com <`。\n13. 在 `server2` 上，以 root 身份输入 `mail`。你应该看到刚刚从另一个服务器发送的测试消息。\n\
  \n***\n\n***\n\n### 提示\n\n再次强调，在考试中，你不需要知道如何配置邮件服务器来接收入站邮件。\n\n***\n\n#### 验证可运行的邮件配置\n\
  \n如前所述，设置空邮件客户端并不困难。然而，如果你忘记更改某项关键设置，你可能会发现配置无法工作。如果发生了这种情况，知道去哪里查看以修复问题是有好的。以下提示将帮助你找到问题：\n\
  \n![Image](img/squf.jpg) 在发送邮件的服务器上，输入 `tail -f /var/log/maillog` 查看你的消息发生了什么。列表\
  \ 38.3 显示了 `/var/log/maillog` 文件的相关行，清楚地表明在尝试连接到无法访问的服务器后，消息已成功发送。\n\n**列表 38.3**\
  \ 使用 `/var/log/maillog` 分析邮件发送过程\n\n```\n[root@server1 postfix]# tail /var/log/maillog\n\
  \nApr 21 03:41:21 server1 postfix/postfix-script[1879]: starting the\nPostfix mail\
  \ system\nApr 21 03:41:21 server1 postfix/master[1884]: daemon started -- version\n\
  2.10.1, configuration /etc/postfix\nApr 23 03:30:26 server1 postfix/postfix-script[1662]:\
  \ starting the\nPostfix mail system\nApr 23 03:30:26 server1 postfix/master[1664]:\
  \ daemon started -- version\n2.10.1, configuration /etc/postfix\nApr 23 07:35:47\
  \ server1 postfix/pickup[6298]: 968D09B46BB: uid=0\nfrom=<root>\nApr 23 07:35:47\
  \ server1 postfix/pickup[6298]: 968D09B46BB: uid=0\nfrom=<root>\nApr 23 07:35:47\
  \ server1 postfix/pickup[6298]: 968D09B46BB: uid=0\nfrom=<root>\n```\n\n\n\n\n11.\
  \ 在 server2 上，打开一个 root shell 并输入 `mail`。你会看到消息现在已经送达。\n\n12. 在 server1 和 server2\
  \ 上再次输入 `tail /var/log/maillog`。这允许你看到消息成功送达时的状态。\n\n***\n\n提示\n\n如果消息卡在邮件队列中且你想将其删除，可以使用\
  \ `postsuper -d` 命令。\n\n***\n\n#### 总结\n\n在本章中，你学习了如何设置一个基础的 Postfix 配置，其中 Postfix\
  \ 空客户端被配置为将消息转发到中继主机（relay host），由该主机负责后续的消息处理。这并没有教你如何配置一个完全工作的邮件解决方案，但它涵盖了 RHCE\
  \ 的目标。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n回顾本章中最重要的主题，这些主题在页面的外边上已用关键主题图标进行了标记。表\
