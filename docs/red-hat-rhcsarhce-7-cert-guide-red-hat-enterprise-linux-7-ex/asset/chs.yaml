  \n连接 (connection)\n\n#### 复习题\n\n**1.** 你需要哪两个命令来缓存设置在私钥上的密码短语？\n\n**2.** 你想禁止 root\
  \ 登录并只允许用户 `lisa` 登录你的服务器。你应该如何做？\n\n**3.** 你如何配置你的 SSH 服务器使其监听两个不同的端口？\n\n**4.**\
  \ 你使用哪些选项来创建后台 `ssh` 连接？\n\n**5.** 在为密钥配置密码短语时，它将存储在何处？\n\n**6.** 你想将端口 `5555` 转发到\
  \ `server1` 上的 `80` 端口。你应该如何做？\n\n**7.** 使用 `ssh` 转发 `server2.com` 上的 `8088` 端口。\n\
  \n**8.** 你如何配置 `sshd` 绑定到 NTP 节点？\n\n**9.** 你如何配置防火墙允许 `ssh` 连接？\n\n**10.** 为了允许远程端口转发，必须在\
  \ `sshd_config` 中配置哪个额外设置？\n\n### 章节末实验\n\n在章节末，你将配置 SSH 以增强安全性。使用 `server1` 设置端口转发，并将\
  \ `server2` 作为 SSH 客户端。\n\n#### 实验 39.1\n\n**1.** 配置你的 SSH 服务器，使空闲话至少保持开启一小时。加固你的\
  \ SSH 服务器，使其监听 `2022` 端口并仅允许用户 `lisa` 登录。确保防火墙以及 SELinux 都支持你的设置。\n\n**2.** 配置端口转发，将指向\
  \ `server1` `3333` 端口的连接转发到 `server2` 上的 Web 服务器。\n\n\n\n\n\n# 1.** 许多服务器应用程序依赖于时间同步。对于某些服务来说，同步时间并不是至关重要的。当时间同步丢失时，以下哪些服务会遇到问题？\n\
  \n**a.** DNS\n\n**b.** Kerberos\n\n**c.** LDAP 认证\n\n**d.** 数据库同步\n\n# 2.** 如果你的\
  \ RHEL 7 服务正在运行 IPA，由哪个服务负责时间同步？**\n\n**a.** `timedatectl`\n\n**b.** `ntpd`\n\n\
  **c.** `hwclock`\n\n**d.** `chronyd`\n\n# 3.** RHEL 7 上使用哪种服务作为默认服务来同步时间？\n\n**a.**\
  \ `timedatectl`\n\n**b.** `ntpd`\n\n**c.** `hwclock`\n\n**d.** `chronyd`\n\n# 4.**\
  \ 对于与互联网时间服务器成功建立同步的服务器，通常是哪种层级（stratum）？\n\n**a.** 1\n\n**b.** 3\n\n**c.** 7\n\n\
  **d.** 10\n\n# 5.** chronyd 配置文件的名称是什么？\n\n**a.** `/etc/chrony/chrony.conf`\n\n\
  **b.** `/etc/chrony.d/chronyd.conf`\n\n**c.** `/etc/chronyd.d/chronyd.conf`\n\n\
  **d.** `/etc/chrony.conf`\n\n# 6.** 你会在 `/etc/chrony.conf` 文件中包含哪一行，以使服务器在丢失外部同步时能够回退到本地时钟？\n\
  \n**a.** `server local stratum 10`\n\n**b.** `server localhost stratum 10`\n\n**c.**\
  \ `localhost stratum 10`\n\n**d.** `local stratum 10`\n\n# 7.** `chronyc sources`\
  \ 命令使用标题为 S 的列来表示 chrony 进程观察到的源的状态。对于 chrony 当前正在同步的源，你会看到什么？\n\n**a.** #\n\n**b.**\
  \ ?\n\n**c.** +\n\n**d.** x\n\n# 8.** 哪个命令可以让你找到 chrony 正在与哪些服务器同步？\n\n**a.** `chronyc\
  \ servers`\n\n**b.** `chronyc status`\n\n**c.** `chronyc sync`\n\n**d.** `chronyc\
  \ sources`\n\n# 9.** 哪个命令可以显示关于 chrony 进程与其分配服务器同步的详细信息？\n\n**a.** `chronyc servers`\n\
  \n**b.** `chronyc status`\n\n**c.** `chronyc tracking`\n\n**d.** `chronyc sources`\n\
  \n# 10.** 哪个命令可以让你查看 chrony 当前使用的每个源的漂移率（drift rate）和偏移（offset）？\n\n**a.** `chronyc\
  \ sources`\n\n**b.** `chronyc sourcestats`\n\n**c.** `chronyc tracking`\n\n**d.**\
  \ `chronyc status`\n\n### 基础知识\n\n#### 理解同步时间的需求\n\n在某些情况下，如果时间没有正确同步，并不是问题。但在另一些情况下，它是必要的。在不同机器提供的同步信息之间，时间戳经常起着重要作用。需要同步时间的服务数量正在增加，这就是为什么任何\
  \ Linux 服务器都应该与其权威服务器同步时间。\n\n特别需要同步时间的服务是数据库和 Kerberos。如果不同的服务器提供多个数据库实例，这些实例需要同步。为了有效地实现这一点，数据库通常会被时间标记。根据一台服务器设置的时间戳，另一台服务器可以查看数据是否已更新。这一过程不仅适用于数据库，也适用于其他需要同步时间的服务。\n\
  \n另一个时间重要的例子是基于 Kerberos 的认证。在基于 Kerberos 的认证中使用令牌，这些令牌的有效期有限。为了验证令牌的有效性，Kerberos\
  \ 服务器需要准确地同步时间。\n\n在现代网络中，使用网络时间协议（NTP）来同步时间。在 Red Hat Enterprise Linux 7 上，`chronyd`\
  \ 服务提供了 时间同步。\n\n#### 设置时间同步\n\n设置时间同步，你需要安装并配置处理该任务的服务。在 Red Hat Enterprise Linux\
  \ 7 上，可以使用两种不同的服务。默认服务是 `chronyd`，这是一个新设计的处理时间同步的服务。你可能仍然遇到旧的 `ntpd` 服务。\n\n***\n\
  \n提示\n\n`chronyd` 是 RHEL 上同步时间的默认服务。如果你使用 IPA 服务，你会发现自动配置了 `ntpd` 服务。因为这个集成服务与 `chronyd`\
  \ 不兼容，在这种情况下需要禁用它。要检查你的服务器上哪个服务在处理时间，可以使用命令 `netstat -tulpen | grep 123`，它会显示哪个服务在\
  \ UDP 端口 123 上提供时间服务：\n\n```\nnetstat -tulpen | grep 123\n```\n\n***\n\n在本章中，我们只涵盖\
  \ `chronyd`，因为它是 RHEL 首选服务。\n\n##### 理解 NTP\n\n使用网络时间协议同步时间。（等等，文本说：）\n使用网络时间协议同步时间。在详细介绍如何设置时间同步之前，了解\
  \ NTP 的工作原理是有意义的。\n\n在大型环境中同步时间，你需要一个可靠的时钟。在连接到互联网的网络上，可靠的时间是从互联网服务器获取的。这种外部时钟也被称为参考时钟。有多种硬件时钟模型，其中原子钟是最可靠的。\n\
  \n在许多服务提供时间的网络中，区分可靠服务器和不可靠服务器是非常重要的。为了表示 NTP 服务器的可靠性，使用了层级（stratum)的概念。低层级比高层级更可靠，因为低层级数字的服务器更接近硬件时钟。\n\
  \n层级由服务器管理员在配置外部时钟时分配，也可以从互联网服务器处继承（这是更常见的场景）。分级结构的顶端是第 1 层服务器。这些服务器直接连接到硬件时钟。直接与第\
  \ 1 层服务器同步的服务器本身能够向其他设备宣布第 2 层级。通过使用不同的层级，NTP 可以选择最可靠的服务器。\n\n在互联网上，有很多公共可访问的第 1\
  \ 层服务器。通常，pool.ntp.org 中的服务器用于此类目的。你将在本章晚些部分发现，该池中的服务器也被 `chronyd` 服务作为默认使用，该服务负责\
  \ RHEL 7 的时间同步。\n\n在正常运行的 NTP 服务器上，你通常只会看到低层级。层级 10 通常被分配给内部时钟。如果服务器上无法建立 NTP 同步，该服务器通常会显示层级\
  \ 16。\n\n\n\n\n\n## 配置 chrony 同步时间\n\n`chronyd` 服务使用 `/etc/chrony.conf` 配置文件来设置同步参数。该文件的默认内容包含了设置成功同步所需的所有内容。列表\
  \ 40.1 显示了一个示例列表，包含一个稍作修改的配置文件。\n\n**列表 40.1** `/etc/chrony.conf` 示例内容\n\n点击此处查看代码\n\
  \n***\n\n```bash\n[root@server1 ~]# cat /etc/chrony.conf\n\n# 使用 pool.ntp.org 项目的公共服务器。\n\
  \n# 请考虑加入池 (http://www.pool.ntp.org/join.html)。\n#server 0.centos.pool.ntp.org iburst\n\
  server 1.centos.pool.ntp.org iburst\n#server 2.centos.pool.ntp.org iburst\n#server\
  \ 3.centos.pool.ntp.org iburst\nserver ipa.example.com iburst\npeer server2.example.com\n\
  \n# 在源选择中忽略层级。\nstratumweight 0\n\n# 记录系统时钟获得/丢失时间的速率。\ndriftfile /var/lib/chrony/drift\n\
  \n# 启用内核 RTC 同步。\nrtcsync\n\n#在前三次更新中，如果调整大于 10 秒，\n# 则步进系统时钟而不是调速。\nmakestep 10\
  \ 3\n\n# 允许本地网络访问 NTP 客户端。\n#allow 192.168/16\n\n# 仅在本地主机监听命令。\nbindcmdaddress 127.0.0.1\n\
  bindcmdaddress ::1\n\n# 即使未同步到任何 NTP 服务器也提供时间。\n#local stratum 10\nkeyfile /etc/chrony.keys\n\
  \n# 指定用作 chronyc 密码的密钥。\ncommandkey 1\n\n# 如果缺失则生成命令密钥。\ngeneratecommandkey\n\n\
  # 禁用客户端访问日志记录。\nnoclientlog\n\n# 如果时钟调整大于 0.5 秒，则向 syslog 发消息。\nlogchange 0.5\n\
  logdir /var/log/chrony\n#log measurements statistics tracking\n```\n\n***\n\n配置\
  \ `chronyd` 进程的设置相对简单，因为大多数设置默认情况下就是好的。如果你什么都不做，只是启动并启用该服务，它会自动与 pool.ntp.org 中的时间服务器建立时间同步，该池是公共可用的\
  \ stratum 1 NTP 服务器池。\n\n如果你的服务器没有直接连接到互联网，你可能想在时间同步配置中设置一些阶段。在组织内部设置一个或两个中心时间服务器是比较常见的，这些服务器直接与互联网上的\
  \ NTP 时间源同步；默认的 `chrony` 配置就能实现这一点。\n\n在第二级层级上，可以配置服务器与这些中心服务器同步。要配置此项，你只需要输入服务器行来启用与特定服务器的同步。\n\
  \n为了实现完全的冗余，还可以安装第三层，其中服务器被配置为彼此的对等（peers）。在对等配置中，服务器之间不存在层级关系，但服务器在同一级别通信。如果与外部服务器的连接失败，结果是\
  \ NTP 仍然可以维持所有对等节点一致的共同时间。图 40.1 显示了此类配置可能的外观。\n\n![Image](img/40fig01.jpg)\n\n\
  **图 40.1** 设置冗余时间同步\n\n为了使配置万无一失，你可以启用 `local stratum 10` 这一行。这使得服务器在无法再访问外部服务器时能够回退到内部本地硬件时钟。如果发生这种情况，每台服务器都将独立运行，但至少它仍然具有\
  \ NTP 时间同步（即使是不可靠的时间同步）。这并不是极其有用，但总比没有。某些服务会检查是否建立了 NTP 时间同步，而不会检查它是如何建立的。即使你的服务器仅与自身建立了\
  \ stratum 10 NTP 同步，这些服务也能正常工作。\n\n## 使用 chronyc 管理和监控时间同步\n\n要检查你基于 chrony 的时间同步当前状态，可以使用\
  \ `chronyc` 命令。该命令提供了丰富的实用程序，让你能够看到正在发生的情况。表 40.2 提供了该命令最重要用例的概述。\n\n![Image](img/key_topic.jpg)![Image](img/40tab02.jpg)\n\
  \n**表 40.2** `chronyc` 摘要\n\n你可能想开始使用的命令是 `chronyc sources`。正如列表 40.2 所示，此命令提供了关于你的服务器当前正在同步的服务器的信息。\n\
  \n**列表 40.2** 使用 `chronyc sources` 显示当前同步源\n\n点击此处查看代码\n\n***\n\n```bash\n[root@server1\
  \ ~]# chronyc sources\n\n210 Number of sources = 2\nMS Name/IP address      Stratum\
  \ Poll Reach LastRx Last sample\n=======================================================================\n\
  ^* ipa.example.com      3      6    377     377     +198us\n=? server2.example.com\
  \  0      1      0       0       +0ns\n```\n\n***\n\n`chronyc sources` 的输出包含列。首先，`M`\
  \ 列表示类型。`^` 用于服务器，=` 表示对等节点，`#` 表示本地定义。`S` 列显示状态。此列中的 `*` 表示服务器已同步，此列中的 `+` 表示服务器是可以接受的，`x`\
  \ 用于错误，`~` 表示良好，`?` 表示无数据。\n\n下一列 `Poll` 显示轮询间隔。`Reach` 列包含成功轮询次数。`LastRx` 显示自上次更新以来的时间，`Last\
  \ sample` 显示与本地时钟之间的偏移。\n\n`chronyc sources` 命令提供了你判断同步是否建立所需的几乎所有信息，但还有其他有用的命令可以获取更多细节。`chronyc\
  \ sourats` 显示关于状态的统计信息。\n\n**列表 40.3** `chronyc sourats` 输出\n\n点击此处查看代码\n\n***\n\
  \n```bash\n[root@server1 ~]# chronyc sourats\n\n210 Number of sources = 2\nName/IP\
  \ Address  NP  NR  Span  Frequency  Offset  Std Dev\n======================================\n\
  ipa.example.com  6   4   323  0.016  1.122  +485ns 26us\nserver2.example.com  0\
  \   0   0  0.000  0      0ms\n```\n\n`chronyc tracking` 命令提供了关于时钟和同步的详细信息。表 40.3\
  \ 总结了此命令显示的最重要参数的含义，列表 40.4 显示了它的输出。\n\n**列表 40.4** 使用 `chronyc tracking`同步详情\n\n\
  点击此处查看代码\n\n***\n\n```bash\n[root@server1 ~]# chronyc tracking\n\nReference ID \
  \ : 192.168.4.200 (ipa.example.com)\nStratum  : 4\nRef time (UTC)  : Thu Apr  9\
  \ 16:22:37 2015\nSystem time  : 0.000002353 seconds slow of NTP time\nLast offset\
  \  : -0.000556652 seconds\nRMS offset  : 0.006729999 seconds\nFrequency  : 28.694\
  \ ppm fast\nResidual freq  : -3.423 ppm\n```\n\n\n\n\n偏移量 (Skew) : 1.524 ppm\n\n\
  根延迟 (Root delay) : 0.047688 秒\n\n根离散 (Root dispersion) : 0.029117 秒\n\n更新间隔 (Update\
  \ interval) : 64.1 秒\n\n跳跃状态 (Leap status) : Normal\n\n***\n\n![图像](img/40tab03.jpg)\n\
  \n**表 40.3** chronyc 跟踪列\n\n***\n\n### 提示\n\n除了使用 `chronyc` 命令，你还可以使用 `systemctl\
  \ status chronyd` 命令获取关于 `chronyd` 服务当前状态的大信息。列表 40.5 显示此命令的示例输出。\n\n***\n\n**列表\
  \ 40.5** 使用 systemctl 显示当前的 chronyd 状态信息\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server1\
  \ ~]# systemctl status chronyd -l\n\nchronyd.service - NTP client/server\n    Loaded:\
  \ loaded (/usr/lib/systemd/system/chronyd.service; enabled)\n    Active: active\
  \ (running) since Thu 2015-04-09 06:46:20 PDT; 4h 23min ago\n  Process: 21805 ExecStartPost=/usr/libexec/chrony-helper\
  \ add-dhclient-servers (code=exited, status=0/SUCCESS)\n  Process: 21802 ExecStart=/usr/sbin/chronyd\
  \ -u chrony $OPTIONS (code=exited, status=0/SUCCESS)\n  Main PID: 21804 (chronyd)\n\
  \    CGroup: /system.slice/chronyd.service\n               ![Image](img/common1.jpg)21804\
  \ /usr/sbin/chronyd -u chrony\nApr 09 06:46:20 server1.example.com systemd[1]: Starting\
  \ NTP client/server...\nApr 09 06:46:20 server1.example.com chronyd[21804]: chronyd\
  \ version 1.29.1 starting\nApr 09 06:46:20 server1.example.com chronyd[21804]: Linux\
  \ kernel major=3 minor=10 patch=0\nApr 09 06:46:20 server1.example.com chronyd[21804]:\
  \ hz=100 shift_hz=7 freq_scale=1.00000000 nominal_tick=10000 slew_delta_tick=833\
  \ max_tick_bias=1000 shift_pll=2\nApr 09 06:46:20 server1.example.com chronyd[21804]:\
  \ Frequency -2791.393 +/- 45.547 ppm read from /var/lib/chrony/drift\nApr 09 06:46:20\
  \ server1.example.com systemd[1]: Started NTP client/server.\nApr 09 06:46:20 server1.example.com\
  \ chronyd[21804]: Selected source 192.168.4.200\nApr 09 09:30:53 server1.example.com\
  \ chronyd[21804]: Source 192.168.4.220 offline\nApr 09 09:30:53 server1.example.com\
  \ chronyd[21804]: Source 192.168.4.200 offline\n```\n\n***\n\n你现在已经学习了 NTP 同步是如何工作的，以及如何使用\
  \ `chronyd` 服务来同步时间。在练习 40.1 中，你将通过设置服务器和对节点来应用这些技能。\n\n***\n\n### 练习 40.1 使用 chrony\
  \ 管理时间同步\n\n要执行此练习，你需要访问所有服务器的权限。\n\n1. 在所有三台主机上，确保主机名解析工作正常，可以通过域名命名系统 (DNS) 或\
  \ `/etc/hosts` 文件实现。使用 `ping` 验证连通性。\n2. 在 `labipa.example.com` 上，使用 `systemctl\
  \ status ntpd` 确保 `ntpd` 服务处于激活状态。该服务器需要从互联网获取时间，因此不需要额外配置。如果服务当前未启动，使用 `systemctl\
  \ start ntpd` 启动它。注意，`labipa` 没有使用 `chrony`，因为它目前有一个集成的 `ntpd` 进程，该进程无法在同时运行 `chrony`\
  \ 的服务器上运行。\n3. 在 `labipa.example.com` 上，确保防火墙允许 NTP 时间通过。使用 `firewall-cmd --list-services`\
  \ 并验证 `ntp` 服务是否在列表中。如果不是，输入 `firewall-cmd --add-service ntp --permanent; firewall-cmd\
  \ --reload` 来添加该服务并在防火墙配置中激活它。\n4. 在 `labipa` 上，输入 `ntpq -p` 验证你的服务器是否已与互联网上的时间服务器建立联系。\n\
  5. 在 `server1.example.com` 上，用编辑器打开 `/etc/chrony.conf` 文件，并确保它包含以下两行：\n   ```\n\
  \   server labipa.example.com iburst\n   peer server2.example.com\n   ```\n   取消这些行的注释。\n\
  6. 在 `labipa` 上，输入 `ntpq -p` 验证你的服务器确实已与互联网上的时间服务器建立了联系。\n7. 在 `server1.example.com`\
  \ 上，打开 `/etc/chrony.conf` 文件，并确保它包含以下两行：\n   ```\n   server labipa.example.com iburst\n\
  \   peer server2.example.com\n   ```\n   取消这些行的注释。\n8. 在 `labipa` 上，输入 `systemctl\
  \ restart chronyd`。\n\n\n\n\n2. 配置 `server1` 和 `server2`，使其从 `labipa.example.com`\
  \ 获取时间，且不从其他地方获取。\n\n3. 同时将 `server1` 和 `server2` 配置为彼此的对节点。\n\n4. 使用相应的命令验证配置是否生效。\n\
  \n# 第 41 章 最后的准备\n\n恭喜你！你已经读完了这本书，现在是时候为考试做最后的准备了。本章将帮助你准备参加并通过考试。在本章中，你将学习更多关于考试流程以及如何报名考试。你还将获得一些实用的技巧，帮助你在考试期间避免一些常见的陷阱。\n\
  \n## 通用建议\n\n在本节中，你将获得一些关于考试的通用建议。你将学习如何验证自己的备绪情况、如何报名考试以及在考试期间该做什么。\n\n### 验证你的就绪情况\n\
  \n只有在你认为自己准备好参加考试时，才报名。书中包含了大量帮助你验证考试备绪情况的内容。首先，你应该能够回答每章开头的“我已经知道这些？”问题。你还应该成功完成所有章节中的练习题。在每个章节的末尾，你会找到章末实验。这是测试你就绪情况的第一种真实方式。章末实验的的方式与你对真实考试题的预期相同，因此它们是发现你是否已准备好考试的好方法。\n\
  \n现在你已经学习了书中的所有内容，你已经准备好参加本章的模拟考试了。在报名之前，请确保你能够完成模拟考试中的所有测试。\n\n模拟考试不提供参考答案，这是刻意为之。在正式考试中，如果你在某个特定任务上失败了，没有人会告诉你哪里做错了。你应该能够自己发现是否成功执行了某个特定任务。如果你对特定任务有怀疑，很可能你还没有准备好应对这些任务。核心思想是，你应该确保自己对考试主题感到从容。\n\
  \n### 报名考试\n\n参加 RHCSA 和 RHCE 考试有两种方式。你可以参加教室考试（classroom exam），也可以参加自助机考考试（kiosk\
  \ exam）。教室考试通常只在周五举行，主要由红帽提供，作为课程结束后的考试。因此，与你坐在同一个教室的大多数人在考试前都参加了 4 天的课程培训，由于这个原因，教室考试的名额有限。\n\
  \n很长以来，教室考试一直是参加考试的唯一方式。但从以前开始，红帽也提供了自助机考试。自助机考试是个人考试，你在自助机电脑上完成考试任务。这是一台受监控的电脑，位于考试中心的考位间内，你在执行考试任务时，会通过多个摄像头对你进行监控。自助机考试的优点是它是个人化的，而且你可以根据自己的方便程度安排考试的时间和地点。\n\
  \n可以通过 `redhat.com` 或通过培训公司报名。从哪里购买实际上并不重要，因为你最终参加的都是同一个考试。不过，通过当地培训公司预订可能会获得折扣。通常情况下，通过红帽预订会更快，因为你可以直接访问红帽资源。\n\
  \n如果你预订了教室考试，你将收到关于考试安排的时间和日期邀请。如果你预订了自助机考试，你将获得一个优惠码，你可以用它自己来预订考场、时间和日期。\n\n###\
  \ 考试当天\n\n确保带有适当身份证明参加考试。为了被允许参加考试，你需要经过批准的政府身份证。通常情况下，护照或驾照即可；你所在的国家也可能接受其他类型的证明。不要忘记带；如果没有身份证，你将不被允许参加考试。\n\
  \n其次，确保你准时到达。建议在考试预定开始时间半小时到达。如果你迟到了，通常会被允许进入考场，但不会获得额外时间。所以，请务必准时。\n\n在证明身份后，你将进入考试环境介绍。由于每位应考者都与红帽签署了保密协议，我无法详细告诉你考试环境的具体什么样。但我可以告诉你，将有一个需要在其中进行工作的环境。取决于你所参加的考试，这包含一个或多个服务器。还有一份必须执行的任务列表。按步骤完成任务，仔细阅读所有内容，你就能通过考试。\n\
  \n### 考试期间\n\n你在考试期间必须处理的任务并不一定是以逻辑逻辑顺序呈现的。因此，在开始处理第一个任务之前，先阅读所有任务是一个好主意。在阅读所有任务时，你可以决定创建所需配置的最佳顺序。为你确定最可能的顺序，因为这可能并不显而易见。\n\
  \n另一个非常重要的建议是仔细阅读。现在已经没有多少人会阅读了，而你可能也是其中之一。IT 管理员非常擅长扫描网页以获取所需信息。这种技能在考试中对你没有帮助。阅读能力才有用。我怎么强调都不为过。根据我的估计，失败的人中\
  \ 40% 是因为他们没有阅读（他们只是扫视）。所以，让我给你一些关于如何阅读考试题的建议：\n\n![Image](img/squf.jpg) 如果英语不是你的母语，或者你精通一或多种语言，你可以切换题目呈现的语言。可能英语题目对你不清晰，翻译成其他语言的就可以。所以，如果有疑问，请阅读翻译版。\n\
  \n![Image](img/squf.jpg) 英文题目是最常使用和扫描的。考试题目是完美的，因为红帽为此付出了巨大的努力。考虑到大多数考试候选人都在处理英文题目，英文题目的质量是最好的。你可以自由使用翻译题目，但你应该将英文题目作为主要来源。\n\
  \n![Image](img/squf.jpg) 为了确保你不遗漏任何内容，请为每个题目列一份任务清单。考试期间你有草稿纸。用它列出你需要完成的任务简短列表，并逐一处理。这种方法可以帮助你专注于考试题目实际上要求什么。\n\
  \n![Image](img/squf.jpg) 在完成所有任务后，去喝杯咖啡（考试期间允许休息）。当你回来时，再次阅读所有题目，确保你没有遗漏任何内容。短暂的休息很重要；它能让你从考试中抽离出来，之后你阅读题目就像第一次看到它们一样。\n\
  \n考试的另一个重要部分是处理作业的顺序。即使不讨论具体的考试内容，某些主题也需要在处理其他主题之前修复。确保你先处理这些主题。如果你不这样做，将使修复其他作业变得困难或不可能。大致来说，你应该处理考试主题的顺序如下：\n\
  \n1. 确保你的服务器启动且你拥有 root 访问权限。\n2. 按照预期的方式配置网络。\n3. 配置任何你存储库。\n\n\n\n\n\n## 4. 安装并启用所有考试结束时需要运行的服务。\n\
  \n## 5. 完成所有与存储相关的任务。\n\n## 6. 创建所有所需的用户和组账户。\n\n## 7. 设置权限。\n\n## 8. 处理其他所有事项。\n\
  \n关于这次考试，你需要了解的第三点是，你应该至少重启几次。成功的重启可以让你验证在重启的那一刻为止，一切工作都是正常运行。在重启之前，最好的做法是从 GRUB\
  \ 启动加载程序中移除 `rhgb` 和 `quiet` 选项。移除这些选项可以让你看到实际发生了什么，并使故障排除变得简单得多。\n\n不要只在考试结束时才重启，因为如果你在那个时刻遇到问题，你可能没有足够的时间来修复。你至少应该确保在完成所有与存储相关的任务后进行一次重启。\n\
  \n## 保密协议\n\nRHCSA 和 RHCE 认证是目前 IT 领域最受青的认证。它们代表了真实的价值，因为参加 RHCSA 或 RHCE 考试的人员已经完成了一系列真实的任务，并知道如何胜任这项工作。维护这种高价值符合每个人的利益，而保密协议是其中非常重要的一部分。\n\
  \nRHCSA 和 RHCE 考试仍然代表了真实的技能，因为这些考试的内容并不是公开的。请通过不讨论你在考试中看到的题目来帮助保持这些考试的价值。知道考了哪些问题的人参加考试会比你容易得多，这意味着证书的价值会降低，这也会让你的努力变得不再值钱。因此，请帮助保护你辛勤努力的成果，不要向任何人透露考试内容。\n\
  \n## 第 42 章 理论预习考试\n\n在本章中，你将找到一份 RHCSA 理论测试和一份 RHCE 理论测试。预习考试是确定你了解和不了解内容的最佳方法。提供这些理论考试是为了让你评估自己的技能，并为准备考试确定最佳学习路线。\n\
  \n在 DVD 上，你将找到与这些理论考试配套的视频课程。这些是独特的视频，它们将引导你完成配置，并帮助你确定自己掌握了什么，哪些还需要学习。\n\n### RHCSA\
  \ 理论预习考试\n\n需要明确，RHCSA 和 RHCE 考试都是 100% 的实操考试。因此，你需要处理实际的配置任务，唯一重要的是你在考试结束时交付一个可以运行的配置。然而，通过这项实操考试意味着你需要具备一些基础知识。本章将帮助你检查是否如此。\n\
  \n在考前理论测试中，你会被问及如何处理某些核心任务。其目的是让你自己检查是否正处于正确的轨道上。你不需要提供详细的步骤说明。你只需要知道需要做什么。例如，如果问题问如何在非默认\
  \ Web 服务器的文档根上设置适当 SELinux 上文类型，如果你说“检查 semanage-fcontext 的 man 页”，你就知道需要了解什么。如果你对这些问题的任何一个都没有答案，那么你需要知道需要进行额外的学习。\n\
  \n在这些考前理论测试中，涵盖了一些关键元素。这项测试*不是* 100% 全面的；它只是关注一些最核心的技能。\n\n### RHCSA 考前理论测试\n\n\
