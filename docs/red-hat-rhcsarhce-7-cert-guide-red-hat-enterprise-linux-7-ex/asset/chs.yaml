  \n***\n\n### 练习 13.3 探索 `journalctl`\n\n在本次练习中，你将学习如何使用不同的 `journalctl` 选项。\n\n\
  **1.** 输入 `journalctl`。你将看到服务器上次启动以来的日志内容，从日志开始开始显示。内容显示在 `less` 中，因此你可以使用常用的 `less`\
  \ 命令来浏览文件。\n\n**2.** 输入 `q` 退出分页器。现在输入 `journalctl --no-pager`。这将在不使用分页器的情况下显示日志内容。\n\
  \n**3.** 输入 `journalctl -f`。这会打开 `journalctl` 的实时查看模式，允许你实时看到新消息滚动滚动。使用 `Ctrl+C`\
  \ 中断。\n\n**4.** 输入 `journalctl` 并按两次 `Tab` 键。这将显示可以用于过滤的特定选项。例如，输入 `journalctl _UID=0`。\n\
  \n**5.** 输入 `journalctl -n 20`。`-n 20` 选项显示日志的最后 20 行（类似于 `tail -n 20`）。\n\n**6.**\
  \ 现在输入 `journalctl -p err`。此命令仅显示错误。\n\n**7.** 如果你想查看在特定时间段内写入的日志，可以使用 `--since`\
  \ 和 `--until` 命令。这两个选项都接受格式为 YYYY-MM-DD hh:mm:ss 的时间参数。此外，还可以使用 `yesterday`、`today`\
  \ 和 `tomorrow` 作为参数。因此，输入 `journalctl --since yesterday` 显示自昨天以来写入的所有消息。\n\n**8.**\
  \ `journalctl` 允许你组合不同的选项。例如，如果你想显示自昨天以来优先级为 `err` 的所有消息，请使用 `journalctl --since\
  \ yesterday -p err`。\n\n**9.** 如果你需要尽可能多的详细信息，请使用 `journalctl -o verbose`。这显示了写入日志时使用的不同选项（参见列表\
  \ 13.3）。所有这些选项都可以用于告诉 `journalctl` 命令你正在寻找的特定信息。例如，输入 `journalctl _SYSTEMD_UNIT=sshd.service`\
  \ 显示关于 sshd systemd 单元的更多信息。\n\n***\n\n在前面的练习中，你输入了 `journalctl -o verbose` 来显示详细输出。列表\
