  **6.** 哪个命令可以让你获取当前定义的所有 Postfix 参数及其对应值的概览？\n\n**7.** 你刚刚尝试发送一条消息但没有成功。你已经识别了消息无法发送的原因，但注意到消息仍然没有被送达。你如何调度安排立即送达？\n\
  \n**8.** 哪个文件包含关于消息进程的信息？\n\n**9.** 必须更改哪些 SELinux 上文/布尔值以保证 Postfix 操作的成功？\n\n\
  **10.** 必须向防火墙添加哪个服务以保证邮件的送达？\n\n### 章节末实验\n\n在本章中，你学习了如何设置 Postfix 将消息转发到其他服务器。你还学习了如何分析邮件流。为了准备考试，你现在可以进行实验\
  \ 38.1，你应该能够没有太多问题地处理它。\n\n#### 实验 38.1\n\n1. 设置邮件送达配置。在此项配置中，server1 被配置为接收传入消息的邮件服务器。server1\
  \ 也是 server2 使用的中继主机。server2 被设置为空客户端。注意在`练习 38.1`](ch38.html_ch38er01)中你做了相反的操作，因此你需要更改在`练习\
  \ 38.1`](ch38.html_ch38er01)中配置的参数。\n\n## 第 39 章 配置 SSH\n\n本章涵盖了以下主题：\n\n![Image](img/squf.jpg)\
  \ 强化 SSH 服务器\n\n![Image](img/squf.jpg) 其他常用的 sshd 选项\n\n![Image](img/squf.jpg) 使用带密码的密钥认证\n\
  \n![Image](img/squf.jpg) 配置 SSH 隧道\n\n本章涵盖了以下 RHCE 目标：\n\n![Image](img/squf.jpg)\
  \ 配置密钥认证\n\n![Image](img/squf.jpg) 配置文档描述的附加选项\n\nSecure Shell (SSH) 是系统管理员使用的最重要的工具之一。在第\
  \ 5 章“连接到 RHEL 服务器`”中，你学习了如何使用 SSH 通过密码或密钥认证连接到服务器。在本章中，你将学习一些高级的配置设置。\n\n### “我学会了吗？”测验\n\
  \n“我学会了吗？”测验可以让你评估是否应该彻底阅读这整个章节，还是跳转到“考试准备任务`](ch39.html_ch39levsec3)”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
  \ 39.1 列出了本章的主要标题及其对应的“我学会了吗？”测验题。你可以在附录 A“‘我学会了吗？测验和‘复习题’的答案`”中找到答案。\n\n![Image](img/39tab01.jpg)\n\
  \n**表 39.1** “我学会了吗？”章节到问题的映射\n\n**1.** 下列哪项*不是*防止 SSH 服务器暴力攻击的常用方法？\n\na. 禁用 X11forwarding\n\
  b. 让 SSH 在非默认端口上监听\nc. 禁用密码登录\nd. 仅允许特定用户登录\n\n**2.** 下列哪项成功将 SSH 服务器访问限制为 bob 和\
  \ lisa？\n\na. LimitUsers bob,lisa\nb. AllowedUsers bob lisa\nc. AllowUsers bob lisa\n\
  d. AllowedUsers bob,lisa\n\n**3.** 必须使用哪个命令为非默认端口 2022 提供正确的 SELinux 标签？\n\na. `semanage\
  \ ports -m -t ssh_port_t -p 2022`\nb. `semanage port -m -t ssh_port_t -p tcp 2022`\n\
  c. `semanage ports -a -t sshd_port_t -p tcp 2022`\nd. `semanage port -a -t ssh_port_t\
  \ -p tcp 2022`\n\n**4.** 关于 `MaxAuthTries` 选项，下列描述正确的是？\n\na. 达到指定的次数后，账户将被锁定。此选项指定了最大登录次数。达到指定数字的一半后，记录额外的失败。达到指定的次数后，登录登录尝试的的\
  \ IP 地址将被阻止。指定的数字表示每分钟最大登录次数。\n\n**5.** 你分析哪个日志文件来获取失败 SSH 登录尝试的信息？\n\na. /var/log/auth\n\
  b. /var/log/authentication\nc. /var/log/messages\nd. /var/log/secure\n\n\n\n\n\n\
  ## [6]. 在你的测试环境中，SSH 登录需要很长时间。以下哪个选项最可能是导致连接时间问题的所在？\n\n**a.** `UseLogin`\n\n**b.**\
  \ `GSSAPIAuthentication`\n\n**c.** `UseDNS`\n\n**d.** `TCPKeepAlive`\n\n## [7].\
  \ 下列选项中哪个*没有*用于保持 SSH 连接活跃？\n\n**a.** `TCPKeepAlive`\n\n**b.** `ClientAliveInterval`\n\
  \n**c.** `ClientAliveCountMax`\n\n**d.** `UseDNS`\n\n## [8]. SSH 客户端计算机上的哪个文件需要添加来为单个客户端设置\
  \ ServerKeepAliveInterval？\n\n**a.** `~/.ssh/ssh_config`\n\n**b.** `~/.ssh/config`\n\
  \n**c.** `/etc/ssh/config`\n\n**d.** `/etc/ssh/ssh_config`\n\n## [9]. 假设已经创建一个受密码保护的公钥/私钥对，你如何配置会话以便只需要输入一次密码短？\n\
  \n**a.** 将密码短复制到 `~/.ssh/passphrase` 文件中。\n\n**b.** 运行 `ssh-add /bin/bash`，然后运行\
  \ `ssh-agent`。\n\n**c.** 运行 `ssh-agent /bin/bash`，然后运行 `ssh-add`。\n\n**d.** 这是可能的；你必须在每次连接时都输入密码短。\n\
  \n## [10]. 下列哪个命令使用本地主机的源端口 5555 连接到名为 server2.example.com 的 80 端口远程服务器？\n\n**a.**\
  \ `ssh -fNL 5555:localhost:80 root@server2.example.com`\n\n**b.** `ssh -fNL 5555:server2.example.com:80\
  \ root@server2.example.com`\n\n**c.** `ssh -fNL 5555:server2.example.com:80 root@localhost`\n\
  \n**d.** `ssh -fNR 5555:localhost:80 root@server2.example.com`\n\n### 基础知识\n\n###\
  \ 加固 SSH 服务器\n\nSSH 是一个重要且方便的解决方案，帮助你建立与服务器的远程连接。它也是一个危险的解决方案。如果你的服务器可以直接从互联网可见，你可以确信，迟早会有入侵者尝试连接你的服务器并意图进行破坏。\n\
  \n针对 SSH 服务器的字典攻击非常常见。攻击者利用了 SSH 服务器通常在端口 22 上提供服务，以及每个 Linux 服务器都有 root 账户的特性。基于这些信息，攻击者只需通过猜密码就能尝试以\
  \ root 身份登录。如果密码复杂性有限，且没有采取额外的安全措施，入侵者迟早就能连接。幸运的是，你可以采取一些措施来保护 SSH 服务器免受此类攻击的影响：\n\
  \n![Image](img/squf.jpg) 禁用 root 登录\n\n![Image](img/squf.jpg) 禁用密码登录\n\n![Image](img/squf.jpg)为\
  \ SSH 配置监听非默认端口\n\n![Image](img/squf.jpg) 仅允许特定用户登录 SSH\n\n在接下来的子章节中，你将学习更改这些选项所涉及的内容。\n\
  \n#### 限制 root 访问\n\nSSH 服务器默认启用 root 登录这一事实是最大的安全问题。禁用 root 登录很容易；你只需要修改 `/etc/ssh/sshd_config`\
  \ 中的 `PermitRootLogin` 参数并重新加载或重启服务。重启后，验证你是否真的无法再次以 root 身份登录。\n\n*** 提示\n\n某些服务会自动获取配置文件的更改。大多数服务在执行\
  \ `systemctl reload servicename` 命令后获取更改，而其他某些服务只有在执行 `systemctl restart servicename`\
  \ 命令后才会获取。为了避免在考试中浪费时间，在任何情况下都应该使用 `systemctl restart servicename`。至少你就能确保服务会加载新配置。\n\
  \n***\n\n禁用 root 登录后，你必须使用 `ssh user@servername` 或 `ssh -l user servername` 指定你想要用于登录的用户名。如果你不指定用户名，它将使用尝试打开\
  \ SSH 会话的客户端上当前用户的名称。\n\n#### 配置备端口\n\nLinux 服务器上的许多安全问题都始于攻击者发起的端口扫描。扫描所有 65,535\
  \ 个可能监听的端口需要花费大量时间，但大多数端口扫描只关注已知端口，而 SSH 端口 22 就在这些端口之中。不要低估端口扫描的风险。在几次情况下，我发现监听\
  \ 22 端口的 SSH 端口在安装后一小时内就被发现了。\n\n为了防止端口扫描，你可以配置你的 SSH 服务器监听另一个端口。默认情况下，`sshd_config`\
  \ 包含 `Port 22` 行，告诉 SSH 监听特权端口 22。要让 SSH 监听另一个端口，你必须将端口 22 更改为其他。可以使用不同的端口。你可以选择使用完全随机的端口（如\
  \ 2022），但配置 SSH 监听端口 443 也可能很有用。\n\n端口 443 默认分配给使用传输层安全 (TLS) 提供加密的 Web 服务器。如果想要访问\
  \ SSH 服务器的用户通常位于代理之后，那么配置 443 可能很有意义。\n\n*** 提示\n\n为了避免在做出更改后被锁在服务器之外，开启两个话是一个好主意。使用一个会话应用更改，使用另一个会话保持连接。活动会话重启服务器后不会断开。\n\
  \n***\n\n#### 修改 SELinux 以允许端口\n\n更改 SSH 端口后，你还需要配置 SELinux 以允许此更改。网络端口被标记了 SELinux\
  \ 安全标签，以防止服务访问它们不应该访问的端口。要允许服务连接到非默认端口，你需要 `semanage port` 来更改标签。在此之前，最好检查该端口是否已设置标签。你可以通过使用\
  \ `semanage port -l` 命令执行此操作。\n\n如果尚未设置安全标签，使用 `-a` 为端口添加标签。如果已经设置了安全标签，使用 `-m`\
  \ 修改当前标签。例如，使用命令 `semanage port -a -t ssh_port_t -p tcp 2022` 为 sshd 标记端口 2022。\n\
  \n#### 限制用户访问\n\n只需通过浏览 `sshd_config` 文件，就可以找到许多 sshd 选项。使用最有趣的选项之一是 `AllowUsers`。该选项接受一个由空格分隔的列表，列出所有允许通过\
  \ SSH 登录的用户。注意这是一个强大的选项，将登录限制为这些用户。如果 root 用户仍然需要能够直接登录，你必须将 root 也包含在允许的用户列表中。\n\
  \n使用此参数时，考虑你想要允许或拒绝访问的用户名是有意义的。在脚本化的暴力破解攻击中，入侵者通常也会尝试诸如 admin、Administrator 和 jsmith\
  \ 等常用名称。通过选择不常用的用户名可以轻松增加一层安全防护。关于 `AllowUsers` 参数注意以下几点：\n\n![Image](img/squf.jpg)\
  \ `AllowUsers` 选项在默认的 `/etc/ssh/sshd_config` 文件中没有出现。\n\n![Image](img/squf.jpg)\
  \ `AllowUsers` 选项是 `PermitRootLogin` 更好的选项，因为它比禁止 root 登录更具限制性。\n\n![Image](img/squf.jpg)\
  \ 如果 `AllowUsers` 选项没有指定 root，你可以在作为普通用户建立连接后通过 `su -` 成为 root。\n\n\n\n\n\n一个看起来很有用但实际上具有误导性的参数是\
  \ `MaxAuthTries`。你可能认为该选项在失败登录尝试达到上限后会锁定 SSH 登录提示的访问。这种功能在连接到本地服务器（如果需要，可以轻松更改其配置）时非常有用，但在\
  \ SSH 服务器上，它是一个相当危险的选项，极易对服务器实施拒绝服务攻击。入侵者只需要运行一个脚本尝试以特定用户的身份登录，就可以阻止该用户在一段时间内无法访问服务器。这就是为什么\
  \ `MaxAuthTries` 的作用并不如你所想的那样。它只是在在此处指定的成功登录次数的一半之后开始记录失败的登录尝试。\n\n尽管如此，`MaxAuthTries`\
  \ 选项仍然很有用。对于分析与你的 SSH 服务器相关的安全事件，了解用户不小心输错一两次密码并不十分有趣。只有在出现多次尝试后，它才变得有趣。尝试次数越高，入侵者试图进入的可能性就越大。SSH\
  \ 将有关失败登录尝试的日志信息写入 `AUTHPRIV` Syslog 设施。默认情况下，该设施被配置为将登录失败信息写入 `/var/log/secure`。\n\
  \n在练习 39.1 中，你将应用目前为止讨论过的选项。\n\n***\n\n## 练习 39.1 配置 SSH 安全选项\n\n在此练习中，你将学习如何应用常用的\
  \ SSH 安全选项。应在 `server1` 上配置 `sshd` 进程。使用 `server2` 测试对 `server1` 的访问。\n\n1. 在 `server1`\
  \ 上打开一个 root shell，并从那里用编辑器打开 `sshd` 配置文件 `/etc/ssh/sshd_config`。\n2. 找到 `Port`\
  \ 行，在该行下方添加 `Port 2022` 行。这告诉 `sshd` 进程它应该绑定到两个不同的端口，从而确保即使你犯了错误仍然能够打开 SSH 会话。\n\
  3. 同样在 SSH 文件中添加 `AllowUsers user` 行。\n4. 保存配置文件的更改并使用 `systemctl restart sshd`\
  \ 重启 `sshd`。\n5. 输入 `systemctl status -l sshd`。你会看到由于 SSH 尝试连接到端口 `2022` 而导致的权限被拒绝错误。\n\
  6. 输入 `semanage port -a -t ssh_port_t -p tcp 2022` 为端口 `2022` 应用正确的 SELinux 标签。\n\
  7. 同时使用 `firewall-cmd --add-port=2022/tcp` 打开端口 `2022` 的防火墙，然后执行 `firewall-cmd --add-port=2022/tcp\
  \ --permanent`。\n8. 再次输入 `systemctl status -l sshd`。你会发现 `sshd` 进程现在监听两个端口。\n9.\
  \ 尝试使用 `ssh user@server1` 从你的其他服务器登录到你的 SSH 服务器。在用户 shell 打开后，输入 `su -` 以获取 root\
  \ 权限。\n\n***\n\n## 使用其他实用的 sshd 选项\n\n除了安全相关的选项外，还有实用的杂项选项可以用来优化 SSH 性能。在接下来的两个子节中，你将阅读这些选项中一些最重要的部分。\n\
  \n### 会话选项\n\n首先，有一个 `GSSAPIAuthentication` 选项，它在 RHEL 7 上默认设置为“yes”（这与 man 手页上的描述相矛盾）。该选项在使用了\
  \ Kerberos 认证的环境中非常有用。如果你在环境中没有 Kerberos，你大可将其关闭，因为开启此功能会减慢身份验证过程。\n\n下一个有趣的选项是\
  \ `UseDNS`。该选项默认开启，用于让 SSH 服务器查找远程主机名，并通过 DNS 检查远程主机解析出的主机名是否映射回相同的 IP 地址。虽然此选项具有某些安全优势，但也涉及重大的性能损失。如果客户端连接缓慢，请确保将其设置为\
  \ `no`，以完全关闭客户端主机名验证。\n\n第三个会话相关的选项是 `MaxSessions`。它指定了从一个 IP 地址同时打开会话的最大数量。如果你预计多个用户将使用同一个\
  \ IP 地址登录你的 SSH 服务器，你可能需要将其增加到默认值 10 以上。\n\n### 连接存活选项\n\nTCP 连接 通常是一种相对稀缺的资源，这就是为什么一段时间未使用的连接通常会超时。你可以使用几个选项让不活跃的连接保持更长时间。\n\
  \n`TCPKeepAlive` 选项用于监控客户端是否仍然可用。使用此选项（默认开启）可确保消失机器的连接会被释放。然而，如果单独使用它，可能会导致未使用的连接也被释放，这就是为什么使用\
  \ `ClientAliveInterval` 选项是有意义的。该选项设置了一个以秒为单位的间隔，如果没有检测到活动，服务器将向客户端发送一个数据包。`ClientAliveCountMax`\
  \ 参数指定了应该发送多少此类包。例如，如果 `ClientAliveInterval` 设置为 30，而 `ClientAliveCountMax` 设置为\
  \ 10，不活跃的连接将保持大约 5 分钟。将此项设置为你希望保持不活跃连接开启的时间长度是一个好主意。\n\n`ClientAliveInterval` 和\
  \ `ClientAliveCountMax` 选项仅可以在服务器端指定。客户端有这些对应的选项：`ServerAliveInterval` 和 `ServerAliveCountMax`。它们设置在\
  \ `/etc/ssh/ssh_config` 中（适用于所有用户），或在 `~/.ssh/config` 中（适用于单个用户）。\n\n表 39.2 提供了常用选项的概述。\n\
  \n**表 39.2** 用的 sshd 配置选项\n\n##### 使用密码语配置密钥认证\n\n默认情况下，RHEL 7 允许密码认证。如果像第 5 章所示使用了公私密钥对，将优先使用该密钥对。如果你只想允许密钥对认证并完全禁用密码认证，请将\
  \ `PasswordAuthentication` 选项设置为 `no`。\n\n当你使用公私密钥时，可以使用密码语。使用密码语会让密钥对更强大。入侵者不仅需要获取私钥，即使获取了也必须知道密码语才能使用密钥。这就是为什么在通过公私密钥建立客户端/服务器连接时，建议使用密码语。如果不进行进一步配置，使用密码语意味着用户每次创建连接之前都必须输入密码语，这很不方便。\n\
  \n为了让使用密码语的操作简单一些，可以在会话中缓存密码语。为此，你需要 `ssh-agent` 和 `ssh-add` 命令。假设公私密钥对已经创建，这是一个简单的两步过程：\n\
  \n1. 输入 `ssh-agent /bin/bash` 为当前的 (bash) shell 启动代理程序。\n2. 输入 `ssh-add` 为当前用户的私钥添加密码语。现在密钥已缓存。\n\
  3. 连接到远程服务器。注意不再需要输入密码语。\n\n请注意，此过程需要在每个新创建的会话中重复。\n\n\n\n`sshd` 服务可以用于隧道连接。事实上，隧道技术类似于端口转发，即创建一个\
  \ UDP 或 TCP 端口，将流量转发到另一台机器。使用 SSH 创建隧道的优势在于，通过隧道发送的流量经过了加密的，因此对潜在的入侵者来说是不可见的。在创建\
  \ SSH 隧道时，你可以采取两种方法：\n\n![Image](img/squf.jpg) 使用本地端口转发创建一个连接到远程服务的本地端口。\n\n![Image](img/squf.jpg)\
  \ 创建远程端口转发，将 Internet 上的远程服务器上的某个端口转发到本地端口。\n\n让我们来看几个示例。在命令 `ssh -fNL 4444:server.rhatcertification.com:80\
  \ root@server2.example.com` 中，定义了一个本地端口 `4444`。该端口被转发到 `server.rhatcertification.com`\
  \ 上的 `80` 端口，而该隧道是通过在 `server2.example.com` 上以用户 `root` 身份建立的 SSH 会话实现的（参见图 39.1).注意选项\
  \ `-fN` 的使用。选项 `-f` 告诉 `ssh` 命令在后台运行，而 `-N` 告诉 SSH 它不需要启动命令，这通常是端口转发所需的。\n\n![Image](img/39fig01.jpg)\n\
  \n**图 39.1** 本地端口转发概述。\n\n如果本地主机没有可以开放且未过滤 Internet 的 SSH 服务器，那么上一个示例运行良好。如果你在本地确实有一个不受任何防火墙规则限制的\
  \ SSH 服务器，情况就会变得简单一些，你只需要输入 `ssh -fNL 5555:localhost:80 root@server2.example.com`。使用此命令，你将\
  \ `server2.example.com` 上的 `80` 端口转发到本地端口 `5555`。这看起来可能有点反直觉，但它是有道理的。只需这样理解该命令：以\
  \ `root` 身份登录 `server2.example.com`。一旦进入该主机，就将 localhost（此时为 `server2.example.com`）上的\
  \ `80` 端口转发到连接源主机上的 `5555` 端口。\n\n在远程端口转发中，你使本地计算机上的一个端口对 Internet 用户可用。为了使能够工作，你必须在本地机器的\
  \ `sshd_config` 文件中将 `GatewayPorts` 设置为 `yes`。之后，你可以使用类似 `ssh -fNR 80:localhost:8088\
  \ root@lab.sandervanvugt.nl` 的命令。该命令以 `root` 身份登录 `lab.sandervanvugt.nl`，并作为该用户将远程服务器上的\
  \ `8088` 端口转发到本地端口 `80`。因此，当用户访问远程主机上的 `8088` 端口时，该请求将被转发到 localhost 上的 `80` 端口。表\
  \ 39.3 总结了本节讨论的三个端口转发示例。\n\n![Image](img/key_topic.jpg)![Image](img/39tab03.jpg)\n\
  \n**表 39.3** 端口转发示例\n\n#### 总结\n\n在本章中，你学习了如何使用高级选项配置 SSH 服务器。你还学习了如何为 `sshd` 设置安全选项，以及如何设置特定的客户端选项以帮助保持连接长时间活跃。你还学习了如何设置本地和远程端口转发。\n\
  \n### 考试复习任务\n\n#### 复习所有关键主题\n\n复习章节最重要的主题，这些主题在页外边上用“关键主题（Key Topic）”图标标记。表 39.4\
