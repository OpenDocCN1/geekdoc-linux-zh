  \n#### 定义关键术语\n\n定义本章的以下关键术语并在词表中检查你的答案：\n\n- `BIOS`\n- `MBR`\n- `GRUB 2`\n- `partition`（分区）\n\
  - `primary partition`（主分区）\n- `extended partition`（扩展分区）\n- `logical partition`（逻辑分区）\n\
  - `GPT`\n- `mount`（挂载）\n- `umount`（卸载）\n- `UUID`\n- `label`（标签）\n- `Ext2`\n- `Ext3`\n\
  - `Ext4`\n- `XFS`\n- `BtrFS`\n- `VFAT`\n- `fstab`\n\n#### 复习题\n\n1. 你使用什么工具创建 GUID\
  \ 分区？\n2. 你使用什么工具创建 MBR 分区？\n3. RHEL 7 的默认文件系统是什么？\n4. 用于自动挂载的文件名是什么？\n5. 如果你想让文件系统不自动挂载，使用哪种挂载选项？\n\
  6. 哪个命令允许你对类型为 82 的分区使用适当的文件系统进行格式化？\n7. 你刚刚添加了几个用于自动挂载的分区。如何在不实际重启的情况下安全地测试这是否行可行？\n\
  8. 如果在不带任何文件系统指定的情况下使用 `mkfs` 命令，会创建什么文件系统？\n9. 如何格式化 Ext4 分区？\n10. 你如何找到计算机上所有设备的\
  \ UUID？\n\n### 章末实验\n\n在本章完成的练习中，你已经创建了分区。在开始这些章末实验之前，从干净的安装开始是一个好主意。在练习 14.1 中，你创建了一些备份文件。在开始这些章末实验之前，使用以下三个步骤恢复原始设置：\n\
  \n#### 实验 14.1\n\n1. 输入 `dd if=/dev/diskfile of=/dev/vda`。（如果你的磁盘设备是 /dev/sda 而不是\
  \ /dev/vda，请使用 `of=/dev/sda`。）\n2. 使用 `cp /root/fstab /etc` 复制 /etc/fstab 文件的备份。\n\
  \n这恢复了原始配置。你现在准备好开始章末实验了。成功完成章末实验后，重复此过程。这允许你在按照下一章描述创建 LVM 逻辑卷时在干净的磁盘上工作。\n\n####\
  \ 实验 14.2\n\n\n\n\n\n1. 为您的服务器添加两个分区。如果可能，请将它们放在服务器上正在使用的主磁盘上。如果不可，请使用第二个磁盘（虚拟或\
  \ USB 磁盘）来添加这些分区。创建两个分区，大小均设置为 100 MiB。其中一个分区必须配置为交换空间（swap space），另一个分区必须格式化为 `Ext4`\
  \ 文件系统。\n\n2. 配置您的服务器以自动挂载这些分区。将 `Ext4` 分区挂载到 `/mounts/data`，并将交换空间挂载为交换空间。\n\n\
  3. 重启您的服务器并验证所有内容是否已正确挂载。如果出现问题，请阅读第 19 章获取故障排除的提示。\n\n# 第 15 章 管理 LVM 逻辑卷\n\n**本章涵盖了以下主题：**\n\
  \n![Image](img/squf.jpg) 理解 LVM\n\n![Image](img/squf.jpg) 创建 LVM 逻辑卷\n\n![Image](img/squf.jpg)\
  \ 调整 LVM 逻辑卷大小\n\n**本章涵盖了以下 RHCSA 考试目标：**\n\n![Image](img/squf.jpg) 创建和删除物理卷，将物理卷分配给卷组，以及创建和删除逻辑卷\n\
  \n![Image](img/squf.jpg) 扩展现有的逻辑卷\n\n在上节中，你学习了如何管理硬盘上的分区。在磁盘上创建多个分区是有用的，因为这允许你区分不同的数据类型，但它无法提供逻辑卷管理器（LVM）提供的灵活性。在本章中，你将学习如何配置和管理\
  \ LVM 逻辑卷。\n\n### “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测验可以让你评估是否应该彻底阅读整个章节，还是直接跳到“#考试准备任务”部分。如果您对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
  \ 15.1 列出了本章的主要标题及其对应的“我已经掌握了吗？”测验问题。您可以在附录 A 中的“‘我已经掌握了吗？测验和‘复习题’的答案”找到答案。\n\n\
  ![Image](img/15tab01.jpg)\n\n**表 15.1** “我已经掌握了吗？”章节与问题映射\n\n**1。** 下列哪项不是 LVM 设置中的标准组件？\n\
  \n**a.** 逻辑卷\n**b.** 文件系统\n**c.** 卷组\n**d.** 物理卷\n\n**2。** 下列哪项不是 LVM 的特性？\n\n**a.**\
  \ 卷的大小调整\n**b.** 故障磁盘的热插拔\n**c.** 写时复制 (Copy on write)\n**d.** 快照 \n\n**3。** 在 GPT\
  \ 分区上，你需要哪种分区类型来标记为 LVM 分区类型？\n\n**a.** 83\n**b.** 8e\n**c.** 8300\n**d.** 8e00\n\
  \n**4。** 下列哪个命令正确显示了如何创建一个使用卷组中 50% 可用磁盘空间的逻辑卷？\n\n**a.** `vgadd -n lvdata -l +50%FREE\
  \ vgdata`\n**b.** `lvcreate lvdata -l 50%FREE vgdata`\n**c.** `lvcreate -n lvdata\
  \ -l 50%FREE vgdata`\n**d.** `lvadd -n lvdata -l 50% FREE /dev/vgdata`\n\n**5。**\
  \ 哪个命令显示了可用物理卷的概览？\n\n**a.** `pvshow`\n**b.** `pvdisplay`\n**c.** `pvs`\n**d.**\
  \ `pvlist`\n\n**6。** 关于物理卷的下列哪些陈述是正确的？\n\n**a.** 在将分区分配为物理卷之前，应将分区标记为 LVM 分区。\n\
  **b.** 原始磁盘可以标记为物理卷。\n**c.** 物理卷只能在 Ext4 或 XFS 文件系统上创建。\n**d.** 物理卷*不能*在 LUN 上创建。\n\
  \n**7。** 下列哪项显示了创建卷组的正确语法？\n\n**a.** `vgcreate vgdata`\n**b.** `volumecreate vgdata`\n\
  **c.** `groupcreate vgdata`\n**d.** `vg-add vgdata`\n\n**8。** 下列哪个命令显示了可用物理卷的概览？\n\
  \n**a.** `pvcreate`\n**b.** `vgcreate`\n**c.** `pvdisplay`\n**d.** `lvcreate`\n\n\
  **9。** 下列哪项是 LVM 设置中用于标记卷组的可用磁盘空间的逻辑卷？\n\n**a.** `lvcreate`\n**b.** `vgcreate`\n\
  **c.** `pvcreate`\n**d.** `vgadd`\n\n**10。** 下列哪个命令正确显示了如何创建一个使用卷组中 50% 可用磁盘空间的逻辑卷？\n\
  \n**a.** `vgadd -n lvdata -l +50%FREE vgdata`\n**b.** `lvcreate lvdata -l 50%FREE\
  \ vgdata`\n**c.** `lvcreate -n lvdata -l 50%FREE vgdata`\n**d.** `lvadd -n lvdata\
  \ -l 50% FREE /dev/vgdata`\n\n*(注：由于原文中 8-10 题的选项内容似乎存在重复或错误，译文严格按照原文逻辑进行对应翻译)*\n\
  \n\n\n\n`LVM` 如此优秀有几个原因。最重要的一是 `LVM` 为存储管理提供了一种灵活的解决方案。卷不再受到物理硬盘的限制。如果需要额外的存储空间，可以轻松扩展卷组，从而将磁盘空间添加到逻辑卷中。也可以减小逻辑卷的大小，但前提是创建在该卷上的文件系统必须支持调整大小。`Ext4`\
  \ 文件系统支持此项操作，但作为 RHEL 7 默认文件系统的 `XFS` 文件系统则不支持。\n\n管理员喜欢使用 `LVM` 的另一个重要原因是它对快照 的支持。快照保留了逻辑卷的当前状态，可以用于恢复到之前的状态，或者在逻辑卷处于打开状态时对逻辑卷上的文件系统进行备份。\n\
  \nLVM 快照的创建是通过将描述文件当前状态的逻辑卷管理数据（元数据）复制到快照卷来实现的。只要不发生变化，通过 `LVM` 快照元数据就可以访问原始卷中的原始数据块。当块被修改时，包含文件之前状态的块会被复制到快照卷中，因此快照卷会随之增长。使用这种方法可以确保通过访问\
  \ `LVM` 快照卷，能够访问快照创建时文件的精确状态。在第 35 章“配置 MariaDB 数据库](#ch35.html_ch35)”中，你将学习如何创建快照。\n\
  \n使用 `LVM` 逻辑卷的第三个重要优势是可以轻松更换故障硬件。如果硬盘故障，可以在卷组内移动数据（通过 `pvmove` 命令），然后从卷组中移除故障磁盘并动态添加新硬盘，而无需使逻辑卷本身停机。\n\
  \n## 创建 LVM 逻辑卷\n\n创建 `LVM` 逻辑卷涉及创建 LVM 架构中的三层。你首先需要处理物理卷 (`PV`)，然后需要创建卷组 (`VG`)并将物理卷分配给它。最后一步是创建逻辑卷\
  \ (`LV`) 本体。在本节中，你将学习创建这三层涉及的内容。\n\n创建 `LVM` 有多种工具可用。本章重点介绍使用命令行工具。这些工具相对易于使用，并且在所有环境中可用（无论你是否运行图形化界面）。\n\
  \n***\n\n### 提示\n\n你完全不需要背诵本章讨论的命令。你真正需要记住的是 pv、vg、lv。打开命令行，输入 `pv` 并按两次 `Tab` 键。这将显示所有以\
  \ `pv` 开头的命令，这些命令都用于管理物理卷。在找到所需的命令后，使用 `--help` 选项运行该命令。这会显示一个用法摘要，列出了创建你所需的元素需要执行的所有操作。列表\
  \ 15.1 显示了 `pvcreate --help` 命令的示例（将在下一个小节中解释）。\n\n***\n\n**列表 15.1** 请求 `pvcreate`\
  \ 命令的帮助信息\n\n点击此处查看代码图像\n\n***\n\n```\n[root@server1 ~]# pvcreate --help\n\n  pvcreate:\
  \ Initialize physical volume(s) for use by LVM\n\npvcreate\n\n          [--norestorefile]\n\
  \          [--restorefile file]\n          [-d|--debug]\n          [-f[f]|--force\
  \ [--force]]\n          [-h|-?|--help]\n```\n（注：命令块后提供的文本在源提示中包含大量重复/乱码文本。根据“保留核心内容”的指令，我已处理了上述主要的命令输出。）\n\
  \n\n\n\n\n## 6. 既然分区已经创建，你就需要将其标记为 LVM 物理卷。要执行此操作，请输入 `pvcreate /dev/vdb1`。你现在应该看到此提示：Physical\
  \ volume `/dev/vbd1` successfully created。\n\n## 7. 现在输入 `pvs` 来验证物理卷是否已成功创建。输出可能类似于列表\
  \ 15.3](#ch15.html_ch15lis03)。注意，在列表中另一个物理卷已经并存在了；这是因为 RHEL 默认使用 LVM 来组织存储。\n\n\
  ***\n\n**列表 15.3** 验证物理卷\n\n点击此处查看代码图片\n\n***\n\n```\n[root@localhost ~]# pvs\n\n\
  \  PV          VG      Fmt  Attr PSize   PFree\n  /dev/vda2  centos lvm2 a--   \
  \  3.51g      0\n  /dev/vdb1           lvm2 a--  100.00m 100.00m\n```\n\n***\n\n\
  除了显示物理卷及其属性摘要的 `pvs` 命令外，你还可以使用 `pvdisplay` 命令来显示更多细节。列表 15.4](#ch15.html_ch15lis04)\
  \ 显示此命令输出的示例。\n\n**列表 15.4** `pvdisplay` 命令输出示例\n\n点击此处查看代码图片\n\n***\n\n```\n[root@server1\
  \ ~]# pvdisplay\n\n  --- Physical volume ---\n  PV Name                /dev/vda2\n\
  \  VG Name                centos\n  PV Size                3.51 GiB / not usable\
  \ 3.00 MiB\n  Allocatable            yes (but full)\n  PE Size                4.00\
  \ MiB\n  Total PE               898\n  Free PE                0\n  Allocated PE\
  \           898\n  PV UUID                CILii7-DzOd-w4L0-yOxi-9NXg-D3nP-ZugJIj\n\
  ```\n\n***\n\n如果你想对当前的存储配置有一个非常综合的概览，你可能也会喜欢 `lsblk` 命令。如列表 15.5](#ch15.html_ch15lis05)\
  \ 所示，该命令提供了分层概述，显示哪些磁盘和分区用于哪些 LVM 卷组和逻辑卷。\n\n**列表 15.5** 使用 `lsblk` 获取服务器存储配置的综合概览\n\
  \n点击此处查看代码图片\n\n***\n\n```\n[root@localhost ~]# lsblk\n\nNAME             MAJ:MIN\
  \ RM SIZE RO TYPE MOUNTPOINT\nfd0              2:0    1    4K  0 disk\nsda     \
  \         8:0    0    8G  0 disk\n![Image](img/common.jpg)sda1           8:1   \
  \ 0  200M  0 part /boot\n![Image](img/common.jpg)sda2           8:2    0  6.9G \
  \ 0 part\n![Image](img/common2.jpg)  ![Image](img/common.jpg)centos-swap   253:0\
  \    0  256M  0 lvm  [SWAP]\n![Image](img/common2.jpg)  ![Image](img/common1.jpg)centos-root\
  \   253:1    0  5.9G  0 lvm  /\n![Image](img/common.jpg)sda3           8:3    0\
  \  100M  0 part\n![Image](img/common1.jpg)sda4           8:4    0  887M  0 part\n\
  ![Image](img/common.jpg)vg-lvgroups 253:2    0  440M  0 lvm\nsr0              17:0\
  \   0  1024M rom\n```\n\n***\n\n### 创建卷组\n\n现在物理卷已经创建，你可以将其分配给一个卷组。可以将物理卷添加到现有的卷组中（稍后会讨论），但你现在将学习创建一个新的卷组并将物理卷添加到其中。这是一个简单的单命令程序。只需输入\
  \ `vgcreate`，然后是你想创建的卷组名称以及你想添加的物理设备名称。因此，如果物理卷是 `/dev/vdb1`，完整命令是 `vgcreate vgdata\
  \ /dev/vdb1`。你可以自由选择名称。我喜欢用 `vg` 开头卷组名称，这样如果有很多卷组，就很容易找到它们，但你可以自由选择任何喜欢的名称。在这个过程中，你学习了分两步创建卷组：首先使用\
  \ `pvcreate` 命令创建物理卷，然后使用 `vgcreate` 命令添加卷组。你也可以通过单步程序完成（此时不需要单独的 `pvcreate` 命令）。然而，如果你是向卷组添加分区，它必须已经过标记。单步程序对于添加整个磁盘（不需要标记任何内容）特别有用。如果你想添加磁盘\
  \ `/dev/sdc`，只需输入 `vgcreate vgdata /dev/sdc` 来创建一个名为 `vgdata` 的卷组。\n\n\n\n\n\n现在逻辑卷已经创建，你可以开始使用它了。要做到这一点，你需要知道设备名称。LVM\
  \ 卷设备可以通过多种方式进行寻址。简单的方法是将设备作为 `/dev/vgname/lvname` 进行寻址。因此，如果你创建了一个名为 `lvdata` 的卷，它从\
  \ `vgdata` 卷组获取可用磁盘空间，那么设备名称将是 `/dev/vgdata/lvdata`。\n\n为 LVM 卷命名时，另一个系统起了作用：设备映射器。设备映射器（缩写为\
  \ `dm`）是 Linux 内核用于寻址存储设备的通用接口。设备映射器用于多种设备类型，例如 LVM 卷，但也用于软件 RAID 和高级网络设备（如多路径设备）。这些设备在两个位置被创建：作为\
  \ `/dev` 目录中按顺序编号的设备，例如 `/dev/dm-0`、`/dev/dm-1` 等。由于这些设备名称没有提供任何关于设备的信息，且容易混淆，因此在\
  \ `/dev/mapper` 目录中创建了符号链接。这些符号链接使用 `vgname-lvname` 模式命名。因此，设备 `/dev/vgdata/lvdata`\
  \ 也被称为 `/dev/mapper/vgdata-lvdata`。在操作 LVM 逻辑卷时，你可以使用这些设备名称中的任何一个。列表 15.7 显示了设备映射器提供的不同\
  \ LVM 设备名称概述。\n\n**列表 15.7** LVM 设备名称概述\n\n点击此处查看代码图像\n\n* * *\n\n```\n[root@localhost\
  \ ~]# \\ls -l /dev/vgdata/lvdata\nlrwxrwxrwx. 1 root root 7 Feb 11 05:00 /dev/vgdata/lvdata\
  \ -> ../dm-2\n\n[root@localhost ~]# \\ls -l /dev/mapper/\ntotal 0\nlrwxrwxrwx. 1\
  \ root root      7 Feb 11 03:50 centos-root -> ../dm-1\nlrwxrwxrwx. 1 root root\
  \      7 Feb 11 03:50 centos-swap -> ../dm-0\ncrw-------. 1 root root 10, 236 Feb\
  \ 11 03:50 control\nlrwxrwxrwx. 1 root root      7 Feb 11 05:00 vgdata-lvdata ->\
  \ ../dm-2\n\n[root@localhost ~]# \\ls -l /dev/dm-2\nbrw-rw----. 1 root disk 253,\
  \ 2 Feb 11 05:00 /dev/dm-2\n```\n\n* * *\n\n* *\n\n## 练习 15.2 创建卷组和逻辑卷\n\n在 练习 15.1\
  \ 中，你创建了一个物理卷。在练习中，你将继续处理该物理卷并将其分配给卷组。然后，从该卷组中添加一个逻辑卷。只有在成功完成 练习 15.1 后，你才能进行此练习。\n\
  \n1. 打开一个 root shell。输入 `pvs` 来验证机器上物理卷的可用性。你应该能看到之前创建的 `/dev/vdb1` 物理卷。\n2. 输入\
  \ `vgcreate vgdata /dev/vdb1`。这将创建一个分配了该物理卷的卷组。\n3. 输入 `vgs` 验证卷组是否成功创建。同时也输入 `pvs`。注意此命令现在显示了物理卷的名称以及它们所属的卷组名称。\n\
  4. 输入 `lvcreate -n lvdata -l 50%FREE vgdata`。这创建了一个名为 `lvdata` 的 LVM 逻辑卷，它将使用 `vgdata`\
  \ 卷组中 50% 的可用磁盘空间。\n5. 输入 `lvs` 验证卷是否成功添加。\n6. 此时，你已准备在逻辑卷上创建文件系统。输入 `mkfs.xfs /dev/vgdata/lvdata`\
  \ 创建文件系统。\n7. 输入 `mkdir /files` 创建一个可以挂载卷的文件夹。\n8. 在 `/etc/fstab` 中添加以下行：\n\n点击此处查看代码图像\n\
  \n```\n/dev/vgdata/lvdata /files    xfs      defaults  1 2\n```\n\n9. 输入 `mount\
  \ -a` 验证挂载是否正常并挂载文件系统。\n\n* * *\n\n表 15.2 总结了创建逻辑卷的相关命令。\n\n![Image](img/key_topic.jpg)![Image](img/15tab02.jpg)\n\
  \n**表 15.2** LVM 管理基本命令\n\n### 调整 LVM 逻辑卷的大小\n\n使用 LVM 的主要优点是 LVM 卷很容易调整大小，这在你的文件系统可用磁盘空间不足时非常有用。如果使用\
  \ XFS 文件系统，可以增大卷的大小，但不能缩小。其他文件系统如 Ext4 和 Btrfs 也支持缩小文件系统大小。缩小 Ext4 文件系统只能在离线状态下进行，这意味着你需要在调整大小之前将其卸载。在本节中，你将学习如何增大\
  \ LVM 逻辑卷的大小。\n\n#### 调整卷组的大小\n\nLVM 灵活性的核心在于调整卷组以及使用卷组磁盘空间的逻辑卷的大小非常简单。`vgextend`\
  \ 命令用于向卷组添加存储，`vgreduce` 命令用于从卷组中移除物理卷（这可能会导致一些额外的复杂性）。对于 RHCSA 考试，你需要知道如何扩展卷组中的可用存储。此过程相对简单：\n\
  \n1. 确保有一个物理卷或设备可以被添加到卷组中。\n2. 使用 `vgextend` 扩展卷组。新的磁盘空间将立即显示在卷组中。\n\n扩展卷组后，你可以使用\
  \ `vgs` 命令验证物理卷是否已添加到到卷组中。在列表 15.8 中，你可以看到 centos VG 包含两个物理卷，如 `#PV` 列所示。\n\n**列表\
  \ 15.8** 使用 `vgs` 验证 VG 大小调整操作\n\n点击此处查看代码图像\n\n* * *\n\n```\n[root@server2 ~]#\
  \ vgs\n  VG      #PV #LV #SN Attr   VSize   VFree\n  centos   2   3   0 wz--n- \
  \  7.00g 560.00m\n  vgsan   1   2   0 wz--n- 496.00m  96.00m\n```\n\n* * *\n\n####\
  \ 调整逻辑卷和文件系统的大小\n\n就像卷组可以通过 `vgextend` 命令扩展一样，逻辑卷也可以通过 `lvextend` 命令扩展。该命令有一个非常有用的选项，可以同时处理扩展逻辑卷上的文件系统；建议使用此选项，而不是分别扩展逻辑卷及其上层文件系统的替代方法。在调整包含文件系统的逻辑卷时，文件系统不会发生任何变化，其数据将保持完好无损。大多数文件系统调整操作甚至可以在线完成，无需卸载文件系统。\n\
  \n要增大逻辑卷的大小，请使用 `lvresize`，后接 `-r` 选项以调整其使用的文件系统。然后，指定你想要调整后的大小。最简单且直观的方法是使用 `-L`\
  \ 后跟 `+` 号和你想添加的磁盘空间，例如 `lvresize -L +1G -r /dev/vgdata/lvdata`。调整逻辑卷大小的另一种方法是使用\
  \ `-l` 选项。该选项后跟要添加到逻辑卷的区数量，或者卷组中使用的区绝对或相对百分比。例如，你可以使用以下命令调整逻辑卷的大小：\n\n![Image](img/key_topic.jpg)\n\
  \n![Image](img/sqf.jpg) `lvresize -r -l 75%VG /dev/vgdata/lvdata` 这调整逻辑卷的大小，使其占据卷组中总磁盘空间的\
  \ 75%。\n\n![Image](img/sqf.jpg) `lvresize -r -l +75%VG /dev/vgdata/lvdata` 这尝试向逻辑卷添加卷组总大小的\
  \ 75%。（注意与上一个命令的区别。）\n\n![Image](img/sqf.jpg) `lvresize -r -l +75%FREE /dev/vgdata/lvdata`\
  \ 这向逻辑卷添加 75% 的所有可用磁盘空间。\n\n\n\n\n[content]\n\n![Image](img/squf.jpg) `lvresize\
  \ -r -l 75%FREE /dev/vgdata/lvdata` 此命令将逻辑卷调整为等于可用磁盘空间总量 75% 的大小。（注意这与上一个命令的区别。）\n\
  \n在调整逻辑卷大时，你也可以使用 `-l` 选项，后跟你想要添加或删除的逻辑区（logical extents）数量。逻辑区是创建逻辑卷时使用的逻辑构建块，它映射到物理区（physical\
  \ extents），物理区的大小可以在创建卷组时指定。所有的调整操作都必须匹配完整的逻辑区。你有时会发现调整所需的大小被向上取整或向下取整到逻辑区的大小。你也可以通过在使用\
  \ `lvresize` 命令时直接使用 `-l` 选项来指定需要添加或删除的逻辑区数量。\n\n如你所见，调整逻辑卷大小有很多选项，你必须小心使用正确的选项，因为这很容易出错！在练习\
  \ 15.3 中，你将学习如何调整逻辑卷以及用于其上的文件系统。\n\n***\n\n### Note\n\nXFS 文件系统的大小不能减小；只能增大。如果你需要一个可以缩小大小的文件系统，请使用\
  \ Ext4 而不是 XFS。\n\n***\n\n### 练习 15.3 调整逻辑卷\n\n在练习 15.1 和 15.2 中，你创建了物理卷、卷组和逻辑卷。在此练习中，你将扩展逻辑卷以及其上层文件系统的大小。\n\
  \n1. 输入 `pvs` 和 `vgs` 以显示当前的物理卷和卷组配置。\n\n2. 使用 `fdisk` 添加另一个大小为 100M 的分区。不要忘记将此分区标记为\
  \ LVM 分区类型。在本文练习中，我假设这个新分区为 `/dev/sdb2`。请将此名称替换为你配置中使用的名称。\n\n3. 输入 `vgextend vgdata\
  \ /dev/sdb2` 用 `/dev/sdb2` 设备的总大小扩展 vgdata。\n\n4. 输入 `vgs` 验证可用卷组的大小已增加。\n\n5. 输入\
  \ `lvs` 验证逻辑卷 `lvdata` 的当前大小。\n\n6. 输入 `df -h` 验证 `lvdata` 上文件系统的当前大小。\n\n7. 输入\
  \ `lvextend -r -l +50%FREE /dev/vgdata/lvdata` 用卷组中所有可用空间的 50% 来扩展 `lvdata`。\n\n\
  8. 再次输入 `lvs` 和 `df -h` 验证添加的磁盘空间是否已可用。\n\n9. 输入 `lvreduce -r -L -150M /dev/vgdata/lvdata`。这会将\
  \ `lvdata` 卷缩小 50MB。请注意，在执行此操作时，卷会被临时卸载，这是自动完成的。\n\n#### 总结\n\n在本章中，你学习了如何操作 LVM\
  \ 逻辑卷。首先，你学习了 LVM 如何提供普通分区不具备的功能，例如轻松的调整大小或使用快照。你还学习了如何创建用于 LVM 配置的分区，并学习了如何创建物理卷、卷组和逻辑卷来构建\
  \ LVM 基础。你还学习了如何调整卷组和逻辑卷的大小。\n\n### 考试准备任务\n\n#### 复习所有关键主题\n\n复习章中最重要的主题，这些主题在页面外边处用“关键主题”（Key\
