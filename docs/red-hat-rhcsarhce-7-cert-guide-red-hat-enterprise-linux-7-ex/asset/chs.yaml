  \ Linux 是否被完全支持。\n\n### 管理内核模块参数\n\n你有时可能希望带有特定参数加载内核模块。如果是这种情况，你首先需要找到要使用的哪个参数。如果你找到了想要使用的参数，可以手动加载它，指定参数名称后跟你想要赋值的值。为了使此过程自动化，你可以在\
  \ `/etc/modprobe.d` 目录下创建一个文件，其中包含加载模块以及你想要加载的参数。在练习 16.2 中，你将看到如何使用 `cdrom` 内核模块来实现。\n\
  \n***\n\n### 练习 16.2 带参数加载内核模块\n\n在此练习中，你将学习如何处理内核模块参数。\n\n1. 输入 `lsmod | grep cdrom`。如果你在电脑上用过光驱，该模块应该已加载，并且应该指示它正被\
  \ `sr_mod` 模块使用。\n2. 输入 `modprobe -r cdrom`。这将不起，因为模块正在被 `sr_mod` 模块使用。\n3. 输入 `modprobe\
  \ -r sr_mod; modprobe -r cdrom`。这将卸载两个模块。\n4. 输入 `modinfo cdrom`。这将显示关于 `cdrom`\
  \ 模块的信息，包括它支持的参数。其中之一是 `debug` 参数，它支持布尔值作为值。\n5. 现在使用命令 `modprobe cdrom debug=1`。\n\
  6. 输入 `dmesg`。这将显示内核环形缓冲区，`debug` 信息写入其中。\n7. 在 `/etc/modprobe.d/cdrom` 中创建一个文件，内容为：`options\
  \ cdrom debug=1`。\n\n***\n\n### 升级内核\n\n你需要定期升级 Linux 内核。当你升级内核时，会安装新版本并将其作为默认版本。不过，旧版本仍然可用。GRUB\
  \ 启动加载程序会自动识别在 `/boot` 中找到的所有内核。\n\n#### 总结\n\n在本章中，你学习了如何操作 Linux 内核（它是模块化的）以及如何管理。你还学习了在处理新硬件时如何内核模块。\n\
