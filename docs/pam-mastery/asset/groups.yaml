    # GA File Format


    Google Authenticator''s configuration file, .google_authenticator, includes only
    a few possible options.


    ```

    5KPJOJZCY670ENW

    - RATE_LIMIT 30

    - WINDOW_SIZE 17

    - DISALLOW_REUSE

    - TOTP_AUTH

    - 21481565

    ```


    The first line is always the shared secret. Don''t muck with it. Not all possible
    codes are valid, so you can''t set a corporate standard that each user''s secret
    is their first name and their Social Security number.

    The presence of the RATE_LIMIT option enables rate limiting. It takes two arguments:
    how many authentication attempts to allow, and how many seconds they''re allowed
    in.  Rate limiting requires that the user be able to write to the configuration
    file.'
- md: '

    ## Chapter 9: One-Time Passwords: Google Authenticator


    The WINDOW_SIZE option dictates how time-sensitive your passcode. A 1 means that
    the precisely current passcode, as dictated by the system clock, will be acceptable.
    Each increase of two means that an extra passcode before and after the current
    one is acceptable. Setting this to 17, the value used if you take the google-authenticator
    suggestion of allowing a four-minute window, means that the passcode for the current
    time, plus eight earlier codes and eight later ones, is acceptable.


    The DISALLOW_REUSE option means that each passcode can be used once and only once.


    The file ends with the user''s remaining one-time passcodes. While it might be
    tempting to add your own one-time codes to this file, GA performs additional verification
    on the emergency codes. Adding 00000001 to the end of the file won''t work. Plus,
    the act of editing an emergency code invalidates the remaining codes.


    Now that we''ve secured remote access, let''s consider something useful to local
    users.


    ## Chapter 10: Console Access with SSH Keys


    Sysadmins have a morning routine. After caffeine, pants, more caffeine, and staggering
    into the office, we slump in front of our workstation. We log on with a username
    and password. The majority enter our SSH passphrase and load our keys into an
    SSH agent. At that point we can start work. This requires authenticating to our
    workstation twice: once with a username and password, and once with a username
    and SSH key.


    The pam_ssh module integrates SSH key management with the login process. A user
    can go to their workstation and log in with only their SSH key. Rather than authenticating
    against /etc/passwd, the user authenticates with the SSH private key in their
    account. On successful authentication, pam_ssh starts an SSH agent and stores
    the decrypted private key in the agent.


    Unlike other PAM modules discussed in this book, pam_ssh is most useful for workstations,
    and then only selects one. You certainly wouldn''t want to authenticate to a server
    based on SSH keys files stored on that server. Typical users should never offer
    passphrases to a remote server. You probably wouldn''t want to have this functionality
    on the salesperson’s machine. But many sysadmins find pam_ssh quite convenient
    on their personal laptops.


    pam_ssh provides service to the auth and session types. Used in an auth policy,
    pam_ssh prompts the user for a passphrase. It attempts to decrypt the user''s
    private SSH keys with that passphrase, much as ssh(1) or ssh-add(1) do. If the
    passphrase works, the module returns PAM_SUCCESS. Otherwise, the module fails.
    In a session policy, pam_ssh starts an SSH agent for the user and adds the key
    to the agent.


    FreeBSD includes pam_ssh by default. CentOS has a pam_ssh package, while Debian
    offers a libpam-ssh package. These modules are not only packaged differently;
    they’re different code. FreeBSD imported the original pam_ssh and made improvements.
    That code was extracted from FreeBSD and forked into slightly different versions
    for CentOS and Debian. Each supports different features. We''ll cover every operating
    system''s pam_ssh separately.


    Additionally, each operating system uses pam_ssh differently. We''ll use this
    module as an opportunity to explore how a very similar module can be configured
    with entirely different PAM statements and produce very different behavior.


    All of the versions of pam_ssh we cover the try_first_pass, use_first_pass, and
    debug options.


    ### One Module, Different Policies


    All three of our target platforms deploy pam_ssh differently. CentOS does not
    offer any suggestions on placing pam_ssh statements. FreeBSD includes pam_ssh
    in the default install. Statements for pam_ssh appear in FreeBSD''s standard configuration
    files, but they''re commented out. Debian''s libpam-ssh package not only installs
    pam_ssh, but also adds PAM statements to enable the module.


    We''ll consider the simpler FreeBSD case first, then Debian.


    ### FreeBSD and pam_ssh


    FreeBSD offers examples of enabling pam_ssh systemwide and in individual services.
    I don''t want to use pam_ssh to authenticate to the FTP server on my workstation,
    or over a serial line, so I won''t enable it systemwide. I do want to use it during
    a graphical console login, ever the file /etc/pam.d/xdm has commented-out entries
    for pam_ssh. Uncommenting these gives us auth and session policies.


    ```

    auth sufficient pam_ssh.so no_warn try_first_pass

    auth required pam_unix.so no_warn try_first_pass

    session required pam_ssh.so want_agent

    session required pam_lastlog.so no_fail

    ```


    The auth policy has only two statements. The first, pam_ssh, is sufficient. The
    logon will prompt the user for their SSH key passphrase. If the passphrase is
    correct, the sufficient statement means access is immediately granted. The no_warn
    flag disables warnings. And the try_first_pass flag tells pam_ssh to try any earlier
    password. As this is the first statement in the policy, there won''t be an earlier
    password.


    The second auth statement, for pam_unix, is for traditional Unix authentication
    against /etc/password. This auth rule gets triggered only if pam_ssh fails. With
    the try_first_pass argument, this module attempts to use the previously entered
    SSH key passphrase as a Unix system password. If you accidentally enter your password
    instead of your passphrase, the system lets you in.


    Taken together, these mean that the user is first prompted for a username and
    password. In the session policy, pam_ssh sets up the agent. The want_agent option
    is FreeBSD-specific.


    ### Debian and pam_ssh


    When you install pam-ssh on Debian, the package adds PAM statements to /etc/pam.d/common-auth
    and /etc/pam.d/common-session. While Debian''s libpam-ssh is different from the
    original, the logic remains similar.


    ```

    auth [success=1 default=ignore] pam_unix.so nullok_secure

    auth requisite pam_deny.so

    auth required pam_permit.so

    auth optional pam_ssh.so use_first_pass

    ```

