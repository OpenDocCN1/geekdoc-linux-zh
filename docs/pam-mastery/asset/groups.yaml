    # Chapter 7: Arbitrary Files and Random Programs


    To create an actual SELinux policy on your system, use

    aud2allow with the -M flag and the actual module name. This

    only creates the policy; it does not activate it.


    ```

    # grep denied audit.log | grep pam_ssh | audit2allow -Mnpam_ssh

    ```


    ****************s IMPORTANT*****************

    To make this policy package active, execute:


    ```

    semodule -i pam_ssh.pp

    ```


    You''re not one to ignore instructions, are you? Do what the nice

    software tells you.


    ```

    # semodule -i pam_ssh.pp

    ```


    Your PAM module should now work, or at least it should proceed

    to the next error. Which is progress, no?


    Once you have a working SELinux policy, you can copy the .pp file

    containing the policy to other systems and install it. You must ensure

    that the SELinux policy version matches and that the types referenced

    in the policy exist in the other system. The best way to do this is to use

    the same operating system for both your test and production

    environ.


    # SELinux and pam_mkhomedir


    The pam_mkhomedir module creates missing home directories when

    the user logs in. It''s used in organizations that deploy centralized

    authentication, as as LDAP. This book doesn''t cover the module

    because it''s very trivial.


    One problem with pam_mkhomedir is that it doesn''t sup-\port SELinux. Red Hat
    envisions SELinux as a core part of its

    operating system. Rather than update pam_mkhomedir, Red

    Hat has replaced pam_mkhomedir with the SELinux-friendly

    pam_oddjob_mkhomedir. A solution exists, so that''s fine for most

    CentOS admins.'
  - '[PAGE 121]


    # Chapter 7: Arbitrary Files and Random Programs


    I''ve been in more than one multi-platform enterprise where the corporate security
    policy mandates use of pam_mkhomedir, however. Perhaps the security team hasn''t
    updated its policy in a while. Perhaps this is part of a cross-platform standardization
    push. I’ve even seen a case of “dang it, the blasted sysadmins keep using pam_exec
    for everything!” Adjusting the SELinux security policy lets you use pam_mkhomedir
    on CentOS.


    Eventually, you won''t be able to get pam_mkhomedir on CentOS. Rather than adjusting
