    # 第7 章：任意文件与随机程序


    account required pam_exec /usr/local/scripts/pamvarlog.sh


    当用户尝试访问其账户时，PAM 会运行脚本 `pamvarlog.sh`。我们在第 3 章使用了该脚本来收集 PAM 环境变量。


    OpenPAM 和 Linux-PAM 都为 `pam_exec` 提供了额外的选项，但我们将先介绍基本功能。具体来说，我们将完全通过 shell 命令实现一个基本的
    `pam_listfile` 功能。


    ## 在 pam_exec 中实现 pam_listfile


    我们将拥有一个允许访问服务的用户列表。如果用户名存在于文件中则允许访问；如果不存在，则拒绝访问。


    PAM 向我们的脚本传递了它通常的一组项目。如果你不确定特定服务器设置了哪些项目，可以使用第 3 章中的 `pamvarlog.sh` 脚本进行捕获。幸运的是，每个身份验证过程都需要
    `PAM_USER`。


    在我们的目标文件中检查用户名时，我们需要稍微留心。我们不想匹配注释，我们只想匹配完整的用户名。使用 `grep(1)` 就能解决这个问题。这是一个概念验证脚本，它检查
    `/etc/validusers` 中的用户，如果用户名出现在那里则允许访问。


    ```

    #!/bin/sh

    /usr/bin/grep ^$PAM_USER$ /etc/validusers

    return $?

    ```


    该脚本返回 `grep(1)` 语句找到匹配项时的返回值，即返回 0。如果没有匹配项，它返回 1。记住，`pam_exec` 将 0 视为成功，将 1 视为失败。


    如果你想拒绝访问 `/etc/bogususers` 中列出的用户怎么办？这是一个巨大的变化：添加一个感叹号。


    ```bash

    #!/bin/sh

    ! /usr/bin/grep ^$PAM_USER /etc/bogususers

    return $?

    ```


    此脚本反转了 `grep(1)` 语句的返回值。

    基于这些示例创建符合你需求的脚本。至少，你必须对输入进行清理处理。清理输入的方法取决于你系统的默认 root shell——`bash` 的方法与传统的 `sh`
    不同。


    ## Pam_exec 与模块对比


    使用 `pam_exec` 处理一切似乎是解决许多问题的一种简单直接的方法。我们是系统管理员，我们喜欢 shell 脚本。

    “你想针对 NoSQL 数据库进行身份验证？我来写个 shell 脚本！”


    现实生活并不简单。

    当 PAM 模块为某个函数执行时，通常通常使用它会比编写自己的脚本要好。某些冷门但公开的 PAM 模块使用的用户可能比你的 shell 脚本多得多。最严重的
    bug 已经被发现了——最棒的是，它们是别人发现的。如果你自己写脚本，你就得自己去发现这些 bug。


    使用 `pam_exec` 应该被认为是最后的选择。不过，它是一个非常有用的最后选择。


    使用 `pam_exec` 时需要记住的一点是，Linux-PAM 和 OpenPAM 实现 `pam_exec` 的方式不同。


    ## OpenPAM pam_exec


    OpenPAM 的 `pam_exec` 只有一个选项，调整返回值。

    默认配置下，OpenPAM 的 `pam_exec` 返回两种响应之一。如果命令返回 0，`pam_exec` 返回 `PAM_SUCCESS`。如果命令返回其他任何内容，`pam_exec`
    返回 `PAM_PERM_DENIED`。


    `pam_exec` 的 `return_prog_exit_status` 选项改变了它的返回值。不再是简单的“是”或“否”，`return_prog_exit_status`
    让脚本返回实际的 PAM 返回码，如第 4 章所述。你的脚本需要为调用它的服务模块函数返回一个有效的返回值。在 Linux-PAM 中，你可以检查 `PAM_SM_FUNC`
    项目来查看调用 `pam_exec` 的函数。每个服务模块函数的手册页都列出了允许的返回值。`pam_exec` 知道哪些函数可以接受返回值。如果你的脚本尝试返回一个不可接受的代码，`pam_exec`
    会代为返回 `PAM_SERVICE_ERR`。


    这是 OpenPAM `pam_exec` 支持的选项。虽然 Linux-PAM `pam_exec` 支持更多选项，但选项几乎可以通过脚本实现。


    ## Linux-PAM pam_exec


    Linux-PAM 版本的 `pam_exec` 支持调试、日志记录和密码处理。


    `debug` 选项将调试信息发送到系统日志，正如第 1 章所述。


    你的 `pam_exec` 命令可能会输出。输出通常会被丢弃，但你可以使用 `log=` 替代。通过定义日志文件，你可以将任何输出发送到该文件。`stdout`
    将程序的输出发送到标准输出，让调用程序处理该输出。


    即使命令通常不产生输出，`pam_exec` 也会回显程序抛出的错误。`quiet` 选项禁用消息。


    `type=` 选项告诉 `pam_exec` 仅当 PAM 策略类型时运行命令。你可以设置 `type=account`，以便此特定的 `pam_exec`
    只在账户策略上运行。


    通过添加 `expose_authtok` 选项，你可以通过标准输入为脚本传递密码。环境变量 `PAM_MAX_RESP_SIZE` 决定了密码的最大长度，通常是
    512 字节。


    最后，你可以以被验证进程的有效 UID 程序。


    ## PAM 与 SELinux


    安全增强 Linux (SELinux) 是一种用于强制访问控制（MAC）架构的安全策略实施机制。SELinux 允许你定义安全策略，限制进程和用户访问文件、网络、端口和其他资源的能力。PAM（可插身份验证模块）是一个框架，允许应用程序使用验证模块而无需了解这些模块的工作原理。


    虽然 PAM 处理身份验证（确定你是谁），但 SELinux 处理授权（确定你可以做什么）。例如，PAM 可以验证登录 SSH 的用户，但 SELinux
    可以将用户的 shell 限制在特定的目录下。


    当你使用 `pam_exec` 运行自定义脚本时，你正在这两个系统之间建立一座桥梁。PAM 会触发脚本，但 SELinux 仍然会管控脚本被允许的操作。理解这两个系统如何协作工作以提供稳健的安全环境是非常重要的。


    '
