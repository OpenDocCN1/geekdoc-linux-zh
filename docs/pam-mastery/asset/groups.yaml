    # 第5章：常用的 Linux-PAM 模块


    你可以使用 `pam_localuser` 使用备密码文件。使用 `file` 选项、等号以及文件路径。


    ## 限制用户资源：pam_limits


    Linux-PAM 可以对用户施加系统资源限制。系统资源已不再是曾经那种稀缺商品，即使用户可能会启动一个消耗整个 CPU 并填满主机内存的进程。资源限制有助于防止这些问题的发生。你可以通过
    `pam_limits` 实施资源限制。


    运行 bash 的用户可以使用 `ulimit` 查看它们的限制，而基于 `csh` 的 shell 则使用 `limit`。


    较旧的 Linux 版本在 `/etc/limits.conf` 中设置这些限制。PAM 系统通常通过登录类（login classes）在认证之外处理这个问题。


    限制属于会话级别的 PAM 类型。


    `pam_limits` 系统包含两个部分：PAM 模块本身和限制文件。虽然可以将 `pam_limits` 指向任何想要的文件，但默认配置文件位于 `/etc/security/limits.conf`。额外的限制存放在
    `/etc/security/limits.d` 目录下。`limits.conf` 中的每行都有四个字段：域、类型、项目和值，如下所示。


    ```

    ftp hard nproc 0

    ```


    域（domain）标识该限制适用于哪些用户。你可以通过用户、组、通配符以及 UID 和 GID 范围来限制限制。在我们的示例中，域是用户 `ftp`。


    类型（type）表示这是硬限制（hard）还是软限制（soft）。硬限制是不可违越的。我们的示例是一个硬限制。


    项目（item）关键字定义了要限制的哪种资源。`pam_limits` 包含了许多资源关键字，我们将在稍后讨论。示例使用了项目 `nproc`，它是表示最大进程数量的关键字。


    最后一个字段给出了该资源的最大值。


    上面的示例将用户 `ftp` 限制为最多 0 个进程。希望该账户仅用于 FTP 服务；否则，用户 `Frederic Thomas Powell` 将会非常恼火。


    ## 限制域（Limit Domains）


    你可以通过用户名、组、UID、GID 或通配符来标识用户。


    对于适用于单个用户名的限制，使用用户名作为域。


    要使用系统组，请在组名之前加上 `@` 符号，例如 `@wheel`、`@staff` 或 `@customers`。


    星号 (`*`) 意味着该限制适用于所有用户。“所有用户”不包括 root，因为无所不能的 root 账户不受凡俗束缚。如果你想限制 root，必须显式地将
    root 列为域。


    `pam_limits` 使用 `%` 作为特殊通配符，专门留给 `maxlogins` 和 `maxsyslogs` 限制使用。单独使用时，它设置了此主机上非
    root 登录的最大数量。在它后面加上组名，可以设置该组的最大登录数。


    通过前导冒号指定单个 UID，如下所示。


    ```

    :1000

    ```


    对于 UID 范围，给出最低和最高匹配的 UID，并用冒号分隔。这里我们对 UID 从 1000 到 2000 之间的所有用户设置了限制。


    ```

    1000:2000

    ```


    如果不设置最大匹配 UID，则限制适用于所有大于或等于列出数字的 UID。在这里，我们对所有 1000 及以上的 UID 应用了限制。


    1000:


    组 ID（GID）的工作方式与 UID 非常相似，它们前面有一个 `@` 符号。用冒号指定范围。如果你在匹配 UID 范围，PAM 会将用户的主组与该范围进行比较。然而，如果你在匹配特定的组，PAM
    会查看用户所属的所有组。在这里，如果用户在 GID 10000 中，我们就实施限制，即使它不是用户的主组。


    ```

    @:10000

    ```


    将 `% maxlogs-only` 通配符与组 `@` 通配符结合，以限制所有用户的总登录数。在这里我们限制了组 10000 的用户总登录数。


    ```

    %:10000

    ```


    现在决定这是哪种限制。


    ## 限制类型（Limit Type）


    Linux-PAM 支持两种类型的限制：硬（hard）和软（soft）。


    软限制是用户可以感知的限制。它是操作系统的一种：“嘿，你真的想使用超过你份额的资源吗？”用户可以使用内置命令 `ulimit` 或 `limit` 来提高此限制。


    硬限制是内核强制的绝对上限。用户无法规避这种限制。


    你应该使用哪种？大多数用户都知道如何规避软限制，因此它实际上是硬限制。如果你有受过教育的用户，请同时使用软、硬限制。我通常使用限制来限制服务账户，防止 Web
    服务器和数据库失控。在这种情况下，硬限制最好——如果我的 Web 服务器提高了限制，我将面临一堆新问题……


    ## 限制项目和值（Limit Items and Values）


    Linux-PAM 可以对文件、内存、进程和登录设置限制。我们不会解释所有这些限制的含义，因为解释栈大小、锁定内存等内容将是另一本书的事¹¹


    大多数限制值都是数值的。用户可以打开 100 个文件，或使用 1GB 内存等。


    - nproc: 最大进程数。

    - cpu: 最大 CPU 时间。

    - fsize: 最大文件大小。

    - data: 数据段的最大大小。

    - memlock: 锁定内存量。

    - stack: 最大栈大小。

    - as: 地址空间的最大大小。

    - maxlogins: 同时登录数。

    - maxsyslogs: 系统日志数。

    - msgsque: POSIX 消息队列数。

    - sigpending: 挂起信号数。

    - rtprio: 实时优先级。

    - nice: 进程的 nice 值。

    - chroot: 要 chroot 的目录。


    ¹¹如果你不知道一个旋钮的作用，就不要乱动它。


    '
