    \n```bash\nsemodule -i pam_ssh.pp\n```\n\n你不是那种会忽略指令的人，对吧？听听友善软件的话。\n\n```bash\n\
    # semodule -i pam_ssh.pp\n```\n\n你的 PAM 模块现在应该可以工作了，或者至少它应该进入下一个错误提示。这总是一种进步，不是吗？\n\
    \n一旦你拥有了可用的 SELinux 策略，就可以将包含策略的 .pp 文件复制到其他系统并进行安装。你必须确保 SELinux 策略版本匹配，并且策略中引用的类型（types）在另一个系统中存在。此此的最佳方法是在测试和生产环境中使用相同的操作系统。\n\
    \n## SELinux 与 pam_mkhomedir\n\npam_mkhomedir 模块在用户登录时创建缺失的家目录。它被用于部署了集中认证（如 LDAP）的组织。本书没有涵盖该模块，因为它非常简单。\n\
    \npam_mkhomedir 的一个问题是它不支持 SELinux。红帽公司将 SELinux 视为其操作系统的核心部分。红帽并没有更新 pam_mkhomedir，而是用与\
    \ SELinux 兼容的 `pam_oddjob_mkhomedir` 替代了它。目前已有解决方案，所以对于大多数 CentOS 管理员来说没问题。\n\n\
    然而，我曾在多个跨平台企业工作过，那里的公司安全策略强制使用 pam_mkhomedir。也许安全团队已经有一段时间没有更新其策略了。也许这是跨平台标准化推进的一部分。我甚至见过这样一种情况：“该死，那些该死的系统管理员又在所有事情上都使用\
    \ `pam_exec`！”通过调整 SELinux 安全策略可以让你在 CentOS 上使用 pam_mkhomedir。\n\n最终，你可能无法在 CentOS\
    \ 上获取 pam_mkhomedir。与其调整策略并继续过日子，不如与你的安全团队谈谈。搞清楚他们试图解决什么问题。帮助他们要么更新标准，要么通过其他方式解决他们的问题。\n\
    \n但如果你真的想玩玩你组织的安全策略，你就需要额外的 PAM 模块。\n\n## 第 8 章：SSH Agent 认证\n\n大多数系统管理员使用安全外壳（SSH）管理主机。大多数\
    \ SSH 认证是使用公钥而非密码的。如果你正在使用 SSH agent，你可以通过 `pam_ssh_agent_auth` 告诉 PAM 使用 agent\
    \ 作为认证源。\n\n[Pam_ssh_agent_auth](https://sourceforge.net/projects/pamsshagentauth/)\
    \ 的工作方式与基于密钥的 SSH 认证相同。模块获取用户的 `authorized_keys` 文件，并询问用户的 SSH agent 它是否具有匹配的私钥。如果\
    \ SSH agent 拥有该私钥，模块将返回 `PAM_SUCCESS`。Pam_ssh_agent_auth 设计用于认证 `sudo(1)`，这就是我们使用它的方式。\n\
    \n使用用户的 SSH 密钥进行认证是对多因素认证的一种拙劣模仿。它证明了用户拥有密钥文件以及用于解密该密钥的短语。当然，密钥文件并不是物理实体。它可以在机器之间复制和移动。但它比单纯的明文密码稍微好一点。对于真正的双因素认证，你需要像\
    \ Google Authenticator（第 9 章）这样的工具，或者投资安全令牌。另一方面，SSH agent 认证让你避免在服务器上输入密码。\n\n\
    许多组织有正当理由不使用 SSH agent，或者有理由不以这种方式认证程序。破解用户的 SSH 客户端可能会导致服务器被破解。这在许多环境中是一个合理的反对意见。但\
    \ pam_ssh_agent_auth 是较简单的附加 PAM 模块之一，因此它是开始探索的好地方。\n\n## 第 8 章：SSH Agent 认证 \n\
