    ## Sufficient (充分的)


    `sufficient` 控制意味着在该模块中成功就足够提供访问权限，前提是之前的 `required` 控制没有失败。


    如果 `sufficient` 控制成功，PAM 会立即授予访问权限。它不会处理策略中的后续模块。


    如果 `sufficient` 控制失败，PAM 不会拒绝访问。`sufficient` 控制的失败被视为等同于 `optional` 控制的失败。PAM
    将此失败记录为一次 `optional` 失败。不触发失败允许用户尝试另一种身份验证方法。考虑以下策略。


