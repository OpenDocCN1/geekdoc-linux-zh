    # PAM 精通


    Michael W Lucas


    ![](img/889d57d001fa731b3995673e1877e197_0_0.png)


    # 对 Michael W Lucas 其他书籍的评价


    FreeBSD Mastery: ZFS


    “又是一本值得读的优秀 FreeBSD 书。” — Wendy Michele, nixCraft


    “《ZFS Mastery》涵盖了所有使用或管理这些文件系统的人日常工作中需要的所有知识。在了解了系统的实现原理后，看到它是如何被使用的，这种感觉非常奇妙。”
    — George V. Neville-Neil，《FreeBSD 操作系统的设计与实现》合著者


    # 系统管理员的网络技术


    “书中包含了大量的有用信息。我向大家推荐它！” — Sunday Morning Linux Review, 第 145 期


    “读完这本书后，你将在网络领域拥有坚实的基础。Lucas 以实用的方式解释概念；他确保教授了 Unix/Linux 和 Windows 下的工具；并为你提供了在向网络人员解释你看到的情况时会用到的术。在此过程中，书中穿落着许多来之不易的知识……”
    — Slashdot


    # FreeBSD Mastery: 特殊文件系统


    “阅读它是一种享受和宝藏” — Vivek Gite, nixCraft


    “我是他书的粉丝……他呈现书籍让书籍变得更容易理解。他在幽默和信息之间取得了完美的平衡。” — Sunday Morning Linux Review


    # Sudo 精通


    “太棒了，是 Lucas 作品，是 sudo。现在就买吧。” — Slashdot


    “Michael W Lucas 一直是我最喜欢的作者之一，因为他为可能相当枯燥的信息注入了非凡的叙述性。《Sudo Mastery》例外。” — Chris
    Sanders，《实用数据包分析》作者


    # 绝对 OpenBSD，第二版


    “Michael Lucas 再次创造了奇迹。” — cryptednets.org


    “在使用 OpenBSD 的 13 年后，我依然学到了新颖且有用的东西！” — Peter Hessler, OpenBSD Journal


    “这是一本真正非常优秀的书。它充满了关于 OpenBSD 的核心材料，并以幽默感呈现，展现了对该操作系统运作方式的深刻见解。如果你是从任何类型的 Unix
    背景阅读这本书，你将发现所需的内容，让你快速精通 OpenBSD——包括它是如何工作的，以及如何专业地进行管理。我怀疑没有比这更好的关于 OpenBSD 的书了。”
    — Sandra Henry-Stocker, ITWorld.com


    “很快就会发现，Michael 实际上在使用 OpenBSD，而不是一个为了满足字数而来的雇佣兵……简而言之，这不是一本走马观花的书，你不会从中发现任何敷衍的内容。”
    — Michael Dexter, callfortesting.org


    # DNSSEC 精通


    “当 Michael 钻研某个主题并写出一本书时，你可以预期结果将包含大量的有用信息，并伴随着幽默和真实生活的轶事，让你想要在自己的系统上深入探索该主题。”
    — Peter Hansteen，《PF 之书》作者


    # SSH 精通


    “……这是那种你不会只放在书架上的技术书籍之一。它是那种会被压折书脊、许多页面都做了书签并放在键盘旁的书。” — Steven K Hicks, SKH:TEC


    “……《SSH Mastery》这类我这样的 Unix 用户和系统管理员想要放在手手边的书籍之一……” — Peter Hansteen，《PF 之书》作者


    “这种对通常技术书籍解释的精简，使其具有了互联网上扩展文档的即时性。它不是那种作为广告载体的多页‘如何做’文章，而是来自一个长期使用 OpenSSH 处理过许多问题、并在操作过程中关注细节的人的深度阐述。”
    — DragonFlyBSD Digest


    # 网络流分析


    “将出色的风格与大量的技术信息相结合，这本书提供了一种既有趣又有引胜的学习体验。没有多少技术书籍能声称做到。” — ;login: Magazine, 2010
    年 10 月


    “这本书的价值价值连城。” — Utah.com


    “这本书读起来较快，在排故障和分析网络问题时大有用益。” —Dr. Dobbs


    “《Network Flow Analysis》是任何网络管理和数据管理图书馆的优选。它是首次向系统管理员展示如何使用流分析来评估、分析和启动网络，且来自”


    # FreeBSD Mastery: 存储


    “如果你正在尝试学习使用 PGP，或者至少想确保你正确使用了它们，请阅读《PGP & GPG》。” — Slashdot


    “如果你使用任何 nix 系统并需要异地备份，那么你需要 Tarsnap。如果你想高效地使用 Tarsnap，你就需要《Tarsnap Mastery》。”
    —Sunday Morning Linux Review 第 148 期


