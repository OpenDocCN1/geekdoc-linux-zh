    ### 质量概念


    所有密码质量检查器共享某些共同概念。


    ### 字符类


    不，不是“战士”、“牧师”、“盗贼”等等。密码检查器将密码中可能的字符分为四类不同的类：小写字母、大写字母、数字以及所有其他 ASCII 符号。存在第五种字符类用于非
