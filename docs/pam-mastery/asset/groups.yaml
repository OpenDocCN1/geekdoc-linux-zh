  - '[PAGE 74]


    # Chapter 3: PAM Items, Codes, and Functions


    I discuss PAM functions and service module functions later this chapter.


    # Reading Items with pam_exec


    While PAM modules pass items around, they don''t really provide an interface for
    displaying them to mere sysadmins. Linux-PAM systems offer pam_warn to dump information
    from PAM, but it''s not universally available. We''ll see pam_warn in Chapter
    6. Every Unix-like system supports using the pam_exec module to copy debugging
    information out of a policy, however. Chapters 6 and 7 cover pam_exec in detail,
    but we''ll touch on it here.


    Pam_exec lets you run arbitrary commands as part of a policy. Most often, this
    is a shell script.(You can put simple commands directly into a pam_exec statement,
    but that feels fragile to me.) We''ll use a simple example to copy all PAM items
    from the policy into the system log. Almost every operating system includes pam_exec.


    Here''s a simple script for capturing PAM items and writing them to the system
    log. I install this as /usr/local/scripts/pamvarlog.sh, but you can put it in
    your your preferred location.


    ```

    #!/bin/sh

    ```


    ```

    set | grep PAM | xargs logger

    ```


    This pulls all environment items, grabs any item or value that contains PAM, and
    sends them to the system log.


    Now attach this script to the PAM policy for a service, preferably near the top.
    You don''t want a requisite statement to prevent the script from running before
    you have your data.'
  - '[PAGE 75]


    # Chapter 3: PAM Items, Codes, and Functions


    ```

    auth required pam_exec.so /usr/local/scripts/pamvarlog.sh

    account required pam_exec.so /usr/local/scripts/pamvarlog.sh

    session required pam_exec.so /usr/local/scripts/pamvarlog.sh

    password required pam_exec.so /usr/local/scripts/pamvarlog.sh

    ```


    Add statements to your test system main auth policy: /etc/pam.d/system on FreeBSD,
    /etc/pam.d/system-auth on CentOS, and Debian’s /etc/pam.d/common-files. You’ll
    get messages like this in /var/log/messages.


    ```

    Mar 2 14:54:25 host1 mwl: PAM_RUSER=mw1 PAM_SERVICE=PAM_TTY=pts/0 PAM_TYPE=auth
    PAM_USER=root

    Mar 2 14:54:25 host1 mwl: PAM_RUSER=mw1 PAM_SERVICE=PAM_TTY=pts/0 PAM_TYPE=account
    PAM_USER=root

    ```


    This immediately shows that the user mwl run su(1) on terminal pts/0, and the
    request hit both the auth and account policies. The script doesn’t log the results
    of the su, but most programs that use authentication can perform their own logging.


    ```

    Mar 2 14:54:25 host1: (to root) mwl on pts/0

    ```


    PAM modules always what you expect to understand which items it uses. We’ll see
    an example of this behavior in Chapter 5.


    # PAM Return Codes


    Success and failure aren’t always clearly delineated. Just as politics has a whole
    scale of gray “yes, absolutely!” and “That’s, I’m moving to Canada/Russia/Antarctica/Discworld,”
    PAM has a bunch of possible answers besides “yes” and “no.” There’s a shipping
    container of difference between “wrong password” and the “sysadmin configured
    this PAM module incorrectly,” and neither is the same as the “LDAP server is down.


    When PAM calls a module, the module responds with precisely one return code. The
    exact interpretation of that return code depends on that module—an “expired password”
    error means something different if you have passwords locally versus in LDAP.'
  - '[PAGE 76]


    # Chapter 3: PAM Items, Codes, and Functions


    PAM includes 30 return codes, numbered 0 to 29. Many of them crop up only in bizarre
    circumstances or when the system is misconfigured. Mismatched binary types and
    un-loadable libraries show up in the system log, and are familiar if annoying
    parts of every sysadmin''s troubleshooting routine. For the complete list, check
    out the X/Open Single Sign-On (XSSO) Pluggable Authentication Modules specification
    or pam(3).


    Each return code has a formal name, usually given in all caps, starting with PAM.
    You''ll see return codes like PAM_SUCCESS, PAM_AUTH_ERR, and so on. You might
    see the return code number, from 0 to 29. You might also see the return code in
    lower case, without the leading PAM_. That is, return codes PAM_SUCCESS, 0, and
    success all refer to the same thing.


    Many return codes appear to overlap. To a system programmer they don''t, but for
    a sysadmin they do. Return codes like PAM_CRED_EXPIRED and PAM_AUTHTOK_EXPIRED
    mean the authentication credentials or password expired. Which error you get depends
    on how you are authenticating, but for a sysadmin, they both mean that the user''s
    password or other authentication token is no longer valid.


    You don''t need to know every PAM return code exists, that each PAM call returns
    one and only one code, and how to learn more about each code when it appears.


    Here are the PAM return codes you''re most likely to encounter.


    # PAM_SUCCESS (0)


    The request fully succeeded. The user authenticated correctly. This is an unqualified
    yes.'
- md: '

    ## Chapter 3: PAM Items, Codes, and Functions


    ## PAM_SERVICE_ERR (3)


    Some service that the PAM module needs has failed you. This appears most commonly
    with centralized authentication, when the Kerberos, LDAP, or NIS servers have
    gone belly-up.


    ## PAM_SYSTEM_ERR (4)


    The module experienced an OS-level error when trying to run.


    ## PAM_PERM_DENIED (7)


    The module says that this user lacks the privileges needed to return success.
    This permission error could be anywhere in the application stack. Check your system
    log.


    ## PAM_MAXTRIES (8)


    The module has a limit on the maximum number of times you can try to enter the
    correct authentication credentials. You’ve blown past that.


    ## PAM_AUTH_ERR (9)


    An error in authentication has occurred. The user entered the wrong password.


    ## PAM_NEW_AUTHTOK_REQD (10)


    Most frequently, getting this return code means that the user’s password has expired
    and must be changed. In PAM modules not related to passwords, however, it might
    appear when some password-like entity needs adjustment or replacement.


    Only account policies should return this code.


    ## PAM_USER_UNKNOWN (13)


    The authentication system doesn’t recognize this user.


    ## PAM_IGNORE (25)


    The PAM policy should ignore the result of this module, and not let it vote on
    allowing or denying access.


    ## Functions


    Each type of PAM request has well-defined programming interfaces to perform the
    task. These APIs both give PAM its flexibility and limit its scope. Sysadmins
    don''t have to know how to use these functions, of course. If they appear in documentation
    or the system log, though, knowing roughly what the function does can help debug
    issues.


    ## PAM Setup and Resources


    Setting up a PAM session requires that a program call the *pam_start* function.
    When the PAM session completes, the *pam_end* function tears down the session
    and releases all the resources session used.


    A program''s PAM session is a conversation between the program and the PAM libraries.
    A PAM application needs a “conversation callback,” a way for the PAM stack to
    send messages back to the application, provided by the *pam_conv* function.


    In addition to the items discussed earlier in this chapter, PAM includes a whole
    list of internal items. Even the prompt presented to the user is an item. The
    *pam_set_item* and *pam_get_item* functions let PAM manipulate these items.


    The *pam_setenv*, *pam_getenv*, *pam_putenv*, and *pam_getenvlist* functions allow
    PAM to manipulate the user environment before logging in. For example, a module
    like pam_krb5 would use these functions to set *KRBS5CNAME* to the credential
    cache where it stored your ticket at login.


    A PAM module might need to allocate memory for its own internal functions. While
    the PAM programming interface is strictly-defined, a PAM module can do anything
    it internally. The *pam_set_data* and *pam_get_data* let a PAM session create
    and manipulate these chunks of memory by name.


    ## Authentication Functions


    As the name implies, the pam_authenticate function authenticates the user. The
    function takes the username and an authentication token (a password, fingerprint,
    gene scan result, or so on) and checks them against an authentication database.


    The pam_setcred function manages a user''s credentials. A user''s credentials
    can include items like the user''s username and group memberships, as well as
    things like Kerberos tickets or other single-sign-on outrements.


    PAM modules do not set a user''s UID or G. Nor do they perform actions opening
    a virtual terminal for the user. These actions normally need to be done by a child
    process. If a PAM module were to drop privileges from root to the user''s when
    called pam_setcred, the module would lose access to privileged operations updating
    the lastlog. Instead, the server spawns a child process for the user''s activity,
    while the server process maintains its privileges and cleans up after itself.


    ## Account, Session, and Password Functions


    PAM uses the pam_acct_mgmt function to enforce account policies. Any restrictions
    on logon hours, password expiration, or other account statements pass through
    pam_acct_mgmt.


    Session statements trigger the pam_open_session and pam_close_session functions.


    Finally, the pam_chauthtok function lets the server change the user''s password.


    ## PAM Service Functions


    In addition to the functions used to call PAM, you''ll see functions that PAM
    itself uses to call modules. These service module functions are how each module
    responds to a type of request. Each service module function corresponds to a regular
    PAM function, and starts with pam_sm_ rather than just pam_.


    The service module functions are pam_sm_acct_mgmt, pam_sm_authenticate, pam_sm_chauthtok,
    pam_sm_close_session, pam_sm_open_session, and pam_sm_setcred. So pam_sm_acct_mgmt
    is just like pam_acct_mgmt, but used within a module rather than PAM.


    Why would you need to know all this? For one thing, Linux-PAM’s extended controls
    make heavy use of PAM return codes.


    ## Chapter 4: Linux-PAM Extended Controls and Substacks


    PAM defines four common control statements: required, requisite, sufficient, and
    optional (as well as the ignored). These controls determine how a PAM module affects
    authentication.


    Linux-PAM offers additional control statements that let you fine-tune responses,
    as well as the substack parameter that lets you divert processing.


    ## Extended Controls


    A yes from a PAM module is always PAM_SUCCESS, but a no comes in endless flavors.
    Each PAM module might return one of several responses. With extended controls,
    you can fine-tune how a PAM statement handles rejection. Remember, a module returns
    one and only one response to each query.


    Extended controls replace the four PAM controls with a specific instruction for
    each response, but a generic-catch-all instruction for any responses you don’t
    specify. “If this module returns X, block access. If the module returns Y, that’s
    good enough. If the module returns Z, immediately grant access. Any other answer,
    try the next module.”


    > If only a human being’s handling of rejection was so easily tuned!


    Identify extended controls by using square brackets ([]) around them. Here''s
    an example of an extended control from CentOS, for the module pam_secrety.


    ```

    auth [...]

    ```


    Each entry within the brackets represents a PAM response, with the leading PAM_
    stripped off, in lowercase. An equals sign separates the response from the instruction
    on how to handle that. This says when this module returns PAM_USER_UNKNOWN the
    policy should take the action “ignore.” When the module returns PAM_SUCCESS, follow
    the action called “ok.” If the response is PAM_IGNORE, take the action “ignore.”
    The default instruction, used when the module responds with anything else, is
    “bad.”


    The pam_secrety manual page lists five possible response codes: PAM_SUCCESS, PAM_AUTH_ERR,
    PAM_INCOMPLETE, PAM_SERVICE_ERR, and PAM_USER_UNKNOWN. The extended control defines
    custom actions for PAM_SUCCESS and PAM_USER_UNKNOWN. All of the other cases tell
    PAM to take the action “bad.”


    ## Extended Control Actions


    Consider PAM policies for a moment. Most statements in a policy affect the decision
    on whether or not to permit access. At any given point the policy might have a
    state like “allow access if nobody else objects” or “we’re definitely rejecting
    the request, which you later modules can do your book-keeping.” Linux-PAM’s extended
    control actions are designed to alter the state of that policy.


    The bad action tells PAM that the authentication request has failed. That''s why
    our example above uses it as the default—we care about a couple specific failures,
    but for most failures, we just say “no.” If

    '
  mdcn: '


    ## 第 3 章：PAM 项目、代码与函数


    ## PAM_SERVICE_ERR (3)


    PAM 模块所需的某些服务发生故障。这最常见于集中式身份验证，当 Kerberos、LDAP 或 NIS 服务器崩溃时。


    ## PAM_SYSTEM_ERR (4)


    模块在尝试运行时遇到了操作系统层面的错误。


    ## PAM_PERM_DENIED (7)


    模块表示该用户缺乏返回成功所需的权限。此权限错误可能出现在应用栈的任何地方。请检查您的系统日志。


    ## PAM_MAXTRIES (8)


    模块对尝试输入正确身份凭据的最大次数有限制。你超过了该限制。


    ## PAM_AUTH_ERR (9)


    发生了认证错误。用户输入错误的密码。


    ## PAM_NEW_AUTHTOK_REQD (10)


    通常情况下，获取此返回码意味着用户的密码已过期必须更改。然而，在与密码相关的 PAM 模块中，当某些类似于密码的实体需要调整或替换时，可能会出现此代码。


    只有账户策略应该返回此代码。


    ## PAM_USER_UNKNOWN (13)


    认证系统不认识该用户。


    ## PAM_IGNORE (25)


    PAM 策略应该忽略此模块的结果，不要让它参与允许或拒绝访问的投票。


    ## 函数


    每种类型的 PAM 请求都有定义的编程接口来执行任务。这些 API 既赋予了 PAM 灵活性，也限制了它的范围。当然，系统管理员不需要知道如何使用这些函数。但是如果它们出现在文档或系统日志中，大致了解函数的作用有助于调试问题。


    ## PAM 设置与资源


    设置 PAM 会话需要程序调用 *pam_start* 函数。当 PAM 会话完成时，*pam_end* 函数将销毁会话并释放会话使用的所有资源。


    程序的 PAM 会话是程序与 PAM 库之间的对话。PAM 应用需要一个“对话回调（conversation callback）”，即 PAM 栈向应用程序发送消息的方法，这由
    *pam_conv* 函数提供。


    除了本章之前讨论的项目外，PAM 还包含了一整套内部项目列表。甚至向用户显示的提示也是一个项目。*pam_set_item* 和 *pam_get_item*
    函数允许 PAM 操纵这些项目。


    *pam_setenv*、*pam_getenv*、*pam_putenv* 和 *pam_getenvlist* 函数允许 PAM 在登录前操纵用户环境。例如，像
    pam_krb5 这样的模块可以使用这些函数将 *KRBS5CNAME* 设置为登录时存储票据的凭据缓存路径。


    PAM 模块可能需要为其自己的内部函数分配内存。虽然 PAM 编程接口是严格定义的，但 PAM 模块可以在内部执行任何操作。*pam_set_data* 和
    *pam_get_data* 允许 PAM 会话通过名称创建并操纵这些内存块。


    ## 认证函数


    顾顾义，pam_authenticate 函数用于验证用户身份。该函数接收用户名和身份验证令牌（密码、指纹、基因扫描结果等），并将其与身份验证数据库进行比对。


    pam_setcred 函数管理用户的凭据。用户的凭据可以包括用户名和组组成关系等项目，还包括 Kerberos 票据或其他单点登录扩展。


    PAM 模块不设置用户的 UID 或 GID。它们也不执行为用户打开虚拟终端的操作。这些操作通常需要由子进程完成。如果 PAM 模块在调用 pam_setcred
    时将权限从 root 降到用户权限，那么模块将失去访问更新 lastlog 的特权操作权限。相反，服务器为用户的活动创建一个子进程，而服务器进程保持其权限并在完成后清理。


    ## 账户、会话与密码函数


    PAM 使用 pam_acct_mgmt 函数来执行账户策略。任何对登录时间、密码过期或其他账户语句的限制都会通过 pam_acct_mgmt 传递。


    会话语句会触发 pam_open_session 和 pam_close_session 函数。


    最后，pam_chauthtok 函数允许服务器更改用户的密码。


    ## PAM 服务函数


    除了用于调用 PAM 的函数外，你还会看到 PAM 自身调用模块的函数。这些服务模块函数是每个模块响应特定请求的方式。每个服务模块函数对应一个普通的 PAM
    函数，并以 pam_sm_ 开头而不是简单的 pam_。


    服务模块函数有 pam_sm_acct_mgmt、pam_sm_authenticate、pam_sm_chauthtok、pam_sm_close_session、pam_sm_open_session
    和 pam_sm_setcred。因此，pam_sm_acct_mgmt 就像 pam_acct_mgmt，但它是在模块内部而非 PAM 中使用的。


    你为什么需要知道所有这些？一方面，Linux-PAM 的扩展控制大量使用了 PAM 返回码。


    ## 第 4 章：Linux-PAM 扩展控制与子栈


    PAM 定义了四种常见的控制语句：required（必须）、requisite（）、sufficient（足够）和 optional（可选）（以及 ignored
    忽略）。这些控制决定了 PAM 模块如何影响认证。


    Linux-PAM 提供了额外的控制语句允许你精调响应，以及允许你重定向处理的 substack（子栈）参数。


    ## 扩展控制


    PAM 模块返回“是”始终是 PAM_SUCCESS，但“否”却有无数种形式。每个 PAM 模块可能返回几种响应中的一种。通过扩展控制，你可以精调 PAM
    语句处理拒绝的方式。记住，模块对每个查询只返回且仅返回一种响应。


    扩展控制将四种 PAM 控制替换为针对每个响应的特定指令，并对你未指定的响应提供通用的捕获指令。“如果模块返回 X，则拒绝访问。如果返回 Y，就足够了。如果返回
    Z，则立即允许访问。任何其他回答，尝试下一个模块。”


    > 如果人类对拒绝的处理能这样容易调优就好了！


    通过在周围使用方括号 [] 来标识扩展控制。这是一个来自 CentOS 的 pam_secrety 扩展控制示例。


    ```

    auth [...]

    ```


    括号内的每个条目代表一个 PAM 响应，去掉前缀 PAM_ 并转为小写。等号将响应与处理该响应的指令分开。这表示当模块返回 PAM_USER_UNKNOWN
    时，策略应采取“忽略”动作。当模块返回 PAM_SUCCESS 时，执行“ok”动作。如果响应是 PAM_IGNORE，采取“忽略”动作。当响应为其他任何内容，默认指令是“bad”。


    ## 扩展控制动作


    考虑 PAM 策略。策略中的大多数语句影响是否允许访问。在任何时刻，策略都可能处于“如果没有人反对就允许访问”或“我们明确拒绝该请求，后续模块可以进行你的清理工作”的状态。Linux-PAM
    的扩展控制动作旨在更改该策略的状态。


    bad 动作告诉 PAM 身份验证请求失败了。这就是为什么我们上面的示例使用它作为默认值——我们关心某些特定的失败，但对于大多数失败，我们直接说“不”。


    If


    '
