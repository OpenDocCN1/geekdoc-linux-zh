  - '[PAGE 171]


    # Chapter 11: Password Quality Checks


    The `badwords` option can be set to a space-separated list of words forbidden
    to appear in passwords. If you''re using this option, I highly recommend using
    a configuration file rather than entering the whole list in an `/etc/pam.d` file.


    Finally, `enforce_for_root` tells `pam_pwquality` to impose restrictions even
    on the `root` account. Normally, `root` can assign a user''s password to `password`
    if she pleases.


    With `pam_pwquality` and `pam_pwwdqc`, you can force your users to create less
    awful passwords. Don''t expect them to thank you, though.'
  - '[PAGE 172]


    # Afterword


    PAM is a powerful tool meant to simplify systems administration, and instead it
    has bewildered, befuddled, and bedeviled sysadmins almost entirely since its inception.
    I should know. I''m one of the folks who spent years trying to understand PAM.
    Every time I thought I knew what I was doing, reality gave this great big belly
    laugh and said, “Oh, yeah?”


    Reality is kind of anyway...

    my twenty-fifth book. It seems a good spot to say a couple of things that need
    seeking.


    This is my tenth self-published technical book—or, as the spine of the print edition
    says, number A. It''s my eighteenth tech book,


    I’m amazed, gratified, and a little humbled by the mostly positive reaction my
    readers have offered my work. Thanks to all of you, I’m now making a living writing
    books on comparatively obscure computing topics. I’m very grateful for that.


    But speaking of “making a living,” why would I write this book? PAM is not a hot
    topic like ZFS. It’s not ubiquitous the way SSH is—yes, most everybody in IT passes
    through PAM at some point in their day, but not many people have to configure
    it. I wrote this book because I thought I’d make a fortune, but because I think
    the systems administration community needs it.


    I hope that this book saves you.


    If not, I recommend aspirin, exercise, and doing something wholly unrelated to
    computers until the agony fades. Yes, that might take the rest of your life.'
