    # Chapter 0: Introduction


    Setting it to publickey means sshd requires public key authentication. Combining
    the two with a comma that sshd requires both, while separating them with a space
    sshd offers a choice of authentication options.


    Most people who want to enable PAM in sshd(8) want the daemon to reject all authentication
    requests without a public key, and then give PAM a chance to permit or veto the
    connection. That gives you an AuthenticationMethods entry like this.


    AuthenticationMethods publickey,keyboard-interactive


    Alternatively, you might want to let users with public key authentication in,
    and then fall back to PAM for one-time passwords or some other strong authentication.
    Put a space between the methods. AuthenticationMethods publickey keyboard-interactive


    Even with these options, not all PAM modules work with sshd. Plugging pam_ssh_agent_auth
    (Chapter 8) into sshd, as amusing as that sound, will only annoy you.


    # PAM, LDAP, and Kerberos


    Any time sysadmins ponder authentication, the topic of centralized authentication
    comes up. Most of these discussions wind up with various permutations of Lightweight
    Directory Access Protocol (LDAP) and Kerberos. This will help you with these?


    Yes... and no.


    The difficulty of deploying LDAP has very little to do with PAM. Configuring LDAP
    authentication is hard because LDAP is so wildly free-form. You can use any number
    of LDAP schemas or create your own. Decisions made early in LDAP deployment have
    repercussions that you''ll live with forever. Worse, differences between the LDAP
    modules on each of our reference platforms mean that each platform needs a unique
    configuration.


    Kerberos is less free-form than LDAP, but it has very specific requirements and
    higher overhead.


    This book will help you understand how your PAM configuration affects these centralized
    authentication methods. It will help you extract debugging information from PAM
    as you deploy. It won''t help you decide how to design your LDAP schema.


    # Book Overview


    This book has two big pieces. The first six chapters guide you through how PAM
    works.


    Chapter 0 is this introduction.


    Chapter 1, “PAM Components,” discusses the parts of PAM. You’ll learn about PAM
    configuration files and statements, the control statements, PAM modules, and common
    flags. We’ll also explore PAM policies work, and how PAM decides to allow or reject
    requests.


    Chapter 2, “Common Modules,” covers modules everyone needs to understand, such
    as those used for traditional Unix authentication, permitting root to access services,
    accounting, and more.


    Chapter 3, “PAM Items, Codes, and Functions,” dives into some PAM internals. A
    sysadmin doesn’t need to program PAM, but does need to recognize these codes when
    they show up. Understanding PAM items and return codes is critical to managing
    PAM.


    Chapter 4, “Linux-PAM Extended Controls and Substacks,” discusses Linux-PAM extensions
    to PAM configuration, such as that making decisions based on specific PAM responses.


    Chapter 5, “Popular Linux-PAM Modules,” goes into detail on modules usually deployed
    in Linux-PAM systems. Linux config features in PAM that other systems place elsewhere.


    Chapter 6, “PAM Debugging,” shows how to find problems in your PAM configuration.


    With these six chapters, you can perform essential configuration tasks and debugging.
    The remainder of the book takes into specific modules. A trivial Internet search
    uncovers hundreds of PAM modules, but this book covers only a few. Some of them
    are widely available and very useful, such as pam_exec (Chapter 7). Some are popular,
    as as pam_ssh_agent_auth (Chapter 8) and Google Authenticator (Chapter 9). Some
    let me illustrate important points about PAM. The module pam_ssh (Chapter 10)
    not only illustrates a useful feature, but also serves as a case study on the
    infuriating differences in how operating systems deploy PAM modules.


    This leaves hundreds of PAM modules. Many PAM modules are vital to the people
    who need them, but only a fraction of readers need any given module. This book
    gives you enough understanding of PAM to feel assured of your ability to write
    correct rules for using that module, freeing your precious brainpower to understand
    the module itself and how that module fits into a policy.


    Chapter 7, “Arbitrary Files and Random Programs,” discusses permitting access
    based on a text list. You also learn about running external programs as part of
    PAM.


    Chapter 8, “SSH Agent Authentication,” covers using your SSH agent to authenticate
    to services after logging onto the system.


    Chapter 9, “One-Time Passwords: Google Authenticator,” helps you implement time-based,
    one-time passwords (TOTP) using Google’s PAM module and a variety of client software.


    Chapter 10, “Console Access with SSH Keys,” teaches you how to configure a workstation
    so users can use their SSH keys as part of the local authentication process.


    Chapter 11, “Password Quality Checks,” discusses using PAM modules to limit passwords
    users can choose.


    Grab your flashlight. We’re going into PAM.


    # Chapter 1: PAM Components


    Any PAM system handles the login and authentication process with several types
    of rules. We''ll start with the configuration files that contain the rules, then
    dive into the authentication components and the actions.


    ## PAM Configuration Files


    You might find PAM configurations in the file `/etc/pam.conf`, or in a whole mess
    of files in the `/etc/pam.d/` directory.


    When Solaris spawned PAM back in the 1990s, a single configuration file suffic
    for the few services that used PAM. Each PAM rule statement started with the name
    of the service that rule applied. The rules for access to rlogind(8) started with
    `rsh`, the rules managing telnet access started with `telnet`, and so on. Solaris-derived
    systems still use a single `pam.conf`.


    PAM proved bindweed, though. Before long, the single configuration file constrained
    and complicated systems administration. Implementations like Linux-PAM and OpenPAM
    split PAM rules out into `/etc/pam.d` directory, where each service had a file
    named after it. Linux-PAM and OpenPAM put the rules for rlogind(8) in `/etc/pam.d/rsh`,
    the rules for SSH access in `/etc/pam.d/sshd`, and so on.


    # Chapter 1: PAM Components


    FreeBSD systems also separate configuring system components and add-on packages.
    While the PAM configurations live in /etc/pam.d, add-on packages have their PAM
    configurations in /usr/local/etc/pam.d. You might find similar variations in other
    operating systems.


    Systems that use /etc/pam.d are far more common than those relying on /etc/pam.conf.
    The examples in this book assume you''re using per-service configuration files.
    If you''re on a Solaris-based system, you''ll need to add the service name to
    the front of every PAM rule in /etc/pam.conf.


    # PAM Policies


    If you''ve never looked at a PAM file, go at one of the files in /etc/pam.d/.
    A policy file has a bunch of statements like this.


    ```

    auth      required pam_unix.so      no_warn try_first_pass nullock

    account   required pam_unix.so

    session    required pam_lastlog.so  no_fail

    password   required pam_unix.so      no_warn try_first_pass

    ```


    Each line is one PAM statement or rule. Each statement contains four components:
    the type, the control, the module, and the module arguments. The first PAM statement
    shown here has the type auth, the control required, the module pam_unix.so, and
    the arguments no_warn, try_first_pass, and nullock.


    We''ll go over each of these in detail, but understanding the basics of each will
    help you understand how the parts interoperate as we dive deeper.


    A type is a component of the authentication process. Managing credentials is a
    part of authentication. So is setting up a user''s account and resource limits,
    as well as changing the user''s password.


