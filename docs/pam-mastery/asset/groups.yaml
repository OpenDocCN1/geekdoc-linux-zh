    # 第 9 章：一次性密码：Google Authenticator


    每个用户的 $HOME/.google_authenticator 文件并不包含用户的共享密钥。它还包含了用户的定时、速率限制和时钟敏感度设置。每个组织都有奇才聪明的人，他们能想出如何玩弄系统，而且足够愚蠢地去尝试。此外，有时用户的家目录是加密的或通过
    NFS 挂载的，因此在身份验证完成之前无法使用。


    在这些企业中使用 Google Authenticator 需要通过 `file` 和 `user` 选项将文件从用户的控制范围中移除。


    `file` 选项允许系统管理员为用户的 .google_authenticator 文件设置不同的位置。使用等号和文件路径即可。该选项将变量 `~` 和
    `${HOME}` 识别为用户的家目录，将 `${USER}` 识别为用户名。


    ```

    auth required pam_google_authenticator.so \file=/ul/ga/${USER}/.google_authenticator

    ```


    在这里，每个用户的 GA 配置都位于其家目录之外。这使得系统可以等待身份验证完成后再挂载家目录。通过使用由用户拥有的用户特定目录，每个用户都可以继续管理自己的
    GA 配置。该文件应由用户所有，且模式为 400。


    你可能不希望用户管理自己的 GA 配置。有多个组织让用户在受严格保护的注册服务器上配置 Google Authenticator。注册服务器会自动将该配置传播到组织内的所有其他服务器。在这样的企业中，用户不应该有权限编辑所有其他服务器上的配置文件，可能在注册服务器上也不如此。（注册脚本可能会向用户隐藏除
    QR 以外以外内容。）在这种情况下，文件应由系统用户所有，并禁止用户访问文件本身。使用 `user` 选项来实现。


    ```

    auth required pam_google_authenticator.so \

    secret=/etc/ga/${USER} user=google

    ```


    在这里，用户的 GA 配置被存放在 `/etc/ga` 目录下，文件名以用户命名。我的身份验证配置将是 `/etc/ga/`。该文件由用户 `google`
    所有，模式应为 400。虽然系统管理员可以轻松识别单个用户的文件，但更新配置的唯一方法是通过管理系统。


    不允许用户访问其配置会导致 Google Authenticator 无法使用某些功能。该模块将所有计时信息都保存在配置文件中。如果用户无法更新文件，速率限制函数将不起。在设置期间，除了写入原始文件外，对所有函数均回答
    `n`。


    虽然以这种方式使用 Google Authenticator 需要额外的编程，但它并不比其他“企业级”令牌系统更难用。


    # 时钟偏移调整


    Google Authenticator 可以尝试处理系统时钟不准的问题。连续三次身份验证失败（且每次间隔 30 秒）会向 GA PAM 模块发出信号，提示时钟存在偏移，并暗示这种偏移的严重程度。


    使用 `noskadj` 可以关闭此行为。如果系统时钟不准确到让进行偏移调整都有意义，那么修复时钟比微妙地暗示存在问题更有意义。


    # 口码显示


    与密码类似，口码不会回显给用户。如需将口码回显给用户，请使用模块选项 `echo_verification_code`。


    口码是瞬态实体。在许多部署中，口码只能使用一次。即使有人从用户肩膀后偷看了口码，它也会在几分钟后过期。大多数时候，为用户显示输入的口码会大幅减少支持电话。用户——是的，即使是*你的用户*——在口码可见时也能识别出自己输错了六个数字。


    # 同时输入口码和密码


    某些启用了 PAM 的应用程序和模块（例如 Radius 认证或开启了 `PasswordAuthentication yes` 的 SSH）不能很好地处理多个身份验证提示。你可以通过
    `forward_pass` 选项让 Google Authenticator 在单次请求中同时询问密码和口码。GA 会处理口码，并将密码交给下一个模块。下一个模块必须使用
    `use_first_pass` 选项来接受传递的密码。


    ```

    auth required pam_google_authenticator.so forward_pass sufficient pam_unix.so
    try_first_pass

    ```


    尝试身份验证的用户将收到单个提示，如下所示：`Password & verification code:`


    用户需要输入她的密码、一个空格和 Google Authenticator 口码。如果口码正确，GA 将密码传递给下一个模块。在这种情况下，由于该模块是 `sufficient`（足够的），正确的密码将立即允许访问。


    你不能将 `forward_pass` 和 `echo_verification_code` 结合使用。好吧，你*可以*结合，但 GA PAM 模块会同时回显密码和口码，并拒绝身份验证请求，因此这种组合没有意义。


    # 新设备


    一旦配置了 Google Authenticator，你几乎可以忽略它……直到你有了新的智能手机、平板或电脑。你可能希望为新设备配置与旧设备相同的身份验证设置。有时，你直接用旧手机换了一个新手机。


    记得我提到过第一次为 GA 配置账户时要备份安全代码吗？这正是原因所在。Google Authenticator 不会重新显示现有安装的密钥、配置 URL
    或 QR 码。你必须使用你保留的备份。手动输入安全代码很麻烦，但比重新配置所有设备要好得多。


    # 灾难恢复


    使用 Google Authenticator，你可能会面临两种不同的灾难：设备被盗，或者 PAM 模块损坏。两者都有类似的恢复考量。


    丢失多因素身份认证系统中的一个因素并不是灾难，但确实需要果断行动。如果你丢失了设备以及密码、SSH 密钥或其他认证方式，让受影响的用户在所有影响主机上重新运行
    google-authenticator 或组织的封装脚本。如果情况紧急，使用 `su` 为用户运行。


    另一种灾难是系统时钟损坏。此时 GA 口码将无法工作。当你运行 google-authenticator 时，它会在 QR 码后显示五个八位代码。这些是应急代码。用户可以使用它们进行验证，但每个代码只能使用一次。


    GA 在允许访问之前会从配置中移除一次性代码。这需要用户对配置文件有写入权限。如果用户的配置文件属于另一个用户，应急代码将无法工作。


    # GA 文件格式


    Google Authenticator 的配置文件 `.google_authenticator` 包含几个可能的选项。


    ```

    5KPJOJZCY670ENW

    - RATE_LIMIT 30

    - WINDOW_SIZE 17

    - DISALLOW_REUSE

    - TOTP_AUTH

    - 21481565

    ```


    第一行始终是共享密钥。不要动它。并不是所有的代码都是有效的，因此你无法设定公司标准要求每个用户的密钥都是他们的名字和社会安全号。


    `RATE_LIMIT` 选项的存在启用速率限制。它接受两个参数：允许的身份验证尝试次数以及允许的秒数。速率限制需要用户能够写入配置文件。


    '
