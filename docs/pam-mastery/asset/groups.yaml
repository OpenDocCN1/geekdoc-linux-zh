- md: '

    Let''s examine this PAM policy with the requisite control.


    ```

    auth required pam_breathalyzer.so

    auth requisite pam_ddr.so

    auth required pam_genescan.so

    ```


    The first module, pam_breathalyzer.so, is required. If the user does not pass
    the breathalyzer test, it cannot log in, period. Whether that module succeeds
    or fails, PAM continues to the next module in the policy.


    The second module, pam_ddr.so, is requisite. It must succeed for PAM to grant
    access. If this module fails, PAM immediately stops processing the policy and
    tells the application authentication is refused.


    The third module, pam_genescan.so, is also required. The third module is only
    triggered if the second module succeeds, however. A failure in pam_ddr.so means
    pam_genescan.so doesn''t get checked.


    Using the requisite control can give the user hints as to where the authentication
    attempt failed. An intruder can use this information to more precisely target
    their attacks. Use requisite only when you have a very specific reason to not
    run later controls. Do not spend time, energy or attention optimizing login failures.
    This policy uses the requisite control because gene scanning is expensive, and
    avoiding it unnecessarily saves money.


    ## Optional


    Statements with the optional control have little effect on success or failure.
    Operating systems use optional controls to manage functions that might or not
    be deployed or configured, such as SSH agents and Kerberos. You''ll also deploy
    optional controls to add additional functions to an authentication session.


    An optional control can permit or deny access if and only if no other module in
    the policy expresses an opinion. If you have a bunch


    # Chapter 1: PAM Components


    of sufficient statements and an optional statement, and none of the sufficient
    statements permit access, the optional statement can permit or deny access.


    Here''s a policy that uses an optional control.


    ```

    auth required pam_breathalyzer.so

    auth required pam_ddr.so

    auth required pam_genescan.so

    auth optional pam_faildelay.so

    ```


    Our three sample modules are still required: all must succeed for the user to
    get access.


    The new module, pam_faildelay.so, sets a delay between login attempts. If a user''s
    attempt to log in gets rejected, the module delays returning an authentication
    prompt to the user by several seconds. This module doesn''t do anything with the
    user''s authentication credentials. As it changes how PAM behaves, you would expect
    it to always return success. In the unlikely event that pam_faildelay.so fails,
    however, you don''t want the failure to prevent logins.


    Statements with an optional control normally go at the front of a policy. You
    probably wouldn''t want the failure of a requisite control to block the optional
    module. I deliberately put pam_faildelay at the end of this policy, however, I
    don''t want to introduce a delay before the first logon attempt.


    I should mention that using pam_faildelay at all a poor idea; such delays should
    be built into the application, not provided through PAM, as security advisories
    show. Ideally, each authentication attempt should take a constant amount of time,
    rather than providing a constant delay between attempts. It''s a popular module,
    though, so you''ll need to at least recognize it.


    The session type is the most common user of optional controls.


    # Chapter 1: PAM Components


    ## Sufficient


    The sufficient control means that success in this module is enough to provide
    access, provided a previous required control hasn''t failed.


    If a sufficient control succeeds, PAM immediately grants access. It does not process
    further modules in the policy.


    If a sufficient control fails, PAM does not deny access. Failure of a sufficient
    control gets treated like failure of an optional control. PAM records this failure
    as an optional failure. Not triggering a failure permits the user to try another
    authentication method. Consider the following policy.


    ```

    auth sufficient pam_breathalyzer.so

    auth sufficient pam_ddr.so

    auth sufficient pam_genescan.so

    ```


    All three modules are sufficient, meaning that successfully authenticating any
    one of them immediately permits access.


    Think about this policy for a moment. We have three chances to create success,
    but the only failures this policy can create are optional. What does your PAM
    implementation do when there''s no explicit acceptance or denial? OpenPAM defaults
    to rejecting the request. Linux-PAM normally rejects the request, but in the last
    twenty years I''ve encountered certain configurations and distributions that permit
    access unless specifically denied. Best practice calls to explicitly rejecting
    access. Both Linux-PAM and OpenPAM include pam_deny for exactly this application.


    All requests to pam_deny fail, creating a fail-safe. If your last rule in a policy
    uses a sufficient control, follow it up with a required pam_deny statement. You''ll
    get more detail on pam_deny in Chapter 3.


    # Chapter 1: PAM Components


    auth sufficient pam_breathalyzer.so

    auth sufficient pam_ddr.so

    auth sufficient pam_genescan.so

    auth required pam_deny.so


    With this addition, either one of these tests passes or the request denied.


    The sufficient control permits either/or authentication methods.

    Look at our next policy for an example.


    ```

    auth sufficient pam_breathalyzer.so

    auth required pam_ddr.so

    auth required pam_genescan.so

    ```


    The first module, pam_breathalyzer.so, is sufficient. If the user passes this
    module, PAM considers the request successful and stops processing the policy.
    If this module fails, though, PAM logs an optional failure and continues down
    the policy.


    The second and third statements are required. You''ll hit these statements only
    if the first module returns a failure.


    The end result? The user may authenticate with either pam_breathalyzer.so, or
    with both pam_ddr.so and pam_genescan.so. As this policy ends with required controls,
    we don''t need a failsafe pam_deny.so statement at the end.


    ## Binding


    The binding control is pretty much a required control that immediately stops processing
    the policy on success. The binding control is rarely used at best—I have never
    seen it deployed in the real world. The Sun engineers thought binding looked useful
    when they first proposed the standard, but reality disagreed. I have only seen
    the word “bind” in PAM statements in an LDAP context. It''s not implemented in
    Linux-PAM. For these reasons, while I''ll explain binding here, the rest of this
    book pretends it doesn''t exist.


    # Chapter 1: PAM Components


    If a statement with a binding control succeeds, and no earlier required statement
    failed, the application is told to immediately grant access. PAM does not process
    any further statements in the policy.


    If a statement with a binding control fails, PAM denies access. The remaining
    rules of the policy are processed, allowing them to perform their functions, but
    the access request is ultimately rejected.


    If you''re considering using binding, try sufficient instead.


    ## Include


    Both Linux-PAM and OpenPAM support include statements, allowing you to pull one
    policy into another. The policy could come from files in /etc/pam.d or /etc/pam.conf.
    Debian systems in the entire file that is referenced, while OpenPAM and most Linux-PAM
    systems pull in only the statements of the relevant type. Here’s CentOS’ /etc/pam.d/sudo,
    the PAM configuration for sudo(1).


    ```

    auth include system-auth

    account include system-auth

    password include system-auth

    session optional pam_keyinit.so revoke

    session required pam_limits.so

    ```


    This policy has a single rule. It includes the policy system-auth. This tells
    PAM to check for a file /etc/pam.d/system-auth or a policy of name in /etc/pam.conf,
    grab all of the rules of this type, and put them here. The file /etc/pam.d/system-auth
    contains this policy.


    ```

    auth required pam_env.so

    auth sufficient pam_printd.so

    auth sufficient pam_unix.so nullock try_first_pass

    auth requisite pam_success_if.so uid >= 1000 quiet_success

    auth required pam_deny.so

    ```


    When a user accesses the login service, they pass through this policy.

