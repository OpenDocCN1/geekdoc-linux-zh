    \ 或 `ok` 结果，并保留剩余模块的新成功或失败结果。这是 Linux-PAM 特有的。与绑定控制（binding control）一样，我从未在生产环境中见过部署过\
    \ `reset`。\n\n最后，你可以指定一个数字作为动作。触发该数字告诉 Linux-PAM 跳过策略中后续的相应数量模块。数字通常与 `pam_success_if`\
    \ 模块一起使用，正如第5章所讨论的。\n\n# 第4章：Linux-PAM 扩展控制与子栈\n\n# 扩展格式中的标准控制\n\n每个标准 PAM 控制都可以用\
    \ Linux-PAM 扩展控制格式表示。理解这些可以加深你对扩展控制和传统控制的理解。\n\n必需（required）控制可以像这样表示：\n\n```\n\
    [success=ok new_authtok_reqd=ok ignore=ignore default=bad]\n```\n\n如果 PAM 模块返回\
    \ `PAM_SUCCESS` 或 `PAM_NEW_AUTHTOK_REQD`，此控制将采取 `ok` 动作。身份验证成功。如果模块返回 `PAM_IGNORE`，PAM\
    \ 将忽略该模块。如果模块返回其他内容，将采取 `bad` 动作且身份验证失败。\n\n必须（requisite）控制看起来非常相似。\n\n```\n[success=ok\
    \ new_authtok_reqd=ok ignore=ignore default=die]\n```\n\n`requisite` 和 `required`\
    \ 的唯一区别在于默认动作。当 `required` 控制失败为 `bad` 时，`requisite` 控制默认为 `die`。如果带有此控制的模块失败，访问被拒绝并立即停止处理。\n\
    \n足够（sufficient）控制看起来完全不同。\n\n```\n[success=done new_authtok_reqd=done default=ignore]\n\
    ```\n\n如果模块返回 `PAM_SUCCESS` 或 `PAM_NEW_AUTHTOK_REQD`，策略立即允许访问。得益于 `done` 动作，不会发生进一步处理。任何其他响应都不会影响策略的投票结果，尽管模块可能在系统上采取其他操作。\n\
    \n可选（optional）控制类似于 `sufficient`。\n\n```\n[success=ok new_authtok_reqd=ok default=ignore]\n\
    ```\n\n在这里，`PAM_SUCCESS` 或 `PAM_NEW_AUTHTOK_REQD` 使此模块返回 `ok` 并允许访问。任何其他结果意味着该模块既不允许也不拒绝访问。处理继续，但其他模块仍然可以否决访问。\n\
    \n# 子栈（Substacks）\n\nLinux-PAM 支持处理跳转（detours）或子栈。虽然 `include` 将该文件中的适当规则拉入 PAM\
    \ 策略，但 PAM 会单独处理子栈。子栈中的控制无法让整个策略停止处理——它只能终止子栈并返回主 PAM 策略。在子栈中做的决策会影响策略允许或拒绝访问的决策。\n\
    \n让我们来看常见的子栈示例。这里是 CentOS `/etc/pam.d/login` 中的策略，它调节控制台登录。\n\n```\nauth [user_unknown=ignore\
    \ success=ok ignore=ignore \\\n    default=bad] pam_security.so\nauth substack\
    \ system-auth\nauth include postlogin\n```\n\n此策略从检查 `pam_security` 模块（第2章）开始。它进入文件\
    \ `system-auth` 包含的子栈。许多 CentOS PAM 配置使用 `system-auth` 作为子栈，允许在多个服务之间共享通用配置。\n\
    \n```\nauth required pam_env.so\nauth sufficient pam_fprint.so\nauth sufficient\
    \ pam_unix.so nullock try_first_pass\nauth requisite pam_succeed.if_so \\\nauth\
    \ required uid >= 1000 quiet_success\npam_deny.so\n```\n\n考虑此子栈是如何处理的。第一个模块 `pam_env`（第5章）是必需（required）的。如果此模块失败，即使后续模块返回成功，请求也会被拒绝。然后我们有两个足够（sufficient）的模块。其中任何一个都可以返回成功并立即终止子栈的处理。第四个是必须（requisite）的，意味着如果成功，策略处理将立即结束。最后一个模块\
    \ `pam_deny` 总是返回失败。\n\n子栈有三个可以立即终止身份验证策略的控制语句——两个 `required` 和一个 `requisite`。然而，如果子栈中触发了任何一个，处理将立即结束。\n\
    \n# 第5章：常用的 Linux-PAM 模块\n\n`pam-env` 模块从 `pam-env` 特定配置文件、系统环境文件和用户环境文件获取设置。\n\
    \n# pam-env 配置\n\n主要的 `pam_env` 配置文件 `/etc/security/pam_env.conf` 允许你根据用户连接的方式设置环境变量。你可以提供一个默认值，如果需要，还可以提供一个条件替代方案或覆盖（override）。规则具有如下格式：\n\
    \n变量 默认 覆盖\n\n如果语句没有覆盖，`pam_env` 将用户设置环境变量。在这里我们无条件地设置 `EDITOR` 变量。\n\nEDITOR\
    \ pico\n\n用户可以使用常用的 Shell 配置覆盖此设置，但这允许你设置一个合理的默认值。\n\n"
