  - '[PAGE 91]


    # Chapter 5: Popular Linux-PAM Modules


    Pam_env uses the flag `readenv` to control reading

    /etc/environment. By default, pam_env reads and uses the environment-file. Set
    readenv to 0 to disable reading the environment.

    session required `pam_env.so readenv=0`


    You can also set a different environment file with the `envfile` flag, an equals
    sign (=), and the full path to an environment file. This lets you set different
    environments for different services.


    # User Environments


    Users can have their own environment files, and you can have pam_env read and
    impose those environment files at boot. This is rarely a good idea, but sometimes
    it''s the only idea. The `userenv pam_env` flag lets you set a file containing
    desired environment variables. This file is relative to the user''s home directory.
    Set the `user_readenv` flag to 1 to enable this functionality.


    Use userenv only if a particular user''s environment must be set early in the
    login process, and you can''t set that environment for all users.


    The user environment file works exactly like the system environment.


    # pam_env and Security


    PAM modules can use the user''s environment and PAM items to make decisions. By
    invoking pam_env, you''re feeding new variables into the PAM authentication or
    session policy. It''s possible that an environment variable set by pam_env could
    change the results of a PAM decision.


    The risk increases if you allow the use of environment files. While PAM modules
    are usually carefully programmed, I''m very reluctant to declare that a user environment
    file cannot subvert the authentication process. Users are clever. If you permit
    environment files, pay close attention to your system security and behavior.'
  - '[PAGE 92]


    # Chapter 5: Popular Linux-PAM Modules


    While the pam_env manual page declares that pam_env should appear last in any
    policy, to minimize the risk of environment contamination affecting authentication
    or session configuration, this advice has resulted in security flaws such as CVE-2010-4708
    and CVE-2011-3149. Both CentOS and Debian put pam_env first in policies to minimize
    risks.


    I recommend avoiding pam_env if possible.


    # Conditional Success: pam_succeed_if


    Linux-PAM''s pam_succeed_if module lets you perform a wide variety of checks based
    on user account settings, the service being checked, and the connection. You can
    compare any of these characteristics to values you choose.


    At the user level, pam_succeed_if lets you check the username (user), UID (uid),
    GID (gid), shell, and home directory (home). If PAM sets the root or host items,
    you can check those. Finally, you can check the terminal (tty) or service.


    You can compare these as numbers, strings, and list members. Additionally, you
    can do basic user group membership comparisons, much like pam_wheel. If a comparison
    matches, the module succeeds. If the comparison doesn''t match, the module fails.


    # String Comparisons


    You can compare just anything as a string. Even numbers can be strings, but that''s
    rather limited except for precise matches. Pam_succeed_if lets you do exact string
    comparisons with the equals sign (=). You can see if an item doesn''t match a
    string with the != operator.


    Additionally, you can use globs, or shell-style regular expressions. The ~ operator
    succeeds if an item matches a glob, and ~ succeeds if the item doesn''t match
    the glob.


    Here''s a Debian configuration for prohibiting root from logging'
  - '[PAGE 93]


    # Chapter 5: Popular Linux-PAM Modules


    on with GDM.


    auth required pam_succeed_if.so user != root quiet_success


    If the user does not equal the string root, pam_succeed_if returns success.


    # Numerical Comparisons


    You can compare the UID and GID to numbers. These are most useful for defined
    application accounts with constant user and group ID numbers, like www and tcpdump
    and the like. Use the standard mathematical operators for less than (<), less
    than equal to (<=), greater (>), greater than equal to (>=). Pam_succeed_if uses
    the equals sign and the != notation in string comparisons; instead, use eq for
    equals and ne for not equal.


    CentOS uses pam_succeed_if in the system-wide defaults, /etc/pam.system-auth,
    to prevent user accounts with a UID less than 1000 from authenticating.


    ```

    auth requisite pam_succeed_if.so \

    uid >= 1000 quiet_success

    ```


    CentOS reserves UIDs of 1000 and below for application accounts. User accounts
    start with UID 1000. An account with a UID below 1000 should never authenticate.
    While most of these accounts block interactive use by using /sbin/nologin as their
    shell, PAM adds another layer of protection.


    The quiet_success option here tells pam_succeed_if to not brag about passing this
    test.'
  - '[PAGE 94]


    # Chapter 5: Popular Linux-PAM Modules


    # List Comparisons


    To compare an item with a list, pam_succeed_if offers the *in* and *notin* operators.
    Give the list of comparisons after the operator, separated by colons, much like
    this.


    thing notin item1:item2:item3


    You might disallow a user from authenticating to a service by such a list.


    auth required pam_succeed_if user notin mwl:jkh:des


    As long as the user is not **mwl**, **jkh**, or **des**, the module succeeds.
    Debian extended permissions to control PAM on a per-service basis. We''ll see
    an example of this in Chapter 10.


    # User Group Membership


    You can use pam_succeed_if to check and see if a user is a member of a group or
    not. The *ingroup* operator returns success if the user is in the group, while
    *notingroup* succeeds if the user is not in the group. Here, we see if a user
    belongs to the group **customers**.


    ```

    auth sufficient pam_succeed_if.so \ \

    user ingroup customers

    ```


    Similarly, the *innetgr* operator checks for NIS netgroup membership, while *notnetgroup*
    returns success if the user is not in the netgroup.


    # Conditional Rule Processing


    Linux-PAM lets you skip statements in a PAM policy, as discussed in Chapter 4.
    This is mostly used with pam_succeed_if, creating PAM rules like "If this is true,
    skip the next rule in the policy." CentOS makes heavy use of this feature configuration
    with statements like this.'
  - '[PAGE 95]


    # Chapter 5: Popular Linux-PAM Modules


    session [success=1 default=ignore] pam_succeed_if.so \ service in crond quiet
    use_uid required pam_unix.so


    We use Linux-PAM extended controls here to say that if pam_succeed_if returns
    PAM_SUCCESS, skip one rule. For any other result, ignore this module. Pam_succeed_if
    returns success if the service is crond. If the service is crond, we skip one
    line.


    For any other service than crond, the PAM policy requires the pam_unix module.


    # Pam_succeed_if Options


    In addition to the standard debug, pam_succeed_if has a couple special options.


    The use_uid option tells PAM to check conditions using the requesting user''s
    information, rather than the target user''s. It switches the module from using
    PAM_USER to PAM_RUSER.


    The quiet option tells the module not to log successes or failures to syslog.
    You can select silence only for successes or failures with quiet_success and quiet_fail.


    Finally, audit logs whenever someone checks for nonexistent users.


    # Local Users


    In organizations with distributed user management, identifying users with local
    system accounts can be a useful part of an authentication system. The pam_localuser
    module returns success only if an account exists in the system''s password file.


    Note that pam_localuser doesn''t actually check the user''s local password; it
    only determines if the account exists. I''ve seen pam_localuser used in environments
    where the local accounts are for use during complete LDAP failure. The mere presence
    of a local account, however, means that the user is permitted to use su(1) or
    sudo(1).'
- md: '

    # Chapter 5: Popular Linux-PAM Modules


    You can use an alternative password file with pam_localuser. Use the file option,
    an equals sign, and the path to the file.


    ## Limiting User Resources: pam_limits


    Linux-PAM can impose system resource constraints on users. System resources are
    no longer the scarce commodity they once were, even when a user might start a
    process that consumes the entire CPU and fills up the host''s memory. Resource
    limits help prevent these problems. You can impose resource limits with pam_limits.


    Users running bash can view their limits with uelimit, while csh-based shells
    use limit.


    Older Linux versions set these limits in /etc/limits.conf. PAM systems normally
    handle this issue via login classes, outside of authentication.


    Limits belong to the session PAM type.


    The pam_limits system has two components, the PAM module itself and the limits
    files. While you can point pam_limits at any file you like, the default configuration
    file goes in /etc/security/limits.conf. Additional limits go in the directory
    /etc/security/limits.d. Each line in limits.conf has four fields: a domain, a
    type, an item, and a value, much as shown here.


    ```

    ftp hard nproc 0

    ```


    The domain identifies which users this limit applies to. You can limit by users,
    groups, wildcards, and ranges of UID and GID. In our example, the domain is the
    user ftp.


    The type indicates if this is a hard or soft limit. While hard limits are inviolate.
    Our example is a hard limit.


    The item keyword defines which resource to limit. Pam_limits includes many resource
    keywords, which we will discuss later. The example uses the item nproc, the keyword
    for the maximum number of processes.


    The final field gives the maximum value for that resource.


    The example above restricts user ftp to a maximum of zero processes. Hopefully
    that an account is used for the FTP service; otherwise, user Frederic Thomas Powell
    is going to be rather annoyed.


    ## Limit Domains


    You can identify users by username, group, UID, GID, or wildcard.


    For limits that apply to a single username, use the username as the domain.


    To use a system group put an @ symbol before the group name, such as @wheel, @staff,
    or @customers.


    An asterisk (*) means that this limit applies to all users. “All users” does not
    include root, as the almighty root account is not bound by mortal chains. If you
    want to limit to root, you must explicitly list root as the domain.


    Pam_limits uses % as a special wildcard, specifically reserved for the maxlogins
    and maxsyslogs limits. Used alone, it sets a maximum number of non-root logins
    on this host. Put a group name after it to set a maximum number of logins for
    that group.


    Specify a single UID with a leading colon, as shown here.


    ```

    :1000

    ```


    For a range of UIDs, give the lowest and highest matching UIDs, separated by a
    colon. Here we set limits on all users with UIDs from 1000 to 2000.


    ```

    1000:2000

    ```


    If you don''t put a maximum matching UID, the limit applies to all UIDs equal
    to or greater than the one listed. Here we apply a limit to all UIDs 1000 and
    higher.


    1000:


    Group IDs work much like UIDs, except they have an @ symbol in front of them.
    Specify ranges with a colon. If you''re matching a range of UIDs, PAM compares
    the user''s primary group to the range. If you''re matching a specific group,
    however, PAM looks at all groups the user belongs to. Here we impose a limit if
    the user is in GID 10000, even if it''s not the user''s primary group.


    ```

    @:10000

    ```


    Combine the % maxlogs-only wildcard with the group @ wildcard to limit the total
    number of logins of all users that are in the group. Here, if you''re in group
    10000, even if it''s not your primary group, you''re in the limited logins group.


    ```

    %@: 10000

    ```


    Now decide what kind of limit this is.


    ## Limit Type


    Linux-PAM supports two kinds of limits, hard and soft.


    A soft limit is a limit the user won''t know. It''s the operating system''s way
    of saying “Hey, do you really want to use more than your share of resources?”
    The user can raise this limit with shell built-ins ulimit or limit.


    A hard limit is an absolute upper cap enforced by the kernel. The user cannot
    evade this limit.


    Which should you use? Most users know how to evade a soft limit, so it''s effectively
    a hard limit. Use both soft and hard limits if you have educated users. I normally
    use limits to restrict service accounts, to prevent web servers and databases
    from spiraling out of control. Hard limits are best in such cases—if my web server
    raises its own limits, I have a whole new set of problems...


    ## Limit Items and Values


    Linux-PAM can set limits on files, memory, processes, and logins. We won''t cover
    exactly all of these limits mean, as explaining things like stack size, locked
    memory, and so on would take another whole book.¹¹


    Most limits values are numerical. A user can open 100 files, or use a gigabyte
    of RAM, and so on.


    - nproc: the maximum number of processes.

    - cpu: the maximum CPU time.

    - fsize: the maximum size of files.

    - data: the maximum size of data segment.

    - memlock: the amount of locked memory.

    - stack: the maximum size of the stack.

    - as: the maximum size of the address space.

    - maxlogins: the number of simultaneous logins.

    - maxsyslogs: the number of system logs.

    - msgsque: the number of POSIX message queues.

    - sigpending: the number of signals pending.

    - rtprio: the real-time priority.

    - nice: the niceness of processes.

    - chroot: the directory to chroot into.


    ¹If you don''t know what a knob does, don''t twiddle it.

    '
