    the same as your password, though.


    The interesting thing about Debian''s pam_ssh is that it only offers users great
    control over which keys can be used for authentication and which keys get added
    to the SSH agent.


    ### Debian pam_ssh Key Selection


    Debian pam_ssh ignores all the usual key files, and relies on the directories
    $HOME/.ssh/login-keys.d and $HOME/.ssh/session-keys.d. These directories don''t
    exist by default; the user must create them. The login-keys.d directory contains
    SSH private key files that can be used for authentication. Files here can be the
    actual private keys, or symlinks to the standard SSH key.


    ```

    $ cd .ssh/login-keys.d

    $ ln -s ../id_rsa

    ```


    When I log onto the system, pam_ssh checks this directory and attempts to use
    the user-provided password to decrypt any private keys it finds. It adds any keys
    it can decrypt to the user''s SSH agent. The session-keys.d directory also contains
    key files or symlinks. Unlike login-keys.d, though, pam_ssh will not use these
    key files for authentication. However, pam_ssh attempts to use the password to
    decrypt the keys in the session directory. It adds decrypted keys to the agent.


    ## Bypassing Passwords


    Maybe you don''t want a long password, instead relying on passphrase alone for
    console access. This would let you separate clear-text protocols like FTP from
    logons via SSH or the console. You can accomplish this by rearranging Debian''s
    auth policy.


    ```

    auth sufficient pam_ssh.so

    auth [success=1 default=ignore] pam_unix.so nullok_secure

    auth requisite pam_deny.so

    auth required pam_permit.so

    ```


    I''ve moved the pam_ssh rule to the top of the auth policy, even before pam_unix,
    but sufficient expresses desired behavior. Actually, as manually editing this
    file and making it inflexible for automated management, I am more likely to redo
    the entire policy and remove statements that can never be hit.


    ```

    auth sufficient pam_ssh.so

    auth required pam_unix.so nullok_secure

    ```


    Other people aren''t security-conscious as I am, though. Their machines need something
    to make sure they have a decent password, as we''ll see in the next chapter.


    ## Chapter 11: Password Quality Checks


    The word password is terrible. Everybody knows that, except users. Several PAM
    modules let you impose quality standards on your passwords to prevent users from
    using obviously bad passwords. These quality checkers won''t eliminate passwords,
    but will require users to be much more creative in them them


    While everyone agrees that a short password makes a hasty password, the qualities
    that make a password good are a subject of contentious debate. Even calm and rational
    sysadmins discussing password quality measures with other rational and sensible
    people escalating into a knife fight have known to lose their quiet and sensible...
    Some entirely object to the concept of password quality checking as used today.
    For this reason, we won''t discuss what characteristics make a password good.
    Instead, we''ll cover PAM modules that allow you to inflict your particular prejudices
    on your users.


    The most common password quality checking module is pam_passwdqc. CentOS 7 eliminated
    pam_passwdqc, replacing it with pam_pwquality. Debian has packages for both. We''ll
    use pam_passwdqc to explain the configuration and concepts of password quality
    checking, then briefly touch on pam_pwquality.


    ### Configuring Password Checks


    Test a password''s quality when the user changes the password. This makes the
    quality check one of the very few functions that belongs in a password policy,
    like so.


    ```

    password requisite pam_passwdqc.so

    password required pam_unix.so

    ```


    On most systems, passwd(1) has its own PAM configuration, /etc/pam.d/password.
    Changes in the system default won''t affect passwd(1), unless /etc/pam.d/password
    explicitly includes the default.


    When pam_unix is satisfied that the password should change, it alters /etc/password
    and related files. Place any password quality check before the pam_statement,
    so the password is audited before being changed.


    ## Password Rotation


    The question "how often should users change passwords?" is intimately tied to
    password quality checkers. Many organizations require changing passwords at regular
    intervals. Others argue that requiring password changes is more insecure than
    leaving them unchanged. Perhaps the password should only be changed upon first
    login.


    You don''t set password expiration policies within PAM, but a correctly configured
    PAM needs to respect password expiration. I''ve seen more than one LDAP-based
    network that doesn''t respect expired passwords.


    BSD systems manage password lifespan globally in /etc/login.conf and for individual
    users with pw(8). Linux systems mostly use mage(8). Consult your operating system
    manual for details on configuring password lifespans.


    ### Quality Concepts


    All password quality checkers share certain common concepts.


    ### Character Classes


    No, not "fighter," "cleric," "thief," and so on. Password checkers break possible
    characters in a password into four different classes: lower-case letters, upper-case
    letters, numbers, and every other ASCII symbol. A fifth character class exists
    for non-ASCII characters, but most of us can''t easily type those. You can require
    a user''s passwords to contain up to four classes, and adjust length requirements
    based on how many classes a proposed password contains.

