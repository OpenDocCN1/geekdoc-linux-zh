  - '[PAGE 128]


    # Chapter 9: One-Time Passwords:

    Google Authenticator


    A one-time password is a password that works only once. We''ve had many one-time
    password implementations, from One-Time Passwords in Everything (OPIE) to RSA
    tokens. The Time-Based One-Time Passwords system, or TOTP, uses the system clock
    and a shared secret to compute a valid password on demand. The best known TOTP
    implementation is Google Authenticator.


    Google Authenticator does not require access to Google. The reason it''s called
    *Google Authenticator* is because Google provides the software, not because it
    hooks into Google''s systems in any way. GA works fine on machines not even connected
    to the Internet.


    Google Authenticator transforms your smartphone, tablet, or Chrome browser into
    an authentication token, using a client-side app and the Google Authenticator
    PAM module. When you attempt to access a service using Google Authenticator, the
    PAM module computes a six-digit passcode as a temporary one-time password. The
    server prompts you for this passcode. Your device computes the current correct
    passcode for this host, using the same method. Enter the passcode your device
    offers into the application. If both devices made the same computation, the passcodes
    match and you get access.'
  - '[PAGE 129]


    # Chapter 9: One-Time Passwords: Google Authenticator


    Google Authenticator is a better multi-factor authentication method than using
    your SSH agent, but it''s not perfect. Any tablet, smart-phone, or Chrome browser
    can become an authentication token. If the bad guys capture any of your devices,
    or steal the shared secret used to configure the client app, they have your authentication
    token. But at least the devices are physical objects, not a file that intruders
    can easily copy.¹17


    Every host using GA has a separate GA configuration and a unique shared secret.
    Each user must log on to each host that she''s supposed to access and configure
    her GA access. Google Authenticator, by itself, is best suited to environments
    with only a few servers and a few accounts. You wouldn''t want to have a host
    with several thousand accounts using plain Google Authenticator unless you dedicate
    staff time to managing authentication. You can share a GA configuration between
    hosts, as we''ll discuss later, but this alters GA''s security profile and requires
    additional scripting and configuration. We''ll start with the simplest case, setting
    up GA on a single host.


    Before even starting with Google Authenticator, check the clocks and time zones
    on your hosts. Google Authenticator works best on servers with clocks synchronized
    to the rest of the world. System clocks often skew away from real time, especially
    on virtual machines. Use ntpd(8) or another time-keeping service to nail your
    servers'' clocks to everyone else''s. If GA inexplicably fails, double-check everything''s
    clock and time zone.


    Only use Google Authenticator with auth policies. It provides no services to the
    account, session, or password types.


    > 17 Unless you backup the shared secret in a place intruders can steal it from.
    Don''t do that.'
  - '[PAGE 130]


    # Chapter 9: One-Time Passwords: Google Authenticator


    Google Authenticator works almost everywhere; it has no envimental requirements
    like pam_ssh_agent_auth. I encourage you to think carefully before applying it
    to all system authentication, however. What happens when the server''s time gets
    drunk and skews wildly? If you require GA to log in at the console, fixing the
    problem will require getting into single user mode, probably via a reboot. Do
    you have enough redundancy to handle that? Also, Google Authenticator has built-in
    login rate limiting. If you require GA for both SSH and sudo, you''ll faceplant
    straight into that rate limiting.


    Carefully consider the implications of your deployment decisions.


    # Installing Google Authenticator


    The Google Authenticator client is easy. Grab your app from the device''s app
    store, or install the Authenticator Chrome extension for your desktop.


    Each server that you want to use Google Authenticator must have the Google Authenticator
    PAM module installed. FreeBSD has a pam_google_authenticator package, but most
    users will also want to install the libqprencode package. Debian includes the
    libpam-google-authenticator package, but it''s rarely current. No official package
    for CentOS exists, although as of this writing EPEL includes packages for CentOS
    6 and earlier. To use Google Authenticator on a current version of CentOS, or
    a Google Authenticator on Debian, you probably must install from source.


    Grab the current source code from https://github.com/google/google-authenticator,
    either with git(1) or by downloading and extracting the zip file. The libpam directory
    contains the Google Authenticator PAM module. Go into that directory to build
    and install the library.'
  - '[PAGE 131]


    # Chapter 9: One-Time Passwords: Google Authenticator


    ```

    # ./bootstrap.sh

    # ./configure

    # make

    # make install

    ```


    You now have the Google Authenticator PAM module and attendant programs available.


    # Google Authenticator User Features


    Many GA tutorials tell users to run google-authenticator and answer yes to all
    its questions. That way lies madness. A user who makes poor decisions can ruin
    their day and worse, annoy the helpdesk. Give your users very strict instructions
    on how to configure the client or, better still, script it for them.


    # Passcode Types


    GA supports two types of passcodes: time-based and counter-based.


    The time-based method combines the shared secret and the current time to create
    a temporary one-time password. These passcodes are good for only 30 seconds or
    so. The time-based one-time passwords are documented in RFC 6238.


    Counter-based passcodes compute a series of passcodes, each of which can be used
    only once. It''s a simple list, without any dependency on time. Counter-based
    passcodes are based on RFC 4226.


    Both methods require synchronization between server and device. Time-based passcodes
    require agreement between the clock on the device and that on the server. Counter-based
    passcodes require that the user avoid butt-dialing hundreds of passcodes during
    dinner. While I can conceive circumstances where counter-based passcodes make
    sense, out here in drafty reality I recommend time-based passcodes.'
  - '[PAGE 132]


    # Chapter 9: One-Time Passwords: Google Authenticator


    # File Management


    Google Authenticator uses the file $HOME/.google_authenticator to manage a user''s
    authentication settings and the current authentication state. (The sysadmin can
    change the file location, as we''ll discuss later.)nEven rate limiting takes place
    in this file.


    # Timing and Rate Limiting


    Intruders trying to gain access to authenticated services use brute force attacks,
    where they try hundreds or thousands of credentials a minute to see if any of
    them work. The odds of any set of credentials working is very low, but computers
    are incredibly patient and don''t mind trying every combination until something
    clicks. Every service needs rate limiting to choke this sort of attack from a
    torrent to a trickle. If your service has no other way of rate limiting, Google
    Authenticator can rate limit how many times a passcode can be used and how frequently
    a user can authenticate.


    GA suggests that you allow each passcode to be used only once. For some environments,
    this makes perfect sense. The Open Authentication (OATH) standard used by many
    organizations requires one-time-only passcodes.


    Some of us have looser security requirements and find one-time passcodes intolerable.
    If solving an urgent problem requires logging into a server and assessing its
    condition, I don''t want SSH session: I want three or four terminal windows, and
    I want them now. If I use GA to authenticate both SSH and sudo(1), and each passcode
    can be used only once, gaining privileged access takes longer.


    Even in an environment that doesn''t need OATH and has looser security requirements,
    if you''re using GA to allow access to an unencrypted service, allowing each passcode
    to be used only once makes complete sense. Choose the solution that meets your
    organization''s needs.'
- md: '

    # Chapter 9: One-Time Passwords: Google Authenticator


    Users can adjust clock sensitivity. Each time-based passcode is valid for 30 seconds.
    The GA PAM module permits a small amount of clock skew by default, treating the
    previous and next passcodes as valid. With properly synchronized clocks, the user''s
    passcode is good for about 90 seconds. The user can crank this up in her GA configuration
    file.


    Google Authenticator can also restrict the user to no more than three login attempts
    every 30 seconds. Power users and sysadmins will find this more palatable than
    permitting only one login. Allowing multiple login attempts violates OATH standards,
    though.


    All of these options are set in the user configuration program.


    # GA User Configuration


    To configure GA, each user needs a device with suitable software and a per-user
    configuration.


    # Device Software


    The official Google Authenticator software is available for many smartphones,
    tablets, and the Chrome browser. As the one-time passcodes are based on publicly
    available standards, though, people have written other applications that can act
    as GA clients. There''s a Firefox plug-in. Authy (https://www.authy.com) is one
    popular choice. Windows users might prefer WinAuth (https://winauth.com). Check
    around and find a client you like.


    The easiest way to configure a device requires a QR code reader. The Google Authenticator
    installer recommends one for your device if you don''t have one.


    My examples use the official Google Authenticator client. While my test equipment
    is a Chrome browser and a couple of Android devices, the official GA client should
    work identically on other platforms and operating systems.


    Install your chosen client on your device before proceeding.


    # User Configuration


    Before configuring PAM, log onto the server that''s going to use Google Authenticator.
    Run `google-authenticator` to create a configuration.


    ```

    $ google-authenticator

    ```


    The program asks a series of questions to determine how your account should authenticate.


    Do you want authentication tokens to be time-based (y/n) y


    Use time-based codes, as discussed earlier.


    The setup program immediately spits out a device configuration, including a secret
    key, a QR code, and a URL. It also offers five one-time codes. These codes and
    links are not yet permanent, however. Before making them permanent, use one of
    them to configure your device.


    If your server has the libqrcode library installed, `google-authenticator` displays
    a QR code. Using the QR code is the easiest way to get the shared secret on your
    phone. Capture the QR code on your device, and it automatically configures Google
    Authenticator for your device.


    If you''re using Chrome as your Google Authenticator device, copy the URL into
    the browser. You''re ready to go.


    If neither method works in your setting, `google-authenticator` also displays
    the shared secret, an annoying long string. Manually enter it into your device.


    With any of these three setup methods, your GA app should immediately begin displaying
    six-digit codes.


    Copy the secret and the emergency scratch codes to a safe location, preferably
    on paper. You might even print the QR code, write the server name on top of the
    page, and stuff it in a locked drawer. You''ll need the emergency and QR codes
    if you lose your device or things go terribly wrong, as discussed in “Device Theft”
    and “Disaster Recovery" later this chapter.


    Once your device knows the code, make it permanent by updating your device''s
    GA configuration file.


    Do you want me to update your "home/mwl/.google_authenticator" file (y/n) y


    Answer n, and the setup program discards all of the codes. Answer y, and your
    account is ready for GA.


    You then get three questions on how the user''s GA should behave. We discussed
    these options in “Google Authenticator User Features" earlier this chapter. Hopefully
    you decided how GA should behave before getting this far.


    Do you want to disallow multiple uses of the same authentication token? This restricts
    you to one login about 30s, but it increases your chances to notice or even prevent
    man-in-the-middle attacks (y/n) y


    Answering y means that users can authenticate only every 30 seconds. Answering
    n means that codes are reusable while valid.


    By default, tokens are good for 30 seconds and in order to compensate for possible
    time-skew between the client and the server, we allow an extra token before and
    after the current time. If you experience problems with poor time synchronization,
    you can increase the window from its default size of 1:30min to about 4min. Do
    you want to do so (y/n) y


    Answering y extends an individual lifespan. Answering n leaves it at the default.


    If the computer that you are logging into isn''t hardened against brute-force
    login attempts, you can enable rate-limiting for the authentication module. By
    default, this limits attackers to no more than 3 login attempts every 30s. Do
    you want to enable rate-limiting (y/n) y


    Answering y limits logon attempts to three every 30 seconds. Answering n disables
    rate limiting.


    # Scripting User Setup


    The Google Authenticator user setup process is simple. Surely your users can handle
    y, capturing a QR code, and typing a specific sequence of three y''s and n''s?
    Anyone who is a sysadmin more than a week knows the answer to this question “absolutely
    not.” If than a couple people will use a service protected by GA, script the configuration.


    ```

    #!/bin/sh

    printf ''y\ny\nn\nn\n'' | google-authenticator

    ```


    The \n is a return, or the ENTER key. The printf command spits out y-ENTER, y-ENTER,
    n-ENTER, n-ENTER, n-ENTER, and feeds them into google-authenticator. A user running
    this gets their QR code, URL, secret, and emergency scratch codes without making
    any decisions at all.


    If you run google-authenticator -h, you''ll get a list of command-line flags and
    options that let you pre-answer questions. Write your script however you like.


    If your organization is large enough, your script should probably hide all output
    other than the QR code, URL, and secret.


    # GA and PAM


    After configuring your account, you can run right to your service''s PAM configuration
    and activate pam_google_authenticator. (If you want to use GA with SSH, remember
    to review the SSH and PAM information in Chapter 0.)


    ```

    auth required pam_google_authenticator.so

    ```


    But if you have users other than yourself? Users need to log on to the host to
    configure GA, enabling GA locks them out. Bootstrap around this problem with the
    nullok. Users who lack a GA configuration can log in without one. Once a GA configuration
    exists, though, the user must enter the code to log in.


    ```

    auth required pam_google_authenticator.so nullok

    ```


    If you do this, have the system dump the user straight into the Google Authentication
    script. Otherwise, some of your users will never actually configure GA.


    # Central GA Management


    Enterprises with many servers almost certainly use a management tool such as Ansible
    or Puppet to hold their environments together. The organization''s sysadmins have
    much better things to do than nursemaid users, copy configuration files around,
    and restart services. Enterprise software must be centrally managed.


    The default Google Authenticator configuration assumes that users are trusted.
    Enterprise authentication systems do not trust users. Enterprise users can, say,
    change their passwords, but can''t be permitted to disable rate limiting. Google
    Authenticator can be used in these environments.

    '
