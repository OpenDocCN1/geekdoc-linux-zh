    ## 第 2 章：常用模块


    ## 允许与拒绝请求


    在构建 PAM 策略时，以明确的 *yes*（是）或 *no*（否）结束策略会有帮助。PAM 恰好包含了两个用于此目的模块。


    **pam_deny**


    有时候，你只需要说“不”。这就是 *pam_deny* 的作用。


    使用 *pam_deny* 来阻塞所有请求。通过将 *pam_deny* 放在策略的末尾，你声明之前未被允许的所有操作都是禁止的。


    在使用 sufficient（足够）控制语句时，*pam_deny* 模块尤为重要。sufficient 控制表示“通过这一项你就可以进入，只要没有其他人通过。如果这一项失败了，你可以尝试其他的。”如果一个请求到达了一系列
    sufficient 语句的结尾，且没有通过其中任何一个，但没有任何模块拒绝访问，那么在末尾添加 *pam_deny* 就能提供权威的拒绝。


    你还会在请求完全没有意义的地方看到 *pam_deny* 使用。CentOS 提供了指纹认证。Red Hat 的开发者认为“人的指纹不会改变”，因此他们坚决拒绝更改用户密码的尝试。


    ```

    password        required        pam_deny.so

    ```


    required 控制表示该模块必须返回成功才能授予请求。*pam_deny* 模块从不返回成功。此 PAM 配置阻止了所有更改用户指纹的尝试。


    **pam_permit**


    如果说 *pam_deny* 是直言不讳地拒绝一切的，那么 *pam_permit* 就是它的镜像双胞胎。像一个非常糟糕的谈判员，*pam_permit*
    对一切都说“好”。它没有选项，也没有可调的行为。


    某些服务需要使用 pam_permit 来显式允许访问。出于这个原因，你会看到许多程序在会话（session）策略中使用 pam_permit。


    ## 允许 Root


    PAM 允许你显式授予 root 账户无所不能的权限。pam_rootook 模块在用户是 root 时允许访问。


    我最常看到 pam_rootook 与 include（包含）语句一起使用。以下是 chfn1(1) 的 CentOS 7 PAM 配置。


    ```

    auth sufficient pam_rootook.so

    auth include system-auth

    account include system-auth

    password include system-auth

    session include system-auth

    ```


    整体来看，这意味着“root 始终可以运行此命令，或者根据系统认证允许运行其他命令”。


    Pam_rootook 仅对 auth 语句有效。


    ## 安全终端


    Unix 类系统认为某些终端比其他终端更安全。虽然 SSH 可能是一个安全协议，但 SSH 使用的虚拟终端本质上并不一定安全。物理控制台可能不在安全位置，但如果你有控制台访问权限，你就可以物理上修改机器，所以你大可以称它是安全的。如果这些串口端口连接到管理员桌上的本地终端，那么它们可能是安全的，但如果它们在调制解调器池中，就不那么安全了。如果机器及其控制台位于一个由严锁保护的房间内，那么物理终端就达到了最高安全性。


    通常，用户无法直接以 root 身份登录。他们需要以普通用户身份登录，然后通过 su(1) 变成 root。pam_securetty 模块允许直接以 root
    登录，且仅当用户在安全终端进行验证时允许。


    BSD 系统如果终端设备在 /etc/ttys 列表中的包含 **secure** 标志，则认为该终端设备是安全的。


    Linux 系统在 /etc/securesttys 中列出终端设备。Linux-PAM 的 pam_security 还允许在内核命令行列出的控制台设备上以
    **root** 登录，以及 /sys/class/tty/console/active 列出的控制台。Pam_security 的 **nconsole**
    选项禁用这些额外设备，将 **root** 登录限制在 /etc/securesttys 列出的设备上。


    ## 登录计数


    PAM 通过 pam_lastlog模块向用户计数系统提供信息。在 CentOS 和 Debian 上，用户计数位于 /var/log/lastlog，而
    FreeBSD 将其放在 /var/log/utx.lastlogin。它还会在用户登录时打印欢迎信息，告知他们上次登录的时间。


    Pam_lastlog 仅作为 session 语句的一部分起作用。


    Linux-PAM 支持多个选项来修改 pam_lastlog 的计数和登录行为。你可以使用 **nowtmp** 和 **noupdate** 等选项禁用某些计数功能。**noterm**
    和 **nohost** 等选项会从用户的登录消息中移除信息，而 **showfailed** 会显示上次有人登录此账户失败的时间。最后，**inactive**
    选项允许你设置账户因空闲被锁定之前的空闲天数。你可以设置天数，也可以使用默认的 90 天。


    ```

    session optional pam_lastlog.so showfailed inactive=5

    ```


    BSD 系统在其他地方处理这些功能，因此 OpenPAM 不支持这些特性。


    ## 防止登录


    无论你提前多久宣布维护窗口，无论提醒人们多少次，在你进行精细升级时，总会有人尝试使用系统。你可能希望系统处于多用户模式，但禁止系统管理员以外的任何人登录。或者你可能需要通过不让人们登录一段时间来解决管理问题。*pam_nologin*
    模块为你准备的。


    你可能认为可以通过关闭服务来实现类似的结果——如果 SSH 守护进程关闭，没有人能通过 SSH 登录你的主机！你也可以重新配置 SSH 仅允许 ssh 登录。*nologin*
    模块普遍禁止登录。它禁止除了特权用户列表之外的所有人的登录。Pamologin 检查 nologin* 文件是否存在——Linux-PAM 为 **/etc/nologin***，OpenPAM
    为 **/var/run/nologin***。如果 nologin* 文件不存在，用户可以登录。如果该文件存在，大多数用户将无法登录。Pamologin
    使用 nologin* 文件的内容作为应用程序的错误消息。用户能否看到完全取决于应用程序。


    ## 第 3 章：PAM 项目、代码和函数


    许多 PAM 文档假设系统管理员熟悉 PAM 的内部机制。设计者希望你理解每种类型的语句调用哪些函数，以及哪些内部项目和错误代码。配置 PAM 模块和 Linux-PAM
    扩展控制需要这些返回代码。


    你不需要记忆本章的所有内容。PAM 项目对于调试至关重要，你确实需要熟悉它们。然而，具体的 PAM 错误代码和函数对管理员来说没那么重要。研究涉及的原理以及这些代码的用途，当
    PAM 模块抛出代码时，你可以随时查询，并迅速熟悉这些错误。


    # PAM 项目


    PAM 通过一组定义的项目携带其大量的内部状态。使用 PAM 的进程定义所需项目并传递给不同的 PAM 栈。所有项目初始时都是未定义的。应用程序和框架设置这些项目。模块读取这些项目。


    '
