    # # Chapter 1: PAM Components


    Any PAM system handles the login and authentication process with several types
    of rules. We''ll start with the configuration files that contain the rules, then
    dive into the authentication components and the actions.


    # ## PAM Configuration Files


    You might find PAM configurations in the file `/etc/pam.conf`, or in a whole mess
    of files in the `/etc/pam.d/` directory.


    When Solaris spawned PAM back in the 1990s, a single configuration file suffic
    for the few services that used PAM. Each PAM rule statement started with the name
    of the service that rule applied. The rules for access to rlogind(8) started with
    `rsh`, the rules managing telnet access started with `telnet`, and so on. Solaris-derived
    systems still use a single `pam.conf`.


    PAM proved bindweed, though. Before long, the single configuration file constrained
    and complicated systems administration. Implementations like Linux-PAM and OpenPAM
    split PAM rules out into the `/etc/pam.d` directory, where each service had a
    file named after it. Instead of starting a rule with the word `login`, Linux-PAM
    and OpenPAM put the rules for rlogind(8) in `/etc/pam.d/rsh`, the rules for SSH
    access in `/etc/pam.d/sshd`, and so on.'
