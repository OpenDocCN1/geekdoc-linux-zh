    > "I recommend Absolute OpenBSD to all programmers and administrators working
    with the OpenBSD operating system (OS), or considering it.” — UnixReview'
  - '[PAGE 7]


    “Absolute OpenBSD by Michael Lucas is a broad and mostly gentle introduction into
    the world of the OpenBSD operating system. It is sufficiently complete and deep
    to give someone new to OpenBSD a solid footing for doing real work and the mental
    tools for further exploration... The potentially boring topic of systems administration
    is made very readable and even fun by the light tone Lucas uses.” — Chris Palmer,
    President, San Francisco OpenBSD Users Group


    # PGP & GPG


    “...The World’s first user-friendly book on email privacy...unless you’re a cryptographer,
    or never use email, you should read this book.” — Len Sassaman, CodeCon Founder


    “An excellent book that shows the end-user in an easy to read and often entertaining
    style just about everything they need to know effectively and properly use PGP
    and OpenPGP” — Slashdot


    PGP & GPG is another excellent book by Michael Lucas. I thoroughly enjoyed his
    other books de to their content and style. PGP & GPG continues in this fine tradition.
    If you are trying to learn how to use PGP or GPG, or at least want to ensure you
    are using them properly, read PGP & GPG.” — TaoSecurity


    # Tarsnap Mastery


    “If you use any nix-system, and need offsite backups, then you need Tarsnap. If
    you want to use Tarsnap efficiently, you need Tarsnap Mastery.” —Sunday Morning
    Linux Review episode 148


    “This book is a great way to feel confident about backing up your data securely
    in cloud or through off-site backups, without compromising security or burning
    your pocket with enterprise grade products from IT vendors.” — Wendy Michele,
    nixCraft'
