    # FreeBSD Mastery: Storage Essentials


    “If you’re a FreeBSD (or Linux, Unix) sysadmin, then you need this book; it has
    a lot of hard-won knowledge, and will save your butt more than you’ll be comfortable
    admitting. If you''ve read anything else by Lucas, you also know we need him writing
    more books. Do the right thing and buy this now.” — Slashdot


    “There’s plenty of GEOM, GELI, GDBE, and the other technologies specific to FreeBSD.
    If one did not know how GEOM worked, with its consumer/producer model – and I
    imagine complex to dive into when you’ve got a broken machine next to you. You
    are administering FreeBSD systems, especially ones that deal with dedicated storage,
    will you find this useful.” — DragonFlyBSD Digest


    # Absolute FreeBSD, 2nd Edition


    “I am happy to say that Michael Lucas is probably the best system administration
    author I’ve read. I am amazed that he can communicate top-notch content with a
    sense of humor, while not offending the reader or sounding stupid. When was the
    last time you could feel yourself smarter while reading a book? If you are a beginning
    to average FreeBSD user, Absolute FreeBSD 2nd Ed (AF2E) will deliver that sensation
    in spades. Even more advanced users will find plenty to enjoy.” — Richard Bijchtlich,
    CSO, MANDIANT, and TaoSecurity blogger


    “Master practitioner Lucas organizes features and functions to make sense in the
    development environment, and provides aid and comfort to new users, novices, and
    those with significant experience alike.” — SciTech Book News'
