    their problem some other way.


    But if you really want to play with your organization’s security policy, you need
    add-on PAM modules.'
  - '[PAGE 122]


    # Chapter 8: SSH Agent Authentication


    Most sysadmins manage hosts with Secure Shell (SSH). The majority of SSH authentication
    happens with public keys rather than with passwords. If you''re using an SSH agent,
    you can tell PAM to use the agent as an authentication source with the pam_ssh_agent_auth.


    Pam_ssh_agent_auth (https://sourceforge.net/projects/pamsshagentauth/) works the
    same as SSH key-based authentication. The module grabs the user''s authorized_keys
    file and asks the user''s SSH agent if it has the matching private key. If the
    SSH agent has the private key, the module returns PAM_SUCCESS. Pam_ssh_agent_auth
    is designed to authenticate sudo(1), so that''s how we use it.


    Authenticating against a user''s SSH key is a kludgy knock-off of multi-factor
    authentication. It proves that the user has the key file and the passphrase to
    decrypt it. A key file is not a physical thing, of course. It can be copied and
    moved between machines. But it''s slightly better than a plain password alone.
    For real two-factor authentication, you want something like Google Authenticator
    (Chapter 9) or invest in security tokens. On the other hand, SSH agent authentication
    lets you avoid typing a password on your servers.


    Many organizations have legitimate reasons why they don''t use SSH agents, or
    reasons why they don''t authenticate programs in this manner. Compromising a user''s
    SSH client can lead to server compromise. That''s a valid objection in many environments.
    But pam_ssh_agent_auth is one of the simpler add-on PAM modules, so it''s a good
    place to start exploring.'
  - '[PAGE 123]


    # Chapter 8: SSH Agent Authentication


    This module only works when your environment has a connection to an SSH agent.
    If you log in over a serial line, pam_ssh_agent_auth won''t reach across the serial
    line onto your desktop and query your SSH agent. Even if you want to deploy pam_ssh_agent_auth
    every-where, be sure you have alternate authentication methods for disaster recovery.


    # Installing pam_ssh_agent_auth


    CentOS-based and FreeBSD systems offer a pam_ssh_agent_auth package. Debian has
    a pam-ssh-agent-auth package (as I write this, in the experimental repository).


    If your operating system doesn''t offer a package, download and compile it from
    the project page.


    # Configuring pam_ssh_agent_auth


    All pam_ssh_agent_auth configuration takes place in the PAM configuration file.
    The biggest issue is finding the user''s authorized_keys file, but you''ll also
    have debugging and permissions options.


    # Locating authorized_keys


    The file argument tells pam_ssh_agent_auth where to find the user''s authorized_keys
    file. The simplest configuration points the module at the authorized_keys file
    in the user''s home directory.


    ```

    auth sufficient pam_ssh_agent_auth.so \

    file=/.ssh/authorized_keys

    ```


    The tilde character (-) expands to the user''s home directory. You can also use
    %h to represent the user''s home directory.


    For more complicated setups, especially ones where you share PAM configurations
    across multiple hosts, you could use %H to represent the short hostname, %u to
    represent the user, or %f for the complete hostname. These come in more when centrally
    managing key'
  - '[PAGE 124]


    # Chapter 8: SSH Agent Authentication


    files, as is common in many large-scale deployments. Configurations like these
    are very common.


    ```

    auth sufficient pam_ssh_agent_auth.so \

    file=/etc/ssh/keys/%u

    ```


    Each user''s public key file is named after their username, in the directory /etc/ssh/keys.
    My key file would thus be /etc/ssh/keys/mwl. Here the sysadmin team has a a central
    configuration server, something like Ansible or Puppet, and distributes the keys
    to hundreds of servers with a single command. Users cannot update their authorized_keys
    files.


    Some hosts don''t keep the key files on the machine, but in a central repository
    such as LDAP. These hosts run a command to retrieve a user''s key. Rather than
    using the file argument, use the authorized_keys_command argument and the path
    to the command.


    ```

    auth sufficient pam_ssh_agent_auth.so \

    authorized_keys_command=/bin/getkeys.sh

    ```


    The command to fetch a user''s key file runs with a single argument, Pam_ssh_agent_auth
    normally uses the user that''s trying to authenticate. If you want to always add
    the authorized_keys_command_user option and the desired user.


    ```

    auth sufficient pam_ssh_agent_auth.so \

    authorized_keys_command=/bin/getkeys.sh \

    authorized_keys_command_user=sysadmins

    ```


    These options should let you put your key files anywhere that fits your environment.'
  - '[PAGE 125]


    # Chapter 8: SSH Agent Authentication


    # Key File Ownership


    Pam_ssh_agent_auth assumes that key files in a user’s directory should be owned
    by the user. Key files that are not in the user''s home directory should be owned
    by `root`. It''s possible that you might allow a user to edit their own key file
    in a central repository like `/etc/ssh/keys`, but it''s so uncommon that you need
    to tell pam_ssh_agent_auth about it with the `allow_user_owned_authorized_keys_file`
    option.


    # Other Options


    If you have trouble with pam_ssh_agent_auth, definitely try the ever-popular debug
    option. The module will log its progress to the system''s secure authentication
    log.


    Pam_ssh_agent_auth expects to be used with `sudo(1)`. If you compiled `sudo` to
    use a non-standard PAM service name, tell the module about it with the `sudo_service_name`
    option, an equals sign, and the service name you chose.


    # Configuring sudo


    The sudo(1) program purges the user''s environment before assuming any privileges.
    Pam_ssh_agent_auth uses the SSH_AUTH_SOCK environment variable to find the user''s
    SSH agent. Depending on your version of sudo, you might need to configure sudo(1)
    to leave the SSH_AUTH_SOCK environment variable in place. The following sudoers
    entry accomplishes this.


    ```

    Defaults env_keep += "SSH_AUTH_SOCK"

    ```


    As I write this, CentOS does not require this setting, while Debian and FreeBSD
    do.'
- md: '

    # Pam_ssh_agent_auth and PAM


    So, how do you use this thing? Find your system''s PAM configuration for sudo(1).
    In most Linux systems it''ll be in /etc/pam.d/sudo, while FreeBSD will stick it
    in /usr/local/etc/pam.d/sudo.


    Now the hard part: decide how you want to use the module. Would you like SSH agent
    authentication to be sufficient to get sudo access? Put the module at the top
    of the auth policy and use the sufficient control.


    You want to require both an SSH agent and a password? Stick pam_ssh_agent_auth
    somewhere before the final pam_deny.so and use the required control.


    Let''s look at a slightly more multi-factor authentication method now.


    # Chapter 9: One-Time Passwords: Google Authenticator


    A one-time password is a password that works only once. We''ve had many one-time
    password implementations, from One-Time Passwords in Everything (OPIE) to RSA
    tokens. The Time-Based One-Time Passwords system, or TOTP, uses the system clock
    and a shared secret to compute a valid password on demand. The best known TOTP
    implementation is Google Authenticator.


    Google Authenticator does not require access to Google. The reason it''s called
    *Google Authenticator* is because Google provides the software, not because it
    hooks into Google''s systems in any way. GA works fine on machines not even connected
    to the Internet.


    Google Authenticator transforms your smartphone, tablet, or Chrome browser into
    an authentication token, using a client-side app and the Google Authenticator
    PAM module. When you attempt to access a service using Google Authenticator, the
    PAM module computes a six-digit passcode as a temporary one-time password. The
    server prompts you for this passcode. Your device computes the current correct
    passcode for this host, using the same method. Enter the passcode your device
    offers into the application. If both devices made the same computation, the passcodes
    match and you get access.


    Google Authenticator is a better multi-factor authentication method than using
    your SSH agent, but it''s not perfect. Any tablet, smart-phone, or Chrome browser
    can become an authentication token. If the bad guys capture any of your devices,
    or steal the shared secret used to configure the client app, they have your authentication
    token. But at least the devices are physical objects, not a file that intruders
    can easily copy.¹¹¹⁷


    Every host using GA has a separate GA configuration and a unique shared secret.
    Each user must log on to each host that she''s supposed to access and configure
    her GA access. Google Authenticator, by itself, is best suited to environments
    with only a few servers and a few accounts. You wouldn''t want to have a host
    with several thousand accounts using plain Google Authenticator unless you dedicate
    staff time to managing authentication. You can share a GA configuration between
    hosts, as we''ll discuss later, but this alters GA''s security profile and requires
    additional scripting and configuration. We''ll start with the simplest case, setting
    up GA on a single host.


    Before even starting with Google Authenticator, check the clocks and time zones
    on your hosts. Google Authenticator works best on servers with clocks synchronized
    to the rest of the world. System clocks often skew away from real time, especially
    on virtual machines. Use ntpd(8) or another time-keeping service to nail your
    servers'' clocks to everyone else''s. If GA inexplicably fails, double-check everything''s
    clock and time zone.


    Only use Google Authenticator with auth policies. It provides no services to the
    account, session, or password types.


    > ¹⁷ Unless you backup the shared secret in a place intruders can steal it from.
    Don''t do that.


    Google Authenticator works almost everywhere; it has no environmental requirements
    like pam_ssh_agent_auth. I encourage you to think carefully before applying it
    to all system authentication, however. What happens when the server''s time gets
    drunk and skews wildly? If you require GA to log in at the console, fixing the
    problem will require getting into single user mode, probably via a reboot. Do
    you have enough redundancy to handle that? Also, Google Authenticator has built-in
    login rate limiting. If you require GA for both SSH and sudo, you''ll faceplant
    straight into that rate limiting.


    Carefully consider the implications of your deployment decisions.


    # Installing Google Authenticator


    The Google Authenticator client is easy. Grab your app from the device''s app
    store, or install the Authenticator Chrome extension for your desktop.


    Each server that you want to use Google Authenticator must have the Google Authenticator
    PAM module installed. FreeBSD has a pam_google_authenticator package, but most
    users will also want to install the libqprencode package. Debian includes the
    libpam-google-authenticator package, but it''s rarely current. No official package
    for CentOS exists, although as of this writing EPEL includes packages for CentOS
    6 and earlier. To use Google Authenticator on a current version of CentOS, or
    a Google Authenticator on Debian, you probably must install from source.


    Grab the current source code from https://github.com/google/google-authenticator,
    either with git(1) or by downloading and extracting the zip file. The libpam directory
    contains the Google Authenticator PAM module. Go into that directory to build
    and install the library.


    ```

    # ./bootstrap.sh

    # ./configure

    # make

    # make install

    ```


    You now have the Google Authenticator PAM module available.


    # Google Authenticator User Features


    Many GA tutorials tell users to run google-authenticator and answer yes. A user
    makes poor decisions can ruin their day. Give your users very strict instructions
    on how to configure


    # Passcode Types


    GA supports two types of passcodes: time-based and counter-based.


    The time-based method combines the shared secret and the current time to create
    a temporary one-time password. These passcodes are good for only 30 seconds or.
    The time-based one-time passwords are documented in RFC 6238.


    Counter-based passcodes compute a series of passcodes, each of which can be used
    only once. Counter-based passwords are based on RFC 4226.


    Both methods require synchronization between server and device. Time-based passcodes
    require agreement between the clock on the device and that on the server. Counter-based
    passcodes require that the user avoid butt-dialing hundreds of passcodes. While
    I can conceive circumstances where counter-based passcodes make sense, out here
    in reality I recommend time-based.


    # File Management


    Google Authenticator uses the file $HOME/.google_authenticator to manage a user''s
    authentication settings and the current authentication state. (The sysadmin can
    change the file location, as we''ll discuss later.)


    Even rate limiting takes place in this file.


    # Timing and Rate Limiting


    Intruders trying to gain access to authenticated services use brute force attacks,
    where they try hundreds or thousands of credentials a minute to see if any of
    them work. The odds of any set of credentials working is very low, but computers
    are incredibly patient and don''t mind trying every combination until something
    clicks. Every service needs rate limiting to choke this sort of attack from a
    torrent to a trickle. If your service has no other way of rate limiting, Google
    Authenticator can rate limit how many times a passcode can be used and how frequently
    a user can authenticate.

    '
