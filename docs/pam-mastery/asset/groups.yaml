    # 第 0 章：引言


    虽然操作系统厂商可以协调它们的 PAM 配置并设计出一套每个系统管理员都能识别并使用的方案，但很可能没人会那样做。相反，每个开源平台都欢迎其他操作系统打包者来拷贝他们显然更优越的设计。因此，每个平台的
    PAM 配置方式都各不相同。


    当你首次深入研究一个操作系统的 PAM 设置时，请花时间理解这些打包者是如何组装一切的。你很容易假设那些为一个陌生的操作系统设计 PAM 策略的人是疯了。这种想法虽然容易，但会适得其反。请研究这些陌生的配置，并弄清楚它们为什么要这样组合在一起。你不仅将理解
    PAM 的实现方式，还能洞察到操作系统打包者的思考方式——而这种洞察将帮助你掌握该系统的其余部分。


    第 10 章阐述了我们的三个参考平台如何以完全不同的方式使用同一个 PAM 模块，而这些方式的原因对于操作系统打包者来说是完全合乎逻辑的。


    # PAM 的共性


    所有这些不同的实现都共享相同的结构和配置语法。也许你最初不会理解为什么 Debian 将一条“拒绝认证”的规则放在系统级配置的顶部，但你将理解策略的语法并能够推导出其含义。大多数
    PAM 实现共享常见的模块名称，我将注明少数例外。


    每个实现和操作系统都拥有的共同点是：它们都有 Bug。长久标准的 `pam_mkhomedir` 模块在 CentOS 上频繁出问题。（红帽对此有其理由，第
    6 章展示了如何绕过它。）


    配置选项 `use_first_pass` 和 `try_first_pass` 在 FreeBSD 的 `pam_unix` 上会失效。请务必阅读操作系统的文档，如果某些地方看起来很奇怪，请检查邮件列表存档和讨论板，看看其他人是否遇到了相同的问题。如果你真正理解了你所喜欢的
    PAM 实现中的众多 Bug，你就不会觉得其他版本的 Bug 很好笑了。


    # PAM 管理工具


    某些 Linux 发行版提供了管理 PAM 的工具。这些工具允许你在不编辑那些糟糕的配置文件的情况下更改认证方法。它们适用于许多简单部署场景。但如果你想弄清楚为什么你的系统会以特定方式运行，或者你想做一些复杂的操作，这些工具会将你限制在工具作者想象的场景中。而理解异常行为绝对需要理解规则是如何工作的，无论是作为独立语句还是作为策略的组件。


    这些附加工具会覆盖现有的 PAM 配置。你必须学会强制这些工具创建所需的配置，要么放弃它们并手动管理认证。无论哪种情况，理解配置都能让你成为更出色的系统管理员。


    # 目标平台


    本书主要涵盖在普通 Linux 和 BSD 版本中部署的 PAM。关于 PAM 如何处理策略的材料也适用于 Oracle Solaris、基于 OpenSolaris
    的派生系统、OS X 以及专有的 UNIX 系统，但这些系统使用了完全不同的核心 PAM 模块。你可以将我讨论的许多 PAM 模块添加到这些系统中，但你必须仔细研究配置文件。


    我特别针对三个具有不同配置风格的操作系统：CentOS、Debian 和 FreeBSD。


    # CentOS


    CentOS 是 Linux 中红帽 Linux 分支的代表。本书使用 CentOS 而不是官方的 Red Hat Linux，是因为 CentOS 是免费的，而且我很小气。CentOS
    使用 Linux-PAM。许多 Linux 发行版都是基于 Red Hat Linux 构建的，它们的衍生版本应该能够使用 CentOS 的 PAM 配置。


    此处涵盖的一些 PAM 模块位于 EPEL 仓库中。要使用这些模块，你需要启用该仓库、构建自己的包或进行其他安排。


    CentOS 和相关的 Linux 发行版提供了一个配置 PAM 的命令行工具 `authconfig(8)`。


    # Debian


    Linux 的 Debian 分支的设计哲学与红帽 Linux 分支不同。它支持许多相同的软件，但管理界面几乎完全不同。Debian 使用 Linux-PAM。许多
    Linux 发行版（如 Ubuntu 和 Kali Linux）基于 Debian 构建，可以使用 Debian 配置。


    书中讨论的一些 PAM 模块位于实验仓库中。你需要启用该仓库或构建自己的包。


    与 CentOS 类似，Debian 包含一个为你编写 PAM 配置文件的附加工具。与 CentOS 不同，Debian 使用 `pam-auth-update(8)`，这是一个
    Debian 人员专门为 Debian 编写的。


    # FreeBSD


    FreeBSD 是我们的 OpenPAM 参考平台。支持 PAM 的 BSD 平台（如 Dragonfly 和 NetBSD）以及苹果的 OS X 使用 OpenPAM。在
    FreeBSD 上有效的配置应该可以在 OS X 之外的任何 BSD 平台上运行。（OS X 使用的 PAM 模块与其他任何 OpenPAM 实现完全不同，使其在几乎所有情况下都是特例。）


    少数 Linux 发行版使用 OpenPAM，或者允许轻松将其 PAM 实现替换为其他。你将像配置任何其他 PAM 实现一样配置这些操作系统，但你可能会发现某些
    PAM 模块名称略有不同。如果你在使用带有 OpenPAM 的 Linux 发行并在寻找模块时感到困惑，请检查 CentOS 或 Debian 的示例以找到
    Linux 社区给模块分配名称。


    # 其他平台


    PAM 可能不是一个单一的标准，但其配置的基础在各个实现中是通用的。管理 Solaris 派生版或 OS X 的系统管理员可以使用这里的指南创建自己的 PAM
    配置。


    关于附加 PAM 模块（如 Google Authenticator 或 SSH 代理认证）许多指南适用于适用于平台。配置密码质量检查器的细节在不同操作系统之间差异不大，即使该模块在策略中的放置位置有所不同。


    # PAM 和 OpenSSH


    OpenSSH 的服务器 `sshd(8)` 并不真正需要 PAM。SSH 认证的行业标准方法——密钥并不符合 PAM。SSH 服务器确实需要检查密码，这在过程的某处确实涉及到
    PAM，但它是一个非常简单的检查。如果你使用单因素认证，简单的密码检查就足够了。


    但如果你想实现复杂的基于 PAM 的认证，可以通过让 `sshd(8)` 链接到 PAM。将 `ssh_config` 中的 `UsePAM` 选项设置为
    `yes`。这启用了基于 PAM 的账户检查、自动主目录创建等。然而，它不会触发基于 PAM 的认证。


    SSH 守护进程处理键盘认证有两个选项。一个 `PasswordAuthentication` 是专门用于密码的；另一个 `ChallengeResponseAuthentication`
    是一种更通用的认证机制。为了使用 PAM，你几乎肯定需要 `ChallengeResponseAuthentication`。


    UsePAM yes


    ChallengeResponseAuthentication yes


    PasswordAuthentication no


    控制和串口登录尝试使用 `login(8)` 程序，它有自己的 PAM 策略。SSH 服务器可以通过 `UseLogin` 选项将用户登录过程的一部分交给
    `login(8)`。该选项通常为 `no`。`login(8)` 和 `sshd(8)` 策略之间的交互极其有趣或令人愤怒，取决于你是否是那个需要让它们运行的人。为了使用
    PAM，最好让 SSH 服务器处理登录，而不是调用 `login(8)`。


    Login no


    此外，让 `sshd(8)` 咨询 PAM 进行认证。为此，你需要 `ssh_config` 中的 `AuthenticationMethods` 选项。`keyboard-interactive`
    设置告诉 sshd 将认证传递给其他代理（如 PAM）。如果你激活了 PAM 并告诉 `sshd(8)` 使用键盘交互认证，你将获得基于 PAM 的认证以及账户管理。


