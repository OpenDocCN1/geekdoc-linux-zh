    You can fine-tune some of these behaviors. We''ll start by establishing minimum
    requirements, move on to the credits system, and then cover other configuration
    options can go either in a PAM statement, or in /etc/security/pwquality.conf.


    # Setting Password Requirements


    You can set restrictions on the user''s password by setting a minimum length,
    the number of character classes needed, and the minimum number of each class of
    characters.


    The minlen option sets the minimum length of the password. Increasing the minimum
    length is easy, but pam_pwquality has hard-coded lower limits. The minimum effective
    password length on any system is probably six, but this might be reduced to four
    by recompiling. The default is eight.


    The class option sets a minimum number of character classes that must be in the
    password.


    Set the minimum number of digits in a password with the dcredit option. The ucredit
    option specifies the minimum number of uppercase case letters, while lcredit sets
    the minimum number of lower case letters. Finally, ocredit sets a minimum number
    of other characters. Specify minimum numbers as negative numbers—positive values
    mean you''re using the credits system. Here''m putting specific requirements on
    user passwords. For clarity, I''ve omitted the usual retry statements and such.
    You''d certainly want to include them in production.


    ```

    password requisite pam_pwquality.so minlen=8 min=3 dcredit=-2 ucredit=-2 lcredit=-2

    ```


    This statement requires the user to have at least two digits, lowercase letters,
    two upper-case letters, and two other characters. The minimum length is eight.
