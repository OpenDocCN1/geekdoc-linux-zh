    # Chapter 7: Arbitrary Files and Random Programs


    The Unix model of group membership has limits. If your environment uses cross-platform
    NFS, for example, a single user can be a member of only 16 groups. You might want
    to delegate managing a group to a particular user, but most Unix-like systems
    don''t give you that capability. (Solaris'' capabilities system comes close.)
    Sometimes, you want PAM to just read a list of users that are allowed to access
    a service.


    Similarly, you might want the login process to run a program as part of a PAM
    process. This might be part of an NIS configuration, or related to your firewall,
    or a component of your custom application.


    You can use PAM modules for both of these. We''ll start with Linux-PAM’s pam_listfile.


    # Checking Files: pam_listfile


    Traditional Unix systems included per-application lists of permitted or prohibited
    users. The classic example is /etc/ftpusers, which listed users forbidden to use
    FTP. If you tried to use FTP as, say, root or operator, the FTP daemon checked
    this file and kicked you out.


    Linux-PAM’s pam_listfile tells PAM to read a file containing a list, and permit
    or reject access based on that list. You can permit or deny access based on the
    username or group, but also on the terminal device, the remote host or remote
    user, or the shell.'
  - '[PAGE 109]


    # Chapter 7: Arbitrary Files and Random Programs


    A typical use of pam_listfile looks like this.


    auth required pam_listfile.so item=user sense=deny \

    file=/etc/ftpusers onerr=succeed


    This is part of the auth policy. We set this example to be required,

    but it could sensibly requisite or sufficient. (Making a pam_listfile

    configuration optional would be kind of weird, yet I''m not going to

    say it would never be appropriate.)


    The item is what you''re looking for in the list. In this case, we''re

    checking the username. You can check shells, terminals, and more.


    The sense is how pam_listfile should respond if an item is in the

    file. Here, we tell pam_listfile to deny the request if the username is in

    the file.


    Pam_listfile needs to know the file to check.


    Finally, we say how pam_listfile should behave if it has an unex-

    pected error, with the onerr setting. This isn''t an error like "the user

    isn''t in the file," but rather "the file is unreadable" or "the kernel told

    to bug off?" Here, we tell pam_listfile to return success if it has an

    error.


    This example implements the traditional /etc/ftpusers function-

    ality. A username list in the file may not authenticate to this service.


    Let''s look at each part of this separately.


