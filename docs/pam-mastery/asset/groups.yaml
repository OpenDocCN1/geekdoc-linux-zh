- md: "\n# Chapter 1: PAM Components\n\nThe second auth module, pam_opieaccess, has\
    \ the requisite control. If this module returns success, access is allowed. If\
    \ the module returns failure, though, PAM immediately stops processing the policy\
    \ and returns failure. It’s a hard yes/no decision.\n\nThe last module in the\
    \ auth policy, pam_unix, is required. If the module returns success, access is\
    \ allowed. If the module returns failure, access is denied.\n\nTaken as a whole,\
    \ the auth policy could be processed in a couple ways. If the first, sufficient\
    \ module succeeds, access is immediately allowed. If it fails, processing falls\
    \ through to the next two rules in the policy. Both of these must return success\
    \ for access to be permitted. A failure in either of the last two modules denies\
    \ access.\n\nIn most deployments, policies weigh rejection more heavily than permitting\
    \ access. Most control types have veto power, letting them deny access even if\
    \ later statements in the policy say yes.\n\nAs you can see, PAM policy processing\
    \ differs from the usual allow/deny syntax of your average access control list.\
    \ Thinking of PAM policies as resembling firewall rules will cause you pain. PAM\
    \ uses its special language to make that clear.\n\nNow that you understand some\
    \ basics of how PAM works, let’s look at a few common modules and see how they’re\
    \ configured.\n\n# Chapter 2: Common Modules\n\nWhile Linux-PAM and OpenPAM were\
    \ separately implemented, their developers used Solaris PAM as a model. Both include\
    \ many modules similar in concept to those in older versions of Solaris.\n\nThis\
    \ chapter takes you through many of those common modules, how they work, and what\
    \ you can do with them. Many of these are very small and provide only a single\
    \ function, but I cover them briefly so that you start to understand how PAM glues\
    \ together all the disparate Unix authentication functions.\n\nLet's start with\
    \ a class you'll see everywhere.\n\n# Core Unix Authentication: pam_unix\n\nThe\
    \ pam_unix module handles all interactions with the system password file, /etc/passwd,\
    \ and related files like /etc/group, /etc/master.passwd, /etc/shadow, and so on.\
    \ It also supports Network Information Service (NIS), the traditional means of\
    \ managing distributed authentication. A host not using a centralized authentication\
    \ system like LDAP or Kerberos almost certainly uses pam_unix. Even hosts that\
    \ use centralized authentication often use pam_unix to look up unprivileged accounts\
    \ for local applications.\n\nThe auth, account, and password PAM types use pam_unix.\
    \ It's not used for the session type.\n\nPassword authentication predates PAM\
    \ by decades. The pam_unix module has the undeniable duty of lugging around all\
    \ years of accumulated functionality, controlled by various option flags.\n\n\
    # Detailed Logging with audit\n\nThe audit option is a more detailed and verbose\
    \ version of the debug option. It sends very detailed logging to syslog, using\
    \ facility auth and priority debug.\n\nDepending on the operating system, the\
    \ version of PAM, and the server program, the audit log might not contain much\
    \ useful information. The OpenSSH server, for example, doesn't necessarily use\
    \ PAM at all.\n\n# Empty Passwords\n\nThe general rule with authentication is:\
    \ no password, no access. Accounts without passwords are not generally meant to\
