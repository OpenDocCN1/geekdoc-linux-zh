    The die action tells PAM that the authentication request has failed, and it must
    immediately stop processing the policy. Modules that follow this one will not
    get processed. When a reply triggers die, the PAM policy behaves as if a requisite
    module failed.


    The ok action tells PAM that the authentication request was successful. Access
    is allowed, provided no other module objects. It normally applied to the PAM_SUCCESS
    return code. An ok cannot override a bad response from elsewhere in the PAM policy.
    When a reply triggers ok, the PAM policy behaves like a required module succeeded.


    The done action tells PAM that the authentication request was successful, and
    that PAM should immediately stop processing the policy. If nothing earlier in
    the policy returned bad, the policy permits access. When a reply triggers done,
    the PAM policy behaves like a sufficient module succeeded.


    The ignore action indicates that this response doesn''t alter the policy''s response.
    An earlier bad or ok stands. The module can still carry out other actions, such
    as logging or running unrelated commands, but PAM doesn''t let the results of
    the module''s work or checks its decision on. It''s like the most common case
    of the optional control.


    The reset action tells PAM to throw away any previous bad or ok results and keep
    a new success or failure from the remaining modules. It''s unique to Linux-PAM.
    As with the binding control, I''ve never seen reset deployed in production.


    Last, you can specify a number as an action. Triggering the number tells Linux-PAM
    to skip that many following modules in the policy. A number is most often used
    with the pam_success_if module, as discussed in Chapter 5.'
  - '[PAGE 85]


    # Chapter 4: Linux-PAM Extended Controls and Substacks


    # Standard Controls in Extended Format


    Each of the standard PAM controls can be expressed in the Linux-PAM extended control
    format. Understanding these can improve your understanding of both the extended
    controls and the traditional controls.


    The required control can be expressed like so.


    ```

    [success=ok new_authtok_reqd=ok ignore=ignore default=bad]

    ```


    If the PAM module returns PAM_SUCCESS or PAM_NEW_AUTHTOK_REQD, this control takes
    the ok action. Authentication is successful. If the module returns PAM_IGNORE,
    PAM ignores the module. If the module returns anything else, the bad action is
    taken and authentication fails.


    A requisite control looks very similar.


    ```

    [success=ok new_authtok_reqd=ok ignore=ignore default=die]

    ```


    The only difference between requisite and required is the default action. Where
    a required control fails to bad, a requisite control defaults to die. If a module
    with this control fails, access is rejected and processing stops immediately.


    Sufficient controls look entirely different.


    ```

    [success=done new_authtok_reqd=done default=ignore]

    ```


    If the module returns PAM_SUCCESS or PAM_NEW_AUTHTOK_REQD, the policy immediately
    permits access. Thanks to the done action, no further processing happens. Any
    other response doesn''t affect the policy''s voting, although the module might
    take other action on the system.


    The optional control resembles sufficient.


    ```

    [success=ok new_authtok_reqd=ok default=ignore]

    ```'
  - "[PAGE 86]\n\n# Chapter 4: Linux-PAM Extended Controls and Subtasks\n\nHere, a\
    \ PAM_SUCCESS or PAM_NEW_AUTHTOK_REQD gets this module to say ok and permit access.\
