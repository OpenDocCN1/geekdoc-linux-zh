    # PAM Mastery


    Michael W Lucas


    ![](img/889d57d001fa731b3995673e1877e197_0_0.png)


    # Praise for other books by Michael W Lucas


    FreeBSD Mastery: ZFS


    “Once again, a great FreeBSD book to read.” — Wendy Michele, nixCraft


    “ZFS Mastery covers what everyone using or administering these filesystems needs
    to know to work with every day. It’s a fascinating to see how the system is used,
    having seen it how it is implemented.” — George V. Neville-Neil, co-author of
    “Design and Implementation of the FreeBSD Operating System”


    # Networking for Systems Administrators


    “There is a lot of useful information packed into this book. I recommend it!”
    — Sunday Morning Linux Review, episode 145


    After reading this book, you’ll have a strong footing in networking. Lucas explains
    concepts in practical ways; he makes sure to teach tools in both Unix/Linux and
    Windows; and he gives you the terms you’ll use to explain what you’re seeing to
    the network folks. Along the way there’s a lot of hard-won knowledge sprinkled
    throughout…” — Slashdot


    # FreeBSD Mastery: Specialty Filesystems


    “a joy and treasure to read” — Vivek Gite, nixCraft


    “I’m a fan of his books… he presents them in a way that makes them much more understandable.
    He has the right mix of humor and information.” — Sunday Morning Linux Review


    # Sudo Mastery


    “It’s awesome, it’s Lucas, it’s sudo. Buy it now.” — Slashdot


    “Michael W Lucas has always been one of my favorite authors because he brings
    exceptional narrative to information that has the potential to be rather boring.
    Sudo Mastery is no exception.” — Chris Sanders, author of Practical Packet Analysis


    # Absolute OpenBSD, 2nd Edition


    “Michael Lucas has done it again.” — cryptednets.org


    “After 13 years of using OpenBSD, I learned something new and useful!” — Peter
    Hessler, OpenBSD Journal


    “This is a truly excellent book. It’s full of essential material on OpenBSD presented
    with a sense of humor and an obvious deep knowledge of how this OS works. If you’re
    coming to this book from a Unix background of any kind, you’re going to find what
    you need to quickly become fluent in OpenBSD – both how it works and how to manage
    it with expertise. I doubt that a better book on OpenBSD could be written.” —
    Sandra Henry-Stocker, ITWorld.com


    “It quickly becomes clear that Michael actually uses OpenBSD and is not a hired
    gun with a word count to satisfy... In short, this is not a drive-by book and
    you will not find any hand waving.” — Michael Dexter, callfortesting.org


    # DNSSEC Mastery


    “When Michael descends on a topic and produces a book, you can expect the result
    to contain loads of useful information, presented along with humor and real-life
    anecdotes so you will want to explore the topic in depth on your own systems.”
    — Peter Hansteen, author of The Book of PF


    # SSH Mastery


    “...one of those technical books that you wouldn’t keep on your bookshelf. It’s
    one of the books that will have its bindings bent, and many pages bookmarked sitting
    near the keyboard.” — Steven K Hicks, SKH:TEC


    “...SSH Mastery is a title that Unix users and system administrators like myself
    will want to keep within reach...” — Peter Hansteen, author of The Book of PF


    “This stripping-down of the usual tech-book explanations gives it the immediacy
    of extended documentation on the Internet. Not the multipage page-how-to articles
    used as vehicles for advertising, but an in-depth presentation from someone used
    OpenSSH to a number of things, and paid attention while doing it.” — DragonFlyBSD
    Digest


    # Network Flow Analysis


    “Combining a great style with lots of technical info, this book provides a learning
    experience that’s both fun and interesting. Not too many technical books can claim
    that.” — ;login: Magazine, October 2010


    “This book is worth its weight in gold.” — Utah.com


    “The book is a comparatively quick read and will come in handy when troubleshooting
    and analyzing network problems.” —Dr. Dobbs


    “Network Flow Analysis is a pick for any library strong in network administration
    and data management. It’s the first to show system administrators how to assess,
    analyze and debut a network using flow analysis, and comes from one of”


    # FreeBSD Mastery: Storage


    “If you are trying to learn how to use PGP, or at least want to ensure you are
    using them properly, read PGP & GPG.” — Slashdot


    “If you use any nix-system, and need offsite backups, then you need Tarsnap. If
    you want to use Tarsnap efficiently, you need Tarsnap Mastery.” —Sunday Morning
    Linux Review episode 148

