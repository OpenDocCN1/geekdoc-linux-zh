    # Chapter 1: PAM Components


    granted? Should the request try the next module? Should a failure here terminate
    the whole process? These control statements provide PAM’s logic.


    The module is PAM module used. Use the filename of the module, including the trailing
    .so. (OpenPAM allows you to omit the .so.) Most PAM modules installed in a system-specific
    location, such as /usr/lib/ or /lib/x86_64-linux-gnu/security/. If you want to
    use a module that’s not in a standard directory, list it by its full path. Listing
    a module tells PAM to feed the authentication information to this module and collect
    a response. For example, pam_unix.so checks the local system’s password file for
    a valid username and password. If PAM handles this username and password, the
    module will respond either “yes, it exists” or “nope, invalid.” The control statement
    tells PAM what to do for each kind of response. A module can respond with more
    than “yes” or “no,” as discussed in Chapter 4.


    The module arguments are specific to each module. Some arguments, like no_warn
    and debug, are recognized by many modules. The exact meaning of each depends on
    the module, however. Not all modules need or use arguments. A few poorly coded
    modules object to having any arguments at all.


    Split long statements between lines with a backslash (\). auth required pam_echo
    checking OPIE RUSER=%U TTY=%t SERVICE=%s RHOST=%H


    Let’s dive into authentication types.


    # Authentication Types


    PAM divides the authentication process into four components. These components
    might be called facilities or types, depending on whose documentation you read.
    The type is the first field in a PAM rule.


    The auth, or authentication, type verifies the authentication information presented
    and establishes any restrictions or resource limits set for the account. If you
    enter a wrong password or a non-existent username, the auth type kicks you out.
    If a user account has a limited number of processes, can use a maximum amount
    of memory, or belongs to particular groups, the auth type handles setting these
    limits.


    The account type controls access to an account as dictated by characteristics
    other than simple authentication. If the user can log in only on February 28th
    of odd-numbered years, that''s configured in the account type. A user might enter
    the proper authentication information, but if no account''s available she cannot
    log in.


    The session type handles system-side setup needed to provide service. A command-line
    user needs a virtual terminal, a home directory, and probably a log entry saying
    that they logged in. An anonymous FTP user doesn''t need a virtual terminal, personal
    home directory, or a shell, but does need FTP-specific resources. When the session
    ends, all allocated resources need to be torn down. The session type manages all
    such per-session requirements.


    Finally, the password type is needed when the user''s credentials need updating
    the system. Maybe the user is changing their password. Maybe their hardware token
    needs poking. The password type handles any actions needed to update the authentication
    credentials.


    Each service a host might have one or more statement of each type. Depending on
    how authentication should work on your system, you might have dozens of one type,
    a single statement of two other types, and none of the fourth.


    A group of statements of the same type is often called a chain or sometimes a
    stack. This book uses the word policy. Look at the example PAM policy at the beginning
    of this chapter. Each policy is only one statement long. In the next section,
    we''ll see policies with several statements.


    With Linux-PAM, you''ll occasionally see type statements with a leading hyphen
    before the name: -auth, -account, -session, and -password. These indicate if the
    module is not installed on the system, PAM should ignore the error. You''ll see
    this when a module is optional, such as for Kerberos or systemd(8).


    # PAM Controls


    PAM controls declare how a particular module affects a policy. You can decide
    which types of authentication are mandatory, which are voluntary, and which you
    don''t care about.


    PAM sends the user''s authentication information to each module in the policy.
    Each module returns either success or failure, meaning that the authentication
    attempt succeeds or fails for that module. For example, a password-verification
    module determines if the password provided by the user matches the password configured
    for that. If the password matches, the module returns a success; if not, a failure.
    The PAM module responsible for home directories looks to see if the user''s home
    directory exists, and returns success if it''s there and failure if it''s not.
    (PAM modules can return more than these two codes, as discussed in Chapter 4,
    but this gets you started.)


    PAM controls don''t resemble the strict allow/deny syntax you find in applications
    like packet filters, web servers, and other Access Control Lists. They''re more
    like a long-standing committee in a century steeped in tradition and ritual, where
    each member has an unusual name, baroque responsibilities, and unique privileges.


    This committee votes on authentication in a specified, stated order. Each member
    has specific ways they can vote. Perhaps the Archchancellor starts the vote, and
    can either say “yes” or reject the whole proposal before anyone else gets a chance.
    The Dean can vote “no comment” or “no,” but doesn’t have the right to vote in
    favor of anything. The Senior Wrangler can vote either “no” or “yes”, so long
    as nobody else objects.” If voting reaches as far as the Lecturer in Recent Runes,
    he can either silent or declare, “yes, dang it, and the vote’s over, I win!


    Meanwhile, the Librarian has a seat at the table but can only take notes and eat.


    Control statements formally define this structure. Each PAM module gets voting
    privileges. Some control statements say, “if this fails, terminate immediately”
    or “if this module succeeds, proceed to the next module.” At the end of the policy,
    the vote determines if access is granted or denied.


    Linux-PAM users use a more complex syntax, as discussed in Chapter 4. Even so,
    most Linux-PAM deployments still heavily rely on these “traditional” controls.


    PAM has five main controls: required, requisite, optional, sufficient, and binding.


    # Required


    A statement with the required control means that this module must return success
    for the policy to permit access. If a user enters the wrong password, they cannot
    log in. If the sysadmin has configured the host so that nobody can log in, they
    cannot log in.


    If a required control fails, PAM processes the remaining modules in the policy.
    The login still return a failure, denying access.


    If a required control succeeds, PAM continues processing the policy, giving some
    other module a chance to deny access.


    Every required module must succeed for PAM to allow access. If even one required
    module fails, success in the other modules doesn''t suffice. Consider this sample
    policy.


    ```

    auth required pam_breatalyzer.so

    auth required pam_ddr.so

    auth required pam_genescan.so

    ```


    This policy first finds the authentication information to the pam_breatalyzer.so
    module, then to pam_ddr.so, and then to pam_genescan.so, all with the required
    control. This policy requires unanimous consent. If any one of these modules returns
    a failure, the authentication request fails. All three modules get processed,
    though, so they can perform secondary tasks like logging information helpful for
    the sysadmin.


    Depending on the module''s function and the policy type, required statements are
    a key part of multi-factor authentication. Many other control statements (described
    later) claim to grant access if they succeed. If an earlier required module fails,
    PAM rejects the access. A failed required control acts as the great big hammer
    of “nope”.


    # Requisite


    The requisite control indicates that the module must succeed for access to be
    granted.


    If a requisite control succeeds, PAM continues processing modules. The request
    is granted unless rejected.


    If a requisite control fails, PAM immediately stops processing modules and tells
    the application that the request is rejected. This makes requisite different from
    required.


    - Yes, the breathalyzer module should probably test to see if the user is sober
    enough to log in, and thus be in an account policy. It’s just an example, go with
    it.

