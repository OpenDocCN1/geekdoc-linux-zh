    # Chapter 10: Console Access with SSH Keys


    Now let''s take a quick look at the session rules.


    ```

    session [default=1] pam_permit.so

    session requisite pam_deny.so

    session required pam_permit.so

    session required pam_unix.so

    session optional pam_ssh.so

    session optional pam_tmpdir.so

    ```


    The first three statements are similar to the first statements in the auth policy.
    There''s a requisite pam_deny, but you literally cannot hit it. The real rules
    begin with the fourth statement, which calls pam_unix to set the user''s environment.
    Rule five, for pam_ssh, enables the user''s SSH agent. The final statement calls
    pam_tmpdir to configure a secure temporary directory for the user.


    ## Comparison


    Why do FreeBSD and Debian have such wildly policies for a similar function? Part
    of this is because Debian''s policies are designed to be friendly for the pam-auth-update(8)
    PAM configuration tool. FreeBSD assumes you''ll be editing your own PAM rules,
    and hence you understand what type of statement does.


    Another key difference, though, is that the operating system packages make different
    assumptions about how the module will be used. FreeBSD''s developers assume that
    authentication via the user''s SSH key is sufficient, and entirely skip authenticating
    against the system password file. Debian, on the other hand, requires the user
    to authenticate against the password file—but it assumes the user''s passphrase
    is the same as their password.


    The real problem here is the word “assumes.”

    If you hear about a cool PAM module and try to deploy it, you must carefully check
    your assumptions, the assumptions of the module authors, and the assumptions made
    by the folks packaging the module for your operating system. If you''re using
    third-party documentation, check the author''s assumptions as well. The only way
    to truly understand how a module works is to carefully read the PAM policy, statement
    by statement. I had deployed FreeBSD''s pam_ssh several times, but the first time
    I tried pam_ssh on Debian drove me to the edge of madness² until I carefully unraveled
    the PAM configuration.


    Assumptions with PAM will ruin your day, your week, your everything until you
