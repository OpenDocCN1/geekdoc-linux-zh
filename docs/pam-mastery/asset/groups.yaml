    # Chapter 3: PAM Items, Codes, and Functions


    # PAM_SERVICE_ERR (3)


    Some service that the PAM module needs has failed you. This appears most commonly
    with centralized authentication, when the Kerberos, LDAP, or NIS servers have
    gone belly-up.


    # PAM_SYSTEM_ERR (4)


    The module experienced an OS-level error when trying to run.


    # PAM_PERM_DENIED (7)


    The module says that this user lacks the privileges needed to return success.
    This permission error could be anywhere in the application stack. Check your system
    log.


    # PAM_MAXTRIES (8)


    The module has a limit on the maximum number of times you can try to enter the
    correct authentication credentials. You’ve blown past that.


    # PAM_AUTH_ERR (9)


    An error in authentication has occured. The user entered the wrong password.


    # PAM_NEW_AUTHTOK_REQD (10)


    Most frequently, getting this return code means that the user’s password has expired
    and must be changed. In PAM modules not related to passwords, however, it might
    appear when some password-like entity needs adjustment or replacement.


    Only account policies should return this code.


    # PAM_USER_UNKNOWN (13)


    The authentication system doesn’t recognize this user.


    # PAM_IGNORE (25)


    The PAM policy should ignore the result of this module, and not let it vote on
    allowing or denying access.'
  - '[PAGE 78]


    # Chapter 3: PAM Items, Codes, and Functions


    # Functions


    Each type of PAM request has well-defined programming interfaces to perform the
    task. These APIs both give PAM its flexibility and limit its scope. Sysadmins
    don''t have to know how to use these functions, of course. If they appear in documentation
    or the system log, though, knowing roughly what the function does can help debug
    issues.


    # PAM Setup and Resources


    Setting up a PAM session requires that a program call the *pam_start function.
    When the PAM session completes, the *pam_end function tears down the session and
    releases all the resources session used.


    A program''s PAM session is a conversation between the program and the PAM libraries.
    A PAM application needs a “conversation callback,” a way for the PAM stack to
    send messages back to the application, provided by the *pam_conv function.


    In addition to the items discussed earlier this chapter, PAM includes a whole
    list of internal items. Even the prompt presented to the user is an item. The
    *pam_set_item* and *pam_get_item* functions let PAM manipulate these items.


    The *pam_setenv*, *pam_getenv*, *pam_putenv*, and *pam_getenvlist* functions allow
    PAM to manipulate the user environment before logging in. For example, a module
    like pam_krb5 would use these functions to set *KRBS5CNAME to the credential cache
    where it stored your ticket at login.


    A PAM module might need to allocate memory for its own internal functions. While
    the PAM programming interface is strict-defined, a PAM module can do anything
    it internally. The *pam_set_data* and *pam_get_data* let a PAM session create
    and manipulate these chunks of memory by name.'
  - '[PAGE 79]


    # Chapter 3: PAM Items, Codes, and Functions


    # Authentication Functions


    As the name implies, the pam_authenticate function authenticates the user. The
    function takes the username and an authentication token (a password, fingerprint,
    gene scan result, or so on) and checks them against an authentication database.


    The pam_setcred function manages a user''s credentials. A user''s credentials
    can include items like the user''s username and group memberships, as well as
    things like Kerberos tickets or other single-sign-on outrements.


    PAM modules do not set a user''s UID or own. Nor do they perform actions opening
    a virtual terminal for the user. These actions normally need to be done by a child
    process. If a PAM module were to drop privileges from root to the user''s when
    called pam_setcred, the module would lose access to privileged operations updating
    the lastlog. Instead, the server spawns a child process for the user''s activity,
    while the server process maintains its privileges and cleans up after itself.


    # Account, Session, and Password Functions


    PAM uses the pam_acct_mgmt function to enforce account policies. Any restrictions
    on logon hours, password expiration, or other account statements pass through
    pam_acct_mgmt.


    Session statements trigger the pam_open_session and pam_close_session functions.


    Finally, the pam_chauthtok function lets the server change the user''s password.


