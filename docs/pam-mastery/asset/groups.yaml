    # Chapter 0: Introduction


    In 1995, Sun Microsystems proposed a standard cross-platform, cross-program authentication
    interface. Software adopting that interface could utilize any authentication program
    offering that interface. If you wanted a new authentication mechanism for such
    programs, you could write it to attach to this interface and plug it in to all
    your software. Hence, Pluggable Authentication Modules, or PAM.


    PAM modules are chunks of code that implement a specific authentication method.
    You want to provide authentication with a username and password? That''s a module.
    Via a hardware token? That''s a module. Via gene scans, breathalyzer test, and
    a Dance Dance Revolution platform? Those all would be modules, too, if such exists.
    In an effort to be platform-agnostic, this book uses three modules in many examples.¹
    Modules are shared libraries, dynamically linked into the main program as configured.
    Yes, the phrase “PAM module” is redundant, but that''s what sysadmins call them,
    and I already have too many battles to fight to take this on.


    Software that uses PAM receives authentication requests. The program hands each
    request to the configured authentication modules, which tell the server if it
    should allow the authentication request or not.


    Today, PAM is the most widely used authentication standard for Unix-like systems.
    It''s overwhelmingly popular in the Linux world, as well as Solaris-based and
    BSD systems. Even Apple’s OS X uses PAM, as well as commercial UNIX systems like
    AIX and HP-UX.


    > I wanted to use pam_hipster.so as a sample module, but it requires an artisan
    compiler that runs only on this one fascinating architecture. Plus, the code is
    only available via punch cards from this guy who works at the custom bicycle shop
    down the road.


    Strictly speaking, PAM is not an officially accepted standard. No Grand Certifying
    Body has placed its stamp on a set of PAM definitions and protocols and declared
    them the One True PAM Specification. The Common Desktop Environment (CDE) included
    PAM, and CDE became a standard in the 1990s, PAM does get referenced in various
    standards documents. Most modern PAM implementations are based on a draft specification
    from an attempt in 1997 to include PAM in the Portable Operating System Interface
    (POSIX). If you really want to dive into PAM, check out the document X/Open Single
    Sign-on Service (XSSO) - Pluggable Authentication Modules, available from a bunch
    of Internet sites, including http://pubs.opengroup.org. People have tried to standardize
    PAM since then, but all attempts have failed.


    The absence of a formal standard means that PAM also lacks a formally defined
    language. Depending on which documentation you read, a group of rules might be
    a chain or a stack or a policy. A component of the authentication process might
    be a type or a facility or a whatsit. In this book I give the most common terms
    for each component, then choose a single word to be used for that component. The
    fact that I use a specific word to refer to a part of PAM doesn''t mean all that
    the other choices are invalid; it only means that you need consistency if you''re
    to understand this gobbledygook.


    # PAM Limitations


    PAM is the most widely used authentication system, but its limitations make it
    unsuitable for some applications.


    The biggest drawback to PAM is that a PAM module can not interact directly with
    clients. The server program is an intermediary between the PAM module and the
    client, and any interaction between the module and client is limited to that offered
    by the standard PAM interface.


    Some authentication protocols, like Kerberos, include a whole sweeping array of
    client-server interactions that far exceed what PAM can support. In Kerberos,
    PAM is a bottleneck. While you can use PAM modules to support Kerberos, you cannot
    implement Kerberos through PAM. This is why SSH handles most of its authentication
    outside PAM (although it can leverage PAM if you decide so).


    This limitation is why people created other authentication protocols, such as
    Simple Authentication and Security Layer (SASL) and the Generic Security Services
    API (GSSAPI), plus all the tools and services that have evolved around these.


    Not all operating systems use PAM. Notably, OpenBSD BSD Authentication, which
    spins authentication requests off into separate processes rather than dynamically
    linked libraries. BSD authentication separates privileges more widely than PAM,
    and hence reduces risk, but is not as flexible as used.


    If you want a taste of authentication administration before PAM, though, consider
    the variety of work needed to implement and deploy Kerberos in all your server
    software. While these applications hook to a common Kerberos domain, you configure
    each in a completely different manner. Imagine that, multiplied by all the authentication
    protocols used today, and all the interactions of those protocols with all the
    different software. PAM looks better now, doesn''t it?


    # PAM Implementations


    While anyone can implement PAM, you''ll most commonly encounter three specific
    versions: Solaris, Linux-PAM, and OpenPAM. The different versions are almost compatible.


    - 2. “Almost compatible” means that anyone supporting more than one version will
    usually have little trouble, but occasionally subtle differences will ruin their
    cherub-like demeanor.


    Sun first proposed PAM, and Sun Solaris had the very first implementation. The
    PAM code from Solaris found its way into the open source OpenSolaris, where it
    irrevocably became part of the public source code ecosystem. Oracle purchased
    Sun and no longer publicly releases updates to the Solaris code, but community
    projects like OpenIndiana maintain and update a public version Solaris PAM. While
    other PAM implementers based their modules on Sun''s original work, Sun eliminated
    those modules in favor of entirely new modules. This means that the modules and
    configurations that appear in Linux and BSD systems, while based on Sun''s work,
    bear no resemblance to what currently ships with Solaris PAM.


    Linux-PAM is the Pluggable Authentication Modules implementation used for most
    Linux systems. It closely follows the original Sun model, and many of the PAM
    modules keep the same names and functions of that primordial implementation. It''s
    mostly, but not entirely, compatible with Solaris PAM. You''ll find Linux-PAM
    primarily in Linux systems, but it also appears in some commercial Unix variants.³
    Sadly, different Linux distributions use slightly different versions of Linux-PAM.


    The author of OpenPAM attempted to include the most important parts of Linux-PAM,
    Solaris PAM, and the proposed XSSO standards. OpenPAM originates from the FreeBSD
    community. OpenPAM itself includes very few modules, but what most people call
    OpenPAM is really “OpenPAM and a selection of modules culled from FreeBSD.” BSD-based
    systems that use PAM all use OpenPAM. OpenPAM''s standard modules resemble those
    of Linux-PAM and Solaris origin.


    > To make an SGI sysadmin scream and gibber, say “Hey, remember IRIX''s two incompatible
    PAM stacks? Good times!”


    While OS X uses OpenPAM, Apple doesn''t use the common PAM modules. Instead, they''ve
    written their own PAM modules to better integrate with the True Apple way.


    Commercial UNIX systems usually have their own PAM implementation that behaves
    the way the vendor prefers. IBM''s AIX, for example, uses standard PAM policies
    but calls the pam_aix module almost everywhere. (AIX PAM is also implemented atop
    their proprietary Loadable Authentication Module system, because it''s IBM.)


    # PAM Variances


    Both CentOS and Debian use Linux-PAM. Sadly, you use slightly different versions
    of Linux-PAM. Each distribution''s designers select features and modules that
    make sense for them. The result is, CentOS Linux-PAM includes features and options
    not found in Debian Linux-PAM, and vice versa. I''ll mention some of those differences
    we encounter them. When in doubt, consult your Linux documentation to see what
    toys you get.


    Additionally, Linux-PAM and OpenPAM use PAM differently, because they support
    operating systems with different designs. For example, Linux-PAM can change the
    encryption algorithm used for storing new passwords. BSD and older Sun systems
    handle password encryption algorithms with login classes, so OpenPAM doesn''t
    include that feature. I''ll point out those differences as we go.


    Linux-PAM has more knobs and buttons than OpenPAM. Part of this is because Linux-PAM
    needs features that OpenPAM puts elsewhere, but it also appears that the Linux-PAM
    developers have a fondness for extra knobs and buttons. In an effort to keep you
    from twiddling buttons best left alone, this book gives Linux-PAM a little more
    attention than OpenPAM.

    '
