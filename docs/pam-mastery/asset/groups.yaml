  - '[PAGE 136]


    # Chapter 9: One-Time Passwords: Google Authenticator


    If the computer that you are logging into isn''t hardened against brute-forcelogin
    attempts, you can enable rate-limiting for the authentication module.By default,
    this limits attackers to no more than 3 login attempts every 30s.Do you want to
    enable rate-limiting (y/n) y


    Answering y limits logon attempts to three every 30 seconds. Answering n disables
    rate limiting.


    # Scripting User Setup


    The Google Authenticator user setup process is simple. Surely your users can handle
    y, capturing a QR code, and typing a specific sequence of three y''s and n''s?


    Anyone who is a sysadmin more than a week knows the answer to this question “absolutely
    not.” If than a couple people will use a service protected by GA, script the configuration
    process. Here''s a simple script that runs google-authenticator and answers y
    twice and n times.


    ```

    #/bin/sh

    printf ''y\ny\nn\nn\n\n'' | google-authenticator

    ```


    The \n is a return, or the ENTER key. The printf command spits out y-ENTER, y-ENTER,
    n-ENTER, n-ENTER, n-ENTER, and feeds them into google-authenticator. A user running
    this script gets their QR code, URL, secret, and their emergency scratch codes
    without making any decisions at all.


    If you run google-authenticator -h, you''ll get a list of command-line flags and
    options that let you pre-answer questions. Write your script however you like.


    If your organization is large enough, your script should probably hide all output
    other than the QR code, URL, and secret. You might even strip the output down
    to the QR code.'
