    # Chapter 7: Arbitrary Files and Random Programs


    Group membership is another criterion pam_listfile can process. It doesn''t work
    quite the way you think, as discussed below, but here''s an example.


    auth required pam_listfile.so item=group sense=allow \ file=/etc/grouplist onerr=succeed


    If a user is a member of a group listed in /etc/grouplist, she gets access. If
    not, she doesn''t.


    Using pam_listfile with group membership is a great way to illustrate how PAM
    can ruin your whole day. You might use a pam_wheel statement to only allow members
    of the wheel group to use a service, and add a pam_listfile statement like the
    above to ban anyone in a group listed in /etc/grouplist from using that same service.
    Now add wheel to /etc/grouplist. You now have a completely valid PAM configuration
    that blocks everybody from authenticating.


    # Pam_listfile Sense and File


    The file tells pam_listfile where to find the list of items it''s looking for.
    Each item should be on its own line. As usual for configuration files, use a hash
    mark (#) to start a comment.


    The sense statement tells pam_listfile what to do with the list. Setting sense
    to allow pam_listfile to only permit access to items listed in the file. Setting
    sense to deny any items in the file.


    # Pam_listfile Errors


    You breaks, usually without intending to. The onerr statement tells pam_listfile
    what to do when it has a problem. Setting onerr to succeed tells pam_listfile
    to allow access if it has a problem. Setting onerr to fail causes it to fail,
    denying access.


    > To be fair, I can''t blame pam_listfile. PAM has many ways to ruin your day.'
