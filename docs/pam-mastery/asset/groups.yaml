- md: '

    ## Chapter 2: Common Modules


    ## Allowing and Denying Requests


    When building PAM policies, ending a policy with a firm *yes* or *no* help. PAM
    includes two modules for exactly that.


    **pam_deny**


    Sometimes, you just gotta say no. That''s what *pam_deny* is for.


    Use *pam_deny* to block all requests. By putting *pam_deny* at the end of a policy,
    you declare that everything not permitted earlier is forbidden.


    The *pam_deny* module is especially important when using sufficient statements.
    The sufficient control says “pass this and you''re in, so long as nobody else.
    Fail this, and you can try something else.” If a request reaches the end of a
    bunch of sufficient statements and hasn''t passed any of them, but nothing has
    denied access, adding a *pam_deny* at the end provides an authoritative refusal.


    You''ll also see *pam_deny* used where a request simply makes no sense. CentOS
    provides fingerprint-authentication. The Red Hat developers believe that people''s
    fingerprints don''t change,” so they categorically deny attempts to change the
    user''s password.


    ```

    password        required        pam_deny.so

    ```


    The required control indicates that the module must return success for the request
    to be granted. The *pam_deny* module never returns success. This PAM configuration
    blocks all attempts to change the user''s fingerprint.


    **pam_permit**


    If *pam_permit* is upright and refuses everything, *pam_permit* is its mirror
    twin. Like a really bad negotiator, *pam_permit* says yes to everything. It has
    no options and no tunable behavior.


    Some services need to use pam_permit to explicitly allow access. You''ll see many
    programs use pam_permit with session policies for this reason.


    ## Allowing Root


    PAM lets you explicitly grant the root account its all-encompassing privilege.
    The pam_rootook module allows access if the user is root.


    I most often see pam_rootook used with include statements. Here''s the CentOS
    7 PAM configuration for chfn1(1).


    ```

    auth sufficient pam_rootook.so

    auth include system-auth

    account include system-auth

    password include system-auth

    session include system-auth

    ```


    Taken as a whole, this means “root can always run this command, or others as the
    system authentication permits.”


    Pam_rootook works only for auth statements.


    ## Secure Terminals


    Unix-like systems consider some terminals more secure than others. While SSH might
    be a secure protocol, the virtual terminal used by SSH is not inherently secure.
    The physical console might not be in a secure location, but if you have console
    access you can physically alter the machine, so you might as well call it secure.
    Those serial ports might be secure if they''re connected to a local terminal on
    the sysad-min''s desk, but not so much if they''re in a modem pool. If the machine
    and its console are in a room secured by very serious locks, the physical terminal
    is as secure as it can be.


    Normally, a user cannot log in directly as root. They need to log in as a regular
    user, and then su(1) to become root. The pam_securetty module allows a direct
    login as root, and if only if the user authenticates to a secure terminal.


    BSD systems consider a terminal device secure if its entry in /etc/ttys list the
    **secure** flag.


    Linux systems list terminal devices in /etc/securesttys. Linux-PAM''s pam_security
    also allows logins as **root** on console devices listed on the kernel command
    line, as well as consoles listed in /sys/class/tty/console/active. Pam_security''s
    **nconsole** option disallows these additional devices, restricting **root** logins
    to only devices listed in /etc/securesttys.


    ## Login Accounting


    PAM provides information to the user accounting system through the pam_lastlog
    module. On CentOS and Debian, user accounting is in /var/log/lastlog, while FreeBSD
    puts it in /var/log/utx.lastlogin. It also prints the welcome message when the
    user logs in, informing them of the last time they logged in.


    Pam_lastlog only works as part of a session statement.


    Linux-PAM supports several options to modify pam_lastlog''s accounting and login
    behavior. You can disable certain accounting functions with options like **nowtmp**
    and **noupdate**. Options like **noterm** and **nohost** remove information from
    the user''s login message, while **showfailed** displays the last time someone
    failed to log into this account. Finally, the **inactive** option lets you set
    a number of inactive days before the account is locked out for inactivity. You
    can set a number of days, or use the default of 90.


    ```

    session optional pam_lastlog.so showfailed inactive=5

    ```


    BSD systems handle all of these functions elsewhere, so OpenPAM supports none
    of these features.


    ## Preventing Logins


    No matter how far in advance you announce a maintenance window, and how many times
    you remind people, someone will try to use the system when you''re doing a delicate
    upgrade. You might want to have a system in multi-user mode but disallow anyone
    except sysadmins from logging in. Or you might need to solve an administrative
    problem by not letting people log in for a while. The *pam_nologin* module is
    just for you.


    You might think you can achieve similar results by turning services off—nobody
    can log into your host via SSH if the SSH daemon is off! You could also reconfigure
    SSH to allow only ssh to log in. The *nologin* module universally prohibits logins.
    It prohibits logins by everyone except list of privileged users. Pamologin checks
    for the existence of nologin* file—**/etc/nologin* for Linux-PAM and */var/run/nologin*
    for OpenPAM. If the nologin* file does not exist, users can log in. If the file
    exists, most users cannot log in. Pamologin uses the contents of nologin* file
    as an error message to the application. Whether the user sees it depends entirely
    on the application. Both OpenPAM and Linux-PAM recommend making nologin a required
    module, and putting it at the front of a policy. Use it in every system service
    you intend to refuse access.


    ## Chapter 3: PAM Items, Codes, and Functions


    Much PAM documentation assumes that the sysadmin is familiar with the internal
    workings of PAM. The designers expect you to understand which functions PAM calls
    for each type of statement and which internal items and error codes around. Configuring
    PAM modules and Linux-PAM extended controls requires understanding these return
    codes.


    You don''t need to memorize everything in this chapter. PAM items are critical
    in debugging, and you really need familiarity with them. Specific PAM error codes
    and functions are less vital for sysadmins, however. Study the principles involved
    and what these codes are used for, but you can always look up an error code when
    a PAM module spits it out, and you''ll quickly grow familiar with the errors.


    # PAM Items


    PAM carries a whole bunch of its internal state in a set of well-defined items.
    A process that uses PAM defines the needed items and passes them off to the various
    PAM stacks. All of the items start undefined. Applications and frameworks set
    the items they need. Modules read the items.

    '
