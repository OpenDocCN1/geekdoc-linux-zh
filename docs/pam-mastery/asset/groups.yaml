- md: '

    ## Chapter 7: Arbitrary Files and Random Programs


    To create an actual SELinux policy on your system, use audit2allow with the -M
    flag and the actual module name. This only creates the policy; it does not activate
    it.


    ```bash

    # grep denied audit.log | grep pam_ssh | audit2allow -Mnpam_ssh

    ```


    ****************s IMPORTANT*****************

    To make this policy package active, execute:


    ```bash

    semodule -i pam_ssh.pp

    ```


    You''re not one to ignore instructions, are you? Do what the nice software tells
    you.


    ```bash

    # semodule -i pam_ssh.pp

    ```


    Your PAM module should now work, or at least it should proceed to the next error.
    Which is progress, no?


    Once you have a working SELinux policy, you can copy the .pp file containing the
    policy to other systems and install it. You must ensure that the SELinux policy
    version matches and that the types referenced in the policy exist in the other
    system. The best way to do this is to use the same operating system for both your
    test and production environ.


    ## SELinux and pam_mkhomedir


    The pam_mkhomedir module creates missing home directories when the user logs in.
    It''s used in organizations that deploy centralized authentication, such as LDAP.
    This book doesn''t cover the module because it''s very trivial.


    One problem with pam_mkhomedir is that it doesn''t support SELinux. Red Hat envisions
    SELinux as a core part of its operating system. Rather than update pam_mkhomedir,
    Red Hat has replaced pam_mkhomedir with the SELinux-friendly pam_oddjob_mkhomedir.
    A solution exists, so that''s fine for most CentOS admins.


    I''ve been in more than one multi-platform enterprise where the corporate security
    policy mandates use of pam_mkhomedir, however. Perhaps the security team hasn''t
    updated its policy in a while. Perhaps this is part of a cross-platform standardization
    push. I’ve even seen a case of “dang it, the blasted sysadmins keep using pam_exec
    for everything!” Adjusting the SELinux security policy lets you use pam_mkhomedir
    on CentOS.


    Eventually, you won''t be able to get pam_mkhomedir on CentOS. Rather than adjusting
    the policy and going on with your day, talk to your security team. Find out what
    problem they’re trying to solve. Help them either update the standard or solve
    their problem some other way.


    But if you really want to play with your organization’s security policy, you need
    add-on PAM modules.


    ## Chapter 8: SSH Agent Authentication


    Most sysadmins manage hosts with Secure Shell (SSH). The majority of SSH authentication
    happens with public keys rather than with passwords. If you''re using an SSH agent,
    you can tell PAM to use the agent as an authentication source with the pam_ssh_agent_auth.


    Pam_ssh_agent_auth (https://sourceforge.net/projects/pamsshagentauth/) works the
    same as SSH key-based authentication. The module grabs the user''s authorized_keys
    file and asks the user''s SSH agent if it has the matching private key. If the
    SSH agent has the private key, the module returns PAM_SUCCESS. Pam_ssh_agent_auth
