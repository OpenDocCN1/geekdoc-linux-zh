    # Running Programs: pam_exec


    As discussed in Chapters 3 and 6, PAM can run arbitrary commands with pam_exec.
    If the program runs successfully (returns 0), pam_exec returns success. If the
    program returns an error or fails to run at all, pam_exec returns failure.


    Why would you use pam_exec? You might extract PAM environment as discussed in
    Chapter 3. The textbook example is rebuilding the YP database after a user changes
    her password. But you can also use pam_exec to implement functions like checking
    a username against a list of users before permitting access, exactly like pam_listfile.


    One to consider is that pam_exec fires up a process for authentication request.
    If many people authenticate to your system, these processes can impose significant
    load. Verify that your “arbitrary commands” are not the metaphorical equivalent
    of hordes of kilt-wearing little blue men that think your system resources kebab
    up a treat.¹15 Simple commands and scripts, however, should be fine for most environments.


    # Configuring pam_exec


    It’s possible to put commands directly in a PAM configuration file. For anything
    but the simplest commands, I find this fragile and easily broken. You might prefer
    otherwise, but as I’m the one writing this book, we’ll do it my way. Instead,
    put the command you want PAM to execute in a script and have pam_exec call that
    script.


    The simplest invocation of pam_exec takes only a single option, the command to
    run.


    > 15 If pam_exec starts Firefox, you’re doomed.'
