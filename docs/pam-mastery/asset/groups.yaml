    # Chapter 7: Arbitrary Files and Random Programs


    account required pam_exec /usr/local/scripts/pamvarlog.sh


    When a user attempts to access their account, PAM runs the script pamvarlog.sh.
    We used this script in Chapter 3 to gather PAM environment variables.


    OpenPAM and Linux-PAM both offer additional options to pam_exec, but we''ll cover
    the basic functions first. Specifically, we''ll implement a basic pam_listfile
    feature entirely through shell commands.


    ## Implementing pam_listfile in pam_exec


    We''re going to have a list of users permitted access to a service. If the username
    exists in the file, access is granted. If not, access is denied.


    PAM hands our script its usual batch of items. If you''re not sure which items
    a particular server sets, capture them with the pamvarlog.sh script in Chapter
    3. Fortunately, every authentication process needs PAM_USER.


    We need to be a little bit careful in how we check for the username in our target
    file. We don''t want to match comments. We want to match only complete usernames.
    A little bit of grep(1) will do the trick for us. Here''s a proof-of-concept script
    that checks the user against /etc/validusers, and permits access if the username
    appears there.


    ```

    #!/bin/sh

    /usr/bin/grep ^$PAM_USER$ /etc/validusers

    return $?

    ```


    This script returns whatever the grep(1) statement finds a match, it returns 0.
    If there''s no match, it returns 1. Remember, pam_exec treats 0 as success and
    1 as failure.


    What if you want to deny access to users listed in /etc/bogususers? That''s a
    massive change: add an exclamation-point.


    ```bash

    #!/bin/sh

    ! /usr/bin/grep ^$PAM_USER /etc/bogususers

    return $?

    ```


    This script inverts the return code of the grep(1) statement.

    Build on these examples to create scripts that fit your needs. At a minimum, you
    must sanitize the inputs. The method for sanitizing inputs depends on your system''s
    default root shell—bash has different methods than traditional sh.


    ## Pam_exec versus Modules


    Using pam_exec for everything seems like an easy and straightforward way to solve
    a lot of problems. We''re sysadmins. We like shell scripts.

    “You want to authenticate against a NoSQL database? I''ll write a shell script!


    Real life is not simple.

    When a PAM module executes for a function, you''re usually better off using it
    as opposed to writing your own script. Obscure but publicly available PAM modules
    have probably had more users than your shell script. The worst bugs have already
    been found—and best of all, they''ve been found by someone else. If you write
    your own script, you get to find those bugs on your own.


    Using pam_exec should be considered a last choice. It''s a really useful last
    choice, though.


    One thing to remember when using pam_exec is that Linux-PAM and OpenPAM implemented
    pam_exec differently.


    ## OpenPAM pam_exec


    OpenPAM''s pam_exec has only one option, to adjust return codes.

    OpenPAM''s pam_exec in the default configuration returns one of two responses.
    If the command returns 0, pam_exec returns PAM_SUCCESS. If the command returns
    anything else, pam_exec returns PAM_PERM_DENIED.


    The return_prog_exit_status option to pam_exec changes what it returns. Instead
    of a simple "yes" or "no", return_prog_exit_status lets the script return an actual
    PAM return code, as discussed in Chapter 4. Your script needs to return a valid
    return code for the service module function calling it. In Linux-PAM, you can
    check the PAM_SM_FUNC item to see the function calling pam_exec. The manual page
    for each service module function lists the acceptable return codes. Pam_exec knows
    which functions can accept return codes. If your script try to return an unacceptable
    code pam_exec substitutes PAM_SERVICE_ERR instead.


    The only option OpenPAM pam_exec supports. While Linux-PAM’s pam_exec supports
    more options, those options can almost be implemented within a script.


    ## Linux-PAM pam_exec


    The Linux-PAM version of pam_exec has options for debugging, logging, and handling
    privilege and passwords.


    The debug option sends debugging information to the system log, exactly as discussed
    in Chapter 1.


    Your pam_exec command might generate output. That output is normally discarded,
    but you can use either the log= stdout instead. By defining a log file, you send
    any output to that file. The stdout sends the program’s output to standard out,
    letting the calling program deal with that output.


    Even if the command doesn''t normally generate output, pam_exec echoes any errors
    the program throws. The quiet option disables the messages.


    The type= option tells pam_exec to run the command only if the PAM policy type
    matches. You could deit, say, type=account so that this particular pam_exec only
    runs on account policies.


    You can hand your script''s password on standard input, by adding the expose_authtok
    option. The system variable PAM_MAX_RESP_SIZE dictates the maximum password length,
    and that''s normally something like 512 bytes.


    Finally, you can run programs with the effective UID of the process being authenticated.


    ## PAM versus SELinux


    Security Enhanced Linux (SELinux) is a mechanism for security policy enforcement
    for a mandatory access control (MAC) architecture. SELinux allows you to define
    a security policy that limits the ability of processes and users to access files,
    network, ports, and other resources. PAM (Pluggable Authentication Modules) is
    a framework that allows applications to use authentication modules without needing
    to know how those modules work.


    While PAM handles authentication (determining who you are), SELinux handles authorization
    (determining what you are allowed to do). For example, PAM can authenticate a
    user logging into SSH, but SELinux can restrict that user''s shell to only specific
    directories.


    When you use pam_exec to run custom scripts, you are creating a bridge between
    these two. PAM will trigger the script, but SELinux will still govern what the
    script is allowed to do. It is important to understand how these two systems work
    together to provide a robust security environment.

    '
