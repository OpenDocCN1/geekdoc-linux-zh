  - '[PAGE 88]


    # Chapter 5: Popular Linux-PAM Modules


    While Linux-PAM copied a whole bunch of ideas from the primordial Solaris PAM,
    it''s evolved in the last two decades. Developers have added new features, separated
    functions into different modules, and added support for every new hardware device
    they could get their mitt ons.


    This chapter discusses a few modules that are both exclusive to Linux-PAM and
    widely used in Debian or CentOS.


    # Popular OpenPAM Modules


    Why dedicate a chapter to Linux-PAM modules and not give equal treatment to OpenPAM
    modules?


    Many of the features Linux-PAM implements are not needed on typical (BSD) OpenPAM
    systems. BSD systems had features like resource limits years before PAM or even
    Linux were created, and so don''t implement those features in PAM. And BSD systems
    don''t need systemd, so there''s no need for pam_systemd.


    OpenPAM-based systems ship with modules not found in default Linux-PAM setups,
    such as pam_ssh. These modules are available as add-ons to Linux-PAM, however.
    We cover many of them separately through the latter part of this book.


    # User Environment: pam_env


    PAM lets the system manipulate a user''s environment before the environment really
    exists. You can use pam_env to assign variables in the user environment before
    the user''s own shell files are read. You can use pam_env in auth or session statements.'
  - '[PAGE 89]


    # Chapter 5: Popular Linux-PAM Modules


    The pam-env module pulls its settings from the pam-env-specific configuration
    file, the system environment file, and the user''s environment files.


    # pam-env Configuration


    The primary pam_env configuration file, /etc/security/pam_env.conf, lets you set
    environment variables that vary depending on how the user connects. You provide
    a default value, and then possibly a conditional alternative, or override, if
    desired. The rules have this general format.


    variable default override


    If a statement has no override, pam_env sets the environment variable for the
    user. Here we unconditionally set the EDITOR variable.


    EDITOR pico


    A user can override this setting with the usual shell configuration, but this
    lets you set a reasonable default.


    If this was all pam_env let you do, it''d be pretty lame. pam_env also lets the
    system make decisions based on the PAM environment. PAM sets its own variables,
    and a connecting user brings part of their own environment along. Look at the
    following example.


    ```

    REMOTEHOST DEFAULT=localhost OVERRIDE=${PAM_RHOST}

    ```


    The default of $REMOTEHOST is localhost. If nothing else, assume the user connected
    from the local machine. An override is available, though. If the PAM item PAM_RHOST
    exists, we $REMOTEHOST to that value. The {} syntax indicates pam_env should check
    for a PAM item.


    You might want to rely on environment variables instead, such as $SSH_CLIENT or
    $DISPLAY. Use {} to check for a user environment variable.


    ```

    DISPLAY DEFAULT=${REMOTEHOST}:0.0 OVERRIDE=${DISPLAY}

    ```'
- md: "\n# Chapter 5: Popular Linux-PAM Modules\n\nEarlier in pam_env.conf, we assigned\
    \ the user $REMOTEHOST environment variable. Here we use that to help assign a\
    \ sensible value to $DISPLAY. If the user brought along their own $DISPLAY, however-ever,\
    \ let them keep it.\n\nYou can set up alternative PAM configuration file with\
    \ the confile option for different services. You might want a special environment\
    \ for FTP users, and could set it in /etc/pam.d/ftpd file like so.\n\n```\nsession\
    \ required pam_env.so \\\n    confile=/etc/security/pam_env.ftpd conf\n```\n\n\
    The default pam_env.conf has uncommented entries.\n\n## System Environment\n\n\
    You can use the system environment file, /etc/environment, to unconditionally\
    \ hammer variables into the user's environment. Unlike shell-specific files like\
    \ /etc/bash.bashrc, /etc/environment affects all users regardless of their shell.\n\
    \nUnlike pam_env.conf, /etc/environment is not interpreted at all. If you want\
    \ interpolation and decision-making, use pam_env.conf instead. Each line contains\
    \ a variable name, an equals sign, and the value, like below.\n\n```\nIRCSERVER=irc.mwl.io\n\
    ```\n\nFurther entries cannot refer back to the value of $IRCSERVER. An entry\
    \ like the below sets the variable $BABBLE to the literal $IRCSERVER rather than\
    \ irc.mwl.io.\n\n```\nBABBLE=$IRCSERVER\n```\n\nThe user's shell interprets these\
    \ values, and can overwrite them.\n\nPam_env uses the flag `readenv` to control\
    \ reading /etc/environment. By default, pam_env reads and uses the environment-file.\
    \ Set readenv to 0 to disable reading the environment.\n```\nsession required\
    \ pam_env.so readenv=0\n```\n\nYou can also set a different environment file with\
    \ the `envfile` flag, an equals sign (=), and the full path to an environment\
    \ file. This lets you set different environments for different services.\n\n##\
    \ User Environments\n\nUsers can have their own environment files, and you can\
    \ have pam_env read and impose those environment files at boot. This is rarely\
    \ a good idea, but sometimes it's the only idea. The `userenv pam_env` flag lets\
    \ you set a file containing desired environment variables. This file is relative\
    \ to the user's home directory. Set the `user_readenv` flag to 1 to enable this\
    \ functionality.\n\nUse userenv only if a particular user's environment must be\
    \ set early in the login process, and you can't set that environment for all users.\n\
    \nThe user environment file works exactly like the system environment.\n\n## pam_env\
    \ and Security\n\nPAM modules can use the user's environment and PAM items to\
    \ make decisions. By invoking pam_env, you're feeding new variables into the PAM\
    \ authentication or session policy. It's possible that an environment variable\
    \ set by pam_env could change the results of a PAM decision.\n\nThe risk increases\
    \ if you allow the use of environment files. While PAM modules are usually carefully\
    \ programmed, I'm very reluctant to declare that a user environment file cannot\
    \ subvert the authentication process. Users are clever. If you permit environment\
    \ files, pay close attention to your system security and behavior.\n\nWhile the\
    \ pam_env manual page declares that pam_env should appear last in any policy,\
    \ to minimize the risk of environment contamination affecting authentication or\
    \ session configuration, this advice has resulted in security flaws such as CVE-2010-4708\
    \ and CVE-2011-3149. Both CentOS and Debian put pam_env first in policies to minimize\
    \ risks.\n\nI recommend avoiding pam_env if possible.\n\n## Conditional Success:\
    \ pam_succeed_if\n\nLinux-PAM's pam_succeed_if module lets you perform a wide\
    \ variety of checks based on user account settings, the service being checked,\
    \ and the connection. You can compare any of these characteristics to values you\
    \ choose.\n\nAt the user level, pam_succeed_if lets you check the username (user),\
    \ UID (uid), GID (gid), shell, and home directory (home). If PAM sets the root\
    \ or host items, you can check those. Finally, you can check the terminal (tty)\
    \ or service.\n\nYou can compare these as numbers, strings, and list members.\
    \ Additionally, you can do basic user group membership comparisons, much like\
    \ pam_wheel. If a comparison matches, the module succeeds. If the comparison doesn't\
    \ match, the module fails.\n\n## String Comparisons\n\nYou can compare just anything\
    \ as a string. Even numbers can be strings, but that's rather limited except for\
    \ precise matches. Pam_succeed_if lets you do exact string comparisons with the\
    \ equals sign (=). You can see if an item doesn't match a string with the != operator.\n\
    \nAdditionally, you can use globs, or shell-style regular expressions. The ~ operator\
    \ succeeds if an item matches a glob, and ~ succeeds if the item doesn't match\
    \ the glob.\n\nHere's a Debian configuration for prohibiting root from logging\
    \ on with GDM.\n\n```\nauth required pam_succeed_if.so user != root quiet_success\n\
    ```\n\nIf the user does not equal the string root, pam_succeed_if returns success.\n\
    \n## Numerical Comparisons\n\nYou can compare the UID and GID to numbers. These\
    \ are most useful for defined application accounts with constant user and group\
    \ ID numbers, like www and tcpdump and the like. Use the standard mathematical\
    \ operators for less than (<), less than equal to (<=), greater (>), greater than\
    \ equal to (>=).\n\nCentos uses pam_succeed_if for UID 1000:\n```\nauth required\
    \ pam_succeed_if.so uid >= 1000\n```\n\nThe `quiet` option tells the module not\
    \ to log successes or failures to syslog.\n\n## String Comparisons\n\nTo use pam_succeed_if\
    \ with a list, it offers the *in* and *notin* operators. Give the list after the\
    \ operator, separated by colons.\n\n```\nauth required pam_succeed_if.so notin\
    \ mwl:jkh:des\n```\n\n## Conditional Rule Processing\n\nLinux-PAM lets you skip\
    \ statements in a PAM policy, as discussed in Chapter 4. This is mostly used with\
    \ pam_succeed_if, creating PAM rules like \"If this is true, skip the next rule.\"\
    \n\n```\nsession [success=1 default=ignore] pam_succeed_if.so service crond quiet\
    \ use_uid required pam_unix.so\n```\n"
  mdcn: "\n\n# 第 5 章：常用的 Linux-PAM 模块\n\n在早前的 pam_env.conf 中，我们分配了用户 $REMOTEHOST 环境变量。在这里，我们利用它来为\
    \ $DISPLAY 分配一个合理的值。然而，如果用户自带了他们的 $DISPLAY，就让他们保留即可。\n\n你可以使用 `confile` 选项为不同的服务设置备用\
    \ PAM 配置。你可能想为 FTP 用户设置一个特殊环境，可以在 /etc/pam.d/ftpd 文件中这样设置：\n\n```\nsession required\
    \ pam_env.so \\\n    confile=/etc/security/pam_env.ftpd conf\n```\n\n默认的 pam_env.conf\
    \ 包含未注释的条目。\n\n## 系统环境\n\n你可以使用系统环境文件 `/etc/environment` 来无条件地将变量强制注入用户环境中。与 /etc/bash.bashrc\
    \ 等特定于 shell 的文件不同，/etc/environment 会影响所有用户，无论他们使用什么 shell。\n\n与 pam_env.conf\
    \ 不同，/etc/environment 完全不会被解析。如果你需要变量插值和逻辑判断，请改用 pam_env.conf。每行包含一个变量名、一个等号和一个值，如下：\n\
    \n```\nIRCSERVER=irc.mwl.io\n```\n\n后续的条目无法引用 $IRCSERVER 的值。像下面这样的条目会将变量 $BABBLE\
    \ 设置为字面量 $IRCSERVER，而不是 irc.mwl.io。\n\n```\nBABBLE=$IRCSERVER\n```\n\n用户的 shell\
    \ 会解释这些值并可以对其进行覆盖。\n\nPam_env 使用 `readenv` 标志来控制是否读取 /etc/environment。默认情况下，pam_env\
    \ 会读取并使用环境文件。将 `readenv` 设置为 0 可禁用读取环境。\n```\nsession required pam_env.so readenv=0\n\
    ```\n\n你还可以通过 `envfile` 标志、等号 (=) 和环境文件的完整路径来设置不同的环境文件。这允许为不同的服务设置不同的环境。\n\n##\
    \ 用户环境\n\n用户可以拥有自己的环境文件，你可以让 pam_env 在启动时读取并强制这些环境文件。这通常不是好主意，但有时它是唯一的办法。`userenv\
    \ pam_env` 标志允许你设置一个包含期望环境变量的文件。该文件相对于用户的家目录。将 `user_readenv` 标志设置为 1 即可启用此功能。\n\
    \n只有当特定用户的环境必须在登录过程早期设置，且你无法为所有用户设置该环境时，才使用 userenv。\n\n用户环境文件的工作与系统环境完全相同。\n\n\
    ## pam_env 与安全\n\nPAM 模块可以使用用户的环境和 PAM 项目来做出决策。通过调用 pam_env，你正在向 PAM 认证或会话策略中输入新变量。pam_env\
    \ 设置的环境变量可能会改变 PAM 决策的结果。\n\n如果你允许使用环境文件，风险将会增加。虽然 PAM 模块通常编写得非常严谨，但我非常不愿意断言用户环境文件无法绕过认证过程。用户是聪明的。如果你允许环境文件，请务密切关注你的系统安全和行为。\n\
    \n虽然 pam_env 帮助页声明 pam_env 应该出现在任何策略的最后，但为了尽量减少环境污染影响认证或会话配置的风险，这种建议导致了如 CVE-2010-4708\
    \ 和 CVE-2011-3149 等安全漏洞。CentOS 和 Debian 都在策略中将 pam_env 置于首位以降低风险。\n\n我建议尽可能避免使用\
    \ pam_env。\n\n## 条件成功：pam_succeed_if\n\nLinux-PAM 的 pam_succeed_if 模块允许你根据用户账户设置、被检查的服务以及连接进行各种检查。你可以将这些特征的任何一个与你选择的值进行比较。\n\
