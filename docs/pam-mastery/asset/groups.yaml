    每当系统管理员考虑认证时，集中认证的话题就会出现。这些讨论大多数都将围绕轻量级目录访问协议 (LDAP) 和 Kerberos 的各种排列组合展开。这会对你有帮助吗？


    是的……也不。


    部署 LDAP 的困难与 PAM 几乎没有关系。配置 LDAP 认证之所以困难，是因为 LDAP 的格式极其灵活。你可以使用任意数量的 LDAP 架构（schemas）或创建自己的。在
    LDAP 部署早期做出的决策将产生你将永远受其影响的影响。更糟糕的是，我们每个参考平台上的 LDAP 模块之间的差异，意味着每个平台都需要唯一的配置。


