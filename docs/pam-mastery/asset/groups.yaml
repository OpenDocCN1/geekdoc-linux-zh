    # 第 0 章：引言


    1995 年，太阳微系统（Sun Microsystems）提出了一种标准的跨平台、跨程序的认证接口。采用该接口的软件可以使用任何提供该接口的认证程序。如果你为此类程序编写一种新的认证机制，可以编写并附加到此接口，将其插入到你所有的软件中。因此，有了可插认证模块（Pluggable
    Authentication Modules，简称 PAM）。


    PAM 模块是实现特定认证方法的代码块。你想通过用户名和密码进行认证吗？那是一个模块。通过硬件令牌吗？那也是一个模块。通过基因扫描、酒精测试仪以及《节奏舞动革命》平台吗？如果存在这些东西，它们也都都是模块。为了保持平台无关性，本书在许多示例中使用了三个模块.¹。模块是共享库，根据配置动态链接到主程序中。是的，“PAM
    模块”这个短语是冗余的，但系统管理员就是这样称呼它们的，而我有太多的战斗要打了，没精力去纠结这个问题了。


    使用 PAM 的软件会接收认证请求。程序将每个请求交给配置好的认证模块，由这些模块告诉服务器是否应该允许该认证请求。


    今天，PAM 是类 Unix 系统最广泛使用的认证标准。它在 Linux 世界以及基于 Solaris 和 BSD 的系统中极其流行。即使是苹果的 OS X
    也使用 PAM，诸如 AIX 和 HP-UX 等商业 UNIX 系统也是。


    > 我本想用 pam_hipster.so 作为示例模块，但它需要一个仅运行在这一迷人架构上的工匠级编译器。此外，代码只能通过路口那家定制自行车店的老兄提供的打卡片获取。


    严格来说，PAM 并不是一个官方认可的标准。没有哪个权威认证机构对一组 PAM 定义和协议盖过公章，并将其宣布为“唯一真版 PAM 规范”。通用桌面环境（CDE）包含了
    PAM，而 CDE 在 20 世纪 90 年代成为了一种标准，PAM 确实在各种标准文档中被引用。大多数现代 PAM 实现都是基于 1997 年尝试将 PAM
    纳入可移植操作系统接口（POSIX）时的一份草案规范。如果你真的想深入研究 PAM，可以查看 X/Open 单点登录服务（XSSO）——可插认证模块文档，该文档可以在包括
    http://pubs.opengroup.org 在内的许多网站上找到。从那时起，人们一直尝试标准化 PAM，但所有尝试都失败了。


    正式标准的缺失意味着 PAM 也缺乏正式定义的语言。取决于你阅读的文档，一组规则可能被称为链（chain）、栈（stack）或策略（policy）。认证过程的一个组件可能是类型（type）、设施（facility）或其他。在书中，我为每个组件提供了最常用的术语，然后选择一个单词作为该组件的通用词。我使用特定词来指代
    PAM 的一部分，并不意味着其他选择都是无效的；它意味着如果你想听懂这些胡言乱语，就需要保持一致性。


    # PAM 的局限性


    PAM 是最广泛使用的认证系统，但它的局限性使得它不适用于某些应用程序。


    PAM 最大的缺点是 PAM 模块无法直接与客户端交互。服务器程序是 PAM 模块和客户端之间的中介，模块与客户端之间的任何交互都限于标准 PAM 接口提供的交互。


    某些认证协议（如 Kerberos）包含了大量的客户端-服务器交互，这远超 PAM 能支持的内容。在 Kerberos 中，PAM 是一个瓶颈。虽然你可以使用
    PAM 模块来支持 Kerberos，但你无法通过 PAM 实现 Kerberos。这就是为什么 SSH 的大部分认证是在 PAM 之外处理的（尽管如果你决定，它可以利用
    PAM）。


    正是这种局限性导致了人们创建了其他认证协议，例如简单认证与安全层（SASL）和通用安全服务 API（GSSAPI），以及围绕这些协议演变出的所有工具和服务。


    并不是所有操作系统都使用 PAM。值得注意的是，OpenBSD BSD 认证将认证请求分发到独立的进程中，而不是动态链接库。BSD 认证比 PAM 更广泛地分离权限，从而降低了风险，但没有实际使用的那样灵活。


    不过，如果你想在接触 PAM 之前体验一下认证管理，请考虑一下在你的所有服务器软件中实现和部署 Kerberos 所的各种工作。虽然这些应用程序挂载到通用的
    Kerberos 域，但你以完全不同的方式配置每一个程序。想象一下，将这乘以今天使用的所有认证协议，以及这些协议与所有不同软件的所有交互。现在 PAM 看起来好多了，不是吗？


    # PAM 实现


    虽然任何人都可以实现 PAM，但你最常遇到三个特定版本：Solaris、Linux-PAM 和 OpenPAM。这些不同版本几乎是兼容的。


    - 2. “几乎兼容”意味着任何支持一个以上版本的人通常不会有麻烦，但偶尔的细微差别会破坏它们那天使般的举止。


    太阳公司首先提出了 PAM，Sun Solaris 有了第一个实现。来自 Solaris 的 PAM 代码进入了开源的 OpenSolaris，在那里不可逆转地成为了公共源代码生态系统的一部分。甲骨文收购了太阳公司，不再公开发布
    Solaris 的更新。


    '
