    ## 第 11 章：密码质量检查


    “password”（密码）这个词很糟糕。每个人都知道，用户除外。几个 PAM 模块允许你对密码实施质量标准，以防止用户使用明显糟糕的密码。这些质量检查器不会消除密码，但会要求用户在设置密码时更有创意。


