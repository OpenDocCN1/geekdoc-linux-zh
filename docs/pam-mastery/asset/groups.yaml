    # 第 3 章：PAM 项、代码和函数


    模块根据这些项（items）做出决策。我经常发现模块会以意想不到的方式固执地使用这些项。当身份验证没有按照你预期的方式进行时，回过检查这些项和模块文档是一个很好的切入点。


    在 PAM 运行策略期间，项可能会发生变化。当模块提供信息时，应用程序可能会更改这些项。某些应用程序在模块返回特定代码时可能会忘记关键的身份验证信息。返回该代码的模块需要放在策略的末尾，在做出决策之后。应用程序可能会为某个项创建占位数据。查看项的值是查明为什么
    PAM 在程序中运行偏离轨迹的好方法。


    PAM 项可能包含安全敏感信息。出于因此，我强烈建议在一次性虚拟机上学习和实验 PAM 项，而不是在你的生产环境中进行。PAM 使用项来包含用户名、主机名、密码和等等事实。并不是所有感知
    PAM 的程序都会定义所有的项。例如，对于 su(1) 来说，定义远程主机是没有意义的。


    以下是常见的 PAM 项。


    ## PAM_SERVICE


    PAM_SERVICE 项包含应用程序请求的策略名称。这通常是调用 PAM 的程序名称——类似于 `su`、`ftpd`、`ssh` 等。你可以重新编译程序以使用不同的服务名称，但通常不会这样做。


    ## PAM_USER


    你可能认为 PAM_USER 会提供请求身份验证的用户名。


    你错了。

    PAM_USER 是某个程序正在尝试身份验证的用户名。例如，如果你通过 FTP 登录，PAM_USER 等于你的 FTP 账户。然而，如果你运行 su root，你正在尝试作为
    root 进行身份验证。因此，PAM_USER 等于 root。


    ## PAM_RUSER


    项 PAM_RUSER 请求用户。它可能是一个远程用户。它可能是请求 su(1) 访问的用户。模块可能会将此设置为与 PAM_USER 相同的值。如果此应用程序仅涉及单个用户账户，它可能不会设置此项。


    ## PAM_TTY


    通过检查 PAM_TTY 查看进程运行在哪个终端上。这可能是一个虚拟终端（如 pts/2）或控制台登录（如 tty2）。如果这是一个没有真正终端的图形应用程序，它可能是
    $DISPLAY 环境变量的内容。


    ## PAM_HOST


    这提供了发生身份验证的主机名。它几乎总是本地主机。


    ## PAM_RHOST


    PAM_RHOST 项给出客户端运行的主机。对于 FTP 这样的应用程序，它包含了客户端的主机名或 IP 地址。并不是所有的客户端服务器应用程序都会设置 PAM_RHOST。此外，本地运行的应用程序（如
    su(1)）通常不会设置 PAM_RHOST。


    ## PAM_CONV


    此项包含应用程序期望的 PAM 会话（conversation）的数据结构。需要研究这个内容的系统管理员就有麻烦了。


    ## PAM_AUTHTOK


    身份验证令牌是用户当前的密码，或类似密码的内容。


    ## PAM_OLDAUTHTOK


    这是用户过期的密码。你在更改密码时会看到它。


    ## PAM_USER_PROMPT


    这包含请求身份验证用户名的提示符。


    ## PAM_AUTHTOK_PROMPT


    此项提供请求密码的提示符。


    ## PAM_OLDAUTHTOK_PROMPT


    这包含请求过期密码的提示符。当用户在登录前需要更改密码时，你会看到它。


    ## PAM_SM_FUNCTION


    Linux-PAM 增加了 PAM_SM_FUNCTION 来存储调用函数时使用的是哪个 PAM 服务模块。大多数系统管理员不需要这个，但不要让它的突然出现困扰到你。


    ## PAM_TYPE


    Linux-PAM 还增加了 PAM_TYPE 来显示调用模块的策略类型。它包含 auth、account、password 或 session。Linux-PAM
    的调用几乎总是定义 PAM_TYPE。


    我将在本章后面讨论 PAM 函数和服务模块函数。


    ## 使用 pam_exec 读取项


    虽然 PAM 模块之间会传递项，但它们并没有为向普通系统管理员显示这些项提供接口。Linux-PAM 系统提供了 pam_warn 来从 PAM 导出信息，但它并不是通用的。我们将在第
    6 章看到 pam_warn。然而，每个 Unix 类系统都支持使用 pam_exec 模块将调试信息从策略中拷贝出来。第 6 和第 7 章详细介绍了 pam_exec，但我们在这里提一下。


    Pam_exec 允许你作为策略的一部分运行任意命令。大多数情况下，这是一个 shell 脚本。（你可以将简单命令放入 pam_exec 语句中，但我看来那样感觉很脆弱。）我们将使用一个简单的示例将策略中的所有
    PAM 项复制到系统日志中。几乎每个操作系统都包含了 pam_exec。


    这是一个用于捕获 PAM 项并将其写入系统日志的简单脚本。我将其安装为 /usr/local/scripts/pamvarlog.sh，但你可以将其放在你喜欢的位置。


    ```sh

    #!/bin/sh

    set | grep PAM | xargs logger

    ```


    这提取所有环境项，获取任何包含 PAM 的项或值，并将它们发送到系统日志。


    现在将此脚本附加到你的策略中。你希望这个脚本放在顶部。


    ## PAM 返回代码


    成功和失败并不总是界限。就像政治有灰色地带一样，PAM 除了“是”和“否”之外有很多答案。代码的准确解释取决于你如何进行身份验证。


    当 PAM 调用模块时，模块恰好返回一个结果。该代码的准确解释取决于你是在本地拥有密码还是在 LDAP 中拥有。


    PAM 包含了 30 个返回代码，编号从 0 到 29。其中许多只在怪异的情况下或系统错误时出现。不匹配的二进制类型和无法加载的库会出现在系统日志中，这是每个系统管理员排故障程序中熟悉的部分。有关完整列表，请查看
    X/Open Single Sign-On (XSSO) 可插身份验证模块规范或 pam(3)。


    每个返回代码都有一个正式名称，通常全大写，并以 PAM 开头。你会看到像 PAM_SUCCESS、PAM_AUTH_ERR 等返回代码。你可能会看到从 0
    到 29 的返回代码数字。你可能还会看到小写的返回代码，且没有开头的 PAM_。也就是说，返回代码 PAM_SUCCESS、0 和 success 指的是同一种情况。


    许多返回代码似乎有重叠。对于系统程序员来说它们没有重叠，但对于系统管理员来说有。像 PAM_CRED_EXPIRED 和 PAM_AUTHTOK_EXPIRED
    这样的返回代码意味着身份验证凭据或密码过期。得到哪种错误取决于你如何进行身份验证，但对于系统管理员来说，它们都意味着用户的密码或其他身份验证令牌不再有效。


    你不需要知道每个 PAM 返回代码的存在、每个 PAM 调用只返回一个代码，以及当代码出现时如何获取更多信息。以下是你最可能遇到的 PAM 返回代码。


    # PAM_SUCCESS (0)


    请求完全成功。用户身份验证正确。这是一个无条件的“是”。


    '
