    使用 `requisite` 控制可以给用户提示身份验证是在哪里失败的。入侵者可以利用这些信息更精确地针对其攻击。只有当你有非常充分的理由不运行后续控制时，才使用
    `requisite`。不要花费时间、精力或注意力去优化登录失败。此策略使用 `requisite` 控制是因为基因扫描开销很大，避免不必要的扫描可以节省费用。


    ## Optional (可选)


    带有 `optional`（可选）控制的语句对成功或失败的影响很小。操作系统使用 `optional` 控制来管理可能部署或未配置的功能，例如 SSH 代理和
    Kerberos。你还会部署 `optional` 控制来为认证会话添加额外功能。


    当仅当策略中没有其他模块表达意见时，`optional` 控制才能允许或拒绝访问。如果你有一组


    # 第 1 章：PAM 组件


    足够的 `sufficient`（充分的）语句和一个 `optional` 语句，且没有足够的 `sufficient` 语句允许访问，那么该 `optional`
    语句就可以允许或拒绝访问。


    这里是一个使用 `optional` 控制的策略。


    ```

    auth required pam_breathalyzer.so

    auth required pam_ddr.so

    auth required pam_genescan.so

    auth optional pam_faildelay.so

    ```


    我们的三个示例模块仍然是 `required` 的：所有模块必须成功，用户才能获得访问权限。


    新模块 `pam_faildelay.so` 在登录尝试之间设置了延迟。如果用户的登录尝试被拒绝，该模块会延迟几秒钟向用户返回认证提示。此模块对用户的认证凭据不进行任何操作。由于它改变了
    PAM 的行为，你可能会希望它总是返回成功。然而，在极少数 `pam_faildelay.so` 失败的情况下，你不希望这种失败会阻止登录。


    带有 `optional` 控制的语句通常位于策略的开头。你可能不希望 `requisite` 控制的失败阻塞 `optional` 模块。然而，我刻意将
    `pam_faildelay` 放在此策略的末尾，因为我不想在第一次登录尝试之前引入延迟。


    我应该提到，使用 `pam_faildelay` 本身就是一个很糟糕的主意；正如安全公告所示，此类延迟应该构建在应用程序内部，而不是通过 PAM 提供。理想情况下，每次认证尝试都应该花费恒定的时间，而不是在尝试之间提供恒定的延迟。尽管如此，这是一个流行的模块，所以你至少需要识别它。


    会话类型是 `optional` 控制最常见的用场景。


