  - '[PAGE 82]


    # Chapter 4: Linux-PAM Extended Controls and Substacks


    PAM defines four common control statements: required, requisite, sufficient, and
    optional (as well as the widely-ignored binding). These controls determine how
    a PAM module’s successes and failures affect a user’s authentication.


    Linux-PAM offers additional extended control statements that let you fine-tune
    responses, as well as the substack parameter that lets you divert policy processing.
    These appear only in Linux-PAM.


    # Extended Controls


    A yes from a PAM module is always PAM_SUCCESS, but a no comes in endless flavors.
    Each PAM module might return one of several different responses to a query. With
    extended controls, you can fine-tune how a PAM statement handles rejection based
    on these responses.¹⁰ Remember, a module returns one and only one response to
    each query.


    Extended controls replace the four PAM controls with a specific instruction for
    each response module return, but a generic-catch-all instruction for any responses
    you don’t specify. “If this module returns X, block access. If the module returns
    Y, that’s good enough. If the module returns Z, immediately grant access. Any
    other answer, try the next module.


    > If only a human being’s handling of rejection was so easily tuned!'
  - '[PAGE 83]


    # Chapter 4: Linux-PAM Extended Controls and Stacks


    Identify extended controls by using square brackets ([]) around them. Here''s
    an example of an extended control from CentOS, for the module pam_secrety.


    ```

    auth [user_unknown=ignore success=ok ignore=ignore \ default=-bad] pam_secrety.so

    ```


    Each entry within the brackets represents a PAM response, with the leading PAM_
    stripped off, in lower case. An equals sign separates the response from the instruction
    on how to handle that. This says when this module returns PAM_USER_UNKNOWN the
    policy should take the action “ignore.” When the module returns PAM_SUCCESS, follow
    the action called “ok.” If the response is PAM_IGNORE, take the action “ignore.”
    The default instruction, used when the module responds with anything else, is
    “bad.”


    The pam_secrety manual page lists five possible response codes: PAM_SUCCESS, PAM_AUTH_ERR,
    PAM_INCOMPLETE, PAM_SERVICE_ERR, and PAM_USER_UNKNOWN. The extended control defines
    custom actions for PAM_SUCCESS and PAM_USER_UNKNOWN. All of the other cases tell
    PAM to take the action “bad.”


    # Extended Control Actions


    Consider PAM policies for a moment. Most statements in a policy affect the decision
    on whether or not to permit access. At any given point the policy might have a
    state like“allow access if nobody else objects” or “we’re definitely rejecting
    the request, which you later modules can do your book-keeping.” Linux-PAM’s seven
    extended control actions are designed to alter the state of that policy.


    The bad action tells PAM that the authentication request has failed. That''s why
    our example above uses it as the default—we care about a couple specific failures,
    but for most failures, we just say “no.” If'
- md: "\n# Chapter 4: Linux-PAM Extended Controls and Substacks\n\nmodule reply triggers\
    \ bad, it's as if a required module failed. PAM continues processing the policy,\
    \ but authentication is ultimately rejected unless deliberately reset.\n\nThe\
    \ die action tells PAM that the authentication request has failed, and it must\
    \ immediately stop processing the policy. Modules that follow this one will not\
    \ get processed. When a reply triggers die, the PAM policy behaves as if a requisite\
    \ module failed.\n\nThe ok action tells PAM that the authentication request was\
    \ successful. Access is allowed, provided no other module objects. It normally\
    \ applied to the PAM_SUCCESS return code. An ok cannot override a bad response\
    \ from elsewhere in the PAM policy. When a reply triggers ok, the PAM policy behaves\
    \ like a required module succeeded.\n\nThe done action tells PAM that the authentication\
    \ request was successful, and that PAM should immediately stop processing the\
    \ policy. If nothing earlier in the policy returned bad, the policy permits access.\
    \ When a reply triggers done, the PAM policy behaves like a sufficient module\
    \ succeeded.\n\nThe ignore action indicates that this response doesn't alter the\
    \ policy's response. An earlier bad or ok stands. The module can still carry out\
    \ other actions, such as logging or running unrelated commands, but PAM doesn't\
    \ let the results of the module's work or checks its decision on. It's like the\
    \ most common case of the optional control.\n\nThe reset action tells PAM to throw\
    \ away any previous bad or ok results and keep a new success or failure from the\
    \ remaining modules. It's unique to Linux-PAM. As with the binding control, I've\
    \ never seen reset deployed in production.\n\nLast, you can specify a number as\
    \ an action. Triggering the number tells Linux-PAM to skip that many following\
    \ modules in the policy. A number is most often used with the pam_success_if module,\
    \ as discussed in Chapter 5.\n\n# Chapter 4: Linux-PAM Extended Controls and Substacks\n\
    \n# Standard Controls in Extended Format\n\nEach of the standard PAM controls\
    \ can be expressed in the Linux-PAM extended control format. Understanding these\
    \ can improve your understanding of both the extended controls and the traditional\
    \ controls.\n\nThe required control can be expressed like so.\n\n```\n[success=ok\
    \ new_authtok_reqd=ok ignore=ignore default=bad]\n```\n\nIf the PAM module returns\
    \ PAM_SUCCESS or PAM_NEW_AUTHTOK_REQD, this control takes the ok action. Authentication\
    \ is successful. If the module returns PAM_IGNORE, PAM ignores the module. If\
    \ the module returns anything else, the bad action is taken and authentication\
    \ fails.\n\nA requisite control looks very similar.\n\n```\n[success=ok new_authtok_reqd=ok\
    \ ignore=ignore default=die]\n```\n\nThe only difference between requisite and\
    \ required is the default action. Where a required control fails to bad, a requisite\
    \ control defaults to die. If a module with this control fails, access is rejected\
    \ and processing stops immediately.\n\nSufficient controls look entirely different.\n\
    \n```\n[success=done new_authtok_reqd=done default=ignore]\n```\n\nIf the module\
    \ returns PAM_SUCCESS or PAM_NEW_AUTHTOK_REQD, the policy immediately permits\
    \ access. Thanks to the done action, no further processing happens. Any other\
    \ response doesn't affect the policy's voting, although the module might take\
    \ other action on the system.\n\nThe optional control resembles sufficient.\n\n\
    ```\n[success=ok new_authtok_reqd=ok default=ignore]\n```\n\nHere, a PAM_SUCCESS\
    \ or PAM_NEW_AUTHTOK_REQD gets this module to say ok and permit access. Any other\
    \ result means that this module permits nor denies access. Processing continues,\
    \ but other modules can still veto access.\n\n# Substacks\n\nLinux-PAM supports\
    \ processing detours, or substacks. While an include pulls the appropriate rules\
    \ from that file into the PAM policy, PAM processes a substack separately. A control\
    \ in a substack can't make the whole policy stop processing—it can only terminate\
    \ the substack and return to the main PAM policy. A decision made in a substack\
    \ does affect the policy’s decision to permit or deny access.\n\nLet’s walk through\
    \ a common substack example. Here’s the policy from CentOS `/etc/pam.d/login`,\
    \ which regulates console logins.\n\n```\nauth [user_unknown=ignore success=ok\
    \ ignore=ignore \\\n    default=bad] pam_security.so\nauth substack system-auth\n\
    auth include postlogin\n```\n\nThis policy starts by checking the pam_security\
    \ module (Chapter 2). It drops into the substack contained in the file system-auth.\
    \ Many CentOS PAM configurations use system-auth as a substack, permitting a common\
    \ configuration across multiple services.\n\n```\nauth required pam_env.so\nauth\
    \ sufficient pam_fprint.so\nauth sufficient pam_unix.so nullock try_first_pass\n\
    auth requisite pam_succeed.if_so \\\nauth required uid >= 1000 quiet_success\n\
    pam_deny.so\n```\n\nConsider how this substack gets processed. The first module,\
    \ pam_env (Chapter 5), is required. If this module fails, the request is rejected\
    \ even if later modules return success. We then have two sufficient modules. Either\
    \ one of these can return success and immediately terminate processing the substack.\
    \ The fourth is requisite, meaning that if it's successful, policy processing\
    \ immediately ends. The last module, pam_deny, always returns failure.\n\nThe\
    \ substack has three control statements that can immediately terminate the auth\
    \ policy—two required and a requisite. If any of these trigger in the substack,\
    \ though, processing immediately ends.ackackackackackackackackackpackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackackack.\n\
    \n# Chapter 5: Popular Linux-PAM Modules\n\nThe pam-env module pulls its settings\
    \ from the pam-env-specific configuration file, the system environment file, and\
    \ the user's environment files.\n\n# pam-env Configuration\n\nThe primary pam_env\
    \ configuration file, /etc/security/pam_env.conf, lets you set environment variables\
    \ that vary depending on how the user connects. You provide a default value, and\
    \ then possibly a conditional alternative, or override, if desired. The rules\
    \ have this general format.\n\nvariable default override\n\nIf a statement has\
    \ no override, pam_env sets the environment variable for the user. Here we unconditionally\
    \ set the EDITOR variable.\n\nEDITOR pico\n\nA user can override this setting\
    \ with the usual shell configuration, but this lets you set a reasonable default.\n\
    \nIf this was all pam_env let you do, it'd be pretty lame. pam_env also lets the\
    \ system make decisions based on the PAM environment. PAM sets its own variables,\
    \ and a connecting user brings part of their own environment along. Look at the\
    \ following example.\n\n```\nREMOTEHOST DEFAULT=localhost OVERRIDE=${PAM_RHOST}\n\
    ```\n\nThe default of $REMOTEHOST is localhost. If nothing else, assume the user\
    \ connected from the local machine. An override is available, though. If the PAM\
    \ item PAM_RHOST exists, we $REMOTEHOST to that value. The {} syntax indicates\
    \ pam_env should check for a PAM item.\n\nYou might want to rely on environment\
    \ variables instead, such as $SSH_CLIENT or $DISPLAY. Use {} to check for a user\
    \ environment variable.\n\n```\nDISPLAY DEFAULT=${REMOTEHOST}:0.0 OVERRIDE=${DISPLAY}\n\
    ```\n"
