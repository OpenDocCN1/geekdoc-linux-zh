    # Chapter 1: PAM Components


    FreeBSD systems also separate configuring core system components and add-on packages.
    While the PAM configurations live in /etc/pam.d, add-on packages have their PAM
    configurations in /usr/local/etc/pam.d. You might find similar variations in other
    operating systems.


    Systems that use /etc/pam.d are far more common than those relying on /etc/pam.conf.
    The examples in this book assume you''re using per-service PAM configuration files.
    If you''re on a Solaris-based system, you''ll need to add the service name to
