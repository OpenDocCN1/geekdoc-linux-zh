    `WINDOW_SIZE` 选项决定了口令对时间的敏感性。`1` 表示系统时钟指定的精确当前口令是可以接受的。数值每增加 2，意味着当前口令前后各多接受一个额外的口令。将此值设置为
    17（如果你遵循了 google-authenticator 的建议，允许四分钟窗口），意味着当前时间的口令加上之前的 8 个代码和之后的 8 个代码都是允许的。


    `DISALLOW_REUSE` 选项意味着每个口令只能使用一次。


    文件末尾记录着用户剩余的一次性密码。虽然你可能想向此文件添加自己的一次性代码，但 GA 会对应急代码进行额外的验证。在文件末尾添加 `00000001` 是不起作用的。此外，编辑应急代码的操作会导致剩余代码失效。


    既然我们已经安全了远程访问，让我们考虑一些对本地用户有用的东西。


    ## 第 10 章：使用 SSH 密钥访问控制台


    系统管理员有一套晨间流程。在摄入咖啡、穿上裤子、再喝咖啡并踉跄走进办公室后，我们瘫坐在工作站前。我们使用用户名和密码登录。大多数人会输入 SSH 密钥短语并将密钥加载到
    SSH agent 中。此时，我们就可以开始工作了。这需要对工作站进行两次身份验证：一次是使用用户名和密码，另是使用用户名和 SSH 密钥。


    `pam_ssh` 模块将 SSH 密钥管理集成到登录过程中。用户可以去其工作站并仅使用其 SSH 密钥登录。用户不再针对 `/etc/passwd` 进行验证，而是使用其账户中的
    SSH 私钥进行验证。验证成功后，`pam_ssh` 会启动一个 SSH agent并将解密后的私钥存储在 agent 中。


    与书中讨论的其他 PAM 模块不同，`pam_ssh` 对工作站最有用，而且仅次于工作站。你绝对不想基于存储在服务器本身上的 SSH 密钥文件来对服务器进行验证。普通用户绝不向远程服务器提供短语。你可能不想在销售人员的机器上开启此功能。但许多系统管理员发现个人笔记本电脑上的
    `pam_ssh` 非常方便。


    `pam_ssh` 为 `auth` 和 `session` 类型提供服务。在 `auth` 策略中使用，`pam_ssh` 会提示用户输入短语。它尝试用该短语解密用户的
    SSH 私钥，这类似于 `ssh(1)` 或 `ssh-add(1)` 的做法。如果短语正确，该模块返回 `PAM_SUCCESS`。否则，模块失败。在 `session`
    策略中，`pam_ssh` 为用户启动一个 SSH agent并将密钥添加到 agent 中。


    FreeBSD 默认包含 `pam_ssh`。CentOS 有 `pam_ssh` 软件包，而 Debian 提供了 `libpam-ssh` 软件包。这些模块不仅打包方式不同，其代码也不同。FreeBSD
    导入了原始的 `pam_ssh` 并进行了改进。该代码从 FreeBSD 中提取出来，并为 CentOS 和 Debian 分支成了略有不同的版本。每个版本支持不同的功能。我们将分别介绍每个系统的
    `pam_ssh`。


    此外，每个操作系统使用 `pam_ssh` 的方式也不同。我们将以此模块为机会，探索一个非常的模块如何通过完全不同的 PAM 语句进行配置并产生非常不同的行为。


    我们涵盖的所有 `pam_ssh` 版本都支持 `try_first_pass`、`use_first_pass` 和 `debug` 选项。


    ### 一个模块，不同策略


    我们的三个目标平台部署 `pam_ssh` 的方式各异。CentOS 没有对放置 `pam_ssh` 语句提供任何建议。FreeBSD 在默认安装中包含了
    `pam_ssh`。`pam_ssh` 的语句出现在 FreeBSD 的标准配置文件中，但它们被注释掉了。Debian 的 `libpam-ssh` 软件包不仅安装了
    `pam_ssh`，还添加了 PAM 语句来启用该模块。


    我们将先考虑简单的 FreeBSD 情况，然后是 Debian。


    ### FreeBSD 和 pam_ssh


    FreeBSD 提供了在范围内和单个服务中启用 `pam_ssh` 的示例。我不想使用 `pam_ssh` 来验证我工作站上的 FTP 服务器或通过串口，因此我不会在全局范围内启用它。我想在图形化控制台登录时使用它，`/etc/pam.d/xdm`
    文件中有 `pam_ssh` 的注释条目。取消注释可以为我们提供 `auth` 和 `session` 策略。


    ```

    auth sufficient pam_ssh.so no_warn try_first_pass

    auth required pam_unix.so no_warn try_first_pass

    session required pam_ssh.so want_agent

    session required pam_lastlog.so no_fail

    ```


    `auth` 策略只有两条语句。第一条 `pam_ssh` 是 `sufficient`（充分的）。登录将提示用户输入其 SSH 密钥短语。如果短语正确，`sufficient`
    语句意味着立即授予访问。`no_warn` 标志禁用警告。`try_first_pass` 标志告诉 `pam_ssh` 尝试任何早期的密码。由于这是策略中的第一条语句，不会有更早的密码。


    第二个 `auth` 语句 `pam_unix` 是用于针对 `/etc/password` 进行传统的 Unix 身份验证。只有当 `pam_ssh` 失败时，才会触发此身份验证规则。通过
    `try_first_pass` 参数，该模块尝试使用之前输入的 SSH 密钥短语作为 Unix 系统密码。如果你不小心输入了密码而不是短语，系统会让你进入。


    综合来看，这意味着用户首先会被提示输入用户名和密码。在 `session` 策略中，`pam_ssh` 设置了 agent。`want_agent` 选项是
    FreeBSD 特有的。


    ### Debian 和 pam_ssh


    当在 Debian 上安装 `pam-ssh` 时，软件包会向 `/etc/pam.d/common-auth` 和 `/etc/pam.d/common-session`
    添加 PAM 语句。虽然 Debian 的 `libpam-ssh` 与原始版本不同，但逻辑仍然相似。


    ```

    auth [success=1 default=ignore] pam_unix.so nullok_secure

    auth requisite pam_deny.so

    auth required pam_permit.so

    auth optional pam_ssh.so use_first_pass

    ```


