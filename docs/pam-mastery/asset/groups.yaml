    # Chapter 0: Introduction


    While operating system vendors could coordinate their PAM configurations and come
    up with something that every sysadmin could recognize and use, nobody''s likely
    to do that. Instead, every open source platform welcomes other OS packagers to
    copy their obviously superior design. Therefore, every platform configures PAM
    differently.


    When you first dive into an operating system''s PAM setup, allocate time to understanding
    just how the packagers assembled everything. It''s very easy to assume that the
    people who designed the PAM policies for an unfamiliar operating system are insane.
    Easy, but counterproductive. Study these unfamiliar configurations and figure
    out why they''re put together that way. Not only will you understand the PAM implementation,
    but you''ll gain insight into how the operating system packagers think—and that
    insight will help you master the rest of the system.


    Chapter 10 illustrates how each of our three reference platforms can use one PAM
    module in entirely different ways, for reasons that make perfect sense to the
    operating system packers.


    # PAM Commonalities


    All these different implementations share common structure and configuration syntax.
    Maybe you won''t initially understand why Debian puts a “deny authentication”
    rule near the top of its system-wide configuration, but you''ll understand the
    syntax of the policies and be able to puzzle it out. Most PAM implementations
    share common module names, with a few exceptions I''ll note.


    One thing that every implementation and operating system has in common is: they
    have bugs. the long-standard pam_mkhomedir module dies and dies on CentOS. (Red
    Hat has reasons for this, and Chapter 6 shows how to work around it.)


    The options use_first_pass and try_first_pass fail on pam_unix on FreeBSD. Always
    read the operating system documentation, and if something seems weird, check the
    mailing list archives and discussion boards for other people with the same problem.
    If you truly understand the numerous bugs in your preferred PAM implementation,
    you won''t feel like laughing at the bugs in other versions.


    # PAM Management Tools


    Some Linux distributions provide tools to manage PAM. These tools allow you to
    change authentication methods without editing the nasty configuration files. They
    work for many simple deployments. But if you want to figure out why your system
    behaves in a certain way, or if you want to do something complicated, these tools
    limit you scenarios the tool authors imagined. And understanding weird behavior
    absolutely requires understanding how the rules work, both as standalone statements
    and as components of a policy.


    These add-on tools overwrite the existing PAM configurations. You must either
    learn to compel these tools to create the needed configuration, or abandon them
    and manage authentication manually. In either case, understanding the configuration
    makes you a better sysadmin.


    # Target Platforms


    This book mostly covers PAM as it''s deployed in average Linux and BSD versions.
    The material on how PAM processes policies is also applicable to Oracle Solaris,
    OpenSolaris-derived systems, OS X, and proprietary UNIX systems, but these systems
    use very different core PAM modules. You can add many of the PAM modules I''ll
    discuss to these systems, but you''ll have to carefully study the configuration
    files.


    I specifically target three operating systems with three different configuration
    styles: CentOS, Debian, and FreeBSD.


    # CentOS


    CentOS is a representative of the Red Hat Linux branch of Linux. This book uses
    CentOS rather than official Red Hat Linux because CentOS is free and I''m a cheapskate.
    CentOS uses Linux-PAM. Many Linux distributions are built on top of Red Hat Linux,
    and their derivatives should be able to use CentOS PAM configurations.


    Some PAM modules covered herein are in the EPEL package repository. To use these
    modules you''ll need to enable that repository, build your own packages, or make
    other arrangements.


    CentOS and related Linux distributions provide a command-line tool to configure
    PAM, authconfig(8).


    # Debian


    The Debian branch of Linux has a different design philosophy than the Red Hat
    Linux branch. It supports much of the same software, but the management interface
    is almost completely different. Debian uses Linux-PAM. Many Linux distributions,
    such as Ubuntu and Kali Linux, are built on top of Debian, and should be able
    to use Debian configurations.


    Some PAM modules discussed in this book are in the experimental package repository.
    You''ll need to either enable that repo or build your own packages.


    Like CentOS, Debian includes an add-on tool that writes PAM configuration files
    for you. Unlike CentOS, Debian uses pam-auth-update(8), a tool written by Debian
    folks specifically for Debian.


    # FreeBSD


    FreeBSD is our OpenPAM reference platform. PAM-capable BSD platforms, such as
    Dragonfly and NetBSD, use OpenPAM, as Apple''s OS X. Configurations that work
    on FreeBSD should work on any BSD platform except OS X. (OS X uses completely
    different PAM modules than any other OpenPAM implementation, making it a special
    case for almost everything.)


    A few Linux distributions use OpenPAM, or permit easily replacing their PAM implementation
    with the other. You''ll configure these operating systems much like any other
    PAM implementation, but you might find some PAM modules have slightly different
    names. If you''re using a Linux distribution with OpenPAM and get confused looking
    for a module, check the CentOS or Debian examples to find the name the Linux flocks
    assign to module.


    # Other Platforms


    PAM might not be a monolithic standard, but the basics of its configuration are
    common across implementations. Sysadmins managing Solaris derivatives or OS X
    can use the guidance in here to create their own PAM configurations.


    Much of the guidance on add-on PAM modules, such as Google Authenticator or SSH
    agent authentication, applies directly to every platform. The details of configuring
    a password quality checker don''t vary much between operating systems, even if
    where you place that module in a policy differs.


    # PAM and OpenSSH


    OpenSSH''s server sshd(8) doesn''t really need PAM. The industry standard method
    for SSH authentication—keys—doesn''t fit within PAM. The SSH server does need
    to check passwords, which does involve PAM somewhere along the way, but it''s
    a simple-minded check. If you''re using one-factor authentication, the simple
    password check works just fine.


    If you want complicated PAM-based authentication, though, by telling sshd(8) to
    link with PAM. The UsePAM option in ssh_config to yes. This enables PAM-based
