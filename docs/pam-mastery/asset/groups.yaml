    # 第 1 章：PAM 组件


    使用包含（includes）可以允许系统管理员在一个位置维护多个服务的 PAM 配置。更改包含的文件会使更改立即传播到所有涉及的服务中。


    然而，所有的操作系统使用的包含策略设计都略有不同。许多 CentOS PAM 模块包含了 `system-auth` 配置文件。FreeBSD 使用 `/etc/pam.d/system`。Debian
    则按类型拆分中心包含文件，例如 `common-auth`、`common-session` 等。


    Debian 使用 `@include` 来引入整个整个文件。这里是 Debian 的 `/etc/pam.d/sudo` 配置。


    ```

    @include common-auth

    @include common-account

    @include common-session-noninteractive

    ```


    此配置表示“使用与其他人完全相同的身份验证方法”。


    包含此类文件的优点是它非常方便在策略的开头或结尾添加条目。如果我想为某一个程序为某个类型添加一个 PAM 模块，我可以将其添加到该程序的文件。在这里，我告诉
    Debian 的 sudo 在所有常规认证方法之外，还需要进行酒精呼吸测试（breathalyzer test）。


    ```

    auth required pam_breathalyzer.so

    @include common-auth

    @include common-account

    @include common-session-noninteractive

    ```


    文件提高了你的灵活性，而无需你维护多份 PAM 策略副本。


    Linux-PAM 还支持子栈（substacks），它们与包含类似。关于子栈的讨论请参见第 4 章。


    # 第 1 章：PAM 组件


    ## 模块与参数


    每个 PAM 语句末尾模块及其参数决定了规则规则实现的功能或行为。每个模块都提供了如检查密码、配置主目录或分配终端等功能。


    我们将通过安装和使用 PAM 模块来安装大多数功能。


    ## 模块上下文


    在你探索 PAM 模块时，你会发现许多模块被多个不同的 PAM 类型调用。例如，`pam_unix.so` 模块出现在 `auth`、`account` 和
    `password` 策略中。模块的行为以及它提供的服务取决于调用它的类型。如果 `auth` 类型调用 `pam_unix.so`，该模块会检查密码。`account`
    类型从 `pam_unix.so` 获取账户可用性信息。`password` 类型使用 `pam_unix.so` 修改系统密码文件。


    并不是每个模块都为所有类型提供服务。非常有用的模块仅支持一种类型，但为该类型执行至关重要的服务。例如，`pam_mkhomedir.so` 模块作为 `session`
    类型的一部分，为通过验证的用户创建不存在的主目录。这与密码无关，但对于大型企业至关重要。


    ## 模块参数


    模块参数（或标志）用于配置模块本身。模块是否应该告诉用户它拒绝请求的原因？或者你是否想要激活可选功能？模块参数可以启用和禁用这些可选功能。


    在这里，我们为 `pam_unix` 模块设置了 `nullock` 和 `try_first_pass` 标志。


    ```

    auth sufficient pam_unix.so nullok try_first_pass

    ```


    某些标志带有它们自己的参数，允许你设置限制或切换功能。


    ```

    account required pam_breathalyzer.so bal<8

    account required pam_genescan.so neanderthal=0

    ```


    酒精呼吸仪本身并不知道你组织对酒精的容忍度。在这个示例中，如果用户的血液酒精浓度低于 0.08，则账户是可用的。我是如何知道这个参数的？我阅读了模块文档。同样，为了符合美国反歧视法，我们告诉基因扫描器不要进行尼安德特人检查。


    模块在不同的上下文中使用时可能需要完全不同的参数。


    ## 常用模块参数


    虽然任何人都可以编写 PAM 模块，但这并不意味着每个人重新发明模块配置。大多数 PAM 模块接受这些用于通用功能的常用参数。


    PAM 模块并不要求接受这些参数中的任何一个。编写良好的当且不支持某个标志功能的 PAM 模块会静地忽略它。


    ## debug


    `debug` 标志告诉模块通过 `syslog` 记录调试信息。PAM 调试消息以 `auth` 设施优先级 `debug` 记录。在 `pam_unix.so`
    中添加 `debug` 标志并观察系统日志将教你很多关于你的 PAM 实现如何处理身份验证请求的内容。


    但并不是所有的 PAM 模块都支持调试。如果你在使用 `debug` 标志时 PAM 模块表现异常，请将其视为该模块编写糟糕的提示。你可能被迫继续该模块，但至少你收到了警告。


    在 OpenPAM 中，`debug` 标志不仅触发 PAM 行为的调试输出，还会触发共享库内部的调试。正如第 3 章所述，你会看到调用了哪个服务函数以及返回了什么。


    通用的 PAM 错误（例如列出一个不存在的模块）通常出现在系统的安全日志中（`/var/log/secure` 或 `/var/log/auth`）。


    ## no_warn


    PAM 模块提供关于它们为何拒绝访问请求的反馈。启用 `no_warn` 会让该反馈沉默。虽然分析器通常告诉用户他们无法登录是因为太醉了找不到脸，更不用说编程了，添加
    `no_warn` 会关闭该警告。


    ## use_first_pass


    主机的身份验证系统可能被设置为通过几种方法中的每一种尝试验证用户名和密码。例如，一个主机可能会尝试本地密码文件和 LDAP。虽然每个 PAM 模块都可以提示用户输入密码，但
    `use_first_pass` 选项告诉模块使用已经输入的密码。如果没有此选项，模块可能会再次提示用户密码。


    ## 第 1 章：PAM 组件


    ## try_first_pass


    主机的身份验证系统可能被设置为通过几种方法中的每一种尝试验证用户名和密码。例如，一个主机可能会尝试本地密码文件和 LDAP。虽然每个 PAM 模块都可以提示用户输入密码，但
    `use_first_pass` 选项告诉模块使用已经输入的密码。如果没有此选项，模块可能会再次提示用户密码。


    ## 第 1 章：PAM 组件


    ## mapped_pass


    主机的身份验证系统可能被设置为通过几种方法中的每一种尝试验证用户名和密码。一个主机可能会尝试本地密码文件和 LDAP。虽然每个 PAM 模块都可以提示用户输入密码，但
    `use_first_pass` 选项告诉模块使用已经输入的密码。如果没有此选项，模块可能会再次提示用户密码。


    ## 第 1 章：PAM 组件


    ## expose_account


    人类非常不听从指令。许多应用程序共享一组默认值。如果 PAM 找不到应用程序的策略，它将调用 `/etc/pam.d/other` 中的“other”策略。


    ## 第 1 章：PAM 组件


    ## 默认策略


    并不是所有应用程序都需要自己的策略。许多应用程序共享一组默认值。如果 PAM 找不到应用程序的策略，它将调用 `/etc/pam.d/other` 中的“other”策略。


    ## 第 1 章：PAM 组件


    ## 策略处理与结果


    PAM *策略*（policy）或*链*（chain）是针对服务的同一种类型的规则组。一个应用程序可能有 `auth`、`account`、`session`
    和 `password` 策略，也可能只有其中一些。毕竟 FTP 不需要（也不应该！）用户更改密码。


    这里是 FreeBSD 系统的完整默认系统。


    | | | |

    | :--- | :--- | :--- |

    | auth sufficient | pam_opie.so | no_warn_no_fake_prompts |

    | auth requisite | pam_iteaccess.so | no_warn allow_local |

    | auth required | pam_unix.so | no_warn_try_first_pass nullock |

    | account required | pam_login_access.so | |

    | account required | pam_unix.so | |

    | session required | pam_lastlog.so | no_fail |

    | password required | pam_unix.so | no_warn_try_first_pass |


    `auth` 策略有三个语句。`account` 策略有两个语句，而 `session` 和 `password` 只有一个语句。


    每个策略都负责允许或拒绝某种类型的访问请求。它根据策略中的语句做出决定。考虑上述三条语句的 `auth` 策略。当用户运行调用此内容的程序时，PAM 首先调用
    `pam_opie` 模块并向其提供所需信息。`pam_opie` 模块具有足够的控制权：如果它成功，`auth` 策略将立即停止处理策略。第一个模块失败并不意味着该模块反对让用户登录——只是不打算说。当一个足够的模块失败时，PAM
    将继续处理策略。这在计算中等同于“去问你妈妈”。


    '
