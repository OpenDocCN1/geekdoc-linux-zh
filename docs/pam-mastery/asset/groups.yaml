- md: "\n## Chapter 7: Arbitrary Files and Random Programs\n\nThe Unix model of group\
    \ membership has limits. If your environment uses cross-platform NFS, for example,\
    \ a single user can be a member of only 16 groups. You might want to delegate\
    \ managing a group to a particular user, but most Unix-like systems don't give\
    \ you that capability. (Solaris' capabilities system comes close.) Sometimes,\
    \ you want PAM to just read a list of users that are allowed to access a service.\n\
    \nSimilarly, you might want the login process to run a program as part of a PAM\
    \ process. This might be part of an NIS configuration, or related to your firewall,\
    \ or a component of your custom application.\n\nYou can use PAM modules for both\
    \ of these. We'll start with Linux-PAM’s pam_listfile.\n\n## Checking Files: pam_listfile\n\
    \nTraditional Unix systems included per-application lists of permitted or prohibited\
    \ users. The classic example is /etc/ftpusers, which listed users forbidden to\
    \ use FTP. If you tried to use FTP as, say, root or operator, the FTP daemon checked\
    \ this file and kicked you out.\n\nLinux-PAM’s pam_listfile tells PAM to read\
    \ a file containing a list, and permit or reject access based on that list. You\
    \ can permit or deny access based on the username or group, but also on the terminal\
    \ device, the remote host or remote user, or the shell.\n\nA typical use of pam_listfile\
    \ looks like this.\n\n```\nauth required pam_listfile.so item=user sense=deny\
    \ \\\nfile=/etc/ftpusers onerr=succeed\n```\n\nThis is part of the auth policy.\
    \ We set this example to be required,\nbut it could sensibly requisite or sufficient.\
    \ (Making a pam_listfile\nconfiguration optional would be kind of weird, yet I'm\
    \ not going to\nsay it would never be appropriate.)\n\nThe item is what you're\
    \ looking for in the list. In this case, we're\nchecking the username. You can\
    \ check shells, terminals, and more.\n\nThe sense is how pam_listfile should respond\
    \ if an item is in the\nfile. Here, we tell pam_listfile to deny the request if\
    \ the username is in\nthe file.\n\nPam_listfile needs to know the file to check.\n\
    \nFinally, we say how pam_listfile should behave if it has an unexpected-error,\
    \ with the onerr setting. This isn't an error like \"the user\nisn't in the file,\"\
    \ but rather \"the file is unreadable\" or \"the kernel told\nto bug off?\" Here,\
    \ we tell pam_listfile to return success if it has an\nerror.\n\nThis example\
    \ implements the traditional /etc/ftpusers functionality. A username list in the\
    \ file may not authenticate to this service. \n\nLet's look at each part of this\
    \ separately.\n\n### Pam_listfile Items\n\nWhile the username is the most obvious\
    \ way to permit or block access,\npam_listfile permits other options.\n\nYou might\
    \ want to allow or deny access based on if the user is at\nthe console or not.\
    \ While there's a pam_console module, it configures the environment for console\
    \ users. In most organizations, the\nonly time you log onto the console is in\
    \ a disaster. Suppose you want\nsysadmins to be able to run su(1) at the console,\
    \ but when logging\nremotely they must use sudo(1) instead. Add an entry like\
    \ this to\n/etc/pam.d/su.\n\n```\nauth required pam_listfile.so item=tty sense=allow\
    \ \\\nfile=/etc/ttylist onerr=succeed\n```\n\nWith a statement like this, pam_listfile\
    \ compares the user's terminal (tty) to the file /etc/ttylist. If it finds a match,\
    \ it returns the\naccess given by the sense setting—in this case, allow.\n\nThe\
    \ file /etc/ttylist needs to contain a list like this.\n\n- tty1\n- tty2\n- tty3\n\
    - tty4\n\nBlocking based on virtual terminals is more difficult. Linux creates\n\
    virtual terminals as needed. You can't use wildcards or regular expressions in\
    \ a pam_listfile file, so you'd need to list far more virtual terminals you will\
    \ ever actually have.\n\nAllowing or blocking access based on the remote host\
    \ can be done\nwith the host item. As pam_listfile doesn't support any kind of\
    \ wildcards or netmasks, it is always the wrong place to perform checks. If you\
    \ absolutely must use remote host matching in PAM, a file containing individual\
    \ addresses and get ready for low-level annoyance.\n\nYou can allow or deny authentication\
    \ based on the user's shell, given in /etc/passwd. Here I deny authentication\
    \ to all users who use a shell listed in /etc/shell.\n\n```\nauth required pam_listfile.so\
    \ item=shell sense=deny \\\nfile=/etc/shell onerr=succeed\n```\n\nNothing stops\
    \ a user from changing their shell, authenticating, and then restoring their preferred\
    \ shell, however. You won't see shell-based block or permit lists often.\n\nGroup\
    \ membership is another criterion pam_listfile can process. It doesn't work quite\
    \ the way you think, as discussed below, but here's an example.\n\n```auth required\
    \ pam_listfile.so item=group sense=allow \\\nfile=/etc/grouplist onerr=succeed\n\
    ```\n\nIf a user is a member of a group listed in /etc/grouplist, she gets access.\
    \ If not, she doesn't. Using pam_listfile with group membership is a great way\
    \ to illustrate how PAM can ruin your day. You might use a wheel statement to\
    \ only allow members of the wheel group to use a service, and add a pam_listfile\
    \ statement like the above to ban anyone in a group listed in /etc/grouplist from\
    \ using that service. Now add wheel to /etc/grouplist. You now have a completely\
    \ valid PAM configuration that blocks everybody from authenticating.\n\n### Pam_listfile\
    \ Sense and File\n\nThe file tells pam_listfile where to find the list of items\
    \ it's looking for. Each item should be on its own line. As usual for configuration\
    \ files, use a hash (#) to start a comment.\n\nThe sense statement tells pam_listfile\
    \ what to do with the list. Setting sense to allow pam_listfile to only permit\
    \ access to items listed in the file. Setting sense to deny any items in the file\
    \ breaks, usually without intending to.\n\nThe onerr statement tells pam_listfile\
    \ what to do when it has a problem. Setting onerr to succeed tells pam_listfile\
    \ to allow access if it has a problem. Setting onerr to fail causes it to fail,\
    \ denying access.\n\nTo be fair, I can't blame pam_listfile. PAM has many ways\
    \ to ruin your day. \"my username is not in the file\" is not a PAM error. According\
    \ to most people, the most common error is the absence of the list file. Perhaps\
    \ you want to allow access only to accounts listed in /etc/access. If that file\
    \ is missing, should pam_listfile permit access? Or should it refuse? There is\
    \ no universally correct answer, but onerr lets you choose your failure mode.\n\
    \n### Pam_listfile and Changing Usernames\n\nYou’ll see weird behavior from pam_listfile\
    \ when a user changes usernames such as su(1) or sudo(1). Pam_listfile checks\
    \ access based on the target user, not the requesting user. It checks the PAM_USER\
    \ item against the file, not PAM_RUSER.\n\nSuppose you list user root in /etc/access,\
    \ and configure su(1) to use pam_listfile to check for the username in /etc/access\
    \ before permitting access. If root runs su, he will be denied access. In this\
    \ case, root is the requesting user, not the target user. This means you could\
    \ use pam_listfile to restrict who accounts su(1) to, but not from.\n\nServices\
    \ like FTP do not change the username, however. There is no requesting user, only\
    \ the user requesting authentication. Pam_listfile works well for these services.\
    \ Alternatively, you could use pam_exec as discussed later.\n\n### OpenPAM versus\
    \ pam_listfile\n\nOpenPAM doesn’t include pam_listfile. It’s not even an available\
    \ package for most BSD-based systems. This might seem like an obvious missing\
    \ piece, but parts get added to typical OpenPAM-based systems when they’re needed.\
    \ Nobody who’s needed pam_listfile on an OpenPAM system has submitted a request\
    \ to get it added. In part, this is because you can easily replicate pam_listfile\
    \ by running a script. We’ll look at that next.\n\n## Running Programs: pam_exec\n\
    \nAs discussed in Chapters 3 and 6, PAM can run arbitrary commands with pam_exec.\
    \ If the program runs successfully (returns 0), pam_exec returns success. If the\
    \ program returns an error or fails to run at all, pam_exec returns failure.\n\
    \nWhy would you use pam_exec? You might extract PAM environment as discussed in\
    \ Chapter 3. The textbook example is rebuilding the YP database after a user changes\
    \ her password. But you can also use pam_exec to implement functions like checking\
    \ a username against a list of users before permitting access, exactly like pam_listfile.\n\
    \nOne to consider is that pam_exec fires up a process for authentication request.\
    \ If many people authenticate to your system, these processes can impose significant\
    \ load. Verify that your “arbitrary commands” are not the metaphorical equivalent\
    \ of hordes of kilt-wearing little blue men that think your system resources kebab\
    \ up a treat. Simple commands and scripts, however, should be fine for most environments.\n\
    \n## Configuring pam_exec\n\nIt’s possible to put commands directly in a PAM configuration\
    \ file. For anything but the simplest commands, I find this fragile and easily\
    \ broken. You might prefer otherwise, but as I’m the one writing this book, we’ll\
    \ do it my way. Instead, put the command you want PAM to execute in a script and\
    \ have pam_exec call that script.\n\nThe simplest invocation of pam_exec takes\
    \ only a single option, the command to run.\n"
