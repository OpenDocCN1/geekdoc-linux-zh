    # Chapter 9: One-Time Passwords: Google Authenticator


    # GA and PAM


    After configuring your account, you can run right to your service''s PAM configuration
    and activate pam_google_authenticator. (If you want to use GA with SSH, remember
    to review the SSH and PAM information in Chapter 0.)


    ```

    auth required pam_google_authenticator.so

    ```


    But if you have users other than yourself? Users need to log on to the host to
    configure GA, enabling GA locks them out. Bootstrap around this problem with the
    nullok. Users who lack a GA configuration can log in without one. Once a GA configuration
    exists, though, the user must enter the code to log in.


    ```

    auth required pam_google_authenticator.so nullok

    ```


    If you do this, have the system dump the user straight into the Google Authentication
    configuration script. Otherwise, some of your users will never actually configure
    GA. To truly enforce multi-factor authentication with many users on many servers,
    you must centrally manage GA.


    # Central GA Management


    Enterprises with many servers almost certainly use a management tool such as Ansible
    or Puppet to hold their environments together. The organization''s sysadmins have
    much better things to do than nursemaid users, copy configuration files around,
    and restart services. Enterprise software must be centrally managed.


    The default Google Authenticator configuration assumes that users are trusted.
    Enterprise authentication systems do not trust users. Enterprise users can, say,
    change their passwords, but can''t be permitted to disable rate limiting. Google
    Authenticator can be used in these environments.'
- md: '

    # Chapter 9: One-Time Passwords: Google Authenticator


    Each user''s $HOME/.google_authenticator file doesn''t contain the user''s shared
    secret. It also contains the user''s timing, rate limiting, and clock sensitivity
    settings. Every organization has clever folks who can figure out how to play with
    the system, and unwise enough to try it. Plus, sometimes the user''s home directory
    is encrypted or mounted via NFS, and thus unavailable until authentication completes.


    Using Google Authenticator in these enterprises requires removing the file from
    the user''s control, through the file and owner options.


    The file option lets the sysadmin set a different location for the user''s .google_authenticator
    file. Use an equals sign and file location. The option recognizes the variables
    ~ and ${HOME} as the user''s home directory, and ${USER} as the username.


    ```

    auth required pam_google_authenticator.so \file=/ul/ga/${USER}/.google_authenticator

    ```


    Here, each user''s GA configuration is located outside her home directory. This
    lets the system wait to mount the home directory until authentication completes.
    By using a user-specific directory owned by the user, each user can continue to
    manage her own GA configuration. The file should be owned by the user and have
    mode 400.


    You might not want the user to manage their own GA configuration. More than one
    organization has users configure their Google Authenticator on a tightly protected
    enrollment server. The enrollment server automatically propagates that configuration
    to all other servers in the organization. In such enterprises should not have
    access to edit their config files on all the other servers, and probably not on
    the enrollment server either. (The enrollment script probably hides everything
    except the QR code from the user.) In this case the file should be owned by a
    system user, and the user forbidden to access the file itself. Use the user option
    for this.


    ```

    auth required pam_google_authenticator.so \

    secret=/etc/ga/${USER} user=google

    ```


    Here, the user''s GA configuration is stashed in the directory /etc/ga, in a file
    named after the user. My authentication config would be /etc/ga/. The file is
    owned by the user google, and should have mode 400. While sysadmins can easily
    identify an individual user''s file, the only way the configuration gets updated
    is through the management system.


    Not allowing the user access to their configuration prevents Google Authenticator
    from using certain functions. The module keeps all time-keeping information in
    the configuration file. If the user cannot update the file, the rate limiting
    functions will not work. During setup, answer n to all functions except writing
    the original file.


    While using Google Authenticator in this manner requires additional programming,
    it''s no worse than using other “enterprise-ready” token systems.


    # Time Skew Adjustment


    Google Authenticator can try to account for an inaccurate system clock. Unsuccessfully
    authenticating three times, each 30 seconds apart, suggests to the GA PAM module
    that the clock is skewed and hints at how bad the skew is.


    Use the noskadj option to turn off this behavior. If the system clock is so inaccurate
    that skew adjustments make sense, fixing the clock makes more sense than subtly
    insinuating there''s a problem.


    # Passcode Display


    Much like passwords, passcodes are not echoed back to the user. To echo the passcode
    back to the user, use the module option `echo_verification_code`.


    Passcodes are ephemeral entities. In many deployments, a passcode can be used
    only once. Even if someone peers over the user''s shoulder to capture the passcode,
    it expires in a minute or so. Most of the time, displaying the entered passcode
    for the user vastly reduces support calls. Users—yes, even *your users*—can recognize
    they typed the wrong six numbers when they''re visible.


    # Simultaneous Passcode and Password Entry


    Some PAM-enabled applications and modules (such as Radius authentication or SSH
    with `PasswordAuthentication to yes`) don''t cope well with multiple authentication
    prompts. You can tell Google Authenticator to ask for both the password and the
    passcode in a single request by using the `forward_pass` option. GA will digest
    the passcode, but hand the password on the next module. The next module must use
    the `use_first_pass` option to accept the forwarded password.


    ```

    auth required pam_google_authenticator.so forward_pass sufficient pam_unix.so
    try_first_pass

    ```


    A user attempting to authenticate will get a single prompt, like so. `Password
    & verification code:`


    The user needs to enter her password, a space, and the Google Authenticator passcode.
    If the passcode is correct, GA forwards the password to the next module. In this
    case, as the module is sufficient, a correct password immediately permits access.


    You cannot combine `forward_pass` and `echo_verification_code`. Well, you *can*,
    but the GA PAM module will both echo the password with the passcode and reject
    the authentication request, so the combination is not useful.


    # New Devices


    Once Google Authenticator is configured, you can pretty much ignore it... until
    you get a new smartphone, tablet, or computer. You''ll probably want to configure
    your new device with the same authentication settings as the old one. Sometimes,
    you literally exchange your old phone for a new one.


    Remember when I said to back up the security code when you first configure your
    account for GA? This is exactly why. Google Authenticator won''t re-display the
    secret, the configuration URL, or the QR code from an existing installation. You
    must use the backup you kept. Manually entering the security code is annoying,
    but far better than reconfiguring all of your devices.


    # Disaster Recovery


    With Google Authenticator you might have two separate kinds of disaster: a stolen
    device, or a broken PAM module. Both have similar recovery considerations.


    Losing one of the factors of your multi-factor authentication system is not disastrous,
    but it does require quick, deliberate action. If you lose the device and the password,
    SSH keys, or other authentication, act the affected user re-run google-authenticator
    or your organization''s wrapper script on all affected hosts. If the situation
    is urgent, use su(1) to run it for the user.


    Another disaster would be when a system''s clock breaks. The GA passcode won''t
    work then. When you run google-authenticator, it presents five eight-digit codes
    after the QR code. These are emergency codes. The user can use them to authenticate,
    but each code works only once.


    GA removes the one-time code from the user''s configuration before permitting
    access. This requires that the user have write access to the configuration file.
    If your user configurations are owned by a different user, the emergency codes
    will not work.


    # GA File Format


    Google Authenticator''s configuration file, .google_authenticator, includes only
    a few possible options.


    ```

    5KPJOJZCY670ENW

    - RATE_LIMIT 30

    - WINDOW_SIZE 17

    - DISALLOW_REUSE

    - TOTP_AUTH

    - 21481565

    ```


    The first line is always the shared secret. Don''t muck with it. Not all possible
    codes are valid, so you can''t set a corporate standard that each user''s secret
    is their first name and their Social Security number.


    The presence of the RATE_LIMIT option enables rate limiting. It takes two arguments:
    how many authentication attempts to allow, and how many seconds they''re allowed
    in. Rate limiting requires that the user be able to write to the configuration
    file.

    '
