    ```


    The domain identifies which users this limit applies to. You can limit by users,
    groups, wildcards, and ranges of UID and GID. In our example, the domain is the
    user ftp.


    The type indicates if this is a hard or soft limit. While hard limits are inviolate.
    Our example is a hard limit.


    The item keyword defines which resource to limit. Pam_limits includes many resource
    keywords, which we will discuss later. The example uses the item nproc, the keyword
    for the maximum number of processes.'
  - '[PAGE 97]


    # Chapter 5: Popular Linux-PAM Modules


    The final field gives the maximum value for that resource.


    The example above restricts user ftp to a maximum of zero processes. Hopefully
    that an account is used for the FTP service; otherwise, user Frederic Thomas Powell
    is going to be rather annoyed.


    # Limit Domains


    You can identify users by username, group, UID, GID, or wildcard.


    For limits that apply to a single username, use the username as the domain.


    To use a system group put an @ symbol before the group name, such as @wheel, @staff,
    or @customers.


    An asterisk (*) means that this limit applies to all users. “All users” does not
    include root, as the almighty root account is not bound by mortal chains. If you
    want to limit to root, you must explicitly list root as the domain.


    Pam_limits uses % as a special wildcard, specifically reserved for the maxlogins
    and maxsyslogs limits. Used alone, it sets a maximum number of non-root logins
    on this host. Put a group name after it to set a maximum number of logins for
    that group.


    Specify a single UID with a leading colon, as shown here.


    ```

    :1000

    ```


    For a range of UIDs, give the lowest and highest matching UIDs, separated by a
    colon. Here we set limits on all users with UIDs from 1000 to 2000.


    ```

    1000:2000

    ```


    If you don''t put a maximum matching UID, the limit applies to all UIDs equal
    to or greater than the one listed. Here we apply a limit to all UIDs 1000 and
    higher.'
  - '[PAGE 98]


    # Chapter 5: Popular Linux-PAM Modules


    1000:


    Group IDs work much like UIDs, except they have an @ symbol in front of them.
    Specify ranges with a colon. If you''re matching a range of UIDs, PAM compares
    the user''s primary group to the range. If you''re matching a specific group,
    however, PAM looks at all groups the user belongs to. Here we impose a limit if
    the user is in GID 10000, even if it''s not the user''s primary group.


    @:10000


    Combine the % maxlogs-only wildcard with the group @ wildcard to limit the total
    number of logins of all users that are in the group. Here, if you''re in group
    10000, even if it''s not your primary group, you''re in the limited logins group.


    %@: 10000


    Now decide what kind of limit this is.


    # Limit Type


    Linux-PAM supports two kinds of limits, hard and soft.


    A soft limit is a limit the user won''t know. It''s the operating system''s way
    of saying “Hey, do you really want to use more than your share of resources?”
    The user can raise this limit with shell built-ins ulimit or limit.


    A hard limit is an absolute upper cap enforced by the kernel. The user cannot
    evade this limit.


    Which should you use? Most users know how to evade a soft limit, so it''s effectively
    a hard limit. Use both soft and hard limits if you have educated users. I normally
    use limits to restrict service accounts, to prevent web servers and databases
    from spiraling out of control. Hard limits are best in such cases—if my web server
    raises its own limits, I have a whole new set of problems...'
  - '[PAGE 99]


    # Chapter 5: Popular Linux-PAM Modules


    # # Limit Items and Values


    Linux-PAM can set limits on files, memory, processes, and logins. We won''t cover
    exactly all of these limits mean, as explaining things like stack size, locked
    memory, and so on would take another whole book.¹¹¹


    Most limits values are numerical. A user can open 100 files, or use a gigabyte
    of RAM, and so on. The exception is the word unlimited, which removes any limit
    on that user.


    To set a maximum size on the user''s core files, use the core limit. Setting core
    prevents an amok process from writing a multi-gigabyte core file when it finally
    crashes and dies. To set a maximum size of a file the user can create, use the
    fsize limit. Both core and fsize take a value in kilobytes. Here we allow users
    with the primary group of customers to create 1 MB core files.


    ```

    @customers hard core 1024

    ```


    You can also limit the number of files the user can open simultaneously, with
    nofile. To limit how many files the user can lock, use locks. Below, users in
    the customers group can only have 4096 files open simultaneously.


    ```

    @customers hard nofile 4096

    ```


    The four memory restrictions are data, memlock, stack, and as. All are set in
    kilobytes. The data limit caps the amount of data the user can have in memory.
    The memlock value is the maximum amount of memory the user can have locked into
    memory. The stack limit sets a maximum stack size, while you can set an address
    space limit with


    > ¹If you don''t know what a knob does, don''t twiddle it. Introduction.'
  - '[PAGE 100]


    # Chapter 5: Popular Linux-PAM Modules


    You can limit the maximum amount of memory the user can claim for POSIX message
    queues with the msgsque limit. Unlike other memory limits, msgsque is in bytes.


    The main ways to limit processor resources are by the number of concurrent processes
    and the total amount of CPU time. The nproc item lets you set a maximum number
    of simultaneous processes, while cpu lets you set a maximum CPU time in minutes.
    Here''s CentOS lets all system users have a generous 4,096 simultaneous processes,
    but explicitly removes any restrictions from root.


    +   * soft nproc 4096

    root soft nproc unlimited


    Another way to limit processor resources is to control how aggressively the operating
    system schedules the user''s processes. The priority item lets you set the default
    niceness of the user''s processes, as per nice(1). Higher values get less priority.
    Similarly, the nice item lets you set the maximum niceness available to the user.
    Using priority is a nice (no pun intended) to let the user have resources when
    they''re available, but shunt them aside when the system is loaded. Here, we tell
    the user m1 that his tasks don''t matter.


    mwl soft priority 10


    If you''re doing real-time computing, the rtprio item lets you set the user''s
    real-time priority.


    The sigpending item lets you limit the number of signals a user have pending.
    The worrisome thing about this setting is that it was written because someone
    needed it.


    Restrict the total number of simultaneous system logins a user or group can have
    with the maxlogins option. If you want to restrict the total number of non-root
    logins on the system, use the maxsyslogins option. Here we limit the user mw to
    two simultaneous logins.'
  - '[PAGE 101]


    # Chapter 5: Popular Linux-PAM Modules


    mwl hard maxlogsins 2


    Remember, when limiting the number of logins by group membership, you’ll need
    to use the special % wildcard discussed in “Limit Domains,” above.


    Finally, the chroot limit lets you define a directory to chroot(8) as a user into.
    In most cases you wouldn’t use pam_limits to chroot a user, instead relying on
    server software such as sshd(8).


    # PAM and Systemd


    What does authentication have to do with systemd(8)?


    Systemd does not authenticate users. PAM needs to notify systemd when each user
    logs in. Pam_systemd handles that communication. As systemd is not yet a mandatory
    component of most Linux systems, pam_systemd is usually an optional module. It
    goes at the end of the session policy.


    The main function of pam_systemd is to manage systemd scopes and XDG base directories.
    Very few people need to adjust either of these, but you should know it’s possible.
    See the systemd(8) manual page for details if you’re one of those unfortunate
    few.


    This takes you through the most commonly used Linux-PAM modules. Now let’s talk
    about some generic PAM debugging.'
- md: '

    # Chapter 6: PAM Debugging


    So you''ve carefully tuned your PAM statements, but it doesn''t work as you expected.
    Maybe authentication dies somewhere for no discernible reason, or a desired module
    doesn''t seem to get called at all. How can you tell which PAM modules get called,
    and when an authentication request dies?


    In anything to do with computers, all debugging eventually falls back to some
    sort of print statement. PAM skips the preliminaries and drops you straight there.
    You can track a PAM request''s progress through each policy with the system log,
    pam_echo, and pam_exec. You can also fire up program debuggers like ktrace(1)
    and truss(1).


    There''s nothing quite like that lovely feeling you get when you break a host''s
    PAM configuration and no longer have privileges to repair your error. Any time
    you adjust with a host''s PAM configuration, make sure that you leave a terminal
    with root access open. Test all changes thoroughly. Make sure you can still get
    root access from a brand new session before logging out.


    Any of these techniques can make the system leak authentication information into
    the system log or terminal sessions. I recommend performing tests on a disposable
    virtual machine rather than on a system with live users.


    # PAM Logging


    If you can''t figure out why a module is behaving unexpectedly, start with logging.


    Basic systems administration problems show up in the system log. My most common
    configuration file error, usually after decades of shouting vile obscenities at
    PAM, forgetting the .so at the end of a PAM module name. PAM searches for the
    nonexistent file pam_unix rather than pam_unix.so, the statement fails, and the
    policy denies access. These errors show up in system logs, in visible logs only
    to root. Check for these logged errors first.


    PAM modules perform routine logging via syslog(3), with the facility auth. These
    normally wind up in a restricted log file accessible only to root, like /var/log/secure
    on CentOS or /var/log/auth.log on FreeBSD and Debian.


    Many modules accept the debug argument to make the module more verbose. The contents
    and amount of information depend entirely on the module. PAM module developers
    all choose to log different things—or especially—with debugging turned on, some
    PAM modules provide better debugging output than others.


    But sometimes, you don''t even get to the module...


    # Debugging with pam_echo


    The pam_echo module prints stuff to the authenticating user. Not all programs
    pass these messages back to the user, but when it works it''s enlightening and
    easy.


    # Using pam_echo


    Pam_echo takes a string of text as an argument, the message to be passed back.


    ```

    auth optional pam_echo PAM auth policy starting

    ```


    If the application passes PAM messages back to the user, the text PAM auth policy
    starting will appear when the policy hits this statement.


    Here''s /etc/pam.d/system from a recent FreeBSD unit. (I''m using FreeBSD here
    because the system auth policy is far shorter than an average Linux.) I added
    a call to pam_echo before each module.


    - auth required pam_echo checking OPIE

    - auth sufficient pam_echo.so no_warn_fake_prompts

    - auth required pam_echo checking ieaccess

    - auth requisite pam_ieaccess.so no_warn_allow_local

    - auth required pam_echo checking UNIX auth

    - auth required pam_unix.so no_warn_try_first_pass nullock


    When the user attempts to authenticate with a program like su(1), she''ll get
    the pam_echo messages.


    ```

    $ su -m

    checking OPIE

    checking opieaccess

    checking UNIX auth

    ```


    Password:

    While this is noisy, we know that the auth request made it all the way to the
    end of the policy. It might also screw up shell scripts that aren''t expecting
    the extra output. If an automated process starts spewing errors right about the
    time you put echoes in, you know what happened.


    # pam_echo Items


    You can display the contents of the PAM items by using escape characters in a
    pam_echo statement. Pam_echo escape sequences are the % character, followed by
    a single letter.


    - %U is the requesting username, or PAM_RUSER.

    - %u is the target account''s name, or PAM_USER.

    - %t is the terminal, or PAM_TTY.

    - %s is the service name, PAM_SERVICE.

    - %H is the host where the client is running, or PAM_RHOST.

    - Linux-PAM also supports %h, the local host.

    Use these to spit out PAM internal items like.


    One problem with these strings is that any two-character string beginning with
    a percent sign gets the percent sign away. A percent sign is not a typical character
    in usernames, hostnames, and service names, but should you be one of the special
    few, be aware of this.


    # Linux-PAM Files


    Linux-PAM lets you provide text to pam_echo through a separate file. Use the file=option
    and a filename, like so.

    When your authenticates, the text in /etc/message gets passed back. Adding this
    sort of configuration to your authentication process lets you add generic warnings.
    You can use pam_echo items in the text file, like this:

    Your access to this host as %u has been logged. Unauthorized users will be trampled.
    This won''t necessarily work for all services—remember, some programs don''t pass
    this text back to the user. But it will handle many cases for you.

    If pam_echo doesn''t have access to everything, or if the client doesn''t return
    its output, try using pam_exec to extract more information from the PAM policy.
    You should get better than this, though, perhaps from at least someone plays on.


    # Debugging with pam_exec


    If the software you''re debugging doesn''t pass pam_echo messages through the
    user, or if pam_echo doesn''t have access to values you want, fall back on pam_exec.
    We used pam_exec in Chapter 3 to capture PAM environment variables. Right now,
    we''ll use it to send information about a PAM session to the system log. Here,
    pam_exec calls the script pamdebug.sh, giving the script an argument of the module
    that''s to be called.


    | Type | Module | Argument |

    | :--- | :--- | :--- |

    | auth optional | pam_exec.so | /var/local/scripts/pamdebug.sh pam_opie |

    | auth sufficient | pam_echo.so | no_warn_fail_prompts |

    | auth optional | pam_exec.so | /var/local/scripts/pamdebug.sh pam_access |

    | | | no_warn_allow_local |

    | auth optional | pam_exec.so | /var/local/scripts/pamdebug.sh pam_unix |

    | auth required | pam_unix | no_warn_try_first_pass nullock |


    The pamdebug.sh script logs what''s to be called.


    ```bash

    #!/bin/sh

    logger "process PPID $1"

    ```


    You could also add any other debugging like to this script, such as capturing
    PAM variables. But as-is, the script creates messages resembling this:


    Mar 14 08:52:21 testhest mwl: process 1314 calling pamopie


    You''ve captured the user, the process ID, and the module. With this information,
    you can sort out where your policy stopped, then use module-specific features
    to determine how that statement failed.


    # Debugging with pam_warn


    Many Linux distributions offer pam_warn for debugging. The pam_warn module does
    not affect the authentication process, and sends the service, terminal, user,
    remote user, and remote host to the log. Add pam_warn to the beginning of any
    auth policy you want to debug. Here I want to use pam_warn to debug su(1) on CentOS.


    ```

    auth optional pam_warn.so

    auth sufficient pam_rootok.so

    auth substack system-auth

    auth include postlogin

    ```


    As pam_warn always returns PAM_IGNORE, you can use an optional or required control.


    When a user tries to use su(1), each module in the policy sends messages to the
    system log.


    ```

    Aug 2 00:52:39 centos su: pam_warn(su-1:auth): function=[pam_sm_authenticate]
    flags=0 service=[su-1] terminal=[pts/3] user=[root] ruser=[mwl] rhost=[<unknown>

    Aug 2 00:52:41 centos su: pam_warn(su-1:setcred): function=[pam_sm_setcred] flags=0x2
    service=[su-1] terminal=[pts/3] user=[root] ruser=[mwl] rhost=[<unknown>

    Aug 2 00:52:41 centos su: pam_systemd(su-1:session): Cannot create session: running
    in a session

    Aug 2 00:52:41 centos su: pam_unix(su-1:session): session opened for user root
    by (uid=500)

    ```


    If you need to debug further, you might look at pam_debug to specifically set
    values in a PAM policy.


    Between pam_warn, pam_exec, pam_echo, and the system log, you can extract any
    information from PAM. If one method doesn''t work, try another. You''ll need that
    flexibility for the next chapter...

    '
  mdcn: '


    # 第6 章：PAM 调试


    你已经仔细调整了 PAM 语句，但它的运行结果并没有像你预期的那样。也许认证在某个没有明显原因的地方终止了，或者某个模块似乎根本没有被调用。你如何判断哪些
    PAM 模块被调用了，以及认证请求何时终止的？


    在任何与计算机相关的事务中，所有的调试最终都会回退到某种打印语句上。PAM 跳过了准备工作，直接带你进入那里。你可以通过系统日志、`pam_echo` 和
    `pam_exec` 跟踪 PAM 请求在每个策略中的进度。你也可以启动如 `ktrace(1)` 和 `truss(1)` 等程序调试器。


    当你破坏了主机的 PAM 配置，并且不再权限修复自己的错误时，那种糟糕的感觉是无与伦比的。每当你调整主机的 PAM 配置时，请确保留有一个具有 root 权限的终端。彻底测试所有更改。在注销之前，确保你仍然能从新会话获取
    root 权限。


    这些技术中的任何一种都可能导致系统将认证信息泄漏到系统日志或终端会话。我建议在一次性虚拟机上进行测试，而不是在有活动用户的系统上。


    # PAM 日志


    如果你无法确定为什么某个模块的行为异常，请从日志记录开始。


    基础的系统管理问题会出现在系统日志中。我最常见的配置错误（通常是在对着 PAM 咆哮了几十年脏话后）是忘记在 PAM 模块名称的末尾加上 `.so`。PAM
    会搜索不存在的文件 `pam_unix` 而不是 `pam_unix.so`，导致语句失败，策略拒绝访问。这些错误会出现在系统日志中，且仅对 root 可见。首先检查这些记录的错误。


    PAM 模块通过 `syslog(3)` 执行常规日志记录，设施为 `auth`。这些日志通常会存储在只有 root 可访问的受限日志文件中，例如 CentOS
    上的 `/var/log/secure` 或 FreeBSD 和 Debian 上的 `/var/log/auth.log`。


    许多模块接受 `debug` 参数来使模块输出更详细。内容和信息量完全取决于模块。PAM 模块开发者都选择在开启调试时记录不同的内容——或者是特定的内容——某些
    PAM 模块提供的调试输出比其他模块更好。


    但有时，你甚至还没有到达模块……


    # 使用 pam_echo 调试


    `pam_echo` 模块将内容打印给认证用户。并不是所有程序都会将这些消息传回用户，但当它生效时，它是既有启发性又简单的。


    # 使用 pam_echo


    `pam_echo` 接受一个字符串作为参数，即要传回的消息。


    ```

    auth optional pam_echo PAM auth policy starting

    ```


    如果应用程序将 PAM 消息传回给用户，当策略命中此语句时，就会出现 `PAM auth policy starting` 文字。


    这是来自一个最近 FreeBSD 系统的 `/etc/pam.d/system`。（我在这里使用 FreeBSD 是因为它的系统认证策略比平均 Linux
    短得多.）我在每个模块之前添加了对 `pam_echo` 的调用。


    - auth required pam_echo checking OPIE

    - auth sufficient pam_echo.so no_warn_fake_prompts

    - auth required pam_echo checking ieaccess

    - auth requisite pam_ieaccess.so no_warn_allow_local

    - auth required pam_echo checking UNIX auth

    - auth required pam_unix.so no_warn_try_first_pass nullock


    当用户尝试使用如 `su(1)` 的程序进行认证时，她将获得 `pam_echo` 消息。


    ```

    $ su -m

    checking OPIE

    checking opieaccess

    checking UNIX auth

    ```


    密码：

    虽然这看起来很嘈杂，但我们知道认证请求一直到达了策略的末端。它还可能破坏没有预期额外输出的 shell 脚本。如果一个自动化过程在你放入 echoes 的时候开始喷出错误，你就知道发生了什么。


    # pam_echo 项目


    你可以通过在 `pam_echo` 中使用转义字符来显示 PAM 项的内容。PAM 模块开发者都选择在开启调试时记录不同的内容——或者是特定的内容——某些
    PAM 模块提供了：


    - %U 是用户

    - %u 是用户名

    - %t 是会话

    - %s 是服务

    - %H 是主机

    - %i 是远程主机


    - 这里的某些 PAM 模块提供了更好的调试输出比其他模块。


    '
