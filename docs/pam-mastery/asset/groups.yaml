    > 24 I reward most of my users by reducing the voltage on the random electric\
    \ shocks, but whatever works for you.\n"
  mdcn: "\n\n## 第 11 章：密码质量检查\n\n通过长度和不同的字符类，它拥有一套“积分”（credits）系统，如果密码遵循良好实践，则允许使用较短的密码。理论上，pam_pwquality\
    \ 可以识别糟糕的密码选择。^{22（这对于老牌系统管理员来说可能很熟悉，因为 pam_pwquality 继承了经典模块 pam_cracklib 的许多概念。）\n\
    \n## 常见的 pam_pwquality 配置与行为\n\n`use_first_pass`、`try_first_pass` 和 `debug` 等常用选项适用于\
    \ pam_pwquality。在首次尝试此模块时，请充分使用 `debug` 选项。\n\n你经常会看到 `local_users_only` 选项，它告诉模块只检查本地密码文件中存在账户的用户密码。\n\
    \n使用 `retry` 选项设置 pam_pwquality 允许用户尝试创建可用密码的次数。一旦用户尝试失败达到该次数，pam_pwquality 就会将其拒出。\n\
    \n最后，虽然 `authook_type` 选项看起来很高级，但它只是设置一个用户可见的字符串，用来说明正在更改哪种密码。它通常是空的。\n\n```\n\
    通常的 pam_pwquality 语句看起来如下。\n requisite pam_pwquality.so try_first_pass \\ local_users_only\
    \ retry=3 authook_type= \n```\n\npam_pwquality 模块会直接拒绝整类的密码。如果新密码与旧密码相同（仅大小写不同），则会被拒绝。如果它太短或与旧密码太相似，会被拒绝。如果它是旧密码的旋转版本（例如\
    \ `hamster1` 和 `amster1h`），则会被拒绝。最后，回文是完全不可接受的。\n\n> 22 永远不要低估用户创造性地做出糟糕选择的能力\n\
    \n你可以微调其中一些行为。我们将从建立最低要求开始，然后介绍积分系统，最后涵盖其他配置选项，这些选项可以放在 PAM 语句中，也可以放在 `/etc/security/pwquality.conf`\
    \ 中。\n\n## 设置密码要求\n\n你可以通过设置最小长度、所需的字符类数量以及每类字符的最小数量来对用户密码设置限制。\n\n`minlen` 选项设置密码的最小长度。增加最小长度很容易，但\
    \ pam_pwquality 有硬编码的下限。任何系统上的有效最小密码长度可能是六，但通过重新编译可以将其降至四。默认值是八。\n\n`class` 选项设置密码中必须包含的字符类最小数量。\n\
    \n使用 `dcredit` 选项设置密码中数字的最小值。`ucredit` 选项指定大写字母的最小数量，而 `lcredit` 设置小写字母的最小数量。最后，`ocredit`\
    \ 设置其他字符的最小值。将最小值指定为负数——正值表示你正在使用积分系统。在这里我对用户密码设置了特定要求。为了清晰起见，我省略了通常的 `retry`\
    \ 语句等。在生产环境中，你肯定想要包含它们。\n\n```\npassword requisite pam_pwquality.so minlen=8 min=3\
    \ dcredit=-2 ucredit=-2 lcredit=-2\n```\n\n该语句要求用户至少有两个数字、两个小写字母、两个大写字母和两个其他字符。最小长度为八。虽然我定义了类的最小数量为三，但该设置并没有被精确使用——四类字符中每一类的最小值超过了\
    \ `minclass` 语句。\n\n为你的系统定义了密码的最低要求。如果入侵者试图猜你系统的密码，他可以跳过所有不符合你密码标准的可能密码。为了增加攻击者的难度$^{23}$，使用积分系统。\n\
    \n## 密码质量积分\n\npam_pwquality 系统允许你设置最小密码长度，但随后为包含多个不同字符类的用户提供额外积分。这为密码提供了灵活性，但允许人们在使用更多种类字符的情况下使用较短的密码。\n\
    \n系统管理员已经足够的精力向用户解释常规策略了。我从未成功地向用户解释过积分。在现实世界，我发现积分是系统管理员团队的奖励，而不是普通用户的。\n\n通过积分系统，用户在密码中包含的每个额外字符类都会获得积分。默认情况下，每个字符类提供一个额外积分。考虑世界上最糟糕的密码\
    \ `password`。它有八个字符。用户因包含小写字母获得了额外积分，计分为九个字符。如果你将最小密码长度设置为九个字符，`password` 就符合要求。（注意，它会因为其他原因被拒绝，但仅从长度来说是合格的。）\n\
    \n添加一个大写字母可以让密码短一个字符，例如 `pAsswor`。加入一个数字，你就可以将密码缩减到六位：`pAssw0`。六个字符，加上包含小写、大写和数字字符各得一个积分。请记住，在不重新编译的情况下，pam_pwquality\
    \ 不接受少于六位的密码。\n\n使用积分系统时，用户不想混合字符也不必混合。一个纯八位的小写密码就足够了。\n\n使用积分时，`dcredit`、`ucredit`、`lcredit`\
    \ 和 `ocredit` 选项仍然分别适用于数字、大写、小写和其他字符。然而，在使用积分的情况下，它们不再定义密码所需的这些字符的最小数量，而是定义了用户可以获得的最高积分。将\
    \ `ocredit` 设置为 3 意味着用户非字母数字字符可以获得最多三个积分。每个默认为 1。考虑这些 `/etc/security/pwquality.conf`\
    \ 设置：\n\n```\nminlen=16\nlcredit=3\nlcredit=0\n```\n\n最小密码长度为 16。用户使用小写字母不获得额外积分，但可以从非字母数字字符获得最多三个积分。大写字母或数字没有特殊设置，所以它们各提供一个积分。\n\
    \nCEO 尝试使用 `password`。仅从长度来看，通过了——16 个字符。添加一个大写字母让她获得一个字符的积分，让她可以将密码缩减为 `password`。一个数字让她额外获得一个字符积分，减少到\
    \ 14 位：`password0`。是的，有两个数字，但数字积分限制为一个。不过，她可以从非字母数字字符获得最多三个积分。所以 `password!@#`\
    \ 只有 11 个字符，但加上积分后长度为 16。\n\n创建复杂密码的用户将获得短密码的奖励。24\n\n## 常用选项\n\n无论你是定义要求还是使用积分，这些选项都适用。\n\
    \n`difok` 选项设置新密码中新字符的最小数量。默认值为 5。新密码必须包含至少五个旧密码中没有的字符。如果你要求长密码，增加此值。\n\n`maxrepeat`\
    \ 选项设置字符连续重复的最大次数。默认值是 0，禁用此检查。将其设置为 1 则不允许连续出现两个相同的字符。\n\n通过 `maxclassrepeat`，你可以限制同一类字符连续在一起的次数。它通常设置为\
    \ 0，禁用此检查。将其设置为例如 4，将禁止包含像 `alqn` 或 `81930` 这样看起来随机的字符串，因为它们超过了 4。你可以使用所有字符，但必须在中间用其他字符类打破它们。\n\
    \n`maxsequence` 选项设置递增或递减序列的最大长度，例如 `abcde` 或 `87654`。默认为 0，禁用此检查。\n\n如果 `gecoscheck`\
    \ 字段设置为非 0 的数字，pam_pwquality 将密码与用户的 `/etc/passwd` 条目进行比较。匹配 `/etc/passwd` 中任何超过三个字符的单词都会导致\
    \ pam_pwquality 拒绝该密码。\n\n> 24 我通过降低随机电击的电压来奖励大多数用户，但只要对你有效即可。\n\n"
