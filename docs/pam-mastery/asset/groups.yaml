    \ length of 16.\n\nUsers who create complex passwords get rewarded with shorter\
    \ passwords.24\n\n## Common Options\n\nThese options apply whether you're defining\
    \ requirements or using credits.\n\nThe difok option sets the minimum number of\
    \ new characters in the new password. This defaults to 5. The new password must\
