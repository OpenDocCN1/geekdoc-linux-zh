    # Chapter 1: PAM Components


    Using includes lets the sysadmin maintain the PAM configuration for several services
    in one location. Changing the included file makes changes immediately propagate
    to all involved services.


    All operating systems use a slightly different include policy design, however.
    Many CentOS PAM modules include the system-auth configuration file. FreeBSD uses
    /etc/pam.d/system. Debian breaks the central include file by types, such as common-auth,
    common-session, and so on.


    Debian uses @include to pull in an entire file. Here’s Debian’s /etc/pam.d/sudo
    configuration.


    ```

    @include common-auth

    @include common-account

    @include common-session-noninteractive

    ```


    This configuration says "use the same authentication as everyone else


    The advantage to including files like this is that it makes adding entries to
    the beginning or end of a policy very easy. If I want to add a PAM module to a
    type for only one program, I can add it to that program’s file. Here, I tell Debian’s
    sudo to require a breathalyzer test in addition to all the usual authentication
    methods.


    ```

    auth required pam_breathalyzer.so

    @include common-auth

    @include common-account

    @include common-session-noninteractive

    ```


    Files improve your flexibility without requiring that you maintain multiple copies
    of your PAM policies.


    Linux-PAM also supports substacks, which are similar to includes. See Chapter
    4 for a discussion of substacks.'
  - '[PAGE 53]


    # Chapter 1: PAM Components


    # Modules and Arguments


    The modules and their arguments at the end of each PAM statement dictate the functionality
    or behavior the rule implements. Each module provides features such as checking
    passwords, configuring home directories, or allocating terminals.


    We''ll install most features by installing and using PAM modules.


    # Module Context


    As you explore PAM modules, you''ll notice that many modules get called by several
    different PAM types. The pam_unix.so module, for example, appears in auth, account,
    and password policies. The way the module behaves, and the services it provides,
    vary depending on the type calling. If an auth type calls pam_unix.so, the module
    checks the password. The account type gets account availability information from
    pam_unix.so The password type uses pam_unix.so to change the system password file.


    Not every module provides services to all types. Very useful modules support only
    one type but perform a vital service for that type. The module pam_mkhomedir.so,
    for example, creates nonexistent home directories for authenticated users as part
    of the session type. This has nothing to do with passwords, but is vital for large
    enterprises.


    # Module Arguments


    Module arguments, or flags, configure the module itself. Should a module tell
    a user why it rejected a request, or not? Do you want optional features activated?
    Module arguments enable and disable these optional features.


    Here, we set the nullock and try_first_pass flags to the pam_unix module.'
  - '[PAGE 54]


    # Chapter 1: PAM Components


    auth sufficient pam_unix.so nullok try_first_pass


    Some flags take their own arguments, letting you set limits or toggle functions.


    account required pam_breathalyzer.so bal<8 account required pam_genescan.so neanderthal=0


    Breathalyzers on their own don''t know your organization''s tolerance for alcohol.
    In this example, if a user''s blood alcohol level is less than 0.08, the account
    is available. How did I learn about this argument? I read the module documentation.
    Similarly, in compliance with United States anti-discrimination laws, we are telling
    the gene scanner to not perform the Neanderthal checks.


    A module might need a completely different argument when used in a different context.


    # Common Module Arguments


    While anyone can write a PAM module, that doesn''t mean that everyone reinvents
    module configuration. Most PAM modules accept these usual arguments for common
    functionality.


    A PAM module isn''t required to accept any of these arguments. A properly coded
    PAM module that doesn''t support the functionality of a flag will silently ignore
    it.


    # debug


    The debug flag tells the module to log debugging information via syslog. PAM debugging
    messages are logged with the auth facility priority debug. Adding the debug flag
    to pam_unix.so and watching the system log will teach you a whole bunch about
    how your PAM implementation processes authentication requests.


    But not all PAM modules support debugging. If a PAM module behaves badly when
    you use the debug flag, take that as a hint'
  - '[PAGE 55]


    # Chapter 1: PAM Components


    that the module is poorly programmed. You might be stuck using the module, but
    at least you''ve been warned.


    In OpenPAM, the debug flag not only triggers debugging output of PAM behavior,
    but debugging within the shared library. You''ll see which service function gets
    called and what it returns, as discussed in Chapter 3.


    Generic PAM errors, like listing a module that doesn''t exist, appear in the system''s
    security log normally (/var/log/secure or /var/log/auth).


    # no_warn


    PAM modules offer feedback on why they reject an access request. Enabling no_warn
    silences that feedback. While the analyzer normally tells a user that they can''t
    log in because they''re too intoxicated to find their face, let alone program,
    adding no_warn turns that warning off.


    # use_first_pass


    A host''s authentication system might be set up to try to validate a username
    and password through each of several methods. One host might try both the local
    password file and LDAP, for example. While each PAM module could prompt the user
    for the password, use_first_pass option tells the module to use an already entered
    password. Without this option, it''s possible that a module will prompt the user
    for their password again.


    If the user has never entered a password, she gets prompted anyway.


    If the existing password doesn''t work, the module fails. The use_first_pass option
    normally appears only in auth rules.'
  - '[PAGE 56]


    # Chapter 1: PAM Components


    # try_first_pass


    Much like use_first_pass, the try_first_pass option tells the module to try to
    authenticate with a previously entered password. If the password isn''t correct,
    however, the module can prompt the user for a password. If that password fails,
    the module fails.


    The try_first_pass option normally appears only in auth rules.


    # use_mapped_pass


    The use_mapped_pass option lets you hash or encrypt a password by the user. By
    binding the control, use_mapped_pass is rarely used today. I''m only including
    it for completeness.


    # expose_account


    Human beings are terrible at following instructions. The machine asks for a username,
    and we type a password. For reasons like this, modules tend to be quiet about
    information such as the username, the user''s home directory, and so on. The expose_account
    option tells the module to release this information. Some modules will print messages
    like failed to authenticate user mwl home directory /home/mwl not available when
    you enable this option.


    Support for expose_account varies between modules.


    # Default Policies


    Not all applications need their own policy. Many applications can share a set
    of common defaults. If PAM doesn''t find a policy for an application, it calls
    the “other” policy, from /etc/pam.d/other.


    These default policies vary widely between systems. FreeBSD is very similar to
    the system file that gets pulled into most other policies, while CentOS'' denies
    everything. Check what your operating system does.'
