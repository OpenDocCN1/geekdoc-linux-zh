    ## Chapter 11: Password Quality Checks


    If you''re running software that has a maximum password length, get the software
    fixed or replace it. Systems using traditional password hashes are probably decades
    obsolete, mission-critical, minimally funded, and so poorly understood that nobody
    dares touch them. Large enterprises and governments are the worst offenders here.
    Attempting to replace the system will either end your career or, if you''re successful,
    crown you Dark Lord of the IT Department.²21


    ## pam_passwordqc


    The pam_passwordqc module appears almost everywhere except in recent versions
    of CentOS, and has long been the standard tool for checking the quality of new
    passwords during password changes. pam_passwordqc module lets you define password
    length requirements, the number of characters that must differ between old and
    new passwords, the type of characters that must be included in a password, and
    more.


    ## Enabling and Configuring


    Both Debian and FreeBSD use pam_passwordqc. The only real difference between them
    is that FreeBSD requires any options to be placed in the PAM configuration file,
    while Debian lets you put pam_passwordqc options in a separate file, pam_passwordqc.conf
    with the config option.


    ```

    password requisite pam_passwordqc config=/etc/passwordqc.conf

    ```


    The actual configuration options that appear in each are identical, however. We''ll
    show examples from both.


    Once you enable pam_passwordqc, any time tries to change any password they''ll
    have to pass quality checks first. You can relax this strictness with the enforce
    option.


    > 21 You might be a nice person when you start, but the actions needed to replace
    such a system will transform you into a Dark Lord. That''s just how business works.


    If you set enforce=users, the password checks apply only to unprivileged users.
    The root user can assign a user an inadequate password. They''ll get a warning,
    but the password will get changed.


    If you set enforce=none, pam_passwdqc prints password requirements, warnings,
    and hints but doesn''t enforce them.


    Here I tell pam_passwdqc to allow root to violate password standards.


    ```

    password requisite pam_passwdqc enforce=users

    ```


    If I''ve defined a Debian configuration file, this entry can appear on a line
    by itself.


    ```

    enforce=users

    ```


    Now, when the boss calls complaining that GolfMaster is not an acceptable password,
    I can become root and set it for her.


    I discourage you from using enforce=none, except perhaps during a warning period
    as you''re implementing new password standards. Voluntary standards are ignored
    standards.


    ## pam_passwdqc Complexity and Length


    pam_passwdqc uses character classes to dictate the minimum length of a password.
    The fewer character classes a password has, the longer the password must be. By
    default, a password that contains only two classes of characters must be 24 characters
    long. A password that includes three classes of characters must be eight characters
    long, while including all four character classes reduces the minimum to seven
    characters.


    The complexity checks have two exceptions. A capital letter at the beginning of
    the password doesn''t count as an additional character class. Neither does a number
    at the end. The password Hamster1 counts as one character class, whereas 1hamsterR
    contains three. You can explain this to your users, or just tell them that capitals
    and numbers need to be in the middle of the password to count. They’ll curse your
    name either way.


    Set the minimum length of a password of each type with the min option. This option
    requires five numerical, comma-separated arguments. Any of these arguments can
    also be set to disabled to automatically reject passwords of that type.


    The first argument dictates the minimum length of passwords with only one character
    class. This defaults to disabled, making pam_passwdqc reject any password made
    of only one character class.


    The second argument gives the minimum length of passwords with two character classes
    that aren''t passphrases. It defaults to 24.


    The third argument gives the minimum length, in characters, of passphrases. We
    discuss passphrases in the next section. Passphrases default to a minimum length
    of 11 characters.


    The fourth argument sets the minimum length of passwords with three character
    classes. This defaults to eight.


    Lastly, the fifth argument gives the minimum length of passwords with four character
    classes. The default is seven.


    This is a weird order; why not? The arguments are ordered by length. A password
    with only two character classes needs to really be secure. A passphrase can be
    a little shorter than that. Passwords with three or four character classes can
    be shorter, or pam_passwdqc will die with an error.


    You can also set a maximum length with the max option, which defaults to 40, but
    passwords that are too long aren’t generally an issue.


    Here are disabled passwords with one or two character classes. Passphrases have
    a minimum length of 16 characters. Passwords with three character classes have
    a minimum length of 10, while passwords with four character classes have a minimum
    length of nine.


    ```

    password requisite pam_passwdqc.so \

    min=disabled,disabled,16,10,9 max=80

    ```


    I''ve defined a password''s maximum length as 80, just to annoy that one guy from
    Sales who''s read too much Neal Stephenson books and thus thinks he understands
    security.


    ## Passphrases


    Instead of a single password, you might set your password to a phrase like Lucas
    needs gelato! This is a passphrase, a series of words instead of a single word.
    Surprisingly, longer passphrases might actually be more secure than shorter passwords
    containing random characters. For one thing, your users won''t write them down
    as often. You can testpassrases with pam_passwdqc.


    Another advantage to passphrases, from the user''s perspective, is that they don''t
    need to have multiple classes. A passphrase like correct battery staple contains
    only one character class but passes the quality check.


    The passphrase option gives the minimum number of separate words that must be
    included for the password to be treated as a passphrase. It defaults to three.
    If a passphrase doesn''t have enough words for pam_passwdqc to treat it as a passphrase,
    it''s merely a password that includes spaces.


    Here I''ve used Debian''s passwdqc.conf to require that passphrases be four or
    more words.


    ```

    passphrase=4

    ```


    Requiring more words in a passphrase will probably, but not certainly, drive users
    to create longer passphrases.


    ## Password Similarity


    The pam_passwdqc module helps discourage users from using similar passwords with
    the match and similar options. When a user changes their password, pam_passwdqc
    checks for common substrings within the password. It can recognize these common
    strings backwards and forwards, as hamster1 versus iretsh, and in different cases.
    The match option gives the number of characters that it looks for in such a matching
    string. The default, four, looks for common strings of four or more characters
    between the old and new passwords.


    ```

    match=4

    ```


    While these checks are needed to keep users from predicting password schemes,
    they can produce unexpected results. Changing the password !meowing6 to homeowner!AtLast.
    The user might be thrilled to have finally bought a home and have adequate space
    for their half-dozen cats, and at first glance these are both adequate passwords—but
    both contain the string meow.


    To turn off these checks, set the option similar to permit. It des to deny.


    ```

    similar=permit

    ```


    Disabling the similarity check is either a bad idea, or a terrible idea.


    While pam_passwdqc has additional options, they mostly manage edge cases when
    you want to tweak the policy as a whole operates.


    The pam_pwquality module takes a more complex approach to password quality. In
