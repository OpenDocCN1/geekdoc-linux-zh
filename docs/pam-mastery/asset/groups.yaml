    Defined minimum requirements for passwords for your system. If an intruder is
    trying to guess the passwords for your system, he can skip all of the possible
    passwords that don''t meet your password standards. To make life harder for attackers$^{23}$,
    use the credits system.


    # Password Quality Credits


    The pam_pwquality system lets you set a minimum password length, but then gives
    the user extra credit for including multiple different character classes. This
    gives flexibility in passwords, but permits people to use shorter passwords if
    they have a greater variety of characters.


    Sysadmins have enough trouble explaining conventional policies to their users.
    I have never successfully explained credits to users. In the real world, I find
    that credits are a bonus for the sysadmin team, not regular users.


    With the credits system, the user gets credit for each additional character class
    that they include in their password. By default, each character class gives one
    extra credit. Consider the world''s worst password, password. It''s eight characters
    long. The user gets extra credit for including lower case scenarios, which is
    scored as having nine characters. If you set the minimum password length to nine
    characters, password qualifies. (It gets rejected for other reasons, mind you,
    but on length alone works.)


