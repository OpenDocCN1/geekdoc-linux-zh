    # Chapter 2: Common Modules


    While Linux-PAM and OpenPAM were separately implemented, their developers used
    Solaris PAM as a model. Both include many modules similar in concept to those
    in older versions of Solaris.


    This chapter takes you through many of those common modules, how they work, and
    what you can do with them. Many of these are very small and provide only a single
    function, but I cover them briefly so that you start to understand how PAM glues
    together all the disparate Unix authentication functions.


    Let''s start with a class you''ll see everywhere.


    # Core Unix Authentication: pam_unix


    The pam_unix module handles all interactions with the system password file, /etc/passwd,
    and related files like /etc/group, /etc/master.passwd, /etc/shadow, and so on.
    It also supports Network Information Service (NIS), the traditional means of managing
    distributed authentication. A host not using a centralized authentication system
    like LDAP or Kerberos almost certainly uses pam_unix. Even hosts that use centralized
    authentication often use pam_unix to look up unprivileged accounts for local applications.


    The auth, account, and password PAM types use pam_unix. It''s not used for the
    session type.


    Password authentication predates PAM by decades. The pam_unix module has the undeniable
    duty of lugging around all years of accumulated functionality, controlled by various
    option flags.'
