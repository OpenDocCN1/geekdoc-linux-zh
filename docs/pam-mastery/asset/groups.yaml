- md: '

    # Chapter 3: PAM Items, Codes, and Functions


    Modules make their decisions based on these items. I often find that modules use
    these items obstinately in unexpected ways. When authentication refuses to behave
    in the manner you expect, falling back to check these items and the module documentation
    is a great place to start.


    Items can change as PAM runs through a policy. Applications can change these items
    as modules provide information. Some applications might forget critical authentication
    information when a module returns a specific code. Modules that return that code
    need to go at the end of the policy, after the decisions have been made. Applications
    might make up placeholder data for an item. Looking at the value of items is a
    good way to figure out why PAM has gone sideways under a program.


    PAM items can contain security-sensitive information. For that reason I strongly
    recommend studying and experimenting with PAM items on a disposable virtual machine,
    rather than in your production environment. PAM uses items to include facts such
    as usernames, hostnames, passwords, and services. Not all PAM-aware programs define
    all items. Defining a remote host makes no sense for su(1), for example.


    Here are the common PAM items.


    ## PAM_SERVICE


    The PAM_SERVICE item contains the name of the policy requested by the application.
    This is normally the name of the program that''s calling PAM—something like `su`,
    `ftpd`, `ssh`, and so on. You could recompile a program to use a different service
    name, but that''s not commonly done.


    ## PAM_USER


    You might think that PAM_USER would give the username of the user requesting authentication.


    You''d wrong.

    PAM_USER is the username that something is trying to authenticate. If you''re
    logging on with FTP, for example, PAM_USER equals your FTP account. If you''re
    running su root, however, you''re trying to authenticate as root. PAM_USER therefore
    equals root.


    ## PAM_RUSER


    The item PAM_RUSER contains the requesting user. It might be a remote user. It
    could be the user requesting su(1) access. A module might set this to the same
    value as PAM_USER. It might not set this at all, if this application involves
    only a single user account.


    ## PAM_TTY


    See which terminal a process is running on by checking PAM_TTY. This might be
    a virtual terminal like pts/2 or a console login like tty2. If this is a graphic
    application that doesn''t really have a terminal, it could be the contents of
    the $DISPLAY environment variable.


    ## PAM_HOST


    This gives the hostname where the authentication is taking place. It''s almost
    always the local host.


    ## PAM_RHOST


    The PAM_RHOST item gives the host where the client runs. For an application like
    FTP, it contains the client''s hostname or IP address. Not all client-server applications
    set PAM_RHOST. Also, applications that run locally, like su(1), don''t normally
    set PAM_RHOST.


    ## PAM_CONV


    This item contains a data structure for the PAM conversation the application expects.
    A sysadmin who needs to dig through this is in trouble.


    ## PAM_AUTHTOK


    The authentication token is the user''s current password, or password-like thing.


    ## PAM_OLDAUTHTOK


    This is the user''s expired password. You''ll see this when changing passwords.


    ## PAM_USER_PROMPT


    This contains the prompt used to request a username for authentication.


    ## PAM_AUTHTOK_PROMPT


    This item gives the prompt to request a password.


    ## PAM_OLDAUTHTOK_PROMPT


    This contains the prompt used to request an expired password. You''ll see this
    when a user needs to change their password before logging in.


    ## PAM_SM_FUNCTION


    Linux-PAM added PAM_SM_FUNCTION to store which PAM service module the function
    is called with. Most sysadmins won''t need this, but don''t let its sudden unexpected
    appearance disturb you.


    ## PAM_TYPE


    Linux-PAM also added PAM_TYPE to show the type of policy that called a module.
    This contains auth, account, password, or session. Linux-PAM calls almost always
    define PAM_TYPE.


    I discuss PAM functions and service module functions later this chapter.


    ## Reading Items with pam_exec


    While PAM modules pass items around, they don''t really provide an interface for
    displaying them to mere sysadmins. Linux-PAM systems offer pam_warn to dump information
    from PAM, but it''s not universally available. We''ll see pam_warn in Chapter
    6. Every Unix-like system supports using the pam_exec module to copy debugging
    information out of a policy, however. Chapters 6 and 7 cover pam_exec in detail,
    but we''ll touch on it here.


    Pam_exec lets you run arbitrary commands as part of a policy. Most often, this
    is a shell script.(You can put simple commands directly into a pam_exec statement,
    but that feels fragile to me.) We''ll use a simple example to copy all PAM items
    from the policy into the system log. Almost every operating system includes pam_exec.


    Here''s a simple script for capturing PAM items and writing them to the system
    log. I install this as /usr/local/scripts/pamvarlog.sh, but you can put it in
    your your preferred location.


    ```sh

    #!/bin/sh

    set | grep PAM | xargs logger

    ```


    This pulls all environment items, grabs any item or value that contains PAM, and
    sends them to the system log.


    Now attach this script to your policy. You want this script near the top.


    ## PAM Return Codes


    Success and failure aren’t always delineated. Just as politics has a scale of
    gray, PAM has a bunch of answers besides “yes” and “no.” The exact interpretation
    of that code depends on how you are authentic.


    When PAM calls a module, the module responds with precisely one return. The exact
    interpretation of that code depends on whether you have passwords locally versus
    in LDAP.


    PAM includes 30 return codes, numbered 0 to 29. Many of them crop up only in bizarre
    circumstances or when the system is mis. Mismatched binary types and unloadable
    libraries show up in the system log, and are familiar parts of every sysadmin''s
    troubleshooting routine. For the complete list, check out the X/Open Single Sign-On
    (XSSO) Pluggable Authentication Modules specification or pam(3).


    Each return code has a formal name, usually given in all caps, starting with PAM.
    You''ll see return codes like PAM_SUCCESS, PAM_AUTH_ERR, and so on. You might
    see the return code number from 0 to 29. You might also see the return code in
    lower case, without the leading PAM_. That is, return codes PAM_SUCCESS, 0, and
    success all refer to the same thing.


    Many return codes appear to overlap. To a system programmer they don''t, but for
    a sysadmin they do. Return codes like PAM_CRED_EXPIRED and PAM_AUTHTOK_EXPIRED
    mean the authentication credentials or password expired. Which error you get depends
    on how you are authentic, but for a sysadmin, they both mean that the user''s
    password or other authentication token is no longer valid.


    You don''t need to know every PAM return code exists, that each PAM call returns
    one and only one code, and how to learn more about each code when it appears.
    Here are the PAM return codes you''re most likely to encounter.


    # PAM_SUCCESS (0)


    The request fully succeeded. The user authenticated correctly. This is an unqualified
    yes.

