    | auth optional | pam_exec.so /usr/local/scripts/pamdebug.sh |

    | pam_opieaccess no_warn allow_local |

    | auth optional | pam_exec.so /usr/local/scripts/pamdebug.sh pam_unix |

    | auth required | pam_unix no_warn try_first_pass nullock |


