  md: '# Chapter 3: PAM Items, Codes, and Functions


    # PAM_CONV


    This item contains a data structure for the PAM conversation the application expects.
    A sysadmin who needs to dig through this is in trouble.


    # PAM_AUTHTOK


    The authentication token is the user''s current password, or password-like thing.


    # PAM_OLDAUTHTOK


