    to use a different version of pam_ssh, such as that found in CentOS.


    # CentOS pam_ssh


    CentOS'' EPEL repository includes a pam_ssh package. Unlike FreeBSD and Debian,
    CentOS doesn''t include any PAM policy statements with the package. You must decide
    how to use pam_ssh, and create rules for your auth and session policies.


    Here, I''ve added pam_ssh to /etc/pam.d/login, the PAM configuration for plain
    text console logins for CentOS 7.2. We''ll start with the auth policy.


    ```

