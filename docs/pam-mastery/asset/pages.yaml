  md: '# Chapter 11: Password Quality Checks


    # Password Similarity


    The pam_passwdqc module helps discourage users from using similar passwords with
    the match and similar options.


    When a user changes their password, pam_passwdqc checks for common substrings
    within the password. It can recognize these common strings backwards and forwards,
    as hamster1 versus iretsh, and in different cases. The match option gives the
    number of characters that it looks for in such a matching string. The default,
    four, looks for common strings of four or more characters between the old and
    new passwords.


    ```

    match=4

    ```


    While these checks are needed to keep users from predicting password schemes,
    they can produce unexpected results. Changing the password !meowing6 to homeowner!AtLast.
    The user might be thrilled to have finally bought a home and have adequate space
    for their half-dozen cats, and at first glance these are both adequate passwords—but
    both contain the string meow.


    To turn off these checks, set the option similar to permit. It des to deny.


    ```

    similar=permit

    ```


    Disabling the similarity check is either a bad idea, or a terrible idea.


    While pam_passwdqc has additional options, they mostly manage edge cases when
