- img_proc: true
  md: '# Chapter 2: Common Modules


    # Preventing Logins


    No matter how far in advance you announce a maintenance window, and how many times
    you remind people, someone will try to use the system when you''re doing a delicate
    upgrade. You might want to have a system in multi-user mode but disallow anyone
    except sysadmins from logging in. Or you might need to solve an administrative
    problem by not letting people log in for a while. The *pam_nologin* module is
    just for you.


    You might think you can achieve similar results by turning services off—nobody
    can log into your host via SSH if the SSH daemon is off! You could also reconfigure
    SSH to allow only ssh to log in, touching configuration files has its own risks.
    The *pam_nologin* module universally prohibits logins. It prohibits logins by
    everyone except a list of privileged users.


    Pam_nologin checks for the existence of a *nologin* file—**/etc/nologin* or */var/run/nologin*
    for Linux-PAM and OS X, and */var/run/nologin* for OpenPAM. If the *nologin* file
    does not exist, users can log in normally. If the file exists, most users cannot
    log in. Pam_nologin uses the contents of the *nologin* file as an error message
    to the application. Whether or not the user sees depends entirely on the application.


    Some systems remove the *nologin* file at boot, while others leave it in place
    boot. What does your operating system do? Check the documentation to see what
    it claims, then try on a test host to discover what it really does.


    Both OpenPAM and Linux-PAM recommend making pam_nologin a required module, and
    putting it at the front of a policy. Use it in every system service you intend
    to temporarily refuse access.'
  merge: -1
