  md: '# Chapter 0: Introduction


    While OS X uses OpenPAM, Apple doesn''t use the common PAM modules. Instead, they''ve
    written their own PAM modules to better integrate with the One True Apple way.


    Commercial UNIX systems usually have their own PAM implementation that behaves
    the way the vendor prefers. IBM''s AIX, for example, uses standard PAM policies
    but calls the pam_aix module almost everywhere. (AIX PAM is also implemented atop
    their proprietary Loadable Authentication Module system, because it''s IBM.)


    # PAM Variances


    Both CentOS and Debian use Linux-PAM. Sadly, you use slightly different versions
    of Linux-PAM. Each distribution''s designers select features and modules that
    make sense for them. The result is, CentOS Linux-PAM includes features and options
    not found in Debian Linux-PAM, and vice versa. I''ll mention some of those differences
    we encounter them. When in doubt, consult your Linux documentation to see what
    toys you get.


    Additionally, Linux-PAM and OpenPAM use PAM differently, because they support
    operating systems with different designs. For example, Linux-PAM can change the
    encryption algorithm used for storing new passwords. BSD and older Sun systems
    handle password encryption algorithms with login classes, so OpenPAM doesn''t
    include that feature. I''ll point out those differences as we go.


    Linux-PAM has more knobs and buttons than OpenPAM. Part of this is because Linux-PAM
    needs features that OpenPAM puts elsewhere, but it also appears that the Linux-PAM
    developers have a fondness for extra knobs and buttons. In an effort to keep you
    from twiddling buttons best left alone, this book gives Linux-PAM a little more
    attention than OpenPAM.'
