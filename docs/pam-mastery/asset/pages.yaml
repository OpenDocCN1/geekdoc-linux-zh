  md: '# Chapter 10: Console Access with SSH Keys


    # Key Selection


    FreeBSD''s pam_ssh automatically tries to decrypt the key files identity, id_rsa,
    id_dsa and id_ecdsa in the user''s $HOME/.ssh directory. Keys with different names
    are not decrypted by the login process.


