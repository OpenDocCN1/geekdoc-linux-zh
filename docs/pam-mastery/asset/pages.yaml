  md: '# Chapter 6: PAM Debugging


    # PAM Logging


    If you cant figure out why a module is behaving unexpectedly, start with logging.


    Basic systems administration problems show up in the system log. My most common
    configuration file error, usually after decades of shouting vile obscenities at
    PAM, forgetting the .so at the end of a PAM module name. PAM searches for the
    nonexistent file pam_unix rather than pam_unix.so, the statement fails, and the
    policy denies access. These errors show up in system logs, in visible logs only
    to root. Check for these logged errors first.


    PAM modules perform routine logging via syslog(3), with the facility auth. These
    normally wind up in a restricted log file accessible only to root, like /var/log/secure
    on CentOS or /var/log/auth.log on FreeBSD and Debian.


    Many modules accept the debug argument to make the module more verbose. The contents
    and amount of information depend entirely on the module. PAM module developers
    all choose to log different things—or or especially—with debugging turned on,
    some PAM modules provide better debugging output than others.


    But sometimes, you dont even get to the module...


    # Debugging with pam_echo


    The pam_echo module prints stuff to the authenticating user. Not all programs
    pass these messages back to the user, but when it works it''s enlightening and
    easy.


    # Using pam_echo


    Pam_echo takes a string of text as an argument, the message to be passed back.


    ```

    auth optional pam_echo PAM auth policy starting

    ```'
