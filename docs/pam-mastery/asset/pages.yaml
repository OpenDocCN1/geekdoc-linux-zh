  md: '# Chapter 11: Password Quality Checks


    Users who create complex passwords get rewarded with shorter passwords.24


    # Common Options


    These options apply whether you''re defining requirements or using credits.


    The difok option sets the minimum number of new characters in the new password.
    This defaults to 5. The new password must include at least five characters that
    do not appear in the old password. If you require long passwords, increase this.


    The maxrepeat option sets the maximum number of times a character can be repeated
    in a row. The default is 0, disabling the check. Setting this to 1 disallows having
    the same character twice in a row.


    With maxclassrepeat, you can limit how many characters of a particular class appear
    together. It''s normally set to 0, disabling the check. Setting this to say, 4,
    would disallow passwords containing random-looking strings like alqn or 81930,
    as they''re longer than 4. You could use all of these characters, but you''d have
    to break them up with other character classes in the middle.


    The maxsequence option sets the maximum length of an increasing or decreasing
    sequence, like abcde or 87654. It defaults to 0, disabling this check.


    If the gecoscheck field is set to any number other than 0, pam_pwquality compares
    the password to the user''s /etc/passwd entry. Matching any word longer than three
    characters in /etc/passwd makes pam_pwquality reject the password.


    > 24 I reward most of my users by reducing the voltage on the random electric
    shocks, but whatever works for you.'
