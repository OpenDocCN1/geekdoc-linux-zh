  md: '# Chapter 4: Linux-PAM Extended Controls and Substacks


    PAM defines four common control statements: required, requisite, sufficient, and
    optional (as well as the widely-ignored binding). These controls determine how
    a PAM module’s successes and failures affect a user’s authentication.


    Linux-PAM offers additional extended control statements that let you fine-tune
    responses, as well as the substack parameter that lets you divert policy processing.
    These appear only in Linux-PAM.


    # Extended Controls


