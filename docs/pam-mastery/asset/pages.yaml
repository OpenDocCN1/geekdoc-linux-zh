  md: '# Chapter 9: One-Time Passwords: Google Authenticator


    Users can adjust clock sensitivity. Each time-based passcode is valid for 30 seconds.
    The GA PAM module permits a small amount of clock skew by default, treating the
    previous and next passcodes as valid. With properly synchronized clocks, the user''s
    passcode is good for about 90 seconds. The user can crank this up in her GA configuration
    file.


    Google Authenticator can also restrict the user to no more than three login attempts
    every 30 seconds. Power users and sysadmins will find this more palatable than
    permitting only one login. Allowing multiple login attempts violates OATH standards,
    though.


    All of these options are set in the user configuration program.


    # GA User Configuration


    To configure GA, each user needs a device with suitable software and a per-user
    configuration.


    # Device Software


    The official Google Authenticator software is available for many smartphones,
    tablets, and the Chrome browser. As the one-time passcodes are based on publicly
    available standards, though, people have written other applications that can act
    as GA clients. There''s a Firefox plug-in. Authy (https://www.authy.com) is one
    popular choice. Windows users might prefer WinAuth (https://winauth.com). Check
    around and find a client you like.


    The easiest way to configure a device requires a QR code reader. The Google Authenticator
    installer recommends one for your device if you don''t have one.


    My examples use the official Google Authenticator client. While my test equipment
    is a Chrome browser and a couple of Android devices, the official GA client should
    work identically on other platforms and operating systems.'
