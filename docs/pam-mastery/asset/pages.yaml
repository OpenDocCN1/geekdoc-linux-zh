    # Passphrases


    Instead of a single password, you might set your password to a phrase like Lucas
    needs gelato! This is a passphrase, a series of words instead of a single word.
    Surprisingly, longer passphrases might actually be more secure than shorter passwords
    containing random characters. For one thing, your users won''t write them down
    as often. You can testpassrases with pam_passwdqc.


    Another advantage to passphrases, from the user''s perspective, is that they don''t
    need to have multiple character classes. A passphrase like correct horse battery
    staple contains only one character class but passes the quality check.


    The passphrase option gives the minimum number of separate words that must be
    included for the password to be treated as a passphrase. It defaults to three.
    If a passphrase doesn''t have enough words for pam_passwdqc to treat it as a passphrase,
    it''s merely a password that includes spaces and is quality-checked as such.


