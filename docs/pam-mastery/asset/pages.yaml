  md: '# Chapter 11: Password Quality Checks


    can explain this to your users, or just tell them that capitals and numbers need
    to be in the middle of the password to count. They’ll curse your name either way.


    Set the minimum length of a password of each type with the min option. This option
    requires five numerical, comma-separated arguments. Any of these arguments can
    also be set to disabled to automatically reject passwords of that type.


    The first argument dictates the minimum length of passwords with only one character
    class. This defaults to disabled, making pam_passwdqc reject any password made
    of only one character class.


    The second argument gives the minimum length of passwords with two character classes
    that aren''t passphrases. It defaults to 24.


    The third argument gives the minimum length, in characters, of passphrases. We
    discuss passphrases in the next section. Passphrases default to a minimum length
    of 11 characters.


    The fourth argument sets the minimum length of passwords with three character
    classes. This defaults to eight.


    Lastly, the fifth argument gives the minimum length of passwords with four character
    classes. The default is seven.


    This is a weird order; why not? The arguments are ordered by length. A password
    with only two character classes needs to really be secure. A passphrase can be
    a little shorter than that. Passwords with three or four character classes can
    be shorter, or pam_passwdqc will die with an error.


    You can also set a maximum length with the max option, which defaults to 40, but
