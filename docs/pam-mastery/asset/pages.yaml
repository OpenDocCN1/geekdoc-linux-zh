- img_proc: true
  md: '# Chapter 10: Console Access with SSH Keys


    pam_ssh provides service to the auth and session types. Used in an auth policy,
    pam_ssh prompts the user for a passphrase. It attempts to decrypt the user''s
    private SSH keys with that passphrase, much as ssh(1) or ssh-add(1) do. If the
    passphrase works, the module returns PAM_SUCCESS. Otherwise, the module fails.
    In a session policy, pam_ssh starts an SSH agent for the user and adds the key
    to the agent.


    FreeBSD includes pam_ssh by default. CentOS has a pam_ssh package, while Debian
    offers a libpam-ssh package. These modules are not only packaged differently;
    they’re different code. FreeBSD imported the original pam_ssh and made improvements.
    That code was extracted from FreeBSD and forked into slightly different versions
    for CentOS and Debian. Each supports different features. We''ll cover every operating
    system''s pam_ssh separately.


    Additionally, each operating system uses pam_ssh differently. We''ll use this
    module as an opportunity to explore how a very similar module can be configured
    with entirely different PAM statements and produce very different behavior.


    All of the versions of pam_ssh we cover the try_first_pass, use_first_pass, and
    debug options.


    # One Module, Different Policies


    All three of our target platforms deploy pam_ssh differently. CentOS does not
    offer any suggestions on placing pam_ssh statements. FreeBSD includes pam_ssh
    in the default install. Statements for pam_ssh appear in FreeBSD''s standard configuration
    files, but they''re commented out. Debian''s libpam-ssh package not only installs
    pam_ssh, but also adds PAM statements to enable the module.


    We''ll consider the simpler FreeBSD case first, then Debian.'
