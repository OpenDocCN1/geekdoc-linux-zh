    You can limit the maximum amount of memory the user can claim for POSIX message
    queues with the msgsque limit. Unlike other memory limits, msgsque is in bytes.


    The main ways to limit processor resources are by the number of concurrent processes
    and the total amount of CPU time. The nproc item lets you set a maximum number
    of simultaneous processes, while cpu lets you set a maximum CPU time in minutes.
    Here''s CentOS lets all system users have a generous 4,096 simultaneous processes,
    but explicitly removes any restrictions from root.


    +   * soft nproc 4096

    root soft nproc unlimited


    Another way to limit processor resources is to control how aggressively the operating
    system schedules the user''s processes. The priority item lets you set the default
    niceness of the user''s processes, as per nice(1). Higher values get less priority.
    Similarly, the nice item lets you set the maximum niceness available to the user.
    Using priority is a nice (no pun intended) to let the user have resources when
    they''re available, but shunt them aside when the system is loaded. Here, we tell
    the user m1 that his tasks don''t matter.


    mwl soft priority 10


    If you''re doing real-time computing, the rtprio item lets you set the user''s
    real-time priority.


    The sigpending item lets you limit the number of signals a user have pending.
    The worrisome thing about this setting is that it was written because someone
    needed it.


    Restrict the total number of simultaneous system logins a user or group can have
    with the maxlogins option. If you want to restrict the total number of non-root
    logins on the system, use the maxsyslogins option. Here we limit the user mw to
    two simultaneous logins.'
