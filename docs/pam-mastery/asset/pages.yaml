    # Debian and pam_ssh


    When you install pam-ssh on Debian, the package automatically adds pam_ssh rules
    to /etc/pam.d/common-auth and /etc/pam.d/common-session. This enables SSH key
    authentication for every service that uses common rules. If host runs Telnet or
