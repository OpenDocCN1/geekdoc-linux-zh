  md: '# Chapter 0: Introduction


    While operating system vendors could coordinate their PAM configurations and come
    up with something that every sysadmin could recognize and use, nobody''s likely
    to do that. Instead, every open source platform welcomes other OS packagers to
    copy their obviously superior design. Therefore, every platform configures PAM
    differently.


    When you first dive into an operating system''s PAM setup, allocate time to understanding
    just how the packagers assembled everything. It''s very easy to assume that the
    people who designed the PAM policies for an unfamiliar operating system are insane.
    Easy, but counterproductive. Study these unfamiliar configurations and figure
    out why they''re put together that way. Not only will you understand the PAM implementation,
    but you''ll gain insight into how the operating system packagers think—and that
    insight will help you master the rest of the system.


    Chapter 10 illustrates how each of our three reference platforms can use one PAM
    module in entirely different ways, for reasons that make perfect sense to the
    operating system packers.


    # PAM Commonalities


    All these different implementations share common structure and configuration syntax.
    Maybe you won''t initially understand why Debian puts a “deny authentication”
    rule near the top of its system-wide configuration, but you''ll understand the
