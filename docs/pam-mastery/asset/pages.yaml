  md: '# Chapter 11: Password Quality Checks


    If you set enforce=users, the password checks apply only to unprivileged users.
    The root user can assign a user an inadequate password. They''ll get a warning,
    but the password will get changed.


    If you set enforce=none, pam_passwdqc prints password requirements, warnings,
    and hints but doesn''t enforce them.


    Here I tell pam_passwdqc to allow root to violate password standards.


    password requisite pam_passwdqc enforce=users


    If I''ve defined a Debian configuration file, this entry can appear on a line
    by itself.


    enforce=users


    Now, when the boss calls complaining that GolfMaster is not an acceptable password,
    I can become root and set it for her.


