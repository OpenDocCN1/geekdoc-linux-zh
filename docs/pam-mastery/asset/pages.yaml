  md: '# Chapter 9: One-Time Passwords: Google Authenticator


    # Passcode Display


    Much like passwords, passcodes are not echoed back to the user. To echo the passcode
    back to the user, use the module option `echo_verification_code`.


    Passcodes are ephemeral entities. In many deployments, a passcode can be used
    only once. Even if someone peers over the user''s shoulder to capture the passcode,
    it expires in a minute or so. Most of the time, displaying the entered passcode
    for the user vastly reduces support calls. Users—yes, even *your users*—can recognize
    they typed the wrong six numbers when they''re visible.


    # Simultaneous Passcode and Password Entry


    Some PAM-enabled applications and modules (such as Radius authentication or SSH
    with `PasswordAuthentication to yes`) don''t cope well with multiple authentication
    prompts. You can tell Google Authenticator to ask for both the password and the
    passcode in a single request by using the `forward_pass` option. GA will digest
    the passcode, but hand the password on the next module. The next module must use
    the `use_first_pass` option to accept the forwarded password.


    ```

    auth required pam_google_authenticator.so forward_pass sufficient pam_unix.so
    try_first_pass

    ```


    A user attempting to authenticate will get a single prompt, like so. `Password
    & verification code:`


    The user needs to enter her password, a space, and the Google Authenticator passcode.
    If the passcode is correct, GA forwards the password to the next module. In this
    case, as the module is sufficient, a correct password immediately permits access.


    You cannot combine `forward_pass` and `echo_verification_code`. Well, you *can*,
    but the GA PAM module will both echo the password with the passcode and reject
    the authentication request, so the combination is not useful.'
