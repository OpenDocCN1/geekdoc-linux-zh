  md: '# Chapter 7: Arbitrary Files and Random Programs


    No, “my username is not in the file” is not a PAM error. According to most people,
    the most common error is the absence of the list file14. Perhaps you want to allow
    access only to accounts listed in /etc/access. If that file is missing, should
    pam_listfile permit access? Or should it refuse? There is no universally correct
    answer, but onerr lets you choose your failure mode.


    # Pam_listfile and Changing Usernames


    You’ll see weird behavior from pam_listfile when a user changes usernames, such
    as su(1) or sudo(1). Pam_listfile checks access based on the target user, not
    the requesting user. It checks the PAM_USER item against the file, not PAM_RUSER.


    Suppose you list user mwl in /etc/access, and configure su(1) to use pam_listfile
    to check for the username in /etc/sulist before permitting access. If mwl runs
    su root, he will be denied access. In this case, mwl is the requesting user, not
    the target user. This means you could use pam_listfile to restrict who accounts
    someone su(1) to, but not from.


    Services like FTP do not change the username, however. There is no requesting
    user, only the user requesting authentication. Pam_listfile works well for these
    services. Alternatively, you could use pam_exec as discussed later.


