    # OpenPAM SSH Agent


    When pam_ssh decrypts a user''s keys, the session pam_ssh statement starts an
    SSH agent and adds the decrypted key to the agent. If pam_ssh cannot decrypt any
    keys, it doesn''t start an agent. Instead, PAM proceeds directly to the next statement
    in the session policy. The end result is if a user logs on with an SSH passphrase,
    he gets an SSH agent. If he logs on with a password, he gets no SSH agent.


    The sysadmin might want users who log on with a password to unilaterally, though.
