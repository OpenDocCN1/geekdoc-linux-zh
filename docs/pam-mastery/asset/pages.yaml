  md: '# Chapter 7: Arbitrary Files and Random Programs


    The Unix model of group membership has limits. If your environment uses cross-platform
    NFS, for example, a single user can be a member of only 16 groups. You might want
    to delegate managing a group to a particular user, but most Unix-like systems
    don''t give you that capability. (Solaris'' capabilities system comes close.)
    Sometimes, you want PAM to just read a list of users that are allowed to access
    a service.


    Similarly, you might want the login process to run a program as part of a PAM
    process. This might be part of an NIS configuration, or related to your firewall,
    or a component of your custom application.


    You can use PAM modules for both of these. We''ll start with Linux-PAM’s pam_listfile.


    # Checking Files: pam_listfile


    Traditional Unix systems included per-application lists of permitted or prohibited
    users. The classic example is /etc/ftpusers, which listed users forbidden to use
    FTP. If you tried to use FTP as, say, root or operator, the FTP daemon checked
    this file and kicked you out.


    Linux-PAM’s pam_listfile tells PAM to read a file containing a list, and permit
    or reject access based on that list. You can permit or deny access based on the
    username or group, but also on the terminal device, the remote host or remote
    user, or the shell.'
