- img_proc: true
  md: '# Chapter 2: Common Modules


    Some services need to use pam_permit to explicitly allow access. You''ll see many
    programs use pam_permit with session policies for this reason.


    # Allowing Root


    PAM lets you explicitly grant the root account its all-encompassing privilege.
    The pam_rootook module allows access if the user is root.


    I most often see pam_rootook used with include statements. Here''s the CentOS
    7 PAM configuration for chfn1(1).


    ```

    auth sufficient pam_rootook.so

    auth include system-auth

    account include system-auth

    password include system-auth

    session include system-auth

    ```


    Taken as a whole, this means “root can always run this command, or others as the
    system authentication permits.”


    Pam_rootook works only for auth statements.


    # Secure Terminals


    Unix-like systems consider some terminals more secure than others. While SSH might
    be a secure protocol, the virtual terminal used by SSH is not inherently secure.
    The physical console might not be in a secure location, but if you have console
    access you can physically alter the machine, so you might as well call it secure.
    Those serial ports might be secure if they''re connected to a local terminal on
    the sysad-min''s desk, but not so much if they''re in a modem pool. If the machine
    and its console are in a room secured by very serious locks, the physical terminal
    is as secure as it can be.


    Normally, a user cannot log in directly as root. They need to log in as a regular
    user, and then su(1) to become root. The pam_securetty module allows a direct
    login as root, and if only if the user authenticates to a secure terminal.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Chapter 2: Common Modules


    BSD systems consider a terminal device secure if its entry in /etc/ttys list the
    **secure** flag.


    Linux systems list terminal devices in /etc/securesttys. Linux-PAM''s pam_security
    also allows logins as **root** on console devices listed on the kernel command
    line, as well as consoles listed in /sys/class/tty/console/active. Pam_security''s
    **nconsole** option disallows these additional devices, restricting **root** logins
    to only devices listed in /etc/securesttys.


    # Login Accounting


    PAM provides information to the user accounting system through the pam_lastlog
    module. On CentOS and Debian, user accounting is in /var/log/lastlog, while FreeBSD
    puts it in /var/log/utx.lastlogin. It also prints the welcome message when the
    user logs in, informing them of the last time they logged in.


    Pam_lastlog only works as part of a session statement.


    Linux-PAM supports several options to modify pam_lastlog''s accounting and login
    behavior. You can disable certain accounting functions with options like **nowtmp**
    and **noupdate**. Options like **noterm** and **nohost** remove information from
    the user''s login message, while **showfailed** displays the last time someone
    failed to log into this account. Finally, the **inactive** option lets you set
    a number of inactive days before the account is locked out for inactivity. You
    can set a number of days, or use the default of 90.


    session optional pam_lastlog.so showfailed inactive=5


    BSD systems handle all of these functions elsewhere, so OpenPAM supports none
    of these features.'
