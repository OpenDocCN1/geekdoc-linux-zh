  md: '# Chapter 9: One-Time Passwords: Google Authenticator


    # New Devices


    Once Google Authenticator is configured, you can pretty much ignore it... until
    you get a new smartphone, tablet, or computer. You''ll probably want to configure
    your new device with the same authentication settings as the old one. Sometimes,
    you literally exchange your old phone for a new one.


    Remember when I said to back up the security code when you first configure your
    account for GA? This is exactly why. Google Authenticator won''t re-display the
    secret, the configuration URL, or the QR code from an existing installation. You
    must use the backup copy you kept. Manually entering the security code is annoying,
    but far better than reconfiguring all of your servers and loading those new configurations
    all of your other devices.


    # Disaster Recovery


    With Google Authenticator you might have two separate kinds of disaster: a stolen
    device, or a broken PAM module. Both have similar disaster recovery considerations.


    Losing one of the factors of your multi-factor authentication system is not disastrous,
    but it does require quick, deliberate action. If you lose the device and the password,
    SSH keys, or other authentication, act the affected user re-run google-authenticator
    or your organization''s wrapper script on all affected hosts. If the situation
    is urgent, use su(1) to run it for the user.


    Another disaster would be when a system''s clock breaks. The GA passcode won''t
    work then.


    When you run google-authenticator, it presents five eight-digit codes after the
    QR code. These are emergency codes. The user can use them to authenticate, but
    each code works only once.'
