  md: '# Chapter 0: Introduction


    volve PAM somewhere along the way, but it''s a simple-minded check. If you''re
    using one-factor authentication, the simple password check works just fine.


    If you want complicated PAM-based authentication, though, by telling sshd(8) to
    link with PAM. The UsePAM option in ssh_config to yes. This enables PAM-based
    account access checks, automatic home directory completion, and so on. It will
    not trigger PAM-based authentication, however.


    The SSH daemon has two options for handling user authentication at the keyboard.
    One, PasswordAuthentication, is specifically for passwords. The other, ChallengeResponseAuthentication,
    is a more generic authentication mechanism. To use PAM, you almost certainly want
    ChallengeResponseAuthentication.


    UsePAM yes


    ChallengeResponseAuthentication yes


    PasswordAuthentication no


    Console and serial port login attempts use the login(8) program, which has its
    own PAM policy. The SSH server can pass part of the user login process to login(8)
    with the UseLogin option. This option is normally no. Interactions between login(8)
