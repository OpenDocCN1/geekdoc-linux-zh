  md: '# Chapter 0: Introduction


    Some authentication protocols, like Kerberos, include a whole sweeping array of
    client-server interactions that far exceed what PAM can support. In Kerberos,
    PAM is a bottleneck. While you can use PAM modules to support Kerberos, you cannot
    implement Kerberos through PAM. This is why SSH handles most of its authentication
    outside PAM (although it can leverage PAM if you decide so).


    This limitation is why people created other authentication protocols, such as
    Simple Authentication and Security Layer (SASL) and the Generic Security Services
    API (GSSAPI), plus all the tools and services that have evolved around these.


    Not all operating systems use PAM. Notably, OpenBSD BSD Authentication, which
    spins authentication requests off into separate processes rather than dynamically
    linked libraries. BSD authentication separates privileges more widely than PAM,
    and hence reduces risk, but is not as flexible as used.


    If you want a taste of authentication administration before PAM, though, consider
    the variety of work needed to implement and deploy Kerberos in all your server
    software. While these applications hook to a common Kerberos domain, you configure
    each in a completely different manner. Imagine that, multiplied by all the authentication
    protocols used today, and all the interactions of those protocols with all the
    different software. PAM looks better now, doesn''t it?


    # PAM Implementations


    While anyone can implement PAM, you''ll most commonly encounter three specific
    versions: Solaris, Linux-PAM, and OpenPAM. The different versions are almost compatible.


    +   2. “Almost compatible” means that anyone supporting more than one version
    will usually have little trouble, but occasionally subtle differences will ruin
    their cherub-like demeanor.'
