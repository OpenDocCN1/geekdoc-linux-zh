  md: '# Chapter 9: One-Time Passwords: Google Authenticator


    The WINDOW_SIZE option dictates how time-sensitive your passcode. A 1 means that
    the precisely current passcode, as dictated by the system clock, will be acceptable.
    Each increase of two means that an extra passcode before and after the current
    one is acceptable. Setting this to 17, the value used if you take the google-authenticator
    suggestion of allowing a four-minute window, means that the passcode for the current
    time, plus eight earlier codes and eight later ones, is acceptable.


