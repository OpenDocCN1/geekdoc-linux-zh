- img_proc: true
  md: '# Chapter 3: PAM Items, Codes, and Functions


    Much PAM documentation assumes that the sysadmin is familiar with the internal
    workings of PAM. The designers expect you to understand which functions PAM calls
    for each type of statement and which internal items and error codes codes slings
    around. Configuring PAM modules and Linux-PAM extended controls requires understanding
    these return codes.


    You don''t need to memorize everything in this chapter. PAM items are critical
    in debugging, and you really need familiarity with them. Specific PAM error codes
    and functions are less vital for sysadmins, however. Study the principles involved
    and what these codes are used for, but you can always look up an error code when
    a PAM module spits it out, and you''ll quickly grow familiar with the errors deveviling
    your environment.


    # PAM Items


    PAM carries a whole bunch of its internal state in a set of well-defined items.
    A process that uses PAM defines the needed items and passes them off to the various
    PAM stacks. All of the items start undefined. Applications and frameworks set
    the items they need. Modules read the items.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 3: PAM Items, Codes, and Functions


    Modules make their decisions based on these items. I often find that modules use
    these items obstinately in unexpected ways. When authentication refuses to behave
    in the manner you expect, falling back to check these items and the module documentation
    is a great place to start.


    Items can change as PAM runs through a policy. Applications can change these items
    as modules provide information. Some applications might forget critical authentication
    information when a module returns a specific code. Modules that return that code
    need to go at the end of the policy, after the decisions have been made. Applications
    might make up placeholder data for an item. Looking at the value of items is a
    good way to figure out why PAM has gone sideways under a program.


    PAM items can contain security-sensitive information. For that reason I strongly
    recommend studying and experimenting with PAM items on a disposable virtual machine,
    rather than in your production environment. PAM uses items to include facts such
    as usernames, hostnames, passwords, and services. Not all PAM-aware programs define
    all items. Defining a remote host makes no sense for su(1), for example.


    Here are the common PAM items.


    # PAM_SERVICE


    The PAM_SERVICE item contains the name of the policy requested by the application.
    This is normally the name of the program that''s calling PAM—something like `su`,
    `ftpd`, `ssh`, and so on. You could recompile a program to use a different service
    name, but that''s not commonly done.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Chapter 3: PAM Items, Codes, and Functions


    # PAM_USER


    You might think that PAM_USER would give the username of the user requesting authentication.


    You''d wrong.

    PAM_USER is the username that something is trying to authenticate. If you''re
    logging on with FTP, for example, PAM_USER equals your FTP account. If you''re
    running su root, however, you''re trying to authenticate as root. PAM_USER therefore
    equals root.


    # PAM_RUSER


    The item PAM_RUSER contains the requesting user. It might be a remote user. It
    could be the user requesting su(1) access. A module might set this to the same
    value as PAM_USER. It might not set this at all, if this application involves
    only a single user account.


    # PAM_TTY


    See which terminal a process is running on by checking PAM_TTY. This might be
    a virtual terminal like pts/2 or a console login like tty2. If this is a graphic
    application that doesn''t really have a terminal, it could be the contents of
    the $DISPLAY environment variable.


    # PAM_HOST


    This gives the hostname where the authentication is taking place. It''s almost
    always the local host.


    # PAM_RHOST


    The PAM_RHOST item gives the host where the client runs. For an application like
    FTP, it contains the client''s hostname or IP address. Not all client-server applications
    set PAM_RHOST. Also, applications that run locally, like su(1), don''t normally
    set PAM_RHOST.'
