  md: '# Chapter 2: Common Modules


    # Allowing and Denying Requests


    When building PAM policies, ending a policy with a firm *yes* or *no* help. PAM
    includes two modules for exactly that.


    **pam_deny**


    Sometimes, you just gotta say no. That''s what *pam_deny* is for.


    Use *pam_deny* to block all requests. By putting *pam_deny* at the end of a policy,
    you declare that everything not permitted earlier is forbidden.


    The *pam_deny* module is especially important when using sufficient statements.
    The sufficient control says “pass this and you''re in, so long as nobody else.
    Fail this, and you can try something else.” If a request reaches the end of a
    bunch of sufficient statements and hasn''t passed any of them, but nothing has
    denied access, adding a *pam_deny* at the end provides an authoritative refusal.


    You''ll also see *pam_deny* used where a request simply makes no sense. CentOS
    provides fingerprint-authentication. The Red Hat developers believe that people''s
    fingerprints don''t change,” so they categorically deny attempts to change the
    user''s password.


    ```

    password        required        pam_deny.so

    ```


    The required control indicates that the module must return success for the request
    to be granted. The *pam_deny* module never returns success. This PAM configuration
    blocks all attempts to change the user''s fingerprint.


    **pam_permit**


    If *pam_permit* is upright and refuses everything, *pam_permit* is its mirror
    twin. Like a really bad negotiator, *pam_permit* says yes to everything. It has
    no options and no tunable behavior.'
