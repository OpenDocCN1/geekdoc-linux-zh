  md: '# Chapter 0: Introduction


    Setting it to publickey means sshd requires public key authentication. Combining
    the two with a comma that sshd requires both, while separating them with a space
    sshd offers a choice of authentication options.


    Most people who want to enable PAM in sshd(8) want the daemon to reject all authentication
