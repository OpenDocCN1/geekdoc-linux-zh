  md: '# Chapter 0: Introduction


    Sun first proposed PAM, and Sun Solaris had the very first implementation. The
    PAM code from Solaris found its way into the open source OpenSolaris, where it
    irrevocably became part of the public source code ecosystem. Oracle purchased
    Sun and no longer publicly releases updates to the Solaris code, but community
    projects like OpenIndiana maintain and update a public version Solaris PAM. While
    other PAM implementers based their modules on Sun''s original work, Sun eliminated
    those modules in favor of entirely new modules. This means that the modules and
    configurations that appear in Linux and BSD systems, while based on Sun''s work,
    bear no resemblance to what currently ships with Solaris PAM.


    Linux-PAM is the Pluggable Authentication Modules implementation used for most
    Linux systems. It closely follows the original Sun model, and many of the PAM
    modules keep the same names and functions of that primordial implementation. It''s
    mostly, but not entirely, compatible with Solaris PAM. You'' find Linux-PAM primarily
    in Linux systems, but it also appears in some commercial Unix variants.³ Sadly,
    different Linux distributions use slightly different versions of Linux-PAM.


    The author of OpenPAM attempted to include the most important parts of Linux-PAM,
    Solaris PAM, and the proposed XSSO standards. OpenPAM originates from the FreeBSD
    community. OpenPAM itself includes very few modules, but what most people call
    OpenPAM is really “OpenPAM and a selection of modules culled from FreeBSD.” BSD-based
    systems that use PAM all use OpenPAM. OpenPAM''s standard modules resemble those
