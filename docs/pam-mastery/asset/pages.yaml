  md: '# Chapter 11: Password Quality Checks


    # Quality Concepts


    All password quality checkers share certain common concepts.


    # Character Classes


    No, not "fighter," "cleric," "thief," and so on. Password checkers break possible
    characters in a password into four different classes: lower-case letters, upper-case
    letters, numbers, and every other ASCII symbol. A fifth character class exists
    for non-ASCII characters, but most of us can''t easily type those. You can require
    a user''s passwords to contain up to four classes, and adjust length requirements
    based on how many classes a proposed password contains.


    Many users build their passwords using a common word as a base. If the sales guy
    must change his password every month, he might just increment a number at the
    end,, replacing hamster1 with hamster2. Password checkers check for substrings
    in common the old and new passwords. You can assign the size of a substring. These
    checks do not record old passwords—remember, a user must provide their old password
    before they can enter a new one, the checker has access to both. These substring
    checks won''t work if root barges in and changes the user''s password.


    # Maximum Password Length


    In past decades, Unix-like systems had a maximum password length of eight characters.
    This seems absurd today, but was necessary for the traditional DES password hashes.
    Even today, add-on services have maximum limits on password length. And if you
    share password files between systems, one of those systems might still use traditional
    hashes. You need to set a maximum length on system passwords. You also must read
    the password checker manual page carefully.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Chapter 11: Password Quality Checks


    If you''re running software that has a maximum password length, get the software
    fixed or replace it. Systems using traditional password hashes are probably decades
    obsolete, mission-critical, minimally funded, and so poorly understood that nobody
    dares touch them. Large enterprises and governments are the worst offenders here.
    Attempting to replace the system will either end your career or, if if you''re
    successful, crown you Dark Lord of the IT Department.²21


    # pam_passwordqc


    The pam_passwordqc module appears almost everywhere except in recent versions
    of CentOS, and has long been the standard tool for checking the quality of new
    passwords during password changes. pam_passwordqc module lets you define password
    length requirements, the number of characters that must differ between old and
    new passwords, the type of characters that must be included in a password, and
    more.


    # Enabling and Configuring


    Both Debian and FreeBSD use pam_passwordqc. The only real difference between them
    is that FreeBSD requires any options to be placed in the PAM configuration file,
    while Debian lets you put pam_passwordqc options in a separate file, pam_passwordqc.conf
    with the config option.


    password requisite pam_passwordqc config=/etc/passwordqc.conf


    The actual configuration options that appear in each are identical, however. We''ll
    show examples from both.


    Once you enable pam_passwordqc, any time tries to change any password they''ll
    have to pass quality checks first. You can relax this strictness with the enforce
    option.


    > 21 You might be a nice person when you start, but the actions needed to replace
