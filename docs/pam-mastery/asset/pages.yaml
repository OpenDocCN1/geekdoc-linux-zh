    Finally, the chroot limit lets you define a directory to chroot(8) as a user into.
    In most cases you wouldn’t use pam_limits to chroot a user, instead relying on
    server software such as sshd(8).


    # PAM and Systemd


    What does authentication have to do with systemd(8)?


    Systemd does not authenticate users. PAM needs to notify systemd when each user
    logs in. Pam_systemd handles that communication. As systemd is not yet a mandatory
    component of most Linux systems, pam_systemd is usually an optional module. It
    goes at the end of the session policy.


    The main function of pam_systemd is to manage systemd scopes and XDG base directories.
    Very few people need to adjust either of these, but you should know it’s possible.
    See the systemd(8) manual page for details if you’re one of those unfortunate
    few.


    This takes you through the most commonly used Linux-PAM modules. Now let’s talk
    about some generic PAM debugging.'
