  md: '# Chapter 1: PAM Components


    # Policy Processing and Results


    A PAM *policy*, or *chain*, is a group of rules of the same type for a service.
    An application might have auth, account, session, and password policies, or it
    might have policies for only some of those. FTP doesn''t need (and shouldn''t
    grow!) for a user to change passwords, after all.


    Here''s the complete default system authentication from a FreeBSD system.


    | auth sufficient | pam_opie.so | no_warn_no_fake_prompts |

    | auth requisite | pam_opiteaccess.so | no_warn allow_local |

    | auth required | pam_unix.so | no_warn_try_first_pass nullock |

    | account required | pam_login_access.so | |

    | account required | pam_unix.so | |

    | session required | pam_lastlog.so | no_fail |

    | password required | pam_unix.so | no_warn_try_first_pass |


    The auth policy is three statements. The account policy is two statements, while
    session and password are only a single statement. Policies can be far, far longer—on
    Linux systems auth policies are at least half a dozen statements, with more added
    on a per-protocol basis. Apple and OpenSolaris-based systems often have one-statement
    policies. (That''s why we''re going through a modest OpenPAM example here.)


    Each policy has the task of allowing or rejecting type of access request. It makes
    the decision based on the statements in the policy.


    Consider the three-statement auth policy above. When a user runs a program that
    invokes this, PAM first calls the module pam_opie and feeds it the required information.
    The pam_opie module has the sufficient control: if it''s successful, the auth
    policy immediately stops processing the policy. A failure from this first module
    doesn''t mean that the module objects to letting the user log in—simply won''t
    say. When a sufficient module fails, PAM continues processing the policy. It''s
    the computing equivalent of “go ask your mother.”'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Chapter 1: PAM Components


    The second auth module, pam_opieaccess, has the requisite control. If this module
    returns success, access is allowed. If the module returns failure, though, PAM
    immediately stops processing the policy and returns failure. It’s a hard yes/no
    decision.


    The last module in the auth policy, pam_unix, is required. If the module returns
    success, access is allowed. If the module returns failure, access is denied.


    Taken as a whole, the auth policy could be processed in a couple ways. If the
    first, sufficient module succeeds, access is immediately allowed. If it fails,
    processing falls through to the next two rules in the policy. Both of these must
    return success for access to be permitted. A failure in either of the last two
    modules denies access.


    In most deployments, policies weigh rejection more heavily than permitting access.
    Most control types have veto power, letting them deny access even if later statements
    in the policy say yes.


    As you can see, PAM policy processing differs from the usual allow/deny syntax
    of your average access control list. Thinking of PAM policies as resembling firewall
    rules will cause you pain. PAM uses its special language to make that clear.


    Now that you understand some basics of how PAM works, let’s look at a few common
    modules and see how they’re configured.'
