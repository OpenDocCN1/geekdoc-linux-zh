    on if you''re the one who needs to make them work. To use PAM, it''s best to let
    the SSH server handle the login process rather than calling up login(8).


    Login no


    Furthermore, tell sshd(8) to consult with PAM on authentication. For that, you
    need the AuthenticationMethods option in ssh_config. The keyboard-interactive
    setting tells sshd to pass authentication through to another agent, such as PAM.
