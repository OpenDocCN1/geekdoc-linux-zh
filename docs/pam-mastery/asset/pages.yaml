  md: '# Chapter 0: Introduction


    In 1995, Sun Microsystems proposed a standard cross-platform, cross-program authentication
    interface. Software adopting that interface could utilize any authentication program
    offering that interface. If you wanted a new authentication mechanism for such
    programs, you could write it to attach to this interface and plug it in to all
    your software. Hence, Pluggable Authentication Modules, or PAM.


    PAM modules are chunks of code that implement a specific authentication method.
    You want to provide authentication with a username and password? That''s a module.
    Via a hardware token? That''s a module. Via gene scans, breathalyzer test, and
    a Dance Dance Revolution platform? Those all would be modules, too, if such exists.
    In an effort to be platform-agnostic, this book uses three modules in many examples.¹
    Modules are shared libraries, dynamically linked into the main program as configured.
    Yes, the phrase “PAM module” is redundant, but that''s sysadmins call them, and
    I already have too many battles to fight to take this on.


    Software that uses PAM receives authentication requests. The program hands each
    request to the configured authentication modules, which tell the server if it
    should allow the authentication request or not.


    Today, PAM is the most widely used authentication standard for Unix-like systems.
    It''s overwhelmingly popular in the Linux world, as well as Solaris-based and
    BSD systems. Even Apple’s OS X uses PAM, as well as commercial UNIX systems like
    AIX and HP-UX.


    > I wanted to use pam_hipster.so as a sample module, but it requires an artisan
    compiler that runs only on this one fascinating architecture. Plus, the code is
    only available via punch cards from this guy who works at the custom bicycle shop
    down the road.'
