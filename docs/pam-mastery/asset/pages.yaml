- img_proc: true
  md: '# Chapter 0: Introduction


    Strictly speaking, PAM is not an officially accepted standard. No Grand Certifying
    Body has placed its stamp on a set of PAM definitions and protocols and declared
    them the One True PAM Specification. The Common Desktop Environment (CDE) included
    PAM, and CDE became a standard in the 1990s, PAM does get referenced in various
    standards documents. Most modern PAM implementations are based on a draft specification
    from an attempt in 1997 to include PAM in the Portable Operating System Interface
    (POSIX). If you really want to dive into PAM, check out the document X/Open Single
    Sign-on Service (XSSO) - Pluggable Authentication Modules, available from a bunch
    of Internet sites, including http://pubs.opengroup.org. People have tried to standardize
    PAM since then, but all attempts have failed.


    The absence of a formal standard means that PAM also lacks a formally defined
    language. Depending on which documentation you read, a group of rules might be
    a chain or a stack or a policy. A component of the authentication process might
    be a type or a facility or a whatsit. In this book I give the most common terms
    for each component, then choose a single word to be used for that component. The
    fact that I use a specific word to refer to a part of PAM doesn''t mean all that
    the other choices are invalid; it only means that you need consistency if you''re
    to understand this gobbledygook.


    # PAM Limitations


    PAM is the most widely used authentication system, but its limitations make it
    unsuitable for some applications.


    The biggest drawback to PAM is that a PAM module can not interact directly with
    clients. The server program is an intermediary between the PAM module and the
    client, and any interaction between the module and client is limited to that offered
    by the standard PAM interface.'
