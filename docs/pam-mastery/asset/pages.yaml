- img_proc: true
  md: '# Chapter 6: PAM Debugging


    So you''ve carefully tuned your PAM statements, but it doesn''t work as you expected.
    Maybe authentication dies somewhere for no discernible reason, or a desired module
    doesn''t seem to get called at all. How can you tell which PAM modules get called,
    and when an authentication request dies?


    In anything to do with computers, all debugging eventually falls back to some
    sort of print statement. PAM skips the preliminaries and drops you straight there.
    You can track a PAM request''s progress through each policy with the system log,
    pam_echo, and pam_exec. You can also fire up program debuggers like ktrace(1)
    and truss(1).


    There''s nothing quite like that lovely feeling you get when you break a host''s
    PAM configuration and no longer have privileges to repair your error. Any time
    you adjust with a host''s PAM configuration, make sure that you leave a terminal
    with root access open. Test all changes thoroughly. Make sure you can still get
    root access from a brand new session before logging out.


    Any of these techniques can make the system leak authentication information into
    the system log or terminal sessions. I recommend performing tests on a disposable
    virtual machine rather than on a system with live users.'
