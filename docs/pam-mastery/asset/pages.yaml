  md: '# Chapter 1: PAM Components


    granted? Should the request try the next module? Should a failure here terminate
    the whole process? These control statements provide PAM’s logic.


    The module is PAM module used. Use the filename of the module, including the trailing
    .so. (OpenPAM allows you to omit the .so.) Most PAM modules installed in a system-specific
    location, such as /usr/lib/ or /lib/x86_64-linux-gnu/security/. If you want to
    use a module that’s not in a standard directory, list it by its full path. Listing
    a module tells PAM to feed the authentication information to this module and collect
    a response. For example, pam_unix.so checks the local system’s password file for
    a valid username and password. If PAM handles this username and password, the
    module will respond either “yes, it exists” or “nope, invalid.” The control statement
    tells PAM what to do for each kind of response. A module can respond with more
    than “yes” or “no,” as discussed in Chapter 4.


    The module arguments are specific to each module. Some arguments, like no_warn
    and debug, are recognized by many modules. The exact meaning of each depends on
    the module, however. Not all modules need or use arguments. A few poorly coded
    modules object to having any arguments at all.


    Split long statements between lines with a backslash (\). auth required pam_echo
    checking OPIE RUSER=%U TTY=%t SERVICE=%s RHOST=%H


