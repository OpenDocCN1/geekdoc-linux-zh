- img_proc: true
  md: '# Chapter 0: Introduction


    Authentication on Unix-like systems is perhaps the closest thing sys-admins have
    to black magic.


    Every sysadmin has heard of Pluggable Authentication Modules, or PAM. We all know
    that the files in /etc/pam.d/ dictate how most software authenticates. If you
    want to use public key authentication, or authenticate with physical tokens, or
    rely only on passwords, you have to muck around in those files. Usually, sysadmins
    blindly follow the instructions and hoping nothing terrible happens.


    PAM policies are not exactly like else in systems admin-istration. A set of PAM
    statements isn''t processed like a set of packet filter rules or a shared library
    path, except when it is. Plus, PAM uses strange words like “requisite; and the
    word “sufficient” apparently means anything “enough.”


    And when you break PAM, you break a whole service. Most services are hard enough
    to get running in the first place, so breaking them is discouraged. Hopefully
    it''s not the service that lets you in to the machine.


    PAM doesn''t have to be black magic, however. Enabling Google Authenticator doesn''t
    absolutely require sacrificing a black cockerel on the thirteenth full moon of
    the year with a knife freshly forged for matrilineally inherited silver. All you
    need are your sysadmin skills and this book.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 0: Introduction


    # Prerequisites and Results


    PAM Mastery is written for systems administrators of moderate experience. You
    need to understand managing shared libraries, installing and removing software,
    and troubleshooting your preferred platforms.


    Not all platforms have packages for all of the modules discussed. Using these
    modules requires building them from source code. While I''ll give basic instructions
    on compiling modules, those instructions assume you''ve compiled software before
    and understand how your platform''s compiler behaves. On CentOS, you''ll need
    the “Development Tools” package group and the pam-devel package. On Debian, you''ll
    need the build-essential and libpam0g-dev packages. The FreeBSD ports system contains
    all of the modules this book discusses.


    This book focuses on cross-platform solutions, especially for educational purposes.
    Perhaps your Unix-like system has a PAM module for exactly a specific task. I''ll
    occasionally mention such modules as we go, but pay most attention to modules
    used by multiple operating systems.


    You''ll also need systems to test on. The nice thing about experimenting with
    PAM is that system requirements are minimal. Virtual machines are perfectly suitable
    for testing PAM. If you''re trying something like using pam_exec to spawn a Perl
    process to manage authentication, you''ll want to perform load testing before
    deploying in production.


    What will you get out of all of this? This book won''t teach you the inddepth
    details of PAM on your preferred platform. It will teach you how to think about
    PAM, how the policies and modules work, and how to explore and master your preferred
    operating system’s PAM implementation. You''ll also carry the expertise gained
    here to any other PAM-using operating system.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Chapter 0: Introduction


    # # What is Authentication?


    Various security and computing bodies have redefined “authentication” to best
    suit their needs. If you dig into security theory, you’ll stumble across the term
    Authentication, Authorization, and Accounting (AAA). Management Information Systems
    documents might focus on resource control, while sysadmins only care about matching
    the user-name and the password.


    For purposes of PAM


    PAM not only verifies authentication credentials. It can arrange home directories,
    log access, enable services, and more. PAM integrates system services with authentication.


    If you’re accustomed to the term *Identification, Authentication, and Authorization
    (IAA)*, you should know that PAM does not handle identification. Systems that
    rely on PAM normally use Name Service Switch (NSS) to manage identification. NSS
    also originated with Solar-is, and predates PAM by a few years. The lack of integration
    between NSS and PAM has caused a continuous migraine for Unix-like systems ever
    since.


    # # Multi-Factor Authentication


    The phrase *two-factor authentication* gets batted around quite a bit. You can
    use PAM to implement two-factor authentication or, indeed, multi-factor authentication.
    The obvious question becomes: what is an authentication factor?'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 0: Introduction


    Authentication is based on one of three user characteristics: something they have,
    something they know, or something they are. “Something they have” refers to a
    physical token, such as a hardware security token or a cell phone tied to a specific
    phone number. These physical items are easily lost or broken. “Something they
    know” is a secret, such as a password written on sticky notes and attached to
    the monitor. “Something they are”—including biometric factors such as a fingerprint,
    an iris scan, or a gene scan—might seem best. But biometric data can be stolen.
    Changing your iris scan pattern in response to that theft is the scope of this
    book.


    Multi-factor authentication requires two or more of these factors. Maybe you need
    a security token and a particular cellphone and a password and a fingerprint.
    An intruder can capture any one of these without too much trouble, but grabbing
    every necessary piece is exponentially more difficult.


    The second half of this book includes several PAM modules that add an authentication
    factor, such as Google Authenticator (Chapter 9) or used for specific purposes,
    like the pam_passwdqc password quality checker (Chapter 11).


    # Why PAM?


    If Pluggable Authentication Modules are such a pain, why use them?


    Because of the alternatives are worse.


    In the early days of computing, every program needed separate configuration to
    support any desired authentication methods. If you wanted a new workstation to
    match the standards demanded by your enterprise network, you needed to adjust
    every program on that workstation. Some of those programs needed configuration
    file changes, while others demanded full-out recompiling. No software or operating
    system supported all authentication methods. And if you wanted to do something
    even a little different… good luck!'
