- md: '

    # 1 Solution Overview


    This document describes how to install, configure, and deploy the sophisticated
    Apache website on the Linux operating system. A website includes the powerful,
    server-side scripting language, PHP3, access to the full-featured SQL database,
    MySQL and the htDig search engine. All of the software packages described in this
    document are open source applications.


    What makes open source so attractive? First of all, it is free. Secondly, you
    get copies of the software source code, which frees you to control the software
    to meet your short-term and long-term requirements.


    The key points of open source software restrictions are that no one:


    - Distributes the product without the source code (or a list of differences between
    the modified version and the original) and a copy of all related documentation

    - Charges for the software itself (only for its distribution)

    - Impose restriction on its distribution


    For information on licensing, refer to the regulations defined by the Open Source
    Initiative organization: http://www.opensource.org/osd.html.


    # 1 Apache Web Server


    Apache is widely used than all web servers combined. A survey by Netcraft in September
    2000 substantiates this claim. After polling over 21 million sites for web server
    software usage on Internet-connected computers, they found over 61% of all Internet
    websites run on apache. (For updates, see http://www.netcraft.com/survey/).


    Clearly, the Apache Software Foundation is meeting its goal "to provide a secure,
    efficient, and extensible server that keeps its HTTP services in step with HTTP
    standards."


    Apache Web Server Project homepage contains versions of the Apache server and
    corresponding documentation that you can download. The official website for the
    Apache server is http://www.apache.org/.


    Getting Support on Apache


    In addition to online documentation and a list of frequently asked questions,
    the Apache site maintains a number of mailing lists. Receive mail from other Apache
    developers about code releases, bugs, security fixes, and other information, join
    one, as announce@apache.org. Locating the mailing list at http://www.apache.org/announcementlist.html.


    # 1.2 PHP Scripting Language


    The PHP (originally Personal Home Page) scripting language supports the creation
    of dynamic, customized websites. With PHP, developers embed scripts within web
    pages. The web server calls PHP to perform the script operations, and then the
    server returns the page to the user. Functionally, PHP and the Microsoft Active
    Server Page (ASP) scripting language are quite similar.


    # Linux Web Solution with Apache, PHP, MySQL, and http://


    As Table 1 demonstrates, PHP is rich and flexible software.


    | Table 1. PHP Features | PHP supports | Examples |

    |---|---|---|

    | Multiple platforms | Linux/Intel, Linux/Alpha, Compaq Tru64 UNIX Windows 95/98/NT
    and Windows NT |

    | Multiple databases | MySQL, Oracle, Informix, subbase, and Unix dbm. |

    | E-mail protocols: | IMAP (Internet Message Access Protocol) POP3 (Post Office
    Protocol 3) SMTP (Simple Mail Protocol) |

    | USENET news protocol | NNTP (Network News Transfer Protocol) |

    | Miscellaneous features | | Session-based authentication, Graphics library for
    dynamic image creation, Low-level network and socket interface |


    PHP continues to grow. Many open-source and commercial projects choose PHP as
    an implementation language for web-based e-solutions, database access tools, searching
    for e-commerce sites, others. The official PHP website at http://www.php.net publishes
    usage statistics from RecNet. At the current growth rate, as of September 2000,
    there will be in excess of 3.5 million (virtual) servers using PHP. To read a
    complete list of projects, select "Projects" on the PHP website.


    # Getting Support on PHP3


    In addition to online documentation and a list of frequently asked questions,
    the PHP site maintains sets of mailing lists. As mailing members learn about the
    PHP product, they can share their findings with others on the mailing list. If
    you prefer a bundled set you subscribe to the twice-daily digest. Multiple countries
    maintain mailing lists; at the time of this writing, there are versions in English,
    Italian, Portuguese, and Spanish. For general discussions subscribe to php3@lists.php.net.


    To subscribe to or another mailing list, see the PHP3 support page, http://www.php.net/support.php.


    # 1.3 MySQL Database


    MySQL (pronounced "my - S - Q - L") is a multi-threaded database server with a
    client/server implementation. Its speed, robustness, and ease of use make it a
    popular database for sites with dynamic content. PHP3, C++, Java, and Perl access
    MySQL directly.


    The MySQL source code, plus pointers to manuals and MySQL tutorials, are available
    at the official website for the MySQL database at http://www.mysql.com


    # MySQL Mailing Lists


    The MySQL site maintains a set of mailing lists. As mailing members learn about
    the MySQL product, they can share their findings with others on the MySQL site.
    Web designers can benefit from the general user mailing list and the announcements-only
    lists. For people using the MySQL-Java interface, the MySQL-ODBC interface, and
    the MySQL on Windows32 platform. Sign up for MySQL mail at: http://www.mysql.com/documentation/index.html.


    # 1.4 htDig Search Engine


    The search engine package, htDig, is a complete web indexing and searching system;
    it is one of the few open source software packages available for this purpose.


    Unlike AltaVista, which can scale to Internet-wide searches, htDig systems are
    designed for smaller configurations, such as small domains, single sites, or website
    subsections. If necessary, htDig can index a number of web servers. With proper
    filters installed, htDig can index and search through Adobe Acrobat (.pdf) files
    and Microsoft Word (.doc) files.


    The source kit, manuals, and an archive of user mailing lists are located on the
    product''s official website at http://www.htdig.org/.


    Getting Support and Mail on htDig


    The htDig site maintains a set of mailing lists. As mailing list members learn
    about the product, they can share their finding with others on the list. The two
    most useful mailing lists are as follows:


    - For discussion of htDig and related announcements: htdig@htdig.org

    - For receiving notices of new releases: htdig3announce@htdig.org


    To subscribe to either, use the form on http://www.htdig.org/mailarchive.html.


    # 2 Sizing Considerations


    The performance of a web system is dependent on a number of highly variable conditions
    that include:


    - Popularity of the website

    - The number of static pages (.html, .gif, .jpg) versus dynamically generated
    pages

    - Complexity of the server code

    - Size and design of the database

    - Search engine usage

    - Usage of encryption technology like SSL


    Performance guidelines are based on the documentation provided with the Open Source
    software and on testing performed by Compaq.


    Table 2 describes the typical CompaqLiant servers that are used for the building
    blocks of interactive websites.


    | Configuration | System | | | Memory |

    ||---|---|---|

    | Small | ProLiant 360, ProLiant 380 | 1 → 2 | 512 MB → 1 GB |

    | Medium | ProLiant 380 | 1 → 2 | 512 MB → 2 GB |

    | Large | Frontend: See Distributed Internet Server Array (DISA) configuration
    document: * ProLiant 360, * ProLiant 380. Backend: * ProLiant 380, * ProLiant
    580 | | | |


    # 2.1 Small Configurations


