    # Linux Web Solution with Apache, PHP, MySQL, and http://Dig


    # Abstract


    Of all the web servers on the market today, Apache is most popular because it
    supplies basic web server functionality right out of the box. Yet, many customers
    want a more sophisticated website, with SQL database functionality, search capabilities,
    and server-side scripting. The complexity and interdependencies of these packages
    make it difficult for independent software vendors, solution developers, and website
    administrators to put together a solution.


    Customizing the Apache server with additional functionality can be complex on
    the Linux platform. The solutions for extending functionality are not just obvious.


    This technical guide demonstrates how to integrate PHP, MySQL, and http://Dig
    with the Apache server. Independent software vendors, solution developers, programmers,
    and website administrators can use this guide to plan and deploy Apache web servers
    on the Linux platform.


    Send your comments and questions on this solution to activeanswers_support@compaq.com.
    Please include the Document Number (shown in the upper left corner of this page)
    in the Subject line of your message.


