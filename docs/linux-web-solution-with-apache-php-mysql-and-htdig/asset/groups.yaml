    etcpasswd\".\n\n```\n# mysqladmin -u root -p create etcpasswd\nEnter password:\n\
    \  Database \"etcpasswd\" created.\n#\n```\n\n- Enter the MySQL interactive monitor\
    \ and connect to the newly created \"etcpasswd\" database using root privileges.\n\
    \n```\n# mysqlpasswd -u root -p\nEnter password:\nWelcome to the MySQL monitor.\
    \ Commands end with ; or \\g.\nYour MySQL connection is 39 to server version:\
    \ 3.22.32\n\nType 'help' for help.\n```\n\n- Create a table to hold the information.\
    \ The following command will hold the contents of the /etc/passwd file.\n\n```\n\
    mysql CREATE TABLE users (login VARCHAR(20), optpw VARCHAR(20), \\\nuid INT, gid\
    \ INT, name VARCHAR(40), homedir VARCHAR(40), \\\nshell VARCHAR(40));\nQuery OK,\
    \ 0 rows affected (0.00 sec)\n```\n\n- Give all privileges to the etcpasswd database\
    \ to the user named, for example, \"admin\", but only from the same system on\
    \ which MySQL is running. Be aware that this username is unrelated to Linux user\
    \ accounts.\n\n```\nmysql GRANT ALL PRIVILEGES ON etcpasswd.* \\\nTO admin@localhost\
    \ \\\nIDENTIFIED BY 'somepassword';\n```\n\n- Direct MySQL to import the file\
    \ /etc/passwd into the \"users\" table. Using a single column to separate values.\n\
    \n```\nmysql LOAD DATA INFILE '/etc/passwd' INTO users \\\nFIELDS TERMINATED BY\
    \ ';';\nQuery OK, 34 rows affected (0.00 sec)\nRecords: 34 Deleted: 0 Skipped:\
    \ 0 Warnings: 0\n```\n\n- 6. Verify that the information was loaded. The following\
    \ SQL command displays only the login name columns from the users table. The results\
    \ are limited to the first five entries. To display all the information, use the\
    \ command \"select from users\";\n\n```\nmysql> select login, name from users\
    \ limit 1,5;\n+----------------------+\n| login | name |\n+----------------------+\n\
    | bin   | bin   |\n| daemon| daemon|\n| adm   | adm   |\n| lp    | lp    |\n|\
    \ sync  | sync  |\n+----------------------+\n5 rows in (0.00 sec)\n\nmysql> quit\n\
    #\n```\n\n## 3.2.5 Verifying the PHP3 Connection to MySQL\n\nNow, make sure all\
    \ the software works. After testing import data, you can obtain data from MySQL\
    \ using PHP. Below is sample code that will display in a table of all the users\
    \ in the database that contain the letter \"o\". Put the code in convenient location,\
    \ for example /usr/local/apache/htdocs/demo.php.\n\n```php\n<?php\n// Connect\
    \ to the MySQL server running on this system\nmysql_connect(\"localhost\", \"\
    admin\", \"somepassword\")\nor die(\"Unable to connect to SQL server\");\n\n//\
    \ Use the etcpasswd database\nmysql_select_db(\"etcpasswd\")\nor die(\"Unable\
    \ to select database\");\n\n// Get a list of the column names for the users database\n\
    $result = mysql_list_fields(\"etcpasswd\", \"users\");\n\n// Get all fields for\
    \ all rows whose login name contains the letter \"o\"\n$query = mysql_query(\"\
    select * from users where login like '%_o_%%\");\n\n// Get a count of the number\
    \ of rows that were returned\n$affected = mysql_num_rows($query);\n\nif!($affected)\
    \ {\n    echo \"No users with an 'o' in their name returned\";\n} \nelse {\n \
    \   // Display the column names\n    echo \"<table align='center' border=1>\"\
    ;\n    echo \"<tr>\" . mysql_field_name($result,0) . \"</th></tr>\";\n    echo\
    \ \"<td>\" . mysql_field_name($result,4) . \"</td>\";\n    echo \"<td>\" . mysql_field_name($result,5)\
    \ . \"</td></tr>\";\n    // Display each row\nwhile($row=mysql_fetch_row($query))\
    \ {\necho \"<tr><td>$row[0]</td></tr>\";\necho \"<td>$row[4]</td></tr>\";\necho\
    \ \"<td>$row[5]</td></tr>\";\n}\n\necho \"</table>\\n\";\n\n// release memory\
    \ associated with the query\nmysql_free_result($query);\n?>\n```\n\nThe resulting\
    \ web page will look similar to the one shown in Figure 2.\n\nFigure 2. Result\
    \ of Query to MySQL via PHP\n\n![](img/36cca419b7fb93321343e40d77521ed5_20_0.png)\n\
    \n13T3-1100A-WWEN\n\nLinux Web Solution with Apache, PHP, MySQL, and ht://Dig\n\
    \n## 3.2.6 Verifying that ht://Dig Is Working\n\nAfter the rundig.sh script completes\
    \ as described in Section 3.1.5 , open the URL http://127.0.0.1/search.html. This\
    \ URL should present a search query page, similar to the one shown in Figure 3.\n\
    \nFigure 3. ht://Dig Search Page\n\n![](img/36cca419b7fb93321343e40d77521ed5_21_0.png)\n\
    \n13T3-1100A-WWEN\n\nLinux Web Solution with Apache, PHP, MySQL, ht:///Dig\n\n\
    Enter a query and view the results. The rundig.sh script should have indexed the\
    \ local copy of the Apache manual. Try searching for “server”. Figure 4 displays\
    \ a sample of the results.\n\n## Figure 4. ht://Dig Search Results\n\n![](img/36cca419b7fb93321343e40d77521ed5_22_0.png)\n\
    \n13T3-1100A-WWEN\n\n## 4 Managing an Apache Server\n\nOnce installed, the Apache\
    \ web server should run unattended for long periods. Yet it is wise to monitor\
    \ the server to ensure it runs smoothly.\n\n### 4.1 Monitoring the Log Files\n\
    \nTo make certain your system does not run out of disk space, monitor the disk\
    \ partition that holds the access and error logs. By default, the Apache server\
    \ stores these logs at /usr/local/apache/log.\n\nThe growth rate of log files\
    \ varies widely by log size depends on the frequency of hits as well as the type\
    \ of URL requested. Although you can assume that it hit logs about 150 bytes of\
    \ data, usage is contingent on the structure of the web content directory and\
    \ naming conventions. \n\nThe logrotate tool is designed to ease administration\
    \ of systems that generate large numbers of log files. It allows automatic rotation,\
    \ compression, removal, and mailing of log files. Each log may be handled daily,\
    \ weekly, or when it grows too large. If your Linux distribution does not include\
    \ logrotate, you can obtain it from the following site:\n\n```\nftp://ftp.redhat.com/pub/linux/RedHat/redhat/code/logrotate/\n\
    ```\n\nor one of the many RedHat mirrors.\n\n### 4.2 Monitoring Network Connections\n\
    \nSome third-party open source Apache modules limit the number of simultaneous\
    \ connections to particular directories or slow down responses for users who exceed\
    \ a \"bytes per second\" download rate.\n\nApacheWeek maintains a list of modules\
    \ that throttle access to web domains. For more information, see their web page\
    \ at http://www.apacheweek.com/features/modulesoup\n\n### 4.3 Monitoring System\
    \ Performance\n\nThere are a number of open source tools to monitor systems in\
    \ general and web servers in particular.\n\n### 4.3.1 Status Displays\n\nThe module\
    \ mod_status relays information about the general operation of the Apache web\
    \ server, for example, its running time and a count of current requests, Apache\
    \ child processes, total accesses and bytes sent\n\nBy default, the Apache configuration\
    \ file (httpd.conf) has access to status reports denied from everywhere.\n"
