    \ separated by spaces. By default, only links on the system are followed. For\
    \ example, the line changes the htdig starting point to be the name of this web\
    \ server.\n\n```\nStart_url: http://www.isp.com/\n```\n\n### 3.1.5.3 Changing\
    \ Search Method from HTTP Connections to Entry through the File System\n\nWith\
    \ this method htdig traverses the content directly, a method which greatly reduces\
    \ the time needed to index a website and the amount of clutter in web logs.\n\
    Note: This method works only if the web server and the search engine are on the\
    \ same system or if they can access the same disks by NFS.\n\nTo demonstrate this,\
    \ the htdig.conf file, add an entry for local_urls that provides a mapping from\
    \ the web space to the file system location. For example, if http://www.isp.com\
    \ is located at /usr/local/apache/htdocs and the content for http://www.isp.com/products\
    \ is on /home/data/, you would have an entry like this:\n\n```\nlocal_urls:\n\
    http://www.isp.com=/usr/local/apache/htdocs/\nhttp://www.isp.com/products=/home/data/\n\
    ```\n\n## 3.1.6 Building Search Engine Database\n\nAfter installing and optimizing\
    \ htdig to index the database, you run a script to build the database. htdig includes\
    \ a script in /opt/www/htdocs/bin/rundig.sh. To work out any configuration problems,\
    \ run the script from the command line. Once the script is working properly, run\
    \ it periodically as a cron job.\n\nSee \"man cron\" and \"man 5 crontab\" for\
    \ information on how to set up batch jobs.\n\n## 3.2 Verifying the Installation\n\
    \nOnce the software components have been installed, you need to verify that all\
    \ the components are working properly. The following sections describe how to\
    \ verify the following:\n\n- Apache invokes the PHP3 scripting engine to process\
    \ files and PHP3 has MySQL support built in.\n- A MySQL test database can be set\
    \ up.\n- PHP scripting engine can connect to the MySQL database.\n- htdig search\
    \ engine has indexed the site and is working.\n\n### 3.2.1 Verifying Automatic\
    \ Boot\n\nSince the system startup scripts have been modified to start the Apache\
    \ web server and MySQL database, a restart should be done before deploying the\
    \ system. At this point of the procedure, all the servers are running so you can\
    \ do the following verification steps and check the startup procedure:\n\n###\
    \ 3.2.2 Verifying PHP3 Operation\n\nCreate a file named phpinfo.php3 and add the\
    \ following line to the file.\n\n```php\n<?php phpinfo() ?>\n```\n\nPut the file\
    \ in the Apache DocRoot, which by default is called /usr/local/apache/htdocs.\n\
    Start a web browser and go to http://127.0.0.1/phpinfo.php3. If PHP3 is working\
    \ properly, the web browser will display a screen similar to the one displayed\
    \ in Figure 1. Be sure to verify that MySQL is listed under the extensions.\n"
  mdcn: "\n使用 Apache、PHP、MySQL 和 http:// 的 Linux Web 解决方案\n\n-   卸载任何现有的 Apache 服务器。（如果你正在运行某一个\
    \ Linux 发行版，你可能已经有了 Apache 服务器。）如果你已经更改了配置，你可能想以新名称保存 Apache 文件。按照以下方法删除现有版本：\n\
    \n```\n# rpm -qa | grep apache\napache-1.3.3-1\napache-devel-1.3.3-1\n```\n\n\
    -   在安装了其他包的情况下，你将收到关于其他包依赖关系的警告。必须先删除它们。RPM 管理器提示使用 \"man rpm\" 获取关于使用该工具的信息。例如：\n\
    \n```\n# rpm -e mod_perl-1.15-3 mod_php-2.0.1-5 mod_php3-3.0.5-2\n# rpm -e apache-1.3.3-1\
    \ apache-devel-1.3.3-1\n```\n\n在下一步中，你将编译 PHP，并完成 Apache 安装的第二阶段。\n\n## 3.1.3\
    \ 安装 PHP3\n\n导航到 PHP 的官方网站 http://www.php.net/。该网站提供了 PHP 源码包、手册、代码示例以及使用 PHP3\
    \ 的其他开源包的指针。进入“Downloads”并从最近的镜像站点下载最新的 PHP3 源码包。将该包（例如 php-3.0.17.tar.gz）保存在方便的位置\
    \ /usr/src/，并使用以下命令解压该包：\n\n-   获取源码，使用与之前命令中 Apache 切换时相同的 Apache src 目录。\n\n\
    ```\n# cd /usr/src/\n# tar xzf php-3.0.17.tar.gz\n```\n\n> 注意：在下一步中，使用与之前命令中 Apache\
    \ 切换时相同的 Apache src 目录。\n\n-   编译 PHP3。PHP3 在编译为 Apache 模块并使用 MySQL 之前需要进行配置。\n\
    \n有许多你可能想要启的编译选项。常用的选项包括 IMAP 支持、用于动态创建图像的 GD、轻量级访问协议 (LDAP) 支持、WebDAV（HTTP 分布式授权与版本控制\
    \ (DAV)）支持以及 zlib（压缩库）。这些选项需要安装额外的包，并且超出了本文的范围。要编译 PHP3，输入以下命令：\n\n```\n# cd /usr/src/php-3.0.17/\n\
    # ./configure --with-mysql --with-apache=../apache_1.3.14 \\\n--enable-track-vars\n\
    ```\n\n-   使用以下命令安装 PHP3：\n\n```\n# make\n# make install\n```\n\n## 3.1.4 重新配置\
    \ Apache 服务器（第二阶段）\n\n此时，MySQL 数据库正在运行，Apache 服务器已部分就绪，PHP 库已安装。你将重新配置 Apache\
    \ 服务器以使用 PHP。\n\n-   返回 apache_1.3.14 目录，如下：\n- cd /usr/src/apache_1.3.14/\n-\
    \ 编译带有 PHP 模块的 Apache 服务器，以及 mod-status 和 mod-info 两个模块，你可以通过配置信息和服务器状态配置 Web\
    \ 管理员。\n- #/.configure --activate-module=src/modules/php/libphp3.a \\\n  --enable-module-info\
    \ --enable-module=status\n- # make\n- # install\n- 编辑编辑配置文件。\n\nPHP 的默认配置是合理的，但你可以修改某些资源限制。默认情况下，任何\
    \ PHP 页面的最大执行时间 (execution_time) 为 30 秒。\n将 PHP 的配置移动到系统目录，如下：\n\n- cp /usr/src/php3-3.0.17/php3.ini-dist\
    \ /usr/local/lib/php3.ini\n- 编辑 Apache 配置文件 /usr/local/apache/conf/httpd.conf，使其处理带有\
    \ php3 扩展的文件。删除以下行中的 # 字符：\n#AddType application/x-httpd-php3 .php3\n#AddType\
    \ application/x-httpd-php3-source .php\n\n-   使用以下命令启动 Apache Web 服务器：\n- /usr/local/apache/bin/apachectl\
    \ start\n- 同样编辑你的系统启动脚本 /etc/rc，包含以下命令：\n- /usr/local/apache/bin/apachectl start\n\
    \n## 3.1.5 安装 htdig 搜索引擎\n\n-   从官方网站 http://www.htdig.org/ 获取 htdig 源码。\n然后进入“Where\
    \ to get it”页面并下载最新的源码包（编写时版本为 3.1.5）。\n将该包（例如 htdig-3.1.5.tar.gz）保存在方便的位置如 /usr/src/，并使用此类命令解包：\n\
    - cd /usr/src/\n- tar zxf htdig-3.1.5.tar.gz\n- cd /usr/src/htdig-3.1.5\n\n编译\
    \ htdig。默认情况下，搜索引擎将文件放置在 /opt/www/htdig 目录。\n构建该包非常简单：使用以下命令进行配置、编译和安装。注意设置 Apache\
    \ 目录默认位置的开关。\n\n```\n# ./configure --with-cgi-dir=/usr/local/apache/cgi-bin \\\
    \n--with-image-dir=/usr/local/apache/icons \\\n--with-search-dir=/usr/local/apache/htdocs\n\
    ```\n\n```\n# make\n# make install\n```\n\n重新配置 Apache 服务器，使其能够找到 htdig 使用的内容。为此，修改文件\
    \ /usr/local/apache/conf/httpd.conf。找到 aliases 部分并在末尾插入此行：\nAlias /htdig/ \"/usr/local/apache/icons/\"\
    \n\n由于你修改了 Apache 配置文件，你需要重启进程以启用此更改。以下命令将重启 Apache 服务器：\n# /usr/local/apache/bin/apachectl\
    \ restart\n\n### 3.1.5.1 更改文件位置\n\n由于数据库可能会变得很大，将数据库移动到具有足够剩余空间的分区是一个好主意。\n注意：运行在\
    \ Intel 上的 Linux v2.x 最大大小为 2 GB。运行在 Alpha 上的 Linux 最大大小为 8 GB。\n搜索数据库的存储需求各异。为了给预期搜索内容大小的两倍充分分配存储，索引增长比被索引的内容量略大。这种搜索不支持大量信息扩展。\n\
    要移动数据库，通过修改 htdig.conf 文件（通常位于 /opt/www/htdig/config/）来修改以下行：\n\n```\ndatabase_dir:\
    \ /opt/www/htdig/db\n```\n\n### 3.1.5.2 更改搜索引擎查找内容的起点\n\n这是一个由空格隔开的 URL 或文件位置列表。默认情况下，只跟随系统上的链接。例如，该行将\
    \ htdig 的起点更改为此 Web 服务器的名称。\n\n```\nStart_url: http://www.isp.com/\n```\n\n###\
    \ 3.1.5.3 将搜索方法从 HTTP 连接更改为通过文件系统进入\n\n使用这种方法 hdig 直接遍历内容，这种方法大大减少了索引网站所需的时间以及\
    \ Web 日志中的混乱。\n注意：此方法仅在 Web 服务器和搜索引擎位于同一系统上，或者它们可以通过 NFS 访问相同的磁盘时才有效。\n\n为了演示这一点，在\
    \ htdig.conf 文件中添加一个 local_urls 条目，提供从 Web 空间到文件系统位置的映射。例如，如果 http://www.isp.com\
    \ 位于 /usr/local/apache/htdocs 且 http://www.isp.com/products 的内容位于 /home/data/，你将拥有如下条目：\n\
    \n```\nlocal_urls:\nhttp://www.isp.com=/usr/local/apache/htdocs/\nhttp://www.isp.com/products=/home/data/\n\
    ```\n\n## 3.1.6 构建搜索引擎数据库\n\n在安装并优化 htdig 以索引数据库后，运行一个脚本来构建数据库。htdig 在 /opt/www/htdocs/bin/rundig.sh\
    \ 中包含一个脚本。为了解决任何配置问题，从命令行运行该脚本。一旦脚本正常工作，请将其作为 cron 任务定期运行。\n\n查看 \"man cron\"\
    \ 和 \"man 5 crontab\" 获取有关如何设置批作业的信息。\n\n## 3.2 验证安装\n\n一旦安装了软件组件，你就需要验证所有组件是否正常工作。以下章节描述了如何验证以下内容：\n\
    \n- Apache 调用 PHP3 脚本引擎处理文件，且 PHP3 内置了 MySQL 支持。\n- 可以设置 MySQL 测试数据库。\n- PHP 脚本引擎可以连接到\
    \ MySQL 数据库。\n- htdig 搜索引擎已索引站点并正常工作。\n\n### 3.2.1 验证自动启动\n\n由于系统启动脚本已修改以启动 Apache\
    \ 服务器和 MySQL 数据库，在部署系统之前应该进行重启。在此程序的阶段，所有服务器都在运行，因此你可以执行以下验证步骤并检查启动过程：\n\n###\
    \ 3.2.2 验证 PHP3 操作\n\n创建一个名为 phpinfo.php3 的文件并在文件中添加以下行：\n\n```php\n<?php phpinfo()\
    \ ?>\n```\n\n将该文件放在 Apache DocRoot 中，默认称为 /usr/local/apache/htdocs。\n启动 浏览器并访问\
    \ http://127.0.0.1/phpinfo.php3。如果 PHP3 工作正常， 浏览器将显示与图 1 所示的屏幕。务必验证扩展列表中是否列出了\
    \ MySQL。\n\n"
