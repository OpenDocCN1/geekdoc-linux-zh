    # 4 Managing an Apache Server


    Once installed, the Apache web server should run unattended for long periods of
    time. Yet it is wise to monitor the server to ensure it runs smoothly.


    # 4.1 Monitoring the Log Files


    To make certain your system does not run out of disk space, monitor the disk partition
    that holds the access and error logs. By default, the Apache server stores these
    log files at /usr/local/apache/log.


    The growth rate of log files varies widely by log size depends on the frequency
    of hits as well as the type of URL being requested. Although you can assume that
    it hit logs about 150 bytes of data, usage is contingent on the structure of the
    web content directory and naming conventions. One hundred and fifty bytes per
    hit translate to one megabyte of log for every 7000 hits.


    The logrotate tool is designed to ease administration of systems that generate
    large numbers of log files. It allows automatic rotation, compression, removal,
    and mailing of log files. Each log may be handled daily, weekly, or when it grows
    too large. If your Linux distribution does not include logrotate, you can obtain
    it from the following site:


    ```

    ftp://ftp.redhat.com/pub/linux/RedHat/redhat/code/logrotate/

    ```


    or one of the many RedHat mirrors.


    # 4.2 Monitoring Network Connections


    Some third-party open source Apache modules limit the number of simultaneous connections
    to particular directories or slow down responses for users who exceed a "bytes
    per second" download rate.


    ApacheWeek maintains a list of modules that throttle access to web domains. For
    more information, see their web page at http://www.apacheweek.com/features/modulesoup


    # 4.3 Monitoring System Performance


    There are a number of open source tools to monitor systems in general and web
    servers in particular.


    # 4.3.1 Status Displays


    The module mod_status relays information about the general operation of the Apache
    web server, for example, its running time and a count of current requests, Apache
    child processes, total accesses and bytes sent


    By default, the Apache configuration file (httpd.conf) has access to status reports
    denied from everywhere.'
