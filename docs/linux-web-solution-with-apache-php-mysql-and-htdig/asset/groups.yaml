    \ URL 应显示搜索查询页面，如图 3 所示。\n\n图 3. HTTP 搜索页面\n\n![](img/36cca419b7fb93321343e40d77521ed5_21_0.png)\n\
    \n13T3-1100A-WWEN\n\n基于 Apache、PHP、MySQL 和 HTTP 的 Web 解决方案\n\n输入查询并查看结果。rundig.sh\
    \ 脚本应该索引了 Apache 手册的本地副本。尝试搜索“server”。图 4 显示结果示例。\n\n## 图 4. HTTP 搜索结果\n\n![](img/36cca419b7fb93321343e40d77521ed5_22_0.png)\n\
    \n13T3-1100A-WWEN\n\n## 4 管理 Apache 服务器\n\n安装后，Apache Web 服务器应该无人值运行一段时间。然而，监控服务器以确保其运行良好是明智的。\n\
    \n### 4.1 监控日志文件\n\n为了确保系统不会耗尽磁盘空间，请监控持有访问和错误日志的磁盘分区。默认情况下，Apache 服务器将这些日志存储在\
    \ /usr/local/apache/log。\n\n日志文件的增长速度差异很大，日志大小取决于访问频率以及请求的 URL 类型。虽然你可以假设访问日志约为\
    \ 150 字节数据，但使用取决于 Web 内容目录的结构和命名规范。\n\nlogrotate 工具旨在简化生成大量日志系统的管理工作。它允许对日志文件进行自动轮转、压缩、删除和发送。每个日志可以每天、每周或在过大时处理。如果你的\
    \ Linux 发行版不包含 logrotate，你可以从以下站点获取它：\n\n```\nftp://ftp.redhat.com/pub/linux/RedHat/redhat/code/logrotate/\n\
    ```\n\n或者许多 RedHat 镜像站之一。\n\n### 4.2 监控网络连接\n\n某些第三方开源 Apache 模块限制了到特定目录的并发连接数，或者对于超过“每秒字节”下载速率的用户限制响应。\n\
    \nApacheWeek 维护了一个限制 Web 域访问的模块列表。更多信息，请访问他们的网页 http://www.apacheweek.com/features/modulesoup\n\
    \n### 4.3 监控系统性能\n\n有很多开源工具可以监控通用系统特别是 Web 服务器。\n\n### 4.3.1 状态显示\n\nmod_status\
    \ 模块传递有关 Apache Web 服务器总体运行的信息，例如，它的运行时间以及当前请求计数、Apache 子进程、总访问量和发送的字节数\n\n默认情况下，Apache\
    \ 配置文件 (httpd.conf) 禁止从所有地方访问状态报告。\n\n"
