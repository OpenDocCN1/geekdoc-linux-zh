    and MaxSpareServers will be needed to increase at least 100 and 20 respectively
    to allow for a quick response to a large number of requests being at the same
    time. An Apache process without PHP scripting requires 1 MB of memory out, if
    PHP is compiled in the process this can grow to 1.5 MB. 100 concurrent Apache
    processes require 150 MB of memory.


    Another consumer of memory can be the MySQL processes. With the Apache web server,
    for performance needs there be one process for each incoming request. For a simple
    database containing 500,000 entries, the RAM requirement for each MySQL process
    is between 0.5 and 0.75 MB.


    Memory requirements will vary depending on traffic, amount of static content dynamically
    created, amount of dynamically created based on database queries. If a website
    expects to have 100 concurrent Apache processes running and one is database that
    will require approximately 175 MB RAM. For optimal performance there should be
    enough memory to allow for a large file buffer cache as the usual overhead of
    other processes running on the system. For a low volume website, Compaq 512 MB
    of RAM is sufficient.


    When the CPU load average stays at or above 15, then it is time to upgrade to
    a second CPU. By default on Linux distributions only a uniprocessor version of
    the kernel will be installed there is only one CPU when it is firstly. After adding
    the second CPU, install the SMP kernel from the Linux distribution media or rebuild
    the kernel with SMP support enabled.


    ## 2.2 Medium Configurations


    The Compaq ProLiant DL380 server is an excellent choice for larger sites that
    require a larger amount of disk space. The ProLiant DL380 supports up to 21 GB
    of storage by fully populating the Smart Array Controller with 36 GB Wide Ultra-2
    drives. As the previous configuration, a ProLiant DL380 with 512 MB and 933 MHz
    processor is suitable for moderately sized websites.


    If your site''s Dig engine is used, adding a second CPU and increasing memory
    to 1 GB will dramatically improve performance.


    The httpdDig engine''s database is approximately the size of the web pages that
    it indexes. In the Linux kernel v2.2, there is a maximum file size of 2 GB, which
    means if you have a total web content more than 2 GB/Dig will fail. At that point
    you need to segment the web content into separate directories for different content
    areas. In Linux development kernels (v2.3), this maximum file limit has been increased
    to 4 GB. In v2.4.0 the available limit will be raised to the terabyte range.


    The MySQL database has a number of tuning parameters that need to be considered
    when the number of Apache processes makes database queries approaches. If one
    exists, the MySQL database server will use it for configuration at startup. The
    MySQL manual recommends the following etc/my.cnf settings for large sites.


    ```

    [mysql]

    set-variable = max_connections=500

    set-variable = connect_timeout=10

    set-variable = key_buffer=384M

    set-variable = max_allowed_packet=1M

    set-variable = table_cache=512

    set-variable = sort_buffer=2M

    set-variable = record_buffer=2M

    ```


    In addition, Compaq recommends the following parameters to be increased as follows.


    ```

    set-variable = max_connections=200

    set-variable = connection_timeout=10

    set-variable = back_log=200

    ```


    Another area where a growing system may run into a problem is if there are large
    MySQL databases. As with httpdDig, MySQL reaches the maximum file size if it has
    very large tables. As your site cannot wait for v2.4.0 with the larger maximum
    file size, you may consider using another SQL database. PostgreSQL (postgresql.org)
    is an open source SQL database that also supports access from PHP and has the
    benefit of automatically splitting tables that would exceed an operating systems''
    maximum file size. MySQL performs better for ''mostly read'' operations found
    in web applications while PostgreSQL performs well for a more mixed read and write
    operations.


    ## 2.3 Large Configurations


    For large web deployments, to scale up to meet the demands of a heavily loaded
    site is to expand from one system to a multi-system Distributed Internet Server
    Array (DISA) architecture. One backend server handles only the SQL database functions.
    Depending on your availability requirements, one of the Linux clustering packages
    should be considered such as Convolo (http://www.missioncritillinux.com) or SteelEye
    (http://www.steeleeye.com/) cluster solutions.


    The Compaq ActiveAnswers site (http://www.compaq.com/activeanswers) contains a
    number of documents that detail the DISA architecture.


    # 3 Installing and Verifying Components


    This guide assumes Linux is already installed on your system. Because most Linux
    distributions include the Apache software, the following procedures you would
    check and, if necessary, uninstall existing Apache software. All software in these
    procedures should be at current as possible.


    ## 3.1 Installing the Components


    Note the order in which you install components is critical, adhere to the following
    sequence:


    1. Install MySQL

    2. Install Apache Server (phase one)

    3. Install PHP3

    4. Reconfigure Apache Server (phase two)

    5. Install httpdDig search engine


    ### 3.1.1 Installing MySQL


    Installing MySQL requires the following steps:


    - * Obtain the sources for the most up-to-date version from the official MySQL
    database at http://www.mysql.com/

    Once, navigate to the "Downloads" page and identify the version number of the
    most recent release (at the time of this writing, Version 3.22.32). With that
    information, you can select a local, mirror site and verify it offers the most
    appropriate version. (Be aware that some mirror sites update their sources more
    often than other sites.) If the local site lacks the correct version, use a different
    mirror site or download the source kit directly from http://www.mysql.com/


    Save the kit (for example, mysql-3.22.32.tar.gz) in a convenient location, such
    as /usr/src/


    ```

    # cd /usr/src/

    # tar xf mysql-3.22.32.tar.gz

    ```


    - * Uninstall any MySQL package on your system. Many Linux installations also
    install the Apache software. This package is particularly common when the Red
    Hat Package Manager (RPM) utility demands code from the Internet (in RedHat, SuSE,
    and TurboLinux installations).


    To check for an existing MySQL installation, enter the following following command:


    ```

    # rpm -qa | grep -i mysql

    ```


    If MySQL software exists, remove it with commands similar to this:


    ```

    # rpm -e mysql-3.22.27

    # rpm -e mysqldev-3.22.27

    ```


    Linux Web Solution with Apache, PHP, MySQL, and httpdDig


    - - Configure, build, and install the MySQL package with the following commands:

    ```

    # cd /usr/src/mysql-3.22.32/

    # ./configure

    # make

    # make install

    ```


    - - Install the database that MySQL uses to manage itself with the following command:

    ```

    # scripts/mysql_install_db

    ```


    - - Start the MySQL server manually with the following command:

    ```

    # /usr/local/bin/safe_mysqld &

    ```

    Also edit your startup script, /etc/rc.d/rc.local, to include the command:

    ```

    # /usr/local/bin/safe_mysqld &

    ```

    Always include the ampersand (&) at the end of the line. Refer to the MySQL manual
    for additional switches to tune MySQL performance for your environment.


    - - Assign an administration password for root access to the database. Note that
    the single quotation marks enclose whatever password you assign. For example,
    enter a command as the following:

    ```

    # /usr/local/bin/mysqladmin -u root password ''newpassword''

    ```


    ### 3.12 Installing Apache Server (Phase One)


    An Apache server installation takes place in two phases. In the first phase, you
    obtain the most recent sources and uninstall any pre-existing Apache server software.
    This phase puts files in place for the upcoming PHP compilation. After installing
