    </Location>

    ```


    See the Apache documentation for more information at:

    http://www.apache.org/docs/mod/mod_info.html


    # 4.3.3 Monitoring Tools


    Monitoring tools include the following:


    +   - big system and network monitor

    - mon, the Service Daemon monitor is a web-based monitoring and notification package.


    The big system and network monitor is a web-based monitoring and notification
    package. With these monitoring tools, a website operator can centrally observe
    remote UNIX-based and Microsoft NT systems.


    The monitor is comprised of several clients: Local test system conditions and
    the availability of network services. These clients send reports to display and
    parser webs which notify system administrators about availability of web servers,
    DNS, NNTP (USENET news), SMTP, and POP3.


    System status reports include information such as CPU usage, system log messages,
    operation of critical system processes, and disk space.


