  mdcn: "\n\n# 基于 Apache、PHP、MySQL 和 http:// 的 Linux Web 解决方案\n\n若要允许访问，请取消 Allow\
    \ 行的注释，并编辑互联网提供商 (isp.com) 的位置，以包含一个可以访问该 URL 的系统或域名列表。\n\n```\n#允许服务器状态报告，URL\
    \ 为 http://servername/server-status\n# 将 \"your.domain.com\" 修改为您的域名以启用。\n#<Location\
    \ /server-status>\n# SetHandler server-status\n# Order deny,allow\n# Deny from\
    \ all\n# Allow from your.domain.com\n</Location>\n```\n\n如需了解更多信息，请参阅 Apache 文档：\n\
    http://www.apache.org/docs/mod/mod_status_status.html\n\n## 4.3.2 配置信息\n\nmod_info\
    \ 模块返回有关服务器配置的全面信息；这包括配置文件中所有安装的模块和指令。\n\n默认情况下，Apache 配置文件 (httpd.conf) 禁止从所有地方对\
    \ URL 进行 Web 访问。取消并更改 Allow 行，以包含一个允许访问该 URL 的系统或域名列表。\n\n```\n# 允许远程服务器配置报告，URL\
    \ 为\n# http://servername/server-info (需要加载 mod_info.c)\n# 将 \"your.domain.com\"\
    \ 修改为您的域名以启用。\n\n#<Location /server-info>\n# SetHandler server-info\n# Order deny,allow\n\
    # Deny from all\n# Allow from your.domain.com\n</Location>\n```\n\n如需了解更多信息，请参阅\
    \ Apache 文档：\nhttp://www.apache.org/docs/mod/mod_info.html\n\n## 4.3.3 监控工具\n\n\
    监控工具包括以下内容：\n\n- 大型系统和网络监控器\n- mon，服务守护进程监控是一个基于 Web 的监控和通知包。\n\n大型系统和网络监控器是一个基于\
    \ Web 的监控和通知包。通过这些监控工具，网站运营人员可以集中观察远程 UNIX 和 Microsoft NT 系统。\n\n监控器由几个客户端组成：本地测试系统状况和网络可用性。这些客户端将报告发送到显示和解析网页，通知系统管理员\
    \ Web 服务器、DNS、NNTP (USENET 新闻)、SMTP 和 POP3 的可用性。\n\n系统状态报告包括 CPU 使用率、系统日志消息、关键系统进程运行以及磁盘空间等信息。\n\
    \n# 基于 Apache、PHP、MySQL 和 http://Dig 的 Linux Web 解决方案\n\n访问网站 http://bb4.com 下载源码、查看演示或获取更多信息。\n\
    \nmon，服务监控守护进程是一个通用的资源监控系统，旨在检查网络服务可用性、服务器问题和环境条件等状况。\n\n资源监控可以视为两个独立的任务：状况的测试以及在失败时触发某种操作。mon\
    \ 的设计是将测试和执行操作的任务作为独立程序。mon 被实现为一个调度器，它执行监控器（测试状况），并在监控器失败时调用相应的警报。访问网站 http://www.kernel.org/software/mon\
    \ 获取更多信息、示例页面并下载源码。\n\n## 4.4 分析日志文件\n\n### Webalizer\n\nWebalizer 是一种用于 Web 服务器的快速免费日志分析程序。它能生成高度详细、易于配置的\
    \ HTML 格式使用报告，可以使用标准 Web 浏览器查看。它可以访问热门 URL 显示的信息、浏览器的源 IP 地址、引用您网站的页面 URL、访问网站的人图表以及所使用的浏览器。\n\
    \n要下载源码并获取更多信息，请访问其网站：\n\nhttp://www.mrunix.net/webalizer\n\n### Analog\n\nAnalog\
    \ 可以生成高度详细且可配置的 HTML 格式使用报告。虽然 Analog 没有 Webalizer 那么图形化，但它是一个可靠的工具。\n\n要下载源码并获取更多信息，请访问其网站：\n\
    \nhttp://www.analog.net/\n\n### Freshmeat.net\n\n这是另一个专门查找 Linux 日志分析工具的良好资源。它位于：\n\
    \nhttp://www.freshmeat.net/appindex/console/log-analyzers.html\n\n## 扩展阅读\n\n\
    有关本指南中讨论的软件包信息，请参阅以下网站：\n\n- Apache Web 服务器的官方网站：http://www.apache.org\n  在此处下载\
    \ Apache 源码包。此处还提供了服务器文档。\n- Apache 支持网站：http://www.apache.com\n  目标是为任何运行 Apache\
    \ 服务器的人或负责运行基于 Apache 服务的人员提供资源。该网站拥有关于用户授权、服务器配置以及使用软件模块扩展 Apache 服务器过程的丰富信息。\n\
    - 流行的 Linux 发行版包括：\n  - Caldera Systems 的 OpenLinux：http://www.caldersystems.com\n\
    \  - Debian：http://www.debian.org/\n  - Red Hat Software, Inc.：http://www.redhat.com\n\
    \    提供美国最流行的 Linux 版本之一。\n  - SuLinux：http://www.suse.com/\n  - TurboLinux：http://www.turbinolux.com/\n\
    - PHP3 脚本语言的官方网站：http://www.php.net\n  提供 PHP3 文章、示例脚本和源文件的支持网站。\n- PHP 库程序源码：http://phplib.net.de/\n\
    \  这些程序简化了许多复杂操作。最有用的是基于 cookie 或 URL 的认证库，它使用 MySQL 数据库来维护用户信息。\n- Zend 软件源码：http://www.zend.com\n\
    \  Zend 极大提升了 PHP 脚本语言的性能。在本文期间，Zend 正处于 Beta 测试阶段。\n- MySQL 官方网站：http://www.mysql.com\n\
    \  提供通用的 MySQL 信息、文档、源文件、镜像站点以及指向相关教程网站的链接。\n- //Dig 搜索引擎站点：http://www.htidig.org\n\
    \  用于小型域名或局域网的索引和搜索搜索引擎。\n\n- 新旧和更新的开源软件包清理中心：http://www.freshmeat.net\n  在编写自己的解决方案之前，请检查\
    \ Freshmeat 站点以获取新的和更新的开源软件包。\n- 开源组织首页：http://www.opensource.org\n\n"
