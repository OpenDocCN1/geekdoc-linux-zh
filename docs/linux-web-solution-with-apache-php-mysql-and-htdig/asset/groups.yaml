    基于 Apache、PHP、MySQL 和 httpdDig 的 Linux Web 解决方案


    需要将 MaxSpareServers 分别增加到至少 100 和 20，以便能够快速响应大量的同时请求。一个不包含 PHP 脚本的 Apache 进程需要
    1 MB 内存，如果 PHP 编译在进程中，该进程的内存占用可能会增长到 1.5 MB。100 个并发 Apache 进程需要 150 MB 内存。


    另一个内存消耗者可能是 MySQL 进程。对于 Apache Web 服务器，由于性能需求，每个传入的请求都需要一个进程。对于一个包含 500,000 条记录的简单数据库，每个
    MySQL 进程的 RAM 需求在 0.5 到 0.75 MB 之间。


    内存需求取决于流量、动态创建的静态内容数量以及基于数据库查询动态创建的内容数量。如果一个网站预计有 100 个并发 Apache 进程运行，并且有一个数据库，则大约需要
    175 MB RAM。为了获得最佳性能，应该有足够的内存来允许大型文件缓冲区缓存，以及系统上运行的其他进程的常规开销。对于低流量网站，Compaq 512
    MB 的 RAM 就足够了。


    当 CPU 平均负载保持在 15 或以上时，就该时候升级到第二个 CPU 了。Linux 发行版默认只安装单处理器版本的内核，在首次安装时只有一个 CPU。添加第二个
    CPU 后，从 Linux 发行版介质安装 SMP 内核，或启用 SMP 支持重新编译内核。


    ## 2.2 中等配置


    Compaq ProLiant DL380 服务器是需要较大磁盘空间的大型极极选择。通过向 Smart Array 控制器插满 36 GB Wide Ultra-2
    驱动器，ProLiant DL380 支持高达 21 GB 的存储。与之前的配置一样，配备 512 MB 内存和 933 MHz 处理器的 ProLiant
    DL380 适用于中等规模的网站。


    如果您的网站使用了 Dig 引擎，增加第二个 CPU 并内存增加 1 GB 将显著提高性能。


    httpdDig 引擎的数据库大约与它索引的网页大小相当。在 Linux 内核 v2.2 中，文件大小限制为 2 GB，这意味着如果您的总 Web 内容超过
    2 GB，Dig 将失败。此时您需要将 Web 内容划分到不同内容区域的独立目录。在 Linux 开发内核 (v2.3) 中，此最大文件限制已增加到 4 GB。在
    v2.4.0 中，可用限制将提升到太级。


    当 Apache 进程数量接近数据库查询时，MySQL 数据库有许多需要考虑的调优参数。如果存在，MySQL 服务器将在启动时使用它进行配置。MySQL 手册建议大型网站使用以下
    etc/my.cnf 设置：


    ```

    [mysql]

    set-variable = max_connections=500

    set-variable = connect_timeout=10

    set-variable = key_buffer=384M

    set-variable = max_allowed_packet=1M

    set-variable = table_cache=512

    set-variable = sort_buffer=2M

    set-variable = record_buffer=2M

    ```


    此外，Compaq 建议按如下方式增加参数：


    ```

    set-variable = max_connections=200

    set-variable = connection_timeout=10

    set-variable = back_log=200

    ```


    不断增长的系统可能会遇到另一个问题，即存在大型 MySQL 数据库。与 httpdDig 类似，如果 MySQL 有非常大的表，就会达到最大文件大小。由于您的网站无法等待具有更大文件限制的
    v2.4.0，您可以考虑使用其他 SQL 数据库。PostgreSQL (postgresql.org) 是一个开源 SQL 数据库，也支持 PHP 访问，并具有自动拆分超出操作系统最大文件大小表格的优点。MySQL
    在 Web 应用中常见的“主要是读”操作方面表现更好，而 PostgreSQL 在处理更混合的读写操作时表现良好。


    ## 2.3 大型配置


    对于大型 Web 部署，为了扩展以满足高负载网站的需求，需要从单系统扩展到多系统的分布式互联网服务器阵列 (DISA) 架构。后端服务器仅处理 SQL 数据库功能。根据您的可用性需求，应该考虑
    Linux 集群包之一，例如 Convolo (http://www.missioncritillinux.com) 或 SteelEye (http://www.steeleeye.com/)
    集群解决方案。


    Compaq ActiveAnswers 网站 (http://www.compaq.com/activeanswers) 包含了详细介绍 DISA 架构的文档。


    # 3 安装并验证组件


    本指南假设 Linux 已安装在您的系统上。由于大多数 Linux 发行版都包含 Apache 软件，您将按照以下步骤检查并在必要时卸载现有的 Apache
    软件。这些程序中的所有软件都应尽可能更新。


    ## 3.1 安装组件


    注意安装组件的顺序至关重要，请遵循以下序列：


    1. 安装 MySQL

    2. 安装 Apache 服务器（第一阶段）

    3. 安装 PHP3

    4. 重配置 Apache 服务器（第二阶段）

    5. 安装 httpdDig 搜索引擎


    ### 3.1.1 安装 MySQL


    安装 MySQL 需要以下步骤：


    - * 从官方 MySQL 数据库 http://www.mysql.com/ 获取最新版本的源码。

    一旦进入，导航到“Downloads”页面并识别最新发布版本号（撰写本文时为版本 3.22.32）。根据该信息，您可以选择一个本地镜像站点并验证它提供了最合适的版本。（注意，某些镜像站点更新源码比其他站点更频繁。）如果本地站点缺少正确版本，请使用其他镜像站点或直接从
    http://www.mysql.com/ 下载源码包。


    将压缩包（例如 mysql-3.22.32.tar.gz）保存在方便的位置，如 /usr/src/。


    ```

    # cd /usr/src/

    # tar xf mysql-3.22.32.tar.gz

    ```


    - * 卸载系统上的任何 MySQL 软件包。许多 Linux 安装还会安装 Apache 软件。当 Red Hat 包管理器 (RPM) 实用程序从互联网请求代码时（RedHat、SuSE
    和 TurboLinux 安装中），这种情况尤为常见。


    要检查是否存在 MySQL 安装，请输入以下命令：


    ```

    # rpm -qa | grep -i mysql

    ```


    如果存在 MySQL 软件，使用类似下面的命令将其删除：


    ```

    # rpm -e mysql-3.22.27

    # rpm -e mysqldev-3.22.27

    ```


    基于 Apache、PHP、MySQL 和 httpdDig 的 Linux Web 解决方案


    - - 使用以下命令配置、构建并安装 MySQL 包：

    ```

    # cd /usr/src/mysql-3.22.32/

    # ./configure

    # make

    # make install

    ```


    - - 使用以下命令安装 MySQL 用于管理自身的数据库：

    ```

    # scripts/mysql_install_db

    ```


    - - 使用以下命令手动启动 MySQL 服务器：

    ```

    # /usr/local/bin/safe_mysqld &

    ```

    同时编辑您的启动脚本 /etc/rc.d/rc.local，包含命令：

    ```

    # /usr/local/bin/safe_mysqld &

    ```

    始终在行尾包含符号符号 (&)。参考 MySQL 手册为您的环境调优 MySQL。


    - - 为数据库分配 root 访问密码。注意单引号包裹您分配的任何密码。例如，输入命令：

    ```

    # /usr/local/bin/mysqladmin -u root password ''newpassword''

    ```


    ### 3.2 安装 Apache 服务器（第一阶段）


    Apache 服务器安装分两个阶段进行。在第一阶段，您获取最新源码并卸载现有的 Apache 服务器软件。此阶段为后续的 PHP 编译准备文件。安装 PHP
    后，完成 Apache 安装的第二阶段，重新配置 Apache 服务器使用 PHP3 库。


    - - 从 Apache 官方网站 http://www.apache.org 或较近的镜像站点获取服务器源码。与 MySQL 软件一样，首先检查最新的 Apache
    版本，然后参考镜像站点列表。将压缩包（例如 apache_1.3.14.tar.gz）保存在方便的位置（如 /usr/src），并使用以下命令解压压缩包：

    ```

    # cd /usr/src

    # tar xzvf apache_1.3.14.tar.gz

    ```


    - - 配置 Apache 服务器。对于第一阶段，必须运行 Apache 配置脚本。要此此，输入以下命令：

    ```

    # cd /usr/src/apache_1.3.14/

    # ./configure --prefix=/usr/local/apache

    ```

