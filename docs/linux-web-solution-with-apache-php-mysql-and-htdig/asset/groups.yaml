    Linux Web Solution with Apache, PHP, MySQL, and http://


    +   * Uninstall any existing Apache server. (You probably have the Apache server
    if you are running one of the Linux distributions.) If you have made configuration
    changes, you may want to save the Apache file under a new name. Eliminate the
    existing version as follows:


    ```

    # rpm -qa | grep apache

    apache-1.3.3-1

    apache-devel-1.3.3-1

    ```


    +   * In situations where other packages are installed, you will receive a warning
    about dependencies on other packages. They will have to be removed first. The
    RPM manager says "man rpm" for information using this tool. For example:


    ```

    # rpm -e mod_perl-1.15-3 mod_php-2.0.1-5 mod_php3-3.0.5-2

    # rpm -e apache-1.3.3-1 apache-devel-1.3.3-1

    ```


    In the next step, you build PHP, and you will complete Phase Two of the Apache
    installation.


    # 3.1.3 Installing PHP3


    Navigate to the official website for PHP at http://www.php.net/. This site provides
    the PHP source kit, manuals, code examples, and pointers to other open source
    packages that use PHP3. Go to the "Downloads" and download the latest PHP3 source
    kit from the nearest mirror site. Save the kit (for example, php-3.0.17.tar.gz)
    in a convenient location as /usr/src/ and unpack the kit using the commands:


    +   * Obtain the sources, use the same Apache src directory as in the previous
    commands for the Apache switch.


    ```

    # cd /usr/src/

    # tar xzf php-3.0.17.tar.gz

    ```


    > Note: In the next step, use the same Apache src directory as in the previous
    commands for the Apache switch.


    +   * Compile PHP3. PHP3 needs to be configured before it can be built as an Apache
    module and use MySQL.


    There are a number of compile options that you may want to enable. Popular options
    include IMAP support, GD for image creation on the fly, Lightweight Access Protocol
    (LDAP) support, WebDAV (HTTP Distributed Authoring and Versioning (DAV)) support,
    and zlib (the compressed library). These options require installation of additional
    packages and are beyond the scope of this document To compile PHP3, enter the
    following commands:


    ```

    # cd /usr/src/php-3.0.17/

    # ./configure --with-mysql --with-apache=../apache_1.3.14 \

    --enable-track-vars

    ```


    +   * Install PHP3 with the following commands:


    ```

    # make

    # make install

    ```


