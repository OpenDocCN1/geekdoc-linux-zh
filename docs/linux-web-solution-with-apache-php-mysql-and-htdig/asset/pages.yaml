  md: 'Linux Web Solution with Apache, PHP, MySQL, and ht://Dig


    +   - Configure, build, and install the MySQL package with the following commands:

    # cd /usr/src/mysql-3.22.32/

    # ./configure

    # make

    # make install


    +   - Install the database that MySQL uses to manage itself with the following
    command:

    # scripts/mysql_install_db


    +   - Start the MySQL server manually with the following command:

    # /usr/local/bin/safe_mysqld &

    Also edit your startup script, /etc/rc.d/rc.local, to include the command:

    # /usr/local/bin/safe_mysqld &

    Always include the ampersand (&) at the end of the line. Refer to the MySQL manual
    for additional switches to tune MySQL performance for your environment.


    +   - Assign an administration password for root access to the database. Note
    that the single quotation marks enclose whatever password you assign. For example,
    enter a command as the following:

    # /usr/local/bin/mysqladmin -u root password ''newpassword''


    # 3.12 Installing Apache Server (Phase One)


    An Apache server installation takes place in two phases. In the first phase, you
    obtain the most recent sources and uninstall any pre-existing Apache server software.
    This phase puts files in place for the upcoming PHP compilation. After installing
    PHP, you complete the second phase of the Apache installation, which reconfigures
    the Apache server to use PHP3 libraries.


    +   - Obtain the server sources from either the official Apache website at http://www.apache.org
    or a closer, mirror site. With the MySQL software, first check the most recent
    Apache version and then refer to a list of mirror sites. Save the kit (for example
    apache_1.3.14.tar.gz) in a convenient location such as /usr/src and unpack the
    kit using these commands:

    # cd /usr/src

    # tar xzvf apache_1.3.14.tar.gz


    +   - Configure the Apache server. For this first phase, Apache must have the
    configuration script run. To do this, enter the following commands:

    # cd apache_1.3.14/

    # ./configure --prefix=/usr/local/apache


    13T3-1100A-WWEN'
