  md: '# 1.4 ht://Dig Search Engine


    The search engine package, ht://Dig, is a complete web indexing and searching
    system; it is one of the few open source software packages available for this
    purpose.


    UnlikeAltaVista, which can scale to Internet-wide searches, ht://Dig systems are
    designed for smaller configurations, such as small domains, single sites, or website
    subsections. If necessary, ht://Dig can index a number of web servers. With proper
    filters installed, ht://Dig can index and search through Adobe Acrobat (.pdf)
    files and Microsoft Word (.doc) files.


    The source kit, manuals, and an archive of user mailing lists are located on the
    product''s official website at http://www.htdig.org/.


    Getting Support and Mail on ht://Dig


    The ht://Dig site maintains a set of mailing lists. As mailing list members learn
    about the product, they can share their finding with others on the list. The two
    most useful mailing lists are as follows:


    +   * For discussion of ht://Dig and related announcements: htdig@htdig.org

    * For receiving notices of new releases: htdig3announce@htdig.org


    To subscribe to either, use the form on http://www.htdig.org/mailarchive.html.'
