  md: "# 1 Solution Overview\n\nThis document describes how to install, configure,\
    \ and deploy the sophisticated Apache website on the Linux operating system. A\
    \ website includes the powerful, server-side scripting language, PHP3, access\
    \ to the full-featured SQL database, MySQL and the htDig search engine. All of\
    \ the software packages described in this document are open source applications.\n\
    \nWhat makes open source so attractive? First of all, it is free. Secondly, you\
    \ get copies of the software source code, which frees you to control the software\
    \ to meet your short-term and long-term requirements.\n\nThe key points of open\
    \ source software restrictions are that no one:\n\n+   - Distributes the product\
    \ without the source code (or a list of differences between the modified version\
    \ and the original) and a copy of all related documentation\n\n+   - Charges for\
    \ the software itself (only for its distribution)\n\n+   - Impose restriction\
    \ on its distribution\n\nFor information on licensing, refer to the regulations\
    \ defined by the Open Source Initiative organization: http://www.opensource.org/osd.html.\n\
    \n# 1 Apache Web Server\n\nApache is widely used than all web servers combined.\
    \ A survey by Netcraft in September 2000 substantiates this claim. After polling\
    \ over 21 million sites for web server software usage on Internet-connected computers,\
    \ they found over 61% of all Internet websites run on apache. (For updates, see\
    \ http://www.netcraft.com/survey/).\n\nClearly, the Apache Software Foundation\
    \ is meeting its goal \"to provide a secure, efficient, and extensible server\
    \ that keeps its HTTP services in step with HTTP standards.\"\n\n Apache Web Server\
    \ Project homepage contains versions of the Apache server and corresponding documentation\
    \ that you can download. The official website for the Apache server is http://www.apache.org/.\n\
    \nGetting Support on Apache\n\nIn addition to online documentation and a list\
    \ of frequently asked questions, the Apache site maintains a number of mailing\
    \ lists. Receive mail from other Apache developers about code releases, bugs,\
    \ security fixes, and other information, join one, as announce@apache.org. Locating\
    \ the mailing list at http://www.apache.org/announcementlist.html.\n\n# 1.2 PHP\
    \ Scripting Language\n\nThe PHP (originally Personal Home Page) scripting language\
    \ supports the creation of dynamic, customized websites. With PHP, developers\
    \ embed scripts within web pages. The web server calls PHP to perform the script\
    \ operations, and then the server returns the page to the user. Functionally,\
    \ PHP and the Microsoft Active Server Page (ASP) scripting language are quite\
    \ similar."
  merge: -1
