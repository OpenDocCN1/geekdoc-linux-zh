  md: '# Linux Web Solution with Apache, PHP, MySQL and http://


    To allow access, remove the comment from the Allow line and edit the location
    of Internet Service Providers (isp.com) to include a list of systems or domains
    that have access to the URL.


    ```

    # Allow server status reports, with the URL of http://servername/server-status

    # Change the "your.domain.com" to match your domain to enable.

    #<Location /server-status>

    # SetHandler server-status

    # Order deny,allow

    # Deny from all

    # Allow from your.domain.com

    </Location>

    ```


    See the Apache documentation for more information at:

    http://www.apache.org/docs/mod/mod_status_status.html


    # 4.3.2 Configuration Information


    The module mod_info returns comprehensive information about the server configuration;
    this includes all installed modules and directives in the configuration files.


    By default the Apache configuration file (httpd.conf) has web access to URL denied
    from everywhere. Uncomment and change the Allow line to include a list of systems
    or domains that are allowed to access the URL.


    ```

    # Allow remote server configuration reports, with the URL of

    # http://servername/server-info (requires mod_info.c to be loaded)

    # Change the "your.domain.com" to match your domain to enable.


    #<Location /server-info>

    # SetHandler server-info

    # Order deny,allow

    # Deny from all

    # Allow from your.domain.com

    </Location>

    ```


    See the Apache documentation for more information at:

    http://www.apache.org/docs/mod/mod_info.html


    # 4.3.3 Monitoring Tools


    Monitoring tools include the following:


    +   - big system and network monitor

    - mon, the Service Daemon monitor is a web-based monitoring and notification package.


    The big system and network monitor is a web-based monitoring and notification
    package. With these monitoring tools, a website operator can centrally observe
    remote UNIX-based and Microsoft NT systems.


    The monitor is comprised of several clients: Local test system conditions and
    the availability of network services. These clients send reports to display and
    parser webs which notify system administrators about availability of web servers,
    DNS, NNTP (USENET news), SMTP, and POP3.


    System status reports include information such as CPU usage, system log messages,
    operation of critical system processes, and disk space.


    13T3-1100A-WWEN'
