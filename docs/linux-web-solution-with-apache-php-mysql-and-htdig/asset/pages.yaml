  md: "# Linux Web Solution with Apache, PHP, MySQL, and ht://Dig\n\nCompile ht://Dig.\
    \ By default, the search engine places files the /opt/www/htdig directory.\nBuilding\
    \ the kit is straightforward: configure, compile, and install it with the following\
    \ commands. Note the switches that set the default locations of the Apache directories.\n\
    \n```\n# ./configure --with-cgi-dir=/usr/local/apache/cgi-bin \\\n    --with-image-dir=/usr/local/apache/icons\
    \ \\\n    --with-search-dir=/usr/local/apache/httdocs\n```\n\n```\n# make\n# make\
    \ install\n```\n\nReconfigure Apache server so it can find that ht://Dig uses.\
    \ To do so, modify the file /usr/local/apache/conf/httpd.conf. Locate the section\
    \ for aliases and insert this line at the end:\nAlias /htdig/ \"/usr/local/apache/icons/\"\
    ,\n\nSince you have modified the Apache configuration file, you will need to restart\
    \ the process to enable this change. The following command will restart the Apache\
    \ server:\n# /usr/local/apache/bin/apachectl restart\n\n# 3.1.5. Changing the\
    \ Location of Some Files\n\nSince the htdig search database can grow large, it\
    \ is a great idea to move the database to a partition with enough free space.\n\
    Note: Linux kernel v2.x running on an Intel platform has a maximum size of 2 GB.\
    \ Linux running on an AlphaServer™ platform has a maximum size of 8 GB.\n\nThe\
    \ storage requirements for the search database vary. To adequately allocate sufficient\
    \ storage for approximately twice the size of the expected content to be searched.\
    \ The htdig index file grows slightly larger than the amount of content that is\
    \ indexed. This search product does not scale to large amounts of information.\n\
    \nTo move the database, change the htdig.conf file (typically located in the /www/opt/htdig/config/)\
    \ by modifying the following line:\n\n```\ndatabase_dir: /opt/www/htdig/db\n```\n\
    \n# 3.1.5.2 Changing the Starting Point for the Search Engine to Find Content\n\
    \nThis is a list of URLs or file locations separated by spaces. By default, only\
    \ links on the system are followed. For example, the line changes the ht://dig\
    \ starting point to be the name of this web server.\n\n```\nStart_url: http://www.isp.com/\n\
    ```\n\n# 3.1.5.3 Changing Search Method from HTTP Connections to Entry through\
    \ the File System\n\nWith this method ht://dig traverses the content directly,\
    \ a method which greatly reduces the time needed to index a website and the amount\
    \ of clutter in web logs.\n\nNote: A search method change as this works only if\
    \ the web server and the search engine are on the same system or if they can access\
    \ the same disks by NFS."
