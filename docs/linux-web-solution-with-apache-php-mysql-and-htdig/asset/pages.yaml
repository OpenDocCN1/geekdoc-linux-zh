  md: "# 3.1.4 Reconfiguring Apache Server (Phase Two)\n\nAt this point, the MySQL\
    \ database is running, the Apache server is partially prepared, and the PHP libraries\
    \ are installed. You reconfigure the Apache server to use PHP.\n\n+   * Return\
    \ to the apache_1.3.14 directory, as follows:\n* cd /usr/src/apache_1.3.14/\n\
    * Build the Apache server with the PHP module as well as two modules mod-status\
    \ and mod-info that you can configure web masters with configuration information\
    \ and server status.\n* #/.configure --activate-module=src/modules/php/libphp3.a\
    \ \\\n  --enable-module-info --enable-module=status\n* # make\n* # install\n*\
    \ Edit the configuration files.\n\nThe default configuration for PHP is reasonable,\
    \ but you can modify some resource limits. By default the maximum execution time\
    \ for any PHP page (execution_time) is 30 seconds.\nMove the configuration for\
    \ PHP into a system directory as follows:\n\n+   * cp /usr/src/php3-3.0.17/php3.ini-dist\
    \ /usr/local/lib/php3.ini\n* Edit the Apache configuration file, /usr/local/apache/conf/httpd.conf,\
    \ so it processes files with the php3 extension. Remove the # character from the\
    \ following lines:\n#AddType application/x-httpd-php3 .php3\n#AddType application/x-httpd-php3-source\
    \ .php\n\n+   * Start the Apache Web Server with the following command:\n* /usr/local/apache/bin/apachectl\
