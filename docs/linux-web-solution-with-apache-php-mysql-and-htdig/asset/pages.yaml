    # 3.1.6 Building Search Engine Database


    After installing and optimizing ht/Dig to index the database, you run a script
    to build the database. ht/Dig includes a script in /opt/www/htdocs/bin/rundig.sh.
    To work out any configuration problems, run the script from the command line.
    Once the script is working properly, run it periodically as a cron job.


    See "man cron" and "man 5 crontab" for information on how to set up batch jobs.


    # 3.2 Verifying the Installation


    Once the software components have been installed, you need to verify that all
    the components are working properly. The following sections describe how to verify
    the following:


    +   - Apache invokes the PHP3 scripting engine to process files and PHP3 has MySQL
    support built in.

    - A MySQL test database can be set up.

    - PHP scripting engine can connect to the MySQL database.

    - ht/Dig search engine has indexed the site and is working.


    # 3.2.1 Verifying Automatic Boot


    Since the system startup scripts have been modified to start the Apache web server
    and MySQL database a restart should be done before deploying the system. At this
    point of the procedure, all the servers are running so you can do the following
    verification steps and check the startup procedure:


    # 3.2.2 Verifying PHP3 Operation


    Create a file named phpinfo.php3 and add the following line to the file.


    ```

    <?php phpinfo() ?>

    ```


    Put the file in the Apache DocRoot, which by default, is called /usr/local/apache/htdocs.

    Start a web browser and go to http://127.0.0.1/phpinfo.php3. If PHP3 is working
    properly, the web browser will display a screen similar to the one displayed in
    Figure 1. Be sure to verify that MySQL is listed under the extensions.


