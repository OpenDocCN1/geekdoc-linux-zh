    \ TABLE users (login VARCHAR(20), optpw VARCHAR(20), \\\nuid INT, gid INT, name\
    \ VARCHAR(40), homedir VARCHAR(40), \\\nshell VARCHAR(40));\nQuery OK, 0 rows\
