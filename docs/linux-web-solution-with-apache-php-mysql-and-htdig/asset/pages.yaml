  md: '# Linux Web Solution with Apache, PHP, MySQL, and http://Dig


    See the website http://bb4.com to download the sources, to see a demonstration,
    or for more information.


    mon, the Service Monitoring Daemon is a general-purpose, resource monitoring system
    designed to check such conditions as network service availability, server problems,
    and environmental conditions.


    Resource monitoring can be viewed as two separate tasks: the testing of a condition,
    and triggering some sort of action upon failure. mon was designed to keep the
    testing and action-taking tasks, as stand-alone programs. mon is implemented as
    a scheduler which executes the monitors (which test a condition), and calls the
    appropriate alerts if the monitor fails. See the website http://www.kernel.org/software/mon
    for more information, a sample page, and to download the source.


    # ## 4.4 Analyzing Log Files


    # ### Webalizer


    Webalizer is a fast and free, log analysis program for a web server. It produces
    highly detailed, easily configurable usage reports, in HTML format, for viewing
    with a standard web browser. It can access information displayed by top URLs,
    source IP addresses of browsers, URLs of pages that refer to your website, a chart
    of from which people are viewing the website, and browsers used.


    To download the sources and gain more information, see their website at:


    http://www.mrunix.net/webalizer


    # ### Analog


    Analog can generate highly detailed and configurable usage reports in HTML format.
    While Analog is not as graphical as Webalizer, it is a solid tool.


    To download the sources and gain more information, see their website at:


    http://www.analog.net/


    # ### Freshmeat.net


    This is another good resource for locating log analysis tools specifically for
    Linux. It is located at:


    http://www.freshmeat.net/appindex/console/log-analyzers.html'
