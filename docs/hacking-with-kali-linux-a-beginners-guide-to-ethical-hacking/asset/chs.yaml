- "# Kali Linux 攻防：Kali 与网络安全道德黑客初学者指南，包含 Linux 命令行、渗透测试、计算机安全系统及工具\n\n\n\n\n## 黑客定义\n\
  这是一个识别给定网络或计算机系统中存在的缺陷的过程，这些缺陷可以被用来利用其弱点以获取访问。一个极好的黑客示例是使用密码破解算法来确保进入系统。在当今时代，运行成功的业务时计算机是不可缺的。此外，计算机需要网络化以便于与其他外部企业进行通信交换。这意味着孤立的计算机系统本身是不够的。通过将它们联网，意味着我们将它们暴露在外部世界，从而使被攻击变得可能。黑客行为本质上意味着使用计算机实施恶意行为，例如，窃取个人或公司数据、侵犯隐私、欺诈等。网络犯罪每年给全球各组织带来数百万美元。因此，企业保护自己免受此类攻击是明智的。世界上大多数的黑客行为都是出于犯罪意图的。其范围可以从某种形式的欺诈到破坏目标组织的声誉。黑客行为是一种犯罪，在大多数司法管辖区受法律惩处。尽管如此，有一种黑客行为被认为是有益的。这由专业人士、政府执法机构和其他认证机构进行。他们的主要目的是对抗恶意黑客的恶意意图。通过这种方式，可以保护系统免受伤害。\n\
  \n## 常见的黑客攻击\n以下是针对计算机和网络最常见的黑客攻击类型。\n\n\n\n\n\n## 1. 拒绝服务 (DoS) 攻击\n\n当网站服务器被超过其处理能力的流量泛滥时，它就会发生过载。想象一下，一条专为小镇流量设计的道路，当外部流量涌入时会迅速陷入拥堵。用户将经历巨大的延迟，并会带来极大的不便。这就是拒绝服务攻击影响网站的方式。网站上的额外流量将导致无法为尝试访问网站的访客提供服务。一个实际的例子是报纸网站发布突发新闻。许多人会尝试访问它以获取更多信息，结果导致网站过载。然而，在\
  \ `DoS` 攻击中，过载的流量通常是恶意的。其意图是让合法用户无法访问网站。分布式拒绝服务攻击 (`DDoS`)是由许多台计算机同时进行的攻击。应对这种攻击具有挑战性，因为\
  \ `IP` 地址看起来似乎同时源自世界各地的许多不同位置。这意味着网络管理员很难确定攻击的源头。\n\n## 2. 跨站脚本 (XSS)\n\n攻击者在 `SQL`\
  \ 注入攻击中可以针对有漏洞的网站。存储的数据可能成为目标，例如敏感的财务数据、用户凭据等。对于攻击者来说，直接针对网站的用户不如跨站脚本攻击更有吸引性。就像\
  \ `SQL` 注入攻击一样，跨站脚本攻击涉及向网站注入恶意代码。唯一的区别是网站本身并没有受到攻击。发生的情况是恶意攻击者在访问受感染的网站时，对用户的浏览器进行注入。实现此点的常用方法是将恶意代码注入注释或可以自动运行的脚本中。例如，在\
  \ `JavaScript` 中，可以将链接嵌入博客的注释中。这种攻击从本质上可以通过危及用户信息来损害网站的声誉，而并不一定会做任何恶意操作。在某些情况下，在网站所有意识到出现问题之前，用户在网站上传输的敏感信息可能会通过跨站脚本被劫持。\n\
  \n## 3. SQL 注入攻击\n\n`SQL` 是我们用来与数据库通信的编程语言。大多数为网站和业务存储关键数据的服务器通常利用 `SQL` 来管理存储在数据库中的数据。这种攻击正是针对这类服务器的。它利用恶意代码促使服务器披露其通常不会提供的信息。如果服务器被用于存储客户的隐私详情（例如用户名、信用卡号等），问题可能会被放大。这些信息可以被用于识别身份。攻击通过利用任何已知的允许在\
  \ `SQL` 服务器上运行恶意代码的 `SQL` 漏洞来实现其目标。例如，针对有漏洞的 `SQL` 服务器的注入攻击可能会促使攻击者在网站的搜索框中输入代码，这将导致网站的\
  \ `SQL` 服务器转储存储在网站站的用户名和密码。\n\n## 4. 钓鱼\n\n大量的钓鱼诈骗以短信和电子邮件营销活动的形式出现，旨在引发好奇心、强迫紧迫感，甚至在潜在受害者心中植恐惧。随后，受害者会被诱导点击指向恶意网站的链接，或下载并打开包含恶意软件的未知附件，从而泄露被认为敏感的信息。例如，特定在线服务的用户可能会收到一封电子邮件，提醒他们违反了某项政策，需要立即采取行动。此类操作的一个例子是更改密码。点击链接后，用户将被重定向到一个在各方面与合法网站几乎完全相同的非法网站，促使毫无防备的用户向该网站输入凭据。一旦提交表单，这些信息就会发送给攻击者。\n\
  \n## 5. 恶意软件\n\n攻击者通常喜欢在用户的计算机上部署恶意软件，以便在其中获得立足点。这是获取访问权限的最有效的方法之一。首先，让我们定义什么是恶意软件。它可以代表各种有害的软件配置，例如：勒索软件和病毒。存在于计算机中的恶意软件能够制造各种混乱。这包括但不限于：监控并记录你在计算机上执行的操作和击键、接管你机器的控制权，甚至直接从你的计算机将你的机密数据发送给攻击者的基地。攻击者有许多方法可以将恶意软件传输到你的计算机中。然而，要使其起作用，需要用户根据自己的意愿采取行动安装恶意软件，例如打开看起来无害的附件或点击链接下载特定文件，而所有这些内部都包含着隐藏的恶意软件。\n\
  \n## 6. 会话劫持与中间人攻击\n\n当你访问互联网时，你使用的计算机通常会与全球的服务器进行多次往返交易，以告知它们你的身份以及你请求的特定网站或服务。如果一切顺利，你将从\
  \ Web 服务器获得你请求的所有信息。无论你是在使用凭据（即用户名和密码）登录特定网站，还是仅仅浏览，这都是常态。远程 Web 服务器与你的计算机之间的会话会被赋予唯一的会话\
  \ `ID`。该 `ID` 需要保持私密。当攻击者出现时，他们可以使用获取的会话 `ID` 来劫持会话。这是通过捕获 `session ID` 并伪装成发出请求的计算机实现的。攻击者可以像毫无备的用户一样登录，从而获得访问\
  \ Web 服务器上关键信息的权限。攻击者有几种方法可以用来窃取会话 `ID`。其中之一就是我们之前讨论过的跨站脚本攻击。另一种，攻击者可能决定通过将自己置于远程服务器和请求计算机之间来进行会话劫持。在这里，他们将伪装成会话涉及的另一方。这样，他们就能拦截从两个方向传输的信息。这就是我们所指的中间人攻击。\n\
  \n## 7. 密码攻击\n\n\n\n\n任何信息系统最常用的用户身份验证方法都是使用密码。这意味着窃取密码是一种可以在攻击中使用的有效方法。要做到这一点，只需观察目标的桌子周围，然后对连接进行嗅探操作。这将使你能够获取未加密的密码。在这里，人们可以使用社会工程策略来获取包含密码的数据库访问权限，或者通过直接猜测来获取密码。这可以通过随机或系统化的方式进行。\n\
  \n我们有以下几种类型的密码攻击：暴力破解攻击和基于字典的攻击。在第一种攻击中，会随机尝试不同的密码，希望其中某个组合能够成功。攻击者可以对该过程应用一些逻辑，例如尝试与用户姓名、爱好、职位等相关的密码。另一方面，基于字典的攻击利用字典中找到常用密码来尝试访问目标网络或计算机。一种常用的技术是复制包含密码的加密文件，然后对密码字典应用相似的加密方式，最后对密码进行比较。为了防止字典攻击或暴力破解攻击，所需要的就是实施账户锁定策略。这意味着在特定账户超过了超过指定的登录尝试次数后，该账户将被锁定。\n\
  \n## 8. 窃听攻击\n\n这种攻击通过截获网络流量来实现。通过使用窃听，恶意用户将获取信用卡号、密码以及用户在网络上交换的其他被视为机密的信息。我们可以进行被动窃听攻击或主动窃听攻击。让我们简要看看它们是什么。\n\
  \n### 被动窃听\n在这一窃听模式下，恶意用户将试图通过监听在网络上传输的消息来获取信息。\n\n### 主动窃听\n传输的信息通过攻击者伪装成友好单元被主动捕获。这是通过查询数据传输器来实现的。我们将其称为扫描、篡改或简单的探测。\n\
  \n需要注意的是，检测被动窃听攻击是至关重要的。因为它是主动攻击的前奏。数据加密是防止窃听的最佳防御措施。\n\n## 黑客分为哪些类型？\n\n让我们区分一下我们可能遇到的不同类型的黑客。你会发现，每一类黑客都拥有不同的目标。我们还将查看每个黑客拥有的各种角色和目标。\n\
  \n### a) 黑帽黑客\n通常被称为黑帽，他们通常对绕过安全协议和入侵计算机网络的各种方法拥有广泛的知识。恶意软件通常由黑帽编写，以帮助访问这些系统。黑帽的主要目标通常是获取个人或财务利益。其中一些人会进行网络间谍活动，而另一些人则是为了好玩。这类黑客的范围从缺乏经验的业爱好者（他们的乐趣仅仅是传播恶意软件）到目标是侵吞特权数据的经验人士。很多时候，他们寻找的是财务信息。他们还对收集登录凭据和个人信息感兴趣。除了偷取数据外，如果获得的数据不符合他们的目的，他们通常会修改甚至破坏这些数据。\n\
  \n### b) 灰帽黑客\n这些人可以说既不是坏人也不是好人！灰帽既不是白不是黑。这类黑客兼具黑帽和白帽的特征。大多数时候，灰帽会尝试在所有者许可或知情的情况下挖掘系统中存在的漏洞。如果他们发现了问题，会向所有者报告。大多数情况下，他们会要求一些资金补偿以便他们修复问题。在所有者不配合的“不幸”情况下，他们会将他们的利用程序发布到互联网上供大家看到。灰帽的意图并不一定是恶意的；他们只是想通过自己的发现赚点钱。在发现漏洞后，灰帽通常不会利用他们挖掘出的漏洞。这种灰帽黑行为之所以违法，是因为黑客在针对目标特定系统的所有者处没有事先获得任何许可。对于想要成为黑客的读者来说，必须注意并非所有黑客都是平等的。我们有白帽黑客，他们总是试图在黑帽发现之前发现并修复漏洞。这样，我们现在的网络犯罪大大减少了。\n\
  \n### c) 白帽黑客\n与之前的两种黑客不同，白帽黑客是那些将技能用有用处的人。他们的意图是善良的。这些人是好人。这类黑客通常被称为伦理黑客。他们可能是组织的员工，或在信息安全公司担任承包商。他们通常尝试通过黑手段发现系统中的漏洞。黑客过程中使用的方法与黑帽使用的方法相似，但有一个区别。白帽首先征得所有者的同意。这使得黑客行为合法。白帽黑客通常执行渗透测试；他们评估漏洞并对公司的安全系统进行现场测试。我们甚至还有举办伦理黑的认证、培训、课程和会议。\n\
  \n## 什么是伦理黑？！\n\n我们将伦理黑定义为一种批准的实施方式，通过绕过系统安全来识别网络中的威胁和潜在的数据泄露。在这种情况下，拥有特定网络或系统的组织授权网络安全专家执行此类活动，以测试系统所建立的防御措施。因此，这意味着与恶意黑客不同，伦理黑是一个经过计划和批准的法律过程。伦理黑客的主要目标是审查特定网络或系统的弱点。恶意黑客正是利用这些弱点进行剥削或破坏的。\n\
  \n在进行期间，他们还会收集并对信息进行分析。这将有助于他们进行组织 IT 基础设施的规划。通过这样做，安全足迹将得到显著改善，使其能够抵御或转移攻击。由于信息安全行业的增长，近期对伦理黑的需求急剧增加。伦理黑也被称为白帽黑客。伦理黑是尝试渗透和利用系统以发现其弱点的实践，以便对其进行更好的保护。我们可以将其分为大类。这些：渗透测试；这主要是为了合规的信息安全公司；以及由情报机构或国家军队进行的黑客。这两个领域对黑客的需求都在增加。\n\
  \n*   渗透测试\n\n\n\n\n这是一种组织用于确定其安全基础设施稳健性的机制。在这里，安全专业人员将扮演攻击者的角色，试图在恶意分子之前发现系统中的缺陷和脆弱性。其中一个核心目标是向公司和组织识别并报告这些漏洞。\n\
  \n随着组织对安全的意识日益增强，以及安全违规引发的成本呈指数级增长，许多大型组织已开始外包安全服务。这些关键安全服务之一就是渗透测试。渗透测试本质上是一种合法的、受委托的黑客行为，旨在证明公司网络和系统的脆弱性。\n\
  \n通常，组织会先进行漏洞评估，以发现其网络、操作系统和服务的中的潜在弱点。我在这里强调了“潜在”一词，因为这种漏洞扫描包含了大量的假阳性（即被识别为漏洞但实际上并非漏洞的项目）。渗透测试人员的角色是尝试攻入或“渗透”这些漏洞。只有这样，组织才能知道弱点是否真实存在，并决定是否投入时间和金钱来修复漏洞。\n\
  \n## 间谍活动与军事\n\n网络间谍活动可以说是在未经目标实体知情且许可的情况下，访问其信息和秘密的行为。目标对象可以是普通个人、对手、竞争对手、团体、政府甚至是敌人。其目标非常广泛，可以是政治的、经济的、个人的甚至是与军事相关的。\n\
  \n所使用的技术也是多样化的。黑客可以使用恶意软件、破解技术、代理服务器等来实现其既定目标。\n\n间谍活动可以通过专业人员坐在他们的电脑桌前在线进行，也可以通过派遣经过训练的内鬼和传统间谍进行渗透完成。在某些情况下，它也可以由具有恶意意图的业余黑客和软件程序员来实施。众所周知，地球上的每个国家都在进行某种形式的网络间谍活动甚至是网络战争，尽管是隐蔽的。通过黑客获取其他国家军事活动的情报变得更具成本效益。因此，黑客在任何国家的防御系统中都有大有用场。\n\
  \n## 第 2 章：网络攻击\n\n### 网络攻击的定义\n网络攻击可以说是对计算机系统以及依赖网络和技术的企业进行的蓄意利用。网络攻击利用恶意代码，目的是修改计算机数据、代码或逻辑。所有这些行为的最终结果都是破坏性的，通常会导致关键数据的泄露。\n\
  \n此外，网络攻击还是发动或实施网络犯罪的平台。例如，信息和身份盗窃。网络攻击的另一个名称是计算机网络攻击。网络攻击可能产生以下影响：\n\n*   未经授权的访问和知识产权盗窃\n\
  *   网页浏览器利用\n*   系统渗透\n*   突破访问控制\n*   硬件被盗\n*   欺诈、身份盗窃、勒索\n*   DoS 和 DDoS 攻击\n\
  *   密码嗅探\n*   网站篡改\n\n### 为什么网络攻击至关重要\n我们最近看到网络攻击的后果将是毁灭性的。由于网络攻击，企业的运营成本正在增加。处理数据泄露的代价也非常昂。Ponemon\
  \ 研究院在 2018 年进行的一项研究发现，数据泄露的平均成本为 386 万美元。\n\n然而，这不仅仅关乎财务方面。它们还可能：\n\n*   破坏相关品牌的声誉\n\
  *   侵蚀客户对品牌的忠诚度，在某些情况下甚至使其毁灭\n*   网络攻击会导致知识产权的损失\n*   在严重情况下，公司可能会倒闭\n*   它们还会导致来自各种监管机构的处罚\n\
  *   国家和政府的安全可能受到严重损害\n*   未来很可能再次发生攻击\n\n\n\n\n\n## 恶意软件攻击\n\n恶意软件是一种未经您许可便安装在系统中的不受欢迎软件。此类软件已知会附着在合法软件或代码上，为其自我传播提供平台。恶意软件可以存在于我们日常使用的应用程序中，甚至可以在互联网上自我复制。让我们讨论一下目前常见的恶意软件类型：\n\
  \n1) **宏病毒（Macro viruses）** — 它们已知会感染常用程序，例如 `Microsoft Excel`、`Microsoft Word`\
  \ 等。这类感染会将自身绑定到应用程序的初始化序列中。当打开应用程序时，宏病毒会在控制权交给应用程序之前影响指令。与许多其他病毒一样，它们能够通过附着到计算机系统中运行的其他代码或程序来实现复制。\n\
  \n2) **文件感染病毒（File infectors）** — 这些病毒通常绑定到可执行代码上。一旦代码被加载，病毒就会安装。另一种类型的文件感染病毒经常会通过创建一个名称相似但带有\
  \ `.exe` 扩展名的病毒文件，将其与计算机上的某个文件关联。打开该文件时，病毒代码就会执行。\n\n3) **系统记录/引导扇区感染病毒（System record/boot-record\
  \ infectors）** — 它们的工作方式与文件感染病毒类似，只是它们附着在位于硬盘上的主引导记录（MBR）上。一旦系统启动，它们会将病毒加载到系统内存中。从那里，感染病毒将传播到其他计算机或其他磁盘。\n\
  \n4) **多态病毒（Polymorphic viruses）** — 它们通常通过使用变化的加密和解密循环来隐藏自己。病毒与其相关的变异引擎一起加密，并在开始使用解密程序进行解密。解密后，它将继续感染一小部分代码。变异引擎将用于构建一个新的解密程序，病毒对其进行加密。正是这个加密的变异引擎和病毒包会附接到新的代码上。这个过程是重复的。检测此类病毒非常具有挑战性。由于源代码经过多次更改，它们具有高水平的熵。像\
  \ `Process Hacker` 或大多数反病毒软件可以使用此项功能对它们进行检测和隔离。\n\n5) **隐形病毒（Stealth viruses）**\
  \ — 这些病毒捕获系统中的功能以便隐藏自己。这是通过隐形病毒干预检测恶意软件的软件实现的。结果是，软件会错误地将受感染区域识别为未受感染。隐形病毒会隐藏受感染文件的任何大小变化，有时甚至会修改受感染文件的最后修改时间和日期。\n\
  \n6) **木马病毒（Trojans）** — 以特洛伊木马闻名，这些程序将自己隐藏在一个常用但不同的程序中。在大多数情况下，特洛伊木马带有恶意功能。与病毒不同，木马不会自我复制。除了对目标系统发动攻击外，木马还可以创建攻击者可能用于利用系统的后门。例如，一个特洛伊木马可以被编程为打开一个高位端口，黑客可以通过该端口监听甚至在未来实施攻击。\n\
  \n7) **逻辑炸弹（Logic bombs）** — 这种恶意软件通常绑定到应用程序中。要使其工作，必须有一个特定事件触发它。这可能是一个预定的逻辑条件、设定的时间、指定的日期等。\n\
  \n8) **蠕虫（Worms）** — 这是一种自包含的程序，可以在计算机和网络之间传播。这意味着它们不会附着在宿主文件病毒上。它们经常通过电子邮件发送的附件传播。下载并打开附件的用户会在不经意的情况下激活蠕虫。蠕虫的一种利用方式是蠕虫复制到感染计算机邮箱地址中的所有联系人。它们还可以在互联网上传播，导致电子邮件服务器过载。这种场景会导致网络上存在的各个节点遭受拒绝服务。\n\
  \n9) **释放器（Droppers）** — 这些可以被用于在受害者计算机上安装病毒的程序。很多时候，释放器本身通常不包含恶意代码。这意味着它们不会被负责病毒扫描的软件检测到。然而，释放器可以连接到互联网，下载到受破坏系统中现有病毒软件的更新。\n\
  \n10) **勒索软件（Ransomware）** — 这种恶意软件通过阻止访问目标数据来工作。有时，勒索软件会威胁删除数据或发布数据，除非向勒索软件所有者支付费用。有的对于知识丰富的人士来说易于破解，也有更先进的。它们使用加密勒索技术。该技术对受害的文件进行加密。这使得除非受害者获得解密密钥，否则无法恢复它们。\n\
  \n11) **广告软件（Adware）** — 公司将这种软件应用程序用于营销目的。每当任何程序运行时，您都会看到广告横幅。当您浏览网站时，广告软件会自动下载到您的系统中，这些内容可以通过弹出窗口或计算机屏幕上自动弹出的栏进行查看。\n\
  \n12) **间谍软件（Spyware）** — 间谍软件是一种主要安装在系统中用于收集有关计算机、用户甚至其浏览习惯信息的程序。间谍软件可以在您不知情的情况下跟踪您所做的一切，无论是离线还是在线。收集的数据随后会被传输到远程用户。与释放器一样，间谍软件可以连接到互联网，下载其他恶意程序并将其安装在受害计算机系统中。该程序的工作方式与广告软件相同，不同之处它通常作为一个独立的程序出现。当您安装免费软件应用程序时，它会被安装，在大多数情况下，这是在您不知情的情况下发生的。\n\
  \n## MAC 伪造（MAC Spoofing）\n\n![](img/rsrc80.jpg)\n\n我们可以将其定义为对设备 MAC 地址的未经授权的修改。简单来说，它是给定计算机网络内网络设备\
  \ MAC 地址的伪造。通过这种方式，恶意用户可以使用假身份（即 MAC 地址）伪装成您自己的设备之一，随后拦截网络中交换的通信。设备 MAC 地址的伪造可以通过以下方式实现：\n\
  \n*   简单的 MAC 地址更改\n*   以随机方式创建 MAC 地址\n*   使用不同制造商的 MAC 地址\n*   在保持当前制造商完整的同时配置新的\
  \ MAC 地址，然后自动激活它。\n\n### 执行 MAC 伪造的原因\n\nMAC 伪造可以出于合法也可以非合法的原因进行。后者可能是接管另一台计算机的身份，而前者可以用于创建到网络的无线连接。MAC\
  \ 伪造的合法使用的另一个示例是由于共享单个 MAC 地址，将单台计算机的功能从路由器更改为计算机，再回到路由器。\n\n*   MAC 伪造的非合法用途\n\n\
  \n\n\n另一个非法用法的例子是，入侵者修改其 MAC 地址，以便能够像授权用户一样访问目标网络。攻击者可以利用这一新获得的身份对网络或系统造成具破坏性的破坏。例如，他们可以对计算机系统发起拒绝服务攻击，或者在某些情况下，绕过访问控制机制，为更高级的侵入铺平道路。此外，攻击者还可以决定更改其\
  \ MAC 地址以规避网络入侵检测系统。这使得他们对既定的安全措施是“隐形”的，从而使他们有充足的时间采取行动而不被发现。\n\n### MAC 伪造的合法用途\n\
  \nMAC 伪造的一个合法用途是将单台计算机的功能从路由器更改为计算机。反之亦然，即将计算机的功能改回路由器。假设我们有一个公有 IP 地址，我们只能在一台路由器或一台计算机上使用它。现在，如果我们有两个广域网\
  \ IP 地址，这意味着这两个设备（两台计算机）的 MAC 地址必须是不同的。由于某些原因，可能需要定期更换计算机以将它们连接到电缆调制解调器。更改设备的 MAC\
  \ 地址而不是更改网络接口卡，这样操作会更快、更方便。为此，许多电缆调制解调器路由器都内置了专门为此目的设计的“克隆 MAC 地址”功能。伪造的 MAC 地址允许攻击者绕过已设置的安全机制。例如，攻击者将能够冒充真实设备，甚至隐藏在网络上其他设备之后。总之，值得注意的是，更改\
  \ MAC 地址的操作是一种可以确保网络正常运行的合法技术，而不仅仅是作为一种欺骗性技术。\n\n### 防御 MAC 伪造\n\n需要网络监控、分析和安全措施来对抗\
  \ MAC 伪造。为了排除坏人员，管理对公司网络的访问无疑是一个好主意。访客对组织的网络连接（例如 Wi-Fi）应具有受限访问权限。主要原因是，大部分 MAC\
  \ 伪造攻击源于内部网络，或者是在内部网络实施的。公司确保场所内没有留下未授权的人员且访客从不单独离开也是主动的。这种措施有助于防止未授权人员通过电缆直接连接以太网来操控或连接到内部网络。建议公司在网络系统通信加密的同时采用\
  \ IPsec 技术，这将有助于消除对现有 MAC 地址的窃听。在一些较大的公司，使用先进的主动网络硬件可以确保通过防火墙配置或交换机配置获得改进的保护。这些技术拦截了外部进入的数据包，因为这些包可能是攻击向量。\n\
  \n### ARP 伪造\n\n这是一种被认为恶意的实体在局域网内传输伪造 ARP 消息的攻击。其结果是网络内合法服务器或计算机的 MAC 地址和 IP 地址将被关联。这意味着攻击者将能够接收任何旨在发送真实\
  \ IP 地址的信息和数据。此外，攻击者还可以修改、拦截，有时停止正在传输的数据。然而，这种攻击仅在使用了我们称为“地址解析协议”的局域网上才可能。\n\n####\
  \ ARP 伪造攻击的示例\n\nARP 伪造攻击会对目标企业产生严重后果。此类伪造攻击的主要目标是窃取信息。这些信息通常是敏感的。它们不仅局限于此，还能引发其他攻击，例如：\n\
  \n*   DoS 攻击：此类攻击利用 ARP 伪造将许多 IP 地址连接到属于目标的单个 MAC 地址。因此，最初发送给大量 IP 地址的流量将被重定向到目标的\
  \ MAC 地址，导致其过载。\n*   会话劫持：这种攻击主要利用 ARP 伪造来获取会话 ID。这些 ID 随后可以用于访问私有数据甚至系统。\n*   中间人攻击：与会话劫持一样，MITM\
  \ 攻击通常会拦截并更改毫无防备受害者之间的流量。\n\n#### 检测、预防和防御 ARP 伪造\n\n可以通过以下一种或多种方法检测并遏制 ARP 伪造攻击：\n\
  \n*   使用 ARP 伪造检测软件：此类程序在传输前对数据进行检查和认证。看似是伪造的数据通常会被拦截。\n*   包过滤：这是一种防止 ARP 伪造的实用技术。具有冲突源地址信息的数据包将被过滤并拦截。\n\
  *   加密网络协议：如 HTTP Secure (HTTPS)、Secure Shell (SSH)、传输层安全 (TLS) 等协议有助于防止 ARP 伪造攻击。它们通过在传输前对数据进行加密并在接收时对相同数据进行认证来实现这一点。\n\
  *   将信任关系降至最低：公司和机构需要制定不依赖信任关系的安全协议。在此类关系中，认证机制仅依赖 IP 地址。这使得 ARP 伪造攻击更容易发生。\n\n\
  ### Rogue DHCP 服务器\n\n#### DHCP 的定义\n\n我们将其定义为网络的一种协议，允许特定服务器从网络定义的数字范围内自动为特定计算机分配\
  \ IP 地址。\n\n#### 那么，什么是 Rogue DHCP 服务器？\n\n\n\n\n我们将非法 DHCP 服务器（rogue DHCP server）定义为由攻击者或毫无察觉的用户在网络上搭建的\
  \ DHCP 服务器。该非法 DHCP 服务器不受网络管理员的控制。意外的非法设备的一个示例是用户在不知情的情况下连接到网络的具有 DHCP 功能的调制解调器。在大多数情况下，该用户通常并不知道这样做的后果。此外，这些服务器被攻击者广泛用于网络攻击，例如：嗅探、侦察和中间人攻击。在连接到网络后，两个\
  \ DHCP 服务器（合法的非法的）将为设备提供执行通信所需的所有内容。这些可能包括默认网关、DNS 服务器、WINS 服务器和 IP 地址等。偶尔，使用错误\
  \ IP 地址或网关的客户端注定会遇到网络访问问题。此外，当非法 DHCP 服务器作为受恶意或行为不当的用户控制的机器的默认网关时，它能够嗅探传输到其他网络的流量，从而违反用户隐私和现有的网络安全策略。虚拟机软件也可以充当非法\
  \ DHCP 服务器，尽管这可能是无意的。这种情况发生在软件运行在连接到网络的客户端机器上时。此时，它将向网络上的所有相邻客户端分发随机 IP 地址。后果是导致大部分区域与域内的其余部分一起断开连接。\n\
  \n## 防止非法 DHCP 服务器\n![](img/rsrc9M.jpg)\n\n具有相关签名的入侵检测系统可以用于阻止非法 DHCP 服务器。多层交换机也可以配置为丢弃数据包。DHCP\
  \ 监听（DHCP snooping）可能是处理这些服务器最常见的方法。它通过丢弃源自不可信 DHCP 服务器的 DHCP 信息来实现工作。\n\n### TLS/SSL\
  \ 加密\n加密用于保护 HTTP 网络连接。它保护连接免受拦截以及通过 Web 传播的中间人攻击。TLS/SSL 加密增加了服务器与客户端之间通信拦截过程的难度。\n\
  \n### Wi-Fi 加密\n开放的 Wi-Fi 网络更容易受到窃听攻击的侵害。因此，Wi-Fi 加密是防止黑客于外的最佳方式。这意味着他们将无法访问任何通过网络的信息。尽管如此，Wi-Fi\
  \ 加密也有其局限性，你不应该完全信赖它。\n\n## DDoS 攻击\n这是一种恶意尝试，旨在完全破坏目标服务器、网络或服务的正常流量。在大多数情况下，这是通过来自互联网的洪暴流量淹没目标及其周围设施来实现的。DDoS\
  \ 攻击的有效在于它利用多个受感染的计算机系统作为攻击的流量源。\n\n### 攻击原理\n这种攻击要求攻击者获得对在线机器的网络控制权，以便成功实施攻击。恶意软件被用于感染设备和计算机，从而将其变成机器人。也就是说，它们变成了僵尸状态。一组机器人被称为僵尸网络（botnet）。攻击者能够远程控制这些僵尸网络。僵尸网络将远程接收攻击者他们的更新指令。一旦攻击者确定了目标及其\
  \ IP 地址，僵尸网络就会对其发送请求。这将导致目标过载，造成正常合法流量的拒绝服务。由于每个机器人都是合法的互联网设备，要将正常流量与攻击流量分离来变得非常有挑战性。\n\
  \n## 第 3 章：用于黑客的 Linux\n![](img/rsrcAB.jpg)\n\n### 简介介绍\n当你开始成为黑客的之旅时，你会发现大多数专业和专家黑客在职业生涯中都会\
  \ Linux/Unix。尽管如此，我们也有某些黑客攻击可以使用 Mac OS 和 Windows。如 `Zenmap`、`Metasploit`、`Havij`、`Cain`\
  \ 和 `Abel` 等软件都有 Windows 版本。通常，当应用程序在 Linux 中开发稍后移植到 Windows 时，它们总是会丢失某些功能。也就是说；我们拥有在\
  \ Linux 中存在但在 Windows 中不存在的功能。这就是许多黑客工具设计并构建用于 Linux 的原因。因此，对于任何想要成为专业黑客的人来说，学习或掌握像\
  \ `Kali` 等 Linux 发行版知识是必要的。\n\n### 为什么黑客使用 Linux\n以下是黑客偏好 Linux 的一些主要原因。\n\n1. **Linux\
  \ 是开源的**\n   与 Windows 操作系统不同，Linux 发行版是开源的。Linux 用户可以访问系统的源代码。这意味着人们可以随意操纵和更改 Linux\
  \ 操作系统以适应自己的需求。假设用户希望特定系统以原始设计之外的方式运行，那么操纵和更改源代码的能力至关重要。\n\n2. **Linux 是透明的**\n\
  \   要有效进行黑客攻击，需要深入理解用户的操作系统。此外，对想要攻击的操作系统拥有知识也是必要的。与 Windows 不同，我们可以看到甚至操纵 Linux\
  \ 的所有工作部分。也就是说，Linux 是完全透明的。理解 Windows 操作系统的内部原理并不容易。透明性意味着使用 Linux 更有效。\n\n3. **Linux\
  \ 提供了细粒度控制**\n   Linux 用户对系统拥有无限的控制权，即它是细粒度的。与 Windows 操作系统相比，这一点非常显著，因为用户只能控制微软允许他们控制的内容。Linux\
  \ 中的一切，无论是在微观层面还是宏观层面，都由 `terminal` 控制。此外，对于 Linux 中的任何脚本语言，脚本编写都是既简单又有效的。\n\n4.\
  \ **大多数黑客工具都是为 Linux 编写的**\n   用于黑客攻击的大多数工具专门为 Linux 编写的。像 `Nmap` 或 `Metasploit`\
  \ 等工具可以在 Windows 平台上可用，但并非所有功能都能移植到 Windows。与在 Linux 平台上相比，它们提供的功能有限。\n\n5. **未来属于\
  \ Linux/Unix**\n\n\n\n\n多年来，你可能已经注意到 Windows 正在变慢，在某些部门甚至陷入了停滞。自从互联网出现以来，`Linux/Unix`\
  \ 一直并且一直是 Web 服务器的首选操作系统，这主要是因为它的可靠性、健壮性和稳定性。截至目前，近三分之二的 Web 服务器使用 Linux 操作系统。`Linux`\
  \ 内核的使用示例包括 Citrix 应用、VMware、交换机和路由器中的嵌入式系统、移动设备等。人们说，计算的未来属于移动设备，包括但不限于手机和平电脑。用于大多数手机的\
  \ `Android` 是 `Linux`，而 `iOS` 使用的是 `Unix` 内核。因此，很难想象未来会不是 `Linux/Unix`。微软 Windows\
  \ 的市场份额仅为 7% 左右。市场的其余部分要么是 `Linux` 要是 `Unix`。总而言之，未来属于 `Linux/Unix`。\n\n## 什么是 Kali\
  \ Linux？\n\nKali Linux 是 `Debian` 家族的一个发行版。它专门为安全审计和渗透测试设计和开发。该发行版包含数百个专注于信息安全任务的工具和实用程序，这些任务可能包括逆向工程、渗透测试、计算机取证和安全研究。Offensive\
  \ Security 是 Kali Linux 背后的信息安全组织。它开发、资助并维护 Kali Linux。\n\n该发行版最初于 2013 年 3 月发布，是对\
  \ `BackTrack Linux` 从底部的完全重构。它百分之百地遵循 `Debian` 开发标准。Kali Linux 拥有超过 600 种可用于渗透测试的工具。在对\
  \ `BackTrack Linux` 进行彻底审查后，删除了一些无法工作或重复的工具。通过 Kali Tools 网站，让我们来查看一些细节：\n\n- **Kali\
  \ Linux 永远免费**：就像 `BackTrack` 一样，`kali` 是免费的，而且以后将一直是免费的。这意味着你现在或未来在任何时候都不需要为它付费。\n\
  - **它是开源的**：Kali Linux 使用的源代码对任何想要改进、修改或重新构建包以适应其特定需求的人都开放。\n- **Kali 符合 FHS 标准**：该发行版遵循文件系统层级标准（FHS）。这些标准帮助\
  \ `Linux` 用户无缝地定位支持文件、二进制文件、库等。\n- **支持广泛的无线设备**：系统设计支持多个平台的无线接口。它可以在各种硬件上运行。\n\
  - **内核经过定制并针对注入进行了补丁处理**：Kali Linux 内核中包含了最新的注入补丁。\n- **它在安全环境中创建**：负责开发 Kali 的团队是一小群受信任的，他们被信任提交包并与仓库交互。在这些过程中使用了安全协议。\n\
  - **GPG 签名的仓库和包**：Kali Linux 中的所有包通常由个人开发者签名。这些开发者对相应的包负责。这些包随后也会由仓库进行签名。\n- **支持多种语言**：大多数渗透工具和实用程序通常用英语编写。尽管如此，Kali\
  \ 仍提供了真正的多语言支持。因此，用户能够以他们的母语言进行操作。这不很棒吗！\n- **Kali 易于自定义**：所有用户都可以根据自己的需求和偏好修改 Kali。\n\
  - **Kali Linux 同时支持 ARMHF 和 ARMEL**：Kali Linux `ARM` 支持针对 `ARMEL` 和 `ARMHF` 系统的完整安装。Kali\
  \ Linux 适用于各种 ARM 设备，并与 ARM 仓库集成到主发行版中，因此 ARM 的工具会与发行版的其他部分同步更新。\n\n## 下载 Kali Linux\n\
  \n在我带你走上黑客之路之前，你首先需要在你的计算机上下载并安装 Kali Linux。这是我们在整本书中将使用的 `Linux` 发行版。可以通过 `https://www.kali.org/`\
  \ 完成。导航到首页并点击页面顶部的 Downloads 链接。选择正确的下载版本非常。\n\n## 安装 Kali 和设置 Kali Linux 的步骤\n\n\
  为了开始，你需要使用你优的安装介质启动。你将看到如下所示的 Kali 启动屏幕。选择 `Text-Mode` 或 `Graphical install`。在例子中，我们选择了\
  \ `GUI` 安装。\n\n![](img/rsrcBP.jpg)\n\n选择你的语言偏好以及国家位置。此外，系统还会提示你选择偏好的键盘布局。(rsrcBW.jpg)\n\
  \n选择你的位置，即地理位置。(rsrcC1.jpg)\n\n安装程序将镜像复制到你的硬盘上，探测你的网络接口，然后提示你为系统输入主机名。在下面的示例中，我们将\
  \ `kali` 作为主机名。(rsrcC6.jpg)\n\n你可以可选地为此系统提供一个默认域名。(rsrcCB.jpg)\n\n接下来，为系统的非 root\
  \ 用户提供全名。(rsrcCG.jpg)\n\n将根据你提供的全名创建一个默认用户 ID。如果你喜欢，可以更改它。(rsrcCN.jpg)\n\n之后，选择一个适当的时区。(rsrcCU.jpg)\n\
  \n接下来，你将看到类似下图的内容。进行适当选择。(rsrcCZ.jpg)\n\n选择你想要分区的磁盘。(rsrcD4.jpg)\n\n继续下一步，根据你的需求选择选项。(rsrcD9.jpg)\n\
  \n接下来，点击 Continue 按钮。(rsrcDE.jpg)\n\n下一步需要你执行网络镜像配置。(rsrcDJ.jpg)\n\n接下来，安装 GRUB。(rsrcDR.jpg)\n\
  \n最后，点击 Continue 进入你的 Kali 安装。(rsrcDX.jpg)\n\n## 第 4 章：Kali 基础\n\n### 引言\n\n我们之前说过\
  \ Kali Linux 是一个为道德黑客、渗透测试员、安全研究人员和爱好者设计的 `Debian` 发行版。它是 Offensive Security 开发的稳定、企业级且维护良好的发行版。Kali\
  \ Linux 默认桌面环境是 `GNOME`，但它提供了多种其他桌面环境，包括 `KDE`、`MATE`、`LXDE` 等。它可以安装在各种系统上，包括笔记本电脑、服务器、ARM\
  \ 设备和云端。它还有一个针对安卓设备的便携版本称为 `NetHunter`，可以在安卓操作系统中使用并预装了工具和脚本。\n\n### 为什么你应该使用 Kali\
  \ Linux\n\n正如之前提到的，Kali Linux 预装了几乎所有用于上述目的的工具。这就是安全审计员、取证调查员、渗透测试员和研究人员青它的它的。\n\
  \nKali 可用于破解 WiFi 网络、攻击网站和网络、对实体进行开源情报收集等。除了道德黑客，Kali Linux 还拥有用于取证调查的工具。这正成为安全领域一个同样重要的分支，主要收集证据、分析证据并利用结果追溯网络犯罪分子。取证调查使得定位和消除来自恶意活动的影响成为可能。它在计算和管理攻击损失方面也很有用。Kali\
  \ 的一个关键特性是隐身 Live 模式，主要用于取证，因为它不会在主机系统中留下痕迹（指纹和足迹）。\n\n## 终端\n\n![](img/rsrcEC.jpg)\n\
  \n使用 Kali 的第一步是打开终端，这是我们在本书中使用的命令行界面。在 Kali Linux 中，你可以在桌面底部找到终端图标。双击此图标打开终端，或按下\
  \ `CTRL+ALT+T`。终端打开命令行环境，被称为 `shell`，它允许你在底层操作系统上运行命令并编写脚本。虽然 `Linux` 有许多不同的 shell\
  \ 环境，但最流行的是 `bash` shell，它也是 Kali 以及许多其他 Linux 发行版的默认 shell。要更改密码，可以使用 `passwd`\
  \ 命令。\n\n## Linux 基础命令\n\n\n\n\n\n### 使用 `pwd` 查找自己\n\n与 Windows 或 macOS 不同，Linux\
  \ 命令行并不总是能直观地显示你当前处于哪个目录。要导航到新目录，你通常需要知道自己当前所在的位置。当前工作目录命令 `pwd` 会返回你在目录结构中的位置。在终端中输入\
  \ `pwd` 来查看你所在的位置：\n\n```bash\nkali >pwd\n/root\n```\n\n在这种情况下，Linux 返回了 `/root`，告诉我正处于\
  \ root 用户的目录下。由于你在启动 Linux 时是以 `root` 身份登录的，你也应该处于 root 用户的目录下，这位于文件系统结构顶部（`/`）的下方。如果你在另一个目录中，`pwd`\
  \ 将返回该目录名称。\n\n### 使用 `whoami` 检查登录身份\n\n在 Linux 中，那个“无所不能”的超级用户或系统管理员被称为 `root`，它拥有添加用户、更改密码、更改权限等所需的所有系统权限。当然，你不希望任何人都有进行此类更改的能力；你希望是一个可以信任并且对操作系统有足够知识的人。作为一名黑客，你通常需要所有这些权限来运行所需的程序和命令，因此你可能想以\
  \ `root` 身份登录。Linux 用户可以使用下方的 `whoami` 命令查看他们以什么用户身份登录：\n\n```bash\nkali >whoami\n\
  root\n```\n\n在这里，用户以 `root` 身份登录。\n\n### 导航 Linux 文件系统\n\n从终端导航文件系统是一项基本的 Linux\
  \ 技能。为了完成任何工作，你都需要能够移动以寻找位于其他目录中的应用程序、文件和目录。在基于 GUI 的系统中，你可以视觉化看到目录，但当你使用命令行界面时，结构完全是文本的，导航文件系统意味着使用某些命令。\n\
  \n### 使用 `cd` 切换目录\n\n从终端更改目录，请使用切换目录命令 `cd`。例如，这里切换到用于存储配置文件的 `/etc`目录的方法：\n\n\
  ```bash\nkali >cd /etc\nroot@kali:/etc#\n```\n\n提示符变为 `root@kali:/etc`，表示我们位于 `/etc`\
  \ 目录。我们可以通过输入 `pwd` 来确认这一点：\n\n```bash\nroot@kali:/etc# pwd\n/etc\n```\n\n若要在文件结构中向上移动一级（朝文件结构的根目录或\
  \ `/`），我们使用 `cd` 后跟两个双点（`..`），如下：\n\n```bash\nroot@kali:/etc# cd ..\nroot@kali:/#\
  \ pwd\n/root\nroot@kali:/#\n```\n\n这让我们从 `/etc` 移动到 `/root` 目录，但你可以根据需要向上移动任意级。只需使用双点对的数量等于你想移动的层数即可：\n\
  \n*   使用 `..` 向上移动一级。\n*   使用 `.. ..` 向上移动二级。\n*   使用 `.. .. ..` 向上移动三级，依此类推。\n\n\
  所以，例如，向上移动二级，输入 `cd` 后跟两组带空格的双点：\n\n```bash\nkali >cd .. ..\n```\n\n你也可以通过输入 `cd\
  \ /` 从文件结构中的任何地方移动到根目录，其中 `/` 代表文件系统的根。\n\n### 使用 `ls` 列出目录内容\n\n要查看目录的内容（文件和子目录），我们可以使用\
  \ `ls`（list）命令。这与 Windows 中的 `dir` 命令非常相似。\n\n```bash\nkali >ls\nbin  initrd.img\
  \   media   run   varboot   initrd.img.old   mnt   sbin   vmlinuzdev   lib     \
  \    opt srv   vmlinuz.oldetc  lib64      proc    tmphome   lost+found   root  \
  \ usr\n```\n\n此命令列出了目录中包含的文件和目录。你也可以在命令后列出目录名称对任何特定目录使用此命令，而不仅仅当前目录；例如，`ls /etc`\
  \ 显示 `/etc` 目录中的内容。要获取更多关于文件和目录的信息（例如它们的权限、所有者、大小和最后修改时间），你可以在 `ls` 之后添加 `-l` 选项（`l`\
  \ 代表 long）。这通常被称为长列出。参见下方的示例：\n\n### 获取帮助\n\n在 Linux 中，几乎每个命令、应用程序或工具都有一个专用帮助文件来指导其使用。例如，如果我需要关于使用最好的无线破解工具\
  \ `aircrack-ng` 的帮助，我可以输入 `aircrack-ng` 命令后跟 `--help` 命令：\n\n```bash\nkali >aircrack-ng\
  \ --help\n```\n\n注意这里的双横线。Linux 的习惯是在单词选项（如 `help`）之前使用双横线（`--`），在单字母选项（如 `-h`）之前使用单横线（`-`）。当你输入此命令时，你应该看到该工具的简短描述以及如何使用的指南。在某些情况下，你可以使用\
  \ `-h` 或 `-?` 来获取帮助文件。例如，如果我需要关于使用黑客最好的端口扫描工具 `Nmap` 的帮助，我会输入：\n\n```bash\nkali\
  \ >nmap -h\n```\n\n遗憾的是，尽管许多应用程序支持这三个选项，但无法保证你正在使用的应用程序也会。因此，如果一个选项不起作用，请尝试另一个。\n\
  \n### 查找文件\n\n在熟悉 Linux 之前，寻找路标可能会令人沮丧，但掌握一些基本命令和技巧将使命令行变得友好得多。以下命令帮助你从终端定位物品。\n\
  \n### 使用 `locate` 搜索\n\n可能是最易使用的命令是 `locate`。后面紧跟一个表示你想查找的内容的关键词；此命令将遍历整个文件系统并定位该词的所有出现处。例如，查找\
  \ `aircrack-ng`，输入以下内容：\n\n```bash\nkali >locate aircrack-ng\n/usr/bin/aircrackng/usr/share/applications/kaliaircrackng.desktop/usr/share/desktopdirectories/05-1-01aircrack-ng.directory--snip--/var/lib/dpkg/info/aircrack-ng.mg5sums\n\
  ```\n\n显示 `locate` 命令输出的截图如下；\n\n然而，`locate` 命令并不是完美的。有时 `locate` 的结果可能会让你崩溃，提供过多的信息。此外，`locate`\
  \ 使用的数据库每天更新一次，所以如果你在几分钟或几小时前创建了一个文件，它在第二天之前可能出现在列表中。了解这些基本命令的缺点有助于你更好地判断何时使用哪一个。\n\
  \n### 使用 `whereis` 查找二进制文件\n\n如果你正在查找一个二进制文件，可以使用 `whereis` 命令来定位它。该命令不仅返回二进制文件的位置，还会返回源码和手册页（如果可用）。示例：\n\
  \n```bash\nkali >whereis aircrack-ng\naircrack-ng:/usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz\n\
  ```\n\n显示 `whereis` 命令输出的截图如下；\n\n### 在 PATH 变量中查找二进制文件\n\n`which` 命令更具体：它只返回 Linux\
  \ 中 `PATH` 变量里的二进制文件位置。例如，当我在命令行输入 `aircrack-ng` 时，操作系统会查看 `PATH` 变量以确定应该在哪些目录中查找\
  \ `aircrackng`：\n\n```bash\nkali >which aircrack-ng\n/usr/bin/aircrackng\n```\n\n\
  \n\n\n在使用命令行时，你经常可能想要搜索特定的关键词。为此，你可以使用 `grep` 命令作为过滤器来搜索关键词。当输出从一个命令管道传输到另一个命令时，经常会使用\
  \ `grep` 命令。显示 `grep` 命令输出结果的截图所示：![](img/rsrcHV.jpg)\n\n在上面的示例中，该命令将显示所有正在运行的服务，然后将该输出管道到\
  \ `grep`。`grep` 的作用是在接收到的输出中搜索我们要求查找的关键词。在我们的案例中，关键词是 `apache2`。`Grep` 将继续并仅输出相关的的结果。该命令节省了时间。\n\
  \n## 修改文件和目录\n在找到你查找的目录和文件后，你可能需要对它们执行若干操作。我们将学习如何创建目录和文件、复制文件、重命名文件，以及删除文件和目录。\n\
  \n### 创建文件\n在 Linux 中创建文件有很多方法，但目前我们将查看两种简单的方法。第一种是 `cat`，它是 `concatenate` 的缩写，意为合并片段（这并不是指你喜爱的宠物猫咪）。`cat`\
  \ 命令通常用于显示文件内容，但也可以用于创建小文件。对于创建较大的文件，最好在 `vim`、`emacs`、`Leafpad`、`gedit` 或 `kate`\
  \ 等文本编辑器输入代码，然后将其保存为文件。\n\n### 使用 cat 合并\n`cat` 命令后文件名将显示该文件的内容，但要创建一个文件，我们在 `cat`\
  \ 命令后跟一个重定向符号（用 `>` 符号表示）以及我们想要创建的文件名。这是一个示例：\n```\nkali >cat > kalilinuxHacking\
  \ with Kali Linux!\n```\n\n### 使用 touch 创建文件\n创建文件的第二个命令是 `touch`。该命令最初开发是为了让用户“触碰”文件来更改其某些细节，例如创建或修改日期。然而，如果文件尚不存在，该命令默认会创建该文件。让我们使用\
  \ `touch` 命令创建 `newfile`：\n```\nkali >touch newfile\n```\n现在，当我使用 `ls -l` 查看目录的详细列表时，我看到创建了一个名为\
  \ `newfile` 的新文件。注意，它的大小为 0，因为 `newfile` 中没有内容。\n\n### 创建目录\nLinux 中创建目录的命令是 `mkdir`，是\
  \ `make directory` 的缩写。要创建一个名为 `newdirectory` 的目录，请输入以下命令：![](img/rsrcJH.jpg)\n\
  要进入这个新创建的目录，请输入：![](img/rsrcJP.jpg)\n\n## 复制文件\n要复制文件，我们使用 `cp` 命令。这会在新位置创建一个文件的副本，并将旧文件保留在原处。在这里，我们将使用\
  \ `touch` 在根目录下创建文件 `oldfile`，将其复制到 `/root/newdirectory`，在此过程中对其重命名，并将原始 `oldfile`\
  \ 保留在原处：![](img/rsrcJW.jpg)\n\n重命名文件是可选的，只需通过在目录路径末尾添加你想给它的名称来实现。如果你在复制文件时不重命名，该文件将默认保留原始名称。当我们随后导航到\
  \ `newdirectory` 时，我们看到有一个名为 `newfile` 的 `oldfile` 完整副本：\n```\nkali >cd newdirectory\n\
  kali >ls\nnewfile oldfile\n```\n\n## 重命名文件\n\n\n\n\n遗憾的是，Linux 并没有像 Windows 和其他某些操作系统那样的专门用于重命名文件的命令，但它确实有一个\
  \ `mv`（move）命令。`mv` 命令可以将文件或目录移动到新位置，也可以给现有文件起新名字。要将 `newfile` 重命名为 `newfile2`，你需要输入以下内容：\n\
  \n```\nkali >mv newfile newfile2\nkali >lsoldfile newfile2\n```\n下面是相同操作的截图。![](img/rsrcKA.jpg)\
  \ 现在当你列出（`ls`）该目录，你会看到 `newfile2` 而不是 `newfile`，因为它已经被重命名了。你也可以对目录执行相同的操作。\n\n###\
  \ 删除文件\n要删除文件，你可以使用 `rm` 命令，如下所示：\n\n```\nkali >rm newfile2\n```\n如果你现在对该目录进行长列表显示，就可以确认该文件已被删除。\n\
  \n### 删除目录\n删除目录的命令与删除文件的 `rm` 命令类似，但在后面添加了 `dir`（代表 directory），如下所示：\n\n```\nkali\
  \ >rmdir newdirectory\nrmdir:failed to remove 'newdirectory': Directory not empty\n\
  ```\n下面是相同操作的截图。![](img/rsrcKS.jpg) 需要注意的是，`rmdir` 不会删除非空目录，而是会给你一个警告消息提示“目录不为空”，正如你在示例中看到的。你必须在删除目录之前先删除目录中的所有内容。这样做是为了防止你意外删除并不打算删除的对象。如果你想一次性删除目录及其内容，可以在\
  \ `rm` 之后使用 `-r` 选项，如下所示：\n\n```\nkali >rm -r newdirectory\n```\n不过提醒你：在使用 `rm`\
  \ 时要谨慎使用 `-r` 选项，至少刚开始，因为很容易误删珍贵的文件和目录。例如，在主目录中使用 `rm -r` 会删除那里的每一个文件和目录，这显然不是你想要执行的。\n\
  \n### 搜索工具/软件包\n在下载软件包之前，你可以检查你的软件库中是否有你需要的包，软件库是你的操作系统存储软件包信息的地方。`apt` 工具具有搜索功能，可以检查软件包是否可用。语法非常直观：\n\
  \n```\napt-cache search keyword\n```\n已附上截图供你参考。![](img/rsrcM2.jpg) 注意，我们使用 `apt-cache`\
  \ 命令来搜索 apt 缓存或存储包名称的地方。例如，如果你正在搜索入侵检测系统 `Snort`，你将输入下所示命令。\n\n```\nkali >apt-cache\
  \ search snort\nfwsnort – Snort-to-iptables rule translator\nipl - IP protocols\
  \ logger\n--snip--snort – flexible Network Intrusion Detection System\nSnort - common\
  \ - flexible Network Intrusion Detection System - common files\n--snip--\n```\n\
  请注意下方截图命令之间的精确间距。![](img/rsrcMF.jpg) 如你所见，许多文件中包含关键词 `snort`，但在输出的中间部分，我们看到了 `snort\
  \ – flexible Network Intrusion Detection System`。这就是我们要找的内容。\n\n### 安装软件\n现在你已经知道仓库中存在\
  \ `snort` 软件包，你可以使用 `apt-get` 下载软件。要在终端中从操作系统的默认仓库中安装软件，请使用 `apt-get` 命令，后跟关键词 `install`，然后是你想要安装的包名。语法如下：\n\
  \n```\napt-get install packagename\n```\n让我们尝试在你的系统上安装 `Snort`。输入 `apt-get install\
  \ snort` 作为命令语句，如下所示。\n\n```\nkali >apt-get install snort\nReading package lists...\
  \ Done\nBuilding dependency tree\nReading state information... Done\nSuggested packages:snort-doc\n\
  The following NEW packages will be installed:\nsnort\n--snip—Install these packages\
  \ without verification [Y/n]?\n```\n这是相同操作的截图。![](img/rsrcN2.jpg) 你看到的输出告诉了你正在安装的内容。如果一切看起来都正确，在提示时输入\
  \ `y`，你的软件安装就会继续。\n\n### 软件\n删除软件时，使用带有 `remove` 选项的 `apt-get`，后跟要删除的软件名称。下所示示例。\n\
  \n```\nkali >apt-get remove snort\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nThe following packages were automatically\
  \ installed and are no longerrequired:\nlibdaq0 libprelude2 oinkmaster snort-common-libraries\
  \ snort-rules-default\n--snip--\nDo you want to continue [Y/n]?!\n```\n![](img/rsrcNJ.jpg)\
  \ 再次，你将看到正在执行的任务，并会被询问是否要继续。你可以输入 `y` 来卸载，但你可能想保留 `Snort`，因为我们以后还会再次使用它。`remove`\
  \ 命令不会删除配置文件，这意味着你可以在以后重新安装同一个包而无需重新配置。如果你想在删除包的同时也删除配置文件，可以使用 `purge` 选项，如下所示：\n\
  \n```\nkali >apt-get purge snort\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nThe following packages were automatically\
  \ installed and are no longer required:\nlibdaq0 libprelude2 oinkmaster snort-common-libraries\
  \ snort-rules-default\n--snip--\nDo you want to continue [Y/N]?!\n```\n![](img/rsrcNZ.jpg)\
  \ 在提示处输入 `Y` 以继续清理软件包和相关文件。为了保持软件的轻量化和模块化，许多 Linux 软件包被拆分成许多不同程序可能使用的软件单元。当你安装 `Snort`\
  \ 时，你还安装了 `Snort` 运行所需的几个依赖项或库，以便它可以运行。现在你正在删除 `Snort`，那些其他库或依赖项不再被需要了，因此它们也被删除了。\n\
  \n### 更新软件包\n软件仓库会定期更新新软件或现有软件的新版本。这些更新不会自动推送到你这里，因此你需要请求将这些更新应用到你的系统中。更新（updating）与升级（upgrading）不同：更新是更新仓库中可下载的软件包列表，而升级则是将软件包升级到仓库中的最新版本。你可以通过在输入\
  \ `apt-get` 命令后跟关键词 `update` 来更新你的系统。这将搜索你系统上所有的软件包并检查是否有可用更新。如果有，则将下载这些更新。见下例示例。\n\
  \n```\nkali >apt-get update\nGet:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling\
  \ InRelease [30.5kb]\nGet:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main\
  \ amd64 Packages[14.9MB]\nGet:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling\
  \ non-free amd64 Packages[163kb]\nGet:4 http://mirrors.ocf.berkeley.edu/kali kali-rolling/contrib\
  \ amd64 Packages [107kB]\nFetched 15.2 MB in 1min 4s (236 kB/s)\nReading package\
  \ lists... Done\n```\n你系统中仓库中的可用软件列表将被更新。如果更新成功，你的终端将显示 `Reading package lists...\
  \ Done`，如上所示。注意，仓库名称以及时间、大小等值可能会因你的系统而不同。\n\n### 升级软件包\n要升级系统上的现有软件包，请使用 `apt-get\
  \ upgrade`。由于升级可能会更改你的软件，你必须以 `root` 身份登录或使用 `sudo` 命令。\n\n\n\n\n* 识别目标主机上可能运行的可用\
  \ UDP 和 TCP 网络服务。\n* 了解位于目标主机和用户之间的过滤系统。\n* 通过对其 IP 响应进行评估，发现正在使用的操作系统。\n* 分析特定目标主机的\
  \ TCP 序列号预测性，以实现对 TCP 欺骗和攻击序列的预测。\n\n网络扫描包含两个关键方面：漏洞扫描和网络端口扫描。后者是指通过网络向系统的特定端口号发送数据包的方法。其目标是发现特定系统中存在的网络服务。这是排查给定系统出现问题的极佳方法。通过这种方式，可以处理问题以确保系统安全。为了发现网络系统中存在的已知漏洞，我们使用一种名为“漏洞扫描”的方法。通过这种方法，我们可以识别操作系统和应用程序软件中的弱点。这些弱点通常被用来攻破计算机系统。漏洞扫描和网络端口扫描都可以认为是用于信息收集的技术。相反，当这些技术被匿名实体利用时，它们可能成为攻击的序奏。此类实体通常具有恶意意图。反向映射（Inverse\
  \ mapping）是另一种网络扫描技术。它在收集未映射到活动主机的 IP 地址时非常有用。这样做有助于将注意力集中在值得关注的地址上，即可行的地址。信息收集可以通过三个阶段完成：\n\
  \n1. 标记阶段（footprinting），\n2. 扫描阶段（scanning），以及\n3. 枚举阶段（enumeration）。\n\n因此，这意味着网络扫描是攻击者收集信息时所需的关键步骤之一。\n\
  \n## 使用 `ifconfig` 进行网络扫描\n\n`ifconfig` 命令是用于检查和与活动网络接口交互的基本工具之一。你只需在终端中输入 `ifconfig`\
  \ 即可查询活动的网络连接。\n\n## 使用 `iwconfig` 扫描无线网络\n\n如果你有一个无线适配器，可以使用 `iwconfig` 命令为无线黑客收集关键信息，例如适配器的\
  \ IP 地址、MAC 地址、其工作模式等。当你使用 `aircrackng` 等无线黑客工具时，从该命令中获取的信息尤为重要。\n\n## 修改你的网络信息\n\
  \n能够更改 IP 地址和其他网络信息是一项实用的技能，因为它可以帮助你在伪装成受信任设备的同时访问其他网络。例如，在拒绝服务（DoS）攻击中，你可以欺骗你的\
  \ IP，使攻击看起来来自另一个源，从而帮助你在进行取证分析时规避 IP 捕获。这在 Linux 中是一项相对简单的任务，通过 `ifconfig` 命令完成。\n\
  \n### 修改 IP 地址\n\n![](img/rsrcSM.jpg)要更改 IP 地址，输入 `ifconfig`，然后输入要重新分配的接口以及想要分配给该接口的新\
  \ IP 地址。例如，要将 IP 地址 `192.168.181.115` 分配给接口 `eth0`，你需要输入：\n\n```\nKali >-ifconfig\
  \ eth0 192.168.181.115\n```\n\n当你正确操作时，Linux 将返回命令行提示符且没有任何输出。这是好事！然后，当你再次使用 `ifconfig`\
  \ 检查网络连接时，你应该看到你的 IP 地址已更改为刚刚分配的新 IP。\n\n### 修改子网掩码和广播地址\n\n你也可以使用 `ifconfig` 命令更改网络掩码（netmask）和广播地址。例如，如果你想为同一个\
  \ `eth0` 接口分配 `255.255.0.0` 的子网掩码和 `192.168.1.255` 的广播地址，你应该输入：\n\n```\nKali >ifconfig\
  \ eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255\n```\n\n再次，如果你操作得完全正确，Linux\
  \ 会返回一个新的命令行提示符。现在再次输入 `ifconfig` 以验证每个参数是否已相应更改。\n\n### 欺骗 MAC 地址\n\n你也可以使用 `ifconfig`\
  \ 更改 MAC 地址。MAC 地址是全球唯一的，通常被用作安全措施来防止黑客进入网络，或用于追踪他们。将 MAC 地址更改为欺骗性的不同 MAC 地址几乎是易举的，并且可以消除这些安全措施。因此，它是绕过网络访问控制的一种有效技术。要欺骗\
  \ MAC 地址，使用 `ifconfig` 命令的 `down` 选项关闭接口（在本例中为 `eth0`）。然后输入 `ifconfig` 命令加上接口名称（硬件用\
  \ `hw`，以太网用 `ether`）以及新的欺骗 MAC 地址。最后使用 `up` 选项启用接口使更改生效。\n\n## IP 地址分配\n\nLinux\
  \ 拥有一个运行后台进程（守护进程）的 DHCP 服务器，该进程称为 `DHCPD` 或 DHCP 守护进程。DHCP 服务器将为子网上的所有系统分配 IP 地址。它还会记录在任何时刻哪个\
  \ IP 地址分配给了哪台机器。这使其成为取证分析师在攻击后追踪黑客的极佳资源。因此，理解 DHCP 服务器的工作原理很有用。通常，从局域网连接互联网必须拥有\
  \ DHCP 分配的 IP。因此，在设置静态 IP 地址后，必须返回并获取一个新的 DHCP 分配的 IP 地址。要做到这一点，你可以随时重启系统，但我将向你展示如何在关闭重启系统的情况下获取新的\
  \ DHCP。要向 DHCP 请求 IP 地址，只需使用 `dhclient` 调用 DHCP 服务器，后跟你想要分配地址的接口。不同的 Linux 发行版使用不同的\
  \ DHCP 客户端。例如，Kali 基于 Debian，后者使用 `dhclient`。\n\n## 操纵域名系统 (DNS)\n\n黑客可以在目标的域名系统（DNS）中找到宝库般信息。DNS\
  \ 是互联网的关键组件，尽管它的设计初衷是将域名翻译为 IP 地址，但黑客可以利用它获取有关目标的信息。\n\n### 使用 `dig` 检查 DNS\n\n\
  DNS 是将像 `google.com` 这样的域名翻译为相应 IP 地址的服务。通过这种方式，你的系统才知道如何找到它。如果没有 DNS，我们需要记住经常访问的网站的成千上万\
  \ IP 地址。`dig` 是任何有志的黑客需要知道的命令之一。它提供了一种收集有关目标域名 DNS 信息的方法。存储的 DNS 信息可以是攻击前获取的关键早期侦察信息。这些信息可能包括目标名称服务器的\
  \ IP 地址（将目标名称翻译为 IP 地址的服务器）、目标的邮件服务器，以及可能的任何子域名和 IP 地址。你还可以通过添加 `mx` 选项（`mx` 是 mail\
  \ exchange server 的缩写）使用 `dig` 命令获取连接到域名的邮件服务器信息。这些信息对于针对邮件系统的攻击至关重要。\n\n### 修改你的\
  \ DNS 服务器\n\n\n\n\n\n在某些情况下，你可能想要使用另一个 DNS 服务器。为了做到，你需要编辑系统上一个名为 `/etc/resolv.conf`\
  \ 的纯文本文件。用文本编辑器打开该文件。然后，在命令行中输入编辑器的准确名称，随后是文件路径和文件名。\n\n## Wi-Fi 网络\nrsrcTN.jpg\n\
  \n首先，让我们来看 WiFi。在此之前，这里对通常常用的各种 WiFi 安全协议进行简单介绍。原始的加密等效隐私（WEP）存在严重缺陷且容易被破解。它的继代者\
  \ WiFi 保护访问（WPA）安全性稍高。最后是 WPA2PSK，它安全得多，并使用所有用户共享的预共享密钥（PSK），现在被几乎所有的 WiFi AP（企业级\
  \ WiFi 除外）使用。\n\n### 无线命令\n\n`ifconfig`\n在类 Unix 操作系统中，执行网络接口配置需要 `ifconfig`。它是系统中的一种管理实用程序。`ifconfig`\
  \ 具有用于 TCP/IP 接口参数的配置、查询和控制的实用。作为一种交互式工具，`ifconfig` 可以显示并分析网络接口的设置。总而言之，`ifconfig`\
  \ 执行以下操作：\n\n* 该命令允许查看网络设置。\n* 启用和禁用网络接口。\n* 分配网络接口 IP 地址\n* 为网络接口分配子网掩码\n* 为网络接口分配广播地址\n\
  * 为网络接口分配 IP、子网掩码和广播地址\n* 修改网络接口的 MTU\n* 启用和禁用混杂模式\n* 在网络接口上添加和删除新的别名（Alias）\n*\
  \ 修改网络接口的 MAC 地址\n\n`iwevent`\n此命令显示通过 RTNetlink 套接接收的无线事件。每行显示特定的无线事件，描述了指定无线接口上发生的情况。此命令不接受任何参数。\n\
  \n`iwlist`\n此命令可以用于扫描可用的无线网络，并显示使用 `iwconfig` 命令时不会显示的关于无线网络的其他信息。`iwlist` 用于生成附近的无线访问点及其\
  \ SSID 和 MAC 地址。\n\n`iwspy`\n此命令用于监控网络中的节点。它也可以用于记录节点的链路质量。\n\n`ifrename`\n此命令用于根据多个静态标准重命名无线网络接口，以便为每个接口一致地分配名称。接口名称通常是动态的。此命令帮助用户决定网络接口的名称。该命令需要在启动接口之前执行。\n\
  \n`iwgetid`\n这用于报告当前正在使用的无线网络的 NWID、ESSID 或访问点地址。默认情况下，`iwgetid` 将显示设备的 ESSID。如果不可用，它将改为输出\
  \ NWID。报告的信息与 `iwconfig` 显示的。相比之下，在各种脚本中进行集成要容易得多。\n\n### 蓝牙的检测与连接\n\n在最近，几乎所有的小\
  \ get 设备、系统和设备都内置了蓝牙。这些设备可以是计算机、iPod、智能手机、扬声器、游戏控制器、键盘、平板电脑等。破解蓝牙网络的能力可能导致设备上信息的泄露（假设控制了设备），并获取一个在设备进出传输权限信息的平台等。因此，如果我们想要利用这项技术，就需要理解蓝牙的工作原理。通过这本书，你将获得一些基础知识，这些知识在扫描和连接蓝牙设备以准备破解它们时将非常有帮助。\n\
  \n#### 蓝牙的工作原理\n首先，我们将蓝牙定义为一种无线通信技术，允许设备无线传输语音或数据。这发生在较短的距离。这项技术旨在取代连接设备的无处不在的电缆，同时确保跨设备通信的安全性。两个蓝牙设备连接的过程被称为配对。只要将它们设置为可发现模式，几乎任何两个设备都可以配对。在可发现模式下，蓝牙设备将广播以下关于自身的信息：\n\
  \n* 技术信息\n* 名称\n* 服务列表\n* 类（Class）\n\n配对后，两个蓝牙设备将交换链路密钥。设备将存储密钥，以便在未来的配对中识别另一个设备。每个设备都有一个唯一的标识符，通常有一个由制造商分配的名称。当我们想要识别和访问设备时，这些将是很有用的数据。\n\
  \n#### 蓝牙扫描与侦察\nrsrcV5.jpg\n\nLinux 有一个蓝牙协议栈的实现，称为 `BlueZ`，我们将用它来扫描蓝牙信号。大多数 Linux\
  \ 发行版（包括 Kali Linux）默认将其作为内置功能。`BlueZ` 拥有帮助我们扫描和管理具备蓝牙能力的实用程序。下面列出了实用程序的示例：\n\n\
  * `hciconfig`；这是 Linux 中 `ifconfig` 的等效物，但是为蓝牙蓝牙设备设计的。\n* `hcitool`；这是我们用于执行查询的工具。查询可以是设备\
  \ ID、名称、类，甚至是其时钟信息。这有助于设备同步工作。\n* `hcidump`；此工具通过对蓝牙通信进行嗅探，因此它给了我们捕获通过蓝牙信号发送的数据的机会。\n\
  \n\n\n\n\n使用蓝牙的第一步扫描和侦查是检查我们正在使用的系统蓝牙适配器是否被识别并启用，以便我们可以使用它来扫描其他设备。\n\n## 使用 hcitool\
  \ 扫描蓝牙设备\n现在我们已经知道适配器已启动，可以使用 BlueZ 套件中的另一个工具 `hcitool`，它被用于扫描范围内的其他蓝牙设备。\n\n通过通过的\
  \ `scan` 命令，我们可以找到正在使用其发现信标（discover beacons）传输信号的蓝牙设备。也就是说，被设置为发现模式的设备。你可能会遇到大多数蓝牙黑客工具都会在脚本中使用这些命令。你应该能够使用\
  \ Python 脚本甚至 bash 脚本通过这些命令创建你自己的工具。\n\n## 使用 sdptool 扫描服务\n服务发现协议，通常称为 `SDP`，是蓝牙的一项协议，用于搜索蓝牙服务（蓝牙是一套服务）。非常有帮助的是，BlueZ\
  \ 提供了 `sdptool` 工具用于浏览设备所提供的服务。同样重要的一点是，设备不需要处于发现模式即可被扫描。语法如下：\n\n```\nsdptool browse\
  \ MACaddress\n```\n\n## 使用 l2ping 查看设备是否可达\n一旦我们收集了所有附近设备的 MAC 地址，我们就可以向这些设备发送 ping（无论它们是否处于发现模式），以查看它们是否在可范围内。这让我们知道它们是否处于激活状态且在范围内。要发送\
  \ ping，我们使用以下语法的 `l2ping` 命令：\n\n```\nl2ping MACaddress\n```\n\n## 总结\n无线设备代表了连接和黑客技术的未来。在黑进这些系统的第一步中，Linux\
  \ 开发了用于扫描和连接 Wi-Fi AP 的专用命令`aircrack-ng` 无线黑客工具包包含了 `airmon-ng` 和 `airodump-ng`，它们使能够扫描并收集范围内无线设备的关键信息。BlueZ\
  \ 套件包含了 `hciconfig`、`hcitool` 以及其他能够扫描和收集信息的工具，这些工具对于黑进范围内的蓝牙设备是必要的。它还包含了许多值得探索的工具。\n\
  \n## 第 6 章：文件和目录权限\n\n### 引言\n并不是每个操作系统的每个用户都应该对文件和目录具有相同级别的访问权限。像任何专业或企业级操作系统一样，Linux\
  \ 都有保护文件和目录访问的方法。该安全系统允许系统管理员、root 用户或文件所有者通过授予特定用户读取、写入或执行文件的权限，来保护其文件免受意外的访问或篡改。对于每个文件和目录，我们可以为文件所有者、用户组以及所有其他用户指定权限状态。这在多用户企业级操作系统中是必要的。否则，情况将变得非常混乱。在本章中，我将向你展示如何检查和更改特定用户的文件和目录权限，如何设置默认的文件和目录权限，以及如何设置特殊权限。最后，你将看到黑客对权限的理解如何帮助他们利用系统。\n\
  \n### 用户类型\n如你所知，在 Linux 中，`root` 用户是全能的。root 用户几乎可以在系统上做任何事情。系统上的其他用户能力和权限受到限制，很少拥有\
  \ root 用户所拥有的访问权限。这些其他用户通常被归入具有相似功能的组中。在商业实体中，这些组可能是财务、工程、销售等。在 IT 环境中，这些组可能包括开发人员、网络管理员和数据库管理员。其思想是将具有相似需求的人放在一个组中并授予相关权限；然后组的每个成员都会继承该组权限。这主要是为了方便管理权限，从而确保安全。root\
  \ 用户默认是 `root` 组的一部分。系统上的每个新用户必须被添加到组以继承该组的权限。\n\n### 授予权限\n每个文件和目录必须为使用它的不同身份分配特定级别的权限。三个层级的权限列如下：\n\
  \n- `r` - 读取权限。这仅授予打开和查看文件的权限。\n- `w` - 写入权限。这允许用户查看和编辑文件。\n- `x` - 执行权限。这将允许用户执行文件（但不保证可以查看或编辑它）。\n\
  \n通过这种方式，root 用户可以根据用户对文件的需求授予相应级别的权限。当创建一个文件时，通常创建该文件的用户是该文件的所有者，所属组是用户当前的组。文件所有者可以向文件授予各种访问权限。让我们来看看如何更改权限以将所有权传递给单个用户和组。\n\
  \n#### 1. 给单个用户授予所有权\n要将文件的所有权移动给不同的用户以便控制权限，我们可以使用 `chown`（更改所有者）命令：\n\n```\nchown\
  \ John /tmp/johnsfile\n```\n在这里，我们提供命令、我们要授予所有权的用户名，以及相关文件的位置和名称。该命令授予了 `John` 用户账户\
  \ `johnsfile` 的所有权。\n\n#### 2. 给组授予所有权\n\n\n\n\n要将文件的所有权从一个组转移到另一个组，我们可以使用 `chgrp`（更改组）命令。黑客通常更倾向于单独行动而不是小组，但几位黑客或渗透测试人员合作完成项目也未曾不可，在这种情况下，使用组是必要的。例如，你可能有一组渗透测试人员和一个安全团队成员负责同一个项目。在这个示例中，渗透测试人员是\
  \ root 组，这意味着他们拥有所有的权限和访问权限。root 组需要访问黑客工具，而安全人员只需要访问入侵检测系统（IDS）等防御性工具。假设 root 组下载并安装了一个名为\
  \ `newIDS` 的程序；root 组需要将所有权更改为安全组，以便安全组可以随意使用它。为此，root 组将输入以下命令：\n\n```bash\nchgrp\
  \ security newIDS\n```\n此命令将 `newIDS` 的所有权传递给 `security` 组。现在你需要知道如何检查这些分配是否生效。你可以通过检查文件的权限来实现。\n\
  \n## 检查和更改权限\n\n当你想要查找哪些用户被授予了文件或目录权限时，可以使用 `ls` 命令。然而，它需要加上 `-l`（long）后缀，该后缀用于以长格式显示目录内容。显示的列表将包含权限。语法如下：\n\
  \n```bash\nls -l /usr/share/hashcat own\n```\n输出将显示文件的权限等其他信息。我们有三组三个字符，由读 (r)、写\
  \ (w) 和执行 (x) 的某种组合组成，顺序如下。第一组代表所有者的权限；第二组代表组的权限；最后一组代表所有其他用户的权限。\n\n无论你查看的是哪一组三字母字母，只要你看到第一个字母是\
  \ `r`，该用户或用户组就有权限打开并读取该文件或目录。中间字母为 `w` 意味着他们可以写入（修改）文件或目录，末尾的 `x` 意味着他们可以执行（或运行）文件或目录。如果任何\
  \ `r`、`w` 或 `x` 被替换为连字符（`-`），则相应的权限未被授予。注意，用户只能拥有执行二进制文件或脚本的权限。\n\n## 更改权限\n\n我们可以使用\
  \ Linux 命令 `chmod` 来更改权限。只有 root 用户或文件所有者才能更改权限。在本节中，我们使用两种不同的方法来更改 `hashcat.hcstat`\
  \ 的权限。首先，我们使用权限的数字表示法，然后使用符号表示法。\n\n### 使用数字符号更改权限\n\n我们可以使用快捷方式，通过一个数字来表示一组 `rwx`\
  \ 权限。就像操作系统的底层所有内容一样，权限是以二进制表示的，因此开启和关闭关关分别由 1 和 0 表示。你可以将 `rwx` 权限想象成三个开启/关闭开关，因此当所有权限都被授予时，这等同于二进制的\
  \ `111`。这样的二进制集可以通过转换为八进制轻松地表示为一个数字，八进制是一种从 0 开始到 7 结束的位数字系统。一个八进制数字代表一组三个二进制位，这意味着我们可以用一个数字表示整个\
  \ `rwx` 组。\n\n### 使用 UGO 更改权限\n\n尽管数字方法可能是 Linux 中更改权限最常用的方法，但也有人认为 `chmod` 的符号方法更直观。两种方法的效果同样好，所以找到适合你自己的方法即可。符号方法通常被称为\
  \ UGO 语法，代表用户（user 或所有者）、组（group）和其他（others）。UGO 语法非常直观。输入 `chmod` 命令，然后输入你想要更改权限的用户，提供\
  \ `u` 代表用户、`g` 代表组或 `o` 代表其他，随后是三个操作符之一：\n\n- `-` 移除权限\n- `+` 添加权限\n- `=` 设置权限\n\
  \n在操作符之后，包含你想添加或移除的权限（`rwx`），最后是应用该权限的文件名。因此，如果你想从文件 `hashcat.hcstat` 所属的用户中移除写入权限，你可以输入：\n\
  \n```bash\nchmod u-w hashcat.hcstat\n```\n此命令表示从用户 (`u`) 的 `hashcat.hcstat` 文件中移除\
  \ (`-`) 写入 (`w`) 权限。现在当你再次用 `ls -l` 检查权限时，你应该看到 `hashcat.hcstat` 文件对用户不再具有写入权限了：\n\
  \n### 为新工具授予 root 执行权限\n\n\n\n\n\n作为一名黑客，你经常需要下载新的攻击工具，但 Linux 会自动为所有文件和目录分配 666\
  \ 和 777 的默认权限。这意味着，默认情况下，你无法在下载后立即执行该文件。如果你尝试这样做，通常会收到类似“Permission denied”（权限被拒绝）的消息。在这些情况下，你需要使用\
  \ `chmod` 命令为自己赋予 root 和执行权限以运行该文件。\n\n## 特殊权限\n\n除了通用的 rwx 三种权限外，Linux 还有三种稍微复杂的特殊权限。它们是粘滞位（sticky\
  \ bit）、设置组 ID（或 SGID）和设置用户 ID（或 SUID）。以下是对它们每种权限的简要说明。\n\n### a) 使用 SUID 授予临时 root\
  \ 权限\n正如你现在所知道的，用户只有在拥有运行该特定文件的权限时，才能执行该文件。如果用户只有读取和写入权限，他们无法运行。这看起来很显而易见，但这条规则也有例外。你可能遇到过一种情况：某个文件在执行时对所有用户都需要\
  \ root 权限，即使是非 root 用户也是如此。例如，允许用户更改密码的文件需要访问 `/etc/shadow` 文件——Linux 中存储用户密码的文件——而该文件需要\
  \ root 用户权限才能执行。在这种情况下，你可以通过在程序上设置 SUID 位来临时授予所有者运行该文件的权限。因此，这意味着 SUID 位表示任何用户都可以以所有者的权限执行该文件，但这些权限不会超出对该文件的使用范围。要设置\
  \ SUID 位，在普通权限之前输入 4，因此一个新权限为 644 的文件在设置 SUID 位后将表示为 4644。在文件上设置 SUID 不是普通用户会做的事，但如果你想这样做，将使用\
  \ `chmod` 命令，例如 `chmod 4644 filename`。\n\n### b) 使用 SGID 授予 root 用户的组权限\nSGID 同样会提供临时的提升权限，但它授予的是文件所有者所在组的权限，而不是文件所有者的权限。这意味着，设置了\
  \ SGID 位后，没有执行权限的人，只要所有者属于有权运行该文件的组，就可以执行该文件。SGID 位应用于目录时工作方式略有不同：当在目录上设置该位时，在该目录中创建的新文件的所有者将属于目录创建者的组，而不是文件创建者的组。这在多个用户共享一个目录时非常有用。该组中的所有用户都可以执行文件，而不仅仅是单个用户。SGID\
  \ 位在普通权限之前表示为 2，因此一个权限为 644 的新文件在设置 SGID 位后将表示为 2644。同样，你将使用 `chmod` 命令进行此操作——例如，`chmod\
  \ 2644 filename`。\n\n### c) 过时的粘滞位 (Sticky Bit)\n粘滞位是一种可以设置在目录上的权限位，允许用户删除或重命名该目录内的文件。然而，粘滞位是旧版\
  \ Unix 系统的遗留，现代系统（如 Linux）会忽略它。因此，我在这里不再进一步讨论它，但你应该熟悉这个术语，因为你可能会在 Linux 世界听到它。\n\
  \n## 管理进程\n\n黑客经常需要进行多进程操作，像 Kali 这样的操作系统非常适合这一点。黑客可以在运行漏洞扫描器和利用的同时的同时运行端口扫描器。这要求黑客高效地管理这些进程，以最充分利用系统资源并完成任务。在本节中，我将向你展示如何管理多个进程。\n\
  \n### 使用 nice 更改进程优先级\n你经常不在黑客的语境下听到 `nice` 这个词，但在这里你会听到。`nice` 命令用于影响内核对进程优先级的考量。正如你所看到的，当我们运行\
  \ `ps` 命令时，系统上有许多进程同时运行，并且它们所有的进程都在竞争可用资源。内核对进程的优先级拥有最终决定权，但你可以使用 `nice` 来建议提高进程的优先级。使用“nice”一词背后的想法是，当你使用它时，你正在决定对其他用户有多“友好”：如果你的进程使用了大部分系统资源，那么你就不非常友好。nice\
  \ 的值范围从 –20 到 +19，其中 0 是默认值。高 nice 值对应低优先级，低 nice 值对应高优先级（当你不想对其他用户和进程那么友好时）。当进程被启动时，它会继承父进程的\
  \ nice 值。进程所有者可以降低进程的优先级，但不能增加其优先级。当然，超级用户或 root 用户可以随心所欲地设置任何 nice 值。\n\n### 在启动进程时设置优先级\n\
  为了演示目的，让我们假设有一个名为 `slowprocess` 的进程，位于 `/bin/slowprocess`。如果我们想让它加快完成速度，可以使用 `nice`\
  \ 命令启动进程：\n```\nkali >nice -n -10 /bin/slowprocess\n```\n此命令会将 nice 值增加 -10，从而提高其优先级并为其分配更多资源。相反，如果我们想对其他用户和进程友好，并给\
  \ `slowprocess` 分配较低的优先级，我们可以将其 nice 值正增加 10：\n```\nkali >nice -n 10 /bin/slowprocess\n\
  ```\n\n### 使用 renice 更改运行进程的优先级\n`renice` 命令接受 –20 到 19 之间的绝对值，并将优先级设置为该特定级别，而不是在启动时的水平上增加或减少。此外，`renice`\
  \ 需要你目标进程的 PID 而不是名称。所以，如果 `slowprocess` 在你的系统上消耗了大量的资源，你想给它一个较低的优先级，从而允许其他进程获得更高的优先级和更多资源，你可以\
  \ renice `slowprocess`（其 PID 为 6996）并给它一个高得多的 nice 值，如下：\n```\nkali >renice 20 6996\n\
  ```\n与 `nice` 类似，只有 root 用户可以将进程 renice 为负值以赋予其更高的优先级，但任何用户都可以 `renice` 友好地降低优先级。\n\
  \n### 杀死进程\n有时，进程会消耗过多的系统资源，表现出异常行为，或者至少卡死。这种行为的进程通常被称为僵尸进程（zombie process）。对你来说，最有问题的症状可能是僵尸进程浪费了资源，这些资源本可以更好地分配给其他有用进程。当你识别出一个问题的进程时，你可能想用\
  \ `kill` 命令停止它。杀死程序有很多方法，每种方法都有自己的信号 数字。`kill` 命令有 64 种不同的 信号，每个信号的作用略有不同。在这里，我们关注你可能觉得最有用的几个。`kill`\
  \ 命令的语法为 `kill-signal PID`，其中信号开关是可选的。如果你不提供信号标志，它默认为 `SIGTERM`。\n\n### 在后台运行进程\n\
  \n\n\n\n在 Linux 中，无论你是在命令行还是 GUI 界面下工作，你都在一个 shell（终端）中操作。所有运行的命令都是在该 shell 内部执行的，即使它们是通过图形界面运行的。当你执行一个命令时，shell\
  \ 会等待该命令完成后才会提供下一个命令提示符。有时，你可能希望某个进程在后台运行，而不是在那个终端中等待它完成。例如，假设我们想在文本编辑器中处理一个脚本，因此通过输入以下命令调用了文本编辑器（例如\
  \ Leafpad）：\n\n```bash\nkali >leafpad newscript\n```\n\n在这种情况下，`bash` shell 将打开\
  \ `Leafpad` 文本编辑器来创建 `newscript`。当我们在文本编辑器中工作时，终端由于正在运行该编辑器而被占用。如果我们回到终端，会发现它正在运行我们的文本编辑器，并且没有新的新的提示符允许我们输入更多命令。\n\
  \n### 将进程移动到前台\n\n如果你想将一个在后台运行的进程移动到前台，可以使用 `fg`（foreground）命令。`fg` 命令需要你想要返回前台的进程的\
  \ `PID`，如下所示：\n\n```bash\nkali >fg 1234\n```\n\n如果你不知道 `PID` 是什么，可以利用 `ps` 来找到它。\n\
  \n### 进程调度\n\nLinux 系统管理员和黑客经常需要调度进程在一天中的特定时间运行。例如，系统管理员可能希望调度系统备份在每周日日的凌晨 1 点运行。黑客可能想设置一个脚本，按特定基准运行以执行侦察，寻找开放的端口或漏洞。在\
  \ Linux 中，你至少可以通过两种方式实现这一目标：使用 `crond` 和 `at`。`at` 命令是一个守护进程（即后台进程），用于调度一个在未来某个时间点运行一次的任务。而\
  \ `crond` 更适用于按间隔（如每天、每周或每月）执行的周期性任务。\n\n### OpenSSH 与树莓派\n\n`SSH` 是 Secure Shell（安全外壳）的缩写，它基本上使我们能够安全地连接到远程系统的终端，是以前常用的不安全的\
  \ `telnet` 的替代品。当我们构建 Web 服务器时，`SSH` 允许我们创建访问列表（可以使用服务的用户列表）、使用加密密码对用户进行身份验证，并加密所有通信。这减少了未经授权用户使用远程终端的概率（由于增加了身份验证过程）或拦截我们通信的风险（由于加密）。可能最广泛使用的\
  \ Linux SSH 服务是 `OpenSSH`，它安装在几乎每一个 Linux 发行版中，包括 Kali。系统管理员经常使用 `SSH` 管理远程系统，黑客经常使用\
  \ `SSH` 连接到被攻破的远程系统，因此我们也这样做。\n\n在这个示例中，我们将使用 `SSH` 设置一个用于间谍活动的远程树莓派系统，我称之为“树莓间谍（Raspberry\
  \ Spy Pi）”。为此你需要一个树莓派和相应的树莓派摄像头模块。在此之前，请使用现在熟悉的命令在你的 Kali 系统上启动 `OpenSSH`：\n\n```bash\n\
  kali >service ssh start\n```\n\n我们将使用 `SSH` 来构建和控制一个远程间谍树莓派。如果你还不熟悉它，树莓派是一个微小但强大的、信用卡大小的电脑，作为远程间谍工具效果非常好。我们将使用一个带有摄像头模块的树莓派作为远程间谍设备。你可以在几乎任何电子零售商处（包括亚马逊）购买树莓派。在这里，我们将使用与\
  \ Kali 系统处于同一网络上的树莓派间谍设备，这允许我们使用私有的内部 IP 地址。当然，在现实世界中进行黑客活动时，你可能将其设置在另一个远程网络上，但这超出了本书的范围。\n\
  \n### 设置树莓派\n\n\n\n确保你的树莓派正在运行 Raspbian 操作系统；这只是另一个专门为树莓派 CPU 移植的 Linux 发行版。你可以在\
  \ https://www.raspberrypi.org/downloads/raspbian/ 处找到 Raspbian 的下载和安装说明。你在本书中所学到的几乎所有内容都适用于树莓派上的\
  \ Raspbian 操作系统，也适用于 Kali、Ubuntu 以及其他 Linux 发行版。一旦你下载并安装了 Raspbian 操作系统，你将需要将树莓派连接到显示器、鼠标和键盘，然后将其连接到互联网。如果这些对你来说都是全新的，请查看\
  \ https://www.raspberrypi.org/learning/hardwareguide/ 上的说明。完成设置后，使用用户名 `pi` 和密码\
  \ `raspberry` 登录。\n\n## 构建树莓派间谍 Pi\n\n第一步是确保 Raspberry Spy Pi 上的 `SSH` 正在运行并已启用。`SSH`\
  \ 通常默认是关闭的，因此要启用它，请进入 `Preferences`（偏好）菜单并启动 `Raspberry Pi Configuration`（树莓派配置）。进入\
  \ `Interfaces`（接口）选项卡，在 `SSH` 旁边点击 `Enabled`（如果尚未勾选）并点击 `OK`。当 `SSH` 启用后，你可以通过打开终端并输入以下命令在\
  \ Raspberry Spy Pi 上启动它：\n\n```\nkali >service ssh start\n```\n\n接下来，你需要连接你的摄像头模块。如果你使用的是树莓派\
  \ 3 版本板，则只有一个连接位置。关闭树莓派，将模块连接到摄像头接口，然后再次开启。请注意，摄像头非常脆弱，绝不能与通用输入/输出引脚（GPIO pins）接触；否则它可能会发生短路并损坏。\n\
  \n现在，随着 `SSH` 服务的运行，请将 Raspberry Spy Pi 放置在你家中、学校或任何你想要监控的地点。当然，它必须连接到局域网，可以通过以太网线，或者在理想情况下通过\
  \ WiFi 连接。\n\n现在，你需要获取树莓派的 IP 地址。正如之前学过的，你可以使用 `ifconfig` 获取 Linux 设备的 IP 地址：\n\n\
  ```\npi >ifconfig\n```\n\n在书中，我们将使用 IP 地址 `192.168.50.5` 作为 Pi 的地址。因此，在本章任何出现此地址的地方，请确保你使用的是自己\
  \ Raspberry Spy Pi 的 IP 地址。现在，从你的 Kali 系统，你应该能够直接连接并控制你的 Raspberry Spy Pi，并将其作为远程监控系统。在这个简单的示例中，你的系统需要与\
  \ Pi 处于同一网络中。要从你的 Kali 系统通过 `SSH` 连接到远程 Raspberry Spy Pi，请输入以下内容，记得使用你自己的 Pi 的 IP\
  \ 地址。\n\n```\nkali >ssh pi@192.168.50.5\n```\n`pi@192.168.50.5`\n`s password:`\n\
  \n## 配置摄像头\n\n接下来，我们需要配置摄像头。为此，通过输入以下命令启动树莓派配置工具：\n\n```\npi >sudo raspi-config\n\
  ```\n\n这将启动一个类似如下所示的图形菜单：\n![](img/rsrcZW.jpg)\n\n滚动到 `6 Enable Camera` 并按下 `ENTER`。现在，滚动到菜单底部并选择\
  \ `Finish` 然后按下 `ENTER`。\n\n## 从 MYSQL 提取信息\n\n在数据库驱动的 Web 应用程序中使用得广泛的数据库是 `MySQL`。这毫无疑问。在几乎每个网站都是数据库驱动的现代，，这意味着\
  \ `MySQL` 存储了绝大部分网站的数据。\n\n和 Linux 一样，`MySQL` 是开源的并遵循通用公共许可 (`GPL`)，你会在几乎每个 Linux\
  \ 发行版中发现它已预安装。由于免费、开源且强大，`MySQL` 是许多 Web 应用程序的首选。例子包括 YouTube、WordPress、Facebook\
  \ 等流行网站。\n\n### MySQL\n\n正如你所猜的，Kali Linux 预装了 `MySQL`。要启动你的 `MySQL` 服务，在终端中输入以下内容：\n\
  \n```\nkali >service mysql start\n```\n\n接下来，你需要通过登录来验证身份。\n\n### 设置 MySQL 密码\n\n\
  让我们通过输入以下内容查看哪些用户已经存在于 `MySQL` 系统中。（注意，`MySQL` 中的命令以分号结束。）\n\n```\nmysql >select\
  \ user, host, password from mysql.user;\n```\n\n让我们为 `root` 分配一个密码。为此，我们首先选择一个数据库进行工作。你系统上的\
  \ `MySQL` 会带有一些已经设置好的数据库。使用 `show databases;` 命令查看所有可用数据库：\n\n```\nmysql >show databases;\n\
  ```\n\n`MySQL` 默认带有三个数据库，其中 `information_schema` 和 `performance_schema` 是我们在这里不会使用的管理型数据库。我们将使用非管理型数据库\
  \ `mysql`，它是为了你的目的而包含的。要开始使用 `mysql` 数据库，输入：\n\n```\nmysql >use mysql\n```\n\n此命令将我们连接到\
  \ `mysql`。现在，我们可以通过以下命令将 `root` 用户的密码设置为 `hackers-arise`：\n\n```\nmysql >update\
  \ user set password = PASSWORD(\"hacking-tutorial\") where user = 'root';\n```\n\
  \n此命令将通过将用户的 `root` 密码设置为 `hacking-tutorial` 来更新该用户。\n\n## 访问远程数据库\n\n要访问 `localhost`\
  \ 上的 `MySQL` 数据库，我们使用以下语法：\n\n```\nkali >mysql -u <username> -p\n```\n\n那么，要访问远程数据库，我们需要提供托管\
  \ `MySQL` 数据库的系统 IP 地址或主机名。见下例：\n\n```\nkali >mysql -u root -p 192.168.10.1\n```\n\
  \n上述命令将我们连接到 IP 地址为 `192.168.10.1` 的 `MySQL` 数据库实例，并向向我们索要密码。\n\n## 连接数据库\n\n获得访问权限后，我们想要窥探一番。下一个逻辑步骤将是确定是否存在任何值得访问的数据库。要做到这一点，你需要发现你已获得访问权限的系统上的数据库：\n\
  \n```\nmysql >show databases;\n```\n\n与其他数据库管理系统中的惯例一样，你只需在 `MySQL` 中输入 `use databasename;`\
  \ 即可连接到你想要的数据库。\n\n## 检查数据\n\n要查看位于表中的数据，你需要使用 `SELECT` 命令。为了使此命令生效，需要以下信息：\n\n\
  *   存储你想要查看的数据表\n*   该表中包含你想要查看的数据列\n\n\n\n\n\nSELECT columns FROM table\n\n## 第\
  \ 7 章：网络安全\n\n![](img/rsrc11B.jpg)\n\n### 引言\n我们将网络安全定义为保护计算机系统、计算机网络及其相关程序免受数字形式攻击。通常情况下，网络攻击的目的是获取、修改甚至破坏敏感信息的访问。它们还试图从受害者那里勒索金钱，并中断业务的正常流程。\n\
  \n## 机密性、完整性和可用性\n这三者被著名地称为 `CIA` 三元组。我们可以将其描述为一种模型，其目的是指导任何给定组织的信息安全策略。为了避免将该三元组与美国中央情报局（Central\
  \ Intelligence Agency）混淆，我们有时将其称为 `AIC` 三元组。这三个元素是安全最关键的组件。在我们的案例中，可以说可用性定义为保证授权人员可以可靠地访问信息；机密性被认为是一用于限制访问信息的协议；而完整性则是一项旨在证明所手信息既准确又可信赖的承诺。\n\
  \n### a) 机密性\n这是隐私的一种粗略等同。在确保正确的人可以访问关键信息的同时，采取强有力措施来确保机密性也是明智的。对于授权查看数据的人员，应当限制对相关数据的访问。在外部，根据数据落入未经授权的人手中可能导致的损害类型和程度对其进行分类并不罕见。可以根据这些类别实施多或少的严格措施。维护数据的机密性有时需要对授权查看/使用的人员进行专门培训。这通常涉及可能损害信息的安全风险。这无疑可以帮助获得适当授权的人了解各种风险因素，并为他们配备应对措施。培训的其他方面可能包括密码相关问题的最佳实践以及社会工程机制。\n\
  \n这将帮助他们避免违反规范数据处理的规则，从而导致潜在的灾难性后果，尽管他们的意图可能是我们描述为高尚的。例如，使用路由号码或账户号码是确保机密性的有效措施。我们还可以利用数据加密来确保机密性。密码和用户\
  \ ID 是一个正成为常见现象的标准程序的一部分，即双因素身份验证。它们有不同的选项。这些选项包括安全令牌（软令牌或钥匙扣）和生物识别验证。\n\n此外，用户有责任采取预防措施，确保其信息出现的地点以及完成交易所需的发送次数次数至最低。在拥有关键数据的情况下，可能需要采取额外措施。此类行动可能涉及信息存储在断开连接的存储设备上、隔离计算机上，甚至仅以硬质副本的形式存储。\n\
  \n### a) 完整性\n该三元组的这一组件包含确保数据在整个生命周期内的可信性、一致性和准确性。传输中的数据不被篡改至关重要。需要采取坚实的步骤来确保未经授权的人员不对数据进行任何修改。例如，在发生机密性泄露的情况下。在这里，应对措施可以包括用户访问控制和文件权限。为了防止授权用户的无意删除或错误更改，我们可以使用版本控制。同时，还需要存在机制来帮助检测由于非人类事件导致的数据变化，这些事件包括服务器崩溃或电磁脉冲。我们可以包括校验和和加密校验和（checksums）来帮助数据的完整性验证。最后，可能需要某些形式的冗余和备份，以帮助将其恢复到原始状态。\n\
  \n### b) 可用性\n对所有硬件的严谨维护确保了该硬件提供的服务始终具有可用性。故障设备应及时、充分地修理，以保持一个没有任何软件冲突的、运行良好的操作系统环境。还应该执行的维护方面之一是更新所有必要的系统组件。此外，还要为通信提供充足的带宽，并确保瓶颈发生频率降至最低。可以使用高可用集群、冗余、`RAID`\
  \ 甚至故障转移（failovers）来缓解硬件故障及其影响。\n\n对于可能发生的最坏情况，既能自适应又快速的灾难恢复至关重要。为了实现这一点，制定的灾难恢复计划必须是全面的。防止数据丢失或连接中断还需要考虑不可预见的的事件。例如火灾和自然灾害。备份数据的副本可以安全地存储在地理上相互隔离的地点，以防止因此类事件导致的数据丢失。此类站点还需要防水和防火。为了防止由于拒绝服务攻击（DoS）和网络入侵导致的停机和数据不可访问问题，我们可以使用额外的安全设备，例如代理服务器、防火墙和软件。\n\
  \n## CIA 引起的问题\n`CIA` 范式在涉及大数据时面临着巨大挑战。这主要是因为需要保护的数据量极其巨大、数据格式多种化，最后是源源的多样性。灾难恢复计划和重复的数据集使得原本就高的成本变得更高。此外，通常缺乏监管，因为大数据的主要目标用于分析，即收集数据并使用它进行某种有用的解释。我们都认识这位人物——爱德华·斯诺登（Edward\
  \ Snowden），他揭了这个问题。安全机构在全球范围内收集海量的个人私有数据。\n\n为了防止个人信息在 `IoT` 环境中暴露，我们有特殊的考虑，被称为物联网隐私。这意味着几乎任何逻辑或物理实体都可以分配一个唯一标识符，以实现在网络（包括互联网）上进行自主通信。\n\
  \n从特定端点传输的数据本身并不一定会导致任何隐私问题。然而，问题的关键在于，当访问、收集和分析来自多个端点的碎片化数据时，就可以获取敏感信息。保护物联网本身是一项巨大的挑战，因为除了计算机之外，它还包含许多联网设备。此类设备在大多数情况下通常使用弱的默认密码，或者在某些情况下，设备未打补丁。除非\
  \ `IoT` 得到充分保护，否则它可能被用作独立的攻击向量或成为僵尸网络（thingbot）的一部分。最近，研究人员证明了通过一个支持 Wi-Fi 的灯泡就可以破坏网络。对我们来说，考虑开发中的许多网络能力产品的安全性是非常关重要的。\n\
  \n## 加密\n![](img/rsrc121.jpg)\n我们将加密定义为一种机制，将明文或其他数据类型从当前的可读形式转变为编码方式。只有拥有解密密钥的实体才能解码数据。这是一项重要的措施，通常用于跨网络提供端到端数据安全。加密作为一种主动措施，通常在整个互联网上用于保护关键信息。个人和组织也可以选择使用加密来确保敏感数据的安全。\n\
  \n### a) 加密如何工作\n明文数据（也称为未加密数据）通过使用加密算法加加密密钥来进行加密。其结果是密文，只有在使用正确的密钥进行解密时，才能以原始形式显示。相反，解密是加密的反过程。加密中使用的步骤以相反的顺序执行。在现代，我们有两种常用的加密算法。它们是对称加密和非对称加密。\n\
  \n当涉及到对称加密机制时，使用单个密钥进行加密。高级加密标准（`AES`）是最常用的对称密钥密码之一。它的设计初目的是保护政府的机密信息。与非对称加密相比，这种机制更快。然而，发送者必须与接收者共享加密密钥。密钥需要以安全的方式管理。这在大多数情况下使用了非对称算法。\n\
  \n另一方面，我们有非对称加密。我们也可以将其称为公钥加密。在这里，使用了两个不同的密钥。它们在数学上是关联的。密钥如下；一个密钥是公钥，另一个是私钥。公钥通常可以与任何人共享。私钥必须保密。在非对称加密中，常用的加密算法是\
  \ `RSA`。这在某种程度上是因为两个密钥可以加密消息，这意味着使用与加密密钥相反的密钥来用于解密。\n\n### b) 加密的优势\n存储在计算机系统中的或通过互联网或其他任何计算机网络传输的数字数据的机密性通过使用加密得到了保护。支付卡行业安全标准（`PCI\
  \ DSS`）等组织要求对敏感数据进行加密，以防止未经授权实体访问。我们还有一些标准要求或建议数据加密。如今，现代加密算法发挥着整合作用，确保通信和 IT 系统安全不仅具有机密性，还具有下述的安全要素：\n\
  \n\n\n\n\n* **身份验证**：能够验证给定消息的来源。\n* **完整性**：这涉及到保持消息的完整性。也就是说，消息的内容从发送时起就没有被经过篡改或删除。\n\
  * **不可否认性**：在这里，不可否认性意味着特定的发送者无法否认其发送过该消息。\n\n## 备份与冗余\n\n通常，我们使用备份是为了在发生灾难性损失时创建数据副本。另一方面，冗余远不止是数据存储。冗余旨在确保无论发生什么，都能提供服务的连续性。数据冗余确保数据在多个且异构的位置进行存储。我们还有所谓的网络冗余，即对给定网络进行配置，使其拥有许多备用系统。这些备用系统用于确保无论发生什么，都能维持服务的连续性。\n\
  \n### 数据冗余\n对于任何组织来说，首要任务必须是在发生安全漏洞后尽快恢复常规服务。数据应该能够尽可能快地重建。为此，企业想出了各种方法来确保存在数据冗余。众所周知，这些方法在成本效益、速度和管理方面各有优劣。最常见的方法是使用离线磁带备份。在这种方法中，使用磁带存储存储卷的完整位对位副本。磁带可以被传输到离线存储设施，当发生灾难性故障时，可以方便地检索。此外，我们还可以使用云备份来保护数据免受损失。\n\
  \n### 网络冗余\n我们用于网络的大多数基础设施都难以置信地脆弱。例如，当路由器由于某种原因烧毁时，结果会导致长时间的网络停机。为了缓解这一点，企业确保他们所使用的网络具有足够的冗余，以便在紧急情况下能够生存并提供服务。从根本上说，网络冗余意味着无论什么类型的故障，网络仍然保持运行。为了做到这一点，我们可以配置多个网络设备（如集线器、路由器和交换机），以替代故障的某个设备。我们还有\
  \ ISP 冗余，即网络中的网关连接到多个独立的 ISP。就像设备一样，一旦发生故障，其中一个 ISP 将接管。在网络运行正常的情况下，我们可以利用 ISP 分担流量，从而减少网络拥塞。这被称为负载均衡。\n\
  \n## 防止单点故障\n\nSPOF 是“单点故障”（single point of failure）的缩写。我们不希望系统的某个关键部分发生故障会导致整个系统无法使用。任何规划都需要缓解这种现象。通过冗余手段可以减少或消除单点故障。这将确保不会有单个组件能够阻止系统的正常工作。\n\
  \n## 第 8 章：变得安全且匿名\n\n### 引言\n今天，我们在互联网上所做的几乎每项操作都会被追踪。无论是谁在进行追踪，是 Google 跟踪我们的在线搜索、网站访问和电子邮件，还是国家安全局（NSA）编目录我们所有的活动，我们所有的在线行为都会被记录、索引，然后为了某人的利益进行挖掘。普通个人，特别是黑客，需要了解如何限制这种跟踪并在网络上保持相对匿名，以限制这种无处不在的监控。在本章中，我们将介绍如何使用四种方法匿名地（或尽可能匿名地）浏览万维网：\n\
  \n* 洋葱网络（The Onion Network）\n* 代理服务器\n* 虚拟专用网络\n* 私密加密邮件\n\n\n\n\n没有任何一种方法能百分之百确保你的活动免受窥视，而且只要有足够的时间和资源，任何事情都可以被追踪。然而，这些方法可能会让追踪者的工作变得困难得多。\n\
  \n## 网络是如何暴露我们身份的\n\n首先，让我们从高层面上讨论一下我们在互联网上的活动被追踪的某些方式。我们不会介绍所有的追踪方法，也不会对任何一个过程进行过详细的描述，因为那超出了本书的范围。事实上，这样的讨论本身就可以写满一整本书。\n\
  \n首先，你的 `IP address` 会在你穿过互联网时识别你的身份。从你的机器发送的数据通常会标记有你的 `IP address`，这使得你的活动很容易被追踪。\n\
  \n其次，`Google` 和其他电子邮件服务会“读取”你的邮件，寻找关键词以便更高效地向你投放广告。尽管还有许多更复杂、更耗费时间和资源的方法，但这些是我们在本章中尝试防止的。让我们先看看\
  \ `IP addresses` 是如何在互联网上暴露我们身份的。\n\n当你跨越互联网发送一个数据包时，它包含了数据源地和目的地的 `IP addresses`。通过这种方式，数据包知道它要去哪里以及去哪里返回响应。每个数据包都会经过多个互联网路由器，直到找到它的目的地，然后跳回发送者。对于一般的上网浏览，每一次“跳跃”都是数据包到达目的地时经过的路由器。发送者和目的地之间可能有多达\
  \ 20–30 次跳跃，但通常，任何数据包都会少于 15 次跳跃找到目的地。\n\n当数据包穿过互联网时，任何拦截数据包的人都可以看到是谁发送了它、它去过哪里以及它正要去哪里。这就是为什么单向网站可以在你到达时识别你的身份并自动登录，这也是某人如何追踪你在互联网上去过什么地方的原因。要查看数据包在你和目的地之间可能经过哪些跳跃，你可以使用\
  \ `traceroute` 命令，如下所示。输入 `traceroute` 和目标 `IP address` 或域名，该命令将向目的地发送数据包并追踪这些数据包的路径。\n\
  \n## 洋葱路由器系统 (The Onion Router System)\n\n在 20 世纪 90 代，美国海军研究办公室 (`ONR`) 致力于开发一种用于间谍目的的匿名上网方法。该计划是建立一个与互联网路由器独立的路由器网络，该网络可以对流量进行加密，并且只存储上一个路由器的未加密\
  \ `IP address`——这意味着路径上的所有其他路由器地址都是加密的。这个想法是，任何观察流量的人都无法确定数据的来源或目的地。这项研究在 2002 年被称为“洋葱路由器项目\
  \ (Tor Project)”，现在任何人都可以使用它在网络上进行相对安全和匿名的浏览。\n\n### Tor 如何工作\n\n通过 Tor 发送的数据包通常不会通过那些受许多人严密监控的普通路由器发送，而是通过全球范围内超过\
  \ 7,000 多个路由器组成的网络发送，这得益于允许 Tor 利用其计算机的志愿者。除了使用一个完全独立的路由器网络外，Tor 还对每个数据包的数据、终端点和发送者\
  \ `IP address` 进行了加密。在每一次跳跃中，信息都会被加密，然后在被下一个跳跃接收时被解密。通过这种方式，每个数据包只包含关于路径上上一个跳跃的信息，而不包含源地的\
  \ `IP address`。如果有人拦截了流量，他们只能看到上一个跳跃的 `IP address`，而网站所有者只能看到发送流量的最后一个路由器的 `IP address`。\n\
  \n这确保了在互联网上的相对匿名性。要使用 Tor，你需要从 `https://www.torproject.org/` 安装 Tor 浏览器。安装后，你可以像使用任何旧互联网浏览器一样使用它。通过使用此浏览器，你将通过一组独立的路由器畅览互联网，并能够在不被“老大哥\
  \ (Big Brother)”追踪的情况下访问网站。遗憾的是，代价是通过 Tor 浏览器上网可能会慢得多；因为路由器远没有那么多，所以该网络的带宽是有限的。\n\
  \n除了能够访问传统互联网上的几乎任何网站外，Tor 浏览器还能够访问暗网。构成暗网的网站需要匿名性，因此它们仅允许通过 Tor 浏览器访问，并且它们的顶级域名\
  \ (`TLD`) 以 `.onion` 结尾。暗网因非法活动而臭名昭著，但那里也存在许多合法服务。不过，要提醒一下：在访问暗网时，你可能会遇到许多人认为反犯的材料。\n\
  \na) 安全忧虑\n\n美国和其他国家的情报和间谍机构认为 Tor 网络是对国家安全的威胁，认为这种匿名网络使外国政府和恐怖分子能够在不被监控的情况下通信。因此，我们有许多强大且雄心勃勃的研究项目正致力于破解\
  \ Tor 的匿名性。Tor 的匿名性曾被这些当局破解，并且可能再次被破解。例如，`NSA` 运行自己的 Tor 路由器，这意味着当你使用 Tor 时，你的流量可能正在经过\
  \ `NSA` 的路由器。\n\n如果你的流量从 `NSA` 的路由器出口，那更糟糕了，因为出口路由器总是知道你的目的地。`NSA` 还有一种被称为 `traffic\
  \ correlation` 的方法，涉及寻找入站流量中的模式，这能够破解 Tor 的匿名性。虽然这些破解 Tor 的尝试不会影响 Tor 在向商业服务（如 `Google`）隐藏身份的效果，但它们可能会限制浏览器在防止间谍机构追踪你匿名的效果。\n\
  \n## 代理服务器\n\n在互联网上实现匿名性的另一种策略是使用代理，代理是作为流量中间人的中间系统：用户连接到代理，流量在被传递之前会被赋予代理的 `IP\
  \ address`。\n\n当流量从终点返回时，代理会将流量发回源端。通过这种方式，流量看起来来自代理而不是原始的 `IP address`。很可能，代理会保留你的流量日志。然而，调查实体需要获得搜查令或传票才能获取这些日志。为了让你的流量更难被追踪，你可以使用多个代理，这种策略被称为\
  \ `proxy chain`，我们将在本章稍后部分介绍它。`Kali Linux` 有一个非常出色的代理工具叫做 `proxychains`，你可以设置它来隐藏你的流量。`proxychains`\
  \ 命令的语法非常直观，如下所示：\n\n```\nkali >proxychains <你想要代理的命令> <arguments>\n```\n\n你提供的参数可能包括一个\
  \ `IP address`。\n\n### 在配置文件中设置代理\n\n在本节中，我们为 `proxychains` 命令设置一个使用的代理。与 Linux/Unix\
  \ 中的几乎每个应用程序一样，`proxychains` 的配置由配置文件管理——具体为 `/etc/proxychains.conf`。使用以下命令在你选择的文本编辑器打开配置文件（如有必要，将\
  \ `Leafpad` 替换为你选择的编辑器）：\n\n```\nkali >leafpad /etc/proxychains.conf\n```\n\n你应该能看到一个\
  \ `proxychains.conf` 文件。滚动到该文件的第 61 行，你应该看到 `ProxyList` 部分。我们可以通过在列表中输入我们想要使用的代理的\
  \ `IP addresses` 和端口来添加代理。\n\na) 安全忧虑\n\n关于代理安全的最后一点，请务必明智地选择代理：`proxychains` 的好坏取决于你所使用的代理。如果你打算保持匿名，如前所述，不要使用免费代理。黑客使用可以信赖的付费代理。免费代理可能正在出售你的\
  \ `IP address` 和浏览历史。正如著名的密码学家和安全专家 `Bruce Schneier` 所说过的：“如果某物是免费的，你不是客户，而是产品。”换句话说，任何免费产品都可能收集你的数据。为什么他们要提供免费的代理？虽然\
  \ `VPN` 可以让流量匿名，但受到足够的执法机构压力，可能会暴露你的身份。最好要意识到作为匿名来源的 `VPN` 的局限性。\n\n## 虚拟专用网络 (Virtual\
  \ Private Networks)\n\n使用虚拟专用网络是保持网络流量相对匿名和安全的有效方法。`VPN` 用于连接到中间设备（如路由器），将你的流量标记为该路由器的\
  \ `IP address`。使用 `VPN` 确实可以增强你的安全防护，但它不能保证匿名。\n\n`VPN` 的妙之处在于它们简单且易用。你可以与 `VPN`\
  \ 供应商开通账户，然后每次登录电脑时无缝连接到 `VPN`。你可以像照常一样使用浏览器，但对任何观察者来说，流量似乎来自 `VPN` 的 `IP address`\
  \ 和位置。此外，你与 `VPN` 设备之间的所有流量都是加密的，因此即使是你的互联网提供商也看不到你的流量。\n\n除此之外，`VPN` 对于规避政府控制的内容和信息有用。例如，如果你的国家政府限制你访问带有特定政治信息的网站，你可能可以使用国外的\
  \ `VPN` 来访问这些内容。一些媒体公司（如 `Netflix`）限制源自其国家 IP 地址的访问。使用位于这些服务允许国家的 `VPN` 可以绕过这些访问限制。一些最好的\
  \ `VPN` 服务包括：`IPVanish`、`NordVPN`、`ExpressVPN`、`CyberGhost`、`Golden Frog VPN`、`Hide\
  \ My Ass`、`Private Internet Access`、`PureVPN`、`TorGuard` 和 `Buffered VPN`。\n\n`VPN`\
  \ 的优势在于你的流量在离开电脑时经过加密，从而保护你免受窥探，并且当你访问网站时，你的 `IP address` 会被 `VPN address` 掩盖。和代理服务器一样，`VPN`\
  \ 的所有者拥有你的原始 `IP address`。\n\n## IPsec\n\n`IPsec` 用于在 IP 网络上通信两个点之间提供数据完整性、身份验证和机密性。它是互联网工程任务组协议，还对加密、解密和验证的数据包进行了定义。此外，密钥管理和安全密钥交换协议也定义在\
  \ `IPsec` 中。\n\na) IP 安全的功能以下是 `IPsec` 可以完成的任务：\n\n\n\n\n\n- 用于对应用层发现的数据进行加密。\n\
  - 保护在互联网上传输数据的路由器。\n- `IPsec` 为我们提供身份验证，但不提供任何加密。\n- 它通过使用 `IPsec` 隧道创建电路来保护网络上的数据。其工作原理与虚拟专用网络（VPN）非常相似。\n\
  \n### IP 安全组件\n以下是组成 IPsec 的某些组件：\n\n1. 互联网密钥交换 (`IKE`) – 这是一种用于网络安全的协议，旨在动态交换加密密钥，并绕过两个设备之间的安全关联\
  \ (`SA`)。`SA` 用于建立在任何两个网络元素之间共享的安全属性。这些属性是支持安全通信的基础。此外，`IKE` 为消息内容提供保护，以及一个用于实现标准算法（例如\
  \ `MD5` 和 `SHA`）的开放帧。\n2. 封装安全负载 (`ESP`) – 用于确保数据完整性、身份验证、防重放和加密。`ESP` 还对有效负载进行身份验证。\n\
  3. 身份验证头 (`AH`) – `IPsec` 使用身份验证头来确保数据完整性、防重放和身份验证。然而，身份验证头不提供加密。防重放保护功能用于防止未经授权的数据包传输，但它并不保持机密性。\n\
  \n### IP 安全的操作原理\n\n1. 首先，主机将检查数据包是否需要使用 `IPsec` 发送。是数据包的流量触发了安全策略。\n2. 互联网密钥交换的第一阶段从两个使用\
  \ `IPsec` 的主机相互进行身份验证开始。这将启动一个安全通道。在这里，我们有两种模式：\n    - 主模式（Main mode），用于提供更高的安全性；\n\
  \    - 激进模式（Aggressive mode），使主机能够快速创建 `IPsec` 电路。\n3. 使用上述通道（在第 2 步中建立），对 `IP`\
  \ 电路如何在跨越 `IP` 电路时加密数据进行协商。\n4. 之后，在协商好的安全通道上进行第二阶段的互联网密钥交换。\n5. 交换的数据随后通过新建立的 `IPsec`\
  \ 加密隧道进行。主机通过 `IPsec` `SAs` 对数据包进行加密和解密。\n6. 通信完成后或主机之间的会话超时，`IPsec` 隧道将终止。两个主机都将丢弃密钥。\n\
  \n## 第 9 章：密码学\n\n引言\n作为黑客，我们经常面临密码学和加密的障碍。在某些情况下，我们使用它来隐藏自己的操作和消息。许多应用程序和协议使用加密来维护数据的机密性和完整性。为了破解密码以及如\
  \ `SSL` 和无线等加密协议，你至少需要熟悉密码学和加密的概念与术语。对于许多新黑客来说，密码学所有的思想和术语可能让他们感到无所从心且晦涩。通过这个针对新者的简要概述，我希望拨开笼罩这一主题的迷雾，为密码学提供一点点启发。\n\
  \n加密中包含大量的数学和算法，那是我们目前不想涉足的话题。解释将非常简单且出奇地易于理解。我们将学习基本概念和术语，以便在这些相关话题出现时你能够了解相关内容。这些包括无线破解、密码破解、加密技术和哈希。然而，我的意图并不是在这里让你变成一名密码学家。这是一项需要时间磨练的技能，但可以帮助学者熟悉密码学的术语和概念，帮助你成为一名可靠的黑客。\n\
  \n### 关于密钥长度的几句话\n在密码学中，密钥长度非常重要。更安全的加密具有更大的密钥。因此，256 位的 `AES` 密钥比 128 位的 `AES`\
  \ 密钥强得多。这意味着它也难破解得多。只需说，在采用相似算法的加密中，密钥越大，加密就越强。然而，请注意加密的强度还基于密钥大小和算法的特性。因此，这并不意味着在不同的加密算法之间较大的密钥代表更强的加密。让我们从将加密分类开始吧。\n\
  \n### 密码学的类型\n以下是我们在书中将关注的加密类型。\n\n- 非对称加密\n- 对称加密\n\n但在本书中，我们将关注对称加密和非对称加密。\n\n\
  ### 对称密码学\n在这里，发送者和接收者拥有相似的密钥。对称加密无疑是今天最常用的密码学形式。想象一下：你使用密码加密消息。假设我有相同的密码，我就可以访问加密的消息。任何其他人都无法读取该消息。看这有多简单！这种密码学速度快，非常适合流媒体应用或批量存储。这种密码学方法的一个主要障碍是密钥交换。正如我们在上面看到的示例，如果两个端需要相似的密钥，它们需要另一个可以用于交换密钥的第三方通道。这就是对称密码学最大的弱点。假设打算交换消息的实体相隔数万里，密钥如何交换呢？正如你可能已经意识到的，机密性问题出现了。实体可以选择通过电子邮件、邮件、电话等交换密钥。这使得拦截正在交换的密钥成为可能，加密的机密性会被破坏。我们目前在使用许多对称算法。下面简要介绍了常用的算法。\n\
  \n1. `DES` – 由 IBM 开发，`DES` 是早期加密方案之一。后来发现 `DES` 存在缺陷且是可以破解的。早期 `LANMAN` 系统（2000\
  \ 年以前）最初使用的就是 `DES` 加密。\n2. `3DES` – 正是 `DES` 的缺陷导致了这种加密算法的发展。它通过三次应用 `DES` 工作，因此得名。这使其与\
  \ `DES` 相比变得更安全一些。\n3. `AES` – 全称是高级加密标准（Advanced Encryption Standard）。从密码学的角度来说，`AES`\
  \ 本身并不是一种加密算法。是 `NIST` 开发了 `AES`。它是目前使用的最稳健的加密之一。`AES` 利用 128 位、196 位和 256 位密钥。自\
  \ 2001 年以来，`AES` 由 `Rijndael` 算法占据。该标准广泛用于 `SSL/TLS`、`WPA2` 等需要速度和机密性的协议。\n4. `RC4`\
  \ - 它对每个位或字节进行加密，而不是单个信息块。这被称为流加密。`RC4` 由 RSA 的 `Rivest Ronald` 设计和创建。这种加密方法常用于\
  \ `WEP` 和 `VoIP` 应用。\n5. `Blowfish` – `Blowfish` 使用长度变化的密钥。它是一种非常安全的加密方案。它还是开源的，因此任何人都可以无需许可使用它。\n\
  6. `Twofish` – 它与 `Blowfish` 类似。但它拥有先进的功能，例如使用 128 位或 256 位密钥。`Twofish` 曾是 `AES`\
  \ 的有力竞争者。使用 `Twofish` 的应用示例 `cryptcat` 和 `OpenPGP` 等。此外，它没有专利，就像 `Twofish` 一样（注：原文此处可能为重复，意指均无专利）。\n\
  \n\n\n\n\n## 非对称加密\n\n这种加密类型在通信信道的两端使用不同的密钥。这是一种速度惊人缓慢的技术，与对称加密相比，它的速度要慢大约千倍！因此，对于涉及批量加密或流式通信的情况，这不是一种理想的方法。从积极的一方面来说，它解决了密钥交换问题。因为不需要在通信的两端拥有相同的密钥。这种加密类型主要用于两个实体需要交换信息但互不认识的情况。这里传输的信息通常是小位比特形式，例如身份信息，即证书或密钥。由于速度限制，非对称加密通常不用于批量或流式加密。以下是非对称加密中常见的几种方案。\n\
  \n1. **Diffie-Hellman（迪菲-赫尔曼）** ——毫无疑问，Diffie-Hellman 密钥交换可以认为是密码学领域最卓越的发展。Diffie\
  \ 和 Hellman 提出了一种密钥生成方法。这有效地消除了对称密钥加密中常见的密钥交换问题。\n\n2. **RSA** – 这是 Rivest、Shamir\
  \ 和 Adleman 的字母缩写。该方案利用了分解大质数的方法。其结果被用作两个密钥之间的关系。\n\n3. **PKI** – 这是公钥基础设施，主要用于在非对称系统中交换机密信息。PKI\
  \ 使用公钥配合私钥使用。\n\n4. **ECC** – 这是椭圆曲线加密的缩写。该方案在移动计算领域正缓慢但坚定地获得普及。这是因为不仅高效，而且只需要极少的能量和计算能力即可提供类似的安全水平。该方案依赖于位于同一椭圆曲线上的两个函数之间的共享关系。\n\
  \n5. **PGP** – Pretty Good Privacy（良好的隐私）的缩写，它利用非对称加密来确保电子邮件消息的完整性和隐私。\n\n## 数据安全\n\
  \n为了最大限度地减少对数据库、网站和计算机的未经授权访问，我们需要能够保护数字隐私的措施。这些措施就是我们所的数据安全。它的作用保护数据免受损坏。对于所有大小的组织来说，数据安全都是至关重要的\
  \ IT 方面。有时它被称为计算机安全或信息安全。用于数据安全的常用技术包括数据掩码、备份以及数据擦除等。正如我们所说的，加密也是一种数据安全技术，对于保护数据隐私至关重要。在这里，硬件、软件、硬盘和数字数据都将被加密。这是为了确保黑客和其他用户无法读取它们。我们在这里指的是那些可能接触到硬件或软件的未经授权的人。\n\
  \n身份验证是实践数据安全的方法之一。你可能遇到过需要密码登录设备甚至访问电子邮件的情景。用户必须提供身份凭证（如生物识别数据、密码、用户名等），在授予其对数据或系统的访问权限之前对其进行身份验证。\n\
  \n## 数字证书\n\n数字证书用于验证特定发送者的网络凭证。该证书还允许加密消息的接收实体理解数据来自受信源。证书权威颁发数字证书。消息加密和自签名都使用数字证书。身份证书或公钥证书是数字证书的另一个名称。`X.509`\
  \ 是常用数字证书的一个示例。\n\n## 结论\n\n我想借此机会感谢你读到了《Kali Linux 黑客之路》，希望这本书对你有所启发，通过它，你已经积累了必要的知识，让你能够开启黑客生涯，或者如果你已经是黑客，则能提升你的技能。我衷心希望你喜欢从第一个主题到最后一个主题的内容：黑客基础、网络攻击、用于黑客的\
  \ Linux、Kali 基础、网络扫描与管理、文件和目录权限、网络安全、变得安全与匿名，最后是密码学基础。我也希望通过学习这本书，你已经学习了成为黑客专家所需的许多实用概念。\n\
  \n到目前为止，你已经能够接触关于针对你的系统发起的各种攻击类型、发起攻击的原因，以及你如何保护你的基础设施免受此类攻击的大量理论知识。这些是你迈向专业黑客的第一步。本书涵盖了无线网络攻击、网络攻击和渗透测试等话题。因此，这意味着你现在处于一个极佳的位置，可以识别现实世界中发生的网络攻击机制并建议适当的补救措施。\n\
  \n我还为你提供了几种可以实施的安全措施，以保持你的网络安全。格式设计使得语言非常易于理解，你可以理解保护系统的重要性。展望，下一步是将你从书中学到的概念付诸实践。俗语说熟能生巧，只有通过实践，人们才能成为黑客领域的专家，尤其是使用\
  \ Kali Linux 的时候。让你从书中学到的知识为你效力吧。\n\n"
