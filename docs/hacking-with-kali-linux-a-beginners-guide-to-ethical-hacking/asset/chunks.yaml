  trans: "\n我们将非法 DHCP 服务器（rogue DHCP server）定义为由攻击者或毫无察觉的用户在网络上搭建的 DHCP 服务器。该非法 DHCP\
    \ 服务器不受网络管理员的控制。意外的非法设备的一个示例是用户在不知情的情况下连接到网络的具有 DHCP 功能的调制解调器。在大多数情况下，该用户通常并不知道这样做的后果。此外，这些服务器被攻击者广泛用于网络攻击，例如：嗅探、侦察和中间人攻击。在连接到网络后，两个\
    \ DHCP 服务器（合法的非法的）将为设备提供执行通信所需的所有内容。这些可能包括默认网关、DNS 服务器、WINS 服务器和 IP 地址等。偶尔，使用错误\
    \ IP 地址或网关的客户端注定会遇到网络访问问题。此外，当非法 DHCP 服务器作为受恶意或行为不当的用户控制的机器的默认网关时，它能够嗅探传输到其他网络的流量，从而违反用户隐私和现有的网络安全策略。虚拟机软件也可以充当非法\
    \ DHCP 服务器，尽管这可能是无意的。这种情况发生在软件运行在连接到网络的客户端机器上时。此时，它将向网络上的所有相邻客户端分发随机 IP 地址。后果是导致大部分区域与域内的其余部分一起断开连接。\n\
    \n## 防止非法 DHCP 服务器\n![](img/rsrc9M.jpg)\n\n具有相关签名的入侵检测系统可以用于阻止非法 DHCP 服务器。多层交换机也可以配置为丢弃数据包。DHCP\
    \ 监听（DHCP snooping）可能是处理这些服务器最常见的方法。它通过丢弃源自不可信 DHCP 服务器的 DHCP 信息来实现工作。\n\n###\
    \ TLS/SSL 加密\n加密用于保护 HTTP 网络连接。它保护连接免受拦截以及通过 Web 传播的中间人攻击。TLS/SSL 加密增加了服务器与客户端之间通信拦截过程的难度。\n\
    \n### Wi-Fi 加密\n开放的 Wi-Fi 网络更容易受到窃听攻击的侵害。因此，Wi-Fi 加密是防止黑客于外的最佳方式。这意味着他们将无法访问任何通过网络的信息。尽管如此，Wi-Fi\
    \ 加密也有其局限性，你不应该完全信赖它。\n\n## DDoS 攻击\n这是一种恶意尝试，旨在完全破坏目标服务器、网络或服务的正常流量。在大多数情况下，这是通过来自互联网的洪暴流量淹没目标及其周围设施来实现的。DDoS\
    \ 攻击的有效在于它利用多个受感染的计算机系统作为攻击的流量源。\n\n### 攻击原理\n这种攻击要求攻击者获得对在线机器的网络控制权，以便成功实施攻击。恶意软件被用于感染设备和计算机，从而将其变成机器人。也就是说，它们变成了僵尸状态。一组机器人被称为僵尸网络（botnet）。攻击者能够远程控制这些僵尸网络。僵尸网络将远程接收攻击者他们的更新指令。一旦攻击者确定了目标及其\
    \ IP 地址，僵尸网络就会对其发送请求。这将导致目标过载，造成正常合法流量的拒绝服务。由于每个机器人都是合法的互联网设备，要将正常流量与攻击流量分离来变得非常有挑战性。\n\
    \n## 第 3 章：用于黑客的 Linux\n![](img/rsrcAB.jpg)\n\n### 简介介绍\n当你开始成为黑客的之旅时，你会发现大多数专业和专家黑客在职业生涯中都会\
    \ Linux/Unix。尽管如此，我们也有某些黑客攻击可以使用 Mac OS 和 Windows。如 `Zenmap`、`Metasploit`、`Havij`、`Cain`\
    \ 和 `Abel` 等软件都有 Windows 版本。通常，当应用程序在 Linux 中开发稍后移植到 Windows 时，它们总是会丢失某些功能。也就是说；我们拥有在\
    \ Linux 中存在但在 Windows 中不存在的功能。这就是许多黑客工具设计并构建用于 Linux 的原因。因此，对于任何想要成为专业黑客的人来说，学习或掌握像\
    \ `Kali` 等 Linux 发行版知识是必要的。\n\n### 为什么黑客使用 Linux\n以下是黑客偏好 Linux 的一些主要原因。\n\n1.\
    \ **Linux 是开源的**\n   与 Windows 操作系统不同，Linux 发行版是开源的。Linux 用户可以访问系统的源代码。这意味着人们可以随意操纵和更改\
    \ Linux 操作系统以适应自己的需求。假设用户希望特定系统以原始设计之外的方式运行，那么操纵和更改源代码的能力至关重要。\n\n2. **Linux 是透明的**\n\
    \   要有效进行黑客攻击，需要深入理解用户的操作系统。此外，对想要攻击的操作系统拥有知识也是必要的。与 Windows 不同，我们可以看到甚至操纵 Linux\
    \ 的所有工作部分。也就是说，Linux 是完全透明的。理解 Windows 操作系统的内部原理并不容易。透明性意味着使用 Linux 更有效。\n\n3.\
    \ **Linux 提供了细粒度控制**\n   Linux 用户对系统拥有无限的控制权，即它是细粒度的。与 Windows 操作系统相比，这一点非常显著，因为用户只能控制微软允许他们控制的内容。Linux\
    \ 中的一切，无论是在微观层面还是宏观层面，都由 `terminal` 控制。此外，对于 Linux 中的任何脚本语言，脚本编写都是既简单又有效的。\n\n\
    4. **大多数黑客工具都是为 Linux 编写的**\n   用于黑客攻击的大多数工具专门为 Linux 编写的。像 `Nmap` 或 `Metasploit`\
    \ 等工具可以在 Windows 平台上可用，但并非所有功能都能移植到 Windows。与在 Linux 平台上相比，它们提供的功能有限。\n\n5. **未来属于\
    \ Linux/Unix**\n\n"
