- fmt: '

    Unfortunately, Linux doesn’t have a command intended solely for renaming a file,
    as Windows and some other operating systems do, but it does have the `mv` (move)
    command. The `mv` command can be used to move a file or directory to a new location
    or to give an existing file a new name. To rename `newfile` to `newfile2`, you
    would enter the following:


    ```

    kali >mv newfile newfile2

    kali >lsoldfile newfile2

    ```

    Below is a screenshot of the same.![](rsrcKA.jpg) Now when you list (`ls`) that
    directory, you see `newfile2` but not `newfile`, because it has been renamed.
    You can do the same with directories.


    ### Removing a File

    To remove a file, you can use the `rm` command, like so:


    ```

    kali >rm newfile2

    ```

    If you now do a long listing on the directory, you can confirm that the file has
    been removed.


    ### Removing a Directory

    The command for removing a directory is similar to the `rm` command for removing
    files but with `dir` (for directory) appended, like so:


    ```

    kali >rmdir newdirectory

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```

    Below is a screenshot of the same.![](rsrcKS.jpg) It is important to note that
    `rmdir` will not remove a directory that is not empty but will give you a warning
    message that the “directory is not empty,” as you can see in this example. You
    must first remove all the contents of the directory before removing it. This is
    to stop you from accidentally deleting objects you did not intend to delete. If
    you do want to remove a directory and its content all in one go, you can use the
    `-r` switch after `rm`, as shown below:


    ```

    kali >rm -r newdirectory

    ```

    Just a word of caution, though: be wary of using the `-r` option with `rm`, at
    least at first, because it is straightforward to remove valuable files and directories
    by mistake. Using `rm -r` in your home directory, for instance, would delete every
    file and directory there, that is certainly not what you were intending.


    ### Searching for tools/packages

    Before you download a software package, you can check whether the package you
    need is available from your repository, which is a place where your operating
    system stores information. The `apt` tool has a search function that can check
    whether the package is available. The syntax is straightforward:


    ```

    apt-cache search keyword

    ```

    The screenshot has been attached for your reference.![](rsrcM2.jpg) Note that
    we use the `apt-cache` command to search the apt cache or the place it stores
    the package names. So, if you were searching for the intrusion detection system
    `Snort`, for example, you would enter the command shown below.


    ```

    kali >apt-cache search snort

    fwsnort – Snort-to-iptables rule translator

    ipl - IP protocols logger

    --snip--snort – flexible Network Intrusion Detection System

    Snort - common - flexible Network Intrusion Detection System - common files

    --snip--

    ```

    Take note of the exact spacings between the command from the screenshot below.![](rsrcMF.jpg)
    As you can see, many files have the keyword `snort` in them, but near the middle
    of the output, we see `snort – flexible Network Intrusion Detection System`. That
    is what we are looking for.


    ### Adding Softwares

    Now that you know the `snort` package exists in your repository, you can use `apt-get`
    to download the software. To install a piece of software from your operating system’s
    default repository in the terminal, use the `apt-get` command, followed by the
    keyword `install` and then the name of the package you want to install. The syntax
    looks like this:


    ```

    apt-get install packagename

    ```

    Let us try this out by installing `Snort` on your system. Enter `apt-get install
    snort` as a command statement, as shown below.


    ```

    kali >apt-get install snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    Suggested packages:snort-doc

    The following NEW packages will be installed:

    snort

    --snip—Install these packages without verification [Y/n]?

    ```

    Here is a screenshot of the same.![](rsrcN2.jpg) The output you see tells you
    what is being installed. If everything looks correct, go ahead and enter `y` when
    prompted, and your software installation will proceed.


    ### Removing Softwares

    When removing software, use `apt-get` with the `remove` option, followed by the
    name of the software to remove. An example is listed below.


    ```

    kali >apt-get remove snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following packages were automatically installed and are no longerrequired:

    libdaq0 libprelude2 oinkmaster snort-common-libraries snort-rules-default

    --snip--

    Do you want to continue [Y/n]?!

    ```

    ![](rsrcNJ.jpg) Again, you will see the tasks being done in real-time, and you
    will be asked whether you want to continue. You can enter `y` to uninstall, but
    you might want to keep `Snort` since we will be using it again. The `remove` command
    does not remove the configuration files, which means you can reinstall the same
    package in the future without reconfiguring. If you do want to remove the configuration
    files at the same time as the package, you can use the `purge` option, as shown
    below:


    ```

    kali >apt-get purge snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following packages were automatically installed and are no longer required:

    libdaq0 libprelude2 oinkmaster snort-common-libraries snort-rules-default

    --snip--

    Do you want to continue [Y/N]?!

    ```

    ![](rsrcNZ.jpg) Enter `Y` at the prompt to continue the purge of the software
    package and the configuration files. To keep things small and modular, many Linux
    packages are broken into software units that many different programs might use.
    When you installed `Snort`, you installed several dependencies or libraries with
    it that `Snort` requires so that it can run. Now that you are removing `Snort`,
    those other libraries or dependencies are no longer needed, so they are removed,
    too.


    ### Updating Packages

    Software repositories will be periodically updated with new software or new versions
    of existing software. These updates do not reach you automatically, so you need
    to request them to apply these updates to your system. Updating is different from
    upgrading: updating updates the list of packages available for download from the
    repository, whereas upgrading will upgrade the package to the latest version in
    the repository. You can update your system by entering the `apt-get` command followed
    by the keyword `update`. This will search through all the packages on your system
    and check whether updates are available. If so, the updates will be downloaded.
    See the example below.


    ```

    kali >apt-get update

    Get:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling InRelease [30.5kb]

    Get:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main amd64 Packages[14.9MB]

    Get:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling non-free amd64 Packages[163kb]

    Get:4 http://mirrors.ocf.berkeley.edu/kali kali-rolling/contrib amd64 Packages
    [107kB]

    Fetched 15.2 MB in 1min 4s (236 kB/s)

    Reading package lists... Done

    ```

    The list of available software in the repository on your system will be updated.
    If the update is successful, your terminal will state `Reading package lists...
    Done`, as you can see above. Note that the name of the repository and the values;
    time, size, and so on, might be different on your system.


    ### Upgrading Packages

    To upgrade the existing packages on your system, use `apt-get upgrade`. Because
    upgrading your packages may make changes to your software, you must be logged
    in as `root` or use the `sudo` command before entering `apt-get upgrade`. This
    command will upgrade every package on your system that apt knows about, meaning
    only those stored in the repository as shown below. Upgrading can be time-consuming,
    so you might not be able to use your system for a while.


    ```

    kali >apt-get upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Calculating upgrade... Done

    The following packages were automatically installed and no longer required:

    --Snip—The following packages will be upgraded:

    --snip—1101 upgraded, 0 newly installed, 0 to remove and 318 not upgraded.

    Need to get 827 MB of archives.

    After this operation, 408 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```

    ![](rsrcR8.jpg) You should see in the output that your system estimates the amount
    of hard drive space necessary for the software package. Go ahead and enter Y if
    you want to continue and have enough hard drive space for the upgrade.


    # Chapter 5: Scanning and Managing Networks

    ![](rsrcRJ.jpg)


    ## Introduction

    The ability to scan for and connect to other network devices from your system
    is crucial to becoming a successful hacker, and with wireless technologies like
    WiFi and Bluetooth becoming the standard, finding and controlling WiFi and Bluetooth
    connections is vital. If someone can hack a wireless connection, they can gain
    entry to a device and access to confidential information. The first step, of course,
    is to learn how to find these devices. In this chapter, we are going to examine
    two of the most common wireless technologies in Linux: WiFi and Bluetooth.


    ## Network Scanning

    We say that it is the utilization of a computer network for purposes of collecting
    information about IT systems. We carry out scanning of networks primarily to help
    us do system maintenance or a security assessment. Hackers can also conduct a
    network scanning exercise before launching their attacks. The following are some
    of the reasons we scan networks:

