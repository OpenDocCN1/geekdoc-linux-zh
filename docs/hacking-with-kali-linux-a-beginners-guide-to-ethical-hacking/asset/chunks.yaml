    在 Linux 中，无论你是在命令行还是 GUI 界面下工作，你都在一个 shell（终端）中操作。所有运行的命令都是在该 shell 内部执行的，即使它们是通过图形界面运行的。当你执行一个命令时，shell
    会等待该命令完成后才会提供下一个命令提示符。有时，你可能希望某个进程在后台运行，而不是在那个终端中等待它完成。例如，假设我们想在文本编辑器中处理一个脚本，因此通过输入以下命令调用了文本编辑器（例如
    Leafpad）：


    ```bash

    kali >leafpad newscript

    ```


    在这种情况下，`bash` shell 将打开 `Leafpad` 文本编辑器来创建 `newscript`。当我们在文本编辑器中工作时，终端由于正在运行该编辑器而被占用。如果我们回到终端，会发现它正在运行我们的文本编辑器，并且没有新的新的提示符允许我们输入更多命令。


    ### 将进程移动到前台


    如果你想将一个在后台运行的进程移动到前台，可以使用 `fg`（foreground）命令。`fg` 命令需要你想要返回前台的进程的 `PID`，如下所示：


    ```bash

    kali >fg 1234

    ```


    如果你不知道 `PID` 是什么，可以利用 `ps` 来找到它。


    ### 进程调度


    Linux 系统管理员和黑客经常需要调度进程在一天中的特定时间运行。例如，系统管理员可能希望调度系统备份在每周日日的凌晨 1 点运行。黑客可能想设置一个脚本，按特定基准运行以执行侦察，寻找开放的端口或漏洞。在
    Linux 中，你至少可以通过两种方式实现这一目标：使用 `crond` 和 `at`。`at` 命令是一个守护进程（即后台进程），用于调度一个在未来某个时间点运行一次的任务。而
    `crond` 更适用于按间隔（如每天、每周或每月）执行的周期性任务。


    ### OpenSSH 与树莓派


    `SSH` 是 Secure Shell（安全外壳）的缩写，它基本上使我们能够安全地连接到远程系统的终端，是以前常用的不安全的 `telnet` 的替代品。当我们构建
    Web 服务器时，`SSH` 允许我们创建访问列表（可以使用服务的用户列表）、使用加密密码对用户进行身份验证，并加密所有通信。这减少了未经授权用户使用远程终端的概率（由于增加了身份验证过程）或拦截我们通信的风险（由于加密）。可能最广泛使用的
    Linux SSH 服务是 `OpenSSH`，它安装在几乎每一个 Linux 发行版中，包括 Kali。系统管理员经常使用 `SSH` 管理远程系统，黑客经常使用
    `SSH` 连接到被攻破的远程系统，因此我们也这样做。


    在这个示例中，我们将使用 `SSH` 设置一个用于间谍活动的远程树莓派系统，我称之为“树莓间谍（Raspberry Spy Pi）”。为此你需要一个树莓派和相应的树莓派摄像头模块。在此之前，请使用现在熟悉的命令在你的
    Kali 系统上启动 `OpenSSH`：


    ```bash

    kali >service ssh start

    ```


    我们将使用 `SSH` 来构建和控制一个远程间谍树莓派。如果你还不熟悉它，树莓派是一个微小但强大的、信用卡大小的电脑，作为远程间谍工具效果非常好。我们将使用一个带有摄像头模块的树莓派作为远程间谍设备。你可以在几乎任何电子零售商处（包括亚马逊）购买树莓派。在这里，我们将使用与
    Kali 系统处于同一网络上的树莓派间谍设备，这允许我们使用私有的内部 IP 地址。当然，在现实世界中进行黑客活动时，你可能将其设置在另一个远程网络上，但这超出了本书的范围。


    ### 设置树莓派

