    使用蓝牙的第一步扫描和侦查是检查我们正在使用的系统蓝牙适配器是否被识别并启用，以便我们可以使用它来扫描其他设备。


    ## 使用 hcitool 扫描蓝牙设备

    现在我们已经知道适配器已启动，可以使用 BlueZ 套件中的另一个工具 `hcitool`，它被用于扫描范围内的其他蓝牙设备。


    通过通过的 `scan` 命令，我们可以找到正在使用其发现信标（discover beacons）传输信号的蓝牙设备。也就是说，被设置为发现模式的设备。你可能会遇到大多数蓝牙黑客工具都会在脚本中使用这些命令。你应该能够使用
    Python 脚本甚至 bash 脚本通过这些命令创建你自己的工具。


    ## 使用 sdptool 扫描服务

    服务发现协议，通常称为 `SDP`，是蓝牙的一项协议，用于搜索蓝牙服务（蓝牙是一套服务）。非常有帮助的是，BlueZ 提供了 `sdptool` 工具用于浏览设备所提供的服务。同样重要的一点是，设备不需要处于发现模式即可被扫描。语法如下：


    ```

