    other users: if your process is using most of the system resources, you are not
    being very nice. The values for a nice range from –20 to +19, with zero being
    the default value. A high nice value translates to a low priority, and a low nice
    value translates to a high priority (when you do not want to be so friendly to
    other users and processes). When a process is started, it inherits the nice value
    of its parent process. The owner of the process can lower the priority of the
