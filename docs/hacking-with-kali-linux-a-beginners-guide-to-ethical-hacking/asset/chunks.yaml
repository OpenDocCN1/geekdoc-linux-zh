    确保你的树莓派正在运行 Raspbian 操作系统；这只是另一个专门为树莓派 CPU 移植的 Linux 发行版。你可以在 https://www.raspberrypi.org/downloads/raspbian/
    处找到 Raspbian 的下载和安装说明。你在本书中所学到的几乎所有内容都适用于树莓派上的 Raspbian 操作系统，也适用于 Kali、Ubuntu
    以及其他 Linux 发行版。一旦你下载并安装了 Raspbian 操作系统，你将需要将树莓派连接到显示器、鼠标和键盘，然后将其连接到互联网。如果这些对你来说都是全新的，请查看
    https://www.raspberrypi.org/learning/hardwareguide/ 上的说明。完成设置后，使用用户名 `pi` 和密码
    `raspberry` 登录。


    # 构建树莓派间谍 Pi


    第一步是确保 Raspberry Spy Pi 上的 `SSH` 正在运行并已启用。`SSH` 通常默认是关闭的，因此要启用它，请进入 `Preferences`（偏好）菜单并启动
    `Raspberry Pi Configuration`（树莓派配置）。进入 `Interfaces`（接口）选项卡，在 `SSH` 旁边点击 `Enabled`（如果尚未勾选）并点击
    `OK`。当 `SSH` 启用后，你可以通过打开终端并输入以下命令在 Raspberry Spy Pi 上启动它：


    ```

    kali >service ssh start

    ```


    接下来，你需要连接你的摄像头模块。如果你使用的是树莓派 3 版本板，则只有一个连接位置。关闭树莓派，将模块连接到摄像头接口，然后再次开启。请注意，摄像头非常脆弱，绝不能与通用输入/输出引脚（GPIO
    pins）接触；否则它可能会发生短路并损坏。


    现在，随着 `SSH` 服务的运行，请将 Raspberry Spy Pi 放置在你家中、学校或任何你想要监控的地点。当然，它必须连接到局域网，可以通过以太网线，或者在理想情况下通过
    WiFi 连接。


    现在，你需要获取树莓派的 IP 地址。正如之前学过的，你可以使用 `ifconfig` 获取 Linux 设备的 IP 地址：


    ```

    pi >ifconfig

    ```


    在书中，我们将使用 IP 地址 `192.168.50.5` 作为 Pi 的地址。因此，在本章任何出现此地址的地方，请确保你使用的是自己 Raspberry
    Spy Pi 的 IP 地址。现在，从你的 Kali 系统，你应该能够直接连接并控制你的 Raspberry Spy Pi，并将其作为远程监控系统。在这个简单的示例中，你的系统需要与
    Pi 处于同一网络中。要从你的 Kali 系统通过 `SSH` 连接到远程 Raspberry Spy Pi，请输入以下内容，记得使用你自己的 Pi 的 IP
    地址。


    ```

    kali >ssh pi@192.168.50.5

    ```

    `pi@192.168.50.5`

    `s password:`


    # 配置摄像头


    接下来，我们需要配置摄像头。为此，通过输入以下命令启动树莓派配置工具：


    ```

    pi >sudo raspi-config

    ```


    这将启动一个类似如下所示的图形菜单：

    ![](img/rsrcZW.jpg)


    滚动到 `6 Enable Camera` 并按下 `ENTER`。现在，滚动到菜单底部并选择 `Finish` 然后按下 `ENTER`。


    # 从 MYSQL 提取信息


    在数据库驱动的 Web 应用程序中使用得广泛的数据库是 `MySQL`。这毫无疑问。在几乎每个网站都是数据库驱动的现代，，这意味着 `MySQL` 存储了绝大部分网站的数据。


    和 Linux 一样，`MySQL` 是开源的并遵循通用公共许可 (`GPL`)，你会在几乎每个 Linux 发行版中发现它已预安装。由于免费、开源且强大，`MySQL`
    是许多 Web 应用程序的首选。例子包括 YouTube、WordPress、Facebook 等流行网站。


    ##  MySQL


    正如你所猜的，Kali Linux 预装了 `MySQL`。要启动你的 `MySQL` 服务，在终端中输入以下内容：


    ```

    kali >service mysql start

    ```


    接下来，你需要通过登录来验证身份。


    ## 设置 MySQL 密码


    让我们通过输入以下内容查看哪些用户已经存在于 `MySQL` 系统中。（注意，`MySQL` 中的命令以分号结束。）


    ```

    mysql >select user, host, password from mysql.user;

    ```


    让我们为 `root` 分配一个密码。为此，我们首先选择一个数据库进行工作。你系统上的 `MySQL` 会带有一些已经设置好的数据库。使用 `show databases;`
    命令查看所有可用数据库：


    ```

    mysql >show databases;

    ```


    `MySQL` 默认带有三个数据库，其中 `information_schema` 和 `performance_schema` 是我们在这里不会使用的管理型数据库。我们将使用非管理型数据库
    `mysql`，它是为了你的目的而包含的。要开始使用 `mysql` 数据库，输入：


    ```

    mysql >use mysql

    ```


    此命令将我们连接到 `mysql`。现在，我们可以通过以下命令将 `root` 用户的密码设置为 `hackers-arise`：


    ```

    mysql >update user set password = PASSWORD("hacking-tutorial") where user = ''root'';

    ```


    此命令将通过将用户的 `root` 密码设置为 `hacking-tutorial` 来更新该用户。


    ## 访问远程数据库


    要访问 `localhost` 上的 `MySQL` 数据库，我们使用以下语法：


    ```

    kali >mysql -u <username> -p

    ```


    那么，要访问远程数据库，我们需要提供托管 `MySQL` 数据库的系统 IP 地址或主机名。见下例：


    ```

    kali >mysql -u root -p 192.168.10.1

    ```


    上述命令将我们连接到 IP 地址为 `192.168.10.1` 的 `MySQL` 数据库实例，并向向我们索要密码。


    ## 连接数据库


    获得访问权限后，我们想要窥探一番。下一个逻辑步骤将是确定是否存在任何值得访问的数据库。要做到这一点，你需要发现你已获得访问权限的系统上的数据库：


    ```

    mysql >show databases;

    ```


    与其他数据库管理系统中的惯例一样，你只需在 `MySQL` 中输入 `use databasename;` 即可连接到你想要的数据库。


    ## 检查数据


    要查看位于表中的数据，你需要使用 `SELECT` 命令。为了使此命令生效，需要以下信息：


    *   存储你想要查看的数据表

    *   该表中包含你想要查看的数据列


    '
- fmt: '

    SELECT columns FROM table


    # Chapter 7: Cyber Security


    ![](rsrc11B.jpg)


    ## Introduction

    We define cybersecurity as being the protection of computer systems, computer
    networks, and their associated programs from attacks that are of a digital form.
    Typically, cyberattacks are carried out with the intent of gaining access, modification,
    or even destruction of information that is sensitive. They also attempt to extorting
    money from victims and are meant to interrupt the normal processes of a business.


    ## Confidentiality, Integrity, and Availability

    The three are famously referred to as the `CIA` triad. We can describe it as a
    model whose purpose is to guide information security policies within any given
    organization. To prevent confusing the triad with the American Central Intelligence
    Agency, we sometimes refer to it as the `AIC` triad. The three elements are the
    most critical components of security. In our case, we can say that availability
    is defined as a guarantee of access that is reliable to information by people
    with authorization, confidentiality is said to be a set of protocols that are
    used to to limiting access to information, and integrity is the undertaking given
    to show that the information at hand is both accurate and trustworthy.


    ### a) Confidentiality

    This is a rough equivalent of privacy. While ensuring that the right people can
    have access to crucial information, it is also prudent that vigorous measures
    are undertaken to make sure that there is confidentiality. There should be restricted
    access to the data in question by those who are authorized to view it. Out there,
    it is not uncommon to categorized data based on the type and amount of damage
    that can result from it falling into unauthorized persons. Stringent measures
    can more or less be implemented depending on these categories. Guarding the confidentiality
    of data sometimes requires specialized training for authorized to view/use persons.
    It would generally involve security risks that could harm that information. It
    can, without a doubt, help people with the proper authorization to get to know
    the various risk factors and equip them with countermeasures. Additional aspects
    of the training may comprise best practices in password-related issues alongside
    social engineering mechanisms.


    This will help them avoid breaching rules governing data-handling with potentially
    disastrous results in as much as they may have intentions we can describe as being
    noble. For example, using a routing number or an account number is an effective
    measure that can be used to ensure confidentiality. We can also employ the use
    of data encryption to make sure that there is confidentiality. Passwords and user
    IDs are part of a standard procedure that is becoming a common phenomenon, two-factor
    authentication. There are different options. They include security tokens (soft
    tokens or key fobs) and biometric verification.


    Furthermore, it is incumbent upon the users to take precautions in ensuring that
    locations where their information appears and the number of times required to
    send it to complete a transaction is at a minimal. In cases where we have critical
    data, extra measures may be necessary. Such actions can involve storing the information
    on disconnected storage devices, on air-gapped computers, or it can even be stored
    in the form of hard copies only.


    ### a) Integrity

    This component of the triad comprises ensuring the trustworthiness, consistency,
    and accuracy of data throughout its complete life cycle. It is of immense importance
    that data that is in transit is not altered. Solid steps need to be taken to make
    sure that no modification on the data by unauthorized people happens. For instance,
    in cases where we have a confidentiality breach. Here, the countermeasures can
    involve user access controls and file permissions. To prevent accidental deletion
    or erroneous changes by authorized users, we can employ the use of version control.
    In place, there also need to exist mechanisms to help in the detection of data
    changes which may result from non-human events, including a server crash or an
    electromagnetic pulse. We can include checksums and cryptographic checksums to
    help with the integrity verification of data. Lastly, it may be necessary to have
    some form of redundancies and backups that will help in the restoration back to
    its former state.


    ### b) Availability

    The rigorous maintenance of all the hardware ensures that there will always be
    an availability for the services rendered by this hardware. Failing equipment
    should be promptly and adequately repaired to keep in order a properly functioning
    operating system environment that is devoid of any software conflicts. One aspect
    of maintenance that should also be carried out is updating all the necessary system
    components. It will also be to provide ample bandwidth for communications and
    to ensure a minimal occurrence of bottlenecks. Mitigation of hardware failures
    and their repercussions can be done using high-availability clusters, redundancy,
    `RAID`, and even failovers.


    For the worst-case scenarios that occur, disaster recovery that is both adaptive
    and fast is essential. For this to be possible, the disaster recovery plan laid
    down has to be comprehensive. Prevention of data loss or connection interruptions
    needs to also account for unpredictable events. Examples include fire and natural
    disasters. Copies of back up data can be securely stored at a location that is
    geographically-isolated to prevent loss of data resulting from such occurrences.
    Such sites also need to be water and fire-resistant. To guard against issues such
    as downtime and inaccessibility of data due to denial-of-service attacks and network
    intrusions, we can employ the use of extra security equipment, for instance, proxy
    servers, firewalls, and software.


    ## Issues Arising from the CIA

    The `CIA` paradigm faces immense challenges where big data is involved. This is
    primarily because of the sheer volume needing to be kept safe, the variety of
    formats of the data and finally the multiplicity of the originating sources. Disaster
    recovery plans and duplicate sets of data all make the already high cost even
    higher. Additionally, oversight is often lacking since the main objective of big
    data is for analytics purposes, i.e., gathering data and using it to make some
    kind of useful interpretation. We all know this fellow, Edward Snowden who brought
    this issue to light. Security agencies carry out the collection of enormous volumes
    of peoples’ private data throughout the world.


    To safeguard individual information from exposure in the `IoT` environment, we
    have special considerations known as the Internet of Things privacy. This means
    that almost any logical or physical entity can be assigned a unique identifier
    to enable autonomous communications over a network, including the Internet.


    The transmitted data from a particular endpoint may not, on its own, necessarily
    result in any privacy issues. The catch is, however, when the fragmented data
    from multiple endpoints is accessed, gathered, and analyzed, sensitive information
    can be obtained. Securing the Internet of Things is itself a formidable challenge
    since it comprises numerous Internet-enabled devices besides computers. Such devices
    are in most cases, often set up with default passwords that are weak or in some
    cases, the devices are unpatched. Unless `IoT` is protected adequately, there
    is a likelihood that it may be used as a separate vector of attack or be made
    a part of a thingbot. Recently, it has been demonstrated by researchers that it
    is possible to compromise a network just by using a Wi-Fi-enabled light bulb.
    It is essential for us that we consider the security of the numerous network-capable
    products that are under development.


    ## Encryption

    ![](rsrc121.jpg)

    We define encryption as a mechanism through which plaintext or other data type
    are changed from their currently readable form to an encoded way. It is only an
    entity having access to a decryption key that can decode the data. This is an
    important measure that usually is used to provide end-to-end data security across
    networks. Encryption, as a proactive measure, is commonly used all over the internet
    for purposes of protecting crucial information. Individuals, together with organizations,
    may also opt to use encryption to ensure the safety of sensitive data.


    ### a) How Encryption Works

    Plaintext data, also known as unencrypted data, is encrypted through the use of
    an encryption algorithm plus an encryption key. The result of this is a ciphertext
    that can be seen only in its original form if decrypted with the correct key.
    On the other hand, decryption is the reverse of encryption. The steps used in
    encryption are followed in a reverse fashion. In the modern age, we have two commonly
    used encryption algorithms. They are symmetric and asymmetric encptions.


    When it comes to the symmetric encryption mechanism, a single key is utilized
    for encryption. The Advanced Encryption Standard (`AES`) is one of the most used
    symmetric-key ciphers. It was designed primarily to protect classified information
    for governments. This mechanism is faster in comparison to asymmetric encryption.
    The sender must, however, share the encryption key with the recipient. The keys
    need to be managed in a secure fashion. This uses an asymmetric algorithm in most
    cases.


    On the other hand, we have asymmetric cryptography. We can also refer to it as
    public-key cryptography. Here, two different keys are used. They are, however,
    mathematically linked. The keys are as follows; one key is public and the other
    one private. The public key many times can be shared with anyone. The private
    key has to be kept secret. In asymmetric cryptography, the commonly used encryption
    algorithm is `RSA`. The reason is to some extent that the two keys can encrypt
    a message, which is to imply the key that is opposite to the one used for the
    encryption is used to decrypt it.


    ### b) Benefits of Encryption

    Confidentiality of digital data which is stored on computer systems or that which
    is sent through the internet or any other computer network is protected by using
    encryption. Organizations such as Payment Card Industry Security Standard (`PCI
    DSS`) require that sensitive data be encrypted to keep unauthorized entities from
    accessing the data. We also have some standards requiring or recommending data
    encryption. Nowadays, modern encryption algorithms serve an integral role in making
    sure that the security of communications and IT systems possess not only confidentiality
    but also the under listed key elements of security:

