    # Introduction

    Congratulations on downloading `Hacking with Kali Linux: The Ultimate Beginners
    Guide for Learning Kali Linux to Understand Wireless Network & Penetration Testing`.
    Including how to Getting Started with Scripting and Security, and thank you for
    doing so. The book covers the numerous tools in `Kali Linux` that you can use
    for performing penetration tests. You will also be able to learn the operations
    of the various utilities in this `Debian` distribution. To use this book effectively,
    you will require prior knowledge of basic `Linux administration`, computer networking,
    and the command utilities, albeit on a minimum. This will help you to comprehend
    the various subjects that have been covered herein.


    You will get to know how what makes it possible for hackers to gain access to
    your systems and the methods they use to steal information. Furthermore, you will
    also learn the countermeasures required to safeguard yourself against the numerous
    hacking techniques. To this end, the book covers topics that include: `Basics
    of Hacking`, `Cyber Attacks`, `Linux for Hacking`, `Basics of Kali`, `Scanning
    and Managing Networks`, `File and Directories Permissions`, `Cyber Security`,
    `Becoming Secure and Anonymous`, and some basics cryptography that you will be
    required to know as an aspiring hacker.


    Upon completion of this book, you will have become knowledgeable about both theoretical
    and practical concepts about basic hacking techniques. You will have the techniques
    needed for penetration of computer networks, computer applications alongside computer
    systems. Let me say that we have numerous books that cover this topic, but you
    have decided to pick this one up. Many thanks for that. No efforts have been left
    to ensure that the content in this book is relevant and refreshing to you. Have
    fun reading!


    # Chapter 1: Basics of Hacking

    ![](rsrc40.jpg)

    ## Definition of Hacking

    This is a process of identification of flaws that are present in a given network
    or computer systems that can be used to exploit its weaknesses to gain access.An
    excellent hacking example is employing the use of a password cracking algorithm
    to secure entry into a system. In this age, computers are indispensable when it
    comes to running successful businesses. Additionally, computers need to be networked
    to be able to facilitate the exchange of communication with other external businesses.
    This means that isolated computer systems on their own are not enough. By networking
    them, it means that we are exposing them to the outside world and thus making
    it possible for them to get hacked. Hacking essentially implies the use of computers
    to carry out malicious acts, for instance, stealing personal or corporate data,
    privacy invasion, fraud, and so on. Cybercrimes are known to cost organizations
    all around the world millions of dollars each year.It is therefore prudent that
    businesses protect themselves against such attacks. Most of the hacking worldwide
    is carried out with criminal intent. This can range from committing some form
    of fraud to ruining the reputation of the targeted organization. Hacking is a
    crime and is in most jurisdictions, punishable by law. In spite of this, there
    is a form of hacking that is considered beneficial. This is done by professionals,
    government law agencies, and other accredited institutions. Primarily, they intend
    to counter the malevolent intent of malicious hackers. This way, it is possible
    to safeguard systems against harm.


    ## Common Hacker Attacks

    The following are the most common types of hacker attacks against computers and
    networks.

