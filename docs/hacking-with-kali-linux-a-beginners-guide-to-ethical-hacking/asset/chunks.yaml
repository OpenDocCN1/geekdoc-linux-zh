    在使用命令行时，你经常可能想要搜索特定的关键词。为此，你可以使用 `grep` 命令作为过滤器来搜索关键词。当输出从一个命令管道传输到另一个命令时，经常会使用
    `grep` 命令。显示 `grep` 命令输出结果的截图所示：![](img/rsrcHV.jpg)


    在上面的示例中，该命令将显示所有正在运行的服务，然后将该输出管道到 `grep`。`grep` 的作用是在接收到的输出中搜索我们要求查找的关键词。在我们的案例中，关键词是
    `apache2`。`Grep` 将继续并仅输出相关的的结果。该命令节省了时间。


    # 修改文件和目录

    在找到你查找的目录和文件后，你可能需要对它们执行若干操作。我们将学习如何创建目录和文件、复制文件、重命名文件，以及删除文件和目录。


    ## 创建文件

    在 Linux 中创建文件有很多方法，但目前我们将查看两种简单的方法。第一种是 `cat`，它是 `concatenate` 的缩写，意为合并片段（这并不是指你喜爱的宠物猫咪）。`cat`
    命令通常用于显示文件内容，但也可以用于创建小文件。对于创建较大的文件，最好在 `vim`、`emacs`、`Leafpad`、`gedit` 或 `kate`
    等文本编辑器输入代码，然后将其保存为文件。


    ### 使用 cat 合并

    `cat` 命令后文件名将显示该文件的内容，但要创建一个文件，我们在 `cat` 命令后跟一个重定向符号（用 `>` 符号表示）以及我们想要创建的文件名。这是一个示例：

    ```

    kali >cat > kalilinuxHacking with Kali Linux!

    ```


    ### 使用 touch 创建文件

    创建文件的第二个命令是 `touch`。该命令最初开发是为了让用户“触碰”文件来更改其某些细节，例如创建或修改日期。然而，如果文件尚不存在，该命令默认会创建该文件。让我们使用
    `touch` 命令创建 `newfile`：

    ```

    kali >touch newfile

    ```

    现在，当我使用 `ls -l` 查看目录的详细列表时，我看到创建了一个名为 `newfile` 的新文件。注意，它的大小为 0，因为 `newfile` 中没有内容。


    ## 创建目录

    Linux 中创建目录的命令是 `mkdir`，是 `make directory` 的缩写。要创建一个名为 `newdirectory` 的目录，请输入以下命令：![](img/rsrcJH.jpg)

    要进入这个新创建的目录，请输入：![](img/rsrcJP.jpg)


    ## 复制文件

    要复制文件，我们使用 `cp` 命令。这会在新位置创建一个文件的副本，并将旧文件保留在原处。在这里，我们将使用 `touch` 在根目录下创建文件 `oldfile`，将其复制到
    `/root/newdirectory`，在此过程中对其重命名，并将原始 `oldfile` 保留在原处：![](img/rsrcJW.jpg)


    重命名文件是可选的，只需通过在目录路径末尾添加你想给它的名称来实现。如果你在复制文件时不重命名，该文件将默认保留原始名称。当我们随后导航到 `newdirectory`
    时，我们看到有一个名为 `newfile` 的 `oldfile` 完整副本：

    ```

    kali >cd newdirectory

    kali >ls

    newfile oldfile

    ```


    ## 重命名文件


