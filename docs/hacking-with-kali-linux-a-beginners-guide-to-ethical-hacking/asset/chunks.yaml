    No one method is sure to keep your activities safe from prying eyes, and given
    enough time and resources; anything can be tracked. However, these methods will
    likely make the tracker’s job much more difficult.


    ## How the Internet Gives Us Away


    To begin, let’s discuss at a high level some of the ways our activities on the
    internet are tracked. We won’t go into all tracking methods, or into too much
    detail about any one process, as that would be beyond the scope of this book.
    Indeed, such a discussion could take up an entire book on its own.


    First, your `IP address` identifies you as you traverse the internet. Data sent
    from your machine is generally tagged with your `IP address`, making your activities
    easy to track.


    Second, `Google` and other email services will “read” your email, looking for
    keywords to more efficiently serve your ads. Although there are many more sophisticated
    methods that are far more time and resource-intensive, these are the ones we try
    to prevent in this chapter. Let’s start by taking a look at how `IP addresses`
    give us away on the internet.


    When you send a packet of data across the internet, it contains the `IP addresses`
    of the source and destination for the data. In this way, the packet knows where
    it is going and where to return the response. Each packet hops through multiple
    internet routers until it finds its destination and then jumps back to the sender.
    For general internet surfing, each hop is a router the packet passes through to
    get to its destination. There can be as many as 20–30 hops between the sender
    and the destination, but usually, any packet will find its way to the destination
    in fewer than 15 hops.


    As the packet traverses the internet, anyone intercepting the packet can see who
    sent it, where it has been, and where it is going. This is one-way websites that
    can tell who you are when you arrive and log you in automatically, and it is also
    how someone can track where you’ve been on the internet. To see what hops a packet
    might make between you and the destination, you can use the `traceroute` command,
    as shown next. Enter `traceroute` and the destination `IP address` or domain,
    and the command will send out packets to the destination and trace the route of
    those packets.


    ## The Onion Router System


    In the 1990s, the US Office of Naval Research (`ONR`) set out to develop a method
    for anonymously navigating the internet for espionage purposes. The plan was to
    set up a network of routers that was separate from the internet’s routers, that
    could encrypt the traffic, and that only stored the unencrypted `IP address` of
    the previous router— meaning all other router addresses along the way were encrypted.
    The idea was that anyone watching the traffic could not determine the origin or
    destination of the data. This research became known as “The Onion Router (Tor)
    Project” in 2002, and it’s now available to anyone to use for relatively safe
    and anonymous navigation on the web.


    ### How Tor Works


    Packets sent over Tor are generally not sent over the regular routers so closely
    monitored by so many but instead are sent over a network of over 7,000 routers
    around the world, thanks to volunteers who allow their computers to be utilized
    by Tor. On top of using an entirely separate router network, Tor encrypts the
    data, destination, and sender `IP address` of each packet. At each hop, the information
    is encrypted and then decrypted by the next hop when it’s received. In this way,
    each packet contains information about only the previous hop along the path and
    not the `IP address` of the origin. If someone intercepts the traffic, they can
    see only the `IP address` of the previous hop, and the website owner can see only
    the `IP address` of the last router that sent the traffic.


    This ensures relative anonymity across the internet. To enable the use of Tor,
    you need to install the Tor browser from `https://www.torproject.org/`. Once installed,
    you can use it like any old internet browser. By using this browser, you will
    be navigating the internet through a separate set of routers and will be able
    to visit sites without being tracked by Big Brother. Unfortunately, the tradeoff
    is that surfing via the Tor browser can be a lot slower; because there are not
    nearly as many routers, the bandwidth is limited in this network.


    In addition to being capable of accessing nearly any website on the traditional
    internet, the Tor browser is capable of accessing the dark web. The sites that
    make up the dark web require anonymity, so they allow access only through the
    Tor browser, and they have addresses ending in `.onion` for their top leveldomain
    (`TLD`). The dark web is infamous for illegal activity, but there exist quite
    a number of legal services that are also available there. A word of caution, however:
    when accessing the dark web, you may come across material that many will find
    offensive.


    a) Security Concerns


    The intelligence and spy services of the United States and other nations consider
    the Tor network a threat to national security, believing such an anonymous network
    enables foreign governments and terrorists to communicate without being watched.
    As a result, we have numerous robust and ambitious research projects are working
    to break the anonymity of Tor. Tor’s anonymity has been broken before by these
    authorities and will likely be broken again. The `NSA`, as one instance, runs
    its own Tor routers, meaning that your traffic may be traversing the `NSA`’s routers
    when you use Tor.


    If your traffic is exiting the `NSA`’s routers, that’s even worse, because the
    exit router always knows your destination. The `NSA` also has a method known as
    `traffic correlation`, which involves looking for patterns in incoming and outgoing
    traffic, that has been able to break Tor’s anonymity. Though these attempts to
    break Tor won’t affect Tor’s effectiveness at obscuring your identity from commercial
    services, such as `Google`, they may limit the browser’s effectiveness in keeping
    you anonymous from spy agencies.


    ## Proxy Servers


    Another strategy for achieving anonymity on the internet is to use proxies, which
    are intermediate systems that act as middlemen for traffic: the user connects
    to a proxy, and the traffic is given the `IP address` of the proxy before it’s
    passed on.


    When the traffic returns from the destination, the proxy sends the traffic back
    to the source. In this way, traffic appears to come from the proxy and not the
    originating `IP address`. Most probably, the proxy will keep a log of your traffic.
    However, an investigating entity would need to obtain a search warrant or subpoena
    in order for them to obtain the logs. To make your traffic even harder to trace,
    you can use more than one proxy, in a strategy known as a `proxy chain`, which
    we’ll look at a little later in this chapter. `Kali Linux` has an excellent proxying
    tool called `proxychains` that you can set up to obscure your traffic. The syntax
    for the `proxychains` command is straightforward, as shown here:


    ```

    kali >proxychains <the command you want proxied> <arguments>

    ```


    The arguments you provide might include an `IP address`.


    ### Setting Proxies in the Config File


    In this section, we set a proxy for the `proxychains` command to use. As with
    nearly every application in Linux/Unix, the configuration of `proxychains` is
    managed by the config file—specifically `/etc/proxychains.conf`. Open the config
    file in your text editor of choice with the following command (replacing `Leafpad`
    with your chosen editor if necessary):


    ```

    kali >leafpad /etc/proxychains.conf

    ```


    You should see a `proxychains.conf` file. Scroll down this file to line 61, and
    you should see the `ProxyList` section. We can add proxies by entering the `IP
    addresses` and ports of the proxies we want to use in this list.


    a) Security Concerns


    As a last note on proxy security, be sure to choose your proxies wisely: `proxychains`
    is only as good as the proxies you use. If you are intent on remaining anonymous,
    do not use a free proxy, as mentioned earlier. Hackers use paid for proxies that
    can be trusted. The free proxies are likely selling your `IP address` and browsing
    history. As `Bruce Schneier`, the famous cryptographer and security expert, once
    said, “If something is free, you’re not the customer; you’re the product.” In
    other words, any free product is likely gathering your data and selling it. Why
    else would they offer a proxy for free? Although the `IP address` of your traffic
    leaving the proxy will be anonymous, there are other ways for surveillance agencies
    to identify you. For instance, the owner of the proxy will know your identity
    and, if pressured enough by espionage or law enforcement agencies with jurisdiction,
    may offer up your identity to protect their business. It is good to be aware of
    the limitations of proxies as a source of anonymity.


    ## Virtual Private Networks


    Using a virtual private network can be an effective way to keep your web traffic
    relatively anonymous and secure. A `VPN` is used to connect to an intermediary
    internet device such as a router that sends your traffic to its ultimate destination
    tagged with the `IP address` of the router. Using a `VPN` can certainly enhance
    your security and privacy, but it is not a guarantee of anonymity. The internet
    device you connect to must record or log your `IP address` to be able to send
    the data back to you accurately, so anyone able to access these records can uncover
    information about you.


    The beauty of `VPNs` is that they are simple and easy to work with. You can open
    an account with a `VPN` provider and then seamlessly connect to the `VPN` each
    time you log on to your computer. You would use your browser as usual to navigate
    the web, but it will appear to anyone watching that your traffic is coming from
    the `IP address` and location of the internet `VPN` device and not your own. Besides,
    all traffic between you and the `VPN` device is encrypted, so even your internet
    service provider cannot see your traffic.


    Among other things, a `VPN` can be useful in evading government-controlled Content
    and information censors. For instance, if your national government limits your
    access to websites with particular political messages, you can likely use a `VPN`
    based outside your country to access that Content. Some media corporations, such
    as `Netflix`, limit access to their Content to IP addresses originating from their
    nation. Using a `VPN` based in a country that those services allow can get you
    around those access limitations. Some of the best `VPN` services are: `IPVanish`,
    `NordVPN`, `ExpressVPN`, `CyberGhost`, `Golden Frog VPN`, `Hide My Ass`, `Private
    Internet Access`, `PureVPN`, `TorGuard`, and `Buffered VPN`.


    The strength of a `VPN` is that all your traffic is encrypted when it leaves your
    computer, thus protecting you against snooping, and your `IP address` is cloaked
    by the `VPN IP address` when you visit a site. As with a proxy server, the owner
    of the `VPN` has your originating `IP address`.


    ## IPsec


    `IPsec` is used to provide data integrity, authentication, and confidentiality
    between two points across the IP network that are in communication. It is an Internet
    Engineering Task Force protocol that also provides definitions of the encrypted,
    decrypted and authenticated packets. Additionally, key management and secure key
    exchange protocols are defined in `IPsec`.


    a) Functions of IP SecurityThe following are tasks that can be done by `IPsec`:

