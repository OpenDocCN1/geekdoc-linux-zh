    # 1. Denial of Service (DoS) Attack


    A websites’s server can get overloaded when it is flooded by traffic more than
    it can handle. Picture this, a road designed to handle traffic from a small town
    can quickly get gridlocked when there is an influx of external traffic. The users
    will experience massive delays, and the inconvenience will be great. This is how
    a denial of service attack affect websites. The additional traffic on the site
    will make it impossible to provide service to visitors who are trying to access
    it. A practical example is a newspaper’s website carrying breaking news. Many
    people will try to access it to find out more, consequently overloading the site.
    In a `DoS` attack, however, the overloaded traffic is ordinarily malicious. The
    intention is to shut down the website from its legitimate users. A Distributed
    Denial-of-Service Attack (`DDoS`) is an attack carried out by many computers at
    the same time. It is challenging to cope with this type of attack since the `IP`
    addresses will appear to be originating from many different locations around the
    world simultaneously. This means that it is difficult to determine the source
    of attack by network administrators.


    # 2. Cross-Site Scripting (XSS)


    An attacker can go after a vulnerable website in an `SQL` injection attack. Stored
    data can be targeted. For instance, sensitive financial data, user credentials,
    among others. A cross-site scripting attack is preferable to an attacker who would
    instead directly target a website’s users. Just like an `SQL` injection attack,
    a cross-site scripting attack involves injecting malicious code into a site. The
    only difference is that the website itself is not being attacked. What happens
    is that a malicious attacker will carry out an injection on the user’s browser
    upon visiting the infected site. A common way to do this is by injecting the code,
    which is malicious into a comment or a script that could automatically run. For
    instance, in `JavaScript`, a link can be embedded in a comment on a blog. This
    type of attack can, in essence, damage a website’s reputation by risking users’
    information without necessarily doing anything malicious. In some cases, sensitive
    information users transmit on the site can be hijacked through cross-site scripting
    before even the owners of the website realize that there is a problem.


    # 3. SQL Injection Attack


    `SQL` is a programming language we use to communicate with databases. Most servers
    doing storage of critical data for websites and services usually utilize `SQL`
    for the management of data that is stored on their databases. This type of assault
    targets, precisely this kind of server. It employs the use of a malicious code
    to prompt the server to disclose the information it would not normally do. The
    problem can be amplified if the server is used for storing private customer details,
    for example, usernames, numbers of credit cards, and so on. This information can
    be used to identify a person. The attack carries out its intended goal through
    the exploitation of any one of the known `SQL` vulnerabilities that are known
    to permit running malicious codes on the `SQL` server. For instance, an injection
    - attack - vulnerable `SQL` server, may motivate an attacker to type in a code
    in the website''s search box, which will make the `SQL` server of the site to
    dump the usernames and passwords that have been stored for the site.


    # 4. Phishing


    A good number of phishing scams come in the form of text message and email campaigns
    that are meant to create a feeling of curiosity, compelling urgency, or even instill
    fear in potential casualties. The victims are then prodded into disclosing information
    that is deemed sensitive, following the links to malicious websites by clicking
    on them, or by downloading and opening unknown attachments containing malware.
    For instance, users of a particular online service can receive an email that alerts
    them of a policy violation that requires an action to be done immediately on their
    part. An example of such a move is a password change. Upon clicking the link,
    the user will be redirected to an illegitimate website that is almost identical
    in every aspect as the legitimate one, prompting an unsuspecting user to input
    his or her credentials to the site. That information is sent to the attacker once
    the form is submitted.


    # 5. Malware


    Attackers usually prefer to deploy malware in a users’ computer so that they are
    in a position to gain a foothold there. It is one of the most effective ways of
    gaining access. First, let us define what malware is. It can be said to represent
    various configurations of software that are harmful, for instance: ransomware
    and viruses. A malware present in your computer is capable of wreaking all sorts
    of havoc. This includes but is not limited to the following: monitoring and recording
    actions and keystrokes you perform on your computer, assuming control of your
    machine, and even sending your confidential data to the attacker’s base directly
    from your computer. There are many ways through which an attacker can deliver
    malware into your computer. However, for this to work, it will require that the
    user, on their own volition, take action to install the malware such as opening
    an attachment looking harmless or clicking a link to download a particular file
    all of which contain hidden malware in them.


    # 6. Session Hijacking and Man-in-the-Middle Attacks


    The computer you are using typically make numerous back-and-forth transactions
    with the servers around the world to inform them of your identity and the specific
    websites or services that you are requesting whenever you are on the internet.
    If all goes well, you will get all the information that you had requested from
    the web servers. This is the norm both when you are logging into a particular
    website with your credentials, that is, the username and password or just simply
    browsing. A unique session `ID` is given to the session between the remote web
    server and your computer. That `ID` needs to stay private. When an attacker comes
    into the picture, they can use the obtained session ID`s to hijack the session.
    That is made possible through capturing the `session ID` and feigning resemblance
    to the computer making a request. The attacker can log in the same way as an unsuspecting
    user would do and, as such, obtain access to crucial information on the webserver.
    We have several ways an attacker can employ to be able to steal the session ID.
    One of them is a cross-site scripting attack that we have discussed before. Alternatively,
    the attacker may decide to do session hijacking by placing themselves in between
    the remote server and the requesting computer. Here, they will be pretending to
    be the other party involved in the session. This way, they will be able to intercept
    information being transmitted from both directions. This is what we refer to as
    a man-in-the-middle attack.


    # 7. Password attack

