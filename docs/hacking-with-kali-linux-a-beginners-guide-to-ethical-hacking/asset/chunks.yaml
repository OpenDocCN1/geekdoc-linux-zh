- fmt: '

    The first scanning and reconnaissance step with Bluetooth is to check whether
    the Bluetooth adapter on the system that we are using is recognized and enabled
    so we can use it to scan for other devices.


    ## Scanning for Bluetooth Devices with hcitool

    Now that we know our adapter is up, we can use another tool in the BlueZ suite
    called `hcitool`, which is used to scan for other Bluetooth devices within range.


    With the simple `scan` command, we can find out Bluetooth devices that are transmitting
    using their discover beacons. That is, the devices set to their discovery mode.
    Most of the tools for Bluetooth hacking you are likely to encounter will be using
    these commands in a script. You should be able to create your tools from these
    commands using Python script or even bash script.


    ## Using the sdptool to Scanning for Services

    The service discovery protocol, `SDP` as it is commonly known, is a protocol of
    Bluetooth that is used in the searching of Bluetooth services (Bluetooth is a
    suite of services), and, helpfully, BlueZ provides the `sdptool` tool for browsing
    a device for the services it offers. It is also important to note that the device
    does not have to be in discovery mode to be scanned. The syntax is as follows:


    ```

    sdptool browse MACaddress

    ```


    ## Seeing Whether the Devices Are Reachable with l2ping

    Once we have gathered the MAC addresses of all nearby devices, we can send out
    pings to these devices, whether they are in discovery mode or not, to see whether
    they are in reach. This lets us know whether they are active and within range.
    To send out a ping, we use the `l2ping` command with the following syntax:


    ```

    l2ping MACaddress

    ```


    ## Summary

    Wireless devices represent the future of connectivity and hacking. Linux has developed
    specialized commands for scanning and connecting to Wi-Fi APs in the first step
    toward hacking those systems. The `aircrack-ng` suite of wireless hacking tools
    includes both `airmon-ng` and `airodump-ng`, which enable us to scan and gather
    vital information from in-range wireless devices. The BlueZ suite includes `hciconfig`,
    `hcitool`, and other tools capable of scanning and information gathering, which
    are necessary for hacking the Bluetooth devices within range. It also includes
    many other tools worth exploring.


    # Chapter 6: File and Directories Permissions


    ### Introduction

    Not every user of a single operating system should have the same level of access
    to files and directories. Like any professional or enterprise-level operating
    system, Linux has methods for securing file and directory access. This security
    system allows the system administrator, the root user, or the file owner to protect
    their files from unwanted access or tampering by granting select users’ permissions
    to read, write, or execute files. For each file and directory, we can specify
    the permission status for the file’s owner, for groups of users, and all other
    users. This is a necessity in a multiuser, enterprise-level operating system.
    The alternative would be quite chaotic. In this chapter, I will show you how to
    check for and change permissions on files and directories for select users, how
    to set default file and directory permissions, and how to set special permissions.
    Finally, you will see how a hacker’s understanding of permissions might help them
    exploit a system.


    ### Types of Users

    As you know, in Linux, the `root` user is all-powerful. The root user can do just
    about anything on the system. Other users on the system have more limited capabilities
    and permissions and seldom have the access that the root user has. These other
    users are usually collected into groups that generally share a similar function.
    In a commercial entity, these groups might be finance, engineering, sales, and
    so on. In an IT environment, these groups might include developers, network administrators,
    and database administrators. The idea is to put people with similar needs into
    a group that is granted relevant permissions; then each member of the group inherits
    the group permissions. This is primarily for the ease of administering permissions
    and, thus, security. The root user is part of the `root` group by default. Each
    new user on the system must be added to a group to inherit the permissions of
    that group.


    ### Granting Permissions

    Each file and directory must be allocated a particular level of permission for
    the different identities using it. The three levels of permission are listed hereunder:


    - `r` - Read permission. This grants permission only to open and view a file.

    - `w` - Write permission. This allows users to view and edit a file.

    - `x` - Execute permission. This will enable users to execute a file (This does
    not guarantee viewing or editing it).


    In this way, the root user can grant users a level of permission depending on
    what they need the files for. When a file is created, typically the user who created
    it is the owner of the file, and the owning group is the user’s current group.
    The owner of the file can grant various access privileges to it. Let us have a
    look at how to change permissions to pass ownership to individual users and groups.


    #### 1. Granting Ownership to an Individual User

    To move ownership of a file to a different user so that they can control permissions,
    we can use the `chown` (or change owner) command:


    ```

    chown John /tmp/johnsfile

    ```

    Here, we give the command, the name of the user we are giving ownership to, and
    then the location and name of the relevant file. This command grants the user
    account for `John` ownership of `johnsfile`.


    #### 2. Granting Ownership to a Group

