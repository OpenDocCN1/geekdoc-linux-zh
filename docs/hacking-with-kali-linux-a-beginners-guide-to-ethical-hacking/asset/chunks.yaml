  trans: '


    * 识别目标主机上可能运行的可用 UDP 和 TCP 网络服务。

    * 了解位于目标主机和用户之间的过滤系统。

    * 通过对其 IP 响应进行评估，发现正在使用的操作系统。

    * 分析特定目标主机的 TCP 序列号预测性，以实现对 TCP 欺骗和攻击序列的预测。


    网络扫描包含两个关键方面：漏洞扫描和网络端口扫描。后者是指通过网络向系统的特定端口号发送数据包的方法。其目标是发现特定系统中存在的网络服务。这是排查给定系统出现问题的极佳方法。通过这种方式，可以处理问题以确保系统安全。为了发现网络系统中存在的已知漏洞，我们使用一种名为“漏洞扫描”的方法。通过这种方法，我们可以识别操作系统和应用程序软件中的弱点。这些弱点通常被用来攻破计算机系统。漏洞扫描和网络端口扫描都可以认为是用于信息收集的技术。相反，当这些技术被匿名实体利用时，它们可能成为攻击的序奏。此类实体通常具有恶意意图。反向映射（Inverse
    mapping）是另一种网络扫描技术。它在收集未映射到活动主机的 IP 地址时非常有用。这样做有助于将注意力集中在值得关注的地址上，即可行的地址。信息收集可以通过三个阶段完成：


    1. 标记阶段（footprinting），

    2. 扫描阶段（scanning），以及

    3. 枚举阶段（enumeration）。


    因此，这意味着网络扫描是攻击者收集信息时所需的关键步骤之一。


    ## 使用 `ifconfig` 进行网络扫描


    `ifconfig` 命令是用于检查和与活动网络接口交互的基本工具之一。你只需在终端中输入 `ifconfig` 即可查询活动的网络连接。


    ## 使用 `iwconfig` 扫描无线网络


    如果你有一个无线适配器，可以使用 `iwconfig` 命令为无线黑客收集关键信息，例如适配器的 IP 地址、MAC 地址、其工作模式等。当你使用 `aircrackng`
    等无线黑客工具时，从该命令中获取的信息尤为重要。


    ## 修改你的网络信息


    能够更改 IP 地址和其他网络信息是一项实用的技能，因为它可以帮助你在伪装成受信任设备的同时访问其他网络。例如，在拒绝服务（DoS）攻击中，你可以欺骗你的
    IP，使攻击看起来来自另一个源，从而帮助你在进行取证分析时规避 IP 捕获。这在 Linux 中是一项相对简单的任务，通过 `ifconfig` 命令完成。


    ### 修改 IP 地址


    ![](img/rsrcSM.jpg)要更改 IP 地址，输入 `ifconfig`，然后输入要重新分配的接口以及想要分配给该接口的新 IP 地址。例如，要将
    IP 地址 `192.168.181.115` 分配给接口 `eth0`，你需要输入：


    ```

    Kali >-ifconfig eth0 192.168.181.115

    ```


    当你正确操作时，Linux 将返回命令行提示符且没有任何输出。这是好事！然后，当你再次使用 `ifconfig` 检查网络连接时，你应该看到你的 IP 地址已更改为刚刚分配的新
    IP。


    ### 修改子网掩码和广播地址


    你也可以使用 `ifconfig` 命令更改网络掩码（netmask）和广播地址。例如，如果你想为同一个 `eth0` 接口分配 `255.255.0.0`
    的子网掩码和 `192.168.1.255` 的广播地址，你应该输入：


    ```

    Kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    ```


    再次，如果你操作得完全正确，Linux 会返回一个新的命令行提示符。现在再次输入 `ifconfig` 以验证每个参数是否已相应更改。


    ### 欺骗 MAC 地址


    你也可以使用 `ifconfig` 更改 MAC 地址。MAC 地址是全球唯一的，通常被用作安全措施来防止黑客进入网络，或用于追踪他们。将 MAC 地址更改为欺骗性的不同
    MAC 地址几乎是易举的，并且可以消除这些安全措施。因此，它是绕过网络访问控制的一种有效技术。要欺骗 MAC 地址，使用 `ifconfig` 命令的 `down`
    选项关闭接口（在本例中为 `eth0`）。然后输入 `ifconfig` 命令加上接口名称（硬件用 `hw`，以太网用 `ether`）以及新的欺骗 MAC
    地址。最后使用 `up` 选项启用接口使更改生效。


    ## IP 地址分配


    Linux 拥有一个运行后台进程（守护进程）的 DHCP 服务器，该进程称为 `DHCPD` 或 DHCP 守护进程。DHCP 服务器将为子网上的所有系统分配
    IP 地址。它还会记录在任何时刻哪个 IP 地址分配给了哪台机器。这使其成为取证分析师在攻击后追踪黑客的极佳资源。因此，理解 DHCP 服务器的工作原理很有用。通常，从局域网连接互联网必须拥有
    DHCP 分配的 IP。因此，在设置静态 IP 地址后，必须返回并获取一个新的 DHCP 分配的 IP 地址。要做到这一点，你可以随时重启系统，但我将向你展示如何在关闭重启系统的情况下获取新的
    DHCP。要向 DHCP 请求 IP 地址，只需使用 `dhclient` 调用 DHCP 服务器，后跟你想要分配地址的接口。不同的 Linux 发行版使用不同的
    DHCP 客户端。例如，Kali 基于 Debian，后者使用 `dhclient`。


    ## 操纵域名系统 (DNS)


    黑客可以在目标的域名系统（DNS）中找到宝库般信息。DNS 是互联网的关键组件，尽管它的设计初衷是将域名翻译为 IP 地址，但黑客可以利用它获取有关目标的信息。


    ### 使用 `dig` 检查 DNS


    DNS 是将像 `google.com` 这样的域名翻译为相应 IP 地址的服务。通过这种方式，你的系统才知道如何找到它。如果没有 DNS，我们需要记住经常访问的网站的成千上万
    IP 地址。`dig` 是任何有志的黑客需要知道的命令之一。它提供了一种收集有关目标域名 DNS 信息的方法。存储的 DNS 信息可以是攻击前获取的关键早期侦察信息。这些信息可能包括目标名称服务器的
    IP 地址（将目标名称翻译为 IP 地址的服务器）、目标的邮件服务器，以及可能的任何子域名和 IP 地址。你还可以通过添加 `mx` 选项（`mx` 是 mail
    exchange server 的缩写）使用 `dig` 命令获取连接到域名的邮件服务器信息。这些信息对于针对邮件系统的攻击至关重要。


    ### 修改你的 DNS 服务器


