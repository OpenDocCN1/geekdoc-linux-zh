    # Malware Attack


    A malicious piece of software is unwanted software that, without your consent,
    is installed in your system. Such software is known to attach themselves to a
    legitimate software or code, giving it a platform to propagate itself. Malware
    can persist in applications we use on a day to day basis or can even replicate
    itself over the Internet. Let us discuss the common types of malware in existence
    today:


    1) **Macro viruses** — They are known to infect commonly used programs. For instance,
    `Microsoft Excel`, `Microsoft Word`, and so on. These types of infections bind
    themselves to the initialization sequence of the applications. Upon the opening
    of an application, the macro virus will affect instructions before transferring
    control to the application. Just like many other viruses, they are capable of
    replication through attachment to other codes or programs running in the computer
    system.


    2) **File infectors** — These ones typically bind themselves onto an executable
    code. Once the code is loaded, the virus will be installed. A different type of
    file infector many a time associates itself with a file on the computer through
    the creation of a virus file that possesses a similar name but is appended with
    a `.exe` extension. Upon opening the file, the virus code will execute.


    3) **System record/boot-record infectors** — they work just like the file infectors
    only that they attach themselves to the master boot record that is found on hard
    disks. They will load viruses into the memory of the system once the system is
    started. From there, the infectors will propagate to other computers or other
    disks.


    4) **Polymorphic viruses** — These normally operating by way of concealing themselves
    by using varying cycles of encryption and decryption. The virus that is encrypted
    together with its associated mutation engine is, at the onset, decrypted using
    a decryption program. After decryption, it will proceed to infect a small portion
    of code. The mutation engine will be used to build a new decryption routine that
    the virus will encrypt. It is this package of mutation engine and virus that is
    encrypted that will attach itself to a new code. The process is repetitive. It
    is quite challenging to detect such viruses. They possess a high level of entropy
    due to the numerous alterations to their source code. Utilities like the `Process
    Hacker` or most anti-virus software can detect and isolate them using this feature.


    5) **Stealth viruses** — These are viruses that capture the functions in a system
    so that they can hide. This is made possible by the stealth viruses interfering
    with software that detect malware. The result here is that the software will wrongly
    find an infected area as being uninfected. Stealth viruses hide any size increases
    of a file that is infected or sometimes even alter the infected file’s time and
    date of last modification.


    6) **Trojans** — Famously known as Trojan horses, these are programs that conceal
    themselves within a commonly used but different program. A trojan horse, in most
    cases, carries with it has a malicious function. Trojans, unlike viruses, do not
    self-replicate. Besides launching attacks on target systems, Trojans can create
    back doors that may be used by attackers to exploit a system. A Trojan can be
    programmed, for instance, to open a port that is high-numbered through which a
    hacker can listen and even carry out an attack in the future.


    7) **Logic bombs** — This type of malware usually is bound to an application.
    For it to work, a specific occurrence has to trigger it. That may be a predetermined
    logical condition, a set time, a specified date, and so on.


    8) **Worms** — This is a program that is self-contained and can propagate across
    computers and networks. This implies that they do not attach themselves to a host
    file viruses. They are frequently spread through attachments that are sent on
    emails. A user who downloads and opens the attachment unknowingly activates the
    worms. One exploit of worm comprises of the worm replicating to every contact
    that is present on the email address of the infected computers. They can also
    spread across the internet resulting in the overloading of email servers. This
    scenario leads to a denial-of-service to the various nodes that are present on
    the network.


    9) **Droppers** — These are programs that can be used to install viruses on victims’
    computers. Many a time, the dropper itself does not usually have malicious code.
    This implies that they are therefore not detectable by software responsible for
    virus-scanning. A dropper, however, can connect to the internet where it can download
    updates to an existing virus software resident on the system that has been compromised.


    10) **Ransomware** — This form of malware that works by preventing access to the
    targets’ data. Sometimes, ransomware threatens typically to delete the data or
    publish unless the owner of the ransomware is paid. We have those that are easy
    to reverse for a knowledgeable person and those that are more advanced. These
    use a cryptoviral extortion technique. The technique does encryption of the victim’s
    files. That makes it impossible to recover them unless the victim obtains a decryption
    key.


    11) **Adware** — companies use this is a software application for purposes of
    marketing. Whenever any program is running, you will see advertising banners being
    displayed. Adware can be downloaded to your system automatically when you browse
    the website, which can be viewed through pop-up windows or via bars that automatically
    come up on the computer screen.


    12) **Spyware** — A spyware is a program that can be installed on a system primarily
    to gather information about computers, users, and even their browsing mannerisms.
    Spyware can track almost everything you do, both offline and online, without your
    knowledge. The collected data is then transmitted to a remote user. Just like
    droppers, spyware can connect to the internet where it can download other malicious
    programs and install them on the victims’ computer systems. This program works
    in the same way as adware with an exception that it usually comes as a separate
    stand-alone program. It is installed when you are doing an install of a freeware
    application, and in most cases, it happens without your knowledge.


    # MAC Spoofing


    ![](rsrc80.jpg)


    We can define it as an unsanctioned alteration of a devices’ MAC address. Simply
    stated, it is the falsification of a MAC address of a network device that is within
    a given computer network. This way, a malicious user can use fake identification,
    that is, the MAC address, to pass off as if it were one of your own devices and,
    subsequently, carry out an interception of communication being exchanged in the
    network. The falsification of a devices’ MAC address can be done in the following
    ways:


    *   A simple MAC address change

    *   Creating a MAC address in a random fashion

    *   Using different manufacturers’ MAC address

    *   Configuring a new MAC address while keeping the current manufacturer intact
    and then activating it automatically.


    ## Reasons for Carrying out MAC Spoofing


    MAC spoofing can be carried out both for legitimate and non-legitimate reasons.
    The latter can be taking over another computer’s identity, and the former can
    be used in the creation of wireless connections to a network. A different example
    of the legitimate use of MAC spoofing is the modification of the function of a
    single computer from a router to the computer and back to router through sharing
    a single MAC address.


    *   Non-Legitimate Uses of MAC Spoofing

