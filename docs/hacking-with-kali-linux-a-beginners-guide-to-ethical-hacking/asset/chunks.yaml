- fmt: "\nThe commonly used method of authentication of users to any information system\
    \ is the use of passwords. This means that stealing passwords is an effective\
    \ approach that can be used in the attack. To do this, all it takes is to look\
    \ around a targets’ desk then carry out a sniffing operation on the connection.\
    \ This will enable you to obtain unencrypted passwords. Here, one can use social\
    \ engineering tactics to gain access to a database containing passwords or do\
    \ outright guesswork to get the password. This can be carried out in either a\
    \ random or systematic fashion. \n\nWe have the following types of password attacks,\
    \ brute-force attacks, and dictionary-based attacks. In the former type of attack,\
    \ different passwords are tried randomly with the hope one of the combinations\
    \ will work. An attacker can apply some logic to this procedure, such as trying\
    \ passwords that relate to a users’ name, hobbies, job title, and so on. On the\
    \ other hand, a dictionary-based attack utilizes common passwords found in a dictionary\
    \ in their attempt to access a target's network or computer. A commonly used technique\
    \ is whereby an encrypted file containing passwords is copied, and then similar\
    \ encryption is applied to the password dictionary. The passwords are then compared.\
    \ To safeguard oneself against a dictionary or a brute-force attack, all that\
    \ is required is to put in place an account lockout policy. This will mean that\
    \ a particular account will be locked after exceeding a specified number of attempted\
    \ logins.\n\n## 8. Eavesdropping attack\n\nThis attack is carried out by intercepting\
    \ the traffic on the network. Through the use of eavesdropping, a malicious user\
    \ will be able to get access to credit card numbers, passwords alongside other\
    \ information that is deemed to be confidential in which the user may be exchanged\
    \ over the network. We can either have a passive or an active eavesdropping attack.\
    \ Let us briefly look at what they are.\n\n### Passive eavesdropping\nIn this\
    \ mode of eavesdropping, a malicious user will attempt to obtain information by\
    \ way of listening in on the messages being transmitted over the network.\n\n\
    ### Active eavesdropping\nInformation being transmitted is actively captured by\
    \ way of an attacker disguising as if they were a friendly unit. This is carried\
    \ out through querying the data transmitters. We call this scanning, tampering,\
    \ or simply probing.\n\nIt is prudent to note that the detection of passive eavesdropping\
    \ attacks is crucial. This is because it is a precursor to the active attacks.\
    \ Data encryption is the best countermeasure for eavesdropping.\n\n## What Are\
    \ the Types of Hackers?\n\nLet us differentiate the different types of hackers\
    \ we are likely to encounter below. You will notice that each category of hackers\
    \ possesses different objectives. We will also look at the various roles and goals\
    \ each of the hackers has.\n\n### a) Black Hat Hacker\nCommonly known as black\
    \ hats, they usually have extensive knowledge regarding the various methods about\
    \ bypassing security protocols and breaking into computer networks. Malware is\
    \ generally written by black hats to help gain access to these systems. A black\
    \ hats’ main goal is usually to make a personal or financial gain. Some of them\
    \ do carry out cyber espionage while some do it for fun. This category of hackers\
    \ ranges from inexperienced amateurs whose idea of fun is spreading malware, to\
    \ those that are experienced whose objectives are to embezzle privileged data.\
    \ Many a time, it is financial information they seek. They are also interested\
    \ in harvesting login credentials and personal information. Besides stealing data,\
    \ they usually alter or sometimes destroy the data they have obtained if it does\
    \ not serve their purpose.\n\n### b) Grey Hat Hacker\nThese can be said to be\
    \ neither the bad or good guys! Grey hats are neither white nor black. This category\
    \ of hackers has the characteristics of both black hats and white hats. Most of\
    \ the time, grey hats will attempt to unearth, without the permission or knowledge\
    \ of the owners, vulnerabilities that are present in a system. If they discover\
    \ an issue, they will report the same to the owners. Most of the time, they will\
    \ ask for some financial compensation so that they can fix the problem. In the\
    \ ‘unfortunate’ event that the owner does not comply, they will go ahead and post\
    \ their exploits on the internet for everyone to see. Grey hats’ intentions are\
    \ not necessarily malicious; all they want is to make some dollars out of their\
    \ discoveries. After finding vulnerabilities, Grey hats will not usually exploit\
    \ the vulnerabilities that they have unearthed. What makes this grey hacking illegal\
    \ is the fact that no prior permission was sought from the owners of a particular\
    \ system the hackers targeted. For the readers seeking to become hackers, it is\
    \ essential to note that not all hackers are created equal. We have white hat\
    \ hackers who are always trying to uncover and fix vulnerabilities before black\
    \ hats find them. This way, we have a lot fewer cyber-crimes now.\n\n### c) White\
    \ Hat Hacker\nUnlike the two previous types of hackers, white hat hackers are\
    \ those that put their skills to good use. Their intentions are benevolent. These\
    \ are the good guys. This group of hackers is commonly referred to as ethical\
    \ hackers. They may be an organizations’ employees or work as contractors in information\
    \ security companies. They usually try to discover vulnerabilities in a system\
    \ through hacking. The methods used in the hacking process are similar to those\
    \ that black hats use, but there is one differentiating aspect. White hats first\
    \ seek the owners’ consent. This makes the hacking legal. White hat hackers usually\
    \ carry out penetration tests; they do assess vulnerabilities and conduct in-place\
    \ testing of a company's’ security systems. We even have certifications, training,\
    \ courses, and conferences that are hosted ethical hacking.\n\n## What Is Ethical\
    \ Hacking?!\n\nWe define ethical hacking as an approved implementation whereby\
    \ there is bypassing of a systems’ security that helps in the identification of\
    \ threats and potential data breaches in a network. In this scenario, an organization\
    \ that owns a particular network or system grants permission to cybersecurity\
    \ experts to carry out such activities to test the defenses a system has put in\
    \ place. This, therefore, implies that, unlike malicious hacking, ethical hacking\
    \ is a legal process that has been planned and approved. The main goal of an ethical\
    \ hacker is to scrutinize a particular network or system for weak points. It is\
    \ via these weak points that malicious hackers use in their exploitation or destruction.\n\
    \nWhile at it, they do gather and perform an analysis of the information. This\
    \ will help them in the planning process of the organization's IT infrastructure.\
    \ In doing so, the security footprint will be significantly improved in a manner\
    \ that it can withstand or divert attacks. The demand for ethical hacking has\
    \ witnessed a dramatic increase in recent times due to the growth of the information\
    \ security sector. Ethical hacking is also known as white hat hacking. Ethical\
    \ hacking is the practice of attempting to infiltrate and exploit a system to\
    \ find out its weaknesses so that it can be better secured. We can categorize\
    \ it into two broad classes. These are, penetration testing; this is mostly for\
    \ a legitimate information security firm and; hacking by intelligence agencies\
    \ or a nation’s military. There is a rising demand for hacking in both areas.\n\
    \n*   Penetration Testing\n"
