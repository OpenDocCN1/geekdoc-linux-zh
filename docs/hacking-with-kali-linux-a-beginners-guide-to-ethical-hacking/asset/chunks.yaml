    In Linux, whether you’re working from the command line or the GUI, you’re working
    within a shell. All commands that run are executed from within that shell, even
    if they run from the graphical interface. When you execute a command, the shell
    waits until the command is completed before offering another command prompt. At
    times, you may want a process to run in the background, rather than having to
    wait for it to complete in that terminal. For instance, say we want to work on
    a script in a text editor and so have called our text editor (Leafpad for instance)
    by entering the following:


    ```bash

    kali >leafpad newscript

    ```


    In this case, the `bash` shell will open the `Leafpad` text editor to create `newscript`.
    While we work in the text editor, the terminal is occupied with running the text
    editor. If we return to the terminal, we should see that it is running our text
    editor and that we have no new prompt to allow us to enter more commands.


    ### Moving a Process to the Foreground


    If you want to move a process running in the background to the foreground, you
    can use the `fg` (foreground) command. The `fg` command requires the `PID` of
    the process you want to return to the front, as shown next:


    ```bash

    kali >fg 1234

    ```


    If you do not know what the `PID` is, you can utilize `ps` to find it.


    ### Scheduling Processes


    Both Linux system administrators and hackers often need to schedule processes
    to run at a particular time of day. A system administrator might want to schedule
    a system backup to run every Sunday at 1 AM, for instance. A hacker might want
    to set a script to run to perform reconnaissance on a specified basis, finding
    open ports or vulnerabilities. In Linux, you can accomplish this in at least two
    ways: with `crond` and `at`. The `at` command is a daemon, that is, a background
    process, useful for scheduling a job to run once at some point in the future.
    The `crond` is more suited for programming tasks to occur at intervals such as
    every day, week, or month.


    ### OpenSSH and the Raspberry Pi


    `SSH` is an acronym for Secure Shell and is basically what enables us to connect
    securely to a terminal on a remote system, a replacement for the insecure `telnet`
    that was so common years ago. When we’re building a web server, `SSH` enables
    us to create an access list (a list of users who can use this service), authenticate
    users with encrypted passwords, and encrypt all communication. This reduces the
    chance of unwanted users using the remote terminal (due to the added authentication
    process) or intercepting our communication (due to encryption). Probably the most
    widely used Linux SSH service is `OpenSSH`, which is installed on nearly every
    Linux distribution, including Kali. System administrators often use `SSH` to manage
    remote systems, and hackers often use `SSH` to connect to compromised remote systems,
    so we’ll do the same here.


    In this example, we use `SSH` to set up a remote Raspberry Pi system for spying,
    something I call the “Raspberry Spy Pi.” For this, you’ll need a Raspberry Pi
    and the attendant Raspberry Pi camera module. Before we do that, though, start
    `OpenSSH` on your Kali system with the now-familiar command:


    ```bash

    kali >service ssh start

    ```


    We shall be using `SSH` to build and control a remote spying Raspberry Pi. If
    you are not already familiar with it, the Raspberry Pi is a tiny but powerful,
    credit card-sized computer that works great as a remote spying tool. We will employ
    a Raspberry Pi with a camera module to use as a remote spying device. You can
    purchase a Raspberry Pi at nearly any electronics retailer, including Amazon.
    Here, we are going to use the Raspberry Spy Pi on the same network as our Kali
    system, which allows us to use private, internal IP addresses. Of course, when
    hacking in the real world, you would probably want to set it up on another remote
    network, but that would be beyond the scope of this book.


    ### Setting up the Raspberry Pi

