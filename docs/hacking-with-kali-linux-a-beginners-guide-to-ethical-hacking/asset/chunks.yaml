    Over the years, you may have witnessed that windows is slowing down and even stagnating
    in some departments. Since the advent of the internet, `Linux/Unix` has and is
    still the choice operating system for web servers primarily because of its reliability,
    robustness, and stability. To date, almost two-thirds of web servers utilize Linux
    operating systems. Examples of uses of the `Linux` kernel are Citrix applications,
    VMware, embedded systems in switches and routers, mobile devices, and so on. It
    has been said that the future of computing is with mobile devices, including but
    not limited to phones and tablets. `Android`, which is used in most phones, is
    `Linux`, while `iOS` is a `Unix` kernel. It is, therefore, difficult to see how
    the future is not `Linux/Unix`. Microsoft Windows commands a meager market share
    of around 7 percent. The rest of the market is either `Linux` or `Unix`. In summary,
    the future lies with `Linux/Unix`.


    # What Is Kali Linux?


    Kali Linux is a distribution of the `Debian` family. It was designed and developed
    solely for Security Auditing and Penetration Testing. The distro comprises hundreds
    of tools and utilities that are focused on information security tasks, which may
    include Reverse Engineering, Penetration Testing, Computer Forensics, and Security
    research. Offensive Security is the information security organization behind Kali
    Linux. It developed, funds, and maintains Kali Linux.


    This distribution was initially launched in March 2013 to be a total rebuild of
    `BackTrack Linux`, top to bottom. It adhered to `Debian` development standards
    a hundred percent. Kali Linux boasts of over 600 tools that can be used for penetration
    testing. After a thorough review of `BackTrack Linux`, some tools that did not
    work or were in duplicate were eliminated. From the Kali Tools site, lets us look
    at some of the details:


    - **Kali Linux will always be free**: Just like `BackTrack`, `kali` is free of
    charge and always will be. This implies that you are not going to pay for it at
    any time now or in the future.

    - **It is Open source**: The source code Kali Linux uses is available to everyone
    that wants to improve, modify, or rebuild packages to adapt them to their specific
    requirements.

    - **Kali complies with FHS**: The distribution follows the Filesystem Hierarchy
    Standard. The standards help the users of `Linux` to locate support files, binaries,
    libraries, and so on seamlessly.

    - **Support a wide range of wireless devices**: The system has been designed with
    multiple platforms to support wireless interfaces. It can run on a wide range
    of hardware.

    - **The kernel is customized and is patched for injection**: Latest injection
    patches are included in the Kali Linux kernel.

    - **It was created in an environment that is secure**: The team tasked with the
    development of Kali is a small group of individuals that are trusted to commit
    packages and interact with the repositories. Secure protocols are used in these
    processes.

    - **GPG signed repositories and packages**: All packages in Kali Linux are usually
    signed by the individual developers. It is these developers that are responsible
    for the packages. The packages are subsequently signed by the repositories as
    well.

    - **Support for Multiple languages**: Most penetration tools and utilities are
    often written in English. Kali, notwithstanding, offers true multilingual support.
    Users are therefore able to operate in their native languages. Isn’t that a great
    thing!

    - **Kali is easily customizable**: All users can modify Kali to their requirements
    and preferences.

    - **Kali Linux supports both ARMHF and ARMEL**: The Kali Linux `ARM` supports
    fully working installations for both `ARMEL` and `ARMHF` systems. Kali Linux is
    available on a wide range of ARM devices and has ARM repositories integrated with
    the mainline distribution, so tools for ARM are updated in conjunction with the
    rest of the distribution.


    # Downloading Kali Linux


    Before I take you down the road towards being a hacker, you will first be required
    to download and install Kali Linux on your computer. This is the distribution
    of `Linux` that we shall be using throughout this book. That can be done from
    `https://www.kali.org/`. Navigate to the home page and hit the Downloads link
    located at the top of the page. It is important that the right download is selected.


    # The procedure of Installing Kali and Setting Up Kali Linux


    To start us off, you will need to boot using your preferred medium of installation.
    You should be greeted with the Kali Boot screen, as shown below. Choose either
    `Text-Mode` or `Graphical install`. In this example, we chose a `GUI` install.


    ![](rsrcBP.jpg)


    Choose your language preference together with your country location. Also, you
    will be prompted to select your preferred keyboard layout.![](rsrcBW.jpg)


    Select your location, geographic that is.![](rsrcC1.jpg)


    The installer will copy the image to your hard disk, probe your network interfaces,
    and then prompt you to enter a hostname for your system. In the example below,
    we’ve entered `kali` as our hostname.![](rsrcC6.jpg)


    You may optionally provide a default domain name for this system to use.![](rsrcCB.jpg)


    Next, provide a full name for a non-root user for the system.![](rsrcCG.jpg)


    A default user ID will be created, based on the full name you provided. You can
    change this if you like.![](rsrcCN.jpg)


    After that, pick an appropriate time zone.![](rsrcCU.jpg)


    Next, you will see something similar to the picture below. Select appropriately.![](rsrcCZ.jpg)


    Choose the disk you want to be partitioned.![](rsrcD4.jpg)


    Continue to the next step below, selecting a choice depending on your needs.![](rsrcD9.jpg)


    Next, hit the Continue button.![](rsrcDE.jpg)


    The next step requires you to carry out a configuration of network mirrors.![](rsrcDJ.jpg)


    Next, install `GRUB`.![](rsrcDR.jpg)


    Finally, click Continue to reboot into your new Kali installation.![](rsrcDX.jpg)


    # Chapter 4: Basics of Kali


    ## Introduction


    We have said previously that Kali Linux is a `Debian` based distribution for Ethical
    Hackers, Penetration Testers, Security Researchers and Enthusiasts. It is a stable,
    updated, enterprise-ready, open-source, and well-maintained distribution by Offensive
    Security. Kali Linux default desktop environment is `GNOME`, but it also offers
    a variety of other desktop environments including `KDE`, `MATE`, `LXDE`, and others.
    It can be installed on various types of systems, including laptops, Servers, ARM
    devices, and Cloud. It also has a portable version for android devices called
    `NetHunter`, which can be used within the Android operating system and comes with
    pre-installed tools and scripts that offer portability while doing security auditing
    or penetration testing.


    ## Why You Should Use Kali Linux


    As we have said before Kali Linux comes with just about every tool pre-installed
    that can be used for any of the above purposes. It is for this reason that Security
    Auditors, Forensics Investigators, Penetration Testers, and Researchers prefer
    it.


    Kali can be used in the breaking of WiFi networks, to hack websites and networks,
    to run Open Source Intelligence on an entity among others. Kali Linux possesses
    tools that can be used for forensic investigation besides ethical hacking. This
    is becoming an equally essential branch of security that primarily collects evidence,
    analyze it, and uses the results to backtrack Cyber Criminals. Forensic Investigation
    makes it possible to locate and eradicate malicious effects emanating from malicious
    activities. It also comes in handy in the calculation and management of loss that
    occurs after a Cyber Attack. A key feature in Kali is the stealth Live mode mostly
    used in forensics and that it does not leave traces (fingerprints and footprints)
    on a host’s system.


    ## The Terminal


    ![](rsrcEC.jpg)


    The very initial step in using Kali is to open the terminal, which is the command-line
    interface we’ll use in this book. In Kali Linux, you’ll find the icon for the
    terminal at the bottom of the desktop. Double-click this icon to open the terminal
    or press `CTRL+ALT+T`. The terminal opens the command line environment, known
    as the `shell`, which enables you to run commands on the underlying operating
    systems and write scripts. Although `Linux` has many different shell environments,
    the most popular is the `bash` shell, which is also the default shell in Kali
    and many other Linux distributions. To change your password, you can use the command
    `passwd`.


    ## Basic Commands in Linux


    To begin, let’s look at some basic commands that will help you get up and running
    in Linux.

