- fmt: "\n- For encryption of data found in the application layer.\n- Securing routers\
    \ transmitting data over the internet.\n- `IPsec` provides us with authentication\
    \ without there being any encryption.\n- It does the safeguarding of data on the\
    \ network through the creation of circuits using `IPsec` tunneling. This works\
    \ just like the Virtual Private Network.\n\n### IP Security Components\nBelow\
    \ are some of the components that comprise an IPsec:\n\n1. Internet Key Exchange\
    \ (`IKE`) – This is a protocol for network security that has been designed to\
    \ exchange encryption keys dynamically as well as bypass the Security Association\
    \ (`SA`) between two devices. `SA` is used for the establishment of security attributes\
    \ that are shared between any two network elements. These attributes are what\
    \ support secure communications. Additionally, `IKE` offers protection to contents\
    \ of messages plus an open frame that can be used for the implementation of standard\
    \ algorithms, for instance, `MD5` and `SHA`.\n2. Encapsulating Security Payload\
    \ (`ESP`) – This is used to ensure data integrity, authentication, anti-replay,\
    \ and encryption. `ESP` also does payload authentication.\n3. Authentication Header\
    \ (`AH`) – `IPsec` uses an authentication header to ensure there is data integrity,\
    \ anti-replay, and authentication. An authentication header, however, does not\
    \ offer encryption. The anti-replay protection function is used to guard against\
    \ unauthorized packet transmission, but it does not keep the data confidential.\n\
    \n### The Operation of IP Security\n\n1. First, a host will check to see if a\
    \ packet needs to be send using `IPsec` or not. It is the traffic of the packets\
    \ that trigger the security policy on their own.\n2. Phase 1 of the internet key\
    \ exchange begins with the two hosts that are utilizing `IPsec` authenticating\
    \ themselves to each other. That will start a secure channel. Here, we have two\
    \ modes:\n    - The Main mode which is used for the provision of the greater security\
    \ and;\n    - The Aggressive mode that makes a host be able to create an `IPsec`\
    \ circuit expeditiously.\n3. Using the above channel (established in step 2),\
    \ negotiation on the manner in which the `IP` circuit will encrypt data across\
    \ the `IP` circuit will be done.\n4. After that, the Phase 2 internet key exchange\
    \ happens over the secure channel that was negotiated.\n5. Data exchanged is then\
    \ carried out over the newly established `IPsec` encrypted tunnel. Encryption\
    \ and decryption of packets is carried out by the hosts through `IPsec` `SAs`.\n\
    6. Upon the completion of communication, or time-out of a session between the\
    \ hosts, the `IPsec` tunnel will be terminated. Both the hosts will discard the\
    \ keys.\n\n# Chapter 9: Cryptography\n\nIntroduction\nAs hackers, we are often\
    \ faced with the hurdle of cryptography and encryption. In some cases, we use\
    \ it to hide our actions and messages. Many applications and protocols use encryption\
    \ to maintain the confidentiality and integrity of data. To be able to crack passwords\
    \ and encrypted protocols such as `SSL` and wireless, you need to be at least\
    \ familiar with the concepts and terminology of cryptography and encryption. To\
    \ many new hackers, all the ideas and terminology of cryptography can be a bit\
    \ overwhelming and opaque. With this brief overview for the newcomer, I hope to\
    \ lift the fog that shrouds this subject and shed a tiny bit of light on cryptography.\n\
    \nThere are so much mathematics and algorithms in encryption, and that is a topic\
    \ we would not rather venture into at this point. The explanations will be quite\
    \ simple and surprisingly easy to understand. We are going to look at the basic\
    \ concepts and terminologies so that you will be in a position to know some related\
    \ topics whenever they come up. These include wireless cracking, password cracking,\
    \ encryption technologies, and hashing. My intention, however, is not to make\
    \ a cryptographer out of you here. It is a skill that requires time to hone, but\
    \ to help familiarize the beginner with the terms and concepts of cryptography\
    \ to help you become a credible hacker.\n\n### A Word About Key Size\nKey size\
    \ matters a lot when it comes to cryptography. More secure encryptions have larger\
    \ keys. A 256-bit key `AES` is therefore much stronger as compared to a 128-bit\
    \ key `AES`. That means it is also much difficult to break it. It suffices to\
    \ say that in encryption that employs the use of a similar algorithm, the larger\
    \ the size of the key, the stronger the encryption will be. However, note that\
    \ the encryptions’ strength is based on the key size and the specifics of the\
    \ algorithm as well. This, therefore, does not imply that larger keys denote stronger\
    \ encryption between the various encryption algorithms. Let's get started by breaking\
    \ encryption into categories.\n\n### Types of Cryptography\nBelow are the kinds\
    \ of encryptions we are going to concentrate on in this book.\n\n- Asymmetric\
    \ Encryption\n- Symmetric Encryption\n\nIn this book, however, we are going to\
    \ focus on symmetric and asymmetric encryption.\n\n### Symmetric Cryptography\n\
    Here, both the sender and receiver possess similar keys. Symmetric cryptography\
    \ is undoubtedly the commonly used form of cryptography today. Picture this; you\
    \ encrypt a message using a password. Supposing I have the same password, I will\
    \ be able to access the encrypted message. Any other person will not read that\
    \ message. See how easy that is! This type of cryptography is high-speed and is\
    \ well suited for streaming applications or bulk storage. A major stumbling block\
    \ with this method of cryptography is the key exchange. As in the example we have\
    \ seen above, if we have two ends requiring similar keys, what they need is another\
    \ third channel that can be used to exchange the keys. This is where symmetric\
    \ cryptography has its biggest weakness. Assume the entities intending to exchange\
    \ messages are miles apart, how then, can the key be exchanged. As you may already\
    \ be aware, the aspect of confidentiality arises. The entities can decide to exchange\
    \ the key via email, mail, telephone, and so on. That makes it possible to intercept\
    \ the key that is being exchanged, and as such, the encryptions’ confidentiality\
    \ will be compromised. We have many symmetric algorithms currently in use. The\
    \ common ones are briefly discussed below.\n\n1. `DES` – Developed by IBM, `DES`\
    \ was among the pioneer encryption schemes. Later own, `DES` was discovered to\
    \ possess flaws and was breakable as well. It was `DES` encryption that was used\
    \ in hashing early systems of `LANMAN` originally (pre-2000).\n2. `3DES` – It\
    \ is the flaws in `DES` that occasioned the development of this encryption algorithm.\
    \ It works by a triple application of the `DES` hence its name. That makes it\
    \ a bit more secure when compared to `DES`.\n3. `AES` – In full, `AES` stands\
    \ for Advanced Encryption Standard. Cryptographically speaking, `AES` is not an\
    \ encryption algorithm by itself. It was `NIST` that developed `AES`. It is one\
    \ of the most robust encryptions in use today. `AES` utilizes the 128-, 196-,\
    \ and 256-bit key. Since 2001, `AES` has been occupied by the `Rijndael` algorithm.\
    \ This standard is commonly used in `SSL/TLS`, `WPA2`, among other protocols that\
    \ need speed and confidentiality.\n4. `RC4` - This does encryption of each bit\
    \ or byte instead of a single block of information. This is called streaming.\
    \ `RC4` was designed and created by `RSAs’` `Rivest Ronald`. This method of encryption\
    \ is commonly used in `WEP` and `VoIP` applications.\n5. `Blowfish` – `Blowfish`\
    \ utilizes a key with a varying length. It is a very secure encryption scheme.\
    \ It is additionally open-source, and as such, anyone can be able to use it without\
    \ a license.\n6. `Twofish` – It is similar to `Blowfish`. It, however, possesses\
    \ advanced capabilities such as the use of the 128 or 256-bit key. `Twofish` was,\
    \ at some point, a strong contender for `AES`. Examples of applications using\
    \ `Twofish` include `cryptcat` and `OpenPGP`, among others. Additionally, it is\
    \ not patented, just like `Twofish`.\n"
