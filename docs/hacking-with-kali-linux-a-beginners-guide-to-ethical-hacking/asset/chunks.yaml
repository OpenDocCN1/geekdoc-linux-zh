    ping，我们使用以下语法的 `l2ping` 命令：


    ```

    l2ping MACaddress

    ```


    ## 总结

    无线设备代表了连接和黑客技术的未来。在黑进这些系统的第一步中，Linux 开发了用于扫描和连接 Wi-Fi AP 的专用命令`aircrack-ng` 无线黑客工具包包含了
    `airmon-ng` 和 `airodump-ng`，它们使能够扫描并收集范围内无线设备的关键信息。BlueZ 套件包含了 `hciconfig`、`hcitool`
    以及其他能够扫描和收集信息的工具，这些工具对于黑进范围内的蓝牙设备是必要的。它还包含了许多值得探索的工具。


    # 第 6 章：文件和目录权限


    ### 引言

    并不是每个操作系统的每个用户都应该对文件和目录具有相同级别的访问权限。像任何专业或企业级操作系统一样，Linux 都有保护文件和目录访问的方法。该安全系统允许系统管理员、root
    用户或文件所有者通过授予特定用户读取、写入或执行文件的权限，来保护其文件免受意外的访问或篡改。对于每个文件和目录，我们可以为文件所有者、用户组以及所有其他用户指定权限状态。这在多用户企业级操作系统中是必要的。否则，情况将变得非常混乱。在本章中，我将向你展示如何检查和更改特定用户的文件和目录权限，如何设置默认的文件和目录权限，以及如何设置特殊权限。最后，你将看到黑客对权限的理解如何帮助他们利用系统。


    ### 用户类型

    如你所知，在 Linux 中，`root` 用户是全能的。root 用户几乎可以在系统上做任何事情。系统上的其他用户能力和权限受到限制，很少拥有 root
    用户所拥有的访问权限。这些其他用户通常被归入具有相似功能的组中。在商业实体中，这些组可能是财务、工程、销售等。在 IT 环境中，这些组可能包括开发人员、网络管理员和数据库管理员。其思想是将具有相似需求的人放在一个组中并授予相关权限；然后组的每个成员都会继承该组权限。这主要是为了方便管理权限，从而确保安全。root
    用户默认是 `root` 组的一部分。系统上的每个新用户必须被添加到组以继承该组的权限。


    ### 授予权限

    每个文件和目录必须为使用它的不同身份分配特定级别的权限。三个层级的权限列如下：


    - `r` - 读取权限。这仅授予打开和查看文件的权限。

    - `w` - 写入权限。这允许用户查看和编辑文件。

    - `x` - 执行权限。这将允许用户执行文件（但不保证可以查看或编辑它）。


    通过这种方式，root 用户可以根据用户对文件的需求授予相应级别的权限。当创建一个文件时，通常创建该文件的用户是该文件的所有者，所属组是用户当前的组。文件所有者可以向文件授予各种访问权限。让我们来看看如何更改权限以将所有权传递给单个用户和组。


    #### 1. 给单个用户授予所有权

    要将文件的所有权移动给不同的用户以便控制权限，我们可以使用 `chown`（更改所有者）命令：


    ```

    chown John /tmp/johnsfile

    ```

    在这里，我们提供命令、我们要授予所有权的用户名，以及相关文件的位置和名称。该命令授予了 `John` 用户账户 `johnsfile` 的所有权。


    #### 2. 给组授予所有权


    '
- fmt: '

    To transfer ownership of a file from one group to another, we can use the `chgrp`
    (or change group) command. Hackers are often more likely to work alone than in
    groups, but it’s not unheard of for several hackers or penetration testers work
    together on a project, and in that case, using groups is necessary. For instance,
    you might have a group of penetration testers and a group of security team members
    working on the same project. The penetration testers in this example are the root
    group, meaning they have all permissions and access. The root group needs access
    to the hacking tools, whereas the security folk only need access to defensive
    tools such as an intrusion detection system (IDS). Let’s say the root group downloads
    and installs a program named `newIDS`; the root group will need to change the
    ownership to the security group so the security group can use it at will. To do
    so, the root group would enter the following command:


    ```bash

    chgrp security newIDS

    ```

    This command passes the `security` group ownership of `newIDS`. Now you need to
    know how to check whether these allocations have worked. You will do that by checking
    a file’s permissions.


    ## Checking and Changing Permissions


    When you want to find out what file or directory permissions are granted to what
    users, the `ls` command can be used. It will, however, need to be suffixed by
    `-l` (long) switch that is used for displaying a directory’s content in long format.
    The displayed list will contain the permissions. The syntax is as below:


    ```bash

    ls -l /usr/share/hashcat own```

    The output will display, among other things, the permissions on the file. We have
    three sets of three characters, made of some combination of read (r), write (w),
    and execute (x), in that order. The first set represents the permissions of the
    owner; the second, those of the group; and the last, those of all other users.


    Regardless of which set of three letters you are looking at if you see an `r`
    first, that user or group of users has permission to open and read that file or
    directory. A `w` as the middle letter means they can write to (modify) the file
    or directory, and an `x` at the end means they can execute (or run) the file or
    directory. If any `r`, `w`, or `x` is replaced with a dash (`-`), then the respective
    permission hasn’t been given. Note that users can have permission to execute only
    either binaries or scripts.


    ## Changing Permissions


    We can use the Linux command `chmod` to change the permissions. Only a root user
    or the file’s owner can change permissions. In this section, we use `chmod` to
    change permissions on `hashcat.hcstat` using two different methods. First, we
    use a numerical representation of permissions, and then we use a symbolic representation.


    ### Changing Permissions with Decimal Notation


    We can use a shortcut to refer to permissions by using a single number to represent
    one `rwx` set of permissions. Like everything underlying the operating system,
    permissions are represented in binary, so ON and OFF switches are represented
    by 1 and 0, respectively. You can think of the `rwx` permissions as three ON/OFF
    switches, so when all permissions are granted, this equates to `111` in binary.
    A binary set like this is then easily represented as one digit by converting it
    into octal, an eight-digit number system that starts with 0 and ends with 7. An
    octal digit represents a set of three binary digits, meaning we can represent
    an entire `rwx` set with one digit.


    ### Changing Permissions with UGO


    Although the numeric method is probably the most common method for changing permissions
    in Linux, some people find `chmod`’s symbolic method more intuitive. Both methods
    work equally well, so find the one that suits you. The symbolic method is often
    referred to as the UGO syntax, which stands for the user (or owner), group, and
    others. UGO syntax is quite straightforward. Enter the `chmod` command and then
    the users you want to change permissions for, providing `u` for the user, `g`
    for group, or `o` for others, followed by one of three operators:


    - `-` Removes a permission

    - `+` Adds a permission

    - `=` Sets a permission


    After the operator, include the permission you want to add or remove (`rwx`) and,
    finally, the name of the file to apply it to. So, if you want to remove the write
    permission from the user that the file `hashcat.hcstat` belongs to; you could
    enter the following:


    ```bash

    chmod u-w hashcat.hcstat

    ```

    This command says to remove (`-`) the write (`w`) permission from `hashcat.hcstat`
    for the user (`u`). Now when you check the permissions with `ls -l` again, you
    should see that the `hashcat.hcstat` file no longer has write permission for the
    user:


    ### Giving Root Execute Permission on a New Tool

