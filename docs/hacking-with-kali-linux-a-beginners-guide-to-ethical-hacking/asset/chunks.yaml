    # 非对称加密


    这种加密类型在通信信道的两端使用不同的密钥。这是一种速度惊人缓慢的技术，与对称加密相比，它的速度要慢大约千倍！因此，对于涉及批量加密或流式通信的情况，这不是一种理想的方法。从积极的一方面来说，它解决了密钥交换问题。因为不需要在通信的两端拥有相同的密钥。这种加密类型主要用于两个实体需要交换信息但互不认识的情况。这里传输的信息通常是小位比特形式，例如身份信息，即证书或密钥。由于速度限制，非对称加密通常不用于批量或流式加密。以下是非对称加密中常见的几种方案。


    1. **Diffie-Hellman（迪菲-赫尔曼）** ——毫无疑问，Diffie-Hellman 密钥交换可以认为是密码学领域最卓越的发展。Diffie
    和 Hellman 提出了一种密钥生成方法。这有效地消除了对称密钥加密中常见的密钥交换问题。


    2. **RSA** – 这是 Rivest、Shamir 和 Adleman 的字母缩写。该方案利用了分解大质数的方法。其结果被用作两个密钥之间的关系。


    3. **PKI** – 这是公钥基础设施，主要用于在非对称系统中交换机密信息。PKI 使用公钥配合私钥使用。


    4. **ECC** – 这是椭圆曲线加密的缩写。该方案在移动计算领域正缓慢但坚定地获得普及。这是因为不仅高效，而且只需要极少的能量和计算能力即可提供类似的安全水平。该方案依赖于位于同一椭圆曲线上的两个函数之间的共享关系。


    5. **PGP** – Pretty Good Privacy（良好的隐私）的缩写，它利用非对称加密来确保电子邮件消息的完整性和隐私。


    # 数据安全


    为了最大限度地减少对数据库、网站和计算机的未经授权访问，我们需要能够保护数字隐私的措施。这些措施就是我们所的数据安全。它的作用保护数据免受损坏。对于所有大小的组织来说，数据安全都是至关重要的
    IT 方面。有时它被称为计算机安全或信息安全。用于数据安全的常用技术包括数据掩码、备份以及数据擦除等。正如我们所说的，加密也是一种数据安全技术，对于保护数据隐私至关重要。在这里，硬件、软件、硬盘和数字数据都将被加密。这是为了确保黑客和其他用户无法读取它们。我们在这里指的是那些可能接触到硬件或软件的未经授权的人。


    身份验证是实践数据安全的方法之一。你可能遇到过需要密码登录设备甚至访问电子邮件的情景。用户必须提供身份凭证（如生物识别数据、密码、用户名等），在授予其对数据或系统的访问权限之前对其进行身份验证。


    # 数字证书


    数字证书用于验证特定发送者的网络凭证。该证书还允许加密消息的接收实体理解数据来自受信源。证书权威颁发数字证书。消息加密和自签名都使用数字证书。身份证书或公钥证书是数字证书的另一个名称。`X.509`
    是常用数字证书的一个示例。


