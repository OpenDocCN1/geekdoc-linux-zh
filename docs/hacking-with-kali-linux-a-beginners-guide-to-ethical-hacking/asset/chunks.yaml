    这是一种组织用于确定其安全基础设施稳健性的机制。在这里，安全专业人员将扮演攻击者的角色，试图在恶意分子之前发现系统中的缺陷和脆弱性。其中一个核心目标是向公司和组织识别并报告这些漏洞。


    随着组织对安全的意识日益增强，以及安全违规引发的成本呈指数级增长，许多大型组织已开始外包安全服务。这些关键安全服务之一就是渗透测试。渗透测试本质上是一种合法的、受委托的黑客行为，旨在证明公司网络和系统的脆弱性。


    通常，组织会先进行漏洞评估，以发现其网络、操作系统和服务的中的潜在弱点。我在这里强调了“潜在”一词，因为这种漏洞扫描包含了大量的假阳性（即被识别为漏洞但实际上并非漏洞的项目）。渗透测试人员的角色是尝试攻入或“渗透”这些漏洞。只有这样，组织才能知道弱点是否真实存在，并决定是否投入时间和金钱来修复漏洞。


    ## 间谍活动与军事


    网络间谍活动可以说是在未经目标实体知情且许可的情况下，访问其信息和秘密的行为。目标对象可以是普通个人、对手、竞争对手、团体、政府甚至是敌人。其目标非常广泛，可以是政治的、经济的、个人的甚至是与军事相关的。


    所使用的技术也是多样化的。黑客可以使用恶意软件、破解技术、代理服务器等来实现其既定目标。


    间谍活动可以通过专业人员坐在他们的电脑桌前在线进行，也可以通过派遣经过训练的内鬼和传统间谍进行渗透完成。在某些情况下，它也可以由具有恶意意图的业余黑客和软件程序员来实施。众所周知，地球上的每个国家都在进行某种形式的网络间谍活动甚至是网络战争，尽管是隐蔽的。通过黑客获取其他国家军事活动的情报变得更具成本效益。因此，黑客在任何国家的防御系统中都有大有用场。


    ## 第 2 章：网络攻击


    ### 网络攻击的定义

    网络攻击可以说是对计算机系统以及依赖网络和技术的企业进行的蓄意利用。网络攻击利用恶意代码，目的是修改计算机数据、代码或逻辑。所有这些行为的最终结果都是破坏性的，通常会导致关键数据的泄露。


    此外，网络攻击还是发动或实施网络犯罪的平台。例如，信息和身份盗窃。网络攻击的另一个名称是计算机网络攻击。网络攻击可能产生以下影响：


    *   未经授权的访问和知识产权盗窃

    *   网页浏览器利用

    *   系统渗透

    *   突破访问控制

    *   硬件被盗

    *   欺诈、身份盗窃、勒索

    *   DoS 和 DDoS 攻击

    *   密码嗅探

    *   网站篡改


    ### 为什么网络攻击至关重要

    我们最近看到网络攻击的后果将是毁灭性的。由于网络攻击，企业的运营成本正在增加。处理数据泄露的代价也非常昂。Ponemon 研究院在 2018 年进行的一项研究发现，数据泄露的平均成本为
    386 万美元。


    然而，这不仅仅关乎财务方面。它们还可能：


    *   破坏相关品牌的声誉

    *   侵蚀客户对品牌的忠诚度，在某些情况下甚至使其毁灭

    *   网络攻击会导致知识产权的损失

    *   在严重情况下，公司可能会倒闭

    *   它们还会导致来自各种监管机构的处罚

    *   国家和政府的安全可能受到严重损害

    *   未来很可能再次发生攻击


