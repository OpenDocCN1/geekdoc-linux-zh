    Very often, when using the command line, you may want to search for a particular
    keyword. For this, you can use the `grep` command as a filter to search for keywords.
    The `grep` command is often used when output is piped from one command to another.
    A screenshot showing the output of the `grep` command looks like this;![](rsrcHV.jpg)


    In the above example, the command will display all the services that are running
    and then pipe that output to `grep`. What `grep` does is it will search the received
    output for the keyword we asked it to look for. In our case, the keyword is `apache2`.
    `Grep` will go ahead and output only the relevant results. This command saves
    time.


    # Modify Files and Directories

    After finding the directories and files you were looking for, you may need to
    carry out several operations on them. We are going to learn the creation of directories
    and files, copy files, rename files, plus delete the files and directories.


    ## Creating Files

    There are many ways to create files in Linux, but for now, we will look at two
    simple methods. The first is `cat`, which is short for concatenate, meaning to
    combine pieces (not a reference to your favorite domesticated feline). The `cat`
    command is generally used for displaying the contents of a file, but it can also
    be used to create small files. For creating bigger files, it’s better to enter
    the code in a text editor such as `vim`, `emacs`, `Leafpad`, `gedit`, or `kate`
    and then save it as a file.


    ### Concatenation with cat

    The `cat` command followed by a filename will display the contents of that file,
    but to create a file, we follow the `cat` command with a redirect, denoted with
    the `>` symbol, and a name for the file we want to create. Here is an example:

    ```

    kali >cat > kalilinuxHacking with Kali Linux!

    ```


    ### File Creation with touch

    The second command for file creation is `touch`. This command was initially developed
    so a user could touch a file to change some of its details, such as the date it
    was created or modified. However, if the file does not already exist, this command
    creates that file by default. Let’s create `newfile` using the `touch` command:

    ```

    kali >touch newfile

    ```

    Now when I then use `ls -l` to see the long list of the directory, I see that
    a new file has been created named `newfile`. Note that its size is 0 because there
    is no content in `newfile`.


    ## Creating a Directory

    The command for creating a directory in Linux is `mkdir`, a contraction of make
    directory. To create a directory named `newdirectory`, enter the following command:![](rsrcJH.jpg)

    To navigate to this newly created directory, do enter this:![](rsrcJP.jpg)


    ## Copying a File

    To copy files, we use the `cp` command. This creates a duplicate of the file in
    the new location and leaves the old one in place. Here, we are going to create
    the file `oldfile` in the root directory with `touch` and copy it to `/root/newdirectory`,
    renaming it in the process and leaving the original `oldfile` in place:![](rsrcJW.jpg)


    Renaming the file is optional and is done simply by adding the name you want to
    give it to the end of the directory path. If you don’t rename the file when you
    copy it, the file will retain the original name by default. When we then navigate
    to `newdirectory`, we see that there is an exact copy of `oldfile` called `newfile`:

    ```

    kali >cd newdirectory

    kali >ls

    newfile oldfile

    ```


