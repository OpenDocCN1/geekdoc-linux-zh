    任何信息系统最常用的用户身份验证方法都是使用密码。这意味着窃取密码是一种可以在攻击中使用的有效方法。要做到这一点，只需观察目标的桌子周围，然后对连接进行嗅探操作。这将使你能够获取未加密的密码。在这里，人们可以使用社会工程策略来获取包含密码的数据库访问权限，或者通过直接猜测来获取密码。这可以通过随机或系统化的方式进行。


    我们有以下几种类型的密码攻击：暴力破解攻击和基于字典的攻击。在第一种攻击中，会随机尝试不同的密码，希望其中某个组合能够成功。攻击者可以对该过程应用一些逻辑，例如尝试与用户姓名、爱好、职位等相关的密码。另一方面，基于字典的攻击利用字典中找到常用密码来尝试访问目标网络或计算机。一种常用的技术是复制包含密码的加密文件，然后对密码字典应用相似的加密方式，最后对密码进行比较。为了防止字典攻击或暴力破解攻击，所需要的就是实施账户锁定策略。这意味着在特定账户超过了超过指定的登录尝试次数后，该账户将被锁定。


    ## 8. 窃听攻击


    这种攻击通过截获网络流量来实现。通过使用窃听，恶意用户将获取信用卡号、密码以及用户在网络上交换的其他被视为机密的信息。我们可以进行被动窃听攻击或主动窃听攻击。让我们简要看看它们是什么。


    ### 被动窃听

    在这一窃听模式下，恶意用户将试图通过监听在网络上传输的消息来获取信息。


    ### 主动窃听

    传输的信息通过攻击者伪装成友好单元被主动捕获。这是通过查询数据传输器来实现的。我们将其称为扫描、篡改或简单的探测。


    需要注意的是，检测被动窃听攻击是至关重要的。因为它是主动攻击的前奏。数据加密是防止窃听的最佳防御措施。


    ## 黑客分为哪些类型？


    让我们区分一下我们可能遇到的不同类型的黑客。你会发现，每一类黑客都拥有不同的目标。我们还将查看每个黑客拥有的各种角色和目标。


    ### a) 黑帽黑客

    通常被称为黑帽，他们通常对绕过安全协议和入侵计算机网络的各种方法拥有广泛的知识。恶意软件通常由黑帽编写，以帮助访问这些系统。黑帽的主要目标通常是获取个人或财务利益。其中一些人会进行网络间谍活动，而另一些人则是为了好玩。这类黑客的范围从缺乏经验的业爱好者（他们的乐趣仅仅是传播恶意软件）到目标是侵吞特权数据的经验人士。很多时候，他们寻找的是财务信息。他们还对收集登录凭据和个人信息感兴趣。除了偷取数据外，如果获得的数据不符合他们的目的，他们通常会修改甚至破坏这些数据。


    ### b) 灰帽黑客

    这些人可以说既不是坏人也不是好人！灰帽既不是白不是黑。这类黑客兼具黑帽和白帽的特征。大多数时候，灰帽会尝试在所有者许可或知情的情况下挖掘系统中存在的漏洞。如果他们发现了问题，会向所有者报告。大多数情况下，他们会要求一些资金补偿以便他们修复问题。在所有者不配合的“不幸”情况下，他们会将他们的利用程序发布到互联网上供大家看到。灰帽的意图并不一定是恶意的；他们只是想通过自己的发现赚点钱。在发现漏洞后，灰帽通常不会利用他们挖掘出的漏洞。这种灰帽黑行为之所以违法，是因为黑客在针对目标特定系统的所有者处没有事先获得任何许可。对于想要成为黑客的读者来说，必须注意并非所有黑客都是平等的。我们有白帽黑客，他们总是试图在黑帽发现之前发现并修复漏洞。这样，我们现在的网络犯罪大大减少了。


    ### c) 白帽黑客

    与之前的两种黑客不同，白帽黑客是那些将技能用有用处的人。他们的意图是善良的。这些人是好人。这类黑客通常被称为伦理黑客。他们可能是组织的员工，或在信息安全公司担任承包商。他们通常尝试通过黑手段发现系统中的漏洞。黑客过程中使用的方法与黑帽使用的方法相似，但有一个区别。白帽首先征得所有者的同意。这使得黑客行为合法。白帽黑客通常执行渗透测试；他们评估漏洞并对公司的安全系统进行现场测试。我们甚至还有举办伦理黑的认证、培训、课程和会议。


    ## 什么是伦理黑？！


    我们将伦理黑定义为一种批准的实施方式，通过绕过系统安全来识别网络中的威胁和潜在的数据泄露。在这种情况下，拥有特定网络或系统的组织授权网络安全专家执行此类活动，以测试系统所建立的防御措施。因此，这意味着与恶意黑客不同，伦理黑是一个经过计划和批准的法律过程。伦理黑客的主要目标是审查特定网络或系统的弱点。恶意黑客正是利用这些弱点进行剥削或破坏的。


    在进行期间，他们还会收集并对信息进行分析。这将有助于他们进行组织 IT 基础设施的规划。通过这样做，安全足迹将得到显著改善，使其能够抵御或转移攻击。由于信息安全行业的增长，近期对伦理黑的需求急剧增加。伦理黑也被称为白帽黑客。伦理黑是尝试渗透和利用系统以发现其弱点的实践，以便对其进行更好的保护。我们可以将其分为大类。这些：渗透测试；这主要是为了合规的信息安全公司；以及由情报机构或国家军队进行的黑客。这两个领域对黑客的需求都在增加。


    *   渗透测试

