    多年来，你可能已经注意到 Windows 正在变慢，在某些部门甚至陷入了停滞。自从互联网出现以来，`Linux/Unix` 一直并且一直是 Web 服务器的首选操作系统，这主要是因为它的可靠性、健壮性和稳定性。截至目前，近三分之二的
    Web 服务器使用 Linux 操作系统。`Linux` 内核的使用示例包括 Citrix 应用、VMware、交换机和路由器中的嵌入式系统、移动设备等。人们说，计算的未来属于移动设备，包括但不限于手机和平电脑。用于大多数手机的
    `Android` 是 `Linux`，而 `iOS` 使用的是 `Unix` 内核。因此，很难想象未来会不是 `Linux/Unix`。微软 Windows
    的市场份额仅为 7% 左右。市场的其余部分要么是 `Linux` 要是 `Unix`。总而言之，未来属于 `Linux/Unix`。


    # 什么是 Kali Linux？


    Kali Linux 是 `Debian` 家族的一个发行版。它专门为安全审计和渗透测试设计和开发。该发行版包含数百个专注于信息安全任务的工具和实用程序，这些任务可能包括逆向工程、渗透测试、计算机取证和安全研究。Offensive
    Security 是 Kali Linux 背后的信息安全组织。它开发、资助并维护 Kali Linux。


    该发行版最初于 2013 年 3 月发布，是对 `BackTrack Linux` 从底部的完全重构。它百分之百地遵循 `Debian` 开发标准。Kali
    Linux 拥有超过 600 种可用于渗透测试的工具。在对 `BackTrack Linux` 进行彻底审查后，删除了一些无法工作或重复的工具。通过 Kali
    Tools 网站，让我们来查看一些细节：


    - **Kali Linux 永远免费**：就像 `BackTrack` 一样，`kali` 是免费的，而且以后将一直是免费的。这意味着你现在或未来在任何时候都不需要为它付费。

    - **它是开源的**：Kali Linux 使用的源代码对任何想要改进、修改或重新构建包以适应其特定需求的人都开放。

    - **Kali 符合 FHS 标准**：该发行版遵循文件系统层级标准（FHS）。这些标准帮助 `Linux` 用户无缝地定位支持文件、二进制文件、库等。

    - **支持广泛的无线设备**：系统设计支持多个平台的无线接口。它可以在各种硬件上运行。

    - **内核经过定制并针对注入进行了补丁处理**：Kali Linux 内核中包含了最新的注入补丁。

    - **它在安全环境中创建**：负责开发 Kali 的团队是一小群受信任的，他们被信任提交包并与仓库交互。在这些过程中使用了安全协议。

    - **GPG 签名的仓库和包**：Kali Linux 中的所有包通常由个人开发者签名。这些开发者对相应的包负责。这些包随后也会由仓库进行签名。

    - **支持多种语言**：大多数渗透工具和实用程序通常用英语编写。尽管如此，Kali 仍提供了真正的多语言支持。因此，用户能够以他们的母语言进行操作。这不很棒吗！

    - **Kali 易于自定义**：所有用户都可以根据自己的需求和偏好修改 Kali。

    - **Kali Linux 同时支持 ARMHF 和 ARMEL**：Kali Linux `ARM` 支持针对 `ARMEL` 和 `ARMHF` 系统的完整安装。Kali
    Linux 适用于各种 ARM 设备，并与 ARM 仓库集成到主发行版中，因此 ARM 的工具会与发行版的其他部分同步更新。


    # 下载 Kali Linux


    在我带你走上黑客之路之前，你首先需要在你的计算机上下载并安装 Kali Linux。这是我们在整本书中将使用的 `Linux` 发行版。可以通过 `https://www.kali.org/`
    完成。导航到首页并点击页面顶部的 Downloads 链接。选择正确的下载版本非常。


    # 安装 Kali 和设置 Kali Linux 的步骤


    为了开始，你需要使用你优的安装介质启动。你将看到如下所示的 Kali 启动屏幕。选择 `Text-Mode` 或 `Graphical install`。在例子中，我们选择了
    `GUI` 安装。


    ![](img/rsrcBP.jpg)


    选择你的语言偏好以及国家位置。此外，系统还会提示你选择偏好的键盘布局。(rsrcBW.jpg)


    选择你的位置，即地理位置。(rsrcC1.jpg)


    安装程序将镜像复制到你的硬盘上，探测你的网络接口，然后提示你为系统输入主机名。在下面的示例中，我们将 `kali` 作为主机名。(rsrcC6.jpg)


    你可以可选地为此系统提供一个默认域名。(rsrcCB.jpg)


    接下来，为系统的非 root 用户提供全名。(rsrcCG.jpg)


    将根据你提供的全名创建一个默认用户 ID。如果你喜欢，可以更改它。(rsrcCN.jpg)


    之后，选择一个适当的时区。(rsrcCU.jpg)


    接下来，你将看到类似下图的内容。进行适当选择。(rsrcCZ.jpg)


    选择你想要分区的磁盘。(rsrcD4.jpg)


    继续下一步，根据你的需求选择选项。(rsrcD9.jpg)


    接下来，点击 Continue 按钮。(rsrcDE.jpg)


    下一步需要你执行网络镜像配置。(rsrcDJ.jpg)


    接下来，安装 GRUB。(rsrcDR.jpg)


    最后，点击 Continue 进入你的 Kali 安装。(rsrcDX.jpg)


    # 第 4 章：Kali 基础


    ## 引言


    我们之前说过 Kali Linux 是一个为道德黑客、渗透测试员、安全研究人员和爱好者设计的 `Debian` 发行版。它是 Offensive Security
    开发的稳定、企业级且维护良好的发行版。Kali Linux 默认桌面环境是 `GNOME`，但它提供了多种其他桌面环境，包括 `KDE`、`MATE`、`LXDE`
    等。它可以安装在各种系统上，包括笔记本电脑、服务器、ARM 设备和云端。它还有一个针对安卓设备的便携版本称为 `NetHunter`，可以在安卓操作系统中使用并预装了工具和脚本。


    ## 为什么你应该使用 Kali Linux


    正如之前提到的，Kali Linux 预装了几乎所有用于上述目的的工具。这就是安全审计员、取证调查员、渗透测试员和研究人员青它的它的。


    Kali 可用于破解 WiFi 网络、攻击网站和网络、对实体进行开源情报收集等。除了道德黑客，Kali Linux 还拥有用于取证调查的工具。这正成为安全领域一个同样重要的分支，主要收集证据、分析证据并利用结果追溯网络犯罪分子。取证调查使得定位和消除来自恶意活动的影响成为可能。它在计算和管理攻击损失方面也很有用。Kali
    的一个关键特性是隐身 Live 模式，主要用于取证，因为它不会在主机系统中留下痕迹（指纹和足迹）。


    ## 终端


    ![](img/rsrcEC.jpg)


    使用 Kali 的第一步是打开终端，这是我们在本书中使用的命令行界面。在 Kali Linux 中，你可以在桌面底部找到终端图标。双击此图标打开终端，或按下
    `CTRL+ALT+T`。终端打开命令行环境，被称为 `shell`，它允许你在底层操作系统上运行命令并编写脚本。虽然 `Linux` 有许多不同的 shell
    环境，但最流行的是 `bash` shell，它也是 Kali 以及许多其他 Linux 发行版的默认 shell。要更改密码，可以使用 `passwd`
    命令。


    ## Linux 基础命令


