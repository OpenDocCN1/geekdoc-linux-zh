- fmt: '

    Another example of an illegitimate use is when an intruder modifies their MAC
    address to enable them to gain access to a target network as if they were an authorized
    user. An attacker can wreak devastating damage to a network or system using this
    newfound identity. For instance, they can launch a denial of service attack on
    the computer systems, or in some cases, bypass the control mechanisms for access
    to paving the way for a more advanced intrusion. Also, an attacker can decide
    to alter their MAC address so that they can evade network intrusion detection
    systems. This makes them invisible to laid down security measures, thereby giving
    them plenty of time to act without being detected.


    ### Lawful Uses of MAC Spoofing


    One legal use of MAC spoofing is whereby the function of a single computer is
    changed from being a router to a computer. The reverse also applies. That is,
    altering the function of a computer back to being a router. Suppose we have a
    single public IP address, we can only use it on one router or computer. Now, if
    we have two wide area network IP addresses, it implies that the MAC address of
    the two devices (two computers) have to be different. The computers may need to
    be regularly swapped for some reason to connect them to the cable modem. The exercise
    would be quicker and easier when the MAC addresses of the devices are changed
    instead of changing the Network Interface Card. To this end, numerous cable modem
    routers possess a "Clone MAC Address" feature that is inbuilt purposely for this.
    A MAC address that is falsified enables attackers to bypass security mechanisms
    that have been set. For instance, an attacker will be able to impersonate real
    devices or even conceal themselves behind other devices on the network. To conclude,
    it is instructive to note that the exercise of MAC address changing is a legitimate
    technique that can be used to ensure a proper network operation besides being
    a fraudulent technique.


    ### Protection Against MAC spoofing


    Network monitoring, analysis, and security are required to combat MAC spoofing.
    Management of access to a company''s network for purposes of keeping out the bad
    guys is certainly a good idea. Guests should have restricted access to an organizations’
    network connection, say Wi-Fi. The main reason for this is that a significant
    portion of the MAC spoofing attacks originate or, instead, are carried out from
    an internal network. It is also proactive for a company to ensure no unauthorized
    persons are left behind at its premises and that visitors are never left alone.
    This measure will go along the way in preventing unauthorized people from manipulating
    or connecting to an internal network by using connecting directly to the ethernet
    utilizing a cable. It is advisable that companies also adopt IPsec technologies
    alongside communication encryption within the network system that will help to
    eradicate eavesdropping of existing MAC addresses. In more prominent companies,
    the use of active networking hardware that is advanced ensures that they have
    improved protection utilizing firewall configuration or switch configuration.
    These techniques block external incoming packets since they are likely an attack
    vector.


    ### ARP Spoofing


    This is an attack whereby an entity deemed to be malicious transmits falsified
    ARP messages across a local network. The consequence of this is that the MAC address
    and IP address of a legitimate server or computer that is within the network will
    be linked. That means that an attacker will be able to receive any information
    and data that is intended for the authentic IP address. Additionally, an attacker
    is also able to modify, intercept, and sometimes stop the data being transmitted.
    This type of attack, however, is only possible on local area networks using something
    we call Address Resolution Protocol.


    #### Examples of ARP Spoofing Attacks


    ARP spoofing attacks have severe consequences for targeted enterprises. The main
    goal of these spoofing attacks is to steal information. This information is usually
    sensitive. They are not only limited to this but are also able to enable other
    attacks, for example:


    *   DoS attacks: Such attacks take advantage of ARP spoofing to connect many IP
    addresses to a single MAC address belonging to the target. Consequently, the traffic
    initially intended for the multitudinous IP addresses will be rerouted to the
    MAC address of the target, thereby overloading it.

    *   Session hijacking: This attack uses ARP spoofing mainly for obtaining a session
    ID. The IDs can then be used to gain access to private data and even systems.

    *   Man-in-the-middle attacks: Just like session hijacking, MITM attacks normally
    intercept and alter the traffic between unsuspecting victims.


    #### Detection, Prevention, and Protection Against ARP Spoofing


    One can detect and keep ARP Spoofing attacks at bay through one or more of the
    following:


    *   Making use of ARP spoofing detection software: Such programs carry out an
    inspection and certification of data before transmission. Data that seems to be
    spoofed is customarily blocked.

    *   Packet filtering: This is a useful technique that can be used to prevent ARP
    spoofing. Packets having conflicting source address information are filtered out
    and blocked.

    *   Encrypting network protocols: Protocols such as HTTP Secure (HTTPS), Secure
    Shell (SSH), Transport Layer Security (TLS), among others help to prevent attacks
    by ARP spoofing. They accomplish this by carrying out the encryption of data before
    it is transmitted and authentication of the same data upon receipt.

    *   Keep trust relationships to a minimum: Companies and institutions need to
    come up with security protocols that do not depend on trust relationships. In
    such types of relationships, the authentication mechanisms depend on IP addresses
    only. This makes it a lot easier for ARP spoofing attacks to occur.


    ### Rogue DHCP Server


    #### A Definition of DHCP


    We define it as a protocol the network uses to enables a particular server to
    be able to assign an IP address to a specific computer automatically from a range
    of numbers that are defined for a network.


    #### So, What Is a Rogue DHCP Server?

