  raw: 'As a hacker, you will often require to download new tools for hacking, but
    Linux automatically assigns all files and directories default permissions of 666
    and 777, respectively. This means that, by default, you will not be able to execute
    a file immediately after downloading it. If you try, you’ll usually get a message
    that says something like “Permission denied.” For these cases, you will need to
    give yourself root and execute permissions using chmod to run the file.Special
    Permissions![](rsrcXM.jpg)Besides the three permissions that are general-purpose,
    rwx, Linux has three special permissions that are slightly more complicated. They
    are the sticky bit, set group ID (or SGID), and set user ID (or SUID). Below is
    a brief explanation of each of them.a)   Granting Temporary Root Permissions with
    SUIDAs you should know by now, a user can execute a file only if they have permission
    to run that particular file. If the user only has read and write permissions,
    they cannot run. This may seem straightforward, but there are exceptions to this
    rule. You may have encountered a case in which a file requires the permissions
    of the root user during execution for all users, even those who are not the root.
    For example, a file that allows users to change their password would need access
    to the /etc/shadow file—the file that holds the users’ passwords in Linux—which
    requires root user privileges to execute. In such a case, you can temporarily
    grant the owner’s privileges to run the file by setting the SUID bit on the program.
    It, therefore, implies that the SUID bit says that any user can execute the file
    with the permissions of the owner, but those permissions don’t extend beyond the
    use of that file. To set the SUID bit, enter a 4 before the regular permissions,
    so a file with a new resulting permission of 644 is represented as 4644 when the
    SUID bit is set Setting the SUID on a file is not something a typical user would
    do, but if you want to do so, you’ll use the chmod command, as in chmod 4644 filename.b)
      Granting the Root User’s Group Permissions SGIDSGID also gives temporary elevated
    permissions, but it gives the permissions of the file owner’s group, rather than
    of the file’s owner. This means that, with an SGID bit set, someone without the
    execute permission can execute a file if the owner belongs to the group that has
    permission to run that file. The SGID bit works slightly differently when applied
    to a directory: when the bit is set on a directory, ownership of new files created
    in that directory goes to the directory creator’s group, rather than the file
    creator’s group. This is very useful when a directoryis shared by multiple users.
    All users in that group can execute the file(s), not just a single user. The SGID
    bit is represented as 2 before the regular permissions, so a new file with the
    resulting permissions 644 would be represented as 2644 when the SGID bit is set.
    Again, you would use the chmod command for this—for example, chmod 2644 filename.c)
      The Outmoded Sticky BitThe sticky bit is a permission bit that you can set on
    a directory to allow a user to delete or rename files within that directory. However,
    the sticky bit is a legacy of older Unix systems, and modern systems (like Linux)
    ignore it. As such, I will not discuss it further here, but you should be familiar
    with the term because you might hear it in the Linux world.Managing ProcessesHackers
    often need to multiprocess, and an operating system like Kali is ideal for this.
