    在某些情况下，你可能想要使用另一个 DNS 服务器。为了做到，你需要编辑系统上一个名为 `/etc/resolv.conf` 的纯文本文件。用文本编辑器打开该文件。然后，在命令行中输入编辑器的准确名称，随后是文件路径和文件名。


    ## Wi-Fi 网络

    rsrcTN.jpg


    首先，让我们来看 WiFi。在此之前，这里对通常常用的各种 WiFi 安全协议进行简单介绍。原始的加密等效隐私（WEP）存在严重缺陷且容易被破解。它的继代者
    WiFi 保护访问（WPA）安全性稍高。最后是 WPA2PSK，它安全得多，并使用所有用户共享的预共享密钥（PSK），现在被几乎所有的 WiFi AP（企业级
    WiFi 除外）使用。


    ### 无线命令


    `ifconfig`

    在类 Unix 操作系统中，执行网络接口配置需要 `ifconfig`。它是系统中的一种管理实用程序。`ifconfig` 具有用于 TCP/IP 接口参数的配置、查询和控制的实用。作为一种交互式工具，`ifconfig`
    可以显示并分析网络接口的设置。总而言之，`ifconfig` 执行以下操作：


    * 该命令允许查看网络设置。

    * 启用和禁用网络接口。

    * 分配网络接口 IP 地址

    * 为网络接口分配子网掩码

    * 为网络接口分配广播地址

    * 为网络接口分配 IP、子网掩码和广播地址

    * 修改网络接口的 MTU

    * 启用和禁用混杂模式

    * 在网络接口上添加和删除新的别名（Alias）

    * 修改网络接口的 MAC 地址


    `iwevent`

    此命令显示通过 RTNetlink 套接接收的无线事件。每行显示特定的无线事件，描述了指定无线接口上发生的情况。此命令不接受任何参数。


    `iwlist`

    此命令可以用于扫描可用的无线网络，并显示使用 `iwconfig` 命令时不会显示的关于无线网络的其他信息。`iwlist` 用于生成附近的无线访问点及其
    SSID 和 MAC 地址。


    `iwspy`

    此命令用于监控网络中的节点。它也可以用于记录节点的链路质量。


    `ifrename`

    此命令用于根据多个静态标准重命名无线网络接口，以便为每个接口一致地分配名称。接口名称通常是动态的。此命令帮助用户决定网络接口的名称。该命令需要在启动接口之前执行。


    `iwgetid`

    这用于报告当前正在使用的无线网络的 NWID、ESSID 或访问点地址。默认情况下，`iwgetid` 将显示设备的 ESSID。如果不可用，它将改为输出
    NWID。报告的信息与 `iwconfig` 显示的。相比之下，在各种脚本中进行集成要容易得多。


    ### 蓝牙的检测与连接


    在最近，几乎所有的小 get 设备、系统和设备都内置了蓝牙。这些设备可以是计算机、iPod、智能手机、扬声器、游戏控制器、键盘、平板电脑等。破解蓝牙网络的能力可能导致设备上信息的泄露（假设控制了设备），并获取一个在设备进出传输权限信息的平台等。因此，如果我们想要利用这项技术，就需要理解蓝牙的工作原理。通过这本书，你将获得一些基础知识，这些知识在扫描和连接蓝牙设备以准备破解它们时将非常有帮助。


    #### 蓝牙的工作原理

    首先，我们将蓝牙定义为一种无线通信技术，允许设备无线传输语音或数据。这发生在较短的距离。这项技术旨在取代连接设备的无处不在的电缆，同时确保跨设备通信的安全性。两个蓝牙设备连接的过程被称为配对。只要将它们设置为可发现模式，几乎任何两个设备都可以配对。在可发现模式下，蓝牙设备将广播以下关于自身的信息：


    * 技术信息

    * 名称

    * 服务列表

    * 类（Class）


    配对后，两个蓝牙设备将交换链路密钥。设备将存储密钥，以便在未来的配对中识别另一个设备。每个设备都有一个唯一的标识符，通常有一个由制造商分配的名称。当我们想要识别和访问设备时，这些将是很有用的数据。


    #### 蓝牙扫描与侦察

    rsrcV5.jpg


    Linux 有一个蓝牙协议栈的实现，称为 `BlueZ`，我们将用它来扫描蓝牙信号。大多数 Linux 发行版（包括 Kali Linux）默认将其作为内置功能。`BlueZ`
    拥有帮助我们扫描和管理具备蓝牙能力的实用程序。下面列出了实用程序的示例：


    * `hciconfig`；这是 Linux 中 `ifconfig` 的等效物，但是为蓝牙蓝牙设备设计的。

    * `hcitool`；这是我们用于执行查询的工具。查询可以是设备 ID、名称、类，甚至是其时钟信息。这有助于设备同步工作。

    * `hcidump`；此工具通过对蓝牙通信进行嗅探，因此它给了我们捕获通过蓝牙信号发送的数据的机会。


