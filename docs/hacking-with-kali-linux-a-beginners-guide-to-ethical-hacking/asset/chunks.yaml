  trans: "\n\n- 用于对应用层发现的数据进行加密。\n- 保护在互联网上传输数据的路由器。\n- `IPsec` 为我们提供身份验证，但不提供任何加密。\n\
    - 它通过使用 `IPsec` 隧道创建电路来保护网络上的数据。其工作原理与虚拟专用网络（VPN）非常相似。\n\n### IP 安全组件\n以下是组成 IPsec\
    \ 的某些组件：\n\n1. 互联网密钥交换 (`IKE`) – 这是一种用于网络安全的协议，旨在动态交换加密密钥，并绕过两个设备之间的安全关联 (`SA`)。`SA`\
    \ 用于建立在任何两个网络元素之间共享的安全属性。这些属性是支持安全通信的基础。此外，`IKE` 为消息内容提供保护，以及一个用于实现标准算法（例如 `MD5`\
    \ 和 `SHA`）的开放帧。\n2. 封装安全负载 (`ESP`) – 用于确保数据完整性、身份验证、防重放和加密。`ESP` 还对有效负载进行身份验证。\n\
    3. 身份验证头 (`AH`) – `IPsec` 使用身份验证头来确保数据完整性、防重放和身份验证。然而，身份验证头不提供加密。防重放保护功能用于防止未经授权的数据包传输，但它并不保持机密性。\n\
    \n### IP 安全的操作原理\n\n1. 首先，主机将检查数据包是否需要使用 `IPsec` 发送。是数据包的流量触发了安全策略。\n2. 互联网密钥交换的第一阶段从两个使用\
    \ `IPsec` 的主机相互进行身份验证开始。这将启动一个安全通道。在这里，我们有两种模式：\n    - 主模式（Main mode），用于提供更高的安全性；\n\
    \    - 激进模式（Aggressive mode），使主机能够快速创建 `IPsec` 电路。\n3. 使用上述通道（在第 2 步中建立），对 `IP`\
    \ 电路如何在跨越 `IP` 电路时加密数据进行协商。\n4. 之后，在协商好的安全通道上进行第二阶段的互联网密钥交换。\n5. 交换的数据随后通过新建立的\
    \ `IPsec` 加密隧道进行。主机通过 `IPsec` `SAs` 对数据包进行加密和解密。\n6. 通信完成后或主机之间的会话超时，`IPsec` 隧道将终止。两个主机都将丢弃密钥。\n\
    \n# 第 9 章：密码学\n\n引言\n作为黑客，我们经常面临密码学和加密的障碍。在某些情况下，我们使用它来隐藏自己的操作和消息。许多应用程序和协议使用加密来维护数据的机密性和完整性。为了破解密码以及如\
    \ `SSL` 和无线等加密协议，你至少需要熟悉密码学和加密的概念与术语。对于许多新黑客来说，密码学所有的思想和术语可能让他们感到无所从心且晦涩。通过这个针对新者的简要概述，我希望拨开笼罩这一主题的迷雾，为密码学提供一点点启发。\n\
    \n加密中包含大量的数学和算法，那是我们目前不想涉足的话题。解释将非常简单且出奇地易于理解。我们将学习基本概念和术语，以便在这些相关话题出现时你能够了解相关内容。这些包括无线破解、密码破解、加密技术和哈希。然而，我的意图并不是在这里让你变成一名密码学家。这是一项需要时间磨练的技能，但可以帮助学者熟悉密码学的术语和概念，帮助你成为一名可靠的黑客。\n\
    \n### 关于密钥长度的几句话\n在密码学中，密钥长度非常重要。更安全的加密具有更大的密钥。因此，256 位的 `AES` 密钥比 128 位的 `AES`\
    \ 密钥强得多。这意味着它也难破解得多。只需说，在采用相似算法的加密中，密钥越大，加密就越强。然而，请注意加密的强度还基于密钥大小和算法的特性。因此，这并不意味着在不同的加密算法之间较大的密钥代表更强的加密。让我们从将加密分类开始吧。\n\
    \n### 密码学的类型\n以下是我们在书中将关注的加密类型。\n\n- 非对称加密\n- 对称加密\n\n但在本书中，我们将关注对称加密和非对称加密。\n\
    \n### 对称密码学\n在这里，发送者和接收者拥有相似的密钥。对称加密无疑是今天最常用的密码学形式。想象一下：你使用密码加密消息。假设我有相同的密码，我就可以访问加密的消息。任何其他人都无法读取该消息。看这有多简单！这种密码学速度快，非常适合流媒体应用或批量存储。这种密码学方法的一个主要障碍是密钥交换。正如我们在上面看到的示例，如果两个端需要相似的密钥，它们需要另一个可以用于交换密钥的第三方通道。这就是对称密码学最大的弱点。假设打算交换消息的实体相隔数万里，密钥如何交换呢？正如你可能已经意识到的，机密性问题出现了。实体可以选择通过电子邮件、邮件、电话等交换密钥。这使得拦截正在交换的密钥成为可能，加密的机密性会被破坏。我们目前在使用许多对称算法。下面简要介绍了常用的算法。\n\
    \n1. `DES` – 由 IBM 开发，`DES` 是早期加密方案之一。后来发现 `DES` 存在缺陷且是可以破解的。早期 `LANMAN` 系统（2000\
    \ 年以前）最初使用的就是 `DES` 加密。\n2. `3DES` – 正是 `DES` 的缺陷导致了这种加密算法的发展。它通过三次应用 `DES` 工作，因此得名。这使其与\
    \ `DES` 相比变得更安全一些。\n3. `AES` – 全称是高级加密标准（Advanced Encryption Standard）。从密码学的角度来说，`AES`\
    \ 本身并不是一种加密算法。是 `NIST` 开发了 `AES`。它是目前使用的最稳健的加密之一。`AES` 利用 128 位、196 位和 256 位密钥。自\
    \ 2001 年以来，`AES` 由 `Rijndael` 算法占据。该标准广泛用于 `SSL/TLS`、`WPA2` 等需要速度和机密性的协议。\n4.\
    \ `RC4` - 它对每个位或字节进行加密，而不是单个信息块。这被称为流加密。`RC4` 由 RSA 的 `Rivest Ronald` 设计和创建。这种加密方法常用于\
    \ `WEP` 和 `VoIP` 应用。\n5. `Blowfish` – `Blowfish` 使用长度变化的密钥。它是一种非常安全的加密方案。它还是开源的，因此任何人都可以无需许可使用它。\n\
    6. `Twofish` – 它与 `Blowfish` 类似。但它拥有先进的功能，例如使用 128 位或 256 位密钥。`Twofish` 曾是 `AES`\
    \ 的有力竞争者。使用 `Twofish` 的应用示例 `cryptcat` 和 `OpenPGP` 等。此外，它没有专利，就像 `Twofish` 一样（注：原文此处可能为重复，意指均无专利）。\n\
    \n"
- fmt: '

    # Asymmetric Cryptography


    This type of cryptography utilizes different keys for the two ends of the channel
    of communication. It is an astonishingly slow technique that, when compared to
    symmetric cryptography, is about a thousand times slower! It is, therefore, an
    undesirable method for use where bulk encryption or streaming communication is
    concerned. On a positive note, it solves the problem of key exchange. This is
    because there is no need for having the same keys at both ends of a communication.
    This type of cryptography is predominantly utilized in cases where two entities
    need to exchange information but are unknown to each other. The information being
    transferred here usually is in the form of small bits, for instance, identifying
    information, i.e., a certificate or a key. Due to limitations in speed, asymmetric
    cryptography is not generally used for bulk or streaming encryption. Below are
    some schemes found under asymmetric encryption.


    1. **Diffie-Hellman** – Without any doubt, Diffie-Hellman key exchange can be
    said to be the most exceptional development in cryptography. Diffie and Hellman
    came up with a method of key generation. This effectively eradicated the problem
    of key exchange that is often a characteristic of symmetric key encryption.


    2. **RSA** – This is an abbreviation for Rivest, Shamir, and Adleman. This scheme
    makes use of a method where very large prime numbers are factorized. The result
    is used as the relationship between the two keys.


    3. **PKI** – this is a Public key infrastructure mainly used for exchanging confidential
    information in an asymmetric system. PKI makes use of a public key alongside a
    private key.


    4. **ECC** – this is short for Elliptical curve cryptography. The scheme is slowly
    but surely gaining popularity in the world of mobile computing. This is because
    it is efficient and also requires minimal energy consumption and computing power
    to provide a similar level of security. The scheme is dependent on the relationship
    that is shared by two functions that are located on the same elliptical curve.


    5. **PGP** – an abbreviation for Pretty Good Privacy that makes use of encryption
    that asymmetric for purposes of ensuring the integrity and privacy of email messages.


    # Data Security


    For us to minimize unauthorized access to databases, websites, and computers,
    we need measures that can safeguard digital privacy. These measures are what we
    call data security. It serves to guard data against corruption. For all organizations,
    big and small alike, data security is a crucial IT aspect. Sometimes it can be
    referred by the name computer security or information security. Common technologies
    used for data security comprises of data masking, backups, and also data erasure,
    among many others. Encryption is also a data security technology that is essential
    in safeguarding the privacy of data as we have said. Here, hardware, software,
    hard drives, and digital data are encrypted. This is to make sure that they are
    unreadable to hackers and other users. Here we are talking about those who are
    unauthorized that may get their hands on the hardware or software.


    Authentication is one way of practicing data security. It is likely that you have
    encountered a scenario where you needed a password to log into your device or
    even to access your email. Users must provide identifying credentials such as
    biometric data, a password, a username, and so on to do a verification of their
    identities before granting them access to data or a system.


    # Digital Certificates


    A digital certificate is used in the authentication of the web credentials of
    a particular sender. The certificate also allows the receiving entity of an encrypted
    message to get to understand that the data is from a source that is trusted. A
    certification authority issues the digital certificate. Message encryption and
    self-signatures use digital certificates. Identity certificates or public key
    certificates is the other name we use for digital certificates. `X.509` is an
    example of a commonly used digital certificate.


    # Conclusion


    May I take this opportunity to thank you for being able to make it to the end
    of Hacking with Kali Linux, let’s hope it has been edifying and through it, you
    have been able to accrue the requisite knowledge to enable you to begin your hacking
    career or improve your skills if you are already one. I sincerely hope that you
    have enjoyed flipping pages all the way from the first topic which was; Basics
    of Hacking, Cyber Attacks, Linux for Hacking, Basics of Kali, Scanning and Managing
    Networks, File and Directories Permissions, Cyber Security, Becoming Secure and
    Anonymous, and finally onto some basics of cryptography. I am also hoping that
    by studying this book, you have got to learn plenty of practical concepts that
    you need to become a hacking expert.


    By now, you must have been able to get access to a vast body of theoretical knowledge
    regarding the various types of attacks that can be launched on your systems, the
    reason for launching them, and how you can safeguard your infrastructure against
    such attacks. These are your first steps towards becoming a professional hacker.
    The book covers topical issues like wireless network attacks, cyber-attacks, and
    penetration testing, among others. It, therefore, means that you are now in an
    excellent position to discern network attack mechanisms being perpetrated in the
    real world and recommend appropriate remedial measures.


    I have also given you several security measures you can implement to keep your
    networks safe. The formatting is such that the language is quite user-friendly
    and that you can understand the importance of securing your systems. Going forward,
    the next step is to put the concepts you have acquired from this book into practice.
    They say practice makes perfect, and it is by practicing that one can become a
    master in the field of hacking, more so using Kali Linux. Let the knowledge you
    have acquired from the book work for you.

    '
