    作为一名黑客，你经常需要下载新的攻击工具，但 Linux 会自动为所有文件和目录分配 666 和 777 的默认权限。这意味着，默认情况下，你无法在下载后立即执行该文件。如果你尝试这样做，通常会收到类似“Permission
    denied”（权限被拒绝）的消息。在这些情况下，你需要使用 `chmod` 命令为自己赋予 root 和执行权限以运行该文件。


    ## 特殊权限


    除了通用的 rwx 三种权限外，Linux 还有三种稍微复杂的特殊权限。它们是粘滞位（sticky bit）、设置组 ID（或 SGID）和设置用户 ID（或
    SUID）。以下是对它们每种权限的简要说明。


    ### a) 使用 SUID 授予临时 root 权限

    正如你现在所知道的，用户只有在拥有运行该特定文件的权限时，才能执行该文件。如果用户只有读取和写入权限，他们无法运行。这看起来很显而易见，但这条规则也有例外。你可能遇到过一种情况：某个文件在执行时对所有用户都需要
    root 权限，即使是非 root 用户也是如此。例如，允许用户更改密码的文件需要访问 `/etc/shadow` 文件——Linux 中存储用户密码的文件——而该文件需要
    root 用户权限才能执行。在这种情况下，你可以通过在程序上设置 SUID 位来临时授予所有者运行该文件的权限。因此，这意味着 SUID 位表示任何用户都可以以所有者的权限执行该文件，但这些权限不会超出对该文件的使用范围。要设置
    SUID 位，在普通权限之前输入 4，因此一个新权限为 644 的文件在设置 SUID 位后将表示为 4644。在文件上设置 SUID 不是普通用户会做的事，但如果你想这样做，将使用
    `chmod` 命令，例如 `chmod 4644 filename`。


    ### b) 使用 SGID 授予 root 用户的组权限

    SGID 同样会提供临时的提升权限，但它授予的是文件所有者所在组的权限，而不是文件所有者的权限。这意味着，设置了 SGID 位后，没有执行权限的人，只要所有者属于有权运行该文件的组，就可以执行该文件。SGID
    位应用于目录时工作方式略有不同：当在目录上设置该位时，在该目录中创建的新文件的所有者将属于目录创建者的组，而不是文件创建者的组。这在多个用户共享一个目录时非常有用。该组中的所有用户都可以执行文件，而不仅仅是单个用户。SGID
    位在普通权限之前表示为 2，因此一个权限为 644 的新文件在设置 SGID 位后将表示为 2644。同样，你将使用 `chmod` 命令进行此操作——例如，`chmod
    2644 filename`。


    ### c) 过时的粘滞位 (Sticky Bit)

    粘滞位是一种可以设置在目录上的权限位，允许用户删除或重命名该目录内的文件。然而，粘滞位是旧版 Unix 系统的遗留，现代系统（如 Linux）会忽略它。因此，我在这里不再进一步讨论它，但你应该熟悉这个术语，因为你可能会在
    Linux 世界听到它。


    ## 管理进程


    黑客经常需要进行多进程操作，像 Kali 这样的操作系统非常适合这一点。黑客可以在运行漏洞扫描器和利用的同时的同时运行端口扫描器。这要求黑客高效地管理这些进程，以最充分利用系统资源并完成任务。在本节中，我将向你展示如何管理多个进程。


    ### 使用 nice 更改进程优先级

    你经常不在黑客的语境下听到 `nice` 这个词，但在这里你会听到。`nice` 命令用于影响内核对进程优先级的考量。正如你所看到的，当我们运行 `ps`
    命令时，系统上有许多进程同时运行，并且它们所有的进程都在竞争可用资源。内核对进程的优先级拥有最终决定权，但你可以使用 `nice` 来建议提高进程的优先级。使用“nice”一词背后的想法是，当你使用它时，你正在决定对其他用户有多“友好”：如果你的进程使用了大部分系统资源，那么你就不非常友好。nice
    的值范围从 –20 到 +19，其中 0 是默认值。高 nice 值对应低优先级，低 nice 值对应高优先级（当你不想对其他用户和进程那么友好时）。当进程被启动时，它会继承父进程的
    nice 值。进程所有者可以降低进程的优先级，但不能增加其优先级。当然，超级用户或 root 用户可以随心所欲地设置任何 nice 值。


    ### 在启动进程时设置优先级

    为了演示目的，让我们假设有一个名为 `slowprocess` 的进程，位于 `/bin/slowprocess`。如果我们想让它加快完成速度，可以使用 `nice`
    命令启动进程：

    ```

    kali >nice -n -10 /bin/slowprocess

    ```

    此命令会将 nice 值增加 -10，从而提高其优先级并为其分配更多资源。相反，如果我们想对其他用户和进程友好，并给 `slowprocess` 分配较低的优先级，我们可以将其
    nice 值正增加 10：

    ```

    kali >nice -n 10 /bin/slowprocess

    ```


    ### 使用 renice 更改运行进程的优先级

    `renice` 命令接受 –20 到 19 之间的绝对值，并将优先级设置为该特定级别，而不是在启动时的水平上增加或减少。此外，`renice` 需要你目标进程的
    PID 而不是名称。所以，如果 `slowprocess` 在你的系统上消耗了大量的资源，你想给它一个较低的优先级，从而允许其他进程获得更高的优先级和更多资源，你可以
    renice `slowprocess`（其 PID 为 6996）并给它一个高得多的 nice 值，如下：

    ```

    kali >renice 20 6996

    ```

    与 `nice` 类似，只有 root 用户可以将进程 renice 为负值以赋予其更高的优先级，但任何用户都可以 `renice` 友好地降低优先级。


    ### 杀死进程

    有时，进程会消耗过多的系统资源，表现出异常行为，或者至少卡死。这种行为的进程通常被称为僵尸进程（zombie process）。对你来说，最有问题的症状可能是僵尸进程浪费了资源，这些资源本可以更好地分配给其他有用进程。当你识别出一个问题的进程时，你可能想用
    `kill` 命令停止它。杀死程序有很多方法，每种方法都有自己的信号 数字。`kill` 命令有 64 种不同的 信号，每个信号的作用略有不同。在这里，我们关注你可能觉得最有用的几个。`kill`
    命令的语法为 `kill-signal PID`，其中信号开关是可选的。如果你不提供信号标志，它默认为 `SIGTERM`。


    ### 在后台运行进程


