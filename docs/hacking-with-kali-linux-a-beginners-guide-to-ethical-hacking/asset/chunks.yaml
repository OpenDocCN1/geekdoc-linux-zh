    # 第 7 章：网络安全


    ![](img/rsrc11B.jpg)


    ## 引言

    我们将网络安全定义为保护计算机系统、计算机网络及其相关程序免受数字形式攻击。通常情况下，网络攻击的目的是获取、修改甚至破坏敏感信息的访问。它们还试图从受害者那里勒索金钱，并中断业务的正常流程。


    ## 机密性、完整性和可用性

    这三者被著名地称为 `CIA` 三元组。我们可以将其描述为一种模型，其目的是指导任何给定组织的信息安全策略。为了避免将该三元组与美国中央情报局（Central
    Intelligence Agency）混淆，我们有时将其称为 `AIC` 三元组。这三个元素是安全最关键的组件。在我们的案例中，可以说可用性定义为保证授权人员可以可靠地访问信息；机密性被认为是一用于限制访问信息的协议；而完整性则是一项旨在证明所手信息既准确又可信赖的承诺。


    ### a) 机密性

    这是隐私的一种粗略等同。在确保正确的人可以访问关键信息的同时，采取强有力措施来确保机密性也是明智的。对于授权查看数据的人员，应当限制对相关数据的访问。在外部，根据数据落入未经授权的人手中可能导致的损害类型和程度对其进行分类并不罕见。可以根据这些类别实施多或少的严格措施。维护数据的机密性有时需要对授权查看/使用的人员进行专门培训。这通常涉及可能损害信息的安全风险。这无疑可以帮助获得适当授权的人了解各种风险因素，并为他们配备应对措施。培训的其他方面可能包括密码相关问题的最佳实践以及社会工程机制。


    这将帮助他们避免违反规范数据处理的规则，从而导致潜在的灾难性后果，尽管他们的意图可能是我们描述为高尚的。例如，使用路由号码或账户号码是确保机密性的有效措施。我们还可以利用数据加密来确保机密性。密码和用户
    ID 是一个正成为常见现象的标准程序的一部分，即双因素身份验证。它们有不同的选项。这些选项包括安全令牌（软令牌或钥匙扣）和生物识别验证。


    此外，用户有责任采取预防措施，确保其信息出现的地点以及完成交易所需的发送次数次数至最低。在拥有关键数据的情况下，可能需要采取额外措施。此类行动可能涉及信息存储在断开连接的存储设备上、隔离计算机上，甚至仅以硬质副本的形式存储。


    ### a) 完整性

    该三元组的这一组件包含确保数据在整个生命周期内的可信性、一致性和准确性。传输中的数据不被篡改至关重要。需要采取坚实的步骤来确保未经授权的人员不对数据进行任何修改。例如，在发生机密性泄露的情况下。在这里，应对措施可以包括用户访问控制和文件权限。为了防止授权用户的无意删除或错误更改，我们可以使用版本控制。同时，还需要存在机制来帮助检测由于非人类事件导致的数据变化，这些事件包括服务器崩溃或电磁脉冲。我们可以包括校验和和加密校验和（checksums）来帮助数据的完整性验证。最后，可能需要某些形式的冗余和备份，以帮助将其恢复到原始状态。


    ### b) 可用性

    对所有硬件的严谨维护确保了该硬件提供的服务始终具有可用性。故障设备应及时、充分地修理，以保持一个没有任何软件冲突的、运行良好的操作系统环境。还应该执行的维护方面之一是更新所有必要的系统组件。此外，还要为通信提供充足的带宽，并确保瓶颈发生频率降至最低。可以使用高可用集群、冗余、`RAID`
    甚至故障转移（failovers）来缓解硬件故障及其影响。


    对于可能发生的最坏情况，既能自适应又快速的灾难恢复至关重要。为了实现这一点，制定的灾难恢复计划必须是全面的。防止数据丢失或连接中断还需要考虑不可预见的的事件。例如火灾和自然灾害。备份数据的副本可以安全地存储在地理上相互隔离的地点，以防止因此类事件导致的数据丢失。此类站点还需要防水和防火。为了防止由于拒绝服务攻击（DoS）和网络入侵导致的停机和数据不可访问问题，我们可以使用额外的安全设备，例如代理服务器、防火墙和软件。


    ## CIA 引起的问题

    `CIA` 范式在涉及大数据时面临着巨大挑战。这主要是因为需要保护的数据量极其巨大、数据格式多种化，最后是源源的多样性。灾难恢复计划和重复的数据集使得原本就高的成本变得更高。此外，通常缺乏监管，因为大数据的主要目标用于分析，即收集数据并使用它进行某种有用的解释。我们都认识这位人物——爱德华·斯诺登（Edward
    Snowden），他揭了这个问题。安全机构在全球范围内收集海量的个人私有数据。


    为了防止个人信息在 `IoT` 环境中暴露，我们有特殊的考虑，被称为物联网隐私。这意味着几乎任何逻辑或物理实体都可以分配一个唯一标识符，以实现在网络（包括互联网）上进行自主通信。


    从特定端点传输的数据本身并不一定会导致任何隐私问题。然而，问题的关键在于，当访问、收集和分析来自多个端点的碎片化数据时，就可以获取敏感信息。保护物联网本身是一项巨大的挑战，因为除了计算机之外，它还包含许多联网设备。此类设备在大多数情况下通常使用弱的默认密码，或者在某些情况下，设备未打补丁。除非
    `IoT` 得到充分保护，否则它可能被用作独立的攻击向量或成为僵尸网络（thingbot）的一部分。最近，研究人员证明了通过一个支持 Wi-Fi 的灯泡就可以破坏网络。对我们来说，考虑开发中的许多网络能力产品的安全性是非常关重要的。


    ## 加密

    ![](img/rsrc121.jpg)

    我们将加密定义为一种机制，将明文或其他数据类型从当前的可读形式转变为编码方式。只有拥有解密密钥的实体才能解码数据。这是一项重要的措施，通常用于跨网络提供端到端数据安全。加密作为一种主动措施，通常在整个互联网上用于保护关键信息。个人和组织也可以选择使用加密来确保敏感数据的安全。


    ### a) 加密如何工作

    明文数据（也称为未加密数据）通过使用加密算法加加密密钥来进行加密。其结果是密文，只有在使用正确的密钥进行解密时，才能以原始形式显示。相反，解密是加密的反过程。加密中使用的步骤以相反的顺序执行。在现代，我们有两种常用的加密算法。它们是对称加密和非对称加密。


    当涉及到对称加密机制时，使用单个密钥进行加密。高级加密标准（`AES`）是最常用的对称密钥密码之一。它的设计初目的是保护政府的机密信息。与非对称加密相比，这种机制更快。然而，发送者必须与接收者共享加密密钥。密钥需要以安全的方式管理。这在大多数情况下使用了非对称算法。


    另一方面，我们有非对称加密。我们也可以将其称为公钥加密。在这里，使用了两个不同的密钥。它们在数学上是关联的。密钥如下；一个密钥是公钥，另一个是私钥。公钥通常可以与任何人共享。私钥必须保密。在非对称加密中，常用的加密算法是
    `RSA`。这在某种程度上是因为两个密钥可以加密消息，这意味着使用与加密密钥相反的密钥来用于解密。


    ### b) 加密的优势

    存储在计算机系统中的或通过互联网或其他任何计算机网络传输的数字数据的机密性通过使用加密得到了保护。支付卡行业安全标准（`PCI DSS`）等组织要求对敏感数据进行加密，以防止未经授权实体访问。我们还有一些标准要求或建议数据加密。如今，现代加密算法发挥着整合作用，确保通信和
    IT 系统安全不仅具有机密性，还具有下述的安全要素：


    '
- fmt: '

    * **Authentication**: the origin of a given message should be able to be verified.

    * **Integrity**: This has got to do with keeping the message intact. That is,
    the contents of messages have not been altered or deleted from the time it was
    sent.

    * **Nonrepudiation**: Here, non-repudiation means that a particular sender cannot
    dispute that they send the message.


    ## Backup and Redundancy


    Usually, we use backup where copies of data are created in anticipation of a catastrophic
    loss. On the other hand, redundancy is a lot more than just data storage. Redundancy
    aims to provide a continuity of service regardless of what will happen. Data redundancy
    ensures that the storage of data is done at multiple and heterogeneous locations.
    We also have what we call network redundancy whereby a given network is configured
    in such a way that it has numerous alternative systems. The alternative systems
    serve to ensure continuity of service regardless of what happens.


    ### Data Redundancy

    For any organization, it is essential first that regular services are restored
    as soon as possible after there has been a security breach. Data should be able
    to be reconstructed as quickly as possible. To this end, businesses have come
    up with various ways to make sure there is data redundancy. It is common knowledge
    that these methods come with their own merits in terms of cost-effectiveness,
    speed, and management. The most common way is using off-site tape backups. In
    this method, magnetic tapes are used to store a complete bit-for-bit copy of a
    storage volume. The tapes can be transferred to an off-site storage facility where
    they can be easily retrieved whenever there is a catastrophic failure. Besides,
    we can use Cloud Backup to safeguard data against losses.


    ### Network Redundancy

    Most of the infrastructure we use for our networks are unbelievably fragile. For
    instance, when a router burns out due to one reason or another, the result is
    that there will be a prolonged period of network downtime. To mitigate against
    this, businesses make sure that networks they use have an adequate redundancy
    so that they can survive and provide services in cases of an emergency. Fundamentally,
    network redundancy means that no matter what type of failure occurs, a network
    will still be up and running. To be able to do this, we can have multiple network
    devices such as hubs, routers, and switches configured to stand in for one of
    them that fails. We also have ISP redundancy where a gateway in the network is
    joined to more than one separate ISP. Just like with the devices, one ISP will
    take over whenever there is a failure. In cases where a network is functioning
    correctly, we can use the ISPs to share the traffic resulting in reduced congestion
    of the network. This here is called load sharing.


    ## Preventing a SPOF


    SPOF is full for single point of failure. We do not desire that one critical part
    of a system failure can render the entire system unusable. Any planning needs
    to mitigate this phenomenon. A single point of failure can be reduced or eliminated
    by way of redundancy. This will make sure that there is not a single component
    that can prevent the proper working of a system.


    ## Chapter 8: Becoming Secure and Anonymous


    ### Introduction

    Today, nearly everything we do on the internet is tracked. Whoever is doing the
    tracking, whether it be Google tracking our online searches, website visits, and
    email or the National Security Agency (NSA) cataloging all our activities, all
    our online moves are being recorded, indexed, and then mined for someone’s benefit.
    The average individual and the hacker, in particular, need to understand how to
    limit this tracking and remain relatively anonymous on the web to limit this ubiquitous
    surveillance. In this chapter, we look at how you can navigate the World Wide
    Web anonymously (or as close as you can get) using four methods:


    * The Onion Network

    * Proxy servers

    * Virtual private networks

    * Private encrypted email

