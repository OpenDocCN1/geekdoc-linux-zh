    没有任何一种方法能百分之百确保你的活动免受窥视，而且只要有足够的时间和资源，任何事情都可以被追踪。然而，这些方法可能会让追踪者的工作变得困难得多。


    ## 网络是如何暴露我们身份的


    首先，让我们从高层面上讨论一下我们在互联网上的活动被追踪的某些方式。我们不会介绍所有的追踪方法，也不会对任何一个过程进行过详细的描述，因为那超出了本书的范围。事实上，这样的讨论本身就可以写满一整本书。


    首先，你的 `IP address` 会在你穿过互联网时识别你的身份。从你的机器发送的数据通常会标记有你的 `IP address`，这使得你的活动很容易被追踪。


    其次，`Google` 和其他电子邮件服务会“读取”你的邮件，寻找关键词以便更高效地向你投放广告。尽管还有许多更复杂、更耗费时间和资源的方法，但这些是我们在本章中尝试防止的。让我们先看看
    `IP addresses` 是如何在互联网上暴露我们身份的。


    当你跨越互联网发送一个数据包时，它包含了数据源地和目的地的 `IP addresses`。通过这种方式，数据包知道它要去哪里以及去哪里返回响应。每个数据包都会经过多个互联网路由器，直到找到它的目的地，然后跳回发送者。对于一般的上网浏览，每一次“跳跃”都是数据包到达目的地时经过的路由器。发送者和目的地之间可能有多达
    20–30 次跳跃，但通常，任何数据包都会少于 15 次跳跃找到目的地。


    当数据包穿过互联网时，任何拦截数据包的人都可以看到是谁发送了它、它去过哪里以及它正要去哪里。这就是为什么单向网站可以在你到达时识别你的身份并自动登录，这也是某人如何追踪你在互联网上去过什么地方的原因。要查看数据包在你和目的地之间可能经过哪些跳跃，你可以使用
    `traceroute` 命令，如下所示。输入 `traceroute` 和目标 `IP address` 或域名，该命令将向目的地发送数据包并追踪这些数据包的路径。


    ## 洋葱路由器系统 (The Onion Router System)


    在 20 世纪 90 代，美国海军研究办公室 (`ONR`) 致力于开发一种用于间谍目的的匿名上网方法。该计划是建立一个与互联网路由器独立的路由器网络，该网络可以对流量进行加密，并且只存储上一个路由器的未加密
    `IP address`——这意味着路径上的所有其他路由器地址都是加密的。这个想法是，任何观察流量的人都无法确定数据的来源或目的地。这项研究在 2002 年被称为“洋葱路由器项目
    (Tor Project)”，现在任何人都可以使用它在网络上进行相对安全和匿名的浏览。


    ### Tor 如何工作


    通过 Tor 发送的数据包通常不会通过那些受许多人严密监控的普通路由器发送，而是通过全球范围内超过 7,000 多个路由器组成的网络发送，这得益于允许 Tor
    利用其计算机的志愿者。除了使用一个完全独立的路由器网络外，Tor 还对每个数据包的数据、终端点和发送者 `IP address` 进行了加密。在每一次跳跃中，信息都会被加密，然后在被下一个跳跃接收时被解密。通过这种方式，每个数据包只包含关于路径上上一个跳跃的信息，而不包含源地的
    `IP address`。如果有人拦截了流量，他们只能看到上一个跳跃的 `IP address`，而网站所有者只能看到发送流量的最后一个路由器的 `IP address`。


    这确保了在互联网上的相对匿名性。要使用 Tor，你需要从 `https://www.torproject.org/` 安装 Tor 浏览器。安装后，你可以像使用任何旧互联网浏览器一样使用它。通过使用此浏览器，你将通过一组独立的路由器畅览互联网，并能够在不被“老大哥
    (Big Brother)”追踪的情况下访问网站。遗憾的是，代价是通过 Tor 浏览器上网可能会慢得多；因为路由器远没有那么多，所以该网络的带宽是有限的。


    除了能够访问传统互联网上的几乎任何网站外，Tor 浏览器还能够访问暗网。构成暗网的网站需要匿名性，因此它们仅允许通过 Tor 浏览器访问，并且它们的顶级域名
    (`TLD`) 以 `.onion` 结尾。暗网因非法活动而臭名昭著，但那里也存在许多合法服务。不过，要提醒一下：在访问暗网时，你可能会遇到许多人认为反犯的材料。


    a) 安全忧虑


    美国和其他国家的情报和间谍机构认为 Tor 网络是对国家安全的威胁，认为这种匿名网络使外国政府和恐怖分子能够在不被监控的情况下通信。因此，我们有许多强大且雄心勃勃的研究项目正致力于破解
    Tor 的匿名性。Tor 的匿名性曾被这些当局破解，并且可能再次被破解。例如，`NSA` 运行自己的 Tor 路由器，这意味着当你使用 Tor 时，你的流量可能正在经过
    `NSA` 的路由器。


    如果你的流量从 `NSA` 的路由器出口，那更糟糕了，因为出口路由器总是知道你的目的地。`NSA` 还有一种被称为 `traffic correlation`
    的方法，涉及寻找入站流量中的模式，这能够破解 Tor 的匿名性。虽然这些破解 Tor 的尝试不会影响 Tor 在向商业服务（如 `Google`）隐藏身份的效果，但它们可能会限制浏览器在防止间谍机构追踪你匿名的效果。


    ## 代理服务器


    在互联网上实现匿名性的另一种策略是使用代理，代理是作为流量中间人的中间系统：用户连接到代理，流量在被传递之前会被赋予代理的 `IP address`。


    当流量从终点返回时，代理会将流量发回源端。通过这种方式，流量看起来来自代理而不是原始的 `IP address`。很可能，代理会保留你的流量日志。然而，调查实体需要获得搜查令或传票才能获取这些日志。为了让你的流量更难被追踪，你可以使用多个代理，这种策略被称为
    `proxy chain`，我们将在本章稍后部分介绍它。`Kali Linux` 有一个非常出色的代理工具叫做 `proxychains`，你可以设置它来隐藏你的流量。`proxychains`
    命令的语法非常直观，如下所示：


    ```

    kali >proxychains <你想要代理的命令> <arguments>

    ```


    你提供的参数可能包括一个 `IP address`。


    ### 在配置文件中设置代理


    在本节中，我们为 `proxychains` 命令设置一个使用的代理。与 Linux/Unix 中的几乎每个应用程序一样，`proxychains` 的配置由配置文件管理——具体为
    `/etc/proxychains.conf`。使用以下命令在你选择的文本编辑器打开配置文件（如有必要，将 `Leafpad` 替换为你选择的编辑器）：


    ```

    kali >leafpad /etc/proxychains.conf

    ```


    你应该能看到一个 `proxychains.conf` 文件。滚动到该文件的第 61 行，你应该看到 `ProxyList` 部分。我们可以通过在列表中输入我们想要使用的代理的
    `IP addresses` 和端口来添加代理。


    a) 安全忧虑


    关于代理安全的最后一点，请务必明智地选择代理：`proxychains` 的好坏取决于你所使用的代理。如果你打算保持匿名，如前所述，不要使用免费代理。黑客使用可以信赖的付费代理。免费代理可能正在出售你的
    `IP address` 和浏览历史。正如著名的密码学家和安全专家 `Bruce Schneier` 所说过的：“如果某物是免费的，你不是客户，而是产品。”换句话说，任何免费产品都可能收集你的数据。为什么他们要提供免费的代理？虽然
    `VPN` 可以让流量匿名，但受到足够的执法机构压力，可能会暴露你的身份。最好要意识到作为匿名来源的 `VPN` 的局限性。


    ## 虚拟专用网络 (Virtual Private Networks)


    使用虚拟专用网络是保持网络流量相对匿名和安全的有效方法。`VPN` 用于连接到中间设备（如路由器），将你的流量标记为该路由器的 `IP address`。使用
    `VPN` 确实可以增强你的安全防护，但它不能保证匿名。


    `VPN` 的妙之处在于它们简单且易用。你可以与 `VPN` 供应商开通账户，然后每次登录电脑时无缝连接到 `VPN`。你可以像照常一样使用浏览器，但对任何观察者来说，流量似乎来自
    `VPN` 的 `IP address` 和位置。此外，你与 `VPN` 设备之间的所有流量都是加密的，因此即使是你的互联网提供商也看不到你的流量。


    除此之外，`VPN` 对于规避政府控制的内容和信息有用。例如，如果你的国家政府限制你访问带有特定政治信息的网站，你可能可以使用国外的 `VPN` 来访问这些内容。一些媒体公司（如
    `Netflix`）限制源自其国家 IP 地址的访问。使用位于这些服务允许国家的 `VPN` 可以绕过这些访问限制。一些最好的 `VPN` 服务包括：`IPVanish`、`NordVPN`、`ExpressVPN`、`CyberGhost`、`Golden
    Frog VPN`、`Hide My Ass`、`Private Internet Access`、`PureVPN`、`TorGuard` 和 `Buffered
    VPN`。


    `VPN` 的优势在于你的流量在离开电脑时经过加密，从而保护你免受窥探，并且当你访问网站时，你的 `IP address` 会被 `VPN address`
    掩盖。和代理服务器一样，`VPN` 的所有者拥有你的原始 `IP address`。


    ## IPsec


    `IPsec` 用于在 IP 网络上通信两个点之间提供数据完整性、身份验证和机密性。它是互联网工程任务组协议，还对加密、解密和验证的数据包进行了定义。此外，密钥管理和安全密钥交换协议也定义在
    `IPsec` 中。


    a) IP 安全的功能以下是 `IPsec` 可以完成的任务：


