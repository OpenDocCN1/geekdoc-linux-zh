    要将文件的所有权从一个组转移到另一个组，我们可以使用 `chgrp`（更改组）命令。黑客通常更倾向于单独行动而不是小组，但几位黑客或渗透测试人员合作完成项目也未曾不可，在这种情况下，使用组是必要的。例如，你可能有一组渗透测试人员和一个安全团队成员负责同一个项目。在这个示例中，渗透测试人员是
    root 组，这意味着他们拥有所有的权限和访问权限。root 组需要访问黑客工具，而安全人员只需要访问入侵检测系统（IDS）等防御性工具。假设 root 组下载并安装了一个名为
    `newIDS` 的程序；root 组需要将所有权更改为安全组，以便安全组可以随意使用它。为此，root 组将输入以下命令：


    ```bash

    chgrp security newIDS

    ```

    此命令将 `newIDS` 的所有权传递给 `security` 组。现在你需要知道如何检查这些分配是否生效。你可以通过检查文件的权限来实现。


    ## 检查和更改权限


    当你想要查找哪些用户被授予了文件或目录权限时，可以使用 `ls` 命令。然而，它需要加上 `-l`（long）后缀，该后缀用于以长格式显示目录内容。显示的列表将包含权限。语法如下：


    ```bash

    ls -l /usr/share/hashcat own

    ```

    输出将显示文件的权限等其他信息。我们有三组三个字符，由读 (r)、写 (w) 和执行 (x) 的某种组合组成，顺序如下。第一组代表所有者的权限；第二组代表组的权限；最后一组代表所有其他用户的权限。


    无论你查看的是哪一组三字母字母，只要你看到第一个字母是 `r`，该用户或用户组就有权限打开并读取该文件或目录。中间字母为 `w` 意味着他们可以写入（修改）文件或目录，末尾的
    `x` 意味着他们可以执行（或运行）文件或目录。如果任何 `r`、`w` 或 `x` 被替换为连字符（`-`），则相应的权限未被授予。注意，用户只能拥有执行二进制文件或脚本的权限。


    ## 更改权限


    我们可以使用 Linux 命令 `chmod` 来更改权限。只有 root 用户或文件所有者才能更改权限。在本节中，我们使用两种不同的方法来更改 `hashcat.hcstat`
    的权限。首先，我们使用权限的数字表示法，然后使用符号表示法。


    ### 使用数字符号更改权限


    我们可以使用快捷方式，通过一个数字来表示一组 `rwx` 权限。就像操作系统的底层所有内容一样，权限是以二进制表示的，因此开启和关闭关关分别由 1 和 0
    表示。你可以将 `rwx` 权限想象成三个开启/关闭开关，因此当所有权限都被授予时，这等同于二进制的 `111`。这样的二进制集可以通过转换为八进制轻松地表示为一个数字，八进制是一种从
    0 开始到 7 结束的位数字系统。一个八进制数字代表一组三个二进制位，这意味着我们可以用一个数字表示整个 `rwx` 组。


    ### 使用 UGO 更改权限


    尽管数字方法可能是 Linux 中更改权限最常用的方法，但也有人认为 `chmod` 的符号方法更直观。两种方法的效果同样好，所以找到适合你自己的方法即可。符号方法通常被称为
    UGO 语法，代表用户（user 或所有者）、组（group）和其他（others）。UGO 语法非常直观。输入 `chmod` 命令，然后输入你想要更改权限的用户，提供
    `u` 代表用户、`g` 代表组或 `o` 代表其他，随后是三个操作符之一：


    - `-` 移除权限

    - `+` 添加权限

    - `=` 设置权限


    在操作符之后，包含你想添加或移除的权限（`rwx`），最后是应用该权限的文件名。因此，如果你想从文件 `hashcat.hcstat` 所属的用户中移除写入权限，你可以输入：


    ```bash

    chmod u-w hashcat.hcstat

    ```

    此命令表示从用户 (`u`) 的 `hashcat.hcstat` 文件中移除 (`-`) 写入 (`w`) 权限。现在当你再次用 `ls -l` 检查权限时，你应该看到
    `hashcat.hcstat` 文件对用户不再具有写入权限了：


    ### 为新工具授予 root 执行权限


