- fmt: "\nMake sure that your Raspberry Pi is running the Raspbian operating system;\
    \ this is simply another Linux distribution specially ported for the Raspberry\
    \ Pi CPU. You can find download and installation instructions for Raspbian at\
    \ https://www.raspberrypi.org/downloads/raspbian/. Nearly everything you have\
    \ learned in this book applies to the Raspbian OS on the Raspberry Pi as well\
    \ as Kali, Ubuntu, and other Linux distributions. Once you have your Raspbian\
    \ OS downloaded and installed, you’ll need to connect your Raspberry Pi to a monitor,\
    \ mouse, and keyboard and then connect it to the internet. If this is all new\
    \ to you, check out the instructions at https://www.raspberrypi.org/learning/hardwareguide/.\
    \ With everything set up, log in with the username `pi` and the password `raspberry`.\n\
    \n# Building the Raspberry Spy Pi\n\nThe first step is to make sure that `SSH`\
    \ is running and enabled on the Raspberry Spy Pi. `SSH` is usually off by default,\
    \ so to allow it to, go to the `Preferences` menu and launch the `Raspberry Pi\
    \ Configuration`. Then go to the `Interfaces` tab and, next to `SSH`, click `Enabled`\
    \ (if it is not already checked) and click `OK`. When `SSH` is enabled, you can\
    \ start it on your Raspberry Spy Pi by opening a terminal and entering the following:\n\
    \n```\nkali >service ssh start\n```\n\nNext, you need to attach your camera module.\
    \ If you are using a Raspberry Pi version 3 board, there’s only one place to connect\
    \ it. Switch the Pi off, attach the module to the camera port, and then switch\
    \ it on again. Note that the camera is very fragile and must never come into contact\
    \ with the general-purpose Input/output pins; otherwise, it might short and die.\n\
    \nNow, with the `SSH` service up and running, place the Raspberry Spy Pi somewhere\
    \ within your home, school, or some other location you want to spy on. It must,\
    \ of course, be connected to the local area network, either by Ethernet cable\
    \ or, ideally, via WiFi. \n\nNow, you need to obtain the IP address of your Raspberry\
    \ Pi. As previously learned, you can get a Linux device’s IP address by using\
    \ `ifconfig`:\n\n```\npi >ifconfig\n```\n\nWe are going to use the IP address\
    \ `192.168.50.5` for Pi in this book. Therefore, ensure you are using the IP address\
    \ of your Raspberry Spy Pi wherever you see this address appearing in this chapter.\
    \ Now, from your Kali system, you should be able to connect directly to and control\
    \ your Raspberry Spy Pi and use it as a remote spying system. In this simple example,\
    \ your system will need to be on the same network as the Pi. To connect to the\
    \ remote Raspberry Spy Pi via `SSH` from your Kali system, enter the following,\
    \ remembering to use your own Pi’s IP address.\n\n```\nkali >ssh pi@192.168.50.5\n\
    ```\n`pi@192.168.50.5`\n`s password:`\n\n# Configuring the Camera\n\nNext, we\
    \ need to configure the camera. To do so, start the Raspberry Pi configuration\
    \ tool by entering the following command:\n\n```\npi >sudo raspi-config\n```\n\
    \nThis should start a graphical menu like the one shown below:\n![](rsrcZW.jpg)\n\
    \nScroll down to `6 Enable Camera` and press `ENTER`. Now, scroll to the bottom\
    \ of this menu and select `Finish` and press `ENTER`.\n\n# Information Extraction\
    \ from MYSQL\n\nThe database that is most widely used in database-driven web applications\
    \ is `MySQL`. No doubt about it. In the modern era, where nearly every website\
    \ is database-driven, this means `MySQL` holds the data for most of the web.\n\
    \nLike Linux, `MySQL` is open source and general public licensed (`GPL`), and\
    \ you’ll find it preinstalled on nearly every Linux distribution. Being free,\
    \ open-source, and powerful, `MySQL` is the preferred choice for many web applications.\
    \ Examples are popular websites like YouTube, WordPress, Facebook, and so on.\n\
    \n## Start MySQL\n\nAs you would guess, Kali Linux comes with `MySQL` pre-installed.\
    \ To start your `MySQL` service, enter the following into the terminal:\n\n```\n\
    kali >service mysql start\n```\n\nNext, you need to authenticate yourself by logging\
    \ in.\n\n## Setting MySQL Password\n\nLet’s see what users are already in our\
    \ `MySQL` system by entering the following. (Note that commands in `MySQL` are\
    \ terminated with a semicolon.)\n\n```\nmysql >select user, host, password from\
    \ mysql.user;\n```\n\nLet us assign a password to `root`. To do so, we shall first\
    \ select a database to work with. `MySQL` on your system will come with some databases\
    \ already set up. Use the `show databases;` command to see all the available databases:\n\
    \n```\nmysql >show databases;\n```\n\n`MySQL` comes with three databases by default,\
    \ two of which `information_schema` and `performance_schema` are administrative\
    \ databases that we will not use here. We will use the nonadministrative database,\
    \ `mysql`, which has been included for your purposes. To begin using the `mysql`\
    \ database, enter:\n\n```\nmysql >use mysql\n```\n\nThis command connects us to\
    \ `mysql`. Now, we can set the password for the `root` user to `hackers-arise`\
    \ with the following command:\n\n```\nmysql >update user set password = PASSWORD(\"\
    hacking-tutorial\") where user = 'root';\n```\n\nThis command will update the\
    \ user by setting the user’s `root` password to `hacking-tutorial`.\n\n## Accessing\
    \ a Remote Database\n\nTo access a `MySQL` database on the `localhost`, we use\
    \ the following syntax:\n\n```\nkali >mysql -u <username> -p\n```\n\nTo access\
    \ a remote database, then, we are required to give the IP address or the hostname\
    \ of the system which is being used to host the `MySQL` database. See the example\
    \ below:\n\n```\nkali >mysql -u root -p 192.168.10.1\n```\n\nThe command above\
    \ will link us to the `MySQL` database instance at the IP address `192.168.10.1`\
    \ and will ask us for a password.\n\n## Connecting to a Database\n\nWith access\
    \ to the system, we want to snoop around. The next logical step will be to ascertain\
    \ if there exist any databases that are worth accessing. To do this, you will\
    \ need to discover the databases located on the system you have had access to:\n\
    \n```\nmysql >show databases;\n```\n\nJust like the norm in other database management\
    \ systems, you will be able to connect to the database you want just by entering\
    \ `use databasename;` in `MySQL`.\n\n## Examining Data\n\nFor you to view data\
    \ located on the table, you will need to make use of the `SELECT` command. For\
    \ this command to work, it needs the information below:\n\n*   The table that\
    \ holds the data you want to view\n*   The columns within that table that contain\
    \ the data you wish to view\n"
