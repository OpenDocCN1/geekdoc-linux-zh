    遗憾的是，Linux 并没有像 Windows 和其他某些操作系统那样的专门用于重命名文件的命令，但它确实有一个 `mv`（move）命令。`mv` 命令可以将文件或目录移动到新位置，也可以给现有文件起新名字。要将
    `newfile` 重命名为 `newfile2`，你需要输入以下内容：


    ```

    kali >mv newfile newfile2

    kali >lsoldfile newfile2

    ```

    下面是相同操作的截图。![](img/rsrcKA.jpg) 现在当你列出（`ls`）该目录，你会看到 `newfile2` 而不是 `newfile`，因为它已经被重命名了。你也可以对目录执行相同的操作。


    ### 删除文件

    要删除文件，你可以使用 `rm` 命令，如下所示：


    ```

    kali >rm newfile2

    ```

    如果你现在对该目录进行长列表显示，就可以确认该文件已被删除。


    ### 删除目录

    删除目录的命令与删除文件的 `rm` 命令类似，但在后面添加了 `dir`（代表 directory），如下所示：


    ```

    kali >rmdir newdirectory

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```

    下面是相同操作的截图。![](img/rsrcKS.jpg) 需要注意的是，`rmdir` 不会删除非空目录，而是会给你一个警告消息提示“目录不为空”，正如你在示例中看到的。你必须在删除目录之前先删除目录中的所有内容。这样做是为了防止你意外删除并不打算删除的对象。如果你想一次性删除目录及其内容，可以在
    `rm` 之后使用 `-r` 选项，如下所示：


    ```

    kali >rm -r newdirectory

    ```

    不过提醒你：在使用 `rm` 时要谨慎使用 `-r` 选项，至少刚开始，因为很容易误删珍贵的文件和目录。例如，在主目录中使用 `rm -r` 会删除那里的每一个文件和目录，这显然不是你想要执行的。


    ### 搜索工具/软件包

    在下载软件包之前，你可以检查你的软件库中是否有你需要的包，软件库是你的操作系统存储软件包信息的地方。`apt` 工具具有搜索功能，可以检查软件包是否可用。语法非常直观：


    ```

    apt-cache search keyword

    ```

    已附上截图供你参考。![](img/rsrcM2.jpg) 注意，我们使用 `apt-cache` 命令来搜索 apt 缓存或存储包名称的地方。例如，如果你正在搜索入侵检测系统
    `Snort`，你将输入下所示命令。


    ```

    kali >apt-cache search snort

    fwsnort – Snort-to-iptables rule translator

    ipl - IP protocols logger

    --snip--snort – flexible Network Intrusion Detection System

    Snort - common - flexible Network Intrusion Detection System - common files

    --snip--

    ```

    请注意下方截图命令之间的精确间距。![](img/rsrcMF.jpg) 如你所见，许多文件中包含关键词 `snort`，但在输出的中间部分，我们看到了 `snort
    – flexible Network Intrusion Detection System`。这就是我们要找的内容。


    ### 安装软件

    现在你已经知道仓库中存在 `snort` 软件包，你可以使用 `apt-get` 下载软件。要在终端中从操作系统的默认仓库中安装软件，请使用 `apt-get`
    命令，后跟关键词 `install`，然后是你想要安装的包名。语法如下：


    ```

    apt-get install packagename

    ```

    让我们尝试在你的系统上安装 `Snort`。输入 `apt-get install snort` 作为命令语句，如下所示。


    ```

    kali >apt-get install snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    Suggested packages:snort-doc

    The following NEW packages will be installed:

    snort

    --snip—Install these packages without verification [Y/n]?

    ```

    这是相同操作的截图。![](img/rsrcN2.jpg) 你看到的输出告诉了你正在安装的内容。如果一切看起来都正确，在提示时输入 `y`，你的软件安装就会继续。


    ### 软件

    删除软件时，使用带有 `remove` 选项的 `apt-get`，后跟要删除的软件名称。下所示示例。


    ```

    kali >apt-get remove snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following packages were automatically installed and are no longerrequired:

    libdaq0 libprelude2 oinkmaster snort-common-libraries snort-rules-default

    --snip--

    Do you want to continue [Y/n]?!

    ```

    ![](img/rsrcNJ.jpg) 再次，你将看到正在执行的任务，并会被询问是否要继续。你可以输入 `y` 来卸载，但你可能想保留 `Snort`，因为我们以后还会再次使用它。`remove`
    命令不会删除配置文件，这意味着你可以在以后重新安装同一个包而无需重新配置。如果你想在删除包的同时也删除配置文件，可以使用 `purge` 选项，如下所示：


    ```

    kali >apt-get purge snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following packages were automatically installed and are no longer required:

    libdaq0 libprelude2 oinkmaster snort-common-libraries snort-rules-default

    --snip--

    Do you want to continue [Y/N]?!

    ```

    ![](img/rsrcNZ.jpg) 在提示处输入 `Y` 以继续清理软件包和相关文件。为了保持软件的轻量化和模块化，许多 Linux 软件包被拆分成许多不同程序可能使用的软件单元。当你安装
    `Snort` 时，你还安装了 `Snort` 运行所需的几个依赖项或库，以便它可以运行。现在你正在删除 `Snort`，那些其他库或依赖项不再被需要了，因此它们也被删除了。


    ### 更新软件包

    软件仓库会定期更新新软件或现有软件的新版本。这些更新不会自动推送到你这里，因此你需要请求将这些更新应用到你的系统中。更新（updating）与升级（upgrading）不同：更新是更新仓库中可下载的软件包列表，而升级则是将软件包升级到仓库中的最新版本。你可以通过在输入
    `apt-get` 命令后跟关键词 `update` 来更新你的系统。这将搜索你系统上所有的软件包并检查是否有可用更新。如果有，则将下载这些更新。见下例示例。


    ```

    kali >apt-get update

    Get:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling InRelease [30.5kb]

    Get:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main amd64 Packages[14.9MB]

    Get:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling non-free amd64 Packages[163kb]

    Get:4 http://mirrors.ocf.berkeley.edu/kali kali-rolling/contrib amd64 Packages
    [107kB]

    Fetched 15.2 MB in 1min 4s (236 kB/s)

    Reading package lists... Done

    ```

    你系统中仓库中的可用软件列表将被更新。如果更新成功，你的终端将显示 `Reading package lists... Done`，如上所示。注意，仓库名称以及时间、大小等值可能会因你的系统而不同。


    ### 升级软件包

    要升级系统上的现有软件包，请使用 `apt-get upgrade`。由于升级可能会更改你的软件，你必须以 `root` 身份登录或使用 `sudo` 命令。

