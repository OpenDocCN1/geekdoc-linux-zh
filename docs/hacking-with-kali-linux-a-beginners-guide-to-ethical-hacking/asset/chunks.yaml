    files from unwanted access or tampering by granting select users’ permissions
    to read, write, or execute files. For each file and directory, we can specify
    the permission status for the file’s owner, for groups of users, and all other
    users. This is a necessity in a multiuser, enterprise-level operating system.
    The alternative would be quite chaotic. In this chapter, I will show you how to
    check for and change permissions on files and directories for select users, how
    to set default file and directory permissions, and how to set special permissions.
    Finally, you will see how a hacker’s understanding of permissions might help them
    exploit a system.Types of UsersAs you know, in Linux, the root user is all-powerful.
    The root user can do just about anything on the system. Other users on the system
    have more limited capabilities and permissions and seldom have the access that
    the root user has. These other users are usually collected into groups that generally
    share a similar function. In a commercial entity, these groups might be finance,
    engineering, sales, and so on. In an IT environment, these groups might include
    developers, network administrators, and database administrators. The idea is to
    put people with similar needs into a group that is granted relevant permissions;
    then each member of the group inherits the group permissions. This is primarily
    for the ease of administering permissions and, thus, security. The root user is
    part of the root group by default. Each new user on the system must be added to
    a group to inherit the permissions of that group.Granting PermissionsEach file
    and directory must be allocated a particular level of permission for the different
    identities using it. The three levels of permission are listed hereunder:r - Read
    permission. This grants permission only to open and view a file.w - Write permission.
    This allows users to view and edit a file.x - Execute permission. This will enable
    users to execute a file (This does not guarantee viewing or editing it).In this
    way, the root user can grant users a level of permission depending on what they
    need the files for. When a file is created, typically the user who created it
    is the owner of the file, and the owning group is the user’s current group. The
    owner of the file can grant various access privileges to it. Let us have a look
    at how to change permissions to pass ownership to individual users and groups.


    1.  Granting Ownership to an Individual User


    To move ownership of a file to a different user so that they can control permissions,
    we can use the chown (or change owner) command:kali >chown ➊ John ➋ /tmp/johnsfileHere,
    we give the command, the name of the user we are giving ownership to, and then
    the location and name of the relevant file. This command grants the user account
    for John ➊ ownership of johnsfile ➋ .


    2.  Granting Ownership to a Group'
