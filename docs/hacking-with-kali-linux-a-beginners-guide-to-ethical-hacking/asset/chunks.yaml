- fmt: '

    # Finding Yourself with `pwd`


    The command line in Linux does not always make it apparent which directory you’re
    presently in unlike that in Windows or macOS. To navigate to a new directory,
    you usually need to know where you are currently. The present working directory
    command, `pwd`, returns your location within the directory structure. Enter `pwd`
    in your terminal to see where you are:


    ```bash

    kali >pwd

    /root

    ```


    In this case, Linux returned `/root`, telling me I’m in the root user’s directory.
    And because you logged in as `root` when you started Linux, you should be in the
    root user’s directory, too, which is one level below the top of the filesystem
    structure (`/`). If you’re in another directory, `pwd` will return that directory
    name instead.


    # Checking Your Login with `whoami`


    In Linux, the one “all-powerful” superuser or system administrator is called `root`,
    and it has all the system privileges needed to add users, change passwords, change
    privileges, and so on. Of course, you do not want just anyone to have the ability
    to make such changes; you want someone who can be trusted and has proper knowledge
    of the operating system. As a hacker, you usually need to have all those privileges
    to run the programs and commands you need, so you may want to log in as `root`.
    A Linux user can see which user they are logged in as using the `whoami` command
    as below:


    ```bash

    kali >whoami

    root

    ```


    Here, the user is logged in as `root`.


    # Navigating the Linux Filesystem


    Navigating the filesystem from the terminal is an essential Linux skill. To get
    anything done, you need to be able to move around to find applications, files,
    and directories located in other directories. In a GUI-based system, you can visually
    see the directories, but when you’re using the command-line interface, the structure
    is entirely text-based, and navigating the filesystem means using some commands.


    # Changing Directories with `cd`


    To change directories from the terminal, use the change directory command, `cd`.
    For example, here’s how to change to the `/etc` directory used to store configuration
    files:


    ```bash

    kali >cd /etc

    root@kali:/etc#

    ```


    The prompt changes to `root@kali:/etc`, indicating that we’re in the `/etc` directory.
    We can confirm this by entering `pwd`:


    ```bash

    root@kali:/etc# pwd

    /etc

    ```


    To move up one level in the file structure (toward the root of the file structure,
    or `/`), we use `cd` followed by double dots (`..`), as shown here:


    ```bash

    root@kali:/etc# cd ..

    root@kali:/# pwd

    /root

    root@kali:/#

    ```


    This moves us up one level from `/etc` to the `/root` directory, but you can move
    up as many levels as you need. Just use the same number of double dot pairs as
    the number of levels you want to move:


    *   You would use `..` to move up one level.

    *   You would use `.. ..` to move up two levels.

    *   You would use `.. .. ..` to move up three levels, and so on.


    So, for example, to move up two levels, enter `cd` followed by two sets of double
    dots with a space in between:


    ```bash

    kali >cd .. ..

    ```


    You can also move up to the root level in the file structure from anywhere by
    entering `cd /`, where `/` represents the root of the filesystem.


    # Listing the Contents of a Directory with `ls`


    To see the contents of a directory (the files and subdirectories), we can use
    the `ls` (list) command. This is very similar to the `dir` command in Windows.


    ```bash

    kali >ls

    bin  initrd.img   media   run   varboot   initrd.img.old   mnt   sbin   vmlinuzdev   lib         opt
    srv   vmlinuz.oldetc  lib64      proc    tmphome   lost+found   root   usr

    ```


    This command lists both the files and directories contained in the directory.
    You can also use this command on any particular directory, not just the one you
    are currently in, by listing the directory name after the command; for example,
    `ls /etc` shows what’s in the `/etc` directory. To get more information about
    the files and directories, such as their permissions, owner, size, and when they
    were last modified, you can add the `-l` switch after `ls` (the `l` stands for
    long). This is often referred to as long listing. See the example below:


    # Getting Help


    Nearly every command, application, or utility has a dedicated help file in Linux
    that guides its use. For instance, if I needed help using the best wireless cracking
    tool, `aircrack-ng`, I could type the `aircrack-ng` command followed by the `--help`
    command:


    ```bash

    kali >aircrack-ng --help

    ```


    Note the double dash here. The convention in Linux is to use a double dash (`--`)
    before word options, such as `help`, and a single dash (`-`) before single letter
    options, such as `-h`. When you enter this command, you should see a short description
    of the tool and guidance on how to use it. In some cases, you can use either `-h`
    or `-?` to get to the help file. For instance, if I needed help using the hacker’s
    best port scanning tool, `Nmap`, I would enter the following:


    ```bash

    kali >nmap -h

    ```


    Unfortunately, although many applications support all three options, there is
    no guarantee of the application you are using will. So, if one option refuses
    to work, please try another.


    # Finding Files


    Until you become familiar with Linux, it can be frustrating to find your way around,
    but knowledge of a few basic commands and techniques will go a long way toward
    making the command line much friendlier. The following commands help you locate
    things from the terminal.


    ## Searching with `locate`


    Probably the easiest command to use is `locate`. Followed by a keyword denoting
    what it is you want to find; this command will go through your entire filesystem
    and locate every occurrence of that word. To look for `aircrack-ng`, for example,
    enter the following:


    ```bash

    kali >locate aircrack-ng

    /usr/bin/aircrackng/usr/share/applications/kaliaircrackng.desktop/usr/share/desktopdirectories/05-1-01aircrack-ng.directory--snip--/var/lib/dpkg/info/aircrack-ng.mg5sums

    ```


    A screenshot showing the output of the `locate` command looks like this;


    The `locate` command is not perfect, however. Sometimes the results of `locate`
    can be overwhelming, giving you too much information. Also, `locate` uses a database
    that is usually updated once a day, so if you just created a file a few minutes
    or hours ago, it might not appear in this list until the next day. It’s worth
    knowing the disadvantages of these basic commands so you can better decide when
    to use each one.


    ## Finding Binaries with `whereis`


    If you’re looking for a binary file, you can use the `whereis` command to locate
    it. This command returns not only the location of the binary but also its source
    and man page if they are available. Here’s an example:


    ```bash

    kali >whereis aircrack-ng

    aircrack-ng:/usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz

    ```


    A screenshot showing the output of the `whereis` command looks like this;


    ## Finding Binaries in the PATH Variable with `which`


    The `which` command is even more specific: it only returns the location of the
    binaries in the `PATH` variable in Linux. For example, when I enter `aircrack-ng`
    on the command line, the operating system looks to the `PATH` variable to see
    in which directories it should look for `aircrackng`:


    ```bash

    kali >which aircrack-ng

    /usr/bin/aircrackng

    ```


    ## Performing More Powerful Searches with `find`


    The `find` command is the most powerful and flexible of the searching utilities.
    It is capable of beginning your search in any designated directory and looking
    for several different parameters, including, of course, the filename but also
    the date of creation or modification, the owner, the group, permissions, and the
    size.


    Here is the basic syntax for `find`:


    `find directory options expression`


