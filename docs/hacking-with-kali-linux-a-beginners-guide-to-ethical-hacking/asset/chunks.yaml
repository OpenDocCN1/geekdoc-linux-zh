    * **身份验证**：能够验证给定消息的来源。

    * **完整性**：这涉及到保持消息的完整性。也就是说，消息的内容从发送时起就没有被经过篡改或删除。

    * **不可否认性**：在这里，不可否认性意味着特定的发送者无法否认其发送过该消息。


    ## 备份与冗余


    通常，我们使用备份是为了在发生灾难性损失时创建数据副本。另一方面，冗余远不止是数据存储。冗余旨在确保无论发生什么，都能提供服务的连续性。数据冗余确保数据在多个且异构的位置进行存储。我们还有所谓的网络冗余，即对给定网络进行配置，使其拥有许多备用系统。这些备用系统用于确保无论发生什么，都能维持服务的连续性。


    ### 数据冗余

    对于任何组织来说，首要任务必须是在发生安全漏洞后尽快恢复常规服务。数据应该能够尽可能快地重建。为此，企业想出了各种方法来确保存在数据冗余。众所周知，这些方法在成本效益、速度和管理方面各有优劣。最常见的方法是使用离线磁带备份。在这种方法中，使用磁带存储存储卷的完整位对位副本。磁带可以被传输到离线存储设施，当发生灾难性故障时，可以方便地检索。此外，我们还可以使用云备份来保护数据免受损失。


    ### 网络冗余

    我们用于网络的大多数基础设施都难以置信地脆弱。例如，当路由器由于某种原因烧毁时，结果会导致长时间的网络停机。为了缓解这一点，企业确保他们所使用的网络具有足够的冗余，以便在紧急情况下能够生存并提供服务。从根本上说，网络冗余意味着无论什么类型的故障，网络仍然保持运行。为了做到这一点，我们可以配置多个网络设备（如集线器、路由器和交换机），以替代故障的某个设备。我们还有
    ISP 冗余，即网络中的网关连接到多个独立的 ISP。就像设备一样，一旦发生故障，其中一个 ISP 将接管。在网络运行正常的情况下，我们可以利用 ISP 分担流量，从而减少网络拥塞。这被称为负载均衡。


    ## 防止单点故障


    SPOF 是“单点故障”（single point of failure）的缩写。我们不希望系统的某个关键部分发生故障会导致整个系统无法使用。任何规划都需要缓解这种现象。通过冗余手段可以减少或消除单点故障。这将确保不会有单个组件能够阻止系统的正常工作。


    ## 第 8 章：变得安全且匿名


    ### 引言

    今天，我们在互联网上所做的几乎每项操作都会被追踪。无论是谁在进行追踪，是 Google 跟踪我们的在线搜索、网站访问和电子邮件，还是国家安全局（NSA）编目录我们所有的活动，我们所有的在线行为都会被记录、索引，然后为了某人的利益进行挖掘。普通个人，特别是黑客，需要了解如何限制这种跟踪并在网络上保持相对匿名，以限制这种无处不在的监控。在本章中，我们将介绍如何使用四种方法匿名地（或尽可能匿名地）浏览万维网：


    * 洋葱网络（The Onion Network）

    * 代理服务器

    * 虚拟专用网络

    * 私密加密邮件


