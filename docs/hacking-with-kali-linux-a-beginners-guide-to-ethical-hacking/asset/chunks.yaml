    whereby there is bypassing of a systems’ security that helps in the identification
    of threats and potential data breaches in a network. In this scenario, an organization
    that owns a particular network or system grants permission to cybersecurity experts
    to carry out such activities to test the defenses a system has put in place. This,
    therefore, implies that, unlike malicious hacking, ethical hacking is a legal
    process that has been planned and approved. The main goal of an ethical hacker
    is to scrutinize a particular network or system for weak points. It is via these
    weak points that malicious hackers use in their exploitation or destruction.While
    at it, they do gather and perform an analysis of the information. This will help
    them in the planning process of the organization''s IT infrastructure. In doing
    so, the security footprint will be significantly improved in a manner that it
    can withstand or divert attacks. The demand for ethical hacking has witnessed
    a dramatic increase in recent times due to the growth of the information security
    sector. Ethical hacking is also known as white hat hacking. Ethical hacking is
    the practice of attempting to infiltrate and exploit a system to find out its
    weaknesses so that it can be better secured. We can categorize it into two broad
    classes. These are, penetration testing; this is mostly for a legitimate information
    security firm and; hacking by intelligence agencies or a nation’s military. There
    is a rising demand for hacking in both areas.


    *   Penetration Testing'
