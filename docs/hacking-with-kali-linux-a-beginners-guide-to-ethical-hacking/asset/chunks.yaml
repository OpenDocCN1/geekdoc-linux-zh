  trans: '

    另一个非法用法的例子是，入侵者修改其 MAC 地址，以便能够像授权用户一样访问目标网络。攻击者可以利用这一新获得的身份对网络或系统造成具破坏性的破坏。例如，他们可以对计算机系统发起拒绝服务攻击，或者在某些情况下，绕过访问控制机制，为更高级的侵入铺平道路。此外，攻击者还可以决定更改其
    MAC 地址以规避网络入侵检测系统。这使得他们对既定的安全措施是“隐形”的，从而使他们有充足的时间采取行动而不被发现。


    ### MAC 伪造的合法用途


    MAC 伪造的一个合法用途是将单台计算机的功能从路由器更改为计算机。反之亦然，即将计算机的功能改回路由器。假设我们有一个公有 IP 地址，我们只能在一台路由器或一台计算机上使用它。现在，如果我们有两个广域网
    IP 地址，这意味着这两个设备（两台计算机）的 MAC 地址必须是不同的。由于某些原因，可能需要定期更换计算机以将它们连接到电缆调制解调器。更改设备的 MAC
    地址而不是更改网络接口卡，这样操作会更快、更方便。为此，许多电缆调制解调器路由器都内置了专门为此目的设计的“克隆 MAC 地址”功能。伪造的 MAC 地址允许攻击者绕过已设置的安全机制。例如，攻击者将能够冒充真实设备，甚至隐藏在网络上其他设备之后。总之，值得注意的是，更改
    MAC 地址的操作是一种可以确保网络正常运行的合法技术，而不仅仅是作为一种欺骗性技术。


    ### 防御 MAC 伪造


    需要网络监控、分析和安全措施来对抗 MAC 伪造。为了排除坏人员，管理对公司网络的访问无疑是一个好主意。访客对组织的网络连接（例如 Wi-Fi）应具有受限访问权限。主要原因是，大部分
    MAC 伪造攻击源于内部网络，或者是在内部网络实施的。公司确保场所内没有留下未授权的人员且访客从不单独离开也是主动的。这种措施有助于防止未授权人员通过电缆直接连接以太网来操控或连接到内部网络。建议公司在网络系统通信加密的同时采用
    IPsec 技术，这将有助于消除对现有 MAC 地址的窃听。在一些较大的公司，使用先进的主动网络硬件可以确保通过防火墙配置或交换机配置获得改进的保护。这些技术拦截了外部进入的数据包，因为这些包可能是攻击向量。


    ### ARP 伪造


    这是一种被认为恶意的实体在局域网内传输伪造 ARP 消息的攻击。其结果是网络内合法服务器或计算机的 MAC 地址和 IP 地址将被关联。这意味着攻击者将能够接收任何旨在发送真实
    IP 地址的信息和数据。此外，攻击者还可以修改、拦截，有时停止正在传输的数据。然而，这种攻击仅在使用了我们称为“地址解析协议”的局域网上才可能。


    #### ARP 伪造攻击的示例


    ARP 伪造攻击会对目标企业产生严重后果。此类伪造攻击的主要目标是窃取信息。这些信息通常是敏感的。它们不仅局限于此，还能引发其他攻击，例如：


    *   DoS 攻击：此类攻击利用 ARP 伪造将许多 IP 地址连接到属于目标的单个 MAC 地址。因此，最初发送给大量 IP 地址的流量将被重定向到目标的
    MAC 地址，导致其过载。

    *   会话劫持：这种攻击主要利用 ARP 伪造来获取会话 ID。这些 ID 随后可以用于访问私有数据甚至系统。

    *   中间人攻击：与会话劫持一样，MITM 攻击通常会拦截并更改毫无防备受害者之间的流量。


    #### 检测、预防和防御 ARP 伪造


    可以通过以下一种或多种方法检测并遏制 ARP 伪造攻击：


    *   使用 ARP 伪造检测软件：此类程序在传输前对数据进行检查和认证。看似是伪造的数据通常会被拦截。

    *   包过滤：这是一种防止 ARP 伪造的实用技术。具有冲突源地址信息的数据包将被过滤并拦截。

    *   加密网络协议：如 HTTP Secure (HTTPS)、Secure Shell (SSH)、传输层安全 (TLS) 等协议有助于防止 ARP 伪造攻击。它们通过在传输前对数据进行加密并在接收时对相同数据进行认证来实现这一点。

    *   将信任关系降至最低：公司和机构需要制定不依赖信任关系的安全协议。在此类关系中，认证机制仅依赖 IP 地址。这使得 ARP 伪造攻击更容易发生。


    ### Rogue DHCP 服务器


    #### DHCP 的定义


    我们将其定义为网络的一种协议，允许特定服务器从网络定义的数字范围内自动为特定计算机分配 IP 地址。


    #### 那么，什么是 Rogue DHCP 服务器？


