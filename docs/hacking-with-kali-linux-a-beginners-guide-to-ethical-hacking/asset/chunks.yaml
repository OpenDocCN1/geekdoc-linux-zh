    # 使用 `pwd` 查找自己


    与 Windows 或 macOS 不同，Linux 命令行并不总是能直观地显示你当前处于哪个目录。要导航到新目录，你通常需要知道自己当前所在的位置。当前工作目录命令
    `pwd` 会返回你在目录结构中的位置。在终端中输入 `pwd` 来查看你所在的位置：


    ```bash

    kali >pwd

    /root

    ```


    在这种情况下，Linux 返回了 `/root`，告诉我正处于 root 用户的目录下。由于你在启动 Linux 时是以 `root` 身份登录的，你也应该处于
    root 用户的目录下，这位于文件系统结构顶部（`/`）的下方。如果你在另一个目录中，`pwd` 将返回该目录名称。


    # 使用 `whoami` 检查登录身份


    在 Linux 中，那个“无所不能”的超级用户或系统管理员被称为 `root`，它拥有添加用户、更改密码、更改权限等所需的所有系统权限。当然，你不希望任何人都有进行此类更改的能力；你希望是一个可以信任并且对操作系统有足够知识的人。作为一名黑客，你通常需要所有这些权限来运行所需的程序和命令，因此你可能想以
    `root` 身份登录。Linux 用户可以使用下方的 `whoami` 命令查看他们以什么用户身份登录：


    ```bash

    kali >whoami

    root

    ```


    在这里，用户以 `root` 身份登录。


    # 导航 Linux 文件系统


    从终端导航文件系统是一项基本的 Linux 技能。为了完成任何工作，你都需要能够移动以寻找位于其他目录中的应用程序、文件和目录。在基于 GUI 的系统中，你可以视觉化看到目录，但当你使用命令行界面时，结构完全是文本的，导航文件系统意味着使用某些命令。


    # 使用 `cd` 切换目录


    从终端更改目录，请使用切换目录命令 `cd`。例如，这里切换到用于存储配置文件的 `/etc`目录的方法：


    ```bash

    kali >cd /etc

    root@kali:/etc#

    ```


    提示符变为 `root@kali:/etc`，表示我们位于 `/etc` 目录。我们可以通过输入 `pwd` 来确认这一点：


    ```bash

    root@kali:/etc# pwd

    /etc

    ```


    若要在文件结构中向上移动一级（朝文件结构的根目录或 `/`），我们使用 `cd` 后跟两个双点（`..`），如下：


    ```bash

    root@kali:/etc# cd ..

    root@kali:/# pwd

    /root

    root@kali:/#

    ```


    这让我们从 `/etc` 移动到 `/root` 目录，但你可以根据需要向上移动任意级。只需使用双点对的数量等于你想移动的层数即可：


    *   使用 `..` 向上移动一级。

    *   使用 `.. ..` 向上移动二级。

    *   使用 `.. .. ..` 向上移动三级，依此类推。


    所以，例如，向上移动二级，输入 `cd` 后跟两组带空格的双点：


    ```bash

    kali >cd .. ..

    ```


    你也可以通过输入 `cd /` 从文件结构中的任何地方移动到根目录，其中 `/` 代表文件系统的根。


    # 使用 `ls` 列出目录内容


    要查看目录的内容（文件和子目录），我们可以使用 `ls`（list）命令。这与 Windows 中的 `dir` 命令非常相似。


    ```bash

    kali >ls

    bin  initrd.img   media   run   varboot   initrd.img.old   mnt   sbin   vmlinuzdev   lib         opt
    srv   vmlinuz.oldetc  lib64      proc    tmphome   lost+found   root   usr

    ```


    此命令列出了目录中包含的文件和目录。你也可以在命令后列出目录名称对任何特定目录使用此命令，而不仅仅当前目录；例如，`ls /etc` 显示 `/etc` 目录中的内容。要获取更多关于文件和目录的信息（例如它们的权限、所有者、大小和最后修改时间），你可以在
    `ls` 之后添加 `-l` 选项（`l` 代表 long）。这通常被称为长列出。参见下方的示例：


    # 获取帮助


    在 Linux 中，几乎每个命令、应用程序或工具都有一个专用帮助文件来指导其使用。例如，如果我需要关于使用最好的无线破解工具 `aircrack-ng` 的帮助，我可以输入
    `aircrack-ng` 命令后跟 `--help` 命令：


    ```bash

    kali >aircrack-ng --help

    ```


    注意这里的双横线。Linux 的习惯是在单词选项（如 `help`）之前使用双横线（`--`），在单字母选项（如 `-h`）之前使用单横线（`-`）。当你输入此命令时，你应该看到该工具的简短描述以及如何使用的指南。在某些情况下，你可以使用
    `-h` 或 `-?` 来获取帮助文件。例如，如果我需要关于使用黑客最好的端口扫描工具 `Nmap` 的帮助，我会输入：


    ```bash

    kali >nmap -h

    ```


    遗憾的是，尽管许多应用程序支持这三个选项，但无法保证你正在使用的应用程序也会。因此，如果一个选项不起作用，请尝试另一个。


    # 查找文件


    在熟悉 Linux 之前，寻找路标可能会令人沮丧，但掌握一些基本命令和技巧将使命令行变得友好得多。以下命令帮助你从终端定位物品。


    ## 使用 `locate` 搜索


    可能是最易使用的命令是 `locate`。后面紧跟一个表示你想查找的内容的关键词；此命令将遍历整个文件系统并定位该词的所有出现处。例如，查找 `aircrack-ng`，输入以下内容：


    ```bash

    kali >locate aircrack-ng

    /usr/bin/aircrackng/usr/share/applications/kaliaircrackng.desktop/usr/share/desktopdirectories/05-1-01aircrack-ng.directory--snip--/var/lib/dpkg/info/aircrack-ng.mg5sums

    ```


    显示 `locate` 命令输出的截图如下；


    然而，`locate` 命令并不是完美的。有时 `locate` 的结果可能会让你崩溃，提供过多的信息。此外，`locate` 使用的数据库每天更新一次，所以如果你在几分钟或几小时前创建了一个文件，它在第二天之前可能出现在列表中。了解这些基本命令的缺点有助于你更好地判断何时使用哪一个。


    ## 使用 `whereis` 查找二进制文件


    如果你正在查找一个二进制文件，可以使用 `whereis` 命令来定位它。该命令不仅返回二进制文件的位置，还会返回源码和手册页（如果可用）。示例：


    ```bash

    kali >whereis aircrack-ng

    aircrack-ng:/usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz

    ```


    显示 `whereis` 命令输出的截图如下；


    ## 在 PATH 变量中查找二进制文件


    `which` 命令更具体：它只返回 Linux 中 `PATH` 变量里的二进制文件位置。例如，当我在命令行输入 `aircrack-ng` 时，操作系统会查看
    `PATH` 变量以确定应该在哪些目录中查找 `aircrackng`：


    ```bash

    kali >which aircrack-ng

    /usr/bin/aircrackng

    ```


