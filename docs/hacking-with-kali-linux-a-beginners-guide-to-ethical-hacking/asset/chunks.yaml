    This is a mechanism that is utilized by organizations to ascertain the robustness
    of their security infrastructure. Here, security professionals will play the role
    of the attackers, whereby they will attempt to discover flaws and vulnerabilities
    in a system before the malicious fellows do. One key objective is the identification
    and reporting of vulnerabilities to companies and organizations.


    As organizations become increasingly security conscious and the cost of security
    breaches rises exponentially, many large organizations are beginning to contract
    out security services. One of these critical security services is penetration
    testing. A penetration test is essentially a legal, commissioned hack to demonstrate
    the vulnerability of a firm’s network and systems.


    Generally, organizations conduct a vulnerability assessment first to find potential
    weaknesses in their network, operating systems, and services. I emphasize potential,
    as this vulnerability scan includes a significant number of false positives (things
    identified as vulnerabilities that are, in reality, not vulnerabilities). It is
    the role of the penetration tester to attempt to hack, or penetrate, these vulnerabilities.
    Only then can the organization know whether the weakness is real and decide to
    invest time and money to close the vulnerability.


    ## Espionage and Military


    Cyber espionage can be said to be the practice of accessing information and secrets
    without the knowledge and permission of the entities being targeted. They can
    be ordinary individuals, rivals, competitors, groups, governments, or even enemies.
    The objectives here are broad. They can be political, economic, personal, or even
    military-related.


    The techniques used, too, are diverse. Hackers can use malicious software, cracking
    techniques, proxy servers, among others, to attain their stated objectives.


    Espionage can be carried out online by professionals from their computer desks,
    or it can be done by infiltration using trained moles and conventional spies.
    In some circumstances, it can be carried by amateurish hackers with malicious
    intent and software programmers. It is common knowledge that every nation on earth
    carries out some form of cyber espionage or even cyber warfare, albeit covertly.
    Gathering intelligence on military activities of other countries has been made
    more cost-effective by hacking. Thus, a hacker has their place cut out in the
    defense systems of any nation.


    ## Chapter 2: Cyber Attacks


    ### Definition of a Cyber Attack

    A cyberattack can be said to be the intentional exploitation of computer systems,
    enterprises that depended on networks and technology. Cyber-attacks employ the
    use of codes that are malicious for purposes of modification of computer data,
    code, or logic. All these have a net effect of disrupting repercussions, which
    often lead to compromise of crucial data.


    Cyber-attacks additionally are a platform for launching or committing cybercrimes.
    For instance, theft of information and identity. The other name of a cyberattack
    is a computer network attack. Cyberattacks may have the following ramifications:


    * Unauthorized access and theft of intellectual property

    * Web browser exploitation

    * Infiltration of systems

    * Breaching controls of access

    * Stolen hardware,

    * Fraud, identity theft, extortion

    * DoS and DDoS attacks

    * Sniffing of passwords

    * Defacement of websites


    ### Why Cyber-Attacks Are Crucial

    We have recently seen how the consequences of cyber-attacks can be devastating.
    Running costs of businesses are increasing due to cyber-attacks. Data breaches
    are also costly to handle. A study conducted by the Ponemon Institute in 2018
    found the average costs of a data breach to be 3.86 million dollars.


    However, it is not just about the financial aspects of cyberattacks. They can
    also:


    * Destroy reputations of the brands involved

    * Erosion and in some cases decimation of the loyalty customers had for the brand

    * Cyber-attacks can result in the loss of intellectual property

    * Companies, in severe cases, can be run out of business

    * They can also bring about penalties from the various regulatory agencies

    * The security of states and governments can be significantly impaired.

    * There is a chance that future attacks will likely be carried out.

