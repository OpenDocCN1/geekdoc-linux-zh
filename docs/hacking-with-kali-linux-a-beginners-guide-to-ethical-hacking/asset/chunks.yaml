    # 恶意软件攻击


    恶意软件是一种未经您许可便安装在系统中的不受欢迎软件。此类软件已知会附着在合法软件或代码上，为其自我传播提供平台。恶意软件可以存在于我们日常使用的应用程序中，甚至可以在互联网上自我复制。让我们讨论一下目前常见的恶意软件类型：


    1) **宏病毒（Macro viruses）** — 它们已知会感染常用程序，例如 `Microsoft Excel`、`Microsoft Word`
    等。这类感染会将自身绑定到应用程序的初始化序列中。当打开应用程序时，宏病毒会在控制权交给应用程序之前影响指令。与许多其他病毒一样，它们能够通过附着到计算机系统中运行的其他代码或程序来实现复制。


    2) **文件感染病毒（File infectors）** — 这些病毒通常绑定到可执行代码上。一旦代码被加载，病毒就会安装。另一种类型的文件感染病毒经常会通过创建一个名称相似但带有
    `.exe` 扩展名的病毒文件，将其与计算机上的某个文件关联。打开该文件时，病毒代码就会执行。


    3) **系统记录/引导扇区感染病毒（System record/boot-record infectors）** — 它们的工作方式与文件感染病毒类似，只是它们附着在位于硬盘上的主引导记录（MBR）上。一旦系统启动，它们会将病毒加载到系统内存中。从那里，感染病毒将传播到其他计算机或其他磁盘。


    4) **多态病毒（Polymorphic viruses）** — 它们通常通过使用变化的加密和解密循环来隐藏自己。病毒与其相关的变异引擎一起加密，并在开始使用解密程序进行解密。解密后，它将继续感染一小部分代码。变异引擎将用于构建一个新的解密程序，病毒对其进行加密。正是这个加密的变异引擎和病毒包会附接到新的代码上。这个过程是重复的。检测此类病毒非常具有挑战性。由于源代码经过多次更改，它们具有高水平的熵。像
    `Process Hacker` 或大多数反病毒软件可以使用此项功能对它们进行检测和隔离。


    5) **隐形病毒（Stealth viruses）** — 这些病毒捕获系统中的功能以便隐藏自己。这是通过隐形病毒干预检测恶意软件的软件实现的。结果是，软件会错误地将受感染区域识别为未受感染。隐形病毒会隐藏受感染文件的任何大小变化，有时甚至会修改受感染文件的最后修改时间和日期。


    6) **木马病毒（Trojans）** — 以特洛伊木马闻名，这些程序将自己隐藏在一个常用但不同的程序中。在大多数情况下，特洛伊木马带有恶意功能。与病毒不同，木马不会自我复制。除了对目标系统发动攻击外，木马还可以创建攻击者可能用于利用系统的后门。例如，一个特洛伊木马可以被编程为打开一个高位端口，黑客可以通过该端口监听甚至在未来实施攻击。


    7) **逻辑炸弹（Logic bombs）** — 这种恶意软件通常绑定到应用程序中。要使其工作，必须有一个特定事件触发它。这可能是一个预定的逻辑条件、设定的时间、指定的日期等。


    8) **蠕虫（Worms）** — 这是一种自包含的程序，可以在计算机和网络之间传播。这意味着它们不会附着在宿主文件病毒上。它们经常通过电子邮件发送的附件传播。下载并打开附件的用户会在不经意的情况下激活蠕虫。蠕虫的一种利用方式是蠕虫复制到感染计算机邮箱地址中的所有联系人。它们还可以在互联网上传播，导致电子邮件服务器过载。这种场景会导致网络上存在的各个节点遭受拒绝服务。


    9) **释放器（Droppers）** — 这些可以被用于在受害者计算机上安装病毒的程序。很多时候，释放器本身通常不包含恶意代码。这意味着它们不会被负责病毒扫描的软件检测到。然而，释放器可以连接到互联网，下载到受破坏系统中现有病毒软件的更新。


    10) **勒索软件（Ransomware）** — 这种恶意软件通过阻止访问目标数据来工作。有时，勒索软件会威胁删除数据或发布数据，除非向勒索软件所有者支付费用。有的对于知识丰富的人士来说易于破解，也有更先进的。它们使用加密勒索技术。该技术对受害的文件进行加密。这使得除非受害者获得解密密钥，否则无法恢复它们。


    11) **广告软件（Adware）** — 公司将这种软件应用程序用于营销目的。每当任何程序运行时，您都会看到广告横幅。当您浏览网站时，广告软件会自动下载到您的系统中，这些内容可以通过弹出窗口或计算机屏幕上自动弹出的栏进行查看。


    12) **间谍软件（Spyware）** — 间谍软件是一种主要安装在系统中用于收集有关计算机、用户甚至其浏览习惯信息的程序。间谍软件可以在您不知情的情况下跟踪您所做的一切，无论是离线还是在线。收集的数据随后会被传输到远程用户。与释放器一样，间谍软件可以连接到互联网，下载其他恶意程序并将其安装在受害计算机系统中。该程序的工作方式与广告软件相同，不同之处它通常作为一个独立的程序出现。当您安装免费软件应用程序时，它会被安装，在大多数情况下，这是在您不知情的情况下发生的。


    # MAC 伪造（MAC Spoofing）


    ![](img/rsrc80.jpg)


    我们可以将其定义为对设备 MAC 地址的未经授权的修改。简单来说，它是给定计算机网络内网络设备 MAC 地址的伪造。通过这种方式，恶意用户可以使用假身份（即
    MAC 地址）伪装成您自己的设备之一，随后拦截网络中交换的通信。设备 MAC 地址的伪造可以通过以下方式实现：


    *   简单的 MAC 地址更改

    *   以随机方式创建 MAC 地址

    *   使用不同制造商的 MAC 地址

    *   在保持当前制造商完整的同时配置新的 MAC 地址，然后自动激活它。


    ## 执行 MAC 伪造的原因


    MAC 伪造可以出于合法也可以非合法的原因进行。后者可能是接管另一台计算机的身份，而前者可以用于创建到网络的无线连接。MAC 伪造的合法使用的另一个示例是由于共享单个
    MAC 地址，将单台计算机的功能从路由器更改为计算机，再回到路由器。


    *   MAC 伪造的非合法用途


