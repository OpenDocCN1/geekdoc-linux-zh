- fmt: "\nWe define a rogue DHCP server as a DHCP server in which an attacker or an\
    \ unaware user sets up on the network. The rogue DHCP server will not be under\
    \ the network administrator’s control. An example of an accidental rogue device\
    \ is a DHCP capable modem that an unknowing user has connected to the network.\
    \ The user, in most cases, is usually unaware of the consequences of doing so.\
    \ Additionally, these servers are widely utilized by attackers for network attacks,\
    \ for example; sniffing, reconnaissance and man in the middle attacks. Upon connection\
    \ to the network, the two DHCP servers (legal and rogue) will provide the devices\
    \ with everything they need to carry out communications. These can include Default\
    \ gateways, DNS servers, WINS servers, and IP addresses, to name a few. Occasionally,\
    \ clients using IP addresses or gateways that are incorrect are bound to experience\
    \ network access problems. Also, when a rogue DHCP functions as the default gateway\
    \ to a machine that is controlled by a malicious or misbehaving user, it will\
    \ be able to sniff traffic that is transmitted to other networks, thereby breaching\
    \ user privacy and the network security policies in place. A virtual machine software\
    \ is also able to function as a rogue DHCP server, albeit inadvertently. This\
    \ happens when it is run on a client machine, which is linked to a network. Here,\
    \ it will be issuing out IP addresses that are random to all the clients next\
    \ to it on the network. The consequence is that large sections are disconnected\
    \ from the Internet together with the remainder of the domain.\n\n## Prevention\
    \ of Rogue DHCP Servers\n![](rsrc9M.jpg)\n\nIntrusion detection systems having\
    \ the relevant signatures can be used to stop Rogue DHCP servers. Multilayer switches\
    \ may also be set up in a way that they can drop the packets. DHCP snooping is\
    \ perhaps the most common way of dealing with these servers. This works by dropping\
    \ DHCP messages originating from an untrusted DHCP server.\n\n### TLS/SSL Encryption\n\
    The encryption is used for securing HTTP network connections. It safeguards the\
    \ connections against interception and man-in-the-middle attacks that can be propagated\
    \ through the web. TSL/SSL encryption increases the difficulty of the communications\
    \ interception process happening between a server and the client.\n\n### Wi-Fi\
    \ Encryption\nAn open Wi-Fi network is more likely to be plagued by eavesdropping\
    \ attacks. Wi-Fi encryption, therefore, provides the best way of keeping hackers\
    \ at bay. This will mean that they will not be able to access any information\
    \ that passes through the network. That being said, Wi-Fi encryption also has\
    \ its weaknesses, and you should not place all your faith in that.\n\n## DDoS\
    \ Attack\nThis is a malicious attempt that is solely intended to disrupt regular\
    \ traffic of a server, network, or service that is being targeted. This is, in\
    \ most cases, done by overwhelming a target alongside its surrounding infrastructure\
    \ with a deluge of traffic from the internet. A DDoS attack is effective in the\
    \ sense that it uses multiple compromised computer systems as its source of traffic\
    \ for an attack.\n\n### How the Attack Works\nThis type of attack requires gaining\
    \ network control for machines that are online by an attacker for them to be able\
    \ to implement an attack successfully. Malware is used to infect the devices and\
    \ computers hence turning them into bots. That is, they become zombie-like. A\
    \ group of bots is known as a botnet. The attacker will be able to control these\
    \ botnets remotely. The botnets will remotely receive updated instructions that\
    \ the attacker will send to them. Once the attacker identifies a target along\
    \ with its IP address, the botnets will send requests to it. This will overload\
    \ the goal resulting in the denial-of-service to normal legitimate traffic. Since\
    \ each bot is a valid internet device, it becomes quite challenging to separate\
    \ the regular traffic from the attack traffic.\n\n## Chapter 3: Linux for Hacking\n\
    ![](rsrcAB.jpg)\n\n### A Brief Introduction\nAs you begin your journey towards\
    \ being a hacker, you will realize that most of the professional and expert hackers\
    \ make use of Linux/Unix in their trade. That aside, we have some types of hacks\
    \ where Mac OS and Windows can be used. Software such as `Zenmap`, `Metasploit`,\
    \ `Havij`, `Cain`, and `Abel` and others have Windows versions. Usually, when\
    \ the applications are developed in Linux and later ported to Windows, they always\
    \ lose some of their capabilities. That is to say; we have capabilities that are\
    \ found in Linux but are not present in Windows. This is the reason that many\
    \ hacker tools are designed and build for Linux. It is, therefore, essential that\
    \ anyone who intends to be a professional hacker learns or has some basics of\
    \ a Linux distribution like `Kali`.\n\n### Why Hackers Use Linux\nBelow are some\
    \ of the main reasons why hackers prefer Linux.\n\n1. **Linux Is Open Source**\n\
    \   Unlike the Windows operating system software, Linux distribution is an open-source.\
    \ A Linux user has access to the operating systems’ source code. This means that\
    \ one can manipulate and change a Linux operating system to suit their needs at\
    \ will. Supposing the user wants to make a particular system operate in ways besides\
    \ those it was originally intended to, the ability to manipulate and change the\
    \ source code is of paramount importance.\n\n2. **Linux Is Transparent**\n   A\
    \ thorough understanding of a users’ operating system is required for one to carry\
    \ out hacking effectively. It is also necessary to have a knowledge of the operating\
    \ system one intends to hack. Unlike windows, we can see and even manipulate all\
    \ the working parts of Linux. That is to say, Linux is entirely transparent. It\
    \ is not easy to understand the inner workings of a windows operating system.\
    \ The transparency aspect means working with Linux is more effective.\n\n3. **Linux\
    \ Offers Granular Control**\n   A Linux user has infinite control over the system,\
    \ i.e., it is granular. This is significant when compared to a windows operating\
    \ system where a user can control only what Microsoft allows them to. Everything\
    \ in Linux, both at the minuscule and macro level, is controlled by the `terminal`.\
    \ Additionally, scripting is simple and effective for any scripting language in\
    \ Linux.\n\n4. **Most Hacking Tools Are Written for Linux**\n   A majority of\
    \ tools used in hacking are written explicitly for Linux. There are some like\
    \ `Nmap`, or `Metasploit` that can be available for the Windows platform, but\
    \ still, not all their capabilities can be ported to windows. They offer limited\
    \ functionalities as compared to when they are on the Linux platform.\n\n5. **The\
    \ Future Belongs to Linux/Unix**\n"
