    ## Wi-Fi Networks

    rsrcTN.jpg


    Firstly, let us look at WiFi. Before doing so, here is a small introduction to
    the various WiFi security protocols that usually are frequently used. The original,
    Wired Equivalent Privacy (WEP), was severely flawed and easily cracked. Its replacement,
    WiFi Protected Access (WPA), was a bit more secure. Finally, WPA2PSK, which is
    much more secure and uses a pre-shared key (PSK) that all users share, is now
    used by nearly all WiFi AP’s (except enterprise WiFi).


    ### Basic Wireless Commands


    `ifconfig`

    To perform a network interface configuration in Unix-based operating systems,
    one needs `ifconfig`. It is an administration utility that is found in the system.
    `ifconfig` has utilities that are utilized in the configuration, querying, and
    controlling of the parameters of the TCP/IP interface. As an interactive tool,
    `ifconfig` can be used to show settings of the network interface and analyze them.
    In summary, `ifconfig` does the following:


    * The command enables viewing the settings of a network.

    * Carrying out enabling of a network Interface and also disabling it

    * Network Interface IP address assigning

    * Assigning network interfaces, a netmask

    * Allocating a Broadcast to Network Interface

    * Assigning an IP, Netmask, and Broadcast to Network Interface

    * Changing MTU for a Network Interface

    * Enabling and disabling Promiscuous Mode

    * Addition and removal of New Alias to Network Interface

    * Changing the MAC address of Network Interface


    `iwevent`

    This command displays Wireless Events received through the RTNetlink socket. Each
    line shows the specific Wireless Event which describes what has happened on the
    specified wireless interface. This command doesn''t take any arguments.


    `iwlist`

    This command can be used for scanning wireless networks available and also for
    displaying any other information about the wireless networks which are not displayed
    when the `iwconfig` command is used. `iwlist` is utilized in the generation of
    wireless access points that are nearby together with their SSIDs and their MAC
    addresses.


    `iwspy`

    This command is used for monitoring nodes in a network. It can also be used for
    recording the link quality of the nodes.


    `ifrename`

    This command is used for renaming wireless network interfaces depending on multiple
    criteria that are static to allocate names consistently to each interface. The
    interface names usually are dynamic by default. This command helps users decide
    the name of the network interface. The command needs to be executed before bringing
    the interfaces up.


    `iwgetid`

    This is used in the reporting of the NWID, ESSID, or address of the access point
    of the wireless network presently being used. By default, `iwgetid` will display
    the devices’ ESSID. Suppose that it is unavailable, it will output its NWID instead.
    The information reported is the same as the one shown by `iwconfig`. In comparison,
    it is easier to do integration in various scripts.


    ### Detecting and Connecting to Bluetooth


    In recent times, nearly all gadgets, systems, and devices have inbuilt Bluetooth.
    The devices can be computers, iPods, smartphones, speakers, game controllers,
    keyboards, tablets, among others. The ability to break into Bluetooth networks
    can result in the compromising of the information on the device, assuming a devices’
    control, and acquisition of a platform to transmit privileges information from
    and to the device, among other things. We, therefore, need to understand how Bluetooth
    works if we are to exploit this technology. From this book, you will be able to
    acquire some basic knowledge that will come in handy during the scanning and connecting
    to Bluetooth devices in preparation for hacking them.


    #### How Bluetooth Works

    First, we can define Bluetooth as a wireless communication technology that enables
    devices to transmit voice or data wirelessly. This happens over a relatively short
    distance. This technology was meant to replace the ubiquitous cables that were
    being used to connect devices while still securing the communications across them.
    The process of joining two Bluetooth devices is known as pairing. Pretty much
    any two devices can pair if they are set to a discoverable mode. In the discoverable
    mode, a Bluetooth device will broadcast the following information about themselves:


    * Technical information

    * Name

    * List of services

    * Class


    Upon pairing, two Bluetooth devices will exchange a link key. The devices will
    store the key to be used in the identification of the other device in future pairings.
    Every device has a unique identifier and usually a manufacturer-assigned name.
    These will be useful pieces of data when we want to identify and access a device.


    #### Bluetooth Scanning and Reconnaissance

    rsrcV5.jpg


    Linux has an implementation of the Bluetooth protocol stack called `BlueZ` that
    we are going to use scan for Bluetooth signals. Most Linux distributions, including
    Kali Linux, have it as an inbuilt feature by default. `BlueZ` possesses utilities
    that can help us scan and manage Bluetooth capable devices. Examples of the utilities
    are outlined below:


    * `hciconfig`; this is an equivalent of `ifconfig` in Linux, but made for Bluetooth
    capable devices.

    * `hcitool`; this is a tool that we use to perform inquiries. The inquiries can
    be the device ID, name, class, or even its clock information. This helps the devices
    to work in sync.

    * `hcidump`; sniffing of Bluetooth communications is carried out by this tool,
    it, therefore, gives us a chance to capture data that is being sent over the Bluetooth
    signal.

