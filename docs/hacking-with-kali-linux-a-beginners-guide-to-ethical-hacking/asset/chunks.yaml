- fmt: '

    As a hacker, you will often require to download new tools for hacking, but Linux
    automatically assigns all files and directories default permissions of 666 and
    777, respectively. This means that, by default, you will not be able to execute
    a file immediately after downloading it. If you try, you’ll usually get a message
    that says something like “Permission denied.” For these cases, you will need to
    give yourself root and execute permissions using `chmod` to run the file.


    ## Special Permissions


    Besides the three permissions that are general-purpose, rwx, Linux has three special
    permissions that are slightly more complicated. They are the sticky bit, set group
    ID (or SGID), and set user ID (or SUID). Below is a brief explanation of each
    of them.


    ### a) Granting Temporary Root Permissions with SUID

    As you should know by now, a user can execute a file only if they have permission
    to run that particular file. If the user only has read and write permissions,
    they cannot run. This may seem straightforward, but there are exceptions to this
    rule. You may have encountered a case in which a file requires the permissions
    of the root user during execution for all users, even those who are not the root.
    For example, a file that allows users to change their password would need access
    to the `/etc/shadow` file—the file that holds the users’ passwords in Linux—which
    requires root user privileges to execute. In such a case, you can temporarily
    grant the owner’s privileges to run the file by setting the SUID bit on the program.
    It, therefore, implies that the SUID bit says that any user can execute the file
    with the permissions of the owner, but those permissions don’t extend beyond the
    use of that file. To set the SUID bit, enter a 4 before the regular permissions,
    so a file with a new resulting permission of 644 is represented as 4644 when the
    SUID bit is set. Setting the SUID on a file is not something a typical user would
    do, but if you want to do so, you’ll use the `chmod` command, as in `chmod 4644
    filename`.


    ### b) Granting the Root User’s Group Permissions SGID

    SGID also gives temporary elevated permissions, but it gives the permissions of
    the file owner’s group, rather than of the file’s owner. This means that, with
    an SGID bit set, someone without the execute permission can execute a file if
    the owner belongs to the group that has permission to run that file. The SGID
    bit works slightly differently when applied to a directory: when the bit is set
    on a directory, ownership of new files created in that directory goes to the directory
    creator’s group, rather than the file creator’s group. This is very useful when
    a directory is shared by multiple users. All users in that group can execute the
    file(s), not just a single user. The SGID bit is represented as 2 before the regular
    permissions, so a new file with the resulting permissions 644 would be represented
    as 2644 when the SGID bit is set. Again, you would use the `chmod` command for
    this—for example, `chmod 2644 filename`.


    ### c) The Outmoded Sticky Bit

    The sticky bit is a permission bit that you can set on a directory to allow a
    user to delete or rename files within that directory. However, the sticky bit
    is a legacy of older Unix systems, and modern systems (like Linux) ignore it.
    As such, I will not discuss it further here, but you should be familiar with the
    term because you might hear it in the Linux world.


    ## Managing Processes


    Hackers often need to multiprocess, and an operating system like Kali is ideal
    for this. The hacker may have a port scanner running while running a vulnerability
    scanner and an exploit simultaneously. This requires that the hacker manage these
    processes efficiently to best use system resources and complete the task. In this
    section, I''ll show you how to manage multiple processes.


    ### Changing Process Priority with nice

    You don’t often hear the word `nice` used in the context of hackers, but here
    you will. The `nice` command is used to influence the priority of a process to
    the kernel. As you saw, when we ran the `ps` command, numerous processes run on
    the system at once, and all of them are contending for the available resources.
    The kernel will have final say over the priority of a process, but you can use
    `nice` to suggest that a process should be elevated in priority. The idea behind
    the use of the term nice is that, when you use it, you’re determining how “nice”
    you’ll be to other users: if your process is using most of the system resources,
    you are not being very nice. The values for a nice range from –20 to +19, with
    zero being the default value. A high nice value translates to a low priority,
    and a low nice value translates to a high priority (when you do not want to be
    so friendly to other users and processes). When a process is started, it inherits
    the nice value of its parent process. The owner of the process can lower the priority
    of the process but cannot increase its priority. Of course, the superuser or root
    user can arbitrarily set the nice value to whatever they please.


    ### Setting the Priority When Starting a Process

    For demonstration purposes, let us assume we have a process named `slowprocess`
    that is located at `/bin/slowprocess`. If we wanted it to speed up its completion,
    we could start the process with the `nice` command:

    ```

    kali >nice -n -10 /bin/slowprocess

    ```

    This command would increment the nice value by -10, increasing its priority and
    allocating it more resources. On the other hand, if we want to be nice to our
    fellow users and processes and give `slowprocess` a lower priority, we could increment
    its nice value positively by 10:

    ```

    kali >nice -n 10 /bin/slowprocess

    ```


    ### Changing the Priority of a Running Process with renice

    The `renice` command takes absolute values between –20 and 19 and sets the priority
    to that particular level, rather than increasing or decreasing from the level
    at which it started. Also, `renice` requires the PID of the process you are targeting
    rather than the name. So, if `slowprocess` is using an excessive amount of resources
    on your system and you want to give it a lower priority, thus allowing other processes
    a higher priority and more resources, you could renice the `slowprocess` (which
    has a PID of 6996) and give it a much higher nice value, like so:

    ```

    kali >renice 20 6996

    ```

    As `nice`, only the root user can renice a process to a negative value to give
    it a higher priority, but any user can be nice and reduce priority with `renice`.


    ### Killing Processes

    At times, a process will consume way too many system resources, exhibit unusual
    behavior, or, at worst, freeze. A process that displays this type of behavior
    is often referred to as a zombie process. For you, probably the most problematic
    symptom will be wasted resources used by the zombie that could be better allocated
    to other useful processes. When you identify a problematic process, you may want
    to stop it with the `kill` command. There are many different ways to kill a program,
    and each has its own kill number. The `kill` command has 64 different kill signals,
    and each does something slightly different. Here, we focus on a few you will likely
    find most useful. The syntax for the `kill` command is `kill-signal PID`, where
    the signal switch is optional. If you do not provide a signal flag, it defaults
    to `SIGTERM`.


    ### Running Processes in the Background

