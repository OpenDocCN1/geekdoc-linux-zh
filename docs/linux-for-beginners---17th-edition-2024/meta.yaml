  - '[PAGE 37]


    # # Creating Users


    When you first install Linux Mint it is configured for use with a single user.
    While sharing a user account with the entire family is fine, there may come a
    time when you need to create separate users with their own unique Home folders.


    # ## NEW USERS


    Having different users means each user has access to his or hers own areas on
    the system. Documents, pictures, videos and so on are separate, as with multiple
    users on other operating systems.


    # ### STEP 1


    Click on the Linux Mint Menu and type ''users'' to begin searching for the relevant
    console. From the search results, choose Users and Groups and enter your password.
    The Users and Groups console is quite basic looking, and thankfully easy to use.
    At first, you can just see your own username from when you installed Linux Mint.


    ![](img/6103e44aa372eb088d684690786bde89_37_0.png)


    # ### STEP 2


    To add a new user, click the Add button at the bottom of the console. There are
    two types of user you can create, Standard and Administrator. Unless the new user
    has need to install new apps or access parts of the file system beyond their Home
    folder, then opt for the Standard account type. Otherwise, use the Administrator
    account type.


    ![](img/6103e44aa372eb088d684690786bde89_37_1.png)


    # ### STEP 3


    Enter the new user''s Full Name, followed by the Username they need when logging
    into Linux Mint. Make sure the username is all in lower case, a-z and 0-9 characters
    only. You can have full stops, underscores or hyphens if you wish. Click the Add
    button when you''re ready to continue.


    ![](img/6103e44aa372eb088d684690786bde89_37_2.png)


    # ### STEP 4


    The new user appears in the list of current Linux Mint users, in alphabetical
    order. At present, there''s no password set so click the user in the list of current
    users, then click the No Password Set option under the user''s username.


    ![](img/6103e44aa372eb088d684690786bde89_37_3.png)'
  - '[PAGE 38]


    **STEP 5** You can now enter a password for the new user or click the curled arrow
    at the end of the New Password text box to generate a password for you, as well
    as displaying it. Naturally, it''s a good idea to come up with as strong a password
    as possible. When you''re done, click the Change button.


    ![](img/6103e44aa372eb088d684690786bde89_38_0.png)


    **STEP 7** Once logged in the new user is required to set up their own desktop
    wallpaper, icons, Panel, Menu and so on. Depending on what Account Type you set
    up for them, Standard or Administrator, they won''t be able to install any new
    apps. This screenshot is from a Standard user account type.


    ![](img/6103e44aa372eb088d684690786bde89_38_1.png)


    **STEP 6** You can close the Users and Groups console window now, as the new user
    has been created. If you click the Mint Menu, followed by Logout, you are presented
    with the Mint Login Manager. The new user is now present in the list of currently
    available users. Click on him/her to log them in.


    ![](img/6103e44aa372eb088d684690786bde89_38_2.png)


    **STEP 8** You can create as many new accounts as you need and you''re able to
    switch between them when required. It''s best to have just one account that''s
    capable of installing new software, that way you can keep track of what''s on
    your system.


    ![](img/6103e44aa372eb088d684690786bde89_38_3.png)


    # COMMAND LINE ACCOUNTS


    Just as you''d expect, you can also create a new user within the command Line.
    Open up a Terminal session under the main (yours) Administrator account.


    **STEP 1** The process for adding a new user from the command line is relatively
    simple. To begin with, type: `sudo adduser <username>` where `<username>` is the
    new user''s login name. You''re then asked to create a new password for the user,
    along with their full name and other details. Click y to confirm the details and
    create the user account.


    ![](img/6103e44aa372eb088d684690786bde89_38_4.png)


    **STEP 2** You can check the details and account type for the new user from within
    the Users and Groups console. If you want to delete a user from Mint, you can
    either enter: `sudo deluser <username>` in the Terminal or click the Delete button
    in Users and Groups.


    ![](img/6103e44aa372eb088d684690786bde89_38_5.png)'
- md: '## Customising the Desktop

    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is there to help you work, inspire you or feature the company logo.
    Whatever your reasons for having your own desktop, here''s how it''s done.


    - **STEP 1** The first aspect of desktop customisation is to change the wallpaper.
    Right-click the desktop and choose Change Desktop Background. This opens the Backgrounds
    app in Linux Mint; remember, other distros may present their background, wallpaper
    selection tools differently.

    ![](img/6103e44aa372eb088d684690786bde89_39_0.png)


    - **STEP 2** More recent versions of Linux Mint display available backgrounds
    depending on the version the user is running. You normally get three categories
    followed by a fourth, Pictures, which is separated from the others. The Pictures
    option is different because it reads the image content from the Pictures folder
    in your Home area.

    ![](img/6103e44aa372eb088d684690786bde89_39_1.png)


    - **STEP 3** You just need to click the available images, from any of the locations
    provided to have them install as the desktop wallpaper. Incidentally, if you have
    images stored in another location on your system or network, you can add them
    by clicking on the Plus symbol at the bottom of the Backgrounds console, using
    the file manager to locate them.

    ![](img/6103e44aa372eb088d684690786bde89_39_2.png)


    - **STEP 4** By clicking on the Settings tab you can, instead, play numerous images
    as a slideshow or change the aspect of the wallpapers to a variety of choices.

    ![](img/6103e44aa372eb088d684690786bde89_39_3.png)


    - **STEP 5** If none of the available wallpapers take your fancy, open a browser
    and search for the type of background image you prefer. When you''ve found the
    image you want as the desktop wallpaper, right-click it and choose Set As Desktop
    Background from the list of options. When the Set Desktop Background console opens,
    click the Set Desktop Background button.

    ![](img/6103e44aa372eb088d684690786bde89_40_0.png)


    - **STEP 6** Click the Menu button and search for ''desktop'' and click the Desktop
    Settings result. The Desktop console allows you to pick the layout, desktop icons
    and options for multi-monitor support you want. You can experiment with the options
    for the best setup, according to your personal tastes.

    ![](img/6103e44aa372eb088d684690786bde89_40_2.png)


    - **STEP 7** In addition to changing the desktop wallpaper, and how the icons
    are displayed, you can also alter the overall theme for Linux Mint. From the Mint
    Menu, search for ''themes'' and click the Themes app as it appears in the search
    results.

    ![](img/6103e44aa372eb088d684690786bde89_40_4.png)


    - **STEP 8** Themes allow you to change the way certain aspects of the Mint desktop
    look: Window Borders, Icons, Controls, Mouse Pointer and Desktop. In the Settings
    tab you can extend the options with a few on/off slider buttons, too.

    ![](img/6103e44aa372eb088d684690786bde89_40_1.png)


    - **STEP 9** If you click on the Add/remove button in the centre of the three
    available options, you can choose the default view from a number of preinstalled
    themes. Click the theme you want, then click the Install (downward-pointing arrow)
    button to enable it.

    ![](img/6103e44aa372eb088d684690786bde89_40_3.png)


    - **STEP 10** Click back on Themes, then Desktop and you can locate the newly
    installed theme and apply to your desktop. Any installed Themes can also be uninstalled
    via the Add/Remove button. It’s worth spending some time personalising your desktop
    how you want it and there are some incredible themes available too.

    ![](img/6103e44aa372eb088d684690786bde89_40_5.png)


    ## Becoming Anonymous Online

    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    ### ANONYMITY WITH MINT

    While it''s virtually impossible to become totally anonymous online, you can take
    measures to ensure your privacy is at its best.


    - **STEP 1** Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means that anything that''s transmitted over HTTPS is secure
    (hence the S part at the end) and encrypted.

    ![](img/6103e44aa372eb088d684690786bde89_41_0.png)


    - **STEP 2** When you''re browsing, consider using the Incognito or Private browsing
    modes available in a browser. This disables your web history and web cache, allowing
    you to browse without the details being stored for later scrutiny by someone else.
    However, it doesn''t stop any data or search tracking.

    ![](img/6103e44aa372eb088d684690786bde89_41_1.png)


    - **STEP 3** Although using Google may seem like the obvious choice for a modern
    Internet search, the company does track all searches made by an individual. Instead,
    consider an alternative search engine, such as DuckDuckGo, a search engine that
    doesn''t store personal data or track you.

    ![](img/6103e44aa372eb088d684690786bde89_41_2.png)


    - **STEP 4** If you''re regularly on the Internet then consider installing some
    of the browser plug-ins that enhance your privacy. For example, for Firefox, use
    Ghostery, NoScript and Adblock Plus to block trackers, adverts and other data
    mining techniques.

    ![](img/6103e44aa372eb088d684690786bde89_41_3.png)


    ### VPNS AND TOR

    The previous steps can aid your online privacy but to really become anonymous
    you need a Virtual Private Network and Tor.


    - **STEP 1** A VPN is a remote server, or cluster of servers, that establishes
    a connection with your computer. The end result is that your computer''s identity
    on the Internet is hidden behind the VPN remote server; so you could live in the
    UK but have an IP address (the computer online identity) belonging to Iceland.


    ### How VPN works?

    ![](img/6103e44aa372eb088d684690786bde89_42_0.png)


    - **STEP 2** Most good VPNs charge a monthly or annual fee but it''s worth the
    expense. We use CyberGhost, www.cyberghostvpn.com, which offers VPN connections
    for Windows, Mac, Mint (as well as other Linux distros), Android and iOS devices.
    Details for each OS can be found at www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first-.

    ![](img/6103e44aa372eb088d684690786bde89_42_1.png)


    - **STEP 3** Another option is to use Tor. Tor is an open network that you can
    attach to that hides your IP address behind countless nodes around the world.
    It''s available for Windows, Mac and Linux computers and is very easy to install
    and use. Start by navigating to www.torproject.org/download/download-easy.html.en
    and clicking on the Download Linux 64-bit button.

    ![](img/6103e44aa372eb088d684690786bde89_42_2.png)


    - **STEP 4** When the download has finished, drop into the Terminal and enter
    the Downloads folder, cd Downloads/. Enter ls to check the tar.xz Tor file is
    present, then enter: tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz (Tor is updated
    regularly, so if your version is different press Tab to autocomplete the tor-browser-
    filename). When the files are unpacked, use cd tor-browser_en-US/ to enter the
    new folder.


    ```

    david@david-Mint:~/Downloads/tor-browser_en-US$ tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls

    tor-browser_en-US  tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$ tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    Browser  start-tor-browser.desktop

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls

    ```


    - **STEP 5** A quick ls reveals a couple of entries: a folder called Browser and
    a file called ''start-tor-browser.desktop''. To start the Tor setup, type ./start-tor-browser.desktop.
    This command launches the Tor setup, where you are offered two options: Connect
    or Configure. For most users, the Connect option will suffice. Click Connect when
    you''re ready.

    ![](img/6103e44aa372eb088d684690786bde89_42_3.png)


    - **STEP 6** After the connection is established, the Tor Browser launches. This
    is a customised version of Firefox and from here you can securely browse the Internet
    without fear of being viewed or tracked. Mixing both a VPN and Tor makes for an
    extremely secure and private connection to the online world.

    ![](img/6103e44aa372eb088d684690786bde89_42_4.png)'
  mdcn: '

    ## 自定义桌面

    自定义操作系统桌面是让系统贴合个人使用的方式之一：打造个性化的工作区，既可以帮助你工作、给你带来灵感，也可以展示公司标志。无论你出于什么原因想要专属桌面，以下是操作方法：

    - **STEP 1** 桌面自定义的第一步是更换壁纸。右键点击桌面，选择「更改桌面背景」。这会打开 Linux Mint 中的背景设置应用；请注意，其他发行版展示背景、壁纸选择工具的方式可能有所不同。

    ![](img/6103e44aa372eb088d684690786bde89_39_0.png)

    - **STEP 2** 较新版本的 Linux Mint 会展示对应系统版本的可用背景。通常你会看到三个分类，之后还有一个与其他分类分隔开的「图片」分类。「图片」选项比较特殊，它会读取你主目录下「图片」文件夹中的图片内容。

    ![](img/6103e44aa372eb088d684690786bde89_39_1.png)

    - **STEP 3** 你只需要点击上述任意位置提供的可用图片，就能将其设置为桌面壁纸。顺便一提，如果你的图片存储在系统或网络的其他位置，可以点击背景设置控制台底部的加号按钮，通过文件管理器找到这些图片来添加。

    ![](img/6103e44aa372eb088d684690786bde89_39_2.png)

    - **STEP 4** 你也可以点击「设置」标签页，切换为播放多张图片的幻灯片模式，或是将壁纸的外观切换为多种不同的样式。

    ![](img/6103e44aa372eb088d684690786bde89_39_3.png)

    - **STEP 5** 如果现有壁纸都不合你意，可以打开浏览器搜索你偏好的背景图片类型。找到心仪的图片后，右键点击它，在选项列表中选择「设为桌面背景」。打开「设置桌面背景」控制台后，点击「设置桌面背景」按钮。

    ![](img/6103e44aa372eb088d684690786bde89_40_0.png)

    - **STEP 6** 点击菜单按钮，搜索「desktop」，点击搜索结果中的「桌面设置」。桌面控制台允许你选择布局、桌面图标和多显示器支持的相关配置。你可以根据个人喜好尝试不同选项，找到最适合的配置。

    ![](img/6103e44aa372eb088d684690786bde89_40_2.png)

    - **STEP 7** 除了更换桌面壁纸和图标显示方式，你还可以修改 Linux Mint 的整体主题。从 Mint 菜单中搜索「themes」，在搜索结果中点击「主题」应用。

    ![](img/6103e44aa372eb088d684690786bde89_40_4.png)

    - **STEP 8** 主题可以让你更改 Mint 桌面部分组件的外观：窗口边框、图标、控件、鼠标指针和桌面。在「设置」标签页中，你还可以通过几个开关滑块按钮扩展配置选项。

    ![](img/6103e44aa372eb088d684690786bde89_40_1.png)

    - **STEP 9** 如果你点击三个可用选项中间的「添加/删除」按钮，就可以从多个预装主题中选择默认主题风格。点击你喜欢的主题，再点击「安装」（向下箭头）按钮启用它。

    ![](img/6103e44aa372eb088d684690786bde89_40_3.png)

    - **STEP 10** 再点击「主题」，然后选择「桌面」，就能找到新安装的主题并应用到你的桌面。所有已安装的主题都可以通过「添加/删除」按钮卸载。花点时间按照你的喜好个性化桌面是值得的，而且还有非常多惊艳的主题可供选择。

    ![](img/6103e44aa372eb088d684690786bde89_40_5.png)


    ## 在线匿名

    数字时代给通信领域带来了许多重大进步；但同时也开启了新的间谍和监视时代。我们大多数人都对关于政府、秘密组织和地下黑客侵犯我们隐私的频繁新闻报道见怪不怪，但你能如何对抗这种情况呢？

    ### 在 Mint 中实现匿名

    虽然完全实现在线匿名几乎是不可能的，但你可以采取措施最大程度保障自己的隐私。

    - **STEP 1** 从基础做起，浏览时使用 HTTPS 而非普通 HTTP。这意味着通过 HTTPS 传输的所有内容都是安全的（因此结尾有 S）且经过加密。

    ![](img/6103e44aa372eb088d684690786bde89_41_0.png)

    - **STEP 2** 浏览时可以考虑使用浏览器提供的无痕或隐私浏览模式。该模式会禁用网页历史和网页缓存，让你浏览的细节不会被存储，避免后续被他人审查。不过，它无法阻止数据或搜索追踪。

    ![](img/6103e44aa372eb088d684690786bde89_41_1.png)

    - **STEP 3** 虽然使用谷歌似乎是现代网络搜索的显而易见的选择，但该公司会追踪个人的所有搜索记录。不妨考虑使用其他搜索引擎，比如 DuckDuckGo，它不会存储个人数据，也不会追踪你。

    ![](img/6103e44aa372eb088d684690786bde89_41_2.png)

    - **STEP 4** 如果你经常上网，可以考虑安装一些提升隐私的浏览器插件。例如，在 Firefox 中可以使用 Ghostery、NoScript 和
    Adblock Plus 来拦截追踪器、广告和其他数据挖掘行为。

    ![](img/6103e44aa372eb088d684690786bde89_41_3.png)


    ### VPN 和 Tor

    前文介绍的措施可以帮你保护在线隐私，但若要真正实现匿名，你需要使用虚拟专用网络（VPN）和 Tor。

    - **STEP 1** VPN 是一台远程服务器或服务器集群，会与你的电脑建立连接。最终效果是你的电脑在互联网上的身份被隐藏在 VPN 远程服务器之后；也就是说，你可以身处英国，却拥有属于冰岛的
    IP 地址（即电脑的网络身份）。

    ### VPN 工作原理！

    ![](img/6103e44aa372eb088d684690786bde89_42_0.png)

    - **STEP 2** 大部分优质 VPN 会收取月费或年费，但这是值得的。我们使用的是 CyberGhost，网址 www.cyberghostvpn.com，它提供适用于
    Windows、Mac、Mint（以及其他 Linux 发行版）、安卓和 iOS 设备的 VPN 连接。各个操作系统的相关说明可以在 www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first-
    找到。

    ![](img/6103e44aa372eb088d684690786bde89_42_1.png)

    - **STEP 3** 另一个选择是使用 Tor。Tor 是一个开放网络，加入后你的 IP 地址会被全球无数节点隐藏。它支持 Windows、Mac 和
    Linux 电脑，安装和使用都非常简单。首先访问 www.torproject.org/download/download-easy.html.en，点击「下载
    Linux 64 位」按钮。

    ![](img/6103e44aa372eb088d684690786bde89_42_2.png)

    - **STEP 4** 下载完成后，打开终端并进入下载文件夹，输入 `cd Downloads/`。输入 `ls` 检查 tar.xz 格式的 Tor 压缩包是否存在，然后输入：

    ```tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz```

    （Tor 会定期更新，如果你的版本不同，按下 Tab 键可自动补全 tor-browser- 开头的文件名）。文件解压完成后，输入 `cd tor-browser_en-US/`
    进入新文件夹。

    ```david@david-Mint:~/Downloads/tor-browser_en-US$ tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls

    tor-browser_en-US

    tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$ tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    Browser

    start-tor-browser.desktop

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls```

    - **STEP 5** 输入 `ls` 可以看到两个条目：一个名为 Browser 的文件夹和一个名为 `start-tor-browser.desktop`
    的文件。要启动 Tor 设置，输入 `./start-tor-browser.desktop`。该命令会启动 Tor 设置程序，会提供两个选项：连接或配置。对于大多数用户来说，「连接」选项就足够了。准备好后点击「连接」。

    ![](img/6103e44aa372eb088d684690786bde89_42_3.png)

    - **STEP 6** 连接建立后，Tor 浏览器就会启动。这是定制版的 Firefox，之后你就能安全地浏览互联网，不用担心被窥探或追踪。同时使用 VPN
    和 Tor 可以让你和网络的连接极为安全且私密。

    ![](img/6103e44aa372eb088d684690786bde89_42_4.png)

