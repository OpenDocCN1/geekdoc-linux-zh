  md: "# Creating Bash Scripts – Part 5\n\nThe backup script we looked at previously\
    \ can be further amended to incorporate choices, user-interaction with regards\
    \ to where the backup file will be copied to and so on. Automating tasks is one\
    \ of the main benefits of Bash scripting, a simple script can help you out in\
    \ many ways.\n\n# EASY AUTOMATION AND HANDY SCRIPTS\n\nEntering line after line\
    \ of commands to retrieve system information, find a file or rename a batch of\
    \ files? A script is a better answer.\n\n# STEP 1\n\nLet's start by creating a\
    \ script to help display the Mint system information; always a handy thing to\
    \ have. Create a new script called **sysinfo.sh** and enter the following into\
    \ Xed, or the text editor of your choice.\n\n```\n#!/bin/bash\n\n# -Hostname information:\n\
    echo -e \"\\e[31;43m***** HOSTNAME INFORMATION *****\\e[0m\"\nhostname1\n\necho\n\
    \n# -File system disk space usage:\necho -e \"\\e[31;43m***** FILE SYSTEM DISK\
    \ SPACE USE *****\\e[0m\"\ndf -h\n\necho\n\n# -Free and used memory:\necho -e\
    \ \"\\e[31;43m***** FREE AND USED MEMORY *****\\e[0m\"\nfree\n\necho\n\n# -System\
    \ uptime and performance load:\necho -e \"\\e[31;43m***** SYSTEM UPTIME AND LOAD\
    \ *****\\e[0m\"\nuptime\n\necho\n\n# -Users currently logged in:\necho -e \"\\\
    e[31;43m***** CURRENT USERS *****\\e[0m\"\nwho\n\necho\n\n# -Top five processes\
    \ being used by the system:\necho -e \"\\e[31;43m***** TOP 5 MEMORY CONSUMING\
    \ PROCESSES *****\\e[0m\"\nps -eo %mem,pcpu,comm --sort=-%mem | head -n 6\n\n\
    echo\n\necho -e \"\\e[1;32mDone.\\e[0m\"\n```\n\n# STEP 2\n\nWe've included a\
    \ couple of extra commands in this script. The first is the -e extension for echo,\
    \ which means it'll enable echo interpretation of additional instances of a new\
    \ line, as well as other special characters. The proceeding '31;43m' element enables\
    \ colour for foreground and background.\n\n```\ndavid@david-mint ~/scripts $ ./sysinfo.sh\n\
    \n********** HOSTNAME INFORMATION **********\nStatic hostname: david-mint\n  \
    \       Icon name: computer-vm\n           Chassis: v\n        Machine ID: Sab3c275b7304ed3b8aeef9ffcc37eb4\n\
    \           Boot ID: 61c1baadf934f649c5ac809abe7e18\n    Virtualization: oracle\n\
    Operating System: Linux Mint 18.1\n           Kernel: Linux 4.4.0-53-generic\n\
    \     Architecture: x86-64\n\n********* FILE SYSTEM DISK SPACE USE ********\n\
    ```\n\n# STEP 3\n\nEach of the sections runs a different Terminal command, outputting\
    \ the results under the appropriate heading. You can include a lot more, such\
    \ as the current aliases being used in the system, the current time and date and\
    \ so on. Plus, you could also pipe all that information into a handy HTML file,\
    \ ready to be viewed in a browser.\n\n![](img/6103e44aa372eb088d684690786bde89_75_0.png)\n\
    \n# STEP 4\n\nAlthough there are simple Terminal commands to help you look for\
    \ a particular file or folder, it's often more fun to create a script to help\
    \ you. Plus, you can use that script for other non-technical users. Create a new\
    \ script called **look4.sh**, entering the content from the screenshot below.\n\
    \n![](img/6103e44aa372eb088d684690786bde89_75_1.png)"
