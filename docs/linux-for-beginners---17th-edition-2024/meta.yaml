- md: '"Anyone can build a fast processor. The trick is to build a fast system." –
    Seymour Cray (Electrical Engineer, and designer/founder of Cray Supercomputers)

    ![](img/6103e44aa372eb088d684690786bde89_27_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_28_0.png)


    ## Getting to Know Linux

    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro and
    perfect for former Windows users. It''s also one of the most developed and well
    documented Linux distros as well as having some fantastic configuration options.
    In this section, we introduce the Linux Mint Cinnamon Menu and Desktop Environment,
    how it works and what you can do to customise it. Want to create another user
    or even discover how to become anonymous online? Then read on.

    ![](img/6103e44aa372eb088d684690786bde89_28_1.png)


    ### Introduction to the Cinnamon Menu

    Now that you have Linux installed it''s time to have a good look around. First
    though, if you''re using Virtualbox you''ll have a notification regarding Software
    Rendering; here''s how to fix it.


    ### CINNAMON VIRTUALBOX FIX

    - **STEP 1** Before we begin, we''re assuming you''re having this issue within
    Virtualbox. The Software Rendering message appears in the top right of the desktop.
    To fix this, click on Devices in the Virtualbox window, followed by Insert Guest
    Additions CD Image.

    ![](img/6103e44aa372eb088d684690786bde89_29_0.png)


    - **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including
    the virtual video hardware. When it''s loaded in, you get a ''software needs to
    run'' notification box with two options, Cancel and Run. Click the Run button
    and enter your Linux user password.

    ![](img/6103e44aa372eb088d684690786bde89_29_1.png)


    - **STEP 3** After a moment or two you''re automatically dropped into a command
    line view, called the Terminal in Linux. This details the installation of the
    new VirtualBox drivers, removing any old drivers it has detected, and installing
    the latest versions. It won''t take long and when it''s done you will be asked
    to hit Return to exit the Terminal.

    ![](img/6103e44aa372eb088d684690786bde89_29_2.png)


    - **STEP 4** The Virtualbox Additions CD icon is on the desktop, so right-click
    it and then scroll down the menu to click Eject. You can now restart Linux Mint
    by clicking the Menu, the bottom icon in the strip to the left, then the Restart
    button. This reboots Mint and the problem is fixed.

    ![](img/6103e44aa372eb088d684690786bde89_29_3.png)


    ### CINNAMON ON THE MENU

    Now the Software Rendering issue for Virtualbox users is out of the way, let''s
    take a look at the Mint Menu and how it all works. Remember, this is just for
    Mint Cinnamon, other distros look and behave differently.


    #### STEP 1

    First off, you may have already noticed the Welcome Screen that pops up when you
    login to Linux Mint. Take a moment to browse through the options, read the First
    Steps option and so on. When you''re done, click the X in the top right corner
    of the window to close it.

    ![](img/6103e44aa372eb088d684690786bde89_30_0.png)


    #### STEP 2

    You''ve already used the Mint Menu to reboot the system and when you first used
    the Live Environment. This time, click the Menu button and hover over the Office
    entry in the middle column. This changes the icons represented in the right-hand
    column, detailing what apps are installed under that section.

    ![](img/6103e44aa372eb088d684690786bde89_30_2.png)


    #### STEP 3

    Launching any of the apps from the Menu is as simple as finding one and clicking
    it. For example, under the Office section, click on LibreOffice Writer. Writer
    is the preinstalled word processor for Linux Mint. It opens and saves as Microsoft
    Word and functions in almost the same way.

    ![](img/6103e44aa372eb088d684690786bde89_30_4.png)


    #### STEP 4

    Open up the Menu again but this time hover the mouse pointer over Graphics, then
    click on GNU Image Manipulation Program. GIMP is a powerful image manipulation
    app that''s probably as effective as Adobe''s Photoshop but requires a little
    more work to get the results you want. It''s certainly worth taking the time to
    master, though.

    ![](img/6103e44aa372eb088d684690786bde89_30_1.png)


    #### STEP 5

    If you''re looking for a particular function or app, such as setting up a printer,
    click on the Search box at the top of the Menu box. Start typing the app or function
    you want, such as printers, and the Mint Menu displays the relevant options below.
    This works with most modern Linux menus, regardless of the distro.

    ![](img/6103e44aa372eb088d684690786bde89_30_3.png)


    #### STEP 6

    Hover over any of the apps listed on the right-hand column and right-click, to
    be presented with a list of options: Add to Panel, Add to Desktop, Add to Favourites
    and Uninstall. Most of these options are obvious in their use. Add to Favourites
    though places the app in the left-hand, quick-access column.

    ![](img/6103e44aa372eb088d684690786bde89_30_5.png)


    ## Navigating the Cinnamon Desktop

    ### A TOUCH OF SPICE

    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to like about it, which is why it''s such a popular DE.


    #### STEP 1

    Begin exploring the Cinnamon desktop by double-clicking the Computer icon. This
    brings up Nemo, the file manager used in Cinnamon. The Computer icon opens up
    the root level file system, with access and views to the optical drive (if you
    have one installed), hard drive and core Linux file system.

    ![](img/6103e44aa372eb088d684690786bde89_31_0.png)


    #### STEP 2

    The Linux file system can appear confusing to a former Windows user, so until
    you''re a little more knowledgeable on how it all works, we''d recommend you concentrate
    on the Home icon on the desktop instead. In here is everything relating to your
    user account: where you store Pictures, Videos, Music, Documents, Downloaded items
    etc.

    ![](img/6103e44aa372eb088d684690786bde89_31_2.png)


    #### STEP 3

    Nemo has many different features, views and ways so that you can view and manipulate
    files and folders. For example, if you have any images in the Pictures folder,
    you can select the icon zoom level for the images by using the slider located
    in the bottom right of Nemo, labelled Adjust Zoom Level.

    ![](img/6103e44aa372eb088d684690786bde89_31_1.png)


    #### STEP 4

    Just like any good file manager, if you right-click any of the files or folders
    within you get a wealth of options. In the case of Cinnamon, the defaults allow
    you to play or view a file depending on what type of file it is and copy, cut,
    delete, compress, rename, send via email and view its properties.

    ![](img/6103e44aa372eb088d684690786bde89_31_3.png)


    #### STEP 5

    At the bottom of the desktop there''s the Panel. We''ve already looked at one
    section of the Panel, the Menu. If you right-click anywhere on the Panel, other
    than on a Panel app, you see a menu allowing you to edit, add and set up the Panel
    in a different way.

    ![](img/6103e44aa372eb088d684690786bde89_32_0.png)


    #### STEP 6

    For example, if you click the option Modify Panel, you can remove, move, remove
    the Panel, add a new one and clear it of any Applets that are currently present.
    An Applet, by the way, is an app that''s designed to work and fit into the Cinnamon
    Panel.

    ![](img/6103e44aa372eb088d684690786bde89_32_1.png)


    #### STEP 7

    If you right-click anywhere on the Cinnamon desktop you see a set of options that
    allows you to further add to, edit or view the desktop content differently. It''s
    very similar to that of Windows, which is why Mint is a good choice for ex-Windows
    users.

    ![](img/6103e44aa372eb088d684690786bde89_32_2.png)


    #### STEP 8

    From that desktop right-click, context menu, select Customise, followed by the
    Desktop Settings link at the bottom of the newly opened window. This opens a new
    window where you''re able to edit which desktop icons are present. If you''re
    using a setup with multiple monitors attached, you can also choose which monitor
    displays which icons.

    ![](img/6103e44aa372eb088d684690786bde89_32_3.png)


    #### STEP 9

    Click on the Menu and type system settings and open the resulting icon. This takes
    you to the System Settings options. From here you''re able to control and edit
    the way Linux Mint Cinnamon looks and works as well as add new users, manage the
    firewall and enable accessibility options.

    ![](img/6103e44aa372eb088d684690786bde89_32_4.png)


    #### STEP 10

    In short, Linux Mint Cinnamon can be configured to look quite extraordinary. There
    are many examples available of how good it can get and what can be achieved. You
    can go as complex or as simple as you want, adding different components and animations
    or just keeping it plain and easy to read.

    ![](img/6103e44aa372eb088d684690786bde89_32_5.png)'
  mdcn: '

    「任何人都能造出快速的处理器，关键在于打造快速的系统。」——西摩·克雷（电气工程师，克雷超级计算机的设计者/创始人）

    ![](img/6103e44aa372eb088d684690786bde89_27_0.png)

    ![](img/6103e44aa372eb088d684690786bde89_28_0.png)

    ## 了解Linux

    本文以Linux Mint为参考示例，因为它是一款易于使用的发行版，非常适合前Windows用户。它也是发展最成熟、文档最完善的Linux发行版之一，还拥有出色的配置选项。本节将介绍Linux
    Mint的Cinnamon菜单与桌面环境，包括其运行逻辑以及自定义操作方法。想要创建新用户，或是了解如何实现线上匿名？请继续阅读。

    ![](img/6103e44aa372eb088d684690786bde89_28_1.png)

    ### Cinnamon菜单简介

    现在你已经安装好了Linux，是时候好好熟悉一下系统了。首先，如果你使用的是VirtualBox，可能会收到关于软件渲染的通知，下面介绍解决方法。

    ### CINNAMON版VirtualBox修复

    - **步骤 1**

    操作前请确认你遇到的是VirtualBox内的该问题。软件渲染通知会显示在桌面右上角，修复方法为：点击VirtualBox窗口中的「设备」选项，再选择「安装增强功能CD镜像」。

    ![](img/6103e44aa372eb088d684690786bde89_29_0.png)

    - **步骤 2**

    增强功能CD内包含VirtualBox的驱动程序，其中还有虚拟显卡驱动。加载完成后，会弹出「软件需要运行」的通知框，提供「取消」和「运行」两个选项，点击「运行」按钮并输入你的Linux用户密码即可。

    ![](img/6103e44aa372eb088d684690786bde89_29_1.png)

    - **步骤 3**

    片刻后系统会自动跳转到命令行界面，Linux中称之为终端。该界面会显示新VirtualBox驱动的安装流程，包括卸载检测到的旧驱动、安装最新版本驱动。整个过程耗时很短，完成后会提示你按下回车键退出终端。

    ![](img/6103e44aa372eb088d684690786bde89_29_2.png)

    - **步骤 4**

    桌面上会出现VirtualBox增强功能CD的图标，右键点击该图标，在弹出的菜单中向下滚动找到「弹出」选项并点击。之后点击左侧任务栏最下方的菜单按钮，选择「重启」即可重启Linux
    Mint，重启后问题即得到解决。

    ![](img/6103e44aa372eb088d684690786bde89_29_3.png)

    ### Cinnamon菜单操作

    VirtualBox用户的软件渲染问题已经解决，接下来我们来看看Mint菜单的具体用法。请注意，以下内容仅适用于Mint Cinnamon版本，其他发行版的菜单外观和操作逻辑有所不同。

    #### 步骤 1

    首先，你可能已经注意到了登录Linux Mint时弹出的欢迎界面。你可以花一点时间浏览其中的选项，阅读「新手入门」等内容，完成后点击窗口右上角的「X」按钮关闭即可。

    ![](img/6103e44aa372eb088d684690786bde89_30_0.png)

    #### 步骤 2

    之前我们已经用Mint菜单重启过系统，初次使用实时环境时也接触过它。这次请点击菜单按钮，将鼠标悬停在中间列的「办公」选项上，此时右侧列的图标会随之切换，展示该分类下安装的所有应用。

    ![](img/6103e44aa372eb088d684690786bde89_30_2.png)

    #### 步骤 3

    从菜单启动应用非常简单，找到对应应用点击即可。例如，在「办公」分类下点击LibreOffice Writer，它是Linux Mint预装的字处理软件，可打开和保存为Microsoft
    Word格式，操作逻辑也几乎一致。

    ![](img/6103e44aa372eb088d684690786bde89_30_4.png)

    #### 步骤 4

    再次打开菜单，将鼠标指针悬停在「图形」选项上，然后点击「GNU图像处理程序」。GIMP是一款功能强大的图像处理应用，处理效果不逊于Adobe Photoshop，只是需要多花些精力才能得到你想要的效果，但花时间掌握它绝对是值得的。

    ![](img/6103e44aa372eb088d684690786bde89_30_1.png)

    #### 步骤 5

    如果你需要查找特定功能或应用（比如设置打印机），可以点击菜单顶部的搜索框，输入你想要的应用或功能名称（比如「打印机」），Mint菜单就会在下方展示相关选项。该功能适用于绝大多数现代Linux发行版的菜单。

    ![](img/6103e44aa372eb088d684690786bde89_30_3.png)

    #### 步骤 6

    将鼠标悬停在右侧列的任意应用上并右键点击，会弹出选项列表：添加到面板、添加到桌面、添加到收藏夹、卸载。大部分选项的用途一目了然，其中「添加到收藏夹」会将应用放入左侧的快速访问列中。

    ![](img/6103e44aa372eb088d684690786bde89_30_5.png)

    ## 操作Cinnamon桌面

    ### 桌面亮点

    Cinnamon桌面环境是风格与性能的完美结合，诸多优点让它成为非常受欢迎的桌面环境（DE）。

    #### 步骤 1

    双击桌面上的「计算机」图标即可开始探索Cinnamon桌面，这会打开Cinnamon使用的文件管理器Nemo。「计算机」图标对应根级文件系统，可访问和查看光驱（若已安装）、硬盘以及Linux核心文件系统。

    ![](img/6103e44aa372eb088d684690786bde89_31_0.png)

    #### 步骤 2

    Linux文件系统对前Windows用户来说可能较难理解，因此在你熟悉其运作逻辑之前，我们建议你优先使用桌面上的「主文件夹」图标。该文件夹内存储了与你用户账户相关的所有内容：图片、视频、音乐、文档、下载项等。

    ![](img/6103e44aa372eb088d684690786bde89_31_2.png)

    #### 步骤 3

    Nemo提供了丰富的功能、视图和操作方式，方便你查看和管理文件与文件夹。例如，如果「图片」文件夹内有图片，可以通过Nemo右下角标注为「调整缩放级别」的滑块来调整图标的显示大小。

    ![](img/6103e44aa372eb088d684690786bde89_31_1.png)

    #### 步骤 4

    和所有优秀的文件管理器一样，在Nemo内右键点击任意文件或文件夹，都会弹出丰富的操作选项。在Cinnamon中，默认选项支持根据文件类型播放或查看文件，以及复制、剪切、删除、压缩、重命名、通过邮件发送、查看属性等操作。

    ![](img/6103e44aa372eb088d684690786bde89_31_3.png)

    #### 步骤 5

    桌面底部是任务栏，之前我们已经介绍过任务栏的一部分——菜单。右键点击任务栏上的任意非应用图标区域，会弹出菜单，支持你以不同方式编辑、添加和设置任务栏。

    ![](img/6103e44aa372eb088d684690786bde89_32_0.png)

    #### 步骤 6

    例如，点击「修改任务栏」选项，你可以移除、移动现有任务栏，添加新任务栏，或者清除任务栏上现有的所有小程序。补充说明：小程序是指专为适配Cinnamon任务栏设计的小型应用。

    ![](img/6103e44aa372eb088d684690786bde89_32_1.png)

    #### 步骤 7

    右键点击Cinnamon桌面的任意空白区域，会弹出选项列表，支持你进一步添加、编辑或以不同方式查看桌面内容。该逻辑与Windows非常相似，这也是Mint适合前Windows用户的重要原因。

    ![](img/6103e44aa372eb088d684690786bde89_32_2.png)

    #### 步骤 8

    在弹出的桌面右键菜单中，选择「自定义」，再点击新打开窗口底部的「桌面设置」链接。这会打开一个新窗口，你可以在其中编辑桌面显示的图标。如果你使用的是多显示器配置，还可以选择每个显示器要显示的图标。

    ![](img/6103e44aa372eb088d684690786bde89_32_3.png)

    #### 步骤 9

    点击菜单，输入「系统设置」并打开对应的图标，即可进入系统设置选项页面。在这里你可以控制和修改Linux Mint Cinnamon的外观与运行逻辑，还可以添加新用户、管理防火墙、开启辅助功能选项。

    ![](img/6103e44aa372eb088d684690786bde89_32_4.png)

    #### 步骤 10

    总而言之，Linux Mint Cinnamon的外观可以配置得十分出色，网上有许多案例展示了它的可定制空间和最终效果。你可以根据自己的需求选择复杂或简约的风格，添加不同的组件和动画，也可以保持朴素易读的样式。

    ![](img/6103e44aa372eb088d684690786bde89_32_5.png)

