    # Creating a File Using the Terminal


    Using the Terminal, you''re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn''t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # MORE TERMINAL WORK


    Creating content using the Terminal isn''t quite as strenuous as it may first
    appear. Yes, the Terminal can look a daunting place for the newcomer, but once
    mastered it''s really quite intuitive.


    **STEP 1** Open up the Terminal, and make sure you''re in the Home folder. If
    not use the `cd ~` command to return you to the Home folder from wherever you''re
    currently located.


    **STEP 3** Your command line should change to the Test folder and if you enter
    `ls` (List folder contents) there''ll be nothing within the folder, as you''ve
    just created it. The `mkdir` command is fairly self explanatory: Make Directory
    followed by the name of your choosing.


    ![](img/6103e44aa372eb088d684690786bde89_55_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_55_1.png)


    **STEP 2** Let''s start by creating a new folder within Home, and call it Test.
    The command you''ll need is `mkdir Test`. Press Enter to create the folder when
    you''ve typed in the command, then `cd Test` and press Enter. This will Change
    Directory (hence CD) to the newly created Test folder.


    **STEP 4** To create an empty text file, called Test.txt, enter in the Terminal:
    `touch Test.txt`. You can then use `ls` to view the new file in the folder. Touch
    is a standard Linux command that allows the creation of files without the need
    to open a text editor, save the file, then close the editor.


    ![](img/6103e44aa372eb088d684690786bde89_55_2.png)


    ![](img/6103e44aa372eb088d684690786bde89_55_3.png)'
  - '[PAGE 56]


    # Creating a File Using the Terminal


    # STEP 5


    Let''s say you now wanted to create a text file, we''ll call it **Test2.txt**,
    complete with some content. To do so, enter: `cat > Test2.txt`. This will create
    the file **Test2.txt** and put the Terminal into an editing mode.


    ![](img/6103e44aa372eb088d684690786bde89_56_0.png)


    # STEP 6


    You''ll notice that the cursor is flashing below the `cat > Test2.txt` command,
    without the usual prompt. This editing mode will allow you enter the text that
    the file will contain. Enter some text, then press **Ctrl+D** to exit and write
    the contents to the file.


    ![](img/6103e44aa372eb088d684690786bde89_56_1.png)


    # STEP 7


    Of course you don''t always have to use the Terminal to enter text into a file.
    Mint comes with a text editor called **Xed**, which is similar to Windows'' Notepad.
    To view the previously created file in Xed, type into the Terminal: `xed Test2.txt`,
    and press **Enter**.


    ![](img/6103e44aa372eb088d684690786bde89_56_2.png)


    # STEP 8


    Xed is a GUI app, and you can enter text and save the file, or any file, accordingly
    by using the app''s main window, and the **File > Save**, or **File > Save As**
    functions from its top menu bar options.


    ![](img/6103e44aa372eb088d684690786bde89_56_3.png)


    # STEP 9


    If, however, you prefer to remain working in the Terminal to edit/save/create
    files, you can use **Nano**. Nano is a simple Terminal-based text editor. To try
    it with the example, enter: `nano Test2.txt`. There''s a menu along the bottom
    of the screen. To exit and save any content in Nano, press **Ctrl+X** and follow
    the on-screen instructions.


    ![](img/6103e44aa372eb088d684690786bde89_56_4.png)


    # STEP 10


    We''ve used the Terminal to launch a Mint app, Xed, but any app can be launched
    from within the Terminal. For example, try: `firefox`, and press **Enter**. Close
    Firefox to return to the Terminal. Providing you know the name of the app, it
    can run from the Terminal. Additionally, entering `firefox&` opens Firefox, AND
    lets you still use the Terminal.


    ![](img/6103e44aa372eb088d684690786bde89_56_5.png)'
