  - '[PAGE 39]


    # ## Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is there to help you work, inspire you or feature the company logo.
    Whatever your reasons for having your own desktop, here''s how it''s done.


    # ## YOUR DESKTOP


    Linux is probably one of the customisable operating systems there is. With just
    a few tweaks, one or two extras installed and some imagination, you can create
    something incredible.


    **STEP 1** The first aspect of desktop customisation is to change the wallpaper.
    Right-click the desktop and choose Change Desktop Background. This opens the Backgrounds
    app in Linux Mint; remember, other distros may present their background, wallpaper
    selection tools differently.


    ![](img/6103e44aa372eb088d684690786bde89_39_0.png)


    **STEP 2** More recent versions of Linux Mint display available backgrounds depending
    on the version the user is running. You normally get three categories followed
    by a fourth, Pictures, which is separated from the others. The Pictures option
    is different because it reads the image content from the Pictures folder in your
    Home area.


    ![](img/6103e44aa372eb088d684690786bde89_39_1.png)


    **STEP 3** You just need to click the available images, from any of the locations
    provided to have them install as the desktop wallpaper. Incidentally, if you have
    images stored in another location on your system or network, you can add them
    by clicking on the Plus symbol at the bottom of the Backgrounds console, using
    the file manager to locate them.


    ![](img/6103e44aa372eb088d684690786bde89_39_2.png)


    **STEP 4** By clicking on the Settings tab you can, instead, play numerous images
    as a slideshow or change the aspect of the wallpapers to a variety of choices.


    ![](img/6103e44aa372eb088d684690786bde89_39_3.png)'
  - '[PAGE 40]


    # **STEP 5**


    If none of the available wallpapers take your fancy, open a browser and search
    for the type of background image you prefer. When you''ve found the image you
    want as the desktop wallpaper, right-click it and choose Set As Desktop Background
    from the list of options. When the Set Desktop Background console open, click
    the Set Desktop Background button.


    ![](img/6103e44aa372eb088d684690786bde89_40_0.png)


    # **STEP 8**


    Themes allows you to change the way certain aspects of the Mint desktop look:
    Window Borders, Icons, Controls, Mouse Pointer and Desktop. In the Settings tab
    you can extend the options with a few on/off slider buttons, too.


    ![](img/6103e44aa372eb088d684690786bde89_40_1.png)


    # **STEP 6**


    Click the Menu button and search for ''desktop'' and click the Desktop Settings
    result. The Desktop console allows you to pick the layout, desktop icons and options
    for multi-monitor support you want. You can experiment with the options for the
    best setup, according to your personal tastes.


    ![](img/6103e44aa372eb088d684690786bde89_40_2.png)


    # **STEP 9**


    If you click on the Add/remove button in the centre of the three available options,
    you can choose the default view from a number of preinstalled themes. Click the
    theme you want, then click the Install (downward-pointing arrow) button to enable
    it.


    ![](img/6103e44aa372eb088d684690786bde89_40_3.png)


    # **STEP 7**


    In addition to changing the desktop wallpaper, and how the icons are displayed,
    you can also alter the overall theme for Linux Mint. From the Mint Menu, search
    for ''themes'' and click the Themes app as it appears in the search results.


    ![](img/6103e44aa372eb088d684690786bde89_40_4.png)


    # **STEP 10**


    Click back on Themes, then Desktop and you can locate the newly installed theme
    and apply to your desktop. Any installed Themes can also be uninstalled via the
    Add/Remove button. It’s worth spending some time personalising your desktop how
    you want it and there are some incredible themes available too.


    ![](img/6103e44aa372eb088d684690786bde89_40_5.png)'
  - '[PAGE 41]


    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous online, you can take
    measures to ensure our privacy is at its best.


    +   **STEP 1** Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means that anything that''s transmitted over HTTPS is secure
    (hence the S part at the end) and encrypted.


    ![](img/6103e44aa372eb088d684690786bde89_41_0.png)


    +   **STEP 2** When you''re browsing, consider using the Incognito or Private
    browsing modes available in a browser. This disables your web history and web
    cache, allowing you to browse without the details being stored for later scrutiny
    by someone else. However, it doesn''t stop any data or search tracking.


    ![](img/6103e44aa372eb088d684690786bde89_41_1.png)


    +   **STEP 3** Although using Google may seem like the obvious choice for a modern
    Internet search, the company does track all searches made by an individual. Instead,
    consider an alternative search engine, such as DuckDuckGo, a search engine that
    doesn''t store personal data or track you.


    ![](img/6103e44aa372eb088d684690786bde89_41_2.png)


    +   **STEP 4** If you''re regularly on the Internet then consider installing some
    of the browser plug-ins that enhance your privacy. For example, for Firefox, use
    Ghostery, NoScript and Adblock Plus to block trackers, adverts and other data
    mining techniques.


    ![](img/6103e44aa372eb088d684690786bde89_41_3.png)'
  - '[PAGE 42]


    # Becoming Anonymous Online


    # VPNS AND TOR


    The previous steps can aid your online privacy but to really become anonymous
    you need a Virtual Private Network and Tor.


    STEP 1 A VPN is a remote server, or cluster of servers, that establishes a connection
    with your computer. The end result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; so you could live in the UK but have an
    IP address (the computer online identity) belonging to Iceland.


    # How VPN works?


    ![](img/6103e44aa372eb088d684690786bde89_42_0.png)


    STEP 2 Most good VPNs charge a monthly or annual fee but it''s worth the expense.
    We use CyberGhost, www.cyberghostvpn.com, which offers VPN connections for Windows,
    Mac, Mint (as well as other Linux distros), Android and iOS devices. Details for
    each OS can be found at www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first-.


    ![](img/6103e44aa372eb088d684690786bde89_42_1.png)


    STEP 3 Another option is to use Tor. Tor is an open network that you can attach
    to that hides your IP address behind countless nodes around the world. It''s available
    for Windows, Mac and Linux computers and is very easy to install and use. Start
    by navigating to www.torproject.org/download/download-easy.html.en and clicking
    on the Download Linux 64-bit button.


    ![](img/6103e44aa372eb088d684690786bde89_42_2.png)


    STEP 4 When the download has finished, drop into the Terminal and enter the Downloads
    folder, cd Downloads/. Enter ls to check the tar.xz Tor file is present, then
    enter: tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz (Tor is updated regularly,
    so if your version is different press Tab to autocomplete the tor-browser- filename).
    When the files are unpacked, use cd tor-browser_en-US/ to enter the new folder.


    ```

    david@david-Mint:~/Downloads/tor-browser_en-US$

    tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls

    tor-browser_en-US  tor-browser-linux64-8.0.4_en-US.tar.xz

    david@david-Mint:~/Downloads/tor-browser_en-US$

    tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz

    Browser  start-tor-browser.desktop

    david@david-Mint:~/Downloads/tor-browser_en-US$ ls

    ```


    STEP 5 A quick ls reveals a couple of entries: a folder called Browser and a file
    called ''start-tor-browser.desktop''. To start the Tor setup, type ./start-tor-browser.desktop.
    This command launches the Tor setup, where you are offered two options: Connect
    or Configure. For most users, the Connect option will suffice. Click Connect when
    you''re ready.


    ![](img/6103e44aa372eb088d684690786bde89_42_3.png)


    STEP 6 After the connection is established, the Tor Browser launches. This is
    a customised version of Firefox and from here you can securely browse the Internet
    without fear of being viewed or tracked. Mixing both a VPN and Tor makes for an
    extremely secure and private connection to the online world.


    ![](img/6103e44aa372eb088d684690786bde89_42_4.png)'
- md: '> "Linux: the operating system with a CLUE... Command Line User Environment."
    – Anonymous (Posted on comp. software.testing)


    ![](img/6103e44aa372eb088d684690786bde89_43_0.png)


    ## Using the Terminal


    ![](img/6103e44aa372eb088d684690786bde89_44_0.png)

    ![](img/6103e44aa372eb088d684690786bde89_44_1.png)


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII camp fire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code intricate automated scripts. In this section you will explore the intricacies
    of the Terminal, and how it works with Linux. You will learn how to manipulate
    the Linux file system from the Terminal, and you will discover some odd, but fun
    things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.


    ### Basics of the Terminal


    #### TAKING COMMAND


    - **STEP 1** The Terminal can be accessed by either clicking on the Terminal icon
    on the Panel, located between the Firefox and files icons or launched by opening
    the Menu and selecting it from the left-hand quick launch strip.

    ![](img/6103e44aa372eb088d684690786bde89_45_0.png)


    - **STEP 2** The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    including the desktop and GUI, is a module running from the command line.

    ![](img/6103e44aa372eb088d684690786bde89_45_1.png)


    - **STEP 3** What you currently see in the Terminal is your login name followed
    by the name of the computer; as you named it during setup when you first installed
    Mint. The line then ends with the current folder name; at first this is just a
    tilde ~, which means your Home folder.

    ![](img/6103e44aa372eb088d684690786bde89_45_2.png)


    - **STEP 4** The flashing cursor at the very end of the line is where your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (`pwd`), which outputs the current folder you''re in to the
    screen. Type `pwd` and press Enter.

    ![](img/6103e44aa372eb088d684690786bde89_45_3.png)


    - **STEP 5** All the commands you enter work in the same manner: you enter the
    command, include any parameters to extend the use of the command and press Enter
    to execute the command line you''ve entered. Type into the Terminal: `uname -a`
    and press Enter. This displays some system information regarding Mint.

    ![](img/6103e44aa372eb088d684690786bde89_46_0.png)


    - **STEP 6** Before we get into entering commands, let''s take a moment to see
    what menus the Terminal has to offer. The File menu option allows you to open
    a new Terminal, create a new profile, where you can alter the size, colours and
    behaviour of the Terminal, add a new tab, and close all current active Terminal
    sessions.

    ![](img/6103e44aa372eb088d684690786bde89_46_1.png)


    - **STEP 7** The Edit option lets you copy and paste commands to and from the
    Terminal and other sources; handy for when you want to copy a very long and complex
    command from a web page. It also allows you to edit the current profile preferences.

    ![](img/6103e44aa372eb088d684690786bde89_46_2.png)


    - **STEP 8** View and Search options let you alter the sizing of the Terminal
    window and of course search within the Terminal for any particular key words.

    ![](img/6103e44aa372eb088d684690786bde89_46_3.png)


    - **STEP 9** The Terminal entry extends the profile editing and sizing and allows
    you to alter the character encoding. Interestingly, you can also set it to a Read
    Only mode, which stops you from entering any commands into the Terminal; this
    is good for when you need to permanently display the Terminal contents.

    ![](img/6103e44aa372eb088d684690786bde89_46_4.png)


    - **STEP 10** Finally, the Help option displays the help contents and version
    number of the Terminal, or to be more precise, GNOME Terminal; we''ll simply refer
    to it as Terminal in future. The Contents are worth having a quick read through,
    to help familiarise yourself with how the Terminal works.

    ![](img/6103e44aa372eb088d684690786bde89_46_5.png)


    ## Update Mint via the Terminal


    - **STEP 1** Start by opening a new Terminal or if you already have one opened
    clear its contents with the clear command. This starts you off with a clean slate
    on which to work.

    ![](img/6103e44aa372eb088d684690786bde89_47_0.png)


    - **STEP 2** Enter: `apt-get` into the Terminal. This brings up a list of the
    most used apt-get commands, along with a brief description of what the command
    does. It''s worth having a look at, even if it doesn''t make a huge amount of
    sense at this time.

    ![](img/6103e44aa372eb088d684690786bde89_47_2.png)


    - **STEP 3** Apt-get is used to update and upgrade the software in Mint, as well
    as Ubuntu and other Debian-based distros. Using the Update element retrieves new
    package lists and updates the list of source files. Upgrade downloads and performs
    an upgrade to the latest versions of those files. To start the entire Upgrade
    and Update process, enter: `sudo apt-get update`, followed by your password.

    ![](img/6103e44aa372eb088d684690786bde89_47_1.png)


    - **STEP 4** Notice now the addition of the sudo command. The sudo command once
    meant Super User Do; these days it''s more acceptable as Substitute User Do. It
    means that the administrative user (Super User) uses APT (Advanced Packaging Tool)
    to Get any Updates. Now try this: `sudo apt-get upgrade`.

    ![](img/6103e44aa372eb088d684690786bde89_47_3.png)


    - **STEP 5** Depending on the state of your updates, if you have any waiting to
    be installed, you might be asked if you want to apply the results of the **sudo
    apt-get upgrade** command. You can press y to accept and continue. What''s happening
    here is that apt-get has some updated software to apply to Mint, and you''re okaying
    the action.

    ![](img/6103e44aa372eb088d684690786bde89_48_0.png)


    - **STEP 6** There''s likely to be a long list of what seems gibberish now filling
    your Terminal window but don''t worry. The files necessary for the upgrade have
    been downloaded, prepared, unpacked, processed, installed and set up correctly.
    There''s a lot going on when you perform an upgrade, even with the smallest package.

    ![](img/6103e44aa372eb088d684690786bde89_48_2.png)


    - **STEP 7** Essentially, that''s it, your system is now up to date according
    to the available list of packages from the apt-get update command. You can run
    through the process one more time, just to check if everything went okay. To recap,
    enter: **sudo apt-get update**, press **Enter**, then type: **sudo apt-get upgrade**
    and press **Enter**.

    ![](img/6103e44aa372eb088d684690786bde89_48_1.png)


    - **STEP 8** Interestingly, Linux Mint, among other distros, offers you the ability
    to chain several commands together. In this example, therefore, we can use **sudo
    apt-get update && sudo apt-get upgrade**. The double ampersand is what combines
    the commands and works perfectly, providing the preceding command went without
    a hitch. It''s recommended to start any session with the update and upgrade combo.

    ![](img/6103e44aa372eb088d684690786bde89_48_3.png)


    ### TERMINAL VS UPDATE MANAGER?


    Why use the Terminal to update and upgrade over the Update Manager, regardless
    of the distro you''re using? Some users greatly prefer using the Terminal to update
    their Linux systems and accompanying apps, in the belief that it''s better. However,
    that''s not often the case. Using the Terminal, apt-get upgrade, doesn''t handle
    changing dependencies between versions of packages, so if a package has its dependent
    files changed from one version to another, then the upgrade is held back. The
    Update Manager, or Software Manager (depending on the distro), often phases its
    updates and marks those packages with changed dependencies for updating. However,
    and this is where Linux can often get confusing, sometimes it doesn''t. It all
    boils down to the developer of the package being updated and the way the package
    is held in the distro''s repositories and whether the update is classified as
    stable or not.


    In essence, from the point of view of the user, if you update and upgrade using
    both the Terminal and the Update Manager regularly, then you will be as up to
    date as possible, and get the essential and necessary stable versions of the packages
    and core software. If you''re looking for cutting edge package updates, then it''s
    best to opt for a rolling release distro instead.'
  mdcn: "\n> \"Linux：一个带着CLUE（命令行用户环境）的操作系统。\" ——匿名（发布于comp. software.testing新闻组）\n\
    ![](img/6103e44aa372eb088d684690786bde89_43_0.png)\n## 使用终端\n![](img/6103e44aa372eb088d684690786bde89_44_0.png)\n\
    ![](img/6103e44aa372eb088d684690786bde89_44_1.png)\nLinux命令行也就是终端，是一个功能极其强大的环境。通过它，你可以完全掌控操作系统，也能将其升级为更出色的版本。你可以入侵远程计算机、观看动态ASCII字符组成的篝火动画、安装新的应用程序和软件、欣赏来自荷兰服务器上播放的《星球大战》，还能编写复杂的自动化脚本。在本节中，你将了解终端的复杂特性，以及它如何与Linux系统协同工作。你将学会如何通过终端操控Linux文件系统，还会发现一些在终端中可以完成的奇特但有趣的玩法。终端在Linux世界中有着至高无上的地位，了解它的运作方式，你就能解锁它的全部强大功能。\n\
    ### 终端基础\n#### 使用命令\n- **步骤 1**\n  可以通过以下两种方式打开终端：点击面板上位于Firefox图标和文件图标之间的终端图标，或者打开菜单，从左侧快速启动栏中选择终端。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_45_0.png)\n- **步骤 2**\n  终端可以让你访问Linux\
    \ Mint的Shell（名为Bash），通过它你就能访问底层操作系统。Mint中的所有内容——包括桌面和图形用户界面（GUI），都是从命令行运行的模块。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_45_1.png)\n- **步骤 3**\n  当前你在终端中看到的内容是你的登录名，后面跟着你初次安装Mint时设置的计算机名称；这一行的末尾是当前文件夹名称，一开始这里只有一个波浪号~，它代表你的主文件夹。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_45_2.png)\n- **步骤 4**\n  行末闪烁的光标就是你输入文本命令的位置。你可以先尝试一个简单的命令：打印工作目录（`pwd`），它会在屏幕上输出你当前所在的文件夹。输入`pwd`后按下Enter键。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_45_3.png)\n- **步骤 5**\n  你输入的所有命令的运作方式都相同：输入命令本身，添加任意参数来扩展命令的功能，最后按下Enter键执行你输入的命令内容。在终端中输入`uname\
    \ -a`并按下Enter键，这会输出一些与Mint系统相关的信息。\n  ![](img/6103e44aa372eb088d684690786bde89_46_0.png)\n\
    - **步骤 6**\n  在开始输入命令之前，我们先来看看终端提供了哪些菜单选项。“文件”菜单选项可以让你打开新终端、创建新的配置文件，在配置文件中你可以修改终端的大小、颜色和运行行为，还能添加新标签页，关闭所有当前处于活动状态的终端会话。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_46_1.png)\n- **步骤 7**\n  “编辑”选项可以让你在终端和其他来源之间复制、粘贴命令，当你需要从网页上复制冗长复杂的命令时非常实用。该选项还允许你编辑当前的配置文件偏好设置。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_46_2.png)\n- **步骤 8**\n  “视图”和“搜索”选项可以让你调整终端窗口的大小，当然也能在终端中搜索任意特定的关键词。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_46_3.png)\n- **步骤 9**\n  “终端”菜单项扩展了配置文件编辑和大小调整功能，还允许你修改字符编码。有趣的是，你还可以将其设置为只读模式，该模式下你无法在终端中输入任何命令；如果你需要永久展示终端内容，这个模式非常实用。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_46_4.png)\n- **步骤 10**\n  最后，“帮助”选项会展示终端的帮助内容和版本号，更准确地说，是GNOME终端的帮助内容和版本号；之后我们都会直接称其为终端。“帮助内容”部分值得快速浏览一遍，能帮助你熟悉终端的运作方式。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_46_5.png)\n## 通过终端更新Mint系统\n- **步骤\
    \ 1**\n  首先打开一个新终端，如果你已经打开了终端，就用`clear`命令清空其内容，这样你就能拥有一个干净的工作界面。\n  ![](img/6103e44aa372eb088d684690786bde89_47_0.png)\n\
    - **步骤 2**\n  在终端中输入`apt-get`，这会列出最常用的apt-get命令，以及每个命令功能的简要说明。即使现在看不太明白，也值得花点时间浏览一遍。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_47_2.png)\n- **步骤 3**\n  apt-get用于更新和升级Mint、Ubuntu以及其他基于Debian的发行版中的软件。使用update子命令可以获取新的软件包列表，并更新源文件列表；upgrade子命令会下载文件并将其升级到最新版本。要启动完整的升级更新流程，请输入`sudo\
    \ apt-get update`，之后输入你的密码。\n  ![](img/6103e44aa372eb088d684690786bde89_47_1.png)\n\
    - **步骤 4**\n  现在注意新增的sudo命令。sudo命令原本的意思是“超级用户执行（Super User Do）”，现在更普遍的解释是“替换用户执行（Substitute\
    \ User Do）”，它代表管理员用户（超级用户）使用APT（高级打包工具）来获取所有更新。现在试试这个命令：`sudo apt-get upgrade`。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_47_3.png)\n- **步骤 5**\n  根据你当前的更新状态，如果有等待安装的更新，系统会询问你是否要应用**sudo\
    \ apt-get upgrade**命令的结果。你可以按下y键确认并继续。这里的含义是，apt-get发现有一些待更新到Mint系统中的软件，你正在批准这个操作。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_48_0.png)\n- **步骤 6**\n  现在你的终端窗口中可能会出现一大串看起来像乱码的内容，不用紧张。升级所需的文件已经被正确下载、准备、解压、处理、安装和配置。即使是最小的软件包，升级过程中也有大量操作在后台运行。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_48_2.png)\n- **步骤 7**\n  至此，系统的软件包就已经根据apt-get\
    \ update命令获取到的可用列表更新到最新状态了。你可以再重复一遍这个过程，确认所有操作都顺利完成。总结一下操作步骤：输入**sudo apt-get\
    \ update**，按下**Enter**键，然后输入**sudo apt-get upgrade**，再按下**Enter**键。\n  ![](img/6103e44aa372eb088d684690786bde89_48_1.png)\n\
    - **步骤 8**\n  有趣的是，Linux Mint以及其他部分发行版支持将多条命令串联执行。因此在本例中，我们可以使用**sudo apt-get\
    \ update && sudo apt-get upgrade**。双与号（&&）的作用就是合并命令，只要前一条命令执行顺利，后续命令就会正常执行。建议每次使用终端时都以更新升级组合命令开头。\n\
    \  ![](img/6103e44aa372eb088d684690786bde89_48_3.png)\n### 终端 vs 更新管理器？\n为什么无论使用哪种发行版，都有人选择用终端而非更新管理器来执行更新升级操作？部分用户非常喜欢用终端更新Linux系统及配套应用，认为这种方式更优，但事实往往并非如此。通过终端执行apt-get\
    \ upgrade命令时，无法处理不同版本软件包之间的依赖变更：如果某个软件包的依赖文件从上一个版本到新版本发生了变化，升级就会被搁置。而更新管理器（或根据不同发行版也称为软件管理器）通常会分阶段推送更新，并将依赖发生变更的软件包标记为待更新。不过，Linux常常让人困惑的地方就在于此：有时候更新管理器也不会处理这类依赖变更。这一切都取决于待更新软件包的开发者、软件包在发行版仓库中的存储方式，以及该更新是否被归类为稳定版本。本质上，从用户的角度来看，如果你定期同时使用终端和更新管理器进行更新升级，就能尽可能保持系统为最新状态，获取必要且重要的稳定版软件包和核心软件。如果你追求前沿的软件包更新，那么最好选择滚动更新发行版。\n"
