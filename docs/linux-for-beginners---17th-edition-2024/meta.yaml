    ## 实用帮助/信息查询命令

    以下命令在你尝试了解Linux系统或正在使用的程序时非常实用。你或许不会天天用到它们，但一旦需要，它们将至关重要。


    **free**命令用于显示系统中物理内存和交换空间的总空闲量与已用量。例如，`free -m` 会以MB为单位输出相关信息。

    **sed**命令会调用流编辑器，流编辑器用于对输入流（文件或管道传入的内容）执行文本转换操作。

    **df**命令用于显示所有分区的文件系统磁盘空间占用情况。`df -h` 应该是最常用的用法（其中 `-h` 参数表示以人类可读的格式输出）。

    **adduser**命令用于向系统中添加新用户。类似的，addgroup命令用于向系统中添加新用户组。

    **top**程序可以动态实时展示正在运行的系统状态，既能输出系统汇总信息，也能列出进程列表。

    **deluser**命令用于从系统中删除用户。若要同时删除用户的个人文件和主目录，你需要添加 `-remove-home` 参数。

    使用 `-a` 参数的**uname**命令会输出所有系统信息，包括主机名、内核名称、内核版本及其他若干详细信息。

    **delgroup**命令用于从系统中删除用户组。你不能删除任何用户的主用户组。

    **ps**命令可以让你查看机器上运行的所有进程。不同操作系统的ps命令版本略有差异，但功能都是一致的。

    **man man**命令会调出man命令的手册条目，是上手使用man命令的绝佳起点。

    **grep**命令可以在多个文件中搜索特定的匹配模式，并输出符合条件的行。示例如下：`grep blah file`。

    **man intro**命令非常实用，它会展示《用户命令入门》，这是一份写得很好、篇幅简短的Linux命令行入门指南。


    ## 终端使用

    ### Linux命令A-Z速查

    Linux命令多达数千种，因此这里虽未涵盖全部命令，但整理了你最可能用到的诸多命令。你最终大概率只会反复使用其中一小部分命令，但掌握全面的命令知识仍然非常有用。


    ### A

    - **adduser**：添加新用户

    - **arch**：输出机器架构信息

    - **awk**：在文件中查找并替换文本


    ### D

    - **dd**：数据转储、转换及复制文件

    - **diff**：展示两个文件的差异

    - **dirname**：将完整路径名转换为仅含路径的部分

    - **du**：估算文件所占空间


    ### G

    - **gawk**：在文件中查找并替换文本

    - **grep**：在文件中搜索匹配指定模式的行

    - **groups**：输出用户所属的全部用户组名称

    - **gzip**：压缩或解压指定文件


    ### B

    - **bc**：任意精度计算器语言


    ### E

    - **echo**：在屏幕上输出信息

    - **ed**：面向行的文本编辑器（edlin）

    - **egrep**：在文件中搜索匹配扩展正则表达式的行

    - **env**：展示、设置或删除环境变量

    - **expand**：将制表符转换为空格

    - **expr**：计算表达式值


    ### H

    - **head**：输出文件的开头部分

    - **hostname**：输出或设置系统主机名


    ### C

    - **cat**：连接文件并输出到标准输出

    - **chdir**：切换工作目录

    - **chgrp**：修改文件的所属用户组

    - **chroot**：更改根目录

    - **cksum**：输出CRC校验和与字节计数

    - **cmp**：对比两个文件

    - **comm**：逐行对比两个已排序的文件

    - **cp**：将一个或多个文件复制到其他位置

    - **crontab**：定时执行命令

    - **csplit**：按上下文将文件分割为多个部分

    - **cut**：将文件分割为多个部分


    ### I

    - **id**：输出用户ID与用户组ID

    - **info**：帮助信息

    - **install**：复制文件并设置属性


    ### F

    - **factor**：输出质因数

    - **fdisk**：Linux磁盘分区表操作工具

    - **fgrep**：在文件中搜索匹配固定字符串的行

    - **find**：搜索符合指定条件的文件

    - **fmt**：重新格式化段落文本

    - **fold**：按指定宽度折行文本

    - **format**：格式化磁盘或磁带

    - **fsck**：文件系统一致性检查与修复


    ### J

    - **join**：按公共字段合并行


    ### K

    - **kill**：终止正在运行的进程


    ### L

    - **logname**：输出当前登录用户名

    - **lpc**：行式打印机控制程序

    - **lpr**：脱机打印

    - **lprm**：从打印队列中移除任务

    - **less**：分屏显示输出内容

    - **ln**：创建文件链接

    - **locate**：查找文件


    ### S

    - **screen**：终端窗口管理器

    - **sdiff**：交互式合并两个文件

    - **select**：接收键盘输入

    - **seq**：输出数字序列

    - **shutdown**：关闭或重启Linux系统

    - **sleep**：暂停指定时长

    - **sort**：对文本文件进行排序

    - **split**：将文件分割为固定大小的部分

    - **su**：切换用户身份

    - **sum**：输出文件的校验和

    - **symlink**：为文件创建新名称（软链接）

    - **sync**：将内存中的数据同步到磁盘


    ### U

    - **umount**：卸载设备

    - **unexpand**：将空格转换为制表符

    - **uniq**：去除文件中的重复行

    - **units**：在不同量纲间转换单位

    - **unshar**：解压Shell归档脚本

    - **useradd**：创建新用户账户

    - **usermod**：修改用户账户

    - **users**：列出当前已登录的用户


    ### V

    - **vdir**：详细列出目录内容（等价于 `ls -l -b`）


    ### M

    - **man**：查看帮助手册

    - **mkdir**：创建新文件夹

    - **mkfifo**：创建FIFO（命名管道）

    - **mknod**：创建块设备或字符设备特殊文件

    - **more**：分屏显示输出内容

    - **mount**：挂载文件系统


    ### T

    - **tac**：倒序连接并输出文件内容

    - **tail**：输出文件的末尾部分

    - **tar**：磁带归档工具

    - **tee**：将输出重定向到多个文件

    - **test**：计算条件表达式的值

    - **time**：测量程序的资源占用

    - **touch**：修改文件时间戳

    - **top**：列出系统正在运行的进程

    - **traceroute**：追踪到目标主机的路由

    - **tr**：转换、压缩或删除字符

    - **tsort**：拓扑排序


    ### W

    - **watch**：定时执行或展示程序输出

    - **wc**：输出字节数、单词数与行数

    - **whereis**：报告命令的所有已知路径

    - **which**：在用户路径中定位程序文件

    - **who**：输出所有当前已登录的用户名

    - **whoami**：输出当前用户的ID与用户名


    ### N

    - **nice**：设置命令或任务的优先级

    - **nl**：为文件行编号并输出

    - **nohup**：运行不受挂起影响的命令


    ### P

    - **passwd**：修改用户密码

    - **paste**：合并文件的行

    - **pathchk**：检查文件名的可移植性

    - **pr**：转换文本文件以供打印

    - **printcap**：打印机性能数据库

    - **printenv**：输出环境变量

    - **printf**：格式化并输出数据


    ### X

    - **xargs**：执行工具程序，传入构造好的参数列表


    ### Q

    - **quota**：显示磁盘占用与配额限制

    - **quotacheck**：扫描文件系统的磁盘占用情况

    - **quotactl**：设置磁盘配额


    ### Y

    - **yes**：重复输出字符串直至被中断


    ### R

    - **ram**：内存磁盘设备


    ![](img/6103e44aa372eb088d684690786bde89_82_0.png)

    > **你知道吗……** NASA最先进的超级计算集群“昴星团（Pleiades）”基于Linux系统运行。昴星团集群包含160个机架（共11440个节点）、245536个CPU核心、总内存容量达935TB、184320个NVIDIA
    CUDA核心，以及超过6英里的光纤线缆。其核心运行的是SUSE Linux Enterprise Server系统，同时搭配了大量定制开发包以及NASA项目独有的其他软件。NASA高级超级计算分部使用昴星团集群开展的项目包括：开普勒任务——搜寻太阳系外类地行星；计算流体动力学（CFD）建模，助力研发更高效的太空发射系统；暗物质研究与模拟；以及地球洋流可视化，为ECCO（海洋环流与气候估算）项目构建数据。

