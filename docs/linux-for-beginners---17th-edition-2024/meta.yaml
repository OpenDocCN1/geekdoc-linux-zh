    \ | 1007 MB|\n| lowmem | 0xc0000000 | 0xc07f0000 | 7 MB |\n| .init | 0xc0313000\
    \ | 0xc0344000 | 196 KB |\n| .data | 0xc027653c | 0xc030bcfc | 597 KB |\n| .text\
    \ | 0xc0100000 | 0xc027653c | 1497 KB|\nChecking if this processor honours the\
    \ WP bit even in supervisor mode...OK.\nCalibrating delay using timer specific\
    \ routine... 4047.64 BogoMIPS (lpj=20238210)\n```\n![](img/6103e44aa372eb088d684690786bde89_54_0.png)\n\
    ## Linux 内核 0.01\n![](img/6103e44aa372eb088d684690786bde89_54_1.png)\n```c\n/*\n\
    \ * console.c\n *\n * This module implements the console io functions\n * 'void\
    \ con_init(void)'\n * 'void con_write(struct tty_queue *queue)'\n *\n * Hopefully\
    \ this will be a rather complete VT102 implementation.\n */\n/* NOTE!!! We sometimes\
    \ disable and enable interrupts for a short while\n * (to put a word in video\
    \ IO), but this will work even for keyboard\n * interrupts. We know interrupts\
    \ aren't enabled when getting a keyboard\n * interrupt, as we use trap-gates.\
    \ Hopefully all is well.\n */\n#include <linux/sched.h>\n#include <linux/tty.h>\n\
    #include <asm/io.h>\n#include <asm/system.h>\n#define SCREEN_START 0xb8000\n#define\
    \ SCREEN_END 0xc0000\n#define LINES 25\n#define COLUMNS 80\n#define NPAR 16\n\
    extern void keyboard_interrupt(void);\nstatic unsigned long origin=SCREEN_START;\n\
    static unsigned long scr_end=SCREEN_START+LINES*COLUMNS*2;\nstatic unsigned long\
    \ long pos;\nstatic unsigned long x,y;\nstatic unsigned long top=0,bottom=LINES;\n\
    static unsigned long lines=LINES,columns=COLUMNS;\nstatic unsigned long state=0;\n\
    static unsigned long npar,par[NPAR];\nstatic unsigned long ques=0;\nstatic unsigned\
    \ char attr=0x07;\n```\n> **你知道吗……** 首个Linux内核由莱纳斯·托瓦兹编写时，仅占用65KB内存？而自0.01版本起，如今的Linux内核代码量已经超过1800万行。对于如今能驱动纽约证券交易所运行、为美国国防部核潜艇舰队提供动力的大学项目来说，这个成绩相当不错。\n\
    \n## 使用终端创建文件\n通过终端，你可以创建文件夹、文件，甚至运行Linux Mint应用程序。事实上，就算没有图形界面，你依然可以通过终端完成这些操作。\n\
    ### 更多终端操作\n**步骤1** 打开终端，确认你当前处于主文件夹（Home）中。如果不在，使用`cd ~`命令从当前位置返回到主文件夹。\n**步骤2**\
    \ 首先我们在主文件夹内创建一个名为Test的新文件夹，你需要用到的命令是`mkdir Test`。输入完命令后按下Enter键即可创建该文件夹，之后输入`cd\
    \ Test`并按下Enter，就会切换目录（Change Directory，简称CD）到新建的Test文件夹中。\n![](img/6103e44aa372eb088d684690786bde89_55_0.png)\n\
    **步骤3** 此时你的命令行应当已经切换到Test文件夹，如果你输入`ls`（列出文件夹内容），会发现文件夹内没有任何内容，毕竟你刚创建它。`mkdir`命令的含义非常直观：Make\
    \ Directory（创建目录），后面跟上你自定义的名称即可。\n![](img/6103e44aa372eb088d684690786bde89_55_1.png)\n\
    **步骤4** 要创建名为Test.txt的空文本文件，只需在终端中输入：`touch Test.txt`。之后你可以使用`ls`命令查看文件夹内新增的文件。`touch`是Linux的标准命令，无需打开文本编辑器、保存文件再关闭编辑器，即可直接创建文件。\n\
    ![](img/6103e44aa372eb088d684690786bde89_55_2.png)\n![](img/6103e44aa372eb088d684690786bde89_55_3.png)\n\
    **步骤5** 如果你现在想要创建一个带内容的文本文件，我们将其命名为**Test2.txt**，只需输入以下命令：`cat > Test2.txt`。该命令会创建**Test2.txt**文件，并将终端切换到编辑模式。\n\
    ![](img/6103e44aa372eb088d684690786bde89_56_0.png)\n**步骤6** 你会发现光标在`cat > Test2.txt`命令下方闪烁，不再显示常规的命令提示符。这种编辑模式允许你输入文件需要存储的内容，输入完文本后按下**Ctrl+D**即可退出编辑模式，将内容写入文件。\n\
    ![](img/6103e44aa372eb088d684690786bde89_56_1.png)\n**步骤7** 当然，你并不需要一直通过终端来向文件输入内容。Linux\
    \ Mint自带一款名为**Xed**的文本编辑器，和Windows的记事本类似。要在Xed中查看之前创建的文件，只需在终端中输入`xed Test2.txt`，然后按下**Enter**键。\n\
    ![](img/6103e44aa372eb088d684690786bde89_56_2.png)\n**步骤8** Xed是图形界面应用程序，你可以通过它的主窗口输入文本并保存文件，也可以点击顶部菜单栏中的**文件\
    \ > 保存**或**文件 > 另存为**选项来保存当前文件或其他文件。\n![](img/6103e44aa372eb088d684690786bde89_56_3.png)\n\
    **步骤9** 但如果你更习惯在终端中编辑、保存或创建文件，可以使用**Nano**。Nano是一款轻量的终端文本编辑器，要试用它编辑刚才的示例文件，只需输入`nano\
    \ Test2.txt`。屏幕底部会显示操作菜单，要退出并保存Nano中的内容，按下**Ctrl+X**键，然后按照屏幕提示操作即可。\n![](img/6103e44aa372eb088d684690786bde89_56_4.png)\n\
    **步骤10** 我们之前已经演示过通过终端启动Linux Mint的Xed应用，但实际上任何应用程序都可以通过终端启动。例如，你可以尝试输入`firefox`，然后按下**Enter**键，关闭Firefox即可返回终端。只要你知道应用的名称，就可以通过终端运行它。此外，输入`firefox&`启动Firefox后，你依然可以正常使用终端。\n\
    ![](img/6103e44aa372eb088d684690786bde89_56_5.png)\n\n## 创建和删除目录\n和通过终端创建文件一样，你也可以创建和删除目录（如果你习惯叫文件夹的话也可以）。目录构成了文件系统的结构，如果没有逻辑清晰的目录，文件系统会彻底陷入混乱。\n\
    ### 管理文件夹\n掌握在终端中创建和删除文件夹是Linux Mint乃至整个Linux系统的重要技能，以下是基础操作供你尝试。\n**步骤1** 打开终端后输入`cd\
    \ ~`确保你处于自己的主目录中，现在输入`ls`查看主目录下当前已有的文件夹。你会发现Linux Mint中的文件夹会以青色（浅蓝色）标注。现在我们来创建一个新目录，输入：`mkdir\
    \ testdir`。\n**步骤2** 现在再次输入`ls`，你会看到名为testdir的新目录已经和主目录下的其他目录一同创建完成。显然`mkdir`就是用来创建目录的命令，你肯定已经猜到了，它的全称是Make\
    \ Directory（创建目录）。\n![](img/6103e44aa372eb088d684690786bde89_57_0.png)\n![](img/6103e44aa372eb088d684690786bde89_57_1.png)\n\
    **步骤3** 如果你再次输入`mkdir testdir`命令，会收到如下提示：`mkdir: cannot create directory 'testdir':\
    \ File exists`。这说明当前目录下只能存在一个名称唯一的目录，不过由于Linux区分大小写，因此你可以同时创建Testdir、TestDir、testDir等不同名称的目录。\n\
    **步骤4** 你可以在已经创建的目录下继续创建子目录，例如，输入`cd testdir/`进入testdir目录，再输入`ls`查看文件夹结构，由于你刚创建该目录，里面自然是空的。现在输入`cd\
    \ ~`返回主目录，再输入`mkdir testdir/reports`。之后再次输入`cd testdir/`进入testdir目录，再输入`ls`查看。\n\
    ![](img/6103e44aa372eb088d684690786bde89_57_2.png)\n![](img/6103e44aa372eb088d684690786bde89_57_3.png)\n"
