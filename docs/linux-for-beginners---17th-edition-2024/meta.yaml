- img_proc: true
  md: '# **STEP 5** Stringing several commands and piping them through other commands
    is what makes scripting such a powerful element to an OS.


    Using the while command, for example, together with toilet, can yield some impressive
    results.


    ```

    Enter: `while true; do echo "$(date ‘+%D %T’ | toilet -f term -F border --metal)";
    sleep 1; done.`

    ```


    ![](img/6103e44aa372eb088d684690786bde89_62_0.png)


    # **STEP 8** Used as a music demo from the old Amiga and DOS days, the bb command
    reminds us of getting hold of three and a half inch floppies crammed with all
    manner of demoscene goodies.


    We''ve already installed bb from the previous step, so just enter bb. Follow the
    on-screen instructions, and turn up your volume.


