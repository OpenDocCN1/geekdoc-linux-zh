    # # Getting Started with Linux


    It''s all fine and well talking about how good Linux is but how do you get it
    on your computer? Installing Linux is remarkably simple but there are several
    options available to you. This section looks into how you can download the Linux
    ISO, install it on a PC as your main operating system and even how to install
    a virtual environment.


    With a virtual environment you can run Linux while still using your main operating
    system, be that Windows or macOS. Intrigued? Read on and find out more.


    ![](img/6103e44aa372eb088d684690786bde89_18_1.png)'
  - '[PAGE 19]


    # # Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    # ## DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC here to transfer the ISO to a DVD. If you''re using
    a version of Windows from 7 onward the process is extremely easy.


    # **STEP 1**


    First locate the ISO image of Linux you''ve already downloaded. You can usually
    find it in the Downloads folder in Windows 7, 8.1 and 10 computers, unless you
    specified a different location when saving it.


    ![](img/6103e44aa372eb088d684690786bde89_19_0.png)


    # **STEP 2**


    Next insert a recordable DVD disc into your computer''s optical drive. After a
    few seconds, while the disc is read, Windows displays a pop-up message asking
    you what to do with the newly inserted disc. Ignore this, as we''re going to use
    the built-in image burning function.


    ![](img/6103e44aa372eb088d684690786bde89_19_1.png)


    # **STEP 3**


    Right-click the Linux ISO and from the menu select Burn Disc Image. Depending
    on the speed of the PC, it may take a few seconds before anything happens. Don''t
    worry too much, unless it takes more than a minute, in which case it might be
    worth restarting your PC and trying again. With luck, the Windows Disc Image Burner
    should launch.


    ![](img/6103e44aa372eb088d684690786bde89_19_2.png)


    # **STEP 4**


    With the Windows Disc Image Burner dialogue box open, click on the ''Verify disc
    after burning'' tick box, then the Burn button. The process should take a few
    minutes, depending on the speed of your PC''s optical drive. Once it''s complete
    it runs through the verification stage and when done the optical drive should
    auto-eject the disc for you.


    ![](img/6103e44aa372eb088d684690786bde89_19_3.png)'
  - '[PAGE 20]


    # Creating a Linux Installer on Windows


    # ## USB BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most modern PCs don''t
    have an optical drive installed. The process of transferring the image is easy
    but you need a third-party app first and a USB flash drive of 4GB or more.


    **STEP 1** First open a web browser and go to **www.rufus.akeo.ie/**. Scroll down
    the page a little and you come to a Download heading, under which is the latest
    version of Rufus. Left click the link to start the download.


    ![](img/6103e44aa372eb088d684690786bde89_20_0.png)


    **STEP 2** Double-click the downloaded Rufus executable and click Yes to the Windows
    security question and Yes to checking for updates. With Rufus launched it should
    have already identified your inserted USB flash drive; if not, just remove and
    reinsert.


    ![](img/6103e44aa372eb088d684690786bde89_20_1.png)


    **STEP 3** At first glance the Rufus interface can look a little confusing but
    don''t worry, it''s really quite simple. To begin with, click on the SELECT button
    next to the ''Disk or ISO Image (Please select)'' pull-down menu. This launches
    a Windows Explorer window where you can locate and select the Linux ISO.


    ![](img/6103e44aa372eb088d684690786bde89_20_2.png)


    **STEP 4** When you''re ready, click on the Start button at the bottom of the
    Rufus app. This may open up another dialogue box asking you to download and use
    a new version of SysLinux. SysLinux is a selection of boot loaders, used to allow
    a modern PC to access and boot from a USB flash drive. It is necessary, so if
    asked click on ''Yes'' to continue.


    ![](img/6103e44aa372eb088d684690786bde89_20_3.png)


    **STEP 5** The next step asks which image mode you want the Linux ISO to be written
    to the USB flash drive in. Both methods work for different situations but generally,
    the recommended ISO Image Mode is the more popular. Make sure this mode is preselected
    and click OK to continue, followed by OK again to confirm the action.


    ![](img/6103e44aa372eb088d684690786bde89_20_4.png)


    **STEP 6** The Linux ISO is now transferred to the USB flash drive. The process
    shouldn''t take too long, again depending on the speed of the USB device and the
    PC. You may find Rufus auto-opens the USB drive in Windows Explorer during the
    process; don''t worry you can minimise or close it if you want. When the process
    is complete, click on the Close button.


    ![](img/6103e44aa372eb088d684690786bde89_20_5.png)'
  - '[PAGE 21]


    # Installing Linux on a PC


    > Most Linux distros come as a Live Environment. This means you can boot into
    an actual, fully-working distro straight from the DVD or USB that you just created.
    Let''s see how that works and how you go about installing Linux from there.


    # UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify hardware
    and protect a PC during its boot-up process. It replaces the traditional BIOS
    but can cause issues when installing Linux.


    # STEP 1


    Insert your DVD or USB flash drive into your PC and, if you haven''t already,
    shutdown Windows. In this instance we''re using the USB boot media but the process
    is virtually identical. Start the PC and when prompted press the appropriate keys
    to enter the BIOS or SETUP, which could for example be: F2, Del or even F12.


    ![](img/6103e44aa372eb088d684690786bde89_21_0.png)


    # STEP 2


    There are different versions of a UEFI BIOS, so covering them all would be impossible.
    What you''re looking for is a section that details the Boot Sequence or Boot Mode.
    Here you have the option to turn off UEFI and choose Legacy or disable Secure
    Booting. Most distros work with UEFI but it can be a tricky process to enable
    it to boot.


    ![](img/6103e44aa372eb088d684690786bde89_21_1.png)


    # STEP 3


    With UEFI turned to Legacy mode, there are now two ways of booting into the Live
    Environment. The first is via the BIOS you''re already in. Locate the Boot Sequence
    and change the first boot device from its original setting, usually Internal HDD
    or similar, to: USB Storage Device for the USB media option, or DVD Drive for
    the DVD media option.


    ![](img/6103e44aa372eb088d684690786bde89_21_2.png)


    # STEP 4


    Alternatively use the Boot Option Menu. With this option you can press F12 (or
    something similar) to display a list of boot media options; from there, you can
    choose the appropriate boot media. Either way, you can now Save and Exit the BIOS
    by navigating to the Save & Exit option and choosing ''Save Changes and Exit''.


    ![](img/6103e44aa372eb088d684690786bde89_21_3.png)'
  - '[PAGE 22]


    # INSTALLING LINUX


    Once the Live Environment has booted, you see the option to install the distro
    to your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    **STEP 1** Providing you''re connected to the internet (if not, then do so now)
    and you''re in the Live Environment, start the installation process by double-clicking
    on the Install Linux Mint icon on the desktop. Other distros display their own
    name, of course, but the process is the same. Click Continue when you''re ready.


    ![](img/6103e44aa372eb088d684690786bde89_22_0.png)


    **STEP 2** While the installation process is very similar across most Linux distros,
    some offer different questions during the installation. Generally, the questions
    aren''t too difficult, nothing very technical, but some such as ''Installing third-party
    software...'' can be confusing. In this case you can click Continue but if you''re
    unsure, have an Internet-connected device available to ask any questions.


    ![](img/6103e44aa372eb088d684690786bde89_22_1.png)


    **STEP 3** When installing a new operating system it''s recommended that you wipe
    the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install Linux...'' option is selected. **NOTE:**
    This completely wipes Windows 10 from your computer, so make sure you have backups
    of all your personal files and data.


    ![](img/6103e44aa372eb088d684690786bde89_22_2.png)


    **STEP 4** Before the installation process begins, you''re asked if the choice
    you made regarding the erasure of the hard drive is correct. This is your last
    chance to back out. If you''re certain you don''t mind wiping everything and starting
    again with Linux Mint, click Continue. If you need to backup your files remove
    the Linux disc/USB, reboot, backup and start again.


    ![](img/6103e44aa372eb088d684690786bde89_22_3.png)


    **STEP 5** Eventually you are asked to set up your Linux username and password.
    Enter your Name to begin with, then the Computer Name, which is the name it is
    identified on the network as. Next choose a Username, followed by a good Password.
    You can tick the Login Automatically option but leave the Encrypt Home Folder
    option for now.


    ![](img/6103e44aa372eb088d684690786bde89_22_4.png)


    **STEP 6** The installation process can be quick, and there may be more questions
    to answer, or it may simply start installing Linux based on your previous answers.
    Either way, you end up being asked to Continue Testing the Live Environment or
    Restarting to use the newly installed OS. If you''re ready to use Linux, then
    click Restart Now.


    ![](img/6103e44aa372eb088d684690786bde89_22_5.png)'
- md: '## Installing a Virtual Environment

    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It''s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    ### GOING VIRTUAL

    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each before
    commencing.


    **STEP 1**

    We''re using VirtualBox in this instance, as it''s one of the easiest virtual
    environments to get to grips with. Enter www.virtualbox.org and click on ''Download
    VirtualBox''. This takes you to the main download page. Locate the correct host
    for your system: Windows or Mac, the host being the currently installed operating
    system, and click the link to begin the download.


    **STEP 2**

    Next, while still at the VirtualBox download page, locate the VirtualBox Extension
    Pack link. The Extension Pack supports USB devices as well as numerous other extras
    that can help make the VM environment a more accurate emulation of a ''real''
    computer.


    **STEP 3**

    With the correct packages downloaded, and before you install anything, you need
    to make sure that the computer you''re using is able to host a VM. To do this,
    reboot the computer and enter the BIOS. When the computer starts up, press the
    Del, F2 or whichever key is necessary to Enter Setup.

    ![](img/6103e44aa372eb088d684690786bde89_23_0.png) ![](img/6103e44aa372eb088d684690786bde89_23_1.png)


    **STEP 4**

    Each BIOS is laid out differently and it''s very difficult to assess where to
    look in each personal example. However, as a general rule of thumb, you''re looking
    for Intel Virtualisation Technology, or simply Virtualisation, found usually within
    the Advanced section of the BIOS. When you''ve located it, Enable it, save the
    settings, exit the BIOS and reboot the computer.

    ![](img/6103e44aa372eb088d684690786bde89_23_2.png) ![](img/6103e44aa372eb088d684690786bde89_23_3.png)


    **STEP 5**

    With the computer back up and running, locate the downloaded main VirtualBox application
    and double-click to begin the installation process. Click Next to continue, when
    you''re ready.

    ![](img/6103e44aa372eb088d684690786bde89_24_0.png)


    **STEP 6**

    The default installation location of VirtualBox should satisfy most users but
    if you have any special location requirements click on the ''Browse'' button and
    change the install folder. Then, make sure that all the icons in the VirtualBox
    feature tree are selected, i.e. none of them have a red X next to them. Click
    Next to move on.

    ![](img/6103e44aa372eb088d684690786bde89_24_1.png)


    **STEP 7**

    This section can be left alone to the defaults, should you wish. It simply makes
    life a little easier when dealing with VMs, especially when dealing with downloaded
    VMs, which you may encounter in the future. Again, clicking Next moves you on
    to the next stage.

    ![](img/6103e44aa372eb088d684690786bde89_24_2.png)


    **STEP 8**

    When installing VirtualBox your network connection is disabled for a very brief
    period. This is due to VirtualBox creating a linked, virtual network connection
    so that any VM installed is able to access the Internet, and your home network
    resources, via the computer''s already established network connection. Click Yes,
    then the Install to begin the installation.

    ![](img/6103e44aa372eb088d684690786bde89_24_3.png)


    **STEP 9**

    You''ll probably be asked by Windows to accept a security notification. Click
    Yes for this and you may encounter a dialogue box asking you to trust the installation
    from Oracle; again, click yes and accept the installation of the VirtualBox application.
    When it''s complete, click finish to start VirtualBox.

    ![](img/6103e44aa372eb088d684690786bde89_24_4.png)


    **STEP 10**

    With VirtualBox up and running you can now install the VirtualBox Extension Pack.
    Locate the downloaded add-on and double-click. There may be a short pause while
    VirtualBox analyses the pack but you eventually receive a message to install it;
    obviously click Install to begin the process, scroll down the next screen to accept
    the agreement and click I Agree.

    ![](img/6103e44aa372eb088d684690786bde89_24_5.png)


    ## Installing Linux in a Virtual Environment

    With Oracle''s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you will install Linux. This process won''t
    affect your currently installed operating system, which is why a VM is a great
    choice.


    ### CREATING THE VM

    There are plenty of options to choose from when creating a VM. For now though,
    we''ll setup a VM adequate to run the excellent Linux Mint, and perform well.


    **STEP 1**

    With VirtualBox open, click on the New icon in the top-middle of the right-hand
    panel of the app. This will open the new VM Wizard.

    ![](img/6103e44aa372eb088d684690786bde89_25_0.png)


    **STEP 2**

    In the box next to Name type Linux Mint, and VirtualBox should automatically choose
    Linux as the Type and Ubuntu (64-bit) as the Version, if not then use the drop-down
    boxes to select the correct settings (remember Mint mainstream is based on Ubuntu).
    Click Next when you''re ready to proceed.

    ![](img/6103e44aa372eb088d684690786bde89_25_2.png)


    **STEP 3**

    The next section will define the amount of system memory, or RAM, the VM has allocated.
    Remember this amount will be taken from the available memory installed in your
    computer, so don''t give the VM too much. For example, we have 8GB of memory installed
    and we''re giving 2GB (2048MB) to the VM. When you''re ready, click Next to continue.

    ![](img/6103e44aa372eb088d684690786bde89_25_1.png)


    **STEP 4**

    This section is where you''ll start to create the virtual hard disk that the VM
    will use to install Mint on to. The default option, ''Create a virtual hard disk
    now'', is the one we''re using. Click Create to move on.

    ![](img/6103e44aa372eb088d684690786bde89_25_3.png)


    **STEP 5**

    The pop-up window that appears after clicking Create is asking you what type of
    virtual hard disk you want to create. We''re going to use the default VDI (VirtualBox
    Disk Image) in this case, as the others are often used to move VMs from one VM
    application to the next. Make sure VDI is selected, and click Next.

    ![](img/6103e44aa372eb088d684690786bde89_26_0.png)


    **STEP 6**

    The question of whether to opt for Dynamically or Fixed sized virtual hard disks
    may come across as being somewhat confusing to the newcomer. Basically, a Dynamically
    Allocated virtual hard disk is a more flexible storage management option. It won''t
    take up much space within your physical hard disk to begin with either. Ensure
    Dynamically Allocated is selected, and click Next.

    ![](img/6103e44aa372eb088d684690786bde89_26_2.png)


    **STEP 7**

    The virtual hard disk will be a single folder, up to the size you state in this
    section. Ensure the location of the virtual hard disk, on your computer, has enough
    free space available. For example, we''ve used a bigger storage option on our
    D:\ drive, named it Linux Mint, and allocated 25.50GB of space to the virtual
    hard disk.

    ![](img/6103e44aa372eb088d684690786bde89_26_4.png)


    **STEP 8**

    After clicking Create the initial setup of the VM is complete; you should now
    be looking at the newly created VM within the VirtualBox application. Before you
    begin though, click the Settings button from the top of the right-hand panel,
    and within the General section click the Advanced tab. Using the pull-down menus,
    choose ''Bidirectional'' for both Shared Clipboard and Drag''n''Drop.

    ![](img/6103e44aa372eb088d684690786bde89_26_1.png)


    **STEP 9**

    Follow that by clicking on the System section, then the Processor tab. Depending
    on your CPU allocate as many cores as you can without detriment to your host system;
    we''ve opted for two CPUs. Now click on the Display section, slide the Video Memory
    up to the maximum, and tick ''Enable 3D Acceleration''. Click OK to commit the
    new settings.

    ![](img/6103e44aa372eb088d684690786bde89_26_3.png)


    **STEP 10**

    Click on the Start button and use the explorer button in the ''Select Start-up
    Disk'' window; the explorer button is a folder with a green arrow. Click Add in
    the new pop-up window, to locate the downloaded ISO of Mint; and click Open to
    select the ISO. Now click the Start button to boot the VM with the Linux Mint
    Live Environment. You can now install Linux as per the standard PC installation
    requirements.

    ![](img/6103e44aa372eb088d684690786bde89_26_5.png)'
  mdcn: '

    ## 安装虚拟环境

    虚拟环境是模拟的计算机系统。使用虚拟机，你可以模拟一台标准个人电脑，在上面安装完整的操作系统，且不会影响你电脑上已安装的操作系统。这是在保留Windows
    10作为主操作系统的同时，测试和使用Linux的绝佳方式。

    ### 虚拟机使用注意事项

    使用虚拟机（VM）会占用你电脑的资源：内存、硬盘空间、处理器占用率等，请在开始操作前确保各项资源充足。

    **步骤1**

    本教程使用VirtualBox进行演示，它是最容易上手的虚拟环境之一。请访问www.virtualbox.org，点击“下载VirtualBox”，即可进入主下载页面。找到适配你系统的宿主系统版本：Windows或Mac（宿主系统指当前电脑已安装的操作系统），点击对应链接即可开始下载。

    ![](img/6103e44aa372eb088d684690786bde89_23_0.png)

    ![](img/6103e44aa372eb088d684690786bde89_23_1.png)

    **步骤2**

    接下来，仍停留在VirtualBox下载页面，找到VirtualBox扩展包的链接。该扩展包支持USB设备及多项其他附加功能，能让虚拟机环境更接近真实电脑的模拟效果。

    **步骤3**

    在下载好对应安装包、尚未进行任何安装操作前，你需要确认当前使用的电脑支持运行虚拟机。具体操作为：重启电脑并进入BIOS，在电脑启动过程中，按下Del、F2或其他进入设置界面的对应按键即可。

    ![](img/6103e44aa372eb088d684690786bde89_23_2.png)

    ![](img/6103e44aa372eb088d684690786bde89_23_3.png)

    **步骤4**

    不同品牌电脑的BIOS界面布局各不相同，很难给出普适的查找路径。但通用原则是：你需要在BIOS的「高级（Advanced）」选项中查找「英特尔虚拟化技术（Intel
    Virtualisation Technology）」，或简称为「虚拟化（Virtualisation）」选项。找到后启用该选项，保存设置，退出BIOS并重启电脑。

    ![](img/6103e44aa372eb088d684690786bde89_23_2.png)

    ![](img/6103e44aa372eb088d684690786bde89_23_3.png)

    **步骤5**

    电脑重启完成后，找到已下载的VirtualBox主程序，双击启动安装流程，准备就绪后点击“下一步（Next）”继续。

    ![](img/6103e44aa372eb088d684690786bde89_24_0.png)

    **步骤6**

    VirtualBox的默认安装位置可满足绝大多数用户的需求，若有特殊路径需求，可点击“浏览（Browse）”按钮修改安装文件夹。之后请确保VirtualBox功能列表中的所有图标均被选中（即图标旁没有红色叉号），点击“下一步（Next）”进入下一流程。

    ![](img/6103e44aa372eb088d684690786bde89_24_1.png)

    **步骤7**

    如果无特殊需求，此部分可保持默认设置，该设置能让后续虚拟机（尤其是未来你可能用到的下载好的虚拟机）的操作更便捷。再次点击“下一步（Next）”进入下一阶段。

    ![](img/6103e44aa372eb088d684690786bde89_24_2.png)

    **步骤8**

    安装VirtualBox过程中，网络连接会短暂中断，这是因为VirtualBox会创建关联的虚拟网络连接，让后续安装的虚拟机能够通过电脑已建立的网络连接访问互联网及局域网资源。点击“是（Yes）”，再点击“安装（Install）”开始安装。

    ![](img/6103e44aa372eb088d684690786bde89_24_3.png)

    **步骤9**

    Windows系统可能会弹出安全提示，请你确认信任，点击“是（Yes）”即可；之后你可能还会看到询问是否信任Oracle安装来源的弹窗，同样点击“是”并确认安装VirtualBox程序。安装完成后点击“完成（finish）”启动VirtualBox。

    ![](img/6103e44aa372eb088d684690786bde89_24_4.png)

    **步骤10**

    VirtualBox启动后，即可安装VirtualBox扩展包。找到已下载的扩展包文件并双击，VirtualBox会短暂分析该文件，随后会出现安装提示，点击“安装（Install）”开始安装，在下一界面中向下滑动接受协议，点击“我同意（I
    Agree）”即可。

    ![](img/6103e44aa372eb088d684690786bde89_24_5.png)


    ## 在虚拟环境中安装Linux

    Oracle VirtualBox已成功启动，接下来需要创建用于安装Linux的虚拟机（VM）环境。该操作不会影响当前电脑已安装的操作系统，这也是选择虚拟机的重要原因。

    ### 创建虚拟机

    创建虚拟机时有很多可选参数，本次教程将配置一个可流畅运行优秀Linux发行版Linux Mint的虚拟机。

    **步骤1**

    打开VirtualBox后，点击应用右侧面板顶部的“新建（New）”图标，即可打开新建虚拟机向导。

    ![](img/6103e44aa372eb088d684690786bde89_25_0.png)

    **步骤2**

    在名称输入框中输入“Linux Mint”，VirtualBox会自动将类型选为“Linux”，版本选为“Ubuntu (64-bit)”；若未自动匹配，可通过下拉菜单选择正确配置（注意：主流Linux
    Mint版本基于Ubuntu开发）。准备就绪后点击“下一步（Next）”继续。

    ![](img/6103e44aa372eb088d684690786bde89_25_2.png)

    **步骤3**

    下一步将设置虚拟机分配的系统内存（RAM）大小，请注意该数值会从电脑现有可用内存中扣除，因此不要分配给虚拟机过多内存。例如本机安装有8GB内存，本次仅分配2GB（2048MB）给虚拟机。设置完成后点击“下一步（Next）”继续。

    ![](img/6103e44aa372eb088d684690786bde89_25_1.png)

    **步骤4**

    这一步将开始创建虚拟机用于安装Linux Mint的虚拟硬盘，我们使用默认的「立即创建虚拟硬盘（Create a virtual hard disk now）」选项，点击「创建（Create）」进入下一步。

    ![](img/6103e44aa372eb088d684690786bde89_25_3.png)

    **步骤5**

    点击“创建”后弹出的窗口会询问你需创建的虚拟硬盘类型，本次使用默认的VDI（VirtualBox Disk Image，VirtualBox磁盘镜像）格式，其他格式多用于在不同虚拟机软件间迁移虚拟机。请确认已选中VDI选项，点击「下一步（Next）」继续。

    ![](img/6103e44aa372eb088d684690786bde89_26_0.png)

    **步骤6**

    「动态分配」与「固定大小」虚拟硬盘的选择对新手可能稍显困惑，本质上动态分配的虚拟硬盘是更灵活的存储管理选项，且初始时不会占用物理硬盘过多空间。请确认选中「动态分配（Dynamically
    Allocated）」选项，点击「下一步（Next）」继续。

    ![](img/6103e44aa372eb088d684690786bde89_26_2.png)

    **步骤7**

    虚拟硬盘会被存储为单个文件夹，最大容量为你在此处设置的数值，请确保电脑上存储该虚拟硬盘的位置有足够的可用空间。例如我们将虚拟硬盘存在D盘的大容量存储分区中，命名为“Linux
    Mint”，分配了25.50GB的空间。

    ![](img/6103e44aa372eb088d684690786bde89_26_4.png)

    **步骤8**

    点击“创建”后，虚拟机的初步设置就完成了，此时你会在VirtualBox中看到新创建的虚拟机。开始使用前，请点击右侧面板顶部的「设置（Settings）」按钮，在「常规（General）」分类下点击「高级（Advanced）」选项卡，通过下拉菜单将「共享剪贴板（Shared
    Clipboard）」和「拖放（Drag''n''Drop）」均设置为「双向（Bidirectional）」。

    ![](img/6103e44aa372eb088d684690786bde89_26_1.png)

    **步骤9**

    之后点击「系统（System）」分类，进入「处理器（Processor）」选项卡，根据你的CPU性能分配核心数，注意不要影响宿主系统的正常运行，本次我们分配了2个核心。接着点击「显示（Display）」分类，将显存滑块拖到最大值，勾选「启用3D加速（Enable
    3D Acceleration）」，点击「确定（OK）」保存新设置。

    ![](img/6103e44aa372eb088d684690786bde89_26_3.png)

    **步骤10**

    点击「启动（Start）」按钮，在「选择启动盘（Select Start-up Disk）」窗口中点击资源管理器按钮（即带绿色箭头的文件夹图标）；在新弹出的窗口中点击「添加（Add）」，找到已下载的Linux
    Mint ISO镜像文件并点击「打开（Open）」选中该镜像。再次点击「启动（Start）」按钮，即可用Linux Mint Live环境启动虚拟机，现在你可以按照标准PC的安装流程安装Linux系统了。

    ![](img/6103e44aa372eb088d684690786bde89_26_5.png)

