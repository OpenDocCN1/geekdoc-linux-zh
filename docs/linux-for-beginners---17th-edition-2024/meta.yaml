  md: '# Using the Terminal


    # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    **STEP 1** With the Terminal open enter cd ~ to make sure you''re in your own
    Home directory. Now enter ls to view the current folders you have housed in the
    Home directory. You''ll notice that folders are labelled in Mint in cyan (light
    blue). Let''s start by creating a new directory. Enter: mkdir testdir.


    **STEP 3** If you were to enter the command again, mkdir testdir, you''ll receive
    a message stating: mkdir: cannot create directory ''testdir'': File exists. It
    goes without saying then, that you''re only able to have one uniquely named directory
    within the current directory. However, as Linux is case-sensitive, you can have
    Testdir, TestDir, testDir and so on.


    ![](img/6103e44aa372eb088d684690786bde89_57_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_57_1.png)


    **STEP 2** If you now enter ls again, you''ll see that the new directory, testdir,
    has been created alongside the other directories in the Home area. Obviously the
    command mkdir is what creates the directory, and no doubt you''ve already guessed
    it stands for Make Directory.


    **STEP 4** You can create directories within directories you''ve already created.
    For example, enter the testdir directory with cd testdir/ followed by ls to list
    the folder structure. Naturally there''s nothing present, as you''ve just created
    the directory. Now drop back to Home with cd ~, and enter mkdir testdir/reports.
    Go back to the testdir, cd testdir/, and ls again.


    ![](img/6103e44aa372eb088d684690786bde89_57_2.png)


    ![](img/6103e44aa372eb088d684690786bde89_57_3.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# **STEP 5**


    The command to create directories is quite logical, therefore. You''ll create
    the directory, and any sub-directories within. However, what if you want to create
    directory and a sub-directory in a single command? Make sure you''re at Home (cd
    ~) and enter: `mkdir -p Temp/finances`. Now, `cd Temp/`, and `ls` to list the
    new directory.


    ![](img/6103e44aa372eb088d684690786bde89_58_0.png)


    # **STEP 6**


    The -p option is what enables the mkdir command to create the sub-directory as
    well as the parent directory. In Linux, commands always follow the same structure:
    Command, Option, and Argument. In the previous step example, command (**mkdir**),
    option (**-p**), and argument (**Temp/finances**).


    ![](img/6103e44aa372eb088d684690786bde89_58_1.png)


    # **STEP 7**


    If you want to drill down into the various options available for the mkdir command,
    you can enter `mkdir --help` into the Terminal. This will provide a quick help
    guide detailing the options and how the command structure works.


    ![](img/6103e44aa372eb088d684690786bde89_58_2.png)


    # **STEP 8**


    Now that we''ve created some directories, let''s see about removing them. Start
    by entering the testdir directory and listing its contents: `cd testdir/`, then
    `ls`. The previously created reports sub-directory is present. One way to remove
    it is to enter: `rmdir reports`, then `ls` again to confirm it''s not there.


    ![](img/6103e44aa372eb088d684690786bde89_58_3.png)


    # **STEP 9**


    A quick warning: removing a directory in the Terminal doesn''t place it in the
    Mint Rubbish Bin, via Nemo file manager. The same goes for any files, too. If
    you remove a directory from the Terminal command then it''s gone for good.


    ![](img/6103e44aa372eb088d684690786bde89_58_4.png)


    # **STEP 10**


    Rmdir will only remove empty directories, to remove directories containing sub-directories,
    or even files, you''ll need to use the `rm` command with the -R option. For example,
    on the Temp/finance directories, use `rm -R Temp`. A quick ls reveals that the
    parent folder and all of its contents are removed. Careful when using this command.


    ![](img/6103e44aa372eb088d684690786bde89_58_5.png)'
