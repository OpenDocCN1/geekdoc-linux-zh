  md: '# Linux Tips and Tricks


    As you''ve seen, The Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smidgen of command knowledge, incredible, and
    often quite strange, things can be accomplished.


    # TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s Unix heritage, while others are recent additions
    to Linux lore. Here''s our favourite ten tips and tricks.


    # EASTER EGGS


    Emacs, the text editor, is a great piece of software, however, did you know it
    also contains a hidden Easter Egg? With Emacs installed (**sudo apt-get install
    emacs25**), drop to a Terminal session and enter:


    ```

    sudo apt-get install emacs25

    ```


    ```

    emacs -batch -l dunnet

    ```


    Dunnet is a text adventure written by Ron Schnell in 1982, and hidden in Emacs
    since 1994.


    ![](img/6103e44aa372eb088d684690786bde89_63_0.png)


    # TERMINAL BROWSING


    Ever fancied being able to browse the Internet from the Terminal? While not particularly
    useful, it is quite a fascinating thing to behold. To do so, enter:


    ```

    sudo apt-get install elinks

    ```


    Enter the website you want to visit.


    ![](img/6103e44aa372eb088d684690786bde89_63_1.png)


    # MOON BUGGY


    Based on the classic 1982 arcade game, Moon Patrol, Moon Buggy appeared on the
    home computers of 1985 amid much praise. It''s a cracking Atari game, and it''s
    available in the Linux Terminal by entering:


    ```

    sudo apt-get install moon-buggy

    ```


    Then:


    ```

    moon-buggy

    ```


    Enjoy.


    ![](img/6103e44aa372eb088d684690786bde89_63_2.png)


    # LET IT SNOW


    Snowing in the Terminal console isn''t you''re interested, however, enter:


    ```

    wget https://gist.githubusercontent.com/sontek/1505483/raw/7d024716ea57e69fb52632fee09f42753361c4a2/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


    ![](img/6103e44aa372eb088d684690786bde89_63_3.png)'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Linux Tips and Tricks


    # MEMORY HOGS


    If you need to see what apps are consuming the most memory on


    Linux, simply enter:


    ```

    ps aux | sort -rnk 4

    ```


    This sorts the output by system memory use.


    ![](img/6103e44aa372eb088d684690786bde89_64_0.png)


    # BBS


    Back in the days of dial-up connections, the online world was made up of Bulletin
    Board Systems. These remote servers provided hang-outs for users to chat, swap
    code, play games and more. Using telnet in Linux, we can still connect to some
    active BBSes:


    ```

    telnet battlestarbbs.dyndns.org

    ```


    There are countless operational BBSes available, check out https://www.telnetbbsguide.com/bbs/list/detail/,
    for more.


    ![](img/6103e44aa372eb088d684690786bde89_64_1.png)


    # SHREDDER


    When you delete a file, there''s a chance of someone with the right software being
    able to retrieve it. However, to securely and permanently delete a file, use Shred:


    ```

    shred -zvu NAMEOFFILE.txt

    ```


    Replace NAMEOFFILE with the name of the file to delete.


    ![](img/6103e44aa372eb088d684690786bde89_64_2.png)


    # DIRECTORY TREES


    If you want to create an entire directory (or folder) tree with a single command,
    you can use:


    ```

    mkdir -p New-Dir/${subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    This creates a New-Dir with four sub folders within.


    ![](img/6103e44aa372eb088d684690786bde89_64_3.png)


    # ASCII ART


    ASCII art can be quite striking when applied to some images. However, it''s often
    difficult to get just right. You can create some great ASCII art from the images
    you have by using img2txt:


    ```

    img2txt NAMEofIMAGEFILE.png

    ```


    Replace NAMEofIMAGEFILE with the actual name of the image file on your system.


    If img2txt install installed, use:


    ```

    sudo apt-get install caca-utils.

    ```


    ![](img/6103e44aa372eb088d684690786bde89_64_4.png)


    # FORGOTTEN COMMANDS


    It''s not easy trying to remember all the available Linux commands. Thankfully,
    we can use apropos to help us. Simply use it, along with a description of the
    command:


    ```

    aproro"copy files"

    ```


    ```

    aproro"rename files"

    ```


    ![](img/6103e44aa372eb088d684690786bde89_64_5.png)'
