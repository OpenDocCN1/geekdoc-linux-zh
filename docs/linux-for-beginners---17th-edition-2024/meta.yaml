    ## 你知道吗...

    > NASA的Linux驱动超级计算机“昴星团”（Pleiades）。目前位列全球最强超算第11名。

    ![](img/6103e44aa372eb088d684690786bde89_84_0.png)

    ![](img/6103e44aa372eb088d684690786bde89_84_1.png)

