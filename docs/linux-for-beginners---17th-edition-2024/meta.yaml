    # Using the Terminal


    # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    **STEP 1** With the Terminal open enter cd ~ to make sure you''re in your own
    Home directory. Now enter ls to view the current folders you have housed in the
    Home directory. You''ll notice that folders are labelled in Mint in cyan (light
    blue). Let''s start by creating a new directory. Enter: mkdir testdir.


    **STEP 3** If you were to enter the command again, mkdir testdir, you''ll receive
    a message stating: mkdir: cannot create directory ''testdir'': File exists. It
    goes without saying then, that you''re only able to have one uniquely named directory
    within the current directory. However, as Linux is case-sensitive, you can have
    Testdir, TestDir, testDir and so on.


    ![](img/6103e44aa372eb088d684690786bde89_57_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_57_1.png)


    **STEP 2** If you now enter ls again, you''ll see that the new directory, testdir,
    has been created alongside the other directories in the Home area. Obviously the
    command mkdir is what creates the directory, and no doubt you''ve already guessed
    it stands for Make Directory.


    **STEP 4** You can create directories within directories you''ve already created.
    For example, enter the testdir directory with cd testdir/ followed by ls to list
    the folder structure. Naturally there''s nothing present, as you''ve just created
    the directory. Now drop back to Home with cd ~, and enter mkdir testdir/reports.
    Go back to the testdir, cd testdir/, and ls again.


    ![](img/6103e44aa372eb088d684690786bde89_57_2.png)


    ![](img/6103e44aa372eb088d684690786bde89_57_3.png)'
- md: '## STEP 5

    The command to create directories is quite logical, therefore. You''ll create
    the directory, and any sub-directories within. However, what if you want to create
    directory and a sub-directory in a single command? Make sure you''re at Home (cd
    ~) and enter: `mkdir -p Temp/finances`. Now, `cd Temp/`, and `ls` to list the
    new directory.


    ## STEP 6

    The -p option is what enables the mkdir command to create the sub-directory as
    well as the parent directory. In Linux, commands always follow the same structure:
    Command, Option, and Argument. In the previous step example, command (**mkdir**),
    option (**-p**), and argument (**Temp/finances**).


    ## STEP 7

    If you want to drill down into the various options available for the mkdir command,
    you can enter `mkdir --help` into the Terminal. This will provide a quick help
    guide detailing the options and how the command structure works.


    ## STEP 8

    Now that we''ve created some directories, let''s see about removing them. Start
    by entering the testdir directory and listing its contents: `cd testdir/`, then
    `ls`. The previously created reports sub-directory is present. One way to remove
    it is to enter: `rmdir reports`, then `ls` again to confirm it''s not there.


    ## STEP 9

    A quick warning: removing a directory in the Terminal doesn''t place it in the
    Mint Rubbish Bin, via Nemo file manager. The same goes for any files, too. If
    you remove a directory from the Terminal command then it''s gone for good.


    ## STEP 10

    Rmdir will only remove empty directories, to remove directories containing sub-directories,
    or even files, you''ll need to use the `rm` command with the -R option. For example,
    on the Temp/finances directories, use `rm -R Temp`. A quick ls reveals that the
    parent folder and all of its contents are removed. Careful when using this command.


    ## Fun Things to do in the Terminal

    > Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    ### TERMINAL FUN

    You''ll be working exclusively in the Terminal for these next two sections, so
    start warming up your fingers. After all, all work and no play… as the saying
    goes.


    #### STEP 1

    The first command we''re going to use is `sl`, it''s not installed by default
    so enter: `sudo apt-get install sl`. The command can be run with `sl` and when
    executed will display a Steam Locomotive travelling across the screen (hence ''sl'').
    Entering `LS`, note the upper case, also works.


    #### STEP 2

    Fans of Star Wars even get a fix when it comes to the Terminal. By linking to
    a remote server via the `telnet` command, you can watch Episode IV: A New Hope
    being played out, albeit in ASCII. To view this spectacle, enter: `telnet towel.blinkenlights.nl`.


    #### STEP 3

    If you''ve ever fancied having the computer read a random fortune out to you,
    then you''re in luck. Most distros require you to install the fortune app, however
    Linux Mint differs somewhat by having it already pre-loaded. All you need to do
    is enter the command `fortune` into the Terminal, and enjoy.


    #### STEP 4

    The `rev` command is certainly interesting, and at first what seems a quite useless
    addition to the OS. However, it can be used to create some seemingly unbreakable
    passwords. Enter: `rev`, now type some text, when you press Enter next, everything
    you typed in will be reversed. Press `Ctrl+C` to exit.


    #### STEP 5

    If you''re stuck trying to work out all the possible factors for any particular
    number, simply enter `factor` followed by the number. For example, `factor 7`
    doesn''t offer much output, whereas `factor 60` displays more.


    #### STEP 6

    There''s a fine line between the rather cool and really-quite-weird. Having an
    ASCII cow repeat text to you could potentially fall in the latter. Enter `cowsay`
    followed by any text you want, such as: `cowsay Linux Mint is ace!`. In fact,
    you can even output the `ls` command through the cow, by entering: `ls | cowsay`.


    #### STEP 7

    To further the cow element, there''s even a graphical, i.e. non-Terminal, cow
    available. Install it with: `sudo apt-get install xcowsay`, then when it''s installed
    enter something similar to cowsay, such as: `xcowsay BDM Publications`.


    #### STEP 8

    If you really want to expand the whole cow thing, for whatever reason, then pipe
    the fortune command through it, with: `fortune | cowsay`; and for the graphical
    cow equivalent: `fortune | xcowsay`. Plus, there''s always cowthink. Try: `cowthink
    ...This book is awesome`.

    > "You shall judge of a man by his foes as well as by his friends." -- Joseph
    Conrad


    #### STEP 9

    The command `toilet` doesn''t inspire much confidence, we''ll admit. However,
    it''s not as bad as it first sounds. Start by installing it with: `sudo apt-get
    install toilet`. Then when installed, type something along the lines of: `toilet
    David`. Or perhaps list the contents of the current folder through it, with: `ls
    | toilet`.


    #### STEP 10

    Expanding the toilet command, you can actually generate some decent looking graphics
    through it. For example, try this: `toilet -f mono12 -F metal David`. You can
    enter `toilet --help`, for a list of the command line arguments to expand further.


    ## More Fun Things to do in the Terminal

    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you''re in luck. We''ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    ### MORE FUN, YAY

    Since the Terminal session is already open, and your keyboard digits are nicely
    warmed up, here are another two pages of Terminal nonsense.


    #### STEP 1

    Remember the old ZX Spectrum days of computing, when you could type in `10 print
    "Hello"`, `20 goto 10` and Hello would list down the screen? Well, in Linux Mint
    you can do the same. Simply enter `yes` followed by some text, i.e. `yes Linux
    is ace`. It''ll keep going until you press Ctrl+C.


    #### STEP 2

    The Matrix was one of the most graphically copied films ever released; there''s
    even a version of the Matrix code available for Linux Mint. Install it with: `sudo
    apt-get install cmatrix`. When it''s done enter: `cmatrix` and follow the white
    rabbit, Neo. Unlike the real Matrix though, you can press Ctrl+C to exit.


    #### STEP 3

    Having a little white cat chase your mouse pointer around the desktop may sound
    like a terrible waste of time. Oddly though, it isn''t. Enter: `sudo apt-get install
    oneko`, then type `oneko` to have the cat appear. Move your ''mouse'' cursor around
    the screen and the cat will chase it. Use Ctrl+C to exit the action.


    #### STEP 4

    This entry is a little more serious than the previous. It''s called the Fork Bomb
    and what it does, basically, is continually replicate itself until it has used
    up all the available system resources, thus causing your computer to crash. You
    don''t have to try it but it''s interesting nonetheless. Simply enter `:(){ :|:&
    };` and be prepared to reboot.'
  mdcn: '

    ## 第5步

    因此，创建目录的命令十分直观，你可以用它创建目录及其内部的任意子目录。但如果你想用一条命令同时创建目录和子目录，要怎么做呢？请确保你当前处于主目录（执行`cd
    ~`命令），然后输入：`mkdir -p Temp/finances`。接着执行`cd Temp/`，再输入`ls`即可查看新建的目录。


    ## 第6步

    `-p`选项可以让**mkdir**命令同时创建子目录和父目录。在Linux中，所有命令都遵循相同的结构：命令、选项、参数。以上一节的示例来说，命令为（**mkdir**），选项为（**-p**），参数为（**Temp/finances**）。


    ## 第7步

    如果你想深入了解`mkdir`命令的各类可用选项，可以在终端中输入`mkdir --help`。这条命令会输出一份快速帮助指南，详细说明各选项的作用以及命令结构的工作方式。


    ## 第8步

    现在我们已经创建好了一些目录，接下来看看如何删除它们。首先进入testdir目录并查看其内容：执行`cd testdir/`，再输入`ls`。之前创建的reports子目录就在列表中。删除它的方法之一是输入：`rmdir
    reports`，再次执行`ls`即可确认该目录已被删除。


    ## 第9步

    这里有个重要提示：通过终端删除目录时，它不会像通过Nemo文件管理器操作那样被移入Linux Mint的回收站，文件也是如此。如果你通过终端命令删除目录，那么它就会被永久删除。


    ## 第10步

    `rmdir`只能删除空目录，如果要删除包含子目录甚至文件的目录，你需要使用带`-R`选项的`rm`命令。例如，要删除Temp/finances目录，可以使用`rm
    -R Temp`命令。再次执行`ls`命令即可发现，父目录及其所有内容都已被删除。使用这条命令时请务必小心。


    ## 终端的趣味操作

    > 尽管操作系统本身十分严肃，但Linux社区显然也少不了趣味元素。多年来，开发者们在终端中创造并植入了各种各样有趣又奇特的元素。


    ### 终端趣味玩法

    接下来的两个部分你都将完全在终端中操作，所以先活动活动手指吧。毕竟俗话说的好，只工作不玩耍……


    #### 第1步

    我们要用的第一个命令是`sl`，它默认未安装，所以先输入：`sudo apt-get install sl`。输入`sl`即可运行该命令，执行后会显示一辆蒸汽火车在屏幕上行驶（这也是它被命名为sl的原因）。注意，输入大写的`LS`也能触发相同效果。


    #### 第2步

    《星球大战》粉丝在终端里也能过足瘾。通过`telnet`命令连接远程服务器，你就能观看《星球大战4：新希望》的ASCII字符版播放。想要观看这场“奇观”，输入：`telnet
    towel.blinkenlights.nl`即可。


    #### 第3步

    如果你曾想过让电脑给你随机念一句运势，那你可太幸运了。大多数Linux发行版需要你单独安装fortune应用，但Linux Mint略有不同，它已经预装了这款应用。你只需要在终端中输入`fortune`命令就可以享受这个功能了。


    #### 第4步

    `rev`命令非常有意思，乍一看它似乎是操作系统里相当没用的附加功能。但实际上，它可以用来生成一些看起来无懈可击的密码。输入`rev`后，随便输入一些文字，接下来按下回车键，你输入的所有内容就会被反转。按下`Ctrl+C`即可退出。


    #### 第5步

    如果你在计算某个数字的所有可能因数时卡住了，只需输入`factor`再加上对应的数字即可。例如，`factor 7`的输出内容很少，而`factor 60`的输出则会多很多。


    #### 第6步

    酷炫和怪异之间往往只有一线之隔。让一头ASCII奶牛给你复述文字，显然属于后者。输入`cowsay`再加上任意你想说的内容即可，比如：`cowsay Linux
    Mint is ace!`。事实上，你还可以让奶牛复述`ls`命令的输出，输入：`ls | cowsay`即可实现。


    #### 第7步

    为了把奶牛功能玩得更花，甚至还有一款图形化的奶牛工具（也就是非终端运行的版本）。安装它只需要输入：`sudo apt-get install xcowsay`，安装完成后输入和cowsay类似的指令即可，比如：`xcowsay
    BDM Publications`。


    #### 第8步

    如果你不管出于什么原因想把奶牛功能玩出更多花样，可以把fortune命令的输出传给cowsay，指令为：`fortune | cowsay`；图形化版本的对应指令为：`fortune
    | xcowsay`。除此之外还有cowthink命令，试试输入：`cowthink ...This book is awesome`。

    > “你既要通过朋友评判一个人，也要通过他的敌人评判。”——约瑟夫·康拉德


    #### 第9步

    不得不说，`toilet`这个命令的名字看起来确实不太靠谱。不过它的功能可比名字听起来好多了。首先安装它，输入：`sudo apt-get install
    toilet`。安装完成后，输入类似这样的指令：`toilet David`。也可以用它来输出当前目录的内容，指令为：`ls | toilet`。


    #### 第10步

    拓展`toilet`命令的功能，你甚至可以用它生成一些相当好看的字符画。例如，试试这条指令：`toilet -f mono12 -F metal David`。你可以输入`toilet
    --help`来查看所有可用的命令行参数，玩出更多花样。


    ## 更多终端趣味操作

    如果上面这份既有趣又相当奇特的终端操作清单让你觉得不过瘾，那你可太幸运了。我们又整理了一批或有用或没用的命令，供你尝试。


    ### 更多乐趣，太棒啦

    既然终端窗口已经打开，你的手指也活动开了，这里还有整整两页的终端趣味操作供你玩耍。


    #### 第1步

    还记得ZX Spectrum时代的旧款计算机吗？那时候你输入`10 print "Hello"`、`20 goto 10`，Hello就会在屏幕上不断往下滚？在Linux
    Mint中，你也能实现同样的效果。只需输入`yes`再加上任意文本即可，比如`yes Linux is ace`。它会一直重复输出，直到你按下Ctrl+C才会停止。


    #### 第2步

    《黑客帝国》是有史以来被模仿最多的电影之一，甚至还有适配Linux Mint的《黑客帝国》代码雨版本。安装它只需要输入：`sudo apt-get install
    cmatrix`。安装完成后输入`cmatrix`，追随着白兔走吧，尼奥。不过和真正的黑客帝国不一样的是，你可以按下Ctrl+C退出代码雨。


    #### 第3步

    让一只小白猫在桌面上追着你的鼠标指针跑，听起来似乎很浪费时间。但奇怪的是，其实并不会。输入：`sudo apt-get install oneko`，之后输入`oneko`就能唤出小猫。在屏幕上移动鼠标指针，小猫就会追着它跑。按下Ctrl+C即可停止这个效果。


    #### 第4步

    本条内容比前几条稍微严肃一点。它叫做“分叉炸弹”，基本原理是它会不断自我复制，直到耗尽所有可用的系统资源，最终导致你的电脑崩溃。你大可不必尝试它，但了解一下也无妨。只需输入`:(){
    :|:& };`，做好重启电脑的准备即可。

    '
