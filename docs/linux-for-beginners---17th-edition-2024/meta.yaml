  md: '![](img/6103e44aa372eb088d684690786bde89_6_0.png)


    # Say Hello to Linux


    Why Linux? What is it? Where do I get it? Why are there so many different versions
    of it? Most beginners ask these, and many more, questions when starting out. It''s
    true that Linux is an incredibly versatile and powerful operating system but where
    do you start? Thankfully, you can find the answers in this section.


    There is so much you can do with Linux but you need to know where to start; we''re
    here to help you out. In this section you can learn what Linux is, what a distro
    is and what a desktop environment is. You can also begin to explore how Linux
    works and how it can work for you.


    ![](img/6103e44aa372eb088d684690786bde89_6_1.png)'
  merge: -1
  pgno: 6
- img_proc: true
  md: "# Why Linux?\n\nFor many of its users, Linux means freedom. Freedom from the\
    \ walled garden approach of other operating systems, freedom to change and use\
    \ the OS as you please and freedom from any form of licensing or payment. There's\
    \ a lot more to Linux than you may think though.\n\n# FREE AND OPEN\n\nLinux is\
    \ a fantastic fit for those who want something different. The efficiency of the\
    \ system, the availability of applications and stability are just a few good reasons.\n\
    \nThe first thing you need to know is that there is no such operating system called\
    \ Linux. Linux is in fact the operating system kernel, the core component of an\
    \ OS. When talking about Linux what we, and others, are referring to are one of\
    \ the many distributions, or distros, that use the Linux kernel. No doubt you've\
    \ heard of at least one of the current popular distros: Ubuntu, Linux Mint, Fedora,\
    \ openSUSE, Debian, Raspbian, the list goes on. Each one of these distros offers\
    \ something a little different for the user. While each has the Linux kernel at\
    \ its core, they provide the user with a different looking desktop environment,\
    \ different preloaded applications, different ways in which to update the system\
    \ and get more apps installed and a slightly different look and feel throughout\
    \ the entire system. However, at the centre lies Linux, which is why we say Linux.\n\
    \nLinux works considerably differently to Windows or macOS. It's free for a start:\
    \ free to download, free to install on as many computers as you like, free to\
    \ use for an unlimited amount of time and free to upgrade and extend with, equally,\
    \ free programs and applications. This free to use element is one of the biggest\
    \ draws for the developer. While a Windows license can cost up to £100, and a\
    \ Mac considerably more, a user, be they a developer, gamer or someone who wants\
    \ to put an older computer to use, can quickly download a distro and get to work\
    \ in a matter of minutes.\n\nAlongside the free to use aspect comes a level of\
    \ freedom to customise and mould the system to your own uses. Each of the available\
    \ distros available on the Internet have a certain 'spin',\n\nLinux is a great\
    \ operating system on which to start coding.\n\n![](img/6103e44aa372eb088d684690786bde89_7_0.png)\n\
    \n```\n#include <iostream>\n\nint main()\n{\n    //My first C++ Program\n    std::cout\
    \ << \"Hello World!\\n\";\n    return 0;\n}\n```"
  merge: -1
  pgno: 7
- img_proc: true
  md: '![](img/6103e44aa372eb088d684690786bde89_8_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_8_1.png)


    # **There are thousands of free packages available for programmers under Linux.**


    # **Each distro offers something unique to the user but all have Linux at the
    core.**


    in that some offer increased security, a fancy looking desktop, a gaming specific
    spin, or something directed toward students. This extensibility makes Linux a
    more desirable platform to use, as you can quickly mould the system into a development
    base, including many different kinds of IDEs for the likes of Python, web development,
    C++, Java and so on; or create a base for online anonymity, perhaps as a Minecraft
    server, media centre and much more.


    refuse to run the latest versions of Windows or macOS; so rather than throwing
    away an old computer, it can be reused with a Linux distro.


    It’s not all about C++, Python or any of the other more popular programming languages
    though. Using the command line of Linux, also called the Terminal, you’re able
    to create Shell scripts, which are programs that are designed to run from the
    command line and made up of scripting languages. They are used mainly to automate
    tasks or offer the user some form of input and output for a certain operation.


    Another remarkable advantage for those looking to learn how to code, is that Linux
    comes with most of the popular coding environments built in. Both Python and C++
    are preinstalled in a high percentage of Linux distros available, which means
    you can start to program almost as soon as you install the system and boot it
    up for the first time.


    Finally, although there are many more advantages we can list, there are thousands
    and thousands of free programs and apps available that cover nearly every aspect
    of computing. Known as packages, there are (at the time of writing) over 8,700
    specific programming applications just on Linux Mint alone and an incredible 62,000+
    overall packages catering for everything from Amateur Radio to WWW tools.


    Generally speaking, Linux doesn’t take up as many system resources as Windows
    or macOS; by system resources we mean memory, hard drive space and CPU load. The
    Linux code has been streamlined and is free from third-party ‘bloatware’ which
