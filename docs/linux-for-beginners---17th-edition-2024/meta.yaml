- md: '## Pi x Linux = The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential
    it needs a remarkable operating system. Thankfully, Linux is the default and recommended
    OS of choice for the Pi, and together they make a winning team.


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of hardware that could offer much more
    than simply being a cheap, but small, computer. The Pi needed to be flexible with
    what it could do, it needed to have room to grow into more ambitious project concepts
    and ideas, and it needed to do so in as easy to use fashion as possible. The goal
    was to create a universal learning platform, that students of any age could expand
    on and tinker with, while learning new concepts such as programming, electronics,
    and computing. Naturally, once the hardware was developed, the only real choice
    of operating system was of course, Linux.


    ![](img/6103e44aa372eb088d684690786bde89_77_0.png)


    The versatility of Linux is legendary. This incredible core OS is so malleable
    that it can be steered toward nearly any aspect of computing, from supercomputing
    to robotics, the space industry to more terrestrial engineering; education and
    science, manufacturing and the Internet. Think of an industry, and you will likely
    find a Linux installation somewhere in the background keeping it all together.


    ![](img/6103e44aa372eb088d684690786bde89_77_1.png)

    ![](img/6103e44aa372eb088d684690786bde89_77_2.png)


    Raspberry Pi OS is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes packed with a collection of useful tools
    that cater for coding, electronics, and general desktop computing duties. Alongside
    the apps are pre-loaded modules to help get the most from each of the programming
    languages you decide to learn and use, as well as software to hardware modules
    that will enable you to power and use the hardware specific items unique to the
    Pi. For example, there are Python modules that interact with the Raspberry Pi''s
    40-pin GPIO, allowing you to create content for any of the Hardware Attached on
    Top devices. This combination is what makes the Raspberry Pi an excellent base
    of operations to learn not only coding on, but also Linux in general. Raspberry
    Pi OS, being Debian-based, will be able to run any of the Terminal commands listed
    in this book, as Linux Mint and even Ubuntu are also Debian-based. And since the
    Raspberry Pi is so small, and costs very little setup, you''re able to have both
    your regular, Windows or macOS computers, and have a Raspberry Pi as a headless
    (a powered device that doesn''t need a keyboard, mouse or monitor attached, as
    you connect to it remotely) computer from which you can connect to and learn how
    to use Linux and how to code.


    ### WHICH PI?


    There are several Raspberry Pi models available, with each offering something
    slightly different from the others. The most recent Pi released is the Raspberry
    Pi 5, and while this model is slightly more expensive than some of the other examples,
    it is the most powerful and feature-rich Pi available. Overall, it''s probably
    best to start experimenting with the Pi using the Pi 3 Model B+, then moving on
    to one of the other models as you develop your skills and focus on a particular
    project, such as the need to use one of the Pi Zero models, with a smaller footprint
    and WiFi enabled connectivity.


    ![](img/6103e44aa372eb088d684690786bde89_78_1.png)


    ### BEYOND RASPBERRY PI OS


    The flexibility of the Raspberry Pi''s ARM processor means that it''s capable
    of running other operating systems beyond Raspbian. Still keeping with Linux,
    you can instead install Ubuntu MATE, Pidora (a Fedora-based distribution), Lakka,
    PiPlay (a retro emulation distribution) and Arch Linux ARM. There are also systems
    based loosely on the Linux kernel, such as Android, Minibian, and Chromium OS.
    As previously mentioned, the Raspberry Pi is an excellent code base, and with
    Linux as the backbone you''re able to start learning how to code in a multitude
    of different programming languages. Bash scripting works perfectly, since Raspberry
    Pi OS is Linux, and Debian-based, and you can easily expand your scripts to encompass
    much of the Pi''s functionality. Aside from creating backup scripts, you can also
    create scripts that can access the GPIO pins on the Pi, and so be able to control
    LEDs, and even more complex HATs. There''s Windows 10 IoT Core, FreeBSD, RISC
    OS Pi, Plan 9 and, remarkably, AROS – an Amiga OS clone. Needless to say, that
    once you''ve finished experimenting with one version of Linux, just as you would
    with a desktop version of Linux, you can hop to another on the Raspberry Pi and
    see that one works, and whether it will work for you.


    ### PI, LINUX AND CODING


    Python is by far the most popular choice for beginners, and Raspbian comes pre-installed
    with everything you will need to get the most from your Python experience. There
    are countless pre-loaded modules, as well as the most recent stable release of
    the language.


    ![](img/6103e44aa372eb088d684690786bde89_78_2.png)


    C++ is one of the most powerful programming languages to learn. It''s used for
    games, apps, and even entire operating systems. The Raspberry Pi comes with a
    great C++ editor, that''s easy to use and can help you develop amazing content.
    Whichever way you decide to take your coding and Linux adventure, the Raspberry
    Pi is an excellent platform from which to begin on.


    ![](img/6103e44aa372eb088d684690786bde89_78_3.png)


    ## Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all
    tasks. Understanding how to use the command line not only builds your understanding
    of Linux but also improves your knowledge of coding and programming in general.
    Our command line quick reference guide is designed to help you master Linux quicker.


    ### TOP 10 COMMANDS


    These may not be the most common commands used by everyone but they will certainly
    feature frequently for many users of Linux and the command line.


    - **cd**：The cd command is one of the commands you will use the most at the command
    line in Linux. It allows you to change your working directory. You use it to move
    around within the hierarchy of your file system. You can also use chdir.

    - **mv**：The mv command moves a file to a different location or renames a file.
    For example mv file sub renames the original file to sub. mv sub ~/Desktop moves
    the file ''sub'' to your desktop directory but does not rename it. You must specify
    a new filename to rename a file.

    - **ls**：The ls command shows you the files in your current directory. Used with
    certain options, it lets you see file sizes, when files were created and file
    permissions. For example, ls ~ shows you the files that are in your home directory.

    - **chown**：The chown command changes the user and/or group ownership of each
    given file. If only an owner (a user name or numeric user ID) is given, that user
    is made the owner of each given file, and the files'' group is not changed.

    - **cp**：The cp command is used to make copies of files and directories. For example,
    cp file sub makes an exact copy of the file whose name you entered and names the
    copy sub but the first file will still exist with its original name.

    - **chmod**：The chmod command changes the permissions on the files listed. Permissions
    are based on a fairly simple model. You can set permissions for user, group and
    world and you can set whether each can read, write and or execute the file.

    - **pwd**：The pwd command prints the full pathname of the current working directory
    (pwd stands for "print working directory"). Note that the GNOME terminal also
    displays this information in the title bar of its window.

    - **rm**：The rm command removes (deletes) files or directories. The removal process
    unlinks a filename in a filesystem from data on the storage device and marks that
    space as usable by future writes. In other words, removing files increases the
    amount of available space on your disk.

    - **clear**：The clear command clears your screen if this is possible. It looks
    in the environment for the terminal type and then in the terminfo database to
    figure out how to clear the screen. This is equivalent to typing Control-L when
    using the bash shell.

    - **mkdir**：Short for "make directory", mkdir is used to create directories on
    a file system, if the specified directory does not already exist. For example,
    mkdir work creates a work directory. More than one directory may be specified
    when calling mkdir.'
