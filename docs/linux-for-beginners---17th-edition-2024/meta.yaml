- md: '## Creating Bash Scripts – Part 1

    Eventually, as you advance with Linux Mint, you''ll want to start creating your
    own automated tasks and programs. These are essentially scripts, Bash Shell scripts
    to be exact, and they work in the same way as a DOS Batch file does, or any other
    programming language.


    ### GET SCRIPTING

    A Bash script is simply a series of commands that Mint will run through to complete
    a certain task. They can be simple or remarkably complex, it all depends on the
    situation.


    ### STEP 1

    You''ll be working within the Terminal and with a text editor throughout the coming
    pages. There are alternatives to the text editor, which we''ll look at in a moment
    but for the sake of ease, we''ll be doing our examples in Xed. Before you begin,
    however, run through the customary update check: `sudo apt-get update && sudo
    apt-get upgrade`.


    ### STEP 2

    There are several text editors we can use to create a Bash script: Xed, Vi, Nano,
    Vim, GNU Emacs and so on. In the end it all comes down to personal preference.
    Our use of Xed is purely due to making it easier to read the script in the screenshots
    you see below.


    ### STEP 3

    To begin with, and before you start to write any scripts, you need to create a
    folder where you can put all your scripts into. Start with **mkdir scripts**,
    and enter the folder **cd scripts/**. This will be our working folder and from
    here you can create sub-folders if you want for each script you create.


    ### STEP 4

    Windows users will be aware that in order for a batch file to work, as in, to
    be executed and follow the programming within it, it needs to have a .BAT file
    extension. Linux is an extension-less operating system but the convention is to
    give scripts a .sh extension.


    ### STEP 5

    Stringing several commands and piping them through other commands is what makes
    scripting such a powerful element to an OS. Using the while command, for example,
    together with toilet, can yield some impressive results.


    Enter: `while true; do echo "$(date ''+%D %T'' | toilet -f term -F border --metal)";
    sleep 1; done.`


    ### STEP 6

    Talking computers were the craze of the 80s, enter: `espeak "Hello, this is Linux
    Mint"` to have the computer repeat the text inside the quotes to you. Make sure
    your volume is turned up, and try the following: `ls > folders.txt && espeak -f
    folders.txt`


    This will have Mint read back the contents of the ls command.


    ### STEP 7

    A roaring ASCII fire isn''t the most useful command to have at your disposal,
    but it''s fun. Install it with: `sudo apt-get install libaa-bin`, then when installed
    use: `aafire`


    It''s not exactly warming but you get the idea. To expand the above, enter: `sudo
    apt-get install bb caca-utils`, then run `cacafire`


    ### STEP 8

    Used as a music demo from the old Amiga and DOS days, the bb command reminds us
    of getting hold of three and a half inch floppies crammed with all manner of demoscene
    goodies. We''ve already installed bb from the previous step, so just enter bb.
    Follow the on-screen instructions, and turn up your volume.


    ### STEP 9

    This entry is in two parts. First you need to get hold of the necessary packages:
    `sudo apt-get install liburses-perl`


    When that''s done enter:

    ```

    cd Downloads/ && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/.

    ```

    Then:

    ```

    perl Makefile.PL && make && make test && sudo make install

    ```


    ### STEP 10

    With that little lot done, onto the next. Enter:

    ```

    cd .. && wget http://www.robobunny.com/projects/asciiquarium/asciiquarium.tar.gz
    && tar -xf asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium

    ```

    Providing all went well, enter `./asciiquarium` and enjoy your very own ASCII-based
    aquarium.


    ## Linux Tips and Tricks

    As you''ve seen, The Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smidgen of command knowledge, incredible, and
    often quite strange, things can be accomplished.


    ### TAKING COMMAND

    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s Unix heritage, while others are recent additions
    to Linux lore. Here''s our favourite ten tips and tricks.


    ### EASTER EGGS

    Emacs, the text editor, is a great piece of software, however, did you know it
    also contains a hidden Easter Egg? With Emacs installed (`sudo apt-get install
    emacs25`), drop to a Terminal session and enter:

    ```

    sudo apt-get install emacs25

    emacs -batch -l dunnet

    ```

    Dunnet is a text adventure written by Ron Schnell in 1982, and hidden in Emacs
    since 1994.


    ### TERMINAL BROWSING

    Ever fancied being able to browse the Internet from the Terminal? While not particularly
    useful, it is quite a fascinating thing to behold. To do so, enter:

    `sudo apt-get install elinks`

    Enter the website you want to visit.


    ### MOON BUGGY

    Based on the classic 1982 arcade game, Moon Patrol, Moon Buggy appeared on the
    home computers of 1985 amid much praise. It''s a cracking Atari game, and it''s
    available in the Linux Terminal by entering:

    `sudo apt-get install moon-buggy`

    Then:

    `moon-buggy`

    Enjoy.


    ### LET IT SNOW

    Snowing in the Terminal console? If you''re not interested, however, enter:

    ```

    wget https://gist.githubusercontent.com/sontek/1505483/raw/7d024716ea57e69fb52632fee09f42753361c4a2/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


    ### MEMORY HOGS

    If you need to see what apps are consuming the most memory on Linux, simply enter:

    `ps aux | sort -rnk 4`

    This sorts the output by system memory use.


    ### BBS

    Back in the days of dial-up connections, the online world was made up of Bulletin
    Board Systems. These remote servers provided hang-outs for users to chat, swap
    code, play games and more. Using telnet in Linux, we can still connect to some
    active BBSes:

    `telnet battlestarbbs.dyndns.org`

    There are countless operational BBSes available, check out https://www.telnetbbsguide.com/bbs/list/detail/
    for more.


    ### SHREDDER

    When you delete a file, there''s a chance of someone with the right software being
    able to retrieve it. However, to securely and permanently delete a file, use Shred:

    `shred -zvu NAMEOFFILE.txt`

    Replace NAMEOFFILE with the name of the file to delete.


    ### DIRECTORY TREES

    If you want to create an entire directory (or folder) tree with a single command,
    you can use:

    `mkdir -p New-Dir/${subfolder1,subfolder2,subfolder3,subfolder4}`

    This creates a New-Dir with four sub folders within.


    ### ASCII ART

    ASCII art can be quite striking when applied to some images. However, it''s often
    difficult to get just right. You can create some great ASCII art from the images
    you have by using img2txt:

    `img2txt NAMEofIMAGEFILE.png`

    Replace NAMEofIMAGEFILE with the actual name of the image file on your system.
    If img2txt isn''t installed, use:

    `sudo apt-get install caca-utils.`


    ### FORGOTTEN COMMANDS

    It''s not easy trying to remember all the available Linux commands. Thankfully,
    we can use apropos to help us. Simply use it, along with a description of the
    command:

    ```

    apropos "copy files"

    apropos "rename files"

    ```


    ## Linux and the Big Bang

    > Linux is colliding particles, so we can understand how the universe works.


    ## DID YOU KNOW...

    that Linux is at the heart of the science behind the Large Hadron Collider? Using
    a combination of Red Hat Linux and CentOS (an ultra-stable distro built from the
    Red Hat core) as the base distributions of choice, scientists, developers and
    engineers have created SL – Scientific Linux. Using SL as the base, the clever
    people at CERN have developed several different versions of their own custom Linux
    distro to help with all aspects of the LHC. Most notable is SLC, or Scientific
    Linux CERN, also known as CERN6. According to reports, there are over 36,000 systems
    running SL, and over 15,000 running SLC.'
