    ![](img/6103e44aa372eb088d684690786bde89_32_3.png)


    **STEP 9** Click on the Menu and type system settings and open the resulting icon.
    This takes you to the System Settings options. From here you''re able to control
    and edit the way Linux Mint Cinnamon looks and works as well add new users, manage
    the firewall and enable accessibility options.


    ![](img/6103e44aa372eb088d684690786bde89_32_4.png)


    **STEP 10** In short, Linux Mint Cinnamon can be configured to look quite extraordinary.
    There are many examples available of how good it can get and what can be achieved.
    You can go as complex or as simple as you want, adding different component and
    animations or just keeping it plain and easy to read.


    ![](img/6103e44aa372eb088d684690786bde89_32_5.png)'
- md: '## **10 Things to do After Installing Linux Mint**

    ![](https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Linux_Mint_logo_full.svg/1200px-Linux_Mint_logo_full.svg.png)


    ### LINUX TWEAKS

    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    - **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the shield icon in the Panel, found at the bottom right of
    the desktop next to the time and date. This launches the Update Manager.

    ![](img/6103e44aa372eb088d684690786bde89_33_0.png)


    - **STEP 2** Linux Mint offers the user a three level policy approach to updates:
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that won''t impact critical elements of the core OS. Read
    through the descriptions but choose the middle, and recommended option.

    ![](img/6103e44aa372eb088d684690786bde89_33_1.png)


    - **STEP 3** Click the OK button and you can see a couple of updates ready for
    installation. Before you update though, click on the blue bar OK button to switch
    to a Local Mirror. This opens the Software Sources option. In the Mirrors section,
    click on the Main and Base drop-down menus and select a server closest to your
    current location.

    ![](img/6103e44aa372eb088d684690786bde89_33_2.png)


    - **STEP 4** Click the Update the Cache button and close the Software Sources
    window. Back in the Update Manager, click on the Install Updates icon and enter
    your password. The updates automatically apply themselves and relaunch Update
    Manager, this time with a lot more updates. Again, click Install Updates, OK any
    messages and wait for them to finish.

    ![](img/6103e44aa372eb088d684690786bde89_33_3.png)


    - **STEP 5** The updates are graded by level, 1 being a low level update, level
    5 being a dangerous one. Stick to level 3 updates, is our advice; and click Replace
    for any messages regarding overwriting a configuration file. With regards to the
    Software Rendering issue and lack of drivers for non-VirtualBox users, click the
    Menu and type ''driver'' into the search box.

    ![](img/6103e44aa372eb088d684690786bde89_34_1.png)


    - **STEP 6** Click the Driver Manager app that appears as a result of the search
    and enter your password. Mint takes a moment to analyse what''s available and
    presents you with a selection of potential drivers based on your detected hardware.
    Those with graphical problems, such as Software Rendering, should opt to use the
    latest, recommended Graphics driver.

    ![](img/6103e44aa372eb088d684690786bde89_34_2.png)


    - **STEP 7** At this point you''ll probably need to restart Linux Mint, so do
    that now. After a reboot click the Menu button again, followed by the Terminal.
    The Terminal icon is found in the left-hand column, above the Files icon. With
    the Terminal open, enter: `sudo apt-get install libdvd-pkg`, press Enter and type
    in your password. This enables encrypted DVD playback.

    ![](img/6103e44aa372eb088d684690786bde89_34_3.png)


    - **STEP 8** When asked to accept the changes, enter Y and also when asked to
    configure libdvd. Make sure OK is highlighted and press Enter, then Yes to any
    further questions. Next up, still in the Terminal, enter: `cat /proc/sys/vm/swappiness`;
    the result should be 60. If your computer has less than 4GB of RAM/memory, then
    enter: `gksudo xed /etc/sysctl.conf`.

    ![](img/6103e44aa372eb088d684690786bde89_34_4.png)


    - **STEP 9** This tweak helps speed up systems with less than 4GB RAM/memory.
    Scroll down to the bottom of the file you just opened and add the following new
    lines:

    ```

    # Decrease swap usage to a more reasonable level

    vm.swappiness=10

    ```

    Click **File > Save**, then **File > Quit**. Reboot Linux Mint and you should
    notice a slight hike in performance.

    ![](img/6103e44aa372eb088d684690786bde89_34_5.png)


    - **STEP 10** Security is always a concern in this modern digital age. While Linux
    Mint is a secure system, it''s advisable to always try and improve it. Click the
    Menu button and search for Firewall; click the Firewall Configuration icon and
    enter your password. In the Firewall window, click the Status slider to On.

    ![](img/6103e44aa372eb088d684690786bde89_34_6.png)



    ## Apollo 11

    ![](img/6103e44aa372eb088d684690786bde89_35_0.png)

    DID YOU KNOW...

    July 20th 1969 is remembered as a turning point in human history, when mankind
    first stepped on the moon. The software that helped the crew make that pivotal
    voyage didn''t even exist at the time and had to be developed from scratch. Using
    a new method of storing programs called Rope Memory, the engineers at MIT Instrumentation
    Laboratory populated the memory with a special version of assembly. Incredibly,
    that code is freely available to view on GitHub. Uploaded by a researcher in 2003,
    you can view the code by visiting www.github.com/chrisgarry/Apollo-11/. Look out
    for code snippets, such as Burn_Baby_Burn, in particular line 925 with the comment
    "Goodbye. Come again soon." Have a look through, and see what else you can find.


    > Programmers aren''t without a sense of humour. See what else is in there.


    ## One giant leap for mankind, and coding.

    ![](img/6103e44aa372eb088d684690786bde89_36_0.png)

    > > Credit: Apollo 11/NASA



    ## Creating Users

    When you first install Linux Mint it is configured for use with a single user.
    While sharing a user account with the entire family is fine, there may come a
    time when you need to create separate users with their own unique Home folders.


    ### NEW USERS

    Having different users means each user has access to his or her own areas on the
    system. Documents, pictures, videos and so on are separate, as with multiple users
    on other operating systems.


    - **STEP 1** Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. From the search results, choose Users and Groups and
    enter your password. The Users and Groups console is quite basic looking, and
    thankfully easy to use. At first, you can just see your own username from when
    you installed Linux Mint.

    ![](img/6103e44aa372eb088d684690786bde89_37_0.png)


    - **STEP 2** To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the new user has need to install new apps or access parts of the file system beyond
    their Home folder, then opt for the Standard account type. Otherwise, use the
    Administrator account type.

    ![](img/6103e44aa372eb088d684690786bde89_37_1.png)


    - **STEP 3** Enter the new user''s Full Name, followed by the Username they need
    when logging into Linux Mint. Make sure the username is all in lower case, a-z
    and 0-9 characters only. You can have full stops, underscores or hyphens if you
    wish. Click the Add button when you''re ready to continue.

    ![](img/6103e44aa372eb088d684690786bde89_37_2.png)


    - **STEP 4** The new user appears in the list of current Linux Mint users, in
    alphabetical order. At present, there''s no password set so click the user in
    the list of current users, then click the No Password Set option under the user''s
    username.

    ![](img/6103e44aa372eb088d684690786bde89_37_3.png)


    - **STEP 5** You can now enter a password for the new user or click the curled
    arrow at the end of the New Password text box to generate a password for you,
    as well as displaying it. Naturally, it''s a good idea to come up with as strong
    a password as possible. When you''re done, click the Change button.

    ![](img/6103e44aa372eb088d684690786bde89_38_0.png)


    - **STEP 6** You can close the Users and Groups console window now, as the new
    user has been created. If you click the Mint Menu, followed by Logout, you are
    presented with the Mint Login Manager. The new user is now present in the list
    of currently available users. Click on him/her to log them in.

    ![](img/6103e44aa372eb088d684690786bde89_38_2.png)


    - **STEP 7** Once logged in the new user is required to set up their own desktop
    wallpaper, icons, Panel, Menu and so on. Depending on what Account Type you set
    up for them, Standard or Administrator, they won''t be able to install any new
    apps. This screenshot is from a Standard user account type.

    ![](img/6103e44aa372eb088d684690786bde89_38_1.png)


    - **STEP 8** You can create as many new accounts as you need and you''re able
    to switch between them when required. It''s best to have just one account that''s
    capable of installing new software, that way you can keep track of what''s on
    your system.

    ![](img/6103e44aa372eb088d684690786bde89_38_3.png)


    ## COMMAND LINE ACCOUNTS

    Just as you''d expect, you can also create a new user within the command Line.
    Open up a Terminal session under the main (yours) Administrator account.


    - **STEP 1** The process for adding a new user from the command line is relatively
    simple. To begin with, type: `sudo adduser <username>` where `<username>` is the
    new user''s login name. You''re then asked to create a new password for the user,
    along with their full name and other details. Click y to confirm the details and
    create the user account.

    ![](img/6103e44aa372eb088d684690786bde89_38_4.png)


    - **STEP 2** You can check the details and account type for the new user from
    within the Users and Groups console. If you want to delete a user from Mint, you
    can either enter: `sudo deluser <username>` in the Terminal or click the Delete
    button in Users and Groups.

    ![](img/6103e44aa372eb088d684690786bde89_38_5.png)'
  mdcn: '

    ## **安装Linux Mint后要做的10件事**

    ![](https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Linux_Mint_logo_full.svg/1200px-Linux_Mint_logo_full.svg.png)

    ### Linux系统调整

    其中一些安装后操作非常推荐，其他的则是实用的补充项，仅用于调整系统或增加个性化设置。

    - **步骤1**

    第一项，同时也是最重要的一项安装后操作是更新系统。点击面板上的盾牌图标，它位于桌面右下角、时间和日期旁边。点击后会启动更新管理器。

    ![](img/6103e44aa372eb088d684690786bde89_33_0.png)

    - **步骤2**

    Linux Mint为用户提供了三档更新策略：别搞崩我的电脑、优化稳定性和安全性、以及全部更新。推荐选择中间档的「优化稳定性和安全性」，该选项仅更新不会影响核心操作系统关键组件的安全、必要补丁。你可以先浏览各档位的说明，选择中间档的推荐选项即可。

    ![](img/6103e44aa372eb088d684690786bde89_33_1.png)

    - **步骤3**

    点击OK按钮后，你会看到有几项更新准备就绪。但在更新之前，先点击蓝色栏的OK按钮切换到本地镜像源，这会打开软件源选项。在镜像源板块中，点击「Main」和「Base」的下拉菜单，选择距离你当前位置最近的服务器。

    ![](img/6103e44aa372eb088d684690786bde89_33_2.png)

    - **步骤4**

    点击「更新缓存」按钮后关闭软件源窗口。回到更新管理器界面，点击安装更新图标并输入你的密码。更新会自动应用，随后会重新启动更新管理器，此时会有更多可更新的内容。再次点击安装更新，确认所有提示框，等待更新完成即可。

    ![](img/6103e44aa372eb088d684690786bde89_33_3.png)

    - **步骤5**

    更新会按风险等级划分，1级为低风险更新，5级为高风险更新。我们的建议是仅安装3级及以下的更新；如果出现覆盖配置文件的提示，选择替换即可。如果遇到软件渲染问题，或是非VirtualBox用户缺少驱动的话，点击菜单，在搜索框中输入「driver」。

    ![](img/6103e44aa372eb088d684690786bde89_34_1.png)

    - **步骤6**

    点击搜索结果中出现的「驱动程序管理器」应用并输入密码。Linux Mint会花一点时间分析可用的驱动，然后根据检测到的硬件为你推荐可用的驱动列表。如果遇到图形问题（比如软件渲染问题），建议选择最新的推荐显卡驱动。

    ![](img/6103e44aa372eb088d684690786bde89_34_2.png)

    - **步骤7**

    到这一步你大概率需要重启Linux Mint，现在就可以执行重启操作。重启后再次点击菜单按钮，然后打开终端。终端图标位于左侧栏，文件图标的上方。打开终端后输入：`sudo
    apt-get install libdvd-pkg`，按回车并输入你的密码，即可开启加密DVD播放功能。

    ![](img/6103e44aa372eb088d684690786bde89_34_3.png)

    - **步骤8**

    当提示你确认更改时输入Y，提示配置libdvd时同样输入Y。确保OK选项处于选中状态后按回车，后续所有提示都选择Yes即可。接下来仍在终端中输入：`cat
    /proc/sys/vm/swappiness`，返回值应该是60。如果你的电脑内存不足4GB，则输入：`gksudo xed /etc/sysctl.conf`。

    ![](img/6103e44aa372eb088d684690786bde89_34_4.png)

    - **步骤9**

    这项调整可以提升内存不足4GB的系统的运行速度。滚动到刚刚打开的文件的末尾，添加以下新行：

    ```

    # Decrease swap usage to a more reasonable level

    vm.swappiness=10

    ```

    点击**文件 > 保存**，再点击**文件 > 退出**。重启Linux Mint后你会发现运行速度有轻微提升。

    ![](img/6103e44aa372eb088d684690786bde89_34_5.png)

    - **步骤10**

    在如今的数字时代，安全始终是需要关注的问题。虽然Linux Mint本身就是一款安全的系统，但我们仍建议你尽量提升其安全性。点击菜单按钮，搜索防火墙；点击防火墙配置图标并输入密码。在防火墙窗口中，将状态滑块拨动到开启。

    ![](img/6103e44aa372eb088d684690786bde89_34_6.png)


    ## 阿波罗11号

    ![](img/6103e44aa372eb088d684690786bde89_35_0.png)

    你知道吗……

    1969年7月20日是人类历史的转折点，这一天人类首次踏上了月球。帮助宇航员完成这次关键航行的软件在当时尚未问世，完全是从零开始开发的。麻省理工学院仪器实验室的工程师们使用了一种名为「绳内存」的全新程序存储方式，将特殊版本的汇编语言写入其中。令人惊叹的是，这段代码已经在GitHub上公开可以查看。它由一位研究员于2003年上传，你可以通过访问www.github.com/chrisgarry/Apollo-11/
    来查看代码。你可以留意一些有趣的代码片段，比如Burn_Baby_Burn，尤其是第925行的注释「再见，下次再来」。你可以随意浏览，看看还能发现什么有意思的内容。

    > 程序员也很有幽默感。你可以看看里面还有什么有意思的内容。


    ## 人类的一大步，也是编码的一大步

    ![](img/6103e44aa372eb088d684690786bde89_36_0.png)

    > > 来源：阿波罗11号/NASA


    ## 创建用户

    初次安装Linux Mint时，系统默认仅配置1个用户。全家共用一个用户账户虽然没什么问题，但总会有需要创建独立用户、为每个人配备专属主文件夹的时候。

    ### 新用户

    拥有不同用户意味着每个用户都可以使用系统中的个人专属区域。文档、图片、视频等内容都会相互独立，和其他操作系统中的多用户功能一致。

    - **步骤1**

    点击Linux Mint菜单，输入「users」来搜索相关控制台。在搜索结果中选择「用户和组」，输入你的密码。用户和组控制台界面非常简洁，而且使用起来很便捷。刚打开时你只能看到你自己安装Linux
    Mint时创建的用户名。

    ![](img/6103e44aa372eb088d684690786bde89_37_0.png)

    - **步骤2**

    要添加新用户，点击控制台底部的「添加」按钮。你可以创建两种类型的用户：标准用户和管理员。如果新用户不需要安装新应用，也不需要访问主文件夹以外的文件系统区域，那么选择标准用户类型即可，其余情况选择管理员类型。

    ![](img/6103e44aa372eb088d684690786bde89_37_1.png)

    - **步骤3**

    依次输入新用户的「全名」，以及该用户登录Linux Mint时需要的用户名。注意用户名需要全部为小写，仅可包含a-z和0-9的字符，你也可以选择使用句点、下划线或连字符。准备好后点击添加按钮即可。

    ![](img/6103e44aa372eb088d684690786bde89_37_2.png)

    - **步骤4**

    新用户会按字母顺序出现在当前Linux Mint用户列表中。此时还未为该用户设置密码，因此点击当前用户列表中的该用户，再点击用户名下方的「未设置密码」选项。

    ![](img/6103e44aa372eb088d684690786bde89_37_3.png)

    - **步骤5**

    现在你可以为新用户输入密码，也可以点击新密码输入框末尾的卷曲箭头，自动生成密码并显示密码内容。当然，建议你设置尽可能复杂的密码。设置完成后点击「更改」按钮。

    ![](img/6103e44aa372eb088d684690786bde89_38_0.png)

    - **步骤6**

    新用户已经创建完成，现在可以关闭用户和组控制台窗口了。如果你点击Mint菜单，再选择注销，就会进入Mint登录管理器。新用户已经出现在当前可用用户列表中，点击对应用户即可完成登录。

    ![](img/6103e44aa372eb088d684690786bde89_38_2.png)

    - **步骤7**

    新用户首次登录后需要自行设置桌面壁纸、图标、面板、菜单等内容。根据你为该用户设置的用户类型（标准用户/管理员），该用户可能无法安装新的应用程序。这张截图来自标准用户账户。

    ![](img/6103e44aa372eb088d684690786bde89_38_1.png)

    - **步骤8**

    你可以根据需要创建任意数量的新账户，还可以在需要时切换账户。我们建议仅保留一个可以安装新软件的账户，这样你就能清楚掌握系统中安装的所有程序。

    ![](img/6103e44aa372eb088d684690786bde89_38_3.png)


    ## 命令行创建账户

    顾名思义，你也可以通过命令行创建新用户。在主导（你的）管理员账户下打开终端会话。

    - **步骤1**

    通过命令行添加新用户的过程非常简单。首先输入：`sudo adduser <username>`，其中`<username>`为新用户的登录名。之后系统会要求你为该用户设置密码，同时填写全名和其他相关信息。输入y确认信息即可完成用户账户的创建。

    ![](img/6103e44aa372eb088d684690786bde89_38_4.png)

    - **步骤2**

    你可以在用户和组控制台中查看新用户的详细信息和账户类型。如果你想删除Linux Mint中的用户，可以在终端中输入：`sudo deluser <username>`，也可以在用户和组控制台中点击删除按钮。

    ![](img/6103e44aa372eb088d684690786bde89_38_5.png)

    '
