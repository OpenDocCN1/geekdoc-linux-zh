  md: '# Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # FROM THE SOURCE


    The commands you''ll need to become familiar with here are Configure, Make and
    Install. You''ll find a lot of apps use installing from source, so it''s certainly
    a skill worth investing time in.


    # STEP 1


    Source code files for Linux usually come in the form of .TAR.GZ or .TAR.BZ2. Both
    are compressed files holding all the core files needed to ''make'' the app. Start
    off this tutorial by creating a new folder in Home: mkdir Vim.


    ![](img/6103e44aa372eb088d684690786bde89_51_0.png)


    # STEP 2


    Vim, by the way, is an advanced text editor which we''ll use as an example to
    install. Enter the new folder, cd Vim, then from within the new Vim folder, enter
    the following command into the Terminal: wget ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2.


    ![](img/6103e44aa372eb088d684690786bde89_51_1.png)


    # STEP 3


    The wget command retrieves content from the internet, in this case the .BZ2 file
    for Vim. To check the file was downloaded successfully, enter: ls. According to
    Mint''s file system colour key, the compressed file should be displayed in red.


    ![](img/6103e44aa372eb088d684690786bde89_51_2.png)


    # STEP 4


    We need to uncompress the contents of the file now, so enter: tar -xf vim-7.4.tar.bz2
    into the Terminal. Note: you can type in tar -xf v and press the Tab key to auto-fill
    the remaining file name.


    ![](img/6103e44aa372eb088d684690786bde89_51_3.png)'
