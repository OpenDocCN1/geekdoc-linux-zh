    \ ![](img/6103e44aa372eb088d684690786bde89_4_5.png)\n> “你怎么对计算机懂得这么多？” “我其实不懂，这是我用的第一台。”\
    \ —— 格蕾丝·霍珀海军上将（编程先驱）接受大卫·莱特曼采访时说\n## 初识Linux![](img/6103e44aa372eb088d684690786bde89_6_0.png)\n\
    什么是Linux？它是什么？在哪里可以获取？为什么有这么多不同的版本？大多数初学者在入门时都会提出这些问题，甚至更多疑问。\n没错，Linux是一款功能极其强大、兼容性极高的操作系统，但要从哪里入手呢？\n\
    幸运的是，你可以在本节中找到答案。\n用Linux可以完成的事情非常多，但你首先需要知道从何开始；我们在这里为你提供帮助。\n在本节中，你将了解什么是Linux、什么是发行版（distro）、什么是桌面环境。\n\
    你也可以开始探索Linux的运行原理，以及它能为你带来哪些便利。\n![](img/6103e44aa372eb088d684690786bde89_6_1.png)\n\
    ## 为何选择Linux？\n### 免费且开放\n对于许多用户来说，Linux意味着自由：不受其他操作系统“围墙花园”模式的束缚，可以自由修改、按需使用操作系统，也无需承担任何形式的许可费用或付费要求。\n\
    不过，Linux的优势远不止这些。\n对于想要尝试不同选择的人来说，Linux是非常合适的选择。\n系统的高效性、丰富的应用资源以及稳定性，都足以成为你选择它的理由。\n\
    首先你需要了解的是：并不存在一个名为“Linux”的操作系统。\nLinux实际上是操作系统的内核，是操作系统的核心组成部分。\n我们和他人提到“Linux”时，指的其实是使用Linux内核的众多发行版（distro）中的某一个。\n\
    想必你至少听说过时下流行的某款发行版：Ubuntu、Linux Mint、Fedora、openSUSE、Debian、Raspbian，这样的名单还有很长。\n\
    每一款发行版都为用户提供略有不同的使用体验。\n虽然它们的核心都是Linux内核，但提供给用户的桌面环境外观、预装应用、系统更新方式、额外应用安装流程以及整体系统的视觉与使用体验都有所区别。\n\
    但它们的核心始终是Linux，这也是我们统称它们为“Linux”的原因。\nLinux的运行方式与Windows或macOS有相当大的差异。\n首先它是免费的：你可以免费下载，可以随意在任意多台电脑上安装，可以无限期免费使用，还可以通过同样免费的程序和应用对系统进行免费升级和扩展。\n\
    免费使用这一点对开发者而言是最大的吸引力之一。\nWindows许可证最高可达100英镑，Mac的价格则更高；而无论是开发者、游戏玩家，还是想要将旧电脑重新利用的用户，都可以在几分钟内快速下载一款发行版并投入使用。\n\
    除了免费之外，Linux还赋予用户自定义和改造系统来满足自身需求的自由度。\n互联网上的每款发行版都有其独特的定位：有的侧重提升安全性，有的主打精美的桌面外观，有的专为游戏优化，还有的针对学生群体设计。\n\
    Linux是非常适合入门编程的操作系统。\n![](img/6103e44aa372eb088d684690786bde89_7_0.png)\n```cpp\n\
    #include <iostream>\nint main() {\n //My first C++ Program\n std::cout << \"Hello\
    \ World!\\n\";\n return 0;\n}\n```\n![](img/6103e44aa372eb088d684690786bde89_8_0.png)\
    \ ![](img/6103e44aa372eb088d684690786bde89_8_1.png)\n### Linux下有数千款面向程序员的免费软件包。\n\
    ### 每款发行版都为用户提供独特的功能，但核心都是Linux。\n这种可扩展性让Linux成为更具吸引力的使用平台：你可以快速将系统改造为开发环境，集成适用于Python、Web开发、C++、Java等领域的各类集成开发环境（IDE）；也可以将其搭建为线上匿名服务器、Minecraft服务器、媒体中心等，功能多种多样。\n\
    那些不愿意使用最新版Windows或macOS的用户，无需丢弃旧电脑，只需安装Linux发行版即可重新利用旧设备。\n不过，Linux支持的不仅仅是C++、Python或其他热门编程语言。\n\
    使用Linux的命令行（也称为终端），你可以创建Shell脚本：这是一种专为命令行运行设计的程序，由脚本语言编写而成，主要用于自动化任务，或为特定操作提供输入输出功能。\n\
    对于想学习编程的人来说，Linux还有一个突出优势：它预装了大部分主流编程环境。\n绝大多数可用的Linux发行版都预装了Python和C++，这意味着你只要安装好系统、首次启动后就可以几乎立刻开始编程。\n\
    最后，尽管我们还可以列举出更多优势，但目前已经有成千上万的免费程序和应用程序，几乎覆盖了计算机使用的所有领域。\n这些程序被称为软件包，截至本文撰写时，仅Linux\
    \ Mint就拥有超过8700款专门的编程应用，总软件包数量更是达到62000余款，覆盖从业余无线电到万维网工具的各类需求。\n总体而言，Linux占用的系统资源远少于Windows或macOS；我们所说的系统资源包括内存、硬盘空间和CPU负载。\n\
    Linux的代码经过了精简，没有第三方“臃肿软件”占用系统资源。\n更高效的系统自然意味着编码测试环境和你最终开发出的程序可以获得更多可用资源。\n更少的资源占用也意味着你可以在普通运行吃力甚至已被淘汰的老旧硬件上使用Linux。\n\
    因此，Linux是非常优秀的编程资源和环境。\n它非常适合开发者使用，也在不断改进和迭代。\n如果你真心想入门编程，或者只是想尝试新事物，不妨试试Linux，看看它是否适合你。\n\
    ![](img/6103e44aa372eb088d684690786bde89_8_2.png) ![](img/6103e44aa372eb088d684690786bde89_8_3.png)\n"
