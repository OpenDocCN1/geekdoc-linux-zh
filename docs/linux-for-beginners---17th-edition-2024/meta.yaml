    ## 创建备份任务脚本

    Bash脚本最常用的应用场景之一就是创建备份流程，这类脚本既能自动化执行备份任务，也支持自定义各类配置。

    #### 步骤1

    一份最基础的备份脚本大致如下：首先写入`#!/bin/bash`，接下来写入`tar cvfz ~/backups/my-backup.tgz ~/Documents/`。该命令会对~/Documents文件夹及其中的所有内容创建压缩备份文件，并将其存放在名为/backups的文件夹中，文件名为my-backup.tgz。

    ![](img/6103e44aa372eb088d684690786bde89_74_0.png)

    #### 步骤2

    这份基础的备份脚本本身已经能正常运行，但我们可以让它更具交互性。首先从定义变量开始，把截图中的内容输入到新建的backup.sh脚本中。注意我们把''source''故意拼错为''sauce''，因为系统中已经有一个名为''source''的内置命令，所以我们需要用不同的拼写来避免冲突。

    ![](img/6103e44aa372eb088d684690786bde89_74_2.png)

    #### 步骤3

    之前写入的脚本内容已经可以生成时间戳，这样你就能知道备份的创建时间。另外你也定义了''dest''变量，它的值是备份文件的存放路径（~/backups）。现在你可以添加一段代码，先检查~/backups文件夹是否存在，如果不存在就自动创建该文件夹。

    ![](img/6103e44aa372eb088d684690786bde89_74_4.png)

    #### 步骤4

    ~/backups文件夹创建完成后，我们就可以根据最开始设置的时间戳变量，在其中创建新的子文件夹。添加代码`mkdir -p $dest/"$day $month
    $year"`，后续对应日/月/年的备份文件都会存放在这个子文件夹中。

    ![](img/6103e44aa372eb088d684690786bde89_74_1.png)

    #### 步骤5

    所有前置配置都完成后，现在可以写入实际的备份执行逻辑，基于第1步中的Tar命令，结合我们定义的变量，最终代码如下：`tar cvfz $dest/"$day
    $month $year"/DocumentsBackup.tgz $sauce`。截图中我们还添加了一条实用的echo命令，输出"Now backing
    up..."提示用户正在备份。

    ![](img/6103e44aa372eb088d684690786bde89_74_3.png)

    #### 步骤6

    最后你可以添加一条友好的提示信息：`echo "Backup complete. All done..."`。完整的脚本并不复杂，你可以轻松自定义，加入主目录下的任意文件夹，甚至整个主目录作为备份对象。

    ![](img/6103e44aa372eb088d684690786bde89_74_5.png)

    ## 创建Bash脚本 – 第5部分

    我们之前学习的备份脚本还可以进一步修改，加入选择分支、用户交互功能，比如让用户选择备份文件的存放路径等。自动化执行任务是Bash脚本的核心优势之一，简单的脚本也能在诸多场景下帮到你。

    ### 轻松自动化与实用脚本

    如果你需要逐行输入命令来获取系统信息、查找文件或批量重命名文件，脚本显然是更好的选择。

    #### 步骤1

    我们先从创建一个用于显示Linux Mint系统信息的脚本开始，这类脚本非常实用。新建一个名为**sysinfo.sh**的脚本，把以下内容输入到Xed编辑器，或者你常用的任意文本编辑器中。

    ```bash

    #!/bin/bash

    # -Hostname information:

    echo -e "\e[31;43m***** HOSTNAME INFORMATION *****\e[0m"

    hostname

    echo

    # -File system disk space usage:

    echo -e "\e[31;43m***** FILE SYSTEM DISK SPACE USE *****\e[0m"

    df -h

    echo

    # -Free and used memory:

    echo -e "\e[31;43m***** FREE AND USED MEMORY *****\e[0m"

    free

    echo

    # -System uptime and performance load:

    echo -e "\e[31;43m***** SYSTEM UPTIME AND LOAD *****\e[0m"

    uptime

    echo

    # -Users currently logged in:

    echo -e "\e[31;43m***** CURRENT USERS *****\e[0m"

    who

    echo

    # -Top five processes being used by the system:

    echo -e "\e[31;43m***** TOP 5 MEMORY CONSUMING PROCESSES *****\e[0m"

    ps -eo %mem,pcpu,comm --sort=-%mem | head -n 6

    echo

    echo -e "\e[1;32mDone.\e[0m"

    ```

    #### 步骤2

    这个脚本里我们用到了几个额外命令。首先是echo命令的-e扩展参数，开启该参数后，echo会识别额外的换行符以及其他特殊字符。后续的''31;43m''参数用于设置前景色和背景色。

    ```bash

    david@david-mint ~/scripts $ ./sysinfo.sh

    ********** HOSTNAME INFORMATION **********

    Static hostname: david-mint

    Icon name: computer-vm

    Chassis: v

    Machine ID: Sab3c275b7304ed3b8aeef9ffcc37eb4

    Boot ID: 61c1baadf934f649c5ac809abe7e18

    Virtualization: oracle

    Operating System: Linux Mint 18.1

    Kernel: Linux 4.4.0-53-generic

    Architecture: x86-64

    ********* FILE SYSTEM DISK SPACE USE ********

    ```

    #### 步骤3

    每个模块都运行不同的终端命令，将结果输出到对应标题下方。你可以加入更多内容，比如系统当前使用的别名、当前时间日期等。另外你也可以把这些信息都导入到一个实用的HTML文件中，之后就可以直接在浏览器中查看。

