    # Creating Bash Scripts – Part 3


    In the previous pages we looked at some very basic Bash scripting, which involved
    outputting text to the screen, getting a user''s input, storing it and outputting
    that to the screen; as well as including a system variable using the Date command.
    Now let''s combine what you''ve achieved so far and introduce Loops.


    # IF, THEN, ELSE


    With most programming structures there will come a time where you need to loop
    through the commands you''ve entered to create better functionality, and ultimately
    a better program.


    **STEP 1** Let''s look at the IF, Then and Else statements now, which when executed
    correctly, compare a set of instructions and simply work out that IF something
    is present, THEN do something, ELSE do something different. Create a new script
    called greeting2.sh and enter the text in the screenshot below into it.


    ![](img/6103e44aa372eb088d684690786bde89_71_0.png)


    **STEP 3** The next line, ELSE, is what happens if the variable doesn''t equal
    ''David''. In this case it simply outputs to the screen the now familiar ''Hello...''.
    The last line, the FI statement, is the command that will end the loop. If you
    have an IF command without a Fi command, then you get an error.


    ![](img/6103e44aa372eb088d684690786bde89_71_1.png)


    **STEP 2** Greeting2.sh is a copy of greeting.sh but with a slight difference.
    Here we''ve added a loop starting at the if statement. This means, IF the variable
    entered is equal to David the next line, THEN, is the reaction to what happens,
    in this case it will output to the screen ''Awesome name,'' followed by the variable
    (which is David).


    ![](img/6103e44aa372eb088d684690786bde89_71_2.png)


    **STEP 4** You can obviously play around with the script a little, changing the
    name variable that triggers a response; or maybe even issuing a response where
    the first name and surname variables match a specific variable.


    ![](img/6103e44aa372eb088d684690786bde89_71_3.png)'
  - '[PAGE 72]


    # ## MORE LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    # ## STEP 1


    Create a new script called count.sh. Enter the text in the screenshot below, save
    it and make it executable. This creates the variable ''count'' which at the beginning
    of the script equals zero. Then start the WHILE loop, which WHILE count is less
    than (the LT part) 100 will print the current value of count in the echo command.


    ![](img/6103e44aa372eb088d684690786bde89_72_0.png)


    # ## STEP 4


    The UNTIL loop works much the same way as the WHILE loop only, more often than
    not, in reverse. So our counting to a hundred, using UNTIL, would be: until [
    $count -gt 100 ]; do. The difference being, UNTIL count is greater than (the gt
    part) one hundred, keep on looping.


    ![](img/6103e44aa372eb088d684690786bde89_72_1.png)


    # ## STEP 2


    Executing the count.sh script will result in the numbers 0 to 99 listing down
    the Terminal screen; when it reaches 100 the script will end. Modifying the script
    with the FOR statement, makes it work in much the same way. To use it in our script,
    enter the text from the screenshot into the count.sh script.


    ![](img/6103e44aa372eb088d684690786bde89_72_2.png)


    # ## STEP 5


    You''re not limited to numbers zero to one hundred. You can, within the loop,
    have whatever set of commands you like and execute them as many times as you want
    the loop to run for. Renaming a million files, creating fifty folders etc. For
    example, this script will create ten folders named folder1 through to folder10
    using the FOR loop.


    ![](img/6103e44aa372eb088d684690786bde89_72_3.png)


    # ## STEP 3


    The addition we have here is: for count in {0..100}; do. Which means: FOR the
    variable ''count'' IN the numbers from zero to one hundred, then start the loop.
    The rest of the script is the same. Run this script, and the same output should
    appear in the Terminal.


    ![](img/6103e44aa372eb088d684690786bde89_72_4.png)


    # ## STEP 6


    Using the FOR statement once more, we can execute the counting sequence by manipulating
    the {0..100} part. This section of the code actually means {START..END..INCREMENT},
    if there''s no increment then it''s just a single digit up to the END. For example,
    we could get the loops to count up to 1000 in two''s with: for count in {0..1000..2};
    do.


    ![](img/6103e44aa372eb088d684690786bde89_72_5.png)'
- md: '## Creating Bash Scripts – Part 4


    You''ve encountered user interaction with your scripts, asking what the user''s
    name is and so on. You''ve also looked at creating loops within the script to
    either count or simply do something several times. Let''s combine and expand some
    more.


    ### CHOICES AND LOOPS


    Let''s bring in another command, CHOICE, along with some nested IF and ELSE statements.
    Start by creating a new script called *mychoice.sh*.


    #### STEP 1


    The mychoice.sh script is beginning to look a lot more complex. What we have here
    is a list of four choices, with three possible options. The options: Mint, Is,
    and Awesome will be displayed if the user presses the correct option key. If not,
    then the menu will reappear, the fourth choice.


    ![](img/6103e44aa372eb088d684690786bde89_73_0.png)


    #### STEP 2


    If you follow the script through you soon get the hang of what''s going on, based
    on what we''ve already covered. WHILE, IF, and ELSE, with the FI closing loop
    statement will run through the options and bring you back to the start if you
    pick the wrong option.


    ![](img/6103e44aa372eb088d684690786bde89_73_2.png)


    #### STEP 3


    You can, of course, increase the number of choices but you need to make sure that
    you match the number of choices to the number of IF statements. The script can
    quickly become a very busy screen to look at. This lengthy script is another way
    of displaying a menu, this time with a fancy colour scheme too.


    ![](img/6103e44aa372eb088d684690786bde89_73_1.png)


    #### STEP 4


    You can use the arrow keys and Enter in the menu setup in the script. Each choice
    is an external command that feeds back various information. Play around with the
    commands and choices, and see what you can come up with. It''s a bit beyond what
    we''ve looked at but it gives a good idea of what can be achieved.


    ![](img/6103e44aa372eb088d684690786bde89_73_3.png)


    ## CREATING A BACKUP TASK SCRIPT


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, one that automates the task as well as adding some customisations along
    the way.


    #### STEP 1


    A very basic backup script would look something along the lines of: `#!/bin/bash`,
    then, `tar cvfz ~/backups/my-backup.tgz ~/Documents/`. This will create a compressed
    file backup of the ~/Documents folder, with everything in it, and put it in a
    folder called /backups with the name my-backup.tgz.


    ![](img/6103e44aa372eb088d684690786bde89_74_0.png)


    #### STEP 2


    While perfectly fine, we can make the simple script a lot more interactive. Let''s
    begin with defining some variables. Enter the text in the screenshot into a new
    backup.sh script. Notice that we''ve misspelt ''source'' as ''sauce'', this is
    because there''s already a built-in command called ''source'' hence the different
    spelling on our part.


    ![](img/6103e44aa372eb088d684690786bde89_74_2.png)


    #### STEP 3


    The previous script entries allowed you to create a Time Stamp, so you know when
    the backup was taken. You also created a ''dest'' variable, which is the folder
    where the backup file will be created (~/backups). You can now add a section of
    code to first check if the ~/backups folder exists, if not, then it creates one.


    ![](img/6103e44aa372eb088d684690786bde89_74_4.png)


    #### STEP 4


    Once the ~/backups folder is created, we can now create a new subfolder within
    it based on the Time Stamp variables you set up at the beginning. Add `mkdir -p
    $dest/"$day $month $year"`. It''s in here that you put the backup file relevant
    to that day/month/year.


    ![](img/6103e44aa372eb088d684690786bde89_74_1.png)


    #### STEP 5


    With everything in place, you can now enter the actual backup routine, based on
    the Tar command from Step 1. Combined with the variables, you have: `tar cvfz
    $dest/"$day $month $year"/DocumentsBackup.tgz $sauce`. In the screenshot, we added
    a handy "Now backing up..." echo command.


    ![](img/6103e44aa372eb088d684690786bde89_74_3.png)


    #### STEP 6


    Finally, you can add a friendly message: `echo "Backup complete. All done..."`.
    The completed script isn''t too over-complex and it can be easily customised to
    include any folder within your Home area, as well as the entire Home area itself.


    ![](img/6103e44aa372eb088d684690786bde89_74_5.png)


    ## Creating Bash Scripts – Part 5


    The backup script we looked at previously can be further amended to incorporate
    choices, user-interaction with regards to where the backup file will be copied
    to and so on. Automating tasks is one of the main benefits of Bash scripting,
    a simple script can help you out in many ways.


    ### EASY AUTOMATION AND HANDY SCRIPTS


    Entering line after line of commands to retrieve system information, find a file
    or rename a batch of files? A script is a better answer.


    #### STEP 1


    Let''s start by creating a script to help display the Mint system information;
    always a handy thing to have. Create a new script called **sysinfo.sh** and enter
    the following into Xed, or the text editor of your choice.


    ```bash

    #!/bin/bash

    # -Hostname information:

    echo -e "\e[31;43m***** HOSTNAME INFORMATION *****\e[0m"

    hostname

    echo

    # -File system disk space usage:

    echo -e "\e[31;43m***** FILE SYSTEM DISK SPACE USE *****\e[0m"

    df -h

    echo

    # -Free and used memory:

    echo -e "\e[31;43m***** FREE AND USED MEMORY *****\e[0m"

    free

    echo

    # -System uptime and performance load:

    echo -e "\e[31;43m***** SYSTEM UPTIME AND LOAD *****\e[0m"

    uptime

    echo

    # -Users currently logged in:

    echo -e "\e[31;43m***** CURRENT USERS *****\e[0m"

    who

    echo

    # -Top five processes being used by the system:

    echo -e "\e[31;43m***** TOP 5 MEMORY CONSUMING PROCESSES *****\e[0m"

    ps -eo %mem,pcpu,comm --sort=-%mem | head -n 6

    echo

    echo -e "\e[1;32mDone.\e[0m"

    ```


    #### STEP 2


    We''ve included a couple of extra commands in this script. The first is the -e
    extension for echo, which means it''ll enable echo interpretation of additional
    instances of a new line, as well as other special characters. The proceeding ''31;43m''
    element enables colour for foreground and background.


    ```bash

    david@david-mint ~/scripts $ ./sysinfo.sh

    ********** HOSTNAME INFORMATION **********

    Static hostname: david-mint

    Icon name: computer-vm

    Chassis: v

    Machine ID: Sab3c275b7304ed3b8aeef9ffcc37eb4

    Boot ID: 61c1baadf934f649c5ac809abe7e18

    Virtualization: oracle

    Operating System: Linux Mint 18.1

    Kernel: Linux 4.4.0-53-generic

    Architecture: x86-64

    ********* FILE SYSTEM DISK SPACE USE ********

    ```


    #### STEP 3


    Each of the sections runs a different Terminal command, outputting the results
    under the appropriate heading. You can include a lot more, such as the current
    aliases being used in the system, the current time and date and so on. Plus, you
    could also pipe all that information into a handy HTML file, ready to be viewed
    in a browser.


    ![](img/6103e44aa372eb088d684690786bde89_75_0.png)


    #### STEP 4


    Although there are simple Terminal commands to help you look for a particular
    file or folder, it''s often more fun to create a script to help you. Plus, you
    can use that script for other non-technical users. Create a new script called
    **look4.sh**, entering the content from the screenshot below.


    ![](img/6103e44aa372eb088d684690786bde89_75_1.png)


    #### STEP 5


    When executed the script waits for input from the user, in this case the file
    extension, such as jpg, mp4 and so on. It''s not very friendly though. Let''s
    make it a little friendlier. Add an echo, with: `echo -n "Please enter the extension
    of the file you''re looking for: "` just before the `read` command.


    ![](img/6103e44aa372eb088d684690786bde89_76_0.png)


    #### STEP 6


    Here''s an interesting, fun kind of script using the app espeak. Install espeak
    with `sudo apt-get install espeak`, then enter the text below into a new script
    called speak.sh. As you can see it''s a rehash of the first greeting script we
    ran. Only this time, it uses the variables in the espeak output.


    ![](img/6103e44aa372eb088d684690786bde89_76_1.png)


    #### STEP 7


    We briefly looked at putting some colours in the output for our scripts. Whilst
    it''s too long to dig a little deeper into the colour options, here''s a script
    that outputs what''s available. Create a new script called colours.sh and enter
    the text (see below) into it.


    ![](img/6103e44aa372eb088d684690786bde89_76_2.png)


    #### STEP 8


    The output from colours.sh can, of course, be mixed together, bringing different
    effects depending on what you want the output to say. For example, white text
    in a red background flashing (or blinking). Sadly the blinking effect doesn''t
    work on all Terminals, so you may need to change to a different Terminal.


    ![](img/6103e44aa372eb088d684690786bde89_76_3.png)


    #### STEP 9


    Whilst we''re on making fancy scripts, how about using Zenity to output a graphical
    interface? Enter what you see below into a new script, mmenu.sh. Make it executable
    and then run it. You should have a couple of dialogue boxes appear, followed by
    a final message.


    ```bash

    firstname=$(zenity --entry --title="Your Name" --text="What is your first name?")

    surname=$(zenity --entry --title="Your Name" --text="What is your first surname?")

    zenity --info --title="Hello!" --text="Welcome to Linux Mint.\n\n Have fun, $firstname
    $surname."

    ```


    #### STEP 10


    While gaming in a Bash script isn''t something that''s often touched upon, it
    is entirely possible, albeit, a little basic. Movement-based games are difficult,
    and sometimes buggy, however a good text adventure, or Fighting Fantasy type game
    is a perfect choice for gaming in the Terminal. Give it a go, and let us know
    how you get on.


    ![](img/6103e44aa372eb088d684690786bde89_76_4.png)'
