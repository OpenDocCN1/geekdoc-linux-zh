    #### 步骤9

    既然我们在做花里胡哨的脚本，不如试试用Zenity来生成图形化界面？把下面内容输入到新建的mmenu.sh脚本中，给脚本添加可执行权限后运行，你会看到几个对话框依次弹出，最后会显示一条提示信息。

