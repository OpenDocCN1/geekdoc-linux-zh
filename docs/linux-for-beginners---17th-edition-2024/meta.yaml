    \ this will work even for keyboard\n * interrupts. We know interrupts aren't enabled\
    \ when getting a keyboard\n * interrupt, as we use trap-gates. Hopefully all is\
    \ well.\n */\n#include <linux/sched.h>\n#include <linux/tty.h>\n#include <asm/io.h>\n\
    #include <asm/system.h>\n#define SCREEN_START 0xb8000\n#define SCREEN_END 0xc0000\n\
