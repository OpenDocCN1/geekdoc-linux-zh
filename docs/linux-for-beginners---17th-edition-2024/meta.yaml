    Calibrating delay using timer specific routine... 4047.64 BogoMIPS (lpj=20238210)\n\
    ```\n![](img/6103e44aa372eb088d684690786bde89_54_0.png)\n## Linux Kernel 0.01\n\
    ![](img/6103e44aa372eb088d684690786bde89_54_1.png)\n```\n/*\n * console.c\n *\n\
    \ * This module implements the console io functions\n * 'void con_init(void)'\n\
