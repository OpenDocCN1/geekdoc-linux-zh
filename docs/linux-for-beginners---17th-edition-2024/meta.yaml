    ![](img/6103e44aa372eb088d684690786bde89_44_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_44_1.png)


    # # Using the Terminal


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII camp fire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code intricate automated scripts.


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux file system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.'
  - '[PAGE 45]


    Using the Terminal


    # Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    +   **STEP 1** The Terminal can be accessed by either clicking on the Terminal
    icon on the Panel, located between the Firefox and files icons or launched by
    opening the Menu and selecting it from the left-hand quick launch strip.


    ![](img/6103e44aa372eb088d684690786bde89_45_0.png)


    +   **STEP 2** The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    including the desktop and GUI, is a module running from the command line.


    ![](img/6103e44aa372eb088d684690786bde89_45_1.png)


    +   **STEP 3** What you currently see in the Terminal is your login name followed
    by the name of the computer; as you named it during setup when you first installed
    Mint. The line then ends with the current folder name; at first this is just a
    tilde ~, which means your Home folder.


    ![](img/6103e44aa372eb088d684690786bde89_45_2.png)


    +   **STEP 4** The flashing cursor at the very end of the line is where your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (`pwd`), which outputs the current folder you''re in to the
    screen. Type `pwd` and press Enter.


    ![](img/6103e44aa372eb088d684690786bde89_45_3.png)'
  - '[PAGE 46]


    # ## Basics of the Terminal


    ![](img/6103e44aa372eb088d684690786bde89_46_0.png)


    # **STEP 5**


    All the commands you enter work in the same manner: you enter the command, include
    any parameters to extend the use of the command and press Enter to execute the
    command line you''ve entered. Type into the Terminal: `uname -a` and press Enter.
    This displays some system information regarding Mint.


    ![](img/6103e44aa372eb088d684690786bde89_46_1.png)


    # **STEP 6**


    Before we get into entering commands, let''s take a moment to see what menus the
    Terminal has to offer. The File menu option allows you to open a new Terminal,
    create a new profile, where you can alter the size, colours and behaviour of the
    Terminal, add a new tab, and close all current active Terminal sessions.


    ![](img/6103e44aa372eb088d684690786bde89_46_2.png)


    # **STEP 7**


    The Edit option lets you copy and paste commands to and from the Terminal and
    other sources; handy for when you want to copy a very long and complex command
    from a web page. It also allows you to edit the current profile preferences.


    ![](img/6103e44aa372eb088d684690786bde89_46_3.png)


    # **STEP 8**


    View and Search options let you alter the sizing of the Terminal window and of
    course search within the Terminal for any particular key words.


    ![](img/6103e44aa372eb088d684690786bde89_46_4.png)


    # **STEP 9**


    The Terminal entry extends the profile editing and sizing and allows you to alter
    the character encoding. Interestingly, you can also set it to a Read Only mode,
    which stops you from entering any commands into the Terminal; this is good for
    when you need to permanently display the Terminal contents.


    ![](img/6103e44aa372eb088d684690786bde89_46_5.png)


    # **STEP 10**


    Finally, the Help option displays the help contents and version number of the
    Terminal, or to be more precise, GNOME Terminal; we''ll simply refer to it as
    Terminal in future. The Contents are worth having a quick read through, to help
    familiarise yourself with how the Terminal works.


    ![](img/6103e44aa372eb088d684690786bde89_46_6.png)'
  - '[PAGE 47]


    # Update Mint via the Terminal


    Up to now you''ve been using the shield icon to launch Mint Update Manager in
    order to update the system and upgrade the currently installed apps, tools and
    other elements. However, you can also accomplish a complete system update and
    upgrade from the Terminal.


    # USING APT-GET


    To update and upgrade via the Terminal you use the APT (Advanced Packaging Tool)
    command. It''s a powerful command and combines different elements depending on
    its use.


    # STEP 1


    Start by opening a new Terminal or if you already have one opened clear its contents
    with the clear command. This starts you off with a clean slate on which to work.


    ![](img/6103e44aa372eb088d684690786bde89_47_0.png)


    # STEP 3


    Apt-get is used to update and upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new package
    lists and updates the list of source files. Upgrade downloads and performs an
    upgrade to the latest versions of those files. To start the entire Upgrade and
    Update process, enter: sudo apt-get update, followed by your password.


    ![](img/6103e44aa372eb088d684690786bde89_47_1.png)


    # STEP 2


    Enter: apt-get into the Terminal. This brings up a list of the most used apt-get
    commands, along with a brief description of what the command does. It''s worth
    having a look at, even if it doesn''t make a huge amount of sense at this time.


    ![](img/6103e44aa372eb088d684690786bde89_47_2.png)


    # STEP 4


    Notice now the addition of the sudo command. The sudo command once meant Super
    User Do; these days it''s more acceptable as Substitute User Do. It means that
    the administrative user (Super User) uses APT (Advanced Packaging Tool) to Get
    any Updates. Now try this: sudo apt-get upgrade.


    ![](img/6103e44aa372eb088d684690786bde89_47_3.png)'
  - '[PAGE 48]


    # Update Mint via the Terminal


    # STEP 5


    Depending on the state of your updates, if you have any waiting to be installed,
    you might be asked if you want to apply the results of the **sudo apt-get upgrade**
    command. You can press y to accept and continue. What''s happening here is that
    apt-get has some updated software to apply to Mint, and you''re oyaking the action.


    ![](img/6103e44aa372eb088d684690786bde89_48_0.png)


    # STEP 7


    Essentially, that''s it, your system is now up to date according to the available
    list of packages from the apt-get update command. You can run through the process
    one more time, just to check if everything went okay. To recap, enter: **sudo
    apt-get update**, press **Enter**, then type: **sudo apt-get upgrade** and press
    **Enter**.


    ![](img/6103e44aa372eb088d684690786bde89_48_1.png)


    # STEP 6


    There''s likely to be a long list of what seems gibberish now filling your Terminal
    window but don''t worry. The files necessary for the upgrade have been downloaded,
    prepared, unpacked, processed, installed and set up correctly. There''s a lot
    going on when you perform an upgrade, even with the smallest package.


    ![](img/6103e44aa372eb088d684690786bde89_48_2.png)


    # STEP 8


    Interestingly, Linux Mint, among other distros, offers you the ability to chain
    several commands together, In this example, therefore, we can use **sudo apt-get
    update && sudo apt-get upgrade**. The double ampersand is what combines the commands
    and works perfectly, providing the preceding command went without a hitch. It''s
    recommended to start any session with the update and upgrade combo.


    ![](img/6103e44aa372eb088d684690786bde89_48_3.png)


    # TERMINAL VS UPDATE MANAGER?


    Why use the Terminal to update and upgrade over the Update Manager, regardless
    of the distro you''re using? Some users greatly prefer using the Terminal to update
    their Linux systems and accompanying apps, in the belief that it''s better. However,
    that''s not often the case.


    Using the Terminal, apt-get upgrade, doesn''t handle changing dependencies between
    versions of packages, so if a package has its dependent files changed from one
    version to another, then the upgrade is held back.


    The Update Manager, or Software Manager (depending on the distro), often phases
    its updates and marks those packages with changed dependencies for updating. However,
    and this is where Linux can often get confusing, sometimes it doesn''t.


    It all boils down to the developer of the package being updated and the way the
    package is held in the distro''s repositories and whether the update is classified
    as stable or not. In essence, from the point of view of the user, if you update
    and upgrade using both the Terminal and the Update Manager regularly, then you
    will be as up to date as possible, and get the essential and necessary stable
    versions of the packages and core software. If you''re looking for cutting edge
    package updates, then it''s best to opt for a rolling release distro instead.'
- md: '## Install Apps via the Terminal – Part 1

    ### COMMAND LINE INSTALLS

    - **STEP 1** Installing apps from the Terminal is often relatively simple. First
    though, you need to make sure that the system is up to date. To do this open up
    the Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your
    password and accept any necessary updates.

    ![](img/6103e44aa372eb088d684690786bde89_49_0.png)

    - **STEP 2** Just as you''ve seen, `sudo apt-get update/upgrade` and so on are
    designed to upgrade the software that''s already installed on the system. How
    do you install more apps though? It just so happens that it''s extraordinarily
    simple. First you need an app to install, so let''s use Stella again. Enter: `sudo
    apt-get install stella`.

    ![](img/6103e44aa372eb088d684690786bde89_49_1.png)

    - **STEP 3** You need to enter y to confirm the installation, which takes up around
    5.5MB of storage in the system. Once Stella is installed, you can see again that
    Mint has automatically created the Games category in the Menu as well as the app
    shortcut.

    ![](img/6103e44aa372eb088d684690786bde89_49_2.png)

    - **STEP 4** Sometimes, when installing software, you need to add the app''s Repository.
    The repository, or repo, is simply the remote server location where the software
    is held, along with all its dependencies (the vital libraries and such it needs
    to function). Start by typing in this: `sudo add-apt-repository ppa:peterlevi/ppa`.
    Press Enter when asked to and add the PPA (Personal Package Archive).

    ![](img/6103e44aa372eb088d684690786bde89_49_3.png)

    - **STEP 5** This adds the repo for the app Variety Wallpaper Changer, an Ubuntu-based
    app that works in Mint and changes the wallpaper automatically. Now that the repo
    is added, enter: `sudo apt-get update`, to update the new information and add
    the contents of the repo to the package database.

    ![](img/6103e44aa372eb088d684690786bde89_50_0.png)

    - **STEP 6** Now to install Variety, enter: `sudo apt-get install variety`. Press
    y to confirm and accept the installation, and to continue with the install. Once
    installed, you can type `variety` into the Terminal to run the app.

    ![](img/6103e44aa372eb088d684690786bde89_50_1.png)


    ### REMOVING APPS

    In addition to installing apps, the apt command can also be used to remove any
    apps and helps keep the system tidy and free up resources.

    - **STEP 1** To uninstall, or remove, the Variety app enter the following: `sudo
    apt-get remove variety`. Enter y to continue with the uninstall of the app; notice
    also that you''re informed of how much space you''re freeing up on the hard drive
    as a result of removing the app.

    ![](img/6103e44aa372eb088d684690786bde89_50_2.png)

    - **STEP 2** While the ''apt-get remove'' command uninstalls an app, it doesn''t
    get rid of the extra clutter that comes with an app, such as configuration and
    library files. To completely remove the clutter, enter: `sudo apt-get purge variety`.

    ![](img/6103e44aa372eb088d684690786bde89_50_4.png)

    - **STEP 3** When you remove apps from the system you will be informed that some
    packages that were automatically installed are no longer required. You already
    saw in the previous tutorial, that you can tidy things up with the following command:
    `sudo apt-get autoremove`, followed by pressing y to accept the process.

    ![](img/6103e44aa372eb088d684690786bde89_50_3.png)

    - **STEP 4** Finally, to tidy up all the non-used packages in the system, and
    to remove elements that the autoremove command didn''t, you can enter: `sudo apt-get
    autoclean`. These last few steps are vital for keeping your Linux Mint setup in
    good working order and to trim off the unnecessary excess caused by installations
    and upgrades.

    ![](img/6103e44aa372eb088d684690786bde89_50_5.png)


    ## Install Apps via the Terminal – Part 2

    ![](img/6103e44aa372eb088d684690786bde89_52_0.png)

    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.

    ### FROM THE SOURCE

    The commands you''ll need to become familiar with here are Configure, Make and
    Install. You''ll find a lot of apps use installing from source, so it''s certainly
    a skill worth investing time in.

    - **STEP 1** Source code files for Linux usually come in the form of .TAR.GZ or
    .TAR.BZ2. Both are compressed files holding all the core files needed to ''make''
    the app. Start off this tutorial by creating a new folder in Home: `mkdir Vim`.

    ![](img/6103e44aa372eb088d684690786bde89_51_0.png)

    - **STEP 2** Vim, by the way, is an advanced text editor which we''ll use as an
    example to install. Enter the new folder, `cd Vim`, then from within the new Vim
    folder, enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2`.

    ![](img/6103e44aa372eb088d684690786bde89_51_1.png)

    - **STEP 3** The `wget` command retrieves content from the internet, in this case
    the .BZ2 file for Vim. To check the file was downloaded successfully, enter: `ls`.
    According to Mint''s file system colour key, the compressed file should be displayed
    in red.

    ![](img/6103e44aa372eb088d684690786bde89_51_2.png)

    - **STEP 4** We need to uncompress the contents of the file now, so enter: `tar
    -xf vim-7.4.tar.bz2` into the Terminal. Note: you can type in `tar -xf v` and
    press the Tab key to auto-fill the remaining file name.

    ![](img/6103e44aa372eb088d684690786bde89_51_3.png)

    - **STEP 5** If you enter `ls` again, you''ll notice that a new folder has been
    created: `vim74`; in light blue text representing a folder in Mint. It''s always
    handy to create root folders for the main app, then as you upgrade apps through
    this method the individual versions will each have their own folder.

    ![](img/6103e44aa372eb088d684690786bde89_52_1.png)

    - **STEP 6** Type in `cd vim74` to enter the folder, and `ls` again to view its
    contents. There will likely be a fair number of files present; most are the app''s
    core files, while others will be labelled `README` or `INSTALL`. It''s always
    wise to read these files first as they provide valuable information regarding
    the installation.

    ![](img/6103e44aa372eb088d684690786bde89_52_2.png)

    - **STEP 7** The first part of the installation requires you to enter `./configure`.
    The `./configure` command will check your system for any missing dependencies
    associated with the app. If you received an error regarding a C Compiler, then
    enter: `sudo apt-get install build-essential`. The third-party app Ncurses was
    recorded as missing. We need to install that with: `sudo apt-get install libncurses5-dev
    libncursesw5-dev`.

    ![](img/6103e44aa372eb088d684690786bde89_52_3.png)

    - **STEP 8** You may need to keep installing new dependencies, depending on the
    app. After each new dependency is installed, re-run `./configure` and when it
    doesn''t report back with an error you can continue to the next stage of the installation.
    Note: you may need to search online for some error messages.

    ![](img/6103e44aa372eb088d684690786bde89_52_4.png)

    - **STEP 9** With a successful `./configure`, the system will create a `Makefile`.
    This needs to be ''made'' by entering: `make` into the Terminal. This may take
    a while, depending on the size of the app.

    ![](img/6103e44aa372eb088d684690786bde89_52_5.png)

    - **STEP 10** Finally, you need to enter: `sudo make install` into the Terminal.
    This will install the app, and make it ready for use in the system. When complete
    you can execute the app, in this case by entering `vim` into the Terminal or searching
    for it via the Dash.

    ![](img/6103e44aa372eb088d684690786bde89_52_6.png)'
  mdcn: '

    ## 通过终端安装应用 – 第1部分

    ### 命令行安装

    - **第一步** 从终端安装应用通常比较简单。不过首先你需要确保系统已是最新版本。要做到这一点，请打开终端并输入：`sudo apt-get update
    && sudo apt-get upgrade`。输入你的密码，并接受所有必要的更新。 ![](img/6103e44aa372eb088d684690786bde89_49_0.png)

    - **第二步** 正如你所见，`sudo apt-get update/upgrade` 这类命令是用来升级系统中已经安装的软件的。那么要安装更多应用要怎么做呢？恰好非常简单。首先你需要一个要安装的应用，我们这里还是以Stella为例。请输入：`sudo
    apt-get install stella`。 ![](img/6103e44aa372eb088d684690786bde89_49_1.png)

    - **第三步** 你需要输入y确认安装，该应用会占用系统大约5.5MB的存储空间。Stella安装完成后，你会发现Mint已经在菜单中自动创建了“游戏”分类，以及对应的应用快捷方式。
    ![](img/6103e44aa372eb088d684690786bde89_49_2.png)

    - **第四步** 有时安装软件时，你需要添加应用的软件源（Repository，也简称repo）。软件源就是存放软件及其所有依赖项（应用运行所需的核心库等组件）的远程服务器位置。首先输入以下命令：`sudo
    add-apt-repository ppa:peterlevi/ppa`。当提示按下Enter键时按下它，即可添加该PPA（个人软件包存档，Personal
    Package Archive）。 ![](img/6103e44aa372eb088d684690786bde89_49_3.png)

    - **第五步** 这个命令添加的是Variety Wallpaper Changer（壁纸更换器）的软件源，这是一款基于Ubuntu开发、可在Mint中运行的应用，能够自动更换壁纸。软件源添加完成后，请输入：`sudo
    apt-get update`，来更新软件源信息，将其内容添加到包数据库中。 ![](img/6103e44aa372eb088d684690786bde89_50_0.png)

    - **第六步** 现在要安装Variety，请输入：`sudo apt-get install variety`。按下y确认并接受安装，继续完成安装流程。安装完成后，你可以在终端中输入`variety`来运行该应用。
    ![](img/6103e44aa372eb088d684690786bde89_50_1.png)


    ### 卸载应用

    除了安装应用外，apt命令还可以用于卸载任意应用，帮助保持系统整洁、释放资源。

    - **第一步** 要卸载Variety应用，请输入以下命令：`sudo apt-get remove variety`。输入y继续卸载应用；你还会注意到系统会提示你移除该应用后能在硬盘上释放多少存储空间。
    ![](img/6103e44aa372eb088d684690786bde89_50_2.png)

    - **第二步** 虽然`apt-get remove`命令可以卸载应用，但不会删除应用附带的多余文件，比如配置文件和库文件。要完全清理这些冗余文件，请输入：`sudo
    apt-get purge variety`。 ![](img/6103e44aa372eb088d684690786bde89_50_4.png)

    - **第三步** 从系统中移除应用时，系统会提示某些自动安装的软件包已不再需要。你在之前的教程中已经看到过，可以使用以下命令清理这些冗余包：`sudo apt-get
    autoremove`，之后按下y确认执行该操作。 ![](img/6103e44aa372eb088d684690786bde89_50_3.png)

    - **第四步** 最后，要清理系统中所有未使用的软件包，以及`autoremove`命令未删除的残留组件，你可以输入：`sudo apt-get autoclean`。最后这几个步骤对保持Linux
    Mint系统良好运行状态、清除安装和升级产生的多余冗余非常重要。 ![](img/6103e44aa372eb088d684690786bde89_50_5.png)


    ## 通过终端安装应用 – 第2部分

    ![](img/6103e44aa372eb088d684690786bde89_52_0.png)

    大多数时候，你可以使用标准的apt-get命令从终端安装应用。但有些时候，安装某些应用需要多做一些操作，也就是从源代码编译安装应用，这听起来可能让人畏惧，但实际上并没有那么难。

    ### 从源代码安装

    你需要熟悉的相关命令有Configure、Make和Install。你会发现很多应用都支持从源代码安装，这无疑是一项值得投入时间学习的技能。

    - **第一步** Linux系统的源代码文件通常以.TAR.GZ或.TAR.BZ2格式提供，二者都是压缩包，包含编译应用所需的所有核心文件。首先在本教程中，在Home目录下创建一个新文件夹：`mkdir
    Vim`。 ![](img/6103e44aa372eb088d684690786bde89_51_0.png)

    - **第二步** 顺便说一下，Vim是一款高级文本编辑器，我们将用它作为安装示例。进入刚创建的新文件夹，输入`cd Vim`，然后在Vim文件夹中输入以下终端命令：`wget
    ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2`。 ![](img/6103e44aa372eb088d684690786bde89_51_1.png)

    - **第三步** `wget`命令用于从互联网获取内容，本例中就是下载Vim的.BZ2压缩包。要检查文件是否下载成功，请输入：`ls`。根据Mint的文件系统颜色标识，压缩包会显示为红色。
    ![](img/6103e44aa372eb088d684690786bde89_51_2.png)

    - **第四步** 现在需要解压该压缩包，请在终端中输入：`tar -xf vim-7.4.tar.bz2`。提示：你可以输入`tar -xf v`后按下Tab键，自动补全剩余的文件名。
    ![](img/6103e44aa372eb088d684690786bde89_51_3.png)

    - **第五步** 再次输入`ls`，你会发现生成了一个新文件夹：`vim74`，在Mint中文件夹会以浅蓝色文本显示。为主应用创建独立的根文件夹是个好习惯，后续通过这种方式升级应用时，不同版本的应用会各自存放在对应的文件夹中。
    ![](img/6103e44aa372eb088d684690786bde89_52_1.png)

    - **第六步** 输入`cd vim74`进入该文件夹，再次输入`ls`查看其内容。里面通常会有大量文件，大部分是应用的核心文件，还有一些会被标记为`README`或`INSTALL`。最好先阅读这些文件，它们会提供和安装相关的有价值信息。
    ![](img/6103e44aa372eb088d684690786bde89_52_2.png)

    - **第七步** 安装的第一步需要你输入`./configure`。`./configure`命令会检查你的系统是否存在该应用关联的缺失依赖项。如果你收到关于C编译器的错误提示，请输入：`sudo
    apt-get install build-essential`。教程中提到缺失了第三方应用Ncurses，我们需要通过以下命令安装它：`sudo apt-get
    install libncurses5-dev libncursesw5-dev`。 ![](img/6103e44aa372eb088d684690786bde89_52_3.png)

    - **第八步** 根据应用的不同，你可能需要持续安装新的依赖项。每安装完一个依赖项后，重新运行`./configure`，当命令不再返回错误提示时，你就可以进入安装的下一个阶段。提示：部分错误提示你可能需要上网搜索解决方法。
    ![](img/6103e44aa372eb088d684690786bde89_52_4.png)

    - **第九步** 如果`./configure`执行成功，系统会生成一个`Makefile`文件。你需要在终端中输入`make`来执行构建操作，该操作的时间长短取决于应用的大小，可能需要等待一段时间。
    ![](img/6103e44aa372eb088d684690786bde89_52_5.png)

    - **第十步** 最后，你需要在终端中输入：`sudo make install`完成应用的安装，之后就可以在系统中使用该应用了。安装完成后，你可以通过在终端输入`vim`，或者通过Dash搜索来运行这款应用。
    ![](img/6103e44aa372eb088d684690786bde89_52_6.png)

