    ## 创建Bash脚本 – 第4部分

    你已经实现了脚本与用户的交互，比如询问用户姓名这类操作，也了解了如何在脚本中创建循环，无论是计数还是单纯重复执行某段操作多次。接下来我们把这两部分结合起来并进一步拓展。

    ### 选择分支与循环

    我们再引入一个新命令CHOICE，以及一些嵌套的IF和ELSE语句。首先创建一个名为*mychoice.sh*的新脚本。

    #### 步骤1

    mychoice.sh脚本已经开始变得复杂许多。这里的实现逻辑是提供4个选项，其中3个有效选项：当用户按下正确的选项键时，会显示对应的内容：Mint、Is和Awesome。如果按键不正确，菜单会重新出现，对应第四个选项。

