- md: '## The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    ### GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    read the instructions carefully.


    ### LINUX MINT


    By far the most popular Linux distro (distribution) is Linux Mint. Mint began
    life back in 2006, as an alternative to the then most popular distro, Ubuntu.
    Although based on Ubuntu''s Long Term Support build, Linux Mint took a different
    direction and offered the user a better overall experience. Linux Mint has three
    main desktop versions available with each new version of the core OS it releases.
    This may sound confusing at first but it''s quite simple. Currently, Linux Mint
    uses the Cinnamon Desktop Environment as its flagship model; there''s MATE and
    Xfce models available too. Cinnamon is a graphically rich desktop environment,
    MATE uses less fancy graphics, and is more stable on a wider variety of desktop
    systems, and Xfce is an extremely streamlined desktop environment that''s built
    for speed and ultimate stability. Throughout this title we''ll be using the Cinnamon
    version; however, you can try out any of the other desktop environments as you
    wish. In fact, it''s recommended that you do spend some time trying different
    environments, and even different distros, to see which suits you and your computer
    best.


    www.linuxmint.com


    ### UBUNTU


    The second most popular distro available is Ubuntu, which is an ancient African
    word meaning ''humanity to others''. Ubuntu''s popularity has fluctuated over
    its fourteen year life. At one time, it was easily the most used Linux-based operating
    system in the world but some wrong choices along the way with regards to its presentation,
    and some unfavourable, controversial elements involving privacy, sadly saw it
    topple from the number one spot. That said, Ubuntu has since made amends and is
    slowing crawling its way back up the Linux leader board. The latest versions of
    the OS use the GNOME 3 desktop environment, an impressive environment, although
    it can be a little confusing for former Windows users and is a little heavy on
    system resources, especially if you''re planning on installing it on an older
    computer. Ubuntu, for all its faults, is a good Linux distro to start experimenting
    with. It''s a clean interface, easy to use and install and offers the user a complete
    Linux experience.


    www.ubuntu.com


    ### ARCH


    Arch is one of the longest running Linux distributions and forms the basis of
    many other versions of Linux. Why install Mint or Ubuntu when you can install
    Arch? Many users do exactly that but it''s not ideal for beginners. Ubuntu and
    Mint both offer an easier installation path and come with software packages to
    help you get started.


    Arch on the other hand, is a more ''bare bones'' affair. Arch is committed to
    free software and its repositories contain over 50,000 apps to install, including
    multiple different Desktop environments, and use as you would with any other distro.
    Arch is a distro for when you''re more experienced with Linux. You start with
    nothing but the command line and from there you have to manually partition your
    hard drive, set where the installation files go, create a user, set the OS locale
    and finally install a desktop environment along with the apps you want. The advantage
    though, for all this hard work, is a distro that you have created. This means
    your Arch distro won''t come with all the unnecessary files and apps that others
    have preinstalled; it''s custom made for you, by you.


    www.archlinux.org


    ### RASPBERRY PI DESKTOP


    No doubt you''ve heard of the Raspberry Pi. It''s hard not to have, as this remarkable,
    tiny computer has taken the technology world by storm for the last six years since
    it was introduced. There are several aspects to the Raspberry Pi that make it
    such a sought after piece of the computing world. For one it''s cheap, costing
    around £25 for what is essentially a fully working computer. It''s small, measuring
    not much bigger than a credit card. You can build electronics with it, using a
    fully programmable interface; and it comes with Raspbian, its own custom-made,
    Debian-based operating system that includes an office suite alongside many different
    programming languages and educational resources.


    Raspbian is exclusive to the Pi hardware, since the Raspberry Pi uses an ARM processor
    to power it. However, the Raspberry Pi Foundation has since released a PC version
    of Raspbian: Raspberry Pi Desktop. Just like the Pi version, Raspberry Pi Desktop
    comes with all the coding, educational and other apps you will ever need. It''s
    quick, stable and works superbly. If you''re interested in stretching your Linux
    experience, then this is certainly one of the top distros to consider.


    www.raspberrypi.org/downloads/raspberry-pi-desktop


    ### OPENSUSE


    Most Linux distributions fall into two camps. There are ones with the latest features
    and technology like Ubuntu and Mint and those with few new features but rock solid
    reliability, like Debian. Meanwhile, openSUSE attempts to cover both bases. openSUSE
    Leap is the rock solid system. It''s developed openly by a community along with
    SUSE employees, who develop an enterprise-level operating system, SUSE; this powers
    the London Stock Exchange amongst other things. It is designed for mission critical
    environments where ''there is no scope for instability''. If you find all that
    too sensible, openSUSE Tumbleweed is a rolling release with all the latest features,
    and the occasional crash. openSUSE is a highly respected Linux distribution and
    many of its core contributors work on the Linux Kernel, LibreOffice, Gnome and
    other key Linux areas. In short, openSUSE is where you''ll find the pros hanging
    out.


    www.opensuse.org


    ## Equipment You Will Need


    The system requirements for successfully installing Linux Mint onto a PC are surprisingly
    low, so even a computer that''s several years old will happily run this distro.
    However, it''s worth checking you have everything in place before proceeding.


    ### MINTY INGREDIENTS


    Before we start working our way through this book, here''s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see which works best for you.


    ### SYSTEM REQUIREMENTS


    The minimum system requirements for Linux Mint are as follows:


    - **CPU** – 700MHz

    - **RAM/Memory** – 512MB

    - **Hard Drive space** – 9GB (20GB recommended)

    - **Display** – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    ### USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a little later on but if you''re already familiar with the process, or thinking
    of USB and just gathering the hardware you need, then you''re going to need a
    minimum 4GB USB flash drive to store the Linux Mint ISO.


    ### DVD INSTALLATION


    DVD installation of Linux Mint simply requires a blank DVD-R disc. Of course,
    you also need an optical drive (a DVD Writer drive) before you''re able to transfer
    or burn the ISO image to the disc.


    ### VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distros. Linux Mint works exceedingly well when used in a virtual environment
    but more on that later. There are many different virtual environment apps available;
    however, VirtualBox, from Oracle, is one of the easiest to get into. You can find
    the latest version at **www.virtualbox.org**.


    ### INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ### MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac owners use a virtual environment, such as VirtualBox or Parallels;
    and why not, macOS is already a splendid operating system. If you''re wanting
    to breathe new life into an older Mac, make sure it''s an Intel CPU model and
    not the Power PC models. Beware though, it''s not as pain free as installing onto
    a PC.'
