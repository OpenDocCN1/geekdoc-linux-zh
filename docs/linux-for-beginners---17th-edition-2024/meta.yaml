    ## 最佳Linux发行版

    Linux有大量可供使用的版本，被称为发行版。它们各有不同的设计理念和侧重方向。以下将介绍5款值得尝试的优秀发行版及其获取渠道。


    ### 《走进Linux》

    大多数发行版的安装流程大同小异：你只需从官网下载磁盘镜像，将其刻录到光盘，或制作成U盘安装器即可。注意要选择适配你硬件版本的发行版，并仔细阅读安装说明。


    ### Linux Mint

    截至当前最受欢迎的Linux发行版（distro为distribution的缩写）就是Linux Mint。Linux Mint于2006年推出，最初是作为当时最流行的发行版Ubuntu的替代方案。尽管它基于Ubuntu的长周期支持版本构建，但Linux
    Mint走出了一条不同的路线，致力于为用户提供更优质的整体使用体验。Linux Mint每次发布核心操作系统新版本时，都会同步推出3款主要的桌面版本。初次看可能会觉得有些复杂，实则非常简单。目前，Linux
    Mint以Cinnamon桌面环境作为旗舰版本；同时也提供MATE和Xfce版本供选择。Cinnamon是图形化效果丰富的桌面环境，MATE图形化效果更简洁，在更多桌面系统上运行更稳定，而Xfce是为速度和极致稳定性打造的极致轻量化桌面环境。全书中我们将以Cinnamon版本为例进行演示，但你也随时可以尝试其他桌面环境。事实上，我们建议你花些时间体验不同的桌面环境，甚至不同的发行版，找到最适合你和你的电脑的选项。

    www.linuxmint.com


    ### Ubuntu

    第二受欢迎的发行版是Ubuntu，这个名字源自古非洲语，意为“仁者爱人”。Ubuntu在14年的发展历程中人气起起伏伏，一度它曾是全球使用最广泛的Linux操作系统，但发展过程中一些关于产品呈现的决策失误，以及涉及隐私问题的一些不利、争议性事件，让它不幸跌出了榜首位置。不过好在Ubuntu此后进行了改进，正慢慢重回Linux发行版排行榜的前列。该系统最新版本采用GNOME
    3桌面环境，这个环境表现十分出色，但对惯用Windows的用户来说可能会有些陌生，且对系统资源的占用偏高，尤其是你打算在老电脑上安装的话。尽管存在诸多不足，Ubuntu依然是适合新手入门尝试的Linux发行版。它界面简洁，易于使用和安装，能为用户提供完整的Linux使用体验。

    www.ubuntu.com


    ### Arch

    Arch是存在时间最长的Linux发行版之一，也是许多其他Linux版本的基础。既然可以安装Arch，何必选择Mint或Ubuntu呢？不少用户确实会这么做，但它并不适合新手入门。Ubuntu和Mint都提供了更简单的安装路径，还预置了软件包帮助你快速上手。而Arch则是一款更“极简基础”的发行版。Arch坚守自由软件理念，其软件仓库中包含超过5万个可安装应用，涵盖多种不同的桌面环境，你可以像使用其他发行版一样自由使用。Arch适合已经对Linux有一定经验的用户使用。安装时你只会得到命令行界面，接下来需要手动给硬盘分区、设置安装文件的存放路径、创建用户账户、配置操作系统区域设置，最后再安装你需要的桌面环境和应用程序。尽管过程繁琐，但好处是你最终得到的是完全由自己打造的发行版。这意味着你的Arch发行版不会预置其他发行版自带的冗余文件和应用程序，它是为你量身定制的。

    www.archlinux.org


    ### 树莓派桌面版

    你肯定听说过树莓派。这款出色的微型电脑自推出以来，在过去6年时间里风靡整个科技界，想不知道都难。树莓派之所以在计算领域备受追捧，原因有几方面：首先它价格低廉，这样一台功能完备的电脑售价仅约25英镑；其次它体积小巧，尺寸比信用卡大不了多少。你可以利用其可完全编程的接口开发电子设备；它还预装了专属的Raspbian操作系统，该系统基于Debian打造，内置办公套件以及多种编程语言和教育资源。由于树莓派采用ARM处理器供电，Raspbian仅适配树莓派硬件。不过，树莓派基金会随后推出了Raspbian的PC版本——树莓派桌面版。和树莓派版本一样，树莓派桌面版预置了所有你可能需要的编程、教育类及其他应用。它运行快速、稳定性高，表现十分出色。如果你想拓展自己的Linux使用体验，这款发行版绝对是首选之一。

    www.raspberrypi.org/downloads/raspberry-pi-desktop


    ### openSUSE

    大多数Linux发行版可分为两类：一类是像Ubuntu、Mint这样搭载最新功能和技术的发行版，另一类是像Debian这样新功能不多但稳定性极强的发行版。而openSUSE尝试兼顾两者的优势。openSUSE
    Leap是稳定性极高的版本，由社区和SUSE员工联合公开开发，SUSE是其开发的企业级操作系统，伦敦证券交易所等诸多机构都在使用该系统。它专为“不容许任何不稳定因素”的关键任务环境设计。如果你觉得上述版本太过稳妥，那么openSUSE
    Tumbleweed滚动更新版会更适合你，它搭载所有最新功能，只是偶尔会出现崩溃问题。openSUSE是广受认可的Linux发行版，不少核心贡献者都参与Linux内核、LibreOffice、Gnome及其他关键Linux领域的开发工作。简言之，openSUSE是众多专业人士的首选。

    www.opensuse.org


    ## 所需设备

    在PC上成功安装Linux Mint的系统要求出奇地低，甚至使用了数年的老电脑也能流畅运行该发行版。不过正式开始前，建议你确认是否已准备好所有所需物品。


    ### 安装Linux Mint的必备物料

    在正式开始阅读本书前，先说明安装和运行Linux Mint所需的所有物品。你有多种选择，不妨多花些时间对比，挑选最适合自己的方案。


    ### 系统要求

    Linux Mint的最低系统要求如下：

    - **CPU** – 700MHz

    - **内存** – 512MB

    - **硬盘空间** – 9GB（推荐20GB）

    - **显示器** – 1024×768分辨率

    很显然，你的设备配置越高，使用体验也会越好，运行速度也越快。


    ### U盘安装

    你可以通过U盘或DVD将Linux Mint安装到电脑中。我们会在后文分别介绍这两种安装方式，但如果你已经熟悉安装流程，或打算使用U盘安装、正在准备所需硬件，那么你至少需要一块4GB容量的U盘来存储Linux
    Mint的ISO镜像。


    ### DVD安装

    使用DVD安装Linux Mint仅需一张空白的DVD-R光盘。当然，你还需要一台光驱（DVD刻录光驱）才能将ISO镜像刻录到光盘中。


    ### 虚拟机环境

    安装到虚拟机环境是测试和使用Linux发行版的常用方法。Linux Mint在虚拟机环境中运行表现极佳，相关内容我们会在后文介绍。目前市面上有很多不同的虚拟机应用，其中由甲骨文开发的VirtualBox是上手难度最低的之一。你可以在**www.virtualbox.org**获取最新版本。


    ### 网络连接

    不言而喻，网络连接对于确保Linux Mint能获取最新更新、补丁，以及安装额外软件而言至关重要。虽然不连接网络也能使用Linux Mint，但你会错过海量适用于该发行版的免费软件。


    ### Mac硬件

    虽然Linux Mint可以安装到Mac电脑上，但部分观点建议Mac用户使用如VirtualBox或Parallels之类的虚拟机环境；这也无可厚非，毕竟macOS本身就已经是一款出色的操作系统。如果你想给老款Mac注入新的活力，请确保它搭载的是Intel处理器，而非PowerPC处理器。不过要注意的是，在Mac上安装Linux
    Mint并不像在PC上安装那样轻松。

    '
