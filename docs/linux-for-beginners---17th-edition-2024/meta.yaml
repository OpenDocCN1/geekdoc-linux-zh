    ## 创建Bash脚本 – 第一部分

    随着你逐渐熟悉Linux Mint，最终你会想要开始创建自己的自动化任务和程序。这些本质上就是脚本，准确来说是Bash Shell脚本，其运行方式和DOS批处理文件、或者其他编程语言相同。

    ### 开始脚本编程

    Bash脚本本质上是一系列Mint会依次执行的命令，用于完成特定任务。脚本可以非常简单，也可以极其复杂，具体取决于实际需求。

    ### 步骤1

    接下来的内容中，你都会在终端里配合文本编辑器进行操作。我们稍后会介绍其他可选的文本编辑器，但为了便于演示，后续示例都会使用Xed来编写。不过在开始之前，先执行常规的系统更新检查：`sudo
    apt-get update && sudo apt-get upgrade`

    ### 步骤2

    我们可以用多种文本编辑器来创建Bash脚本：Xed、Vi、Nano、Vim、GNU Emacs等等。最终选择哪个完全取决于个人偏好。我们选用Xed，纯粹是为了让你在查看下方的截图时能更清晰地阅读脚本内容。

    ### 步骤3

    首先，在你开始编写任何脚本之前，你需要创建一个用来存放所有脚本的文件夹。先执行**mkdir scripts**命令，再进入该文件夹**cd scripts/**。这个文件夹将作为我们的工作目录，之后如果你想为每个创建的脚本单独建立子文件夹，也可以在这里操作。

    ### 步骤4

    Windows用户都知道，批处理文件要能够正常运行（也就是可执行、且能执行内部的程序逻辑），需要带有.BAT文件后缀。Linux是无后缀操作系统，但默认的惯例是给脚本加上.sh后缀。

    ### 步骤5

    将多条命令串联起来，并通过管道传递给其他命令处理，是脚本成为操作系统强大功能模块的原因。举个例子，将while命令和toilet工具结合使用，就能得到很有意思的效果。执行以下命令：`while
    true; do echo "$(date ''+%D %T'' | toilet -f term -F border --metal)"; sleep 1;
    done.`

    ### 步骤6

    会说话的电脑是80年代的流行风潮，执行以下命令：`espeak "Hello, this is Linux Mint"`，就能让电脑把引号里的内容读给你听。记得把音量调大，再试试这个命令：`ls
    > folders.txt && espeak -f folders.txt`，这样Mint就会把ls命令的执行结果读出来。

    ### 步骤7

    噼啪作响的ASCII火焰虽说不是最实用的工具，但趣味十足。用以下命令安装它：`sudo apt-get install libaa-bin`，安装完成后执行`aafire`即可。虽然不会真的取暖，但你能get到其中的乐趣。如果要体验更丰富的效果，执行以下命令：`sudo
    apt-get install bb caca-utils`，然后运行`cacafire`

    ### 步骤8

    这个bb命令源自旧款Amiga和DOS时代的音乐演示程序，会让人想起当年塞满了各类演示场景好物的3.5英寸软盘。我们在上一步已经安装过bb了，现在直接输入bb即可。按照屏幕提示操作，并把音量调大。

    ### 步骤9

    这一步分为两个部分。首先你需要下载安装必要的依赖包：`sudo apt-get install liburses-perl` 完成后执行以下命令：

    ``` cd Downloads/ && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/. ```

    之后再执行：

    ``` perl Makefile.PL && make && make test && sudo make install ```

    ### 步骤10

    完成以上步骤后，我们继续下一步。执行以下命令：

    ``` cd .. && wget http://www.robobunny.com/projects/asciiquarium/asciiquarium.tar.gz
    && tar -xf asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium
    ```

    如果一切顺利，输入`./asciiquarium`就能享受专属于你的ASCII水族馆了。


    ## Linux小技巧与窍门

    正如你所见，Linux终端是一个非常特殊的环境。只要安装几个额外的应用程序，掌握一点点的命令知识，就能实现各种奇妙、甚至有些奇怪的功能。

    ### 玩转命令

    Linux的小技巧、秘密、黑科技数不胜数。有些非常古老，源自Linux的Unix血统，有些则是近期才加入Linux实用技巧库的新内容。下面是我们最爱的10个技巧。

    ### 彩蛋

    Emacs是一款非常优秀的文本编辑器，但你知道吗，它还藏着一个隐藏彩蛋？安装好Emacs（执行`sudo apt-get install emacs25`）后，打开终端会话并输入：

    ``` sudo apt-get install emacs25 emacs -batch -l dunnet ```

    Dunnet是Ron Schnell在1982年编写的一款文字冒险游戏，从1994年起就被藏在Emacs里。

    ### 终端上网

    你有没有想过能在终端里浏览互联网？虽说这功能实用性不算高，但确实非常有意思。要使用的话，先执行`sudo apt-get install elinks`安装工具，之后输入你想访问的网站地址即可。

    ### 月球战车

    月球战车（Moon Buggy）改编自1982年的经典街机游戏《月球巡逻队》，1985年推出家用电脑版时备受好评。这是一款非常棒的Atari游戏，现在你可以在Linux终端里玩到它：先执行`sudo
    apt-get install moon-buggy`安装，再输入`moon-buggy`启动即可，玩得开心~

    ### 终端下雪

    终端控制台里下雪？不管你感不感兴趣，先试试以下命令：

    ``` wget https://gist.githubusercontent.com/sontek/1505483/raw/7d024716ea57e69fb52632fee09f42753361c4a2/snowjob.sh
    chmod +x snowjob.sh ./snowjob.sh ```

    ### 内存占用大户

    如果你想查看Linux上哪些应用程序占用的内存最多，直接执行以下命令即可：`ps aux | sort -rnk 4`，该命令会按照系统内存占用量对结果排序。

    ### 电子公告板

    拨号上网时代，网络世界主要由电子公告板系统（BBS）构成。这些远程服务器为用户提供了聊天、交流代码、玩游戏等互动空间。在Linux中，我们依然可以通过telnet连接到仍处于运营状态的BBS：`telnet
    battlestarbbs.dyndns.org`。目前还有大量可用的BBS，你可以访问https://www.telnetbbsguide.com/bbs/list/detail/
    查看更多。

    ### 文件粉碎器

    当你删除文件时，很有可能被懂行的人通过特定软件恢复。如果想要安全、彻底地删除文件，可以使用shred命令：`shred -zvu NAMEOFFILE.txt`，把NAMEOFFILE替换成你要删除的文件名即可。

    ### 目录树

    如果你想用一条命令创建完整的目录（或文件夹）树，可以使用以下命令：`mkdir -p New-Dir/${subfolder1,subfolder2,subfolder3,subfolder4}`，该命令会创建一个名为New-Dir的目录，其中包含4个子文件夹。

    ### ASCII艺术

    ASCII艺术用在某些图片上效果会非常惊艳，但往往很难做到完美。你可以用img2txt工具把自己拥有的图片转换成很棒的ASCII艺术：`img2txt NAMEofIMAGEFILE.png`，把NAMEofIMAGEFILE替换成你系统中实际图片文件的名称即可。如果img2txt没有安装，先执行`sudo
    apt-get install caca-utils.`安装。

    ### 遗忘命令查询

    要记住所有可用的Linux命令可不容易，好在我们可以用apropos命令来帮忙。只需要输入这个命令，再加上命令功能的描述即可，示例如下：

    ``` apropos "copy files" apropos "rename files" ```


    ## Linux与大爆炸

    > Linux就像对撞的粒子，帮助我们理解宇宙的运行规律。


    ## 你知道吗……Linux是大型强子对撞机背后科学研究的核心？

    研究人员、开发者和工程师选择以Red Hat Linux和CentOS（基于Red Hat核心构建的超稳定发行版）组合作为基础发行版，开发了SL——科学Linux（Scientific
    Linux）。以SL为基础，CERN的天才们又开发了多个定制版Linux发行版，用于支持大型强子对撞机（LHC）的所有相关工作。其中最知名的是SLC，即科学Linux
    CERN版，也被称为CERN6。据报告，目前有超过36000台系统运行SL，超过15000台运行SLC。

    '
