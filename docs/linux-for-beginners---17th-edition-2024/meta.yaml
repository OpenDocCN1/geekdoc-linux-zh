  md: '# Installing Linux on a PC


    > Most Linux distros come as a Live Environment. This means you can boot into
    an actual, fully-working distro straight from the DVD or USB that you just created.
    Let''s see how that works and how you go about installing Linux from there.


    # UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify hardware
    and protect a PC during its boot-up process. It replaces the traditional BIOS
    but can cause issues when installing Linux.


    # STEP 1


    Insert your DVD or USB flash drive into your PC and, if you haven''t already,
    shutdown Windows. In this instance we''re using the USB boot media but the process
    is virtually identical. Start the PC and when prompted press the appropriate keys
    to enter the BIOS or SETUP, which could for example be: F2, Del or even F12.


    ![](img/6103e44aa372eb088d684690786bde89_21_0.png)


    # STEP 2


    There are different versions of a UEFI BIOS, so covering them all would be impossible.
    What you''re looking for is a section that details the Boot Sequence or Boot Mode.
    Here you have the option to turn off UEFI and choose Legacy or disable Secure
    Booting. Most distros work with UEFI but it can be a tricky process to enable
    it to boot.


    ![](img/6103e44aa372eb088d684690786bde89_21_1.png)


    # STEP 3


    With UEFI turned to Legacy mode, there are now two ways of booting into the Live
    Environment. The first is via the BIOS you''re already in. Locate the Boot Sequence
    and change the first boot device from its original setting, usually Internal HDD
    or similar, to: USB Storage Device for the USB media option, or DVD Drive for
    the DVD media option.


    ![](img/6103e44aa372eb088d684690786bde89_21_2.png)


    # STEP 4


    Alternatively use the Boot Option Menu. With this option you can press F12 (or
    something similar) to display a list of boot media options; from there, you can
    choose the appropriate boot media. Either way, you can now Save and Exit the BIOS
    by navigating to the Save & Exit option and choosing ''Save Changes and Exit''.


    ![](img/6103e44aa372eb088d684690786bde89_21_3.png)'
