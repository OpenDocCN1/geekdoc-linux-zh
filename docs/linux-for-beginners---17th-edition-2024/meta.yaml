    # Installing Linux in a Virtual Environment


    With Oracle''s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you will install Linux. This process won''t
    affect your currently installed operating system, which is why a VM is a great
    choice.


    # CREATING THE VM


    There are plenty of options to choose from when creating a VM. For now though,
    we''ll setup a VM adequate to run the excellent Linux Mint, and perform well.


    STEP 1 With VirtualBox open, click on the New icon in the top-middle of the right-hand
    panel of the app. This will open the new VM Wizard.


    ![](img/6103e44aa372eb088d684690786bde89_25_0.png)


    STEP 3 The next section will define the amount of system memory, or RAM, the VM
    has allocated. Remember this amount will be taken from the available memory installed
    in your computer, so don''t give the VM too much. For example, we have 8GB of
    memory installed and we''re giving 2GB (2048MB) to the VM. When you''re ready,
    click Next to continue.


    ![](img/6103e44aa372eb088d684690786bde89_25_1.png)


    STEP 2 In the box next to Name type Linux Mint, and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as the Version, if not then use the
    drop-down boxes to select the correct settings (remember Mint mainstream is based
    on Ubuntu). Click Next when you''re ready to proceed.


    ![](img/6103e44aa372eb088d684690786bde89_25_2.png)


    STEP 4 This section is where you''ll start to create the virtual hard disk that
    the VM will use to install Mint on to. The default option, ''Create a virtual
    hard disk now'', is the one we''re using. Click Create to move on.


    ![](img/6103e44aa372eb088d684690786bde89_25_3.png)'
