    Why Linux? What is it? Where do I get it? Why are there so many different versions
    of it? Most beginners ask these, and many more, questions when starting out. It''s
    true that Linux is an incredibly versatile and powerful operating system but where
    do you start? Thankfully, you can find the answers in this section.


    There is so much you can do with Linux but you need to know where to start; we''re
    here to help you out. In this section you can learn what Linux is, what a distro
    is and what a desktop environment is. You can also begin to explore how Linux
    works and how it can work for you.


