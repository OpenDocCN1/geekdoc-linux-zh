    ## Pi × Linux = 完美组合

    树莓派是一块十分出色的硬件，为充分释放其潜力，需要搭配一款同样出色的操作系统。幸运的是，Linux是树莓派默认且推荐的操作系统，二者组合堪称天作之合。

    树莓派还在研发阶段时，其设计者就希望打造一款硬件，它的能力远不止充当廉价的小型电脑。树莓派需要有足够灵活的功能，有足够的拓展空间适配更宏大、更具雄心的项目构想与创意，还要尽可能方便易用。他们的目标是打造一个通用学习平台，各个年龄段的学生都可以在这个平台上拓展创新、动手实践，同时学习编程、电子技术、计算机科学等新概念。

    自然，硬件研发完成后，唯一真正合适的操作系统选择当然是Linux。

    ![](img/6103e44aa372eb088d684690786bde89_77_0.png)

    Linux的多功能性堪称传奇。这款核心操作系统极其灵活，几乎可以适配所有计算领域：从超级计算、机器人技术，到航天产业和地面工程；从教育与科研，到制造业和互联网。不妨想想任何行业，你几乎都能在后台找到Linux的身影，支撑着整个行业的运作。

    ![](img/6103e44aa372eb088d684690786bde89_77_1.png)

    ![](img/6103e44aa372eb088d684690786bde89_77_2.png)

    Raspberry Pi OS是树莓派官方推荐的操作系统，这是一款基于Debian的定制发行版，内置了大量实用工具，可满足编码、电子技术以及常规桌面计算的需求。除了应用程序外，系统还预装了各类模块，可帮你充分发挥所选编程语言的效用，同时还有软硬件交互模块，支持你为树莓派独有的专用硬件供电并使用。例如，系统预装了可与树莓派40针GPIO交互的Python模块，你能用这些模块为各类顶部附加硬件（Hardware
    Attached on Top，简称HAT）设备开发内容。这样的组合让树莓派成为绝佳的学习平台，你不仅可以在这里学习编程，还能系统学习Linux相关知识。

    Raspberry Pi OS基于Debian系统，因此可以运行本书中列出的所有终端命令，毕竟Linux Mint甚至Ubuntu也都是基于Debian的系统。而且树莓派体积小巧、部署成本极低，你可以同时使用原有的Windows或macOS电脑，再把树莓派作为无头设备（即无需连接键盘、鼠标或显示器，可通过远程方式接入的已供电设备），通过它连接学习Linux和编程的相关知识。

    ![](img/6103e44aa372eb088d684690786bde89_78_1.png)

    ### 该选哪款树莓派？

    目前市面上有多个树莓派型号可选，每款都有细微的差异。最新发布的树莓派是树莓派5，虽然这款产品价格比其他部分型号略高，但它是目前性能最强、功能最丰富的树莓派。综合来看，入门树莓派的最佳选择是先用树莓派3
    B+款进行实操练习，等你技能提升、确定要投入特定项目后，再换用其他型号，比如如果需要小巧便携、支持WiFi连接的机型，就可以选用树莓派Zero系列。

    ![](img/6103e44aa372eb088d684690786bde89_78_1.png)

    ### 超越Raspberry Pi OS

    树莓派搭载的ARM处理器灵活性极高，除了Raspbian系统外，还可以运行其他操作系统。如果你仍想使用Linux系统，可以选择安装Ubuntu MATE、Pidora（基于Fedora的发行版）、Lakka、PiPlay（复古游戏模拟发行版）以及Arch
    Linux ARM。此外还有不少松散基于Linux内核的系统，比如Android、Minibian和Chromium OS。如前所述，树莓派是非常优秀的代码运行平台，以Linux为内核，你可以用它学习多种不同编程语言的编码。Bash脚本在树莓派上运行完美，因为Raspberry
    Pi OS是Linux系统且基于Debian，你可以轻松扩展脚本，实现树莓派的大部分功能。除了编写备份脚本外，你还可以编写可访问树莓派GPIO引脚的脚本，进而控制LED灯，乃至更复杂的HAT扩展板。

    此外树莓派还支持Windows 10 IoT Core、FreeBSD、RISC OS Pi、Plan 9，甚至还有AROS——一款Amiga OS的克隆系统。毋庸置疑，当你熟悉了一款Linux发行版后，就可以像在桌面端Linux上那样，在树莓派上切换尝试其他发行版，看看哪一款运行起来更顺手，更适合你的需求。

    ### 树莓派、Linux与编程

    Python至今仍是初学者最热门的选择，Raspbian系统预装了所有你需要的组件，能帮你获得最佳的Python使用体验。系统中预装了海量模块，以及该语言最新的稳定正式版。

    ![](img/6103e44aa372eb088d684690786bde89_78_2.png)

    C++是最值得学习的编程语言之一，功能十分强大，可用于开发游戏、应用程序，乃至完整的操作系统。树莓派内置了一款十分出色的C++编辑器，易用性高，能帮你开发出惊艳的作品。无论你打算从哪条路径开启编程与Linux的学习之旅，树莓派都是绝佳的入门平台。

    ![](img/6103e44aa372eb088d684690786bde89_78_3.png)

    ## 命令行快速参考指南

    当你开始全职使用Linux时，很快就会意识到：Ubuntu、Mint等系统的图形界面适合完成很多任务，但并非所有任务都能靠图形界面高效解决。掌握命令行操作不仅能加深你对Linux的理解，还能提升你整体的编码与编程能力。我们的命令行快速参考指南正是为了帮你更快熟练掌握Linux而设计的。

    ### 十大常用命令

    以下命令可能不是所有用户都会用到的最高频命令，但绝对会是许多Linux和命令行用户经常用到的功能：

    - **cd**：cd是你在Linux命令行中最常用的命令之一，它的作用是切换工作目录，你可以用它来在文件系统的层级结构中导航。你也可以使用chdir命令实现相同功能。

    - **mv**：mv命令用于将文件移动到其他位置，或重命名文件。例如`mv file sub`会将原文件重命名为sub；`mv sub ~/Desktop`则会将名为sub的文件移动到桌面目录，不会重命名文件。如果要重命名文件，必须指定新的文件名。

    - **ls**：ls命令用于显示当前目录下的文件，搭配特定参数使用时，可以查看文件大小、创建时间以及文件权限。例如`ls ~`会显示你的主目录下的所有文件。

    - **chown**：chown命令用于修改指定文件的用户和/或所属组。如果仅指定所有者（用户名或数字用户ID），则会将所有指定文件的所有者设置为该用户，文件的所属组不会改变。

    - **cp**：cp命令用于复制文件和目录。例如`cp file sub`会完全复制你输入名称的文件，并将副本命名为sub，但原文件仍会保留原有名称。

    - **chmod**：chmod命令用于修改所列文件的权限。权限模型十分简单，你可以为用户、用户组、其他用户分别设置是否拥有读取、写入、执行该文件的权限。

    - **pwd**：pwd命令用于打印当前工作目录的完整路径（pwd是“print working directory”的缩写）。注意GNOME终端的窗口标题栏也会显示这一信息。

    - **rm**：rm命令用于删除文件或目录。删除操作会将文件系统中文件名与存储设备上的数据解除关联，并将对应的存储空间标记为可被后续写入使用。换句话说，删除文件会释放你磁盘上的可用空间。

    - **clear**：clear命令用于清空终端屏幕（如果当前终端支持该功能）。它会先查看环境中的终端类型，再查询terminfo数据库来确定清屏的具体方式，效果等同于在使用bash
    shell时按下Control-L组合键。

    - **mkdir**：mkdir是“make directory（创建目录）”的缩写，用于在文件系统中创建不存在的指定目录。例如`mkdir work`会创建一个名为work的目录，调用mkdir命令时可以同时指定多个要创建的目录。

