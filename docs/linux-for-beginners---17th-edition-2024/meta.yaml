  md: '# CREATING A BACKUP TASK SCRIPT


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, one that automates the task as well as adding some customisations along
    the way.


    # STEP 1


    A very basic backup script would look something along the lines of: `#!/bin/bash`,
    then, `tar cvfz ~/backups/my-backup.tgz ~/Documents/`. This will create a compressed
    file backup of the ~/Documents folder, with everything in it, and put it in a
    folder called /backups with the name my-backup.tgz.


    ![](img/6103e44aa372eb088d684690786bde89_74_0.png)


    # STEP 4


    Once the ~/backups folder is created, we can now create a new subfolder within
    it based on the Time Stamp variables you set up at the beginning. Add `mkdir -p
    $dest/"$day $month $year"`. It''s in here that you put the backup file relevant
    to that day/month/year.


    ![](img/6103e44aa372eb088d684690786bde89_74_1.png)


    # STEP 2


    While perfectly fine, we can make the simple script a lot more interactive. Let''s
    begin with defining some variables. Enter the text in the screenshot into a new
    backup.sh script. Notice that we''ve misspelt ''source'' as ''sauce'', this is
    because there''s already a built-in command called ''source'' hence the different
    spelling on our part.


    ![](img/6103e44aa372eb088d684690786bde89_74_2.png)


    # STEP 5


    With everything in place, you can now enter the actual backup routine, based on
    the Tar command from Step 1. Combined with the variables, you have: `tar cvfz
    $dest/"$day $month $year"/DocumentsBackup.tgz $sauce`. In the screenshot, we added
    a handy "Now backing up..." echo command.


    ![](img/6103e44aa372eb088d684690786bde89_74_3.png)


    # STEP 3


    The previous script entries allowed you to create a Time Stamp, so you know when
    the backup was taken. You also created a ''dest'' variable, which is the folder
    where the backup file will be created (~/backups). You can now add a section of
    code to first check if the ~/backups folder exits, if not, then it creates one.


    ![](img/6103e44aa372eb088d684690786bde89_74_4.png)


    # STEP 6


    Finally, you can add a friendly message: `echo "Backup complete. All done..."`.
    The completed script isn''t too over-complex and it can be easily customised to
    include any folder within your Home area, as well as the entire Home area itself.


    ![](img/6103e44aa372eb088d684690786bde89_74_5.png)'
