    static unsigned long long pos;\nstatic unsigned long x,y;\nstatic unsigned long\
    \ top=0,bottom=LINES;\nstatic unsigned long lines=LINES,columns=COLUMNS;\nstatic\
    \ unsigned long state=0;\nstatic unsigned long npar,par[NPAR];\nstatic unsigned\
    \ long ques=0;\nstatic unsigned char attr=0x07;\n```\n> **DID YOU KNOW...** that\
    \ the first Linux kernel, as programmed by Linus Torvalds, only occupied 65KB\
    \ of memory? And that since version 0.01, the Linux kernel now boasts over 18\
    \ million lines of code. Not bad for a university project that now runs the New\
    \ York Stock Exchange, and powers the US Department of Defence's fleet of nuclear\
    \ submarines.\n\n## Creating a File Using the Terminal\nUsing the Terminal, you're\
    \ able to create folders, files and even execute Linux Mint apps. In truth, if\
    \ you didn't have the GUI at hand, you could still accomplish the same from the\
    \ Terminal.\n\n### MORE TERMINAL WORK\n**STEP 1** Open up the Terminal, and make\
    \ sure you're in the Home folder. If not use the `cd ~` command to return you\
    \ to the Home folder from wherever you're currently located.\n**STEP 2** Let's\
    \ start by creating a new folder within Home, and call it Test. The command you'll\
    \ need is `mkdir Test`. Press Enter to create the folder when you've typed in\
    \ the command, then `cd Test` and press Enter. This will Change Directory (hence\
    \ CD) to the newly created Test folder.\n![](img/6103e44aa372eb088d684690786bde89_55_0.png)\n\
    **STEP 3** Your command line should change to the Test folder and if you enter\
    \ `ls` (List folder contents) there'll be nothing within the folder, as you've\
    \ just created it. The `mkdir` command is fairly self explanatory: Make Directory\
    \ followed by the name of your choosing.\n![](img/6103e44aa372eb088d684690786bde89_55_1.png)\n\
    **STEP 4** To create an empty text file, called Test.txt, enter in the Terminal:\
    \ `touch Test.txt`. You can then use `ls` to view the new file in the folder.\
    \ Touch is a standard Linux command that allows the creation of files without\
    \ the need to open a text editor, save the file, then close the editor.\n![](img/6103e44aa372eb088d684690786bde89_55_2.png)\n\
    ![](img/6103e44aa372eb088d684690786bde89_55_3.png)\n\n**STEP 5** Let's say you\
    \ now wanted to create a text file, we'll call it **Test2.txt**, complete with\
    \ some content. To do so, enter: `cat > Test2.txt`. This will create the file\
    \ **Test2.txt** and put the Terminal into an editing mode.\n![](img/6103e44aa372eb088d684690786bde89_56_0.png)\n\
    **STEP 6** You'll notice that the cursor is flashing below the `cat > Test2.txt`\
    \ command, without the usual prompt. This editing mode will allow you enter the\
    \ text that the file will contain. Enter some text, then press **Ctrl+D** to exit\
    \ and write the contents to the file.\n![](img/6103e44aa372eb088d684690786bde89_56_1.png)\n\
    **STEP 7** Of course you don't always have to use the Terminal to enter text into\
    \ a file. Mint comes with a text editor called **Xed**, which is similar to Windows'\
    \ Notepad. To view the previously created file in Xed, type into the Terminal:\
    \ `xed Test2.txt`, and press **Enter**.\n![](img/6103e44aa372eb088d684690786bde89_56_2.png)\n\
    **STEP 8** Xed is a GUI app, and you can enter text and save the file, or any\
    \ file, accordingly by using the app's main window, and the **File > Save**, or\
    \ **File > Save As** functions from its top menu bar options.\n![](img/6103e44aa372eb088d684690786bde89_56_3.png)\n\
    **STEP 9** If, however, you prefer to remain working in the Terminal to edit/save/create\
    \ files, you can use **Nano**. Nano is a simple Terminal-based text editor. To\
    \ try it with the example, enter: `nano Test2.txt`. There's a menu along the bottom\
    \ of the screen. To exit and save any content in Nano, press **Ctrl+X** and follow\
    \ the on-screen instructions.\n![](img/6103e44aa372eb088d684690786bde89_56_4.png)\n\
    **STEP 10** We've used the Terminal to launch a Mint app, Xed, but any app can\
    \ be launched from within the Terminal. For example, try: `firefox`, and press\
    \ **Enter**. Close Firefox to return to the Terminal. Providing you know the name\
    \ of the app, it can run from the Terminal. Additionally, entering `firefox&`\
    \ opens Firefox, AND lets you still use the Terminal.\n![](img/6103e44aa372eb088d684690786bde89_56_5.png)\n\
    \n## Creating and Removing Directories\nAs with creating files in the Terminal,\
    \ you can also create and delete directories, or folders if you prefer. Directories\
    \ form the structure of your file system, without logical directories the filing\
    \ system would be in utter chaos.\n\n### MANAGING FOLDERS\nLearning how to create\
    \ and delete folders in the Terminal is an important Mint, and indeed Linux overall,\
    \ skill to master. Here's the basics for you to try out.\n**STEP 1** With the\
    \ Terminal open enter `cd ~` to make sure you're in your own Home directory. Now\
    \ enter `ls` to view the current folders you have housed in the Home directory.\
    \ You'll notice that folders are labelled in Mint in cyan (light blue). Let's\
    \ start by creating a new directory. Enter: `mkdir testdir`.\n**STEP 2** If you\
    \ now enter `ls` again, you'll see that the new directory, testdir, has been created\
    \ alongside the other directories in the Home area. Obviously the command `mkdir`\
    \ is what creates the directory, and no doubt you've already guessed it stands\
    \ for Make Directory.\n![](img/6103e44aa372eb088d684690786bde89_57_0.png)\n![](img/6103e44aa372eb088d684690786bde89_57_1.png)\n\
    **STEP 3** If you were to enter the command again, `mkdir testdir`, you'll receive\
    \ a message stating: `mkdir: cannot create directory 'testdir': File exists`.\
    \ It goes without saying then, that you're only able to have one uniquely named\
    \ directory within the current directory. However, as Linux is case-sensitive,\
    \ you can have Testdir, TestDir, testDir and so on.\n**STEP 4** You can create\
    \ directories within directories you've already created. For example, enter the\
    \ testdir directory with `cd testdir/` followed by `ls` to list the folder structure.\
    \ Naturally there's nothing present, as you've just created the directory. Now\
    \ drop back to Home with `cd ~`, and enter `mkdir testdir/reports`. Go back to\
    \ the testdir, `cd testdir/`, and `ls` again.\n![](img/6103e44aa372eb088d684690786bde89_57_2.png)\n\
    ![](img/6103e44aa372eb088d684690786bde89_57_3.png)"
