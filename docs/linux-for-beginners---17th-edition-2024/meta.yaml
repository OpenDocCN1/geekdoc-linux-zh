- img_proc: true
  md: 'Using the Terminal


    # Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    +   **STEP 1** The Terminal can be accessed by either clicking on the Terminal
    icon on the Panel, located between the Firefox and files icons or launched by
    opening the Menu and selecting it from the left-hand quick launch strip.


    ![](img/6103e44aa372eb088d684690786bde89_45_0.png)


    +   **STEP 2** The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    including the desktop and GUI, is a module running from the command line.


    ![](img/6103e44aa372eb088d684690786bde89_45_1.png)


    +   **STEP 3** What you currently see in the Terminal is your login name followed
    by the name of the computer; as you named it during setup when you first installed
    Mint. The line then ends with the current folder name; at first this is just a
    tilde ~, which means your Home folder.


    ![](img/6103e44aa372eb088d684690786bde89_45_2.png)


    +   **STEP 4** The flashing cursor at the very end of the line is where your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (`pwd`), which outputs the current folder you''re in to the
    screen. Type `pwd` and press Enter.


    ![](img/6103e44aa372eb088d684690786bde89_45_3.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# ## Basics of the Terminal


    ![](img/6103e44aa372eb088d684690786bde89_46_0.png)


    # **STEP 5**


    All the commands you enter work in the same manner: you enter the command, include
    any parameters to extend the use of the command and press Enter to execute the
    command line you''ve entered. Type into the Terminal: `uname -a` and press Enter.
    This displays some system information regarding Mint.


    ![](img/6103e44aa372eb088d684690786bde89_46_1.png)


    # **STEP 6**


    Before we get into entering commands, let''s take a moment to see what menus the
    Terminal has to offer. The File menu option allows you to open a new Terminal,
    create a new profile, where you can alter the size, colours and behaviour of the
    Terminal, add a new tab, and close all current active Terminal sessions.


    ![](img/6103e44aa372eb088d684690786bde89_46_2.png)


    # **STEP 7**


    The Edit option lets you copy and paste commands to and from the Terminal and
    other sources; handy for when you want to copy a very long and complex command
    from a web page. It also allows you to edit the current profile preferences.


    ![](img/6103e44aa372eb088d684690786bde89_46_3.png)


    # **STEP 8**


    View and Search options let you alter the sizing of the Terminal window and of
    course search within the Terminal for any particular key words.


    ![](img/6103e44aa372eb088d684690786bde89_46_4.png)


    # **STEP 9**


    The Terminal entry extends the profile editing and sizing and allows you to alter
    the character encoding. Interestingly, you can also set it to a Read Only mode,
    which stops you from entering any commands into the Terminal; this is good for
    when you need to permanently display the Terminal contents.


    ![](img/6103e44aa372eb088d684690786bde89_46_5.png)


    # **STEP 10**


    Finally, the Help option displays the help contents and version number of the
    Terminal, or to be more precise, GNOME Terminal; we''ll simply refer to it as
    Terminal in future. The Contents are worth having a quick read through, to help
    familiarise yourself with how the Terminal works.


    ![](img/6103e44aa372eb088d684690786bde89_46_6.png)'
