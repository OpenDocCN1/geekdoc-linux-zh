  md: '# Creating Bash Scripts – Part 1


    Eventually, as you advance with Linux Mint, you''ll want to start creating your
    own automated tasks and programs. These are essentially scripts, Bash Shell scripts
    to be exact, and they work in the same way as a DOS Batch file does, or any other
    programming language.


    # GET SCRIPTING


    A Bash script is simply a series of commands that Mint will run through to complete
    a certain task. They can be simple or remarkably complex, it all depends on the
    situation.


    # STEP 1


    You''ll be working within the Terminal and with a text editor throughout the coming
    pages. There are alternatives to the text editor, which we''ll look at in a moment
    but for the sake of ease, we''ll be doing our examples in Xed. Before you begin,
    however, run through the customary update check: `sudo apt-get update && sudo
    apt-get upgrade`.


    # STEP 3


    To begin with, and before you start to write any scripts, you need to create a
    folder where you can put all our scripts into. Start with **mkdir scripts**, and
    enter the folder **cd scripts/**. This will be our working folder and from here
    you can create sub-folders if you want of each script you create.


    ![](img/6103e44aa372eb088d684690786bde89_67_0.png)


    ![](img/6103e44aa372eb088d684690786bde89_67_1.png)


    # STEP 2


    There are several text editors we can use to create a Bash script: Xed, Vi, Nano,
    Vim, GNU Emacs and so on. In the end it all comes down to personal preference.
    Our use of Xed is purely due to making it easier to read the script in the screenshots
    you see below.


    # STEP 4


    Windows users will be aware that in order for a batch file to work, as in be executed
    and follow the programming within it, it needs to have a .BAT file extension.
    Linux is an extension-less operating system but the convention is to give scripts
    a .sh extension.


    ![](img/6103e44aa372eb088d684690786bde89_67_2.png)


    ![](img/6103e44aa372eb088d684690786bde89_67_3.png)'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# ## STEP 5


    Let''s start with a simple script to output something to the Terminal. Enter `xed
    helloworld.sh`. This will launch Xed and create a file called `helloworld.sh`.
    In Xed, enter the following: `#!/bin/bash`, then on a new line: `echo Hello World!`.


    ![](img/6103e44aa372eb088d684690786bde89_68_0.png)


    # ## STEP 8


    When you enter `ls` again, you can see that the `helloworld.sh` script has now
    turned from being white to green, meaning that it''s now an executable file. To
    run the script, in other words make it do the things you''ve typed into it, enter:
    `./helloworld.sh`.


    ![](img/6103e44aa372eb088d684690786bde89_68_1.png)


    # ## STEP 6


    The `#!/bin/bash` line tells the system what Shell you''re going to be using,
    in this case Bash. The hash (#) denotes a comment line, one that is ignored by
    the system, the exclamation mark (!) means that the comment is bypassed and will
    force the script to execute the line as a command. This is also known as a Hash-Bang.


    ![](img/6103e44aa372eb088d684690786bde89_68_2.png)


    # ## STEP 9


    Although it''s not terribly exciting, the words ''Hello World!'' should now be
    displayed in the Terminal. The echo command is responsible for outputting the
    words after it in the Terminal, as we move on you can make the echo command output
    to other sources.


    ![](img/6103e44aa372eb088d684690786bde89_68_3.png)


    # ## STEP 7


    You can save this file, clicking File > Save, and exit back to the Terminal. Entering
    `ls`, will reveal the script in the folder. To make any script executable, and
    able to run, you need to modify its permissions. Do this with `chmod +x helloworld.sh`.
    You need to do this with every script you create.


    ![](img/6103e44aa372eb088d684690786bde89_68_4.png)


    # ## STEP 10


    Think of echo as the old BASIC Print command. It displays either text, numbers
    or any variables that are stored in the system, such as the current system date.
    Try this example: `echo Hello World! Today is $(date +%A)`. The `$(date +%A)`
    is calling the system variable that stores the current day of the week.


    ![](img/6103e44aa372eb088d684690786bde89_68_5.png)'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# # Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with creating your own unique variables.


    # ## VARIABLES


    Just as in every other programming language a Bash script can store and call certain
    variables from the system, either generic or user created.


    # ### STEP 1


    Let''s start by creating a new script called hello.sh; `xed hello.sh`. In it enter:
    `#!/bin/bash`, then, `echo Hello $1`. Save the file and exit Xed. Back in the
    Terminal make the script executable with: `chmod +x hello.sh`.


    ![](img/6103e44aa372eb088d684690786bde89_69_0.png)


    # ### STEP 3


    The output now will be Hello David. This is because Bash automatically assigns
    variables for the user, which are then held and passed to the script. So the variable
    ''$1'' now holds ''David''. You can change the variable by entering something
    different: `./hello.sh Mint`.


    ![](img/6103e44aa372eb088d684690786bde89_69_1.png)


    # ### STEP 2


    As the script is now executable, run it with `./hello.sh`. Now, as you probably
    expected a simple ''Hello'' is displayed in the Terminal. However, if you then
    issue the command with a variable, it begins to get interesting. For example,
    try `./hello.sh David`.


    ![](img/6103e44aa372eb088d684690786bde89_69_2.png)


    # ### STEP 4


    You can even rename variables. Modify the hello.sh script with the following:
    `firstname=$1`, `surname=$2`, `echo Hello $firstname $surname`. Putting each statement
    on a new line. Save the script and exit back into the Terminal.


    ![](img/6103e44aa372eb088d684690786bde89_69_3.png)'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# **STEP 5**


    When you run the script now you can use two custom variables: `./hello.sh David
    Hayward`. Naturally change the two variables with your own name; unless you''re
    also called David Hayward. At the moment we''re just printing the contents, so
    let''s expand the two-variable use a little.


    ![](img/6103e44aa372eb088d684690786bde89_70_0.png)


    # **STEP 6**


    Create a new script called `addition.sh`, using the same format as the `hello.sh`
    script, but changing the variable names. Here we''ve added `firstnumber` and `secondnumber`,
    and used the echo command to output some simple arithmetic by placing an integer
    expression, `echo The sum is $(($firstnumber+$secondnumber))`. Save the script,
    and make it executable (`chmod +x addition.sh`).


    ![](img/6103e44aa372eb088d684690786bde89_70_1.png)


    # **STEP 7**


    When you now run the `addition.sh` script we can enter two numbers: `./addition.sh
    1 2`. The result will hopefully be 3, with the Terminal displaying ''The sum is
    3''. Try it with a few different numbers and see what happens. See also if you
    can alter the script and rename it do multiplication, and subtraction.


    ![](img/6103e44aa372eb088d684690786bde89_70_2.png)


    # **STEP 8**


    Let''s expand things further. Create a new script called `greetings.sh`. Enter
    the scripting as below in the screenshot, save it and make it executable with
    the chmod command. You can see that there are a few new additions to the script
    now.


    ![](img/6103e44aa372eb088d684690786bde89_70_3.png)


    # **STEP 9**


    We''ve added a `-n` to the echo command here which will leave the cursor on the
    same line as the question, instead of a new line. The `read` command stores the
    users'' input as the variables `firstname` and `surname`, to then read back later
    in the last echo line. And the `clear` command clears the screen.


    ![](img/6103e44aa372eb088d684690786bde89_70_4.png)


    # **STEP 10**


    As a final addition, let''s include the date variable we used in the last section.
    Amend the last line of the script to read: `echo Hello $firstname $surname, how
    are you on this fine $(date +%A)?`. The output should display the current day
    of the week, calling it from a system variable.


    ![](img/6103e44aa372eb088d684690786bde89_70_5.png)'
