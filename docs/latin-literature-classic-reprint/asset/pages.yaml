    # THE REPUBLIC.


    1.


    # ORIGINS OF LATIN LITERATURE: EARLY EPIC AND TRAGEDY.


    To the Romans themselves, as they looked back two hundred years later, the beginnings
    of a real literature seemed defied in the generation which passed between the
    first and second Punic Wars. The peace of B.C. 241 ensured an epoch through which
    the Roman Republic had been fighting for an assured place in the power of groups
    controlled the Mediterranean world. This was now gained; and the pressure of Carthage
    once removed, Rome was left free to follow the natural expansion of its colonies
    and commerce. Wealth and peace are comparative terms; in such wealth and peace
    as the cessation of the long and exhausting war with Carthage, a class began to
    form itself at Rome, which only took a certain interest in Greek literature, but
    felt in an indistinct way that was its duty, representing one of the greatest
    civilised peoples, to have a substantial national culture of their.


    This new Latin literature must be based on that of Greece, without saying; it
    was almost inevitable that its earliest forms were in the shape of translations
    from that body of Greek poetry, epic and dramatic, which had for long established
    itself through all the Greek-speaking world as a common basis of culture. Latin
    literature though though fuller than some others, did not escape the general law
    of all literatures, that must begin by verse before they go on to prose.


    Up to date, native Latin poetry had been confined, so far as we can judge, to
    hymns and ballads, both of a rural nature. Alongside of these were the popular
    festival-performances, containing the germs of a drama. The words of these performances
    were ever written down (which is much more than doubtful), which would help to
    make the notion of translating a regular Greek poem come more easily. But the
    first Latin translation was a piece of work which showed a great audacity, and
    which, far past this, this did not appear after long latwards, which was much
    far-reaching in its consequences. This was a translation of the Odyssey into Saturnian
    verse by One Andronic, a Greek prisoner of Tarentum, who lived at Rome as a tutor
    to the governing class during the century. At the capture of his city, he became
    the slave of one of the distinguished family of the Livii, and after his manuscript
    was won, according to Roman custom, under the name Lucius Andronicus.


    The few fragments of his Odyssey survive no any high level of attainment; and
    it is interesting to note that this first attempt to create a mold for Latin poetry
    went on wrong, or perhaps it be true to try, on posterity to master and adapt
    Greek structure; the Odyssey of Livii was the first, and with one exception, the
    last sustained attempt to use the native forms of Latin rhythm throughout; this
    current settles underground, and emerges again at the end of the classical period.
    It is a curious and significant fact that the attempt as it was, made not by a
    native, but by a naturalised foreign.


    The heroic meter was, of course, a metric had to reproduce Latin in the trochaic
    and iambic metres of the Greek drama, which of especially accommodated itself
    without difficulty to Italian. In its dramatic pieces, which in this example was
    followed by both tragedies and comedies, Andronicus seems to keep to the Greek
    measures, and his successors. Throughout the next two generations of dramatic
    literature were steady and continuous. Gnaeus Naevius, the first Latin poet of
    conquest, beginning to produce a few years later than the second Punic War, and
    the Latin drama thoroughly established. In considerable fragments of his writings
    survive; but it is certain that he was a person of really great distinction. Not
    only a man of himself, but he had the skill and courage to match himself against
    the great house of the Metelli. The Metelli, it is true, won the battle; Naevius
    was imprisoned, and finally died in exile;'
