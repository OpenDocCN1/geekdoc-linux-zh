    The Pervigilium Veneris is written in the trochaic septenarius verse which has
    been freed by the earliest Roman poets, but had since almost dropped out of literary
    use. With the revival of the trochaic movement long distance between metrical
    stress and spoken accent begin to break. The metre is indeed accurate, and even
    rigorous, in its quantitative structure; but instead of the prose and verses regularly
    clashing as in the hexeter or elegiac, they tend towards coinciding, and do entirely
    in one-third of the lines of the poem. We are on the very verge of the Latin poetry
    of the Middle Ages, and the affinity is made by the free use of initial and terminal
    ass, and of occasional rhyme. Use of stanzas with a recurring refrain was unpre;
    Virgil, following Theocritus and Catullus, employed the device with singular beauty
    in the eighth Eclogue; but this is the first instance of the refrain being added
    to a poem in stanzas of a fixed and equal length;;11] it is more than halfway
    towards the starts of an eleventh-century Provençal alba. The keen addition by
    Virgil was easily felt in a language where accidental rhymes come so as they do
    in Latin, but the rhyme here, so far as there is any, rather incidental to the
