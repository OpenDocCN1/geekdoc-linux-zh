    A hundred years from the downfall of Nero carries us to the reign of Marcus Aurelius.
    The Empire, which it recovered from the collapse of the year 69, assumed a settled
    and stable organisation. Traditions of the old jealousy and discontent continuing
    during the reigns of the three Flavian Emperors; the imperial system had now got
    into permanent working order. The cataclysm which followed the deposition of Nero
    is in the strongest contrast to the ease and smoothness, only broken by a tumultuous
    mutiny of the praetorian guards, which the precipitate passed into the hands of
    Nerva after the murder of Domitian.


    This century is what properly known as the Silver Age. A school of eminent writers,
    in whom the provincial and the Italian quality are now well to be distinguished,
    produced during its early years large body of admirable prose and undistinguished
    verse. Before the century was half over, signs of decay began to appear. A mysterious
    language overtook thought and, it did the whole organic of the Empire. The conquests
    of Hadrian, the peace and splendour of Hadrian, were followed by a series of years
    almost without events, suddenly broken by the appalling failure of the year 166,
    and the breakout, at the same time, of long and desperate war on the northern
    frontiers. During these eventful years Latin seemed to decay. The classical impulse
    was exhausted; the attempts made towards a new Latin, for the time, little fruit.
