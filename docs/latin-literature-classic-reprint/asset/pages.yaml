    The laborious perfection of excellence with which the taste of the time demanded,
    as a rule, lavish on little subjects, patient carvings in ivory. One side of the
    Alexandrian school was largely followed by that of the didactic—Ar, Nicander,
    Euophon, and a host of less celebrated. Cicero, in mature life, speaks with some
    contempt of the taste for Euphion among his contemporaries. But he himself, as
    a young man, followed translated the Phaenomena of Aratus into thoroughly polished
    and melodious verse.


    Not unaffected by this fashion of the day, but turning to it older and more noble
    models—Homer and Empedocles in Greek, Ennius in Latin—Lucretius introducing the
    scheme of a didactic poem dealing with the field of life and nature as inspired
    by the Epicurean philosophy. He lived to carry out his utmost work to completion.
    It here and there are discussed and not given; some paragraphs are repeated, and
    others have not worked within their proper place; but substantially, in the case
    of the Aeneid, we have the poem before us, and know well within it might have
    been altered or improved by full revision.


    As pure literature, the Nature of Things has all the defects inseparable from
    a didactic poem, and a poem which is not only didactic, but argumentative, and
    in parts highly controversial. Nor are these difficulties in the least degree
    smoothed or over by the poem. As a teacher, he is in deadly earnest; a controversalist,
    his first objective is to refute and convince. The graces of poetry are never
    for a moment allowed to enter with the full development of an argument. Much of
    the poem is a chain of intricate reasoning hammered into verse by sheer force
    of hand. The ardent imagination of the poet struggles through intractable material
    which genius could wholly wish into a metal pure enough to take perfect form.
    His language, in the prologue to the fourth part of the poem, shows his attitude
    towards his art very clearly.


