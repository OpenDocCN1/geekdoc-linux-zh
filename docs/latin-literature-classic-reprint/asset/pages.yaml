    Quintus Ennius, the first of the great Roman poets, and a poet of prodigious fecundity
    and versatility, was born at a small town of Calabria years later than Naevius,
    and as a young man in the Roman army, did not obtain the full citizenship years
    after Naevius’ death. For some years he lived at Rome, under the patronage of
    the great Scipio Africanus, besides occupied in keeping a supply of translations
    from the Greek for the Roman stage. Up to his death, at the age of seventy, he
    continued to write with undiminished fertility and effortless grace. He was the
    first in the Western world of the pure men of letters. Alongside his strictly
    literary production, he occupied himself with the technique of composition—grammar,
    spelling, punctuation, metre, even an elementary shorthand. Four books of miscellaneous
    translations from popular Greek authorised the reading public with several branches
    of literature hitherto known to scholars. Following the demand of the market,
    he translated comedies, seemingly with indifferent success. But his famous rested
    on two great works of tragedy, tragic epic, in both of which he far eclipsed his
    predecessors.


