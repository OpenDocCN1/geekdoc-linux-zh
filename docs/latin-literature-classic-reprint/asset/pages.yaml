    # VI.


    # THE LESSER AUGUSTANS.


    The impulse to Latin literature by the great poets and writers of the first century
    before Christ Germanicus ebbed slowly away. The end of the so-called Golden Age
    may be conveniently fixed in the year which saw the death of Livy and Ovid; the
    smaller literature of the period suffered no breach of continuity, and one can
    hardly name any definite date that the Silver Age begins. Until the appearance
    of a new school of writers in the reign of Rome, the history of Latin literature
    is a continuation of the Augustan tradition. It is continued by feeble hands,
    and dwindies away and more under several overtrained influences. These impulses
    are especially noted by the growing despotism of the Empire, which had already
    become grave in the later years of Augustus, and under his successors reached
    a point which made free writing, like speech, impossible; the perpetually increasing
    importance of the schools of declaration, which forced a fashion of overconstrained
    and unnatural rhetoric on both prose and verse; and the paralysing effect of great
    August writers themselves, who led poetry at all times to lose themselves in imitations
    within an arbitrary and rigid limit of methods and methods


