  md: '# Latin Literature


    language is still the necessary foundation of one half of human knowledge, and
    the forms created by Roman genius underline the whole of our civilisation. so
    long as mankind look before, and the name of Rome will be the greatest of those
    upon which backward gaze can be turned. In Greece men first learned to be human:
    under Rome first learned to be civilised. Law, government, citizenship, are all
    the creations of the Latin race. At a thousand points we still draw directly from
    the Roman sources. The codes of Latin jurists are the direct source of all systems
    of modern law. The civic organisation which it was the great work of the earlier
    Roman Empire to spread throughout the provinces is the basis of our modern institutions
    and our social life. The names of our months are those of the Latin year, and
    the modern calendar is, with one slight alteration, that established by Julius
    Caesar. The head of the Catholic Church is still called by the name of the president
    of a Republican college which goes back to the beginnings of ascertained Roman
    history. The architecture which we inherit from the Middle Ages, associated by
    an accident of history with the name of the Gods, its inherited under the Empire,
    traced down to modern times, step by step, from the basilica of Trajan and the
    palace of Diocletian. These are but a few instances of the inheritance we received
    from Rome. But behind the ordered structure of her law and government, and the
    majestic fabric of her civilisation, a vital force of even deeper import; the
    strong grave Roman character, which has permanently permeated the ideal of human
    life. It is in its literature that the inner spirit of the Latin race found its
    most complete expression. The structure of that imperial language they embodied
    the qualities which make the Roman name most abidingly great—honour, temperance,
    wisdom, humanity, courtesy, magnifying and the civilised world still returns to
    that fountain-head, and finds a second mother-tongue in the speech of Cicero and
    Virgil.


