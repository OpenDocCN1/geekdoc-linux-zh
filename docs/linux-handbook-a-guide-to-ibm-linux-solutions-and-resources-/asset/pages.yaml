  md: '# Specific value propositions for DB2 for zSeries


    zSeries customers can extend and leverage their current investment in hardware.
    Hundreds or even thousands of Linux operating systems can coexist with other operating
    systems on a single zSeries under VM. With VM, a customer can offer a complete
    Linux server environment to each application developer and still run host production
    systems on the same zSeries server.


    You can deploy new applications on Linux and still connect to their existing DB2
    data using DB2 Connect. You can also use IBM DB2 Connect on Linux for zSeries
    to consolidate all gateway connectivity processing at the host. This eliminates
    the need for middle-tier hardware.


    Customers can take advantage of the features specific to UNIX environments on
    DB2 UDB and DB2 Connect on Linux for zSeries, it is possible for vendor applications
    that are currently available for UNIX customers to leverage the zSeries platform.


    # Specific value propositions for DB2 for xSeries

    (Intel-Architecture server)


    xSeries customers can reduce their TCO. DB2 UDB on Linux for xSeries can run on
    low-cost hardware. also, customers are not locked into a proprietary operating
    system. DB2 Enterprise Extended Edition (EEE) for Linux allows customers to add
    extra capacity as needed for Web serving and data warehousing at a lower price
    than other clustering solutions that are currently available.


    Moreover, DB2 is the performance leader on Linux. DB2 is among the gtp 2 in a
