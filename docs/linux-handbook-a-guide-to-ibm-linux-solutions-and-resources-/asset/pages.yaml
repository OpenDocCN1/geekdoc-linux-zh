    # 5.5 Linux in a distributed enterprise


    Complex enterprises, such as retail stores and banks, often require computers
    in many sites. The applications run on many geographically dispersed machines
    and are managed remotely. Because of its low cost and small footprint, Linux on
    the xSeries is an excellent solution. In distributed enterprises, ease of use
    and ease of support are critical. Again, the xSeries and Linux are perfect for
    this situation because of their high availability and reliability. Linux is also
    a great solution as a standard application interface that links all applications
    on the xServers.


    For example, Linux provides Burlington Coat Factory with functionality that is
    the same or better than Windows NT at about 25% lower TCO, including hardware,
    software, operating system licensing, and support costs.


    > Note: At the time Burlington Coat Factory implemented the solution, Sun was
    charging for the Solaris operating system. However, Sun no longer charges a licensing
    fee for Solaris for low-end hardware.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'Linux provides a standardized interface for the deployment of applications,
    enabling a reduction in deployment time. With networked terminals, administrators
    can upgrade applications once per site, rather than once per computer. Linux provides
    Burlington Coat Factory with a standardized platform for the deployment of new
    applications, reducing application deployment time by about 50%. With Burlington
    Coat Factory''s Linux solution, application upgrades are about 400% faster with
    the thin client architecture because programs run remotely and administrators
    are not required to load as many applications.


    Distributed enterprise can reduce support requirements by maintaining one copy
    of an application at the server level, rather than maintaining multiple copies
    at the client level. In some cases, support time and personnel required may decrease
    by up to 90%. Aggregated over many stores or locations, some customers support
    savings can reach millions of dollars.


    # 5.5.1 Basic implementation strategies


    There are three basic implementation strategies for distributed enterprises:


    +   - Decentralization

    - Relocates information technology (IT) operations closer to the user

    - Delivers to the user from a local server that communicates to the user through
    a thin client


    +   - Centralization of corporate data assets

    - Provides significantly improved business control capabilities and rapid rollout
    and deployment of enhanced function


    +   - Application simplification

    - Provides identical application functionality to each user via thin client or
    kiosk

    - Reduces the management and maintenance of servers and applications

    - Reduces TCO'
