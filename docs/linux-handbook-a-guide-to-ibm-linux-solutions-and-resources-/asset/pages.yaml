  md: '# 3.2 Cost of ownership


    This section discusses TCO as it relates to the planning and implementation of
    Linux systems. It also contrasts TCO with return on investment (ROI).


    # 3.2.1 Total cost of ownership


    Vendors, consultants, and market research firms have done numerous total cost
    of ownership studies. As shown in Figure 3-1, most research seems to agree that
    there is a TCO advantage for Linux in long-term deployment and operation. Most
    research illustrates some type of savings with the deployment and operation of
    a Linux environment, although the amount of savings can differ greatly.


    ![](img/6b2be6cf94c5583e73925c180246991a_88_0.png)


    Figure 3-1 Typical Linux TCO study showing cost over time


    Many factors that can skew a simple TCO study. Such factors include:


    +   - A comparison of the Linux and non-Linux operating environment; also which
    Windows operating environment, UNIX operating environment, and Linux distribution


    +   - Whether a list price or deeply discounted price was used


    +   - Whether new hardware was configured into the TCO model


    +   - Whether a desktop deployment, enterprise deployment, or SMB deployment was
    used in the TCO model'
  merge: -1
  pgno: 88
- img_proc: true
  md: '+   The type of workload used in the TCO model, perhaps including collaborative,

    Web server, file server, or database server


    +   The software and applications used in the configuration


    +   Assumptions about administrative capabilities of the chosen configuration
    and

    t number of administrators needed


    +   The time frame the TCO model covers


    +   Whether support and service contracts were configured into the model


    +   Whether consideration was given to training a user when transitioning to

    different operating environment and the short term loss in productivity


    +   The sponsor of the study (to some degree)


    The cost savings of Linux may not always be as clear and simple as many open

    source advocates have proclaimed. You must factor in any hidden costs into the

    TCO model. Such hidden costs may include the skill level of the IT staff,

    complexity of applications, and the cost to migrate from another environment.


    The price of hardware and software alone provides only a small

    ication of the total lifecycle cost for an IT solution. The TCO life cycle includes

    all staffing costs associated with acquiring, maintaining, and removing an IT

    asset from an organization.


    There are numerous models to categorize the total cost of computing. You can

    break down the total cost of computing model into the following categories:


    +   Hardware

    Software

    Staffing


    +   - Development

    Support


    You can also break down the total cost of computing model into the following

    categories:


    +   Buy: Includes the lease or purchase decision

    Use: Setup, training, use, and technical support

    Dispose: Removing the asset, transfer data, and applications


    Most TCO models don''t include the cost of external communication, media,

    power consumption, floor space, etc. since they are somewhat similar. The key
    to

    tany TCO model is the categories to be measured and the quality of the

    measurements.


    You cannot calculate other key factors normally into a TCO model. Such factors

    may include complexity, scalability, security, manageability, frequency of software'
