  md: '# 3.1 Features, functions, and technologies


    With all of the features, functions, and technologies available for and within
    the various operating environments, it is difficult to provide a side-by-side
    comparison or accurate rating or ranking. The scope, depth, and breadth of the
    feature, or technology varies by vendor or distributor.


    We provide a high-level view of some of the major features, functions, and technologies
    that can be part of a purchasing decision. Each area that is listed can easily
    be broken down into several subcomponents and analyzed. Add-ons, additional products,
    and independent software provider (ISV) or third-party solutions can significantly
    change the perspective of the feature, function, or technology.


    We used the following guidelines to create a rating system of the high-level features
    or functions of Linux, UNIX, and Windows system:


    +   The Linux distributions were combined into a single entity, using the most
    recent standard distribution from the distributors. Only the major Linux distributions
    were analyzed. The intent was not to provide a side-by-side analysis of Linux
    distributions. Nor was the intent to provide a best-of-breed Linux distribution,
    taking the best features of each distribution.


    +   The UNIX operating environments were combined into a single entity, using
    the most recent versions. Only the major players or vendors in the UNIX operating
    environment, such as Sun Solaris, Hewlett Packard (HP) HP-UX, and IBM AIX, were
    analyzed. Again, the intent was not to provide a side-by-side analysis of UNIX
    distributions. Nor was not the intent to provide a best-of-breed UNIX distribution,
    taking the best features of each distribution.


    +   The Windows operating environment that was analyzed was Windows 2000. Windows
    NT and the Windows.NET were not included. Windows is the most prevalent operating
    system in the world today. Of the Windows versions that are running, approximately
    70% are Windows 2000.'
