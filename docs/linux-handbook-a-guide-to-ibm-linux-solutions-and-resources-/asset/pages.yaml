    publicly demonstrated DB2 for Linux running on 64-bit AMD Opteron-powered systems.


    For the 32-bit x86 platform, DB2 requires systems with Intel Pentium, Xeon, or
    Athlon later processors. DB2 is supported on any Linux distribution with 2.4 kernel,
