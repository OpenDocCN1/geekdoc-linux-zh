  md: 'Alternatives to some WebSphere products include:


    +   - **IBM HTTP Server (powered by Apache)**


    The evolving product of an open source project, Apache is the most widely used
    Web server in the world. It is available at no cost from the Apache project.


    The IBM WebSphere Application Server is totally compatible with the IBM HTTP Server
    (powered by Apache). In fact, Apache is the basis for the HTTPD server that is
    provided with the WebSphere Application Server. Apache is included as part of
    every Linux distribution. Support for Apache may be available from third-party
    organizations.


    You can find additional information about Apache at:


    ```

    http://httpd.apache.org/

    ```


    +   - **Tomcat**


    The evolving product of an open source project, Tomcat is the servlet container
    that is used in the official reference implementation for the Java Servlet and
    JavaServer Pages technologies. It is available at no cost from the Jakarta Tomcat
    project and is often included as part of most Linux distributions.


    For additional information about Tomcat, see:


    ```

    http://jakarta.apache.org/tomcat/

    ```


    +   - **JBoss**


    Written in Java, JBoss is a J2EE application server and EJB container. It is available
    at no cost from the JBoss Group LLC. Note that JBoss is not currently J2EE certified,
    although it is claimed to conform to EJB specifications. You can purchase support
    for JBoss from JBoss Group LLC.


    For additional information about JBoss, see:


    ```

    http://www.jboss.org/

    ```


    +   - **JRun**


    JRun is a proprietary J2EE application server that was developed by Macromedia.
    You can learn more about JRun on the Web at:


    ```

    http://www.macromedia.com/software/jrun/

    ```


    +   - **Commercial competitors**


    The other Linux-enabled competitors to WebSphere Application Server include Oracle
    Application Server, Sun ONE Application Server (formerly iPlanet), and BEA WebLogic.'
