    # 6.15 Linux and its relationship to AIX


    Linux can relate with AIX in two ways. There may be system environments in both
    types of relationships are present at the time.


    +   * The ability to run Linux applications as a value inside AIX 5L

    * The ability to have Linux-based pSeries frontend systems interacting with mission-critical
    AIX-based pSeries servers


