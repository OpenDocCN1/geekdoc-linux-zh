    # 1.6 Middleware


    Linux is currently seeing large growth in the middleware arena. Middleware is
    called the “glue” that holds IT applications together. It is typically divided
    into the following four areas.


    # Database


    Linux is quickly growing as a preferred platform for databases because of its
    low cost, stability, and extensibility. It also offers enterprise-level features
    such as load balancing and high availability clusters. The two most common database
    implementations are DB2 and Oracle 9 RAC.


    > Note: IBM DB2 Universal Database™ provides enterprise-level database features
    on Linux. For more information:

    http://www.ibm.com/software/data/db2/linux/validate/


    # Cross system support


    Most products with the “middleware” label are really software platforms that provide
    integration, transaction, development support to tie various IT services together.
    Linux is the operating system of support for middleware because it'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'open and flexible nature works well in the heterogeneous environment of modern
    IT networks. IBM offers two of the strongest examples of middleware:


    +   - WebSphere

    - MQSeries®


    > Note: The IBM WebSphere platform provides integration, transaction, and development
    support services while taking advantage of the open nature of Linux. To learn
    more about WebSphere, go to:

    http://www.ibm.com/software/info1/websphere/index.jsp


    # Knowledge discovery (KD) and collaboration


    Increasingly, a major task of middleware is to organize the information flow through
    a network, and not to manipulate and store it. Knowledge discovery refers to the
    integration of enterprise content management (ECM) and knowledge management (KM).
    It entails merging multiple technologies that originally (and individually) were
    responsible for capturing, locating, organizing, and delivering information.


    Collaboration includes all technologies that provide integrated messaging, calendaring,
    and task management. The open heritage of Linux provides a flexible platform in
    which to integrate the various knowledge discovery and collaboration tools.


    > Note: IBM provides knowledge collaboration products through its Lotus® line.
    Follow this link for more information about Linux and Lotus:

    http://www.lotus.com/


    # Systems management


    Systems management has increasingly become centralized and heterogeneous. With
    an decreased margin for downtime, middleware must incorporate the ability to monitor
    all systems at all levels of abstraction. Because Linux is open in nature, it
    offers a higher level of access to its internal workings than closed or proprietary
    systems offer.


    A management infrastructure built on Linux also takes advantage of its UNIX system
    heritage and many third-party and open source products that can provide additional
    functionality.


    > Note: IBM provides systems management middleware through the Tivoli software
    family. You can learn more about Tivoli on the Web:

    http://www.ibm.com/tivoli'
