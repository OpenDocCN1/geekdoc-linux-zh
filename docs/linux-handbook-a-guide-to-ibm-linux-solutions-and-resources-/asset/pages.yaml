    # Open source software


    “Open source” refers to any program whose source code is made available for use
    or modification as users or other developers see necessary. Historically, the
    makers of proprietary software generally did not make the source code available.
    Open source software is usually developed as a public collaboration and made freely
    available.


    This chapter introduces you to some key concepts of open source software. It also
    helps you to understand the relationship of Linux and IBM with open source.'
  merge: -1
