    Disk storage for the operating system and application code is shared by all 30
    virtual servers while they must be duplicated in the distributed case. Sharing
    the code offers two advantages, controlling the cost of disk storage, and ease
    of maintenance. Since only one copy of the code exists, it only has to be serviced
    in a single place. This results in savings in system management software as well
    as staffing. Although only one copy of the code is being used, 30 servers are
    in operation. In the distributed case, they will issue messages, which must be
    monitored, and so on, responded to. z/VM includes a programmable operator function
    (called PROP) that may be used for that to avoid the cost of additional software
    to perform the task. Additional systems management software is required in complex
    environments.


    z/VM also provides the ability to partition the disk space available to the servers
    increasing disk space without buying new disk. If there was free disk space on
    other servers, it cannot be moved to the server needing increased disk storage.
    In the IBM solution, z/VM provides the ability to partition disks into minisks
    that can be easily allocated to a server that requires additional disk space.
    Note that in e-mail applications, some mailboxes will grow at greater rates than
    others and may require expansion.


    Backup is done again by a backup client. In the IBM solution, it''s done by the
