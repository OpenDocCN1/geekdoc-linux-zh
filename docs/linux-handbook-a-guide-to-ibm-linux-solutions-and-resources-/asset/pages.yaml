  md: '# 4.1 S/390 and zSeries architecture


    The heart of zSeries and S/390 hardware is the multipitch module (MCM) that contains
    up to 20 processing units (PU). On other platforms, these are commonly referred
    to as central processing units (CPUs) or engines.


    The core elements of any computer are processing units. These contain the z/Architecture™
    logic and functions that implement the architectural extensions of S/390 ESA architecture.
    As implemented in the zSeries 800 and zSeries 900 models, each PU actually has
    dual internal instruction processors.


    Instructions are executed by both internal processors, in parallel, and the results
    are compared. If the results do not match, an instruction retry process is performed.
    This is all done automatically, by the PU, and is not visible to the operating
    system. The normal result of the dual processors in a PU is the execution of a
    single instruction stream.


    We normally treat a PU as a single processor and ignore the fact that there are
    two parallel processors inside each PU. PUs are used in one of five ways:


    +   * Central Processor (CP) PU: Used by the operating system for executing customer
    work


    +   * System Assist Processor (SAP) PU: A System Assist Processor is a PU that
    runs the subsystem Licensed Internal Code to control I/O operations. One of the
    SAPs in a configuration is assigned as a Master SAP and is used for communications
    with the multipitch module and the support element.


    In LPAR mode, all SAPs perform I/O for all logical partitions. The zSeries 900
    12-PU MCM models have two SAPs as standard. The 20 PU models have three SAPs as
    standard configurations.


    +   * Spare PU: This is a PU that is not enabled for any purpose. It uses this
    PU to replace a failing processor, if necessary. If all PUs (plus an SAP) are
    enabled, there are no spare PUs. Spare PUs may be used for various upgrade options
    such as Capacity Backup (BCU) and Customer Upgrade on Demand (CuOD).


    +   * Integrated Facility for Linux (IFL) PU: This method is restricted to running
    Linux or z/M.


    +   * Integrated Coupling Facility (ICF) PU: This method is used to run the Coupling
    Facility function for use in a Parallel Sysplex® environment.


    An IFL is a processor reserved for Linux (or Linux under VM). The significance
    is that it cannot be used to run other operating systems, and its existence is
    not reflected in the system model number, MIPS rating, or other power ratings.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'system model, MIPS, or other power rating method has significant implications
    for software costs. Adding an IFL does not affect these costs, permitting the
