  md: '# Preface


    IBM® has a strong commitment to Linux as an operating system and Linux-based solutions.
    This IBM Redbook gives a broad understanding of IBM products and how they relate
    to the Linux operating system. It tries to encapsulate the IBM Software Solutions
    that are available for Linux-based servers. It also describes the Linux enablement
    throughout the IBM @server product line.


    This IBM Redbook offers enough information to give a high-level understanding
    of Linux. Therefore, it is not meant to be a highly technical document. It also
    provides pointers to further sources of information.


    This redbook is intended for IBM representatives, Business Partners, and Customers
    who are involved in considering and planning Linux-based software solutions. You
    will find this redbook particularly helpful if you are planning to implement Linux
    in an enterprise.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization (ITSO), Rochester Center.


    ![](img/6b2be6cf94c5583e73925c180246991a_16_0.png)


    **Nick Harris** is a Senior Systems Specialist for IBM and has spent the last
    three years in the ITSO, Rochester Center. He specializes in LPAR, iSeries™ hardware
    and software, external disk, Integrated xSystems® Server for iSeries, and Linux.
    He also writes and teaches IBM classes worldwide on areas of AS/400 and iSeries
    system design and server consolidation. He spent 13 years in the United Kingdom
    AS/400 Business and has experience in S/36, S/38, AS/400, and iSeries servers.
    His e-mail address is mailto:niharris@us.ibm.com'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/6b2be6cf94c5583e73925c180246991a_17_0.png)


