    partitions can access data, tape, CD-ROM, and DVD resources in OS/400 partitions.
    With virtual I/O, Linux can leverage the performance availability and management
    of the iSeries storage architecture. iSeries can dynamically add, move, or delete
    disk space assigned to Linux partitions. The storage spaces for Linux are carved
    from the OS/400 IFS. This centralization of storage resources enables customers
    to extend their OS/400 disk subsystem, management skills, and best practices to
    Linux.


    For example, a full OS/400 system backup includes the virtual storage spaces used
    by the Linux partitions. Daily backups performed by Linux file-level/restore and
    can use the tape devices owned by OS/400.


    With shared processor and virtual I/O support, this translates a minimal requirement
    for a Linux environment. This translates into a minimal dollar investment to run
    Linux applications on the iSeries server.


    +   Reliability: The iSeries server is a very reliable server and can provide
