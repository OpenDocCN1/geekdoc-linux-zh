    High-performance computing performs calculations that are numerically intense
    and require high performance and a mass memory. The tasks are carried out by parallel
    execution of the independent processes.


    There are two types of high-performance computing: one that uses a library for
    message passing and the other that uses a job scheduler. When the library is used
    for message passing, an independent process is performed in two or more threads
    and processes.


    When the job scheduler is used, one application is simultaneously run in two or
    more nodes. Each node performs the process with a script or an exclusive tool.


