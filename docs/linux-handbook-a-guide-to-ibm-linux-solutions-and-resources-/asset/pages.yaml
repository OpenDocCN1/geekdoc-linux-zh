    # 4.1.1 Ways to run Linux on zSeries


    There are three ways to run Linux on the zSeries server. Each way is explained
    in the following sections.


    # Basic mode


    Linux can run on the entire machine, without any other operating system. In basic
    mode, you can use a single Linux image on the zSeries "bare metal".


    # Logical partition


    You can logically partition the zSeries hardware into a maximum of 15 separate
    LPARs. A single zSeries, for example, can host z/OS applications in one partition,
    VM and VSE applications in others, and Linux applications in additional partitions.


    # zVM


    A customer can run Linux as a virtual machine using zVM as a hypervisor. z/VM
    provides virtualization of CPU processors, input/output (I/O) subsystems, and
    memory. A customer running z/VM can run hundreds of Linux systems on a single
    zSeries. With zVM, for instance, a customer can offer a complete Linux server
    environment to each application developer and host production all on the same
    zSeries server. We discuss zVM and Linux in more detail later in this chapter.


    The decision on how to run Linux on zSeries is typically made based on the expected
    workload:'
  merge: -1
  pgno: 97
- img_proc: true
  md: '+   * Linux workloads with a large memory footprint and requiring extensive
    processing power may be best suited for running in an LPAR.

    * Few (if any) workloads require running Linux in basic mode.

    * Running Linux as a zVM guest offers the maximum flexibility. The number of Linux
    guests running under z/VM can be adjusted to meet workload requirements while
    maximizing usage of the zSeries hardware. Most customers choose this option to
    maximize their investment.


    #  4.1.2 31-bit and 64-bit options


    Linux solutions are available for the 31-bit and 64-bit environments. The option
    availability depends on the zSeries model and the Linux distribution.


    # Linux for S/390 (31-bit)


    Linux for S/390 is a 31-bit version of Linux. It currently runs Parallel Enterprise
    Server G5 and G6 and the Multiproise® 3000 processors. It also runs on zSeries
    models in 31-bit mode. Because of the 31-bit limitation, the addressable main
    storage is limited to 2 GB.


    # Linux on zSeries (64-bit)


    Linux on zSeries supports the new 64-bit architecture on zSeries processors. This
    is all zSeries 800 and 900 models. 64-bit support eliminates the 31-bit storage
    limitation of 2 GB.


    # 4.2 All about z/VM


    This explains the value, both business and technical, of running tens to hundreds
    of virtual Linux systems on z/VM.


    > Note: "VM" means virtual machine not virtual memory. The virtual machine concept
    found in the z/VM product provides the function-rich virtualization technology
    on the zSeries server. In the context of this, the virtual machine concept and
    virtualization technology are interchangeable. z/VM provides much functionality
    than partitioning of physical resources.


    IBM has been investing in virtualization technology for over 30 years. This is
    a proven, function-rich technology base that has benefited the Linux on zSeries
    environment since day one. Customers have run business-critical solutions on VM
    systems just as long.'
