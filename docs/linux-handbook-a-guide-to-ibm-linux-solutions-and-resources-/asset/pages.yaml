    #  4.2.3 Virtual networking with z/VM


    Virtual networks are a great way to connect guests running under z/VM. Virtual
    networks use z/VM virtualization to provide connectivity between guests without
    needing real hardware. Virtual networks enable fast and cost effective TCP/IP
    communication between z/VM Linux guests.


    > Note: Connectivity in a z/VM virtual network is limited to guests in a single
    z/VM image. Virtual networks cannot be used for inter-LPAR communication.


    Three types of virtual networks are available to Linux guests:


    +   * Virtual channel-to-channel (vCTC): vCTC networks provide point-to-point
    connectivity between guests without real channel allocation (as required for real
    CTC connectivity). A real channel-to-channel adapter is used to connect a real
    mainframe to another using the channel protocol.


    z/VM provides the ability to define virtual channel-adapters so users can connect
    virtual machines using the CTCA protocol. For z/VM, this is useful for connecting
    Linux virtual machines that do not support IUCV, such as V/ESA, S/390°, and z/OS.
    Virtual vCTC networks can connect Linux virtual machines.


    +   * Inter-user communication vehicle (IUCV): Point-to-point TCP/IP connections
    between guests can be established using IUCV. IUCV is a VM-unique, virtual machine-to-virtual
    machine communication protocol. The Linux for S/390 and zSeries kernels include
    an IUCV driver, allowing you to connect two Linux virtual machines.


    Linux treats IUCV connections as any other TCP/IP network connection. This results
    in memory-speed networking between the connected servers. The speed of the IUCV
    "line" is a factor of processor speed. The faster your z server, the faster your
    IUCV network is. When you upgrade to a faster processor, you automatically increase
    the speed of your virtual network. IUCV is also supported by z/VM''s own TCP/IP
    stack, so you can use IUCV to connect Linux images to VM''s TCP/IP stack.


    +   * VM Guest LAN: This type of network enables local area network (LAN) connectivity
    between z/VM guests. You can learn more about the details of VM Guest LAN in 4.2.4,
    "VM Guest LAN support" on page 80.'
