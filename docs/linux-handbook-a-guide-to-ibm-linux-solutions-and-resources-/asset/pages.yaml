  md: '+   Integration: The iSeries server provides integration between Linux applications
    and OS/400 facilities. Linux applications can access data stored in DB2 UDB in
    OS/400 and files stored in the OS/400 IFS.


    +   Performance: A single large iSeries server with multiple Linux environments
    can deliver a lower cost per user than multiple systems.


    +   Application flexibility: The iSeries server supports Java, Domino, UNIX, C,
    COBOL, RPG, WebSphere, and Windows server applications via xSeries connected servers.
    Also, with unique virtual disk support, the iSeries server provides an excellent
    Linux test or development environment.


    +   Resource sharing: The iSeries server can share resources between OS/400 and
    Linux partitions. This can reduce the cost of managing and supporting a heterogeneous
    environment. LPAR supports sharing and dynamically moving processor resources
    between OS/400 and Linux.


    iSeries offers Virtual Ethernet facilities to support partition-to-partition communication.
    With Virtual Ethernet, you can define up to 16 networks for application performance
    and do not require LAN adapters, switches, or physical networks.


