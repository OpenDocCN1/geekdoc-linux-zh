  md: '# 7.1 How Linux runs on the iSeries server


    The iSeries server provides the ability to run Linux in a logical partitioned
    environment. The primary partition must be running OS/400 V5R1 or later, which
    provides the support required to boot the Linux kernel in a secondary partition.
    The Linux operating system needs to be installed and run in a secondary partition.


    Partitioning the iSeries server supports multiple images of Linux and OS/400.
    It is available across the iSeries product line. For example, on a 1-way iSeries
    server, up to 31 Linux partitions can be supported. You can move processor and
    memory independently between partitions with a granularity of one hundredth (1/100)
    of a processor and 1 MB of memory. Shared processor resources can be dynamically
    moved between Linux and OS/400.


    | LPAR 1 | LPAR 2 | LPAR 3 | LPAR 4 | LPAR 5 |

    | :--- | :--- | :--- | :--- | :--- |

    | OS/400 | OS/400 | Linux | Linux | OS/400 |

    | V5R2 | V5R1 | Red Hat | SuSE | V5R2 |


    ![](img/6b2be6cf94c5583e73925c180246991a_201_0.png)


    Figure 7-1 iSeries with multiple partitions, two running Linux


    Beyond consolidating Linux, the iSeries server enables OS/400 applications to
    be extended with Linux. Linux applications can access DB2 Universal Database (UDB)
    as well as OS/400 programs and services through one of 16 high-speed virtual Ethernet
    LANs that connect the partitions. The iSeries server provides integration between
    Linux applications and OS/400 facilities. Linux applications can access data stored
    in DB2 UDB in OS/400 and can access files stored in the OS/400 integrated file
    system (IFS).


    The ability to integrate Linux and OS/400 applications on the iSeries server draws
    together the primary strengths of both operating environments. For example, the
    database capabilities of OS/400 and the Web serving qualities of Linux provide
    a powerful, consolidated computing environment.'
  merge: -1
