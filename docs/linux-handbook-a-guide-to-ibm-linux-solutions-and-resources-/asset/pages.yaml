- img_proc: true
  md: '# Grid computing


    Grid computing is the ability, using a set of open standards and protocols, to
    gain access to applications and data, processing power, storage capacity and a
    vast array of other computing resources over the Internet (not just within a physical
    cluster). The grid user looks at a grid and sees essentially one, large virtual
    computer.


    In this way, a grid can be seen as a metacluster. A metacluster is a collection
    of clusters that are interconnected with wide area network (WAN) technologies
    to provide seamless access to the combined resources of the grid. Grids are distinguished
    from conventional distributed computing by their focus on large-scale resource
    sharing, innovative applications, and in some cases, high-performance orientation.


    You can learn more about grid computing on the Web:


    http://www.ibm.com/grid/index.shtml


    # Autonomic computing


    Autonomic computing is an attempt to manage the complexity of IT systems by using
    the inspiration found in one of the most complex systems of the human body, the
    autonomic nervous system. The focus of autonomic computing is to design and building
    computing systems capable of running themselves. It requires, adjusting to varying
    complexities, and preparing their resources to handle most efficiently the workloads
    placed upon them.


    To me read more about autonomic computing, see:


    http://researchweb.watson.ibm.com/autonomic/


    # On demand computing


    On demand computing describes an environment where users own IT assets but can
    dynamically increase and decrease based on need. The main advantage for users
    is variable pricing based on usage, similar to the energy utility companies provide
    and bill for their services. In addition, the nature of on-demand computing allows
    users to outsource the management of such a demand-driven system to third parties.


    You can read more about demand computing on the Web:


    http://www.ibm.com/services/ondemand/index_flash.html


    # 9.5.2 The role of Linux clusters in emerging trends


    Linux clusters will serve grid computing by supporting the intensive computational
    and storage demands imposed by the distributive nature of the'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'grid. In addition, Linux clusters provide the least expensive way of providing
    the fault tolerance demands of any autonomic system. Linux clusters are the most
    cost-effective solution for providing the scalability requirements of on-demand
    computing.


    Another future view of Linux clustering is an HPC appliance. The HPC appliance
    will be based on super thin nodes, with little or no persistent storage. Nodes
    will be added to the cluster transparently, with a simple boot, which will make
    the node amenable to a migrated process. Since the nodes are thin, version skew
    will be eliminated, as will traditional cluster installation (putting an image
    on every node).


    The HPC cluster of the future should be "open from the ground up", because it
    will be based on LinuxBIOS technology. The ramifications of putting Beowulf 2
    technology, such as Scyld, on top of a LinuxBIOS platform will be very close to
    the HPC appliance.'
