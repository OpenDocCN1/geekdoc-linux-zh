    the AIX Toolbox for Linux Applications. By allowing Linux applications to be easily
    compiled for AIX with the AIX Toolbox for Linux Applications package, IBM is expanding
    the available portfolio. In addition, AIX can now take advantage of the growing
    Linux skill base.


    Furthermore, Linux and AIX are complementary operating systems. AIX is the strategic,
    proven, mission-critical operating system for the pSeries. Linux is a highly portable
    operating system that supports all IBM platforms. IBM expects to see many installations
    running Linux (on xSeries or pSeries hardware) as the front end to mission-critical
    AIX systems running DB2 and other enterprise applications.


    As you see, AIX is the strategic operating system for the pSeries server. It contains
    such enterprise features for scalability and Remote Access Security (RAS) that
    will take years to materialize on Linux. Many AIX capabilities and features from
    other IBM operating systems are being added to Linux. Linux will mature into a
    complete enterprise operating environment.


