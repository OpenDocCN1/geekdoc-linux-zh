    # 4.6 How IBM Customers and S390 are using Linux


    The z390 servers are capable of running several operating environments. z/OS,
    S390, and VM can provide leading reliability and stability. The system has evolved
    over 30 years and can run most integrated applications. In the IT world, zSeries
    is often called the “Big Iron” to describe its mainframe character and uniqueness
    in the market.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Today many different applications are available for the zSeries. The following
    sections describe a few of the Linux-related architected solutions.


    # 4.6.1 T-Com


    T-Com, a division of the Deutsche Telekom AG, Germany''s former public telephone
    provider, chose Linux on zSeries to implement a high availability environment
    for its internal Web platform and mail services. Previously these services ran
    as UNIX on 25 Sun servers. T-Com went to Linux on zSeries because of the combination
    of the open system and mainframe technology ensuring scalability and high availability.
    Using the Linux on zSeries solution, T-Com significantly decreased operating costs,
    floor space, and infrastructure expenditures.


    By consolidating 25 Sun servers onto a zSeries mainframe running Linux, Telekom
    improved their IT system and increased the availability of software programs.
    Their overall availability, disaster recovery preparedness, and security has increased
    because the mirrored mainframe architecture facilitates disaster protection and
    recovery in three locations.


    Backups can run in real time at different locations. That way, in case of failure
    of a computing center, another computing center can take over the workload. This
    is an important criteria for an IT service provider and its customers. The open
    structure of Linux helps to integrate applications smoothly with low administration
    costs. Resources are available quickly due to good scalability and flexibility.
    Over 40 percent less utility space and 50 percent less energy consumption are
    a welcomed advantage to Deutsche Telekom.


    An S/390 type 2064-102 with two additional, dedicated Linux processors are used
    for the production systems. Two dozen Linux partitions run under the hypervisor
    operating system VM, on which production, backup, and test environments run Linux
    for zSeries (S/390). The Perl-based applications, which were consolidated on the
    mainframe, support the operation of utility servers and mail backup services.
    In the future, T-Com plans to port their domain name servers onto the mainframe.


    For the complete story, see:


    ```

    http://www.ibm.com/servers/eserver/zseries/news/pressreleases/2002/zlinux_deutschetele_07-19-02.html

    ```


    # 4.6.2 Boscov''s Department Stores


    Boscov''s is a private, family-owned department store that currently operates
    37 stores in Pennsylvania, Delaware, New Jersey, New York, and Maryland in the
    United States. All of the stores are within an approximate 300 mile radius of
    the'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'company''s headquarters and the central distribution center in Reading, Pennsylvania.
    Currently, the company has about 9,000 full- and part-time employees, excluding
    seasonal help. With an annual revenue of $1 billion U.S., it has been acquiring
    stores, opening new stores, and catering to a local customer base.


    Boscov''s needed to stop the increasing growth of their Windows NT server farm
    and support staff while improving availability, scalability, the backup and recovery
    for many different applications. Boscov''s also needed to support the growth in
    existing CICS®, DB2, and IMS business-critical applications on z/OS v1.1, as well
    as all new critical application software for Linux on zSeries.


    Boscov relied on mainframes for key business applications for many years including
    S/390, CICS, DB2, and IMS. The mainframe traditionally offered the characteristics
    needed for their business-critical computing such as CICS and DB2. When IBM added
    the ability to host the Linux operating system on their zSeries and S/390 mainframes,
    it enabled the mainframe''s high quality of services to extend to the and many
    existing distributed applications running within the server farm. The company
    evaluated the mainframe-based Linux solution capabilities and benefits, which
    includes its unparalleled flexibility, processing power, and ability to host e-commerce
    applications running under WebSphere Commerce Suite. Next, they decided to consolidate
    the server farm applications onto the mainframe running for zSeries and S/390
    Version 5.1.


