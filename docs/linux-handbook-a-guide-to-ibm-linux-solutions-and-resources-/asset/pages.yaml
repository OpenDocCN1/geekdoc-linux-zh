    # ## 11.2.3 Wine ‘is not an emulator’


    Wine is an open source software initiative that systematically re-implements the
    Win32 API under Linux. Wine makes it possible for Linux PCs to run Windows applications
    as if they were native. Although some users call Wine a Windows emulator, the
    company has gone to great lengths to dispel this notion. Even its name, Wine means
    “Wine Is Not An Emulator”.


    Wine implements Windows32 and Win16 APIs on Linux. In other words, it acts as
    a compatibility layer. Wine does not require Microsoft Windows. Its code is 100%
    Microsoft-free, but it can optionally use system link libraries (DLLs) if they
    are available.


    In mid 2002, Wine consisted of over 1 million lines of C code, written by more
    than 300 developers from dozens of countries or regions around the world. Wine
    implements more than 90% of the calls in popular Windows specifications such as
    ECMA-234 and Open32.


    Wine is still under development. It can run some programs flawlessly, while others
    are not fully supported. For further details on these programs, see the Wine Web
    site at:


    ```

    `http://www.winehq.com`

    ```


    # ## 11.2.4 Trying Linux without installing it


    There are a few products that allow you to experience Linux without installing
    it permanently. This section documents a sample of the demo CDs that are available.
    Some of these are quick installations of Linux, while others enable you to run
    Linux by booting the CD (without installing it).


    # ### WinLinux


    WinLinux is a system that installs like a Windows application, automatically detecting
    and configuring most of your hardware devices.


    You do not have to put your existing data and files to install WinLinux 2003 because
    it shares free hard drive space with Windows. That means you do not have to create
    additional hard drive partitions. You can start WinLinux 2003 just'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'as you start any other Windows application. After it is installed, the next
    time you restart your computer, you can choose between starting Windows or WinLinux.


    WinLinux works independently from Windows. After you install it, you can remove
    Windows from your computer keeping your original files.


    # DemoLinux


    DemoLinux is dedicated to the production of CD-ROMs (the DemoLinux CDs) that allow
    you to run Linux without installation, disk partitioning, and other hassles that
    usually prevent you from trying Linux. The site has three downloadable ISO images
    of Linux. Version 1 is based on Mandrake, version 2 is based on Debian, and version
    3 is the latest at the time of this writing and is also based on Debian.


    For details, visit the DemoLinux Web site at:


    ```

    http://www.demolinux.org

    ```


    # Knoppix


    Knoppix is a bootable CD with a collection of GNU/Linux software, automatic hardware
    detection, and support for many graphics cards, sound cards, SCSI USB devices,
    and other peripherals. KNOPPIX can be used as a Linux demo, educational CD, rescue
    system, or adapted and used as a platform for commercial software product demos.
    It is not necessary to install anything on a hard disk. Due to on-the-fly decompression,
    the CD can have up to 2 GB of executable software installed on it.


    For details or to download the software:


    ```

    http://www.knoppix.org

    ```


    # SuSE evaluation CD


    You can find a "live evaluation" from SuSE on the Web:


    ```

    http://www.linuxuxiso.org

    ```


    Click the SuSE 8.1 live evaluation image.


    # 11.3 Desktop deployment options


    We assume that you have already determined you are a good candidate for a Linux
    conversion. This means your users do not have applications that solely depend
    on a Windows operating system. You also have users that do not strictly depend
    on Microsoft Office.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'Now you need to consider what solution is the best fit for a migration. There
    are several options to consider when deciding how to deploy Linux desktops:


    +   * What kind of users do I have?

    * How many applications are required for my daily business?

    * What resources and time do I want to dedicate to administrating workstations?

    * How much control am I willing to relinquish to the end users?

    * What security issues are involved and how do I manage them?


    # ## 11.3.1 Thin client or PDA


    A thin client is a network station, smaller than a desktop PC. It is similar to
    a dumb terminal because it is dependent on a server for applications and for performing
    the bulk of the data processing load. A thin client is a network computer without
    a hard disk drive. A fat client includes a disk drive and may operate independent
    of server.


    Possible operating systems include Windows Terminal Server, Citrix Metaframe,
    or Linux Terminal Server Project (LTSP).


    ![](img/6b2be6cf94c5583e73925c180246991a_326_0.png)


    When looking at thin clients, there are several considerations relating to their
    deployment:


    +   * Deploy for users with limited number of applications

    * Cost of workstation: Low

    * TCO: Low (least expense)

    * Cost of software maintenance – installation and updates: Low

    * Type of users: General system users

    * Client type: Specific function, transaction

    * Number of applications: Low

    * Type of applications: Transaction-based, word processors, browser, e-mail

    * Application choice for end: None

    * Probable misuse: Low vulnerability

    * Exposure to viruses: Low vulnerability

    * Security of workstation: Good, all data is stored on the server'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 11.3.2 Fat client: Quality desktop


    A fat client is a client desktop PC that performs the bulk of the data processing
    load. It contains a hard drive where it stores both applications and data. Although
    the data may be stored on the server, the client executes the applications and
    performs calculations.


    ![](img/6b2be6cf94c5583e73925c180246991a_327_0.png)


    Possible operating systems include Windows 2000, XP, or the Linux Desktop.


    When looking at fat clients, there are several considerations relating to their
    deployment:


    +   - Deploy for users with high application requirements

    - Cost of workstation: High (most expensive)

    - TCO: High (most expensive)

    - Cost of software maintenance – installation and updates: High

    - Type of users: Advanced, MIS/Tech support/developers, dual PC

    - Client type: Technical, business projects, MIS, IT

    - Number of applications: High

    - Type of applications: Technical, engineering, business, office, project

    - Application choice for end user: Flexible

    - Probable misuse: High vulnerability

    - Exposure to viruses: High vulnerability

    - Security of workstation: Average, data may be stored on a local PC


    # 11.3.3 Inexpensive client


    The inexpensive client has the same characteristics of the fat client. However,
    it is a low-cost alternative that may be bought in bulk quantities. It may not
    have the latest processor, memory, or hard drive capacity as a high quality desktop
    PC.


    ![](img/6b2be6cf94c5583e73925c180246991a_327_1.png)


    Possible operating systems include Windows or Linux Desktop.


    When looking at inexpensive clients, there are several considerations relating
    to their deployment:


    +   - Deploy for general users

    - Cost of workstation: Low

    - TCO: Moderate

    - Cost of software maintenance – installation and updates: Moderate to high

    - Type of users: General system users'
  merge: -1
  pgno: 327
- img_proc: true
  md: '+   - Client type: Office, documentation research

    - Number of applications: High

    - Type of applications:

    - Application choice for end user: Flexible

    - Probable misuse: High vulnerability

    - Exposure to viruses: High vulnerability

    - Security of workstation: Average, data may be stored on a local PC

    - Misuse: Unauthorized download of programs, Web browsing, e-mail, chat, etc.


    # 11.3.4 Packaging and updating Linux


    Although there are multiple methods to update libraries or add patches to a running
    Linux system, the method used by most distributions is Red Hat Package Manager
    (RPM). Some distributions have update techniques specific to their distribution,
    such as the deb package files used in the Debian distribution.


    Most distributions also have an automatic update feature that downloads and installs
    the package. To update the package, you download it, unpack it, and compile the
    code so it part of the binary (executable). With the tools now available, this
    is often done for you by the distribution''s update and installation utility.


    # Red Hat and RPM


    RPM and the Debian package system Deslect are the most frequently used methods
    for handling packages under various Linux distributions. RPM may only be used
    if the program you are installing is supplied in the RPM format. It is included
    with several distributions including Red Hat, SUSE, and Caldera.


    Under Red Hat, you can choose to install packages via a GUI interface or from
    a terminal prompt using the RPM command. RPM allows you to install, uninstall,
    upgrade, query, and verify packages.


    # SuSE and YOU


    SuSE has an automatic update feature via the YaST2 Online Utility (YOU). This
    applies to products sold with one-year maintenance.


    First you register on the SuSE Web site, point your YaST utility to the YaST URL
    as the installation source, and start the program. For the YaST Update to work,
    you must have a direct connection to the Internet. The YaST utility automatically
    downloads the required updates for your configuration and installs them.


    You can use the same utility to update the SuSE Linux Office Server (SLOS).'
