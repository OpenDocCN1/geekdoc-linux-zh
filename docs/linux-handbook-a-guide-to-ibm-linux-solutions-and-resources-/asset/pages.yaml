    # 11.1.2 StarOffice and Open Office


    Although it is possible to run a variety of office suites under Linux, only two
    major suites are currently in use: StarOffice and its follow-on product OpenOffice.
    Both of these office suites can open and save most documents originally created
    in the Microsoft Office format. They can be saved in their original format or
    in the OpenOffice or StarOffice file format.


    StarOffice, from Sun, Inc., is available from selected retailers for about $80
    U.S. StarOffice runs on multiple operating systems, including the Solaris operating
    environment, Microsoft Windows, and Linux. This office suite contains full-featured
    applications with word processing, spreadsheet, presentation, graphics, and database
    capabilities. StarOffice is also fully compatible with other suites, including
    Microsoft Office.


    In Asian markets, Star is marketed under the brand name StarSuite. Apart from
    the name, there are no functional differences between the two products. Sun''s
    StarSuite 6.0 and StarOffice 6.0 files are interchangeable and compatible. The
    primary functionality difference of StarSuite 6.0 Office Suite is the support
    for Unicode and linguistic support for Chinese (Traditional and Simplified), Japanese
    (Kanji), and Korean.


    OpenOffice shares the same core base as StarOffice 6.0. This office suite contains
    a word processor, spreadsheet, presentation software, equation editor, and a drawing
    program. It opens major formats such as Microsoft Office, saves to PDF, has comprehensive
    help, and offers spell check in 15 languages.'
