- img_proc: true
  md: '# 9.2 Linux cluster components


    Much focus is given to computers (or nodes) that make up a cluster. Just as important
    are the communication and storage technologies that work to support the cluster,
    and the management software that keeps the cluster running properly.


    The cluster applications themselves provide the high availability and resiliency
    necessary in a cluster. Throughout this section, we match general cluster areas
    of Cluster 1350. This is similar in architecture to the earlier Cluster1300, but
    uses the Intel Xeon processor.


    # 9.2.1 Nodes


    Clusters (especially high performance clusters) typically have a large number
    of computers. In general, most of the nodes are configured identically. The goal
    of identical configuration is that the individual tasks that make up a parallel
    application run equally well on the node to which they are assigned. However,
    some nodes in a cluster often have physical and logical differences.


    The following sections discuss logical node functions and the physical node types.


    # Node functions


    A cluster is two or more (often many more) computers working as a single system
    to provide services. Although, from the outside, the cluster may look like a single
    system, the internal workings to make this can be quite complex. The logical functions
    that are explained in the following sections are found in most clusters.


    These are logical functions. In some cases, multiple logical functions may reside
    on the same physical node. In other cases, a logical function may be spread across
    multiple physical nodes. Do not underestimate the importance of cluster management.
    Cluster management is imperative when coordinating the activities of large numbers
    of systems.


    # Compute node


    The compute node is where the real computing is performed. The majority of the
    nodes in a cluster are typically compute nodes. Based on the scheduling of the
    cluster, the compute node that is given one or more tasks to execute is part of
    the overall solution.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'Note: The compute node in the IBM Cluster 1350 is the xSeries 300 Model 330.
    The Model 330 is designed for space efficiency and usability in a rack environment.
    It is a 1U server with one or two Intel Pentium III processors. The system also
    has a 133 MHz front-side bus, integrated Ultra160 SCSI interface, two integrated
    10/100 Ethernet NICs, and two 64-bit/33 MHz PCI slots (one full-length and one
    half-length).


    # Control node


    Control nodes provide services that help other nodes in the cluster work together
    to obtain the desired result. Control nodes can provide two sets of functions:


    +   - Infrastructure services like DHCP, DNS, and similar functions for the cluster:
    These functions enable the nodes to be easily added to the cluster and to ensure
    that they can communicate with the other nodes.


    +   - Scheduling tasks are to be done by what compute nodes: For example, if a
    compute node finishes one task and is available to do additional work, the control
    node may assign that node the next task that requires the work.


    Note: Either an xSeries 300 Model 330 or 342 can be used as a cluster node.


    # Storage node


    For most applications that are run in a cluster, compute nodes must have fast,
    reliable, and simultaneous access to the storage system. This can be accomplished
    in a variety of ways depending on the specific requirements of the application.


    In some cases, storage may be direct-attached to compute nodes. In other cases,
    the storage requirements may be filled by one or more network shared devices.
    In this case, storage nodes enable and control access to the storage subsystem.


    Note: The storage node of Cluster 1350 is the xSeries 300 Model 342. The Model
    342 is a 3U server with one or two Intel Pentium III processors. To three disks
    per node can be configured with 18, 36, or 72 GB disks.


    With an optional ServeRAID™ 4L adapter, mirroring of disks is possible. The node
    includes an integrated Advanced Systems Management processor for hardware control
    and management.'
