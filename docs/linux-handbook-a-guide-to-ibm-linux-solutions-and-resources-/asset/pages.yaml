  md: '# 1.4 Infrastructure


    Linux enters the mainstream markets by providing critical infrastructure services.


    # Web serving


    The combination of Linux and Apache offers an attractive package for customers.
    It provides a low cost, flexible solution originally for static Web sites, with
    over 30% of the world''s Web sites running this combination. The demand is now
    moving toward a more dynamic approach with Web sites that users can interact with
    and that support high transaction rates.


    # File and print serving


    One of the basics for Linux implementation is the provision of inexpensive facilities
    such as file and print services. Linux offers a rapid return on investment (ROI)
    in this part of the infrastructure space. The management capabilities and low
    cost make this an easy solution to justify. Also, this is an important environment,
    but it does not typically have the operational importance of line-of-business
    applications. It is a relatively safe place for businesses to test this new technology.


    # Domain name server (DNS) and DHCP


    As a UNIX-clone, Linux is well proven at hosting Berkeley Internet Name Daemon
    (BIND) name servers and Dynamic Host Configuration Protocol (DHCP) services.


    # Router


    Linux is capable of advanced routing using inexpensive commodity hardware. Also,
    some router vendors have chosen Linux to be their embedded system.


    # Firewall and Intrusion Detection Services (IDS)


    Linux has a popular provider of firewall and IDS services. Because of the advanced
    configuration and customization options, along with a small memory footprint,
    Linux has been an ideal solution for many organizations who want to avoid proprietary
    solutions.


    # 1.5 Data storage


    The explosive growth in data storage needs has driven Linux into a premier position
    as a low-cost, efficient, and highly customizable platform to handle storage management.
    In particular, Linux is being used in Internet Small'
