    # Security


    The Linux server is used as a gateway server or file server in many cases in an
    Internet infrastructure. Although there are no reports of virus infection in Linux
    environments at present, when a transaction that passes through a Linux gateway
    contains a virus, and the data resides in a Linux file server, the Windows system
    machine using the data can suffer damage.


    The xServers server offers a low-cost, secure foundation for your investment in
    Linux infrastructure and business applications. By providing hardware security
    features, self-healing, and self-diagnostic services, as well as secure remote
    administration and monitoring, the xServers server is the platform for those who
    need to implement a secure system infrastructure.'
