    # 7.5 Linux in a distributed enterprise


    Running Linux on the iSeries server combines the strengths of Linux and OS/400
    for an integrated solution. Linux delivers excellent open source solutions, while
    OS/400 is a premier integrated platform for business solutions. Linux enables
    a new stream of e-business applications for the iSeries platform that complements
    its strength as an integrated core business solution. Linux applications benefit
    from the iSeries platform''s ability to provide resource flexibility, reliability,
    and connectivity to other applications on a single server.


    When deploying Linux on an iSeries server, you can use the same base configuration
    each time. Linux is run in LPAR, so you always need an OS/400 primary partition.
    When you have a hosted Linux partition the primary partition can be the hosting
    partition. Therefore, the best scenario is an iSeries server with a heterogeneous
    combination of Linux and OS/400 partitions.


    It is possible to deliver a reliable all-in-one-box integrated solution to end
    users in a distributed enterprise. Implementation, in which each operating system
    is used for its intended purpose. Figure 7-3 shows an example of such OS/400 can
    be the best for business applications. Through the years, it has proven to be
    reliable. Linux on the other hand, has proven to be a stable operating system
    for (inter) networking in general, as providing firewall functions.


    In this example, LPAR is leveraged to support numerous operating environments
    on one iSeries server. Typically such environments as firewalls and Internet servers
    are installed on their own servers. Figure 7-3 shows that one iSeries server can
    support five different servers. Also how virtual and I/O in a Linux environment
    can be leveraged. The firewall interfaces with the Internet has a dedicated LAN
    adapter. The other resources needed by this partition (disk, tape, CD-ROM, and
    LAN) are virtual. Virtual LAN is also used to provide a direct connection to the
    Web-serving partitions.


    Two Web-serving partitions running a commerce or business-to-business application
    can provide a load balancing and high availability environment. The Web-serving
    partitions are then connected to a second firewall via different'
  merge: -1
