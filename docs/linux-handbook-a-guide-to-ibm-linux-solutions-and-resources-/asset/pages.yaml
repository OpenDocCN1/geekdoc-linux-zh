    # # 1.9.1 What is a distribution


    What is widely referred to as *Linux* is more accurately called a "distribution"
    or "distro" for short. Technically, Linux is only the core of the operating system
    or the kernel. Linux distributions are prepackaged collections of software, generally
    comprising the kernel and other packages.


    The major distributors include a graphical desktop environment and an installation
    program to help you get started. The kernel (for which the source code is freely
    available) is managed by Linux Torvalds and a leadership team. Many developers
    contribute to updating the kernel with new features as well as device drivers.
    The packages that can be added to the system include compilers, shells, and other
    applications. Not all of these packages may be available as open source. You can
    learn about open source in 1.9.3, "What is open source" on page 21.


    A Linux distribution includes the Linux kernel plus utilities, programming tools,
    window managers, and other software that make up a full operating system. Distribution
    companies, such as SCO, Red Hat, SuSE, and Turbolinus, and non-commercial organizations,
    such as Debian, download the latest open source'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'packages from the Internet. Then they add utilities, such as installation programs,
    and package them on a CD-ROM with a manual. The kernel code in each distribution
    may be different since distributions pull Linux Standards Base attempt to standardize
    the aspects of the distribution to minimize the changes that affect portability.


    A distributor (such as Red Hat) is a company who packages a Linux distribution
    for commercial purposes. They technically do not resell the software license,
    but rather sell a subscription service for support and maintenance. Generally
    these are one-year subscriptions. Distributors also sell Linux consulting and
    integration services. They may sell applications or middleware in addition to
    the Linux operating system.


    # Application compatibility


    In the vast majority of cases, Linux applications are compatible with all distributions
    of Linux, which accounts for the aphorism "Linux is Linux". When a new kernel
    is released, it is uploaded to the main kernel site:


    http://www.kernel.org


    The distribution companies package the kernel and provide it with an update on
    their own Web sites. Distribution vendors take the kernel as is, with all changes
    and fixes that are contributed by members of the development community. The speed
    of distribution release has slowed considerably in the last few years. At one
    point, new distributions were released twice a year. With the emphasis on the
    enterprise class distribution and wide range of products running or under Linux,
    the pace of releases has slowed considerably.


    Each distribution categorizes its products uniquely. For example, Red Hat divides
    its products into enterprise, small/medium business, and home versions. SuSE has
    two divisions: business and private. Turbinolux showcases its products in a single
    group as The SCO Group. Where possible in this chapter, we separate the products
    into business and workstation markets.


