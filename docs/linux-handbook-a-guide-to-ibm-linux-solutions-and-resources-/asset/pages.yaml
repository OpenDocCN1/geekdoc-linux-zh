  md: '# # Linux Handbook


    ## Guide to IBM Linux Solutions and Resources


    # ### Discover the IBM Software solutions for Linux-based servers


    IBM has a strong commitment to Linux as an operating system and Linux-based solutions.
    This IBM Redbook gives a broad understanding of IBM products and how they relate
    to the Linux operating system. It there to encapsulate the IBM Software Solutions
    that are available for Linux-based servers. It also describes the Linux enablement
    throughout the IBM @server™ product line.


    ![](img/6b2be6cf94c5583e73925c180246991a_345_0.png)


    # ### Understand how Linux operates on each IBM @server


    # ### INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    ### BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    # ### Learn about IBM resources for implementing Linux solutions


    This IBM Redbook offers enough information to give you a high-level understanding
    of Linux. Therefore, it is not meant to be a highly technical document. It also
    provides pointers to further sources of information.


    This redbook is intended for IBM representatives, Business Partners, and Customers
    who are involved in considering and planning Linux-based software solutions. You
    will find this redbook particularly helpful if you are planning to test implement
    Linux in an enterprise.


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT more effectively in your environment.


    For more information: ibm.com/redbooks'
