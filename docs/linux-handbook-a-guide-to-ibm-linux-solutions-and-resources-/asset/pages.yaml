    # 9.5 The future of Linux clusters


    Clusters are now used the building block of other emerging IT models and technologies.
    In this way, clusters are becoming components for large projects, as opposed to
    the traditional view of a cluster as a stand-alone system that performed a specific
    computing role.


    # 9.5.1 Emerging trends


    There are three major emerging trends that rely extensively on the features provided
    by Linux. These trends are explained in the following sections.'
