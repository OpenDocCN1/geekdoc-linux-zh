    # 6.1.4 Options to run Linux on the pSeries server


    Customers have many choices with the pSeries servers. They can run Linux applications
    under AIX or as an operating system per server (similar to unpartitioned Intel
    servers). Or Linux can run as a partition among other Linux AIX partitions. The
    variations are endless. This gives you a great deal of flexibility to manage and
    possibly optimize your hardware resources.


    This section covers both non-partitioned and partitioned Linux servers.


    # Linux on the pSeries


    We assume that you have selected a Linux application that does not suit the AIX-5L
    approach. Plus you want to run the application on a separate server. This can
    be indicative of the real environment where a dedicated server is installed to
    run specific a application.


    Linux applications can run in pSeries LPAR by simply installing the Linux operating
    system.


    While the AIX Toolbox for Linux Applications offers an excellent way to make Linux
    applications available on pSeries servers, there may be cases when it is preferred
    to run them under a Linux operating system instead of AIX.


    The process is simple:


    +   1. Select the Linux application that is supported by one of the Linux Distribution
    Partners (LDPs). Linux applications are frequently available as a demo or trial
    download for testing.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '+   2. You size and select pSeries models that supports Linux and meets your
    needs from one of the Linux Express models, the pSeries 630 or 650.


    +   3. Then you order the hardware, Linux distribution, Linux application, and
    necessary support contracts.


    These Express models are not shipped with the Linux operating system pre-loaded.
    Also, AIX is not required for this solution.


    This approach also applies to any other Linux applications that a pSeries customer
    may run that are not available with the AIX Toolbox for Linux Applications.


    # Linux in LPAR on a supported pSeries server


    The LPAR capabilities of the pSeries server make it possible to run one or more
    instances of Linux along with AIX. This provides a convenient way to begin developing
    and deploying Linux operating system-ready applications as desired, while retaining
    the enterprise-ready capabilities of AIX for mission-critical or highly-scalable
    workloads. LPAR also allows large pSeries servers to be partitioned to Linux only
    workloads.


    First lets look some terminology.


    +   **LPAR**: This is the shortened version of the familiar logical partitions.
    It is widely used in zSeries, iSeries, and pSeries to indicate that a server can
    run multiple separate operating system instances.


    +   **Static LPAR**: This term applies to a pSeries server or partition. It indicates
    that the server does not support the rearrangement of resources without powering
    down. The same restriction applied to early releases of iSeries LPAR. All pSeries
    Linux partitions are static.


    +   **Dynamic LPAR (DLPAR)**: This term indicates that a partition accepts certain
    rearrangements of resources. Partitions running AIX and AIX-5 applications can
    have dynamic movement of processors and memory between partitions.


    +   **Hypervisor**: This is the underlying control mechanism that sits between
    the physical hardware and the operating systems. The hypervisor owns and creates
    partitions by allocating these resources and sharing them.


    AIX is not required to partition the machine, and it is not required to install
    and run Linux. AIX provides much greater features for hardware analysis, intelligent
    fault detection, and error logging.


    For more information, visit the pSeries Web site at:


    ```

    http://www-l.ibm.com/servers/eserver/pseries/linux/

    ```'
