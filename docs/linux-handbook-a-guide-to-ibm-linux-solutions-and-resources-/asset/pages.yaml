- img_proc: true
  md: 'Virtual machine technology was introduced with the IBM System/360™,, the original
    mainframe, back in the mid-1960s. At time, VM (known as CP-67) enabled users of
    S/360 systems to run multiple copies of operating systems on a single mainframe.
    The ability to run multiple operating systems made it possible to migrate to new
    releases and versions on the same mainframe. A user could run a production workload
    on the old level of software, performing the work required to migrate the environment
    to the new operating system.


    Internally, IBM used VM System/370™ architecture on a System/370 processor. VM
    would run on a real S/360 processor and create S/370™-mode virtual machines. This
    let IBM develop its suite of S/370-architected software before a “real” S/370
    processor was available for testing.


    > Note: VM was also used to develop VM/XA, VM/ESA®, and the 64-bit version z/VM.


    The ability of VM to simulate hardware and architectures today continues to give
    customers time-to-market advantages for their products and services.


    Over the course of 30-plus years, IBM made investments in hardware, architecture,
    microcode, and the VM product itself to enhance virtualization technology available
    with each successive line of mainframe computers. This “total system” investment
    is why the zSeries is the industry’s best-of-breed virtualization technology.
    Today z/VM Version 4.3 is the most current VM release.


    The virtualization technology found in z/VM is unique. Some “virtual server” solutions
    consist of running multiple applications on a single operating system using storage
    techniques to meet memory demands. z/VM, on the other, uses real resources at
    its disposal (processors, memory, I/O, network, etc.) to create virtual machines.
    Each machine can run its independent copy of any operating system that supports
    the zSeries architecture (which includes Linux, of course).


    Hardware architecture and facilities are presented to the “guest” system (which
    is “virtualized”) by z/VM in such a way that the guest system believes it is using
    a real system, not a virtual one. Figure 4-2 shows an example with multiple virtual
    machines, including three Linux machines, a z/OS, a VSE, and a CMS guest. The
    physical hardware is not seen by the guests. Instead, each guest sees the virtual
    machine presented by z/VM.'
  merge: -1
