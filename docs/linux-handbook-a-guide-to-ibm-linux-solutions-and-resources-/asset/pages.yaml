    # 32-bit and 64-bit support


    You can use VisualAge C++, V6.0 for pSeries to develop 32-bit and 64-bit applications.
    VisualAge C++ provides 64-bit pointer and 64-bit addressability support for SMP
    and serial code. High optimization levels, interprocedural analysis, and SMP are
    supported for 64-bit code.


    # Ease of porting


    VisualAge C++, V6.0 for Linux on pSeries has features that help you port existing
    code from AIX or other UNIX-based systems as from code originally written for
    GNU C/C++. For example, by compiling with -qinfopor option, you can filter the
    diagnostic messages emitted by the compiler to show only those that pertain to
    portability issues.


    A comprehensive subset of features related to GNU C/C++ is supported by VisualAge
    C++, V6.0 for Linux on pSeries. Other GNU C/C++ features are recognized (accepted
    and ignored). This help minimize the number of changes that you need to make to
    your GCC source code to ensure that it compiles successfully using VisualAge C++,
    V6.0 for Linux on pSeries.


    # Binary compatibility and coexistence


    VisualAge C++, V6.0 for Linux on pSeries supports the C++ Abstract Binary Interface
    (ABI). This means the compiler produces binary or object files that are compatible
    with those created with the GCC compiler.


    VisualAge C++, V6.0 for Linux on pSeries includes the same features used by a
    GNU compiler residing on the same system. This allows VisualAge C++, V6.0 for
    Linux on pSeries to achieve binary compatibility with GCC-compiled code. The VisualAge
    compiler optimizes the program while maintaining binary compatibility with objects
    produced by GCC V3.2.


    Additional coexistence features include:


    +   - IBM built-functions for POWER3 and POWER4 architectures coexist with GNU
    C built-ins.

    - Compilation uses the GNU C and C++ header files from the Linux distribution.

    - Compilation uses the GNU assembler.

    - Linking the GNU linker.

    - Compiled programs use the GNU C and C++ run-time libraries.

    - Compiled object files are compatible with g++ objects.

    - Debugging uses the GNU debugger, gdb.

    - Profiling uses the GNU profiler, gprof.'
