    # 9.3 Linux cluster history


    The current state of Linux cluster solutions is best understood through its history.
    Modern Linux clusters are conceptually indebted to open source software, the Intel
    processor, and the demands of the HPC community. There were clusters of non-Intel/non-Linux
    machines before (and after) the now-famous Beowulf cluster program started in
    1994 at NASA. However, the idea of a cluster wasn''t truly feasible or economical
    until the commodity nature of PC-based hardware was combined with the open source
    nature of the Linux operating system.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# The Beowulf program


    The Beowulf program started with a simple idea: Use 16 inexpensive Intel-based
    PCs and open source parallel programming libraries to create a virtual supercomputer
    environment. Fast Ethernet was too slow to keep up with the bus speed of the individual
    nodes (bus continues to be a major roadblock even in today''s clusters). Because
    of this, Donald Becker (a NASA contractor) rewrote a network card driver to support
    channel bonding. Channel bonding is a process that combines the four network cards
    into a single, virtual connection that is fast enough to permit parallel processing
    running on each computer to communicate as if they were part of a single system.


    ![](img/6b2be6cf94c5583e73925c180246991a_288_0.png)


    All the software that made the system was open source, including the Linux kernel,
    the NIC driver, and the parallel processing libraries. Considering this, the NASA
    team (Becker, Tom Sterling, John Salmon, and other CESDID members) continued and
    developed the ability to tune the cluster to the specific characteristics of the
    system. To learn more about the team''s achievements, see:


    http://sdcd.gsfc.nasa.gov/DIV-NEW5/CESDID.11_97.Becker.award.html


    Finally, because all of the hardware involved was standardized and inexpensive,
    additional nodes could be added (or replaced) as necessary. The phrase Beowulf
    cluster refers to a class of cluster where:


    +   - The majority of the components are commodity-off-the-shelf (COTS).

    - The operating system is open source (Linux or BSD variants).

    - There is emphasis of the cluster on HPC and as an Industry Standard Message
    Passing interface.


    # Emergence of high availability clusters


    Starting in the 1990s, Linux was increasingly used in an infrastructure role providing
    basic (and essential) services including routing, firewall/IDS, Web, and DHCP/DNS.
    The need for a higher level of availability also increased along with the penetration
    of Linux into businesses and government.


    The Linux high availability project started with the purpose of bringing failover
    and takeover capabilities to the Linux operating system. The central component
    of the Linux high availability project is the heartbeat program. The heartbeat
    works on a two-node model: two identically-configured computers, with one designated
    as the “primary”, and one as the “secondary”. The secondary node monitors the
    “heartbeat” or continual signal by the primary through'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'network connection or serial cable. When the primary node fails (and fails
    to send the heartbeat signal), the secondary activates its services and takes
    ownership of primary''s IP address, maintaining the cluster service.


    While Linux high availability provides a single backup for essential infrastructure
    servers, the two-node limitation limited its effectiveness. As a result, administrators
    increasingly began to combine the heartbeat capabilities of Linux high availability
    with the availability and load balancing capabilities of another project, the
    Linux Virtual Server (LVS) works by assigning the public IP address of the cluster
    to a load-balancing server. The load balancing then retransmits requests for services
    to the least-busy node of the cluster. When the load balancing LVS is mirrored
    with Linux high availability, the result is a highly available and scalable cluster
    for Web-based services.


    # Linux load balancing


    In the 1990s, Professor Amnon Barak of the Hebrew University in Jerusalem ported
    the code (originally developed for BSD UNIX) of the Multicomputer Operating System
    for High Performance Cluster Computing (MOSIX) to Linux. MOSIX uses special algorithms
    to automatically (and optimally) move processes around the cluster. A process
    can be started from any node and can be moved to any other node. Because MOSIX
    is implemented as a kernel extension, Linux applications don''t have to be rewritten
    to take advantage of its load balancing capabilities.


    In 2002, MOSIX began offering an optional parallel I/O (MOPI) component. This
    component attempts to improve I/O by migrating parallel processes to the nodes
    that hold data to be used by the processes.


    In 1998, some members of the original Beowulf Computing Corporation. Scyld added
    extensive cluster installation and management software to the collection of open
    source cluster tools then in existence. It also incorporated the process of migration.
    Similar to MOSIX, Scyld Beulf uses an extension to the Linux kernel called Bproc
    to migrate cluster processes from the master node to other nodes in the cluster.
    In addition, all process management can be performed from the master node. As
    a result, individual cluster nodes are not required to have duplicate copies of
    cluster application code. This simplifies cluster administration and maintenance
    and frees node storage space for application data and cache.


    There is a major difference between MOSIX and Scyld. MOSIX (and openMOSIX) transparently
    manages processes under kernel control based on a least loaded algorithm, with
    open file handles. Scyld migrates processes under user control, closing file handles.
    This makes the process faster and leaner to migrate, but necessitates reopening
    files that you want to access.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'In late 2001, Professor Barak decided to discontinue the open source license
    of MOSIX. Moshe Bar, a former developer of the MOSIX code decided to continue
    open source developments under the name openMosis, openMosis has incorporated
    several features that are not found in the original MOSIX, including support for
    user-mode Linux (UML), among others. It continues to be one of the most popular
    Linux cluster software components.


    > Note: UML is part of the Linux kernel that allows multiple virtual machines,
    each running their own version of the Linux kernel, to run on top of a single
    host kernel. Because the host kernel provides each virtual machine with simulated
    hardware, they can duplicate nearly all programs that are available on the host
    itself. UML is used by developers to test and debug Linux kernels and applications
    in a secure environment.


    # Management consolidation


    While various open source cluster software components were maturing in the 1990s,
    management tools still lacked maturity and integration. In April of 2000, the
    Open Cluster Group, a collection of companies (IBM, Intel, Dell, SGI, Veridian,
    MSC.Software Corporation) and research organizations (Oak Ridge National Laboratory
    (ORNL), Indiana University, University of Illinois National Center for Super Computing
    Applications (NCSA) released their first project: the Open Source Cluster Application
    Resources (OSCAR).


    The goal of the OSCAR project is to identify the best open source utilities for
    building, programming, and administering HPC clusters. Once identified, these
    programs are bundled together and distributed as a single package. OSCAR has been
    an extremely powerful open source cluster package and is used by a wide range
    of organizations.


    > Note: IBM provides tools for CSM to work with OSCAR through its alphaWorks®
    site. http://www.alphaworks.ibm.com/tech/ect4linux


    Another approach to cluster management and infrastructure is the Single Image
    project. SSI attempt to provide a general-purpose Linux clustering environment
    using the best open source components for availability, scalability and manageability.
    SSI (and the Cluster Infrastructure (CI) project relies on its origin in Hewlett
    Packard NonStop Clusters for UnixWare technology. The CI code is responsible for
    maintaining membership of and communication between the various cluster nodes.
    SSI creates the appearance of a single system through shared process, IPC, device,
    and networking space, a clustered file system (through OpenGFS), load leveling
    (using the MOSIX algorithm), and a single management interface.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '> Note: SSI was voted the open source project of the 2002 LinuxWorld Conference
    and Expo.


    # 9.4 Linux cluster solutions


    The IBM Linux cluster solution is the Cluster 1350. IBM has other cluster solutions,
    which may include Linux alongside other operating systems as a combined cluster
