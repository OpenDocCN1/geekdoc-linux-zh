    Program is introduced to ensure better inter-operability of DB2 on Linux platforms
    and to enhance customer experience.


    IBM is working closely with the Linux community, Linux Distribution Partners,
    and independent software and hardware vendors to test DB2 using various Linux
    kernels, distributions, third-party products, hardware and other components that
    interact with DB2. As a part of the validation program, before a product is supported
    with DB2, it undergoes rigorous testing. to run DB2 with other products out of
    the box.


