  md: '# 11.1 Linux desktop environments


    A few short years ago, Linux was primarily a command-line environment. The Linux
    graphical user interfaces (GUIs) have become more and more sophisticated in an
    effort to become more user friendly and to attract a broader audience. The command-line
    environment is still available and much preferred by developers and those accustomed
    to a UNIX system or Linux commands that were derived from the UNIX system. This
    section reviews a few of the more popular desktop environments.


    Behind all the other desktop environments lies the foundation software for all
    Linux GUIs: the X Window System often abbreviated as “X”. The X Window System
    is simply the environment that allows graphics to be displayed on your system''s
    hardware. The window manager is responsible for how X looks and interacts with
    you and your applications.


    Users who do not want all the extra enhancements use X by itself. However, most
    use the X Window System indirectly through a window manager, such as ICEWM, or
    a desktop environment, as the K Desktop Environment (KDE) or GNOME. Each window
    manager has a unique look and often packaged with its own desktop themes. Each
    desktop environment has its own individual characteristics as well as its own
    collection of GUI-based applications.


    As shown in Figure 11-1, desktop environments run on top of window managers which
    are built upon the X Window System. X, in turn, requires lower level operating
    utilities to function.


    | Desktop Environments | GNOME | KDE | CDE | Xfce | Others |

    | --- | --- | --- | --- | --- | --- |

    | Windows Managers | Sawfish | kwm | dtwm | Xwm | varies |

    | X Window System | | | | | |

    | Operating System | | | | | |


    > Figure 11-1 Relationship of X, window managers, and desktop environments


    Linux distributions generally come packaged with both GNOME and KDE GUI desktop
    environments. These enhanced user interfaces move from the traditional X Window
    System interface to ones that are easy to use and familiar to users of other environments.
    Table 11-1 compares some of the common functions in'
  merge: -1
