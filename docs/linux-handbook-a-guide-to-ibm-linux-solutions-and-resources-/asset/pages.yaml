- img_proc: true
  md: '# Parallel Sysplex


    Each node in the Parallel Sysplex can have a single CPU or consist of a symmetric
    multiprocessor. Each node runs a separate copy of the operating system.


    The processors in an SMP node run a single operating system, zOS (previously known
    as MVS™) on the IBM S/390. They have shared memory. The nodes in the Parallel
    Sysplex have shared disks, which you can access directly from each node. You can
    configure large complexes of shared disks, using the Fibre Connection (FICON®)
    switch.


    # SPTM


    The SP system is a general-purpose scalable parallel system. It is based on share-nothing
    architecture. Share-nothing refers to the fact that each processor has its own
    cache and disk subsystem.


    Generally available SP systems range from 2 to 128 processor nodes. Each processor
    node is functionally equivalent to a stand-alone RS/6000 workstation or server.


    Large SP systems with up to 512 nodes have been delivered and are successfully
    used today. Each processor node contains its own copy of the AIX operating system
    and other standard RS/6000 software.


    A set of new software products designed specifically for SP allows the parallel
    capabilities of SP to be effectively exploited. The SP system is a state-of-the-art
    horizontally scalable environment.


    # Cluster 1600


    The IBM Cluster 1600 extends and enhances IBM''s innovative, proven AIX and RS/6000
    clustering technologies. The Cluster 1600 includes both the legacy SP system and
    new clusters made up of PSeries servers.


    Cluster 1600 includes the Parallel Support Programs (PSSP) for AIX 5L software.
    This software provides a comprehensive suite of applications for the installation,
    operation, management, and administration of the RS/6000 SP, attached servers,
    and Clustered Enterprise Servers (CES) from a single point of control.


    PSSP 3.4 concentrates on the to Switch2 PCI Interface (PCI) for RS/6000 servers
    S80, H80, and M80 and pSeries 6H1, 6H0, 6M1, and pSeries 69 as SP-attached servers
    using the Switch2 PCI Attachment Adapter (F/C 8397). PSSP 3.4 supports Winterhawk1,
    Winterhawk2, and Silver SP nodes within the SP Switch2 PCI Attachment Adapter
    connection to the Switch2 PCI.'
