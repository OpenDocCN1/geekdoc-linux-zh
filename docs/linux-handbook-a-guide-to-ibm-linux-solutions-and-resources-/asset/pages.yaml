  md: '# 3.2.3 Findings


    The following list outlines general, key findings with most TCO models that compare
    and contrast the Linux, UNIX, and Windows operating environments:


    +   - For many businesses, the Linux operating environment has emerged as a viable
    alternative for enterprise computing. Using the Linux operating environment has
    the potential to lower IT costs. This is especially true for businesses that have
    the right mix of staff, skills, commodity hardware, software, and overall computing
    environment.

    - To realize the full potential of the Linux operating environment, companies
    may need to pilot a Linux project and then build a vision or strategy for a longer
    term deployment.

    - The cost of Linux and Windows operating environments on Intel platforms is highly
    competitive and low due to the acquisition cost of Intel architecture server hardware.

    - Linux can be deployed with no or low licensing fees, particularly if Linux is
    deployed without the support services that normally accompany an enterprise-level
    product. This fact alone can account for a lower TCO.

    - TCO may depend on the configuration and workload. However, with some key workloads,
    such as Web applications, collaborative applications, firewalled server, or print
    server applications, Linux is likely to have a lower TCO.

    - Most companies, whether large or small, operate in at least a dual operating
    environment.

    - Staffing and skills are a key consideration.


    The IBM @server offers the possibility for server consolidation. As explained
    in the following chapters, these servers have the capability of virtualization,
    from hundreds of virtual Linux servers on zSeries to tens on other @server platforms.
    This provides additional TCO savings.


    # 3.2.4 TCO versus ROI


    TCO is an important consideration, ROI is equally significant in the customer
    decision-making process. CFOs take a good look at the ROI they expect to realize
    with new servers. While it may be useful to consider the overall total cost of
    ownership, today customers are interested in saving money in a tough economic
    environment.


    ROI can be more effective than TCO as a measure of business value, especially
    with new, emerging technologies. For this reason, we expect to see a movement'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'of the community toward a more comprehensive ROI justification, where TCO is
    just a portion of the overall analysis.


    It''s coming to be viewed that ROI analysis is a higher quality approach for making
    business decisions since it''s more inclusive of the risks and returns of making
    new investments. This is what CFOs are looking for and why Linux is becoming more
    accepted each day.


    Numerous case studies have shown Linux to deliver outstanding ROI value. These
