  md: '# 5.4 Linux clusters


    A clustered system is basically a system that combines two or more computers into
    a group to improve reliability or processing performance. The types of clusters
    can be roughly classified as:


    +   - High-availability cluster

    - Load-balancing cluster

    - High-performance computing

    - Tightly coupled clusters


    For a detailed explanation and references about clusters, see Chapter 9, “Linux
    clusters” on page 243.


    # 5.4.1 High-availability cluster


    As your computer requirements expand, you can choose to expand your systems vertically
    or horizontally. Vertical scaling essentially means implementing larger systems,
    many times larger than SMP systems. Horizontal scaling, clusters, means implementing
    multiple smaller systems to handle the workload and leveraging them as one compute
    resource or as a large server farm with sophisticated workload balancing.


    Cluster implementations begin with high-performance computing environments where
    customers have hooked many systems or nodes together over a high-speed interconnection.
    By leveraging software, they split jobs into small chunks to increase speed and
    efficiency.


    Today, clusters are implemented in life sciences, financial, and petroleum environments,
    where large amounts of data are analyzed and the problems are well suited to be
    split among multiple machines. Often, clusters are implemented as large server
    farms, an implementation that has many of the benefits of server consolidation.


    IBM is a leader in Intel-processor Linux clusters. The key differentiators:


    +   - Reduced system cost: With Linux and xSeries solutions, the initial cost
    is extremely attractive.


    +   - System management: With IBM Director and Cluster System Management, you
    now have solutions to manage many nodes as one compute resource. This produces
    savings in total cost of ownership (TCO) by requiring fewer administrators and
    improving system availability.


    +   - High-availability solutions: IBM, together with its ISV partners, offers
    high-availability solutions to allow failover from failing systems within the
    cluster to nodes that are up and operational.'
  merge: -1
