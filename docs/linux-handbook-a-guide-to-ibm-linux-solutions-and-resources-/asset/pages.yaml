    # # 1.11 UnitedLinux


    May may be a major event in Linux history started on May 30, 2002. SCO, Conecta,
    SuSE, and Turbolinus announced that they would join forces to create a single
    binary-compatible Linux distribution, sharing development costs and future royalties.
    UnitedLinux was formed as a consortium, and the UnitedLinux product UL 1.0 was
    ultimately announced in November 2002. By 4 December 2002, SCO unveiled SCO Linux
    4.0, and SuSE unveiled its SuSE Linux Enterprise 8. These were the first distributions
    on the market based on UnitedLinux 1.0 code. Turbolinus released its Enterprise
    8 in Japan.


    UnitedLinux is a standards-based Linux operating system. It targets the business
    user. It seeks to streamline Linux development and certification around a global,
    uniform distribution of Linux. It is certified to work across both AMD and Intel
    32-bit x86 lines; the 64-bit x86 Athlon, Opteron, and Itanium families; the complete
    IBM @server brand.


    While each distributor sells the core UnitedLinux distribution, they can add additional
    programs and utilities, provided that application portability is preserved. Each
    distributor sell its products under its own brand name “Powered by UnitedLinux”.


