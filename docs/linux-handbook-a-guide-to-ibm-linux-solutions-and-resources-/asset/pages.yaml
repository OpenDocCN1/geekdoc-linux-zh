  md: '# 3.1.1 Description of the ratings


    The rating given to each feature, function or technology is shown in Table 3-1.
    A three-scale rating system was used to keep the rating as simple as possible.


    | Rating | Description |

    | --- | --- |

    | + | The function or feature is available, robust, and mature. It may be industry
    leading. |

    | = | The function or feature may be available, but not robust. The function or
    feature may require a third-party solution. |

    | - | The function is not available or may not robust enough to be considered
    good enough for enterprise deployment. |


    # 3.1.2 Methodology for the feature, function, and technology rating system


    To explain the rating system, you can use partitioning as the feature technology
    to be rated. For most enterprise or small and medium business (SMB) environments,
    partitioning is one of the technologies considered when making a purchasing decision,
    especially in a server consolidation environment. Partitioning, as a technology,
    can easily be broken down into several subcategories. These may include resource
    allocation, maximum number of partitions supported, processor granularity, memory
    granularity, or heterogeneity of operating environments supported. However, this
    level of granularity is not done.


    Various partitioning solutions are available for UNIX operating environments.
    Sun''s UNIX partitioning solution provides hardware partitioning (dynamic system
    domains) and resource partitioning (containers). HP''s UNIX solution provides
    hardware partitioning (nPars), software or logical partitioning (vPars), and resource
    partitioning. IBM''s UNIX partitioning solution provides software or logical partitioning
    (LPAR). Although there are UNIX solutions, which vary in scope and depth, the
    UNIX partitioning solution is integrated within the UNIX environment and can have
    distinct advantages. Therefore, a "-+ rating was given to UNIX systems.


    The Microsoft Windows 2000 operating environment has no integrated partitioning
    solution, although Windows takes advantage of the hyperthreading technology built
    into the Intel architecture. Third-party solutions, such as VMware''s ESX Server
    and GSX Server, are available. A "-" rating was given to Microsoft Windows.'
