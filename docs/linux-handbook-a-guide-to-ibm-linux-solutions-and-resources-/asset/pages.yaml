    of the actual solution scenario, the solution-based servers are not the only servers
    making up the solution. Firewalls, failover protection, directory servers, backup
    servers, and others are typically included in production environments. Keep in
    that, in most distributed systems, any of those servers may constitute a single
    point of failure. Also, each server occupies space, consumes power, and must be
    monitored continuously.


    The software that drives this application is uniform and can be used by all of
    the servers that provide the solution. The service level required for this application
    is prime shift or 12 hours a day, 5 days per week.


    There are two options to this scenario:


    +   - 30-way Intel 100 megahertz (MHz) servers

    - One zSeries 900 Integrated Facility for Linux engine


    Figure 4-10 illustrates the distributed solution. That the servers are connected
    to a physical network which requires hardware. Also notice that each server is
    running a separate copy of the operating system and application code. This is
    duplicated for each server in the solution, which is 30 times in this case. Each
    server requires disk space to support this. If additional disk storage is required
    for a server, the alternatives are to either purchase an entire disk volume and
    install it or to purchase a higher capacity disk, move the required software and
    data to it, and install it.


    Maintenance must be performed on each server individually. Some type of operator
    automation is required to monitor the 30 separate systems and respond to replies
    when necessary. Backup is done by a dedicated backup server. Client code on each
    system communicates with the server to perform backup operations.


    > Important: In the following scenario, the assumption is that the Intel servers
    run somewhere in the 1% to 5% utilization range.


    Figure 4-11 shows the IBM @server Z2Series solution. Notice that the inter-server
    communication takes place within the machine. This allows the Linux instances
    to communicate at memory speeds, as opposed to physical networking speeds with
    the usual latency. In addition to improving inter-server communication, much of
    the cost of external networking hardware and software is avoided.'
