- img_proc: true
  md: '# 2.1 Creating the code and protecting it


    Any discussion of open source software requires an explanation of how software
    is taken from a more human-readable form (source code) and converted into execution
    code (binary or object code). It is also important to define the various types
    of licenses that serve to protect intellectual capital in the form of computer
    software.


    # 2.1.1 Source code


    Most computer programming is done in one or more languages that are abbreviated,
    compact, and highly structured versions of English. This language is later converted
    to a form that a computer can understand in a process called compiling. As a result,
    this language in its original form is called source code. Example 2-1 shows source
    code from the Java programming language.


    Example 2-1 Java source code example


    # Compiling the code


    The source code, after it is completed, is then submitted to a compiler. A compiler
    is a software program that reads the special instructions that make up the source
    code and creates a file that can be executed by a specific type of processor.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Because computers read their code using binary numbers, this file is said to
    be a binary file. The process of compiling is similar to a cook following a recipe
    to create a meal. In compiling, many of the structures and labels in the code
    are removed, just as in the process of preparing a meal, where many of the original
    forms are altered beyond simple recognition.


    # Binary code


    The output of the compiler is in a form made up of binary numbers. Example 2-2
    shows a section of a compiled program.


    Example 2-2 Binary numbers from a computer program


    ```

    0000101 00011111 00010000 00000000 00000000 11010010

    01000001 01100000 01000001 01010100 01011100 01000000 11010010

    01000001 01100000 01000000 10110000 10101100 00000011 01000000

    11000000 01010100 01011100 01000000 00000110 00000010 10111010

    00000010 01100010 00000000 00000000 01000111 11110000 10111010

    01011000 01011000 11000001 01110000 01010111 11110000 10101010

    ```


    Because the compiler removed many labels, instructions, and forms from the source
    code in creating the binary code, it can be difficult for a human to determine
    the nature or structures of a program by reading the binary output of the compiler.
    Most software, especially commercial software, is shipped only in a binary format.
    The source code is heavily protected from publication. This preserves the methods
    and technologies of the software creator, who typically invests a significant
    amount of money in their development.


    # 2.1.2 Software licenses


    Most software is published with copyright protection, similar to a book, however,
    software adds an additional layer of intellectual protection in the form of a
    license.


    Licenses serve to specify, clarify, and restrict the legally permissible use of
    a software product. Most licenses require the purchase of rights to use the software.
    Figure 2-1 breaks down the various software licenses into several categories.'
  merge: -1
