- img_proc: true
  md: 'virtual LAN connection. The multiple virtual LAN connections provide another
    level of security between the outside and inside environments.


    The second firewall uses I/O disk, tape, CD-ROM, and LAN resources. It does not
    have any direct I/O devices except for the native LAN. It is possible to connect
    the direct LAN adapter to the first OS/400 partition. The advantage of this approach
    (with the direct LAN adapter connected to the Linux partition) is that all system
    users must pass the firewall. This means that you can stop access to the core
    business software for some parts of the internal network or log activity to that
    system.


    The OS/400 partition runs the line-of-business applications and contains the data
    on which the Web applications are based. These five partitions can be set up on
    a small iSeries server with two processors (for example, a Model 810). The OS/400
    and Linux partitions can share these two processors, and resources can be moved
    between the partitions based on the workload demands. This same solution can be
    set up on a large iSeries server with additional processors.


