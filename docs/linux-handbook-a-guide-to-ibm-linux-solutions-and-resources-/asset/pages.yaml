  md: 'iSeries Navigator is enhanced in V5R2 to support Linux partition management
    and resource movement. A wizard is available that makes creating a partition even
    easier.


    In 2003, IBM announced additional enhancements for Linux. With the iSeries Models
    870 and 890 Enterprise Edition, an extra processor is activated for Linux at no
    additional charge. In addition, Education and Services Vouchers are included in
    the Model 825, 870, and 890 Enterprise Edition servers that can be redeemed for
    the Linux on iSeries Implementation class and the Linux on iSeries Integration
    QuickStart service.


    # Linux I/O flexibility


    The Linux environment on iSeries supports two types of I/O, virtual and direct.
    With virtual I/O, such I/O resources as disk, tape, and CD-ROM are owned by OS/400.
    OS/400 shares the resources with Linux. The partition sharing the resources is
    called the host. The host can be the primary partition, but it does not have to
    be. One partition can be the host for multiple Linux partitions. The shared resources
    are managed by OS/400. For example, disk space is allocated from OS/400''s disk
    drives to Linux. OS/400 provides RAID protection and some backup and restore facilities
    for the Linux environment.


    The Virtual Ethernet LAN support provided in OS/400 V5R1 and V5R2 extends to Linux.
    Virtual Ethernet provides 16 1 Gb Ethernet communication paths between partitions
    (OS/400 to Linux and Linux to Linux) without requiring additional hardware resources.


    With direct I/O, the I/O resources are owned by Linux. For example, disk drives,
    LAN, or WAN adapters are under the control of one Linux environment. OS/400 cannot
    use these resources. A Linux server in a partition can take advantage of both
    virtual and direct.


    # 7.1.3 iSeries Linux integration


    The iSeries server offers many points of integration that support Linux applications
    leveraging OS/400 applications and data.


    A PowerPC Linux Open Database Connectivity (ODBC) driver provides access from
    a Linux application running on iSeries to the OS/400 DB2 UDB for iSeries database.
    This ODBC driver is included in select Linux distributions.


    IBM has enhanced OS/400 NetServer with Samba for the exchange of files between
    OS/400 and Linux systems. With this support, Linux can print to OS/400 print queues.'
