    # 11.1.1 KDE and GNOME


    A complaint from users who have migrated to KDE or GNOME desktops is the performance
    when one of these desktop GUIs is launched. The architecture of running a desktop
    environment involves both window manager and a desktop environment, which is an
    implementation of window manager over the X Window System base.


    # KDE


    The KDE project is a large open group of developers. This group consists of several
    hundred software engineers from all over the world committed to free software
    development. The KDE project is a free software project whose code is available
    under the LGPL/GPL licenses. This means that everyone is free to modify and distribute
    source code.


    KDE brings these advantages:


    +   * An integrated help system

    * Consistent look and feel of KDE applications

    * Standardized menu and toolbars

    * Internationalization: KDE is available in more than 50 languages

    * A number of KDE applications, including the KOffice Suite


    The KDE distribution consists of various run-time libraries, base components (window-manager,
    desktop (Figure 11-2), Konqueror browser), KMail, graphics applications, and utilities.'
