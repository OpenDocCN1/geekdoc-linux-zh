  md: '# 2.2 The origin of open source


    The label "open source" is applied to a philosophy of intellectual property that
    is the basis of several software licenses (and a general license category formally
    called open source) and a model of software development. Most proponents think
    of open source as concept that asserts that the user of a software program should
    have the right to see and modify the source code that was used to create that
    program.


    The open source "movement" has its origins in the development and licensing of
    UNIX systems in the 1970s. AT&T, the creator of UNIX, liberally licensed UNIX
    systems to U. research universities to take advantage of any developments made
    to the operating system by university workers. Because many of these universities
    were connected to each other through ARPANet, the precursor to the Internet, individual
    developers could share improvements and troubleshoot software problems. They could
    generally participate in a peer-to-peer environment that crossed geographical
    and organizational lines.


    The UNIX system became a commercial-only operating system in 1984. This ended
    the liberal code-sharing license that allowed developers to take advantage of
    each others improvements. As a result, an attempt was made to continue the tradition
    of code sharing, most publicly by Richard Stallman, who helped start and still
    heads the Free Software Foundation (FSF).


    # 2.2.1 The Free Software Foundation


    According to the Free Software Foundation, free software allows users to freely
    run, copy, distribute, change, and improve the software. It gives users the following
    types of freedom:


    +   - **Freedom 0**: Run the program for any purpose.

    - **Freedom 1**: Study how the program works and adapt it to your needs. You must
    have access to the source code for this.

    - **Freedom 2**: Redistribute copies to help others.

    - **Freedom 3**: Improve the program and release your improvements to the whole
    community benefits. Again, you must have access to the source code for this.


    You can learn more about free software on the Free Software Foundation site at:


    http://www.fsf.org/philosophy/free-sw.html


    The Free Software Foundation believes that denying access to the source code of
    a software program is morally wrong. Because of this, it created the General'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'Public License (GPL). This forces the free use (as previously defined) of any
    software protected by the GPL. A distributor of GPL software can charge to distribute
    the software code or support services. However, the users of the software can
    modify or use it in any way without paying the copyright owners for that capability.


    GPL-protected software is different than software in the public domain for the
    simple reason of derivation. Code that is based on public domain software can
    be copyrighted and closed, while derivatives of GPL software are required (by
    the GPL) to remain open. The GPL focuses on freedom of use and not from being
    charged for the software.


    # 2.2.2 The compromise of open source software


    GPL was the first license to publicly access to software source code. However,
    most commercial organizations felt that the license did not provide enough protection
    for their investments in software development. Other organizations were more concerned
    with controlling the integrity of their applications and limiting the publication
    of derivative works that might fragment and compete with their control of the
    original program.


    As a result, the 1980s saw the creation of many similar-themed, but less restrictive
    licenses such as the MIT X or the BSD license. In 1998, when Netscape announced
    they were going to release the source code of their Navigator browser to the public,
    a viable alternative to the GPL was created.


    # The open source initiative


    The phrase "open source" was first proposed during a meeting in February of 1998
    of well-known Linux proponents including John "maddock" Hall (from Linux International),
    Sam Okan (a member of the Silicon Valley Linux User''s Group), and Eric Raymond
    (author of The Cathedral and the Bazaar). Netscape asked Eric Raymond to help
    with the process of releasing and managing the code. He wanted the opportunity
    to help push the open source ideas and development model into the commercial arena.


    As a result of that meeting, the open source initiative was created. This non-for-profit
    group created a formal description of open source Source Definition (OSD). It
    also created a certification process for any license that attempted to bill itself
    as open source.


    > Note: Most popular open source licenses are certified as OSD compliant. You
    can find a list of them on the Web at:

    http://www.opensource.org/licenses/'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'The OSD outlines use of the software based on the following criteria:


    +   * Free distribution: You can sell or give away open source software as part
    of a greater software package that includes other programs from any number of
    sources. This eliminates the possibility of the original license imposing redistribution
    fees or royalties.


    +   * Source code: You must distribute open source software with the source code.
    You must make it easy to obtain the source code without an unreasonable reproduction
    charge. You must present the code in a common and non-misleading format. If source
    code is not easily accessible, it is more difficult to improve or evolve the code.


    +   * Derived works: Anyone is allowed to create modifications to the original
    code and distribute those modifications under the same terms as the original software
    license. This allows the cycle of improvement and development to continue, while
    preserving the control of the original developer of the code.


    +   * Source code integrity: While a software license cannot prohibit changes
    to the source code, it can limit how modified code is distributed. The most common
    restriction is to specify that any changes be distributed as separate patches
    that can be integrated into the original source code (or ignored) at the discretion
    of the user. Another method of achieving the same aim is to force modified code
    to carry a different name or version from the original. Both restrictions serve
    to establish the responsibility for software changes while preserving the brand
    or product identity.


    +   * Personal discrimination: Open source licenses are not allowed to restrict
    any individual or group of individuals from using their software. However, they
    can warn about legal restrictions or obligations. The restrictions cannot be built
    into the software itself.


    +   * Use discrimination: An open source license cannot restrict how the software
    can be used. This means that any industry or endeavor can take advantage of the
    software.


    +   * License distribution: All rights granted by an open source license must
    be without provision. That is, no further agreements (as a non-disclosure agreement)
    or licenses can be required for consideration in compliance with the original
    license.


    +   * Non-product specific: The permissions granted as part of an open source
    license cannot depend on the code being distributed as part of a package or group
    of software. Modifications to a specific licensed product can be distributed without
    including the entire package (or additional products) made up the original distribution.


    +   * Non-restrictive: An open source license cannot make demands of other software
    that is distributed with the original program. For example, a license'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'cannot dictate that all programs distributed with it (as of a package or media,
    such as a CD) must also be open source. This protects commercial interest by allowing
    the bundling of commercial software with open source software.


    +   * Technology neutral: This point aims to remove the requirement that a user
    performs a specific action (other than installation and use) to accept the open
    source license. This allows you to distribute the software through multiple platform
    and media types without requiring a graphical user interface (GUI) window option,
    for example, to accept the license.


    You can learn more about the OSD on the Web at:

    http://opensource.org/docs/definition.html


    These ten points were an attempt to bridge the gap between an apparent philosophical
    dispute between diametrically opposed licensing schemes, the forced freedom of
    the GPL on one side, and the complete control and secrecy of most typical closed
    source software licenses on the other. The core issue is about licenses. It is
    also about software development methodology and process is superior, closed and
    centralized or open distributed. The implication is about revenue of a finished
    product and control of the development itself.


    This is the genius of the open source movement. It is a compromise of both ends
    of the development and licensing spectrum. It allows the original creator of a
    program to have control over how the software develops and is presented to the
    public. At the same time, individual developers and users retain the ability to
    manipulate and share improvements of the source code for their own needs.


    These theoretical arguments were not enough to convince businesses to change established
    processes and culture and adopt a more decentralized and open developmental model.
    The success of Linux gave organizations an example of how the compromise between
    distributed development and centralized control could (and did) function successfully.


    # 2.3 Linux and open source


    Linux Torvalds began working in 1991 to create a better terminal emulator for
    his PC. Within a few months of working in his spare time, he created a small but
    workable clone of the UNIX system kernel. He published this (with the source code)
    on an Internet news group that was dedicated to operating system kernels. Several
    news group participants immediately offered ideas (and actual code) as improvements.
    This began a process that continues today of individuals and'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'organizations providing ideas, new code, and patches that are evaluated by
    Linus (and a select group of volunteers) for inclusion in the kernel.


    You can find a well-researched overview of the Linux development process on the
    Web at:


    http://firstmonday.org/issues/issue5_3/kwawara/index.html


    # 2.3.1 The GNU utilities


    A crude operating system by itself was not enough to convince more than merely
    interested to take it seriously. Not Linus the first project that relied on an
    open source development model. That title belongs to the Free Software Foundation.
    By Richard Stallman''s direction, it created the GPL and released numerous utilities
    under the license as the GNU project. These included the GNU C Compiler (gcc),
    which currently contains front ends for C, C++, Objective-C, Fortran, Java, and
    Ada, as well as language libraries (libstdc++, libgcc, etc.). It is a high-performance,
    multi-platform compiler that remains the standard by which all compilers are judged.


    You can locate the GNU C Compiler Collection on the Web at:


    http://gcc.gnu.org


    Because Torvalds decided to release Linux under the GPL, it was natural to bundle
    the GNU utilities with it. In fact, the Free Software Foundation argues that so
    much of Linux was built on, and distributed with, the GNU utilities, Linux should
    be called *GNU/Linux*. While little argument exists against the case made by the
    Free Software Foundation, few have adopted this label, preferring the simpler
    name of *Linux*.


    # 2.3.2 The problem of complexity


    As the development of Linux continued, it was inevitable that significant complexity
    would emerge. This was especially true as the kernel grew to over one million
    lines of code. This code was mostly maintained by part-time volunteers (estimated
    to exceed a total of 40,000 in number) worldwide, who communicated with each other
    almost exclusively through e-mail.


    This complexity is managed by Linux developers using a version control program
    called the Concurrent Versions System (CVS). CVS by recording all the changes
    that occurred in the source code of an application. As a result, bug or error
    detection is simplified because it is possible to track the exact evolution of
    events that led to a particular software error.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'You can find the CVS on the Web at:

    http://www.cvshome.org


    CVS also works to enable software coordination. Each software developer has their
    own unique work space. It isolates them from the work of others until their code
    is ready to be merged, a process that is aided by CVS.


    But CVS is only part of the answer to the problems created in distributed development.
    For example, coordination and communication between developers is still necessary
    to determine when and how code merge or branch, whether multiple changes within
    a file or across multiple files will functionally or logically conflict, and how
    to resolve those conflicts.


    CVS is a tool to aid management and control of the development process, but it
    does not create or manage that process by itself. How, then, does the chaotic
    model ascribed to open source software allow for something as complex as an operating
    system, let alone an operating system that is stable enough to be considered for
    deployment in critical enterprise applications?


    # 2.3.3 The benevolent dictator


    The development of Linux is mostly distributed and decentralized. However, Linus
    Torvalds himself seeks authority and ultimately maintains coordination, along
    with an informal group of trusted, knowledgeable volunteers colloquially called
    the "Inner Circle".


    Linus tends to focus on developing the beta version of each kernel version. After
    he considers a version stable for general release, he turns over the responsibility
    of maintaining stable version to Alan Cox, another well-known programmer. While
    Linus turns his attention to the next kernel, Alan is left with wide discretion
    about how the current kernel is maintained and updated.


    This same pattern is seen with other members of the Inner Circle. That is, an
    individual is in charge of development and maintenance of an area they originated
    or took over from another original developer.


    Because of the sheer complexity and quantity of the kernel code, its components,
    and the various patches and feature requests, Linux has encouraged a system where
    any submitted code is first sent to the individual who oversees the area in question.
    As a result, Linus'' principles and goals in regard to the development of Linux
    are still maintained, with significant authority delegated to the individuals
    who oversee specific subareas.


    In this fashion, Linus follows more of an open source model of development. It
    combines the innovation that comes from forced free code imposed by the GPL,'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'yet retains the vision of the kernel''s original author through a delegation
