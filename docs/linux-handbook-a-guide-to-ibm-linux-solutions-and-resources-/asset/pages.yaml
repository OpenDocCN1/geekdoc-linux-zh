    # Qmail


    Qmail is a secure, reliable, efficient simple message transfer agent. It is designed
    for typical Internet-connected UNIX hosts. As of October 2001, Qmail is the second
    most common Mail Transfer Protocol (SMTP) server on the Internet and by far the
    fastest growth of SMTP server. The features of Qmail include:


    +   - **Secure:** Security isn''t a goal, but an absolute requirement. Mail delivery
    is critical for users. It cannot be turned off, so it must be completely secure.
    Qmail divides its functions into components. The execution of each user function
    is defined separately so that, if one component is damaged, others are not infringed.


    +   - **Reliable:** Qmail''s straight-paper-path philosophy guarantees that, after
    a message is accepted into the system, it is never lost. Qmail optionally supports
    maildir, a new, super-reliable mail mailbox. Maildir, unlike mbox files, are not
    corrupted if the system crashes during delivery. Even better, a user can safely
    read their mail over the NFS and any number of NFS clients can deliver to them
    at the same time.


    +   - **Efficient:** On a Pentium based BSD/OS, Qmail can easily handle 200,000
    local messages per day. These are separate messages injected and into mailboxes
    in a real test. Although remote deliveries are inherently limited by the slowness
    of DNS and SMTP, Qmail overlaps 20 simultaneous deliveries'
