    # 4.2.5 z/VM for Linux performance: Scalability


    zSeries customers have many options for scaling a zVM workload on z/VM. z/VM supports
    vertical and horizontal growth, VM exploitation of hardware technologies enhances
    the performance and scalability of z/VM workloads.


    With z/VM, you can grow your server vertically or horizontally. Vertical growth
    is realized when you add more system resources to an existing virtual machine.
    You can give a Linux virtual machine more processor capacity, more virtual memory,
    more I/O devices and bandwidth, plus more networking bandwidth.


    Horizontal growth is a typical way to grow UNIX workloads. It is easily accomplished
    by adding another virtual machine, or two, three, or more on z/VM. There is added
    benefit in the efficient use and sharing of system resources. This makes adding
    more Linux virtual servers a particularly attractive option when you consider
    the limited scalability of a single Linux instance.


    The added scalability of Linux workloads is realized when you choose to exploit
    z/VM''s data-in-memory techniques. Virtual disks in storage and Minisk Cache can
    boost the performance of Linux servers on z/VM by making disk I/O operations execute
    at processor memory speeds, avoiding trips to the I/O subsystem, and waiting on
    disks of storage.


    z/VM support for advanced storage functions as Peer-to-Remote Copy (PPRC) and
    FlashCopy® Linux virtual servers, although Linux itself doesn''t support the function.
    Exploitation of this technology and other technologies, such as FICON™ support,
    is transparently passed to the Linux servers simply because they are running on
    z/VM.


