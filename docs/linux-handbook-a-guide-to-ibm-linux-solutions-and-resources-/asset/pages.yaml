    # Click-N-Run Warehouse


    In addition to the emphasis on ease of use, the key selling point for Linux is
    its Click-N-Run Warehouse. Linux applications have long been as easy to use as
    Windows counterparts, but installing them has not been easy. Linux provides a
    wide variety of applications, over 1,800 according to the Windows Web site. You
    can install these by simply clicking a button. This software is freely available,
    although Linux offers some commercial applications, such as StarOffice.


    LinuxOS users can simply use the Click-N-Run "Warehouse" and browse dozens of
    software titles. When they find an application they want, they simply select the
    Click-N-Run button and the software is automatically downloaded and installed
    on the user''s Linux computer. In addition, the selected software title is saved
    in the user''s MyLinuxOS account. This allows them to click and run the application
    on other machines they may own or new machines they may purchase.


    # 11.2.2 CrossOver: Running Windows programs on Linux


