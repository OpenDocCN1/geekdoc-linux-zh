    # GNOME


    GNOME is part of the GNU project and is open source software. The purpose of the
    GNOME project is to provide a user friendly suite of applications and an easy-to-use
    desktop that is entirely open source.


    The major components of GNOME are:


    +   - GNOME desktop: An easy to use window-based environment for users


    +   - GNOME development platform: A collection of tools, libraries, and components
    to develop powerful applications on Linux


    +   - GNOME Office: A set of office productivity applications


    Miguel de Icaza started the GNOME project in 1997. By 1998, the project had over
    200 programmers coding it. Miguel and Nat Friedman co-founded Xianian, the for-profit
    commercialization on the GNOME desktop, but even that occurred more than two years
    earlier. The predecessor company was Helix Code, which was renamed Xianian.


    GNOME ranges in scope from utilities to low-level development libraries to end-user
    applications. The applications include e-mail, an Internet browser, graphics,
    and an office suite.'
