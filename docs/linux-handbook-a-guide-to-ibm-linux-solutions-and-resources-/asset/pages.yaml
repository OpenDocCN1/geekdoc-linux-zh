    software development, the healthcare industry, the retail industry, and financial
    institutions.


    Wall Street has adopted Linux in a big way. Major companies have been in the press,
    supporting their new implementation projects with Linux. These are not just departmental
    solutions, but large company-wide solutions indicating potential savings of 30
    to 1. These results will certainly attract the attention of Chief Financial Officers
    (CFOs) and Chief Information Officers (CIOs) looking to improve their business
    with leading edge solutions and major spending reductions.


    Linux is also taking hold in the public and government sectors as the IT industry
