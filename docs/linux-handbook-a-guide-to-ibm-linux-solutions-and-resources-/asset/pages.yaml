  md: 'iSeries servers with eight or more processors support a maximum of 32 partitions.
    On select iSeries Models 270, 820, and 840 with SSTAR processors, these shared
    processor partitions can run OS/400 V5R1 or Linux. On iSeries Models 820, 830,
    and 840 with ISTAR processors, Linux requires a dedicated processor.


    With OS/400 V5R1, the minimum processor allocation requirement to create a new
    partition is one-tenth (1/10) of a processor. This allows the primary partitioning
    processing requirements to be reduced to a minimum with the remaining processing
    units used to support secondary partitions.


    An advantage of LPAR is movement among partitions. Processor, memory, and I/O
    resources can be moved among OS/400 and Linux partitions. On select iSeries models,
    one-hundredth (1/100) of a processor can be moved between partitions. On iSeries
    models that support only dedicated processors, processor movement among partitions
    is supported in whole processor increments. With OS/400 V5R1, moving resources
    to or from a Linux partition requires the Linux partition to be restarted.


    A Linux environment on iSeries can be set simply and in. The minimum resource
    for a Linux partition is one-tenth (1/10) of a processor on iSeries that support
    Linux shared processors. In addition, a minimum of 64 MB of memory is needed for
    Linux. The largest Linux partition is determined by the support provided in the
    Linux distribution. The 2.4 64-bit kernel supports up to 24 processors and up
    to 256 GB of memory.


    # OS/400 V5R2


    In OS/400 V5R2, LPAR was enhanced for Linux. With a V5R2 primary partition, shared
    processor resources can be dynamically moved between Linux and OS/400 V5R2 partitions.
    In addition, the number of Linux partitions has increased on iSeries servers with
    SSTAR and POWER4 processors, for example:


    +   - On a one-processor server, up to nine Linux partitions are supported.

    - On a two-processor server, up to 19 Linux partitions are supported.

    - On a four-processor server, up to 31 Linux partitions are supported.


    For V5R2, Linux is supported on the new Model 800, 810, 825, 870, and 890 servers.
    The 890 supports up to 32 processors and 31 Linux partitions.


    iSeries storage virtualization is also enhanced in V5R2. Storage spaces are allocated
    from OS/400 can be dynamically added to Linux partitions. Storage virtualization
    enables Linux to leverage the advanced iSeries storage architecture.'
