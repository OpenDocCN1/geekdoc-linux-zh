  md: '# 7.1.1 Why Linux on iSeries


    You may choose to implement Linux on iSeries for the following reasons:


    +   * Total of ownership support or total cost of acquisition: With shared processor
    and virtual I/O support, there is a minimal hardware requirement for a Linux environment
    on the iSeries server. There are also space and power consumption savings. The
    iSeries server can consolidate Linux and Windows NT servers. This can translate
    into a minimal dollar investment to run Linux applications on the iSeries server.


    iSeries solutions are designed to deliver cost advantages in IT environments.
    CIOView Corporation provides a tool to assess TCO. With the tool, TCOnow!, you
    can estimate the TCO for selected iSeries solutions compared to competitive alternatives.
    To use the tool, go:


    ```

    http://www.ibm.com/servers/solutions/consolidation/tco/

    ```


    +   * Consolidation: The iSeries server can consolidate several servers depending
    on the iSeries model. At the high end of the product line, iSeries supports up
    to 31 Linux partitions. At the low end, a 1-way server. The iSeries server also
    supports up to 32 OS/400 logical partitions, up up to 48 Integrated xSeries servers,
    and up to 60 connected xSeries servers for Windows Server integration.


    Examples of Linux consolidation scenarios in LPAR environment include:


    +   - Workload consolidation: Partition the iSeries server to support Linux workloads
    that normally require separate servers. Such applications as Enterprise Resource
    Planning (ERP), Web servers, and business intelligence are excellent candidates.

    - Foot print consolidation: Partition the iSeries server to support Linux workloads
    from different parts of the world.

    - Production and test: Partition the iSeries server to support Linux production
    and test workloads.

    - High availability: Partition and cluster the iSeries server for a Linux high
    availability solution.

    - Service Bureau, Application Service Provider. Business Recovery Service: Partition
    the iSeries server to support a different Linux-based business in each partition.


    +   * Capacity Upgrade on Demand (CUoD): iSeries processors can be activated temporarily
    or permanently or dynamically allocated to Linux partitions.'
  merge: -1
  pgno: 202
