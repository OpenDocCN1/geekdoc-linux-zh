  md: '# 1.3.2 Where Linux fits in


    The adoption of Linux has been a rapid and changing process. It can be difficult
    to determine where Linux fits into the modern IT world. Figure 1-2 shows the modern
    IT spectrum, from the operating systems to the client interface. Linux plays a
    role in almost every area and is quickly making inroads where traditional operating
    systems ruled for years.


    | Client Interface |

    | Line of Business |

    | Middleware |

    | Data Storage |

    | Infrastructure |

    | Operating Systems |


    Figure 1-2 The IT spectrum: Logically and physically


    # 1.3.3 Working with other operating systems


    Linux is being used not only as the single operating system on a given computer
    system. It is also frequently used to populate virtual partitions on larger, non-Intel
    based systems as the IBM iSeries, pSeries, xSeries, and zSeries servers. The virtual
    or logical partition provide:


    +   **Server consolidation:** An organization with existing Linux or UNIX servers
    can save hardware and personnel costs by consolidating those servers into virtual
    partitions on an existing IBM @server platform.


    +   **High availability:** Multiple virtual partitions can provide a level of
    availability and application-based load balancing while retaining the management
    benefits of consolidated hardware.


    +   **Infrastructure:** Linux virtual partitions can provide security and infrastructure
    services to other partitions that share the same virtual network.'
