- img_proc: true
  md: '# Install node


    In clusters, the compute nodes (and other nodes) may need to be reconfigured or
    reinstalled with a new image relatively often. The installation node provides
    the images and the mechanism to easily and quickly install or reinstall software
    on the cluster nodes.


    # Management node


    Clusters are complex environments. Therefore, the management of the individual
    components is very important. The management node provides many capabilities,
    including:


    +   - Monitoring the status of individual nodes


    +   - Issuing management commands to individual nodes to correct problems or to
    provide simple (yet useful) commands to perform such functions as on/off


    +   - Handling events or alarms from the various nodes in the cluster


    Do not underestimate the importance of cluster management. It is imperative when
    to coordinate the activities of large numbers of systems.


    > Note: Each Model 330 node has an Advanced Systems Management processor (also
    known as a service processor) that allows remote node power on/offreset capability,
    monitors node environmental conditions (fan speed, temperature, power, etc.),
    and allows remote Power-On Self-Test/Basic Input Output System (POST/BIOS) console,
    power management, and SNMP alerts. The Model 342 nodes must included an optional
    service processor to provide the same functionality.


    # User node


    The individual nodes of a cluster are often on a private network that you cannot
    access directly from the outside or corporate network. Even if they are accessible,
    most cluster nodes are not necessarily configured to provide an optimal user interface.
    The user node is the one type of node that is configured to provide that interface
    for users (possibly on outside networks), who may gain access to the cluster to
    request that a job be run, or to access the results of a previously run job.


    # Node types


    Now that you understand the types of logical functions that typically exist in
    a cluster, we discuss the node types (from a hardware perspective) that may exist
    in a cluster. Generally nodes within a cluster are categorized as one of three
    types, each of which is explained in the following sections.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Head nodes


    Head node is a generic term. The head node aids in controlling the cluster, but
    can be used in additional ways. Head nodes generally provide one or more of the
    following logical node functions:


    +   * User node

    * Control node

    * Management node

    * Installation node


    In a small cluster, typically no more than 16 nodes, all of these functions can
    be combined in one head node. In larger clusters, the functions are best split
    across multiple machines for security and performance reasons.


    # Compute nodes


    The compute nodes form the heart of the cluster. The user, control, management,
    and storage nodes are all designed to support the compute nodes.


    Most computations are actually performed on the compute nodes. These nodes are
    logically grouped, depending on the needs of the job and as defined by the job
    scheduler.


    # Storage nodes


    Often when discussing cluster structures, a storage node is defined as a third
    type of node. However, in practice, a storage node is often a specialized version
    of either a head node or a compute node.


    The reason that storage nodes are sometimes designated as a unique node type is
    that the hardware and software requirements to support storage devices may vary
    from other head or compute nodes. Depending on your storage requirements and the
    type of storage access you receive, this may include special adapters and drivers
    to support RAID-5, storage devices attached via channel storage, and others.


    # 9.2.2 Networks


    Nodes within a cluster have many reasons to communicate. After all, they are cooperating
    to provide an overall result. The needs defined by the different communication
    types tend to dictate the various network technologies to serve those needs.


    # Communication types


    Some of the key communications that must occur are explained in the following
    sections.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Interprocess communication


    The nodes in a cluster work together to provide an overall solution. Therefore,
    the task that each node performs is often interrelated with the tasks that the
    other nodes perform.


    Just as in a multi-processing or multi-threaded single system, there is always
    a need for communication between processes to coordinate and handle concurrent
    access to shared resources. The interprocess communication network is often referred
    to as the cluster interconnect. It may share a physical connection with the storage
    or management networks.


    # Management operations


    With a large number of nodes, it is important to recognize that an individual
    node may be failing. It is also important to proactively issue commands that may
    prevent an error from occurring.


    It is not feasible to manage multiple nodes of a cluster individually in a stand-alone
    manner. There must be a way to communicate from one or more management nodes to
    any other node in the cluster.


    > Note: IBM Cluster 1350 provides a service processor network. It uses the newer
    RSA adaptors, which are one for every 11 nodes. The service processor is built
    in and has its own Ethernet port and cable. Because of this, only one Ethernet
    cable per eight nodes is required, as opposed to using a PCI slot and Ethernet
    cable per node.


    # Software installation


    For a variety of reasons, individual nodes often need to have their software reinstalled.
    This may be due to reconfiguration for a specific task to be performed by the
    cluster, or simply to replace the operating environment when an individual node
    has suffered a disk failure.


    Either it is important that system images can be efficiently defined and distributed.
    This operation may be done to certain nodes while the rest of the cluster is operational
    and performing work, it is important that pushing a new operating environment
    to some nodes does not adversely affect the performance of the other nodes.


    # Storage access


    In most clusters, individual nodes need to read or write data to a shared storage
    device. For high performance computing, it is contrary to the intention of the
    cluster if this storage access proved to be a bottleneck and resulted in other
    nodes waiting to access the device. Therefore, it is important to have both an'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'efficient network for fast access to storage and a file system that provides
    efficient, concurrent access to the data.


    # Common network technologies


    Depending on the actual application and the performance requirements, various
    communications should be carried out on different networks. Therefore, you typically
    have more than one network and network type linking the nodes in your cluster.
    Common network technologies used in clusters are explained in the following sections.


    # Fast Ethernet


    Fast Ethernet and TCP/IP are the two standards used for most networking. They
    are simple and cost-effective, and the technology is always improving. Fast Ethernet
    works with lower speed Intel-based machines used by Beowulf nodes, and can operate
    at either half-duplex or full-duplex. data can be sent and received at the same
    time. Full-duplex transmission is deployed between the ports on two switches,
    between a computer and a switch port, or between two computers. Full-duplex requires
    a switch, which a hub will not work.


    # Gigabit Ethernet


    Gigabit Ethernet uses a modified version of the American National Standards Institute
    (ANSI) X3T11 Fibre Channel standard physical layer (FC-0) to achieve one Gigabit
    per second raw bandwidth. Gigabit Ethernet supports multi- and single-mode optical-fiber
    and short-haul copper cabling. Fibre is ideal for connectivity between switches
    and servers and can reach a greater distance (from 500 meters to 10 kilometers
    today)


    # Myrinet™


    Myrinet is a high-performance, high-availability, packet communication and switching
    technology. Myrinet links may be up to 200m in multimode fiber and operate full-duplex
    at data rate of 2+2 Gigabits per second. Myrinet switches are low-latency, cut-through
    devices that can be combined to provide networks up to thousands of hosts and
    network-bisection data rates in Terabits per second. Myrinet interfaces include
    a processor and firmware to offload packet processing from the host computer.


    Myrinet software support for Linux and for other operating systems provides multiple
    software interfaces. This includes the native Myrinet API, TCP/IP and UDP/IP,
    MPI, VI, PVM, and Sockets. All Myrinet software support is open source.


    For more information about Myrinet, see the following Web site:


    ```

    http://www.myri.com/

    ```'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Fibre Channel


    Fibre Channel is a data storage technology that can provide cluster nodes with
    shared access to data. Fibre Channel is a loop architecture as opposed to a bus
    architecture like SCSI. The loop structure enables the rapid exchange of data
    from device to device, achieving a maximum data transfer rate of 100 MB/sec. Fibre
    Channel is a common technology used to provide clusters with rapid and shared
    data access.


    > Note: Cluster 1350 supports the IBM FASIT Storage subsystem and IBM TotalStorage
    Enterprise Storage Server.


    # Internet Small Computer Systems Interface (iSCSI)


    iSCSI is a standard that allows SCSI information to be encapsulated and transported
    over a TCP/IP network. The benefit of this approach is that organizations can
    take advantage of their existing network infrastructure to provide access to data
    resources anywhere on the network using the I/O commands they use for local data.
    iSCSI can allow Linux clusters to access remote data stores without requiring
    additional infrastructure.


    As the iSCSI standard matures, several developments are expected. The first is
    the introduction of Host Bus Adapters (HBAs). HBAs improve performance and throughput
    by offloading the TCP/IP overhead from client operating systems. The second is
    the deployment of 10-Gigabit Ethernet, which dramatically improves the data rates
    at which iSCSI can operate.


    Cluster 1350 does not support iSCSI. It is mentioned here for completeness.


    > Note: IBM TotalStorage IP Storage 200i is an iSCSI solution that provides support
    for 10.2 GB up to 3.52 TB of RAID storage.


    # InfiniBand


    InfiniBand is a technology that is designed to provide a channel-based switched
    fabric that is capable of handling any kind of communication between processors
    and I/O devices. Because of the high bandwidth designed into the standard (2.5
    Gbits, 10 Gbits, and 30 Gbits/sec.), InfiniBand is expected to gradually replace
    the existing Peripheral Component Interconnect (PCI) shared-bus approach used
    in most of modern Intel-based computers, and is seen as an ideal communication
    media for the data-intensive demands of clusters.


    Cluster 1350 does not support InfiniBand. It is mentioned here for completeness.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '**Note:** IBM offers several InfiniBand products, including the InfiniBlue
    4X Host Channel Adapter (HCA). This allows current PCI-based Linux servers to
    connect to an InfiniBand network.


    # 9.2.3 Support software


    Software binds the hardware infrastructure together. It creates and manages the
    abstraction layer that allows users and applications to view the collective cluster
    resources as a single computing entity. There are three main cluster software
    categories.


    # Operating system


    Nodes in a cluster typically run the same operating system. For large clusters,
    it is important that this operating system be economically viable, as well as
    easily deployable across the nodes. This implies that it should be easily installable
    in an automated fashion, and support remote access for management and configuration.


    Linux meets these requirements. In fact, the low cost of obtaining Linux and the
    rich function for developing and deploying applications that run on Linux have
    been the catalyst for increasing in clusters to meet the needs of a variety of
    computing problems. By using relatively low cost Intel-based hardware and Linux,
    many businesses that previously could not justify the expense of a cluster are
    now adopting the technology at a frenetic pace. As we previously mentioned, there
    are other considerations when building a cluster, such as how to manage a large
    number of nodes.


    **Note:** To provide a common base on which the complex mixture of hardware and
    software that is required to form a cluster can be tested and consistently deployed,
    Red Hat and SuSE will be supported on Cluster 1350 as of first quarter 2003. Additional
    Linux distributions and versions will be considered for the future.


    # File system


    Depending on the actual application, many clusters require a large number of nodes
    to have concurrent and very high-speed access to the same files. cases, it is
    important to provide a shared file system that provides data protection and the
    performance that is typically required for cluster-based applications.'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'Note: IBM provides the General Parallel File System (GPFS) for Linux. GPFS
    is a proven file system that has been used for years in AIX clustering environments.
    It is available for Linux and xSeries 300 hardware.


    # Management tools


    When the hardware previously discussed, you can easily construct a cluster. This
    is only the beginning of putting a cluster into production.


    One of the most difficult parts of deploying a cluster is having the right tools
    in place to manage a large number of nodes as a single entity. This includes:


    +   * Managing node and group information

    * Monitoring and controlling hardware

    * Running remote commands on multiple machines

    * Monitoring system events

    * Managing and synchronizing configuration files for all machines

    * Providing security

    * Diagnostic problems

    * Installing software


    Note: IBM provides cluster management through two utilities: xCAT and Cluster
    Systems Management (CSM) for Linux. xCAT is a more mature product and uses the
    xSeries service processor. This maturity is a great strength. xCAT is used by
    all three NCSA TF systems.


    CSM includes technology derived from PSPF. While it is the standard management
    software for Cluster 1350, it can also be used for cluster systems management
    on any open, Intel processor-based server.


    # 9.2.4 Applications


    Few off-the-shelf HPC applications exist, for the same reason that HP clusters
    tend to be focused on a specific, unique task. HTC solutions also tend to be custom-written
    and focus on massive calculation projects. HA clusters typically rely on middleware
    as the software layer that requires the most customization to ensure reliability,
    recoverability, and even scalability.


    The two HA subtypes, storage and database clusters, each have their special concerns
    that may require application customization. For storage clusters, more emphasis
    is placed on the capabilities of the distributed file system itself. However,
    some customization of specialized retrieval libraries (layered between the application
    and the distributed file system) is common.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'With database clusters, customization is driven by the primary concerns of
    availability and recovery. However, scalability is increasingly becoming a concern.


    You can approach the load balancing clusters in two ways:


    +   - Server farm


    The traditional way of scaling loads is to provide a server farm that sits behind
    a server that spreads all incoming requests across the various nodes of the cluster.
    The advantage of server farms is the low amount of customization typically required
    to implement this type of load balancing.


    +   - Process migration/Single System Image (SSI) cluster


    Using kernel-level extensions, process migration clusters can seamlessly move
    execution processes to and from any node in the cluster. The benefit of this approach
    is that applications do not have to be rewritten to take advantage of this approach
    to load balancing.


    An SSI cluster expands the simple process migration model to create unified cluster-wide
    inter-process communication (IPC) objects, such as pipes, fifos, semaphores, message
    queues, shared memory, sockets, and signals. This allows programs, processes,
    and users to work together regardless of the node on the cluster they are executing.


    Either type of load balancing (server farm and process migration) may still require
    a distributed file system or additional customization to deal with data concurrency
    issues.


    9-8 shows how all the various cluster components come together. Notice that the
    top four layers are all software components. This abstraction layer serves the
    creation of a cluster environment from a heterogeneous mix of hardware. Because
    an effective cluster can be made up of any type or brand of server, interconnect,
    or storage subsystem, clusters can take advantage of commodity hardware or the
    existing IT resources of an organization.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '![](img/6b2be6cf94c5583e73925c180246991a_287_0.png)


    Figure 9-8 Layout of cluster components


    +   Note: IBM provides the following cluster-enabled applications:

    * DB2 Universal Database (UDB) Enterprise-Extended Edition (EEE)

    * WebSphere Application Server

