    # 1.3 Linux: The operating system


    Over the past few years, the Linux operating system has become a real and viable
    alternative for PC users as well as corporate servers and users. Linux delivers
    the power and flexibility of a UNIX server or desktop. It provides a set of utilities,
    Internet applications, and a fully functional desktop interface.


    The Linux operating system has become a server platform for very powerful Internet
    applications. The Linux operating system is capable of running corporate Web servers,
    FTP, Gopher and wide-area information server (WAIS) Web sites.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Linux is a fully functional operating system similar to a UNIX system. It has
    all the standard features of enterprise UNIX systems. Management of the command
    structure is enabled through shells. We mention two of the many advanced shells
    that are available for Linux, the Bourne Again shell (bash) and the tsch shell.
    Both shells support a complete shell-based programming language that you can use
    to create scripts.


    There are four fundamental components of Linux:


    +   * Kernel: Provides program and hardware device management (such as disks and
    printers)


    +   * Shell: Receives commands from the user and sends commands to the kernel
    for the execution through a standard user interface.


    +   * File structure: Files are organized into directories with the disk hardware.
    Each directory may contain any number of subdirectories holding files. This is
    a similar structure to PC operating system file structures.


    +   * Utilities


    In some solutions, typically with clusters, the Linux server does not need the
    traditional PC hardware BIOS. The hardware is directly controlled by Linux. This
    provides phenomenal boot-up times (three seconds is the current record).


    Linux has the same multiuser and multitasking capabilities as large UNIX servers.
    It provides the same level of system administration that you find on standard
    UNIX systems. Users can run several programs concurrently. You can create user
    accounts for different users and define their access rights to the system components.
    Installation of new devices and network connection and control is provided as
    standard in the Linux operating system.


    As a development environment, Linux has a powerful set of development tools for
    creating industrial-strength applications. The development tools includes the
    **GNU C Compiler**.


    The Linux structure provides the ability for programmers to access the hardware
    of the computer and the networks to which it is connected. This is achieved by
    the provision of a hardware abstraction layer where programs can take advantage
    of hardware features through a standard applications programming interface (API).


    Linux programs can be portable to other versions of UNIX systems. Linux can use
    ANSI C, combined with one of several portability graphical user interface (GUI)
    toolkits. These programs can be written for both UNIX systems and Windows servers.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 1.3.1 Linux BIOS management


    In a cluster environment, the ability to quickly reconfigure hardware is particularly
    desirable. Linux can help with this task. Linux has the ability to boot without
    a BIOS. Current PCs used as cluster nodes depend on a vendor-supplied BIOS for
    booting. The BIOS, in turn, relies on inherently unreliable devices, such as floppy
    disks and drives, to boot the operating system. In addition, current BIOS software
    is unable to accommodate non-standard hardware, making it difficult to support
    experimental work. The BIOS is slow, often erroneous, redundant, and most importantly
    difficult to maintain. Imagine walking around with a keyboard and monitor to each
    of the 128 nodes in a cluster to change one BIOS setting.


    The BIOS guinzps the Linux kernel from NVRAM and requires no moving parts other
    than the fan. It performs a minimal amount of hardware initialization before jumping
    to the kernel and lets Linux do the rest. As a result, it is much faster (current
    record three seconds), which has sparked interest in the consumer electronics
    community as well. Moreover, updates can be performed over the network.


    Using a real operating system to boot another operating system provides much greater
    flexibility than using a simple reboot program or the BIOS. Because Linux is the
    boot mechanism, it can boot over standard Ethernet or other interconnects such
    as Myrinet, Quadrics, or SCI. It can use SSH connections to load the kernel, or
    it can use the InterMetro caching file system or traditional network file system
    (NFS). Cluster nodes can be as simple as necessary, perhaps as simple as a CPU
    and memory, no disk, no floppy, and no file system. The nodes will be less autonomous,
    yet easier to maintain.


    > LinuxBIOS is an open source project. aims to replace normal BIOS with hardware
    initialization and a compressed Linux kernel that can be booted from a cold start.
    The project began as clustering work in the Cluster Research Lab at the Advanced
    Computing Laboratory at Los Alamos National Laboratory. The motivation for the
    project was for the operating system to gain control of a cluster node at power.
    Other benefits of LinuxBIOS include needing only two working motors to boot (CPU
    power and supply), fast boot times (current fastest is three seconds), and freedom
    from proprietary (buggy) BIOS code. Overall, the benefits are numerous and helped
    gain support from many vendors in the high-performance computing and embedded
    computing markets.


    For more information about LinuxBIOS, refer to the following Web site:\http://www.linuxbios.org/index.html


    ```

    http://www.linuxbios.org/index.html

    ```'
  merge: -1
  pgno: 34
