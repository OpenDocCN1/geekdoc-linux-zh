    # Linux clusters


    A cluster is a collection of interconnected, complete systems that work together
    to provide a single, unified computing capability. The resulting cluster can either
    be a parallel system or a distributed system.


    This chapter discusses:


    +   - Clusters

    - Linux cluster components

    - Linux cluster history

    - Linux cluster solutions

    - The future of Linux clusters'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'This section reviews the major cluster concepts and types. It covers the benefits
    of a cluster and the role that clusters play in emerging computer trends.


    # 9.1.1 Core cluster concepts


    Figure 9-1 SMP system with shared storage and memory'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'Figure 9-2 shows an example of a grouping of separate servers in an MPP arrangement.


    ![](img/6b2be6cf94c5583e73925c180246991a_268_0.png)


    Figure 9-2 MPP system with an individual processor and memory clusters


    +   - **Scalability**: Clusters can scale into the thousands of heterogeneous
    nodes while remaining competitive on price and performance against MPP systems.

    - **Availability**: Because clusters have multiple interconnected physical nodes
    and resources (as shown in Figure 9-3), they can ensure better data continuity
    and recovery operations.


    ![](img/6b2be6cf94c5583e73925c180246991a_268_1.png)


    Figure 9-3 An availability cluster'
  merge: -1
  pgno: 268
- img_proc: true
  md: '+   - Resource sharing Clusters can be the optimum solution for computing environments
    that need to dynamically assign and manage processing and storage resources in
    a multiuser environment.


    # Traditional cluster roles


    Originally, clusters were part of a larger parallel computing heritage that emphasized
    the speed of calculations above all else. Over time, the use of clusters expanded
    into other areas. The following three areas are the traditional computing roles
    played by clusters.


    High Performance Computing (HPC)

    HPC clusters are designed to use parallel computing to apply more processor power
    to the solution of a problem. There are many examples from scientific computing
    where using low-cost processors in parallel to perform large numbers of operations
    can be highly cost effective while providing massive amounts of computing power.
    This is referred to as *parallel computing or parallelism*. Table 9-1 shows the
    application areas and some examples of HPC.


    | Application area | Application examples |

    |---|---|

    | CAE (Computational Fluid Dynamics) | - Fluent<br>- STAR-CD<br>- PowerFlow (from
    Enterprise X-Architecture) |

    | CAE (Crash) | - LS-DYNA<br>- PAM-CRASH<br>- Radioss |

    | CAE (Structures) | - Nastran<br>- Ansys<br>- Abacus |

    | Petroleum (Reservoir Modeling) | - Eclipse<br>- VIP |

    | Life Sciences (Ab Initio Chemistry) | - Gaussian<br>- Gamess<br>- Jaguar |

    | Life Sciences (Molecular Modeling) | - Charmm<br>- Amber |


    Typically, parallelism in a cluster is achieved through message passing (Figure
    9-4). Message parsing invokes an application running on one node that takes a
    large set of data, breaks it into smaller chunks, and passes those chunks to the
    other nodes in the cluster. As each node processing its'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'respective chunk, it returns that chunk to the node of origin, which reassembles
    the information into a result set.


    ![](img/6b2be6cf94c5583e73925c180246991a_270_0.png)


    Figure 9-4 A simplified view of cluster message passing


    The bottleneck in most clusters is not the processor, but rather the communication
    infrastructure used to pass messages from processor to processor to include the
    data bus of each node. The data bus in most commodity hardware operates at a noticeably
    slower speed than the processor (or the network infrastructure) does. Because
    of this, clusters typically do not scale beyond a few thousand nodes, even though
    the most powerful performance commodity clusters are usually between 1,024 and
    2,048 nodes.


    Creating an architecture for this kind of cluster brings in its own challenges.
    include:


    +   - How to install and maintain the operating and application environment on
    all nodes


    +   - How to proactively manage these nodes through issuing commands and gracefully
    handling failures


    +   - The requirement for parallel, concurrent, and high performance access to
    the same file systems


    +   - Inter-process communication between the nodes to coordinate the work that
    must be done in parallel


    The goal is to provide the image of a single system by managing, operating, and
    coordinating a large number of discrete computers. Often in this environment a
    user interacts with a specific node to initiate or schedule a job to be run. The
    application, in conjunction with various functions within the cluster, then determines
    how this job is spread across the various nodes of the cluster to take advantage
    of the resources available to produce the desired result.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# High Throughput Computing (HTC)


    While science needs have driven HPC and parallel operations (and consequently,
    cluster technology), some areas of research place a higher emphasis on throughput
    (quantity) of data operations than on the speed of data operations.


    > Note: A common analogy used to explain the difference between HPC and HTC is
    the fighter jet versus the commercial airliner jet. While a fighter jet can carry
    a single individual to a destination faster than an airliner jet, the airliner
    jet can carry (more than 200) individuals at a time, on the average, providing
    a more efficient transportation medium.


    Typically these types of operations can take weeks or months of computational
    time to solve. These operations are also distinguished from HPC from the lower
    coupling requirements that are needed. A simple definition of coupling is the
    required level of data sharing among nodes at any time. Because many HTC environments
    do not meet the strict definition of parallel computing (either through design
    or execution), they are often referred to as distributed computing environments.


    Common examples of HTC applications include protein folding and radio astronomy,
    among others.


    To learn about protein folding, see:


    ```

    http://folding.stanford.edu/

    ```


    To learn about radio astronomy, see:


    ```

    http://setiathome.ssl.berkeley.edu/

    ```


    A variety of HTC applications run on common client operating systems. You can
    learn about these applications on the Web at:


    ```

    http://www.techimo.com/teams.html

    ```


    Blue Gene research project: This goal of this IBM research project is to build
    a massively parallel computer to be applied to the study of biomolecular phenomena
    such as protein folding. The project was expanded by the addition of Blue Gene/L.
    Blue Gene/L is also part of IBM''s research initiative in automatic computing
    to design computer systems that are self-healing, self-managing, and self-configuring.
    To learn more about this research, see:


    ```

    http://www.research.ibm.com/bluegene/press_release.html

    ```'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'Figure 9-5 shows an example of protein folding for a typical HTC application.
    Some considerations of HTC clusters include:


    +   - Defining the minimum level of coupling required by the HTC applications

    - Determining how to allocate computing resources among multiple users of the
    cluster

    - Resolving conflicts that may arise if resource entities or individuals own their
    own nodes that participate in the cluster


    ![](img/6b2be6cf94c5583e73925c180246991a_272_0.png)


    # High-availability cluster


    High-availability clusters (Figure 9-6) are typically built with the intention
    of providing a resilient environment through redundancy. They provide a computing
    environment where the failure of one or more components (hardware, software, or
    networking) does not significantly affect the availability of the application
    or applications being used.


    In the simplest case, two computers may be configured identically with access
    to shared storage. During normal operation, the application environment executes
    on one system, while the other system simply stands by ready to take over running
    the application in the case of a failure.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '![](img/6b2be6cf94c5583e73925c180246991a_273_0.png)


    Figure 9-6 High availability example: A Web server farm


    When a failure occurs, the second system takes over the appropriate resources
    (storage, networking address, and so forth). This process is typically called
    failover. The second system then completely replaces the failed system. The end
    users do not need to know that their applications are running on a different physical
    machine.


    As you may expect, actual high availability clusters can be complex to design,
    especially if shared, coherent data storage is required. In fact, two subcategories
    of high availability clusters are file storage and database cluster, each with
    their own particular requirements and demands. Understanding all possible failure
    types and building in redundancy and the processes required to provide a smooth,
    efficient, and transparent failover is a difficult endeavor.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Some of the abilities of high availability clusters include:


    +   - Providing an administrative switch between nodes for maintenance, upgrade,
    or other non-failure situations


    +   - Maintaining a consistent environment between all nodes


    +   - Recognizing when a failure has occurred


    +   - Implementing the failover process so that all required resources are available
    to the standby node


    +   - Providing transaction and data integrity in case of a failure


    All areas, despite their differences, attempt to provide some level of abstraction,
    allowing users, and to an extent applications, to see the cluster as a single
    resource intended instead of individual computers.


    # Emerging roles


    Over time, clusters are being used for more targeted use. Variations on the traditional
    cluster roles are discussed in the following sections.


    # Server consolidation


    Clusters can be an ideal platform for server consolidation because they provide
    a single point of control for software installation, hardware control, system
    monitoring, and application maintenance. Parallel or Web-based applications can
    take advantage of the scaling (see Load balancing in the following section) and
    price-performance capabilities of a cluster. Clusters can also make an ideal end
    in a multitiered architecture.


    Some considerations include:


    +   - Centralizing management of resources that previously were scattered multiple
    sites


    +   - Greater economy of scale from reducing physical redundancy


    +   - Data integration provides higher availability, improved recoverability,
    and easier management of enterprise data


    +   - Application integration provides an opportunity for business process synergy


    # Load balancing


    Load balancing (and, by extension, horizontal scaling) involves multiple servers
    providing a single interface to a set of resources that can arbitrarily grow (shrink)
    in size over time. The most common example of this is a Web server farm. Here,
    a single Universal Resource Locator (URL) (the interface) is used to access a
    Web site (the resource). Requests coming in through that interface can be allocated
    across a large set of servers. This provides higher capacity and the'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'ability to manage the end user experience through such functions as load balancing.


    Figure 9-7 shows an example of how load balancing was used in the 1998 Winter
    Olympics.


    ![](img/6b2be6cf94c5583e73925c180246991a_275_0.png)


    Figure 9-7 Load balancing for the 1998 Winter Olympics


    Scaling considerations include:


    +   - Establishing baseline estimates of high and low resource usage limits


    +   - Determining which elements of an application must be reworked (if any) to
    take advantage of a horizontally-scalable cluster


    **On-demand computing**

    The technologies that will eventually support on demand computing are still in
    their infancy. These technologies include grid and autonomic computing. There
    is little doubt that clusters will have a role to play. See 9.5, "The future of
    Linux clusters" on page 271, for more information.


    # 9.1.2 IBM cluster offerings


    IBM has several product-based cluster offerings. This section discusses of them.


    252 Linux Handbook: A Guide to IBM Linux Solutions and Resources'
  merge: -1
