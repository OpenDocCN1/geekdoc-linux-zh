  md: '# 9.4.3 Solution examples


    Cluster 1300 and Cluster 1350 are the primary current Linux cluster packages offered
    by IBM. However, companies still choose IBM hardware and middleware to support
    their custom cluster solutions. This section offers examples of Linux clusters
    in the real world.


    # High-performance computing: NCSA


    The National Center for Supercomputing Applications (NCSA) is a research organization
    based in a United States. Its mission is to create high-performance computing
    infrastructures for scientists. IBM has installed two Linux clusters for the NCSA.
    The first cluster includes more than 600 xSeries running and Mycom''s Myrinet
    interconnect network. The second cluster is one of the first to use Intel''s next
    generation 64-bit Titanium processor and will run SuSE.


    ![](img/6b2be6cf94c5583e73925c180246991a_292_0.png)


    It would take more than one-a-half million years for a person to tabulate with
    a calculator the number of calculations that the NCSA supercomputer handles in
    a single second. The NCSA needs immense speed and power to simulate the violent
    collision of black holes and gravitational waves.


    You can learn more about the IBM NCSA cluster on the Web at:


    ```

    http://www.nucsa.uiuc.edu/About/NCSA/

    ```


    Plus, you can find more information about Linux clusters on the NCSA Web cluster
    at:


    ```

    http://www.nucsa.uiuc.edu/News/Access/Stories/ClusterUpdate/

    ```


    # Experimental Itanium-based cluster used to study fluid dynamics


    As of May 2001, NCSA''s resident Linux cluster using Intel''s 64-bit Itanium architecture
    was a 64-processor collection of machines on loan from IBM. Its purpose is to
    give NCSA cluster development team the chance to get codes up and running on the
    Itanium architecture before delivery of the 320-processor terascale Itanium-based
    cluster.


    As it turns out, this experimental cluster is proving to be much more than a tool
    for benchmarking and troubleshooting. It is showing that breakthrough science
    can be done on even relatively small Itanium-based clusters.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'A team of scientists at the University of Minnesota''s Laboratory for Computational
    Science and Engineering (LCSE) are using the Itanium-based Linux cluster to create
    detailed simulations that show the behavior of turbulent flows. This data is now
    being visualized on a one billion cell grid. The LCSE team expects to perform
    even more detailed simulations consisting of an eight billion cell grid. These
    simulations will test theories about the behavior of turbulent fluids first gleaned
    from an earlier billion cell simulation done at Lawrence Livermore National Laboratory
    in 1998. That simulation was done over one week using a 3,840-processor computer.
    However, follow-up work was never done because the Livermore machine was relegated
    to a classified environment.


    # # Cluster run aids gas dynamics research


    The 8-billion cell simulation on the NCSA cluster gives the LCSE team the chance
    to compare new, more detailed data to their 1998 data. Visualization and analysis
    of the 1998 simulation of the unstable mixing layer in gas flows revealed an unexpected
    correlation between the behavior of the turbulent flow on small scales and some
    aspects of the large-scale velocity field.


    This suggests a new method for modeling the effects of small-scale motions upon
    large-scale ones in gas dynamics simulations. The new modeling method requires
    high resolution, since these newly-found relationships may not be evident in lower
    resolution simulations.


    The LCSE team, led by LCSE Director Paul Woodward, uses the gas dynamics code
    Piecewise-Parabolic Method (PPM). Because the PPM application is extremely scalable,
    Woodward expects to see better performance on NCSA Itanium clusters as they grow
    larger.


    Unlike their simulations on the Livermore machine, the researchers can save all
    the data from this large simulation. This is made possible by the increased availability
    of disk space gained by commodity drives and the archival storage system. The
    data is then transferred over the Abilene network to the LCSE terascale data analysis
    and visualization system for detailed analysis.


    The goal of the research is to develop an accurate model of the behavior of unresolved
    fluid turbulence in computer simulations. Achieving this would make possible more
    accurate simulations of gaseous flows in astrophysics, meteorology, and aerospace
    applications. If the model can be extended to liquid flows, it can also help develop
    more accurate simulations of turbulent flows in oceanography and in engineering
    applications.'
  merge: -1
