    VisualAge C++, V6.0 for Linux on pSeries includes the benefits of IBM''s compiler
    optimization technology. Through compiler options, directives, and pragmas, programmers
    are offered a number of ways to optimize their code. Using the -O2, -O3, -O4,
    and -OS, you can obtain optimization levels that run from comprehensive low-level
    optimizations to more extensive optimizations that include interprocedural analysis,
    loop optimization, and automatic machine tuning. For optimization option include:


    +   -qqarch, -qtune, and -qcache allow you to optimize your application to the
    POWER3 and POWER4 architecture.


    +   -qhot allows for high-order transformations, which are optimizations that
    specifically improve performance of loops through such techniques as interchange,
    fusion, and unrolling.


    +   -qipa invokes interprocedural analysis (IPA) that enables the compiler to
    optimize across different files (whole-program analysis). It can result in significant
    performance improvements.


    +   -qpdf (that is profile-directed feedback) uses results from sample program
    execution to fine tune optimizations in conditional branches and frequently executed
    code sections.'
