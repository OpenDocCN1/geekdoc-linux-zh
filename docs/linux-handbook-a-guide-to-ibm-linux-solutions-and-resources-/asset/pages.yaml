    # 7.1.5 iSeries distributions


    Linux for the iSeries server is available from leading Linux distributions Red
    Hat, SuSE, and Turbolin. These Linux distributions are based on Version 2.4 of
    the Linux kernel for PowerPC. Starting in January 2002, these became available
    for iSeries based on the 64-bit PowerPC kernel. The latest Linux distributions
    support 64-bit and 32-bit applications. The Linux distributions include the device
    drivers and other support required to run on an iSeries server.


    Beyond the kernel, these Linux distributions include the operating system, middleware,
    and applications. For example, they include the Apache, Tuc, and Zope Web servers;
    the Sendmail, Postfix, and exim mail facilities and servers;'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'the Samba NFS file servers; the lrpng and cups print servers; and the TCP wrappers
    and iptables firewalls. The selected distributions also contain key integration
    technology with OS/400 including ODBC and JDBC support to access DB2 UDB in OS/400.


    The current distributions are:


    +   - Red Hat Linux 7.1 for iSeries, 64-bit, supports 32-bit applications

    - SuSE Linux Enterprise Server 8, supports 64-bit and 32-bit applications

    - Turbinolux 7 for iSeries, supports 32-bit applications


    # 7.2 Consolidation


    With iSeries LPAR technology and support for multiple application environments,
    e-business technologies, and operating systems, you have the flexibility to choose
    the best applications for your needs. In a single server, you can run your core
    business and e-business applications, such as Lotus Domino on OS/400 or Linux
    e-mail servers, Web servers, or firewalls. You can centrally manage them while
    they are running completely independent of one another.


    The iSeries server can host and integrate objects and data from another operating
    system with its own core operating system, OS/400, making versatile for mixed
    IT environments. The iSeries supports these operating environments:


    +   - OS/400 with up to 31 secondary partitions (run OS/400 natively)

    - Linux for PowerPC running natively within an iSeries logical partition. Linux
    applications can supplement OS/400 applications. You can run up to 31 separate
    Linux partitions, all on the iSeries server.

    - Microsoft Windows servers via the Integrated xSeries Adapter and the Integrated
    xSeries Server.

    - UNIX via the OS/400 Portable Application Solutions Environment (OS/400 PASE),
    via OS/400 PASE is an environment that is both independent and tightly integrated
    with OS/400. UNIX applications can be ported to and executed in the OS/400 PASE
    environment. They can also access objects in OS/400, all with little or no modifications
    to the original UNIX application.


    Figure 7-2 shows how the iSeries works as a consolidation server.'
