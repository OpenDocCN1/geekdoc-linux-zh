    # 10.6 Examples of Linux services


    IGS has been successful in delivering services to our new Linux Clients. This
    section shares a few examples of such situations.


    # 10.6.1 Example #1: A billion dollar financial institution


    This customer was running Red Hat 6.2 on a VA hardware cluster solution. The customer''s
    financial application would crash and core dump on 3% of the runs. There was no
    pattern to when the failure would occur. The problem plagued the customer''s IT
    department for over two months. No other Linux service providers could identify
    the problem.


    The same problem was reported sporadically on the kernel mailing list for two
    years with no one to identify the problem, nor offer a solution. Any attempts
    to instrument the kernel to isolate the problem changed the timing of the code
    and the problem would disappear (masked). The only possible way to find the root
    cause was via detailed code inspection that revealed IA32 assembly code at most
    fundamental level. Through a series of test cases and inspection, IBM isolated
    the problem to a bug in switch_mm(), which resulted in a process running with
    a ''stae'' ldt.


    IBM recommended a fix to the kernel mailing list, and it is accepted by Linux
    Torvalds. He responded in a personal note back to the IBM Linux Change team and
    released in the v2.4.8 Linux kernel.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 10.6.2 Example #2: A multi-million dollar advertising company


    This customer was running Red Hat 7.1. They experienced a situation where embedded
    Linux NFS client would error on NFS mounts from the server at random points in
    time, but within a 24-hour period of booting. IBM reproduced the problem using
    the exact hardware and a copy of the software that the customer was running. Using
    iterative debug kernels and creating kernel dumps on error, IBM isolated the problem
    to NFS kernel code that was erroring with hard links beyond the exported directory.


    IBM provided a work around immediately given to the customer, while a patch was
    developed and consensus in the open source community was gained for a long-term
    code fix. Agreement was made and the fix will be included in the latest 2.4.x
    kernel. Previous threads to the kernel mailing list indicated that others had
    run into this problem previously, but no one could isolate it to the root cause.


    # 10.6.3 Example #3: One of the largest network services providers


    When this customer, running Red Hat 6.2, upgraded their hardware, they ran into
    a problem where the system hung 15 minutes after boot time. The original problem
    statement indicated that no software changes were made and only processor upgrades
    were completed from one release to another. Working through the weekend to investigate
    the problem, IBM found that a boot parameter was set to hard code memory boundaries.
    This was in conflict with reserved set for the BIOS.


    Further investigation demonstrated that the boot parameter did not need to be
    set because the system properly probes memory size and sets it accordingly. In
    Red Hat 7.1, code was added to check BIOS memory allocation and not to override
    it with boot-time configuration settings.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Desktop Linux


    This chapter introduces you to the Linux architecture. In particular, it examines
    the kernel that is related to the rest of a complete distribution. It describes
    the components that you see on the desktop and reviews two of the major office
    suites that run under Linux.


    This chapter also presents some of the Linux hybrids that are available, which
    may help you in transitioning from Windows to Linux. Finally it weighs the advantages
    and disadvantages of each of the three solutions in deploying Linux in a business.'
