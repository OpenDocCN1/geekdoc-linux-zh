    # 1.9.2 What is common among the distributions


    There is much in common among each distribution. For example, each distribution
    comes with two possible desktop GUI interfaces: K Desktop Environment (KDE) and
    GNOME. To the end user, they are functionally equivalent. Choosing one over the
    other is a matter of personal preference. Both of these Windows GUI well as graphical
    interfaces. For developers, the difference is the set of tools and libraries that
    each option offers. KDE uses the Qt C++ cross-platform GUI toolkit for KDE development,
    while GNOME uses the Graphics Tool Kit (GTK) and other tools and utilities.


    Each distribution has its unique installation program. Some are instead of text-based
    programs. An office suite is usually included with each distribution such as Star
    Office, Open Office, or a distribution-created office suite. Most distributors
    also contain a variety of utilities that include configuration and installation
    utilities, firewalls, Web browsers, and Web server programs.


    The distributions include differences in the versions of the kernel, compilers,
    libraries, etc., supported languages, and adherence to standards. UnitedLinux
    seeks to answer some of these issues with standards. Support can also vary from
    distributor to distributor, for example response times to problems, sales and
    support coverage over geography, etc.


    # 1.9.3 What is open source


    Open source is often thought of as software that is given away or free to be redistributed.
    In reality, open source is software whose source code is available free of charge
    to the general public. The rationale for this concept is that a larger'
