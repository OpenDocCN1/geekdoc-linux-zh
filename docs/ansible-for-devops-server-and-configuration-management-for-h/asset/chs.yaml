  \                  /\n -----------------------------------------\n        \\   ^__^\n\
  \         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w\
  \ |\n                ||     ||\n```\n\n## 后记\n\n你已经在通精简化基础设施管理的道路上了。许多开发者和系统管理员受益于这本书，许多人甚至更进一步，以更错、建议和富有讨论的形式向本书做出了贡献！\n\
