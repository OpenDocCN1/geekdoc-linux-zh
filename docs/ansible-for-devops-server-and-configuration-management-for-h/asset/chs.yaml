  \n## 附录 A - 在 Windows 工作站上使用 Ansible\n\nAnsible 主要通过 SSH 协议运行，地球上几乎所有的服务器、工作站和操作系统都原生支持\
  \ SSH，唯一的例外是微软经典的 Windows 操作系统（尽管这在未来几年可能会发生变化）。\n\n要在 Windows 上使用 SSH，你需要额外的软件。但\
  \ Ansible 还需要仅存在于 Linux 或其他 Unix 类操作系统的其他工具和子系统。对于许多被迫使用或必须使用 Windows 作为主要操作系统的系统管理员来说，这是一个问题。\n\
  \n本附录将引导 Windows 用户通过作者的方法在 Windows 工作站上使用 Ansible。\n\n### 方法 1 - 使用适用于 Windows\
  \ 的 Linux (WSL)\n\n如果你运行的是 Windows 10 并已升级到最新版本，你可以安装适用于 Windows 的 Linux 子系统 (WSL)，这是你目前在\
  \ Windows 中获得的最无缝的 Linux 集成。\n\nWSL 下载 Linux 发行版并将其置于特殊的特权虚拟机层中，该层在与通用 Windows 环境进行沙箱隔离的同时，可以尽可能地保持透明。使用\
  \ WSL，你可以打开 Linux 提示符，并访问与你原生运行 Linux 时几乎完全相同的软件和功能！\n\n微软在他们的开发者网络网站上提供了最的[安装指南](https://docs.microsoft.com/en-us/windows/wsl/install-win10)，但安装过程非常直观：\n\
  \n1.  以管理员身份打开 PowerShell 提示符并运行命令：\n\n```\ndism.exe /online /featurename:Microsoft-Windows-Subsystem-Linux\
  \ /all /norestart\n```\n\n2.  在提示时重启电脑。\n\n此时，WSL 已安装，但你还没有安装 Linux 发行版。要安装 Linux，请遵循微软的[下载和安装指南](https://docs.microsoft.com/en-us/wsl/#install-linux-distribution-of-choice)。对于我们的目的，我推荐使用最新的\
  \ Ubuntu LTS。\n\n安装完成后，桌面或开始菜单中会出现一个快捷方式，或者你可以在命令提示符中输入 `bash`。\n\n现在你在 Windows\
  \ 内部运行了 Linux，可以像原生运行 Linux 一样在 WSL 中安装 Ansible！\n\n#### 在 WSL 中安装 Ansible\n\n在安装\
  \ Ansible 之前，通过更新 apt-get 确保包列表是最新的：\n\n```bash\nsudo apt-get update\n```\n\n安装\
  \ Ansible 最简单的方法是使用 Python 的包管理器 `pip3`。系统可能已经安装了 Python，但 `pip3` 可能没有，所以让我们安装它以及\
  \ Python 开发头文件（在 `python3-dev` 包中）。\n\n```bash\nsudo apt-get install -y python3-pip\
  \ python3-dev\n```\n\n安装完成后，安装 Ansible：\n\n```bash\npip3 install ansible\n```\n\n\
  下载并安装 Ansible 及其所有依赖项后，确保 Ansible 正在运行并正常工作：\n\n```bash\nansible --version\nansible\
  \ [core 2.14.6]\n  ...\n  python version = 3.10.11\n  jinja version = 3.1.2\n  libyaml\
  \ = True\n```\n\n你现在可以在 Ubuntu Bash 环境中使用 Ansible 了。你可以在 `/mnt` 文件夹访问 Windows 文件系统上的文件（`/mnt/c`\
  \ 对应于 `C:\\`），但在 Windows 和 WSL 之间移动文件时要小心，因为由于行结束、权限和文件系统的差异，可能会发生奇怪的情况。\n\n###\
  \ 方法 2 - 当 WSL 不可用时\n\n如果你运行的是 Windows 7 或 8，或者由于原因无法在 Windows 10 或更高版本中安装或使用适用于\
  \ Windows 的 Linux 子系统，那么最好的替代方案是构建本地虚拟机 (VM) 并在内部使用 Ansible。\n\n#### 前提条件\n\n构建虚拟机简单的方法是下载并安装\
  \ Vagrant 和 VirtualBox（都是 100% 免费的！），然后使用 Vagrant 安装 Linux，并使用 PuTTY 连接使用 Ansible。以下是下载这些应用程序的链接：\n\
  \n1.  [Vagrant](http://www.vagrantup.com/downloads.html)\n\n2.  [VirtualBox](https://www.virtualbox.org/)\n\
  \n3.  [PuTTY](http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html)\n\
  \n\n\n\n\n一旦安装了所有三个应用程序，你就可以命令提示符 (`cmd`)、Windows PowerShell 或像 Cygwin 这样的 Linux\
  \ 终端模拟器通过 Vagrant 启动一个基础 Linux 虚拟机（如果你使用了 Cygwin，本文未涵盖该部分，你可以安装其 SSH 组件并使用它进行 SSH，从而避免使用\
  \ PuTTY）。\n\n# 设置 Ubuntu Linux 虚拟机\n\n打开 PowerShell（打开开始菜单或进入 Windows 主页并输入“PowerShell”），并切换目录到你将存储即将启动的虚拟机元数据的地方。我喜欢在我的主目录下有一个“VMs”文件夹，用来包含我所有的虚拟机：\n\
  \n```\n# 切换目录到你的用户目录。\nPS > cd C:/Users/[username]\n# 创建一个 'VMs' 目录并进入。\nPS > md\
  \ -Name VMs\nPS > cd VMs\n# 创建一个 'Ubuntu64' 目录并进入。\nPS > md -Name ubuntu-bionic-64\n\
  PS > cd ubuntu-bionic-64\n```\n\n现在，使用 `vagrant` 为我们的新虚拟机创建脚手架：\n\n```\nPS > vagrant\
  \ init ubuntu/bionic64\n```\n\nVagrant 会在当前目录创建一个描述基础 64 位 Ubuntu 虚拟机的 `Vagrantfile`，现在已准备好让你运行\
  \ `vagrant up` 来下载并构建机器。运行 `vagrant up`，并等待镜像下载和安装：\n\n```\nPS > vagrant up\n```\n\
  \n几分钟后，镜像将被下载并在 VirtualBox 内部设置好新的虚拟机。Vagrant 将根据 Vagrantfile 中定义的默认值启动并配置机器。一旦虚拟机启动且你回到命令提示符，就是时候登录虚拟机了。\n\
  \n# 登录虚拟机\n\n使用 `vagrant ssh-config` 获取 SSH 连接详情，然后将这些详情输入到 PuTTY 中连接到虚拟机。\n\n```\n\
  PS > vagrant ssh-config\n```\n\n它应该显示如下内容：\n\n```\nHost default\n  Hostname 127.0.0.1\n\
  \  User vagrant\n  Port 2222\n  UserKnownHostsFile /dev/null\n  StrictHostKeyChecking\
  \ no\n  PasswordAuthentication no\n  IdentityFile C:/Users/[username]/.vagrant.d/insecure_private_key\n\
  \  IdentitiesOnly yes\n  LogLevel FATAL\n```\n\n我们感兴趣的行是 Hostname、User、Port 和 IdentityFile。\n\
  \n启动 PuTTY 并输入连接详情：\n\n- **Host Name (or IP address)**: 127.0.0.1\n- **Port**: 2222\n\
  \n点击 Open 进行连接，如果你收到有关服务器主机密钥的安全警报，点击‘Yes’告诉 PuTTY 信任该主机。你可以通过在‘Saved Sessions’字段中输入名称并点击‘Save’来保存连接详情。\n\
  \nPuTTY 会要求登录凭据；我们将使用 Vagrant 镜像的默认登录（用户名和密码均为 `vagrant`）：\n\n```\nlogin as: vagrant\n\
  vagrant@127.0.0.1's password: vagrant\n```\n\n你现在应该已经连接到虚拟机，并看到当日消息：\n\n```\nWelcome\
  \ to Ubuntu 18.04.1 LTS (GNU/Linux 4.15.0-43-generic x86_64)\n...\nvagrant@ubuntu-bionic:~$\n\
  ```\n\n如果你看到这个提示符，说明你已经登录，可以开始管理虚拟机了。下一步（也是最后一步）是安装 Ansible。\n\n### 安装 Ansible\n\
  \n在安装 Ansible 之前，通过更新 `apt-get` 确保你的包列表是最新的：\n\n```\n$ sudo apt-get update\n```\n\
  \n安装 Ansible 最简单的方法是使用 `pip3`，它是 Python 的包管理器。系统可能已经安装了 Python，但 `pip3` 可能没有，所以让我们安装它，以及\
  \ Python 的开发头文件（在 `python-dev` 包中）。\n\n```\n$ sudo apt-get install -y python3-pip\
  \ python3-dev\n```\n\n安装完成后，安装 Ansible：\n\n```\n$ pip3 install ansible\n```\n\n\
  在下载并安装 Ansible 及其所有依赖项后，确保 Ansible 正在运行并正常工作：\n\n```\n$ ansible --version\nansible\
  \ [core 2.14.6]\n  ...\n  python version = 3.10.11\n  jinja version = 3.1.2\n  libyaml\
  \ = True\n```\n\n你现在已经在运行 Windows 工作站的虚拟机中安装了 Ansible。你可以使用 Vagrant 控制虚拟机（`cd` 到\
  \ Vagrantfile 所在的位置），使用 `up` 启动或唤醒虚拟机，使用 `halt` 关闭虚拟机，或使用 `suspend` 挂起虚拟机。使用 PuTTY\
  \ 手动登录虚拟机，或者通过 Cygwin 或 Git 的 Windows shell 运行 `vagrant ssh` 登录。\n\n在虚拟机内部使用 Ansible\
  \ 就像直接在 Linux 或 Mac 工作站上使用它一样。如果你需要在你的 Windows 环境和虚拟机之间共享文件，Vagrant 方便地将虚拟机上的 `/vagrant`\
  \ 映射到你 Vagrantfile 所在的相同文件夹。如果你需要，也可以通过其他方法（SSH、SMB、SFTP 等）在两者之间连接。\n\n### 总结\n\n\
  虽然有办法“黑进”让 Ansible 在 Windows 中原生运行（不使用 Linux 虚拟机），但我建议使用 Linux 虚拟机或 WSL，因为你将遇到的环境相关问题将会减少。\n\
  \n## 附录 B - Ansible 最佳实践与规范\n\nAnsible 中很少有通用的最佳实践，但本附录包含了关于组织 playbooks、编写任务、使用角色以及其他使用\
  \ Ansible 构建基础设施的有用建议。\n\n除了本附录（主要包含作者日常使用的观察结果）外，请阅读官方的 [Ansible 最佳实践](http://docs.ansible.com/playbooks_best_practices.html)\
  \ 指南，其中包含了丰富的知识。\n\n### Playbook 组织\n\nPlaybooks 是 Ansible 的核心，因此以逻辑方式组织它们对于便于调试和维护至关重要。\n\
  \n#### 编写注释并大量使用 name\n\n你编写的许多任务在编写时是显而易见的，但几个月后当你进行更改时，就不那样了。就像应用程序代码一样，Ansible\
  \ playbooks 应该包含文档，这样你就可以花更少的时间熟悉特定任务的作用，而花更多的时间解决问题。\n\n在 YAML 中，通过以井号 (`#`) 开头来编写注释。如果注释跨越多行，请每行都加上\
  \ `#`。\n\n除了最细微的任务外，为你编写的每个任务使用 `name` 是一个好主意。如果你使用 `git` 模块检特定的 tag，请使用 `name`\
  \ 说明你正在使用哪个仓库、为什么使用 tag 而不是提交哈希等。这样，每当你运行 playbook 时，你都会看到你写的注释，并确定正在发生什么。\n\n```\n\
  - hosts: all\n\n  tasks:\n\n    # 此任务可能花费最多五分钟，并且是必要的，以便我们\n    # 访问应用程序中使用的镜像。\n\
  \    - name: Copy the entire file repository to the application.\n      copy:\n\
  \        src: [...]\n```\n\n这条建议假设你的注释确实指示了 playbook 中正在发生什么！我在所有的注释和 `name` 中都使用带句号的完整句子，但使用略有不同的风格也可以。只需保持一致，并记住，糟糕的注释比没有注释糟。\n\
  \n#### 包含相关的变量和任务\n\n如果你发现自己编写的 playbook 超过了 50-100 行，并且配置了三个四个不同的应用程序或服务，将每组任务分开到单独的文件可能会帮助，并使用\
  \ `import_tasks` 或 `include_tasks` 将它们放入 playbook 中（关于何时使用何种语法的详情，请参见第 6 章）。\n\n\
  此外，变量通常最好留在单独的文件中，并通过 `vars_files` 包含，而不是内联在 playbook 中定义。\n\n\n\n\n\n```\n- hosts:\
  \ all\n\n  vars_files:\n    - vars/main.yml\n\n  handlers:\n    - import_tasks:\
  \ handlers/handlers.yml\n\n  tasks:\n    - import_tasks: tasks/init.yml\n    - import_tasks:\
  \ tasks/database.yml\n    - import_tasks: tasks/app.yml\n```\n\n使用这种更具层次化的模型允许你从更高层级查看\
  \ playbook 正在做什么，并让你能够单独管理配置或部署的每个部分。通常，当一个文件中的任务达到 15-20 个时，我会将任务拆分到单独的文件。\n\n\
  ### 使用角色（Roles）对配置进行逻辑分组\n\n与使用包含文件来更好地组织 playbook 并逻辑上分离配置部分的思路一致，Ansible 角色（roles）极大增强了你管理基础设施的能力。\n\
  \n使用松耦合的角色来配置服务器的各个组件（如数据库、应用部署、网络栈、监控包等），允许你编写一次配置，并将其应用到所有服务器上，无论它们的角色如何。\n\n\
  你可能会在所管理的每台服务器上配置类似 NTP（网络时间协议）的内容，或者至少为服务器设置时区。与其在你管理的每个 playbook 中添加两个或三个任务，不如设置一个角色（可以命名为\
  \ `time` 或 `ntp`）来执行此配置，并使用几个变量允许不同的服务器组具有定制化设置。\n\n此外，如果你学会了构建健壮且通用的角色，你可以将它们分享到\
  \ Ansible Galaxy 上，让其他人使用并帮助你将其做得更好！\n\n### 正确使用角色默认变量（defaults）和变量（vars）\n\n将所有可能被覆盖的角色默认变量设置在\
  \ `defaults/main.yml` 中，将可能永远不会覆盖的变量设置在 `vars/main.yml` 中。\n\n如果你有一个需要覆盖的变量，但你需要将其包含在特定平台的变量文件中（例如，Debian\
  \ 用一个文件，RHEL 用另一个），请在 `vars/[file].yml` 中创建变量 `__varname`，并在变量 `varname` 未定义时使用\
  \ `set_fact` 在运行时设置该变量。这样，使用该角色的 playbook 仍然可以覆盖这些变量之一。\n\n例如，如果你需要像 `package_config_path`\
  \ 这样的变量，在 Debian 上默认为一个值，在 RHEL 上为另一个值，但可能需要不时覆盖，你可以创建两个文件 `vars/Debian.yml` 和 `vars/RedHat.yml`，内容如下：\n\
  \n```\n---\n# Inside vars/Debian.yml\n__package_config_path: /etc/package/package.conf\n\
  ```\n\n```\n---\n# Inside vars/RedHat.yml\n__package_config_path: /etc/package/configfile\n\
  ```\n\n然后，在使用该变量的 playbook 中，包含特定平台的变量文件并在运行时定义最终 `package_config_path` 变量：\n\n\
  ```\n---\n# Include variables and define needed variables.\n- name: Include OS-specific\
  \ variables.\n  include_vars: \"{{ ansible_os_family }}.yml\"\n\n- name: Define\
  \ package_config_path.\n  set_fact:\n    package_config_path: \"{{ __package_config_path\
  \ }}\"\n  when: package_config_path is not defined\n```\n\n通过这种方式，任何使用该角色的 playbook\
  \ 都可以通过在自己的变量中定义 `package_config_path` 来覆盖特定平台的默认值。\n\n### YAML 规范与最佳实践\n\nYAML\
  \ 是一种人类可读、机器可解析的语法，允许使用几个基本规范来描述几乎任何列表、映射（map）或数组结构，因此非常适合配置管理。考虑以下定义组件列表（或“集合”）的方法：\n\
  \n```\nwidget:\n  - foo\n  - bar\n  - fizz\n```\n\n这在 Python 中（使用 Ansible 的 `PyYAML`\
  \ 库）将翻译为：\n\n```\ntranslated_yaml = {'widget': ['foo', 'bar', 'fizz']}\n```\n\n\
  那么 YAML 中的结构化列表/映射 呢？\n\n```\nwidget:\n  foo: 12\n  bar: 13\n```\n\n生成的 Python 结果为：\n\
  \n```\ntranslated_yaml = {'widget': {'foo': 12, 'bar': 13}}\n```\n\n关于上述两个示例有几点需要注意：\n\
  \n*   YAML 会尝试自动确定项目的类型。因此，第一个示例中的 `foo` 将翻译为字符串，`true` 或 `false` 将是布尔值，而 `123`\
  \ 将是整数。请阅读官方文档以获得更多见解，但对于我们的目的，使用引号（`''` 或 `\"\"`）声明字符串将减少意外。\n\n*   空格至关重要！YAML\
  \ 使用空格（字面空格字符——*不是*制表符）来定义结构（映射、数组列表等），因此将你的编辑器设置为使用空格代替制表符。你可以使用制表符或空格来分隔参数（例如\
  \ `apt: name=foo state=present`——参数之间可以是制表符或空格），但最好在处处使用空格，以减少跨编辑器和平台的错误和显示不规则。\n\
  \n*   YAML 语法健壮且文档齐全。阅读官方的 [YAML 规范](http://www.yaml.org/spec/1.2/spec.html) 和/或\
  \ [PyYAMLDocumentation](http://pyyaml.org/wiki/PyYAMLDocumentation) 以深入研究。\n\n###\
  \ 用于 Ansible 任务的 YAML\n\n考虑以下任务：\n\n```\n- name: Install foo.\n  apt: name=foo state=present\n\
  ```\n\n一切看起来很好，对吧？然而，当你深入接触 Ansible 并开始定义更复杂的配置时，你可能会看到如下任务：\n\n```\n- name: Copy\
  \ Phergie shell script into place.\n  template: src=templates/phergie.sh.j2 dest=/opt/phergie.sh\
  \ \\\n  owner={{ phergie_user }} group={{ phergie_user }} mode=755\n```\n\n单行语法（使用\
  \ Ansible 特有的 `key=value` 简写来定义参数）具有一些优点：\n\n*   简单的任务（如安装和复制）紧凑且易读。`apt: name=apache2\
  \ state=present` 和 `apt-get install -y apache2` 同样简洁；通过这种方式，Ansible playbook 感觉非常像一个\
  \ shell 脚本。\n\n*   playbook 更加紧凑，屏幕上可以显示更多的配置。\n\n然而，如上面的示例强调的，这种 `key=value` 语法存在一些问题：\n\
  \n*   较小的显示器、终端窗口和源码控制应用程序将换行或隐藏任务行的部分内容。\n\n*   差异查看器（diff viewers）和源码控制系统对行内差异的亮亮通常不如全行变化。\n\
  \n*   变量和参数会被转换为字符串，这可能是需要的也可能不需要。\n\nAnsible 的简写语法对于复杂的 playbook 和角色来说很麻烦，但幸运的是，还有其他编写任务的方法，更适合窄屏、版本控制软件和差异比较。\n\
  \n### 格式化 Ansible 任务的三种方法\n\n以下是定义 playbook Ansible 任务最常用的方法：\n\n#### 简写/单行 (`key=value`)\n\
  \nAnsible 的简写语法在模块名称后使用 `key=value` 参数作为键：\n\n```\n- name: Install Nginx.\n  dnf:\
  \ name=nginx state=present\n```\n\n对于任何等效 shell 命令大致匹配我在 YAML 中编写内容的情况，我倾向于这种方法，因为一眼就能看出发生了什么，而且参数（如\
  \ `state=present`）在开发过程中不太会更改。\n\nAnsible 官方文档有时会在较短示例中使用这种语法，它也容易转换为即时命令（ad-hoc\
  \ commands）。\n\n#### 结构化映射/多行 (`key:value`)\n\n为任务定义结构化的参数映射（使用 `key: value`，每个参数单独占一行）：\n\
  \n```\n- name: Copy Phergie shell script into place.\n  template:\n    src: \"templates/phergie.sh.j2\"\
  \n    dest: \"/home/{{ phergie_user }}/phergie.sh\"\n    owner: \"{{ phergie_user\
  \ }}\"\n    group: \"{{ phergie_user }}\"\n    mode: 0755\n```\n\n关于这种语法的几点说明：\n\
  \n*   该结构都是有效的 YAML，且功能与 Ansible 的简写语法类似。\n\n*   字符串、布尔值、整数、八进制等都会被保留（而不是被转换为字符串）。\n\
  \n*   每个参数*必须*独占一行；多个变量不能为了节省空间链在一起（例如 `mode: 0755, owner: root, user: root`）。\n\
  \n\n\n\n\n- 对于这种格式，YAML 语法高亮效果比 `key=value` 更好，因为每个键都会被高亮，而值将分别显示为常量、字符串等。\n\n##\
  \ 折叠标量/多行 (`>`) \n\n使用 `>` 字符将 Ansible 的简写 `key=value` 语法拆分到多行。\n\n```yaml\n- name:\
  \ Copy Phergie shell script into place.\n  template: >\n    src=templates/phergie.sh.j2\n\
  \    dest=/home/{{ phergie_user }}/phergie.sh\n    owner={{ phergie_user }} group={{\
  \ phergie_user }} mode=755\n```\n\n在 YAML 中，`>` 字符表示*折叠标量*（folded scalar），其后的每一行（只要它的缩进深度大于\
  \ `>` 所在的行）都将用空格与上一行合并。因此，上述 YAML 和之前的 `template` 示例功能完全相同。\n\n这种语法允许对参数的行进行任意拆分，但它不会保留值类型（例如，`0775`\
  \ 会被转换为字符串）。\n\n虽然这种语法在实际应用中很常见，但在某些情况下我不建议使用，例如在 `command` 和 `shell` 模块中使用带有额外选项的任务时：\n\
  \n```yaml\n- name: Install Drupal.\n  command: >\n    drush si -y --site-name=\"\
  {{ drupal_site_name }}\"\n    --account-name=admin\n    --account-pass=admin\n \
  \   --db-url=mysql://{{ domain }}:1234@localhost/{{ domain }}\n    --root={{ drupal_core_path\
  \ }}\n    creates={{ drupal_core_path }}/sites/default/settings.php\n  notify: restart\
  \ apache\n  become_user: www-data\n```\n\n有时，上述方法就是让难以管理的 `command` 或 `shell` 任务保持易读格式的最优解。\n\
  \n## 使用 `|` 格式化多行变量\n\n除了使用 `>` 用空格连接多行外，YAML 还允许使用 `|`（管道符）来定义字面标量（literal scalars），从而定义保留换行符的字符串。\n\
  \n例如：\n\n```yaml\n1 extra_lines: |\n2   first line\n3   second line\n4   third line\n\
  ```\n\n将被翻译为一个保留完整换行符的文本块：\n\n```text\n1 first line\n2 second line\n3 third line\n\
  ```\n\n使用折叠标量 (`>`) 会合并这些行，这可能不是你所想要的。例如：\n\n```yaml\n1 extra_lines: >\n2   first\
  \ line\n3   second line\n4   third line\n```\n\n将被翻译为一个没有换行符的单字符串：\n\n```text\n\
  1 first line second line third line\n```\n\n## 使用 `ansible-playbook`\n\n通常情况下，从你自己的计算机或中央\
  \ playbook 运行器运行 playbooks，比在本地运行 Ansible playbook（使用 `--connection=local`）更优，因为\
  \ Ansible 及其所有依赖项不需要安装在在你正在配置的系统上。由于 Ansible 对 SSH 远程通信进行了优化使用，在本地或从远程工作站运行 Ansible\
  \ 的性能差异通常微乎其微（网络波动或高延迟连接除外）。\n\n## 使用 Ansible Tower\n\n如果你能够使用 Ansible Tower 来运行\
  \ playbooks，那会更好，因为你将有一个中央服务器来运行 Ansible playbook、记录输出、编译统计数据，甚至允许团队在一个地方协作构建服务器和部署应用程序。\n\
  \n## 在 playbook 本地安装 Galaxy 依赖\n\n多年来，特别是随着 Collections 成为分发 Ansible 插件和模块的流行方式，考虑在哪里\
  \ 安装 Ansible 项目依赖（无论是从 Ansible Galaxy 还是 Automation Hub 安装）变得越来越重要。\n\n这意味着为每个 playbook\
  \ 添加一个 `requirements.yml` 文件（通常如此，但并非总是如此），定义每个 role 和 collection 的版本限制，并在 playbook\
  \ 项目的根目录下添加 `ansible.cfg` 文件，以便 Ansible 知道仅从该 playbook 的本地 roles 或 collections 目录加载它们。\n\
  \n对于我开始的任何新项目，我都会添加一个包含以下内容的 `ansible.cfg`：\n\n```ini\n1 [defaults]\n2 nocows =\
  \ True\n3 collections_paths = ./collections\n4 roles_path = ./roles\n```\n\n然后我会添加一个\
  \ `requirements.yml` 文件，为我的 playbook 指定所有的 role 和 collection 需求：\n\n```yaml\n1 ---\n\
  2 roles:\n3   - name: geerlingguy.java\n4     version: 1.10.0\n5 \n6 collections:\n\
  7   - name: community.kubernetes\n8     version: 0.11.1\n```\n\n使用 `ansible-galaxy\
  \ install -r requirements.yml` 安装需求，然后你就可以在 playbook 中访问它们，而无须担心会破坏其他 playbook（这些\
  \ playbook 可能使用相同的 role 和 collection 但需要不同的版本）。\n\n### 在选择社区依赖时要明智判断\n\n2019 年，我在\
  \ AnsibleFest 亚特兰大做了一场关于[为你的 playbook 评估社区 Ansible roles](https://www.jeffgeerling.com/blog/2019/how-evaluate-community-ansible-roles-your-playbooks)\
  \ 的演讲。\n\n在演讲中，当我决定将由社区维护的内容整合到你的自动化 playbook 中时，我提到了几个重要的考虑因素：\n\n*   确保你信任内容的维护者——他们会修复重大漏洞吗？他们是否有良好的信誉？他们重视安全吗？\n\
  *   考虑该内容的维护频率对于你的项目需求来说是过于激进（在短时间内有许多破坏性更改）还是过于被动（多年未发布版本）？\n*   role 或 collection\
  \ 中的内容是否易理解，以便你可以修复发现的任何漏洞，或者在需要时维护该内容的分支（fork）？\n\n有时人们盲目地采用依赖项，而不加考虑他们所正承担的技术债或维护开销。许多依赖项有助于你更快地实现自动化目标，而不是自己编写所有代码。但某些依赖项会让你的\
  \ Ansible 项目维护变得更加困难。\n\n在将 Ansible Galaxy 或 Automation Hub 的依赖项引入项目时，务必小心。考虑依赖项能在多大程度上帮助你实现短期自动化目标和长期项目维护。\n\
  \n## 为运行在 > 5 台服务器上的 playbook 指定 `--forks`\n\n如果你在大量服务器上运行 playbook，请考虑增加 Ansible\
  \ 用于同时运行任务的 `forks` 数量。默认值 `5` 意味着 Ansible 每次只在 5 台服务器上运行给定任务。考虑将其增加到 10、15 或你的本地工作站和\
  \ ISP 能够处理的任何数量——这将大幅缩短 playbook 的运行时间。\n\n在 Ansible 配置文件中设置 `forks=[number]` 来设置所有\
  \ playbook 运行的默认 `forks` 值。\n\n## 使用 Ansible 配置文件\n\nAnsible 的主配置文件位于 `/etc/ansible/ansible.cfg`，为运行\
  \ playbooks 和即时任务（ad-hoc tasks）提供了丰富的优化和自定义空间。\n\n阅读官方文档的 [Ansible Configuration\
  \ File](https://docs.ansible.com/ansible/latest/installation_guide/intro_configuration.html)\
  \ 页面以获取 `ansible.cfg` 中的自定义选项。\n\n我通常会在维护的每个 Ansible 项目中放置一个自定义的 `ansible.cfg` 文件，这样我就可以完全控制\
  \ Ansible 在运行 playbook 时的行为。\n\n记住，如果你在项目中使用 `ansible.cfg` 文件，它将不会继承全局配置文件的任何值，它将覆盖所有设置，任何你没有显式定义的内容都将被设置为\
  \ Ansible 的默认值。\n\n### 总结\n\nAnsible 的优势之一是其灵活性；实现目标通常有多种“正确”的方法。我选择使用上述概述的方法，因为事实证明它们能帮助我以最少的烦恼编写和维护各种\
  \ playbook 和 role。\n\n\n\n\n\n尝试不同的方法是完全可以的；正如大多数编程和技术事务一样，保持`consistent` 比遵循一套特定的规则集更为重要，特别是当这套规则并没有获得通用共识时。当你不是单兵作战时，一致性尤为重要——如果每个团队成员使用\
  \ `Ansible` 的方式都不同，那么很快就会发现工作工作变得非常困难！\n\n## 注意事项\n\n1. 请注意，从 `Ansible 2.10` 开始，关于如何在\
  \ `Collections` 中定义 playbooks 并没有正式的规范。\n\n"
