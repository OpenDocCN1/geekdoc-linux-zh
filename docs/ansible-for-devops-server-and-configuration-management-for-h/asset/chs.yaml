  \ Ansible 管理它们了。\n\n## 你的第一个即时命令\n\n你首先需要做的任务之一是检查你的服务器。让我们确保它们配置正确、时间准确（我们不希望应用程序中出现任何时间同步错误！），并且有足够的资源运行应用程序。\n\
  \n### 发现 Ansible 的并行性\n\n首先，我想确保 Vagrant 为虚拟机配置了正确的主机名。使用 ansible 配合 `-a` 参数 `hostname`\
  \ 对所有服务器运行 hostname：\n\n```\n ansible multi -a \"hostname\"\n```\n\nAnsible 将对所有三台服务器运行此命令，并返回结果（如果\
  \ Ansible 无法访问某台服务器，它会显示该服务器的错误，但继续在其他服务器上运行命令）。\n\n\n\n\n你可能已经注意到，命令在每台服务器上运行的顺序并不是你预期的那样。请多运行几次命令，查看执行顺序：\n\
  \n```\n# 第一次运行结果：                # 第二次运行结果：\n192.168.56.5 | CHANGED | rc=0 >>  \
  \  192.168.56.6 | CHANGED | rc=0 >>\norc-app2.test\n\n192.168.56.6 | CHANGED | rc=0\
  \ >>    192.168.56.5 | CHANGED | rc=0 >>\norc-db.test                         orc-app2.test\n\
  \n192.168.56.4 | CHANGED | rc=0 >>    192.168.56.4 | CHANGED | rc=0 >>\norc-app1.test\
  \                       orc-app1.test\n```\n\n默认情况下，Ansible 会使用多个分叉进程（forks）并行运行命令，因此命令完成得会更快。如果你只管理几台服务器，这可能与在单台服务器上串行运行命令没有太大区别，但即使管理\
  \ 10 台服务器，如果你使用 Ansible 的并行功能（默认启用），你也会发现速度大幅提升。再次运行相同的命令，但这次添加参数 `-f 1`，告诉 Ansible\
  \ 仅使用一个分叉进程（基本上是按顺序在每台服务器上执行命令）：\n\n```\n$ ansible multi -a \"hostname\" -f 1\n\
  192.168.56.4 | CHANGED | rc=0 >> orc-app1.test\n192.168.56.5 | CHANGED | rc=0 >>\
  \ orc-app2.test\n192.168.56.6 | CHANGED | rc=0 >> orc-db.test\n```\n\n命令将始终以相同的顺序返回结果。虽然你需要这样做的情况非常少，但更常见的情况是你可能想要增加该值（例如\
  \ `-f 10` 或 `-f 25`），这取决于你的系统和网络连接能够承受在数十台或数百台服务器上运行命令的程度。\n\n### 了解你的环境\n\n现在我们信任\
  \ Vagrant 正确设置主机名的能力，让我们确保其他一切也就绪。首先，确保服务器有足够的磁盘空间供我们的应用程序使用：\n\n```\n$ ansible\
  \ multi -a \"h\"\n192.168.56.6 | CHANGED | rc=0 >>\nFilesystem               Size\
