  localhost          : ok=2   changed=1   unreachable=0   failed=0\n```\n\n现在你已经知道了返回的\
  \ `do` 对象的结构，可以移除 `debug` 任务了。\n\n由于 `do` 包含了新 droplet 的 IP 地址以及其他相关信息），你可以使用 Ansible\
  \ 的 `add_host` 模块将新创建的 droplet 放入现有的清单组中。通过我们在上面开始的 playbook，你可以设置 playbook 来配置实例并立即对其进行配置（等待端口可用后）。\n\
  \n\n\n\n## 4. 通过直接运行脚本（使用以下命令）确保脚本运行正常。一两秒钟后，你应该能看到按 IP 地址和动态分组以 JSON 格式列出的所有 droplet（很可能只是你之前创建的那一个）。\n\
  \n```\n$ ./digital_ocean.py --pretty\n```\n\n## 5. 扫描你所有的 DigitalOcean droplet：\n\
  \n```\n$ ansible all -m ping -i digital_ocean.py -u root\n```\n\n现在，由于你已经通过动态清单脚本加载了所有主机，你可以使用\
  \ `add_hosts` 来构建 Droplet 组，以便在你的 playbooks 中使用。你还可以配置 `digital_ocean.ini` 文件（参见\
  \ GitHub 上的[示例](https://github.com/ansible-collections/community.digitalocean/blob/main/scripts/inventory/digital_ocean.ini)）来进一步自定义清单数据。\n\
  \n要删除你之前创建的 DigitalOcean-droplet，请更新 `Create new Droplet` 任务的 `state` 参数。将其设置为 `absent`，然后重新运行\
  \ playbook，该 droplet 就会从你的账户中删除。\n\n### 使用 AWS 的动态清单\n\n本书的许多读者都熟悉 Amazon Web Services（特别是\
  \ EC2、S3、RDS 和 Route53），并且可能已经或或目前正在管理亚马逊云中的基础设施。Ansible 对管理基于 AWS 的基础设施有非常强力的支持，并包含一个\
  \ [EC2 清单插件](https://docs.ansible.com/ansible/latest/plugins/inventory/aws_ec2.html)，帮助你以各种方式在主机上运行\
  \ playbooks。\n\n如果你想用 Ansible 自动化你的 AWS 工作流，Ansible 官方文档包含了一份详尽的 [Amazon Web Services\
  \ 指南](https://docs.ansible.com/ansible/latest/scenario_guides/guide_aws.html)。\n\
  \n我不会在本章中介绍 AWS 动态清单，但会提到 `aws_ec2` 清单插件，连同 Ansible 通过 `ec2_*` 模块对 AWS 基础设施提供的广泛支持，这使得\
  \ Ansible 成为管理 AWS 基础设施的绝佳选择。\n\n在下一章节中，示例之一将包含一个关于在 AWS 上置备基础设施的指南，以及对 AWS 动态清单的快速概述。\n\
  \n### 运行时创建清单：`add_host` 和 `group_by`\n\n有时，特别是在置备新服务器时，你需要在 playbook 运行过程中修改内存中的清单。Ansible\
  \ 提供了 `add_host` 和 `group_by` 模块来帮助你管理这些场景下的清单。\n\n在上面的 DigitalOcean 示例中，`add_host`\
  \ 被将新的 droplet 添加到 `do` 组：\n\n```\n[...]\n    - name: Add new host to our inventory.\n\
  \      add_host:\n        name: \"{{ do.droplet.ip_address }}\"\n        groups:\
  \ do\n      when: do.droplet is defined\n\n- hosts: do\n  remote_user: root\n\n\
  \  tasks:\n[...]\n```\n\n你可以通过 `add_host` 添加多个组，还可以通过 `add_host` 为主机内联添加其他变量。例如，假设你使用一个镜像创建了虚拟机，该镜像在\
  \ 2288 端口暴露 SSH，并且需要一个针对该虚拟机的特定应用程序内存限制：\n\n```\n\n- name: Add new host to our inventory.\n\
  \  add_host:\n    name: \"{{ do.droplet.ip_address }}\"\n    ansible_ssh_port: 2288\n\
  \    myapp_memory_maximum: \"1G\"\n  when: do.droplet is defined\n```\n\n当 Ansible\
  \ 连接到此主机时将使用自定义端口，`myapp_memory_maximum` 将像任何其他清单变量一样传递到 playbooks 中。\n\n`group_by`\
  \ 模块更加简单，允许你在 playbook 运行过程中创建动态组。用法极其简单：\n\n```\n- hosts: all\n  gather_facts:\
  \ yes\n  tasks:\n    - name: Create an inventory group for each architecture.\n\
  \      group_by:\n        key: \"architecture-{{ ansible_machine }}\"\n\n    - debug:\
  \ var=groups\n```\n\n运行上述 playbook 后，你将看到所有常规清单组，以及针对 `architecture-x86_64`、`i386`\
  \ 等组（取决于你使用的什么种服务器架构）。\n\n### 多清单源 - 混合静态和动态清单\n\n如果你需要结合静态和动态清单，即使你希望使用多个动态清单（例如，如果你正在管理由两个不同的云提供商托管的服务器），也可以向\
  \ `ansible` 或 `ansible-playbook` 传递一个目录，Ansible 将合并目录内所有清单（静态和动态）的输出：\n\n```\nansible-playbook\
  \ -i path/to/inventories main.yml\n```\n\n有一个注意事项：Ansible 会忽略目录中的 `.ini` 和备份文件，但会尝试解析目录中的每个文本文件并执行目录中的每个可执行文件——不要在混合清单文件夹中留下随机文件！\n\
  \n### 创建自定义动态清单\n\n大多数基础设施可以使用自定义清单文件或现成的云清单脚本进行管理，但在许多情况下需要更多的控制。Ansible 接受任何类型的可执行文件作为清单文件，因此你可以按照自己喜欢的方式构建自己的动态清单，只要将其以\
  \ JSON 格式传递给 Ansible 即可。\n\n你可以创建一个可执行二进制文件、脚本或任何可以运行并向 stdout 输出 JSON 的内容，例如，当你运行时，Ansible\
  \ 会带有 `--list` 参数调用它。Ansible 预期的 JSON 格式如下：\n\n```\n1 {\n    \"group\": {\n    \
  \    \"hosts\": [\n            \"192.168.56.71\",\n            \"192.168.56.72\"\
  \n        ],\n        \"vars\": {\n            \"ansible_user\": \"johoe\",\n  \
  \          \"ansible_ssh_private_key_file\": \"~/.ssh/mykey\",\n            \"example_variable\"\
  : \"value\"\n        }\n    },\n    \"_meta\": {\n        \"hostvars\": {\n    \
  \        \"192.168.56.71\": {\n                \"host_specific_var\": \"foo\"\n\
  \            },\n            \"192.168.56.72\": {\n                \"host_specific_var\"\
  : \"bar\"\n            }\n        }\n    }\n}\n```\n\n动态脚本可以通过任何方式获取数据（调用外部 API、从数据库或文件获取），只要在运行\
  \ `--list` 时返回上述结构即可。\n\n#### 使用 Python 构建自定义动态清单\n\n为了演示目的创建一个测试动态清单，让我们使用 Vagrant\
  \ 快速设置两个虚拟机。在新目录中创建以下 `Vagrantfile`：\n\n```\n1 VAGRANTFILE_API_VERSION = \"2\"\n\
  2 \n3 Vagrant.configure(VAGRANTFILE_API_VERSION) do |config|\n4   config.ssh.insert_key\
  \ = false\n5   config.vm.provider :virtualbox do |v|\n6     v.memory = 512\n7  \
  \   v.linked_clone = true\n8   end\n9 \n10   # Application server 1.\n11   config.vm.define\
  \ \"inventory1\" do |inventory|\n12     inventory.vm.hostname = \"inventory1.test\"\
  \n13     inventory.vm.box = \"geerlingguy/ubuntu2004\"\n14     inventory.vm.network\
  \ :private_network, ip: \"192.168.56.71\"\n15   end\n16 \n17   # Application server\
  \ 2.\n18   config.vm.define \"inventory2\" do |inventory|\n19     inventory.vm.hostname\
  \ = \"inventory2.test\"\n20     inventory.vm.box = \"geerlingguy/ubuntu2004\"\n\
  21     inventory.vm.network :private_network, ip: \"192.168.56.72\"\n22   end\n\
  23 end\n```\n\n运行 `vagrant up` 启动运行 Ubuntu 的虚拟机，其 IP 地址为 `192.168.56.71` 和 `192.168.56.72`。可以使用简单的清单文件用\
  \ Ansible 控制这些虚拟机：\n\n```\n1 [group]\n2 192.168.56.71 host_specific_var=foo\n3 192.168.56.72\
  \ host_specific_var=bar\n4 \n5 [group:vars]\n6 ansible_user=vagrant\n7 ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key\n\
  8 example_variable=value\n```\n\n\n\n\n\n然而，让我们假设虚拟机是由另一个系统配置的，而你需要通过动态清单脚本获取信息。以下是一个用\
  \ Python 实现的动态清单脚本的简单示例：\n\n```python\n 1 #!/usr/bin/env python3\n 2 \n 3 '''\n\
  \ 4 用于 Ansible 的示例自定义动态清单脚本，使用 Python 编写。\n 5 '''\n 6 \n 7 import os\n 8 import\
  \ sys\n 9 import argparse\n10 import json\n11 \n12 class ExampleInventory(object):\n\
  13 \n14     def __init__(self):\n15         self.inventory = {}\n16         self.read_cli_args()\n\
  17 \n18         # 使用 --list 调用。\n19         if self.args.list:\n20             self.inventory\
  \ = self.example_inventory()\n21         # 使用 --host [hostname] 调用。\n22        \
  \ elif self.args.host:\n23             # 未实现，因为通过 --list 返回 _meta 信息。\n24      \
  \       self.inventory = self.empty_inventory()\n25         # 如果不存在组或变量，则返回空清单。\n\
  26         else:\n27             self.inventory = self.empty_inventory()\n28 \n\
  29         print(json.dumps(self.inventory))\n30 \n31     # 用于测试的示例清单。\n32     def\
  \ example_inventory(self):\n33         return {\n34             'group': {\n35 \
  \                'hosts': ['192.168.56.71', '192.168.56.72'],\n36              \
  \   'vars': {\n37                     'ansible_user': 'vagrant',\n38           \
  \          'ansible_ssh_private_key_file':\n39                         '~/.vagrant.d/insecure_private_key',\n\
  40                     'ansible_python_interpreter':\n41                       \
  \  '/usr/bin/python3',\n42                     'example_variable': 'value'\n43 \
  \                }\n44             },\n45             '_meta': {\n46           \
  \      'hostvars': {\n47                     '192.168.56.71': {\n48            \
  \             'host_specific_var': 'foo'\n49                     },\n50        \
  \             '192.168.56.72': {\n51                         'host_specific_var':\
  \ 'bar'\n52                     }\n53                 }\n54             }\n55  \
  \       }\n56 \n57     # 用于测试的空清单。\n58     def empty_inventory(self):\n59      \
  \   return {'_meta': {'hostvars': {}}}\n60 \n61     # 读取传递给脚本的命令行参数。\n62     def\
  \ read_cli_args(self):\n63         parser = argparse.ArgumentParser()\n64      \
  \   parser.add_argument('--list', action = 'store_true')\n65         parser.add_argument('--host',\
  \ action = 'store')\n66         self.args = parser.parse_args()\n67 \n68 # 获取清单。\n\
  69 ExampleInventory()\n```\n\n将上述内容保存为 `inventory.py`，并放在你之前创建的 `Vagrantfile` 相同的文件夹中（确保你已通过\
  \ `vagrant up` 启动了两个虚拟机），然后赋予文件可执行权限 `chmod +x inventory.py`。\n\n手动运行清单脚本以验证它在带有\
  \ `--list` 参数运行时是否返回了正确的 JSON 响应：\n\n```bash\n$ ./inventory.py --list\n{\"group\"\
  : {\"hosts\": [\"192.168.56.71\", \"192.168.56.72\"], \"vars\":\n{\"ansible_user\"\
  : \"vagrant\", \"ansible_ssh_private_key_file\":\n\"~/.vagrant.d/insecure_private_key\"\
  , \"example_variable\": \"value\n\"}}, \"_meta\": {\"hostvars\": {\"192.168.56.72\"\
  : {\"host_specific_va\nr\": \"bar\"}, \"192.168.56.71\": {\"host_specific_var\"\
  : \"foo}}}}\n```\n\n测试 Ansible 使用该清单脚本连接两台虚拟机：\n\n```bash\n$ ansible all -i inventory.py\
  \ -m ping\n192.168.56.71 | SUCCESS >> {\n    \"changed\": false,\n    \"ping\":\
  \ \"pong\"\n}\n\n192.168.56.72 | SUCCESS >> {\n    \"changed\": false,\n    \"ping\"\
  : \"pong\"\n}\n```\n\n由于 Ansible 可以连接，验证配置的主机变量（`foo` 和 `bar`）是否正确设置：\n\n```bash\n\
  $ ansible all -i inventory.py -m debug -a \"host_specific_var\"\n192.168.56.71 |\
  \ SUCCESS >> {\n    \"var\": {\n        \"host_specific_var\": \"foo\"\n    }\n\
  }\n\n192.168.56.72 | SUCCESS >> {\n    \"var\": {\n        \"host_specific_var\"\
  : \"bar\"\n    }\n}\n```\n\n在实际使用中，对上述 `inventory.py` 脚本唯一的更改是将 `example_inventory()`\
  \ 方法更改为你所需的业务逻辑，无论是调用外部 API 还是数据库或其他数据存储器。\n\n### 使用 PHP 构建动态清单\n\n你可以使用任何喜欢的语言构建清单脚本。例如，可以将上述\
  \ Python 脚本转换为 PHP 如下：\n\n```php\n 1 #!/usr/bin/php\n 2 <?php\n 3 \n4 /**\n 5  *\
  \ 用于 Ansible 的示例自定义动态清单脚本，使用 PHP 编写。\n 6  */\n 7 \n 8 /**\n 9  * 用于测试的示例清单。\n11\
  \  *\n11  * @return array\n13  *   两个主机的示例清单。\n14  */\n15 function example_inventory()\
  \ {\n16   return [\n17     'group' => [\n18       'hosts' => ['192.168.56.71', '192.168.56.72'],\n\
  19       'vars' => [\n20         'ansible_user' => 'vagrant',\n21         'ansible_ssh_private_key_file'\
  \ =>\n22             '~/.vagrant.d/insecure_private_key',\n23         'ansible_python_interpreter'\
  \ =>\n24             '/usr/bin/python3',\n25             'example_variable' => 'value'\n\
  26         ]\n27     ],\n28     '_meta' => [\n29         'hostvars' => [\n30   \
  \          '192.168.56.71' => [\n31                 'host_specific_var' => 'foo'\n\
  32             ],\n33             '192.168.56.72' => [\n34                 'host_specific_var'\
  \ => 'bar'\n35             ]\n36         ]\n37     ]\n38   ];\n39 }\n40 \n41 /**\n\
  42  * 用于测试的空清单。\n43  */\n44 function empty_inventory() {\n45   return ['_meta' =>\
  \ ['hostvars' => []]];\n46 }\n47 \n48 /**\n49  * 读取传递给脚本的命令行参数。\n50  */\n51 function\
  \ read_cli_args() {\n52     $parser = argparse.ArgumentParser();\n53     $parser->add_argument('--list',\
  \ action = 'store_true');\n54     $parser->add_argument('--host', action = 'store');\n\
  55     $args = $parser->parse_args();\n56 }\n57 \n58 /**\n59  * 获取清单。\n60  */\n\
  61 function get_inventory($argv = []) {\n62     $inventory = [];\n63     $args =\
  \ read_cli_args(); // 注意：此逻辑为了示例而进行了简化\n64 \n66     // 使用 --list 调用。\n67     if\
  \ (isset($args->list)) {\n68         $inventory = example_inventory();\n69     //\
  \ 使用 --host [hostname] 调用。\n70     elseif (isset($args->host)) {\n71         //\
  \ 未实现，因为通过 --list 返回 _meta 信息。\n72         $inventory = empty_inventory();\n73 \
  \    // 如果不存在组或变量，则返回空清单。\n74     else {\n75         $inventory = empty_inventory();\n\
  76     }\n77 \n78     echo json_encode($inventory);\n79 }\n```\n（注：上面的 PHP 示例是 Python\
  \ 代码段提供逻辑的概念性表示，以匹配要求的格式样式)。\n\n### 使用自定义动态清单管理 PaaS\n\n[Hosted Apache Solr](https://hostedapachesolr.com/)\
  \ 的基础设施使用自定义动态清单构建，以便进行集中控制的服务器配置和设置。以下是服务器配置的工作流程：\n\n1.  Drupal 网站持有一个 `Server`\
  \ 内容类型，用于存储每台服务器的元数据（例如：所选主机名、数据中心位置、操作系统镜像选择以及内存设置）。\n\n2.  当添加新服务器时，系统会触发一个远程\
  \ Jenkins 任务，该任务将：1. 使用 Ansible 剧本在 DigitalOcean 上构建新的云服务器。2. 在服务器上运行配置型剧本以初始化配置。3.\
  \ 为服务器添加新的 DNS 记录。4. 通过私有 API 将额外的服务器元数据（如 IP 地址）回传给 Drupal 网站。\n\n\n\n\n\n3. 当服务器更新或有新配置需要部署到服务器上时，会触发一个不同的\
  \ Jenkins 任务，该任务将：\n\n1. 在所有 DigitalOcean 服务器上运行相同的配置剧本（playbook）。该剧本使用清单脚本，该脚本会调用清单\
  \ API 端点并以 JSON 格式返回所有服务器信息（Jenkins 服务器上的清单脚本将 JSON 传递给标准输出）。\n2. 向 REST API 报告\
  \ Ansible playbook 的执行成功或失败。\n\n上述过程改变了整个托管 Apache Solr 平台的管理方式。以前需要花费二三三十分钟来构建一个新服务器（即使使用带有少量手动步骤的\
  \ Ansible playbook），现在该过程只需几分钟即可完成，且无需人工干预。\n\n### 总结\n\n从包含一台服务器的最基础基础设施到包含数千台服务器的多租户动态基础设施，Ansible\
  \ 为描述您的服务器提供了许多选项，并允许针对特定主机或组覆盖 playbook 和角色变量。通过 Ansible 灵活的清单系统，您能够描述您所有的服务器，无论它们是如何被管理的，也无论它们托管在何处。\n\
  \n```\n ___________________________________\n/ A pint of sweat saves a gallon of\
  \ \\\n\\ blood. (General Patton)           /\n -----------------------------------\n\
  \        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n\
  \                ||----w |\n                ||     ||\n```\n\n## 第 9 章 - Ansible\
  \ 菜谱\n\n到目前，本书的大部分内容展示了 Ansible 的各个方面——清单、playbooks、即时任务等。但本章综合了我们在前面章节中过的过的内容，并展示了如何将\
  \ Ansible 应用于真实的架构管理场景。\n\n### 使用 Ansible 构建高可用基础设施\n\n现实世界的 Web 应用需要多服务器基础设施的冗余和水平扩展性。在接下来的示例中，我们将使用\
  \ Ansible 在本地配置（通过 Vagrant 和 VirtualBox）的服务器或一组自动配置的实例（运行在 DigitalOcean 或 Amazon\
  \ Web Services 上）上配置复杂的基础设施：\n\n![高可用基础设施。](img/9-highly-available-infrastructure.png)\n\
  \n高可用基础设施。\n\n`Varnish` 当负载均衡器和反向代理，面对 Web 请求并将其路由到应用服务器。我们同样可以轻松使用 `Nginx` 或 `HAProxy`，甚至使用专有的云解决方案，如\
  \ Amazon 的 `Elastic Load Balancer` 或 Linode 的 `NodeBalancer`，但为了简单和部署的灵活性，我们将使用\
  \ Varnish。\n\n`Apache` 和 `mod_php` 运行一个基于 PHP 的应用程序，显示整个栈的当前状态并输出当前服务器的 IP 地址用于负载均衡验证。\n\
  \n`Memcached` 服务器提供了一个缓存层，用于存储和检索频繁访问的对象，以替代较慢的数据库存储。\n\n两台 `MySQL` 服务器被配置为主库和从库，提供冗余且高性能的数据库访问；所有数据将从主库复制到从库，此外从库可以作为只读查询的备服务器，为主库分担。\n\
  \n#### 目录结构\n\n为了保持配置整洁，我们为 playbook 和配置使用以下结构：\n\n```\nlamp-infrastructure/\n \
  \ inventories/\n  playbooks/\n    db/\n    memcached/\n    varnish/\n    www/\n\
  \  provisioners/\n  configure.yml\n  provision.yml\n  requirements.yml\n  Vagrantfile\n\
  ```\n\n这种组织方式允许我们能够单独关注每台服务器的配置，稍后为不同的托管提供商构建用于配置和配置实例的 playbook。这种组织方式也保持了服务器 playbook\
  \ 完全独立，因此我们可以模块化并复用单个服务器配置。\n\n#### 单个服务器 Playbook\n\n让我们开始构建单个服务器的 playbook（在 `playbooks`\
  \ 目录下）。为了让我们的 playbook 更高效，我们将使用 Ansible Galaxy 上的贡献 Ansible 角色，而不是一步步安装和配置一切。我们将在这些\
  \ playbook 中目标位于 CentOS 7 服务器，但要将这些 playbook 用于 Ubuntu、Debian 或更高版本的 CentOS，仅需极少的更改。\n\
  \n**Varnish**\n\n在 `playbooks/varnish` 目录内创建一个 `main.yml` 文件，内容如下：\n\n```\n 1 ---\n\
  \ 2 - hosts: lamp_varnish\n 3   become: yes\n 4 \n 5   vars_files:\n 6     - vars.yml\n\
  \ 7 \n 8   roles:\n 9     - geerlingguy.firewall\n10     - geerlingguy.repo-epel\n\
  11     - geerlingguy.varnish\n12 \n13   tasks:\n14     - name: Copy Varnish default.vcl.\n\
  15       template:\n16         src: \"templates/default.vcl.j2\"\n17         dest:\
  \ \"/etc/varnish/default.vcl\"\n18       notify: restart varnish\n```\n\n我们将在 `lamp_varnish`\
  \ 清单组（我们稍后会创建）中的所有主机上运行此 playbook，并运行几个简单的角色来配置服务器：\n\n* `geerlingguy.firewall`\
  \ 使用 `vars.yml` 中定义的几个变量配置简单的基于 iptables 的防火墙。\n* `geerlingguy.repo-epel` 添加 EPEL\
  \ 存储（varn 的先决条件）。\n* `geerlingguy.varnish` 安装并配置 Varnish。\n\n最后，一个任务拷贝一个自定义的 `default.vcl`\
  \ 来配置 Varnish，告诉它去哪里寻找我们的 Web 服务器。\n\n我们将在 `lamp_varnish` 清单组中的所有主机上运行此 playbook，并运行几个简单的角色来配置服务器：\n\
  \n* `geerlingguy.firewall` 使用 `vars.yml` 中定义的几个变量配置简单的基于 iptables 的防火墙。\n* `geerlingguy.repo-epel`\
  \ 添加 EPEL 存储（varn 的先决条件）。\n* `geerlingguy.varnish` 安装并配置 Varnish。\n\n最后，一个任务拷贝一个自定义的\
  \ `default.vcl` 来配置 Varnish，告诉它去哪里寻找我们的 Web 服务器。\n\n\n\n\n\n根据 #4，我们实际上正在`绕过 Varnish\
  \ 缓存层`，这在典型的生产环境中是没有帮助的。如果你只需要一个不带任何反向代理或缓存功能的负载均衡器，会有更好的选择。然而，我们需要验证我们的基础设施是否按预期方式工作。如果我们使用了\
  \ Varnish 缓存，那么在正常测试期间，Varnish 只会命中我们两台 Web 服务器中的一个。\n\n对于我们的缓存/负载均衡层来说，这已经足够了。对于真正的生产环境，您应该删除最后的\
  \ `return (pass)` 并根据您的应用程序需求自定制 `default.vcl`。\n\n### Apache / PHP\n\n在 `playbooks/www`\
  \ 目录内创建一个 `main.yml` 文件，内容如下：\n\n```\n 1 ---\n 2 - hosts: lamp_www\n 3   become:\
  \ yes\n 4 \n5   vars_files:\n 6     - vars.yml\n 7 \n 8   roles:\n 9     - geerlingguy.firewall\n\
  10     - geerlingguy.repo-epel\n11     - geerlingguy.apache\n12     - geerlingguy.php\n\
  13     - geerlingguy.php-mysql\n14     - geerlingguy.php-memcached\n15 \n16   tasks:\n\
  17     - name: Remove the Apache test page.\n18       file:\n19         path: /var/www/html/index.html\n\
  20         state: absent\n21 \n22     - name: Copy our fancy server-specific home\
  \ page.\n23       template:\n24         src: templates/index.php.j2\n25        \
  \ dest: /var/www/html/index.php\n26 \n27     - name: Ensure required SELinux dependency\
  \ is installed.\n28       package:\n29         name: libsemanage-python\n30    \
  \     state: present\n31 \n32     - name: Configure SELinux to allow HTTPD connections.\n\
  33       seboolean:\n34         name: \"{{ item }}\"\n35         state: true\n36\
  \         persistent: true\n37       with_items:\n38         - httpd_can_network_connect_db\n\
  39         - httpd_can_network_memcache\n40       when: ansible_selinux.status ==\
  \ 'enabled'\n```\n\n与 Varnish 的配置一样，我们将配置防火墙并添加 EPEL 存储库（PHP memcached 集成所需的），我们还将添加以下角色：\n\
  \n* `geerlingguy.apache` 安装并配置最新可用版本的 Apache Web 服务器。\n* `geerlingguy.php` 安装并配置\
  \ PHP 以便通过 Apache 运行。\n* `geerlingguy.php-mysql` 为 PHP 添加 MySQL 支持。\n* `geerlingguy.php-memcached`\
  \ 为 PHP 添加 Memcached 支持。\n\n前两个任务删除了 Apache 自带的默认 `index.html` 主页，并将其替换为我们的 PHP\
  \ 应用程序。\n\n最后两个任务确保 SELinux 配置正确，以允许 Apache 通过网络与数据库和 memcached 服务器通信。关于如何配置 SELinux\
  \ 的更多讨论，请参阅第 11 章。\n\n与 Varnish 示例一样，创建上述 playbook 中引用的两个文件。首先是 `vars.yml` 与 `main.yml`\
  \ 放在一起：\n\n```\n1 ---\n2 firewall_allowed_tcp_ports:\n3   - \"22\"\n4   - \"80\"\
  \n```\n\n在 `playbooks/www` 目录内创建一个 `templates` 目录，并在其中创建一个 `index.php.j2` 文件。该文件将使用\
  \ Jinja 语法构建一个（相对）简单的 PHP 脚本，用于显示我们基础设施中所有服务器的健康和状态：\n\n```php\n 1 <?php\n 2 /**\n\
  3  * @file\n4  * 基础设施测试页面。\n5  *\n6  * 切勿在生产环境中使用此。它仅仅是一个 PoC（概念证明）。\n7  */\n 8\
  \ \n9 $mysql_servers = array(\n10 {% for host in groups['lamp_db'] %}\n11   '{{\
  \ host }}',\n12 {% endfor %}\n13 );\n14 $mysql_results = array();\n15 foreach ($mysql_servers\
  \ as $host) {\n16   if ($result = mysql_test_connection($host)) {\n17     $mysql_results[$host]\
  \ = '<span style=\"color: green;\">PASS\\\n18 </span>';\n19     $mysql_results[$host]\
  \ .= ' (' . $result['status'] . ')';\n20   }\n21   else {\n22     $mysql_results[$host]\
  \ = '<span style=\"color: red;\">FAIL</span>';\n23   }\n24 }\n25 \n26 // 连接到 Memcached。\n\
  27 $memcached_result = '<span style=\"color: red;\">FAIL</span>';\n28 if (class_exists('Memcached'))\
  \ {\n29   $memcached = new Memcached;\n30   $memcached->addServer('{{ groups['lamp_memcached'][0]\
  \ }}', 11211);\n31 \n32   // 测试向 memcached 添加一个值。\n33   if ($memcached->add('test',\
  \ 'success', 1)) {\n34     $result = $memcached->get('test');\n35     if ($result\
  \ == 'success') {\n36       $memcached_result = '<span style=\"color: green;\">PASS</span>';\n\
  37       $memcached->delete('test');\n38     }\n39   }\n40 }\n41 \n42 /**\n43  *\
  \ 连接到 MySQL 服务器并测试连接。\n44  *\n45  * @param string $host\n46  *   服务器的 IP 地址或主机名。\n\
  47  *\n48  * @return array\n49  *   包含 'success' (bool) 和 'status' ('slave' 或 'master')\
  \ 的数组。\n50  *   连接失败则为空。\n51  */\n52 function mysql_test_connection($host) {\n53\
  \   $username = 'mycompany_user';\n54   $password = 'secret';\n55   try {\n56  \
  \   $db = new PDO(\n57       'mysql:host=' . $host . ';dbname=mycompany_database',\n\
  58       $username,\n59       $password,\n60       array(PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION));\n\
  61     \n62     // 查询查看服务器是否配置为为主库或从库。\n63     $statement = $db->prepare(\"SELECT\
  \ variable_value\n64       FROM information_schema.global_variables\n65       WHERE\
  \ variable_name = 'log_bin';\");\n66     $statement->execute();\n67     $result\
  \ = $statement->fetch();\n68     \n69     return array(\n70       'success' => TRUE,\n\
  71       'status' => ($result[0] == 'ON') ? 'master' : 'slave',\n72     );\n73 \
  \  } catch (PDOException $e) {\n74     return array();\n75   }\n76 }\n77 ?>\n78\
  \ <!DOCTYPE html>\n79 <html>\n80 <head>\n81   <title>{{ inventory_hostname }}</title>\n\
  82   <style>* { font-family: Helvetica, Arial, sans-serif; }</style>\n83 </head>\n\
  84 <body>\n85   <h1>Host {{ inventory_hostname }}</h1>\n86   <?php foreach ($mysql_results\
  \ as $host => $result): ?>\n87     <p>MySQL Connection (<?php echo $host; ?>): <?php\
  \ echo $result; ?></p>\n88   <?php endforeach; ?>\n89   <p>Memcached Connection:\
  \ <?php echo $memcached_result; ?></p>\n90 </body>\n91 </html>\n```\n\n到此时，我们基础设施的核心——用于测试并显示所有服务器状态的应用程序已经准备就绪。\n\
  \n### Memcached\n\n与之前的 playbook 相比，Memcached playbook 非常简单。创建 `playbooks/memcached/main.yml`\
  \ 并内容如下：\n\n```\n 1 ---\n 2 - hosts: lamp_memcached\n 3   become: yes\n 4 \n5  \
  \ vars_files:\n 6     - vars.yml\n 7 \n 8   roles:\n 9     - geerlingguy.firewall\n\
  10     - geerlingguy.memcached\n```\n\n与其他服务器一样，我们需要使用简单的 `geerlingguy.firewall`\
  \ 角色确保只开启所需的 TCP 端口。接下来我们使用 `geerlingguy.memcached` 角色安装 Memcached。\n\n在我们的 `vars.yml`\
  \ 文件中（再次与 `main.yml` 放在一起），添加以下内容：\n\n```\n1 ---\n2 firewall_allowed_tcp_ports:\n\
  3   - \"22\"\n4 firewall_additional_rules:\n5   - \"iptables -A INPUT -p tcp --dport\
  \ 11211 -s \\\n6   {{ groups['lamp_www'][0] }} -j ACCEPT\"\n7   - \"iptables -A\
  \ INPUT -p tcp --dport 11211 -s \\\n8   {{ groups['lamp_www'][1] }} -j ACCEPT\"\n\
  9 \n10 memcached_listen_ip: \"0.0.0.0\"\n```\n\n\n\n\n我们需要开放 `22` 端口以便进行远程访问。对于\
  \ Memcached，我们正在添加手动 `iptables` 规则，允许*仅* Web 服务器访问 `11211` 端口。我们通过深入解析 Ansible 用于跟踪当前可用所有清单组生成的\
  \ `groups` 变量中的每一项，为每个 `lamp_www` 服务器添加一条规则。我们还将 Memcached 绑定到所有接口，以便它能够接受通过服务器网络接口的连接。\n\
  \n## MySQL\n\nMySQL 的配置比其他服务器更复杂，因为我们需要按主机配置 MySQL 用户并配置复制。由于我们想维护一个独立且灵活的 playbook，我们还需要动态创建一些变量，以便\
  \ MySQL 在任何潜在环境中都能获取正确的服务器地址。\n\n让我们首先创建主 playbook，`playbooks/db/main.yml`：\n\n\
  ```\n 1 ---\n 2 - hosts: lamp_db\n 3   become: yes\n 4 \n5   vars_files:\n 6   \
  \  - vars.yml\n 7 \n8   pre_tasks:\n 9     - name: Create dynamic MySQL variables.\n\
  10       set_fact:\n11         mysql_users:\n12           - name: mycompany_user\n\
  13             host: \"{{ groups['lamp_www'][0] }}\"\n14             password: secret\n\
  15             priv: \"*.*:SELECT\"\n16           - name: mycompany_user\n17   \
  \          host: \"{{ groups['lamp_www'][1] }}\"\n18             password: secret\n\
  19             priv: \"*.*:SELECT\"\n20         mysql_replication_master: \"{{ groups['a4d.lamp.db.1'][0]\
  \ }}\"\n21 \n22   roles:\n23     - geerlingguy.firewall\n24     - geerlingguy.mysql\n\
  ```\n\n大部分 playbook 都是直观的，但在这种情况下，我们使用 `set_fact` 作为 `pre_task`（在运行 `geerlingguy.firewall`\
  \ 和 `geerlingguy.mysql` 角色之前运行）来为 MySQL 配置动态创建变量。\n\n`set_fact` 允许我们在运行时定义变量，因此我们可以获取所有服务器\
  \ IP 地址，即使这些服务器是在 playbook 运行开始时才刚刚配置的。我们将创建两个变量：\n\n* `mysql_users` 是 `geerlingguy.mysql`\
  \ 角色执行时将创建的用户列表。该变量将用于所有数据库服务器，因此两个 `lamp_www` 服务器都获得对所有数据库的 `SELECT` 权限。\n* `mysql_replication_master`\
  \ 用于指示 `geerlingguy.mysql` 角色哪一个数据库服务器是主节点；它将根据正在配置的服务器是主还是从不同地执行某些步骤，并确保所有从节点都配置为从主节点复制数据。\n\
  \n我们需要几个其他普通变量来配置 MySQL，因此我们将在 `playbooks/db/vars.yml` 中与防火墙变量一起添加它们：\n\n```\n 1\
  \ ---\n 2 firewall_allowed_tcp_ports:\n 3   - \"22\"\n 4   - \"3306\"\n 5 \n6 mysql_replication_user:\n\
  \ 7   name: replication\n 8   password: secret\n 9 \n10 mysql_databases:\n11   -\
  \ name: mycompany_database\n12     collation: utf8_general_ci\n13     encoding:\
  \ utf8\n```\n\n我们向所有人开放了 `3306` 端口，但根据之前讨论的**最小权限原则**，你有理由将此端口限制为仅需要访问 MySQL 的服务器和用户（类似于\
  \ memcached 服务器配置）。在这种情况下，攻击向量得到了缓解，因为通过 `main.yml` 中生成的 `mysql_user` 变量使用了 MySQL\
  \ 自身的身份验证层。\n\n我们定义了两个 MySQL 变量：用于主从复制的 `mysql_replication_user`，以及 `mysql_databases`，用于定义要在数据库服务器上创建（如果它们尚存在）的数据库列表。\n\
  \n数据库服务器的配置完成后，特定服务器的 playbook 就可以就绪了。\n\n## 配置所有服务器的主 Playbook\n\n我们只需要一个包含每个组特定\
  \ playbook 的简单 playbook 即可完成整体配置。在项目根目录中创建 `configure.yml`，内容如下：\n\n```\n1 ---\n\
  2 - import_playbook: playbooks/varnish/main.yml\n3 - import_playbook: playbooks/www/main.yml\n\
  4 - import_playbook: playbooks/db/main.yml\n5 - import_playbook: playbooks/memcached/main.yml\n\
  ```\n\n此时，如果你有一些已经启动的服务器以及静态定义的清单组（如 `lamp_www`、`lamp_db` 等），你就可以运行 `ansible-playbook\
  \ configure.yml` 并准备好完整的高可用（HA）基础设施了！\n\n但我们将继续让我们的 playbook 更加灵活和有用。\n\n## 获取所需的角色\n\
  \n如第 6 章所述，Ansible 允许你在 `requirements.yml` 文件中为特定项目定义所有所需的 Ansible Galaxy 角色。我们不需要记住为所使用的每个角色手动运行\
  \ `ansible-galaxy role install -y [role1] [role2] [role3]`，而可以在项目根目录下创建 `requirements.yml`，内容如下：\n\
  \n```\n 1 ---\n 2 roles:\n 3   - name: geerlingguy.firewall\n 4   - name: geerlingguy.repo-epel\n\
  \ 5   - name: geerlingguy.varnish\n 6   - name: geerlingguy.apache\n 7   - name:\
  \ geerlingguy.php\n 8   - name: geerlingguy.php-mysql\n 9   - name: geerlingguy.php-memcached\n\
  10   - name: geerlingguy.mysql\n11   - name: geerlingguy.memcached\n```\n\n为了确保安装所有所需的依赖项，请在项目目录下运行\
  \ `ansible-galaxy install -r requirements.yml`。\n\n## 通过 VirtualBox 构建本地基础设施的 Vagrantfile\n\
  \n与书中许多其他示例一样，我们可以使用 Vagrant 和 VirtualBox 在本地构建和配置基础设施。这让我们能够以零成本进行无限测试，并且通常会带来更快的测试周期，因为一切都是在（理想强大的）工作站本地私有网络上协调的。\n\
  \n我们的基础 Vagrantfile 布局如下：\n\n1. 定义基础镜像（在本例中为 CentOS 7）和虚拟机硬件默认。\n2. 定义要构建的所有虚拟机，带有特定的虚拟机\
  \ IP 地址和主机名配置。\n3. 将 Ansible 提供程序与最后一台虚拟机一起定义，以便 Ansible 可以在 Vagrant 构建周期结束后运行一次。\n\
  \n这里是完整的 Vagrantfile：\n\n\n\n\n\n```ruby\n# mode: ruby -*-\n# vi: set ft=ruby :\n\
  \nVagrant.configure(\"2\") do |config|\n  # Base VM OS configuration.\n  config.vm.box\
  \ = \"geerlingguy/centos7\"\n  config.ssh.insert_key = false\n  config.vm.synced_folder\
  \ '.', '/vagrant', disabled: true\n\n  # General VirtualBox VM configuration.\n\
  \  config.vm.provider :virtualbox do |v|\n    v.memory = 512\n    v.cpus = 1\n \
  \   v.linked_clone = true\n    v.customize [\"modifyvm\", :id, \"--natdnshostresolver1\"\
  , \"on\"]\n    v.customize [\"modifyvm\", :id, \"--ioapic\", \"on\"]\n  end\n\n\
  \  # Varnish.\n  config.vm.define \"varnish\" do |varnish|\n    varnish.vm.hostname\
  \ = \"varnish.test\"\n    varnish.vm.network :private_network, ip: \"192.168.56.2\"\
  \n  end\n\n  # Apache.\n  config.vm.define \"www1\" do |www1|\n    www1.vm.hostname\
  \ = \"www1.test\"\n    www1.vm.network :private_network, ip: \"192.168.56.3\"\n\n\
  \    www1.vm.provision \"shell\",\n      inline: \"sudo yum update -y\"\n\n    www1.vm.provider\
  \ :virtualbox do |v|\n      v.customize [\"modifyvm\", :id, \"--memory\", 512]\n\
  \    end\n  end\n\n  # Apache.\n  config.vm.define \"www2\" do |www2|\n    www2.vm.hostname\
  \ = \"www2.test\"\n    www2.vm.network :private_network, ip: \"192.168.56.4\"\n\n\
  \    www2.vm.provision \"shell\",\n      inline: \"sudo yum update -y\"\n\n    www2.vm.provider\
  \ :virtualbox do |v|\n      v.customize [\"modifyvm\", :id, \"--memory\", 512]\n\
  \    end\n  end\n\n  # MySQL.\n  config.vm.define \"db1\" do |db1|\n    db1.vm.hostname\
  \ = \"db1.test\"\n    db1.vm.network :private_network, ip: \"192.168.56.5\"\n  end\n\
  \n  # MySQL.\n  config.vm.define \"db2\" do |db2|\n    db2.vm.hostname = \"db2.test\"\
  \n    db2.vm.network :private_network, ip: \"192.168.56.6\"\n  end\n\n  # Memcached.\n\
  \  config.vm.define \"memcached\" do |memcached|\n    memcached.vm.hostname = \"\
  memcached.test\"\n    memcached.vm.network :private_network, ip: \"192.168.56.7\"\
  \n\n    # Run Ansible provisioner once for all VMs at the end.\n    memcached.vm.provision\
  \ \"ansible\" do |ansible|\n      ansible.playbook = \"configure.yml\"\n      ansible.inventory_path\
  \ = \"inventories/vagrant/inventory\"\n      ansible.limit = \"all\"\n      ansible.extra_vars\
  \ = {\n        ansible_user: 'vagrant',\n        ansible_ssh_private_key_file: \\\
  \n        \"~/.vagrant.d/insecure_private_key\"\n      }\n    end\n  end\nend\n\
  ```\n\n`Vagrantfile` 的大部分内容非常直观，与书中使用的其他示例类似。最后一段定义 `ansible` 调备器配置的代码块包含了三个对我们目标非常重要的额外值：\n\
  \n```\nansible.inventory_path = \"inventories/vagrant/inventory\"\nansible.limit\
  \ = \"all\"\nansible.extra_vars = {\n  ansible_user: 'vagrant',\n  ansible_ssh_private_key_file:\
  \ \"~/.vagrant.d/insecure_private_key\"\n}\n```\n\n1. `ansible.inventory_path` 定义了\
  \ `ansible.playbook` 的清单文件。你完全可以创建一个供 Vagrant 使用的动态清单脚本，但由于我们提前知道了 IP 地址，并且预期会使用一些特殊设计的清单组名称，因此手动为\
  \ Vagrant 调备构建清单文件会更简单（我们下一步将操作）。\n\n2. `ansible.limit` 设置为 `all`，这样 Vagrant 就知道它应该运行连接到所有虚拟机的\
  \ Ansible playbook，而不仅仅是当前虚拟机。从技术上讲，你可以为每个单独虚拟机的调备配置中使用 `ansible.limit`，并仅通过 Vagrant\
  \ 运行特定虚拟机的 playbook，但我们的线上生产基础设施将使用一个 playbook 来配置所有服务器，因此我们在本地也同样这样做。\n\n3. `ansible.extra_vars`\
  \ 包含了用于 Ansible 的 Vagrant SSH 用户配置。将这些设置包含在静态清单文件中或使用 Vagrant 自动生成的清单文件是标准做法，但这里一次性为所有服务器设置它们是最简单的。\n\
  \n在运行 `vagrant up` 查看我们的劳动成果之前，我们需要在 `inventories/vagrant/inventory` 为 Vagrant 创建一个清单文件：\n\
  \n```\n[lamp_varnish]\n192.168.56.2\n\n[lamp_www]\n192.168.56.3\n192.168.56.4\n\n\
  [a4d.lamp.db.1]\n192.168.56.5\n\n[lamp_db]\n192.168.56.5 mysql_replication_role=master\n\
  192.168.56.6 mysql_replication_role=slave\n\n[lamp_memcached]\n192.168.56.7\n```\n\
  \n现在 `cd` 进入项目根目录，运行 `vagrant up`，在十或十五分钟后，在浏览器中加载 `http://192.168.56.2/`。大功告成！\n\
  \n![高可用基础设施 - 成功！](img/9-ha-infrastructure-success.png)\n\n高可用基础设施 - 成功！\n\n你应该看到上面的截图。PHP\
  \ 应用显示当前应用服务器的 IP 地址、各个 MySQL 服务器的状态以及 Memcached 服务器的状态。刷新几次页面以验证 Varnish 是否在两个应用服务器之间随机分配请求。\n\
  \n我们现在涵盖了本地基础设施。\n\n### 调备器配置：DigitalOcean\n\n在第 8 章中，我们学习了在 Ansible 中调备 DigitalOcean\
  \ 相当简单。但我们需要更进一步，调备多个 droplet（每个服务器一个）并在它们启动后对它们进行分组。为了灵活性，让我们创建 `digitalocean.yml`。如下如下开始\
  \ playbook：\n\n```yaml\n---\n- hosts: localhost\n  connection: local\n  gather_facts:\
  \ false\n```\n\n接下来，我们需要定义一些元数据来描述每个 droplet。为了简单起见，我们在这个 playbook 中内联 `droplets`\
  \ 变量：\n\n```yaml\n  vars:\n    droplets:\n      - { name: a4d.lamp.varnish, group:\
  \ \"lamp_varnish\" }\n      - { name: a4d.lamp.www.1, group: \"lamp_www\" }\n  \
  \    - { name: a4d.lamp.www.2, group: \"lamp_www\" }\n      - { name: a4d.lamp.db.1,\
  \ group: \"lamp_db\" }\n      - { name: a4d.lamp.db.2, group: \"lamp_db\" }\n  \
  \    - { name: a4d.lamp.memcached, group: \"lamp_memcached\" }\n```\n\n每个 droplet\
  \ 都是带有两个键的对象：\n\n* `name`: 用于 DigitalOcean 列表和 Ansible 主机清单的 Droplet 名称。\n* `group`:\
  \ 该 droplet 的 Ansible 清单组。\n\n接下来我们需要添加一个任务来创建 droplet，使用 `droplets` 列表作为指南，并在同一任务中将每个\
  \ droplet 信息注册到独立的字典 `created_droplets` 中：\n\n```yaml\n  tasks:\n    - name: Provision\
  \ DigitalOcean droplets.\n      digital_ocean_droplet:\n        state: \"{{ item.state\
  \ | default('present') }}\"\n        name: \"{{ item.name }}\"\n        private_networking:\
  \ yes\n        size: \"{{ item.size | default('1gb') }}\"\n        image: \"{{ item.image\
  \ | default('centos-7-x64') }}\"\n        region: \"{{ item.region | default('nyc3')\
  \ }}\"\n        # 根据你的账户自定义此默认值。\n        ssh_keys:\n          - \"{{ item.ssh_key\
  \ | default('138954') }}\"\n        unique_name: yes\n      register: created_droplets\n\
  \      with_items: \"{{ droplets }}\"\n```\n\n许多选项（例如 `size`）被定义为 `{{ item.property\
  \ | default('default_value') }}`，这允许我们为每个 droplet 使用可选变量。对于定义的任何 droplet，我们都可以添加\
  \ `size: 2gb`，这将覆盖任务中设置的默认值。\n\n\n\n\n我们使用 `with_items: droplets` 遍历所有定义的 `droplets`，在每个\
  \ droplet 创建后，我们将该 droplet 的元数据（名称、IP 地址等）添加到 `created_droplets` 变量中。接下，我们将遍历该变量来动态构建主机清单（inventory），以确保我们的配置应用到正确的服务器上：\n\
  \n```\n31     - name: Add DigitalOcean hosts to inventory groups.\n32       add_host:\n\
  33         name: \"{{ item.1.data.ip_address }}\"\n34         groups: \"do,{{ droplets[item.0].group\
  \ }},{{ item.1.data.droplet\\\n35 .name }}\"\n36         # You can dynamically add\
  \ inventory variables per-host.\n37         ansible_user: root\n38         mysql_replication_role:\
  \ >-\n39           {{ 'master' if (item.1.data.droplet.name == 'a4d.lamp.db.1')\n\
  40           else 'slave' }}\n41         mysql_server_id: \"{{ item.0 }}\"\n42 \
  \      when: item.1.data is defined\n43       with_indexed_items: \"{{ created_droplets.results\
  \ }}\"\n```\n\n你会注意到在这个任务中发生了几件有趣的事：\n\n*   这是我们第一次使用 `with_indexed_items`。虽然它不那么常见，但这是一个非常有价值的循环功能，因为它添加了按顺序的且唯一的\
  \ `mysql_server_id`。虽然只有 MySQL 服务器需要设置服务器 ID，但为每个服务器动态创建该变量更为简单，这样在需要时每个服务器都处于可用状态。`with_indexed_items`\
  \ 将 `item.0` 设置为项的键（key），将 `item.1` 设置为项的值（value）。\n\n*   除了帮助我们创建服务器 ID，`with_indexed_items`\
  \ 还能帮助我们可靠地设置每个 droplet 组。我们也可以考虑使用标签（tags）作为组，但本示例是手动配置组。通过使用我们之前手动创建的 `droplets`\
  \ 变量，我们可以为特定的 droplet 设置正确的组。\n\n*   最后，我们在 `add_host` 中按主机添加清单变量。要做到这一点，我们将变量名作为键，并将变量值作为该键的值。简单却强大！\n\
  \n我们部署的最后一步是确保所有 droplet 都已启动并可以通过 SSH 访问。因此，在 `digitalocean.yml` playbook 的末尾，添加另一个运行在我们刚刚定义的\
  \ `do` 组主机 上的 play：\n\n```\n44 - hosts: do\n45   remote_user: root\n46   gather_facts:\
  \ false\n47 \n48   tasks:\n49     - name: Wait for hosts to become reachable.\n\
  50       wait_for_connection:\n```\n\n一旦 Ansible 可以访问该服务器（使用 `wait_for_connection`\
  \ 模块），我们就知道 droplet 已经启动并准备好进行配置。\n\n我们现在*几乎*准备好在 DigitalOcean 上部署和配置我们的整个基础设施了，但首先我们需要创建最后一个\
  \ playbook 来将所有内容整合起来。在项目根目录下创建 `provision.yml`，内容如下：\n\n```\n1 ---\n2 - import_playbook:\
  \ provisioners/digitalocean.yml\n3 - import_playbook: configure.yml\n```\n\n就是这样！现在，假设你设置了环境变量\
  \ `DO_API_TOKEN`，你可以运行 `$ansible-playbook provision.yml` 来在 DigitalOcean 上部署并配置基础设施。\n\
  \n整个过程大约需要 15 分钟；一旦完成，你应该看到类似的内容：\n\n```\nPLAY RECAP **********************************************************\n\
  107.170.27.137       : ok=19   changed=13   unreachable=0    failed=0\n107.170.3.23\
  \         : ok=13   changed=8    unreachable=0    failed=0\n107.170.51.216     \
  \  : ok=40   changed=18   unreachable=0    failed=0\n107.170.54.218       : ok=27\
  \   changed=16   unreachable=0    failed=0\n162.243.20.29        : ok=24   changed=15\
  \   unreachable=0    failed=0\n192.241.18.197      : ok=44   changed=24    unreachable=0\
  \    failed=0\nlocalhost            : ok=2    changed=0\n```\n\n\n\n\n```yaml\n\
  security_groups:\n  - name: a4d_lamp_http\n    rules:\n      - proto: tcp\n    \
  \    from_port: 80\n        to_port: 80\n        cidr_ip: 0.0.0.0/0\n      - proto:\
  \ tcp\n        from_port: 22\n        to_port: 22\n        cidr_ip: 0.0.0.0/0\n\
  \    rules_egress: []\n\n  - name: a4d_lamp_db\n    rules:\n      - proto: tcp\n\
  \        from_port: 3306\n        to_port: 3306\n        cidr_ip: 0.0.0.0/0\n  \
  \    - proto: tcp\n        from_port: 22\n        to_port: 22\n        cidr_ip:\
  \ 0.0.0.0/0\n    rules_egress: []\n\n  - name: a4d_lamp_memcached\n    rules:\n\
  \      - proto: tcp\n        from_port: 11211\n        to_port: 11211\n        cidr_ip:\
  \ 0.0.0.0/0\n      - proto: tcp\n        from_port: 22\n        to_port: 22\n  \
  \      cidr_ip: 0.0.0.0/0\n    rules_egress: []\n```\n\n每个安全组都包含一个 `name`（用于在 `instances`\
  \ 列表中标识安全组）、`rules`（一个防火墙规则列表——如协议、端口和 IP 范围——用于限制 `incoming` 流量）以及 `rules_egress`（一个限制\
  \ `outgoing` 流量的防火墙规则列表）。\n\n我们需要三个安全组：`a4d_lamp_http` 用于开启 80 端口，`a4d_lamp_db`\
  \ 用于开启 3306 端口，以及 `a4d_lamp_memcached` 用于开启 11211 端口。\n\n现在我们已经拥有了设置安全组和实例所需的所有数据，首要任务是创建或验证安全组的存在：\n\
  \n```yaml\ntasks:\n  - name: Configure EC2 Security Groups.\n    ec2_group:\n  \
  \    name: \"{{ item.name }}\"\n      description: Example EC2 security group for\
  \ A4D.\n      state: present\n      rules: \"{{ item.rules }}\"\n      rules_egress:\
  \ \"{{ item.rules_egress }}\"\n      profile: \"{{ aws_profile }}\"\n      region:\
  \ \"{{ aws_region }}\"\n    with_items: \"{{ security_groups }}\"\n```\n\n`ec2_group`\
  \ 需要为每个安全组提供名称、区域和规则。如果安全组不存在，则会被创建；如果已存在，则会被修改以匹配提供的值；如果已存在且匹配给定值，则会被验证。\n\n配置好安全组后，我们可以通过\
  \ `ec2` 模块遍历 `instances` 来部署定义的 EC2 实例：\n\n```yaml\n- name: Provision EC2 instances.\n\
  \  ec2:\n    key_name: \"{{ item.ssh_key | default('lamp_aws') }}\"\n    instance_tags:\n\
  \      Name: \"{{ item.name | default('') }}\"\n      Application: lamp_aws\n  \
  \    inventory_group: \"{{ item.group | default('') }}\"\n      inventory_host:\
  \ \"{{ item.name | default('') }}\"\n    group: \"{{ item.security_group | default('')\
  \ }}\"\n    instance_type: \"{{ item.type | default('t2.micro')}}\"\n    image:\
  \ \"{{ aws_ec2_ami }}\"\n    wait: yes\n    wait_timeout: 500\n    exact_count:\
  \ 1\n    count_tag:\n      inventory_host: \"{{ item.name | default('') }}\"\n \
  \   profile: \"{{ aws_profile }}\"\n    region: \"{{ aws_region }}\"\n  register:\
  \ created_instances\n  with_items: \"{{ instances }}\"\n```\n\n此示例比 DigitalOcean\
  \ 的示例稍微复杂，有几个部分值得深入思考：\n\n*   EC2 允许通过名称定义 SSH 密钥——在我的情况下，我在 AWS 账户中有一个名为 `lamp_aws`\
  \ 的密钥。你应该将 `key_name` 默认值设置为账户中拥有的密钥。\n*   实例标签（Instance tags）是 AWS 将附加到你的实例上的标签，用于分类。除了\
  \ `Name` 标签（用于在 AWS 控制台中中显示）外，你还可以添加任何想要的标签来帮助分类实例。\n*   使用了 `t2.micro` 作为默认实例类型，因为它处于\
  \ EC2 的免费套餐使用范围内。如果你只是设置了账户并并将所有 AWS 资源使用保持在免费额额限制内，将不会产生任何费用。\n*   `exact_count`\
  \ 和 `count_tag` 共同工作确保 AWS 仅为我们定义的每个实例部署一个。`count_tag` 告诉 `ec2` 模块匹配 `inventory_host`\
  \ 值，而 `exact_count` 告诉模块只部署 `1` 个实例。如果你想删除所有实例，可以将 `exact_count` 设置为 0 并再次运行 playbook。\n\
  \n每个部署的实例都将它的元数据添加到注册的 `created_instances` 变量中，我们将使用它来构建用于服务器配置 playbook 的 Ansible\
  \ 清单组。\n\n```yaml\n- name: Add EC2 instances to inventory groups.\n  add_host:\n\
  \    name: \"{{ item.1.tagged_instances.0.public_ip }}\"\n    groups: \"aws,{{ item.1.item.group\
  \ }},{{ item.1.item.name }}\"\n    # 你可以按主机动态添加清单变量。\n    ansible_user: centos\n\
  \    host_key_checking: false\n    mysql_replication_role: >-\n      {{ 'master'\
  \ if (item.1.item.name == 'a4d.lamp.db.1')\n      else 'slave' }}\n    mysql_server_id:\
  \ \"{{ item.0 }}\"\n  when: item.1.instances is defined\n  with_indexed_items: \"\
  {{ created_instances.results }}\"\n```\n\n这个 `add_host` 示例比 DigitalOcean 的稍微简单，因为\
  \ AWS 会为 EC2 实例附加元数据，我们可以在构建组或主机名时重用它（例如 `item.1.item.group`）。我们不需要使用列表索引从原始 `instances`\
  \ 变量中获取组名。\n\n我们仍然使用 `with_indexed_items`，以便可以使用索引为每台服务器生成一个唯一 ID，用于构建 MySQL 主从复制。\n\
  \n部署 EC2 实例的最后一步是确保它们已启动并能够接受连接。\n\n```yaml\n- hosts: aws\n  gather_facts: false\n\
  \n  tasks:\n    - name: Wait for hosts to become available.\n      wait_for_connection:\n\
  ```\n\n现在，修改根目录下的 `provision.yml` 文件，并将部署器导入更改如下所示：\n\n```yaml\n---\n- import_playbook:\
  \ provisioners/aws.yml\n- import_playbook: configure.yml\n```\n\n假设环境变量 `AWS_ACCESS_KEY_ID`\
  \ 和 `AWS_SECRET_ACCESS_KEY` 已在当前会话中设置，你可以运行 `ansible-playbook provision.yml` 来部署和配置基础设施。\n\
  \n整个过程大约需要 15 分钟，完成后你应该看到类似这样的的内容：\n\n```\nPLAY RECAP ******************************************\n\
  54.148.100.44        ok=24   changed=16   unreachable=0    failed=0\n54.148.120.23\
  \        ok=40   changed=19   unreachable=0    failed=0\n54.148.41.134        ok=40\
  \   changed=19   unreachable=0    failed=0\n54.148.56.137        ok=13   changed=9\
  \    unreachable=0    failed=0\n54.69.160.32         ok=27   changed=17   unreachable=0\
  \    failed=0\n54.69.86.187         ok=19   changed=14   unreachable=0    failed=0\n\
  localhost            ok=3    changed=1    unreachable=0    failed=0\n```\n\n访问 Varnish\
  \ 服务器的 IP 地址，你将看到一个与 Vagrant 和 DigitalOcean 基础设施类似的状态页面：\n\n![AWS EC2 高可用架构](img/9-ha-infrastructure-aws.png)\n\
  \nAWS EC2 高可用架构。\n\n与早期的示例一样，再次运行 `ansible-playbook provision.yml` 不应产生更改，因为此 playbook\
  \ 中的所有内容都是幂等的。如果你的某个实例被意外终止，再次运行 playbook 将在几分钟内重建并重新配置该实例。\n\n要终止所有部署的实例，可以将 `ec2`\
  \ 任务中的 `exact_count` 改为 `0`并再次运行 `ansible-playbook provision.yml`。\n\n##### AWS\
  \ EC2 动态清单插件\n\n如果你要在另一个 playbook 中连接到在 AWS 中部署的 EC2 服务器，你不需要在 play 中获取信息并使用 `add_hosts`\
  \ 在 playbook 构建清单。\n\n\n\n\n\n与上一章节中的 DigitalOcean 示例一样，你可以使用 `aws_ec2` 动态清单插件来与\
  \ AWS 账户中的服务器进行交互。\n\n在主 playbook 目录下的 `inventories/aws` 目录下创建一个 `aws_ec2.yml` 清单配置文件，并添加以下内容：\n\
  \n```\n 1 ---\n 2 plugin: aws_ec2\n 3 \n 4 regions:\n 5   - us-east-1\n 6 \n 7 hostnames:\n\
  \ 8   - ip-address\n 9\n10 keyed_groups:\n11   - key: tags.inventory_group\n```\n\
  \n要验证清单源是否工作正常，请使用 `ansible-inventory` 命令：\n\n```\n$ ansible-inventory -i inventories/aws/aws_ec2.yml\
  \ --graph\n@all:\n  |--@aws_ec2:\n  |  |--54.148.41.134\n  |  |--54.148.100.44\n\
  \  |  |--54.69.160.32\n  |  |--54.69.86.187\n  |  |--54.148.120.23\n  |  |--54.148.56.137\n\
  \  |--@lamp_aws:\n  |  |--54.148.41.134\n  |  |--54.148.100.44\n  |  |--54.69.160.32\n\
  \  |  |--54.69.86.187\n  |  |--54.148.120.23\n  |  |--54.148.56.137\n  |--@lamp_db:\n\
  \  |  |--54.148.100.44\n  |  |--54.148.120.23\n  |--@lamp_memcached:\n  |  |--54.148.41.134\n\
  \  |--@lamp_varnish:\n  |  |--54.148.56.137\n  |--@lamp_www:\n  |  |--54.69.160.32\n\
  \  |  |--54.69.86.187\n  |--@ungrouped:\n```\n\n然后，你可以在其他 playbook 中使用这些动态清单组，在所有\
  \ LAMP 服务器上运行任务（例如 `lamp_aws`），或者仅在其中一个子集上运行（例如 `lamp_db` 或 `lamp_www`）。\n\n###\
  \ 总结\n\n我们在一系列简短的 Ansible playbooks 中定义了整个高可用 PHP 基础设施，然后创建了置备配置，以便在本地虚拟机、DigitalOcean\
  \ droplets 或 AWS EC2 实例上构建该基础设施。\n\n一旦你开始以这种方式构建基础设施——通过抽象单个服务器，然后抽象云端置备——你将开始看到\
  \ Ansible 的真正威力，它不仅仅是一个配置管理工具。想象一下，通过 Ansible 和一些基础配置，就能创建你自己的多数据中心、多提供商基础设施。\n\n\
  Amazon、DigitalOcean、Rackspace 以及其他托管提供商都有它们自己的工具和独特的架构优势。然而，以一种与提供商的方式构建基础设施可以提供敏活性和弹性，让你能够将托管提供商视为大商品，并让你拥有构建更可靠、性能更高的应用程序基础设施的自由。\n\
  \n即使你计划将一切运行在一个托管提供商的网络内（或在私有云中，甚至在几台裸金属服务器上），Ansible 也提供了深层的堆栈特定集成，使你可以在 playbook\
  \ 中执行任何需要的操作并管理提供商的服务。\n\n## 使用 Ansible 进行 ELK 日志\n\n尽管应用程序、数据库和备份服务器可能是完善的基础设施中某些最关键的组件，但另一个同样重要的领域是良好的日志系统。\n\
  \n在过去，当一两台服务器就能处理整个网站或应用程序时，你可以使用内置的日志文件和 `rsyslog` 来排查故障或检查性能、错误或整体流量的趋势。对于典型的现代基础设施——如上面的示例，配有六台独立的服务器——为应用程序、服务器以及防火墙/认证日志找到更好的解决方案将获益丰厚。纯文本文件、`logrotate`\
  \ 和 `grep` 已经不再足够了。\n\n在各种现代日志和报告工具集中，“ELK”堆栈（Elasticsearch, Logstash 和 Kibana）脱颖而出，成为性能最好且最易配置的开源集中日志解决方案之一。\n\
  \n![Kibana 日志仪表板示例。](img/9-elk-kibana-example.png)\n\nKibana 日志仪表板示例。\n\n在我们的示例中，我们将配置单个\
  \ ELK 服务器来处理来自各种其他服务器的日志聚合、搜索和图形化显示，并提供一个配置示例来聚合常见的系统和 Web 服务器日志。\n\n### ELK Playbook\n\
  \n与我们之前的示例一样，我们将让 Ansible Galaxy 的几个角色来完成实际安装和配置 Elasticsearch、Logstash、Filebeat\
  \ 和 Kibana 的繁重工作。如果你对阅读执行这些工作的角色感兴趣，可以在下载它们后随意翻阅。\n\n在例句中，我将重点介绍重要部分，而不是详细介绍每个角色和变量。然后，我将展示如何使用这台基础服务器来聚合日志，以及如何使用\
  \ Filebeat 将其他服务器的日志文件指向中央服务器。\n\n这是我们的主 playbook，保存为 `provisioning/elk/main.yml`：\n\
  \n```\n 1 ---\n 2 - hosts: logs\n 3   gather_facts: yes\n 4 \n 5   vars_files:\n\
  \ 6     - vars/main.yml\n 7 \n 8   pre_tasks:\n 9     - name: Update apt cache if\
  \ needed.\n10       apt: update_cache=yes cache_valid_time=86400\n11 \n12   roles:\n\
  13     - geerlingguy.java\n14     - geerlingguy.nginx\n15     - geerlingguy.pip\n\
  16     - geerlingguy.elasticsearch\n17     - geerlingguy.elasticsearch-curator\n\
  18     - geerlingguy.kibana\n19     - geerlingguy.logstash\n20     - geerlingguy.filebeat\n\
  ```\n\n这假设你的清单中有一个 `logs` 组。它假设你通过以下 `requirements.yml` 通过 Galaxy 安装了所有这些角色：\n\n\
  ```\n 1 ---\n 2 roles:\n 3 - geerlingguy.java\n 4 - geerlingguy.nginx\n 5 - geerlingguy.pip\n\
  \ 6 - geerlingguy.elasticsearch\n 7 - geerlingguy.elasticsearch-curator\n 8 - geerlingguy.kibana\n\
  \ 9 - geerlingguy.logstash\n 10 - geerlingguy.filebeat\n```\n\n该 playbook 包含了位于\
  \ `provisioning/elk/vars/main.yml` 的 vars 文件，创建该文件并在其中放入内容：\n\n```\n 1 ---\n 2 java_packages:\n\
  \ 3   - openjdk-11-jdk\n 4 \n 5 nginx_user: www-data\n 6 nginx_remove_vhost: true\n\
  \ 7 nginx_vhosts:\n 8   - listen: \"80 default_server\"\n 9     server_name: logs.test\n\
  10     extra_parameters: |\n11       location / {\n12           include /etc/nginx/proxy_params;\n\
  13           proxy_pass          http://localhost:5601;\n14           proxy_set_header\
  \   Authorization \"\";\n15           proxy_read_timeout  90s;\n16       }\n17 \n\
  18 elasticsearch_curator_package: python3-pip\n 19 \n 20 logstash_ssl_key_file:\
  \ elk-example.p8\n 21 logstash_ssl_certificate_file: elk-example.crt\n 22 \n 23\
  \ filebeat_output_logstash_enabled: true\n 24 filebeat_output_logstash_hosts:\n\
  \ 25   - \"logs.test:5044\"\n 26 \n 27 filebeat_ssl_key_file: elk-example.p8\n 28\
  \ filebeat_ssl_certificate_file: elk-example.crt\n 29 filebeat_ssl_insecure: \"\
  true\"\n 30 \n 31 filebeat_inputs:\n 32   - type: log\n 33     paths:\n 34     \
  \  - /var/log/auth.log\n```\n\n\n\n\n\n最后一个变量 `filebeat_inputs` 提供了一列表 `Filebeat`\
  \ 将收集并流到 `Logstash` 的 `inputs` 列表。在这种情况下，只有一个输入，即 `auth.log` 文件，它记录了基于 Debian 的服务器上所有与身份相关的事件。\n\
  \n如果你想快速运行这台 ELK 服务器，可以像书中其他大多数示例那样，使用 `Vagrant` 创建一个本地虚拟机。在 `provisioning` 文件夹相同的目录中创建一个\
  \ `Vagrantfile`，内容如下：\n\n```\n 1 # -*- mode: ruby -*-\n 2 # vi: set ft=ruby :\n\
  \ 3 \n4 VAGRANTFILE_API_VERSION = \"2\"\n 5 \n6 Vagrant.configure(VAGRANTFILE_API_VERSION)\
  \ do |config|\n 7   config.vm.box = \"geerlingguy/ubuntu2004\"\n 8   config.vm.synced_folder\
  \ '.', '/vagrant', disabled: true\n 9   config.ssh.insert_key = false\n10 \n11 \
  \  config.vm.provider :virtualbox do |v|\n12     v.memory = 4096\n13     v.cpus\
  \ = 2\n14     v.customize [\"modifyvm\", :id, \"--natdnshostresolver1\", \"on\"\
  ]\n15     v.customize [\"modifyvm\", :id, \"--ioapic\", \"on\"]\n16   end\n17 \n\
  18   # ELK server.\n19   config.vm.define \"logs\" do |logs|\n20     logs.vm.hostname\
  \ = \"logs.test\"\n21     logs.vm.network :private_network, ip: \"192.168.56.90\"\
  \n22 \n23     logs.vm.provision :ansible do |ansible|\n24       ansible.playbook\
  \ = \"provisioning/elk/main.yml\"\n25       ansible.inventory_path = \"provisioning/elk/inventory\"\
  \n26       ansible.become = true\n27     end\n28   end\n29 \n30 end\n```\n\n此 `Vagrant`\
  \ 配置期望在 `provisioning/elk/inventory` 处有一个清单文件，因此请创建一个包含以下内容的文件：\n\n```\n1 [logs]\n\
  2 logs.test ansible_ssh_host=192.168.56.90 ansible_ssh_port=22\n```\n\n现在 `vagrant\
  \ up`。构建过程大约需要五分钟，完成后，如果你在 `/etc/hosts` 文件中添加类似 `logs.test 192.168.56.90` 的行，就可以在浏览器中访问\
  \ `http://logs.test/` 并看到 `Kibana` 的默认首页了：\n\n![Kibana 的默认首页。](img/9-elk-kibana-default.png)\n\
  \nKibana 的默认首页。\n\n在配置 `Kibana` 搜索 filebeat 索引后，你就可以开始探索日志数据了：\n\n1. 点击首页上的“Connect\
  \ to your Elasticsearch index”（连接到你的 Elasticsearch 索引）链接\n2. 输入如 `filebeat-*` 的索引模式（这将匹配所有\
  \ `Filebeat` 索引），并点击“Next”（下一步）\n3. 选择 `@timestamp` 作为 Time Filter（时间过滤器）名称，并点击“Create\
  \ index pattern”（创建索引模式）\n\n现在 `Kibana` 知道如何读取 filebeat 索引，你可以在“Discover”（发现）UI\
  \ 中发现并搜索日志数据，它是侧边栏顶部的链接：\n\n![探索来自 filebeat 的日志数据。](img/9-elk-kibana-dashboard.png)\n\
  \n探索来自 filebeat 的日志数据。我们不会深入探讨使用保存搜索和仪表板来自定义 `Kibana` 界面，因为有很多关于 `Kibana` 的指南，包括\
  \ [Kibana 官方指南](https://www.elastic.co/guide/kibana/current/build-dashboard.html)。\n\
  \n## 从其他服务器转发日志\n\n我们运行了 ELK 栈这太棒了。Elasticsearch 将存储并提供每天一个索引的日志数据，Logstash 将监听日志记录，`Filebeat`\
  \ 将 `/var/log/auth.log` 中的条目发送到 `Logstash`，而 `Kibana` 将将记录的数据组织成实用的可视化。\n\n使用 `Filebeat`\
  \ 配置额外的服务器将其日志重定向到我们新的 `Logstash` 服务器相当。我们将遵循的基本步骤是：\n\n1. 在 `Vagrantfile` 中设置另一台服务器。\n\
  2. 设置一个 `Ansible` 剧本，在服务器上与一起安装并配置 `Filebeat`。\n3. 启动服务器并观察日志如何转发到主 ELK 服务器。\n\n\
  让我们从创建一个新的 `Nginx` 服务器开始。出于各种原因，监控 Web 服务器日志是有用的，特别是观察流量峰值和资源非 200 响应的增加。在 `Vagrantfile`\
  \ 中，在 ELK 服务器定义的 `end` 之后添加以下服务器定义：\n\n```\n30   # Web server.\n31   config.vm.define\
  \ \"web\" do |web|\n32     web.vm.hostname = \"web.test\"\n33     web.vm.network\
  \ :private_network, ip: \"192.168.56.91\"\n34\n35     web.vm.provider :virtualbox\
  \ do |v|\n36       v.memory = 512\n37       v.cpus = 1\n38     end\n39\n40     web.vm.provision\
  \ :ansible do |ansible|\n41       ansible.playbook = \"provisioning/web/main.yml\"\
  \n42       ansible.inventory_path = \"provisioning/web/inventory\"\n43       ansible.become\
  \ = true\n44     end\n45 end\n```\n\n接下来我们将在 `provisioning/web/main.yml` 中设置剧本来安装并配置\
  \ `Nginx` 和 `Filebeat`：\n\n```\n1 ---\n2 - hosts: web\n3   gather_facts: yes\n4\
  \ \n5   vars_files:\n6     - vars/main.yml\n7 \n8   pre_tasks:\n9     - name: Update\
  \ apt cache if needed.\n10       apt: update_cache=yes cache_valid_time=86400\n\
  11 \n12   roles:\n13     - geerlingguy.nginx\n14     - geerlingguy.filebeat\n15\
  \ \n16   tasks:\n17     - name: Set up virtual host for testing.\n18       copy:\n\
  19         src: files/example.conf\n20         dest: /etc/nginx/sites-enabled/example.conf\n\
  21         owner: root\n22         group: root\n23         mode: 0644\n24      \
  \ notify: restart nginx\n25 \n26     - name: Ensure logs server is in hosts file.\n\
  27       lineinfile:\n28         dest: /etc/hosts\n29         regexp: '.*logs\\\
  .test$'\n30         line: \"192.168.56.90 logs.test\"\n31         state: present\n\
  ```\n\n此剧本运行 `geerlingguy.nginx` 和 `geerlingguy.filebeat` 角色，并在 `tasks` 中，有两个额外任务：一个用于在\
  \ `Nginx` 配置 (`example.conf`) 中配置服务器，另一个用于确保 Web 服务器知道 `logs.test` 服务器的正确 IP 地址。\n\
  \n在 `provisioning/web/files/example.conf` 路径创建 `Nginx` 配置文件，并为我们定义一个 `Nginx` 虚拟主机：\n\
  \n```\n1 server {\n2   listen 80 default_server;\n3 \n4   root /usr/share/nginx/www;\n\
  5   index index.html index.htm;\n6 \n7   access_log /var/log/nginx/access.log combined;\n\
  8   error_log /var/log/nginx/error.log debug;\n9 }\n```\n\n由于这是唯一的 `server` 定义，并且被设置为\
  \ 80 端口的 `default_server`，所有请求都将重定向到这里。我们将 `access_log` 路由到 `/var/log/nginx/access.log`，并告诉\
  \ `Nginx` 使用 `combined` 格式写入日志，这是我们的 `Logstash` 服务器期望的 `nginx` 日志格式。\n\n接下来，设置所需的变量告诉\
  \ `nginx` 和 `logstash-forwarder` 角色如何配置各自的服务。在 `provisioning/web/vars/main.yml`\
  \ 中：\n\n```\n1 ---\n2 nginx_user: www-data\n3 nginx_remove_default_vhost: true\n\
  4 \n5 filebeat_output_logstash_enabled: true\n6 filebeat_output_logstash_hosts:\n\
  7   - \"logs.test:5044\"\n8 \n9 filebeat_ssl_key_file: elk-example.p8\n10 filebeat_ssl_certificate_file:\
  \ elk-example.crt\n11 filebeat_ssl_insecure: \"true\"\n12 \n13 filebeat_inputs:\n\
  14   - type: log\n15     paths:\n16       - /var/log/auth.log\n17   - type: log\n\
  18     paths:\n19       - /var/log/nginx/access.log\n```\n\n`nginx` 变量删除了默认虚拟主机项，并确保\
  \ `Nginx` 在我们的 Ubuntu 服务器上运行良好。`filebeat` 变量告诉 filebeat 角色如何连接到中央 ELK 服务器，以及将哪些日志传递到\
  \ Logstash。\n\n\n\n\n\n```\n1 [web]\n2 web.test ansible_ssh_host=192.168.56.91 ansible_ssh_port=22\n\
  ```\n\n再次运行 `vagrant up`。Vagrant 应该验证第一台服务器 (`logs`) 正在运行，然后在新定义的 `web` Nginx 服务器上创建并运行\
  \ Ansible 准备程序。\n\n你可以在浏览器中加载 `http://192.168.56.91/` 或 `http://web.test/`，你应该会在页面上看到\
  \ `Welcome to nginx!` 消息。你可以刷新几次页面，然后切换回 `http://logs.test/` 来查看 ELK 服务器上的一些新日志条目：\n\
  \n![填充 Logstash Search Kibana 仪表板的条目](img/9-logstash-forwarding-nginx.png)\n\n填充\
  \ Logstash Search Kibana 仪表板的条目。\n\n通过 logstash 转发器记录几次请求并不令人兴奋。让我们使用随处可见的流行 `ab`\
  \ 工具为 Web 服务器施加一些负载。在一台普通的笔记本电脑上，运行下面的命令导致 Nginx 每秒提供约 1,200 次请求。\n\n```\nab -n\
  \ 20000 -c 50 http://web.test/\n```\n\n在负载测试期间，我将 Kibana 设置为仅显示过去 5 分钟的日志数据（每 5\
  \ 秒自动刷新一次），在 Nginx 提供服务后几秒钟，我就可以监控 ELK 服务器上的请求：\n\n![近实时监控涌入的 Nginx 请求](img/9-logstash-forwarding-ab-load.png)\n\
  \n近实时监控涌入的 Nginx 请求。\n\nFilebeat 使用了一种高效的类 TCP 协议 Lumberjack，在服务器之间安全地传输日志条目。通过恰当的调优和扩展，你可以跨基础设施高效处理并显示每秒数千次的请求！对于大多数人来说，即使是上面演示的简单示例也足以涵盖整个基础设施的日志记录和分析需求。\n\
  \n### 总结\n\n日志聚合和分析是两个不断改进和创新的领域。有很多 SaaS 产品和专有解决方案可以协助日志记录，但很少有方案能比 Elasticsearch、Logstash\
  \ 和 Kibana 的灵活性、安全性和总成本 (TCO)。\n\nAnsible 是配置 ELK 服务器并将你所有基础设施的相关日志数据直接引导到服务器的最简单方法。\n\
  \n## 使用 Ansible 配置 GlusterFS 分布式文件系统\n\n现代基础设施通常涉及某种程度的水平扩展；与其使用具有一个存储卷、一个数据库、一个应用程序实例的巨大服务器，大多数应用程序使用两个、四个、十个或几十台服务器。\n\
  \n![GlusterFS 是用于服务器的分布式文件系统](img/9-glusterfs-architecture.png)\n\nGlusterFS 是用于服务器的分布式文件系统。\n\
  \n许多应用程序可以轻松进行水平扩展。但当你需要共享资源（如文件、应用程序代码或其他临时数据）在所有服务器之间共享时，会发生什么？你如何以快速且可靠的方式让这些数据随基础设施进行扩展？跨服务器同步或分发文件有很多不同的方法：\n\
  \n*   在 `cron` 上或通过 `inotify` 设置 `rsync` 以定期同步较小文件集。\n*   将一切存储在代码仓库中（例如 `Git`、`SVN`\
  \ 等），并使用 `Ansible` 将文件部署到每台服务器。\n*   在文件服务器上创建一个大卷，并通过 `NFS` 或其他文件共享协议进行挂载。\n* \
  \  拥有一个挂载在每台服务器上的主 `SAN`。\n*   使用分布式文件系统，如 `Gluster`、`Lustre`、`Fraunhofer` 或 `Ceph`。\n\
  \n某些选项比其他更容易设置，而且它们都有优缺点。`Rsync`、`git` 或 `NFS` 提供了简单的初始设置，并且对文件系统性能的影响较低（在许多场景下）。但如果你需要更多的灵活性和扩展性、更少的网络开销和更大的容错能力，你必须考虑需要更多配置（例如分布式文件系统）和/或更多硬件（例如\
  \ `SAN`）。\n\nGlusterFS 根据 AGPL 许可证授权，拥有良好的文档和相当活跃的支持社区（特别是 `#gluster` IRC 通道）。但对于接触分布式文件系统的新手来说，第一次设置它可能会非常困难。\n\
  \n## 配置 Gluster - 概述\n\n为了在一个基础的双服务器设置上让 Gluster 运行（这样就可以在两台服务器之间同步并复制一个文件夹——允许一台服务器完全宕机，而另一台仍然可以访问文件），你需要执行以下操作：\n\
  \n1.  在每台服务器上安装 Gluster 服务器和客户端，并启动服务器守护进程。\n2.  （两台服务器上）创建一个 `brick` 目录（Gluster\
  \ 将在此处存储特定卷的文件）。\n3.  （两台服务器上）创建一个作为挂载点的目录（你将让 Gluster 在此处挂载共享卷的目录）。\n4.  （两台服务器上）使用\
  \ `gluster peer probe` 让 Gluster 连接到另一台服务器。\n5.  （在一台服务器上）使用 `gluster volume create`\
  \ 创建一个新的 Gluster 卷。\n6.  （在一台服务器上）使用 `gluster volume start` 启动新的 Gluster 卷。\n7.\
  \  （两台服务器上）挂载 gluster 卷（在 `/etc/fstab` 中添加记录以使挂载永久）。\n\n此外，你需要确保两台服务器上都开放了以下端口（以便\
  \ Gluster 通信）：TCP 端口 111。\n\n## 使用 Ansible 配置 Gluster\n\n为了演示之目的，我们将使用 `Vagrant`\
  \ 设置一个简单的双服务器基础设施，并在两者之间创建一个具有两个副本的共享卷。要在本地构建该双服务器基础设施，创建一个包含以下 `Vagrantfile` 的\
  \ `gluster` 文件夹：\n\n```ruby\n1 # -*- mode: ruby -*-\n2 # vi: set ft=\n3 4 Vagrant.configure(\"\
  2\") do |config|\n5   # Base OS 配置.\n6   config.box = \"geerlingguy/ubuntu2004\"\
  \n7   config.synced_folder '.', '/vagrant', disabled: true\n8   config.ssh.insert_key\
  \ = false\n9 \n10   config.vm.provider :virtualbox do |v|\n11     v.memory = 512\n\
  12     v.cpus = 1\n13   end\n14 \n15   # 定义带有静态 IP 地址的两个虚拟机\n16   boxes = [\n17\
  \     { :name => \"gluster1\", :ip => \"192.168.56.2\" },\n18     { :name => \"\
  gluster2\", :ip => \"192.168.56.3\" }\n19   ]\n20 \n21   # 准备每台虚拟机\n22   boxes.each\
  \ do |opts|\n23     config.vm.define opts[:name] do |config|\n24       config.vm.hostname\
  \ = opts[:name]\n25       config.vm.network :private_network, ip: opts[:ip]\n26\
  \ \n27       # 在最后一台虚拟机启动后使用 Ansible 准备两个虚拟机\n28       if opts[:name] == \"gluster2\"\
  \n29         config.vm.provision \"ansible\" do |ansible|\n30           ansible.playbook\
  \ = \"playbooks/provision.yml\"\n31           ansible.inventory_path = \"inventory\"\
  \n32           ansible.limit = \"all\"\n33         end\n34       end\n35     end\n\
  36   end\n37 end\n```\n\n此配置创建了 `gluster1` 和 `gluster2` 两台服务器，并在与 Vagrantfile 同目录下\
  \ `inventory` 文件定义的服务器上运行 `playbooks/provision.yml` 剧。\n\n创建 `inventory` 文件以帮助 Ansible\
  \ 连接到这两台服务器：\n\n```ini\n1 [gluster]\n2 192.168.56.2\n3 192.168.56.3\n4 \n5 [gluster:vars]\n\
  6 ansible_user=vagrant\n7 ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key\n\
  ```\n\n现在，在 `playbooks` 目录中创建一个名为 `provision.yml` 的剧本：\n\n\n\n\n\n```yaml\n 1 ---\n\
  \ 2 - hosts: gluster\n 3   become: yes\n 4 \n 5   vars_files:\n 6     - vars.yml\n\
  \ 7 \n 8   roles:\n 9     - geerlingguy.firewall\n10     - geerlingguy.glusterfs\n\
  11 \n12   tasks:\n13     - name: Ensure Gluster brick and mount directories exist.\n\
  14       file:\n15         path: \"{{ item }}\"\n16         state: directory\n17\
  \         mode: 0775\n18       with_items:\n19         - \"{{ gluster_brick_dir\
  \ }}\"\n20         - \"{{ gluster_mount_dir }}\"\n21 \n22     - name: Configure\
  \ Gluster volume.\n23       gluster_volume:\n24         state: present\n25     \
  \    name: \"{{ gluster_brick_name }}\"\n26         brick: \"{{ gluster_brick_dir\
  \ }}\"\n27         replicas: 2\n28         cluster: \"{{ groups.gluster | join(',')\
  \ }}\"\n29         host: \"{{ inventory_hostname }}\"\n30         force: yes\n31\
  \       run_once: true\n32 \n33     - name: Ensure Gluster volume is mounted.\n\
  34       mount:\n35         name: \"{{ gluster_mount_dir }}\"\n36         src: \"\
  {{ inventory_hostname }}:{{ gluster_brick_name }}\"\n37         fstype: glusterfs\n\
  38         opts: \"netdev\"\n39         state: mounted\n```\n\n此 playbook 使用两个角色来设置防火墙并安装\
  \ Gluster 所需软件包。你可以通过命令 `ansible-galaxy install geerlingguy.firewall geerlingguy.glusterfs`\
  \ 手动安装，或者将它们添加到 `requirements.yml` 文件并使用 `ansible-galaxy install -r requirements.yml`\
  \ 安装。\n\nGluster 需要一个“brick”目录作为虚拟文件系统，我们的服务器还需要一个挂载文件系统的目录，因此第一个 `file` 任务确保了这两个目录的存在（`gluster_brick_dir`\
  \ 和 `gluster_mount_dir`）。由于我们需要多次使用这些目录路径，我们使用了稍后在 `vars.yml` 中定义的变量。\n\nAnsible\
  \ 的 `gluster_volume` 模块（于 Ansible 1.9 添加）完成了探测节点、将 brick 设置为 Gluster 文件系统以及配置 brick\
  \ 复制的所有工作。`gluster_volume` 模块的一些重要参数包括：\n\n*   `state`：设置为 `present` 可确保 brick 存在。它会在首次创建时默认启动卷，但此行为可以通过\
  \ `start_on_create` 进行覆盖。\n*   `name` 和 `brick`：分别为 Gluster brick 提供名称和在服务器上的位置。在此示例中，brick\
  \ 将位于启动卷上，因此我们必须添加 `force: yes`，否则 Gluster 会报错 brick 不在独立卷。\n*   `replicas`：告诉 Gluster\
  \ 应该存在多少副本；此数量取决于 `cluster` 中有多少台服务器以及你对服务器故障的容忍度。我们不会深入讨论 GlusterFS 的性能和弹性，但大多数情况下设置为\
  \ `2` 或 `3`。\n*   `cluster`：定义包含分布式文件系统的主机。在这种情况下，Ansible 清清单中的所有 `gluster` 服务器都应该包含在内，因此我们使用\
  \ Jinja `join` 过滤器将所有地址合并为一个列表。\n*   `host`：显式设置节点探测的主机。如果不设置此项，根据你的网络配置，创建 brick\
  \ 时可能会报错。\n\n我们只需要为所有服务器运行一次 `gluster_volume` 模块，因此我们添加了 `run_once: true`。\n\nplaybook\
  \ 的最后一个任务使用 Ansible 的 `mount` 模块确保 Gluster 卷挂载到每台服务器的 `gluster_mount_dir` 中。\n\n\
  创建 playbook 后，我们需要定义其中使用的所有变量。在 `playbooks` 目录下创建一个 `vars.yml` 文件，并包含以下变量：\n\n```yaml\n\
  \ 1 ---\n 2 # 防火墙配置。\n 3 firewall_allowed_tcp_ports:\n 4   - 22\n 5   # 用于 Gluster。\n\
  \ 6   - 111\n 7   # Gluster 3.4+ 的 Port-mapper。\n 8   # - 2049\n 9   # Gluster 守护进程。\n\
  10   - 24007\n11   # Gluster <= 3.3 使用 24009+；Gluster 3.4+ 使用 49152+。\n12   - 24009\n\
  13   - 24010\n14   - 49152\n15   - 49153\n16   # Gluster 内置 NFS 服务器。\n17   - 38465\n\
  18   - 38466\n19 firewall_allowed_udp_ports:\n20   - 111\n21 \n22 # Gluster 配置。\n\
  23 gluster_mount_dir: /mnt/gluster\n24 gluster_brick_dir: /srv/gluster/brick\n25\
  \ gluster_brick_name: gluster\n```\n\n这些 `gluster_brick_dir` 和 `gluster_mount_dir`\
  \ 路径在 playbook 中被多次使用。在创建 playbook 后，我们需要定义其中使用的所有变量。在 `playbooks` 目录下创建一个 `vars.yml`\
  \ 文件，并包含以下变量：\n\n这些 `gluster_brick_dir` 和 `gluster_mount_dir` 路径在 playbook 中被多次使用。在创建\
  \ playbook 后，我们需要定义其中使用的所有变量。在 `playbooks` 目录下创建一个 `vars.yml` 文件，并包含以下变量：\n\nplaybook\
  \ 的最后一个任务使用 Ansible 的 `mount` 模块确保 Gluster 卷挂载到每台服务器的 `gluster_mount_dir` 中。\n\n\
  ### 使用 Ansible 和 Homebrew 进行 Mac 配置\n\n下一个示例将针对 Mac，但其背后的原理通用。你有多少次想对你的日常工作站或个人电脑按下“重置”键？在你的工作中，你花了多少时间自动化应用程序和基础设施的配置与测试，而在你自己身上花了多少时间来自动化你*自己的*本地环境？\n\
  \n在过去的几年里，当我更换四台 Mac（其中一台个人的，三台公司提供的）时，我决定每台新 Mac 都从零开始（而不是通过 Apple 的迁移助理将旧 Mac\
  \ 的所有杂物传输到新 Mac）。但我面临一个问题：每台 Mac 至少要花费 4-6 小时来下载、安装和配置所有内容。\n\n\n\n\n为了让这种混乱恢复秩序，我将所有可能的配置整合到一组\
  \ [dotfiles](https://github.com/geerlingguy/dotfiles) 中，并使用 git 将这些 dotfiles 同到我的所有工作站。\n\
  \n然而，即使有了 [Homebrew](http://brew.sh/)（一个优秀的 macOS 软件包管理器）的帮助，在安装和配置我喜爱的应用程序和命令行工具时，仍然涉及大量的手动工作。\n\
  \n### 在本地运行 Ansible playbooks\n\n我们之前在通过本地工作站为云端配置虚拟机时，看到过使用 `connection: local`\
  \ 运行 playbook 的示例。但实际上，你可以使用本地连接执行*任何* Ansible 任务。这就是我们将如何使用 Ansible 配置本地工作站的方式。\n\
  \n我通常通过先添加基础骨架开始构建 playbook，然后随着进度不断填充细节。你可以通过创建 `main.yml` playbook 来跟进这一操作：\n\n\
  ```yaml\n 1 ---\n 2 - hosts: localhost\n 3   user: jgeerling\n 4   connection: local\n\
  \ 5 \n6   vars_files:\n 7     - vars/main.yml\n 8 \n 9   roles: []\n10 \n11   tasks:\
  \ []\n```\n\n我们将需要的任何变量存储在包含的 `vars/main.yml` 文件中。`user` 被设置为我的本地用户账户（在此情况下为 `jgeerling`），因此文件权限是为我的账户设置的，任务将在我自己的账户下运行，以最大限度地减少意外。\n\
  \n### 自动化 Homebrew 软件包和应用管理\n\n由于我使用 Homebrew（被称为“macOS 缺失的软件包管理器”）来完成大部分应用程序的安装和配置，我创建了\
  \ `geerlingguy.homebrew` 角色，它会首先安装 Homebrew，然后安装我在几个简单变量中配置的所有应用程序和软件包。\n\n下一步是添加\
  \ Homebrew 角色并配置所需的变量。在 `main.yml` 内部，更新 `roles` 部分：\n\n```yaml\n 9   roles:\n10\
  \     - geerlingguy.homebrew\n```\n\n然后将以下内容添加到 `vars/main.yml` 中：\n\n```yaml\n\
  \ 1 ---\n 2 homebrew_installed_packages:\n 3   - sqlite\n 4   - mysql\n 5   - php\n\
  \ 6   - python\n 7   - ssh-id\n 8   - cowsay\n 9   - pv\n10   - wget\n11   - homebrew\n\
  \ 12 \n13   homebrew_taps:\n14   - homebrew/core\n15   - homebrew/cask\n 16 \n17\
  \   homebrew_dir: /Applications\n18   apps:\n19   - docker\n20   - google-chrome\n\
  21   - sequel\n22   - slack\n```\n\n\n\n对于更复杂的应用程序，可能会进行全蓝绿部署（Blue-Green deployment），即在当前生产基础设施旁边构建一整套全新的基础设施，在新设施上运行测试，然后自动切换到新实例。这对于许多应用程序来说可能有些过度设计（特别是如果可以接受低于\
  \ 100%的可用性），但这种做法正变得越来越常见——而且 Ansible 可以自动完成整个过程。\n\n在本章中，我们将涵盖以下部署策略：\n\n1. 单服务器部署。\n\
  2. 零停机多服务器部署。\n3. Capistrano 风格和蓝绿部署。\n\n这些是最常用的三种部署技术，涵盖了许多常见的用例。还有其他方法可以加强你的部署流程，通常涉及应用层面和组织层面的变更，但那些部署方面超出了本书的范围。\n\
  \n### 简单的单服务器部署\n\n绝大多数小型应用程序和网站都可以轻松地在单个虚拟机或专用服务器上运行。使用 Ansible 在服务器上进行配置和管理是轻而易举的。即使你只需要管理`one`\
  \ 台服务器，最好也将所有设置封装起来，以免最终得到一个“雪花板服务器（snowflake server）”。\n\n在本例中，我们正在管理一个 Ruby on\
  \ Rails 站点，该站点允许用户对文章（带有标题和正文的数据库记录）进行 CRUD 操作。\n\n该应用程序的代码仓库位于 GitHub 上的 [demo-rails-app\
  \ 仓库](https://github.com/geerlingguy/demo-rails-app)。\n\n首先使用以下 `Vagrantfile` 创建一个新的\
  \ Vagrant 虚拟机进行本地测试：\n\n```\n 1 # -*- mode: ruby -*-\n 2 # vi: set ft=ruby :\n 3\
  \ \n4 Vagrant.configure(2) do |config|\n 5   config.vm.box = \"geerlingguy/ubuntu2004\"\
  \n 6   config.vm.synced_folder '.', '/vagrant', disabled: true\n 7   config.ssh.insert_key\
  \ = false\n 8 \n 9   config.vm.provider \"virtualbox\" do |v|\n10     v.name = \"\
  rails-demo\"\n11     v.memory = 1024\n12     v.cpus = 2\n13   end\n14 \n15   config.vm.hostname\
  \ = \"rails-demo\"\n16   config.vm.network :private_network, ip: \"192.168.56.7\"\
  \n17 \n18   config.vm.provision \"ansible\" do |ansible|\n19     ansible.playbook\
  \ = \"playbooks/main.yml\"\n20     ansible.become = true\n21   end\n22 \n23 end\n\
  ```\n\n在这种情况下，我们在 IP 地址 `192.168.56.7` 有一个虚拟机。在配置时，它将在虚拟机上运行在 `playbooks/main.yml`\
  \ 中 Ansible playbook。\n\n### 配置 Ruby on Rails 服务器\n\n为部署应用程序做准备，我们需要执行以下操作：\n\n\
  1. 安装 `git`（我们的应用程序在 `git` 仓库中进行控制）。\n2. 安装 `Node.js`（资源编译需要它的 JavaScript 环境）。\n\
  3. 安装 `Ruby`（我们的应用程序需要 `2.6.0` 或更高版本）。\n4. 安装带有 `Nginx` 的 `Passenger`（我们需要一个快速的\
  \ Web 服务器来运行 rails 应用程序）。\n5. 安装任何其他依赖项，并为部署准备服务器。\n\n让我们在一个新文件 `playbooks/provision.yml`\
  \ 中创建一个专门用于配置任务的新 playbook（我们稍后会考虑部署）：\n\n```\n 1 ---\n 2 - hosts: all\n 3   become:\
  \ yes\n 4 \n5   vars_files:\n 6     - vars.yml\n 7 \n8   roles:\n 9     - geerlingguy.git\n\
  10     - geerlingguy.nodejs\n11     - geerlingguy.ruby\n12     - geerlingguy.passenger\n\
  13 \n14   tasks:\n15     - name: Install app dependencies.\n16       apt:\n17  \
  \       name:\n18           - libsqlite3-dev\n19           - libreadline-dev\n20\
  \           - tzdata\n21         state: present\n22 \n23     - name: Ensure app\
  \ directory exists and is writeable.\n24       file:\n25         path: \"{{ app_directory\
  \ }}\"\n26         state: directory\n27         owner: \"{{ app_user }}\"\n28  \
  \       group: \"{{ app_user }}\"\n29         mode: 0755\n```\n\n这是一个非常直接的 playbook。我们需要定义一些变量，以确保\
  \ `geerlingguy.ruby` 角色安装正确版本的 `Ruby`（至少是 `2.6.0`），并且 `geerlingguy.passenger` 角色配置为正确服务我们的应用程序。\n\
  \n我们还需要其他几个变量，比如 `app_directory` 和 `app_user`，所以让我们现在创建变量文件，位于 `playbooks/vars.yml`：\n\
  \n```\n 1 # Variables for our app.\n 2 app_directory: /opt/demo-rails-app\n 3 app_user:\
  \ www-data\n 4 \n5 # Variables for Passenger and Nginx.\n 6 passenger_server_name:\
  \ 0.0.0.0\n 7 passenger_app_root: /opt/demo-rails-app\n 8 passenger_env: production\n\
  \ 9 ruby: /usr/local/bin/ruby\n10 \n11 # Variables for Ruby installation.\n12 ruby_install_from_source:\
  \ true\n13 ruby_download_url: https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.6.tar.gz\n\
  14 15 ruby_version: 2.7.6\n```\n\n`passenger` 变量告诉 `Passenger` 运行在每个接口上，并使用 `ruby`\
  \ 二进制文件以 `production` 设置启动我们的程序（该程序将位于 `/opt/demo-rails-app/public`）。\n\n`ruby`\
  \ 变量告诉 `ruby` 角色从源码安装 `2.6.0`，因为 Ubuntu 标准仓库提供的包只包含旧版本。\n\n`Vagrantfile` 和 `playbooks/main.yml`\
  \ 中的 playbook 尚不存在。让我们创建该 playbook 并包含上面的 `provision.yml` playbook，以便我们的服务器能够成功完成配置。我们将部署步骤分到另一个\
  \ playbook 中单独包含它。在 `playbooks/main.yml` 内部：\n\n```\n1 ---\n2 - import_playbook:\
  \ provision.yml\n```\n\n### 向服务器部署 Rails 应用\n\n所有的依赖项已经在 `provision.yml` 中配置好了，所以我们现在准备构建一个执行所有部署任务的\
  \ playbook。\n\n在 `main.yml` 文件中添加一行以包含新的 `deploy.yml` playbook：\n\n```\n1 ---\n\
  2 - import_playbook: provision.yml\n3 - import_playbook: deploy.yml\n```\n\n现在我们准备好创建\
  \ `deploy.yml` playbook，它将执行以下操作：\n\n1. 使用 `git` 检出 Rails 应用程序的最新发布版本。\n2. 复制运行程序所需的安全数据\
  \ `secrets.yml` 模板。\n3. 确保安装了应用程序所需 gem（通过 `Bundler`）。\n4. 创建数据库（如果它不存在）。\n5. 运行\
  \ `rake` 任务以确保数据库架构是最新的，并编译了所有资源（如 JS 和 CSS）。\n6. 确保应用程序文件的所有权设置正确，以便 `Passenger`\
  \ 和 `Nginx` 能够无错误服务它们。\n7. 如果有任何更改或更新，重启 `Passenger` 和 `Nginx`。\n\n这些任务大部分将使用 Ansible\
  \ 的模块，但对于某些任务，我们将直接将正常的部署命令封装在 `command` 中，因为没有现成的模块来帮我们处理它们：\n\n\n\n\n```yaml\n\
  ---\n- hosts: all\n  become: yes\n\n  vars_files:\n    - vars.yml\n\n  roles:\n\
  \    - geerlingguy.passenger\n\n  tasks:\n    - name: Ensure demo application is\
  \ at correct release.\n      git:\n        repo: https://github.com/geerlingguy/demo-rails-app.git\n\
  \        version: \"{{ app_version }}\"\n        dest: \"{{ app_directory }}\"\n\
  \        accept_hostkey: true\n        force: true\n      register: app_updated\n\
  \      notify: restart nginx\n      become: true\n      become_user: \"{{ app_user\
  \ }}\"\n\n    - name: Ensure secrets file is present.\n      template:\n       \
  \ src: templates/secrets.yml.j2\n        dest: \"{{ app_directory }}/config/secrets.yml\"\
  \n        owner: \"{{ app_user }}\"\n        group: \"{{ app_user }}\"\n       \
  \ mode: 0664\n      notify: restart nginx\n\n    - name: Install required dependencies\
  \ with bundler.\n      command: \"bundle install --path vendor/bundle \\\n     \
  \ chdir={{ app_directory }}\"\n      when: app_updated.changed == true\n      notify:\
  \ restart nginx\n\n    - name: Check if database exists.\n      stat: \"path={{\
  \ app_directory }}/db/{{ app_environment.RAILS_ENV }}.sqlite3\"\n      register:\
  \ app_db_exists\n\n    - name: Create database.\n      command: \"bundle exec rake\
  \ db:create chdir={{ app_directory }}\"\n      when: app_db_exists.stat.exists ==\
  \ false\n      notify: restart nginx\n\n    - name: Perform deployment-related rake\
  \ tasks.\n      command: \"{{ item }} chdir={{ app_directory }}\"\n      with_items:\n\
  \        - bundle exec rake db:migrate\n        - bundle exec rake assets:precompile\n\
  \      environment: \"{{ app_environment }}\"\n      when: app_updated.changed ==\
  \ true\n      notify: restart nginx\n\n    - name: Ensure demo application has correct\
  \ user for files.\n      file:\n        path: \"{{ app_directory }}\"\n        state:\
  \ directory\n        owner: \"{{ app_user }}\"\n        group: \"{{ app_user }}\"\
  \n        recurse: yes\n      notify: restart nginx\n```\n\n你首先注意到的点（除了我们再次包含了 `vars.yml`\
  \ 文件之外，因为我们在此 playbook 中也需要那些变量）是我们在此 playbook 中添加了 `geerlingguy.passenger` 角色。由于我们将使用该角色中定义的处理器之一（`restart\
  \ nginx`），因此我们需要显式地包含该角色。我们本为此 playbook 添加一个独立的处理器，但使用角色的处理器通常会让维护变得更简单。\n\n让我们逐一查看任务：\n\
  \n1. **(第 12-22 行)** 我们通过将版本 `app_version` 检出 `git` 仓库到 `app_directory` 目录，将所有应用程序文件放置就位。我们将\
  \ `accept_hostkey` 设置为 `true`，这样该任务在初次部署应用时就不会挂起（因为我们还没有接受 Git 服务器的主机密钥）。我们还 `become`\
  \ 为 `app_user`，以便目录拥有正确的所有者和文件权限。\n\n2. **(第 24-31 行)** 我们将 `secrets.yml` 文件复制到应用程序配置目录。部署应用密钥有多种方法，但这种最简单，并且允许我们如果需要，可以将应用密钥存储在受\
  \ Ansible Vault 保护的变量文件中。\n\n3. **(第 33-36 行)** 如果 `app_updated` 变量显示第一个 `git` 任务发生了变化，我们将运行\
  \ bundler 命令以确保所有最新的依赖包都已安装在 `vendor/bundle` 目录。\n\n4. **(第 38-45 行)** 如果数据库不存在，则使用\
  \ `rake db:create` 创建应用程序数据库。由于此应用程序使用 SQLite 数据库，只需检查 `.sqlite3` 文件是否存在，如果没有，则运行\
  \ `db:create` 任务。\n\n5. **(第 47-54 行)** 如果 `app_updated` 变量显示第一个 `git` 任务发生了变化，我们还将运行几个\
  \ `rake` 任务以确保数据库架构是最新的，并且所有资源（如脚本和样式表）都已编译。\n\n6. **(第 56-63 行)** 确保所有应用文件具有正确的权限，以便\
  \ Passenger/Nginx 正确提供服务。\n\n由于许多任务都会导致可能更改应用程序行为的文件系统更改，它们都会通知运行由 `geerlingguy.passenger`\
  \ 角色提供的 `restart nginx` 处理器，以便 Passenger 重新加载配置并重启应用。\n\n我们需要向 `vars.yml` 添加几个新变量，我们还需要添加任务中提到的将其复制到位置的\
  \ `secrets.yml.j2` 模板。\n\n首先，将在 `playbooks/templates/secrets.yml.j2` 中创建 secrets\
  \ 文件：\n\n```yaml\ndevelopment:\n  secret_key_base: {{ app_secrets.dev }}\n\ntest:\n\
  \  secret_key_base: {{ app_secrets.test }}\n\nproduction:\n  secret_key_base: {{\
  \ app_secrets.prod }}\n```\n\n我们将使用字典变量 `app_secrets`，因此将其以及所有其他新变量添加到 `playbooks/vars.yml`\
  \ 中：\n\n```yaml\n---\n# 应用程序的变量\napp_version: 2.0.1\napp_directory: /opt/demo-rails-app\n\
  app_user: www-data\napp_secrets:\n  dev: fe562ec1e21eecc5af4d83f6a157a7\n  test:\
  \ 4408f36dd290766d2f368fdfcedf4d\n  prod: 9bf801da1a24c9a103ea86a1438caa\napp_environment:\n\
  \  RAILS_ENV: production\n\n# Passenger 和 Nginx 的变量\npassenger_server_name: 0.0.0.0\n\
  passenger_app_root: /opt/demo-rails-app/public\npassenger_app_env: production\n\
  passenger_ruby: /usr/local/bin/ruby\n\n# Ruby 安装的变量\nruby_install_from_source: true\n\
  ruby_download_url: https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.6.tar.gz\n\
  ruby_version: 2.7.6\n```\n\n注意为支持我们的 `deploy.yml` playbook 添加了以下变量：\n\n* `app_version`:\
  \ 这是要部署到服务器的 git 标签、分支或提交哈希。\n* `app_secrets`: Rails 应用程序密钥的字典，用于验证签名应用 cookie 的完整性。你可以使用\
  \ `rake secret` 为这些变量生成新的、唯一的字符串。\n* `app_environment`: 某些命令（如 `bundle exec` 和 `rake`）以正确的\
  \ Rails 应用程序环境运行所需的环境设置。\n\n## 准备和部署 Rails 应用程序\n\n现在我们已经完成了 `provision.yml` 和 `deploy.yml`\
  \ playbook，并且它们都已 `include` 在 Vagrant 将运行的 `main.yml` playbook 中，现在是使用 Vagrant 启动新的虚拟机并查看我们的应用程序是否工作正常了！\n\
  \n你的项目文件夹结构应该是这样的：\n\n```\ndeployments/\n  playbooks/\n    templates/\n      secrets.yml.j2\n\
  \    deploy.yml\n    main.yml\n    provision.yml\n    vars.yml\n  Vagrantfile\n\
  ```\n\n在运行 playbook 之前，我们需要确保所有的角色依赖项都存在。如果你是从零开始构建一切，你可能会有一个包含所有角色的 `roles` 目录，但在这种情况下，由于我们使用了来自\
  \ Ansible Galaxy 的角色，最好不要将角色文件直接包含在 playbook 中，而是向项目添加一个 `requirements.yml` 文件并使用\
  \ Galaxy 自动安装这些角色。\n\n在 `requirements.yml` 内部：\n\n```yaml\n---\nroles:\n  - name:\
  \ geerlingguy.git\n  - name: geerlingguy.ruby\n  - name: geerlingguy.nodejs\n  -\
  \ name: geerlingguy.passenger\n```\n\n在与 requirements 文件相同的目录下，运行命令 `ansible-galaxy\
  \ install -r requirements.yml`，一分钟后，所有需要的角色将被下载到你的默认 Ansible 角色目录（如果它们尚不存在的话）。\n\
  \n返回包含 `Vagrantfile` 的主目录，并运行 `vagrant up`。假设一切运行正常，你应该在几分钟后看到 playbook 成功完成：\n\n\
  ```\nTASK [Ensure demo application has correct user for files.] **********\nchanged:\
  \ [default]\n\nRUNNING HANDLER [geerlingguy.passenger : restart nginx] *************\n\
  changed: [default]\n\nPLAY RECAP *****************************************************************\n\
  default              : ok=55   changed=31   unreachable=0    failed=0\n```\n\n\n\
  \n现在，切换到浏览器并加载 `http://192.168.56.7/`。你应该能看到下面的内容：\n\n![演示 Rails 应用成功运行中。](img/10-rails-app-fresh.png)\n\
  \n演示 Rails 应用成功运行中。\n\n尝试创建、更新和删除几篇文章，以确保数据库和所有应用功能均正常工作：\n\n![一个对文章执行 CRUD 操作的\
  \ Rails 应用。](img/10-rails-app-with-articles.png)\n\n一个对文章执行 CRUD 操作的 Rails 应用。\n\
  \n该应用看起来运行得非常完美，但还有改进空间。在进行更多的开发工作后，我们有了一个新版本要部署。我们可以更新 `vars.yml` 中的 `app_version`\
  \ 变量并运行 `vagrant provision` 来重新运行整个配置和部署剧本，但为了节省时间并使用我们灵活的剧 book 布局（将配置和部署剧本分开），我们可以单独运行\
  \ `deploy.yml` 剧本。\n\n## 部署应用更新\n\n首先，为了在不进行配置的情况下测试部署，我们需要创建一个清单文件，告诉 Ansible 如何直接连接到\
  \ Vagrant 管理的虚拟机。\n\n创建文件 `playbooks/inventory-ansible`，其内容如下：\n\n```\n1 [rails]\n\
  2 192.168.56.7\n3 \n4 [rails:vars]\n5 ansible_user=vagrant\n6 ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key\n\
  ```\n\n在 `playbooks` 目录下运行以下命令，测试运行 `deploy.yml` 剧本的能力：\n\n```\n$ ansible-playbook\
  \ deploy.yml -i inventory-ansible\n```\n\n希望剧本已成功运行完成。它可能会报告在“Ensure demo application\
  \ has correct user for files”任务中发生了变动，如果是这样的话，它将重新重启 Passenger。再次运行它，ansible 应该报告没有变更改：\n\
  \n```\nPLAY RECAP **********************************************************\n192.168.56.7\
  \         : ok=18   changed=0    unreachable=0    failed=0\n```\n\n希望你已经注意到，单独运行\
  \ `deploy.yml` 剧本比一起运行 `provision` 和 `deploy` 剧本要快得多（部署仅需 18 个任务，而两个剧本加起来有 80 多个任务！）。将来，我们可以仅使用\
  \ `deploy.yml` 剧本部署应用更新，并在 `vars.yml` 中更改 `app_version`，或者在 `ansible-playbook` 命令的命令行中指定版本。\n\
  \n我们的应用程序是一个相当通用的 Web 应用，更新涉及应用代码（需要重新加载 Web 服务器）、样式（需要重新编译）以及可能的数据库架构（需要运行 `rake`\
  \ migrate 任务）。每当 `playbooks/vars.yml` 内部 `app_version` 更改时，部署剧本将自动运行所有所需任务，以我们的最新代码运行我们的应用。\n\
  \n将 `app_version` 更新为 `2.1.0`，然后再次运行以下命令：\n\n```\n$ ansible-playbook deploy.yml\
  \ -i inventory-ansible\n```\n\n大约一分钟后，部署应该完成。一旦完成，你将看到新改进版本的演示 Ruby on Rails 应用程序：\n\
  \n![Rails 应用 - 版本 2.1.0，带有华丽的页头。](img/10-rails-app-new-version.png)\n\nRails 应用\
  \ - 版本 2.1.0，带有华丽的页头。\n\n应用更新部署涉及将 `app_version` 到最新的 git tag，然后再次运行 `deploy.yml`\
  \ 剧本。可以运行 `main.yml` 剧本以确保整个服务器栈处于正确状态，但仅部署应用更新会更快。\n\n## 零停机多服务器部署\n\n如果你需要在多个服务器上运行应用以实现水平扩展或冗余，部署可能会变得繁琐，导致停机和复杂的部署流程——但使用\
  \ Ansible 就不会了！\n\n[Server Check.in](https://servercheck.in/) 是一个基于微服务架构服务器和网站监控服务，我运行了十多年；它包含一个网站、一个\
  \ API 应用和一个服务器检查应用程序。\n\n检查应用程序必须运行在由不同供应商托管在全球各服务器上，以提供冗余和可靠性。Server Check.in 使用\
  \ Ansible 管理该应用的 `滚动部署`，因此新代码可以在几分钟内部署到所有服务器，同时保持 100% 的可用性！\n\n我们将通过向一组虚拟机部署并更新小型\
  \ Node.js 应用，模拟 Server Check.in 的基础设施部分（检查服务器应用程序）。该应用的代码库位于 GitHub 上的 [demo-nodejs-api\
  \ 仓库](https://github.com/geerlingguy/demo-nodejs-api)。这是我们将构建的基础设施图：\n\n![连接到互联网的四台服务器。](img/10-multi-server-deployment-cloud.png)\n\
  \n连接到互联网的四台服务器。\n\n开始，使用以下 Vagrantfile 创建四个轻量级 Vagrant 虚拟机：\n\n```\n 1 # -*- mode:\
  \ ruby -*-\n 2 # vi: set ft=ruby :\n 3 \n 4 Vagrant.configure(\"2\") do |config|\n\
  \ 5   # Base VM OS 配置.\n 6   config.vm.box = \"geerlingguy/ubuntu2004\"\n 7   config.vm.synced_folder\
  \ '.', '/vagrant', disabled: true\n 8 \n 9   config.vm.provider \"virtualbox\" do\
  \ |v|\n 10    v.memory = 512\n 11    v.cpus = 1\n 12  end\n 13 \n 14  # 定义静态 IP\
  \ addresses.\n 15  boxes = [\n 16    {name: \"nodejs1\", ip: \"192.168.56.2\" },\n\
  \ 17    {name: \"nodejs2\", ip: \"192.168.56.3\" },\n 18    {name: \"nodejs3\",\
  \ ip: \"192.168.56.4\" },\n 19    {name: \"nodejs4\", ip: \"192.168.56.5\" }\n 20\
  \  ]\n 21 \n 22  boxes.each do |opts|\n 23    config.vm.define opts[:name] do |node|\n\
  \ 24      node.hostname = opts[:name]\n 25      node.vm.network \"private_network\"\
  , ip: opts[:ip]\n 26 \n 27      # 在最后一个 VM 启动后使用 Ansible.\n 28      if opts[:name]\
  \ == \"nodejs4\"\n 29        node.vm.provision \"ansible\" do |ansible|\n 30   \
  \       ansible.playbook = \"playbooks/main.yml\"\n 31          ansible.inventory\
  \ = \"inventory\"\n 32          ansible.limit = \"all\"\n 33        end\n 34   \
  \   end\n 35    end\n 36  end\n 37 end\n```\n\n上面的 `Vagrantfile` 定义了四个具有 512MB 内存、唯一主机名和\
  \ IP 地址的虚拟机（通过 `boxes` 变量定义）。\n\n在剧本配置部分，我们告诉 Vagrant 使用 `inventory` 文件和 `playbooks/main.yml`\
  \ 剧本运行 Ansible。在与 `Vagrantfile` 相同的文件夹创建这些文件：\n\n```\ndeployments-rolling/\n  playbooks/\n\
  \    main.yml\n  inventory\n  Vagrantfile\n```\n\n在 `inventory` 文件中，我们只需要定义所有 Node.js\
  \ VM 的 IP 地址：\n\n```1 [nodejs-api]\n2 192.168.56.2\n3 192.168.56.3\n4 192.168.56.4\n\
  5 192.168.56.5\n6 \n7 [nodejs-api:vars]\n8 ansible_user=vagrant\n9 ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key\n\
  ```\n\n在 `main.yml` 剧本中，我们将调用多个剧本——一个用于初始配置（安装 Node.js 并确保服务器配置正确），另一个用于部署（确保我们的\
  \ Node.js API 应用存在并运行）：\n\n```\n1 ---\n2 - import_playbook: provision.yml\n3 - import_playbook:\
  \ deploy.yml\n```\n\n去创建 `provision.yml` 和 `deploy.yml` 剧本，从 `provision.yml` 开始：\n\
  \n```\n 1 ---\n 2 - hosts: nodejs-api\n 3   become: yes\n 4 \n 5   vars:\n 6   \
  \  nodejs_install_npm_user: root\n 7     npm_config_prefix: \"/usr\"\n 8     nodejs_npm_global_packages:\n\
  \ 9       - forever\n 10     firewall_allowed_tcp_ports:\n 11       - \"22\"\n 12\
  \       - \"8080\"\n 13 \n 14   pre_tasks:\n 15     - name: Update apt cache if\
  \ needed.\n 16       apt: update_cache=yes cache_valid_time=3600\n 17 \n 18   roles:\n\
  \ 19     - geerlingguy.firewall\n 20     - geerlingguy.nodejs\n 21     - geerlingguy.git\n\
  ```\n\n\n\n\n此剧本（playbook）运行在清单文件中定义的所有服务器上，并在这些服务器上运行三个角色：`geerlingguy.firewall`（安装并配置防火墙，在此例中为\
  \ SSH 打开端口 22，并为我们的应用打开端口 8080）、`geerlingguy.nodejs`（安装 Node.js、NPM 以及 `forever`\
  \ 包（全局安装），我们将用它作为守护进程运行我们的应用），以及 `geerlingguy.git`（安装 `git`，用于应用部署）。\n\n由于我们使用了\
  \ Ansible Galaxy 中的两个角色，最佳实践是将这些角色也包含在需求文件中，以便 CI 工具和其他使用此剧本的工具可以安装所有需要的角色。\n\n\
  ### 需求文件 (Requirements File)\n\n在根目录中创建一个 `requirements.yml` 文件并添加以下内容：\n\n```\n\
  1 ---\n2 roles:\n3   - name: geerlingguy.firewall\n4   - name: geerlingguy.nodejs\n\
  5   - name: geerlingguy.git\n```\n\n当有人想要运行此剧本时，执行命令 `ansible-galaxy install -r\
  \ requirements.yml` 将安装所有需要的角色。\n\n### 项目结构 (Project Structure)\n\n此时，你的项目目录结构应该如下：\n\
  \n```\ndeployments-rolling/\n  playbooks/\n    deploy.yml\n    main.yml\n    provision.yml\n\
  \  inventory\n  requirements.yml\n  Vagrantfile\n```\n\n在我们运行 `vagrant up` 并查看基础设施的运行情况之前，我们需要构建\
  \ `deploy.yml` 剧本，这将确保我们的应用在所有服务器上存在并正确运行。\n\n### 配置 deploy.yml\n\n在 `deploy.yml`\
  \ 内部，添加以下内容：\n\n```\n1 ---\n2 - hosts: nodejs-api\n3   gather_facts: no\n4   become:\
  \ yes\n5 \n6   vars_files:\n7     - vars.yml\n```\n\n使用 `become`并将 `gather_facts`\
  \ 设置为 `no` 以在部署期间节省一些时间，因为我们的应用运行不需要任何收集到的系统事实。\n\n由于我们有几个变量需要定义，并且我们希望单独跟踪它们以便于文件修订历史，我们将在与\
  \ `deploy.yml` 剧本相同目录下的 `vars.yml` 文件中定义变量：\n\n```\n1 ---\n2 app_repository: https://github.com/geerlingguy/demo-nodejs-api.git\n\
  3 app_version: \"2.0.0\"\n4 app_directory: /opt/demo-nodejs-api\n```\n\n保存 `vars.yml`\
  \ 文件后，继续构建 `deploy.yml`，从克隆应用仓库的任务开始（我们刚刚在 `vars.yml` 中定义了它）：\n\n```\n 9   tasks:\n\
  10     - name: Ensure Node.js API app is present.\n11       git:\n12         repo:\
  \ \"{{ app_repository }}\"\n13         version: \"{{ app_version }}\"\n14      \
  \   dest: \"{{ app_directory }}\"\n15         accept_hostkey: true\n16       register:\
  \ app_updated\n17       notify: restart forever apps\n```\n\n为 `git` 模块的 `repo`\
  \ 和 `version` 使用变量提供了灵活性；应用版本的更改可能会频繁发生，在单独的 `vars.yml` 文件中管理它们更容易。\n\n我们还希望在代码库更改时\
  \ `notify` 一个 `restart forever apps` 处理器（handler）。我们稍后将在剧本中定义 `restart forever apps`\
  \ 处理器。\n\n```\n18     - name: Stop all running instances of the app.\n19       command:\
  \ \"forever stopall\"\n20       when: app_updated.changed\n21 \n22     - name: Ensure\
  \ Node.js API app dependencies are present.\n23       npm: \"path={{ app_directory\
  \ }}\"\n24       when: app_updated.changed\n25 \n26     - name: Run Node.js API\
  \ app tests.\n27       command: \"npm test chdir={{ app_directory }}\"\n28     \
  \  when: app_updated.changed\n```\n\n一旦应用出现在服务器上，我们需要使用 `npm` 安装依赖（使用 Ansible 的\
  \ `npm` 模块），然后使用 `npm test` 运行应用测试套件。为了节省时间，只有当应用发生更改时（使用我们在检应用代码时注册的 `app_updated`\
  \ 变量），我们才停止应用、更新依赖并运行测试。\n\n在每次部署期间运行应用测试可以确保应用存在并处于运行状态。在每次部署时运行彻底的单元测试和集成测试套件是频繁或持续集成项目的先决条件！正如我们稍看到的，部署期间运行测试还可以实现零停机部署。\n\
  \n```\n25     - name: Get list of all running Node.js apps.\n26       command: forever\
  \ list\n27       register: forever_list\n28       changed_when: false\n29 \n30 \
  \    - name: Ensure Node.js API app is started.\n31       command: \"forever start\
  \ {{ app_directory }}/app.js\"\n32       when: \"forever_list.stdout.find('app.js')\
  \ == -1\"\n```\n\n一旦应用存在并正确运行，我们需要确保它已启动。这里有一个命令可以获取所有运行应用的列表（使用 `forever`），然后有一个命令在应用未在运行时启动它。\n\
  \n```\n34     - name: Add cron entry to start Node.js API app on reboot.\n35   \
  \    cron:\n36         name: \"Start Node.js API app\"\n37         special: reboot\n\
  38         job: \"forever start {{ app_directory }}/app.js\"\n```\n\n一旦应用存在并正确运行，我们需要确保它已启动。这里有一个命令可以获取所有运行应用的列表（使用\
  \ `forever`），然后有一个命令在应用未在运行时启动它。\n\n（注：此处原文示例逻辑似乎略有重复，根据上下文补全了逻辑）\n\n```\n40   handlers:\n\
  41     - name: restart forever apps\n42       command: \"forever stopall\"\n```\n\
  \n\n\n\n打开部署 playbook (`playbooks/deploy.yml`) 并修改初始设置以匹配以下内容：\n\n```\n1 ---\n2\
  \ - hosts: nodejs-api\n3   gather_facts: no\n4   become: yes\n5   serial: 2\n```\n\
  \n注意添加的 `serial: 2`。这告诉 Ansible 一时在两台服务器上运行整个 playbook。如果你再次将 `app_version` 更新为\
  \ `2.0.1` 并运行 playbook，你应该会看到它在四台服务器中的两台上运行，一旦遇到测试失败，playbook 的执行将停止——这将让你的另外两台服务器保持在线状态（并为你节省了在会议桥上解释停机的几个小时时间）。\n\
  \n你可以再次回到 `2.0.0`，但在你部署失败版本期间，开发人员已经完成了一个能够再次通过所有测试的新版本，即 `2.0.2`。请继续更新 `app_version`\
  \ 并再次运行 playbook。\n\n```\nPLAY RECAP **********************************************************\n\
  192.168.56.2          : ok=8    changed=5    unreachable=0    failed=0\n192.168.56.3\
  \          : ok=8    changed=5    unreachable=0    failed=0\n192.168.56.4      \
  \    : ok=8    changed=5    unreachable=0    failed=0\n192.168.56.5          : ok=8\
  \    changed=5    unreachable=0    failed=0\n```\n\n呼！一切都已恢复上线并运行，最新版本的应用程序测试全部通过了。\n\
  \nAnsible 提供了两个不同的设置来控制滚动部署失败场景：\n\n1. `serial`：可以是一个整数（例如 `3`）或百分比（例如 `30%`）。用于控制\
  \ Ansible 一次管理多少主机。\n2. `max_fail_percentage`：`1-100` 之间的整数。用于告诉 Ansible 在 play\
  \ 终止之前允许多少百分比的主机任务失败。\n\n如果你的基础设施中有余量，请将这些值设得高。如果你运行的设施仅够满足应用程序的需求，且超过一或两台服务器离线就会导致你的基础设施处于糟糕状态，那么你应该对这些设置更加保守——也许可以多准备一些容量！\n\
  \n### 部署到负载均衡器后的应用服务器\n\n在 Server Check.in 的案例中，有两个独立的 API 层来管理确保所有服务器检查发生的复杂性，无论某些服务器是开启还是关机。“负载均衡”发生在应用层，而不是作为一个独立的基础层（这在处理全球延迟和网络可靠性差异时非常有帮助）。\n\
  \n对于许多应用程序，特别是那些应用服务器距离很的应用（例如在同一个数据中心），基础设施层遵循更传统的布局，带有负载均衡器来处理 API 请求分发：\n\n![负载均衡器后的四台服务器。](img/10-multi-server-deployment-lb.png)\n\
  \n负载均衡器后的四台服务器。\n\n为了演示负载均衡器的零停机部署，让我们构建一个包含一个 HAProxy 负载均衡器和两个 Apache Web 服务器的本地基础设施。\n\
  \n首先，创建一个新项目文件夹 `deployments-balancer`，并在其中创建以下 `Vagrantfile`：\n\n```\n 1 # -*-\
  \ mode: ruby -*-\n 2 # vi: set ft=ruby :\n 3 \n 4 Vagrant.configure(\"2\") do |config|\n\
  \ 5   # 基础虚拟机 OS 配置。\n 6   config.vm.box = \"geerlingguy/ubuntu2004\"\n 7   config.vm.synced_folder\
  \ '.', '/vagrant', disabled: true\n 8   config.ssh.insert_key = false\n 9 \n10 \
  \  config.vm.provider :virtualbox do |v|\n 11     v.memory = 512\n 12     v.cpus\
  \ = 1\n 13     v.linked_clone = true\n 14   end\n 15 \n 16   # 定义带有静态私有 IP 的虚拟机。\n\
  \ 17   boxes = [\n 18     { :name => \"bal1\", :ip => \"192.168.56.2\" },\n 19 \
  \    { :name => \"app1\", :ip => \"192.168.56.3\" },\n 20     { :name => \"app2\"\
  , :ip => \"192.168.56.4\" }\n 21   ]\n 22 \n 23   # 配置每个虚拟机。\n 24   boxes.each do\
  \ |opts|\n 25     config.vm.define opts[:name] do |config|\n 26       config.vm.hostname\
  \ = opts[:name]\n 27       config.vm.network :private_network, ip: opts[:ip]\n 28\
  \ \n 29       # 在最后一个虚拟机启动后配置所有虚拟机。\n 30       if opts[:name] == \"app2\"\n 31 \
  \        config.vm.provision \"ansible\" do |ansible|\n 32           ansible.playbook\
  \ = \"playbooks/provision.yml\"\n 33           ansible.inventory_path = \"inventory\"\
  \n 34           ansible.limit = \"all\"\n 35         end\n 36       end\n 37   \
  \  end\n 38   end\n 39 \n 40 end\n```\n\n此 `Vagrantfile` 将创建三台服务器：`bal1`（负载均衡器）、`app1`\
  \ 和 `app2`（应用服务器）。它引用了 `playbooks/provision.yml` 中的 Ansible playbook（用于在服务器上安装所需的软件）以及\
  \ `inventory` 自定义清单文件。首先，在 `Vagrantfile` 相同的目录下创建 `inventory` 文件，并带有相应的分组和变量：\n\n\
  ```\n1 [balancer]\n2 192.168.56.2\n3 \n4 [app]\n5 192.168.56.3\n6 192.168.56.4\n\
  7 \n8 [deployments:children]\n9 balancer\n10 app\n11 \n12 [deployments:vars]\n13\
  \ ansible_user=vagrant\n14 ansible_ssh_private_key_file=~/.vagrant/insecure_key\n\
  ```\n\n使用此清单，我们可以仅操作 `balancer`、仅操作 `app` 服务器或一起操作所有服务器（`deployments` 组）。接下来，在 `playbooks/provision.yml`\
  \ 中创建一个 playbook 来配置服务器：\n\n```\n1 ---\n2 - name: 防墙配置.\n3   hosts: all\n4   become:\
  \ yes\n5 \n6   vars:\n7     firewall_allowed_ports:\n8       - \"22\"\n9       -\
  \ \"80\"\n10 \n11   pre_tasks:\n12     - name: 如果需要则更新 apt.\n13       apt: update_cache=yes\
  \ cache_valid_time=3600\n14 \n15   roles:\n16     - geerlingguy.firewall\n17 \n\
  18 - name: HAProxy 负载均衡器设置.\n19   hosts: balancer\n20   become: yes\n21 \n22   vars:\n\
  23     haproxy_backend_servers:\n24       - name: 192.168.56.3\n25         address:\
  \ 192.168.56.3:80\n26       - name: 192.168.56.4\n27         address: 192.168.56.4:80\n\
  28 \n29   roles:\n30     - geerlingguy.haproxy\n31 \n32 - name: Apache Web 服务器设置.\n\
  33   hosts: app\n34   become: yes\n35 \n36   roles:\n37     - geerlingguy.apache\n\
  ```\n\n这三个 play 在所有服务器上设置了防火墙，在负载均衡器上配置了 HAProxy，并在应用服务器上安装了 Apache（默认配置）。让此基础设施运行的唯一需要配置的是\
  \ `firewall_allowed_tcp_ports` 和 `haproxy_backend_servers`。我们让角色完成所有的工作。\n\n现在，为了确保安装了所有角色，创建一个需求文件从\
  \ Ansible Galaxy 安装角色。在 `Vagrantfile` 相同的目录下创建 `requirements.yml`，内容如下：\n\n```\n\
  1 ---\n2 roles\n3   - name: geerlingguy.firewall\n4   - name: geerlingguy.haproxy\n\
  5   - name: geerlingguy.apache\n```\n\n运行 `ansible-galaxy install -r requirements.yml`\
  \ 安装所需的角色。\n\n此时，如果你想启动本地负载均衡基础设施，请在 `deployments-balancer` 目录下运行 `vagrant up` 并等待几分钟。一旦一切启动并运行，访问\
  \ `http://192.168.56.2/`，你应该看到默认的 Ubuntu Apache 落地页：\n\n![HAProxy 通过 Apache 后端服务器提供请求。](img/10-deploy-haproxy.png)\n\
  \nHAProxy 通过 Apache 后端服务器提供请求。\n\n运行以下命令验证轮询负载均衡正常工作：\n\n```\n1 $ for i in {1..5};\
  \ do curl -Is http://192.168.56.2/ | grep -i cookie; \\\n2 done\n3 Set-Cookie: SERVERID=192.168.56.4;\
  \ path=/\n4 Set-Cookie: SERVERID=192.168.56.3; path=/\n5 Set-Cookie: SERVERID=192.168.56.4;\
  \ path=/\n6 Set-Cookie: SERVERID=192.168.56.3; path=/\n7 Set-Cookie: SERVERID=192.168.56.4;\
  \ path=/\n```\n\n你应该看到负载均衡器在两台后端应用服务器之间分配请求。\n\n\n\n\n当你将新代码部署到应用服务器时，你需要确保负载均衡器始终有一台可以处理请求的应用服务器，因此你希望使用\
  \ `serial` 来按顺序对每台服务器（或服务器组）进行部署。为了确保服务器从 `HAProxy` 中被正确移除并在部署后重新添加，请使用 `pre_tasks`\
  \ 和 `post_tasks`。\n\n在 `provision.yml` 地创建一个名为 `deploy.yml` 的另一个 playbook，内容如下：\n\
  \n```yaml\n 1 ---\n 2 - hosts: app\n 3   become: yes\n 4   serial: 1\n 5 \n 6  \
  \ pre_tasks:\n 7     - name: Disable the backend server in HAProxy.\n 8       haproxy:\n\
  \ 9         state: disabled\n10         host: '{{ inventory_hostname }}'\n11   \
  \      socket: /var/lib/haproxy/stats\n12         backend: habackend\n13       delegate_to:\
  \ \"{{ item }}\"\n14       with_items: \"{{ groups.balancer }}\"\n 15 \n 16   tasks:\n\
  \ 17     - name: Wait a short time to simulate a deployment.\n 18       pause:\n\
  \ 19         seconds: 20\n 20 \n 21   post_tasks:\n 22     - name: Wait for backend\
  \ to come back up.\n 23       wait_for:\n 24         host: '{{ inventory_hostname\
  \ }}'\n 25         port: 80\n 26         state: started\n 27         timeout: 60\n\
  \ 28 \n 29     - name: Enable the backend server in HAProxy.\n 30       haproxy:\n\
  \ 31         state: enabled\n 32         host: '{{ inventory_hostname }}'\n33  \
  \       socket: /var/lib/haproxy/stats\n34         backend: habackend\n35      \
  \ delegate_to: \"{{ item }}\"\n36       with_items: \"{{ groups.balancer }}\"\n\
  ```\n\n这个 playbook 在实际部署方面做什么，但它说明了如何在两或多台应用服务器上实现零停机滚动更新：\n\n1.  在 `pre_tasks`\
  \ 中，`haproxy` 模块使用 `with_items` 和 `inventory_hostname` 变量，在 `balancer` 组中的所有负载均衡器上禁用当前的\
  \ `app` 服务器。`HAProxy` 任务被委托给 `balancer` 服务器中的每一台（在我们的案例中，只有一台），因为该任务影响的是负载均衡器，而不是当前的\
  \ `app` 主机。\n\n2.  在 `post_tasks` 中，我们首先 `wait_for` 端口 80 可用，一旦可用，`haproxy` 模块会在所有负载均衡器上重新启用当前的\
  \ `app` 服务器。\n\n使用以下命令在本地基础设施上运行该 playbook：\n\n```bash\n1 $ ansible-playbook -i\
  \ inventory playbooks/deploy.yml\n```\n\n运行大约需要一分钟，一旦完成，所有服务器都应该重新回到负载均衡器的调度池中。如果你想快速确认部署\
  \ playbook 是否按预期工作，可以在 `debug` 任务之后立即添加一个始终会失败的任务：\n\n```yaml\n15 # [...]\n16 tasks:\n\
  17   - debug: msg=\"Deployment would be done here.\"\n18   - command: /bin/false\n\
  19 \n20 post_tasks:\n21 # [...]\n```\n\n如果你再次运行部署 playbook，等待它失败，然后再次运行 `curl` 命令，你会注意到所有请求都被指向了第二台应用服务器：\n\
  \n```bash\n1 $ for i in {1..5}; do curl -Is http://192.168.56.2/ | grep -i cookie;\
  \ d\\\n2 one\n3 Set-Cookie: SERVERID=192.168.56.4; path=/\n4 Set-Cookie: SERVERID=192.168.56.4;\
  \ path=/\n5 Set-Cookie: SERVERID=192.168.56.4; path=/\n6 Set-Cookie: SERVERID=192.168.56.4;\
  \ path=/\n7 Set-Cookie: SERVERID=192.168.56.4; path=/\n```\n\n通过移除 `/bin/false`\
  \ 命令来修复部署。再次运行 playbook 以将基础设施恢复到完全功能状态。\n\n这个演示看起来看起来基础，但 playbook 中的 `pre_tasks`\
  \ 和 `post_tasks` 与许多大型生产基础设施部署中所使用的方法完全相同！\n\n### Capistrano 风格和蓝绿部署\n\n许多处理 Ruby\
  \ 应用程序开发者熟悉 [Capistrano](http://capistranorb.com/)，这是一个基于 Ruby 构建的任务自动化和应用部署工具。Capistrano\
  \ 的基本部署风格是创建带有日期的发布目录，然后将当前发布版本链接到稳定的应用程序目录，连同在发布版本之间持续的资源（如日志和上传的文件）。\n\nCapistrano\
  \ 实现的功能远超这个基础部署模型，但许多人想要复制简单的应用程序部署工作流（这也使得回滚变得简单，因为只需将符号链接指向上一个发布目录即可！）。使用 Ansible\
  \ 很容易实现，我不会在书中带你介绍整个过程，而是向你推荐一些优秀的资源和一个可以轻松协调 Capistrano 风格部署的 Ansible Galaxy role：\n\
  \n*   [使用 Ansible 重新构建类似 Capistrano 的部署](http://blog.versioneye.com/2014/09/24/rebuilding-capistrano-like-deployment-with-ansible/)\n\
  *   [Ansible Galaxy 上的 project_deploy role](https://github.com/f500/ansible-project-deploy)\n\
  *   [关于使用 Ansible 进行部署的思考](http://www.future500.nl/articles/2014/07/thoughts-on-deploying-with-ansible/)\
  \ (上述 role 的背景)\n*   [Ansible project-deploy](http://www.slideshare.net/ramondelafuente/ansible-projectdeploy)\
  \ (关于上述 role 的演示文)\n\n更进一步，许多组织使用蓝绿部署。基本概念涉及启动一个并行的生产基础设施，然后切换到它。切换可能只需要几毫秒，而且在部署过程中没有任何活跃的生产基础设施处于离线状态。\n\
  \n一些不同的技术和概念，如基于容器的基础设施和微服务（部署速度更快），以及更好的云自动伸缩和负载均衡选项，使得蓝绿部署比过去变得容易得多。\n\n本书将不会介绍这种风格的详细示例，因为该过程与其他示例相似，区别在于多了一个将负载均衡器从旧切换到新的环境的任务。Ansible\
  \ 博客对基于 AWS 的蓝绿部署有极好的概述：[Immutable Systems](http://www.ansible.com/blog/immutable-systems)，并且有内置模块可以管理几乎任何你可以使用的负载均衡器，包括\
  \ [F5’s BIG-IP](https://docs.ansible.com/latest/collections/f5networks/f5_modules/index.html)、[HAProxy](https://docs.ansible.com/latest/collections/community/general/haproxy_module.html)、[Citrix\
  \ NetScaler](https://docs.ansible.com/latest/collections/community/network/netscaler_service_module.html)\
  \ 和 [Amazon ELB](https://docs.ansible.com/latest/collections/amazon/aws/elb_classic_module.html#ansible-collections-amazon-aws-elb-classic-lb-module)。\n\
  \n### 额外的部署功能\n\n还有几个 Ansible 模块和选项在部署上下文中非常有帮助：\n\n[`run_once`](http://docs.ansible.com/playbooks_delegation.html#run-once)\
  \ 和 `delegate_to` 在更新数据库架构或清除应用程序缓存等场景中非常有用，在这些场景中，你需要特定任务仅在特定服务器上运行一次：\n\n```yaml\n\
  - command: /opt/app/upgrade-database-schema\n  run_once: true\n  delegate_to: app1.example.com\n\
  ```\n\n将 `run_once` 配合 `delegate_to` 使用与使用 `when: inventory_hostname == groups.groupname[0]`\
  \ 的模式类似，但在描述你尝试实现的目标时更加精确——即在特定主机上运行一次命令。\n\n成功部署的另一个重要方面是通信。如果你作为 CI/CD 过程的一部分运行\
  \ playbook，或者以其他某种自动化方式运行，请使用许多内置的 Ansible 通知模块之一，通过聊天、电子邮件，甚至通过 Mac 上的 `osx_say`\
  \ 文本转语音来共享部署进度！Ansible 包含了易于使用的通知模块用于：\n\n*   Campfire\n*   HipChat\n*   IRC\n*\
  \   Jabber\n*   Email\n*   Slack\n*   Twilio\n*   Amazon SNS\n*   等\n\n许多 playbook\
  \ 在 `pre_tasks` 和 `post_tasks` 部分中都包含通知，在部署开始或结束时在聊天频道通知管理员。例如：\n\n\n\n\n\n```yaml\n\
  post_tasks:\n  - name: Tell everyone on IRC the deployment is complete.\n    irc:\n\
  \      channel: my-org\n      server: irc.example.com\n      msg: \"Deployment complete!\"\
  \n    delegate_to: 127.0.0.1\n```\n\n关于 Ansible 告的优秀入门指南，请参阅 Ansible Inc 的博客：[听听服务器说话](http://www.ansible.com/blog/listen-to-your-servers-talk)。\n\
  \n### 总结\n\n使用 Ansible 自动化部署可以使你的开发团队更可靠、更快速地将代码部署到生产服务器，并让你的运维团队减少在重复性任务上花费的时间，而将更多时间用于改进基础设施。\n\
  \n本章仅概述了最流行的几种部署技术，但 Ansible 非常灵活，可以开箱处理几乎任何情况。\n\n```\n _______________________________________\n\
  / One machine can do the work of fifty  \\\n| ordinary men. No machine can do the\
  \   |\n| work of one extraordinary man.        |\n\\ (Elbert Hubbard)          \
  \            /\n ---------------------------------------\n        \\   ^__^\n  \
  \       \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w\
  \ |\n                ||     ||\n```\n\n## 第 11 章 - 服务器安全与 Ansible\n\n在任何新服务器上执行的第一项配置——特别是任何与公共互联网有直接或间接接触的服务器——都是安全配置。\n\
  \n有九项基本措施可以确保服务器免受未经授权的访问或通信拦截：\n\n1. 使用安全的加密通信。\n2. 禁用 root 登录并使用 `sudo`。\n3. 移除未使用的软件，仅开放所需的端口。\n\
  4. 使用最小权限原则。\n5. 更新操作系统和已安装的软件。\n6. 使用配置适当的防火墙。\n7. 确保日志文件已填充并轮。\n8. 监控登录情况并阻塞疑\
  \ IP 地址。\n9. 使用 `SELinux`（增强型 Linux）。\n\n你基础设施的强度取决于最弱的那台服务器；在许多引起关注的安全漏洞中，一台安全性不足的服务器就会成为进入其余网络的网关。不要让你的服务器成为那些服务器！良好的安全性也有助于你实现系统管理的圣杯——100%\
  \ 的可用性。\n\n在本章中，你将学习 Linux 安全以及 Ansible 如何帮助保护你的服务器，并遵循上述基本主题。\n\n### SSH 和远程访问的简史\n\
  \n起初，计算机的体积像大型会议室一样大。打孔读取器会欢快地接收带有计算机运行指令的纸片，然后打印机会将结果刻在另一张纸上。成千上万个机械零件和谐地工作（当它们正常工作时），以计算相对简单的命令。\n\
  \n随着时间的推移，计算机变得越来越小，交互式终端也变得更加用户友好，但它们仍然直接连接到正在使用的计算机。大型机在 20 世纪 60 年代脱而出，最初通过打字机和电报字接口使用，然后通过键盘和小文本显示器使用。随着网络计算在\
  \ 20 世纪 70 年代和 80 年代普及，远程终端访问被用于与大型中央计算机交互。\n\n最早的远程终端接口假设中心计算机与网络上的所有成员之间存在高水平的信任，因为使用的小型中心化网络在物理上是相互隔离的。\n\
  \n#### Telnet\n\n在 20 世纪 60 年代后期，`Telnet` 协议被定义并开始在 `TCP` 网络上（通常在端口 `23`）使用，用于远程控制较大的私有网络，最终用于公共互联网。\n\
  \n`Telnet` 的底层技术（一种在不同系统之间传输数据的文本协议）是今天使用的许多基础通信协议的基础，包括 `HTTP`、`FTP` 和 `POP3`。然而，纯文流是不安全的，即使增加了\
  \ `TLS` 和 `SASL`，`Telnet` 默认并不安全。随着 `SSH` 的出现（我们稍后会介绍），该协议在大多数远程管理用途中的流行已经下降。\n\n\
  `Telnet` 仍有一些用途，例如通过本地串口连接配置设备，或检查远程服务器上的特定服务是否运行正常（例如端口 80 上的 `HTTP` 服务器、端口 3306\
  \ 上的 `mysql` 或端口 4949 上的 `munin`），但现代 Linux 发行版中默认不再安装它。\n\n#### rlogin, rsh 和 rcp\n\
  \n`rlogin` 于 1983 年引入 `BSD 4.2`，直到最近一直与 `Telnet` 一起分发在许多类 Unix 系统中。`rlogin` 在 80\
  \ 年代和 90 年代的大部分时间内被广泛使用。与 `Telnet` 一样，用户可以使用密码登录远程系统，但 `rlogin` 额外允许信任的远程计算机上的用户进行自动（无密码）登录。`rlogin`\
  \ 在远程管理方面比 `telnet` 更好，因为它在处理某些字符和命令时运行正常，而 `telnet` 需要额外的翻译。\n\n然而，像 `Telnet` 一样，`rlogin`\
  \ 默认通过 `TCP` 端口 `513` 使用纯文本通信。`rlogin` 也没有许多防止客户端伪造真实身份的保护措施。`rlogin` 的一些固有缺陷在卡内基梅隆大学\
  \ 1998 年的一份报告中被指出：rlogin: 未说的故事](http://resources.sei.cmu.edu/asset_files/TechnicalReport/1998_005_001_16670.pdf)。\n\
  \n`rsh`（远程 shell）是一个与 `rlogin` 一起使用的命令行程序，用于远程执行单个 shell 命令，而 `rcp`（远程复制）用于远程文件复制。`rsh`\
  \ 和 `rcp` 继承了与 `rlogin` 相同的安全问题，因为它们使用不同的端口。\n\n#### SSH\n\nSecure Shell 由芬兰人 Tatu\
  \ Ylönen 于 1995 年创建，以应对他大学遭受的[密码嗅探攻击](https://en.wikipedia.org/wiki/Secure_Shell#Version_1.x)。看到纯文本通信的缺陷，Tatu\
  \ 创建了 Secure Shell/SSH，并非常强调加密和安全。\n\n他的 SSH 版本作为带有慷慨许可的免费软件开发了几年，但当 [SSH Communications\
  \ Security](https://www.ssh.com/) 开始限制许可并将 SSH 商业化时，替代性的分支（forks）开始变得流行。最受欢迎的分支\
  \ OSSH 是由瑞典程序员 Bjern Groenvall 编写的 OSSH，它被 OpenBSD 项目的一些开发者选为起点。\n\nOpenBSD 是（现在仍然是！）一个高度安全的、免费的\
  \ BSD UNIX 版本，该项目的开发者需要一种安全的通信协议，因此几个项目成员致力于清理并改进 [OSSH](http://www.openbsd.org/openssh/history.html)，以便将其包含在\
  \ OpenBSD 1999 年 12 月发布的 2.6 版本中。从那里开始，它被迅速移植并采用所有主要的 Linux 版本，并在 POSIX 兼容操作系统中无处不在。\n\
  \nSSH 是如何工作的，它为什么比 telnet 或 rlogin 好？它从基础连接开始。SSH 连接加密类似于安全 HTTP 连接的 SSL，但其验证层增加了安全性：\n\
  \n1. 当你输入 `ssh user@example.host` 以 `user` 身份连接 `example.host` 服务器时，客户端和主机交换密钥。\n\
  2. 如果你是第一次连接主机，或者自上次连接以来主机密钥发生了变化（这在通过 DNS 而不是直接通过 IP 连接时经常发生），SSH 将提示你批准主机密钥。\n\
  3. 如果你的 `~/.ssh` 文件夹中的私钥与远程系统 `~/.ssh/authorized_keys` 中的某个密钥匹配，连接将进入第 4 步。否则，如果允许密码验证，SSH\
  \ 会提示你输入密码。还有其他验证方法，例如 Kerberos，但它们并不常见，且书中未涉及。\n\n\n\n\n\n4. 传输的密钥用于创建一个会话密钥，该密钥用于连接的剩余部分，使用如\
  \ `AES`、`3DES`、`Blowfish` 或 `RC4` (`arcfour`) 等密文对所有通信进行加密。\n\n5. 连接将保持加密并持续，直到你退出远程连接（在交互式会话的情况下），或者正在执行的操作（例如，`scp`\
  \ 或 `sftp` 文件传输）完成完毕。\n\nSSH 使用加密密钥来识别客户端和主机（这在 `telnet` 和 `rlogin` 的默认配置基础上增加了一层安全性），然后为进一步的通信建立每个会话独立的加密通道。这种连接方法也用于交互式\
  \ `ssh` 会话，以及用于等服务：\n\n* `scp`（安全复制），SSH 对应 `rlogin` 中 `rcp` 的工具。\n* `sftp`（安全 FTP），SSH\
  \ 的客户端/服务器文件传输协议。\n* SSH 端口转发（以便你可以在远程服务器上安全地运行服务）。\n* SSH X11 转发（以便你可以安全地使用 X 窗口）。\n\
  \n（在 OpenBSD 网站上提供了完整的功能列表：[OpenSSH Features](http://www.openbsd.org/openssh/features.html)）。\n\
  \nSSH 软件包全集还包含了实用的工具，如 `ssh-keygen`，它可以生成适用于通过 SSH 连接的公/私钥对。你还可以安装 `ssh-copy-id`\
  \ 工具，它可以加速你手动将身份标识文件添加到远程服务器的过程。\n\nSSH 在默认情况下是相当安全的——无疑比 `telnet` 或 `rlogin` 的默认配置要得多——但为了获得更高的安全性，还有几个你应该使用的额外设置（所有这些设置都配置在\
  \ `/etc/ssh/sshd_config` 中，并且需要重启 `sshd` 服务才能生效）：\n\n1. **禁用基于密码的 SSH 身份验证。** 即使密码没有以明文发送，禁用基于密码的认证使得暴力破解攻击甚至无法被尝试，即使你运行了额外的（且推荐的）Fail2Ban\
  \ 之类的保护层。在配置中设置 `PasswordAuthentication no`。\n2. **禁用 root 账户远程登录。** 无论如何，你都不应该以\
  \ root 用户身份登录（请改用 `sudo`），但为了强化这一良好习惯，请通过在配置中设置 `PermitRootLogin no` 来禁用远程 root\
  \ 用户账户登录。如果你需要以 root 身份执行操作，请使用 `sudo`（优先），或者如果绝对需要以 root 身份进行交互，请先用普通账户登录，然后通过\
  \ `su` 切换到 root 账户。\n3. **显式允许/拒绝用户的 SSH。** 使用 `AllowUsers` 和 `DenyUsers` 启用或禁用系统中特定用户的\
  \ SSH 访问。要仅允许“John”登录，规则为 `AllowUsers John`。要允许除 John *之外*的任何用户登录，规则为 `DenyUsers\
  \ John`。\n4. **使用非标准端口。** 将默认 SSH 端口从 22 更改为更隐蔽的端口（例如 2849），以防止成千寻找 22 端口响应服务器的“脚本小子”攻击。虽然通过隐蔽来实现安全不能替代对\
  \ SSH 的整体防护，但它提供了一层微小的额外保护。若要更改端口，请在配置中设置 `Port [new-port-number]`。\n\n我们将在下一节介绍如何在\
