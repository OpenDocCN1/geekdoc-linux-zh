  \   17G   94% /vagrant\n```\n\n第三，让我们确保时间是同步的。我们使用 `chrony` 进程，但现在我们只检查 `date` 命令：\n\
  \n```bash\n$ ansible multi -a \"date\"\n192.168.56.4 | CHANGED | rc=0 >> Sat May\
  \ 20 10:00:01 UTC 2024\n192.168.56.5 | CHANGED | rc=0 >> Sat May 20 10:00:02 UTC\
  \ 2024\n192.168.56.6 | CHANGED | rc=0 >> Sat May 20 10:00:03 UTC 2024\n```\n\n既然我们已经能够让所有服务器达到一个稳定的基线（例如，至少它们的时间是正确的），我们需要配置应用程序服务器，然后是数据库服务器。\n\
  \n### 配置服务器组或单个服务器\n\n由于我们在清单文件中设置了两个组，`app` 和 `db`，我们可以针对这些组中的服务器执行命令。\n\n####\
  \ 配置应用程序服务器\n\n我们的假设 Web 应用程序使用 Django，因此我们需要确保安装 Django 及其依赖。Django 不在 Rocky Linux\
  \ 的官方 dnf 仓库中，但我们可以使用 `pip` 安装：\n\n```bash\n$ ansible app -b -m dnf -a \"name=python3-pip\
  \ state=present\"\n$ ansible app -b -m pip -a \"executable=pip3 name=django<4 state=present\"\
  \n```\n\n检查 Django 是否已安装并正常工作：\n\n```bash\n$ ansible app -a \"python3 -m django\
  \ --version\"\n192.168.56.5 | SUCCESS | rc=0 >> 3.1.1\n192.168.56.4 | SUCCESS |\
  \ rc=0 >> 3.1.1\n```\n\n看起来我们的应用程序服务器上一切正常。现在我们可以开始处理我们的数据库服务器了。\n\n#### 配置数据库服务器\n\
  \n\n\n我们使用 Ansible 主清单文件中定义的 `app` 组配置了应用服务器，现在可以使用同样定义的 `db` 组来配置数据库服务器（目前是 `db`\
  \ 组中的唯一的服务器）。\n\n让我们安装 MariaDB 并启动它：\n\n```bash\n$ ansible db -b -m dnf -a \"name=mariadb-server\
  \ state=present\"\n$ ansible db -b -m service -a \"name=mariadb state=started \\\
  \nenabled=yes\"\n```\n\n然后配置系统防火墙，确保只有应用服务器可以访问数据库：\n\n```bash\n1 $ ansible db -b\
  \ -m dnf -a \"name=firewalld state=present\"\n2 $ ansible db -b -m service -a \"\
  name=firewalld state=started \\\n3 enabled=yes\"\n4 $ ansible db -b -m firewalld\
  \ -a \"zone=database state=present permanent=\\\n5 yes\"\n6 $ ansible db -b -m firewalld\
  \ -a \"source=192.168.56.0/24 \\\n7 zone=database state=enabled permanent=yes\"\n\
  8 $ ansible db -b -m firewalld -a \"port=3306/tcp zone=database \\\n9 state=enabled\
  \ permanent=yes\"\n```\n\n此时，如果你尝试从应用服务器（或你的主机主机）连接数据库，你将无法连接，因为 MariaDB 还需要设置。通常情况下，你会通过登录服务器并运行\
  \ `mysql_secure_installation` 来完成此操作。幸运的是，Ansible 可以通过它的各种 `mysql_*` 模块控制 MariaDB\
  \ 服务器。现在，我们需要允许一个用户从应用服务器访问 MySQL。MySQL 模块要求托管服务器上存在 `PyMySQL` 模块。\n\n```bash\n\
  $ ansible db -b -m dnf -a \"name=python3-PyMySQL state=present\"\n$ ansible db -b\
  \ -m mysql_user -a \"name=django host=% password=12345 \\\npriv=*.*:ALL state=present\"\
  \n```\n\n此时，你应该已经能够在应用服务器上创建或部署 Django 应用程序了（例如使用 `django-admin startproject mysite`，但我们稍后会讨论多服务器部署），然后将其指向用户名为\
  \ `django` 密码为 `12345` 的数据库服务器。\n\n## 仅对一台服务器进行更改\n\n恭喜！你现在有了一个运行 Django 和 MySQL\
  \ 的小型 Web 应用程序环境。这并不多，而且应用服务器前面甚至没有负载均衡器来分发请求；但我们很快就配置好了一，而且完全无需登录服务器。更令人印象深刻的是，你可以再次运行任何\
  \ `ansible` 命令（除了少数几个简单的 shell 命令外），它们不会改变任何内容——它们会返回 `\"changed\": false`，让你对原始配置的完好无损感到放心。\n\
  \n现在本地基础设施已经运行了一段时间，你注意到（当然这是假设的）日志显示两台应用服务器中的一台时间与其他服务器严重不同步，这可能是因为 chrony 时间同步守护进程崩溃或以某种方式停止了。你迅速输入以下命令来检查\
  \ `chronyd` 的状态：\n\n```bash\n$ ansible app -b -a \"systemctl status chronyd\"\n\
  ```\n\n然后，在受影响的应用服务器上重启该服务：\n\n```bash\n$ ansible app -b -a \"service chronyd restart\"\
  \ --limit \"192.168.56.4\"\n```\n\n在这一条命令中，我们使用了 `--limit` 参数将命令限制在指定组中的特定主机上。`--limit`\
  \ 可以匹配精确字符串或正则表达式（以 `~` 为前缀）。如果你只想将命令应用到 `.4` 服务器上（假设你知道没有其他 IP 地址以 .4 结尾的服务器），那么上述命令可以写得更简单，下文所示的这种操作的效果是完全相同的：\n\
  \n```bash\n## 使用简单模式限制主机（星号是通配符）。\n$ ansible app -b -a \"service chronyd restart\"\
  \ --limit \"*.4\"\n\n## 使用正则表达式限制主机（以波浪号前缀）。\n$ ansible app -b -a \"service chronyd\
  \ restart\" --limit ~\".*\\.4\"\n```\n\n在这些示例中，我们使用的是 IP 地址而不是主机名，但在许多真实场景中，你可能会使用像\
  \ `nyc-dev-1.example.com` 这样的主机名；能够匹配正则表达式通常非常有帮助。\n\n## 管理用户和组\n\n在我日常使用中，Ansible\
  \ 即时命令（ad-hoc commands）最常见的用途之一就是用户和组管理。我不知道为了多少次重新阅读 man 手页或进行 Google 搜索，才能记住需要哪些参数来创建带有或不带主目录的用户、将用户添加到某些组等。\n\
  \nAnsible 的 `user` 和 `group` 模块让任何 Linux 发行版上的操作变得非常简单且标准。\n\n首先，在应用服务器上为管理员添加一个\
  \ `admin` 组：\n\n```bash\n$ ansible app -b -m group -a \"name=admin state=present\"\
  \n```\n\n`group` 模块非常简单；你可以通过设置 `state=absent` 删除组，通过 `gid=[gid]` 设置组 ID，并使用 `system=yes`\
  \ 指明该组是系统组。\n\n现在，将用户 `johndoe` 添加到刚才创建的组所在的应用服务器中。\n\n\n\n\n`copy` 模块非常适合单文件拷贝，并且处理小目录时效果非常好。当你需要拷贝成百上千文件时，特别是在深度嵌套的目录结构中，你应该考虑先用\
  \ Ansible 的 `unarchive` 模块拷贝并解压文件的压缩包，或者使用 Ansible 的 `synchronize` 或 `rsync` 模块。\n\
  \n## 从服务器获取文件\n\n`fetch` 模块的工作原理与 `copy` 模块几乎完全相同，只是方向相反。主要的区别在于，文件将被复制到本地 `dest`\
  \ 目录，其目录结构将与复制文件的主机相匹配。例如，使用以下命令从服务器获取 `hosts` 文件：\n\n```bash\n$ ansible multi -b\
  \ -m fetch -a \"src=/etc/hosts dest=/tmp\"\n```\n\n默认情况下，`fetch` 会将每台服务器的 `/etc/hosts`\
  \ 文件放入目标目录下以主机名命名的文件夹中（在本例中，为三个 IP 地址），然后放在 `src` 定义的位置下。因此，db 服务器的 `hosts` 文件将位于\
  \ `/tmp/192.168.56.6/etc/hosts`。\n\n你可以添加参数 `flat=yes` 并将 `dest` 设置为 `dest=/tmp/`（添加末尾斜杠），让\
  \ Ansible 直接将文件获取到 `/tmp` 目录。然而，为了使之生效，文件名必须唯一的，因此在从多个主机下载文件时这种方法并不 Practical 用。只有在从单个主机拷贝文件时才使用\
  \ `flat=yes`。\n\n## 创建目录和文件\n\n你可以使用 `file` 模块创建文件和目录（类似于 `touch`）、管理文件和目录的权限与所有权、修改\
  \ SELinux 属性以及创建符号链接。\n\n以下是创建目录的方法：\n\n```bash\n$ ansible multi -m file -a \"dest=/tmp/test\
  \ mode=644 state=directory\"\n```\n\n以下是创建符号链接的方法（设置 `state=link`）：\n\n```bash\n\
  $ ansible multi -m file -a \"src=/src/file dest=/dest/symlink \\\nstate=link\"\n\
  ```\n\n`src` 是符号链接的目标文件，`dest` 是符号链接本身应该所在的路径。\n\n## 删除目录和文件\n\n你可以将 `state` 设置为\
  \ `absent` 来删除文件、目录或符号链接。\n\n```bash\n$ ansible multi -m file -a \"dest=/tmp/test\
  \ state=absent\"\n```\n\n使用 Ansible 远程管理文件有许多简单方法。我们在这里简要介绍了了 `copy` 和 `file` 模块，但请务必阅读其他文件管理模块（如\
  \ `lineinfile`、`ini_file` 和 `unarchive`）的文档。本书将在后面的章节深入介绍这些额外模块（在处理 playbook 时）。\n\
  \n## 在后台运行操作\n\n某些操作需要很长时间（几分钟甚至几小时）。例如，当你运行 `dnf update` 或 `apt-get update && apt-get\
  \ dist-upgrade` 时，可能需要几分钟时间才能完成服务器上所有软件包的更新\n\n在这些情况下，你可以告诉 Ansible 异步运行命令，并轮询服务器以查看命令何时完成。当你只管理一台服务器时，这并没有太大帮助，但如果你有许多台服务器，Ansible\
  \ 会在所有服务器上*非常*快速地启动命令（特别是如果你设置了更高的 `--forks` 值），然后轮询服务器状态，直到它们都更新到最新。\n\n要在后台运行命令，你需要设置以下选项：\n\
  \n* `-B <seconds>`：允许作业运行的最长时间（秒）。\n* `-P <seconds>`：在轮询服务器获取更新的作业状态之间等待的时间（秒）。\n\
  \n### 使用异步作业异步更新服务器\n\n让我们在所有服务器上运行 `dnf -y update` 使它们更新到最新状态。如果你设置了 `-P 0`，Ansible\
  \ 会在服务器上触发命令，然后将后台作业信息打印到屏幕并退出：\n\n```bash\n$ ansible multi -b -B 3600 -P 0 -a \"\
  dnf -y update\"\n192.168.56.4 | CHANGED => {\n    \"ansible_facts\": {\n       \
  \ \"discovered_interpreter_python\": \"/usr/bin/python\"\n    },\n    \"ansible_job_id\"\
  : \"333866395772.18507\",\n    \"changed\": true,\n    \"finished\": 0,\n    \"\
  results_file\": \"/root/.ansible_async/333866395772.18507\",\n    \"started\": 1\n\
  }\n\n... [其他主机] ...\n```\n\n当后台任务运行时，你可以使用 Ansible 的 `async_status` 模块在其他地方检查状态，只要你有\
  \ `ansible_job_id` 值并作为 `jid` 传入：\n\n```bash\n$ ansible multi -b -m async_status\
  \ -a \"jid=169825235950.3572\"\n192.168.56.6 | CHANGED => {\n    \"ansible_facts\"\
  : {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\n    },\n  \
  \  \"ansible_job_id\": \"761320869373.18496\",\n    \"changed\": true,\n    \"finished\"\
  : 0,\n```\n\n\n\n\n```\n$ ansible multi -b -m cron -a \"name='daily-cron-all-servers'\
  \ \\\nstate=absent\"\n```\n\n你也可以使用 Ansible 来管理自定义的 crontab 文件；使用与之前相同的语法，但通过 `cron_file=cron_file_name`\
  \ 指定 cron 文件的位置（其中 `cron_file_name` 是位于 `/etc/cron.d` 下的 cron 文件）。\n\n### 部署版本控制的应用程序\n\
  \n对于简单的应用程序部署（例如你可能需要更新 git 检检，或者将一段新代码复制到一组服务器，然后运行一个命令来完成部署），Ansible 的即时模式（ad-hoc\
  \ mode）可以派上用。对于更复杂的部署，请使用 Ansible playbooks（剧本）和滚动更新功能（这些将在后面的章节中讨论），以确保零停机时间的成功部署。\n\
  \n在下面的示例中，我假设我们正在一台或两台服务器上运行一个简单的应用程序，目录位于 `/opt/myapp`。该目录是从中央服务器或 GitHub 等服务克隆的\
  \ git 仓库，应用程序的部署和更新通过更新克隆版本，然后运行 `/opt/myapp/scripts/update.sh` 脚本来完成。\n\n首先，将所有应用服务器上的\
  \ git 检更新到应用程序的新版本分支 1.2.4：\n\n```\n$ ansible app -b -m git -a \"repo=git://example.com/path/to/repo.git\
  \ \\\ndest=/opt/myapp update=yes version=1.2.4\"\n```\n\nAnsible 的 git 模块允许你通过 `version`\
  \ 参数指定分支、标签（tag）甚至特定的提交 ID（在这种情况下，我们选择了检出标签 `1.2.4`，但如果你再次使用分支名称（如 `prod`）运行该命令，Ansible\
  \ 会乐意地执行该操作）。为了强制 Ansible 更新已检出的副本，我们传递了 `update=yes`。`repo` 和 `dest` 选项应该是自言易懂。\n\
  \n然后，运行应用程序的 `update.sh` shell 脚本：\n\n```\n$ ansible app -b -a \"/opt/myapp/scripts/update.sh\"\
  \n```\n\n即时命令对于简单的部署（如我们上面的示例）是没的，但如果你有复杂的应用程序或基础设施需求，应该使用本书后部分描述的更强大、灵活的 Ansible\
  \ 应用程序部署功能。请参考本书后面的“滚动更新（Rolling Updates）”章节。\n\n### Ansible 的 SSH 连接历史\n\nAnsible\
  \ 最强大的功能之一是可以在其管理的服务器上不运行任何额外的应用程序或守护进程。Ansible 不使用私有协议与服务器通信，而是使用标准的安全的 SSH 连接，这种连接通常用于今天运行的几乎所有\
  \ Linux 服务器的基础基础管理。\n\n由于稳定、快速且安全的 SSH 连接是 Ansible 通信能力的核心，Ansible 对 SSH 的实现在过去几年中不断改进——并且今天仍在改进。\n\
  \n所有 Ansible SSH 连接方法的的一个共同点是：Ansible 使用该连接将一个或多个定义 play 或命令的文件传输到远程服务器，然后运行该 play/命令，接着删除传输的文件，并报告结果。快速、稳定且安全的\
  \ SSH 连接对 Ansible 来说至关重要。\n\n#### Paramiko\n\n在开始，Ansible 仅使用 `paramiko` —— 这是一个用于\
  \ Python 的开源 SSH2 实现。然而，作为单一语言（Python）的单一库，`paramiko` 的开发速度跟不上 OpenSSH（几乎随处使用的 SSH\
  \ 标准实现）的发展速度，其性能和安全性略低于 OpenSSH。\n\nAnsible 继续支持使用 `paramiko`，甚至将其选为不支持 `ControlPersist`\
  \ 的系统（如 RHEL 6）的默认选项——`ControlPersist` 是仅适用于 OpenSSH 5.6 或更高版本的选项（`ControlPersist`\
  \ 允许 SSH 连接持久，因此通过 SSH 运行的频繁命令无需反复通过初始握手，直到达到服务器 SSH 配置中设置的 `ControlPersist` 超时）。\n\
  \n#### OpenSSH (默认)\n\n在 Ansible 1.3 中，Ansible 默认使用原生 OpenSSH 连接连接到支持 `ControlPersist`\
  \ 的服务器。Ansible 从 0.5 版本起就具有这种能力，但直到 1.3 版本才设置为默认。\n\n大多数本地 SSH 配置参数（如 hosts、密钥文件等）都会被遵循，但如果你需要通过\
  \ 22 端口（默认 SSH 端口）以外的端口连接，你应该在清单文件（`ansible_ssh_port` 选项）或运行 `ansible` 命令时指定端口。\n\
  \nOpenSSH 比 paramiko 更快，也稍微可靠，但还有其他方法可以让 Ansible 更快。\n\n#### 通过流水线（Pipelining）加速\
  \ OpenSSH\n\n现代版本的 Ansible 允许你改进 Ansible 默认 OpenSSH 实现的性能。\n\n与其复制文件、在远程服务器上运行然后删除它们，OpenSSH\
  \ 的“流水线”传输方法将直接通过 SSH 连接发送并执行大多数 Ansible 模块的命令。\n\n可以通过在 Ansible 配置文件`ansible.cfg`\
  \ 的 `[ssh_connection]` 部分下添加 `pipelining=True` 来启用这种连接方式（`ansible.cfg` 将在以后详细介绍）。\n\
  \n### 总结\n\n在本章中，你学习了如何使用 Vagrant 在本地工作站上构建用于测试的多服务器基础设施，并且在从未登录单台服务器的情况下配置、监控和管理了该基础设施。你还学习了\
  \ Ansible 如何连接到远程服务器，以及如何使用 `ansible` 命令快速地并行或逐个地在许多服务器上执行任务。\n\n到目前，你应该已经熟悉 Ansible\
  \ 的基础知识，并能够开始更高效地管理你自己的基础设施。\n\n# 第 4 章 - Ansible Playbooks\n\n### 威力 (Power plays)\n\
  \n与其他许多配置管理解决方案一样，Ansible 使用一种比喻来描述其配置文件。这些文件被称为 playbooks（剧本），它们列出了将在特定服务器或一组服务器上运行的任务集（术语中称为\
  \ plays）。在美式橄榄中，团队遵循一组预先写的剧本作为执行的基础以试图赢得比赛。在 Ansible 中，你编写 playbooks（描述将服务器带到特定状态的指令列表），然后在你的服务器上运行它们。\n\
  \nPlaybooks 使用 YAML(https://docs.ansible.com/ansible/latest/reference_appendices/YAMSyntax.html)编写，这是一种流行的简单易读语法。Playbooks\
  \ 可以包含在其他 playbooks 中，某些元数据和选项会导致在不同场景的服务器运行不同的 plays 或 playbooks。\n\n即时命令让 Ansible\
  \ 成为一个强大的工具；而 playbooks 将 Ansible 变成了顶尖的服务器供应和配置管理工具。\n\n大多数 DevOps 人员被 Ansible\
  \ 吸引是因为 shell 脚本（单次 shell 命令）可以直接转换为 Ansible plays。考虑以下脚本，它在 RHEL/CentOS 服务器上安装\
  \ Apache：\n\n**Shell 脚本 (Shell Script)**\n\n```\n1 # 安装 Apache。\n2 dnf install --quiet\
  \ -y httpd httpd-devel\n3 # 复制配置文件。\n4 cp httpd.conf /etc/httpd/conf/httpd.conf\n\
  5 cp httpd-vhosts.conf /etc/httpd/conf/httpd-vhosts.conf\n6 # 启动 Apache 并配置开机启动。\n\
  7 service httpd start\n8 chkconfig httpd on\n```\n\n要运行该 shell 脚本（在此例中为名为 `shell-script.sh`\
  \ 的文件），你可以直接从命令行调用它：\n\n```\n### (在 shell 脚本所在的目录)。\n$ ./shell-script.sh\n```\n\n\
  **Ansible Playbook**\n\n\n\n\n\n```\n ---\n- hosts: all\n\n  tasks:\n    - name:\
  \ Install Apache.\n      command: dnf install --quiet -y httpd httpd-devel\n   \
  \ - name: Copy configuration files.\n      command: >\n        cp httpd.conf /etc/httpd/conf/httpd.conf\n\
  \    - command: >\n        cp httpd-vhosts.conf /etc/httpd/conf/httpd-vhosts.conf\n\
  \    - name: Start Apache and configure it to run at boot.\n      command: service\
  \ httpd start\n    - command: chkconfig httpd on\n```\n\n要运行 Ansible Playbook（在本例中为一个名为\
  \ `playbook.yml` 且内容上述的文件），你可以使用 `ansible-playbook` 命令来调用它：\n\n```bash\n### (在 playbook\
  \ 所在的相同目录下)。\n$ ansible-playbook playbook.yml\n```\n\nAnsible 的强大之处在于，如果你知道如何编写标准的\
  \ shell 命令——即你已经使用了多年的那些命令——就可以快速过渡到使用 playbooks，然后当你有时间时，重新构建你的配置，以利用 Ansible 非常有用的功能。\n\
  \n在上面的 playbook 中，我们使用 Ansible 的 `command` 模块来运行标准的 shell 命令。我们还为每个任务指定了一个“名称”（name），因此当我们运行\
  \ playbook 时，任务在屏幕或日志中就会有一个人类可读的输出。`command` 模块还有一些其他技巧（我们稍后会看到），但现在请放心，shell 脚本可以直接转换为\
  \ Ansible playbooks，而不会有太大麻烦。\n\n上面的 playbook 执行效果与 shell 脚本完全相同，但通过使用 Ansible 的一些内置模块来处理繁重工作，你可以大幅改进这一点：\n\
  \n### 修改后的 Ansible Playbook - 现在具有幂等性！\n\n```\n ---\n- hosts: all\n  become: yes\n\
  \n  tasks:\n    - name: Install Apache.\n      dnf:\n        name:\n          -\
  \ httpd\n          - httpd-devel\n        state: present\n\n    - name: Copy configuration\
  \ files.\n      copy:\n        src: \"{{ item.src }}\"\n        dest: \"{{ item.dest\
  \ }}\"\n        owner: root\n        group: root\n        mode: 0644\n      with_items:\n\
  \        - src: httpd.conf\n          dest: /etc/httpd/conf/httpd.conf\n       \
  \ - src: httpd-vhosts.conf\n          dest: /etc/httpd/conf/httpd-vhosts.conf\n\n\
  \    - name: Make sure Apache is started now and at boot.\n      service:\n    \
  \    name: httpd\n        state: started\n        enabled: yes\n```\n\n现在我们开始进入状态了。让我带你浏览这个简单的\
  \ playbook：\n\n1. 第一行 `---` 是我们标记此文档为使用 YAML 语法的方式（类似于在 HTML 文档顶部使用 `<html>` 或在\
  \ PHP 代码块顶部使用 `<?php`）。\n2. 第二行 `- hosts: all` 定义了第一个（在本例中也是唯一的）play，并告诉 Ansible\
  \ 在它知道的所有 `all` 主机上运行该 play。\n3. 第三行 `become: yes` 告诉 Ansible 通过 `sudo` 运行所有命令，因此命令将以\
  \ root 用户运行。\n4. 第五行 `tasks:` 告诉 Ansible 后面的内容是作为此 play 的部分运行的任务列表。\n5. 第一个任务以 `name:\
  \ Install Apache.` 开始。`name` 并不是对你的服务器执行操作的模块；相反，它是为后续任务提供一个人类可读描述的方法。看到“Install\
  \ Apache”比看到 `dnf name=httpd state=present` 更直观……但如果你完全删掉 name 那行，也不会引起任何问题。\n \
  \   * 我们使用 `dnf` 模块来安装 Apache。我们不是使用命令 `dnf -y install httpd httpd-devel`，而是向 Ansible\
  \ 准确描述我们想要什么。Ansible 将采用我们提供的软件包列表。我们告诉 dnf 通过 `state: present` 确保软件包已安装，但我们也可以使用\
  \ `state: latest` 来确保安装最新版本，或使用 `state: absent` 来确保未安装软件包。\n6. 第二个任务同样以人类可读的名称开始（如果你愿意，也可以省略它）。\n\
  \    * 我们使用 `copy` 模块将文件从源（在我们本地工作站上）复制到目标（被管理的服务器）。我们还可以传递更多变量，例如包括所有权和权限的文件元数据（`owner`、`group`\
  \ 和 `mode`）。\n    * Ansible 允许使用 `with_items` 将变量列表传递给任务：定义一个项目列表，每个项目都将传递到 play\
  \ 中，并使用 `item` 变量引用（例如 `{{ item }}`）。\n    * 在这种情况下，我们使用一个包含字典（dicts）的项目列表用于变量替换；以以下格式定义字典列表中的每个元素以及每个列表项：\n\
  \        ```yaml\n        - src: httpd.conf\n          dest: /etc/httpd/conf/httpd.conf\n\
  \        - src: httpd-vhosts.conf\n          dest: /etc/httpd/conf/httpd-vhosts.conf\n\
  \        ```\n7. 第三个任务使用 `service` 模块确保 Apache 已经启动并设置了开机自启（`enabled: yes`）。\n\n\
  ### 使用 `ansible-playbook` 运行 Playbooks\n\n如果我们运行上面的 playbook（它们设置为在 `all` 主机上运行），那么\
  \ playbook 将针对清单文件中定义的每个主机运行。\n\n#### 针对特定主机和组限制 playbook\n\n你可以通过更改 `hosts:` 定义将\
  \ playbook 限制到特定的组或主机。该值可以设置为 `all` 主机、清单文件中定义的某个 `group`、多个组（例如 `webservers,dbservers`）、单个主机（例如\
  \ `atl.example.com`）或它们的混合。你甚至可以使用通配符匹配，如 `*.example.com`，来匹配顶级域名下的所有子域名。\n\n你还可以通过\
  \ `ansible-playbook` 命令限制运行 playbook 的主机：\n\n```bash\n$ ansible-playbook playbook.yml\
  \ --limit webservers\n```\n\n在这种情况下（假设你的清单文件中包含 `webservers` 组），即使 playbook 设置为\
  \ `hosts: all`，或者包含了 `webservers` 组定义之外的主机，它也只会在 `webservers` 定义的主机上运行。\n\n你还可以将\
  \ playbook 限制为一个特定的主机：\n\n```bash\n$ ansible-playbook playbook.yml --limit xyz.example.com\n\
  ```\n\n如果你想在实际运行 playbook 之前查看受影响的主机列表，请使用 `--list-hosts`：\n\n```bash\n$ ansible-playbook\
  \ playbook.yml --list-hosts\n```\n\n\n\n\n运行此命令应得到如下输出：\n\n```\nplaybook: playbook.yml\n\
  \n  play #1 (all): host count=4\n    127.0.0.1\n    192.168.24.2\n    foo.example.com\n\
  \    bar.example.com\n```\n\n（其中 `count` 是你在清单文件中定义的服务器数量，后面是你在清单文件中定义的所有主机列表）。\n\
  \n## 使用 `ansible-playbook` 设置用户和 sudo 选项\n\n如果剧 book 中的 `hosts` 旁没有定义 `remote_user`，Ansible\
  \ 假设你将以在清单文件中为特定主机定义的用户身份进行连接，然后将回退到你的本地用户账户。你可以使用 `--user` (`-u`) 选项显式定义用于远程剧本的远程用户：\n\
  \n```\n$ ansible-playbook playbook.yml --user=johndoe\n```\n\n在某些情况下，你需要将 sudo 密码传递给远程服务器，以便通过\
  \ `sudo` 执行命令。在这些情况下，你需要使用 `--ask-become-pass` (`-K`) 选项。你也可以通过 `--become` (`-b`)\
  \ 显式强制剧本中的所有任务使用 sudo。最后，你可以使用 `--become-user` 选项定义通过 `sudo` 运行的任务的 sudo 用户（默认为\
  \ `root`）。\n\n例如，以下命令将使用 sudo 运行我们的示例剧本，以 sudo 用户 `janedoe` 的身份执行任务，Ansible 将提示你输入\
  \ sudo 密码：\n\n```\n$ ansible-playbook playbook.yml --become --become-user=janedoe\
  \ \\\n--ask-become-pass\n```\n\n如果你没有使用基于密钥的认证来连接到服务器（请阅读第 1 章关于这样做安全影响的警告），你可以使用\
  \ `--ask-pass`。\n\n## `ansible-playbook` 的其他选项\n\n`ansible-playbook` 命令还允许一些其他常用选项：\n\
  \n*   `--inventory=PATH` (`-i PATH`): 定义自定义清单文件（默认是默认 Ansible 清单文件，通常位于 `/etc/ansible/hosts`）。\n\
  *   `--verbose` (`-v`): 详细模式（显示所有输出，包括成功选项的输出）。你可以传递 `-vvvv` 来提供每个细微细节。\n*   `--extra-vars=VARS`\
  \ (`-e VARS`): 定义剧本中使用的变量，格式为 `\"key=value,key=value\"`。\n*   `--forks=NUM` (`-f\
  \ NUM`): 分叉数（整数）。将此值设置为大于 5 的数字可以增加 Ansible 并发运行任务的服务器数量。\n*   `--connection=TYPE`\
  \ (`-c TYPE`): 将使用的连接类型（默认为 `ssh`；你有时可能想使用 `local` 在本地机器上运行剧本，或通过 cron 在远程服务器上运行剧本）。\n\
  *   `--check`: 在检查模式（“干运行”）下运行剧本；剧本中定义的所有任务将对所有主机进行检查，但不会不会实际执行。\n\n还有一些其他重要的选项和配置变量可以充分发挥\
  \ `ansible-playbook` 的作用，但这些已经足够让你在自己的服务器或虚拟机上开始运行本章的剧本了。\n\n## 真实世界剧本：Rocky Linux\
  \ Node.js 应用服务器\n\n第一个示例虽然对于可能想在陈旧的 Apache 服务器上发布简单静态网页的人很有帮助，但它并不是真实场景的良好代表。我将运行执行许多不同操作的复杂剧本，其中大部分今天实际上被用于管理生产基础设施。\n\
  \n第一个剧本将配置一个带有 Node.js 的 Rocky Linux 服务器，并安装启动一个简单的 Node.js 。服务器将具有非常简单的架构：\n\n\
  ![Node.js app on Rocky Linux.](img/4-playbook-nodejs.png)\n\nRocky Linux 上的 Node.js\
  \ 应用。\n\n为了开始，我们需要创建一个 YAML 文件（在本例中为 `playbook.yml`）来包含我们的剧本。让我们保持简单：\n\n```\n1\
  \ ---\n2 - hosts: all\n3   become: yes\n4 \n5   vars:\n6     node_apps_location:\
  \ /usr/local/opt/node\n7 \n8   tasks:\n```\n\n首先，定义一组运行此剧本的主机（`all`）（见上文关于将剧本限制为特定组和主机的部分），然后告诉\
  \ Ansible 以 root 权限运行剧本（因为我们需要安装和配置系统包）。\n\n接下来，我们可以直接在剧本中定义 `vars`（剧本变量）；在这种情况下，我们添加了\
  \ `node_apps_location` 变量，以便用它来识别我们的 Node.js 应用将所在的位置。\n\n最后，剧本需要在主机上执行某些操作，因此我们添加了\
  \ `tasks` 部分，很快就会填充它。\n\n### 添加额外的存储\n\n添加额外的软件包（`dnf` 或 `apt`）是许多管理员在服务器上进行任何其他工作之前会做的事情，以确保某些包可用，或者比基础安装中的版本更高。\n\
  \n在下面的 脚本中，我们想要同时添加 EPEL 和 Remi 存储，这样我们就可以获取像 Node.js 或其他必要的软件更高版本（这些示例假设你以 `root`\
  \ 用户身份运行 Rocky Linux）：\n\n```\n 1 # Install EPEL repo.\n 2 dnf install -y epel\n\
  ```\n\n\n\n\n6. 由于 `NPM` 现在已经安装，我们使用 Ansible 的 `npm` 模块来安装一个 Node.js 工具 `forever`，用于启动我们的应用并保持其运行。将\
  \ `global` 设置为 `yes` 会告诉 `NPM` 将 `forever` node 模块安装到 `/usr/lib/node_modules/`，以便系统上的所有用户和\
  \ Node.js 应用程序可以使用它。\n\n我们开始搭建一个不错的 Node.js 应用服务器了。让我们设置一个在 80 端口响应 HTTP 请求的简单 Node.js\
  \ 应用吧。\n\n### 部署 Node.js 应用\n\n下一步是在我们的服务器上安装一个简单的 Node.js 应用。首先，我们通过在与你的 `playbook.yml`\
  \ 相同的目录下创建一个名为 `app` 的新文件夹，创建一个非常简单的 Node.js 应用。在此文件夹中创建一个新文件 `app.js`，其内容如下：\n\n\
  ```\n 1 // 加载 express 模块。\n 2 var express = require('express');\n 3 var app = express();\n\
  \ 4 \n 5 // 对 / 的请求响应 'Hello World'。\n 6 app.get('/', function(req, res){\n 7  \
  \   res.send('Hello World!');\n 8 });\n 9 \n10 // 监听 80 端口（类似于真正的 Web 服务器）。\n11\
  \ app.listen(80, () => console.log('Express server started successfully.'\\\n12\
  \ ));\n```\n\n不要担心语法或这是 Node.js 的事实。我们只需要一个快速用于部署的示例。这个示例可以用 Python、Perl、Java、PHP\
  \ 或其他语言编写，但由于 Node 是一种运行在轻量级环境中的简单语言（JavaScript），在测试事物或探测你的服务器时，它是非常易用的语言。\n\n由于这个小应用依赖\
  \ Express（一个用于 Node 的 http 框架），我们还需要通过 `app.js` 相同目录下的 `package.json` 文件告诉 `NPM`\
  \ 这一依赖关系：\n\n```\n1 {\n2   \"name\": \"examplenodeapp\",\n3   \"description\": \"\
  Example Express Node.js app.\",\n4   \"author\": \"Jeff Geerling <geerlingguy@mac.com>\"\
  ,\n5   \"dependencies\": {\n6     \"express\": \"4.x\"\n7   },\n8   \"engine\":\
  \ \"node >= 10.0.2\"\n9 }\n```\n\n我们需要将整个应用拷贝到服务器，然后让 `NPM` 下载所需的依赖项（在此情况下为 `express`），因此将这些任务添加到你的\
  \ playbook 中：\n\n```\n31     - name: Ensure Node.js app folder exists.\n32     \
  \  file: \"path={{ node_apps_location }} state=directory\"\n33 \n34     - name:\
  \ Copy example Node.js app to server.\n35       copy: \"src=app dest={{ node_apps_location\
  \ }}\"\n36 \n37     - name: Install app dependencies defined in package.json.\n\
  38       npm: path={{ node_apps_location }}/app\n```\n\n首先，我们使用 `file` 模块确保安装应用的的目录存在。\n\
  \n其次，我们使用 Ansible 的 `copy` 命令将整个应用文件夹拷贝到服务器，该命令能够智能地区分单个文件或文件目录，并递归地遍历目录，这类似于递归的\
  \ `scp` 或 `rsync`。\n\n第三，我们再次使用 `npm`，这次除了应用路径外没有其他额外参数。这告诉 `NPM` 解析 `package.json`\
  \ 文件并确保所有依赖项都已存在。\n\n我们*几乎*完成了！最后一步是启动应用。\n\n### 启动 Node.js 应用\n\n我们现在使用 `forever`（我们之前安装的）来启动应用。\n\
  \n```\n41     - name: Check list of running Node.js apps.\n42       command: /usr/local/bin/forever\
  \ list\n43       register: forever_list\n44       changed_when: false\n45 \n46 \
  \    - name: Start example Node.js app.\n47       command: \"/usr/local/bin/forever\
  \ start {{ node_apps_location }}/a\\\n48 pp/app.js\"\n49       when: \"forever_list.stdout.find(node_apps_location\
  \ + \\\n50 '/app/app.js') == -1\"\n```\n\n在第一个任务中，我们正在做两个新操作：\n\n1. `register` 创建了一个新变量\
  \ `forever_list`，用于下一个任务以决定何时运行该任务。`register` 将定义命令的输出（`stdout`、`stderr`）存储在传递给它的变量名中。\n\
  \n2. `changed_when` 显式告诉 Ansible 何时此任务会导致服务器更改。在这种情况下，我们知道 `forever list` 命令永远不会更改服务器，所以我们只需说\
  \ `false`——执行命令时服务器永远不会发生变化。\n\n第二个任务实际上使用 `Forever` 启动应用。我们也可以通过调用 `node {{ node_apps_location\
  \ }}/app/app.js` 来启动应用，但我们无法轻松控制该进程，而且还需要使用 `nohup` 和 `&` 来避免 Ansible 挂起在该任务上。\n\
  \n`Forever` 会跟踪它管理的 Node 应用，我们使用 `Forever` 的 `list` 选项来打印运行应用的列表。当我们第一次运行此 playbook\
  \ 时，列表显然是空的——但在未来的运行中，如果应用正在运行，列表将显示它。\n\n### Node.js 应用总结\n\n到此时，你已经有一个在 80 端口响应\
  \ HTTP 请求的简单 Node.js 应用。我们已经使用 Ansible 设置了环境、管理了依赖并启动了应用程序。\n\n\n\n\n\n要从任务中调用此处理器，请在\
  \ play 中的任何任务中添加 `notify: restart apache` 。我们定义了这个处理器，以便在配置发生更改后重启 `apache2` 服务，将在下文中进行解释。\n\
  \n## 基础 LAMP 服务器设置\n\n构建依赖 LAMP 堆栈的应用程序服务器的第一步是构建其实际 LAMP 部分。这是最简单的过程，但对于我们特定的服务器，仍然需要一些额外工作。我们要安装\
  \ Apache、MySQL 和 PHP，但还需要另外几个依赖项。\n\n```yaml\n16   tasks:\n17     - name: Get software\
  \ for apt repository management.\n18       apt:\n19         state: present\n20 \
  \        name:\n21           - python3-apt\n22           - python3-pycurl\n23 \n\
  24     - name: Add ondrej repository for later versions of PHP.\n25       apt_repository:\
  \ repo='ppa:ondrej/php' update_cache=yes\n26 \n27     - name: \"Install Apache,\
  \ MySQL, PHP, and other dependencies.\"\n28       apt:\n29         state: present\n\
  30         name:\n31           - acl\n32           - git\n33           - curl\n\
  34           - unzip\n35           - sendmail\n36           - apache2\n37      \
  \     - php8.2-common\n38           - php8.2-cli\n39           - php8.2-dev\n40\
  \           - php8.2-gd\n41           - php8.2-curl\n42           - php8.2-opcache\n\
  43           - php8.2-xml\n44           - php8.2-mbstring\n45           - php8.2-pdo\n\
  46           - php8.2-mysql\n47           - php8.2-apcu\n48           - libpcre3-dev\n\
  49           - libapache2-mod-php8.2\n50           - python3-mysqldb\n51       \
  \    - mysql-server\n52 \n53     - name: Disable the firewall (since this is for\
  \ local dev only).\n54       service: name=ufw state=stopped\n55 \n56     - name:\
  \ \"Start Apache, MySQL, and PHP.\"\n57       service: \"name={{ item }} state=started\
  \ enabled=yes\"\n58       with_items:\n59         - apache2\n60         - mysql\n\
  ```\n\n在这个 playbook 中，我们从一个通用的 LAMP 设置开始：\n\n1. 安装一些辅助库，允许 Python 能够更精确地管理 apt（`python3-apt`\
  \ 和 `python3-pycurl` 是 `apt_repository` 模块执行工作所必需的）。\n2. 安装一个额外的 `apt` PPA，这将允许安装比默认系统存储库中更高版本的\
  \ PHP。\n3. 安装我们 LAMP 服务器所需的所有包（包括 Drupal 所需的所有 PHP 扩展）。\n4. 出于测试目的，完全禁用防火墙。如果是在生产服务器或任何暴露在互联网上的服务器上，您应该使用限制性防火墙，仅允许访问端口\
  \ 22、80、443 和其他必要的端口。\n5. 启动所有所需的服务，并确保它们已设置为系统启动时自动启动。\n\n## 配置 Apache\n\n下一步是配置\
  \ Apache，使其能与 Drupal 正常工作。默认情况下，Apache 可能未启用 `mod_rewrite`。为了解决这种情况，您可以使用命令 `sudo\
  \ a2enmod rewrite`，但 Ansible 有一个方便的 `apache2_module` 模块可以以幂等的方式完成任务。\n\n我们还需要添加一个\
  \ VirtualHost 条目，为 Apache 提供网站的文档根以及该网站的其他选项。\n\n```yaml\n63     - name: Enable\
  \ Apache rewrite module (required for Drupal).\n64       apache2_module: name=rewrite\
  \ state=present\n65       notify: restart apache\n66 \n67     - name: Add Apache\
  \ virtualhost for Drupal.\n68       template:\n69         src: \"templates/drupal.test.conf.j2\"\
  \n70         dest: \"/etc/apache2/sites-available/{{ domain }}.test.conf\"\n71 \
  \        owner: root\n72         group: root\n73         mode: 0644\n74       notify:\
  \ restart apache\n75 \n76     - name: Enable the Drupal site.\n77       command:\
  \ >\n78         a2ensite {{ domain }}.test\n79         creates=/etc/apache2/sites-enabled/{{\
  \ domain }}.test.conf\n80       notify: restart apache\n81 \n82     - name: Disable\
  \ the default site.\n83       command: >\n84         a2dissite 000-default\n85 \
  \        removes=/etc/apache2/sites-enabled/000-default.conf\n86       notify: restart\
  \ apache\n```\n\n第一条命令通过将 `/etc/apache2/mods-available` 中的模块链接到 `/etc/apache2/mods-enabled`\
  \ 来启用所有所需的 Apache 模块。\n\n第二条命令将我们在 `templates` 文件夹中定义的 Jinja 模板复制到 Apache 的 `sites-available`\
  \ 文件夹中，并设置正确的所有者和权限。此外，我们 `notify` 了 `restart apache` 处理器，因为复制一个新的 VirtualHost 意味着\
  \ Apache 需要重启以采用更改。\n\n让我们来看看我们的 Jinja 模板：\n\n```apache\n<VirtualHost *:80>\n  \
  \  ServerAdmin webmaster@localhost\n    ServerName {{ domain }}.test\n    ServerAlias\
  \ www.{{ domain }}.test\n    DocumentRoot /var/www/html\n    <Directory /var/www/html>\n\
  \        Options FollowSym Indexes\n        AllowOverride All\n        Require all\
  \ granted\n    </Directory>\n</VirtualHost>\n```\n\n这是一个标准的 VirtualHost，但我们还需要一个变量：`domain`。\n\
  \n## 使用 `lineinfile` 配置 PHP\n\n我们之前在书中讨论文件管理和即时任务执行时简要提到了 `lineinfile`。修改 PHP 的配置是演示\
  \ `lineinfile` 功能的完美方式：\n\n```yaml\n88     - name: Adjust OpCache memory setting.\n\
  89       lineinfile:\n90         dest: \"/etc/php/8.2/apache2/conf.d/10-opcache.ini\"\
  \n91         regexp: \"^opcache.memory_consumption\"\n92         line: \"opcache.memory_consumption\
  \ = 96\"\n93         state: present\n94       notify: restart apache\n```\n\nAnsible\
  \ 的 `lineinfile` 模块执行一个简单的任务：确保文件中存在（或不存在）特定的文本行。\n\n在这个例子中，我们需要调整 PHP 默认的 `opcache.memory_consumption`\
  \ 选项，以便 Drupal 代码库可以编译到 PHP 的系统内存中，从而获得更快的页面加载速度。\n\n\n\n\n\n## 配置 MySQL\n\n下一步是为我们的\
  \ Drupal 安装创建一个数据库和用户（命名为我们之前指定的域名）。\n\n```\n 96     - name: Create a MySQL database\
  \ for Drupal.\n 97       mysql_db: \"db={{ domain }} state=present\"\n 98 \n 99\
  \     - name: Create a MySQL user for Drupal.\n100       mysql_user:\n101      \
  \   name: \"{{ domain }}\"\n102         password: \"1234\"\n103         priv: \"\
  {{ domain }}.*:ALL\"\n104         host: localhost\n105         state: present\n\
  ```\n\n## 安装 Composer\n\n如果愿意，我们可以从 Drupal.org 手动下载 Drupal，然后使用浏览器运行安装向导，但那是你在学习使用\
  \ Ansible 进行自动化操作之前会的方法！\n\n相反，我们将完全通过自动化方式来设置 Drupal 代码库并安装 Drupal。Drupal 使用 Composer\
  \ 来配置其代码库并管理 PHP 依赖，因此第一步是在服务器上安装 Composer。\n\n```\n107     - name: Download Composer\
  \ installer.\n108       get_url:\n109         url: https://getcomposer.org/installer\n\
  110         dest: /tmp/composer-installer.php\n111         mode: 0755\n112 \n113\
  \     - name: Run Composer installer.\n114       command: >\n115         php composer-installer.php\n\
  116         chdir=/tmp\n117         creates=/usr/local/bin/composer\n118 \n119 \
  \    - name: Move Composer into globally-accessible location.\n120       command:\
  \ >\n121         mv /tmp/composer.phar /usr/local/bin/composer\n122         creates=/usr/local/bin/composer\n\
  ```\n\n前两个命令下载并运行基于 PHP 的 Composer 安装程序，它会在 `/tmp` 中生成一个 `composer.phar` PHP 应用程序包。然后，该归包（使用\
  \ `mv` shell 命令）被复制到 `/usr/local/bin/composer` 位置，这样我们就可以使用 `composer` 命令来安装 Drush\
  \ 的所有依赖项。后两个命令被设置为仅在 `/usr/local/bin/composer` 文件不存在时运行（使用 `creates` 参数）。\n\n##\
  \ 使用 Composer 创建 Drupal 项目\n\n现在我们已经有了 Composer，可以使用 Composer 的 `create-project`\
  \ 命令创建一个 Drupal 项目了。该命令会将 Drupal 核心及其所有推荐的依赖项下载到服务器上的文件夹中：\n\n```\n124     - name:\
  \ Ensure Drupal directory exists.\n125       file:\n126         path: \"{{ drupal_core_path\
  \ }}\"\n127         state: directory\n128         owner: www-data\n129         group:\
  \ www-data\n130 \n131     - name: Check if Drupal project already exists.\n132 \
  \      stat:\n133         path: \"{{ drupal_core_path }}/composer.json\"\n134  \
  \     register: drupal_composer_json\n135 \n136     - name: Create Drupal project.\n\
  137       composer:\n138         command: create-project\n139         arguments:\
  \ drupal/recommended-project \"{{ drupal_core_path }}\"\n140         working_dir:\
  \ \"{{ drupal_core_path }}\"\n141         no_dev: true\n142       become_user: www-data\n\
  143       when: not drupal_composer_json.stat.exists\n```\n\n首先，我们必须确保存储 Drupal\
  \ 的目录存在，并且由 Apache 用户 `www-data` 所有。\n\n接下来，为了实现幂等性（idempotence），我们将检查项目是否已经存在，通过查看目录中是否存在\
  \ `composer.json` 文件（Composer 为任何新 PHP 项目创建该文件）来实现。\n\n最后，如果该文件不存在，我们将使用 Ansible\
  \ 的 `composer` 模块来创建 Drupal 项目。`no_dev` 告诉 Composer 不要安装任何 Drupal 开发依赖项，例如在生产服务器上可能没有帮助的测试工具。\n\
  \n`composer` 任务等同于直接运行以下 Composer 命令：\n\n```\n$ composer create-project drupal/recommended-project\
  \ /var/www/drupal --\\\nno-dev\n```\n\n我们在此任务中使用 Ansible 的 `become_user` 特性，使其以\
  \ Apache 用户 `www-data` 的身份运行。Drupal 将通过 Apache 访问，如果我们以默认的 `root` 用户创建项目，某些文件将无法被\
  \ Apache Web 服务器访问，从而导致错误。\n\n## 使用 Drush 安装 Drupal\n\nDrupal 有一个形式为 Drush 的命令行辅助。Drush\
  \ 是独立于 Drupal 开发的，提供了一套完整的 CLI 命令来管理 Drupal。Drush 与大多数现代 PHP 工具一样，可以通过 Composer\
  \ 安装，因此我们可以通过 Ansible 的 `composer` 模块使用 `require` 命令将 Drush 添加到 Drupal 项目中。\n\n\
  一旦安装了 Drush，我们就可以用它来安装 Drupal：\n\n```\n145     - name: Add drush to the Drupal site\
  \ with Composer.\n146       composer:\n147         command: require\n148       \
  \  arguments: drush/drush:11.*\n149         working_dir: \"{{ drupal_core_path }}\"\
  \n150       become_user: www-data\n151       when: not drupal_composer_json.stat.exists\n\
  152 \n153     - name: Install Drupal.\n154       command: >\n155         vendor/bin/drush\
  \ si\n156         --db-name={{ domain }}\n157         --db-user={{ domain }}\n158\
  \         --db-password=1234\n159         --db-host=localhost\n160         --site-name={{\
  \ domain }}\"\n161         --account-name=\"admin\"\n162         --account-email=\"\
  admin@example.com\"\n163         --account-password=\"1234\"\n164         --bash-install\n\
  165         chdir={{ drupal_core_path }}\n166       become_user: www-data\n167 \
  \      notify: restart apache\n```\n\n\n\n\n```\n1 ---\n2 download_dir: /tmp\n3\
  \ solr_dir: /opt/solr\n4 solr_version: 8.6.0\n5 solr_checksum: sha512:6b0d618069e37215f305d9a61a3e65be2b9cfc32a3689ea6a\\\
  \n6 25be2f220b1ecc96a644ecc31c81e335a2dfa0bc8b7d0f2881ca192c36fd435cdd832fd\\\n\
  7 309a9ddb\n```\n\n这些变量定义了我们在下载和安装 Apache Solr 时使用的两个路径，以及下载 Apache Solr 源码的版本和文件下载校验和。\n\
  \n在我们的 playbook 中，在 `vars_files` 之后，我们还需要确保 apt 缓存是最新的，像上一个示例一样使用 `pre_tasks`：\n\
  \n```\n 8   pre_tasks:\n 9     - name: Update apt cache if needed.\n10       apt:\
  \ update_cache=true cache_valid_time=3600\n```\n\n### 安装 Java\n\n在 Ubuntu 上安装 Java\
  \ 非常简单，因为它在默认的 apt 仓库中。我们只需要确保安装了正确的包：\n\n```\n16   tasks:\n17     - name: Install\
  \ Java.\n18       apt: name=openjdk-11-jdk state=present\n```\n\n这太简单了！我们使用了 `apt`\
  \ 模块来安装了 `openjdk-11-jdk`。\n\n### 安装 Apache Solr\n\nUbuntu 的 LTS 版本包含 Apache Solr\
  \ 的包，但它安装的是旧版本，因此我们将从源码安装最新版本的 Solr。第一步是下载源码：\n\n```\n20     - name: Download Solr.\n\
  21       get_url:\n22         url: \"https://archive.apache.org/dist/lucene/solr/\\\
  \n23 {{ solr_version }}/solr-{{ solr_version }}.tgz\"\n24         dest: \"{{ download_dir\
  \ }}/solr-{{ solr_version }}.tgz\"\n25         checksum: \"{{ solr_checksum }}\"\
  \n```\n\n当从远程服务器下载文件时，`get_url` 模块比原始的 `wget` 或 `curl` 命令提供了更高的灵活性便利性。\n\n你必须向 `get_url`\
  \ 传递一个 `url`（要下载的文件源）和一个 `dest`（文件下载所在的位置）。如果你向 `dest` 参数传递一个目录，Ansible 将把文件放在其中，但后续运行\
  \ playbook 时它将总是重新下载该文件（如果它已更改，则覆盖现有的下载文件）。为了避免这种额外开销，我们为下载的文件提供了完整路径。\n\n我们还使用了可选参数\
  \ `checksum` 以万无一失；如果你正在下载对应用程序功能和安全至关重要的文件或压缩包，检查文件以确保它与你预期的完全一致是一个好主意。`checksum`\
  \ 会将下载文件中数据的哈值与你指定的哈值（该哈值在 Apache Solr 网站的下载页面一并提供）进行比较。如果校验和与提供的哈值不匹配，Ansible 将失败并丢弃新下载的（无效）文件。\n\
  \n我们需要解压 Solr 压缩包，以便运行其中的安装程序，并可以使用 `creates` 选项使此操作具有幂等性：\n\n```\n26     - name:\
  \ Expand Solr.\n27       unarchive:\n28         src: \"{{ download_dir }}/solr-{{\
  \ solr_version }}.tgz\"\n29         dest: \"{{ download_dir }}\"\n30         remote_src:\
  \ true\n31         creates: \"{{ download_dir }}/solr-{{ solr_version }}/\\\n32\
  \ README.txt\"\n```\n\n现在源码已经存在，运行 Apache Solr 安装脚本（位于 Solr 压缩包的 `bin` 目录下）来完成 Solr\
  \ 安装：\n\n```\n33     - name: Run Solr installation script.\n34       command: >\n\
  35         {{ download_dir }}/solr-{{ solr_version }}/bin/install_solr_ser\\\n36\
  \ vice.sh\n37         {{ download_dir }}/solr-{{ solr_version }}.tgz\n38       \
  \  -i /opt\n39         -d /var/solr\n40         -u solr\n41         -s solr\n42\
  \         -p 8983\n43         creates={{ solr_dir }}/bin/solr\n```\n\n在这个示例中，传递给安装器的选项是硬编码的（例如\
  \ `-p 8983` 告诉 Apache Solr 运行在端口 `8983`），这种方式运行良好，但如果你打算将此 playbook 复用于许多不同类型的 Solr\
  \ 服务器，你可能应该用 `vars.yml` 中定义的变量来配置许多此类选项。这个练习留给读者完成。\n\n最后，我们需要一个在 playbook 结束时运行的任务，以确保\
  \ Apache Solr 已启动并在系统启动时自动启动：\n\n```\n44     - name: Ensure solr is started and\
  \ enabled on boot.\n45       service: name=solr state=started enabled=yes\n```\n\
  \n\n\n\n*   Handlers（处理器）只有在任务通知了 handler 的情况下才会运行；如果某个本该通知 handler 的任务由于 `when`\
  \ 条件或类似原因被跳过，则该 handler 将不会运行。\n*   Handlers 将在 play（剧目）结束时运行一次且仅运行一次。如果你绝对需要覆盖此行为并在\
  \ playbook（剧本）的执行过程中运行 handlers，可以使用 `meta` 模块来实现（例如：`- meta: flush_handlers`）。\n\
  *   如果 play 在某个特定主机（或所有主机）上在通知 handlers 之前失败了，则 handlers 将永远不会运行。如果你希望在 playbook\
  \ 失败后也始终运行 handlers，可以使用上述描述的 `meta` 模块作为 playbook 中的某一个独立任务，或者在运行 playbook 时使用命令行参数\
  \ `--force-handlers`。对于在 playbook 运行期间变得不可触达的主机，handlers 将不会在它们上运行。\n\n### 环境变量\n\
  \nAnsible 允许你以多种方式处理环境变量。。首先，如果你需要为远程用户账户设置某些环境变量，可以通过向远程用户的 `.bash_profile` 文件中添加行来实现，如下所示：\n\
  \n```\n- name: Add an environment variable to the remote user's shell.\n  lineinfile:\n\
  \    dest: ~/.bash_profile\n    regexp: '^ENV_VAR='\n    line: \"ENV_VAR=value\"\
  \n```\n\n所有后续任务都将拥有此环境变量（请记住，只有 `shell` 模块会理解使用环境变量的 shell 命令！）。要在后续任务中使用环境变量，建议你使用任务的\
  \ `register` 选项将环境变量存储在 Ansible 后后可以使用变量中，例如：\n\n```\n 1 - name: Add an environment\
  \ variable to the remote user's shell.\n 2   lineinfile:\n 3     dest: ~/.bash_profile\n\
  \ 4     regexp: '^ENV_VAR='\n 5     line: \"ENV_VAR=value\"\n 6 \n 7 - name: Get\
  \ the value of the environment variable we just added.\n 8   shell: 'source ~/.bash_profile\
  \ && echo $ENV_VAR'\n 9   register: foo\n10 \n11 - name: Print the value of the\
  \ environment variable.\n12   debug:\n13     msg: \"The variable is {{ foo.stdout\
  \ }}\"\n```\n\n我们在第 8 行使用 `source ~/.bash_profile` 是因为 Ansible 需要确保它正在为远程用户使用最新的环境配置。在某些情况下，任务都是通过持久或准缓存的\
  \ SSH 会话运行的，在该会话中 `$ENV_VAR` 可能尚未定义。\n\n（这也是 `debug` 模块首次出现。稍后我们将与其他调试技术一起更深入地探讨）。\n\
  \nLinux 还会读取添加到 `/etc/environment` 的全局环境变量，因此你可以在那里添加变量：\n\n```\n- name: Add a global\
  \ environment variable.\n  lineinfile:\n    dest: /etc/environment\n    regexp:\
  \ '^ENV_VAR='\n    line: \"ENV_VAR=value\"\n  become: yes\n```\n\n在任何情况下，使用 `lineinfile`\
  \ 在服务器上管理环境变量都是相当。如果你的应用程序需要很多环境变量（许多 Java 就是如此），你可能考虑使用 `copy` 或 `template` 配合本地文件，而不是使用带有大量列表的\
  \ `lineinfile`。\n\n### 任务级环境变量\n\n你还可以使用任务的 `environment` 选项为某一个任务设置环境。例如，假设你需要为某个文件下载设置\
  \ http 代理。可以通过以下方式实现：\n\n```\n- name: Download a file, using example-proxy as a\
  \ proxy.\n  get_url:\n    url: http://www.example.com/file.tar.gz\n    dest: ~/Downloads/\n\
  \  environment:\n    http_proxy: http://example-proxy:80/\n```\n\n这可能是相当繁琐的，当你有许多需要代理或其他环境变量的任务时。在这种情况下，你可以通过\
  \ playbook 中 `vars` 部分的变量（或通过包含的变量文件）传递环境，如下所示：\n\n```yaml\nvars:\n  proxy_vars:\n\
  \    http_proxy: http://example-proxy:80/\n    https_proxy: https://example-proxy:443/\n\
  \    [etc...]\n\ntasks:\n- name: Download a file, using example-proxy as a proxy.\n\
  \  get_url:\n    url: http://www.example.com/file.tar.gz\n    dest: ~/Downloads/\n\
  \  environment: proxy_vars\n```\n\n如果需要在系统范围内设置代理（如许多企业防火墙后的情况），我喜欢使用全局的 `/etc/environment`\
  \ 文件来完成：\n\n```yaml\n 1 # 在 playbook 的 'vars' 部分中（设置为 'absent' 以删除）：\n 2 proxy_state:\
  \ present\n 3 \n 4 # 在 playbook 的 'tasks' 部分中：\n 5 - name: Configure the proxy.\n\
  \ 6   lineinfile:\n 7     dest: /etc/environment\n 8     regexp: \"{{ item.regexp\
  \ }}\"\n 9     line: \"{{ item.line }}\"\n10     state: \"{{ proxy_state }}\"\n\
  11   with_items:\n12     - regexp: \"^http_proxy=\"\n13       line: \"http_proxy=http://example-proxy/80/\"\
  \n14     - regexp: \"^https_proxy=\"\n15       line: \"https_proxy=https://example-proxy/443/\"\
  \n```\n\n\n\n\n\n```yaml\n---\n- hosts: example\n  pre_tasks:\n    - include_vars:\
  \ \"{{ item }}\"\n      with_first_found:\n        - \"apache_{{ ansible_os_family\
  \ }}.yml\"\n        - \"apache_default.yml\"\n\n  tasks:\n    - name: Ensure Apache\
  \ is running.\n      service:\n        name: \"{{ apache_service_name }}\"\n   \
  \     state: running\n```\n\n然后，在与你的示例 playbook 相同的目录下添加两个文件：`apache_RedHat.yml`\
  \ 和 `apache_default.yml`。在 CentOS 文件中定义变量 `apache_service_name: httpd`，在默认文件中定义\
  \ `apache_service_name: apache2`。\n\n只要你不禁掉 `gather_facts`（或者你在某个时间点运行了 `setup`\
  \ 任务来手动收集事实信息），Ansible 就会将服务器的操作系统 存储在变量 `ansible_os_family` 中，并包含该结果命名的变量文件。如果\
  \ Ansible 找不到该命名的文件，它将使用从 `apache_default.yml` 加载的变量。因此，在 Debian 或 Ubuntu 服务器上，Ansible\
  \ 会正确地使用 `apache2` 作为服务名称，即使没有 `apache_Debian.yml` 或 `apache_Ubuntu.yml` 文件。\n\n\
  ### 清单变量\n\n变量也可以通过 Ansible 清单文件添加，可以是内联在主机定义中的，也可以在组之后定义：\n\n```ini\n## 主机特定变量（内联定义）。\n\
  [washington]\napp1.example.com proxy_state=present\napp2.example.com proxy_state=absent\n\
  \n## 为整个组定义的变量。\n[washington:vars]\ncdn_host=washington.static.example.com\napi_version=3.0.1\n\
  ```\n\n如果你需要定义多个变量，特别是适用于一个或两个主机以外的变量，清单文件可能会变得繁琐。事实上，Ansible 的文档建议*不要*在清单中存储变量。相反，你可以使用特定路径下的\
  \ `group_vars` 和 `host_vars` YAML 变量文件，Ansible 会将它们分配给清单清单中定义的单个主机和组。\n\n例如，若要将一组变量应用到主机\
  \ `app1.example.com`，请在 `/etc/ansible/host_vars/app1.example.com` 处创建一个名为 `app1.example.com`\
  \ 的空文件，并像在包含的 `vars_files` YAML 文件中一样添加变量：\n\n```yaml\n---\nfoo: bar\nbaz: qux\n\
  ```\n\n若要将一组变量应用到整个 `washington` 组，请在 `/etc/ansible/group_vars/washington` 创建一个类似的文件（将\
  \ `washington` 替换为你正在定义的任何组名）。\n\n你也可以将这些文件（使用相同的命名）放在 playbook 目录下的 `host_vars`\
  \ 或 `group_vars` 目录中。Ansible 会优先使用清单 `/etc/ansible/[host|group]_vars` 目录中定义的变量（如果存在相应的文件），然后才使用\
  \ playbook 目录中定义的变量。\n\n使用 `host_vars` 和 `group_vars` 的另一种替代方案是使用上面提到的条件变量文件导入。\n\
  \n### 注册变量\n\n在很多情况下，你可能想要运行一个命令，然后使用其返回码、stderr 或 stdout 来决定是否运行后续任务。对于这些情况，Ansible\
  \ 允许你使用 `register` 在运行时将特定命令的输出存储在变量中。\n\n在上一节中，我们使用 `register` 获取了 `forever list`\
  \ 命令的输出，然后使用该输出来判断我们是否需要启动 Node.js 应用：\n\n```yaml\n- name: \"Node: Check list of\
  \ Node.js apps running.\"\n  command: forever list\n  register: forever_list\n \
  \ changed_when: false\n\n- name: \"Node: Start example Node.js app.\"\n  command:\
  \ forever start {{ node_apps_location }}/app/app.js\n  when: \"forever_list.stdout.find(node_apps_location\
  \ + '/app/app.js') == -1\"\n```\n\n在该示例中，我们使用了 Python 内置的字符串函数（`find`）来搜索应用的路径，如果不存在，则启动\
  \ Node.js 应用。\n\n我们将在本章稍后进一步探索 `register` 的用法。\n\n### 访问变量\n\n简单变量（由 Ansible 收集、在清单文件中定义、或在\
  \ playbook 或变量文件中定义）可以使用 `{{ variable }}` 语法作为任务的一部分。例如：\n\n```yaml\n- command:\
  \ \"/opt/my-app/rebuild {{ my_environment }}\"\n```\n\n当运行该命令时，Ansible 将用 `my_environment`\
  \ 的内容替换 `{{ my_environment }}`。因此，生成的命令类似于 `/opt/my-app/rebuild dev`。\n\n你将使用的许多变量结构化为数组（或“列表”），访问数组\
  \ `foo` 不会为你提供足够有用的信息（除非在 Ansible 将使用整个数组的上下文中传递该数组，例如使用 `with_items` 时）。\n\n如果你像这样定义一个列表变量：\n\
  \n```yaml\nfoo_list:\n  - one\n  - two\n```\n\n\n\n\n你可以将 YAML 文件放置在这些目录中，并根据你在清单文件（inventory\
  \ file）中定义的组名或主机名命名。继续上面的示例，让我们将特定的变量移动到位置：\n\n```\n1 ---\n2 # File: /etc/ansible/group_vars/group\n\
  3 admin_user: john\n```\n\n```\n1 ---\n2 # File: /etc/ansible/host_vars/host1\n\
  3 admin_user: jane\n```\n\n即使你使用的是默认的清单文件（或位于 playbook 根目录之外的清单文件），`Ansible` 也会使用位于\
  \ playbook 自身的 `group_vars` 和 `host_vars` 目录中的主机变量和组变量文件。当你想要将整个 playbook 和基础架构配置（包括所有特定主机/组的配置）打包在一起并存入源代码版本控制仓库中时，这种方法非常方便。\n\
  \n你还可以定义一个 `group_vars/all` 文件，它将适用于*所有组*。但通常情况下，最好在 playbook 和角色中提供默认值（我们稍后会讨论这一点）。\n\
  \n### 带有主机和组变量及信息的魔法变量\n\n如果你需要从另一个主机检索特定主机的变量，`Ansible` 提供了一个名为 `hostvars` 的魔法变量，包含了所有定义的主机变量（来自清单文件以及\
  \ `host_vars` 目录中发现的任何 YAML 文件）。\n\n```\n## 从任何主机调用，均返回 \"jane\"。\n{{ hostvars['host1']['admin_user']\
  \ }}\n```\n\n`Ansible` 还提供了其他多种变量，你可能经常需要使用它们：\n\n* `groups`: 清单中所有组名的列表。\n* `group_names`:\
  \ *当前*主机所属的所有组的列表。\n* `inventory_hostname`: 根据*清单*确的当前主机的主机名（这可能与 `ansible_hostname`\
  \ 不同，后者是系统报告的主机名）。\n* `inventory_hostname_short`: `inventory_hostname` 的第一部分，即第一个点号之前的内容。\n\
  * `play_hosts`: 运行当前 play 的所有主机。\n\n请参阅 `Ansible` 官方文档中的[关于 Ansible 信息：魔法变量](https://docs.ansible.com/ansible/latest/user_guide/playbooks_vars_facts.html#information-about-ansible-magic-variables)\
  \ 以获取最新信息和进一步的使用示例。\n\n### Facts（从系统信息派生的变量）\n\n默认情况下，每当你运行一个 `Ansible` playbook\
  \ 时，`Ansible` 都会收集 play 中每个主机的信息（“facts”）。在前面的章节中运行 playbook 时，你可能已经注意到了：\n\n```\n\
  $ ansible-playbook playbook.yml\n\nPLAY [group] ********************************************************\n\
  \nGATHERING FACTS *****************************************************\nok: [host1]\n\
  ok: [host2]\nok: [host3]\n```\n\n运行 playbook 时，Facts 非常有用；你可以使用收集到的信息（如主机 IP 地址、CPU\
  \ 类型、磁盘空间、操作系统信息和网络接口信息）来更改某些任务的执行时，或者更改配置文件中使用的信息。\n\n要获取所有可用 fact 的列表，你可以使用 `setup`\
  \ 模块配合 `ansible` 命令：\n\n```\n$ ansible munin -m setup\nmunin.midwesternmac.com |\
  \ success >> {\n    \"ansible_facts\": {\n        \"ansible_all_ipv4_addresses\"\
  : [\n            \"167.88.120.81\"\n        ],\n        \"ansible_all_ipv6_addresses\"\
  : [\n            \"2604:180::a302:9076\",\n[...]\n```\n\n如果你不需要使用 facts，并且希望在运行\
  \ playbook 时为每台主机节省几秒时间（这在对几十或几百台服务器运行 `Ansible` playbook 时特别有帮助），你可以在 playbook\
  \ 中设置 `gather_facts: no`：\n\n```\n---\n- hosts: db\n  gather_facts: no\n```\n\n\
  我自己的许多 playbook 和角色都使用 `ansible_os_family`、`ansible_hostname` 和 `ansible_memtotal_mb`\
  \ 等 fact 来注册新变量，或结合 `when` 语句使用，以决定是否运行某些任务。\n\n### Local Facts (Facts.d)\n\n定义主机特定\
  \ fact 的另一种方法是在远程主机上的特殊目录 `/etc/ansible/facts.d/` 中放置 `.fact` 文件。这些文件可以是 JSON 文件或\
  \ INI 文件，你也可以使用返回 JSON 的可执行文件。例如，在远程主机上创建 `/etc/ansible/facts.d/settings.fact` 文件，内容如下：\n\
  \n```\n1 [users]\n2 admin=jane,john\n3 normal=jim\n```\n\n接下来，使用 `Ansible` 的 `setup`\
  \ 模块显示远程主机上的新 fact：\n\n```\n$ ansible hostname -m setup -a \"filter=ansible_local\"\
  \nmunin.midwesternmac.com | success >> {\n    \"ansible_facts\": {\n        \"ansible_local\"\
  : {\n            \"settings\": {\n                \"users\": {\n               \
  \     \"admin\": \"jane,john\",\n                    \"normal\": \"jim\"\n     \
  \           }\n            }\n        }\n    },\n    \"changed\": false\n}\n```\n\
  \n如果你使用 playbook 部署新服务器，且该 playbook 的一部分添加了本地 `.fact` 文件以生成后续使用的本地 fact，你可以通过如下任务显式告诉\
  \ `Ansible` 重新加载本地 facts：\n\n```\n- name: Reload local facts.\n  setup: ansible_local\n\
  ```\n\n### Ansible Vault - 密钥管理\n\n如果你使用 `Ansible` 自动化服务器的部署和配置，可能需要使用密码或敏感数据，无论是设置默认密码、同步私钥还是通过远程服务。\n\
  \n1. 使用独立的密钥管理服务，例如 HashiCorp 的 [Vault](https://project.io/)、Square 的 [Keywhiz](http://square.github.io/)\
  \ 或 AWS [Key Management Service](https://aws.amazon.com/kms/)、Microsoft Azure [Key\
  \ Vault](https://azure.microsoft.com/en-us/services/key-vault/) 等托管服务。\n2. 使用内置于\
  \ `Ansible` 的 Vault，它与 playbook 一并存储密码。\n\n对于大多数项目来说，内置的 Vault 足够了，但如果你需要其他项目中更高级的功能，`Ansible\
  \ Vault` 可能会过于局限。\n\n`Ansible Vault` 的工作原理类似于现实库：\n1. 将通常放在 playbook 中的 YAML 文件（例如变量文件、主机变量、组变量、角色默认变量或任务包含项！）存入\
  \ vault。\n2. `Ansible` 使用密钥（你设置的密码）对 vault 进行加密（上锁）。\n3. 将密钥单独存储在只有你控制或可以访问的地方。\n\
  4. 每当你运行 playbook 时，使用密钥让 `Ansible` 解密加密的 vault。\n\n让我们看看实践中是如何工作的。这里有一个名为 `main.yml`\
  \ 的 playbook，演示了 API key 的使用：\n\n```\n 1 ---\n 2 - hosts: localhost\n 3   connection:\
  \ local\n 4   gather_facts: no\n 5 \n 6   vars_files:\n 7     - vars/api_key.yml\n\
  \ 8 \n 9   tasks:\n10     - name: Echo the API key which was injected into the env.\n\
  11       shell: echo $API_KEY\n12       environment:\n13         API_KEY: \"{{ myapp_api_key\
  \ }}\"\n14       register: echo_result\n15 \n16     - name: Show the result.\n17\
  \       debug: var=echo_result.stdout\n```\n\n与 playbook 存放在 `vars` 文件夹中的 `api_key.yml`\
  \ 变量文件如下：\n\n```\n1 ---\n2 myapp_api_key: \"l9bTqfBlbXTQiDaJMqgPJ1VdeFLfId98\"\n\
  ```\n\n\n\n这很方便，但以明文形式存储 API 密钥是不安全的。即使在受访问限制的计算机上本地运行 playbook，机密（secrets）也应该被加密。如果你通过中央服务器（例如使用\
  \ `Ansible Tower` 或 `Jenkins`）运行 playbook，或者将此 playbook 放在共享仓库中，那么这就更加重要了。*你*可能遵循了物理和操作系统安全的最佳实践，但你能够保证*每一个*访问此文件的开发者和系统管理员都同样这样做吗？\n\
  \n为了获得最佳安全性，请使用 `Ansible Vault` 来加密文件。如果你曾经将原始文件提交到版本控制中，现在也是过期旧密钥并生成新密钥的好时机，因为旧密钥已经是你项目明文历史的一部分！\n\
  \n要使用 `Vault` 加密文件，请运行：\n\n```bash\n$ ansible-vault encrypt vars/api_key.yml\n```\n\
  \n为文件输入一个安全的密码，Ansible 将对其进行加密。如果你现在打开文件，你应该会看到类似的内容：\n\n```\n 1 $ANSIBLE_VAULT;1.1;AES256\n\
  \ 2 653635363963663439383865313262396665353063663839616266613737616539303\n 3 530313663316264336133626266336537616463366465653862366231310a30633064\n\
  \ 4 633234306335333739623661633132376235666563653161353239383664613433663\n 5 1303132303566316232373865356237383539613437653563300a3263386336393866\n\
  \ 6 376535646562336664303137346432313563373534373264363835303739366362393\n 7 639646137656633656630313933323464333563376662643336616534353234663332\n\
  \ 8 656138326530366434313161363562333639383864333635333766316161383832383\n 9 831626166623762643230313436386339373437333830306438653833666364653164\n\
  10 6633613132323738633266363437\n```\n\n下次你运行 playbook 时，你需要提供之前为 vault 使用的密码，以便\
  \ Ansible 能够在使用的短暂时间内在内存中解密 playbook。如果你不指定密码，你将收到一个错误：\n\n```bash\n$ ansible-playbook\
  \ main.yml\nERROR: A vault password must be specified to decrypt vars/api_key.yml\n\
  ```\n\n有多种方法可以提供密码，取决于你运行 playbook 的方式。在交互式运行 playbook 时，运行时提供密码效果良好：\n\n```bash\n\
  ## 使用 --ask-vault-pass 在运行时提供 vault 密码。\n$ ansible-playbook main.yml --ask-vault-pass\n\
  Vault password:\n```\n\n提供密码后，Ansible 会解密 vault（在内存中）并使用解密后的数据运行 playbook。\n\n你可以使用\
  \ `ansible-vault edit` 编辑加密文件。你还可以 `rekey` 一个文件（更改其密码）、`create` 创建新文件、`view` 查看现有文件或\
  \ `decrypt` 解密文件。所有这些命令都适用于一个或多个文件（例如 `ansible-vault create x.yml y.yml z.yml`）。\n\
  \n为了方便起见，或者为了自动化运行 playbook（例如在持续集成服务器上），你可以通过密码文件提供 vault 密码。就像 `~/.ssh` 文件夹中的安全密钥一样，你应该小心处理这些文件：永远不要将它们提交到源码控制，并设置严格的权限（例如\
  \ `600`），以便只有*你*才能读取或写入此文件。创建 `~/.ansible/vault_pass.txt` 文件并写入密码，权限设置为 `600`，并在运行\
  \ playbook 时告诉 Ansible 该文件的位置：\n\n```bash\n## 使用 --vault-password-file 从文件提供 vault\
  \ 密码。\n$ ansible-playbook main.yml --vault-password-file ~/.ansible/vault_pass.txt\n\
  ```\n\n### 变量优先级\n\n为了获得最佳安全性，请使用 `Ansible Vault` 来加密文件。如果你曾经将原始文件提交到版本控制中，现在也是过期旧密钥并生成新密钥的好时机，因为旧密钥已经是你项目明文历史的一部分！\n\
  \n要使用 Vault 加密文件，请运行：\n\n```bash\n$ ansible-vault encrypt vars/api_key.yml\n```\n\
  \n为文件输入一个安全的密码，Ansible 将对其进行加密。如果你现在打开文件，你应该会看到类似的内容：\n\n```\n 1 $ANSIBLE_VAULT;1.1;AES256\n\
  \ 2 653635363963663439383865313262396665353063663839616266613737616539303\n 3 530313663316264336133626266336537616463366465653862366231310a30633064\n\
  \ 4 633234306335333739623661633132376235666563653161353239383664613433663\n 5 1303132303566316232373865356237383539613437653563300a3263386336393866\n\
  \ 6 376535646562336664303137346432313563373534373264363835303739366362393\n 7 639646137656633656630313933323464333563376662643336616534353234663332\n\
  \ 8 656138326530366434313161363562333639383864333635333766316161383832383\n 9 831626166623762643230313436386339373437333830306438653833666364653164\n\
  10 6633613132323738633266363437\n```\n\n### If/then/when 条件\n\n许多任务只需要在某些情况下运行。某些任务使用内置幂等性的模块（例如确保\
  \ dnf 或 apt 软件包已安装），你通常不需要为这些任务定义额外的条件。然而，许多任务——特别是使用 `command` 或 `shell` 模块的任务——需要额外的输入来确定它们何时应该运行、是否发生了变化以及何时失败。\n\
  \n我们将涵盖所有适用于 Ansible 任务的主要条件行为，以及如何告诉 Ansible Play 是否成功。\n\n####ja 表达式、Python 内置函数和逻辑\n\
  \n在讨论 Ansible 中所有的条件用法之前，值得简单介绍 Jinja（Ansible 同时用于模板和条件的语法）以及可用的 Python 函数（通常称为内置函数）。Ansible\
  \ 使用表达式和内置函数配合 `when`、`changed_when` 和 `failed_when`，以便尽可能精确地描述这些内容。\n\nJinja 允许定义字面量，如字符串（`\"\
  string\"`）、整数（`42`）、浮点数（`42.3`）、列表（`[1, 2, 3]`）、元组（类似于列表但不可修改）、字典（`{key: value,\
  \ key2: value}`）以及布尔值（`true` 或 `false`）。\n\nJinja 还允许基础数学运算，如加法、减法、乘法和除法，以及比较运算（`==`\
  \ 表示相等、`!=` 表示不相等、`>=` 表示大于等于等）。逻辑运算符为 `and`、`or` 和 `not`，你可以通过括号对表达式进行分组。\n\n\n\
  \n\n```\n# 以下表达式的求值为为 'true':\n1 in [1, 2, 3]\n'see' in 'Can you see me?'\nfoo !=\
  \ bar\n(1 < 2) and ('a' not in 'best')\n\n# 以下表达式的求值为为 'false':\n4 in [1, 2, 3]\n\
  foo == bar\n(foo != foo) or (a in [1, 2, 3])\n```\n\nJinja 还提供了一组非常有用的“测试（tests）”，你可以用它们测试特定的对象。例如，如果你只为某一组服务器定义了变量\
  \ `foo` 而没有为其他服务器定义，你可以使用表达式 `foo is defined` 配合条件判断：如果该变量已定义，则结果为 `true`；如果未定义，则结果为\
  \ `false`。\n\n你还可以执行许多其他检查，如 `undefined`（`defined` 的反反）、`equalto`（作用类似于 `==`）、`even`（如果变量是偶数则返回\
  \ `true`）以及 `iterable`（如果可以对对象进行迭代）。我们将在书的后部分介绍全部内容，但目前请记住，你可以结合 Ansible 条件和 Jinja\
  \ 表达式来实现一些强大的功能！\n\n在 Jinja 无法提供足够强大灵活性的少数情况下，你可以调用 Python 的内置库函数（如 `string.split`、`[number].is_signed()`）来操作变量，并确定特定任务是否应该运行、是否发生了更改、是否失败等。\n\
  \n例如，我经常需要解析版本字符串，以找到特定项目的主版本。假设变量 `software_version` 设置为 `4.6.1`，我可以通过 `.` 字符分割字符串，然后使用数组的第一个元素来获取主版本。我可以使用\
  \ `when` 检查主版本是否为 `4`，并决定运行（或不运行）某个任务：\n\n```\n1 - name: 仅对版本 4 的软件执行操作。\n2   [task\
  \ here]\n3   when: software_version.split('.')[0] == '4'\n```\n\n通常情况下，坚持简单的 Jinja\
  \ 过滤器和变量是最好的，但在进行更高级的变量操作时，可以使用 Python，这非常方便。\n\n### `register`\n\n在 Ansible 中，任何\
  \ play 都可以“注册（register）”一个变量，一旦注册，该变量将对所有后续任务可用。注册变量的用法与普通变量或主机事实（host facts）完全相同。\n\
  \n很多时候你可能需要 shell 命令的输出（stdout 或 stderr），可以使用以下语法将其获取变量中：\n\n```\n- shell: my_command_here\n\
  \  register: my_command_result\n```\n\n稍后，你可以通过 `my_command_result.stdout` 获取 stdout（字符串形式），通过\
  \ `my_command_result.stderr` 获取 stderr。\n\n注册的事实（Registered facts）对于许多类型的任务都非常有帮助，既可以用于条件判断（定义\
  \ play 在何何时以及如何运行），也可以用于 play 的任何部分。例如，如果你有一个命令输出类似“10.0.4”的版本号字符串，并将该输出注册为 `version`，那么在之后执行代码检出（checkout）时，可以通过打印变量\
  \ `{{ version.stdout }}` 来使用该字符串。\n\n### `when`\n\n你可以为 play 添加的最有用的额外键之一是 `when`\
  \ 语句。让我们来看看 `when` 的简单用法：\n\n```\n- dnf: name=mysql-server state=present\n  when:\
  \ is_db_server\n```\n\n上面的语句假设你之前定义了变量 `is_db_server` 为布尔值（`true` 或 `false`），如果值为\
  \ `true` 则运行该 play，如果为 `false` 则跳过。\n\n如果你只在数据库服务器上定义了 `is_db_server` 变量（这意味着该变量有时可能完全未被定义），你可以这样有条件地运行任务：\n\
  \n```\n- dnf: name=mysql-server state=present\n  when: (is_db_server is defined)\
  \ and is_db_server\n```\n\n如果 `when` 结合之前任务注册的变量使用，它会更加强大。例如，我们想要检查一个运行中的应用程序的状态，并且仅当该应用程序在输出中报告为“ready”时才运行\
  \ play：\n\n```\n- command: my-app --status\n  register: myapp_result\n\n- command:\
  \ do-something-to-my-app\n  when: \"'ready' in myapp_result.stdout\"\n```\n\n这些示例稍显刻意，但它们说明了\
  \ `when` 在任务中的基本用法。以下是现实世界中 playbooks 里使用 `when` 的一些示例：\n\n```bash\n## 来自我们的 Node.js\
  \ playbook - 注册命令输出，然后查看\n### 我们的应用路径是否在输出中。如果不存在，则启动应用。\n- command: forever list\n\
  \  register: forever_list\n- command: forever start /path/to/app/app.js\n  when:\
  \ \"forever_list.stdout.find('/path/to/app/app.js') == -1\"\n\n### 如果 'ping_hosts'\
  \ 变量为 true，则运行 'ping-hosts.sh' 脚本。\n- command: /usr/local/bin/ping-hosts.sh\n  when:\
  \ ping_hosts\n\n# 如果我们感兴趣的分支在项目的 git 分支列表中\n# ，则运行 'git-cleanup.sh' 脚本。\n- command:\
  \ chdir\n  register: git_branches\n  when: \"interesting-branch not in git_branches.stdout\"\
  \n```（注：原文在最后的代码块处存在格式问题，我已清理了逻辑。）\n\n### `changed_when` 和 `failed_when`\n\n与 `when`\
  \ 类似，你可以使用 `changed_when` 和 `failed_when` 来影响 Ansible 对任务是否发生更改的报告。Ansible 很难判断一个命令是否产生了更改，因此如果你使用\
  \ `command` 或 `shell` 模块而不使用 `changed_when`，Ansible 将总是报告更改。大多数 Ansible 模块都能正确报告更改，但你也可以通过手动调用\
  \ `changed_when` 来覆盖这种行为。\n\n在使用 Composer 命令安装依赖时，了解何时安装了内容、何时没有变化是有用的。这里有一个示例：\n\
  \n```yaml\n- name: 通过 Composer 安装依赖。\n  command: \"/usr/local/bin/composer global\
  \ require phpunit/phpunit --prefer-dist\"\n  register: composer\n  changed_when:\
  \ \"'Nothing to install' not in composer.stdout\"\n```\n\n看到我们 `register` 来存储命令的结果，然后检查\
  \ stdout 中是否存在特定字符串。\n\n许多工具将结果打印到 stderr 而不是 stdout，因此可以使用 `failed_when` 告诉 Ansible\
  \ 任务何时真的失败了，而不仅仅是以错误的方式报告其结果。这里有一个示例，我们需要解析 Jenkins CLI 命令的 stderr，以查看 Jenkins 是否未能执行我们请求的命令：\n\
  \n```yaml\n- name: 通过 CLI 导入 Jenkins 任务。\n  shell: >\n    java -jar /opt/jenkins-cli.jar\
  \ -s http://localhost:8080/\n    create-job \"My Job\" < /usr/local/my-job.xml\n\
  \  register: import\n  failed_when: \"import.stderr and 'exists' not in import.stderr\"\
  \n```\n\n在这种情况下，我们只在命令返回错误且该错误不包含‘exists’时才让 Ansible 报告失败。对于是否应该在任务已存在时通过 stderr\
  \ 报告，还是将结果打印到 stdout，是有争议的……但很容易通过 Ansible 来处理命令的任何行为！\n\n### `ignore_errors`\n\n\
  有时某些命令应该始终运行，而它们经常报告错误。或者你运行的某些脚本到处输出错误，而这些错误实际上并不表示问题，它们只是让人心烦（并且会导致你的 playbook\
  \ 停止执行）。\n\n\n\n\n\n对于这些情况，你可以向任务添加 `ignore_errors: true`，这样 Ansible 就会完全无所不知地忽略运行特定任务时出现的任何问题。不过，使用此功能时要小心；最好的做法是找到一种处理或绕过任务生成的错误的方法，以便在出现实际问题时，playbook\
  \ *会* 失败。\n\n## 委托、本地操作和暂停\n\n某些任务（例如发送通知、与负载均衡器通信，或对 DNS、网络或监控服务器进行更改）需要 Ansible\
  \ 在主机机器（运行 playbook 的机器）或除 playbook 托管的主机之外的另一台主机上运行该任务。Ansible 允许使用 `delegate_to`\
  \ 将任何任务委托给特定主机：\n\n```\n- name: Add server to Munin monitoring configuration.\n\
  \  command: monitor-server webservers {{ inventory_hostname }}\n  delegate_to: \"\
  {{ monitoring_master }}\"\n```\n\n委托通常用于管理服务器在负载均衡器或复制池中的参与情况；你可以在本地运行特定命令（如下例所示），也可以使用\
  \ Ansible 内置的负载均衡器模块之一，并直接 `delegate_to` 到特定的负载均衡器主机：\n\n```\n- name: Remove server\
  \ from load balancer.\n  command: remove-from-lb {{ inventory_hostname }}\n  delegate_to:\
  \ 127.0.0.1\n```\n\n如果你将任务委托给 `localhost`，Ansible 有一个方便的简写形式 `local_action` 可以使用，而无需添加整个\
  \ `delegate_to` 行：\n\n```\n- name: Remove server from load balancer.\n  local_action:\
  \ command remove-from-lb {{ inventory_hostname }}\n```\n\n### 使用 `wait_for` 暂停 playbook\
  \ 执行\n\n你可能也可以在 playbook 间隙使用 `local_action` 来等待新启动的服务器或应用程序在特定端口上监听：\n\n```\n-\
  \ name: Wait for web server to start.\n  local_action:\n    module: wait_for\n \
  \   host: \"{{ inventory_hostname }}\"\n    port: \"{{ webserver_port }}\"\n   \
  \ delay: 10\n    timeout: 300\n    state: started\n```\n\n上面的任务会等待 `webserver_port`\
  \ 在 `inventory_hostname` 上开启（该检查是从运行 Ansible playbook 的主机发起的），超时时间为 5 分钟（在第一次检查之前以及检查之间有\
  \ 10 秒的延迟）。\n\n`wait_for` 可用于暂停你的 playbook 执行以等待许多不同的情况：\n\n*   使用 `host` 和 `port`，等待最多\
  \ `timeout` 秒直到端口可用（或不可用）。\n*   使用 `path`（如果需要还可以使用 `search_regex`），等待最多 `timeout`\
  \ 秒直到文件存在（或不存在）。\n*   使用 `host`、`port` 并将 `drained` 作为 `state` 参数，检查给定的端口是否已排空其所有活动连接。\n\
  *   使用 `delay`，你可以简单地暂停 playbook 执行指定的时间（秒）。\n\n### 在本地运行整个 playbook\n\n当需要在运行任务的服务器或工作站上运行\
  \ playbook（例如自备备），或者当 playbook 应该在运行 `ansible-playbook` 命令的同一主机上运行时，你可以使用 `--connection=local`\
  \ 来避免 SSH 连接开销，从而加速 playbook 的执行。\n\n作为一个简单的示例，这里有一个可以使用命令 `ansible-playbook test.yml\
  \ --connection=local` 运行的短 playbook：\n\n```\n 1 ---\n 2 - hosts: 127.0.0.1\n 3 \
  \  gather_facts: no\n 4 \n 5   tasks:\n 6     - name: Check the current system date.\n\
  \ 7       command: date\n 8       register: date\n 9 \n10     - name: Print the\
  \ current system date.\n11       debug:\n12         var: date.stdout\n```\n\n此 playbook\
  \ 将在 `localhost` 上运行，并在调试消息中输出当前日期。它运行速度会非常快（在我的 Mac 上花费了约 0.2 秒！），因为它完全通过本地连接运行。\n\
  \n使用 `--connection=local` 运行 playbook 在你使用 `--check` 模式运行 playbook 以验证配置时（例如，在报告更改时向你发送邮件的\
  \ cron 任务上），或者当在测试基础设施上测试 playbook 时（例如通过 Travis、Jenkins 或其他 CI 工具），也非常有用。\n\n##\
  \ 提示 (Prompts)\n\n在少数情况下，你可能需要用户输入一个将在 playbook 中使用的变量值。如果 playbook 需要用户的个人登录信息，或者你提示了根据运行\
  \ playbook 的人员或运行位置可能更改的版本或其他值，且没有其他方法可以配置这些信息（例如使用环境变量、清单变量等），则请使用 `vars_prompt`。\n\
  \n作为一个简单的示例，你可以请求用户输入可能用于登录网络共享的用户名和密码：\n\n```\n 1 ---\n 2 - hosts: all\n 3 \n 4\
  \   vars_prompt:\n 5     - name: share_user\n 6       prompt: \"What is your network\
  \ username?\"\n 7 \n 8     - name: share_pass\n 9       prompt: \"What is your network\
  \ password?\"\n10       private: yes\n```\n\n在 Ansible 运行 play 之前，提示用户输入用户名和密码，密码的输入是隐藏的。有几个特殊选项可以添加到提示中：\n\
  \n*   `private`: 设置为 `yes` 输入将被隐藏。\n*   `default`: 你可以为提示设置默认值。\n*   `prompt`: 你可以自定义给用户的消息。\n\
  \n## 标签 (Tags)\n\n标签允许你运行（或排除） playbook 的子集。你可以标记角色、包含的文件、单个任务甚至 play。语法非常简单，以下是添加标签的不同示例：\n\
  \n```\n1 ---\n 2 # 为整个 play 打上标签。\n 3 - hosts: webservers\n 4   tags: deploy\n 5\
  \ \n 6   roles:\n 7     # 标记角色的标签将应用于该角色中的任务。\n 8     - role: tomcat\n 9       tags:\
  \ ['tomcat', 'app']\n10 \n11   tasks:\n12     - name: Notify on completion.\n13\
  \       local_action:\n14         module: osx_say\n15         msg: \"{{inventory_hostname}}\
  \ is finished!\"\n16         voice: Zarvox\n17       tags:\n18         - notifications\n\
  19         - say\n20 \n21     # 标记包含的任务。\n22     - import_tasks: foo.yml\n23   \
  \    tags: foo\n```\n\n假设我们将上面的 playbook 保存为 `tags.yml`，可以使用下面的命令只运行 `tomcat` 角色和\
  \ `Notify on completion` 任务：\n\n```\n1 $ ansible-playbook tags.yml --tags \"tomcat,say\"\
  \n```\n\n如果你想排除标记为 `notifications` 的内容，可以使用 `--skip-tags`：\n\n```\n1 $ ansible-playbook\
  \ tags.yml --skip-tags \"notifications\"\n```\n\n当你有一个良好的标签结构时，这非常有用；当你只想运行 playbook\
  \ 的某部分，或者系列中的某个 play（或者，如果你想排除某个 play 或包含的任务）时，使用 `--tags` 或 `--skip-tags` 来非常简单。\n\
  \n\n\n\n通常，我倾向于对较大的 playbook 使用标签（tags），特别是对于单个角色（roles）和执行（plays），但除非我在调试一组任务，否则我通常避免为单个任务或包含文件（includes）添加标签（不在处处添加标签可以减少视觉上的混乱）。你需要找到一种适合你需求的标记风格，让你能够运行（或*不运行*）你\
  \ playbook 中的特定部分。\n\n### Blocks（块）\n\nAnsible 在 2.0.0 中引入了 Blocks 允许你将相关任务分组，并在块层级应用特定的任务参数。它们还允许你以类似于大多数编程语言异常处理的方式来处理块内部的错误。\n\
  \n这是一个使用 blocks 配合 `when` 来运行针对特定平台任务组的 playbook 示例，而无需在每个任务上都使用 `when` 参数：\n\n\
  ```\n 1 ---\n 2 - hosts: web\n 3   tasks:\n 4     # Install and configure Apache\
  \ on RHEL/CentOS hosts.\n 5     - block:\n 6         - dnf: name=httpd state=present\n\
  \ 7         - template: src=httpd.conf.j2 dest=/etc/httpd/conf/httpd.conf\n 8  \
  \       - service: name=httpd state=started enabled=yes\n 9       when: ansible_os_family\
  \ == 'RedHat'\n10       become: yes\n 11 \n 12     # Install and configure Apache\
  \ on Debian/Ubuntu hosts.\n 13     - block:\n 14         - apt: name=apache2 state=present\n\
  \ 15         - template: src=httpd.conf.j2 dest=/etc/apache2/apache2.conf\n 16 \
  \        - service: name=apache2 state=started enabled=yes\n 17       when: ansible_os_family\
  \ == 'Debian'\n 18       become: yes\n```\n\n如果你想通过应用一组任务参数（例如 `with_items`、`when`\
  \ 或 `become`）来执行一系列任务，blocks 是非常方便。\n\n如果你希望能够优雅地处理某些任务中的失败，blocks 也有用。可能会有一个任务是将你的应用程序连接到监控服务，而这对于部署成功并非至关重要，因此优雅地处理失败比直接退出整个部署要好！\n\
  \n以下是如何使用 block 来优雅地处理任务失败：\n\n```\n 1 tasks:\n 2   - block:\n 3       - name: Script\
  \ to connect the app to a monitoring service.\n 4         script: monitoring-connect.sh\n\
  \ 5     rescue:\n 6       - name: This will only run in case of an error in the\
  \ block.\n 7         debug: msg=\"There was an error in the block.\"\n 8     always:\n\
  \ 9       - name: This will always run, no matter what.\n10         debug: msg=\"\
  This always executes.\"\n```\n\n`block` 内部的任务将首先运行。如果 `block` 中的任何任务发生失败，将运行 `rescue`\
  \ 内部的任务。`always` 内部的任务将始终运行，无论 `block` 或 `rescue` 是否发生失败。\n\nBlocks 对于构建可靠的 playbook\
  \ 非常帮助，但就像编程语言中的异常一样，`block`/`rescue`/`always` 失败处理可能会变得变得复杂。如果使用每个任务的 `failed_when`\
  \ 来定义可接受的失败条件更容易维护幂等性，或者以不同的方式组织你的 playbook，那么可能没有必要使用 `block`/`rescue`/`always`。\n\
  \n### Summary（总结）\n\nPlaybooks 是 Ansible 自动化基础设施管理的主要手段。阅读本章后，你应该知道如何使用（并且希望不要滥用！）变量、清单（inventories）、处理程序（handlers）、条件判断、标签等。\n\
  \n你对 playbook 基础组件理解得越深，使用 Ansible 构建和扩展基础设施时就越高效。\n\n```\n ____________________________________\n\
  / Men have become the tools of their \\\n\\ tools. (Henry David Thoreau)       /\n\
  \ ------------------------------------\n        \\   ^__^\n         \\  (oo)\\_______\n\
  \            (__)\\       )\\/\\\n                ||----w |\n                ||\
  \     ||\n```\n\n# 第 6 章 - Playbook 组织 - 角色、包含与导入\n\n到为止，我们在书中使用了相当直接的示例。大多数示例都是为特定的服务器创建的，并且写在一个长的\
  \ playbook 中。\n\nAnsible 在以更高效的方式组织任务方面非常灵活，让你出的 playbook 更具可维护性、可重用且强大。我们将查看使用\
  \ includes 和 roles 更高效地拆分任务两种方法，并探索 Ansible Galaxy，这是一个由社区维护的一些角色的仓库，帮助配置常用的软件包和应用程序。\n\
  \n### Imports（导入）\n\n我们在第 4 章中已经看到了包含其他文件的最基本的方法之一，即使用 `vars_files` 将变量放在独立的 `vars.yml`\
  \ 文件中，而不是内联在 playbook 中：\n\n```\n- hosts: all\n\n  vars_files:\n    - vars.yml\n\
  ```\n\n任务可以以类似的方式很容易地包含。在 playbook 的 `tasks:` 部分，你可以像这样添加 `import_tasks` 指令：\n\n\
  ```\ntasks:\n  - import_tasks: imported-tasks.yml\n```\n\n就像变量包含文件一样，任务在包含的文件中是以扁平列表的形式格式化的。例如，`imported-tasks.yml`\
  \ 看起来像这样：\n\n```\n---\n- name: Add profile info for user.\n  copy:\n    src: example_profile\n\
  \    dest: \"/home/{{ username }}/.profile\"\n```\n\n等等，让我重新检查提供的文本。似乎提供的源文本中有很多重叠或重复的内容。我将按照提供的文本进行处理。\n\
  \n```\n---\n- name: Add profile info for user.\n  copy:\n    src: example_profile\n\
  \    dest: \"/home/{{ username }}/.profile\"\n```\n\n实际上，再次查看源文本，提供的输入部分存在相当大量的重复和碎片化。我将遵循所提供文本的流并应用格式。\n\
  \n例如，`imported-tasks.yml` 看起来像这样：\n\n```\n---\n- name: Add profile info for user.\n\
  \  copy:\n    src: example_profile\n    dest: \"/home/{{ username }}/.profile\"\n\
  ```\n\n等等，源文本继续是：\n```\n- name: Add profile info for user.\n  copy:\n    src: example_profile\n\
  \    dest: \"/home/{{ username }}/.profile\"\n```\n\n看起来提示中提供的文本非常混乱/损坏。我将在保持内容逻辑的同时清理结构。\n\
  \n```\n\n- name: Add profile info for user.\n  copy:\n    src: example_profile\n\
  \    dest: \"/home/{{ username }}/.profile\"\n```\n\n实际上，再次查看源文本，提供的输入部分存在相当大量的重复和碎片化。我将遵循所提供文本的流并应用格式。\n\
  \n例如，`imported-tasks.yml` 看起来像这样：\n\n```\n---\n- name: Add profile info for user.\n\
  \  copy:\n    src: example_profile\n    dest: \"/home/{{ username }}/.profile\"\n\
  ```\n\n等等，源文本继续是：\n```\n- name: Add profile info for user.\n  copy:\n    src: example_profile\n\
  \    dest: \"/home/{{ username }}/.profile\"\n```\n\n看起来提示中提供的文本非常混乱/损坏。我将在保持内容逻辑的同时清理结构。\n\
  \n### Includes（包含）\n\n如果你使用 `import_tasks`，Ansible 会静态地导入任务文件，就像它是主 playbook 的一部分一样，在\
  \ playbook 执行之前。\n\n如果你需要包含的任务是*动态*的——即它们根据 playbook 剩余运行情况来执行不同的事情——那么使用 `include_tasks`\
  \ 而不是 `import_tasks`。\n\n例如，在我的 Ansible 项目中，我有一个 `log_paths.yml` 文件，如下：\n\n```\n\
  ---\n- name: Check for existing log files in dynamic log_file_paths variable.\n\
  \  find:\n    paths: \"{{ item }}\"\n    patterns: '*.log'\n  register: found_file_paths\n\
  \  with_items: \"{{ log_file_paths }}\"\n```\n\n在这种情况下，`log_file_paths` 变量是由 playbook\
  \ 较早任务设置的——所以这个包含文件在 playbook 部分完成之前无法知道该变量的值。\n\n所以当我包含这个任务文件时，我必须动态这样做，例如：\n\n\
  ```\n- include_tasks: log_paths.yml\n```\n\n\n\n在 Ansible 2.0 之前，`include` 始终在 playbook\
  \ 启动时被处理（就像现在的 `import_tasks` Behavior 一样），因此你无法在满足某些条件时加载特定的 include。Ansible 2.0\
  \ 及更高版本会在 playbook 执行期间评估 include，因此你可以执行如下所示的操作：\n\n```yaml\n## 包含额外的任务文件，仅当其在运行时存在。\n\
  - name: Check if extra_tasks.yml is present.\n  stat:\n    path: tasks/extra-tasks.yml\n\
  \  register: extra_tasks_file\n  connection: local\n\n- include_tasks: tasks/extra-tasks.yml\n\
  \  when: extra_tasks_file.stat.exists\n```\n\n如果文件 `tasks/extra-tasks.yml` 不存在，Ansible\
  \ 将跳过 `include_tasks`。你甚至可以在 include 中使用 `with_items` 循环（或其他任何 `with_*` 循环）。在 playbook\
  \ 执行期间评估的 include 可以让你的 playbook 灵活得多！\n\n### Handler 导入与包含\n\nHandlers 可以像任务一样，在\
  \ playbook 的 `handlers` 区域中被导入或包含。例如：\n\n```yaml\nhandlers:\n  - import_tasks: handlers.yml\n\
  ```\n\n这有助于限制主 playbook 中的噪音，因为 handlers 通常用于重启服务或加载配置等操作，可能会分散对 playbook 主要目的的注意力。\n\
  \n### Playbook 导入\n\nPlaybooks 甚至可以包含在其他 playbook 中，在 playbook 的顶层使用相同的 `import`\
  \ 语法（尽管对于 playbook 来说，你只有 `import_playbook` 可，因为不能像任务 include 那样是动态的）。例如，如果你有两个\
  \ playbook——一个用于设置 Web 服务器（`web.yml`），另一个用于设置数据库服务器（`db.yml`），你可以使用以下 playbook 同时运行它们两个：\n\
  \n```yaml\n- hosts: all\n  remote_user: root\n\n  tasks:\n    [...]\n\n- import_playbook:\
  \ web.yml\n- import_playbook: db.yml\n```\n\n通过这种方式，你可以创建配置基础设施中所有服务器的 playbook，然后创建一个包含每个单独\
  \ playbook 的主 playbook。当你想要初始化基础设施、对整个服务器集群进行更改，或者检查它们的配置是否符合你的 playbook 定义时，你只需要运行一次\
  \ `ansible-playbook` 命令即可！\n\n### 完整的包含示例\n\n如果我告诉你可以将第 4 章中 137 行的 Drupal LAMP\
  \ 服务器 playbook 重写为 21 行，你觉得怎么样？使用 include，这很容易；只需将每组任务拆分为它们自己的 include 文件，你将得到一个如下所示的主\
  \ playbook：\n\n```\n 1 ---\n 2 - hosts: all\n 3 \n 4   vars_files:\n 5     - vars.yml\n\
  \ 6 \n 7   pre_tasks:\n 8     - name: Update apt cache if needed.\n 9       apt:\
  \ update_cache=yes cache_valid_time=3600\n10 \n11   handlers:\n12     - import_tasks:\
  \ handlers/handlers.yml\n13 \n14   tasks:\n15     - import_tasks: tasks/common.yml\n\
  16     - import_tasks: tasks/apache.yml\n17     - import_tasks: tasks/php.yml\n\
  18     - import_tasks: tasks/mysql.yml\n19     - import_tasks: tasks/composer.yml\n\
  20     - import_tasks: tasks/drush.yml\n21     - import_tasks: tasks/drupal.yml\n\
  ```\n\n你只需要在保存 Drupal `playbook.yml` 文件的文件夹中创建两个新文件夹，`handlers` 和 `tasks`，然后为 playbook\
  \ 的每个部分在内部创建文件。\n\n例如，在 `handlers/handlers.yml` 中，你会有：\n\n```\n1 ---\n2 - name:\
  \ restart apache\n3   service: name=apache2 state=restarted\n```\n\n在 `tasks/drush.yml`\
  \ 中：\n\n```\n 1 ---\n 2 - name: Check out drush 8.x branch.\n 3   git:\n 4     repo:\
  \ https://github.com/drush-ops/drush.git\n 5     version: 8.x\n 6     dest: /opt/drush\n\
  \ 7 \n 8 - name: Install Drush dependencies with Composer.\"\n 9   shell: >\n10\
  \     /usr/local/bin/composer install\n11     chdir=/opt/drush\n12     creates=/opt/drush/vendor/autoload.php\n\
  13 \n14 - name: Create drush bin symlink.\n15   file:\n16     src: /opt/drush/drush\n\
  17     dest: /usr/local/bin/drush\n18     state: link\n```\n\n将所有任务分离到单独的任务文件中意味着你为\
  \ playbook 有了更多文件需要管理，但这有助于保持主 playbook 更加紧凑。这样查看 playbook 包含的所有安装和配置步骤更容易，并将任务分成了独立的、可维护的组。你不再需要浏览一个包含二十三个独立任务的\
  \ playbook，而是维护八个每个包含二到五个任务的包含文件。\n\n维护一组相关的相关的小任务比维护一个长长的 playbook 要容易得多。然而，没有理由尝试开始编写一个包含大量单独\
  \ include 的 playbook。大多数情况下，最好是...\n\n\n\n\n```yaml\n1 ---\n2 - name: Install Node.js\
  \ (npm plus all its dependencies).\n3   dnf: name=npm state=present enablerepo=epel\n\
  4\n5 - name: Install forever module (to run our Node.js app).\n6   npm: name=forever\
  \ global=yes state=present\n```\n\nNode.js 的目录结构现在应该像如下：\n\n```\n 1 nodejs-app/\n\
  \ 2   app/\n 3     app.js\n 4     package.json\n 5   playbook.yml\n 6   roles/\n\
  \ 7     nodejs/\n 8       meta/\n 9         main.yml\n10       tasks/\n11      \
  \   main.yml\n```\n\n你现在有了一个完整的 Ansible 角色，可以将其用于 node.js 服务器配置 playbook 中。从 `playbook.yml`\
  \ 中删除这些行，并重新格式化 playbook 使其他任务先运行（放在 `pre_tasks:` 部分而不是 `tasks:` 部分），然后是运行该角色，最后是其他任务（在主\
  \ `tasks:` 部分中）。例如：\n\n```yaml\npre_tasks:\n  # EPEL/GPG setup, firewall configuration...\n\
  \nroles:\n  - nodejs\n\ntasks:\n  # Node.js app deployment tasks...\n```\n\n一旦你完成了主\
  \ playbook 的重新格式化，在运行 `ansible-playbook` 时，一切运行情况将完全相同，但 `nodejs` 角色内部的任务会被加上前缀\
  \ `nodejs | [Task name here]`。\n\n在 playbook 运行期间显示的这些少量额外数据非常有用，因为它会自动为任务加上提供该任务的角前缀，而你不需要在任务的\
  \ `name` 值中手动添加描述。\n\n不过，目前我们的角色并没有那么有用，因为它仍然只做一件事，而且还不够灵活，无法在可能需要安装不同 Node.js 模块的其他服务器上。\n\
  \n## 使用角色变量 (vars) 和默认值 (defaults) 增加灵活性\n\n为了让我们的角色更加灵活，我们可以使其使用 npm 模块列表而不是硬编码的值，然后允许使用该角色的\
  \ playbook 提供自己的模块列表变量来覆盖我们角色的默认列表。\n\n在运行角色的任务时，Ansible 会获取角色 `vars/main.yml` 文件和\
  \ `defaults/main.yml` 文件中定义的变量（稍后我将介绍两者之间的差异），但如果你愿意，它允许你的 playbook 覆盖默认值或其他角色提供的变量。\n\
  \n修改 `tasks/main.yml` 文件以使用列表变量并遍历该列表，以便根据 playbook 的需要安装尽可能多的包：\n\n```yaml\n1 ---\n\
  2 - name: Install Node.js (npm plus all its dependencies).\n3   dnf: name=npm state=present\
  \ enablerepo=epel\n4\n5 - name: Install npm modules required by our app.\n6   npm:\
  \ name={{ item }} global=yes state=present\n7   with_items: \"{{ node_npm_modules\
  \ }}\"\n```\n\n让我们在 `defaults/main.yml` 为新的变量 `node_npm_modules` 提供一个合理的默认值：\n\n\
  ```yaml\n1 ---\n2 node_npm_modules:\n   - forever\n```\n\n现在，如果你原样运行 playbook，它仍然会执行相同的操作——安装\
  \ `forever` 模块。但由于角色更加灵活，我们可以创建一个像第一个那样的 playbook，但添加一个变量（在 `vars` 部分或通过 `vars_files`\
  \ 包含的文件中）来覆盖默认值，如下所示：\n\n```yaml\nnode_npm_modules:\n  - forever\n  - async\n  -\
  \ request\n```\n\n当你使用这个自定义变量运行 playbook（我们没有更改 `nodejs` 角色的任何内容）时，上述三个 npm 模块都将被安装。\n\
  \n希望你开始看到这有多强大了！\n\n想象一下你有这样的 playbook 结构：\n\n```yaml\n1 ---\n2 - hosts: appservers\n\
  \   roles:\n     - dnf-repo-setup\n     - firewall\n     - nodejs\n     - app-deploy\n\
  ```\n\n每个角色都存在于自己隔离的世界中，并且可以与基础设施中的其他服务器和服务器组共享。\n\n*   `dnf-repo-setup` 角色可以启用某些仓库并导入它们的\
  \ GPG 密钥。\n*   `firewall` 角色可以拥有针对每个服务器或每个清单组的端口和服务的选项，以允许或拒绝访问。\n*   `app-deploy`\
  \ 角色可以将你的应用部署到目录（可按服务器配置），并按每个服务器或每个组设置某些应用选项。\n\n当你将小功能块分离到不同的角色时，管理这些事情变得非常简单。你不再需要管理\
  \ 100 多行的 playbook 任务，并手动为每个 `name:` 加上类似“Common |” 或“App Deploy |”之类的的前缀，你现在只需要管理几个每个只有\
  \ 10-20 行 YAML 的角色。\n\n此外，当你构建主 playbook 时，它们可以非常简单（如上面的示例），让你能够看到在特定服务器上配置和部署的所有内容，而无需滚动几十个包含的\
  \ playbook 文件和数百个任务。\n\n## 角色的其他部分：处理器 (handlers)、文件 (files) 和模板 (templates)\n\n\
  ### 处理器\n\n在之前的示例中，我们引入了处理器——即任何 playbook 任务产生更改后可以通过 `notify` 选项调用的任务，并提供了一个重启\
  \ Apache 的处理器示例：\n\n```yaml\nhandlers:\n  - name: restart apache\n    service: name=httpd\
  \ state=restarted\n```\n\n在 Ansible 角色中，处理器是一等公民，与任务并列。你可以将处理器直接存储在 `handlers/main.yml`\
  \ 中。如果我们有一个 Apache 的角色，我们的 `handlers/main.yml` 看起来像这样：\n\n```yaml\n1 ---\n2 - name:\
  \ restart apache\n   service: name=httpd state=restarted\n```\n\n你可以调用在角色文件夹中定义的处理器，就像在\
  \ playbook 中调用它们一样（例如 `notify: restart`）。\n\n### 文件和模板\n\n对于接下来的示例，假设我们的角色具有 `files`\
  \ 和 `templates` 目录：\n\n```\nroles/\n  example/\n    files/\n      example.conf\n\
  \    meta/\n      main.yml\n    templates/\n      example.xml.j2\n    tasks/\n \
  \     main.yml\n```\n\n当直接复制文件到服务器时，从角色 `files` 目录添加文件名或完整路径，如下：\n\n```yaml\n- name:\
  \ Copy configuration file.\n  copy:\n    src: example.conf\n    dest: /etc/myapp/example.conf\n\
  \    mode: 0644\n```\n\n同样，在指定模板时，从角色 `templates` 目录添加文件名或完整路径，如下：\n\n```yaml\n\
  - name: Copy configuration file using a template.\n  template:\n    src: example.xml.j2\n\
  \    dest: /etc/myapp/example.xml\n    mode: 0644\n```\n\n`copy` 模块从模块 `files` 文件夹内复制文件，而\
  \ `template` 模块通过 Jinja 模板引擎运行指定的模板文件，在复制文件到服务器之前合并运行 期间所需的任何变量。\n\n## 构建更复杂的跨平台角色\n\
  \n对于简单的包安装和配置角色，你可以通过将所有任务、变量和处理器直接放在 Ansible 自动加载的相应 `main.yml` 文件中。但如果需要，你也可以从角色的\
  \ `main.yml` 文件包含其他文件。\n\n作为一个原则，如果可能，我将我的 playbook 和角色任务文件保持在 100 行 YAML 以内。如果接近这个限制，我通常会将任务拆分为逻辑分组，并从\
  \ `main.yml` 文件包含文件。\n\n让我们看看我的 `geerlingguy.apache` 角色是如何设置的（它在 Ansible Galaxy\
  \ 上可用，可以使用命令 `ansible-galaxy role install geerlingguy.apache` 下载到你的角色目录；我们稍后会讨论\
  \ Ansible Galaxy 本身）。\n\n最初，角色的主 `tasks/main.yml` 文件看起来如下：\n\n```yaml\n1 ---\n2\
  \ - name: Ensure Apache is installed (via apt).\n3\n4 - name: Configure Apache with\
  \ lineinfile.\n5\n6 - name: Enable Apache modules.\n```\n\n\n\n\n\n在创建角色（role）后不久，我想让这个角色同时在\
  \ Debian 和 RHEL 主机上运行。我可以在 `main.yml` 文件中添加两组任务，但这会导致任务数量翻倍，并产生大量的额外的 `when` 语句：\n\
  \n```\n 1 ---\n 2 - name: Ensure Apache is installed (via apt).\n 3   when: ansible_os_family\
  \ == 'Debian'\n 4 \n5 - name: Ensure Apache is installed (via dnf).\n 6   when:\
  \ ansible_os_family == 'RedHat'\n 7 \n 8 - name: Configure Apache with lineinfile\
  \ (Debian).\n 9   when: ansible_os_family == 'Debian'\n10 \n11 - name: Configure\
  \ Apache with lineinfile (RHEL).\n12   when: ansible_os_family == 'RedHat'\n13 \n\
  14 - name: Enable Apache modules (Debian).\n15   when: ansible_os_family == 'Debian'\n\
  16 \n17 - name: Other OS-agnostic tasks...\n```\n\n如果我采取这种方式，并在一个文件中继续剩余的 playbook\
  \ 任务，我很快就会超过我非正式的 100 行限制。因此，我选择在主任务文件中使用包含（includes）：\n\n```\n1 ---\n2 - name:\
  \ Include OS-specific variables.\n3   include_vars: \"{{ ansible_os_family }}.yml\"\
  \n 4 \n5 - name: Include OS-specific setup tasks.\n6   include_tasks: setup-{{ ansible_os_family\
  \ }}.yml\n 7 \n8 - name: Other OS-agnostic tasks...\n```\n\n关于这种针对特定发行版包含包含风格，有两个重要的点需要注意：\n\
  \n1. 在包含变量文件和任务文件时（使用 `include_vars` 或 `include_tasks`），你实际上可以在`在文件名中使用变量`。这在很多情况下都非常有用；在这里，我们包含了一个格式为\
  \ `distribution_name.yml` 的变量文件。就我们的目的而言，由于该角色将用于 Debian 和基于 RHEL 的主机，我们可以在该角色的\
  \ `defaults` 和 `vars` 文件夹中创建 `Debian.yml` 和 `RedHat.yml` 文件，并将特定发行版的变量放在其中。\n\n\
  2. 对于任务，我们在角色的 `tasks` 目录中包含任务文件，例如 `setup-Debian.yml` 或 `setup-RedHat.yml`。\n\n\
  按照这种方式设置后，我将 RHEL 特有的任务（如 `dnf` 任务）放入 `tasks/setup-RedHat.yml`，并将 Debian 和 Ubuntu\
  \ 特有的任务（如 `apt` 任务）放入 `tasks/setup-Debian.yml`。还有其他方法让角色跨平台工作，但使用特定发行版的变量文件和包含的任务文件是最简单之一。\n\
  \n现在，这个 Apache 角色可以在不同的发行之间之间，通过在任务和配置模板中巧妙使用变量，它可以用于各种需要安装 Apache 的基础设施。\n\n##\
  \ Ansible Galaxy\n\nAnsible 角色强大且灵活；它们允许你将配置和可部署的单元、变量、模板和其他文件封装起来，这样你就可以轻松地在不同的服务器之间复用它们。\n\
  \n不过，每次都要从零开始是很麻烦的；如果人们可以共享常用应用程序和服务的角色，难道不是更好吗？\n\n这就是 [Ansible Galaxy](https://galaxy.ansible.com/)。\n\
  \nAnsible Galaxy，或者就称为“Galaxy”，是一个由社区贡献的 Ansible 内容存储库。这里有数千个角色可用，可以配置和部署常用应用程序，它们都可以通过\
  \ `ansible-galaxy` 命令获取。\n\nGalaxy 提供了添加、下载和对角色进行评分的功能。拥有账户后，你可以贡献自己的角色或对他人的角色进行评分（尽管使用角色不需要账户）。\n\
  \n## 从 Galaxy 获取角色\n\n`ansible-galaxy` 命令的主要功能之一是从 Galaxy 获取角色。在 playbook 中使用角色之前，必须先对其进行下载。\n\
  \n还记得我们早早在书中安装的基础 LAMP（Linux, Apache, MySQL 和 PHP）服务器吗？让我们再次创建它，但这次使用 Galaxy 中的几个角色：\n\
  \n```\n$ ansible-galaxy role install geerlingguy.apache \\\ngeerlingguy.mysql geerlingguy.php\n\
  ```\n\n### 使用角色需求文件管理依赖关系\n\n如果你的基础设施配置需要五个、十个、十五个或更多 Ansible 角色，通过 `ansible-galaxy\
  \ role install` 命令安装所有角色可能会精疲力竭。此外，如果你在内部托管角色（例如通过内部 Git 或 Mercurial 仓库），你无法通过 Ansible\
  \ Galaxy 安装角色。不过，你可以向 `ansible-galaxy` 命令传递带有 `-r` 选项的“需求”文件来自动下载所有依赖。\n\nAnsible\
  \ 允许非常简单的 `.txt` 格式（尽管这种格式已过时并可能被移除），但你应该使用更标准且表达更丰富的 YAML 格式，它允许你从 Ansible Galaxy、GitHub、HTTP\
  \ 下载、BitBucket 或你自己的仓库安装角色。它还允许你指定下载角色的路径。一个 `requirements.yml` 文件示例如下：\n\n```\n\
  \ 1 ---\n 2 roles:\n 3   # From Ansible Galaxy, latest version.\n 4   - name: geerlingguy.firewall\n\
  \ 5 \n 6   # From Ansible Galaxy, specifying the version.\n 7   - name: geerlingguy.php\n\
  \ 8     version: 4.3.1\n 9 \n10   # From GitHub, with name.\n11   - name: passenger\n\
  12     version: 2.0.0\n13 \n14   # From web server, with name.\n15   - name: my-role\n\
  16     version: latest\n```\n\n要安装需求文件中定义的角色，请使用命令 `ansible-galaxy install -r requirements.yml`。\n\
  \n## 九行 YAML 构建的 LAMP 服务器\n\n安装了 Apache、MySQL 和 PHP 角色后，我们可以快速创建 LAMP 服务器。此示例假设你已经启动了一个基于\
  \ Ubuntu 的 Linux 虚拟机。\n\n首先，创建一个名为 `lamp.yml` 的 Ansible playbook，其内容如下：\n\n```\n\
  1 ---\n2 - hosts: all\n3   become: yes\n 4 \n5   roles:\n     - geerlingguy.mysql\n\
  \     - geerlingguy.apache\n     - geerlingguy.php\n```\n\n现在，对主机运行该 playbook：\n\
  \n```bash\n$ ansible-playbook -i path/to/custom-inventory lamp.yml\n```\n\n几分钟后，整个\
  \ LAMP 服务器就应该已经启动并运行了。如果你添加几个变量，你就可以配置虚拟主机、PHP 配置、MySQL 服务器设置等。\n\n## 七行 YAML 构建的\
  \ Solr 服务器\n\n让我们再获取几个角色并构建一个 Apache Solr 搜索服务器，这需要安装并配置 Java。\n\n```bash\n$ ansible-galaxy\
  \ role install geerlingguy.java geerlingguy.solr\n```\n\n然后创建一个名为 `solr.yml` 的 playbook，其内容如下：\n\
  \n```\n1 ---\n2 - hosts: all\n3   become: yes\n 4 \n5   roles:\n     - geerlingguy.java\n\
  \     - geerlingguy.solr\n```\n\n现在我们有一个功能完整的 Solr 服务器，我们可以添加一些变量来按照我们想要的方式配置它，例如使用非默认端口或更改\
  \ Solr 的内存分配。\n\n\n\n\n\nAnsible Galaxy 网站上的角色页面突出了可用变量，用于设置诸如安装哪个版本的 Solr、安装位置等。例如，可以查看\
  \ [geerlingguy.solr Galaxy 页面](https://galaxy.ansible.com/geerlingguy/solr/)。\n\n\
  通过 Galaxy 上现有的贡献角色，你可以以极小的精力构建各种服务器。你不再需要为每个服务器维护冗长的剧本（playbooks）和特定的角色，Galaxy 让你构建一个所需的角色列表，以及几个用正确版本和路径配置服务器的变量。使用\
  \ Ansible Galaxy 进行配置管理变成了真正的配置管理——你可以花费更多时间在管理服务器配置上，而减少在打包和构建单个服务上的时间！\n\n## 有用的\
  \ Galaxy 命令\n\n一些你可能偶尔会用到的有用 `ansible-galaxy` 命令：\n\n* `ansible-galaxy role list`\
  \ 显示已安装角色的列表及其版本号。\n* `ansible-galaxy role remove [role]` 移除已安装的角色。\n* `ansible-galaxy\
  \ role init` 可用于创建一个提交到 Ansible Galaxy 的角色模板。\n\n你可以通过编辑 `ansible.cfg` 配置文件（通常位于\
  \ `/etc/ansible/ansible.cfg`）并在 `[defaults]` 部分设置 `roles_path` 来配置 Ansible 角色下载的默认路径。\n\
  \n## 贡献到 Ansible Galaxy\n\n如果你编写了一些实用的 Ansible 角色，并想与他人分享，你只需要确保它们遵循 Ansible Galaxy\
  \ 的基础模板（特别是 `meta/main.yml` 和 `README.md` 文件）。要开始这样做，使用 `ansible-galaxy role init`\
  \ 生成一个基础 Galaxy 模板，并让你的角色符合 Galaxy 模板的结构。\n\n然后将你的角色推送到 GitHub 上的新项目中（我通常将我的 Galaxy\
  \ 角色命名为 `ansible-role-[rolename]`，这样在浏览 GitHub 仓库时可以轻松看到它们），并在登录 galaxy.ansible.com\
  \ 后在“My Content”标签页下添加新角色。\n\n### 总结\n\n使用包含（includes）和 Ansible 角色可以组织剧本并使其更具可维护性。本章介绍了了包含任务、剧本和处理器（handlers）的不同方法，角色的强大功能和灵活结构，以及你如何利用\
  \ Ansible Galaxy —— 这个几乎可以完成任何事情的可配置 Ansible 角色社区仓库。\n\n```\n _________________________________________\n\
  / When the only tool you own is a hammer, \\\n| every problem begins to resemble\
  \ a      |\n\\ nail. (Abraham Maslow)                  /\n -----------------------------------------\n\
  \        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n\
  \                ||----w |\n                ||     ||\n```\n\n## 第 7 章 - Ansible\
  \ 插件与内容集 (Collections)\n\n当你想要以可维护的方式组织任务以及相关的变量和处理器时，Ansible 角色非常有帮助。技术上，你可以分发\
  \ Ansible 插件——用于通过新模块、过滤器、清单插件等扩展 Ansible 功能的 Python 代码——但将此类内容添加到角色中并不是理想的，在某种意义上，将\
  \ Python 代码和 Ansible YAML 放在同一个实体中会导致角色的功能过载。\n\n这就是为什么在 Ansible 2.8 中引入了 Collections，更正式地称为\
  \ Content Collections。Collections 允许将 Ansible 插件、角色甚至剧本收集到一个实体中，以更具结构化的方式供 Ansible、Ansible\
  \ Galaxy 和 Automation Hub 扫描和消费。\n\n### 创建我们的第一个 Ansible 插件 — Jinja 过滤器\n\n在许多 Ansible\
  \ 任务中，你可能会发现自己正在构建一些相当复杂的逻辑来检查一组条件。如果你的 Jinja 条件开始让你的 YAML 文件看起来更像 Python 和 YAML\
  \ 的混合体，那么是时候考虑将 Python 逻辑提取到 Ansible 插件中了。\n\n我们将使用一个极其基础的示例。假设我有一个剧本 `main.yml`，其中包含一个任务需要断言某个变量是生成的\
  \ CSS 中“蓝色”颜色的正确表示形式：\n\n```\n 1 ---\n 2 - hosts: all\n 3 \n 4   vars:\n 5     my_color_choice:\
  \ blue\n 6 \n 7   tasks:\n 8     - name: \"Verify {{ my_color_choice }} is a form\
  \ of blue.\"\n 9       assert:\n10         that: my_color_choice == 'blue'\n```\n\
  \n这运行良好……直到你有另一个有效的蓝色表示形式。假设用户设置了 `my_color_choice: '#0000ff'`。你仍然可以使用相同的任务，但你需要向逻辑中添加：\n\
  \n```\n 1 ---\n 2 - hosts: all\n 3 \n 4   vars:\n 5     my_color_choice: blue\n\
  \ 6 \n 7   tasks:\n 8     - name: \"Verify {{ my_color_choice }} is a form of blue.\"\
  \n 9       assert:\n10         that: >\n11           my_color_choice == 'blue'\n\
  12           or my_color_choice == '#0000ff'\n```\n\n现在，其他人可能会带着同样有效的选项 `#00f` 。是时候给任务添加更多逻辑了——或者不。\n\
  \n相反，我们可以编写一个过滤器插件（filter plugin）。过滤器插件允许你验证数据，是你在 Ansible 中找到的一些较简单的插件类型。在我们的情况下，我们需要一个允许我们验证剧本中数据的过滤器：\n\
  \n```\n 1 ---\n 2 - hosts: all\n 3 \n 4   vars:\n 5     my_color_choice: blue\n\
  \ 6 \n 7   tasks:\n 8     - name: \"Verify {{ my_color_choice }} is a form of blue.\"\
  \n 9       assert:\n10         that: my_color_choice == 'blue'\n```\n\n那么我们如何如何写一个测试让\
  \ `is blue` 部分生效呢？简单的方法是在 `main.yml` 剧本旁边创建一个 `test_plugins` 文件夹，创建一个 `blue.py`\
  \ 文件，并在其中添加以下 Python 代码：\n\n```\n 1 # Ansible custom 'blue' test plugin definition.\n\
  \ 2 \n 3 def is_blue(string):\n 4     ''' Return True if a valid value of blue.\
  \ '''\n 5     blue_values = [\n 6         'blue',\n 7         '#0000ff',\n 8   \
  \      '#00f',\n 9         'rgb(0,0,255)',\n10         'rgb(0%,0%,100%)',\n 11 \
  \    ]\n 12     if string in blue_values:\n 13         return True\n 14     else:\n\
  \ 15         return False\n 16 \n17 class TestModule(object):\n 18     ''' Return\
  \ dict of custom jinja tests. '''\n 19 \n20     def tests(self):\n 21         return\
  \ {\n22             'blue': is_blue\n23         }\n```\n\n这本书并不是 Python 编程的入门教程，但作为一个简单的解释，第一行是注释，说明该文件包含的内容。这不是强制要求的，但我喜欢在代码顶部总是留点东西。在第\
  \ 3 行，定义了 `is_blue` 函数。它包含一些逻辑，接收一个参数（字符串），如果该字符串是蓝色的有效形式则返回 `True`，否则返回 `False`。在这种情况下，这是一个简单的函数，但在许多测试插件中，逻辑更为复杂。需要注意的是，这种逻辑（受益于\
  \ Python 的语言特性）作为插件更具可维护性，而不是 Ansible 剧本中复杂的内联 Jinja 语法。Ansible 插件也可以进行单元测试的，不像\
  \ YAML 文件中的条件，这意味着你可以在不运行整个 Ansible 剧本的情况下测试它们是否正常。\n\n第 17 行定义了 `TestModule`，Ansible\
  \ 会调用 `test_plugins` 目录中任何 Python 文件里该类的 `tests` 方法，并将返回的任何键加载为可用的 Jinja 测试——在我们的案例中，`blue`\
  \ 是 Jinja 测试的名称，当用户使用 `blue` 测试时，Ansible 会将该测试映射回 `is_blue` 函数。\n\n如果你运行 `main.yml`\
  \ 剧本（即使是针对本地），它现在应该能够验证“蓝色”确实是*蓝色*。\n\n\n\n\n\n```\n$ ansible-playbook -i localhost,\
  \ -c local main.yml\n\nPLAY [all] ********************************************************\n\
  \nTASK [Gathering Facts] ********************************************\nok: [localhost]\n\
  \nTASK [Verify blue is a form of blue.] *****************************\nok: [localhost]\
  \ => {\n    \"changed\": false,\n    \"msg\": \"All assertions passed\"\n}\n\nPLAY\
  \ RECAP ********************************************************\nlocalhost   :\
  \   ok=2  changed=0  unreachable=0=failed=0  ignored=0\n```\n\n随着时间的推移，你可能会发现自己想要将此插件与其他\
  \ playbook 共享，特别是它对你维护的许多项目都有帮助时。\n\n最简单的方法是将插件代码复制并粘贴到每个 playbook 的目录中，但这会导致代码重复，并且随着时间推移，插件在不同的\
  \ playbook 中被修改，可能会导致 Python 代码无法保持同步。\n\n传统上，人们作为 `roles` 的一部分来共享 Ansible 模块和插件，因为你可以将模块放在\
  \ role 中特殊的 `library` 目录内，将插件放在 role 中类似 `test_plugins` 的目录中（就像在 playbook 中一样）。\n\
  \n这种高级用法在 Ansible 文档中提到：[在 Roles 中嵌入模块和插件](https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html#embedding-modules-and-plugins-in-roles)。\n\
  \n但 roles 主要设计用于共享 Ansible 任务、处理器和相关变量——其架构在共享插件和模块方面并不理想。\n\n那么这让我们处于什么地步？\n\n\
  ### Ansible Content Collections 的历史\n\n嗯，2014 年，当为了允许 role 共享而创建 Ansible Galaxy\
  \ 时，Ansible 核心仓库中的模块少于 300 个，当时决定[将模块从 Ansible 核心中分离](https://groups.google.com/forum/#!searchin/ansible-project/core%2420extras%2420split%7Csort:relevance/ansible-project/TUL_Bfmhr-E/rshKe30KdD8J)\
  \ 以简化维护，因为问题和 PR（拉请求）让较小的核心开发团队应接不交。\n\n几年后，模块又[合并了回来](https://groups.google.com/forum/#!searchin/ansible-project/repository%2420merge%7Csort:relevance/ansible-project/9WpXraBSLz8/q6HYIszBBwAJ)，因为使用子模块维护三个独立的\
  \ git 仓库，并尝试跟踪三个独立的 issue 和 PR 队列，比最初的状况更像是一场维护噩梦！\n\n2017 年，Galaxy 开始变得有些捉不肘，因为更多的用户在贡献\
  \ role，并试图通过将它们堆栈在 role 的结构中来共享模块和插件代码。\n\n同样在 2017 年，随着红帽扩展了 Ansible 的范围以更广泛地支持网络、安全和\
  \ Windows 自动化，维护负担的量几乎压垮了核心团队应对 Ansible 核心仓库中现维护的`数千`模块的能力：\n\n![Ansible core backlog\
  \ growth](img/7-ansible-repo-backlog-growth.png)\n\nAnsible 核心积压增长\n\n上面的图来自 Greg\
  \ Sutcliffe 的博客，标题为 [Collections, The Backlog View](https://emeraldreverie.org/2020/03/02/collections-the-backlog-view/)。在文中，他探讨了这一重大决策背后的数据：将\
  \ Ansible 插件和模块开发的负担从较小的 Ansible 核心团队转移到分布式的 `collections` 中。\n\n[Mazer](https://github.com/ansible/mazer)\
  \ 于 2018 年引入，旨在尝试管理 Ansible 内容分组（roles、模块和插件）的新方法。在 2020 年的 Ansible 2.9 版本中，Mazer\
  \ 的大部分功能已合并到随 Ansible 提供的现有 `ansible-galaxy` 命令行工具中。\n\n> Mazer 是书籍《局局战士》（Ender’s\
  \ Game）中的一个角色，“Ansible”的名字源于此。mazer 也是一种硬木制酒器。\n\n在 Ansible 2.8 和 2.10 发布之间，Ansible\
  \ 代码进行了重构，正如博客文章 [关于重构 Ansible 项目的思考](https://www.ansible.com/blog/thoughts-on-restructuring-the-ansible-project)\
  \ 所解释的那样。Ansible 核心仓库将仍保留少数基础插件和模块，供应商支持和红帽支持的模块将拆分到它们自己的 collections 中，而社区模块将位于`它们`自己的\
  \ collections 中。\n\n这一决定违背了“内置全功能”（batteries included）的哲学，但问题是 Ansible 已经成为现有最大的开源项目之一，将用于\
  \ Cisco 网络交换机（需要特殊知识）的模块与 PHP 的 Composer 或 Node.js 的 NPM 等开发者构建工具的模块放在同一个仓库中，已经不再是一个好主意了。\n\
  \n但用户仍然可以获得“内置全功能”版本的 Ansible——这也是你在这本书的大部分内容里使用的！区别在于，你也可以通过 collections 更轻松地额外安装任何类型的“电池”（而不仅仅是\
  \ roles）。\n\n### Collection 的剖析\n\n那么 collection 中`包含`了什么？\n\n在最基础的层，你需要将 collection\
  \ 放在正确的目录中，否则 Ansible 基于命名空间的 collection 加器（基于 Python 的 [PEP 420](https://www.python.org/dev/pep-0420/)）将无法识别它。\n\
  \n我们的目标是将本章之前的 `blue` 测试插件移动到一个新的 collection 中，并在 playbook 中使用它。我们需要创建一个 collection\
  \ 才能把 `blue` 插件放入其中。在这个例子中，由于 collection 旨在供本地 playbook 使用，并且它是为了存放颜色相关功能，我们可以将\
  \ collection 命名为 `local.colors`，这意味着 collection 的命名空间为 `local`（表示本地），而 collection\
  \ 名为 `colors`。\n\n就像 roles 一样，新的 collection 可以使用命令生成骨架，在这种情况下：\n\n/init-path ./collections/ansible_collections\n\
  \n你可能疑惑为什么我们要创建一个额外的 `ansible_collections` 目录来存放新的命名空间和 collection——以及为什么 collection\
  \ 必须位于命名空间，因为它只是一个本地 collection。这是为了让 Ansible 使用内置的命名空间加载器从 collection 中加载内容。\n\n\
  运行该命令后，你应该在 playbook 看到看到内容：\n\n```\nansible.cfg\ncollections/\n  ansible_collections/\n\
  \    local/\n      colors/\n        README.md\n        docs/\n        galaxy.yml\n\
  \        plugins/\n        roles/\nmain.yml\ntest_plugins/\n  blue.py\n```\n\n新的\
  \ collection 包含了 collection 所需的所有结构，但如果你不需要 docs、plugins 或 roles 目录，可以删除它们。\n\n\
  最重要的是 `galaxy.yml` 文件，它是 Ansible 在加载 collection 时读取其某些元数据所必需的。对于像这样的 `local` collection，默认值是可以接受的，但以后如果你想向\
  \ Ansible Galaxy 贡献 collection 并与他人共享，你需要调整该文件中的配置。\n\n#### 将插件放入 Collection\n\n\
  为了将 `blue.py` 插件移动到 collection，我们需要在 collection 的 `plugins` 目录中创建一个 `test` 目录（因为\
  \ `blue` 是一个测试插件），然后将 `blue.py` 插件移动到该文件夹：\n\n```\n$ mkdir collections/ansible_collections/local/colors/plugins/test\n\
  $ mv test_plugins/blue.py collections/ansible_collections/local/colors/\\\nplugins/test/blue.py\n\
  ```\n\n此时如果你运行 `main.yml` playbook，它将会失败，提示信息为：\n\n\n\n\n\n```\nTASK [Verify blue\
  \ is a form of blue.] ****************************\nfatal: [localhost]: FAILED!\
  \ => {\"msg\": \"The conditional check\n'my_color_choice is blue' failed. The error\
  \ was: template error\nwhile templating string: no test named 'blue'. String: {%\
  \ if\nmy_color_choice is blue %} True {% else %} False {% endif %}\"}\n```\n\n问题在于你还需要修改\
  \ Playbook，并确保 Ansible 知道你想使用 `local.colors` 集合中的 `blue` 模块。\n\n有两种方法可以实现这一点。对于集合模块和角色，你可以保持\
  \ Playbook 大部分内容不变，只需在 play 中添加一个 `collections` 部分，例如：\n\n```\n1 ---\n2 - hosts:\
  \ all\n3 \n4   collections:\n5     - local.colors\n6 \n7   vars:\n8     my_color_choice:\
  \ blue\n```\n\n但在这种情况下，我们使用的是测试插件，而不是普通的模块或角色，因此我们需要以特殊方式引用该模块，使用其“完全限定集合名称”（FQCN），在这个测试插件的例中它是\
  \ `local.colors.blue`。\n\n所以任务应该更改如下：\n\n```\n 7   tasks:\n 8     - name: \"Verify\
  \ {{ my_color_choice }} is a form of blue.\"\n 9       assert:\n10         that:\
  \ my_color_choice is local.colors.blue\n```\n\n现在，如果你运行该 playbook，它的运行方式将与之前相同，但使用的是\
  \ `local.colors` 集合中的模块。\n\n你添加到集合中的任何内容——插件、模块或角色——都可以以相同的方式进行调用。而对于 Ansible 内置的或你\
  \ playbook 本地的内容，你可以使用 `modulename` 或 `rolename` 进行调用；但对于来自集合的内容，你应该通过它们的 FQCN 进行调用。\n\
  \n除非你计划将集合代码共享给其他项目或整个 Ansible 社区，否则在本地 playbook 目录内单独维护自定义的特定于 playbook 内容（如插件、模块和角色）可能会更容易，就像我们在前面的章节中对\
  \ `test_plugins` 或 `roles` 所的那样。\n\n### 深入开发集合\n\n这个例子非常简单，甚至没有包含像 `blue` 测试插件文档这样的实用组件。你对集合可以做更多事情，包括添加角色、模块，并在未来可能甚至添加\
  \ playbook。\n\n角色作为集合的一部分时有不同的要求和限制（与在在 playbook 的 `roles/` 目录中单独构建或从 Galaxy 安装相比），这些限制列在\
  \ Ansible 的文档中：[开发集合](https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html)。\n\
  \n### Automation Hub 和 Ansible Galaxy 上的集合\n\n就像角色一样，集合可以与 Ansible Galaxy 或 Red\
  \ Hat 的 Automation Hub（它是 Red Hat Ansible Automation Platform 的一部分）上的整个社区共享。\n\n\
  如果你浏览 Galaxy 或 Automation Hub 并发现了一个你想要使用的集合，可以使用 `ansible-galaxy` 命令行工具安装该集合，就像你安装角色一样：\n\
  \n```\n$ ansible-galaxy collection install geerlingguy.k8s\n```\n\n此命令会将 `geerlingguy.k8s`\
  \ 集合安装到 Ansible 的默认集合路径中。我们稍后会详细讨论集合路径，但首先，你也可以像角色一样在 `requirements.yml` 文件中指定集合。\n\
  \n例如，如果你想使用 `requirements.yml` 文件安装同一个集合，可以这样指定：\n\n```\n---\ncollections:\n  -\
  \ name: geerlingguy.k8s\n```\n\n然后，在运行使用该集合的 playbook 之前，使用 `ansible-galaxy` 安装所有需要的集合：\n\
  \n```\n$ ansible-galaxy install -r requirements.yml\n```\n\n一旦安装了集合，你就可以任何 playbook\
  \ 中通过 FQCN 调用其内容，如下所示：\n\n```\n1 ---\n2 - hosts: all\n3 \n4   roles:\n     - geerlingguy.k8s.helm\n\
  ```\n\n### 集合版本约束\n\n对于许多 playbook，安装特定版本的集合可以保证更好的稳定性。由于贡献的集合（与角色不同）需要使用语义化版本，因此在从\
  \ Galaxy 或 Automation Hub 安装集合时，你可以在命令行中或 `requirements.yml` 中指定版本约束：\n\n```\n---\n\
  collections:\n  - name: geerlingguy.k8s\n    version: >=0.10.0,<0.11.0\n```\n\n\
  此版本约束告诉 Ansible 安装 `0.10.x` 系列中的任何版本，但不安装 `0.11.x` 或更高版本的版本。\n\n为了获得最大的稳定性，对你所依赖的任何内容设置[版本约束](https://docs.ansible.com/ansible/latest/user_guide/collections_using.html#installing-an-older-version-of-a-collection)\
  \ 是重要的。只要内容维护者遵循语义化版本的规则， playbook 因为其使用的任何更新的集合内容而崩溃将是非常罕见的。\n\n当你使用的集合发布了新的主版本时，你可以在准备好后提升版本约束并进行测试，而不是始终安装最新版本。\n\
  \n### 集合安装在哪里？\n\n当你从 Ansible Galaxy 或 Automation Hub 安装集合时，Ansible 使用配置指令 `collections_path`\
  \ 来确定集合应该安装在哪里。\n\n默认情况下，它们将安装在以下位置之一：\n\n*   `~/.ansible/collections`\n*   `/usr/share/ansible/collections`\n\
  \n但你可以通过设置环境变量 `ANSIBLE_COLLE_PATH` 或 `ansible.cfg` 文件中的 `collections_path` 来在自己的项目重覆盖该设置。\n\
  \n在某些情况下，我喜欢将集合安装到我的 playbook 本地路径中（例如通过设置 `collections_path = ./collections`），因为如果你将集合安装到更全局的位置之一，并且在多个项目中使用同一个集合，那么当新版本的集合更改了行为时，你可能会遇到问题。\n\
  \n关于路径有一个重要的注意点：Ansible 中的所有集合必须存储在包含 `ansible_collections` 子目录下、以命名空间和名称命名的文件夹的路径中。\n\
  \n这就是为什么在本章较早之前当我们创建 `local.colors` 集合时，我们最终将其创建在以下目录中：\n\n```\n./collections/ansible_collections/local/colors\n\
  ```\n\n同样，如果你使用 Galaxy 或 Automation Hub 安装集合，并将 `collections_path` 设置为 `./collections`，那么它们最终也会位于\
  \ `collections/ansible_collections` 目录内，并在命名空间目录内部。\n\n### 总结\n\nAnsible 允许更方便地分发\
  \ Ansible 内容——插件、模块和角色，并且有助于 Ansible 自身的维护更加均匀。\n\n你可能会发现自己有时使用裸角色，有时使用集合（带角色或不带角色）。在任何情况下，Ansible\
  \ 都让整合和共享自定义 Ansible 功能变得简单！\n\n```\n ____________________________________\n/ 清晰优于巧妙。\
  \ \\\n\\ (Eric S. Raymond)                  /\n ------------------------------------\n\
  \        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n\
  \                ||----w |\n                ||     ||\n```\n\n书中之前给出基础清单文件示例（参见第\
  \ 1 章的[基础清单示例]）。对于最简单的目的，一个基础的 `hosts.ini` 清单文件就足够描述 Ansible 如何访问你想要管理的服务器。\n\n\
  稍后，介绍了一个稍微复杂的点的清单文件（参见第 3 章的[多服务器清单文件]），它允许我们告诉 Ansible 多个台服务器，甚至将它们分组为角色相关的组，以便我们针对特定的组运行特定的\
  \ playbook。\n\n让我们回到基础清单文件示例并从那里开始构建。\n\n\n\n\n\n```\n1 # 清单文件 hosts.ini\n2 \n3\
  \ # 组使用方括号定义（例如 [groupname]）。\n4 # 组中的每台服务器单独占一行定义。\n5 [myapp]\n6 www.myapp.com\n\
  ```\n\n如果你想对此清单中的所有 `myapp` 服务器运行 `ansible` playbook（目前只有一个，即 `www.myapp.com`），你可以像这样设置\
  \ playbook：\n\n```yaml\n---\n- hosts: myapp\n\n  tasks:\n    [...]\n```\n\n如果你想对清单中的所有\
  \ `myapp` 服务器运行一个即时命令（ad-hoc command），可以像下面这样运行命令：\n\n```bash\n## 使用 ansible 检查所有\
  \ myapp 服务器的内存使用。\n$ ansible -i hosts.ini myapp -a \"free -m\"\n```\n\n### # 真实世界的\
  \ Web 应用程序服务器清单\n\n上面的示例对于单服务器服务以及微型应用或网站来说可能足够了，但大多数现实世界中的应用需要更多的服务器，并且通常为每个应用关注点准备单独的服务器（数据库、缓存、应用程序、队列等）。让我们来看我用于一个监控服务器运行时间的小型\
  \ Web 应用程序的真实清单文件，[Server Check.in](https://servercheck.in/)。\n\n```ini\n 1 # 单个\
  \ Server Check.in 服务器。\n 2 [servercheck-web]\n 3 www1.servercheck.in\n 4 www2.servercheck.in\n\
  \ 5 \n 6 [servercheck-web:vars]\n 7 ansible_user=servercheck_svc\n 8 \n 9 [servercheck-db]\n\
  10 db1.servercheck.in\n11 \n12 [servercheck-log]\n13 log.servercheck.in\n14 \n15\
  \ [servercheck-backup]\n16 backup.servercheck.in\n17 \n18 [servercheck-nodejs]\n\
  19 atl1.servercheck.in\n20 atl2.servercheck.in\n21 nyc1.servercheck.in\n22 nyc2.servercheck.in\n\
  23 nyc3.servercheck.in\n24 ned1.servercheck.in\n25 ned2.servercheck.in\n26 \n 27\
  \ [servercheck-nodejs:vars]\n 28 ansible_user=servercheck_svc\n 29 foo=bar\n30 \n\
  \ 31 # Server Check.in 基于发行版的组。\n 32 [centos:children]\n33 servercheck-web\n34 servercheck-db\n\
  35 servercheck-nodejs\n36 servercheck-backup\n37 \n 38 [ubuntu:children]\n39 servercheck-log\n\
  ```\n\n这个清单初看之下可能有些杂乱，但如果你将其拆分为简单的分组（Web 应用服务器、数据库服务器、日志服务器和 node.js 应用服务器），它描述了一个非常直观的架构。\n\
  \n![Server Check.in 架构。](img/8-server-checkin-infrastructure.png)\n\nServer Check.in\
  \ 架构。\n\n第 1-29 行描述了几组服务器（有些组只有一台服务器），因此 playbooks 和 `ansible` 命令可以通过组名引用这些组。第 6-7\
  \ 行和 27-29 行设置了仅适用于该组内服务器的变量（例如 `[servercheck-nodejs:vars]` 下方的变量将仅适用于 `servercheck-nodejs`\
  \ 组中的服务器）。\n\n第 31-39 行描述了组组（使用 `groupname:children` 来描述“子”组），这允许进行非常有用的抽象。\n\n\
  以这种方式描述基础设施为在使用 Ansible 时提供了极大的灵活性。考虑为你所有的 CentOS 服务器修补漏洞的任务；你不再需要登录每台服务器，甚至不需要对所有组分别运行\
  \ `ansible` 命令，使用上面的结构可以让你轻轻松地针对所有 `centos` 服务器运行 ansible 命令或 playbook。\n\n例如，当\
  \ 2014 年发现 [Shellshock](https://en.wikipedia.org/wiki/Shellshock_(software_bug))\
  \ 漏洞时，所有主要发行版在几小时内就发布了修复了补丁的 bash 包。要更新所有 Server Check.in 服务器，只需要：\n\n```bash\n\
  $ ansible centos -m dnf -a \"name=bash state=latest\"\n```\n\n你甚至可以更进一步，创建一个小的 playbook\
  \ 来修补该漏洞，然后运行测试以确保漏洞不再存在，如[此 playbook](https://raymii.org/s/articles/Patch_CVE-2014-6271_Shellshock_with_Ansible.html)所示。这还允许你以检查模式运行\
  \ playbook，或通过持续集成系统运行它，以验证修复在非生产环境中有效。\n\n这种基础设施清单的另一个好处在于，你可以创建一个顶层 playbook，针对你的所有基础设施运行某些角色或任务，针对某种特定\
  \ Linux 发行版的所有服务器运行另一个，另一个针对你整个基础设施中的所有服务器运行。\n\n考虑下面这个用于完全配置所有服务器的示例主 playbook：\n\
  \n```yaml\n 1 ---\n 2 # 在所有服务器上设置基础、标准化的组件。\n 3 - hosts: all\n 4   become: yes\n\
  \ 5   roles:\n 6     - security\n 7     - logging\n 8     - firewall\n 9 \n10 #\
  \ 配置 Web 应用服务器。\n11 - hosts: servercheck-web\n12   roles:\n13     - nginx\n14  \
  \   - php\n15     - servercheck-web\n16 \n17 # 配置数据库服务器。\n18 - hosts: servercheck-db\n\
  19   roles:\n20     - pgsql\n21     - db-tuning\n22 \n23 # 配置日志服务器。\n24 - hosts:\
  \ servercheck-log\n25   roles:\n26     - java\n27     - elasticsearch\n28     -\
  \ logstash\n29     - kibana\n30 \n31 # 配置备份服务器。\n32 - hosts: servercheck-backup\n\
  33   roles:\n34     - backup\n35 \n36 # 配置 Node.js 应用服务器。\n37 - hosts: servercheck-nodejs\n\
  38   roles:\n39     - servercheck-node\n```\n\n你有许多不同的方法来构建你的基础设施管理 playbooks 和角色，我们将在稍后的章节中探索一些，但对于简单的基础设施，像这样的结构就是足够且易于维护的。\n\
  \n#### # 非生产环境，独立的清单文件\n\n使用上面的 playbook 和基础清单文件对于你的生产基础设施非常棒，但当你想配置一个独立但类似的架构（例如开发环境或用户认证环境）时该怎么办？\n\
  \n在这种情况下，最简单的方法是使用独立的清单文件。对于典型的团队管理基础设施，我建议在与你的 Ansible playbooks 相同的版本控制仓库中为每个环境包含一个清单文件，也许放在\
  \ `inventories` 目录内。\n\n例如，我会将清单文件的内容存储在一个名为 `inventory-prod` 的文件中，然后将其复制，并在适当的地方更改服务器名称（例如\
  \ `[servercheck-web]` 组在开发环境中将只有 `www-dev1.servercheck.in`），并为环境命名文件：\n\n```text\n\
  servercheck/\n  inventories/\n    inventory-prod\n    inventory-cert\n    inventory-dev\n\
  \  playbook.yml\n```\n\n现在，当运行 `playbook.yml` 来配置开发基础设施时，我会传入开发清单的路径（假设我的当前工作目录是\
  \ `servercheck/`）：\n\n```bash\n$ ansible-playbook playbook.yml -i inventories/inventory-dev\n\
  ```\n\n通过清单变量（我们将进一步探讨）以及构建良好且有效使用这些变量的角色和/或任务，你可以通过更改清单文件中的某些内容，构建出具有特定环境配置的整个基础设施。\n\
  \n### # 清单变量\n\n第 5 章在清单变量 部分介绍了通过清单管理单个主机或主机组的变量的基本方法，但在这里值得探索通过清单定义和覆盖变量的不同方法。\n\
  \n对于极简单的用例——通常当你需要定义一两个与连接相关的变量（如 `ansible_user` 或 `ansible_ssh_port`）时——你可以将变量直接放在清单文件中。\n\
  \n假设我们有一个基础 Web 应用程序的独立清单文件，以下是文件中定义变量的一些示例：\n\n```ini\n 1 [www]\n 2 # 你可以在主机旁内联定义主机特定的变量。\n\
  \ 3 www1.example.com ansible_user=johndoe\n 4 www2.example.com\n 5 \n 6 [db]\n 7\
  \ db1.example.com\n 8 db2.example.com\n 9 \n10 # 你可以添加'[group:vars]'标题来创建\n11 #\
  \ 适用于整个清单组的。\n12 [db:vars]\n13 ansible_ssh_port=5222\n14 database_performance_mode=true\n\
  ```\n\n\n\n\n通常情况下，避免在静态清单文件中抛入过多的变量更好，因为这些变量通常可见性较低，而且它们还与你的架构定义混合在一起了。特别是对于主机特定的变量（每个主机占据一行长文本），这种处理主机特定和组特定变量的方法不仅是不可维护的，且可见性低。\n\
  \n幸运的是，Ansible 提供了一种更灵活的方式来声明主机变量和组变量。\n\n## `host_vars`\n\n对于 [Hosted Apache Solr](https://hostedapachesolr.com/)，`solr`\
  \ 组中的不同服务器有不同的内存需求。告诉 Ansible 覆盖我们 Ansible Playbook 中默认变量（在本例中为 `tomcat_xmx` 变量）的最简单方法是使用\
  \ `host_vars` 目录（该目录可以放在与清单文件相同的位置，也可以放在 Playbook 的根目录下），并放置一个与需要覆盖变量的主机同名命名的 YAML\
  \ 文件。\n\n为了直观说明 `host_vars` 的用法，我们假设有如下的目录结构：\n\n```\nhostedapachesolr/\n  host_vars/\n\
  \    nyc1.hostedapachesolr.com\n  inventory/\n    hosts\n  main.yml\n```\n\n`inventory/hosts`\
  \ 文件包含了按组对所有服务器简单定义：\n\n```\n1 [solr]\n2 nyc1.hostedapachesolr.com\n3 nyc2.hostedapachesolr.com\n\
  4 jap1.hostedapachesolr.com\n5 ...\n6 \n7 [log]\n8 log.hostedapachesolr.com\n```\n\
  \nAnsible 将在以下位置搜索文件：\n\n```\nhostedapachesolr/host_vars/nyc1.hostedapachesolr.com\n\
  ```\n\n或者：\n\n```\nhostedapachesolr/inventory/host_vars/nyc1.hostedapachesolr.com\n\
  ```\n\n如果该文件中定义了任何变量（YAML 格式），这些变量将覆盖所有其他 Playbook、角色变量以及收集到的 Facts，且仅针对该单个主机。\n\
  \n`nyc1.hostedapachesolr.com` 主机的 host_vars 文件如下：\n\n```\n1 ---\n2 tomcat_xmx: \"\
  4096m\"\n```\n\n`tomcat_xmx` 的默认值通常为 `2048m`，但当 Ansible 对 `nyc1.hostedapachesolr.com`\
  \ 运行 Playbook 时，`tomcat_xmx` 的值将变为 `4096m`。\n\n使用 `host_vars` 覆盖主机变量比直接在静态清单文件中操作要易维护得多，而且能更清晰地看到哪些主机获得了哪些覆盖。\n\
  \n## `group_vars`\n\n与 `host_vars` 类似，Ansible 会自动加载位于 Playbook 或清单文件位置的 `group_vars`\
  \ 目录中任何与清单组同名的文件。\n\n使用同样的示例，我们将为整个服务器组覆盖一个特定的变量。首先，我们添加一个 `group_vars` 目录，并创建一个与需要覆盖变量的组同名的文件：\n\
  \n```\nhostedapachesolr/\n  group_vars/\n    solr\n  host_vars/\n    nyc1.hostedapachesolr.com\n\
  \  inventory/\n    hosts\n  main.yml\n```\n\n然后，在 `group_vars/solr` 内部，使用 YAML 定义一个应用到\
  \ `solr` 组服务器的变量列表：\n\n```\n1 ---\n2 do_something_amazing: true\n3 foo: bar\n```\n\
  \n通常，如果你的 Playbook 仅在一个主机组上运行，通过包含变量的 `vars` 文件在 Playbook 中定义变量会更简单。但在许多情况下，你可能会对多个清单组运行\
  \ Playbook 或应用一组角色（roles）。在这些情况下，你可能需要使用 `group_vars` 为一个或多个服务器组覆盖特定变量。\n\n## 临时基础设施：动态清单\n\
  \n在许多情况下，静态清单足以描述你的基础设施。在处理小型应用程序、低流量 Web 应用程序和个人工作站时，手动管理清单文件足够简单。\n\n然而，在云计算和高可扩展应用架构的时代，通常需要在短时间内为基础设施添加几十或上百台服务器——或者持续地添加和删除服务器，以随着流量的增长和消退。在这种情况下，手动管理单个清单文件是繁琐的（甚至是不可能的），特别是当你使用自动伸缩基础设施时，新实例需要在几分钟或几秒钟内完成配置。\n\
  \n即使在基于容器的基础设施的情况下，新实例也需要正确配置，拥有正确的端口映射、应用程序设置和文件系统配置。\n\n针对这些情况，Ansible 允许你动态定义清单。如果你正在使用大型云端托管提供商之一，很有可能已经有一个动态清单脚本（Ansible\
  \ 使用它来构建清单）供你使用。Ansible 核心已包含了 Amazon Web Services、Cobbler、DigitalOcean、Linode、OpenStack\
  \ 以及其他大型提供者的脚本，稍后我们将探索如何创建自己的动态清单脚本（如果你没有使用主要的托管提供商或云管理平台）。\n\n## 使用 DigitalOcean\
  \ 的动态清单\n\nDigitalOcean 是全球前五大的托管公司之一，自 2011 年成立以来增长迅速。其极速增长的原因之一是配置新“droplets”（云\
  \ VPS 服务器）的便利性以及其提供的价值；截至本文编写时，你可以以每月 5 美元的价格获得一个拥有 1GB 内存和充足 SSD 存储的相当快速的 VPS。DigitalOcean\
  \ 的 API 对开发者友好的理念让 Ansible 能够与 droplets 交互；你可以使用动态清单来 创建、管理和删除 droplets。\n\n###\
  \ DigitalOcean 账户准备工作\n\n在执行后续示例之前，你需要：\n\n1. DigitalOcean 账户（访问 www.digitalocean.com\
  \ 注册）。\n2. DigitalOcean API 令牌。参考[此指南](https://www.digitalocean.com/tutorials/how-to-use-the-digitalocean-api-v2)\
  \ 生成供 Ansible 使用的个人访问令牌（创建令牌时授予读写权限）。\n3. SSH 密钥对，用于连接 DigitalOcean 服务器。参考[此指南](https://www.digitalocean.com/tutorials/how-to-use-ssh-keys-with-digitalocean-droplets)\
  \ 创建密钥对并将公钥添加到你的 DigitalOcean 账户。\n\n一旦准备好这三项，你就可以通过 Ansible 与你的 DigitalOcean 账户通信。\n\
  \n### 连接到 DigitalOcean 账户\n\n你有多种方式指定 DigitalOcean 个人访问令牌（包括通过任务传递 `api_token`，或者在本地环境中导出为\
  \ `DO_API_TOKEN` 或 `DO_API_KEY`）。对于我们的示例，我们将使用环境变量（因为它们容易配置，且同时适用于 Ansible 的 `digital_ocean`\
  \ 模块和动态清单脚本）。打开终端会话并输入以下命令：\n\n```bash\nexport DO_API_TOKEN=你的令牌\n```\n\n在我们可以使用动态清单脚本发现我们的\
  \ droplets 之前，让我们使用 Ansible 部署一个新的 droplet。\n\n### 使用 Ansible 创建 droplet\n\n创建一个名为\
  \ `provision.yml` 的新 Playbook，内容如下：\n\n```\n 1 ---\n2 - hosts: localhost\n3   connection:\
  \ local\n4   gather_facts: False\n5 \n6   tasks:\n 7     - name: 创建新的 Droplet。\n\
  \ 8       digital_ocean_droplet:\n 9         state: present\n10         name: ansible-test\n\
  11         private_networking: yes\n12         size: 1gb\n13         image_id: centos-7-x64\n\
  14         region: nyc3\n15         # 根据你的账户自定义\n16         ssh_keys:\n17      \
  \     - 138954\n18         # 用于幂等性/仅创建一个。\n19         unique_name: yes\n20     \
  \  register: do\n```\n\n\n\n`digital_ocean` 模块让你能够轻松地创建、管理和删除 droplet。你可以阅读所有选项的文档，但上述是主要选项的概述。`name`\
  \ 用于设置 droplet 的主机名，如果你想销毁 droplet，也可以将 `state` 设置为 `deleted`，其他选项则告诉 DigitalOcean\
  \ 在何处设置 droplet，以及使用什么操作系统和配置。\n\n我们在 `digital_ocean` 任务中使用 `register` 作为其一部分，这样在需要时，我们可以立即开始使用并配置新主机。如果你想查看变量\
  \ `do` 的输出包含包含内容，请添加以下 `debug` 任务：\n\n```\n22     - debug: var=do\n```\n\n然后运行 playbook：\n\
  \n```\n$ ansible-playbook provision.yml\n\nPLAY [localhost] ***********************************************\n\
  \nTASK [Create new Droplet.] *************************************\nchanged: [localhost]\n\
  \nTASK [debug] ***************************************************\nok: [127.0.0.1]\
