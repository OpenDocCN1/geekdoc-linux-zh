  \n## 使用加密的通信\n\n我们花费大量时间讨论 SSH 的这些以及它的工作方式，因为它在许多方面都是安全的基石。为了确保我们通过加密连接安全地操作，我们将查看在\
  \ `/etc/ssh/sshd_config` 中配置的 SSH 设置，以及如何使用 Ansible 控制它们。\n\n对于我们的安全服务器，我们想要禁用密码\
  \ SSH 身份验证（在这样做之前确保你可以通过密钥登录！禁用根登录并更改 SSH 运行的端口。\n\n```\n 1 ---\n2 - hosts: example\n\
  \ 3 \n4   handlers:\n5     # Note: Use 'sshd' for Red Hat and its derivatives.\n\
  \ 6     - name: restart ssh\n7       service: name=ssh state=restarted\n8 \n9  \
  \ tasks:\n10     - name: Update SSH configuration to be more secure.\n11       lineinfile:\n\
  12         dest: /etc/ssh/sshd_config\n13         regexp: \"{{ item.regexp }}\"\n\
  14         line: \"{{ item.line }}\"\n15         state: present\n16         validate:\
  \ 'sshd -t -f %s'\n17       with_items:\n18         - regexp: \"^PasswordAuthentication\"\
  \n19           line: \"PasswordAuthentication no\"\n20         - regexp: \"^PermitRootLogin\"\
  \n21           line: \"PermitRootLogin no\"\n22         - regexp: \"^Port\"\n23\
  \           line: \"2849\"\n24       notify: restart ssh\n```\n\n在这个极其简单的 playbook\
  \ 中，我们使用在 `handlers` 部分定义的句柄来重启 `ssh` 服务，然后使用 Ansible 的 `lineinfile` 模块设置 SSH 配置项（`PasswordAuthentication\
  \ no`、`PermitRootLogin no` 和 `Port 2849`）。\n\n如果你经常编辑更改后可能导致故障的文件，重要的是使用 `validate`\
  \ 选项验证更改（在此情况下使用 `sshd` 的 `-t` 选项并传递文件路径）。这可以确保你在保存更改时不会破坏 `sudo`。`%s` 是文件路径的占位符，Ansible\
  \ 执行命令时会填充它。\n\n## 禁用根登录并使用 `sudo`\n\n我们已经在上一节中通过 Ansible 的 `lineinfile` 模块禁用了根登录，但我们在这里将讨论一个通用的\
  \ Linux 最佳实践：如果绝对不需要使用 root 账户，就不要使用它。\n\nLinux 的 `sudo` 允许你（或其他用户）以 root 权限运行某些命令（默认情况下——你也可以作为其他用户运行命令），确保你能够执行需要高权限的操作，而无需以\
  \ root（或其他用户）身份登录。\n\n\n\n\n使用 `sudo` 还会强制你在执行某些具有安全影响的操作时变得更加显式，这始终是一件好事。你不会希望意外删除必要的文件，或者关闭某个必需的服务，如果你是\
  \ root 用户，这些操作很容易就能完成。\n\n在 Ansible 中，建议你使用普通用户或管理员级系统账户登录远程服务器，并在任何需要提升权限的任务、角色（role）、包含文件（include）或\
  \ playbook 中使用值为 `yes` 的 `become` 参数。例如，如果重启 Apache 需要提升权限，你可以这样写写任务：\n\n```\n-\
  \ name: Restart Apache.\n  service:\n    name: httpd\n    state: restarted\n  become:\
  \ yes\n```\n\n在任务中添加 `become_user: [username]` 可以指定在使用 `sudo` 时使用的特定用户账户（这仅在任务或\
  \ playbook 中已设置了 `become` 的情况下才会生效）。\n\n你还可以使用 Ansible 来控制 `sudo` 的配置，定义谁应该有权访问哪些命令，以及用户是否需要输入密码等。\n\
  \n例如，通过使用 Ansible 的 `lineinfile` 模块在 `/etc/sudoers` 文件中添加一行，设置用户 `johndoe` 允许通过\
  \ `sudo` 以 root 身份使用任何命令：\n\n```\n- name: Add sudo rights for deployment user.\n\
  \  lineinfile:\n    dest: /etc/sudoers\n    regexp: '^johndoe'\n    line: 'johndoe\
  \ ALL=(ALL) NOPASSWD: ALL'\n    state: present\n    validate: 'visudo -cf %s'\n\
  ```\n\n与之前的 SSH 配置一样，我们确保对 sudoers 文件进行 `validate`，以确保 Ansible 的更改不会导致配置损坏。\n\n\
  更改 sudoers 文件的另一种方法是在本地创建一个 sudoers 文件，并使用 Ansible 的 `copy` 模块将其拷贝，如下：\n\n```\n\
  - name: Copy validated sudoers file into place.\n  copy:\n    src: sudoers\n   \
  \ dest: /etc/sudoers\n    validate: 'visudo -cf %s'\n```\n\n## 移除未使用的软件，仅开放必要的端口\n\
  \n在服务器广泛使用配置管理工具之前，当“雪花服务器”（snowflake servers）还是常态时，服务器会因为不再活跃使用的额外软件而变得臃肿，开放旧且不必要的服务的端口，并且旧的配置设置会留下潜在的攻击向量。\n\
  \n如果你没有在活跃使用某个软件，或者存在一个过时的 cron 任务，请将其删除。如果你使用 Ansible 管理你的整个基础设施，这不应该是一个问题，因为当有重大的配置和/包更改时，你只需启动新服务器来替换旧服务器即可。如果不是的话，考虑添加一个“清理”角色或至少添加一个任务来移除不应安装的包，例如：\n\
  \n```\n- name: Remove unused packages.\n  package:\n    name:\n      - nano\n  \
  \    - sendmail\n    state: absent\n    purge: yes\n```\n\n通过 `package`、`dnf`、`apt`、`file`\
  \ 和 `mysql_db` 等模块，`state: absent` 参数意味着 Ansible 将移除你指定的任何包、文件或数据库，并在以后运行 playbook\
  \ 期间检查以确保该状态依然维持。\n\n仅开放必要的端口有助于减小攻击面，只需要几条防火墙规则。这将在“使用配置恰当的防火墙”部分进行详细介绍，但作为一个示例，除非你的服务器将用作\
  \ SMTP 继继服务器，否则不要在服务器上开放 25 端口。此外，确保你在开放端口上监听的服务已配置为仅允许来自信任客户端的访问。\n\n## 使用最小权限原则\n\
  \n用户、应用程序和进程应该只能访问其运行所需的必要信息（文件）和资源（内存、网络端口等）。\n\n本章中的许多其他基本安全措施与最小权限原则有间接关系，但用户账户配置和文件权限是与该原则直接相关的两个领域。\n\
  \n### 用户账户配置\n\n新用户账户默认情况下在 Linux 服务器上的权限相当有限。它们通常有一个家目录，它们对该目录拥有完全控制权，但系统上的任何其他文件夹或文件只有在文件夹设置了组权限的情况下才是可读、写或执行的。\n\
  \n通常，用户通过两种方法获取其他文件和其他服务的：\n\n1. 将用户添加到具有更广泛访问权限的其他组。\n2. 允许用户使用 `sudo` 命令以 `root`\
  \ 或另一个用户的身份执行命令并访问文件。\n\n对于前一种方法，请阅读下一节关于文件权限的内容以了解如何限制访问。对于后者，请确保你理解了本章早些解释的 sudoers\
  \ 的用法。\n\n### 文件权限\n\n每个处理文件的 Ansible 模块都提供了文件所有权权限参数，包括 `owner`、`group` 和 `mode`。几乎每当你处理文件（使用\
  \ `copy`、`template`、`file` 等）时，都应该显式定义正确的权限和所有权。例如，对于一个只允许 root 用户读取或写入的配置文件（在我们的示例中为\
  \ GitLab 配置文件），设置以下内容：\n\n```\n- name: Configure the GitLab global configuration\
  \ file.\n  file:\n    path: /etc/gitlab/gitlab.rb\n    owner: root\n    group: root\n\
  \    mode: 0600\n```\n\n经验较少的管理员往往权限过于宽松，将文件和目录设置为 `777` 来解决他们应用程序遇到的问题。为了允许一个用户（例如，你的\
  \ Web 服务器用户，`httpd` 或 `nginx`）访问目录，你应该考虑将目录或文件的组设置为该用户所在的组，而不是赋予系统上的所有用户！\n\n例如，如果你有一个\
  \ Web 应用程序目录，用户（在 Ansible 术语中为“owner”）可能是你的个人用户账户，或者是服务器上的部署或服务账户。将文件的组设置为 Web 服务器用户所在的组，Web\
  \ 服务器现在就可以访问这些文件了（假设你为用户和组设置了相同的权限，如 `664`）。\n\n## 更新操作系统和安装的软件\n\n每年，运行在服务器上的包都会发布许多安全更新，其中某些修复了关键漏洞。如果你不保持服务器软件更新，将变得非常脆弱，特别是当像\
  \ Heartbleed 这样的漏洞被发现时。\n\n至少，你应该安排定期补丁维护和包升级窗口，并确保在应用到生产基础设施之前，在非关键服务器上测试升级和补丁。\n\
  \n由于你已经通过 Ansible 清单描述了整个基础设施，你应该可以使用类似下面的命令升级 RHEL 系统上的所有已安装包：\n\n```\n$ ansible\
  \ webservers -m dnf -a \"name=* state=latest\"\n```\n\n在 Debian 系统上，语法类似：\n\n```\n\
  $ ansible webservers -m apt -a \"upgrade=dist update_cache=yes\"\n```\n\n上述命令将更新服务器上的*所有*内容。有时，你只想安装安全相关的更新，或者排除某些包。在这些情况下，你需要配置\
  \ `dnf` 或 `apt` 来告诉它们该做什么（在 RHEL 系统上编辑 `/etc/dnf/dnf.conf`，或在 Debian 系统上使用 `apt-mark\
  \ hold [package-name]` 来保持某些包的当前版本）。\n\n### 自动化更新\n\n完全自动的每日或每周包和系统升级提供更高的安全性。并不是每个环境或公司都能适应频繁的自动升级（特别是如果你的应用程序曾已知由于过去的包更新而崩溃，或者依赖于自定义构建或特定的包版本），但如果你对服务器这样做，它将增加你基础设施的安全深度。\n\
  \n\n\n\nRHEL 和 CentOS 6 和 7（以及旧版本的 Fedora）使用基于 cron 的包 `yum-cron` 进行自动更新。对于基本的“设置后即忽略”的使用，请安装\
  \ `yum-cron` 并确保它已启动且设置为系统启动时运行：\n\n```\n- name: Install yum-cron.\n  yum:\n   \
  \ name: yum-cron\n    state: present\n\n- name: Ensure yum-cron is running and enabled\
  \ on boot.\n  service:\n    name: yum-cron\n    state: started\n    enabled: yes\n\
  ```\n\n进一步的配置（例如从自动更新中排除的包）在 `/etc/yum.conf` 路径的文件中完成。\n\n对于 RHEL/Rocky/Alma Linux\
  \ 8 及更高版本（以及最新版本的 Fedora），请安装 `dnf-automatic` 代替 `yum-cron`，需要启动的服务为 `dnf-automatic-install.timer`（而不是\
  \ `yum-cron`）。\n\n## 为基于 Debian 的系统实现更新自动化\n\nDebian 及其衍生版通常使用 `unattended-upgrades`\
  \ 包来配置自动更新。与 `yum-cron` 一样，它很容易安装，且其配置位于 `/etc/apt/apt.conf.d/` 中的各种文件中：\n\n```\n\
  - name: Install unattended upgrades package.\n  apt:\n    name: unattended-upgrades\n\
  \    state: present\n\n- name: Copy unattended-upgrades configuration files in place.\n\
  \  template:\n    src: \"../templates/{{ item }}.j2\"\n    dest: \"/etc/apt/apt.conf.d/{{\
  \ item }}\"\n    owner: root\n    group: root\n    mode: 0644\n  with_items:\n \
  \   - 20auto-upgrades\n    - 50unattended-upgrades\n```\n\n在第二个任务中复制的模板文件应该如下：\n\
  \n```\n# File: /etc/apt/apt.conf.d/20auto-upgrades\nAPT::Periodic::Update-Package-Lists\
  \ \"1\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n```\n\n该文件为作为 unattended upgrades\
  \ 包一部分运行的 `apt` 脚本提供配置，并告诉 apt 是否启用无人升级。\n\n```\n# File: /etc/apt/apt.conf.d/50unattended-upgrades\n\
  Unattended-Upgrade::Automatic-Reboot \"false\";\n\nUnattended-Upgrade::DevRelease\
  \ \"false\";\n\nUnattended-Upgrade::Allowed-Origins {\n        \"${distro_id}:${distro_codename}\"\
  ;\n        \"${distro_id}:${distro_codename}-security\";\n        \"${distro_id}ESM:${distro_codename}\"\
  ;\n//      \"${distro_id}:${distro_codename}-updates\";\n//      \"${distro_id}:${distro_codename}-proposed\"\
  ;\n//      \"${distro_id}:${distro_codename}-backports\";\n};\n```\n\n该文件为无人升级提供了进一步的配置，例如是否为需要重启的包和内核升级自动重启服务器，或者应该检查哪些\
  \ `apt` 源以获取更新包。\n\n## 使用配置适当的防火墙\n\n如果你在建造一个安全的金库，你不会希望有许多通金库的门窗。相反，你会建造钢筋混凝土墙，并安装一两扇坚固的金属门。\n\
  \n同样，你应该关闭所有服务器上任何未显式要求保持打开的端口——无论是在网络 DMZ 中还是面向整个互联网。现在有几十种管理防火墙的方法，从 `iptables`\
  \ 以及像 `ufw` 和 `firewalld` 这种有助于简化 iptables 配置的实用工具，到 AWS 安全组和其他外部防火墙服务。\n\nAnsible\
  \ 内置了使用 `ufw`（常见于较新的 Debian 和 Ubuntu 发行版）和 `firewalld`（常见于较新的 Fedora 以及基于 RHEL 的发行版）配置服务器防火墙的支持。\n\
  \n### 在 Debian 或 Ubuntu 上使用 `ufw` 配置防火墙\n\n以下是一个完整的防火墙配置，用于锁定 Debian 或 Ubuntu 服务器上的大部分内容，仅通过端口\
  \ 22 (SSH)、80 (HTTP) 和 123 (NTP) 允许流量：\n\n```\n- name: Configure open ports with\
  \ ufw.\n  ufw:\n    rule: \"{{ item.rule }}\"\n    port: \"{{ item.port }}\"\n \
  \   proto: \"{{ item.proto }}\"\n  with_items:\n    - { rule: 'allow', port: 22,\
  \ proto: 'tcp' }\n    - { rule: 'allow', port: 80, proto: 'tcp' }\n    - { rule:\
  \ 'allow', port: 123, proto: 'udp' }\n\n- name: Configure default incoming/outgoing\
  \ rules with ufw.\n  ufw:\n    direction: \"{{ item.direction }}\"\n    policy:\
  \ \"{{ item.policy }}\"\n    state: enabled\n  with_items:\n    - { direction: outgoing,\
  \ policy: allow }\n    - { direction: incoming, policy: deny }\n```\n\n如果你运行带有上述规则的\
  \ playbook，然后登录机器（或使用 `ansible` 命令）并运行 `sudo ufw status verbose`，你应该看到配置已更新为如下：\n\
  \n```\n$ sudo ufw status verbose\nStatus: active\nLogging: on (low)\nDefault: deny\
  \ (incoming), allow (outgoing), disabled (routed)\nNew profiles: skip\n\nTo    \
  \                     Action      From\n--                         ------      ----\n\
  22/tcp                     ALLOW IN    Anywhere\n80/tcp                     ALLOW\
  \ IN    Anywhere\n123/udp                    ALLOW IN    Anywhere\n```\n\n### 在\
  \ RHEL/Rocky/Alma Linux 上使用 `firewalld` 配置防火墙\n\n在基于 RHEL 的系统上可以使用 `firewalld` 类似的方法：\n\
  \n```yaml\n- name: Open specific ports in firewalld.\n  firewalld:\n    port: \"\
  {{ item.port }}\"\n    protocol: \"{{ item.proto }}\"\n    state: enabled\n  with_items:\n\
  \    - { port: 22, proto: 'tcp' }\n    - { port: 80, proto: 'tcp' }\n    - { port:\
  \ 123, proto: 'udp' }\n```\n\n\n\n\n只有你最清楚服务器上哪些日志是最需要监控的，但一些常见的日志包括数据库慢查询日志、Web\
  \ 服务器访问和错误日志、授权日志以及 cron 任务日志。使用如 ELK 栈（在第 9 章的食谱中演示）、Munin、Nagios 甚至托管服务等工具，可以确保日志被填充并进行监控。\n\
  \n此外，你应该始终使用如 `logrotate` 等工具（根据你基础架构的需求）对日志文件进行轮转和归档，并且应该对日志文件大小启用监控，这样当某个日志文件或目录增长得过大时，你就能获得早期的预警。Ansible\
  \ Galaxy 上有许多 `logrotate` 角色（例如 [Nick Hammond 的 `logrotate` 角色](https://galaxy.ansible.com/nickhammond/logrotate/)），它们让轮转配置变得非常简单。\n\
  \n## 监控登录并拦截可疑 IP 地址\n\n如果你曾经在公共互联网上设置过新服务器，并启用了端口 `22` 的 `SSH` 且允许基于密码的登录，你就知道脚本登录的洪流开始得有多快了。许多蜜罐服务器每小时都能检测到数百或数千次尝试。\n\
  \n如果你允许基于密码的登录（针对 `SSH`、你的 Web 应用或其他任何内容），你需要实现某种形式的监控和速率限制。在最基础层面，你应该安装如 [Fail2Ban](http://www.fail2ban.org/wiki/index.php/Main_Page)\
  \ 等工具，它监控日志文件并在给定时间内检测到过多失败的登录尝试时禁止 IP 地址。\n\n以下是一组你可以添加到你的 playbook 中的任务，用于安装 `Fail2Ban`\
  \ 并确保它在 Debian 或基于 RHEL 的发行版上已启动：\n\n```\n- name: Install fail2ban (RedHat).\n \
  \ dnf:\n    name: fail2ban\n    state: present\n    enablerepo: epel\n  when: ansible_os_family\
  \ == 'RedHat'\n\n- name: Install fail2ban (Debian).\n  apt:\n    name: fail2ban\n\
  \    state: present\n  when: ansible_os_family == 'Debian'\n\n- name: Ensure fail2ban\
  \ is running and enabled on boot.\n  service:\n    name: fail2ban\n    state: started\n\
  \    enabled: yes\n```\n\n`Fail2Ban` 配置由 `/etc/fail2ban` 内部的一系列 `.conf` 文件管理，大部分配置可以通过在本地覆盖文件\
  \ `/etc/fail2ban/jail.local` 中覆盖默认值来实现。更多信息请参阅 [Fail2Ban 手册](http://www.fail2ban.org/wiki/index.php/MANUAL_0_8)。\n\
  \n## 使用 SELinux（增强型 Linux）或 AppArmor\n\n`SELinux` 和 `AppArmor` 是两种不同的工具，允许你为内存和文件系统访问构建安全沙箱，例如，一个应用程序无法轻易访问另一个应用程序的资源。这有点像用户和组文件权限，但允许更精细的细节——尽管复杂度大得多。\n\
  \n如果你过去禁用了 `SELinux` 或 `AppArmor`，是可以被原谅的；两者都需要针对你的特定服务器进行额外的工作来设置和配置，特别是当你使用不太流行的发行包时（像\
  \ `Apache` 和 `MySQL` 这样极其流行的包在大多数发行版上都得到了极好的开箱支持）。\n\n然而，这两个工具都是为基础架构添加深度防御的绝佳方法。你应该已经有了针对防火墙、文件权限、用户和组、操作系统更新等方面的良好配置。但如果你正在运行一个面向\
  \ Web 的应用程序——特别是运行在带有其他应用程序的服务器上的程序——拥有 `SELinux` 或 `AppArmor` 提供的额外保护，防止应用程序访问不应访问的内容是非常棒的。\n\
  \n`SELinux` 通常在 Fedora 和 RHEL 系统上默认安装并启用，在大多数其他 Linux 平台上可用并受支持，并且通过 Ansible 模块广泛支持，因此我们将稍后深入介绍\
  \ `SELinux`。\n\n要在 `targeted` 模式下启用 `SELinux`（这是最安全的模式，且不会几乎几乎无法工作），请确保已安装 Python\
  \ SELinux 库，然后使用 Ansible 的 `selinux` 模块：\n\n```\n- name: Install Python SELinux\
  \ library.\n  dnf:\n    name: python3-libselinux\n    state: present\n\n- name:\
  \ Ensure SELinux is enabled in `targeted` mode.\n  selinux:\n    policy: targeted\n\
  \    state: enforcing\n```\n\nAnsible 还有一个 `seboolean` 模块，允许设置 SELinux 布尔值。Web 服务器一个非常常见的设置涉及设置\
  \ `httpd_can_network_connect` 布尔值：\n\n```\n- name: Ensure httpd can connect to the\
  \ network.\n  seboolean:\n    name: httpd_can_network_connect\n    state: yes\n\
  \    persistent: yes\n  when: ansible_selinux.status == 'enabled'\n```\n\nAnsible\
  \ 的 `file` 模块也与 `SELinux` 集成良好，允许设置文件或目录的四个安全上下文字段，每个参数设置一个：\n\n1. `selevel`\n2.\
  \ `serole`\n3. `setype`\n4. `seuser`\n\n为更复杂的场景构建自定义 SELinux 策略超出了本章的范围，但你应该能够使用\
  \ `setroubleshoot`、`getsebool` 和 `aureport` 等工具查看哪些被拦截了、哪些布尔值是可用（或当前已启用）。下次当你又想禁用\
  \ `SELinux` 而不是修复问题时，请花点时间研究 [Getting started with SELinux](https://major.io/2012/01/25/getting-started-with-selinux/)，这是一个非常优秀且简洁的介绍。\n\
  \n## 总结与扩展阅读\n\n本章概述了某些 Linux 安全最佳实践，以及 Ansible 如何帮助你遵循这些实践。互联网上有大量的良好信息可以帮助你保护服务器，包括以下文章：\n\
  \n* [Linode 库：安全基础](https://library.linode.com/security/basics)\n* [我的服务器五分钟](http://plusbryan.com/my-first-5-minutes-on-a-server-or-essential-security-for-linux)\n\
  * [20 个 Linux 服务器加固安全提示](http://www.cyberc.biz/tips/linux-security.html)\n* [Unix\
  \ and Linux System Administration Handbook](http://www.admin.com/)\n\n许多配置封装在 Ansible\
  \ Galaxy 的一个角色中，供你的服务器使用：[geerlingguy 的安全角色](https://galaxy.ansible.com/geerlingguy/security/)。本章使用的特定示例也可以在[本书的存储库](https://github.com/geerlingguy/ansible-for-devops/tree/master/security)\
  \ 中找到。\n\n```\n _____________________________________\n/ 你的计划失误并不构成            \
  \ \\\n| 我的方面的紧急情况。 |\n\\ (谚言)                           /\n -------------------------------------\n\
  \        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n\
  \                ||----w |\n                ||     ||\n```\n\n## 使用 Ansible Tower\
  \ 和 CI/CD 实现自动化\n\n到此，你应该能够将你基础架构的几乎任何部分转换为 Ansible playbook、角色和清单。\n\n书中的所有示例都使用\
  \ Ansible CLI 运行 playbook 并返回结果。对于规模较小的团队，特别是当团队中的每个人都熟悉如何使用 Ansible、YAML 语法和安全最佳实践时，使用\
  \ CLI 是一个可持续的方法。\n\n但对于许多组织来说，基本的 CLI 使用是不够的：\n\n* 业务需要对基础设施部署和失败进行详细报告，特别是为了审计目的。\n\
  * 团队化的基础设施管理需要在 playbook 管理、清单管理以及密钥和密码访问方面有不同程度的参与。\n* 对当前和历史 playbook 运行以及服务器状况的详尽视觉概述有助于在影响底线之前识别潜在问题。\n\
  * Playbook 调度确保基础架构处于已知状态。\n\n\n\n\n[Ansible Tower](https://www.ansible.com/products/tower)\
  \ 满足这些需求——以及更多需求——并为团队化的 Ansible 使用提供了极佳的机制。\n\nAnsible Tower 是 Red Hat Ansible\
  \ Automation Platform 的一部分，但它是基于开源上游项目 [AWX](https://github.com/ansible/awx) 构建的。AWX\
  \ 在红帽收购 Ansible 后不久，即于 2017 年开源了。\n\n虽然本书包含了对 Tower 的简要概述，但强烈建议你通读详尽的 [Tower 用户指南](https://docs.ansible.com/ansible-tower/latest/html/userguide/index.html)，其中包含了本书将不会涵盖的细节，例如\
  \ LDAP 集成和多团队 Playbook 管理工作流。\n\n## 安装 Ansible AWX\n\n由于 Ansible Tower 需要红帽订阅（Red\
  \ Hat Subscription），而你可能在完全决定订阅之前想了解它的工作原理，因此最好是安装一个 AWX 测试实例，以感受 Tower 的运行和操作方式。\n\
  \n运行 AWX 最快的方法是使用 [AWX Docker Compose 安装方法](https://github.com/ansible/awx/blob/devel/INSTALL.md#docker-compose)。\n\
  \n确保你的电脑上已经安装了 Ansible、Git 和 Docker。\n\n为了确保 AWX 安装程序可以管理 Docker 容器，请确保你已经安装了 Docker\
  \ 和 Docker Compose Python 库：\n\n```\npip install docker docker-compose\n```\n\n\
  然后通过克隆仓库并运行安装 playbook 来安装 AWX：\n\n```bash\n$ git clone https://github.com/ansible/awx.git\n\
  $ cd awx/installer\n$ ansible-playbook -i inventory install.yml\n```\n\nAWX 需要几分钟来初始化，但之后可以通过\
  \ `localhost` 访问。在初始化之前，你会看到“AWX is upgrading”的消息。\n\n一旦 AWX 初始化完成，你就应该能够使用默认凭据（用户名\
  \ `admin` 和密码 `password`）登录并进入默认仪表板页面：\n\n![AWX's Dashboard](img/12-awx-dashboard.png)\n\
  \nAWX 仪表板\n\n## 使用 AWX\n\nTower 和 AWX 的核心思想是在组织（Organizations）内部组织项目（Projects，通过作业\
  \ 运行你的 playbooks）和清单（Inventories，描述运行你的 playbooks 的服务器）。组织根据分组在不同团队（Teams）中的用户和凭据设置不同层级的访问权限。起初这可能让人无从从，但一旦配置了初始结构，你就会看到工作流提供的强大和灵活性。\n\
  \n让我们开始第一个项目吧！\n\n第一步是确保你有一个可以使用 AWX 运行的测试 playbook。通常情况下，你的 playbooks 应该存储在源代码仓库中，并配置\
  \ AWX 从仓库中检出最新版本的 playbook 并运行它。然而，对于本示例，我们将在 AWX 位于 `/var/lib/awx/projects` 的默认\
  \ `projects` 目录下创建一个 playbook：\n\n1.  登录 AWX Web 容器：`docker exec -it awx_web /bin/bash`\n\
  2.  创建 `projects` 目录：`mkdir /var/lib/awx/projects`\n3.  进入该目录：`cd /var/lib/awx/projects`\n\
  4.  创建一个新的项目目录：`mkdir ansible-for-devops && cd ansible-for-devops`\n5.  在新目录中使用\
  \ `vi` (`vi main.yml`) 创建一个新的 playbook 文件，并输入以下内容：\n\n```yaml\n1 ---\n2 - hosts:\
  \ all\n3   gather_facts: no\n4   connection: local\n5 \n6   tasks:\n7     - name:\
  \ Check the date on the server.\n8       command: date\n```\n\n现在，为了强化我之前关于为什么使用源代码仓库\
  \ own 手动管理 playbooks 比较好的观点，你必须在 `awx_task` 容器中重新执行上述五个步骤。所以去执行一下吧，从登录 AWX task\
  \ 容器开始：`docker exec -it awx_web /bin/bash`。\n\n切回浏览器，在 Ansible Tower 的 Web UI 中设置好运行测试\
  \ playbook 的一切工作：\n\n1.  创建一个名为“Ansible for DevOps”的新组织。\n2.  向组织中添加一个新用户，命名为 John\
  \ Doe，邮箱为 `johndoe@example.com`，用户名 `johndoe`，密码为 `johndoe1234`。\n3.  在“Ansible\
  \ for DevOps”组织中创建一个名为“DevOps Engineers”的新团队。\n4.  将 `johndoe` 用户添加到 DevOps Engineers\
  \ 团队。\n5.  在 Projects 部分下，添加一个新项目。将“Name”设置为 `Ansible for DevOps Project`，“Organization”设置为\
  \ `Ansible for DevOps`，“SCM Type”设置为 `Manual`，“Playbook Directory”设置为 `ansible-for-devops`（AWX\
  \ 会自动检测放在 `/var/lib/awx/projects` 内部的所有文件夹，但如果你想将项目存储在其他地方，可以使用备用的 Project Base\
  \ Path）。\n6.  在 Inventories 部分下，添加一个清单。将“Name”设置为 `AWX Local`，“Organization”设置为\
  \ `Ansible for DevOps`。一旦清单保存完成：1. 添加一个名为 `localhost` 的“Group”。保存后点击该组。\n\n## 卸载\
  \ AWX\n\n当你完成试用 AWX 后，可以使用以下过程将其卸载：\n\n1.  进入由 AWX 安装程序创建 Docker Compose 配置的目录：`cd\
  \ ~/.awx/awxcompose`\n2.  关闭 Docker Compose 环境：`docker-compose down -v`\n3.  删除整个\
  \ AWX 目录：`rm -rf ~/.awx`\n\n## 其他值得注意的 Tower 特性\n\n在上面的演示中，我们使用 AWX 在本地服务器上运行 playbook；设置\
  \ AWX 或 Tower 在真实基础设施或其他本地虚拟机上运行 playbooks 同样简单，而且 Ansible Tower 提供的工具非常有用，特别是在较大的团队环境中工作时。\n\
  \n本书将不会遍历 Ansible Tower 文档，但其他一些你应该尝试的特性包括：\n\n*   设置计划的作业运行（特别是使用 `Check` 选项而非\
  \ `Run`）用于 CI/CD。\n*   为作业模板（Job Templates）配置 Webhooks，以便能够从 SCM（例如 GitOps）触发作业运行。\n\
  *   将用户账户和团队与 LDAP 用户和组集成，以实现自动基于团队的项目管理。\n*   为用户和团队设置不同层级的权限，使某些用户只能编辑、运行或查看组织内的某些作业。\n\
  *   配置 Ansible Vault 凭据，以便在 playbook 中方便自动地使用 Vault 保护的变量。\n*   调查（Surveys），允许用户根据每次作业运行的问题调查添加额外信息。\n\
  *   智能清单（Smart Inventories）和动态清单集成。\n*   [使用 Prometheus 和 Grafana 监控 Tower](https://www.ansible.com/blog/red-hat-ansible-tower-monitoring-using-prometheus-node-exporter-grafana)。\n\
  \n\n\n\nAnsible Tower 正在快速迭代，它是从中心实例运行 Ansible Playbooks 的最佳方式之一，具备基于团队的访问控制以及极其详尽的实时和历史状态报告。\n\
  \n## Tower 替代方案\n\nAnsible Tower 专为运行 `Ansible` playbooks 而设计，但也有许多其他方法可以在服务器上通过稳健的工作流来运行\
  \ playbooks。如果价格是主要的考虑因素，而且你不需要 Tower 提供的所有花哨功能，可以使用其他流行的工具，如 [Jenkins](https://www.jenkins.io)、[Rundeck](https://www.rundeck.com/open-source)\
  \ 或 [Go CI](https://www.gocd.org)。\n\n所有这些工具都为运行 Ansible Playbooks 提供了灵活性和安全性，每种工具在使其常用场景下良好工作之前都需要不同程度的设置和配置。最流行且历史最悠久的\
  \ CI 工具之一是 Jenkins，因此接下来我们将探索如何在 Jenkins 中配置类似的 Playbook 运行。\n\n## Jenkins CI\n\n\
  Jenkins 是一个基于 Java 的开源持续集成工具。它于 2011 年从 Hudson 项目中派生出来，但作为适用于任何软件项目的稳健构建工具，拥有悠久的历史。\n\
  \nJenkins 易于安装和配置，唯一的要求是 Java SDK。Jenkins 运行在任何现代操作系统上，但为了演示演示，我们将使用 `Vagrant` 构建一个本地虚拟机，使用\
  \ `Ansible` 在虚拟机内安装 Jenkins，然后使用 Jenkins 运行 Ansible playbook。\n\n### 使用 Ansible\
  \ 构建本地 Jenkins 服务器\n\n为 Jenkins 虚拟机创建一个名为 `jenkins` 的新目录。在目录目录内部，创建一个 `Vagrantfile`\
  \ 来描述机器以及传递给 Vagrant 的 Ansible 配置，内容如下：\n\n```\n 1 VAGRANTFILE_API_VERSION = \"\
  2\"\n 2 \n 3 Vagrant.configure(VAGRANTFILE_API_VERSION) do |config|\n 4   config.vm.box\
  \ = \"geerlingguy/ubuntu2004\"\n 5   config.vm.hostname = \"jenkins.test\"\n 6 \
  \  config.vm.network :private_network, ip: \"192.168.56.76\"\n 7   config.ssh.insert_key\
  \ = false\n 8 \n 9   config.vm.provider :virtualbox do |v|\n10     v.memory = 512\n\
  11   end\n 12 \n 13   # Ansible provisioning.\n 14   config.vm.provision \"ansible\"\
  \ do |ansible|\n 15     ansible.playbook = \"provision.yml\"\n 16     ansible.become\
  \ = true\n 17   end\n 18 end\n```\n\n此 `Vagrantfile` 将创建一个运行 Ubuntu 的虚拟机，IP 地址为\
  \ `192.168.56.76`，主机名为 `jenkins.test`。请继续在你的 hosts 文件添加 `192.168.56.76 jenkins.test`\
  \ 条目，然后创建一个新的 `provision.yml` playbook，以便 Vagrant 使用 `Ansible` 运行它（如 Vagrantfile\
  \ 中 `config.vm.provision` 块所示）。将以下内容放入 `provision.yml` 文件：\n\n```\n 1 ---\n 2 -\
  \ hosts: all\n 3 \n 4   vars:\n 5     ansible_install_method: pip\n 6     firewall_allowed_tcp_ports:\n\
  \ 7       - \"22\"\n 8       - \"8080\"\n 9     jenkins_plugins:\n10       - ansicolor\n\
  \ 11 \n 12   roles:\n 13     - geerlingguy.firewall\n 14     - geerlingguy.pip\n\
  \ 15     - geerlingguy.ansible\n 16     - geerlingguy.java\n 17     - geerlingguy.jenkins\n\
  ```\n\n此 playbook 使用了一组来自 `Ansible Galaxy` 的角色来安装我们 Jenkins CI 服务器所需的所有组件。为了确保你的宿主机上已安装了所有需要的角色，请在\
  \ `jenkins` 文件夹中添加 `requirements.yml` 文件，包含 playbook 中用到的所有角色：\n\n```\n1 ---\n2\
  \ roles:\n3   - name: geerlingguy.firewall\n4   - name: geerlingguy.pip\n5   - name:\
  \ geerlingguy.ansible\n6   - name: geerlingguy.java\n7   - name: geerlingguy.jenkins\n\
  ```\n\n`geerlingguy.ansible` 角色在虚拟机上安装 `Ansible`，以便 Jenkins 可以运行 Ansible playbook\
  \ 和即时命令。`geerlingguy.java` 角色是 `geerlingguy.jenkins` 的依赖，而 `geerlingguy.firewall`\
  \ 角色配置了防火墙以限制除 22（SSH）和 8080（Jenkins 默认端口）之外的访问。\n\n最后，我们通过 `jenkins_plugins` 变量告诉\
  \ `geerlingguy.jenkins` 角色一组插件；在这种情况下，我们只需要 `ansicolor` 插件，它能在 Jenkins 的控制日志中提供完整的彩色显示（这使得我们的\
  \ Ansible playbook 输出更易读）。\n\n要构建虚拟机并运行 playbook，请执行以下操作（在 `jenkins` 文件夹内）：\n\n\
  1.  运行 `ansible-galaxy install -r requirements.yml` 安装所需的角色。\n2.  运行 `vagrant up`\
  \ 构建虚拟机并安装及配置 Jenkins。\n\n几分钟后，配置应该就会完成，你就可以访问 Jenkins 了。\n\n\n\n\n```\n ________________________________________\n\
  / The first rule of any technology used  \\\n| in a business is that automation\
  \       |\n| applied to an efficient operation will |\n| magnify the efficiency.\
  \ The second is  |\n| automation applied to an          |\n| inefficient operation\
  \ will magnify the |\n\\ inefficiency. (Bill Gates)             /\n ----------------------------------------\n\
  \        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n\
  \                ||----w |\n                ||     ||\n```\n\n# 第 13 章 - Ansible\
  \ 内容测试与 CI\n\n在部署任何基础设施更改之前，你应该在非生产环境中测试这些更改（就像发布应用程序版本一样）。至少，你应该能够在本地或开发环境中运行 playbook，以确保它的运行结果符合你的预期。\n\
  \n由于你所有的基础设施都是通过代码定义的，你可以像对待应用程序一样，对基础设施进行单元测试、功能测试和集成测试自动化。\n\n本章涵盖了基础设施测试的不同级别，并重点介绍了帮助你测试和开发\
  \ Ansible 内容的工具和技术。\n\n## 单元测试、集成测试与功能测试\n\n在确定如何测试基础设施时，你需要了解不同类型的测试，然后确定你应该在哪些类型的测试上投入更多精力。\n\
  \n`Unit`（单元）测试在应用于应用程序时，是对代码最小单元（通常是函数或类方法）的测试。在 Ansible 中，单元测试通常适用于单个 playbook。你可以在隔离的环境中运行单个\
  \ playbook，但这通常并不值得花精力。值得投入的至少是检查 playbook 的语法，以确保你没有提交一个因为缺少引号或空格问题就会导致整个部署失败的\
  \ YAML 文件！\n\n`Integration`（集成）测试在涉及 Ansible 时显然更具价值，它是对单个代码单元的小组组合进行测试，以确保它们能够正确协同工作。将你的基础设施定义拆分为许多针对特定任务的\
  \ roles 和 playbooks 可以让你实现这一点；如果你构建 playbook 的结构使得它们没有或只有有限的依赖关系，那么你可以在将该 role 作为完整基础设施部署的一部分之前，在新的虚拟机中单独测试每个\
  \ role。\n\n`Functional`（功能）测试涉及整个整套流程。基本上，你搭建一个完整的基础设施环境，然后对其进行运行测试，以确保所有内容都已成功地安装、部署和配置。Ansible\
  \ 自身的报告在这种测试中很有帮助，而且还有外部工具可以更深层次地测试基础设施。\n\n通常你可以在自己的本地工作站上使用虚拟机（如前面的章节所示）、使用 VirtualBox\
  \ 或 VMWare 等工具完成你所需的所有测试。而且大多数云服务都提供强大的控制 API 和按小时计费，直接在镜像你生产基础设施的云实例上进行测试既廉价又同样速度飞快！\n\
  \n我喜欢将测试看作一个光谱——就像生活中的大多数事情一样，你的项目是独特的，可能不需要整合本章中讨论的所有技术。接下来的图表摘自我在 2018 年 AnsibleFest\
  \ 上做的一场演讲：\n\n![我的“Ansible 测试光谱”](img/13-testing-spectrum.png)\n\n我的“Ansible 测试光谱”\n\
  \n本章中讨论的每种技术都比前一个提供了更多的价值，但也更复杂，并且取决于你的 playbook，可能不值得承担额外的设置和维护负担。\n\n我们将从最简单最基础的测试开始，逐渐过渡到全方位的功能测试方法和测试自动化。\n\
  \n## 调试与断言（Debugging）\n\n对于大多数 playbook 来说，在运行过程中测试配置更改和命令执行的结果就是你需要的所有测试。在 playbook\
  \ 运行期间使用 Ansible 的某些内置实用模块来运行测试，意味着你可以立即获得系统处于正确状态的保证。\n\n如果可能的话，你应该尝试将所有简单的测试用例（例如比较和状态检查）固化到你的\
  \ playbook 中。Ansible 有三个模块可以简化这一过程。\n\n### `debug` 模块\n\n在活跃开发 Ansible playbook\
  \ 时，或者仅仅为了日志记录目的（例如，当你使用 Tower 或其他 CI 系统运行 Ansible playbook 时），在 playbook 运行期间打印变量值或某些命令的输出通常非常方便。\n\
  \n为了实现此目的，Ansible 有一个 `debug` 模块，它可以在 playbook 执行期间打印变量或消息。\n\n作为一个极其基础的示例，这里是我在构建\
  \ playbook 时通常使用 debug 的两种方式：\n\n```\n 1 ---\n 2 - hosts: 127.0.0.1\n 3   gather_facts:\
  \ no\n 4   connection: local\n 5\n\n 6   tasks:\n 7     - name: Register the output\
  \ of the 'uptime' command.\n 8       command: uptime\n 9       register: system_uptime\n\
  10\n11     - name: Print the registered output of the 'uptime' command.\n12    \
  \   debug:\n13         var: system_uptime.stdout\n14\n15     - name: Print a message\
  \ if a command resulted in a change.\n16       debug:\n 17         msg: \"Command\
  \ resulted in a change!\"\n18       when: system_uptime is changed\n```\n\n运行这个\
  \ playbook `debug.yml` 会得到以下输出：\n\n```\n$ ansible-playbook debug.yml\n\nPLAY [127.0.0.1]\
  \ ****************************************************\n\nTASK: [Register the output\
  \ of the 'uptime' command.] ****************\nchanged: [127.0.0.1]\n\nTASK [Print\
  \ the registered output of the 'uptime' command.] *********\nok: [127.0.0.1] =>\
  \ {\n    \"system_uptime.stdout\":\n      \"20:55  up  33, 4 users, load averages:\
  \ 0.95, 1.36, 0.43\"\n}\n\nTASK [Print a message if a command resulted in a change.]\
  \ ***********\nok: [127.0.0.1] => {\n    \"msg\": \"Command resulted in a change!\"\
  \n}\n\nPLAY RECAP *************************************************\n127.0.0.1 \
  \           : ok=3    changed=1\n```\n\n调试消息在活跃调试 playbook 或你需要在 playbook 输出中额外的详细信息时非常有用，但如果你需要对某些变量进行显式测试，或者由于某些原因退出\
  \ playbook，Ansible 提供了 `fail` 模块以及其更简洁的兄弟模块 `assert`。\n\n### `fail` 和 `assert` 模块\n\
  \n`fail` 和 `assert` 在触发时都会中断 playbook 的运行，主要的区别在于用法的简单程度以及在 playbook 运行期间输出的内容。为了说明，让我们看一个例子：\n\
  \n```\n 1 ---\n 2 - hosts: 127.0.0.1\n 3   gather_facts: no\n 4   connection: local\n\
  \ 5 \n 6   vars:\n 7     should_fail_via_fail: true\n 8     should_fail_via_assert:\
  \ false\n 9     should_fail_via_complex_assert: false\n10 \n11   tasks:\n 12   \
  \  - name: Fail if conditions warrant a failure.\n 13       fail:\n 14         msg:\
  \ \"There was an epic failure.\"\n 15       when: should_fail_via_fail\n16 \n 17\
  \     - name: Stop playbook if an assertion isn't validated.\n 18       assert:\n\
  \ 19         that: \"should_fail_via_assert != true\"\n20 \n 21     - name: Assertions\
  \ can have contain conditions.\n 22       assert:\n 23         that:\n 24      \
  \     - should_fail_via_fail != true\n 25           - should_fail_via_assert !=\
  \ true\n 26           - should_fail_via_complex_assert != true\n```\n\n切换 `should_fail_via_fail`、`should_fail_via_assert`\
  \ 和 `should_fail_via_complex_assert` 的布尔值以触发这三个 `fail`/`assert` 任务中的每一个，观察它们是如何工作的。\n\
  \n如果没有触发失败，`fail` 任务将报告报告为 `skipped`（跳过），而通过的 `assert` 任务在 Ansible 的默认输出中将显示为 `ok`\
  \ 任务并带有内联消息。\n\n```\nTASK [Assertions can have contain conditions.] ********************\n\
  ok: [default] => {\n    \"changed\": false,\n    \"msg\": \"All assertions passed\"\
  \n}\n```\n\n\n\n\n对于大多数测试用例，`debug`、`fail` 和 `assert` 就是你确保基础架构在 playbook 运行期间处于正确状态的所有工具。\n\
  \n### 使用 `yamllint` 检查 YAML 检查\n\n一旦你写好了 playbook，确保基础 YAML 语法是正确的是一个好主意。YAML 解析器通常很宽容，但\
  \ Ansible playbook 中许多常见的错误（尤其是对于初学者来说）都是空格问题。\n\n[`yamllint`](https://yamllint.readthedocs.io/en/stable/)\
  \ 是一个简单的 YAML 检查工具，可以通过 Pip 安装：\n\n```\npip3 install yamllint\n```\n\n让我们构建一个示例\
  \ playbook，并对其进行检查，看看是否有任何错误：\n\n```\n 1 - hosts: localhost\n 2   gather_facts:\
  \ no\n 3   connection: local\n 4 \n 5   tasks:\n 6     - name: Register the output\
  \ of the 'uptime' command.\n 7       command: uptime \n 8       register: system_uptime\
  \ # comment\n 9 \n10     - name: Print the registered output of the 'uptime' command.\n\
  11       debug:\n12        var: system_uptime.stdout\n```\n\n如果你安装了 `yamllint`，可以通过向命令传递路径\
  \ `.` 来对当前目录（以及子目录，递归地）中的任何 YAML 文件运行。让我们试试并查看输出：\n\n```\n$ yamllint .\n./lint-example.yml\n\
  \  1:1  warning missing document start \"---\"  (document-start)\n  2:17 warning\
  \ truthy value should be one of [false, true]  (truthy)\n  7:22 error   trailing\
  \ spaces  (trailing-spaces)\n  8:31 warning too few spaces before comment  (comments)\n\
  \  12:8 error   wrong indentation: expected 8 but found 7 (indentation)\n```\n\n\
  虽然起初可能看起来很吹毛疵，但随着时间的推移，你会发现使用特定的风格并坚持下去多么重要。它看起来更好，并且有助于防止由于缩进、空格或结构问题导致的错误侵入。\n\
  \n在这种特定情况下，我们可以快速修复一些错误：\n\n* 在 playbook 顶部添加 yaml 文档开始标识符 (`---`)。\n* 删除 `command`\
  \ 行上的多余空格。\n* 在 `# comment` 之前添加额外的空格。\n* 确保 `var` 行多缩进一个空格。\n\n但是“truthy value”警告怎么办？在许多\
  \ Ansible 示例中，使用 `yes` 或 `no` 代替 `true` 和 `false`。我们可以通过配置文件自定义 `yamllint` 来允许这一点。\n\
  \n在同一目录下创建一个名为 `.yamllint` 的文件，内容如下：\n\n```\n 1 ---\n 2 extends: default\n 3 \n\
  \ 4 rules:\n 5   truthy:\n 6     allowed-values:\n 7       - 'true'\n 8       -\
  \ 'false'\n 9       - 'yes'\n10       - 'no'\n```\n\n假设你修复了 playbook 中的其他错误，并保留了\
  \ `gather_facts: no`，再次运行 `yamllint .` 应该不会产生错误。\n\n### 执行 `--syntax-check`\n\n\
  语法检查同样简单，即使对于包含几十或数百个包含文件的更大更复杂的 playbook，也只需要几秒钟。\n\n当你使用 `--syntax-check` 运行 playbook\
  \ 时，plays 不会被执行；相反，Ansible 会静态地加载整个 playbook，并确保一切都可以在不发生致命错误的情况下加载。如果你缺少导入的任务文件、拼写错误的模块名称，或者提供了无效参数的模块，`--syntax-check`\
  \ 将快速识别问题。\n\n与 `yamllint` 一起，在你的基础 CI 测试中包含 `ansible-playbook my-playbook.yml --syntax-check`\
  \ 是很常见的，如果你的 playbook 位于 Git 仓库中，在 [pre-commit hook](https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks)\
  \ 中添加语法检查也是好的。\n\n### 使用 `ansible-lint` 检查 Ansible 内容\n\n除了使用 `yamllint` 检查结构性 YAML\
  \ 问题外，Ans 任务和 playbook 使用 [`ansible-lint`](https://github.com/ansible/ansible-lint)\
  \ 进行检查。许多 Ansible 最佳实践和首选任务样式都可以通过检查强制执行。\n\n让我们以此 playbook 为例（命名为 `main.yml`）：\n\
  \n```\n 1 ---\n 2 - hosts: localhost\n 3   gather_facts: false\n 4   connection:\
  \ local\n 5 \n 6   tasks:\n 7     - shell: uptime\n 8       register: system_uptime\n\
  \ 9 \n10     - name: Print the registered output of the 'uptime' command.\n11  \
  \     debug:\n12         var: system_uptime.stdout\n```\n\n它看起来很直观，YAML 语法没有 own\
  \ 通过了 `yamllint`。\n\n但这个 playbook 有一些方面可以改进。让我们看看 `ansible-lint` 能否突出它们。通过以下命令安装它：\n\
  \n```\npip3 install ansible-lint\n```\n\n然后在 playbook 上运行它，并观察输出：\n\n```\n$ ansible-lint\
  \ main.yml\n[301] Commands should not change things if nothing needs doing\nmain.yml:6\n\
  Task/Handler: shell uptime\n\n[305] Use shell only when shell functionality is\n\
  main.yml:6\nTask/Handler: shell uptime\n\n[502] Use shell only when\nmain.yml:6\n\
  Task/Handler: shell uptime\n\n[305] Use shell only when\nmain.yml:6\nTask/Handler:\
  \ shell uptime\n\n[502] Use shell only when\nmain.yml:6\nTask/Handler: shell uptime\n\
  \n[301] Commands should not change things if nothing needs to-\nAdd `changed_when:\
  \ false` to `uptime` task to avoid idempotency\n\n[305] Use shell only when\nmain.yml:6\n\
  Task/Handler: shell uptime\n\n[502] Use shell only when\nmain.yml:6\nTask/Handler:\
  \ shell uptime\n\n[305] Use shell only when\nmain.yml:6\nTask/Handler: shell uptime\n\
  \n[502] Use shell only when\nmain.yml:6\nTask/Handler: shell uptime\n```\n\n###\
  \ 使用 Molecule 进行自动化测试和开发\n\n到目前为止都是关于*静态*测试。但*事实见真金*——也就是说，在没有真正*运行*它之前，你无法验证 playbook\
  \ 是否有效。\n\n但在你的基础设施上运行 playbook 是危险的，特别是当你修改它或添加新功能时。我开始在 VirtualBox 或 Amazon EC2\
  \ 中运行一次性的虚拟机来测试我的 playbook，但这很麻烦。每当我想要测试 playbook 时，我都必须执行以下操作：Vagrant 在一定程度上有助于这个过程，而且它非常适合这项任务，但\
  \ Vagrant 可能有点慢，而且在 CI 或轻量级环境中运行良好。\n\n因此，我开始维护一个使用 Docker 容器自动执行上述许多步骤的脚本，可以在 CI\
  \ 或本地运行 playbook 和测试。但这是脆弱的，在不同的 CI 环境中维护需要大量工作。我还意识到自己正在维护复杂的 脚本来测试简单的 Ansible\
  \ playbook——这一定有更简单的方法！\n\n而且有了：[Molecule](https://ansible.readthedocs.io/projects/molecule/)。\n\
  \n![Molecule 的标志](img/13-molecule-logo.png)\n\nMolecule 是一个轻量级的基于 Ansible 的工具，用于帮助\
  \ Ansible playbook、角色和集合的开发和测试。\n\n在最基础的层，Molecule 执行上述所有六步，并增加了多个场景、多个后端和可配置验证方法等额外功能。\n\
  \n最好的部分是什么？Molecule 中的一切都通过 Ansible playbook 控制！\n\n#### 使用 Molecule 测试角色\n\n\n\n\
  \n最初，Molecule 是专门为测试 Ansible 角色（roles）设计的。因此，它内置了角色脚手架（scaffold）功能，该功能像 `ansible-galaxy\
  \ role init` 命令一样设置角色，但它内置了 Molecule 配置。\n\n在任何目录下，运行以下命令来创建一个新角色：\n\n```\nmolecule\
  \ init role my.test\n```\n\n如果你 `cd` 进入新的 `test` 目录，你将看到由 `ansible-galaxy` 生成的标准角色结构，但有一个显著的添加：`molecule`\
  \ 目录。\n\n该目录的存在表示有一个或多个可用于测试和开发的 Molecule 场景（scenarios）。让我们来看看 `default` 场景内部包含什么内容：\n\
  \n```\nmolecule/\n  default/\n    INSTALL.rst\n    converge.yml\n    molecule.yml\n\
  \    verify.yml\n```\n\n`INSTALL` 文件提供了设置 Molecule 以正确运行你测试的说明。\n\n`molecule.yml`\
  \ 文件配置了 Molecule 并告诉它如何运行整个构建和测试过程。我们稍后会详细介绍该文件。\n\n`converge.yml` 文件是一个 Ansible\
  \ 剧（playbook），Molecule 会在设置完成后立即在测试环境中运行它。对于基础的角色测试，Converge 剧仅包含该角色（在此例中为 `myrole`），没有其他内容。\n\
  \n`verify.yml` 文件是另一个 Ansible 剧，它在 Molecule 运行 `converge.yml` 剧并测试幂等性（idempotence）之后运行。它用于验证测试，例如确保你的角色安装的\
  \ Web 服务响应正常，或者某个应用程序配置正确。\n\n假设你的电脑上安装了 Docker，你可以立即对默认角色运行 Molecule 的内置测试：\n\n\
  ```\nmolecule test\n```\n\n`test` 命令会运行 Molecule 的全套功能，包括设置测试环境、运行任何配置的静态检查工具（lint\
  \ tools）、安装任何 Ansible Galaxy 依赖、运行 `converge` 剧、运行 `verify` 剧，然后拆毁测试环境（无论测试通过或失败）。\n\
  \n你可以使用其他选项执行 Molecule 任务子集，例如：\n\n```\nmolecule converge\n```\n\n这将运行与 `test` 命令相同的所有步骤，但会在\
  \ `converge` 剧运行后停止执行，并保持测试环境运行状态。\n\n这对于角色开发和调试是*极其*有用的。\n\n对于自动化开发，我通常有如下工作流：\n\
  \n1. 创建一个带有 Molecule 测试环境的新角色。\n2. 开始编写角色中的任务（tasks）。\n3. 在我想设置“断点”的地方添加一个 `fail:`\
  \ 任务，并运行 `molecule converge`。\n4. 在剧运行命中我的 `fail` 任务后，使用 `molecule login` 登录环境。\n\
  5. 探索环境，检查我的配置文件，如有需要进行一些额外的调查。\n6. 回到我的角色，处理角色的其余自动化任务。\n7. 再次运行 `molecule converge`。\n\
  8. （如果出现任何问题或我的环境进入损坏状态，运行 `molecule destroy` 擦除环境，然后运行 `molecule converge` 将其恢复。）\n\
  9. 一旦我感到满意，运行 `molecule test` 来运行完整的测试周期，确保我的自动化工作完美无缺且具有幂等性。\n\n对于调试，我经常只运行 `molecule\
  \ converge`，查看我的自动化在哪里崩溃，使用 `molecule login` 登录以找出问题（然后修复它），再次运行 `molecule converge`\
  \ 直到它开始工作。\n\n当你完成开发阶段后，告诉 Molecule 使用以下命令拆毁环境：\n\n```\nmolecule destroy\n```\n\n\
  ### 使用 Molecule 测试剧本\n\nMolecule 的用处远不仅限于测试角色。我经常使用 Molecule 测试剧本（playbooks）、集合（collections），甚至是\
  \ Kubernetes Operators！\n\n假设我有一个设置 Apache 服务的剧本，其 `main.yml` 的内容如下：\n\n```yaml\n\
  ---\n- name: Install Apache.\n  hosts: all\n  become: true\n\n  vars:\n    apache_package:\
  \ apache2\n    apache_service: apache2\n\n  handlers:\n    - name: restart apache\n\
  \      ansible.builtin.service:\n        name: \"{{ apache_service }}\"\n      \
  \  state: restarted\n\n  pre_tasks:\n    - name: Override Apache vars for Red Hat.\n\
  \      ansible.builtin.set_fact:\n        apache_package: httpd\n        apache_service:\
  \ httpd\n      when: ansible_os_family == 'RedHat'\n\n  tasks:\n    - name: Ensure\
  \ Apache is installed.\n      ansible.builtin.package:\n        name: \"{{ apache_package\
  \ }}\"\n        state: present\n\n    - name: Copy a web page.\n      ansible.builtin.copy:\n\
  \        content: |\n          <html>\n          <head><title>Hello world!</title></head>\n\
  \          <body>Hello world!</body>\n          </html>\n        dest: \"/var/www/html/index.html\"\
  \n        mode: 0664\n      notify: restart apache\n\n    - name: Ensure Apache\
  \ is running and starts at boot.\n      ansible.builtin.service:\n        name:\
  \ \"{{ apache_service }}\"\n        state: started\n        enabled: true\n```\n\
  \n[/content\n\n因为我想确保这个剧本在我支持的两个平台（在本例中为 Debian 和 Rocky Linux）上都能运行，所以我想确保我的 Molecule\
  \ 测试覆盖这两个平台。\n\n因此，首先运行 `molecule init scenario` 在剧本文件夹中初始化一个默认的 Molecule 场景：\n\n\
  ```\n$ molecule init scenario\n--> Initializing new scenario...\nInitialized scenario\
  \ default successfully.\n```\n\n由于我们要测试的是剧本而不是角色，我们需要清理一些文件并删除 `INSTALL.rst`。然后打开\
  \ `converge.yml` 文件，删除现有的 `tasks:` 部分。通过导入它来制作 `main.yml` 剧本：\n\n```yaml\n---\n\
  - name: Converge\n  hosts: all\n  tasks:\n    - name: Update cache (on Debian).\n\
  \      ansible.builtin.apt:\n        update_cache: true\n        cache_valid_time:\
  \ 3600\n      when: ansible_os_family == 'Debian'\n\n  - import_playbook: ../main.yml\n\
  ```\n\n此时，你可以尝试用 Molecule 测试该剧本。正如我之前提到的，我喜欢在开发时使用 `molecule converge`，这样我就可以看到哪里崩溃了，修复它，然后再次运行\
  \ `molecule converge` 重新运行剧本。\n\n```\n$ molecule converge\n--> Test matrix\n\n└──\
  \ default\n    ├── dependency\n    ├── create\n    ├── prepare\n    └── converge\n\
  \n--> Scenario: 'default'\n...\n    TASK [Ensure Apache is running and starts at\
  \ boot.] ***********\nfatal: [instance]: FAILED! => {\"changed\": false, \"msg\"\
  : \"Could\nnot find the requested service httpd: \"}\n\n    RUNNING HANDLER [restart\
  \ apache] ******************************\n\n    PLAY RECAP *************************************************\n\
  \    instance  : ok=5  changed=2  unreachable=0  failed=1  skipped=1\n```\n\n哦哦，如果找不到\
  \ Apache 服务，说明出问题了！\n\n不过，这个剧本非常简单，看起来并没有任何错误。我们应该通过登录测试环境来调试此问题，并检查 `httpd` 服务哪里出了问题：\n\
  \n```\n$ molecule login\n[root@instance /]# systemctl status httpd\nFailed to get\
  \ D-Bus connection: Operation not permitted\n```\n\n啊，看起来 systemd 没有正常工作。而且，为了不带你进入尝试在\
  \ Docker 容器内调试 systemd 的“兔子洞”，以及研究如何让一切正常运行以便测试容器内运行的服务，我将跳到最后，向你展示当我管理像 `httpd`\
  \ true 的服务时如何正确地测试我的剧本。\n\n首先，通过退出运行中的实例并销毁它来清理现有环境：\n\n```\n[root@instance /]#\
  \ exit\n$ molecule destroy\n```\n\n#### 调整 Molecule 使用更灵活的测试容器\n\n\n\n\nMolecule\
  \ 在配置测试环境方面提供了几乎无限的灵活性。在我们的案例，我们需要能够测试运行在 Docker 容器中的服务，这意味着 Docker 容器需要运行初始化系统（在本例中为\
  \ `systemd`）。\n\n除了 Molecule 默认使用的 `rockylinux8` 容器外，我们还想测试 Debian，因此打开 `molecule.yml`\
  \ 文件并编辑 `platforms` 部分以使用略有不同的 Docker 配置：\n\n```\n 1 platforms:\n 2   - name: instance\n\
  \ 3     image: \"geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux8}-ansible:\\\n\
  \ 4 latest\"\n 5     command: \"\"\n 6     volumes:\n 7       - /sys/fs/cgroup:/sys/fs/cgroup:rw\n\
  \ 8     cgroupns_mode: host\n 9     privileged: true\n10     pre_build_image: true\n\
  ```\n\n此配置对默认 Molecule 文件进行了四处更改：一项更改（`image`）和三个新增：\n\n- 将 `image` 设置为维护的动态镜像，该镜像安装了\
  \ Python 和 Ansible，并配置了 systemd，以便我在容器内部运行服务。Molecule 允许 bash 风格的变量和默认值，因此我在镜像名称中设置了\
  \ `${MOLECULE_DISTRO:-rockylinux8}`。这将允许之后替换 Debian 等其他发行版。\n\n- 覆盖 Molecule 为 Docker\
  \ 容器的 `command`，让容器镜像使用其自身的预配置 `COMMAND`，在本例中它会启动 systemd 初始化系统并保持容器运行。\n\n- 添加必要的卷挂载以允许在容器内管理进程，并将\
  \ `cgroupns_mode` 设置为 `host`，以便 Docker 能够与 systemd 支持。\n\n- 在容器上设置 `privileged`\
  \ 标记，以便 systemd 能够正确初始化。\n\n现在，如果你运行 `molecule converge` 或 `molecule test`，整个 playbook\
  \ 应该执行成功，且幂等性（idempotence）也应该通过。\n\n最后一步是确保该 playbook 在基于 Debian 的系统上也能正确运行。由于存在\
  \ `geerlingguy/docker-debian10-ansible` 容器（详阅我维护的 [Docker Ansible 测试容器完整列表](https://ansible.jeffgeerling.com/#container-images-testing)），你也可以在该操作系统下运行\
  \ Molecule 测试：\n\n```\n$ MOLECULE_DISTRO=debian10 molecule test\n...\n    RUNNING\
  \ HANDLER [restart apache] ******************************\n\n    PLAY RECAP ****************************************************\n\
  \    instance  : ok=7  changed=4  unreachable=0  failed=0  skipped=1\n```\n\n###\
  \ 使用 Molecule 验证 playbook\n\n让我们再增加一项：验证 Apache 确实在提供 Web 服务！打开 `verify.yml` playbook，并添加一个任务来检查\
  \ Apache 是否提供 Web 服务：\n\n```\n1 ---\n2 - name: Verify\n3   hosts: all\n4 \n5   tasks:\n\
  6   - name: Verify Apache is serving web requests.\n7     ansible.builtin.uri:\n\
  8       url: http://localhost/\n9       status_code: 200\n```\n\n再次运行 `molecule\
  \ test`，并确保验证任务成功：\n\n```\n$ molecule test\n...\n    TASK [Verify Apache is serving\
  \ web requests.] *****************\n    ok: [instance]\n\n    PLAY RECAP ****************************************************\n\
  \    instance  : ok=2  changed=0  unreachable=0  failed=0  skipped=0\n```\n\n在使用\
  \ Molecule 开发或调试时，你可以使用 `molecule verify` *仅运行* verify 步骤。\n\n正如我之前提到的，你可以将此测试放在\
  \ Ansible playbook *本身* 中，这样测试就会始终作为自动化流程的一部分运行。但你的测试结构可能决定要求在 Molecule 的 `validate.yml`\
  \ playbook 中添加额外的验证，就像我们在这里所做的那样。\n\n### 在 Molecule 中添加 lint 配置\n\n作为最后一步，最好确保你的代码遵循一致的代码风格，我们可以通过在\
  \ `molecule.yml` 文件中添加 lint 配置来使用 Molecule 强制执行它：\n\n```\n6 lint: |\n7   set -e\n\
  8   yamllint .\n9   ansible-lint\n```\n\n你可以将 lint 配置添加到 Molecule 配置的任何部分；你只需要确保\
  \ `lint` 键是顶级键之一即可。\n\n现在你可以通过 `molecule lint` 运行所有配置好的 lint 工具，而无需单独运行 `yamllint`\
  \ 和 `ansible-lint`。如果你需要覆盖任何 lint 规则，可以在项目根目录下的 playbook 同级目录下添加 `.yamllint` 或 `.ansible-lint`\
  \ 文件。\n\n### Molecule 总结\n\nMolecule 是一个简单但灵活的工具，用于测试 Ansible roles、playbooks 和\
  \ collections。示例中提供的选项只是 Molecule 可能功能的一小部分。之后，我们将配置 Molecule 使用持续集成（CI）来测试角色，以帮助你的\
  \ playbook 始终得到测试并正常工作。\n\n你可以在本书的 GitHub 仓库找到此 Molecule playbook 配置的完整示例：[Molecule\
  \ Example](https://github.com/geerlingguy/ansible-for-devops/tree/master/molecule)。\n\
  \n### 在 check 模式下运行你的 playbook\n\n本地集成测试的下一步是使用 `--check` 运行你的 playbook，这会在你的实时基础设施上运行整个\
  \ playbook，但不会执行任何更改。相反，Ansible 会高亮显示 *本会*产生更改的任务，以显示你之后 *实际* 运行 playbook 时会发生什么。\n\
  \n这有两个用途：\n\n1. 防止“配置漂移”（configuration drift），即服务器配置可能偏离了你代码中定义的配置。这可能是由于人为干预或其他因素导致的。但在不强制更改的情况下发现配置漂移是有益的。\n\
  \n2. 确保你对 playbook 所做的本不应该破坏幂等性的更改，实际上 *没有* 破坏幂等性。例如，如果你正在更改配置文件的结构，但目标是保持生成的文件相同，那么使用\
  \ `--check` 运行 playbook 会提醒你是否可能因为 playbook 的更改而意外更改了实时文件。是时候修复你的 playbook 了！\n\n\
  当使用 `--check` 模式时，某些任务可能需要强制运行以确保 playbook 成功完成（例如，注册了后续任务用变量的 `command` 任务）。你可以通过设置\
  \ `check_mode: no` 来实现：\n\n```\n- name: A task that runs all the time, even in check\
  \ mode.\n  command: mytask --option1 --option2\n  register: my_var\n  check_mode:\
  \ no\n```\n\n如果想更详细地了解会发生哪些更改，添加 `--diff` 选项，Ansible 将逐行输出 *本会* 对服务器进行的更改。如果 `check`\
  \ 模式产生了大量更改，请谨慎使用此选项，除非你想大量的文本！\n\n### 使用 GitHub Actions 进行自动化测试\n\nGitHub Actions\
  \ 是许多持续集成（CI）和持续部署（CD）工具之一。类似的工具还有 Travis CI、Circle CI、Drone、Jenkins 和 Zuul。\n\n\
  我经常选择与源仓库集成阻力最小的 CI 工具，因为我的许多代码托管在 GitHub 上，所以 GitHub Actions 是最容易实现的！但例如，如果你使用\
  \ GitLab，那么使用 GitLab CI 会更简单。\n\n按照 GitHub Actions 的设置指南，设置 Actions 工作流的第一步是在[你的仓库中创建工作流文件](https://help.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#creating-a-workflow-file)。\n\
  \n在本书的示例中，我们将之前创建的 Molecule playbook 示例开始。此示例假设你已经在 GitHub 代码仓库的根目录下创建了之前的 playbook。\n\
  \n在 playbook 同级创建一个 `.github` 目录，并在该目录下创建一个 `workflows` 目录。最后，在 `workflows` 目录内创建一个名为\
  \ `ci.yml` 的工作流文件。\n\n目录结构应该如下：\n\n```\nmyproject/\n  .github/\n    workflows/\n\
  \      ci.yml\n  main.yml\n```\n\n\n\n\n与如今大多数其他操作工具一样，GitHub Actions 使用 `YAML`\
  \ 作为其配置语法，因此我们将创建一个“CI”（持续集成，Continuous Integration）工作流。打开 `ci.yml` 文件并为工作流指定一个名称：\n\
  \n```yaml\n1 ---\n2 name: CI\n```\n\n在 GitHub Actions 工作流中，你应该做的第一件事是定义工作流何时运行。默认情况下，它会在每个分支和拉请求（pull\
  \ request）上运行，但对于我的大多数项目，我喜欢它只在向 `master` 分支进行推送（push）和合并（merge）以及任何 `pull_request`\
  \ 时运行：\n\n```\n3 'on':\n4   pull_request:\n5   push:\n6     branches:\n7       -\
  \ master\n```\n\n接下来，你定义要在工作流中运行的 `jobs` 列表。\n\n```\n 9 jobs:\n10 \n11   test:\n\
  12     name: Molecule\n13     runs-on: ubuntu-latest\n```\n\n这是一个名为 `Molecule` 的\
  \ `job`（这是 GitHub 界面中显示的标签），它将在 GitHub Actions 最新的 Ubuntu 构建环境上运行。你目前可以在 [几个不同的平台](https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on)\
  \ 上运行任务，包括 Windows、macOS 和 Ubuntu Linux。\n\n我们还想定义一个 Linux 发行版的 `matrix`（矩阵）进行测试；在此之前，我们设置了剧本可以使用\
  \ `rockylinux8` 或 `debian10` 进行测试，因此我们可以在 `jobs.test.strategy.matrix` 键下添加测试矩阵：\n\
  \n```yaml\n14     strategy:\n15       matrix:\n16         - distro: rockylinux8\n\
  17         - distro: debian10\n```\n\nGitHub Actions 将为构建矩阵中定义的每个选项运行一次任务——在我们的情况下，运行一次\
  \ `distro` 变量设置为 `rockylinux8`，另运行一次 `distro` 设置为 `debian10`。\n\n最后，我们到了工作流任务的核心部分，即在环境就绪后运行的\
  \ `steps`（步骤）：\n\n```yaml\n20     steps:\n21       - name: Check out the codebase.\n\
  22         uses: actions/checkout@v2\n23 \n24       - name: Set up Python 3.\n25\
  \         uses: actions/setup-python@v2\n26         with:\n27           python-version:\
  \ '3.x'\n28 \n29       - name: Install test dependencies.\n30         run: pip3\
  \ install ansible molecule molecule-plugins[docker] yam\\\n31 llint ansible-lint\n\
  32 \n33       - name: Run Molecule tests.\n34         run: molecule test\n35   \
  \      env:\n36           PY_COLORS: '1'\n37           ANSIBLE_FORCE_COLOR: '1'\n\
  38           MOLECULE_DISTRO: ${{ matrix.distro }}\n```\n\n前两个步骤使用社区支持的 GitHub Actions\
  \ 设置构建环境，将存储库代码检出到当前目录，然后设置 Python。\n\n第三个步骤（这些看起来非常像 Ansible 任务，不是吗？）`run` 执行一个命令，通过\
  \ `pip3` 安装我们所有的测试依赖项。\n\n最后一步运行 `molecule test`，并传入三个环境变量：\n\n*   `PY_COLORS: '1'`：这强制\
  \ Molecule 在 CI 环境中使用彩色输出。如果没有它，所有输出都将是黑色背景上的白色文字。\n\n*   `ANSIBLE_FORCE_COLOR:\
  \ '1'`：这与 `PY_COLORS` 作用相同，但是针对 Ansible 剧本输出。\n\n*   `MOLECULE_DISTRO: ${{ matrix.distro\
  \ }}`：这设置一个环境变量，值为当前运行的 `distro`；因此为 `rockylinux8` 设置一次，为 `debian10` 设置设置一次。\n\n\
  这就是 GitHub Actions 工作流的全部内容！你可以将其添加到 GitHub 存储库中，假设你有可用的构建分钟，GitHub 将运行此工作流，对于 `matrix`\
  \ 中的每个 `distro` 运行一次，每当你创建或更新 PR，或者合并或推送到 `master` 分支时运行。\n\n以下是构建成功时的样子：\n\n![GitHub\
  \ Actions CI 工作流结果](img/13-github-actions-ci-workflow.png)\n\nGitHub Actions CI\
  \ 工作流结果\n\n你还可以在项目的 README 文件中（或任何地方！）放置“CI 状态”徽章，以便一目了然地查看当前构建状态。要这样做，进入 GitHub\
  \ 上的“Actions”选项卡，点击工作流名称（在此例中为“CI”），然后点击“Create status badge”按钮。它允许你为状态徽章选择选项，将其放在任何地方快速查看工作流的当前状态。\n\
  \n![CI 状态徽章一眼查看项目健康](img/13-github-actions-ci-badge.png)\n\nCI 状态徽章一眼查看项目健康\n\n\
  本章中的示例在本书的 GitHub 存储库中使用：[Ansible for DevOps GitHub Actions CI 工作流](https://github.com/geerlingguy/ansible-for-devops/blob/master/.github/workflows/ci.yml)。\n\
  \n### 其他 CI 环境中的自动化测试\n\nMolecule 扩展了文档，提供了与许多不同 CI 环境集成的示例，例如 Travis CI、GitLab\
  \ CI、Jenkins 和 Tox；请参见 [Molecule 集成](https://molecule.readthedocs.io/en/latest/)。\n\
  \n### 现实示例\n\n这种测试风格已集成到我的许多项目中，以下是示例：\n\n*   `github.com/geerlingguy/ansible-role`\n\
  *   `github.com/geerlingguy/ansible-collection-k8s`\n*   `github.com/ansible-collections/community.kubernetes`\n\
  \n### 使用 serverspec 或 testinfra 进行功能测试\n\n[Serverspec](http://serverspec.org/) 是使用\
  \ RSpec 测试自动化服务器测试的工具，使用类似的 DSL 来确保配置匹配。在某种程度上，[Testinfra](https://testinfra.readthedocs.io/en/latest/)\
  \ 是一个类似的工具，用 Python 编写。\n\nServerspec 和 Testinfra 可以通过本地、SSH、Docker API 或其他方法运行，无需在服务器上安装代理，因此它们是轻量级的测试工具。\n\
  \n对于编写良好的 Ansible 剧本身（特别是配合检查运行 `--check` 模式以及用于 CI 的 Molecule）是否足以测试基础设施，有很多争议，但许多团队更倾向于单独维护基础设施测试（特别是团队已经熟悉其他工具时！）。\n\
  \n考虑这一点：真正的幂等 Ansible 剧本身已经是很好的测试工具，如果它使用了健 模块以及 `fail`、`assert`、`wait_for` 等测试来确保服务器的特定状态。如果你使用\
  \ Ansible 的 `user` 模块确保给定用户存在并属于给定组，并使用 `--check` 运行相同的剧本且相同任务返回 `ok`，那么这对于服务器配置正确的测试不是足够了吗？\n\
  \n本书将不会提供使用 Serverspec 的详细指南，但如果你想使用其中之一，这里有一些资源：\n\n*   [使用 serverspec 进行服务器测试简介](https://www.debian-administration.org/article/703/A_brief_introduction_to_server-testing_with_serverspec)\n\
  *   [使用 serverspec 测试基础设施](https://vincent.bernat.ch/en/blog/2014-serverspec-test-infrastructure)\n\
  \n### 总结\n\n像 Molecule 这样的工具有助于在本地和 CI 环境中经常地开发、测试和运行剧本。除了本章包含的信息外，阅读 Ansible 文档中的[测试策略](https://docs.ansible.com/ansible/latest/reference_appendices/test_strategies.html)可以获得基础设施测试和\
  \ Ansible 的全面概述。\n\n\n\n\n今天的应用环境几乎总是要求对某些流量使用 HTTP（以及 HTTPS）——端用户与网站的交互、微服务之间内部或通过公互联网的通信，或者外部\
  \ API 与您的应用程序交互。\n\nHTTPS 最初仅用于敏感交易，例如银行交易或安全的 Web 表单。它过去还需要额外的服务器 CPU 来加密数据。但现如今，当\
  \ Google 提高仅限 HTTPS 站的搜索排名，且处理器在处理加密或未加密流量时几乎没有区别时，人们已达成共识：所有 HTTP 服务都应该通过 `https://`\
  \ 提供。\n\n传统上，`处处”使用 HTTPS 的障碍之一是证书难以获取、管理和续期。而且它们非常昂贵！\n\n现在，有了 Let’s Encrypt 的免费证书、更实惠的通配符证书以及通用的服务器名称指示（SNI）支持，几乎没有理由`不`使用\
  \ HTTPS……\n\n除非，即证书管理的自动化一直比较棘手。本章将展示 Ansible 如何通过管理证书并保护所有的 HTTP 流量来解决这最后一个问题！\n\
  \n## 使用 Ansible 生成自签名证书\n\n每当我构建和测试需要 TLS 连接的新服务器配置（通常是通过端口 443 的 HTTPS 流量）时，我需要使用一个或多个可以被浏览器或\
  \ `curl` 等工具接受的有效证书，以便验证我的 TLS 配置是正确的。\n\nAnsible 让生成自签名证书变得简单。有四个与加密相关的 `openssl_*`\
  \ 模块可用于生成证书：\n\n* `openssl_certificate` - 生成和/或检查 OpenSSL 证书\n* `openssl_csr` -\
  \ 生成 OpenSSL 证书签名请求 (CSR)\n* `openssl_privatekey` - 生成 OpenSSL 私钥\n* `openssl_publickey`\
  \ - 从私钥生成 OpenSSL 公钥\n\n为了使用这些模块，你需要安装 OpenSSL，还需要安装一个 Ansible 用于与 OpenSSL 交互的额外\
  \ Python 依赖项，即 `pyOpenSSL` 库。\n\n以下是生成自签名证书所需任务的快速示例：\n\n```\n- name: Ensure directory\
  \ exists for local self-signed TLS certs.\n  file:\n    path: /etc/ssl/certs/example\n\
  \    state: directory\n\n- name: Generate an OpenSSL private key.\n  openssl_privatekey:\n\
  \    path: /etc/ssl/certs/example/privkey.pem\n\n- name: Generate an OpenSSL CSR.\n\
  \  openssl_csr:\n    path: /etc/ssl/certs/example/example.csr\n    privatekey_path:\
  \ /etc/ssl/certs/example/privkey.pem\n    common_name: \"example.com\"\n\n- name:\
  \ Generate a Self Signed OpenSSL certificate.\n  openssl_certificate:\n    path:\
  \ /etc/ssl/certs/example/fullchain.pem\n    privatekey_path: /etc/ssl/certs/example/privkey.pem\n\
  \    csr_path: /etc/ssl/private/example/example.csr\n    provider: selfsigned\n\
  ```\n\n这些任务确保了存在存放证书的目录，在该目录中创建私钥和证书签名请求 (CSR)，并使用它们生成最终证书。\n\n然后你可以使用此证书通过 Web\
  \ 服务器提供 HTTPS 请求；例如，在 Nginx `server` 配置中：\n\n```\nserver {\n    listen 443 ssl default_server;\n\
  \    server_name example.com;\n\n    ssl_certificate {{ certificate_dir }}/{{ server_hostname\
  \ }}/fullchain.pem;\n    ssl_certificate_key {{ certificate_dir }}/{{ server_hostname\
  \ }}/privkey.pem;\n    ...\n}\n```\n\n让我们使用 `openssl_*` 模块和 Nginx 组合一个完整的 playbook，构建一个带有自签名证书和安全\
  \ Nginx TLS 配置的服务器。\n\n### 带有自签名证书的幂等性 Nginx HTTPS playbook\n\n为了方便起见，此示例将针对 Debian\
  \ 9 服务器（尽管对于任何其他发行版也基本保持不变），并且本书的 GitHub 仓库中包含一个经过完全测试的示例：[HTTPS 自签名证书演示虚拟机](https://github.com/geerlingguy/ansible-for-devops/tree/master/https-self-signed)。\n\
  \n为自签名证书 Web 服务器 playbook 创建新文件夹，并添加一个 `main.yml` playbook：\n\n```\n 1 ---\n 2 -\
  \ hosts: all\n 3 \n 4   vars_files:\n 5     - vars/main.yml\n 6 \n 7   pre_tasks:\n\
  \ 8     - name: Ensure apt cache is updated.\n 9       apt: update_cache=yes cache_valid_time=600\n\
  10 \n11     - name: Install dependency for pyopenssl.\n12       apt: name=libssl-dev\
  \ state=present\n```\n\n为了保持主 playbook 的整洁，我们将任何变量存储在包含的变量文件中（请直接在 `vars` 目录中创建一个空的\
  \ `main.yml` 变量文件）。接下来，在大多数 Debian（以及基于 Debian 的）发行版中，我添加了一个 `pre_task` 来确保 Apt\
  \ 缓存是最新的（这可以防止在稍后安装包时出现错误）。最后，`libssl-dev` 是我们在系统上需要的依赖项，以确保稍后可以通过 `pip` 安装 `pyopenssl`，所以我们也会做这一点。\n\
  \n接下来，为了节省时间，我们可以依靠一些 Galaxy 角色来安装和配置：\n\n```\n14   roles:\n15     geerlingguy.firewall\n\
  16     geerlingguy.pip\n17     geerlingguy.nginx\n```\n\n为了获取这些角色，在 playbook 目录下创建一个\
  \ `requirements.yml` 文件，内容如下：\n\n```\n1 ---\n2 roles:\n3   - geerlingguy.firewall\n\
  4   - geerlingguy.pip\n5   - geerlingguy.nginx\n```\n\n然后运行 `ansible-galaxy install\
  \ -r requirements.yml` 来安装角色。\n\n现在让我们定义一些变量，让 `firewall`、`pip` 和 `nginx` 角色配置我们需要的内容：\n\
  \n```\n 1 # Firewall settings.\n 2 firewall_allowed_ports:\n 3   - \"22\"\n 4  \
  \ - \"80\"\n 5   - \"443\"\n 6 \n 7 # Python settings.\n 8 pip_install_packages:\
  \ ['pyopenssl']\n 9 \n10 # Nginx settings.\n 11 nginx_vhosts: []\n12 nginx_remove_default_vhost:\
  \ True\n13 nginx_ppa_version: stable\n14 nginx_docroot: /var/www/html\n```\n\n对于防火墙，你需要开放端口\
  \ 22 用于远程访问，80 用于 HTTP 请求（我们将其重定向到 HTTPS），以及 443 用于 HTTPS。\n\n对于 Pip，我们需要确保安装了正确的\
  \ pip（对于 Debian 9，使用 `python3-pip`，它默认安装了 Python 3），并告诉它安装最新版本的 `pyopenssl` 包。\n\
  \n对于 Nginx，我们希望移除发行版安装包带的默认虚拟主机（server），我们希望将角色的 vhosts 设置为空数组（因为我们将自己管理 Nginx `server`\
  \ 配置），最后我们将使用 docroot `/var/www/html`。\n\n现在我们已经完成了所有基础包的安装和配置，下一步是生成自签名证书。为了保持\
  \ playbook 的整洁，所需的任务可以放入导入的任务文件中，并在 `main.yml` 中如下所示导入：\n\n```\n19   tasks:\n20\
  \     - import_tasks: tasks/self-signed-cert.yml\n```\n\n创建一个 `tasks` 文件夹，并在其中创建一个\
  \ `self-signed-cert.yml` 任务文件。我们将创建私钥、生成 CSR 和生成证书的任务放入此文件中：\n\n\n\n\n```\n 1 ---\n\
  \ 2 - name: Ensure directory exists for local self-signed TLS certs.\n 3   file:\n\
  \ 4     path: \"{{ certificate_dir }}/{{ server_hostname }}\"\n 5     state: directory\n\
  \ 6 \n 7 - name: Generate an OpenSSL private key.\n 8   openssl_privatekey:\n 9\
  \     path: \"{{ certificate_dir }}/{{ server_hostname }}/privkey.pem\"\n10 \n 11\
  \ - name: Generate an OpenSSL CSR.\n 12   openssl_csr:\n 13     path: \"{{ certificate_dir\
  \ }}/{{ server_hostname }}.csr\"\n 14     privatekey_path: \"{{ certificate_dir\
  \ }}/{{ server_hostname }}/privk\\\n15 ey.pem\"\n 16     common_name: \"{{ server_hostname\
  \ }}\"\n 17 \n 18 - name: Generate a Self Signed OpenSSL certificate.\n 19   openssl_certificate:\n\
  \ 20     path: \"{{ certificate_dir }}/{{ server_hostname }}/fullchain.pem\"\n 21\
  \     privatekey_path: \"{{ certificate_dir }}/{{ server_hostname }}/privk\\\n22\
  \ ey.pem\"\n 23     csr_path: \"{{ certificate_dir }}/{{ server_hostname }}.csr\"\
  \n 24     provider: selfsigned\n```\n\n我们添加了两个变量，现在将在 `vars/main.yml` 文件中定义它们（使用变量可以更容易地更改站点和/或在未来进行重构以支持多个值）。将这些变量添加到\
  \ vars 文件中：\n\n```\n19 # 自签名证书设置.\n20 certificate_dir: /etc/ssl/private\n21 server_hostname:\
  \ https.test\n```\n\n现在 playbook 可以生成证书（或者在未来的运行中，以幂等的方式验证证书的存在），我们需要配置 Nginx 使用该证书通过\
  \ TLS 为特定 URL 交付流量。\n\n`geerlingguy.nginx` 角色处理了大部分 Nginx 配置，但我们禁用了该角色对虚拟主机的管理，转而由自己管理单个虚拟主机（或\
  \ `server` 指令）。以下任务将示例落地页复制到定义的 docroot 中，然后是我们自定义的 HTTPS `server` 配置，使用生成的证书用于\
  \ docroot：\n\n```\n 22     - name: Ensure docroot exists.\n 23       file:\n 24\
  \         path: \"{{ nginx_docroot }}\"\n 25         state: directory\n 26 \n 27\
  \     - name: Copy example index.html file in place.\n 28       copy:\n 29     \
  \    src: files/index.html\n 30         dest: \"{{ nginx_docroot }}/index.html\"\
  \n 31         mode: 0755\n 32 \n 33     - name: Copy Nginx server configuration\
  \ in place.\n 34       template:\n 35         src: templates/https.test.conf.j2\n\
  \ 36         dest: /etc/nginx/sites-enabled/https.test.conf\n 37         mode: 0644\n\
  \ 38       notify: restart nginx\n```\n\n相当直接，但我们需要填好几个空。首先，这是一个快速易懂的 `index.html`，仅供你测试功能：\n\
  \n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n 4   <title>HTTPS Self-Signed Certificate\
  \ Test</title>\n 5   <style>* { font-family: Helvetica, Arial, sans-serif }</style>\n\
  \ 6 </head>\n 7 <body>\n 8   <h1>HTTPS Self-Signed Certificate Test</h1>\n 9   \
  \  <p>If you can see this message, it worked!</p>\n10 </body>\n11 </html>\n```\n\
  \n将该 HTML 放入你 playbook 目录下的 `files/index.html` 中，然后创建另一个文件 `templates/https.test.conf.j2`，内容如下：\n\
  \n```\n 1 # HTTPS 测试服务器配置.\n 2 \n 3 # 将 HTTP 流量重定向到 HTTPS.\n 4 server {\n 5    \
  \ listen 80 default_server;\n 6     server_name _;\n 7     index index.html;\n 8\
  \     return 301 https://$host$request_uri;\n 9 }\n10 \n 11 # 使用由 Ansible 创建的自签名证书提供\
  \ HTTPS 流量。\n 13 server {\n 14     listen 443 ssl default_server;\n 15     server_name\
  \ {{ server_hostname }};\n 16     root {{ nginx_docroot }};\n 17 \n 18     ssl_certificate\
  \ {{ certificate_dir }}/{{ server_hostname }}/fullcha\\\n19 in.pem;\n 20     ssl_certificate_key\
  \ {{ certificate_dir }}/{{ server_hostname }}/pri\\\n21 vkey.pem;\n 22 }\n```\n\n\
  该服务器配置中最重要的部分指示 Nginx 使用我们生成的 SSL 证书（路径为 `{{ certificate_dir }}/{{ server_hostname\
  \ }}/fullchain.pem;`），用于域名 `{{ server_hostname }}` 的 443 端口请求（在此例情况下，为指向 `https://https.test/`\
  \ 的请求）。\n\n注意 `Copy Nginx server configuration in place.` 任务中的 `notify: restart\
  \ nginx`；这将强制 Nginx 在配置更改后重启。\n\n一旦运行此 playbook，如果没有错误，你应该能够安全地访问 `https://https.test/`（假设你已有相应的记录）。\n\
  \n### 使用 Galaxy 角色快速完成\n\n与其自己编写所有的自动化脚本，我们可以依赖 Ansible Galaxy 中的某些角色来完成重型工作。在项目目录创建一个\
  \ `requirements.yml` 文件，包含：\n\n```\n1 ---\n2 roles:\n3   - name: geerlingguy.firewall\n\
  4   - name: geerlingguy.certbot\n5   - name: geerlingguy.nginx\n```\n\n我们将使用 `geerlingguy.firewall`\
  \ 角色来保护未使用的端口，使用 `geerlingguy.certbot` 获取并设置自动续期，并使用 `nginx` 配置 Web 服务器通过 HTTPS\
  \ 提供内容。\n\n`geerlingguy.certbot` 角色是操作的核心；其工作原理如下：\n\n1. 首先，根据 `certbot_install_from_source`\
  \ 的值从系统软件包或源码安装 Certbot。源码安装通常更好，因为 Certbot 有时会添加不会回溯系统软件包的有用功能。\n2. 然后，如果通过 `certbot_create_if_missing`\
  \ 进行配置且 `certbot_certs` 中指定的证书尚不存在，则创建证书。它使用 `certbot_create_command` 创建证书，并在创建期间还可以停止和启动某些服务。\n\
  3. 最后，如果 `certbot_auto_renew` 为 `true`，它会设置一个证书续期的 cron 任务，使用 `certbot renew` 命令以及通过\
  \ `certbot_auto_renew_options` 传递的选项。自动续期是 Let’s encrypt 的主要优势之一，因为只要你的续期流程正常，你就永远不会因为证书过期而醒来面对停机！\n\
  \n一旦设置好 requirements 文件，在项目目录创建一个 `ansible.cfg` 文件，告诉 Ansible 在哪里存储和使用下载的角色：\n\n\
  ```\n[defaults]\nroles_path = ./roles\n```\n\n使用 `ansible-galaxy install -r requirements.yml`\
  \ 安装所需的角色。\n\n\n\n\n\n## 创建 playbook\n\n在项目目录中添加一个 `main.yml` playbook。此 playbook\
  \ 将针对运行着 Ubuntu 最小化发行版的服务器（该发行版可能不包含 Python），因此我们需要在 `pre_tasks` 中执行一些特殊操作，以确保 Ansible\
  \ 能够在服务器上进行操作。然后，我们将运行从 Ansible Galaxy 下载的三个角色（roles），并配置 Nginx 使用 Let’s Encrypt\
  \ 证书提供简单的网页。\n\n首先，在所有 `letsencrypt` 主机上启动剧目（play），由于我们可能需要安装 Python 来收集服务器信息（facts）供\
  \ Ansible 使用，请禁用初始的 `gather_facts`：\n\n```\n1 ---\n2 - hosts: letsencrypt\n3   become:\
  \ true\n4 \n5   vars_files:\n6     - vars/main.yml\n```\n\n我们还需要使用 `sudo` 执行绝大多数任务（因为我们需要修改系统、配置\
  \ Nginx 等），所以 `become: true` 是必要的。最后，为了添加证书生成、防火墙配置和 Nginx 的配置，我们将所有变量都存放在 `vars/main.yml`\
  \ 文件中。\n\n在 `main.yml` 的 `pre_tasks` 中，更新 Apt 缓存，因为我们希望在安装软件时能够获得最新的软件包数据：\n\n```\n\
  \ 8   pre_tasks:\n 9     - name: Ensure apt cache is updated.\n10       apt: update_cache=true\
  \ cache_valid_time=600\n```\n\n现在，是时候处理 playbook 的核心部分——`roles`。调用每一个角色：\n\n```\n\
  12   roles:\n13     - geerlingguy.firewall\n14     - geerlingguy.nginx\n15     -\
  \ geerlingguy.certbot\n```\n\n由于这些角色将承担主要的繁重工作（为易读的 playbook 点赞！），我们通过 `vars/main.yml`\
  \ 中的变量来告诉它们要做什么：\n\n```\n 1 ---\n 2 # 防墙设置。\n 3 firewall_allowed_tcp_ports:\n 4\
  \   - \"22\"\n 5   - \"80\"\n 6   - \"443\"\n 7 \n 8 # Nginx 设置。\n 9 nginx_vhosts:\
  \ []\n10 nginx_remove_default_vhost: true\n11 nginx_ppa_version: stable\n12 nginx_docroot:\
  \ /var/www/html\n 13 \n14 # Let's Encrypt 证书设置。\n15 certbot_create_if_missing: true\n\
  16 certbot_admin_email: \"{{ letsencrypt_email }}\"\n17 certbot_certs:\n18   - domains:\n\
  19       - \"{{ inventory_hostname }}\"\n```\n\n### 分章节说明：\n\n*   对于典型的 Web 服务器，我们需要\
  \ `22` 端口用于 SSH 访问，`80` 端口用于未加密的 HTTP 访问（Let’s Encrypt 需要此来通过其默认验证机制运行），以及 `443`\
  \ 端口用于加密的 HTTPS 访问。\n*   对于 Nginx，我们稍后将配置自己的自定义虚拟主机，因此我们要确保移除默认的 vhost，同时我们还将从 Nginx\
  \ 的 Ubuntu PPA 安装最新版本的 Nginx。我们添加了一个额外的变量 `nginx_docroot`，用于告诉我们的自动化代码将测试网页放在哪里，并通过\
  \ Nginx 提供服务。\n*   Certbot 角色只需要几个变量即可确保添加证书：\n    *   `certbot_create_if_missing`:\
  \ 角色会检查证书是否存在，如果不存在（例如在首次运行 playbook 时），它将创建证书。如果已存在，它将是幂等的且不会进行任何更改。\n    *   `certbot_admin_email`:\
  \ Let’s Encrypt 允许你为其生成的每个证书[关联一个邮箱地址](https://letsencrypt.org/docs/expiration-emails/)，并使用该邮箱地址通知所有者证书的任何问题，例如由于服务器问题导致即将过期。\n\
  \    *   `certbot_certs`: 你可以使用此列表添加一个或多个证书；每个证书可以使用主题备别名称（SAN）证书覆盖一个或多个域名。\n\n\
  vars 文件中两个 Jinja 变量没有在 vars 中定义——相反，它们将来自清单（inventory）。我们很快就会设置它。\n\n现在我们有了一个配置好\
  \ HTTP/S 防火墙、由 Certbot 生成的 Let’s Encrypt 证书以及基础 Nginx Web 服务器的 playbook，我们需要配置 Nginx\
  \ 提供某些内容，并使用 Let’s Encrypt 证书通过 HTTPS 提供服务。\n\n因此，对于 playbook 的最后部分，我们需要：\n\n1.\
  \  确保 `nginx_docroot` 存在。\n2.  创建并复制一个示例 `index.html` 文件到该文档根目录进行提供。\n3.  创建并复制一个\
  \ Nginx 服务器配置，将所有流量重定向到 HTTPS 并使用生成的 Let’s Encrypt 证书提供流量服务。\n\n为了确保 `nginx_docroot`\
  \ 存在，在 playbook 的 `tasks` 部分添加一个任务：\n\n```\n17   tasks:\n18     - name: Ensure docroot\
  \ exists.\n19       file:\n20         path: \"{{ nginx_docroot }}\"\n21        \
  \ state: directory\n```\n\n现在我们需要在 docroot 内部一个 HTML 文件以便 Nginx 提供服务，否则 Nginx 将返回\
  \ 404 Not Found。在你的项目目录创建一个名为 `files/index.html` 的简单 HTML 文件，内容如下：\n\n```\n 1 <!DOCTYPE\
  \ html>\n 2 <html>\n 3 <head>\n 4   <title>Let's Encrypt Test</title>\n 5   <style>*\
  \ { font-family: Helvetica, Arial, sans-serif }</style>\n 6 </head>\n 7 <body>\n\
  \ 8   <h1>Let's Encrypt Test</h1>\n 9   <p>If you can see this message, it worked!</p>\n\
  10 </body>\n 11 </html>\n```\n\n然后在 `main.yml` 中添加一个 `copy` 任务，在 docroot 任务之后将文件复制到位：\n\
  \n```\n23     - name: Copy index.html file.\n24       copy:\n25         src: files/index.html\n\
  26         dest: \"{{ nginx_docroot }}/index.html\"\n27         mode: 0755\n```\n\
  \n最后，我们需要配置两个 `server` 块；一个将 HTTP 请求重定向到 HTTPS，另一个使用 Let’s Encrypt 证书提供 HTTPS 服务。在\
  \ `templates/https-letsencrypt.conf.j2` 中创建一个 Nginx 配置模板，如下：\n\n```\n 1 # server\
  \ 配置。\n 2 \n 3 # 将 HTTP 流量重定向到 HTTPS。\n 4 server {\n 5     listen 80 default_server;\n\
  \ 6     server_name _;\n 7     index index.html;\n 8     return 301 https://$host$request_uri;\n\
  \ 9 }\n 10 \n11 # 使用 Let's Encrypt 证书提供 HTTPS 流量。\n12 server {\n 13     listen 443\
  \ ssl default_server;\n 14     server_name {{ inventory_hostname }};\n 15     root\
  \ {{ nginx_docroot }};\n 16 \n 17     ssl_certificate /etc/letsencrypt/live/{{ inventory_hostname\
  \ }}/full\n18 chain.pem;\n 19     ssl_certificate_key /etc/letsencrypt/live/{{ inventory_hostname\
  \ }}/\n20 privkey.pem;\n21 }\n```\n\n等等，我需要确保在创建或修改模板时重启 Nginx：\n\n```\n29     -\
  \ name: Copy Nginx server configuration in place.\n30       template:\n31      \
  \   src: templates/https-letsencrypt.conf.j2\n32         dest: /etc/nginx/sites-enabled/https-letsencrypt.conf\n\
  33         mode: 0644\n34       notify: restart nginx\n```\n\n此时，我们有了一个完整的 playbook。它应该设置防火墙、创建证书并配置\
  \ Nginx 使用证书提供网页服务。但我们还没有可以运行该 playbook 的服务器！\n\n#### 创建服务器并配置 DNS\n\nLet’s Encrypt\
  \ 仅在验证域名所有权后才会为域名生成证书。如果 Let’s Encrypt 允许任何人随机为 `apple.com` 或 `google.com` 等域名生成有效证书，互联网将变得非常不安全！\n\
  \nLet’s Encrypt 验证域名所有权的简单方法是确保你的服务器可以通过公共互联网访问。对于内部服务器，Let’s Encrypt 可能不是最佳选择（尽管在某些情况下可以实现）。\n\
  \n\n\n\n在第 9 章中，提供了一个如何通过 Ansible 自动配置服务器的示例。对于你自己的项目，你可能想要使用 Ansible、`Terraform`\
  \ 或其他自动化工具来自动化初始服务器配置的过程。但对于本示例，你只需要确保有一台正在运行且可以通过公共互联网访问的服务器。你还需要将一个域名指向该服务器（例如\
  \ `subdomain.example.com`）。\n\n一旦你完成了这些操作，并确认可以通过实际域名 SSH 登录到服务器（例如 `ssh myuser@subdomain.example.com`），你就可以准备将\
  \ playbook 指向该服务器并通过 Ansible 配置所有内容了。\n\n### 将 playbook 清单指向服务器\n\n假设你的服务器可以通过 `subdomain.example.com`\
  \ 访问，并且你的 SSH 用户名为 `myuser`，请在项目目录下创建一个包含以下内容的 `inventory` 文件：\n\n```\n1 [letsencrypt]\n\
  2 subdomain.example.com\n3 \n4 [letsencrypt:vars]\n5 ansible_user=myuser\n6 letsencrypt_email=webmaster@example.com\n\
  ```\n\n现在 playbook 已经知道如何连接到你的公网服务器，是时候尝试一下了。首先，确保安装了所有需要的 Galaxy 角色：\n\n```\nansible-galaxy\
  \ install -r requirements.yml\n```\n\n然后运行 playbook：\n\n```\nansible-playbook -i\
  \ inventory main.yml\n```\n\n几分钟后，假设 Let’s Encrypt 能够通过 80 端口访问你在 `subdomain.example.com`\
  \ 的服务器，你应该能够通过 HTTPS 访问之前创建的 `index.html` 网页。\n\n### 通过 HTTPS 访问你的服务器！\n\n访问 `https://subdomain.example.com/`，你会看到类似的内容：\n\
  \n![HTTPS 测试站点加载了有效的 letsencrypt 证书](img/14-letsencrypt-valid-certificate.png)\n\
  \nHTTPS 测试站点加载了有效的 Let's Encrypt 证书\n\n使用 Let’s Encrypt 自动化免费证书很有趣，但在一次为 3,000 个子域名自动化证书之前，请确保你了解\
  \ [Let’s Encrypt 的速率限制](https://letsencrypt.org/docs/rate-limits/)！\n\n### 配置 Nginx\
  \ 代理 HTTP 流量并通过 HTTPS 提供\n\n你可能会遇到的一个常见问题是：旧的 Web 应用程序或服务不再更新但必须继续运行，并且需要 HTTPS\
  \ 加密（无论是为了 SEO 还是安全合规）。\n\n你可以使用像 Cloudflare 这样的第三方服务通过 HTTPS 代理所有流量，但 Cloudflare\
  \ 网络到你的后端服务器之间仍然会有一个未加密的公网连接。即使你使用了 CDN，最好将流量一直加密到尽可能靠近应用程序服务器的地方。\n\n这正是 Nginx\
  \ 大显身手的地方！虽然其他工具也可以做同样的事情，但 Nginx 作为用于 HTTP 后端的 HTTPS 代理服务器非常容易配置。\n\n### 修改 Nginx\
  \ 配置以代理流量\n\n我们将使用本章之前自签名证书示例中完全相同的 playbook 和配置，但进行两处小修改。调整后的 playbook 可以在本书的 GitHub\
  \ 仓库找到：[HTTPS Nginx Proxy Demo VM](https://github.com/geerlingguy/ansible-for-devops/tree/master/https-nginx-proxy)。要设置并测试\
  \ Nginx 代理 HTTPS 流量到 HTTP 后端应用程序，只需要两个小改动：\n\n1. 不要由 Nginx 直接提供流量，而是让 Nginx 将请求代理到运行在\
  \ 8080 端口的后端服务器。\n2. 使用 Python 在 8080 端口上运行后端 HTTP 服务器。\n\n首先，配置端口 443 的 `server`\
  \ 块将流量代理到本地端口 `8080` 上运行的另一个服务：\n\n```\n11 # 使用自签名证书代理 HTTPS 流量。\n12 server {\n\
  13     listen 443 ssl default_server;\n14     server_name {{ server_hostname }};\n\
  15 \n16     location / {\n17         include /etc/nginx/proxy_params;\n18      \
  \   proxy_pass          http://localhost:8080;\n19         proxy_read_timeout  90s;\n\
  20         proxy_redirect      http://localhost:8080 {{ server_hostname }};\n21\
  \     }\n22 \n23     ssl_certificate {{ certificate_dir }}/{{ server_hostname }}/fullcha\\\
  \n24 in.pem;\n25     ssl_certificate_key {{ certificate_dir }}/{{ server_hostname\
  \ }}/pri\\\n26 vkey.pem;\n27 }\n```\n\n所做的只是删除了 `root` 指令，并用 `location` 指令取代取代。这个特定的\
  \ `location` 指令告诉 Nginx 将任何路径（`/` 包含所有内容）的*所有*请求代理到地址 `http://localhost:8080`，并带有\
  \ 90 秒的后端超时。\n\n不过这假设 8080 端口上运行着后端 HTTP 服务！因此，第二步是在 8080 端口上运行某些东西。幸运的是，由于我们已经有了\
  \ Python 和 Web 根目录，可以使用 Python 使用一个非常简单的 CLI 命令来运行 HTTP 服务器：\n\n```\npython3 -m\
  \ http.server 8080 --directory /var/www/html\n```\n\n你可以交互式地运行该命令，或者如果你在之前的 Ansible\
  \ playbook 中对其进行自动化，可以将其添加到：\n\n```\n33     - name: Start simple webserver on 8080\n\
  34       shell: >\n             python3 -m http.server 8080 --directory /var/www/html\
  \ }} &\n35       changed_when: false\n36       async: 45\n37       poll: 0\n```\n\
  \n注意使用 `&`、`async` 和 `poll` 来触发并遗忘命令，这样它就可以在后台运行。在生产环境中这样运行应用程序并不是好主意，但为了演示目的，验证\
  \ Nginx 是否正确代理是足够的。\n\n现在 8080 端口上运行着服务器了，你应该看到 Nginx 成功代理了：\n\n![Nginx 将请求代理到后端应用程序](img/14-https-proxy-test.png)\n\
  \nNginx 将请求代理到后端应用程序\n\n如果你登录服务器并杀死在 8080 端口提供流量的 Python 进程，那么 Nginx 将仍然尝试代理流量，但会返回\
  \ 502 Bad Gateway，因为后端不可用：\n\n![后端不可用时 Nginx 返回 502 Bad Gateway](img/14-https-proxy-502-bad-gateway.png)\n\
  \n后端不可用时 Nginx 返回 502 Bad Gateway\n\n### 总结\n\nHTTPS 现在是任何面向公众的网站和应用程序的基本功能，在内部服务中使用它也是相当标准的做法。Ansible\
  \ 自动化了使用 TLS 证书加密所有 HTTP 流量的过程，无论证书类型或用例如何。\n\n```\n ____________________________________________\n\
  / Fool me once, shame on you. Fool me twice, \\\n\\ prepare to die. (Klingon Proverb)\
  \          /\n --------------------------------------------\n        \\   ^__^\n\
  \         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w\
  \ |\n                ||     ||\n```\n\nDocker 是一个高度优化的平台，用于在本地机器和服务器上高效地构建和运行容器。你可以将\
  \ Docker 容器视为轻量级的虚拟机。本书将不会介绍 Docker 和 Linux 容器的工作原理，但将介绍 Ansible 如何与 Docker 集成以构建、管理和部署容器。\n\
  \n### Docker 容器简介\n\n让我们从一个极其简单的示例开始，让我们从 Dockerfile 构建 Docker 镜像。在这种情况下，我们想要展示\
  \ Dockerfile 是如何工作的，以及我们如何使用 Ansible 构建镜像，就像使用命令行中的 `docker build` 一样。\n\n让我们从一个\
  \ Dockerfile 开始：\n\n```\n1 # 构建示例 Docker 容器镜像。\n2 FROM busybox\n3 LABEL maintainer=\"\
  Jeff Geerling\"\n4 \n5 # 当容器启动时运行命令。\n6 CMD [\"/bin/true\"]\n```\n\n\n\n\n这个 Docker\
  \ 容器并没有什么特别的功能，但没关系；我们只是想构建它并验证它是否存在且运行正常——首先使用 Docker，然后使用 Ansible。\n\n将上述文件保存为新目录下的\
  \ `Dockerfile`，然后在命令行中中运行以下命令来构建容器：\n\n```\n$ docker build -t test .\n```\n\n几秒钟后，Docker\
  \ 镜像应该构建完成。如果你使用 `docker image` 列出所有本地镜像，你应该能看到新创建的测试镜像（以及作为基础的 busybox 镜像）：\n\n\
  ```\n$ docker images\nREPOSITORY  TAG     IMAGE ID      CREATED             VIRTUAL\
  \ SIZE\ntest        latest  50d6e6479bc7  About a minute ago  2.433 MB\nbusybox\
  \     latest  4986bf8c1536  2 weeks ago         2.433 MB\n```\n\n如果你想运行刚刚创建的容器镜像，请输入以下内容：\n\
  \n```\n$ docker run --name=test test\n```\n\n这将创建一个名为 `test` 的 Docker 容器并启动该容器。由于我们的容器唯一做的事情是调用\
  \ `/bin/true`，容器将运行该命令后退出。你可以通过 `docker ps -a` 命令查看所有容器的当前状态（无论它们是否正在运行）：\n\n```\n\
  $ docker ps -a\nCONTAINER ID  IMAGE        [...]  CREATED        STATUS\nbae0972c26d4\
  \  test:latest  [...]  3 seconds ago  Exited (0) 2s ago\n```\n\n可以使用容器 ID（在此情况下为\
  \ `bae0972c26d4`）或名称（`test`）来控制容器：用 `docker start [container]` ，用 `docker stop [container]`\
  \ 停止，用 `docker rm [container]` 删除/移除。\n\n如果你删除了容器（`docker rm test`）和构建的镜像（`docker\
  \ rmi test`），你可以修改 Dockerfile 并通过 `docker build` 重建镜像，然后用 `docker run` 运行结果来进行实验。例如，如果你将命令从\
  \ `/bin/true` 改为 `/bin/false`，然后运行构建并启动容器，`docker ps -a` 将显示容器以状态码 `1` 退出，而不是 `0`。\n\
  \n对于我们的目的来说，这是对 Docker 工作原理的一个很好的介绍。总结一下：\n\n*   Dockerfiles 包含了 Docker 构建容器时使用的指令。\n\
  *   `docker build` 构建 Dockerfiles 并生成容器镜像。\n*   `docker images` 列出系统上所有的镜像。\n* \
  \  `docker run` 运行已的镜像。\n*   `docker ps -a` 列出所有容器（包括运行和停止的）。\n\n在开发 Dockerfiles\
  \ 来容器化你自己的应用程序时，你可能想要熟悉 Docker CLI 以及该过程从手动角度是如何运作的。但在构建最终镜像并在服务器上运行它们时，Ansible\
  \ 可以帮助简化这一过程。\n\n## 使用 Ansible 构建和管理容器\n\nAnsible 内置了 Docker 模块，可以与 Docker 良好集成以进行容器管理。我们将使用它们来自动化我们刚刚创建的容器（由\
  \ Dockerfile 管理）的构建和运行。\n\n将你拥有的 Dockerfile 移动到子目录，并在项目根目录下创建一个新的 Ansible playbook（命名为\
  \ `main.yml`）。目录结构应该如下：\n\n```\ndocker/\n  main.yml\n  test/\n    Dockerfile\n```\n\
  \n在新的 playbook 中，添加以下内容：\n\n```\n 1 ---\n 2 - hosts: localhost\n 3   connection:\
  \ local\n 4 \n 5   tasks:\n 6     - name: Ensure Docker image is built from the\
  \ test Dockerfile.\n 7       docker_image:\n 8         name: test\n 9         source:\
  \ build\n10         build:\n11           path: test\n12         state: present\n\
  ```\n\n该 playbook 使用 `docker_image` 模块来构建镜像。为镜像提供一个名称，告诉 Ansible 镜像的源是 `build`，然后在\
  \ `build` 参数中提供 Dockerfile 的路径（在此情况下，在 `test` 目录内部）。最后，通过 `state` 参数告诉 Ansible 镜像应该是\
  \ `present`（存在的），以确保它被构建并可用。\n\n运行 playbook（`$ ansible-playbook main.yml`），然后列出所有\
  \ Docker 镜像（`$ docker images`）。如果一切成功，你应该会在列表中看到一个新鲜的 `test` 镜像。\n\n不过再次运行 `docker\
  \ ps -a`，你会发现新的 `test` 镜像从未运行过且未出现在输出中。让我们通过向 Ansible playbook 中添加另一个任务来修复这个问题：\n\
  \n```\n12     - name: Ensure the test container is running.\n13       docker_container:\n\
  14         image: test:latest\n15         name: test\n16         state: started\n\
  ```\n\n如果你再次运行 playbook，Ansible 将启动 Docker 容器。通过 `docker ps -a` 容器列表，你会注意到 `test`\
  \ 容器再次出现。\n\n你可以通过将两个任务的 `state` 参数都更改为 `absent` 来通过 Ansible 容器和镜像。\n\n## 使用 Ansible\
  \ 和 Docker 构建 Flask 应用\n\n让我们构建一个更有实用的 Docker 驱动环境，其中包含一个运行我们应用程序（使用 Flask 构建，这是一个轻量\
  \ Python Web 框架）的容器，和一个运行数据库（MySQL）的容器，以及一个数据容器。我们需要单独的数据容器来持久化 MySQL 数据库，因为 MySQL\
  \ 容器内部的数据每次容器停止时都会丢失。\n\n![Docker stack for Flask App](img/15-flask-docker-stack.png)\n\
  \nFlask 应用的 Docker 栈\n\n我们将使用 Vagrant 创建一个虚拟机来运行我们的 Docker 容器，这样相同的 Docker 配置就可以在任何运行\
  \ Ansible 和 Vagrant 的机器上进行测试。创建一个 `docker` 文件夹，并在其中创建以下 `Vagrantfile`：\n\n```\n\
  \ 1 # -*- mode: ruby -*-\n 2 # vi: set ft=ruby :\n 3 \n 4 VAGRANTFILE_API_VERSION\
  \ = \"2\"\n 5 \n 6 Vagrant.configure(VAGRANTFILE_API_VERSION) do |config|\n 7  \
  \ config.vm.box = \"geerlingguy/ubuntu2004\"\n 8   config.vm.network :private_network,\
  \ ip: \"192.168.56.39\"\n 9   config.ssh.insert_key = false\n10 \n11   config.vm.hostname\
  \ = \"docker-flask.test\"\n12   config.vm.provider :virtualbox do |v|\n13     v.name\
  \ = \"docker-flask.test\"\n14     v.memory = 1024\n15     v.cpus = 2\n16     v.customize\
  \ [\"modifyvm\", :id, \"--natshresolver\", \"on\"]\n17     v.customize [\"modifyvm\"\
  , :id, \"--apic\", \"on\"]\n18   end\n19 \n20   # Enable provisioning with Ansible.\n\
  21   config.vm.provision \"ansible\" do |ansible|\n22     ansible.playbook = \"\
  provisioning/main.yml\"\n23   end\n24 \n25 end\n```\n\n我们将使用 Vagrant 创建一个虚拟机来运行我们的\
  \ Docker 容器，这样相同的 Docker 配置就可以在任何运行 Ansible 和 Vagrant 的机器上进行测试。我们将在此示例中使用 Ubuntu，并指定了一个\
  \ `ansible.playbook` 来设置一切。在 `provisioning/main.yml` 中，我们需要首先安装并配置 Docker（我们将使用\
  \ Galaxy 角色 `geerlingguy.docker`），然后运行一些设置任务，最后构建并启动所需的容器：\n\n```\n 1 ---\n 2 -\
  \ hosts: all\n 3   become: true\n 4 \n 5   vars:\n 6     build_root: /vagrant/provisioning\n\
  \ 7 \n 8   pre_tasks:\n 9     - name: Update apt cache if needed.\n10       apt:\
  \ update_cache=yes cache_valid_time=3600\n 11 \n12   roles:\n 13     - role: geerlingguy.docker\n\
  \ 14 \n 15   tasks:\n 16     - import_tasks: setup.yml\n 17     - import_tasks:\
  \ docker.yml\n```\n\n对所有操作都使用 `sudo`，因为 Docker 要么需要根权限，要么需要当前用户位于 `docker` 组。对于我们的目的，简单的方法是通过设置\
  \ `become: true` 来设置一切。\n\n我们还设置了 `build_root` 变量，稍后我们将用它告诉 Docker 在虚拟机内部共享卷内构建容器。`geerlingguy.docker`\
  \ 角色不需要额外的设置或配置，但它需要通过 `ansible-galaxy` 安装，因此添加一个 `requirements.yml`：\n\n```\n1\
  \ roles:\n2   - name: geerlingguy.docker\n```\n\n并确保角色已安装：\n\n```\n$ ansible-galaxy\
  \ install -r requirements.yml\n```\n\n接下来，在与 `main.yml` 相同的 `provisioning` 目录中创建\
  \ `setup.yml`：\n\n```\n1 ---\n2 - name: Install Pip.\n3   apt: name=python3-pip\
  \ state=present\n4 \n5 - name: Install Docker Python library.\n6   pip: name=docker\
  \ state=present\n```\n\n\n\n\n\nAnsible 需要 `docker` Python 库来通过 Python 控制 Docker，因此我们先安装\
  \ `pip`，然后使用它安装 `docker`。\n\n接下来是 playbook 的核心部分：`docker.yml`（位于 `provisioning`\
  \ 目录下）。第一个任务是为数据、应用程序和数据库容器构建 Docker 镜像：\n\n```\n 1 ---\n 2 - name: Build Docker\
  \ images from Dockerfiles.\n 3   docker_image:\n 4     name: \"{{ item.name }}\"\
  \n 5     tag: \"{{ item.tag }}\"\n 6     source: build\n 7     build:\n 8      \
  \ path: \"{{ build_root }}/{{ item.directory }}\"\n 9       pull: false\n10    \
  \ state: present\n11   with_items:\n12     - { name: data, tag: latest, directory:\
  \ data }\n13     - { name: flask, tag: latest, directory: www }\n14     - { name:\
  \ db, tag: latest, directory: db }\n```\n\n不要担心我们还没有创建创建 Docker 镜像所需的实际 Dockerfile；我们会在使用\
  \ Ansible 完成所有结构化工作后再进行这些操作。\n\n类似于我们之前对 `docker_image` 的用法，为每个镜像提供了 `name`、`build.path`\
  \ 和 `source`。在这个示例中，我们还添加了 `tag`，它的行为类似于 git tag，允许未来的 Docker 命令使用我们创建的特定版本的镜像。我们将构建三个容器：`data`、`flask`\
  \ 和 `db`，并让 Docker 指向路径 `/vagrant/provisioning/[directory]`，其中 `[directory]` 包含了\
  \ Dockerfile 以及其他用于构建 Docker 镜像的任何有用文件。\n\n构建镜像后，我们需要启动每一个镜像（或者至少在 `data` 容器的情况下确保容器为\
  \ `present` ——因为你可以使用非运行容器的数据卷）。我们将在三个独立的 `docker_container` 任务中完成操作：\n\n```\n16\
  \ # Data containers don't need to be running to be utilized.\n17 - name: Run a Data\
  \ container.\n18   docker_container:\n19     image: data:latest\n20     name: data\n\
  21     state: present\n22 \n23 - name: Run a Flask container.\n24   docker_container:\n\
  25     image: www:latest\n26     name: www\n27     state: started\n28     command:\
  \ python /opt/www/index.py\n29     ports: \"80:80\"\n30 \n31 - name: Run a MySQL\
  \ container.\n32   docker_container:\n33     image: db:latest\n34     name: db\n\
  35     state: started\n36     volumes_from: data\n37     ports: \"3306:3306\"\n\
  38     env:\n39       MYSQL_ROOT_PASSWORD: root\n40       MYSQL_DATABASE: flask\n\
  41       MYSQL_USER: flask\n42       MYSQL_PASSWORD: flask\n```\n\n这些容器的每一个配置都比上一个稍微复杂。对于第一个容器，它只是\
  \ `present`；Ansible 会确保一个 `data` 容器存在。\n\n对于 Flask 容器，我们需要确保我们的应用不仅在运行，而且是*持续*运行。因此，与我们之前使用\
  \ `/bin/true` 短暂运行容器并退出不同，在这种情况下，我们将提供一个显式的运行命令：\n\n```\n25     command: python\
  \ /opt/www/index.py\n```\n\n直接调用脚本将会在前台启动应用并将所有内容记录到 stdout，这样如果需要，可以通过 `docker\
  \ logs [container]` 轻松检查发生了什么。\n\n此外，我们想要将容器的端口 80 映射到主机的端口 80，以便外部用户可以通过 HTTP 加载页面。这是通过使用\
  \ `ports` 选项实现的，传递数据就像你使用 Docker 的 `--publish` 语法一样。\n\nFlask 容器将运行一个静态 Web 应用，不需要额外的非瞬态文件存储，但\
  \ MySQL 容器将挂载来自 `data` 容器的数据卷，这样它就有地方存储数据，数据不会在容器死亡并重启时消失。\n\n因此，对于 `db` 容器，我们使用了一个特殊选项：`volumes_from`\
  \ 用于从指定的容器挂载卷（在本例中为 `data` 容器）。\n\n现在我们已经构建了构建 Docker 基础设施的 playbook，我们将构建全部三个 Dockerfile\
  \ 以及相关的配置，以支持 `data`、`www` 和 `db` 容器。\n\n此时，我们应该拥有如下的目录结构：\n\n```\ndocker/\n  provisioning/\n\
  \    data/\n    db/\n    www/\n    docker.yml\n    main.yml\n    setup.yml\n  Vagrantfile\n\
  ```\n\n### 数据存储容器\n\n对于数据存储容器，我们不需要太多；只需要创建一个目录并使用 `VOLUME` 将其设置为暴露的挂载点：\n\n```\n\
  1 # Build a simple MySQL data volume Docker container.\n2 FROM busybox\n3 MAINTAINER\
  \ Jeff Geerling <geerlingguy@mac.com>\n4 \n5 # Create data volume for MySQL.\n6\
  \ RUN mkdir -p /var/lib/mysql\n7 VOLUME /var/lib/mysql\n```\n\n我们创建一个目录（第 6 行），并暴露该目录（第\
  \ 7 行）。将上述内容保存到 `docker/provisioning/data/Dockerfile`。\n\n### Flask 容器\n\n对于 Flask\
  \ 容器，我们需要确保我们的应用不仅在运行，而且是*持续*运行。因此，与我们之前使用 `/bin/true` 短暂运行容器并退出不同，在这种情况下，我们将提供一个显式的运行命令：\n\
  \n```\n25     command: python /opt/www/index.py\n```\n\n直接调用脚本将会在前台启动应用并将所有内容记录到\
  \ stdout，这样如果需要，可以通过 `docker logs [container]` 轻松检查发生了什么。\n\n此外，我们想要将容器的端口 80 映射到主机的端口\
  \ 80，以便外部用户可以通过 HTTP 加载页面。这是通过使用 `ports` 选项实现的，传递数据就像你使用 Docker 的 `--publish` 语法一样。\n\
  \nFlask 容器将运行一个静态 Web 应用，不需要额外的非瞬态文件存储，但 MySQL 容器将挂载来自 `data` 容器的数据卷，这样它就有地方存储数据，数据不会在容器死亡并重启时消失。\n\
  \n因此，对于 `db` 容器，我们使用了一个特殊选项：`volumes_from` 用于从指定的容器挂载卷（在本例中为 `data` 容器）。\n\n此应用定义了一个路由\
  \ (`/`)，监听每个接口的 80 端口，并显示由模板 `index.html` 渲染的 MySQL 连接页面。将代码保存到 `docker/provisioning/www/index.py`：\n\
  \n```\n 1 # Infrastructure test.\n2 from flask import Flask\n3 from flask import\
  \ Markup\n4 from flask import render_template\n5 from flask_sqlalchemy import SQLAlchemy\n\
  6 from sqlalchemy import text\n7 \n8 app = Flask(__name__)\n9 \n10 # Configure connection.\n\
  11 db_uri = 'mysql://flask:flask@{{ host_address }}/flask'\n12 app.config['SQLALCHEMY_DATABASE_URI']\
  \ = db_uri\n13 db = SQLAlchemy(app)\n14 \n15 @app.route(\"/\")\n16 def test():\n\
  17     mysql_result = False\n18     try:\n19         query = text('SELECT 1')\n\
  20         result = db.engine.execute(query)\n21         if [row[0] for row in result][0]\
  \ == 1:\n22             mysql_result = True\n23     except:\n24         pass\n25\
  \ \n26     if mysql_result:\n27         result = Markup('<span style=\"color: green;\"\
  >PASS</span>')\n28     else:\n29         result = Markup('<span style=\"color: red;\"\
  >FAIL</span>')\n30 \n31     # Return the page with the result.\n32     return render_template('index.html',\
  \ result=result)\n33 \n34 if __name__ == \"__main__\":\n35     app.run(host=\"0.0.0.0\"\
  , port=80)\n```\n\n由于我们正在使用 Jinja 模板来渲染页面，让我们在 `docker/provisioning/www/templates/index.html`\
  \ 创建该模板（Flask 会自动获取 `templates` 目录内的任何模板）：\n\n```\n 1 <!DOCTYPE html>\n 2 <html>\n\
  \ 3 <head>\n 4   <title>Flask + MySQL Docker Example</title>\n 5   <style>* { font-family:\
  \ Helvetica, Arial, sans-serif }</style>\n 6 </head>\n 7 <body>\n 8   <h1>Flask\
  \ + MySQL Docker Example</h1>\n 9   <p>MySQL Connection: {{ result }}</p>\n 10 </body>\n\
  \ 11 </html>\n```\n\n在这种情况下，`.html` 模板包含一个 Jinja 变量 (`{{ result }}`），Flask 将将 MySQL\
  \ 连接的状态填充到变量中。\n\n现在我们已经定义了应用，我们需要构建一个容器来运行该应用。这里有一个 Dockerfile，它将安装所有依赖项，并将 Ansible\
  \ playbook 和应用本身复制到位置，以便我们可以通过 Ansible 执行更复杂的配置（例如带有变量替换的模板）：\n\n\n\n\n\n```docker\n\
  \ 1 # A simple Flask app container.\n 2 FROM geerlingguy/docker-ubuntu2004-ansible\n\
  \ 3 MAINTAINER Jeff Geerling <geerlingguy@mac.com>\n 4 \n 5 # Install Flask app\
  \ dependencies.\n 6 RUN apt-get update\n 7 RUN apt-get install -y libmysqlclient-dev\
  \ build-essential \\\n 8   python3-dev python3-pip\n 9 RUN pip3 install flask flask-sqlalchemy\
  \ mysqlclient\n10 \n 11 # Install playbook and run it.\n 12 COPY playbook.yml /etc/ansible/playbook.yml\n\
  \ 13 COPY index.py.j2 /etc/ansible/index.py.j2\n 14 COPY templates /etc/ansible/templates\n\
  \ 15 RUN mkdir -m 755 /opt/www\n 16 RUN ansible-playbook /etc/ansible/playbook.yml\
  \ --connection=local\n17 \n 18 EXPOSE 80\n```\n\n我们不会不再使用 Ansible 安装 `apt` 和 `pip`\
  \ 包，而是使用 `Dockerfile` 中的 `RUN` 命令来安装它们。这允许这些命令被 Docker 缓存。通常情况下，更复杂的包安装和配置在 Ansible\
  \ 内部更容易维护且更简单，但在包安装的情况下，让 Docker 缓存步骤使得未来的 `docker build` 命令只需几秒钟而不是几分钟，这对于 `Dockerfile`\
  \ 的冗长是值得的。\n\n在 `Dockerfile` 的末尾，我们运行了一个 playbook（它应该与 `Dockerfile` 位于同一目录），并暴露了\
  \ `80` 端口，以便外部可以通过 HTTP 访问该应用。接下来，我们将创建应用部署 playbook。\n\n为了让 Flask 应用能够正常运行，我们需要获取\
  \ `host_ip_address`，然后替换 `index.py.j2` 模板中的变量。在 `docker/provisioning/www/playbook.yml`\
  \ 创建 Flask 部署 playbook：\n\n```yaml\n 1 ---\n 2 - hosts: localhost\n 3   become:\
  \ true\n 4 \n 5   tasks:\n 6     - name: Get host IP address.\n 7       shell: \"\
  /sbin/ip route | awk '/default/ { print $3 }'\"\n 8       register: host_ip\n 9\
  \       changed_when: false\n10 \n 11     - name: Set host_ip_address variable.\n\
  \ 12       set_fact:\n 13         host_ip_address: \"{{ host_ip.stdout }}\"\n 14\
  \ \n 15     - name: Copy Flask app into place.\n 16       template:\n 17       \
  \  src: /etc/ansible/index.py.j2\n 18         dest: /opt/www/index.py\n 19     \
  \    mode: 0755\n20 \n 21     - name: Copy Flask templates into place.\n 22    \
  \   copy:\n 23         src: /etc/ansible/templates\n 24         dest: /opt/www\n\
  \ 25         mode: 0755\n```\n\n注册 `host_ip` 的 shell 命令是获取 IP 的简单方法，同时仍让 Docker\
  \ 进行其自身的虚拟网络管理。\n\n最后两个任务将 flask 应用和模板目录拷贝到指定位置。\n\n`docker/provisioning/www` 目录现在应该包含以下内容：\n\
  \n```\nwww/\n  templates/\n    index.html\n  Dockerfile\n  index.py.j2\n  playbook.yml\n\
  ```\n\n### MySQL 容器\n\n我们在本书中已经多次配置过 MySQL，所以不会花太多时间来讨论 MySQL 是设置的。相反，我们将深入研究 MySQL\
  \ 在 Docker 容器内部的工作原理，并使用之前配置的 `data` 容器的持久化数据卷。\n\n对于 MySQL，已经有一个维护良好且灵活的社区 MySQL\
  \ Docker 镜像可以让我们依靠。要使用它，我们将将其封装在自己的 `Dockerfile` 中（以防未来我们进行进一步的自定义）。\n\n```dockerfile\n\
  1 # A simple MySQL container.\n2 FROM mysql:5.7\n3 MAINTAINER Jeff Geerling <geerlingguy@mac.com>\n\
  4 \n5 EXPOSE 3306\n```\n\n这个 `Dockerfile` 告诉 Docker 从 Docker Hub 拉取 `mysql` 镜像，然后暴露\
  \ `3306` 端口。\n\n`docker/provisioning/db` 目录现在应该包含以下内容：\n\n```\ndb/\n  Dockerfile\n\
  ```\n\n### 发送吧！\n\n现在一切都就绪了，你应该能够 `cd` 进入主 `docker` 目录并运行 `vagrant up`。大约 10 分钟后，Vagrant\
  \ 应该显示 Ansible 准备成功，如果你在浏览器中访问 `http://192.168.56.39/`，你应该看到类似下面的内容：\n\n![Docker\
  \ orchestration success!](img/15-docker-success.png)\n\nDocker 编排成功！\n\n如果你看到“MySQL\
  \ Connection: PASS”，恭喜你，一切运行正常！如果它显示‘FAIL’，你可能需要给 MySQL 多一点时间来完成初始化，因为它在首次启动时必须构建环境。如果页面完全没有显示，你可能想将你的代码与\
  \ GitHub 上的 [Docker Flask 示例](https://github.com/geerlingguy/ansible-for-devops/tree/master/docker-flask)对比。\n\
  \n整个 [Docker Flask 示例](https://github.com/geerlingguy/ansible-for-devops/tree/master/docker)\
  \ 可以在 GitHub 上获取，如果你想克隆它。\n\n### 使用 Ansible 构建容器\n\n在上一个示例中，Ansible playbook 是在容器*内部*运行的。虽然这种方法行得通且具有维护性，但它产生了一些冗余。在容器内部使用\
  \ Ansible 需要很多依赖项——Python、Ansible 以及 Ansible 本身。\n\n解决此问题的方案是使用 [`ansible-bender`](https://github.com/ansible-community/ansible-bender)。\n\
  \n### 使用 `ansible_connection: docker` 构建 Hubot Slack 容器\n\n书中的大多数示例使用默认的 `ansible_connection`\
  \ 插件 `ssh`，它连接到服务器。少数示例也使用了 `local` 插件，它在本地运行。\n\n实际上有几十个 Ansible 自带的连接插件，包括用于与\
  \ Kubernetes pod 交互的 `kubectl`、用于连接 minions 的 `saltstack`、用于通过 Microsoft WinRM 连接的\
  \ `winrm` 以及 `docker`（后者在 Docker 容器中运行任务）。\n\n如果你想在不在容器内安装 Ansible 的情况下构建 Docker\
  \ 镜像，最后一个连接插件非常有帮助。\n\n为了学习 `docker` 连接插件如何工作，我们将构建一个 Hubot 机器人。\n\n#### Hubot 和\
  \ Slack\n\n提供一点背景，[Hubot](https://hubot.github.com) 是 GitHub 的一个开源聊天机器人，用 CoffeeScript\
  \ 编写，可以连接到许多不同的聊天系统。[Slack](https://slack.com) 是许多企业用于通信的热门聊天平台。许多团队从像 Hubot 这样的机器人中受益，因为它们可以在\
  \ Hubot 中存储数据以进行快速检索，甚至可以将 Hubot 连接到其他服务（如 CI 工具）并启动部署、检查基础设施健康以及其他有用操作。\n\n####\
  \ 使用 Ansible 构建 Docker 容器\n\n设置我们的机器人项目的第一步是创建一个新目录（例如 `docker-hubot`）和一个 Ansible\
  \ playbook，我们将其命名为 `main.yml`。\n\n你必须在运行此 playbook 的计算机上安装并运行 Docker，前几个设置步骤将使用\
  \ `connection: local` 来启动容器构建：\n\n```yaml\n 1 ---\n 2 - hosts: localhost\n 3   connection:\
  \ local\n 4   gather_facts: no\n 5 \n 6   vars:\n 7     base_image: node:14\n 8\
  \     container_name: hubot_slack\n 9     image_namespace: a4d\n10     image_name:\
  \ hubot-slack\n```\n\n还定义了一些变量，稍后将在 playbook 中使用它们来定义诸如使用的 Docker 基础镜像、我们要构建的容器名称以及最终生成的\
  \ Docker 镜像的命名空间和名称。我们不需要 `gather_facts`，因为我们不在本地连接上做太多事情。\n\n\n\n\n\n```yaml\n\
  pre_tasks:\n    - name: Make the latest version of the base image available locally.\n\
  \      docker_image:\n        name: '{{ base_image }}'\n        source: pull\n \
  \       force_source: true\n\n    - name: Create the Docker container.\n      docker_container:\n\
  \        image: '{{ base_image }}'\n        name: '{{ container_name }}'\n     \
  \   command: sleep infinity\n\n    - name: Add the newly created container to the\
  \ inventory.\n      add_host:\n        hostname: '{{ container_name }}'\n      \
  \  ansible_connection: docker\n```\n\n在 `pre_tasks` 区域，我们将设置 Docker 容器，以便我们可以在其中运行\
  \ Hubot：\n\n1.  `docker_image` 任务：拉取 `base_image`（Ansible 等同于 `docker pull`），并确保在\
  \ playbook 运行时始终存在最新版本。\n2.  `docker_container` 任务：从 `base_image` 创建 Docker 容器（Ansible\
  \ 等同于 `docker run`）。\n3.  `add_host` 任务：将刚刚创建的容器添加到 Ansible 清单（inventory）中。\n\n\
  现在我们已经有一个正在运行并位于清单中的容器，可以使用 `docker` 连接插件在内部进行构建。遵循我们之前在书中建立的最佳实践，我们将所有可重用的逻辑放在一个\
  \ Ansible 角色（role）中，我们稍后会创建它。现在，我们可以在 playbook 的 `roles` 部分中调用即将创建的角色：\n\n```yaml\n\
  roles:\n    - name: hubot-slack\n      delegate_to: '{{ container_name }}'\n```\n\
  \n注意 `delegate_to`。任何我们希望 Ansible 在 Docker 容器内部运行的任务、playbook 或角色都需要委托给该容器。\n\n\
  在构建 `hubot-slack` 角色之前，让我们完成容器镜像的构建过程以及主 playbook 的其余部分：\n\n```yaml\npost_tasks:\n\
  \    - name: Clean up the container.\n      shell: >\n        apt-get remove --purge\
  \ -y python &&\n        rm -rf /var/lib/apt/lists/*\n      delegate_to: '{{ container_name\
  \ }}'\n\n    - name: Commit the container.\n      command: >\n        docker commit\n\
  \        -c 'USER hubot'\n        -c 'WORKDIR \"/home/hubot\"'\n        -c 'CMD\
  \ [\"bin/hubot\", \"--adapter\", \"slack\"]'\n        -c 'VOLUME [\"/home/hubot/scripts\"\
  ]'\n        {{ container_name }} {{ image_namespace }}/{{ image_name }}:latest\n\
  \n    - name: Remove the container.\n      docker_container:\n        name: '{{\
  \ container_name }}'\n        state: absent\n```\n\n`post-tasks` 清理容器内部不必要的杂质（减小提交镜像的），将\
  \ Docker 容器提交为镜像（标记为 `a4d/hubot-slack:latest`），并删除运行中的容器。\n\n从 `Dockerfile` 构建时，你可以直接设置\
  \ `USER`（在容器中运行 `CMD` 或 `ENTRYPOINT` 的用户）和 `CMD`（执行容器的默认值）。在我们的情况下，由于我们不是从 `Dockerfile`\
  \ 构建，我们使用 `docker commit` 的 `-c` 或 `--change` 选项来设置这些选项。\n\n现在我们已经准备好了构建 Docker\
  \ 容器、从该容器提交镜像以及拆除容器的主骨架，是时候为我们的 playbook 添加“肉肉”了——安装 Hubot 及其 Slack 适配器的角色。\n\n\
  ### 构建 `hubot-slack` 角色\n\n与任何角色一样，构建必要文件脚的最简单方法是使用 `ansible-galaxy` 命令。在 `roles`\
  \ 子目录中创建一个 `hubot-slack` 角色，如下：\n\n```bash\nansible-galaxy role init hubot-slack\n\
  ```\n\n你可以删除一些不需要的角色目录，即 `files`、`handlers`、`templates`、`tests` 和 `vars`。如果你需要，可以填充\
  \ `meta/main.yml` 内部的元数据字段（只有当你要在 Ansible Galaxy 上发布角色，或者需要将其他角色定义为依赖项时才需要）。\n\n\
  由于安装 Hubot 并不困难，我们可以在 `tasks/main.yml` 中完成所有需要的工作。我们需要做的第一件事是确保生成机器人所需的所有依赖项都存在：\n\
  \n```yaml\n---\n- name: Install dependencies.\n  package:\n    name: sudo\n    state:\
  \ present\n\n- name: Install required Node.js packages.\n  npm:\n    name: \"{{\
  \ item }}\"\n    state: present\n    global: yes\n  with_items:\n    - yo\n    -\
  \ generator-hubot\n```\n\n因为我们以后想要以 `hubot` 用户身份运行某些命令，我们需要存在 `sudo`，以便 Ansible\
  \ 可以 `become` `hubot` 用户。然后我们将安装一些所需的依赖——`yo` 和 `generator-hubot`，它们用于构建机器人。Node.js\
  \ 已经存在于容器内部，因为我们选择了基于 `node:14` 镜像构建容器。\n\n```yaml\n- name: Ensure hubot user exists.\n\
  \  user:\n    name: hubot\n    create_home: yes\n    home: \"{{ hubot_home }}\"\n\
  ```\n\n最好在隔离的目录中使用专用的用户账户运行 Hubot，因此我们设置了一个带有自己的主目录的 `hubot` 用户账户。为了让 Hubot 角色更易适配，使用变量来设置\
  \ `hubot` 用户的主目录。我们稍后会在 `defaults/main.yml` 中定义它。\n\n```yaml\n- name: Generate hubot.\n\
  \  command: >\n    yo hubot\n    --owner=\"{{ hubot_owner }}\"\n    --name=\"{{\
  \ hubot_name }}\"\n    --description=\"{{ hubot_description }}\"\n    --adapter=slack\n\
  \    --defaults\n  chdir={{ hubot_home }}\n  become: yes\n  become_user: hubot\n\
  ```\n\n`yo hubot` 命令生成了运行 Hubot 所需的代码，传递给生成器的选项使其非交互式运行。我们将在 `defaults/main.yml`\
  \ 中定义这些。\n\n```yaml\n- name: Remove certain scripts from external-scripts.json.\n\
  \  lineinfile:\n    path: \"{{ hubot_home }}/external-scripts.json\"\n    regexp:\
  \ \"{{ item }}\"\n    state: absent\n  with_items:\n    - redis\n    - heroku\n\
  ```\n\n有一些清理任务确保 Hubot 正常运行。在 `lineinfile` 任务中，删除了 Redis 连接插件和 Heroku 支持，因为它们不需要。此外，删除了未使用的\
  \ `hubot-scripts.json` 文件以防止 Hubot 启动时出错。\n\n```yaml\n- name: Remove the hubot-scripts.json\
  \ file.\n  file:\n    path: \"{{ hubot_home }}/hubot-scripts.json\"\n    state:\
  \ absent\n```\n\n创建 `hubot-slack` 角色的最后一步是为角色中使用的变量添加默认值，因此在 `defaults/main.yml`\
  \ 中放入以下：\n\n```yaml\n---\nhubot_home: /home/hubot\nhubot_owner: Ansible for DevOps\n\
  hubot_name: a4dbot\nhubot_description: Ansible for DevOps test bot.\n```\n\n###\
  \ 构建并运行 Hubot Slack 容器\n\n现在你应该有一个包含 `main.yml` Ansible playbook 和 `roles` 目录下的\
  \ `hubot-slack` 角色的目录。要构建容器，请确保 Docker 正在运行，并执行：\n\n```bash\nansible-playbook main.yml\n\
  ```\n\n playbook 完成完成后，运行 `docker images` 验证 `a4d/hubot-slack` 镜像已创建：\n\n```bash\n\
  $ docker images\nREPOSITORY          TAG                 IMAGE ID            SIZE\n\
  a4d/hubot-slack     latest              142db74437da        804MB\nnode        \
  \        8                   55791187f71c        673MB\n```\n\n在运行新容器实例并让机器人进入 Slack\
  \ 频道之前，你必须从 Slack 获取 API 令牌。遵循 Slack 指南 [Slack Developer Kit for Hubot](https://slackapi.github.io/hubot-slack/)\
  \ 并获取 API 令牌。\n\n然后运行以下命令运行连接到你 Slack 频道的 Hubot 实例（将 `TOKEN` 替换为机器人的 Slack API 令牌）：\n\
  \n```bash\ndocker run -d --name hubot -e HUBOT_SLACK_TOKEN=TOKEN a4d/hubot-slack\n\
  ```\n\n\n\n\n容器应该已经启动，你应该会在你的 Slack 团队中看到一个新的活动成员！在 Slack 中，你可以将机器人邀请到频道、直接对话等（通过向机器人发送\
  \ `help` 消息来获取所有可用命令）。\n\n如果发生错误，请使用 `docker logs hubot` 来查找发生了什么。\n\n当你玩玩完 Hubot\
  \ 后，可以使用 `docker rm -f hubot` 杀死并删除容器。\n\n### 总结\n\n你可以使用 Ansible 以许多不同的方式构建容器，这取决于你想要如何构建容器构建流水线。使用带有\
  \ `docker` 连接插件的 Ansible 允许你将 Docker 容器视为你集群中的任何其他服务器。\n\n基于 Ansible 的容器构建流水线的某些部分可能需要更详细的描述，但最终，你可以像处理虚拟机和裸金属服务器一样使用相同的\
  \ Ansible 角色来处理 Docker 容器，使得你的整个基础设施维护变得更容易。你不再需要使用 Ansible playbooks 维护旧服务器、使用\
  \ Dockerfiles 维护 Docker 容器，用 Ansible 就能完成一切！\n\n整个 [Docker Hubot Slack 机器人示例](https://github.com/geerlingguy/ansible-for-devops/tree/master/docker-hubot)\
  \ 可以在 GitHub 上找到，如果你想克隆它并在本地尝试的话。\n\n### 总结\n\n这里显示的示例仅仅接触了 Docker（以及一般的基于容器的应用部署）成为一种迷人且实用的应用部署工具的边缘。Docker\
  \ 和其他基于容器的工具仍处于婴儿阶段，因此有几十种方法来管理容器的构建、运行和链接。Ansible 是管理整个基于容器的应用生命周期（以及运行其的基础设施）的有力竞争者。\n\
  \n```\n _________________________________________\n/ Any sufficiently advanced technology\
