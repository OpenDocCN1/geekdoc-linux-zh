  \            Size  Used Avail Use% Mounted on\n/dev/mapper/rl-root      19G 1014M\
  \   18G   6% /\ndevtmpfs                 111M 0  111M   0% /dev\ntmpfs         \
  \           120M 0  120M   0% /dev/shm\ntmpfs                    120M 4.3M  115M\
  \   4% /run\ntmpfs                    120M 0  120M   0% /sys/fs/cgroup\n/dev/sda1\
