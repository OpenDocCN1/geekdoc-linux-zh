  \n\nEPUB 版本的 ISBN：978-0-9863934-3-3\n\n本书献给我的妻子 Natalie 和我的孩子们。\n\n编辑：Margie Newman\
  \ 和 Katherine Geerling。\n\n\nAnsible 是根据 GNU GPLv3 开源许可证分发的软件产品。\n\n\n## 前言\n\n\
  在过去的几年里，Ansible 迅速成为全球最流行的 IT 自动化工具之一。我们看到开源社区从 2012 年初项目启动到今天的超过 1200 名个人贡献者。Ansible\
  \ 的模块化架构以及对各种自动化和编排问题的广泛适用性，为全球数十万用户创造了完美的契机。\n\nAnsible 是一个通用的 IT 自动化平台，可多种用途。从配置管理：在你的基础设施中强制执行声明状态，到过程化的应用部署，再对复杂的相互连接系统进行多组件、多系统的编排。它是无代理的（agentless），因此可以与旧工具共存，并且易于安装、配置和维护。\n\
  \nAnsible 起于 2012 年，项目创始人 Michael DeHaan 从他之前编写的几个工具中获得灵感，并结合当时配置管理状态的实践经验，于 2012\
  \ 年 2 月启动了该项目。Ansible 的一些独特属性，如基于模块的架构和无代理方法，迅速吸引了开源世界的关注。\n\n2013 年，Said Ziouani、Michael\
  \ DeHaan 和我创立了 Ansible, Inc.。我们希望利用 Ansible 在开源世界日益增长的采用率，并创建产品来填补我们所看到的 IT 自动化领域的空白。现有的工具既复杂、易错且难以学习。Ansible\
  \ 为 IT 组织中的用户提供了进入自动化的低门槛，并且可以增量地部署，根据团队需要解决尽可能少或尽可能的问题，而无需对方法论进行巨大转变。\n\n本书关于如何在\
  \ DevOps 环境中使用 Ansible。我不会尝试定义什么是 DevOps 或不是 DevOps，或者谁在做或谁在做。我对这个理念的个人理解是，DevOps\
  \ 旨在缩小编写代码的开发者与运行程序的运维人员之间的距离。现在，我不认为在现有的开发和运维团队之间增加一个新的“DevOps”团队就能实现这一目标！（噢，现在我又在尝试下定义了，不是吗？）\n\
  \n好了，抛开定义不谈，迈向 DevOps 环境的第一步之一是选择一种开发者和运维工程师都能使用的工具。Ansible 就是这些工具之一：你不需要成为软件开发者就可以使用它，而且你编写的剧本（playbooks）可以轻松实现自文档化。人们曾尝试过“编写一次，到处运行”的应用开发和部署模型，但我认为\
  \ Ansible 最接近提供了一种跨团队、跨云端和不同数据中心通用的通用语言。\n\n本书作者 Jeff 是 Ansible 的长期支持者、贡献者和倡导者，他在\
  \ Galaxy（由 Ansible, Inc. 维护的公共角色共享服务）中维护了大量且令人印象深刻的 Ansible 角色集合。Jeff 在职业生涯中广泛使用了\
  \ Ansible，完全有资格编写本关于在 DevOps 环境中使用 Ansible 的端到端书籍。\n\n当你阅读这本书时，我希望你像我们一样享受这段 IT\
  \ 自动化的之旅。祝你健康，工作顺利，并让一切自动化。\n\nTim Gerla, Ansible, Inc. 联合创始人兼首席技术官\n\n## 前言\n\n\
  在成长过程中，我接触到了许多孩子从未接触过的网络。当我开始上高中时，随着构建一个小型网络，我对基础设施的热兴趣随之增长。在过去的十年里，我从手动启动和配置物理及虚拟服务器，到使用复杂的\
  \ shell 脚本进行配置，再到使用配置管理工具管理数千台服务器。\n\n当我开始将基础设施代码（IaC）时，一些用于测试、配置和管理服务器的优秀工具仍处于婴儿阶段，但它们现在已成熟为功能齐全、健壮的工具。Vagrant\
  \ 是管理虚拟机的优秀工具，可以在本地（或云端）模拟真实的基础设施；而 Ansible —— 本书的主题 —— 是配置服务器、管理配置和部署应用的优秀工具，即使在我的工作站上也是！\n\
  \n这些工具仍在快速改进，我对未来充满期待。我投入时间良好学习新工具将对未来几年大有裨益。在这些页面中，我将与你分享关于 Ansible 的所有知识：我最喜爱的服务器配置、管理和应用部署工具。我希望你阅读这本书就像我写它一样喜欢！\n\
  \n— Jeff Geerling, 2015\n\n### 第二版\n\n自 2015 年发布 1.0 版本以来，我对本书进行了 23 次重大修订。在 2019\
  \ 年和 2020 年，为了反映 Ansible 架构的这些而进行了重大重写（并增加了三个新章节），我决定将新内容出版为第二版。\n\n未来我将继续发布修订，以确保本书尽可能具有时效性！请访问书籍网站\
  \ www.ansiblefordevops.com 获取最新更新，或订阅以获取 Ansible 和书籍新闻！\n\n— Jeff Geerling, 2020\n\
  \n### 这本书是写给谁的？\n\n和我合作的许多开发者和系统管理员中等擅长通过 SSH 管理 Linux 服务器，并管理着 1 到 100 台服务器（无论是裸机、虚拟化还是使用容器的）。\n\
  \n这些人中的一些人对配置管理工具有一点经验（通常是使用 `Puppet` 或 `Chef`），并可能具有使用 `Jenkins`、`Capistrano` 或\
  \ `Fabric` 等工具进行部署和持续集成的少量经验。我写这本书是为了这些朋友，我认为他们代表了大多数听说过并/开始使用 Ansible 的人。\n\n\n\
  \n\n\n如果你对开发和运维都感兴趣，并且至少对通过命令行管理服务器有基本的了解，那么这本书将为你提供对 Ansible 的中级到专家级的理解，并教你如何使用它来管理你的基础设施。\n\
  \n## 排版规范\n\nAnsible 使用简单的语法（`YAML`）和简单的命令行工具（使用常用的 POSIX 规范）来实现其所有强大的功能。代码示例和命令将贯穿本书，以内联形式（例如：`ansible\
  \ [command]`）或代码块形式（带或不带行号）高亮，如下所示：\n\n```\n1 ---\n2 # 这是一个 YAML 文件的开始。\n```\n\n\
  某些 `YAML` 行和其他代码示例的每行超过了 70 个字符，导致代码换行到新行。代码换行通过代码行末尾的 `\\` 来指示。例如：\n\n```\n1 #\
  \ 这行代码由于 URL 过长而换行。\n2 wget http://www.example.com/really/really/really/long/path/in/the/url/c\\\
  \n3 auses/the/line/to/wrap\n```\n\n在使用这些代码时，不要复制 `\\` 字符，并确保在带有尾随 `\\` 的第一行与下一行之间不要换行符。\n\
  \n相关资源和网站的链接以内联形式添加，如下指向 [Ansible](https://www.ansible.com/) 的链接，在电子书格式中直接点击它们即可查看，或者通过脚注中的\
  \ URL 访问。\n\n有时，会添加旁注来突出关于特定主题的进一步信息：\n\n在显示终端会话中运行的命令时，如果命令是在你的普通/非 root 用户账户下运行，命令将以美元符号（`$`）开头。如果命令是以\
  \ root 用户运行，它们将以井号（`#`）开头。\n\n## 请帮助改进这本书！\n\n这本书的新修订版本定期发布（请参下方的当前书籍出版统计）。如果你认为某个章节需要改进或发现遗漏的内容，请在\
  \ [Ansible for DevOps issue 队列](https://github.com/geerlingguy/ansible-for-devops/issues)（在\
  \ GitHub 上）提交 issue，或通过 Twitter 与我联系（[@geerlingguy](https://twitter.com/geerlingguy)）。\n\
  \nAnsible for DevOps 的所有已知问题将汇总在书籍的在线 [错误列表](https://www.ansiblefordevops.com/errata)\
  \ 页面上。\n\n### 当前出版书籍版本信息\n\n- **当前书籍版本**：2.2\n- **截至上次出版的当前 Ansible 版本**：8.0.0 (core\
  \ 2.15.0)\n- **截至上次出版的日期**：2023 年 6 月 17 日\n\n## 关于作者\n\nJeff Geerling 是一位开发者，曾在拥有服务器数量从一台到数千台不等的公司从事过编程和可靠性工程工作。他还为\
  \ Midwestern Mac, LLC 提供的服务管理许多虚拟服务器，并从 2013 年初开始一直使用 Ansible 管理基础设施。\n\n## 引言\n\
  \n### 起初，是系统管理员\n\n自从网络计算开始，可靠且高效地部署和管理服务器一直是一个挑战。在历史上，系统管理员与他们所管理的系统交互的开发者和用户是隔离开的，他们通过手动管理服务器、安装软件、更改配置以及在单台服务器上管理服务。\n\
  \n随着数据中心的不断扩大，托管应用程序变得越来越复杂，管理员意识到他们扩展手动管理系统的速度跟不上他们所提供的应用程序的速度。这就是为什么服务器供应和配置管理工具开始兴起的原因。\n\
  \n服务器虚拟化将大规模基础设施管理推向了台，一个管理员（或一个小型管理员团队）管理的服务器数量增加了一个数量级。管理员现在不再需要手动部署、补丁和销毁每台服务器，而是自动或通过极少干预启动新服务器。大规模\
  \ IT 部署现在可能涉及数百或数千台服务器；在许多最大的环境中，服务器供应、配置和退役都是完全自动化的。\n\n### 现代基础设施管理\n\n随着运行应用程序的系统成为其软件日益复杂且不可的一部分，应用程序开发者本身也开始与运维人员进行深度整合。在许多公司中，开发和运维已经整合。事实上，这种整合是现代测试驱动应用程序设计的要求。\n\
  \n作为一名职业软件开发者和被迫的系统管理员，我见证了结合开发和运维的力量——现在通常被称为 DevOps 或站点可靠性工程（SRE）。当开发者开始将基础设施视为*他们应用程序的一部分*时，稳定性和性能就成了常态。当系统管理员（他们大多数人对管理的服务器上使用的应用程序和语言具有中高级知识）与开发者紧密合作时，开发速度会提高，会有更多时间花在性能调优、实验和完成任务等“有趣”的活动上，而不是花更多时间在灭火上。\n\
  \n### Ansible 与红帽\n\nAnsible 由 Michael DeHaan 于 2012 年发布（Twitter 上 [@laserllama](https://twitter.com/laserllama)），他是一位多年来一直以各种形式从事配置管理和基础设施编排的开发者。通过他在\
  \ Puppet Labs 和红帽的工作（在在那里他参与了 [Cobbler](http://cobbler.github.io/)，一个配置管理工具；`Func`，一个向远程服务器发送命令的工具；以及[其他项目](https://www.ansible.com/blog/2013/12/08/the-origins-of-ansible)），他经历了许多不同组织和个人系统管理员在简化和自动化其基础设施管理道路上经历的各种艰辛。\n\
  \n此外，Michael 发现[许多商店使用不同的工具](http://highabilityscale.com/blog/2012/4/18/ansible-a-simple-model-driven-configuration-management-and-c.html)来进行配置管理（Puppet,\
  \ Chef, cfengine）、服务器部署（Capistrano, Fabric）和即时任务执行（`Func`, 原生 SSH），并想是否有更好的方法。Ansible\
  \ 将所有这些功能封装在一个工具中，并以一种实际上简单一致的方式实现！\n\nAnsible 的目标是做到：\n\n1. **清晰**：Ansible 使用简单的语法（`YAML`），让任何人（开发者、系统管理员、经理）都能于理解。API\
  \ 简单且合理。\n2. **快速**：学习快、配置快——特别是考虑到你不需要在所有服务器上安装额外的代理或守护进程！\n3. **完整**：Ansible 在一个工具中完成了三件事，并且完成得非常好。Ansible\
  \ 的“内置即用”方法意味着你在一个完整的包中拥有所需的一切。\n4. **高效**：服务器上没有额外软件为应用程序留了更多资源。此外，由于 Ansible 模块通过\
  \ `JSON` 工作，因此 Ansible 可以用熟悉的编程语言编写模块进行扩展。\n5. **安全**：Ansible 使用 `SSH`，不需要在你的服务器上开启额外的端口或存在漏洞的守护进程。\n\
  \nAnsible 还有其幽默的一面，赋予了项目一些个性。例如，Ansible 的主要版本以齐齐飞乐队的歌曲命名（例如，2.0 版本以 1973 年的《Over\
  \ the Hills and Far Away》命名，1.x 版本以范哈伦乐队的歌曲命名）。此外，Ansible 还会使用 `cowsay`（如果已安装）将输出包裹在\
  \ ASCII 奶牛的对话框中（这种行为可以通过 Ansible 的配置禁用）。\n\n\n\n\n\n[Ansible, Inc.](https://www.ansible.com/)\
  \ 由 Saïd Ziouani（Twitter 上的 [@SaidZiouani](https://twitter.com/SaidZiouani)）、Michael\
  \ DeHaan 和 Tim Gerla 创立，并于 2015 年被红帽收购。Ansible 团队负责 Ansible 的核心开发，并为 Ansible 的组织提供服务（如\
  \ [Ansible Consulting](https://www.ansible.com/products/consulting)）和额外工具（如 [Ansible\
  \ Tower](https://www.ansible.com/tower)）。数百名独立开发者曾为 Ansible 贡献过补丁，且 Ansible 是 GitHub\
  \ 上星标数最多的基础设施管理工具（截至本文撰写时已有超过 33,000 Star）。\n\n2015 年 10 月，红帽收购了 Ansible, Inc. 并证明了自己是\
  \ Ansible 良好的管理者和推广者。我没有看到迹象表明这一点在未来会改变。\n\n## Ansible 示例\n\n书中包含了许多 Ansible 示例（剧本、角色、基础设施、配置等）。大多数示例位于\
  \ [Ansible for DevOps GitHub 仓库](https://github.com/geerlingguy/ansible-for-devops)，因此你可以在阅读书籍时浏览其最终状态的代码。某些行号可能与书中的内容不`完全`一致（尤其是当你阅读该书的旧版本时！），但我将尽力保持内容随时间同步。\n\
  \n## 其他资源\n\n在本书中，我们将探索使用 Ansible 配置和管理你基础设施的各个方面，但丰富的文档和社区互动是 Ansible 优秀的不可替代因素。请查看下方链接以获取更多关于\
  \ Ansible 的并发现社区：\n\n*   [Ansible 文档](https://docs.ansible.com/ansible/) - 深度涵盖所有\
  \ Ansible 选项。很少有开源项目的文档像这样清晰详尽。\n*   [Ansible 术语表](https://docs.ansible.com/ansible/latest/reference_appendices/glossary.html)\
  \ - 如果书中某个术语你似乎没有完全理解，请查阅术语表。\n*   [The Bullhorn](https://us19.campaign-archive.com/home/?u=56d874e027110e35dea0e03c1&id=d6635f5420)\
  \ - Ansible 官方新闻邮件。\n*   [Ansible 邮件列表](https://groups.google.com/forum/#!forum/ansible-project)\
  \ - 通过此 Google 小组与 Ansible 社区讨论 Ansible 并提交问题。\n*   [GitHub 上的 Ansible](https://github.com/ansible/ansible)\
  \ - Ansible 官方代码仓库，魔法发生的地方。\n*   [GitHub  Ansible 示例剧本](https://github.com/ansible/ansible-examples)\
  \ - 许多常用服务器配置的示例。\n*   [开始使用 Ansible](https://www.ansible.com/resources/get-started)\
  \ - Ansible 社区和资源的简单指南。\n*   [Ansible 博客](https://www.ansible.com/blog)\n\n# 第 1\
  \ 章 - 开始使用 Ansible\n\n## Ansible 与基础设施管理\n\n### 关于花花服务器和 shell 脚本\n\n许多开发者和系统管理员通过\
  \ `SSH` 登录服务器、进行更改并退出来管理服务器。这些更改中有些会被记录，有些则不会。如果管理员需要对许多服务器进行相同的更改（例如更改配置文件中的一个值），管理员将手动登录`每台`服务器并反复执行此更改。\n\
  \n如果服务器在整个生命周期内只有一两个更改，且如果`服务器极其简单（只运行一个进程，一个配置，以及一个非常简单的防火墙），并且`如果每个更改都经过了详尽记录，那么这个过程就不会成为问题。\n\
  \n但对于存在的几乎每家公司来说，服务器都更加复杂——大多数服务器运行着几十个有时是数百个不同的应用程序或应用程序容器。大多数服务器都有复杂的防火墙和几十个经过调整的配置文件。即使有更改记录，手动过程通常也会导致遗漏某些服务器或某些步骤。\n\
  \n如果这些公司的管理员想要建立一台与当前运行的服务器`完全`一样的新服务器，他们将花费大量时间检查所有已安装的包，记录配置、版本和设置；他们将花费大量不必要的时间手动重新安装、更新和调优一切，以使新服务器的运行情况尽可能接近旧服务器。\n\
  \n某些管理员可能会使用 shell 脚本来尝试达到某种理智，但我尚未见过任何复杂的 shell 脚本可以在同步多台服务器配置并部署新代码的同时，正确处理所有边缘情况。\n\
  \n### 配置管理\n\n你来说很幸运，有工具可以帮助你避免拥有这些`雪花服务器`——那些配置独特、由于是手动配置且没有记录而无法从头重新创建的服务器。像 [CFEngine](http://cfengine.com/)、[Puppet](http://puppetlabs.com/)\
  \ 和 [Chef](http://www.getchef.com/chef/) 这样的工具在 2000 年中后期非常流行。\n\n但许多开发者和系统管理员坚持使用\
  \ shell 脚本和命令行是有原因的：它们简单易用，而且他们拥有多年使用 bash 和命令行工具的经验。为什么要把这一切抛诸窗外去学习新的配置语言呢？\n\n\
  Ansible 诞生了。Ansible 由熟悉命令行的开发者和系统管理员构建（并持续改进），他们希望有一种工具能帮助他们像过去那样管理服务器，但是采用一种可重复且集中管理的方式。Ansible\
  \ 伟大的优势之一是它能够原封不动地运行常规 shell 命令，因此你可以根据时间允许，获取现有的脚本并着手将其转换为剧本（playbooks）工作。对于那些习惯于命令行、但从未精通如\
  \ Puppet 或 Chef 等复杂工具的人（这两者至少都需要`略微`理解 Ruby 和/或自定义语言才能上手）来说，Ansible 简直是一股清风。\n\n\
  Ansible 的工作原理是将更改推送到你所有的服务器（默认情况下），与其它配置管理工具不同，它不需要在服务器上安装额外的软件（因此没有额外的内存占用，也没有需要管理的额外守护进程）。\n\
  \n### 安装 Ansible\n\nAnsible 唯一真正的依赖是 Python。一旦安装了 Python，运行 Ansible 最简单的方法是使用 `pip`，它是一个简单的\
  \ Python 包管理器。\n\n**如果你在 Mac 上**，安装 Ansible 是轻而易举：\n\n1.  检查 `pip` 是否已安装 (`which\
  \ pip`)）。如果没有，安装它：`sudo easy_install pip`\n2.  安装 Ansible：`pip install ansible`\n\
  \n你也可以通过 [Homebrew](http://brew.sh/) 使用 `brew install ansible` 安装。无论使用哪种方式 都可以，但请确保使用与安装时相同的系统来更新\
  \ Ansible！\n\n**如果你在 Windows 上运行**，设置所有内容需要一些额外工作。通常，人们在 Windows 的 Linux 子系统 (WSL)\
  \ 中运行 Ansible。关于在 WSL 下设置 Ansible 的详细说明，请参阅 附录 A - 在 Windows 工作站上使用 Ansible。\n\n\
  **如果你在 Linux 上运行**，你可能已经安装了 Ansible 的依赖项，但我们将涵盖最常见的安装方法。\n\n\n\n\n\n如果你已经安装了 `python-pip`\
  \ 和 `python-devel`（Debian/Ubuntu 上为 `python-dev`），请使用 `pip` 安装 Ansible（这假设你已经安装了“开发工具”包，因此可以使用\
  \ `gcc`、`make` 等工具）：\n\n```\n$ pip install ansible\n```\n\n使用 `pip` 允许你通过 `pip install\
  \ --upgrade ansible` 来升级 Ansible。\n\n## Fedora/Red Hat Enterprise Linux/CentOS\n\
  \n在类 Fedora 系统上安装 Ansible 最简单的方法是使用官方的 `dnf` 包。如果你运行的是 Red Hat Enterprise Linux\
  \ (RHEL) 或 CentOS/Rocky/Alma Linux，你需要在安装 Ansible 之前安装 EPEL 的 RPM（请参见下方的说明部分）：\n\
  \n```\n$ dnf -y install ansible\n```\n\n## Debian/Ubuntu\n\n在 Debian 或 Ubuntu 系统上安装\
  \ Ansible 最简单的方法是使用官方的 `apt` 包。\n\n```\n$ sudo apt-add-repository -y ppa:ansible/ansible\n\
  $ sudo apt-get update\n$ sudo apt-get install -y ansible\n```\n\n**一旦安装了 Ansible**，请确保在命令行中输入\
  \ `ansible --version` 来检查其运行是否正常。你应该能看到当前安装的版本信息：\n\n```\n$ ansible --version\n\
  ansible [core 2.14.6]\n  ...\n  python version = 3.10.11\n  jinja version = 3.1.2\n\
  \  libyaml = True\n```\n\n### 创建基础清单文件\n\nAnsible 使用清单文件（本质上是服务器列表）与你的服务器进行通信。就像将\
  \ IP 地址映射到域名的 hosts 文件（位于 `/etc/hosts`）一样，Ansible 清单将服务器（IP 地址或域名）映射到组。清单文件可以实现更多功能，但目前我们只需创建一个包含一台服务器的简单文件。在测试项目文件夹中创建一个名为\
  \ `hosts.ini` 的文件：\n\n```\n$ mkdir test-project\n$ cd test-project\n$ touch hosts.ini\n\
  ```\n\n使用 `nano`、`vim` 或任何你喜欢的编辑此 hosts 文件。将以下内容放入文件：\n\n```\n1 [example]\n2 www.example.com\n\
  ```\n\n… `example` 是你管理的服务器组，`www.example.com` 是该组中服务器的域名（或 IP 地址）。如果你没有在该服务器上使用\
  \ 22 端口进行 SSH，你需要将其添加到地址，例如 `www.example.com:2222`，因为 Ansible 默认使用 22 端口，不会从你的 `ssh`\
  \ 配置文件中获取此值。\n\n### 运行你的第一个即时 Ansible 命令\n\n现在你已经安装了 Ansible 并创建了清单文件，是时候运行命令检查一切是否工作正常了！在终端中输入以下内容（我们将执行一些安全的操作，不会在服务器上做任何更改）：\n\
  \n```\n$ ansible -i hosts.ini example -m ping -u [username]\n```\n\n… `[username]`\
  \ 是你用于登录服务器的用户。如果一切运行正常，你应该会看到一条显示 `www.example.com | SUCCESS >>` 的消息，然后是你的 ping\
  \ 结果。如果没有成功，请在命令末尾加上 `-vvvv` 重新运行以查看详细输出。很有可能是你的 SSH 密钥配置不对——如果你通过 `ssh username@www.example.com`\
  \ 登录并成功，那么上面的 Ansible 命令也应该可以工作。\n\n让我们运行一个更有用的命令：\n\n```\n$ ansible -i hosts.ini\
  \ example -a \"free -h\" -u [username]\n```\n\n在这个示例中，我们可以快速看到 `example` 组中所有服务器（目前只有一台）的内存使用情况（人类可读格式）。这类命令对于快速查找超出正常范围值的服务器非常有帮助。我经常使用像\
  \ `free -h`（查看内存统计）、`df -h`（查看磁盘使用统计）等命令来确保我的服务器没有哪一台在运行异常。虽然在像 [Nagios](http://www.nagios.org/)、[Munin](http://munin-monitoring.org/)\
  \ 或 [Cacti](http://www.cacti.net/) 等外部工具中跟踪这些细节是件好事，但通过一个简单的命令和一个终端窗口检查你所有服务器的这些统计数据也是很棒的！\n\
  \n### 总结\n\n就是这样！你刚刚学习了配置管理和 Ansible，安装了它，告诉了它关于服务器的信息，并通过 Ansible 在那台服务器上运行了几个命令。如果你还没有感到震撼，那没关系——你看到的只是冰山的*一角*。\n\
  \n```\n _______________________________________\n/ A doctor can bury his mistakes\
  \ but an \\\n| architect can only advise his clients |\n\\ to plant vines. (Frank\
  \ Lloyd Wright)  /\n ---------------------------------------\n        \\   ^__^\n\
  \         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w\
  \ |\n                ||     ||\n```\n\n## 第 2 章 - 本地基础设施开发：Ansible 和 Vagrant\n\n\
  ### 使用本地虚拟机进行原型设计和测试\n\nAnsible 可以很好连接到任何服务器——无论是远程还是本地。为了更快地测试和开发 Ansible playbooks，以及进行常规测试，在本地工作是一个非常好的主意。在本地进行基础设施的开发和测试比在远程/实时机器上更安全、更快——特别是在生产环境中！\n\
  \n过去十年，虚拟化工具的发展，它们在 Mac、Linux 或 Windows 上都能提供灵活强大的基础设施。[Vagrant](https://www.vagrantup.com)（服务器供应工具）和\
  \ [VirtualBox](https://www.virtualbox.org/)（虚拟化环境）是测试的强大组合。我们将设置 Vagrant 和 VirtualBox\
  \ 以便使用 Ansible 进行测试。\n\n### 你的第一台本地服务器：设置 Vagrant\n\n要开始你的第一台本地服务器，你需要下载并安装 Vagrant\
  \ 和 VirtualBox，并设置一个简单的 Vagrantfile，该文件将描述虚拟服务器。\n\n1. 下载并安装 Vagrant 和 VirtualBox（适合你操作系统的版本）：[下载\
  \ Vagrant](https://www.vagrantup.com/downloads.html) [下载 VirtualBox](https://www.virtualbox.org/)（安装时，确保安装了命令行工具，以便\
  \ Vagrant 能够与之工作）\n2. 在硬盘上的某处创建一个新文件夹，存放你的 Vagrantfile 和说明。\n3. 打开终端或 PowerShell\
  \ 窗口，然后进入你刚刚创建的文件夹。\n4. 使用 `vagrant box add` https://www.vagrantup.com/docs/boxes.html\
  \ 命令添加一个 Rocky Linux 8.x 64 位“box”：`vagrant box add geerlingguy/rockylux8`（注意：HashiCorp\
  \ 的 [Vagrant Cloud](https://app.vagrantup.com/boxes/search) 包含了各种预制 Linux box 列表。此外，请查看\
  \ Vagrant [文档文档](https://www.vagrantup.com/docs/boxes.html) 中的官方 Vagrant Ubuntu\
  \ box）。\n5. 使用你刚刚下载的 box 创建默认虚拟服务器配置：`vagrant init geerlingguy/rockylux8`\n6. 启动你的\
  \ Rocky Linux 服务器：`vagrant up`\n\nVagrant 下载了一个预构建的 64 位 Rocky Linux 8 虚拟机镜像（如果你愿意，你可以[构建自己的](https://www.vagrantup.com/docs/providers/virtualbox/boxes.html）虚拟机“box”），根据默认\
  \ Vagrantfile 的配置将其加载到 VirtualBox 中（现在位于你之前创建的文件夹中），并启动虚拟机。\n\n管理这台虚拟机非常简单：`vagrant\
  \ halt` 会关闭虚拟机，`vagrant up` 会重新启动，`vagrant destroy` 会完全从 VirtualBox 中删除该机器。再次简单的\
  \ `vagrant up` 就会从你最初下载的原始 box 重新创建它。\n\n\n\n\n\n现在你已经有了一个运行中的服务器，你可以像使用任何其他服务器一样使用它，并通过\
  \ SSH 进行连接。要建立连接，请在 `Vagrantfile` 所在的文件夹输入 `vagrant ssh`。如果你想手动连接或从另一个应用程序连接，请输入\
  \ `vagrant ssh-config` 获取所需的 SSH 详情。\n\n## 在 Vagrant 中使用 Ansible\n\nVagrant 启动预配置镜像（boxes）的能力本身就已经非常方便，但你也可以通过\
  \ VirtualBox（或 VMWare、Parallels）的 GUI 以相同的效率完成类似的工作。Vagrant 还有一些“绝技”：\n\n*   [网络接口管理](https://www.vagrantup.com/docs/networking)：你可以将端口转发到虚拟机，共享公共网络连接，或使用私有网络进行虚拟机之间以及与主机的通信。\n\
  *   [共享文件夹管理](https://www.vagrantup.com/docs/synced-folders)：Vagrant 使用 NFS 或 VirtualBox\
  \ 中（速度慢得多的）原生文件夹共享在你的宿主机和虚拟机之间建立共享。\n*   [多机器管理](https://www.vagrantup.com/docs/multi-machine)：Vagrant\
  \ 能够在一个 `Vagrantfile` 中配置和控制多个虚拟机。这非常重要，正如文档所说：“历史上，运行复杂环境是将它们扁平化到单台机器上。这样做的问题是，它对生产环境的建模是不准确的，生产环境的行为方式完全不同。”\n\
  *   [配置引导](https://www.vagrantup.com/docs/provisioning)：在第一次运行 `vagrant up` 时，Vagrant\
  \ 会自动使用你在 `Vagrantfile` 中配置的任何配置器（provisioner）配置新创建的虚拟机。你也可以在虚拟机创建运行 `vagrant provision`\
  \ 来显式再次运行配置器。\n\n最后这项功能对我们来说最重要的。Ansible 是 Vagrant 集成的许多配置器之一（其他还包括基础 shell 脚本、Chef、Docker、Puppet\
  \ 和 Salt）。当你调用 `vagrant provision`（或第一次运行 `vagrant up`）时，Vagrant 会将虚拟机交给 Ansible，并告诉\
  \ Ansible 运行定义的 Ansible playbook。我们稍后会介绍 Ansible playbook 的细节，但现在，我们将编辑 `Vagrantfile`\
  \ 来使用 Ansible 为我们的虚拟机进行配置。\n\n打开我们之前使用 `vagrant init` 命令创建的 `Vagrantfile`。在最后的 ‘end’\
  \ 之前添加以下几行（如果你好奇的话，Vagrantfiles 使用 Ruby 语法）：\n\n```\n1 # Ansible 的配置配置。\n2 config.vm.provision\
  \ \"ansible\" do |ansible|\n3   ansible.playbook = \"playbook.yml\"\n4 end\n```\n\
  \n这是一个非常基础的配置，用于让你开始在 Vagrant 中使用 Ansible。一旦我们深入使用 Ansible，还有[许多其他 Ansible 选项](https://www.vagrantup.com/docs/provisioning/ansible_intro)\
  \ 可以使用。现在，我们只想设置一个非常基本的 playbook——你创建的一个简单文件，告诉 Ansible 如何配置你的虚拟机。\n\n## 你的第一个 Ansible\
  \ playbook\n\n现在让我们创建 Ansible 的 `playbook.yml` 文件。在与 `Vagrantfile` 相同的文件夹中创建一个空文本文件，并放入以下内容：\n\
  \n```\n 1 ---\n 2 - hosts: all\n 3   become: yes\n 4 \n 5   tasks:\n 6   - name:\
  \ Ensure chrony (for time synchronization) is installed.\n 7     dnf:\n 8      \
  \ name: chrony\n 9       state: present\n10 \n 11   - name: Ensure chrony is running.\n\
  \ 12     service:\n 13       name: chronyd\n 14       state: started\n 15      \
  \ enabled: yes\n```\n\n稍后我将详细介绍这个 playbook 在做什么。现在，让我们在虚拟机上运行这个 playbook。确保你处于包含\
  \ `Vagrantfile` 和新 `playbook.yml` 文件的相同目录下，并输入 `vagrant provision`。你应该看到你定义的每个“任务”的状态消息，然后是一个显示\
  \ Ansible 在你的虚拟机上做了什么的总结——类似于如下所示：\n\n```\nPLAY RECAP **********************************************************\n\
  default              : ok=3    changed=0    unreachable=0    failed=0\n```\n\nAnsible\
  \ 仅通过你定义的简单 playbook，解析了 YAML 语法，并通过 SSH 运行了一系列命令来按照你指定的配置配置服务器。让我们逐步查看该 playbook：\n\
  \n```\n1 ---\n```\n\n第一行是一个标记，显示文档的其余部分将以 YAML 格式化（参阅[YAML 简介](https://yaml.org/spec/1.2.2/)）。\n\
  \n```\n2 - hosts: all\n```\n\n这一行告诉 Ansible 该 playbook 适用于哪些主机。`all` 在这里有效，因为 Vagrant\
  \ 隐式使用它自己的 Ansible 清单文件（而不是使用手动创建的 `hosts.ini` 文件），该文件仅定义了 Vagrant 虚拟机。\n\n```\n\
  3   become: yes\n```\n\n由于我们需要特权来安装 chrony 并修改系统配置，此行告诉 Ansible 在 playbook 中的所有任务都使用\
  \ `sudo`。\n\n```\n5   tasks:\n```\n\n```\n6   - name: Ensure chrony (for time synchronization)\
  \ is installed.\n7     dnf:\n8       name: chrony\n9       state: present\n```\n\
  \n此命令等同于 `dnf install`，但更智能；它会检查 `chrony` 是否已安装，如果未安装则进行安装。脚本如下：\n\n```bash\nif\
  \ ! rpm -qa | grep -qw chrony; then\n    dnf install -y chrony\nfi\n```\n\n```\n\
  11   - name: Ensure chrony is running.\n12     service:\n13       name: chronyd\n\
  14       state: started\n15       enabled: yes\n```\n\n这最后一个任务同时检查并确保 `chronyd`\
  \ 服务已启动并运行，同时将其设置为开机自启。同样的脚本如下：\n\n```bash\n### 如果 chronyd 未运行，则启动它。\nif ps aux\
  \ | grep -q \"[c]hronyd\"\nthen\n    echo \"chronyd is running.\" > /dev/null\n\
  else\n    systemctl start chronyd > /dev/null\n    echo \"Started chronyd.\"\nfi\n\
  ### 确保 chronyd 在系统启动时启用。\nsystemctl enable chronyd\n```\n\n你可以看到 shell 脚本是如何变得复杂的！而且这个脚本仍然不如\
  \ Ansible 健壮。为了维护幂等性和处理错误情况，你在 shell 脚本上需要比使用 Ansible 时做得更多。\n\n我们可以更加简洁（展示 Ansible\
  \ 强大的简单性），忽略 Ansible 自解释的 `name` 参数和 `key=value` 语法，得到如下 playbook：\n\n```\n1 ---\n\
  2 - hosts: all\n3   become: yes\n4   tasks:\n5   - dnf: name=chrony state=present\n\
  6   - service: name=chronyd state=started enabled=yes\n```\n\n## 清理\n\n一旦完成对 Rocky\
  \ Linux Vagrant 虚拟机的实验，可以通过运行 `vagrant destroy` 将其从系统中删除。如果你想再次重建虚拟机，运行 `vagrant\
  \ up`。如果你像我一样，很快就会每周使用 Vagrant 和 Ansible 构建并重建数百个虚拟机和容器！\n\n### 总结\n\n你的工作站正处于变成“箱基础设施”的道路上，现在你可以确保你的基础设施与运行在其上的代码一样经过测试。通过一个简单的例子，你已经领略了\
  \ Ansible playbook 简单而强大的之处。我们稍后会深入研究 Ansible playbook，并在过程中更多地探索 Vagrant。\n\n\n\
  \n\n\n```\n ______________________________________\n/ I have not failed, I've just\
  \ found   \\\n| 10,000 ways that won't work. (Thomas |\n\\ Edison)             \
  \                 /\n --------------------------------------\n        \\   ^__^\n\
  \         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w\
  \ |\n                ||     ||\n```\n\n## 第 3 章 - 即时命令 (Ad-Hoc Commands)\n\n在上一节中，我们通过创建一个简单的\
  \ Ansible playbook 结束了对 Vagrant 本地基础设施测试的探索。在此之前，我们还使用简单的 ansible 即时命令在远程服务器上运行了一个一次性命令。\n\
  \n在接下来的章节中，我们将深入研究 playbook；而现在，我们将探索 Ansible 如何帮助你通过即时命令在一台或多台服务器上快速执行常见任务并从中收集数据。\n\
  \n## 交响乐\n\n在过去的十年中，单个管理员管理的服务器数量急剧增加，特别是虚拟化和云应用使用的增长已成为标准配置。因此，管理员必须找到新的方式以流化的方式管理服务器。\n\
  \n在任何一天中，系统管理员都有许多任务：\n\n* 通过 `dnf`、`apt` 和其他包管理器应用补丁和更新。\n* 检查资源使用情况（磁盘空间、内存、CPU、交换空间、网络）。\n\
  * 检查日志文件。\n* 管理系统用户和组。\n* 管理 DNS 设置、hosts 文件等。\n* 在服务器之间复制文件。\n* 部署应用程序或运行应用程序维护。\n\
  * 重启服务器。\n* 管理 cron 任务。\n\n几乎所有这些任务都可以（并且通常也是）在至少部分程度上实现自动化的——但某些任务通常需要人工干预，特别是在实时诊断问题时。在当今复杂的多服务器环境中，逐一登录服务器并不是可行的解决方案。\n\
  \nAnsible 允许管理员使用 `ansible` 命令同时在 във台或数百台机器上运行即时命令。在第 1 章中，我们已经在添加到 Ansible 清单文件中的服务器上运行了几个命令（`ping`\
  \ 和 `free -m`）。本章将更详细地探讨即时命令和多服务器环境。即使你决定忽略 Ansible 的其他强大功能，在阅读本章后，你也将能够更高效地管理服务器。\n\
  \n## 使用 Vagrant 构建用于测试的基础\n\n在本章的剩余部分，由于我们想要进行大量实验而不损坏任何生产环境服务器，我们将使用 Vagrant 强大的多机器功能来配置几台服务器，并用\
  \ Ansible 管理它们。\n\n之前，我们使用 Vagrant 启动了一台运行 Rocky Linux 8 的虚拟机。在那个示例中，我们使用了 `Vagrantfile`\
  \ 中定义的所有 Vagrant 默认配置。在这个示例中，我们将使用 Vagrant 强大的多机器管理功能。\n\n![三台服务器：两个应用服务器，一台数据库服务器。](img/1-basic-vagrant-application.png)\n\
  \n三台服务器：两个应用服务器，一台数据库服务器。\n\n我们将管理三个虚拟机：两个应用服务器和一个数据库服务器。 许多简单的 Web 应用程序和网站都有类似的架构，尽管这可能无法反映存在的海量基础设施组合，但它足以凸显\
  \ Ansible 的服务器管理能力。\n\n首先，在你的本地驱动器某处创建一个新文件夹（我喜欢使用 `~/VMs/[dir]`），并创建一个名为 `Vagrantfile`\
  \ 的新空文件（这是我们向 Vagrant 描述虚拟机的方式）。用你喜欢的编辑器中打开该文件，添加以下内容并保存文件：\n\n```\n 1 # -*- mode:\
  \ ruby -*-\n 2 # vi: set ft=ruby :\n 3 \n 4 VAGRANTFILE_API_VERSION = \"2\"\n 5\
  \ \n 6 Vagrant.configure(VAGRANTFILE_API_VERSION) do |config|\n 7   # 通用 Vagrant\
  \ VM 配置.\n 8   config.vm.box = \"geerlingguy/rockylinux8\"\n9   config.ssh.insert_key\
  \ = false\n10   config.vm.synced_folder \".\", \"/vagrant\", disabled: true\n11\
  \   config.vm.provider :virtualbox do |v|\n12     v.memory = 512\n13     v.linked_clone\
  \ = true\n14   end\n15 \n16   # 应用服务器 1.\n17   config.vm.define \"app1\" do |app|\n\
  18     app.vm.hostname = \"orc-app1.test\"\n19     app.vm.network :private_network,\
  \ ip: \"192.168.56.4\"\n20   end\n21 \n22   # 应用服务器 2.\n23   config.vm.define \"\
  app2\" do |app|\n24     app.vm.hostname = \"orc-app2.test\"\n25     app.vm.network\
  \ :private_network, ip: \"192.168.56.5\"\n26   end\n27 \n28   # 数据库服务器.\n29   config.vm.define\
  \ \"db\" do |db|\n30     db.vm.hostname = \"orc-db.test\"\n31     db.vm.network\
  \ :private_network, ip: \"192.168.56.6\"\n32   end\n33 end\n```\n\n此 `Vagrantfile`\
