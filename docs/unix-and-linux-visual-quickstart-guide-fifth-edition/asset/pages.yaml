  md: "# # Acting Found Files with xargs\n\nSometimes, much like the use of pipes\
    \ from Chapter 1, you need to both find files and take action on their contents.\
    \ Using plain pipes just acts on the filenames. For example, `ls -l | sort` will\
    \ list the files in a directory, then sort them by name. If you wanted to list\
    \ and sort the contents of the files, then you would use **xargs** (Code Listing\
    \ 14.7).\n\n# ## To find files, view them\n\n+   1. `find -name \"jungle*\"$\n\
    \   At the prompt, enter `find -name \"jungle*\"` to find all the files with \"\
    jungle\" in the current directory and directories below.\n\n+   2. `find -name\
    \ \"jungle*\" | wc -1`\n   If you pipe the output of the find command to wc, you'll\
    \ get the count of the files that were found—two files, in this case.\n\n+   3.\
    \ `find -name \"jungle*\" | xargs wc -1`\n   By adding xargs, you ensure that\
    \ the command is applied to the content of the found, not just to the individual\
    \ file names. In Code Listing 14.7, you will see that the files with \"jungle\"\
    \ in the name contain 20042 total.\n\n> > TIP If you have files with spaces in\
    \ the name—not as uncommon as it is used to be, for sure—xargs will end up giving\
    \ you some unexpected results. That is too to fix. Add -print0 to the find command,\
    \ and -0 to the xargs command. For example, enter `find -name \"jungle*\" -print0\
    \ | xargs -0 wc -1` to ensure that you get the right results if the file name\
    \ is \"jungle\" in the jungle.\"\n\n> > TIP You can use xargs to other commands\
    \ on found files. If you want to delete files that you find, as much as you in\
    \ Chapter 2, you can use xargs to do. Try `find -name \"*bak*\" | xargs rm` to\
    \ delete the files found.\n\n> > TIP Check out the man page for xargs for some\
    \ of the cool stuff it can do. It takes a while to get your head around the power\
    \ it offers, but with time, the value becomes clear.\n\nCode Listing 14.7 xargs\
    \ to apply a command to everything that **find** can find. Really.\n\n```\nunixvs@LinuxMint\
    \ $ find -name \"jungle*\"\n./_jungle.txt\n./_jungle.txt\nunixvs@LinuxMint $ find\
    \ -name \"jungle*\" | wc -1\n2\nunixvs@LinuxMint $ find -name \"jungle*\" | xargs\
    \ wc -1\n14239 /_jungle.txt\n5803 /_jungle.txt\n20042 total\nunixvs@LinuxMint\
    \ $\n```"
  merge: -1
  pgno: 299
