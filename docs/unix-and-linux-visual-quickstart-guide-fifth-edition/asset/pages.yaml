- img_proc: true
  md: '![](img/fff2eea2e42bd82cdabda71c69c59f13_206_0.png)


    # Running a Shell Script


    After you''ve created a script in your editor or saved the script file, your next
    step is to run it, which means to execute every command in the script in the order
    provided. (Yes, you did this in the previous section, but we''ll expand on it.)


    As you do this using the bash command (or the name of the shell you''re using)
    followed by the name of the shell script you want to run.


    Running a script is as easy as typing bash plus the filename of the script.


    # To run a script:


    bash myscript


    At the shell prompt, type bash (or the name of the shell, like ksh or csh, you
    want to run the script) followed by the name (or full path and name) of the script.
    In this case, you''re really telling bash to run and to use the list of commands
    in the myscript file. You''ll see the results of the script—in this case, words
    appear onscreen, as shown


    > Note that in this example, you''re explicitly telling Unix the name of the script
    to run (myscript). When you do so, the #/bin/bash line at the top of the script
    in the previous section is technically superfluous. It''s essential only when
    the script is executable, as in in the following section.'
  merge: -1
