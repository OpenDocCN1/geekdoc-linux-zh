  md: '+   6. `Enter`nPress `Enter` to select the option you want to change.


    +   7. Make your selection or fill in the necessary information.


    +   8. `Enter`nPress `Enter` to exit the configuration menu and return to the
    setup menu. You''ll be prompted to save your changes. If you want to do so, press
    `Y`; if not, press `N`. You''ll then whiz back to the main menu.


    > TIP You can customize alpine so that it automatically opens your inbox whenever
    you type it. In the initial-keystate-list, just type l,v, and then press `Enter`
    to specify the initial characters.


    # ### Table 11.1 Commonly Used Configuration Options


    | Option | Description |

    | initial-keystate-list | Specifies key commands for alpine to use when starting,
    just as if you''d typed them in directly. |

    | quit-without-confirm | Allows you to exit alpine without the "are you sure?"
    message. |

    | signature-at-bottom | Puts your automatic signature at the end of the message
    you''re replying to, rather than above it. |

    | saved-msg-name-rule | Sets alpine to automatically file your saved messages
    in a specific folder, based on the characteristics (sender, etc.) of the message.
    |

    | fcc-name-rule | Sets your file copy of outgoing messages to be saved in a particular
    folder. We like the by-recipient, which files messages according to whom we sent
    them to. |

    | use-only-domain-name | Sets alpine to send all outgoing messages with just the
    domain name and not the machine name on the From: line. For example, our messages
    come from @raycomm.com, not from @frazz.raycomm.com. |'
