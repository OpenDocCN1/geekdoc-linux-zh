- img_proc: true
  md: '# Monitor users:


    +   - we; who


    You don''t even need sudo for this one, but you do want to keep an eye on the
    users logged in, and where they''re coming from. After a while, you''ll be able
    to recognize patterns and react to them. If jdoe usually logs in 9 a.m. and logs
    out by 4 p.m., and always logs in the same system, and then you will see jdoe
    suddenly logging in from a different address at 1 a.m., you should wonder if jdoe''s
    secret password isn''t quite secret anymore.


    +   - last


    The last utility tells you who logged in (and out) and when, and from where, as
    shown in Code Listing 15.5. Good stuff to know, particularly if you''re not online
    and actively monitoring w and who all the time.


    # Monitor system load:


    top


    Use top to monitor your system loads, as Different systems will show distinctly
    different patterns, but if you become accustomed to checking top when everything
    seems normal on your system, you will be able to tell yourself if something is
    abnormal or even when the time comes. Press q to quit top.


    # Monitor memory:


    sudo free


    With the help of sudo, use free to see how much free memory (RAM in the computer,
    not storage on the disk) you have. If you get low on RAM, computer processing
    slows down and you might need to close some applications. If you get very low
    on RAM, applications might even crash.


    There''s a lot to monitor and a lot to keep up with. Take time to read man pages,
    search the web, and ask around for tips and tricks. A wide variety of additional
    utilities exist to make these processes easier for you.


    Develop shell scripts that automate when you log in and perform the "normal" system
    checks. By doing so, you don''t have to run checks manually, and you can come
    up to speed what''s going on today.


    Use top -d 2 | grep Mem for running status check on your available memory. Use
    grep for other characteristics from top out-put, as appropriate.


    Anything that''s different from usual is worth concerned about. Check man pages
    or search the web to find out for sure.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_310_0.png)'
