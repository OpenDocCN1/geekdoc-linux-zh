  md: '# Splitting Files with split


    Suppose you''re futzing with your new digital camera and you want to share a photo
    of your new computer (what else is cool enough to take pictures of?) via email
    with your friends and family. You access the file, attach it to an email message,
    and then—argh!—your ISP fails to send the file because it''s too big. Although
    you could modify the file itself—reduce the physical size, reduce the number of
    colors used, or crop out nonessential parts, for example—you can also just split
    the file with split. For example, if the ISP tells you that no files larger than
    0.51 GB will be accepted, you can use split to send the file in chunks—all using
    one easy command (Code Listing 6.22).


    To split files with split:

    split -b 500M mongopicture.jpg


    With that, split gives you three files (xaa, xab, xac) that are each 500 MB (the
    first two) or less (the last one, containing the leftovers). Mail each of those,
    and you''ve put one over any restrictions on size.


    +   TIP Control the names of the files by adding a prefix to each. For example,
    try split -b 500M mongopicture.jpg chunk to create three pieces called chunkaa,
    chunkak, and chunkac.


    +   TIP use cat to restore the original; for example, cat chunkaa chunkak chunkac
    > reconstitutedpicture.jpg.


    +   TIP If you''re following the photo file example used here, note that the recipient
    of the emailed file pieces will have to assemble the pieces in order to view the
    photo. Even if the recipient isn''t a Unix or Linux user, all systems have utilities
    to accomplish this task. Now, whether your recipient would want to take the time
    or would have the skill to do this is another question. You might check first.'
  merge: -1
