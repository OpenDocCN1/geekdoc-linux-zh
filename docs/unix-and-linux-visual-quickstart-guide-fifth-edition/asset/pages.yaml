  md: '# Accepting Command-Line Arguments in Your Scripts


    Suppose that at the end of every month you need to send a progress report to your
    boss. You might set up a script to address an message to your boss, provide an
    appropriate subject line, and send the file containing the progress report. You''d
    likely have this script automatically address a message to your boss and put in
    the subject line, but you''d want to use command-line input to select which file
    you want to send. By using command-line input, you can give your scripts a bit
    more flexibility and still have much of a process automated for you. You run the
    script and specify the input at the shell prompt, as shown in


    ```

    ```bash

    #!/bin/bash

    mail boss@example.com "Status report for $1" < /reports/$1


    cat status-report | mail -s "status-report August"\n```

    ```


    +   Using command-line input, you can add flexibility to a script and still have
    the script do the grunt work for you.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# To accept command-line arguments in a script:


    +   1. vi status-report

    Use your favorite editor to edit your script.


    +   2. mail -s "$Status report for $1"

    boss$@example.com < ~/reports/$1

    Enter a command, with $1 appearing in each place you want to use the first item
    of input from the command line. In this example, the script starts a message to
    the boss, fills in the subject line (adding the month automatically), and sends
    the one specified monthly report (the one specified on the command line) from
    the **reports** directory under your home directory.


    See Chapter 11 for more information about sending email.


    +   3. Save and exit, and then run the script (Code Listing 10.6), though you
    might first have to provide the content for the status report and find a boss
    to take your status report.


    > **TIP** To see the information provided at the command line, echo it back out
    with echo$. The $@ variable provides all the command-line input, with $1, $2,
    $3, and so on (up to $9) containing the individual arguments.


    > **TIP** You can also accept input at specified points while a script is running.
    See the next section for more details.


    **Code Listing 10.6** By providing command-line input (in this case August), you
    can control what the script does.


    ```

    [unixvsqs@LinuxMint scripting]$ more status-report

    #! /bin/bash

    mail -s "Status report for $1" boss@example.com < ~/reports/$1

    [unixvsqs@LinuxMint scripting]$ ./status-report August

    [unixvsqs@LinuxMint scripting]$

    ```'
