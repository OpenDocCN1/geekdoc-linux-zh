  md: '# # Unarchiving Files with tar


    You''ll also use **tar** to unarchive files, where you take all the individual
    files out of the single tarred file, as shown in **Code Listing 13.6**.


    # ## To unarchive files with tar:


    ### `tar -xf labrea.tar`


    At the shell prompt, type **tar -xf** (where x means extract) followed by the
    name of the tarred file to unarchive. The bunch of once-tarred files will be separated
    into the original files or directories, as shown in Code Listing 13.6.


    # ## To unarchive selected files with tar:


    ### `tar -xf labrea.tar mammoth`


    You can extract only specified files from a **tar file**. You may do this to restore
    just a couple of files from a backup archive, for example. This command extracts
    the file named **mammoth** from the **labrea.tar** file and places it back where
    it belongs (**Code Listing 13.7**).


    > > TIP Consider moving tarred files into a temporary directory before you unarchive
    them. When you unarchive, tar overwrites any files with the same names as files
    that are extracted. ideally a new and empty temporary directory—


    > > TIP Use tar -tf filename to list the files (to check your work, perhaps, or
    find a backup file) without actually unarchiving the files.


    > > TIP Use tar -xvf filename to see the names of the files as they are extracted
    from the archive.


    Code Listing 13.6 Untaring files files reconstructs the original directory structure.


    ```

    [unixvs@Linux compression]$ tar -xf labrea.tar

    [unixvs@Linux compression]$ ls -l Labrea/

    total 483

    -TW-T-R- 1 ejr 53678 Jul 27 10:05 bigfile.gz

    -TW-T-R- 1 ejr 128886 Jul 27 10:06 mammoth.jpg

    -TW-T-R- 1 ejr 117607 Jul 27 10:05 house.uue

    -TW-T-R- 1 ejr 128886 Jul 27 10:06 rowboat.jpg

    [unixvs@Linux compression]$

    ```


    Code Listing 13.7 Unarchive a single file to replace a missing or corrupted file.


    ```

    [unixvs@Linux compression]$ tar -xf labrea.tar mammoth

    [unixvs@Linux compression]$ ls -l Labrea/m*

    -TW-T-R- 1 ejr 128886 Jul 27 10:06 Labrea/mammoth

    [unixvs@Linux compression]$

    ```'
