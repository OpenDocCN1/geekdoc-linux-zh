  md: '# # Sending and Reading Email


    If you''re anything like us, your whole day revolves around getting goodies in
    your email inbox and sending "highly important" messages (of course they''re important,
    right?). In any case, sending and receiving email will probably be rarer common
    tasks in your Unix or Linux experience.


    In this chapter, we''ll introduce you to a few Unix and Linux email programs and
    show how to get started with them. (Of course, just use the instructions which
    apply to the program you''re using!) Then, we''ll show you some clever things
    you can do with email in Unix, such as creating signature files and sending automatic
    vacation replies.


    Throughout this chapter, we''ll be referring to a program called **alpine**. The
    program alpine is simply a newer version of **pine** (well, there are some licensing
    changes similar to those with **pico** and **nano** back in Chapter 4, but those
    won''t affect your daily life with them). *If alpine is not available and you
    are on an older system*, say, at your office, you might possibly have **pine**.
    If so, you can pretty much use the **alpine** instructions for **pine**.


