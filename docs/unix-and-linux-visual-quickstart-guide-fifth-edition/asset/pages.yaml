- img_proc: true
  md: '# Logging In to Remote Systems with telnet


    You might already be using telnet to connect to your Unix or Linux system, but
    you probably aren''t because telnet is a huge, gaping security hole. You can,
    though, use it to connect to and use other computer systems on the Internet (assuming
    you have rights to log in to and that the system administrator allows telnet access
    rather than requiring SSH), as A.


    To connect to another computer using telnet:


    +   1. telnet telehack.com


    At the shell prompt, type telnet followed by the name of the system to which you
    want to connect. In this example, we''re connecting to a system in Mountain View,
    California.


    +   2. Make note of the Escape character announced when you log in—look quickly,
    because it''ll vanish by onscreen. The Escape character is what you''ll press
    should your telnet connection stall or the system lock up. In the example, the
    Escape character is [Ctrl]+I, which will return us to the telnet prompt so we
    can quit the connection A.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_252_0.png)


    Note the Escape character as it flashes by.


    continues on next page'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 3. Log in using instructions you have for accessing the system.


    Presumably, if you''re accessing a system over the Internet, you have some reason
    (and permission) to do so. In some cases, you''ll type the name of the application.
    In other systems, you''ll log in with a username and password, just as you log
    in your Unix system


    # 4. After you''ve finished using the remote system, log according to the instructions
    and policies of the remote system.


    For help with telnet, type telnet at the shell prompt, and enter a ? at the telnet>
    prompt open, close, and exit will be the most useful tools for you.


    You''ll find that telnet connections to libraries and other mainframe computers
    are often difficult to use because of oddities in keyboard emulations. Your best
    bet is to contact the site owner and ask for an FAQ list (with answers). You won''t
    be the first to have questions.


    A program closely related to telnet, tn3270 is designed specifically for communicating
    with IBM mainframes, which are commonly used for college library catalogs as well
    as other professional and academic systems. If you know that you''re communicating
    with an IBM mainframe, tn3270 will probably be better to use.


    As you probably gathered, telnet is very much a throwback to the earlier days
    of the Internet. You can find some good (fun, entertaining) information about
    telnet at www.telnet.org, including places to telnet to.


    If you want to hear the gory details on why telnet is well and truly dead on the
    Internet, search online for "telnet worm".


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_253_0.png)


    After you''re connected, you can use the remote system just like your own.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# # Communicating with Others Using write


    Most of the time when you connect to a Unix or Linux system, you''ll be communicating
    with the computer. You can, though, communicate with other people logged in the
    same system. **write** is ideal for getting a quick message to other users—kind
    of like putting a sticky note on their computer, as A shows.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_254_0.png)


    A You can send quick messages to another user on your system with **write**.


    # ## To communicate with others using write:


    +   1. **write userid**

    At the shell prompt, type **write** followed by the userid of person to whom you
    want to send a message. You''ll get a blank line with a blinking cursor on it,
    just waiting for you to type something.

    2. **Wanna meet for lunch?**

    Go ahead and type your message A.

    3. **Ctrl+D**

    When you''re finished typing, press **Ctrl+D** to send the message. What you typed
    will appear on the other user''s screen B.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_254_1.png)


    B The message suddenly appears on the user''s screen.


    > TIP Keep in mind that a write message will suddenly appear on the recipient''s
    screen and can be an intrusive surprise!


    > TIP If you don''t want to receive write messages, type **mesgn** at the shell
    prompt. This command will keep other people from sending you write messages for
    the current session. Type **mesg y** to enable write again.'
  merge: -1
  pgno: 254
- img_proc: true
  md: "# # Communicating with Others Using talk\n\nYou can also have a real-time,\
    \ two-way conversation (very much like an instant-messaging chat) with another\
    \ user logged in the system by talk. As shows, you type your messages, the other\
    \ person types his, and you can both see the exchanges online.\n\n# ## To communicate\
    \ with others using talk:\n\n+   1. talk deb\n   At the shell prompt, type talk\
    \ and the userid of the person to whom you want to talk. The other user will be\
    \ prompted to enter talk and your userid. Then, you'll see the talk screen, as\
    \ shown in.\n2. You just wouldn't have believed it!\n   I had chased the dog for\
    \ six blocks...Yeah, the stinkin' pooch\nalnys thinks the garbage truck\n   is\
    \ stealing our stuff... Right.\n   Hilarious. Anyway, there was I\nhuffing and\
    \ puffing on the front porch, which a neighbor informed me\nme that some kids\
    \ were rooting through my trash. Like, what did\nthey expect to find? Old pant\
    \ hose and coffee filters?\n   I stopped using pants hose for a long time ago.\n\
    \   It made me look too.\n3. Ctrl+C\n   When you're finished, break the connection.\n\
    \n![](img/fff2eea2e42bd82cdabda71c69c59f13_255_0.png)\n\ntalk lets you have a\
    \ real-time, two-way online conversation.\n\n> > You can also talk to people logged\
    \ in other Unix systems. Just use userid@where.com. Of course, fill in the other\
    \ person's actual userid and address, which will be the same as that person's\
    \ email address. Firewalls—but always—block these chats, though.\n\n> > If someone\
    \ requests a talk with you, just type talk and the person's userid (or) userid@where.com,\
    \ if the person's name is the same as yours.\n\n> > As with write, you can type\
    \ mes n and mes y at the shell prompt to turn off and on for the current session.\n\
    \n> > Though talk is not as groovy as some of the GUI-based instant messaging\
    \ programs, it's still pretty cool, huh? It's also a good way to ask for help\
    \ from more experienced users on your system, particularly if you checked to see\
    \ if it's OK to do."
