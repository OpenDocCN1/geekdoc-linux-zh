  md: '# Creating Files with touch


    Another skill you''ll frequently use is creating files. You might think of creating
    files as getting an empty bucket that you can later fill with water...or sand...or
    rocks... or whatever. When you create a file, you designate an empty space that
    you can fill with programs, activity logs, your résumé, or configurations—practically
    anything you want, or nothing at all.


    Of course, you can also create a file by writing something in an editor and saving
    it, as described in Chapter 4, but you will sometimes encounter situations where
    you just need an empty file as a placeholder for later use. You create empty files
    using the touch command, as shown in Code Listing 2.2.


    2. Use the touch command to create files, update their modification times, or
    both.


    ```

    $ ls

    $ touch file.to.create

    $ ls -l file*

    -rw-rw-r-- 1 ejr users 0 Jun 29 11:53 file.to.create

    $ touch -t 121321359 oldfile

    $ ls -l total 0

    -rw-rw-r-- 1 ejr users 0 Jun 29 11:53 file.to.create

    -rw-rw-r-- 1 ejr users 0 Dec 31 2009 oldfile

    $ touch -t 20161231359 new.years.eve

    $ ls -l total 0

    -rw-rw-r-- 1 ejr users 0 Jun 29 11:53 file.to.create

    -rw-rw-r-- 1 ejr users 0 Dec 31 2016 new.years.eve

    -rw-rw-r-- 1 ejr users 0 Dec 31 2009 oldfile

    ```'
