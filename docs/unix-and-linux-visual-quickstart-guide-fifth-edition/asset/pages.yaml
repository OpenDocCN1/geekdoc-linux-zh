  md: '# # Keeping a Record of Your Session with script


    Occasionally, you may need to keep a record of a Unix or Linux session—for example,
    if you''re using Unix or Linux as part of a class assignment or you need a session
    to submit to your untrusted boss. You can do this using **script**, which keeps
    a record of every command you type from the shell prompt (Code Listing 14.6).
    You might think of typing *script* as pressing the Record Button on a tape recorder.


    # ## To record your session with script:


    +   1. script covermybutt

