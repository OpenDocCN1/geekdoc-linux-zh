  md: '# 3. ls -1 /etc


    You can also use the ls -1 command on a system directory, such as /etc. Here,
    you''ll see that most of the files are owned by **root**, with a variety of different
    group memberships A.


    ```

    ls -l /etc

    dr-xr-x   7 root root 4096 Nov 28 09:16 resolv

    rw-r--r-- 1 root root 160 Nov 28 09:36 master.conf

    -rw-r--r-- 1 root root 3016 Mar 14 08:32 adjtime

