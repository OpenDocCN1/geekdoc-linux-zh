  md: '# To share files on the Internet with ftp:


    +   1. ftp ftp.raycomm.com


    Open the FTP connection as shown in the previous section.


    +   2. youruserid


    Log in with your userid.


    +   3. password


    Enter your password.


    +   4. cd incoming


    Use standard Unix directory commands (ls, cd, and so on) to move into the directory
    which you want to put the files (Code List 12.3). **incoming** is often the right
    directory name to use, particularly on public FTP servers.


    +   5. binary


    Set the file type. You''ll want to use the **binary** file type for any files
    other than text or HTML files; use `ascii` for text or HTML.


    +   6. put myjokes.gz


    Type **put** followed by the name of the file you''re making available.


    +   7. quit


    Type `quit` when you''re done.


    > TIP On public FTP servers that accept incoming files, you might not be able
    to list the files in the incoming directory or see anything there. In this case,
    just cast your file into a big room and close the door. This allows FTP administrators
    to screen the incoming files before making them available for downloading. In
    case you''re wondering, this is called a `dropbox`, and that''s precisely where
    the name of the common Internet came from.


    > TIP You can use the mput command to make multiple files available.


    > TIP If you''re transferring a lot of files at once—say, for example, you''re
    moving all of your files from your old ISP to your new one—consider using `tar`
    and `gz` to collect and zip all of your files, and then transferring just a single
    file. See Chapter 13 for more information about these commands.


    > TIP Navigate in your local system (for example, to change to a directory containing
    files to put) with regular Unix commands like `ls` and `cd`, prefixed with an
    1.


    > TIP Use ! to execute a command on your local system from within the ftp application.
    For example, `pwd` would display the path and name of the current directory on
    the other system, and `!pwd` would display the path and name of the current directory
    on the local system.'
  merge: -1
