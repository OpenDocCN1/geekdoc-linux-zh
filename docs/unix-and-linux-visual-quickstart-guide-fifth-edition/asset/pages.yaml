  md: 'The following lines, per logged-in user, show


    +   - The login name


    +   - The tty name (the connection to the host)


    +   - The remote host name


    +   - The login time


    +   - Current idle time (that is, the time since a key on the keyboard was touched)


    +   - JCPU (job CPU time, or the total processing time for jobs on the current
    connection, which is the tty, for those into the jargon)


    +   - PCPU (process CPU time, or the processing time for the current process)


    +   - The command line of the current process


    Whew! As you can see from Code Listing 7.12 and Code Listing 7.13, different systems''
    w commands produce slightly different (but similar) output.


    > TIP Use w with grep to find information (slightly more abbreviated) about a
    specific user. For example, w | grep ejr limited information, but just about a
    specific user. See Chapter 1 for more information about piping commands.


    # Code Listing 7.13 yields different information on different systems.


    ```

    example> w

    1:47pm up 38 day(s), 23:35, 36 users, load average: 1.58, 1.78, 1.75

    ...

    ejray pts/16 Thu 6am 1:14 -csh

    ...

    ```'
