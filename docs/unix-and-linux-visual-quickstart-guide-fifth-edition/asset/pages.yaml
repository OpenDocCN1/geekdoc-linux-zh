  md: '# Getting Familiar with Internet Lingo


    Before you venture out onto the Internet using the information in this chapter,
    you should become familiar with some concepts and terminology.


    A server is a computer that stores data and "serves" it whenever requested. For
    example, you might think of a web server as a big storehouse for .html files.
    Its job is to store .html files, wait for another computer to request the requested
    files and "serve" them to the requesting computer. And, yes, your Unix or Linux
    system might be a web server, but it doesn''t have to be.


    A client is a program that runs on your Unix system and is used to access data
    on a server. For example, your links web browser is a client—that is, it runs
    on your Unix or Linux system and is used to access files on a web server.


    An IP (Internet Protocol) address is the address of a specific computer. This
    address identifies a computer, much like your street IP address identifies your
    home. You use IP addresses, for example, every time you access a webpage. You
    may type www.raycomm.com (which is called the host name), but behind the scenes,
    that''s translated into a specific IP address, such as 192.168.141.12. You will
    use host names (such as www.oracle.com or www.sun.com) more often, because they''re
    easier to remember than a string of numbers. Whether you type in a character address
    or a numeric address, all you''re doing is accessing a specific address for a
    specific computer.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Table 12.1 Internet Ports and Protocols


    | Port | Protocol |

    | 21 | ftp |

    | 22 | ssh |

    | 23 | telnet |

    | 70 | gopher |

    | 80 | http |

    | 119 | nntp |

    | 8080 | http (usually for test servers) |


    Protocols are the languages that computers use to communicate with one another.
    For example, FTP (File Transfer Protocol) is used to transfer files from one computer
    to another. HTTP (Hypertext Transfer Protocol) is used to transfer data on the
    web, usually by web browsers.


    Ports are like a computer''s ears—they''re “places” that computers listen for
    connections. Most web servers run at port 80, and if you connect to http://www.raycomm.com:80/,
    you''re explicitly saying that you want to talk to the www.raycomm.com computer,
    at port 80, using HTTP. You could specify a different protocol (FTP, for example)
    or a different port (8080, for example) to communicate with the same computer
    in a different way, as Table 12.1 shows.'
  merge: -1
