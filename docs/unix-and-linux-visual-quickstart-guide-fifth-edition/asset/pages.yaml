  md: '# Formatting with fmt


    After you''ve been typing away—writing the Great American Novel, perhaps—you might
    notice you''re suffering from creeping margin uglies, like those shown in Code
    Listing 6.21. Never fear, fmt can help. Just run your text through fmt, and all
    will be well.


    # To format with fmt:


    ```

    fmt spiderstory.unformatted

    ```


    At the shell prompt, just tell fmt to do its thing, and you''ll be in business.


    > TIP You can supplement fmt with handy flags to help make lines more readable.
    For example, you can often use fmt -u to make spacing uniform: one space between
    words, and two spaces between sentences. Or, try fmt -w to specify the width of
    the formatted text; -w 60 would specify a 60-character-wide line.'
