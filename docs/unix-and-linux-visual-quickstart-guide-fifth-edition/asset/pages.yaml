  md: '# # Sending Email with mail


    Despite mail''s unintuitive interface and features, it is a great program to use
    if you just want to dash off a quick message without fussing with niceties. As
    Code Listing 11.3 shows, you can send messages while in mail or from the shell
    prompt. You can also use mail to send files fairly easily.


    # To compose and send a message using mail:


    +   1. mail unixvqs@raycomm.com


    At the shell prompt, type mail followed by the recipient''s address. If you want
    to send email to multiple addresses, just separate them with commas but no spaces,
    as mail putz@raycomm.com, putz2@raycomm.com.


    If you''re already in mail, just type m followed by the address or addresses,
    in m putz@raycomm.com, deb@raycomm.com.


    Code Listing 11.3 Using mail, you can dash off a quick note by including the recipient''s
    address and the message text.


    ```

    [ejr@hobbes ejr] mail unixvqs@raycomm.com

    Subject: You''re in big trouble now!

    So, anyways, Winchester had perched

    himself on my stereo turntable (those were sooooo low-tech, weren''t they?!).
    He was

    waiting for me to turn on the stereo so he could go back to sleep spinning in

    circles. I used to let him sleep that way

    at night. Well, that was until one night

    when the lid closed on him...

    EOT

    [ejr@hobbes ejr]

    nCode Listing 11.4 To send a text file through the mail, you just redirect the
    file to mail.

    [ejr@hobbes ejr]$ mail unixvqs@raycomm.com < sendit.txt

    [ejr@hobbes ejr]$

    ```'
