- img_proc: true
  md: "# Accepting Input While a Script Is Running\n\nIn the previous section, we\
    \ showed that you can require that information be provided along with the script\
    \ in order for the script to run, but it's easy to forget to input the information\
    \ and thus not get the results you expect. You can also require input while a\
    \ script is running. The script runs, you input some information, and then the\
    \ script continues (probably) using the information you input. In this case, the\
    \ script counts misspelled words, but you can apply it to anything you want.\n\
