  md: '# Configuring procmail


    Let''s see...two messages from the boss...17 messages from the string collectors''
    discussion group...oh, hey, a message from Mom...and...


    One of the handiest Unix life easiers you can do is make your procmail (a mail-filtering
    program) to handle some of your incoming email automatically.


    In this section, we''ll show you how to configure procmail so you can manage incoming
    messages. And show, you need to do two things to set up your system to manage
    mail with procmail:


    +   - Specify settings for procmail. For example, incoming mail gets plucked directly
    into your inbox; however, procmail filters mail before it gets to your inbox,
    so you need to tell procmail where your mail folders are, among other things.


    +   - Tell to do its thing. Essentially, you create a .forward file that sends
    your incoming mail to procmail for processing before you ever see it. This step
    is not necessary for many systems, particularly newer Linux and Unix systems.


    To specify settings for procmail:


    +   1. nano -/.procmailrc To begin, access your editor and create a .procmailrc
    file in your home directory. Give a place to log all its activities, so it can
    then tell you what''s done: "I throw 7 messages from your boss... filed 3 messages
    from Joe in the GolfBuddies folder..." In this example, we tell procmail to keep
    a mail log file in our home directory. Keep an eye on this file, because it can
    grow large over time.


    | LOGFILE=$HOME/.maillog |

    | FROM=/usr/bin/local/bin/bin |

    | DEFAULT=/var/spool/mail/$USER |


    | Mail Msg | Writech | Read File | Fw Pg | Cut-Test | Cut For |

    |---|---|---|---|---|---|

    | Exist | | | | | | |


    > You specify the procmail settings you need, and then you''re off and running.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_243_0.png)


    ```

    IFS = as://usr/bin/procmail

    $7=$7 HOME

    ```


    | Mail Msg | Writech | Read File | Fw Pg | Cut-Test | Cut For |

    |---|---|---|---|---|---|

    | Exist | | | | | | |


    > Tell the Unix system to send incoming messages to procmail for processing to
    ease your mail management.


    Chapter 11'
