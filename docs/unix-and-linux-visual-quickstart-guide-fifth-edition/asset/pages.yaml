  md: '# To search and replace in vi:


    +   1. **vi hairspider**

    For starters, access *vi* and a specific file.


    +   2. `Esc`:%s/spider/horrible awful spider/

    Enter `Esc`:%s/ plus the text to find, another `/` followed by the replacement
    text, Here, we replace text, as in "swallowed a fly" with spider to catch the
    fly," but perhaps you might forgo the spider and simply go for some antacid.


    > A great use for the search-and-replace feature is if you end up with DOS text
    files in your Unix account (transferring a text from a Windows machine as a binary
    file, most likely). If you view DOS files through a Unix shell, all the lines
    in the file will end with `M`. If you try to type `M` when you''re doing a search
    and replace, the `M` won''t show up. What to do? Press `Ctrl+V`, then `Ctrl+V+M`.
    Just search and replace `/%/g`. The `Ctrl+V|Ctrl|M|V` command "escapes" the following
    character, so you can press it without actually doing what the command would otherwise
    do. If you press `Ctrl+M`, vi thinks you just pressed `Enter` and tries to execute
    the unfinished command.


    > See the section in Chapter 6 for information about searching with regular expressions.


    > Add a `g` at the end of the command to make it apply to all occurrences in the
    file. Otherwise, it applies only to the first occurrence on each line.'
