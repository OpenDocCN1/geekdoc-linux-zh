  md: '# # Viewing Session History in the bash Shell


    Another cool feature of the bash shell is that it lets you easily reuse commands
    from your session history, which shows you the list of commands you''ve used during
    a session or in previous sessions (Code Listing 3.9). Viewing history is handy
    for reviewing your Unix or Linux session, using previous commands again (rather
    than retyping them), and modifying (rather than completely retyping) complex commands.


    To view session history in the bash shell:


    +   1. Use the shell for a little while, changing directories, redirecting output,
    or doing other tasks.


    Take your time. We''ll wait.


    +   2. Press the ↑ key one time.


    Note that the last (previous) command you used appears on the command line, as
    shown in Code Listing 3.9. To reissue the command, just press Enter.


    Code Listing 3.9 In this example, you typed the first command, then pressed the
    ↑ key to reuse the previous 1 command. !40 recycled the 40th command from the
    listing.


    ```

    [ej@hobbes clean]$ ls

    background.htm info.htm logo.gif

    [ej@hobbes clean]$ ls

    background.htm info.htm logo.gif

    [ej@hobbes clean]$ history

    1 free

    2 id deb

    3 id ej

    4 uname -a

    5 ls

    ...

    40 cd

    41 cp .bash_history oldhistory

    42 vi .bash_history

    43 elm

    44 ls -la

