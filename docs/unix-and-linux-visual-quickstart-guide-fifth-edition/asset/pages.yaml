- img_proc: true
  md: 'TIP Your .procmailrc file processed in order. As soon as a recipe matches an
    incoming email message, it''s applied. So if your first recipe is the forwarding
    recipe, procmail will never even get to any later recipes. If no recipes are matched,
    mail will be delivered to the DEFAULT location you specified (see "Configuring
    procmail, earlier.").


    TIP After you set up your procmail processing, be patient. Sometimes procmail
    processes email on a specific schedule (hourly, for example), so testing it may
    be a little time-consuming.


    # Sample procmail Recipes


    The following recipes, with annotations, should help you get started filtering
    with procmail: # Filter based on the To; Cc: and similar headers


    ```

    :0:

    * ^TO.*awr@.*raycomm.com

    $MAILDIR/interesting

    # Filter based on the subject


    :0:

    * ^Subject:.*Status Report.

    $MAILDIR/status-reports

    # Filter based on sender


    :0:

    **From:*.*spammer@example.com

    $MAILDIR/IN.TO-DELETE

    # Filter directly to garbage, irrevocably, based on sender


    :0:

    ^From:.*spammer@example.com

    /dev/null

    # Filter based on size (greater than 1000 bytes)


    :0:

    * > 1000

    $MAILDIR/longish

    ```'
