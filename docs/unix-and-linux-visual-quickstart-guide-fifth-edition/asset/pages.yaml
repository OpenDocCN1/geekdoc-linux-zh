  md: '# # Choosing an Email Program and Getting Started


    In general, you''ll have a choice of three kinds of programs for sending and receiving
    on a Unix or Linux system:


    +   - An email program installed on your local computer or network that interacts
    with the mail system for you. You might know these programs as mail clients and
    have used ones like Mail, app, Evolution, Thunderbird, or Outlook Express. These
    are handy because they usually have a spiffy interface and can handle attachments
    without a lot of hassle on your part, but they''re not really Unix programs. These
    programs also let you store your mail on your desktop system (Windows or MacOS
    or even Unix desktops), but those are beyond the scope of this book.

    - A web-based email program that you access through your web browser on your local
    computer. Gmail, Yahoo Mail, Outlook.com, and many. These are also outside the
    scope of the book (although most of the servers that host mail programs actually
    run Unix or Linux).

    - An email program that you access and use directly on the Unix or Linux system.
    These programs, such as **alpine**, **mutt**, and **mail**, let you send and receive
    with varying degrees of ease. **alpine** and **mutt** let you send attachments
    with not a lot of hubbub. But the mail remains on the Unix system, you can access
    your mail from anywhere you can access your mail from Unix or Linux system.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_223_0.png)


    alpine''s interface and features are intuitive and easy to use.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_223_1.png)


    mutt''s interface and features are fairly easy to use but not as easily as **alpine''s**.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_223_2.png)


    mail''s interface and features are well, and kind of a pain to use.


    210 Chapter 11'
  merge: -1
