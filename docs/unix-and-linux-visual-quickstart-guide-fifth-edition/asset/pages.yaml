  md: '# # 10

    Writing

    Basic Scripts


    So far in this book, you''ve been typing commands (or perhaps combining commands),
    pressing `Enter`, then waiting for Unix to execute the command(s) specified...and
    typing in commands, pressing `Enter`. You get the idea, and you probably have
    tired fingers by now.


    Using shell scripts, you can create a series of commands, save them as a single
    file, and execute them any time you want—without having to re-create the commands
    or do all that tedious typing over and again. For example, suppose you want to
    do a complex search-and-replace on all `.html` files in your home directory. With
    a shell script, you can take the time to structure the commands just one time,
    save the commands as a single file, and then apply it to any directory at any
    time. You do the hard work one time, and then reuse the script any time you need
    to.


