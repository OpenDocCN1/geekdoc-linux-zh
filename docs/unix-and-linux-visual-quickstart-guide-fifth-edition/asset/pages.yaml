  md: '# Checking Job Status with jobs


    Occasionally, you may have multiple jobs running or suspended and need a quick
    update about the jobs'' status. Using jobs, you can find out whether a job is
    running, stopped, or waiting for input, as shown in Code Listing 9.6.


    To check job status with jobs:


    jobs


    At the shell prompt, type jobs. You''ll see a list of the current jobs (that is,
    processes that you''ve suspended or otherwise controlled) running or stopped,
    as shown in Code Listing 9.6. Using the job numbers on the left, you can choose
    to run the jobs in the background or foreground, to resume them, or to kill the
    jobs, as described in the next sections in this chapter.


    > TIP Depending on your shell, you can often kill jobs with kill followed by a
    % and the job number or command name--for example, you could kill the ftp job
    in Code Listing 9.6 with kill %ftp or kill %1. "Deleting Processes with kill"
    later in this chapter for more killing jobs.


    **Code Listing 9.6** Viewing jobs lets you know which jobs you have suspended
    and their statuses.


    ```

    [ejr@hobbes ejr]$ jobs

    [1]- Running ftp calvin.raycomm.com &

    [2]+ Stopped (tty input) sh

    [3] Stopped (signal) links http://www.raycomm.com/

    [ejr@hobbes ejr]$

    ```'
  merge: -1
  pgno: 192
- img_proc: true
  md: "# Running Jobs in the Background with bg\n\nIf you're running a job that doesn't\
    \ require input from you, consider running it in the background using bg (Code\
    \ Listing 9.7). In doing so, you can keep the program running while working on\
    \ other Unix activities at the same time.\n\nTo run jobs in the background with\
    \ bg:\n\n+   1. jobs\n   At the shell prompt, type jobs to see the list of all\
    \ jobs, running or stopped. Note the job numbers on the left.\n\n+   2. bg %\n\
    \   Type bg followed by % the number of the job you want to run in the background\
    \ (Code Listing 9.7).\n\n> TIP If you want to put the most recently suspended\
    \ job into the background, just type bg (without the number) at the prompt.\n\n\
    > TIP You can also put jobs directly into the background without first suspending\
    \ them. Just type the command to run and & (as in bigdog job &). The & moves the\
    \ job directly into the background.\n\nCode Listing 9.7 Restarting suspended jobs\
    \ in the background lets you do two things—or more at once. To move a job to the\
    \ background, just type bg followed by % and the job number.\n\n```\n[ej@hobbes\
    \ ejr jobs\n[3]- lynx http://www.raycomm.com/ calvin.raycomm.com/\n[2] Stopped\
    \ (tty Input) ssh\n[3] Stopped (signal) links http://www.raycomm.com/\n[4]+ Stopped\
    \ man ssh\nejr@hobbes ejr$ bg %3\n[3]- lynx http://www.raycomm.com/ /\nejr@hobbes\
    \ ejr$]\n```"
  merge: -1
