  md: '# Using ROT13

    Encoding with sed


    In various places on the Internet, text is often encoded with something called
    ROT13, which is an abbreviation for "rotate (the alphabet by) 13." That is, A
    becomes N, B becomes O, and so forth. If text is encoded, people have to take
    extra steps to decode the message. For example, if the message is a movie review,
    people who don''t want to know the ending won''t have the surprise spoiled. Instead,
    the message encoded with ROT13 might look like this:


    Tbbq sbe lbh-lbh svtherq vhg!


    +   - Naq ab,

    - guer''f ab chapuyvar. Ubcr lbh

    - rawblqr


    **gur obbx!** Qrobenu naq Revp

    A great way to use ROT13 encoding (and decoding) is with **sed**, which will let
    you easily manipulate text.


    # To use ROT13 encoding with sed:


    +   1. vi script.sed

    Use the editor of your choice to create a file named **script.sed**. Because the
    command we''re using will be we''ll create a **sed** script instead of just typing
    in everything at the shell prompt.

    2. y/abcdefuvwxyz

    - ABCDEFGHIJKLMNOPQRSTUVWXYZ/

    Start with a **y** at the beginning of the command. **y** is the **sed** command
    to translate characters (capital to lowercase or whatever you specify).

    After **y**, use a slash (\), the original characters to look for (all lowercase
    and uppercase characters), and another slash.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# y.abcdefghijklmnopqrstuvwxyzXYZ/


    +   > ABCDEFGHIJKLMNOPQRSTUVWXYZ/

    > nopqruvwxyzabcdefghijklm

    > OPQRSTQRSTUVWXYZABCDEFGHIJKL


    After the slash, add the translation characters (the lowercase alphabet, starting
    with n and continuing around m, then uppercase from N to M), followed by a slash
    to conclude the replace string.


    +   4. Save the script and exit the editor.


    +   5. sed -f script.sed limerick |

    Test the ROT13 encoding by applying it to a file. Here we apply to the limerick
    file, and pipe the output to more for all that you get gibberish. To test more
    thoroughly, we use sed -f script.sed


    > Text is rotated because there are 26 letters in the alphabet, so you can use
    the same program to encode or decode. If you rotate by a different number, you''ll
    need to have separate programs to encode and decode.


    > Check out the next section to see how to turn this lengthy process into a shell
    script and make it even easier to reuse over and over.


    > Consider that you can use this same files, not only to use ROT13 encoding but
    on other ways, which might somewhat obfuscate your secrets. Note that ROT13 is
    by no means actual encryption.


    # Code Listing 16.6 A spify sed command ROT13 encode and decode messages.


