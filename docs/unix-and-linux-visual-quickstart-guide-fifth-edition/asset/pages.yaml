- img_proc: true
  md: '# Compressing Files with compress


    *Compressing* a file just means making it smaller so that it takes up less hard
    disk space. It''s like overfilling a toy box, closing the lid, sitting on it to
    smooth the contents so that they fit into a smaller space. Many times when you
    create a file that you''ll be sending via FTP or people will access through the
    web, you''ll need to compress the file so that it takes less time to download.
    As **Listing 13.8**, you compress files using the **compress** command (or also
    using **gzip**, later in this chapter).


    +   TIP You can compress only one file at a time. If you have multiple files you
    want to compress, archiving them first using **tar**, and then compressing the
    single archived file. See the section “Archiving with tar” earlier in this chapter.


    +   TIP You can add the -c flag to compress to leave the original file untouched
    and save the compressed version to standard output (where you''ll probably specify
    a name and save it to a file). For example, you might use compress -c labrea.tar
    > labrea.tar.compressed.Z See Chapter 1 for some mighty interesting information
    on redirecting output.


    # To compress a file with compress:


    compress labrea.tar


    At the shell prompt, type **compress** followed by the filename. Here, we''re
    compressing a tiered file, which contains multiple files. As you can see in Code
    Listing 13.8, the compressed file has a new extension (.Z) that shows it''s compressed,
    and it replaces the original, uncompressed file.


    **Code 13.8** Listing files before and after compressing lets you see how much
    smaller the new file is.


    ```

    [unixvqs@LinuxMint compress]$ ls -l 1*

    -rw-r--r- 1 ejr users 501760 Jul 27 10:06 labrea.tar

    [unixvqs@LinuxMint compress]$ compress labrea.tar

    [unixvqs@LinuxMint compress]$ ls -l 1*

    -rw-r--r- 1 ejr users 297027 Jul 27 10:06 labrea.tar.Z

    [unixvqs@LinuxMint compress]$

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# # Uncompressing Files with uncompress


    Compressing a file is handy for reducing the amount of disk space it uses, but
    you can''t do much with a compressed file—directly, at least. You''ll need to
    uncompress it first. As **Code Listing 13.9** shows, you do so using the **uncompress**
    command.


    # ## To compress a file with uncompress:


    uncompress labrea.tar.Z


    At the shell prompt, type the full filename of the file to uncompress. The compressed
    file is replaced by the uncompressed file, which is named the original, but without
    the **Z** (see Code Listing 13.9).


    > > TIP Remember that uncompressed files take more space—sometimes more than compressed
    files. You might want to check your storage quota with your ISP before you uncompress
    a file to make sure you don''t exceed your limit. As Chapter 7 explains, you can
    often check your quota by typing `quota -v` at the shell prompt.


    > > TIP You can add the -c flag to uncompress to leave the original file untouched
    and send the uncompressed version to standard output. For example, you might use
    uncompress -c tarred.tar.Z > tarred.tar. See Chapter 1 for more information on
    redirecting output, as is shown here.


    > > TIP You can also use gunzip to uncompress compressed files. Check out "Unzipping
    a gzip file with gunzip" later in this chapter.


    **Code Listing 13.9** You can uncompress files with a single shell command and
    double your file usage at the same time, as shown here.


    ```

    [unvxqs@LinuxMint compression]$ ls -l 1*

    -rw-r-r- 1 ejr 297027 Jul 27 10:06 labrea.tar.Z

    [unvxqs@LinuxMint compression]$ uncompress labrea.tar.Z

    [unvxqs@LinuxMint compression]$ ls -l 1*

    -rw-r-r- 1 ejr 501760 Jul 27 10:06 labrea.tar

    [unvxqs@LinuxMint compression]$ ls -l z*

    -rw-r-r- 1 ejr 501760 Jul 27 10:22 zipadeedoodah.tar

    [unvxqs@LinuxMint compression]$ gzip zipadeedoodah.tar

    [unvxqs@LinuxMint compression]$ ls -l z*

    -rw-r-r- 1 ejr 239815 Jul 27 10:22 zipadeedoodah.tar.gz

    [unvxqs@LinuxMint compression]$

    ```'
