  md: '# Making Backups with rsync


    The **rsync** is a fancy way to synchronize files and directories, either locally
    or across a network. We like to use it to make backups so we don''t have to worry
    when we mess something up. Yes, we could use **cp** or something equally boring,
    but we like the speed and flexibility of **rsync**. In this example, we''re copying
    files locally, but we could easily be making remote backups to another server
    somewhere else.


    To make backups with rsync:


    +   1. `mkdir ~/BACKUPDIR`


    Create a directory to house your backups. Ideally, you''ll create the directory
    on a different physical disk from the stuff you''re backing up, but do what you
    can. We''re creating a backup directory that''s a subid of the home directory,
    which will help protect against self-inflicted damages but not against a disk
    failure.(We trust the system administrator for protecting against disk failures...er
    Eric, you are up to date on our backups, aren''t you?


    +   2. `rsync -v /home/jdoe/data ~/BACKUPDIR`


    Specify the **rsync command, -v (for verbose), and -a (for archive archive)**
    options, as well as the source and destination directories (Code Listing 16.8).


    Wait while it does the initial backup (showing you each file as it gets copied).
    The first backup takes a while but no longer than using **cp** would.


    > TIP When you''ll discover that it''s far faster because rsync copies only the
    files that have changed. Handy, huh?


    > TIP You can gain huge benefits from rsync if you start making backups across
    a network. For example, you can synchronize your server content with your friend''s
    content located on a different server. Check the rsync man page (man rsync) for
    the specifics.'
  merge: -1
