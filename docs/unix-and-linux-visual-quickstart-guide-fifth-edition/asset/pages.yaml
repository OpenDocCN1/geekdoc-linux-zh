  md: '# # Locating Lost Files with locate


    If you''re looking for a system file—that is, a program or file that is part of
    the Unix system itself, rather than one of your personal files in your home directory—try
    **locate** to find it. You may get more results than you can handle, but it''s
    a quick and easy way to locate system files.


    The **locate** command isn''t available on all Unix and Linux systems, but it
    is worth a try at any rate. See **Code Listing 2.13** for locate in action.


    # ### To locate a file:


    locate fortune


