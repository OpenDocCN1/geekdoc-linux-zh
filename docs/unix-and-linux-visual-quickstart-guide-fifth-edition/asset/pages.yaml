  md: '# Determining Disk Usage with du


    Another piece of information that you can access is how much disk space within
    the Unix or Linux system is. You can do so using du, as shown in Code Listing
    7.6.


    # To determine disk usage with du:


    At the shell prompt, enter du. As Code Listing 7.6 shows, you will get information
    about disk usage in the current directory as well as all subdirectories. The numbers
    are usually measured in 1-kilobyte blocks (as with df). You can actually read
    the output by using du -h.


    Code Listing 7.6 The command reports—exhaustively—about the disk usage in directory
    and in its subdirectories.


    ```

    [ejr@hobbes ej]$ du

    2 /Mail

    1 /nsmail

    1 /.datastore/cache/O

    3 /.datastore/cache/1A

    22 /.datastore/cache

    1 /.datastore/archive

    172 /.datastore

    1 /.Projects

    28 /.wprc

    3 /axhome

    5 /groups

    1 /manipulate/empty

    154 /manipulate

    1 /mail

    1 /unixvsqs/ch6

    2 /unixvsqs

    6 /dugroupps

    255 /compression/Folder

    670 /compression/BackupFolder

    1921 /compression/temp

    670 /compression/BackupFolder

    4657 /compression

    5 /clian

    1 /elm

    15 /editors

    5619

    [ejr@hobbes ejr]$

    ```


    > If you''re on a system that enforces space quotas (as many companies do), you
    can find out what your quota is and how close you are reaching it. Just type quota
    -v at the shell prompt.


    > You can use du with a path name to check the disk usage in just a single directory
    or subdirectory (Code Listing 7.7), summarizes the usage by subdirectory as it
    prints the results.


    > Use du -s, optionally with a specific directory, to just print a summary of
    amount of space used.


    Code Listing 7.7 Using du with a specific directory gives you focused results.


    ```

    [ejr@hobbes ejr]$ /home/ejr/compression

    255 /home/ejr/Folder

    670 /home/ejr/compression/temp/BackupFolder

    1921 /home/ejr/compression/temp

    670 /home/ejr/compression/BackupFolder

    4657 /home/ejr/compression

    [ejr@hobbes ejr]$

    ```'
