  md: '# Introduction


    Greetings, and welcome to Unix and Linux!


    In this book, you''ll find the information you need to get started with the operating
    system, Unix and do the hard work for you. Advance your skills, and make Linux
    or Unix work for you. This book focuses on the most common Unix and Linux commands,
    but it also gives you ideas for working smartly and efficiently.


    For the purposes of this book, Unix and Linux are pretty much interchangeable—the
    commands and usages are the same. You may find small differences among Unix versions
    or between specific Unix or Linux versions, but they''ll be small indeed.


    can start choosing topics, depending on what you want to do. Be sure to reference
    the table of contents, the index, and the appendixes to find information at a
    glance.


    The commands used throughout this book apply to any version of Unix (or Linux)
    you might be using, including Solaris, Openlandiana, BSD, Linux (any or all),
    AIX or HP-UX, your OS X or Linux system at home, or any other flavor (that''s
    the technical term) you can find. Heck, you can even run something very Unix-like
    from your Windows system with Cygwin. Or you can run the Unix or Linux of your
    choice using VirtualBox, VMware, or other virtualization programs. You''ll find
    more flavors and getting access to Unix or Linux in Chapter 1.


    By the way, if you''re looking around the Internet for information, you''ll find
    that a number of sidestep the awkward discussion of various flavors of Unix and
    Linux by using the term Un\*. That seems a little too geeky, for us, so we opted
    out of that one. (Un\* sidesteps a perceived issue of trademark enforcement with
    the specific name Unix and manages to convey the "and Linux too, when it''s like


