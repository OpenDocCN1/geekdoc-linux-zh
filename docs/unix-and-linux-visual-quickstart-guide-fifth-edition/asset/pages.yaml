  md: '# Comparing Files with cmp


    Suppose you''ve been working on the dearliza file and you want to know how it
    differs from the longterm file. Using cmp, you can compare the two files, as shown
    in Code Listing 6.13.


    Code Listing 6.13 gives you the facts about the first difference between two files.


    ```

    [unixvxqs@linumx Examples$

    $ cmp dearliza dearnheny

    dearliza dearnheny differ: char 20, line 2

    [unixvxqs@linumx Examples$]

    ```


    # To compare files with cmp:


    cmp dearliza dearnheny


    Code Listing 6.14 also tells you if the files matched until one ended EOF stands
    for "end of file".


    ```

    [unixvxqs@linumx Examples$

    $ cmp limerick limericks

    cmp: EOF on limerick

    [unixvxqs@linumx Examples$]

    ```


    At the shell prompt, type cmp followed by both filenames. As Code Listing 6.13
    shows, these two files are not the same.


    If the files are identical, you''ll find yourself back at the shell prompt with
    no comment from cmp. If both files are identical until one of them ends—that is,
    the first 100 lines are the same, but one continues and the other ends—then you''ll
    see an EOF (end of file) message, in Code Listing 6.14.


    > You can find other ways that files differ using diff, as described in the next
    section, "Finding Differences in Files with diff."


    > Unix and Linux provide an exit message that you can use to get more information
    about how the program stopped and why. Using "Advanced Redirection to stderr"
    in Chapter 16 for more information.


    > You can also use diff to find out files are in one directory but not another.
    Just type diff followed by the names of the two directories; for example, diff
    /home/ejr/Directory /home/ejr/Newdirectory.


    > You might also check out the section "Finding Differences in Files with sdiff,"
    later in this chapter, for another way to compare files.'
