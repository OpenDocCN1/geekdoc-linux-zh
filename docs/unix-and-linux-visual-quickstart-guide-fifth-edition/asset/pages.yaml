  md: '# TABLE 1.1 Common Directories and Their Contents


    # Exploring the System


    With these few key skills in hand, you''re ready to start exploring your system.
    In doing so, you can quickly get an idea of what''s available and gain some useful
    experience in entering commands.


    | Directory | Contents |

    | --- | --- |

    | /bin | Essential programs and commands for use by all users |

    | /etc | System configuration files and global settings |

    | /home | Home directories for users |

    | /sbin | Programs and commands needed for boot |

    | /tmp | Temporary files |

    | /usr/bin | Commands and programs that are less central to basic Unix system
    functionality than in /bin but still useful and often important |

    | /usr/local | Most files and data that were developed or customized by the system
    |

    | /usr/local/bin | Locally developed and installed programs |

    | /usr/local/man | Manual (help) pages for local programs |

    | /usr/share/man | Manual (help) pages |

    | /var | Changeable data, including system logs, temporary data from programs,
    and user mail storage |


    Think of Unix system as a thoroughly kid-proof house: You can look around and
    touch some stuff, but you can''t do anything to hurt yourself or the system (as
    long as you are not logged in as root, that is, but that another topic in another
    chapter). Don''t worry! You can''t hurt anything by looking around, and even if
    you tried to break something, most Unix systems are well enough that you couldn''t.


    Table 1.1 shows some of the directories you''re likely to find most interesting
    or useful (Appendix B of this book provides a more comprehensive list of directories).
    You can use the following steps to get exploring.


    # To explore locally installed programs


    +   1. cd /usr/bin


    Change to /usr/bin, which is where most installed programs are.


    +   2. ls | more

    List the files (which will be programs, in this example) and pipe the output to
    more so you can read the names one screen at a time.


    +   3. ssh

    Type the name of any program you want to run; ssh, this allows you to connect
    to another system and use it just as you''re using your Unix system now.


    > You can type man followed by a command name to learn more about Unix programs.
    See the next section for information about Unix help.'
