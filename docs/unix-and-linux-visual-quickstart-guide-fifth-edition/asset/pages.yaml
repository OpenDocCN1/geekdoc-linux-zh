  md: '# To list screen sessions:


    screen -list


    Enter screen **list** to see all the screens currently running.


    # To reconnect to a screen session:


    screen -r


    Just type **screen -r** to reconnect to an existing screen session. If you have
    multiple screen sessions running, you will be prompted to choose which one you
    want to connect to A


    Use **screen** to reconnect to an existing Unix or Linux session and get back
    to the same place you were.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_298_0.png)


    # To close a screen session:


    Ctrl+A : quit


    To close a screen session, enter Ctrl+A to enter command mode (again, like vi).
    Type : next, to go to the screen command prompt. Then type **quit** to exit **screen**.


    > TIP If screen isn''t quite to your liking, or you think the concept is a good
    one, tmux is an increasingly popular alternative. It provides fundamentally similar
    capabilities and and adds some interesting features, but it isn''t as versatile
    as screen.


    > TIP Many people use screen for things like developing software, because screen
    makes it easier to resume where you left off.'
