    - ~/.bash_profile (automatically called by the system if it exists)

    - ~/.bashrc (automatically called by the system if it exists)

    - /etc/bashrc (often called by ~/.bashrc)


    Keep in mind that the files you have may differ from the files that we have.


    > TIP The bash shell sometimes daisychains configuration files together, referencing
    one from the previous one. Be careful to preserve the references and sequence
    as you edit your configuration files, or you might end up with unexpected results.


    > TIP All lines that start with # are comments, which contain notes to help you
    better understand the files. Comments don''t actually do anything, but they help
    you see what each section in the file does. Any line with a # at the beginning
    is not executed and is considered non-existent by the system.


