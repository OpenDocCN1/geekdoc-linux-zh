  md: '# # Finding Out File Types with file


    If you come from a Windows or Macintosh background, you''re probably used to accessing
    files and being able to see what type of files they are—HTML files, JPEGs, documents,
    or whatever. In Unix and Linux, though, you often can''t tell the file type just
    by listing files or displaying directory contents. That''s where file comes in
    handy, as shown in Code Listing 7.8.


    To identify file types with file:


    ```

    file /bin/nano

    ```


    At the shell prompt, type file, followed by the path (necessary) and filename.
    You''ll see output similar to Code Listing 7.8.


    > > TIP Not all files have the "magic" information associated with them that makes
    file work, but most do. Where they don''t, you get a best-guess response, like
    the second response in Code Listing 7.8. Unfortunately, you can''t tell just by
    looking if it''s definitive information or a guess, but if it''s terse (as in
    the second response), take it with a grain of salt.


    Code Listing 7.8 The file /bin/nano command provides useful information about
    what kind of data is in specific files.


    ```

    [ejr@hobbes ejr]$ file /bin/nano

    /bin/nano: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), dynamically linked

    - shared libs), for GNU/Linux 2.62.24, BuildID[sha1]=0xcaba96a927ba6af0d5a2dbbb9c473e933104577e,

    temp.htm: stripped [ejr@hobbes ejr]$ file temp.htm

    ascii text

    [ejr@hobbes ejr]$

    ```'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Finding Out About Users with finger


    Using the finger command, you can find out who is currently logged in to the system
    as well as what they''re doing, how long they''ve been logged in, and other snoopy,
    not-necessarily-your-business information (Code Listing 7.9).


    Code Listing 7.9 The finger command often provides interesting information about
    who is logged on to different systems.


    ```

    [ejr@hobbes]$ finger

    Login Name Tty Idle Login Time Office Phone

    asr *4 1 Jul 24 13:32

    deb 5 1 Jul 24 13:32

    jer Eric J. Ray 3:20 Jul 22 07:42

    jer Eric J. Ray p1 1:12 Jul 24 12:14 (calvin)

    jer Eric J. Ray p0 Jul 24 13:02 (calvin)

    root root *2 1d Jul 22 15:13

    [ejr@hobbes]$ finger @example.com

    [example.com]

    No one logged on

    [ejr@hobbes ejr]$ finger @osuunx.ucc.okstate.edu

    [osuunx.ucc.okstate.edu]

    nfinger: connect: Connection refused

    [ejr@hobbes ejr]$

    ```'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# To find out who is logged in using finger:


    +   1. finger


    At the shell prompt, type finger to see who else is logged in to the system and
    to get a little information about them (Code Listing 7.9).


    +   2. finger @example.com


    Type finger, @, and a host name (in this case, example.com) to find out who is
    logged in to another host.


    Fing a different host usually doesn''t work, unless you are probing a different
    system within a lab or company network. The reason it doesn''t work is that security
    settings on the other host computer(s) usually preclude use of finger. If the
    host doesn''t allow it, you''ll get a message like the one in Code Listing 7.9.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# To find out users using finger:


    +   1. finger ejr


    At the prompt, type finger followed by the userid of the person you want to know
    about. You''ll get a lot of information, including some or all of the following:
    the user''s name, home directory, and default shell; when, and for how long they''ve
    been logged on; and whatever information choose to provide. **Code Listing 7.10**
    shows two users with varying activity, **deb** has apparently been looping, and
    **ejr** has been working since buns off.


    > TIP You can also sniff out user information using who (see the next section).


    > TIP You can provide extra information to anyone who gets your user information
    with finger by creating files that describe your ''plan'' and ''project'' (as
    ejr has done in Code Listing 7.10). Use your favorite editor to edit .plan and
    .project files in your home directory. Then, change the protection so that the
    files are both readable (chmod +r .plan ; chmod +x .project) and the directory
    is accessible (chmod +x). Chapter 5 specifies about chmod.


    +   2. finger ejray@example.com

    Using finger plus a specific user address, you can find out users on other systems.
    As with generic finger requests, sometimes they''re blocked for security reasons.


    > TIP Information you obtain through finger can be handy when diagnosing connection
    difficulties. In particular, system administrators or help desk personnel are
    likely to ask where you''re connected (pts/57, for ejray@example.com) and what
    kind of software you''re using.


    Code Listing 7.10 The finger command can also provide in-depth information about
    specific users.


    ```

    [ejr@hobbes$ finger deb

    Login: deb Name:

    Directory: /home/deb Shell: /bin/bash

    Never logged in.

    No mail.

    No Plan.

    [ejr@hobbes$ finger ejr

    Login: ejr Name:

    Directory: /home/ejr Shell: /bin/bash

    On once Wed Jul 22 07:42 (MDT) on tty1 2 hours 32 minutes idle

    On once Wed Jul 22 06:58 (MDT) on ttypi for calvin

    No mail.

    Project:

    Working on VQS.

    Plan:

    This is my plan---work all day, sleep all night.

    [ejr@hobbes$ finger ejray@example.com

    [example.com]

    Login TTY Idle When Where

    eejray "RayComm pts/57 <Jul 22 09:39> calvin.raycomm.c

    [ejr@hobbes$]

    ```


    140 Chapter 7'
