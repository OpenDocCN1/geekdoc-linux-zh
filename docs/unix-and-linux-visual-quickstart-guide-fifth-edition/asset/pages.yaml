  md: "# # Cutting and Pasting Text Blocks in nano\n\nAs you're typing along in **nano**,\
    \ you'll probably need to cut and paste blocks of text, as shown in 1.\n\n# ##\
    \ To cut and paste text in nano:\n\n+   1. **nano hairysp**\n   At the shell prompt,\
    \ type `nano` followed by the name of the file to edit.\n2. **Move the cursor\
    \ to the first line of the text you want to cut.**\n3. `Ctrl+A`n   Press `Ctrl+A`\
    \ to mark the beginning of the text you want to cut. (Note that `Ctrl+A` is really\
    \ `Ctrl+Shift+A`—it might work without Shift, but it might not, depending on your\
    \ terminal program. Try it out and see what happens.)\n4. **Use the arrow keys\
    \ to move the cursor to the end of the text you want to cut.**\n   Note that the\
    \ text gets highlighted as you select it A\n5. `Ctrl+K`n   This \"kuts\".\n6.\
    \ **Using the arrow keys, move the cursor to where you want to insert the cut\
    \ text.**\n7. `Ctrl+U`n   Use this key combination to paste the cut text into\
    \ the file at the new location.\n\n> TIP You can select and cut blocks of text\
    \ without also pasting them back into a file. Just skip steps 6 and 7.\n\n> TIP\
    \ You can paste text blocks as many times as you want. After you select and cut\
    \ text, just press `Ctrl+U` at each place where you want to insert the cut text.\n\
    \n> TIP If you don't select, `Ctrl+K` just cuts a single line.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_90_0.png)"
