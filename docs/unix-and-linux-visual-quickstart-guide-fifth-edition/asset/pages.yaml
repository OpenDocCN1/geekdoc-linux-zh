  md: '# Variables in Your Environment You Shouldn''t Touch


    Before you go running off and changing your environment, note that there are some
    things you should really leave alone. These variables that the shell automatically
    affect how your Unix or Linux system works (or doesn''t work, if you try to change
    some of these variables!). Some of these cannot be changed, but some can, with
    unpredictable results. When in doubt, don''t. See the sidebar "Variables You Can
    Mess With" in the following section for a list of variables you can change.


    | zsh and bash | Description |

    | --- | --- |

    | HISTCMD | Keeps track of the current command from the history. |

    | HOSTTYPE | Holds a string describing the type of hardware on which the shell
    is running. |

    | IFS | Specifies the characters that indicate the beginning or end of words.
    |

    | LINENO | Contains the number of the current line within the shell or a shell
    script. |

    | OLDPWD | Contains the previous working directory. |

    | OSTYPE | Holds a string describing the operating system on which the shell is
    running. |

    | PPID | Contains the process ID of the shell''s parent. |

    | PWD | Contains the current working directory. |

    | RANDOM | Contains a special value to generate random numbers. |

    | SECONDS | Contains the number of seconds since the shell was started. |

    | SHELL | Contains the name of the current shell. |

    | SHLVL | Contains a number indicating the sub-shell level (if SHLVL is 3, two
    parent shells exist and you''ll have to exit from three total shells to completely
    log out). |

    | UID | Contains the userid of the current user. |'
