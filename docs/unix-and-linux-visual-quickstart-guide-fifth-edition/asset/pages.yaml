  md: '# # Scheduling Onetime Jobs with at


    Occasionally, you may need to schedule jobs to run one time, at a time you designate.
    For example, you could schedule an email message to yourself, reminding you to
    attend a staff meeting. Or you could schedule a meeting reminder for your coworkers
    that includes a meeting agenda. You can schedule these at, at which you designate
    other longterm jobs using at a time at which a job (or jobs) should run.


    +   - A demonstrates scheduling an email about all-important staff meeting.


    # ## To schedule a onetime job with at:


    +   1. at 12:01 1 Jan 2015


    To begin, specify when you want the job to run, using at plus time statement.
    In example, we specify a time, date, month, and year, although you can create
    a variety of other time statements, like these:


    +   - at noon tomorrow

    - at 01/01/2015

    - at 3:42am

    - at now + 3 weeks

    - at teatime


    Yes, time is a valid option. It''s at 4 p.m., by the way.


    +   2. mail -s "Staff Meeting at 8:30am"

    e ejr < /agenda


    Specify the job. In this case, it sends an email to the user (ejr), (ejr) specifies
    the subject "Staff Meeting at 8:30am," and sends the contents of the file named
    agenda. See Chapter 11 for the full scoop on using mail.


    continues on next page


