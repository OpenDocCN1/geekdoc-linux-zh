- img_proc: true
  md: '# Changing Permissions with chmod


    Suppose you''ve been working on a file named rowyourboat and you want to have
    your coworkers down the stream review it. To do so, you''ll need to give other
    people permission to access the document. You can either give people in specific
    groups access or give everyone on the Unix system access. In particular, you can
    specify permissions for u(ser-that''s you), g(roup), o(thers), and all().


    In addition to specifying permissions, you can also specify how much access a
    person or group can have to your file. For example, you can specify r(read), w(write),
    and e(xecute) access, depending on how much you trust them not to ruin youryourboat
    masterpiece.


    As shown in Code Listing 5.7, your first step is to check out what the current
    permissions are. Then, you can set permissions, add to them, or remove them as
    necessary.


    # To check current permissions:


    ```

    ls -l r*

    ```


    To begin, type ls -l r* to get a long listing of rowyourboat in the current directory.
    Code Listing 5.7 shows that the permissions are rwx-x---. This is actually three
    sets of permissions:


    +   - For the user (rwx, in this example)

    - For the group (r-x, in this example)

    - For the world (--, in this example)


    In this example, the user has read, write, and execute permissions; the group
    has only read and execute permissions; and all other users have no permissions.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'You can also use the -R flag with chmod to recursively apply the changes you
    make to all files and subdirectories in a directory. example, chmod -R go-rwx
    * removes permissions from everyone except the user for all files in the current
    directory, all subdirectories in the current directory, and all files in subdirectories.


    # To set permissions:


    chmod u=rwx,g=rx,o=r row*


    Type chmod and specify who has access. In this case users have read, write, and
    execute permissions; the group has read and execute permissions; and others have
    read permission for all files in the directory that start with row (Code Listing
    5.8).


    There are about a million and one ways to express permissions. For example, you
    could use chmod * (note the space before the *) or chmod u-rwx,g-rwx * to remove
    permissions from all files in the directory. (Note that if you try this you''ll
    have to add your own permissions back to the files before you do anything with
    them).


    The equals (=) specifies that the permissions granted in the command are the only
    permissions that apply. Any previous permissions will be removed.


    The wildcard expression (row*) specifies the command applies to all files and
    directories that start with "row" in the current directory.


    If you want to change permissions for multiple files, use a wildcard expression.


    # Code Listing 5.7 Use -1 to set the permissions on files.


    ```

    [ejr@hobbes permissions]$ ls -1l r*

    -rwxr-x--- 1 ejr users 152779 Jul 24 15:10 rowyourboat

    [ejr@hobbes permissions]$

    ```


    # Code Listing 5.8 You can set permissions to ensure that all files have specific
    permissions.


    ```

    [ejr@hobbes permissions]$ ls -1

    total 332

    -IW-TW-I- 1 ejr users 24850 Jul 24 14:59 black

    -IW-TW-I- 1 ejr users 152779 Jul 24 15:10 rowyourboat

    -IW-TW-I- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -IW-TW-I- 1 ejr users 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$ chmod u=rwx,g=rx,o=r row*

    [ejr@hobbes permissions]$ ls -1

    -IW-TW-I- 1 ejr users 24850 Jul 24 14:59 black

    -IWXT-XT-I- 1 ejr users 152779 Jul 24 15:10 rowyourboat

    -IW-TW-I- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -IW-TW-I- 1 ejr users 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$

    ```'
  merge: -1
