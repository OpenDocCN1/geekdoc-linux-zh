  md: "# Finding Differences in Files with sdiff\n\nYet another—and often better—way\
    \ to compare files is to use sdiff, which presents the two files onscreen so that\
    \ you can visually compare them (see **Code Listing 6.16**).\n\nTo compare files\
    \ with sdiff:\n\nsdiff dearliza dearhenry\n\nAt the shell prompt, type sdiff and\
    \ the filenames to compare the two files. The output, as shown in Code Listing\
    \ 6.16, presents each line of the two files side by side, separating them with\n\
    \n+   * (Nothing) if the lines are identical\n* < if the line exists only in the\
    \ first file\n* > if the line exists only in the second file\n* | if they are\
    \ different\n\n> **TIP** If most of the lines are the same, consider using the\
    \ -s flag so the identical lines are not shown. For example, type sdiff -s dearliza\
    \ dearhenry.\n\n> **TIP** If the output comes too fast to read, remember that\
    \ you can pipe the entire command to more, as in sdiff dearliza dearhenry | more.\n\
    \n**Code Listing 6.16** *sdiff* puts the files side by side, so you can easily\
