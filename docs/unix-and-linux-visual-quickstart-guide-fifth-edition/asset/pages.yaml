  md: "# # Adding Your zsh Path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells the\
    \ system to look for that command in each of the named directories in a specific\
    \ order.\n\nIf a command is not in your path, you have to type out the whole path\
    \ as part of the command, like `/home/unixvxqs/myscripts/latest/test/command.sh`.\
    \ If you put `/home/unixvxqs/myscripts/latest` in your path, you can just run\
    \ `command.sh`.\n\nBe sure not to remove anything from your path unless you really\
    \ know what you're doing, but feel free to add as many additional directories\
    \ to it as you want. For example, if you get writing scripts (as described in\
    \ Chapter 10), you might put them in a `scripts` subdirectory and want to add\
    \ that directory to your path.\n\nAs the following steps show, you change your\
    \ zsh path by first identifying where your path statement is located, then editing\
    \ the file that contains it (**Code Listing 8.4**).\n\n**Code Listing 8.4** You\
    \ should find your path statement in your configuration files.\n\n```\njdoe@sulley\
    \ ~ $ tail .zshrc\n# See comment at top.\nif [[ -r ${ZDOTDIR:$HOME}/.zshrc ]];\
    \ then\n  if [[ -f /usr/share/zsh/$ZSH_VERSION/zshrc_default ]]; then\n    source\
    \ /usr/share/zsh/$ZSH_VERSION/zshrc_default\n  fi\nfi\nPATH=/bin/usr/bin:/opt/bin\
    \ ~\n```"
  merge: -1
  pgno: 169
- img_proc: true
