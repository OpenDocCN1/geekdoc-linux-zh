  md: '# # Surfing the Web with links


    Using **links**, a really fancy text-based web browser, you can surf the web just
    as you might with Firefox or Internet Explorer, except with no graphics. That''s
    not really a bad thing; you don''t have to deal with pop-up ads, banner ads, or
    similar junk. Just content, all the time. **links** even supports tables and complex
    webpage designs, which is unusual for a text-based browser. Related advantages
    of using **links** are that you won''t have to deal with slow download times for
    graphics, annoying sound files, plug-ins, or other snowy webpage features.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_262_0.png)


    A The **links** browser provides great surfing capabilities, even without images.


    # ## Useful links Keystrokes


    +   - **/findme** finds text within the file. (Replace **findme** with the text
    you''re looking for.) This is also handy to quickly navigate through a page.

    - **?** finds text backward (moving up from the cursor) through the file.

    - **D** downloads the current link.

    - **G** goes to an address or file. You enter the address at the prompt.

    - **Shift+G** lets you edit the current address.

    - **Esc** usually lets you back out (escape from) the current menu.

    - **S** brings up a menu to manage your bookmarks, including bookmarking the current
    page.

    - **L** lets you toggle back and forth between viewing the formatted page and
    viewing the HTML source.

    - **Ctrl+R** reloads the current page and refreshes the screen.'
  merge: -1
  pgno: 262
- img_proc: true
