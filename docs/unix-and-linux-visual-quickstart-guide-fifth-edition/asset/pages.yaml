  md: '# Use procmail to Toss Spam Messages


    The following recipe,

    0:


    +   * |I^*,.*awr,.*raycomm.com

    $MAILDIR/spam


    uses a regular expression to filter messages that aren''t explicitly addressed
    to a userid with awr before the @ and raycomm.com at the end and places them into
    a special folder called spam. Put the spam filter at the end of your list of rules
    so all the messages originating from your mailing lists and other important messages
    are filtered. After testing this and making sure that you like it and it doesn''t
    pitch valuable messages, you could change the last line to /dev/null to just throw
    away the garbage.


    For more complex and sophisticated spam solutions, check the options with an online
    search for "procmail spam filter".


    # To forward mail with procmail:


    +   1. nano ~/.procmailrc

    To begin, access your editor and edit the .procmailrc file that you previously
    created in your home directory.


    +   2. :0:

    On a new line at the bottom of the file, add 0; this basically tells procmail
    recipe to "lock" your mail directory while it''s processing.


    +   3. !myemail@example.com

    Provide an exclamation point (I!) and the address to send the mail.


    +   4. Save and close the file.

    Now all mail that you receive will be forwarded automatically to myotheremail@example.com.


    # To invoke vacation with procmail:


    +   1. pico ~/.procmailrc

    To begin, access your editor and edit the .procmailrc file that you previously
    created in your home directory.


    +   2. :0 c

    | /usr/bin/vacation jdoe

    On a new line at the bottom of the file, add the recipe shown to send a copy (the
    c at the end of first line) of your email to the vacation program. See "Announcing
    an Absence with vacation" earlier in this chapter for more information about the
    vacation program.


    +   3. Save and close the file.

    Now all mail that you receive will be stored and passed along for the vacation
    program to respond to.'
  merge: -1
