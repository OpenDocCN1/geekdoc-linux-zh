  md: '# # Counting Files and Their Contents with wc


    One of Unix''s or Linux''s handier lets you count files and their contents. For
    example, you can count the number of files in a directory, or you can count the
    number of words or lines in a file. You do this counting with the wc command,
    as shown in Code Listing 6.1.


    Code Listing 6.1 Use wc -w to count the words in a file. The "honey-do" list in
    this example is quite a way from being the length of a novel.


    ```

    [unixxvs@linuxmint Examples]$ wc -honeydo

    235 honeydo

    ```


    Code Listing 6.2 With 93 items in the list, however, it''s plenty long enough.


    ```

    [unixxvs@linuxmint]$ wc -1 honeydo

    93 honeydo

    ```


    # ## To count words using wc:


    wc -honeydo


    At the shell prompt, type wc -w (for words) and the name of the file in which
    you want to count the words. wc will oblige, as shown in Code Listing 6.1.


    # ## To count lines with wc:


    wc -honeydo


    Use wc -1 followed by the filename to count the lines in the file (Code Listing
    6.2). This is useful for poetry or for things like lists (for example, our "honey-do"
    list always has a minimum of 73 items in it).


    > TIP You can find how many files you have in a directory using ls | wc -1 to
    count the regular files and directories, or ls -A | wc -1 to count all files and
    directories (except for ..).


    > TIP You can also find how many bytes a specific file takes up using wc -c. Or,
    you can use wc with no flags at all to get the lines, words, and bytes.'
  merge: -1
