    \ if you want to overwrite (destroy) the existing file, cancel the unzipping process,\
    \ or rename the file you're unzipping to a safe name. Alternatively, use the -n\
    \ (never overwrite) or -o (always overwrite) flag to add this\n\n> TIP gunzip\
    \ also understands how to compress some .zip files, so you can use gunzip instead\
    \ of unzip, if you'd like. On the Unix side of things, use whatever seems easiest\
    \ to you, or gunzip if you really don't care.\n\n> TIP To see the contents of\
