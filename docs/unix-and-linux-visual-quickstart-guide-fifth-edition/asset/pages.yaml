  md: '![](img/fff2eea2e42bd82cdabda71c69c59f13_320_0.png)


    # # Searching and Replacing Throughout Multiple Documents with sed


    Back in Chapter 6, we talked about sed and how to use it to search and replace
    throughout files, one at a time. Although we''re sure you''re still coming down
    off the power rush from doing that, we''ll now show you how to combine sed with
    shell scripts and loops. In doing this, you can take your search-and-replace criteria
    and apply them to multiple documents. For example, you can search through all
    the .html documents in a directory and make the same change to all of them. In
    this example, we strip out all the <BLINK> tags, which are offensive to all HTML
    purists as well as to right-minded individuals everywhere. Unfortunately, they''re
    not supported by most browsers now.


    Before you get started, you might want to take a look at Chapter 6 for a review
    of sed basics and Chapter 10 for a review of scripts and loops.


    # ## To search and replace throughout multiple documents:


    +   1. vi thestinkblinkintag

    Use the editor of your choice to create a new script. Name the file whatever you
    want.

    2. #!/bin/bash

    Start the shell script with the name of the program that should run the script.


    *continues on next page*'
  merge: -1
  pgno: 320
- img_proc: true
  md: '3. `for i in ls -1 *.htm*`


    Start a loop. In this case, the loop will process all the .htm or .html documents
    in the current directory.


    4. do


    Indicate the beginning of the loop content.


    5. cp $i $i.bak


    Make a backup copy of each file before you change it. Remember, Murphy is watching
    you.


    6. `sed "s/\<BLINK>//g" $i.new`


    Specify search criteria and replacement text. A lot is happening in this line,
    but don''t panic. From the left, this command contains sed followed by


    +   - ", which starts the command.


    +   - s/, which tells sed to search for something.


    +   - <, which is the first character to be searched for.


    +   - \/, which allows you to search for the /. (The \/ escapes the / so the /
    can be used in the search.)


    +   - *, which specifies zero or more of the previous characters (/), which takes
    care of both the opening and closing tags (with and without a / at the beginning).


    +   - BLINK>, which indicates the rest of the text to search for. Note that this
    searches only for capital letters.


    +   - If you are searching for <BLINK> tags to delete and don''t know if they
    might be uppercase, lowercase, or both, try adding the i (for case-insensitive)
    option to your sed command, like this: sed "s/\<BLINK>//ig"'
  merge: -1
  pgno: 321
- img_proc: true
  md: "# Code Listing 16.3 You can use sed to strip out bad HTML tags, as shown here.\n\
    \n```\n[unixvsqs@LinuxMint scripting]$\n> more >thestinkinblinkintag\n#!/bin/bash\n\
    for i in $(ls -1 *.html)\ndo\n  cp $i.bak\n  sed \"/<\\/BLINK>/g\" $i.new\n  mv\
    \ $i.new\n  echo \"$i is done!\"\n[unixvsqs@LinuxMint scripting]$\n> chmod +x\
    \ thestinkinblinkintag\n[unixvsqs@LinuxMint scripting]$\n> ./thestinkinblinkintagnabove.html\
    \ is done!\nfile1.html is done!\nfile2.html is done!\nhtml.htm is done!\ntemp.htm\
    \ is done!\n[unixvsqs@LinuxMint scripting]$\n```\n\n+   - // ends the search section\
    \ and the replace section (there's nothing in the replace section because the\
    \ tag will be replaced with nothing).\n\n+   - g, which tells sed to make the\
    \ change in all occurrences (globally), not just in the first occurrence on each\
    \ line.\n\n+   - \", which closes the command.\n\n+   - $i, which is replaced\
    \ with each filename in turn as the loop runs.\n\n+   - $i.new, which indicates\
    \ that the output is redirected to a new filename. (See Code Listing 16.3).\n\n\
    7. mv $i.new $i\n\nMove the new file over the old file.\n\n8. echo \"$i is done!\"\
    \n\nOptional, print a status message onscreen, which can be reassuring if there\
    \ are a lot of files to process.\n\n9. done\n\nIndicate the end of the loop.\n\
    \n10. Save and close your script.\n\n11. Try it out.\n\nRemember to make your\
    \ script executable with chmod +x and the filename, and then run it with ./thestinkinblinkintag.\
    \ In our example, we'll see the \"success reports\" for each of the HTML documents\
    \ processed (Code Listing 16.3).\n\n> You could perform any number of other operations\
    \ on the files within the loop. For example, you could strip other codes, use\
    \ tidy as shown in the previous section, replace a former webmaster's address\
    \ with your own, or automatically insert comments and last-update dates."
  merge: -1
  pgno: 322
- img_proc: true
  md: "# Generating Reports with awk\n\nBack in Chapter 6, we showed you how to edit\
    \ delimited files with awk, which is cool because it lets you extract specific\
    \ pieces of information, such as name and phone numbers, from delimited files.\
    \ As shown in Code Listing 16.4, you can also use awk to generate reports. We\
    \ start with the information from an ls -la command, and then use awk to generate\
    \ a report about who owns what.\n\n# To generate reports with awk:\n\n```\nls\
    \ -la | awk '{print $9 \" owned by \" $3 } END { print NR \" Total Files\"}\n\
    ```\n\nWhew! In reality, pipe ls -la to the long-wind awk command. (Yes, this\
    \ is the origin of awkward.) awk then prints the ninth field ($), the words \"\
    owned by,\" then the third field ($3), and at the end of the output, the total\
    \ number of records processed (print NR \" Total Files\"). Code Listing 16.4 shows\
    \ the printed report.\n\nCode Listing 16.4 Use awk to generate quick reports.\n\
    \n```\n[unixvsqs@LinuxMint ~home]$ \n$ls -la | awk '{print $9 owned by \" $3 }\
