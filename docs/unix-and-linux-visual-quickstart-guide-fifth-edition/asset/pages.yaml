  md: '# Getting Started with Unix and Linux


    To start on your journey through Unix and Linux, we''ll take a quick look at a
    few basic concepts and commands. In this chapter, we''ll get you started with
    basic Unix and Linux skills, such as accessing an account, logging in, and listing
    and viewing files and directories, other things. We''ll also show you how to explore
