  md: '# Choosing a Unix or Linux flavor


    So, given all of those options for getting access to Unix and Linux, the choice
    of which kind of Unix or Linux (called a *flavor*) must be clear and straightforward,
    right?

    Of course not.


    If you''re just getting started, we recommend choosing the flavor that your most
    techie friends or the folks at work use. This will give you potential built-in
    tech support options.


    If you''re starting purely from scratch, look into the most popular and highly
    rated Linux distributions. (Currently, the website www.distrowatch.com provides
    a great set of recommendations, but as you know, websites change, so you might
    want to do some web searching for recommended Linux distributions.)


    Another interesting option is OpenIndiana, which is an open source offspring of
    Solaris, from Sun Microsystems and Oracle. For a while Solaris was a bit tricky
    (well, a lot tricky) to get installed and functional on a regular desktop system;
    however, OpenIndiana is now as easy as the easier Linux systems, and it offers
    a tremendous amount of power and flexibility, in addition to some cutting-edge
    technologies.


    That said, any option you choose will be pretty similar for the purposes of this
    book. Differences among the options primarily show up in more advanced applications.


    > **TIP** If you''re using OS X, you''re already using Unix—you just need to bring
    up a terminal window to be able to follow right along with the book.'
  merge: -1
