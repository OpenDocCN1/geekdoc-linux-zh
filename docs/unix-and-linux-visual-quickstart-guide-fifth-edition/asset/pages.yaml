  md: "# Logging In\n\nAfter you've connected to the Unix or Linux system, your next\
    \ step is to log in, or identify yourself to the Unix system. Logging serves a\
    \ few purposes, including giving you access to your email, files, and configurations.\
    \ It also keeps you from accessing someone else's files and settings, and keeps\
    \ you from making changes to the system itself.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_24_0.png)\n\
    \n+   A Unix system (fraz.raycomm.com) greets us with a quote of the day, called\
    \ \"fortune\".\n\nTo log in:\n\n+   1. Have your user (user identification) and\
    \ password ready.\n   Contact your system administrator if you don't have them.\n\
    2. Type your user at the login prompt, then press Enter.\n   Your user is case\
    \ sensitive, so be sure you type it exactly as your system administrator instructed.\n\
    3. Type your password at the password prompt (keeping in mind that you won't be\
    \ seeing anything typed on the screen), then press Enter.\n   Your password is\
    \ case sensitive.\n4. Read the information and messages that come up on—the screen.\n\
    \   The information that pops up—the message of day—might be funny or lighthearted,\
    \ or it might contain information about system policies, warnings about scheduled\
    \ downtime, or useful tips. It may also contain both—or possibly neither, if your\
    \ system administrators have nothing to say to you.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_24_1.png)\n\
    \n+   B Some systems greet you with information or helpful tips."
  merge: -1
  pgno: 24
- img_proc: true
  md: 'After you''ve logged in, you''ll see a shell prompt, which is where you type
    in commands. Also, note that you''ll be located in your home directory, which
    is where your personal files and settings are stored. Your "location" in the Unix
    or Linux system is a slightly unwieldy concept that we''ll help you understand
    this chapter.


    # The SSH Preferences Dialog Box


    In the SSH Preferences dialog box, you can fix some of the idiosyncrasies that
    are caused by how your ssh talks to the Unix system. You can''t identify these
    idiosyncrasies until you actually start using your system, but remember that you
    can fix some problems here. For example:


    > TIP If you get an error message after attempting to log in, just try again.
    You likely just mistyped your user or password. Remember, your ID and password
    are case sensitive.


    +   - If Backspace and Delete keys don''t work, look for an option in your ssh
    or telnet program that defines these keyboard functions.


    > TIP Contact your system administrator if you get warnings about exceeding the
    permitted number of failed logins. Your account would need special attention in
    this case.


    +   - If you start typing and nothing shows up onscreen, set local echo to on.


    +   - If you start typing and everything shows twice, set local echo to off.


    +   - If you want to be able to scroll up onscreen during your Unix system, change
    the buffer size to a larger number.


    > TIP When you log in, you might see a message about failed login attempts. If
    you unsuccessfully tried to log in, then don''t worry about it; the message confirms
    that you attempted to log in but failed. If, however, all your login attempts
    have been successful (with you sitting at the keyboard) or if the number of failed
    login attempts seems high—say, five—then you might also mention the message to
    your system administrator, who can check security and login attempts. This could
    be a warning that someone unauthorized is trying to log in as.


    Exactly which options you''ll have vary from program to program, but these are
    ones that are commonly available. Click OK when you''re finished playing with
    the settings.'
  merge: -1
