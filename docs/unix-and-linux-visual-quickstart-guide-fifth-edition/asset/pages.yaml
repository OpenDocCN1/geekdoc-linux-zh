  md: '# # Running Scripts and Programs


    Throughout this book, you''ve been running scripts and programs by typing commands
    and pressing Enter. The commands zoom along to the Unix or Linux system, which
    responds by obediently doing whatever the command or script dictates. In doing
    this, you run the commands and scripts—called jobs in this context—right and there.


    You can also run jobs at specified times; run them on a schedule you set up; or
    start, stop, or delete them as you choose. Plus, you can find out when they are
    scheduled to run, how long they take, or monitor them as they run. Sound cool?
    Great! Let''s take a look.


    +   * Running a Command (172)

    * Scheduling Onetime Jobs with at (173)

    * Scheduling Regularly Occurring Jobs with cron (176)

    * Suspending Jobs (178)

    * Checking Job Status with jobs (179)

    * Running Jobs in the Background with bg (180)

    * Running Jobs in the Foreground with fg (181)

    * Controlling Job Priority with nice (182)

    * Timing Jobs with time (183)

    * Finding Out What Processes Are Running with ps (185)

    * Deleting Processes with kill (187)'
