    \ line, insert text by typing it, and use `Backspace` or `Delete` to delete text.\
    \ When you've fixed the command, press `Enter` (you don't even have to be at the\
    \ end of the line to do so).\n\n# 4. history\n\nType **history** at the shell\
    \ prompt to see a numbered list of previous commands you've entered.\n\n> TIP\
    \ Commands from the current session are kept in memory to scroll through, while\
    \ commands from previous sessions are kept in the ~/.bash_history file. You can\
    \ edit ~/.bash_history with any editor to delete unneeded commands or simply delete\
    \ the file to get rid of the whole history file, which will be re-created with\
    \ the next command you issue. (A history of commands is a great jumping-off point\
    \ to write a script to do the commands automatically. Chapter 10 gives you specifics.)\n\
    \n> TIP When you're viewing the history, you can recycle commands by typing an\
    \ exclamation point (!) and the line number of the command you want to run again.\
    \ You'd type !40, for example, to rerun command 40.\n\n> TIP Use history followed\
    \ by a number to specify the number of items to list. For example, history 10\
    \ shows the last 10 commands."
