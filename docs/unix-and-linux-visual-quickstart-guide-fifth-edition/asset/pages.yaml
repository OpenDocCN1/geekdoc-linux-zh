  md: '# Accessing a Unix System


    Using a shared Unix or Linux system is different from working on a personal computer.
    When you''re using a personal computer, in general, the computer''s hard drive
    is your personal space, and—generally—you don''t have access to what''s on someone
    else''s system. With Unix or Linux, you have your own personal space that''s located
    within a much bigger system.


    You might think of Unix as an apartment building, with lots of individual apartment
    spaces, a central office, and perhaps other general spaces, like a maintenance
    office. With Unix, you have the entire system, which houses dozens, hundreds,
    or even thousands of personal spaces, as well as private spaces for, say, the
    system administrator, bosses, or IT (Information Technology) department staff.
    You can access only your apartment, but the system administrator (or designated
    people with authorization) can access any apartment.


    Of course, if your Unix or Linux system is just installed in a virtual machine
    (under VirtualBox or VMware) on your computer, then you still have full run of
    the system because you are your own system administrator. This book will sharpen
    those sysadmin skills!'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'People choose to use Unix or Linux for a number of reasons:


    +   - **Control**: Unix and Linux offer users more control and customization on
    the legal and licensing side as well as on the "getting stuff done".


    +   - **Economy**: Many flavors of Unix and Linux offer very friendly licensing
    terms, in which the operating system is free to use, or even free to use and for
    programmers to take and modify.


    +   - **Power**: Experienced geeks can do more with less effort on Unix or Linux
    than on Windows—for many things, at least.


    In the final analysis, though, most Unix or Linux people end up sticking with
    it because they tried it, slogged through the initial learning curve, and then
    decided they like it.


    # Different types of Unix and Linux access


    So, the first question is how you might access a system to get started with all
    of this. Given that this is Unix, you have many options:


    +   - Connect to a shell account.


    +   - Access your company''s (or school''s or organization''s) Unix or Linux system.


    +   - Use it on your Mac.


    +   - Use a live CD, such as an Ubuntu or OpenIndiana CD.


    +   - Do a Unix or Linux installation in a virtual machine on your computer.


    +   - Do a Unix-only installation on an old or spare computer.


    +   - Do a Unix/Windows installation on your everyday computer.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Accessing a shell account


    The traditional approach (back in the olden days, when we wrote the first version
    of this book) was to connect to a "shell account" provided by your dialup ISP.
    That''s still an option, if you have certain ISPs (and even with broadband connections).
    If your ISP offers a shell account, go ahead and use it; it''s still a good option.
    Try an online search for "Unix shell account" as well.


    # Accessing your company''s system


    If your ISP does not offer a shell account (if you have a modem, DSL connection,
    or dial-up connection through any of the huge companies that provide internet
    access, your ISP does not offer a shell account), you have a ton of options. Check
    at work; many companies use Unix and Linux in a number of ways, and if you can
    provide the system administrator with appropriate quantities of cookies or other
    goodies, you may be able to get system access.


    # Installing Unix or Linux on an old or spare computer


    Alternatively, if you''d rather keep your Unix or Linux explorations closer to
    home, you can manage that as well. If you have an older computer sitting around
    (say, anything that''s a Pentium III or later), you can install Unix or Linux
    on that, and likely without hassles or problems. You could make it work on even
    older computers, but given how cheap new and used computers are, it''s likely
    not worth the trouble. Either way, you''ll download a CD or DVD from the web,
    burn it onto a disc or copy it to a USB flash drive, and boot your system from
    that device. The installation will start, and a few questions and a few minutes
    later, you''ll be all set.'
  merge: -1
