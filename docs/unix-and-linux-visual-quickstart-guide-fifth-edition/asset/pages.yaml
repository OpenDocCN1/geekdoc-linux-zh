    ![](img/fff2eea2e42bd82cdabda71c69c59f13_265_0.png)


    > If you access a lynx-unfriendly page, like the one shown in 🅱, press ⇩ to scroll
    down a few times. Usually you''ll be able to find the content.


    Some sites are considerably less friendly than others if you''re not using graphics.


    # Navigating with lynx


    +   - ⏎ (or Enter) follows the currently highlighted link to a new page.

    - ↩ returns to the previous page.

