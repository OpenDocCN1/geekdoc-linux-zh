  md: '# Using Advanced Redirection

    with stderr


    Throughout this book, we''ve been redirecting input to output, piping the output
    of one command to the input of another, and generally getting fairly fancy. Can
    you believe that there''s even more you can do with redirection?


    Unix provides three channels (technically known as file descriptors) for communication
    between the user and the system:


    +   - Standard input (stdin), which refers to providing information or accepting
    information from the shell prompt or a different program.


    +   - Standard output (stdout), which refers to the output you see whring by your
    screen after you issue a command—for example, if you issue the command `find /
    -name test`.


    +   - Standard error (stderr), which includes error messages you might see whir
    by your screen after you issue a command. You might think of this channel as the
    "second" output channel.


    Until now, you''ve been redirecting `stdin` and `stdout` with `<`, `>>`, and sometimes
    `tee`. Everything on `stderr` has just accompanied `stdout`. Adding separate redirection
    of `stderr` to your arsenal can make your Unix experience even more flexible.'
  merge: -1
  pgno: 333
- img_proc: true
  md: "# To redirect stderr in zsh, bash, and similar shells:\n\n+   1. time -p ls\n\
    \   Use the time utility, covered in Chapter 9, and note that you get both the\
    \ output of ls and the output of time. As it happens, the output of time is on\
    \ the stderr channel, although you can't see that (all the output just shows up\
    \ on the screen).\n2. time -p ls 2> time-results.txt\n   Where you'd usually put\
    \ a > to redirect everything to a file, use 2> redirect the second output channel\
    \ to a file. Now you'll get the output of ls stdout on your screen, and the output\
    \ of time, sent to stderr, in time-results.txt (Code Listing 16.9).\n\nCode Listing\
    \ 16.9 Redirecting standard output and standard error separately can be handy.\n\
    \n```\n[jdoe@sulley Project]$ ls\nkeep keeper.jpg kidder.txt kiddo kidneypie kids\
    \ kidupate\n[jdoe@sulley Project]$ time -p ls\nkeep keeper.jpg kidder.txt kid\
    \ kiddo kidneypie kids kidupate\nreal 0.00\nuser 0.00\nsys 0.00\n[jdoe@sulley\
    \ Project]$ time -p ls 2> time-results.txt\nkeep kept kiddo kidneypie kidupate\n\
    keeper.jpg kidder.txt kidnews kids time-results.txt\n[jdoe@sulley Project]$ time\
    \ -p ls 1 > /dev/null\nreal 0.00\nuser 0.00\nsys 0.00\n[jdoe@sulley Project]$\
    \ time -p ls >/dev/null 2>&1\n[jdoe@sulley Project]\n```\n\ncontinues on next\
    \ page"
