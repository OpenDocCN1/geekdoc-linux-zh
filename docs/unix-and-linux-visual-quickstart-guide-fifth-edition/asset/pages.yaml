  md: 'Code Listing 15.3 Becoming root is remarkably easy.


    ```

    unixvsqs@LinuxMint $ su

    Password:

    [root@LinuxMint]# exit

    unixvsqs@LinuxMint ~ su -

    Password:

    [root@LinuxMint]#

    ```


    # Becoming root with su


    Becoming root, assuming that you know the root password, is really quite easy.
    To do so, you apply the su command (introduced in the "Changing your Identity
    in Chapter 3), where you change to the root identity (Code Listing 15.3).


    Once again, we want to stress that being root on a Unix system carries it a lot
    of responsibility. First, you must be extraordinarily careful about what you type
    and where you type it. Every system administrator has a horror story about wrecking
    a system (to a greater or lesser degree) through careless use of the root shell.
    Second, you must be very responsible for what you do. You can read, see anything,
    and change anything. You can, therefore, easily infringe upon the privacy of your
    users. Don''t.


    As with using su to become yourself (or another user), you can use su - ensure
    that all the root environment variables are set correctly. If you use su without
    the hyphen, environment variables and the like will be for only the root identity
    and not you. Which is more appropriate depends on your situation. If you get unexpected
    error messages (file not found, for example) with one approach, try the other.


    Usually, you''ll have to log in to a system as you, and then become root. It''s
    a rare system that will allow you to log directly in remotely root. Again, this
    is a security measure to help minimize the possibility of breaks. Even if someone
    gets the root password on a system, they can''t act as root if they can''t log
    in as a normal user.


    There are no real secrets on a Unix system. If you have something that must be
    a secret, you must encrypt it, or the root user (as well as other users) could
    know it.


    # To become root:


    +   1. su

    Enter su to become root.

    2. ******

    Enter the root password when prompted. Note that, after succeed, you''ll see a
    different prompt (#). This is your confirmation that you succeeded and are now
    root (Code Listing 15.3).


    +   3. exit

    Use exit or Ctrl+D to exit the root shell and become yourself again.


    Becoming Root 291'
