  md: '# Getting Back to Your Place with screen


    One of the challenges of working in a remote terminal session is that if the connection
    breaks (because the Wi-Fi connection at the coffee shop failed, for example),
    you''ve completely lost the context of what you were doing. Unsurprisingly, there''s
    a tool to fix that.


    The screen utility lets you easily start a session that you can reconnect whenever
    you want, and it''s easy to use. Using screen and various flags, you can start
    a screen session


    # To start a screen session with screen:


    ```

    screen

    ```


    To start a screen session, just type screen. Every command you type next will
    be part of the screen session, and you can get back to it as needed.


    # To detach from a screen session


    ```

    Ctrl+A D

    ```


    Use Ctrl+A (to enter command mode, much like Esc for vi), then D to detach from
    the screen session.'
  merge: -1
  pgno: 297
