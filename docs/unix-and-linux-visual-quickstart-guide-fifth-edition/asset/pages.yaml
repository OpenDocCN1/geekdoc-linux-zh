  md: '# # Checking Boot Messages with dmesg


    Sometimes you might need extra information, beyond what is available on the running
    system, about the configuration or the hardware. The system automatically probes
    the hardware and generates all kinds of potentially useful information at that
    time but keeps it away in the bowels of the system. Use **dmesg** to get at what
    you need...in appalling detail.


    To check status with **dmesg**:


    +   - **dmesg | more** (with the help of more) to gain some insight into the system
    (Code Listing 15.6).

    - or

    - **dmesg | mail -s "Help me understand" goodfriend@example.com**

    Send the output of **dmesg** to a friend for advice, if you''re really stuck.


    > > TIP See Chapter 11 for more information about mailing files and data from
    the command-line.'
