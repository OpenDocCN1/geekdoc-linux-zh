  md: '# # Scheduling Regularly Occurring Jobs with cron


    Suppose you want to send yourself a reminder message before you go home at the
    end of each day—say, a reminder to turn off the coffeespot. Or, suppose you want
    to make a backup copy of specific files each week. You can do this by using the
    `crontab` command to schedule commands or scripts to run regularly at times you
    specify. In doing so, you can schedule tasks to occur on specific days at specific
    times and know that the jobs happen unattended


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_189_0.png)


    > > The **cron** file, is which you specify the **cron** job, opens in your default
    editor. If you''ve previously specified **cron** jobs, they''ll show up in the
    editor.


    # ## What Are Those Funky Numbers?


    When entering a **cron** job, you specify


    +   - Minutes (0–59)

    - Hours (0–23)

    - Day of the month (1–31)

    - Month (1–12)

    - Day of the week (0–6, with Sunday as 0)


    If you replace the number with a *, **cron** will match all possible values, so,
    if a job is scheduled for


    +   - `1 * * * *`, it will happen at one minute after every hour

    - `15 3 * * *`, it will happen at 3:15 a.m. every day

    - `59 23 31 * *`, it will happen at 11:59 p.m., seven times a year (once in each
    of the months with a 31st)

    - `0 12 * * 0`, it will happen at noon on Sundays


    You can use a comma to separate multiple values. For example, if you want to something
    on the hour and half-hour during December, you might use `0,30 * * 12 * *`.

    Use a hyphen (-) to indicate a range. For example, to schedule something every
    hour from 9 a.m. to 5 p.m. every day, use `0 9-17 * * *`.'
  merge: -1
  pgno: 189
