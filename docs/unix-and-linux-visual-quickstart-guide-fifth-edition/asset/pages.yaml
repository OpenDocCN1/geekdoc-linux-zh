  md: '# Controlling Ownership and Permissions


    Unix, Linux, and Unix-like operating systems are multiuser systems in which your
    files are separate from Jane''s files, which are separate from Joe''s files, and
    so on. Any file you create is separate from other users'' files and usually cannot
    be directly accessed by Jane, Joe, or any other user. The file permissions determine
    what you can see, access or use.


    Occasionally, though, you''ll need to share files. For example, you might be collaborating
    with Jane on a project for which sharing files (rather than creating and maintaining
    others) is essential.


    This chapter provides an overview of Unix and Linux file permissions and ownership.
    For many systems, only the root user can make ownership changes, so you may have
    to ask for help from your system administrator to do this.


    # In This Chapter


    | Understanding File Ownership and Permissions | 90 |

    | Finding Out Who Owns What | 91 |

    | Finding Out Which Group You''re In | 94 |

    | Changing the Group Association of Directories with chgrp | 96 |

    | Changing Ownership of Files and Directories with chown | 98 |

    | Changing Permissions with chmod | 100 |

    | Translating Mnemonic Permissions to Numeric Permissions | 103 |

    | Changing Permission Defaults with umask | 105 |'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Understanding File Ownership and Permissions


    Unix and Linux provide three levels of file ownership:


    +   - **User.** Refers to the single userid that''s primarily in charge of the
    file. You have this level of ownership for the files you create.

    - **Group.** Refers to the group (of users) associated with a specific file. All
    users within a group have the same permissions for interacting with a file.

    - **Other.** Refers to any users not identified with either the group or user
    for a file.


    Within these levels, you can specify permissions for file access and rights in
    three categories:


    +   - **Read.** Users with read permission can view a file; they cannot make changes
    to it.

    - **Write.** Users with write permission can make changes to or delete a file.

    - **Execute.** Users with execute permission can run files (programs or scripts)
    and view directories.


    In this chapter, we''ll show you some of the commands that can be used (sometimes
    by you, usually by the root user) to set ownership and permissions. Keep in mind
    that you can set or change any permissions for files you create and possibly for
    files created by others; however, exactly which permissions and ownership you
    can change depends on the system. Even if you don''t currently need to change
    file ownerships or permissions, you should take a quick read through this chapter
    to see what options might be available to you.


    > TIP An interesting twist on this whole ownership is that not all "owners" are
    people. Programs or processes run as a specific user, and if they create files,
    those files have permissions reflecting the individual and group membership of
    the program. See Chapter 9 for more information.


    > TIP Some Linux and Unix-like operating systems have additional or supplementary
    means of controlling access to specific files. Usually, though, you''ll know if
    such a system is in use. For now, just know that such things exist, the procedures
    in this chapter will handle 95 percent of your needs.'
  merge: -1
  pgno: 103
- img_proc: true
