  md: "# # Logging In to Remote Systems with ssh\n\nYou might already be using ssh\
    \ to connect to your Unix or Linux system. You can, though, use it to connect\
    \ and use any other computer system on the Internet (assuming you have rights\
    \ to log in it), as code Listing 12.1 shows.\n\nCode Listing 12.1 Use ssh to connect\
    \ securely to other systems on the Internet.\n\nTo connect to another computer\
    \ using ssh:\n\n+   - ssh server.example.com\n\nAt the prompt, type ssh followed\
    \ by the name of the system to which you want to connect.\n\n+   - Log in using\
    \ the instructions for accessing the system.\n\n Presumably, if you're accessing\
    \ a system over the Internet, you have some reason and permission to do so. In\
    \ some cases, you'll type the name of the application, or you might be using the\
    \ remote system just as you use the system from which you are connecting.\n\n\
    +   - After you've finished using the remote system, log out according to the\
    \ instructions and policies of the remote system. In other words, what the system\
    \ administrator tells you to do.\n\n```\n$doe@frazz joe$ ssh server.example.com\n\
    doe@server$ password:\nde/home/joe$ whoami\ndoe\ndoe/home/joe$ uname -a\ndoe/home/joe$\n\
    Linux server.example.com Else Is 2.4.19-ac4 #13 SMP\n- Sat Nov 16 05:30:56 MST\
    \ 2002 1686 unknown\n- unknown GNU/Linux\ndoe/home/joe$ logout\n$doe@frazz joe$\n\
    ```\n\n> TIP For help with ssh, type ssh at the prompt and look up the list of\
    \ options, or type man for more help. When you have an active session, use Enter?\
    \ (press keys sequentially, not simultaneously) to get help with the current session.\n\
    \n> TIP You can use the wall (Write ALL) command to send write-type messages to\
    \ everyone logged in the system. System administrators commonly use wall when\
    \ they need to warn people that the system is being brought down.\n\n> TIP Use\
    \ w to find out who is logged into the system. See the sections \"Learning Who\
    \ Is Logged In with\" and \"Learning Who Is Logged In with w\" in Chapter 7 for\
    \ more information.\n\n> TIP If you have a different login name on the remote\
    \ system, you can specify that with ssh server.example.com -1 username to log\
    \ in more easily. Or, if it's easier to remember, try ssh username@server.example.com.\n\
    \n> TIP If you want to practice logging in remote systems, use your search engine\
    \ to search for \"free shell account\" and you'll find a trove of valuable resources."
  merge: -1
