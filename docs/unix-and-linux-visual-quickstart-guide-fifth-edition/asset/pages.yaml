    This chapter is essential for all Unix or Linux guru-wannabes. If you''re a Unix
    or Linux novice, you should start at the beginning of this chapter and work through
    each section. With these basic skills mastered, you can then skip through this
    book and learn new skills that look useful or interesting to you. If you''ve used
    Unix or Linux before, you might skip this chapter to review the basics and dust
    off any cobwebs you might have.


