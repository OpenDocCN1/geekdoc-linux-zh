  md: 'We assume that


    +   You want to know how to use Unix or Linux to do things at work, school, or
    home.


    +   You may or not already have experience with Unix or Linux.


    +   You don''t necessarily have all geeky—er, techie—computer skills or experience.


    +   You want to learn Unix or Linux but probably do not want to delve into all
    the arcane deets of the system.


    Alternatively, you can dabble in Unix less invasively by using an account on a
    system or work through an Internet service provider. If you have a reasonably
    new computer and are concerned about messing up what you have, though, the easiest
    options are to


    +   Use Cygwin to run Unix as part of your Windows environment


    +   Use VirtualBox or a similar program to run Unix in a "virtual machine" as
    an application in your Windows environment


    +   Use a bootable Unix (Linux will be the easiest) CD to experiment without installing
    anything at all on your computer (and save files to a flash drive as needed)


    In short, we assume you want to use Unix or Linux to achieve your computing goals.
    You want to know what you can, get an idea of the potential that a command offers,
    and learn how to work smart. Very smart.


    You can do all these things using this book. Basically, all you need is access
    to an account or system and a goal (or goals) that you want to achieve.


    # What Do You Need to Get Started?


    # What Do You Need Computer-Wise?


    As you get started learning Unix or Linux, keep in mind the following Unix and
    Linux conventions for typing commands:


    +   The terminology and commands are typically arcane, cryptic, and funny-looking.
    For example, the command to list files or directories is 1—short and cryptic.
    (The command 1 is also short for list, as in "list the files.") Many commands
    have these logical derivations)We''ll walk through the commands one step at a
    time so that you know how to read them and apply them to your own uses. Just follow
    the steps in the order provided.


    You can learn or experiment with Unix using virtually any computer you might have.
    If you''re using a Mac with OS X, you''re all set; it''s all Unix under the hood.
    If you have an extra computer sitting around, even something as old as a Pentium
    III, you can install several flavors of Unix or Linux, including Solaris, OpenIndiana,
    Ubuntu, Red Hat, or SuSE. Certainly you can install Unix or Linux on an extra
    drive (empty space on your current hard drive) on your regular desktop computer,
    and generally without affecting your existing Windows configuration.'
  merge: -1
  pgno: 12
