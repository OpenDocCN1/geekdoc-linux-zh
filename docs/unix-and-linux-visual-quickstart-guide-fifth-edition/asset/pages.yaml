  md: '# Removing Files with too rm


    You can easily—perhaps too easily—remove (delete) files from your Unix system.
    Murphy will tell you, it''s a good idea to think twice before doing this; once
    you remove a file, it''s gone (unless, of course, you plead with your system administrator
    to restore it from a backup—that''s another story). At any rate, it''s permanent,
    unlike deletions in Windows or in the Mac OS GUI (but not the Unix command line),
    or even in many Unix desktop environments like GNOME or KDE, where Recycle Bin
    or Trash gives you a second chance.


    You remove files using rm, as shown in Code Listing 2.9. And, as you''ll see in
    the following steps, you can remove files one at a time or several at a time.


    # To remove a file:


    +   1. ls -l

    List the files in the current folder to verify the name of the file you want to
    remove.


    +   2. rm -i soon.to.be.gone.file

    At your prompt, type rm -i followed by the name of the file you want to remove.
    The -i tells the system to prompt you before removing the files (Code Listing
    2.9).


    +   3. ls

    It is gone, isn''t it?


    ```

    Code Listing 2.9 Use rm -i to safely and carefully remove directories and files.

    $ ls

    afile oldfile

    newfile soon.to.be.gone.file

    $ rm -i soon.to.be.gone.file

    rm: remove ''soon.to.be.gone.file''? y

    $ ls

    afile newfile oldfile

    ```'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'If you have system administrator rights (or are logged in as root rather than
    your userid), be extremely careful when using rm. Rather than remove your personal
    directories or files, you could potentially remove system directories and files.
    Scope out the sidebar "Can You Really Screw Up the System?"


    # To remove multiple files:


    +   1. ls -l *.html


    List the files to make sure you know files you want to remove (and not remove).


    +   2. rm -i *.html


    Using the asterisk (*), you can remove multiple files at one time. In this example,
    we remove all files in the current directory that end with .html. (Refer to Chapter
    1, the section called "Using Wildcards," for details about using wildcards.)


    This is a good time to use the handy cp command to make backups of anything you
    value—before experimenting with rm. If the system administrator keeps backups,
    it''s so much easier if you need an extra copy of your goodies settled. Try cp
    -r backup_files for a space-hoging—but effective—means of making a backup of everything
    in the current directory without files ignore the error message about not copying
    a directory into itself; the system will do the right thing for you, and you don''t
    have to worry about it.)


    +   1. rm -i dangerous


    -i specifies that you''ll be prompted to verify the removal of a directory or
    file named dangerous before it''s removed.


    or


    We suggest using rm -i, at least until you''re comfortable with irrevocable deletions.
    The -i flag prompts you to verify your command before it''s executed.


    +   2. rm -ir dan*


    This risky command removes all the directories or files that start with dan in
    the current directory and all the files and subdirectories in the subdirectories
    with dan. If you''re sure, use the -i flag to just have the files removed without
    prompting you for confirmation. (Remember that the flag -ir could be written as
    -i -r -ri or -r -i. Unix is rather flexible.)


    Check out Chapter 8 to find out using aliases with rm so that the system always
    prompts you before removing the directories or files if you forget the - flag.


    If you accidentally end up with a file that has a problematic filename (like one
    that starts with -, which looks to Unix like a command flag, not a filename),
    you can delete it (with a trick). Use rm -i -- filename to get rid of it.'
