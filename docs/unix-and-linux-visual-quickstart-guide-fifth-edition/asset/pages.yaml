  md: '# # Getting Help with man


    Occasionally, you may need a bit of help remembering a particular command does.
    Using man (which is short for "man-manual"), you can look up information about
    commands and pointers for using them efficiently. A man page (also called a man
    page, for obvious reasons) for passwords. In the following steps, we''ll show
    you how to look up specific Unix commands and find related topics.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_41_0.png)


    # ## To access a man page:


    man password


    At the prompt, type man plus the name of the command you want help with (in this
    case, password). You''ll get the man page for that command. Use the Spacebar and
    the B (for Back) key to navigate the file, just as you do with more.


    # ## To find a specific man page:


    +   1. man -k password


    Type man k plus the name of the command or the topic you want help with (in this
    case, password). As Code Listing 1.9 shows, you''ll see a list of possible man
    pages: command names, man names, and a description. Note the man page name (and
    number if more than one page with the same name exists) so you can reference it
    in the next step.'
