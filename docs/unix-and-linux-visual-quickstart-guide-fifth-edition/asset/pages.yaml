  md: '# Changing the Group Association of Files and Directories with chgrp


    Suppose you have a file called **black** that is currently being used by the **pot**
    group and you want to change the file''s permissions so that it can be accessed
    by the **kettle** group. To do this, you''ll need to change which group the file
    is associated with—in this case, change the association from the **pot** group
    to the **kettle** group. You can change which group a file or directory is associated
    with using **chgrp**, as shown in Code Listing 5.5.


    To change group association with **chgrp:**


    +   1. `ls -l`


    Type `ls -l` at the shell prompt to verify the file''s name and group it''s associated
    with. Remember that the second column—in the middle of the listing, just before
    the file sizes—lists the group membership.


    **Code Listing 5.5** *pots and kettles can both be black, but only one at a time.*


    ```

    [ej@hobbes permissions] $ ls -l

    total 178

    -IW-IW-R- 1 ejr pot 24850 Jul 24 14:59 black

    -IW-IW-R- 1 ejr ej 128888 Jul 24 14:33 sage.sayings

    -IW-IW-R- 1 ejr ej 23890 Jul 24 14:33 sayings

    [ej@hobbes permissions] $ chgrp kettle black

