  md: '# Using Wildcards


    You might think of wildcards for omitted letters or numbers. For example, you
    could list the files of a directory with **ls kid* (Code Listing 7)**, which would
    list all files starting with the character *kid*. In the resulting list, you find
    a file named *kid* if there were one, as well as files that begin with *kid* but
    have varying endings, such as *kidness*, *kiddo*, or *kidneypie*.

    You can use wildcards for just any purpose in Unix, although listing files and
    directories will likely be the most common use. Just follow these guidelines:


    +   - You use ? as a placeholder for one character or number.

    - You use * as a placeholder for zero or more characters or numbers. Zero characters,
    in case you''re curious, specifies that the search results include all variants
    of *kid*, including the word itself with no suffix.

    - You can include a wildcard at any place in a name: at the beginning (*kid*),
    where in the middle (*k*d*), at the end (*kid*), or even in multiple places (*kid*).


    **Code Listing 7** $ ls use wildcards (? or *) to act as placeholders for missing
    characters.


    ```

    [jdoe@fraz Project]$ ls

    Keep keeper.jpg kidder.txt kiddo kiddos kidneypie kids kidupdate

    [jdoe@fraz Project]$ ls ki*

    kidder.txt kiddo kidneypie kids kidupdate

    [jdoe@fraz Project]$ ls kid*

    kidder.txt kiddo kidneypie kids kidupdate

    [jdoe@fraz Project]$ ls kid???

    Keep kept kids

    [jdoe@fraz Project]$ ls *date

    kidupdate

    [jdoe@fraz Project]$ ls *up*

    kidupdate

    [jdoe@fraz Project]$ ls kid*

    kidder.txt kiddo kidness kidneypie kids kidupdate

    [jdoe@fraz Project]$

    ```'
  merge: -1
