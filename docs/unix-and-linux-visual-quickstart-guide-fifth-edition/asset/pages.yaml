  md: '# # Starting vi (or vim) and Dabbling with It


    Before you go running off to vi, understand that it has two modes (both of which
    look pretty much like A):


    The vi editor inundates with tons of onscreen help and advice, as shown here.
    Well, documentation is available, but the vi interface itself isn''t really helpful
    at all!


    +   - **Insert mode** (sometimes called input mode), in which the keys you press
    actually show up in the file that you''re editing. You use this mode to add or
    change text.


    +   - **Normal mode** (sometimes called command mode), in which every keystroke
    is interpreted as a command. You use this mode to do everything except enter text.


    What''s confusing for many people vi is that it starts you in command mode, meaning
    that if you just start typing, you may see some blank spaces, characters, and
    bits of words that you type—essentially, a bunch of garbage that does not exactly
    represent what you''re typing—and you''ll hear a lot of beeping. So, as we''ll
    show you in the following steps, you''ll need to access the insert mode as soon
    as you start vi.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_94_0.png)'
