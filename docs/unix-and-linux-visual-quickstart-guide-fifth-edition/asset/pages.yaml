  md: "# Naming Directories (and Files)\n\nAs you start creating directories (and\
    \ files), keep in mind the following guidelines:\n\n+   - Directories and files\
    \ must have unique names. For example, you can not name a directory Golf and a\
    \ file Golf. You can, however, have a directory named Golf and a file named golf:\
    \ the difference in capitalization makes each unique. By the way, directories\
    \ are often named with an initial cap, and filenames are all lowercase.\n- Directories\
    \ and filenames can, but generally not include the following characters: angle\
    \ brackets (< >), braces ({ }), brackets ([\\]]), parentheses (()), double quotes\
    \ (\\'\\'), asterisks (*), pipe symbols (|), slashes (/), carets (^), exclamation\
    \ points (!), pound signs ($), ampersands (&), and tildes (-).\\ Shell handles\
    \ special characters differently, and will have no problems at all with these\
    \ characters. Generally, though, special characters are more trouble than they're\
    \ worth.\n- Avoid names that include spaces. Some programs do not work with them\
    \ correctly, so to use spaces you have to use workarounds; for example, surrounding\
    \ a filename with quotation marks. Instead, consider using periods (.) and underscores\
    \ (_) or numbers.\n- Use names that describe the directory's or file's contents\
    \ so you easily remember them.\n\n# To create a directory:\n\n+   1. 1ls\n   Start\
    \ by listing existing directories to make sure the planned name doesn't conflict\
    \ with an existing directory or filename.\n2. mkdir Newdirectory\n   Type the\
    \ mkdir command to make a new directory; in this case, it's named Newdirectory.\
    \ Refer to the sidebar \"Naming Directories (and Files)\" guidelines.\n3. 1ls\
    \ -l\n   Now you can use ls -l (the -l flag specifies a long format) to look up\
    \ the listing for your new directory (Code Listing 2.1). The d at left of of Newdirectory\
    \ indicates it's not a file. Of course, if you trust Unix or Linux to do so, you\
    \ can skip this verification step.\n\n> TIP If you attempt to create a directory\
