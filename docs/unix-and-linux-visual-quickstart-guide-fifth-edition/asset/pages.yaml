  md: "# Suspending Jobs\n\nSuppose you've just started a job that requires no input\
    \ from you—say, downloading multiple files with ftp—and you suddenly realize you've\
    \ got to finish something right now. Instead of waiting for the files to download\
    \ or stopping the job completely, you can instead suspend the job and resume it\
    \ later (Code Listing 9.5). In doing so, you can make the Unix system work your\
    \ way—that is, you don't lose the progress you've made getting the job done, and\
    \ you can do the other stuff you need to do as well.\n\n> TIP After you've suspended\
    \ a job, you can restart it in the background using bg, restart it in the foreground\
    \ using fg, check on its status using jobs, or delete it completely using kill.\
    \ Refer to the appropriate sections in this chapter for details on using these\
    \ commands.(Note that if the suspended job requires input from you, as the FTP\
    \ example above does, then it will be immediately re-suspended if you try to restart\
    \ it in the background.)\n\n# To suspend a job:\n\nWhile the job is running, press\
    \ these keys to suspend the process (Code Listing 9.5). Ctrl+Z doesn't terminate\
    \ the process; it pauses the job in the same way that pressing the Pause button\
    \ on your iPod pauses the song.\n\n> TIP You can suspend as many jobs at a time\
    \ as you want. Use Ctrl+Z to do so, use jobs to check the status of each suspended\
    \ job if you need to.\n\n> TIP Because you've suspended a job, most shells will\
    \ remind you that \"there are stopped jobs\" when you try to log out of the system.\
    \ You should either resume the job or kill it before you log out. The Unix system\
    \ uses the terms \"stopped jobs\" and \"suspended jobs\" interchangeably.\n\n\
    Code Listing 9.5 Suspending jobs is just like pushing the Pause button on your\
    \ favorite music device.\n\n```\n[ejhobbes ej$ ftp calvin.ray.com\nConnected to\
    \ calvin.ray.com.\n220 calvin Microsoft FTP Service (Version 2.0)\nName (calvin.ray.com:ej):\
    \ anonymous\n331 Anonymous access allowed, send identity (e-mail name) as password.\n\
    Password:\n230 Anonymous user logged in.\nRemote system is Windows_NT.\ntfp:\n\
    [1]+ Stopped ftp calvin.ray.com\nejrhobbes ej$ \n```"
  merge: -1
