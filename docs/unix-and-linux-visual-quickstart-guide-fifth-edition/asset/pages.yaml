  md: '# Table 5.1 Numeric Equivalents for Mnemonic Permissions


    | Mnemonic Permissions (rwx) | Binary Equivalent | Numeric Equivalent |

    |------|---|---|

    | --- | 000 | 0 |

    | -x | 001 | 1 |

    | -w- | 010 | 2 |

    | -wx | 011 | 3 |

    | r- | 100 | 4 |

    | r-x | 101 | 5 |

    | rw- | 110 | 6 |

    | rwx | 111 | 7 |


    # Translating Mnemonic Permissions to Numeric Permissions


    The permissions of a file


    Each of these combinations of on/off permissions (or binary numbers) can be expressed
    as a unique decimal digit between 0 and 7, as shown in **Table 5.1**. This is
    this decimal digit that you use to set permissions.'
  merge: -1
