  md: '# Sharing Files on the Internet with ftp


    Sharing files on the Internet with ftp is similar to getting files; instead of
    retrieving files, however, you give files to other people (Code Listing 12.3).
    Do not note that ftp is not secure, so don''t use it to share passwords, bank
    statements, loan applications, or anything else that you do not want to have on
    the nightly news.


    Listing 12.3 Using put, you can share your files with other people on the Internet.


    ```

    [ejr@hobbes ejr]$ ftp put ftp.raycomm.com

