  md: '# Timing Jobs with time


    Sometimes, you might want to know how long a job takes to complete. You can do
    so using the time command, which times jobs according to the built-in Unix timer.
    As Code Listing 9.10 shows, all you have to do is enter followed by the command
    you want to time.


    # To compare a job using time:


    time slowscript


    At the shell prompt, type time followed by the complete command. After the command
    finishes, the system will tell you how long it took, as shown in Code Listing
    9.10.


    # To compare job times with time:


    +   1. time ls /usr


    At the shell prompt, type time followed by a job (here, ls).

    2. time nice -n 19 ls /usr


    Then, type time followed by another job. In this example, we''re comparing a regular
    ls command to a nice ls command. As Code Listing 9.10 shows, the elapsed time
    for the nice ls command was considerably longer than for the regular ls command.


    ```

    Code Listing 9.10 Enter time plus the full job

    command to find out the job time.


    [ej@hobbes running]$ time slowscript

    real            0m.003s

    user            0m.000s

    sys             0m.003s

    [ej@hobbes running]$ time ls

    bigdog.tar.gz slowscript      testing.gif

    real            0m.004s

    user            0m.001s

    sys             0m.002s

    [ej@hobbes running]$ time nice -n 19 ls

    bigdog.tar.gz slowscript      testing.gif

    real            0m.003s

    user            0m.006s

    sys             0m.003s

    [ej@hobbes running]$ time -p nice -n 19 ls

    real            0m.003s

    user            0m.004s

    sys             0m.003s

    [ej@hobbes running]$

    ```'
  merge: -1
