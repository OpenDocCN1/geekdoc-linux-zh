  md: 'The left column contains ten characters, the last nine of which specify permissions
    for each file:


    +   - **r** means read permission, **w** means write permission, and **x** means
    execute permission.


    +   - The first set of **rwx** is for the user, the second set is for the group,
    and the last set is for other.


    +   - A dash (-) instead of a letter indicates that the user/group/other does
    not have that level of permission. For example, **rw-----** would mean that the
    user has read, write, and execute permission, while group and other have no permissions
    at all.


    The two columns in the middle indicate the file''s owner (in all likelihood your
    userid, for this example) and the group membership for the file. In Listing 5.1,
    **ejrays** is the owner of all the files. Most of the files are associated with
    the **users** group, while just a few directories are associated with the **www**
    group.


    On this system, files that individual users create are associated with the **users**
    group, while files destined for the web have **www** group associations. On other
    systems, the default group for files might be a group with the same name as the
    userid, as shown in **Code Listing 5.2**.


    # Listing 5.2.


    The group name and username are the same, depending on how the system was set
    up.


    ```

    [ejr@hobbes permissions] $ ls -1

