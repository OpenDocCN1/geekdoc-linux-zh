  md: '# # Tracing Connections with traceroute


    When you''re connecting to a remote computer, you''re actually connecting through
    a series of computers (and routers and other expensive Internet stuff). That is,
    your computer connects to another computer, which connects to another, which connects
    to yet another, and so on until your computer connects to the one you''re trying
    to reach.


    The data that you''re sending or receiving meanders through the path in packets
    (little chunks of data) that are reassembled into the correct sequence at the
    other end. But not all packets take the same route from the sending to the destination
    computer. Communication on the Internet is much more like sending a lot of letters
    than making a phone call. It''s a bunch of little messages passed along, not a
    continuous connection.


    Using traceroute, you can satisfy your curiosity or possibly identify bottlenecks.
    How? You find out what route packets take to arrive at the destination computer,
    as shown in Code Listing 12.6. If,


    **Code Listing 12.6** *traceroute*, you can see how data meanders between your
    computer and a remote computer.


    ```

    e> traceroute www.yahoo.com

    taceroute to www.yahoo.com (204.71.200.75), 30 hops max, 40 byte packets

    1 198.60.22.1 (198.60.22.1) 8 ms 2 ms 3 ms

    2 903.Hss5i-0-GW1.SLT1.ALTER.net (157.30.160.141) 18 ms 13 ms 14 ms

    3 124.ATM-0-0.GW1.SF01.ALTER (137.39.68-9) 68 ms 65 ms 52 ms

    4 311.atn3-0-gw1.sf01.alter.net (137.39.13.49) 60 ms 50 ms 39 ms

    5 Hss5i-0.br1.NUQ.globalcenter.net (157.130.193.150) 40 ms 39 ms 28 ms

    6 pos0-0-155M.wr1.NUQ.globalcenter.net (206.132.160) 30 ms 48 ms 42 ms

    7 pos1-0-622M.wr1.SNV.globalcenter.net (206.251.0.74) 50 ms 67 ms 61 ms

    8 pos5-0-155M.cr1.SNV.globalcenter.net (206.251.0.105) 48 ms 40 ms 41 ms

    9 www10.yahoo.com (204.71.200.75) 43 ms 50 ms 53 ms

    eyray>

    ```'
