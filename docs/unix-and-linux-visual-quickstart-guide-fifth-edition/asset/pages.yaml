  md: '# Fill In Your zsh System Configuration Files


    2. Write down, for your reference, the system configuration files and the order
    in which they run. (Remember, settings in the last run override all previous ones.)
    Our system configuration files, all automatically called by the system, include


    +   - /etc/zhenv (or /etc/zsh/zhenv) then ~/.zhenv


    +   - /etc/zprofile (or /etc/zsh/zprofile) then ~/.zprofile


    +   - /etc/zshrc (or /etc/zsh/zshrc) then ~/.zshrc


    +   - /etc/zlogin (or /etc/zsh/zlogin) then ~/.zlogin


    Keep in mind that the files you have may differ from the files that we have.


    > Take special note of any lines in any of the files that end with a path and
    filename, or that reference other files directly, with something like /etc/profile
    on a line by itself. Each of those lines references another file that plays a
    role in setting you up. Notice that some of the lines reference others that do
    not configure your environment.


    > Some zsh files include oddities—like export HISTFILE=$HOME}/.bash_history line—reference
    the .bash_history file containing the list of commands you''ve run. (Looks like
    a goof by the Linux distributor. Good thing you''re checking up on them, huh?)


    > You can use grep to make it easy to find the configuration files that set your
    path. grep -i path ~/.z* is a good way to start.


    > If you see something like path=$HOME/bin) in your configuration files, that''s
    OK. Just go ahead and use the syntax shown on the following line anyway. It''s
    a feature of zsh that it understands about a bazillion different ways to express
    any single command.'
