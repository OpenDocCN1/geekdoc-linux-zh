  md: '# Creating and Editing Files


    Creating and editing files are likely the most common tasks you''ll perform in
    Unix or Linux. If you''re programming, developing webpages, sending email (uh-huh,
    really), writing a letter, configuring your environment (see Chapter 8), or just
    exploring the system, you''ll spend a lot of time in an editor.


    In this chapter, we''ll introduce two of the most common editors: nano and vi.
    We''ll launch this chapter with a general overview of each, and then discuss how-tos
    of using each one. With the information presented here, you''ll be able to choose
    an editor based on your needs and get started using it (or using both of them).


