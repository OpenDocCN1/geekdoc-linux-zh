  md: '- Unix and Linux are case sensitive, type commands following the capitalization
    used in the book.


    - Whenever you type a command, you also have to press Enter. For example, if we
    say


    - You can also put multiple commands on the same line. All you have to do is separate
    the commands with a semicolon ();) like this:


    ```

    ls; pwd

    ```


    ls would list the files in the current directory (ls) and find out what directory
    you''re in (pwd)—all in one step!


    +   1. **funny-looking command goes here**


    you''ll type the code, then press Enter, which sends the command along to the
    Unix system.


    Often, we''ll tell you to press a combination of keys on the keyboard, as is with
    Ctrl+V. Here, all you do is press the Ctrl (lowercase) V key at the same time.
    Even though the keyboard uses capital letters (and thus, the little key icons
    also do this in this book), you would not take the extra step to capitalize the
    V (or whatever) in applying combinations. If you really need to press Shift, we''ll
    show you.


    So, with these things in mind, see you in Chapter 1!


    # # Anything Else You Should Know?


    Yup! Please free to send us a message at unixvs@raycomm.com. We welcome your input,
    suggestions, and questions related to this book. Thanks, and we look forward to
    hearing from you!


    Some commands have arguments (also called options) associated with them (you might
    think of flags as modifiers for the command) that give you additional control.
    For example, you might see the ls -1a or ls -1 -a. In either case, ls lists the
    files in directory, the optional -1 specifies that you want the long format, and
    the optional -a specifies all files, including hidden ones (don''t worry, we''ll
    go over this again!). Just keep in mind that flags and arguments are essentially
    options you can use with a given command.


    # ## Note to Mac Users


    For simplicity, we consistently write Enter (not Return), Ctrl (not Control),
    and Alt (not Option), and we refer to (others, though) to a Recycle Bin (not a
    Trash Can). No slight intended to those who not use PCs or Windows—we just tried
    to keep the complexity of the instructions to a minimum.'
  merge: -1
