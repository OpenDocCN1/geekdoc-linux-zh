- img_proc: true
  md: 'Keep in mind that the time a job takes to run according to the system''s current
    load or capacity. For example, a job might take less time to run at 2 a.m., when
    few people are using the Unix system, compared with 2 p.m., when many people are
    using the system.


    Different systems produce slightly different outputs. On some systems, you''ll
    get real (clock) time, user time, and system time. Real time is how many seconds
    on the clock elapsed while the program was running, while user and system time
    both refer to different measures of how long it takes the system to run the job.
    On other systems, you might get a ton of supplemental information that looks like
    garbage, as shown in Code Listing 9.11, but the gist of information is the same.


    In the case of the ls example, you''re really not concerned with the output or
    the errors—just the time—so you can creatively dispense with all of it. Try `ls
    > /dev/null 2>&1` to send standard output to `/dev/null (the bitbucket)` and send
    error messages to standard output (and thence to the bitbucket). See Chapter 16
    for details.


    Try time -p to get a more human-readable output.


    Code Listing 9.11 time output varies from system to system. Here, we get a bunch
    of garbage to decipher in addition to the time information.


    ```

    $ time slowscript

    0.07user 0.05system 0:50.13elapsed 0%CPU (avgtext+avgdata Omaxresident)k

    0inputs+0outputs (219major+59minor)pagefaults 0swaps

    $

    ```'
