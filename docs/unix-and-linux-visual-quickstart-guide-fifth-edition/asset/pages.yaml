  md: '# Commands, Flags, and Arguments


    This appendix provides a list of many (but certainly not all) Unix and Linux commands
    and programs as well as the related command-line flags.


    In general, flags and arguments offer a thorough selection of options for programs
    that operate exclusively from command-line input, as well as an overview of the
    functionality for many other programs. Please keep in mind, however, that command-line
    options only touch the surface of the capabilities of interactive programs (like
    nano, vi, links and alpine) or particularly complex programs that rely on special
    expressions (such as grep or tr) or that use multiple files or sources for information
    (such as procmail).


    Table C.1 provides you with a brief reminder and starting point for learning more
    about these Unix and Linux commands. While the options we''ve included here on
    our systems, they will likely vary somewhat on different systems or different
    Unix or Linux versions, or with different shells. Check your local man pages for
    specifics.


    Note that multiple equivalent commands or options all appear on the same line,
    separated by commas. Additionally, multiple options (unless contradictory) can
    be used with all commands. The brackets [] indicate that one of the options enclosed
    may be used.'
