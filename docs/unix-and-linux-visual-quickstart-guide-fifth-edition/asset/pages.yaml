  md: '# Exiting the Shell


    When you''re finished with your Unix or Linux session, you need to exit the shell.
    If you''ve been playing with the su and shell commands, you might actually have
    shells within shells and need to exit from all of them. You all have to do is
    type exit once for each shell.


    # To exit from the shell:


    exit


    At the shell prompt, type exit. Ta-da!


    > TIP If you''re located at the login shell prompt, you could also type logout
    rather than exit. At all other shells, though, you need to type exit. In some
    cases, you could also press Ctrl+D, but that depends on your local system configuration.


    > TIP Be sure to log off rather than simply close your window or break your connection.
    It''s possible, if the settings at your host are seriously incorrect, that your
    session could remain open and someone else could pick up right where you left
    off with your session userid.'
