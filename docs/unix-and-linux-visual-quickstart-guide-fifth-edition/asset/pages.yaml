  md: '# To surf web with lynx:


    +   1. lynx http://www.cnn.com/


    At the shell prompt, type lynx followed by the name of an .html file or a web-site
    address. Here, we''re accessing the CNN website Ⓐ.


    If you only type in lynx, you''ll get the default page for your system, which
    is likely the lynx home page or the main page for your ISP.


    +   2. Surf, surf, surf!


    See the sidebars "Navigating with lynx" and "Useful lynx Keystrokes" in this section
