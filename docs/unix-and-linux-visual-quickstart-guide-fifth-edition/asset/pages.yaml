  md: "# Sending Email with alpine\n\nOur next favorite thing to do with alpine is\
    \ to send new messages. Commonly, you'll send messages after you've already started\
    \ alpine, but you can also start a new message directly from the shell prompt\
    \ (see the accompanying tips).\n\nTo compose and send a message using alpine:\n\
    \n+   1. alpine\n   Type alpine at the shell prompt to start alpine. If it isn't\
    \ already running.\n2. C\n   Press C to compose a new message.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_227_0.png)\n\
    \nPreparing a message in alpine is as easy as filling in the blanks.\n\n# Our\
    \ Two Cents on the Subject of Subjects\n\n+   - Always include a descriptive subject\
    \ line that succinctly summarizes the message's contents. For example, rather\
    \ than say \"Here you go,\" say \"Comments on the Baskins proposal.\"\n- Never\
    \ leave the subject line blank. Many people touch subjectless messages, thinking\
    \ that they might be spam or important not enough to read.\n- Never use ALL CAPS\
    \ in the subject line, or anywhere else, for that matter), as recipients may perceive\
    \ this as YELLED AT VERY LOUDLY.\n- Be aware of how spam filters work. Many ISPs\
    \ use them to reduce the amount of spam (bulk messages, like junk mail, that are\
    \ sent out to hundreds or thousands or even millions of people at the same time)\
    \ that goes through.\n  - Some filters are set to discard messages with subject\
    \ lines in ALL CAPS.\n  - Other filters discard messages with a lot of exclamation\
    \ points in the subject.\n  - Many filters eliminate messages with subject lines\
    \ that sound \"spammy,\" like \"Make money now,\" \"Eliminate bad credit,\" \"\
    This isn't spam,\" \"Lose weight now,\" and the like. Obviously, many phrases\
    \ and subjects that are not appropriate to print here in this book would also\
    \ be discarded."
  merge: -1
