    > TIP Some versions of tar also support gzip, so you can use tar -czf tarredfilename.tgz
    Feather to tar and gzip all at once.


    > TIP You can add the v flag to the tar command flags (-v) to get a verbose description
    of what''s being tarred.


    > TIP If you want to sound like a real Unix geek, refer to tarred files as “tarballs."'
