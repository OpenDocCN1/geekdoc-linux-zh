  md: '# # Unzipping a gzip File with gunzip


    To access gzipped files, you''ll need to unzip them. You do so using gunzip, as
    Code Listing 13.11 shows.


    # ## To unzip a gzip file with gunzip:


    +   1. `ls -l *.gz`


    At the shell prompt, verify the name of the gzipped file with `ls -l` (Code Listing
    13.11).


    +   2. `gunzip zipadeedoodah.tar`


    Enter gunzip and the name of the file to unzip. `gunzip` will uncompress the file(s)
    and return you to the shell prompt.


    > TIP When unzipping files with gunzip, you''re not required to enter the file
    extension. `gunzip zipadeedoodah` would work just as well as gunzip zipadeedoodah.gz.


    > TIP You might encounter gzipped files with a .tgz (tarred, gzipped), tar.gz,
    or just .gz extension. It''ll handle any of those gracefully.


    > TIP Some systems don''t recognize the gzip command, so you might need to use
    `gunzip -d` to uncompress the files.


    > TIP If you have a compressed file that you know is text—oldfunnaysfromthenet.gz,
    for example—you can uncompress it (without deleting the original file) and view
    it with a single command: `gzcat oldfunnaysfromthenet | more`. Yes, that''s .gz
    (as in gzip) and cat (Chapter 1) concatenated together. Unix people are funny,
    eh?


    > TIP gunzip understands how to uncompress most (compressed) files, including
    those pressed with compress or .zip files from Windows systems.


    Code Listing 13.11 Use gunzip to uncompress zipped files.


    ```

    [unqx@LinuxMint compression]$ ls -l *.gz

    -rw-r--r-- 1 ejr users 53678 Jul 23 06:42 bigfile.gz

    -rw-r--r-- 1 ejr users 53678 Jul 23 10:16 bigfile.gz

    -rw-r--r-- 1 ejr users 239819 Jul 27 10:22 zipadeedoodah.tar

    [unqx@LinuxMint compression]$ gunzip zipadeedoodah.tar

    [unqx@LinuxMint compression]$ ls -l *\*

    -rw-r--r-- 1 ejr users 501760 Jul 27 10:22 zipadeedoodah.tar

    [unqx@LinuxMint compression]$ ls -l *.gz

    -rw-r--r-- 1 ejr users 53678 Jul 23 06:42 bigfile.gz

    -rw-r--r-- 1 ejr users 53678 Jul 23 10:16 bigfile.gz

    [unqx@LinuxMint compression]$

    ```'
