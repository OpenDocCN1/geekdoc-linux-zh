  md: '# Changing Files with awk


    While sed is line oriented and lets you fiddle with your heart''s content, awk
    is field oriented and is ideal for manipulating database or comma-delimited fields.
    For example, if you have an address book file, you can use awk to find and change
    information in fields you specify, in Listing 6.11. In the following steps, we''ll
    show you a sample of the things you can do using awk to modify; in this example,
    an address book file.


    To change files with awk:


    +   1. awk ''{ print $1 }'' address.book


    At the shell prompt, use awk ''{ print $1 }'' address.book to look at the address.book
    file and select (send to standard output) the first field in each record (line).
    More specifically, starting from the inside out


    +   - $1 references the first field in each line. Unless you specify otherwise,
    awk assumes that whitespace separates the fields, the first field starts at the
    beginning of the line and continues to the first space.


    +   - {} contain the awk command, and the quotes are necessary to tie the awk
    command together (so the first space within the command isn''t interpreted by
    the shell as the end of the command). See Code Listing 6.11.


    ```

    Listing 6.11 awk lets you access individual fields in a file.


    [unixvsqs@linuxmint Examples]$

    . awk ''{ print $1 }'' address.book

    Schmidt,

    Feldman,

    Brown,

    Smith,

    Jones,

    [unixvsqs@linuxmint Examples]$

    ```'
  merge: -1
