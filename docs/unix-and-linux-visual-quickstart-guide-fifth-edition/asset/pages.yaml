  md: '# Code Listing 1.1 Change your password regularly using the passwd command.


    # Changing Your Password with passwd


    ```

    $ passwd

    Changing password for ejr

    (current) Unix password:

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated

    successfully

    ```


    Virtually all Unix and Linux systems require passwords to help ensure your files
    and data remain your own and that the system itself is secure from hackers and
    crackers (malicious hackers). **Code Listing 1.1** shows how you change your password.


    Throughout your adventure, you''ll likely change your password often:


    +   - You''ll probably want to change the password provided by your system administrator
    after you log in for the first time. Hint, hint.


    +   - You''ll probably change your password at regular intervals. Many systems
    require that you change your password every often—every 30 or 60 days is common.


    +   - You might also change your password voluntarily if you think that someone
    might have learned it or if you tell anyone your password (although you really
    shouldn''t do that anyway).'
